    # 17.3.5 Data Reduction


    Data reduction techniques with ADIOS have shown to be effective in reducing the
    bottleneck on I/O during simulation writes. These techniques fit well with the
    minimal communication principle employed by ADIOS and its I/O. By applying compression
    routines locally on every process, encoding costs are effectively minimized. This
    enables compression techniques to take advantage of similarity in data values
    within each process, typically using spatio-temporal scientific datasets. For
    example, ISOBAR [12], in situ lossless compression routine to specific data, demonstrated
    up to a 46% reduction in storage on datasets from simulations spanning domains
    such as combustion (SBD), plasma (XGC1, GTS) and astrophysics (FLASH). This technique
    coupled with ADIOS and the addition of interleaving allowed throughput minimizes
    with the degree of data reduction.


    While checkpoint/restart data, such as particle data, must be compressed losslessly,
    datasets used for analysis and visualization, as field data, can be compressed
    in a lossy fashion. Unlike lossless compression techniques, such as wavelets-based
    compression (i.e., ISABELA [8]), etc. provide a multi-fold reduction in storage
    sizes, trading precision for reduction. Depending on the sensitivity of the analysis
    introduced introduced by compression, the end users can change the level of accuracy
    desired in the configuration file used by ADIOS. The configuration file can also
    instruct ADIOS to employ different compression routines for different variables
    and output groups (checkpoint/restart or analysis) without having to change the
    application code.


    # 17.3.6 Deployment


    ADIOS is an open-source software with a BSD license. It has been installed as
    central software and is supported by the Oak Ridge Leadership Facility, the iV
    organization in Western Australia for the purpose of supporting the Square-Kilometer
    Array project, by the High Level Support Team (HLST) supporting EFDA (European
    Fusion Development Agreement) sites, and by'
  merge: -1
  img_proc: true
- pgno: 253
  md: '# ADIOS


    the Engineer Research and Development Center of the U.S. Army Corps of Engineers.
    At other locations, application scientists install ADIOS themselves for their
    own applications. Many of those receive direct guidance from the ADIOS team to
    utilize their target system optimally.


    # 17.4 Conclusion


    ADIOS provides a scalable I/O library and has successfully improved the I/O performance
    of several large-scale applications. In general, it turns out that scientists
    are frequently limited by I/O performance, and they limit their output data accurately.
    As ADIOS provides better I/O performance, scientists are now able to write more
    data and thus gain more scientific insights during their analysis. With computing
    systems generating data at an ever-increasing rate, good I/O becomes harder to
    maintain. Approaches such as in situ data analysis and data reduction are becoming
    more mainstream. The researchers behind ADIOS are working on in situ and in-transit
    (or staging) processing capabilities with an easy-to-use API while maintaining
    the effectiveness of the ADIOS framework. However, one of the challenges of staging
    is that moving data around while the application is running interferes with the
    application''s own communication, and slows the application down. Therefore, the
    overhead of staging processing has to be carefully identified and analyzed. ADIOS
    is becoming a staging framework that provides solutions for low-overhead data
    transfers. ADIOS''s generic I/O API uses flexible programming that is portable
    to new computing systems. It is also flexible in switching from file-based-processing
    to in situ processing.


