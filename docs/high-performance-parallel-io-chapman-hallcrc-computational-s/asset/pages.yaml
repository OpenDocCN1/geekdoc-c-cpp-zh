    # 2.3 Workflows, Workloads, and Applications


    At the highest workflow levels, users tend to utilize the local scratch file system
    for job input and output. The local scratch file systems have the least contention
    for bandwidth and latency. However, if they are utilizing more than one computational
    system at the Center, they may make a trade-off for the higher capacity or cross-system
    availability generally offered by the NGF systems to improve overall time to completion.
    Generally, the parallel file systems at NERSC complete hundreds of terabytes of
    I/O throughout an average day at the facility. The active archive handles between
    50-100 TB of parallel I/O on a typical day, 30% of which are read operations from
    a combination of local scratch and NGF file systems. See Table 2.2 for information
    on the source and amount of data moving to and from the HPSS archive at NERSC.


    Data at NERSC falls into two main categories: simulation and experimental. For
    the past decade, simulation proved to be the most demanding on compute and storage
    resources at the Center. Recently, experimental data from high-powered instruments
    like the Large Hadron Collider or genomic sequences present new challenges to
    NERC’s data systems and services. Data can be regenerated by rerunning the simulation,
    but most experimental data cannot be regenerated due to cost or instrument constraints.
    JGI, a partner of NERSC since 2010, has been sequencing and analyzing over 50
    terabases⁴ worth of experimental data a year. The scale of their demands calls
    for a parallel file system, but their እንደሚ are a mix of parallel and I/O. The
    light sources and other experimental facilities are presenting significant challenges
    for storage as well. Instrument data rates are high and increasing rapidly, demanding
    very capable data acquisition systems that need to be local to the instrument
    to achieve success. NERSC provides


