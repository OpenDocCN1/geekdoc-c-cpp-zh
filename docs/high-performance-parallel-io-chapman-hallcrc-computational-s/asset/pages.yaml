- pgno: 308
  md: '# 22.2.5 Index Generation


    An aggregator in each global group is responsible for generating local indexes
    for each subfile and the aggregator in the first group ($P_0$) also generates
    indexes in the metadata file. This is done by performing a two-round of collective
    communications (using sub-communicator) among all processors in order to improve
    scalability. First, every rank builds indexes locally and sends its portion of
    the indexes to its aggregator. After the aggregator receives the data, it populates
    the data structures for the process groups (PG), variables and attributes. These
    are used to create the footer for the local file. All aggregators then send their
    indexes to the highest aggregator ($P_0$), which writes out a combined global
    metadata file for the entire cohort.


    # 22.2.6 Staged Read Method


    The subfilining technique can greatly improve write performance, however, it poses
    new challenges for reading data. Without carefully managing metadata operations
    as MPI_open() or POSIX open(), subset data can be very expensive, particularly
    for operations such as planar access. Suppose there are $M$ MPI processors and
    $N$ subfiles on disk each MPI rank need to read in an arbitrary plane from a multi-dimensional
    array, which be $M * N$ file simultaneously issued to Lustre metadata server,
    can be overwhelming. Figure 22.3 shows the metadata operation cost that the open()
    and close() time. It is clear that as the run is scaled up, the metadata cost
    increases quickly. For a typical S3D post-processing run, using a 2400-core post-processing
    job reads in data across subfiles dumbed out by a 96,000-core computation job.
    Depending on the access pattern, it may issue 4 million file opens. Each file
    open takes $0.5\,ms$, the metadata operation alone will take around 40 minutes.
    The staged read method aims to tackle the issue by performing staged file operations,
    in which only MPI processors open/close files. I/O chunking is another technique
    used here to achieve bulk reads, to MPI-IO, and details are discussed next.


    # 22.2.7 Staged Opens


    Staged opens two major advantages to read operations: They effectively alleviate
    the "large metadata/footer" problem mentioned early. Scientific simulations scale
    use and more analytical data, such as statistics and indexes will be eventually
    included in the future, metadata (such as header, footer) will continue to expand
    regardless of individual file formats. Loading the entire metadata section before
    any read/write operation is a common practice in many parallel I/O libraries.
    Therefore, as the metadata grows and cannot fit into the memory of a compute core,
    more advanced metadata management are needed. We can resolve this issue by adopting
    a lazy'
  merge: -1
  img_proc: true
- pgno: 309
  md: '# Scaling Up Parallel I/O in S3D to 100-K Cores with ADIOS


    ![](img/e2df60633eace5d7f248335c7c97063d_309_0.png)


