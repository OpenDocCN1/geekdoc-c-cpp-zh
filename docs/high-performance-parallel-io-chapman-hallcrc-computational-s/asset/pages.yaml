    # 11.5.3 Virtual Hot Spare


    Most traditional storage systems based on RAID require the provisioning of one
    or more "hot spare" drives to allow independent recovery of failed drives. The
    hot spare replaces the failed drive in a RAID set. If these hot spares are not
    replaced before more failures appear, the system risks a catastrophic data loss.
    OneFS avoids the use of hot spare, and simply borrows from the available free
    space in the system to recover from failures; this technique is called virtual
    hot spare. In doing so, OneFS allows the cluster to be fully self-healing, without
    human intervention. The administrator can create a virtual hot spare reserve,
    allowing for a guarantee that the system can self-heal despite ongoing writes
    by users.


    # 11.5.4 N + M Data Protection


    The Isilon cluster is designed to tolerate one or simultaneous component failures
    without preventing the cluster from serving data. The Isilon system can use either
    a Reed-Solomon error correction (N + M protection) system, or a mirroring system
    for files. Data protection is applied at the file level, and not the system level,
    enabling the system to recovering only those files that are compromised by a failure
    rather than having to check and repair the entire file. Metadata and inodes are
    protected at least the same level of protection as the data reference. Metadata
    and inodes are always protected by mirroring, rather than Reed-Solomon coding.


    Because all data, metadata, and parity information are distributed across the
    nodes of the cluster, the Isilon cluster does not require a dedicated parity node,
    or a dedicated device or set of devices to manage metadata. This ensures that
    no one node can become a single point of failure. All nodes share equally in the
    tasks to be performed, providing perfect symmetry and load balancing in a peer-to-peer
    architecture.


    The Isilon system provides several levels of configurable data protection settings,
    which can be modified at any time without needing to take the cluster or file
    offline.


    For a file with erased codes, each of its protection groups is protected at a
