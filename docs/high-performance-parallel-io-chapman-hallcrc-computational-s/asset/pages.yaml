    # 5.8 Conclusion


    The scientific mission of LLNL requires unique and cutting-edge computer systems.
    Deliverables require balanced I/O capability and an equally cutting-combination
    of file system hardware and software. Meeting requirements for BG/Q was a significant
    undertaking requiring a refactoring of file system internals for scalability.
    The undertaking was successful, but not without challenge. In particular, applications
    can make much easier by leveraging the strengths of the underlying system and
    avoiding known system weaknesses. The move from the present systems to Exascale
    systems will be even more daunting. Continued scaling of the file system will
    be difficult in part due to the disparity between the aggregate CPU performance
    vs bandwidth advances on spinning storage devices. Particular attention will need
    to be paid to the use of burst buffer (NVRAM) technologies to address bandwidth
    challenges. Also fundamental APIs will need to be reconsidered/refactored (POSIX).


