    # 6.3 Workloads and Applications


    6.3.1 Applications and Their Use of Storage

    Since one of the primary missions of LANL is science-based nuclear weapons stewardship,
    it is no surprise that the bulk of the computation done utilizing the HPC environments
    at LANL is in support of that mission. There are two basic categories of applications
    run at LANL. One category is single physics science, molecular dynamics and particle-in-cell
    materials or plasma-type codes, which are typically a few thousand lines of code
    and run at all scales. The second category is multiphysics integrated weapons
    applications, which are complicated multi-physics and multi-package applications
    that are often many million lines of code—run at all scales. The bulk of cycles
    at LANL are used by the large multi-physics codes providing science-based decision
    support for important nuclear weapon stockpile issues. Because of the integration
    of the weapons codes, LANL is more of a production-computing site and less of
    a computational science experimental site. Further, LANL is heavily engaged in
    validation and verification runs to quantify potential errors in calculations
    to assist the decision support nature of the science being done. Many of the capacity
    runs, ranging from 100 to 10,000 cores, are parameter sweeps to gain statistical
    validity for an ensemble of calculations to understand a weapon phenomenon. Typical
    large runs can be on 1/3 to 2/3 of the largest capacity machines, last for hours
    or days, but there can be thousands of these runs in a logical set of decision
    support calculations. Because LANL sees users from Los Alamos, Sandia, and Lawrence
    Livermore National Laboratories running weapons stewardship calculations. The
    number of large-cycle users is small, around 20-30 people. Also the number of
    codes is small, around 10-20 codes, but the bulk of the cycles are used by 4-5
    codes.'
