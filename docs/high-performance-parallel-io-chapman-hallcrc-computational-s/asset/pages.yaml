    While these questions can be addressed to some extent for smaller-2D and 3D simulations
    involving billions or trillions of particles, it is challenging to address these
    questions when the number of particles reach hundreds of billions or trillions.
    Hampered by the lack of scalable tools, physicists have largely ignored the particle
    data, used some form of sub-sampling, or relied on coarser gridded data for their
    analysis. The two-trillion-particle study was the first to offer flexible technical
    capabilities for analyzing trillion-particle datasets.


    # 19.3 I/O Challenges


    The main challenges with the trillion-particle VPIC simulation are managing the
    sheer volume of data. The VPIC simulation writes a significant amount of data
    at a user-specified interval. In the simulation of two trillion particles (including
    one trillion ions and one trillion electrons), three different datasets were stored:
    particle datasets, field and hydro datasets, and checkpoint datasets. The particle
    dataset for a given timestep comprises about one trillion electrons. The data
    size of each electron particle is 32 bytes, representing various properties. The
    number of particles increases as the simulation progresses. In our simulation,
    the datasets written in each timestep varied between 30 TB to 42 TB of data. The
    simulation wrote the particle dataset at 10 timesteps and the total particle data
    size was about 335 TB. The field dataset includes information about electric and
    magnetic field strength, and the particle dataset includes information about the
    particle''s position, momentum, and energy. The field timestep is relatively small,
    the total amount of data after finishing the simulation was approximately 490
    TB, including field data and checkpoint data. Another challenge discussed in Section
    19.3 explains a scalable strategy to store terabytes of data produced by a simulation
    running on hundreds of cores.


