    # Multi/Many Core


    Ramon Nou, Toni Cortes

    Barcelona Supercomputing Center


    Stelos Mavridis, Yannis Sfakianakis, and Angelos Bilas

    Foundation for Research and Technology—Hellas


    +   32.1 Introduction ................................................................................
    353

    32.2 Storage I/O at Present ...................................................................
    354

    32.3 Storage I/O in the Near Future ................................................
    355

    32.4 Challenges and Solutions .......................................................
    356

    32.4.1 NUMA Effects .....................................................................
    356

    32.4.2 Improving I/O Caching Efficiency ......................................
    357

    32.4.3 Dynamic I/O Scheduler Selection ............................... 359

