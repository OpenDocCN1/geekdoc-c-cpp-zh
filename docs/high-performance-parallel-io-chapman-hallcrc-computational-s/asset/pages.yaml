- pgno: 154
  md: '# High Performance Parallel I/O


    that readers always the most recent updates. Furthermore, it provides proper failure
    semantics as it prevents updates on other nodes from suddenly disappearing the
    node that last updated an object.


    GPFS uses byte-range locks rather than whole-file locks to synchronize reads and
    writes to file data. These locks allow concurrent access to the same file from
    multiple nodes. The underlying byte-range tokens are negotiated dynamically based
    on the access pattern, as explained in detail by Schmuck et al. [10]. In the absence
    of concurrent writing, a byte-range token covering the whole file can be obtained
    in a single interaction with the token server for that file, and is therefore
    just as efficient as whole-file locking. Under concurrent writing, additional
    messages are required, but in a common case, where multiple nodes are writing
    sequentially to non-overlapping sections of the same file, all nodes can acquire
    the necessary tokens in a single round of token revokes their first write to the
    file. Subsequent writes proceed without additional overhead for distributed locking.


    For finer-grained sharing, such traffic becomes more significant; as interleaved
    strided writes from multiple nodes, or if granularity drops below the disk sector
    size, lock conflicts due to false sharing are unavoidable. Therefore, applications
    that require fine-grain sharing typically use MPI-IO, or similar application-level
    I/O library, to divide a file into a collection of large ranges, collect small
    updates to a single node, and then those large ranges to the file system.


    For database applications that do their own locking and buffering, GPFS supports
    direct-I/O mode, where read and write operations bypass distributed locking and
    caching in the file system. This allows database workloads to run at raw disk
    speeds.


    # 9.2.2 Metadata Management


    Like other file systems, GPFS uses indices and indirect blocks to record file
    attributes and data block addresses. Multiple nodes writing to the same file result
    in indirect block updates to store the addresses of newly allocated data blocks
    and concurrent node updates to record changes to file size and modification time
    (mtime). Synchronizing these updates via exclusive write locks would result in
    a conflict on every write operation. Instead, one of the nodes accessing the file
    is designated as the metode for the file, which is responsible for collecting
    indirect block updates and merging updates from other nodes and periodically writing
    to disk.


    To guarantee POSIX semantics in the presence of read/write sharing, write operations
    in GPFS use a shared-write lock on the inode, which allows concurrent file size
    and timestamp updates, but conflicts with operations that require exact file size
    and/or mtime. A stat() system call or a read operation that attempts to read past
    end-of-file, for example, revokes tokens from writers, prompting them to send
    their updates to the metode. This guarantees that the reader is to obtain accurate
    file size and mtime from'
