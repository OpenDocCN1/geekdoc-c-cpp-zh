- pgno: 303
  md: '# Scaling Up Parallel I/O in S3D to 100-K Cores with ADIOS


    organization for serial programs where the entire dataset is contained within
    a single process. However, for parallel programs, datasets (e.g., multi-dimensional
    array) are likely scattered across multiple processors. In order to make data
    logically contiguous on, extensive communication must occur among MPI processors
    to aggregate data chunks on a single process or to exchange offsets to enable
    collective, non-overlapping writes. As scientific codes are scaled up, many "all-to-one"
    or "all-to-all" collectives will be a significant performance bottleneck. Meanwhile,
    simulations do calculations and I/O in an iterative manner (i.e., for timesteps).
    For a contiguous file format, appending to an existing dataset can be a very costly
    operation. It requires heavy data shuffling on disk and the rewriting of substantial
    file metadata.


    # 2.2.1 ADIOS-BP


    Keeping these limitations in mind, we designed ADIOS-BP, which adopts an alternative
    approach, i.e., a non-contiguous, log-based file format. Choosing the format to
    be non-contiguous allows BP to scale well to hundreds of thousands of cores. There
    are two main factors that benefit the performance advantage of this format. First,
    the noncontiguity allows each MPI processor to perform I/O in a more independent
    fashion, significantly reducing (if not eliminating) collective communications.
    Each processor outputs its local buffer, with header information such as indices
    and data dimensionality, independently to a file. It completes the MPI communication
    step that two-phase I/O involves to make data appear contiguous on disk. In a
    non-contiguous file format like ADIOS-BP, "all-to-one" data shuffling is not required.
    Additionally, noncontiguity makes file system lock contention much easier to resolve,
    particularly when the subtle technique is applied. The key elements are briefly
    explained in the ADIOS-BP file format:


    +   - Process Group: The major concepts in ADIOS-BP format are "process group"
    or PG. The ADIOS-BP file format consists of series of PG entries and the ADIOS-BP
    footer, see Figure 22. Each process group is the entire self-contained output
    from a single process and is written independently into a contiguous disk.


    +   - Footer: One limitation of the NetCDF4 format is that the contents are stored
    in a header that is big enough for the information provided at file creation.
    Any changes to the length of data will require moving data. To avoid this cost,
    a footer is employed instead. The version identifier and the offset are placed
    at the beginning of the index as the last few bytes of the file, making it simple
    to find the index information and to add new different data to the file without
    affecting any data already written. The variable''s index table is composed of
    the total count of variables in the ADIOS-BP file, the size of the variable''s
    index table, and a list of variable records. Each record'
  merge: -1
  img_proc: true
- pgno: 304
  md: 'contains the size of the record and the basic metadata to describe the variable.
    The metadata include the name of the variable, the name of the group variable
    is associated with, the data type of the variable, and a series of characteristic
    features. More details can be found in the ADIOS manual [5].


    # 22.2.2 Staged Write Method


    The idea behind the staged write method is to first, perform bulk writes as large
    as we can, using aggressive buffering and aggregation strategy. This is done by
    aggregating data from two levels: within a single processor and a subset of processors
    (i.e., group). Second, further eliminate contentions in the file system and MPI
    collective communication. The aggregated data will be written out in multiple
    subfiles, with each group outputting one file. Each subfile is striped on a single
    storage target and therefore writes can be done independently from other groups.
    The design specifies are highlighted next.


    # 22.2.3 Group-Based Hierarchical I/O Control


    The group-based hierarchical I/O control scheme, sees Figure 22.1, divides all
    MPI processors into sub-groups based upon individual MPI rank, to avoid the overhead
    of doing MPI collective among all processors. Suppose an MPI process can be denoted
    as $P_i$ where $0 \le i < N$ and $N$ is the total number of MPI processors. The
    number of subfiles that we are going to generate is $M$, and without loss generality,
    we also assume $N$ is a multiple of $M$. Therefore, the number of processes that
    each group contains is $N/M$ and hence, for group $G_i$, the processes that it
    contains is $[P_{iM}, P_{(i+1)M-1}]$. Each group is assigned a group coordinator
    (i.e., aggregator), which is responsible for managing data from all members in
    the group $G_i$ and writing to disk. It also serves to collect an index from its
    members during index generation. Not only that aggregator processor in each group
    writes to the file system, significantly reducing the writing contents. Similarly,
    a metadata file which describes the entire datasets are scattered across all subfiles,
    a global coordinator will be chosen, e.g., $P_0$. Note that more complex election
    algorithms can be adopted here to balance load across all processes and is left
    for future study. All processes within $G_i$ write to a single subfile, completely
    avoiding interference from other groups. Overall group-based I/O control is designed
    to eliminate bottlenecks and therefore achieve scalability. The number of groups
    is specified as an external parameter in ADIOS XML file. By and large, the selection
    of the number is a tradeoff between (1) aggregation (subject to memory constraints)
    and (2) utilization of many storage targets as to improve concurrency.'
  merge: -1
  img_proc: true
