- pgno: 27
  md: '# Foreword


    In the age of increasing emphasis on “big data” the topic of high performance
    parallel I/O should be amply covered in the literature. After all, what is the
    point of all the discussion of the ever increasing deluge of data without an understanding
    of how all the data are read and written quickly and efficiently? Yet, curiously
    a search on books on parallel I/O reveals that more a decade has passed since
    any attempt has been made to summarize the state of our high performance parallel
    I/O in the form of book for the High Performance Computing (HPC) community.


    Prhabat and Quincey have made a significant accomplishment by editing this book
    on “High Performance Parallel I/O”. This book is indeed remarkable since there
    has been so much progress in technology, software, and tools for parallel I/O
    in the last decade, but documenting this progress has been notably absent. I/O
    is often the bottleneck to achieving the best possible performance in HPC, but
    its treatment and discussion are quite frequent secondary to the discussion of
    CPU performance. The authors have set out to address this deficiency, and succeeded
    admirably. Their text provide a useful overview of an area of rapid development
    that is currently not represented in any.


    An important distinction of the current book is that it has been edited by practitioners
    in the field. Both editors and the chapter authors have been involved hands-on
    in developing software for parallel I/O as well as porting and optimizing scientific
    applications on large scale parallel I/O system. This practical experience has
    led the editors to direct their selection of topics for the book towards a highly
    usable set of themes for the individual book sections: an overview of parallel
    I/O system as currently implemented in leading HPC centers, a survey of file systems
    and I/O libraries in current, and a selection of tools for parallel I/O. The individual
    chapters are contributed by the leading experts in the field. This book will be
    a handy reference for applications developer as well as for computer managers,
    who want to know about the state-of-art in parallel I/O.


    In the last twenty years high performance computing has seen many dramatic developments.
    In the early 1990s computing technology made a dramatic transition to MPPs using
    commodity hardware and the MPI programming model. This transition and the new
    parallel model for HPC solidified in the early 2000s. Essentially this model has
    remained the same until now, while'
  merge: -1
  img_proc: true
- pgno: 28
  md: '# Foreword


    at the same increasing performance by a factor of one million from the

    Gigaflops to the Petaflops level. Today we were close to yet another transformation
    of the HPC field as GPUs and accelerators become integrated, while

    t amount of parallelism seems to be ever increasing and the field is moving

    towards Exafflops level performance.


    In this context of a potential rapid transformation of the high performance

    computing field, the book by Prabhat and Koziol arrives at exactly the right

    time. It succeeds perfectly and for the first time provides a survey of the significant
    deacomplishments in file systems, libraries, and tools that have been

    developed for about a decade. These developments have now reached a state of

    relative maturity, and are ripe for a treatment in book format. Simultaneously

    t editors combine their technology and software survey with significant application
    examples in a single volume. In the last set of chapters

    the book previews the I/O challenges in the Exaflops era. Thus the book will

    provide a solid foundation for anyone who is considering using the most recent
    tools for developing and and be prepared for future Exascale platforms. I highly
    recommend this timely book

    for computational scientists and engineers.


    Horst D. Simon


    Lawrence Berkeley National Laboratory


    Berkeley, September 2014'
  merge: -1
  img_proc: true
- pgno: 29
  md: '# Preface


    Parallel I/O is an integral component of modern high performance computing (HPC).
    Petascale-class simulations routinely produce terabyte to petabyte-sized datasets,
    which need need to be stored efficiently. Data-centric analysis and visualization
    tools rely on efficient reads to ingest and process large datasets. Both write
    and read operations are critical for facilitating scientific discovery


    This book captures the state of the art in high performance parallel I/O in the
    2013-2014 timeframe. We have drawn upon insights from leading-practitioners, researchers,
    software architects, developers, and scientists. This rich tapestry of contributions
    from experts shed light on the parallel I/O ecosystem.


    The book is organized in six parts. Part I is intended to give readers a window
    into how large-scale HPC facilities configure, and operate systems, with a special
    emphasis on choices of I/O hardware, middleware, and applications. Readers lead
    experts from the National Energy Research Scientific Computing Center (NERSC),
    National Center for Supercomputing Applications Argonne Leadership Computing Facility
    (ALCF), Livermore Computing Center, and Texas Advanced Computing Center (TACC)
    sharing their perspectives in this part of the book.


    Following this, the book traverses the I/O stack. In Part II, we deal with the
    file system layer. Leading designers and architects share their insights on the
    design, architecture, and application of the most prominent file systems in practice:
    Lustre, GPFS, OrangeFS, and OneFS. Moving further up the I/O stack in Part III,
    we review middleware (as MPI and PLFS), and user-facing libraries (as Parallel-NetCDF,
    HDF5, ADIOS and GLEAN). These chapters give insight into decisions made by library
    developers, library features, and applications.


    Part IV of the book deals with real-world scientific applications that utilize
    the parallel I/O infrastructure. Application and library developers present case
    studies from particle-in-cell, stochastic, finite volume, and direct numerical
    simulations. Careful profiling and optimization are essential for obtaining peak
    (and sustained) parallel I/O performance. Part V of the book presents an overview
    of profiling and benchmarking tools used by practitioners in the field. Finally,
    the world of HPC is in flux. Part VI of the book discusses implications of current
    trends in HPC on parallel I/O in the exascale world.'
  merge: -1
  img_proc: true
