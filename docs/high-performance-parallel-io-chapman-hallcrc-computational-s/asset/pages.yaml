  md: '# High Performance Parallel I/O


    ![](img/e2df60633eace5d7f248335c7c97063d_310_0.png)


    FIGURE 22.4: S3D read performance scaling. Asynchronous read demonstrates much
    better performance than synchronous reads as application scales up. Higher aggregation
    ratio also demonstrates better performance.


    processor. Next, the aggregator processor parses the received message and then
    sorts all requests by their address (i.e., file idx and offset). file idx is the
    subfile ID and offset is the file offset within a subfile. If a set of requests
    fall into a window of certain size (e.g., 64 MB), a single read that accommodates
    the entire request set will be issued to the file system. The aggregator extracts
    the portion that was requested and sends it back to its member via MPI messaging.
    The staged read performance is shown in Figure 22.4. We see the staged read (i.e.,
    asynchronous read) outperforms synchronous read substantially, about 3-5 times
    at 96,000-cores. At low counts, the three techniques achieve largely the same
    performance due to the relatively high cost of staged read.


    # 22.2.9 Limitations


    Staged read is essentially a type of "delayed read" technique, in which memory
    buffers are passed into the adios.read_var() call become valid only after file
    close, the adios.fclose() call. This will restrict the technique from being used
    in applications where a few variables must first be read before others, for example,
    sizing/dimension data. Luckily, in ADIOS-BP, we store the scalar values directly
    in metadata and their values are available immediately after file open, avoiding
    the problems to some degree. Another disadvantage is that chunk reading might
    increase the overhead in'
  merge: -1
  img_proc: true
- pgno: 311
  md: '# Scaling Up Parallel I/O in S3D to 100-K Cores with ADIOS


    some cases since there is junk data that must be read in along with requested
    data. In future storage systems with SSDs (solid-state drive) where disk seek
    is inexpensive, this staged read approach might not be the best solution and this
    is left for future study.


    # 22.3 Conclusion


    S3D offers a challenging I/O problem at scale, a problem that ADIOS is able to
    tackle in a compelling and usable manner. The obstacles faced in scaling up I/O
    performance for S3D are general obstacles that many applications will face. By
    combining aggregation, subfiling, and chunking techniques, ADIOS provides a solution
    that can be generalized for any I/O problems. The comparison of the N-M I/O pattern
    to N-1 and N patterns provides a higher-level view of the file system limitations
    in current platforms.


    The key advantages of staged I/O are three-fold. First, it aggregates small I/O
    accesses into large chunks and hence minimizes seek operations. By allowing only
    a subset of MPI processors to perform I/O operations to the storage system, it
    avoids lock contention for writing. On the other hand, it significantly reduces
    the cost of metadata operations such file open and close for reading and memory
    consumption. This scheme is implemented as a stand-alone I/O method inside the
    ADIOS framework so that existing ADIOS applications can benefit from without source
    change.


    This approach underlies the philosophy of the ADIOS platform. The service-based
    approach of ADIOS allows the development of new techniques and methods that can
    be easily shared with the I/O community at large, providing new insights into
    I/O performance for a vast variety of applications.


