    # 17.3.2 Analysis


    **Seismography.** Recent advances in high performance computing and numerical
    techniques have facilitated full 3D simulations of global seismic wave propagation
    at high resolutions. The spectral-element method (SEM) described by Trom et al.
    [15] has recently gained popularity in seismology and now SEM is widely used for
    3D global simulations. The Theoretical & Computational Seismology research group
    at Princeton University has developed the open-source package SPECFEM3D_GLOBE;
    set by Carrington et al. [3]. Their goal is to improve the models of Earth''s
    subsurface and kinematic representations of earthquakes.


    There are around 6000 earthquakes recorded of date, with several seismograms available
    for earthquake. About 50 iterations of a processing pipeline for each earthquake
    will be needed to achieve a highly accurate subsurface model of the whole Earth.
    In the pipeline, thousands of seismograms (both observed and synthetic ones) are
    produced at each step for each earthquake while several earthquakes are processed
    currently. Observational data is provided by the IRIS (Incorporated Research Institutions
    for Seismology) organization but it has to be processed (cleaned and aligned)
    for the comparative analysis with the synthetic datasets. The current standard
    data format is a separate binary file for each seismogram, resulting in millions
    of small input files and multiples of that of files the largest file systems cannot
    provide access to this many with reasonable performance. Therefore, a new seismography
    data format has been developed that stores all seismograms of an earthquake in
    a single ADIOS file, which provides access to all of them while reducing the total
    number of files by orders of magnitude. This change also allows the processing
    pipeline to execute on Titan, a supercomputer at Oak Ridge Leadership Facility,
    using the allocated time efficiently. Previously, the processing pipeline was
    stalled by waiting on the reads and writes of small files.


    **Climate research.** Climate modeling applications address one of the most pressing
    issues faced by our society. Numerous surveys show increasing trends in the average
    sea-surface and air temperatures. A promising method of predicting the future
    effects of climate change is to run large-scale simulations of the global climate
    many years into the future. In such simulations, climatologists discretize our
    entire globe, setting up differential equations to model'
