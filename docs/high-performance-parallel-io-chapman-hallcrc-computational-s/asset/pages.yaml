  md: 'It became painfully understood that complex natural phenomena cannot be modeled
    so easily, common cause variation being one of the reasons. Models can be improved
    by neglecting variation renders the correlation to physical findings arbitrary.
    Hence, the industry is now at a point where it begins to embrace the concept of
    stochastic simulation: a single simulation is no longer adequate, but a number
    of well-designed simulations are needed to capture the behavior of the physical
    process rather than a single realization.


    # 20.2 Science Use Case


    Stochastic simulations call for the computation of several realizations of a process
    and then processing the results in extract conclusions about the relationship
    of input and output, and based on different levels of assumptions, about process
    performance and robustness as well as higher-level modeling. This section is concerned
    with the particular application of stochastic simulations the automotive industry.
    Automotive stamping is the process of forming flat sheets of material (usually
    steel or aluminum) into car body parts using a hydraulic press. The flat sheet
    is cut in blanks, and clamped against dies that are milled to represent the desired
    shape. This is usually a cold process; however, recently there is increased application
    of hot forming.


    The process is highly influenced by variation of material properties, blank geometry
    and position, thickness, rolling angle, forces exerted by the process, shape and
    strength of the clamping arrangements, trifling aspects, at least those that may
    be controlled in practice. Varying such parameters, in fact encoding the stochastic
    understanding of these variables, the stochastic simulation yields valuable information
    on the behavior of the production process.


    However, a stochastic simulation is also used to model the design process. Instead
    of an iterative design, based on successive changes and trial and error, the designer
    of the dies may use stochastic simulations to encode her understanding of the
    design process variables. In such a case, the number of variables and possibilities
    is infinite. The designer may choose to vary every single geometric detail she
    thinks might affect performance against the set of criteria that assist the decision
    making when a tool is ready to be released for milling. Clearly, the number of
    simulations the automotive engineer needs to perform has now multiplied. Not only
    does she need to assess the performance of the dies in production, but also perform
    stochastic simulations to take decisions on the design of the dies. More than
    one stochastic simulation is therefore needed for many processes, while a single
