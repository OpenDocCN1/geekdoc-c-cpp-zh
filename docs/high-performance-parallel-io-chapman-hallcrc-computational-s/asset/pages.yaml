- pgno: 387
  md: '# # Chapter 31


    # ## Resilience


    Gary Grider and Nathan DeBardeleben

    Los Alamos National Laboratory


    +   31.1 Present ................................................................................
    346

    31.1.1 Getting the Correct Answer ...........................................................
    347

    31.2 Future ................................................................................................
    348

    31.3 Conclusion ..........................................................................................
    350

    Bibliography ............................................................................................
    351


    The term “resilience” has become an overarching term that describes the reliability
    of both software and hardware in the high performance computing field. Resilience
    came about, during a philosophical shift away from merely tolerating faults and
    toward being able to ride through failure. While there are certainly examples
    of resilience, particularly in hardware, there are relatively few examples of
    true resilience at higher levels of the software/hardware stack.


    For many reasons, resilience is a key challenge for future supercomputing systems.
    System reliability is intricately tied to the scale of hardware and software components.
    Reliability has become a bigger problem as systems scale to use petascale and
    exascale, and the predicted component counts for systems of the future will only
    exacerbate this issue. Secondly, performance, power, and reliability are interrelated
    and while strict requirements are being set for performance (i.e., “exaflop”)
    and power (i.e., 20 MW), reliability requirements are somewhat constrained. Furthermore,
    decreases in supply voltage with a decrease in reliability [9].


    While current supercomputers almost exclusively address reliability through some
    form of checkpointing, there is concern that future HPC systems will need more
    elaborate tools to achieve resilience. However, rather than force system reliability
    to some unachievable goal, there remains hope for moving from the current systems
    that still tolerate faults to those that are truly resilient to failure.'
  merge: -1
  img_proc: true
- pgno: 388
  md: '# High Performance Parallel I/O


    # 31.1 Present


    Application fault tolerance on today''s systems is almost exclusively handled
    through defensive I/O checkpointing. Checkpointing (also discussed in Chapters
    19 and 23) is by and large the only reliable (albeit expensive) means of recovering
    from application interrupts.


    For the most part, applications that run on current supercomputers are unable
    to handle any failure of any of the components used by that application. This
    means that an application running across 10,000 nodes of a supercomputer will
    inevitably fail when one node experiences an unrecoverable memory error. Imagine
    if your car broke down every time it hits a pot hole! That is today''s applications
    are like.


    Obviously there are exceptions to this extreme brittleness. While there are certainly
    interesting and promising research approaches to move the field beyond this mine
    of computation, they have yet to gain traction to widespread deployment. These
    techniques range from new programming languages, models, and paradigms to hardware-assisted
    fault avoidance and recovery.


    HPC systems are almost exclusively built out of commodity components. Systems
    will have small portions that are proprietary: a commodity compute node, an ultra-high-speed
    network, a co-processor, etc. However, by large, the systems are assembled out
    of the same components that are used by consumers at home with slight improvements.
    One example of such an improvement is server-grade dual in-line memory modules,
    or DIMMs (with advanced error protection).


    As individual system components are designed to be reliable for a consumer, each
    piece is expected to last around five years. However, when you take hundreds of
    thousands of parts and assemble them together into a world-class supercomputer
    with requirements that the system be stable and compute accurately, problems are
    arise.


    Large-scale supercomputing centers are usually somewhat shy about failure rates,
    but on the largest supercomputers of today, the mean time between failure (AMBF)
    is on the order of 8-24 hours. This means that an application running across the
    entire machine will see an interrupt several times a day unless it can ride through
    failure. As aforementioned, today''s applications largely cannot do so, and hence
    checkpointing to prepare for this impending failure becomes imperative.


    There are a myriad of metrics around supercomputer reliability (MTBF, system MTBF,
    application MTBF, mean time to repair, etc.). While the HPC resilience community
    has released definitions of these terms before [1, 10], not everyone is in full
    agreement. As such, not everyone measures these metrics the same way and it can
    be difficult to compare numbers from different data centers.'
  merge: -1
  img_proc: true
- pgno: 389
  md: '# Resilience


    # 31.1.1 Getting the Correct Answer


    When people talk about supercomputer reliability they have, historically, almost
    exclusively focus of faults that cause detectable errors. Examples include a node
    crashing due to an unrecoverable memory error, a crash of a software middleware
    or hardware driver, a power glitch that causes a machine to halt, or an unreachable
    file system (for whatever reason) when an application tries to use it. Each of
    these examples have detectable signatures that cause a change in the application.
    In most cases, this simply causes the application to fail, and data needs to be
    recovered from a recent checkpoint.


    These are not the only types of faults on systems. Indeed, there are faults that
    make undetectable changes to a computation. Like all faults, these can be transient,
    intermittent, or permanent. Transient faults are usually caused by environmental
    factors, such as cosmic radiation and alpha particles emitted by radioactive impurities
    in the electronics packaging. Intermittent faults are often the effect of temperature
    or voltage extremes and variations. These effects can sometimes grow into permanent
    failures.


    All of these can and do computing hardware incorrectly. In the case of data storage,
    particularly in memory (main memory, caches, registers, etc.), most supercomputers
    employ advanced error correction codes. These codes can identify and correct a
    large number of these errors. However, as the amount of memory on supercomputers
    has grown, so the required complexity of these error correction codes such that
    a non-negligible amount of energy is expended to ensure correctness. Still, some
    data corruption will slip past these codes and the extreme scale of today''s systems
    continues to make increasingly likely. Additionally, it is possible that computational
    logic can corrupt results.


    Supercomputers are used in a wide range of application spaces. While applications
    undoubtedly require different levels of precision, it is important to understand
    that supercomputers (and indeed, all computers) cannot be viewed as entirely reliable
    digital machines. Instead, users must check the integrity of their calculations
    in as many ways as possible.


    One way that is gaining in popularity is algorithm-based fault-tolerance (ABFT).
    This technique embraces fundamental algorithmic changes that allow an application
    to check for correctness and recover corrupted data. Examples of this are few
    and far between and due to the nature of ABFT, there is little that can be generalized
    across different classes of applications. As such, ABFT may find only in a portion
    of supercomputing application fields while others require some special techniques.


    Luckily, on current systems, data corruption appears to be rare. The very nature
    of the faults being undetectable is it likely that the HPC community does not
    have an accurate understanding of data corruption rates.


    The fundamental reason the HPC community is not seeing complex and innovative
    systems for dynamically adapting to failures is that the problem'
  merge: -1
  img_proc: true
- pgno: 390
  md: '# 31.2 Future


    has not, to date, been enough to warrant serious investment in resilience, although
    this may be changing in the near future.


    Several reports [2, 7, 12] state the increasing need for resilient, high performance
    computing systems as HPC continues to strive for larger and larger supercomputer
    deployments. Different groups of leaders in the HPC resilience field have issued
    reports [6, 5, 8, 11, 3] on the challenges, opportunities, and suggested approaches
    to build a reliable supercomputer in the exascale timeframe.


    As component counts of systems continue to grow to staggering numbers, so do the
    reliability concerns. Leadership-class supercomputers in the 2020 timeframe are
    likely to contain between 32 and 100 petabytes of main memory, a 100x to 350x
    increase compared to the 2012 levels [2]. If implemented in DRAM, the amount of
    DIMMs on a machine of this scale will make failure rates (due to both hard and
    soft faults) extremely challenging. Similar increases are expected in the amount
    of cache memory (SRAM) on future systems.


    Several studies [2, 12], suggest that without aggressive engineering, crude projections
    show that any exascalecomputer will have a failure every 10–50 minutes. Clearly,
    saving a checkpoint for an application at scale, consuming much of the supercomputer''s
    main memory, is a serious challenge in tens of minutes timeframe. Engineering
    approaches are certainly possible, however they are likely to be costly and it
    is unlikely to align well with commodity desktop or server demands. Therefore,
    there is great potential for innovative approaches to resilience in this timeframe
    so that the HPC community is not forced to pay for fault-hardened expensive hardware.


    Figure 31.1 shows a prediction of different types of errors and how they will
    increase as the process technology scales [5]. In particular, this shows that
    the amount of soft-error-related faults in the logic gates is predicted to rise.
    Although not included in this figure, there is also a great degree of uncertainty
    about the aging effects in new process technology.


    Additionally, as the industry continues to drive down power usage by moving voltage,
    it is expected that power-related error rates will also rise. Figure 31.2 shows
    that, historically, as process technology has scaled downward, each new generation
    has become less susceptible to soft errors when voltage was also scaled downward
    [9]. Even though this trend is promising, there appears to be at least *some*
    effect from voltage scaling and what will probably continue.


    To ensure correct operation, all circuits should operate within their specific
    environmental envelope at all times, over the operational life of the machine.'
