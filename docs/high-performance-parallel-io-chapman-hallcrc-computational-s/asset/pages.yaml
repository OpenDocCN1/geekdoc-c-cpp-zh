    One approach to resolve this problem is to colocate threads and buffers used for
    I/O. However, policies used should not interfere with the CPU’s scheduler policy
    to spread active threads over all server resources. Current system software locks
    mechanisms and policies to achieve this goal in the I/O path transparency.


    As a proof-of-concept, the I/O path redesign using custom Linux modules addresses
    the NUMA effects. A custom file system provides hints to the CPU scheduler, and
    a DRAM cache creates separate memory pools to caching I/O. The file system and
    the cache assign CPU cores and buffers from a single socket to application threads.
    Figures 32.2 and 32.3 show that custom I/O stacks are improve I/O throughput up
    to 84% for random reads, 118% for random writes, 167% for sequential reads, and
    123% for sequential writes.


    # ## 32.4.2 Improving I/O Caching Efficiency


    Given the rate of data growth, modern applications tend to access larger amounts
    of persistent storage. Therefore, the efficiency of I/O caching is'
