    # **2.2.4 Archival Storage


    For long-term storage covering all the above file systems, the Center provides
    High Performance Storage Systems (HPSS) [4]. These are hierarchical storage management
    (HSM) systems that provide high-bandwidth user access through a disk cache. The
    HPSS system migrates data to enterprise tape devices—the best medium for long-term
    storage. The Center has found compared costs of operating disk data, and found
    to be reliable, as it does not require power to retain user data, and also protection
    against undesired data destruction because it is independent of other systems
    and nearline storage. Designing the archive systems to 10% of the file system''s
    bandwidth works well for retaining the data that requires long term retention.
    HPSS enables parallel I/O by stripping a single file across multiple disk and
    tape devices. This is key to HPSS''s ability to scale both capacity and bandwidth
    over the years to handle file system demand.


    One unique aspect of NERSC is its ability to back up such a high volume of data
    in its NGF file systems for restoration on user demand. The user restores requested
    every other week on average.'
