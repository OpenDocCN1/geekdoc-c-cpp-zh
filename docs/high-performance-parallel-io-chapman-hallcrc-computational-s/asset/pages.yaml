    # 7.2 I/O Hardware


    The parallel file system components on Stampede are built from 76 individual DCS8200
    commodity storage servers, each with sixty-four 3-TB drives across six individual
    RAID devices. The RAID sets are set up in an (8+2) RAID 6 configuration using
    standard Linux software tools with wandering spheres defined. Note although standard
    software is used to manage the underlying devices, the ext4 journals are purposely
    separated from the raw storage target, and the journals are mirrored on RAID 1
    partitions. This is a common approach using this of storage architecture and helps
    to increase file system performance.


    To aggregate the storage hardware, the Lustre file system [1] is used to provide
    three parallel file systems that are system-wide (HOME, WORK, and SCRATCH). The
    largest and most capable of these file systems is SCRATCH, which is supported
    by 58 of the tek servers. With six RAID devices defined per server, this equates
    to a total of 348 OSTs defined within Lustre for SCRATCH, resulting in a total
    of 74 PB of user-addressable storage. The adoption of multiple parallel file systems
    is common TACC HPC system deployments and is designed to provide users with tiered
    storage alternatives that vary in size, performance, and longevity. A general
    purpose compute cluster must support thousands of users during their operational
    lifespan, indeed, more than 2,400 individual users run jobs during the first seven
    months of operation. Consequently, fairly modest quotas were implemented for the
    HOME and WORK file systems. The user quota limits and associated target usage
    modes for each file system are presented in Figure 7.1.


    An important step in the deployment of a production file system is the completion
    of a burn-in process for all of the drives, which support the file system. In
    Stampede''s case, there are over 4,800 drives installed in the OSSs and the peak
    global file system performance is contingent on ensuring consistent performance
    across all of the drives. The file burn-in process on Stampede was carried out
    over the course of one month (in tandem with the compute-hardware deployment)
    and was performed in a two-step process. First, low-level I/O tests were performed
    to every disk sector on each drive in the OSSs for multiple 24-hour periods and
    were used to identify and replace slow performers along drives'
