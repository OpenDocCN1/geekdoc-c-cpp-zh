    any filename, the client sends the MDS an RPC to get a lock on the parent directory.
    This request will either be a read lock with a lookup intent, or a write lock
    with a *create* intent, and includes the filename to be resolved. For creates,
    the request will also contain a client-generated FID for the new. Resolving the
    intent on the MDS allows it to avoid contention on the directory lock.


    The MDS will resolve the lock intent locally, and return a DLM lock on the new
    or existing child object to the client, with all of the metadata attributes and
    layout (if a regular file). If the file was newly created, the MDS will allocate
    OST objects for the file layout at open time so that no further communication
    is needed with the MDS during I/O.


