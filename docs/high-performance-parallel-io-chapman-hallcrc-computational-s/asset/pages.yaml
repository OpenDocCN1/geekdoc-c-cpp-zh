    The Center''s computing resources are currently deployed at a multipetflop scale.
    The two largest systems, Hopper and Edison, together have over 250,000 cores,
    50 TB of memory, and 3.5 PFLOPS of computational capability. These systems offer
    users the highest concurrency and are used at full scale.


    NERSC has several data-centric or mid-range computing systems that continue serve
    users'' needs. The primary data-centric systems are PDF and Genepool. They serve
    the high-energy and nuclear physics community, and the Joint Genome Institute,2.
    The primary mid-range system is Carver which serves the broader NERSC user community.
