  md: '# I/O Libraries: Past, Present and Future


    ity of Parallel-NetCDF brings enormous computational resources to a huge population
    of scientists who would rather not be bothered with the details of MPI-IO or any
    other I/O middleware. Furthermore, Parallel-NetCDF provides additional capabilities
    that users can grow into as they become comfortable with their parallel computing
    environments.


    HDF5 is similar to Parallel-NetCDF in that it is a general-purpose technology
    for managing scientific and engineering data, and it provides a container for
    distributing data. Its biggest difference, in the context of this book, is that
    it was designed from the start to perform well on high-end systems. Most notable
    in this regard is the ability of the HDF5 format to store and access data of virtually
    any size efficiently, and the existence of a software layer in the HDF5 library
    permits I/O drivers to be written for new I/O modalities. The generality of HDF5
    also allows applications to include special data structures, those indexed by
    FastQuery, that can greatly improve accessibility of data.


    ADIOS has many of the capabilities we''ve already seen, but especially matching
    the data and I/O requirements of an application on a given system with the underlying
    capabilities of a variety of file systems. The ADIOS API handles and exploits
    the capabilities of POSIX, MPI-IO, Lustre,Spaces and others. ADIOS pays particular
    attention to scalability, supporting aggregation into a single file or several
    files if the single file approach fails to scale adequately. Similarly, ADIOS
    improves scalability in a way that minimizes communication among processes when
    handling I/O. ADIOS comes with its own format (BP), but provides conversion to
    HDF5 and netCDF.


    At first glance, GLEAN appears quite similar to ADIOS and PLFS, but the differences
    are definitely in the details. Like ADIOS, GLEAN adapts I/O strategies to the
    underlying network topology, and makes use of the data semantics of applications
    in order to improve data movement, but it has its own architecture and approach.
    GLEAN performs asynchronous data tagging, efficient compression, and subfiling.
    Unlike ADIOS and PLFS, GLEAN directly supports the HDF5 and netCDF I/O libraries.


    # 12.3 What Is the Future of I/O Libraries?


    Given their growing acceptance and institutional support, it seems likely that
    at least some of the I/O libraries we see here will grow and prosper. The success
    of ADIOS, PLFS, and GLEAN suggests that more packages will become available that
    enable applications to adapt their I/O architectures and interconnect topologies,
    especially on high-end computing systems.


    Their successes with specific applications will lead to more application developers
    to design the I/O in their applications to take advantage'
