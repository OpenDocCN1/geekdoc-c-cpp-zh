    hundreds of thousands of small files. PLFS can map N-to-1 patterns to N-to-N or
    M-to-M files where M<N. Furthermore, because PLFS is creating lots of smaller
    files unknown to the user, it has the ability to place the small container files
    into different directories or even file systems, giving PLFS the ability to create
    namespace operations and data operations across multiple metadata servers, as
    well as multiple file systems. PLFS has a mode that allows user-initiated I/O
    traffic to spread across multiple metadata servers or file systems, and a mode
    that allows multiple small files to be put into a single container as well. This
    remapping of traffic and breaking the dependence between processes allows the
    N-to-1 dominant code to get good performance on Pandas and Lustre.


    The PLFS speed-up chart in Figure 6.5 speeds-ups for various N-to-1 applications
    using PLFS. This ability to remap I/O patterns is a useful mechanism—so useful
    that PLFS technology is being used in the DOE Exiscale Storage Fast Forward Effort,
    which started in 2012. This effort is prototyping a next-generation I/O stack
    for exascale computing later this decade.'
