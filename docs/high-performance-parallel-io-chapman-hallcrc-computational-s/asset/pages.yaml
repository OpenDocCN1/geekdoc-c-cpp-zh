    # 14.4 Conclusion


    Through a variety of configurations and use cases, PLFS is a dramatic example
    of the power of software-defined storage. An underlying storage system can be
    configured to work well with well-arranged streams of data. The PLFS software
    is then layered over that storage system and can be configured to export it for
    a variety of different workloads, such as shared file, small file, and flat file,
    for better metadata load balancing. Additionally, PLFS can en-able parallel I/O
