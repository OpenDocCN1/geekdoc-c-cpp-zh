    appeared in Gordon E. Moore, “Cramming Components onto Integrated Circuits,” Electronics
    38 (8): 114–117, April 19, 1965.


    > ²This observation is commonly referred to Dennard Scaling because it was formalized
    and extended in Robert H. Dennard et al. “Design of Ion-Implanted MOSFET’s with
    Very Small Physical Dimensions,” IEEE Journal of Solid-State Circuits SC-9 (5):
    256–268, October 1974.'
