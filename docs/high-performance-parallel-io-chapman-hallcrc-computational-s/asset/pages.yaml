- pgno: 249
  md: '# ADIOS 207


    Earth’s climate. These climate simulations can generate several terabytes, or
    even petabytes, of raw data. Such data-intensive applications present a tremendous
    set of challenges for computer centers that strive to accommodate, maintain, transfer,
    and preserve data.


    Large-scale computing centers that host such applications cannot afford to frequently
    stall along data accesses and precious computing cycles. The I/O performance of
    scientific applications such as climate models has a great impact on the completion
    of scientific simulation and post-mortem data visualization and analysis. However,
    many applications have complex data characteristics that are not well supported
    by parallel I/O libraries, for example, applications may generate a large number
    of small variables. While the data is large in aggregate, each process only holds
    a very small amount of data for each variable. An example is one of NASA’s climate
    and weather models GEOS-5 (the Goddard Earth Observing System Model), GEOS at
    a coarse resolution of half-degree generates only 3.2 GB data, but consists of
    185 2D variables and 80 3D variables at a time. The number of timesteps can be
    configured to the order of thousands. It is challenging to provide good I/O speed
    for both writing and reading where large amounts of small I/O requests are expected.
    Moreover, it is also quite common for data postprocessing to examine data along
    time dimensions, observing the change of temperature within one hour. However,
    storage data layouts currently in use do not provide a good support for such an
    pattern.


    In addressing critical climate issues, climatologists and meteorologists are limited
    by the available spatial and temporal resolutions of the current climate and weather
    models. An I/O method of ADIOS was specially designed by Tian et al. [14] to enable
    higher resolution in output datasets. It leverages the spatial and temporal relationships
    between variable data. Spatially, aggregates and merges chunks of the same timesteps
    so that fewer processes work blocks. Moreover, the same variable across different
    timesteps are merged with time as a new dimension, which reduces the amount of
    I/O requested for both writing and reading. This strategy has provided two orders
    of magnitude of speedup compared to simple writing (and reading) approaches.


    # 17.3.3 Code Coupling


    ADIOS DataSpaces [6] is a scalable data-staging substrate that supports advanced
    coordination and interaction services for extreme-scale coupled simulation workflows.
    It provides the abstractions and mechanisms to support flexible and dynamic inter-application
    coupling and interactions at runtime. It also supports asynchronous data insertion
    and/from a staging area composed of a set of cores on application nodes and dedicated
    staging nodes. For example, in case of a simulation-visualization workflow, the
    simulation can output data to the staging resources at runtime using the DataSpaces'
