    \ 211\n\n# 17.1 Motivation\n\nThere are two conventional strategies for writing\
    \ data from applications that run on supercomputers: a file-per-process, or a\
    \ single-shared-file for all processes. However, neither of these processes scale\
    \ well for large-scale applications. At the application level, it is very hard\
    \ to implement a flexible I/O strategy that works well on all supercomputers.\
    \ Application developers cannot be tasked with waiting and maintaining custom\
    \ I/O middleware. In designing ADIOS, the primary goal was to create an I/O framework\
    \ that enables scientists to create their data-driven scientific processes, and\
    \ write their"
