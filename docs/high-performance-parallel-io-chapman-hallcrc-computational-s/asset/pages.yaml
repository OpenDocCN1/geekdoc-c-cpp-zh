  md: '# High Performance Parallel I/O


    # 19.7 Conclusion


    This study successfully undertook an unprecedented trillion-particle simulation
    on 120,000 cores on Hopper. The fully functional simulation produced 30 TB to
    42 TB of data on a per-timestep basis resulting in major I/O challenges. While
    the study utilized a well-tuned production I/O stack consisting of HDF5, Cray
    MPI-IO and Lustre, the study faced and addressed a number of issues at scale.
    Terabytes of data were successfully written to a single file on one file. This
    performance was comparable with the fpp model, where each MPI process writes data
    into one file. The fpp model is often considered the gold standard for writing
    large data to parallel file systems. The study also analyzed the particle datasets,
    which led to various scientific discoveries answering the science objectives mentioned
    in Section 19.2. More details of analysis and visualization of the data are available
    in works by Byna [2, 3, 12].


