    # ### 12.1 Motivation


    Why do we need an I/O stack? What is the importance of various layers in the stack?
    Why do we need I/O libraries?

    There was a time when computers mostly exported data to magnetic tape or punch
    cards. I/O was pretty simple in those days, but there were still important principles
    a programmer needed to think about in order to read, write and store data efficiently.
    Instead of writing a bite of time, programs would aggregate data into fields,
    records, or collections of records. By exploiting redundancy, programmers used
    data compression in order to write it more quickly and store it efficiently.

    Computer users also discovered that a little extra information, like an index
    or tree structure, could enable users to find things more quickly, and to add
    and delete items from a collection of records more quickly. They also found that
    a data file itself be broken into chunks, subfiles, and other organizations to
    provide faster I/O, including easier search and retrieval of information, and
    partial access.

    Because there were enormous differences between the time it took to move data
    within memory and to move data from memory to secondary storage, experts allocated
    space in memory to serve as buffers, allowing computation to continue at the same
    time that the slower I/O process completed.

    Special commands and subroutines were added to programming languages that could
    hide the details of writing and reading data, so that programmers didn''t have
    to bother with those details. And when spinning disks arrived, those commands
    and subroutines were modified to take advantage of'
  merge: -1
  img_proc: true
- pgno: 194
  md: 'the new technology. Spinning disks also offered new opportunities for direct

    access, and B-trees and other structures were invented that made searching,

    sampling, and subsetting much easier and faster.


    As systems evolved, people employed combinations of these techniques,

    mixing and matching particular methods in ways that worked best for the

    architecture on which a system resided, and for the applications most likely to

    run on the system. In many cases these combinations were provided as different

    software layers. One layer might aggregate a collection of data elements into

    buffer, another might compress the data, and another might write it out in

    certain format. The same package might use the same steps in reverse to

    read the data. Thus, perhaps emerged the idea of the I/O stack.


    Over time, software packages were created that included some of these

    combinations. As often as not, they were motivated by application developers

    who didn''t want to be bothered with such details, but did want to get

    good performance as they could on their systems. These solutions were made

    available in the form of I/O libraries.


    # 12.2 A Recent History of I/O Libraries, by Example


    What you will read in the next chapters is a snapshot covering the last

    two decades in the history of I/O and high-end computing systems. These I/O

    libraries employ pretty much the basic principles we have seen for more

    than half century, but with new and clearer ways that address today''s archi-

    ctures and applications, and do their best to anticipate the next generation

    of architectures and applications.


    MPI-IO anticipated the rapid growth of highly parallel systems and paral-\lel
    systems. The MPI I/O library is a middle layer that provides options to

    support the different kinds of I/O applications perform, and hides the details

    of applications or their I/O libraries. Although the other I/O libraries in

    this section can read and write without using MPI-IO, most of them provide

    options that enable applications to take advantage of this powerful tool.


    The Parallel Log-structured File System (PLFS) was designed for mas-\sely concurrent
    checkpointing, but ultimately became an effective way to

    ad a variety of workloads and I/O patterns to a single storage system,

    hiding the details from applications. Moreover, PLFS is positioned to support

    high performance I/O in the future by showing it can accommodate GPU

    processing in the data pipeline, take advantage of bursts, and play the

    with cloud file systems.


    Parallel-NetCDF is perhaps the most user-friendly of the parallel I/O li-

    braries because it adapts an existing serial I/O library to parallel I/O without

    asking the user to adapt their data model or format in any way. Because

    netCDF is one of the most popular of all scientific data formats, the availabil'
