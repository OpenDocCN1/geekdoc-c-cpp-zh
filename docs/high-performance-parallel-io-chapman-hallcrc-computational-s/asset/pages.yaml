  md: 'MC4 is a parallel particle-mesh cold dark matter (CDM) code based on MC2 [6].
    CGNS currently achieves scalable parallel performance for maximum values of $N_{particles}=N_{grid}=4096$
    using $O(10, 000)$ cores, and uses H5lut to output several terabytes of data per
    field per timestep. Work is progressing toward problem sizes of $N_{particles}=N_{grid}=8192$
    or even larger using $O(100, 000)$ cores.


    The **HDF5-FastQuery** [4] library enables multi-dimensional indexing and search
    on H5Part datasets by leveraging an efficient bitmap technology called FastBit
    [16]. Storing bitmap indices in the H5lut significantly speeds up access to subsets
    of multi-dimensional data, especially through range queries. This has been applied
    to interactive exploration of simulations of laser wakefield particle accelerators.
    Data from the simulation is stored with H5Part and indexed by HDF5-FastQuery.
    High-energy particles in the laser wakefield can then be efficiently selected
    by thresholding large moments in the direction of the beam [10].


    # ## 16.4 CGNS


    # ### 16.4.3.1 Design


    In 1994, NASA, Boeing, McDonnell Douglas started a common effort on computational
    fluid dynamics data standardization. In 1999 they created the **CGNS Steering
    Committee**, a voluntary public forum made of international representatives from
    government and private industry, with the aim of gathering the CFD community on
    a standard for data interoperability. Today, this committee includes the main
    actors of the USA and Europe; they regularly meet in the framework of the **American
    Institute of Aeronautics and Astronautics (AIAA)** who now holds the standard
    as one of its recommended practices.


    The CGNS standard [3] defines both a data model, the so-called SIDS (Standard
    Interface Data Structure), and its implementations on physical medium. The data
    model, a public document, is dedicated to CFD (computational fluid dynamics) but
    has enough generality to host other CFD-coupled simulations such as CFD/CAA (Aerooustics)
    or CFD/CSM (structural mechanics). The CGNS data model handles few nodes but with
    a strongly typed grammar. Figure 16.5 shows a simple program that creates a CGNS
    file. It defines a complete set of data for computation, the definition of the
    equations, the flow fields and parameters, the meshes and associated topological
    information, and other auxiliary data.


    The data model is the basis for data representation. Once an entity that the standard
    defines is described in the CGNS/SIDS document, it must be translated to store
    on a physical medium. There are three CGNS/SIDS mappings: ADF, HDF5, and Python.
    A mapping defines the translation between the tree data model of CGNS/SIDS and
    the actual nodes and set of nodes'
