- pgno: 382
  md: '# High Performance Parallel I/O


    ![](img/e2df60633eace5d7f248335c7c97063d_382_0.png)


    FIGURE 30.2: Mapping of PnetCDF dataset to (a) POSIX file, or (b) EOF objects.


    In the EOF object model, distinct objects are used to hold metadata and the data
    corresponding to variables. The PnetCDF library becomes responsible for mapping
    multidimensional variables into one or more objects. This simplifies data layout,
    especially for record variables that can now be mapped into distinct objects without
    for interleaving.


    The Intel Storage and I/O Fast Forward project [2, 4] is similarly looking at
    how high-level data can be mapped onto object storage architectures. The Intel
    activity includes three sub-projects: looking how HDFS (Chapter 16) can target
    object storage back ends; using PLFS (Chapter 14) and I/O Forwarding Software
    Library (IOFS) [3] can be used to manage bursts developing a prototype Distributed
    Object Storage (DAOS) system, building on Lustre (Chapter 8) including a distributed
    transaction capability.


    The transaction capability is one unique feature of the Intel prototype I/O stack
    and is built on top of a versioning capability at the DAOS level. This capability
    allows for transactions with Atomicity, Consistency, Isolation, Durability (ACID)
    properties when data moves from burst buffer to persistent storage. Transactions
    are similarly supported at the burst buffer layer, and'
  merge: -1
