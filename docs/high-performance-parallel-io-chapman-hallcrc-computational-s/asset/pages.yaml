    This chapter presents results and lessons learned in developing and using Silo
    [4]. Silo is neither an application nor an application-specific I/O framework
    or library. Silo is a general-purpose application programming interface (API)
    and I/O library for reading and writing a variety of scientific computing data
    objects to HDF5 files.


    Silo supports various mesh types including grids, unstructured, arbitrary, adaptive
    (AMR), and solid model (CSG) meshes. It supports piecewise-constant and piecewise-linear
    variables (e.g., fields) defined on the node, edge, face, or volume elements of
    such meshes as well as the decomposition of meshes into subsets with boundaries,
    materials, and part assemblies.


    Although Silo is a serial library, key features enable it to be applied effectively
    and scalable in parallel.


    There is no specific application to address Silo''s development or a fundamental
    software engineering challenge. That is, to spur the development of common tools
    by enabling storage, sharing and exchange of data among diverse scientific computing
    applications through a common API and database.


    This chapter illustrates the use of Silo by describing a canonical use case. The
    chapter will use as examples the ALE3D multi-physics simulation, the Vislt visualization
    application, the Lustre file system, and the way Silo is used to store and exchange
    data between these components.'
