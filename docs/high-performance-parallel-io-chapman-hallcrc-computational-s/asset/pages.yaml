    LNet is implemented in two layers. The upper layer implements generic communications
    while the lower layer abstracts physical networks and network-specific protocols
    through the Lustre Network Driver (LND). LNet supports a wide range of networks
    including TCP/IP, all fabrics such as Infiniband supported by OFED, and HPC fabrics
    with non-standard APIs such as the Cray Seastar and Gemini networks.


    When the underlying network supports two-sided communications, the LND will typically
    support zero-copy on sends but is forced to copy pre-posted network buffers into
    MBs by the upper levels. However, when the underlying network supports RDMA, the
    LND implements small message queues for small LNet communications and to negotiate
    RDMA for large MBs to support zero-copy for both incoming and outgoing bulk data.
