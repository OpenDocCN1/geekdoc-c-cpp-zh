    # 5.2 The Lustre® Parallel File System: Early Developments


    Lustre [7, 8, 12] is a file system architecture and implementation suitable for
    very large clusters, such as at LC. Lustre was initially designed, developed,
    and maintained by Cluster File Systems, Inc. (CFS). The initial collaboration
    with CFS included Hewlett-Packard and Intel and the three NNSA research laboratories:
    Livermore, Los Alamos, and Sandia.


    Sun Micros acquired CFS in 2007 to fortify their storage business. After their
    acquisition of Sun in 2010, Oracle mapped their exit from Livermore. WhCloud,
    was formed in 2012 as an entity to provide support and development independently
    from Oracle, only later to be acquired by Intel. Oracle eventually sold their
    remaining interests to Xyratex, Ltd. in 2013.


    Lustre runs on commodity hardware, using object-based storage and separate metadata
    servers to isolate these clusters and improve scalability. A key advantage of
    OSDs in a high performance environment is the ability to delete low-level allocation
    and synchronization for a given segment of data to the device on it is stored,
    leaving the file system to decide on which OSD segment should be placed. Since
    this decision is quite simple and allows massive parallelism of bulk data transfer,
    each OSD only manage concurrency locally, allowing a file system built from thousands
    of OSDs to achieve massively parallel data transfers. Lustre is a POSIX-compliant
    file system presenting a unified client interface as open(), read(), write(),
    etc. to the application. This is the portion of the file system that is running
    on (or close in the Blue Gene systems) to the node doing the computation. At LLNL,
    Lustre uses the InfiniBand network switch in the most recent instances. Network
    independence is another Lustre design strength, facilitated originally by its
    use of the Portals protocol stack, an abstract approach to networking originally
    developed at Sandia National Laboratory (now available as open source software).
    This functionality, now called LNet, is implemented as part of Lustre at LLNL'
