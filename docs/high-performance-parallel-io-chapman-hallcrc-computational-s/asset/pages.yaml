    By 2018, further improvements to compute efficiency will be hidden by the energy
    required to move data to the computational cores on a chip. The current computing
    infrastructure is built on the premise that computing is the most expensive component.
    In the current era, computing is cheap and ubiquitous, whereas data movement dominates
    energy costs. This overturn basic assumptions about programming and portends a
    move from a computation-centric paradigm to a data-centric paradigm for programming
    future systems [2]. The severe constraints in data movement are also driving the
    industry toward alternative technologies for data communication such as optics
    and silicon nanophotonics that integrate optical technologies directly onto silicon
    chips.


