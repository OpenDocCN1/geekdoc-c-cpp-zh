    improvements to each of the components, from compute nodes to storage disks.


    # 18.3.2 Data Staging for FLASH Astrophysics


    The FLASH code [3] is an adaptive mesh, parallel hydrodynamics code developed
    to simulate astrophysical thermonuclear fusion flows in two dimensions, such as
    Type Ia supernovae, Type X-ray bursts, and classical nova. It uses the compressible
    Euler equations on a block-structured mesh. FLASH provides an AMR grid using a
    modified version of the PARA-MESH package and a Uniform Grid (UG) to store Eulerian
    data.


    For this study, GLEAN develops the Sedov simulation included in the FLASH distribution.
    Sedov evolves a blast wave from delta-function initial perturbation [2]. The Sedov
    problem exercises the FLASH-infrastructure (with AMR and I/O) of FLASH with the
    minimal use of solvers. It can, therefore, produce representative I/O behavior
    spending too much time in computations. The application was run in 3D with 16³
    cells per block. Each block size is controlled by adjusting the global number
    of blocks. The study advanced four timesteps and produced I/O data at every single
    step that so most application runtime is spent on I/O. I/O in each step consisted
    of the checkpoint files for restart purposes and plot files for analysis. A checkpoint
    file is the output of the complete state of a runtime application, including mesh
    data in double precision. A plot file is a user-selected subset of mesh variables
    stored in single precision. In these experiments, checkpoint I/O writes all ten
    mesh variables. The plot file I/O writes only selected variables of interest (in
    these experiments, the first, sixth, and seventh variables).'
  merge: -1
  img_proc: true
- pgno: 264
  md: '# High Performance Parallel I/O


    The performance of GLEAN was evaluated for two standard FLASH output streams (checkpoint
    and plot data) on the Intrepid BG/P system. Working closely with the FLASH developers,
    GLEAN was designed to have an API to capture the data semantics of FLASH including
    the AMR hierarchy. To interface with FLASH, pnetCDF was transformed into the appropriate
    GLEAN API. By setting an environment variable that is passed to the FLASH executable
    when the job is launched with pnetCDF, one can use GLEAN with FLASH. Thus, GLEAN
    is able to integrate with FLASH without any modifications to the FLASH simulation
    code. On the staging nodes (Eureka), GLEAN can be configured to write out data
    asynchronously using either pnetCDF, or transformed-on-the-fly and written out.
    This is possible because GLEAN captures the data semantics of FLASH. By incorporating
    asynchronous data staging, a multifold improvement was achieved in the I/O performance
    for FLASH at 32,000 cores on the BG/P system [10].


    # 18.3.3 Co-Visualization of PHAST CFD Simulation


    The PHAST code [9] performs computational fluid dynamics (CFD) using a finite
    element discretization that uses a large-eddy-simulation-based turbulence model.
    PHAST uses an unstructured, tetrahedral grid. The number and locality of elements
    changes frequently, based on solution characteristics and load balancing. Grid
    and field structures are stored in dynamically allocated memory, due to frequent
    updates.


    GLEAN''s success is described by the application to enable the simulation-time
    analysis and the visualization of PHAST running on 128,000 cores of Intrepid (32
    racks) with ParaView [7] running on 80-data-staging Eureka nodes. To achieve this,
    GLEAN developers worked closely with PHAST developers to capture the unstructured
    tetrahedral mesh model. Additionally, to facilitate visualization of the PHAST
    data using ParaView, GLEAN supports ParaView''s visualization meshes. On Eureka,
    GLEAN was able to transform PHAST''s staged data into ParaView''s mesh format
    on-the-fly. ParaView is a highly common visualization toolkit on leadership-class
    simulations. Simulations can use ParaView and GLEAN to visualize data at runtime.


    Two additional scaling studies for co-visualization of the PHAST simulation with
    ParaView [10] include a 416-million-element case and a 3.32-billion-element case
    study. For the 416-million-element case of PHAST on 32 Intrepid racks consisting
    of 20 GiB, GLEAN was able to transfer this data in about 0.6s, achieving around
    34 Gbps. For the 3.32 billion elements (about 160 GB) using 32 racks and 80 Eureka
    nodes, GLEAN achieved around 41 Gbps. GLEAN enabled PHAST developers to visualize
    a live simulation on 128,000 cores.'
  merge: -1
  img_proc: true
- pgno: 265
  md: '# 18.4 Conclusion


    The generation mismatch between the computing and I/O components of current-generation
    HPC systems have made I/O the critical bottleneck for scientific applications.
    It is crucial that software take every advantage available in moving data between
    compute, analysis, and storage resources as efficiently as networks will fail
    to perform as well as the hardware infrastructure will allow, suggesting that
    improved optimization and perhaps adaptive mechanisms deserve increased study.


    The GLEAN infrastructure was developed to improve I/O performance on supercomputers.
    The GLEAN infrastructure hides significant details from the end user, while at
    the same time providing them with a flexible interface of offering the fastest
    path to their data and in the end, scientific insight. GLEAN provides a mechanism
    to leverage topology-aware data movement for accelerating I/O, interface to run
    simulations for co-analysis, and an interface for in situ analysis with minimal
    modifications to the existing application base. It has been deployed on production
    facilities and demonstrated to scale to 76800 cores.


