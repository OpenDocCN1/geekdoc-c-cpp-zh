    \ 294\n\n# 25.1 Abstract\n\nI/O performance is becoming a bottleneck in many cases\
    \ at the extreme scale. As the volume of data and application reads and writes\
    \ increases, it is important to assess the scalability of I/O operations as a\
    \ key contributor to overall performance. Optimizing I/O performance presents\
    \ unique challenges for application developers and performance measurement and\
    \ analysis tools, as it often involves an integration of multiple techniques to\
    \ observe performance and create integrated I/O performance views from multiple\
    \ I/O layers. Furthermore, reasoning about how to improve I/O performance necessarily\
    \ involves understanding its relationship to the application behavior as a whole.\
    \ The TAU Performance System [4, 7] is an integrated performance profiling and\
    \ tracing toolkit that provides flexible support for performance instrumentation\
    \ of both the application and provides the I/O layers."
  merge: -1
  img_proc: true
- pgno: 332
  md: '# 25.2 Features


    Observing the performance of the I/O operations requires instrumentation to be
    inserted in the library layers of the I/O software stack, commonly used I/O interfaces
    such as POSIX I/O and MPI-IO. However, characterization of I/O performance must
    also be done with respect to an application context in order to fully understand
    overall performance impact. TAU can gather data from the application and I/O layers
    to create a unified performance perspective that show program context alongside
    I/O statistics. It does so by instrumenting the application source code and the
    intercepting calls from the I/O layers using wrapping libraries.


    Application source code written in a variety of HPC languages (e.g., C, C++, Fortran,
    UPC) can be instrumented by TAU''s compiler scripts using the Program Database
    Toolkit (PDT) [2] source analysis technology. The PDT-tau.instrument inserts code
    into the application at selected points for performance measurement. PDT can also
    be used to preprocess library headers for purposes of wrapping the interface routines
    with interposition code that intercept library calls in the application, perform
    measurements, and invokes the library operation. The TAU wrapping capability is
    applied to create wrappers for MPI-IO and POSIX I/O. In fact, these wrapped libraries
    are distributed with TAU. Additional tools, such as the tau_gen_wrapper [5], are
    provided to automate the creation of external wrappers for other I/O libraries
    such as HDF5. By capturing events from several layers of wrapped libraries and
    associate routine parameters captured (e.g., file ID, I/O data size) with timing
    measurements to produce metrics such as the bandwidth of read and write operations
    for each file. TAU can further attribute I/O costs to specific regions without
    modifying the source code of the application.


    More specifically, TAU supports the following techniques for intercepting I/O
    calls:


    +   - MPI-IO instrumentation,


    +   - preloading of instrumented libraries,


    +   - linker-based instrumentation, and


    +   - instrumented external libraries.


    Each of these techniques is described in more detail in the following sections.'
  merge: -1
  img_proc: true
- pgno: 333
  md: '# TAU 291


    # 25.2.1 MPI-IO Instrumentation


    The MPI message-passing libraries provide a name-shifted interface that permits
    tools, using TAU, to intercept calls using the profiling message-passing interface
    name-shifted interface. TAU additionally uses this support to create a wrapper
    library for MPI-IO calls (e.g., MPI_File_read) that internally calls the name-shifted
    interface (e.g., PMPI_File_read). Like before, the wrappers can examine the arguments
    that flow through the I/O. In addition to TAU, this instrumentation technique
    is used in a wide variety of HPC tools including Scalasca [9], VampirTrace [6],
    Score-P [8], mpi [1], and integrated Performance Monitoring (IPM) (see Chapter
    26). However, library interposition through name-shifted interfaces is only available
    as a technique if such interfaces are implemented in the library. This is not
    the case with POSIX/O.


    # 25.2.2 Runtime Redeploy of Instrumented Library


    Many HPC operating systems such as Linux, Cray Blue Compute Node Kernel (CNK),
    and Solaris permit preloading of a library in the address space of an executing
    application using a shared object (DSO) in an environment variable (LD_PRELOAD).
    It is possible to create a tool based on this technique to intercept all I/O operations
    by means of a wrapper-library where the POSIX I/O calls are redefined to call
    the global routine (identified using the dlsym system call). Preloading libraries
    is implemented by the runtime linker and used in TAU [4] and VampirTrace [6].
    While it can resolve all POSIX-IO calls and operates on uninstrumented executables,
    it only supports dynamic executables. Static executables are by default on IBM
    Blue Gray and Cray XE6 and XK6 systems, although dynamic executables may be created
    using the dynamic command line flag. A different technique will be necessary to
    support static binaries.


    # 25.2.3 Linker-Based Instrumentation


    A linker can redirect references to a wrapped routine when it is invoked with
    a special flag on the command line (--wrap,wrap,function_name). In this case,
    the application needs to be relinked to the wrapped library, but this instrumentation
    overcomes the limitation of the previous approach provided by the runtime linker
    and may be used with both static and dynamic executables. TAU has applied this
    approach to instrument POSIX I/O calls by creating a wrapper library. Since the
    number of wrapped routines that may be present in a library might be potentially
    large, listing each routine on the linker'' command line can interfere with predefined
    system limits for command length. Instead, a linker may read a file that contains'
  merge: -1
