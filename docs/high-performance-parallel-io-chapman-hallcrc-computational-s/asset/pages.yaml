    To overcome such problems, MPI collective I/O functions can convey the exact intent
    in this example that considers the parallel write of the whole global array as
    a single request. The program fragment using a collective function is shown in
    Figure 13.4(d). It appears almost the same as the independent case, except name
    of the write function. MPI collective I/O requires the participation of all processes
    that open the shared file. This requirement provides a collective I/O implementation
    to exchange access information and reorganize I/O requests among the processes.
    Process-collaboration strategies have been proposed, as two-phase I/O [2], disk-directed
    I/O [4], and server-directed I/O [8].


    Two-phase I/O is a representative collaborative I/O technique that runs in the
    user space [11]. It exchanges data among processes, so that the arranged requests
    are processed by the underlying file system with the best performance. Two-phase
    I/O conceptually consists of a request aggregation phase (referred to as the communication
    phase) and a file access phase (or simply the I/O phase). In the request aggregation
    phase, a subset of MPI aggregators is picked as I/O proxies for the rest of the
    processes. The aggregate file access region requested by all processes is divided
    among the aggregators into non-overlapping sections, called file domains. For
    collective writes, the non-aggregator processes send their requests to the aggregators
    based on their file domains. In the file phase, each aggregator merges the aggregated
    requests to the file system. ROMIO adopts the two-phase I/O strategy for implementing
    the collective MPI-IO functions.


    The bottom part of Figure 13.3 depicts the two-phase I/O operation for the 2D
    array example. Assuming P0 and P2 are I/O aggregators, the aggregate access region
    of the collective write operation is evenly divided into two file domains, one
    for each aggregator. I/O data are redistributed from all four processes to the
    two aggregators during the request aggregation phase. Specifically, aggregator
    process rank 0 receives data from both rank 0 and 1, while aggregator 2 receives
    data from ranks 1, 2, and 3. In the file phase, each aggregator aggregates the
    received data into a single, contiguous request and makes a write call to the
    file system.


    Recently, there were several optimizations that further improve the performance
    of collective I/O. Various file partitioning methods have been studied that can
    adaptively determine by the underlying file systems in order to minimize lock
    conflicts for collective I/O [5]. In Sehrish al.''s work [9], a pipelined strategy
    was developed to overlap the two phases in the two-phase I/O method. In this method,
    large requests are divided into smaller ones, each of size equal to the file stripe
    size, and redistributed to the I/O aggregators by MPI asynchronous communication
    in a pipeline fashion that the asynchronous communication overlaps'
