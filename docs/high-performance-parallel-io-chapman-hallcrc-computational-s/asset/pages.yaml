- pgno: 294
  md: '# High Performance Parallel I/O


    the number of independent I/O pathways available from compute nodes to the file
    system. Typically, this number is between 8 and 1024 depending on problem size
    and the compute and file system resources involved.


    ALE3D groups MPI tasks in N groups and each group is responsible for creating
    one of the N files. At any moment, only one MPI task from each group has exclusive
    access to the file. Hence, I/O is serial within a group. However, because one
    task in each group is writing to its own''s group owner, simultaneously, I/O is
    across all groups. Within a group, access to the group''s file is handled in a
    round-robin fashion. The first MPI task in the group creates the file and then
    iterates over all domains. For each domain, it creates a sub-directory within
    the file (e.g., a separate namespace for Silo objects) and writes all the Silo
    objects (the main mesh data, the material composition of the domain, the meshes
    defined on) to that directory. It repeats this process for each domain. Then,
    the first MPI task closes the Silo file and hands off exclusive access to the
    next task in the group. MPI task opens the file and iterates over all domains
    in the same way. Exclusive access to the file is then handed off to the next task.
    This process shown in Figure 21.2, continues until all processors in the group
    have their domains to unique sub-directories in the file.


    After all groups have finished writing their Silo files, a final step involves
    creating a master Silo file which contains special Silo objects (iblock objects)
    that point at all the pieces of mesh (domains) scattered about in the N files.


    Setting N to be equal to the number of MPI tasks, results in a fileperprocess
    configuration, which is typically not recommended for users. However, some applications
    do choose this with good results. Alternatively, setting N to 1 results in effectively
    serializing the I/O and is certainly not recommended. For large, parallel runs,
    there is a sweet spot in the selection of N which results in peak I/O performance
    rates. If N is too large, the I/O subsystem will likely be overwhelmed; setting
    it too small will likely underutilize the system resources. This is illustrated
    in Figure 21.3 for different numbers of files and MPI task counts.


    # 21.3 MIF and SSF Scalable I/O Paradigms


    This approach to using Silo for scalable, parallel I/O was originally developed
    ALE3D in the late 1990s by Rob Neely, a software architect on ALE at the time.
    This approach is sometimes called "Poor Man’s Parallel I/O." It and variations
    thereof have been adopted and used productively through several transitions in
    orders of magnitude of MPI task counts from hundreds to thousands of today.'
