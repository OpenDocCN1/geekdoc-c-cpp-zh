- pgno: 232
  md: '![](img/e2df60633eace5d7f248335c7c97063d_232_0.png)


    FIGURE 16.3 (See color insert): An overview of HDF5 datatypes. [Image courtesy
    of Gerd Heber, The HDF Group.].


    The datatype of the HDF5 dataset describes the type of the element stored at each
    location of the array. Each element of a dataset must capable of describing very
    complex structures for each element. Figure 16.3 notes the categories of datatypes
    and their capabilities. Notable features include the ability to nest array, compound,
    and variable-length attributes arbitrarily to create user-defined integer and
    floating-point types, and to reference other objects and regions within the container.
    HDF5 datatypes give great power to the application developer, allowing them to
    describe their data in memory and store it in HDF5 containers without forcing
    to convert the data when storing it.


    The layout of an HDF5 dataset describes how elements of the array are described
    by the dataset''s datasource and datatype are stored within the file. As part
    of HDF5''s flexibility, dataset layouts allow for multiple optimizations, such
    as continuously storing all the elements, storing the elements for very small
    arrays with the dataset''s metadata (faster access), chunking an array into regular
    pieces (allowing for array dimension expansion and data compression), and storing
    the arrays externally in another file.


    Finally, HDF5 attributes allow an application to add user-defined metadata to
    any object in the container. Attributes are name-value pairs that can be attached
    to any object, with the value for each attribute being essentially a small dataset,
    with a datatype, datatype and array elements. Attributes provide the full richness
    of the datatypes available to datasets, but are limited in size and access operations,
    as they are designed to be small objects that augment a larger component in the
    application''s data model.'
  merge: -1
  img_proc: true
- pgno: 233
  md: '# HDF5


    The HDF5 data model provides a flexible and deep set of objects that application
    developers can use to store and retrieve data structures in a self-described and
    portable way.


    # 16.3.2 The HDF5 Library


    The HDF5 library is implemented in C, with wrappers for many other programming
    languages, such as FORTRAN, C++, Perl, Python, .NET, and ADA—all of which call
    the C API routines. Although the core library is written in C, its API routines
    are designed in an object-oriented manner that enables simple operations to be
    written quickly, and still complex operations in a straightforward way.


    In addition to the classes described in the data model section earlier, additional
    classes are available at runtime for setting properties that control the behavior
    of objects and operations, selecting regions of datas to perform parallel I/O,
    and a variety of classes that support infrastructure operations like error reporting
    and object management.


    Operations that support parallel I/O and property lists control how to write data
    in parallel are particularly important in the high performance computing area.
    Multiple processes within an MPI application to write to a single HDF5 dataset
    can select each part of that dataset in the container and then set a “collective
    I/O” property when writing their information, allowing all the processes to collaboratively
    choose an efficient manager to write all the elements to the dataset. Other properties
    allow further optimizations without adding complexity to the core set of data
    access.


    The listing in Figure 16.4 shows a simple program that creates an HDF5 file, creates
    a three-dimensional dataset of floating-point values linked from


    ```

    * Create a new file using default properties. */

    file_id = H5create("File.h5", H5P_ACC_TRUNC, H5P_DEFAULT, H5P_DEFAULT);


    * Create a dataset that describes the array''s dimensions. */

    dataspace_id = H5create_simple(3, (6, 6, 5), NULL);


    * Create a dataset with floating-point array elements. */

    dataset_id = H5create("/dataset", H5T_NATIVE_FLOAT, dataspace_id, H5P_DEFAULT,
    H5P_DEFAULT, H5P_DEFAULT);


    * Write elements to the dataset. */

    H5Dwrite(dataset_id, H5T_NATIVE_FLOAT, H5S_ALL, H5S_ALL, H5P_DEFAULT, buf);


    * Terminate access to the objects created. */

    H5Sclose(dataspace_id);

    H5Dclose(dataset_id);

    H5fclose(file_id);

    ```


    FIGURE 16.4: A simple HDF5 application.'
  merge: -1
  img_proc: true
- pgno: 234
  md: '# High Performance Parallel I/O


    the root group of the file (referred to as “dset”), and writes all the elements
    of the array out from a memory buffer. The HDF programming API and its usage is
    extensively documented online with example code, tutorials, and a user’s guide,
    and API reference manual [14].


    # 16.3.3 The HDF5 File Format


    Based on many years of experience developing the original HDF package (now called
    “HDF4” [12]) and in broadly surveying many other file formats and data storage
    mechanisms, the HDF5 file format is designed to be portable, resilient to data
    corruption, and future-proof through “micro-versioning.” Micro-versioning within
    an HDF5 file allows individual aspects of each object to be stored with a different
    version. This capability allows the format of individual components of objects
    to be incrementally extended and improved as needed, when version changes for
    the entire file.


    Files created by the HDF5 library are all backward compatible and as forward compatible
    as possible. Backward compatibility indicates that old files continue to be accessed
    with newer versions of the HDF5 library. Forward compatibility allows files created
    by later versions of the library to be read by earlier versions. The HDF5 library
    implements this capability by storing each object in a container with can possibly
    represent the information and features requested for the object. This allows the
    greatest range of older released software to read files produced by newer libraries.


    In a very strong sense, HDF5 files implement a file system within a container,
    with groups analogous to directories and datasets similar to (structured) files,
    such as B-trees, etc. All aspects of the HDF5 file format are described in the
    format specification [15], which has allowed third-party implementations of HDF5
    file readers, proving the ability of HDF5 files to outlast the current library
    implementation.


    # 16.4 Usage and Applications


    HDF5 is used across hundreds of science, engineering, and business domains and
    by thousands of applications within those domains, from highenergy physics, climate
    modeling, and financial market tracking to airplane flight test data recording
    and medical record storage. The following vignettes highlight some of the high
    performance computing applications of HDF5 that are most relevant to this text.'
  merge: -1
  img_proc: true
- pgno: 235
  md: '# HDF5


    # 16.4.1 netCDF-4


    # 16.4.1.1 Design


    NetCDF (network Common Data Form) is a data model for array-oriented scientific
    data, as well as a freely distributed collection of access libraries that support
    the implementation of the same data model, and a machine-independent data format.
    Together, the interfaces, libraries, and format support the creation, access,
    and sharing of scientific data.


    netCDF-4 data access software supports optional use of HDF5 as a storage layer,
    to take advantage of features and benefits of HDF5 for high performance computing
    and advanced data structures. Whereas the simplicity of the netCDF data model,
    and the third-party software, the increasing use of netCDF-based standard CF (climate
    and forecast) conventions for scientific metadata in the earth sciences motivated
    the development of a separate API.


    Specifying the use of the HDF5 format in netCDF-4 programs eliminates limitations
    of the simpler netCDF "classic" format. The enhanced netCDF-4 data model supports
    user-defined types and data structures, hierarchies organizing large groups of
    named data, additional primitive types, and multiple dimensions along which may
    be appended. The underlying HDF5 storage layer also performs improvements consistent
    with the classic netCDF data model, such as per-variable compression, chunking,
    large dataset sizes, and efficient dynamic schema changes.


    Using the HDF5 format through netCDF-4 APIs for storing data and metadata results
    the features of netCDF-4 are a subset of the features of HDF5, so in the resulting
    file netCDF-4 can be accessed by HDF5 applications. Some representative artifacts
    specific to the netCDF data model, such as shared dimensions, are not interpreted
    by HDF5 APIs.


    Although every in netCDF-4 format is an HDF5 file, there are HDF5 files that are
    not netCDF-4 format files, because the netCDF-4 format internationally selects
    a subset of the HDF5 data model and file features. HDF5 features not supported
    in netCDF-4 include non-hierarchical group structures, HDF5 reference types, multiple
    links to a data object, user-defined atomic types lists, the HDF5 date/time type,
    and attributes associated with user-defined types. As a result, netCDF presents
    a simpler data model and API than HDF5, at the cost of sacrificing some of the
    power and generality of the more complex HDF5 data model and software.


    Parallel I/O is supported through a common API for both netCDF-4/HDF5 and netCDF-3
    classic format, the latter through access with a separate Parallel-netCDF library
    (see Chapter 15).


    # 16.4.1.2 Applications


    Internationally, netCDF has been especially popular among climate and ocean modelers;
    for example, its use (along with CF conventions)'
  merge: -1
  img_proc: true
- pgno: 236
  md: '# High Performance Parallel I/O


    mandated for the last two archives of the Climate Model Project, associated with
    IPCC assessment reports. More than 100 open-source software packages provide NetCDF
    access. NetCDF is also used in other disciplines, including chromatography, neuro-imaging,
    molecular dynamics, and fusion research. NetCDF data access is included with many
    commercial software packages, such as ESRI ArcGIS, MATLAB, and IDL.


    # 16.4.2 H5out


    # 16.4.2.1 Design


    Particle-based simulations running on large performance computing systems over
    many timesteps can generate an enormous amount of particle and field-based data
    for post-processing and analysis. Achieving high performance for I/O, effectively
    managing it and accessing it from analysis and visualization tools can be challenging,
    especially for domain scientists who do not have I/O and data management expertise.
    The H5out [7] library is an implementation of several data models for particle-based
    simulations that encapsulates the complexity of parallel HDF5 and is simple to
    use, yet does not compromise performance.


    H5out is a vener API for HDF5: H5out files are also valid HDF5 files and are compatible
    with other HDF5-based interfaces and tools. For example, the hdump tool that comes
    with NetCDF can export H5out files to ASCII or XML for additional portability.
    H5out also includes tools to convert H5out data to the Visualization Toolkit (VTK)
    format and to generate scripts for the GNUplot tool.


    H5out is tuned for writing collectively from all processors to a single shared
    file. Having collective I/O performance is typically (but not always) lower than
    that of file-per-processor, having a shared file simplifies scientific workflows
    when simulation data needs to be analyzed or visualized. In this scenario, the
    file-per-processor approach leads to data management headaches because large collections
    of files are unwieldy to manage from a file system standpoint. After a post-processing
    step is necessary to refactor file-per-processor data into a format that is readable
    by the analysis tool. In contrast, H5out files can be directly loaded in parallel
    by visualization tools like VisIt and ParaView.


    # 16.4.2.2 Applications


    OPAL (Object Oriented Parallel Accelerator Library) is a tool for simulating charged-particle
    optics in large accelerators and beam lines [1]. OPAL is based on $IP^2L$ [2]
    and provides a data parallel approach for particles, fields, and associated operators.
    Production runs of OPAL codes use several cores, on the order of $10^9$ simulation
    particles, and mesh resolutions on the order of $1024^3$, which can be saved for
    post-run analysis using H5out.'
  merge: -1
