  - '[PAGE 121]


    # EXAM 1


    HIS study guide reiterates the common approaches to solving Dynamic Programming
    problems, hits the highlights of Divide & Conquer.


    Dynamic Programming:


    +   **Longest Increasing Subsequence**: the key idea is that our subproblem at
    the $i^{th}$ character always includes $x_i$, so by the end we all have possible
    subsequences and take the best one. recursive relation


    $L(i) = 1 + \max_{1 \leq j < i} \{L(j) \mid x_j < x_i\}$


    Its running time is $O(n^2)$.


    +   **Longest Common Subsequence**: the key idea is that we can either increment
    $\ell$ if the end characters match, or simply preserve the longer one. recursive
    relation


    $L(i,j) = \begin{cases} 1 + L(i-1, j-1) & \text{if } x_i = y_j \ \max\{L(i-1,
    j), L(i, j-1)\} & \text{otherwise} \end{cases}$


    Its running time is $O(n)$.


    +   **Knapsack**: you want to fit as many of $n$ weighted objects into a particular
    container, with limited capacity $B$. The key idea is that you either add the
    current object into a knapsack that fits it, or use the last-best knapsack. recursive
    relation


    $K(i,b) = \begin{cases} v_i + K(i-1, b-w_i) & \text{if } w_i \leq b \ K(i-1, b)
    & \text{otherwise} \end{cases}$


    Its running time is pseudo-polynomial: $O(nB)$.


    +   **Knapsack (unlimited)**: in this variant, you can put as many copies of each
    object as you want into your container. the key idea is that we no longer need'
  - '[PAGE 122]


    # ALGORITHMS


    to track how many objects we have available anymore. The recursive relation is


    $K(b) = \max \{v_i + K(b - w_i) \mid 1 \leq i \leq n, w_i \leq b\$


    Its running time is still $\mathcal{O}(nB)$.


    +   **Matrix multiplication:** this approach differs from the rest in that its
    key idea is to split the problem into "left" and "right" subproblems. It fits
    problems that have some sort of "middle" in which side has already been solved.
    The recursive relation is


    $M(i, j) = \min_{i<k<j} \begin{cases} M(i, k) & \text{left subtree} \ M(k+1, j)
    & \text{right subtree} \ m_{i-1}m_j & \text{new cost} \end{cases}$


    Its running time is $\mathcal{O}(n^3)$.


    # Divide & Conquer:


    Honestly, the best key is the Master theorem:


    $T(n) = aT\left(\frac{n}{b}\right) + \mathcal{O}(n^d)\n = \begin{cases} \mathcal{O}(n^d)
    & \text{if } d > \log_b a \ \mathcal{O}(n^{\log_b a}) & \text{if } d = \log_b
    a \ \mathcal{O}(n^d \log n) & \text{if } d < \log_b a \end{cases}$n


    There are a lot of details, but a pattern that should help you remember it: b
    for bottom (logarithm base and denominator) and $a$ is the first letter so it
    comes before $T(\cdot)$. For the relationships themselves, if the "extra work"
    (that is, the $\mathcal{O}(n^d)$) is big, it dominates; if it matches, it contributes
    equally; and if it is lower, the recursion matters.


    It''s also useful to remember that binary search halves the problem space and
    follows only one of them; it''s recurrence:


    $T(n) = T\left(\frac{n}{2}\right) + \mathcal{O}(1) \sim \mathcal{O}(\log_2 n)$


    It makes a good baseline to judge your D&C algorithms on.


    Finally, you should understand (at least) the basics of the FFT; the section itself
    is one page long (ref. section 2.4), so it''s already condensed to the maximal
    degree.


    Good luck; have fun!'
  - "[PAGE 123]\n\n# EXAM 2\n\nHIS study guide hits all of the graph algorithms once\
    \ more, starting from search to spanning trees to max-flow.\n\nRemember, a graph\
    \ is denoted as $G = (V, E)$, and $n = |V|, m = |E|$ when discussing running time.\n\
    \n# Search\n\n+   - DFS: repeatedly runs EXPLORE($v$) on unvisited vertices, which\
    \ visits all vertices reachable from $v$. DFS also finds and labels each vertex\
    \ with its connected component, and tracks post-order numbers which identify cycles.\n\
    \  Its running time is linear, $\\mathcal{O}(n+m)$.\n- BFS: works like DFS, except\
    \ uses a queue instead of a stack to consider the next node to visit. It finds\
    \ shortest paths from a starting vertex, marking the dist[$v]$ array with the\
    \ distance $s \\sim v$.\n- Dijkstra's: works like BFS except uses a priority queue.\
    \ It finds the shortest path in a graph with positive edge weights from a starting\
    \ vertex $v$ to all vertices.\n  Its running time is $\\mathcal{O}((m+n)\\log\
    \ n)$.\n- SCC: finds the strongly-connected components of a digraph (ref. the\
    \ steps for how it works). The components form a DAG in topological order.\n \
    \ The algorithm relies on the property that the vertex with the highest post-order\
    \ number will always lie in a source strongly-connected component.\n  Its running\
    \ time is $\\mathcal{O}((m+n)\\log n)$.\n\n# MSTs\n\n+   - Kruskal's: greedily\
    \ identifies the MST of the graph.\n  Its running time is $\\mathcal{O}(m\\log\
    \ n)$.\n- Prim's: greedily identifies the MST of a graph, but keeps the intermediate\
    \ MST (that is, the subtree as its being built) connected, whereas Kruskal's algorithm"
  - '[PAGE 124]


    always connects the lowest-cost edge.


    Its running time is $\mathcal{O}(n+m) \log n$.


    # Max-Flow


    In addition to a digraph $G=(V, E)$, max-flow problems also include the edge capacities
    $\mathbf{c}$ (which are often denoted with $c_e$ for the edge $e \in E$), a starting
    source vertex $s$, and an ending sink vertex $t$. Capacities are always positive.


    Max-flow algorithms output a flow $f$, where $f_e$ is the flow along the edge
    $e \in E$. For every edge, a valid flow constitutes $0 \leq f_e \leq c_e$.


    +   **Residual network** describes the remaining capacity. It''s usually denoted
    $G''$.


    Computing a residual network takes linear time—$\mathcal{O}(m+n)$


    +   **Ford-Fulkerson**: solves for max flow given integer capacities.


    Its running time is pseudo-polynomial, $\mathcal{O}(mC)$, where $C$ is the size
    of the max-flow.


    +   **Edmonds-Karp**: solves max-flow for any valid flow network. It modifies
    Ford-Fulkerson by choosing the shortest path in the residual network rather than
    any path.


    Its running time is $\mathcal{O}(m^2n)$.


    +   The maximum flow also describes the minimum cut: all of the vertices reachable
    from $s$ in the residual graph one side of the cut, and the other vertices form
    the other.


