  md: '# CHAPTER 5: Linear Programming


    # 5.5.1 ILP is NP-Hard


    Many problems can be reduced to integer linear programming. While LPs are in the
    P complexity class, ILP is NP-hard; we will prove this by reducing the Max-SAT
    from earlier to ILP. Since Max-SAT is NP-hard, ILP must also be.


    Take the input $f$ from Max-SAT (the CNF Boolean function) and craft an ILP as
    follows:


    +   * For each variable $x_i \in f$, we set $y_i = x_i$ in the ILP.

    * For each clause $c_j$, add a $z_j$ indicating satisfiability.


    How do we express this? Well, given $c_j = (x_a \vee x_b \vee x_c)$, we want $z_j
    = 0$ if all of the $x_i$s are 0, right? So just sum them up!


    $z_j \le y_a + y_b + \dots$


    However, this does not work for clauses with complements, like $c_j = (\overline{x_a}
    \vee x_b \vee x_c)$, since $z_j = 0$ despite $y_a = 1$. To alleviate this, we
    look at the complement as well:


    $z_j \le (1 - y_a) + (1 - y_b) + \dots$


    Given this translation from $f$ to the ILP, we now want to maximize the number
    of satisfied clauses:


    | Objective Function: | $\max \sum_{j=1}^{m} z_j$ |

    | Subject to: | For all $i = 1, \dots, m: 0 \le y_i \le 1.\nFor all $j = 1, \dots,
    m: 0 \le z_j \le 1$. |


    Then, both the positive and complementary versions of $y_i$ should be: $\sum_{i
    \in C_j} y_i + \sum_{i \in C_j^c} (1 - y_i) \ge z_j$


    Finally, $y_i, z_j \in \mathbb{Z}$.


    Given this reduction and given the fact that Max-SAT is known to be NP-hard, ILP
    must also be NP-hard.


    Udacity ''18

    We relax the index to find some $y^*$ and $z^*$ that essentially define an upper
    bound on $m^*$, the maximum number of satisfiable clauses in $f$. By rounding
    said, we can find a feasible point in the ILP that is not far off the true optimal.
    In fact, we can prove that this results in a $(1 - \frac{1}{e})m^*$ approximation
    (where $e$ is the exponential, $e \approx 2.718\dots$) of Max-SAT.'
