  md: 'This is LP-dual: the maximization of the original objective function directly
    corresponds to the minimization of a new objective function based on the right-hand
    size of the constraints.


    More abstractly, when given a primal LP with $n$ variables and $m$ constraints
    in the canonical Standard Form:


    **Objective Function:** $\max c^T x$


    **Subject to:** $Ax \le b \n x \ge 0$


    The corresponding dual LP results in a minimization on $m$ variables and $n$ constraints:


    **Objective Function:** $\min b^T y$


    **Subject to:** $A^T y \ge c \n y \ge 0$


    where $y$ describes the linear combination of the original constraints.


    > EXAMPLE 5.1: Finding the Dual LP


    Given the following linear program:


    **Objective Function:** $\max[5x_1 - 7x_2 + 2x_3]$


    **Subject to:** $x_1 + x_2 - 4x_3 \le 1 \n x_1 - x_2 \ge 3x_1, x_2, x_3 \ge 0$


    **What’s the dual?**


    We can solve without thinking much by forming all of the matrices and vectors
    necessary and simply following the pattern described above.


    First, we need to transform the first constraint to follow standard form. This
    is trivial algebra: multiplying an inequality by a negative flips the sign. This
    gives us:


    ```

    $-1 \times (2x_1 - x_2) \ge -1 \times 3 \Longiff -2x_1 + x_2 \le -3$

    ```'
