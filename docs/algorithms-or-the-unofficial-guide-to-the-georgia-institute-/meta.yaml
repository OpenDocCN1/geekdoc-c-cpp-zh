    Then, we can multiply the correct powers of two to get $x^y$, so if $y=69$, we
    would use $x^{69} \equiv x^{64} \cdot x^{4} \pmod{N}$.


    ```

    ALGORITHM 4.1: MODExp($x, y, N$), the recursive fast modular exponentiation algorithm.

    ```


    **Input:** $x, y, N$, some $n$-bit positive integers.

    **Result:** $x^y \pmod N$


    ```

    if $y=0$ **then**

    \quad return $1$

    **end**

    $z = MODExp(x, \lfloor \frac{y}{2} \rfloor, N)$

    if $y$ is even **then**

    \quad return $z^2 \pmod N$

    **end**

    return $xz \pmod N$

    ```


    # 4.1.2 Inverses


    The **multiplicative inverse** of a number under a modulus $z$ is the value that
    makes their product 1. That is, $x$ is the multiplicative inverse of $z$ if $zx
    \equiv 1 \pmod{N}$. We say $x \equiv z^{-1} \pmod{N}$.


    Note that the multiplicative inverse does not always exist; if it does, it''s
    **unique**. They exist and **only** if their greatest common divisor is 1, so
    when $\gcd(x, N) = 1$. This is also called **relatively prime** or **coprime**.


    > QUICK MAFFS: Unique Multiplicative Inverse


    We claim that if $z$ has a multiplicative inverse mod $N$, then it is unique.
    The proof proceeds by contradiction.


    Suppose

    $z \equiv x^{-1} \quad \text{and} \quad z \equiv y^{-1} \pmod{N}$\nwhere $x \neq
    y \pmod{N}$. By definition, then

    $xz \equiv y \equiv 1 \pmod{N}$

    but then $x \equiv y \pmod{N}$, contradicting our claim.'
