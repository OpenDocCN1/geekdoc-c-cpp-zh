- md: "\n# CRYPTOGRAPHY\n\nIf you find this section fun, check out my notes on Applied\
    \ Cryptography.\n\nIn asymmetric cryptography, we typically deal with massive\
    \ integers (think 1024-bit values, where $2^{1024} \\approx 10^{308}$). This is\
    \ what ensures security: computational requirements work out to be $x$, so $N+r$\
    \ increase exponentially with bit lengths.\n\n## 4.1 Modular Arithmetic\n\nI'm\
    \ not going to review how modular arithmetic actually works, but we're likely\
    \ all seen it before: $x$ tells us if a number is odd or even, and a clock wraps\
    \ around every 12 hours. Generally-speaking, $x \\equiv y \\pmod{N}$ means that\
    \ $x/N$ and $y/N$ have the same remainder. By definition, $x \\pmod{N} = r$ if\
    \ there's a multiple of $N$ plus $r$ that works out to be $x$, so $qN+r=x$.\n\n\
    An equivalence class is the set of numbers which are equivalent under a modulus.\
    \ So 'mod 3' has 3 equivalence classes: $\\{-6, -3, 0, 3, 6, \\dots\\}$, $\\{-2,\
    \ 1, 4, 7, \\dots\\}$, and $\\{-1, 2, 5, \\dots\\}$.\n\n### 4.1.1 Modular Exponentiation\n\
    \nEquivalence in modular arithmetic works just like equality in normal arithmetic.\
    \ If $a \\equiv b \\pmod{N}$ and $c \\equiv d \\pmod{N}$ then $a+c \\equiv a+d\
    \ \\equiv b+d \\pmod{N}$.\n\nThis fact makes modular exponentiation possible.\
    \ Rather than doing $x^y \\pmod{N}$ via $x \\cdot x \\cdot \\dots$ or $((x \\\
    cdot x) \\cdot N) \\pmod{N}\\dots$, we leverage repeated squaring:\n\n```\n$x^y\
    \ \\mod N =\nx \\mod N = a_1$\nx^2 \\equiv a_1^2 (\\mod N) = a_2$\nx^4 \\equiv\
    \ a_2^2 (\\mod N) = a_3\n\\dots$\n```\n\nThen, we can multiply the correct powers\
    \ of two to get $x^y$, so if $y=69$, we would use $x^{69} \\equiv x^{64} \\cdot\
    \ x^{4} \\pmod{N}$.\n\n```\nALGORITHM 4.1: MODExp($x, y, N$), the recursive fast\
    \ modular exponentiation algorithm.\n```\n\n**Input:** $x, y, N$, some $n$-bit\
    \ positive integers.\n**Result:** $x^y \\pmod N$\n\n```\nif $y=0$ **then**\n\\\
    quad return $1$\n**end**\n$z = MODExp(x, \\lfloor \\frac{y}{2} \\rfloor, N)$\n\
    if $y$ is even **then**\n\\quad return $z^2 \\pmod N$\n**end**\nreturn $xz \\\
    pmod N$\n```\n\n### 4.1.2 Inverses\n\nThe **multiplicative inverse** of a number\
    \ under a modulus $z$ is the value that makes their product 1. That is, $x$ is\
    \ the multiplicative inverse of $z$ if $zx \\equiv 1 \\pmod{N}$. We say $x \\\
    equiv z^{-1} \\pmod{N}$.\n\nNote that the multiplicative inverse does not always\
    \ exist; if it does, it's **unique**. They exist and **only** if their greatest\
    \ common divisor is 1, so when $\\gcd(x, N) = 1$. This is also called **relatively\
    \ prime** or **coprime**.\n\n> QUICK MAFFS: Unique Multiplicative Inverse\n\n\
    We claim that if $z$ has a multiplicative inverse mod $N$, then it is unique.\
