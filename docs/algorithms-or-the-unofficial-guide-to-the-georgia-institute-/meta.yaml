    ## CHAPTER 2: Divide & Conquer


    $y = y_l \quad y_r$


    The original $x$ is a composition of its parts: $x = 2^{n/2}x_l + x_r$ (where
    the $2^{n/2}$ serves as a shift to move $x_l$ into place), and likewise for $y$.
    Thus,


    ```

    $xy = (2^{n/2}x_l + x_r)(2^{n/2}y_l + y_r)

    xy = 2^nx_ly_l + 2^{n/2}(x_ly_r + x_ry_l) + x_ry_r$

    ```


    This demonstrates a recursive way to calculate $xy$: it''s composed of $4^{n/2}$-bit
    multiplications. Of course, we are still doing this in $O(n^2)$ time.$^2$ there''s
    no improvement yet. We can now apply a similar trick to the one described in the
    earlier aside, though, and instead solve three subproblems?


    Beautifully, note that $x_ly_r + x_ry_l$ can be composed from the other multiplications:


    ```

    $(x_l+x_r)(y_l+y_r) = x_ly_l + x_ly_r + x_ry_l + x_ry_r

    \text{what we have} \quad \text{what we need have}

    ```


    If we let $A=x_ly_l, B=x_ry_r$, and $C=(x_l+x_r)(y_l+y_r)$, then we only need
    to combine subproblems:


    ```

    $xy = 2^n A + 2^{n/2}(C-A-B)$

    ```


    which is $O(n^{\sqrt{1.5}})$, better than before! Turns out, that time—is an even
    better D&C approach that''ll let us find the solution in $O(n \log n)$ time the
    fast Fourier transform—but will will require a foray into polynomials, complex
    numbers, and roots of unity that we''t get into right now.


    ## 2.2 Another Exercise in D&C: Median-Finding


    Suppose you have an unsorted list of numbers, $A=[a_1, a_2, \dots, a_n]$. Can
    you find its median value without needing to sort it? The $O(n)$ expense of sorting
    it? Turns out, you can. Let''s define the median value as being the $\frac{n}{2}$-smallest
    value in $A.$^3$


    Naively, we could sort $A$ then return the $k^{th}$ element, but let''s do better.
    Let''s choose a pivot, $p$, and divide $A$ into three sub-arrays: those less than
    $p$, those greater than $p$, and those equal to $p$:


    ```

    $A_{<p}, A_{=p}, A_{>p}$

    ```


    > ^2 You can refer to Solving Recurrence Relations or apply the Master theorem
    directly: $T(n)=4T(\frac{n}{2}) + O(n^2)$.


    > ^3 Critically, if it''s the $k^{th}$-smallest unique element, so ties are tied
    independently. That is, the $2^{nd}$ smallest of $[1, 2, 1]$ would be 1.


    Now we know which sublist the element we''re looking for is: if $k < |A_{<p}|$,
    we know it''s there. Similarly, if $|A_{<p}| < k < |A_{<p}| + |A_{=p}|$, we know
    it IS p. Finally, if $k > |A_{<p}| + |A_{=p}|$, then it''s in $A_{>p}$.


    Let''s look at a concrete example, (we randomly) choose $p = 11$:


    ```

    $A = [5, 2, 20, 17, 13, 8, 9, 11]$

    ```


    Then,


    ```

    $A_{<p} = [5, 2, 8, 9]

    A_{=p} = [11, 11]

    A_{>p} = [20, 17, 13]$

    ```


    If we''re looking for the $(k \le 4)^{th}$-smallest element, we know it''s in
    the first sublist and recurse on. If we''re looking for the $(k > 6)^{th}$ smallest
    element, then we want the $(k-6)^{th}$-smallest element in the last sublist (to
    offset the 6 elements in the two other lists we are now ignoring).


    Now the question is reduced to finding a good pivot, $p$. If we choose the median,
    this would divide the array into two equal subarrays and an array of the median
    values, so $|A_{<p}| \approx |A_{>p}|$. This means we *always* have our search
    space every time, but we also need to do $O(n)$ work to do the array-splitting;
    this gives us an $O(n)$ total running time, exactly what we''re looking for. However,
    this is a bit of a chicken-and-egg problem: our original problem is searching
    for the median, and now we''re saying if we know the median we could efficiently
    find the median? Great.


    What if, instead, we could find a pivot that is *close* to the median (say, within
    $\pm25\%$ of it). Namely, if we looked at a shifted version of $A$, our pivot
    would lie within the shaded region:


    ![](img/618d10cd4b9a60c3e651b4ab71cd8ece_24_0.png)


    In the worst case, then the size of our subproblem will be $3n/4$ of what it used
    to be: $T(n) = T(\left(\frac{3n}{4}\right) + O(n)$, which, significantly, still
    solves to $O(n)$. In fact, any valid subproblem that''s smaller than the original
    will solve to within $1/4$ of the median, but remember that with this notion of
    a good pivot as we recurse on a subproblem that is at least one element smaller
    than the previous problem, we''ll achieve linear time.


    If we chose a pivot randomly, our probability of choosing a good pivot is 50%.
    The ordering within the list doesn''t matter: exactly half of the elements make
    good pivots.


    We can check the size or not a chosen pivot is “good” in O(n) time that''s what
    splitting into subarrays means, and if it''s not a good p we just choose another
    one. Like with flipping a coin, the expectation of p being good is 2 “flips”4(that
    is, it''ll take two tries on average to find a good pivot). Thus, we can find
    a good pivot in O(n) on average (two tries of n-time each), and thus we find the
    nth-smallest element in O(n) on average since we have a good pivot. Finding the
    median is just we want to find the nth-smallest element.


