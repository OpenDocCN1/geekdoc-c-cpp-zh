- img_proc: true
  md: 'Now, just fill in the blanks:


    ```

    $\mathbf{c} = \begin{bmatrix} 5 & -7 & 2 \end{bmatrix}$

    $\mathbf{A} = \begin{bmatrix} 1 & 1 & -4 \ -2 & 1 & 0 \end{bmatrix}$

    $\mathbf{b} = \begin{bmatrix} 1 & -3 \end{bmatrix}$

    ```


    And transform this into our new LP:


    ```

    $\min \mathbf{b}^T\mathbf{y} \Longrightarrow \min[y_1 - 3y_2]$

    $\mathbf{A}^T\mathbf{y} \geq \mathbf{c} \Longrightarrow \begin{cases} y_1 - 2y_2
    & \geq 5 \ y_1 + y_2 & \geq -7 \ -4y_1 & \geq 2 \end{cases}$

    $\mathbf{y} \geq 0$

    ```


    An immediate consequence of the way we formed the dual LP is the **weak duality**
    theorem.


    > **Theorem 5.1** (Weak Duality). *Any feasible **x** for a primal LP is upper
    bounded by any feasible **y** for the corresponding dual LP:*


    $\mathbf{c}^T\mathbf{x} \leq \mathbf{b}^T\mathbf{y}$


    We used this theorem when we were proving the Max-Flow = Min-Cut Theorem. It leads
    to a number of useful corollaries.


    > **Corollary 5.3.1.** *If there exists a feasible **x** and feasible **y** that
    satisfy Theorem 5.1 more strictly:*


    $\mathbf{c}^T\mathbf{x} = \mathbf{b}^T\mathbf{y}$


    then these points are optima** for their respective LPs.


    > **Corollary 5.3.2.** *If the primal LP is **unbounded**, then the dual LP is
    **infeasible**. Similarly, if the dual LP is unbounded, then its corresponding
    primal LP is **infeasible**.*


    This corollary is one-way; it''s possible to have situations in which both the
    primal and the dual LPs are infeasible. As we''ve alluded to, this corollary is
    critical in identifying Invalid LPs. Specifically, we determine whether or not
    an LP is unbounded by checking the feasibility of its dual.'
