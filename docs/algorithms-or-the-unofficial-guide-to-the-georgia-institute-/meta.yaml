    # 1.1.1 Recursive Relations


    Let''s look at algorithm 1.1 through a different lens and actually try to map
    out the recursion tree as it develops.


    Suppose we want to calculate $F_5\dots$ our algorithm would then try to calculate
    $F_4$ and $F_3$ separately, which will try to calculate $F_3$ and $F_2$, and so
    on ...


    ![](img/618d10cd4b9a60c3e651b4ab71cd8ece_9_0.png)


    Notice the absurd duplication of work that we avoided with FIB2$(n)$... Is there
    a way we can represent the amount of work done when calling FIB2$(n)$ in a compact
    way?


    Suppose $T(n)$ represents the running time of FIB1$(n)$. Then, our running time
    is similar to the algorithm itself. Since the base cases run in constant time
    and each recursive case takes $T(n-1)$ and $T(n-2)$, respectively, we have:


    ```

    $T(n) \le O(T(n-1) + T(n-2))$

    ```


    So $T(n) \ge F_n$, that is, running time takes at least as much as the Fibonacci
    number itself! So $F_{50}=12,586,269,025$ steps (that''s 12.5 billion) to calculate
    with our naive formula...


    # THE GOLDEN RATIO


    Interestingly enough, the Fibonacci numbers grow exponentially in $\varphi$, the
    golden ratio, which is an interesting mathematical phenomenon that occurs in nature.'
