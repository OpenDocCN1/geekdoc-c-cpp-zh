    $v''_i \in S$。这满足了 $t$ 的第 $i^{th}$ 位为 1。


    然后，对于每个子句，将满足的文字包含 $S$ 并相应设置缓冲区；例如，如果你有 $c_j = (x_1 \lor \overline{x_2})$ 且赋值
    $x_1 = x_2 = F$，则包含 $v''_2$ 以及 $s_j, s''_j$，这满足了第 $(n+j)^{th}$ 位为 3。


    通常，为了证明一个特定问题是 NP-完全的，我们需要证明两个独立点：


    - 1. 首先，我们需要证明该问题 $\in \text{NP}$。这意味着问题的任何解都可以在多项式时间内被验证。

    - 2. 然后，我们需要将一个*已知的* NP-完全问题归约为新问题：


    也就是说，我们需要能够将*已知*问题的输入转换为*新*问题的输入。


    这涉及一个正确性的双向证明，正如我们所见：给定新问题的解，我们可以构造出一个新问题的解，反之亦然。


    一个不可判定问题是指无法为其构造算法的问题。其中一个问题就是艾伦·图灵的停机问题。


    停机问题：


    **输入：** 一个程序 $P$（任何语言）和一个输入 $I$。

    **输出：** 如果 $P(I)$ 终止，则输出“yes”，否则输出“no”。


    该证明本质上是通过反法完成的：如果存在这样的程序，它能确定自己是否会终止吗？假设 TERMINATOR(P, I) 是解决停机问题的算法。现在，让我们定义一个新的程序
    JOHNCONNOR(J)，它执行一个非常的操作序列：如果 TERMINATOR(J, J) 返回“yes”，则再次循环并终止，否则终止。


    有两种情况：


    - 如果 TERMINATOR(J, J) 返回“yes”，意味着 $J(J)$ 终止。在这种情况下，JOHNCONNOR(·) 将继续执行。

    - 如果不是，我们知道 $J(J)$ 永远不终止，所以 JOHNCONNOR(·) 停止运行。


    那么当我们调用 JOHNCONNOR(JohnConnor) 时会发生什么？


    - 如果 TERMINATOR(JohnConnor, JohnConnor) 返回“yes”，意味着 JOHNCONNOR(JohnConnor) 终止。但根据定义，我们调用的函数——JOHNCONNOR(JohnConnor)—将继续执行。这与
    TERMINATOR() 的输出矛盾。

    - 如果 TERMINATOR(JohnConnor, JohnConnor) 返回“no”，意味着 JOHNCONNOR(JohnConnor) 永远不终止，但它立即终止了。


    在两种情况下，我们都得到了一个悖论性的矛盾。因此，唯一的解释是函数 TERMINATOR() 不存在。停机问题是不可判定的。


    指南的这部分专门介绍加伯克大学 CS170（高效算法与不可处理问题）作业中的选定问题，该课程使用了相同的教材。我特别提到了 2016 年春季的作业，因为那是
