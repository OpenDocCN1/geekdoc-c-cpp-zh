    ```

    $xy = (2^{n/2}x_l + x_r)(2^{n/2}y_l + y_r)

    xy = 2^nx_ly_l + 2^{n/2}(x_ly_r + x_ry_l) + x_ry_r$

    ```


    这展示了一种计算 $xy$ 的递归方法：它由 $4^{n/2}$ 位的乘法组成。当然，我们仍然在 $O(n^2)$ 时间内完成此操作。$^2$ 目前还没有改进。不过，我们现在可以对之前旁注描述的技巧应用类似的技巧，改为解决三个子问题？


    妙的是，注意 $x_ly_r + x_ry_l$ 可以由其他乘法组成：


    ```

    $(x_l+x_r)(y_l+y_r) = x_ly_l + x_ly_r + x_ry_l + x_ry_r

    \text{我们拥有的} \quad \text{需要的}

    ```


    如果我们令 $A=x_ly_l, B=x_ry_r$，且 $C=(x_l+x_r)(y_l+y_r)$，那么我们只需要组合子问题：


    ```

    $xy = 2^n A + 2^{n/2}(C-A-B)$

    ```


    这是 $O(n^{\sqrt{1.5}})$，比之前要好！事实证明，这种时间——有一种更优的分治方法，能让我们在 $O(n \log n)$ 时间内找到解决方案，即快速傅里叶变换——但这需要对多项式、复数和单位根进行探索，我们现在还不会涉及。


    ## 2.2 另一个分治法练习：中位数查找


    假设你有一个无序的数字列表 $A=[a_1, a_2, \dots, a_n]$。你可以在不需要排序的情况下找到它的中位数吗？即不需要排序的 $O(n)$
    开销？事实证明，你可以的。我们将中位数定义为 $A$ 中第 $\frac{n}{2}$ 小的值。$^3$


    简单地来说，我们可以对 $A$ 排序然后返回第 $k$ 个元素，但我们可以做得更好。选择一个基准 $p$，并将 $A$ 分为三个子数组：小于 $p$ 的、大于
    $p$ 的以及等于 $p$ 的：


    ```

    $A_{<p}, A_{=p}, A_{>p}$

    ```


    > ^2 你可以参考求解递推关系或直接应用主定理：$T(n)=4T(\frac{n}{2}) + O(n^2)$。


    > ^3 关键在于，如果是第 $k$ 小的唯一元素，那么相同值将独立处理。也就是说，$[1, 2, 1]$ 中第二小的数是 1。


    现在我们知道我们要找的元素在哪个子列表中：如果 $k < |A_{<p}|$，我们就知道它在那里。同样，如果 $|A_{<p}| < k < |A_{<p}|
    + |A_{=p}|$，我们就知道它就是 $p$。最后，如果 $k > |A_{<p}| + |A_{=p}|$，那么它在 $A_{>p}$ 中。


    让我们来看一个具体的例子，我们（随机地）选择 $p = 11$：


    ```

    $A = [5, 2, 20, 17, 13, 8, 9]$

    ```


    然后，


    ```

    $A_{<p} = [5, 2, 8, 9]

    A_{=p} = [11, 11]

    A_{>p} = [20, 17, 13]$

    ```


    如果我们找的是第 $(k \le 4)$ 小的元素，我们就知道它在第一个子列表中继续递归。如果我们找的是第 $(k > 6)$ 小的元素，那么我们需要最后一个子列表中第
    $(k-6)$ 小的元素（以抵消我们现在忽略的两个列表中的 6 个元素）。


    现在问题变成了寻找一个良好的基准 $p$。如果我们选择中位数，它会将数组分为两个相等的子数组和一个中位数数组，所以 $|A_{<p}| \approx |A_{>p}|$。这意味着我们*总是*有一个搜索空间，但仍然需要
    $O(n)$ 的工作来拆分数组；这给了我们 $O(n)$ 的总运行时间，正是我们所寻找的。然而，这是一个鸡生蛋的问题：我们的原始问题是寻找中位数，而现在说如果我们知道中位数就可以高效地找到中位数？很好。


    相反，如果我们能找到一个*接近*中位数的基准（例如，在 $\pm25\%$ 范围内）。也就是说，如果我们查看 $A$ 的偏移版本，我们的基准将位于阴影区域：


    ![](img/618d10cd4b9a60c3e651b4ab71cd8_0.png)


    在最坏情况下，子问题的规模将是原来的 $3/4$：$T(n) = T(\left(\frac{3n}{4}\right) + O(n)$，这显著地变成了 $O(n)$。事实上，任何比原始问题小的子问题都会在中位数的
    $1/4$ 范围内解决，但记住这种良好基准的概念，我们在比上一个问题至少小一个元素的子问题上递归将实现线性时间。


    如果我们随机选择基准，选择良好基准的概率是 50%。列表内的顺序并不重要：正好一半的元素是良好的基准。


    我们可以检查所选基准在 $O(n)$ 时间内是否是“良好”的，这就是拆分为子数组的含义，如果它不是良好的 $p$，我们只选择另一个。就像抛硬币一样，$p$
    良好的期望是 2 次“抛掷”（也就是说，平均需要两次尝试才能找到一个良好的基准）。因此，我们平均可以在 $O(n)$ 内找到一个良好的基准（每次尝试需要 $n$
    时间），并且由于我们有一个良好的基准，我们平均可以在 $O(n)$ 内找到第 $k$ 小的元素。中位数只是我们想要找到的第 $k$ 小元素。


    ## 2.3 求解递推关系


    记住分治问题递推关系的典型形式：


    ```

    $T(n)=2T(\frac{n}{b})+f(n)$

    ```


    这里，$n$ 是输入问题的规模，$a$ 是递归调用中的子问题数量，$b$ 是每次递归调用中子问题规模缩小的因子，$f(n)$ 是任何额外非递归处理的复杂度。


    （注：原文后续部分存在大量重复，已根据指令按逻辑流进行去重清理）

