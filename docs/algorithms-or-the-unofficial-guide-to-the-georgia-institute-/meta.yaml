    really only need to consider 2-literal and 3-literal clauses with unique literals
    and convert them to a 4-literal clause to satisfy the requirements of `Exact-4SAT`.

    For the 3-case, we do this by forcing a new variable $a$ to be logically inconsistent:


    ```

    $x_1 \vee x_2 \vee x_3 \iff (x_1 \vee x_2 \vee x_3 \vee a) \wedge (\overline{a}
    \vee x_2 \vee x_3 \vee \overline{a})$

    ```


    Notice that if $a=T$, the original clause must be satisfied in the second clause,
    and vice-versa if $a=F$. We do the same for the 2-clause using two variables,
    always ensuring that the original clause still needs to be satisfied if either
    $a$ or $b$ are satisfied:


    ```

    $x_1 \vee x_2 \iff (x_1 \vee x_2 \vee a \vee b) \wedge (\overline{x_1} \vee \overline{x_2}
    \vee \overline{a} \vee \overline{b}) \wedge (x_1 \vee x_2 \vee \overline{a} \vee
    b) \wedge (\overline{x_1} \vee \overline{x_2} \vee a \vee \overline{b})$

    ```


    This completes the transformation and the correctness is self-evident from the
    construction.


