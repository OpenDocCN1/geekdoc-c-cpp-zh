    \ j] = 1 + L[i-1, j-1]$\n    **else**\n      $L[i, j] = \\max[L[i, j-1], L[i,\
    \ j-1]]$\n    **end**\n  **end**\n**return** $L[n, m]$\n```\n\n该算法的运行时间为 $\\mathcal{O}(n^2)$。\n\
    \n## 1.4 背包问题\n\n另一类可以用动态规划解决的流行问题被称为背包问题。通常，它们遵循一种公式：你必须从列表中选择出“符合”某些标准的最优对象，并使价值最大化。更正式地说，背包问题的结构如下：\n\
    \n**背包：**\n\n**输入：** 一组具有价值和重量的 $n$ 个对象：\n\n$V = \\{v_1, v_2, \\dots, v_n\\}$\n\
