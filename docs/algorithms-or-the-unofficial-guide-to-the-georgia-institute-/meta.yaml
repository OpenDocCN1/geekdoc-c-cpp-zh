  md: '# CRYPTOGRAPHY


    If you find this section fun, check out my notes on Applied Cryptography.


    In asymmetric cryptography, we typically deal with massive integers (think 1024-bit
    values, where $2^{1024} \approx 10^{308}$). This is what ensures security: computational
    requirements work out to be $x$, so $N+r$ increase exponentially with bit lengths.


    # 4.1 Modular Arithmetic


    I''m not going to review how modular arithmetic actually works, but we''re likely
    all seen it before: $x$ tells us if a number is odd or even, and a clock wraps
    around every 12 hours. Generally-speaking, $x \equiv y \pmod{N}$ means that $x/N$
    and $y/N$ have the same remainder. By definition, $x \pmod{N} = r$ if there''s
    a multiple of $N$ plus $r$ that works out to be $x$, so $qN+r=x$.


    An equivalence class is the set of numbers which are equivalent under a modulus.
    So ''mod 3'' has 3 equivalence classes: $\{-6, -3, 0, 3, 6, \dots\}$, $\{-2, 1,
    4, 7, \dots\}$, and $\{-1, 2, 5, \dots\}$.


    # 4.1.1 Modular Exponentiation


    Equivalence in modular arithmetic works just like equality in normal arithmetic.
    If $a \equiv b \pmod{N}$ and $c \equiv d \pmod{N}$ then $a+c \equiv a+d \equiv
    b+d \pmod{N}$.


    This fact makes modular exponentiation possible. Rather than doing $x^y \pmod{N}$
    via $x \cdot x \cdot \dots$ or $((x \cdot x) \cdot N) \pmod{N}\dots$, we leverage
    repeated squaring:


    ```

    $x^y \mod N =

    x \mod N = a_1\nx^2 \equiv a_1^2 (\mod N) = a_2\nx^4 \equiv a_2^2 (\mod N) = a_3\n\dots$

    ```'
