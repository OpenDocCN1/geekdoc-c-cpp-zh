    本节将介绍最大流最小切定理；重要的是注意的是，最大流等于最小切。


    # 第3 章：图


    ### 正向证明


    首先，我们的目标是证明最大流的大小小于最小切：


    $\text{最大流大小} \leq \text{最小切容量}$


    我们实际上可以通过证明一个更通用、更简单的方案来实现这一点，即对于任意流 $f$ 和任意切 $(L, R)$，$size(f) \leq \text{capacity}(L,
    R)$。


    **断言 1:** 对于任意流 $f$ 和任意切 $(L, R)$，$size(f) \leq \text{capacity}(L, R)$。


    设 $f$ 为一个流，$(L, R)$ 为一个切。流的大小是离开 $L$ 的流量减去进入 $L$ 的流量（注意 $R$ 不参与）：$size(f) = f^{out}(L)
    - f^{in}(L)$


    展开这个定义：流出是离开 $L$ 的边的总流量，流入同样是进入 $L$ 的边的总流量。


    $f^{out}(L) - f^{in}(L) = \sum_{(v,w) \in E, v \in L, w \in R} f_{vw} - \sum_{(w,v)
    \in E, w \in R, v \in L} f_{wv}$


    由于所有边 $f_{vw} \leq c_{vw}$，我们有：


    $f^{out}(L) - f^{in}(L) \leq \sum_{(v,w) \in E, v \in L, w \in R} c_{vw} = \text{capacity}(L,
    R)$


    现在考虑源点 $s$。根据定义，它的流入显然为零：


    $\sum_{v \in L \setminus s} (f^{out}(v) - f^{in}(v)) + f^{out}(s)$


