  md: '# LINEAR PROGRAMMING


    > Linear programming can be viewed as part of a great revolution-ary development
    which has given mankind the ability to state general goals and to lay out a path
    of detailed decisions to take in order to “best” achieve its goals when faced
    with practical situations of great complexity.


    George Dantzig, inventor of the simplex algorithm


    LINEAR programming is a general technique for solving optimization problems in
    which the goal (called the objective function) and the constraints can be expressed
    as linear functions.


    # 5.1 2D Walkthrough


    The following is an example of a scenario that can be tackled by linear programming:


    +   A company makes two types of products: A and B.


    Suppose each unit of A makes $1 of profit, while B makes $6 of profit. However,
    the factories operate under some constraints:


    +   * The machines can only produce up to 300 units of A and 200 units of B per
    day.

    * The workers can only (cumulatively) work 700 hours per day. A takes 1 to prepare
    for assembly by the machine, while B takes 3 hours.


    How many of each should they make to maximize their profits?


    Since our goal is to maximize profits, our variables are the quantities of each
    product to produce. They should be positive quantities, and shouldn’t exceed our
    labor supply and machine demand constraints.'
