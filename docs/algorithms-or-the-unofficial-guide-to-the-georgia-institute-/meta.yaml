    > Scott Anderson, complexity researcher


    THE purpose of finding a problem’s computational complexity class is to determine
    whether or not a problem is intractable, making it’ unlikely to be solvable efficiently.
    We define “efficiently” as “polynomial time.”


    We define NP as being the complexity class of all search problems. Roughly, a
    search problem is one we can efficiently verify solutions. Given an input and
    a proposed solution, it should be easy (i.e. doable in polynomial time) to verify
    whether or not that is correct.


    This leads to the P complexity class, which includes only search problems that
    are solvable in polynomial time. Thus, P  NP.


    The notion of P ≠ NP is a way of asking whether not solving a problem is equivalent
    to verifying a solution. Intuitively, it seems much more difficult to generate
    a proof or solution for a problem to verify its correctness.


    Terminology Obviously, P stands for polynomial time. Paradoxically, NP does not
    stand for non-polynomial time; instead NP specifies non-deterministic polynomial'
