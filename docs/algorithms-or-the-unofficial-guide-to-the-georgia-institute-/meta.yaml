    ## CHAPTER 6: Computational Complexity


    ### Independent Set Search:


    **Input:** An undirected graph, $G = (V, E)$.

    **A goal** $g$.


    **Output:** The independent set $S$ with size $|S| \ge g$, if one exists.


    Now


    ![](img/618d10cd4b9a60c3e651b4ab71cd8ece_87_0.png)


    ## Construction


    Consider again the 3SAT scenario: there''s an input $f$ with variables $x_1, \dots,
    x_n$ and clauses $c_1, \dots, c_m$ where each clause has at most 3 literals. We''ll
    define our graph $G$ with the goal matching the number of clauses: $g = m$. Then,
    for each clause $c_i$ in the graph, we''ll create $|c_i|$ vertices (the number
    of literals).


    **Clause Edges** We encode a particular clause as a subgraph by fully connecting
    its literals.


    So, for example, the clause $c = (x_1 \vee x_3 \vee x_2)$ is encoded as shown
    on the right.


    ![](img/618d10cd4b9a60c3e651b4ab71cd8ece_87_1.png)


    By construction, the resulting independent set $S$ has at most 1 vertex per clause,
    and since $g = m$, the solution has exactly 1 vertex per clause.


    **Variable Edges** In order to prevent the SAT assignment from creating contradictions,
    we need to add edges between any variable and its complement. For example, given
    the following $f$:


    $f(x_{1,5}) = (x_1 \vee \neg x_3 \vee x_2) \wedge (\neg x_1 \vee x_3 \vee \neg
    x_5)$


    ![](img/618d10cd4b9a60c3e651b4ab71cd8ece_87_2.png)


    we would craft the graph on the right, in which the solid edges are the clause
    edges we just defined and the dashed edge is the new variable edge.


    ## Correctness


    Given this formulation, we need to prove correctness in both directions. Namely,
    we need to show that if $f$ has a satisfying assignment, $G$ has an independent
    set whose size meets the goal, and vice-versa.


    ### Forward Direction


    We know that we start with an assignment that satisfies $f$. For each clause $c$,
    then, at least one vertex in its corresponding subgraph is set to true; add exactly
    one of the vertices to the independent set. There are $m$ clauses, and we get
    $|S| = m = g$ and fulfill our goal.


    Notice if the chosen vertex has a variable edge, then by definition its corresponding
    edge cannot be chosen (this would cause a contradiction in $f$''s assignment).
    Similarly, we did not include any clause edges by definition.


    ### Backward Direction


    This time, we start with an independent set of $G$ of at least size $g$. Since
    each clause''s subgraph is fully connected, and there are at least $g$ vertices,
    each clause must have a vertex. By setting the (vertices) literals to be true
    within $f$, we satisfy it.


    We''ve shown the equivalence between 3SAT and IS and hence proved that the independent
    set problem is NP-complete.


    ## Maximum Independent Set


    Remember that the Max-IS problem is not in NP. Furthermore, it''s easy to reduce
    the IS to the Max-IS problem: if we find the maximum $m^*$, $m^* \ge g$. This
    means that we can reduce any problem in NP to Max-IS (either by reducing IS or
    directly), but Max-IS itself is outside of NP.


    To denote that Max-IS is as hard as anything in NP, but we can''t say whether
    Max-IS is NP-complete itself, we say that it is NP-hard. In summary, by difficulty
    we say that $P \le NP-complete \le NP-hard$.


    ### 6.3.3 Cliques


    A clique (pronounced “k-IEK” like “frank”) is a fully-connected subgraph. Specifically,
    for a graph $G = (V,E)$, a subset $S \subseteq V$ is a clique if $\forall x, y
    \in S : (x, y) \in E$.


    Much like independent sets, the difficulty lies in finding big cliques, since
    like a single vertex there are trivially cliques.


    **Input:** A graph $G = (V, E)$ and a goal, $g$.

    **Output:** A subset of vertices, $S \subseteq V$ where $S$ is a clique whose
    size meets the goal, so $|S| \ge g$.


    Checking that $S$ is fully-connected takes $O(n^2)$ time, and checking that $|S|
    \ge g$ takes $O(n)$ time, so clique problem is NP. It''s also NP-complete: we
    can prove that this a reduction from the independent set problem.


    The key idea behind the reduction is that these problems are bipolar opposites:
    in a clique, there''s a full set of edges within $S$; in an independent set, there
    are no edges between $S$.


    The "opposite" of a graph $G=(V, E)$ is a graph such that all of its edges are
    not in $G$. In other words, $\overline{G}=(V, \overline{E})$ where $\overline{E}
    = \{(x, y) : (x, y) \notin E\}$. By definition, then, $S$ is a clique in $G$ if
    and only if $S$ is an independent set in $G$.


    Given an input $G=(V, E)$ and a goal $g$ for the IS problem, we form $\overline{G}$
    with size $g$ as inputs to the clique problem. If $S$ is a solution for the clique
    problem, it is a solution for the IS problem.


    ### 6.3.4 Vertex Cover


    A subset of vertices is a vertex cover if it covers every edge. Specifically,
    for $G=(V, E)$, $S \subset V$ is a vertex cover if $(u, v) \in E : u \in S$ or
    $v \in S$. Notice that every edge has at least one vertex present in the graph
    ![](img/618d10cd4b9a60c3e651b4ab71cd8ece_89_0.png). Finding a large vertex cover
    is easy, but finding the smallest one is hard. The NP-complete version of vertex
    cover problem is as follows:


    **Input:** A graph $G=(V, E)$ and a budget, $b$.

    **Output:** A set of vertices $S$ that forms a vertex cover with size under-budget,
    $|S| \le b$.


    To reaffirm that a solution to the vertex cover problem is valid polynomial time:
    simply check if either $u \in S$ or $v \in S$ for every edge $(u, v) \in E$, and
    check that $S$ is under-budget.


    **Key idea:** $S$ is a vertex cover if and only if $\overline{S}$ (the remaining
    vertices, so $\overline{S} = V \setminus S$) is an independent set.


    **Forward Direction** For every edge, at least one of the vertices will be in
    $S$ by definition of vertex cover. This means that no more than one vertex in
    $\overline{S}$; $\overline{S}$ has no edges which is an independent set.


    **Backward Direction** The rationale is almost the same. Given an independent
    set of size $g$ for $G=(V, E)$, the reduction to the vertex cover problem is then
    clear: let $b=|V|-g$ and run the vertex cover problem to get the solution $S$.
    By our above-proved claim, the solution to the IS problem is $S$.


    ### 6.3.5 Subset Sum


    The goal of the subset sum problem is to find some combination of integer values
    that sum up to another particular value. This is somewhat reminiscent of the knapsack
    problem without weights and with an exact goal. In fact, we''ve shown that this
    problem is NP-complete with a reduction from 3SAT, it will be simple to show that
    knapsack is also NP-complete.


    Subset Sum:

    - **Input:** A subset of positive integers, $\{a_1, \dots, a_n\}$ and a goal,
    $t$

    - **Output:** A subset $S \subseteq \{1, \dots, n\}$ such that $\sum_{i \in S}
    a_i = t$.


    This problem can be solved in $\mathcal{O}(nt)$ time with dynamic programming,
    but this is not polynomial in the input size; it would need to be in terms of
    $\log_2 t$ instead. Validating the subset sum problem $\in$ NP is straightforward:
    computing the sum takes $\mathcal{O}(n \log t)$ time, since each number uses at
    most $t$ bits.


