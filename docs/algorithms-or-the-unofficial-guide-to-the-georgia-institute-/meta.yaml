    # 3.7 Flow


    The idea of flow is exactly what it sounds like: given some resource and a network
    describing an infrastructure for that resource, a flow is a way to get said resource
    from one place to another. To model this more concretely as a graph problem, we
    have source and destination vertices and edges that correspond to “capacity” points;
    a flow is a path through the graph.


    Given such a network, it is not unreasonable to try to determine the maximum flow
    possible: what’s the maximum amount of resource sensible from s \~ t without exceeding
    any capacities?


    Formally, the input is a flow network: a directed graph G = (V, E), a designated
    s,t \in V, and a capacity for each e \in E : c_e > 0. The goal is to find a flow—that
    is, a set of “usages” on each edge—that does not exceed any’s capacity and maximizes
    the incoming flow to t.


    Notice from the example below that cycles in a flow network are not problematic:
    there’s simply no reason to utilize an entire cycle when finding a flow.


    ![](img/618d10cd4b9a60c3e651b4ab71cd8ece_48_0.png)


    The solution is as follows:'
- md: "\n# CHAPTER 3: Graphs\n\n![](img/618d10cd4b9a60c3e651b4ab71cd8ece_49_0.png)\n\
    \nThis is obvious the maximum flow because the total capacity incoming to $t$\
    \ is 12, so we've reached the hard cap. Namely,\n\n```\n$$size(f) = 6+1+5 = \\\
    frac{5+7}{12}$$\noutgoing incoming\n```\n\nThe key construction in calculating\
    \ the maximum flow network is the residual flow network, which effectively models\
    \ the flow capacities remaining in a graph as well as the “reverse flow.\\ Specifically,\
    \ the network $G^f = (V, E^f)$ is modeled with capacities $c^f$ such as:\n\n```\n\
    $$\\begin{cases} c_{uv} - f_{uv} & \\text{if } (u, v) \\in E \\text{ and } f_{uv}\
    \ < c_{uv} \\\\ f_{vu} & \\text{if } (u, v) \\in E \\text{ and } f_{vu} > 0 \\\
    end{cases}$$\n```\n\n## 3.7.1 Ford-Fulkerson Algorithm\n\nThe running time of\
    \ the Ford-Fulkerson algorithm is pseudo-polynomial in $O(C|E|)$, where $C$ is\
    \ the theoretical maximum output flow to $t$ (the sum of incoming vertices’ capacities).\
    \ \n\nThis analysis relies on a (huge) assumption that all capacities are integers;\
    \ then, the algorithm guarantees that the flow increases by $\\ge 1$ unit per\
    \ round. Since there are $\\le C$ rounds to the algorithm, and a single round\
    \ takes $O(n+m)$ time (dominated by path-finding), it requires $O(mC)$ time in\
    \ total (if $|E| \\ge |V|$ to simplify).\n\nIts correctness follows from the max-flow-min-cut\
    \ theorem, (and proven) later.\n\n## 3.7.2 Edmonds-Karp Algorithm\n\nThis fundamental\
    \ algorithm varies in the way it augments $f$. Rather than using any path (found\
    \ via depth-first search, for example), it uses the shortest path found by breadth-first\
    \ search. When this is the case, it can be proven that it takes at-most $mn$ rounds\
    \ to the maximum flow; thus, the overall running time of the Edmonds-Karp algorithm\
    \ is $\\mathcal{O}(nm^2)$.\n\n> FUN FACT: Record-Breaker\n> James Orlin created\
    \ a max-flow algorithm with a $\\mathcal{O}(mn)$ run time in 2013.\n\n**ALGORITHM\
    \ 3.4:** The Ford-Fulkerson algorithm for computing max-flow.\n\n**Input:** A\
    \ flow network: a digraph $G = (V,E)$, a capacity for each $e \\in E$, $c_e$,\
    \ and start/end vertices $s, t \\in V$.\n\n**Result:** The maximum flow graph,\
    \ where $f_e$ indicates the maximum flow along the edge $e \\in E$.\n\n```\n$\\\
    forall e \\in E: f_e = 0$\nrepeat:\n\\quad$Build the residual network, $G^f$ for\
    \ the current flow, $f$.\n\\quad$Find any path $P = s \\sim t$ in $G^f$.\n\\quad$Let\
    \ $c(P)$ be the smallest capacity along $P$ in $G^f$: $c(P) = \\min_c\\{e \\in\
    \ P\\}$.\n\\quad$Augment $f$ by $c(P)$ units along $P$.\nuntil no $s \\sim t$\
    \ path exists in $G^f$\nreturn $f$\n```\n\n## 3.7.3 Variant: Flow with Demands\n\
    \nThis variant on the max-flow problem poses demands on certain edges, requiring\
    \ that they have a particular capacity. We will see how to reduce this to the\
    \ regular max-flow problem.\n\nThe input is a flow network, as well as a demand\
    \ for each edge:\n\n$\\forall e \\in E: d(e) \\geq 0$\n\nA *feasible* flow $f$\
    \ is one that fulfills both the demand and does not exceed the capacity: $d(e)\
    \ \\leq f(e) \\leq c(e)$. If we can find the existence of a feasible flow, augmenting\
    \ it to the maximum feasible flow will be straightforward.\n\nWe want to find\
    \ a flow network—with graph $G' = (V', E')$ and edge capacities $c'(e)$—that we\
    \ can plug-play into our existing max-flow algorithms.\n\nIntegrating demands\
    \ into capacities is straightforward: an edge with capacity 5 and demand 3 is\
    \ similar to an edge with capacity 2 and no demand. This is the first step in\
    \ our reduction: $c'(e) = c(d) - d(e)$.\n\nThis is insufficient, though. We need\
    \ to model the demand itself. Each vertex has some amount of incoming demand and\
    \ some outgoing demand. To ensure its fulfillment, we connect every $v \\in V$\
    \ to a new \"master\" source $s'$ and sink $t'$. Namely,\n\n1. Add an edge $s'\
    \ \\to v$ with $c'(s', v) = d^{in}(v)$ (where $d^{in}(v)$ is the total incoming\
    \ demand to $v$) for every vertex except $s$.\n2. Add an edge $v \\to t'$ with\
    \ $c((v, t)) = d^{out}(v)$ for every vertex except $t$.\n\nFinally, to ensure\
    \ that the flow of $s$ matches the flow into $t$, we create an edge $t \\to s$\
    \ with $c'(t, s) = \\infty$.\n\nFor a flow $f$ in $G$, we know it cannot exceed\
