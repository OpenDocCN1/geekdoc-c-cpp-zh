    We spent all of our efforts in chapter 6 focused on search problems, which are
    a specific formulation of problems in NP (see section 6.1 for a recap). Here,
    we''ll show that these are equivalent in optimization problems which aim to find
    the "best" solution to their equivalent search problem.


    TSP Search:


    **Input:** A matrix of distances and a budget, b.


