    ## 演练：归约 (DPV 第8章)


    **输入：** 两个图 $G_1 = (V_1, E_1)$ 和 $G_2 = (V_2, E_2)$ 以及一个预算 $b$。


    **输出：** 两个顶点集 $V''_1 \subseteq V_1$ 和 $V''_2 \subseteq V_2$，使得从各自的图中删除这些顶点后，每个图至少剩余
    $b$ 个节点，并使得两个图完全相同。


    ## 解决方案


    起初似乎与上面的子图同构问题（见 8.10a）有关系，在某种意义上确实，因为所有的图问题都某种相似。我们通过从顶点覆盖问题归约来进行。


    **在NP内** 从技术上讲，为了在多项式时间内可验证，我们需要从一个顶点集合到另一个集合的映射，但如果我们只考虑通过相同的图结构来使图相等，那么这就非常简单。我们只需要确认顶点数量是否匹配（常数时间，如果你的数据结构很差，则是线性时间）并且它们是逐顶点对应的。我们可以通过在
    $O(mn)$ 时间内找到 $V_1 \setminus V''_1$ 中与 $V_2 \setminus V''_2$ 具有相同边的顶点来实现：比较每个顶点（长度
    $\le n$）的每个列表（边数 $\le m$），并对每个顶点执行此操作。由于最坏情况下两个图都可能是全连接的，总共需要 $O(n^3)$ 时间。


    **转换** 设 $G_1 = (V, E)$ 为原始图，$G_2 = (V_2, \emptyset)$ 为简单不连通图（其中 $b''$ 是 VC 问题输入的预算，而不是上述预算），且预算
    $b = b''$（意味着 $G_2$ 中的没有任何节点被移除）。那么，我们声称最大公共子图问题有解，当且仅当 VC 问题有解。


    **正向证明** 给定 VC 问题 $(G, b'')$ 的解 $V^* \subseteq V$，上述问题也有解，因为可以丢弃 $V''_1 = V^*$
    且 ($V''_2 = \emptyset$，因此不需要任何操作）。根据顶点覆盖的定义，$V \setminus V''_1$ 将不会留有任何边，并留下恰好
    $b = b'' = |V_2| = |V \setminus V''_1|$ 个顶点（因此与 $G_2$ 匹配）。


    **反向证明** 给定上述最大公共子图的解对 $(V''_1, V''_2)$，VC 问题也有解：从原始图中丢弃 $V''_2$ 并返回生成的顶点集即可。


    DPV 8.16:


    证明任何 NP 内的问题问题都可以在 $O(2^{p(n)})$ 时间内解决，其中 $p(n)$ 是某个多项式。


    解决方案：对于大小为 $n$ 个元素的输入，我们可以简单地对所有元素进行穷举搜索，因为验证它们的正确性需要多项式时间（根据其位于 NP 内的本质）。有 $2^n$
    个可能的输入，每个输入需要 $q(n)$ 时间进行验证（其中 $q$ 是验证算法），则其大 O 复杂度为：


    ```

    = O(2^n \cdot q(n))

    = O(2^n \cdot q(n))

    = O(2^{n+q(n)})

    ```


    如果我们令 $p(n) = n + q(n)$，任务就完成了。


    ## DPV 8.18: 打破 RSA


    证明如果 $P = NP$，RSA 可以在多项式时间内被破解。


    解决方案依赖于基础数学困难性：分解两个质数的乘积 $N = pq$ 在多项式时间内是不可行的。


    如果可以，那么寻找独立的 $p$ 和 $q$ 就会变得轻而易举，因为攻击者可以找到 $\varphi(N) = (p-1)(q-1)$ 并计算 $e$ 在模
    $\varphi(N)$ 下的逆（记得 $e = 1 \pmod{\varphi(N)}$，从而揭示解密密钥）。


    ## DPV 8.19: 风筝 (Kite)


    风筝是一个具有偶数顶点的图（$|V| = 2n$），其中 $n$ 个顶点形成一个团，另外 $n$ 个顶点通过一个“尾巴”连接，该尾巴是从尾部的一个顶点到全连接图的简单路径（非常字面上地考虑风筝和它的线，只不过风筝本身是全连接的）。


    风筝搜索：


    - **输入：** 图 $G = (V, E)$ 和目标 $g$。

    - **输出：** $G$ 的一个子图，该子图也是风筝且包含 $2g$ 个节点。


    ## 解决方案


    我们不是（至少）试图在一个图中寻找一个团和一些额外的东西（“尾巴”？）吗？这就是归约进行的方式。


    转换 如果风筝能找到解，团通过丢弃路径也能找到解，从 $(G, g)$（图和从任意顶点到寻找团的目标）的转换仅涉及从 $G$ 中的任意顶点开始添加一条长度为
    $g$ 的路径，以满足风筝的要求。为了证明：


    ![](img/618d10cd4b9a60c3e651b4ab71cd8ece_116_0.png)


    演练：归约 (DPV 第8章)


    **正向证明** 给定 $(G, g)$ 的解 $Q$，我们只需要在 $Q$ 中的任何一个顶点上添加一个长度为 $g$ 的“尾巴”，即可得到风筝问题的解。


    **反向证明** 给定转换后的图 $G$ 作为输入的风筝问题的解 $Q$，我们可以从解中丢弃尾巴以获得获取 $g$ 大小团的解。


    **DPV 8.20:** 我们必须证明以下问题是 NP 完全的：


    ## 支配集 (Dominating Set):


    - **输入：** 图 $G = (V, E)$ 和一个预算 $b$。

    - **输出：** 一个支配集 $D \subseteq V$，大小为 $|D| \leq b$，其中每个顶点 $v \in V$ 要么在 $D$ 中，要么在
    $D$ 中有一个邻居（如果存在）。


    ## 解决方案


    支配集的描述与顶点覆盖看起来非常相似；“预算”一词应该也包含我们。我们将从顶点覆盖问题归约到支配集问题。


    **转换** 给定一个图，我们修改每个边以使支配集包含一个顶点。


    **正向证明** 这是轻而易举的：顶点覆盖是一个支配集。


    **反向证明** 如果存在支配集，我们可以找到顶点覆盖。


    DPV 8.21: 混合化排序


