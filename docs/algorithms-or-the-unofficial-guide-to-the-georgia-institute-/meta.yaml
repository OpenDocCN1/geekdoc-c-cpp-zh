    ## 第 4 章：密码学


    - 3. 令 $N = pq$ 并发布公钥 $(N, e)$。

    - 4. 你的私钥是 $d \equiv e^{-1} \pmod{(p-1)(q-1)}$，我们知道它存在，并且可以通过扩展欧几里得算法找到。


    给定预期接收者的公钥 $(N, e)$ 和一条消息 $m \le N$，只需计算并发送 $c = m^e \pmod N$ 即可。这可以使用快速幂算法（见算法
    4.1）快速计算。


    接收到一个收到的密文 $c$ 以找到原始消息，只需计算 $c^d \pmod N = m$（同样使用算法 4.1）。


    ## 4.2 局限性


    为了使这种方法生效，消息必须足够小：$m < N$。这就是为什么非对称加密通常只用于交换一个对称密钥，然后该密钥被用于之后所有的消息。


    我们还需要处理 $m$，使得 $\gcd(m, N) = 1$。如果情况不是如此，等式 $m^{ed} \equiv m \pmod N$ 依然成立——尽管是通过中国剩余定理而非欧拉定理——但存在一个致命的缺陷。如果
    $\gcd(m, N) \neq 1$，那么 $p$ 或 $q$ 中必有一个是它。如果是 $p$，那么 $\gcd(m^e, N) = p$，且 $N$ 可以很容易被分解（如果是
    $q$ 也是如此）。


    同样，如果 $m$ 不能太小，那么可能会出现 $m^e < N$ 的情况——模数不起作用！


    另一个问题来自于通过不同的公钥多次发送同一条消息。可以使用中国剩余定理从密文中恢复出明文。令 $e = 3$，那么这三个密文为：


    ```

    $c_1 \equiv m^3 \pmod{N_1}$

    $c_2 \equiv m^3 \pmod{N_2}$

    $c_3 \equiv m^3 \pmod{N_3}$

    ```


    中国剩余定理规定 $c_1 \equiv c_2 \equiv c_3 \pmod{N_1 N_2 N_3}$，但这是没有经过模运算“展开”的 $m^3$。因此，$m
    = \sqrt[3]{m}$，且可以通过扩展欧几里得算法快速找到 $m$。


    ## 4.3 生成质数


    我们发现的最后一步是步骤 1：生成两个随机质数 $p$ 和 $q$。事实证明非常简单：只需生成随机位字符串，直到其中一个是质数为止。这之所以有效是因为质数是非常密的：对于一个
    $n$ 位数，我们平均运行 $n$ 次就能找到一个质数。


    既然如此，我们如何快速检查质性？


    ### 4.3.1 质性


    费马小定理提供了一种检查正质数的方法：如果一个随机选择的数 $r$ 是质数，则定理成立。然而，对定理检查所有 $r-1$ 个值是不够理想的：该检查需要耗费
    $\mathcal{O}(nr^2 \log n)$ 的时间。


    相反，识别一个数字为合数（非质数）会更快。如果定理不成立，我们应该能够找到任何特定的 $z$，使得 $z^{r-1} \neq 1 (\pmod r)$。这些被称为费马证人，每个合数至少有一个。


    这个“至少一个”是指平凡的费马证人：即 $\gcd(z,r) > 1$ 的那一个。大多数合数都有非平凡的费马证人：即 $\gcd(z,r) = 1$ 的那些。


    没有非平凡费马证人的合数被称为卡米凯尔数或“伪质数”。坦率地说，与普通合数相比，它们非常少，因此我们可以在质性测试中忽略它们。


    > **属性 4.1.** 如果合数 $r$ 至少有一个非平凡的费马证人，那么 $\{1, 2, \dots, r-1\}$ 中至少有一半的值是费马证人。


    上述属性启发了一种用于质性测试的随机算法，它可以以特定的确定程度识别质数：


    - 1. 随机选择 $z$：$z \overset{\mathcal{\sim}} \{1, 2, \dots, r-1\}$。

    - 2. 计算：$z^{r-1} \equiv 1 (\pmod r)$。

    - 3. 如果是，则 $r$ 是质数，这总是成立的。否则（如果 $r$ 是合数且不是卡米凯尔数），根据上述属性，该算法有一半概率是正确的。为了提高成功率并减少假阳性（$r$
    是合数但算法说它是质数的情况），我们多次选择 $z$。运行 $k$ 次，产生假阳性的概率为 $1/2^k$。


    ³ 我认为.. 我们有 $\log n$ 次模幂运算；每次都需要一些时间。


    '
