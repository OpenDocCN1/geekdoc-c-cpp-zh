    # 6.3.6 Summary


    ![](img/618d10cd4b9a60c3e651b4ab71cd8ece_93_0.png)


    In general to prove that a particular problem is NP-complete, we need to prove
    two separate things:


    +   1. First, we need to prove that said problem is $\in \text{NP}$. This means
    that any solution to the problem can be verified in polynomial time.

    2. Then, we need to reduce a *known* NP-complete problem to the new problem:


    ![](img/618d10cd4b9a60c3e651b4ab71cd8ece_93_1.png)


    Namely, we need to be able to transform inputs to the *known* problem to inputs
    to the *new* problem.


    This involves a bidirectional proof of correctness, as we''ve seen: given the
    solution to the new problem, we can formulate a solution to the new problem, and
    vice-versa.'
