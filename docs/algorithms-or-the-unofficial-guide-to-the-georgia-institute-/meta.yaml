    # CHAPTER 3: Graphs


    ![](img/618d10cd4b9a60c3e651b4ab71cd8ece_47_0.png)


    **Property 3.6 (cut property).** For an undirected graph, $G = (V, E)$, given:


    +   - a subset of edges that is also a subset of a minimum spanning tree $T$ of
    $G$ (even if $T$ is unknown); that is, for:


    $X \in E$ and $X \subset T$


    +   - and a subset of vertices $S \subset V$ where no edge of $X$ is in


    cut($S, S$)


    any of the minimum-weight edges, $e^*$, in the above cut will be in a new minimum
    spanning tree, $T''$. That is:


    $X \cup e^* \subset T''$


    That $T''$ after adding the $e^*$ described in Property 3.6 and the original (potentially
    unknown) $T$ may be different MSTs, but the purpose is to find any MST rather
    than a specific MST. Critically, the weight of $T''$ is *at most* the weight of
    $T$, so we''re always improving.


    # 3.6.3 Prim’s Algorithm


    This variant for creating the minimum spanning tree is reminiscent of Dijkstra’s
    algorithm. It’s still a greedy algorithm, which constrains the edges it considers.
    Its purpose is to always maintain a subtree along the way to finding the MST,
    so it will only consider edges that are connected, choosing the cheapest one.
    Its similarity to Dijkstra’s is reflected by its running time: $\mathcal{O}((m+n)
    \log n)$.'
