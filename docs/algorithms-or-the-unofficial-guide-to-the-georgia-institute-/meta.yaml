    \ in a contradiction, we could conclude that $f$ is not satisfiable. Purely from\
    \ the perspective of graph theory, having a path from $x_1$ to $\\overline{x_1}$\
    \ and vice-versa implies they're part of a connected component.\n\n**Property\
    \ 3.4.** If a literal $a_i$ and its inversion $\\overline{a_i}$ are part of the\
    \ same strongly-connected component, then $f$ is not satisfiable.\n\nWith this\
    \ property, we can prove when $f$ is satisfiable: if, for every variable $x, x_i$\
    \ and $\\overline{x_i}$ are in different strongly-connected components, then $f$\
    \ is satisfiable. Here's an algorithm that adds a little more structure to this\
    \ basic intuition:\n\n1. Find the sink SCC, $S$.\n2. Set $S = T$; that is, satisfy\
    \ all of the literals in $S$.\n3. Since these are all tail-ends of their implications,\
    \ the head will implicitly be satisfied. Thus, we can rip out $S$ from the graph\
    \ and repeat.\n4. Then, $S$ will be a source SCC, so that setting $\\overline{S}\
    \ = F$ has no effect (setting the head of an implication to false means we don't\
    \ need to follow any of its outgoing edges).\n\nThis relies on an important property\
    \ which deserves a proof.\n\n> **Property 3.5.** If $\\forall i$, the literals\
    \ $x_i$ and $\\overline{x_i}$ are in different strongly-connected components,\
    \ then:\n> $S$ is a sink SCC $\\iff \\overline{S}$ is a source SCC\n\nGiven this\
    \ property, we formalize the 2-SAT algorithm a little further:\n\n1. First, assume\
    \ that the Boolean function in CNF-form, $f$, has only two-literal clauses (since\
    \ we can force that to be the case by simplifying unit clauses).\n2. Construct\
    \ the graph $G$ for $f$.\n3. Find a sink SCC, $S$, using DFS and set $S = T$ and\
    \ $\\overline{S} = F$.\n4. Remove both $S$ and $\\overline{S}$.\n5. Repeat until\
    \ the graph is empty.\n\nThe only complex task here is finding SCCs which we know\
    \ linear time, so the overall running time is $\\mathcal{O}(n+m)$.\n\n## 3.6 Minimum\
