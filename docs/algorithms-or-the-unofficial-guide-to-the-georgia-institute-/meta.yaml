    # ### 5.1.1 Key Issues


    Even with this example, we can identify some key points and important issues.


    **Integers** Critically, the optimum does not have to be an integer point, despite
    the fact that it was in our example. We are optimizing over the *entire* feasible
    region; in our problem statement, though, a partial quantity of the $A$ or $B$
    products does not make sense. In fact, we have no way to enforce a constraint
    that our solution be an integer.


    This leads to an interesting conundrum: while linear programming is within the
    [complexity class](that, it''s solvable in polynomial time), integer linear programming
    (denoted ILP) is NP-complete. We''ll study this in more detail in chapter 6.


    **Optimum Convex** By its very nature, the optimum will lie on one of the vertices
    of the *convex* polygon bounded by our constraints. Even if other points are optimal,
    they will lie along a line (or plane in 3D, or *hyperplane* in $n-d$) which contains
    one of the vertices, so that vertex will be just as optimal.


    **Convexity** As an extension from the previous point, the feasible region will
    be a *convex* polygon: line segment connected by any two points within the region
    will still be contained within the region. If a vertex is better than its neighboring
    vertices in the polygon, it''s a global optimum.'
