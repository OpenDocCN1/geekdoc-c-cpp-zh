    \ $i$ 的 $X$ 和长度为 $j$ 的 $Y$ 的 LCS 长度。\n\n那么，最新的 LCS 长度取决于最后一个字符是否匹配：\n\n$$L(i,\
    \ j) = \\begin{cases} 1 + L(i-1, j-1) & \\text{如果 } x_i = y_j \\\\ \\max[L(i-1,\
