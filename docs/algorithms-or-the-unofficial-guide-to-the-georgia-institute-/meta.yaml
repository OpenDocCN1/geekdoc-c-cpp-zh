    \ be able to safely assume that our previous subproblems always give accurate\
    \ results. In other words, we'd know that $\\ell_i = 1$ because of the earlier\
    \ $y_2 = B$, so we can assume that our table will automatically build up.\n\n\
    | B | C | D |\n|---|---|---|\n| C | 1 | 2 | 2 |\n\nHow would we know that, though?\
    \ One would be to compare the new character $y_i$ to all of the previous characters\
    \ in $X$. Then, if $x_j = y_i$, we know that the LCS will increase, so we increment\
    \ $\\ell_i$. In other words,\n\n$$\\ell_i = 1 + \\max_{j<i}\\{\\ell_j \\mid x_j\
    \ = y_i\\}$$\n\nFor our example, when we're given $y_4 = C$, we see that $x_2\
    \ = C, \\ell_2 = 1$, so we set $\\ell_4 = 2$.\n\n### 1.3.2 Step 2: Find the Recurrence\n\
    \nUnder this mindset, what's our recurrence? We need to track $\\ell$ for every\
    \ character in our string, and each new character might increment any of the $j\
    \ < i$ subsequences before it. One might envision a matrix relating the characters\
    \ of one to the other, filled out row-by-row with the LCS length at each index:\n\
    \n| B | C | D | B |\n|---|---|---|---|\n| A | 0 | 0 | 0 | 0 |\n| B | 1 | 1 | 1\
    \ | 1 |\n| E | 1 | 1 | 1 | 1 |\n| C | 1 | 2 | 2 | 2 |\n\nWith the introduction\
    \ of each $i^{th}$ character, we need to compare to the previous characters in\
    \ the other string. We can't evaluate both $x_i$ and $y_i$ simultaneously (unless\
    \ they're equal), and we say $L(i,j)$ contains the LCS length for an $i$-length\
    \ $X$ and a $j$-length $Y$.\n\nThen, the latest LCS length is based on whether\
    \ or not the last characters match:\n\n$$L(i, j) = \\begin{cases} 1 + L(i-1, j-1)\
