    # 5.2.5 Invalid LPs


    Some linear programs will be infeasible, having no feasible region; this is dependent
    only on the constraints. Others will be unbounded, where the maximum objective
    function increases indefinitely; this is dependent only on the objective function.


    Feasibility Determining feasibility can be done by introducing a new unrestricted
    variable $z$ that we introduce into our constraints:


    ```

    from: \hspace{2cm}a_{1}x_{1}+\dots+a_{n}x_{n}\leq b\nnto:   \hspace{1cm}a_{1}x_{1}+\dots+a_{n}x_{n}+z\leq
    b$

    ```


    Satisfying this is trivial with a small-enough $z$ ($z \sim -infty$). However,
    if we could find a $z \geq 0$ that satisfies the new constraint, the original
    LP is feasible. We do this by actually running maximization on a new LP:


    ```

    Objective: max[|z|]

    Function:\nSubject to: Ax+z\leq b\n\quad x\geq 0

    ```


    Checking $z \geq 0$ tests feasibility and gives us a starting point for the simplex
    algorithm on the original LP.


    Unbounded Determining whether or not a linear program is unbounded depends on
    its dual LP (discussed next). Specifically, we''ll see that Corollary 5.3.2 tells
    us that an LP''s dual linear program is infeasible (which we can determine easily
    as we showed), the original is either unbounded or infeasible.


