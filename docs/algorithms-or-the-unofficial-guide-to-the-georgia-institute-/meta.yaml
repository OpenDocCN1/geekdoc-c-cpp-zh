  md: '# 1.5.2 Optimal Solution


    Do we even need $i$--the variable we use to track the objects available to us—anymore?
    Intuition says “no,” and we might formulate an even better solution because of
    it.


    Since we''re never considering the object set, we only really need to define our
    subproblem as an adjustment of the available capacity. Let''s define $K(b)$ as
    the maximum value achievable within the total weight $b \leq b$.


    Now we need to consider all *possibilities* of a last object, rather than restrict
    ourselves to the $i^{th}$ one, and take the best one. The recurrence can then
    be expressed as:


    ```

    $K(b) = \max \{v_i + K(b - w_i) \mid 1 \leq i \leq n, w_i \leq b\}$

    ```


    This is formalized in algorithm 1.6.


    **ALGORITHM 1.6**: KNAPSACKREPEATING(-), the generalized knapsack algorithm in
    which unlimited object repetition is allowed, finding an optimal multiset of values
    to fit in a capacity-limited container.


    +   **Input:** List of object weights: $W=\{w_1, \dots, w_n\}$\n**Input:** List
    of object values: $V=\{v_1, \dots, v_n\}$\n**Input:** A capacity, $B$.\n**Result:**
    The collection of objects (possibly with duplicates) resulting in the maximum
    total value without exceeding the knapsack capacity.


    ```

    $K \leftarrow 0$ // defines our 1D, B-element array, $K$.

    foreach $b \in [1..B]$ do\n  $K(b) = 0$\n  foreach $w_i \in W \mid w_i \leq b$
    do\n    $v \leftarrow v_i + K(b - w_i)$\n    if $v > K(b)$ then\n      $K(b) =
    v$\n  end\nend\nreturn $K(B)$

    ```'
