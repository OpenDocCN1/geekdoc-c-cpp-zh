    # 6.3.2 Independent Sets


    The subset of vertices $S \subset V$ is in an independent set if no edges are
    contained in $S$; in words, $x, y \in S; (x, y) \notin E$. Finding small independent
    sets is easy; finding large, or the $largest$ independent set is difficult.


    Maximum Independent Set:


    **Input:** An undirected graph, $G = (V, E)$.


    **Output:** The independent set $S$ of maximum size.


    This problem is not known to be $\in$ NP: the only way to check the validity of
    a solution to the problem is by solving it, and no polynomial-time algorithm for
    solving it is known.


