    \ undirected graph $G=(V,E)$ with weights $w(e)$ for $e \\in E$. The goal is to\
    \ find the minimal-size, minimum weight, connected subgraph that “spans” the graph.\
    \ Naturally, the overall weight of a tree is the sum of the weights of edges.\n\
    \nNote some basic properties about trees:\n\n- A tree on $n$ vertices has exactly\
    \ $n-1$ edges.\n- Exactly one path exists between every pair of vertices.\n- Any\
    \ connected $G=(V,E)$ with $|E|=|V|-1$ is a tree.\n\nThis last point bears repeating,\
    \ as it will be important in determining the minimum cut of a graph, later. The\
    \ only thing necessary to prove that a graph is a tree is to show that its edge\
    \ count is minus one.\n\n### 3.6.1 Greedy Approach: Kruskal’s Algorithm\n\nWe'll\
    \ attempt to build the minimum spanning tree by consistently building up from\
    \ vertices with the lowest cost without creating any cycles. Our running example\
    \ graph will:\n\n![](img/618d10cd4b9a60c3e651b4ab71cd8ece_44_0.png)\n\nThe first\
    \ 5 edges are extremely easy to determine, but the 6-cost edge would cause a cycle.\n\
    \nAll of the 7-cost edges can be added in without trouble—notice that them not\
    \ being connected is not relevant.\n\n![](img/618d10cd4b9a60c3e651b4ab71cd8ece_45_1.png)\n\
    \nFinally, but all the last 9-cost edge can be added to create a final MST of\
    \ the graph. Notice that the vertices touched by the unused 9-cost edge are connected\
    \ by a longer path.\n\n![](img/618d10cd4b9a60c3e651b4ab71cd8ece_45_2.png)\n\n\
    This is **Kruskal's algorithm**, and its formalized in **algorithm 3.3**, below.\
