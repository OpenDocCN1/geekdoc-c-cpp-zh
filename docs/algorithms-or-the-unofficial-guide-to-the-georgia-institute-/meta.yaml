    ## 5.2 泛化


    对于上面的简单例子，我们可以手动推算出并整齐地可视化，但它如何扩展到 3 个变量或任意的 $n$ 个变量呢？可视化很快就会变得非常困难。我们在上面观察到的最后关键点对于我们的生成至关重要，并将引出单纯形算法。


    从高层面上来说，它本质上是一种“局部贪心”算法：我们不断在凸多边形中选择更好的顶点，直到找到一个所有邻居都比它差的顶点，这就是全局最优解。


    ## 5.2.1 标准形式


    在设计求解线性规划的通用算法之前，我们需要对线性规划的表示方法进行标准化。


    给定 $n$ 个变量 $x_1, x_2, \dots, x_n$，目标是在由 $m \times n$ 矩阵 $A$ 和长度为 $m$ 的向量 $b$ 描述的约束条件下优化目标函数：


    | 目标函数: | $\max[c_1x_1 + c_2x_2 + \dots + c_nx_n]$ 或简单地为 $c^Tx$ |

    | :--- | :--- |

    | 约束条件: | $a_{11}x_1 + a_{12}x_2 + \dots + a_{1n}x_n \leq b_1$，$x_1 \geq 0$ |

    | | $a_{21}x_1 + a_{22}x_2 + \dots + a_{2n}x_n \leq b_2$ 和 $x_2 \geq 0$ |

    | | |

    | | $a_{m1}x_1 + a_{m2}x_2 + \dots + a_{mn}x_n \leq b_m$，$x_n \geq 0$ |

    | 或者满足 | $Ax \leq b$ 且 $x \geq 0$ |


    我们可以将问题集转换成遵循这种形式。然而，线性规划中**不允许**定义严格不等式的问题：请注意，例如 $\max_e[x < 100]$ 是没有定义的，因为我们可以拥有无限的精度。


    ## 5.2.2 示例：作为线性规划的最大流


    最大流问题可以表示为一个线性规划。让我们回顾它的表述：

    最大流定义：


    - 输入：一个有向图 $G = (V, E)$，容量 $c_e > 0, \forall e \in E$。源点和汇点 $s, t \in V$。

    - 输出：一个最优流 $f^*$，使得在保持有效流的情况下，任何 $f_e$ 都不能更大。


    为了将其表示为线性规划，我们的目标函数是最大化从源点出的流量，同时确保每条边都有有效的流：


    目标函数：

    max $\sum_{(s,v) \in E} f_{sv}$


    约束条件：

    对于每一个 $e \in E$：$0 \le f_e \le c_e$。

    对于每一个 $v \in V \setminus \{s,t\}$：$\sum_{(w,v) \in E} f_{wv} = \sum_{(v,z) \in
    E} f_{vz}$


    这里的每一项都是线性函数，因此适用于线性规划。


    ### 5.2.3 算法概述


    处理完通用问题表述后，我们可以开始寻找全局最优解的算法。记住，目标是找到凸多面体的顶点，该顶点相对于其邻居是最大值。


    对于 $n$ 个变量，我们在 $n$ 维空间中工作，有 $n+m$ 个约束。可行区域是 $n+m$ 个半空间的空间的交集，它形成了一个凸多面体。那么，多面体的顶点就是那些满足某些
    $n$ 个约束为等式约束，并同时满足其他 $m$ 个 $\le$ 约束的点。


    界限：在最坏的情况下，多面体中有大量的顶点：从 $n+m$ 个约束中选择 $n$ 个，$\mathcal{O}\binom{n+m}{n}$ 呈指数级增长。此外，每个顶点最多有
    $nm$ 个邻居。


    选择：有几种算法可以在多项式时间内求解线性规划，包括椭圆算法和内点法。单纯形算法的最坏情况时间界限是指数级时间，但它仍然被广泛使用，因为它保证了全局最优解，并且在巨大的线性规划上表现出色。


    ### 5.2.4 单纯形算法


    单纯形算法的基本高层思想非常简单。


    - 我们从 $x=0$ 开始，这满足我们的基准非负性约束。

    - 如果它不满足其他任何约束，我们就知道它是一个不可行的线性规划（LP）。

    - 然后，我们寻找目标值（严格）更高的邻居顶点。当我们找到时，我们就“移动”并重复这个过程。

    - 如果在任何时刻没有任何一个邻居是严格更好的，我们就找到了全局最优解。


    单纯形算法的变体在于对顶点的选择。我们可以选择第一个（以避免枚举它们），可以随机选择（以避免在多次运行中卡住），也可以只选择最好的（那么我们要付出枚举的代价）。对于该算法有许多不同的启发式，每种启发式都有它们自己的权衡。


    ## 5.2.5 无效线性规划


    某些线性规划是不可行的，没有可行区域；这仅取决于约束条件。另一些将是无界的，即最大目标函数会无限增长；这仅取决于目标函数。


    确定可行性：可以通过引入一个新的无限制变量 $z$ 来确定可行性；通过引入一个新的无限制变量 $z$ 来满足约束：


    $a_{11}x_1+\dots+a_{1n}x_n \leq b_1$

    $a_{21}x_1+\dots+a_{2n}x_n \leq b_2$

    ...

    $a_{m1}x_1+\dots+a_{mn}x_n \leq b_m$

    $x_1, x_2, \dots, x_n \geq 0$

    $z$ 是无限制的


    检查可行性：通过引入一个新的无限制变量 $z$ 来确定可行性；通过引入一个新的无限制变量 $z$ 来满足约束：


    $Ax \leq b$

    $x \geq 0$


    满足这些约束通过一个 $z \geq 0$ 是轻而易举的。


    无界：确定一个线性规划是否无界取决于其对偶规划（具体而言，我们将看到 5.3.2 告诉我们原问题是无界的或不可行的）。


    ## 5.3 对偶性


    假设给出了目标函数的一个值，并声称它是线性规划的最优解。我们可以验证这个吗？


    考虑一个简单的实：目标函数是约束的某种线性组合。例如，让我们处理这个 LP，其已知最优值为 $x^*$：


    目标函数：

    $\max[5x_1 - 7x_2 + 2x_3]$


    约束条件：

    $x_1 + x_2 - 4x_3 \leq 1$

    $x_1 - x_2 \geq 3$

    $x_1, x_2, x_3 \geq 0$


    我们如何找到这个 $y$？嗯，目标是找到一个 $y$，使得左侧大于目标函数。这等同于我们想要左侧至少等于目标函数。


    这是 LP 的对偶：原目标函数的最大化直接对应于基于约束大小的新目标函数的最小化。


    更抽象地说，给定一个具有 $n$ 个变量和 $m$ 个约束的标准形式的型问题 LP：


    目标函数：$\max c^T x$


    约束条件：$Ax \leq b \quad x \geq 0$


    对应的对偶 LP 得到 $m$ 个变量和 $n$ 个约束的最小化问题：


    目标函数：$\min b^T y$


    约束条件：$A^T y \geq c \quad y \geq 0$


    其中 $y$ 描述约束的线性组合。


    > 示例 5.1：寻找对偶 LP


    给定以下线性规划：


    目标函数：$\max[5x_1 - 7x_2 + 2x_3]$


    约束条件：

    $x_1 + x_2 - 4x_3 \leq 1$

    $x_1 - x_2 \geq 3$

    $x_1, x_2, x_3 \geq 0$


    **它的对偶是什么？**


    我们可以通过形成所有必要的矩阵和向量并简单按照上面描述的模式在不思考的情况下解决。


    首先，我们需要将第一个约束转换以遵循标准形式。这是简单的代数运算：将不等式乘以负数符号会翻转。这给出了：


    $-1 \times (2x_1 - x_2) \geq -1 \times 3 \Longiff -2x_1 + x_2 \leq -3$


    '
