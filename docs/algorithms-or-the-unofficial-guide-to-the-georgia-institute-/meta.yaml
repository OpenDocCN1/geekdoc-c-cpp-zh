  md: '# CHAPTER 1: Dynamic Programming


    $Y = ABE \leftarrow C$


    Wait, what if we built up $X$ character-by-character to identify where $C$ fits
    into LCSs? That is, we first compare $C$ to $X = B$, then to $X = BC$, then to
    $X = BCD$, tracking the length at each point in time? We''d need a list to track
    the best $\ell:


    | B | C | D |

    |---|---|---||

    | C | 0 | 1 | 1 |


    Hmm, but what happens if there already was a $C$? Imagine instead had $X'' = BCC$.
    By our logic, that would result in the length table:


    | B | C | C |

    |---|---|---||

    | C | 0 | 1 | 2 |


    However, by the very nature of dynamic programming, we should be able to safely
    assume that our previous subproblems always give accurate results. In other words,
    we''d know that $\ell_i = 1$ because of the earlier $y_2 = B$, so we can assume
    that our table will automatically build up.


    | B | C | D |

    |---|---|---||

    | C | 1 | 2 | 2 |


    How would we know that, though? One would be to compare the new character $y_i$
    to all of the previous characters in $X$. Then, if $x_j = y_i$, we know that the
    LCS will increase, so we increment $\ell_i$. In other words,


    > $$\ell_i = 1 + \max_{j<i}\{\ell_j \mid x_j = y_i\$\$


    For our example, when we''re given $y_4 = C$, we see that $x_2 = C, \ell_2 = 1$,
    so we set $\ell_4 = 2$.


    # 1.3.2 Step 2: Find the Recurrence


    Under this mindset, what''s our recurrence? We need to track $\ell$ for every
    character in our string, and each new character might increment any of the $j
    < i$ subsequences before it. One might envision a matrix relating the characters
    of one to the other, filled out row-by-row with the LCS length at each index:


    | B | C | D | B |

    |---|---|---|---||

    | A | 0 | 0 | 0 | 0 |

    | B | 1 | 1 | 1 | 1 |

    | E | 1 | 1 | 1 | 1 |

    | C | 1 | 2 | 2 | 2 |


    With the introduction of each $i^{th}$ character, we need to compare to the previous
    characters in the other string. We can''t evaluate both $x_i$ and $y_i$ simultaneously
    (unless they''re equal), and we say $L(i,j)$ contains the LCS length for an $i$-length
    $X$ and a $j$-length $Y$.'
