  md: 'you must select the optimal objects from a list that “fit” under some criteria
    and also maximize a value. More formally, knapsack problem is structured as follows:


    Knapsack:


    **Input:** A set of $n$ objects with values and weights:


    $V = \{v_1, v_2, \dots, v_n\}$


    $W = \{w_1, w_2, \dots, w_n\}$


    **Total capacity** $B$.


    **Output:** A subset $S \subseteq \{1, 2, \dots, n\}$ that both:


    +   (a) maximizes the total value: $\sum_{i \in S} v_i$


    +   (b) while fitting in the knapsack: $\sum_{i \in S} w_i \le B$


    There are two primary variants of the knapsack problem: in the first, there is
    only one copy of each object, whereas in the other case, objects can be repeatedly
    added to the knapsack without limit.


    # ### 1.4.1 Greedy Algorithm


    A natural approach to solving a problem like this might be to greedily grab the
    highest-valued object every time. Unfortunately, this does not always maximize
    the total value, and even simple examples can demonstrate this.


    Suppose we have the following values:


    $V = \{v_1 = 15, v_2 = 10, v_3 = 8, v_4 = 1\}$

    W = \{w_1 = 15, w_2 = 12, w_3 = 10, w_4 = 5\}$

    $B = 22$


    A greedy algorithm would sort the objects by their value-per-weight: $r_i \dots$.
    In this case (the objects are already ordered this way), it would take $v_1$,
    then $v_4$ (since taking on $w_1, w_3$ is the only one that can fit). However,
    that only adds up to 16, whereas the optimal solution would pick up $v_2$ and
    $v_3$, adding up to 18 and coming in exactly the best value.


    # ### 1.4.2 Optimal Algorithm


    As before, we” first define a subproblem in words, then try to express it as a
    recurrence relation.'
