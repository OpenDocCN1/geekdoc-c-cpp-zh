    ³ 这一点的证明相当相当直观：如果元图中存在环，那么就存在一种从某个顶点 $S$ 到另一个顶点 $S''$ 然后再回来的方法（根据定义）。然而，$S$ 和
    $S''$ 不可能相互连接，因为如果它们连接了，它们将是同一个强连通分量。因此我们得到了矛盾，且 SCC 之后的元图必须是 DAG。


    这引出了一个问题：我们如何找到 SCC？更具体地说，正如脚注 4 所解释的，我们如何找到汇分量内的任何顶点？


    有一个关键性质可以让我们找到这样的顶点：


    **性质 3.3. 在一般有向图中，访问顺序编号最高的顶点 $v$ 始终位于源强连通分量中。**


    给定这一性质，我们如何找到汇 SCC 中的顶点 $w$ 呢？嗯，如果我们能反转术语就太好了：我们可以找到一个源 SCC 并想要一个汇 SCC，但如果我们能找到汇
    SCC 并想要找到一个源 SCC 呢？好吧，如果我们直接……反转图呢？这样现在的顶点变成了源，反之亦然，我们可以使用上述性质找到一个在反图中是源但在原图中是汇的顶点！


    对于有图 $G=(V,E)$，我们考虑 $G^R=(V,E^R)$，即 $G$ 的反图，其中 $E^R=\{(u,v) : (v,u) \in E\}$ 是
    $E$ 中每条边的反。我们之前的概念仍然适用：$G$ 中的源 SCC 变成 $G^R$ 中的汇 SCC，反之亦然，因此拓扑排序后的 DAG 也同样被反转。从高层次来看，算法如下：


    - 1. 首先，反转图 $G^R$。

    - 2. 执行 DFS 得到一棵遍历树。

    - 3. 按后序编号递减排序顶点，以确定从原图开始 DFS 的顶点 $v$。

    - 4. 使用 DFS（来自算法 3.2）从 $G$ 的 $v$ 开始运行标准的连通分量算法——每当顶点探索结束时增加分量计数器 $cc$——标记每个 SCC。

    - 5. 当某个分量的 DFS 终止时，将 $v$ 设置为下一个未访问且后序编号最高的顶点，并回到第 4 步。

    - 6. 输出反拓扑排序的元图 DAG。


    ## 3.5 可满足性


    这是我们确定（强）连通分量算法的应用：求解 SAT 或可满足性问题。为了定义这个问题，我们首先需要一些术语：


    - 布尔变量 $x$ 可以赋值为真或假。

    - 文字面（Literal）是变量的形成形式：$x$ 或 $\bar{x}$，它表示为“非 $x$”。对于 $n$ 个变量，我们有 $2n$ 个文字面：$x_1,
    \bar{x}_1, x_2, \bar{x}_2, \dots, x_n, \bar{x}_n$

    - 子句（clause）是一系列用逻辑或（OR）连接的文字面。例如：$x_3 \vee \bar{x}_5 \vee \bar{x}_1$

    - 公式（formula）是一系列用逻辑与（AND）连接的子句。例如，以下是一个公式：$f = (x_3)_{\text{clause}} \wedge (x_3
    \vee \bar{x}_5)_{\text{clause}} \wedge (x_3 \vee \bar{x}_1 \vee \bar{x}_2) \wedge
    (\bar{x}_2 \vee x_1) \text{等}$。

    - 这种形式的公式——由 OR 连接的文字面组成的 AND 连接子句集——被称为合取标准范式，或 CNF。任何公式都可以转换为 CNF，但其规模可能会爆炸增长。


    要使一个子句被“满足”，它必须至少有一个文字面为真。要使一个公式满足，它的所有子句都必须满足。这是可满足性问题的完整定义：


    # SAT:


    **输入：** 一个由 $n$ 个变量 $(x_1, x_2, \dots, x_n)$ 和 $m$ 个子句组成的布尔函数 $f$。


    **输出：** 对 $n$ 个变量的赋值集合，使得公式被满足——如果不存在赋值，则输出“否”。


    虽然“找到一个并移除它”的相同逻辑也适用于源 SCC，但汇点更容易处理。如果 $v$ 是一个汇 SCC，那么 EXPLORE($v$) 会访问该 SCC 中的所有顶点且不再访问其他地方；所有访问的顶点都位于同一个集合中。这不适用于源顶点，因为探索不会结束得很快。


    ## 3.5.1 求解 2-SAT


    由于我们限制子句最多包含两个元素，我们可以将任何公式分为两类：要么所有子句都有两个元素，要么至少有一个单元子句（unit clause）。


    # 简化


    单元子句只有一个文字面的子句，例如 $(x_4)$。如果公式 $f$ 有单元子句，我们知道了更多关于满足性的条件，并采用基本策略。


    1. 找到一个单元子句，假设文字面为 $a_i$。

    2. 满足它，设置 $a_i = \mathcal{T}$。

    3. 移除 $a_i$ 的子句（因为它们已被满足），并在包含它的子句中删除文字面 $\overline{a_i}$。

    4. 令 $f''$ 为所得公式，然后回到第 1 步。


    显然，$f$ 可满足当仅 $f''$ 可满足。我们重复移除单元子句，直到 (a) 整个函数被满足或 (b) 只存在双文字面句。我们现在可以假设只有双文字面句并继续。


    # 图化2-SAT


    我们将 $n$ 个变量、$m$ 个子句的公式（每个子句都有两个文字面）转换为有向图：


    - $2n$ 个顶点对应 $x_1, \overline{x_1}, \dots, x_n, \overline{x_n}$。

    - $2n$ 条边对应每个子句的两个“蕴含”。


    通常情况下，给定子句 $(\alpha \vee \beta)$，蕴含图拥有边 $\overline{\alpha} \to \beta$ 和 $\overline{\beta}
    \to \alpha$。


    例如，


    ```

    $f = (\overline{x_1} \vee \overline{x_2}) \wedge (x_2 \vee x_3) \wedge (\overline{x_3}
    \vee x_1)$

    ```


    生成的图将是：


    ![](img/618d10cd4b9a60c3e651b4ab71cd8ece_42_0.png)


    现在，我们遵循特定文字面的路径。例如，这里是从 $x_1 = \mathcal{T}$ 开始的蕴含路径：


