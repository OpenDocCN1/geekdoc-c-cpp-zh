    # 2.4 Fast Fourier Transform


    Unfortunately, I don''t know enough about the fast Fourier transform to take good
    notes; this thesis just acts as a quick-reference guide.


    The $n^{th}$ roots of unity are defined as:


    ```

    $$\omega_n^1, \dots, \omega_n^{n-1}$

    ```


    where


    $$$\omega_n = e^{\frac{2\pi i}{n}}$$


    so, for example, the fourth element of the $8^{th}$ roots of unity is $\omega_8^4
    = \left(e^{\frac{2\pi i}{8}}\right)^4 = e^{\pi i}$.\nNotice that $\omega_n^n =
    \omega_n^0 = 1$.


    The FFT takes a list of $k$ constants and specifies the $n^{th}$ roots of unity
    to use. It outputs a list of evaluations of the polynomial defined by the constants.
    Namely, if $\mathcal{K} = \{c_0, c_1, \dots, c_{k-1}\}$ defines:


    ```

    $$\A(x) = c_0 + c_1x + c_2x^2 + \dots + c_{k-1}x^{k-1}$$

    ```


    The FFT of $\mathcal{K}$ roots of unity will return $n$ evaluations of $A(x)$:


    ```

    $$\z_1, z_2, \dots, z_n) = FFT(\mathcal{K}, \omega_n)$$

    ```


    The inverse Fourier transform just uses a scaled version of the FFT with the inverse
    roots of unity:


    ```

    $$\IFFT(\mathcal{K}, \omega_n) = \frac{1}{n}FFT(\mathcal{K}, \omega_n^{-1})$

    ```


    where $\omega_n^{-1}$ is the value that makes $\omega_n^{-1} \cdot \omega_n =
    1$. This is defined as $\omega_n^{n-1}$.


    ```

    $$\omega_n^{-1} = \omega_n^{n-1} = e^{\frac{2\pi i(n-1)}{n}}$

    ```


