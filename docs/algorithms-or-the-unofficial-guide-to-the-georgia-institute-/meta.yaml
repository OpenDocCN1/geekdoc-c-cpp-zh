    \ LCS（这只是之前的两个字符串）。如果不匹配，我们只考虑在没有使用 $x_i, y_j$ 时的最佳 LCS。\n\n我们的边界情况是显而易见的：$L(0,.)\
    \ = L(-,0) = 0$。也就是说，当寻找其中一个为空字符串的 LCS 时，长度显然为零。\n\n### 1.3.3 算法与运行时分析\n\n**算法\
    \ 1.4:** LCS ($S$)，一种使用动态规划寻找两个序列中最长公共子序列长度的方法。\n\n**输入：** $\\mathcal{X} = \\\
