  md: "Then, the latest LCS length is based on whether or not the last characters\
    \ match:\n\n```\n$L(i, j) = \\begin{cases} 1 + L(i-1, j-1) & \\text{if } x_i =\
    \ y_j \\ \\max[L(i-1, j), L(i, j-1)] & \\text{otherwise} \\end{cases}\n```\n\n\
    In other words, if the last characters match, we increment the LCS that would've\
