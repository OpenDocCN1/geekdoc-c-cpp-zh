    \n# Contents\n\n- 11 Exam 1 122\n- 12 Exam 2 124\n- 13 Exam 3 126\n\n# EXAM 1\n\
    \nHIS study guide reiterates the common approaches to solving Dynamic Programming\
    \ problems, hits the highlights of Divide & Conquer.\n\nDynamic Programming:\n\
    \n- **Longest Increasing Subsequence**: the key idea is that our subproblem at\
    \ the $i^{th}$ character always includes $x_i$, so by the end we all have possible\
    \ subsequences and take the best one. recursive relation\n\n$L(i) = 1 + \\max_{1\
    \ \\leq j < i} \\{L(j) \\mid x_j < x_i\\}$\n\nIts running time is $O(n^2)$.\n\n\
    - **Longest Common Subsequence**: the key idea is that we can either increment\
    \ $\\ell$ if the end characters match, or simply preserve the longer one. recursive\
    \ relation\n\n$L(i,j) = \\begin{cases} 1 + L(i-1, j-1) & \\text{if } x_i = y_j\
    \ \\\\ \\max\\{L(i-1, j), L(i, j-1)\\} & \\text{otherwise} \\end{cases}$\n\nIts\
    \ running time is $O(n)$.\n\n- **Knapsack**: you want to fit as many of $n$ weighted\
    \ objects into a particular container, with limited capacity $B$. The key idea\
    \ is that you either add the current object into a knapsack that fits it, or use\
    \ the last-best knapsack. recursive relation\n\n$K(i,b) = \\begin{cases} v_i +\
    \ K(i-1, b-w_i) & \\text{if } w_i \\leq b \\\\ K(i-1, b) & \\text{otherwise} \\\
    end{cases}$\n\nIts running time is pseudo-polynomial: $O(nB)$.\n\n- **Knapsack\
    \ (unlimited)**: in this variant, you can put as many copies of each object as\
    \ you want into your container. the key idea is that we no longer need to track\
    \ how many objects we have available anymore. The recursive relation is\n\n$K(b)\
    \ = \\max \\{v_i + K(b - w_i) \\mid 1 \\leq i \\leq n, w_i \\leq b\\}$\n\nIts\
    \ running time is still $\\mathcal{O}(nB)$.\n\n- **Matrix multiplication:** this\
    \ approach differs from the rest in that its key idea is to split the problem\
    \ into \"left\" and \"right\" subproblems. It fits problems that have some sort\
    \ of \"middle\" in which side has already been solved. The recursive relation\
    \ is\n\n$M(i, j) = \\min_{i<k<j} \\begin{cases} M(i, k) & \\text{left subtree}\
    \ \\\\ M(k+1, j) & \\text{right subtree} \\\\ m_{i-1}m_j & \\text{new cost} \\\
    end{cases}$\n\nIts running time is $\\mathcal{O}(n^3)$.\n\n# Divide & Conquer:\n\
    \nHonestly, the best key is the Master theorem:\n\n$T(n) = aT\\left(\\frac{n}{b}\\\
    right) + \\mathcal{O}(n^d) = \\begin{cases} \\mathcal{O}(n^d) & \\text{if } d\
    \ > \\log_b a \\\\ \\mathcal{O}(n^{\\log_b a}) & \\text{if } d = \\log_b a \\\\\
    \ \\mathcal{O}(n^d \\log n) & \\text{if } d < \\log_b a \\end{cases}$\n\nThere\
    \ are a lot of details, but a pattern that should help you remember it: b for\
    \ bottom (logarithm base and denominator) and $a$ is the first letter so it comes\
    \ before $T(\\cdot)$. For the relationships themselves, if the \"extra work\"\
    \ (that is, the $\\mathcal{O}(n^d)$) is big, it dominates; if it matches, it contributes\
    \ equally; and if it is lower, the recursion matters.\n\nIt's also useful to remember\
    \ that binary search halves the problem space and follows only one of them; it's\
    \ recurrence:\n\n$T(n) = T\\left(\\frac{n}{2}\\right) + \\mathcal{O}(1) \\sim\
    \ \\mathcal{O}(\\log_2 n)$\n\nIt makes a good baseline to judge your D&C algorithms\
    \ on.\n\nFinally, you should understand (at least) the basics of the FFT; the\
    \ section itself is one page long (ref. section 2.4), so it's already condensed\
    \ to the maximal degree.\n\nGood luck; have fun!\n\n# EXAM 2\n\nHIS study guide\
    \ hits all of the graph algorithms once more, starting from search to spanning\
    \ trees to max-flow.\n\nRemember, a graph is denoted as $G = (V, E)$, and $n =\
    \ |V|, m = |E|$ when discussing running time.\n\n# Search\n\n- DFS: repeatedly\
    \ runs EXPLORE($v$) on unvisited vertices, which visits all vertices reachable\
    \ from $v$. DFS also finds and labels each vertex with its connected component,\
    \ and tracks post-order numbers which identify cycles.\n  Its running time is\
    \ linear, $\\mathcal{O}(n+m)$.\n- BFS: works like DFS, except uses a queue instead\
    \ of a stack to consider the next node to visit. It finds shortest paths from\
    \ a starting vertex, marking the dist[$v$] array with the distance.\n- Dijkstra's:\
    \ works like BFS except uses a priority queue. It finds the shortest path from\
    \ a starting vertex $v$.\n  Its running time is $\\mathcal{O}((m+n) \\log n)$.\n\
    - SCC: finds the connected components of a digraph (ref. section 2.4). The components\
    \ form a DAG.\n  Its running time is $\\mathcal{O}(n+m)$.\n\n# MSTs\n\n- Kruskal's:\
    \ greedily identifies the MST.\n  Its running time is $\\mathcal{O}(m \\log n)$.\n\
    - Prim's: greedily builds the MST starting from a vertex.\n  Its running time\
    \ is $\\mathcal{O}(m+n \\log n)$.\n\n# Max-Flow\n\nIn addition to a digraph $G=(V,\
    \ E)$, max-flow problems also include the capacities $c$, a starting source $s$,\
    \ and an ending sink $t$. Capacities are always positive.\n\n- Residual network\
    \ describes the remaining capacity. It's usually denoted $G'$.\nComputing a residual\
    \ network takes linear time—$\\mathcal{O}(m+n)$.\n- Ford-Fulkerson: solves for\
