    \ \\end{cases}$$\n\nIn other words, if the last characters match, we increment\
    \ the LCS that would've resulted without those letters (which is just the previous\
    \ two strings). If they don't, we just consider the best LCS if we hadn't used\
    \ $x_i$, $y_j$.\n\nOur base case is trivial: $L(0,.) = L(-,0) = 0$. That is, when\
    \ finding the LCS strings where one of them is the empty string, the length is\
    \ obviously zero.\n\n### 1.3.3 Algorithm & Runtime Analysis\n\n**ALGORITHM 1.4:**\
    \ LCS ($S$), an approach to finding the length of the longest common subsequence\
    \ in two series using dynamic programming.\n\n**Input:** $\\mathcal{X} = \\{x_1,\
    \ \\dots, x_n\\}$, a series (numbers/letters).\n**Input:** $\\mathcal{Y} = \\\
    {y_1, \\dots, y_m\\}$, another series.\n**Result:** $L$, the length of the LCS\
    \ of $\\mathcal{X}$ and $\\mathcal{Y}$.\n\n```\n/* Initialize the LCS lengths\
    \ to a baseline. */\n$L_{n \\times m} := \\{0\\}$\n**for** $i \\in [1, n]$ **do**\n\
    \  **for** $j \\in [1, m]$ **do**\n    **if** $x_i = y_j$ **then**\n      $L[i,\
    \ j] = 1 + L[i-1, j-1]$\n    **else**\n      $L[i, j] = \\max[L[i, j-1], L[i,\
    \ j-1]]$\n    **end**\n  **end**\n**return** $L[n, m]$\n```\n\nThe running time\
    \ of the algorithm is $\\mathcal{O}(n^2)$.\n\n## 1.4 Knapsack\n\nAnother popular\
    \ class of problems that can be tackled with dynamic programming are known as\
    \ knapsack problems. In general, they follow a formulation in you must select\
    \ the optimal objects from a list that “fit” under some criteria and also maximize\
    \ a value. More formally, knapsack problem is structured as follows:\n\n**Knapsack:**\n\
    \n**Input:** A set of $n$ objects with values and weights:\n\n$V = \\{v_1, v_2,\
    \ \\dots, v_n\\}$\n\n$W = \\{w_1, w_2, \\dots, w_n\\}$\n\n**Total capacity** $B$.\n\
    \n**Output:** A subset $S \\subseteq \\{1, 2, \\dots, n\\}$ that both:\n\n- (a)\
    \ maximizes the total value: $\\sum_{i \\in S} v_i$\n- (b) while fitting in the\
    \ knapsack: $\\sum_{i \\in S} w_i \\le B$\n\nThere are two primary variants of\
    \ the knapsack problem: in the first, there is only one copy of each object, whereas\
    \ in the other case, objects can be repeatedly added to the knapsack without limit.\n\
    \n### 1.4.1 Greedy Algorithm\n\nA natural approach to solving a problem like this\
    \ might be to greedily grab the highest-valued object every time. Unfortunately,\
    \ this does not always maximize the total value, and even simple examples can\
    \ demonstrate this.\n\nSuppose we have the following values:\n\n$V = \\{v_1 =\
    \ 15, v_2 = 10, v_3 = 8, v_4 = 5\\}$\n$W = \\{w_1 = 15, w_2 = 12, w_3 = 10, w_4\
    \ = 7\\}$\n$B = 22$\n\nA greedy algorithm would sort the objects by value-per-weight:\n\
    \n- $v_1/w_1 = 1$\n- $v_2/w_2 = 0.83$\n- $v_3/w_3 = 0.8$\n- $v_4/w_4 = 0.71$\n\
    \nIn this case, it would pick $v_1$ and $v_3$ for a total value of 23. However,\
    \ picking $v_2$ and $v_4$ would give a total value of 27, showing that the greedy\
    \ approach is not optimal.\n\n### 1.4.2 Optimal Algorithm\n\nThe optimal way to\
    \ solve the knapsack problem is using dynamic programming. Let $K(i, j)$ be the\
    \ maximum value we can get using a subset of the first $i$ objects with a total\
    \ capacity $j$.\n\nThe recurrence relation is:\n\n$$K(i, j) = \\begin{cases} K(i-1,\
    \ j) & \\text{if } w_i > j \\\\ \\max(K(i-1, j), v_i + K(i-1, j-w_i)) & \\text{if\
    \ } w_i \\le j \\end{cases}$$\n\nThe base cases are $K(0, j) = 0$ and $K(i, 0)\
    \ = 0$. By filling the table, we can find the optimal value at $K(n, B)$.\n"
