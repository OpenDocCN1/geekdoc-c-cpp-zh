    sqrt{5}}{2} \\approx 1.6180\\dots$\n\nand the Fibonacci numbers increase exponentially\
    \ by approximately $\\frac{\\varphi^n}{\\sqrt{5}}$\n\n# # 1.2 Longest Increasing\
    \ Subsequence\n\nA common, more-practical example to demonstrate the power of\
    \ dynamic programming is finding the longest increasing subsequence in a series.\n\
    \nDEFINITIONS\nA **series** is just a list of numbers:\n 5, 7, 4, -3, 9, 1, 10,\
    \ 4, 5, 8, 9, 3\nA **subsequence** is a set of numbers from a series that is still\
    \ in order (but not necessarily consecutive):\n 4, 1, 9\n\nWhat we're looking\
    \ for in a longest-increasing-subsequence (or LIS) algorithm is the longest set\
    \ of ascending numbers that are *still in order* relative to the original series.\
    \ For our example above, that would be the subsequence:\n\n-3, 1, 4, 5, 8, 9\n\
    \nTo start off a little simpler, we'll be trying to find the length, so we'd want\
    \ our algorithm to output \"6\". Formally,\nIncreasing Subsequence:\n\n**Input:**\
    \ A series of numbers, $S = \\{x_1, x_2, \\dots, x_i\\}$.\n\n**Output:** The length\
    \ $\\ell$ of the subsequence $S' \\subseteq S$ such that the elements of $S'$\
    \ are in increasing (ascending) order.\n\n# # 1.2.1 Breaking Down Subproblems\n\
    \nLet's start by doing the first thing necessary for all dynamic programming problems:\
    \ identify shared work. Suppose our sequence was one element shorter:\n\n5, 7,\
    \ 4, -3, 9, 1, 10, 4, 5, 8, 9"
  - "[PAGE 11]\n\nIntuitively, wouldn't everything we need to stay the same? The only\
    \ thing that should matter is checking whether or not the new digit 3 can affect\
    \ our longest sequence in some way. And wouldn't 3 come into play for subsequences\
    \ that are currently smaller than 3?\n\nThat’s a good insight; at each step, we\
    \ need to compare the new digit to the largest element of all previous subsequences.\
    \ And since we don't need the subsequence itself, we only need to keep track of\
    \ its length and its maximum value. Note that we track all previous subsequences,\
    \ because the \"best\" at a given point in time will not necessarily be the best\
    \ one at every point in time as the series grows.\n\nWhat is a potential LIS maximum\
    \ value? Well, the last element in the subsequence is its maximum. Given a list\
    \ of numbers: $S = \\{x_1, x_2, \\dots, x_n\\}$, we’ll define our subsequence\
    \ $L(i)$ to be length of the longest increasing subsequence of $x_{1..i}$ that,\
    \ critically, includes $x_i$ itself.\n\nThen, we can define the recurrence we\
    \ just described above: at each \"next\" step, we find the best LIS we append\
    \ to $x_i$:\n\n```\n$L(i) = 1 + \\max_{1 \\leq j < i} \\{L(j) \\mid x_j < x_i\\\
    }$\n```\n\n# 1.2.2 Algorithm & Runtime Analysis\n\n**ALGORITHM 1.3:** LIS($S$),\
    \ an approach to finding the longest increasing subsequence in a series using\
    \ dynamic programming.\n\n**Input:** $S = \\{x_1, \\dots, x_n\\}$, a series of\
    \ numbers.\n**Result:** $L$, the length of the LIS of $S$.\n\n```\n/* Initialize\
    \ the LIS lengths to a baseline. */\n$\\mathcal{L} := 0$\nforeach $x_i \\in S$\
    \ do\n  $m := 1$\n  foreach $j \\in [1, i]$ do\n    /* find the best LIS to append\
    \ to */\n    if $x_i > x_j$, and $\\mathcal{L}[j] \\geq m$ then\n      $m = \\\
    mathcal{L}[j]$\n    end\n  $\\mathcal{L}[i] = m + 1$\nend\nreturn $\\mathcal{L}$\n\
    ```\n\nThe running time of the algorithm is $\\mathcal{O}(n^2)$ due to the double\
    \ for-loop over (up to)"
