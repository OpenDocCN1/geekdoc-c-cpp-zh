  md: "# 3.5.1 Solving 2-SAT Problems\n\nSince we are limiting our clauses have up\
    \ to two elements, we can break any formula down into two categories: either all\
    \ of the clauses have two elements, or at least one is a unit clause.\n\n# Simplifying\n\
    \nA unit clause is a clause with a single literal, such as $(x_4)$. If a formula\
    \ $f$ has unit clauses, we know more about the satisfiability conditions and can\
    \ employ a basic strategy.\n\n+   1. Find a unit clause, say the literal $a_i$.\n\
    2. Satisfy it, setting $a_i = \\mathcal{T}$.\n3. Remove clauses containing $a_i$\
    \ (since they're now satisfied) and drop the literal $\\overline{a_i}$ from any\
    \ clauses that contain it.\n4. Let $f'$ be the resulting formula, then go to Step\
    \ 1.\n\nObviously, if $f$ is satisfiable iff $f'$ is satisfiable. We repeatedly\
    \ remove unit clauses until either (a) the whole function is satisfied or (b)\
    \ only two-literal clauses exist. We can now proceed as if we only have two-literal\
    \ clauses.\n\n# Graphing 2-SATs\n\nLet's convert our $n$-variable, m-clause formula\
    \ (where every clause has two literals) to a directed graph:\n\n+   * $2n$ vertices\
    \ corresponding to $x_1, \\overline{x_1}, \\dots, x_n, \\overline{x_n}$.\n* $2n$\
