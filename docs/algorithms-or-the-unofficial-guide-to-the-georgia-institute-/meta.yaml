    \ Complexity into an at-a-glance quick-reference for the important concepts.\n\
    \n# Linear Programming:\n\n+   - LPs are just systems of inequalities.\n- LPs\
    \ work because of convexity: given the vertices bounding the feasible region,\
    \ convexity guarantees that greedily jumping to a better neighbor leads to optima.\n\
    - LPs don't always have optima: an LP can be infeasible based on its constraints,\
    \ and unbounded based on its objective function.\n  - Feasibility is tested by\
    \ adding a z and checking if it's positive in the best case on the new LP: Ax\
    \ z ≥ b.\n  - Boundedness is tested by checking the feasibility of the dual LP:\
    \ if the dual is infeasible, then the primal is either unbounded or infeasible.\n\
    \n+   - Dual LPs:\n\n+   - The dual of an LP finds y—the smallest constants that\
    \ can be applied to the primal constraints and find the same optima—takes the\
    \ following form:\n```\nmax cᵀy  Ax ≤ b    ⇔ min bᵀy c\n       x ≥ 0    y ≥ 0\n\
    ```\n- If the dual is infeasible, the primal must either be unbounded or infeasible\
    \ (you can tell which by doing the feasibility test).\n- weak duality basically\
    \ states that the primal is bounded by the dual for any feasible point: cᵀx ≤\
    \ bᵀ.\n- strong duality states that if you find the same feasible point in both\
    \ the primal and the dual that is an optimum.\n- Optima only exist if both LPs\
    \ are feasible and bounded."
  merge: -1
  pgno: 125
- img_proc: true
  md: "# ALGORITHMS\n\n+   - We can approximate Max-SAT—where $m^*$ is the theoretical\
    \ maximum number of satisfiable clauses—to have a $\\frac{8}{7}m^*$ algorithm\
    \ in polynomial time.\n- Finding integer solutions to LPs (ILPs) is NP-hard by\
    \ a reduction from MaxSAT.\n- ILPs can be approximated by rounding, and are often\
    \ approximated with randomized algorithms that can make some “closeness” guarantees.\n\
    \n# Complexity:\n\n+   - In terms of difficulty, $P \\leq NP$-complete $\\leq$\
    \ NP-hard (we use $\\leq$ since it's unknown if $P \neq NP$).\n- 3SAT can be constrained\
    \ to have variables appear no more than thrice.\n- $S \\subseteq V$ is a clique\
    \ in $\\overline{G}$ and **only if** $S$ is an independent set in $G$.\n- $S$\
    \ will be a vertex cover if **only if** $\\overline{S} = V \\setminus S$ is an\
    \ independent set.\n\n+   - Known NP-complete problems and their (brief) reductions\
    \ intuitions:\n    - SAT — Subset Sum\n    - $k$-coloring — Hitting Set—reduction\
    \ from VC by making each edge a set, so the hitting set always contains one vertex\
    \ from each edge\n    - Rudrata Path — Dominating Set—reduction from VC by forcing\
    \ all edges to have a vertex in $D$ through a triangle formation\n    - 3SAT—reduction\
    \ from SAT by introducing a $y_i$ to break clauses into sets of 2 (plus $y_i$).\n\
    \    - Stingy SAT—generalization of SAT — Maximum Common Subgraph—reduction from\
    \ VC where keep the original graph and try to match to $b$ disconnected vertices\
    \ (which would be a VC)\n    - IS—reduction from SAT by fullyconnecting clauses\
    \ and variables.\n    - VC—reduction from the IS fact — Kite—reduction from clique\
    \ simple by adding a kite tail\n\n+   - Proving a problem is NP-complete is done\
    \ either by *reduction* from a known NP-complete problem or *generalization* to\
    \ an NP-complete problem. In both cases, you first need to show that the solution\
    \ is verifiable in polynomial time to make the problem within NP.\n- For reductions,\
    \ you need a polynomial time transformation and a bidirectional"
  merge: -1
  pgno: 126
- img_proc: true
  md: 'Quick Reference:


    proof of correctness that a solution exists for $A$ if and **only** if it exists
    for $B$ (on the transformed inputs / outputs).


    +   - Useful generalizations include:


    +   - **Subgraph isomorphism**, where you try to transform some generic graph
    $H$ into a specific graph $G$ by dropping vertices (generalization of Clique,
    where $G$ is a clique you want to find)


    +   - **Longest path**, where you want to find the longest non-self-intersecting
    path (generalization of the Rudrata cycle).


    +   - **Dense subgraph**, where you want to find $a$ vertices in a graph that
    contain $b$ edges (generalization of independent set where you want to find vertices
    that contain $no$ edges between them).


    As always, GL;HF!'
