  md: "# ALGORITHMS\n\n# ALGORITHM 1.1: FIB1($n$), a naïve, recursive Fibonacci algorithm.\n\
    \n```\n**Input:** An integer $n \\ge 0$.\n**Result:** $F_n$\nif $n \\le 1$ then\n\
    \  return $n\nend\nreturn FIB1($n-1$) + FIB1($n-2)\n```\n\nbuilds up to it, saving\
    \ intermediate Fibonnacci numbers in an array.\n\n# ALGORITHM 1.2: FIB2($n$),\
    \ an improved, iterative Fibonacci algorithm.\n\n```\n**Input:** An integer $n\
    \ \\ge 0$.\n**Result:** $F_n$\nif $n \\le 1$ then\n  return $n\nend\n$\\mathcal{F}\
    \ := \\{0,1\\$\nforeach $i \\in [2,n]$ do\n  $\\mathcal{F}[i] = \\mathcal{F}[i-1]\
    \ + \\mathcal{F}[i-2]$\nend\n$\\mathcal{F}[n]$\n```\n\nThe essence of dynamic\
    \ programming lies in identifying the potential to implement it once. Identifying\
    \ the two main principles:\n\n+   - avoid repetitive work and instead store it\
    \ once. Identifying the overlapping subproblems (like the fact that $F_{n-1}$\
    \ and $F_{n-2}$ share large amounts of work) is a key part in developing a dynamic\
    \ programming approach. This means you should not shy away from high memory usage\
    \ when implementing a dynamic programming algorithm—the speed savings from caching\
    \ repeated intermediate results outweigh the \"cost\" of memory.\n- avoid recursion\
    \ and use an iterative approach. This point is actually **not** universal when\
    \ it comes to dynamic programming and pertains specifically to our course. We\
    \ could have likewise made algorithm 1.2 pass around an array parameter to a recursive\
    \ version; this would be an example of a memoization technique.\n\nKudraytsev\
    \ 9"
