    # ALGORITHMS


    **Input:** A graph $G = (V, E)$.

    A pair of start and end vertices, $s, t \in V$.


    **Output:** Whether or not the graph has a Rudrata path.


    Given a polynomial-time algorithm to the above problem, we must relate it to its
    search equivalent in which we want the actual path itself.


    **Solution** This is damn-near trivial: we iteratively remove edges (in an arbitrary,
    predetermined order) from $G$ and check if there''s still a Rudrata path. If there
    is, keep the edge removed permanently. Then we''ll be left with edges that are
    essential to the Rudrata path and thus *are* the Rudrata path. All of these operations
    take polynomial time, so the resulting algorithm is still polynomial (even if
    it''s $O(n^{(E)})$, for example).


    # DPV 8.3: Stingy SAT


    We must prove that the following problem is NP-complete:


    **Stingy SAT:**


    **Input:** A Boolean formula in CNF with $m$ clauses composed of $n$ variables.


    An integer $k$.


    **Output:** A satisfying assignment in which $\le k$ variables are set to true,
    if such an assignment exists.


    **Solution** This is a *generalization* of SAT: simply let $k = n$ to allow every
    variable to be set to true if necessary. The result is obviously still to the
    original SAT.


