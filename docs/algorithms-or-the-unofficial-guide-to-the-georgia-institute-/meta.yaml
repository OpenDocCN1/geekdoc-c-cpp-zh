    Max-SAT：


    - **输入：** 一个处于合取范式（CNF）的布尔公式 $f$，包含 $n$ 个变量和 $m$ 个子句。

    - **输出：** 一个使 $f$ 中满足的子句数量最多的赋值。


    该版本的问题是 NP 的；尽管它和完全 SAT 一样困难，但我们不再有简单的方法来检查是否真的是最大。相反，我们将为问题提供一个*近似*解。具体而言，如果
