    时间。这是在非确定性机器上可以在多项式时间内解决的问题集合——这种机器允许在每一步进行猜测。其大致想法是，存在某些猜测的组合可以导致多项式的解，因此，如果你同时执行所有猜测，就能找到正确答案。


    ## 6.1 搜索问题


    从形式上说，NP 内的问题定义如下：


    搜索问题：


    - 形式：给定一个实例 $I$，如果存在 $I$ 的解 $S$，我们可以找到它，或者指示没有解。

    - 要求：要成为一个搜索问题，给定一个实例 $I$ 和任意解 $S$（不一定是由任何算法给出的），必须能够在多项式时间 $|I|$ 内验证 $S$ 是 $I$
    的解。


    证明上述要求的方法是提供一个验证器算法 $V(I, S)$，并证明它满足该要求。


    ### 6.1.1 示例：SAT


    回想 SAT 问题的结构。


    SAT：


    - 输入：一个具有 $n$ 个变量和 $m$ 个句的 CNF（合取范式）形式布尔函数 $f$。

    - 输出：一个可满赋值——如果存在——否则输出“否”。


    一个提议的解显然可以在多项式时间内通过验证：只需为每个 $x_i$ 分配值并遍历每个句以检查它是否被满足。在最坏情况下，这需要 $\mathcal{O}(mn)$
    时间，因为 $m$ 个句中的每一个句都需要检查一次，而每个句有（最多）$2n$ 个文字文字。这意味着 SAT $\in$ NP。


    ### 6.1.2 示例：k-着色问题


    $k$-着色问题在计算机科学中众为人知。给定一个图和一个包含 $k$ 种颜色的调色板，你必须找到一种方法为每个节点标记其中一种颜色，使得相邻节点不共享颜色。例如，以下是该图的一个有效
    3 色染色：


    ![](img/618d10cd4b9a60c3e651b4ab71cd8ece_83_0.png)


    找到染色是困难的，但验证很容易：给定一个图 $G$ 和一种染色，我们只需要检查每条边的两个端点颜色不同。因此，$k$-着色在 NP 中。


    ### 6.1.3 示例：MSTs


    回想寻找最小生成树的问题：

    MST：


    - **输入：**一个具有正边长的图 $G = (V, E)$。

    - **输出：**一个权重最小的树 $T$。


    这个问题既是 NP 问题也是 P 问题；这仅仅是因为寻找 MST 需要多项式时间（回想 Kruskal 算法）。我们可以通过深度优先搜索（无回退边）进行验证，然后检查
    $T$ 的权重是否与 Kruskal（或 Prim）算法的输出权重相同。这意味着 MST $\in$ NP 且 MST $\in$ P。


    ### 6.1.4 示例：背包问题


    回想动态规划中的背包问题，

    Knapsack：


    - **输入：**一组具有价值和重量的 $n$ 个对象：

    $V = \{v_1, v_2, \dots, v_n\}$

    $W = \{w_1, w_2, \dots, w_n\}$

    总容量 $B$。

    - **输出：**一个满足以下条件的子集 $S$：

    (a) 最大化总价值：$\max_{i \in S} \sum v_i$

    (b) 放入背包：$\sum_{i \in S} w_i \le B$


    给定问题的一个实例并检查它是否符合容量是容易的，需要 $O(n)$ 时间。那么检查其优越性呢？唯一的方法是实际解决问题并比较总价值。但请记住，与上述 MST
    情况不同，背包的运行时间是 $O(nB)$。这并不是多项式的，因为 $|I| = (n, \log_2 B)$。


    因此，我们的结论是，通用背包问题*并不为人知在 NP 中：*可能存在*更好的算法来寻找或验证解。由于我们无法确定其不存在，因此我们无法说背包 $\in$ NP。


    ## 变体：背包搜索


    我们可以考虑背包的一个变体，其中我们丢弃最大化要求，而是添加一个新的新输入参数：一个*目标*，$g$。然后，算法尝试找到一个满足目标的价值子集。


    背包搜索：


    - **输入：**一组具有价值和重量的 $n$ 个对象：

    $V = \{v_1, v_2, \dots, v_n\}$

    $W = \{w_1, w_2, \dots, w_n\}$

    总容量 $B$。

    一个目标，$g$。

    - **输出：**一个满足以下条件的子集 $S$：

    (a) 满足目标：$\sum_{i \in S} v_i \ge g$

    (b) 放入背包：$\sum_{i \in S} w_i \le B$


    这显然在 NP 中：检查是否满足目标涉及累加价值，需要 $\mathcal{O}(n)$ 时间。


    ## 6.2 区分复杂度


    我们不知道 $P \neq NP$，但争论归结为一个单一的可以提炼的点：


    > *能够快速识别正确答案是否意味着也存在快速的方法来找到**它们***


    我们假设 $P \neq NP$ 是为了区分 NP 内部的问题。即 **NP-完全**问题。这意味着任何 NP-完全问题都可以在多项式时间内解决，那么 NP
    中的*所有问题*都可以在多项式时间内解决。


    本质上，任何 NP-完全的问题都可以“归约”（或更准确地说，“转换”）到任何其他问题。这意味着如果我们能为 SAT 找到多项式时间的解，我们就可以作为一个黑盒来解决*任何*NP
    问题。


    我们可以证明这种转换吗？即，我们能证明 NP 内的任何一个问题（包括 P 中的问题）都可以归约为解决 SAT 吗？这涉及到一个双向证明：


    - $f(G, k)$ 是一个将输入从 k-着色问题转换为 SAT 输入的函数。

    - 同样，$h(S)$ 是一个将输出从 SAT 转换为 k-着色输出的函数。

    - 然后，我们需要证明如果 $S$ 是 SAT 的解，那么 $h(S)$ 就是 k-着色的解。

    - 同样，我们需要证明不存在不映射到 k-着色解的 SAT 解。换句话说，如果 SAT 说“否”，那么 k-着色也输出“否”。


    我们需要对 NP 内的每一个问题都这样做，这看起来是不可逾越的。然而，事实确实如此（见后文的图 6.1），而且这可能是不公平的：SAT 只是一个布尔电路，归根结底是一台计算机，因此任何可以用计算机解决的算法问题都可以用
    SAT 解决。


    不过，从任何问题归约到 SAT 与证明特定问题是 NP-完全的是不同的。后者的证明是通过归约完成的：给定任何 NP-完全问题（如 SAT），如果我们可以从新问题（例如独立集问题）进行归约，那么新问题也必须是
    NP-完全的。


    ## 6.3 归约


    我们将枚举若干归约来证明各种算法是 NP-完全的。关键是，我们将把“SAT 是 NP-完全的”这一定理作为起点，但如果你是一个受虐狂并想弄清楚为什么是这样，可以参考边页链接的论文。


    ### 6.3.1 从 SAT 到 3SAT


    3SAT 和 SAT 的区别在于，在前者，每个句限制为 3 个文字。为了证明 3SAT 是 NP-完全的，我们首先证明 3SAT $\in$ NP；然后，找到从
    SAT 到 3SAT 的归约：


    | SAT | 3SAT |

    | :--- | :--- |

    | 已知 NP-完全 | 复杂度未知 |


    在 NP 内验证 3SAT 的解和 SAT 一样容易，实际上只需要 $\mathcal{O}(m)$ 时间，因为 $n \le 3$。


    归约由于问题之间的相似性，形成归约非常直接。给定的长 SAT 句 $c$ 可以通过引入 $k-3$ 个新的辅助变量转换为 $k-2$ 个新句：


    ```

    $$(x_1 \vee x_2 \vee \dots \vee x_k) \implies (x_i \vee x_{i+1} \vee y_i) \wedge
    (y_i \vee x_{i+3} \vee y_2) \wedge$

    $(y_{k-1} \vee x_{i+4} \vee y_{k-3}) \wedge \dots \wedge (y_{k-5} \vee x_{k-1}
    \vee x_k)$$

    ```


    例如，5-SAT 的转换如下：


    ```

    $$C = (\bar{x}_2 \vee x_3 \vee \bar{x}_1 \vee x_5)$

    $C'' = (\bar{x}_2 \vee x_3 \vee y) \wedge (\bar{y} \vee \bar{x}_1 \vee z) \wedge
    (\bar{z} \vee x_4 \vee x_5)$$

    $C \implies C''$

    ```


    正确性的双向证明可以通过反反法进行。


    > 3SAT：更多限制


    《算法设计》中有一个重要的笔记，课程中没有强调：变量只能出现在 $\le 3$ 个句中的 3SAT 限制性版本仍然是 NP-完全的（转换请见第 251 页）。


