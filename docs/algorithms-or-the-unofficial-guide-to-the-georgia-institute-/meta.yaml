  - "[PAGE 125]\n\n# EXAM 3\n\nHIS study summarizes the chapters on Linear Programming\
    \ and Computational Complexity into an at-a-glance quick-reference for the important\
    \ concepts.\n\n# Linear Programming:\n\n+   - LPs are just systems of inequalities.\n\
    - LPs work because of convexity: given the vertices bounding the feasible region,\
    \ convexity guarantees that greedily jumping to a better neighbor leads to optima.\n\
    - LPs don't always have optima: an LP can be infeasible based on its constraints,\
    \ and unbounded based on its objective function.\n  - Feasibility is tested by\
    \ adding a z and checking if it's positive in the best case on the new LP: Ax\
    \ z ≥ b.\n  - Boundedness is tested by checking the feasibility of the dual LP:\
    \ if the dual is infeasible, then the primal is either unbounded or infeasible.\n\
    \n+   - Dual LPs:\n\n+   - The dual of an LP finds y—the smallest constants that\
    \ can be applied to the primal constraints and find the same optima—takes the\
    \ following form:\n```\nmax cᵀy  Ax ≤ b    ⇔ min bᵀy c\n       x ≥ 0    y ≥ 0\n\
    ```\n- If the dual is infeasible, the primal must either be unbounded or infeasible\
    \ (you can tell which by doing the feasibility test).\n- weak duality basically\
    \ states that the primal is bounded by the dual for any feasible point: cᵀx ≤\
    \ bᵀ.\n- strong duality states that if you find the same feasible point in both\
    \ the primal and the dual that is an optimum.\n- Optima only exist if both LPs\
    \ are feasible and bounded."
