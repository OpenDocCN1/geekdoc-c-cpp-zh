    # # HOMEWORK #1


    CS 170: Homework #1 Don''t forget that in computer science, our logarithms are
    always in base-2! That is, $n = \log_2 n$. Also recall the definition of big-$O$,
    which we briefly reviewed for recalling esoteric algebraic manipulation rules.


    # ## 8.1 Compare Growth Rates


    I''ll only do a handful of these since they should generally be pretty straightforward
    and mostly rely on esoteric algebraic manipulation rules.


    +   (a) Given

    $f(n) = n^{1/2}$

    $g(n) = n^{2/3}$


    we can determine that $f = O(g)$ because:

    $f \le c \cdot g$

    $\frac{f}{g} \le c$

    $\frac{n^{1/2}}{n^{2/3}} = n^{-1/6} \le 1 \quad \forall n \in \mathbb{N}$


    That is, there are no natural numbers that would make this fraction $\frac{n^{1/6}}$
    larger than $c=1$. Note that we don''t actually need this level of rigor; we can
    also just say: $f = O(g)$ because it has a smaller exponent.


    +   (b) Given

    $f(n) = n \log n$

    $g(n) = (\log n)^{\log n}$


    Considering the fact that $g(n)$ is an exponential while $f(n)$ is a polynomial,
    we should intuitively expect $f = O(g)$. By expanding the logarithm with a quick'
  - '[PAGE 100]


    undo-redo (that is, by adding in the base-2 no-op), we can make this even more
    evident:


    ```

    $g(n) = (\log n)^{\log n}$

    $= 2^{\log((\log n)^{\log n})}$

    $= 2^{\log n \cdot \log n}$

    $= 2^{(\log n)^2}$

    $= n^{\log n}$

    ```


    recall applying the base to a logarithm is a no-op, so: $b^{\log_b x} = x$


    we can apply the power rule: $\log x^k = k \log x$


    then the power rule of exponents: $x^{ab} = (x^a)^b$


    Very clearly, $n^m$ will grow much faster than some nm.


    # 8.2 Geometric Growth


    We need to prove the big-O of geometric series under all conditions:


    ```

    $$\sum_{i=0}^k c^i = \begin{cases} \Theta(c^k) & c > 1 \ \Theta(k) & c = 1 \ \Theta(1)
    & c < 1 \end{cases}$

    ```


    We break this down piece-by-piece. For shorthand, let''s say $f(k) = \sum_{i=0}^k
    c_i$.


    **Case 1**: $c < 1$. Let''s start with the easy case. Our claim $f = \Theta(1)$
