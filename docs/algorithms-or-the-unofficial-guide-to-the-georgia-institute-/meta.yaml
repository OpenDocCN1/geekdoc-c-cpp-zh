    sum_{i \\in S} w_i \\le B$\n\n背包问题有两个主要的变体：在第一种情况下，每个对象只有一个副本；而在另一种情况下，对象可以无限制地添加到背包中。\n\
    \n### 1.4.1 贪心算法\n\n解决此类问题的一种自然方法可能是每次贪婪地获取价值最高的对象。遗憾的是，这并不总是总价值最大化的，即使是简单的例子也能证明这一点。\n\
    \n假设我们有以下价值：\n\n$V = \\{v_1 = 15, v_2 = 10, v_3 = 8, v_4 = 5\\}$\n$W = \\{w_1\
    \ = 15, w_2 = 12, w_3 = 10, w_4 = 7\\}$\n$B = 22$\n\n贪心算法按单位重量价值对对象排序：\n\n- $v_1/w_1\
    \ = 1$\n- $v_2/w_2 = 0.83$\n- $v_3/w_3 = 0.8$\n- $v_4/w_4 = 0.71$\n\n在这种情况下，它会选择\
    \ $v_1$ 和 $v_3$，总价值为 23。然而，选择 $v_2$ 和 $v_4$ 将得到总价值 27，说明贪心方法不是最优的。\n\n### 1.4.2\
    \ 最优算法\n\n解决背包问题的最优方法是使用动态规划。让 $K(i, j)$ 为使用前 $i$ 个对象的子集在总容量为 $j$ 时我们能获得的最大价值。\n\
    \n递归关系为：\n\n$$K(i, j) = \\begin{cases} K(i-1, j) & \\text{如果 } w_i > j \\\\ \\\
    max(K(i-1, j), v_i + K(i-1, j-w_i)) & \\text{如果 } w_i \\le j \\end{cases}$$\n\n\
    边界情况为 $K(0, j) = 0$ 和 $K(i, 0) = 0$。通过填充表格，我们可以在 $K(n, B)$ 处找到最优值。\n\n"
