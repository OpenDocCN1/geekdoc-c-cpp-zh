    DPV 8.14: We must prove that the following problem is NP-complete:

    Clique & Independent Set Problem:

    Input: An undirected graph, $G=(V, E)$ and an integer goal $k$.

    Output: A clique $C \subset V$ of size $k$, and an independent set $S \subset
    V$ of size $k$, or “no” if both do not exist.


    Solution

    We will show a reduction from the IS problem (whose input is $(G, g)$) to this
    new clique+IS problem.


    Within NP Verifying that Clique+IS is just a matter of verifying each part individually,
    and we showed in lecture that this can be done in polynomial time for both. Therefore,
    this problem is within NP.


    Transformation The transformation is simple: we introduce a new $(g+1)$-node clique,
    $Q$, into the original graph.

    Running the Clique+IS algorithm on $G''$ and a goal $k=g+1$ will now obviously
    find a clique. It will also give an independent set $S$ of size $g+1$, but, critically,
    no more than one of those vertices from the “fake” clique (since cliques are fully-connected)
    so it must mean there is a size $g$ clique in the original graph.


    Correctness Now, we need to prove that our transformation:


    ![](img/618d10cd4b9a60c3e651b4ab71cd8ece_114_0.png)


    Forward Direction — If there is an independent $S''$ of size $g$ in the original
    graph $G$, then by introducing the new clique to $G''$, we know that there is
    a $(g+1)$-sized clique (by construction) and a $(g+1)$-independent set (just add
    any $v_i$, from the fake clique to $S''$).


    Reverse Direction — If there is an independent set $S$ and a clique $C$ of size
    $k=g+1$ in $G''$, then by dropping any $v_i$ from $S$, we get an independent set
    of size $g$ (since there can be at most one $v_i$). If there is no such $v_i$,
    we have a direct solution since $|S| \ge g$ as required by the problem.


