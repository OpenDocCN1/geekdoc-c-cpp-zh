    \in E$ which represents the cost of segmenting into different objects along that
    edge.


    # KEEP IT SIMPLE, STUPID


    Since we''re studying algorithms rather than computer vision, our examples are
    very simple and these parameters are hard-coded. However, in a realistic setting,
    these values would be otherwise gleaned from the image. For example, hard edges
    in an image are typically correlated with object separation; similarly, you might
    use a statistical metric "most common pixel color" and a color difference to quantify
    the fore/background likelihoods.


    Our goal is to partition the pixels into a foreground and background: $V = F \cup
    B$. We define the "quality" of a partition as follows: it''s the total likelihood
    of the foreground plus the total likelihood of the background minus the total
    penalty.


    ```

    $w(F,B)=\sum_{i \in F} f_i + \sum_{j \in B} b_j - \sum_{(i,j) \in E} p_{ij}$

    ```


    (note that the edges $F \sim B$, so $i \in F, j \in B$)


