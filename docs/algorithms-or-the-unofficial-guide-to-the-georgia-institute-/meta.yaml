  md: 'That begs the question: how do we find a SCC? More specifically, as explained
    in footnote 4, how do we find any vertex within a sink component?


    A key property holds that will let us find such a vertex:


    **Property 3.3. In a general directed graph, the vertex $v$ with the highest visit
    order number will always lie in a source strongly-connected component.**


    Given this property, how do we find a vertex $w$ in a sink SCC? Well, it would
    be great if we could invert our terms: can we find a source SCC and want a sink
    SCC, but what if we could sink SCCs and want to find a source SCC? Well, what
    if we just... reversed the graph? So now vertices become sources and vice-versa,
    and we can use the property above to find a source-in-reversed-but-sink-in-original
    vertex!


    For a digraph $G=(V,E)$, we look at $G^R=(V,E^R)$, the reverse graph of $G$, where
    $E^R=\{(u,v) : (v,u) \in E\}$, the reverse of every edge in $E$. All of our previous
    notions hold: the source SCCs in $G$ become the sink SCCs in $G^R$ and vice-versa,
    so the topologically-sorted DAG is likewise reversed. From a high level, the algorithm
    looks as follows:


    +   1. First, reverse the graph $G^R$.


    +   2. Perform DFS to it a traversal tree.


    +   3. Sort the vertices decreasing by their post-order numbers to identify the
    vertex $v$ to start DFS from the original graph


    +   4. Run the standard connected-component-algorithm using DFS (from algorithm
    3.2) from $G$ starting at $v$—increase a component tracker $cc$ whenever exploration
    exploration of a vertex ends—label each SCC.


    +   5. When DFS terminates for a component, set $v$ to the next unexplored vertex
    with the highest post-order number and go to Step 4.


    +   6. The output is the metagraph DAG in reverse topological order.


