  mdcn: "\n\n# 算法\n\n- 我们可以在多项式时间内近似 Max-SAT——其中 $m^*$ 是理论上的最大满足子句数——得到一个复杂度为 $\\\
    frac{8}{7}m^*$ 的算法。\n- 寻找线性规划问题（ILPs）的整数解通过归约 MaxSAT 证明是 NP-hard 的。\n- ILPs 可以通过舍入进行近似，通常使用随机算法进行近似，这些算法可以提供某些“接近性”保证。\n\
