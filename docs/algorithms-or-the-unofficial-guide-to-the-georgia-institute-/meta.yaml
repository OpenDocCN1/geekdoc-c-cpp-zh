    ## 第二章：分治法


    $y = y_l \quad y_r$


    原始的 $x$ 是其各个部分的组合：$x = 2^{n/2}x_l + x_r$（其中 $2^{n/2}$ 作为移位将 $x_l$ 移动到相应位置），$y$
