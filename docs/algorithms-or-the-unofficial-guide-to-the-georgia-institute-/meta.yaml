    \ \\dots, y_n\\}$\n```\n\n**Input:** Two equal-length strings:\n\n**Output:**\
    \ The length $\\ell$ of their longest common subsequence.\n\nHow can we solve\
    \ the formal definition of this problem algorithmically?\n\n# 1.3.1 Step 1: Identify\
    \ Subproblems\n\nDynamic programming solutions are supposed to build upon themselves.\
    \ Thus, we may naturally extend our subproblems to be increasingly-longer prefixes\
    \ of the input strings, just like in the LIS problem. For example, suppose we're\
    \ with three characters and we are analyzing an incoming 4th character:\n\n```\n\
    $X = BCD \\leftarrow B = x_{4}\\nY = ABE \\leftarrow C = y_{4}$\n```\n\nNotice\
    \ that $\\ell=1$ before and $\\ell=2$ after, we go from $B$ to $BC$ as our LCS.\
    \ In general, there are two cases to consider? Either $x_i = y_i$, in which case\
    \ we know for $sure$ that $\\ell$ increases since we can append both characters\
    \ to the LCS, or $x_i \neq y_i$, in which case we need to think a little more.\n\
    \nIt's possible that either the new $x_i$ or the new $y_i$ makes a new LCS viable.\
    \ We can't integrate them into the LCS at the same time (since they're not equal),\
    \ so let's suppose we have only a new $y_i$ so we can think about this concretely:\n\
