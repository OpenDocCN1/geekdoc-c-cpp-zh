    The product can be simplified via Euler''s identity:


    ```

    $$\sum_{k=0}^{n-1} \omega^k = \omega^0 \cdot \omega^1 \cdot \dots \cdot \omega^{n-2}
    \cdot \omega^{n-1}$$

    $$\omega^{\sum_{k=0}^{n-1} k} = \omega^{\frac{n(n-1)}{2}}$$

    $$\left(e^{i\frac{2\pi}{n}}\right)^{\frac{n(n-1)}{2}}$$

    $$= e^{i\pi(n-1)} = (e^{i\pi})^{n-1}$$

