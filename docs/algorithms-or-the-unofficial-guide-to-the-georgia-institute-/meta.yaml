    (b) 我们被要求证明


    $S(n) = \sum_{i=0}^{n} a^i = 1 + a + a^2 + \dots + a^n = \frac{a^{n+1}-1}{a-1}$


    这一结果也用在 (8.1) 中，并在补充作业的“几何级增长”部分在本旁注中进行了详细阐述。该证明源于多项式长除。在不同 $a$ 比例下 $S(n)$ 的大-O
    阶导也包含在该题中。


    # 业 #1


    CS 170: 业 #1 不要忘记在计算机科学中，我们的对数始终是以 2 为底的！也就是说，$n = \log_2 n$。此外回想起大-O 的定义，我们简要回顾了它以回忆那些晦涩的代数运算规则。


    ## 8.1 比较增长率


    我只会做几个，因为它们通常非常直观，且主要依赖于晦涩的代数运算规则。


    - (a) 已知

    $f(n) = n^{1/2}$

    $g(n) = n^{2/3}$


    我们可以确定 $f = O(g)$，因为：

    $f \le c \cdot g$

    $\frac{f}{g} \le c$

    $\frac{n^{1/2}}{n^{2/3}} = n^{-1/6} \le 1 \quad \forall n \in \mathbb{N}$


    也就是说，没有自然数能让这个分式 $\frac{n^{1/6}}$ 大于 $c=1$。注意我们实际上不需要这种程度的严谨性；我们也可以说：$f = O(g)$
    因为它的指数较小。


    - (b) 已知

    $f(n) = n \log n$

    $g(n) = (\log n)^{\log n}$


    考虑到 $g(n)$ 是指数级而 $f(n)$ 是多项式，我们直觉上应该预期 $f = O(g)$。通过快速的“撤销-重做”（即添加底为2的无操作）展开对数，我们可以让这一点变得更加明显：


    ```

    $g(n) = (\log n)^{\log n}$

    $= 2^{\log((\log n)^{\log n})}$

    $= 2^{\log n \cdot \log n}$

    $= 2^{(\log n)^2}$

    $= n^{\log n}$

    ```


    回想起对对数应用底是一个无操作，所以：$b^{\log_b x} = x$


    我们可以应用幂规则：$\log x^k = k \log x$


    然后是指数的幂规则：$x^{ab} = (x^a)^b$


    非常明显，$n^m$ 的增长速度将远快于某些 $nm$。


    ## 8.2 几何增长


    我们需要证明所有条件下几何级数的大-O 阶：


    ```

    $$\sum_{i=0}^k c^i = \begin{cases} \Theta(c^k) & c > 1 \\ \Theta(k) & c = 1 \\
    \Theta(1) & c < 1 \end{cases}$$

    ```


    我们将其逐个拆解。为了方便起见，假设 $f(k) = \sum_{i=0}^k c_i$。


    **情况 1**：$c < 1$。让我们从简单的情况开始。我们的主张 $f = \Theta(1)$ 意味着：


    ```

    $\exists m$ 使得 $f(k) \le m \cdot 1$

    $\exists n$ 使得 $f(k) \ge n \cdot 1$

    ```


    记住微积分，在这些条件下，无穷几何级数很容易收敛：


    ```

    $$\sum_{i=0}^\infty c^i = \frac{1}{1-c}$$

    ```


    对于 $m$ 来说这是一个困难情况（因为 $k \le \infty$），所以我们可以放信地说对于 $\frac{1}{1-c}$，$f = O(1)$。我们还必须证明反过来，这也是显而易见的：令
    $n=1$。由于和随 $k$ 的增加只会增大，最小的是 $f(k)=0$。


    **情况 2**：$c = 1$。这种情况实际上更简单……注意级数的和仅仅是 $k$：


    ```

    $$f(k) = \sum_{i=0}^k c^i = \frac{1 + 1 + \dots + 1}{k+1 \text{ 次}} = k+1$$

    ```


    意味着我们的主张 $f = \Theta(k)$ 是自而易见的。


    # 演练：业 #1


    情况 3：$c > 1$。最后的情况导致一个递增级数；$k$ 项和的公式给出：


    ```

    $f(k) = \sum_{i=0}^{k} c^i = \frac{1-c^{k+1}}{1-c} \quad (8.1)$

    ```


    我们的主张是这被 $f(k) = \Theta(c^k)$ 限制的。我们知道显然下式成立$^1$：


    ```

    $c^{k+1} > c^{k+1} - 1 > c^k$

    ```


    注意这意味着 $c^{k+1}-1 = \Theta(c^{k+1})$，且 $c^{k+1}-1 = \Omega(c^k)$。这非常接近我们想要的……如果我们把整个式子除以
    $c-1$ 呢？


    ```

    $\frac{c^{k+1}}{c-1} > \frac{c^{k+1}-1}{c-1} > \frac{c^k}{c-1}$

    ```


    现在中间项是 $f(k)$ 了！因此，


    ```

    $\frac{c}{c-1}c^k > f(k) > \frac{c^k}{c-1}$

    ```


    意味着必须是 $f = \Theta(c^k)$ 因为我们刚刚证明了 $c^k$ 既是它的上界也是下界（常数 $m = \frac{c}{c-1}, n =
    \frac{1}{c-1}$）。


    # 推导几何求和。我们想要证明 (8.1)：


    ```

    $f(k) = \sum_{i=0}^{k} c^i = \frac{c^{k+1}-1}{c-1}$

    ```


    该证明是对该页面针对我们 $i=0$ 和 $a_0 = 1$ 特定情况的简单适配。注意我们和的完全展开：


    ```

    $\sum_{i=0}^{k} c^i = 1 + c + c^2 + \dots + c^k = c^k + c^{k-1} + \dots + c +
    1$

    ```


    > $ 这对于 $k > 0$ 成立，但如果 $k = 0$，那么我们可以像情况 2 那样证明 $f(0) = \Theta(c^0) = O(1)$。


    多项式的基本属性是将 $x^n - 1$ 除以 $x - 1$ 得到：


    ```

    $$\frac{x^n - 1}{x - 1} = x^{n-1} + x^{n-2} + \dots + x + 1$$

    ```


    通过反向工程，我们可以看到求和可以是类似除法的结果：


    ```

    $$\frac{c^{k+1} - 1}{c - 1} = c^k + c^{k-1} + \dots + c^2 + c$$

    ```


