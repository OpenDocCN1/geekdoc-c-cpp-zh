    ## 第 6 章：计算复杂度


    ### 独立集搜索 (Independent Set Search)：


    **输入：** 一个无向图，$G = (V, E)$。

    **目标** $g$。


    **输出：** 如果存在，则输出大小 $|S| \ge g$ 的独立集 $S$。


    现在


    ![](img/618d10cd4b9a60c3e651b4ab71cd8ece_87_0.png)


    ## 构建


    再次考虑 3SAT 场景：有一个输入 $f$，其包含变量 $x_1, \dots, x_n$ 和子句 $c_1, \dots, c_m$，其中每个子句最多包含
    3 个文字文字（literals）。我们定义的图 $G$ 的目标与子句数量匹配：$g = m$。然后，对于图中的每个子句 $c_i$，我们将创建 $|c_i|$
    个顶点（文字的数量）。


    **子句边（Clause Edges）** 我们通过全连接其文字文字，将一个特定的子句编码为一个子图。


    例如，子句 $c = (x_1 \vee x_3 \vee x_2)$ 被编码如右图所示。


    ![](img/618d10cd4b9a60c3e651b4ab71cd8ece_87_1.png)


    根据构造方法，生成的独立集 $S$ 每个子句最多包含 1 个顶点，由于 $g = m$，解决方案每个子句恰好有 1 个顶点。


    **变量边（Variable Edges）** 为了防止 SAT 赋值产生矛盾，我们需要在任何变量与其对反形式之间添加边。例如，给定以下 $f$：


    $f(x_{1,5}) = (x_1 \vee \neg x_3 \vee x_2) \wedge (\neg x_1 \vee x_3 \vee \neg
    x_5)$


    ![](img/618d10cd4b9a60c3e651b4ab71cd8ece_87_2.png)


    我们将构建出右侧的图，其中实线是恰刚刚定义的子句边，虚线是新的变量边。


    ## 正确性


    给定此表述，我们需要从两个方向证明其正确性。也就是说，我们需要证明如果 $f$ 有可满足赋值，则 $G$ 有一个大小满足文字的独立集，反之亦然。


    ### 正向证明


    我们知道起始于一个满足 $f$ 的赋值。对于每个子句 $c$，其对应的子图中至少有一个顶点被设为真；将这些顶点中恰好选择一个加入独立集。共有 $m$ 个子句，我们得到
    $|S| = m = g$ 并实现了我们的目标。


    注意，如果选定的顶点有变量边，那么根据定义，其对应的边不能被选择（这将会导致 $f$ 的赋值产生矛盾）。同样，根据定义，我们没有包含任何子句边。


    ### 反向证明


    这次，我们从 $G$ 的一个大小至少为 $g$ 的独立集开始。由于每个子句的子图都是全连接的，且至少有 $g$ 个顶点，因此每个子句必须至少有一个顶点。通过将
    $f$ 中的（顶点）文字设为真，我们满足了它。


    我们已经证明了 3SAT 与 IS（独立集）之间的等价性，从而证明了独立集问题是 NP-完全的。


    ## 最大独立集 (Maximum Independent Set)


    记住 Max-IS 问题不在 NP 中。此外，很容易将 IS 归约到 Max-IS 问题：如果我们找到了最大值 $m^*$，则 $m^* \ge g$。这意味着我们可以将
    NP 中的任何问题归约到 Max-IS（通过归约 IS 或直接归约），但 Max-IS 本身位于 NP 之外。


    为了表示 Max-IS 与 NP 中的任何问题一样困难，但无法确定 Max-IS 本身是否是 NP 完全的，我们称它是 NP-hard。总结来说，按难度我们称
    $P \le NP-complete \le NP-hard$。


    ### 6.3.3 团 (Cliques)


    团（读音为“k-IEK”，类似于“frank”）是一个全连接的子图。具体而言，对于图 $G = (V,E)$，集合 $S \subseteq V$ 是一个团当且当
    $\forall x, y \in S : (x, y) \in E$。


    与独立集类似，困难之处在于寻找大团，因为像单个顶点一样，团显而易见的。


    **输入：** 一个图 $G = (V, E)$ 和一个目标 $g$。

    **输出：** 顶点集合 $S \subseteq V$，其中 $S$ 是一个大小满足目标的团，因此 $|S| \ge g$。


    检查 $S$ 是否全连接需要 $O(n^2)$ 时间，检查 $|S| \ge g$ 需要 $O(n)$ 时间，因此团问题属于 NP。它也是 NP 完全的：我们可以证明这是从独立集问题的归约。


    归约背后的核心思想是，这些问题是两极相反的对立面：在团中，$S$ 内部存在一个完整的边集；在独立集中，$S$ 内部之间没有边。


    图 $G=(V, E)$ 的“对立面”是一个其所有边都不在 $G$ 中的图。换句话说，$\overline{G}=(V, \overline{E})$，其中
    $\overline{E} = \{(x, y) : (x, y) \notin E\}$。根据定义，$S$ 是 $G$ 中的一个团当且仅当 $S$ 是 $G$
    中的一个独立集。


    给定 IS 问题的输入 $G=(V, E)$ 和目标 $g$，我们形成大小为 $g$ 的 $\overline{G}$ 作为团问题的输入。如果 $S$ 是团问题的解，它就是
    IS 问题的解。


    ### 6.3.4 顶点覆盖 (Vertex Cover)


    如果顶点集合覆盖了每条边，则它是顶点覆盖。具体对于 $G=(V, E)$，$S \subset V$ 是顶点覆盖当且当对于每条边 $(u, v) \in E，$u
    \in S$ 或 $v \in S$。注意每条边在图中至少有一个顶点![](img/618d10cd4b9a60c3e651b4ab71cd8ece_89_0.png)。找到一个大的顶点覆盖很容易的，但找到最小的很困难。顶点覆盖问题的
    NP-完全版本如下：


    **输入：** 一个图 $G=(V, E)$ 和一个预算 $b$。

    **输出：** 顶点集合 $S$，形成一个预算内的顶点覆盖，大小 $|S| \le b$。


    为了确认顶点覆盖问题的解在多项式时间内有效：只需检查对于每条边 $(u, v) \in E$，是否存在 $u \in S$ 或 $v \in S$，并检查
    $S$ 是否在预算内。


    **核心思想：** $S$ 是顶点覆盖当且仅当 $\overline{S}$（剩余顶点，即 $\overline{S} = V \setminus S$）是一个独立集。


    **正向证明** 对于每条边，根据顶点覆盖的定义，至少有一个顶点会在 $S$ 中。这意味着 $\overline{S}$ 中至多有一个顶点；$\overline{S}$
    没有边，是一个独立集。


    **反向证明** 理由几乎相同。给定 $G=(V, E)$ 的一个大小为 $g$ 的独立集，归约到顶点覆盖问题就是显而易见的：令 $b=|V|-g$ 并运行顶点覆盖问题得到解
    $S$。根据我们上述证明的结论，IS 问题的解是 $S$。


    ### 6.3.5 子集和问题 (Subset Sum)


    子集和问题的目标是找到一组整数，使其和等于目标值。这类似于背包问题（knapsack）。


    - **输入：** 一组正整数 $\{a_1, a_2, \dots, a_n\}$ 和一个目标 $t$。

    - **输出：** 一个子集，其和等于 $t$；否则输出“无”。


    子集和问题是 NP 完全的，但可以通过动态规划在多项式时间内解决（假设 $t$ 是多项式级的）。


