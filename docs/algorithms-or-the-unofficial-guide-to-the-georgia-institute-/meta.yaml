    **Input:** A matrix of distances.


    **Output:** The shortest tour which passes through all of the cities. TSP-Opt.


    The goal is to show that if TSP can be solved in polynomial time, so can TSP-Opt.
    This is an important result, because it shows that neither of these problems is
    easier than the other; furthermore, the technique for the proof applies to all
    problems of this form.


