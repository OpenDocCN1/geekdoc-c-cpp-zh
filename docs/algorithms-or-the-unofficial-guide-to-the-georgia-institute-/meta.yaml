  md: "running time is very transparently O(nB).\n\n**ALGORITHM 1.5:** KNAPSACK(),\
    \ the standard knapsack algorithm with no object rejection, finding an optimal\
    \ subset of values to fit in a capacity-limited container.\n\n**Input:** List\
    \ of object weights: $W = \\{w_1, \\dots, w_n\\}$\n**Input:** List of object values:\
    \ $V = \\{v_1, \\dots, v_n\\}$\n**Input:** A capacity, $B$.\n**Result:** The collection\
    \ of objects resulting in the maximum total value without exceeding the knapsack\
    \ capacity.\n\n```\n// For the base cases, only the first row and column are required\
    \ to be zero, but we zero-init the whole thing for brevity.\nKn_{n+1,B+1} \\leftarrow\
    \ 0\nforeach $i \\in [1,n]$ do\n  foreach $b \\in [1,B]$ do\n    $x \\leq K[i-1,\
    \ b]\n    if $w_i \\leq b$ then\n      $K[i,b] = \\max[x, v_i + K[i, b-w_i]]$\n\
    \    else\n      $K[i,b] = x$\n  end\nend\nreturn $K(n,B)$\n```\n\n# 1.5 Knapsack\
    \ With Repetition\n\nIn this variant, we have an unlimited supply of objects:\
    \ we can use an object as many times as we'd like.\n\n# 1.5.1 Simple Extension\n\
    \nLet's try to solve this with the same formulation as before: let's define $K(i,b)$\
    \ as being the maximum value achievable using a **multiset** (that is, a set where\
    \ duplicates are allowed) of objects $\\{1, \\dots, i\\}$ with the weight $w \\\
    leq b$. Our recurrence relation is almost identical, but we don't need to remove\
    \ the object from our pool of viabilities when considering smaller bags:\n\n```\n\
    $K(i,b) = \\max \\begin{cases} K(i-1, b) \\ v_i + K(i, b-w_i) \\end{cases}$\n\
    ```"
