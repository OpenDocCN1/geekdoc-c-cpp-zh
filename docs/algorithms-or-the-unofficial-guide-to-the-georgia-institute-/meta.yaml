    **Input:** Two graphs, $G_1 = (V_1, E_1)$ and $G_2 = (V_2, E_2)$ and a budget,
    $b$.


    **Output:** Two sets of vertices $V''_1 \subseteq V_1$ and $V''_2 \subseteq V_2$
    such that deleting them from their respective graphs leaves at least $b$ nodes
    in each graph and makes the graphs identical.


    # Solution


    At first it may seem that this has a relationship to the Subgraph Isomorphism
    problem above (see 8.10a), and it does, of sort, in the sense that all of the
    graph problems are sort of similar. We proceed by a reduction from the vertex
    cover problem.


    **Within NP** We technically need a mapping from one set of vertices to another
    in this for it to be verifiable in polynomial time, but if we just consider equal
    graph structure to make equal graphs, then it''s pretty trivial. All we need to
    confirm that the amount of vertices matches (constant time, or linear if you data
    structure is garbage) and that they are the per-vertex. We can do this by finding
    the vertex in $V_1 \setminus V''_1$ that has the same edges as $V_2 \setminus
    V''_2$ in $O(mn)$ time: compare each list (which is $\le m$ edges) of each vertex
    (which is $\le n$ long), and do for every vertex. Since both graphs could be fully-connected
    in the worst case, this takes $O(n^3)$ time overall.


    **Transformation** Let $G_1 = (V, E)$ be the original graph, $G_2 = (V_2, \emptyset)$
    be simply disconnected (where $b''$ is the input budget to the VC problem rather
    than the above budget), and the budget be $b = b''$ (meaning nothing in $G_2$
    gets removed). Then, we claim that the Max-Common-Subgraph problem has a solution
    iff the VC problem has a solution.


    **Forward Direction** Given a $V^* \subseteq V$ to the VC problem with the $(G,
    b'')$, the above also has a solution since one could drop $V''_1 = V^*$ and ($V''_2
    = \emptyset$, so no action is required). By the definition of a vertex cover,
    $V \setminus V''_1$ would leave no edges and leave exactly $b = b'' = |V_2| =
    |V \setminus V''_1|$ vertices behind (and thus match $G_2$).


    **Reverse Direction** Given a solution pair $(V''_1, V''_2)$ to the Max-Common-Subgraph
    as described above, the VC problem will also have a solution: drop $V''_2$ from
    the original graph and return the resulting set of vertices.


