    \ they don't, we just consider the best LCS if we hadn't used $x_i$, $y_j$.\n\n\
    Our base case is trivial: $L(0,.) = L(-,0) = 0$. That is, when finding the LCS\
    \ strings where one of them is the empty string, the length is obviously zero.\n\
