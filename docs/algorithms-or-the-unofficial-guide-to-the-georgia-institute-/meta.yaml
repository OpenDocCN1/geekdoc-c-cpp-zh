  md: '# ALGORITHMS


    But what if we get from $s \to z$ without needing exactly $i$ edges? We''d need
    to find $D(j, z)$, right? Instead, we can incorporate it into the recurrence directly:


    ```

    $D(i, z) = \min_{y(y,z) \in E} \{ D(i-1, y) + w(y, z) \} \quad \text{iterate over
    every edge}\nnthat goes into z$$

    ```


    where we start with the base $D(0, s) = 0$, and $D(0, z) = \infty$ for all $z
    \neq s$, and the solutions for all vertices are stored in $D(n-1, z)$.


    This is the **Bellman-Ford algorithm**. Its complexity is $O(nm)$, where $n$ is
    the number of vertices and $m$ is the number of edges (that is, $n=|V|$, $m=|E|$).
    Note that for a **fully-connected** graph, there are $n^2$ edges, so this would
    take $O(n^3)$ time.


    **Negative Cycles** If the graph has a negative weight cycle, then we will notice
    that the shortest path changes after $n-1$ iterations (otherwise it would). If
    we keep doing Bellman-Ford and the $n^{th}$ iteration results in a different row
    than the $(n-1)^{th}$ iteration, there is a negative weight cycle. Namely, if
    $\exists z \in V$: $D(n, z) < D(n-1, z)$; if there, the cycle involves $z$ and
    we can backtrack through $D$ to identify the cycle.


    # 3.2.2 From All Vertices: Floyd-Marshall


    What we don''t just the shortest path from $s \to z$ for all $z \in V$, but for
    **pairs** of vertices (that is, from **any to any**). The naïve approach would
    be to compute Bellman-Ford for all vertices, taking $O(nm^2)$ time. However, we
    can use the **Floyd-Marshall** algorithm to compute it in $O(n^3)$ time,—this
    is better for denser graphs, where $n \ll n^2$.


    This intuitively be possible, since the shortest path from $s \to z$ probably
    overlaps with the shortest path from $s'' \to z$ if $s$ and $s''$ are neighbors.


    First, lets assign a number to each vertex, $V=\{v_1, v_2, \dots, v_n\}$. Now
    our subproblem is the "prefix" of $s$, so we solve the all-pairs problem by only
    using subset of vertices as our base case). This is done for all possible start
    and end vertices, $s, t \in \{v_1, v_2, \dots, v_n\}$. Then,


    Let $D(i, s, t)$ be the shortest path from $s \to t$ using a subset of the first
    $i$ vertices. To start off, if we no intermediate vertices, only vertices that
    share an edge have a valid path length; the base cases are:


    ```

    $D(0, s, t) = \begin{cases} \infty & \text{if } D(s,t) \notin E \ w(s,t) & \text{otherwise}
    \end{cases}$$

    ```


    Now lets at the recurrence. There''s a shortest path $\mathcal P$ from $s \to
    t$, right? Well, if $e$ is not on the path? Then we can exclude it, preferring
    to the $(i-1)^{th}$ prefix.


