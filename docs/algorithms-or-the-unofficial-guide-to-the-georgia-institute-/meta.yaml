    # 3.6.3 Prim’s Algorithm


    This variant for creating the minimum spanning tree is reminiscent of Dijkstra’s
    algorithm. It’s still a greedy algorithm, which constrains the edges it considers.
    Its purpose is to always maintain a subtree along the way to finding the MST,
    so it will only consider edges that are connected, choosing the cheapest one.
    Its similarity to Dijkstra’s is reflected by its running time: $\mathcal{O}((m+n)
    \log n)$.'
