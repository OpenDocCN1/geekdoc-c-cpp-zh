    # 2.3 Solving Recurrence Relations


    Recall the typical form of a recurrence relation for divide-and-conquer problems:


    ```

    $T(n)=2T(\frac{n}{b})+f(n)$

    ```


    Here, n is the size of the input problem, a is the number of subproblems in the
    recursive call, b is the factor by which the subproblem size is reduced in each
    recursive call, and f(n) is the complexity of any additional non-recursive processing.


    Consider the (recursive) merge sort algorithm. In it, we split our n-length array
    into two halves and recurse into each, then perform a linear merge. Its recurrence
    relation is thus:


    ```

    $T(n)=2T(\frac{n}{2})+O(n)$

    ```


    It''s possible to use any recursive relationship to its big-O complexity with
    ease. For example, we can use the merge sort recurrence to derive the big-O of
    the algorithm: O(n log n). Let''s see how to do this in the general case.


    # 2.3.1 Example 1: Integer Multiplication


    The brute force multiplication algorithm’s recurrence relation looks like this:


    ```

    $T(n)=4T(\frac{n}{2})+O(n)$

