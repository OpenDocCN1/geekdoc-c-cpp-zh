    # Definitions


    There are many terms when discussing graphs and they all have very specific meanings.
    This "glossary" serves as a convenient quick-reference.


    The typical way a graph is defined is $G = (V, E)$. Sometimes, the syntax $\vec{G}$
    is used to indicate a directed graph, where edges can only be traversed in a single
    direction.


    +   * The syntax $(a,b) \in E$ indicates an edge from $a \rightarrow b$.

    * The syntax $w(a,b)$ indicates the weight (or distance or length) of the edge
    from $a \rightarrow b$.

    * A walk through a graph can visit a vertex any number of times.

    * A path through a graph can only visit a vertex once.

    * A cycle through a graph that starts and ends at the same node.

    * A graph is fully-connected if each vertex is connected to every other vertex.
    In this case, $|E| = |V|^2$.

    * The degree of a vertex is the number of edges. For directed graphs, there is
    also $d_{in}(v)$ to indicate incoming edges, $(u, v)$ and $d_{out}(v)$ to indicate
    outgoing edges $(v, u)$.


    When discussing the big-$O$ complexity of a graph algorithm, typically $n$ refers
    to $|V|$, the vertices, and $m$ refers to $|E|$, the number of edges. In a fully-connected
    graph, then, a $\mathcal{O}(nm)$ algorithm can actually be said to take $\mathcal{O}(n^3)$
    time, for example.'
