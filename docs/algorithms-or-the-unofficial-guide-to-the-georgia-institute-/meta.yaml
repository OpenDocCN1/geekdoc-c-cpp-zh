    # Greatest Common Divisor


    The greatest common divisor of a pair of numbers is the largest number that divides
    both of them. Euclid''s rule states that if $x \geq y > 0$, then


    ```

    $$gcd(x, y) = gcd(x, x \bmod y)$$$

    ```


    This leads directly to the Euclidean algorithm which runs in $\mathcal{O}(n^3)$
    time, where $n$ is the number of bits used to represent the inputs.$1$


    **ALGORITHM 4.2**: $GCD(x, y)$, Euclid''s algorithm for finding the greatest common
    divisor.


    **Input:** $x, y$, two integers such that $x \geq y \geq 0$.

    **Result:** The greatest common divisor of $x$ and $y$.


    ```

    if $y = 0$ then

    | return $x$

    end

    return $GCD(y, x \bmod y)$

    ```


    # Extended Euclidean Algorithm


    Bézout''s identity states that if $x$ and $y$ are the greatest common divisors
    of $n$, then there are some integers $a, b$ such that:


    ```

    $$ax + by = n$$

    ```


    These can be found using the extended Euclidean algorithm in $\mathcal{O}(n^3)$
    time and are crucial in using the multiplicative inverse. If we find $gcd(x, n)
    = 1$, then we want to find $x^{-1}$. By the above identity, this means:


    ```

    $$ax + bn = 1$$

    $$ax + bn \equiv 1 \quad (mod \ n)$$

    $$ax \equiv 1 \quad (mod \ n)$$

    ```


    Thus, finding the coefficient $a$ will find us $x^{-1}$.


    $1$ The running time comes from the fact that taking the modulus takes $\mathcal{O}(n^2)$
    time and $GCD(\cdot)$ needs $\le2n$ rounds to complete.'
