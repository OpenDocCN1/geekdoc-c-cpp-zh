  md: 'The approach is incredibly simple: we assign each $x_i$ to true or false randomly
    with equal probability for all $n$ variables. Suppose $W$ denotes the number of
    satisfied clauses, and it is expressed as the sum of $w_{js}$ that determines
    whether or not the corresponding $c_{ij}$ clause has been satisfied. Then, the
    expectation (or average) value of $W$ is, by


    ```

    $E[W] = \sum_{\ell=0}^m \ell \cdot Pr[W=\ell]$\n= \sum_{j=1}^m [w_j]\n= \sum_{j=1}^m
    Pr[w_j=1]$\n= \sum_{j=1}^m (1 - 2^{-k})\n\ge \sum_{j=1}^m \frac{1}{2} \ge \frac{m}{2}$

    ```


    definition of expectation

    linearity of expectation

    since $\ell=0$ when $w_j=0$\nwhere $k$ is the number of variables in the clause,
    since only a single $x$ needs to be set to true\nsince $k \ge 1$


    Thus, just guessing a random value is a randomized algorithm that satisfies at
    least $1/2$ of the maximum satisfiable clauses.


    Notice that this lower bound is not dependent on $k$; for simplicity of calculation—$k$
    variables for each clause. What if we considered Max-Ek-SAT, in which every clause
    is exactly size $k$? Then we simply have a $(1 - 2^{-k})$ approximation.


    > It was proved that for the case of Max-3-SAT, it''s NP-hard to do any better
