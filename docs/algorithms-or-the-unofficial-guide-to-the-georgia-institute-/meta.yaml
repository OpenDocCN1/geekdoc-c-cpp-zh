    The goal of the subset sum problem is to find some combination of integer values
    that sum up to another particular value. This is somewhat reminiscent of the knapsack
    problem, without weights and with an exact goal. In fact, we''ve shown that this
    problem is NP-complete with a reduction from 3SAT, it will be simple to show that
    knapsack is also NP-complete.


    Subset Sum:


    +   **Input:** A subset of positive integers, $\{a_1, \dots, a_n\}$ and a goal,
    $t$

    **Output:** A subset $S \subseteq \{1, \dots, n\}$ such that $\sum_{i \in S} a_i
    = t$.


    This problem can be solved in $\mathcal{O}(nt)$ time with dynamic programming,
    but this is not a polynomial solution in the input size; it would need to be in
    terms of $\log_2 t$ instead.


