    # QUICK MAFFS: Off-By-One


    This minor division gives us insight on how we can do better than expected when
    multiplying two complex numbers together. The underlying assumption is that addition
    is cheaper than multiplication.ᵃ


    We’re given two complex numbers: $a+bi$ and $c+di$. Their product, via the FOIL
    approach we all learned in middle school, can be found as follows:


    ```

    $=(a+bi)(c+di)\n= ac+ad+bci+bd^2\n= (ac-bd)+(ad+bc)i$

    ```


    There are four independent multiplications here. The clever trick realized by
    Gauss is that the latter sum can be computed without computing the individual
    terms. The insight comes from the fact that $ad+bc$ looks like it comes from a
    FOIL just like the one did: $a,b$ on one side, $d,c$ on the other:


    ![](img/618d10cd4b9a60c3e651b4ab71cd8ece_22_0.png)


    Notice that "extra" terms are already there we’ve computed! Thus, $ad+bc=(a+b)(d+c)-ac-bd$


    Thus, we need three multiplications: $ac, bd$, and $(a+b)(d+c)$. We do need more
    additions, but we entered this derivation operating under the assumption that
    this is okay. A similar insight will give us the ability to multiply $n$-bit integers
    faster, well.


    > ᵃ This is ideally true, even on modern processors. On an Intel processor, 32-bit
    multiplication takes 6 cycles while only taking 2.


    We’re working with the $n$-bit integers $x$ and $y$, and our goal is to compute
    $z=xy$.¹ Divide-and-conquer often involves splitting the problem into two halves;
    can we do that here? We can’t split $x$ and $y$ themselves into $n/2$-bit halves:


    ```

    $x = x_l \quad x_r$

    ```


    ¹ We are operating under the assumption that we can’t perform these multiplications
    on a computer using the hardware alone. Let’s suppose we’re working with massive
    $n$-bit integers, where $n$ is something like 1024 or more (like the common ones
    in cryptography).'
