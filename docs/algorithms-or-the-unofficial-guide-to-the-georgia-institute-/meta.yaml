    mathcal{O}(mC)$, where $C$ is the size of the max-flow.\n- Edmonds-Karp: solves\
    \ max-flow for any network. It modifies Ford-Fulkerson by choosing the shortest\
    \ path in the residual network rather than any path.\n  Its running time is $\\\
    mathcal{O}(m^2n)$.\n\nThe maximum flow also describes the minimum cut: all of\
    \ the vertices reachable from $s$ in the residual graph one side of the cut, and\
    \ the other vertices form the other.\n\n# GL\n\n# EXAM 3\n\nHIS study summarizes\
    \ the chapters on Linear Programming and Computational Complexity into an at-a-glance\
    \ quick-reference for the important concepts.\n\n# Linear Programming:\n\n- LPs\
    \ are just systems of inequalities.\n- LPs work because of convexity: given the\
    \ vertices bounding the feasible region, convexity guarantees that greedily jumping\
    \ to a better neighbor leads to optima.\n- LPs don't always have optima: an LP\
    \ can be infeasible based on its constraints, and unbounded on its objective function.\n\
