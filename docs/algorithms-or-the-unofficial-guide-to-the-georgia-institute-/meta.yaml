    \ \\equiv y \\pmod{N}$ 意味着 $x/N$ 和 $y/N$ 有相同的余数。根据定义，如果存在 $N$ 的倍数加上 $r$ 等于 $x$，则\
    \ $x \\pmod{N} = r$，即 $qN+r=x$。\n\n等价类是在一个模下等价的数字集合。因此，“mod 3”有 3 个等价类：$\\{-6,\
    \ -3, 0, 3, 6, \\dots\\}$、$\\{-2, 1, 4, 7, \\dots\\}$ 和 $\\{-1, 2, 5, \\dots\\\
    }$。\n\n### 4.1.1 模幂\n\n模算术中的等价关系就像普通算术中的相等一样。如果 $a \\equiv b \\pmod{N}$ 且 $c \\\
    equiv d \\pmod{N}$，那么 $a+c \\equiv a+d \\equiv b+d \\pmod{N}$。\n\n这一事实使得模幂成为可能。与其通过\
    \ $x \\cdot x \\cdot \\dots$ 或 $((x \\cdot x) \\cdot N) \\pmod{N}\\dots$ 来执行 $x^y\
    \ \\pmod{N}$，我们利用了快速幂：\n\n```\n$x^y \\mod N =\nx \\mod N = a_1$\nx^2 \\equiv a_1^2\
