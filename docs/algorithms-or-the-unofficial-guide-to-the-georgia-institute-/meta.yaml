  - "[PAGE 126]\n\n# ALGORITHMS\n\n+   - We can approximate Max-SAT—where $m^*$ is\
    \ the theoretical maximum number of satisfiable clauses—to have a $\\frac{8}{7}m^*$\
    \ algorithm in polynomial time.\n- Finding integer solutions to LPs (ILPs) is\
    \ NP-hard by a reduction from MaxSAT.\n- ILPs can be approximated by rounding,\
    \ and are often approximated with randomized algorithms that can make some “closeness”\
    \ guarantees.\n\n# Complexity:\n\n+   - In terms of difficulty, $P \\leq NP$-complete\
    \ $\\leq$ NP-hard (we use $\\leq$ since it's unknown if $P \neq NP$).\n- 3SAT\
    \ can be constrained to have variables appear no more than thrice.\n- $S \\subseteq\
    \ V$ is a clique in $\\overline{G}$ and **only if** $S$ is an independent set\
    \ in $G$.\n- $S$ will be a vertex cover if **only if** $\\overline{S} = V \\setminus\
    \ S$ is an independent set.\n\n+   - Known NP-complete problems and their (brief)\
    \ reductions intuitions:\n    - SAT — Subset Sum\n    - $k$-coloring — Hitting\
    \ Set—reduction from VC by making each edge a set, so the hitting set always contains\
    \ one vertex from each edge\n    - Rudrata Path — Dominating Set—reduction from\
    \ VC by forcing all edges to have a vertex in $D$ through a triangle formation\n\
    \    - 3SAT—reduction from SAT by introducing a $y_i$ to break clauses into sets\
    \ of 2 (plus $y_i$).\n    - Stingy SAT—generalization of SAT — Maximum Common\
    \ Subgraph—reduction from VC where keep the original graph and try to match to\
    \ $b$ disconnected vertices (which would be a VC)\n    - IS—reduction from SAT\
    \ by fullyconnecting clauses and variables.\n    - VC—reduction from the IS fact\
    \ — Kite—reduction from clique simple by adding a kite tail\n\n+   - Proving a\
    \ problem is NP-complete is done either by *reduction* from a known NP-complete\
    \ problem or *generalization* to an NP-complete problem. In both cases, you first\
    \ need to show that the solution is verifiable in polynomial time to make the\
    \ problem within NP.\n- For reductions, you need a polynomial time transformation\
    \ and a bidirectional"
  - '[PAGE 127]


    Quick Reference:


    proof of correctness that a solution exists for $A$ if and **only** if it exists
    for $B$ (on the transformed inputs / outputs).


    +   - Useful generalizations include:


    +   - **Subgraph isomorphism**, where you try to transform some generic graph
    $H$ into a specific graph $G$ by dropping vertices (generalization of Clique,
    where $G$ is a clique you want to find)


    +   - **Longest path**, where you want to find the longest non-self-intersecting
    path (generalization of the Rudrata cycle).


    +   - **Dense subgraph**, where you want to find $a$ vertices in a graph that
    contain $b$ edges (generalization of independent set where you want to find vertices
    that contain $no$ edges between them).


    As always, GL;HF!'
