    # ALGORITHMS


    As before, we substitute and generalize:


    $T(n) \le cn + 3T\left(\frac{n}{2}\right)$

    $$\le cn\left(1 + \left(\frac{3}{2}\right) + \left(\frac{3}{2}\right)^2 + \dots
    + \left(\frac{3}{2}\right)^{i-1}\right) + 3^iT\left(\frac{n}{2^i}\right)$


    Our last item is $i = \log_2 n$, as before, so we can again group each term by
    its complexity:


    $T(n) \le cn\left(1 + \left(\frac{3}{2}\right) + \left(\frac{3}{2}\right)^2 +
    \dots + \left(\frac{3}{2}\right)^{\log_2 n-1}\right) + 3^{\log_2 n}T(1)$

    $$\approx \mathcal{O}(n) \cdot \mathcal{O}(n^{0.585}) + \mathcal{O}(n^{1.585})$$

    $$\approx \mathcal{O}(n^{1.585})$$


    # 2.3.3 General Form


    If we know certain about the structure of the recurrence relation, we can actually
    arrive at the complexity by following a series of rules; no substitutions or derivations
    necessary!


    Given the general form of a recurrence relation, where $a > 0, b > 1$:


    $T(n) = 2T\left(\frac{n}{b}\right) + \mathcal{O}(n)$


    we have three general cases depending on the outcome of the geometric series after
    expansion:


    $T(n) = cn\left(1 + \left(\frac{a}{b}\right) + \left(\frac{a}{b}\right)^2 + \dots
    + \left(\frac{a}{b}\right)^{\log_b n-1}\right) + a^{\log_b n} \cdot T(1)$


    +   - If $a > b$, the series is dominated by the last term, so the overall complexity
    is $\mathcal{O}(n^{\log_b a})$.


    +   - If $a = b$, the series is just the sum of $\log_b n - 1$ terms, which collapses
    to $\mathcal{O}(n \log_b n)$.


    +   - If $a < b$, the series collapses to a constant, so the overall complexity
    is simply $\mathcal{O}(n)$.


    Of course, every algorithm will have $\mathcal{O}(n)$ additional recursive-work.
    The general form uses $\mathcal{O}(n^d)$; this is the Master theorem for recurrence
    relations:


