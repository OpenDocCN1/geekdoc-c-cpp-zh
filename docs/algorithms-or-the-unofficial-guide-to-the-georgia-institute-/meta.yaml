  - "[PAGE 17]\n\nrunning time is very transparently O(nB).\n\n**ALGORITHM 1.5:**\
    \ KNAPSACK(), the standard knapsack algorithm with no object rejection, finding\
    \ an optimal subset of values to fit in a capacity-limited container.\n\n**Input:**\
    \ List of object weights: $W = \\{w_1, \\dots, w_n\\}$\n**Input:** List of object\
    \ values: $V = \\{v_1, \\dots, v_n\\}$\n**Input:** A capacity, $B$.\n**Result:**\
    \ The collection of objects resulting in the maximum total value without exceeding\
    \ the knapsack capacity.\n\n```\n// For the base cases, only the first row and\
    \ column are required to be zero, but we zero-init the whole thing for brevity.\n\
    Kn_{n+1,B+1} \\leftarrow 0\nforeach $i \\in [1,n]$ do\n  foreach $b \\in [1,B]$\
    \ do\n    $x \\leq K[i-1, b]\n    if $w_i \\leq b$ then\n      $K[i,b] = \\max[x,\
    \ v_i + K[i, b-w_i]]$\n    else\n      $K[i,b] = x$\n  end\nend\nreturn $K(n,B)$\n\
    ```\n\n# 1.5 Knapsack With Repetition\n\nIn this variant, we have an unlimited\
    \ supply of objects: we can use an object as many times as we'd like.\n\n# 1.5.1\
    \ Simple Extension\n\nLet's try to solve this with the same formulation as before:\
    \ let's define $K(i,b)$ as being the maximum value achievable using a **multiset**\
    \ (that is, a set where duplicates are allowed) of objects $\\{1, \\dots, i\\\
    }$ with the weight $w \\leq b$. Our recurrence relation is almost identical, but\
    \ we don't need to remove the object from our pool of viabilities when considering\
    \ smaller bags:\n\n```\n$K(i,b) = \\max \\begin{cases} K(i-1, b) \\ v_i + K(i,\
    \ b-w_i) \\end{cases}$\n```"
- md: "\n## 1.5.2 Optimal Solution\n\nDo we even need $i$--the variable we use to\
    \ track the objects available to us—anymore? Intuition says “no,” and we might\
    \ formulate an even better solution because of it.\n\nSince we're never considering\
    \ the object set, we only really need to define our subproblem as an adjustment\
    \ of the available capacity. Let's define $K(b)$ as the maximum value achievable\
    \ within the total weight $w \\leq b$.\n\nNow we need to consider all *possibilities*\
    \ of a last object, rather than restrict ourselves to the $i^{th}$ one, and take\
    \ the best one. The recurrence can then be expressed as:\n\n```\n$K(b) = \\max\
    \ \\{v_i + K(b - w_i) \\mid 1 \\leq i \\leq n, w_i \\leq b\\}$\n```\n\nThis is\
    \ formalized in algorithm 1.6.\n\n**ALGORITHM 1.6**: KNAPSACKREPEATING(-), the\
    \ generalized knapsack algorithm in which unlimited object repetition is allowed,\
    \ finding an optimal multiset of values to fit in a capacity-limited container.\n\
    \n- **Input:** List of object weights: $W=\\{w_1, \\dots, w_n\\}$\n- **Input:**\
    \ List of object values: $V=\\{v_1, \\dots, v_n\\}$\n- **Input:** A capacity,\
    \ $B$.\n- **Result:** The collection of objects (possibly with duplicates) resulting\
    \ in the maximum total value without exceeding the knapsack capacity.\n\n```\n\
    $K \\leftarrow 0$ // defines our 1D, B-element array, $K$.\nforeach $b \\in [1..B]$\
    \ do\n  $K(b) = 0$\n  foreach $w_i \\in W \\mid w_i \\leq b$ do\n    $v \\leftarrow\
    \ v_i + K(b - w_i)$\n    if $v > K(b)$ then\n      $K(b) = v$\n  end\nend\nreturn\
    \ $K(B)$\n```\n\n## 1.6 Matrix Multiplication\n\nMultiplying any two matrices,\
    \ $\\mathbf{A}_{n \\times m}$ and $\\mathbf{B}_{m \\times k}$, takes $\\mathcal{O}(nmk)$\
    \ time; there's no avoiding this. However, anyone who has worked with matrices\
    \ knows the order in which you multiply a chain of matrices can heavily impact\
    \ performance. For example, given a $2 \\times 5$ matrix $\\mathbf{A}$, a $5 \\\
    times 10$ matrix $\\mathbf{B}$, and a $10 \\times 2$ matrix $\\mathbf{C}$ as such:\n\
    \n```\n$D_{2\\times2} = (\\mathbf{A}_{2\\times5} \\cdot \\mathbf{B}_{5\\times10})\
    \ \\cdot \\mathbf{C}_{10\\times2}$\n$2\\times100$ result, 100 ops\n```\n\ntakes\
    \ 140 ops, a bit more than the alternative order which takes 120 ops:\n\n```\n\
    $D_{2\\times2} = \\mathbf{A}_{2\\times5} \\cdot (\\mathbf{B}_{5\\times10} \\cdot\
    \ \\mathbf{C}_{10\\times2})$\n$5\\times2$ result, 100 ops\n```\n\nThe set of ordering\
    \ possibilities grows exponentially as the number of matrices increases. We can\
    \ compute the best order efficiently?\n\nTo start, envision a particular parenthesization\
    \ as a binary tree, where the root is the final product and the branches are particular\
    \ matrix pairings:\n\n![](img/618d10cd4b9a60c3e651b4ab71cd8ece_19_0.png)\n\nThen,\
    \ if we associate a cost with each node (the product of the matrix dimensions),\
    \ a cost for each possible tree bubbles up. Naturally, we want the tree with the\
    \ lowest cost. The dynamic programming solution can come from a key insight: for\
    \ a root node to be optimal, all of its subtrees must be optimal.\n\n### 1.6.1\
    \ Subproblem Formulation\n\nLet's formally define our problem. If we have $n$\
    \ matrices, $\\mathbf{A}_1, \\mathbf{A}_2, \\dots, \\mathbf{A}_n$, we can define\
    \ their sizes as being $m_{i-1} \\times m_i$, since the inner dimensions of a\
    \ matrix product must match. That is, the size of $\\mathbf{A}_2$ would be $m_1\
    \ \\times m_2$. The cost of an arbitrary product, $\\mathbf{A}_i\\mathbf{A}_j$,\
    \ is $c_{ij} = m_{i-1}m_ij_j$.\n\nNow we can generalize the above binary tree's\
    \ structure: the subtree on the left is $\\mathbf{A}_1\\mathbf{A}_2\\dots\\mathbf{A}$,\
    \ while the subtree on the right is $\\mathbf{A}_{i+1}\\mathbf{A}_{i+2}\\dots\\\
    mathbf{A}_n$. Thus, an arbitrary subtree is a product defined by some range $[j,k]$:\
    \ $\\mathbf{A}_j\\mathbf{A}_{j+1} \\dots \\mathbf{A}_k$ which can be thought of\
    \ as a \"substring\" of $[1, 2, \\dots, n]$.\n\n> ¹ It should be fairly obvious\
    \ how we compute cost. Multiplying two matrices, $W_{ab}$ and $Y_{bc}$, takes\
