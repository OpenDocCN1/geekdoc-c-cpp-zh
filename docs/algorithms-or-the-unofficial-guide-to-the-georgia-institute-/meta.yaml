  md: "# CHAPTER 3: Graphs\n\n+   - A Literal is one of the formations of the variable:\
    \ $x$ or $\bar{x}$, which would be “NOT $x$”. For $n$ variables, we have $2n$\
    \ literals:\n\n$$$x_1, \bar{x}_1, x_2, \bar{x}_2, \\dots, x_n, \bar{x}_n$$\n\n\
    +   - A clause is a series of literals connected with logical OR. For example:\n\
    \n$$$x_3 \\vee \bar{x}_5 \\vee \bar{x}_1$$\n\n+   - A formula is a series of clauses\
    \ connected with logical AND. For example, the following is a formula:\n\n$$$f\
    \ = (x_3)_{\text{clause}} \\wedge (x_3 \\vee \bar{x}_5)_{\text{clause}} \\wedge\
    \ (x_3 \\vee \bar{x}_1 \\vee \bar{x}_2) \\wedge (\bar{x}_2 \\vee x_1) \\text{etc.}$$\n\
