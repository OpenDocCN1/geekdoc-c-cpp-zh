    exists).


    # Solution


    The description of a dominating sets looks remarkably similar to that of a vertex
    cover; the term “budget” should include us. We will then reduce from the vertex
    cover problem to the dominating set problem.


    **Transformation** Given a graph, we modify each edge to the dominating set to
    include at least one endpoint and result in a valid vertex cover. Specifically,
    we create a triangle to each edge: for each edge $(u, v)$, we introduce a new
    vertex $w$ and add the edges $(w, u)$ and $(w, v)$.


    For example, given the original vertices in blue we add the bonus vertices in
    red:


    ![](img/618d10cd4b9a60c3e651b4ab71cd8ece_117_0.png)


    **Forward Direction** This is trivial: a vertex cover is a dominating set by definition.
    Since every edge in the graph has at least one of its vertices in the VC and its
    other vertex is obviously its neighbor, this is a dominating set.


    **Reverse Direction** Any of our vertices needs at least one vertex to be within
    $D$; this is obvious—if the original vertices are covered by the dominating set
    condition without using $w$, then w is out. Now if $w$ is used, we can use $u$
    or $v$ instead and still maintain a dominating set. And since $u$ and/or $v$ is
    always used for any given edge, this is a vertex cover!


