    # DPV 2.7: Roots of Unity


    We want to find the sum and product of an arbitrary $n^{th}$ roots of unity.


    Solution The sum can be found by applying the arithmetic series formula:


    ```

    $$\sum_{k=0}^{n-1} \omega^k = \omega^0 + \omega^1 + \omega^2 + \dots + \omega^{n-2}
    + \omega^{n-1}$$

    $$\frac{1-\omega^n}{1-\omega} = 0$$

    ```


    call that $w^n = 1$


    The product can be simplified via Euler''s identity:


    ```

    $$\sum_{k=0}^{n-1} \omega^k = \omega^0 \cdot \omega^1 \cdot \dots \cdot \omega^{n-2}
    \cdot \omega^{n-1}$$

    $$\omega^{\sum_{k=0}^{n-1} k} = \omega^{\frac{n(n-1)}{2}}$$

    $$\left(e^{i\frac{2\pi}{n}}\right)^{\frac{n(n-1)}{2}}$$

    $$= e^{i\pi(n-1)} = (e^{i\pi})^{n-1}$$

    $$= (-1)^{n-1}$$

    ```


    Euler''s identity: $e^{i\pi} = -1$


    When $n$ is odd (that is, expressible as a value $n=2x+1$), the roots'' product
    is 1:


    ```

    $(-1)^{n-1} = (-1)^{(2x+1)-1} = (-1)^{2x}$$

    $$= ((-1)^2)^x = 1^x = 1$$

    ```'
