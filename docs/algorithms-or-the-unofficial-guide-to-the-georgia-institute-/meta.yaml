  md: 'Within NP Verifying the solution for 3SAT is just as easy as for SAT, in fact
    taking $\mathcal{O}(m)$ time since $n \le 3$.


    Reduction Because of the similarity in the problems, forming the reduction is
    fairly straightforward. A given long SAT clause $c$ can be transformed into a
    series of 3-literal clauses by introducing $k-3$ new auxiliary variables that
    form $k-2$ new clauses:


    ```

    $$(x_1 \vee x_2 \vee \dots \vee x_k) \implies (x_i \vee x_{i+1} \vee y_i) \wedge
    (y_i \vee x_{i+3} \vee y_2) \wedge$

    $(y_{k-1} \vee x_{i+4} \vee y_{k-3}) \wedge \dots \wedge (y_{k-5} \vee x_{k-1}
    \vee x_k)$

    ```


    For example, the 5-SAT is transformed as follows:


    ```

    $$C = (\bar{x}_2 \vee x_3 \vee \bar{x}_1 \vee x_5)$

    $C'' = (\bar{x}_2 \vee x_3 \vee y) \wedge (\bar{y} \vee \bar{x}_1 \vee z) \wedge
    (\bar{z} \vee x_4 \vee x_5)$$

    $C \implies C''$

    ```


    The bidirectional proof of correctness can be done by contradiction.


    > 3SAT: More Restrictions


    There''s an important note in Algorithms that isn''t highlighted in lecture that
    stipulates a restricted version of 3SAT in variables can only appear in $\le 3$
    clauses is still NP-complete (see pp. 251 for the transformation).


    # 6.3.2 Independent Sets


    The subset of vertices $S \subset V$ is in an independent set if no edges are
    contained in $S$; in words, $x, y \in S; (x, y) \notin E$. Finding small independent
    sets is easy; finding large, or the $largest$ independent set is difficult.


    Maximum Independent Set:


    **Input:** An undirected graph, $G = (V, E)$.


    **Output:** The independent set $S$ of maximum size.


    This problem is not known to be $\in$ NP: the only way to check the validity of
    a solution to the problem is by solving it, and no polynomial-time algorithm for
    solving it is known.


    Like we adapted knapsack to be NP-complete (see subsection 6.1.4), we can adapt
    the independent set problem to be NP-complete by adding a goal input $g$. Then,
    the solution’s validity becomes trivial to check.'
