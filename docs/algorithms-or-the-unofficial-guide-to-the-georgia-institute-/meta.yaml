  md: '# ALGORITHMS


    **ALGORITHM 3.4:** The Ford-Fulkerson algorithm for computing max-flow.


    **Input:** A flow network: a digraph $G = (V,E)$, a capacity for each $e \in E$,
    $c_e$, and start/end vertices $s, t \in V$.


    **Result:** The maximum flow graph, where $f_e$ indicates the maximum flow along
    the edge $e \in E$.


    ```

    $\forall e \in E: f_e = 0$\nrepeat:

    \quad$Build the residual network, $G^f$ for the current flow, $f$.

    \quad$Find any path $P = s \sim t$ in $G^f$.

    \quad$Let $c(P)$ be the smallest capacity along $P$ in $G^f$: $c(P) = \min_c\{e
    \in P\}$.

    \quad$Augment $f$ by $c(P)$ units along $P$.

    until no $s \sim t$ path exists in $G^f$\nreturn $f$

    ```


    rounds to the maximum flow; thus, the overall running time of the Edmonds-Karp
    algorithm is $\mathcal{O}(nm^2)$.


    > FUN FACT: Record-Breaker

    James Orlin created a max-flow algorithm with a $\mathcal{O}(mn)$ run time in
    2013.


    # 3.7.3 Variant: Flow with Demands


    This variant on the max-flow problem poses demands on certain edges, requiring
    that they have a particular capacity. We will see how to reduce this to the regular
    max-flow problem.


    The input is a flow network, as well as a demand for each edge:


    \forall e \in E: d(e) \geq 0


    A *feasible* flow $f$ is one that fulfills both the demand and does not exceed
    the capacity: $d(e) \leq f(e) \leq c(e)$. If we can find the existence of a feasible
    flow, augmenting it to the maximum feasible flow will be straightforward.


    We want to find a flow network—with graph $G'' = (V'', E'')$ and edge capacities
    $c''(e)$—that we can plug-play into our existing max-flow algorithms.


    Integrating demands into capacities is straightforward: an edge with capacity
    5 and demand 3 is similar to an edge with capacity 2 and no demand. This is the
    first step in our reduction: $c''(e) = c(d) - d(e)$.


    Kudrayvtsev


