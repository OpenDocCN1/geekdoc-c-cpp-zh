    c_{uv} \\ f_{vu} & \text{if } (u, v) \in E \text{ 且 } f_{vu} > 0 \end{cases}$$

    ```


    ## 3.7.1 Ford-Fulkerson 算法


    Ford-Fulkerson 算法的运行时间是伪多项式的 $O(C|E|)$，其中 $C$ 是输出 $t$ 的理论最大流量（流入节点的容量之和）。


    分析依赖依赖一个（巨大的）假设，即所有容量都是整数；那么，算法保证每轮流量增加 $\ge 1$ 个单位。由于算法的运行次数 $\le C$ 轮，且每轮需要
    $O(n+m)$ 时间（由路径查找主导），因此总共需要 $O(mC)$ 时间（为了简化考虑，假设 $|E| \ge |V|$）。


    它的正确性源于最大流最小切定理，并在稍后证明。


    ## 3.7.2 Edmonds-Karp 算法


    这种基础算法在增广 $f$ 的方式上有所不同。它不是使用任意路径（例如通过深度优先搜索找到），而是使用通过广度搜索找到的最短路径。在这种情况下，可以证明最多需要
    $mn$ 轮达到最大流；因此，Edmonds-Karp 算法的整体运行时间为 $\mathcal{O}(nm^2)$。


    > 趣味知识：破纪录者

    > James Orlin 在 2013 年创建了一个运行时间为 $\mathcal{O}(mn)$ 的最大流算法。


    **算法 3.4:** 计算最大流的 Ford-Fulkerson 算法。


    **输入：** 一个流网络：一个有向图 $G = (V,E)$，每个 $e \in E$ 的容量 $c_e$，以及起点/终点 $s, t \in V$。


    **结果：** 最大流图，其中 $f_e$ 表示沿边 $e \in E$ 的最大流量。


    ```

    $\forall e \in E: f_e = 0$

    重复:

    \quad$为当前流 $f$ 构建残差网络 $G^f$。

    \quad$在 $G^f$ 中找到任意路径 $P = s \sim t$。

    \quad$令 $c(P)$ 为 $G^f$ 中 $P$ 上的最小容量：$c(P) = \min_c\{e \in P\}$。

    \quad$沿 $P$ 增广 $c(P)$ 个单位的 $f$。

    直到 $G^f$ 中不存在 $s \sim t$ 路径

    返回 $f$

    ```


    ## 3.7.3 变体：有需求的流


    最大流问题的这个变体对某些边提出了需求，要求它们具有特定的容量。我们将看到如何将其归普通的最大流问题。


    输入是一个流网络，以及每条边的需求：


    $\forall e \in E: d(e) \geq 0$


    *可行的*流 $f$ 是一个同时满足需求且不超过容量的流：$d(e) \leq f(e) \leq c(e)$。如果我们可以找到可行流的存在，那么将其增广为最大可行流将是简单的。


    我们想要找到一个流网络——具有图 $G'' = (V'', E'')$ 和边容量 $c''(e)$——我们可以将其直接插入到现有的最大流算法中。


    将需求整合到容量中是简单的：一个容量为 5 需求为 3 的边类似于容量为 2 且没有需求的边。这是我们归约的第一步：$c''(e) = c(d) - d(e)$。


    然而，这还不够。我们需要建模需求本身。每个顶点都有某些流入需求和流出需求。为了确保其满足，我们将每个 $v \in V$ 连接到新的“主”源 $s''$ 和汇
    $t''$。即：


    1. 对于除 $s$ 外的每个顶点，添加一条边 $s'' \to v$，容量 $c''(s'', v) = d^{in}(v)$（其中 $d^{in}(v)$
    是流入 $v$ 的总需求）。

    2. 对于除 $t$ 外的每个顶点，添加一条边 $v \to t$，容量 $c((v, t)) = d^{out}(v)$。


    最后，为了确保 $s$ 的流量等于进入 $t$ 的流量，我们创建一条边 $t \to s$，$c''(t, s) = \infty$。


    对于 $G$ 中的流 $f$，我们知道它不能超过总需求，所以 $size(f'') \le D$。如果 $size(f'') = D$，我们称 $f$ 为**饱和**流。


    > **性质 3.7.** *如果具有额外需求的网络 $G$ 有一个可行流，则构造的 $G''$ 有一个饱和流。*


    ## 3.8 最小切


    记住，切用于将图分割（或划分）为两部分——称为“左”和“右”子图，使得 $V = L \cup R$。在本节中，我们将关注一种特定的切，称为 st-切，它分离顶点
    $s$ 和 $t$，使得 $s \in L$ 且 $t \in R$。


    这是我们示例图中的一个 st-切：


    ![](img/618d10cd4b9a60c3e651b4ab71cd8ece_51_0.png)


    注意，两个子图并不需要是[连通的]：$f \in L$ 但与 $a, b$ 或 $s$ 不连通。我们感兴趣的是这个切的容量；这是从 $L \sim R$ 的边总容量。这些“离开”
    $L$ 的边，在上方用绿色高亮显示。


    $capacity(L, R) = \sum_{(v,w) \in E, v \in L, w \in R} c_{vw}$


    上述示例切的容量为 26（再次，简单地相加绿色边的容量）。根据这些定义和示例，我们可以公式化一个问题。


    这是我们示例图的一个最小 st-切：


    ![](img/618d10cd4b9a60c3e651b4ab71cd8ece_52_0.png)


