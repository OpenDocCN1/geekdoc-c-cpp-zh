- md: "\n# Algorithms\n\nor: the Unofficial Guide to the Georgia Institute of Technology's\
    \ **CS6515**: Graduate Algorithms\n\nGeorge Kudraytvtsev\ngeorge.k@gatech.edu\n\
    \nLast Updated: September 17, 2020\n\n> The only way to get through this course\
    \ is by solving an uncontrollably-infinite number of practice problems while fueled\
    \ by copious of caffeine ☕.\n\nIf you find these notes useful and are in a generous\
    \ mood, feel free to mine my stimulant addiction: shoot me a donation on Venmo\
    \ @george_k_btw or PayPal kudrayvtsev@abcglobal.net with whatever this guide was\
    \ worth to you.\n\nGood luck, and happy studying! \U0001F60A\n\nWHY do we study\
    \ algorithms, and why these specifically? The most important lesson that should\
    \ come out of this course—one that is most mentioned in Chapter 8 of *Algorithms*\
    \ and the 4th lecture of the course—is that many problems can be reduced to an\
    \ algorithm taught here; they are considered **fundamental algorithms in computer\
    \ science**, and if you know them inside-and-out, you can transform “novel” problems\
    \ into a problem that can be solved by one of these algorithms.\n\nFor example,\
    \ a complicated problem like “you make change for $X coins in a cash register”\
    \ can be *reduced* to Knapsack problem, a quest to “find the longest palindrome\
    \ in a string” can be *reduced* to finding the Longest Common Subsequence, and\
    \ the arbitrage problem of finding profitable currency trades on international\
    \ exchanges can be *reduced* to finding negative-weight cycles via Shortest Paths.\n\
    \nKeep this in mind as you work through exercises.\n\n## Notes\n\n- 1 Dynamic\
