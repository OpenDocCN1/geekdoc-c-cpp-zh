    ## Walkthrough: Reductions (DPV Ch. 8)


    **Input:** Two graphs, $G_1 = (V_1, E_1)$ and $G_2 = (V_2, E_2)$ and a budget,
    $b$.


    **Output:** Two sets of vertices $V''_1 \subseteq V_1$ and $V''_2 \subseteq V_2$
    such that deleting them from their respective graphs leaves at least $b$ nodes
    in each graph and makes the graphs identical.


    ## Solution


    At first it may seem that this has a relationship to the Subgraph Isomorphism
    problem above (see 8.10a), and it does, of sort, in the sense that all of the
    graph problems are sort of similar. We proceed by a reduction from the vertex
    cover problem.


    **Within NP** We technically need a mapping from one set of vertices to another
    in this for it to be verifiable in polynomial time, but if we just consider equal
    graph structure to make equal graphs, then it''s pretty trivial. All we need to
    confirm that the amount of vertices matches (constant time, or linear if your
    data structure is garbage) and that they are the per-vertex. We can do this by
    finding the vertex in $V_1 \setminus V''_1$ that has the same edges as $V_2 \setminus
    V''_2$ in $O(mn)$ time: compare each list (which is $\le m$ edges) of each vertex
    (which is $\le n$ long), and do for every vertex. Since both graphs could be fully-connected
    in the worst case, this takes $O(n^3)$ time overall.


    **Transformation** Let $G_1 = (V, E)$ be the original graph, $G_2 = (V_2, \emptyset)$
    be simply disconnected (where $b''$ is the input budget to the VC problem rather
    than the above budget), and the budget be $b = b''$ (meaning nothing in $G_2$
    gets removed). Then, we claim that the Max-Common-Subgraph problem has a solution
    iff the VC problem has a solution.


    **Forward Direction** Given a $V^* \subseteq V$ to the VC problem with the $(G,
    b'')$, the above also has a solution since one could drop $V''_1 = V^*$ and ($V''_2
    = \emptyset$, so no action is required). By the definition of a vertex cover,
    $V \setminus V''_1$ would leave no edges and leave exactly $b = b'' = |V_2| =
    |V \setminus V''_1|$ vertices behind (and thus match $G_2$).


    **Reverse Direction** Given a solution pair $(V''_1, V''_2)$ to the Max-Common-Subgraph
    as described above, the VC problem will also have a solution: drop $V''_2$ from
    the original graph and return the resulting set of vertices.


    DPV 8.16:


    DPV 8.17: Show that any problem within NP can be solved in $O(2^{p(n)})$ time,
    where $p(n)$ is some polynomial.


    Solution With an input size of $n$ elements, we can simply do an exhaustive search
    over all of them since verifying their correctness takes polynomial time (by the
    nature of being within NP). There are $2^n$ possible inputs, and each takes some
    $q(n)$ time to verify (where $q$ is the verification algorithm), then its big-$O$
    is:


    ```

    = O(2^n \cdot q(n))

    = O(2^n \cdot q(n))

    = O(2^{n+q(n)})

    ```


    If we let $p(n) = n + q(n)$, we''re done.


    ## DPV 8.18: Breaking RSA


    Show that if $P = NP$, RSA can be broken in polynomial time.


    Solution relies on the fundamental mathematical difficulty that factoring a product
    of two primes, $N = pq$ is not doable in polynomial time.


    If it is, then finding separate $p$ and $q$ becomes trivial, as an adversary can
    find $\varphi(N) = (p-1)(q-1)$ and compute the inverse of $e$ under mod $\varphi(N)$
    themselves (recall that $e = 1 \pmod{\varphi(N)}$, revealing the decryption key.


    ## DPV 8.19: Kite


    A Kite is a graph on an even number of vertices ($|V| = 2n$) in $n$ of the vertices
    form a clique and the other $n$ are connected in a "tail" that is a simple path
    from one of the vertices in the tail a fully-connected graph (think quite literally
    of a kite and its string, except the kite itself is).


    Kite Search:


    - **Input:** A graph $G = (V, E)$ and a goal $g$.

    - **Output:** A subgraph of $G$ which is also a kite and contains $2g$ nodes.


    ## Solution


    Aren''t we (at the very least) trying to find a clique within a graph and some
    extra stuff ("tail"?) This is how reduction will proceed.


    Transformation If Kite can find a solution, so Clique by dropping the path, the
    transformation from $(G, g)$ (the graph and goal from an arbitrary vertex to finding
    cliques) just involves adding a $g$-length path from an arbitrary vertex in $G$
    to fulfill the kite requirements. In order to show that:


    ![](img/618d10cd4b9a60c3e651b4ab71cd8ece_116_0.png)


    Walkthrough: Reductions (DPV Ch. 8)


    **Forward Direction** Given a solution $Q$ to $(G, g)$, we can just add a $g$-length
    “tail” to any of the vertices in $Q$ and get a solution to the kite problem.


    **Reverse Direction** Given a solution $Q$ to the kite problem on the transformed
    $G$ as input, we can drop the tail from the solution to obtain a solution for
    getting a $g$-size clique.


    **DPV 8.20:** We must prove that the following problem is NP-complete:


    ## Dominating Set:


    - **Input:** A graph, $G = (V, E)$ and a budget, $b$.

    - **Output:** A dominating set, $D \subseteq V$ of size $|D| \leq b$, in which
    every vertex $v \in V$ is either within $D$ or has a neighbor within $D$ (if it
    exists).


    ## Solution


    The description of a dominating sets looks remarkably similar to that of a vertex
    cover; the term “budget” should include us. We will then reduce from the vertex
    cover problem to the dominating set problem.


    **Transformation** Given a graph, we modify each edge to the dominating set to
    include one vertex.


    **Forward Direction** This is trivial: a vertex cover is a dominating set.


    **Reverse Direction** If there is a dominating set, we can find a vertex cover.


    DPV 8.21: Sequencing by Hybridization

