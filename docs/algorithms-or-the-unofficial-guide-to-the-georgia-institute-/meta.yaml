    # 3.7.1 Ford-Fulkerson Algorithm


    The running time of the Ford-Fulkerson algorithm is pseudo-polynomial in $O(C|E|)$,
    where $C$ is the theoretical maximum output flow to $t$ (the sum of incoming vertices’
    capacities).


    This analysis relies on a (huge) assumption that all capacities are integers;
    then, the algorithm guarantees that the flow increases by $\ge 1$ unit per round.
    Since there are $\le C$ rounds to the algorithm, and a single round takes $O(n+m)$
    time (dominated by path-finding), it requires $O(mC)$ time in total (if $|E| \ge
    |V|$ to simplify).


    Its correctness follows from the max-flow-min-cut theorem, (and proven) later.


    # 3.7.2 Edmonds-Karp Algorithm


    This fundamental algorithm varies in the way it augments $f$. Rather than using
    any path (found via depth-first search, for example), it uses the shortest path
    found by breadth-first search. When this is the case, it can be proven that it
    takes at-most mn


