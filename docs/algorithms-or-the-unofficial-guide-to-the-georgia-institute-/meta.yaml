    # GL\n\n# 考试 3\n\n这份学习指南将线性规划和计算复杂度章节总结为一目了然的关键概念快速参考。\n\n# 线性规划：\n\n- 线性规划仅仅是不等式组。\n\
    - 线性规划之所以有效是因为凸性：给定可行区域的顶点，凸性保证了贪心跳到更好的邻居可以获得最优解。\n- 线性规划并不总有最优解：线性规划可能根据约束无解或根据目标函数无界。\n\
    \  - 可行性通过添加 $z$ 并检查其在最优情况下是否为正来测试：$Ax z \\geq b$。\n  - 有界性通过检查对偶规划的可行性来测试：如果对偶无解，则原规划要么无界要么无解（你可以通过可行性测试来判断）。\n\
    \n- 对偶规划：\n\n线性规划的对偶寻找 $y$——应用于原约束并获得相同最优值的最小系数——形式如下：\n```\nmax cᵀy  Ax ≤ b \
    \   ⇔ min bᵀy c\n       x ≥ 0    y ≥ 0\n```\n- 弱对偶性基本上说明原规划对于任何可行点都被对偶界限：$cᵀx\
    \ \\leq bᵀ$。\n- 强对偶性指出，如果在原规划和对偶规划中找到了相同的相同可行点。\n- 只有当两个线性规划都可行且有界时，最优解才存在。\n\n"
