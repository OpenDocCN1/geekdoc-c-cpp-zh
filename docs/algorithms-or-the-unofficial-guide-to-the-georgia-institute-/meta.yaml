    # # 3.6 Minimum Spanning Trees


    The input to the minimum spanning tree problem (MST) is an undirected graph $G=(V,E)$
    with weights $w(e)$ for $e \in E$. The goal is to find the minimal-size, minimum
    weight, connected subgraph that “spans” the graph. Naturally, the overall weight
    of a tree is the sum of the weights of edges.


    Note some basic properties about trees:


    +   - A tree on $n$ vertices has exactly $n-1$ edges.

    - Exactly one path exists between every pair of vertices.

    - Any connected $G=(V,E)$ with $|E|=|V|-1$ is a tree.


    This last point bears repeating, as it will be important in determining the minimum
    cut of a graph, later. The only thing necessary to prove that a graph is a tree
    is to show that its edge count is minus one.


    # # 3.6.1 Greedy Approach: Kruskal’s Algorithm


    We''ll attempt to build the minimum spanning tree by consistently building up
    from vertices with the lowest cost without creating any cycles. Our running example
    graph will:


    ![](img/618d10cd4b9a60c3e651b4ab71cd8ece_44_0.png)


    The first 5 edges are extremely easy to determine, but the 6-cost edge would cause
    a cycle.'
