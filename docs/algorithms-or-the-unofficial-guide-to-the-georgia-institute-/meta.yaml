  md: '# ALGORITHMS


    # Attempt #1


    The easiest baseline to start with is by defining the subproblem as operating
    on a smaller prefix of the input. Let''s define $K(i)$ as being the maximum achievable
    using a subset of objects up to $i$. Now, let''s try to express this as a recurrence.


    What does our 1D table look like through the example above? Given


    ```

    values: 15 10 8 1

    weights: 15 12 10 5

    ```


    We can work through and get $K : 15 15 15 15$. On the first step, obviously 15
    is better than nothing. On the second step, we can''t take both, but keeping 15
    is preferred. On the third step, we can grab $v_2$ and $v_2$, but notice that
    this requires bigger knowledge than what was available in $K(1)$ or $K(2)$. We
    needed to take a suboptimal solution in $K(2)$ that gives us enough space to properly
    consider object 3...


    This tells us our subproblem definition was insufficient, and we need to consider
    suboptimal solutions as we build up.


    # Attempt #2


    Let''s try a subproblem that tracks the $(i-1)^{th}$ problem with a smaller capacity,
    $b \le B - w_i$. Now our subproblem tracks a 2D table $K(i, b)$ that represents
    the maximum value achievable using a subset of objects (up to $i$, as before),
    AND keeps their total weight $\le b$. The solution lives at $K(n, B)$.


    Our recurrence relation faces two scenarios: either we include $v_i$ in our knapsack
    if there''s space for it AND it''s better than excluding it, or we don''t keep
    the knapsack the same.


    ```

    $K(i, b) = \max \left\{ \begin{array}{ll} v_i + K(i-1, b-w_i) & w_i \le b \ &
    & otherwise \end{array} \right\}$

    ```


    with the trivial base cases $K(0,b) = K(i,0) = 0$, which is when we have no objects
    and no knapsack, respectively. This algorithm is formalized in algorithm 1.5;
    its'
