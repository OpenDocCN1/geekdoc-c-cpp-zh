    = 0$ if all of the $x_i$s are 0, right? So just sum them up!


    $z_j \le y_a + y_b + \dots$


    However, this does not work for clauses with complements, like $c_j = (\overline{x_a}
    \vee x_b \vee x_c)$, since $z_j = 0$ despite $y_a = 1$. To alleviate this, we
    look at the complement as well:


    $z_j \le (1 - y_a) + (1 - y_b) + \dots$


    Given this translation from $f$ to the ILP, we now want to maximize the number
    of satisfied clauses:


    | Objective Function: | $\max \sum_{j=1}^{m} z_j$ |

    | Subject to: | For all $i = 1, \dots, m: 0 \le y_i \le 1.\nFor all $j = 1, \dots,
    m: 0 \le z_j \le 1$. |


    Then, both the positive and complementary versions of $y_i$ should be: $\sum_{i
    \in C_j} y_i + \sum_{i \in C_j^c} (1 - y_i) \ge z_j$


    Finally, $y_i, z_j \in \mathbb{Z}$.


    Given this reduction and given the fact that Max-SAT is known to be NP-hard, ILP
    must also be NP-hard.


