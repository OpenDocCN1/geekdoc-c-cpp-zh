    # 5.5.1 ILP is NP-Hard


    Many problems can be reduced to integer linear programming. While LPs are in the
    P complexity class, ILP is NP-hard; we will prove this by reducing the Max-SAT
    from earlier to ILP. Since Max-SAT is NP-hard, ILP must also be.


