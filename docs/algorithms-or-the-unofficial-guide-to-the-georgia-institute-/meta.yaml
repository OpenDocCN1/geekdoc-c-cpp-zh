    # DPV 2.14: Removing Duplicates


    Our task is to remove all the duplicates from an (unsorted) array of $n$ elements
    in $O(n \log n)$ time.


    **Solution** The duplicates can be removed very easily: since sorting takes $\mathcal{O}(n
    \log n)$, we''re still within the time bounds and put duplicates adjacent to each
    other. All that remains is shifting the array to replace duplicates efficiently,
    which we can do by tracking a ‘shift index’ that increments as we encounter duplicates.
    At the end of the single $O(n)$ pass, all of the dupes will be at the end and
    we can trim the array accordingly.


