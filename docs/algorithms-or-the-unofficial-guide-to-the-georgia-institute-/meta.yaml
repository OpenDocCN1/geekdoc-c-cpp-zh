    ## 5.2 Generalization


    The simple example above we can work out by hand and visualize neatly, but how
    does this scale to 3 variables or an arbitrary n variables? Things get really
    hard to visualize very quickly. The last key points that we observed above will
    be essential in our generation and lead to the simplex algorithm.


    From a high level, it is essentially a "locally-greedy" algorithm: we continually
    choose better and better vertices in the convex polygon until we reach one whose
    neighbors are all worse, and this is a global optimum.


    ## 5.2.1 Standard Form


    First, we need to standardize the way that linear programs are represented before
    we can devise a generic algorithm for solving them.


    Given $n$ variables, $x_1, x_2, \dots, x_n$, the goal is to optimize the objective
    function given the constraints described by an $m \times n$ matrix $A$ and an
    $m$-length vector $b$ as follows:


    | Objective Function: | $\max[c_1x_1 + c_2x_2 + \dots + c_nx_n]$ or simply $c^Tx$
    |

    | :--- | :--- |

    | Subject to: | $a_{11}x_1 + a_{12}x_2 + \dots + a_{1n}x_n \leq b_1$, $x_1 \geq
    0$ |

    | | $a_{21}x_1 + a_{22}x_2 + \dots + a_{2n}x_n \leq b_2$ and $x_2 \geq 0$ |

    | | : |

    | | $a_{m1}x_1 + a_{m2}x_2 + \dots + a_{mn}x_n \leq b_m$, $x_n \geq 0$ |

    | Or, satisfy | $Ax \leq b$ and $x \geq 0$ |


    We can transform sets of problems to follow this form. However, problems that
    define strict inequalities are **not allowed** in linear programming: notice that
    $\max_e[x < 100]$, for example, is ill-defined since we can have infinite precision.


    ## 5.2.2 Example: Max-Flow as Linear Programming


    The max-flow problem can be expressed as a linear program. Let recall its formulations:

    Max-Flow Definition:


    - Input: A directed graph, $G = (V, E)$ with capacities $c_e > 0, \forall e \in
    E$. Source and sink vertices $s, t \in V$.

    - Output: An optimal flow, $f^*$, such that any $f_e$ cannot be any bigger while
    maintaining a valid flow.


    To express this as a linear program, our objective function is to maximize the
    flow coming out of the source vertex while ensuring each edge has a valid flow:


    Objective Function:

    max $\sum_{(s,v) \in E} f_{sv}$


    Subject to:

    For every $e \in E$: $0 \le f_e \le c_e$.

    For every $v \in V \setminus \{s,t\}$: $\sum_{(w,v) \in E} f_{wv} = \sum_{(v,z)
    \in E} f_{vz}$


    Every term here is a linear function, so linear programming applies.


    ### 5.2.3 Algorithm Overview


    With our generic problem formulation out of the way, we can work towards algorithm
    for finding the global optimum. Remember, the goal is to find the vertex of the
    convex polyhedron that satisfies the constraints is maximal relative to its neighbors.


    With $n$ variables, we''re working in $n$ dimensions, and we have $n+m$ constraints.
    The feasible region is the intersection of $n+m$ half-spaces and it forms a convex
    polyhedron. Then, the vertices of polyhedron are the points that satisfy some
    $n$ constraints with equality and also satisfy the other $m$ constraints with
    $\le$.


    Bounds: In the worst case, there''s a huge number of vertices in the polyhedron:
    from $n+m$ constraints, we choose $n$, $\mathcal{O}\binom{n+m}{n}$ grows exponentially.
    Further, there are up to $nm$ neighbors for each vertex.


    Choices: There are several algorithms that solve linear programs in polynomial
    time, including ellipsoid algorithms and interior point methods. the simplex algorithm
    has a worst-case bound of exponential time, but it''s still widely used because
    it guarantees a global optimum and works incredibly on huge linear programs.


    ### 5.2.4 Simplex Algorithm


    The basic high level idea of the simplex algorithm is very simple.


    - We begin at $x=0$, which satisfies our baseline non-negativity constraints.

    - If it doesn''t satisfy any of our other constraints, we know that it is an infeasible
    LP.

    - Then, we look for the neighboring vertex with a (strictly) higher objective
    value. When we found, we "move" and repeat this process.

    - If at any point in time none of the neighbors are strictly better, we''ve found
    the global optimum.


    The variations of the simplex algorithm lie in the choice of vertex. We could
    choose the first one (to avoid enumerating them), we could choose randomly (to
    avoid getting stuck on multiple runs), and we could just choose the best (then
    we pay the price of enumeration). There are many different heuristics for this
    algorithm, each with their own tradeoffs.


    ## 5.2.5 Invalid LPs


    Some linear programs will be infeasible, having no feasible region; this is dependent
    only on the constraints. Others will be unbounded, where the maximum objective
    function increases indefinitely; this is dependent only on the objective function.


    Feasibility Determining feasibility can be done by introducing a new unrestricted
    variable $z$ that we introduce into our constraints:


    $a_{1}x_{1}+\dots+a_{n}x_{n}\leq b$

    to: $a_{1}x_{1}+\dots+a_{n}x_{n}+z\leq b$


    Satisfying this is trivial with a small-enough $z$ ($z \sim -infty$). However,
    if we could find a $z \geq 0$ that satisfies the new constraint, the original
    LP is feasible. We do this by actually running maximization on a new LP:


    Objective: max[|z|]

    Subject to: $Ax+z\leq b \quad x\geq 0$


    Checking $z \geq 0$ tests feasibility and gives us a starting point for the simplex
    algorithm on the original LP.


    Unbounded Determining whether or not a linear program is unbounded depends on
    its dual LP (discussed next). Specifically, we''ll see that Corollary 5.3.2 tells
    us that an LP''s dual linear program is infeasible (which we can determine easily
    as we showed), the original is either unbounded or infeasible.


    ## 5.3 Duality


    Suppose gives us a value for the objective function and claims that it''sr the
    global optimum for its LP. Can we verify this?


    Consider a simple fact: the maximum objective function is the value for any linear
    combination of the constraints. For example, let''s work through this LP for which
    the known optimum is $x^{*} = [x_{1}\ x_{2}\ x_{3}] = [200\ 200\ 100]$:


    Objective Function:

    max[x_1 + 6x_2 + 10x_3]


    Subject to:

    $x_1 \le 300$

    $x_2 \le 200$

    $x_1 + 3x_2 + 2x_3 \le 1000$

    $x_3 + 3x_3 \le 500$

    $x_1, x_2, x_3 \ge 0$


    How would we find this y? Well, the goal is to find a y such that the left side
    is as big as the objective function. This is the same as saying we wanted the
    left side to be at least as the objective function.


    This is LP-dual: the maximization of the original objective function directly
    corresponds to the minimization of a new objective function based on the right-hand
    size of the constraints.


    More abstractly, when given a primal LP with $n$ variables and $m$ constraints
    in the canonical Standard Form:


    **Objective Function:** $\max c^T x$


    **Subject to:** $Ax \le b \ n x \ge 0$


    The corresponding dual LP results in a minimization on $m$ variables and $n$ constraints:


    **Objective Function:** $\min b^T y$


    **Subject to:** $A^T y \ge c \n y \ge 0$


    where $y$ describes the linear combination of the original constraints.


    > EXAMPLE 5.1: Finding the Dual LP


    Given the following linear program:


    **Objective Function:** $\max[5x_1 - 7x_2 + 2x_3]$


    **Subject to:** $x_1 + x_2 - 4x_3 \le 1 \n x_1 - x_2 \ge 3x_1, x_2, x_3 \ge 0$


    **What’s the dual?**


    We can solve without thinking much by forming all of the matrices and vectors
    necessary and simply following the pattern described above.


    First, we need to transform the first constraint to follow standard form. This
    is trivial algebra: multiplying an inequality by a negative flips the sign. This
    gives us:


    $-1 \times (2x_1 - x_2) \ge -1 \times 3 \Longiff -2x_1 + x_2 \le -3$

    '
