    # 6.1 Search Problems


    Formally, problems within NP are defined in the following way:


    Search problem:


    +   Form: Given an instance $I$, we can find a solution $S$ for $I$ if one exists,
    or indicate that there is no solution.


    +   Requirement: To be a search problem, given an instance $I$ and any solution
    $S$ (not necessarily one given by any algorithm), it must be verifiable that $S$
    is a solution to $I$ in polynomial time $|I|$.


    The way to show the above requirement is to provide a verifier algorithm $V(I,
    S)$ that provably fulfills it.


    # 6.1.1 Example: SAT


    Recall the structure of the SAT problem.


    SAT:


    +   Input: A Boolean function $f$ in CNF with $n$ variables and $m$ clauses.


    +   Output: A satisfying assignment—if one exists—or “no” otherwise.


    A proposed solution is obviously trivial to verify in polynomial time: simply
    assign each $x_i$ and run through each clause to check if it''s satisfied. In
    the worst case, this takes $\mathcal{O}(mn)$ time, since each of the $m$ clauses
    needs to be checked once, and each clause has (at most) $2n$ literals. This means
    SAT $\in$ NP.


