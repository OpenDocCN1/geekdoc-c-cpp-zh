    # 4.2 Limitations


    For this to work, the message must be small: $m < N$. This is why asymmetric cryptography
    is typically only used to exchange a symmetric key which is then used for all
    future messages.


    We also need to take care of $ms$ such that $\gcd(m, N) = 1$. If this isn''t the
    case, the identity $m^{ed} \equiv m \pmod N$ still holds–albeit by the Chinese
    remainder theorem rather than Euler''s theorem–but there''s a fatal flaw. If $\gcd(m,
    N) \neq 1$, then either $p$ or $q$. If it''s $p$, then $\gcd(m^e, N) = p$ and
    $N$ can easily be factored (and likewise if it''s $q$).


    Similarly, if $m$ can''t too small, then it''s possible to have $m^e < N$–the
    modulus has no effect!


    Another problem comes from sending the same message multiple times via different
    public keys. The Chinese remainder theorem can be used to recover the plaintext
    from the ciphertexts. Let $e = 3$, then the three ciphertexts are:


