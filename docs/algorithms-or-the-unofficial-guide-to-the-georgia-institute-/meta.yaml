    Objective Function: $max[\mathbf{c}^T\mathbf{x}$

    Subject to: $A\mathbf{x} \le \mathbf{b}$

    $\mathbf{x} \ge 0$

    $\mathbf{x} \in \mathbb{Z}^n$

    ```


