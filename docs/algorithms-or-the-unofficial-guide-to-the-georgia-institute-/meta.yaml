    Thus, the overall goal is to find: $\max_{(F,B)} w(F, B)$. We''re going to solve
    this by reducing to the min-cut problem. There are a few key points here from
    the high level: our max should be a min and our totals need to be positive (so
    the separation penalty total be positive).


    # Reformulation: Weights


    Let $L = \sum_{i \in V} (f_i + b_i)$, the sum of likelihoods for every pixel.
    Then, we can reformulate the weight problem as follows. Since,


    ```

    $L - \sum_{i \in F} b_i + \sum_{j \in B} f_j = \sum_{i \in F} f_i + \sum_{j \in
    B} b_j$$

    ```


    we can substitute in $w(F, B)$:


    ```

    $w(F, B) = \sum_{i \in F} f_i + \sum_{j \in B} b_j - \sum_{(i,j) \in E} p_{ij}$

    $L = \sum_{i \in F} b_i + \sum_{j \in B} f_j - \sum_{(i,j) \in E} p_{ij}$

    w''(F, B)$

    ```


    We call this latter value $w''(F, B)$. This converts it to a minimization problem:
    max $w(F, B) = \min w''(F, B)$. Now we can find the minimum cut by further reducing
    it to the max-flow.


    # Reformulation: Flow


    To formulate our pixel-graph as a flow network, we''ll make some simple modifications.
    Our undirected graph will be a digraph with each edge being bidirectional; our
    capacities will be the separation costs; our source and sink will be new vertices
    representing the foreground and background:


