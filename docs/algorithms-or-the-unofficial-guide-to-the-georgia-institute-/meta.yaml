    # 6.4 Undecidability


    A problem that is undecidable is one that is impossible to construct an algorithm
    for one. One such problem is Alan Turing''s halting problem.


    Halting Problem:


    **Input:** A program $P$ (in any language) with an input $I$.

    **Output:** “yes” if $P(I)$ ever terminates, and “no” otherwise.


    The proof is essentially done by contradiction: if such a program exists, can
    it determine whether it would terminate? Suppose TERMINATOR(P, I) is an algorithm
    that solves the halting problem. Now, let''s define a new program JOHNCONNOR(J)
    that performs a very simple sequence of operations: if TERMINATOR(J, J) returns
    “yes,” loop again and terminate otherwise.


    There are two cases:


    +   - If TERMINATOR(J, J) returns “yes,” that means $J(J)$ terminates. In this
    case, JOHNCONNOR(−) will continue to execute.

    - If it doesn’t, we know that $J(J)$ never terminates, so JOHNCONNOR(·) stops
    running.


    So what happens when we call JOHNCONNOR(JohnConnor)?


    +   - If TERMINATOR(JohnConnor, JohnConnor) returns “yes,” that means JOHNCONNOR(JohnConnor)
    terminates. But then the function we called—JOHNCONNOR(JohnConnor)—will continue
    to execute by definition. This contradicts the output of TERMINATOR().

    - If TERMINATOR(JohnConnor, JohnConnor) returns “no,” then that means JOHNCONNOR(JohnConnor)
    never terminates, but then it immediately does.


    In both cases, we end up with a paradoxical contradiction. Therefore, the only
    explanation is that the function TERMINATOR() cannot exist. The halting problem
    is undecidable.'
