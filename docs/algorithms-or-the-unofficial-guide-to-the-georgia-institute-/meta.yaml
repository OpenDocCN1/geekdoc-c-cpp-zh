    ## 6.1 Search Problems


    Formally, problems within NP are defined in the following way:


    Search problem:


    - Form: Given an instance $I$, we can find a solution $S$ for $I$ if one exists,
    or indicate that there is no solution.

    - Requirement: To be a search problem, given an instance $I$ and any solution
    $S$ (not necessarily one given by any algorithm), it must be verifiable that $S$
    is a solution to $I$ in polynomial time $|I|$.


    The way to show the above requirement is to provide a verifier algorithm $V(I,
    S)$ that provably fulfills it.


    ### 6.1.1 Example: SAT


    Recall the structure of the SAT problem.


    SAT:


    - Input: A Boolean function $f$ in CNF with $n$ variables and $m$ clauses.

    - Output: A satisfying assignment—if one exists—or “no” otherwise.


    A proposed solution is obviously trivial to verify in polynomial time: simply
    assign each $x_i$ and run through each clause to check if it''s satisfied. In
    the worst case, this takes $\mathcal{O}(mn)$ time, since each of the $m$ clauses
    needs to be checked once, and each clause has (at most) $2n$ literals. This means
    SAT $\in$ NP.


    ### 6.1.2 Example: k-Coloring Problem


    The $k$-color problem is well known in computer science. Given a graph and a palette
    with $k$ colors, you must find a way to label each node with one of the colors
    that no neighboring nodes share a color. For example, the following is a valid
    3-coloring of the graph:


    ![](img/618d10cd4b9a60c3e651b4ab71cd8ece_83_0.png)


    Finding the coloring is hard, verifying it is easy: given a graph $G$ and a coloring,
    we simply need to check that each edge has different colors on each endpoint.
    Thus, $k$-coloring is in NP.


    ### 6.1.3 Example: MSTs


    Recall the problem of finding the minimum spanning tree:

    MST:


    - **Input:** A graph $G = (V, E)$ with positive edge lengths.

    - **Output:** A tree $T$ with minimum weight.


    This problem is both NP and P; this is simply because finding an MST takes polynomial
    time (recall Kruskal''s algorithm). We can verify with depth-first search (no
    back edges), then check if $T$ has the same weight as the output of Kruskal''s
    (or Prim''s) algorithm. This means MST $\in$ NP and MST $\in$ P.


    ### 6.1.4 Example: Knapsack


    Recall the knapsack problem from dynamic programming,

    Knapsack:


    - **Input:** A set of $n$ objects with values and weights:

    $V = \{v_1, v_2, \dots, v_n\}$

    $W = \{w_1, w_2, \dots, w_n\}$

    A total capacity $B$.

    - **Output:** A subset $S$ that both:

    (a) maximizes the total value: $\max_{i \in S} \sum v_i$

    (b) while fitting in the knapsack: $\sum_{i \in S} w_i \le B$


    Given an instance of the problem and checking whether or not it fits the capacity
    is easy, $O(n)$ time. What about checking its optimality? The only way to do this
    is by actually solving the problem and comparing the total value. Recall, though,
    unlike in the MST case above, the running time for knapsack was $O(nB)$. This
    is not polynomial, since $|I| = (n, \log_2 B)$.


    Our conclusion is thus generic knapsack *not known* to be in NP: there *may exist*
    a better algorithm to find or verify the solution. Since we can''t know for sure
    that there isn''t, we can''t say if knapsack $\in$ NP.


    ## Variant: Knapsack Search


    We can consider a variant of knapsack in which we drop the maximization requirement
    and instead add a new input parameter: a *goal*, $g$. Then, the algorithm tries
    to find a subset of values that meet the goal.


    Knapsack Search:


    - **Input:** A set of $n$ objects with values and weights:

    $V = \{v_1, v_2, \dots, v_n\}$

    $W = \{w_1, w_2, \dots, w_n\}$

    A total capacity $B$.

    A goal, $g$.

    - **Output:** A subset $S$ that both:

    (a) meets the goal: $\sum_{i \in S} v_i \ge g$

    (b) fitting in the knapsack: $\sum_{i \in S} w_i \le B$


    This is clearly in NP: checking that it meets the goal involves summing up the
    values, $\mathcal{O}(n)$ time.


    ## 6.2 Differentiating Complexities


    We do not know if $P \neq NP$, but the debate comes down to a single distillable
    point:


    > *Does being able to recognize correct answers quickly mean that there''s also
    a quick way to find *them**


    We assume $P \neq NP$ in order to differentiate between problems within NP. The
    **NP-complete** problems. This means that any NP-complete problem can be solved
    in polynomial time, then *all problems* in NP can be solved in polynomial time.


    In essence, any problem that is NP-complete can be ‘reduced’ (or, more accurately,
    ‘transformed’) into any other. This means if we can find a polynomial-time solution
    for SAT, we can use it as a black box to solve *any* NP problem.


    Can we show this transformation? Namely, can we show that literally any problem
    within NP (including problems in P) can be reduced to solving SAT? This involves
    a bidirectional proof:


    - $f(G, k)$ is a function that transforms the input from the k-coloring problem
    to an SAT input.

    - Also that $h(S)$ is a function that transforms the output from SAT to an output
    for the k-coloring problem.

    - Then, we need to show that $S$ is a solution to SAT, then $h(S)$ is a solution
    to k-color.

    - Similarly, we need to show that there are no solutions to the SAT that do not
    map to a solution to k-color. In other words, if SAT says “no,” then k-color also
    outputs “no”.


    We need to do this for every problem within NP, which seems insurmountable. It
    is in fact the case, though (see Figure 6.1, later), and this might come unjust:
    SAT is just a Boolean circuit and at the end of the day, it is a computer, so
    any algorithmic problem that can be solved with a computer can be solved with
    SAT.


    Reducing from any problem to SAT is different than demonstrating that a particular
    problem is NP-complete, though. This latter proof is done with a reduction: given
    any NP-complete problem (like SAT), if we can reduce from the new problem (like,
    for example, the independent set problem), then the new problem must also be NP-complete.


    ## 6.3 Reductions


    We''ll enumerate a number of reductions to prove various algorithms as NP-complete.
    Critically, we will take the theorem that SAT is NP-complete for granting a starting
    point, but you can refer to the papers linked in the margin if you''re a masochist
    and want to figure out that''s the case.


    ### 6.3.1 3SAT from SAT


    The difference between 3SAT and SAT is that in the former, each clause is limited
    to having at most 3 literals. To show that 3SAT is NP-complete, we first show
    that 3SAT $\in$ NP; then, we find a reduction from SAT to 3SAT:


    | SAT | 3SAT |

    | :--- | :--- |

    | known to be NP-complete | complexity class unknown |


    Within NP Verifying the solution for 3SAT is just as easy as for SAT, in fact
    taking $\mathcal{O}(m)$ time since $n \le 3$.


    Reduction Because of the similarity in the problems, forming the reduction is
    fairly straightforward. A given long SAT clause $c$ can be transformed into a
    series of 3-literal clauses by introducing $k-3$ new auxiliary variables that
    form $k-2$ new clauses:


    ```

    $$(x_1 \vee x_2 \vee \dots \vee x_k) \implies (x_i \vee x_{i+1} \vee y_i) \wedge
    (y_i \vee x_{i+3} \vee y_2) \wedge$

    $(y_{k-1} \vee x_{i+4} \vee y_{k-3}) \wedge \dots \wedge (y_{k-5} \vee x_{k-1}
    \vee x_k)$$

    ```


    For example, the 5-SAT is transformed as follows:


    ```

    $$C = (\bar{x}_2 \vee x_3 \vee \bar{x}_1 \vee x_5)$

    $C'' = (\bar{x}_2 \vee x_3 \vee y) \wedge (\bar{y} \vee \bar{x}_1 \vee z) \wedge
    (\bar{z} \vee x_4 \vee x_5)$$

    $C \implies C''$

    ```


    The bidirectional proof of correctness can be done by contradiction.


    > 3SAT: More Restrictions


    There''s an important note in Algorithms that isn''t highlighted in lecture that
    a restricted version of 3SAT in variables can only appear in $\le 3$ clauses is
    still NP-complete (see pp. 251 for the transformation).

