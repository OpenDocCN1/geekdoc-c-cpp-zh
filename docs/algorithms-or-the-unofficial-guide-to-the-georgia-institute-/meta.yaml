    $m$ by raising it to the power of $d$.


    Unfortunately, you need to reveal $p$ to do this, which reveals $p-1$ and lets
    someone derive $de$. We will hide this by using $N = pq$ Euler''s theorem. The
    rationale is the same: take $d, e$ such that $de = 1 \mod (p-1)(q-1)$. Then,


    ```

    $m^{de} = m \cdot (m^{(p-1)(q-1)})^k$\n$\equiv m \cdot (m^{(p-1)(q-1)}) \mod N$\n$\equiv
    m \cdot 1^k \mod N$\n$\n. m^{de} = m \mod N$

    ```


    Euler''s theorem


    (Say what?)


    That''s it. RSA.


    A user reveals some information to the world: their public key, and their modulus,
    $N$. To send them a message, $m$, you send $c = m^e \mod N$. They can find your
    message via:


    ```

    $c^d \mod N$\n$(m^e \mod N)^d = m^{ed} \mod N$\n$m \mod N$

    ```


    This is secure because you cannot determine $(p-1)(q-1)$ from the revealed $N$
    and $e$ without exhaustively enumerating all possibilities (i.e. factoring is
    hard), so if they are large enough, it''s computationally infeasible to do.


