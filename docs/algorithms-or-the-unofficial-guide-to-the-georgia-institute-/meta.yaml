    if its dual LP has an optimal $y^*$. These satisfy Corollary 5.3.2:


    ```

    $c^T x = b^T y$

    ```


    Secondly, these exist if and only if their corresponding LP is both feasible and
    bounded.


    ## 5.4 Max SAT


    Recall tackling satifiability problems in our discussion of graphs in chapter
    3. Satisfiability:


    - **Input:** A Boolean formula $f$ in conjunctive normal form with $n$ variables
    and $m$ clauses.

    - **Output:** An assignment satisfying $f$ or an indication that $f$ is not satisfiable.


    We established that while 2-SAT can be solved in polynomial time with connected
    components, SAT is NP-complete. The Max-SAT is an alternative construction that
    does not require *full* satisfiability; instead, we try to *maximize* the number
    of satisfied clusters.


    Max-SAT:


    - **Input:** A Boolean formula $f$ in conjunctive normal form with $n$ variables
    and $m$ clauses.

    - **Output:** An assignment that maximizes the number of satisfied clauses in
    $f$.


    This version of the problem is NP-hard; though it''s as hard as the full SAT,
    we no longer have an easy way to check if the truly is the maximum. Instead, we
    will provide an *approximate* solution to the problem. Specifically, if $m^*$
    is the solution to Max-SAT, we''re going to find an assignment that guarantees
    some portion of $m^*$.


    ## 5.4.1 Simple Scheme


    For the first pass, we''re going to guarantee an assignment that satisfies $\frac{1}{2}m^*$
    clauses. Consider $f$ as we''ve defined it with $n$ variables $\{x_1, \dots, x_n\}$
    and $m$ clauses $\{c_1, \dots, c_m\}$.


    The approach is incredibly simple: we assign each $x_i$ to true or false randomly
    with equal probability for all $n$ variables. Suppose $W$ denotes the number of
    satisfied clauses, and it is expressed as the sum of $w_{js}$ that determines
    whether or not the corresponding $c_{ij}$ clause has been satisfied. Then, the
    expectation (or average) value of $W$ is, by


    ```

    $E[W] = \sum_{\ell=0}^m \ell \cdot Pr[W=\ell]$

    = \sum_{j=1}^m [w_j]$

    = \sum_{j=1}^m Pr[w_j=1]$

    = \sum_{j=1}^m (1 - 2^{-k})$

    \ge \sum_{j=1}^m \frac{1}{2} \ge \frac{m}{2}$

    ```


