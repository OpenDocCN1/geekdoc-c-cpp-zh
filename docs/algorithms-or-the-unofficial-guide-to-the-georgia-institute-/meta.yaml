    # 第 3 章：图


    ![](img/618d10cd4b9a60c3e651b4ab71cd8ece_43_0.png)


    显然，存在路径 $x_1 \to \overline{x_1}$，而显然这个推论是无意义的——意味着 $\overline{x_1}$ 是矛盾。然而，如果
    $x_1 = F$，我们没有线索（也就是说 $\overline{x_1}$ 是一个汇点），那么情况可能会有所不同？


    显然，如果 $x_1 = F$ 也导致了产生矛盾的推论路径，我们可以得出 $f$ 是不可满足的。单从图论的角度来看，从 $x_1$ 到 $\overline{x_1}$
    以及反之存在路径，意味着它们是同一个连通分的一部分。


    **属性 3.4。** 如果一个文字 literal $a_i$ 及其反反 $\overline{a_i}$ 属于同一个强连通分，则 $f$ 是不可满足的。


    利用这一属性，我们可以证明 $f$ 何时是满足的：如果对于每个变量 $x, x_i$ 和 $\overline{x_i}$ 都位于不同的强连通分，那么 $f$
    是满足的。这里有一个算法，为这种基本直觉增加了更多的结构：


    1. 找到汇点 SCC，$S$。

    2. 设置 $S = T$；即满足 $S$ 中的所有文字。

    3. 由于这些都是它们推论的末端，头部将被隐式地满足。因此，我们可以从图中移除 $S$ 并重复此过程。

    4. 那么，$S$ 将是一个源点 SCC，因此设置 $\overline{S} = F$ 不产生影响（将推论的头部设置为假意味着我们不需要跟随它的任何出向边）。


    这依赖于一个重要的属性，该属性值得证明。


    > **属性 3.5。** 如果对于 $\forall i$，文字 $x_i$ 和 $\overline{x_i}$ 位于不同的强连通分，则：

    > $S$ 是汇点 SCC $\iff \overline{S}$ 是源点 SCC


    给定这一属性，我们进一步形式化 2-SAT 算法：


    1. 首先，假设 CNF 形式的布尔函数 $f$ 仅包含双文字子句（因为我们可以通过简化单文字子句强制实现）。

    2. 为 $f$ 构建图 $G$。

    3. 使用 DFS 找到汇点 SCC，$S$，并设置 $S = T$ 和 $\overline{S} = F$。

    4. 移除 $S$ 和 $\overline{S}$。

    5. 重复直到图为空。


    这里唯一的复杂任务是寻找 SCC，我们知道可以在线性时间内完成，因此总运行时间为 $\mathcal{O}(n+m)$。


    ## 3.6 最小生成树


    最小生成树 (MST) 问题的输入是一个无向图 $G=(V,E)$，对于 $e \in E$ 具有权重 $w(e)$。目标是找到一个最小尺寸、最小权重且“跨越”该图的连通子图。自然地，树的总权重是所有边的权重之和。


    注意关于树的一些基本属性：


    - 具有 $n$ 个顶点的树恰好有 $n-1$ 条边。

    - 每对顶点之间恰好存在一条路径。

    - 任何满足 $|E|=|V|-1$ 的连通 $G=(V,E)$ 都是树。


    最后一点需要重复，因为它在稍后确定图的最小割时非常重要。证明一个图是树的唯一方法是证明它的边数减一。


    ### 3.6.1 贪心算法：Kruskal 算法


    我们将尝试通过不断从代价最低的顶点开始构建且不产生任何循环来构建最小生成树。我们的示例图将是：


    ![](img/618d10cd4b9a60c3e651b4ab71cd8ece_44_0.png)


    前 5 条边很容易确定，但代价为 6 的边会导致循环。


    所有代价为 7 的边都可以轻松地加入——注意它们不连通并不重要。


    ![](img/618d10cd4b9a60c3e651b4ab71cd8ece_45_1.png)


    最后，所有代价为 9 的边也可以加入以创建图的最终 MST。注意未使用的代价为 9 的边触及的顶点是通过更长的路径连接的。


    ![](img/618d10cd4b9a60c3e651b4ab71cd8ece_45_2.png)


    这就是 **Kruskal 算法**，在下面的**算法 3.3** 中形式化。它的**运行时间**为 $O(m \log n)$，因为排序需要 $O(m \log
    n)$ 时间，而使用**并查集 (union-find)** 数据结构检查循环需要 $O(m \log n)$ 时间。


    （注：原文文本中存在大量 OCR 错误和重复，此处已根据逻辑进行清理并翻译。）

