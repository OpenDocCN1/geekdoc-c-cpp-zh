    # 3.3.3 Acyclic Digraphs


    A directed graph (or DAG) contains no cycles (and thus no back edges,

    asas we just drew). Given a DAG, we want to topologically sort it: order the vertices

    that the higher nodes of the DFS tree have less children than lower nodes (that

    isis, the degree of a vertex is inversely-proportional to its depth in the DFS
    tree).


    We can achieve this by running DFS and ordering the vertices by their post-order

    clock values; this takes linear time.²


