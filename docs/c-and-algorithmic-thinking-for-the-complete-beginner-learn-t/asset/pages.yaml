  md: "# Finding string position\n\n```\n`subject.find( search )`\n```\n\nThis finds\
    \ the numeric position of the first occurrence of `search` in `subject`.\n\nExample\n\
    \n```\n```cpp\n#include <iostream>\nusing namespace std;\nint main() {\n  int\
    \ i;\n  string a;\n\n  a = \"I am newbie in C++, C++ rocks!\";\n  i = a.find(\"\
    newbie\");\n\n  cout << i << endl;    //Outputs: 5\n  return 0;\n}\n```\n```\n\
    \n> **Remember!** The first character is at position 0.\n\n# Converting to lowercase\
    \ or uppercase\n\nThere are two functions that let you convert all letters in\
    \ a string to lowercase or uppercase.\n\n# To lowercase\n\n```\n`to_lower_copy(\
    \ subject )`\n```\n\nThis returns the `subject`, converted to lowercase. It is\
    \ defined in the `boost` library.\n\nExample\n\n```\n```cpp\n#include <iostream>\n\
    #include <boost/algorithm/string.hpp>\nusing namespace boost::algorithm;\nusing\
    \ namespace std;\nint main() {\n  string a, b;\n\n  a = \"My Name is JoHN\";\n\
    \  b = to_lower_copy(a);\n\n  cout << b << endl;    //Outputs: my name is john\n\
    \  return 0;\n}\n```\n```\n\n# To uppercase\n\n```\n`to_upper_copy( subject )`\n\
    ```"
