    # ### 5.3 How Many Types of Variables and Constants Exist in C++?


    Many different types of variables and constants exist in all computer languages.
    The reason for this diversity is the different types of data each variable or
    constant can hold. Most of the time, variables and constants hold the following
    types of data.


    +   - **Integers:** Integer values are positive or negative numbers without any
    fractional part, such as 5, 100, 135, -25, and -5123.

    +   - **Reals:** Real values are positive or negative numbers that include a fractional
    part, such as 5.14, 7.23, 5.0, 3.14, and -23.78796. Real values are also known
    as “floats.”

    +   - **Booleans:** Boolean variables or constants can hold only one of two values:
    `true` or `false`.

    +   - **Characters:** Characters are alphanumeric values (always enclosed in single
    or double quotes) such as ‘a’, ‘c’, “Hello Zeus”, “I am 25 years old”, or “Peter
    Loves Jane For Ever”. A sequence of characters is also known as a “string”!!!
    (Probably the word “string” makes you visualize something wearable, but unfortunately
    it’s not. Please keep your dirty precious mind focused on your conscience!).


    # ### 5.4 Rules for Naming Variables in C++


    Certain rules must be followed when assigning names to your variables.


    +   - The name of a variable can contain only Latin characters (English uppercase
    or lowercase characters), numbers, and the underscore character (`_`). Examples
    of variable names are `firstName`, `last_name1`, and `age`.

    +   - Variable names are case sensitive, which means there is a distinct difference
    between uppercase and lowercase characters. For example, `myVAR`, `myvar`, `MYVAR`,
    and `MyVar` are actually four different variable names.'
