    \  viii. `x = 1 / (10 + z) / 27`\n\n# ### Solution\n\n+   i. **Wrong.** Since\
    \ the multiplication and the division are performed before the addition, this\
    \ is equivalent to $x = \\frac{1}{10} \\times 27 + z$.\n+   \n+   ii. **Wrong.**\
    \ An asterisk should have been used for multiplication.\n+   \n+   iii. **Wrong.**\
    \ Since the division is performed before the addition, this is equivalent to $x\
    \ = \\frac{27}{10} + z$.\n+   \n+   iv. **Correct.** This is equivalent to $x\
    \ = \\frac{27}{10+z}$.\n+   \n+   v. **Wrong.** Inside parentheses, the division\
    \ is performed before the addition. This is equivalent to $x = \\left(\\frac{1}{10}\
    \ + z\\right)27$."
