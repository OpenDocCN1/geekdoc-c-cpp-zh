  md: "```\ncout << b << \"Poseidon!\" << endl;       //Outputs: Hello Poseidon!\n\
    return 0;\n}\n```\n\n# String replacement\n\n```\n`replace_all_copy( subject,\
    \ search, replace )`\n```\n\nThis searches in `subject` and replaces all occurrences\
    \ of the `search` string with the `replace` string. It is defined in the boost\
    \ library.\n\nExample\n\n```\n```cpp\n// project_14_4b\n#include <iostream>\n\
    #include <boost/algorithm/string.hpp>\nusing namespace boost::algorithm;\nusing\
    \ namespace std;\nint main() {\n  string a, b;\n\n  a = \"I am newbie in Java.\
    \ Java rocks!\";\n  b = replace_all_copy(a, \"Java\", \"C++\");\n\n  cout << b\
    \ << endl;       //Outputs: I am newbie in C++. C++ rocks\n  return 0;\n}\n```\n\
    ```\n\n# Counting the number of characters\n\n```\n`subject.length()`\n```\n\n\
    This returns the length of `subject` or, in other words, the number of characters\
    \ `subject` consists of (including space characters, symbols, numbers, and so\
    \ on).\n\nExample\n\n```\n```cpp\n// project_14_4c\n#include <iostream>\nusing\
    \ namespace std;\nint main() {\n  string a, b;\n\n  a = \"Hello Olympians!\";\n\
    \  cout << a.length() << endl;       //Outputs: 16\n\n  b = \"I am newbie in C++\"\
    ;\n  cout << b.length() << endl;       //Outputs: 18\n  return 0;\n}\n```\n```"
