  md: "# Example\n\n```\n~~~cpp\n// project_14_4h\n#include <iostream>\n#include <boost/algorithm/string.hpp>\n\
    using namespace boost::algorithm;\nusing namespace std;\n\nint main() {\n    int\
    \ a;\n\n    cin >> a;                   //Assume that user enters the word \"\
    Hello\".\n    cout << cin.fail() << endl; //Since cin fails, this displays 1 (true)\n\
    \n    //Clear the error state of cin\n    cin.clear();\n    cin.ignore(100, '\\\
    n');\n\n    cin >> a;                   //Assume that user enters an integer.\n\
    \    cout << cin.fail() << endl; //If cin succeeds, display 0 (false)\n\n    //If\
    \ the last cin statement succeeds,\n    //there is no need to clear its error\
    \ state\n\n    return 0;\n}\n~~~\n```\n\n# Retrieving an individual character\n\
    \n```\n~~~\nsubject.at( index )\n~~~\n```\n\nThis returns the character located\
    \ at *subject's* specified *index*. As already mentioned, the string indexes start\
    \ from zero. The *index* of the last character is 1 less than the length of the\
    \ string.\n\n# Example\n\n```\n~~~cpp\n// project_14_4i\n#include <iostream>\n\
    using namespace std;\nint main() {\n    string a = \"Hello Hermes\";\n\n    cout\
