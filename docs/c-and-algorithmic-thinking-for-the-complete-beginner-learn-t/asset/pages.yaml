  md: '# # About the Authors


    # ## Aristides S. Bouras


    Aristides¹ S. Bouras was born in 1973. During his early childhood, he discovered
    a love of computer programming. He got his first computer at the age of 12, a
    Commodore 64, which incorporated a ROM-based version of the BASIC programming
    language and 64 kilobytes of RAM!!!


    He holds a degree in Computer Engineering from the Technological Educational Institute
    of Piraeus, and a degree in Electrical and Computer Engineering from the Democritus
    Polytechnic University of Thrace.


    He worked as a software developer at a company that specialized in industrial
    data flow and labelling of products. His main job was to develop software applications
    for data terminals (originally in TALL and later in VB.NET language), as well
    as PC software applications for collecting and storing data on a Microsoft SQL
    Server.


    He has developed many applications such as warehouse managing systems and websites
    for companies and other organizations. Nowadays, he works as a high school teacher.
    He mainly teaches courses in computer networks, programming tools for the Internet/intranets,
    and databases.


    He is married to Loukia V. Ainarozidou and they have two children.


    # ## Loukia V. Ainarozidou


    Loukia V. Ainarozidou was born in 1975. She got her first computer at the age
    of 13, an Amstrad CPC6128 with 128 kilobytes of RAM and an internal 3-inch floppy
    disk drive!!!


    She holds a degree in Computer Engineering from the Technological Educational
    Institute of Piraeus, and a degree in Electrical and Computer Engineering from
    the Democritus Polytechnic University of Thrace.


    She worked as a supervisor in the data logistics department of a company involved
    in the packaging of fruit and vegetables. Nowadays, she works as a high school
    teacher. She mainly teaches courses in computer networks, computer programming,
    and digital design.


    She is married to Aristides S. Bouras and they have two children.


    ¹ Aristides (530 BC–468 BC) was an ancient Athenian statesman and general. The
    ancient historian Herodotus cited him as “the best and most honorable man in Athens.”
    He was so fair in all that he did that he was often referred to as “Aristides
    the Just.” He flourished in the early quarter of Athens’s Classical period and
    helped Athenians defeat the Persians at the battles of Salamis and Plataea.'
