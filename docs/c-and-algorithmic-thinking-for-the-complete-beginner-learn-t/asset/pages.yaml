    \n# **Exercise 8.1-3　 Swapping Values of Variables – A Second Approach**\n\nWrite\
    \ a C++ program that lets the user enter two numeric values, in variables a and\
    \ b. In the end, the two variables should swap their values.\n\n# **Solution**\n\
    \nSince the variables contain only numeric values, you can use the following C++\
    \ program.\n\n```\n#include <iostream>\nusing namespace std;\nint main() {\n \
    \ int a, b;\n\n  cin >> a;\n  cin >> b;\n\n  a = a + b;\n  b = a - b;\n  a = a\
    \ - b;\n\n  cout << a << endl;\n  cout << b << endl;\n  return 0;\n}\n```\n\n\
    > **Notice:** Compared to previous exercise, the only major disadvantage of this\
    \ method is that it cannot swap the contents of alphanumeric variables (strings)."
