  md: "# # Chapter 14\n\n# ## Manipulating Strings\n\n# ### 14.1 Introduction\n\n\
    Generally speaking, a string is anything that you can type using the keyboard,\
    \ including letters, symbols (such as &, *, and @), and digits. Sometimes a program\
    \ deals with data that comes in the form of strings (text). In C++, a string is\
    \ always enclosed in double quotes like this: “ ”.\n\nEach statement in the next\
    \ example outputs a string.\n\n```\n```cpp\n#include <iostream>\nusing namespace\
    \ std;\nint main() {\n  cout << \"Everything enclosed in double quotes is a \"\
    ;\n  cout << \"string, even the numbers below\" << endl;\n  cout << \"3, 4, 7\"\
    \ << endl;\n  cout << \"You can even mix letters, symbols and \";\n  cout << \"\
    numbers like this:\" << endl;\n  cout << \"The result of 3 + 4 equals to 4\";\n\
    \  return 0;\n}\n```\n```\n\nStrings are everywhere—from word processors, to web\
    \ browsers, to text messaging programs. Many exercises in this book actually make\
    \ extensive use of strings. Even though C++ supports many useful functions for\
    \ manipulating strings, this chapter covers only those functions that are absolutely\
    \ necessary for this book’s purpose. However, if you need even more information\
    \ you can visit\n\nhttp://www.cplusplus.com/reference/string/string/\n\n> > **Notice:**\
    \ C++ string functions can be used when there is a need, for example, to isolate\
    \ a number of characters from a string, to remove spaces that might exist at the\
    \ beginning of it, or to convert all of its characters to uppercase.\n> >\n> >\
    \ **Remember!** Functions are nothing more than small subprograms that solve small\
    \ problems. A subprogram can be defined as a block of statements packaged as a\
    \ unit that has a name and performs a specific task.\n\nMoreover, even though\
    \ there are many useful string functions that C++ supports, some of the ones this\
    \ book uses are not part of the standard C++; rather, they are defined in the\
    \ Boost C++ Libraries. In this case, each C++ project that uses any of those functions\
    \ must include these libraries. This can be done if, from the main menu, you select\
    \ “File→Project Properties” and in category “C++ Compiler” you include the directory\
    \ (the folder) of your Boost C++ Libraries as shown in **Figure 14-1**."
