  md: '# # Chapter 3


    # ## Software Packages to Install


    # ### 3.1　Boost C++ Libraries


    Boost is a collection of libraries for the C++ programming language that provide
    support for tasks and structures such as event handling, string handling, memory
    handling, asynchronous input/output (I/O), and many more. It contains more than
    140 libraries to help you increase the productivity of C++ without waiting for
    the next revision of the C++ standard.


    In this book, some exercises and examples use a very small set of Boost libraries.
    However, if you need more information you can visit:


    http://www.boost.org/doc/libs/


    # ### 3.2　How to Set Up Boost C++ Libraries


    To install Boost C++ Libraries, you must download them, free of charge, from the
    following address:


    http://www.boost.org


    Click on the download link and select the corresponding file. Usually the filename
    of this download looks like this:


    boost_X_XX_X.zip


    where X_XX_XX is the version of Boost. When the download completes, unzip the
    file to your C: drive. This will create a folder named C:\boost_X_XX_X on your
    C: drive. Rename it to C:\boost.


    # ### 3.3　Installing the C++ Compiler and the Debugger for Windows


    This step is for Windows users only and describes how to install:


    +   - g++, the GNU C++ compiler,

    +   - gdb, the GNU debugger, and

    +   - Make, a utility for compiling and linking projects.


    In order to install these tools, you must first download Cygwin. Cygwin is a large
    collection of GNU and Open Source tools that provide computers than run on Windows
    with a functionality similar to a Linux distribution. Download it, free of charge,
    from the following address:


    https://cygwin.com/install.html


    Choose either the 32-bit or the 64-bit version, depending on the version of your
    operating system, and download the corresponding setup file. When the download
    is complete, run the installer.'
  merge: -1
  img_proc: true
