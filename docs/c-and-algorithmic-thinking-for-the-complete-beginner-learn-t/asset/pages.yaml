  md: "# # Chapter 11\n\n# ## Manipulating Numbers\n\n# ### 11.1 Introduction\n\n\
    Just like every high-level programming language, C++ provides many functions (methods)\
    \ that can be used whenever and wherever you wish. Functions are nothing more\
    \ than a block of statements packaged as a unit that has a name and performs a\
    \ specific task.\n\nTo better understand functions, let’s take Heron’s¹ iterative\
    \ formula that calculates the square root of a positive number.\n\n$$x_{n+1}=\\\
    frac{1}{2}\\left(x_n+\\frac{y}{x_n}\\right)$$\n\nwhere\n\n+   - $y$ is the number\
    \ for which you want to find the square root\n+   - $x_n$ is the *n*-th iteration\
    \ value of the square root of $y$\n\nPlease don’t be disappointed! No one at the\
    \ present time calculates the square root of a number this way. Fortunately, C++\
    \ includes a function for that purpose! This function, which is actually a small\
    \ subprogram, has been given the name `sqrt` and the only thing you have to do\
    \ is call it by its name and it will do the job for you. Function `sqrt` probably\
    \ uses Heron’s iterative formula, or perhaps a formula of another ancient or modern\
    \ mathematician. The truth is that you don’t really care! What really matters\
    \ is that `sqrt` gives you the right result! An example is shown here.\n\n```\n\
    ```cpp\n#include <iostream>\n#include <cmath>\nusing namespace std;\n\nint main()\
    \ {\n    double x, y;\n\n    cin >> x;\n    y = sqrt(x);\n    cout << y;\n}\n\
    ```\n```"
