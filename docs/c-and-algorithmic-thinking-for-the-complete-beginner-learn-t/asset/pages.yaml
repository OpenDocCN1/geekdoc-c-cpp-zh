  md: "Let’s say that user’s input is assigned to variable `str`. You can access the\
    \ fourth letter using `str.at(3)`, the third letter using `str.at(2)`, and so\
    \ on.\n\nThe C++ program is shown here.\n\n```\n**project_14_3_1**\n\n```cpp\n\
    #include <iostream>\nusing namespace std;\nint main() {\n    string str;\n\n \
    \   cout << \"Enter a word with four letters: \";\n    cin >> str;\n\n    cout\
    \ << str.at(3) << str.at(2) << str.at(1) << str.at(0);\n    return 0;\n}\n```\n\
    ```\n\n# 14.4 Useful String Functions\n\n# Trimming\n\nTrimming is the process\
    \ of removing whitespace characters from the beginning or the end of a string.\n\
    \nSome of the whitespace characters that are removed with the trimming process\
    \ are:\n\n+   - `\" \"` an ordinary space\n+   - `\"\\t\"` a tab\n+   - `\"\\\
    n\"` a new line (line feed)\n+   - `\"\\r\"` a carriage return\n\nFor example,\
    \ you can trim any spaces that the user mistakenly entered at the end of a string.\n\
    \nThe function that you can use to trim a string is\n\n```\n```cpp\ntrim_copy(subject)\n\
    ```\n```\n\nThis removes any whitespace characters from both the beginning and\
    \ the end of `subject`. It is defined in the boost library.\n\n**Example**\n\n\
    ```\n**project_14_4a**\n\n```cpp\n#include <iostream>\n#include <boost/algorithm/string.hpp>\n\
    using namespace boost::algorithm;\nusing namespace std;\nint main() {\n    string\
    \ a, b;\n\n    a = \"        Hello        \";\n    b = trim_copy(a);\n}\n```\n\
    ```"
