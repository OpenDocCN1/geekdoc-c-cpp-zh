  md: "```\n```\n}\n```\n```\n\n# **Exercise 11.2-2** *How Far Did the Car Travel?*\n\
    \n*A car starts from rest and moves with a constant acceleration along a straight\
    \ horizontal road for a given distance. Write a C++ program that prompts the user\
    \ to enter the acceleration and the distance the car traveled and then calculates\
    \ the time traveled. The required formula is*\n\n$S = u_0 + \\frac{1}{2}at^2$\n\
    \nwhere\n\n+   - **S** is the distance the car traveled, in meters (m)\n+   -\
    \ **u₀** is the initial velocity (speed) of the car, in meters per second (m/sec)\n\
    +   - **t** is the time the car traveled, in seconds (sec)\n+   - **a** is the\
    \ acceleration, in meters per second² (m/sec²)\n\n# **Solution**\n\nSince the\
    \ car starts from rest, the initial velocity (speed) u₀ is zero. Thus, the formula\
    \ becomes\n\n$S = \\frac{1}{2}at^2$\n\nNow, if you solve for time, the final formula\
    \ becomes\n\n$t = \\sqrt{\\frac{2S}{a}}$\n\nIn C++, you can use the sqrt() function,\
    \ which returns the square root of a number.\n\n```\n```cpp\n// project_11_2_2\n\
    #include <iostream>\n#include <cmath>\nusing namespace std;\nint main() {\n  \
    \  double S, a, t;\n\n    cout << \"Enter acceleration: \";\n    cin >> a;\n \
    \   cout << \"Enter distance traveled: \";\n    cin >> S;\n\n    t = sqrt(2 *\
    \ S / a);\n\n    cout << \"Your car traveled for \" << t << \" seconds\";\n  \
    \  return 0;\n}\n```\n```"
