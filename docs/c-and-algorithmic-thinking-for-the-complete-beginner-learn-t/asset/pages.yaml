    \ rest of the characters starting from position space_pos + 1\nname2 = full_name.substr(space_pos\
    \ + 1);\n\nfull_name = name2 + \" \" + name1;\n\ncout << full_name;\nreturn 0;\n\
    }\n```\n\n> **Remember!** The statement `cin` considers space characters as terminating\
