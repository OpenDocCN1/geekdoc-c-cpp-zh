  md: "```\ncout << \"Enter last name: \";\ncin >> last_name;\n\n//Get Random integer\
    \ between 100 and 999\nrandom_int = 100 + rand() % 900;\n\ncout << to_lower_copy(last_name.substr(0,\
    \ 4)) << random_int;\nreturn 0;\n}\n```\n\n> **Notice:** Please note how the function\
    \ `substr()` is nested within the function `to_lower_copy()`. The result of the\
    \ inner (nested) function is used as an argument for the outer function. This\
    \ is a writing style that most programmers prefer to follow because it helps to\
    \ save a lot of code lines. Of course, if you nest too many functions, no one\
    \ will be able to understand your code. A nesting of up to four levels is quite\
    \ acceptable.\n\n# Exercise 14.4-3  *Creating a Random Word*\n\nWrite a C++ program\
    \ that displays a random word consisting of five letters.\n\n# Solution\n\nTo\
    \ create a random word you need a string that contains all 26 letters of the English\
    \ alphabet. Then you can use the `rand()` function to choose a random letter between\
    \ position 0 and 25.\n\nThe C++ program for this algorithm is shown here.\n\n\
    ```\nproject_14_4_3\n\n#include <iostream>\n#include <ctime>\n#include <cstdlib>\n\
    using namespace std;\nint main() {\n    string alphabet;\n\n    srand(time(NULL));\n\
    \n    alphabet = \"abcdefghijklmnopqrstuvwxyz\";\n\n    cout << alphabet.at(rand()\
    \ % 26) <<\n            alphabet.at(rand() % 26) <<\n            alphabet.at(rand()\
    \ % 26) <<\n            alphabet.at(rand() % 26) <<\n            alphabet.at(rand()\
    \ % 26);\n\n    return 0;\n}\n```"
