  md: "# # Chapter 12\n\n# ## Complex Mathematical Expressions\n\n# ### 12.1 Writing\
    \ Complex Mathematical Expressions\n\nIn Chapter 7 you learned all about arithmetic\
    \ operators but little about how to use them and how to write your own complex\
    \ mathematical expressions. In this chapter, you are going to learn how easy is\
    \ to convert mathematical expressions to C++ statements.\n\n> **Remember!** Arithmetic\
    \ operators follow the same precedence rules as in mathematics, which means that\
    \ multiplication and division are performed before addition and subtraction. Moreover,\
    \ when multiplication and division co-exist in the same expression, and since\
    \ both are of the same precedence, these operations are performed left to right.\n\
    \n# #### Exercise 12.1-1 — Representing Mathematical Expressions in C++\n\nWhich\
    \ of the following C++ statements correctly represent the following mathematical\
