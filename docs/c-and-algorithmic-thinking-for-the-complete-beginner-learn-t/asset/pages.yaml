  md: '# Chapter 5


    # Variables and Constants


    # 5.1 What is a Variable?


    In computer science, a variable is a location in the computer''s main memory (RAM)
    where you can store a value and change it as the program executes.

    Picture a variable as a transparent box in which you can insert and hold one thing
    at a time. Because the box is transparent, you can also examine what it contains.
    Moreover, if you have two or more boxes you can give each box a unique name. For
    example, you could have three boxes, each containing a different number, and you
    could name the boxes `numberA`, `numberB`, and `numberC`.


    ![](img/7b41666e32fdead550ef74cdd9f6ead0_50_0.png)


    The boxes named `numberA`, `numberB` and `numberC` in the example contain the
    numbers 13, 8, and 4, respectively. Of course, you can examine or even alter the
    contained value of each one of these boxes at any time.


    Now, let’s say that someone asks you to find the sum of the values of the first
    two boxes and then store the result in the last box. The steps you must follow
    are:


    +   1. Take a look at the first two boxes and examine the contained values.

    +   2. Use your CPU (this is your brain) to calculate the sum (the result).

    +   3. Insert the result in the last box. However, since each box can contain
    only one single value at a time, the value 4 is actually replaced by the number
    21.'
  merge: -1
