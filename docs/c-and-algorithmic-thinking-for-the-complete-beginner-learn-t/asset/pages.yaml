  md: "# # Chapter 1\n\n# ## How a Computer Works\n\n# ### 1.1 Introduction\n\nToday’s\
    \ society, almost every task requires the use of a computer. In schools, students\
    \ use computers to search the Internet and to send emails. At work, people use\
    \ them to make presentations, to analyze data, and to communicate with customers.\
    \ At home, people use them to play games and to chat with other people all over\
    \ the world. Of course, don’t forget smartphones such as iPhones. They are computers\
    \ as well!\n\nComputers can perform so many different tasks because of their ability\
    \ to be programmed. In other words, a computer can perform any job that a program\
    \ tells it to. A program is a set of statements (often called instructions or\
    \ “commands”) that a computer follows in order to perform a specific task.\n\n\
    Programs (usually referred as “application software”) are essential to a computer,\
    \ because without them a computer is a dummy machine that can do nothing at all.\
    \ The program actually tells the computer what to do and when to do it. The programmer\
    \ or the software developer is the person who designs, creates, and tests computer\
    \ programs.\n\nThis book introduces you to the basic concepts of computer programming\
    \ using the C++ language.\n\n# ### 1.2 What is Hardware?\n\nThe term “hardware”\
    \ refers to all devices or components that make up a computer. If you have ever\
    \ opened the case of a computer or a laptop you have probably seen many of its\
    \ components, such as the microprocessor (CPU), the memory, and the hard disk.\
    \ A computer is not a device but a system of devices that all work together. The\
    \ basic components of a typical computer system are discussed here.\n\n+   - **The\
    \ Central Processing Unit (CPU)**  \n+     This is the part of a computer that\
    \ actually performs all the tasks defined in a program.\n+   - **Main Memory (RAM\
    \ – Random Access Memory)**  \n+     This is the area where the computer holds\
    \ the program (while it is being executed/run) as well as the data that the program\
    \ is working with. All programs and data stored in this type of memory are lost\
    \ when you shut down your computer or you unplug it from the wall outlet.\n+ \
    \  - **Secondary Storage Devices**  \n+     This is usually the hard disk, and\
    \ sometimes (but more rarely) the CD/DVD drive. In contrast to main memory, this\
    \ type of memory can hold data for a longer period of time, even if there is no\
    \ power to the computer. However,"
  merge: -1
  img_proc: true
- pgno: 15
  md: "programs stored in this memory cannot be directly executed. They must be transferred\
    \ to a much faster memory; that is, the main memory.\n\n+   - **Input Devices**\n\
    +   \n+     Input devices are all those devices that collect data from the outside\
    \ world and enter them into the computer for further processing. Keyboards, mice,\
    \ and microphones are all input devices.\n+   \n+   - **Output Devices**\n+  \
    \ \n+     Output devices are all those devices that output data to the outside\
    \ world. Monitors (screens) and printers are output devices.\n\n# ### 1.3 What\
    \ is Software?\n\nEverything that a computer does is under the control of software.\
    \ There are two categories of software: system software and application software.\n\
    \nSystem software is the type of software that controls and manages the basic\
    \ operations. For example, it controls the internal operations of a computer,\
    \ manages all devices connected to it, saves data, loads data, and allows other\
    \ programs to be executed. Windows, Linux, Mac OS X, Android, and iOS are all\
    \ examples of system software. Another term for this category of programs is “operating\
    \ systems.”\n\nApplication software refers to all the other programs that you\
    \ use for your everyday tasks, such as browsers, word processors, notepads, games,\
    \ and many more.\n\n# ### 1.4 How a Computer Executes (Runs) a Program\n\nWhen\
    \ you turn on your computer, the main memory (RAM) is completely empty. The first\
    \ thing the computer needs to do is to transfer the operating system from the\
    \ hard disk to the main memory.\n\nAfter the operating system is loaded to main\
    \ memory, you can execute (run) any program (application software) you like. This\
    \ is usually done by clicking, double clicking, or tapping the program’s corresponding\
    \ icon. For example, let’s say you click on the icon of your favorite word processor.\
    \ This action orders your computer to load (or copy) the word processing program\
    \ from your hard disk to the main memory so the CPU can execute it.\n\n> > **Remember!**\
    \ Programs are stored on secondary storage devices such as hard disks. When you\
    \ install a program on your computer, the program is actually copied to your hard\
    \ disk. But when you execute a program, the program is copied (loaded) from your\
    \ hard disk to the main memory, and that copy of the program is executed.\n> >\n\
    > > **Notice:** The terms “run” and “execute” are synonymous.\n\n# ### 1.5 Compilers\
    \ and Interpreters\n\nComputers can execute programs that are written in a strictly\
    \ defined computer language. You cannot write a program using a natural language\
    \ such as English or Greek, because your computer won’t understand you!\n\nBut\
    \ what does a computer actually understand? A computer can understand a specific\
    \ low-level language called the “machine language.” In a machine language all"
  merge: -1
  img_proc: true
- pgno: 16
  md: 'statements (or commands) are made up of zeros and ones. The following is an
    example of a program written in a machine language, that calculates the sum of
    two numbers.


    ```

    0010 0001 0000 0100

    0001 0001 0000 0101

    0011 0001 0000 0110

    0111 0000 0000 0001

    ```


    Shocked? Don’t worry, you are not going to write programs this way. Hopefully,
    no one writes computer programs this way anymore. Nowadays, all programmers write
    their programs in a high-level language and then they use a special program to
    translate them into a machine language. There are two types of programs that programmers
    use to perform translation: compilers and interpreters.


    A compiler is a program that translates statements written in a high-level language
    into a separate machine language program. The machine language program can then
    be executed any time you wish. After the translation, the compiler is no longer
    required.


    An interpreter is a program that simultaneously translates and executes the statements
    written in a high-level language. As the interpreter reads each individual statement
    in the program, it translates it into a machine language code and then directly
    executes it. This process is repeated for every statement in the program.


    # 1.6 What is Source Code?


    The statements (often called instructions or commands) that the programmer writes
    in a high-level language are called “source code” or simply “code.” The programmer
    first types the source code into a program known as a code editor, and then uses
    either a compiler to translate it into a machine language program, or an interpreter
    to translate and execute it at the same time. NetBeans IDE is an example of an
    Integrated Development Environment (IDE) that enables programmers to both write
    and execute their source code. You will learn more about NetBeans IDE in Chapter
    3.


    # 1.7 Review Questions: True/False


    Choose **true** or **false** for each of the following statements.


    +   1. Modern computers can perform so many different tasks because they have
    many gigabytes of RAM.

    +   2. A computer can operate without a program.

    +   3. A hard disk is an example of hardware.

    +   4. Data can be stored in main memory (RAM) for a long period of time, even
    if there is no power to the computer.

    +   5. Data is stored in main memory (RAM), but programs are not.

    +   6. Speakers are an example of an output device.

    +   7. Windows and Linux are examples of software.

    +   8. A media player is an example of system software.'
  merge: -1
  img_proc: true
