  md: '# 4.9　What is the Difference Between a Statement and a Command?


    There is a big discussion on the Internet about whether there is, or is not, any
    difference between a statement and a command. Some people prefer to use the term
    “statement,” and some others the term “command.” For a novice programmer, there
    is no difference; both are instructions to the computer!


    # 4.10　What is Structured Programming?


    Structured programming is a software development method that uses modularization
    and structured design. This means that large programs are broken down into smaller
    modules and each individual module uses structured code, which means that the
    statements are organized in a specific manner that minimizes errors and misinterpretation.
    As its name suggests, structured programming is done in a structured programming
    language and C++ is one such language.


    The structured programming concept was formalized in 1966 by Corrado Böhm¹ and
    Giuseppe Jacopini². They demonstrated theoretical computer program design using
    sequences, decisions, and iterations.


    # 4.11　The Three Fundamental Control Structures


    There are three fundamental control structures in structured programming.


    +   - **Sequence Control Structure:** This refers to the line-by-line execution,
    in which statements are executed sequentially, in the same order in which they
    appear in the program. They might, for example, carry out a series of read or
    write operations, arithmetic operations, or assignments to variables.

    +   - **Decision Control Structure:** Depending on whether a condition is true
    or false, the decision control structure may skip the execution of an entire block
    of statements or even execute one block of statements instead of another.

    +   - **Loop Control Structure:** This is a control structure that allows the
    execution of a block of statements multiple times until a specified condition
    is met.


    If you didn’t quite understand the deeper meaning of these three control structures,
    don’t worry, because upcoming chapters will analyze them very thoroughly. Patience
    is a virtue. All you have to do for now is wait!


    ¹ Corrado Böhm (1923– ) is a computer scientist known especially for his contribution
    to the theory of structured programming, and for the implementation of functional
    programming languages.

    ² Giuseppe Jacopini (1936–2001) was a computer scientist. His most influential
    contribution is the theorem about structured programming, published along with
    Corrado Böhm in 1966, under the title “Flow Diagrams, Turing Machines, and Languages
    with Only Two Formation Rules.”

    (Böhm, C., and Jacopini, G., “Flow Diagrams, Turing Machines, and Languages with
    Only Two Formation Rules,” Communications of the ACM 9(5), (May, 1966), 366–371.)'
