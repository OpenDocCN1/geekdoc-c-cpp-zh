  md: "# Exercise 10.1-5　*Kelvin to Fahrenheit*\n\nWrite a C++ program that converts\
    \ a temperature value from degrees Fahrenheit¹ to its degrees Kelvin² equivalent.\
    \ The required formula is\n\n$1.8 \\times Kelvin = Fahrenheit + 459.67$\n\n# Solution\n\
    \nThe formula given cannot be used in your program as is. In a computer language\
    \ such as C++, it is not permitted to write\n\n```\n1.8 * kelvin = fahrenheit\
    \ + 459.67\n```\n\n> **Remember!** In the position on the left side of the (=)\
    \ sign, only one single variable may exist. This variable is actually a region\
    \ in RAM where a value can be stored.\n\nThe program converts degrees Fahrenheit\
    \ to degrees Kelvin. The value for degrees Fahrenheit is a known value and it\
    \ is given by the user, whereas the value for degrees Kelvin is what the C++ program\
    \ should calculate. So, you need to solve for Kelvin. After a bit of work, the\
    \ formula becomes\n\n$Kelvin = \\dfrac{Fahrenheit + 459.67}{1.8}$\n\nand the C++\
    \ program is shown here.\n\n```\n**project_10_1_5**\n```cpp\n#include <iostream>\n\
    using namespace std;\nint main(){\n  double fahrenheit, kelvin;\n\n  cout << \"\
    Enter a temperature in Fahrenheit: \";\n  cin >> fahrenheit;\n\n  kelvin = (fahrenheit\
    \ + 459.67) / 1.8;\n\n  cout << \"The temperature in Kelvin is \" << kelvin;\n\
    \  return 0;\n}\n```\n```\n\n¹ Daniel Gabriel Fahrenheit (1686–1736) was a German\
    \ physicist, engineer, and glass blower who is best known for inventing both the\
    \ alcohol and the mercury thermometers, and for developing the temperature scale\
    \ now named after him.\n\n² William Thomson, 1st Baron Kelvin (1824–1907), was\
    \ an Irish-born British mathematical physicist and engineer. He is widely known\
    \ for developing the basis of absolute zero (the Kelvin temperature scale), and\
    \ for this reason a unit of temperature measure is named after him. He discovered\
    \ the Thomson effect in thermoelectricity and helped develop the second law of\
    \ thermodynamics."
