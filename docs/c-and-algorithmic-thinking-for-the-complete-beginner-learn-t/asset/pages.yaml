  md: "# Exercise 8.1-2　*Swapping Values of Variables*\n\nWrite a C++ program that\
    \ lets the user enter two values, in variables *a* and *b*. At the end of the\
    \ program, the two variables should swap their values. For example, if variables\
    \ *a* and *b* contain the values 5 and 7 respectively, after swapping their values,\
    \ variable *a* should contain the value 7 and variable *b* should contain the\
    \ value 5!\n\n# Solution\n\nThe following program, even though it may seem correct,\
    \ is erroneous and doesn’t really swap the values of variables *a* and *b*!\n\n\
    ```\n```cpp\n#include <iostream>\nusing namespace std;\nint main() {\n  int a,\
    \ b;\n\n  cin >> a;\n  cin >> b;\n\n  a = b;\n  b = a;\n\n  cout << a << endl;\n\
    \  cout << b << endl;\n  return 0;\n}\n```\n```\n\nLet’s see why! Suppose the\
    \ user enters two values, 5 and 7. The trace table is shown here.\n\n| Step |\
    \ Statement | Notes | a | b |\n|---|---|---|---:|---:|\n| 1 | `cin >> a` | User\
    \ enters the value 5 | 5 | ? |\n| 2 | `cin >> b` | User enters the value 7 | 5\
    \ | 7 |\n| 3 | `a = b` | The value of variable b is assigned to variable a. Value\
    \ 5 is lost! | 7 | 7 |\n| 4 | `b = a` | The value of variable a is assigned to\
    \ variable b | 7 | 7 |\n| 5 | `cout << a << endl` | The value 7 is displayed |\
    \  |  |\n| 6 | `cout << b << endl` | The value 7 is displayed |  |  |\n\nOops!\
    \ Where is the value 5?\n\nThe solution wasn’t so obvious after all! So, how do\
    \ you really swap values anyway?"
  merge: -1
