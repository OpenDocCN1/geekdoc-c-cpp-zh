  md: "# 14.7 Review Exercises\n\nComplete the following exercises.\n\n+   1. Write\
    \ a C++ program that prompts the user to enter his or her first name, middle name,\
    \ last name, and his or her preferred title (Mr., Mrs., Ms., Dr., and so on) and\
    \ displays them formatted in all the following ways.\n+   \n+      *Title FirstName\
    \ MiddleName LastName*\n+   \n+      *FirstName MiddleName LastName*\n+   \n+\
    \      *LastName, FirstName*\n+   \n+      *LastName, FirstName MiddleName*\n\
    +   \n+      *LastName, FirstName MiddleName, Title*\n+   \n+      *FirstName\
    \ LastName*\n+   \n+      For example, assume that the user enters the following:\n\
    +   \n+      First name: Aphrodite\n+   \n+      Middle name: Maria\n+   \n+ \
    \     Last name: Boura\n+   \n+      Title: Ms.\n+   \n+      The program should\
    \ display the user’s name formatted in all the following ways:\n+   \n+      Ms.\
    \ Aphrodite Maria Boura\n+   \n+      Aphrodite Maria Boura\n+   \n+      Boura,\
    \ Aphrodite\n+   \n+      Boura, Aphrodite Maria\n+   \n+      Boura, Aphrodite\
    \ Maria, Ms.\n+   \n+      Aphrodite Boura\n+   \n+   2. Write a C++ program that\
    \ creates and displays a random word consisting of five letters. The first letter\
    \ must be a capital letter.\n+   \n+   3. Write a C++ program that prompts the\
    \ user to enter his or her name and then creates a secret password consisting\
    \ of three letters (in lowercase) randomly picked up from his or her name, and\
    \ a random four-digit number. For example, if the user enters “Vassilis Bouras”\
    \ a secret password can probably be one of “sar1359” or “vbs7281” or “bor1459”."
  merge: -1
  img_proc: true
