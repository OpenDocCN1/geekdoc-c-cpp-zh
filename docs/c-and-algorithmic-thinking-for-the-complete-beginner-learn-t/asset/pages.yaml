    \ library.\n\n# Example\n\n```\nproject_14_4f\n\n#include <iostream>\n#include\
    \ <boost/algorithm/string.hpp>\nusing namespace boost::algorithm;\nusing namespace\
    \ std;\nint main() {\n  string a, b;\n\n  a = \"My Name is John\";\n  b = to_upper_copy(a);\n\
    \n  cout << b << endl;      //Outputs: MY NAME IS JOHN\n  return 0;\n}\n```\n\n\
    # Getting part of a string\n\n```\nsubject.substr( beginIndex [, length] )\n```\n\
    \nThis returns a portion of *subject*. Specifically, it starts from position *beginIndex*\
    \ and returns a substring of *length* characters or up to the end of the *subject*,\
    \ whichever comes first. The argument *length* is optional. If it is omitted,\
    \ the substring starting from position *beginIndex* until the end of *subject*\
    \ is returned.\n\n# Example\n\n```\nproject_14_4g\n\n#include <iostream>\nusing\
    \ namespace std;\nint main() {\n  string a;\n\n  a = \"Hello Athena\";\n\n  cout\
    \ << a.substr(6, 3) << endl;       //Outputs: Ath\n  cout << a.substr(6, 300)\
    \ << endl;     //Outputs: Athena\n  cout << a.substr(7) << endl;         //Outputs:\
    \ thena\n  return 0;\n}\n```\n\n# Checking if string is numeric\n\n```\ncin.fail()\n\
    ```\n\nThis returns true if the last `cin` statement fails, and false otherwise.\
    \ Moreover, if you try to read something with the `cin` statement and something\
    \ goes wrong, you need to clear the error state of `cin`. This is why the `cin.fail()`\
    \ function is always used in combination with the functions `cin.clear()` and\
    \ `cin.ignore()`."
