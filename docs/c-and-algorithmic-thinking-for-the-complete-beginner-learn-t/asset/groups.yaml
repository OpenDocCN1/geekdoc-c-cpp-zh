    # 4.13 What is the Difference Between Syntax Errors and Logic Errors?


    When programmers write code in a high-level language there are two types of errors
    that they might make: syntax errors and logic errors.


    Syntax errors are mistakes such as misspelled keywords, a missing punctuation
    character, a missing bracket, or a missing closing parenthesis. Fortunately, NetBeans
    IDE detects these errors as you type and displays a red exclamation mark in front
    of the erroneous line. If you try to execute a C++ program that includes syntax
    errors, you will get error messages on your screen and the program won’t be executed.
    You must correct all the errors and then try to execute the program again.


    Logic errors are those errors that prevent your program from doing what you expected
    it to do. With logic errors you get no warning at all. Your code may compile and
    run but the result is not the expected one. Logic errors are the most difficult
    errors to detect. You must revisit your program thoroughly to determine where
    your error is. For example, consider a C++ program that prompts the user to enter
    three numbers, and then calculates and displays their average value. The programmer,
    however, made a typographical error; one of his or her statements divides the
    sum of the three numbers by 5, and not by 3 as it should. Of course the C++ program
    is executed as usual, without any error messages, prompting the user to enter
    three numbers and displaying a result, but obviously not the correct one! It is
    the programmer who has to find and correct the erroneously written C++ statement,
    not the computer or the compiler!


    # 4.14 Commenting Your Code


    When you write a small and easy program, anyone can understand how it works just
    by reading it line-by-line. However, long programs are difficult to understand,
    sometimes even by the same person who wrote them. Comments are extra information
    that can be included in a program to make it easier to read and understand. You
    can add explanations and other pieces of information, including:


    +   - who wrote the program

    +   - when the program was created or last modified

    +   - what the program does

    +   - how the program works


    However, you should not over-comment. There is no need to explain every line of
    your program. Add comments only when a specific portion of your program is hard
    to follow.'
