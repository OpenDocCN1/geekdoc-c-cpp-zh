    ```cpp\ny = (5 * (3 * x * x + 5 * x + 2) / (7 * w - 1 / z) - z) / (4 * ((3 + x)\
    \ / 7));\n```\n\ntemp1        temp2        temp3\n\nIt may look scary at the end\
