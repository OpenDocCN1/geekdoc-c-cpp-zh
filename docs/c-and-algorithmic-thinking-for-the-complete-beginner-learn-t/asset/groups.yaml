  - '[PAGE 16]


    statements (or commands) are made up of zeros and ones. The following is an example
    of a program written in a machine language, that calculates the sum of two numbers.


    ```

    0010 0001 0000 0100

    0001 0001 0000 0101

    0011 0001 0000 0110

    0111 0000 0000 0001

    ```


    Shocked? Don’t worry, you are not going to write programs this way. Hopefully,
    no one writes computer programs this way anymore. Nowadays, all programmers write
    their programs in a high-level language and then they use a special program to
    translate them into a machine language. There are two types of programs that programmers
    use to perform translation: compilers and interpreters.


    A compiler is a program that translates statements written in a high-level language
    into a separate machine language program. The machine language program can then
    be executed any time you wish. After the translation, the compiler is no longer
    required.


    An interpreter is a program that simultaneously translates and executes the statements
    written in a high-level language. As the interpreter reads each individual statement
    in the program, it translates it into a machine language code and then directly
    executes it. This process is repeated for every statement in the program.


    # 1.6 What is Source Code?


    The statements (often called instructions or commands) that the programmer writes
    in a high-level language are called “source code” or simply “code.” The programmer
    first types the source code into a program known as a code editor, and then uses
    either a compiler to translate it into a machine language program, or an interpreter
    to translate and execute it at the same time. NetBeans IDE is an example of an
    Integrated Development Environment (IDE) that enables programmers to both write
    and execute their source code. You will learn more about NetBeans IDE in Chapter
    3.


