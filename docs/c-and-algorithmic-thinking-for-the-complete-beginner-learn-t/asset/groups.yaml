    # 7.5 Incrementing/Decrementing Operators


    Adding 1 to a number, or subtracting 1 from a number, are both so common in computer
    programs that C++ incorporates a special set of operators to do this. C++ supports
    two types of incrementing and decrementing operators:


    +   - pre-incrementing/decrementing operators

    +   - post-incrementing/decrementing operators


    Pre-incrementing/decrementing operators are placed before the variable name. Post-incrementing/decrementing
    operators are placed after the variable name. These four types of operators are
    shown here.


    | Operator | Description | Example | Equivalent to |

    |---|---|---|---|

    | Pre-incrementing | Increment a variable by one | `++a;` | `a = a + 1` |

    | Pre-decrementing | Decrement a variable by one | `--a;` | `a = a - 1` |

    | Post-incrementing | Increment a variable by one | `a++;` | `a = a + 1` |

    | Post-decrementing | Decrement a variable by one | `a--;` | `a = a - 1` |


    Once again, looking at the “Equivalent to” column, it becomes clear that you can
    achieve the same result by just using the classic assignment operator (=). However,
    it is much more sophisticated and productive to use these new operators. In the
    beginning you may hate them, but as the years pass you are definitely gonna love
    them!


    Let’s see an example with a pre-incrementing operator,


    ```

    a = 5;

    ++a;            //This is equivalent to a = a + 1

    b = a;


    cout << a << endl;

    cout << b << endl;

    ```


    and another one with a post-incrementing operator,


    ```

    a = 5;

    a++;            //This is equivalent to a = a + 1

    b = a;


    cout << a << endl;

    cout << b << endl;

    ```


    In both examples a value of 6 is assigned to variable b! So, where is the catch?
    Are these two examples equivalent? The answer is “yes,” but only in these two
    examples. In other cases the answer will likely be “no.” There is a small difference
    between them.


    Let’s spot that difference! The rule is that a pre-increment/decrement operator
    performs the increment/decrement operation first and then delivers the new value.'
