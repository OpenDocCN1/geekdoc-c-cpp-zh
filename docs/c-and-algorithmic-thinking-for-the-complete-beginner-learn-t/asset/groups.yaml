    # 5.7 How to Declare Variables in C++


    C++ is a strongly typed programming language. This means that each variable must
    have a specific data type associated with it. For example, a variable can hold
    an integer, a real, or a character. In C++ some of the primitive data types are:
    bool, int, float, double, and char. Which one to use depends on the given problem!
    Moreover, several of the basic types can be modified using one or more of these
    type modifiers:


    +   - unsigned

    +   - short

    +   - long


    To be more specific:


    +   - type **bool** can hold only two possible values: that is, `true` or `false`

    +   - type **int** can hold an integer between −2³¹ and +2³¹ − 1

    +   - type **unsigned int** can hold an integer between 0 and +2³² − 1

    +   - type **short int** can hold an integer between −2¹⁵ and +2¹⁵ − 1

    +   - type **unsigned short int** can hold an integer between 0 and +2¹⁶ − 1

    +   - type **float** can hold a real of single precision

    +   - type **double** can hold a real of double precision

    +   - type **char** can hold a single character.


    In many computer languages, there is one more variable type called “string”, which
    can hold a sequence of characters. These sequences of characters, or “strings”
    are usually enclosed in double or single quotes, such as “Hello Zeus”, “I am 25
    years old”, and so on. C++ also supports strings, but keep in mind that a string
    in C++ is not a primitive data type. Without going into detail, a string in C++
    is declared the same way as you declare a primitive data type such as int, byte,
    or double, but internally C++ stores and handles them in a quite different way.'
