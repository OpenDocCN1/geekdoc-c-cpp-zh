    \ Take a look at the first two boxes and examine the contained values.\n- 2. Use\
    \ your CPU (this is your brain) to calculate the sum (the result).\n- 3. Insert\
    \ the result in the last box. However, since each box can contain only one single\
    \ value at a time, the value 4 is actually replaced by the number 21.\n\nThe boxes\
    \ now look like this.\n\n![](img/7b41666e32fdead550ef74cdd9f6ead0_51_0.png)\n\n\
    In a flowchart, the action of storing a value in a variable is represented by\
