    # Chapter 4


    # Introduction to Basic Algorithmic Concepts


    # 4.1　 What is an Algorithm?


    An algorithm is a strictly defined finite sequence of well-defined statements
    (often called instructions or commands) that provides the solution to a problem
    or to a specific class of problems for any acceptable set of input values (if
    there are any inputs). In other words, an algorithm is a step-by-step procedure
    to solve a given problem. The term “finite” means that the algorithm should reach
    an end point and cannot run forever.


    You can find algorithms everywhere in your real life, not just in computer science.
    For example, the process for preparing toast or a cup of tea can be expressed
    as an algorithm. Certain steps, in a certain order, must be followed in order
    to achieve your goal.


    # 4.2　 The Algorithm for Making a Cup of Tea


    The following is an algorithm for making a cup of tea.


    +   1. Put the teabag in a cup.

    +   2. Fill the kettle with water.

    +   3. Boil the water in the kettle.

    +   4. Pour some of the boiled water into the cup.

    +   5. Add milk to the cup.

    +   6. Add sugar to the cup.

    +   7. Stir the tea.

    +   8. Drink the tea.


    As you can see, there are certain steps that must be followed. These steps are
    in a specific order, even though some of the steps could be rearranged. For example,
    steps 5 and 6 can be reversed. You could add the sugar first, and the milk afterwards.
    Please keep in mind that the order of some steps can probably be changed but you
    can’t move them far away from where they should be. For example, you can’t move
    step 3 (“Boil the water in the kettle.”) to the end of the algorithm, because
    you will end up drinking a cup of iced tea (and not a warm one) which is totally
    different from your initial goal!


    # 4.3　 Properties of an Algorithm


    An algorithm must satisfy the following properties:


    +   - **Input:** The algorithm must have input values from a specified set.

    +   - **Output:** The algorithm must produce the output values from a specified
    set of input values. The output values are the solution to a problem.'
