    \ |\n| **分钟 = 26** | 如果将剩余秒数除以 60 得到整数商，就可以分离出分钟数<br>`minutes = (int)(1605 / 60);`\
    \ |\n| **秒 = 45** | 最后一个余数，也就是剩余的秒数，为<br>`seconds = 1605 % 60;` |\n\n该算法的 C++\
    \ 程序如下。\n\n```cpp\n// project_13_1_3\n#include <iostream>\nusing namespace std;\n\
    \nint main() {\n    int days, hours, minutes, number, r, seconds;\n\n    cout\
