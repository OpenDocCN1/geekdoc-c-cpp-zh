    \ is usually expressed as “Assign a value, or the result of an expression, to\
    \ a variable.” The left arrow is called the “value assignment operator.”\n\n>\
    \ *Notice:* Please note that this arrow always points to the left. You are not\
    \ allowed to use right arrows. Also, on the left side of the arrow only one single\
    \ variable should exist.\n\nIn real computer science, the three boxes are actually\
    \ three individual regions in main memory (RAM), named `numberA`, `numberB` and\
    \ `numberC`.\n\n![](img/7b41666e32fdead550ef74cdd9f6ead0_51_2.png)\n\nWhen a program\
    \ instructs the CPU to execute the statement\n\n`numberC ← numberA + numberB`\n\
    \nit follows the same three-step process as in the previous example.\n\n- 1. The\
    \ number 13 is transferred from the RAM’s region named `numberA` to the CPU. The\
    \ number 8 is transferred from the RAM’s region named `numberB` to the CPU. (This\
    \ is the first step, in which you examined the values contained in the first two\
    \ boxes.)\n- 2. The CPU calculates the sum of 13 + 8. (This is the second step,\
    \ in which you used your brain to calculate the sum, or result.)\n- 3. The result,\
    \ 21, is transferred from the CPU to the RAM’s region named `numberC`, replacing\
    \ the existing number 4. (This is the third step, in which you inserted the result\
    \ in the last box.)\n\nAfter execution, the RAM looks like this:\n\n| RAM |  |\n\
    | --- | --- |\n| ... |  |\n| 13 | numberA |\n| 8 | numberB |\n| 21 | numberC |\n\
    | ... |  |\n\n> **Remember!** While a C++ program is running a variable can hold\
    \ various values, but only one value at a time. When you assign a value to a variable,\
    \ this value remains stored until you assign a new value. The old value is lost.\n\
    \nA variable is one of the most important elements in computer science because\
    \ it helps you interact with data stored in the main memory (RAM). Soon, you will\
    \ learn all about how to declare and use variables in C++.\n\n### 5.2 What is\
    \ a Constant?\n\nSometimes you may need to use a value that cannot change while\
    \ the program is running. Such a value is called a “constant.” In simple terms,\
    \ you could say that a constant is a locked variable. This means that when a program\
    \ begins to run and a value is assigned to the constant, nothing can change the\
