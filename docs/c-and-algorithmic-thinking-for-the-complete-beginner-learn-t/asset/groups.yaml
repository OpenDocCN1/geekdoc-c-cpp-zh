    of arithmetic operators.


    | Arithmetic Operator | Description |

    |---|---|

    | + | Addition |

    | - | Subtraction |

    | * | Multiplication |

    | / | Division |

    | % | Modulus (remainder after integer division) |


    The first four operators are straightforward and need no further explanation.'
