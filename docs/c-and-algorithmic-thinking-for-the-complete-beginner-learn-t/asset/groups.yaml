    # 6.3 Which Statement Lets the User Enter Data?


    Do you recall the three main stages involved in creating an algorithm or a computer
    program? The first stage was the “data input” stage, in which the computer lets
    the user enter data such as numbers, their name, their address, or their year
    of birth.


    A flowchart uses the oblique parallelogram and the reserved word “Read” to let
    a user enter his or her data.


    ![](img/7b41666e32fdead550ef74cdd9f6ead0_66_0.png)


    where *var_name1*, *var_name2*, and *var_name3* must be variables only.


    The oblique parallelogram that you have just seen is equivalent to


    ![](img/7b41666e32fdead550ef74cdd9f6ead0_66_1.png)


    > **Notice:** When a Read statement is executed, the flow of execution is interrupted
    until the user has entered all the data. When data entry is complete, the flow
    of execution continues to the next statement. Usually data are entered from a
    keyboard.


    In C++, data input is accomplished using the following C++ statements


    ```

    ```cpp

    //Read a number or a string (without spaces or tabs) from the keyboard

    cin >> var_name;


    //Read a string that includes spaces and tabs from the keyboard

    getline(cin, var_name_str);

    ```

    ```


    where


    +   - *var_name* can be a variable of any type.

    +   - *var_name_str* can be any variable of type `string`.'
