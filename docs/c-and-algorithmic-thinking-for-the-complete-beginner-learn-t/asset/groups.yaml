  mdcn: "\n## 第1部分：入门知识\n\n## 第1章：计算机如何工作\n\n### 1.1 引言\n\n在当今社会，几乎每项任务都需要使用计算机。在学校，学生使用计算机上网搜索和发送电子邮件。在工作中，人们使用计算机制作演示文稿、分析数据以及与客户沟通。在家里，人们使用计算机玩游戏，并与世界各地的人聊天。当然，别忘了\
    \ iPhone 等智能手机。它们也是计算机！\n\n计算机能执行如此多不同任务，是因为它们具有可编程能力。换句话说，计算机可以执行程序告诉它执行的任何工作。程序是一组语句（通常称为指令或“命令”），计算机遵循这些语句来执行特定任务。\n\
    \n程序（通常称为“应用软件”）对计算机至关重要，因为如果没有它们，计算机就是一台什么也做不了的哑机器。程序实际上告诉计算机做什么以及何时做。程序员或软件开发人员是设计、创建和测试计算机程序的人。\n\
    \n本书使用 C++ 语言向你介绍计算机编程的基本概念。\n\n### 1.2 什么是硬件？\n\n术语“硬件”指构成计算机的所有设备或组件。如果你曾经打开过计算机或笔记本电脑的机箱，你可能已经见过它的许多组件，例如微处理器（CPU）、内存和硬盘。计算机不是单个设备，而是协同工作的设备系统。这里讨论典型计算机系统的基本组件。\n\
    \n- **中央处理器（CPU）**  \n  这是计算机中实际执行程序中定义的所有任务的部分。\n- **主存储器（RAM——随机存取存储器）**  \n\
    \  这是计算机保存程序（在程序被执行/运行时）以及程序正在处理的数据的区域。当你关闭计算机或将其从墙壁插座上拔下时，存储在这种内存中的所有程序和数据都会丢失。\n\
    - **辅助存储设备**  \n  这通常是硬盘，有时（但较少见）是 CD/DVD 驱动器。与主存储器相比，这种存储器可以在计算机断电时仍将数据保存更长时间。然而，存储在这种存储器中的程序不能直接执行。它们必须被传输到快得多的存储器，即主存储器。\n\
    - **输入设备**  \n  输入设备是所有从外部世界收集数据并将其输入计算机以进行进一步处理的设备。键盘、鼠标和麦克风都是输入设备。\n- **输出设备**\
    \  \n  输出设备是所有将数据输出到外部世界的设备。显示器（屏幕）和打印机是输出设备。\n\n### 1.3 什么是软件？\n\n计算机所做的一切都受软件控制。软件分为两类：系统软件和应用软件。\n\
    \n系统软件是控制和管理基本操作的一类软件。例如，它控制计算机的内部操作，管理连接到计算机的所有设备，保存数据，加载数据，并允许其他程序被执行。Windows、Linux、Mac\
    \ OS X、Android 和 iOS 都是系统软件的例子。这类程序的另一个术语是“操作系统”。\n\n应用软件指你用于日常任务的所有其他程序，例如浏览器、文字处理器、记事本、游戏等。\n\
    \n### 1.4 计算机如何执行（运行）程序\n\n当你打开计算机时，主存储器（RAM）完全是空的。计算机需要做的第一件事是将操作系统从硬盘传输到主存储器。\n\
    \n操作系统加载到主存储器后，你可以执行（运行）任何你喜欢的程序（应用软件）。这通常通过单击、双击或点击程序对应的图标来完成。例如，假设你单击最喜欢的文字处理器的图标。此操作命令计算机将文字处理程序从硬盘加载（或复制）到主存储器，以便\
    \ CPU 可以执行它。\n\n> **记住！** 程序存储在硬盘等辅助存储设备上。当你在计算机上安装程序时，程序实际上会被复制到硬盘上。但是当你执行程序时，程序会从硬盘复制（加载）到主存储器中，并执行该程序的副本。\n\
    >\n> **注意：**“运行”和“执行”这两个术语是同义词。\n\n### 1.5 编译器和解释器\n\n计算机可以执行用严格定义的计算机语言编写的程序。你不能使用英语或希腊语等自然语言编写程序，因为计算机听不懂你！\n\
    \n但是计算机实际上能理解什么？计算机可以理解一种称为“机器语言”的特定低级语言。在机器语言中，所有语句（或命令）都由 0 和 1 组成。以下是用机器语言编写的程序示例，它计算两个数之和。\n\
    \n```\n0010 0001 0000 0100\n0001 0001 0000 0101\n0011 0001 0000 0110\n0111 0000\
    \ 0000 0001\n```\n\n震惊了吗？别担心，你不会用这种方式编写程序。希望现在没有人再这样编写计算机程序了。如今，所有程序员都用高级语言编写程序，然后使用一种特殊程序将其翻译成机器语言。程序员用来执行翻译的程序有两种：编译器和解释器。\n\
    \n编译器是一种程序，它将用高级语言编写的语句翻译成一个单独的机器语言程序。然后，你可以随时执行该机器语言程序。翻译完成后，就不再需要编译器了。\n\n解释器是一种程序，它同时翻译并执行用高级语言编写的语句。当解释器读取程序中的每条单独语句时，它会将其翻译成机器语言代码，然后直接执行它。程序中的每条语句都会重复此过程。\n\
    \n### 1.6 什么是源代码？\n\n程序员用高级语言编写的语句（通常称为指令或命令）称为“源代码”，或简称为“代码”。程序员首先将源代码输入到称为代码编辑器的程序中，然后使用编译器将其翻译成机器语言程序，或使用解释器同时翻译并执行它。NetBeans\
    \ IDE 是一个集成开发环境（IDE）的示例，它使程序员既能编写又能执行其源代码。你将在第3章中进一步了解 NetBeans IDE。\n\n### 1.7\
    \ 复习题：判断题（正确/错误）\n\n对以下每个陈述选择**正确**或**错误**。\n\n- 1. 现代计算机之所以能执行如此多不同任务，是因为它们拥有许多\
    \ GB 的 RAM。\n- 2. 计算机可以在没有程序的情况下运行。\n- 3. 硬盘是硬件的一个例子。\n- 4. 即使计算机断电，数据也可以在主存储器（RAM）中存储很长时间。\n\
    - 5. 数据存储在主存储器（RAM）中，但程序不存储在其中。\n- 6. 扬声器是输出设备的一个例子。\n- 7. Windows 和 Linux 是软件的例子。\n\
    - 8. 媒体播放器是系统软件的一个例子。\n- 9. 当你打开计算机时，主存储器（RAM）中已经包含操作系统。\n- 10. 当你打开文字处理应用程序时，它实际上会从辅助存储设备复制到主存储器（RAM）。\n\
    - 11. 在机器语言中，所有语句（命令）都是 0 和 1 的序列。\n- 12. 如今，计算机无法理解 0 和 1。\n- 13. 如今，软件是用由 1\
    \ 和 0 组成的语言编写的。\n- 14. 软件指计算机的物理组件。\n- 15. 在高级计算机编程语言中，计算机并不理解 0 和 1。\n- 16. 编译器和解释器都是软件。\n\
    - 17. 编译器将源代码翻译成可执行文件。\n- 18. 解释器创建机器语言程序。\n- 19. 翻译完成后，就不再需要解释器了。\n- 20. 可以使用简单的文本编辑器编写源代码。\n\
    - 21. 源代码无需编译或解释即可由计算机执行。\n- 22. 用机器语言编写的程序需要编译（翻译）。\n- 23. 编译器翻译用高级语言编写的程序。\n\
    \n### 1.8 复习题：多项选择题\n\n为以下每个陈述选择正确答案。\n\n- 1. 下列哪一项**不是**计算机硬件？\n  - a. 硬盘\n \
    \ - b. DVD 光盘\n  - c. 声卡\n  - d. 主存储器（RAM）\n- 2. 下列哪一项**不是**辅助存储设备？\n  - a. DVD\
    \ 读写器设备\n  - b. 硬盘\n  - c. USB 闪存盘\n  - d. RAM\n- 3. 下列哪一项操作**不能**由 CPU 执行？\n\
