    \ 显示值 7 |  |  |\n\n哎呀！值 5 在哪里？\n\n这个解决方案终究没那么显而易见！那么，到底如何真正交换值呢？\n\n考虑两个杯子：一杯橙汁（称为杯子\
    \ A）和一杯柠檬汁（称为杯子 B）。如果你想交换它们的内容，你只需要找到并使用一个额外的空杯子（称为杯子 C）。\n\n![](img/7b41666e32fdead550ef74cdd9f6ead0_87_0.png)\n\
    \n必须遵循的步骤如下：\n\n1. 将杯子 A 的内容物（橙汁）倒入杯子 C。\n\n![](img/7b41666e32fdead550ef74cdd9f6ead0_87_1.png)\n\
    \n2. 将杯子 B 的内容物（柠檬汁）倒入杯子 A。\n\n![](img/7b41666e32fdead550ef74cdd9f6ead0_87_2.png)\n\
    \n3. 将杯子 C 的内容物（橙汁）倒入杯子 B。\n\n![](img/7b41666e32fdead550ef74cdd9f6ead0_87_3.png)\n\
    \n交换成功完成！\n\n你可以遵循相同的步骤在 C++ 中交换两个变量的内容。\n\n```cpp\n#include <iostream>\nusing\
    \ namespace std;\nint main() {\n  int a, b, c;\n\n  cin >> a;\n  cin >> b;\n\n\
    \  c = a;  //Empty the contents of glass A (orange juice) into glass C\n  a =\
    \ b;  //Empty the contents of glass B (lemon juice) into glass A\n  b = c;  //Empty\
    \ the contents of glass C (orange juice) into glass B\n\n  cout << a << endl;\n\
    \  cout << b << endl;\n  return 0;\n}\n```\n\n> **注意：** 请注意三个赋值语句中每个语句后面的双斜杠。双斜杠后面的内容被视为注释，永远不会执行。\n\
    \n## 练习 8.1-3 — 交换变量的值 – 第二种方法\n\n编写一个 C++ 程序，让用户输入两个数值，分别存入变量 a 和 b。最后，这两个变量应交换它们的值。\n\
    \n### 解答\n\n由于这些变量只包含数值，你可以使用以下 C++ 程序。\n\n```cpp\n#include <iostream>\nusing\
    \ namespace std;\nint main() {\n  int a, b;\n\n  cin >> a;\n  cin >> b;\n\n  a\
    \ = a + b;\n  b = a - b;\n  a = a - b;\n\n  cout << a << endl;\n  cout << b <<\
    \ endl;\n  return 0;\n}\n```\n\n> **注意：** 与上一练习相比，这种方法唯一的主要缺点是无法交换字母数字变量（字符串）的内容。\n\
    \n| 步骤 | 语句 | 说明 | a | b | c |\n|---|---|---|---|---|---|\n| 2 | `c = 3` |  |\
    \ ? | 10 | 3 |\n| 3 | `c = c * b` |  | ? | 10 | 30 |\n| 4 | `a = 10 * c % 10`\
    \ |  | 0 | 10 | 30 |\n| 5 | `cout << a` | 显示值 0 |  |  |  |\n\n## 练习 8.1-5 — 创建跟踪表\n\
    \n创建一个跟踪表，以确定输入值为 3 时每一步中变量的值。\n\n```cpp\n#include <iostream>\nusing namespace\
    \ std;\nint main() {\n  double a, b, c, d;\n\n  cin >> a;\n\n  b = a + 10;\n \
    \ a = b * (a - 3);\n  c = 3 * b / 6;\n  d = c * c;\n  d--;\n\n  cout << d;\n \
    \ return 0;\n}\n```\n\n### 解答\n\n对于输入值 3，跟踪表如下所示。\n\n| 步骤 | 语句 | 说明 | a | b |\
    \ c | d |\n|---|---|---|---|---|---|---|\n| 1 | `cin >> a` | 用户输入值 3 | 3 | ? |\
    \ ? | ? |\n| 2 | `b = a + 10` |  | 3 | 13 | ? | ? |\n| 3 | `a = b * (a - 3)` |\
    \  | 0 | 13 | ? | ? |\n| 4 | `c = 3 * b / 6` |  | 0 | 13 | 6.5 | ? |\n| 5 | `d\
    \ = c * c` |  | 0 | 13 | 6.5 | 42.25 |\n| 6 | `d--` |  | 0 | 13 | 6.5 | 41.25\
    \ |\n| 7 | `cout << d` | 显示值 41.25 |  |  |  |  |\n\n## 8.2 复习问题：正确/错误\n\n为以下每个陈述选择**正确或错误**。\n\
    \n1. 跟踪表是一种测试计算机的技术。\n2. 跟踪表帮助程序员发现计算机程序中的错误。\n3. 如果不先创建相应的跟踪表，就无法编写计算机程序。\n4.\
    \ 为了交换两个整型变量的值，你总是需要一个额外变量。\n\n## 8.3 复习练习\n\n完成以下练习。\n\n1. 创建一个跟踪表，以确定该 C++ 程序在三次不同执行中每一步的变量值。\n\
    \   三次执行的输入值分别为：(i) 3、(ii) 4 和 (iii) 1。\n\n   ```cpp\n   #include <iostream>\n\
    \   using namespace std;\n   int main() {\n       int a, b, c, d;\n\n       cin\
    \ >> a;\n\n       a = (a + 1) * (a + 1) + 6 / 3 * 2 + 20;\n       b = a % 13;\n\
    \       c = b % 7;\n       d = a * b * c;\n       cout << a << \", \" << b <<\
    \ \", \" << c << \", \" << d;\n       return 0;\n   }\n   ```\n\n2. 创建一个跟踪表，以确定该\
    \ C++ 程序在两次不同执行中每一步的变量值。\n   两次执行的输入值分别为：(i) 3、4；和 (ii) 4、4\n\n   ```cpp\n   #include\
    \ <iostream>\n   using namespace std;\n   int main() {\n       double a, b, c,\
    \ d, e;\n\n       cin >> a;\n       cin >> b;\n\n       c = a + b;\n       d =\
    \ 1 + a / b * c + 2;\n       e = c + d;\n       c += d + e;\n   }\n   ```\n\n"
