    \ in action. Let’s try to rewrite the previous C++ program. Starting backwards,\
    \ replace variables nominator and denominator with their assigned expressions.\
    \ The result is\n\n```cpp\ny = (5 * temp1 / temp2 - z) / (4 * temp3);\n```\n\n\
