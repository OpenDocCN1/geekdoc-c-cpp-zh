    if the user enters the number 5, the computer can then find the result of 1 +
    2 + 3 + 4 + 5.


    # 4.7 Flowcharts


    A flowchart is a graphical method of presenting an algorithm, usually on paper.
    It is the visual representation of the algorithm''s flow of execution. In other
    words, it visually represents how the flow of execution proceeds from one statement
    to the next until the end of the algorithm is reached. A flowchart cannot be entered
    directly into a computer as is. It must first be converted into a programming
    language such as C++.


    The basic symbols that flowcharts use are shown in Table 4-1.


    Table 4-1 Flowchart Symbols and Their Functions


    | | |

    |---|---|

    | [Start/End Symbol] | Start/End: Represents the beginning or the end of an algorithm.
    The Start symbol has one exit and the End symbol has one entrance. |

    | [Arrow Symbol] | Arrow: Shows the flow of execution. An arrow coming from one
    symbol and ending at another symbol shows that control passes to the symbol that
    the arrow is pointing to. Arrows are always drawn as straight lines going up and
    down or sideways (never at an angle). |'
