    ## 第 14 章：操作字符串\n\n### 14.1 引言\n\n一般来说，字符串是你可以使用键盘输入的任何内容，包括字母、符号（例如 &、* 和 @）以及数字。有时程序会处理以字符串（文本）形式出现的数据。在\
    \ C++ 中，字符串总是像这样用双引号括起来：“ ”。\n\n下一个示例中的每条语句都会输出一个字符串。\n\n```cpp\n#include <iostream>\n\
