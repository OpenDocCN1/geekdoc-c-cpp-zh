    There is a myth about the origin of the term "debugging." In 1940, while Grace
    Hopper¹ was working on a Mark II Computer at Harvard University, her associates
    discovered a bug (a moth) stuck in a relay (an electrically operated switch).
    This bug was blocking the proper operation of the Mark II computer. So, while
    her associates were trying to remove the bug, Grace Hopper remarked that they
    were "debugging" the system!


    # ## 9.4 Debugging C++ Programs with NetBeans IDE


    As you already know, when someone writes code in a high-level language there are
    two types of errors that he or she might make—syntax errors and logic errors.
    NetBeans IDE provides all the necessary tools to help you debug your programs
    and find the errors.


    # ### Debugging syntax errors


    Fortunately, NetBeans IDE detects syntax errors while you are typing (or when
    you are trying to run the project) and underlines them with a wavy red line as
    shown in Figure 9-11.


    ![](img/7b41666e32fdead550ef74cdd9f6ead0_100_0.png)


    **Figure 9-11** In the NetBeans IDE, syntax errors are underlined with a wavy
    red line


    All you have to do is correct the corresponding error and the red line will disappear
    at once. However, if you are not certain about what is wrong with your code, you
    can just place your mouse cursor on the red exclamation mark. NetBeans IDE will
    try to help you by showing a popup window with a brief explanation of the error,
    as shown in Figure 9-12.


    1 Grace Murray Hopper (1906–1992) was an American computer scientist and US Navy
    admiral. She was one of the first programmers of the Harvard Mark I computer,
    and developed the first compiler for a computer programming language known as
    A-0 and later a second one, known as B-0 or FLOW-MATIC.'
