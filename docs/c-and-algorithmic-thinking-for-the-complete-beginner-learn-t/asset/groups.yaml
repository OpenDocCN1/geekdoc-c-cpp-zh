    # Chapter 5


    # Variables and Constants


    # 5.1 What is a Variable?


    In computer science, a variable is a location in the computer''s main memory (RAM)
    where you can store a value and change it as the program executes.

    Picture a variable as a transparent box in which you can insert and hold one thing
    at a time. Because the box is transparent, you can also examine what it contains.
    Moreover, if you have two or more boxes you can give each box a unique name. For
    example, you could have three boxes, each containing a different number, and you
    could name the boxes `numberA`, `numberB`, and `numberC`.


    ![](img/7b41666e32fdead550ef74cdd9f6ead0_50_0.png)


    The boxes named `numberA`, `numberB` and `numberC` in the example contain the
    numbers 13, 8, and 4, respectively. Of course, you can examine or even alter the
    contained value of each one of these boxes at any time.


    Now, let’s say that someone asks you to find the sum of the values of the first
    two boxes and then store the result in the last box. The steps you must follow
    are:


    +   1. Take a look at the first two boxes and examine the contained values.

    +   2. Use your CPU (this is your brain) to calculate the sum (the result).

    +   3. Insert the result in the last box. However, since each box can contain
    only one single value at a time, the value 4 is actually replaced by the number
    21.'
  - '[PAGE 51]


    The boxes now look like this.


    ![](img/7b41666e32fdead550ef74cdd9f6ead0_51_0.png)


    In a flowchart, the action of storing a value in a variable is represented by
    a left arrow


    ![](img/7b41666e32fdead550ef74cdd9f6ead0_51_1.png)


    This action is usually expressed as “Assign a value, or the result of an expression,
    to a variable.” The left arrow is called the “value assignment operator.”


    > > *Notice:* Please note that this arrow always points to the left. You are not
    allowed to use right arrows. Also, on the left side of the arrow only one single
    variable should exist.


    In real computer science, the three boxes are actually three individual regions
    in main memory (RAM), named `numberA`, `numberB` and `numberC`.


    ![](img/7b41666e32fdead550ef74cdd9f6ead0_51_2.png)'
  - '[PAGE 52]


    When a program instructs the CPU to execute the statement


    numberC ← numberA + numberB


    it follows the same three-step process as in the previous example.


    +   1. The number 13 is transferred from the RAM’s region named `numberA` to the
    CPU. The number 8 is transferred from the RAM’s region named `numberB` to the
    CPU. (This is the first step, in which you examined the values contained in the
    first two boxes.)

    +   2. The CPU calculates the sum of 13 + 8. (This is the second step, in which
    you used your brain to calculate the sum, or result.)

    +   3. The result, 21, is transferred from the CPU to the RAM’s region named `numberC`,
    replacing the existing number 4. (This is the third step, in which you inserted
    the result in the last box.)


    After execution, the RAM looks like this:


    | RAM |  |

    |---|---|

    | ... |  |

    | 13 | numberA |

    | 8 | numberB |

    | 21 | numberC |

    | ... |  |


    > > **Remember!** While a C++ program is running a variable can hold various values,
    but only one value at a time. When you assign a value to a variable, this value
    remains stored until you assign a new value. The old value is lost.


    A variable is one of the most important elements in computer science because it
    helps you interact with data stored in the main memory (RAM). Soon, you will learn
    all about how to declare and use variables in C++.


    # 5.2 What is a Constant?


    Sometimes you may need to use a value that cannot change while the program is
    running. Such a value is called a “constant.” In simple terms, you could say that
    a constant is a locked variable. This means that when a program begins to run
    and a value is assigned to the constant, nothing can change the value of the constant
    while the program is running. For example, in a financial program an interest
    rate can be declared as a constant.'
