    \n### 练习 13.1-1 计算整数除法的商和余数\n\n编写一个 C++ 程序，提示用户输入两个整数，然后计算整数除法的商和余数。\n\n**解答**\n\
    \n由于 C++ 实际上并没有一个专门计算整数商的算术运算符，你可以使用 `(int)` 强制类型转换运算符来达到同样的效果。\n\n```cpp\n//\
    \ project_13_1_1\n#include <iostream>\nusing namespace std;\n\nint main() {\n\
    \    int number1, number2, q, r;\n\n    cout << \"Enter first number: \";\n  \
    \  cin >> number1;\n    cout << \"Enter second number: \";\n    cin >> number2;\n\
    \n    q = (int)(number1 / number2);\n    r = number1 % number2;\n    cout << \"\
    Integer Quotient: \" << q << \"\\nInteger Remainder: \" << r;\n    return 0;\n\
    }\n```\n\n> **注意：** 在流程图中，要计算整数除法的商，可以使用常用的 DIV 运算符。下面显示了一个示例。\n>\n> ![](img/7b41666e32fdead550ef74cdd9f6ead0_142_0.png)\n\
    \n> **注意：** 在 C++ 中，两个整数相除的结果始终是整数。因此，在语句 `q = (int)(number1 / number2);` 中，由于变量\
    \ `number1` 和 `number2` 是整数，`(int)` 强制类型转换运算符是多余的。不过，为了增强可读性，保留它也是一种良好的实践。\n\n\
    ### 练习 13.1-2 求数字之和\n\n编写一个 C++ 程序，提示用户输入一个四位整数，然后计算其各位数字之和。\n\n**解答**\n\n这里需要记住的是，程序开头的语句\n\
    \n```cpp\ncin >> number;\n```\n\n将给定的四位整数赋给一个单独的变量 `number`，而不是赋给四个单独的变量。\n\n\
    因此，你首先必须将该整数拆分为四个数字，并将每个数字赋给一个单独的变量。然后计算这四个变量之和，即可得到所需结果。这里有两种方法可用。\n\n### 第一种方法\n\
    \n让我们通过一个算术示例来理解第一种方法。以数字 6753 为例。\n\n|  | 说明 |\n|---|---|\n| **第 1 位数字 = 6**\
    \ | 将给定数字除以 1000 取整数商，即可分离出第 1 位数字<br>`digit1 = (int)(6753 / 1000)` |\n| **剩下的数字\
    \ = 753** | 将给定数字除以 1000 取整数余数，即可分离出剩下的数字<br>`r = 6753 % 1000` |\n| **第 2 位数字\
    \ = 7** | 将剩下的数字除以 100 取整数商，即可分离出第 2 位数字<br>`digit2 = (int)(753 / 100)` |\n| **剩下的数字\
    \ = 53** | 此时剩下的数字为<br>`r = 753 % 100` |\n| **第 3 位数字 = 5** | 将剩下的数字除以 10 取整数商，即可分离出第\
    \ 3 位数字<br>`digit3 = (int)(53 / 10)` |\n| **第 4 位数字 = 3** | 最后剩下的数字恰好是第 4 位数字，即<br>`digit4\
    \ = 53 % 10` |\n\n解决该算法的 C++ 程序如下所示。\n\n```cpp\n#include <iostream>\nusing namespace\
    \ std;\n\nint main() {\n    int digit1, digit2, digit3, digit4, number, r, sum;\n\
    \n    cout << \"Enter a four-digit integer: \";\n    cin >> number;\n\n    digit1\
    \ = (int)(number / 1000);\n    r = number % 1000;\n\n    digit2 = (int)(r / 100);\n\
    \    r = r % 100;\n\n    digit3 = (int)(r / 10);\n    digit4 = r % 10;\n\n   \
    \ sum = digit1 + digit2 + digit3 + digit4;\n    cout << sum;\n    return 0;\n\
    }\n```\n\n下面是你刚刚看到的程序的跟踪表。\n\n| 步骤 | 语句 | 说明 | number | digit1 | digit2 | digit3\
    \ | digit4 | r | sum |\n|---|---|---|---|---|---|---|---|---|---|\n| 1 | `cout\
    \ << \"Enter a ...\"` | 显示消息“Enter a ...” |  |  |  |  |  |  |  |\n| 2 | `cin >>\
    \ number` | 用户输入 **6753** | `6753` | `?` | `?` | `?` | `?` | `?` | `?` |\n| 3\
    \ | `digit1 = (int)(number / 1000)` |  | `6753` | `6` | `?` | `?` | `?` | `?`\
    \ | `?` |\n| 4 | `r = number % 1000` |  | `6753` | `6` | `?` | `?` | `?` | `753`\
    \ | `?` |\n| 5 | `digit2 = (int)(r / 100)` |  | `6753` | `6` | `7` | `?` | `?`\
    \ | `753` | `?` |\n| 6 | `r = r % 100` |  | `6753` | `6` | `7` | `?` | `?` | `53`\
    \ | `?` |\n| 7 | `digit3 = (int)(r / 10)` |  | `6753` | `6` | `7` | `5` | `?`\
    \ | `53` | `?` |\n| 8 | `digit4 = r % 10` |  | `6753` | `6` | `7` | `5` | `3`\
    \ | `53` | `?` |\n| 9 | `sum = digit1+digit2+...` |  | `6753` | `6` | `7` | `5`\
    \ | `3` | `53` | `18` |\n| 10 | `cout << sum` | 显示值 18 | `6753` | `6` | `7` |\
    \ `5` | `3` | `53` | `18` |\n\n为了进一步帮助你，这里还有一个通用的 C++ 程序，可用于拆分任意给定的整数。由于程序长度取决于数字的位数\
    \ N，你只需编写 N-1 对语句即可。\n\n![](img/7b41666e32fdead550ef74cdd9f6ead0_144_0.png)\n\n\
    ```cpp\ncin >> number;\n\ndigit1 = (int)(number / 10^(N-1));\nr = number % 10^(N-1);\n\
    \n...\n\ndigit2 = (int)(r / 10^(N-2));\nr = r % 10^(N-2);\n\n...\n\ndigit(N-2)\
    \ = (int)(r / 100);\nr = r % 100;\n\ndigit(N-1) = (int)(r / 10);\ndigitN = r %\
    \ 10;\n```\n\n例如，如果你想拆分一个六位整数，你需要写五对语句。\n\n```cpp\n#include <iostream>\nusing\
    \ namespace std;\n\nint main() {\n    int digit1, digit2, digit3, digit4, digit5,\
    \ digit6, number, r;\n\n    cout << \"Enter a six-digit integer: \";\n    cin\
    \ >> number;\n\n    digit1 = (int) (number / 100000);\n    r = number % 100000;\n\
    \n    digit2 = (int) (r / 10000);\n    r = r % 10000;\n\n    digit3 = (int) (r\
    \ / 1000);\n    r = r % 1000;\n\n    digit4 = (int) (r / 100);\n    r = r % 100;\n\
    \n    digit5 = (int) (r / 10);\n    digit6 = r % 10;\n\n    cout << digit1 <<\
    \ \", \" << digit2 << \", \" << digit3 << \", \" << endl;\n    cout << digit4\
    \ << \", \" << digit5 << \", \" << digit6 << endl;\n    return 0;\n}\n```\n\n\
    - 第 1 对语句\n- 第 2 对语句\n- 第 3 对语句\n- 第 4 对语句\n- 第 5 对语句\n\n### 第二种方法\n\n同样，我们再用一个算术示例来理解第二种方法。以同一个数字\
    \ 6753 为例。\n\n|  |  |\n|---|---|\n| **第 4 位数字 = 3** | 将给定数字除以 10 取整数余数，即可分离出第\
    \ 4 位数字<br>`digit4 = 6753 % 10` |\n| **剩下的数字 = 675** | 将给定数字除以 10 取整数商，即可分离出剩下的数字<br>`r\
    \ = (int) (6753 / 10)` |\n| **第 3 位数字 = 5** | 将剩下的数字除以 10 取整数余数，即可分离出第 3 位数字<br>`digit3\
    \ = 675 % 10` |\n| **剩下的数字 = 67** | 此时剩下的数字为<br>`r = (int) (675 / 10)` |\n| **第\
    \ 2 位数字 = 7** | 将剩下的数字除以 10 取整数余数，即可分离出第 2 位数字<br>`digit2 = 67 % 10` |\n\n"
