    \ calculating the sum of the products:\n\ndigit3 × 100 + digit2 × 10 + digit1\
    \ × 1\n\nFor a change, you can split the given number using the second approach.\
    \ The C++ program will look like this.\n\n### project_13_1_4\n\n```cpp\n#include\
