    int main() {\n  int random_int;\n  string last_name;\n\n  srand(time(NULL));\n\
    \n  cout << \"Enter last name: \";\n  cin >> last_name;\n\n  //Get Random integer\
    \ between 100 and 999\n  random_int = 100 + rand() % 900;\n\n  cout << to_lower_copy(last_name.substr(0,\
    \ 4)) << random_int;\n  return 0;\n}\n```\n\n> **注意：** 请注意 `substr()` 函数是如何嵌套在\
    \ `to_lower_copy()` 函数中的。内层（嵌套）函数的结果被用作外层函数的参数。大多数程序员喜欢遵循这种写法，因为它有助于节省大量代码行。当然，如果嵌套太多函数，就没有人能理解你的代码了。最多四层的嵌套是完全可以接受的。\n\
    \n## 练习 14.4-3 *创建随机单词*\n\n编写一个 C++ 程序，显示一个由五个字母组成的随机单词。\n\n### 解决方案\n\n要创建随机单词，需要一个包含英文字母表全部\
    \ 26 个字母的字符串。然后可以使用 `rand()` 函数在位置 0 到 25 之间随机选择一个字母。\n\n该算法的 C++ 程序如下所示。\n\n\
    ```cpp\nproject_14_4_3\n\n#include <iostream>\n#include <ctime>\n#include <cstdlib>\n\
    using namespace std;\nint main() {\n    string alphabet;\n\n    srand(time(NULL));\n\
    \n    alphabet = \"abcdefghijklmnopqrstuvwxyz\";\n\n    cout << alphabet.at(rand()\
    \ % 26) <<\n            alphabet.at(rand() % 26) <<\n            alphabet.at(rand()\
    \ % 26) <<\n            alphabet.at(rand() % 26) <<\n            alphabet.at(rand()\
    \ % 26);\n\n    return 0;\n}\n```\n\n## 14.5 复习题：判断题\n\n对以下每个陈述选择正确或错误。\n\n- 1.\
    \ 字符串是你可以使用键盘输入的任何内容。\n- 2. 字符串必须括在圆括号中。\n- 3. 短语“Hi there!”包含 8 个字符。\n- 4. 在短语“Hi\
    \ there!”中，字母“t”位于位置 3。\n- 5. 语句 `y = a.at(1)` 将变量 a 中所含字符串的第二个字母赋给变量 y。\n- 6.\
    \ 语句 `y = a.at(-1);` 是有效语句。\n- 7. 修剪是从字符串开头或末尾移除空白字符的过程。\n- 8. 语句 `y = trim_copy(\"\
    Hello             Aphrodite\")` 将值 `\"HelloAphrodite\"` 赋给变量 y。\n- 9. 语句 `cout\
    \ << replace_all_copy(\"Hi there!\", \"Hi\", \"Hello\")` 显示消息 `\"Hello there!\"\
    `。\n- 10. 以下代码片段 `a = \"Hi there!\"; index = a.find(\"the\");` 将值 4 赋给变量 index。\n\
    - 11. 语句 `cout << to_upper_copy(\"hello there!\")` 显示消息 `\"Hello There!\"`。\n\
    - 12. 以下代码片段 `a = \"Hello there!\"; cout << a.substr(0);` 显示消息 `\"Hello there!\"\
    `。\n- 13. 语句 `cout << a.substr(0, a.length())` 显示变量 a 的某些字母。\n- 14. 语句 `cout <<\
    \ a.substr(a.length() - 1, 1)` 等价于语句 `cout << a.at(a.length() - 1)`。\n- 15. 以下代码片段\
    \ `y = \"hello there!\"; cout << to_upper_copy(y).substr(0, 5);` 显示单词 `\"HELLO\"\
    `。\n- 16. 以下代码片段 `y = \"HELLO THERE!\"; cout << to_lower_copy(y);` 显示消息“Hello\
    \ there!”。\n- 17. 语句 `a.substr(0, 1)` 等价于语句 `a.at(0)`。\n\n## 14.6 复习题：多项选择\n\n\
    为以下每个陈述选择正确答案。\n\n- 1. 以下哪一项**不是**字符串？\n  - a. “Hello there!”\n  - b. “13”\n \
    \ - c. “13.5”\n  - d. 以上所有都是字符串。\n\n- 2. 字符串“Hello Zeus!”中的空格字符位于哪个位置？\n  - a.\
    \ 6\n  - b. 5\n  - c. 空格不是字符。\n  - d. 以上都不是\n\n- 3. 语句 `cout << a.substr(a.length()\
    \ - 1, 1)` 显示\n  - a. 变量 a 的最后一个字符。\n  - b. 变量 a 的倒数第二个字符。\n  - c. 该语句无效。\n\n\
    - 4. 语句 `trim_copy(replace_all_copy(replace_all_copy(a,\"a\",\"b\"),\"w\",\"y\"\
    ))` 等价于语句\n  - a. `replace_all_copy(replace_all_copy(trim_copy(a),\"a\",\"b\"\
    ),\"w\",\"y\")`\n  - b. `replace_all_copy(trim_copy(replace_all_copy(a,\"w\",\"\
    y\")),\"a\",\"b\")`\n  - c. `replace_all_copy(replace_all_copy(trim_copy(a),\"\
    w\",\"y\"),\"a\",\"b\")`\n  - d. 以上所有\n\n- 5. 语句 `replace_all_copy(a, \" \", \"\
    \")`\n  - a. 在变量 a 中的每个字母之间添加一个空格。\n  - b. 从变量 a 中移除所有空格字符。\n  - c. 清空变量 a。\n\n\
    - 6. 语句 `replace_all_copy(\"  Hello  \", \" \", \"\")` 等价于语句\n  - a. `replace_all_copy(\"\
    \  Hello  \", \"\", \" \")`.\n  - b. `trim_copy(\"  Hello  \")`.\n\n## 14.7 复习练习\n\
    \n完成以下练习。\n\n- 1. 编写一个 C++ 程序，提示用户输入其名字、中间名、姓氏以及偏好的称谓（先生、夫人、女士、博士等），并按以下所有格式显示这些信息。\n\
    \n   *称谓 名字 中间名 姓氏*\n\n   *名字 中间名 姓氏*\n\n   *姓氏，名字*\n\n   *姓氏，名字 中间名*\n\n   *姓氏，名字\
    \ 中间名，称谓*\n\n   *名字 姓氏*\n\n   例如，假设用户输入以下内容：\n\n   名字：Aphrodite\n\n   中间名：Maria\n\
    \n   姓氏：Boura\n\n   称谓：Ms.\n\n   程序应按以下所有格式显示用户姓名：\n\n   Ms. Aphrodite Maria Boura\n\
    \n   Aphrodite Maria Boura\n\n   Boura, Aphrodite\n\n   Boura, Aphrodite Maria\n\
    \n   Boura, Aphrodite Maria, Ms.\n\n   Aphrodite Boura\n\n- 2. 编写一个 C++ 程序，创建并显示一个由五个字母组成的随机单词。第一个字母必须是大写字母。\n\
    \n- 3. 编写一个 C++ 程序，提示用户输入其姓名，然后创建一个秘密密码，该密码由从其姓名中随机选取的三个字母（小写）和一个随机四位数组成。例如，如果用户输入“Vassilis\
    \ Bouras”，秘密密码可能是“sar1359”、“vbs7281”或“bor1459”之一。\n\n## “顺序控制结构”中的复习题\n\n回答以下问题。\n\
    \n- 1. 什么是顺序控制结构？\n- 2. 顺序控制结构可以执行哪些操作？\n- 3. 在计算机科学中，“类型转换”这个术语是什么意思？\n- 4. 举例说明如何使用整数除法的商和余数。\n\
    - 5. 什么是函数？\n- 6. “嵌套函数”这个术语是什么意思？\n\n"
