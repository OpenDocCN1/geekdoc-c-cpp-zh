    +   - **Finiteness:** For any input, the algorithm must terminate after a finite
    number of steps.

    +   - **Definiteness:** All steps of the algorithm must be precisely defined.

    +   - **Effectiveness:** It must be possible to perform each step of the algorithm
    correctly and in a finite amount of time. That is, its steps must be basic enough
    so that, for example, someone using a pencil and a paper could carry them out
    exactly, and in a finite amount of time. It is not enough that each step is definite
    (or precisely defined), but it must also be feasible.


    # 4.4 Okay About Algorithms. But What is a Computer Program Anyway?


    A computer program is nothing more than an algorithm that is written in a language
    that computers can understand, like C++, Java, C#, or Visual Basic.


    A computer program cannot actually *make* you a cup of tea or cook your dinner,
    although an algorithm can guide you through the steps to do it yourself. However,
    programs can (for example) be used to calculate the average value of a set of
    numbers, or to find the maximum value among them. Artificial intelligence programs
    can even play chess or solve logic puzzles.


    # 4.5 The Party of Three!


    There are always three parties involved in an algorithm—the one that writes the
    algorithm, the one that executes it, and the one that uses or enjoys it.


    Let’s take an algorithm for preparing a meal, for example. Someone writes the
    algorithm (the author of the recipe book), someone executes it (probably your
    mother, who prepared the meal following the steps from the recipe book), and someone
    uses it (probably you, who enjoys the meal).


    Now consider a real computer program. Let’s take a video game, for example. Someone
    writes the algorithm in a computer language (the programmer), someone or something
    executes it (usually a laptop or a computer), and someone else uses it or plays
    with it (the user).


    Be careful, because sometimes the terms “programmer” and “user” can be confusing.
    When you *write* a computer program, for that period of time you are “the programmer.”
    However, when you *use* your own program, you are “the user.”


    # 4.6 The Three Main Stages Involved in Creating an Algorithm


    Three main stages are involved in creating an algorithm: data input, data processing,
    and results output. The order is specific and cannot be changed.


    Consider a computer program that finds the average value of three numbers. First,
    the program must prompt the user to enter the numbers (data input). Next, the
    program calculates the average value of the numbers (data processing). Finally,
    the program displays the result on the computer’s screen (results output).'
