    \ `data2` 保持为空。\n  - b. 让用户输入一个值并将其赋给变量 `data1 data2`。\n  - c. 让用户输入两个值并将它们分别赋给变量\
    \ `data1` 和 `data2`。\n  - d. 以上都不是\n\n## 第 7 章\n\n## 运算符\n\n### 7.1 赋值运算符\n\n\
    C++ 中最常用的运算符是赋值运算符（=）。例如，下面的 C++ 语句\n\n```cpp\nx = 5;\n```\n\n将值 5 赋给变量 x。\n\n\
    正如你在第 5 章读到的，这相当于流程图中使用的左箭头。\n\n![](img/7b41666e32fdead550ef74cdd9f6ead0_70_0.png)\n\
    \n流程图中使用的左箭头可能比赋值运算符（=）符号更方便、更清晰，因为它以更图形化的方式表明右侧的值或表达式的结果被赋给左侧的变量。\n\n注意！(=) 符号并不等同于数学中使用的符号。在数学中，表达式\
    \ x = 5 读作“x 等于 5”。然而，在 C++ 中，表达式 x = 5 读作“将值 5 赋给 x”或“令 x 等于 5”。它们看起来相同，但作用不同！\n\
    \n在数学中，下面两行是等价的：\n\n```\nx = y + z\ny + z = x\n```\n\n第一行可以读作“x 等于 y 与 z 的和”，第二行读作“y\
    \ 与 z 的和等于 x”。\n\n另一方面，在 C++ 中，下面两条语句绝对**不**等价。事实上，第二条被认为是错误的！\n\n```\nx = y +\
    \ z;\ny + z = x;\n```\n\n第一条语句似乎相当正确。它可以读作“令 x 等于 y 与 z 的和”或“将 y 与 z 的和赋给 x”。\n\
    \n但第二条呢？想一想！是否可能将 x 的值赋给 y + z？答案显然是一个大大的“不！”\n\n> **_记住！_** 在 C++ 中，(=) 符号左侧的变量表示主存（RAM）中一个可以存储值的区域。因此，左侧必须只存在一个变量！然而，右侧可以是一个数字、一个变量、一个字符串，甚至是一个复杂的数学表达式。\n\
    \n在表 7-1 中，你可以找到一些赋值示例。\n\n**表 7-1** 赋值示例\n\n| 赋值 | 描述 |\n|---|---|\n| `a = 9`\
    \ | 将值 9 赋给变量 `a`。 |\n| `b = c` | 将变量 `c` 的内容赋给变量 `b`。 |\n| `d = \"Hello Zeus\"\
    ` | 将字符串 Hello Zeus 赋给变量 `d`。 |\n| `d = a + b` | 计算变量 `a` 和 `b` 的内容之和，并将结果赋给变量\
    \ `d`。 |\n| `b = a + 1` | 计算变量 `a` 的内容与 1 之和，并将结果赋给变量 `b`。请注意，变量 `a` 的内容不会改变。\
    \ |\n| `a = a + 1` | 计算变量 `a` 的内容与 1 之和，并将结果赋回变量 `a`。换句话说，将变量 `a` 增加一。 |\n\n对最后一项感到困惑吗？你现在是不是在想你的数学老师？如果你在黑板上写下\
    \ `a = a + 1`，他/她会说什么？你自己能想出一个等于自身加一的数吗？你疯了吗？这意味着 5 等于 6，10 等于 11！\n\n显然，在计算机科学中情况不同。语句\
    \ `a = a + 1` 是完全可以接受的！它指示 CPU 从主存（RAM）中取出变量 `a` 的值，将该值加一，并将结果赋回变量 `a`。变量 `a`\
    \ 的旧值被新值替换。\n\n还是不明白？让我们看看 CPU 和主存（RAM）如何相互配合以执行语句 `A ← A + 1`（这与 C++ 中的语句 `a\
    \ = a + 1` 相同）。\n\n假设内存中有一个名为 **A** 的区域，其中包含数字 **13**。\n\n![](img/7b41666e32fdead550ef74cdd9f6ead0_72_0.png)\n\
    \n当程序指示 CPU 执行语句\n\n```\nA ← A + 1\n```\n\n会执行以下过程：\n\n- 数字 13 从 RAM 中名为 **A**\
    \ 的区域传输到 CPU；\n- CPU 计算 13 与 1 的和；并且\n- 结果 14 从 CPU 传输到 RAM 中名为 **A** 的区域，替换现有的数字\
    \ 13。\n\n执行后，RAM 看起来像这样。\n\n![](img/7b41666e32fdead550ef74cdd9f6ead0_72_1.png)\n\
    \n### 7.2 算术运算符\n\n与每一种高级编程语言一样，C++ 支持几乎所有类型的算术运算符。\n\n| 算术运算符 | 描述 |\n|---|---|\n\
    | + | 加法 |\n| - | 减法 |\n| * | 乘法 |\n| / | 除法 |\n| % | 取模（整数除法后的余数） |\n\n前四个运算符很直接，无需进一步解释。\n\
    \n取模运算符（%）返回整数除法的余数，这意味着\n\n```cpp\na = 13 % 3\n```\n\n将值 1 赋给变量 a。\n\n> **注意：**\
    \ 在 C++ 中，取模运算符（%）不能用于浮点数。例如，无法执行 13.4 % 4 这一运算。\n\n> **注意：** 请记住，流程图是表示算法的一种宽松方法。尽管流程图中允许使用取模（%）运算符，但本书改用普遍接受的\
    \ MOD 运算符！例如，C++ 语句 `b = 13 % 3` 在流程图中表示为\n\n![](img/7b41666e32fdead550ef74cdd9f6ead0_73_0.png)\n\
    \n在数学中，如你所知，可以使用圆括号以及花括号和方括号。\n\n$$\ny = \\frac{5}{2}\\left\\{3 + 2\\left[4 +\
    \ 7\\left(7 - \\frac{4}{3}\\right)\\right]\\right\\}\n$$\n\n然而，在 C++ 中没有花括号和方括号这种东西。我们只有圆括号；因此，同一个表达式应使用圆括号而不是花括号或方括号来书写。\n\
    \n```cpp\ny = 5 / 2 * (3 + 2 * (4 + 7 * (7 - 4 / 3)));\n```\n\n另一件在数学中合法但在 C++\
    \ 中不合法的事情是：你可以省略乘号并写成 3x，意思是“3 乘以 x”。然而，在 C++ 中，只要存在乘法运算，就必须始终使用星号。这是新手程序员在用 C++\
    \ 编写数学表达式时最常犯的错误之一。\n\n### 7.3 算术运算符的优先级是什么？\n\n算术运算符遵循与数学中相同的优先级规则，即：先执行乘法和除法，后执行加法和减法。\n\
    \n| 优先级 | 算术运算符 |\n|---|---|\n| 高优先级 ↑ 低优先级 | *, /, %（较高）；+, -（较低） |\n\n当同一个表达式中同时存在乘法和除法时，由于两者优先级相同，它们从左到右执行（与你阅读的方式相同），这意味着表达式\n\
    \n```cpp\ny = 6 / 3 * 2\n```\n\n等价于 $y = \\frac{6}{3} \\cdot 2$，并将值 4 赋给变量 $y$（除法先于乘法执行）。\n\
    \n然而，如果你希望乘法先于除法执行，可以使用圆括号改变优先级，即：\n\n```cpp\ny = 6 / (3 * 2)\n```\n\n这等价于 $y\
    \ = \\frac{6}{3 \\cdot 2}$\n\n> **注意：** C++ 程序可以使用计算机的文本编辑器应用程序编写，但请记住，不可能以 $\\\
    frac{6}{3}$ 或 $\\frac{4x+5}{6}$ 的形式书写分数。别想了！文本编辑器中没有公式编辑器！所有分数都必须写在一行中。例如，$\\\
    frac{6}{3}$ 应写成 6/3，$\\frac{4x+5}{6}$ 应写成 (4*x+5)/6。\n\n运算顺序可以总结如下：\n\n- 1. 首先执行任何括在圆括号中的运算。\n\
    - 2. 接下来，从左到右执行任何乘法和除法运算。\n- 3. 最后，从左到右执行任何加法和减法运算。\n\n因此，在语句 $y = (20 + 3) +\
    \ 12 + 8 / 4 * 3$; 中\n\n运算按如下方式执行：\n\n- 1. 20 与 3 相加，得到结果 23。\n- 2. 8 除以 4，得到结果\
    \ 2。然后这个结果乘以 3，得到结果 6。\n- 3. 23 与 12 相加，得到结果 35。然后这个结果与 6 相加，得到最终结果 41。\n\n接下来以更图形化的方式展示同一运算顺序。\n"
