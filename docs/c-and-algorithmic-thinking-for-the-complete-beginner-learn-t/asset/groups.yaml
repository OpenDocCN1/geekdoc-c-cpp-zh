    \    minutes = (int)(r / 60);\n    seconds = r % 60;\n\n    cout << days << \"\
    \ days \" << hours << \" hours \" << endl;\n    cout << minutes << \" minutes\
    \ and \" << seconds << \" seconds\";\n    return 0;\n}\n```\n\n### 练习 13.1-4 —\
