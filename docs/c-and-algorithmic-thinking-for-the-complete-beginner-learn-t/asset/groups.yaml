    ### 阿里斯蒂德斯·S·布拉斯


    阿里斯蒂德斯¹·S·布拉斯出生于 1973 年。在童年早期，他就发现了对计算机编程的热爱。他 12 岁时得到了第一台计算机——一台 Commodore 64，它集成了基于
    ROM 的 BASIC 编程语言版本和 64 KB 的 RAM！！！


    他拥有比雷埃夫斯技术教育学院计算机工程学位，以及色雷斯德谟克利特理工大学电气与计算机工程学位。


    他曾在一家专门从事工业数据流和产品标签的公司担任软件开发人员。他的主要工作是开发数据终端软件应用（最初使用 TALL，后来使用 VB.NET 语言），以及用于在
    Microsoft SQL Server 上收集和存储数据的 PC 软件应用。


    他开发了许多应用，例如仓库管理系统以及面向公司和其他组织的网站。如今，他是一名高中教师。他主要教授计算机网络、互联网/内联网编程工具以及数据库课程。


    他与卢基娅·V·艾纳罗齐杜结婚，育有两个孩子。


    ### 卢基娅·V·艾纳罗齐杜


    卢基娅·V·艾纳罗齐杜出生于 1975 年。她 13 岁时得到了第一台计算机——一台 Amstrad CPC6128，配有 128 KB 的 RAM 和内置
    3 英寸软盘驱动器！！！


    她拥有比雷埃夫斯技术教育学院计算机工程学位，以及色雷斯德谟克利特理工大学电气与计算机工程学位。


    她曾在一家从事水果和蔬菜包装的公司担任数据物流部门的主管。如今，她是一名高中教师。她主要教授计算机网络、计算机编程和数字设计课程。


    她与阿里斯蒂德斯·S·布拉斯结婚，育有两个孩子。


    ¹ 阿里斯蒂德斯（公元前 530 年—公元前 468 年）是古雅典政治家和将军。古代历史学家希罗多德称他为“雅典最优秀、最可敬的人”。他行事如此公正，以致常被称为“公正的阿里斯蒂德斯”。他活跃于雅典古典时期的早期阶段，并帮助雅典人在萨拉米斯和普拉蒂亚战役中击败波斯人。


