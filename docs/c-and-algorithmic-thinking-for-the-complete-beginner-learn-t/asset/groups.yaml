  - "[PAGE 105]\n\n# Debugging logic errors by adding breakpoints\n\nDebugging step\
    \ by step has a big disadvantage. You have to click on the “Step Over” toolbar\
    \ icon again and again until you reach the position where the error might be.\
    \ Can you imagine yourself doing this in a large program?\n\nFor large programs\
    \ there is another approach. If you suspect that the error is somewhere at the\
    \ end of the program there is no need to debug all of it right from the beginning.\
    \ You can add a marker (called a “breakpoint”) where you think that the error\
    \ might be, execute the program and when flow of execution reaches that breakpoint,\
    \ the flow of execution will pause automatically. You can then take a closer look\
    \ at the current values of the variables at the position where the program was\
    \ paused.\n\n> **Notice:** When the program pauses, you have two options for resuming\
    \ the execution: you can add a second breakpoint somewhere below in the program,\
    \ click on the “Continue” toolbar icon, and allow the program to continue execution\
    \ until that new breakpoint; or, you can just use the “Step Over” toolbar icon\
    \ and execute the program step by step thereafter.\n\nThe next C++ program prompts\
    \ the user to enter two values and calculates their average value.\n\nHowever,\
    \ the program contains a logic error. When the user enters the values 10 and 12,\
    \ the value 16, instead of 11, is displayed.\n\n```\n```cpp\n// project_9_4b\n\
    #include <iostream>\nusing namespace std;\nint main() {\n    double a, b, average;\n\
    \n    cout << \"Enter 1st value: \";\n    cin >> a;\n    cout << \"Enter 2nd value:\
    \ \";\n    cin >> b;\n    average = a + b / 2;\n    cout << \"The average value\
    \ is: \" << average;\n    return 0;\n}\n```\n```\n\nYou suspect that the problem\
    \ is somewhere at the end of the program. However, you do not want to debug the\
    \ entire program, but just the portion in which the error might be. So, let’s\
    \ try to add a breakpoint at the `average = a + b / 2` statement (see **Figure\
    \ 9-9**). There are two ways to do this: you can click in the left gray margin\
    \ on the corresponding line number, or you can place the cursor at the line of\
    \ interest and hit the CTRL+F8 key combination."
