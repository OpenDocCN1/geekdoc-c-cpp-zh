  mdcn: "\n## 第 9 章\n\n### 9.1 创建新的 C++ 项目\n\n到目前为止，你已经学习了关于 C++ 程序的一些非常好的基础知识。现在该学习如何将程序输入计算机、执行它们、查看它们如何运行，以及查看它们如何显示结果了。\n\
    \n你必须做的第一件事是创建一个新的 C++ 项目。NetBeans IDE 提供了一个向导来帮助你完成这件事。启动 NetBeans IDE，然后从其主菜单中选择“文件\
    \ > 新建项目...”，如图 9–1 所示。\n\n![](img/7b41666e32fdead550ef74cdd9f6ead0_93_0.png)\n\
    \n**图 9–1** 从 NetBeans IDE 启动新的 C++ 项目\n\n“新建项目”向导将出现，并引导你完成后续步骤。\n\n- 1. 在向导的“新建项目”屏幕中，在“选择项目”下，选择“C++\
    \ 应用程序”，如图 9–2 所示。然后，单击“下一步”按钮。\n\n  ![](img/7b41666e32fdead550ef74cdd9f6ead0_94_0.png)\n\
    \n  **图 9–2** 在 Projects 下选择 C++ 应用程序\n\n- 2. 你将看到向导的“新建 C++ 应用程序”屏幕。在“名称和位置”下，在“项目名称”字段中，输入“testingProject”，如图\
    \ 9–3 所示。保持所有其他字段不变。然后，单击“下一步”按钮。\n\n  ![](img/7b41666e32fdead550ef74cdd9f6ead0_94_1.png)\n\
    \n  **图 9–3** 选择新 C++ 项目的名称和位置\n\n- 3. 单击“完成”按钮。\n\n项目即被创建并在你的 NetBeans IDE 中打开。你应该会看到以下组件（见图\
    \ 9–4）：\n\n- Projects 窗口，其中包含项目组件的树视图，包括源文件、你的代码可能依赖的库等。找到并双击 testingProject >\
    \ Source Files > main.cpp 文件。\n- 带有你刚打开的名为“main.cpp”的文件的 Source Editor 窗口。在此文件中，你可以编写\
    \ C++ 代码。当然，单个源文件可以包含许多这样的 C++ 代码。\n\n![](img/7b41666e32fdead550ef74cdd9f6ead0_95_0.png)\n\
    \n**图 9–4** 在 NetBeans IDE 中查看“Projects”和“Source Editor”窗口\n\n### 9.2 编写并执行 C++\
    \ 程序\n\n你刚刚看到了如何创建新的 C++ 项目。现在让我们编写下面这个（令人恐惧、相当吓人的！）C++ 程序，并尝试执行它。\n\n```cpp\n\
    #include <iostream>\nusing namespace std;\nint main() {\n    cout << \"Hello World\"\
    ;\n    return 0;\n}\n```\n\n在“main.cpp”窗口中，删除所有内容，然后通过按键盘上的“#”键，只输入 `#include`\
    \ 语句的第一个字符。会出现一个弹出窗口，如图 9–5 所示。此窗口包含所有可用的 C++ 语句，以及其他以字符“#”开头的项。\n\n![](img/7b41666e32fdead550ef74cdd9f6ead0_96_0.png)\n\
    \n**图 9–5** Source Editor 窗口中的弹出屏幕\n\n你可以使用键盘上的上下方向键高亮选中一项。\n\n输入 `#include` 语句的第二个字符“i”。现在选项变少了，如**图\
    \ 9–6**所示。\n\n![](img/7b41666e32fdead550ef74cdd9f6ead0_98_0.png)\n\n**图 9–8**\
    \ 在 Output 窗口中查看所执行程序的结果\n\n恭喜！你刚刚编写并执行了你的第一个 C++ 程序！现在让我们编写另一个 C++ 程序，它会提示用户输入他或她的名字。在\
    \ NetBeans IDE 中输入以下 C++ 语句，然后按 F6 执行该项目。\n\n```cpp\n#include <iostream>\nusing\
    \ namespace std;\n\nint main() {\n    string name;\n\n    cout << \"Enter your\
    \ name: \";\n    cin >> name;\n    cout << \"Hello \" << name << endl;\n    cout\
    \ << \"How do you do?\" << endl;\n\n    return 0;\n}\n```\n\n> **记住！** 你可以从主菜单中选择“运行\
    \ > 运行项目”来执行项目，或者按 F6 键。\n\n执行程序后，消息“Enter your name”会显示在“Output”窗口中。程序会等待你输入名字，如图\
    \ 9–9 所示。\n\n![](img/7b41666e32fdead550ef74cdd9f6ead0_99_0.png)\n\n**图 9–9** 在\
    \ Output 窗口中查看提示\n\n输入你的名字并按“Enter ↵”键。完成后，你的计算机会继续执行其余语句。执行结束后，最终输出如**图 9–10**所示。\n\
    \n![](img/7b41666e32fdead550ef74cdd9f6ead0_99_1.png)\n\n**图 9–10** 在 Output 窗口中响应提示\n\
    \n### 9.3 “调试”是什么意思\n\n调试是查找并减少计算机程序中的缺陷（bug）数量，以使其按预期运行的过程。\n\n关于“调试”一词的起源有一个传说。1940\
    \ 年，当 Grace Hopper¹ 在哈佛大学一台 Mark II 计算机上工作时，她的同事发现一只虫子（飞蛾）卡在一个继电器（一种电动开关）中。这只虫子阻碍了\
    \ Mark II 计算机的正常运行。因此，当她的同事试图移除这只虫子时，Grace Hopper 说他们正在“调试”系统！\n\n¹ Grace Murray\
    \ Hopper（1906–1992）是美国计算机科学家和美国海军少将。她是哈佛 Mark I 计算机最早的程序员之一，并为一种称为 A-0 的计算机编程语言开发了第一个编译器，后来又开发了第二个编译器，称为\
    \ B-0 或 FLOW-MATIC。\n\n### 9.4 使用 NetBeans IDE 调试 C++ 程序\n\n如你所知，当有人用高级语言编写代码时，他或她可能犯两类错误——语法错误和逻辑错误。NetBeans\
    \ IDE 提供了所有必要的工具来帮助你调试程序并找出错误。\n\n#### 调试语法错误\n\n幸运的是，NetBeans IDE 会在你输入时（或当你尝试运行项目时）检测语法错误，并用红色波浪线在其下划线，如图\
    \ 9–11 所示。\n\n![](img/7b41666e32fdead550ef74cdd9f6ead0_100_0.png)\n\n**图 9–11**\
    \ 在 NetBeans IDE 中，语法错误用红色波浪线加下划线\n\n你只需更正相应错误，红线就会立即消失。但是，如果你不确定代码哪里有问题，只需将鼠标光标放在红色感叹号上。NetBeans\
    \ IDE 会通过显示一个弹出窗口来尝试帮助你，其中包含对该错误的简要说明，如图 9–12 所示。\n\n![](img/7b41666e32fdead550ef74cdd9f6ead0_101_0.png)\n\
    \n**图 9–12** NetBeans IDE 显示语法错误的说明\n\n#### 通过逐步执行程序来调试逻辑错误\n\n与语法错误相比，逻辑错误更难发现。由于\
    \ NetBeans IDE 无法发现并给逻辑错误加下划线，你只能靠自己了！例如，让我们看看下面的 C++ 程序。它会提示用户输入两个数字，并计算和显示它们的和。然而，它包含一个逻辑错误！\n\
    \n```cpp\n// project_9_4a\n#include <iostream>\nusing namespace std;\nint main()\
    \ {\n  double s, a, b, S;\n\n  s = 0;\n  cout << \"Enter 1st value: \";\n  cin\
    \ >> a;\n  cout << \"Enter 2nd value: \";\n  cin >> b;\n  S = a + b;\n  cout <<\
    \ \"The sum is: \" << s;\n  return 0;\n}\n```\n\n如果你将此程序输入 NetBeans IDE，你会注意到甚至没有一个感叹号指示任何错误。然而，如果你运行程序并输入两个值\
    \ 5 和 2，你可以亲眼看到，尽管 5 和 2 的和是 7，NetBeans IDE 却坚持认为是零，如**图 9–13**所示。\n\n![](img/7b41666e32fdead550ef74cdd9f6ead0_102_0.png)\n\
    \n**图 9–13** 在 Output 窗口中查看逻辑错误的结果\n\n到底怎么回事？当然，对于专家程序员来说，更正这个错误是小菜一碟。但对你这个新手来说，即使你很努力，也找不到任何问题。那么，错误在哪里？\n\
    \n有时人眼会疲劳到看不见显而易见的东西。所以，让我们试试用点魔法！让我们尝试使用调试器逐步执行程序。这让你有机会观察执行流程，并更仔细地查看每一步中变量的当前值。\n\
    \n将光标放在语句 `s = 0` 所在的行，并按 CTRL+F8 组合键。灰色边距中会出现一个粉色矩形，相应行会以粉色背景高亮显示，如图 9–14 所示。\n"
