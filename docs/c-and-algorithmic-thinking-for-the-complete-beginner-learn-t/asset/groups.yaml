    \ and other pieces of information, including:\n\n- who wrote the program\n- when\
    \ the program was created or last modified\n- what the program does\n- how the\
    \ program works\n\nHowever, you should not over-comment. There is no need to explain\
    \ every line of your program. Add comments only when a specific portion of your\
    \ program is hard to follow.\n\nIn C++, you can add comments using one of the\
    \ following methods:\n\n- double slashes `//......`\n- slash-asterisk, asterisk-slash\
    \ delimiters `/* ...... */`\n\nThe following program demonstrates how to use both\
    \ types of commenting. Usually double slashes ( `//` ) are used for commenting\
    \ one single line, whereas the slash-asterisk, asterisk-slash delimiters ( `/*\
    \ ...... */` ) are used for commenting multiple lines at once.\n\n```cpp\n#include\
    \ <iostream>\nusing namespace std;\n/*\n   Created By Bouras Aristides\n   Date\
    \ created: 12/25/2003\n   Date modified: 04/03/2008\n   Description: This program\
    \ displays some messages on the screen\n*/\n\nint main() {\n\n    cout << \"Hello\
    \ Zeus!\" << endl;    //display a message on the screen\n\n    //display a second\
    \ message on the screen\n    cout << \"Hello Hera!\" << endl;\n\n    /* display\
    \ a third message on screen */  cout << \"Γεια σας\" << endl;\n\n    //This is\
    \ a comment      cout << \"The End\";\n\n    return 0;\n}\n```\n\nAs you can see\
    \ in the preceding program, you can add comments above a statement or at the end\
    \ of it, but not in front of it. Look at the last statement, which is supposed\
    \ to display the message “The End.” This statement is never executed because it\
    \ is considered part of the comment.\n\n> **Notice:** If you add comments using\
    \ the delimiters `/* ...... */` in front of a statement, the statement is still\
    \ executed. In the preceding example, the Greek message “Γεια σας”, even though\
    \ it is written next to some comments, is still executed. It is advisable, however,\
    \ not to follow this writing style because it can make your code difficult to\
    \ read.\n\n## 4.15　User-Friendly Programs\n\nWhat is a “user-friendly” program?\
    \ It's the one that a user considers a friend instead of an enemy, the one that\
    \ can be used easily by a novice user.\n\nIf you want to write user-friendly programs\
    \ you have to put yourself in the shoes of the user. Users want the computer to\
    \ do their job their way, with a minimum of\n"
  mdcn: "\n## 4.9　语句和命令有什么区别？\n\n互联网上有很多讨论，争论语句和命令之间到底有没有区别。有些人喜欢使用“语句”这个术语，另一些人则喜欢使用“命令”这个术语。对于新手程序员来说，两者没有区别；它们都是给计算机的指令！\n\
    \n## 4.10　什么是结构化编程？\n\n结构化编程是一种使用模块化和结构化设计的软件开发方法。这意味着大型程序被分解成较小的模块，而每个单独的模块都使用结构化代码，也就是说，语句以特定方式组织，从而最大限度地减少错误和误解。顾名思义，结构化编程是使用结构化编程语言完成的，而\
    \ C++ 就是这样一种语言。\n\n结构化编程概念由 Corrado Böhm¹ 和 Giuseppe Jacopini² 于 1966 年正式提出。他们使用顺序、决策和迭代展示了理论计算机程序设计。\n\
    \n## 4.11　三种基本控制结构\n\n结构化编程中有三种基本控制结构。\n\n- **顺序控制结构：** 这指的是逐行执行，其中语句按它们在程序中出现的相同顺序依次执行。例如，它们可能执行一系列读或写操作、算术运算或变量赋值。\n\
    - **决策控制结构：** 根据条件为真还是为假，决策控制结构可以跳过整个语句块的执行，甚至执行一个语句块而不是另一个语句块。\n- **循环控制结构：**\
    \ 这是一种允许一个语句块多次执行，直到满足指定条件的控制结构。\n\n如果你还不太理解这三种控制结构的深层含义，不用担心，因为接下来的章节会对它们进行非常透彻的分析。耐心是一种美德。现在你只需要等待！\n\
    \n¹ Corrado Böhm（1923— ）是一位计算机科学家，尤其以其对结构化编程理论的贡献以及对函数式编程语言的实现而闻名。\n\n² Giuseppe\
    \ Jacopini（1936—2001）是一位计算机科学家。他最具影响力的贡献是关于结构化编程的定理，该定理于 1966 年与 Corrado Böhm\
    \ 共同发表，标题为“流图、图灵机以及仅含两条形成规则的语言”。\n\n(Böhm, C., 和 Jacopini, G., “流图、图灵机以及仅含两条形成规则的语言，”\
    \ Communications of the ACM 9(5), (1966年5月), 366–371.)\n\n### 练习 4.1-1 — *使用流程图理解控制结构*\n\
    \n*使用流程图，为每种控制结构给出一个示例。*\n\n### 解决方案\n\n### 顺序控制结构示例\n\n![](img/7b41666e32fdead550ef74cdd9f6ead0_43_0.png)\n\
    \n### 决策控制结构示例\n\n![](img/7b41666e32fdead550ef74cdd9f6ead0_43_1.png)\n\n### 循环控制结构示例\n\
    \n![](img/7b41666e32fdead550ef74cdd9f6ead0_44_0.png)\n\n## 4.12　你的第一个 C++ 程序\n\
    \n将流程图转换为 C++ 之类的计算机语言，就会得到一个 C++ 程序。C++ 程序不过是一个包含 C++ 语句的文本文件。C++ 程序甚至可以在你的文本编辑器应用程序中编写！不过请记住，使用\
    \ NetBeans IDE 编写 C++ 程序是更好的解决方案，因为它包含的所有功能可以让你的工作更轻松。\n\nC++ 程序必须始终包含一个 `main`\
    \ 函数，如下所示。\n\n```cpp\n#include <iostream>\nusing namespace std;\n\nint main()\
    \ {\n\n  // C++ code goes here\n\n  return 0;\n}\n```\n\nC++ 源代码以默认的 .cpp 文件扩展名保存在硬盘上。\n\
    \n下面是一个非常简单的 C++ 程序，它只在屏幕上显示三条消息。\n\n```cpp\n#include <iostream>\nusing namespace\
    \ std;\n\nint main() {\n\n  cout << \"Hello World!\" << endl;\n  cout << \"Hallo\
    \ Welt!\" << endl;\n  cout << \"The End\";\n  return 0;\n}\n```\n\n> **注意：** *请注意，C++\
    \ 要求所有语句都以分号结尾。*\n\n## 4.13　语法错误和逻辑错误有什么区别？\n\n当程序员用高级语言编写代码时，他们可能会犯两类错误：语法错误和逻辑错误。\n\
    \n语法错误是诸如关键字拼写错误、缺少标点字符、缺少括号或缺少右圆括号之类的错误。幸运的是，NetBeans IDE 会在你键入时检测这些错误，并在出错行前面显示一个红色感叹号。如果你尝试执行包含语法错误的\
    \ C++ 程序，屏幕上会出现错误消息，程序不会被执行。你必须更正所有错误，然后再次尝试执行该程序。\n\n逻辑错误是那些阻止程序执行你期望它执行的操作的错误。对于逻辑错误，你根本不会收到任何警告。你的代码可能可以编译并运行，但结果不是预期的结果。逻辑错误是最难检测的错误。你必须彻底重新检查程序，以确定错误所在。例如，考虑一个\
    \ C++ 程序，它提示用户输入三个数字，然后计算并显示它们的平均值。然而，程序员犯了一个排版错误；他或她的某条语句将三个数字的和除以 5，而不是按应该的那样除以\
    \ 3。当然，这个 C++ 程序照常执行，没有任何错误消息，提示用户输入三个数字并显示一个结果，但显然不是正确的结果！必须由程序员来找出并更正写错的 C++\
    \ 语句，而不是计算机或编译器！\n\n## 4.14　为代码添加注释\n\n当你编写一个小而简单的程序时，任何人都可以通过逐行阅读来理解它的工作方式。然而，长程序很难理解，有时甚至编写它们的人自己也不容易理解。注释是可以包含在程序中的额外信息，使程序更易于阅读和理解。你可以添加解释和其他信息，包括：\n\
    \n- 谁编写了程序\n- 程序何时创建或最后修改\n- 程序做什么\n- 程序如何工作\n\n但是，你不应该过度注释。没有必要解释程序的每一行。仅当程序的某个特定部分难以理解时才添加注释。\n\
    \n在 C++ 中，你可以使用以下方法之一添加注释：\n\n- 双斜杠 `//......`\n- 斜杠-星号、星号-斜杠分隔符 `/* ...... */`\n\
    \n下面的程序演示了如何使用这两种注释方式。通常，双斜杠（ `//` ）用于注释单行，而斜杠-星号、星号-斜杠分隔符（ `/* ...... */` ）用于一次注释多行。\n\
    \n```cpp\n#include <iostream>\nusing namespace std;\n/*\n   Created By Bouras\
    \ Aristides\n   Date created: 12/25/2003\n   Date modified: 04/03/2008\n   Description:\
    \ This program displays some messages on the screen\n*/\n\nint main() {\n\n  \
    \  cout << \"Hello Zeus!\" << endl;    //display a message on the screen\n\n \
    \   //display a second message on the screen\n    cout << \"Hello Hera!\" << endl;\n\
    \n    /* display a third message on screen */  cout << \"Γεια σας\" << endl;\n\
    \n    //This is a comment      cout << \"The End\";\n\n    return 0;\n}\n```\n\
    \n正如你在前面的程序中看到的，你可以在语句上方或语句末尾添加注释，但不能在语句前面添加注释。看看最后一条语句，它本应显示消息“The End”。这条语句永远不会执行，因为它被视为注释的一部分。\n\
    \n> **注意：** 如果你使用分隔符 `/* ...... */` 在语句前面添加注释，该语句仍然会执行。在前面的示例中，希腊语消息“Γεια σας”尽管写在一些注释旁边，仍然会执行。不过，建议不要采用这种写法，因为它会使你的代码难以阅读。\n\
    \n## 4.15　用户友好的程序\n\n什么是“用户友好”的程序？它是用户视为朋友而不是敌人的程序，是新手用户可以轻松使用的程序。\n\n如果你想编写用户友好的程序，就必须设身处地为用户着想。用户希望计算机按照他们的方式完成工作，以最少的\n"
