    \ Chapter 5\n\n## Variables and Constants\n\n### 5.1 What is a Variable?\n\nIn\
    \ computer science, a variable is a location in the computer's main memory (RAM)\
    \ where you can store a value and change it as the program executes. Picture a\
    \ variable as a transparent box in which you can insert and hold one thing at\
    \ a time. Because the box is transparent, you can also examine what it contains.\
    \ Moreover, if you have two or more boxes you can give each box a unique name.\
    \ For example, you could have three boxes, each containing a different number,\
    \ and you could name the boxes `numberA`, `numberB`, and `numberC`.\n\n![](img/7b41666e32fdead550ef74cdd9f6ead0_50_0.png)\n\
    \nThe boxes named `numberA`, `numberB` and `numberC` in the example contain the\
    \ numbers 13, 8, and 4, respectively. Of course, you can examine or even alter\
    \ the contained value of each one of these boxes at any time.\n\nNow, let’s say\
    \ that someone asks you to find the sum of the values of the first two boxes and\
