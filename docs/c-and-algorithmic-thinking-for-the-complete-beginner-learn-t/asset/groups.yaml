    \ + z) / 27`\n\n#### Solution\n\n- i. **Wrong.** Since the multiplication and\
    \ the division are performed before the addition, this is equivalent to \\(x =\
    \ \\frac{1}{10} \\times 27 + z\\).\n- ii. **Wrong.** An asterisk should have been\
    \ used for multiplication.\n- iii. **Wrong.** Since the division is performed\
    \ before the addition, this is equivalent to \\(x = \\frac{27}{10} + z\\).\n-\
    \ iv. **Correct.** This is equivalent to \\(x = \\frac{27}{10+z}\\).\n- v. **Wrong.**\
    \ Inside parentheses, the division is performed before the addition. This is equivalent\
    \ to \\(x = \\left(\\frac{1}{10} + z\\right)27\\).\n- vi. **Wrong.** Parentheses\
    \ are executed first and this is equivalent to \\(x = \\frac{1}{(10+z)\\times\
    \ 27}\\).\n- vii. **Correct.** Division is performed before multiplication (left\
    \ to right). The term \\(\\frac{1}{10+z}\\) is calculated first and then, the\
    \ result is multiplied by 27.\n- viii. **Wrong.** This is equivalent to \\(\\\
    frac{\\frac{1}{10+z}}{27}\\).\n\n#### Exercise 12.1-2 *Writing a Mathematical\
    \ Expression in C++*\n\nWrite a C++ program that calculates the mathematical expression\n\
    \n\\[\ny = 10x - \\frac{10-z}{4}\n\\]\n\n#### Solution\n\nFirst, you must distinguish\
    \ between the data input and the output result. Obviously, the output result is\
