    The result is: \" << y;\n    return 0;\n}\n```\n\n#### Exercise 12.1-3 *Writing\
    \ a Complex Mathematical Expression in C++*\n\nWrite a C++ program that calculates\
    \ the mathematical expression\n\n\\[\ny = \\frac{\\frac{3x^2 + 5x + 2}{7w - \\\
    frac{1}{z}}}{4^{\\frac{3+z}{7}}}\n\\]\n\n#### Solution\n\nOops! Now the expression\
    \ is more complex! In fact, it is much more complex! So, let's take a look at\
    \ a quite different approach.\n\nThe main idea is to break the complex expression\
    \ into smaller, simpler expressions and assign each sub-result to temporary variables.\
    \ In the end, you can build the original expression out of all these temporary\
    \ variables! This approach is presented here.\n\n**project_12_1_3a**\n\n```cpp\n\
    // project_12_1_3a\n#include <iostream>\nusing namespace std;\nint main() {\n\
    \  double denominator, nominator, temp1, temp2, temp3, w, x, y, z;\n\n  cout <<\
    \ \"Enter value for x: \";\n  cin >> x;\n  cout << \"Enter value for w: \";\n\
    \  cin >> w;\n  cout << \"Enter value for z: \";\n  cin >> z;\n\n  temp1 = 3 *\
    \ x * x + 5 * x + 2;\n  temp2 = 7 * w - 1 / z;\n  temp3 = (3 + x) / 7;\n  nominator\
    \ = 5 * temp1 / temp2 - z;\n  denominator = 4 * temp3;\n\n  y = nominator / denominator;\n\
    \n  cout << \"The result is: \" << y;\n  return 0;\n}\n```\n\nYou may say, “Okay,\
    \ but I wasted so many variables and as everybody knows, each variable is a portion\
    \ of main memory. How can I write the original expression in one single line and\
