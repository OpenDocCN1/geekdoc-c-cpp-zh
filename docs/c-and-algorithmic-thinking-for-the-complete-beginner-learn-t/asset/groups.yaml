    ```\n\nand another one with a post-incrementing operator,\n\n```cpp\na = 5;\n\
    a++;            //This is equivalent to a = a + 1\nb = a;\n\ncout << a << endl;\n\
    cout << b << endl;\n```\n\nIn both examples a value of 6 is assigned to variable\
    \ b! So, where is the catch? Are these two examples equivalent? The answer is\
    \ “yes,” but only in these two examples. In other cases the answer will likely\
    \ be “no.” There is a small difference between them.\n\nLet’s spot that difference!\
    \ The rule is that a pre-increment/decrement operator performs the increment/decrement\
    \ operation first and then delivers the new value.\n\n## Exercise 7.6-1 *Concatenating\
    \ Names*\n\n*Write a C++ program that prompts the user to enter his or her first\
    \ and last name (assigned to two different variables) and then joins them together\
    \ in a single string (concatenation).*\n\n### Solution\n\nThe C++ program is shown\
    \ here.\n\n```cpp\n#include <iostream>\nusing namespace std;\nint main() {\n \
    \   string first_name, last_name, full_name;\n\n    cout << \"Enter first name:\
    \ \";\n    cin >> first_name;\n    cout << \"Enter last name: \";\n    cin >>\
    \ last_name;\n\n    full_name = first_name + \" \" + last_name;\n    cout << full_name;\n\
    \    return 0;\n}\n```\n\n> **Notice:** Please note the extra space character\
    \ added between the first and last name\n\n## 7.7 Review Questions: True/False\n\
    \n**Choose true or false** for each of the following statements.\n\n- 1. The statement\
    \ `x = 5` can be read as “Variable x is equal to 5.”\n- 2. The value assignment\
    \ operator assigns the result of an expression to a variable.\n- 3. A string can\
    \ be assigned to a variable only by using the `cin` statement.\n- 4. The statement\
    \ `5 = x` assigns value 5 to variable `y`.\n- 5. On the right side of a value\
    \ assignment operator an arithmetic operator must always exist.\n- 6. On the left\
    \ side of a value assignment operator more than one variable can exist.\n- 7.\
    \ You cannot use the same variable on both sides of a value assignment operator.\n\
    - 8. The statement `a = a + i` decrements variable `a` by one.\n- 9. In C++, the\
    \ word `MOD` is a reserved word.\n- 10. The statement `x = 0 % 5` assigns a value\
    \ of 5 to variable `x`.\n- 11. The operation `5 % 0` is not possible.\n- 12. Division\
    \ and multiplication have the higher precedence among the arithmetic operators.\n\
    - 13. When division and multiplication operators co-exist in an expression, multiplication\
    \ operations are performed before division.\n- 14. The expression `8 / 4 * 2`\
    \ is equal to 1.\n- 15. The expression `4 + 6 / 6 + 4` is equal to 9.\n- 16. The\
    \ expression `a + b + c / 3` calculates the average value of three numbers.\n\
    - 17. The statement `a += 1` is equivalent to `a++`.\n- 18. The statement `a =\
    \ \"true\"` assigns a Boolean value to variable a.\n- 19. The statement `a = 2\
    \ * a` doubles the content of variable a.\n- 20. The statements `a++` and `++a`\
    \ are completely equivalent.\n- 21. The statement `a = a++ + --a;` always assigns\
    \ a value of -1 to variable a.\n- 22. The statement `a = \"George\" + \"Malovich\"\
    ` assigns value GeorgeMalovich to variable a.\n- 23. The following code fragment\
    \ satisfies the property of definiteness.\n\n        int a, b;\n        double\
    \ x;\n        cin >> a;\n        cin >> b;\n        x = a / (b - 7);\n       \
    \ cout << x << endl;\n\n## 7.8 Review Questions: Multiple Choice\n\nSelect the\
    \ correct answer for each of the following statements.\n\n- 1. Which of the following\
    \ C++ statements assigns a value of 10 to variable a?\n  - a. `10 = a;`\n  - b.\
    \ `a <- 10;`\n  - c. `a = 100 / 10;`\n  - d. none of the above\n\n- 2. The statement\
    \ `a = b` can be read as\n  - a. assign the content of variable a to variable\
    \ b.\n  - b. variable b is equal to variable a.\n  - c. assign the content of\
    \ variable b to variable a.\n  - d. none of the above\n\n- 3. The expression `0\
    \ % 10 + 2` is equal to\n  - a. 7.\n  - b. 2.\n  - c. 12.\n  - d. none of the\
    \ above\n\n- 4. Which of the following C++ statements is syntactically correct?\n\
    \  - a. `a = 4 * 2 * y - 8 / (4 * q);`\n  - b. `a = 4 * 2 * y - 8 / (4 * q);`\n\
    \  - c. `a = 4 * 2 * y - 8 / (4 * q);`\n  - d. none of the above\n\n- 5. Which\
    \ of the following C++ statements increments variable a by one and then assigns\
    \ its value to variable b?\n  - a. `b = a + 1;`\n  - b. `b = a++;`\n  - c. `b\
    \ = ++a;`\n  - d. all of the above\n\n- 6. Which of the following C++ statements\
    \ assigns value George Malkovich to variable a?\n  - a. `a = \"George\" + \" \"\
    \ + \"Malkovich\";`\n  - b. `a = \"George\" + \" Malkovich\";`\n  - c. `a = \"\
    George \" + \"Malkovich\";`\n  - d. all of the above\n\n- 7. The following code\
    \ fragment\n\n        x = 2;\n        x++;\n\n  does not satisfy the property\
    \ of\n  - a. finiteness.\n  - b. definiteness.\n  - c. effectiveness.\n  - d.\
    \ none of the above\n\n- 8. The following code fragment\n\n        int a;\n  \
    \      double x;\n\n        cin >> a;\n        x = 1 / a;\n\n  does not satisfy\
    \ the property of\n  - a. finiteness.\n  - b. input.\n  - c. effectiveness.\n\
    \  - d. none of the above\n\n## 7.9 Review Exercises\n\nComplete the following\
    \ exercises.\n\n- 1. Which of the following C++ assignment statements are syntactically\
    \ correct?\n  - i. `a ← a + 1;`\n  - ii. `a += b;`\n  - iii. `a = b = a + b +\
    \ 1;`\n  - iv. `a = a++;`\n  - v. `a = hello;`\n  - vi. `a = 40*;`\n  - vii. `a\
    \ = b * 5;`\n  - viii. `a =+ \"true\";`\n  - ix. `fdadtwstdgfqw = 1;`\n  - x.\
    \ `**a;`\n\n- 2. What is the type of each of the following variables?\n  - i.\
    \ `a = \"false\";`\n  - ii. `w = false;`\n  - iii. `b = \"15 meters\";`\n  - iv.\
    \ `weight = \"40\";`\n  - v. `b = 13.0;`\n  - vi. `b = 13;`\n\n- 3. Match each\
    \ element from the first column with one element from the second column.\n\n|\
    \ Operation | Result |\n|---|---|\n| i. 1 / 2 | a. 100 |\n| ii. 1 / 2 * 2 | b.\
    \ 0.25 |\n| iii. 0 % 10 * 10 | c. 0 |\n| iv. 10 % 2 + 7 | d. 0.5 |\n|  | e. 7\
    \ |\n|  | f. 1 |\n\n- 4. What displays on the screen after executing each of the\
    \ following code fragments?\n  - i.\n\n        a = 5;\n        b = a * a + 1;\n\
    \        cout << b++ << endl;\n  - ii.\n\n        a = 9;\n        b = a / 3 *\
    \ a;\n        cout << ++b << endl;\n\n- 5. What displays on the screen after executing\
    \ each of the following code fragments?\n  - i.\n\n        a = 5;\n        a =\
    \ a++;\n        cout << a << endl;\n  - ii.\n\n        a = 5;\n        a = ++a;\n\
    \        cout << a << endl;\n\n- 6. What is the result of each of the following\
    \ operations?\n  - i. `21 % 5`\n  - ii. `10 % 2`\n  - iii. `11 % 2`\n  - iv. `10\
    \ % 6 % 3`\n  - v. `0 % 3`\n  - vi. `100 / 10 % 3`\n"
  mdcn: "\n\n![](img/7b41666e32fdead550ef74cdd9f6ead0_75_0.png)\n\n## 7.4 复合赋值运算符\n\
    \nC++ 提供了一组特殊运算符，称为复合赋值运算符，它们可以帮助你更快地编写代码。\n\n| 运算符 | 描述 | 示例 | 等价于 |\n|---|---|---|---|\n\
    | `+=` | 加法赋值 | `a += b` | `a = a + b` |\n| `-=` | 减法赋值 | `a -= b` | `a = a -\
    \ b` |\n| `*=` | 乘法赋值 | `a *= b` | `a = a * b` |\n| `/=` | 除法赋值 | `a /= b` | `a\
    \ = a / b` |\n| `%=` | 取模赋值 | `a %= b` | `a = a % b` |\n\n查看“等价于”列，就会清楚：仅使用经典赋值运算符（`=`）也能取得相同结果。那么这里出现的问题是：*为什么存在这些运算符？*\n\
    \n答案很简单：这是为了方便。一旦你开始使用它们，你的生活就会找到不同的意义！\n\n> **注意：** *请记住，流程图是一种表示算法的宽松方法。尽管在流程图中允许使用复合赋值运算符，但本书仅使用“等价于”列中所示的普遍接受的运算符。例如，C++\
    \ 语句 `a += b` 在流程图中表示为*\n\n![](img/7b41666e32fdead550ef74cdd9f6ead0_75_1.png)\n\
    \n## 7.5 自增/自减运算符\n\n在计算机程序中，给一个数加 1 或减 1 都非常常见，因此 C++ 引入了一组特殊运算符来完成这一操作。C++ 支持两种类型的自增和自减运算符：\n\
    \n- 前置自增/自减运算符\n- 后置自增/自减运算符\n\n前置自增/自减运算符放在变量名之前。后置自增/自减运算符放在变量名之后。这四种运算符如下所示。\n\
    \n| 运算符 | 描述 | 示例 | 等价于 |\n|---|---|---|---|\n| 前置自增 | 将变量增加 1 | `++a;` | `a =\
    \ a + 1` |\n| 前置自减 | 将变量减少 1 | `--a;` | `a = a - 1` |\n| 后置自增 | 将变量增加 1 | `a++;`\
    \ | `a = a + 1` |\n| 后置自减 | 将变量减少 1 | `a--;` | `a = a - 1` |\n\n再次查看“等价于”列，就会清楚：仅使用经典赋值运算符（=）也能取得相同结果。然而，使用这些新运算符要精巧且高效得多。开始时你可能会讨厌它们，但随着岁月流逝，你肯定会爱上它们！\n\
    \n让我们看一个使用前置自增运算符的例子，\n\n```cpp\na = 5;\n++a;            //This is equivalent\
    \ to a = a + 1\nb = a;\n\ncout << a << endl;\ncout << b << endl;\n```\n\n再看一个使用后置自增运算符的例子，\n\
    \n```cpp\na = 5;\na++;            //This is equivalent to a = a + 1\nb = a;\n\n\
    cout << a << endl;\ncout << b << endl;\n```\n\n在这两个例子中，值 6 都会被赋给变量 b！那么问题在哪里？这两个例子等价吗？答案是“是”，但仅在这两个例子中如此。在其他情况下，答案很可能是“否”。它们之间有一个细微差别。\n\
    \n让我们找出这个差别！规则是：前置自增/自减运算符先执行自增/自减运算，然后给出新值。\n\n## 练习 7.6-1 *连接姓名*\n\n*编写一个 C++\
    \ 程序，提示用户输入其名字和姓氏（分别赋给两个不同的变量），然后将它们连接成一个字符串（拼接）。*\n\n### 解答\n\nC++ 程序如下所示。\n\n\
    ```cpp\n#include <iostream>\nusing namespace std;\nint main() {\n    string first_name,\
    \ last_name, full_name;\n\n    cout << \"Enter first name: \";\n    cin >> first_name;\n\
    \    cout << \"Enter last name: \";\n    cin >> last_name;\n\n    full_name =\
    \ first_name + \" \" + last_name;\n    cout << full_name;\n    return 0;\n}\n\
    ```\n\n> **注意：** 请注意，名字和姓氏之间添加了一个额外的空格字符\n\n## 7.7 复习题：判断题\n\n**判断正误**：以下每个陈述。\n\
    \n- 1. 语句 `x = 5` 可以读作“变量 x 等于 5。”\n- 2. 值赋值运算符将表达式的结果赋给变量。\n- 3. 只能使用 `cin` 语句将字符串赋给变量。\n\
    - 4. 语句 `5 = x` 将值 5 赋给变量 `y`。\n- 5. 在值赋值运算符的右侧，必须始终存在一个算术运算符。\n- 6. 在值赋值运算符的左侧，可以存在多个变量。\n\
    - 7. 不能在值赋值运算符的两侧使用同一个变量。\n- 8. 语句 `a = a + i` 将变量 `a` 递减 1。\n- 9. 在 C++ 中，单词\
    \ `MOD` 是保留字。\n- 10. 语句 `x = 0 % 5` 将值 5 赋给变量 `x`。\n- 11. 运算 `5 % 0` 无法进行。\n-\
    \ 12. 除法和乘法在算术运算符中具有较高的优先级。\n- 13. 当除法和乘法运算符共存于一个表达式中时，乘法运算先于除法执行。\n- 14. 表达式\
    \ `8 / 4 * 2` 等于 1。\n- 15. 表达式 `4 + 6 / 6 + 4` 等于 9。\n- 16. 表达式 `a + b + c / 3`\
    \ 计算三个数的平均值。\n- 17. 语句 `a += 1` 等价于 `a++`。\n- 18. 语句 `a = \"true\"` 将布尔值赋给变量 a。\n\
    - 19. 语句 `a = 2 * a` 使变量 a 的内容加倍。\n- 20. 语句 `a++` 和 `++a` 完全等价。\n- 21. 语句 `a =\
    \ a++ + --a;` 总是将值 -1 赋给变量 a。\n- 22. 语句 `a = \"George\" + \"Malovich\"` 将值 GeorgeMalovich\
    \ 赋给变量 a。\n- 23. 以下代码片段满足确定性性质。\n\n        int a, b;\n        double x;\n    \
    \    cin >> a;\n        cin >> b;\n        x = a / (b - 7);\n        cout << x\
    \ << endl;\n\n## 7.8 复习题：多项选择题\n\n为以下每个陈述选择正确答案。\n\n- 1. 以下哪条 C++ 语句将值 10 赋给变量\
    \ a？\n  - a. `10 = a;`\n  - b. `a <- 10;`\n  - c. `a = 100 / 10;`\n  - d. 以上都不是\n\
    \n- 2. 语句 `a = b` 可以读作\n  - a. 将变量 a 的内容赋给变量 b。\n  - b. 变量 b 等于变量 a。\n  - c. 将变量\
    \ b 的内容赋给变量 a。\n  - d. 以上都不是\n\n- 3. 表达式 `0 % 10 + 2` 等于\n  - a. 7。\n  - b. 2。\n\
    \  - c. 12。\n  - d. 以上都不是\n\n- 4. 以下哪条 C++ 语句在语法上是正确的？\n  - a. `a = 4 * 2 * y\
    \ - 8 / (4 * q);`\n  - b. `a = 4 * 2 * y - 8 / (4 * q);`\n  - c. `a = 4 * 2 *\
    \ y - 8 / (4 * q);`\n  - d. 以上都不是\n\n- 5. 以下哪条 C++ 语句将变量 a 增加 1，然后将其值赋给变量 b？\n\
    \  - a. `b = a + 1;`\n  - b. `b = a++;`\n  - c. `b = ++a;`\n  - d. 以上所有\n\n- 6.\
    \ 以下哪条 C++ 语句将值 George Malkovich 赋给变量 a？\n  - a. `a = \"George\" + \" \" + \"\
    Malkovich\";`\n  - b. `a = \"George\" + \" Malkovich\";`\n  - c. `a = \"George\
    \ \" + \"Malkovich\";`\n  - d. 以上所有\n\n- 7. 以下代码片段\n\n        x = 2;\n       \
    \ x++;\n\n  不满足哪一性质\n  - a. 有限性。\n  - b. 确定性。\n  - c. 有效性。\n  - d. 以上都不是\n\n-\
    \ 8. 以下代码片段\n\n        int a;\n        double x;\n\n        cin >> a;\n      \
    \  x = 1 / a;\n\n  不满足哪一性质\n  - a. 有限性。\n  - b. 输入。\n  - c. 有效性。\n  - d. 以上都不是\n\
    \n## 7.9 复习练习\n\n完成以下练习。\n\n- 1. 以下哪些 C++ 赋值语句在语法上是正确的？\n  - i. `a ← a + 1;`\n\
    \  - ii. `a += b;`\n  - iii. `a = b = a + b + 1;`\n  - iv. `a = a++;`\n  - v.\
    \ `a = hello;`\n  - vi. `a = 40*;`\n  - vii. `a = b * 5;`\n  - viii. `a =+ \"\
    true\";`\n  - ix. `fdadtwstdgfqw = 1;`\n  - x. `**a;`\n\n- 2. 以下每个变量的类型是什么？\n\
    \  - i. `a = \"false\";`\n  - ii. `w = false;`\n  - iii. `b = \"15 meters\";`\n\
    \  - iv. `weight = \"40\";`\n  - v. `b = 13.0;`\n  - vi. `b = 13;`\n\n- 3. 将第一列中的每个元素与第二列中的一个元素匹配。\n\
    \n| 运算 | 结果 |\n|---|---|\n| i. 1 / 2 | a. 100 |\n| ii. 1 / 2 * 2 | b. 0.25 |\n\
    | iii. 0 % 10 * 10 | c. 0 |\n| iv. 10 % 2 + 7 | d. 0.5 |\n|  | e. 7 |\n|  | f.\
    \ 1 |\n\n- 4. 执行以下每个代码片段后，屏幕上显示什么？\n  - i.\n\n        a = 5;\n        b = a *\
    \ a + 1;\n        cout << b++ << endl;\n  - ii.\n\n        a = 9;\n        b =\
    \ a / 3 * a;\n        cout << ++b << endl;\n\n- 5. 执行以下每个代码片段后，屏幕上显示什么？\n  - i.\n\
    \n        a = 5;\n        a = a++;\n        cout << a << endl;\n  - ii.\n\n  \
    \      a = 5;\n        a = ++a;\n        cout << a << endl;\n\n- 6. 以下每个运算的结果是什么？\n\
    \  - i. `21 % 5`\n  - ii. `10 % 2`\n  - iii. `11 % 2`\n  - iv. `10 % 6 % 3`\n\
    \  - v. `0 % 3`\n  - vi. `100 / 10 % 3`\n\n"
