  mdcn: "\n一个更好的解决方案是使用变量，如**图 5–2**所示。这减少了除法和乘法运算的次数，也降低了出现打字错误的可能性。\n\n![](img/7b41666e32fdead550ef74cdd9f6ead0_54_0.png)\n\
    \n**图 5–2** 使用变量 vat 计算三种产品的 20% 增值税\n\n这一次，除法(20/100)只计算一次，然后用其结果计算每种产品的增值税。\n\
    \n但即使现在，该算法（之后可能会成为计算机程序）仍不完美：vat 是一个变量，任何程序员都可能意外改变它的值。\n\n理想的解决方案是将变量 vat 改为常量\
    \ VAT，如**图 5–3**所示。\n\n![](img/7b41666e32fdead550ef74cdd9f6ead0_54_1.png)\n\n\
    **图 5–3** 使用常量 VAT 计算三种产品的 20% 增值税\n\n> *注意：请注意，声明常量时使用等号（ = ）而不是左箭头。*\n\n由于多种原因，最后这个解决方案是最佳选择。\n\
    \n- 任何人，包括程序员，都不能仅仅因为在程序的任何位置意外写下诸如 `VAT < 0.60` 这样的语句就改变 VAT 的值。\n- 出现打字错误的可能性被降到最低。\n\
    - 乘法和除法运算的次数尽可能少。\n- 如果有一天财政部长决定将增值税从 20% 提高到 22%，程序员只需修改一行代码！\n\n## 5.3 C++ 中存在多少种变量和常量？\n\
    \n所有计算机语言中都存在许多不同类型的变量和常量。造成这种多样性的原因是每个变量或常量可以保存的数据类型不同。大多数情况下，变量和常量保存以下类型的数据。\n\
    \n- **整数：** 整数值是不含任何小数部分的正数或负数，例如 5、100、135、-25 和 -5123。\n- **实数：** 实数值是包含小数部分的正数或负数，例如\
    \ 5.14、7.23、5.0、3.14 和 -23.78796。实数值也称为“浮点数”。\n- **布尔值：** 布尔变量或常量只能保存两个值之一：`true`\
    \ 或 `false`。\n- **字符：** 字符是字母数字值（始终用单引号或双引号括起来），例如 ‘a’、‘c’、“Hello Zeus”、“I am\
    \ 25 years old”或“Peter Loves Jane For Ever”。字符序列也称为“字符串”！！！（“string”这个词可能会让你联想到某种可穿戴的东西，但不幸的是它并不是。请把你那有点不纯洁却又宝贵的注意力放在自己的良心上吧！）。\n\
    \n## 5.4 C++ 中变量命名规则\n\n为变量命名时必须遵循某些规则。\n\n- 变量名只能包含拉丁字符（英文字母大写或小写）、数字和下划线字符（`_`）。变量名示例包括\
    \ `firstName`、`last_name1` 和 `age`。\n- 变量名区分大小写，这意味着大写字符和小写字符有明确区别。例如，`myVAR`、`myvar`、`MYVAR`\
    \ 和 `MyVar` 实际上是四个不同的变量名。\n\n以下示例展示了变量在不同高级计算机语言中是如何声明的。\n\n| 声明语句 | 高级计算机语言 |\n\
    |---|---|\n| Dim sum as Integer | Visual Basic |\n| int sum; | C++、C#、Java 以及许多其他语言\
    \ |\n| sum: Integer; | Pascal、Delphi |\n| var sum; | JavaScript |\n\n## 5.7 如何在\
    \ C++ 中声明变量\n\nC++ 是一种强类型编程语言。这意味着每个变量都必须关联一个特定的数据类型。例如，变量可以保存整数、实数或字符。在 C++ 中，一些基本数据类型包括：bool、int、float、double\
    \ 和 char。使用哪一种取决于具体问题！此外，有几种基本类型可以使用以下一个或多个类型修饰符进行修改：\n\n- unsigned\n- short\n\
    - long\n\n更具体地说：\n\n- **bool** 类型只能保存两个可能的值：即 `true` 或 `false`\n- **int** 类型可以保存\
    \ −2³¹ 到 +2³¹ − 1 之间的整数\n- **unsigned int** 类型可以保存 0 到 +2³² − 1 之间的整数\n- **short\
    \ int** 类型可以保存 −2¹⁵ 到 +2¹⁵ − 1 之间的整数\n- **unsigned short int** 类型可以保存 0 到 +2¹⁶\
    \ − 1 之间的整数\n- **float** 类型可以保存单精度实数\n- **double** 类型可以保存双精度实数\n- **char** 类型可以保存单个字符。\n\
    \n在许多计算机语言中，还有一种称为“字符串”的变量类型，它可以保存字符序列。这些字符序列（即“字符串”）通常用双引号或单引号括起来，例如“Hello Zeus”、“I\
    \ am 25 years old”等。C++ 也支持字符串，但请记住，C++ 中的字符串不是基本数据类型。不深入细节地说，C++ 中字符串的声明方式与声明\
    \ int、byte 或 double 等基本数据类型相同，但 C++ 在内部存储和处理它们的方式却大不相同。\n\n声明变量时，C++ 语句的一般形式是\n\
    \n```cpp\ntype name [ = value];\n```\n\n其中\n\n- `type` 可以是 bool、int、short int、unsigned\
    \ short int、string 等\n- `name` 是有效的变量名\n- `value` 可以是任何有效的初始值\n\n以下是一些如何声明变量的示例。\n\
    \n```cpp\nint number1;\nbool found;\nstring first_name;\nstring student_name;\n\
    ```\n\n在 C++ 中，你可以声明变量并直接为其赋初始值。下面的代码片段\n\n```cpp\nint num = 5;\nstring name =\
    \ \"Hera\";\nchar favorite_character = 'w';\n```\n\n等价于\n\n```cpp\nint num;\n\
    string name;\nchar favorite_character;\n\nnum = 5;\nname = \"Hera\";\nfavorite_character\
    \ = 'w';\n```\n\n> **注意：** 在 C++ 中，你可以使用等号（=）来表示给变量赋值的操作。这相当于流程图中的左箭头。\n\n> **注意：**\
    \ 请注意，在 C++ 中，你使用双引号（\" \"）给 string 类型的变量赋值，但使用单引号（' '）给 char 类型的变量赋值。\n\n最后但同样重要的是，你可以在同一行中声明多个相同类型的变量，并用逗号分隔它们。\n\
    \n```cpp\ndouble x, y, z;\nlong int w = 3, u = 2;\n```\n\n## 5.8 如何在 C++ 中声明常量\n\
    \n在 C++ 中，你可以使用关键字 `const` 声明常量。\n\n```cpp\nconst type name = value;\n```\n\n\
    以下示例展示了如何在 C++ 中声明常量。\n\n```cpp\nconst double VAT = 0.22;\nconst int NUMBER_OF_PLAYERS\
    \ = 25;\nconst string FAVORITE_SONG = \"We are the world\";\nconst char FAVORITE_CHARACTER\
    \ = 'W';\n```\n\n> *注意：请注意，C++ 要求所有语句都以分号（;）结尾。*\n\n一旦定义了常量，其值在程序运行期间就不能更改。\n\n\
    ## 5.9 复习题：判断题\n\n判断以下每个陈述为真或假。\n\n1. 变量是计算机二级存储设备中的一个位置。\n2. 对于流程图中的赋值运算符，你可以使用左箭头或右箭头。\n\
    3. 变量在程序执行期间可以改变其内容。\n4. 常量在程序执行期间可以改变其内容。\n5. 值 10.0 是整数。\n6. 布尔变量只能保存两个值之一。\n\
    7. 用双引号括起来的值“10.0”是实数值。\n8. 在计算机科学中，字符串是你可以穿戴的东西。\n9. 变量名可以包含数字。\n10. 变量在程序执行期间可以改变其名称。\n\
    11. 变量名不能是数字。\n12. 常量的名称必须始终是描述性的。\n13. 名称 `student name` 不是有效的变量名。\n14. 名称 `student_name`\
    \ 是有效的常量名。\n15. 在 C++ 中，常量名可以包含大写和小写字母。\n16. 在 C++ 中，不需要声明变量。\n17. 在 C++ 中，必须始终至少声明一个常量。\n\
    \n## 5.10 复习题：多项选择\n\n为以下每个陈述选择正确答案。\n\n1. 变量是以下哪一项中的位置\n   a. 硬盘。\n   b. DVD\
    \ 光盘。\n   c. USB 闪存盘。\n   d. 以上全部\n   e. 以上都不是\n2. 变量可以保存\n   a. 一次一个值。\n   b.\
    \ 一次多个值。\n"
