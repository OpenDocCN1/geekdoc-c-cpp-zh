    # Exercise 13.1-2　 Finding the Sum of Digits


    Write a C++ program that prompts the user to enter a four-digit integer and then
    calculates the sum of its digits.


    # Solution


    What you should keep in mind here is that the statement


    ```

    cin >> number;

    ```


    in the beginning of the program assigns the given four-digit integer to one single
    variable, `number`, and not to four individual variables.


    So, first you must split the integer into its four digits and assign each digit
    to a separate variable. Then you can calculate the sum of these four variables
    and get the required result. There are two approaches available.


    # First Approach


    Let’s try to understand the first approach using an arithmetic example. Take the
    number 6753, for example.


    | | Explanation |

    |---|---|

    | **First digit = 6** | The first digit can be isolated if you divide the given
    number by 1000 to get the integer quotient<br>`digit1 = (int)(6753 / 1000)` |

    | **Remaining digits = 753** | The remaining digits can be isolated if you divide
    the given number by 1000 to get the integer remainder<br>`r = 6753 % 1000` |'
