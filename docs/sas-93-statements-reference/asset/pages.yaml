  md: '# DATALINES Statement


    Specifies data lines follow.


    | Valid in: | DATA step |

    | Category: | File-handling |

    | Type: | Declarative |

    | Alias: | CARDS, LINES |

    | See: | Data lines cannot contain semicolons. Use the “DATALINES4 Statement”
    on page 57 when your data contain semicolons. |


    # Syntax


    DATALINES;


    # Without Arguments


    Use the DATALINES statement with an INPUT statement to read data that you enter
    directly in the program, rather than data stored in an external file.


    # Details


    # Using the DATALINES Statement


    The DATALINES statement is the last statement in the DATA step and immediately
    precedes the first data line. Use a null statement (a single semicolon) to indicate
    the end of the input data.


    You can use only one DATALINES statement in a DATA step. Use separate DATA steps
    to enter multiple sets of data.


    # Reading Long Data Lines


    SAS handles data line length with the CARDIMAGE system option. If you use CARDIMAGE,
    SAS processes data lines exactly like 80-byte punched card images padded with
    blanks. If you use NOCARDIMAGE, SAS processes data lines longer than 80 columns
    in their entirety.


    # Using Input Options with In-stream Data


    The DATALINES statement does not provide input options for reading data. However,
    you can access some options by using the DATALINES statement in conjunction with
    an INFILE statement. Specify DATALINES in the INFILE statement to indicate the
    source of the data and then use the options you need. For more information, see
    “Example 2: Reading In-stream Data with Options” on page 57.


    # Comparisons


    +   * Use the DATALINES statement whenever data do not contain semicolons. If
    your data contain semicolons, use the DATALINES4 statement.

    * The following SAS statements also read data or point to a location where data
    are stored:'
  merge: -1
  pgno: 69
