- img_proc: true
  md: "# END=variable\n\ncreates a temporary variable that contains an end-of-file\
    \ indicator. This variable is initialized to 0 and is set to 1 when UPDATE processes\
    \ the last observation. This variable is not added to any data set.\n\n# UPDATOM=MISSINGCHECK\n\
    UPDATOM=NOMISSINGCHECK\n\nspecifies whether missing variable values in a transaction\
    \ data set are to be allowed to replace variable values in a master data set.\n\
    \n# MISSINGCHECK\n\nprevents missing variable values in a transaction data set\
    \ from replacing values in a master data set.\n\n# NOMISSINGCHECK\n\nallows missing\
    \ variable values in a transaction data set to replace values in a master data\
    \ set.\n\nDefault: MISSINGCHECK\n\nTip: Special missing values, however, are the\
    \ exception and will replace values in the master data set even when MISSINGCHECK\
    \ (the default) is in effect.\n\n# Details\n\n# Requirements\n\n+   - The UPDATE\
    \ statement must be accompanied by a BY statement that specifies the variables\
    \ by which observations are matched.\n The BY statement should immediately follow\
    \ the UPDATE statement to which it applies.\n The data sets listed in the UPDATE\
    \ statement must be sorted by the values of the variables listed in the BY statement,\
    \ or they must have an appropriate index.\n Each observation in the master data\
    \ set should have a unique value of the BY variable or BY variables. If there\
    \ are multiple values for that value, only the first observation with that value\
    \ is used. The transaction data set can contain more than one master observation\
    \ with the same BY value. (Multiple transaction observations are all applied to\
    \ the master observation before it is written to the output file).\n\nFor more\
    \ information, see \"How to Prepare Your Data Sets\" in Chapter 21 of *SAS Language\
    \ Reference*: Concepts.\n\n# Transaction Data Sets\n\nUsually, the master data\
    \ set and the transaction data set contain the same variables. However, to reduce\
    \ processing time, you can create a transaction data set that contains only those\
    \ variables that are being updated. The transaction data set can also contain\
    \ new variables to be added to the output data set.\n\nThe output data set contains\
    \ one observation for each observation in the master data set. If any transaction\
    \ observations do not match master observations, they become new observations\
    \ in the output data set. Observations that are not to be updated can be omitted\
    \ from the transaction data set. See “Reading, Combining, and Modifying SAS Data\
    \ Sets” in Chapter 21 of *SAS Language Reference*: Concepts.\n\n# Missing Values\n\
    \nBy default the UPDATOM=MISSINGCHECK option is in effect, so missing values in\
    \ the transaction data set do not replace existing values in the master data set.\
    \ Therefore,"
  merge: -1
  pgno: 383
- img_proc: true
  md: "if you want to update but not all variables and the variables that you want\
    \ to update differ from one observation to the next, set to those variables that\
    \ are not changing. If you want missing values in the transaction data set to\
    \ replace existing values in the master data set, use UPDATEMODE=NOMISSINGCHECK.\n\
    \nEven when UPDATEMODE=MISSINGCHECK is in effect, you can replace existing values\
    \ with missing values by using special value characters in the data set. To create\
    \ the transaction data set, use the MISSING statement in the DATA set. If you\
    \ define one of the special values a through z for the transaction data set, SAS\
    \ updates numeric values in the master data set to that.\n\nIf you want the resulting\
    \ value in the master data set to be a regular missing, use a single underscore\
    \ (_) to represent missing values in the transaction data set. The resulting value\
    \ in the master data set will be a period (.) for missing numeric values and a\
    \ blank for missing character values.\n\nFor more information about defining and\
    \ using special missing value characters, see the \"MISSING Statement\" on page\
    \ 262.\n\n# Comparisons\n\n+   - Both UPDATE and MERGE can update observations\
    \ in a SAS data set.\n- MERGE automatically replaces existing values in the first\
    \ data set with missing values in the second data set. UPDATE, however, do not\
    \ so by default. To cause UPDATE to overwrite values in the master data set with\
    \ missing ones in the transaction data set, you must use UPDATEMODE=NOMISSINGCHECK.\n\
    - UPDATE changes or updates the values of selected observations in a master file\
    \ by applying transactions. UPDATE can also add new observations.\n\n# Examples\n\
    \nExample 1: Basic Updating\nThese program statements create a new data set (OHIOQTR1)\
    \ by applying transactions to a master data set (OHIOJAN). The BY variable must\
    \ appear in both OHIOJAN and OHIO.WEEK4, and its values in the master data set\
    \ should be unique:\n\n```\ndata oh.qtr;\n  update oh.jan oh.week4;\n  by store;\n\
    \nrun;\n```\n\nExample 2: Updating by Renaming Variables\nThis example shows renaming\
    \ a variable in the FITNESS data set so that it will not overwrite the value of\
    \ the same variable in the program data vector. Also, the WEIGHT variable is renamed\
    \ in each data set and a new WEIGHT variable is calculated. The master data set\
    \ and the transaction data set are listed before the code that performs the update:\n\
    \nMaster Data Set\n\n| OBS | ID | NAME | TEAM | WEIGHT |\n|---|---|---|---||\n\
    | 1 | 1114 | sally | blue | 125 |\n| 2 | 1441 | sue | green | 145 |\n| 3 | 1750\
    \ | joey | red | 189 |\n| 4 | 1994 | mark | yellow | 165 |\n| 5 | 2304 | joe |\
    \ red | 170 |\n\n* With"
  merge: -1
  pgno: 384
