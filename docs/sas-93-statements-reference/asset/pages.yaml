  md: "# Details\n\nTips:\nThese comments can contain semicolons and unmatched quotation\
    \ marks.\nnYou can write these comments within statements or anywhere a single\
    \ blank\nappear in your SAS code.\n\nYou can use the comment statement anywhere\
    \ in a SAS program to document the\npurpose of the program, explain unusual segments\
    \ of the program, or describe steps in a\ncomplex program or calculation. SAS\
    \ ignores text in comment statements during\nprocessing.\n\nCAUTION:\nAvoiding\
    \ the /* comment symbols in columns 1 and 2. In some operating\nenvironments,\
    \ SAS might interpret /* in columns 1 and 2 as a request to end the\nSAS program\
    \ or session.\n\nNote: You can add these lines to code to fix unmatched comment\
    \ tags, unmatched\nquotation marks, and missing semicolons.\n\n```\n/* ; \" */;\n\
    quit;\nrun;\n```\n\n# Example: Using the Comment Statement\n\nThese examples illustrate\
    \ the two types of comments:\n\n+   * This example uses the *message; format:\n\
    * This code finds the number in the BY group;\n* This example uses the *message;\
    \ format:\n\n> This uses one comment statement\nto draw a box.\n\nThis example\
    \ uses the /*message*/ format:\ninput /*1 name $20.; /* last name */\n      @200\
    \ test 8.; /* score test */\n      @50 age 3.; /* customer age */;\n\n+   * This\
    \ example uses the /*message*/ format:\n/* For example 1 use: x=abc;\nfor example\
    \ 2 use: y=ghi; */\n\n# CONTINUE Statement\n\nStops processing the current DO-loop\
    \ iteration and resumes processing the next iteration.\n\n+   Valid in: DATA step\n\
    Category: Control\nType: Executable\nRestriction: Can be used only in a DO loop"
