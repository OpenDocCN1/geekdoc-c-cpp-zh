    # Details


    The Secure Socket Layer (SSL) protocol is used when the URL begins with “https”
    instead of “http”. The SSL protocol provides network security and privacy. Developed
    by Netscape Communications, SSL uses encryption algorithms that include RC2, RC4,
    tripleDes, IDEA, and MD5. Not limited to only encryption services, SSL can also
    perform server authentication and usage encryption codes. SSL is supported by
    both Netscape Navigator and Internet Explorer. Many websites use the protocol
    to protect confidential user information such as credit card numbers. The SSL
    protocol is independent, enabling protocols such as HTTP, FTP, and Telnet to be
    layered transparently over it. SSL is optimized for HTTP.


