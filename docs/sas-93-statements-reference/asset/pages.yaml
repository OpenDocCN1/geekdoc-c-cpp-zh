    # Buffer Allocation


    A buffer is a reserved area of memory that holds a segment of data while it is
    processed. The number of allocated buffers determines how much data can be held
    in memory at one time.


    The number of buffers is not a permanent attribute of a SAS file. That is, it
    valid only for the current SAS session or job. When a SAS file is opened, a default
    number of buffers for processing the file is set. The default depends on the operating
    environment but is typically a small number such as one. To specify a different
    number of buffers, you can use the BUFNO= data option or system option.


    When the SASFILE statement is executed, SAS automatically allocates the number
    of buffers based on the number of data set pages and index file pages (if an index
    exists). For example:


    +   - If the number of data set pages is five and there is no index, SAS allocates
    five buffers.

    - If the number of data set pages is 500 and the number of index file pages is
    200, SAS allocates 700 buffers.


    If a file that is held in memory increases in size during processing, the number
    of allocated buffers increases to accommodate the file. Note that if SASFILE is
    executed for a SAS data set, the BUFNO= de-set option is ignored.


    # I/O Processing


    An I/O (input/output) request reads a segment from a storage device (such as disk)
    and transfers the data to memory, or conversely transfers the data from memory
    and writes it to the storage device. When a SAS data set is opened by the SASFILE
    statement, data is read once and held in memory, which should reduce the number
    of I/O requests.


    # CAUTION:


    I/O processing can be reduced only if there is sufficient real memory. If the
    SAS data set is very large, you might not have sufficient real memory to hold
    the entire file. If insufficient memory exists, your operating environment can
    simulate'
