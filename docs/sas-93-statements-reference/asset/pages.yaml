  md: '# Example 2: Determining New Page by Lines Left on the Current Page


    This DATA step demonstrates using the LINESLEFT option to determine where the
    page break should occur, according to the number of lines left on the current
    page.


    +   - Write a report. Use DATA_NULL to write a report rather than create a data
    set:

    data_null;

    set info;


    +   - Route to the standard SAS output window. The PRINT fileref routes out to
    the same location as procedure output. LINESLEFT indicates that the variable remain
    the number of lines left on the current page:

    file print linesleft=remain pagesize=20;

    @5 name @30 phone

    @3 bld @37 room;


    +   - Begin a new page when there are fewer than seven lines left on the current
    page. Under this condition, PUT_PAGE begins a new page and moves the pointer at
    line 1:

    if remain<7 then put_page;


    # Example 3: Arranging the Contents of an Entire Page


    This example shows how to use N=PAGESIZE in a DATA step to produce a two-column
    telephone book listing, each column containing a name and a phone number:


    +   - Create a report and write it to a SAS output window. Use DATA_NULL to write
    a report rather than create a data set. PRINT is the fileref. SAS uses carriage-control
    characters to write the output with the characteristics of a print file. N=PAGESIZE
    makes the page available to the output pointer:

    data_null;

    file ''external-file'' print pagesize;


    +   - Specify the columns for your report. This DO loop iterates twice on each
    DATA step iteration. The COL value is 1 on the first iteration and 40 on the second:

    dol=col=1;


    +   - Write 20 lines of data. This DO loop iterates 20 times to write 20 lines
    in column 1. When finished, the outer loop sets COL to 40, and this DO loop iterates
    20 times, writing 20 lines of data in the second column. The values of LINE and
    COL are incremented by the DO statement, control where the PUT statement writes
    the values of NAME and PHONE on the page:

    dol=1 to 20;

    set info;

    put #line @col name @20. +1 phone 4;

    end;


    +   - After composing two columns of data, write the page. This END statement
    ends the outer DO loop. The PUT_PAGE writes the current page and moves the pointer
    to the top of a new page:

    end;

    put_page;

    run;'
  merge: -1
