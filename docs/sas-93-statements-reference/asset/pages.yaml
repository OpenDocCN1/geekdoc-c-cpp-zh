    # SELECT Statement


    Executes one of several statements or groups of statements.


    | Valid in: | DATA step |

    | Category: | Control |

    | Type: | Executable |


    # Syntax


    ```

    SELECT <select-expression>;

    WHEN-1 (when-expression-1 <..., when-expression-n > ) statement;

    <...WHEN-n (when-expression-1<..., when-expression-n > ) statement;

    <OTHERWISE statement;>

    END;

    ```


    # Arguments


    (select-expression)

    specifies any SAS expression that evaluates to a single value.


    See: “Evaluating the when-expression When a select-expression Is Included” on
    page 343


    (when-expression)

    specifies any SAS expression, including a compound expression. SELECT requires
    you to specify at least one when-expression.


    Tips:

    Separating multiple when-expressions with a comma is equivalent to separating
    them with the logical OR.


    The way a when-expression is used depends on whether a select-expression is present.


    See: “Evaluating the when-expression When a select-expression Is Not Included”
    on page 343


    statement

    can be any executable SAS statement, including DO, SELECT, and null statements.
    You must specify the statement argument.'
