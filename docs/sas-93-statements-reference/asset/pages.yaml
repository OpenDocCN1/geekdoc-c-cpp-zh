  md: '# Updating the_FILE_Variable


    Like other SAS variables, you can update the _FILE variable. The following two

    methods are:


    +   - _FILE_ in an assignment statement.

    - Use a PUT statement.


    You can update the _FILE_ variable by using an assignment statement that has the

    following form.


    ```

    _FILE_ = ''string-in-quotation-marks'' character-expression>

    ```


    The assignment statement updates the contents of the current output buffer and
    sets the

    buffer to the length of ''string-in-quotation-marks'' or character-expression.

    However, using an assignment statement does not affect the current column pointer
    of

    the PUT statement. The next PUT statement for this FILE begins to update the

    buffer at column 1 or at the last location when you use the trailing @ in the
    PUT

    statement.


    In the following example, the assignment statement updates the contents of the
    current

    output buffer. The column pointer of the PUT statement is not affected:


    ```

    file print;

    _file_ = ''FILE'';

    put ''This is PUT'';

    ```


    SAS creates the following output: This is PUT


    In this example,


    ```

    file print;

    _file_ = ''This is from FILE, sir.'';

    put @14 ''both'';

    ```


    SAS creates the following output: This is from both, sir.


    You can also update the _FILE_ variable by using a PUT statement. The PUT statement

    updates the _FILE variable because the PUT statement formats data in the output
    buffer

    and FILE points to that buffer. However, by default SAS clears the buffer

    after a PUT statement executes and outputs the record (or N= block of records).

    Therefore, if you want to examine or further modify the contents of _FILE before
    it is

    output, include a trailing @ or @@ in any PUT statement (when N=1). For other
    values

    of N, use a trailing @ or @@ in any PUT statement where the last line pointer
    is

    the last record of the record block. In the following example, when N=1


    ```

    file ABC;

    put ''Something'';

    Y = _file||'' is here'';

    file ABC;

    ```'
