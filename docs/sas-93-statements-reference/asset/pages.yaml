  md: 'You can use the DROP, KEEP= or RENAME= data set options to process a set of
    variables, but the set of variables that are processed for each data must be identical.
    In most cases, if the set of variables defined by any subsequent data set differs
    from the variables of the first data set, SAS prints a warning message to the
    log but does not stop execution.


    +   - If a variable on a subsequent data set is of a different type (character
    versus numeric, for example) than the type of the same-named variable on the first
    data set, the DATA step will stop processing and produce an error message.

    - If a variable on a subsequent data set was not defined in the SET statement,
    but was defined previously in the DATA program, the DATA step will stop processing
    and producing an error message. In this case, the value of the variable in previous
    iterations might be incorrect because the semantic behavior of SET requires this
    variable to be missing when processing the first observation of the first data
    set.


    Default: IMMEDIATE


    # POINT=variable


    specifies a temporary variable whose numeric value determines which observation
    is read. POINT= causes the SET statement to use random (direct) access to read
    a SAS data set.


    Restrictions:

    You cannot use POINT= with a BY statement, a WHERE statement, or a WHERE= data
    set option. In addition you can use it with transport format data sets, in sequential
    format on tape or disk, and SAS/ACCESS views that read data from external files.

    You cannot use POINT= with KEY=.


    Requirement: a STOP statement


    Tips:


    You must supply the values of the POINT= variable. For example, you can use the
    POINT= variable as the index variable in some form of the DO statement.

    The POINT= variable is available anywhere in the DATA step, but it is not added
    to any new data set.


    Examples:

    “Example 6: Combining One Observation with Many” on page 352

    “Example 9: Reading a Subset by Direct Access” on page 353


    CAUTION: Continuous loops can occur when you use the POINT option.

    When you use POINT=, you must include a STOP statement to stop the DATA step,
    programming logic that checks for an invalid value of the POINT= variable, or
    both. Because POINT= reads only those observations that are specified in the DO
    statement, SAS cannot read an end-of-file indicator as if the file were being
    read sequentially. Reading an end-of-file indicator ends DATA step automatically,
    failure to substitute another method of ending the DATA step when you use POINT=
    can cause the DATA step to go into a continuous loop. If SAS reads an invalid
    value of the POINT= variable, it sets the automatic variable ERROR_ to 1. Use
    this information to check for continuous DO-loop processing, or include a STOP
    statement at the end of the DATA step, or both.


    # UNIQUE


    causes a KEY= search always to begin at the top of the index for the data set
    that is being.'
