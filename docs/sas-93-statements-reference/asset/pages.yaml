  md: '# FILENAME Statement, FTP Access Method


    Tip: The association between a fileref and an external file lasts only for the
    duration of the SAS session or until you change or discontinue it with another
    FILENAME statement. You can change the fileref for a file as often as you want.


    # FTP


    specifies the access method that enables you to use File Transfer Protocol (FTP)
    to read from or write to a file from any host computer that you can connect to
    a network with an FTP server running.


    Tip: Use FILENAME with FTP when you want to connect to the host computer, to log
    in to the FTP server, to make records in the specified file available for reading
    or writing, and to disconnect from the host computer.


    # ''external-file''


    specifies the name of an external file that you want to read from or write to.
    The physical name is the name that is recognized by the operating environment.


    If the file has IBM 370 format and a record format of FB or FBA, and if the ENCODING=
    option is specified, you must also specify the LRECL= option. If the length of
    a record is shorter than the value of LRECL, then SAS pads the record with blanks
    until the record length is equal to the value of LRECL.


    Operating environment: For details about specifying the physical names of external
    files, see the SAS documentation for your operating environment.


    Tips:


    If you are not transferring a file but performing a task such as retrieving a
    directory listing, you do not need to specify a fileref. Instead, put empty quotation
    marks in the statement. See "Example 1: Retrieving a Directory Listing" on page
    124.


    You can associate a fileref with a single file or with an aggregate file storage
    location.


    If you use the DIR option, specify the directory in this argument.


    # ftp-options


    specifies details that are specific to your operating environment as file attributes
    and processing attributes.


    Operating environment: For more information about some of these FTP options, see
    the SAS documentation for your operating environment.


    See: "FTP Options" on page 117


    # FTP Options


    AUTHDOMAIN="auth-domain"


    specifies the name of an authentication domain metadata object in order to connect
    to the FTP server. The authentication domain references credentials (user ID and
    password) without having to explicitly specify the credentials. The *auth-domain*
    name is case sensitive, and it must be enclosed in double quotation marks.


    An administrator creates authentication domain definitions while creating a user
    definition with the User Manager in SAS Management Console. The authentication
    domain is associated with one or more login metadata objects that provide access
    to the FTP server and is resolved by the BASE engine calling the SAS Metadata
    Server and returning the authentication credentials.


    Requirement: The authentication domain and the associated login definition must
    be stored in a metadata repository, and the metadata server must be running in
    order to resolve the metadata object specification.


    Interaction: If you specify AUTHDOMAIN=, you do not need to specify USER= and
    PASS='
