  md: '# %INCLUDE Statement


    Brings a SAS programming statement, data lines, or both, into a current SAS program.


    +   | Valid in: Anywhere |

    | Category: Program Control |

    | Alias: %INC |

    | See: %INCLUDE Statement under Windows , UNIX, and z/OS |


    # Syntax


    ```

    %INCLUDE source(s)

    </SOURCE2><S2=length><operating-environment-options>>

    ```


    # Arguments


    source(s) describes the location of the information that you want to access with
    the %INCLUDE statement. There are three possible sources:


    | Source | Definition |

    | file-specification | specifies an external file |

    | internal-lines | specifies lines that are entered earlier in the same SAS job
    or session |

    | keyboard-entry | specifies statements or data lines that you enter directly
    from the keyboard |


    file-specification identifies an external file that you want to bring into your
    program.

    File-specification can have these forms:


    +   ''external-file'' specifies the physical name of an external file that is
    enclosed in quotation marks. The physical name is the name by which the operating
    environment recognizes the file.


    +   fileref specifies a fileref that has previously been associated with an external
    file.

    Tip: You can use a FILENAME statement or function an operating environment command
    to make the association.


    +   fileref (filename-1, "filename-2.xxx", ...filename-n>) specifies a fileref
    that has previously been associated with an aggregate storage location. Follow
    the fileref with one or more filenames that reside in that location. Enclose the
    filenames in one set of parentheses, and separate each filename with a comma,
    space.'
