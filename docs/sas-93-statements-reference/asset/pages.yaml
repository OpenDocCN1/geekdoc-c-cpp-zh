    # RETURN Statement


    Stops executing statements at the current point in the DATA step and returns to
    a predetermined point in the step.


    | Valid in: DATA step |

    | Category: Control |

    | Type: Executable |


    # Syntax


    RETURN;


    # Without Arguments


    The RETURN statement causes execution to stop at the current point in the DATA
    step, and returns control to a previous DATA step statement.


    # Details


    The point to which SAS returns depends on the order in which statements are executed
    in the DATA step.


    The RETURN statement is often used with the


    +   - GO TO statement

    - HEADER= option in the FILE statement

    - LINK statement.


    When RETURN causes a return to the beginning of the DATA step, an implicit OUTPUT
    statement writes the current observation to any new data sets (unless the DATA
    step contains an explicit OUTPUT statement, or REMOVE or REPLACE statements with
    MODIFY statements). Every DATA step has an implied RETURN as its last executable
    statement.'
