    # LIBNAME Statement


    Associates or disassociates a SAS library with a libref (a shortcut name), clears
    one or all librefs, lists the characteristics of a SAS library, concatenates SAS
    libraries, or concatenates SAS catalogs.


    +   **Valid in:** Anywhere

    **Category:** Data Access

    **See:** LIBNAME Statement under Windows, UNIX, and z/OS'
