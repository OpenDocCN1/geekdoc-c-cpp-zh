  md: '# SKIP Statement


    Creates a blank line in the SAS log.


    **Valid in:** Anywhere


    **Category:** Log Control


    # Syntax


    ```

    SKIP <n>;

    ```


    # Without Arguments


    Using SKIP without arguments causes SAS to create one blank line in the log.


    # Arguments


    n specifies the number of blank lines that you want to create in the log.


    **Tip:** If the number specified is greater than the number of lines that remain
    on the page, SAS goes to the top of the next page.


    # Details


    The SKIP statement itself does not appear in the log. You can use this statement
    in all methods of operation.


    # See Also


    Statements:


    +   “PAGE Statement” on page 288


    System Options:


    +   “LINESIZE= System Option” in SAS System Options: Reference


