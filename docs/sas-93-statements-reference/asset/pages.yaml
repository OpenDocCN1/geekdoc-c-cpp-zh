  md: 'Tip: ODS destination HTML, RTF, PRINTER generates the same type of underline
    for values 1, 2, and 3. However, SAS/GRAPH uses values 1, 2, and 3 to generate
    increasingly thicker underlines.


    Note: The defaults for how ODS renders the FOOTNOTE statement come from

    style elements that relate to system footnotes in the current style.

    The FOOTNOTE statement syntax with ods-format-options is a way to override the

    settings that are provided by the current style. The current style varies according

    the ODS destination. For more information about how to determine the current

    style, see “Understanding Styles, Style Elements, and Attributes” in

    Chapter 3 of SAS Output Delivery System: User’s Guide and “Concepts: Styles

    and the TEMPLATE Procedure” in Chapter 13 of SAS Output Delivery System:

    User’s Guide.


    Tip: You can specify these options by letter, word, or by preceding each

    or word of the text by the option. For example, this code will make the footnote

    fontcolor color=red="Red, color=white="White, and color-blue="Blue"

    inter different colors.


    ```

    fontcolor color=red="Red, color=white="White, and color-blue="Blue";

    ```


    ''text'' |''text''

    specifies the text of the text in single or double quotation marks


    Tips:


    +   For compatibility with previous releases, SAS accepts some text without

    quotation marks. When you write new programs or update existing programs,

    always enclose in quotation marks.


    +   If you use an automatic macro variable in the title text, you must enclose
    the title

    in double quotation marks. The SAS macro facility will resolve the macro

    variable only if the text is in double quotation marks.


    +   If you use single quotation marks ('''') or double quotation marks ("") together

    (with no space between them) as the string of text, SAS will output a single

    quotation mark ('''') or double quotation mark (""), respectively.


    # Details


    A FOOTNOTE statement takes effect when the step or RUN group with which it is

    associated executes. After you specify a footnote for a line, SAS repeats the
    same

    footnote on all pages until you create or redefine the footnote for that line.
    When a

    FOOTNOTE statement is specified for a given line, it cancels the previous FOOTNOTE

    statement for that line and for all footnote lines with higher numbers.


    # Operating Environment Information


    The maximum footnote length that is allowed depends on the operating environment

    ent value of the LINESIZE system option. Refer to the SAS documentation for

    your operating environment for more information.


    # Comparisons


    You can also create footnotes with the FOOTNOTES window. For more information,

    er to the online Help for the window.


    You can modify footnotes with the Output Delivery System. For Example 3:

    Customizing Titles and Footnotes by Using the Output Delivery System” on page
    365.


