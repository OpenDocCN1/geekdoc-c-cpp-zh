    # NOBS=variable


    creates and names a variable whose value is usually the total number of observations
    in the input data set or data sets. If more than one data set is listed in the
    SET statement, NOBS= the total number of observations in the data sets that are
    listed. This includes those observations that are marked for deletion but are
