  md: "Tips: For compatibility with previous releases, SAS accepts some text without\
    \ quotation marks. When writing new programs or updating existing programs, always\
    \ enclose text in quotation marks.\n\nIf you use single quotation marks (\\')\
    \ or double quotation marks (\") together (with no space in them) as the string\
    \ of text, SAS will output a single quotation mark (\\') or double quotation marks\
    \ (\"\"), respectively.\n\nIf you use an automatic variable in the text, you must\
    \ enclose the text in double quotation marks. The SAS macro facility will resolve\
    \ the macro variable only if the text is in double quotation marks.\n\nSee: For\
    \ more information about quotation marks as part of the title, see \"Expressions\"\
    \ in Chapter 6 of SAS Language Reference: Concepts.\n\n# Details\n\nA TITLE statement\
    \ takes effect when the step or RUN group with which it is associated executes.\
    \ If you specify a title for a line, it is used for all subsequent output until\
    \ you cancel the title or define another for that line. A TITLE statement for\
    \ a line cancels the previous TITLE statement for that line and for all lines\
    \ with larger n numbers.\n\nOperating Environment Information\n\nThe maximum title\
    \ length that is allowed depends on your operating environment and the value of\
    \ the LINESIZE= system option. Refer to the SAS documentation for your operating\
    \ environment for more information.\n\n# Comparisons\n\nYou can also create titles\
    \ with the TITLES window.\n\n# Examples\n\n# Example 1: Using the TITLE Statement\n\
    \nThe following examples show how you can use the TITLE statement:\n\n+   - This\
