- img_proc: true
  md: '# Reading Multiple Input Files


    You can read from multiple input files in a single iteration of the DATA step
    in one of two ways:


    +   - to keep multiple files open and change which file is read, use multiple
    INFILE statements.

    - to dynamically change the current input file within a single DATA step, use
    FILEVAR= option in an INFILE statement. The FILEVAR= option enables you to read
    from one file, close it, and then open another. See “Example 5: Reading from Multiple
    Input Files” on page 185.


    # Updating External Files in Place


    You can use the INFILE statement in combination with the FILE statement to update
    records in an external file. Follow these steps:


    +   1. Specify the INFILE statement before the FILE statement.

    2. Specify the same referent or physical filename in each statement.

    3. Use options that are common to both the INFILE and FILE statements in the INFILE
    statement instead of the FILE statement. (Any options that are used in the FILE
    statement are ignored.)


    See “Example 6: Updating an External File” on page 186.


    To update individual fields within a record instead of the entire record, see
    the SHAREBUFFERS option on page 174.


    # Accessing the Contents of the Input Buffer


    In addition to the _INFILE_, you can use the automatic _INFILE_ variable to reference
    the contents of the current input buffer for the most recent execution of the
    INFILE statement. This character variable is automatically retained and initialized
    to blanks. Like other automatic variables, _INFILE_ is not written to the data
    set.


    When you specify the _INFILE_= option in an INFILE statement, this variable is
    also indirectly referenced by the automatic _INFILE_ variable. In a particular
    INFILE statement, if the _ _INFILE_ variable is present and you omit _INFILE_,
    then SAS creates an internal _INFILE_ for that INFILE statement. Otherwise, SAS
    does not create the _INFILE_ variable for a particular FILE.


    During execution and at the point of reference, the maximum length of this character
    variable is the maximum length of the current _INFILE_ variable. However, because
    INFILE only other variables are not known until the execution phase, the designated
    length is 32,767 bytes during the compilation phase. For example, if you assign
    INFILE to a new variable whose length is undefined, the default length of the
    new variable is 32,767 bytes. You cannot use the LENGTH statement and the ATTRIB
    statement to set or override the length of INFILE_. You can use the FORMAT statement
    and the ATTRIB statement to assign a format to _INFILE_.


    Like other variables, you can update the _INFILE_ variable in an assignment statement.
    You can also use a format with _INFILE_ in a PUT statement. For example, the following
    PUT statement writes the contents of the input buffer by a hexadecimal format.


    ```

    put _infile_ = $hex100;

    ```


    Any modification of the _INFILE_ directly modifies the input buffer for the current
    INFILE statement. The execution of any PUT _INFILE_ statement that follows this
    buffer modification will reflect the contents of the modified buffer.'
  merge: -1
  pgno: 190
- img_proc: true
  md: 'INFILE only accesses the contents of the current input buffer for an INFILE
    statement, even when you use the N= option to select multiple buffers. You can
    access all the N-buffers, but you must use an INPUT statement with the # line
    pointer counter to make the desired current input buffer.


    # Reading Delimited Data


    By default, the delimiter that is used to read input data records with list input
    is a blank space. The delimiter-sensitive data (DSD) option, the DELIMITER= option,
    the DLM= option, and the DLMSOPT= option specifies how your list input handles
    delimiters. The DELIMITER= or DLMSTR= option specifies that the INPUT statement
    use a character other than a blank as data values that are read with list input.
    When the DSD option is in effect, the INPUT statement uses a comma as the default
    delimiter.


    To read a value between two consecutive delimiters, use the DSD option. The INPUT
    statement treats consecutive delimiters as a unit. When you use DSD, the INPUT
    statement treats consecutive delimiters separately. Therefore, a value that is
    missing between consecutive delimiters is read as a missing value. To change the
    delimiter from comma to another value, use the DELIMITER= or DLMSTR= option.


    For example, this DATA step program uses list input to read data that is separated
    by commas. The second line contains a missing value. Because SAS allows consecutive
    delimiters with list input, the INPUT statement cannot detect the missing value:


    ```

    data scores;

    infile datalines delimiter='','';

    input test1 test2 test3;

    datalines;

    91,87,95

    97,,92

    ,1;

    ```


    With the FLOWOVER option in effect, the data set SCORES contains two, not three.
    The second observation is built incorrectly:


    | OBS | TEST1 | TEST2 | TEST3 |

    |---|---|---|--|

    | 1 | 91 | 87 | 95 |

    | 2 | 97 | 92 | 1 |


    To correct the problem, use the DSD option in the INFILE statement.


    ```

    data scores;

    input test1 test2 test3;

    datalines;

    91,87,95

    97,,92

    ,1;


    infile datalines ded;

    ```


    Now the INPUT statement detects the two consecutive delimiters and therefore assigns
    a missing value to variable TEST2 in the second observation.'
  merge: -1
  pgno: 191
- img_proc: true
  md: '# INFILE Statement 179


    | OBS | TEST1 | TEST2 | TEST3 |

    |---|---|---|---|n| 1 | 91 | 87 | 95 |

    | 2 | 97 | | 92 |

    | 3 | | 1 | 1 |


    The DSD option also enables list to read a character value that contains a delimiter
    within a quoted string. For example, if data is separated with commas, DSD enables
    you to place the character string in quotation marks and read a comma as a valid
    character. SAS does not store the quotation marks as part of the character value,
    use the tilde (-) format modifier in an INPUT statement. See “Example 1: Changing
    Delimiters Are Treated” on page 181.


    > Note: Any a text file originates from anywhere than the local encoding environment,
    it may be necessary to specify the ENCODING= option on EBCDIC or ASCII environments.
    For example, when you read an EBCDIC file on an ASCII platform, it is recommended
    that you specify the ENCODING= in the INFILE statement. However, if you use the
    DSD and DLM options in the INFILE statement, the ENCODING= option is a requirement
    because require certain characters in the session encoding (such as quotation
    marks, commas, and blanks). The use of encoding-specific informs is reserved for
    use when you read binary files. That is, for files that contain both character
    and noncharacter fields.


    # Reading Long InputStream Data Records


    You can use the INFILE statement with the DATELINES file specification to process
    inline data. An INPUT statement reads the data records that follow the DATELINES.
    If you use the CARDIMAGE system option, or if this is the default for your system,
    SAS processes the lines exactly like 80-byte card images that are padded with
    blanks. The default FLOWOVER option in the INFILE statement causes the INPUT statement
    to read the next record if it does not find values in the current record for all
    of the variables in the statement. To ensure that your data is processed correctly,
    use an external file for input when records are longer than 80 bytes.


    > Note: The NOCARDIMAGE system option (see the “CARDIMAGE System Option” in SAS
    System Options: Reference) specifies that data lines are not treated as if they
    are 80-byte card images. The end of a data line is always treated as the end of
    the last token, except for strings that are enclosed in quotation marks.


    # Reading the End of a Line


    By default, the INPUT statement tries to read the end of the current input data
    record, it moves the input pointer to column 1 of the next record to read the
    remaining values. This default behavior is specified by the FLOWOVER option. A
    message is written to the SAS log:


    ```

    NOTE: SAS sent to a new line when INPUT statement reached the end of a line.

    ```


    Several options are available to change the INPUT statement behavior when an end
    of a line is reached. The STOPOVER option treats this condition as an error and
    stops building the data set. The MISSOVER and TRUNCVER options do not allow the
    input pointer to go to the next record when the current INPUT statement is not
    satisfied. The SCANOVER option, with @character-string scans the input record
    until it finds the specified character-string. The FLOWOVER option restores the
    default behavior.'
  merge: -1
  pgno: 192
