    # DROPOVER


    discards data items that exceed the line length (as specified by the LINESIZE=
    or LRECL= in the FILE statement).


    By default, data that exceeds the current line length is written on a new line.
    When you specify DROVER, SAS drops (or ignores) an entire item when there is not
    enough space in the current line to write it. Thus, the PUT statement remains
    positioned after the last value may write other items in the current output line
    if they fit in the space or if the column position is repositioned. When a data
    item is dropped, the DATA step continues normal execution (_ERROR=0). At the end
    of the DATA step, a message is printed for each file from which data was lost.


    Default: FLOWOVER


    Tip: Use FLOWOVER when you want the DATA step to continue executing if the PUT
    statement attempts to write the current line length, but you do not want the data
    item that exceeds the line length to be written on a new line.


    See: FLOWOVER on page 82 and STPOVER on page 86


