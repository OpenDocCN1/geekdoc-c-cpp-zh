  md: '# 324 Chapter 2 • Dictionary of SAS Statements


    Valid in: DATA step

    Category: Information

    Type: Declarative


    # Syntax


    ```

    RENAME old-name-1=new-name-1...old-name-n=new-name-n;

    ```


    # Arguments


    old-name

    specifies the name of a variable or variable list as it appears in the input data
    set, or in the current DATA step for newly created variables.


    new-name

    specifies the name or list to use in the output data set.


    # Details


    The RENAME statement allows you to change the names of one or more variables,
    in a list, or a combination of variables and variable lists. The new variable
    names are written to the output data set only. Use the old variable names in programming
    statements for the current DATA step. RENAME applies to all output data sets.


    Note: The RENAME statement has an effect on data sets opened in output mode.


    # Comparisons


    +   - RENAME cannot be used in PROC steps, but the RENAME= data set option can.

    - The RENAME data set option allows you to specify the variables you want to rename
    for each input or output data set. Use it in input data sets to rename variables
    before processing.

    - If you use the RENAME= data set option in an output data set, you must continue
    to use the old variable names in programming statements for the current DATA step.
    After your output data is created, you can use the new variables.

    - The RENAME data set option in the SET statement renames variables in the data
    set. You can use your new names in programming statements for the current DATA
    step.

    - To rename variables as a file management task, the DATASETS procedure or access
    the variables through the SAS windowing interface. These methods are simpler and
    do not require DATA step processing.


    # Example: Renaming Data Set Variables


    These examples show the syntax for renaming variables using the RENAME statement:


    ```

    rename street=address;

    rename time1=temp1 time2=temp2 time3=temp3;

    rename name=FirstName score3=Newscore3-Newscore3;

    ```'
