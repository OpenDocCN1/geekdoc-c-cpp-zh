    # PAGE Statement


    Skips to a new page in the SAS log.


    **Valid in:** Anywhere

    **Category:** Log Control


    # Syntax


    ```

    PAGE;

    ```


    **Without Arguments**

    The PAGE statement skips to a new page in the SAS log.


    # Details


    You can use the PAGE statement when you run SAS in a windowing environment, batch,
    or noninteractive mode. The PAGE statement itself does not appear in the log.
    When you run SAS in interactive log mode, the PAGE might print blank lines to
    the display monitor (or to the alternate log file).


    # See Also


    **Statements:**


    +   - “LIST Statement” on page 250


    **System Options:**


    +   - LINESIZE= System Option in SAS System Options: Reference

    - “PAGESIZE= System Option in SAS System Options: Reference


    # PUT Statement


    Writes lines to the SAS log, to the SAS output window, or to an external location
    that is specified in the most recent FILE statement.


    **Valid in:** DATA step

    **Category:** File-handling

    **Type:** Executable


    # Syntax


    ```

    PUT <specification(s)> <_ODS> <@@ | @@>;

    ```'
