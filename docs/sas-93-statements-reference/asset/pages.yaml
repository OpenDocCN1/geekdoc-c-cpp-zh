    **Range:** a positive integer


    **Tip:** If numeric-variable is not an integer, SAS truncates the decimal value
    and only uses the integer value. If numeric-variable is zero or negative, the
    pointer moves to column 1.


    **Example:** The value of the variable A moves the pointer to column 15:'
