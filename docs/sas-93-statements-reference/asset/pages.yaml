  md: '# INPUT Statement, Named


    Reads data values that appear after a variable name that is followed by an equal
    sign and assigns them to corresponding SAS variables.


    Valid in: DATA step


    Category: File-handling


    Type: Executable


    # Syntax


    ```

    INPUT <pointer-control> variable= $< | <@ | @@;

    INPUT <pointer-control> variable=informat. <@ | @@;

    INPUT variable= $< > start-column <end-column>

    .<decimals> <@ | @@;

    ```


    # Arguments


    pointer-control

    moves the input pointer to a specified line or column in the input buffer.


    See: "Column Pointer Controls" on page 195 and "Line Pointer Controls" on page
    197


    variable=

    specifies a variable whose value is read by the INPUT statement. In the input
    data record, the field has the form


    variable=value


    Example: "Example 3: Using Named Input with Another Input Style" on page 224


    $indicates to store a variable value as a character value rather than as numeric
    value.

    Tip: If the variable is previously defined as character, S is not required.


    Example: "Example 3: Using Named Input with Another Input Style" on page 224


    informat

    specifies an informat that indicates the data type of the input values, but not
    how the values are read.


    Tip: Use the INFORMAT statement to associate an informat with a variable.


    See: SAS Informats in SAS Formats and Informats: Reference


    Example: "Example 3: Using Named Input with Another Input Style" on page 224


    start-column

    sifies the column that the INPUT statement uses to begin beginning in the input
    data records for the variable. The variable name does not have to begin here.


    -end-column

    determines the default length of the variable.


    .decimals

    specifies the number of digits to the right of the decimal if the input value
    does not contain an explicit decimal point.'
