  md: '# Example 4: Identifying the Current Output File


    This DATA step causes a file identification message to print in the log and assigns
    the value of the current output file to the variable MYOUT. The PUT statement,
    demonstrating the assignment of the proper value to MYOUT, writes the value of
    that variable to the output file:


    ```

    data_null_

    length myout $ 200;

    file-specification filename=myout;

    put myout=

    stop;

    run;

    ```


    The PUT statement writes a line to the current output file that contains the physical
    name of the file:


    ```

    MYOUT=your-output-file

    ```


    # Example 5: Dynamically Changing the Current Output File


    This DATA step uses the FILEVAR= option to dynamically change the currently opened
    output file to a new physical file.


    +   Write a report. Create a long character variable. Use DATA_NULL_ to write
    a report rather than create a data set. The LENGTH statement creates a variable
    with length long enough to contain the name of an external file:


    ```

    data_null_

    length name $ 200;

    ```


    +   Read an in-stream data line and assign a value to the NAME variable:

    input name $;


    +   Close the current output file and open a new one when the NAME variable changes.
    The file-specification is just a place holder; it can be any valid SAS name:

    file-specification filevar=name mod;\date=date();


    +   Append a log record to currently open output file:

    put ''records updated '' date date;


    +   Supply the names of the external files:

    datalines;

    external-file-1

    external-file-2

    external-file-3

    ;


    # Example 6: When the Output Line Exceeds the Line Length of the Output File


    Because the combined lengths of the variables are longer than the output line
    (80 characters), this PUT statement writes three separate records:


    ```

    file-specification linesize=80;

    put name $ 1-50 city $ 71-90 state $ 91-104;

    ```


    The value of NAME appears in the first record, CITY begins in the first column
    of the second record, and STATE in the first column of the third record.'
