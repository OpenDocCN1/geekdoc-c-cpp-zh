    # ENCODING = ''encoding-value''


    specifies the encoding to use when SAS is reading from or writing to an external
    file. The value for ENCODING indicates that the external file has a different
    encoding from the current session encoding.


    When you read data from an external file, SAS transcodes the data from the specified
    encoding to the session encoding. When you write data to an external file, SAS
    transcodes the data from the session encoding to the specified encoding


    Default: SAS assumes that an external file is in the same encoding as the session
    encoding


    Restriction: Not all device types support the encoding option. For more information,
    see the documentation for your operating system.


    See: For valid encoding values, see "Encoding Values in SAS Language Elements"
    in Chapter 20 of SAS National Language Support (NLS): Reference Guide.


    Examples:


    +   "Example 5: Specifying an Encoding When Reading an External File" on page
    99


    +   "Example 6: Specifying an Encoding When Writing to an External File" on page
    99


    # device-type


    specifies the type of device or the access method that is used if the fileref
    points to an input or output device or location that is not a physical file:


    # DISK


    specifies that the device is a disk drive.


    > Tip: When you assign a fileref to a file on disk, you are not required to specify
    DISK


    # DUMMY


    specifies that the output to the file is discarded.


    > Tip: Using DUMMY can be useful for testing.


    # GTERM


    indicates that the output device type is a graphics device that will receive graphics
    data.


    # PIPE


    specifies an unnamed pipe.


    > Note: Some operating environments do not support pipes.


    # PLOTTER


    specifies an unbuffered graphics output device.


    # PRINTER


    specifies a printer or printer spool file.


    # TAPE


    specifies a tape drive.'
