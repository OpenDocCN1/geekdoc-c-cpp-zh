- img_proc: true
  md: '+   formatted


    +   named


    A single PUT statement might contain any or all of the available output styles,
    depending on how you want to write lines.


    # Column Output


    With column output, the column numbers follow the variable in the PUT statement.
    These numbers indicate where in the line to write the following value:


    ```

    put name 6-15 age 17-19;

    ```


    These lines are written to the SAS log.


    Note: The ruled line is for illustrative purposes only; the PUT statement does
    not generate it.


    ```

    ------+1-------+2------+

    Peterson      21

    Morgan         17

    ```


    The PUT statement writes values for NAME and AGE in the specified columns.See
    "PUT Statement, Column" on page 306 for more information.


    # List Output


    With list output, list the variables and character strings in the order in which
    you want to write them. For example, this PUT statement


    ```

    put name age;

    ```


    writes the values for NAME and AGE to the SAS log:


    ```

    ------+1-------+2------+

    Peterson      21

    Morgan         17

    ```


    Note: The ruled line is for illustrative purposes only; the PUT statement does
    not generate it.


    See "PUT Statement, List" on page 311 for more information.


    # Formatted Output


    With formatted output, specify a SAS format or a user-written format after the
    variable name. The format gives instructions on how to write the variable value.
    Formats enable you to write in a nonstandard form, such as packed decimal, or
    numbers that contain special characters as commas. You can also override the default
    alignment of the formatted output by using -L, -C, or -R.


    For example, this PUT statement


    ```

    put name $char10. age 2.+1 mmddyy10;

    ```


    writes the values for NAME, AGE, and DATE to the SAS log:


    ```

    ------+1-------+2------+

    Peterson      21 07/18/1999

    Morgan         17 11/12/1999

    ```


    Note: The ruled line is for illustrative purposes only; the PUT statement does
    not generate it.


    Using a pointer of +1 inserts a blank space between the values of AGE and DATE.
    For more information, see "PUT Statement, Formatted" on page 308.'
  merge: -1
  pgno: 307
