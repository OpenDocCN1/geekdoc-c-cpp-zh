    ### Example 4: Reading Files That Contain Variable-Length Records

    This example shows how to use LENGTH,, in combination with the SVARYING, inform
    to read a file that contains variable-length records:


    ```

    data a;

    infile-file-specification length=linelen recl=510 pad;

    input firstvar @10; /* assign LINEL */

    varlen-linelen-10; /* Calculate ***** */

    input @11 secondvar $VARYing500, varlen;

    run;

    ```


    The following occurs in this DATA step:


    +   - The INFILE statement creates variable LINEL but does not assign a value.

    -* When the first INPUT statement executes, SAS determines the length of the record
    and assigns that value to the variable LINEL. The single trailing @ holds the
    record in the input buffer for the next INPUT statement.

    -* The assignment statement uses two known lengths (length of FIRSTVAR and the
    length of the entire record) to determine the length of VARLEN.

    -* The second INPUT statement uses the VARLEN value with the inform $VARYing500,
    to read the variable SECONDVAR.'
