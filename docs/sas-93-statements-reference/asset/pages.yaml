  md: '# Syntax


    INPUT <specification(s)><@ | @@>;


    # Without Arguments


    The INPUT statement with no arguments is called a null INPUT statement. The null
    INPUT statement


    +   brings an input data record into the input buffer without creating any SAS
    variables


    +   releases an input data record that is held by a trailing @ or a double trailing
    @.


    For an example, see “Example 2: Using a Null INPUT Statement” on page 205.


    # Arguments


    specification(s)


    can include


    variable


    names a variable that is assigned input values.


    (variable-list)


    specifies a list of variables that are assigned input values.


    **Requirement:** The (variable-list) is followed by an (informat-list).


    See: “How to Group Variables and Informats” on page 213


    $


    specifies to store the variable value as a character value rather than as a numeric


    value.


    **Tip:** If the variable is previously defined as character, $ is not required.


    **Example:** “Example 1: Using Multiple Styles of Input in One INPUT


    Statement” on page 204


    pointer-control


    moves the pointer to a specified line or column in the input buffer.


    See: “Column Pointer Controls” on page 195 and “Line Pointer Controls”


    on page 197


    column-specifications


    specifies the columns of the input record that contain the value to read.


    **Tip:** Informats are ignored. Only standard character and numeric data can


    read correctly with this method.


    See: “Column Input” on page 198


    **Example:** “Example 1: Using Multiple Styles of Input in One INPUT


    Statement” on page 204


    format-modifier


    allows modified list input or controls the amount of information that is


    in the SAS log when an error in an input value occurs.


    **Tip:** Use modified list input to read data that cannot be read with simple
    list


    input.


    See: “When to Use List Input” on page 217 and “Format Modifiers for Error


    Reporting” on page 197


    **Example:** “Example 6: Positioning the Pointer with a Character Variable”


    on page 207'
