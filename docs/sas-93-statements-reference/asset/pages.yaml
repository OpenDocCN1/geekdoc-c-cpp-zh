- img_proc: true
  md: '# %INCLUDE Statement 163


    # Rules for Using %INCLUDE


    +   - You can specify any number of sources in a %INCLUDE statement, and you can
    mix the types of included sources. Note, however, although it is possible to include
    information from multiple sources in one %INCLUDE statement, it might be easier
    to understand a program that uses separately %INCLUDE statements for each source.


    +   - The %INCLUDE statement must begin at a statement boundary. That is, it must
    be the first statement in a SAS job or immediately follow a semicolon ending another.
    A %INCLUDE statement cannot immediately follow a DATALINES, DATALINES4, CARDS,
    or CARD4 statement or PARMARDS or PARMCARDS4 statement in procedures that use
    those statements. However, you can include data lines with the %INCLUDE statement
    using one of these methods:


    +   - Make the DATALINES, DATALINES4, or CARDS, CARD4 statement the first line
    in the file that contains the data.


    +   - Place the DATALINES, DATALINES4, or CARDS, CARD4 statement in one file,
    and the data lines in another file. Use both sources in a single %INCLUDE statement.


    +   - Because %INCLUDE is a global statement and global statements are not executable,
    the %INCLUDE statement cannot be used in conditional logic.


    +   - The maximum line length is 32K bytes.


    # Comparisons


    The %INCLUDE statement executes statements immediately. The INCLUDE command brings
    the included lines into the Program Editor window but does not execute them. You
    must issue the SUBMIT command to execute those lines.


    # Examples


    # Example 1: Including an External File


    +   - This example stores a portion of a program in a file and includes it in
    a program to be written later. This program is stored in a file named MYFILE:


    ```

    data monthly;

    input x y month $;

    datalines;

    1 January

    2 February

    3 March

    4 April

    ;

    ;

    ```


    This program includes an external file named MYFILE and submits the DATA step
    that it contains before the PROC PRINT step executes:


    ```

    %include ''MYFILE'';

    proc print;

    run;

    ```'
