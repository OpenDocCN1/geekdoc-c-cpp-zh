    \nExecutes the previously entered SAS statements.\n\nValid in: Anywhere\nCategory:\
    \ Program Control\n\n# Syntax\n\n```\nRUN <CANCEL>;\n```\n\n# Without Arguments\n\
    \nWithout arguments, the RUN statement executes the previously entered SAS statements.\n\
