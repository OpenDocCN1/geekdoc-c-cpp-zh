    # KEEP Statement


    Specifies the variables to include in output SAS data sets.


    | Valid in: | DATA step |

    | Category: | Information |

    | Type: | Declarative |


    # Syntax


    ```

    KEEP variable-list;

    ```


    # Arguments


    variable-list

    specifies the names of the variables to write to the output data set.

    **Tip:** List the variables in any form that SAS allows.'
