  md: '# REDIRECT Statement 321


    program with the name of another SAS data set. When you specify OUTPUT, the REDI
    statement associates the name of the output data set with the name of another
    SAS data set.


    old-name

    specifies the name of the input or output data set in the source program.


    new-name

    specifies the name of the input or output data set that you want SAS to process
    for the current execution.


    # Details


    The REDI statement is available only when you execute a stored program. For more
    information about stored programs, see "Stored Compiled DATA Step Programs" in
    Chapter 28 of SAS Language Reference: Concepts.


    CAUTION:

    Use when you redirect data sets. The number and attributes of variables in the
    input data sets that you read with the REDI statement should match the number
    and attributes of variables in the input data sets in the MERGE, SET, MODIFY,
    or UPDATE statements of the source code. If the type attributes differ, the stored
    program stops processing and an appropriate error message is written to the SAS
    log. If the variable length of the variable in the source code data determines
    the length of the variable in the redirected data set. Extra variables in the
    redirected data sets cause the stored program to stop processing and an error
    message is written to the SAS log.


    The DROP or KEEP data set options can be added in the stored program if the input
    data set that you read with the REDI statement has more variables than the in
    data set used to compile the program.


    # Comparisons


    The REDI statement applies only to SAS data sets. To redirect input and output
    stored in external files, include a FILENAME statement to associate the fileref
    in the source program with different external files.


    # Example: Executing a Stored Program


    This executes the stored program called STORED.SAMPLE. The REDI statement specifies
    the source of the input data as BASE.SAMPLE. The output data set from this execution
    of the source is redirected and stored in a data set named SUMS.SAMPLE.


    ```

