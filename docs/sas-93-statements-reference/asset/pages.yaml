  md: '# ## FILENAME Statement, SFTP Access Method


    Enables you to access remote files by using the SFTP protocol.


    | Valid in: | Anywhere |

    | Category: | Data Access |


    # ### Syntax


    ```

    FILENAME fileref SFTP ''external-file'' <sftp-options>;

    ```


    # ### Arguments


    fileref is a valid fileref.


    > **Tip:** The association between a fileref and an external file lasts only for
    the duration of the SAS session or until you change it or discontinue with another
    FILENAME statement. You can change the fileref for a file as often as you want.


    # ### SFTP


    specifies the method that enables you to Secure File Transfer Protocol (SFTP)
    to read from or write to a file from any host that you can connect to a network
    with an OpenSSH SSH server running.


    # ### ''external-file''


    specifies the physical name of an external file that you want to read from or
    write to. The physical name is the name that is recognized by the operating environment.


    Operating environment:


    For details about specifying the physical names of external files, see the SAS
    documentation for your operating environment.


    # ### Tips:


    +   - If you are not transferring a file but performing a task such as retrieving
    a directory listing, you do not need to specify an external file. Instead, put
    empty quotation marks in the statement.


    You can associate a fileref with a single file or with an aggregate file storage
    location.


    # ### sftp-options


    specifies details that are specific to your operating environment such as file
    attributes and processing attributes.


    **Operating environment:** For more information about some of these SFTP options,
    see the SAS documentation for your operating environment.


    **See:** "SFTP Options" on page 128


    # ### SFTP Options


    sftp-options can be any of the following values:'
