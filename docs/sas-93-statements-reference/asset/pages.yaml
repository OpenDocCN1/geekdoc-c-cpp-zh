    # SYSECHO Statement


    Fires a global statement event and passes a text string back to the IOM client.


    **Valid in:** Anywhere


    **Category:** Program Control


    **Restriction:** Has an effect only in objectserver mode


    # Syntax


    ```

    SYSECHO "text">;

    ```


    # Without Arguments


    Using SYSECHO without arguments sends a global statement event to the\NIOM client.


    # Arguments


    ```

    "text"

    ```


    specifies a text string that is passed back to the IOM client.


    **Range:** 1-64 characters


    **Requirement:** The text string must be enclosed in double quotation marks.


    # Details


    The SYSECHO statement enables IOM clients to manually track the progress of a

    segment of a submitted SAS program.


    When the SYSECHO statement is executed, a global statement complete event

    generated and, if specified, the text string is passed back to the IOM client.


    # TITLE Statement


