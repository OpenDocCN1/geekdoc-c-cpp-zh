    OUTREP=

    sifies the data representation for the SAS library, which is the form in which
    data

    is stored in a particular operating environment. Different operating environments
    use

    different standards or conventions for storing floating-point numbers (for example,\IEEE
    or IBM mainframe); for character (for example, ASCII or EBCDIC);

    for the ordering of bytes in memory (for example, Big Endian or Little Endian);

    for word alignment (for example, 4-byte boundaries or 8-byte boundaries); for
    integer

