  md: '# FILENAME Statement, FTP Access Method 125


    ```

    filename viewdata ftp ''sluggo.data''

    user=''sluggo'' host=''zoshost''

    s370v prompt rcmd=''site rdw''

    data mydata view=mydata; /* Create a view */

    infile viewdata;

    input x xebcdics;


    run;

    proc print mydata; /* Print the data */

    run;

    ```


    # Example 5: Anonymously Logging In to FTP


    This example shows how to log in FTP anonymously, if the host accepts anonymous
    logins.


    Note: Some anonymous FTP servers require a password. If required, your e-mail
    address is usually used. See PASS= option on page 120 under "FTP Options."


    ```

    filename anon ftp ''ls host=130.96.6.1''

    user=''anonymous'';

    data_null;

    infile anon;

    input;

    list;


    run;

    ```


    Note: The quotation marks following the argument FTP are empty. A filename is
    needed only when transferring a file, not when routing a command. The quotation
    marks, however, are required.


    # Example 6: Using an Encoded Password


    This example shows how to use an encoded password in the FILENAME statement.


    In a separate SAS session, use the PWENCODE procedure to encode your password
    and make note of the output.


    ```

    proc pwencode in="MyPass1";

    run;

    ```


    The following output appears in the SAS log:


    ```

    (sas001) TX1QXZnM2==

    ```


    You can now use the entire encoded password string in your batch process.


    ```

    filename myfile ftp ''sales'' cd=/u/kudzu/mydata''

    user=''tjbarry'' host=''hp720.hp.mycompany.com''

    pass="sas001 TX1QXZnM2="

    ```


    # Example 7: Importing a Transport Data Set


    This example uses the CIPORT procedure to import a transport data set from a named
    host1. The new data set will reside locally in SASUSER library. Note that user
    and password can be SAS macros. If you specify a fully qualified data name, then
    use double quotation marks and single quotation marks. Otherwise, the system will
    append the prefix to the name that you specify.


    ```

    #let user=calvin

    #let pw=XXXX;

    filename inp ftp "calvin.mat1.cpo" user="&user"

    ```'
