  md: '# TITLE Statement 363


    +   - Follow #BYVAL with a delimiting character, either a space or other nonalphanumeric
    character (for example, a quotation mark) that ends the text string.

    - If you want the #BYVAL substitution to be followed immediately by other text,
    with no delimiter, a trailing dot (as with macro variables).


    Specify the variable with one of the following:


    ```

    n

    ```


    specifies the variable in the BY statement #BYVAL should use. The value of n indicates
    the position of the variable in the BY statement.


    **Example:** #BYVAL2 specifies the second variable in the BY statement.


    ```

    variable-name

    ```


    names the BY variable.


    **Tip:** variable-name is not case sensitive.


    **Example:** #BYVAL(YEAR) specifies the BY variable, YEAR.


    ```

    #BYVAR|#(variable-name)

    ```


    substitutes the name of the BY variable or label that is associated with the variable
    (whatever the BY line would normally display) for #BYVAR in the text string and
    displays the name or label in the title.


    Follow these rules when you use #BYVAR in the TITLE statement of a PROC step:


    +   - Specify the variable that used by #BYVAR in the BY statement.

    - Insert #BYVAR in the specified text string at the position where you want the
    substitution to appear.

    - Follow #BYVAR with a delimiting character, either a space or other nonalphanumeric
    character (for example, a quotation mark) that ends the text string.

    - If you want the #BYVAR substitution to be followed immediately by other text,
    with no delimiter, a trailing dot (as with macro variables).


