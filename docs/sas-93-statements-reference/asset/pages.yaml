  md: '# Syntax


    Form 1: LIBNAME libref<engine> ''SAS-library''

    <options> | <engine/host-options>;


    Form 2: LIBNAME libref CLEAR | _ALL, CLEAR;


    Form 3: LIBNAME libref LIST | _ALL_ LIST;


    Form 4: LIBNAME libref<engine> <library-specification-1> <...library-specification-n>

    <options>;


    # Arguments


    libref

    is a short name or "nickname" for the aggregate storage location where your

    SAS files are stored. Is it any SAS name when you are assigning a new libref.
    When

    y are disassociating a libref from a SAS library or when you are listing attributes,

    specify a libref that was previously assigned.


    Range: 1 to 8 bytes


    Tip: The association between a libref and a SAS library lasts only for the duration
    of

    t SAS session or until you change it or discontinue it with another LIBNAME

    statement.


    ''SAS-library''

    be the physical name for the SAS library. The physical name is the name that is

    recognized by the operating environment. Enclose the physical name in single or

    double quotation marks.


    Operating environment: For details about specifying the physical names of files,

    see the SAS documentation for your operating environment.


    library-specification

    is two or more SAS libraries are specified by physical names, previously

    assigned librefs, or a combination of the two. Separate each specification with
    either

    a a blank or a comma and enclose the entire list in parentheses.


    ''SAS-library''

    is the physical name of a SAS library, enclosed in quotation marks.


    libref

    is the name of a previously assigned libref.


    Restriction: When concatenating libraries, you cannot specify options that are

    specific to an engine or an operating environment.


    See: "Example: 2: Logically Concatenating SAS Libraries" on page 242


    engine


    is an engine name.


    Tip: Usually, SAS automatically determines the appropriate engine to use for

    access the files in the library. If you want to create a new library with

    other than the default engine, then you can override the automatic

    selection.


    See: For a list of valid engines, see the SAS documentation for your operating

    environment. For more background information, see Chapter 35. "SAS Engines,"

    in SAS Language Reference: Concepts.


    CLEAR

    dissociates one or more currently assigned librefs.'
