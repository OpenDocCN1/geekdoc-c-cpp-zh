- img_proc: true
  md: '# Arguments


    label


    specifies a statement label that identifies the LINK destination. You must specify
    the label argument.


    # Details


    The LINK statement tells SAS to jump immediately to the statement label that is
    indicated in the LINK statement and to continue executing statements from that
    point until a RETURN statement is executed. The RETURN statement sends program
    control to the statement immediately following the LINK statement.


    The LINK statement and the destination must be in the same DATA step. The destination
    is identified by a statement label in the LINK statement.


    The LINK statement can branch to a group of statements that contain another LINK
    statement. This arrangement is known as nesting. To avoid infinite looping, SAS
    has set a default number of nested LINK statements. You can have up to 10 LINK
    statements with no intervening RETURN statements. When more than one LINK statement
    has been executed, a RETURN statement tells SAS to return to the statement that
    follows the last LINK statement that was executed. However, you can use the /STACK
    option in the DATA statement to increase the number of nested LINK statements.


    # Comparisons


    The difference between the LINK statement and the GO statement is in the action
    of a subsequent RETURN statement. A RETURN statement after a LINK statement returns
    execution to the statement that follows LINK. A RETURN statement after a GO TO
    returns execution to the beginning of the DATA step, unless a LINK statement precedes
    GO. In that case, execution continues with the first statement after LINK. In
    addition, a LINK statement is usually used with an explicit RETURN statement,
    whereas a GO statement is often used without a RETURN statement.


    When your program executes a group of statements at several points in the program,
    using the LINK statement simplifies coding and makes program logic easier to follow.
    If your program executes a group of statements at only one point in the program,
    using DO-group logic rather than LINK-RETURN logic is simpler.


    # Example: Diverting Program Execution


    In this example, the value of variable TYPE is aluv, the LINK statement diverts
    program execution to the statements that are associated with the label CALCU.
    The program executes until it encounters the RETURN statement, which sends program
    back to the first statement that follows LINK. SAS executes the assignment statement,
    writes the observation, and returns to the next record. When the value of TYPE
    is not aluv, SAS executes the assignment statement, writes the observation, and
    returns to the top of the DATA step.


    ```

    data hydro;

    input type $ depth ;$n/* link to label calcu */

    if type=''aluv'' then link calcu;

    date=today();

    /* return to top of step */

    return;

    calcu: if statement=''site_1''

    then elevat=6650-depth;

    ```'
