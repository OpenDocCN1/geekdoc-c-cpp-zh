    | 4 |

    | 5 resetline; |

    | 1 data b; |

    | 2 b=2; |

    | 3 run; |

    | 4 |

    | NOTE: The data set WORK.B has 1 observations and 1 variables.

    NOTE: DATA statement used (Total process time):

    | real time 0.00 seconds

    | cpu time 0.00 seconds |'
