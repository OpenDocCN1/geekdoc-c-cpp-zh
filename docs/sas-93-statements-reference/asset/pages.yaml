  md: '# FILENAME Statement, FTP Access Method 127


    The ftppout1 is written to /user/proj2/ftpout1.DATA. Note that a member type of
    DATA is appended to the ftppout1 file because the FILEext was specified in the
    output file''s FILENAME statement. For more information, see the FILEext on page
    119.


    Note: The DIR option is not needed for ODS destinations.


    The following example writes an output file and transfers it to ODS-specified
    destination. The DIR option is not needed.


    ```

    filename output ftp="user/ftdir/" host="host.fyi.company.com" user="userid"

    pass="userpass" recfm=debug;\ods html body=body.html path=output;

    proc print data=sashelp.class;run;

    ```


    To export multiple files to a remote directory, the DIR option must be specified
    in the FILENAME statement. Accordingly, when creating external graph files with
    the ODS HTML destination, FILENAME statements are needed: one for the HTML files,
    and one for the graph files. The following example illustrates the need for two
    FILENAME statements.


    ```

    filename output1 ftp="filetext" host="host.unx.company.com"

    user="userid" pass="userpass" recfm=debug;

    filename output2 ftp="user/dir" filetext host="host.unx.company.com"

    user="userid" pass="userpass" recfm=debug;\ods html body=body.html path=output2

    frame="frames.html" contents="contents.html";

    proc gstit;

    run;

    guit;

    ```


    # Example 11: Using a Proxy Server


    This example uses a proxy server with the FTP access method. The user ID and password
    are sent via the proxy server.


    ```

    test ftp ''ls''

    host="proxy.server.xxx.com"

    user="userid@ftpservername"

    pass="xxxxxx"

    cd="pubdir/"

    data=null;

    infile test truncate;

    input $256;

    put a=;

    run;

    ```


