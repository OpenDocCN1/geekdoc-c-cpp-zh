  md: '# Details


    The ABORT statement causes SAS to stop processing the current DATA step. What
    happens depends on


    +   - the method that you use to submit your SAS statements

    - the arguments that you use with ABORT

    - your operating environment.


    The ABORT statement usually appears in a clause of an IF-THEN statement or a SELECT
    statement that is designed to stop processing when an error condition occurs.


    Note: The return code generated by the ABORT statement is ignored by SAS if the
    system option ERRORABEND is in effect.


    Note: When you execute an ABORT statement in a DATA step, SAS does not use data
    sets that were created in the step to replace existing data sets with the name.


    # Operating Environment Information


    The only difference between the ABEND and RETURN options is that with ABEND further
    action is based on how your operating environment and site treats jobs that end
    abnormally. RETURN returns a condition that indicates an error.


    # Comparisons


    +   - When you use the SAS windowing environment or interactive line mode, the
    ABORT statement and the STOP statement both stop processing. The ABORT statement
    sets the value of the automatic variable _ERROR_ to 1, and the STOP statement
    does not.

    - In batch or noninteractive mode, the ABORT and STOP statements also have different
    effects. Both stop processing, but only ABORT sets the value of the automatic
    variable _ERROR_ to 1. Use the STOP statement, therefore, when you want to stop
    only the current DATA step and continue processing with the next step.


    # Example: Stopping Execution of SAS


    This example uses the ABORT statement as part of an IF-THEN statement to stop
    execution of SAS when it encounters a data value that would otherwise cause a
    division-by-zero condition.


    ```

    if volume=0 then abort 255;

    density=mass/volume;

    ```


    The n value causes SAS to return the condition code 255 to the operating environment
    when the ABORT statement executes.


    # See Also


    Statements:


    +   - "STOP Statement" on page 357


