  md: '# Arguments


    where-expression

    isis an arithmetic or logical expression that generally consists of sequence of

    operands and operators.


    Tips:

    The operands and operators described in the next several sections are also valid

    for the WHERE data option.


    You can specify multiple where-expressions.


    logical-operator

    can be AND, AND NOT, OR, or OR NOT.


    # Details


    The Basics

    Using the WHERE statement may improve the efficiency of your SAS programs

    because SAS is not required to read all observations from the input data set.


    The WHERE statement cannot be executed conditionally. That is, you cannot use
    it as

    part of IF-THEN statement.


    WHERE statements can contain multiple WHERE expressions that are joined by logical

    operators.


    Note: Using indexed data sets can significantly improve performance when you

    use WHERE expressions to access a subset of the observations in a SAS data set.

    See "Understanding SAS Indexes" in Chapter 26 of SAS Language Reference: Concepts
    for a complete discussion of WHERE-expression processing with indexed data sets
    and a list of guidelines to consider before you index your SAS data sets.


    # In DATA Steps


    The WHERE statement applies to all data sets in the preceding SET, MERGE,

    MODIFY, or UPDATE statement, and variables that are used in the WHERE statement

    appear in all of those data sets. You cannot use the WHERE statement with the

    POINT= in the SET and MODIFY statements.


    You can apply OBS and FIRSTOBS processing to WHERE processing. For more

    information, see "Processing a Segment of Data That Is Conditionally Selected"
    in

    Chapter 11 of SAS Language: Concepts.


