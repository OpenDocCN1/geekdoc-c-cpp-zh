    # When Data Contains Quotation Marks


    When you use the DSD option in an INFILE statement, which sets the delimiter to
    a comma, the INPUT statement removes quotation marks before a value is written
    to a variable. When you also use the tilde (-) modifier in an INPUT statement,
    the INPUT statement maintains quotation marks as part of the value.


    # Examples


    Example 1: Reading Unaligned Data with Simple List Input

    The INPUT statement in this DATA step uses simple list input to read the input
    data records:


    ```

    data scores;

    input name $ score2 score3 team $;

    datalines;

    Joe 11 32 76 red

    Mitchel 13 29 82 blue

    Sun 14 27 74 green

    ```


    The next INPUT statement reads only the first four fields in the previous data
    lines, which demonstrates that you are not required to read all the fields in
    the record:

    input name $ score1 score2 score3;


    Example 2: Reading Character Data That Contains Embedded Blanks


    The INPUT statement in this DATA step uses the &format modifier with list input
    to read character values that contain embedded blanks.'
