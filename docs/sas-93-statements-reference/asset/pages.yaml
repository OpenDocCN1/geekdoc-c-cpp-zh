- img_proc: true
  md: '# Details


    The KEEP statement causes a DATA step to write only the variables that you specify
    in one or more SAS data sets. The KEEP statement applies to all SAS data sets
    that are created within the same DATA step and can appear anywhere in the step.
    If no KEEP or DROP statement appears, all data sets that are created contain all
    variables.


    Note: Do not use both the KEEP and DROP statements within the same DATA step.


    # Comparisons


    +   - The KEEP statement cannot be used in SAS PROC steps. The KEEP= data set
    option can.


    +   - The KEEP statement applies to all output data sets that are named in the
    DATA statement. To write different variables to different data sets, you must
    use the KEEP= data set option.


    +   - The DROP statement is a parallel statement that specifies variables to omit
    from the output data set.


    +   - The KEEP and DROP statements select variables to include in or exclude from
    output data sets. The subsetting IF statement selects observations.


    +   - Do not confuse the KEEP statement with the RETAIN statement. The RETAIN
    statement causes SAS to hold the value of a variable from one iteration to the
    next iteration. The KEEP statement does not affect the value of variables but
    only specifies which variables to include in any output data sets.


    # Examples


    # Example 1: KEEP Statement Basic Usage


    These examples show the correct syntax for listing variables in the KEEP statement:


    ```

    keep name address city state zip phone;

    keep repl-rep5;

    ```


    # Example 2: Keeping Variables in the Data Set


    This example uses the KEEP statement to include only the variables NAME and AVG
    in the output data set. The variables SCORE1 through SCORE20, from which AVG is
    calculated, are not written to the data set AVERAGE.


    ```

    data average;

    keep avg;

    infile file-specification;

    input name $ score1-score20;

    avg=mean(of score1-score20);

    run;

    ```


    # See Also


    Data Set Options:


    +   - “KEEP= Data Set Option” in SAS Data Set Options: Reference'
  merge: -1
