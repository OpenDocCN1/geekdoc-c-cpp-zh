    # SERVER


    sets the TCP/IP socket to a listening socket, thereby enabling the system to act
    as a server that is waiting for a connection.


    > Tip: The system accepts all connections serially; only one connection is active
    at any time.


    See the RECONN= option on page 135 under TCP/IP Options.


    # tcpip-options


    specifies details that are specific to your operating system such as the number
    of connections that the server will accept.


    # Operating Environment Information


    For more information about some of these TCP/IP options, see the SAS documentation
    for your operating environment


    See: "TCP/IP Options" on page 134


    # TCP/IP Options


    tcpip-options can be any of the following values:


    +   - BLOCKSIZE=

    where blocksize is the size of the socket data buffer in bytes.


    Default: 8192


    # ENCODING=encoding-value


    specifies the encoding to use when reading from or writing to the socket. The
    value for ENCODING= indicates that the socket has a different encoding from the
    current session encoding.


    When you read data from a socket, SAS transcodes the data from the specified encoding
    to the session encoding. When you write data to a socket, SAS transcodes the data
    from the session encoding to the specified encoding.


    For valid encoding values, see "Encoding Values in SAS Language Elements" in Chapter
    20 of SAS National Language Support (NLS): Reference Guide.


    # LRECL=lrecl


    where lrecl is the logical record length.


    Default: 256


    Interaction: Alternatively, you can specify a global logical record length by
    using the "LRECL= System Option" in SAS System Options: Reference.


    # RECFM=recfm


    where recfm is one of three record formats:


    +   - F

    is fixed record format. Thus, all records are of size LRECL with no line delimiters.
