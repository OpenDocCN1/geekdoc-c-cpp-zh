    # Comment Statement


    Specifies the purpose of the statement or program.


    **Valid in:** Anywhere

    **Category:** Log Control


    # Syntax


    ```

    *message;;

    or

    /*message*/**

    ```


    # Arguments


    *message;

    specifies the text that explains or documents the statement or program.

    **Range:** These comments can be any length and are terminated with a semicolon.

    **Restrictions:**

    These comments must be written as separate statements.

    These comments cannot contain internal semicolons or unmatched quotation marks.

    A macro statement or macro variable reference that is contained inside this form
    of comment is processed by the SAS macro facility. This form of comment cannot
    be used to hide text from the SAS macro facility.


    **Tip:** When using comments within a macro definition or to hide text from the
    SAS macro facility, use this style:

    /* message */


    *message*

    specifies the text that explains or documents the statement or program.

    **Range:** These comments can be any length.

    **Restriction:** This type of comment cannot be nested.

    **Windows specifies:** If you use the Enhanced Editor, you can comment out a block
    of code by highlighting the block and pressing CTRL-/ (forward slash). To uncomment
    a block of code, highlight the block and press CTRL-SHIFT/- (forward slash).'
