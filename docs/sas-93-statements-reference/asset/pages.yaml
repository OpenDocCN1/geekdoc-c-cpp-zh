  md: '# Examples


    # Example 1: Using Statements


    ```

    select (a);

    when (1) x=x*10;

    when (2);

    when (3,4,5) x=x*100;

    otherwise;

    end;

    ```


    # Example 2: Using DO Groups


    ```

    select (payclass);

    when (''monthly'') amt=salary;

    when (''hourly'')

    do;

    namt=hrlywage*min(hrs,40);

    if hrs>40 then put ''CHECK TIMECARD'';

    end; /* end of do */

    other put ''PROBLEM OBSERVATION'';

    end; /* end of select */

    ```


    # Example 3: Using a Compound Expression


    ```

    select;

    when (mon in (''JUN'', ''JUL'', ''AUG''))

    and temp70 put ''SUMMER '' mon;

    when (mon in (''MAR'', ''APR'', ''MAY''))

    put ''SPRING '' mon=;

    other put ''FALL OR WINTER '' mon=;

    ```


    # Example 4: Making Comparisons for Equality


    ```

    /* INCORRECT usage to select value of 2 */

    select (x);

    /* evaluates T/F and compares for

    /* equality with x */

    when (x=2) put ''two'';

    end;

    /* correct usage */

    select(x);

    /* compares 2 to x for equality */

    when (2) put ''two'';

    end;

    /* correct usage */

    select;

    /* compares 2 to x for equality */

    when (x=2) put ''two'';

    end;

    ```


