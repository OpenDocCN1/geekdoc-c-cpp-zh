- img_proc: true
  md: '# LASTCARD Statement 257


    data, the values for subsequent observations in the SAS data set may be incorrect.

    Using LASTCARD prevents SAS from reading a record from the next group when the
    current group has fewer records than SAS expected.


    LASTCARD is most useful when the input data have a fixed number of records per
    observation and each record for an observation contains an identification variable
    that has the same value. LASTCARD usually appears in conditional processing such
    as in the THEN clause of an IF-THEN statement, or in a statement in a SELECT group.


    # When LASTCARD Executes


    When LASTCARD executes, SAS takes several steps:


    +   1. Writes three items to the SAS log: a lost card message, a ruler, and all
    the records it read in its attempt to build the current observation.

    2. Discards the first record in the group of records being read, does not write
    an observation, and returns processing to the beginning of the DATA step.

    3. Does not increment the automatic variable _N by 1. (Normally, SAS increments
    _N by 1 at the beginning of each DATA step iteration.)

    4. Attempts to build an observation by beginning with the second record in the
    group, and reads the number of records that the INPUT statement specifies.

    5. Repeats steps 1 through 4 when the IF condition for a lost card is still true.
    To make the log more readable, SAS prints the message and ruler only once for
    a given group of records. In addition SAS prints each record only once, even if
    a record is used in successive attempts to build an observation.

    6. Builds an observation and writes it to the SAS data set when the IF condition
    for a lost card is no longer true.


    # Example: Resynchronizing Input Data


    This uses the LASTCARD statement in a conditional construct to identify missing
    data records and to resynchronize the input data:


    ```

    data inspect;

    input 1-3 age 8-9 #2 id2 1-3 loc

    #3 id3 1-3 wt;

    if id ne id2 or id ne id3 then

    do;

    put ''DATA RECORD ERROR: '' id=id2=id3=;

    lastcard;

    end;

    datalines;

    301 32

    301 61432

    301 127

    302 61

    302 83171

    400 46

    409 23145

    400 197

    411 53

    411 99551

    411 139

    ;

    ```'
