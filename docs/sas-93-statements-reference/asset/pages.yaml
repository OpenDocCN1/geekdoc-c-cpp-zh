- img_proc: true
  md: '# Example 2: Creating a Nested Catalog Concatenation


    After you create a concatenated catalog, you can use CATNAME to combine your concatenation
    with other catalogs or other concatenated catalogs. Nested catalog concatenation
    is useful, because you can use a single ref to access many different catalog combinations.


    ```

    libname local ''my_dir'';

    libname main ''public_dir'';

    catname private_catalog (local.my_application_code

    local.my_frames

    local.my_formats);

    catname combined_catalogs (private_catalog

    main.public_catalog);

    ```


    In the above EXAMPLE, you could work on private copies of your application entries
    using PRIVATE_CATALOG. If you want to see how your entries function when they
    are combined with the public version of the application, you can use COMBINED_CATALOGS.


    # See Also


    Statements:


    +   * “FILENAME Statement” on page 93

    * “FILENAME Statement, CATALOG Access Method” on page 106

    * “LIBNAME Statement” on page 233 for a discussion of implicitly concatenating
    SAS catalogs


