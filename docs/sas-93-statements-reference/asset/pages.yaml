    # DM Statement


    Submits SAS Program Editor, Log, Procedure Output or text editor commands as SAS
    statements.


    | Valid in: | Anywhere |

    | Category: | Program Control |


    # Syntax


    DM <window>''command(s)'' <window> <CONTINUE>;


    # Arguments


    window


    specifies the active window.

    Default: If you omit the window name, SAS uses the Program Editor window as the
    default.


    ''command(s)''


    can be any windowing command or text editor command and must be enclosed in single
    quotation marks. If you want to issue several commands, separate them with semicolons.


    CONTINUE


    causes SAS to execute any SAS statements that follow the DM statement in the Program
    Editor window and, if a windowing command in the DM statement called a window,
    makes that window active.


    Note: For example, if you specify Log as the active window and have other SAS
    statements that follow the DM statement (for example, in an autoexec file), those
    are not submitted to SAS until control returns to the SAS interface.


    Tip: Any windows that are activated by the SAS statements (such as the Output
    window) appear before the window that is to be active.


    # Details


    Execution occurs when the DM statement is submitted to SAS. You can use this statement
    to modifying the window environment:


    +   - Change SAS interface features during a SAS session.'
