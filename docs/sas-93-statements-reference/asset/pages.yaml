    # ### Example 8: Transporting a SAS Library


    This example uses the CPORT procedure to transport a SAS library to a host named
    mvhost1 for user calvin. It will create a new sequential file on the host called
    userid.mat64.cpo with the recfm of fb, lrecl of 80, and blocksize of 8000.


    ```

    filename inp ftp="mat64.cpo" user=calvin

    pass="xxxx" host=''mvhost1''

    lrecl=80 recfm=f blocksize=8000

    rcmd=''site blocksize=800 recfm=fb lrecl=80;

    proc copy library=mylib infile=inp;

    run;

    ```


    # ### Example 9: Creating a Transport Library with XPORT Engine


    This example creates a new SAS library on host mvhost1. The FILENAME statement
    assigns a filer to the new data set. Note the use of the RCMD option to specify
    important file attributes. The LIBNAME statement uses a library that is the same
    as the filer and assigns to the XPORT engine. The PROC COPY step copies all data
    sets from the SAS library that are referenced by MYLIB to the XPORT engine. Output
    from the PROC CONTENTS steps confirms that the query was successful:


    ```

    filename inp ftp="mat65.cpo" user=calvin

    pass="xxxx" host=''mvhost1''

    lrecl=80 recfm=f blocksize=8000

    rcmd=''site blocksize=8000 recfm=fb lrecl=80'';

    libname mylib ''SAS-library'';

    filename inp export;

    proc copy in=mylib out=inp data;

    run;

    proc contents data=inp_all_;

    run;

    ```


    > Note: For more information about the XPORT engine, see "Transport Engine" in
    Chapter 35 of SAS Language Reference. Concepts and "XPORT Engine Limitations"
    in Chapter 4 of Moving and Accessing SAS Files.


    # ### Example 10: Reading and Writing from Directories


    This example reads the file ftpmeml from a directory on a UNIX host, and writes
    the file ftppout1 to a different directory on another UNIX host.


    ```

    filename indir ftp ''/user/proj2/dir/'' DIR

    host=''host1.mycompany.com''

    user="xxxx"; prompt;

    filename outdir ftp ''/user/proj2/dir'' DIR FILEEXT

    host=''host2.mycompany.com''

    user="xxxx"; prompt;

    data_null;

    inindir (ftpmeml) truncate;

    input;

    file outdir(ftpout1);

    put infile_;

    run;

    ```'
  merge: -1
