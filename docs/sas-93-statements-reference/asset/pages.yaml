    ample, byte-swapped or not)


    By default, SAS creates a new data set using the data representation of the

    CPU that is running SAS. Specifying the OUTREP option enables you to create a

    SAS set with a different data representation. For example, in a UNIX

    environment, you can create a SAS data set that uses a Windows data representation.

    More information about compatibility and data representation, see Chapter 32,

    "Processing Data Using Cross-Environment Data Access (CEDA)," in SAS

