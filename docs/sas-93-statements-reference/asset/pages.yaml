    # Details


    You can send electronic mail programmatically from SAS using the EMAIL (SMTP)
    access method. To send e-mail to an SMTP server, you first specify the SMTP e-mail
    interface with EMAILS system, use the FILENAME statement to specify the EMAIL
    device type, and then submit SAS statements in a DATA step or in SCL code. The
    e-mail access method has several advantages:


    +   - You can use the logic of the DATA step or SCL to submit e-mail distribution
    on a large set of e-mail addresses.

    - You can automatically send e-mail upon completion of a SAS program that you
    submit for batch processing.

    - You can direct output through e-mail based on the results of processing.


    In general, DATA step or SCL code that sends e-mail has the following components:


    +   - a FILENAME statement with the EMAIL device-keyword

    - e-mail options specified in the FILENAME or FILE statement that indicate e-mail
    recipients, attached file or files, and so on

    - PUT statements that define the body of the message


    +   - PUT statements that specify e-mail details (of the form *EM directive*)
    that override the e-mail options (for example, TO=, CC=, ATTACH=) and perform
    actions such as end, abnormally, or start a new message.


    You can encode e-mail passwords. When a password is PWENCODE, the output string
    includes a tag that identifies the string as being encoded. An example is ''*sas01''.
    The tag indicates the encoding method. Encoding a password allows you to avoid
    e-mail access authentication with a password in plaintext. Passwords that start
    with ''*sas trigger an attempt to be decoded. If the decoding succeeds, then decoded
    password is used. If the decoding fails, then password is used as is. For more
    information, see PROC PWCODE in the Base SAS Guide.


    For e-mail messages that you send to another time zone, you can use the EMAILCOFFSET=
    system option to ensure that the e-message has the UTC offset that represents
    your local time. You might use this option if the time on your computer is not
    a time that uses a UTC offset or your computer does not account for daylight savings.
    The UTC offset specified in the EMAILCOFFSET= system option adds or replaces a
    UTC offset to the e-mail: Header field. For more information, see ''EMAILCOFFSET
    Option'' in SAS System Options: Reference.


    # PUT Statement Syntax for EMAIL (SMTP) Access Method


    In the DATA step, after using the FILE statement to define your e fileref as,
    use PUT statements to define the body of the message. For example,


    ```

    filename mymail email ''martin@site.com'' subject=''Sending Email'';

    ```'
  merge: -1
