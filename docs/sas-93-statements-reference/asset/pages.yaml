    # Alias:


    BINARY


    The BINARY option overrides the value of RECFM= in the FILENAME FTP statement,
    if specified, and forces a binary transfer.


    is stream-record format. Data is transferred in image (binary) mode.


    **Interaction:** The amount of data that is read is controlled by the current
    LRECL value or by the NBYTE variable in the INFILE statement. NBYTE= option specifies
    a variable that is equal to the amount of data to be read. This amount must be
    less than or equal to LRECL.


    **See:** The NBYTE= option on page 173 in the INFILE statement.


    is variable-record format (the default). In this format, records have varying
    lengths, and they are transferred in text (stream) mode.


    **Interaction:** Any record larger than LRECL is truncated.


    **Tip:** If you are using files with the IBM 370 Variable format or the IBM 370
    Spanned Variable format, you might want to use the S370V or S370VS instead of
    the RECFM= option. See S370V and S370VS''s below.


    Default: V


    **Interaction:** If you specify the RECFM= option and the S370V or S370VS option,
    then SAS ignores the RECFM= option.


    # RHELP


    issues the HELP command to the FTP server. The results of this command are returned
    as records.


    # RSTAT


    issues the RSTAT command to the FTP server. The results of this command are returned
    as records.


    # SAVEUSER


    saves the user ID and password after the user ID and password prompt are successfully
    executed.


    **Interaction:** The user ID and password are saved only for the duration of the
    SAS session or you change the association between the fileref and the external
    file, or discontinue with another FILENAME statement.


    # S370V


    indicates the file being read is in IBM 370 variable format.


    **Interaction:** If you specify this option and the RECFM= option, then SAS ignores
    the RECFM= option.


    # Tips:


    The data is transferred in image or binary format and is in local data format.
    Thus, you must use appropriate SAS informats to read the data correctly on non-EBCDIC
    hosts.


    Use the `rdw=site rdw` option when you transfer a z/OS data set with a variable-record
    format to preserve the record descriptor `rdw` of each record. By default, most
    FTP servers remove the rdw that exists in each record before it is transferred.'
