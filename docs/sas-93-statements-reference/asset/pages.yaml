  md: '# DATA Statement 49


    See: For more information about the types of SAS data names and when to use each
    type, “Names in the SAS Language” in Chapter 3 of SAS Language

    Reference: Concepts.


    (data-set-options) specifies optional arguments that the DATA step applies when
    it writes observations to the output data set.


    See: SAS Data Set Options: Reference for a definition and list of data set options.

    Example: “Example 1: Creating Multiple Data Files and Using Data Set Options”
    on page 53


    / DEBUG enables you to debug your program interactively by helping to identify
    logic errors, and sometimes data errors.


    / NESTING specifies that a note will be printed to the log for the beginning and
    end of each DO-END and SELECT-END nesting level. This option enables you to debug
    mismatched DO-END and SELECT-END statements and is particularly useful in large
    programs where the nesting level is not obvious.


    / STACK=stack-size specifies the maximum number of nested LINK statements.


    / NULL specifies that SAS does not create a data set when it executes the DATA
    step.


    VIEW=view-name names a view that the DATA step uses to store the input DATA step
    view.


    Restrictions:

    view-name must match one of the data set names.

    SAS creates only one view in a DATA step.


    Tips:

    If you specify additional data sets in the DATA statement, SAS creates these sets
    when the view is processed in a subsequent DATA or PROC step. Views have the capability
    of generating other data sets at the time the view is executed. SAS macro variables
    resolve when the view is created. Use the SYMGET function to delay macro variable
    resolution until the view is processed.


    Examples:

    “Example 2: Creating Input Data Set Views” on page 53

    “Example 3: Creating a View and a Data File” on page 53


    password-option assigns a password to a stored compiled DATA step program or a
    DATA step. The following password options are available:


    ALTER=alter-password assigns an alter password to a SAS data file. The password
    enables you to protect or replace a stored compiled DATA step program or a DATA
    step view.


    Alias: PROTE=


    Requirements:

    If you use an ALTER password in creating a stored compiled DATA step program or
    a DATA step view, an ALTER password is required to replace the program or view.

    If you use an ALTER password in creating a stored compiled DATA step program or
    a DATA step view, an ALTER password is required to execute a DESCRIBE statement.'
