- img_proc: true
  md: '# Details


    # Using WHEN Statements in a SELECT group


    The SELECT statement begins a SELECT group. SELECT groups contain WHEN statements
    that identify SAS statements that are executed when a particular condition is
    true. Use at least one WHEN statement in a SELECT group. An optional OTHERWISE
    statement specifies a statement to be executed if NO condition is met. An END
    statement ends a SELECT group.


    Null statements are used in WHEN statements cause SAS to recognize a condition
    as true without taking further action. Null statements that are used in OTHERWISE
    statements prevent SAS from issuing an error message when all WHEN conditions
    are false.


    # Evaluating the when-expression When a select-expression Is Included


    If the select-expression is present, SAS evaluates the select-expression and when-expression.
    SAS compares the two for equality and returns a value of true or false. If the
    comparison is true, execution proceeds either to the next when-expression in the
    current WHEN statement, or to the next WHEN statement if no more WHEN expressions
    are present. If no WHEN statements remain, execution proceeds to the OTHERWISE
    statement, if one is present. If the result of all SELECT-WHEN comparisons is
    false and no OTHERWISE statement is present, SAS issues an error message and stops
    the DATA step.


    # Evaluating the when-expression When a select-expression Is Not Included


    If no select-expression is present, the when-expression is evaluated to produce
    a result of true or false. If the result is true, statement is executed. SAS proceeds
    to the next when-expression in the WHEN statement, or to the next WHEN statement
    if there are more expressions are present, or to the OTHERWISE statement if one
    is present. (That is, SAS Performs the action that is indicated in the first true
    WHEN statement.) If the result of all when-expressions is false and no OTHERWISE
    statement is present, SAS issues an error message. If more than one WHEN statement
    has a true when-expression, only the first WHEN statement is used. When a-expression
    is true, no other when-expressions are evaluated.


    # Processing Large Amounts of Data with %INCLUDE


    One way to process large amounts of data is to use %INCLUDE statements in your
    DATA step. Using %INCLUDE statements enables you to perform complex processing
    while keeping your main program manageable. The %INCLUDE statements that you use
    in your main program can contain WHEN statements and other SAS statements to process
    your data. See "Example 5: Processing Large Amounts of Data" on page 334 for an
    example.


    # Comparisons


    Use IF-THEN/ELSE statements for programs with few statements. Use subsetting IF
    statements without a THEN to continue processing only those observations or records
    that meet the condition that is specified in the IF clause.'
