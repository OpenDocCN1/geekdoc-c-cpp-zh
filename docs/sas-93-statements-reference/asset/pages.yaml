    The PUT statement writes the value of X using the 2 format. Then, the +1 column
    pointer moves the pointer forward one column. Next, the value of Y is written
    with the 2 format. Again, the +1 column pointer moves the pointer forward one
    column. Then, the value of Z is written with the 2 format. For the third iteration,
    the PUT statement ignores the +1 pointer control.


