  md: '# FILE Statement


    PUT statement in a DATA step always writes to the SAS log, unless it is preceded
    by a FILE statement that specifies otherwise.


    **Tip:** Output lines are by default written to the SAS log, use a FILE LOG statement
    to restore the default action or to specify additional FILE statement options.


    # PRINT


    is a reserved fileref that directs the output that is produced by any PUT statements
    to the same file as the output that is produced by SAS procedures.

    Interaction: When you write to a file, the value of the N= option must be either
    1 or PAGESIZE.


    **Operating environment:** The Carriage-control characters that are written to
    a file can be specified to the operating environment. For details, see the SAS
    documentation for your operating environment.


    **Tip:** When PRINT is the fileref, SAS uses carriage-control characters and writes
    the output with the characteristics of a print file.


    **See:** A complete discussion of print files in *SAS Language Reference: Concepts*

    **Tip:** If the file does not exist in the directory that you specify for file-specification,
    SAS creates the file. If the directory specified in *file-specification* does
    not exist, SAS sets the SYSERR macro variable, which can be checked if the ERRORCHECK
    option is set to STRICT.


    # device-type


    specifies the type of device or the access method that is used if the fileref
    points to an input or output device or location that is not a physical file:


    # CATALOG


    specifies the CATALOG access method.

    Interaction: If the DATA step does not recognize the access method option, the
    DATA step passes the option to the access method for handling.


    **See:** For a complete list of options that are available with the CATALOG access
    method, see the ""FILENAME Statement, CATALOG Access Method" on page 100.


    # CLIPBOARD


    specifies the CLIPBOARD access method.

    Interaction: If the DATA step does not recognize the access method option, the
    DATA step passes the option to the access method for handling.


    **See:** For a complete list of options that are available with the CLIPBOARD
    access method, see the ""FILENAME, CLIPBOARD Access Method" on page 103.


    # DISK


    specifies the device is a disk drive.

    **Tip:** When you assign a fileref to a file on disk, you are not required to
    specify DISK.


    # DUMMY


    specifies the output to the file is discarded.

    **Tip:** Specifying DUMMY can be useful for testing.


    # FTP


    specifies the FTP access method.

    Interaction: If the DATA step does not recognize the access method option, the
    DATA step passes the option to the access method for handling.'
