    Example 2: Using a Null INPUT Statement

    This example uses an INPUT statement with no arguments. The DATA step copies records
    from the input file to the output file without creating SAS variables:


    ```

    data _null_;

    infile file-specification-1;

    file file-specification-2;

    input;

    put _infile_;

    run;

    ```


    Example 3: Holding a Record in the Input Buffer

    This example reads a file that contains two types of input data records and creates
    a SAS data set from these records. One type of data record contains information
    about a particular college course. The second type of record contains information
    about the students enrolled in the course. You need two INPUT statements to read
    the two records and assign the values to different variables that use different
    formats. Records that contain class information have a C in column 1; records
    that contain student information have an S in column 1, as shown here:


    ```

    --1----2-----

    H HIST101 Watson

    S Williams 0459

    S Flores 5423

    C MATH202 Sen

    S Lee 7085

    ```


    To know which INPUT statement to use, check each record as it is read. An INPUT
    statement that reads only the variable that tells whether the record contains
    class or student.


    ```

    data schedule(drop=type);

    retain Course Professor;

    input type $C then

    if type=''C'' then

    input course professor $;

    else if type=''S'' then

    do

    input Name $10. Id;

    output schedule;

    end;

    datalines;

    H HIST101 Watson

    S Williams 0459

    ```'
