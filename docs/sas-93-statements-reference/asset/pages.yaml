  md: '# OPTIONS Statement


    Specifies or changes the value of one or more SAS system options.


    +   **Valid in:** Anywhere


    +   **Category:** Program Control


    +   **See:** OPTIONS Statement under z/OS


    # Syntax


    ```

    OPTIONS option(s);

    ```


    # Arguments


    +   *option*

    specifies one or more SAS system options to be changed.


    # Details


    The change that is made by the OPTIONS statement remains in effect for the rest
    of the job, session, SAS process, or until you issue another OPTIONS statement
    to change the options again. You can specify SAS system options through the OPTIONS
    statement, through the OPTIONS window, at SAS invocation, and at the initiation
    of a SAS process.


    > Note: If you want a particular group of options to be in effect for all your
    SAS jobs or sessions, store an OPTIONS statement in an autoexec file or list the
    system options in a configuration file or custom_option_set.


    > Note: For a system option with a null value, the GETOPTION function returns
    a value of '''' (single quotation marks with a blank space between them), for
    example EMAILID='' ''. This GETOPTION value can then be used in the OPTIONS statement.


    An OPTIONS statement can appear at any place in a SAS program, except within lines.


    # Operating Environment Information


    The system options that are available depend on your operating environment. Also,
    the syntax that is used to specify a system option in the OPTIONS statement may
    be different from the syntax that is used at SAS invocation. For details, see
    the SAS documentation for your operating environment.


    # Comparisons


    The OPTIONS statement requires you to enter the complete statement including system
    option name and value, if necessary. The SAS OPTIONS window displays the options''
    names and settings in columns. To change a setting, type over the value that is
    displayed and press ENTER or RETURN.'
  merge: -1
  pgno: 297
- img_proc: true
  md: '# Example: Changing the Value of a System Option


    This example suppresses the date that is normally written to SAS LISTING output
    and sets a line size of 72:


    ```

    options nodate linesize=72;

    ```


    # See Also


    “Definition of System Options” in Chapter 1 of SAS System Options: Reference


    # OUTPUT Statement


    Writes the current observation to a SAS data set.


    +   Valid in: DATA step

    Category: Action

    Type: Executable


    # Syntax


    ```

    OUTPUT<data-set-name(s)>;

    ```


    # Without Arguments


    Using OUTPUT without arguments causes the current observation to be written to
    all data sets that are named in the DATA statement.


    If a MODIFY statement is present, OUTPUT with no arguments writes the current
    observation to the end of the data set that is specified in the MODIFY statement.


    # Arguments


    data-set-name


    specifies the name of a data set to which SAS writes the observation.


    Restriction: All names specified in the OUTPUT statement must also appear in the
    DATA statement.


    Tips:


    Instead of a data set name, you can specify the physical pathname to the file,
    using syntax that your operating system understands. The pathname must be enclosed
    in single or double quotation marks.


    You can specify up to many data sets in the OUTPUT statement as you specify in
    the DATA statement for that DATA step.


    # Details


    # When and Where the OUTPUT Statement Writes Observations


    The OUTPUT statement tells SAS to write the current observation to a SAS data
    set immediately, not at the end of the DATA step. If no data set name is specified
    in the OUTPUT statement, the observation is written to the data set or data sets
    that are listed in the DATA statement.'
  merge: -1
  pgno: 298
- img_proc: true
  md: '# Implicit versus Explicit Output


    By default, every DATA step contains an implicit OUTPUT statement at the end of
    each iteration that SAS to write observations to the data set or data sets that
    are being created. An explicit OUTPUT statement in a DATA step overrides the automatic
    output, and SAS adds an observation to a data set only when an explicit OUTPUT
    statement is executed. Once you use an OUTPUT statement to write to any data set,
    there is no implicit OUTPUT statement at the end of the DATA step. In this situation,
    a DATA step writes an observation to a data set only when an explicit OUTPUT executes.
    You can use the OUTPUT statement alone or as part of an IF-THEN or SELECT statement
    in DO-loop processing.


    # When Using the MODIFY Statement


    When you use the MODIFY statement with the OUTPUT statement, the REMOVE and REPLACE
    statements override the implicit write action at the end of each DATA step iteration.
    Comparisons on page 286 for more information. If both the OUTPUT statement and
    a REPLACE or REMOVE statement execute on a given observation, perform the action
    last to keep the position of the observation pointer correct.


    +   - OUTPUT writes observations to a SAS data set; PUT writes variable values
    or text strings to an external file or the SAS log.

    - To control when an observation is written to a specified output data set, use
    the OUTPUT statement. To control which variables are written to a specified output
    data set, use the KEEP= or DROP= data option in the DATA statement, or use the
    KEEP or DROP statement.

    - When you use the OUTPUT statement with the MODIFY statement, the following items
    apply.


    +   - Using an OUTPUT, REPLACE, or REMOVE statement overrides the default write
    action at the end of a DATA step. (OUTPUT is the default action, REPLACE becomes
    the default action when a MODIFY statement is used.) If you use any of these statements
    in a DATA step, you must explicitly program output for the new observations that
    are added to the data set.

    - The OUTPUT, REPLACE, and REMOVE statements are independent of each other. More
    than one statement can apply to the same observation, as long as the sequence
    is logical.

    - If both an OUTPUT and a REPLACE or REMOVE statement execute on a given observation,
    perform the OUTPUT action last to keep the position of the observation pointer
    correct.


    # Comparisons


    # Examples


    # Example 1: Sample Uses of OUTPUT


    These examples show how you can use an OUTPUT statement:


    +   - This line of code writes the current observation to a SAS data set.


    output;


    +   - This line of code writes the current observation to a SAS data set when
    a specified condition is true.


    ```

    if deptcode gt 2000 then output;

    ```'
  merge: -1
  pgno: 299
- img_proc: true
  md: 'OUTPUT Statement 287


    +   - This line of code writes an observation to the data set MARKUP when the
    PHONE

    value is missing.


    ```

    if phone=. then output markup;

    ```


    # Example 2: Creating Multiple Observations from Each Line of Input


    You can create two or more observations from each line of input data. This SAS
    program creates three observations in the data set RESPONSE for each observation
    in the data set SFA:


    ```

    data response(drop=time-3);

    set sulfa;

    time=time1;

    output;

    time=time2;

    output;

    time=time3;

    output;

    run;

    ```


    # Example 3: Creating Multiple Data Sets from a Single Input File


    You can create more than one SAS data set from one input file. In this example,
    OUTPUT writes observations to two data sets, OZONE and OXIDES:


    ```

    data ozone oxides;

    infile file-specification;

    input city $ 1-15 date9.

    chemical $ 26-27 ppm 29-30;

    if chemical=''O03'' then output ozone;

    else output oxides;

    run;

    ```


    # Example 4: Creating One Observation from Several Lines of Input


    You can combine several input observations into one observation. In this example,
    OUTPUT creates one observation that totals the values of DEFECTS in the first
    ten observations of the input data set:


    ```

    data discards;

    set gadgets;

    drop defects;

    ps;

    if reps=1 then total=0;

    total+defects;

    if reps=10 then do;

    output;

    stop;

    end;

    run;

    ```


    # See Also


    Statements:


    +   - “DATA Statement” on page 48

    - “MODIFY Statement” on page 263'
