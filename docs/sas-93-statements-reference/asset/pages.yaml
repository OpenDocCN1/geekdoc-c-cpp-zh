  md: '# LS


    issues the LS command to the FTP server. LS returns the contents of the working
    directory as records with no file attributes.


    Tips:


    The file attributes that are returned will vary, depending on the FTP server that
    is used.


    To return a subset of files, use the LSFILE= option in addition to LS.


    # LSFILE=`character-string`


    in combination with the LS option, specifies a character string that enables you
    to request a listing of a subset of files from the working directory. Enclose
    the character string in quotation marks.


    Restriction: LSFILE= can be used only if LS is specified.


    Tips:


    You can use a wildcard as part of ''`character-string`.


    The file attributes that are returned will vary, depending on the FTP server that
    is used.


    Example: This statement lists all of the files that start with *sales* and with
    sas:

    filename myfile ftp ls lsfile=''sales*'' other-ftp-options;


    # MGET


    transfers multiple files, similar to the FTP command MGET.


    Tips:


    The whole transfer is treated as one file. However, the transfer of each new file
    is started, the EOV= variable is set to 1.


    Specify MPRMPT to prompt the user before each file is sent.


    # MPROMPT


    specifies whether to prompt for confirmation that a file is to be read, if necessary,
    when the user executes the MGET option.


    Restriction: The MPRMPT option is not available on z/OS for batch processing.


    # NEW


    specifies that you FTP to create the directory when using the DIR option.


    Restriction: The NEW option is not available under z/OS.


    Tip: The NEW option will be ignored if the directory exists.


    # PASS=`password`


    where password is the password to use with the user specified in the USER= option.


    Tips:


    You can specify the PROMPT option instead of the PASS option, which tells the
    system to prompt you for the password.


    If the user is anonymous, the remote host may require that you specify your e-mail
    address as the password.


    To use an encoded password, use the PWENCODE procedure in order to disguise the
    text string, and then enter the encoded password for the PASS= option. For more
    information, see the Chapter 40, "PWENCODE Procedure" in Base SAS Procedures Guide.


    Example: "Example 6: Using an Encoded Password" on page 125


    # PASSIVE


    specifies that an attempt is made for passive mode FTP.'
