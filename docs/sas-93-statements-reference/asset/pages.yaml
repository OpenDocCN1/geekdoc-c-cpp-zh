  md: '# PUT Statement 295


    Named Output

    With named output, list the variable followed by an equal sign. For example, this

    PUT statement


    ```

    put name=age;

    +------+-------+

    name=Peterson age=21

    name=Morgan age=17

    ```


    writes the values for NAME and AGE to the SAS log:


    Note: The ruled line is for illustrative purposes only; the PUT statement does
    not

    generate it.

    See "PUT Statement, Statement" on page 316 for more information.


    # Using Multiple Output Styles in a Single PUT Statement


    A PUT statement can combine any or all of the different output styles. For example,


    ```

    put name ''on '' date mddydd. '' weighs ''

    startweight+(-1) . idno=40-45;

    ```


    See "Example 1: Using Multiple Output Styles in One PUT Statement" on page 299
    for

    an explanation of the lines written to the SAS log.


    When you combine different output styles, it is important to understand the location
    of

    t output pointer after each value is written. For more information about the pointer

    location, see "Pointer Location after a Value Is Written" on page 297.


    # Avoiding a Common Error When Writing Both a Character Constant and a Variable


    When using a PUT statement to write a character constant that is followed by a
    variable

    name, always put a blank space between the closing quotation mark and the variable

    name:


    ```

    put ''Player:'' name ''Player:'' name2 ''Player:'' name3;

    ```


    Otherwise, SAS might interpret a character constant that is followed by a variable
    name

    as a special SAS constant as illustrated in this table.


    Table 2.7 Characters That Cause Misinterpretation When They Follow a Character
    Constant


    | Starting Letter of Variable | Represents | Examples |

    |---|---|---|n| b | bit testing constant | ''00100000b |

    | d | date constant | ''01jan04d |

    | dt | datetime constant | ''18jan2003:9:27:05am''dt |

    | n | name literal | ''My Table''n |

    | t | time constant | ''9:25:19pm''t |

    | x | hexadecimal notation | ''534153''x |'
