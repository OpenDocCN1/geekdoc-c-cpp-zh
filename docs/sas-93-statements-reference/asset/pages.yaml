  md: '# WebDAV File Processing


    When accessing a WebDAV server, the file is pulled from the WebDAV server to your
    local disk storage for processing. When you complete the updating, the file is
    pushed back to the WebDAV server for storage. The file is removed from the local
    disk storage when it is pushed back.


    # Multiple Librefs to a WebDAV Library


    When you assign a libref to a file on a WebDAV server, the path (URL location),
    user ID, and password are associated with that libref. After the first libref
    has been assigned, the user ID and password will be validated on subsequent attempts
    to assign another libref to the library.


    > Note: Lock errors that you typically would not occur if either a different user
    ID or the password, or both, are used in the subsequent attempt to assign a libref
    to the same library.


    # Locked Files on a WebDAV Server


    In local libraries, SAS locks a file when you open it that is specified and to
    prevent other users from altering the file while it is being read. WebDAV locks
    require write access to a library, and there is no concept of a read lock. In
    addition, WebDAV servers can go down, come back up, or go offline at any time.
    Consequently, SAS honors a lock request on a file on a WebDAV server only if the
    file is already locked by another user.


    # Example: Associating a Libref with a WebDAV Directory


    The following example associates the libref davdata with the WebDAV directory
    / users/mydir/datadir on the WebDAV server www.webserver.com:


    ```

    libname davdata v9 "https://www.webserver.com/mydir/datadir"

    webdav user="mydir" pw="12345";

    ```


    # See Also


    Statements:


    +   • FILENAME Statement, WebDAV Access Method” on page 141

    • LIBNAME Statement” on page 233


    # LINK Statement


    Direct program execution immediately to the statement label that is specified
    and, followed by a RETURN statement, returns execution to the statement that follows
    the LINK statement.


    | Valid in: | DATA step |

    | Category: | Control |

    | Type: | Executable |


    # Syntax


    LINK libref;'
