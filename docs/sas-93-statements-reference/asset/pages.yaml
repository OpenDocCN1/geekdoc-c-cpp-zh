  md: '# WHERE Statement 379


    the statement for data set. Other data sets without a WHERE data set option use
    the statement.


    +   The most important differences between the WHERE in the DATA step and the
    subsetting IF statement are as follows:

    - The WHERE statement selects observations before they are brought into the program
    data vector, making it a more efficient programming technique. The subsetting
    IF statement works on observations after they are read into the program data vector.

    - The WHERE statement can produce a different data set from the subsetting IF
    when a BY statement accompanies a SET, MERGE, or UPDATE statement. The different
    data set occurs because SAS creates BY groups before the subsetting IF statement
    selects but after the WHERE statement selects.

    - The WHERE statement cannot be executed conditionally as part of an IF, but the
    subsetting IF statement can.

    - The WHERE statement selects observations in SAS sets only, whereas the subsetting
    IF selects observations from an existing SAS data set or from observations that
    are created with an INPUT statement.

    - The IF statement cannot be used in SAS windowing procedures to subset observations
    for browsing or editing.

    - Do not confuse the WHERE statement with the DROP or KEEP statement. The DROP
    and KEEP statements select variables for processing. The WHERE statement selects
    observations.


    # Examples


    Example 1: Basic WHERE Statement Usage

    This DATA step produces a SAS data set that contains only observations from data
    set CUSTOMER in which the value for NAME begins with Mac and the value for CITY
    is Charleston or Atlanta.


    ```

    data testmac;

    set customer;

    where substr(name,1,3)=''Mac'' and

    (city=''Charleston'' or city=''Atlanta'');

    run;

    ```


