- img_proc: true
  md: '# READ=password


    assigns a READ password to a SAS data file. The password enables you to read or
    execute a stored compiled DATA step program or a DATA step view.


    # Alias: EXECUTE=


    # Requirements:


    If you use a READ password in creating a stored compiled DATA step program or
    a DATA step view, a READ password is required to execute the program or view.


    If you use a READ password in creating a stored compiled DATA step program or
    a DATA step view, a READ password is required to execute the DESCRIBE and EXECUTE
    statements. If you use an invalid password, SAS will execute the DESCRIBE statement.


    Tip: If you use a READ password in creating a stored compiled DATA step program
    or a DATA step view, no password is required to replace the program or view.


    # PW=password


    assigns a READ and ALTER password, both having the same value.


    # SOURCE=source-option


    specifies one of the following source options:


    +   SAVE


    saves the source code that created a stored compiled DATA step program or a DATA
    step view.


    +   ENCRYPT


    encrypts and saves the source code that created a stored compiled DATA step program
    or a DATA step view.


    > Tip: If you encrypt source code, use the ALTER password option as well. Use
    SAS issues a warning message if you do not use ALTER.


    +   NOSAVE


    does not save the source code.


    # CAUTION:


    > If you use the NOSAVE option for a DATA step view, the view cannot be migrated
    or copied from one version of SAS to another version.


    # Default: Save


    # PGM=program-name


    names the stored compiled program that SAS creates or executes in the DATA step.
    To create a stored compiled program, specify a slash (/) before the PGM= option.
    To execute a stored compiled program, specify the PGM= option without a slash
    (/).


    > Tip: SAS macro variables resolve when the stored program is created. Use the
    SYMGET function to delay macro variable resolution until the view is processed.


    Example: "Example 4: Storing and Executing a Compiled Program" on page 54


    +   NOLIST


    suppresses the output of all variables to the SAS log when the value of _ERROR_
    is 1.


    Restriction: NOLIST must be the last option in the DATA statement.'
