    # FILENAME Statement, SOCKET Access Method


    Enables you to read from or write to a TCP/IP socket.


    | Valid in: | Anywhere |

    | --- | --- |

    | Category: | Data Access |


    # Syntax


    Form 1: FILENAME fileref SOCKET ''hostname:portno'' <tcpip-options>;

    Form 2: FILENAME fileref SOCKET ''portno'' SERVER <tcpip-options>;


    # Arguments


    fileref

    is a valid fileref.


    Tip: The association between a fileref and an external file lasts only for the
    duration of the SAS session or until you change it or discontinue it with another
    FILENAME statement. You can change the fileref for a file as often as you want.


    # SOCKET


    specifies the access method that enables you to read from or write to a Transmission
    Control Protocol/Internet Protocol (TCP/IP) socket.'
