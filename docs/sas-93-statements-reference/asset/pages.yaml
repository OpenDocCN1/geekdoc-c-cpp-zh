    # Example 7: Avoiding a Common Error When Writing a Character Constant Followed
    by a Variable


    This example illustrates how to use a PUT statement to write character constants
    and values without causing them to be misinterpreted as SAS name literals. A name
    literal is a token that is expressed as a string within quotation marks, followed
    by the letter n. For more information about SAS name literals, see SAS Language
    Reference: Concepts.


    In the program, the PUT statement writes the constant ''n'' followed by the value
    of the variable NVAR1, and then writes another constant ''n'':


    ```

    data _null;

    n=5;

    nvar1=1;

    var=7;

    put @1 ''n'' nvar1 ''n'';nrun;

    ```


    This program writes the following line to the SAS log:


    ```

    +-------1-------+2

    n1 n

    ```


    Note: The ruled line is for illustrative purposes only; the PUT statement does
    not generate it.


    If all the spaces between the constants and the variables are removed from the
    previous PUT statement, SAS interprets ''n'' as a name literal instead of reading
    ''n'' as a constant. The next variable is read as VAR1 instead of NVAR1. The final
    ''n'' constant is interpreted correctly.


    ```

    put @1 ''n''nvar1 ''n'';

    ```


    This PUT statement writes the following line to the SAS log:


    ```

    +-------1-------+2

    57 n

    ```


    To print constants and variable values without intervening spaces, and without
    potential misinterpretation, you can add spaces between them and use pointer controls
    where necessary. For example, the following PUT statement uses a pointer control
    to write the correct character constants and variable values but does not insert
    blank spaces. Note that +(-1) moves the PUT statement pointer backwards by one
    space.


    ```

    put @1 ''n'' nvar1 +(-1) ''n'';

    ```


    This PUT statement writes the following line to the SAS log:


    ```

    +-------1-------+2

    in

    ```'
