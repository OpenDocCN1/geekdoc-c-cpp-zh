    # Example 9: Working with Data in the Input Buffer

    _INFILE variable contains the most recent record that is read from an

    INPUT statement. This example illustrates the use of the _INFILE, variable to


    +   - read an entry record that you want to parse without using the INPUT statement.

    - read an entry record that you want to write to the SAS log.

    - modify the contents of the input record before parsing the line with an INPUT

    statement.


    The example file contains phone bill information. The numeric data, minutes, and
    charge

    en enclosed in angle brackets (<>).


    ```

    filename phonbill host-specific-filename;

    data _null;

    file phonbill;

    input line $80;

    put line;

    datalines;

    City Number Minutes Charge

    Jackson 415-555-2384 <25> <2.45>

    Jefferson 813-555-2356 <15> <1.62>

    Joliet 913-555-3223 <65> <10.32>

    ;

    nrun;

