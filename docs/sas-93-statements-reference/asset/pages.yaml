  md: '328 Chapter 2 • Dictionary of SAS Statements


    Category: Log Control


    Type: Executable


    # Syntax


    ```

    RESETLINE;

    ```


    Without Arguments

    Use the RESETLINE statement to reset the program line numbers in the SAS log to
    1.


    # Details


    Program statements are identified by line numbers in the SAS log. The line numbers
    start with 1 and continue with the sequence of line numbering until the end of
    the SAS session or batch program.


    You use the RESETLINE statement in your program to restart the program line numbering
    at 1.

    Note: If you use the SPOOL system option, you can use only the %INCLUDE statement
    to resubmit lines of code that were submitted after the most recent RESETLINE
    statement.


    # Example: Resetting Line Numbers in the SAS Log


    The following example resets the program line numbers between DATA steps.


    ```

    data a;

    a=1;

    run;

    resetline;

    data b;

    b=2;

    run;

    ```


    The following lines are written to the SAS log:


    | 1 data a; |

    | a=1; |

