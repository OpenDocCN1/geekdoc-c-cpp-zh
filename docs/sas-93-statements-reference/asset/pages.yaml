  md: '# ARRAY Statement 25


    They do not have names. Refer to temporary data elements by array name and dimension.


    They do not appear in the output data set.


    You cannot use the special asterisk (*) to refer to all the elements. Temporary
    data element values are always automatically retained, rather than being reset
    to missing at the beginning of the next iteration of the DATA step.


    Arrays of temporary elements are useful when the only purpose for creating an
    array is to perform a calculation. To preserve the result of the calculation,
    assign it to a variable. You can improve performance by using temporary data elements.


    (initial-value-list)


    gives initial values for the corresponding elements in the array. The values for
    elements can be numbers or character strings. You must enclose all character strings
    in quotation marks. To specify one or more initial values directly, use the following
    format:


    (initial-value-s)


    <count-initial-value*> <(constant value | constant-sublist*)>


    **Restriction:** If you specify both an initial-value-list and array-elements,
    array-elements must be listed before initial-value-list in the ARRAY statement.


    Tips:


    You can assign initial values to variables and temporary data elements. Elements
    and values are matched by position. If there are more array elements than initial
    values, the remaining array elements receive missing values and SAS issues a warning.


    You can separate the values in the initial-value list with either a comma or a
    blank space.


    You can also use a shorthand notation for specifying a range of sequential integers.
    The increment is always +1.


    If you have not previously specified the attributes of the array elements (such
    as length or type), the attributes of any initial values that you specify automatically
    assigned to the corresponding array element. Initial values are retained until
    a new value is assigned to the array element.


    When any (or all) elements are assigned values, all elements behave as if they
    were named on a RETA statement.


    Example: The following examples show how to use the iteration factor and nested
    sublists. All of these ARRAY statements contain the same initial value list:


    ```

    ARRAY x[10] x1-x10 (10*5)

    ARRAY x[10] x1-x10 (5*(5))

    ARRAY x[10] x1-x10 (5 3*(5 5) 5)

    ARRAY x[10] x1-x10 (2*(5 5) 5 2*(5 5))

    ARRAY x[10] x1-x10 (2*(5*(5 5))))

    ```


    Examples:


    +   “Example 2: Assigning Initial Numeric Values” on page 26


    +   “Example 3: Defining Initial Character Values” on page 26'
