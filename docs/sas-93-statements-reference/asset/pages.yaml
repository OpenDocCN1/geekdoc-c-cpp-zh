    #5 @10 ''Other has'' +1 o

    group=lastmessage

    #8 @10

    ''ALL ARTICLES ASSIGNED.''

    Press ENTER to stop processing.'';

    display Assignment blank;

    if name=''Adams'' then a+1;

    else if name=''Brown'' then b+1;

    else if name=''Johnson'' then j+1;

    else if name=''Smith'' then s+1;

    else o+1;

    display Showtotal.subtotal blank newInput;

    if then display Showtotal.lastmessage;

    ```


    When you execute the DATA step, the following windows appear.


    ![](img/df01a42b751f4ba4ce8fe6c9da27f93d_402_0.png)


    In the Assignment window (located at the top of the monitor), you see the name
    of the article and a field into you enter a reporter''s name. After you type a
    name and press ENTER, SAS displays the Showtotal window (located at the bottom
    of the monitor) which shows the number of articles that are assigned to each reporter
    (including the assignment that you just made). As you continue to make assignments,
    the values in the Showtotal window are updated. During the last iteration of the
    DATA step, SAS displays the message that all articles are assigned, and instructs
    you to press ENTER to stop processing.


    # Example 3: Persisting and Nonpersisting Fields


    This example demonstrates the PERSIST= option. You move from one window to the
    other by positioning the cursor in the current window and pressing ENTER.'
