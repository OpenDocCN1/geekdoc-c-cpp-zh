  md: '# Using SOCKET Access Method in Client Mode (Form 1)


    In client mode, a local SAS application can use the SOCKET access method to communicate
    with a remote application that acts as a server (and waits for a connection).
    Before you connect to a server, you must know:


    +   * the network name or IP address of the host computer running the server.

    * the port number that the remote application is listening to for new connections.


    The remote application can be another SAS application, but it does not need to
    be. When the local application connects to the remote application through the
    TCP/IP socket, the two applications can communicate by reading and writing to
    the socket as if it were an external file. If at any time the remote side of the
    socket is disconnected, the local side will also automatically terminate.


    # Using the SOCKET Access Method in Server Mode (Form 2)


    When the SAS application is in server mode, it remains in a wait state until a
    remote application connects to it. To use the SOCKET access method in server mode,
    you need to know only the port number that you want the server to listen to for
    a connection. Typically, servers use well-known ports to listen for connections.
    These port numbers are reserved by the system for specific server applications.
    For more information about well-known ports are defined on your system, refer
    to the documentation for your TCP/IP software or ask your system administrator.


    If the server application does not use a well-known port, then the system assigns
    a port number when it establishes the socket from the local application. However,
    because any client application that waits to connect to the server must know the
    port number, you should use a well-known port.


    While a local SAS application is waiting for a connection, SAS is in a wait state.
    Each time a new connection is established, the EOV variable in the DATA step is
    set to 1. Because the server accepts only one connection at a time, no new connections
    can be established until the current connection is closed. When the remote client
    application disconnects, The SOCKET access method continues to accept new connections
    until it reaches the limit set in the RECONN option.


    # Example: Communicating between Two SAS Applications over a TCP/IP Socket


    This example shows how sas applications can talk over a TCP/IP socket. The local
    application in server mode; the remote application is the client that connects
    to the server. This example assumes that the server host is hp720.unix.sas.com,
    and the well-known port number is 5000, and that the server allows a maximum of
    three connections before closing the socket.


    Here is the program for the server application:


    ```

    filename local socket=''5000'' server recon=3;

    /*The server is using a reserved */

    /*port number of 5000;

    data tcpip;

    file local eov=v;

    input x=10;

    if v=1 then

    do;/* new connection when v=1 */

    put ''new connection received'';

    end;

    ```'
