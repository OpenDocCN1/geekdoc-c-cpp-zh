    option, which allows the user to replace an existing stored program, and to protect\
    \ the\nstored compiled program from being replaced.\n\n```\ndata testfile / pgm=stored.test_program\
    \ (alter=sales);\nset sales_data;\n  .more SAS statements.\nrun;\n```\n\nFor more\
    \ information, see Chapter 28, \"Stored Compiled DATA Step Programs,\" in SAS\n\
    Language Reference: Concepts.\n\n# Describing a DATA Step View (Form 5)\n\nThe\
    \ following example uses the DESCRIBE statement in a DATA step view to write a\n\
