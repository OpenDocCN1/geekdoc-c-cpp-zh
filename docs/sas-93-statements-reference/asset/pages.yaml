  md: '# DATA Statement


    Begins a DATA step and provides names for any output SAS data sets, views, or
    programs.


    +   - Valid in: DATA step

    - Category: File-handling

    - Type: Declarative


    # Syntax


    +   Form 1: DATA <data-set-name-<(data-set-options-i)>>...<data-set-name-n<(data-set-options-n)>></DEBUG><NESTING>STACK=stack-size><NOLIST;


    +   Form 2: DATA_NULL_<DEBUG><NESTING>STACK=stack-size><NOLIST;


    +   Form 3: DATA view-<data-set-name-1<(data-set-options-1)>>...<data-set-name-n<(data-set-options-n)>>/VIEW=view=<password-option>SOURCE=source-option><NESTING><NOLIST;


    +   Form 4: DATA data-set-name /PGM=program-name<(password-option>SOURCE=source-option><NESTING><NOLIST;


    +   Form 5: DATA view-view=<password-option><NOLIST;

    DESCRIBE;


    +   Form 6: DATA PGM=program-name<(password-option><NOLIST;

    <DESCRIBE>

    <REDIRECT INPUT | old-name-1=new-name-1<...old-name-n=new-name-n<><EXECUTE>


    # Arguments


    If you omit the arguments, the DATA step automatically names each successive data
    set that you create DATAn, where n is the smallest integer that makes the name
    unique.


    # data-set-name


    names the SAS data file or DATA step view that the DATA step creates. To create
    a DATA step view, you must specify at least one data-set-name and that data-set-name
    must match view-name.


    Restriction: data-set-name must conform to the rules for SAS names, and additional
    restrictions might be imposed by your operating environment.


    Tips:


    Instead of using a data set name, you can specify the physical pathname to the
    file, using syntax that your operating system understands. The pathname must be
    enclosed in single or double quotation marks.


    You execute a DATA step without creating a SAS data set. See "Example 5: Creating
    a Custom Report" on page 54. For more information, see "When Not Creating a Data
    Set (Form 2)" on page 52.'
