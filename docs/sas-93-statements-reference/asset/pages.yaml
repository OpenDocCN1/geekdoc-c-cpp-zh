    # DEBUG


    DEBUG writes informational messages to the SAS log.


    # DIR


    enables you to access directory files. Specify the directory name in the external-file
    argument. You must use valid directory syntax for for the specified host.


    Interaction: The CD and DIR options are mutually exclusive. If both are specified,
    SFTP ignores the CD option and SAS writes an informational message to the log.


    Tips:


    +   If you want SFTP to create the directory, then use the NEW option in conjunction
    with the DIR option. The NEW option will be ignored if the directory exists.


    If the NEW option is omitted and you specify an invalid directory, a new directory
    will not be created and you will receive an error message.


    # HOST=''host''


    where host is the remote name of the host with the OpenSSH SSHD server running.


    You can specify the name of the host (for example, server.pc.mydomain.com) or
    the IP address of the computer (for example, 2001:db8:).


    # LRECL=lrecl


    where lrecl is the logical record length of the data.


    Default: 256


    Interaction: Alternatively, you can specify a global logical record length by
    using "LRECL=System Option" in SAS System Options: Reference.


    # LS


    issues the LS command to the SFTP server. LS returns the contents of the working
    directory as records with no file attributes.


    Restriction: The LS option will not display files with leading periods, for example
    x.Authority.


    Interaction: The LS and SAS options are mutually exclusive. If you specify both
    options, the LS option takes precedence.


    Tip: To return a list of a subset of files, use the LSFILE=option in addition
    to LS.


    # LSA


    issues the LSA command to the SFTP server. LSA returns all contents of the working
    directory as records with no file attributes.


    # Interactions:


    The LS and LSA options are mutually exclusive. If you specify both options, the
    LSA option takes precedence.'
