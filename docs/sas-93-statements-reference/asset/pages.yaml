  md: '# DO UNTIL Statement


    ```

    DO UNTIL (expression);

    ...more SAS statements...

    END;

    ```


    # Arguments


    (expression)

    is any SAS expression, enclosed in parentheses. You must specify at least one
    expression.


    # Details


    The expression is evaluated at the bottom of the loop after the statements in
    the DO have been executed. If the expression is true, the DO loop does not iterate
    again.


    > Note: The DO loop always iterates at least once.


    # Comparisons


    +   There are three other forms of the DO statement:

    * The DO statement, the simplest form of DO-group processing, designates a group
    of statements to be executed as a unit, usually as part of IF-THEN/ELSE statements.

    * The iterative DO statement executes statements between DO and END statements
    repetitively based on the value of an index variable.

    * The DO WHILE statement executes statements in a DO loop repetitively while a
    condition is true, checking the condition before each iteration of the DO loop.
    The DO UNTIL statement evaluates the condition at the bottom of the loop; the
    DO WHILE statement evaluates the condition at the top of the loop.


    > Note: The statements in a DO UNTIL loop always execute at least one time, whereas
    the statements in a DO WHILE loop do not iterate once if the condition is false.


    # Example: Using a DO UNTIL Statement to Repeat a Loop


    These statements repeat the loop until N is greater or equal to 5. The expression
    N>=5 is evaluated at the bottom of the loop. There are five iterations in all
    (0, 1, 2, 3, 4).


    ```

    n=0;

    do until (n>=5);

    put n=;

    n+1;

    end;

    ```


    # See Also


    +   Statements:

    * “DO Statement” on page 63

    * “DO Statement, Iterative” on page 65

    * “DO WHILE Statement” on page 70'
  merge: -1
  pgno: 82
- img_proc: true
  md: '# DO WHILE Statement


    Executes statements in a DO-loop repetitively while a condition is true.


    | Valid in: | DATA step |

    | Category: | Control |

    | Type: | Executable |


    # Syntax


    ```

    DO WHILE (expression);

    ...more SAS statements...

    END;

    ```


    # Arguments


    +   - (expression)

    nis any SAS expression, enclosed in parentheses. You must specify at least one
    expression.


    # Details


    The expression is evaluated at the top of the loop before the statements in the
    DO loop are executed. If the expression is true, the DO loop iterates. If the
    expression is false the first time it is evaluated, the DO loop does not iterate
    even once.


    # Comparisons


    +   There are three other forms of the DO statement:

    - The DO statement, the simplest form of DO-group processing, designates a group
    of statements to be executed as a unit, usually as a part of IF-THEN/ELSE statements.

    - The iterative DO statement executes statements DO DO index and END statements
    repetitively based on the value of an index variable.

    - The DO UNTIL statement executes statements in a DO loop repetitively until a
    condition is true, checking the condition after each iteration of the DO loop.
    The DO WHILE statement evaluates the condition at the top of the loop; the DO
    UNTIL statement evaluates the condition at the bottom of the loop.


    > Note: If the expression is false, the statements in a DO WHILE loop do not execute.
    However, because the DO UNTIL expression is evaluated at the bottom of the loop,
    the statements in the DO UNTIL loop always execute at least once.


    # Example: Using a DO WHILE Statement


    These statements repeat the loop while N is less than 5. The expression N<5 is
    evaluated at the top of the loop. There are five iterations in all (0, 1, 2, 3,
    4).


    ```

    n=0;

    do while(n<5);

    put n;

    ```'
