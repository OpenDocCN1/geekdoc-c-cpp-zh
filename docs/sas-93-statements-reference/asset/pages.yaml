  md: '# Comparisons


    As with the SFTP get and put commands, the SFTP access method lets you download
    and upload files. However, this method directly reads files into your SAS session
    without first storing them on your system.


    # Examples


    Example 1: Connecting to an SSHD Server at a Standard Port


    This example reads a file called test.dat using the SFTP access method after connecting
    to the SSHD server a standard port:


    ```

    filename myfile sftp ''/users/xxxx/test.dat'' host="unixhost1"

    data_null;\infile myfile truncate;

    input a $25;

    run;

    ```


    Example 2: Connecting to an SSHD Server at a Nonstandard Port


    This example reads a file called test.dat using the SFTP access method after connecting
    to the SSHD server at port 4117:


    ```

    filename myfile sftp ''/users/xxxx/test.dat'' host="unixhost1" options="-oPort=4117"

    data_null;\infile myfile truncate;

    input a $25;

    run;

    ```


    Example 3: Connecting a Windows PUTTY Client to an SSHD Server


    This example writes a file called test.dat using the SFTP access method after
    connecting a Windows PUTTY client to the SSHD server with a user ID of userid:


    ```

    filename outfile sftp ''/users/xxxx/test.dat'' host="unixhost1" user="userid"

    data_null;

    file;

    do i=1 to 10;

    put i;

    end;

    run;

    ```


    Example 4: Reading Files from a Directory on the Remote Host


    This example reads the files test.dat and test2.dat from a directory on the remote
    host.


    ```

    filename infile sftp ''/users/xxxx/'' host="unixhost1" dir;

    data_null;

    infile infile(test.dat) truncate;

    input a $25;

    infile infile(test2.dat) truncate;

    input b $25;

    run;

    ```'
