  md: '# LIBNAME Statement 235


    > Tip: Specify libref to disassociate a single libref. Specify _ALL_ to disassociate
    all currently assigned librefs.


    _ALL_ specifies the CLEAR or LIST argument applies to all currently assigned librefs.


    # LIST


    writes the attributes of one or more SAS libraries to the SAS log. Tip: Specify
    libref to list the attributes of a single SAS library. Specify _ALL_ to list the
    attributes of all SAS libraries that have librefs in your current session.


    # LIBNAME Options


    # ACCESS=READONLY|TEMP


    # READONLY


    assigns a read-only attribute to an entire SAS library. SAS will not allow you
    to open a data set in the library in order to update information or write new
    information.


    # TEMP


    specifies that the SAS library be treated as a scratch library. That is, the system
    will not consume CPU cycles to ensure that the files in a TEMP library do not
    become corrupted. Tip: Use ACCESS=TEMP to save resources only when the data is
    recoverable.


    Operating environment: Some operating environments support LIBNAME statement options
    that have similar functions to the ACCESS= option. See the SAS documentation for
    your operating environment.


    # COMPRESS=NO|YES|CHAR|BINARY


    controls the compression of observations in output SAS data sets for a SAS library.


    # NO


    specifies that the observations in a newly created SAS data set be uncompressed
    (fixed-length records).


    # YES|CHAR


    specifies that the observations in a newly created SAS data set be compressed
    (variable-length) by SAS using RLE (Run Length Encoding). RLE compresses observations
    by repeating consecutive characters (including blanks) to two-byte or three-byte
    representations. Tip: Use this compression algorithm for character data.


    # BINARY


    specifies that the observations in a newly created SAS data set be compressed
    (variable-length records) by SAS using RDC (Ross Data Compression). RDC combines
    run-length encoding and sliding-window compression to compress the file. Tip:
    This is highly effective for compressing medium to large (several hundred bytes
    or larger) blocks of binary data (numeric variables). Because the compression
    function operates on a single record at a time, the length needs to be several
    hundred bytes or larger for effective compression.


    Interaction: For the COPY procedure, the default value CLONE uses the compression
    attribute from the input data set for the output data set instead of the value
    specified in the COMPRESS= option. For more information about CLONE and NOCLONE,
    see the COPY Statement in the DATASETS procedure. This interaction does not apply
    when using SAS/SHARE or SAS/CONNECT.'
