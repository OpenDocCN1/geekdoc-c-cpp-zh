    # Reading Past End of a Line


    When you use @ or pointer controls with a value that moves the pointer to past
    the end of the current record and the next value is to be read from the current
    column, SAS goes to 1 of the next record to read it. It also writes this message
    to the SAS log:


    > NOTE: SAS sent to a new line when INPUT statement reached the end of a line.


    You can alter the default behavior (the FLOWOVER option) in the INFILE statement.
    Use the STOPOVER option in the INFILE statement to treat this condition as an
    error and to stopping the data set.


    Use the MISSO option in the INFILE statement to set the remaining INPUT variables
    to missing values if the pointer reaches the end of a record.


    Use the TRUNCOVER option in the INFILE statement to read column input or formatted
    input when the last variable is read by the INPUT statement varying-length data.


    # Positioning the Pointer before the Record


    When a column pointer controls to move the pointer to a position before the beginning
    of the record, the pointer is positioned in column 1. For example, this INPUT
    statement specifies that the pointer is -2 after the first value is read:


    ```

    data test;

    input a@(a-3) b;

    datalines;

    ```


    2

    ;


    Therefore, SAS moves the pointer to column 1 after the value of A is read. Both
    variables A and B contain the same value.


    # Invalid Data Is Handled


    When SAS encounters an invalid character in an input value for the variable indicated,
    it


    +   - sets the value of the variable that is read to missing or the value that
    is specified with the INVALIDDATA= system option. For more information see the
    "INVALIDDATA= System Option" in SAS Options: Reference.

    - prints an invalid data value in the SAS log.

    - prints the input line and column number that contains the invalid value in the
    SAS log. Unprintable characters appear in hexadecimal. To determine column numbers,
    SAS prints a rule line above the input line.

    - sets the automatic variable _ERROR_ to 1 for the current observation.


    The format modifiers for error reporting control the amount of information that
    is printed in the SAS log. Both the ? and ?? modifier suppress the invalid data
    message. However, the ?? modifier resets the automatic variable _ERROR_ to 0.
