- img_proc: true
  md: 'Restriction: UNIQUE can appear only with the KEY= argument and must be preceded
    by a slash.


    Notes:


    By default, SET begins at the top of the index only when the KEY= value does not
    change on successive executions of the SET statement, the search begins by following
    the most recently retrieved observation. In other words, when consecutive duplicate
    KEY= values appear, the SET statement attempts a one-to-one match with duplicate
    indexed values in the data set that is being read. If more duplicate KEY= values
    are specified than in the data set that is being read, the extra duplicates are
    treated as not found.


    When KEY= is a unique value, only the first attempt to read an observation with
    that key value succeeds; subsequent attempts to read the observation with that
    value of the key will fail. The _IORC variable returns a value that corresponds
    to the SYSRC mnemonic _DSEN. If you add the UNIQUE option, subsequent attempts
    to read the observation with the unique KEY= value will succeed. The _IORC variable
    returns 0.


    See: For extensive examples, see Combining and Modifying SAS Data Sets:


    Examples

    Example: "8: Performing a Table Lookup When the Master File Contains Duplicate
    Observations" on page 353


    # Details


    # What SET statement does


    Each time the SET statement is executed, SAS reads one observation into the program
    data vector. SET reads all variables and all observations from the input data
    sets unless you tell SAS to do otherwise. A SET statement can contain multiple
    data sets; a DATA step can contain multiple SET statements. See Combining and
    Modifying SAS Data Sets: Examples.


    Note: When the DATA step comes to an end-of-file marker or the end of all open
    data sets, it performs an orderly shutdown. For example, if you use SET with FIRSTOBS,
    a file with only a header in a series of files will trigger a normal shutdown
    of the DATA step. The shutdown occurs because SAS reads beyond the end-of-file
    marker and the DATA step terminates. You can use the END= option to avoid the
    shutdown.


    # Uses


    The SET statement is flexible and has a variety of uses in SAS programming. These
    uses are determined by the options and sets that you use with the SET statement:


    +   reading observations and variables from existing SAS data sets for further
    processing in the DATA step


    +   concatenating and interleaving data sets, and performing one-to-one reading
    of data sets


    +   reading SAS data sets using direct access methods.


    # Using Data Set Lists with SET


    You can use data set lists with the SET statement. Data set lists provide a quick
    way to reference existing groups of data sets. These data set lists must be either
    name prefix lists numbered range lists.'
  merge: -1
  pgno: 362
- img_proc: true
  md: 'Name prefix lists refer to all data sets with a specified character string.
    For example, set SALES1;; tells SAS to read all data sets starting with "SALES"
    as SALES1, SALES10, SALES11, and SALES12.


    Numbered lists require you to have a series of data sets with the same name, except
    for the last character or characters, which are consecutive numbers. In a numbered
    list, you can begin with any number and end with any number. For example, these
    refer to the data sets:


    ```

    sales12 sales3 sales4

    sales1-sales4

    ```


    Note: If the numeric suffix of the first data set name contains leading zeros,
    the number of digits must be greater or equal to the number of digits in the first
    data set name. Otherwise, an error will occur. For example, the data set list
    sales01-sales99 and sales01-sales9 will cause an error. The data set list sales001-sales999
    is valid. The number of digits in the numeric suffix of the first and last data
    set names do not have to be equal. For example, the data set list sales999 is
    valid.


    Other rules to consider when using numbered data set lists are as follows:


    +   - You can specify groups of ranges.


    ```

    set cost1-cost4 cost11-cost14 cost21-cost24;

    ```


    +   - You can mix numbered range lists with name prefix lists.


    ```

    set cost1-cost4 cost2; cost33-cost37;

    ```


    +   - You can mix single data sets with data set lists.


    ```

    set cost10-cost20 cost30;

    ```


    +   - Quotation marks around data set lists are ignored.


    ```

    * these two lines are the same *

    set sales1 - sales4;

    set ''sales1n '' - ''sales4n'';

    ```


    +   - Spaces in data set names are invalid. If quotation marks are used, trailing
    blanks are ignored.


    ```

    * blanks in these statements will cause errors *

    set sales 1 - sales4;

    set ''sales1n '' - ''sales4n'';

    * trailing blanks in this statement will be ignored *

    set ''n '' - ''sales4 '' ''

    ```


    +   - The maximum numeric suffix is 2147483647.


    ```

    * this suffix will cause an error *

    set prod2000000000-prod2934850239;

    ```


    # BY-Group Processing with SET


    Only one BY statement can accompany each SET statement in a DATA step. The BY
    statement should immediately follow the SET statement to which it applies. The
    data sets that are listed in the BY statement must be sorted by the values of
    the variables that are listed in the BY statement, or they must have an appropriate
    index. SET, when it is used with a BY statement, interleaves data sets. The observations
    in the new data set are arranged by the values of the BY variable or variables,
    and within each BY group, by the'
  merge: -1
  pgno: 363
- img_proc: true
  md: 'order of the data sets in which they occur. See "Example 2: Interleaving SAS
    Data Sets"

    on page 352 for an example of BY-group processing with the SET statement.


    # Combining SAS Data Sets


    Use a single SET statement with multiple data sets to concatenate the specified
    data sets. That is, the number of observations in the new data set is the sum
    of the number of observations from the original data sets, and the order of the
    observations is all the obbservations from the first data set followed by all
    the observations from the second data set, and so on. See "Example 1: Concatenating
    SAS Data Sets" on page 351 for an example of concatenating data sets.


    Use a single SET statement with a BY statement to interleave the specified data
    sets. The observations in the new data set are arranged by the values of the BY
    variable or variables, and within each BY group, by the order of the data sets
    in which they occur. See "Example 2: Interleaving SAS Data Sets" on page 352 for
    an example of interleaving data sets.


    Use multiple SET statements to perform one-to-one reading (also called one-to-one
    matching) of the specified data sets. The new data set contains all the variables
    from the input data sets. The number of observations in the new data set is the
    number of observations in the smallest original data set. If the data sets contain
    common variables, the values that are read from the last data set replace the
    values that were read in earlier ones. For examples of one-to-one reading of data
    sets, see


    +   * "Example 6: Combining One Observation with Many" on page 352

    * "Example 7: Performing a Table Lookup" on page 353

    * "Example 8: Performing a Table Lookup When the Master File Contains Duplicate
    Observations" on page 353


    For extensive examples, see Combining and Modifying SAS Data Sets: Examples.

    For more information on how to prepare your data sets, see "Combining SAS Data
    Sets: Basic Concepts" in Chapter 21 of SAS Language Reference: Concepts.


    # Comparisons


    +   * SET reads an observation from an existing SAS data set. INPUT reads raw
    data from an external file or in-stream data lines in to create SAS variables
    and observations.

    * Using the KEY= option with SET enables you to access observations nonsequentially
    in a SAS data set according to a value. Using the POINT= option enables you to
    access observations nonsequentially in a SAS data set according to the observation
    number.


    # Examples


    # Example 1: Concatenating SAS Data Sets


    If more than one data name appears in the SET statement, the resulting output
    data is a concatenation of all the data sets that are listed. SAS reads all observations
    from the first data set, then all from the second data set, and so on, until all
    observations from all the data sets have been read. This example concatenates
    the three SAS data sets into one output data set named FITNESS:'
  merge: -1
  pgno: 364
- img_proc: true
  md: 'data fitness;


    set health exercise well;

    run;


    # Example 2: Interleaving SAS Data Sets


    To interleave two or more SAS data sets, use a BY statement after the SET statement:


    data april;

    set payable recyclable;

    by account;

    run;


    # Example 3: Reading a SAS Data Set


    In this DATA step, each observation in the data set is read into the program vector
    data. Only those observations whose value of CITY is Raleigh are output to the
    new data set RALEIGH.MEMBERS:


    data raleigh.members;

    set nc.members;

    if city=''Raleigh'';

    run;


    # Example 4: Merging a Single Observation with All Observations in a SAS Data
    Set


    An observation to be merged into an existing data set can be one that is created
    by a SAS procedure or another DATA step. In this example, the data set AVGSALES
    has only one observation:


    data national;

    if n_=1 then set avgsales;

    set totalsales;

    run;


    # Example 5: Reading from the Same Data Set More than Once


    In this example, SAS treats each SET statement independently. That is, it reads
    from one data set as if it were reading from two separate data sets:


    data drugxy;

    set trial5(keep=sample);

    if sample>2;

    set trial5;

    run;


    For each iteration of the DATA step, the first SET statement reads one observation.
    The next time the first SET statement is executed, it reads the next observation.
    Each SET statement can read different observations with the same iteration of
    the DATA step.


    # Example 6: Combining One Observation with Many


    You can subset observations from one data set and combine them with observations
    from another data set by using direct access methods, as follows:


    data south;

    set revenue;

    if region=4;

    set expense point=_n;

    run;'
