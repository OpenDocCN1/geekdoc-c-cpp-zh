- img_proc: true
  md: "# Example 11: Writing an Observation Only After All Observations Have Been\
    \ Read\n\nThis uses the END= variable LAST to tell SAS to assign a value to the\
    \ variable REVENUE and write an observation only after the last observation of\
    \ RENTAL has been:\n\n```\nset rental end=last;\ntotdays += days;\nif last then\n\
    \  do;\n    revenue=totdays*65.78;\n    output;\nend;\n```\n\n# Example 12: Retrieving\
    \ the Name of the Set From Which the Current Observation Is Read\n\nThis example\
    \ creates three data sets and stores the data name in a variable named dsn. The\
