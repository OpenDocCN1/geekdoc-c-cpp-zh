  md: '# PUT Statement, Formatted


    Writes variable values with the specified format in the output line.


    +   **Valid in:** DATA step

    **Category:** File-handling

    **Type:** Executable


    # Syntax


    ```

    PUT <pointer-control> variable format. <@ | @@>;

    PUT <pointer-control> (variable-list) (format-list)

    <@ | @@>;

    ```


    # Arguments


    **pointer-control**nmoves the output pointer to a specified line or column.


    **See:**

    “Column Pointer Controls ” on page 291

    “Line Pointer Controls ” on page 292


    **Example:** “Example 1: Writing a Character between Formatted Values” on page
    310


    **variable**nspecifies the variable value is written.


    **(variable-list)**

    specifies a list of variables whose values are written.

    **Requirement:** The (format-list) must follow the (variable-list).

    **See:** “How to Group Variables and Formats” on page 310


    **Example:** “Example 1: Writing a Character between Formatted Values” on page
    310


    **format.**nspecifies a format to use when the variable values are written. To
    override the default alignment, you can add an alignment specification to a format:


