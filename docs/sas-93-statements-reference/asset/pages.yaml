    \ Name Split into Three Parts\n\n# The SAS System\n\n| Obs | commodity | type\
    \ | instrument |\n|---|---|---|---|\n| 1 | 395 GAS | PRICE | OPT |\n| 2 | 840\
    \ GAS | RBID | OPT |\n| 3 | 275 GAS | PRICE | FORWARD |\n\n# Example 13: Using\
    \ Data Set Lists\n\nThis example uses a numbered range list to input the data\
