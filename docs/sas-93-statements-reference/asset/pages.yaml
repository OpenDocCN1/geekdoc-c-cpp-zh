  md: '# INFORMAT Statement


    Associates informats with variables.


    **Valid in:** DATA step or PROC step


    **Category:** Information


    **Type:** Declarative


    # Syntax


    ```

    INFORMAT variable-1 <...variable-n> <informat>;

    INFORMAT <variable-1> <..., variable-n> <DEFAULT=default-informat>;

    INFORMAT variable-1 <...variable-n> informat <DEFAULT=default-informat>;

    ```


    # Arguments


    *variable*


    specifies one or more variables to associate with an informat. You must specify
    at least one variable when specifying an informat or when including no other arguments.
    Specifying a variable is optional when using a DEFAULT= informat specification.


    > **Tip:** To disassociate an informat from a variable, use the variable''s name
    in an INFORMAT statement without specifying an informat. Place the INFORMAT statement
    after the SET statement. See "Example 3: Removing an Informat" on page 193.


    *informat*


    specifies the informat for reading the values of the variables that are listed
    in the INFORMAT statement.


    > **Tip:** If an informat is associated with a variable by using the INFORMAT
    statement, and that informat is not associated with that same variable in the
    INPUT statement, then that informat will behave like informats that you specify
    with a colon (:) modifier in an INPUT statement. SAS reads the variables by list
    input with an informat. For example, you can use the : modifier with an informat
    to read character values that are longer than eight bytes, or numeric values that
    contain nonnumeric data. For details, see "INPUT Statement, List" on page 215.


    **See:** SAS Formats and Informats: Reference


    **Example:** "Example 2: Specifying Numeric and Character Informats" on page 192


    DEFAULT=default-informat


    specifies a temporary default for reading the values of the variables that are
    listed in the INFORMAT statement. If no variable is specified, then the DEFAULT=
    informat specification applies a temporary default for reading values of all the
    variables of that type included in the DATA step. Numeric informats are applied
    to numeric variables, and character informats are applied to character variables.
    These default informats apply only to the current DATA step.


    A DEFAULT= informat specification applies to


    +   * variables that are not named in an INFORMAT or ATTRIB statement'
