  md: "# Null Statement\n\n# Without Arguments\n\nThe Null statement signals the end\
    \ of the data lines that occur in your program.\n\n# Details\n\nThe primary use\
    \ of the Null statement is to signal the end of data lines that follow a DATALINES\
    \ statement. In this case, the Null statement functions as a step boundary. When\
    \ your data lines contain semicolons, use the DATALINES4 or CARDS4 statement and\
    \ a Null statement of four semicolons. \n\nAlthough the Null statement performs\
    \ no action, it is an executable statement. Therefore, a label can precede the\
    \ Null statement, or you can use it in conditional processing.\n\n# Example: Marking\
    \ the End of Data Lines\n\n+   The Null statement in this program marks the end\
    \ of data lines and functions as a step boundary.\n\n```\ndata test;\ninput score1\
    \ score2 score3;\ndatalines;\n55 135 177\n44 132 169\n;\n```\nThe input data records\
    \ in this example contain semicolons. Use the Null statement following the DATALINES4\
    \ statement to signal the end of the data lines.\n\n```\ndata test2;\ninput code1\
    \ $ code2 $ code3 $;\ndatalines4;\n55;39:1 135;32:4 177;27:3;\n78;29:1 149;22:4\
    \ 179;37:3;\n###;\n```nThe Null statement is useful while you are developing a\
    \ program. For example, use it after a statement label to test your program before\
    \ you code the statements that follow the label.\n\n```\ndata_null;\nset dsn;\n\
    file print header=header;\nput 'report text';\n...more statements...\nreturn;\n\
    header;\nrun;\n```\n\n# See Also\n\n# Statements:\n\n+   - “DATALINES Statement”\
    \ on page 56\n- “DATALINES4 Statement” on page 57"
  merge: -1
