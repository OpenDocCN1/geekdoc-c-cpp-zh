  md: '# WINDOW Statement 383


    Specifying several groups within a window prevents repetition of options that
    do not change and helps to keep track of related displays. For example, if you
    are defining a window to check data values, arrange the display of variables and
    messages for most data values in the data set in a group that is named STANDARD.
    Arrange the display of different messages in a group that is named CHECKIT appears
    when data values meet the conditions you want to check.


    # Details


    # The Basics


    Operating Environment Information


    The WINDOW statement has some functionality that might be specific to your operating
    environment. For details, see the SAS documentation for your operating environment.


    You can use the WINDOW statement in the SAS windowing environment, in interactive
    line mode, or in noninteractive mode where you can create customized windows for
    your applications.¹¹ Windows that you can create display text and accept input;
    they have command and message lines. The window name appears at the top of the
    window. Use commands and function keys with windows that you create. A window
    definition remains in effect only for the DATA step that contains the WINDOW statement.


    Define a window before you display it. Use the DISPLAY statement to display windows
    that are created with the WINDOW statement. For more information, see the “DISPLAY
    Statement” on page 60.


    # Field Definitions


    Use a field definition to identify a variable or character string to be displayed,
    its position, and its attributes. Enclose character strings in quotation marks.
    The position of an item is its beginning row (or line) and column. Attributes
    include color, whether you can enter a value into the field, and characteristics
    such as highlighting.


    You can define a field to contain a variable value or a character string, but
    not both. The form of a field definition for a variable is


    ```

    <row column> <format> options

    ```


    The form for a character string is


    ```

    <row column> ‘character-string’ options

    ```


    The elements of a field definition are described here.


    row column


    specifies the position of the variable or character string.


    SAS keeps track of its position in the window with a pointer. For example, when
    you tell SAS to write a variable''s value in the third column of the second row
    of a window, the pointer moves to row 2, column 3 to write it. Use the pointer
    controls that are listed to move the pointer to the appropriate position for a
    field.


    In a field definition, row can be one of these row pointer controls:


    +   #n specifies row n within the window.

    Range: n must be a positive integer.


    > ¹ You cannot use the WINDOW statement in batch mode because no computer is connected
    to a batch executing.'
