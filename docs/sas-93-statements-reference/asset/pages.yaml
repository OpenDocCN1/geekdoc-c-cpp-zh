    # DISPLAY Statement


    Displays a window that is created with the WINDOW statement.


    | Valid in: | DATA step |

    | Category: | Window Display |

    | Type: | Executable |


    # Syntax


    DISPLAY window.<group> <NOINPUT> <BLANK> <BELL> <DELETE>;


    # Arguments


    window.<group>


    names the window and group of fields to be displayed. This field is preceded by
    a period (.).


    **Tip:** If the window has more than one group of fields, give the complete window.group
