  md: "# Details\n\nUsing the DATA Statement\nThe DATA step begins with the DATA statement.\
    \ Use the DATA statement to create the following types of output: SAS data sets,\
    \ data views, and stored programs. You can specify more than one in a DATA statement.\
    \ However, only one of the outputs is a data view. You create a view by specifying\
    \ the VIEW= option on page 49 and a stored program by specifying the PGM= option\
    \ on page 50.\n\n# Using Both a READ and an ALTER Password\nIf you use both a\
    \ READ and an ALTER password in creating a stored compiled DATA step program or\
    \ a DATA step view, the following items apply:\n\n+   - A READ or ALTER password\
    \ is required to execute the stored compiled DATA step program or DATA step view.\n\
    - A ALTER password is required if the stored compiled DATA step program or DATA\
    \ step view contains both DESCRIBE and EXECUTE statements.\n- If you use an ALTER\
    \ password with the DESCRIBE and EXECUTE statements, the following items apply:\n\
    - SAS executes both the DESCRIBE and the EXECUTE statements.\n- If you execute\
    \ a stored compiled DATA step program or DATA step view with an invalid ALTER\
    \ password:\nThe DESCRIBE statement does not execute.\n batch mode, the EXECUTE\
    \ statement has no effect. In interactive mode, SAS prompts you for a READ password.\
    \ If the READ password is valid, SAS processes the EXECUTE statement. If it is\
    \ invalid, SAS does not process the EXECUTE statement.\n- If you use a READ password\
    \ with the DESCRIBE and EXECUTE statements, the following items apply:\n- In interactive\
    \ mode, SAS prompts you for the ALTER password:\n- If you enter a valid ALTER\
    \ password, SAS executes both the DESCRIBE and the EXECUTE statement.\n- If you\
    \ enter an invalid ALTER password, SAS processes the EXECUTE statement but not\
    \ the DESCRIBE statement.\n- In batch mode, SAS processes the EXECUTE statement\
    \ but not the DESCRIBE statement.\n- In interactive and batch modes, if you specify\
    \ an invalid READ password SAS does not process the EXECUTE statement.\n- An ALTER\
    \ password is required if the stored compiled DATA step program contains a DESCRIBE\
    \ statement.\n- An ALTER password is required to replace the stored compiled DATA\
    \ step program or DATA step view.\n\n# Creating an Output Data Set (Form 1)\n\
    Use the DATA statement to create one or more output data sets. You can use data\
    \ set options to customize the output data set. The following DATA step creates\
    \ two output"
