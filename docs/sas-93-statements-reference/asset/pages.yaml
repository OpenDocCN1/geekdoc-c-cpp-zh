    **Tips:**


    Including internal lines is most useful in interactive line mode processing.

    Use a %LIST statement to determine the line numbers that you want to include.


    Although you can use the %INCLUDE statement to access previously submitted lines
    when you run SAS in a windowing environment, it might be more practical to recall
    lines in the Program Editor with the RECALL command and then submit the lines
    with the SUBMIT command.'
