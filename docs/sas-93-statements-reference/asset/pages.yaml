    # Operating Environment Options


    For descriptions of operating-environment-specific options in the FILE statement,
    see the SAS documentation for your operating environment.


    # Details


    # Overview


    By default, PUT statement output is written to the SAS log. Use the FILE statement
    to route this output to either the same external file to which procedure output
    is written or to a different external file. You can indicate whether carriage-control
    characters should be added to the file. Use the PRINT|NOPRINT option on page 86.


    You can use the FILE statement in conditional (IF-THEN) processing because it
    is executable. You can also use multiple FILE statements to write more than one
    external file in a single DATA step.


    # Operating Environment Information


    Using the FILE statement requires operating-environment-specific information.
    See the SAS documentation for your operating environment before you use this statement.


    You can use the Output Delivery System with the FILE statement to write DATA step
    results. For details, see the "FILE Statement for ODS" in SAS Output Delivery:
    User''s Guide.


    # Updating an External File in Place


    You can use the FILE statement with the INFILE and PUT statements to update an
    external file in place, updating either entire record or only selected fields
    within a record. Follow these guidelines:


    +   * Always place the INFILE first.


    +   * Specify the fileref or physical filename in the INFILE and FILE statements.


    +   * Use options that are common to both the INFILE and FILE statements in the
    INFILE statement. (Any options that are used in the FILE statement are ignored.)


    +   * Use the SHAREBUFFERS option in the INFILE statement to allow the INFILE
    and FILE statements to use the same buffer, which saves CPU time and enables you
    to update individual fields instead of entire records.


    # Accessing the Contents of the Output Buffer


    In addition to _FILE_= variable, you can use the automatic FILE variable to reference
    the contents of the current output buffer for the most recent execution of the
    FILE statement. This character variable is automatically retained and initialized
    to blanks.


    When you use the _FILE_= option in a FILE statement, this variable is also indirectly
    referenced by the automatic _FILE_ variable. If the automatic _FILE_ variable
    is present and you omit _FILE_ in a particular FILE statement, then SAS


