    # Without Arguments


    The LOSTCARD statement prevents SAS from reading a record from the next group
    when the current group has a missing record.


    # Details


    # When to Use LOSTCARD


    When SAS reads multiple records to create a single observation, it does not discover
    that a record is missing until it reaches the end of the data. If there is a missing
    record in your'
