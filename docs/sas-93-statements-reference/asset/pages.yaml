  md: "# Array Reference Statement\n\nThe DIM function is often used with the iterative\
    \ DO statement to return the number of elements in a dimension of an array, when\
    \ the lower bound of the dimension is 1. If you use DIM, you can change the number\
    \ of array elements without changing the upper bound of the DO statement. For\
