- img_proc: true
  md: '# INFILE Statement 181


    statement with the file specification DATALINES take advantage of certain data-reading
    options that affect how the INPUT statement reads instream data.


    # Examples


    # Example 1: Changing How Delimiters Are Treated


    By default, the INPUT statement uses a blank as the delimiter. This DATA step
    uses a comma as the delimiter:


    ```

    data num;

    infile datalines dsd;

    input x y z;

    datalines;


    2,3,6

    4,5,6

    7,8,9

    ;

    ```


    The argument DATALINES in the INFILE statement enables you to use an INFILE statement
    option to read instream lines. The Dsd option sets the comma as the default delimiter.
    Because a comma precedes the first value in the first line, a missing value is
    assigned to X in the first observation, and the value 2 is assigned to Y.


    If the data uses multiple delimiters or a single delimiter other than a comma,
    then simply specify the delimiter with the DELIMITER=option. In this example,
    the characters a and b function as delimiters:


    ```

    data num;

    infile datalines dsd delimiter=''ab'';

    input X Y Z;

    datalines;


    1aa2ab3

    4b5bab6

    7ae8b

    ;

    ```


    The output that PROC PRINT generates the resulting NUM data set. Values are missing
    for the first and second observations because DSD causes list input to detect
    two consecutive delimiters. If you omit DSD, the characters a, b, aa, ab, ba,
    or bb function as the delimiter and no variables are assigned missing values.


    # Output 2.6 The NUM Data Set


    # The SAS System


    | Obs | X | Y | Z |

    |---|---|---|--|

    | 1 | . | | |

    | 2 | 4 | 5 | | |

    | 3 | 7 | 8 | 9 |'
