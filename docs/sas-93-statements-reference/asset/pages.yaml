  md: '# RETAIN Statement


    Causes a variable that is created by an INPUT or assignment statement to retain
    its value from one iteration of the DATA step to the next.


    +   Valid in: DATA step


    +   Category: Information


    +   Type: Declarative


    # Syntax


    ```

    RETAIN <element-list(s) <initial-value(s)| (initial-value-I) | (initial-value-list-I)>
    <element-list-n<initial-value-n> | (initial-value-n) | (initial-value-list-n)>>;

    ```


    # Without Arguments


    If you do not specify an argument, the RETAIN statement causes the values of all
    variables that are created with INPUT or assignment statements to be retained
    from one iteration of the DATA step to the next.


    # Arguments


    +   element-list

    species variable names, variable lists, or array names whose values you want retained.


    +   Tips:

    If you specify _ALL_, CHAR_, or _NUMERIC_, only the variables that are defined
    before the RETAIN statement are affected.

    If a variable name is specified *only in* the RETAIN statement and you do not
    specify an initial value, the variable is *not* written to the data set, and a
    note stating that the variable is uninitialized is written to the SAS log. If
    you specify an initial value, the variable is written to the data set.


    +   initial-value

    species an initial value, numeric or character, for one or more of the preceding
    elements.


    +   Tip: If you omit initial-value, the initial value is missing. *Initial-value*
    is assigned to all the elements that precede it in the list. All members of a
    variable list, therefore, give the same initial value.


    +   See: (initial-value) and (initial-value-list)


    +   (initial-value)

    species an initial value, numeric or character, for a single preceding element
    or for the first in a list of preceding elements.


    +   (initial-value-list)

    species an initial value, numeric or character, for a single preceding element
    in the preceding list. SAS matches the first value in the list with the first
    variable in the list of elements, the second value with the second variable, and
    so on.


    Element values are enclosed in quotation marks. To specify one or more initial
    values directly, using the following format:


    ```

    (initial-value(s))

    ```'
  merge: -1
  pgno: 342
- img_proc: true
  md: '# Chapter 2 · Dictionary of SAS Statements


    To specify an iteration factor and nested sublists for the initial values, use
    the following format:


    ```

    <constant-iter-value*> <<constant value | constant-sublist->>

    ```


    **Restriction:** If you specify both an initial-value-list and an element-list,
    then element-list must be listed before initial-value-list in the RETAIN statement.


    **Tips:**


    +   You can separate initial values by blank spaces or commas,


    +   You can also use a shorthand notation for specifying a range of sequential
    integers. The increment is always +1.


    +   You can assign initial values to variables and temporary data elements.


    If there are more variables than initial values, the remaining variables are assigned
    an initial value of missing and SAS issues a warning message.


    # Details


    # Default DATA Step Behavior


    Without a RETAIN statement, SAS automatically sets variables that are assigned
    by an INPUT or assignment statement to missing before each iteration of the DATA
    step.


    # Assigning Initial Values


    Use a RETAIN statement to specify initial values for individual variables, a list
    of variables, or members of an array. If a value appears in a RETAIN statement,
    variables that appear before it in the list are set to that value initially (If
    you assign different values to the same variable by naming it more than once in
    a RETAIN statement, SAS uses the last value.) You can also use RETAIN to assign
    an initial value other than the default value of 0 to a variable whose value is
    assigned by a sum.


    # Redundancy


    It is redundant to name any of these items in a RETAIN statement, because values
    are automatically retained from one iteration of the DATA step to the next:


    +   variables that are read with SET, MERGE, MODIFY or UPDATE statement


    +   a variable whose value is assigned in a sum statement


    +   the automatic variables _N_, _ERROR_, _I_, _CMD_, and _MSG


    +   variables that are created by the END- or IN option in the SET, MERGE, MODIFY,
    or UPDATE statement or by options that create variables in the FILE and INFILE
    statements


    +   data elements that are specified in a temporary array


    +   array elements that are initialized in the ARRAY statement


    +   elements of an array that have assigned initial values to any or all of the
    elements in the ARRAY statement.


    You can, use a RETAIN statement to assign an initial value to any of the previous
    items, with the exception of _N_ and _ERROR_


    # Comparisons


    The RETAIN statement specifies variables whose values are not set to missing at
    the beginning of each iteration of the DATA step. The KEEP statement specifies
    variables that are to be included in any data set that is being created.'
