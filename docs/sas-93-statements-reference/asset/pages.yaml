    # FILENAME Statement


    Associates a SAS fileref with an external file or an output device, disassociates
    a fileref and external file, or lists external files.


    | Valid in: | Anywhere |

    | Category: | Data Access |

    | See: | FILENAME Statement under Windows, UNIX, and z/OS |


    # Syntax


    ```

    Form 1: FILENAME fileref <device-type> ''external-file'' <encoding=encoding-value>
    <options> <operating-environment-options>

    Form 2: FILENAME fileref <device-type> <options> <operating-environment-options>

    Form 3: FILENAME filerefCLEAR | ALL, CLEAR;

    Form 4: FILENAME fileref LIST | ALL, LIST;

    ```


    # Arguments


    fileref

    is any SAS name that you use when you assign a new fileref. When you disassociate
    a currently assigned fileref or you list file attributes with the FILENAME statement,
    specify a fileref that was previously assigned with a FILENAME statement or an
    operating environment-level command.


    > Tip: The association between a fileref and an external file lasts only for the
    duration of the SAS session or until you change or discontinue it. Change the
    fileref for a file as often as you want.


    ''external-file''

    is the physical name of an external file. The physical name is the name that is
    recognized by the operating environment.'
