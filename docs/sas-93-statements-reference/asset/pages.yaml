    #  Syntax


    ```

    ARRAY array-name { subscript } $< <length>

    <array-elements> <initial-value-list>;

    ```


    #  Arguments


    array-name


    specifies the name of the array.


    **Restriction:** Array-name must be a SAS name that is not the name of a SAS variable
    in the same DATA step.


    **CAUTION: Using the name of a SAS function as an array name can cause unpredictable
    results.** If you inadvertently use a function name as the name of the array,
    SAS treats parenthetical references that involve the name as array references,
    function references, for the duration of the DATA step. warning message is written
    to the SAS log.


    <subscript>


    describes the number and arrangement of elements in the array by using an asterisk,
    a number, or a range of numbers. *Subscript* has one of these forms:


    <dimension-size(s)>


    specifies the number of elements in each dimension of the array. *Dimension-size*
    is a numeric representation of either the number of elements in a one-dimensional
    array or the number of elements in each dimension of a multidimensional array.


    **Tip:** You can enclose the subscript in braces ({}), in brackets ([ ]) or parentheses
    (( ))


    Examples:


    This ARRAY statement defines a one dimensional array that is named SIMPLE. THE
    SIMPLE array groups together three variables that are named RED, GREEN, and YELLOW:


    ```

    array[3] red green yellow;

    ```


    An array with more than one dimension is known as a multidimensional array. You
    can have any number of dimensions in a multidimensional array. For example, a
    two-dimensional array provides row and column arrangement of array elements. SAS
    places variables into a two-dimensional array by filling rows in order, beginning
    at the upper corner of the array (known as row-major order). This statement defines
    a multidimensional array with five rows and three columns:


    ```

    x[5,3] score1-score5;

    ```


    ```

    {<lower>,...,<lower > upper>}

    ```


    are the bounds of each dimension of an array, where *lower* is the lower bound
    of that dimension and *upper* is the upper bound.


    **Range:** In explicit arrays, the subscript in each dimension of the array ranges
    from 1 to n, where *n* is the number of elements in that dimension.


    Tips:


    For most arrays, 1 is a convenient lower bound. Thus, you do not need to specify
