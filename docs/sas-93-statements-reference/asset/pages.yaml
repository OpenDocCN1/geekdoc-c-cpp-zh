  md: '# 164 Chapter 2 • Dictionary of SAS Statements


    To reference a file using a fileref rather than the actual filename, you can use
    the FILENAME statement (or a command recognized by your operating environment)
    to assign a fileref:


    ```

    filename infile ''MYFILE'';

    ```


    You can later access MYFILE with the fileref IN1:


    ```

    %inc1;

    ```


    +   If you want to use many files that are stored in a directory, MACLIB (or whatever
    your operating environment calls an aggregate storage location), you can assign
    the fileref to the larger storage unit and then specify the filename. For example,
    this FILENAME statement assigns the fileref STORAGE to an aggregate storage location:


    ```

    filename storage

    ''aggregate-storage-location'';

    ```


    You can later include a file using this statement:


    ```

    %inc storage (MYFILE);

    ```


    +   You can also access several files or members from this storage location by
    listing them in parentheses after the fileref in a single %INCLUDE statement.
    Separate filenames with a comma or a blank space. The %INCLUDE statement demonstrates
    this:


    ```

    %inc storage (file-1,file-2,file-3);

    ```


    When the file does not have the default .SAS extension, you can access it using
    quotation marks around the complete filename listed inside the parentheses.


    ```

    %inc storage ("file-1.txt", "file-2.dat",

    "file-3.cat");

    ```


