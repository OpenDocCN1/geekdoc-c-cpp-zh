    You can specify additional SAS data sets.


    See: “Using Data Sets with MERGE” on page 259


    # (data-set-options)


    specifies one or more SAS data set options in parentheses after a SAS data set
    name.

    Note: The data set options specify action SAS is to take when it reads observations
    into the DATA step for processing. For a list of data set options, see the SAS
    Data Set Options: *Reference*


    Tip: Data options that apply to a data list apply to all of the data sets in the
    list.


    # END=variable


    names and creates a temporary variable that contains an end-of-file indicator.

    Note: The variable, which is initialized to 0, is set to 1 when the MERGE statement
    processes the last observation. If the input data sets have different numbers
    of observations, the END= variable is set to 1 when MERGE processes the last observation
    from all data sets.


    Tip: The END= variable is not added to any SAS data set that is being created.


    # Details


    Overview

    The MERGE statement is flexible and has a variety of uses in SAS programming.
    This section describes basic uses of MERGE. Other applications include using more
    than one BY variable, merging more than two data sets, and merging a few observations
    with all observations in another data set.


    For more information, see “HHow to Prepare Your Data Sets” in Chapter 21 of SAS
    Language Reference: *Concepts*.


    # Using Data Set Lists with MERGE


    You can use data lists with the MERGE statement. Data set lists provide a quick
    way to reference groups of data sets. Data set lists must be either prefix lists
    or numbered ranges.


    Name prefix lists refer to all data sets that begin with a specified character
    string. For example, SALES1; tells SAS to merge all data sets starting with "SALES1"
    such as SALES1, SALES10, SALES11, and SALES12.


    Numbered range lists require you to have a series of data sets with the same name,
    except for the last character or characters, which are consecutive numbers. In
    a numbered range list, you can begin with any number and end with any number.
    For example, these lists refer to the same data sets:


    ```

    sales1 sales2 sales3 sales4

    sales1-sales4

    ```'
