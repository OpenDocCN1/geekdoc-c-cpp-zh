    \ the statements process each element of the array, using the value of variable\
    \ I as the subscript on the array references for each iteration of the DO loop.\
    \ If an array element has a value of 99, the IF-THEN statement changes that value\
    \ to 100.\n\n```\narray days[7] d1-d7;\ndo i=1 to 7;\n  if days[i]=99 then days[i]=100;\n\
    end;\n```\n\n# Example 2: Referencing Many Arrays in One Statement\n\nYou can\
    \ refer to more than one array in a single SAS statement. In this example, you\
