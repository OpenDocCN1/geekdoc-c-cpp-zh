- img_proc: true
  md: "# Details\n\nAlthough the RUN statement is not required between steps in a\
    \ SAS program, using it creates a step boundary and can make the SAS log easier\
    \ to read.\n\n# Examples\n\n# Example 1: Executing SAS Statements\n\nThis RUN\
    \ statement marks a step boundary and executes this PROC PRINT step:\n\n```\n\
    proc print data=report;\n  title 'Status Report';\nrun;\n```\n\n# Example 2: Using\
    \ the CANCEL Option\n\nThis example shows the usefulness of the CANCEL option\
    \ in a line prompt mode session. The fourth statement in the DATA step contains\
    \ an invalid value for PI (4.13 instead of 3.14). RUN with CANCEL ends the DATA\
    \ step and prevents it from executing.\n\n```\ndata circle;\n  infile file-specification;\n\
    \  input radius;\n  c=2*4.13*radius;\n  cancel;\n```\n\nThe following message\
    \ is written to the SAS log:\nWARNING: DATA step not executed at user's request.\n\
    \n# %RUN Statement\n\nEnds source statements following a %INCLUDE * statement.\n\
    \n+   **Valid in:** Anywhere\n**Category:** Program Control\n\n# Syntax\n\n```\n\
    %RUN;\n```\n\n# Without Arguments\n\nThe %RUN statement causes SAS to stop reading\
    \ input from the keyboard (including subsequent SAS statements on the same line\
    \ as %RUN) and resume reading from the previous input source.\n\n# Details\n\n\
    Using the %INCLUDE statement with an asterisk specifies that you enter source\
    \ lines from the keyboard.\n\nNote: The asterisk (*) cannot be used to specify\
    \ keyboard entry if you use the Enhanced Editor in the Microsoft Windows operating\
    \ environment."
