    # Preparing Your Data Sets before Using MODIFY


    There are a number of things that you can do using the MODIFY statement to improve
    performance and get the results you want when using. For more information, see
    *Combining SAS Data Sets: Basic Concepts* in Chapter 21 of *SAS Language Reference:
    Concepts*.


    # Automatic Variable _IORC_ and the SYSRC Autocall Macro


    The automatic variable _IORC_ contains the return code for each I/O operation
    that the MODIFY statement attempts to perform. The best way to test for values
    of _IORC_ is with the mnemonic codes provided by the SYSRC autocall macro. Each
    mnemonic code describes one condition. The mnemonics provide an easy method for
    testing problems in a DATA step program. These codes are useful:


    +   _DSENMR

    specifies that the transaction data set observation does not exist on the master
    data set (used only with MODIFY and BY statements). If consecutive observations
    with different BY values do not find a match in the master data set, both of them
    return _DSENMR.


    +   _DEMTR

    specifies multiple transaction data set observations with a given BY value do
    not exist on the master data set (used only with MODIFY and BY statements). If
    consecutive observations with the same BY values do not find a match in the master
    data set, the first observation returns _DSENMR and the subsequent observations
    return _DEMTR.


    +   _DSENOM

    specifies that the data set being modified does not contain the observation that
    is requested by the KEY= option or the POINT= option.


    +   _SENOCHN

    specifies that SAS is attempting to execute an OUTPUT or REPLACE statement on
    an observation that contains a key value which duplicates one already on an indexed
    data set that requires unique key values.


    +   _SOK

    specifies that the observation was located.


    Note: The IORCMSG function returns a formatted error message associated with the
    current value of _IORC_.


    “Example 7: Controlling I/O” on page 279 shows how to use the automatic variable
    _IORC_ and the SYSRC autocall macro.


