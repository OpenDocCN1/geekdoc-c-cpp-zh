    # operating-environment-options


    **Operating environment:** Operating environments can support various options
    for the %INCLUDE statement. See the documentation for your operating environment
    for a list of these options and their functions.


    # Details


    What %INCLUDE Does

    When you execute a program that contains the %INCLUDE statement, SAS executes
    your code, including any statements or data lines that you bring into the program
    with %INCLUDE.


    Operating Environment Information

    Use of the %INCLUDE statement is dependent on your operating environment. See
    the documentation for your operating environment for more information about additional
    software features and methods of referring to and accessing your files. See your
    documentation before you run the examples for this statement.


    Three Sources of Data

    The %INCLUDE statement accesses SAS statements and data lines from three possible
    sources:


    +   * external files

    * lines entered earlier in the same job or session

    * lines entered from the keyboard.


    When Useful

    The %INCLUDE statement is most often used when running SAS in interactive line
    mode, noninteractive mode, or batch mode. Although you can use the %INCLUDE statement
    when you run SAS using windows, it might be more practical to use the INCLUDE
    and RECALL commands to access data lines and program statements, and submit these
    lines again.'
