  md: "# 390 Chapter 2 • Dictionary of SAS Statements\n\n```\ndata_null;\narray row[3]\
    \ r1-r3;\narray col[3] c1-c3;\ninput row(*) col(*);\nwindow One\nrows=20 columns=36\n\
    #14 'PERSIST+YES' color=black\n#@row(i) @col(i) 'Hello'\ncolor-black persist=yes;\n\
    window Two\nicolumn=43 rows=20 columns=36\n#14 'PERSIST+NO' 'Hello'\n#@row(i)\
    \ @col(i) persist=no\ncolor-black persist=no;\ndo i=1 to 3\n  display One;\n \
    \ display Two;\nend;\ndatalines;\n5 10 15 5 10 15;\n```\n\nThe following windows\
    \ show the results of this DATA step after its third iteration.\n\n![](img/df01a42b751f4ba4ce8fe6c9da27f93d_403_0.png)\n\
    \nNote that window One shows Hello in all three positions in which it was displayed.\n\
    Window Two shows only the third and final position in which Hello was displayed.\n\
    \nExample 4: Sending a Message\nThis example uses the CMD_ and MSG_ automatic\
    \ variables to send a message when you execute an erroneous windowing command\
    \ in a window that is defined with the WINDOW statement:\n\n```\nif _cmd_ne !=\
    \ '' then\n  _msg_='CAUTION: UNRECOGNIZED COMMAND' || _cmd_;\n```\n\nWhen you\
    \ enter a command that contains an error, SAS sets the value of CMD_ to the text\
    \ of the erroneous command. Because the value of CMD_ is no longer blank, the\
    \ IF statement is true. The THEN statement assigns to MSG_ the value that is created\
    \ by concatenating CAUTION: UNRECOGNIZED COMMAND and the value of CMD_ (up to\
    \ a total of 80 bytes). The next time a DISPLAY statement displays the window,\
    \ the message window displays the following:\n\n```\nCAUTION: UNRECOGNIZED COMMAND\
    \ command\n```"
