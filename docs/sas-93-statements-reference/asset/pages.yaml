- img_proc: true
  md: '+   * variables that are not permanently associated with an informat within
    a SAS set


    +   * variables that are not read with an explicit informat in the CURRENT DATA
    step.


    **Default:** If you omit DEFAULT=, SAS uses w.d as the default numeric informat
    and sw as the default character informat.


    **Restriction:** Use this argument only in a DATA step.


    **Tip:** A DEFAULT= specification can occur anywhere in an INFORMAT statement.
    It can specify either a numeric default, a character default, or both.


    **Example:** *Example 1: Specifying Default Informats* on page 192


    # Details


    # **The Basics


    An INFORMAT statement in a DATA step permanently associates an informat with a
    variable. You can specify standard SAS informats or user-written informats, previously
    defined in PROC FORMAT. A single INFORMAT statement can associate the informat
    with several variables, or it can associate different informats with different
    variables. If a variable appears in multiple INFORMAT statements, SAS uses the
    inform that is assigned last.


    # **CAUTION:**


    +   * Because an INFORMAT statement defines the length of previously undefined
    character variables, you can truncate character variables in a DATA step if an
    INFORMAT statement precedes a SET statement.


    # How SAS Treats Variables When You Assign Informats with the INFORMAT Statement


    Informats that are associated with variables by using the INFORMAT statement behave
    like informs that are used with modified list input. SAS reads the variables by
    using the scanning feature of list input, but applies the informat. In modified
    list input, SAS


    +   * does not use the value of w in an informat to specify column positions or
    input field widths in an external file


    +   * uses the value of w in an informat to specify the length of previously undefined
    character variables


    +   * ignores the value of w in numeric informats


    +   * uses the value of d in an informat in the same way it usually does for numeric
    informats


    +   * treats blanks that are embedded as input data delimiters unless you change
    their status with a DLM= or DLMSTR= option specification in an INFILE.


    If you have coded the INPUT statement to use another style of input, such as formatted
    input or column input, that style of input is not used when you use the INFORMAT
    statement.


    # Comparisons


    +   * Both the ATTRIB and INFORMAT statements can associate informats with variables,
    and both statements can change the informat that is associated with a variable.
    You can also use the INFORMAT statement in PROC DATASETS to change or remove the
    informat that is associated with a variable. The SAS'
