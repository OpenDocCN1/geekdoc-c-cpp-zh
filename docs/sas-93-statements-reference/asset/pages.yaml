- img_proc: true
  md: "# Acquiring Exclusive Access to a SAS File in a Single-User Environment\n\n\
    Each time you use a SAS statement or a procedure to process a SAS file, the file\
    \ is opened for input, update, or output processing. At the end of the step, the\
    \ file is closed. In a program with multiple tasks, a file could be opened and\
    \ closed multiple times. Because multiple SAS sessions in a single-user environment\
    \ can access the same SAS file, issuing the LOCK statement to acquire an exclusive\
    \ lock on the file protects data while it is being updated in a multiprocess.\n\
    \nFor example, consider a nightly update process that consists of a DATA step\
    \ to remove observations that are no longer useful, a SORT procedure to sort the\
    \ file, and DATASETS procedure to rebuild the file's indices. If any SAS session\
    \ accesses the file between any of the steps, the SORT and DATASETS procedures\
    \ would fail, because they require member-level locking (exclusive) access to\
    \ the file.\n\nIncluding the LOCK statement before the DATA step provides the\
    \ needed protection by acquiring exclusive access to the file. If the LOCK statement\
    \ is successful, a SAS session that attempts to access the file between steps\
    \ will be denied access, and the nightly update process runs uninterrupted. See\
    \ \"Example: Locking a SAS File\" on page 255.\n\n# Return Codes for the LOCK\
    \ Statement\n\nThe SAS macro SYSLCKRC contains the return code from the LOCK statement.\
    \ The following actions result in a nonzero value in SYSLCKRC:\n\n+   * You try\
    \ to lock a file but cannot obtain the lock (for example, the file was in use\
    \ or locked by another SAS session).\n* Use a LOCK statement with the LIST option\
    \ to list a lock.\n* You use a LOCK statement with the CLEAR option to release\
    \ a lock that you do not have.\n\nFor more information about the SYSLCKRC SAS\
    \ variable, see SAS Macro Language: Reference.\n\n# Comparisons\n\n+   * With\
    \ SAS/SHARE software, you can also use the LOCK statement. Some LOCK functionality\
    \ applies only to a client/server environment.\n\n+   * The CNTLEV= data set option\
    \ specifies the level at which shared update access to a SAS data set is denied.\n\
    \n# Example: Locking a SAS File\n\nThe following program illustrates the process\
    \ of locking a SAS data set. Including the LOCK statement provides protection\
    \ for the multiprocess by by acquiring exclusive access to the file. Any SAS session\
    \ that attempts to access the file between steps will be denied access, which\
    \ ensures that the program runs uninterrupted.\n\n```\nlibname mydata 'SAS-library';\n\
    lock mydata.census; 1\ndata mydata.census; 2\nmodify mydata.census;\n  (statements\
    \ to remove obsolete observations)\n\nrun;\nproc sort data=mydata.census; 3\n\
    by CrimeRate;\n```"
