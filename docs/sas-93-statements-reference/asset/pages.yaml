    # How SAS Treats Transcoded Variables When You Use the SET and MERGE Statements


    When you use the SET or MERGE statement to create a data set from several data
    sets, SAS makes the TRANSCODE= attribute of the variable in the output data set
    equal to the TRANSCODE= value of the variable in the first data set. See "Example
    2: Using the Set Statement with Transcoded Variables" on page 34 and "Example
    3: Using the MERGE Statement with Transcoded Variables" on page 34.


    Note: The TRANSCODE= attribute is set when the variable is first seen on an input
    data set or in an ATTRIB TRANSCODE statement. If a SET or MERGE statement comes
    before an ATTRIB TRANSCODE= statement and the TRANSCODE= attribute credits the
    SET statement, a warning will occur.


    # Comparisons


    You can use either an ATTRIB statement or an individual attribute statement such
    as FORMAT, INFORMAT, LABEL, and LENGTH to change an attribute that is associated
    with a variable.


    # Examples


    # Example 1: Examples of ATTRIB Statements with Varying Numbers of Variables and
    Attributes


    Here are examples of ATTRIB statements that contain different numbers of variables
    and attributes:


    +   • single variable and single attribute:

    attrib cost length=4;


    +   • single variable with multiple attributes:

    attrib salesday informat=mmddyy.\nformat=worddate.;


    +   • multiple variables with the same multiple attributes:

    attrib x length=$4 label=''TEST VARIABLE'';


    +   • multiple variables with different multiple attributes:

    attrib x length=$4 label=''TEST VARIABLE''

    y length=$2 label=''RESPONSE'';


    +   • variable list with single attribute:

    attrib month1-month12

    label=''MONTHLY SALES'';'
