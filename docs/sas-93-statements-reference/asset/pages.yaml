  md: "# Simple List Input\n\nSimple list input places several restrictions on the\
    \ type of data that the INPUT statement can read:\n\n+   - By default, at least\
    \ one blank must separate the input values. Use the DLM= or DLSTR= option or the\
    \ DSD option in the INFILE statement to specify a delimiter other than a blank.\n\
    - Represent each missing value with a period, not a blank, or two adjacent delimiters.\n\
    - Character input values cannot be longer than 8 bytes unless units is given a\
    \ longer length in an earlier LENGTH, ATTRIB, or INFORMAT statement.\n- Character\
    \ values cannot contain embedded blanks unless you change the delimiter.\n- Data\
    \ must be in standard numeric or character format. \n\n# Modified List Input\n\
    \nList input is more versatile when you use format modifiers. The format modifiers\
    \ are as follows:\n\n| Format Modifier | Purpose |\n|---|---|\n| & | reads values\
    \ that contain embedded blanks. reads data values that need the additional instructions\
    \ that informats can provide but are not aligned in columns. |\n| ~ | reads delimiters\
    \ within quoted character values and retains the quotation marks. |\n\n+   * Use\
    \ formatted input and pointer controls to quickly read data values that are aligned\
    \ in columns.\n\nFor example, use the : with an informat to read character values\
    \ that are longer than 8 bytes or numeric values that contain nonstandard values.\n\
    Because list input interprets a blank as a delimiter, used list input to read\
    \ read values that contain blanks. The & modifier reads character values that\
    \ contain single embedded blanks, the data values must be separated by two or\
    \ more delimiters. To read values that contain leading, trailing, or embedded\
    \ blanks with list input, the DLM= or DLSTR= option in the INFILE statement to\
    \ specify another character as the delimiter. See \"Example 5: Reading Limited\
    \ Data with Modified List Input\" on page 221. If your data uses blanks as delimiters\
    \ and they contain leading, trailing, or embedded, you might need to use either\
    \ column input or formatted input. If quotation marks surround the delimited values,\
    \ you can use list input with the DSD option in the INFILE statement.\n\n# Comparisons\n\
    \nModified List Input and Formatted Input Differ\nModified list input has a scanning\
    \ feature that can use informats to read data which are not aligned in columns.\
    \ Formatted input causes the pointer to move like that is of column input to read\
    \ a variable value. The pointer moves the length that is specified in the informat\
    \ and stops at the next column.\n\nThis DATA step uses modified list input to\
    \ read the first data value and formatted input to read the second:"
