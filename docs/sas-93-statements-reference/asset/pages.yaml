    # Details


    # When to Use Formatted Input


    With formatted input, an inform follows a variable name and defines how SAS reads
    the values of this variable. An inform gives the data type and the field width
    of an input value. Informs also read data that are stored in nonstandard form,
    such as packed decimal, or numbers that contain special characters such as commas.
    See "Definition of Informats" in Chapter 3 of SAS Formats and Informats: Reference
    for descriptions of SAS informs.


    Simple formatted input requires that the variables be in the same order as their
    corresponding values in the input data. You can use pointer controls to read variables
    in any order. For more information, see the "INPUT Statement" on page 193.


    # Missing Values


    Generally, SAS represents missing values in formatted input with a single period
    for a numeric value and blanks for a character value. The inform that you use
    formatted input determines how SAS interprets a blank. For example, CHAR.w reads
    the blanks as BZ.w converts a blank to zero.


    # Reading-Length Records


    By default, SAS uses the FLOWOVER option to read varying-length data records.
    If the record contains fewer values than expected, the INPUT statement reads the
    values from the next data record. To read varying-length data, you might need
    to use the TRUNCOVER option in the INFILE statement. For more information, see
    "Reading the End of a Line" on page 179.


    # How to Group Variables and Informats


    When the input variables are arranged in a pattern, you can group the inform list.
    A grouped inform list consists of:


    +   * the names of the variables to read enclosed in parentheses

    * the corresponding informats separated by either blanks or commas in parentheses.


    Inform lists can make an INPUT statement shorter because the inform list is recycled
    until all variables are read and the numbered variable names can be used in abbreviated
    format. Using informats avoids listing the individual variables.


    For example, if the values for five variables SCORE5 are stored over four columns
    per value without intervening blanks, this INPUT statement reads the values:


    ```

    input (score-score5) (4. 4. 4. 4.);

    ```


    However, if you specify more variables than informats, the INPUT statement reuses
    the inform list to read the remaining variables. A shorter version of the previous
    statement is'
