  md: '# LIBNAME Statement for WebDAV Server Access


    Associates a SAS libref and enables access to a WebDAV (Web-based Distributed
    Authororing And Versioning) server.


    **Valid in:** Anywhere


    **Category:** Data Access


    **Restriction:** Access to WebDAV servers is not supported on OpenVMS or z/OS.


    # Syntax


    ```

    LIBNAME libref <engine> ''SAS-library'' <options> WEDAV USER="user-ID"

    PASSWORD="user-password" WEDAV options;


    LIBNAME librefCLEAR | _ALL_ CLEAR;

    LIBNAME libref/LIST | _ALL_ LIST;

    ```


    # Arguments


    +   **libref**nspecifies a shortcut name for the aggregate storage location where
    your SAS files are stored.

    Tip: The association between a libref and a SAS library lasts only for the duration
    of the SAS session until you change it or discontinue it with another LIBNAME
    statement.


    +   **''SAS-library''**nspecifies the URL (path) on a WebDAV server. The URL specifies
    either HTTP or HTTPS communication protocols.

    Restriction: Only one data library is supported when using the WebDAV extension
    to the LIBNAME statement.

    Requirement: When using the HTTPS communication protocol, you must use the SSL
    (Secure Sockets Layer) protocol that provides secure network communications. For
    more information, *Encryption in SAS*.


    +   **engine**nspecifies the name of a valid SAS engine.

    Restriction: REMOTE engines are not supported with the WebDAV options.

    See: For a list of valid engines, see the SAS documentation for your operating
    environment.


    +   **CLEAR**disassociates one or more currently assigned librefs. When using
    a WebDAV server is cleared, the cached files stored locally are deleted.

    Tip: Specify libref to disassociate a single libref. Specify _ALL_ to disassociate
    all currently assigned librefs.


    +   **LIST**nwrites the attributes of one or more SAS libraries to the SAS log.

    Tip: Specify libref to list the attributes of a single SAS library. Specify _ALL_
