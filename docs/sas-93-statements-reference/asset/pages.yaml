    The following code reads each record and parses the record to extract the minute
    and

    charge values.


    ```

    data _null;

    input;

    city = scan(_infile, 1, '' '');

    char_min = substr(_infile, 3, length(char_min)-2);

    minutes = input(char_min, BEST12);

    put city= minutes=;

    run;

