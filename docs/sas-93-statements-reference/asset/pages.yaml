  md: '# Syntax


    X<operating-environment-command>;


    Without Arguments

    Using X arguments places you in your operating environment, where you can\issue
    commands that are specific to your environment.


    Arguments

    ''operating-environment-command''

    specifies an operating environment command that is enclosed in quotation marks.


    Details

    In all operating environments, you can use the X statement when you run SAS

    windowing or interactive line mode. In some operating environments, you can use
    the X

    statement when you run SAS in batch or noninteractive mode.


    Operating Environment Information

    The X statement is dependent on your operating environment. See the SAS

    documentation for your operating environment to determine whether it is a valid

    statement on your system. Keep in mind that the way you return from operating

    environment mode to SAS session is dependent on your operating environment

    and the commands that you use with the X statement are specific to your

    environment.


    You can use the X statement with SAS macros to write a SAS program that can run
    in

    multiple operating environments. See the SAS Macro Language: Reference for

    information.


    # Comparisons


    In a windowing session, the X command works exactly like the X statement except
    that

    y issue the command from a command line. You submit the X statement from the

    Program Editor window.


    The X statement is similar to the SYSTEM function, the X command, and the CALL

    SYSTEM routine. In most cases, the X statement, X command or %SYEXEC macro

    statement are preferable because they require less overhead. However, the SYSTEM

    function can be executed conditionally. The X statement is a global statement
    and

    executes as a DATA step is being compiled.


    # See Also


    CALL Routines:


    +   * “CALL SYSTEM Routine” in SAS Functions and CALL Routines: Reference


    Functions:


    +   * “SYSTEM Function” in SAS Functions and CALL Routines: Reference'
