    # Example 5: Executing an Autocall Macro from a SAS Catalog


    If you use an autocall macro in a SOURCE entry in a SAS catalog, you can point
    to that entry and invoke the macro in a SAS job. Use these steps:


    +   1. Use a LIBNAME statement to assign a libref to that SAS library.

    2. Use a FILENAME statement with the CATALOG specification to assign a fileref
    to the catalog: libref.catalog.

    3. Use the SASAUTOS= option and specify the fileref so that the system knows where
    to locate the macro. Also set MAUTOURCE to activate the autocall facility.'
