  md: '# What''s New in SAS 9.3 Statements


    # Overview


    The SAS statements documentation is no longer part of *SAS Language Reference:
    Dictionary*. See "Changes to SAS Language Reference: Dictionary" on page x. The
    SAS statements that were previously documented in *SAS Language Reference: Dictionary*
    are now documented here, in *SAS Statements: Reference.*


    # New SAS Statements


    The following SAS statements are new:


    LIBNAME JMP (p. 243)

    associates a libref with a JMP data table and enables you to read and write JMP
    data tables.


    RESETLINE (p. 327)

    restarts the program line numbering in the SAS log to 1.


    # Enhanced SAS Statements


    The following SAS statements have been enhanced:


    ABORT (p. 19)

    If you do not specify a value for *n*, the error code that is returned by SAS
    is ERROR. The value of ERROR depends on the operating system. The condition code
    *n* is returned to the operating system as the final SAS exit code.


    +   FILENAME, EMAIL Access Method (p. 105)

    - E-mail addresses can be separated with comma as well as a space.

    - Two new e-mail options enable you to specify an expiration date for the e-mail
    message and specify that a notification be sent when the e-mail message is delivered
    to the recipient.


    FILENAME, FTP Access Method (p. 116)

    A new FTP option has been added that specifies that an attempt is made for passive
    mode FTP.'
  merge: -1
  pgno: 10
- img_proc: true
  md: 'FILENAME, WebDAV Access Method (p. 141)

    A new option has been added that enables you to prompt for a login password if

    necessary.


    LIBNAME (p. 233)

    The new option EXTENDOBSCOUNTER= enables you to extend the maximum

    observation count in all output SAS data files in the SAS library.


    # Changes to SAS Language Reference: Dictionary


    Prior to SAS 9.3, this document was part of SAS Language Reference: Dictionary.

    Starting with SAS 9.3, SAS Language Reference: Dictionary has been divided into
    seven

    doc:


    +   * SAS Data Set Options: Reference

    * SAS Formats and Informs: Reference

    * SAS Functions and CALL Routines: Reference

    * SAS Statements: Reference

    * SAS System Options: Reference

    * SAS Component Objects: Reference (contains the documentation for the hash, hash

    iterator, and Java objects)

    * Base SAS Utilities: Reference (contains the documentation for the SAS DATA step

    debugger and the SAS Utility macro %DS2CSV)'
