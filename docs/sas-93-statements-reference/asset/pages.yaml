    a file. SAS uses this placeholder for reporting processing information to the
    SAS log. It must conform to the same rules as a filerf.


    Tips:


    Use FILEVAR= to dynamically change the currently opened input file to a new physical
    file. When using FILEVAR=, it is not possible to know whether the input file that
    is currently open is the last or not. When the DATA step comes to an end-of-file
    marker or the end of all open data sets, it performs an orderly shutdown. If you
    use FILEFIRSTOBS, a file with only a header record in a series of files triggers
    a normal shutdown of the DATA step. The shutdown occurs because SAS reads beyond
