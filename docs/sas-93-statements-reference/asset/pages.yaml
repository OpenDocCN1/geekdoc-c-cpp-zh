  md: '8 Chapter 2 • Dictionary of SAS Statements


    # Statements Category Functionality


    +   - Control skip statements for certain observations

    - change the order that statements are executed

    - transfer control from one part of a program to another


    +   - File-handling work with files used as input to the data set

    - work with files to be written by the DATA step


    +   - Information give SAS additional information about the program data vector

    - give SAS additional information about the data set or data sets that are being
    created.


    +   - Window Display display and customize windows.


    The following table lists briefly describes the DATA step statements by category.


    | Category Language elements Description |

    |---|---|---|

    | Action | ABORT Statement (p. 19) | Stops executing the current DATA step, SAS
    job, or SAS session. |

    | | Assignment Statement (p. 30) | Evaluates an expression and stores the result
    in a variable. |

    | | CALL Statement (p. 40) | Invokes a SAS CALL routine. |

    | | DELETE Statement (p. 58) | Stops processing the current observation. |

    | | DESCRIBE Statement (p. 59) | Retrieves source code from a stored compiled
    DATA step program or a DATA step view. |

    | | ERROR Statement (p. 74) | Sets ERROR to I. A message to the SAS log is optional.
    |

    | | EXECUTE Statement (p. 75) | Executes a stored compiled DATA step program.
    |

    | | IF Statement (p. 155) | Continues processing only those observations that
    meet the condition of the specified expression. |

    | | LIST Statement (p. 250) | Writes to the SAS log the input data for the observation
    that is being processed. |

    | | LOSTCARD Statement (p. 256) | Resynchronizes the input data when SAS encounters
    a missing or invalid record in data that has multiple records per observation.
    |

    | | Null Statement (p. 282) | Signals the end of data lines or acts as a placeholder.
    |

    | | OUTPUT Statement (p. 285) | Writes the current observation to a SAS data set.
    |

    | | PUTLOG Statement (p. 318) | Writes a message to the SAS log. |'
