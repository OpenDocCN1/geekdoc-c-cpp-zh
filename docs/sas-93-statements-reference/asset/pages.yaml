  md: '# DATA Step Statements


    # Executable and Declarative Statements


    DATA step statements are executable or declarative statements that can appear
    in the DATA step. Executable statements result in some action during individual
    iterations of the DATA step; declarative statements supply information to SAS
    and take effect when the system compiles program statements.


    The following tables show the SAS executable and declarative statements that you
    use in the DATA step.


    Table 1.1 Executable Statements in the DATA Step


    | Executable Statements | | |

    | --- | --- | --- |

    | ABORT | IF, Subsetting | PUT, Column |

    | Array Reference | IF-THEN/ELSE | PUT, Formatted |

    | Assignment | INFILE | PUT, List |

    | CALL | INPUT | PUT, Named |

    | CONTINUE | GO TO | PUT |

    | DECLARE | INPUT, Column | PUT, ODS |

    | DELETE | INPUT, Formatted | PUTLOG |

    | DESCRIBE | INPUT, List | REDIRECT |

    | DISPLAY | INPUT, Named | REMOVE |

    | DO | LEAVE | REPLACE |

    | DO, Iterative | LINK | RESETLINE |

    | DO UNTIL | LIST | RETURN |

    | DO WHILE | LOSTCARD | SELECT |

    | ERROR | MERGE | SET |

    | EXECUTE | MODIFY | STOP |

    | FILE | Null | Sum |

    | FILE, ODS | OUTPUT | UPDATE |'
  merge: -1
  pgno: 15
- img_proc: true
  md: 'Table 1.2 Declarative Statements in the DATA Step


    # Declarative Statements


    | ARRAY | DATALINES4 | Labels, Statement |

    |---|---|-|

    | ATTRIB | DROP | LENGTH |

    | BY | END | RENAME |

    | CARDS | FORMAT | RETAIN |

    | CARDS4 | INFORMAT | WHERE |

    | DATA | KEEP | WINDOW |

    | DATALINES | LABEL | |


    DATA step statements can be grouped into six functional categories. For a list
    of DATA step statements by category, see “DATA Step Statements by Category” on
    page 7.


    # Global Statements


    Global statements generally provide information to SAS, request information or
    data, move between different modes of execution, or set values for system options.
    Other global statements (ODS statements) deliver output in a variety of formats,
    such as in Hypertext Markup Language (HTML). You can use global statements anywhere
    in a SAS program. Global statements are not executable; they take effect as soon
    as SAS compiles program statements.


    Global statements can be divided into eight functional categories. For a list
    of global statements by category, see “Global Statements by Category” on page
    13.


    Other SAS software products have additional global statements that are used with
    those products. For information, see the SAS documentation for those products.'
