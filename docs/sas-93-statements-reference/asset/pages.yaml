    # # FILENAME Statement, URL Access Method


    Enables you to access remote files by using the URL access method.


    | Valid in: | Anywhere |

    | Category: | Data Access |


    # ## Syntax


    ```

    FILENAME fileref URL ''external-file'' <url-options>;

    ```


    # ## Arguments


    fileref

    is a valid fileref.


    > Tip: The association between a fileref and an external file lasts only for the
    duration of the SAS session until you change it or discontinue it with another
    FILENAME statement. You can change the fileref for a file as often as you want.


    URL


    specifies the method that enables you to read a file from any host computer that
    you can connect to a network with a URL server running.


    Alias: HTTP


    ''external-file''


    specifies the name of the file that you want to read from a URL server. The Secure
    Socket Layer (SSL) protocol, https, can also be used to access the files. The
    file must be specified in one of these formats:


    +   * http://hostname/file'
