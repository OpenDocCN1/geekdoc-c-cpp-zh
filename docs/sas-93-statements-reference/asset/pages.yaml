  md: "# Syntax\n\nCONTINUE;\n\n# Without Arguments\n\nThe CONTINUE statement has\
    \ no arguments. It stops processing statements within the current DO-loop iteration\
    \ based on a condition. Processing resumes with the next iteration of the DO loop.\n\
    \n# Comparisons\n\n+   - The CONTINUE statement stops the processing of the current\
    \ iteration of a loop and resumes with the next iteration; the LEAVE statement\
    \ causes processing of the current loop to end.\n- You can use the CONTINUE statement\
    \ only in a DO loop; you can use the LEAVE statement in a DO loop or a SELECT\
    \ group.\n\n# Example: Preventing Other Statements from Executing\n\nThis DATA\
    \ step creates a report of benefits for new full-time employees. If an employee's\
    \ status is PT (part-time), the CONTINUE statement prevents the second INPUT statement\
    \ and the OUTPUT statement from executing.\n\n```\ndata new_emp;\ndrop i;\ndo\
    \ i=1 to 5;\n    input name $ idno status;\n    /* return to top of loop */\n\
    \    /* when condition is true */\n    if status='PT' then continue;\n    input\
    \ benefits $10;\n    output;\nend;\ndatalines;\nJones 9011 PT\nThomas 876 PT\n\
    Richards 1002 FT\nEye/Dental\nKelly 85111 PT\nSmith 433 PT\nHMO;\n;\n```\n\n#\
    \ See Also\n\n# Statements:\n\n+   - “DO Statement, Iterative” on page 65\n- “LEAVE\
    \ Statement” on page 230"
  merge: -1
  pgno: 60
