    # Alias: PWD=, PW-, PASS==


    > Tip: You can specify the PROMPT option instead of the PASSWORD= option.


    # PROMPT


    specifies to prompt for the user login password, if necessary.


    Interaction: If PROMPT is specified without USER=, then the user is prompted for
    an ID as well as a password.


    > Tip: If you specify the PROMPT option, you do not need to specify the PASSWORD=.


    # AUTHDOMAIN="auth-domain"


    specifies the name of an authentication domain metadata object in order to connect
    to the WebDAV server. The authentication domain references credentials (user ID
    and password) without having to explicitly specify the credentials. The auth-domain
    name is case sensitive, and must be enclosed in double quotation marks.


    An administrator creates domain definitions while creating a user definition with
    the User Manager in SAS Management Console. The authentication domain is associated
    with one or more login metadata objects that provide access to the WebDAV Server
    and is resolved by the BASE engine calling the SAS Metadata Server and returning
    the authentication credentials.


    Requirement: The authentication domain and the associated domain definition must
    be stored in a metadata repository, and the metadata server must be running in
    order to resolve the metadata object specification.


    Interaction: If you specify AUTHDOMAIN=, you do not need to specify USER= and
    PASSWORD=-.


    See: For complete information about creating and using authentication domains,
    see the discussion on credential management in the SAS Intelligence Platform:
    Security Administration Guide.


    # PROXY=url


    specifies the Uniform Resource Locator (URL) for the proxy server in one of these
