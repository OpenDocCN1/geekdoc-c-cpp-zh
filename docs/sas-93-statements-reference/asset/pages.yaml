  md: '# FILENAME Statement, EMAIL (SMTP) Access Method 115


    mail message and attachments that are dependent on the department to which the
    recipient belongs. In the program, the following occurs:


    +   * In the first PUT statement, the !EM_TO! directive assigns the TO attribute.

    * The second PUT statement assigns the SUBJECT attribute using the !EM_SUBJECT!
    directive.

    * The !EM_SEND! directive sends the message.

    * The !EM_NEWMSG! directive clears the message attributes, which must be used
    to clear attributes between recipients.

    * The !EM_ABORT! directive normally ends the message before the RUN statement
    causes it to be sent again. The !EM_ABORT! directive prevents the message from
    being automatically sent at the end of the DATA step.


