    Susan marketing

    Peter marketing

    Alma development

    Andre development

    ;

    run;

    ```


    # Example 3: Sending Procedure Output in E-mail


    You can use e-mail to send procedure output. This example illustrates how to send
    ODS HTML in the body of an e-mail message. Note that ODS HTML procedure output
    must be sent with the RECORD_SEPARATOR (RS) option set to NONE.


    ```

    filename outbox

    to=''oursite.com''

    type=''text/html''

    subject=''Temperature Conversions''

    data temperatures;

    do centigrade = -40 to 100 by 10;

    farenheit = centigrade*9/5+32;

    output;

    run;\ods html

    body=outbox /* Mail it! */

    rs=none;

    ```'
