  md: "# DATALINES4 Statement 57\n\nThe INFILE statement points to raw data lines\
    \ stored in another file. The INPUT statement reads those data lines.\n\nThe %INCLUDE\
    \ statement brings SAS programs or data lines stored in SAS files or external\
    \ files into the current program.\n\nThe SET, MERGE, MODIFY, and UPDATE statements\
    \ read observations from existing SAS data sets.\n\n# Examples\n\n# Example 1:\
    \ Using the DATALINES Statement\n\nIn this example, SAS reads a data line and\
    \ assigns values to two character variables, NAME and DEPT, for each observation\
    \ in the DATA step:\n\n```\ndata person;\n  input name $ dept $;\n  datalines;\n\
    John Sales\nMary Acctng\n;\n```\n\n# Example 2: Reading In-stream Data with Options\n\
    \nThis example takes advantage of options available with the INFILE statement\
    \ to read inline data lines. With the DELIMITER= option, you can use list input\
    \ to read data values that are delimited by commas instead of blanks.\n\n```\n\
    data person;\n  infile datalines delimiter=',';\n  input name $ dept $;\n  datalines;\n\
    John Sales\nMary Acctng\n;\n```\n\n# See Also\n\n+   - “DATALINES4 Statement”\
    \ on page 57\n- “INFILE Statement” on page 165\n\n# System Options:\n\n+   - “CARDIMAGE\
    \ System Option” in SAS System Options: Reference\n\n# DATALINES4 Statement\n\n\
    Indicates that data lines which contain semicolons follow.\n\n| Valid in: | DATA\
    \ step |\n| Category: | File-handling |\n| Type: | Declarative |"
