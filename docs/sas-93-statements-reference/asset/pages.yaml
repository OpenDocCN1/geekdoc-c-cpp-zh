    internal-lines


    includes lines that are entered earlier in the same SAS job or session.

    To include internal lines, use any of the following:


    +   n includes line n.

    -m or n:m includes lines n through m.


    **Note:** The SPOOL system option controls internal access to previously submitted
    lines when you run SAS in interactive line mode, noninteractive mode, and batch
    mode. By default, the SPOOL system option is set to NOSPOOL. The SPOOL system
    option must be in in order to use %INCLUDE statements with internal line references.
    Use the OPTIONS procedure to determine the current setting of the SPOOL system
