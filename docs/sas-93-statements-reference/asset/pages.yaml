- img_proc: true
  md: '# Examples


    # Example 1: Basic Usage


    +   * This RETAIN statement retains the values of variables MONTH1 through MONTH5

    from one iteration of the DATA step to the next:


    ```

    retain month1-month5;

    ```


    +   * This RETAIN statement retains the values of nine variables and sets their
    initial

    values:


    ```

    retain month1-month5 1 year 0 a b c ''XYZ'';

    ```


    The values of MONTH1 through MONTH5 are initially set to 1; YEAR is set to 0;

    variables A, B, and C are set to the character value XYZ.


    +   * This RETAIN statement assigns the initial value 1 to the variable MONTH1
    only:


    ```

    retain month1-month5 (1);

    ```


    Variables MONTH2 through MONTH5 are set to missing initially.


    +   * This RETAIN statement retains the values of all variables that are defined
    earlier in

    DATA step but not the values that are defined afterwards:


    ```

    retain _all;

    ```


    +   * All of these statements assign values of 1 through 4 to VAR1 through VAR4:


    +   * retain var1-var4 (1 2 3 4);


    +   * retain var1-var4 (1,2,3,4);


    +   * retain var1-var4 (1:4);


    # Example 2: Overview of the RETAIN Operation


    This example shows how to use variable and array names as elements in the

    RETAIN statement and shows assignment of initial values with and without parentheses:


    ```

    data _null;

    array City(3) $ City1-City3;

    array cp(3) Citypop1-Citypop3;

    retain Year Taxyear 1999 City '' ''

    cp (10000,50000,100000);

    file file-specification print;

    put ''Values at beginning of DATA step'':

    /@ _all_;

    input Gain;

    doi=1 to 3;

    cp(i)=cp(i)+Gain;

    end;

    put ''Values after adding Gain to city populations'':

    /@ _all_;\datalines

    5000

    10000

    ;

    ```


    Here are the initial values assigned by RETAIN:


    +   * Year and Taxyear are assigned the initial value 1999.


    +   * City1, City2, and City3 are assigned missing values.'
