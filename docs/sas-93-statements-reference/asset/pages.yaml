  md: '# WINDOW Statement


    Creates customized windows for your applications.


    **Valid in:** DATA step


    **Category:** Window Display


    **Type:** Declarative


    # Syntax


    ```

    WINDOW window <window-options> field-definition(s);

    WINDOW window <window-options> group-definition(s);

    ```


    # Arguments


    window


    specifies the window name.


    **Restriction:** Window names must conform to SAS naming conventions.


    window-options


    specifies the characteristics of the window as a whole. Specify these window-options
    before any field or GROUP= specifications:


    COLOR=color


    specifies the color of the window background for operating environments that have
    this capability. In other operating environments, this option affects the color
    of the window border. The following colors are available:


    BLACK MAGENTA

    BLUE ORANGE

    BROWN PINK

    CYAN RED

    GRAY WHITE

    GREEN YELLOW


    **Default:** If you do not specify a color with the COLOR= option, the window''s
    background color is device-dependent instead of black, and the color of a field
    is device-dependent instead of white.


    **Tip:** The representation of colors might vary, depending on the monitor being
    used. COLOR= has no effect on monochrome monitors.


    COLUMNS=columns


    specifies the number of columns in the window.


    **Default:** The window fills all remaining columns on the monitor; the number
    of columns that are available depends on the type of monitor that is being used.


    ICOLUMN=column


    specifies the initial column within the monitor at which the window is displayed.


    **Default:** SAS displays the window at column 1.


    ROW=row


    specifies the initial row (or line) within the monitor at which the window is
    displayed.'
  merge: -1
