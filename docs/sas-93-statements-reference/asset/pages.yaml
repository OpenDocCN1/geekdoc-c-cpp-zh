  md: '# FILENAME Statement, CATALOG Access Method 101


    **Default:** For input, the actual LRECL value is the default. For output, the
    default is 132.

    **Interaction:** Alternatively, you can specify a global record length by using
    the “LRECL= System Option” in SAS System Options: Reference.


    **RECF=recfm**

    where recfm is one of four record formats:


    +   F

    fixed-record format. Data is transferred in image (binary) mode.


    +   P

    print format.

    S

    stream-record format. Data is transferred in image (binary) mode.

    **Interaction:** The amount of data that is read is controlled by the value of
    the NBYTE= variable in the INFILE statement. NBYTE= option specifies a variable
    that is equal to the amount of data to be read. This amount must be less or equal
    to LRECL.

    **See:** The NBYTE= option on page 173 in the INFILE statement.


    +   V

    variable-record format (the default). In this format, records have varying lengths,
    and they are separated by newlines. Data is transferred in image (binary) mode.


    **Default:** V


    **DESC=description**

    where description is a text description of the catalog.


    **MOD**

    specifies to append to the file.

    **Default:** If you omit MOD, the file is replaced.


    # Details


    The CATALOG access method in the FILENAME statement enables you to reference a
    SAS catalog as an external file. You can then use SAS commands, statements, or
    procedures that can access external files to access a SAS catalog. For example,
    the catalog access method makes it possible for you to invoke an autocall directly
    from a SAS catalog: “Example 5: Executing an Autocall Macro from” on page 102.


    With the CATALOG access method, you can read any type of catalog entry, but you
    can write to only entries of type LOG, OUTPUT, SOURCE, and CATAMS. If you want
    to access an entire catalog (instead of a single entry), you must specify its
    two-level name in the **catalog argument.


    # Examples


    **Example 1: Using %INCLUDE with a Catalog Entry**

    This example submits the source program that is contained in SASUSER.PROFILE.SASINP.SOURCE:


    ```

    filename fileref

    catalog ''sasuser.profile.sasinp.source'';

    %include fileref;

    ```'
