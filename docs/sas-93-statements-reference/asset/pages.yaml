  md: '# Comparisons


    The RUN statement executes previously entered DATA or PROC steps. The %RUN statement
    ends the prompting for source statements and returns program control to the original
    source program, when you use the %INCLUDE statement to allow data to be entered
    from the keyboard.


    The type of prompt that you use depends on how you run the SAS session. The include
    is most useful in interactive line and noninteractive modes, but it can also be
    used in writing and batch mode. When you are running SAS in batch mode, include
    the %RUN statement in the external file that is referenced by the SASTERM fileref.


    # Example: Entering Lines from the Keyboard


    To request keyboard-entry source on a %INCLUDE statement, follow the statement
    with an asterisk:


    ```

    %include *;

    ```


    > Note: The asterisk (*) cannot be used to specify keyboard entry if you use the
    Enhanced Editor in the Microsoft Windows operating environment.


    When it executes this statement, SAS prompts you to enter source lines from the
    keyboard. When you finish entering code from the keyboard, type the following
    statement to return processing to the program that contains the %INCLUDE statement.


    ```

    run;

    ```


    # See Also


    Statements:


    +   - "%INCLUDE Statement" on page 159

    - "%RUN Statement" on page 334


    # SASFILE Statement


    Opens a SAS data set and allocates enough buffers to hold the entire file in memory.


    Valid in: Anywhere

    Category: Program Control

    Restriction: A SAS data set opened by the SASFILE statement can be used for subsequent
    input (read) or update processing but not for output or utility processing.

    See: "SASFILE Statement: z/OS" in SAS Companion for z/OS in SAS Companion for
    z/OS


    # Syntax


    ```

    SASFILE <libref> member-name.<member-type> <{password-option(s)>

    OPEN | LOAD | CLOSE;

    ```'
