    # Details


    Set Options That Function Differently with a WebDAV Server

    The following table lists the data set options that have different functionality
    when using a WebDAV server. All other data set options will function as described
    in the SAS Data Options: Reference.


    Table 2.6 Data Set Option Functionality with a WebDAV Server


    | Data Set Option | WebDAV Storage Functionality |

    |---|---|

    | CNTLEV= | LIB locks all data sets in the library before writing the data into
    the local cache. All members are unlocked after the DATA step has completed and
    the data set has been written back to the WebDAV server.

    MEM locks the member before writing the data into the local cache. Member is unlocked
    after the DATA step has completed and the data has been written back to the WebDAV
    server.

    REC is not supported. WebDAV allows updates to the entire data set only. |

    | FILECLOSE | The VxTAPE engine is not supported; therefore this option is ignored.
    |

    | GENMAX= | This functionality is not supported because the maximum number of
    revisions to keep cannot be specified in the WebDAV server. |

    | GENNUM= | This functionality is not supported in WebDAV. |

    | IDXNAME= | Users can specify an index to use if one exists. |

    | INDEX= | Indexes can be created in the local cache and saved on the WebDAV server.
    |

    | TOBSNO= | Remote engines are not supported; therefore this option is ignored.
    |'
