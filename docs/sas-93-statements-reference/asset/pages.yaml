  md: '# FILENAME Statement, SFTP Access Method 131


    WAIT_MILLISECONDS=milliseconds

    specifies the SFTP response time in milliseconds.


    Default: 1,500 milliseconds

    Tip: If you receive a time-out message in the log, use the WAIT_MILLISECONDS

    option to increase the response time.


    # Details


    # The Basics


    The Secure File Transfer Protocol (SFTP) provides a secure connection and file
    transfers

    bween two hosts (client and server) over a network. Both commands and data are

    encrypted. The client machine initiates a connection with the remote host (OpenSSH

    SSH server).


    With the SFTP access method, you can read from or write to any host that you

    connect to on a network with an OpenSSH SSHD server running. The client and

    server applications can reside on the same computer or different computers that
    are

    connected by a network.


    Specific implementation details are dependent on the OpenSSH SSHD server version

    and how that site is configured.


    The SFTP access method relies on default send and reply messages to OpenSSH

    commands. Custom installs of OpenSSH that modify these messages will disable the

    SFTP access method.


    You must have the applicable client software installed to use the SFTP access
    method.

    The SFTP access method supports only the following SSH clients.


    +   - OpenSSH – UNIX

    - PUTTTY – Windows


    > Note: Password validation is not supported for the SFTP access method.

    Note: Public key authentication using an SSH agent is the recommended way to connect

    to a remote SSH server.


    > Note: If you have trouble running the SFTP access method try manually validate

    SFTP client access to an OpenSSH SSHD server without involving the SAS system.

    Manually validating SFTP client access without involving the SAS system will

    ensure that your SSH/SSHD configuration and key authentication is setup correctly.


    # SFTP Access Methods and SFTP Prompts


    The SFTP access method supports only the following prompts. Changing the prompt

    will disable the SFTP access method.


    +   - For OpenSSH:

    sftp >

    sftp >

    - For PUTTTY:

    psftp >'
