  md: "Restrictions:\n\nNo two statements in a DATA step can have the same label.\n\
    \nIf a statement in a DATA step is labeled, it should be referenced by a statement\
    \ or option in the statement step.\n\nTip: A null statement can have a label:\n\
    \n```\nABC;\n```\n\n# Details\n\nThe statement label identifies the destination\
    \ of either a GO TO statement, a LINK statement, the HEADER= option in a FILE\
    \ statement, or the EOF= option in an INFILE statement.\n\n# Comparisons\n\nThe\
    \ LABEL statement assigns a descriptive label to a variable. A statement label\
    \ identifies a statement or group of statements that are referred to in the same\
    \ DATA step by another, such as a GO TO statement.\n\n# Example: Jumping to Another\
    \ Statement\n\nIn this example, if Stock=0, the GO TO statement causes SAS to\
    \ jump to the statement that is labeled. When Stock is not 0, execution continues\
    \ to the RETURN statement and returns to the beginning of the DATA step for the\
    \ next observation.\n\n```\ndata Inventory Order;\n  input Item Stock$;n  /* go\
    \ to label reorder: */\n  if Stock=0 then go to reorder;\n    output Inventory;\n\
    \    return;\n  /* destination of GO TO statement */\n  reorder: input Supplier$;\n\
