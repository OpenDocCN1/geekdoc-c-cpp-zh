    # Details


    # When to Use List Input


    List input requires that you specify the variable names in the INPUT statement
    in the same order that the fields appear in the input data records. SAS scans
    the data line to locate the next value but ignores intervening blanks. List input
    does not require that the data are located in specific columns. However, you must
    separate each value from the next by at least one blank unless the delimiter between
    values is changed.\By default, the delimiter for data values is one blank space
    or the end of the input record. List input will not skip over any data values
