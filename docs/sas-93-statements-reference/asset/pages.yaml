  md: '# BY Statement


    +   - “INFORMAT Statement” on page 190

    - “LABEL Statement” on page 227

    - “LENGTH Statement” on page 231


    Controls the operation of a SET, MERGE, MODIFY, or UPDATE statement in the DATA
    step and special grouping variables.


    | Valid in: | DATA step or PROC step |

    | Category: | File-handling |

    | Type: | Declarative |


    # Syntax


    ```

    BY <DESCENDING> variable-l

    ..<<DESCENDING>variable-n> <NORTSORTED> <GROUPFORMAT>;

    ```


    # Arguments


    specifies that the data sets are sorted in descending order by the variable that
    is specified. DESCENDING means largest to smallest numerically, or reverse alphabetical
    for character variables.


    **Restriction:** You cannot use the DESCENDING option with data sets that are
    indexed because indexes are always stored in ascending order.


    **Example:** “Example 2:ifying Sort Order” on page 38


    # GROUPFORMAT


    uses the formatted values, instead of the internal values, of the BY variables
    to determine where BY groups begin and end, and therefore how FIRST.variable and
    LAST.variable are assigned. The GROUPFORMAT option can appear anywhere in the
    BY statement, the option applies to all variables in the BY statement.


    **Restrictions:**

    You must use the observations in a data set based on the value of the BY variables
    before using the GROUPFORMAT option in the BY statement.

    You can use the GROUPFORMAT option in a BY statement only in a DATA step.


    **Interaction:** If you also use the NOTSORTED option, you can group the observations
    in a data set by the formatted value of the BY variables without requiring the
    data set be sorted or indexed.


    **Note:** BY-group processing in the DATA step using the GROUPFORMAT option is
    the same as BY-group processing with formatted values in SAS procedures.


    **Tips:**

    Using the GROUPFORMAT option is useful when you define your own formats to display
    data ensures that BY groups is grouped.

    Using the GROUPFORMAT option in the DATA step ensures that BY groups that you
    use to create a data set match the BY groups in PROC steps that report grouped,
    formatted data.'
  merge: -1
  pgno: 48
- img_proc: true
  md: 'See: Chapter 20, "BY-Group Processing in the DATA Step," in SAS Language

    Reference: Conceptis


    Example: "Example 4: Grouping Observations Using Formatted Values" on

    page 38


    variable

    ames each variable by which the data set is sorted or indexed. These variables

    referred to as BY variables for the current DATA or PROC step.


    Requirement: If you designate a name literal as the BY variable in BY-group

    processing and you want to refer to the corresponding FIRST. LAST.

    temporary variables, you must include the FIRST. and LAST. portion of the two-

    level name within single quotation marks. For example:


    ```

    sedanTypes:

    set cars;

    by ''Sedan Types''n;

    if ''first. Sedan Types''n then type=1;

    run;

    ```


    Tip: The data can be sorted or indexed by more than one variable.


    Examples:


    +   - "Example 1: Specifying One or More BY Variables" on page 38

    "Example 2: Specifying Sort Order" on page 38

    "Example 3: BY-Group Processing with Nunsorted Data" on page 38

    "Example 4: Grouping Observations by Using Formatted Values" on page 38


    # NOTSORTED


    specifies that observations with the same BY value are grouped together but are
    not

    necessarily sorted in alphabetical or numeric order.


    Restriction: Use the NOTSORTED option with the MERGE and

    UPDATE statements.


    Tips:


    The NOTSORTED option can appear anywhere in the BY statement.

    Using the NOTSORTED option is useful if you have data that falls into other

    logical groups such as chronological order or categories.


    Example: "Example 3: BY-Group Processing with Nunsorted Data" on page 38


    # Details


    How SAS Identifies the Beginning and End of a BY Group

    SAS identifies the beginning and end of a BY group by creating temporary variables

    for EACH variable: FIRST.variable and LAST.variable. The value of these variables

    is either 0 or 1. SAS sets the value of FIRST.variable to 1 when it reads the

    observation in a BY group, and sets the value of LAST.variable to 1 when it reads
    the

    last observation in BY group. These temporary variables are available for DATA
    step

    programming but are not added to the output data set.


    For a complete explanation of how SAS processes grouped data and how to prepare

    your data, see Chapter 20, "BY-Group Processing in the DATA Step," in SAS Language

    Reference: Concepts.


    # In a Data Step


    The BY statement applies only to the SET, MERGE, MODIFY, or UPDATE statement

    that precedes it in the DATA step, and only one BY statement can accompany each
    of

    statements in a DATA step.'
