    # Example 2: Handling Missing Values and Short Records with List Input


    This example demonstrates how to prevent missing values from causing problems
    when you read the data with list input. Some data values in this example contain
    fewer than five temperature values. Use the MISOVER option so that these values
    are set to missing.


    ```

    data weather;

    infile datalines misover;

    input temp5;

    datalines;

    97.9 98.1 98.3

    96.6 99.2 99.1 98.5 97.5

    96.2 97.3 98.3 97.6

    ```


    SAS reads the three values on the first line as the values of TEMP1, TEMP2, and
    TEMP3. The MISOVER option causes SAS to set the values of TEMP4 and TEMP5 to missing
    for the first observation because no values for those are in the current input
    data record.


    When you omit the MISOVER option or use FLOWOVER, SAS moves the input pointer
    to line 2 and reads values for TEMP4 and TEMP5. The next time DATA STEP executes,
    SAS reads a new line which, in this case, is line 3. This message appears in the
    SAS log:


    NOTE: SAS went to a new line when INPUT statement reached past the end of a line.


    You can also use the STOPOVER option in the INFILE statement. Using the STOPOVER
    option causes the DATA STEP to halt execution when an INPUT statement does not
    find enough values in a record of raw data:


    ```

    infile datalines stopover;

    ```


    Because SAS does not find a TEMP4 value in the first data record, it sets _ERROR_
    to 1, stopping the data set, and prints data line 1.


