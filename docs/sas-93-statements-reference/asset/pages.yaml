    # Example 5: Reading from Multiple Input Files


    The following DATA step reads from two input files during each iteration of the
    DATA step. As SAS switches from one file to the next, each file remains open.
    The input pointer remains in place to begin reading from that the next time an
    INPUT statement reads from that.


    ```

    data qrtcot(drop-jansale marsale febsale aprsale maysale junsale);

    /* identify location of 1st file */

    infile-specification-1;

    /* read values from 1st file */

    input name $sum(jansale,febsale,marsale);

    tritot=/* identify location of 2nd file */

    infile-specification-2;

    /* read values from 2nd file */

    input $? aprsale maysale,junsale;

    qrttot=sum(aprsale,maysale,junsale);

    run;

    ```


    The DATA step terminates when SAS reaches an end of file on the shortest input
    file.

    This DATA step uses FILEVAR= to read from a different file during each iteration
    of the DATA step:


    ```

    data allsales

    length fileloc myfile $ 300;

    /* read instead data */

    input fileloc $;

    /* The INFILE statement closes the current file

    and opens a new one if FILELOC changes value

    when INFILE executes

    infile file-specification filevar=fileloc

    filename=myfile=end-done;

    /* DONE set to 1 when last input record read */

    set done=1 when last input record read

    owhile (not done);

    /* Read all input records from the currently */

    opened input file, write to ALLSALES

    input name $ jansale febsale marsale;

    output;

    end;

    put ''Finished reading '' myfile=;

    datalines;

    external-file-1

    external-file-2

    external-file-3

    ;

    ```


    The FILENAME= option assigns the name of the current input file to the variable
    MYINFILE. The LENGTH statement ensures that the FILENAME= variable and FILEVAR
    have a length that is long enough to contain the value of the filename. The PUT
    statement prints the physical name of the currently open input file to the SAS
    log.'
