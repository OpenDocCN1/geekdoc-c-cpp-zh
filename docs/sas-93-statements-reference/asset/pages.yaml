    # **Interactions:**


    By default, PROC COPY uses the data representation of the file from the source
    library. If, instead, you want to use the data representation of the current SAS
    session, specify the NOCLONE option. If you want to use the NOCLONE option and
    the OUTREP= option when you use PROC COPY with SAS/SHARE or CONNECT, the default
    behavior is to use the data representation of the current SAS session. For more
    information about CLONE and NOCLONE, see the *Copy Statement in the *SAS Procedures
    Guide*.


    The COPY procedure (with NOCLONE) and the MIGRATE procedure can use the LIBNAME
    option OUTREP= for DATA, VIEW, ACCESS, MDDB, and DMDB member types. Otherwise,
    only DATA member types are affected by the OUTREP= LIBNAME option.


    Transcoding could result in data loss when encodings are incompatible. For more
    information, see the *SAS National Language Support (NLS): Reference Guide*.


    # **REPEMPTY=YES/NO**


    controls replacement of like-named temporary or permanent SAS data sets when the
