  md: 'PUT Statement 291


    @@@ holds output line for the execution of the next PUT statement even across
    iterations of the DATA step. These line-holders are called trailing @ and double
    trailing @.


    Restriction: The trailing @ or double trailing must be the last item in the PUT
    statement.


    Tip: Use an @ or @@ to hold the pointer at its current location. The next PUT
    statement that writes to the same output line rather than to a new output line.


    See: "Using Line-Hold Specifiers" on page 296


    Example: "Example 5: Holding and Releasing Output Lines" on page 303


    # Column Pointer Controls


    @n


    moves the pointer to column n.


    Range: a positive integer


    Example: @15 moves the pointer to column 15 before the value of NAME is written:
    put @15 $10.;


    Examples: "Example 2: Moving the Pointer within a Page" on page 299 and "Example
    4: Underlining Text" on page 302


    @numeric-variable


    moves the pointer to the column by the value of numeric-variable.


    Range: a positive integer


    Tip: If n is not an integer, SAS truncates the decimal portion and uses only the
    integer value. If n is zero or negative, the pointer moves to column 1.


    Example: The value of the variable A moves the pointer to column 15 before the
    value of NAME is written: b=5; put @a name $10.;


    Example: "Example 2: Moving the Pointer within a Page" on page 299


    @expression)


    moves the pointer to the column given by the value of expression.


    Range: a positive integer


    Tip: If the value of expression is not an integer, SAS truncates the value and
    uses only the integer value. If it is zero, the pointer moves to column 1.


    Example: The result of the expression moves the pointer to column 15 before the
    value of NAME is written: b=5; put @(b+3) name $10.;


    +n


    moves the pointer n columns.


    Range: a positive integer or zero


    Tip: If n is not an integer, SAS truncates the decimal portion and uses only the
    integer value.


    Example: This statement moves the pointer to column 23, writes a value of LENGTH
    in columns 23 through 26, advances the pointer five columns, and writes the value
    of WIDTH in columns 32 through 35:'
  merge: -1
