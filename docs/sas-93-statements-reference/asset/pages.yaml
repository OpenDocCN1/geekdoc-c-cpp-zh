- img_proc: true
  md: 'Using the FILENAME statement requires operating-specific information. See the
    SAS documentation for your operating environment before using this statement.
    Note also that commands are available in some operating environments that associate
    a fileref with a file and that break association.


    # Definitions


    external file

    is a file that is created and maintained in the operating environment from which
    you need to read data, SAS programming statements, autocall macros, or to which
    you need to write output. An external file can be a single file or an aggregate
    storage location that contains many individual external files. See "Example 3:
    Associating a fileref with an Aggregate Storage Location" on page 98.


    # Operating Environment Information


    Different operating environments allow an aggregate grouping of files by different
    names, such as a directory, a MACLIB, or a partitioned data set. For details about
    specifying files, see the SAS documentation for your operating environment.


    # fileref


    (a reference name) is a shorthand reference to an external file. After you associate
    a fileref with an external file, you can use it as a shorthand reference for that
    file in SAS programming statements (such as INFILE, FILE, and %INCLUDE) and in
    other commands and statements in SAS software that access external files.


    # Reading Delimited Data from an External File


    Any time a file originates from anywhere other than the local encoding, it may
    be necessary to specify the ENCODING= option in EBCDIC or ASCII environments.


    For example, when you read an EBCDIC text file on an ASCII platform, it is recommended
    that you specify the ENCODING= option in the FILENAME statement. However, if you
    use the DSD and DLM options in the FILENAME statement, the ENCODING= option is
    required because these options require certain characters in the session encoding
    (such as quotation marks, commas, and blanks).


    The use of encoding-specific information should be reserved for use with true
    binary files. That is, they contain both character and non-character fields.


    # Associating a Fileref with an External File (Form 1)


    Use this form of the FILENAME statement to associate a fileref with an external
    file on disk:


    ```

    FILENAME fileref<external-file> <operating-environment-options>

    ```


    To associate a fileref with a file other than a disk file, you might need to specify
    a device type, depending on your operating environment, as shown in this form:


    ```

    FILENAME fileref<device-type> <operating-environment-options>

    ```


    The association between a fileref and an external file lasts only for the duration
    of the SAS session or until you change or discontinue it with another FILENAME
    statement. Change the fileref for a file as often as you want.


    To specify a character-set encoding, use the following form:


    ```

    FILENAME fileref<device-type> <operating-environment-options>

    ```'
