- img_proc: true
  md: "Example 7: Avoiding a Common Error When Writing a Character Constant Followed\
    \ by a Variable? on page 304 shows how to use character constants followed by\
    \ variables. For more information about SAS name literals and SAS constants in\
    \ expressions, see SAS Language Reference: Concepts.\n\n# Pointer Controls\n\n\
    As SAS writes values with the PUT statement, it keeps track of its position with\
    \ a pointer. The PUT statement provides three ways to control the movement of\
    \ the pointer:\n\n+   - column pointer controls\n reset the pointer's column position\
    \ when the PUT statement starts to write the value to the output line.\n\n+  \
    \ - line pointer controls\n reset the pointer's line position when the PUT statement\
    \ writes the value to the output line.\n\n+   - line-hold specifiers\n hold a\
    \ line in the output buffer so that another PUT statement can write to it. By\
    \ default, the PUT statement releases the previous line and writes to a new line.\n\
    \nWith column and line pointer controls, you can specify an absolute line number\
    \ or column number to move the pointer or you can specify a column or line location\
    \ that is relative to the current pointer position. The following table lists\
    \ all pointer controls available in the PUT statement.\n\nTable 2.8 Pointer Controls\
