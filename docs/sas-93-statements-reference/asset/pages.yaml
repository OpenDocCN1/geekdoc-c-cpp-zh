  md: '# INPUT Statement 201


    Use line pointer controls within the INPUT statement to move to the next record
    or to define the number of records per observation. Line pointer controls specify
    which input record to read. To read multiple data records into the input buffer,
    with the N= option in the INFILE statement to specify the number of records. If
    you omit N=, you need to take special precautions. For more information, see “Reading
    More than One Record per Observation” on page 202.


    # Using Line-Hold Specifiers


    Line-holders keep the pointer on the current input record when


    +   * a data record is read by more than one INPUT statement (trailing @)

    * one input line rereads values for more than one observation (double trailing
    @)

    * a record needs to be reread on the next iteration of the DATA step (double trailing
    @).


    Use a single trailing @ to allow the next INPUT statement to read from the same
    record. Use a double trailing @ to hold a record for the next INPUT statement
    across iterations of the DATA step.


    Normally, each INPUT statement in a DATA step reads a new data record into the
    input buffer. When you use a trailing @, the following occurs:


    +   * The pointer position does not change.

    * No new record is read into the input buffer.

    * The next INPUT statement for the same iteration of the DATA step continues to
    read the same record rather than a new one.


    SAS releases a record held by a trailing @ when


    +   * a null INPUT statement executes:

    input;

    * an INPUT statement without a trailing @ executes

    * the next iteration of the DATA step begins.


    Normally, when you use a double trailing @@@), the INPUT statement for the next
    iteration of the DATA step continues to read the same record. SAS releases the
    record that is held by a double trailing @


    +   * immediately if the pointer moves the end of the input record

    * immediately if a null INPUT statement executes:

    input;

    * when the next iteration of the DATA step begins if an INPUT statement with a
    single trailing @ executes later in the DATA step:

    input @;


    # Pointer Location After Reading


    Understanding the logic of the input pointer after a value is read is important,
    especially if you combine input styles in a single INPUT statement. With column
    and formatted input, the pointer reads the columns that are indicated in the INPUT
    statement and stops in the next column. With list input, however, the pointer
    scans data records to locate data values and reads a blank to indicate that a
    value has ended. After reading a value with list input, the pointer stops in the
    second column after the value.


    For example, you can read these data records with list, column, and formatted
    input:'
