  md: '+   - If named input values continue at the end of the current input line,
    use a slash (/) at the end of the input line. The slash tells SAS to move the
    pointer to the next line and to continue to read with named input.


    ```

    input name=$ age=;

    ```


    can read this input data record:


    ```

    name=John

    age=34

    ```


    +   - If you use named input to read character values that contain embedded blanks,
    put two blanks before and after the data value, as you would list with input.
    "Example 4: Reading Character Variables with Embedded Blanks" on page 225.


    +   - You cannot reference an array with an asterisk or an expression subscript.


    # Examples


    # Example 1: Using List and Named Input


    This DATA step uses list input with named input to read input data records.


    ```

    data list;

    length name $20 gender $1;

    informatat dob ddmmyy8;

    input id name= gender= age dob=

    datalines;

    4798 name=COLIN gender=m age=23 dob=16/02/75

    2653 name=MICHELE gender=f age=46 dob=17/02/73

    ;

    proc print data=list; run;

    ```


    The INPUT statement uses list input to read the ID variable. The remaining variables
    NAME, GENDER, AGE, and DOB are read with named input. The LENGTH statement prevents
    the INPUT statement from truncating the character values for the variable name
    to a length of eight.


    # Example 2: Using Named Input with Variables in Random Order


    Using the same data as in the previous example, this DATA step also uses list
    input and named input to read data records. However, in this example, the order
    of the values in the data is different for the two rows, except for the ID value,
    which must come first.


    ```

    data list;

    length name $20 gender $1;

    informat dob ddmmyy8;

    input id dob name= age= gender=

    datalines;

    4798 name=COLIN age=23 dob=16/02/75

    2653 name=MICHELE dob=17/02/73 age=46 gender=f

    ;

    proc print data=list; run;

    ```


    # Example 3: Using Named Input with Another Input Style


    This DATA step uses list input and named input to read input data records:


    ```

    data list;

    input id name=$20. gender=$;

    informat dob ddmmyy8;

    ```'
