  md: '# Details


    The ARRAY statement defines a set of elements that you plan to process as a group.
    You refer to elements of the array by the array name and subscribe. Because you
    usually want to process more than one element in the array, arrays are often referenced
    within DO groups.


    # Comparisons


    +   - Arrays in the SAS language are different from arrays in many other languages.
    A SAS array is simply a convenient way of temporarily identifying a group of variables.
    It is not a data structure, and array-name is not a variable.

    - An ARRAY statement defines an array. An array reference uses an array element
    in a program statement.


    # Examples


    # Example 1: Defining Arrays


    +   - array rain(5) jan fer mar apr may;

    - array days[7] d1-d7;

    - array month[*] jan feb jul oct nov;

    - array x(*)_NUMERIC;

    - array qbx[10];

    - array meal[3];


    # Example 2: Assigning Initial Numeric Values


    +   - array test[4] t1 t2 t3 t4 (90 80 70 70);

    - array test[4] t1-t4 (90 80 2*70);

    - array test[4] _TEMPORARY (90 80 70 70);


    # Example 3: Defining Initial Character Values


    +   - array test(*2) $ a1 a2 a3 (''a'',''b'',''c'');


    # Example 4: Defining More Advanced Arrays


    +   - array new(2:5) green jacobs denfato denzer;

    - array x(5,3) score1-score5;

    - array test[3:4,3:7] test1-test10;

    - array temp(0:999) _TEMPORARY;

    - array x[10] (2*1:5);


    # Example 5: Creating a Range of Variable Names That Have Leading Zeros


    The following example shows that you can create a range of variable names that
    have leading zeros. Each variable name has a length of three characters, and the
    names sort correctly (A01, A02, ... A10). Without leading zeros, the variable
    names would sort in the following order: A1, A10, A2, ... A9.'
