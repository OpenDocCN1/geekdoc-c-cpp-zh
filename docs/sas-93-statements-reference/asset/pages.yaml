- img_proc: true
  md: '# NOINPUT


    specifies that you cannot input values into fields that are displayed in the window.


    **Default:** If you omit NOINPUT, you can input values into unprotected fields
    that are displayed in the window.


    **Restriction:** If you use NOINPUT in all DISPLAY statements in a DATA step,
    you must include a STOP statement to stop processing the DATA step.


    **Tip:** The NOINPUT option is useful when you want to allow values to be entered
    into a window at some times but not others. For example, you can display a window
    once for entering values and a second time for verifying them.


    # BLANK


    clears the window.


    **Tip:** Use the BLANK option when you want to display different groups of fields
    in a window and you do not want text from the previous group to appear in the
    current display.


    # BELL


    produces an audible alarm, beep, or bell sound when the window is displayed if
    your personal computer is equipped with a speaker that provides sound.


    # DELETE


    deletes the display of the window after processing passes from the DISPLAY statement
    on which the option appears.


    # Details


    You must create a window in the same DATA step that you use to display it. Once
    you display a window, the window remains visible until you display another window
    over or until the end of the DATA step. When you display a window that contains
    fields where you enter values, either enter a value or press ENTER at each unprotected
    field to cause SAS to proceed to the next step. You cannot skip any fields.


    While a window is being displayed, use commands and function keys to view other
    windows, to change the size of the current window, and so on.


    A DATA step that contains a DISPLAY statement continues execution until the last
    observation that is read by SET, MERGE, UPDATE, MODIFY, or INPUT statement has
    been processed until a STOP or ABORT statement is executed. You can also issue
    the END command on the command line of the window to stop the execution of the
    DATA step.


    You must create a window before you display it. See the "WINDOW Statement" on
    page 381 for how to create windows. A window that is displayed with the DISPLAY
    statement does not become part of the SAS log or output file.


    # Example


    This DATA step creates and displays a window named START. The START window fills
    the entire screen. Both lines of text are centered.


    ```

    data _null;

    window start;

    #5 @28 ''WELCOME TO THE SAS SYSTEM'';

    #12 @30 ''PRESS ENTER TO CONTINUE'';

    display start;

    run;

    ```'
