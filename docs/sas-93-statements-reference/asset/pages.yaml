    # S370VS


    indicates that the file that is being read in IBM 370 variable-spanned format.

    Interaction: If you specify this option and the RECFM= option, then SAS ignores
    the RECFM= option.


    Tips:

    The data is transferred in image or binary format and is in local data format.

    Thus, you must use appropriate SAS informs to read the data correctly on non-EBCDIC
    codes.


    Use the rcmd=''site rdw'' command when you transfer a z/OS data set with a variable-record
    format to another z/OS variable-record format to preserve the record descriptor
    word (rdw) of each record. By default, most FTP servers remove the rdw that exists
    in each record before it is transferred.


    Typically, the ''SITE RDW'' command is not necessary when you transfer a data
    set with a z/OS variable-record format to ASCII, or when you transfer an ASCII
    file to a z/OS variable-record format.


