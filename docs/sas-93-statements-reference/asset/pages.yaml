- img_proc: true
  md: "# Without Arguments\n\nThe STOP statement causes SAS to stop processing the\
    \ current DATA step immediately and resume processing statements after the end\
    \ of the current DATA step.\n\n# Details\n\nSAS outputs a data set for the current\
    \ DATA step. However, the observation being processed when STOP executes is not\
    \ added. The STOP statement can be used alone or in an IF-THEN statement or SELECT\
    \ group.\n\nUse STOP with any features that read SAS data sets using random access\
    \ methods, such as the POINT= option in the SET statement. Because SAS does not\
    \ detect an end-of-file with this access method, you must include program statements\
    \ to prevent continuous processing of the DATA step.\n\n# Comparisons\n\n+   -\
    \ When you use a windowing environment or other interactive modes of operation,\
    \ the ABORT statement and the STOP statement both stop processing. The ABORT statement\
    \ sets the value of the automatic variable _ERROR_ to 1, but the STOP statement\
    \ does not.\n\n+   - In batch or noninteractive mode, the two statements also\
    \ have different effects. The STOP statement in batch or noninteractive mode to\
    \ continue processing with the next DATA or PROC step.\n\n# Examples\n\n# Example\
    \ 1: Basic Usage\n\n+   - stop;\n\n+   - if idcode=9999 then stop;\n\n+   - select\
    \ (a);\n  when (0) output;\n  otherwise stop;\n\n+   - end;\n\n# Example 2: Avoiding\
    \ an Infinite Loop\n\nThis example shows how to use STOP to avoid an infinite\
    \ loop within a DATA step when you are using random access methods:\n\n```\ndata\
    \ sampleobs=1 to totalobobs by 10;\n  set master.research point=sampleobs nobs=totalobobs;\n\
    \  output;\n;\nstop;\nrun;\n```\n\n# See Also\n\nStatements:\n\n+   - \"ABORT\
    \ Statement\" on page 19\n\n+   - POINT= option in the SET statement on page 348"
  merge: -1
  pgno: 371
