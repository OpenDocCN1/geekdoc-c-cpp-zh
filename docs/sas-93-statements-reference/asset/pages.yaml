  md: '# Details


    # ## General Information


    The SASFILE statement opens a SAS data set and allocates enough buffers to hold
    the entire file in memory. Once it is read, data is held in memory, available
    to subsequent DATA and PROC steps or applications, until either a second SASFILE
    statement closes the file and frees the buffers or the program ends, which automatically
    closes the file and frees the buffers.


    Using the SASFILE statement can improve performance


    +   - reducing multiple open or close operations (allocation and freeing of memory
    for buffers) to process a SAS data set to one open or close operation

    - reducing I/O processing by handling the data


    If your SAS program consists of steps that read a SAS data set multiple times
    and have an adequate amount of memory so that the entire file can be held in real
    memory, the program would benefit from using the SASFILE statement. Also, SASFILE
    is especially useful as part of a program that starts a SAS server as a SAS/SHARE
    server. With most performance-improvement features, it is suggested that you set
    up a test in your environment to measure performance with and without the SASFILE
    statement.


    # ## Processing a SAS Data Set Opened with SASFILE


    When the SASFILE statement executes, SAS opens the specified file. Then subsequent
    DATA and PROC steps execute, SAS does not have to open the file for each request;
    the file remains open until a second SASFILE statement closes it or the program
    or session ends.


    When a data set is opened by the SASFILE statement, the file is opened for input
    processing and can be used for subsequent input or update processing. However,
    the file cannot be used for subsequent utility or output processing, because utility
    and output processing requires exclusive access to the file (member-level locking).
    For example, you cannot replace the file or rename its variables.


    The following table provides a list of some SAS procedures and statements and
    specifies whether they are allowed if the file is opened by the SASFILE statement:


    Table 2.9 Processing Requests for a File Opened by SASFILE


    | Processing Request | Open Mode | Allowed |

    |---|---|--|

    | APPEND procedure | update | Yes |

    | DATA step that creates or replaces the file | output | No |

    | DATASETS procedure to rename or add a variable, change a label, or add or remove
    integrity constraints or indexes | utility | No |

    | DATASETS procedure with AGE, CHANGE, or DELETE statements | does not open the
    file but requires exclusive access | No |'
