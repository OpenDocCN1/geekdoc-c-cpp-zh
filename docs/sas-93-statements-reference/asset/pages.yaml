- img_proc: true
  md: 'To avoid spacing problems when both character strings and variable values are
    written, you might want to use a blank space as the last character in a character
    string. A character string that provides punctuation follows a variable value,
    you need to move the output pointer backward. Moving the output pointer backward
    prevents an unwanted space from appearing in the output line. See "Example 2:
    Writing Character Strings and Variable Values" on page 315.


    # How Modified List Output and Formatted Output Differ


    List output and formatted output use different methods to determine how far to
    move the pointer after a variable value is written. Modified list output, which
    uses formats, and formatted output produce different results in the output lines.
    Modified list output writes the value, inserts a blank space, and moves the pointer
    to the next column. Formatted output moves the pointer the length of the format,
    even if the value does not fill that length. The pointer moves to the next column;
    an intervening blank is not inserted.


    The following DATA step uses modified list output to write each output line:


    ```

    data_null_;

    input x y;

    put x : comma10.2 y : 7.2;

    datalines;

    2353.20 7.10

    6231 121;

    ```


    These lines are written to the SAS log:


    ```

    ------1------2

    2353.20 7.10

    6231.00 121.00

    ```


    In comparison, the following example uses formatted output:


    ```

    put x :comma10.2 y 7.2;

    ```


    These lines are written to the SAS log, with the values aligned in columns:


    ```

    ------1------2

    2353.20 7.10

    6231.00 121.00

    ```


    # Examples


    # Example 1: Writing Values with List Output


    This DATA step uses a PUT statement with list output to write variable values
    to the SAS log:


    ```

    data_null_;

    input name $ 1-10 sex $ 12 age 15-16;

    put name sex age;

    datalines;

    Joseph M 13

    Mitchel M 14

    Sue Ellen F 11;

    ```


    These lines are written to the SAS log:'
