    # CATNAME Statement


    Logically combines two or more catalogs into one by associating them with a catref
    (a shortcut name); clears one or all catrefs; lists the concatenated catalogs
    in one concatenation or in all concatenations.


    +   * Valid in: Anywhere

    * Category: Data Access


    # Syntax


    ```

    CATNAME <libref> catref

    <(libref-1.catalog-1 <ACCESS=READONLY)>

    <...libref.catalog-n <ACCESS=READONLY)>>;

    CATNAME <libref> catref CLEAR | _ALL_CLEAR;

    CATNAME <libref> catref LIST | _ALL_LIST;

    ```'
