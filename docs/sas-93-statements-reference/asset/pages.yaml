    # Details


    # Using List Output


    With list output, you list the names of the variables whose values you want written,
    or

    sspecify a character string in quotation marks. The PUT statement writes a variable

    value, inserts a single blank, and then writes the next value. Missing values
    for numeric

    variables are written as a single period. Character values are left-aligned in
    the field;

    leading and trailing blanks are removed. To include blanks (in addition to the
    blank

    inserted after each value), use formatted or column output instead of list output.


    There are two types of list output:


    +   - simple list output

    - modified list output.


    Modified list output increases the versatility of the PUT statement because you
    can

    spec a format to control how the variable values are written. See "Example 3:
    Writing

    Values with Modified List Output (:)" on page 315.


    # How List Output Is Spaced


    List output uses different spacing methods when it writes variable values and
    character

    strings. When a variable is written with list output, SAS automatically inserts
    a blank

    space. The output pointer stops at the second column that follows the variable
    value.

    However, when a character string is written, SAS does not automatically insert
    a blank

    space. The output pointer stops at the column that immediately follows the last
    character

    in the string.'
