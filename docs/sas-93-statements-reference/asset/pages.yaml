  md: 'For more information, the "DESCRIBE Statement" on page 59.


    # Executing a Stored Compiled DATA Step Program (Form 6)


    The following example executes a stored compiled DATA step program. It uses the
    DESCRIBE statement to write a copy of the source code to the SAS log.


    ```

    libname stored ''SAS library'';ndata pgm=stored.employee_list;

    describe;

    execute;

    run;

    libname stored ''SAS library'';ndata pgm=stored.test_program;

    describe;

    execute;

    ..more SAS statements.

    run;

    ```


    For information, see the "DESCRIBE Statement" on page 59 and the "EXECUTE Statement"
    on page 75.


    # Examples


    # Example 1: Creating Multiple Data Files and Using Data Set Options


    This DATA statement creates more than one data set, and it changes the contents
    of the output data sets.


    ```

    data error (keep=sub)ject date weight)

    fitness(label=''Exercise Study'')

    rename=(weight=pounds));

    ```


    The ERROR data set contains three variables. SAS assigns a label to the FITNESS
    and renames the variable weight to pounds.


    # Example 2: Creating Input DATA Step Views


    This DATA step creates an input DATA step instead of a SAS data file:


    ```

    libname ourlib ''SAS-library'';ndata ourlib.test / view=ourlib.test;

    set ourlib.fittest;

    tot=sum(of score1-score10);

    run;

    ```


    # Example 3: Creating a View and a Data File


    This DATA step creates an input DATA step named THEIRLIB.TEST and an additional
    temporary SAS data set named SCORETOT:


    ```

    libname ourlib ''SAS-library-1'';libname theirlib ''SAS-library-2'';ndata theirlib.test
    scoretotot

    / view=theirlib.test;

    set ourlib.fittest;

    tot=sum(of score1-score10);

    run;

    ```'
