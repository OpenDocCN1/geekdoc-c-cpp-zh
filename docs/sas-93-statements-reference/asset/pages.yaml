  md: "# LEAVE Statement\n\nStops processing the current loop and resumes with the\
    \ next statement in the sequence.\n\nValid in: DATA step\n\nCategory: Control\n\
    \nType: Executable\n\n# Syntax\n\nLEAVE;\n\n# Without Arguments\n\nThe LEAVE statement\
    \ stops the processing of the current DO loop or SELECT group\ncontinues DATA\
    \ step processing with the next statement following the DO loop or\nSELECT group.\n\
    \n# Details\n\nYou can use the LEAVE statement to exit a DO loop or SELECT group\
    \ prematurely\n on a condition.\n\n# Comparisons\n\n+   * The LEAVE statement\
    \ causes processing of the current loop to end.\nCONTINUE statement stops the\
    \ processing of the current iteration of a loop and\nresumes with the next iteration.\n\
    \n+   * You can use the LEAVE statement in a DO loop or in a SELECT group. You\
    \ can\nuse the CONTINUE statement only in a DO loop.\n\n# Example: Processing\
    \ a DO Loop under a Given Condition\n\nThis DATA step demonstrates the LEAVE statement\
    \ to stop the processing of the\nDO loop under a given condition. If the IF/THEN\
    \ statement checks the\nvalue of BONUS. When the value of BONUS reaches 500, the\
    \ maximum amount\nallowed, the LEAVE statement stops the processing of the DO\
    \ loop.\n\n```\ndata week;\n  input name $ idno start_yr status dept $;\n  bonus=0;\n\
    \  do year=start_yr to 1991;\n    if bonus ge 500 then leave;\n    bonus+50;\n\
    end;\ndatalines;\nJones 9011 1990 PT PUB\nThomas 876 1976 PT HR\nBarnes 7899 1991\
    \ PT TECH\nHarrell 1250 1975 PT HR\nRichards 1002 1990 PT DEV\n```"
