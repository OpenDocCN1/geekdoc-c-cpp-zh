  md: '# UPDATE Statement


    Updates a master file by applying transactions.


    +   **Valid in:** DATA step


    +   **Category:** File-handling


    +   **Type:** Executable


    # Syntax


    ```

    UPDATE master-data-set<data-set-options> transaction-data-set<data-set-options>

    <END=variable>

    UPDATODE= MISSINGCHECK | MISSINGCHECK>;

    BY by-variable;

    ```


    # Arguments


    +   **master-data-set**


    specifies the SAS data set used as the master file.


    **Range:** The name can be a one-level name (for example, FITNESS), a two-level
    name (for example, IN.FITNESS), or one of the special SAS data set names.


    **Tip:** Instead of using a data set name, you can specify the physical pathname
    to the file, using syntax that your operating system understands. The pathname
    must be enclosed in single or double quotation marks.


    **See:** "Rules for Words and Names in the SAS Language" in Chapter 3 of SAS Language
    Reference: Conceptis


    +   **data-set-options**


    specifies actions SAS is to take when it reads variables into the DATA step for
    processing.


    **Requirement:** Data-set-options must appear within parentheses and follow a
    SAS data set name.


    **Tip:** Dropping, keeping, and renaming variables is often useful when you update
    a data set. Renaming like-named variables prevents the second value that is read
    from over-writing the first. By renaming one variable, you make the values of
    both of them available for processing, such as comparing.


    **See:** A list of data options to use with input data sets in SAS Data Set Options:
    Reference


    **Example:** "Example 2: Updating by Renaming Variables" on page 371


    +   **transaction-data-set**


    specifies the SAS data set that contains the changes to be applied to the master
    data set.


    **Range:** The name can be a one-level name (for example, HEALTH), a two-level
    name (for example, IN.HEALTH), or one of the special SAS data set names.


    **Tip:** Instead of using a data set name, you can specify the physical pathname
    to the file, using syntax that your operating system understands. The pathname
    must be enclosed in single or double quotation marks.'
