- img_proc: true
  md: 'The data sets that are listed in the SET, MERGE, or UPDATE statements must
    be sorted by the values of the variables that are listed in the BY statement or
    have an appropriate index. As a default, SAS expects the data sets to be arranged
    in ascending numeric order or in alphabetical order. The observations can be arranged
    by one of the following


    +   * sort the data set

    * create an index for the variables

    * input the observations in order.


    Note: MODIFY does not require sorted data, but sorting can improve performance.

    Note: The BY statement has the linguistic collation of data that is sorted by
    using the SORT procedure with the SORTSEQ=LINGUISTIC option.


    For more information, see "How to Prepare Your Data Sets" in Chapter 21 of SAS
    Language Reference: Concepts.


    # In a PROC Step


    You can specify the BY statement with some SAS procedures to modify their action.
    Refer to the individual procedure in the Base SAS Procedures Guide for a discussion
    of how the BY statement affects processing for SAS procedures.


    # With SAS Views


    If you create a DATA step by reading from a DBMS and the SET, MERGE, UPDATE, or
    MODIFY statement is followed by a BY statement, the BY statement might cause the
    DBMS to sort the data in order to return the data in sorted order. Sorting the
    data could cost execution time.


    # Processing BY Groups


    SAS assigns the following values to FIRST.variable and LAST.variable:


    +   * FIRST.variable has a value of 1 under the following conditions:

    * when the current observation is the first observation that is read from the
    data set.

    * when you do not use the GROUPFORMAT option and the internal value of the variable
    in the current observation differs from the internal value within the previous
    observation.


    If you use the GROUPFORMAT option, FIRST.variable has a value of 1 when the formatted
    value of the variable in the current observation differs from the formatted value
    in the previous observation.

    * FIRST.variable has a value of 1 for any preceding variable in the BY statement.

    In all other cases, FIRST.variable has a value of 0.


    +   * LAST.variable has a value of 1 under the following conditions:

    * when the current observation is the last observation that is read from the data
    set.

    * when you use the GROUPFORMAT option and the internal value of the variable in
    the current observation differs from the internal value in the next observation.


    If you use the GROUPFORMAT option, LAST.variable has a value of 1 when the formatted
    value of the variable in the current observation differs from the formatted value
    in the next observation.

    * LAST.variable has a value of 1 for any preceding variable in the BY statement.'
  merge: -1
