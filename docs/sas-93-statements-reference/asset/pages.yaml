    This example shows how to create multiple observations for each input data record.
    Each record contains several NAME and AGE values. The DATA step reads a NAME value
    and an AGE value, outputs an observation, and then reads another set of NAME and
    AGE values to output, and so on, until all the input values in the record are
    processed.


    ```

    data test;

