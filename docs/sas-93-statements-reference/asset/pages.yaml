  md: '# Details


    # When to Use Column Input


    With column input, the column numbers that contain the value follow a variable
    name in the INPUT statement. To read with column input, data values must be in


    +   - the same columns in all the input data records

    - standard numeric format or character form.¹


    Useful features of column input are that


    +   - Character values can contain embedded blanks.

    - Character values can be from 1 to 32,767 characters long.

    - Input values can be read in any order, regardless of their position in the record.

    - Values or parts of values can be read multiple times. For example, this INPUT
    statement reads an ID value in columns 10 through 15 and then reads a GROUP value
    from column: 13


    ```

    input id 10-15 group 13;

    ```


    +   - Both leading and trailing blanks within the field are ignored. Therefore,
    if numeric values contain blanks that represent zeros or if you want to retain
    and trailing blanks in character values, read the value with an informat. See
    the “INPUT Statement, Formatted” on page 211.


    # Missing Values


    Missing data do not require a place-holder. The INPUT statement interprets a blank
    field as missing and reads other values correctly. If a numeric or character field
    contains a single period, the variable value is set to missing.


    # Reading Data Lines


    SAS always pads the data that follow the DATALINES statement (in-stream data)
    to a fixed length in multiples of 80. The CARDIMAGE system option determines whether
    to read or truncate data the 80th column.


    # Reading Variable-Length Records


    By default, SAS uses the FLOWOVER option to read varying-length data records.
    If the record contains fewer values than expected, the INPUT statement reads the
    values from the next data record. To read varying-length data, you might need
    to use the TRUNCATE option in the INFILE statement. The TRUNCATE option is more
    efficient than the PAD option, which pads the records to a fixed length. For more
    information, see “Reading the End of a Line” on page 179.


    # Examples


    # Example 1: Read Input Records with Column Input


    This DATA step demonstrates how to read data records with column input:


    ```

    data scores;

    input name $ 1-18 score1 25-27 score2 30-32;

    score3 35-37;

    ```'
