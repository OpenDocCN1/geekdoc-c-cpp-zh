  md: '# Comparisons


    As the FTP get and put commands, the FTP access method lets you download and upload
    files. However, this method directly reads files into your SAS session without
    first storing them on your system.


    # Examples


    # Example 1: Retrieving a Directory Listing


    This example retrieves a directory listing from a host mvhost1 for user smythe,
    and prompts smythe for a password:


    ```

    filename dir ftp '''' is user=''smythe''

    host=''mvhost1.mvs.sas.com'' prompt;

    data_null;

    in dir;

    input;

    put _INFILE;

    run;

    ```


    Note: The quotation marks are empty because no file is being transferred. Quotation
    marks are required by the syntax, however, you must include them.


    # Example 2: Reading a File from a Remote Host


    This example reads a file called sales in the directory /u/kudzu/mydata from the
    remote UNIX host hp720:


    ```

    filename myfile ''sales'' cd=''/u/kudzu/mydata''

    user=''guest'' host=''hp720.sas.com''

    recfm=v prompt;

    data mydata / view=mydata; /* Create a view *

    infile myfile;

    input X 10. y 4.;

    run;

    proc print data=mydata; /* Print the data *

    run;

    ```


    # Example 3: Creating a File on a Remote Host


    This example creates a file called test.dat in a directory c:\remote for the user
    bbailey on the host winnt.pc.


    ```

    filename create ''c:\remote\test.dat''

    host=''winnt.pc''

    user=''bbailey'' prompt recfm=v;

    data_null;

    file create;

    do i=1 to 10;

    put i=

    end;

    run;

    ```


    # Example 4: Reading an S370V-Format File on z/OS


    This example reads a S370V-format file from a z/OS system. RCMD= option on page
    121 for more information about RCMD=''site rdw.'
  merge: -1
  pgno: 137
