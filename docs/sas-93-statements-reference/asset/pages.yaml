  md: '# Associating a Fileref with a Terminal, Printer, Universal Printer, and Plotter
    (Form 2)


    To associate a fileref with an output device, use this form:

    FILENAME fileref device-type <operating-environment-options>;


    # Disassociating a Fileref from an External File (Form 3)


    To disassociate a fileref from a file, use a FILENAME statement, specifying the
    fileref and the CLEAR option.

    FILENAME filerefCLEAR | _ALL, CLEAR;


    # Writing Attributes to the SAS Log (Form 4)


    Use a FILENAME statement to write the attributes of one or more external files
    to the SAS log. Specify fileref to list the attributes of one; use _ALL to list
    the attributes of all files that have been assigned filerefs in your current SAS
    session.

    FILENAME filerefLIST | _ALL_LIST;


    # Comparisons


    The FILENAME statement assigns a fileref to an external file. The LIBNAME statement
    assigns a libref to a SAS data set or a DBMS file that can be accessed like a
    SAS data set.


    # Examples


    # Example 1: Specifying a Fileref or a Physical Filename


    You can specify an external file either by associating a fileref with the file
    and then specifying the fileref or by specifying the physical filename in quotation
    marks:


    ```

    filename sales ''your-input-file'';

    data janzas;

    /* specifying a fileref */

    infile sales

    input salesresp $20. +6 janzas febsales

    marshales;

    run;

    data janzas;

    /* physical filename in quotation marks */

    infile ''your-input-file'';

    input salesresp $20. +6 janzas febsales

    marshales;

    run;

    ```


    # Example 2: Using a FILENAME and a LIBNAME Statement


    This example reads data from a file that has been associated with the fileref
    GREEN and creates a permanent SAS data set stored in a SAS library that has been
    associated with the libref SAVE.


    ```

    filename green ''your-input-file'';

    name save ''SAS-library'';

