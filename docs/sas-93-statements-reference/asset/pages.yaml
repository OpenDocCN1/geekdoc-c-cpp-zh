    # ### Example 3: Associating a Fileref with an Aggregate Storage Location


    If you associate a fileref with an aggregate storage location, use the fileref,
    followed in parentheses by an individual filename, to read from or write to any
    of the individual external files that are stored.


    Operating Environment Information


    Some operating environments enable you to read from but not write to members of
    aggregate storage locations. For details, see the SAS documentation for your operating
    environment.


    In this example, each DATA step reads from an external file (REGION1 and REGION2,
    respectively) that is stored in the same aggregate storage location and is referenced
    by the fileref SAS.


    ```

    filename ''aggregate-storage-location'';

    data total;

    infile sales(region1);

    input machine $ jansales febsales marsales;

    total=jansales+febbsales+marsales;

    run;

    data total2;

    infile sales(region2);

    input machine $ jansales febsales marsales;

    total=jansales+febsales+marsales;

    run;

    ```


    # ### Example 4: Routing PUT Statement Output


    In this example, the FILENAME statement associates the fileref OUT with a printer
    that is specified with an operating-dependent option. The FILE statement directs
    PUT statement output to that printer.


    ```

    put out printer operating-environment-option;

    data sales;

    file out print;

    input salesrep $20. +6 jansales

    febsales marsales;

    put _infile_

    datalines;

    ```


    | Jones, E. A. | 124357 155321 167895 |

    | Lee, C. R. | 111245 127564 143255 |

    | Desmond, R. T. | 97631 101345 117865 |


    You can use the FILENAME and FILE statements to route PUT statement output to
    several devices during the same session. To route PUT statement output to your
    display monitor, use the TERMINAL option in the FILENAME statement, as shown here:


    ```

    filename show terminal;

    data sales;

    file show;

    input salesrep $20. +6 jansales

    febsales marsales;

    put _infile_

    datalines;

    ```'
