  md: '# CVPBYTES=bytes


    specifies the number of bytes to expand character variable lengths when processing
    a SAS data file that requires transcoding.


    See: Chapter 35, "SAS Engines," in SAS Language Reference: Concepts


    # CVPENGINE=CVPENG


    specifies the engine to use in order to process a SAS data file that requires
    transcoding.


    See: Chapter 35, "SAS Engines," in SAS Language Reference: Concepts


    # CVPMULTLIER=CVPMULTLIER


    specifies a multiplier value in order to expand character variable lengths when
    processing a SAS data file that requires transcoding.


    See: Chapter 35, "SAS Engines," in SAS Language Reference: Concepts


    # EXTENDBOBSCOUNTER=NO | YES


    specifies whether to extend the maximum observation count in output SAS data files
    for a SAS library.


    NO


    specifies the maximum observation count in a newly created SAS data file is determined
    by the long integer size for the operating environment. In a 32-bit integer, the
    maximum number is 2³¹-1 or approximately two billion observations (2,147,483,647).
    In operating environments with a 64-bit integer, the number is 2⁶³-1 or approximately
    9.2 quintillion observations.


    YES


    requests an enhanced file in newly created SAS data files that counts observations
    beyond the 32-bit-limit. For a SAS data file that is created for an operating
    environment that stores the number of observations with 32-bit-integer, the file
    behaves like a 64-bit integer with respect to counters.


    # Restrictions:


    A SAS data file that created with EXTENDBOBSCOUNTER=YES is incompatible with releases
    before SAS 9.3.


    Use with the BASE engine only.


    Specify EXTENDBOBSCOUNTER=YES only for an output SAS data file whose internal
    data representation stores the observation count as a 32-bit-integer. For a table
    that lists the operating environments and OUTREP-values that are appropriate,
    see "When to Use the EXTENDBOBSCOUNTER-YES Option" in Chapter 26 of SAS Language
    Reference: Concepts.


    The observation count attribute cannot be inherited by a new file. If you want
    to create a file with an extended observation count from a file that contains
    the extended observation count attribute, you must specify the EXTENDBOBSCOUNTER=option
    for the new file. For more information, see "Extended Observation Count Behavior
    Considerations" in Chapter 26 of SAS Language Reference: Concepts.


    Tip: Using EXTENDBOBSCOUNTER=option in a LIBNAME statement is also useful to migrate
    a library with the MIGRATE procedure, which does not support SAS data options.


    See: "Extending the Observation Count in a SAS Data File" in Chapter 26 of SAS
    Language Reference: Concepts


    Alias: EOC=


    Default: NO'
