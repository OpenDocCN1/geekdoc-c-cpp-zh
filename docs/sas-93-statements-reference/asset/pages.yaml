  md: '# Example 2: Using the SET Statement with Transcoded Variables


    In this example, which uses the SET statement, the variable Z''s TRANSCODE= attribute
    in data set A is NO because B is the first data set and Z''s TRANSCODE= attribute
    in data set B is NO.


