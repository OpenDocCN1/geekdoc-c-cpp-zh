  md: "# Syntax\n\nDO;\n...more SAS statements...\nEND;\n\n# Without Arguments\n\n\
    Use the DO statement for simple DO group processing.\n\n# Details\n\nThe DO statement\
    \ is the simplest form of DO group processing. The statements between the DO and\
    \ END statements are called a DO group. You can nest DO statements within DO groups.\n\
    \n> Note: The memory capabilities of your system can limit the number of nested\
    \ DO statements that you can use. For details, see the SAS documentation about\
    \ how many levels of nested DO statements your system's memory can support.\n\n\
    A simple DO statement is often used within IF-THEN/ELSE statements to designate\
    \ a group of statements to be executed depending on whether the IF condition is\
    \ true or false.\n\n# Comparisons\n\nThere are three other forms of the DO statement:\n\
    \n+   * The iterative DO statement executes statements between DO and END statements\
    \ repetitively based on the value of an index variable. The iterative DO statement\
    \ can contain a WHILE or UNTIL clause.\n* The DO UNTIL statement executes statements\
    \ in a DO loop repetitively until a condition is true, checking the condition\
    \ after each iteration of the DO loop.\n* The DO WHILE statement executes statements\
    \ in a DO loop repetitively while a condition is true, checking the condition\
    \ before each iteration of the DO loop.\n\n# Example: Using the DO Statement\n\
    \nIn this simple group, the statements between DO and END are performed only when\
    \ YEARS is less than or equal to 5, statements in the DO group do not execute,\
    \ and the program continues with the assignment statement that follows the ELSE\
