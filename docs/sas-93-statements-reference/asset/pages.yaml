- img_proc: true
  md: '# Syntax


    GO TO label;


    # Arguments


    label specifies a statement label that identifies the GO TO destination. The destination
    must be within the same DATA step. You must specify the label argument.


    # Comparisons


    The GO TO statement and the LINK statement are similar. whereas a GO TO statement
    is often used without a RETURN statement, whereas a LINK statement is usually
    used with an explicit RETURN statement. The action of a subsequent RETURN statement
    differs between the GO TO and LINK statements. A RETURN after a LINK statement
    returns execution to the statement that follows the LINK statement. A RETURN after
    a GO TO statement returns execution to the beginning of the DATA step (unless
    a LINK statement precedes the GO TO statement. In that case, execution continues
    with the first statement after the LINK statement).


    GO TO statements can often be replaced by DO-END and IF-THEN/ELSE programming
    logic.


    # Example: Using a RETURN Statement with the GO TO Statement


    Use the GO TO statement as shown here.


    +   In this example, if the condition is true, the GO TO statement instructs SAS
    to jump to a label called ADD and to continue execution from there. If the condition
    is false, SAS executes the PUT statement and the statement that is associated
    with the GO TO label:


    ```

    data info;

    input x;

    if 1<=x<=5 then go add;

    put x;

    add: sumx+x;

    datalines;

    7

    6

    323;

    ```


    Because every DATA step contains an implied RETURN at the end of the step, program
    execution returns to the top of the step after the sum statement is executed.
    Therefore, an explicit RETURN statement at the bottom of the DATA step is not
    necessary.'
  merge: -1
  pgno: 167
- img_proc: true
  md: '# IF Statement, Subsetting 155


    +   - If you do not want the Sum statement to execute for observations that do
    not meet the condition, rewrite the code and include an explicit return statement.


    data info;

    input x;

    if x<<5 then go to add;

    put x=;

    return;


    /* SUM statement not executed */

    /* if x<1 or x>5 */

    add: sum+x;

    datalines:;


    7

    6

    323

    ;


    # See Also


    +   - "DO Statement" on page 63

    - "label: Statement" on page 228

    - "LINK Statement" on page 248

    - "RETURN Statement" on page 333


    # IF Statement, Subsetting


    Continues processing only those observations that meet the condition of the specified
    expression.


    | Valid in: | DATA step |

    | Category: | Action |

    | Type: | Executable |


    # Syntax


    IF expression;


    # Arguments


    expression

    is any SAS expression.


    # Details


    The subsetting IF statement causes the DATA step to continue processing only those
    raw data records or observations from a SAS data set that meet the condition of
    the expression that is specified in the IF statement. That is, if the expression
    is true for the observation or record (its value is neither 0 nor missing), SAS
    continues to execute statements in the DATA step and includes the current observation
    in the data set. The resulting SAS data set or data sets contain a subset of the
    original external file or SAS data set.'
  merge: -1
  pgno: 168
- img_proc: true
  md: 'If the expression is false (its value is 0 or missing), no further statements
    are processed for observation or the current observation is not written to the
    data set, and the remaining program statements in the DATA step are not executed.
    SAS immediately returns to the beginning of the DATA step because the subsetting
    IF statement does not require additional statements to stop processing observations.


    # Comparisons


    +   - The subsetting IF statement is equivalent to this IF-THEN statement:


    ```sas

    if not (expression)

    then delete;

    ```

    - When you create SAS data sets, use the subsetting IF statement when it is easier
    to specify a condition for including observations. When it is easier to specify
    a condition for excluding observations, use the DELETE statement.

    - The subsetting IF and the WHERE statement are not equivalent. The two statements
    work differently and produce different output data sets in some cases. The most
    important differences are summarized as follows:

    - The subsetting IF statement selects observations that have been read into the
    program data. The WHERE statement selects observations before they are brought
    into the program data. The subsetting IF might be less efficient than the WHERE
    statement because it must read each observation from the input data set into the
    program data.

    - The subsetting IF and WHERE statement can produce different results in DATA
    steps that interleave, merge, or update SAS data sets.

    - When the subsetting IF statement is used with the MERGE statement, the SAS selects
    observations after the current observations are combined. When the WHERE statement
    is used with the MERGE statement, the SAS System applies the selection criteria
    to each input data set before combining the current observations.

    - The subsetting IF statement can select observations from an existing SAS data
    set or from raw data that are read with the INPUT statement. The WHERE statement
    can select observations only from existing SAS data sets.

    - The subsetting IF statement is executable; the WHERE statement is not.


    # Example: Limiting Observations


    +   - This example results in a data set that contains only those observations
    with the value F for the variable SEX:


    ```sas

    if sex=''F'';

    ```n- This example results in a data set that contains all observations for which
    the variable AGE is not missing or 0:


    ```sas

    if age;

    ```


    # See Also


    +   - Chapter 11, "WHERE-Expression Processing," in SAS Language Reference: Concepts'
  merge: -1
  pgno: 169
- img_proc: true
  md: '# IF-THEN/ELSE Statement


    Data Set Options:


    +   - "WHERE= Data Set Option in SAS Data Set Options: Reference


    Statements:


    +   - "DELETE Statement" on page 58


    +   - "IF-THEN/ELSE Statement" on page 157


    +   - "WHERE Statement" on page 374


    Executes a SAS statement for observations that meet specific conditions.


    Valid in: DATA step

    Category: Control

    Type: Executable


    # Syntax


    IF expression THEN statement;

    <ELSEstatement>;


    # Arguments


    expression

    is any SAS expression and is a required argument.


    statement

    can be any executable SAS statement or DO group.


    # Details


    SAS evaluates the expression in an IF-THEN statement to produce a result that
    is either nonzero, zero, or missing. A nonzero and missing result causes the expression
    to be true; a result of zero or missing causes the expression to be false.


    If the conditions that specified in the IF clause are met, the IF-THEN statement
    executes a SAS statement for observations that are read from a SAS data set, for
    records in an external file, or for computed values. An optional ELSE statement
    gives an alternative action if the THEN clause is not executed. The ELSE statement,
    if used, must immediately follow the IF-THEN statement.


    Using IF-THEN statements without the statement causes SAS to evaluate all IF-THEN
    statements. Using IF-THEN statements with the ELSE statement causes SAS to execute
    IF-THEN statements until it encounters the first true statement. Subsequent IF-THEN
    statements are not evaluated.


    Note: For greater efficiency, construct your IF-THEN/ELSE statement with conditions
    of decreasing probability.'
  merge: -1
  pgno: 170
- img_proc: true
  md: '# Comparisons


    +   - Use a SELECT group rather than a series of IF-THEN statements when you have
    a series of mutually exclusive conditions.


    +   - Use subsetting IF statements, without a THEN clause, to continue processing
    only those observations or records that meet the condition that is specified in
    the IF clause.


    # Example: Different Ways of Specifying the IF-THEN/ELSE Statements


    These examples show different ways of specifying the IF-THEN/ELSE statement.


    +   - if x delete;


    +   - if status=''OK'' and type=3 then count+1;


    +   - if age agecheck then delete;


    +   - if x=0 then

    y ne 0 then put ''X ZERO, Y NONZERO'';

    else put ''X ZERO, Y ZERO'';

    else put ''X NONZERO!'';


    +   - if answer=9 then

    do

    answer=;

    put ''INVALID ANSWER FOR '' id=;

    end;

    else

    do

    answer=answer10;

    valid+1;

    end;


    +   - data region $ 1-30;

    if city=''New York City'' then

    or city=''Miami'' then

    region=''ATLANTIC COAST'';

    else if city=''San Francisco''

    or city=''Los Angeles'' then

    region=''PACIFIC COAST'';

    datalines;

    more data lines...


    ;


    # See Also


    Statements:


    +   - "DO Statement" on page 63


    +   - "IF Statement, Subsetting" on page 155


