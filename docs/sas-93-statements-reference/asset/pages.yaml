    +   - Using OUTPUT, REPLACE, or REMOVE in a DATA step overrides the default replacement
    of observations. If you use any of these statements in a DATA step, you must explicitly
    program each action that you want to.


    +   - If both an OUTPUT statement and a REPLACE or REMOVE statement execute on
    a given observation, perform the OUTPUT action last to keep the position of the
    observation point correct.


    "Example 8: Replacing and Removing Observations to Different SAS Data Sets" on
    page 281 shows how to use the OUTPUT, REMOVE, and REPLACE statements to write
    observations.


    # Missing Values and the MODIFY Statement


    By default, the UPDATE=MISSCHECKING option is in effect, so missing values in
    the transaction data set do not replace existing values in the master data set.
    Therefore, if you want to update some but not all variables and the variables
    that you want to update from one observation to the next, set missing those variables
    that are not changing. If you want missing values in the transaction data set,
    use UPDATE=NOMISSING.


    Even when UPDATE=MISSCHECKING is in effect, you can replace existing values by
    using special value characters in the transaction data set. To create the transaction
    data set, use the MISSING statement in the DATA step. If you define one of the
    special values through z for the transaction data set, SAS updates numeric variables
    in the master data set to that value.


    If you want the resulting value in the master data set to be a regular value,
    use a underscore (_) to represent missing values in the transaction data set.
    The resulting value in the master data set will be a period (.) for missing numeric
    values and a blank for missing character values.


    For more information on defining and using special missing value characters, see
    the "MISSING Statement" on page 262.


    # MODIFY with Data Set Options


    If you use data set options (such as KEY=) in your program, then use the MODIFY
    statement for the master data set. Using data set options in the DATA statement
    might produce unexpected results.


    # MODIFY in a SAS/SHARE Environment


    In a SAS/SHARE environment, the MODIFY statement accesses an observation in update
    mode. There, the observation is locked from the time MODIFY reads it until a REPLACE
    or REMOVE statement executes. At that point the observation is unlocked. The MODIFY
    statement opens the data set in update mode, but the control level is based on
    the statement used. For example, KEY= and POINT= are member-level locking. See
    the SAS/SHARE User''s Guide for more information.


    # Comparisons


    +   - When you use a MERGE, SET, or UPDATE statement in a DATA step, SAS creates
    a new data set. The data set descriptor of the new copy can be different from
    the old one (variables added or deleted, labels changed, and so on). When you
    use a MODIFY statement in a DATA step, however, SAS does not create a new copy
    of the data set. As a result, the data set descriptor cannot change.'
