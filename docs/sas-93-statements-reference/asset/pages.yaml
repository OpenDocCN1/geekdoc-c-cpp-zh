  md: '# LIBNAME Statement


    YES


    specifies that new empty data set with a given name replace an existing data set
    with the same name. This is the default.


    Interaction: When REMPTY=YES and REPLACE=NO, then the data set is not replaced.


    NO


    specifies that new empty data set with a given name not replace an existing data
    set with the same name.


    Tips:


    Use REMPTY=NO to prevent the following syntax error from replacing the existing
    data set MYLIB.B with the new data set MYLIB.B that was created by:


    ```

    libname libreb SAS REEMPTY=NO;

    data mylib.a mylib.b;

    ```


    For both the convenience of replacing existing data sets with new ones that contain
    data and the protection of not overwriting existing data sets with new empty ones
    are created by mistake, set REPLACE=YES and REMMPTY=NO.


    Note: For an individual data set, the REMMPTY= data set option overrides the setting
    of the REMMPTY= option in the LIBNAME statement.


    See: "REMPTY= Data Set Option" in *SAS Data Set Options*: Reference


    # Engine Hotoptions


    engine-host-options


    are or more options that are listed in the general form keyword=value.


    Restriction: When concatenating libraries, you cannot specify options to an engine
    or an operating environment.


    Operating environment: For a list of valid specifications, the SAS documentation
    for your operating environment.


    # Details


    # Associating a Libreb with a SAS Library (Form 1)


    The association between a libreb and a SAS library lasts only for the duration
    of the SAS session or you change the libreb or discontinue it with another LIBNAME
    statement. The simplest form of the LIBNAME statement specifies a libreb and the
    physical name of a SAS library:


    See "Example 1: Assigning and Using a Libreb" on page 241.


    An engine specification is usually not necessary. If the situation is ambiguous,
    SAS uses the setting of the ENGINE= system option to determine the default engine.
    If all data sets in the library are associated with a single engine, then SAS
    uses that engine as the default. In this situation, you can override the default
    by specifying another engine with the ENGINE= system option


    ```

    LIBNAME libreb engine ''SAS-library'';

    <options><engine/host-options>;

    ```


    Operating Environment Information'
