    put !EM_SUBJECT! Report for '' dept'';

    put name, '','';

    put ''Here is the latest report for '' dept ''.'';

    if dept=''marketing'' then

    put !EM_ATTACH c:\mktrept.txt'';

    else /* !EM_ATTACH the appropriate report */

    put !EM_ATTACH c:\devrept.txt'';

    put !EM_SEND!!;

    put !EM_NEWMSG!!;

    put !EM_ABORT!!;

