  md: "You inadvertently position the pointer beyond the current line length with\
    \ one or more of these specifications:\n\n+   - a + pointer control with a value\
    \ that moves the pointer to a column beyond the current line length\n\n+   - a\
    \ column range that exceeds the current line length (for example, PUT X 90–100\
    \ when the current line length is 80)\n\n+   - a variable value or character string\
    \ that does not fit in the space that remains in the current output line.\n\n\
    By default, PUT attempts to write past the end of the current line, SAS withholds\
    \ the entire item that overflows the current line, writes the current line, and\
    \ then writes the overflow on a new line, starting in column 1. See the FLOWOVER,\
    \ DROPOVER, and STPOVER options in the “FILE Statement” on page 76.\n\n# Arrays\n\
    \nYou can use the PUT statement to write an array element. The subscript is an\
    \ integer when the PUT statement executes. You can use an array reference in a\
    \ numeric-variable construction with a pointer control if you enclose the reference\
    \ in parentheses, as shown here: \n\n```\n@(array-name{i})\n```\n\n```\n+(array-name{i})\n\
    ```\n\n```\n#(array-name{i})\n```\n\nUse the array subscript (*) to write all\
    \ elements of a previously defined array to an external location. SAS allows one-dimensional\
    \ or multidimensional arrays, but it does not allow a _TEMPORARY array. Enclose\
    \ the subscript in braces, brackets, or parentheses, and print the array using\
    \ list, formatted, column, or named output. With list output, the form of this\
    \ statement is\n\n```\nPUT array-name*;\n```\n\nWith formatted output, the form\
    \ of this statement is\n\n```\nPUT array-name*(format|format.list);\n```\n\nThe\
    \ format in parentheses follows the array reference.\n\n# Comparisons\n\n+   -\
    \ The PUT statement writes variable values and character strings to the SAS log\
    \ or to an external location while the INPUT statement reads raw data in external\
    \ files or data lines entered stream.\n\n+   - Both the INPUT and PUT statements\
    \ use the trailing @ and double trailing @-line handlers to hold the current line\
    \ in the input or output buffer, respectively. In an INPUT statement, a double\
    \ trailing @ holds a line in the input buffer from iteration of the DATA step\
    \ to the next. In a PUT statement, a trailing @ has the same effect as a double\
    \ trailing @; hold a line across iterations of the DATA step.\n\n+   - Both the\
    \ PUT and OUTPUT statements create output in a DATA step. The PUT statement uses\
    \ an output buffer and writes output lines to an external location, the SAS log,\
    \ or monitor. The OUTPUT statement uses the program data and writes observations\
    \ to a SAS data set."
