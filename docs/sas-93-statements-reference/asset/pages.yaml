    # Details


    # The Basics


    Using the ATTRIB statement in the DATA step permanently associates attributes
    by changing the descriptor information of the SAS data set that contains the variables.


    You can use ATTRIB in a PROC step, but the rules are different.


    # How SAS Treats Variables When You Assign Informats with the INFORMAT= Option
    in the ATTRIB Statement


    Informats that are associated with variables using the INFORMAT= attribute behave
    like informats when used with modified list input. SAS reads the variables by
    using the scanning feature of list input, but applies the informat. In modified
    list input, SAS does the following:


    +   - does not use the value of w in an informat to specify column positions or
    input field widths in an external file


    +   - uses the value of w in an informat to specify the length of previously undefined
    character variables


    +   - ignores the value of w in numeric informats'
