  md: '# column-specifications


    specifies which columns of the line values are written.

    See: "Column Output" on page 294

    Example: "Example 2: Moving the Pointer within a Page" on page 299


    format.

    specifies a format to use when the variable values are written.

    See: "Formatted Output" on page 294

    Example: "Example 1: Using Multiple Output Styles in One PUT Statement" on page
    299


    (format-list)

    specifies a list of formats to use when the values of the preceding list of variables
    are written.

    Restriction: The (format-list) must follow the (variable-list).

    See: "PUT Statement, Formatted" on page 308


    # _INFILE

    writes the last data record that is either read from the current input file or
    from the data lines that follow a DATELINES statement.


    Tips:

    _INFILE is an automatic variable that references the current INPUT buffer. You
    can use this automatic variable in other SAS statements.

    If the most recent INPUT statement uses line-pointer controls to read multiple
    input data records, PUT _INFILE writes only the record that the pointer is positioned
    on.


    Example: This PUT statement writes all the values of the first input data record:

    input #3 score name $ 6-23;

    put _infile_;


    Example: "Example 6: Writing the Current Input Record to the Log" on page 303


    # _ALL

    writes the values of all variables, which includes automatic variables, that are
    defined in the current DATA step using named output.


    See: "Named Output" on page 295


    # _ODS

    m data for all columns (defined by the ODS option in the FILE statement) into
    a special buffer, from which it is eventually written to the data component. The
    ODS option in the FILE statement defines the structure of the data component that
    holds the results of the DATA step.


    Restriction: Use _ODS only if you have previously specified the ODS option in
    the FILE statement.


    Interaction: _ODS writes to a specific column only if a PUT statement has not
    already specified a variable for that column with a column pointer. That is, a
    variable specification for a column overrides the _ODS_ option.


    Tip: You can use the _ODS specification in conjunction with option specifications
    and column pointers, and it can appear anywhere in a PUT statement.


    See: "PUT Statement for ODS" in SAS Output Delivery System: User''s Guide'
