  md: "# Example 7: Performing a Table Lookup\n\nThis example illustrates using the\
    \ KEY option to perform a table lookup. The DATA step reads a primary data set\
    \ that is named INVTORY and a lookup data set that is named PARTCODE. It uses\
    \ the index PARTNO to read PARTCODE nonsequentially by looking for a match between\
    \ the PARTNO value in each data set. The purpose is to obtain the appropriate\
    \ description, which is available only in the variable DESC in the lookup data\
    \ set, for each part that is listed in the primary data set:\n\n```\ndata combine;\n\
    \  set inventory (keep=partno instock price);\n  set partcode (keep=partno desc)\
    \ key=partno;\nrun;\n```\n\n# Example 8: Performing a Table Lookup When the Master\
    \ File Contains Duplicate Observations\n\nThis example uses the KEY=option to\
    \ perform a table lookup. The DATA step reads a primary data set that is named\
    \ INVTORY, which is indexed on PARTNO, and a lookup data set named PARTCODE. PARTCODE\
    \ contains quantities of new stock (variable NEW STK). The UNIQUE option ensures\
    \ that, if there are any duplicate observations in INVTORY, values of NEW STK\
    \ are added only to the first observation of the group:\n\n```\ndata combine;\n\
    \  set partcode (keep=partno new_stk);\n  set inventory (keep=partno instock price)\n\
    \  key=partno/unique;\n  instock+new_stk;\nrun;\n```\n\n# Example 9: Reading a\
    \ Subset by Direct Access\n\nThese statements select a subset of 50 observations\
    \ from the data set DRUGTEST by using the POINT= option to access observations\
    \ directly by number:\n\n```\ndata sample;\n  do obsnum=1 to 100 by 2;\n    set\
    \ drugtest point=obsnum;\n    if _error_then abort;\n    output;\nend;\nstop;\n\
    run;\n```\n\n# Example 10: Performing a Function until the Last Observation Is\
    \ Reached\n\nThese statements use NOBS to set the termination value for DO-loop\
    \ processing. The value of the temporary variable LAST is the sum of the observations\
    \ in SURVEY1 and SURVEY2:\n\n```\ndo obsnum=1 to 100;\n  set survey1 survey2 point=obanum\
    \ nobs=last;\n  output;\nend;\nstop;\n```"
  merge: -1
