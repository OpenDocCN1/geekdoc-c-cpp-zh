    \ sample;\n  put Name ID;\nrun;\n```\n\n# Creating a DATA Step View (Form 3)\n\
    \nYou can create step views and execute them at a later time. The following DATA\n\
    step example creates a DATA step view. It uses the SOURCE=ENCRYPT option to\n\
    save and encrypt the source code.\n\n```\ndata phone_list view=phone_list (source=encrypt);\n\
    set customer_list;\n  .more SAS statements.\nrun;\n```\n\nFor more information,\
    \ see \"DATA Step Views\" in Chapter 27 of SAS Language\nReference: Concepts.\n\
    \n# Creating a Stored Compiled DATA Step Program (Form 4)\n\nThe ability to compile\
    \ and store DATA step programs enables you to execute the stored\nprograms later.\
    \ Stored compiled DATA step programs can reduce processing costs by\nelinating\
    \ the need to compile DATA step programs repeatedly. The following DATA\nstep\
