    # Operating Environment Options


    options | host-options

    Operating Environment Information

    For descriptions of operating environment-specific options in the INFILE statement,
    see the SAS documentation for your operating environment.


    See: INFILE Statement under Windows, UNIX, and z/OS


    # DBMS Specifications


    DBMS-Specifications

    enable you read records from some DBMS files. You must license SAS/ACCESS software
    to be able to read from DBMS files. See the SAS/ACCESS documentation for the DBMS
    that you use.


    # Details


    How to Use the INFILE Statement

    Because the INFILE statement identifies the file to read, it must execute before
    the INPUT statement that reads the data records. You can use the INFILE statement
    in conditional processing, such as an IF-THEN statement, because it is executable.
    The INFILE statement enables you to control the source of the input records.


    Usually, you use an INFILE statement to read data from an external file. When
    data is read from the job stream, you use a DATALINES statement. However, to take
    advantage of certain data-reading options that are available only in the INFILE
    statement, you can use an INFILE statement with the file-specification DATALINES
    and a DATALINES statement in the same DATA step. See "Reading Inline Data Records"
    on page 179 for more information.


    When you use more than one INFILE statement for the same file specification and
    use options in each INFILE statement, the effect is additive. To avoid confusion,
    use the options in the first INFILE statement for a generic file.'
