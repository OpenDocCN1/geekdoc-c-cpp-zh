  md: '# Chapter 2 · Dictionary of SAS Statements


    +   - https://hostname/file

    - http://hostname:portno/file

    - https://hostname:portno/file


    Operating environment: For details about specifying the physical names of external
    files, see the SAS documentation for your operating environment.


    # URL Options


    url-options can be any of the following values:


    **AUTHDOMAIN="auth-domain**"

    specifies the name of an authentication domain metadata object in order to connect
    to the proxy or Web server. The authentication domain references credentials (user
    ID and password) without having to explicitly specify the credentials. The authdomain
    name is sensitive, and it must be enclosed in double quotation marks.


    An administrator creates authentication domain definitions while creating a definition
    with the User Manager in SAS Management Console. The authentication domain is
    associated with one or more login metadata objects that provide access to the
    proxy or Web server and is resolved by the BASE engine calling the SAS Metadata
    Server and returning the authentication credentials.


    **Requirement:** The authentication domain definition must be stored in a metadata
    repository, and the metadata server must be running in order to resolve the metadata
    object specification.


    **Interaction:** If you specify AUTHDOMAIN=, you do not need to specify USER=
    and PASS=


    *See:* For more information about creating and using authentication domains, see
    the discussion on credential management in the SAS Intelligence Platform: Security
    Administration Guide.


    **BLOCKSIZE=blocksize**nwhere blocksize is the size of the URL data buffer in
    bytes.


    **Default:** 8


    **DEBUG**nTip:** The result of the HELP command is returned as records.

    writes debugging information to the SAS log.


    **HEADERS=fileref**

    specifies the fileref to which the header information is written when a file is
    opened using the URL access method. The header information is the same information
    that is written to the SAS log.


    **Requirement:** The fileref must be defined in a previous FILENAME statement.


    **Interactions:**nIf you specify the HEADERS= without specifying the DEBUG option,
    the DEBUG option is automatically turned on.


    By default, log information is overwritten. To append the log information, you
    must specify the MOD option in the FILENAME statement that creates the fileref.


    **LRECL=lrecl**

    where lrecl is the logical record length of the data.


    **Default:** 256


    **Interaction:** Alternatively, you can specify a global logical record length
    using the “LRECL= System Option” in *SAS System Options: Reference*.'
