  md: '# Example 3: Modifying Observations Using a Transaction Data Set


    This adds the quantity of newly received stock to its data set INVTY.STOCK well
    as updating the date on which stock was received. The transaction data set ADDINV
    in the WORK library contains the new data.


    The ADDINV data set is the data set that contains the updated information. ADDINV
    contains these variables:


    +   * PARTNO

    a is character variable that corresponds to the indexed variable PARTNO in INVTY.STOCK.


    +   * NWSTOCK

    a is numeric variable that represents newly received stock for each tool.

    ADDINV is the second data set in the MODIFY statement. SAS uses it as the transaction
    data set and reads each observation from ADDINV sequentially. Because the BY statement
    specifies the common variable PARTNO, MODIFY finds the first occurrence of PARTNO
    in INVTY.STOCK that matches the value of PARTNO in ADDINV. For each observation
    with a matching value, the DATA step changes the value of RECDATE and replaces
    the value of INSTOCK with the sum of INSTOCK and NWSTOCK (from ADDINV). MODIFY
    does not add NWSTOCK to the INVTY.STOCK data set because that would modify the
    data set descriptor. Thus, it is not necessary to put NWSTOCK in a DROP statement.


    This example adds ADDINV as the data set that contains information to modify INVTY.STOCK.
    A BY statement specifies the shared variable whose values locate the observations
    in INVTY.


    This DATA step creates ADDINV:


    ```

    data addinv;

    input PARTNO $ NWSTOCK;

    datalines;

    K892 55

    AJ7 21

    LK43 43

    MN21 73

    BC85 57

    NCF3 90

    KJ66 2

    UYN7 108

    JD03 55

    BV1E 27

    ;

    ```


    This DATA step uses values from ADDINV to update INVTY.STOCK.


    ```

    libname invty ''SAS-library'';

    data invty.stock;

    modify invty.stock addinv;

    by partno;

    RECDATE=today();

    instock=instock+nwstock;

    if iorc_w=0 then replace;

    run;

    proc print data=invty.stock noobs;

    title ''INVTY.STOCK'';

    run;

    ```'
