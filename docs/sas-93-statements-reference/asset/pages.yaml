  md: '# PUT Statement 297


    +   - a PUT statement writes values from more than one observation to the same
    output line.


    Without line-hold specifiers, each PUT statement in a DATA step writes a new output
    line.


    In the PUT statement, trailing @ and double trailing @ produce the same effect.
    Unlike the INPUT statement, the PUT statement does not automatically release a
    line that is held by a trailing @ when the DATA step begins new iteration. SAS
    releases the current output line that is held by a trailing @ or double trailing
    @ when it encounters


    +   - a PUT statement without a trailing @n- a PUT statement that uses _BLANKPAGE_
    or _PAGE_

    - the end of the current line (determined by the current value of the LRECL= or
    LINESIZE= option in the FILE statement, if specified, or the LINESIZE= system
    option)

    - the last iteration of the DATA step.


    Using a trailing @ or double trailing can cause SAS to attempt to write the current
    line length because the pointer value is unchanged when the next PUT statement
    executes. “When the Pointer Goes Past the End of a Line” page 297.


    # Pointer Location after a Value Is Written


    Understanding the location of the output pointer after a value is written is important,
    especially if you choose output styles in a single PUT statement. The pointer
    location after a value depends on which output style you use and whether a character
    string or a variable. With column or formatted output, the pointer is located
    in the first column after the end of the field that is specified in the PUT statement.
    The two styles write only variable values.


    With list output or named output, the pointer is located in the second column
    after a variable value because PUT skips automatically after each value is written.
    However, when a PUT statement uses list output to write a character string, the
    pointer is located in the first column after the string. If you do not use a line
    pointer control or column output after a character string is written, add a blank
    space to the end of the character string to separate it from the next value.


    After an INFILE specification, the pointer is located in the first column after
    the record is written from the current input file.


    When the output pointer is in the upper left corner of a page,


    +   - PUT _BLANKPAGE_ writes a blank page and moves the pointer to the top of
    the next page.

    - PUT _PAGE_ leaves the pointer in the same location.


    You can determine the current location of the pointer by examining the variables
    that are specified with the COLUMN= option or the LINE= option in the FILE statement.


    # When the Pointer Goes Past the End of a Line


    SAS does not write an output line that is longer than the current output line
    length. The line length of the current output file is determined by


    +   - the value of the LINESIZE= option in the current FILE statement

    - the value of the LINESIZE= system option (for the SAS output window)

    - the LRECL= option in the current FILE statement (for external files).'
