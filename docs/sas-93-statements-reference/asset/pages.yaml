- img_proc: true
  md: '# LIBNAME Statement 241


    **Note:** Even if the name occurs multiple times in the concatenation, only the
    first occurrence is shown.


    +   - A SAS file that is logically connected to another file (such as an index
    to a data set) is listed only if the first file resides in that library. For example,
    if library ONE contains A.DATA, and library TWO contains A.DATA and A.INDEX, only
    A.DATA from library ONE is listed. (See the previous)

    - If any library in the concatenation is sequential, then all of the libraries
    are treated as sequential.

    - The attributes of the first library that is specified determine the attributes
    of the concatenation. For example, if the first SAS library is listed is "read
    only", then the entire concatenation is "read only".

    - If you specify any options or engines, they apply only to the libraries that
    you specified with the complete physical name, not to any library that you specified
    with a libref.

    - If you alter a libref after it has been assigned in a concatenation, it will
    not affect the concatenation.


    # Automatically Creating the Library Directory


    You can set the DLCREATEDIR system option to create the directory for the SAS
    library that is specified in the LIBNAME statement if that directory does not
    exist. For more information, see the "DLCREATEDIR System Option" in *SAS Options*:
    Reference.


    # z/OS Specifics


    For information, see the "DLCREATEDIR System Option: z/OS" in *SAS Companion for
    z/OS*.


    # Comparisons


    +   - Use the LIBNAME statement to reference a SAS library. Use the FILENAME statement
    to reference an external file. Use the LIBNAME, SAS/ACCESS statement to access
    DBMS tables.

    - Use the CATNAME statement to concatenate SAS catalogs. The CATNAME statement
    enables you to specify the names of the catalogs you want to concatenate. The
    LIBNAME statement concatenates all like-named catalogs in the specified SAS libraries.


    # Examples


    # **Example 1: Assigning and Using a Libref**


    This example assigns the libref SALES to an aggregate storage location that is
    specified in quotation marks as a physical name. The DATA step creates SALES.QUARTER
    and stores it in that location. The PROC PRINT step references it by its two-level
    name, SALES.QUARTER.


    ```

    libname sales ''SAS-library'';

    data sales.quarter;

    infile ''your-input-file'';

    input salesrep $20. +6 jansels febsales

    marsales;

    run;

    ```'
