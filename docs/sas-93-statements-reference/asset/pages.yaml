    \ |\n\n*Note:* Always specify pointer controls before the variable for which they\
    \ apply.\nSee \"Pointer Location after a Value Is Written\" on page 297 for more\
    \ information about how SAS determines the pointer position.\n\n# Using Line-Hold\
