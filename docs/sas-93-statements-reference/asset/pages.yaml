  md: '# Details


    # When to Use INPUT


    Use the INPUT statement to read raw data from an external file or in-stream data.
    If your data are stored in an external file, you can specify the file in an INFILE
    statement. The INFILE statement must execute before the INPUT statement that reads
    the data records. If your data are in-stream, a DATALINES statement must precede
    the data lines in the job stream. If your data contains semicolons, use a DATALINES4
    statement before the data lines. A DATA step that reads raw data can include multiple
    INPUT statements.


    You can also use the INFILE statement to read in-stream data by specifying a filename
    of DATALINES in the INFILE statement before the INPUT statement. Using DATALINES
    in the INFILE statement enables you to use many of the options available in the
    INFILE statement with in-stream data.


    To read data that are already stored in a SAS set data, use a SET statement. To
    read database or PC file-format data that are created by other software, use the
    SET statement after you access the data with the LIBNAME statement. Use the SAS/ACCESS
    documentation for more information.


    # z/OS Specifics


    LOG files that are generated under z/OS and captured with PROC PRINTTO contain
    an ASA control character in column 1. If you are using the INPUT statement to
    read a LOG file that was generated under z/OS, you must account for this character
    if you use column input or column pointer controls.


    # Input Styles


    # Overview of Input Styles


    There are four ways to describe a record''s values in the INPUT statement:


    +   * column

    * list (simple and modified)

    * formatted

    * named.


    Each variable value is read by using one of these input styles. An INPUT statement
    can contain any or all of the available input styles, depending on the arrangement
    of data values in the input records. However, once name input is used in an INPUT
    statement, you cannot use another input style.


    # Column Input


    With column input, the column numbers follow the variable name in the INPUT statement.
    These numbers indicate where the variable values are found in the input data records:


    ```

    input $ 1-8 age 11-12;

    ```


    This INPUT statement can read the following data records:


    ```

    -----1---------+----2----+

    Peterson 21

    Morgan 17

    ```


    Because NAME is a character variable, a $ appears between the variable name and
    column numbers. For more information, see “Input Statement, Column” on page 208.'
  merge: -1
  pgno: 211
- img_proc: true
  md: '# List Input


    With list input, the variable names are simply listed in the INPUT statement.
    A $ follows the name of each character variable:


    ```

    input name $ age;

    ```


    This INPUT statement can read data values that are separated by blanks or aligned
    in columns (with at least one blank between):


    ```

    ------+1----+-------+2----+

    Personson      21

    Morgan         17

    ```


    For more information, see “INPUT Statement, List” on page 215.


    # Formatted Input


    With formatted input, an informat follows the variable name in the INPUT statement.
    The informat gives you the data type and the field width of an input value. Formats
    also enable you to read data that are stored in nonstandard format, such as packed
    decimal, or numbers that contain special characters as commas:


    ```

    input name =char8.+2 income coma6;

    ```


    This INPUT statement reads these data records correctly:


    ```

    ------+1----+-------+2----+

    Peterson      21,000

    Morgan         17,132

    ```


    The pointer of +2 moves the input pointer to the field that contains the value
    for the variable INCOME. For more information, see “INPUT Statement, Formatted”
    on page 211.


    # Named Input


    With named input, you specify the name of the variable followed by an equal sign.
    SAS looks for a variable name and an equal sign in the input record:


    ```

    input name= $ age;

    ```


    This INPUT statement reads the following data records correctly:


    ```

    ------+1----+-------+2----+

    name=Peterson age=21

    name=Morgan age=17

    ```


    For more information, see “INPUT Statement, Named” on page 222.


    # Multiple Styles in a Single INPUT Statement


    An INPUT statement can contain any or all of the different input styles:


    ```

    input idno $18. team $25-30 startwght endwght;

    ```


    This INPUT statement reads the following data records correctly:


    ```

    ------+1----+-------+2----+3------+

    023 David Shaw      red      189 165

    049 Amelia Serrano  yellow  189 165

    ```


    The value of IDNO, STARTWGHT, and ENDWGHT are read with list input, the value
    of NAME with formatted input, and the value of TEAM with column input.


    Note: Once named input is used in an INPUT statement, you cannot change input
    styles.'
  merge: -1
  pgno: 212
- img_proc: true
  md: '# Pointer Controls


    Overview of Pointers

    As SAS reads values from the input data records into the input buffer, it keeps
    track of its position with a pointer. The INPUT statement provides three ways
    to control the movement of the pointer:


    column pointer controls

    reset the pointer''s column position when the data values in the data records
    are read.


    line pointer controls

    reset the pointer''s line position when the data values in the data records are
    read.


    line-hold specifiers

    hold an input record in the input buffer so that another INPUT statement can process
    it. By default, the INPUT statement releases the previous record and reads another
    record.


    With column and line pointer controls, you can specify an absolute line number
    or column number to move the pointer or you can specify a column or line location
    relative to the current pointer position. The following table lists the pointer
    controls that are available with the INPUT statement.


    Table 2.4 Pointer Controls Available in the INPUT Statement


    | Pointer Controls | Relative | Absolute |

    | - | - | - |

    | column pointer controls | +n | @n |

    | | +numeric-variable | @numeric-variable |

    | | +(expression) | @(expression |

    | | | @''character-string |

    | | | @character-variable |

    | | | @(character-expression |

    | line pointer controls | / | #n |

    | | | #numeric-variable |

    | | | #(expression |

    | line-hold specifiers | @ | (not applicable) |

    | | @@ | (not applicable) |


    Note: Always specify pointer controls before the variable to which they apply.

    You can use the COLUMN= and LINE= options in the INFILE statement to determine
    the pointer''s current column and line location.


    # Using Column and Line Pointer Controls


    Column pointer controls indicate the column in which an input value starts.'
  merge: -1
  pgno: 213
