  md: '# EMAIL


    specifies the EMAIL device type, which provides the access method that enables
    you to send email programmatically from SAS. In order to use SAS to send a message
    to an SMTP server, you must enable SMTP e-mail. For more information, see Chapter
    38, "The SMTP E-Mail Interface," in SAS Language Reference: Concepts.


    ''address'' is the e-mail address to which you want to send the message. You must
    enclose the address in single or double quotation marks. To specify more than
    one address, you must enclose the group of addresses in parentheses, enclose each
    address in single or double quotation marks, and separate each address with either
    a comma or a space. To specify a real name along with an address, enclose the
    address in brackets (< >). Specifying an address as a FILENAME statement is optional
    if you specify the TO- e-mail option or the PUT statement !EM_TO! directive, which
    will override your address specification.


    # E-Mail Options


    You can use any of the following e-options in the FILENAME statement to specify
    attributes for the electronic message. You can also specify these options in the
    FILE statement. E-mail options that you specify in the FILE statement override
    e-mail options that you specified in the FILENAME statement.


    ```

    ATTACH=''filename.ext'' | ATTACH=(''filename.ext'' attach-options)

    ```


    specifies the physical name of the file or files to be attached to the message
    and any name that is recognized by the operating environment. Enclose the physical
    name in quotation marks. To attach more than one file, enclose the group of files
    in parentheses, enclose each file in quotation marks, and separate each with a
    space. Here are examples:


    ```

    attach=''/user/id/opinion.txt''

    attach=''C:\StatusJune2001.txt'' | ''C:\Status\July2001.txt''

    attach=''user.misc.ds (member)''

    ```


    The attachment-options include the following:


    ```

    CONTENT_TYPE=''contenttype''

    ```


    specifies the content type of the attached file. You must enclose the value in
    quotation marks. If you do not specify a content type, SAS tries to determine
    the correct content type based on the filename. For example, if you do not specify
    a content type, a filename of home.html is sent with a content type of text/html.


    ```

    Alias=CT and TYPE=

    ```


    Default: If SAS cannot determine a content type by the extension, the default
    value is text/plain.


    ```

    ENCODING=''encoding-value''

    ```


    specifies the text encoding of the attachment that is read into SAS. You must
    enclose the value in quotation marks.


    See: "Encoding Values in SAS Language Elements" in Chapter 20 of SAS National
    Language Support (NLS): Reference Guide


    ```

    EXTENSION=''extension''

    ```


    specifies a different file extension to be used for the specified attachment.
    You must enclose the value in quotation marks. This extension is used by the recipient''s
    e-mail program for selecting the appropriate utility to use for displaying the
    attachment. For example, the following results in the attachment home.html being
    received as index.htm.'
