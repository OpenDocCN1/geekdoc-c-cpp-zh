    member-type


    the type of SAS file to be opened. Valid value is DATA, which is the default.


    password-option(s)


    specifies one or more of the following password options:


    ```

    READ=password

    ```


    enables the SASFILE statement to open a read-protected file. The *password* must
    be a valid SAS name.


    ```

    WRITE=password

    ```


    enables the SASFILE statement to use the write password to open a file that is
    both read-protected and write-protected. The *password* must be a valid SAS name.


    ```

    ALTER=password

    ```


    enables the SASFILE statement to use the alter password to open a file that is
    both read-protected and alter-protected. The *password* must be a valid SAS name.


    ```

    PW=password

    ```


    enables the SASFILE statement to use the password to open a file that is assigned
    for all levels of protection. The *password* must be a valid SAS name.


    **Tip:** When SASFILE is executed, SAS checks whether the file is read-protected.
    Therefore, if the file is read-protected, you must include the READ=password in
    the SASFILE statement. If the file is write-protected or alter-protected, you
    can use a WRITE=, ALTER=, or PW=. However, the file is opened only in input (read
    mode), you must specify the necessary password or passwords. See "Example 2: Specifying
    Passwords with the SASFILE Statement" on page 341.


    # OPEN


    opens the file, allocates the buffers, but defers reading the data into memory
    until a procedure, statement, or application is executed.


    # LOAD


    opens the file, allocates the buffers, and reads the data into memory.


    **Note:** If the total number of allowed buffers is less than the number of buffers
    required for the file based on the number of data set pages and index file pages,
