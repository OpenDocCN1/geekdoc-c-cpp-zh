    # LABEL Statement


    Assigns descriptive labels to variables.


    Valid in: DATA step

    Category: Information

    Type: Declarative


    # Syntax


    ```

    LABEL variable-1=label-1...<variable-n=label-n>;

    LABEL variable-i=''...''variable-n=''''>

    ```


    # Arguments


    variable

    specifies the variable that you want to label.


    > Tip: You can specify additional pairs of labels and variables.


    label

    specifies a label of up to 256 characters, including blanks.


    Restrictions:

    If the label includes a semicolon (;) or an equal sign (=), you must enclose the
    label in either single or double quotation marks.

    If the label includes single quotation marks (''), then you must enclose the label
    in double quotation marks.


    Tips:

    You can specify additional pairs of labels and variables.

    For more information about including quotation marks as part of the label, see
    “Character Constants” in Chapter 6 of SAS Language Reference: Concepts.


    removes a label from a variable. Enclose a single blank space in quotation marks
    to remove an existing label.


    # Details


    Using a LABEL statement in a DATA step permanently associates labels with variables
    by affecting the descriptor information of the SAS data set that contains the
    variables. You can associate any number of variables with labels in a single LABEL
    statement.


    You can use a LABEL statement in a PROC step, but the rules are different. See
    the Base SAS Procedures Guide for more information.'
