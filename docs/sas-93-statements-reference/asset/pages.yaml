  md: 'INPUT Statement, Column 209

    Valid in: DATA step

    Category: File-handling

    Type: Executable


    # Syntax


    ```

    INPUT variable <$ start-column < end-column

    <decimals> <@ | @>;

    ```


    # Arguments


    variable

    specifies a variable that is assigned input values.


    $

    indicates that the variable has character values rather than numeric values.

    Tip: If the variable is previously defined as character, $ is not required.


    start-column

    specifies the first column of the input record that contains the value to read.


    -end-column

    specifies the last column of the input record that contains the value to read.

    Tip: If the variable occupies only one column, omit end-column.

    Example: Because end-column is omitted, for the character variable

    GENDER occupy only column 16:

    input name $ 1-10 pulse 11-13 waist 14-15 gender $ 16;


    .decimals

    specifies the number of digits to the right of the decimal if the input value
    does not

    contain an explicit decimal point.

    Tip: An explicit decimal point in the input value overrides a decimal specification
    in

    the INPUT statement.

    Example: "Example 2: Read Input Data Using Decimals" on page 211


    @

    holds the input record for the execution of the next INPUT statement within the
    same

    iteration of the DATA step. This line-hold specifier is called trailing @.

    Restriction: The trailing @ must be the last item in the INPUT statement.

    Tip: The trailing @ prevents the next INPUT statement from automatically releasing

    the current input record and reading the next record into the input buffer. It
    is

    useful when you need to read from a record multiple times.

    See: "Pointers Controls" on page 200


    @@

    holds the input record for the execution of the next INPUT statement across

    iterations of the DATA step. This line-hold specifier is called double trailing
    @.

    Restriction: The double trailing @ must be the last item in the INPUT statement.

    Tip: The double trailing @ is useful when each input line contains values for
    several

    observations.

    See: "Using Line-Hold Specifiers" on page 201'
