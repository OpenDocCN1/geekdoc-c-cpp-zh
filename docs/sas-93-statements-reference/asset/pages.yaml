    # FILENAME Statement, CATALOG Access Method


    Enables you to reference a SAS catalog as an external file.


    **Valid in:** Anywhere


    **Category:** Data Access


    # Syntax


    ```

    FILENAME fileref CATALOG ''catalog'' <catalog-options>;

    ```


    # Arguments


    **fileref**

    is a valid fileref.


    # CATALOG


    specifies the access method that enables you to reference a SAS catalog as an
    external file. You can then use any SAS commands, statements, or procedures that
    can access external files to access a SAS catalog.


    **Alias:** LIBRARY


    # **Tips:**


    This method makes it possible for you to invoke an autocall macro directly from
    a SAS catalog.

    With this method, you can read any type of catalog entry, but you can write only
    to entries of type LOG, OUTPUT, SOURCE, and CATAMS.

    If you want to enter an entry catalog (instead of a single entry), you must specify
    its two-level name in the catalog parameter.


    ''catalog''

    is a valid two-, three-, or four-part SAS catalog name, where the parts represent
    library.catalog.entry.entry.

    **Default:** The default entry type is CATAMS.

    **Restriction:** The CATAMS entry type is used only by the CATALOG access method.
    The CPORT and CIMPORT procedures do not support this entry method.


    # Catalog Options


    catalog-options can be any of the following:


    LRECL=Irecl

    where Irecl is the maximum record length for the data in bytes.'
