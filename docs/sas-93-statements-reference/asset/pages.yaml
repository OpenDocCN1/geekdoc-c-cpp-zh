  md: '# 244 Chapter 2 · Dictionary of SAS Statements


    FMTLIB-libref.format-catalog

    specifies where the formats are stored when a JMP data table is read and where

    formats come from a JMP data table is created.


    **Requirement:** The library that is available in the FMTLIB argment must be a
    SAS

    d set LIBNAME statement.


    **Example:**


    ```

    libname inv jmp ''.* fmtlib=seform.formats;

    libname seform ''./'';

    data work.mine;

    set inv.suri2011;


    run;

    ```


    # Details


    AMP file is a file format that the JMP software program creates. JMP is an interactive

    statistics package that is available for Microsoft Windows and Macintosh. For
    more

    information, the JMP documentation that is packaged with your system.


    A JMP file contains data that is organized in a tabular format of fields and records.
    Each

    field can contain one type of data, and each record can hold one data value for
    each field.


    Base SAS supports access to JMP files. You can access JMP files by either of these
    two

    methods:


    +   - the IMPORT and EXPORT procedures and the Import and Export Wizard without
    a

    license for SAS/ACCESS Interface to PC Files


    For more information, SAS/ACCESS Interface to PC Files: Reference.


    +   - the LIBNAME statement for the JMP engine


    # Examples


    **Example 1: Using the LIBNAME Statement to Read a JMP Data Table**


    This example reads and prints five observations from the bank JMP data table.


    ```

    libname b ''c:/temp/national/'';

    proc contents data=bank(drop=edlevel age);

    run;

    proc print data=bank(obs=5 drop=edlevel age);

    run;

    ```


    **Example 2: Reading and Sorting a JMP Data Table**


    This example reads a JMP data table, sorts it, and stores it in a SAS data set.
    The formats

    stored on the JMP data set are put in a.formats.


    ```

    libname b ''c:/temp/field/'';

    libname b jmp ''.'' fmtlib=a.formats;

    ```


    ```

    proc sort data=b.cars out=a.sorted;

    by category_ic;

    run;

    ```'
