    \ (drop=IDnumber);\nset sample;\n  .more SAS statements.\n```\n\nrun;\n\n# When\
    \ Not Creating a Data Set (Form 2)\n\nUsually, the DATA statement specifies at\
    \ least one data set that SAS uses to create\nan output data set. However, when\
    \ the purpose of a DATA step is to write a report or\nwrite data to an external\
    \ file, you might not want to create an output data set. Using the\nkeyword _NULL\
