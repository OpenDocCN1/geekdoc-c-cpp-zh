    # Example 11: Specifying an Encoding When Reading an External File


    This creates a SAS data set from an external file. The external file''s encoding
    is in UTF-8, and the current SAS session encoding is Latin1. By default, SAS assumes
    that the external file is in the same encoding as the session encoding, which
    causes the character data to be written to the new SAS data set incorrectly.


    To tell SAS what encoding to use when reading the external file, specify the ENCODING=
    option. When you tell SAS that the external file is in UTF-8, SAS then transcodes
    the external file from UTF-8 to the current session encoding when writing to the
    new SAS data set. Therefore, the data is written to the new data set correctly
    in Latin1.


    ```

    libname myfiles ''SAS-library'';

    filename extfile ''external-file'';

    data myfiles.unicode;

    infile extfile encoding="utf-8";

    input Make Model $ Year;

    run;

    ```


