- img_proc: true
  md: 'Using the LIBNAME statement requires host-specific information. See the SAS
    documentation for your operating environment before using this statement.


    # Disassociating a Libref from a SAS Library (Form 2)


    To disassociate a libref from a SAS library, use a LIBNAME statement by specifying
    the libref and the CLEAR option. You can clear a single libref or all current
    librefs.


    ```

    LIBNAME libref | _ALL, CLEAR;

    ```


    # Writing SAS Library Attributes to the SAS Log (Form 3)


    Use a LIBNAME statement to write the attributes of one or more SAS libraries to
    the SAS log. Specify libref to list the attributes of one SAS library; use _ALL
    to list the attributes of all SAS libraries that have been assigned librefs in
    your SAS session.


    ```

    LIBNAME libref LIST | _ALL, LIST;

    ```


    # Concatenating SAS Libraries (Form 4)


    When you logically concatenate two or more SAS libraries, you can reference all
    with one libref. You can specify a library with its physical filename or its previously
    assigned name.


    ```

    LIBNAME libref<engine> (library-specification-1 <...library-specification-n) <options>;

    ```


    In the same LIBNAME statement, you can use any combination of specifications:
    librefs, physical filenames, or a combination of librefs and physical filenames.
    See "Example 2: Logically Concatenating SAS Libraries" on page 242.


    # Concatenating SAS Catalogs (Form 4)


    When you logically concatenate two or more SAS libraries, you also concatenate
    the SAS catalogs that have the same name. For example, if three SAS libraries
    each contain a catalog named CATALOGI; when you concatenate them, you create a
    catalog concatenation for the catalogs that have the same name. See "Example 3:
    Concatenating SAS Catalogs" on page 242.


    ```

    LIBNAME libref<engine> (library-specification-1 <...library-specification-n) <options>;

    ```


    # Rules for Library Concatenation


    After you create a library concatenation, you can specify the libref in the context
    that accepts a simple (non-concatenated) libref. These rules determine how SAS
    files (that is, members of SAS libraries) are located among the concatenated libraries:


    +   * When a SAS file is opened for input or update, the concatenated libraries
    are searched and the first occurrence of the specified file is used.

    * When a SAS file is opened for output, it is created in the first library that
    is listed in the concatenation.

    * Note: A new SAS file is created in the first library even if there is a file
    with the same name in another part of the concatenation.

    * When you delete or rename a SAS file, only the first occurrence of the file
    is affected.

    * Anytime a list of SAS files is displayed, only one occurrence of a filename
    is shown.'
  merge: -1
