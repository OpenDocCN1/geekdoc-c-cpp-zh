    @n

    moves the pointer to column n.


    **Range:** a positive integer


    **Tip:** If n is not an integer, SAS truncates the decimal value and uses only
    the integer value. If n is zero or negative, the pointer moves to column 1.


    **Example:** "Example 7: @15 moves the pointer to column 15:"


    ```

    input @15 $10;

    ```


