    # DO Statement, Iterative


    Executes statements between the DO and END statements repetitively, based on the
    value of an index variable.


    +   - Valid in: DATA step

    - Category: Control

    - Type: Executable


    # Syntax


    ```

    DO index-variable=specification-1 <, ...specification-n>;

    ...more SAS statements...

    ```


    ```

    END;

    ```


    # Arguments


    Index-variable

    names variable whose value governs execution of the DO group.


    > Tip: Unless you specify to drop it, the index variable is included in the data
    set that is being created.


    > CAUTION: Avoid changing the index variable within the DO group. If you modify
    the index variable within the iterative DO group, you might cause infinite looping.


    specification

    denotes an expression or a series of expressions in this form


    ```

    <TO stop> <BY increment> <WHILE(expression) | UNTIL(expression)>

    ```


    The DO group is executed first with index-variable equal to start. The value of
    start is evaluated before the first execution of the loop.


    start

    specifies the initial value of the index variable.


    When it is used without TO stop or BY increment, the value of start can be a series
    of items presented in this form:


    ```

    item-1 <, ...item-n>;

    ```


    The items can be either numeric or character constants, or they can be variables.
    Enclose character in quotation marks. The DO group is executed once for each value
    in the list. If a WHILE condition is added, it applies only to the item that it
    immediately follows.


    Requirement: When it is used with TO stop or BY increment, start must be a number
    or an expression that yields a number.


    Example: “Example 1: Using Various Forms of the Iterative DO Statement” on page
    67


    TO stop

    specifies the ending value of the index variable.'
  merge: -1
  pgno: 78
- img_proc: true
  md: 'When both start and stop are present, execution continues (based on the value
    of increment) until the value of index-variable passes the value of stop. When
    only start and increment are present, execution continues (based on the value
    of increment) until a statement directs execution out of the loop, or until UNTIL
    expression is specified in the DO statement is satisfied. If neither stop increment
    is specified, the group executes according to the value of start. The value of
    stop is evaluated before the first execution of the loop.


    **Requirement:** Stop must be a number or an expression that yields a number.


    **Tip:** Any changes to stop made within the DO group do not affect the number
    of iterations. Stop iteration of a loop before it finishes processing, change
    the value of index-variable so that it passes the value of stop, or use a LEAVE
    statement to go to a statement outside the loop.


    **Example:** "Example 1: Using Various Forms of the Iterative DO Statement" on
    page 67


    # BY increment


    specifies a positive or negative number (or an expression that yields a number)
    to control the increment of index-variable.


    The value of increment is evaluated before the execution of the loop. Any changes
    to the increment that are made within the DO group do not affect the number of
    iterations. If no increment is specified, the index variable is increased by 1.
    When increment is positive, start must be the lower bound and stop, if present,
    must be the upper bound for the loop. If increment is negative, start must be
    the upper bound and stop, if present, must be the lower bound for the loop


    **Example:** "Example 1: Using Various Forms of the Iterative DO Statement" on
    page 67


    # WHILE(expression) | UNTIL(expression)


    evaluates, either before or after execution of the DO group, as SAS expression
    you specify. Enclose the expression in parentheses.


    A WHILE is evaluated before each execution of the loop, so that the statements
    inside the group are executed repetitively while the expression is true. An UNTIL
    statement is evaluated after each execution of the loop, so that the statements
    inside the group are executed repetitively until the expression is true.


    **Restriction:** A WHILE or UNTIL specification affects only the last item in
    the clause where it is located


    **See:** "WHILE Statement" on page 70 and "DO Statement" on page 68


    **Example:** "Example 1: Using Various Forms of the Iterative DO Statement" on
    page 67


    **Requirement:** The iterative DO statement requires at least one specification
    argument.


    **Tips:** The order of the optional TO and BY can be reversed.


    When you use more than one specification, each one is evaluated before its execution.


    # Comparisons


    There are three other forms of the DO statement:


    +   The DO statement, the simplest form of DO-group processing, designates a group
    of statements to be executed as a unit, as part of IF-THEN/ELSE statements.'
