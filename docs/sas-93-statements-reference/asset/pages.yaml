  md: 'MERGE Statement 261


    CAUTION:

    Care when you combine data sets with a one-to-one merge. One-to-one merges can
    sometimes produce undesirable results. Test your program on representative samples
    of the data sets before you use this method.


    # Match-Merging


    Match-merging combines observations from two or more SAS data sets into a single
    observation in a new data set according to the values of a common variable. The
    number of observations in the new data set is the sum of the largest number of
    observations in each BY group in all sets. To perform a match-merge, use a BY
    statement immediately after the MERGE statement. The variables in the BY statement
    must accompany each merge to all data sets. The data sets that are in the MERGE
    statement must be sorted in order of the values of the variables that are listed
    in the BY statement, or must have an appropriate index. See Example 2 for an example
    of a match-merge. For more information, see Chapter 21, "Reading, Combining, and
    Modifying SAS Data Sets," SAS Language Reference.


    Note: The MERGE statement does not produce a Cartesian product on a many-to-many
    merge. Instead it performs a one-to-one merge while there are observations in
    the BY group in at least one data set. When all observations in the BY group have
    been read from one data set and there are still more observations in another data
    set, SAS performs a one-to-many merge until all observations have been read for
    the BY group.


    # Comparisons


    +   * MERGE combines observations from two or more SAS data sets. UPDATE combines
    observations from exactly two SAS data sets. UPDATE changes or updates the values
    of selected observations in a master data set as well as. UPDATE might also add
    observations.

    * Like UPDATE, MODIFY combines observations from two data sets by changing or
    updating values of selected observations in a master data set.

    * The results that are obtained by reading observations using two or more SET
    statements are similar to the results that are obtained by using the MERGE statement
    with no BY statement. However, with the SET statements, SAS stops processing before
    all observations are read from all data sets if the number of observations is
    not equal. In contrast, SAS continues processing all observations in all data
    sets named in the MERGE statement.


    # Examples


    Example 1: One-to-One Merging

    This example shows how to combine observations from two data sets into a single
    observation in a new data set:


    ```

    data benefits.qtrl;

    merge benefits.jan benefits.feb;

    run;

    ```'
