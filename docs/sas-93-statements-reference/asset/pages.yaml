- img_proc: true
  md: '# Without Arguments


    The PUT statement without arguments is called a null PUT statement. The null PUT
    statement


    +   - writes the current output line to the current location, even if the current
    output line is blank

    - releases an output line that is being held with a trailing @ by a previous PUT
    statement.


    For an example, see “Example 5: Holding and Releasing Output Lines” on page 303.
    For more information, see “Using Line-Hold Specifiers” on page 296.


    # Arguments


    specification(s)


    specifies what is written, how it is written, and where it is written. The specification
    can include


    variable


    specifies the variable whose value is written.


    > Note: Beginning with Version 7, you can specify column-mapped Output Delivery
    System variables in the PUT statement. This functionality is described briefly
    here in ODS on page 290. It is documented completely in the “PUT Statement for
    ODS” in SAS Output Delivery System: User’s Guide.


    (variable-list)


    +   - specifies a list of variables whose values are written.

    - Requirement: the (format-list) must follow the (variable-list).

    - See: “PUT Statement, Formatted” on page 308


    ''character-string''


    specifies a string of text, enclosed in quotation marks, to write.


    Tips:


    See: “List Output” on page 294


    Example: This statement writes HELLO when the hexadecimal string is converted
    to ASCII characters:


    ```

    put ''6856C0C626F'';

    ```


    n*


    +   - specifies to repeat n times the subsequent character string.

    - Example: This statement writes a line of 132 underscores.

    - put 132 ''_'';

    - Example: “Example 4: Underlining Text on page 302


    pointer-control


    moves the output pointer to a specified line or column in the output buffer.


    See:


    +   - “Column Pointer Controls ” on page 291

    - “Line Pointer Controls” on page 292'
