  md: '# 130 Chapter 2 • Dictionary of SAS Statements


    To display files without leading periods, for example .Authority, use the LS-option.


    **Tip:** To return a listing of a subset of files, use the LSFILE option in addition
    to LSA.


    # LSFILE=''character-string''


    in combination with the LS option, specifies a character string that enables you
    to request a listing of a subset of files from the working directory. Enclose
    the character string in quotation marks.


    **Restriction:** LSFILE can be used only if LS or LSA is specified.


    **Tip:** You can specify a wildcard as part of ''character-string''.


    **Example:** This statement lists all of the files that start with sales and end
    with sas:

    ```bash

    filename myfile sftp '''' lsfile=''sales.sas'' other-sftp-options;

    ```


    # MGET


    transfers multiple files, similar to the SFTP MGET.


    **Tip:** The whole file is transferred as one file. However, as the transfer of
    each new file is started, the EOV= variable is set to 1.


    # NEW


    specifies that you want SFTP to create the directory when you use the DIR option.


    **Restriction:** The NEW option is not available under z/OS.


    **Tip:** The NEW option will be ignored if the directory exists.


    # OPTIONS=


    specifies SFTP configuration options such as port numbers.


    # PATH


    specifies the location of the SFTP executable if it is not installed in the PATH
    or $PATH search path.


    **Tip:** It is recommended the OpenSSH ''SFTP'' executable or PUTTY ''PSFTP''
    executable be installed in a directory that is accessible via the PATH or SPARSE
    path.


    # RECF=recfm


    where recfm is one of two record formats:


    +   F

    fixed-record format. Thus, all records are of size LRECL with no line delimiters.


    +   V

    is variable-record format (the default). In this format, records have varying
    lengths, and they are separated by newlines. Data is transferred in image (binary)
    mode.


    Default: V


    # USER=''username''


    specifies the username.


    **Requirement:** The username is required by the PUTTY client on the Windows host.


    **Tips:**


    +   The username is not typically required on LINUX or UNIX hosts when using public
    key authentication.


    +   Public key authentication using an SSH agent is the recommended way to connect
    to a remote SSHD server.'
