    **See:** "Formatted Input" on page 199 and "List Input"


    **Example:** "Example 2: Using Informat Lists" on page 215


    (informat-list)

    specifies a list of informats to read the values for the preceding list of variables.


    **Restriction:** The (informat-list) must follow the (variable-list).


    **See:** "How to Group Variables and Informats" on page 213


    @

    holds an input for the execution of the next INPUT statement within the same iteration
    of the DATA step. This line-hold specifier is called *trailing*.


    **Restriction:** The trailing @ must be the last item in the INPUT statement.


    **Tip:** The trailing @ prevents the next INPUT statement from automatically releasing
    the current input record and reading the next record into the input buffer. It
    is useful when you need to read from a record multiple times.


    **See:** "Using Line-Hold Specifiers" on page 201


    **Example:** "Example 3: Holding a Record in the Input Buffer" on page 205


    @@@

    holds the input record for the execution of the next INPUT statement across iterations
    of the DATA step. This line-hold specifier is called *double trailing*.


    **Restriction:** The double trailing @ must be the last item in the INPUT statement.


    **Tip:** The double trailing @ is useful when each input line contains values
    for several observations, or when a record needs to be reread on the next iteration
    of the DATA step.


    **See:** "Line-Hold Specifiers" on page 201


    **Example:** "Example 4: Holding a Record across Iterations of the DATA Step"
    on page 206


