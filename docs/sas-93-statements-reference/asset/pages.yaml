  md: "# INPUT Statement, Named 223\n\nTip: An explicit decimal point in the input\
    \ point value overrules a decimal specification\nat the INPUT statement.\n\n@\
    \ holds an input record for the execution of the next INPUT statement within the\
    \ same\niteration of the DATA step. The trailing line-hold specifier is called\
    \ trailing @\n\nRestriction: The trailing @ must be the last item in the INPUT\
    \ statement.\n\nTip: The trailing @ prevents the next INPUT statement from automatically\
    \ releasing\nthe current input record and reading the next record into the input\
    \ buffer. It is\nuseful when you need to read from a record multiple times.\n\n\
    See: \"Using Line-Hold Specifiers\" on page 201\n\n@ holds an input record for\
    \ the execution of the next INPUT statement across iterations\nof the DATA step.\
    \ This line-hold specifier is called double trailing @\n\nRestriction: The double\
    \ trailing @ must be the last item in the INPUT statement.\n\nTip: The double\
    \ trailing @ is useful when each input line contains values for several\nobservations.\n\
    \nSee: \"Using Line-Hold Specifiers\" on page 201\n\n# Details\n\n# When to Use\
    \ Named Input\n\nNamed input reads data records that contain a variable name followed\
    \ by an\nequal sign and a value for the variable. The INPUT statement reads the\
    \ data record\nat the current location of the input pointer. If the input data\
    \ records contain data values\nat the start of the record the INPUT statement\
    \ cannot read with named input, use\nanother input style to read them. However,\
    \ once the INPUT statement starts to read\named input, SAS expects that all the\
    \ remaining values are in this form. See \"Example\\n3: Using Named Input with\
    \ Another Input Style\" on page 224.\n\nYou do not have to specify the variables\
    \ in the INPUT statement in the order that\nthey occur in the data records. Also,\
    \ if you do not specify a variable for each field\nanother statement uses (for\
    \ example, ATTRIBUTE:FORMAT,INFORMAT, LENGTH\nstatement) and it occurs in the\
    \ input data record, the INPUT statement automatically\nreads the value. SAS writes\
    \ a note to the log that value is uninitialized.\n\nWhen you do not specify a\
    \ variable for all the named input data values, SAS sets\n_ERROR_ to 1 and writes\
    \ a note to the log. Here is an example.\n\n```\ndata list;\n  input name=$age;\n\
    \  datalines;\nname=age=34 gender=M\n```\n\nThe note that SAS writes to the log\
    \ states that GENDER is not defined and _ERROR_is\nset to 1.\n\n# Restrictions\n\
    \n+   - After you start to read with named input, you cannot switch to another\
    \ input style or\nuse pointer controls. All the remaining values in the input\
    \ data record must be in the\nform variable=value. SAS treats the values that\
    \ are not in named input form as\ninvalid data."
