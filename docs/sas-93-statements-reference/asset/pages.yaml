    # Example 7: Truncating Copied Records


    The LENGTH= option is useful when you copy the input file to another file with
    the PUT_INFILE statement. Use LENGTH= to truncate the copied records. For example,
    these statements truncate the last 20 columns from each input data record before
    the record is written to the output file:


    ```

    data_null_

    infile file-specification-1 length=a;

    input

    a-20;

    file file-specification-2;

    put _infile_;

    run;

    ```


    The START= option is also useful when you want to truncate what the PUT_INFILE
    statement copies. For example, if you do not want to copy the first 10 columns
    of each record, these statements copy from column 11 to the end of each record
    in the input buffer:


    ```

    data_null_

    infile file-specification-1 start=s;

    input;

    s=11;

    file file-specification-2;

    put _infile_;

    run;

    ```


