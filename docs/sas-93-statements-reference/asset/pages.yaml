    # Details


    When you access a WebDAV server to update a file, the file is pulled from the
    WebDAV server to your local disk storage for processing. When processing is complete,
    the file is pushed back to the WebDAV server for storage. The file is removed
    from the local disk storage when it is pushed back.


    The Secure Sockets Layer (SSL) protocol is used when the URL begins with “https”
    instead of “http”. The SSL provides network security and privacy. Developed by
    Netscape Communications, SSL uses encryption algorithms that include RC2, RC4,
    DES, tripleDES, and IDEA. Not limited to only encryption services, SSL can also
    provide client and server authentication and message authentication codes. SSL
    is supported by both Netscape Navigator and Internet Explorer. Many Websites use
    the protocol to provide confidential user information such as credit card numbers.
    The SSL protocol is application independent, which enables protocols such as HTTP,
    FTP, and Telnet to be transparently above it. SSL is optimized for HTTP.


    WebDAV servers have defined levels of permissions at both the directory and file
