- img_proc: true
  md: '# FORMAT Statement


    Tip: Formats that are associated with variables by using a FORMAT statement behave
    like formats that are used with a colon modifier in a subsequent PUT statement.
    For details about using a colon modifier, see “PUT Statement, List” on page 311.


    See: SAS Formats and Informs: Reference


    # DEFAULT=default-format


    specifies a temporary default format for displaying the values of variables that
    are not listed in the FORMAT statement. These default formats apply only to the
    current DATA step; they are not permanently associated with variables in the output
    data set.


    A DEFAULT= format specification applies to


    +   * variables that are not named in a FORMAT or ATTRIB statement

    * variables that are not permanently associated with a format within a SAS data
    set

    * variables that are not written with the explicit use of a format.


    **Default:** If you omit DEFAULT=, SAS uses BESTw, as the default numeric format
    and Sw as the character format.


    **Restriction:** Use this option only in a DATA step.


    **Tip:** A DEFAULT= specification can occur anywhere in a FORMAT statement. It
    can specify either a numeric default, a character default, or both.


    **Example:** “Example 1: Assigning Formats and Defaults” on page 151


    # Details


    The FORMAT statement can use standard SAS formats or user-written formats that
    have been previously defined in PROC FORMAT. A single FORMAT statement can associate
    the same format with several variables, or it can associate different formats
    with different variables. If a variable appears in multiple FORMAT statements,
    SAS uses the format that is assigned.


    You use a FORMAT statement in the DATA step to permanently associate a format
    with a variable. SAS changes the descriptor information of the SAS data set that
    contains the variable. You can use a FORMAT statement in some PROC steps, but
    the rules are different. For more information, see *Base SAS Procedures Guide*.


    # Comparisons


    Both ATTRIB and FORMAT statements can associate formats with variables, and both
    statements can change the format that is associated with a variable. You can use
    the FORMAT statement in PROC DATASETS to change or remove the format that is associated
    with a variable. You can also associate, change, or disassociate formats and variables
    in existing SAS data sets through the windowing environment.


    # Examples


    # Example 1: Assigning Formats and Defaults


    This example uses a FORMAT statement to assign formats and default formats for
    numeric and character variables. The default formats are not associated with variables
    in the data set but affect how the PUT statement writes the variables in the current
    DATA step.


    ```

    data tstfmt;

    format W $char3;

    ```'
