    on page 353


    # OPEN=(IMMEDIATE | DEFER)


    enables you to delay the opening of any concatenated data sets until they are
    ready to be processed.


    # IMMEDIATE


    during the compilation phase, opens all data sets that are listed in the SET statement.


    Restriction: When you use the IMMEDIATE option KEY=, POINT= and BY statement processing
    are mutually exclusive.


    Tip: If a variable on a subsequent data set is of a different type (character
    versus numeric), from the type of the first data set, the DATA step will stop
    processing and produce an error message.


    # DEFER


    opens the first data set and opens subsequent data sets during the execution phase.
    When the DATA step reads and processes all observations in a data set, it closes
    the data set and opens the next data set in the list.


    Restriction: When you specify the DEFER option, you cannot use the KEY= statement
    option, the POINT= statement option, or the BY statement. These constructs imply
    either random processing or interleaving of observations from the data sets, which
    is not possible unless all data sets are open.'
