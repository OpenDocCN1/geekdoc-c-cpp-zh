    # Details


    # General Information


    The LOCK statement enables you to acquire and release an exclusive lock on an
    existing SAS file. Once an exclusive lock is obtained, no other SAS session can
    read or write to the file until the lock is released.


    To release an exclusive lock, use the CLEAR option. In addition, an exclusive
    lock on a data set is released when you use the DATASETS procedure DELETE statement
    to delete the data set.'
