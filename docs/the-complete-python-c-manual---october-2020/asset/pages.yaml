- pgno: 13
  md: '# How to Set Up Python in Windows


    Windows users can easily install the latest version of Python via the main Python
    Downloads page. Whilst most seasoned Python developers may shun Windows as the
    platform of building their code, it''s an ideal starting point for beginners.


    # INSTALLING PYTHON 3.X


    Microsoft Windows doesn''t come with Python preinstalled as standard, so you''re
    going to have to install it manually. Frankly, it''s an easy process to:


    +   **STEP 1** Start by opening your web browser to www.python.org/downloads/.
    Look for the button download link for Python 3.x (in our case it is Python 3.6.2
    but as you may see later versions of 3).


    +   **STEP 3** Choosing the Customise option allows you to specify certain parameters,
    and whilst you may stay with the defaults, a good habit to adopt as sometimes
    (with Python, thankfully) installers can include unwanted features. On the Next
    screen, ensure all boxes are ticked and click the Next button.


    ![](img/0b5e7d59f3578d974082f03180129000_13_0.png)


    +   **STEP 2** Click the download button for version 3.x, and save the file to
    your Downloads Folder. When the file is downloaded, click the executable and the
    installation wizard will launch. From here you have two choices: Install Now or
    Customise. We recommend using the Customise Installation line.


    +   **STEP 4** The next pages of installation include some interesting features
    with Python. Ensure the Associate with Python, Create Shortcuts, Add to Environment
    Variables, Precompile Standard Library and for All Users options. These are made
