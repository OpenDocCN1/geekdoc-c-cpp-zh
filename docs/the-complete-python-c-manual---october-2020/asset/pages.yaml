  md: "# If... Else Statement\n\nThere is a much better way to use an if statement\
    \ in your code, with if... else. else works much the same way as a standard if\
    \ statement. If the Boolean expression is true, the code in the braces is executed.\
    \ The code within the next set of braces is used instead.\n\n# IF, ELSE NO\n\n\
    There are two sections of code that can be executed depending on the outcome in\
    \ an if... else statement. it's easy to envisage once you get used to its structure.\n\
    \n+   * STEP 1 Begin with a C++ file and the standard headers:\n\n```\n```cpp\n\
    #include <iostream>\nusing namespace std;\n\nint main () {\n```\n    ```cpp\n\
    \    int num = 30;\n    if (num < 30) {\n        cout << \"The number is less\
    \ than 30!\" << endl;\n    } else {\n        cout << \"The number is greater than\
    \ 30!\" << endl;\n    }\n    return 0;\n```\n```\n\n+   * STEP 3 The first line\
    \ in the code creates the integer called num and gives it a value of 1. If the\
    \ if statement checks if the value of num is less than thirty and if it outputs\
    \ \"The number is less than 30\" to the console:\n\n```\n```cpp\nif (num < 30)\
    \ {\n    cout << \"The number is less than 30!\" << endl;\n}\n```\n```\n\n+  \
    \ * STEP 2 Let's expand the code from the If Statement on the previous page:\n\
    \n```\n```cpp\nint num = 1;\nif (num < 30) {\n    cout << \"The number is less\
    \ than 30!\" << endl;\n} else {\n    cout << \"The number is greater than 30!\"\
    \ << endl;\n}\nreturn 0;\n```\n```\n\n+   * STEP 4 The else companion to checks\
    \ if the number is greater than 30 and if so, then displays \"The number is greater\
    \ than 30\" to the console; and finally, the code is terminated satisfactorily.\n\
    \n```\n```cpp\nif (num < 30) {\n    cout << \"The number is less than 30!\" <<\
    \ endl;\n} else {\n    cout << \"The number is greater than 30!\" << endl;\n}\n\
    ```\n```\n\n+   * STEP 5 You can change the value of num in the code you can improve\
    \ the code by asking the user to enter a value:\n\n```\n```cpp\nint num;\ncout\
    \ << \"Enter a number: \";\ncin >> num;\nif (num < 30) {\n    cout << \"The number\
    \ is less than 30!\" << endl;\n} else {\n    cout << \"The number is greater than\
    \ 30!\" << endl;\n}\nreturn 0;\n```\n```\n\n![](img/0b5e7d59f3578d974082f03180129000_133_0.png)"
