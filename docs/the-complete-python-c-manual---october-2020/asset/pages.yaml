  md: '# STEP 6


    Interestingly, you can use a function within the random module to shuffle the
    items in the list, thus adding a little randomness into the equation:


    ```

    random.shuffle(list)

    print(list)

    ```


    This way, you can keep shuffling the list before displaying a random item from
    it.


    # STEP 9


    Let''s use an example of code that flips a virtual coin ten times it will land
    thousand times and counts how heads or tails:


    ```

    import random

    output={"Heads":0, "Tails":0}

    coin=list(output.keys())

    for i in range(10000):

    output[random.choice(coin)]+=1

    print("Heads:", output["Heads\], "Tails:")

    print("Tails:", output["Tails"])

    ```


    ![](img/0b5e7d59f3578d974082f03180129000_72_0.png)


    ![](img/0b5e7d59f3578d974082f03180129000_72_1.png)


    # STEP 7


    Using shuffle, you can create an entirely random list of numbers. From a given
    range:


    ```

    import random

    list=[i for i in range(20)]

    random.shuffle(list)

    print(list)

    ```


    Keep shuffling the list and you can choose different selection of items from 0
    to twenty each.


    # STEP 10


    Here''s an interesting piece of code. Using a text file containing 4666 words,
    you can generate user requested number of words from the text file find: https://github.com/dwyl/english-words


    import random


    ![](img/0b5e7d59f3578d974082f03180129000_72_2.png)


    ![](img/0b5e7d59f3578d974082f03180129000_72_3.png)


    # STEP 8


    You can select a random number from a given range in steps, using the start, stop,
    step loop:


    import random


    ```

    for i in range(10):

    print(random.randrange(0, 200, 7))

    ```


    Results will give you an idea of how it works.


    ![](img/0b5e7d59f3578d974082f03180129000_72_4.png)


    ![](img/0b5e7d59f3578d974082f03180129000_72_5.png)


    ![](img/0b5e7d59f3578d974082f03180129000_72_6.png)'
