  md: '# Splitting and Joining Strings


    When dealing with data in Python, especially from a user''s input, you will undoubtedly
    come across long sets of strings. A useful skill to learn in Python programming
    is being able to split those long strings for better readability.


    # STRING THEORIES


    You''ve already looked at some list functions, using .insert,.remove, and .pop
    but there are also functions that can be applied to strings.


    ![](img/0b5e7d59f3578d974082f03180129000_51_0.png)


    STEP 1 The main tool in the string function arsenal is .split(). Based on the
    argument it will split a string of data. For example, here''s a string with three
    items, separated by a space:


    STEP 3 Note that the text.split part has the brackets, quotes, and brackets. The
    space is the separator, indicating that each list entry is separated by a space.
    Likewise, CSV (Comma Separated Value) contains commas, so you''d use: text="January,February,March,April,June".split(",'')


    ```

    text="Daniel Hannah Emma"

    >>> Python 3.2 defaults. Oct 19 2014, 13:31:11

    [SEC 4.9]1 type="credits" or "license" for more information.

    >>> name=text.split(" ")

    [''Daniel'', ''Hannah'', ''Emma'']

    ```


    ![](img/0b5e7d59f3578d974082f03180129000_51_1.png)


    STEP 2 Let''s turn the string into a list and split the content accurately. Then
    enter the name of the list, to see the three items.


    STEP 4 You''ve previously seen how you can split a string into individual lists,
    using a name: name=list("David") The returned value is [''D'', ''a'', ''v'', ''i'',
    ''d'']. It may seem useless under ordinary circumstances, it could be handy for
    creating a spelling game for example.


    ```

    name=list("David")

    >>> Python 3.2 defaults. Oct 19 2014, 13:31:11

    [SEC 4.9]1 type="credits" or "license" for more information.

    >>> name=text.split("")

    [''D'', ''a'', ''v'', ''i'', ''d'']

    ```


    ![](img/0b5e7d59f3578d974082f03180129000_51_2.png)'
