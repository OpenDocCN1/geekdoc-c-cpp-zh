  md: "# Structure of a C++ Program\n\n# COMMENTS\n\nLines that have a double slash\
    \ are comments. This means they won't be executed in the code and are ignored\
    \ by the compiler. Comments are designed to help you, or another programmer looking\
    \ at your code, explain what's going on. There are two types of comment: // covers\
    \ multiple lines, // as that begin with a double slash comments. This means they\
    \ won't be ignored by the compiler.\n\n<< The chevrons used here are Instion operators.\
    \ This means that whatever follows the chevrons is to be inserted into the std::cout\
    \ statement. In this case they're 'Hello, world', which are to be displayed on\
    \ the screen when you compile and execute the code.\n\n```\n// hell.cpp\n#include\
    \ <iostream>\n\nint main() {\n    // My first C++ program\n    cout << \"Hello,\
    \ world!\\n\";\n    return 0;\n}\n```\n\nComments are designed to help you, or\
    \ another programmer at your code, explain what's going on. There are two types\
    \ of comment: // covers multiple lines, // a single line.\n\n```\n// hello_world.cpp\n\
    #include <iostream>\n\nint main() {\n    const int some_fun_ref_x = 1;\n    const\
    \ int some_fun_ref_y = 2;\n    const int some_fun_ref_z = 3;\n    const int some_fun_ref_w\
    \ = 4;\n    const int some_fun_ref_v = 5;\n    std::cout << \"Hello, world!\\\
    n\";\n    std::cout << backward(812);\n    return 0;\n}\n```\n\n![](img/0b5e7d59f3578d974082f03180129000_100_0.png)\n\
    \n# STD\n\nstd stands for Standard. It's part of the Standard Namespace in C++,\
    \ which covers a number of different statements and commands. You can leave the\
    \ std:: part of the code but it must be declared at the start using namespace\
    \ std; not both. For example:\n\n# OUTPUTS\n\nLeading on, the \"Hello, world!\
    \ is what we want to appear on the screen when the code is executed. You can enter\
    \ whatever you like, as long as it's inside the cout statement. The brackets aren't\
    \ needed but comes insist on them. The \\n indicates a new line is to inserted.\n\
    \n```\n// hello_world.cpp\n#include <iostream>\nusing namespace std;\n\nint main()\
    \ {\n    cout << \"Hello, world!\\n\";\n    return 0;\n}\n```\n\n```\n// My first\
    \ C++ program\ncout << \"Hello, world!\\n\"\n```\n\n# COUT\n\nIn this example\
    \ we're using cout, which is a part of a Standard Namespace, why there's, as you're\
    \ asking C++ to use it from that particular namespace. cout stands Character Output,\
    \ which displays or prints, something to the screen. If we use std:: we have to\
    \ declare it at the start of the code, as mentioned previously.\n\n# ; AND)\n\n\
    Finally you can see that lines within a function code block (except comments)\
    \ end with a semicolon. This marks the end of the statement and all statements\
    \ in C++ must have one at the end or the compiler fails to build the code. The\
    \ very last line has the brace to indicate the end of the main function.\n\n```\n\
    // hello_world.cpp\n#include <iostream>\nusing namespace std;\n\nint main() {\n\
    \    // My first C++ program\n    cout << \"Hello, world!\\n\";n    return 0;\n\
    }\n```\n\n```\n// hello_world.cpp\n#include <iostream>\nusing namespace std;\n\
    \nint main() {\n    // My first C++ program\n    cout << \"Hello, world!\\n\"\
    ;n    return 0;\n}\n```\n\nwww.bdmpublications.com 101"
