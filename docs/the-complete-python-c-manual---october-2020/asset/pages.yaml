  md: "# If Statement\n\nThe decision making statement 'if' is probably one of the\
    \ most used statements in any programming language, regardless of whether it is\
    \ C++, Python, BASIC or anything else. It represents a junction in the code, where\
    \ IF one condition is true, do that this; or IF it's false, do that.\n\nIF uses\
    \ a Boolean expression within its statement. If the Boolean Expression is true,\
    \ the code within the statement is executed. If not, then the code after the statement\
    \ is executed.\n\n+   STEP 1 First, create a new C++ file and enter the standard\
    \ headers, as usual:\n\n```\n#include <iostream>\nusing namespace std;\nint main()\
    \ \n{\n    int num = 1;\n    if (num < 30) {\n        cout << \"The number is\
    \ less than 30.\" << endl;\n    }\n    cout << \"Value of number is: \" << num\
    \ << endl;\n    return 0;\n}\n```\n\n+   STEP 2 If is best explained when you\
    \ use a number-based condition:\n\n```\nint num = 1;\nif (num < 30) {\n    cout\
    \ << \"The number is less than 30.\" << endl;\n}\ncout << \"Value of number is:\
    \ \" << num << endl;\nreturn 0;\n```\n\n+   STEP 3 What's going on here? To begin\n\
    \n```\n#include <iostream>\nusing namespace std;\nint main() {\n    int num =\
    \ 31; // Change the value of num\n    if (num < 30) // IF value of num is less\n\
    {\n}\n```\n\n+   STEP 4 The second cout statement displays the value of num and\
    \ the program terminates safely. It is easy to see how the statement works if\
    \ you were to change the initial input from num 1\n\n![](img/0b5e7d59f3578d974082f03180129000_131_0.png)"
