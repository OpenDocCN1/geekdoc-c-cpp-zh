  md: "# Dictionaries\n\nLists are extremely useful but dictionaries in Python are\
    \ by far the better way of dealing with data items. They can be tricky to get\
    \ to grips with at first but you'll soon be able to apply them to your own code.\n\
    \n# KEY PAIRS\n\nA dictionary is like a list but instead each item comes as a\
    \ pair, these are known as Key and Value. The Key part must be unique and can\
    \ be a number or string whereas the Value can be any data item like.\n\n+   STEP\
    \ 1 Let's say you want to create a dictionary in Python.\nYou would create the\
    \ dictionary name and enter the data in curly brackets, separating the key and\
    \ value by a colon\nKey:Value. For example:\n\n```\nphonebook={'Emma\": 1234,\
    \ \"Daniel\": 3456, \"Hannah\": 6789}\n```\n\n```\nPython 3.4.2 Shelln>>> phonebook['Emma']\n\
