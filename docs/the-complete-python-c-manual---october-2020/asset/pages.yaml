- pgno: 40
  md: "# STEP 5\n\nPress F5 and save the code to execute it. A four-letter word in\
    \ the Shell to begin with, you should have the returned message that it's the\
    \ word four letters. Now press F5 again and rerun the program this time a five-letter\
    \ word. The Shell will display that it's not a four-letter word.\n\n# STEP 6\n\
    \nNow expand the code to include other conditions. Eventually, it could become\
    \ quite complex. We've added a condition for three-letter words:\n\n```\nword=input(\"\
    Please enter a four-letter word: \")\nif len(word) == 4:\n    print(\"is a four-letter\
    \ word. Well done.\")\\elif len(word) == 3:\n    print(\"is a three-letter word.\
    \ Try again.\")\nelse:\n    print(\"is not a four-letter word.\")\n```\n\n![](img/0b5e7d59f3578d974082f03180129000_40_0.png)\n\
    \n![](img/0b5e7d59f3578d974082f03180129000_40_1.png)\n\n# LOOPS\n\nA loop looks\
    \ similar to a condition but they are somewhat different in their operation. A\
    \ loop will run through the same block of code number of times, with the support\
    \ of a condition.\n\n# STEP 1\n\nLet's start with a simple While statement. Like\
    \ IF, this will check if something is TRUE, then it will indent the code:\n\n\
    ```\nx = 0\nwhile x < 10:\n    print(x)\n    x = x + 1\n```\n\n# STEP 3\n\nFor\
    \ loop is another example. For is used to loop over a range of data, usually a\
    \ listed as variables inside square brackets. For example:\n\n```\nwords[\"Cat\"\
    , \"Dog\", \"Unicorn\"]\nfor word in words:\n    print(word)\n```\n\n![](img/0b5e7d59f3578d974082f03180129000_40_2.png)\n\
    \n![](img/0b5e7d59f3578d974082f03180129000_40_3.png)\n\n# STEP 2\n\nThe difference\
    \ between if and the indented code, it goes back to end and checks the statement\
    \ is still true. In example x is less than 10. With loop it prints the current\
    \ value of x, then adds one to value. When x equals 10 it stops.\n\n# STEP 4\n\
    \nFor loop can also be used in the countdown example using the range function:\n\
    \n```\nfor x in range(1, 10):\n    print(x)\n```\n\nThe x++1 is not here because\
    \ the range function creates a list between the first and last numbers used.\n\
    \n![](img/0b5e7d59f3578d974082f03180129000_40_4.png)\n\n![](img/0b5e7d59f3578d974082f03180129000_40_5.png)"
