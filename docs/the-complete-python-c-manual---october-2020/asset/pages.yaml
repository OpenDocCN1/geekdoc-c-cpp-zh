    \ the commands used below work just fine and for this example we're using Linux\
    \ Mint.\n\n+   **STEP 1** The first step is to ensure Linux is ready for your\
    \ C++, check the system and software are up to date. Open a terminal and type\
    \ `sudo apt-get-update && sudo apt-get upgrade`. Press Return and enter your password.\
    \ These commands update the entire system and any installed software.\n\n+   **STEP\
    \ 3** Amazingly, that's it. Everything is already for to start coding. Here's\
    \ how to get your first C++ program and running. In Linux the main text editor\
