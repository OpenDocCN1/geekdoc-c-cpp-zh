- pgno: 41
  md: '# # Python Modules


    We''ve mentioned modules previously, (the Math module) as modules as are such
    a large part of getting the most from Python, however it''s worth dedicating a
    little more time to them. In this instance we''re using the Windows version of
    Python 3.


    # ## MASTERING MODULES


    Think of modules as an extension that''s imported into your Python code to enhance
    and extend its capabilities. There are countless modules available as we''ve seen,
    you can even make your own.


    +   **STEP 1** Although good, the built-in functions within Python are limited.
    The use of modules, however, allows us to make more sophisticated programs. As
    you are aware, Python scripts that are imported, such import math


    +   **STEP 3** The result is an error in the IDLE Shell, as the module isn''t
    recognised or installed in Python. To install a module we can use pip (Pip Installed
    Packages). Close down the IDLE Shell and drop into a command or Terminal session.
    At an elevated admin prompt, enter:

    pip install pygame


    ```

    pip install pygame

    ```


    +   **STEP 2** Some modules, especially on the Raspberry Pi are included by default,
    the math module being a prime example. Thus, others aren''t always available.
    A good example on non-Pi platforms is the pygame module, which contains many functions
    to help create games. Try: **import pygame***


    +   **STEP 4** The PIP installation requires an elevated status due to installing
    components at different locations. Windows users can search for CMD via the Start
    button and right-click the then to Run as Administrator. Linux and Mac users can
    use sudo, with sudo install package.


    ```

    C:\Users\david>pip install pygame

