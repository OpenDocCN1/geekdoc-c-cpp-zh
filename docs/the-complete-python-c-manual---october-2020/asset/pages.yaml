    \ COLONS\n\nIt's common for beginners to forget adding a colon to the end of a\
    \ structural statement, as:\n\n```\nclass Hangman:\ndef guess(self, letter):\n\
    ```\n\nAnd so on. The colon separates the code, and the indices to which the code\
    \ belongs to.\n\n```\ndef guess(self, word):\n    if letter in word and letter\
    \ not in self.missed_letters:\n        self.missed_letters.append(letter)\n  \
