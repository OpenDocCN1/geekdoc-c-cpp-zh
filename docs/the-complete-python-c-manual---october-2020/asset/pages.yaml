- pgno: 47
  md: '# # Tuples


    Tuples are very much identical to lists. However, where lists can be updated,
    deleted or changed in some way, a tuple remains a constant. This is called immutable
    and they''re perfect for storing fixed data items.


    # ## THE IMMUTABLE TUPLE


    Reasons for having tuples depending on what the program is intended to do. Normally,
    a tuple is reserved for something special but they''re also used for example,
    in an adventure game, where non-playing character names are stored.


    +   1. A tuple is created the same way as a list but then you use curved brackets
    instead of square brackets. For example:


    ```

    months=("January", "February", "March", "April",

    "May", "June")

    ```


    ![](img/0b5e7d59f3578d974082f03180129000_47_0.png)


    STEP 3 You can create grouped tuples into lists that contain multiple sets of
    data. For instance, here is a tuple called NPC (Non-Playable Characters) containing
    the character name and their combat for an adventure game:


    ```

    NPC=("Conan", 100), ("Belit", 80), ("Valeria", 95))

    ```


    +   STEP 2 Just as lists, the items within a named tuple can be indexed by their
    position in the data range, i:


    ```

    months[0]

    months[5]

    ```


    However, any attempt at deleting or adding to the tuple will result in an error
    in the Shell.


    ![](img/0b5e7d59f3578d974082f03180129000_47_1.png)


    STEP 4 Each of these data items can be accessed as a whole by enclosing NPC into
    the Shell; or they can be indexed by their position NPC[0]. You can also index
    the individuals within the NPC list:


    ```

    NPC[0]

    Will display 100.

    ```


    ![](img/0b5e7d59f3578d974082f03180129000_47_2.png)'
  merge: -1
  img_proc: true
