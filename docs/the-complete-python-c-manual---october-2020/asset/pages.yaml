  md: "# # Common Coding Mistakes\n\nWhen you start something new you're inevitably\
    \ going to make mistakes, this is purely down to inxperience and those mistakes\
    \ are great teachers in themselves. However, even experts make the occasional\
    \ mishap. Thing is, to learn from them as best as you can.\n\n# ## X=MISTAKE,\
    \ PRINT Y\n\nThere are many pitfalls for the programmer to be aware of, far too\
    \ many to be listed here. Being able to recognise a mistake and fix it is when\
    \ you are start to move into more advanced territory.\n\n# ## SMALL CHUNKS\n\n\
    It would be wonderful to be able to work like Neo from The Matrix movies. Simply\
    \ ask, your operator loads it into your memory and you instantly know everything\
    \ about the subject. Sadly the major pitfall is someone trying to learn too much,\
    \ too quickly. So taking coding in small pieces and take your time.\n\n# ## //Comments\n\
    \nUse comments. it's a simple concept but commenting on code saves so many problems\
    \ when you come next to look over. Inserting comments helps you quickly sift through\
    \ the code that are causing problems, also if you need to review an older piece\
    \ of code.\n\n```\n52 orig = jj;\n53 target = j2;\n54 \n55 \n56 #endif\n57 if\
    \ (n == 0)\n58 return;\n59 \n60\n```\n\nLoop unrolling. Here be dangerous.\n\n\
    ```\n64 (n - (-3)) is the greatest multiple of 4\n65 In the while loop, orig will\
    \ move over\n66 increment (n += 4) element of break\n67 end marks our barrier\
    \ for not falling out\n68 char const _end = orig + 2 (n & 4)\n```\n\n```\n70 See\
    \ if we're aligned for writing\n71 #if (orig % end == 0)\n72 //defined(! amd4)\
    \ / defined =\n```\n\n# ## EASY VARIABLES\n\nMeaningful naming for variables is\
