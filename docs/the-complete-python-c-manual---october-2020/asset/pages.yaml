- pgno: 9
  md: "# Equipment You Will Need\n\nYou can learn Python with very little hardware\
    \ or initial financial investment. You don't need an incredibly powerful computer\
    \ and any software that's required is freely available.\n\n# WHAT WE'RE USING\n\
    \nThankfully, Python is a multi-platform programming language available for Windows,\
    \ macOS, Linux, Raspberry Pi and more. If you have one of those systems, then\
    \ you can easily start using Python.\n\n![](img/0b5e7d59f3578d974082f03180129000_9_0.png)\n\
    \n+   COMPUTER\nObviously you're going to need a computer in order to learn how\
    \ to program in Python and to test your code. You can use Windows (from XP onward)\
    \ on either a 32 or 64-bit processor, an Apple Mac or Linux installed.\n\n+  \
    \ AN IDE\nAn IDE (Integrated Developer Environment) is used to enter and execute\
    \ Python code. It enables you to inspect your program code and the values within\
    \ the code, as well as offering advanced features. There are many different IDEs\
    \ available, so find the one that works for you and gives the best results.\n\n\
    +   PYTHON SOFTWARE\nmacOS and Linux already come with Python preinstalled as\
    \ part of the operating system, as does the Raspberry Pi. However, you need to\
    \ ensure that you're running the latest version of Python. Windows users need\
    \ to download and install Python, which we'll cover shortly.\n\n![](img/0b5e7d59f3578d974082f03180129000_9_1.png)\n\
    \n```\npython\n# This is my first Python program\n# It prints 'Hello, World!'\n\
    print('Hello, World!')\n\n# This is a function that greets a person\ndef greet(name):\n\
    \    \"\"\"\n    Takes a name as argument and returns a greeting\n    \"\"\"\n\
    \    return f\"Hello, {name}!\"\n\n# Call the function\nprint(greet('Alice'))\n\
    ```\n\n+   TEXT EDITOR\nWhile an IDE is an ideal environment to enter code into,\
    \ it's not an absolute necessity. You can enter and edit code directly from the\
    \ IDE but also a text editor, such as Sublime Text or Notepad++, offers more advanced\
    \ Features and colour coding when entering code.\n\n+   INTERNET ACCESS\nPython\
    \ is an ever evolving language and as new versions often introduce new concepts\
    \ or change existing code structure to make it a more efficient language. Having\
    \ access to the Internet will keep you up-to-date, help you when you get stuck\
    \ and access to Python's immense number of modules.\n\n+   TIME AND PATIENCE\n\
    While other books may lead you to become a programmer in 24 hours, Learning to\
    \ code in Python takes time, and patience. You may become stuck at times and other\
    \ times the code will flow like water. Understand you're learning something entirely\
    \ new, and eventually you will get there.\n\n![](img/0b5e7d59f3578d974082f03180129000_9_2.png)"
