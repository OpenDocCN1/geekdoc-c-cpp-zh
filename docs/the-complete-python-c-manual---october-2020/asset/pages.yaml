  md: "# STEP 5\n\nYou can define other elements as a constant. For example, instead\
    \ of using \\n for a newline in the cout statement, you define it at the start\
    \ of the code:\n\n```\n#include <iostream>\nusing namespace std;\n#define LENGTH\
    \ 50\n#define WIDTH 40\n#define HEIGHT 60\n#define NEWLINE \"\\n\"\nint main()\
    \ {\n    cout << \"Length is: \" << LENGTH << NEWLINE;\n    cout << \"Width is:\
    \ \" << WIDTH << NEWLINE;\n    cout << \"Height is: \" << HEIGHT << NEWLINE;\n\
    }\n```\n\nAnother method of defining a constant is with the const keyword. Use\
    \ const with a data type, const type variable = value. Using Pi as an example:\n\
    \n```\n#include <iostream>\nusing namespace std;\nint main() {\n    const double\
    \ PI = 3.14159;\n    cout << \"The value of Pi is: \" << PI << endl;\n}\n```\n\
    \n# STEP 6\n\nThe code when built and executed, does exactly the same as before,\
    \ using the new NEWLINE statement to insert a newline in the cout statement. Incrementally,\
    \ creating a new newline statement isn't a good idea unless you're making it \\\
    n or even the end command:\n\n```\n#include <iostream>\nusing namespace std;\n\
    #define LENGTH 50\n#define WIDTH 40\n#define HEIGHT 60\n#define NEWLINE \"\\n\"\
    \nint main() {\n    for(int i=0; i<LENGTH; i++) {\n        cout << \"-\";\n  \
    \  }\n    cout << NEWLINE;\n}\n```\n\n# STEP 9\n\nBecause you are using within\
    \ the main block of code, you need to insert the line with a semicolon. You can\
    \ use either, as long as the names and values don't clash, but defining takes\
    \ no memory, so if you're using a coding set of memory, defining it is best.\n\
    \n```\nconst double PI = 3.14159;\ncout << \"The value of Pi is: \" << PI << endl;\n\
    ```\n\n# STEP 7\n\nDefining a constant is a great way of initializing values at\
    \ the start of your code. You can define it without having to call the C++ library:\n\
    \n```\n#include <iostream>\nusing namespace std;\n#define PI 3.14159\nint main()\
    \ {\n    cout << \"The value of Pi is: \" << PI << endl;\n}\n```\n\n# STEP 10\n\
    \nConst works in the same way as #define.\nYou can create static integers and\
    \ newlines:\n\n```\nconst int LENGTH = 50;\nconst int WIDTH = 40;\nconst char\
    \ NEWLINE = \"\\n\";\nint area = LENGTH * WIDTH;\ncout << \"Area is: \" << area\
    \ << endl;\n```"
