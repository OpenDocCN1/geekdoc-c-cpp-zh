  md: "# # While Loop\n\n**STEP 6** It's important not to add a semicolon at the end\
    \ of a while statement. Well, yes the semicolon represents the end of a C++ line\
    \ of code. If you place one at the end of a while statement, your loop will be\
    \ permanently stuck until you close the program.\n\n```\n#include <iostream>\n\
