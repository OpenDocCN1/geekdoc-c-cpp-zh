  md: "# # Else Statement\n\nSTEP 6 The code works the same way, as you would expect,\n\
    but what if you wanted to display something if the\nuser entered the number 30?\
    \ Try:\n\n```\n{\n  int num;\n  cout << \"Enter a number: \";\n  cin >> num;\n\
    \  if (num < 30) {\n    cout << \"The number is less than 30!\" << endl;\n  }\
    \ else if (num > 30) {\n    cout << \"The number is greater than 30!\" << endl;\n\
    \  } else if (num == 30) {\n    cout << \"The number is exactly 30!\" << endl;\n\
    \  }\n  return 0;\n}\n```\n\nSTEP 8 You can take this up and create a two-player\n\
    gessing game. By creating the variables:\n\n```\nint num, guess, tries = 0;\n\
    cout << \"**** Two-player number guessing game ****\" << endl;\ncout << \" <<\\\
    nPlayer Two, enter a number for\nPlayer Two to guess: \" << endl;\ncin >> num;\n\
    cout << string(50, '\\n');\\n\n```\n\nSTEP 9 If you use string(50, '\\n') line\
    \ clears the screen so\nPlayer Two doesn't see the entered number. Now\ncan create\
    \ a do... while loop, together with else:\n\n```\ndo {\n  cout << \"\\nPlayer\
    \ Two, enter your guess: \";\n  cin >> guess;\n  tries++;\n  if (guess > num)\
    \ {\n    cout << \"\\nToo High!\\\" << endl;\n  } else if (guess < num) {\n  \
    \  cout << \"\\nToo Low!\\\" << endl;\n  } else {\n    cout << \"\\nWell done!\
    \ You got it in \" << tries << \" tries!\" << endl;\n  }\n} while (guess != num);\n\
    return 0;\n```\n\n```\n#include <iostream>\n#include <string>\nusing namespace\
    \ std;\nint main() {\n  int num;\n  cout << \"Enter a number: \";\n  cin >> num;\n\
    \  if (num < 30) {\n    cout << \"The number is less than 30!\" << endl;\n  }\
    \ else if (num > 30) {\n    cout << \"The number is greater than 30!\" << endl;\n\
    \  } else {\n    cout << \"The number is exactly 30!\" << endl;\n  }\n  return\
    \ 0;\n}\n// else main.cpp\n```\n\nSTEP 7 The new addition to the code is what's\
    \ known as a\nnested if... else statement. In this case, if the user enters a\
    \ number\nthan 30, or 30 otherwise a different output is present\nped to them.\n\
    \nEnter a number: 30\nThe number is exactly 30\nProcessed on (0x0) execution time\
    \ : 4.037 s\nPress any key to continue.\n\n![](img/0b5e7d59f3578d974082f03180129000_134_0.png)\n\
    \nSTEP 10 Grab a second player, then\nand run the code. Player One enters the\n\
    number to be guessed, then\nPlayer Two can guess as many times as they need\n\
