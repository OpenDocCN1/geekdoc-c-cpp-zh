    \ chart available, for those times when you need to insert a code.\n\n| ESCAPE\
    \ SEQUENCE CODE | CHARACTER |\n|---|---|\n| \\ | Backslash |\n| \\' | Single Quote\
    \ |\n| \\\" | Double Quote (Speech Marks) |\n| \\? | Question Mark |\n| \\a |\
    \ Alert/Alarm |\n| \\b | Backspace |\n| \\f | Form Feed |\n| \\n | New Line |\n\
    | \\r | Carriage Return |\n| \\t | Horizontal Tab |\n| \\v | Vertical Tab |\n\
    | \\o | Null Character |\n| \\uxxxx | Unicode (UTF-8) |\n| \\uXXXXXXXX | Unicode\
    \ (UTF-16) |\n\n# UNICODE CHARACTERS (UTF-8)\n\nUnicode characters are symbols\
    \ or characters that are standard across all platforms. For example, the copyright\
    \ symbol, that can be entered via the keyboard by entering the Unicode code, followed\
    \ by ALT+X. In the case of the copyright symbol enter: 00A9 Alt+X. In C++ code,\
    \ you would\n\n```\n#include <iostream>\nusing namespace std;\nint main () {\n\
    \    cout << \"\\u00A9\";\n}\n```\n\n# UNICODE\nCHARACTER TABLE\n\nA complete\
    \ list of the available Unicode characters can be found at **www.unicode-table.com/en/**.\
