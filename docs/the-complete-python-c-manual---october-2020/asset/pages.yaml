  md: "# Using Modules\n\n# # Create Your Own Modules\n\nLarge programs can be much\
    \ easier to manage if you break them up into smaller parts and import the parts\
    \ you need as modules. Learning to build your own modules makes it easier to understand\
    \ how they work.\n\n# ## BUILDING MODULES\n\nModules are Python Files, containing\
    \ code, that you save as a .py extension. These are then imported into Python\
