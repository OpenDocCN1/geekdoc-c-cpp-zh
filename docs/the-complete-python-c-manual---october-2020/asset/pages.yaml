- pgno: 63
  md: "# # Python Graphics\n\n# ## GOING GRAPHICAL\n\nYou can draw simple graphics,\
    \ lines, squares and so on, or you can use one of the many Python modules available,\
    \ to bring out spectacular effects.\n\n+   - **STEP 1** One of the best graphical\
    \ modules to begin learning Python is Turtle. The Turtle module is, as the name\
    \ suggests, based on the turtle used in many schools, that can be programmed to\
    \ draw something on a large piece of paper. The Turtle module can be imported\
    \ with: `import turtle`\n\n+   - **STEP 3** The command turtle.circle(50) is what\
    \ draws the circle on the screen, with 50 being the size. You can play around\
    \ the sizes if you like, going up to 100, 150 and beyond; you can draw an arc\
    \ by entering: `turtle.circle(50, 180)`, where the size is 50, but you're telling\
    \ Python to only draw 180° of the circle.\n\n![](img/0b5e7d59f3578d974082f03180129000_63_0.png)\n\
    \n+   - **STEP 2** Let's begin by drawing a simple circle. Start a New file, then\
    \ enter the following code:\nimport turtle\nturtle.circle(50)\nturtle.getscreen().root.mainloop()\n\
    \n+   - **STEP 4** The last part of the circle code tells Python to keep the window\
    \ where the drawing is taking place to remain open, so the user can close it.\
    \ Now, let's make a square:\nimport turtle\nprint(\"Drawing a square...\")\n t\
    \ in range(4):\n    turtle.forward(100)\n    turtle.left(90)\nturtle.getscreen().root.mainloop()\n\
    \nAs usual press F5 to save the code and execute it. A new window will open up\
    \ and the 'Turtle' will draw a circle.\n\nYou can see that we've inserted a loop\
    \ to draw the sides of the square.\n\n![](img/0b5e7d59f3578d974082f03180129000_63_1.png)"
  merge: -1
