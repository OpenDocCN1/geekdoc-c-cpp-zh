    \ and turtle_end_fill() to fill in the square with colours: red outline, yellow\
    \ in this case.\n\n![](img/0b5e7d59f3578d974082f03180129000_64_0.png)\n\n# STEP\
    \ 8\n\nNow let's get the code by importing the pygame module:\n\n```\nimport pygame\n\
    pygame.init()\nimg = pygame.image.load(\"RPI.png\")\nwhite = (255, 255, 255)\n\
    w = 900\nh = 450\nscreen = pygame.display.set_mode((w, h))\nscreen.fill(white)\n\
    screen.blit(img,(0,0))\npygame.display.flip()\n```\n\n```\nwhile True:\n for event\
    \ in pygame.event.get():\n if event.type == pygame.QUIT:\n  pygame.quit()\n```\n\
    \n# STEP 6\n\nYou can see that the Turtle can draw some pretty shapes and become\
