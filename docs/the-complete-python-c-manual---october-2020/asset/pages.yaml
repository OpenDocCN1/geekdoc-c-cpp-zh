  md: "# # For Loop\n\nIn some respects, a for loop works in a very similar way to\
    \ that of a while loop, although it's structure is different. A for loop is split\
    \ into three stages: an initialiser, a condition and an incremental step. Once\
    \ set up, the loop repeats itself until the condition becomes false.\n\n# ## LOOP\
    \ LOOPS\n\nThe initial stage of a for loop is executed only once and sets the\
    \ point reference for the loop. The condition is evaluated by the loop to see\
    \ if it's true or false and then the increment. The loop repeats the second and\
    \ third stage.\n\n+   1. Create a new C++ file, with the standard headers:\n\n\
    ```\n#include <iostream>\nusing namespace std;\n\nint main() {\n\n}\n```\n\n+\
    \   2. After the loop, you created a compound statement in braces (curly brackets),\
    \ that displays the current value of the integer number. Every time the for repeats\
    \ itself, the second and third stages of the loop, it adds the condition <30 is\
    \ false. The loop ends and the code continues, ending nearly with return 0.\n\n\
    ```\n// For Loop Begins\nfor (int num = 1; num < 30; num = num + 1) {\n\tcout\
    \ << \"Number: \" << num << endl;\n\nreturn 0;\n}\n```\n\n+   3. Start simple\
    \ and create a for loop that counts from 1 to 30, displaying the value to the\
    \ screen with:\n\n```\n// For Loop Begins\nfor(int num = 1; num < 30; num = num\
    \ + 1) {\n\tcout << \"Number: \" << num << endl;\n\nreturn 0;\n}\n```\n\nWorking\
    \ through the process of the for loop, by creating an integer num and assigning\
    \ it a value of 1. Next, set the condition, in this case num being less than 30.\
    \ The last stage is where you create the increments; here's the value of number\
    \ being assigned by:\n\n```\n// For Loop Begins\nfor(int num = 1; num < 30; num\
    \ = num + 1)\n```\n\nA for loop is quite a neat package in C++, all contained\
    \ within its brackets, while the other elements of the loop are displayed below.\
    \ If you want to create a 10-second countdown, you could use:\n\n```\n#include\
    \ <iostream>\n#include <windows.h>\nusing namespace std;\n\nint main() {\n\n//\
    \ For Loop Begins\nfor (int a = 10; a != 0; a = a - 1) {\n\tcout << a << endl;\n\
    \tsleep(1000);\n}\n\tcout << \"\\nBlast Off!\" << endl;\nreturn 0;\n}\n```"
