  md: '# Say Hello to C++


    # # Other C++ IDEs to Install


    If you want to try a different approach to working with your C++ code, then there
    are plenty of options available to you. Windows is the most prolific platform
    for C++ IDEs but there are plenty for Mac and Linux users.


    # DEVELOPING C++


    Here are great C++ IDEs that are worth looking into. You can install one or all
    of them if you like, but find the one that works best for you.


    **ECLIPSE** Eclipse is a hugely popular C++ IDE that offers the programmer a wealth
    of features. It has a clean, interface, is easy to use and available for Windows,
    Linux and Mac. Head over to [www.eclipse.org/downloads/] to download the latest
    version. If you''re stuck, click the Help link for more information.


    **CODELITE** CodeLite is a free and open source IDE''s regularly updated and available
    for Windows, Linux and macOS. It''s lightweight, uncomplicated and extremely powerful.
    You can find out more information as well as how to download and install it at
    [www.codelite.org/]


    ![](img/0b5e7d59f3578d974082f03180129000_93_0.png)


    **GNAT** The GNAT Programming Studio is a powerful and intuitive IDE that supports
    testing, debugging and code analysis. The Community Edition is free, whereas Pro
    version cost; the Community Edition is available for Windows, Mac, Linux and the
    Raspberry Pi. You can find it at [www.adacore.com/download].


    **NETBEANS** Another popular choice is NetBeans. This is another excellent IDE
    that''s packed with features and a pleasure to use. NetBeans IDE includes project
    support for C++ that give you the ability to build applications with dynamic and
    static libraries. Find out more at [www.netbeans.org/features/cpp-index.html].


