  md: "# Pygame Module\n\nWe've had a brief look at the Pygame module already but\
    \ there's a lot more to it that needs exploring. Pygame was developed to help\
    \ Python programmers create either graphical or text-based games.\n\n# PYGAMING\n\
    \nPygame isn't an inherent module to Python but those the Raspberry Pi will already\
    \ have it installed. Everyone else will need to use: pip install pygame from the\
    \ command prompt.\n\n+   - STEP 1 Naturally you need to load the Pygame modules\
    \ into memory before you're able to utilise them. Once that's done Pygame requires\
    \ the user to utilise it prior to any of the functions being used:\n\n```\nimport\
    \ pygame\npygame.init()\n```\n\n![](img/0b5e7d59f3578d974082f03180129000_75_0.png)\n\
    \n+   - STEP 3 Sadly you can't close the newly created Pygame window without closing\
    \ the Python IDLE Shell which isn't very practical. For this reason, you need\
    \ to work in the editor (New -> File) and create a True/False while loop:\n\n\
    ```\nimport pygame\nfrom pygame.locals import *\npygame.init()\n\ngamewindow-pygame.display.set_mode((800,600))\n\
    pygame.display.set_caption(\"Adventure Game\")\n```\n\n```\nrunning=True\nwhile\
    \ running:\n    for event in pygame.event.get():\n        if event.type==QUIT:\n\
    \            running=False\npygame.quit()\n```\n\n+   - STEP 2 Let's create a\
    \ simple game window, and give it a title:\n\n```\ngamewindow-pygame.display.set_mode((800,600))\n\
    pygame.display.set_caption(\"Adventure Game\")\n```\n\nYou can see that the first\
    \ line is entered, you need to click back into the IDLE Shell to continue entering\
    \ code; also you can change the title of the window to anything like,\n\n![](img/0b5e7d59f3578d974082f03180129000_75_1.png)\n\
    \n76 wwwbdmpublications.com"
