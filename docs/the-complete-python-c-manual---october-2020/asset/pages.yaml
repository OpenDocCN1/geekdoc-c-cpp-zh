  md: "# # Getting to Know Python\n\nPython is the greatest computer programming language\
    \ ever created. It enables you to fully harness the power of a computer, in a\
    \ language that's clean and easy to understand.\n\n# WHAT IS PROGRAMMING?\n\n\
    It helps to understand what a programming language is before you try to learn\
    \ one, and Python is no different. A recipe to bake a cake could go like this:\n\
    \n# PROGRAMMING RECIPES\n\nPrograms are like recipes for computers.\n\n+   Put\
    \ 100 grams of self-raising flour in a bowl.\nAdd 100 grams of butter to the bowl.\n\
    Add 100 milliliters of milk.\nBake for an hour.\n\nPut 100 grams of self-raising\
    \ flour in a bowl.\nAdd 100 grams of butter to the bowl.\nAdd 100 milliliters\
    \ of milk.\nBake for an hour.\n\n| bowl = |\n| flour = 100 |\n| butter = 50 |\n\
    | milk = 100 |\n| cake.append([flour,butter,milk]) |\n\n# CODE\n\nJust like a\
    \ recipe, a program consists of instructions that you follow in an order. A program\
    \ might describe a cake like this:\n\n```\nclass Cake(object):\n    def __init__(self,\
    \ flour, butter, milk):\n        self.flour = flour\n        self.butter = butter\n\
    \        self.milk = milk\n        self.cake.append([flour,butter,milk])\n```\n\
    \n| bowl = |\n| flour = 100 |\n| butter = 50 |\n| milk = 100 |\n| cake.append([flour,butter,milk])\
    \ |\n\n# PROGRAM COMMANDS\n\nYou might not know some of the Python commands, like\
    \ bowl.append and cake(bowl). The first is a list, the second one we'll look at\
    \ both in this book. The main thing to know is it's easy to read commands in Python.\
    \ When you learn the commands, it's easy to figure out how a program works.\n\n\
    ![](img/0b5e7d59f3578d974082f03180129000_11_0.png)\n\nGuido van Rossum, the Father\
    \ of Python.\n\n![](img/0b5e7d59f3578d974082f03180129000_11_1.png)\n\n```\ncake.py\
    \ - home:/Documents/cake.py (3.4.2)\n>>> cake = Cake()\n>>> cake(100, 50, 100)\n\
    >>> cake.cake\n[[100, 50, 100]]\n```\n\nwww.bdmpublications.com"
