  md: "# Working with Code\n\n# Where Next?\n\nCoding, like most subjects, is a continual\
    \ learning experience. You may not classify yourself as a beginner but you still\
    \ need to test your code, learn new tricks and hacks to make it more efficient\
    \ and even branch out and learn another programming language.\n\n# # INCLUDE<KEEP\
    \ ON LEARNING>\n\nWhat can you do to further your skills, learn new coding practices,\
    \ and present your code and even begin to help others using what you've experienced\
    \ so far?\n\n# TWITTER\n\nTwitter isn't all trolls and antagonists, but millions\
    \ of people who are more willing to spread their coding knowledge. We recommend\
    \ finding a few you can relate to and follow them. Often they post great tips,\
    \ hacks and fixes for common coding problems.\n\n![](img/0b5e7d59f3578d974082f03180129000_143_0.png)\n\
    \n# OPEN PROJECTS\n\nLook for open projects that you like the sound of and offer\
    \ to contribute to the code to keep it alive and up to date. There are millions\
