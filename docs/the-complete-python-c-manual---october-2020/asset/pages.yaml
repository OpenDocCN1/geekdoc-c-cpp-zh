  md: "# # Defining Constants\n\nConstants are fixed values in your code. They can\
    \ be any basic data type but the name suggests their value remains throughout\
    \ the entire code. There are two separate ways to define a constant in C++, the\
    \ #define pre-processor and const.\n\n## #DEFINE The pre-processors are instructions\
    \ to the compiler to pre-process the information before it goes ahead and compiles\
    \ the code. #include is a pre-processor as is #Define.\n\n+   * STEP 1 You can\
    \ use the #define pre-processor to define any constants we want in our code. Start\
    \ by creating a new C++ file with the following headers:\n\n```\n#include <iostream>\n\
    using namespace std;\nint main() {\n}\n```\n\n+   * STEP 3 Note the capitals for\
    \ defined constants, it's considered good programming practise to define constants\
    \ in capitals. Here, the assigned values are 50, 40 and so let's call them up:\n\
    \n```\n#include <iostream>\nusing namespace std;\n#define LENGTH 50\n#define WIDTH\
    \ 40\n#define HEIGHT 60\nint main() {\n    cout << \"Length is: \" << LENGTH <<\
    \ \"\\n\";\n    cout << \"Width is: \" << WIDTH << \"\\n\";\n    cout << \"Height\
    \ is: \" << HEIGHT << \"\\n\";\n}\n```\n\n| DefiningConstants.cpp x |\n|---||\n\
    | 1 | #include <iostream> |\n| 2 | using namespace std; |\n| 3 | int main () |\n\
    | 4 | |\n| 5 | |\n| 6 | |\n| 7 | |\n| 8 | |\n| 9 | |\n\n+   * STEP 2 Let's assume\
    \ your code has three different constants: length, width, and height. You can\
    \ define\n\n```\n#include <iostream>\nusing namespace std;\n#define LENGTH 50\n\
    #define WIDTH 40\n#define HEIGHT 60\nint main() {\n}\n```\n\n| DefiningConstants.cpp\
    \ x |\n|---||\n| 1 | #include <iostream> |\n| 2 | using namespace std; |\n| 3\
    \ | |\n| 4 | #define LENGTH 50 |\n| 5 | #define WIDTH 40 |\n| 6 | #define HEIGHT\
    \ 60 |\n| 7 | |\n| 8 | int main () |\n| 9 | |\n| 10 | |\n| 11 | |\n\n+   * STEP\
    \ 4 Build and run the code. Just as expected, it displays the values for the constants\
    \ you've created. It's worth noting that you don't need a semicolon when defining\
    \ a constant with the #define.\n\n| DefiningConstants.cpp x |\n|---||\n| 1 | #include\
    \ <iostream> |\n| 2 | using namespace std; |\n| 3 | |\n| 4 | #define LENGTH 50\
    \ |\n| 5 | #define WIDTH 40 |\n| 6 | #define HEIGHT 60 |\n| 7 | |\n| 8 | int main\
    \ () |\n| 9 | |\n| 10 | |\n| 11 | |\n\n```\nlength: 50\nwidth: 40\nheight: 60\n\
