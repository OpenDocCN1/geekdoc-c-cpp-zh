  md: '# # Opening Files


    In Python you can read and write binary files in programs. You can also write
    to file, which is something we will like to learn. Reading and writing files enables
    you to output and store data from your programs.


    # ## OPEN, READ AND WRITE


    In Python you create a file object, similar to creating a variable, only pass
    in the file using the open() function. Files are usually categorised as text or
    binary.


    +   * STEP 1 Start by entering some text into your system''s text editor. The
    text editor is best, not a word processor, as word processors include formatting
    and other elements. In our example the the Poem Cimmerian, by Robert Edward H.
    You need to save the file as poem.txt.


    +   * STEP 3 If you enter poem into the Shell, you will get some information regarding
    the text you''ve just asked to be opened. You can now use the poem variable to
    read the contents of the file:


    ```

    poem.read()

    Note a \n in an entry the text returns a new line, as you can use

    ```


    ![](img/0b5e7d59f3578d974082f03180129000_57_0.png)


    +   * STEP 2 Use the open() function to pass the file into a variable as an object.
    You can now tell Python to the name and location of the file you''re using:

    poem=open("/home/pi/Documents/Poem.txt")


    ```

    print(read("/home/pi/Documents/Poem.txt")

    This time, the \n entries are removed in favor of new lines and readable text.

    ```


