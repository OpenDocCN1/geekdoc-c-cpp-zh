  md: '# File Input/Output


    The standard iostream library provides C++ coders with the cin and cout input
    and output functionality. However, to be able to read and write from a file you
    need to utilise another C++ library, called fstream.


    # FSTREAMS


    There are two main data types in the fstream library that are used to open a file,
    read from and write to it, ofstream and fstream. Here''s how they work.


    +   - STEP 1 The first task is to create a new C++ file and along with the usual
    headers you need to include the new


    ```

    #include <iostream>

    #include <fstream>

    using namespace std;


    int main() {


    }

    ```


    +   - STEP 3 We''ve included comments in the screenshot of step 2 to help you
    understand the process. You created a string called name, to store the user''s
    inputted name. You also created a text file named name.txt (with the fstream newfile
    and newfile.open), asked the user for their name and stored it and then written
    the data to the file.


    ![](img/0b5e7d59f3578d974082f03180129000_121_0.png)


    +   - STEP 2 Begin by asking a user for their name and information to a file.
    You need to use the string to store the name, and accept the input from the user.


    ```

    #include <iostream>

    #include <fstream>

    using namespace std;


    int main() {


    }

    ```


    +   - STEP 4 To read the contents of a file, and output to the screen, you need
    to do things differently. First you need to create a string variable to store
    the file''s lines (by line), then open the file, use the getline method to read
    the file and output the lines to the screen. Finally, close the file.


    ```

    string line;

    fstream newfile("name.txt");

    cout << "Contents of the file: " << endl;

    getline(newfile, line);

    cout << line << endl;

    newfile.close();

    ```


