  md: '# Formatting Strings


    When you work with data, creating lists, dictionaries and objects you may often
    want to print out the results. Merging strings with data is easily especially
    with Python 3, as in earlier versions of Python tended to complicate matters.


    # STRING FORMATTING


    Since Python 3, string formatting has become a much neater process, using the
    .format function combined with curly brackets. It''s a more logical and better
    approach than previous.


    +   ### STEP 1

    The basic formatting in Python is to call each variable into the string using
    curly brackets:

    name="Conan"

    print("the barbarian hero of the Hyborian Age is: {}".format(name))


    +   ### STEP 3

    You can course also include integers into the mix:

    number=100000

    print("{} was a killed mercenary, and thief too. He once stole {}{} gold from
    a merchant.".format(name, number))


    ![](img/0b5e7d59f3578d974082f03180129000_53_0.png)


    There are many different ways to apply string formatting, which are quite simple,
    as we''ve shown here. It''s important to know what you want from your program.
    A good place to reference frequently string formatting is the Python docs, found
    at docs.python.org/3/library/string.html. Here, you will find tons of:


    ![](img/0b5e7d59f3578d974082f03180129000_53_1.png)'
