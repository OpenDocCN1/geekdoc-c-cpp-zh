  md: "# Creating Functions\n\nNow that you have mastered the use of variables and\
    \ user input, the next step is to tackle functions. You've already used a few\
    \ functions, such as the print command but Python enables you to define your own\
    \ functions.\n\n# FUNKY FUNCTIONS\n\nA function is a command that you enter into\
    \ Python to do something. It's a little piece of self-contained code that works\
    \ on it and returns the result.\n\n+   **STEP 1** is not just a function that\
    \ works on. They can do all of useful things in Python, such as sort data, change\
    \ items from one format to another and check the length or type of items. For\
    \ example, a function is a short word that follows by brackets. `len()`, `list()`\
    \ or `type()`.\n\n+   **STEP 3** You can pass variables through functions in much\
    \ the number of letters in a person's surname, you could use the following code\
    \ (enter the text editor for this example):\n\n```\nname=input(\"Enter your surname:\
    \ \")\nCount=len(name)\nprint(\"Your surname has\", count, \"letters in it\")\n\
    ```\n\n```\nPython 3.4.2 Sheet\nEdit Shell Debug Options Windows Help\nPython\
    \ 3.4.2 (default, Oct 19 2014, 13:31:11)\n(C) Python Software Foundation, Inc.\
