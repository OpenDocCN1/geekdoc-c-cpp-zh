- pgno: 61
  md: "# Exceptions\n\nWhen coding, you'll naturally come across some issues that\
    \ are out of your control. Let's assume you ask a user to divide two numbers and\
    \ they try to divide by zero. This report will create an error and break your\
    \ code.\n\n# EXCEPTIONAL OBJECTS\n\nRather than stop the flow of your code, Python\
    \ includes exception objects which handle unexpected errors in the code. You can\
    \ combat errors by creating conditions where exceptions may occur.\n\n+   **STEP\
    \ 1**\n\n* You can create an exception by simply trying to divide a number by\
    \ zero. This will will report back with the ZeroDivisionError: division by zero\
    \ message, as seen in the screenshot. The which there are many ways.\n\n+   **STEP\
    \ 3**\n\n* You can use the functions raise to create our own error handling code.\
    \ Let's assume your code is warping around the cosmos, too much however due to\
    \ a warp core breach. Stop from the warp core going supernova, you can create\
    \ a custom exception.\n\nraise:Exception(\"warp core breach\")\n\n```\nPython\
    \ 3.4.2 Shell\nPython 3.4.2 (default), Oct 19 2014, 13:31:21)\n[GCC 4.9.0 on Linux]\\\
    >>> TypeError: 'credits' or 'license' for more information.\nTraceback (most recent\
    \ call last):\n  File \"<module>\", line in <module>\nZeroDivisionError: division\
    \ by zero\n```\n\n```\nPython 3.4.2 Shell\nPython 3.4.2 (default), Oct 19 2014,\
    \ 13:31:21)\n[GCC 4.9.0 on Linux]\\>>> TypeError: 'credits' or 'license' for more\
    \ information.\nTraceback (most recent call last):\n  File \"<module>\", line\
    \ in <module>\nException: \"warp core breach\"\n```\n\n+   **STEP 2**\n\n* Most\
    \ exceptions are raised automatically when Python comes across something that's\
    \ inherently wrong with the code. Your own exceptions are designed to contain\
    \ the potential error and react to it, as opposed to letting the code fail.\n\n\
    +   **STEP 4**\n\n* To trap any errors in the code you catch the potential error\
    \ within a try block: This block consists of try, except, unless the code is hidden\
    \ within; then there's an exception to do something, do something else.\n\n| BaseException\
    \ |\n| --- |\n| SystemExit\n| KeyboardInterrupt\n| GeneratorExit\n| MemoryError\n\
    | BaseError\n| ArithmeticError\n| ZeroDivisionError\n| OverflowError\n| IndexError\n\
    | LookupError\n| NameError\n| AttributeError\n| TypeError\n| ValueError\n| ImportError\n\
    | KeyError\n| RuntimeError\n| NotImplementedError\n| StopIteration\n| SyntaxError\n\
    | IndentationError\n| TabError\n| AssertionError\n| UnicodeError\n| UnicodeDecodeError\n\
    | FileNotFoundError\n| FileError\n| PermissionError\n| IsError\n| FileError\n\
    | TimeoutError\n| ConnectionError\n| SocketError\n| EnvironmentError\n| BlockingError\n\
    | ArithmeticError\n| RuntimeError |\n\n```\nEdit File Format Options windows Help\n\
    Insert your operations here -->\ntry:\n  if there is an exception then do this\
    \ -->\nexcept:\n  if there is another exception then do this -->\nelse:\n  if\
    \ there is no exception, then do this --\n```"
  merge: -1
  img_proc: true
- pgno: 62
  md: "# STEP 5 For example, use the divide by zero error. You can create an exception\
    \ where the code can handle the error without Python quitting due to the problem:\n\
    \n```\ntry:\na=int(input(\"Enter the first number: \"))\nb=int(input(\"Enter the\
    \ second number: \"))\nprint(a/b)\nexcept ZeroDivisionError:\nprint(\"You have\
    \ tried to divide by zero!\")\nelse:\nprint(\"You did not divide by zero. Well\
    \ done!\")\n```\n\n![](img/0b5e7d59f3578d974082f03180129000_62_0.png)\n\n# STEP\
    \ 8 Naturally, you can quickly fix the issue by changing the \"r\" read only instance\
    \ with a \"w\" for this. As you already know, create the file and write the content\
    \ that commits the changes to the file. The end result will be a report of circumstances,\
    \ in this case, a successful execution of the code.\n\n```\nwith open(\"file.txt\"\
    , \"w\") as f:\n    f.write(\"This is a test. Normal service was overwritten\"\
    )\n```\n\n![](img/0b5e7d59f3578d974082f03180129000_62_1.png)\n\n# STEP 6 You can\
    \ use exceptions to handle a variety of useful tasks. Using an example from our\
    \ previous tutorials, let's assume you open a file and write to it:\n\n```\ntry:\n\
    txt = open(\"/home/pi/Documents/textfile.txt\", \"r\")\ntxt.write(\"This is a\
    \ test. Normal service will shortly resume!\")\nexcept IOError:\nprint(\"Error:\
    \ unable to write the file. Check permissions\")\nelse:\ntxt.write(\"Content written\
    \ to file successfully. Have a nice day.\")\ntxt.close()\n```\n\n![](img/0b5e7d59f3578d974082f03180129000_62_2.png)\n\
    \n# STEP 9 You can also use a finally: block, which works in a similar fashion\
    \ but you can use it as well. Using our example from Step:\n\n```\ntry:\ntxt =\
    \ open(\"/home/pi/Documents/textfile.txt\", \"r\")\ntxt.write(\"This is a test.\
    \ Normal service will shortly resume!\")\nexcept IOError:\nprint(\"Error: unable\
    \ to write the file. Check permissions\")\nfinally:\nprint(\"Content written to\
    \ file successfully. Have a nice day.\")\ntxt.close()\n```\n\n![](img/0b5e7d59f3578d974082f03180129000_62_3.png)\n\
    \n# STEP 7 Obviously this won't work due the file textfile.txt being opened as\
    \ read (the \"r\" part). So Python tells you that you're doing something wrong,\
    \ you've created an exception using the IOError code informing the user that the\
    \ permissions are incorrect.\n\n# STEP 10 As an error occurs you've used the \"\
    read-only\" instance. If you change it to a \"w\", the code will execute without\
    \ the error being displayed in the IDLE Shell. Needless to say, it can be a tricky\
    \ getting the exception code the first time. Practice this, and you will get the\
    \ hang\n\n```\ntry:\ntxt = open(\"/home/pi/Documents/textfile.txt\", \"w\")\n\
    txt.write(\"This is a test. Normal service will shortly resume!\")\nexcept IOError:\n\
    print(\"Error: unable to write the file. Check permissions\")\nelse:\ntxt.write(\"\
    Content written to file successfully. Have a nice day.\")\ntxt.close()\n```\n\n\
    ```\ntry:\ntxt = open(\"/home/pi/Documents/textfile.txt\", \"w\")\ntxt.write(\"\
    This is a test. Normal service will shortly resume!\")\nexcept IOError:\nprint(\"\
