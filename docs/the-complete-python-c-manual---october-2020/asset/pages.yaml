  md: '# # User Input


    We''ve seen some basic user interaction with the code from a few of the examples
    earlier, so now would be a good time to focus solely on how you would get information
    from the user then present it.


    # ## USER FRIENDLY


    The type of input you want from the user will depend greatly on the type of program
    you''re coding. For example, a game might ask for a character''s name, whereas
    a database can ask for personal details.


    +   - STEP 1 If it''s not already, open the Python 3 IDLE Shell and a New File
    in the Editor. Let''s begin with something simple, enter:


    ```

    print("Hello")

    firstname=input("What is your first name?")

    print("Thanks.")

    surname=input("And what is your surname?")

    ```


    +   - STEP 3 Now that we have the user''s name stored in a couple of variables
    we can call them whenever we want:


    ```

    print("Welcome", firstname, surname, ". I hope you''re well today.")

    ```


    ![](img/0b5e7d59f3578d974082f03180129000_35_0.png)


    +   - STEP 2 Save and execute the code, and as you already do suspect, in the
    IDLE Shell the program will ask for your surname, storing it as the last variable,
    followed by the first variable, stored in its own variable (surname):


    ```

    print("Welcome", firstname, surname+"." I hope you''re well today.")

    ```


    ![](img/0b5e7d59f3578d974082f03180129000_35_1.png)'
