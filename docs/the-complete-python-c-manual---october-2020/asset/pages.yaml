  md: "# # Tkinter Module\n\n5 STEP Save and execute the code from Step 4 and a window\
    \ appears with 'Hello everyone!' If you click the Hello everyone! button, the\
    \ Shell will output the text 'You clicked me!' It's simple but shows what you\
    \ can achieve with a few lines of code.\n\n```\nPython 3.4.2 (default, Oct 19\
    \ 2014, 23:31:11) [GCC 4.8.0]\n>>> type 'help' or 'license' for more information.\n\
    >>> import tkinter\n>>> root = tkinter.Tk()\n>>> print('You clicked me!')\nYou\
    \ clicked me!\n```\n\n8 STEP You can create radio buttons. Try.\n\n```\nroot =\
    \ Tk()\nvar = IntVar()\n```\n\n![](img/0b5e7d59f3578d974082f03180129000_74_0.png)\n\
    \n6 STEP You can also display text and images with a Tkinter window. However,\
    \ use GIF, PNG or PPM. Find an image and convert it before using the code. Here\
    \ is an example using the BMD Publishing:\n\n```\nroot = Tk()\nlogo = PhotoImage(file=\"\
    /home/pi/Downloads/BMD.gif\")\nimage=logo.pack(side=\"right\")\n```\n\n> \"\"\
    \ From humble beginnings in 2004, the BMD brand grew from a single production\
    \ publisher by just two people to one of the largest global publishers. Our commitment\
    \ and volume to deliver the very best product and every volume. While the company\
    \ with a portfolio of over 258 titles, the foundation that has been built remains\
    \ the same, which is why we believe BMD isn't the only choice for the smallest\
    \ market\n\n9 STEP You can also create check boxes, with text to output to the\
    \ Shell:\n\n```\nroot = Tk()\ndef var_states():\n    print(\"%s,\\nName: %d %s\"\
    \ % (var1.get(), var2.get()))\n```\n\n```\nLabel(root, root.title(\"Adventure\
