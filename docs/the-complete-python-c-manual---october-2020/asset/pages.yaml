  md: "# # Tkinter Module\n\nWhile running your code from the command line, or even\
    \ in the Shell, it is perfectly fine, Python is capable of so much more. The Tkinter\
    \ module enables the programmer to set up a Graphical User Interface to interact\
    \ with the user, and it's surprisingly powerful too.\n\n# ## GETTING GUI\n\nTkinter\
    \ is easy to use but a lot more you can do with it. Let's start by seeing how\
    \ it works and getting some code into it. Before long you will discover how powerful\
    \ this module really is.\n\n+   * STEP 1 Tkinter is usually built into Python\
    \ 3. However, if it's available when you need to install tkinter from the command\
    \ prompt. We can start to import modules differently than before, to save on typing\
    \ and importing all of them:\n```\nimport tkinter as tk\nfrom tkinter *\n```\n\
    \n![](img/0b5e7d59f3578d974082f03180129000_73_0.png)\n\n+   * STEP 3 The ideal\
    \ approach is to add mainloop() into the code to get that soon. You've just created\
    \ a Tkinter event loop, but you've created a Tkinter widget and there are several\
    \ more you can play with:\n```\nbtn=Button(root)\nbtn.pack()\nbtn[\"text\"]=\"\
    Hello everyone!\"\n```\n\n![](img/0b5e7d59f3578d974082f03180129000_73_1.png)\n\
    \n+   * STEP 2 It's not recommended to import from a module using the asterisk\
    \ because it won't do anything normally. Let's begin by creating a basic GUI window,\
    \ enter:\n```\nwind=Tkinter()\n```\n\nThis creates a small, window. There's not\
    \ much left to do at this point but click the K in the corner to close the window.\n\
    \n![](img/0b5e7d59f3578d974082f03180129000_73_2.png)\n\n+   * STEP 4 You can combine\
    \ the above into a New File:\n```\nimport tkinter as tk\nbtn=Button(root)\nbtn.pack()\n\
    btn[\"text\"]=\"Hello everyone!\"\n```\n\nThen add some function:\n```\ndef click():\n\
    \    print(\"you just clicked me!\")\nbtn[\"command\"]=click\n```\n\n![](img/0b5e7d59f3578d974082f03180129000_73_3.png)"
  merge: -1
  img_proc: true
