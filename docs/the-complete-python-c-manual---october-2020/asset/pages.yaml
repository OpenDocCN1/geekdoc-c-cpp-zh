- pgno: 15
  md: "# # How to Set Up Python on a Mac\n\nIf you're running an Apple Mac, then setting\
    \ up Python is incredibly easy. In a fact a version of Python is already installed.\
    \ However, you should make sure you're running the latest version.\n\n# ## INSTALLING\
    \ PYTHON\n\nApple's operating system comes with Python installed, so you don't\
    \ need to install it separately. However, Apple doesn't update Python often and\
    \ you're probably running an older version. So it makes sense to check and update\
    \ first.\n\n+   - Open a new Terminal by clicking Go > Utilities, then double-click\
    \ the Terminal icon. Now enter: --version You will see Python 2.5.1 or later,\
    \ if Apple has updated the OS and Python installation. Either way, it's best to\
    \ check for the latest.\n\n+   - Click on the latest version of Python 3.x, in\
    \ our case this is the download for Python 3.6. This will automatically download\
    \ the latest version of Python and depending on how you've got your Mac configured,\
    \ it automatically starts the installation.\n\n![](img/0b5e7d59f3578d974082f03180129000_15_0.png)\n\
    \n```\n```\nTerminal —80x26\n$ --version\nPython 2.5.1 (build, Mar 23 2009, 18:54:04)\
    \ [Clang 1100.0.10)\n$ \n```\n```\n\n+   - Open Safari and head over to www.python.org/downloads.\
    \ As with the Windows procedure on the previous pages, you can see two download\
    \ buttons: one for Python 3.6.2, and the other for Python 2.7.13. Note, version\
    \ numbers may be different due to the frequent releases of Python.\n\n+   - With\
    \ the Python installation window, click the Continue button to begin the installation.\
    \ It is worth a moment to read the Important Information section, in case it references\
    \ something that apply to your version of macOS. When ready, click Continue.\n\
    \n![](img/0b5e7d59f3578d974082f03180129000_15_1.png)\n\n# ## Download the latest\
    \ version for Mac OS X\n\n| Python 3.6.2 | Python 2.7.13 |\n\nWondering which\
    \ version to use? Here's more about the difference between Python 2 and 3.\n\n\
    Looking for Python with a different OS? For windows, Linux/Mac, or Other.\n\n\
    Want to help test latest developments of Python? Pre-releases\n\n![](img/0b5e7d59f3578d974082f03180129000_15_2.png)"
