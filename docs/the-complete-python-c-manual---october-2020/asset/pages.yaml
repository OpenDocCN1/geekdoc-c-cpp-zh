  md: "# COMMENTS (AGAIN)\n\nIndeed the mistake of never making comments on code is\
    \ back once more. As we've previously bemoaned, the lack of readable identifiers\
    \ throughout the code makes it very difficult to look back at it for both you\
    \ and someone else. Use more comments.\n\n```\n#include <iostream>\n#include <vector>\n\
    \nint main() {\n    vector<string> names;\n    names.push_back(\"Alice\"); //\
    \ add element\n    if (!names.empty()) { // check if empty\n        std::cout\
    \ << names[0]; // print first element\n    }\n    return 0;\n}\n```\n\n# TOO MANY\
    \ BRACES\n\nThe braces, or curly brackets, are beginning and ending markers around\
    \ blocks of code. So for every (you must have a). It's so easy to miss out one\
    \ or the other brace when you are usually writing in a text editor, or an IDE\
    \ does for them.\n\n```\n#include <iostream>\nusing namespace std;\n\nint main()\
    \ {\n    int x;\n    string myself = \"This is a string!\\n\"\n    cout << \"\
    What's the value of x? \";\n    cin >> x;\n    cout << x << \"\\n\";\n    cout\
    \ << myself;\n}\n```\n\n# QUOTES\n\nMissing quotes is a common mistake to, every\
    \ level of user. Remember that code needs to enclose strings and that anything\
    \ is going to be outputted to the screen or into a file, for example. Most compilers\
    \ error due to missing quotes in code.\n\n![](img/0b5e7d59f3578d974082f03180129000_142_0.png)\n\
    \n# INITIALISE VARIABLES\n\nIn C++ variables are not initialized to zero by default.\
    \ This means if you create a variable x then, it is given a number from 0 to 18,446,744,073,709,516,\
    \ which is difficult to include in an equation. When creating a variable, give\
    \ it value\n\n![](img/0b5e7d59f3578d974082f03180129000_142_1.png)\n\n# EXTRA SEMICOLON\n\
    \nWhile it is necessary to have a semicolon at the end of every C++ line, there\
    \ are some exceptions to the rule. Semicolons need to be at the end of every complete\
    \ statement but some lines of code are incomplete statements. Such as:\n\n```\n\
    #include <iostream>\nusing namespace std;\n\nint main() {\n    int x = 0; // initialize\
    \ an integer\n    if (x > 0) {\n        cout << \"you entered a positive integer:\"\
    \ << endl;\n    } else {\n        cout << \"you entered a negative integer or\
    \ zero:\" << endl;\n    }\n    return 0;\n}\n```\n\n# A.OUT\n\nA common mistake\
    \ when compiling in Linux is forgetting to name your C++ code file. When you compile,\
    \ the Terminal, a.out\n\nIf it sounds confusing, the compiler tells you where\
    \ you went wrong.\n\n```\n#include\nif lines\nswitch lines\n```\n\n```\ng+ code.cpp\n\
    This compiles the file code.cpp and create an a.out file that can be executed\
    \ with ./a.out. However, if you already have a code.out it'll overwrite it.\n\
    ```\n\n```\ng+ code.cpp -o ofprogram\nFile Edit View Search Terminal Help\ndavidmite-\
    \ ~ Documents g++ test1.cpp -o printzero\ndavidmite- ~ Documents g++ test1.cpp\
    \ -o out\ndavidmite- ~ Documents g++ test1.cpp -o printzero\ndavidmite- ~ Documents\
    \ $ /printzero\n```\n\nwww.bdpublications.com 143"
