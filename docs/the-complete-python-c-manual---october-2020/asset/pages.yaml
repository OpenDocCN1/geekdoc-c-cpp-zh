  md: "# # While Loop\n\nA loop's function is to repeat a statement, or a group of\
    \ statements, with a certain condition remains true. When the loop starts, it\
    \ initialises itself by testing the condition of the loop and the statements within,\
    \ before executing the rest of the loop.\n\n# ## TRUE OR FALSE?\n\nWhile are one\
    \ the most popular form of C++ code looping. They repeatedly run the code contained\
    \ within the loop while the condition is true. Once it proves false, the code\
    \ continues as normal.\n\n+   1. Clear what you've done so far and create a new\
    \ C++ file. There's no need for any extra headers as per usual.\n\n+   First you\
    \ need to create a condition, use a variable named num and give it value 1. Now\
    \ create the loop, stating that as long as num is less than 30, the loop is true.\
    \ Within the loop display the value and adds 1 until it's more than 30.\n\n```\n\
    ```cpp\n#include <iostream>\nusing namespace std;\nint main () {\n}\n```\n```\n\
    \n```\n```cpp\n#include <iostream>\nusing namespace std;\nint main () {\n    int\
    \ num = 1;\n    while (num < 30) {\n        cout << \"Number: \" << num << endl;\n\
    \        num = num + 1;\n    }\n}\n```\n```\n\n+   2. Create a simple loop. Enter\
    \ the code below, and run it (with the added comments to the screen):\n\nWe're\
    \ introducing a few new elements. Here are the opening and closing braces for\
    \ the loop. Because our loop is a compound statement, meaning a group of statements;\
    \ also, there's no semicolon after the statement. You now have return 0, which\
    \ is a clean and prepared way of ending the code.\n\n```\n```cpp\n// Initialize\
    \ the variable\nint num = 1;\nwhile (num < 30) // The condition is true while\
    \ num is less than 30\n    cout << \"Number: \" << num << endl; // Print the current\
    \ value of num\n    num++; // Increment the value of num\n\nreturn 0; // Currently\
    \ closes the loop and finishes the program\n```\n```\n\n+   3. If you need to\
    \ continue the increasing value of num, you could have done away with the loop\
    \ statement and just add num by itself, and then display the result:\n\n```\n\
    ```cpp\nint num = 1;\nwhile (num < 30) {\n    num++;\n    cout << \"Number: \"\
    \ << num << endl;\n}\nreturn 0;\n```\n```"
