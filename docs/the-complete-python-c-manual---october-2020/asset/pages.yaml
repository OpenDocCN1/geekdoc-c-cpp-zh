  md: "# # Creating Functions\n\n**STEP 5** Additional functions can be added to Python\
    \ through modules. Python has a vast range of modules that can cover numerous\
    \ duties. They can be added if and as required. For example, to use advanced mathematics\
    \ functions:\n\n```\nimport math\n```\n\nOnce entered, you have access to all\
    \ the math functions.\n\n**STEP 6** To use a function from a module the name of\
    \ the function followed by a full stop, for instance, using the math module, you've\
    \ just imported it into Python, you utilise the square root function. To do so:\n\
    \n```\nmath.sqrt(16)\n```\n\nYou can see that the code is presented as math.function(data).\n\
    \n![](img/0b5e7d59f3578d974082f03180129000_38_0.png)\n\n# # FORGING FONCTIONS\n\
    \nThere are many different functions you can import from other Python programs\
    \ and you will undoubtedly encounter some excellent examples in the future; you\
    \ can create your own with the def command.\n\n**STEP 1** Choose File -> New File\
    \ to enter the editor, let's create a function called Hello, that greets a user.\n\
    \n```\ndef Hello():\n    print(\"Hello\")\n\nHello()\n```\n\nPress F5 to save\
    \ and run the script. You will see Hello in the Shell, type in Hello() and it\
    \ returns the function.\n\n**STEP 3** To modify it, delete the Hello(\"David\"\
    ) line, the last line in the script and press Ctrl+S to save the new script. Delete\
    \ the editor and create a new file (File -> New File). The\n\n```\nfrom Hello\
    \ import Hello\nHello(\"David\")\n```\n\nPress F5 to save and execute the code.\n\
    \n![](img/0b5e7d59f3578d974082f03180129000_38_1.png)\n\n**STEP 2** Let's expand\
    \ the function to accept a variable, the user's name for firstly. Edit your script\
    \ to:\n\n```\ndef Hello(name):\n    print(\"Hello,\", name)\n\nHello(\"David\"\
    )\n```\n\nThis will now accept the variable, otherwise it prints Hello David.\
    \ In the Shell, enter name=\\(\"Bob\"), Hello(name). Your function can now pass\
    \ through it.\n\n**STEP 4** What you've just imported the Hello function from\
    \ the saved Hello program and used it to say Hello David. This is how modules\
    \ work; you import the module then use the function. Try this, and modify it for\
    \ extra credit:\n\n```\ndef add(a, b):\n    result = a + b\nreturn result\n```\n\
