  md: '# # Using Comments


    While comments may seem like a minor element in the many lines of code that combine
    to make a game, application, or even an entire operating system, understanding
    what code went wrong or worked brilliantly is probably one of the most important
    factors.


    # ## THE IMPORTANCE OF COMMENTING


    Comments inside code are quite human readable descriptions that detail what the
    code is doing at that particular point. They don''t especially important but code
    without comments is one of the many frustrating areas of programming whether you''re
    a professional or just starting out.


    In short, code should be commented in a manner as to effectively describe the
    purpose of a line, section, or individual elements. You should get in the habit
    of commenting as much as possible so that someone who doesn''t know about programming
    can pick up your code and understand it quickly.


    In a professional environment, comments are vital to the success of the code and
    the company. In an organisation, managers work in teams alongside engineers, other
    developers hardware analysts and so on. If you''re part of a team that''s writing
    software, your comments can help save a little time going wrong when another team
    member has to pick up and follow the trail to pinpoint the issue.


    Place yourself in the shoes of someone whose job is to find out what your program
    has in excess of 800,000 lines of code, spread across several modules. You can
    encounter the need for a little help from the original programmers in the form
    of a good comment.


    > The best comments are concise and link the code logically, detailing what happens
    when the program hits its line or section. You dont need to comment on every line,
    something along the lines of x doesn''t require you to comment that x equals zero
    then do something:


    that''s going to be obvious to the reader. However, if equalling zero is something
    that drastically changes the program for the user, such as they''re run out of
    lines, then it needs to be commented.


    Even if you write comments as if you were going to publicly share it with others.
    This way you can return to understand exactly why you did it or where you went
    wrong or worked brilliantly.


    Good practice and experience help you understand how to add a comment when needed,
    and how to do so if it''s necessary.


    ```

    DEF 240,220,324,305B,0,G,370,700,720,770,780B,720B,320B

    DEF 320B,324B,305B,400B,410B,420B,430B,440B,450B,460B,470B,480B

