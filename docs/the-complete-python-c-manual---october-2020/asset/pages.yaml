    Enter the year to display: \"))\nprint(calendar.calendar(year))\nWe're sure you'll\
    \ agree that's quite a handy bit of code to handle.\n\nSTEP 8 You're also able\
    \ to print the individual months or\ndays of the week:\nimport calendar\nfor name\
    \ in calendar.month_name:\n    print(name)\nimport calendar\nfor name in calendar.day_name:\n\
    \    print(name)\n\n![](img/0b5e7d59f3578d974082f03180129000_68_0.png)\n\nSTEP\
    \ 6 Interestingly we can also list the number of days in a\nmonth by using a simple\
    \ loop:\nimport calendar\ncal=calendar.Text(calendar.SUNDAY)\nfor i in cal.monthdays(2018,\
    \ 6):\n    print(i)\n\nSTEP 9 The calendar module also allows us to write the\n\
