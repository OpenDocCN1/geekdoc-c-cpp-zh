  md: '# Character Literals


    In C++ a literal is an object or variable that once defined remains the same throughout
    the code. However, a character literal is defined by a backslash, such as the
    \n you''ve been using at the end of a cout statement to signify a new line.


    # ESCAPE SEQUENCE


    When used in a cout statement, character literals are also called Escape Sequence
    Codes. They allow you to insert a quote, an alert line, and much more.


    +   STEP 1 Create a new C++ file and enter the relevant headers:


    ```

    #include <iostream>

    using namespace std;


    int main() {


    }

    ```


    +   STEP 3 if you wanted to insert speech quotes inside a cout statement, you
    would have to use a backslash as it already uses quotes:


    ```

    #include <iostream>

    using namespace std;


    int main() {


    out << "Hello, user.";

    ```


    ![](img/0b5e7d59f3578d974082f03180129000_117_0.png)


    +   STEP 2 You''ve experienced the \ncharacter literal placing a new line where
    it''s called. The line: cout << "Hello\n "I''m a C++\n"Program\n" outputs three
    lines of text, starting after the last \n.


    +   STEP 4 There''s even a character literal that can trigger an alarm. In Windows
    10, the notification sound changes when you use \a. Try this, and turn up your
    sound.


    ```

    #include <iostream>

    using namespace std;


    int main() {


    out << "ALARM!\a";

    ```


