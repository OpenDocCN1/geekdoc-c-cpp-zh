  md: '# Random Module


    The random module is one you will come across many times in your Python programming
    lifetime; as names say, it''s designed to create random numbers or letters. However,
    it''s not exactly random but it will suffice for most needs.


    # RANDOM NUMBERS


    There are numerous functions within the random module, which when applied can
    create some interesting and very useful Python programs.


    +   **STEP 1** Just as with other modules you need to import random before you
    can use any of them. We''re going to look at it in detail. Let''s begin by simply
    printing a random number from 1 to 5:


    ```

    import random

    print(randint(0,5))

    ```


    ![](img/0b5e7d59f3578d974082f03180129000_71_0.png)


    +   **STEP 2** In our example the number four was returned. However, enter the
    function a few more times and it will yield different integer values from the
    numbers, given to five. This, called pseudo-random, is adequate for the average
    programmer to utilise in their code.


    ![](img/0b5e7d59f3578d974082f03180129000_71_1.png)


    +   **STEP 3** For a bigger set of numbers, including floating point numbers,
    you can extend the range by using the


    ```

    import random

    print(random.random()* 100))

    ```


    This will display a point between 0 and 100, to the tune of around fifteen places.


    ![](img/0b5e7d59f3578d974082f03180129000_71_2.png)'
  merge: -1
  img_proc: true
