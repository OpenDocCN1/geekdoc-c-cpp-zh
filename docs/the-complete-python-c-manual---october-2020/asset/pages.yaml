  md: '# OS Module


    The OS module allows you to directly interact with the built-in commands found
    in your operating system. Commands vary depending on the OS you''re running, as
    some will work with Windows whereas others will work with Linux and macOS.


    # IN THE SYSTEM


    One of the primary features of the OS module is the ability to list, move, create,
    delete and otherwise interact with files stored on the system, making it the perfect
    module for backup.


    +   **STEP 1** You can start the OS module with some sample functions to see how
    it interacts with the operating system environment If you''re using Linux or the
    Raspberry Pi, try this:


    ```

    import os

    home=os.getcwd()

    print(home)

    ```


    +   **STEP 3** The Windows output is as different as that''s the current working
    directory of Python, as you might suspect, the os.getcwd() function is asking
    Python to retrieve the Current Working Directory. Linux users will see something
    along the same lines as the Raspberry Pi, as will


    ![](img/0b5e7d59f3578d974082f03180129000_69_0.png)


    +   **STEP 2** The returned result from the variable home is the current user''s
    folder on the system. In our example that''s /home/pi; it will be different depending
    on the user name you log in and the operating system you use. For example, Windows
    10 will output: C:\Program Files (x86)\Python36-32.


    +   **STEP 4** Yet another interesting element to the OS module, is its ability
    to launch programs that are installed in the system host. For example, if you
    wanted to launch the Chrome browser from within a Python program you can use the:


    ```

    import os

    browser=os.system("/usr/bin/chromium-browser")

    ```


    ![](img/0b5e7d59f3578d974082f03180129000_69_1.png)'
