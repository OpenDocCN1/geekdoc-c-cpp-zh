  md: '# # Using Comments


    When you write code, the flow of it, what each variable does, the overall program
    will operate and so on is all inside your head. Another programmer could follow
    the code line by line but over time, it can become difficult to read.


    ## #COMMENTS!\Programmers use a method of keeping their code readable by on certain
    sections. If a variable is used, the programmer comments on what it''s supposed
    to do, for example. It''s just good practice.


    +   **STEP 1** Start by creating a new instance of the IDLE Editor (File -> New
    File) and create a simple variable and print command:


    ```

    a=10

    print("The value of A is", a)

    ```


    Save the file and execute it.


    ![](img/0b5e7d59f3578d974082f03180129000_31_0.png)


    +   **STEP 2** Running the code will return the line: The value of A is 10 to
    the IDLE Shell window, which is what we expect. Now, add some of the comments
    you''d normally see within code:


    > # Set the start value of A to 10

    a=10

    # Print the current value of A

    print("The value of A is", a)


    ![](img/0b5e7d59f3578d974082f03180129000_31_1.png)


    +   **STEP 4** Let''s assume that the variable A we''ve created is the number
    of lives in a game. Every time the player dies, the value is decreased by 1. The
    programmer could insert a routine line among the following:


    ```

    a-=1

    print("You''ve just lost a life!")

    print("You now have.", a, "lives left!")

    ```


    ![](img/0b5e7d59f3578d974082f03180129000_31_2.png)'
