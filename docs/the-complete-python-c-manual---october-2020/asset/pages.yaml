  md: '# Structure of a C++ Program


    C++ has a very defined structure and way of doing things. Miss something out,
    even as small as a semicolon, and your entire program will fail to be compiled
    and executed. Many of professional programmer has fallen foul of sloppy structure.


    # #INCLUDE <C++>


    Learning the basics of programming, you begin to understand the structure of a
    program. The commands may be different from one language to the next, but you
    will start to see how the code works.


    | C++ |

    |---|n| C++ was invented by Danish Bjarne Stroustrup in 1979, as a part of his
    Ph.D. thesis. Initially C++ was called C with Classes, which added features to
    the popular C programming language, making it a more user-friendly environment
    through a new structure. |


    | Start here | *helloworld.cpp |

    |---|---|n| 1 | #include <iostream> |

    | 2 | |

    | 3 | |

    | 4 | |

    | 5 | |


    #INCLUDE

    The structure of a C++ program is quite precise. Every C++ code begins with a
    directive. **#include** directs the pre-processor to include a section of the
    standard C++ For example: **#include <iostream>** includes the i header to support
    input/output operations.


    Bjarne Stroustrup, inventor of C++.


    | Start here | *helloworld.cpp |

    |---|---|n| 1 | #include <iostream> |

    | 2 | |

    | 3 | |

    | 4 | |

    | 5 | |

    | 6 | |


    INT MAIN()

    main() initiates the declaration of a function, which is a group of code statements
    under the name ''main''. All C++ code begins at the function, regardless of where
    it lies within the code.


    # BRACES


    | #include <iostream> |

    |---|n| int main() |

    | { |

    | } |


    The open brace (curly brackets) is something that may not have come from before,
    especially if you''re used to Python. The open brace indicates the beginning of
    the main function and contains all the code that belongs to that function.'
