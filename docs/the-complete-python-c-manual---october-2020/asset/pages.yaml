- pgno: 59
  md: '# Writing to Files


    The ability to read external files within Python is contrary handy but writing
    to a file is better still. Using the write() function, you''re able to output
    the results of a program to a file, that you can read() back into Python.


    # WRITE AND CLOSE


    The write() function is slightly more complex than read(). Along with the filename
    you must also include an access mode which determines whether the file is in question
    is read or write mode.


    +   Start opening IDE and enter the following:

    tfile=open("/home/pi/Documents/text.txt")


    Change the destination from /home/pi/Documents to your own system. The code will
    create a text file text.txt in write mode using the variable ''t''. If there''s
    no file of that name in the directory, it will create one. If one already exists,
    it will overwrite it, so be careful.


    ![](img/0b5e7d59f3578d974082f03180129000_59_0.png)


    However, the actual text is still blank (you''ve written the line of file object
    not committed to it yet). Part of the write() function is you need to commit the
    changes to the file; you can do this by entering:

    t.close()


    You can now open the file using the write() function. which operates to read(),
    writing lines instead of them reading. Try this:


    t.write("You awake in a small, square room. A single table to one side, there
    is a locked door in front of you.")


    Note the 109, is the number of characters you''ve entered.


    ![](img/0b5e7d59f3578d974082f03180129000_59_1.png)'
  merge: -1
  img_proc: true
- pgno: 60
  md: '# Writing to Files


    STEP 5 To expand this code, you can reopen the file using ''a'', for access or
    append mode. This will add any text to the end of the line instead of wiping the
    file and creating a new example.


    ```

    t=open("home/pi/Documents/text.txt", "a")

    t.write("\n")

    You stand and survey your surroundings.

    On top of the table is meat, and a cup of

    water."n")

    ```


    STEP 8 You can pass variables to a file that you''ve created in Python. You want
    the value of PI to be written to it. You can call PI from the module, create a
    new variable and pass the output of PI into the new file:


    ```

    import math

    print("Value of PI is:{math.pi}")

    print("writing to a file...")

    ```


    ![](img/0b5e7d59f3578d974082f03180129000_60_0.png)


    STEP 6 You can keep extending the text line by line, ending each with a new line
    (\n). When you want to finish, call close() and open the file in your editor to
    see it.


    ```

    t.write("The door is made of solid oak with iron strips. It''s bolted from the
    outside, locking you in. You are a prisoner!\n")

    t.close()

    ```


    STEP 9 Now let''s create a variable pi and assign it the value of PI:


    ```

    pi=math.pi

    You also need to create a new file in which to write PI:

    t=open("home/pi/Documents/pi.txt", "w")

    Remember to change the file location to your own particular

    system setup.

    ```


    ![](img/0b5e7d59f3578d974082f03180129000_60_1.png)


    STEP 7 There are different types of file access to using the open() function.
    Each depends on how you need it, r+ opens a file in read and write places the
    cursor at the start of the file.


    STEP 10 To finish, use string formatting to call the variable and write it to
    the file, then commit the changes and close the file:


    ```

    t.write("Value of PI is:{}".format(pi))

    t.close()

    You can see from the results that you''re able to pass any variable to a file.

    ```


