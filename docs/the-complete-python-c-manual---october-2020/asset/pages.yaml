  md: '# Working with Variables


    # STEP 5


    However, you can''t combine strings and integer variables in the same command,
    as you need to enter one into the other or vice versa. When you try to combine
    both, you get an error message:


    ```

    print(name + age)

    ```python

    Python 3.2 (default, Oct 19 2014, 13:31:11)

    >>> name = "Vikings"

    >>> age = 44

    >>> type(name)

    <class ''str''>

    >>> type(age)

    <class ''int''>

    >>> print(name + age)

    Descended from Vikings

    >>> Traceback (most recent call last):

    >>> print(name + age)

    TypeError: Can''t convert ''int'' object to str

    ```

    ```


    # STEP 8


    This presents a bit of a problem when you want to work with a number that''s been
    inputed by the user, as age + 10 won''t work due to age being a string and an
    integer. Instead, you need to:


    ```

    int(age) + 10

    ```


    This will cast the age into an integer that can be converted.


    ```

    Python 3.2 Shell

    Python 3.2 (default, Oct 19 2014, 13:31:11)

    >>> name = "Vikings"

    >>> age = 44

    >>> int(age) + 10

    54

    ```


    # STEP 6


    ```

    print(character + " is " + str(age) + " years old.")

    ```


    This is a process known as Casting.


    or you can:


    ```

    print(character, "is,", age, "years old.")

    ```


    Notice that in the last example, you don''t need the spaces between the words
    because of the comma as comma to print them separately.


    # STEP 9


    This is TypeC. When dealing with floating point arithmetic; numbers have a decimal
    point. For example, enter:


    ```

    shift=19.99

    ```


    Now enter float(shift) and you''ll see that as a float, the value contains a decimal
    point.


    ```

    Python 3.2 Shell

    Python 3.2 (default

    ```


    # STEP 7


    Another example of TypeCasting is when you get input from the user, such as for
    example:


    ```

    age=input("How old are you?")

    ```


    All data from input is stored as a string.


    ```

    Python 3.2 Shell

    Python 3.2 (default, Oct 19 2014, 13:31:11)

    >>> age = input("How old are you?")

    44

    >>> type(age)

    <class ''str''>

    >>> int(age)

    44

    >>> type(int(age))

    <class ''int''>

    ```


    # STEP 10


    When combining integers and floats Python converts the integer to a float, but
    the reverse isn''t worth mentioning because Python doesn''t return the exact value.
    When converting, Python will round to the nearest integer, calling trunc(); in
    case of 19.99 it becomes 19.


    ```

    Python 3.2 Shell

    Python 3.2 (default, Oct 19 2014, 13:31:11)

    >>> shift = 19.99

    >>> age = 10

    >>> shift + age

    29.99

    >>> type(shift + age)

    <class ''float''>

    ```


