  md: "# STEP 9\n\nYou can implement a few features and utilise some previous tutorial\
    \ code. The new elements are the subprocess module, of which one allows us to\
    \ launch a second Python script from within another; and we're going to create\
    \ a New file called pygame.py.\n\npygame.display.flip()\nclock.tick(60)\ncontinue\n\
    break\n\n```\nimport pygame\nimport time\nimport subprocess\npygame.init()\nscreen\
    \ = pygame.display.set_mode((800, 250))\nclock = pygame.time.Clock()\nfont = pygame.font.Font(\"\
    Arial\", 25)\npygame.name = pygame.py\npygame.time.set_timer(pygame.USEREVENT,\
    \ 200)\ndef text_generator():\n    tmp = ''\n```\n\n```\nimport pygame\nimport\
    \ time\nimport subprocess\npygame.init()\nscreen = pygame.display.set_mode((800,\
    \ 250))\nclock = pygame.time.Clock()\nfont = pygame.font.Font(\"Arial\", 25)\n\
    pygame.name = pygame.py\npygame.time.set_timer(pygame.USEREVENT, 200)\ndef text_generator():\n\
    \    tmp = ''\n```\n\n```\nfor letter in text:\n    tmp += letter\n    if letter\
    \ != ' ':\n        yield tmp\n```\n\n```\nclass DynamicText(object):\n    def\
    \ __init__(self, font, text, pos):\n        self.autoreset = False\n        self.font\
    \ = font\n        self.text = text\n        self.gen = text_generator(self.text)\n\
    \        self.pos = pos\n        self.autoreset = True\n```\n\n```\ndef update(self):\n\
    \    if not self.autoreset:\n        try:\n            self.rendered = self.font.render(next(self.gen),\
    \ True, (255, 128, 0))\n        except StopIteration:\n            self.autoreset\
    \ = True\n            time.sleep(10)\n            subprocess.Popen([\"python3\
    \ /home/pi/Documents/pygame.py\", \"shell\"]\n```\n\n```\ndef reset(self):\n \
    \   self.gen = text_generator(self.text)\n    self.done = False\n    self.update()\n\
    ```\n\n![](img/0b5e7d59f3578d974082f03180129000_78_0.png)\n\nA long time ago,\
    \ a barbarian strode from the north. Sword in hand....\n\n```\nwhile True:\n \
    \   for event in pygame.event.get():\n        if event.type == pygame.QUIT:\n\
    \            quit()\n        if event.type == pygame.USEREVENT:\n            message\
    \ = event.message\n    else:\n        screen.fill(pygame.Color(\"black\"))\n \
    \   message.draw(screen)\n```\n\nSTEP 10\n\nWhen you run this code, it will show\
    \ a pygame window with the intro text. After a pause of ten seconds, it will launch\
