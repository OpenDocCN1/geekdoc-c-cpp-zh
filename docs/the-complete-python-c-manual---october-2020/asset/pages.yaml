- pgno: 70
  md: "# STEP 5\n\nThe os.system() function is what allows interaction with external\
    \ programs; you can call up previous Python programs using this method. You will\
    \ obviously need to know the full path and program name for it to work successfully.\
    \ You can use the following:\n\n```\nimport os\nos.system('start chrome \"https://www.youtube.com/feed/music\"\
    ')\n```\n\n![](img/0b5e7d59f3578d974082f03180129000_70_0.png)\n\n# STEP 8\n\n\
    The ability to manipulate directories, or folders you prefer, is one of the OS's\
    \ best features. For example, to create a new directory you can use:\n\n```\n\
    import os\nos.mkdir(\"NEW\")\n```\n\nThis creates a new directory within the Current\
    \ Working Directory, named according to the mdir keyword.\n\n![](img/0b5e7d59f3578d974082f03180129000_70_1.png)\n\
    \n# STEP 6\n\nFor Step 5's example we used Windows, to show that the OS module\
    \ works roughly the same across all platforms. In this case, we opened YouTube's\
    \ music feed, so it is therefore possible to open specific pages:\n\n```\nimport\
    \ os\nos.system('chromium-browser \"http://bdmpublications.com/\")')\n```\n\n\
    # STEP 9\n\nYou can rename any directories you've created by entering:\n\n```\n\
    import os\nos.rename(\"NEW\", \"OLD\")\n```\n\nTo delete:\n\n```\nimport os\n\
    os.rmdir(\"OLD\")\n```\n\n![](img/0b5e7d59f3578d974082f03180129000_70_2.png)\n\
    \n![](img/0b5e7d59f3578d974082f03180129000_70_3.png)\n\n# STEP 7\n\nNote in the\
    \ previous step's example the use of single and double-quotes. The single quotes\
    \ encapsulate the entire command and launching Chrome, whereas the double quotes\
    \ opened the specific page. You can even use variables to call multiple tabs in\
    \ the browser:\n\n```\nimport os\na=('chromium-browser \"http://bdmpublications.com/\"\
    )')\n```\n\n```\nb=('chromium-browser \"http://www.google.co.uk/\")\nos.system(a\
    \ + b)\n```\n\n# STEP 10\n\nAnother module that goes with OS is shutil. You can\
    \ use the shutil module together with OS and create a time-timestamped directory,\
    \ and copy files into it:\n\n```\nimport os, shutil, time\nroot_src_dir = r'/home/pi/Documents/'\
    \ + time.asctime())\nroot_dst_dir = '/home/pi/backup/'\nfor root_src, dir_src,\
    \ files in os.walk(root_src):\n    dir_dst = root_src.replace(root_src, root_dst,\
    \ root_dst)\n    if not os.path.exists(dir_dst):\n        os.makedirs(dir_dst)\n\
    \    for file in files:\n        src_file = os.path.join(root_src, dir_src, file)\n\
    \        dst_file = os.path.join(root_dst, dir_dst, file)\n        if not os.path.exists(dst_file):\n\
    \            shutil.copy2(src_file, dst_file)\nprint(\">>>>>>Backup complete<<<<<<\"\
    )\n```\n\n![](img/0b5e7d59f3578d974082f03180129000_70_4.png)\n\n![](img/0b5e7d59f3578d974082f03180129000_70_5.png)"
  merge: -1
  img_proc: true
