    \ to execute.\n\n![](img/0b5e7d59f3578d974082f03180129000_37_0.png)\n\n+   **STEP\
    \ 2** A function takes data, using a variable, works on it depending on how the\
    \ function is programmed to and returns the value. The data being worked on inside\
    \ the brackets, so if you wanted to know how many letters are in the word antidestablishmentarianism,\
    \ then you'd enter `len(\"antidisestablishmentarianism\")` and the number 28\n\
