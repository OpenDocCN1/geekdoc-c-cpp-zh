  md: "# Do... While Loop\n\nA do... while loop differs slightly from that of a for\
    \ or even a while loop. Both for and while set and examine the state of the condition\
    \ at the start of the loop, or to the top of the loop if you prefer. However,\
    \ a do... while loop, is similar to a while loop but instead checks the condition\
    \ at the bottom of the loop.\n\n# DO LOOPS\n\nThe good thing about do... while\
    \ loop is that it's guaranteed to run through at least once. it's structure is:\
    \ do, followed by statements, condition. this is how it works.\n\n# STEP 1\n\n\
    Begin with a blank, C++ file and enter the standard headers:\n\n```\n#include\
    \ <iostream>\nusing namespace std;\n\nint main () {\n```\n\n# STEP 3\n\nNow, here's\
    \ a look at the structure of a do... while loop. First you create an integer named,\
    \ with the value of 1; Now the do... while begins. The code inside the body of\
    \ the loop is executed at least once, then the condition is checked for true or\
    \ false.\n\n```\n// Integer with the value of 1\nint num = 1;\ndo {\n  // While\
    \ loops begins\n  cout << \"Number: \" << num << endl; // Display the current\
    \ value of num\n  num = num + 1; // Add one to the value of num\n}\nwhile (num\
    \ < 30); // Tests the condition (true or false)\n```\n\n# STEP 2\n\nBegin with\
    \ a simple number count:\n\n```\n{\n  int num = 1;\ndo {\n    cout << \"Number:\
    \ \" << num << endl;\n    num = num + 1;\n  }\nwhile (num < 30);\n}\n```\n\n#\
    \ STEP 4\n\nIf the condition is true, the loop is executed. This continues until\
    \ the condition is false. When the condition is expressed as false, the loop terminates\
    \ and the code continues. You can create a loop where the condition continues\
    \ until the user enters a certain character.\n\n```\n// Declare variables\nint\
    \ count = 0;\nchar key;\ndo {\n  cout << \"Count: \" << count << endl; // Display\
    \ the current value of count\n  count = count + 1; // Add one to the value of\
    \ count\n  cin >> key; // Get the condition from the user input\n} while (key\
    \ != 'q'); // Press any key to continue\n```"
  merge: -1
  img_proc: true
