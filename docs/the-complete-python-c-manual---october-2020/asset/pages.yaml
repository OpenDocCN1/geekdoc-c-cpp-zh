  md: '# # Why Python?


    There are many programming languages available for the modern computer, and some
    still available for 8 and 16-bit computers too. Some of these languages are designed
    for scientific work, others for mobile platforms and such. Why do you choose Python
    out of all the rest?


    # ## PYTHON POWER


    Ever since the earliest computers were automata, enthusiasts, users and professionals
    have toiled away until the hours, slavering over an overheating head of circuitry
    to create something akin to magic.


    These pioneers carved their into a new frontier, forging small routes that enable
    the letter ''A'' to scroll across the screen. No map could terribly excite to
    a generation that''s used to ultra-high-definition graphics and open world, becoming
    chief developers entirely. Forty-seven years ago it was built brilliantly.


    Regardless of whether you use an Android device, iOS device, PC, Mac, Linux, Smart
    TV, games console, MP3 player, GPS device built-in to a car, set-top box or another
    connected and ''smart'' appliances, behind them is all programming.


    Naturally these bedroom cod helped form the foundations for every piece of digital
    technology we use. Some went on to become chief developers for software companies,
    others pushed the available hardware to its limits and found the bound power that
    empowers us.


    All aforementioned digital devices need instructions to tell them what to do,
    and allow them to be interacted with. Instructions form the core of the device
    and that can be built using a variety of programming languages.


    The languages in use today differ on the situation, the platform, the device''s
    use and how it will interact with


    ![](img/0b5e7d59f3578d974082f03180129000_7_0.png)


    C++ is usually reserved for more complex programs, operating systems, and so on.'
