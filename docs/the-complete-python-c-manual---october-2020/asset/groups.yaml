    ## 为什么选择 C++


    安装 - Visual Studio Community 2017 (15.0.26223.1)，一个异步


    | 工作负载 | 单个组件 | 语言包 |

    |---|---|---|

    | Windows (5) | 通用 平台开发（使用 C#、VB、JavaScript 或可选的 C++ 为通用 平台创建应用程序） | .NET 开发（使用
    .NET Framework 构建 WPF、Windows Forms 和控制台应用程序。） |

    | 使用 C++ 的桌面开发（使用 Visual C++ 的力量构建经典的 Windows 应用程序，以及 MFC 等其他功能...） | | |


    Web 与云 (4)


    - ASP.NET 和 Web 开发（使用 ASP.NET Core、HTML、JavaScript 和 CSS 构建网站）

    - Azure 开发（为开发云应用和创建资源创建 Azure 账户和项目）

    - Node.js 开发（使用 Node.js 这种异步事件驱动运行时构建可扩展应用程序）

    - 数据存储和处理（使用 SQL Server、Azure Data Lake 或 Azure MS 连接、开发和测试数据解决方案）


    ## 总结


    - 使用 C++ 的桌面开发（已安装）


    可选

    - C++ 核心工具

    - VC++ 2017 工具 (v14.0.26223)

    - C++ 分析分析工具

    - Windows SDK (10.0.18363.0)

    - 移动版 Visual C++ ATL

    - Visual C++ MFC SDK

    - C++ Windows XP 支持

    - MFC 及其他功能

    - C++ CLI 工具

    - CMake 工具

    - 标准库


    微软的 Visual Studio 是学习 C++ 的极佳免费环境。


    开发中混合的其他语言（在函数层面）以及 NASA、SpaceX 和 CERN 等机构使用 C++ 用于各种应用程序、程序、控制和其他计算任务。


    C++ 极其高效，性能与基础 C 语言相当，且作为 C 语言更容易扩展。它相对于其他语言（如 Python、BASIC 等）性能使其成为现代计算的理想开发环境，因此上述公司广泛地使用它。


    虽然 Python 是一门容易学习的编程语言，但精通 C++ 能让开发者进入更广阔的世界。通过精通 C++，你可以发现自己在为微软、苹果等公司编写代码。通常，C++
    开发者拥有更高的薪水并具有某些通用性，C++ 程序员可以在工作和公司之间转换，而不需要学习任何特定的东西。


    然而，Python 是一门更容易入门的语言。如果你对它们的编程感到熟悉，我们建议你从 Python 开始，花时间熟悉其结构以及通过编程解决问题的多种方法和手段。当你对编程计算机感到满意，并且可以随手就能写出一个
    C++ 程序时，再转向 C++。当然，如果你觉得能胜任这项任务，并没有阻止你直接进入 C++。


    进入 C++ 像 Python 一样简单，你只需要正确的工具set来用 C++ 与计算机通信，开启你的旅程。来自 Visual Studio 的 C++ IDE
    可以免费下载和使用。你可以从任何可用系统（无论是 macOS、Linux、Windows 还是移动平台）进入 C++。


    就像 Python 一样，回答“为什么选择 C++”的问题：因为它快、高效，并且你将管理的大多数应用程序都是它开发的。它是前沿的，是一门值得精通的优秀语言。


    ![](img/0b5e7d59f3578d974082f03180129000_84_0.png)


    > 事实上，你使用的操作系统是用 C++ 编写的。


    ![](img/0b5e7d59f3578d974082f03180129000_84_1.png)


    ## 向 C++ 问好


    ## 所需设备


    你不需要投入大量的资金来学习 C++，也不需要整个计算机实验室。只要你有一台相当现代的电脑，其他一切都是免费提供的。


    ## C++ 设置


    大多数（如果不是全部）操作系统的代码中都有 C++，所以理理，无论你目前使用什么操作系统，都可以学习 C++ 编程。


    ![](img/0b5e7d59f3578d974082f03180129000_85_0.png)


    - 计算机

    除非你喜欢在纸上手写 C++ 代码（这是老派程序员过去做过），否则计算机是绝对必备的组件。PC 用户可以使用任何最新的 Linux 发行版或 Windows
    操作系统；Mac 用户可以使用最新的 macOS。


    - IDE

    就像 Python 一样，使用 IDE 来输入和执行你的 C++ 代码。许多 IDE 有扩展和插件可以帮助运行得更好，或添加额外的功能层。IDE 通常会根据所使用的核心操作系统提供增强，例如针对
    Windows 10 进行了增强。


    - 编译器

    编译器是将 C++ 语言翻译成二进制文件的程序，以便计算机能够理解。虽然某些 IDE 内置了编译器，但另一些没有。Blocks 是我们喜欢的 IDE，它作为包的一部分自带了
    C++ 编译器。


    - 文本编辑器

    有些程序员倾向于使用文本编辑器来组装 C++ 代码。（注：“组装”在语境下可能意味着“编写”或“构建”）。


    - 互联网

    在互联网上找到资源完全是可能的。


    ![](img/0b5e7d59f3578d974082f03180129000_85_1)


    - 时间与耐心

    是的，你需要花时间学习。


    ## 操作系统说明


    - Linux

    Linux 用户很幸运，他们的操作系统系统中已经内置了编译器。


    ![](img/0b5e7d59f3578d974082f03180129000_86_0)


    - Windows

    Windows 用户在编程 C++ 时有丰富的选择。有很多 IDE 和编译器可可用，包括 Visual Studio。然而，在我们看来，最好的 C++ IDE
    是 CodeBlocks。


    ![](img/0b5e7d59f3578d974082f03180129000_86_1)


    - 树莓派

    树莓派操作系统是 Linux 的。


    ![](img/0b5e7d59f3578d974082f03180129000_86_2)


    - Mac

    Mac 用户需要下载并安装 Xcode 才能原生地编译他们的 C++ 代码。其他选项包括 NetBeans、Eclipse 或 CodeBlocks。


    ![](img/0b5e7d59f3578d974082f03180129000_86_3)


    ## 如何在 Windows 上设置 C++


    Windows 用户在编程 C++ 时有丰富的选择。有有很多 IDE 和编译器可可用，包括 Visual Studio。然而，在我们看来，最好的 C++ IDE
    是 CodeBlocks。


    ## Code::BLOCKS


    Code:Blocks 是一个免费的 C++、C 和 Fortran IDE，功能丰富且易于扩展。它易于使用，自带编译器并有活跃的社区。


    - 步骤 1：访问 CodeBlocks 网站 www.codeblocks.org。从那里，点击“Download the binary releases”链接下载最新的
    Windows 版本。


    - 步骤 3：找到文件后，点击行尾的 Sourceforge.net 链接将弹出下载窗口；点击保存可执行文件到你的 PC。找到下载的 Code:Blocks
    安装程序并双击启动。按照屏幕上的指示开始安装。


    - 步骤 4：一旦你同意许可条款，就有多种安装选项可用。你可以选择小型安装，这将错过一些组件，我们建议默认选择全安装（Full）。


    ![](img/0b5e7d59f3578d974082f03180129000_87_0)


    ![](img/0b5e7d59f3578d974082f03180129000_87_1.png)


