    \ comes as a pair, these are known as Key and Value. The Key part must be unique\
    \ and can be a number or string whereas the Value can be any data item like.\n\
    \n+   STEP 1 Let's say you want to create a dictionary in Python.\nYou would create\
    \ the dictionary name and enter the data in curly brackets, separating the key\
    \ and value by a colon\nKey:Value. For example:\n\n```\nphonebook={'Emma\": 1234,\
    \ \"Daniel\": 3456, \"Hannah\": 6789}\n```\n\n```\nPython 3.4.2 Shelln>>> phonebook['Emma']\n\
    1234\n>>> phonebook['Daniel']\n3456\n>>> phonebook['Hannah']\n6789\n>>> phonebook['David']\n\
    Traceback (most recent call last):\n  File \"<stdin>\", line 1, in <module>\n\
    File \"<string.py>\", line 105, in __getitem__\nKeyError: 'David'\n```\n\n+  \
    \ STEP 3 As with lists and tuples, you can check the contents of a dictionary\
    \ by giving the dictionary name:\nphonebook, in this example. this will display\
    \ the data items you're wanted by with no doubt however\n\n![](img/0b5e7d59f3578d974082f03180129000_49_0.png)\n\
    \n+   STEP 2 Just as with most lists, tuples and so on, strings must be enclosed\
