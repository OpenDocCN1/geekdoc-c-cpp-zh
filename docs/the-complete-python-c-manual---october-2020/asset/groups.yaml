    Online courses are good examples of where to take your coding skills next, even
    if you start from the beginner level. After an online course follows a strict
    coding convention, if you''re self-taught it might be worth seeing how other developers
    lay out their code, and what''s considered acceptable.


    > Learn to code interactively, for free.


    ![](img/0b5e7d59f3578d974082f03180129000_144_2.png)


    # TEACH CODE


    Can you teach? If your coding skills are spot on, consider approaching a college
    or university to see if they have a need for a programming teacher, perhaps a
    part-time or online. If not teaching, consider creating your own YouTube course
    how to code channel.


    ![](img/0b5e7d59f3578d974082f03180129000_144_3.png)


    # SOURCE CODE


    Get sharing, even if you think your code is not very good. The critique, advice
    and comments you receive back help iron out issues with your code, and you add
    them to your checklist. Alternatively your code might be utterly amazing but you
    won''t know unless you share it.


    # HARDWARE PROJECTS


    Contributing to hardware projects is a great resource for providing your code
    with others and learning from others. Many of the developer boards have postings
    for coders to apply for hardware projects, using unique code to get the most from
    the hardware that''s being designed.


