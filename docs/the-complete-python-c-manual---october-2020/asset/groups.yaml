    # How to Set Up Python in Linux


    Python version 2.x is already installed in most Linux distributions but we''re
    going to be using Python 3.x, there''s a little work we need to do first to get
    hold of it. Frankly, it''s not too difficult.


    # : "PYTHON PENGUIN"


    Linux is a versatile operating system that it''s often difficult to nail down
    one way of doing something. Different distributions go about installing software
    in different ways, so we will stick to Linux Mint 18.1 for this particular tutorial.


    +   STEP 1 First you need to ascertain which version of Python is currently installed
    in your Linux system; as mentioned, we''re going to use Linux Mint 18.1 for this
    section. As with macOS, drop it into a Terminal by pressing Ctrl+Alt+T.


    +   STEP 3 Some Linux distros will automatically update the installation of Python
    to the latest versions when the system is updated. To check, first do a system
    update and upgrade with:

    sudo apt-get update && sudo apt-get upgrade

    ter your password and let the system do any updates.


    ```

    File Edit View Search Terminal Help

    david@david-mint ~$

    david@david-mint ~

    ```


    ![](img/0b5e7d59f3578d974082f03180129000_17_0.png)


    +   STEP 2 Next enter: python --version into the Terminal. You should have the
    output relating to 2.x of Python in the display. Or in this particular case is
    Python 2.7.12.


    +   STEP 4 Once the update and upgrade is complete, you may need to say ''Y''
    to authorise any updates, enter: python3 --version to see if Python 3.x is updated
    or even installed. In the case of Linux Mint, we have Python 3.5.2, which is fine
    for our purposes.


    ```

    File Edit View Search Terminal Help

    david@david-mint ~ $ python --version

    Python 2.7.12

    david@david-mint ~ $

    ```


    ![](img/0b5e7d59f3578d974082f03180129000_17_1.png)


