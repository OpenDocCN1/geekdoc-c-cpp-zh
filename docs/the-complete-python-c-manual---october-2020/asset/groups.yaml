    \ Code:Blocks 编译器并检查了错误。你可以通过底部窗口查看 Build 的结果。任何代码质量的消息都会显示在这里。\n\n- 如果你的代码看起来和我们的截图类似，查看屏幕顶部的菜单栏。在顶部菜单的第一项下，你可以看到一组图标：黄色齿轮、绿色按钮和齿轮/播放按钮。这些是\
    \ Build、Run 和 Run 功能。\n- 现在点击 Run 图标（绿色按钮）。屏幕上出现了一个对话框：Hello, world!，后面是执行代码的时间，并要求你按键继续。太棒了，你刚刚编译并运行了你的第一个\
