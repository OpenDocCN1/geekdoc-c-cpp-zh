    \ Python）安装程序可能会包含不需要的功能。在“下一步”屏幕上，确保所有框框都已勾选并点击“下一步”。\n\n- **步骤 2** 点击对应版本的下载按钮。文件下载完成后，将文件保存到。\n\
    \n- **步骤 4** 确保所有框都已勾选并点击“下一步”。\n\n- **步骤 5** 但是，在关闭安装窗口之前，最好点击“下一步”。这将允许 Python\
    \ 绕过 260 个字符的限制。\n\n- **步骤 6** 但是，在关闭安装窗口之前，最好点击“下一步”。这将允许 Python 绕过 260 个字符的限制，让你能够执行程序。\n\
    \n- **步骤 7** Windows 10 用户现在会在“开始”按钮的“最近添加”部分找到 Python 3.x。第一个链接“Python 3.6 (32-bit)”在点击后将启动命令行版本的\
    \ Python（稍后会详细说明）。\n\n- **步骤 8** 如果你现在点击 Windows“开始”按钮，这次输入 CMD，就会出现命令提示符窗口。点击它进入\
    \ Windows 命令行。\n\n- **步骤 9** 在命令行中输入 Python，你需要输入：`python` 并按回车。\n\n- **步骤 10**\
