  - '[PAGE 21]


    # # Starting Python for the First Time


    We''re going to be using the Raspberry Pi as our Python 3 hardware platform. The
    latest version of Raspian comes preinstalled with Python 3, version 3.4.2 to be
    exact, so long as you have a version 3 Shell, all our code will work.


    # ## STARTING PYTHON


    We''re not going to go into the details of getting the Raspberry Pi up and running,
    there''s plenty of material already available on that subject. However, once you''re
    ready, fire up your Pi and get ready for coding.


    +   - STEP 1 With the Raspberry desktop loaded, click on the Menu button followed
    by Programming > Python 3 IDLE. This opens the Python 3 Shell. Windows and Mac
    users find the Python 3 IDLE Shell from the Windows Start menu and via Finder.


    +   - STEP 3 For example, in the Shell: Z+Z After pressing Enter, the next line
    displays the answer: 4. Basically, Python has taken the ''code'' and produced
    the relevant output.


    ![](img/0b5e7d59f3578d974082f03180129000_21_0.png)


    +   - STEP 2 The Shell is where you can enter code and see the responses and output
    of code you''ve produced. This is a kind of sandbox, where you''re able to try
    out some code and processes.


    +   - STEP 4 The Shell acts very much like a calculator, since code is basically
    a series of mathematical interactions with the screen. Integers, which are the
    infinite sequence of numbers can be easily added, subtracted, multiplied and so
    on.


    ![](img/0b5e7d59f3578d974082f03180129000_21_1.png)


    ![](img/0b5e7d59f3578d974082f03180129000_21_2.png)'
