    # Date and Time


    When working with date it often has access to the time. For example, you may want
    to time-stamp an entry or see at what time a user logged into the system and for
    how long. Luciferly acquiring the date and time is easy, thanks to the Time module.


    # TIME LORDS


    The time module contains functions that help you retrieve the current system time,
    reads the date from strings, formats the date and much more.


    +   **STEP 1** If you need to import the time module. It''s built-in to Python
    you shouldn''t need to drop a into command and install it. Once it''s imported,
    you can call the current date and time with a simple command:


    ```

    import time

    time.ctime()

    ```


    ![](img/0b5e7d59f3578d974082f03180129000_55_0.png)


    +   **STEP 3** You can see the structure of how time is presented by


    ```

    time.local_time()

    The output is displayed as: ''time_struct_time(tm_year=2017,tm_mon=9,tm_day=7,tm_hour=9,tm_min=6,tm_sec=13,tm_wday=3,tm_yday=250,tm_isdst=0)'';
    obviously dependent on your current time as opposed to the time above.

