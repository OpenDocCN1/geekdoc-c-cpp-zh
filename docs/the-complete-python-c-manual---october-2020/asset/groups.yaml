    # User Interaction


    There''s nothing as satisfying as creating a program that responds to you. The
    basic user interaction is one of the most taught aspects of any language and with
    it you''re able to do much more than simply greet your name.


    # HELLO, DAVE


    You have already used cout, the standard output stream, throughout our code. Now
    you''re going to be using cin, the standard input stream, to prompt a user response.


    +   - STEP 1 Anything that you want the user to input into the system memory,
    so can be retrieved and used. Therefore, any input must first be declared as a
    variable, so it''s ready to be used by the user. Start by creating a C++ file
    with headers.


    +   - STEP 3 The cin command works in the opposite way from the cout command.
    With the first cout line''What is your age?'' to the screen, as indicated with
    chevrons. Cin into opposite facing chevrons, indicating an input. The input is
    put into the integer age and called up in the second cout command. Build and run
    the code.


    ```

    #include <iostream>

    using namespace std;


    int main() {

    int age;

    cout << "What is your age: ";

    cin >> age;

    cout << "You are " << age << " years old.";

    }

    ```


    +   - STEP 2 The data type of the variable must also match the type of input you
    want from user. For example, to ask a user age, you would use an integer like
    this:


    ```

    #include <iostream>

    using namespace std;


    int main() {

    int age;

    cout << "What is your age: ";

    cin >> age;

    cout << "You are " << age << " years old.";

    }

    ```


    +   - STEP 4 If you''re asking a question, you need to store the input as a string;
    to ask the user name, you would


    ```

    #include <iostream>

    using namespace std;


    int main() {

    string name;

    cout << "What is your name: ";

    cin >> name;

    cout << "Hello, " << name << " I hope you have well today!\n";n}

    ```


