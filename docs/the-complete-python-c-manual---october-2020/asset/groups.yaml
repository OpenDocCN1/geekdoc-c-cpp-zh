    # STEP 5


    Adding to a dictionary is easy too. You can include a new data entry by adding
    the new key and phonebook


    phonebook["David"] = "0987 654 321"


    ```

    Python 3.4.2 Shell

    File Edit Shell Debug Options windows help

    >>> 3.4.2 (default, Oct 19 2013, 13:51:11)

    >>> (c) 2001-2013 Python Foundation, type "copyright" or "license" for more information.

    >>> phonebook = {\David": 1234, "Emma": 3456, "Hannah": 6789}

    >>> phonebook["Hannah"] = 6789

    >>> phonebook["David"] = "0987 654 321"

    >>> phonebook

    {''David'': ''0987 654 321'', ''Emma'': 3456, ''Hannah'': 6789}

    ```


    # STEP 8


    Next, you need to define the user inputs and variables: one for the person''s
    name, the other for their phone number-let''s keep it simple to avoid lengthy
    code:


    name=input("Enter name: ")

    number=int(input("Enter phone number: "))


    ```

    Python 3.4.2 Shell

    File Edit Shell Debug Options windows help

    >>> phonebook = {}

    >>> name=input("Enter name: ")

    >>> number=int(input("Enter phone number: "))

    >>> phonebook[name] = number

    ```


    # STEP 6


    You can also remove items from a dictionary by issuing the del command by the
    key; the value will be removed, as well as its pair of data:


    del phonebook["David"]


    ```

    Python 3.4.2 Shell

    File Edit Shell Debug Options windows help

    >>> 3.4.2 (default, Oct 19 2013, 13:51:11)

    >>> (c) 2001-2013 Python Foundation, type "copyright" or "license" for more information.

    >>> phonebook = {\David": 1234, "Emma": 3456, "Hannah": 6789}

    >>> del phonebook["David"]

    >>> phonebook

    {''Emma'': 3456, ''Hannah'': 6789}

    ```


    # STEP 9


    Note we keep the number as an integer even though the value can be a string or
    versa. You now need to add the user''s inputs to the newly blank dictionary. Using
    the same process in Step 5, you can


    phonebook[name] = number


    ```

    Python 3.4.2 Shell

    File Edit Shell Debug Options windows help

    >>> phonebook = {\Emma": 3456, "Hannah": 6789}

    >>> name=input("Enter name: ")

    >>> number=int(input("Enter phone number: "))

    >>> phonebook[name] = number

    ```


    # STEP 7


    This taking a step further, by creating a piece of code that will ask the user
    for their key and value! Create a new editor instance and start by coding in a
    new dictionary:


    phonebook = {}


    ```

    Python 3.4.2 Shell

    File Edit Shell Debug Options windows help

    >>> 3.4.2 (default, Oct 19 2013, 13:51:11)

    >>> (c) 2001-2013 Python Foundation, type "copyright" or "license" for more information.

    >>> phonebook = {}

    >>> name=input("Enter name: ")

    >>> number=int(input("Enter phone number: "))

    >>> phonebook[name] = number

    ```


    # STEP 10


    Now you save and execute the code, Python will ask for a name and a number. It
    will then insert into the newly blank dictionary, which you can do by entering
    into the:


    phonebook

    phonebook["David"]


    If the number needs to contain spaces you need to make it a string, remove the
    part of the input:


    ```

    Python 3.4.2 Shell

    File Edit Shell Debug Options windows help

    >>> phonebook = {}

    >>> name=input("Enter name: ")

    >>> number=input("Enter phone number: ")

    >>> phonebook[name] = int(number)

