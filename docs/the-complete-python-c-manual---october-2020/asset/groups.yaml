    # # Beginner C++ Mistakes


    There are many pitfalls the C++ developer can encounter, especially as this is
    a more complex and often unforgiving language to master. Beginners need to take
    C++ a step at a time and digest what they''ve learned before moving on.


    # ## VOID(C++, MISTAKES)


    Admittedly it''s not just C++ beginners who make the kinds of errors we outline
    on these pages, even hardened coders are prone to the odd mishap here. Here are
    some common issues to try and avoid.


    # ### UNDCLARED IDENTIFIERS


    A common C++ mistake, and to honest a common mistake with most programming languages,
    is when you output a variable that doesn''t exist. Displaying the value of x on-screen
    is free but not if you haven''t told the compiler what the value of x is to begin
    with.


    ![](img/0b5e7d59f3578d974082f03180129000_141_0.png)


    # ### STD NAMESPACE


    Referencing the Standard Library is common for beginners throughout your code,
    but if you miss the std::element of a statement, your code errors out when compiling.
    You can combat this by adding:


    ```

    using namespace std;

    ```


    Under the #include part and simply using cout, and so on with:


    ```

    #include <iostream>

    using namespace std;

    int main() {


    int a, b, c, d;

    a=10;

    b=20;

    c=30;

    d=40;


    cout << a, b, c, d;


    }

    ```


    # ### SEMICOLONS


    Remember that each line of a C++ program must end with a semicolon. If it doesn''t
    the compiler treats the lines with the same missing semicolon as the next semicolon.
    This creates all manner of problems when trying to compile, so don''t forget your
    semicolons.


    ```

    #include <iostream>

    ```


    ```

    int main() {


    int a, b, c, d;

    a=10;

    b=20;

    c=30;

    d=40;


    cout << a, b, c, d;


    }

    ```


    # ### GCC OR G++


    If you''re using Linux then you will not come across gcc and g++. In short, gcc
    is the GNU Compiler (or GNU Compiler as it is to be called) and g++ is the GNU
    (the C++ version) of the compiler. If you''re using Windows then you need to use
    g++, as the correct compiler will be decided for you.


    ```

    david-mint-mate ~/Documents

    david-mint-mate: g++ test1.cpp -o test

    /tmp/ccsa2htg.o: In function main''

    test1.cpp:(0+6x): undefined reference to `std::cout''

    test1.cpp:(0+6x1f): undefined reference to `std::ostream''

    t/tmp/ccsa2htg.o: In function static_initialization_and_dest

    test1.cpp:(0+6x25): undefined reference to `std::ios_base::collect2''

    collect: returned 1 exit status

    david-mint-mate: g++ test1.cpp -o test

    david-mint-mate: ~/Documents

    ```'
