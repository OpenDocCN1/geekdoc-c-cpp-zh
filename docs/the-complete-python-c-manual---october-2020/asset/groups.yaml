    # # How to Set Up C++ in Windows


    Windows users have a wealth of choice when it comes to programming in C++. There
    are plenty of IDEs and compilers available, including Visual Studio from Microsoft.
    However, in our opinion, the best C++ IDE to begin with is CodeBlocks.


    # ## Code::BLOCKS


    Code:Blocks is a free C++, C and Fortran IDE features rich and easily extensible
    with plug-ins. It''s easy to use, comes with a compiler and a vibrant community
    behind it.


    +   **STEP 1** By visiting the Code:Blocks site, at www.codeblocks.org/downloads.
    From there, click on the ''Download the binary releases'' link to be the latest
    downloaded version for Windows.


    +   **STEP 3** When you''ve located the file, click on the Sourceforge.net link
    at the end of the line and download notification window appears; Click Save the
    executable to your PC. Locate the downloaded Code:Blocks installer and double-click
    to start. Follow the on-screen instructions to begin the installation.


    ![](img/0b5e7d59f3578d974082f03180129000_87_0.png)


    +   **STEP 4** Once you''ve agreed to the licensing terms, there is a choice of
    installation options available. You can opt for small install, missing out some
    of the components you would recommend opt for the Full option as default.


