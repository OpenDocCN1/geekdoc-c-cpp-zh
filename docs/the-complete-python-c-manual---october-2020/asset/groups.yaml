    sudo apt-get install libreadline-dev libssl-dev\libncursesw5-dev libsqlite3-dev
    tk-dev

    libgdbm-dev libncurses6-dev

    ```


    # STEP 8


    Within the Python folder, enter:

    ./configure

    sudo make altinstall


    This could little while depending on the speed of your computer. Once finished,
    use python.6 --version to check the installed version.


    ![](img/0b5e7d59f3578d974082f03180129000_18_0.png)


    # STEP 6


    Open your Linux web browser and go to the Python download page: www.python.org/downloads.
    Click on the Download Python 3.6.2 (or version''s on when you look) to download
    the Source-Python-3.6.2.tar.gz.


    ![](img/0b5e7d59f3578d974082f03180129000_18_1.png)


    # STEP 9


    For the GUI IDE, you need to enter the command into the Terminal:


    ```

    sudo apt-get install idle3

    ```


    The IDE can be started with the command: idle3. Note that IDLE runs different
    from the one you installed from source.


    # STEP 7


    In the Terminal, download the contents of the Python source code with: tar -xvf
    Python-3.6.2.tar.gz. Then enter the newly installed folder with cd Python-3.6.2/


    # STEP 10


    You need pip (Pip Packages) which is a tool to help you install modules and extras.

    Enter: apt-get install python3-pip


    ```

    pip3 --upgrade pip

    ```


    When complete, the Python and Python 3 will be available via the Programming Environment
    in your distro''s.


