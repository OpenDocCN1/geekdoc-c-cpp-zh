    ## Saving and Executing Your Code


    Whilst working in the IDLE Shell is perfectly fine for small code snippets, it''s
    not designed for enduring longer programs. In this section you''re going to be
    introduced to the IDLE Editor, where you will be working from now on.


    ## EDITING CODE


    You will eventually reach a point where you have to move on from inputting single
    lines of code into the Shell. Instead, the IDLE Editor will allow you to save
    and execute your Python code.


    - STEP 1 First, open the Python IDLE Shell when it''s up, click on File -> New
    File. This will open a new window with Untitled as its name. This is the Python
    IDLE Editor and you can enter the code needed to create your future programs.

    - STEP 2 The IDLE Editor is, for all intents and purposes, a simple text editor
    with Python features, coding and so on; much in the same vein as Sublime. You
    enter the code as you want within the Shell, taking an example from the previous
    tutorial, enter:

    - STEP 3 You can see that the same colour coding is in place in the IDLE Editor
    as it is in the Shell, enabling you to better understand what''s going on with
    your code. however, to execute the code you need to first save it. Press F5 and
    you get a Save... box open.

    - STEP 4 Click on the OK button in the Save box and select a destination where
    you''ll save all your Python code. The destination is a dedicated folder called
    Python or you can just dump it wherever you like. Remember to keep a tidy drive
    though, to help you out in the future.


    ```python

    print("Hello everyone!")

    ```


    - STEP 5 Enter a name for your code, ''print hello'' for example, and click on
    the Save button. Once the Python code is saved or executed it will be detailed
    in the IDLE Shell. In this case, words the ''Hello everyone''.

    - STEP 6 This is how the vast majority of your Python code will be conducted.
    Enter it into the Editor, F5, save the code and look at the output in the Shell.
    Sometimes things will differ, depending on whether you''ve requested a separate
    window, but essentially that''s the process you will use with this tool, otherwise
    stated.

    - STEP 7 If you open the file of the saved Python code, this is the default Python
    file name. Any code you create will be a .py extension. whatever you create, and
    any code you download from the internet Python resources will be .py. Just ensure
    that the code is written for Python.

    - STEP 8 Let''s extend the code and enter a few examples from the previous tutorial:


    ```python

    a=2

    b=2

    name="David"

    surname="Hayward"

    print(name, surname)

    print(a+b)

    ```

    - STEP 9 If you click the OK button, the file will be overwritten with the new
    code entries, and executed with the output in the Shell. It''s not a problem with
    just a few lines, but if you edit a larger file, overwriting can become an issue.
    Save As From the Editor to create a.

    - STEP 10 Now create a new file. Open the Editor, and a new instance (File > New
    File from the Shell). Enter the following and save it hello:


    ```python

    a="Python"

    b="16"

    c="hello!"

    print(a, b, c)

    ```


    You will use this code in the next tutorial.


    ## Executing Code from the Command Line


    Although we''re working from the GUI IDLE throughout this book, it''s worth taking
    a look at Python''s command line handling. We already know there''s a command
    line version of Python but it''s also used to execute code.


    ## COMMAND THE CODE


    Using the code in the previous tutorial, one we named hello.py, let''s see how
    you can run code that was made in the GUI at the command line level.


    - STEP 1 Python, in Linux, with two possible ways of executing code via the command
    line. One of the ways is with Python 2, whilst the others use the Python 3 libraries
    and so on. First though, drop into the command line or Terminal on your operating
    system.

    - STEP 2 Just as before, Windows users need to click the Start button and search
    for CMD, and macOS users can access their command line by clicking Go > Utilities
    > Terminal.

    - STEP 3 Now you''re at the command line we can start Python. For Python 3 you
    need to enter the command python and press Enter. This will put you into the command
    line version of the Shell, with the familiar arrows (>>).

    - STEP 4 From here you''re able to enter the code you''ve looked at previously,
    such as:


    ```python

    print(a)

    ```

    You can see that it works exactly the same.


    - STEP 5 Now enter exit() to leave the command line and return back to the command
    prompt. Enter the folder where you saved the code from the previous tutorial and
    hopefully you will see hello.py.

    - STEP 6 From within the same folder as the code you''re going to run, enter the
    following command: `python3 hello.py`

    - STEP 7 Naturally, if you are using Python 3, using the syntax and layout that''s
    unique to Python 3, it will only work when you use the python 2 command by entering:
    `hello.py`

    - STEP 8 The result of running Python 2 code from is quite obvious. While it doesn''t
    error out in any way, due to the differences between the way Python 3 handles
    over Python 2, the result is not as we expect. Using Sublime for the moment, open
    hello.py.

    - STEP 9 Since Sublime isn''t available for Raspberry Pi, you''re going to temporarily
    leave the Pi for a moment and use it as an example that you don''t need to use
    IDLE. With the hello.py file, open it to include the following:


    ```python

    name=input("What is your name?")

    print("hello", name)

    ```

    This will execute the code, which will remind you to:

    ```python

    a="Python"

    b="is"

    c="cool"

    print(a, b, c)

    ```

    - STEP 10 Save the hello.py file and drop back to the command line. Now execute
    the newly saved `python3 hello.py`. The result will be the original Python 3 code
    is cool!, together with the input command you added, and displaying it in the
    window.


    ## Numbers Expressions


    We''ve seen some basic mathematical expressions with Python, simple addition and
