    \n步骤 7 注意到 Code:Blocks 在行下方自动创建了对应的大括号并将它们连接，形成缩进。这是由于 C++ 的结构决定的，也是输入代码主体的地方。现在输入：\n\
    \n步骤 10 这就是你需要做的所有操作。它看起来可能并不神奇，但 C++ 最适合通过小块来吸收。不要忘记先看 C++ 程序的结构；然后你就可以构建并运行代码了。现在，点击保存磁盘图标。\n\
    \n```cpp\n//我的第一个 C++ 程序\n```\n\n![](img/0b5e7d59f3578d974082f03180129000_98_4.png)\n\
    \n![](img/0b5e7d59f3578d974082f03180129000_98_5.png)\n\n## C++ 程序的结构\n\nC++ 有非常明确结构和处理方式。漏掉任何内容，即使只是一个分号，你的整个程序将无法编译和执行。许多专业程序员都曾在结构疏忽上栽过头。\n\
    \n### #include <iostream>\n\n通过学习编程基础，你开始理解程序的结构。命令在不同语言之间可能不同，但你将开始看到代码是如何运行的。\n\
    \n| C++ | |\n| :--- | :--- |\n| C++ 由丹麦人 Bjarne Stroustrup 于 1979 年发明，作为他博士学位论文的一部分。最初\
    \ C++ 被称为“带类的 C”，它为流行的 C 编程语言增加了功能，通过新的结构使其成为一个更用户友好的环境。 | |\n\n| 从这里开始 | *helloworld.cpp\
    \ |\n| :--- | :--- |\n| 1 | #include <iostream> |\n| 2 | |\n| 3 | |\n| 4 | |\n\
    | 5 | |\n\n**#include**\n\nC++ 程序的结构非常精确。每个 C++ 代码都以指令开头。**#include** 指令预处理器包含标准\
    \ C++ 的某部分。例如：**#include <iostream>** 包含了 i 头文件以支持输入输出操作。\n\nBjarne Stroustrup，C++\
    \ 的发明者。\n\n| 从这里开始 | *helloworld.cpp |\n| :--- | :--- |\n| 1 | #include <iostream>\
    \ |\n| 2 | |\n| 3 | |\n| 4 | |\n| 5 | |\n| 6 | |\n\n**int main()**\n\nmain() 启动了函数的声明，它是名为\
    \ 'main' 的的一组代码语句。所有 C++ 代码都从函数开始，无论它位于代码的哪个位置。\n\n#### 大括号\n\n| #include <iostream>\
    \ |\n| :--- |\n| int main() |\n| { |\n| } |\n\n左大括号（括号）是你以前可能没见过的东西，特别是如果你习惯了\
    \ Python。左大括号表示 main 函数的开始，并包含了该函数的所有代码。\n\n## C++ 程序的结构\n\n### 注释\n\n带有双斜杠的行是注释。这意味着它们不会在代码中执行，并会被编译器忽略。注释旨在帮助你，或者查看你代码的另一个程序员解释正在发生什么。注释有两种类型：//\
    \ 覆盖多行（注：原文如此），以双斜杠开头的注释。这意味着它们不会被编译器忽略。\n\n<< 这里使用的尖括号是插入运算符。这意味着尖括号后的任何内容都将被插入到\
    \ `std::cout` 语句中。在这种情况下它们是 'Hello, world'。\n\n```cpp\n#include <iostream>\nint\
    \ main() {\n    std::cout << \"Hello, world!\";\n    return 0;\n}\n```\n\n## 编译与执行\n\
    \n你已经创建了第一个 C++ 程序，现在理解了它的结构。让我们让它动起来，编译并执行（或者如果你愿意，运行）程序并看看效果如何。\n\n## 来自 C++\
