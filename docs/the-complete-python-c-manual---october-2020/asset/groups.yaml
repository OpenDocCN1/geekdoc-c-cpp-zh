    \    a = a - 1;\n    Sleep(1000);\n}\n```\n\n```cpp\ncout << \"\\nBlast Off!\"\
    \ << endl;\nreturn 0;\n```\n\n## for 循环\n\n在某些方面，for 循环的工作方式与 while 循环非常相似，尽管它的结构不同。for\
    \ 循环分为三个阶段：初始化器、条件和增量步骤。一旦设置好，循环就会重复执行，直到条件变为假。\n\n### 循环 (LOOP LOOPS)\n\nfor\
    \ 循环的初始阶段只执行一次，并设置循环的引用点。循环会评估条件以判断其真 假，然后进行递增。循环重复第二、第三阶段。\n\n- 1. 创建一个新的 C++\
    \ 文件，并包含标准头文件：\n\n```cpp\n#include <iostream>\nusing namespace std;\n\nint main()\
    \ {\n\n}\n```\n\n- 2. 在循环之后，你在大括号（花括号）中创建了一个复合语句，显示整数的当前值。每当 for 循环重复执行（第二和第三阶段）时，它会加上条件\
    \ <30 为假。循环结束，代码继续执行，几乎以 return 0 结束。\n\n```cpp\n// For循环开始\nfor (int num = 1;\
    \ num < 30; num = num + 1) {\n    cout << \"Number: \" << num << endl;\n}\nreturn\
    \ 0;\n}\n```\n\n- 3. 从简单开始，创建一个从 1 计数到 30 的 for 循环，并在屏幕上显示值：\n\n```cpp\n// For循环开始\n\
    for(int num = 1; num < 30; num = num + 1) {\n    cout << \"Number: \" << num <<\
    \ endl;\n}\nreturn 0;\n}\n```\n\n通过处理 for 循环的过程，创建一个整数 num 并给它赋值为 1。接下来，设置条件，在此情况下为\
    \ num 小于 30。最后一个阶段是创建增量的地方；这里数字的值被赋值为：\n\n```cpp\n// For循环开始\nfor(int num = 1;\
    \ num < 30; num = num + 1)\n```\n\nfor 循环是 C++ 中一个非常整洁的封装，包含在括号内，而循环的其他元素则会被显示。如果你想创建一个\
    \ 10 秒的倒计时，可以使用：\n\n```cpp\n#include <iostream>\n#include <windows.h>\nusing namespace\
    \ std;\n\nint main() {\n    // For循环开始\n    for (int a = 10; a != 0; a = a - 1)\
    \ {\n        cout << a << endl;\n        Sleep(1000);\n    }\n    cout << \"\\\
    nBlast Off!\" << endl;\n    return 0;\n```\n\n## 步骤 6\n\n对于倒计时代码，不要忘记包含 windows.h\
    \ 库，这样你就可以使用 Sleep 命令。构建并运行代码；在控制台中你可以看到每秒一次的倒计时，直到达到零并 Blast Off!\n\n```\nC:\\\
    Users\\id\\ForLoop.exe\n```\n\n![](img/0b5e7d59f3578d974082f03180129000_128_0.png)\n\
    \n## 步骤 9\n\nfor 循环显示用户输入乘法表的示例。对学生非常有用：\n\n```cpp\nint n;\ncout << \"Enter a\
    \ number to view your table:\";\ncin >> n;\nfor (int i = 1; i <= n; i++) {\n \
    \   cout << i << \" x \" << n << \" = \" << i * n << \"\\n\";\n}\nreturn 0;\n\
    ```\n\n## 步骤 7\n\n当然，你可以使用用户输入向我们的循环添加更多内容：\n\n```cpp\nint i, fact = 1;\ncout\
    \ << \"Enter a whole number: \";\ncin >> n;\nfor (int i = 1; i <= n; i++) {\n\
    \    fact *= i;\n}\ncout << \"\\nFactorial of \" << n << \" = \" << fact << \"\
    \\n\";\nreturn 0;\n```\n\n![](img/0b5e7d59f3578d974082f03180129000_128_1.png)\n\
    \n## 步骤 10\n\n整数 i 的值可以从 1 扩展到任何你需要的数字，在过程中显示乘法表）。当然，for 循环的数据类型不需要是整数，只要它能运行即可。\n\
    \n```cpp\nfor (float i = 0; i < 10; i += 1) {\n    cout << i << \" << endl;\n\
    }\nreturn 0;\n```\n\n## 步骤 8\n\n步骤 7 的代码在构建和运行时，通过循环使用该数字。用户的数字存储在整数 n 中，随后使用阶乘检查条件真假，每次增加并与用户的数字\
    \ n 进行比较。\n\n```\nC:\\Users\\id\\ForLoop.exe\n```\n\n![](img/0b5e7d59f3578d974082f03128_2.png)\n\
    \n## do...while 循环\n\ndo...while 循环与 for 循环甚至 while 循环略有不同。for 和 while 都在循环开始时设置并检查条件的状态，或者如果你喜欢放在循环顶部。然而，do...while\
    \ 循环与 while 循环相似，但在循环底部检查条件。\n\n### DO 循环 (DO LOOPS)\n\ndo...while 循环的好处是它保证至少运行一次。它的结构是：do，后面跟着语句，条件。这就是它的工作方式。\n\
    \n## 步骤 1\n\n从一个空白的 C++ 文件开始，输入标准头文件：\n\n```cpp\n#include <iostream>\nusing namespace\
    \ std;\n\nint main () {\n```\n\n## 步骤 3\n\n现在，看一下 do...while 循环的结构。首先，你创建一个名为\
    \ num 的整数，值为 1；现在 do...while 开始。循环体内的代码至少执行一次，然后检查条件的真假。\n\n```cpp\n// 值为 1 的整数\n\
    int num = 1;\ndo {\n  // while循环开始\n  cout << \"Number: \" << num << endl; //\
    \ 显示 num 的当前值\n  num = num + 1; // 给 num 加 1\n}\nwhile (num < 30); // 测试条件（真或假）\n\
    ```\n\n## 步骤 2\n\n从简单的数字计数开始：\n\n```cpp\n{\n  int num = 1;\ndo {\n    cout <<\
    \ \"Number: \" << num << endl;\n    num = num + 1;\n  }\nwhile (num < 30);\n}\n\
    ```\n\n## 步骤 4\n\n如果条件为真，则执行循环。这会持续到条件为假。当条件被表达式为假时，循环终止，代码继续。你可以创建一个循环，直到用户输入某个字符条件才会持续。\n\
    \n```cpp\n// 声明变量\nint count = 0;\nchar key;\ndo {\n  cout << \"Count: \" << count\
    \ << endl; // 显示 count 的当前值\n  count = count + 1; // 给 count 加1\n  cin >> key;\
    \ // 从用户输入获取条件\n} while (key != 'q'); // 按任意键继续\n```\n\n"
