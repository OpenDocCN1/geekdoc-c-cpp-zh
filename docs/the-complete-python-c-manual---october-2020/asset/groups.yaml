    # Lists


    Lists are one of the most common types of data structures you will come across
    in Python. A list is a simple collection of items, or data if you prefer, that
    can be accessed as a whole, or individually if wanted.


    # WORKING WITH LISTS


    Lists are extremely handy in Python. A list can be strings, integers and also
    variables. You can even include functions in lists, and within lists.


    +   - A list is a sequence of data values called items. You create the name of
    your list by an equals sign, then use square brackets to separate the items by
    commas; note that lists use quotes:


    ```

    numbers = [1, 4, 7, 21, 98, 156]

    mythical_creatures = ["Unicorn", "Balrog", "Vampire", "Dragon", "Minotaur"]

    ```


    ![](img/0b5e7d59f3578d974082f03180129000_45_0.png)


    STEP 3 You can access, or index, the list in a list by using the minus sign before
    the item number [-1], or the second last item [-2] and so on. Trying to reference
    an item that isn''t in the list, such as [10] will return an error:


    ```

    numbers[-1]

    mythical_creatures[-4]

    ```


    ![](img/0b5e7d59f3578d974082f03180129000_45_1.png)


    STEP 2 Once you''ve defined your list you can call each item by referring by its
    name. Lists start the first item entry as 0, followed by 1, 2, 3 and so on. For
    example:


    numbers


    To call the entire contents of the list:


    numbers[3]


    To call the third zero item in the list (21 in this case):


    ![](img/0b5e7d59f3578d974082f03180129000_45_2.png)


    STEP 4 Slicing is similar to indexing but you can retrieve multiple items in a
    list by separating item numbers with a colon.


    numbers[1:3]


    Will output the 4 and 7, being item numbers 1 and 2. Note that the returned values
    do not include the second index (position) so numbers[1:3] will return 4 to 7,
    21.


    ![](img/0b5e7d59f3578d974082f03180129000_45_3.png)'
