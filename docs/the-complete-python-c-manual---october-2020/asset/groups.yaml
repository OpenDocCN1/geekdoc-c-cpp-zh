    | 3 | 小时 | 0 到 23 |

    | 4 | 分钟 | 0 到 59 |

    | 5 | 秒 | 0 到 61 (或 60) |

    | 6 | 周几 | 0 到 6 (0 是周一) |

    | 7 | 年日 | 1 到 366 (儒略) |

    | 8 | 夏令时 | -1, 0, 1 (意味着 DST) |


    **步骤 4** time 模块中内置了许多函数。最常用的之一是 `.strftime()`。通过它你可以呈现广泛的参数，因为它将时间元组转换为字符串。例如，要显示当前的星期几，你可以使用：


