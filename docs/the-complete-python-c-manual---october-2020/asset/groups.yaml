    \        os.makedirs(dir_dst)\n    for file in files:\n        src_file = os.path.join(root_src,\
    \ file)\n        dst_file = os.path.join(dir_dst, file)\n        if not os.path.exists(dst_file):\n\
    \            shutil.copy2(src_file, dst_file)\nprint(\">>>>Backup complete<<<<<<\"\
    )\n```\n\n![](img/0b5e7d59f3578d974082f03180129000_70_4.png)\n\n![](img/0b5e7d59f3578d974082f03180129000_70_5.png)\n\
    \n# Random 模块\n\nrandom 模块你在 Python 编程生命中会遇到很多；正如名称所示，它设计用于创建随机数字或字母。然而，它并不是真正的随机，但足以满足大多数需求。\n\
    \n# 随机数\n\nrandom 模块中有许多函数，应用后可以创建一些有趣且实用的 Python 程序。\n\n- **第 1 步** 就像其他模块一样，在使用任何一个函数之前需要导入\
    \ `random`。我们将详细查看。让我们从简单打印一个 1 到 5 之间的随机数开始：\n\n```python\nimport random\nprint(random.randint(0,5))\n\
    ```\n\n![](img/0b5e7d59f3578d974082f03180129000_71_0.png)\n\n- **第 2 步** 在我们的示例中，返回的\
    \ `home` 变量是系统中当前用户的文件夹。`/home/pi` 将取决于你使用的操作系统。Windows 10 将输出：`C:\\Program Files\
    \ (x86)\\Python36`。\n\n![](img/0b5e7d59f3578d974082f03180129000_71_1.png)\n\n\
    - **第 3 步** 对于更大的数字集，你可以通过以下方式扩展浮点数数字：\n\n```python\nimport random\nprint(random.random()*100)\n\
    ```\n这将显示 0 到 100 之间的点。\n\n![](img/0b5e7d59f3578d974082f03180129000_71_2.png)\n\
    \n# 第 6 步 有趣的是，你可以使用 random 模块来打乱列表中的项，从而在方程中增加一些随机性：\n\n```python\nimport random\n\
    random.shuffle(list)\n```\n这种方式可以让你从列表中选择随机项。\n\n- **第 9 步** 让我们使用一个抛掷硬币的示例来统计正面或反面：\n\
    \n```python\nimport random\noutput={\"Heads\":0, \"Tails\":0}\ncoin=list(output.keys())\n\
    for i in range(10000):\n    output[random.choice(coin)]+=1\nprint(\"Heads:\",\
    \ output[\"Heads\"])\nprint(\"Tails:\", output[\"Tails\"])\n```\n\n![](img/0b5e7d59f3578d974082f03180129000_72_0.png)\n\
    \n![](img/0b5e7d59f3578d974082f03180129000_72_1.png)\n\n# 第 7 步 使用 `shuffle`，你可以创建一个完全随机的数字列表。从给定的范围开始：\n\
    \n```python\nimport random\nlist=[i for i in range(20)]\nrandom.shuffle(list)\n\
    print(list)\n```\n继续打乱列表，你可以每次从 0 到 20 中选择不同的项目。\n\n# 第 10 步 使用一个包含 4666 个单词的文本文件，你可以从该文件中生成用户请求数量的单词：https://github.com/dwyl/english-words\n\
    \n```python\nimport random\nwith open('words.txt', 'r') as f:\n    words = f.read().split()\n\
    print(random.choice(words))\n```\n\n# 第 8 步 你可以在给定的步长内选择随机数，使用 start、stop、step\
    \ 循环：\n\n```python\nimport random\nfor i in range(10):\n    print(random.randrange(0,\
    \ 200, 7))\n```\n结果将让你了解它是如何运作的。\n\n![](img/0b5e7d59f3578d974082f03180129000_72_4.png)\n\
    \n![](img/0b5e7d59f3578d974082f03180129000_72_5.png)\n\n"
