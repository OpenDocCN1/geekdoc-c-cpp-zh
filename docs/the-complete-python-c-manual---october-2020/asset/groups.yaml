    # 字符串格式化


    当你处理数据、创建列表、字典和对象时，可能经常想要输出结果。将字符串与数据合并是很容易，特别是在 Python 3 中，因为早期的 Python 版本往往会把事情变得复杂。


    # 字符串格式化


    从 Python 3 开始，字符串格式化变成了一个更加整洁的过程，使用了 `.format()` 函数结合大括号。这比以前的方法更具逻辑，也更好。


    ### 步骤 1

    Python 中的基础格式化是使用大括号将每个变量引入字符串中：

    ```python

    name="Conan"

    print("the barbarian hero of the Hyborian Age is: {}".format(name))

    ```


    ### 步骤 3

    你也可以将整数包含其中：

