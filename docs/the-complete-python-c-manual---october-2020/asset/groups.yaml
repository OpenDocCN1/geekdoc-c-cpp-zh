  md: "\n# Working with Code\n\n## Where Next?\n\nCoding, like most subjects, is a\
    \ continual learning experience. You may not classify yourself as a beginner but\
    \ you still need to test your code, learn new tricks and hacks to make it more\
    \ efficient and even branch out and learn another programming language.\n\n##\
    \ INCLUDE: KEEP ON LEARNING\n\nWhat can you do to further your skills, learn new\
    \ coding practices, and present your code and even begin to help others using\
    \ what you've experienced so far?\n\n## TWITTER\n\nTwitter isn't all trolls and\
    \ antagonists, but millions of people who are more willing to spread their coding\
    \ knowledge. We recommend finding a few you can relate to and follow them. Often\
    \ they post great tips, hacks and fixes for common coding problems.\n\n![](img/0b5e7d59f3578d974082f03180129000_143_0.png)\n\
    \n## OPEN PROJECTS\n\nLook for open projects that you like the sound of and offer\
    \ to contribute to the code to keep it alive and up to date. There are millions\
    \ of projects to choose from, so start and see where they need help. It may be\
    \ a minor code update but it's a noble occupation for coders to get into.\n\n\
    ![](img/0b5e7d59f3578d974082f03180129000_143_1.png)\n\n## KEEP CODING\n\nIf you've\
    \ mastered Python fairly well, then turn your attention to C++ or C#. Keep your\
    \ Python coding skills while learning a new language opens the old brain trick\
    \ nicely and gets you into another community, and see how they do differently.\n\
    \n## SHARE SKILLS\n\nBecome active on coding and development knowledge sites,\
    \ such as StackExchange. If you have the skills to start and help others, you\
    \ won't really feel good for doing so alone by interacting with other mentors.\n\
    \n```cpp\n#pragma once\n#define EXP_ME_FILE_ = __LINE__\nconst double pi = 3.14159;\n\
    int left_decay(double x) = 0;\ntemplate<typename T>\nstruct foo {\n    static_assert(std::is_floating_point<T>::value,\
    \ \"T must be a floating point\");\n    T func() {};\n};\nstruct A {\n    ~A()\
    \ {}\n    virtual void func() {}\n};\ntemplate<typename T>\nconcept EqualityComparable\
    \ = requires(T a, T b) {\n    a == b;\n};\n```\n\n![](img/0b5e7d59f3578d974082f03180129000_143_2.png)\n\
    \n## GOING MOBILE\n\nThe mobile market is a great place to test your coding skills\
    \ and present any games or apps you've created. If your app is good, then it could\
    \ be the next great thing to appear on the app stores. It's a great learning experience\
    \ nevertheless, and something worth considering.\n\n## PORTFOLIOS\n\nIf you've\
    \ learned how to code with an eye for a developer job in the future, then it's\
    \ worth starting to build an online portfolio of code. Look at job postings and\
    \ see what skills they require, then learn and code something with those skills\
    \ and add it to your portfolio. When it comes to applying, include a link to your\
    \ portfolio.\n\n## My Work\n\nWant to see more examples? Email me.\n\n![](img/0b5e7d59f3578d974082f03180129000_144_0.png)\n\
    \n## Chronicles.org\n\nChronicles.org is a platform where developers can write\
    \ stories about their coding journey. It's a great place to share your experiences,\
    \ get feedback, and showcase your projects. Connect with others and design a new\
    \ style.\n\n![](img/0b5e7d59f3578d974082f03180129000_144_1.png)\n\n## ONLINE LEARNING\n\
    \nOnline courses are good examples of where to take your coding skills next, even\
    \ if you start from the beginner level. After an online course follows a strict\
    \ coding convention, if you're self-taught it might be worth seeing how other\
    \ developers lay out their code, and what's considered acceptable.\n\n> Learn\
    \ to code interactively, for free.\n\n![](img/0b5e7d59f3578d974082f03180129000_144_2.png)\n\
    \n## TEACH CODE\n\nCan you teach? If your coding skills are spot on, consider\
    \ approaching a college or university to see if they have a need for a programming\
    \ teacher, perhaps a part-time or online. If not teaching, consider creating your\
    \ own YouTube how to code channel.\n\n![](img/0b5e7d59f3578d974082f03180129000_144_3.png)\n\
    \n## SOURCE CODE\n\nGet sharing, even if you think your code is not very good.\
    \ The critique, advice and comments you receive back help iron out issues with\
    \ your code, and you add them to your checklist. Alternatively your code might\
    \ be utterly amazing but you won't know unless you share it.\n\n## HARDWARE PROJECTS\n\
    \nContributing to hardware projects is a great resource for providing your code\
