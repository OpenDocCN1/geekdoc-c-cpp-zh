  - '[PAGE 109]


    # Strings


    Strings are objects that represent and hold sequences of characters. For example,
    you could have a universal greeting in your code ''Welcome'' and assign that as
    a string to be called up wherever you like in the program.


    # STRING THEORY


    There are different ways in which you can create a string of characters, which
    historically are all carried over from the original C language, and are still
    supported by C++.


    +   STEP 1 To create a string using the char function. Open a new C++ file and
    begin with the usual header:


    ```

    #include <iostream>

    using namespace std;


    int main() {


    }

    ```


    ![](img/0b5e7d59f3578d974082f03180129000_109_0.png)


    +   STEP 3 Build and run the code, and ''Welcome'' appears on the screen. While
    this is perfectly fine, it''s not a string. A string is a class, which defines
    objects that can be represented as a stream of characters and doesn''t need to
    be terminated like an array. The code can therefore be represented as:


    ```

    #include <iostream>

    using namespace std;


    int main() {


    char greet[] = "Welcome";

    cout << greet << "\n";

    \}

    ```


    ![](img/0b5e7d59f3578d974082f03180129000_109_1.png)


    +   STEP 2 It''s easy to confuse a string with an array. Here''s an array, which
    can be terminated with a null character:


    ```

    #include <iostream>

    using namespace std;


    int main() {


    char greet[8] = {''W'', ''e'', ''l'', ''l'', ''c'', ''o'', ''m'', ''\0''};

    cout << greet << "\n";


    }

    ```


    ![](img/0b5e7d59f3578d974082f03180129000_109_2.png)


    +   STEP 4 In C++ there''s also a string, which works in the same way. Using the
    greeting code again, you can enter:


    ```

    #include <iostream>

    using namespace std;


    int main() {


    string greet = "Welcome";

    cout << greet << "\n";

    \}

    ```


    ![](img/0b5e7d59f3578d974082f03180129000_109_3.png)'
