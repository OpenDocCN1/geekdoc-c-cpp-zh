    \n## Python 对比 Python 2\n\n在计算场景下，Python 因为两个活跃版本的语言（Python 2 和 Python 3）的存在而变得有些复杂。\n\
    \n- PYTHON 世界\n下方有两个按钮：一个用于 Python 3.6.2，另一个用于 Python 2.7.18；在工作时（记住 Python 经常更新，所以你可能会看到不同的版本号）。\n\
    \n当你访问 Python 下载页面时，你会发现：\n\n- PYTHON 3.X\n2008 年 Python 3 问世，带有几项新功能和增强功能。这些功能提供了一个更稳定、有效且高效的编程环境，但是，并不是所有这些新功能都与旧的脚本、模块和库兼容。虽然\
    \ Python 3 最初并不流行，但从那时起已成为 Python 最令人兴奋的版本。\n\n## 下载 Windows 最新版本\n\n下载 Python\
    \ 3.6.2 下载 Python 2.7.13\n\n应该使用哪个版本？这里有关于 Python 2 和 3 之间的更多信息。\n\n正在寻找不同操作系统的\
    \ Python？Windows、Linux、Mac OS 或其他 Python。\n\n想帮助测试开发版本吗？预发布版\n\n![](img/0b5e7d59f3578d974082f03180129000_12_1.png)\n\
    \n## PYTHON 2.X\n\n为什么要两个？Python 2 发布于 2000 年，从那以后采用了大量的模块、脚本、教程等。多年来，Python 2\
    \ 成为初学者选择的首批编程语言之一，这使其成为一个极具价值的资源。\n\n## 3.X 的胜出\n\nPython 3 日益增长的普及意味着，现在从新功能开始开发并遵循之前的版本是明智的。许多开发公司，如\
    \ SpaceX 和 NASA 使用 Python 3 来编写重要的代码片段。\n\n![](img/0b5e7d59f3578d974082f03180129000_12_2.png)\n\
    \n## 如何在 Windows 中设置 Python\n\nWindows 用户可以通过主 Python 下载页面轻松安装最新版本的 Python。虽然大多数资深\
    \ Python 开发者可能回避 Windows 作为构建代码的平台，但它是初学者的理想起点。\n\n## 安装 Python 3.X\n\nMicrosoft\
    \ Windows 标准版没有预装 Python，所以你必须手动安装它。坦率地说，这个过程很简单：\n\n- **步骤 1** 首先打开你的网络浏览器访问\
    \ www.python.org/downloads/。寻找 Python 3.x 的下载按钮链接（在我们案例中是 Python 3.6.2，但你之后可能会看到更高版本的\
    \ 3）。\n\n- **步骤 3** 选择“自定义”（Customise）选项允许你指定某些参数，虽然你可以保持默认设置，但养成这是一个好习惯，因为有时（感谢\
    \ Python）安装程序可能会包含不需要的功能。在“下一步”屏幕上，确保所有框框都已勾选并点击“下一步”。\n\n- **步骤 2** 点击对应版本的下载按钮。文件下载完成后，将文件保存到。\n\
    \n- **步骤 4** 确保所有框都已勾选并点击“下一步”。\n\n- **步骤 5** 但是，在关闭安装窗口之前，最好点击“下一步”。这将允许 Python\
    \ 绕过 260 个字符的限制。\n\n- **步骤 6** 但是，在关闭安装窗口之前，最好点击“下一步”。这将允许 Python 绕过 260 个字符的限制，让你能够执行程序。\n\
    \n- **步骤 7** Windows 10 用户现在会在“开始”按钮的“最近添加”部分找到 Python 3.x。第一个链接“Python 3.6 (32-bit)”在点击后将启动命令行版本的\
    \ Python（稍后会详细说明）。\n\n- **步骤 8** 如果你现在点击 Windows“开始”按钮，这次输入 CMD，就会出现命令提示符窗口。点击它进入\
    \ Windows 命令行。\n\n- **步骤 9** 在命令行中输入 Python，你需要输入：`python` 并按回车。\n\n- **步骤 10**\
