  mdcn: "\n\n# 编写代码\n\n## 下一步去哪里？\n\n编程和大多数学科一样，是一个持续的学习过程。你可能不会将自己归类为新手，但你仍然需要测试你的代码，学习新的技巧和黑科技来提高效率，甚至可以扩展领域去学习另一种编程语言。\n\
    \n## 包含：持续学习\n\n你可以做什么来进一步提升技能、学习新的编码实践、展示你的代码，甚至开始利用你迄为止的经验帮助他人呢？\n\n## 推特 (Twitter)\n\
    \nTwitter 并不全是黑和反对者，还有数百万更愿意分享编程知识的人。我们建议寻找几个能让你产生共鸣的人并关注他们。他们经常发布针对常见编程问题的绝佳技巧、黑科技和解决方案。\n\
    \n![](img/0b5e7d59f3578d974082f03180129000_143_0.png)\n\n## 开源项目\n\n寻找你感兴趣的开源项目并主动贡献代码以保持其活力和更新。有数百万个项目供你选择，所以从开始看看它们哪里需要帮助。这可能是一个微小的代码更新，但对于程序员来说，这是一个高尚的事业。\n\
    \n![](img/0b5e7d59f3578d974082f03180129000_143_1.png)\n\n## 坚持编程\n\n如果你已经很好地掌握了\
    \ Python，那么就把注意力转向 C++ 或 C#。在保持 Python 编程技能的同时学习新语言，可以很好地打开大脑的大门，并让你进入另一个社区，看看他们是如何进行不同的操作。\n\
    \n## 分享技能\n\n在 StackExchange 等编程和开发知识网站上活跃起来。如果你有能力开始并并帮助他人，那么通过与其他导师的互动，你不会觉得独自摸索是那么孤单。\n\
    \n```cpp\n#pragma once\n#define EXP_ME_FILE_ = __LINE__\nconst double pi = 3.14159;\n\
    int left_decay(double x) = 0;\ntemplate<typename T>\nstruct foo {\n    static_assert(std::is_floating_point<T>::value,\
    \ \"T must be a floating point\");\n    T func() {};\n};\nstruct A {\n    ~A()\
    \ {}\n    virtual void func() {}\n};\ntemplate<typename T>\nconcept EqualityComparable\
    \ = requires(T a, T b) {\n    a == b;\n};\n```\n\n![](img/0b5e7d59f3578d974082f03180129000_143_2.png)\n\
    \n## 移动开发\n\n移动市场是测试编程技能以及展示你创建的任何游戏或应用的绝佳场所。如果你的应用很好，它可能是应用商店中出现的下一个大作。尽管如此，这是一个非常棒的学习体验，也是值得考虑的。\n\
    \n## 作品集 (Portfolios)\n\n如果你学习编程是为了未来的开发者工作，那么就值得开始建立一个在线代码作品集。查看招聘公告，看看他们需要哪些技能，然后学习并使用这些技能编写代码，将其加入到你的作品集中。在申请时，附上你的作品集链接。\n\
    \n## 我的作品\n\n想看更多示例吗？给我发邮件。\n\n![](img/0b5e7d59f3578d974082f03180129000_144_0.png)\n\
    \n## Chronicles.org\n\nChronicles.org 是一个开发者可以编写自己编程历程故事的平台。它是分享经验、获取反馈和展示项目的绝佳之地。与他人联系并设计新的风格。\n\
    \n![](img/0b5e7d59f3578d974082f03180129000_144_1.png)\n\n## 在线学习\n\n在线课程是让编程技能迈向下一阶段的良好例子，即使你从初级开始。如果在线课程遵循严格的编码规范，如果你是自学，那么看看其他开发者是如何布局代码的，以及哪些是可以接受的，可能非常值得。\n\
    \n> 免费互动式地学习编程。\n\n![](img/0b5e7d59f3578d974082f03180129000_144_2.png)\n\n## 教代码\n\
    \n你会教吗？如果你的编程技能过硬，可以考虑联系学院或大学，看看他们是否有对编程老师的需求（可能是兼职或在线的）。如果不去教学，考虑创建一个自己的 YouTube\
    \ 编程教程频道。\n\n![](img/0b5e7d59f3578d974082f03180129000_144_3.png)\n\n## 源代码\n\n\
    去分享吧，即使你认为你的代码并不好。收到的批评、建议和评论有助于解决代码中的问题，并将其加入你的清单。或者，你的代码可能完全惊人，但你不分享就将一无所知。\n\
    \n## 硬件项目\n\n贡献硬件项目是向他人提供代码以及向他人学习的极佳资源。许多开发板都有程序员申请硬件项目的公告，使用独特的代码来充分利用所设计的硬件性能。\n\
    \n![](img/0b5e7d59f3578d974082f03180129000_144_4.png)\n\n## Black Dog Media：从入门到精通\n\
