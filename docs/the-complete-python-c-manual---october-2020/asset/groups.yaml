    # 日期和时间


    在处理日期时，经常需要时间。例如，你可能想要记录用户登录系统的时间以及持续了多久。获取日期和时间很容易，多归于 `time` 模块。time模块包含了帮助你获取当前时间、从字符串读取日期、格式化日期等。


    **步骤 1** 如果你需要导入时间模块，它是 Python 内置的。一旦导入，你可以使用简单的命令调用当前日期和时间：


    ```python

    import time

    time.ctime()

    ```


    ![](img/0b5e7d59f3578d974082f03180129000_55_0.png)


    **步骤 3** 你可以看到时间的呈现结构：


    ```python

    time.local_time()

