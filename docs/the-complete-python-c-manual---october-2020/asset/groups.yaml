    \ While 循环 |\n| 132 | If 语句 |\n| 134 | If... Else 语句 |\n\n# While 循环\n\n循环的功能是重复某个语句或一组语句，只要某个条件保持为真。当循环开始时，它通过测试循环条件和内部语句来初始化自己，然后再执行循环的其余部分。\n\
    \n# 真还是假？\n\n`while` 是 C++ 代码循环最流行的形式之一。它们在条件为真时反复运行循环包含的代码。一旦证明为假，代码将恢复正常运行。\n\
