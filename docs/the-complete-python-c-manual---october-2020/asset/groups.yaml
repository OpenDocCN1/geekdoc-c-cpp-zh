    >>> print("Some numbers: {}, {}, {}, {}, {}")

    >>> numbers.format(*numbers)

    1, 3, 45, 567546, 3425346345

    ```


    ### STEP 8


    You can also print the content of a user''s input in the same fashion:


    ```python

    name=input("What''s your name ?")

    print("Hello {}.".format(name))

    ```


    ![](img/0b5e7d59f3578d974082f03180129000_54_0.png)


    ### STEP 6


    With indexing in lists, the same applies to calling a list using formatting. You
    can index each item by its position (0 to however many are present):


    ```python

    numbers=[4, 2, 9]

    print("More numbers: {}, {}, {}")

    print("{0}".format(numbers))

    ```


    ```

    Python 3.2 Shell

    Edit Help Debug Context Window

    Python 3.4.2 (default, Oct 19 2014, 23:11:13)

    (C) 4.6.1) on Linux

    >>> print("copyright", credits or "license" for more information.

    >>> print("More numbers: {}, {}, {}")

    >>> print("{0}".format(numbers))

    4, 2, 9

    ```


    ### STEP 9


    You can extend this simple code to display the first letter in a person''s name:


    ```python

    name=input("What''s your name ?")

    print("Hello {}.".format(name))

    name=name[0]

    print("The first letter of your name is a {0}".format(name))

    ```


    ![](img/0b5e7d59f3578d974082f03180129000_54_1.png)


    ### STEP 7


    And so probably you can mix strings and integers in a single list to be called
    with the .format function.


    ```python

    Python 3.2 Shell

    Edit Help Debug Context Window

    Python 3.4.2 (default, Oct 19 2014, 23:11:13)

