  mdcn: "\n\n# 打开文件\n\n在 Python 中，你可以在程序中读取和写入二进制文件。你还可以向文件中写入，这是我们想要学习的内容。读取和写入文件允许你从程序中输出和存储数据。\n\
    \n## 打开、读取和写入\n\n在 Python 中，你创建一个文件对象，类似于创建一个变量，只需使用 `open()` 函数传递文件即可。文件通常被归类为文本或二进制文件。\n\
