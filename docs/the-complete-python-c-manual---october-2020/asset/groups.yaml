  mdcn: "\n\n## 你的第一个 C++ 程序\n\n步骤 5 命令的自动选择功能非常方便，可以减少可能的拼写错误。按回车键（Return）到第 3 行，然后输入：\n\
    \n步骤 8 再次注意颜色编码的变化。在在上一步的行末尾按回车键，然后输入：\n\n```cpp\nint main()\n```\n\n```cpp\n\
    std::cout << \"Hello\n```\n\n注意：括号之间没有空格。\n\n![](img/0b5e7d59f3578d974082f03180129000_98_0.png)\n\
    \n![](img/0b5e7d59f3578d974082f03180129000_98_1.png)\n\n步骤 6 在 `main()` 下方的下一行，输入一个大括号：\n\
