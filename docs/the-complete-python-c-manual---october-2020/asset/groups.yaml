  - '[PAGE 39]


    # Conditions and Loops


    Conditions and loops are what makes a program interesting; they can be simple
    or rather complex. How you use them depends greatly on what the program is trying
    to achieve; they could be the number of lives left in a game or just displaying
    a countdown.


    # TRUE CONDITIONS


    Keeping conditions simple to begin with makes learning to program a more enjoyable
    experience. Let''s start then by checking if something is TRUE, then doing else
    if it isn''t.


    +   STEP 1 We create a new Python program that will ask the user to input a word,
    then check it to see if it''s a four-letter word or not. Start with File = New,
    and begin with your input:


    ```

    word=input("Please enter a four-letter word: ")

    ```


    ![](img/0b5e7d59f3578d974082f03180129000_39_0.png)


    ```

    word=input("Please enter a four-letter word: ")

    word_length=len(word)

    if word_length == 4:

    print("is a four-letter word. Well done.")

    ```


    The double equal (==) means if something is something else


    ![](img/0b5e7d59f3578d974082f03180129000_39_1.png)


    +   STEP 2 We now create a new variable, then use the function and pass the word
    through it to get the total number of letters the user has entered:


    ```

    word=input("Please enter a four-letter word: ")

    word_length=len(word)

    ```


    ![](img/0b5e7d59f3578d974082f03180129000_39_2.png)


    +   STEP 4 The colon at the end of if tells Python that it''s true due everything
    after the colon Next, move the cursor back to the beginning of the Editor:


    ```

    word=input("Please enter a four-letter word: ")

    word_length=len(word)

    if word_length == 4:

    print("is a four-letter word. Well done.")

    else:

    print("is not a four-letter word.")

    ```


