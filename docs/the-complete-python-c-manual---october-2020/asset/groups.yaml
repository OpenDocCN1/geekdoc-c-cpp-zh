    >>> print("{0} is 3 years old. Where is {4} years old.".format(characters))

    Conan is 3 years old. Where is 20 years old.

    ```


    ### STEP 10


    You can also call a list of pairs and return individually within the same function.
    Looking back at the code Step 7, you can alter it with:


    ```python

