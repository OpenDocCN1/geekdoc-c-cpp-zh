  11. 写一个程序将句子读入数组列表。然后使用 `Collections.shuffle` 洗乱第一个和最后一个单词以外的所有单词，无需将单词复制到另一个集合。\n\
  \n12. 使用 `Collections.shuffle` 写一个程序读取句子、洗乱单词并打印结果。修复第一个单词的大小写和最后一个单词的标点符号（洗乱前后）。提示：不要洗乱单词。\n\
  \n13. `LinkedHashMap` 在每次插入新元素时都会调用 `removeEldestEntry` 方法。实现一个子类 `Cache`，将映射限制在构造函数提供的给定大小内。\n\
  \n\n\n\n\n14. 编写一个方法，生成从 `0` 到 `n` 数字的不可变列表视图，而无需实际存储这些数字。\n\n15. 将前面的练习泛化为任意的 `IntFunction`。注意结果是一个无限集合，因此某些方法（如\
  \ `size` 和 `toArray`）应该抛出 `UnsupportedOperationException`。\n\n16. 通过缓存最后 100 个计算出的函数值来改进上述练习的实现。\n\
