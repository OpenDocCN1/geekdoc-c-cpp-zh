  \n作为“相同作用域”规则的另一个结果，lambda 表达式中的 `this` 关键字表示创建该 lambda 表达式方法的 `this` 参数。例如，考虑\n\
  \n点击此处查看代码图像\n\n```java\npublic class Application() {\n    public void doWork()\
  \ {\n        Runnable runner = () -> { ...; System.out.println(this.toString());\
  \ ... };\n        ...\n    }\n}\n```\n\n表达式 `this.toString()` 调用的是 `Application`\
  \ 对象的 `toString` 方法，*而不是* `Runnable` 实例。在 lambda 表达式中使用 `this` 并没有特殊之处。lambda 表达式的作用域嵌套在\
  \ `doWork` 方法内部，`this` 在该方法的任何地方都具有相同的含义。\n\n### 3.7.2 从闭层作用域访问变量\n\n通常，你希望在 lambda\
  \ 表达式中访问闭层方法或类中的变量。考虑这个示例：\n\n点击此处查看代码图像\n\n```java\npublic static void repeatMessage(String\
  \ text, int count) {\n    Runnable r = () -> {\n        for (int i = 0; i < count;\
  \ i++) {\n            System.out.println(text);\n        }\n    };\n    new Thread(r).start();\n\
  }\n```\n\n注意，lambda 表达式访问的是在闭层作用域中定义的参数变量，而不是 lambda 表达式自身的变量。\n\n考虑以下调用\n\n点击此处查看代码图像\n\
  \n```java\nrepeatMessage(\"Hello\", 1000); // 在单独线程中打印 `Hello` 1000 次\n```\n\n现在看\
  \ lambda 表达式内部的变量 `count` 和 `text`。如果你仔细思考，会这里发生了一些并非显而易见的事情。lambda 表达式的代码可能在 `repeatMessage`\
  \ 调用返回且参数变量消失很久之后仍在运行。当 lambda 表达式准备好执行时，`text` 和 `count` 变量是如何保留的？\n\n为了理解发生了什么，我们需要完善对\
  \ lambda 表达式的理解。一个 lambda 表达式包含三个要素：\n\n1. 一个代码块\n2. 参数\n3. *自由*变量的值——即那些既不是参数、也没有在代码内部定义的变量\n\
  \n在我们的示例中，lambda 表达式有两个自由变量：`text` 和 `count`。表示 lambda 表达式的数据结构必须存储这些变量的值——在我们的例子中，即\
  \ `\"Hello\"` 和 `1000`。我们说这些值被 lambda 表达式*捕获*（*captured*）了。（实现方式是实现细节。例如，可以将 lambda\
  \ 表达式转换为一个只有一个方法的对象，这样自由变量的值就会复制到该对象的实例变量中。）\n\n***\n\n![图像](img/00003.jpeg) 备注\n\
  \n代码块连同自由变量值构成的技术术语是*闭包*（*closure*）。在 Java 中，lambda 表达式就是闭包。\n\n***\n\n正如你所看到的，lambda\
  \ 表达式可以捕获闭层作用域中变量的值。为了确保被捕获的值定义良好，有一项重要的限制。在 lambda 表达式中，你只能引用值不会改变的变量。这有时被描述为 lambda\
  \ 表达式捕获的是值，而不是变量。例如，以下代码会导致编译错误：\n\n点击此处查看代码图像\n\n```java\nfor (int i = 0; i < n;\
  \ i++) {\n    new Thread(() -> System.out.println(i)).start();\n    // 错误—无法捕获 `i`\n\
  }\n```\n\nlambda 表达式试图捕获 `i`，但这是不法的，因为 `i` 会发生变化。没有单一的值可以捕获。规则是，lambda 表达式只能访问来自闭层作用域且是*有效\
  \ final*（*effectively final*）的局部变量。有效 final 变量从未被修改——它要么已经是 final，要么可以被声明为 `final`。\n\
  \n***\n\n![图像](img/00003.jpeg) 备注\n\n相同的规则也适用于局部类捕获的变量（参见第 3.9 节“局部类和匿名类”第 129 页）。过去，规则更加严格，要求变量必须声明为\
  \ `final`。现在不再如此。\n\n***\n\n![图像](img/00003.jpeg) 备注\n\n`arg` 的作用域是每次迭代。以下是完全合法的：\n\
  \n点击此处查看代码图像\n\n```java\nfor (String arg : args) {\n    new Thread(() -> System.out.println(arg)).start();\n\
  }\n```\n\n`arg` 变量是有效 final——它始终指向数组。\n\n***\n\n由于“有效 final”规则的存在，lambda 表达式不能修改局部变量。例如，以下代码会导致编译错误：\n\
  \n点击此处查看代码图像\n\n```java\npublic static void repeatMessage(String text, int count)\
  \ {\n    Runnable r = () -> {\n        while (count > 0) {\n            count--;\
  \ // 错误：无法修改 `count`\n            System.out.println(text);\n        }\n    };\n\
  }\n```\n\n\n\n### 3.8 高阶函数\n\n在函数式编程语言中，函数是一等公民。正如你可以向方法传递数字并让方法产生数字一样，你也可以拥有函数的参数和返回值。处理或返回函数的被称为*高阶函数*（*higher-order\
  \ functions*）。这听起来很抽象，但在实践中非常有用。Java 不是真正的函数式语言，因为它使用的是函数接口，但原理是相同的。在接下来的章节中，我们将查看示例并检查\
  \ `Comparator` 接口中的高阶函数。\n\n#### 3.8.1 返回函数的方法\n\n假设我们有时按升序排序字符串数组，有时按降序排序。我们可以创建一个产生正确比较器的方法：\n\
  \n点击此处查看代码图像\n\n```java\npublic static Comparator<String> compareInDirection(int\
  \ direction) {\n    return (x, y) -> direction * x.compareTo(y);\n}\n```\n\n`compareInDirection(1)`\
  \ 调用产生升序比较器，而 `compareInDirection(-1)` 产生降序比较器。\n\n结果可以传递给另一个需要此类接口的方法（例如 `Arrays.sort`）。\n\
  \n\n\n\n\n点击此处查看代码图像\n\n```\nArrays.sort(friends, compareInDirection(-1));\n```\n\
  \n通常情况下，不要羞于编写产生函数的方法（从技术上说，产生实现函数接口的类实例）。这对于生成自定义函数并将其传递给带有函数接口的方法非常有用。\n\n###\
  \ 3.8.2 修改函数的方法\n\n在前面的章节节中，你看到一个可以产生递增或递减字符串比较器的方法。我们可以通过反转任何比较器来泛化这个想法：\n\n点击此处查看代码图像\n\
  \n```java\npublic static Comparator<String> reverse(Comparator<String> comp) {\n\
  \    return (x, y) -> comp.compare(y, x);\n}\n```\n\n该方法作用于函数。它接收一个函数并返回一个修改后的函数。要获取不区分大小的降序，请使用\n\
  \n点击此处查看代码图像\n\n```\nreverse(String::compareToIgnoreCase)\n```\n\n***\n\n![Image](img/00003.jpeg)\
  \ 注意事项\n\n`Comparator` 接口有一个默认方法 `reversed`，它正通过这种方式产生给定比较器的反转结果。\n\n***\n\n###\
  \ 3.8.3 比较器方法\n\n`Comparator` 接口有很多实用的静态方法，它们是生成比较器的高阶函数。\n\n`comparing` 方法接收一个“键值提取器”函数，该函数将类型类型\
  \ `T` 映射到一个可比较的类型（如 `String`）。该函数被应用于待比较的对象，然后对返回的键进行比较。例如，假设 `Person` 类有一个方法 `getLastName`。那么你可以这样按姓氏对\
  \ `Person` 对象数组进行排序：\n\n点击此处查看代码图像\n\n```java\nArrays.sort(people, Comparator.comparing(Person::getLastName));\n\
  ```\n\n你可以使用 `thenComparing` 方法链用比较器来打破平局。例如，先按姓氏对人员数组排序，对于姓氏相同的人，再使用名字：\n\n点击此处查看代码图像\n\
  \n```java\nArrays.sort(people, Comparator\n    .comparing(Person::getLastName)\n\
  \    .thenComparing(Person::getFirstName));\n```\n\n这些方法有几种变体。你可以指定一个比较器，用于 `comparing`\
  \ 和 `thenComparing` 方法提取的键。例如，这里我们按名字的长度对人员进行排序：\n\n点击此处查看代码图像\n\n```java\nArrays.sort(people,\
  \ Comparator.comparing(Person::getLastName,\n    (s, t) -> s.length() - t.length()));\n\
  ```\n\n此外，`comparing` 和 `thenComparing` 方法都有避免对 `int`、`long` 或 `double` 值进行装箱的变体。按名字长度排序更简单的方法是：\n\
  \n点击此处查看代码图像\n\n```java\nArrays.sort(people, Comparator.comparingInt(p -> p.getLastName().length()));\n\
  ```\n\n如果你的键函数可以返回 `null`，你会喜欢 `nullsFirst` 和 `nullsLast` 适配器。这些静态方法接收现有的比较器并对其修改，使其在遇到\
  \ `null` 值时不抛出异常，而是将其排为比普通值小或大。例如，假设当人没有中间名时 `getMiddleName` 返回 `null`。那么你可以使用 `Comparator.comparing(Person::getMiddleName(),\
  \ Comparator.nullsFirst(...))`。\n\n`nullsFirst` 方法需要一个比较器——在这种情况下，是一个比较两个字符串的比较器。`naturalOrder`\
  \ 方法为任何实现 `Comparable` 的类创建一个比较器。这里是按可能为 null 的中间名进行排序的完整调用。我使用了 `java.util.Comparator.*`\
  \ 的静态导入来使表达式更具可读性。注意，`naturalOrder` 的类型是自动推断的。\n\n点击此处查看代码图像\n\n```java\nArrays.sort(people,\
  \ comparing(Person::getMiddleName,\n    nullsFirst(naturalOrder())));\n```\n\n静态方法\
  \ `reverseOrder` 提供自然顺序的反转。\n\n### 3.9 局部类和匿名类\n\n在 lambda 表达式出现很久以前，Java 就有一种机制可以简洁地定义实现接口（无论函数接口还是其他）的类。对于函数接口，你绝对应该使用\
  \ lambda 表达式，但偶尔你可能想为非函数接口提供一种简洁的形式。你还会在遗留代码中遇到经典的结构。\n\n#### 3.9.1 局部类\n\n你可以在方法内部定义一个类。这样的类被称为*局部类*（local\
  \ class）。你会对那些仅具策略性的类这样做。这通常发生在一个类实现了一个接口，而方法的调用者只关心接口而不关心该类时。\n\n例如，考虑一个方法\n\n\
  点击此处查看代码图像\n\n```java\npublic static IntSequence randomInts(int low, int high)\n\
  ```\n\n它产生给定边界的随机整数序列。由于 `IntSequence` 是一个接口，方法必须返回一个实现该接口的对象。调用者并不关心类，因此它可以定义在方法内部：\n\
  \n点击此处查看代码图像\n\n```java\nprivate static Random generator = new Random();\n\npublic\
  \ static IntSequence randomInts(int low, int high) {\n    class RandomSequence implements\
  \ IntSequence {\n        public int next() { return generator.nextInt(high - low\
  \ + 1); }\n        public boolean hasNext() { return true; }\n    }\n    return\
  \ new RandomSequence();\n}\n```\n\n***\n\n![Image](img/00003.jpeg) 注意事项\n\n局部类没有声明为\
  \ `public` 或 `private`，因为它在外部无法访问。\n\n***\n\n局部类有两个优势。首先，它的名称是隐藏的。其次，类的方法可以访问作用域内的变量，就像\
  \ lambda 表达式一样。在我们的示例中，`next` 方法捕捉了三个变量：`low`、`high` 和 `generator`。如果你将 `Random`\
  \ 嵌套类，你需要提供一个显式的构造函数来接收这些值并将其存储在实例变量中（见练习 16）。\n\n#### 3.9.2 匿名类\n\n在前节的示例中，`RandomSequence`\
  \ 名称仅被使用了一次：用于构造返回值。在这种情况下，你可以使类是*匿名*的：\n\n点击此处查看代码图像\n\n```java\npublic static\
  \ IntSequence randomInts(int low, int high) {\n    return new IntSequence() {\n\
  \        public int next() { return generator.nextInt(high - low + 1); }\n     \
  \   public boolean hasNext() { return true; }\n    };\n}\n```\n\n表达式 `new Interface()\
  \ { methods }` 意味着：定义一个实现接口并具有给定方法的类，并构造该类的一个对象。\n\n***\n\n![Image](img/00003.jpeg)\
  \ 注意事项\n\n`new` 表达式中的 `()` 表示构造参数。匿名匿名类的构造函数。\n\n***\n\n在 Java 有 lambda 表达式之前，匿名内部类是提供\
  \ runnable、比较器和其他函数对象的最简洁的语法。你会在遗留代码中经常看到它们。\n\n现在，只有当你需要提供两个或多个方法时（如前面的示例所示），它们才是必要的。如果\
  \ `IntSequence` 接口有一个默认 `hasNext` 方法（见练习 16），你可以简单地使用 lambda 表达式：\n\n点击此处查看代码图像\n\
  \n```java\npublic static IntSequence randomInts(int low, int high) {\n    return\
  \ () -> generator.nextInt(high - low + 1);\n}\n```\n\n## 练习\n\n1. 提供一个接口 `Measurable`，包含一个方法\
  \ `double getMeasure()`，以某种方式测量对象。让 `Employee` 实现 `Measurable`。提供一个方法 `double average(Measurable[]\
  \ objects)` 来计算对象的平均值。使用它来计算员工数组的平均薪水。\n\n\n\n\n\n2. 继续上一个练习并提供一个方法 `Measurable\
  \ largest(Measurable[] objects)`。使用该方法找到薪资最高的员工名称。你为什么需要进行类型转换？\n\n3. `String` 的所有超类型（superty）有哪些？`Scanner`\
  \ 呢？`ImageOutputStream` 呢？注意，每个类型都是其自身的超类型。没有声明超类型的类或接口其超类型为 `Object`。\n\n4. 在 `IntSequence`\
  \ 类中实现一个静态的 `of` 方法，根据参数产生一个序列。例如，`IntSequence.of(3, 1, 4, 1, 5, 9)` 产生一个包含六个值的序列。如果返回的是一个匿名内部类的实例，则可获得额外分。\n\
  \n5. 为 `IntSequence` 类添加一个名为 `constant` 的静态方法，产生一个无限的常量序列。例如，`IntSequence.constant(1)`\
  \ 产生无限的值 `1 1 1...`。如果使用 lambda 表达式来实现，则可获得额外分。\n\n6. `SquareSequence` 类由于整数溢出，实际上并没有提供无限的平方序列。具体来说，它的表现如何？通过定义一个\
  \ `Sequence<T>` 接口和一个实现 `Sequence<BigInteger>` 的 `SquareSequence` 类来修复这个问题。\n\n\
  7. 在此练习中，你将尝试向接口添加方法后会发生什么。在 Java 7 中，实现一个实现 `Iterator<Integer>` 而不是 `IntSequence`\
  \ 的类 `DigitSequence`。提供 `hasNext`、`next` 和空的 `remove` 方法。编写一个打印实例元素的程序。\n\n在 Java\
  \ 8 中，`Iterator` 类增加了另一个方法 `forEachRemaining`。当你切换到 Java 8 时，你的代码还能编译吗？如果你将 Java\
  \ 7 的类放入 JAR 文件且不重新编译，在 Java 8 中可以运行吗？如果你调用 `forEachRemaining` 方法会怎样？此外，`remove`\
  \ 方法在 Java 8 中变成了默认方法（default method），并抛出 `UnsupportedOperationException`。当对你的类实例调用\
  \ `remove` 时会什么？\n\n8. 实现方法 `void luckySort(ArrayList<String> strings, Comparator<String>\
  \ comp)`，它不断对数组列表调用 `Collections.shuffle`，直到元素按照比较器确定的顺序升序排列。\n\n9. 实现一个实现 `Runnable`\
  \ 的类 `Greeter`，其 `run` 方法打印 `n` 份 `\"Hello, \" + target`，其中 `n` 和 `target` 在构造函数中设置。创建两个具有不同消息的实例并在两个线程中并发执行它们。\n\
  \n10. 实现方法：\n\n```\npublic static void runTogether(Runnable... tasks)\n\npublic\
  \ static void runInOrder(Runnable... tasks)\n```\n\n第一个方法应该在每个独立的线程中运行每个任务然后返回。第二个方法应该在当前线程中运行所有方法，并在最后一个任务完成后返回。\n\
  \n11. 使用 `java.io.File` 类的 `listFiles(FileFilter)` 和 `isDirectory` 方法，编写一个方法返回给定目录下的所有子目录。使用\
  \ lambda 表达式而不是 `FileFilter` 对象。然后 分别使用方法引用（method expression）和匿名内部类重复实现。\n\n12.\
  \ 使用 `java.io.File` 类的 `list(FilenameFilter)` 方法，编写一个方法返回给定目录下具有特定扩展名的所有文件。使用 lambda\
  \ 表达式而不是 `FilenameFilter`。它捕获了闭层作用域中的哪个变量？\n\n13. 给定 `File` 对象数组，对其进行排序，使得目录在文件之前，并在每个组内，元素按路径名称排序。使用\
  \ lambda 表达式来指定 `Comparator`。\n\n14. 编写一个方法接收 `Runnable` 实例数组并返回一个 `Runnable`，其\
  \ `run` 方法按顺序执行这些任务。返回一个 lambda 表达式。\n\n15. 编写对 `Arrays.sort` 的调用，按薪资对员工进行排序，薪资相同时按名称。使用\
  \ `Comparator.thenComparing`。然后以反序执行此操作。\n\n16. 将 3.9.1 节“本地类”（第 129 页）中的 `RandomSequence`\
  \ 实现为一个嵌套类，并位于 `randomInts` 方法之外。\n\n\n\n\n\n![Image#part0011.html_p100pro01a)![Image#part0011.html_p101pro01a)![Image#part0011.html_p101pro02a)![Image#part0011.html_p101pro03a)![Image#part0011.html_p102pro01a)![Image#part0011.html_p102pro02a)![Image#part0011.html_p103pro01a)![Image#part0011.html_p103pro02a)![Image#part0011.html_p104pro01a)![Image#part0011.html_p104pro02a)![Image#part0011.html_p104pro03a)![Image#part0011.html_p105pro01a)![Image#part0011.html_p105pro02a)![Image#part0011.html_p106pro01a)![Image#part0011.html_p106pro02a)![Image#part0011.html_p106pro03a)![Image#part0011.html_p107pro01a)![Image#part0011.html_p107pro02a)![Image#part0011.html_p107pro03a)![Image#part0011.html_p107pro04a)![Image#part0011.html_p108pro01a)![Image#part0011.html_p109pro01a)![Image#part0011.html_p109pro02a)![Image#part0011.html_p110pro01a)![Image#part0011.html_p110pro02a)![Image#part0011.html_p111pro01a)![Image#part0011.html_p111pro02a)![Image#part0011.html_p111pro03a)![Image#part0011.html_p111pro04a)![Image#part0011.html_p112pro01a)![Image#part0011.html_p112pro02a)![Image#part0011.html_p112pro03a)![Image#part0011.html_p113pro01a)![Image#part0011.html_p113pro02a)![Image#part0011.html_p113pro03a)![Image#part0011.html_p114pro01a)![Image#part0011.html_p114pro02a)![Image#part0011.html_p114pro03a)![Image#part0011.html_p115pro01a)![Image#part0011.html_p115pro02a)![Image#part0011.html_p115pro03a)![Image#part0011.html_p115pro04a)![Image#part0011.html_p115pro05a)![Image#part0011.html_p116pro01a)![Image#part0011.html_p116pro02a)![Image#part0011.html_p116pro03a)![Image#part0011.html_p117pro01a)![Image#part0011.html_p117pro02a)![Image#part0011.html_p117pro03a)![Image#part0011.html_p117pro04a)![Image#part0011.html_p117pro05a)![Image#part0011.html_p118pro01a)![Image#part0011.html_p118pro02a)![Image#part0011.html_p118pro03a)![Image#part0011.html_p119pro01a)![Image#part0011.html_p119pro02a)![Image#part0011.html_p119pro03a)![Image#part0011.html_p120pro01a)![Image#part0011.html_p120pro02a)![Image#part0011.html_p120pro03a)![Image#part0011.html_p122pro01a)![Image#part0011.html_p122pro02a)![Image#part0011.html_p123pro01a)![Image#part0011.html_p123pro03a)]\n\
  \n# 第 4 章 继承与反射\n\n## 本章内容\n\n之前的章节介绍了类和接口。在本章中，你将学习面向对象编程的另一个核心概念：继承。继承是基于现有类创建新类的过程。当你继承一个现有类时，你可以重用（或继承）它的方法，并添加新的方法。\n\
  \n本章还涵盖了反射，即在运行时获取有关类和成员的能力。反射是一个强大的功能，但无疑是复杂的。由于反射对工具开发者比应用程序程序员更有意义，你可以先跳过本章的这部分，然后再回来。\n\
  \n### 继承\n\n![Image](img/00235.jpeg) 注意\n\n实例变量和静态变量统称为字段。类内部字段、方法和嵌套类统称为成员。\n\n\
  本章的关键点是：\n\n1. 子类可以继承或重写父类的方法，只要这些方法不是 `private`。\n2. 使用 `super` 关键字调用父类方法或构造函数。\n\
  3. `final` 方法不能被重写，`final` 类不能被扩展。\n4. `abstract` 方法没有实现，`abstract` 类不能实例化。\n5.\
  \ 父类的 `protected` 成员在子类方法中可以访问，但仅限于应用于同一子类的对象。它在所在的包内也是可用的。\n\n### 继承类\n\n![Image](img/00236.jpeg)\
  \ 4.1 继承类\n\n![Image](img/00237.jpeg) 4.2 父类\n\n![Image](img/00238.jpeg) 4.3 重写方法\n\
  \n![Image](img/00239.jpeg) 4.4 运行时类型信息与资源\n\n![Image](img/00240.jpeg) 4.5 反射\n\n\
  ![Image](img/00241.jpeg) 4.6 练习题\n\n\n\n\n\n让我们回到在第 2 章中讨论过的 `Employee` 类。假设（遗憾的是）你所在的一公司工作，那里对经理的对待方式与其他员工不同。当然，经理在很多方面与员工是相似的。员工和经理都领取薪水。然而，员工被要求完成其分配的任务以换取他们的薪水，而经理如果实际上实现了他们应该做的工作，就能获得奖金。这正是可以用继承来建模的情况。\n\
  \n### 4.1.1 超类与子类\n\n让我们定义一个新类 `Manager`，它保留了 `Employee` 类的一些功能，但指定了经理的特殊之处。\n\n\
  点击此处查看代码图像\n\n```java\npublic class Manager extends Employee {\n\n    added fields\n\
  \n    added or overriding methods\n}\n```\n\n`extends` 关键字表示你正在创建一个派生自现有类的的新类。现有类被称为\
  \ `superclass`（超类），新类被称为 `subclass`（子类）。在我们的示例中，`Employee` 类是超类，`Manager` 类是子类。注意，超类并不比其子类“优越”。相反：子类比其超类具有更多的功能。超/子（super/sub）术语源于集合论。经理的集合是员工集合的子集。\n\
  \n### 4.1.2 定义和继承子类方法\n\n我们的 `Manager` 类有一个新的实例变量来存储奖金，并有一个新方法来设置它：\n\n点击此处查看代码图像\n\
  \n```java\npublic class Manager extends Employee {\n\n    private double bonus;\n\
  \n    ...\n\n    public void setBonus(double bonus) {\n\n        this.bonus = bonus;\n\
  \    }\n}\n```\n\n当你有一个 `Manager` 对象时，你当然可以应用 `setBonus` 方法，以及来自 `Employee` 类的非私有方法。这些方法是被`继承`的。\n\
  \n点击此处查看代码图像\n\n```java\nManager boss = new Manager(...);\n\nboss.setBonus(10000);\
  \ // 定义在子类中\n\nboss.raiseSalary(5); // 继承自超类\n```\n\n### 4.1.3 方法重写\n\n有时，需要在子类中修改超类方法。例如，假设\
  \ `getSalary` 方法预期报告员工的总薪水。那么，继承的方法对于 `Manager` 类来说是不够的。相反，你需要 `override`（重写）该方法，以便它返回基本工资和奖金之和。\n\
  \n点击此处查看代码图像\n\n```java\npublic class Manager extends Employee {\n\n    ...\n\n\
  \    public double getSalary() { // 重写超类方法\n\n        return super.getSalary() +\
  \ bonus;\n    }\n}\n```\n\n该方法调用了超类方法来获取基本工资，并加上奖金。注意，子类方法无法直接访问超类的私有实例变量。这就是为什么\
  \ `Manager.getSalary` 方法调用了公有的 `Employee.getSalary` 方法。`super` 关键字用于调用超类方法。\n\n\
  ***\n\n![Image](img/00003.jpeg) 注意\n\n与 `this` 不同，`super` 不是指向对象的引用，而是一个跳过动态方法查找的指令（参见第\
  \ 4.1.5 节 “超类赋值””，第 139 页）并改为调用特定方法。\n\n***\n\n重写方法时并不要求调用超类方法，但这样做很常见。\n\n当你重写一个方法时，必须小心精确匹配参数类型。例如，假设\
  \ `Employee` 类有一个方法\n\n点击此处查看代码图像\n\n```java\npublic boolean worksFor(Employee supervisor)\n\
  ```\n\n如果你在 `Manager` 类中重写此方法，你不能更改参数类型，尽管显然没有经理会向一个普通员工汇报。假设你定义了一个方法：\n\n点击此处查看代码图像\n\
  \n```java\npublic class Manager extends Employee {\n\n    ...\n\n    public boolean\
  \ worksFor(Manager supervisor) {\n\n        ...\n    }\n}\n```\n\n这仅仅是一个新方法，现在 `Manager`\
  \ 拥有两个独立的 `worksFor` 方法。你可以通过对意图重写超类方法的方法标记 `@Override` 注解，来防止此类错误的发生：\n\n点击此处查看代码图像\n\
  \n```java\n@Override\npublic boolean worksFor(Employee supervisor)\n```\n\n你可以将返回类型更改为子类型（在技术术语中，*协变返回类型*是允许允许的）。例如，如果\
  \ `Employee` 类有一个方法\n\n点击此处查看代码图像\n\n```java\npublic Employee getSalary()\n```\n\
  \n那么 `Manager` 类可以重写它点击此处查看代码图像\n\n```java\n@Override\npublic Manager getSalary()\n\
  ```\n\n如果你犯了错误，不小心省略了子类的 `public` 修饰符，编译器将会报错。特别是，如果超类方法是 `public` 的，那么子类方法必须至少也是可用的。\n\
  \n### 4.1.4 子类构造\n\n由于子类无法访问私有实例变量，它必须通过超类来初始化它们：\n\n```java\npublic Manager(String\
  \ name, double salary) {\n\n    super(name, salary);\n    bonus = 0;\n}\n```\n\n\
  在这里，`super` 关键字表示调用带有 `name` 和 `salary` 参数的超类构造函数。超类构造调用必须是子类构造函数的第一个语句。如果子类没有显式调用任何超类构造函数，则会隐式调用无参的构造函数。\n\
  \n### 4.1.5 超类赋值\n\n将子类对象赋值给类型为超类的变量是合法的，例如：\n\n```java\nManager boss = new Manager(...);\n\
  Employee empl = boss; // 允许赋值给超类变量\n```\n\n现在考虑在超类变量上调用方法会发生什么：\n\n```java\ndouble\
  \ salary = empl.getSalary();\n```\n\n尽管 `empl` 的类型是 `Employee`，但调用的是 `Manager.getSalary`\
  \ 方法。在调用方法时，虚拟机会查看对象的实际类并定位其版本。这个过程被称为 `动态方法查找`。\n\n为什么要将 `Manager` 对象赋值给 `Employee`\
  \ 变量？这允许你编写适用于*所有*员工的代码，无论是经理、清洁工或其他 `Employee` 子类的实例。\n\n```java\nEmployee[] staff\
  \ = new Employee[...];\nstaff[0] = new Employee(...);\nstaff[1] = new Manager(...);\
  \ // 允许赋值给超类变量\nstaff[2] = new Janitor(...);\n\n...\n\ndouble sum = 0;\n\nfor (Employee\
  \ empl : staff) {\n    sum += empl.getSalary();\n}\n```\n\n得益动态方法查找，`empl.getSalary()`\
  \ 调用的是属于 `empl` 所引用对象的方法，这可能是 `Employee.getSalary`、`Manager.getSalary` 等。\n\n\n\n\
  \n在 Java 中，父类赋值也适用于数组：你可以将一个 `Manager[]` 数组赋值给 `Employee[]` 变量。（技术术语是 Java 数组是*协变的*（covariant）。）这很方便，但它也是*不安全的*（unsound）——也就是说导致类型错误的可能原因。考虑这个示例：\n\
  \n点击此处查看代码图像\n\n```\nManager[] bosses = new Manager[10];\nEmployee[] empls = bosses;\
  \ // 在 Java 中合法\nempls[0] = new Employee(...); // 运行时错误\n```\n\n编译器接受最后一条语句，因为在\
  \ `Employee[]` 数组中存储 `Employee` 通常是合法的。然而，这里 `empls` 和 `bosses` 引用的是同一个 `Manager[]`\
  \ 数组，该数组不能持有低级的 `Employee`。这个错误只有在运行时被捕获，此时虚拟机会抛出 `ArrayStoreException`。\n\n***\n\
  \n### 4.1.6 强制转换 (Casts)\n\n在前一节中，你已经看到类型为 `Employee` 的变量 `empl` 可以指向类为 `Employee`、`Manager`\
  \ 或 `Employee` 的另一个子类的对象。这对于处理多个类对象的代码非常有用。但只有一个缺点：你只能调用属于父类的方法。例如，考虑：\n\n点击此处查看代码图像\n\
  \n```\nEmployee empl = new Manager(...);\nempl.setBonus(10000); // 编译时错误\n```\n\n\
  即使此调用在运行时可以成功，它也是一个编译时错误。编译器会检查你只调用了接收者类型存在的方法。在这里，`empl` 的类型是 `Employee`，而该类没有\
  \ `setBonus` 方法。\n\n与接口一样，你可以使用 `instanceof` 运算符和强制转换将父类引用转换为子类引用。\n\n点击此处查看代码图像\n\
  \n```java\nif (empl instanceof Manager) {\n    Manager mgr = (Manager) empl;\n \
  \   mgr.setBonus(10000);\n}\n```\n\n### 4.1.7 最终方法与类 (Final Methods and Classes)\n\
  \n当你将一个方法声明为 `final` 时，没有任何子类可以重写它。\n\n点击此处查看代码图像\n\n```java\npublic class Employee\
  \ {\n    ...\n    public final String getName() {\n        return name;\n    }\n\
  }\n```\n\nJava API 中 `final` 方法的一个很好的例子是 `Object` 类的 `getClass` 方法，你将在第 4.4.1 节，“类类](#part0013.html_ch04lev2sec22)”（第\
  \ 159 页）中看到。允许对象对其所属的类撒谎似乎并不明智，因此该方法永远无法被更改。\n\n一些程序员认为 `final` 关键字有助于效率。这在 Java\
  \ 早期可能是真的，但现在已经不再了。现代虚拟机会推测性地“内联”（inline）简单方法，例如上面的 `getName` 方法，即使它们没有声明为 `final`。在极少数加载了重写了此类方法的子类的情况下，内联操作会被取消。\n\
  \n一些程序员认为一个类的大多数方法都应该声明为 `final`，只有专门设计用于被重写的方法不应该如此。另一些人则认为这种做法太极端了，因为它阻止了即使是无害的重写，例如为了日志记录或调试目的。\n\
  \n偶尔你可能希望防止别人从你的某个类派生子类。在类定义中使用 `final` 修饰符来指示这一点。例如，这里是防止他人对 `Executive` 类进行子类化的方法：\n\
  \n点击此处查看代码图像\n\n```java\npublic final class Executive extends Manager {\n    ...\n\
  }\n```\n\nJava API 中有很多 `final` 类，例如 `String`、`LocalTime` 和 `URL`。\n\n### 4.1.8\
  \ 抽象方法与类 (Abstract Methods and Classes)\n\n类可以定义一个没有实现的方法，从而迫使子类去实现它。这样的方法以及包含它的类被称为*抽象的*（abstract），并且必须标记\
  \ `abstract` 修饰符。这通常用于非常通用的类，例如：\n\n点击此处查看代码图像\n\n```java\npublic abstract class\
  \ Person {\n    private String name;\n    public Person(String name) { this.name\
  \ = name; }\n    public final String getName() { return name; }\n    public abstract\
  \ int getId();\n}\n```\n\n任何扩展 `Person` 的类必须要么提供 `getId` 方法的实现，要么本身被声明为 `abstract`。\n\
  \n注意，抽象类可以拥有非抽象方法，例如上一个示例中的 `getName` 方法。\n\n***\n\n![图像](img/00003.jpeg)\n\n与接口不同，抽象类可以拥有非抽象方法。\n\
  \n***\n\n无法构造抽象类的实例。例如，点击此处查看代码图像\n\n```java\nPerson p = new Person(); // 错误\n```\n\
  将是一个编译时错误。\n\n然而，你可以拥有一个类型为抽象类的变量，只要它包含一个具体的子类。假设类 `Student` 声明如点击此处查看代码图像\n\n```java\n\
  public class Student extends Person {\n    private int id;\n    public Student(String\
  \ name, int id) { \n        super(name); \n        this.id = id; \n    }\n    public\
  \ int getId() { return id; }\n}\n```\n\n然后你可以构造一个 `Student` 并将其赋值给 `Person` 变量。点击此处查看代码图像\n\
  \n```java\nPerson p = new Student(\"Fred\", 1); // OK\n```\n\n### 4.1.9 保护访问 (Protected\
  \ Access)\n\n有时你希望将方法限制为仅子类可见，或者较少地允许子类访问实例变量。为了这一点，将类特征声明为 `protected`。\n\n例如，假设父类\
  \ `Employee` 将实例变量 `salary` 声明为 `protected` 而不是 `private`。点击此处查看代码图像\n\n```java\n\
  package employees;\npublic class Employee {\n    protected double salary;\n    ...\n\
  }\n```\n\n与 `Employee` 同一包的所有类都可以访问此字段。现在考虑来自另一个包的子类：点击此处查看代码图像\n\n```java\npackage\
  \ managers;\nimport employees.Employee;\npublic class Manager extends Employee {\n\
  \    ...\n    public double getSalary() {\n        return salary + bonus; // 访问\
  \ salary 合法\n    }\n}\n```\n\n`Manager` 类的方法可以查看 `Manager` 对象的 `salary` 变量，但不能查看其他\
  \ `Employee` 对象。这种限制是为了防止你通过形成子类来滥用保护机制。\n\n当然，保护性字段应该谨慎使用。一旦提供，你就无法在不破坏使用它们的类的情况下取消它们。\n\
  \n保护方法和构造函数更为常见。例如，`Object` 类的 `clone` 方法是保护的，因为其使用起来有些复杂（参见第 4.2.4 节，“克隆对象](#part0013.html_ch04lev2sec16)”（第\
  \ 151 页）。\n\n***\n\n![图像](img/00007.jpeg) \n\n***\n\n### 4.1.10 匿名子类 (Anonymous\
  \ Subclasses)\n\n正如你可以拥有实现接口的匿名类一样，你可以拥有扩展父类的匿名类。这对于调试非常有用：点击此处查看代码图像\n\n```java\n\
  ArrayList<String> names = new ArrayList<String>(100) {\n    @Override\n    public\
  \ void add(int index, String element) {\n        super.add(index, element);\n  \
  \      System.out.printf(\"Adding %s at %d\\n\", element, index);\n    }\n};\n```\n\
  \n括号名后面的参数将传递给父类构造函数。在这里，我们构造了一个 `ArrayList<String>` 的匿名子类，它重写了 `add` 方法。该实例是以初始容量\
  \ 100 构造的。\n\n\n\n\n\n一种名为 `double brace initialization`（双括号初始化）的技巧以一种非常奇的方式使用了内部类语法。假设你想构造一个数组列表并将其传递给方法：\n\
  \n点击此处查看代码图像\n\n```java\nArrayList<String> friends = new ArrayList<>();\nfriends.add(\"\
  Harry\");\nfriends.add(\"Sally\");\ninvite(friends);\n```\n\n如果你再也不需要这个数组列表，那么将其变成匿名的会很不错。但是，你该如何添加元素呢？操作方法如下：\n\
  \n点击此处查看代码图像\n\n```java\ninvite(new ArrayList<String>() {{ add(\"Harry\"); add(\"\
  Sally\"); }});\n```\n\n注意这对双大括号。外层括号创建了一个 `ArrayList<String>` 的匿名子类。内层括号是一个初始化块（参见第\
  \ 2 章）。\n\n我不建议你在 Java 冷知识竞赛之外之外使用这种技巧。除了语法令人困惑之外，它还有几个缺点。它的效率低下，而且取决于 `equals`\
  \ 方法的实现方式，构造的对象在相等性测试中可能会表现得异常。\n\n### 4.1.11 继承与默认方法\n\n假设一个类继承另一个类并实现了一个接口，而这两者恰好有一个同名的方法。\n\
  \n点击此处查看代码图像\n\n```java\npublic interface Named {\n    default String getName()\
  \ { return \"\"; }\n}\n\npublic class Person {\n    ...\n    public String getName()\
  \ { return name; }\n}\n\npublic class Student extends Person implements Named {\n\
  \    ...\n}\n```\n\n在这种情况下，父类的实现总是优于接口的实现。子类不需要解决冲突。\n\n相比之下，正如你在第 3 章中所看到的，当从两个接口继承相同的默认方法时，你必须解决这种冲突。\n\
  \n“类胜出”规则确保了与 Java 7 的兼容性。如果你在接口中添加了默认方法，它对在默认方法出现之前正常工作的代码没有影响。\n\n### 4.1.12 使用\
  \ `super` 的方法表达式\n\n回想第 3 章中的内容，方法表达式可以采用 `object::instanceMethod` 的形式。使用 `super`\
  \ 代替对象引用也是有效的。方法表达式\n\n`super::instanceMethod`\n\n使用 `this` 作为目标，并调用给定方法的父类版本。这里是一个显示其机制的人工示例：\n\
  \n点击此处查看代码图像\n\n```java\npublic class Worker {\n    public void work() {\n     \
  \   for (int i = 0; i < 100; i++) System.out.println(\"Working\");\n    }\n}\n\n\
  public class ConcurrentWorker extends Worker {\n    public void work() {\n     \
  \   Thread t = new Thread(super::work);\n        t.start();\n    }\n}\n```\n\n构造线程时使用了一个\
  \ `Runnable`，其 `run` 方法调用了父类的 `work` 方法。\n\n### 4.2 `Object`：宇宙超类\n\nJava 中的每个类都直接或间接自\
  \ `Object` 类。当一个类没有显式的父类时，它隐式地继承 `Object`。例如，\n\n```java\npublic class Employee\
  \ { ... }\n```\n\n等同于\n\n点击此处查看代码图像\n\n```java\npublic class Employee extends Object\
  \ { ... }\n```\n\n`Object` 类定义了适用于任何 Java 对象的方法（参见表 4-1）。我们将在接下来的章节中详细检查其中的几个方法。\n\
  \n**表 4-1** `java.lang.Object` 类的方法\n\n| 方法 | 说明 |\n| :--- | :--- |\n| `String toString()`\
  \ | 返回此对象的字符串表示，默认是类名和哈希码。 |\n| `boolean equals(Object other)` | 如果此对象被认为与 `other`\
  \ 相等，则返回 `true`；如果 `other` 为 `null` 或与 `other` 不同则返回 `false`。默认情况下，如果两个对象是相同的，则它们相等的。与其使用\
  \ `obj.equals(other)`，不如考虑空安全的替代方案 `Objects.equals(obj, other)`。 |\n| `int hashCode()`\
  \ | 为此对象产生哈希码。相等的对象必须具有相同的哈希码。除非重写，否则哈希码由虚拟机以某种方式分配。 |\n| `Class<?> getClass()`\
  \ | 返回描述该对象所属类的 `Class` 对象。 |\n| `protected Object clone()` | 创建此对象的副本。默认情况下，副本是浅拷贝的。\
  \ |\n| `protected void finalize()` | 当此对象被垃圾回收器回收时会调用此方法。不要重写它。 |\n| `wait`, `notify`,\
  \ `notifyAll` | 参见第 10 章。 |\n\n### 4.2.1 `toString` 方法\n\n`Object` 类中一个重要的方法是返回字符串的\
  \ `toString`。例如，`Point` 的 `toString` 方法返回类似如下的内容：`java.awt.Point[x=10,y=20]`\n\n\
  许多 `toString` 方法遵循这种格式：类名，后面跟着括括号内的实例变量。以下是 `Employee` 的此类实现：\n\n```java\npublic\
  \ class Employee {\n    ...\n    public String toString() {\n        return getClass()\
  \ + \"[salary=\" + salary +\n    }\n}\n```\n\n每当对象与字符串拼接时，Java 编译器都会自动调用 `toString`\
  \ 方法。例如：\n\n```java\nPoint p = new Point(10, 20);\nString message = \"The current\
  \ position is \" + p;\n```\n\n通过调用 `getClass()`，这对于子类来说是正确的。在子类中，调用 `super.toString()`：\n\
  \n```java\npublic class Manager extends Employee {\n    ...\n    public String toString()\
  \ {\n        return super.toString() + \"[bonus=\" + bonus + \"]\";\n    }\n}\n\
  ```\n\n### 4.2.2 `equals` 方法\n\n`equals` 方法测试一个对象是否认为与另一个相等。在 `Object` 类中实现的 `equals`\
  \ 方法判断两个对象引用是否相同。这是一个非常合理的默认值——如果两个对象是相同的，它们应该是相等的。对于许多类来说，不需要额外操作。例如，比较两个 `Scanner`\
  \ 对象的相等性并没有意义。\n\n\n\n\n\n仅针对基于的等性测试重写 `equals` 方法，在这种测试中，两个对象在内容相同时被认为是是等的。例如，`String`\
  \ 类重写了 `equals` 来检查两个字符串是否由相同的字符组成。\n\n* * *\n\n![Image](img/00007.jpeg) 注意\n\n\
  每当你重写 `equals` 方法时，你*必须*提供一个兼容的 `hashCode` 方法——参见第 4.2.3 节，“`hashCode` 方法](#part0013.html_ch04lev2sec15)”（第\
  \ 150 页）。\n\n* * *\n\n假设我们认为如果 `Item` 类的两个对象的描述和价格匹配，则它们是相等的。以下是实现 `equals` 方法的方法：\n\
  \n点击此处查看代码图片\n\n```java\npublic class Item {\n\n    private String description;\n\
  \    private double price;\n    ...\n\n    public boolean equals(Object otherObject)\
  \ {\n        // 快速测试对象是否为同一个实例\n        if (this == otherObject) return true;\n\
  \        // 如果参数为 null，必须返回 false\n        if (otherObject == null) return false;\n\
  \        // 检查 `otherObject` 是否为 `Item`\n        if (getClass() != otherObject.getClass())\
  \ return false;\n        // 测试实例变量是否具有相同的值\n        Item other = (Item) otherObject;\n\
  \        return Objects.equals(description, other.description)\n            && price\
  \ == other.price;\n    }\n\n    public int hashCode() { ... } // 参见第 4.2.3 节\n}\n\
  ```\n\n在 `equals` 方法中你需要经过若干常规步骤：\n\n1. 相等的对象通常是相同的，这种测试非常廉价。\n2. 每一个 `equals` 方法在与\
  \ `null` 比较时都需要返回 `false`。\n3. 由于 `equals` 方法重写了 `Object.equals`，其参数类型为 `Object`，你需要将其强制转换为实际类型，以便查看其实例变量。在在此之前，使用\
  \ `getClass` 方法或 `instanceof` 运算符进行类型检查。\n4. 最后，比较实例变量。对于基本数据类型使用 `==`。然而，对于 `double`\
  \ 值，如果你担心 ±∞ 或 NaN，请使用 `Double.equals`。对于对象，使用 `Objects.equals`，它是 `equals` 方法的空安全版本。调用\
  \ `Objects.equals(x, y)` 在 `x` 为 `null` 时返回 `false`，而 `x.equals(y)` 则会抛出异常。\n\n\
  * * *\n\n![Image](img/00009.jpeg) 提示\n\n如果你的实例变量是数组，使用静态方法 `Arrays.equals` 来检查数组长度是否相等以及相应的数组元素是否相等。\n\
  \n* * *\n\n当你为子类定义 `equals` 方法时，首先调用父类的 `equals`。如果该测试未通过，则这些对象就不可能相等。如果父类的实例变量是相等，那么你就可以比较子类的实例变量了。\n\
  \n点击此处查看代码图片\n\n```java\npublic class DiscountedItem extends Item {\n\n    private\
  \ double discount;\n    ...\n\n    public boolean equals(Object otherObject) {\n\
  \        if (!super.equals(otherObject)) return false;\n        DiscountedItem other\
  \ = (DiscountedItem) otherObject;\n        return discount == other.discount;\n\
  \    }\n\n    public int hashCode() { ... }\n}\n```\n\n注意，如果 `otherObject` 不是 `DiscountedItem`，则父类中的\
  \ `getClass` 测试将失败。\n\n在比较属于不同类的值时，`equals` 方法应该如何表现？这直是一个存在争议的问题。在上例中，如果类不完全匹配，`equals`\
  \ 方法将返回 `false`。但许多程序员使用 `instanceof` 测试来代替：\n\n点击此处查看代码图片\n\n```java\nif (!(otherObject\
  \ instanceof Item)) return false;\n```\n\n在比较属于不同类的值时，`equals` 方法应该如何表现？这直是一个存在争议的问题。在上例中，如果类不完全匹配，`equals`\
  \ 方法将返回 `false`。但许多程序员使用 `instanceof` 测试来代替：\n\n```java\nif (!(otherObject instanceof\
  \ Item)) return false;\n```\n\n\n\n\n在接口中，你永远无法创建一个重定义了 `Object` 类中某个方法的默认方法。特别是，接口不能为\
  \ `toString`、`equals` 或 `hashCode` 定义默认方法。根据“类胜出”规则（参见第 4.1.11 节“继承与默认方法”第 144 页），这种方法永远无法胜过\
  \ `Object.toString`、`Object.equals` 或 `Object.hashCode`。\n\n***\n\n### 4.2.4 克隆对象\n\
  \n你刚刚看到了 `Object` 类中常用的重写“三大”方法：`toString`、`equals` 和 `hashCode`。在本节中，你将学习如何重写 `clone`\
  \ 方法。正如你所看到的，这是非常复杂的，而且很少必要。除非你有充分理由，否则不要重写 `clone`。Java 标准库中只有不到 5% 的类实现了 `clone`。\n\
  \n`clone` 方法目的是目的是对象的“克隆”——一个与原始对象具有相同状态的不同对象。如果你修改了其中一个，另一个将保持不变。\n\n点击此处查看代码图片\n\
  \n```java\nEmployee cloneOfFred = fred.clone();\n\ncloneOfFred.raiseSalary(10);\
  \ // fred 保持不变\n```\n\n`clone` 方法在 `Object` 类中声明为 `protected`，因此如果你想让类类的用户克隆实例，就必须重写它。\n\
  \n`Object.clone` 方法执行的是*浅拷贝*。它简单地将所有实例变量从原始对象复制到克隆对象。如果变量是原始类型或不可变的，那是没问题的。但如果它们不是，原始对象和克隆对象共享可变状态，这可能会导致问题。\n\
  \n考虑一个拥有接收者列表的邮件消息类。\n\n点击此处查看代码图片\n\n```java\npublic final class Message {\n  \
  \  private String sender;\n    private ArrayList<String> recipients;\n    private\
  \ String text;\n    ...\n    public void addRecipient(String recipient) { ... };\n\
  }\n```\n\n如果你对 `Message` 对象进行浅拷贝，原始对象和克隆对象将共享 `recipients` 列表（参见图 4-1）：\n\n点击此处查看代码图片\n\
  \n```java\nMessage specialOffer = ...;\n\nMessage cloneOfSpecialOffer = specialOffer.clone();\n\
  ```\n\n![Image](img/00321.jpeg)\n\n**图 4-1** 对象的浅拷贝\n\n如果其中一个对象更改了接收者列表，更改将反映在另一个对象上。因此，`Message`\
  \ 类需要重写 `clone` 方法以执行*深拷贝*。\n\n克隆可能是不可能或不值得费力的。例如，克隆一个 `Scanner` 对象将非常有挑战性。\n\n\
  通常，当你实现一个类时，你需要决定：\n\n1. 你不想提供 `clone` 方法，或者\n2. 继承的 `clone` 方法是可以接受的，或者\n3. `clone`\
  \ 方法应该执行深拷贝。\n\n对于第一种选择，只需什么都不做。你的类将继承 `clone` 方法，但由于它是 `protected` 的，你类的任何用户都无法调用它。\n\
  \n要选择第二种方案，你的类必须实现 `Cloneable` 接口。这是一个没有任何任何方法的接口，被称为*标记*（tagging）或标记（marker）接口。（记得\
  \ `clone` 方法定义在 `Object` 类中。）`Object.clone` 方法在执行浅拷贝之前会检查是否实现了此接口，否则将抛出 `CloneNotSupportedException`。\n\
  \n你还会希望将 `clone` 的范围从 `protected` 提升到 `public`，并更改返回类型。\n\n最后，你需要处理 `CloneNotSupportedException`。这是一个*受检*异常，正如你在第\
  \ 5 章中看到的，你必须声明它或捕获它。如果你的类是 `final` 的，你可以捕获它。否则，请声明该异常，因为子类可能仍然想再次抛出它。\n\n点击此处查看代码图片\n\
  \n```java\npublic class Employee implements Cloneable {\n    ...\n    public Employee\
  \ clone() throws CloneNotSupportedException {\n        return (Employee) super.clone();\n\
  \    }\n}\n```\n\n强制转换 `(Employee)` 是必要的，因为 `Object.clone` 的返回类型是 `Object`。\n\n\
  实现 `clone` 方法的第三种方案（即类需要执行深拷贝）是最复杂的情况。你完全不需要使用 `Object.clone` 方法。这里是 `clone` 的简单实现：\n\
  \n点击此处查看代码图片\n\n```java\npublic Message clone() {\n    try {\n        Message cloned\
  \ = (Message) super.clone();\n        cloned.recipients = new ArrayList<>(recipients);\n\
  \        return cloned;\n    } catch (CloneNotSupportedException ex) {\n       \
  \ return null;\n    }\n}\n```\n\n\n\n\n点击此处查看代码图片\n\n`Size[] allValues = Size.values();`\n\
  \n返回一个包含元素 `Size.SMALL`、`Size.MEDIUM` 等数组。\n\n* * *\n\n![Image](img/00009.jpeg)\
  \ 提示\n\n使用此方法在增强型 `for` 循环中遍历枚举类型的所有实例：\n\n点击此处查看代码图片\n\n```java\nfor (Size s :\
  \ Size.values()) { System.out.println(s); }\n```\n\n* * *\n\n`ordinal()` 方法返回实例在\
  \ `enum` 声明中的位置，从零开始计数。例如，`Size.MEDIUM.ordinal()` 返回 `1`。当然，你使用此方法时需要小心。如果插入了新的常量，值会发生偏移。\n\
  \n每个枚举类型 `E` 自动实现 `Comparable<E>`，允许仅与其自身的对象进行比较。比较是通过序数值（ordinal values）进行的。\n\n\
  * * *\n\n![Image](img/00003.jpeg) 笔记\n\n技术上，枚举类型 `E` 继承了 `Enum<E>` 类，从该类继承了 `compareTo`\
  \ 方法以及本节描述的其他方法。表 4-2 显示了 `Enum` 类的方法。\n\n* * *\n\n### 表 4-2 `java.lang.Enum<E>`\
  \ 类的方法\n\n| 方法 | 描述 |\n| :--- | :--- |\n| `String toString()` `String name()` |\
  \ 此实例的名称，如在 `enum` 声明中提供的。`name` 方法是 `final` 的。 |\n| `int ordinal()` | 此实例在 `enum`\
  \ 声明中的位置。 |\n| `int compareTo(Enum<E> other)` | 通过序数值将此实例与 `other` 进行比较。 |\n| `static\
  \ T valueOf(Class<T> type, String name)` | 返回给定名称的实例。考虑使用枚举类型生成的 `valueOf` 或 `values`\
  \ 方法。 |\n| `Class<E> getDeclaringClass()` | 获取定义此实例的类。（如果实例有体，则与 `getClass()` 不同。）\
  \ |\n| `int hashCode()` `protected void finalize()` | 这些方法调用相应的 `Object` 方法并是 `final`\
  \ 的。 |\n| `protected Object clone()` | 抛出 `CloneNotSupportedException`。 |\n\n###\
  \ 4.3.2 构造函数、方法和字段\n\n如果你喜欢，可以为枚举类型添加构造函数、方法和字段。这里是一个示例：\n\n点击此处查看代码图片\n\n```java\n\
  public enum Size {\n    SMALL(\"S\"), MEDIUM(\"M\"), LARGE(\"L\"), EXTRA_LARGE(\"\
  XL\");\n    private String abbreviation;\n    Size(String abbreviation) {\n    \
  \    this.abbreviation = abbreviation;\n    }\n    public String getAbbreviation()\
  \ { return abbreviation; }\n}\n```\n\n枚举的每个实例都保证只恰恰构造一次。\n\n* * *\n\n![Image](img/00003.jpeg)\
  \ 笔记\n\n枚举的构造函数总是私有的。你可以像前面的示例一样省略 `private` 修饰符。将枚举构造函数声明为 `public` 或 `protected`\
  \ 是语法错误。\n\n* * *\n\n### 4.3.3 实例的体\n\n你可以为每个单独的 `enum` 实例添加方法，但它们必须重写枚举中定义的方法。例如，为了实现一个计算器，你可以这样做：\n\
  \n点击此处查看代码图片\n\n```java\npublic enum Operation {\n    ADD {\n        public int\
  \ eval(int arg1, int arg2) { return arg1 + arg2; }\n    },\n    SUBTRACT {\n   \
  \     public int eval(int arg1, int arg2) { return arg1 - arg2; }\n    },\n    MULTIPLY\
  \ {\n        public int eval(int arg1, int arg2) { return arg1 * arg2; }\n    },\n\
  \    DIVIDE {\n        public int eval(int arg1, int arg2) { return arg1 / arg2;\
  \ }\n    };\n    public abstract int eval(int arg1, int arg2);\n}\n```\n\n在计算器程序的循环中，将根据用户输入将变量设置为这些值中的一个，然后调用\
  \ `eval`：\n\n点击此处查看代码图片\n\n```java\nOperation op = ...;\nint result = op.eval(first,\
  \ second);\n```\n\n* * *\n\n![Image](img/00003.jpeg) 笔记\n\n技术上，这些常量中的每一个都属于 `Operation`\
  \ 的一个匿名子类。任何你可以放入匿名子类体中的内容，也可以放入成员的体中。\n\n* * *\n\n### 4.3.4 静态成员\n\n枚举拥有静态成员是合法的。然而，你必须小心构造过程。枚举常量会在静态成员之前构造，因此你不能在枚举构造函数中引用任何静态成员。例如，以下内容是非法的：\n\
  \n点击此处查看代码图片\n\n```java\npublic enum Modifier {\n    PUBLIC, PROTECTED, STATIC,\
  \ ABSTRACT;\n    private static int mask = 0;\n    Modifier() {\n        mask =\
  \ 1; // 错误——在构造函数中访问静态变量\n    }\n}\n```\n\n解决办法是在静态初始化块中使用：\n\n点击此处查看代码图片\n\n```java\n\
  public enum Modifier {\n    PUBLIC, PROTECTED, STATIC, ABSTRACT;\n    private static\
  \ int mask;\n    static {\n        mask = 1;\n    }\n    Modifier() {\n        mask++;\n\
  \    }\n}\n```\n\n一旦常量被构造，静态初始化器就会按通常方式运行。\n\n* * *\n\n![Image](img/00003.jpeg)\
  \ 笔记\n\n枚举可以嵌套在类内部。嵌套枚举是隐式的——它们的方法无法引用实例变量。\n\n* * *\n\n### 4.3.5 对枚举进行\n\n你可以在\
  \ `switch` 语句中使用枚举常量。\n\n点击此处查看代码图片\n\n```java\nenum Operation { ADD, SUBTRACT,\
  \ MULTIPLY, DIVIDE };\npublic static int eval(Operation op, int arg1, int arg2)\
  \ {\n    int result = 0;\n    switch (op) {\n        case ADD: result = arg1 + 2;\
  \ break;\n        case SUBTRACT: result = arg1 - 2; break;\n        case MULTIPLY:\
  \ result = arg1 * 2; break;\n        case DIVIDE: result = arg1 / 2; break;\n  \
  \  }\n    return result;\n}\n```\n\n在 `switch` 语句中使用 `ADD` 而不是 `Operation.ADD`——类型是从计算的表达式推断出来的。\n\
  \n* * *\n\n![Image](img/00003.jpeg) 笔记\n\n根据语言规范，如果对枚举的 switch 不是详尽的（即没有为所有常量提供分支且没有\
  \ `default` 子句），鼓励编译器给出警告。Oracle 编译器不会产生此类警告。\n\n* * *\n\n![Image](img/00009.jpeg)\
  \ 提示\n\n如果你想在 `switch` 之外通过简单名称引用枚举实例，请使用静态导入声明。例如，通过以下声明\n\n点击此处查看代码图片\n\n```java\n\
  import static com.horstmann.corejava.Size.*;\n```\n\n你可以使用 `SMALL` 而不是 `Size.SMALL`。\n\
  \n* * *\n\n## 4.4 运行时类型信息和资源\n\n在 Java 中，你可以在运行时确定对象属于哪个类。这有时有用，例如在 `equals` 和 `toString`\
  \ 方法的实现中。此外，你可以发现类是如何加载的并加载其关联的数据，称为“资源”。\n\n### 4.4.1 `Class` 类\n\n假设你有一个 `Object`\
  \ 类型的变量，填充了某些对象引用，你想更多更多更多，例如它属于哪个类。\n\n`getClass` 方法产生一个名为 `Class` 的类的对象（不无奇）。\n\
  \n```java\nObject obj = ...;\nClass<?> cl = obj.getClass();\n```\n\n* * *\n\n参见第六章\
  \ 关于 `<?>` 后缀的解释。现在只需忽略它。但不要省略它。如果你这样做，不仅你的 IDE 会给你发出一个难看的警告，还会关闭涉及该变量的表达式中的有用类型检查。\n\
  \n\n\n\n-   [Feynman's learning method](https://wiki.example.org/feynmans_learning_method)\
  \ is inspired by **Richard Feynman**, the Nobel Prize winner in physics.\n\n1. \
  \ With **Feynman's skills**, you 只需花`20 min`就能深入理解知识点，而且记忆深刻*难以遗忘*。\n\n```java\n\
  if (condVar > someVal) {console.log(\"xxx\")}\n```\n[/content]\n\n译文：\n\n[content]\n\
  -   [费曼学习法](https://wiki.example.org/feynmans_learning_method)灵感源于诺贝尔物理获得者**查德·费曼**。\n\
  \n1.  运用费曼技巧，你只需花`20 min`就能深入理解知识点，而且记忆深刻*难以遗忘*。\n\n```java\nif (condVar > someVal)\
  \ {console.log(\"xxx\")}\n```\n\n\n\n虚拟机按需加载类文件，从要调用的 `main` 方法所在的类开始。该类将依赖于其他类，例如\
  \ `java.lang.System` 和 `java.util.Scanner`，这些类将与它们所依赖的类一起加载。\n\n在执行 Java 程序时，至少涉及三个类加载器。\n\
  \n-   `bootstrap class loader`（启动类加载器）加载最基础的 Java 库类。它是虚拟机的一部分。\n-   `platform class\
  \ loader`（平台类加载器）加载其他库类。与通过启动类加载器加载的类不同，平台权限可以通过安全策略进行配置。\n-   `system class loader`（系统类加载器）加载应用程序类。它在类路径和模块模块路径上的目录和\
  \ JAR 文件中定位类。\n\n***\n\n![Image](img/00007.jpeg) 注意事项\n\n在 Oracle JDK 的之前的版本中，平台类加载器和系统类加载器是\
  \ `URLClassLoader` 类的实例。现在情况已不再如此。某些程序员曾使用 `URLClassLoader` 的 `getURLs` 方法来查找类路径。请改用\
  \ `System.getProperty(\"java.class.path\")`。\n\n***\n\n你可以通过创建自己的 `URLClassLoader`\
  \ 实例，从尚未在类路径上的目录或 JAR 文件加载类。这通常用于加载插件。\n\n点击此处查看代码图片\n\n```\nURL[] urls = {\n  \
  \  new URL(\"file:///path/to/directory/\"),\n    new URL(\"file:///path/to/jarfile.jar\"\
  )\n};\nString className = \"com.mycompany.plugins.Entry\";\n\ntry (URLClassLoader\
  \ loader = new URLClassLoader(urls)) {\n    Class<?> cl = Class.forName(className,\
  \ true, loader);\n    // 现在构造 `cl` 的实例——参见第 4.5.4 节\n    ...\n}\n```\n\n***\n\n\
  ![Image](img/00007.jpeg) 注意事项\n\n`Class.forName(className, true, loader)` 调用中的第二个参数确保类的静态初始化在加载后发生。你绝对希望这样做发生。\n\
  \n不要使用 `ClassLoader.loadClass` 方法。它不会运行静态初始化器。\n\n***\n\n***\n\n![Image](img/00003.jpeg)\
  \ 提示\n\n`URLClassLoader` 从文件系统加载类。如果你想从其他地方加载类，你需要编写自己的类加载器。你只需要实现的方法是 `findClass`，如下所示：\n\
  \n点击此处查看代码图片\n\n```java\npublic class MyClassLoader extends ClassLoader {\n    ...\n\
  \    @Override public Class<?> findClass(String name)\n               throws ClassNotFoundException\
  \ {\n      byte[] bytes = the bytes of the class file\n      return defineClass(name,\
  \ bytes, 0, bytes.length);\n    }\n}\n```\n\n参见第 14 章 有一个示例，其中类被编译到内存中然后被加载。\n\n\
  ***\n\n#### 4.4.4 上文类加载器\n\n大多数时候，你不需要担心类加载过程。类在其他类需要时会被透明地加载。然而，如果一个方法动态加载类，而该方法又是从一个使用另一个类加载器加载的类中调用的，就会出现问题。这里有一个具体的例子。\n\
  \n1. 你提供了一个由系统类加载器加载的工具类，它有一个方法：\n\n点击此处查看代码图片\n\n```java\npublic class Util {\n\
  \    Object createInstance(String className) {\n        Class<?> cl = Class.forName(className);\n\
  \        ...\n    }\n    ...\n}\n```\n\n2. 你用另一个类加载器加载插件，该加载器从插件 JAR 中读取类。\n3. 插件调用\
  \ `Util.createInstance(\"com.mycompany.plugins.MyClass\")` 来实例化插件 JAR 中的类。\n\n插件的作者期望该类被加载。然而，`Util.createInstance`\
  \ 使用它自己的类加载器来执行 `Class.forName`，而该加载器不会查找插件 JAR。这种现象被称为*类加载器反转*（classloader inversion）。\n\
  \n一种解决办法是将类加载器传递给工具方法，然后传递给 `forName` 方法。\n\n点击此处查看代码图片\n\n```java\npublic class\
  \ Util {\n    public Object createInstance(String className, ClassLoader loader)\
  \ {\n        Class<?> cl = Class.forName(className, true, loader);\n        ...\n\
  \    }\n}\n```\n\n另一种策略是使用当前线程的*上下文类加载器*（context class loader）。主线程的上下文加载器是系统类类。当创建一个新线程时，它的上下文加载器被设置为系统类。因此，如果你什么都不做，所有线程都将拥有系统加载器。工具方法随后可以获取上下文加载器：\n\
  \n点击此处查看代码图片\n\n```java\npublic class Util {\n    Object createInstance(String className)\
  \ {\n        Thread t = Thread.currentThread();\n        ClassLoader loader = t.getContextClassLoader();\n\
  \        Class<?> cl = Class.forName(className, true, loader);\n        ...\n  \
  \  }\n}\n```\n\n***\n\n### 4.4.5 服务加载器\n\n某些服务在程序组装时需要进行配置。实现这一点的方法是使不同的实现可用。`ServiceLoader`\
  \ 能够方便地加载符合接口的实现。\n\n定义一个接口（如果你喜欢，也可以超类），包含每个服务实例应该提供的方法。例如，假设你的服务提供加密。\n\n```java\n\
  package com.corejava.crypt;\npublic interface Cipher {\n    byte[] encrypt(byte[]\
  \ source, byte[] key);\n    byte[] decrypt(byte[] source, byte[] key);\n    int\
  \ strength();\n}\n```\n\n服务提供者提供一个或多个实现该服务的类，例如\n\n```java\npackage com.corejava.crypt.impl;\n\
  public class CaesarCipher implements Cipher {\n    public byte[] encrypt(byte[]\
  \ source, byte[] key) {\n        byte[] result = new byte[source.length];\n    \
  \    for (int i = 0; i < source.length; i++)\n            result[i] = (byte)(source[i]\
  \ + key[0]);\n        return result;\n    }\n    public byte[] decrypt(byte[] source,\
  \ byte[] key) {\n        return encrypt(source, new byte[] { (byte) -key[0] });\n\
  \    }\n    public int strength() { return 1; }\n}\n```\n\n实现类可以位于任何包中，不一定与服务接口位于同一个包。每个类都必须有一个无参构造函数。\n\
  \n现在，将提供者类名添加到 UTF-8 编码的文本文件中，该文件位于类加载器可以找到的目录中。在我们的示例中，`META-INF/services/com.corejava.crypt.Cipher`\
  \ 文件将包含行：\n\n`com.corejava.crypt.impl.CaesarCipher`\n\n完成这些准备后，程序按所示初始化服务加载器：\n\n\
  点击此处查看代码图片\n\n```java\npublic static ServiceLoader<Cipher> cipherLoader = ServiceLoader.load(Cipher.class);\n\
  ```\n\n这在程序中只需执行一次。\n\n\n\n\n服务加载器的 `iterator` 方法提供了一个用于遍历所有提供的服务实现类的迭代器。（有关迭代器的更多信息，请参阅\
  \ 第 7 章）。最简单的方法是使用增强型 `for` 循环来遍历它们。在循环中，选择一个合适的对象来执行服务。\n\n点击此处查看代码图片\n\n```java\n\
  public static Cipher getCipher(int minStrength) {\n    for (Cipher cipher : cipherLoader)\
  \ // 隐式调用 `iterator`\n        if (cipher.strength() >= minStrength) return cipher;\n\
  \    return null;\n}\n```\n\n或者，你可以使用流（参见 第 8 章）来定位所需的服务。`stream` 方法产生 `ServiceLoader.Provider`\
  \ 实例的流。该接口拥有 `type` 和 `get` 方法，用于获取提供者类和提供者实例。如果你通过类型选择提供者，那么只需调用 `type`，而不会不必要的实例化服务实例。在示例中，我们需要获取提供者，因为我们要对流进行过滤，筛选出具有强度的密码：\n\
  \n点击此处查看代码图片\n\n```java\npublic static Optional<Cipher> getCipher2(int minStrength)\
  \ {\n    return cipherLoader.stream()\n        .map(ServiceLoader.Provider::get)\n\
  \        .filter(c -> c.strength() >= minStrength)\n        .findFirst();\n}\n```\n\
  \n如果你愿意接受任何实现，只需调用 `findFirst`：\n\n点击此处查看代码图片\n\n```java\nOptional<Cipher> cipher\
  \ = cipherLoader.findFirst();\n```\n\n`Optional` 类在 第 8 章 中进行了解释。\n\n## 4.5 反射\n\
  \n反射允许程序在运行时检查对象的内容并在其上调用任意方法。这种能力对于实现如对象关系映射器（ORM）或 GUI 构建器等工具非常有用。\n\n由于反射主要对工具构建者感兴趣，应用程序程序员可以安全地跳过本节，并在需要时返回。\n\
  \n### 4.5.1 穷举类成员\n\n`java.lang.reflect` 包中的 `Field`、`Method` 和 `Constructor` 这三个类描述了类的字段、方法和构造函数。这三个类都有一个名为\
  \ `getName` 的方法，返回成员的名称。`Field` 类有一个 `getType` 方法，它返回一个对象（同样是 `Class` 类型），用于描述字段类型。`Method`\
  \ 和 `Constructor` 类有报告参数类型的方法，`Method` 类还报告返回类型。\n\n这三个类都有一个名为 `getModifiers` 的方法，它返回一个整数，其中不同的位位被开启或关闭，用于描述使用的修饰符（如\
  \ `public` 或 `static`）。你可以使用静态方法如 `Modifier.isPublic` 和 `Modifier.isStatic` 来分析\
  \ `getModifiers` 返回的整数。`Modifier.toString` 返回所有修饰符的字符串。\n\n`Class` 类的 `getFields`、`getMethods`\
  \ 和 `getConstructors` 方法返回该类支持的 `public` 字段、方法和构造函数的数组；这包括公有的继承成员。`getDeclaredFields`、`getDeclaredMethods`\
  \ 和 `getDeclaredConstructors` 方法返回由该类中声明的所有字段、方法和构造函数组成的数组。这包括 `private`、包私有和 `protected`\
  \ 成员，但不包括父类的成员。\n\n`Executable` 类（`Method` 和 `Constructor` 的公共父类）的 `getParameters`\
  \ 方法返回一个 `Parameter` 对象的数组，用于描述方法参数。\n\n***\n\n![Image](img/00003.jpeg) 注意\n\n只有当类使用\
  \ `-parameters` 标志进行编译时，参数名称才能在运行时可用。\n\n***\n\n例如，以下是你可以打印类所有方法的方法：\n\n点击此处查看代码图片\n\
  \n```java\nClass<?> cl = Class.forName(className);\n\nwhile (cl != null) {\n   \
  \ for (Method m : cl.getDeclaredMethods()) {\n        System.out.println(\n    \
  \        Modifier.toString(m.getModifiers()) + \" \" +\n            m.getReturnType().getCanonicalName()\
  \ + \" \" +\n            m.getName() +\n            Arrays.toString(m.getParameters()));\n\
  \    }\n}\n```\n\n这段代码的非凡之处在于它可以分析任何类。\n\n\n\n\n\n点击此处查看代码图像\n\n```java\nPerson\
  \ p = ...;\n\nMethod m = p.getClass().getMethod(\"setName\", String.class);\n\n\
  m.invoke(obj, \"********\");\n```\n\n***\n\n![Image](img/00007.jpeg) 注意\n\n尽管 `clone`\
  \ 是所有数组类型的公共方法，当在描述数组的 `Class` 对象上调用 `getMethod` 时，它并不会被报告到。\n\n***\n\n### 4.5.4\
  \ 构造对象\n\n要构造一个对象，首先找到 `Constructor` 对象，然后调用它的 `newInstance` 方法。例如，假设你知道某个类有一个参数为\
  \ `int` 的公共构造函数。那么你可以这样构造一个新实例：\n\n点击此处查看代码图像\n\n```java\nConstructor constr = cl.getConstructor(int.class);\n\
  \nObject obj = constr.newInstance(42);\n```\n\n***\n\n![Image](img/00007.jpeg) 注意\n\
  \n`Class` 类有一个 `newInstance` 方法，用于根据无参构造函数构造给定类的对象。该方法现在已弃用，因为它有一个奇特的缺陷：如果无参构造函数抛出了受检异常，`newInstance`\
  \ 方法会重新抛出它，*即使它没有被声明*，从而完全破坏了对受检异常的编译检查。相反，你应该调用 `cl.getConstructor().newInstance()`。这样任何异常都会封装在\
  \ `InvocationTargetException` 中。\n\n***\n\n表 4-5 总结了处理 `Field`、`Method` 和 `Constructor`\
  \ 对象的最重要方法。\n\n**表 4-5** `java.lang.reflect` 包中的实用类和方法\n\n| **类** | **方法** | **备注**\
  \ |\n| :--- | :--- | :--- |\n| `AccessibleObject` | `void setAccessible(boolean\
  \ flag) static void setAccessible(AccessibleObject[] array, boolean flag)` | `AccessibleObject`\
  \ 是 `Field`、`Method` 和 `Constructor` 的父类。这些方法设置此成员或给定成员的访问权限。 |\n| `Field` | `String\
  \ getName()` `int getModifiers()` `Object get(Object obj)` `p getP(Object obj)`\
  \ `void set(Object obj, Object newValue)` `void setP(Object obj, Object newValue)`\
  \ | 对于每个基本类型 p 都有对应的 `get` 和 `set` 方法。 |\n| `Method` | `Object invoke(Object obj,\
  \ Object... args)` | 调用此对象描述的方法，传递给定参数并返回方法产生的值。对于静态方法，为 `obj` 传递 `null`。基本类型参数和返回值会被封装。\
  \ |\n| `Constructor` | `Object newInstance(Object... args)` | 调用此对象描述的构造函数，传递给定参数并返回构造的对象。\
  \ |\n| `Executable` | `String getName()` `int getModifiers()` `Parameters[] getParameters()`\
  \ | `Executable` 是 `Method` 和 `Constructor` 的父类。 |\n| `Parameter` | `boolean isNamePresent()`\
  \ `String getName()` `Class<?> getType()` | `getName` 方法获取名称，或者如果名称不存在，则获取如 `arg0`\
  \ 类的合成名称。 |\n\n### 4.5.5 JavaBeans\n\n许多面向对象的编程语言都支持*属性*，将 `object.propertyName`\
  \ 表达式映射到 getter 或 setter 方法的调用，取决于属性是可读还是可写的。Java 没有这种语法，但它有一种约定，即属性与 getter/setter\
  \ 对应。*JavaBean* 是一个具有无参构造函数、getter/setter 方法对以及任意其他方法的类。\n\ngetters 和 setters 必须遵循特定的模式\n\
  \n点击此处查看代码图像\n\n```java\npublic Type getProperty()\n\npublic void setProperty(Type\
  \ newValue)\n```\n\n通过省略 setter 或 getter，可以实现只读和只写属性。\n\n属性名称是 `get`/`set` 后后缀的*首字母小写*形式。例如，`getSalary`/`setSalary`\
  \ 产生一个名为 `salary` 的属性。然而，如果后缀的前*两个*字母是大写字母，则按原样取。例如，`getURL` 产生一个名为 `URL` 的只读属性。\n\
  \n***\n\n![Image](img/00003.jpeg) 注意\n\n对于布尔属性，你可以使用 `getProperty` 或 `isProperty`\
  \ 作为 getter，且后者更佳。\n\n***\n\nJavaBeans 起源于 GUI 生成器，JavaBeans 规范有一系列处理属性编辑器、属性更改事件和自定义属性发现的奥秘规则。这些功能在如今很少使用。\n\
  \n当你需要处理任意属性时，使用标准类来支持 JavaBeans 是一个好主意。给定一个类，如下所示获取 `BeanInfo` 对象：\n\n点击此处查看代码图像\n\
  \n```java\nClass<?> cl = ...;\n\nBeanInfo info = Introspector.getBeanInfo(cl);\n\
  \nPropertyDescriptor[] props = info.getPropertyDescriptors();\n```\n\n`PropertyDescriptor`\
  \ 产生属性的名称和类型。遗憾的是，没有方法根据属性名获取描述符，因此你需要遍历：\n\n```java\nString propertyName = ...;\n\
  \nObject propertyValue = null;\n\nfor (PropertyDescriptor prop : props) {\n    if\
  \ (prop.getName().equals(propertyName)) {\n        propertyValue = prop.getDescriptor();\n\
  \    }\n}\n```\n\n### 4.5.6 使用数组\n\n`isArray` 方法检查给定的 `Class` 对象是否表示数组。如果是，为了进一步分析或动态创建数组，请使用\
  \ `java.lang.reflect` 中的 `Array` 类。表 4-6 显示了它的方法。\n\n**表 4-6** `java.lang.reflect.Array`\n\
  \n| **方法** | **描述** |\n| :--- | :--- |\n| `static Object get(Object array, int index)`\
  \ `static void set(Object array, int index, Object newValue)` | 获取或设置数组指定索引处的元素，其中\
  \ p 基本类型。 |\n| `static int getLength(Object array)` | 获取数组长度。 |\n| `static Object\
  \ newInstance(Class<?> componentType, int length)` `static Object newInstance(Class<?>\
  \ componentType, int[] lengths)` | 返回一个给定维度的新数组。 |\n\n作为一个练习，让我们实现该方法如何扩展数组。\n\n\
  ```java\nPerson[] friends = new Person[100];\n\n...\n\n// 数组已满\n\nfriends = Arrays.copyOf(friends,\
  \ 2 * friends.length);\n```\n\n如何编写这样一个泛型方法？这里是第一次尝试：\n\n点击此处查看代码图像\n\n```java\n\
  public static Object[] badCopyOf(Object[] array, int newLength) { // 无用\n    Object[]\
  \ newArray = new Object[newLength];\n    for (int i = 0; i < Math.min(array.length,\
  \ newLength); i++)\n        newArray[i] = array[i];\n    return newArray;\n}\n```\n\
  \n然而，实际使用结果数组时存在问题。该方法返回的数组类型是 `Object[]`。对象数组不能转换为 `Person[]` 数组。点在于，正如我们之前提到的，Java\
  \ 数组会记住其元素的类型——即创建它的 `new` 表达式中所使用的类型。将 `Person[]` 数组临时转换为 `Object[]` 数组然后转换回是合法的，但一个从\
  \ `Object[]` 开始开始的数组永远无法转换为 `Person[]` 数组。\n\n为了创建一个与原始数组相同类型的新数组，你需要 `Array` 类的\
  \ `newInstance` 方法。提供组件类型和所需的长度：\n\n\n\n\n\n点击此处查看代码图像\n\n```java\npublic static\
  \ Object goodCopyOf(Object array, int newLength) {\n    Class<?> cl = array.getClass();\n\
  \    if (!cl.isArray()) return null;\n    Class<?> componentType = cl.getComponentType();\n\
  \    int length = Array.getLength(array);\n    Object newArray = Array.newInstance(componentType,\
  \ newLength);\n    for (int i = 0; i < Math.min(length, newLength); i++)\n     \
  \   Array.set(newArray, i, Array.get(array,  i));\n    return newArray;\n}\n```\n\
  \n注意，这个 `copyOf` 方法可以用于扩展任何类型数组，而不仅仅是对象数组。\n\n点击此处查看代码图像\n\n```java\nint[] primes\
  \ = { 2, 3, 5, 7, 11 };\nprimes = (int[]) goodCopyOf(primes, 10);\n```\n\n`goodCopyOf`\
  \ 的参数类型是 `Object`，而不是 `Object[]`。`int[]` 是一个 `Object`，但不是对象数组。\n\n### 4.5.7 代理（Proxies）\n\
  \n`Proxy` 类可以在运行时创建实现给定接口或一组接口的新类。只有当你会在编译时尚不确定需要实现哪些接口时，这种代理类才是必须的。\n\n代理类拥有指定接口所需的所有方法，以及\
  \ `Object` 类中定义的所有方法（`toString`、`equals` 等）。然而，由于你无法在运行时为这些方法定义新代码，因此你必须提供一个调用处理程序（invocation\
  \ handler），它是一个实现了 `InvocationHandler` 接口的类的对象。该接口有一个且仅有一个方法：\n\n点击此处查看代码图像\n\n\
  ```java\nObject invoke(Object proxy, Method method, Object[] args)\n```\n\n每当在代理对象上调用方法时，调用处理程序的\
  \ `invoke` 方法会被调用，并传入原始调用的 `Method` 对象和参数。随后，调用处理程序必须弄清楚如何处理该调用。调用处理程序可能采取的操作有很多，例如将调用路由到远程服务器，或为了调试目的跟踪调用。\n\
  \n要创建一个代理对象，请使用 `Proxy` 类的 `newProxyInstance` 方法。该方法有三个参数：\n\n- 一个类加载器（参见第 4.4.3\
  \ 节，“类加载器](#part0013.html_ch04lev2sec24)”第 163 页），或 `null` 以使用默认类加载器\n- 一个 `Class`\
  \ 对象数组，每个对象对应一个要实现的接口\n- 调用处理程序\n\n为了展示代理的机制，这里有一个示例，其中数组被填充了 `Integer` 对象的代理，在打印跟踪信息后将调用转发给原始对象：\n\
  \n点击此处查看代码图像\n\n```java\nObject[] values = new Object[1000];\nfor (int i = 0; i\
  \ < values.length; i++) {\n    Object value = new Integer(i);\n    values[i] = Proxy.newProxyInstance(\n\
  \        null,\n        value.getClass().getInterfaces(),\n        // 用于调用处理器的 Lambda\
  \ 表达式\n        (Object proxy, Method m, Object[] margs) -> {\n            System.out.println(value\
  \ + \".\" + m.getName() + Arrays.toString(margs));\n            return m.invoke(value,\
  \ margs);\n        }\n    );\n}\n```\n\n调用点击此处查看代码图像 时：\n\n```java\nArrays.binarySearch(values,\
  \ new Integer(500));\n```\n\n产生以下输出：\n```\n499.compareTo\n749.compareTo\n624.compareTo\n\
  561.compareTo\n530.compareTo\n514.compareTo\n506.compareTo\n502.compareTo\n500.compareTo\n\
  ```\n\n你可以看到二分搜索算法通过每一步将搜索范围减半来定位键。关键在于，尽管代码中没有明确提到，但 `compareTo` 方法实际上通过代理被调用了。`Integer`\
  \ 实现的所有接口中的所有方法都被代理了。\n\n![Image](img/00007.jpeg) **注意**：当调用处理程序被一个无参数的方法调用时，参数数组是\
  \ `null`，而不是长度为 0 的 `Object[]` 数组。这样做是完全不可理喻的，你不应该在代码中这样做。\n\n### 练习题\n\n1. 定义一个类\
  \ `Point`，包含一个构造函数 `Point(double x, double y)` 和访问器方法 `getX`, `getY`。定义一个子类 `LabeledPoint`，包含构造函数\
  \ `LabeledPoint(String label, double x, double y)` 和访问器方法 `getLabel`。\n2. 为上述练习中的类定义\
  \ `toString`、`equals` 和 `hashCode` 方法。\n3. 将第 1 题中 `Point` 类的实例变量 `x` 和 `y` 改为 `protected`。证明\
  \ `LabeledPoint` 类只能在 `LabeledPoint` 实例中访问这些变量。\n4. 定义一个抽象类 `Shape`，包含一个 `Point`\
  \ 实例变量、一个构造函数、一个移动指定量的具体方法 `moveBy(double dx, double dy)` 以及一个抽象方法 `getCenter()`。提供具体子类\
  \ `Circle(Point center, double radius)`、`Rectangle(Point topLeft, double width,\
  \ double height)` 和 `Line(Point from, Point to)`。\n5. 为上述练习中的类定义 `clone` 方法。\n6.\
  \ 假设在第 4.2.节，“equals 方法](#part0013.html_ch04lev2sec14)”第 148 页`Item.equals` 方法使用了\
  \ `instanceof` 测试。实现 `DiscountedItem.equals`，使得当 `otherObject` 是 `Item` 时只比较父类，如果它是\
  \ `DiscountedItem` 则包含折扣信息。证明该方法保持了对称性但无法满足*传递性*——即找到一组项目和折扣项目，使得 `x.equals(y)`\
  \ 和 `y.equals(z)` 成立，但 `x.equals(z)` 不成立。\n7. 为八种颜色组合定义一个枚举类型 `BLACK`、`RED`、`BLUE`、`GREEN`、`CYAN`、`MAGENTA`、`YELLOW`、`WHITE`，并带有\
  \ `getRed`、`getGreen` 和 `getBlue` 方法。\n8. `Class` 类有六个方法可以产生所代表类型的字符串表示。它们在应用于数组、泛型、内部类和基本类型有何不同？\n\
  9. 编写一个“通用” `toString` 方法，利用反射生成对象所有实例变量的字符串。如果能处理循环引用将加分。\n10. 使用第 4.5.1 节，“枚举类成员](#part0013.html_ch04lev2sec27)”第\
  \ 168 页中的 `MethodPrinter` 程序列出 `int[]` 类的所有方法。如果能识别出本章描述错误的那个方法将加分。\n11. 编写“Hello,\
  \ World”程序，使用反射查找 `java.lang.System` 的 `out` 字段并使用 `invoke` 调用 `println` 方法。\n12.\
  \ 测量普通方法调用与通过反射调用方法的性能差异。\n13. 编写一个方法，为任何表示 `double` 或 `Double` 类型静态方法的 `Method`\
  \ 打印数值表。除了 `Method` 对象外，还接受下界、上限和步长。通过打印 `Math.sqrt` 和 `Double.toHexString` 的表格演示你的方法。重复一遍，使用\
  \ `DoubleFunction<Object>` 代替 `Method`（参见第 3.6.2 节，“选择函数式接口](#part0011.html_ch03lev2sec21)”第\
  \ 120 页）。对比两种方法在安全性、效率和便利性方面的差异。\n\n\n\n\n\n# 第 5 章 异常、断言与日志\n\n* *\n\n## 本章主题\n\
  \n![Image](img/00322.jpeg) 5.1 异常处理\n![Image](img/00323.jpeg) 5.2 断言\n![Image](img/00324.jpeg)\
  \ 5.3 日志\n![Image](img/00325.jpeg) 5.4 练习题\n\n* *\n\n在许多程序中，处理意外情况可能比实现“理想场景”更为复杂。与大多数编程语言一样，Java\
  \ 拥有一套健壮的异常处理机制，可以将控制权从故障点转移到适当的处理器。此外，`assert` 语句提供了一种结构化且高效的方式来表达内部假设。最后，你将看到如何使用日志\
  \ API 来记录程序执行过程中的各种事件，无论是常规的还是可的。\n\n本章的要点是：\n\n1. 当你抛出异常时，控制权将转移到最近的处理器。\n2. 在\
  \ Java 中，受检异常（checked exceptions）由编译器跟踪。\n3. 使用 `try`/`catch` 结构来处理异常。\n4. `try-with-resources`\
  \ 语句在正常执行后或发生异常时会自动关闭资源。\n5. 使用 `try`/`finally` 结构来处理无论执行是否正常都必须执行的操作。\n6. 你可以捕获并重新抛出异常，或将其链到另一个异常。\n\
  7. 堆栈跟踪（stack trace）描述了执行点处所有等待处理的方法调用。\n8. 断言会检查条件（前提是该类已启用断言检查），如果条件不满足则抛出错误。\n\
  9. 日志器按层次结构排列，它们可以接收从 `SEVERE` 到 `FINEST` 不等级别的日志消息。\n10. 日志处理器（log handlers）可以将日志消息发送到不同的目标，而格式化器（formatters）控制消息的格式。\n\
  11. 你可以使用日志配置文件来控制日志属性。\n\n## 5.1 异常处理\n\n当方法遇到无法履行其契约的情况时，它应该做什么？传统的答案是方法应该返回某些错误代码。但对于调用该方法的程序员来说，这是繁琐的。调用者被迫检查错误，如果无法处理，则必须将错误代码返回给自己的调用者。意不意外的是，程序员并不总是检查和传递返回代码，导致错误未被检测到，从而在之后造成混乱。\n\
  \n\n\n\n\n不再让错误代码在方法调用链中层层向上传递，Java 支持*异常处理*（exception handling），即方法可以通过“抛出”（throwing）异常来信号严重问题。调用链中的某一个方法（但不一定是直接调用者）负责通过“捕获”（catching）该异常来处理它。异常处理的根本优势是将检测错误与处理错误的过程解耦。在接下来的章节中，你将看到如何在\
  \ Java 中处理异常。\n\n### 5.1.1 抛出异常\n\n方法可能会发现自己处于无法完成当前任务的局面。可能是缺少所需的资源，或者提供的参数不一致。在这种情况下，最好的做法是抛出一个异常。\n\
  \n假设你实现了一个产生两个边界值之间随机整数的方法：\n\n点击此处查看代码图像\n\n```java\npublic static int randInt(int\
  \ low, int high) {\n    return low + (int) (Math.random() * (high - low + 1));\n\
  }\n```\n\n如果有人调用 `randInt(10, 5)` 会发生什么？尝试修复这个问题可能不是好主意，因为调用者可能在多个方面产生了困惑。相反，应该抛出一个合适的异常：\n\
  \n点击此处查看代码图像\n\n```java\nif (low > high)\n    throw new IllegalArgumentException(\n\
  \        String.format(\"low should be <= high but low is %d and high is %d\",\n\
  \            low, high));\n```\n\n如你所示，`throw` 语句用于“抛出”一个类的对象——在这里是 `IllegalArgumentException`。该对象是用一个调试消息构造的。你将在下一节中看到如何选择合适的异常类。\n\
  \n当 `throw` 语句执行时，正常的执行流会被立即中断。`randInt` 方法停止执行且不向调用者返回值。相反，控制权将转移给处理器，正如你在第 5.1.4\
  \ 节“捕获异常”（第 186 页）中所所示。\n\n### 5.1.2 异常层次结构\n\n图 5-1 显示了 Java 异常的层次结构。所有异常都是 `Throwable`类的子类。`Error`\
  \ 的子类是在发生程序无法预期处理的异常情况时抛出的异常，例如内存耗尽。对于错误，除了向用户发送消息说出了非常严重的问题之外，你做不了什么。\n\n![图像](img/00418.jpeg)\n\
  \n**图 5-1** 异常层次结构\n\n程序员报告的异常是 `Exception` 类的子类。这些异常分为两类：\n\n- *未检查的*（Unchecked）异常是\
  \ `RuntimeException` 的子类。\n- 所有其他异常都是*受检查的*（checked）异常。\n\n正如你将在下一节中看到的，程序员要么捕获受检查异常，要么在方法头中声明它们。编译器会检查这些异常是否被妥善处理。\n\
  \n* *\n\n![图像](img/00003.jpeg) 注意\n\n`RuntimeException` 这个名字并不理想。当然，所有异常都发生在运行时。然而，`RuntimeException`\
  \ 的子类异常在编译期间是不被检查的。\n\n* *\n\n受检查异常用于应该预见到失败的情况。失败的一个常见原因是输入和输出。文件可能会损坏，网络连接可能会失败。许多异常类继承自\
  \ `IOException`，你应该使用合适的类来报告你遇到的任何错误。例如，当一个本该存在的文件发现并不存在时，抛出一个 `FileNotFoundException`。\n\
  \n未检查的异常表示由程序员引起的逻辑错误，而不是由不可避免的外部风险引起的。例如，`NullPointerException` 是不检查的。几乎任何方法都可能抛出这种异常，程序员不应该花时间在捕获它们上。相反，他们应该确保从根本上不对对\
  \ `null` 进行解引用。\n\n有时，实现者需要根据判断来区分受检查异常和未检查异常。考虑调用 `Integer.parseInt(str)`。当 `str`\
  \ 不包含有效的整数时，由于它会抛出一个未检查的 `NumberFormatException`。另一方面，当 `str` 不包含有效的类名时，`Class.forName(str)`\
  \ 会抛出一个受检查的 `ClassNotFoundException`。\n\n由于为什么会有这种区别？原因在于在调用 `Integer.parseInt`\
  \ 之前可以检查字符串是否为有效整数，但在实际尝试加载类之前，无法知道某个类是否可以加载。\n\nJava API 提供了许多异常类，例如 `IOException`、`IllegalArgumentException`\
  \ 等。你应该在适当的情况下使用这些类。然而，如果没有一个标准异常类适用于你的需求，你可以通过扩展 `Exception`、`RuntimeException`\
  \ 或另一个现有的异常类来创建自己的异常。\n\n当你这样做时，提供一个无参数构造函数和一个带消息字符串的构造函数是一个好主意。例如，\n\n点击此处查看代码图像\n\
  \n```java\npublic class FileFormatException extends IOException {\n    public FileFormatException()\
  \ {}\n    public FileFormatException(String message) {\n        super(message);\n\
  \    }\n}\n```\n\n### 5.1.3 声明受检查异常\n\n任何可能引起受检查异常的方法必须在方法头中使用 `throws` 子句声明它：\n\
  \n点击此处查看代码图像\n\n```java\npublic void write(Object obj, String filename) throws IOException,\
  \ ReflectiveException\n```\n\n列出方法可能抛出的异常，可能是由于 `throw` 语句，也可能是调用了带有 `throws` 子句的方法。在\
  \ `throws` 子句中，可以将异常合并到一个公共父类。这是否是一个好主意取决于异常。例如，如果一个方法可以抛出多个 `IOException` 的子类，将它们涵盖在\
  \ `throws IOException` 中是合理的。但如果异常彼此无关，不要将它们合并为 `throws Exception`——这将违背异常检查的。\n\
  \n* *\n\n![图像](img/00009.jpeg) 提示\n\n有些程序员认为承认可能会抛出异常是羞耻的。与其处理它不是更好吗？实际上恰恰相反。你应该让每个异常找到胜任的处理器。异常的黄金法是：“早抛出，晚捕获”。\n\
  \n* *\n\n当你重写方法时，它抛出的受检查异常不能多于父类方法声明的。例如，如果你扩展本节开头的 `write` 方法，重写方法可以抛出更少的异常：\n\n\
  点击此处查看代码图像\n\n```java\npublic void write(Object obj, String filename) throws FileNotFoundException\n\
  ```\n\n但如果该方法尝试抛出一个无关受检查异常（例如 `InterruptedException`），它将无法通过编译。\n\n* *\n\n![图像](img/00007.jpeg)\
  \ 注意\n\n如果父类方法没有 `throws` 子句，那么任何重写方法都不能抛出受检查异常。\n\n* *\n\n你可以使用 javadoc 的 `@throws`\
  \ 标签来记录方法何时抛出（受检查或未检查）异常。大多数程序员只在有意义的内容需要记录时这样做。例如，告诉用户当输入/输出出现问题时抛出 `IOException`\
  \ 价值不大。但像下面的注释是有意义的：\n\n点击此处查看代码图像\n\n```\n@throws NullPointerException if filename\
  \ is null\n@throws FileNotFoundException if there is no file with name filename\n\
  ```\n\n\n\n\n你永远不需要指定 lambda 表达式异常类型。然而，如果 lambda 表达式可以抛出检查异常（checked exception），你只能将其传递给方法声明了该异常的函数式接口。例如，以下调用\n\
  \n点击此处查看代码图像\n\n```java\nlist.forEach(obj -> write(obj, \"output.dat\"));\n```\n\
  \n是一个错误。`forEach` 方法的参数是函数式接口\n\n点击此处查看代码图像\n\n```java\npublic interface Consumer<T>\
  \ {\n    void accept(T t);\n}\n```\n\n`accept` 方法声明为不抛出任何检查异常。\n\n### 5.1.4 异常异常\n\
  \n要捕获异常，请设置一个 `try` 块。它最简单的形式看起来如下：\n\n```java\ntry {\n    statements\n} catch (ExceptionClass\
  \ ex) {\n    handler\n}\n```\n\n在执行 `try` 块中的语句时，如果发生了给定类的异常，控制将转移到处理程序（handler）。异常变量（我们示例中的\
  \ `ex`）引用异常对象，如果需要，处理程序可以检查该对象。\n\n你可以对这种基础结构进行两种修改。你可以为不同的异常类设置多个处理程序：\n\n点击此处查看代码图像\n\
  \n```java\ntry {\n    statements\n} catch (ExceptionClass[1] ex) {\n    handler[1]\n\
  } catch (ExceptionClass[2] ex) {\n    handler[2]\n} catch (ExceptionClass[3] ex)\
  \ {\n    handler[3]\n}\n```\n\n`catch` 子句从上到下匹配，因此最具体的异常类必须先出现。\n\n或者，你可以在多个异常类之间共享一个处理程序：\n\
  \n点击此处查看代码图像\n\n```java\ntry {\n    statements\n} catch (ExceptionClass[1] | ExceptionClass[2]\
  \ | ExceptionClass[3] ex) {\n    handler\n}\n```\n\n在这种情况下，处理程序只能调用异常变量上属于所有这些异常类的方法。\n\
  \n### 5.1.5 Try-with-resources 语句\n\n异常处理的一个问题是资源管理。假设你向文件写入内容并在完成后将其关闭：\n\n点击此处查看代码图像\n\
  \n```java\nArrayList<String> lines = ...;\nPrintWriter out = new PrintWriter(\"\
  output.txt\");\nfor (String line : lines) {\n    out.println(line.toLowerCase());\n\
  }\nout.close();\n```\n\n这代码代码隐藏着一个危险。如果任何方法抛出异常，`out.close()` 的调用永远不会发生。这是糟糕的。输出可能会丢失，或者如果触发多次异常，系统可能会耗尽文件句柄。\n\
  \n`try` 语句的一种特殊形式可以解决这个问题。你可以在 `try` 语句的头部指定*资源*（resources）。资源必须属于实现 `AutoCloseable`\
  \ 接口的类。你可以在 `try` 块的头部声明变量：\n\n点击此处查看代码图像\n\n```java\nArrayList<String> lines =\
  \ ...;\ntry (PrintWriter out = new PrintWriter(\"output.txt\")) { // 声明\n    for\
  \ (String line : lines)\n        out.println(line.toLowerCase());\n}\n```\n\n或者，你可以在头部提供之前声明的有效最终的（effectively\
  \ final）变量：\n\n点击此处查看代码图像\n\n```java\nPrintWriter out = new PrintWriter(\"output.txt\"\
  );\ntry (out) { // 有效最终变量\n    for (String line : lines)\n        out.println(line.toLowerCase());\n\
  }\n```\n\n`AutoCloseable` 接口有一个方法\n\n点击此处查看代码图像\n\n```java\npublic void close()\
  \ throws Exception\n```\n\n![Image](img/00003.jpeg) 注意\n\n还有一个 `Closeable` 接口。它是\
  \ `AutoCloseable` 的子接口，同样带一个 `close` 方法。然而，该方法被声明为抛出 `IOException`。\n\n当 `try` 块退出时（无论是因为正常结束还是因为抛出了异常），资源对象的\
  \ `close` 方法都会被调用。例如：\n\n点击此处查看代码图像\n\n```java\ntry (PrintWriter out = new PrintWriter(\"\
  output.txt\")) {\n    for (String line : lines) {\n        out.println(line.toLowerCase());\n\
  \    }\n}\n```\n\n你可以声明多个资源，用分号分隔。这里有一个示例：\n\n点击此处查看代码图像\n\n```java\ntry (PrintWriter\
  \ out = new PrintWriter(\"output.txt\");\n     Scanner in = new Scanner(Paths.get(\"\
  /usr/words\"))) {\n    while (in.hasNext())\n        out.println(in.next());\n}\n\
  ```\n\n资源按初始化的反顺序关闭。假设 `in` 已经初始化但 `out` 没有。`try` 语句会正确处理：`close()` 被调用。如果其中一个抛出异常，它会被附加到原始异常上。你在前一节中看到的抑制机制仅适用于\
  \ `try-with-resources`。当你捕获主异常时，可以通过 `getSuppressed()` 获取次级异常：\n\n点击此处查看代码图像\n\n\
  ```java\ntry {\n    ...\n} catch (IOException ex) {\n    Throwable[] secondaryExceptions\
  \ = ex.getSuppressed();\n    ...\n}\n```\n\n如果你在无法使用 `try-with-resources` 的（罕见）情况下实现这种机制，请调用\
  \ `ex.addSuppressed(secondaryException)`。\n\n### 5.1.6 finally 子句\n\n正如你所见，无论是否发生异常，try-resources\
  \ 会会自动关闭资源。有时你需要清理不是 `AutoCloseable` 的内容。在这种情况下，使用 `finally` 子句：\n\n```java\ntry\
  \ {\n    执行工作\n} finally {\n    清理工作\n}\n```\n\n`finally` 子句在 `try` 块结束时执行，无论是正常结束还是由于异常。这种模式出现在任何需要获取并释放锁、递增和递减计数器、或者在栈中推送并在完成后弹出的情况下。你需要确保无论发生什么异常这些操作都会执行。\n\
  \n你应该避免在 `finally` 子句中抛出异常。如果 `try` 块体由于异常终止，该异常会被 `finally` 子句中的异常所掩盖。你在前一节中看到的抑制机制仅适用于\
  \ `try-with-resources`。\n\n同样，`finally` 子句不包含 `return` 语句。如果 `try` 块体也有 `return`\
  \ 语句，`finally` 子句中的那个将替换返回值。\n\n可以形成带有 `catch` 子句后跟 `finally` 子句的 `try` 语句。但你必须小心\
  \ `finally` 子句中的异常。例如，请看这个从在线教程改编的 `try` 块：\n\n点击此处查看代码图像\n\n```java\nBufferedReader\
  \ in = null;\ntry {\n    in = Files.newBufferedReader(path, StandardCharsets.UTF_8);\n\
  \    从 `in` 读取\n} catch (IOException ex) {\n    System.err.println(\"Caught IOException:\
  \ \" + ex.getMessage());\n} finally {\n    if (in != null) {\n        in.close();\
  \ // 注意—可能会抛出异常\n    }\n}\n```\n\n\n\n程序员显然考虑了 `Files.newBufferedReader` 方法抛出异常的情况。这部分代码似乎会捕获并打印所有的\
  \ I/O 异常，但它实际上漏掉了一个：由 `in.close()` 可能抛出的异常。通常情况下，将复杂的 `try`/`catch`/`finally` 语句重写为\
  \ try-with-resources 语句，或者在 `try`/`catch` 语句内部嵌套一个 `try`/`finally` ——参见练习 6。\n\n\
  ### 5.1.7 重新抛出和链式异常\n\n当发生异常时，你可能不知道该如何处理，但你可能想记录这次失败。在这种情况下，重新抛出异常，以便让胜任的处理器处理它：\n\
  \n点击此处查看代码图像\n\n```java\ntry {\n    Do work\n} catch (Exception ex) {\n    logger.log(level,\
  \ message, ex);\n    throw ex;\n}\n```\n\n* * *\n\n![Image](img/00003.jpeg) 注意\n\
  \n当这段代码位于一个可能会抛出受检异常的方法内部时，会发生一些微妙的情况。假设封装方法声明为：\n\n点击此处查看代码图像\n\n```java\npublic\
  \ void read(String filename) throws IOException\n```\n\n乍一看，似乎需要将 `throws` 子句更改为\
  \ `throws Exception`。然而，Java 编译器仔细地跟踪了执行流，并意识到 `ex` 只能是由 `try` 块中某条语句抛出的异常，而不是任意的\
  \ `Exception`。\n\n* * *\n\n有时，你想更改抛出异常的类。例如，你可能需要用一个对子系统用户有意义的异常类来报告子系统的失败。假设你在\
  \ servlet 中遇到了数据库错误。执行该 servlet 的代码可能不想详细知道发生了什么，但它绝对想知道是 servlet 出了错。在这种情况下，捕获原始异常并将其链到更高层次的异常上：\n\
  \n点击此处查看代码图像\n\n```java\ntry {\n    Access the database\n} catch (SQLException ex)\
  \ {\n    throw new ServletException(\"database error\", ex);\n}\n```\n\n当捕获到 `ServletException`\
  \ 时，可以如下方式检索原始异常：\n\n点击此处查看代码图像\n\n```java\nThrowable cause = ex.getCause();\n```\n\
  \n`ServletException` 类有一个构造函数，它将异常的原因作为参数。并不是所有的异常类都这样做。在这种情况下，你必须调用 `initCause`\
  \ 方法，如下：\n\n点击此处查看代码图像\n\n```java\ntry {\n    Access the database\n} catch (SQLexception\
  \ ex) {\n    Throwable ex2 = new CruftyOldException(\"database error\");\n    ex2.initCause(ex);\n\
  \    throw ex2;\n}\n```\n\n如果你提供了自己的异常类，除了第 5.1.2 节描述的两个构造函数外，你还应该提供异常层级（第 183 页）中的构造函数：\n\
  \n点击此处查看代码图像\n\n```java\npublic class FileFormatException extends IOException {\n\
  \    ...\n    public FileFormatException(Throwable cause) { initCause(cause); }\n\
  \    public FileFormatException(String message, Throwable cause) {\n        super(message);\n\
  \        initCause(cause);\n    }\n}\n```\n\n* * *\n\n![Image](img/00009.jpeg) 提示\n\
  \n如果在不允许抛出受检异常的方法中发生了受检异常，链式技术也很有用。你可以捕获受检异常并将其链到一个未检异常中。\n\n* * *\n\n### 5.1.8\
  \ 未捕获异常和堆栈跟踪\n\n如果异常在任何地方都没有被捕获，就会显示一个*堆栈跟踪*（stack trace）——异常抛出处所有待处理方法调用的列表。堆栈跟踪会被发送到错误消息流流\
  \ `System.err`。\n\n如果你想将异常保存到其他地方，也许是为了让你的技术支持人员检查，请设置默认未捕获异常处理器：\n\n点击此处查看代码图像\n\
  \n```java\nThread.setDefaultUncaughtExceptionHandler((thread, ex) -> {\n    Record\
  \ the exception\n});\n```\n\n* * *\n\n![Image](img/00003.jpeg) 注意\n未捕获的异常会终止发生异常的线程。\n\
  \n* * *\n\n有时，你被迫捕获一个异常但不知道该如何处理。与其忽略该异常，至少打印堆栈跟踪：\n\n点击此处查看代码图像\n\n```java\ntry\
  \ {\n    ...\n} catch (ClassNotFoundException ex) {\n    ex.printStackTrace();\n\
  }\n```\n\n如果你想将异常保存到某处，以便让你的技术支持人员检查，请设置未捕获异常处理器：\n\n点击此处查看代码图像\n\n```java\nThread.setDefaultUncaughtExceptionHandler((thread,\
  \ ex) -> {\n    Record the exception\n});\n```\n\n* * *\n\n![Image](img/00003.jpeg)\
  \ 注意\n未捕获的异常会终止发生异常的线程。\n\n* * *\n\n如果你需要详细处理堆栈跟踪，请使用 `StackWalker`。例如，以下代码打印所有帧：\n\
  \n点击此处查看代码图像\n\n```java\nStackWalker walker = StackWalker.getInstance();\nwalker.forEach(frame\
  \ -> System.err.println(\"Frame: \" + frame));\n```\n\n### 5.1.9 `Objects.requireNonNull`\
  \ 方法\n\n`Objects` 类有一个方便检查参数的方法。这里有一个示例：\n\n点击此处查看代码图像\n\n```java\npublic void process(String\
  \ direction) {\n    this.direction = Objects.requireNonNull(direction);\n}\n```\n\
  \n如果 `direction` 为 `null`，则会抛出 `NullPointerException` —— 这看起来并不是多巨大的改进。但考虑回溯堆栈跟踪。当你看到\
  \ `requireNonNull` 调用是罪祸首时，你立刻知道做了什么。\n\n你还可以为异常提供消息：\n\n点击此处查看代码图像\n\n```java\n\
  this.direction = Objects.requireNonNull(direction, \"direction must not be null\"\
  );\n```\n\n该方法的变体允许你提供替代值而不是抛出异常：\n\n点击此处查看代码图像\n\n```java\nthis.direction = Objects.requireNonNullElse(direction,\
  \ \"North\");\n```\n\n如果默认值的计算代价很高，请使用另一个变体：\n\n点击此处查看代码图像\n\n```java\nthis.direction\
  \ = Objects.requireNonNullElseGet(direction, () -> System.getProperty(\"com.horstmann.direction.default\"\
  ));\n```\n\nLambda 表达式在 `direction` 为 `null` 时才会被求值。\n\n## 5.2 断言\n\n断言是防御性编程中常用的用式。假设你确信某个属性已满足，并且你在代码中依赖于该属性。例如，你可能正在计算\n\
  \n```java\ndouble y = Math.sqrt(x);\n```\n\n你确定 `x` 不是负数。尽管如此，你仍然想进行双检查，而不是让“非数字”浮点值侵入你的计算中。你当然可以抛出一个异常：\n\
  \n```java\nif (x < 0) throw new IllegalStateException(x + \" < 0\");\n```\n\n但即使在测试完成后，这个条件仍然留在程序中，降低了运行速度。断言机制允许你在测试期间放置检查，并在生产代码中自动移除它们。\n\
  \n\n\n\n在 Java 中，断言（assertions）旨在作为验证内部假设的调试辅助，而不是强制契约的机制。例如，如果你想报告公共方法的参数不当，请不要使用断言，而应该抛出\
  \ `IllegalArgumentException`。\n\n### 5.2.1 使用断言\n\nJava 中的断言语句有两种形式：\n\n```java\n\
  assert condition;\n```\n\n```java\nassert condition : expression;\n```\n\n`assert`\
  \ 语句评估 `condition`，如果为假，则抛出 `AssertionError`。在第二种形式中，`expression` 会被转换为字符串，并作为错误对象的消息。\n\
  \n![Image](img/00003.jpeg) 备注\n\n如果 `expression` 是一个 `Throwable`，它也会被设置为断言错误的原因（参见第\
  \ 5.1.7 节，“重新抛出和链式异常](#part0015.html_ch05lev2sec7)”，第 190 页）。\n\n例如，要断言 `x` 为非负，你可以简单地使用语句\n\
  \n```java\nassert x >= 0;\n```\n\n或者你可以将 `x` 的实际值传递给 `AssertionError` 对象以便稍后显示：\n\
  \n```java\nassert x >= 0 : x;\n```\n\n### 5.2.2 启用和禁用断言\n\n默认情况下，断言是禁用的。通过在运行程序时使用\
  \ `-enableassertions` 或 `-ea` 选项来启用它们：\n\n```bash\njava -ea MainClass\n```\n\n你不需要重新编译程序，因为启用或禁用断言是由类加载器处理的。当断言被禁用时，类加载器会剥离断言代码，以免影响执行速度。你甚至可以在特定的类或整个包中启用断言，例如：\n\
  \n点击此处查看代码图片\n\n```bash\njava -ea:MyClass -ea:com.mycompany.mylib... MainClass\n\
  ```\n\n此命令为类 `MyClass` 以及 `com.mycompany.mylib` 包及其子包中的所有类开启断言。`-ea...` 选项开启默认包中所有类的断言。\n\
  \n你也可以使用 `-disableassertions` 或 `-da` 选项禁用某些类和包的断言：\n\n点击此处查看代码图片\n\n```bash\njava\
  \ -ea:... -da:MyClass MainClass\n```\n\n当你使用 `-ea` 和 `-da` 切换启用或禁用所有断言（而不仅仅是特定类或包）时，它们不适用于通过类加载器加载的“系统类”。使用\
  \ `-enablesystemassertions`/`-esa` 切换来启用系统类中的断言。\n\n还可以通过以下方法通过控制类加载器的断言状态：\n\n\
  点击此处查看代码图片\n\n```java\nvoid ClassLoader.setDefaultAssertionStatus(boolean enabled);\n\
  void ClassLoader.setClassAssertionStatus(String className, boolean enabled);\nvoid\
  \ ClassLoader.setPackageAssertionStatus(String packageName, boolean enabled);\n\
  ```\n\n与 `-enableassertions` 命令行选项一样，`setPackageAssertionStatus` 方法会设置给定包及其子包的断言状态。\n\
  \n## 5.3 日志\n\n每个 Java 程序员都熟悉在麻烦代码中插入 `System.out.println` 调用过程，以了解程序的行为。当然，一旦你找到了问题的根源，就会移除打印语句——结果在下一个问题出现时又把它们放回去。日志\
  \ API 的设计是为了解决这个问题。\n\n### 5.3.1 使用日志器\n\n让我们从简单的案例开始。日志系统管理一个默认日志器，你通过调用 `Logger.getGlobal()`\
  \ 获取该日志器。使用 `info` 方法记录一条信息消息：\n\n点击此处查看代码图片\n\n```java\nLogger.getGlobal().info(\"\
  Opening file \" + filename);\n```\n\n记录的打印如下：\n\n点击此处查看代码图片\n\n```\nAug 04, 2014\
  \ 09:53:34 AM com.mycompany.MyClass read INFO: Opening file data.txt\n```\n\n注意，时间以及调用类和方法的名称会自动包含在内。\n\
  \n然而，如果你调用了：\n\n点击此处查看代码图片\n\n```java\nLogger.getGlobal().setLevel(Level.OFF);\n\
  ```\n\n那么对 `info` 的调用将不起作用。\n\n![Image](img/00003.jpeg) 备注\n\n在上面的示例中，即使禁用了日志，消息\
  \ `\"Opening file \" + filename` 也会被创建。如果你担心创建消息的开销，可以使用 lambda 表达式：\n\n点击此处查看代码图片\n\
  \n```java\nLogger.getGlobal().info(() -> \"Opening file \" + filename);\n```\n\n\
  ### 5.3.2 日志器\n\n在专业应用程序中，你并不希望将所有记录记录到全局日志器中。相反，你可以定义自己的日志器。\n\n当你请求一个带有名称的日志器时，它会被创建。\n\
  \n点击此处查看代码图片\n\n```java\nLogger logger = Logger.getLogger(\"com.myapp\");\n```\n\
  \n`logger` 用于记录消息。在专业应用程序中，你并不希望将所有记录记录到全局日志器中。相反，你可以定义自己的日志器。\n\n### 5.3.3 日志级别\n\
  \n共有七种日志级别：`SEVERE`、`WARNING`、`INFO`、`CONFIG`、`FINE`、`FINER`、`FINEST`。默认情况下记录前三个级别。你可以设置不同的阈值，例如：\n\
  \n```java\nlogger.setLevel(Level.FINE);\n```\n\n现在 `FINE` 及其以上的所有级别都会被记录。你也可以使用\
  \ `Level.ALL` 开启所有级别的日志，或使用 `Level.OFF` 关闭所有日志。\n\n每个级别都有对应的日志方法，例如\n\n```java\n\
  logger.warning(message);\nlogger.fine(message);\n```\n\n等等。如果级别是变量，可以使用 `log` 方法：\n\
  \n```java\nLevel level = ...;\nlogger.log(level, message);\n```\n\n![Image](img/00009.jpeg)\
  \ 提示\n\n默认日志配置记录所有级别为 `INFO` 或更高的记录。因此，你应该将 `CONFIG`、`FINE`、`FINER` 和 `FINEST` 级别用于记录对诊断有用但对用户无意义的调试消息。\n\
  \n### 5.3.4 其他日志方法\n\n这里提供了用于跟踪执行流的便捷方法：\n\n\n\n\n\n点击此处查看代码图像\n\n```java\nvoid\
  \ entering(String className, String methodName)\n\nvoid entering(String className,\
  \ String methodName, Object param)\n\nvoid entering(String className, String methodName,\
  \ Object[] params)\n\nvoid exiting(String className, String methodName)\n\nvoid\
  \ exiting(String className, String methodName, Object result)\n```\n\n例如：\n\n点击此处查看代码图像\n\
  \n```java\npublic int read(String file, String pattern) {\n    logger.entering(\"\
  com.mycompany.mylib.Reader\", \"read\",\n        new Object[] { file, pattern });\n\
  \    ...\n    logger.exiting(\"com.mycompany.mylib.Reader\", \"read\", count);\n\
  \    return count;\n}\n```\n\n这些调用会生成级别为 `FINER` 的日志记录，这些记录以字符串 `ENTRY` 和 `RETURN`\
  \ 开头。\n\n***\n\n![Image](img/00003.jpeg) 注意\n\n奇怪的是，这些方法从未被转换为具有可变参数的方法。\n\n***\n\
  \n日志的一个常见用途是记录意外的异常。两个方便方法可以在日志记录中包含异常的描述。\n\n点击此处查看代码图像\n\n```java\nvoid log(Level\
  \ l, String message, Throwable t)\n\nvoid throwing(String className, String methodName,\
  \ Throwable t)\n```\n\n典型用法如下：\n\n点击此处查看代码图像\n\n```java\ntry {\n    ...\n}\ncatch\
  \ (IOException ex) {\n    logger.log(Level.SEVERE, \"Cannot read configuration\"\
  , ex);\n}\n```\n\n以及：\n\n点击此处查看代码图像\n\n```java\nif (...) {\n    IOException ex =\
  \ new IOException(\"Cannot read configuration\");\n    logger.throwing(\"com.mycompany.mylib.Reader\"\
  , \"read\", ex);\n    throw ex;\n}\n```\n\n`throwing` 调用会记录一条级别为 `FINER` 的记录，其消息以\
  \ `THROW` 开头。\n\n***\n\n![Image](img/00003.jpeg) 注意\n\n默认日志记录显示包含日志调用的类名和方法名，这是从调用栈中推出来的。然而，如果虚拟机优化了执行，可能无法获得准确的调用信息。你可以使用\
  \ `logp` 方法来提供调用类和方法的精确位置。该方法的签名如下：\n\n点击此处查看代码图像\n\n```java\nvoid logp(Level l,\
  \ String className, String methodName, String message)\n```\n\n***\n\n***\n\n![Image](img/00003.jpeg)\
  \ 注意\n\n如果你希望来自多种语言的用户能够理解日志消息，可以使用以下方法对它们进行本地化：\n\n点击此处查看代码图像\n\n```java\nvoid\
  \ logrb(Level level, ResourceBundle bundle,\n    String msg, Object... params)\n\
  \nvoid logrb(Level level, ResourceBundle bundle,\n    String msg, Throwable thrown)\n\
  ```\n\n资源束在第 13 章 中进行了描述。\n\n***\n\n### 5.3.5 日志配置\n\n你可以通过编辑配置文件来更改日志系统的各种属性。默认配置文件位于\
  \ `jre/lib/logging.properties`。要使用另一个文件，请在启动应用程序时通过 `java.util.logging.config.file`\
  \ 属性设置文件位置：\n\n点击此处查看代码图像\n\n```bash\njava -Djava.util.logging.config.file=configFile\
  \ MainClass\n```\n\n***\n\n![Image](img/00007.jpeg) 注意\n\n在 `main` 方法中调用 `System.setProperty(\"\
  java.util.logging.config.file\", configFile)` 是无效的，因为日志管理器是在虚拟机启动期间在 `main` 执行之前就已经初始化了。\n\
  \n***\n\n要更改默认日志级别，请编辑配置文件并修改该行：\n\n`.level=INFO`\n\n你可以通过添加如下行来指定自己的日志器的日志级别：\n\
  \n点击此处查看代码图像\n\n```text\ncom.mycompany.myapp.level=FINE\n```\n\n即：在日志器名称后附加 `.level`\
  \ 后缀。\n\n正如你在下一节中看到的，日志器实际上并没有将消息发送到控制台——那是处理器（handlers）的工作。处理器也有自己的级别。要在控制台上查看\
  \ `FINE` 消息，你还需要设置：\n\n点击此处查看代码代码图像\n\n```text\njava.util.logging.ConsoleHandler.level=FINE\n\
  ```\n\n***\n\n![Image](img/00007.jpeg) 注意\n\n\n\n\n\n| `java.util.logging.FileHandler.append`\
  \ | 当为 `true` 时，日志记录将附加到现有文件；否则，每次程序运行时都会打开一个新文件。 | `false` |\n| `java.util.logging.FileHandler.limit`\
  \ | 在打开另一个文件之前向文件中写入近似最大字节数（`0` =无限制）。 | `FileHandler` 类中为 `0`，默认日志管理器配置中为 `50000`\
  \ |\n| `java.util.logging.FileHandler.pattern` | 文件名模式（参见表 5-2） | `%h/java%u.log`\
  \ |\n| `java.util.logging.FileHandler.count` | 轮转序列中的日志数量 | `1`（不轮转） |\n| `java.util.logging.FileHandler.filter`\
  \ | 用于过滤日志记录的过滤器（参见第 5.3.7 节） | 无过滤 |\n| `java.util.logging.FileHandler.encoding`\
  \ | 字符编码 | 平台字符编码 |\n| `java.util.logging.FileHandler.formatter` | 每个日志记录的格式化器 |\
  \ java.util.logging.XMLFormatter |\n\n构造参数的含义请参见表 5-1。\n\n你可能不想使用默认的日志文件名。请使用诸如\
  \ `%h/myapp.log` 的模式（模式变量的解释请参见表 5-2）。\n\n### 表 5-2 日志文件模式变量\n\n| 变量 | 描述 |\n| :---\
  \ | :--- |\n| `%h` | 用户的家目录（`user.home` 属性） |\n| `%t` | 系统临时目录 |\n| `%u` | 唯一数字\
  \ |\n| `%g` | 轮转日志的生成代数（如果指定了轮转且模式不包含 `%g`，则使用 `.%g` 后缀） |\n| `%%` | 百分号字符 |\n\n\
  如果多个应用程序（或同一应用程序的多个副本）使用同一个日志文件，你应该开启 `append` 标记。或者，在文件名模式中使用 `%u`，以便每个应用程序都创建一个唯一的日志副本。\n\
  \n开启文件轮转也是一个好主意。日志文件以轮转序列的形式保存，例如 `myapp.log.0`、`myapp.log.1`、`myapp.log.2` 等。每当文件超过大小限制时，旧的日志会被删除，其他文件会被重命名，并创建一个生成代数为\
  \ `0` 的新文件。\n\n### 5.3.7 过滤器和格式化器\n\n除了按日志级别过滤外，每个记录（logger）和处理器（handler）都可以有一个实现\
  \ `Filter` 接口的额外过滤器，这是一个具有方法的函数式接口\n\n点击此处查看代码图片\n\n```\nboolean isLoggable(LogRecord\
  \ record)\n```\n\n要将过滤器安装到记录或处理器中，请调用 `setFilter` 方法。注意你一次最多有一个过滤器。\n\n`ConsoleHandler`\
  \ 和 `FileHandler` 类以文本和 XML 格式输出日志记录。然而，你也可以定义自己的格式。扩展 `Formatter` 类并重写方法\n\n点击此处查看代码图片\n\
  \n```\nString format(LogRecord record)\n```\n\n以你喜欢的任何方式格式化记录并返回生成的字符串。在你的 `format`\
  \ 方法中，你可能想要调用方法\n\n点击此处查看代码图片\n\n```\nString formatMessage(LogRecord record)\n```\n\
  \n该方法格式化记录的消息部分，替换参数并应用本地化。\n\n许多文件格式（如 XML）需要围绕格式化记录的头部和尾部。为了实现这一点，请重写方法\n\n```\n\
  String getHead(Handler h)\nString getTail(Handler h)\n```\n\n最后，调用 `setFormatter`\
  \ 方法将格式化器安装到处理器中。\n\n### 练习题\n\n1. 编写方法 `public ArrayList<Double> readValues(String\
  \ filename) throws ...`，读取一个包含浮点数的文件。如果无法打开文件或某些输入不是浮点数，则抛出相应的异常。\n2. 编写方法 `public\
  \ double sumOfValues(String filename) throws ...`，调用前一个方法并返回文件中值的和。将任何异常传递给调用者。\n\
  3. 编写一个程序，调用前一个方法并打印结果。捕获异常并向用户提供任何错误情况的反馈。\n4. 重复前面的练习，但不要使用异常。相反，让 `readValues`\
  \ 和 `sumOfValues` 返回某种错误代码。\n5. 实现一个方法，其中包含第 5.1.5 节，“try-with-resources 语句””（第\
  \ 187 页）中使用 `Scanner` 和 `PrintWriter` 的代码。但不要使用 try-with-resources 语句。相反，仅使用 `catch`。\n\
  6. 5.3.7 过滤器和格式化器 ... 对于此练习，你需要阅读 `java.util.Scanner` 的源代码。如果在使用 `Scanner` 时输入失败，它会捕获异常并关闭资源。如果关闭资源抛出异常会怎样？这种实现与\
  \ try-with-resources 语句中抑制异常的处理如何交互？\n7. 设计一个辅助方法以便可以在 try-with-resources 中 `ReentrantLock`。调用\
  \ `lock` 并返回一个 `close` 方法调用 `unlock` 且不抛出异常的 `AutoCloseable`。\n8. `Scanner` 和 `PrintWriter`\
  \ 类的方法不抛出检查异常以便新手使用。如何发现读取或写入过程中发生了错误？构造函数可以抛出检查异常为什么这违背了简化类使用的目标？\n9. 编写一个递归 `factorial`\
  \ 方法，在返回值之前打印所有栈帧。构造（但不抛出）任意类型的异常对象并按照第 5.1.8 节“未捕获异常和堆栈轨迹”（第 192 页）获取其堆栈轨迹。\n10.\
  \ 比较使用 `Objects.requireNonNull(obj)` 和 `assert obj != null`。为每种情况提供一个有力的用法。\n11.\
  \ 编写方法 `int min(int[] values)`，在返回最小值值之前，断言它确实小于等于数组中的所有值。使用私有辅助方法，或者如果你已经查看了第 8\
  \ 章，使用 `Stream.allMatch`。在大数组上反复调用该方法，并测量启用、禁用和移除断言时的运行时。\n12. 实现并测试日志记录过滤器，过滤掉包含性、毒品和\
  \ C++ 等坏词的日志记录。\n13. 实现并测试产生 HTML 文件的日志记录格式化器。\n\n\n\n\n\n# 第 6 章 泛型编程\n\n* *\n\n\
  ## 本章主题\n\n- 6.1 泛型类\n- 6.2 泛型方法\n- 6.3 类型边界\n- 6.4 类型变型与通配符\n- 6.5 Java 虚拟机中的泛型\n\
  - 6.6 泛型的限制\n- 6.7 反射与泛型\n- 练习题\n\n* * *\n\n你经常需要实现能够处理多种类型的类和方法。例如，`ArrayList<T>`\
  \ 存储任意类 `T` 的元素。我们说 `ArrayList` 类是*泛型的*，而 `T` 是一个*类型参数*。其基本思想非常简单且有用。本章的前两个节介绍了简单部分。\n\
  \n在任何带有泛型类型的编程语言中，当你限制或更改类型参数时，细节就会变得复杂。例如，假设你想对元素进行排序。那么你必须指定 `T` 提供排序。此外，如果类型参数发生变化，这对泛型意味着什么？例如，`ArrayList<String>`\
  \ 与一个期望 `ArrayList<Object>` 的方法之间是什么关系？第 6.3 节、`类型边界`，`类型变型与通配符`，`Java 虚拟机中的泛型`\n\
  \n```java\npublic class Entry<K, V> {\n    private K key;\n    private V value;\n\
  \n    public Entry(K key, V value) {\n        this.key = key;\n        this.value\
  \ = value;\n    }\n\n    public K getKey() { return key; }\n    public V getValue()\
  \ { return value; }\n}\n```\n\n你可以看到，类型参数 `K` 和 `V` 被指定在类名尖括号内。在类成员的定义中，它们被用作实例变量、方法参数和返回值的类型。\n\
  \n你通过用具体类型替换类型变量来*实例化*泛型类。例如，`Entry<String, Integer>` 是一个普通的类，拥有 `String getKey()`\
  \ 和 `Integer getValue()` 方法。\n\n\n\n\n[content]\n\n类型参数不能用基本类型实例化。例如，在 Java 中，`Entry<String,\
  \ int>` 是无效的。\n\n当你*构造*一个泛型类的对象时，可以从构造函数中省略类型参数。例如，\n\n点击此处查看代码图片\n\n```java\nEntry<String,\
  \ Integer> entry = new Entry<>(\"Fred\", 42);\n// 等同于 `new Entry<String, Integer>(\"\
  Fred\", 42)`\n```\n\n注意，在构造参数之前你仍然需要提供一对空角括号。有些人将这对空角括号称为*菱形*（diamond）。当你使用菱形语法时，构造函数的类型参数会被推断。\n\
  \n## 6.2 泛型方法\n\n就像泛型类是带有类型参数的类一样，*泛型方法*是带有类型参数的方法。泛型方法可以是普通类的方法，也可以是泛型类的方法。以下是在非泛型类中使用泛型方法的示例：\n\
  \n点击此处查看代码图片\n\n```java\npublic class Arrays {\n    public static <T> void swap(T[]\
  \ array, int i, int j) {\n        T temp = array[i];\n        array[i] = array[j];\n\
  \        array[j] = temp;\n    }\n}\n```\n\n这个 `swap` 方法可以用于交换任意数组元素，只要数组元素的类型不是基本类型即可。\n\
  \n```java\nString[] friends = ...;\nArrays.swap(friends, 0, 1);\n```\n\n当声明泛型方法时，类型参数被放在修饰符（如\
  \ `public` 和 `static`）之后、返回类型之前：\n\n点击此处查看代码图片\n\n```java\npublic static <T> void\
  \ swap(T[] array, int i, int j)\n```\n\n调用泛型方法时，你不需要指定类型参数。它是根据方法的参数和返回类型推断出来的。例如，在调用\
  \ `Arrays.swap(friends, 0, 1)` 时，`friends` 的类型是 `String[]`，编译器可以推断出 `T` 应该是 `String`。\n\
  \n如果你愿意，可以在方法名之前显式地提供类型，如下所示：\n\n点击此处查看代码图片\n\n```java\nArrays.<String>swap(friends,\
  \ 0, 1);\n```\n\n你可能想要这样做的一个原因是在出现问题时获得更好的错误信息——参见练习 5。\n\n在深入后续章节中复杂的技术细节泥潭之前，值得思考一下\
  \ `Entry` 类和 `swap` 方法的示例，并赞叹泛型类型是多么有用且自然。对于 `Entry` 类，键和值的类型可以是任意的。对于 `swap` 方法，数组类型可以是任意的。这通过类型变量被清晰地表达出来。\n\
  \n## 6.3 类型边界\n\n有时，泛型类或方法的类型参数需要满足某些要求。你可以指定一个*类型边界*（type bound），要求该类型扩展某些类或实现某些接口。\n\
  \n例如，假设你有一个实现了 `AutoCloseable` 接口的对象的 `ArrayList`，并且你想关闭它们所有的：\n\n点击此处查看代码图片\n\n\
  ```java\npublic static <T extends AutoCloseable> void closeAll(ArrayList<T> elems)\n\
  \        throws Exception {\n    for (T elem : elems) \n        elem.close();\n\
  }\n```\n\n类型边界 `extends AutoCloseable` 确保元素类型是 `AutoCloseable` 的子类型。因此，调用 `elem.close()`\
  \ 是有效的。你可以将 `ArrayList<PrintStream>` 传递给此方法，但不能传递 `ArrayList<String>`。注意类型边界中的 `extends`\
  \ 关键字实际上意味着“子类型”—Java 设计师使用了现有的 `extends` 关键字，而不是发明另一个关键字或符号。\n\n练习 14 有此方法的更有趣的变体。\n\
  \n![Image](img/00003.jpeg) 注意\n\n在这个例子中，我们需要一个类型边界，因为参数的类型是 `ArrayList`。如果方法接受的是数组，你就不需要泛型方法了。你只需要使用普通方法\n\
  \n点击此处查看代码图片\n\n```java\npublic static void closeAll(AutoCloseable[] elems) throws\
  \ Exception\n```\n\n这种方法可行是因为如 `PrintStream[]` 类的数组类型是 `AutoCloseable[]` 的子类型。然而，正如你在下一节中看到的，`ArrayList<PrintStream>`\
  \ *不是* `ArrayList<AutoCloseable>` 的子类型。使用受限类型参数解决了这个问题。\n\n类型参数可以有多个边界，例如：\n\n点击此处查看代码图片\n\
  \n```java\nT extends Runnable & AutoCloseable\n```\n\n这种语法与捕获多个异常相似，唯一的区别是类型是用“与”运算符组合的，而异常是与“或”运算符组合的。你可以有任意数量的接口边界，但类只能有一个。\n\
  \n## 6.4 类型协变与通配符\n\n假设你需要一个处理 `Employee` 子类的数组的方法。由于参数类型是 `ArrayList`，我们需要一个类型边界。如果方法接受数组，你只需将参数声明为\
  \ `Employee[]`：\n\n点击此处查看代码图片\n\n```java\npublic static void process(Employee[]\
  \ staff) { ... }\n```\n\n如果 `Manager` 是 `Employee` 的子类，你可以将 `Manager[]` 传递进去。这种行为被称为*协变*（covariance）。现在假设你想处理数组列表。然而，有一个问题：`ArrayList<Manager>`\
  \ *不是* `ArrayList<Employee>` 的子类型。这就是原因。如果允许将 `ArrayList<Manager>` 赋值给 `ArrayList<Employee>`，你就可以通过存储非员工来破坏数组列表：\n\
  \n点击此处查看代码图片\n\n```java\nArrayList<Manager> bosses = new ArrayList<>();\nArrayList<Employee>\
  \ empls = bosses; // 非法\nempls.add(new Employee());\n```\n\n由于不允许从 `ArrayList<Manager>`\
  \ 转换为 `ArrayList<Employee>`，错误就不会发生。\n\n![Image](img/00003.jpeg) 注意\n\n你可以在数组上产生相同的错误吗，那里\
  \ `Manager[]` 转换为 `Employee[]` 是允许的？当然可以，正如你在第 4 章 中看到的。Java 数组是协变的，这并不安全。相比之下，Java\
  \ 中所有的泛型你使用*通配符*（wildcards）来指定方法参数和返回类型的变化方式。这种机制有时被称为*使用协变*（use-site variance）。你将在后续章节看到细节。\n\
  \n### 6.4.1 子类型通配符\n\n在许多情况下，转换不同的数组列表是非常安全的。假设方法不会写入数组列表，因此它不会破坏参数。使用通配符来表达这一事实：\n\
  \n点击此处查看代码图片\n\n```java\npublic static void printNames(ArrayList<? extends Employee>\
  \ staff) {\n    for (int i = 0; i < staff.size(); i++) {\n        Employee e = staff.get(i);\n\
  \        System.out.println(e.getName());\n    }\n}\n```\n\n通配符类型 `? extends Employee`\
  \ 表示 `Employee` 的未知子类型。你可以用 `ArrayList<Employee>` 或子类型的数组列表（如 `ArrayList<Manager>`）来调用此方法。\n\
  \n`ArrayList<? extends Employee>` 类的 `get` 方法返回类型为 `? extends Employee`。语句\n\n`Employee\
  \ e = staff.get(i);`\n\n是完全合法的。无论 `?` 代表什么类型，它都是 `Employee` 的子类型，`staff.get(i)`\
  \ 的结果可以赋值给 `Employee` 变量 `e`。（在这个示例中我没有使用增强 for 循环是为了展示是如何从数组列表中获取元素的。）\n[/content]\n\
  \n\n\n如果你尝试将一个元素存储到 `ArrayList<? extends Employee>` 中会发生什么？那是行通的。考虑以下调用：\n\n```\n\
  staff.add(x);\n```\n\n`add` 方法的参数类型为 `? extends Employee`，你**没有任何对象**可以传递给这个方法。如果你传递了，比如一个\
  \ `Manager` 对象，编译器将拒绝。毕竟，`?` 可能指代**任何**子类，也许是 `Janitor`，而你不能将 `Manager` 添加到 `ArrayList<Janitor>`。\n\
  \n***\n\n![Image](img/00003.jpeg) 备注\n\n当然，你可以传递 `null`，但那不是一个对象。\n\n***\n\n总之，你可以从\
  \ `? extends Employee` 转换为 `Employee`，但永远无法将任何内容转换为 `? extends Employee`。这解释了为什么你可以从\
  \ `ArrayList<? extends Employee>` 读取内容，但不能向其写入。\n\n### 6.4.2 超类通配符\n\n通配符类型 `? extends\
  \ Employee` 表示 `Employee` 的任意子类。反之，通配符类型 `? super Employee` 表示 `Employee` 的超类。这些通配符在函数对象的参数中通常非常有用。这是一个典型的示例。`Predicate`\
  \ 接口有一个方法用于测试类型为 `T` 的对象是否具有特定属性：\n\n点击此处查看代码图片\n\n```\npublic interface Predicate<T>\
  \ {\n    boolean test(T arg);\n    ...\n}\n```\n\n该方法打印所有具有给定属性员工的名字：\n\n点击此处查看代码图片\n\
  \n```\npublic static void printAll(Employee[] staff, Predicate<Employee> filter)\
  \ {\n    for (Employee e : staff)\n        if (filter.test(e))\n            System.out.println(e.getName());\n\
  }\n```\n\n你可以使用类型为 `Predicate<Employee>` 的对象调用此方法。由于这是一个函数式接口，你也可以传递 lambda 表达式：\n\
  \n点击此处查看代码图片\n\n```\nprintAll(employees, e -> e.getSalary() > 100000);\n```\n\n\
  现在假设你想改用 `Predicate<Object>`，例如\n\n点击此处查看代码图片\n\n```\nPredicate<Object> evenLength\
  \ = e -> e.toString().length() % 2 == 0;\nprintAll(employees, evenLength);\n```\n\
  \n这不应该是问题。毕竟，每个 `Employee` 都是带有 `toString` 方法的 `Object`。然而，像所有的泛型一样，`Predicate`\
  \ 接口是不变变的，`Predicate<Employee>` 和 `Predicate<Object>` 之间没有关系。\n\n解决办法是允许任何 `Predicate<?\
  \ super Employee>`：\n\n点击此处查看代码图片\n\n```\npublic static void printAll(Employee[]\
  \ staff, Predicate<? super Employee> filter) {\n    for (Employee e : staff)\n \
  \       if (filter.test(e))\n            System.out.println(e.getName());\n}\n```\n\
  \n仔细观察调用 `filter.test(e)`。由于 `test` 的参数类型是 `Employee` 的某个超类，因此传递一个 `Employee` 对象是安全的。\n\
  \n这种情况非常典型。函数在它们的参数类型上自然是**逆变**（contravariant）的。例如，当预期一个可以处理员工的函数时，给出一个愿意处理任意对象的函数是可以的。\n\
  \n通常情况下，当你将泛型函数式指定指定方法参数时，你应该使用 `super` 通配符。\n\n***\n\n![Image](img/00003.jpeg)\
  \ 备注\n\n有些程序员喜欢用通配符的“PECS”助记法：生产者 `extends`，消费者 `super`。你从中从中读取值的 `ArrayList` 是生产者，所以你使用\
  \ `extends` 通配符。你为其提供值进行测试的 `Predicate` 是消费者，因此你使用 `super`。\n\n***\n\n### 6.4.3\
  \ 带类型变量的通配符\n\n考虑前一节方法的推广，该方法可以打印满足条件的任意元素：\n\n点击此处查看代码图片\n\n```\npublic static\
  \ <T> void printAll(T[] elements, Predicate<T> filter) {\n    for (T e : elements)\n\
  \        if (filter.test(e))\n            System.out.println(e.toString());\n}\n\
  ```\n\n这是一个泛型方法。参数 `T` 是 `Employee` 的子类。等等，文本说 `T` 是一个变量。让我们重新读一遍。“这是一个泛型方法。”\n\n\
  \n\n\n\n```java\nelements.set(i, elements.get(j));\n\nelements.set(j, temp);\n}\n\
  ```\n\n这种做法不可行。你可以使用 `?` 作为类型参数，但不能将其作为类型。\n\n然而，有一个通变方法。添加一个辅助方法，如下：\n\n点击此处查看代码图片\n\
  \n```java\npublic static void swap(ArrayList<?> elements, int i, int j) {\n    swapHelper(elements,\
  \ i, j);\n}\n\nprivate static <T> void swapHelper(ArrayList<T> elements, int i,\
  \ int j) {\n    T temp = elements.get(i);\n    elements.set(i, elements.get(j));\n\
  \    elements.set(j, temp);\n}\n```\n\n对 `swapHelper` 的调用是有效的，是因为有一种被称为*通配符捕获*wildcard\
  \ capture）的特殊规则。编译器不知道 `?` 是什么，但它代表某种类型，因此调用泛型方法是安全的。`swapHelper` 的类型参数 `T` “捕获”了通配符类型。由于\
  \ `swapHelper` 是一个泛型方法，而不是参数带有通配符的方法，它可以利用类型变量 `T` 来声明变量。\n\n我们获得了什么？API 的用户看到的是易于理解的\
  \ `ArrayList<?>`，而不是一个泛型方法。\n\n## 6.5 Java 虚拟机中的泛型\n\n当泛型类型和方法被引入 Java 时，Java 设计者希望类的泛型形式能够与先前的版本保持兼容。例如，应该能够将\
  \ `ArrayList<String>` 传递给泛型时代之前接收 `ArrayList` 类的方法（该类收集的是 `Object` 类型的元素）。语言设计者决定采用了一种在虚拟机中“擦除”（erases）类型的实现方案。这在当时非常流行，因为它让\
  \ Java 用户能够逐渐迁移到使用泛型。正如你可以想象的，这种方案是有缺点的，而且正如经常为了兼容性而做出的妥协那样，即使在迁移成功完成很久之后，这些缺点仍然存在。\n\
  \n在本节中，你将看到虚拟机内部发生了什么，下一节将将其产生的结果。\n\n### 6.5.1 类型擦除\n\n当你定义一个泛型类型时，它会被编译成一个*原始*（raw）类型。例如，第\
  \ 6.1 节 中的 `Entry<K, V>` 类——“泛型类”（第 208 页）变为：\n\n点击此处查看代码图片\n\n```java\npublic class\
  \ Entry {\n    private Object key;\n    private Object value;\n    public Entry(Object\
  \ key, Object value) {\n        this.key = key;\n        this.value = value;\n \
  \   }\n    public Object getKey() { return key; }\n    public Object getValue()\
  \ { return value; }\n}\n```\n\n每一个 `K` 和 `V` 都被替换为 `Object`。\n\n如果类型变量有边界，它会被替换为第一个边界。假设我们声明\
  \ `Entry` 类如下：\n\n点击此处查看代码图片\n\n```java\npublic class Entry<K extends Comparable<?\
  \ super K> & Serializable,\n                   V extends Serializable>\n```\n\n\
  那么它会被擦除为一个类：\n\n点击此处查看代码图片\n\n```java\npublic class Entry {\n    private Comparable\
  \ key;\n    private Serializable value;\n    ...\n}\n```\n\n### 6.5.2 强制转换插入\n\n\
  擦除听起来有些危险，但实际上它是完全安全的。例如，你使用了一个 `Entry<String, Integer>` 对象。当你构造对象时，必须提供一个 `String`\
  \ 类型的键和一个 `Integer` 类型（或转换为 Integer）的值。否则，你的程序甚至无法编译。因此，你可以保证 `getKey` 方法返回一个 `String`。\n\
  \n然而，假设你的程序在带有“未检查”警告的情况下编译，可能是因为你使用了强制转换或混合了泛型和原始 `Entry` 类型。这时，`Entry<String,\
  \ Integer>` 可能会有一个不同类型的键。\n\n因此，在运行时进行安全检查也是必要的。每当从一个带有擦除类型的表达式中读取内容时，编译器都会插入一个强制转换。例如：\n\
  \n点击此处查看代码图片\n\n```java\nEntry<String, Integer> entry = ...\nString key = entry.getKey();\n\
  ```\n\n### 6.5.3 桥接方法\n\n在前面的节中，你已经了解了擦除的基本知识。嗯，几乎是。在擦除参数和返回值类型时，编译器有时需要合成*桥接方法*（bridge\
  \ methods）。这是一个实现细节，除非你想知道为什么这种方法会出现在堆栈跟踪中，否则你不需要了解它。第 6.1 节，“泛型类”（第 208 页）。\n\n\
  \n\n\n\n在 Java 中使用泛型类型和方法时存在若干限制——有些仅仅令人惊讶，另一些则确实非常不便。大多数限制都是类型擦除（type erasure）的结果。后续章节将向你展示实践中最可能遇到的限制。\n\
  \n### 6.6.1 不支持基本类型参数\n\n类型参数永远不能是基本类型。例如，你不能创建一个 `ArrayList<int>`。正如你所看到的，在虚拟机中只有一种类型，即存储\
  \ `Object` 类型元素的原始 `ArrayList`。`int` 不是一个对象。\n\n在泛型首次引入时，这并不被认为是大问题。毕竟，人们可以创建一个\
  \ `ArrayList<Integer>` 并依赖自动装箱（autoboxing）。然而，随着泛型使用的越来越广泛，这种痛苦正在增加。存在大量的函数式接口，如\
  \ `IntFunction`、`LongFunction`、`DoubleFunction`、`ToIntFunction`、`ToLongFunction`、`ToDoubleFunction`——这涵盖了一元函数和八种基本类型中的三种。\n\
  \n### 6.6.2 运行时，所有类型都是原始类型\n\n在虚拟机中，只有原始类型（raw types）。例如，你无法在运行时查询一个 `ArrayList`\
  \ 是否包含 `String` 对象。如下条件判断：\n\n```\nif (a instanceof ArrayList<String>)\n```\n\n\
  是一个编译时错误，因为这种检查永远无法执行。\n\n对泛型类型的实例化进行强制类型转换同样无效，但它是合法的。\n\n```java\nObject result\
  \ = ...;\nArrayList<String> list = (ArrayList<String>) result;\n// 警告—这只检查 result\
  \ 是否为原始 ArrayList\n```\n\n允许这种强制类型转换是因为有时无法无法避免它。如果 `result` 是一个非常通用的过程的结果（例如通过反射调用方法，请参见第\
  \ 4 章），且编译器不知道其确切类型，程序员必须使用强制类型转换。仅转换为 `ArrayList` 或 `ArrayList<?>` 是不够的。\n\n为了消除该警告，可以这样对变量进行注解：\n\
  \n```java\n@SuppressWarnings(\"unchecked\") ArrayList<String> list = (ArrayList<String>)\
  \ result;\n```\n\n![Image](img/00007.jpeg) 警告\n\n滥用 `@SuppressWarnings` 注解会导致 `堆污染`（heap\
  \ pollution）——即本应属于某个特定泛型实例化的对象实际上却属于另一个实例化。例如，你可以将一个 `ArrayList<Employee>` 赋值给一个\
  \ `ArrayList<String>` 引用。结果是在获取到错误类型的元素时抛出 `ClassCastException`。\n\n![Image](img/00009.jpeg)\
  \ 提示\n\n堆污染的麻烦在于，报告的运行时错误距离问题源（插入错误的元素）非常远。如果你需要调试此类问题，可以使用“受检查视图”（checked view）。在你构建例如\
  \ `ArrayList<String>` 的地方，请改用：\n\n```java\nList<String> strings = Collections.checkedList(new\
  \ ArrayList<>(), String.class);\n```\n\n该视图会监控列表中的所有插入操作，并在当添加错误类型的对象时抛出异常。\n\n\
  `getClass` 方法始终返回原始类型。例如，如果 `list` 是一个 `ArrayList<String>`，那么 `list.getClass()`\
  \ 返回 `ArrayList.class`。事实上，并没有 `ArrayList<String>.class`——这样的类字面量是语法错误。\n\n此外，你不能在类字面量中使用类型变量。没有\
  \ `T.class`、`T[]].class` 或 `ArrayList<T>.class`。\n\n### 6.6.3 你不能实例化类型变量\n\n你不能在\
  \ `new T(...)` 或 `new T[...]` 等表达式中使用类型变量。这些形式是被禁止的，因为当 `T` 被擦除时，它们无法按照程序员的意图工作。\n\
  \n如果你想创建一个泛型实例或数组，你必须付出更多努力。假设你想提供一个 `repeat` 方法，使得 `Arrays.repeat(n, obj)` 创建一个包含\
  \ `n` 个 `obj` 拷贝的数组。当然，你希望数组的元素类型与 `obj` 的类型相同。这种尝试无效：\n\n```java\npublic static\
  \ <T> T[] repeat(int n, T obj) {\n    T[] result = new T[n]; // 错误—无法构造数组 new T[...]\n\
  \    for (int i = 0; i < n; i++) result[i] = obj;\n    return result;\n}\n```\n\n\
  为了解决这个问题，请调用者通过方法引用提供数组构造函数：\n\n```java\nString[] greetings = Arrays.repeat(10,\
  \ \"Hi\", String[]::new);\n```\n\n这是该方法的实现：\n\n```java\npublic static <T> T[] repeat(int\
  \ n, T obj, IntFunction<T[]> constr) {\n    T[] result = constr.apply(n);\n    for\
  \ (int i = 0; i < n; i++) result[i] = obj;\n    return result;\n}\n```\n\n或者，你可以要求用户提供一个类对象并使用反射。\n\
  \n```java\npublic static <T> T[] repeat(int n, T obj, Class<T> cl) {\n    @SuppressWarnings(\"\
  unchecked\") T[] result = (T[]) java.lang.reflect.Array.newInstance(cl, n);\n  \
  \  for (int i = 0; i < n; i++) result[i] = obj;\n    return result;\n}\n```\n该方法的调用方式为：\n\
  \n```java\nString[] greetings = Arrays.repeat(10, \"Hi\", String.class);\n```\n\n\
  另一个选项是让调用者分配数组。通常由调用者提供一个数组，即使长度为零。如果提供的数组太短，该方法将使用反射创建一个。\n\n```java\npublic static\
  \ <T> T[] repeat(int n, T obj, T[] array) {\n    T[] result;\n    if (array.length\
  \ >= n) {\n        result = array;\n    } else {\n        @SuppressWarnings(\"unchecked\"\
  ) T[] newArray = (T[]) java.lang.reflect.Array.newInstance(array.getClass().getComponentType(),\
  \ n);\n        result = newArray;\n    }\n    for (int i = 0; i < n; i++) result[i]\
  \ = obj;\n    return result;\n}\n```\n\n![Image](img/00009.jpeg) 提示\n\n你*可以*使用类型变量实例化\
  \ `ArrayList`。例如，以下代码完全合法：\n\n```java\npublic static <T> ArrayList<T> repeat(int\
  \ n, T obj) {\n    ArrayList<T> result = new ArrayList<>(); // OK\n    for (int\
  \ i = 0; i < n; i++) result.add(obj);\n    return result;\n}\n```\n这比你刚刚看到的变通方法简单得多，当你没有足够的理由生成数组时，我推荐使用这种方法。\n\
  \n![Image](img/00003.jpeg) 注意\n\n如果泛型类需要一个作为实现私部分的泛型数组，你可以直接构造一个 `Object[]` 数组。这就是\
  \ `ArrayList` 类的做法：\n\n```java\npublic class ArrayList<E> {\n    private Object[]\
  \ elementData;\n    public E get(int index) {\n        return (E) elementData[index];\n\
  \    }\n    ...\n}\n```\n\n### 6.6.4 你不能构造参数化类型的数组\n\n假设你想创建一个 `Entry` 对象的数组：\n\n\
  ```java\nEntry<String, Integer>[] entries = new Entry<String, Integer>[100]; //\
  \ 错误—无法构造泛型组件类型的数组\n```\n\n这是一个语法错误。这种构造被禁止是因为在擦除后，数组构造函数将创建一个原始的 `Entry` 数组。随后将能够添加任何类型的\
  \ `Entry` 对象（例如 `Entry<Employee, Manager>`）而不会抛出 `ArrayStoreException`。\n\n\n\n\n\
  \n注意 `type` 类型 `Entry<String, Integer>[]` 是完全合法的。你可以声明一个该类型的变量。如果你真的想初始化它，可以这样做：\n\
  \n点击此处查看代码图像\n\n```java\n@SuppressWarnings(\"unchecked\") Entry<String, Integer>[]\
  \ entries\n    = (Entry<String, Integer>[]) new Entry<?, ?>[100];\n```\n\n但使用 `ArrayList`\
  \ 会更简单：\n\n点击此处查看代码图像\n\n```java\nArrayList<Entry<String, Integer>> entries = new\
  \ ArrayList<>(100);\n```\n\n记住，变长参数（varargs）本质上是一个伪装成数组。如果这样一个参数是泛型的，你就可以绕过对泛型数组创建的限制。考虑这个方法：\n\
  \n点击此处查看代码图像\n\n```java\npublic static <T> ArrayList<T> asList(T... elements) {\n\
  \    ArrayList<T> result = new ArrayList<>();\n    for (T e : elements) result.add(e);\n\
  \    return result;\n}\n```\n\n现在考虑这个调用：\n\n点击此处查看代码图像\n\n```java\nEntry<String,\
  \ Integer> entry1 = ...;\nEntry<String, Integer> entry2 = ...;\nArrayList<Entry<String,\
  \ Integer>> entries = Lists.asList(entry1, entry2);\n```\n\n`T` 的推断类型是泛型类型 `Entry<String,\
  \ Integer>`，因此 `elements` 是一个 `Entry<String, Integer>` 类型的数组。这正是你无法手动完成的数组创建方式！\n\
  \n在这种情况下，编译器报告的是警告而不是错误。如果你的方法只从参数数组读取元素，则应该使用 `@SafeVarargs` 注解来抑制警告：\n\n点击此处查看代码图像\n\
  \n```java\n@SafeVarargs public static <T> ArrayList<T> asList(T... elements)\n```\n\
  \n该注解可以应用于 `static`、`final` 或 `private` 方法，也可以构造函数。任何其他方法可能会被重写，因此不符合该注解条件。\n\n\
  ### 6.6.5 类类型变量在静态上下文中无效\n\n考虑一个带有类型变量的泛型类，例如 `Entry<K, V>`。你不能在静态变量或方法中使用类型变量 `K`\
  \ 和 `V`。例如，以下代码无法运行：\n\n点击此处查看代码图像\n\n```java\npublic class Entry<K, V> {\n    private\
  \ static V defaultValue;\n        // 错误—静态上下文中无法使用 `V`\n    public static void setDefault(V\
  \ value) { defaultValue = value; }\n        // 错误—静态上下文中无法使用 `V`\n    ...\n}\n```\n\
  \n毕竟，类型擦除意味着在被擦除的 `Entry` 类中只有一个这样的变量或方法，而不是为每个 `K` 和 `V` 都对应一个。\n\n### 6.6.6 方法在擦除后可能发生冲突\n\
  \n你不能声明在擦除后会导致冲突的方法。例如，以下代码将是一个错误：\n\n点击此处查看代码图像\n\n```java\npublic interface Ordered<T>\
  \ extends Comparable<T> {\n    public default boolean equals(T value) {\n      \
  \  // 错误—擦除后与 `Object.equals` 冲突\n        return compareTo(value) == 0;\n    }\n\
  \    ...\n}\n```\n\n`equals(T value)` 方法擦除为 `equals(Object value)`，这与来自 `Object`\
  \ 的同名方法冲突了。\n\n有时冲突的原因更加微妙。这里有一个棘手的情况：\n\n点击此处查看代码图像\n\n```java\npublic class Employee\
  \ implements Comparable<Employee> {\n    ...\n    public int compareTo(Employee\
  \ other) {\n        return name.compareTo(other.name);\n    }\n}\n\npublic class\
  \ Manager extends Employee implements Comparable<Manager> {\n    // 错误—不能有两个 `Comparable`\
  \ 的实例化类型作为父类型\n    ...\n    public int compareTo(Manager other) {\n        return\
  \ Double.compare(salary, other.salary);\n    }\n}\n```\n\n`Manager` 类继承了 `Employee`，因此获取了父类型\
  \ `Comparable<Employee>`。自然地，经理们想通过工资来比较彼此，而不是通过姓名。为什么不呢？因为有类型擦除。只有两个方法 点击此处查看代码图像：\n\
  \n```java\npublic int compareTo(Employee other)\npublic int compareTo(Manager other)\n\
  ```\n\n问题在于桥接方法（bridge methods）。回想 第 6.5.3 节 桥接方法，这两个方法都会产生一个桥接方法 点击此处查看代码图像：\n\n\
  ```java\npublic int compareTo(Object other)\n```\n\n### 6.6.7 异常与泛型\n\n你不能抛出或捕获泛型对象。事实上，你无法形成\
  \ `Throwable` 的子类：点击此处查看代码图像\n\n```java\npublic class <T> extends\n```\n\n你不能在 `catch`\
  \ 子句中使用类型变量：点击此处查看代码图像\n\n```java\npublic static <V> doWork(Callable<V> c) {\n \
  \   try {\n        return c.call();\n    } catch (T ex) { // 错误—无法捕获类型变量 T\n```\n\
  \n然而，在 `throws` 声明中可以使用类型变量：点击此处查看代码图像\n\n```java\npublic static <V> doWork(Callable<V>\
  \ c) throws T {\n    try {\n        return c.call();\n    } catch (Throwable ex)\
  \ { // 擦除为 `Throwable`\n```\n\n**注意**：泛型可以区分检查异常和非检查异常。这里的关键在于这对方法：点击此处查看代码图像\n\n\
  ```java\npublic class Exceptions {\n    @SuppressWarnings(\"unchecked\")\n    private\
  \ static <T extends Throwable> void throwAs(Throwable e) throws T {\n        throw\
  \ (T) e; // 擦除为 `(Throwable) e`\n    }\n    public static <V> doWork(Callable<V>\
  \ c) {\n        try {\n            return c.call();\n        } catch (Throwable\
  \ ex) {\n            Exceptions.<RuntimeException>throwAs(ex);\n            return\
  \ null;\n        }\n    }\n}\n```\n\n现在考虑这个方法：点击此处查看代码图像\n\n```java\npublic static\
  \ String readAll(Path path) {\n    return doWork(() -> new String(Files.readAllBytes(path)));\n\
  }\n```\n\n尽管 `Files.readAllBytes` 在路径不存在时抛出检查异常，但在 `readAll` 方法中既没有声明也没有捕获它。\n\n\
  ### 6.7 反射与泛型\n\n在接下来的章节中，你将看到可以使用反射包中的泛型类，以及如何获取在擦除过程中保留的少量泛型类型信息。\n\n### 6.7.1\
  \ `Class<T>` 类\n\n`Class` 类有一个类型参数，即 `Class` 对象描述的类。哈？让我们慢慢来。\n\n考虑 `String` 类。在虚拟机中，有一个该类的\
  \ `Class` 对象，你可以通过 `\"Fred\".getClass()` 获取它，或者更直接通过类字面量 `String.class` 获取。你可以使用该对象查找类拥有的方法，或者创建一个实例。\n\
  \n类型参数有助于编写类型安全的代码。以 `Class<T>` 的 `getConstructor` 方法为例，它被声明返回 `Constructor<T>`。而\
  \ `Constructor<T>` 的 `newInstance` 方法被声明返回类型为 `T` 对象。这就是为什么 `String.class` 的类型是\
  \ `Class<String>`：它的 `getConstructor` 方法产生一个 `Constructor<String>`，其 `newInstance`\
  \ 方法返回一个 `String`。\n\n```java\npublic static <T> ArrayList<T> repeat(int n, Class<T>\
  \ cl)\n    throws ReflectiveOperationException {\n    ArrayList<T> result = new\
  \ ArrayList<>();\n    for (int i = 0; i < n; i++)\n        result.add(cl.getDeclaredConstructor().newInstance());\n\
  \    return result;\n}\n```\n\n\n\n\n```java\nresult.add(cl.getConstructor().newInstance());\n\
  \nreturn result;\n}\n```\n\n该方法可以编译，因为 `cl.getConstructor().newInstance()` 返回类型为\
  \ `T` 的结果。\n\n假设你通过 `repeat(10, Employee.class)` 调用此方法。那么 `T` 被推断为类型 `Employee`，因为\
  \ `Employee.class` 的类型是 `Class<Employee>`。因此，返回类型是 `ArrayList<Employee>`。\n\n除了\
  \ `getConstructor` 方法外，`Class` 类还有其他几个使用类型参数的方法。它们是：\n\n点击此处查看图片\n\n- `Class<? super\
  \ T> getSuperclass()`\n- `Class<? extends U> asSubclass(Class<U> clazz)`\n- `T cast(Object\
  \ obj)`\n- `Constructor<T> getDeclaredConstructor(Class<?>... parameterTypes)`\n\
  - `T[] getEnumConstants()`\n\n正如你在第 4 章中看到的，在很多情况下，你对 `Class` 对象所描述的类一无所知。这时，你可以直接使用通配符类型\
  \ `Class<?>`。\n\n### 6.7.2 虚拟机中的泛型类型信息\n\n擦除（Erasure）只影响实例化类型参数。关于泛型类和方法的*声明*的完整信息在运行时是用的。\n\
  \n例如，假设调用 `obj.getClass()` 返回 `ArrayList.class`。你无法判断 `obj` 被构造为 `ArrayList<String>`\
  \ 还是 `ArrayList<Employee>`。但你可以确定 `ArrayList` 类是一个泛型类，具有一个没有边界的类型参数 `E`。\n\n同样，考虑\
  \ `Collections` 类中的方法\n\n点击此处查看图片\n\n```java\nstatic <T extends Comparable<? super\
  \ T>> void sort(List<T> list)\n```\n\n正如你在第 4 章中看到的，你可以通过以下方式获取相应的 `Method` 对象：\n\
  \n点击此处查看图片\n\n```java\nMethod m = Collections.class.getMethod(\"sort\", List.class);\n\
  ```\n\n从这个 `Method` 对象中，你可以恢复整个方法签名。\n\n`java.lang.reflect` 包中的 `Type` 接口表示泛型声明。该接口有以下子类型：\n\
  \n1. `Class` 类，描述具体类型\n2. `TypeVariable` 接口，描述类型变量（例如 `T extends Comparable<? super\
  \ T>`）\n3. `WildcardType` 接口，描述通配符（例如 `? super T`）\n4. `ParameterizedType` 接口，描述泛型类或接口类型（例如\
  \ `Comparable<? super T>`）\n5. `GenericArrayType` 接口，描述泛型数组（例如 `T[]`）\n\n注意，后四个子类型都是接口——虚拟机会实例化实现这些接口的相应类。\n\
  \n类和方法都可以类型变量。从技术上讲，构造函数不是方法，它们在反射库中由单独的类表示。它们也可以是泛型的。要确定一个 `Class`、`Method` 或 `Constructor`\
  \ 对象是否来自泛型声明，请调用 `getTypeParameters` 方法。你会得到一个 `TypeVariable` 实例数组，声明中的每个类型变量对应一个实例；如果声明不是泛型的，则返回长度为\
  \ 0 的数组。\n\n`TypeVariable<D>` 接口是泛型的。类型参数是 `Class<T>`、`Method` 或 `Constructor<T>`，取决于类型变量声明的位置。例如，这里是获取\
  \ `ArrayList` 类的类型变量的方法：\n\n点击此处查看图片\n\n```java\nTypeVariable<Class<ArrayList>>[]\
  \ vars = ArrayList.class.getTypeParameters();\nString name = vars[0].getName();\
  \ // \"E\"\n```\n\n这里是 `Collections.sort` 方法的类型变量：\n\n点击此处查看图片\n\n```java\nMethod\
  \ m = Collections.class.getMethod(\"sort\", List.class);\nTypeVariable<Method>[]\
  \ vars = m.getTypeParameters();\nString name = vars[0].getName(); // \"T\"\n```\n\
  \n后一个变量有一个边界，你可以这样处理：\n\n点击此处查看图片\n\n```java\nType[] bounds = vars[0].getBounds();\n\
  if (bounds[0] instanceof ParameterizedType) { // Comparable<? super T>\n    ParameterizedType\
  \ p = (ParameterizedType) bounds[0];\n    Type[] typeArguments = p.getActualTypeArguments();\n\
  \    if (typeArguments[0] instanceof WildcardType) { // ? super T\n        WildCardType\
  \ t = (WildCardType) typeArguments[0];\n        Type[] upper = t.getUpperBounds();\
  \ // ? extends ... & ...\n    }\n}\n```\n（注：原文中 `WildCardType` 有拼写错误，根据标准 API 已更正为\
  \ `WildcardType`，但在必要时按上下文保留；此处我遵循了代码片段的逻辑）。\n\n等等，提供的原始文本后面包含一些乱码代码块……（此处省略重复且损坏的乱码部分）。\n\
  \n\n\n\n```java\npublic static <T> void maxmin(List<T> elements,\n        Comparator<?\
  \ super T> comp, List<? super T> result) {\n    minmax(elements, comp, result);\n\
  \    Lists.swapHelper(result, 0, 1);\n}\n```\n为什么如果没有通配符捕（wildcard capture），此方法无法编译？提示：尝试提供一个显式类型\
  \ `Lists.<___>swapHelper(result, 0, 1)`。\n\n14. 在第 6.3 节，“类型边界](#part0017.html_ch06lev1sec3)”（第\
  \ 210 页）中改进 `closeAll` 方法。即使某些元素抛出了异常，也要关闭所有元素。在这种情况下，随后抛出异常。如果有两个或多个调用抛出了异常，请将它们链在一起。\n\
  \n15. 实现一个 `map` 方法，它接收一个数组列表和一个 `Function<T, R>` 对象（参见第 3 章），并返回一个由将函数应用于给定元素后的的结果组成的数组列表。\n\
  \n16. `Collection` 类中以下方法的擦除（erasure）是什么？\n\n点击此处查看代码图像\n\n```java\npublic static\
  \ <T extends Comparable<? super T>>\n    void sort(List<T> list)\npublic static\
  \ <T extends Object & Comparable<? super T>>\n    T max(Collection<? extends T>\
  \ coll)\n```\n\n17. 定义一个实现 `Comparable<Employee>` 的类 `Employee`。使用 `javap` 工具证明合成了一个桥接方法（bridge\
  \ method）。它是做什么的？\n\n18. 考虑方法：\n\n点击此处查看代码图像\n\n```java\npublic static <T> T[] repeat(int\
  \ n, T obj, IntFunction<T[]> constr)\n```\n位于第 6.6.3 节，“你无法实例化类型变量](#part0017.html_ch06lev2sec11)”（第\
  \ 221 页）。调用 `Arrays.repeat(10, 42, int[]::new)` 将失败。为什么？你如何修复它？对于其他原始类型，你需要做什么？\n\
  \n19. 考虑方法：\n\n点击此处查看代码图像\n\n```java\npublic static <T> ArrayList<T> repeat(int\
  \ n, T obj)\n```\n位于第 6.6.3 节，“你无法实例化类型变量](#part0017.html_ch06lev2sec11)”（第 221\
  \ 页）。该方法在构造包含 `T` 类型值数组的 `ArrayList<T>` 时没有问题。你可以在不使用 `Class` 值或构造器引用的情况下，从该数组列表生成\
  \ `T[]` 数组吗？如果不能，为什么？\n\n20. 实现方法：\n\n点击此处查看代码图像\n\n```java\n@SafeVarargs public\
  \ static final <T> T[] repeat(int n, T... objs)\n```\n返回一个包含 `n` 个给定对象的数组。注意，不需要\
  \ `Class` 值或构造器引用，因为你可以通过反射增加 `objs`。\n\n21. 使用 `@SafeVarargs` 注解编写一个可以构造泛型类型数组的方法。例如：\n\
  \n点击此处查看代码图像\n\n```java\nList<String>[] result = Arrays.<List<String>>construct(10);\n\
  ```\n// 将 `result` 设置为大小为 10 的 `List<String>[]`\n\n22. 改进第 6.6.7 节，“异常与泛型](#part0017.html_ch06lev2sec15)”（第\
  \ 225 页）中的方法 `public static <V, T extends Throwable> V doWork(Callable<V> c, T ex)\
  \ throws T`，使得不需要传递一个可能永远不会使用的异常对象。相反，接受一个异常类的构造器引用。\n\n23. 在第 6.6.7 节，“异常与泛型](#part0017.html_ch06lev2sec15)”（第\
  \ 225 页）末的注意事项中，使用了 `throwAs` 辅助方法将 `ex` “强制转换”为 `RuntimeException` 并重新抛出。为什么你不能使用普通的强制转换，即\
  \ `throw (RuntimeException) ex`？\n\n24. 在 `Class<?>` 类型的变量上，哪些方法可以在不需要转换的情况下？\n\n\
  25. 编写方法 `public static String genericDeclaration(Method m)`，它返回方法 `m` 的声明，列出类型参数及其边界以及方法参数的类型（如果它们是泛型类型，则包括它们的类型参数）。\n\
