  \ 类拥有静态变量 `EMPTY_LIST`、`EMPTY_MAP` 和 `EMPTY_SET`。为什么它们没有 `emptyList`、`emptyMap`\
  \ 和 `emptySet` 方法好用？\n\n# 第 8 章 流 (Streams)\n\n本章主题\n\n- 8.1 从迭代到流操作\n- 8.2 流的创建\n\
  - 8.3 `filter`, `map` 和 `flatMap` 方法\n- 8.4 提取子流和合并流\n- 8.5 其他流转换\n- 8.6 简单归约\n\
  - 8.7 Optional 类型\n- 8.8 收集结果\n- 8.9 收集到映射\n- 8.10 分组与分区\n- 8.11 下游收集器\n- 8.12 归约操作\n\
  - 8.13 原始类型流\n- 8.14 并行流\n- 练习\n\n流提供了一种数据视图，允许你在比集合更高的抽象层上指定计算任务。通过流，你指定的是你想做什么，而不是怎么做。你将操作的调度交给实现。例如，假设你想计算某个属性的平均值。你指定数据源和属性，然后流库就可以优化计算，例如通过使用多个线程计算总和并合并结果。\n\
  \n本章的关键点是：\n\n1. 迭代器意味着特定的遍历策略并阻止了高效执行。\n2. 你可以从集合、数组、生成器或迭代器创建流。\n3. 使用 `filter`\
  \ 选择元素并使用 `map` 转换元素。\n4. 其他转换流的操作包括 `limit`、`distinct` 和 `sorted`。\n5. 要从流中获取结果，使用归约操作，如\
  \ `count`、`min`、`findFirst` 或 `findAny`。其中一些方法返回 `Optional` 值。\n6. `Optional` 类型旨在作为处理\
  \ `null` 的安全替代方案。要安全地使用它，请利用 `ifPresent` 和 `orElse` 方法。\n7. 你可以将流的结果收集到集合、数组、字符串或映射中。\n\
  8. `Collectors` 类的 `groupingBy` 和 `partitioningBy` 方法允许将流的内容分成组，并为每个组获取结果。\n9. 针对原始类型\
  \ `int`、`long` 和 `double` 有专门的流。\n10. 并行流会自动并行化流操作。\n\n### 8.1 从迭代到流操作\n\n当你处理一个集合时，通常会遍历它的元素并对每个元素执行一些操作。例如，假设我们想统计一书中所有的长单词。首先，将它们放入列表：\n\
  \n```java\nString contents = new String(Files.readAllBytes(Paths.get(\"alice.txt\"\
  )), StandardCharsets.UTF_8); // 读取文件到字符串\nList<String> words = List.of(contents.split(\"\
  \\\\P+\")); // 分分为单词；非字母字符是分隔符\n```\n\n现在我们准备好迭代了：\n\n```java\nint count = 0;\n\
  for (String w : words) {\n    if (w.length() > 12) count++;\n}\n```\n\n使用流，相同的操作看起来如下：\n\
  \n```java\nlong count = words.stream()\n    .filter(w -> w.length() > 12)\n    .count();\n\
  ```\n\n现在你不再需要扫描循环来寻找过滤和计数的证据了。方法名会立即告诉你代码意图做什么。而且，当循环详尽地规定了操作顺序时，流能够以它任何想要的方式调度操作，只要结果是正确的即可。\n\
  \n只需将 `stream` 改为 `parallelStream`，即可让流库并行执行过滤和计数。\n\n```java\nlong count = words.parallelStream()\n\
  \    .filter(w -> w.length() > 12)\n    .count();\n```\n\n\n\n\n\n# 3. 流操作在可能的情况下是`lazy`（惰性）的。这意味着在需要结果之前，它们不会被执行。例如，如果你只请求前五个长单词而不是全部，`filter`\
  \ 方法在匹配到第五个后就会停止过滤。因此，你甚至可以拥有无限流！\n\n让我们再次看看这个示例。`stream` 和 `parallelStream` 方法为\
  \ `words` 列表产生一个 `stream`。`filter` 方法返回另一个流，其中只包含长度大于 12 的单词。`count` 方法将该流归约为一个结果。\n\
  \n这种工作流在处理流时是典型的。你分三个阶段设置一个操作流水线：\n\n1.  创建一个流。\n2.  指定`intermediate operations`（中间操作）以将初始流转换为其他流，这些转换可能涉及多个步骤。\n\
  3.  应用`terminal operation`（终端操作）来产生结果。该操作会强制执行其之前的惰性操作。此后，该流将无法再次使用。\n\n在我们的示例中，流是通过\
  \ `stream` 或 `parallelStream` 方法创建的。`filter` 方法对其进行了转换，而 `count` 是终端操作。\n\n在下一节中，你将看到如何创建流。接下来的三个章节处理流的转换。最后是五个关于终端操作的章节。\n\
  \n## 8.2 流的创建\n\n你已经看到可以通过 `Collection` 接口的 `stream` 方法将任何集合转换为流。如果你有一个数组，请使用静态的\
  \ `Stream.of` 方法。\n\n点击此处查看代码图片\n\n```\nStream<String> words = Stream.of(contents.split(\"\
  \\\\PL+\"));\n// `split` 返回一个 `String[]` 数组\n```\n\n`of` 方法有一个可变参数参数，因此你可以从任何数量的参数构造流：\n\
  \n点击此处查看代码图片\n\n```java\nStream<String> song = Stream.of(\"gently\", \"down\", \"\
  the\", \"stream\");\n```\n\n使用 `Arrays.stream(array, from, to)` 从数组的一部分创建流。\n\n\
  要创建一个没有任何元素的流，请使用静态的 `Stream.empty` 方法：\n\n点击此处查看代码图片\n\n```java\nStream<String>\
  \ silence = Stream.empty();\n// 通用类型 `<String>` 被推断出来；等于 `Stream.<String>empty()`\n\
  ```\n\n`Stream` 接口有两个静态方法用于创建无限流。`generate` 方法接受一个无参数的函数（从技术上讲，是一个 `Supplier<T>`\
  \ 接口的对象——参见第 3.6.2 节“选择函数式接口”第 120 页）。每当需要流值时，就会调用该函数产生一个值。你可以获得一个常量值的流，如：\n\n点击此处查看代码图片\n\
  \n```java\nStream<String> echos = Stream.generate(() -> \"Echo\");\n```\n\n或者一个随机数流，如：\n\
  \n点击此处查看代码图片\n\n```java\nStream<Double> randoms = Stream.generate(Math::random);\n\
  ```\n\n要产生如 `0 1 2 3 ...` 的序列，请使用 `iterate` 方法。它接受一个“种子”值和一个函数（技术上讲，一个 `UnaryOperator<T>`），并重复地将函数应用到上一个结果。例如，\n\
  \n点击此处查看代码图片\n\n```java\nStream<BigInteger> integers = Stream.iterate(BigInteger.ZERO,\
  \ n -> n.add(BigInteger.ONE));\n```\n\n序列中的第一个元素是种子 `BigInteger.ZERO`。第二个元素是 `f(seed)`，或\
  \ `1`（大整数）。下一个元素是 `f(f(seed))`，或 `2`，依此类推。\n\n若要产生一个有限流，请添加一个谓词来指定迭代何时何时结束：\n\n\
  点击此处查看代码图片\n\n```java\nBigInteger limit = new BigInteger(\"10000000\");\nStream<BigInteger>\
  \ integers = Stream.iterate(BigInteger.ZERO,\n    n -> n.compareTo(limit) < 0,\n\
  \    n -> n.add(BigInteger.ONE));\n```\n\n一旦谓词拒绝了迭代生成的值，流就会结束。\n\n* * *\n\n![Image](img/00003.jpeg)\
  \ 注释\n\nJava API 中的许多方法都会产生流。例如，`Pattern` 类有一个方法 `splitAsStream`，可以根据正则表达式分割 `CharSequence`。你可以使用以下语句将字符串分割为单词：\n\
  \n点击此处查看代码图片\n\n```java\nStream<String> words = Pattern.compile(\"\\\\PL+\").splitAsStream(contents);\n\
  ```\n\n`Scanner.tokens` 方法产生标记流。另一种从字符串获取流的方法是：\n\n点击此处查看代码图片\n\n```java\nStream<String>\
  \ words = new Scanner(contents).tokens();\n```\n\n静态 `Files.lines` 方法返回行的 `Stream`：\n\
  \n点击此处查看代码图片\n\n```java\ntry (Stream<String> lines = Files.lines(path)) {\n```\n\
  \n### 8.3 `filter`, `map`, 和 `flatMap` 方法\n\n`filter` 方法返回另一个仅包含匹配谓词元素的流。你已经在示例中见过\
  \ `filter` 方法。在这里我们对字符串流使用 `filter` 来寻找长单词：\n\n点击此处查看代码图片\n\n```java\nStream<String>\
  \ longWords = words.filter(w -> w.length() > 12);\n```\n\n`map` 方法返回一个每个元素都经过给定转换的新流。在这里我们使用\
  \ `map` 将字符串流转换为小写版本：\n\n点击此处查看代码图片\n\n```java\nStream<String> lowercaseWords =\
  \ words.stream().map(String::toLowerCase);\n```\n\n`flatMap` 方法用于转换函数本身也返回一个流的情况。它将多个流扁平化为一个流。在这里我们使用\
  \ `flatMap` 获取所有单词的单独码点：\n\n点击此处查看代码图片\n\n```java\nStream<String> codePoints = words.stream().flatMap(w\
  \ -> codePoints(w));\n```\n\n`codePoints` 方法正确处理了需要两个 `char` 值的 Unicode 字符：\n\n\
  ```java\npublic static Stream<String> codePoints(String s) {\n    List<String> result\
  \ = new ArrayList<>();\n    int i = 0;\n    while (i < s.length()) {\n        int\
  \ j = s.offsetByCodePoints(i, 1);\n        result.add(s.substring(i, j));\n    \
  \    i = j;\n    }\n    return result.stream();\n}\n```\n\n现在在字符串流上映射 `codePoints`\
  \ 方法：\n\n点击此处查看代码图片\n\n```java\nStream<Stream<String>> result = words.stream().map(w\
  \ -> codePoints(w));\n```\n\n你会得到一个流的流，如 `[... [\"y\", \"o\", \"u\", \"r\"], [\"\
  b\", \"o\", \"a\", \"t\"], ...]`。为了将其扁平化为单个流，请使用 `flatMap` 方法代替 `map`：\n\n点击此处查看代码图片\n\
  \n```java\nStream<String> flatResult = words.stream().flatMap(w -> codePoints(w));\n\
  ```\n\n\n\n\n你可以在流以外的其他类中找到 `flatMap` 方法。它是计算机科学中的一个通用概念。假设你有一个泛型 `G`（例如 `Stream`）以及从某些类型\
  \ `T` 到 `G<U>` 的函数 `f` 和从 `U` 到 `G<V>` 的函数 `g`。那么你可以通过 `flatMap` 将它们组合起来——即先应用 `f`\
  \ 后应用 `g`。这是单子（monad）理论中的核心思想。但不必担心——你可以在了解任何单子知识的情况下使用 `flatMap`。\n\n***\n\n###\
  \ 8.4 提取子流和合并流\n\n`stream.limit(n)` 调用返回一个新的流，该流在 `n` 个元素后结束（或者如果原始流较短则在流结束时结束）。该方法对于将无限流截断为特定大小非常有用。例如，\n\
  \n点击此处查看代码图片\n\n```java\nStream<Double> randoms = Stream.generate(Math::random).limit(100);\n\
  ```\n\n产生一个包含 100 个随机数的流。\n\n`stream.skip(n)` 调的作用完全相反。它丢弃前 `n` 个元素。这在我们的读书籍示例中非常方便，因为由于\
  \ `split` 方法的工作方式，第一个元素是一个不需要的空字符串。我们可以通过调用 `skip` 让它消失：\n\n点击此处查看代码图片\n\n```java\n\
  Stream<String> words = Stream.of(contents.split(\"\\\\PL+\")).skip(1);\n```\n\n\
  `stream.takeWhile(predicate)` 调用在谓词为真时获取流中的所有元素，然后停止。\n\n例如，假设我们使用前一节的 `codePoints`\
  \ 方法将字符串拆分为字符，并且我们想要收集所有的初始数字。`takeWhile` 方法可以做到：\n\n点击此处查看代码图片\n\n```java\nStream<String>\
  \ initialDigits = codePoints(str).takeWhile(\n    s -> \"0123456789\".contains(s));\n\
  ```\n\n`dropWhile` 方法执行相反的操作，在条件为真时丢弃元素，并产生一个从第一个条件为假的元素开始的所有元素的流。例如，\n\n点击此处查看代码图片\n\
  \n```java\nStream<String> withoutInitialWhiteSpace = codePoints(str).dropWhile(\n\
  \    s -> s.trim().length() == 0);\n```\n\n你可以使用 `Stream` 类的静态方法 `concat` 合并两个流：\n\
  \n点击此处查看代码图片\n\n```java\nStream<String> combined = Stream.concat(\n    codePoints(\"\
  Hello\"), codePoints(\"World\"));\n// 产生流 [\"H\", \"e\", \"l\", \"l\", \"o\", \"\
  W\", \"o\", \"r\", \"l\", \"d\"]\n```\n\n当然，第一个流不应该是无限的——否则第二个流将永远没有机会开始。\n\n###\
  \ 8.5 其他流变换\n\n`distinct` 方法返回一个流，该流按原始流的顺序产生元素，但抑制了重复元素。重复元素不需要是相邻的。\n\n点击此处查看代码图片\n\
  \n```java\nStream<String> uniqueWords = Stream.of(\"merrily\", \"merrily\", \"merrily\"\
  , \"gently\").distinct();\n// 只保留一个 \"merrily\"\n```\n\n对于对流进行排序，`sorted` 方法有几种变体。一种适用于\
  \ `Comparable` 元素的流，另一种接受一个 `Comparator`。在这里，我们对字符串进行排序，让最长的排在前面：\n\n点击此处查看代码图片\n\
  \n```java\nStream<String> longestFirst = words.stream().sorted(Comparator.comparing(String::length).reversed());\n\
  ```\n\n与所有的流变换一样，`sorted` 方法产生一个新的流，其元素是原始流元素按排序后的顺序。\n\n当然，你可以在不使用流对集合进行排序。当排序过程是流流水线的一部分时，`sorted`\
  \ 方法非常有用。\n\n最后，`peek` 方法产生另一个与原始流具有相同元素的流，但每当获取一个元素时都会调用一个函数。这对于调试非常有用：\n\n点击此处查看代码图片\n\
  \n```java\nObject[] powers = Stream.iterate(1.0, p -> p * 2)\n    .peek(e -> System.out.println(\"\
  Fetching \" + e))\n    .limit(20).toArray();\n```\n\n当元素被实际访问时，会打印一条消息。通过这种你可以验证\
  \ `iterate` 返回的无限流是按惰性处理的。\n\n***\n\n![图像](img/00009.jpeg) **提示**：当你使用调试器调试流计算时，可以在从其中一个变换调用的方法中设置断点。大多数\
  \ IDE 都支持此操作。\n[/content]\n\n(注：由于提供的待翻译文本似乎出现了重复或乱码的部分，我已根据前面的逻辑进行了完整翻译。以下是剩余部分的逻辑翻译：)\n\
