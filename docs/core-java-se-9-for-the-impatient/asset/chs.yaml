  \n\n在本章中，你将学习如何处理文件、目录和网页，以及如何以二进制格式和文本格式读写数据。你还会遇到关于正则表达式的讨论，这对于处理输入非常有用。（我找不到更合适的地方来讨论这个话题了，显然\
  \ Java 开发者也并没有想到——当正则表达式 API 规范被提出时，它被附在了针对“新 I/O”特性的规范请求中。）最后，本章将向你展示对象序列化机制，它可以让你像存储文本或数值数据一样容易地存储对象。\n\
  \n本章的要点如下：\n\n1. `InputStream` 是字节源，而 `OutputStream` 是字节的终点。\n2. `Reader` 读取字符，而\
  \ `Writer` 写入字符。请务必指定字符编码。\n3. `Files` 类提供了便利方法，用于读取文件的所有字节或所有行。\n4. `DataInput`\
  \ 和 `DataOutput` 接口具有以二进制格式写入数字的方法。\n5. 使用 `RandomAccessFile` 或内存映射文件进行随机访问。\n6.\
  \ `Path` 是文件系统中路径组件的绝对或相对序列。路径可以被组合（或“解析”）。\n7. 使用 `Files` 类的方法来复制、移动或删除文件，并递归地遍历目录树。\n\
  8. 要读取或更新 ZIP 文件，请使用 ZIP 文件系统。\n9. 你可以使用 `URL` 类读取网页内容。要读取元数据或写入数据，请使用 `URLConnection`\
  \ 类。\n10. 通过 `Pattern` 和 `Matcher` 类，你可以在字符串中找到正则表达式的所有匹配项，以及每个匹配项的捕获组。\n11. 序列化机制可以保存和恢复任何实现\
  \ `Serializable` 接口的对象，只要其实例变量也是可序列化的。\n\n## 9.1 输入/输出流、读取器和写入器\n\n在 Java API 中，可以读取字节的源被称为*输入流*（input\
  \ stream）。字节可以来自文件、网络连接或内存中的数组。（这些流与第 8 章中的流无关。）类似地，字节的终点是*输出流*（output stream）。相比之下，*读取器*（readers）和*写入器*（writers）消耗和产生*字符*（characters）序列。在接下来的章节中，你将学习如何读写字节和字符。\n\
  \n### 9.1.1 获取流\n\n从文件获取流最简单的方法是使用静态方法：\n\n```\nInputStream in = Files.newInputStream(path);\n\
  OutputStream out = Files.newOutputStream(path);\n```\n\n在这里，`path` 是 `Path` 类的实例，该类将在\
  \ 9.2.1 节“路径”（第 298 页）介绍。它描述了文件系统的路径。\n\n如果你有一个 URL，可以从 `URL` 类 `openStream` 方法返回的输入流中读取内容：\n\
  \n```\nURL url = new URL(\"http://horstmann.com/index.html\");\nInputStream in =\
  \ url.openStream();\n```\n\n第 9.3 节“HTTP 连接”（第 306 页）展示了如何向 Web 服务器发送数据。\n\n`ByteArrayInputStream`\
  \ 类允许你从字节数组读取。\n\n```\nbyte[] bytes = ...;\nInputStream in = new ByteArrayInputStream(bytes);\n\
  ```\n\n相反，要将输出到字节数组，请使用 `ByteArrayOutputStream`：\n\n```java\nByteArrayOutputStream\
  \ out = new ByteArrayOutputStream();\n// 写入 `out`\nbyte[] bytes = out.toByteArray();\n\
  ```\n\n### 9.1.2 读取字节\n\n`InputStream` 类有一个读取单个字节的方法：\n\n```\nInputStream in = ...;\n\
  int b = in.read();\n```\n\n该方法要么作为 `0` 到 `255` 之间的整数返回字节，要么在到达输入结束时返回 `-1`。\n\n\
  > **注意**：Java 的 `byte` 类型值范围在 `-128` 到 `127` 之间。你可以在检查返回值不为 `-1` *之后*，将返回值强制转换为\
  \ `byte` 类型。\n\n更常见的情况下，你可能想要批量读取字节。最方便的方法是 `readAllBytes` 方法，它简单地从流中读取所有字节到字节数组中：\n\
  \n```\nbyte[] bytes = in.readAllBytes();\n```\n\n> **提示**：如果你想读取文件的所有字节，请调用便利方法：\n\
  \n```java\nbyte[] bytes = Files.readAllBytes(path);\n```\n\n如果你只想读取部分字节而非全部，请提供一个字节数组并调用\
  \ `readN` 方法：\n\n```java\nbyte[] bytes = new byte[len];\nint bytesRead = in.readN(bytes,\
  \ offset, n);\n```\n\n`readN` 方法会读取到获取 `n` 个字节或没有可用输入为止，并返回实际读取的字节。\n\n### 9.1.3\
  \ 写入字节\n\n`OutputStream` 的 `write` 方法可以写入单个字节。\n\n```\nOutputStream out = ...;\n\
  int b = ...;\nout.write(b);\n```\n\n写入一个数组：\n\n```java\nOutputStream out = ...;\n\
  byte[] bytes = ...;\nout.write(bytes);\n```\n\n操作完成后，请使用 try-with-resources 语句：\n\
  \n```java\ntry (OutputStream out = ...) {\n    out.write(b);\n}\n```\n\n如果你需要将输入流复制到输出流，请使用\
  \ `transferTo` 方法：\n\n```java\ntry (InputStream in = ...; OutputStream out = ...)\
  \ {\n    in.transferTo(out);\n}\n```\n\n要保存文件，调用：\n\n```java\nFiles.copy(in, path);\n\
  ```\n\n### 9.1.4 字符编码\n\n输入流和输出流用于处理字节序列，但在许多情况下，你将处理文本——即字符序列。这时，字符如何编码为字节就变得重要了。\n\
  \nJava 使用 Unicode 标准处理字符。每个字符或“代码点”（code point）都有一个 21 位的整数。有不同的*字符编码*（character\
  \ encodings）——将这些 21 位数字封装成字节的方法。\n\n最常见的编码是 UTF-8，它将每个 Unicode 代码点编码为一到四个字节的序列。UTF-8\
  \ 的优势在于传统 ASCII 字符集中的字符（包含英语中使用的所有字符）仅占用一个字节。\n\n\n\n\n\n| `10000...10FFFF` | `11110a`[`20`]`a`[`19`]`a`[`18`]\
  \ `10a`[`17`]`a`[`16`]`a`[`15`]`a`[`14`]`a`[`13`]`a`[`12`] `10a`[`11`]`a`[`10`]`a`[`9`]`a`[`8`]`a`[`7`]`a`[`6`]\
  \ `10a`[`5`]`a`[`4`]`a`[`3`]`a`[`2`]`a`[`1`]`a`[`0`] |\n\n另一种常见的编码是 `UTF-16`，它将每个\
  \ Unicode 码点编码为一个或两个 16 位的值（请参见表 9-2）。这是 Java 字符串中使用的编码。实际上，`UTF-16` 有两种形式，称为“大端”（big-endian）和“小端”（little-endian）。考虑\
  \ 16 位值 `0x2122`。在大端格式下，高位字节在前：`0x21` 后面是 `0x22`。在小端格式下，情况则相反：`0x22 0x21`。为了指示使用了这两种哪一种，文件可以用“字节顺序标记”（byte\
  \ order mark， 16 位数值 `0xFEFF`）开头。读取器可以使用此值来确定字节序并将其丢弃。\n\n### 表 9-2 UTF-16 编码\n\n\
  | 字符范围 | 编码 |\n| :--- | :--- |\n| `0...FFFF` | `a`[`15`]`a`[`14`]`a`[`13`]`a`[`12`]`a`[`11`]`a`[`10`]`a`[`9`]`a`[`8`]`a`[`7`]`a`[`6`]`a`[`5`]`a`[`4`]`a`[`3`]`a`[`2`]`a`[`1`]`a`[`0`]`\
  \ |\n| `10000...10FFFF` | `110110b`[`19`]`b`[`18`]`b`[`17`]`b`[`16`]`a`[`15`]`a`[`14`]`a`[`13`]`a`[`12`]`a`[`11`]`a`[`10`]\
  \ `110111a`[`9`]`a`[`8`]`a`[`7`]`a`[`6`]`a`[`5`]`a`[`4`]`a`[`3`]`a`[`2`]`a`[`1`]`a`[`0`]`\
  \ 其中 `b`[`19`]`b`[`18`]`b`[`17`]`b`[`16`]` = `a`[`20`]`a`[`19`]`a`[`18`]`a`[`17`]`a`[`16`]`\
  \ – 1 |\n\n![Image](img/00007.jpeg) **注意**\n\n某些程序（包括微软记事本）会在 `UTF-8` 编码文件的开头添加字节顺序标记。显然，这是没有必要的，因为\
  \ `UTF-8` 中不存在字节序问题。但 Unicode 标准允许这样做，甚至建议这是一个很不错的主意，因为这几乎消除了对编码的疑虑。它在读取 `UTF-8`\
  \ 编码文件时理上应该被移除。遗憾的是，Java 并没有这样做，而针对此问题的错误报告被关闭为“不予修复”。最好的办法是过滤掉在输入中发现的任何前导 `\\uFEFF`。\n\
  \n除了 `UTF` 编码外，还有一些适用于特定用户群体的字符范围的局部编码。例如，`ISO 8859-1` 是一种单字节编码，包含了西欧语言使用的带重音符号字符。`Shift_JIS`\
  \ 是一种用于日语字符的变长编码。许多此类编码仍被广泛使用。\n\n没有可靠的方法可以从字节流中自动检测字符编码。某些 API 方法允许你使用“默认字符集”（default\
  \ charset）——即计算机操作系统偏好的字符编码。\n\n\n\n\n\n```java\nOutputStream outStream = ...;\n\
  \nWriter out = new OutputStreamWriter(outStream, charset);\n\nout.write(str);\n\
  ```\n\n要获取文件的 writer，请使用\n\n点击此处查看代码图片\n\n```java\nWriter out = Files.newBufferedWriter(path,\
  \ charset);\n```\n\n使用 `PrintWriter` 更加方便，它拥有你一直在 `System.out` 中使用的 `print`、`println`\
  \ 和 `printf` 方法。通过使用这些方法，你可以打印数字并使用格式化输出。\n\n如果你要将内容写入文件，可以这样构造 `PrintWriter`：\n\
  \n点击此处查看代码图片\n\n```java\nPrintWriter out = new PrintWriter(Files.newBufferedWriter(path,\
  \ charset));\n```\n\n如果你要写入另一个流，请使用\n\n点击此处查看代码图片\n\n```java\nPrintWriter out =\
  \ new PrintWriter(\n    new OutputStreamWriter(outStream, charset));\n```\n\n***\n\
  \n![Image](img/00003.jpeg) 注意\n\n`System.out` 是 `PrintStream` 的实例，而不是 `PrintWriter`。这是\
  \ Java 早期阶段的遗留。然而，`print`、`println` 和 `printf` 方法在 `PrintStream` 和 `PrintWriter`\
  \ 类中的工作方式相同，它们都使用字符编码将字符转换为字节。\n\n***\n\n如果你已经有一个字符串形式的文本要进行写入，请调用\n\n点击此处查看代码图片\n\
  \n```java\nString content = ...;\n\nFiles.write(path, content.getBytes(charset));\n\
  ```\n\n或者\n\n点击此处查看代码图片\n\n```java\nFiles.write(path, lines, charset);\n```\n\n\
  在这里，`lines` 可以是一个 `Collection<String>`，或者更通用的 `Iterable<? extends CharSequence>`。\n\
  \n要向文件追加内容，请使用\n\n点击此处查看代码图片\n\n```java\nFiles.write(path, content.getBytes(charset),\
  \ StandardOpenOption.APPEND);\n\nFiles.write(path, lines, charset, StandardOpenOption.APPEND);\n\
  ```\n\n***\n\n![Image](img/00007.jpeg) 注意\n\n当使用部分字符集（如 ISO 8859-1）写入文本时，任何无法映射的字符都会被静默更改为“替换字符”——在大多数情况下，`?`\
  \ 字符或 Unicode 替换字符 `U+FFFD`。\n\n***\n\n有时，库方法需要一个 `Writer` 来写入输出。如果你想将该输出捕获到字符串中，给它一个\
  \ `StringWriter`。或者，如果它需要 `PrintWriter`，请这样包装 `StringWriter`：\n\n点击此处查看代码图片\n\n\
  ```java\nStringWriter writer = new StringWriter();\n\nthrowable.printStackTrace(new\
  \ PrintWriter(writer));\n\nString stackTrace = writer.toString();\n```\n\n### 9.1.7\
  \ 读取和读写二进制数据\n\n`DataInput` 接口声明了以下用于以二进制格式读取数字、字符、`boolean` 值或字符串的方法：\n\n- `byte\
  \ readByte()`\n- `int readUnsignedByte()`\n- `char readChar()`\n- `short readShort()`\n\
  - `int readUnsignedShort()`\n- `int readInt()`\n- `long readLong()`\n- `float readFloat()`\n\
  - `double readDouble()`\n- `void readFully(byte[] b)`\n\n`DataOutput` 接口声明了相应的 `write`\
  \ 方法。\n\n***\n\n![Image](img/00003.jpeg) 注意\n\n这些方法以大端序（big-endian）格式读写数字。\n\n***\n\
  \n***\n\n![Image](img/00007.jpeg) 注意\n\n还有使用“修改后的 UTF-8”格式的 `readUTF`/`writeUTF`\
  \ 方法。这些方法*不与*普通的 UTF-8 兼容，且仅供 JVM 内部使用。\n\n***\n\n二进制 I/O 的优势是它是固定宽度且高效的。例如，`writeInt`\
  \ 无论数字有多少位，始终将整数写作为一个大端序的 4 字节二进制量。给定类型的每个值所需的空间是相同的，这加快了随机访问。此外，读取二进制数据比解析文本快。主要的缺点是生成的文件无法在文本编辑器中方便地查看。\n\
  \n你可以对任何流使用 `DataInputStream` 和 `DataOutputStream` 适配器。例如，\n\n点击此处查看代码图片\n\n```java\n\
  DataInput in = new DataInputStream(Files.newInputStream(path));\n\nDataOutput out\
  \ = new DataOutputStream(Files.newOutputStream(path));\n```\n\n### 9.1.8 随机访问文件\n\
  \n`RandomAccessFile` 类允许你在文件的任何位置读取或写入数据。你可以以只读或读写模式打开随机访问文件；通过使用字符串 `\"r\"`（用于读取访问）或\
  \ `\"rw\"`（用于读/写访问）作为构造函数的第二个参数来指定选项。例如，\n\n点击此处查看代码图片\n\n```java\nRandomAccessFile\
  \ file = new RandomAccessFile(path, \"rw\");\n```\n\n随机访问文件有一个指示下一个要读字节的文件指针。`seek`\
  \ 方法将文件指针设置为文件内的任意位置。`seek` 的参数介于 0 到文件长度之间的 `long`。`getFilePointer` 返回当前位置。\n\n\
  `RandomAccessFile` 类实现了 `DataInput` 和 `DataOutput` 接口。要从随机访问文件读写数字，请使用你在前一节中看到的\
  \ `readInt`/`writeInt` 方法。例如，\n\n点击此处查看代码图片\n\n```java\nint value = file.readInt();\n\
  \nfile.seek(file.getFilePointer() - 4);\n\nfile.writeInt(value + 1);\n```\n\n等待访问\
  \ API 与输入/输出流完全不同。首先，获取一个文件的 *channel*：\n\n点击此处查看代码图片\n\n```java\nFileChannel channel\
  \ = FileChannel.open(path, StandardOpenOption.READ);\n```\n\n然后，将文件的某个区域（如果文件太大，则是整个文件）映射到内存中：\n\
  \n点击此处查看代码图片\n\n```java\nByteBuffer buffer = channel.map(FileChannel.MapMode.READ_WRITE,\
  \ 0, channel.size());\n```\n\n使用 `get`、`getInt`、`getDouble` 等方法读取值，使用等等的 `put` 方法写入。在某处，当通道关闭时，这些更改会被写回文件。\n\
  \n***\n\n![Image](img/00003.jpeg) 注意\n\n默认情况下，读写数字的方法使用大端序。你可以通过命令更改字节序：\n\n点击此处查看代码图片\n\
  \n```java\nbuffer.order(ByteOrder.LITTLE_ENDIAN);\n```\n\n***\n\n### 9.1.9 内存映射文件\n\
  \n内存映射文件提供了另一种高效的随机访问方法，适用于大文件。然而数据访问 API 与输入/输出流完全不同。首先，获取一个文件的 *channel*：\n\n\
  点击此处查看代码图片\n\n```java\nFileChannel channel = FileChannel.open(path, StandardOpenOption.READ,\
  \ StandardOpenOption.WRITE);\n```\n\n然后，将文件的某个区域（如果文件太大，则是整个文件）映射到内存中：\n\n点击此处查看代码图片\n\
  \n```java\nByteBuffer buffer = channel.map(FileChannel.MapMode.READ_WRITE, 0, channel.size());\n\
  ```\n\n使用 `get`、`getInt`、`getDouble` 等方法读取值，使用等等的 `put` 方法写入值。在某处，当通道关闭时，这些更改会被写回文件。\n\
  \n***\n\n![Image](img/00003.jpeg) 注意\n\n默认情况下，读写数字的方法使用大端序。你可以通过命令更改字节序：\n\n点击此处查看代码图片\n\
  \n```java\nbuffer.order(ByteOrder.LITTLE_ENDIAN);\n```\n\n***\n\n### 9.1.10 文件锁\n\
  \n当多个同时执行的程序修改同一个文件时，它们需要以某种方式进行通信，否则文件很容易损坏。文件锁可以解决这个问题。\n\n假设你的应用程序保存了一个包含用户偏好的配置文件。如果用户调用了应用程序的两个实例可能会可能会两者都想同时写入配置文件。在这种情况下，第一个实例应该锁定文件。当第二个实例发现文件被锁定时，它可以决定等待直到文件解锁，或者简单地跳过写入过程。要锁定文件，请调用\
  \ `FileChannel` 类的 `lock` 或 `tryLock` 方法。\n\n点击此处查看代码图片\n\n```java\nFileChannel\
  \ channel = FileChannel.open(path);\n\nFileLock lock = channel.lock();\n```\n\n\
  或者\n\n点击此处查看代码图片\n\n```java\nFileLock lock = channel.tryLock();\n```\n\n第一个调用会阻塞直到锁可用。第二个调用会立即返回，返回锁或在锁不可用时返回\
  \ `null`。文件将保持锁定状态直到锁或通道关闭。最好使用 `try-with-resources` 语句：\n\n\n\n\n点击此处查看代码图片\n\n\
  ```java\ntry (FileLock lock = channel.lock()) {\n    ...\n}\n```\n\n### 9.2 路径、文件与目录\n\
  \n你已经见过了用于指定文件路径的 `Path` 对象。在接下来的节中，你将看到如何操作这些对象，以及如何处理与文件和目录相关工作。\n\n#### 9.2.1\
  \ 路径\n\n`Path` 是目录名称的序列，后面可选地跟一个文件名。路径的第一个组件可以是根组件，例如 `/` 或 `C:\\`。允许的根组件取决于文件系统。以根组件开始的路径是**绝对路径**（`absolute`）。否则，它是**相对路径**（`relative`）。例如，在此处，我们构造了一个绝对路径和一个相对路径。对于绝对路径，我们假设正运行在类\
  \ Unix 的文件系统上。\n\n点击此处查看代码图片\n\n```java\nPath absolute = Paths.get(\"/\", \"home\"\
  , \"cay\");\nPath relative = Paths.get(\"myapp\", \"conf\", \"user.properties\"\
  );\n```\n\n静态方法 `Paths.get` 接收一个或多个字符串，并使用默认文件系统的路径分隔符将它们连接起来（类 Unix 文件系统为 `/`，Windows\
  \ 系统为 `\\`）。然后它会解析结果，如果结果在给定的文件系统中不是一个有效路径，则会抛出 `InvalidPathException`。结果是一个 `Path`\
  \ 对象。\n\n你也可以向 `Paths.get` 方法提供一个带有分隔符的字符串：\n\n点击此处查看代码图片\n\n```java\nPath homeDirectory\
  \ = Paths.get(\"/home/cay\");\n```\n\n![Image](img/00003.jpeg) 注意\n\n`Path` 对象并不一定对应于一个实际的文件。它仅仅是一个抽象的名称序列。要创建一个文件，先创建一个路径，然后调用方法来创建对应的文件——参见第\
  \ 9.2.2 节，“创建文件与目录](#part0023.html_ch09lev2sec12)”（第 300 页）。\n\n组合或“解析”（resolve）路径是非常常见的。调用\
  \ `p.resolve(q)` 根据以下规则返回一个路径：\n\n- 如果 `q` 是绝对路径，则结果为 `q`。\n- 否则，根据文件系统的规则，结果为“`p`\
  \ 然后是 `q`”。\n\n例如，假设你的应用程序需要相对于家目录找到其配置文件。以下是你可以组合路径的方法：\n\n点击此处查看代码图片\n\n```java\n\
  Path workPath = homeDirectory.resolve(\"myapp/work\"); // 等于 homeDirectory.resolve(Paths.get(\"\
  myapp/work\"));\n```\n\n有一个便利方法 `resolveSibling`，它相对于路径的父目录进行解析，产生一个兄弟节点路径。例如，如果\
  \ `workPath` 是 `/home/cay/myapp/work`，则调用\n\n点击此处查看代码图片\n\n```java\nPath tempPath\
  \ = workPath.resolveSibling(\"temp\");\n```\n\n产生 `/home/cay/myapp/temp`。\n\n`resolve`\
  \ 的反操作是 `relativize`（相对化）。调用 `p.relativize(r)` 产生路径 `q`，当它与 `p` 解析时，会产生 `r`。例如，\n\
  \n点击此处查看代码图片\n\n```java\nPaths.get(\"/home/cay\").relativize(Paths.get(\"/home/fred/myapp\"\
  ))\n```\n\n产生 `../fred/myapp`，假设我们有一个使用 `..` 来表示父目录的文件系统。\n\n`normalize` 方法移除任何冗余的\
  \ `.` 和 `..` 组件（或文件系统认为任何组件）。例如，规范化路径 `/home/cay/../fred/./myapp` 产生 `/home/fred/myapp`。\n\
  \n`toAbsolutePath` 方法产生给定路径的绝对路径。如果该路径不是绝对的，它将相对于“用户目录”进行解析——即调用 JVM 的目录。例如，如果你从\
  \ `/home/cay/myapp` 启动程序，那么 `Paths.get(\"config\").toAbsolutePath()` 返回 `/home/cay/myapp/config`。\n\
  \n`Path` 接口拥有拆解路径并将其与其他路径组合的方法。这段代码示例展示了一些最有用的方法：\n\n```java\nPath p = Paths.get(\"\
  /home\", \"cay\", \"myapp.properties\");\nPath parent = p.getParent(); // 路径 /home/cay\n\
  Path file = p.getFileName(); // 最后一个元素，myapp.properties\nPath root = p.getRoot();\
  \ // 初始段 /（相对路径为 null）\nPath first = p.getName(0); // 第一个元素\nPath dir = p.subpath(1,\
  \ p.getNameCount()); // 除第一个元素之外的所有元素，cay/myapp\n```\n\n`Path` 接口扩展了 `Iterable<Path>`，因此你可以使用增强型\
  \ `for` 循环遍历 `Path` 的名称组件：\n\n```java\nfor (Path component : path) {\n    ...\n\
  }\n```\n\n![Image](img/00003.jpeg) 注意\n\n有时你可能需要与传统的 `File` 类进行操作，而不是 `Path` 接口。\n\
