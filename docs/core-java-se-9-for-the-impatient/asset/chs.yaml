  \n## 第 15 章 Java 平台模块系统\n\n* * *\n\n本章主题\n\n151 模块概念\n152 模块命名\n153 “Hello, World!”\
  \ 程序\n154 模块模块\n155 导出包\n156 模块与反射访问\n157 模块化 JAR\n158 自动模块与未命名模块\n159 用于迁移的命令行标记\n\
  1510 传递性和静态需求\n1511 限定导出与打开\n1512 服务加载\n1513 模块操作工具\n1514 练习\n\n\n\n\n\n12. 在迁移现有应用程序时，你可能需要使用命令行选项来覆盖访问限制。\n\
  \n13. `jdeps` 工具分析给定 JAR 文件的依赖关系。`jlink` 工具生成一个具有最少依赖的应用程序。\n\n## 15.1 模块概念\n\n\
  在面向对象编程中，基本的构建单元是 `class`（类）。类提供了封装。私有特性（private features）只能由具有显式权限的代码访问，即该 `class`\
  \ 的方法。这使得访问推理变得可能。如果一个私有变量发生了变化，你可以列出所有可能的“罪魁祸首”。如果你需要修改私有表示，你清楚哪些方法受了影响。\n\n在 Java\
  \ 中，包（packages）提供了更更大的组织分组。包是类的集合。包也提供了一种级别的封装。任何具有包级访问权限（既不是公共的也非私有的）的特性都只能从同一个包中的方法访问。\n\
  \n然而，在大型系统中，这种级别的访问控制是不够的。任何公共特性（即 public features，即可以在包外部访问的特性）在任何地方都是可用的。假设你想修改或丢弃一个很少使用的特性。一旦它是公共的，就没有办法可以推断该更改的影响。\n\
  \n这就是 Java 平台设计者所面临的情况。在二十多年里，JDK 飞速增长，但显然某些特性本质上已经过时了。大家最喜欢的例子是 CORBA。你上一次使用它是什么时候？然而，`org.omg.corba`\
  \ 包随每个 JDK 一起发布。事实上，将所有的 CORBA 放入一个 JAR 文件中并不困难，这样那些少数仍然需要的人就可以使用它。\n\n`java.awt`\
  \ 又是呢？它在服务端应用程序中不应该是必要的，对吧？除非 `java.awt.DataFlavor` 类被用于 SOAP（一种基于 XML 的网络服务协议）的实现中。\n\
  \nJava 平台设计者面对巨大的代码乱团，决定他们需要一种提供更多控制的结构化机制。他们查看了现有的模块系统（如 OSGi），发现它们不适合他们的问题。相反，他们设计了一个新系统，称为\
  \ Java 平台模块系统（Java Platform Module System），它现在是 Java 语言和虚拟机的一部分。该系统已成功用于将 Java API\
  \ 模块化，如果你愿意，也可以将其用于你自己的应用程序。\n\n一个 Java 平台模块由：\n\n- 包的集合\n- 可选的资源文件和其他文件（如原生库）\n\
  - 模块中可访问的包列表\n- 该模块所依赖的所有模块的列表\n\nJava 平台在编译时和虚拟机中强制封装和依赖关系。\n\n为什么你应该考虑为你自己的程序使用\
  \ Java 平台模块系统，而不是遵循在类路径上使用 JAR 文件的传统方法？有两个优势：\n\n1. **强封装**：你可以控制哪些包是可访问的，你不必担心维护那些你并不打算让给公开使用的代码。\n\
  2. **可靠的配置**：你避免了常见的类路径问题，例如重复或缺失的类。\n\n存在一些 Java 平台模块系统没有解决的问题，例如模块的版本控制。它不支持指定需要哪个版本的模块，也不支持在同一个程序中使用多个版本的模块。这些可能是令人青睐的特性，但如果你需要它们，就必须使用\
  \ Java 平台模块系统以外的机制。\n\n## 15.2 模块命名\n\n模块是包的集合。模块中的包名不需要相互相关。例如，模块 `java.sql` 包含包\
  \ `java.sql`、`javax.sql` 和 `javax.transaction.xa`。此外，正如从这个示例所示，模块名与包名相同是完全可以的。\n\
  \n就像包名一样，模块名由字母、数字、下划线和点组成。同样，与包名一样，模块之间没有层级关系。如果你有一个模块 `com.horstmann` 和另一个模块 `com.horstmann.corejava`，从模块系统的角度来看，它们是无关的。\n\
  \n在为他人创建一个模块模块时，其名称在全局范围内是唯一的至关重要。预计大多数模块名将遵循“反向域名”约定，就像包名一样。\n\n最简单的方法是以该模块提供的顶层包来命名模块。例如，SLF4J\
  \ 日志门面有一个名为 `org.slf4j` 的模块，包含包 `org.slf4j`、`org.slf4j.spi`、`org.slf4j.event` 和\
  \ `org.slf4j.helpers`。\n\n这种约定防止了模块中的包名冲突。任何给定的包只能被放在一个模块中。如果你的模块名是唯一的，且你的包名以模块名开头，那么你的包名也将是唯一的。\n\
  \n对于不打算让其他程序员使用的模块，可以使用较短的模块名，例如包含应用程序的模块。仅仅为了说明这是可行的，我将在本章中这样做。包含可能的库代码的模块将具有如\
  \ `com.horstmann.greet` 之类的名称，而包含程序（带有 `main` 方法类的）的模块将具有如 `ch15.sec03` 这样引目的名称。\n\
  \n***\n\n![图像](img/00003.jpeg) 注意\n\n你只在模块声明中使用模块名。在你的 Java 类的源文件中，你永远不会引用模块名。相反，你像过去以来一样使用包名。\n\
  \n***\n\n## 15.3 模块化的“Hello, World!”\n\n让我们把传统的“Hello, World!”程序放入模块中。首先，我们需要将类放入包中——未命名包无法包含在模块中。如下所示：\n\
  \n```java\npackage com.horstmann.hello;\n\npublic class HelloWorld {\n    public\
  \ static void main(String[] args) {\n        System.out.println(\"Hello, World!\"\
  );\n    }\n}\n```\n\n到目前为止还没有变化。为了制作 `ch15.sec03`，你需要添加模块声明。你将其放在名为 `module-info.java`\
  \ 的文件中，位于基础目录（即包含 `com` 目录的目录）。按照约定，基础目录的名字与模块名相同。\n\n```\nch15.sec03/\n└── module-info.java\n\
  └── com/\n    └── horstmann/\n        └── hello/\n            └── HelloWorld.java\n\
  ```\n\n`module-info.java` 文件包含模块声明：\n\n```java\nmodule ch15.sec03 {\n\n}\n```\n\n\
  这个模块声明是空的，因为该模块没有提供任何内容也不需要任何内容。\n\n现在像往一样编译：\n\n```bash\njavac 15.sec03/module-info.java\
  \ 15.sec03/com/horstmann/hello/HelloWorld.java\n```\n\n`module-info.java` 文件看起来不像\
  \ Java 源文件，而且不能有一个名为 `module-info` 的类，因为类名不能包含连字符。`module` 关键字以及你在后续章节中看到的 `requires`、`exports`\
  \ 等，都是“限制关键字”，它们只在模块声明中具有特殊含义。该文件被编译成类文件 `module-info.class`，以二进制形式包含模块定义。要要作为模块化应用程序运行此程序，你需要指定*模块路径*，它与类路径类似，但包含的是模块。你还需要以\
  \ `modulename`/classname` 的格式指定主类：\n\n```bash\njava --module-path 15.sec03 --module\
  \ 15.sec03/com.horstmann.hello.HelloWorld\n```\n\n除了 `--module-path` 和 `--module`，你可以使用单字母选项\
  \ `-p` 和 `-m`。\n\n\n\n\n\n点击此处查看代码图片\n\n```\njava -p ch15.sec03 -m ch15.sec03/com.horstmann.hello.HelloWorld\n\
  ```\n\n无论何种方式，都会出现 `\"Hello, Modular World!\"` 欢迎语，这表明你已经成功实现了第一个应用程序的模块化。\n\n***\n\
  \n![Image](img/00003.jpeg) 注意\n\n当你编译此模块时，会得到两个警告：\n\n点击此处查看代码图片\n\n```\nwarning:\
  \ [module] module name component sec03 should avoid terminal digits\nwarning: [module]\
  \ module name component ch15 should avoid terminal digits\n```\n\n这些警告旨在劝阻程序员在模块名称中添加版本号。你可以忽略它们，或者使用注解来抑制它们：\n\
  \n```java\n@SuppressWarnings(\"module\")\n\nmodule ch15.sec03 {\n\n}\n```\n\n在这一点上，`module`\
  \ 声明与类声明一样：你可以对其进行注解。（注解的类型目标必须是 `ElementType.MODULE`。）\n\n### 15.4 Require 模块\n\
  \n让我们创建一个新模块 `ch15.sec04`，在其中程序使用 `JOptionPane` 来显示“Hello, Modular World!”消息：\n\n\
  点击此处查看代码图片\n\n```java\npackage com.horstmann.hello;\n\nimport javax.swing.JOptionPane;\n\
  \npublic class HelloWorld {\n    public static void main(String[] args) {\n    \
  \    JOptionPane.showMessageDialog(null, \"Hello, Modular World!\");\n    }\n}\n\
  ```\n\n现在编译会失败，并显示此消息：\n\n点击此处查看代码图片\n\n```\nerror: package javax.swing is not visible\n\
  \  (package javax.swing is declared in module java.desktop,\n    but module ch15.sec04\
  \ does not read it)\n```\n\nJDK 已经模块化了，`javax.swing` 包现在包含在 `java.desktop` 模块中。我们的模块需要声明它依赖于该模块：\n\
  \n```java\nmodule ch15.sec04 {\n    requires java.desktop;\n}\n```\n\n模块系统的设计目标之一是让模块显式地声明其需求，这样虚拟机就可以在启动程序之前确保所有需求都已满足。\n\
  \n在前面的节中，并没有出现显式需求的情况，因为我们只使用了 `java.lang` 包。这个包包含在 `java.base` 模块中，而该模块是默认需要的。\n\
  \n注意，我们的 `ch15.sec04` 模块只列出了自己的模块需求。它需要 `java.desktop` 模块以便使用 `javax.swing` 包。`java.desktop`\
  \ 模块本身声明它需要另外三个模块，即 `java.datatransfer`、`java.prefs` 和 `java.xml`。\n\n图 15-1 显示了*模块图*，其节点是模块。图的边边（即连接节点的箭头）要么是声明的需求，要么是在未声明时对\
  \ `java.base` 的隐式需求。\n\n![Image](img/01123.jpeg)\n\n**图 15-1** Swing “Hello, Modular\
  \ World!”应用程序的模块图\n\n模块图中不能存在循环。也就是说，一个模块不能直接或间接地引用自身。\n\n模块不会自动将访问权限传递给其他模块。在我们的示例中，`java.desktop`\
  \ 模块声明它需要 `java.prefs`，而 `java.prefs` 模块声明它需要 `java.xml`。这并没有赋予 `java.desktop` 使用\
  \ `java.xml` 模块包的权利。它需要显式声明该需求。用数学术语来说，`requires` 关系不是“传递的”。通常情况下这种行为是理想的，因为它使需求变得显式，但正如你在\
  \ 15.10 节中所示，“传递性和静态需求](#part0035.html_ch15lev1sec10)”（第 487 页），在某些情况下你可以放松它。\n\n\
  ***\n\n![Image](img/00003.jpeg) 注意\n\n本节开头的错误消息指出，我们的 `ch15.sec04` 模块没有“读取” `java.desktop`\
  \ 模块。在 Java 平台模块系统的术语中，模块 M 在以下情况下*读取*模块 N：\n\n1. M 需要 N。\n2. M 需要一个传递需要 N 的模块（参见\
  \ 15.10 节，“传递性和静态需求”，第 487 页）。\n3. N 是 M 或 `java.base`。\n\n***\n\n### 15.5 Export\
  \ 包\n\n在前面的节中，你看到如果模块想要使用另一个模块的包，必须需要该模块。然而，这并不会自动让所有包可用。模块使用 `exports` 关键字声明哪些包是可访问的。例如，这里是模块的一部分：\n\
  \n点击此处查看代码图片\n\n```java\nmodule module.name {\n    exports package.name;\n}\n```\n\
  \n让我们准备一个简单的场景。我们将代码放入 `com.horstmann.greet` 模块。第一个包中有一个公共的 `Greeter` 接口。\n\n点击此处查看代码图片\n\
  \n```java\npackage com.horstmann.greet;\n\npublic interface Greeter {\n    static\
  \ Greeter newInstance() {\n        return new com.horstmann.greet.internal.GreeterImpl();\n\
  \    }\n    String greet(String subject);\n}\n```\n\n第二个包有一个实现该接口的类。由于它在第一个包中，它是公共的。\n\
  \n点击此处查看代码图片\n\n```java\npackage com.horstmann.greet.internal;\n\nimport com.horstmann.greet.Greeter;\n\
  \npublic class GreeterImpl implements Greeter {\n    public String greet(String\
  \ subject) {\n        return \"Hello, \" + subject + \"!\";\n    }\n}\n```\n\n`com.horstmann.greet`\
  \ 模块包含了两个包，但只导出第一个：\n\n点击此处查看代码图片\n\n```java\nmodule com.horstmann.greet {\n   \
  \ exports com.horstmann.greet;\n}\n```\n\n第二个包在模块外部是不可见的。我们将应用程序放入第二个模块中，该模块需要第一个模块：\n\
  \n点击此处查看代码图片\n\n```java\nmodule ch15.sec05 {\n    requires com.horstmann.greet;\n\
  }\n```\n\n***\n\n![Image](img/00003.jpeg) 注意\n\n`exports` 语句后面跟着包名，而 `requires`\
  \ 后面跟着模块名。\n\n***\n\n我们的应用程序现在使用 `Greeter` 来获取欢迎语：\n\n点击此处查看代码图片\n\n```java\npackage\
  \ com.horstmann.hello;\n\nimport com.horstmann.greet.Greeter;\n\npublic class HelloWorld\
  \ {\n    public static void main(String[] args) {\n```\n\n\n\n\n```java\nGreeter\
  \ greeter = Greeter.newInstance();\n\nSystem.out.println(greeter.greet(\"Modular\
  \ World\"));\n\n}\n\n}\n```\n\n这是这两个模块的源文件结构：\n\n点击此处查看代码图片\n\n```text\ncom.horstmann.greet\n\
  ├ module-info.java\n└ com\n  └ horstmann\n    └ greet\n      ├ Greeter.java\n  \
  \    └ internal\n        └ GreeterImpl.java\n\nch15.sec05\n├ module-info.java\n\
  └ com\n  └ horstmann\n    └ hello\n      └ HelloWorld.java\n```\n\n要构建此应用程序，首先编译\
  \ `com.horstmann.greet` 模块：\n\n点击此处查看代码图片\n\n```bash\njavac com.horstmann.greet/module-info.java\
  \ \\\n    com.horstmann.greet/com/horstmann/greet/Greeter.java \\\n    com.horstmann.greet/com/horstmann/greet/internal/GreeterImpl.java\n\
  ```\n\n然后，在模块路径上包含第一个模块的情况下，编译应用程序模块：\n\n点击此处查看代码图片\n\n```bash\njavac -p com.horstmann.greet\
  \ ch15.sec05/module-info.java \\\n    ch15.sec05/com/horstmann/hello/HelloWorld.java\n\
  ```\n\n最后，在模块路径上同时包含两个模块的情况下运行程序：\n\n点击此处查看代码图片\n\n```bash\njava -p ch15.sec05:com.horstmann.greet\
  \ \\\n    -m ch15.sec05/com.horstmann.hello.HelloWorld\n```\n\n你现在已经看到了 Java 平台模块系统的骨干\
  \ `requires` 和 `exports` 语句。正如你所见，模块系统在概念上是简单的。模块指定了它们需要的模块，以及它们向其他模块提供的哪些包。第 15.11\
  \ 节“限定导出与打开”（第 489 页）显示了 `exports` 语句的一种细微变化。\n\n***\n\n![Image](img/00007.jpeg)\
  \ 注意事项\n\n模块并不提供作用域。你不能在不同的模块中拥有同名的包。这即使对于隐藏包（即未被导出的包）也是如此。\n\n### 15.6 模块与反射访问\n\
  \n在上一个节节中，你看到模块系统强制执行了封装。模块只能访问来自另一个模块的显式导出的包。在过去，总是可以通过使用反射来绕过这些烦人的访问限制。正如你在第 4\
  \ 章中看到的，反射可以访问任何类的私有成员。\n\n然而，在模块化世界中，情况不再如此了。如果一个类位于模块内部，对非公共成员的反射访问将失败。具体来说，回想一下我们是如何访问私有字段的：\n\
  \n点击此处查看代码图片\n\n```java\nField f = obj.getClass().getDeclaredField(\"salary\");\n\
  \nf.setAccessible(true);\n\ndouble value = f.getDouble(obj);\n\nf.setDouble(obj,\
  \ value * 1.1);\n```\n\n除非安全管理器不允许对私有字段的访问，否则 `f.setAccessible(true)` 的调用是成功的。然而，使用安全管理器运行\
  \ Java 应用程序并不常见，而且有很多库都使用了反射访问。典型的例子是对象关系映射器（ORM），如 JPA，它们会自动将对象持久化到数据库中。\n\n如果你使用使用这样的库，并且也想使用模块，你必须非常小心。为了演示这个问题，我将使用\
  \ JAXB 代替 JPA。（JPA 不是 Java SE 的一部分，但 JAXB 是，至少目前是这样——它的模块已被弃用）。JAXB 可以将任意对象转换为 XML，反之也可以将\
  \ XML 转回对象。你使用注解来引导这一过程。这里有一个说明该机制的简单类：\n\n点击此处查看代码图片\n\n```java\npackage com.horstmann.places;\n\
  \nimport javax.xml.bind.annotation.XmlElement;\nimport javax.xml.bind.annotation.XmlRootElement;\n\
  \n@XmlRootElement\npublic class Country {\n\n    @XmlElement private String name;\n\
  \    @XmlElement private double area;\n\n    public Country() {}\n\n    public Country(String\
  \ name, double area) {\n        this.name = name;\n        this.area = area;\n \
  \   }\n    // ...\n}\n```\n\n`@XmlRootElement` 注解表示该类的对象可以格式化（或“封化”）为 XML，而 `@XmlElement`\
  \ 注解应用于应该包含的字段上。这里有一个演示如何将对象转换为 XML 的简短程序：\n\n点击此处查看代码图片\n\n```java\npackage com.horstmann.places;\n\
  import javax.xml.bind.JAXBContext;\nimport javax.xml.bind.JAXBException;\nimport\
  \ javax.xml.bind.Marshaller;\n\npublic class Demo {\n    public static void main(String[]\
  \ args) throws JAXBException {\n        Country belgium = new Country(\"Belgium\"\
  , 30510.0);\n        JAXBContext context = JAXBContext.newInstance(Country.class);\n\
  \        Marshaller m = context.createMarshaller();\n        m.setProperty(Marshaller.JAXB_FORMATTED_OUTPUT,\
  \ true);\n        m.marshal(belgium, System.out);\n    }\n}\n```\n\n当你运行该程序时，它输出：\n\
  ```xml\n<country>\n  <name>Belgium</name>\n  <area>30510.0</area>\n</country>\n\
  ```\n\n正如你所看到的，你不需要做任何事情就能让它工作（由于有很多使用反射的库，这些细节对它们来说并不重要）。现在让我们把 `Country` 和 `Demo`\
  \ 类放在模块内部。这样做之后，`Demo` 程序将报错异常：\n\n点击此处查看代码图片\n\n```text\nException in thread \"\
  main\" java.lang.reflect.InaccessibleObjectException:\n  Unable to make field private\
  \ com.horstmann.places.Country.name accessible:\n  module 15.sec06 does not \"open\
  \ com.horstmann.places\"\n```\n\n当然，在纯理论上，违反封装是错误的。但像 XML 绑定或对象关系映射这样的机制非常常见，模块系统必须适应它们。\n\
  \n使用 `opens` 关键字，模块可以 `open` 一个包，从而允许运行时对该包中的所有类型和成员进行反射访问。这里是我们的模块需要做的：\n\n点击此处查看代码图片\n\
  \n```java\nmodule 15.sec06 {\n    requires java.xml.bind;\n    opens com.horstmann.places;\n\
  }\n```\n\n有了这种更改，JAXB 将正常工作。\n\n模块可以被声明为 `open`，例如\n\n```java\nopen module 15.sec06\
  \ {\n    requires java.xml.bind;\n}\n```\n\n一个开放模块授予其所有包的运行时访问，就像所有包都已声明了 `exports`\
  \ 和 `opens` 一样。然而，在编译时只有显式导出的包是可用的。开放模块将模块系统的编译时安全性与传统的宽松行为结合在一起。\n\n\n\n\n```java\n\
  Class<?> cl = obj.getClass();\nField field = cl.getDeclaredField(fieldName);\nVarHandle\
  \ handle = MethodHandles.privateLookupIn(cl, lookup)\n    .unreflectVarHandle(field);\n\
  return handle.get(obj);\n```\n\n只要 `Lookup` 对象是在具有访问该字段权限的模块中生成的，这种方法就能生效。模块中的某些方法简单地调用\
  \ `MethodHandles.lookup()`，它会产生一个封装了调用者访问权限的对象。通过这种方式，一个模块可以为另一个模块提供访问私有成员的权限。实际问题在于如何以最少的麻烦来授予这些权限。\n\
  \n### 15.7 模块化 JAR (Modular JARs)\n\n到目前为止，我们只是简单地将模块编译到源码的目录树中。显然，这对于部署来说是不满意的。相反，模块可以通过将其所有的类放置在一个\
  \ JAR 文件中来部署，并在根目录下包含一个 `module-info.class`。这样的 JAR 文件被称为*模块化* JAR。\n\n要创建一个模块化\
  \ JAR 文件，你可以像往常一样使用 `jar` 工具。如果你有多个包，最好使用 `-d` 选项进行编译，它会将类文件放入单独的目录中。如果目录不存在，则会创建。然后使用\
  \ `jar` 命令的 `-C` 选项在收集文件时切换到该目录。\n\n点击此处查看代码图\n\n```\njavac -d modules/com.horstmann.greet\
  \ `find com.horstmann.greet -name *.java`\njar -cvf com.horstmann.greet.jar -C modules/com.horstmann.greet\
  \ .\n```\n\n如果你使用 Maven、Ant 或 Gradle 等构建工具，只需像往常一样继续构建你的 JAR 文件即可。只要包含了 `module-info.class`，你就能得到一个模块化\
  \ JAR。\n\n然后你可以将该模块化 JAR 包含模块路径（module path），模块就会被加载。\n\n![Image](img/00007.jpeg)\
  \ 注意\n\n在过去，一个包的类有时分布在多个 JAR 文件中。（这样的包被称为“拆分包”（split package）。）这可能从不是一个好主意，而且在模块中是不行的。\n\
  \n与普通 JAR 文件一样，你可以在模块化 JAR 中指定主类：\n\n点击此处查看代码图\n\n```\njavac -p com.horstmann.greet.jar\
  \ -d modules/ch15.sec05 `find ch15.sec05 -name *.java`\njar -c -v -f ch15.sec05.jar\
  \ -e com.horstmann.hello.HelloWorld -C modules/ch15.sec05 .\n```\n\n当启动程序时，你需要指定包含主类的模块：\n\
  \n点击此处查看代码图\n\n```\njava -p com.horstmann.greet.jar:ch15.sec05.jar -m ch15.sec05\n\
  ```\n\n在创建 JAR 文件时，你可以可选地指定一个版本号。使用 `--module-version` 参数，并在 JAR 文件名中添加 `@` 和版本号：\n\
  \n点击此处查看代码图\n\n```\njar -c -v -f com.horstmann.greet@1.0.jar --module-version 1.0\
  \ -C modules.horstmann.greet .\n```\n\n正如已经讨论过的，Java 平台模块系统（Java Platform Module\
  \ System）并不使用版本号来解析模块，但可以通过其他工具和框架进行查询。\n\n![Image](img/00003.jpeg) 注意\n\n你可以通过反射\
  \ API 获取版本号。在我们的示例中：\n\n点击此处查看代码图\n\n```java\nOptional<String> version = Greeter.class.getModule().getDescriptor().rawVersion();\n\
  ```\n\n返回一个包含版本字符串 `\"1.0\"` 的 `Optional`。\n\n![Image](img/00003.jpeg) 注意\n\n等同于类加载器的模块是*层*layer）。Java\
  \ 平台模块系统将 JDK 模块和应用模块加载到*启动层*boot layer）中。程序可以使用层 API（本书未涵盖）加载其他模块。这样的程序可能会考虑模块版本。预计\
  \ Java EE 应用服务器等程序的开发者将利用层 API 为模块提供支持。\n\n![Image](img/00009.jpeg) 提示\n\n如果你想将一个模块加载到\
  \ JShell，请将 JAR 包含模块路径并使用 `--add-modules` 选项：\n\n点击此处查看代码图\n\n```bash\njshell --module-path\
  \ com.horstmann.greet@1.0.jar \\\n    --add-modules com.horstmann.greet\n```\n\n\
  ### 15.8 自动模块与未命名模块\n\n向模块的迁移计划是一个伟大的社会实验，没有人知道它是否会有良好的结果。在你将第三方 JAR 放在模块路径上之前，请检查它们是否是模块化的，如果不是，检查它们的清单文件（manifest）是否包含模块名称。如果没有，你仍然可以将该\
  \ JAR 转换为自动模块。\n\n如果你将一个 JAR 放在模块路径上但没有 `module-info.class`，它被称为*自动模块*（automatic\
  \ module）。自动模块具有以下属性：\n\n1. 它隐式地对所有其他模块拥有 `requires` 语句。\n2. 它的所有包都是导出（exported）并开放（opened）。\n\
  3. 如果清单文件中有 `Automatic-Module-Name` 条目，则该值成为模块名称。\n4. 否则，模块名称从 JAR 名称获取，删除任何版本号并将非字母数字字符替换为点。\n\
  \n前两条规则意味着自动模块就像在类路径上一样。假设你正在实现一个处理 CSV 文件并使用 Apache CSV 库的模块。你想在你的 `module-info.java`\
  \ 中表示你的模块依赖 Apache CSV。如果你将 `commons-csv-1.4.jar` 添加到模块路径，那么它的名称就是 `commons.csv`，因为结尾的版本号\
  \ `-1.4` 被删除了，非字母数字字符 `-` 被替换为点。\n\n由于 CSV 是广为人知的，其他人不太尝试使用相同的名称，但如果该 JAR 的维护者能尽快约定一个反向\
  \ DNS 名称，最好是顶层包名 `org.apache.commons.csv` 作为模块名称更好。他们只需要在 JAR 内部的 `META-INF/MANIFEST.MF`\
  \ 文件中添加一行：\n\n点击此处查看代码图\n\n```\nAutomatic-Module-Name: org.apache.commons.csv\n\
  ```\n\n最终，他们可能会通过添加预留模块名称的 `module-info.java` 将该 JAR 文件转换为真正的模块，所有使用该名称引用 CSV 模块的其他模块都将继续工作。\n\
  \n![Image](img/00003.jpeg) 注意\n\n向模块的迁移计划是一个伟大的社会实验，没有人知道它是否会有良好的结果。在你将第三方 JAR 放在模块路径上之前，请检查它们是否是模块化的，如果不是，检查它们的清单文件是否包含模块名称。如果没有，你仍然可以将该\
  \ JAR 转换为自动模块，但要准备更新模块名称。\n\n任何不在模块路径上的类都属于*未命名模块*（unnamed module）的一部分。技术上，可能存在多个未命名模块，但它们所有合在一起的行为就像一个单一模块，而这个模块被称为*唯一的*未命名模块（the\
  \ unnamed module）。与自动模块一样，未命名模块可以访问所有其他模块，而且它的所有包都是导出并开放的。\n\n\n\n\n然而，`no named\
  \ module` 可以访问未命名模块。因此，迁移到 Java 平台模块系统必然是一个自下而上的过程。Java 平台本身已经模块化。接下来，你对库进行模块化，可以使用自动模块，也可以将它们转换为真正的模块。一旦应用程序使用的所有库都完成了模块化，你就可以将应用程序的代码转换为一个模块。\n\
  \n### 15.9 用于迁移的命令行标志\n\n即使你的程序没有使用模块，在运行 Java 9 及更高版本时，你也无法逃避模块化世界。即使应用程序代码位于未命名模块的类路径上，并且所有包都已导出并开放，它仍然会与模块化的\
  \ Java 平台进行交互。\n\n在 Java 9 中，默认行为是允许非法的模块访问，但在每次发生违规行为时会在控制台上显示警告。在 Java 的未来版本中，默认行为将发生变化，非法访问将被拒绝。为了给你留出准备这一变化的时间，你应该使用\
  \ `--illegal-access` 标志来测试你的应用程序。共有四种可能的设置：\n\n1. `--illegal-access=permit` 是 Java\
  \ 9 的默认行为，在第一次非法访问时打印消息。\n2. `--illegal-access=warn` 在每次非法访问时都打印消息。\n3. `--illegal-access=debug`\
  \ 在每次非法访问时打印消息和堆栈跟踪。\n4. `--illegal-access=deny` 是未来的默认行为，拒绝所有的非法访问。\n\n现在是使用 `--illegal-access=deny`\
  \ 进行测试的时候了，这样当该行为成为默认值时，你已经准备好了。\n\n考虑一个使用了不再可访问的内部 API 的应用程序，例如 `com.sun.rowset.CachedRowSetImpl`。最好的解决办法是更改实现。（从\
  \ Java 7 开始，你可以从 `RowSetProvider` 获取缓存行集。）但假设你无法访问源代码。\n\n在这种情况下，使用 `--add-exports`\
  \ 标志启动应用程序。指定你想要导出的模块和包，以及你想要将该包导出的模块（在我们的案例中，它是未命名模块）。\n\n点击此处查看代码图像\n\n```\njava\
  \ --illegal-access=deny --add-exports java.sql.rowset/com.sun.rowset=ALL_UNNAMED\
  \ \\\n    -jar MyApp.jar\n```\n\n现在假设你的应用程序使用反射来访问私有字段或方法。未命名模块内部的反射是可以的，但不再能够通过反射访问\
  \ Java 平台类的非公共成员了。例如，某些动态生成 Java 类的库通过反射调用了受保护的 `ClassLoader.defineClass` 方法。如果应用程序使用了此类库，请添加标志：\n\
  \n点击此处查看代码图像\n\n```\n--add-opens java.base/java.lang=ALL-UNNAMED\n```\n\nJava SE\
  \ 平台中的少数模块不在 `java.se` 聚合模块中，它们默认是不可访问的。这些模块是 `java.activation`、`java.corba`、`java.transaction`、`java.xml.bind`、`java.xml.ws`、`java.xml.ws.annotation`，包含了\
  \ Java EE 规范的包。Java EE 服务器包含了这些包。如果 Java 平台中存在冲突的包，它们在 Java 9 下将无法启动。\n\n你只需要在模块描述符中要求它们，就可以在模块化应用程序中使用这些模块。但如果应用程序没有模块化且你需要其中之一，则必须显式地添加它。在编译和运行程序时使用\
  \ `--add-module` 标志：\n\n点击此处查看代码图像\n\n```\njava --illegal-access=deny --add-module\
  \ java.xml.bind -jar MyProg.java\n```\n\n***\n\n![图像](img/00003.jpeg) 注意事项\n\n`java.activation`、`java.corba`、`java.transaction`、`java.xml.bind`、`java.xml.ws`\
  \ 和 `java.xml.ws.annotation` 模块在 Java 9 中被弃用，并可能在未来的版本中从 Java SE 平台移除。\n\n***\n\n\
  在添加所有这些选项以让遗留应用程序运行时，你可能会得到一个“地狱命令行”。为了更好地管理大量选项，你可以将选项放在一个或多个文件中，并使用 `@` 前缀指定这些文件。例如，\n\
  \n点击此处查看代码图像\n\n```\njava @options1 @options2 -jar MyProg.java\n```\n\n其中文件 `options1`\
  \ 和 `options2` 包含 `java` 命令的选项。\n\n选项文件有一些语法规则：\n\n- 使用空格、制表符或换行符分隔选项。\n- 对包含空格的参数使用双引号，例如\
  \ `\"Program Files\"`。\n- 以 `\\` 结尾的行将与下一行合并。\n- 反斜杠必须转义，例如 `C:\\\\Users\\\\Fred`。\n\
  - 注释行以 `#` 开头。\n\n### 15.10 传递和静态需求\n\n在第 15.4 节中，“要求模块](#part0035.html_ch15lev1sec4)”（第\
  \ 474 页），你已经看到了 `requires` 语句的基本形式。在本节中，你将看到两种非常有用的变体。\n\n在某些情况下，对于给定模块的用户来说，声明所有模块可能是繁琐的。考虑一个包含\
  \ Java 接口元素的 `javafx.controls` 模块。`javafx.controls` 需要 `javafx.base`，任何使用 `javafx.controls`\
  \ 的地方都需要它。（如果没有 `javafx.base`，你将无法使用 `Button` 等界面。）因此，`javafx.controls` 模块使用 `transitive`\
  \ 修饰符声明了该需求：\n\n```\nmodule javafx.controls {\n    requires transitive javafx.base;\n\
  }\n```\n\n任何声明 `javafx.controls` 的模块现在都会需要 `javafx.base`。\n\n***\n\n![图像](img/00003.jpeg)\
  \ 注意\n\n有些程序员建议当公共 API 使用另一个模块的包时，始终使用 `requires transitive`。但这并不是 Java 的规则。考虑例如\
  \ `java.sql` 模块：\n\n点击此处查看代码图像\n\n```\nmodule java.sql {\n    requires transitive\
  \ java.logging;\n}\n```\n\n在整个 `java.sql` API 中，只有一处使用了 `java.logging` 模块的包，即 `java.sql.Driver.parentLogger`\
  \ 方法，它返回一个 `java.util.logging.Logger`。将此模块需求声明为传递是完全可以接受的。这样只有那些使用该方法的模块才需要声明它们需要\
  \ `java.logging`。\n\n***\n\n`requires transitive` 语句的一个有力用法是*聚合*模块——一个没有包且只有传递性需求的模块。这样一个模块就是\
  \ `java.se` 模块，声明如下：\n\n点击此处查看代码图像\n\n```\nmodule java.se {\n    requires transitive\
  \ java.compiler;\n    requires transitive java.datatransfer;\n    requires transitive\
  \ java.desktop;\n    ...\n    requires transitive java.sql;\n    requires transitive\
  \ java.sql.rowset;\n    requires transitive java.xml;\n    requires transitive java.xml.crypto;\n\
  }\n```\n\n对细粒度模块依赖感兴趣的程序员可以简单地要求 `java.se` 并获取 Java SE 平台的所有模块。\n\n最后，还有一种不常见的 `requires\
  \ static` 变体，它表示模块在编译时存在但在运行时是可选的。有两个用例：\n\n1. 访问在编译时处理并声明在不同模块中的注解。\n2. 如果不同模块中的类可用，则使用它，否则执行其他操作，例如：\n\
  \n点击此处查看代码图像\n\n```java\ntry {\n    new oracle.jdbc.driver.OracleDriver();\n}\n\
  ```\n\n\n\n\n```java\n} catch (NoClassDefFoundError er) {\n    // 执行其他操作\n}\n```\n\
  \n### 15.11 限定的导出与打开\n\n在本节中，你将看到 `exports` 和 `opens` 语句的变体，它们将作用范围缩小到指定的模块集合。例如，`javafx.base`\
  \ 模块包含如下语句：\n\n点击此处查看代码图像\n\n```java\nexports com.sun.javafx.collections to\n  \
  \  javafx.controls, javafx.graphics, javafx.fxml, javafx.swing;\n```\n\n这样的语句被称为**限定导出**（qualified\
  \ export）。列出的模块可以访问该包，但其他模块则无法访问。\n\n过度使用限定导出可能表明模块化结构不佳。尽管如此，在对现有代码库进行模块化时，这些情况可能会出现。在这里，Java\
  \ 平台的设计者将 JavaFX 的代码分成了多个模块，这是一个好主意，因为并不是所有的 JavaFX 都需要 FXML 或 Swing 的互操作性。然而，JavaFX\
  \ 的实现者在代码中大量使用了内部类，如 `com.sun.javafx.collections.ListListenerHelper`。在一个全新的项目（greenfield\
  \ project）中，可以设计一个更健壮的公共 API。\n\n同样，你可以将 `opens` 语句限制为特定的模块。例如，在第 15.6 节，“模块与反射访问](#part0035.html_ch15lev1sec6)”（第\
  \ 479 页），我们本可以使用限定的 `opens` 语句，如下：\n\n点击此处查看代码图像\n\n```java\nmodule ch15.sec06 {\n\
  \    requires java.xml.bind;\n    opens com.horstmann.places to java.xml.bind;\n\
  }\n```\n\n现在，`com.horstmann.places` 包仅对 `java.xml.bind` 模块开放。\n\n诚然，将对特定持久化机制的依赖放在模块描述符中显得相当脆弱。相反，你可以将所有需要持久化的类放在一个单独的包中并将该包开放给所有模块，以便任何持久化机制都能访问它。\n\
  \n### 15.12 服务加载\n\n`ServiceLoader` 类（参见第 4.4.5 节，“服务加载器](#part0013.html_ch04lev2sec26),”第\
  \ 166 页）提供了一种用于匹配服务接口与实现类的轻量级机制。Java 平台模块系统使得使用这种机制变得更容易。\n\n这里是对服务加载的简要回顾。一个服务有一个接口和一个或多个可能的实现。这里有一个简单接口的简单示例：\n\
  \n点击此处查看代码图像\n\n```java\npublic interface GreeterService {\n    String greet(String\
  \ subject);\n    Locale getLocale();\n}\n```\n\n一个或多个模块提供实现，例如：\n\n点击此处查看代码图像\n\n\
  ```java\npublic class FrenchGreeter implements GreeterService {\n    public String\
  \ greet(String subject) { return \"Bonjour \" + subject; }\n    public Locale getLocale()\
  \ { return Locale.FRENCH; }\n}\n```\n\n服务消费者必须根据它认为合适的任何标准，从所有提供的实现中选择一个实现。\n\n\
  点击此处查看代码图像\n\n```java\nServiceLoader<GreeterService> greeterLoader = ServiceLoader.load(GreeterService.class);\n\
  GreeterService chosenGreeter;\nfor (GreeterService greeter : greeterLoader) {\n\
  \    if (...) {\n        chosenGreeter = greeter;\n    }\n}\n```\n\n在过去，实现是通过在包含实现类的\
  \ JAR 文件的 `META-INF/services` 目录中放置文本文件提供的。模块系统提供了一种更好的方法。不再使用文本文件，而是向模块描述符中添加语句。\n\
  \n提供服务实现的模块会添加 `provides` 语句，列出服务接口（可能定义在任何模块中）和实现类（必须是该模块的一部分）。\n\n `jdk.security.auth`\
  \ 模块中的示例如下：\n\n点击此处查看代码图像\n\n```java\nmodule jdk.security.auth {\n    ...\n    provides\
  \ javax.security.auth.spi.LoginModule with\n        com.sun.security.auth.module.Krb5LoginModule,\n\
  \        com.sun.security.auth.module.UnixLoginModule,\n        com.sun.security.auth.module.JndiLoginModule;\n\
  }\n```\n等待，提供的文本末尾有一些碎片化的部分。让我们重新正确格式化最后一个块：\n\n```java\nmodule jdk.security.auth\
  \ {\n    ...\n    provides javax.security.auth.spi.LoginModule with\n        com.sun.security.auth.module.Krb5LoginModule,\n\
  \        com.sun.security.auth.module.UnixLoginModule,\n        com.sun.security.auth.module.JndiLoginModule,\n\
  }\n```\n\n\n\n\n最后，`jmod` 工具用于构建和检查 JDK 包含的模块文件。当你查看 JDK 内部的 `jmods` 目录时，你会发现每个模块都有一个扩展名为\
  \ `jmod` 的文件。不再有 `rt.jar` 文件了。\n\n与 JAR 文件一样，这些文件包含类文件。此外，它们还可以包含原生代码库、命令、头文件、配置文件和法律公告。JMOD\
  \ 文件使用 ZIP 格式。你可以使用任何 ZIP 工具检查其内容。\n\n与 JAR 文件不同，JMOD 文件仅用于链接；也就是说，用于生成运行时镜像。除非你也想将二进制文件（如原生代码库）与你的模块打包在一起，否则你不需要生成\
  \ JMOD 文件。\n\n***\n\n![Image](img/00003.jpeg) 注意\n\n由于 Java 9 不再包含 `rt.jar` 和 `tools.jar`\
  \ 文件，你需要更新对这些文件的任何引用。例如，如果你在安全策略策略文件中引用了 `tools.jar`，请将其更改为对模块的引用：\n\n点击此处查看代码图像\n\
  \n```java\ngrant codeBase \"jrt:/jdk.compiler\" {\n    permission java.security.AllPermission;\n\
  };\n```\n\n`jrt:` 语法表示 Java 运行时文件。\n\n***\n\n## 练习\n\n1. “受限关键字” `module`、`exports`、`requires`、`uses`、`to`\
