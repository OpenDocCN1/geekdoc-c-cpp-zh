  \   // 找到从 `a[i]` 开始的最大非递减后缀\n    var i = a.length - 1\n    while (i > 0 && a[i\
  \ - 1] >= a[i]) i--\n    if (i > 0) {\n        // 交换 `a[i - 1]` 与右侧的 `a[k] > a[i\
  \ - 1]`\n        // 注意到 `a[i] > a[i - 1]`\n        var k = a.length - 1\n      \
  \  while (a[k] <= a[i - 1]) k--\n        swap(a, i - 1, k)\n    } // 否则，后缀是整个数组\n\
