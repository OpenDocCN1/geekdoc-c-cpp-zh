  \ `Math` 类的静态方法和静态变量：\n\n点击此处查看代码图像\n\n```java\nr = sqrt(pow(x, 2) + pow(y, 2));\
  \ // 即 `Math.sqrt`, `Math.pow`\n```\n\n你也可以导入特定的静态方法或变量：\n\n点击此处查看代码图像\n\n```java\n\
  import static java.lang.Math.sqrt;\nimport static java.lang.Math.PI;\n```\n\n![Image](img/00003.jpeg)\
