  \ 1.4.4 节，“数字类型转换](#part0007.html_ch01lev2sec15)），例如，`(byte) 127`。\n\n## 1.2.2 浮点类型\n\
  \n浮点类型用于带有小数部分的数字。浮点类型所示于表 1-2。\n\n**表 1-2 浮点类型**\n\n| **类型** | **存储需求** | **范围（包含边界）**\
  \ |\n| :--- | :--- | :--- |\n| `float` | 4 字节 | ±1.4E-45 到 ±3.4E+38 |\n| `double`\
  \ | 8 字节 | ±1.8E-308 到 ±1.8E+308 |\n\n## 1.2.3 char 类型\n\n`char` 类型描述 Java 使用的 UTF-16\
  \ 字符编码中的“代码单元”。细节具有很的技术性——请见第 1.5 节，“字符串](#part0007.html_ch01lev1sec5)”（24 页）。你可能不会频繁使用\
  \ `char` 类型。\n\n\n\n偶尔，你可能会遇到用单引号括的字符字面量。例如，`'J'` 是值为 `74`（或十六进制 `4A`）的字符字面量，它是表示\
  \ Unicode 字符“U+004A 拉丁大写字母 J”的代码单元。代码单元可以用十六进制表示，并带有 `\\u` 前缀。例如，`'\\u004A'` 与 `'J'`\
  \ 相同。一个更奇特的例子是 `'\\u263A'`，它是 ![Image](img/00008.jpeg)，“U+263A 白色的微笑脸”的代码单元。\n\n\
  特殊代码 `'\\n'`、`'\\r'`、`'\\t'`、`'\\b'` 分别表示换行符、回车、制表符和退格符。\n\n使用反斜杠来转义单引号 `'\\''`\
  \ 和反斜杠 `'\\\\'`。\n\n## 1.2.4 `boolean` 类型\n\n`boolean` 类型有两个值：`false` 和 `true`。\n\
  \n在 Java 中，`boolean` 类型不是数字类型。`boolean` 值与整数 `0` 和 `1` 之间没有关系。\n\n## 1.3 变量\n\n\
  在后续章节中，你将学习如何声明和初始化变量以及常量。\n\n### 1.3.1 变量声明\n\nJava 是一种强类型语言。每个变量只能持有特定类型的值。当你声明变量时，需要指定类型、名称以及一个可选的初始值。例如：\n\
  \n```java\nint total = 0;\n```\n\n你可以在一个语句中声明多个相同类型的变量：\n\n点击此处查看代码\n\n```java\n\
  int total = 0, count; // `count` 是一个未初始化的整数\n```\n\n大多数 Java 程序员倾向于为每个变量使用单独声明。\n\
  \n考虑这个变量声明：\n\n点击此处查看代码\n\n```java\nRandom generator = new Random();\n```\n\n在这里，对象的类名出现了两次。第一个\
  \ `Random` 是变量 `generator` 的类型。第二个 `Random` 是 `new` 表达式的一部分，用于构造该类的对象。\n\n### 1.3.2\
  \ 名称\n\n变量的名称（以及方法或类的名称）必须以字母开头。它可以由任何字母、数字以及符号 `_` 和 `$` 组成。然而，`$` 符号用于自动生成的名称，你不应该在自己的命名中使用它。最后，单独的\
  \ `_` 本身不是有效的变量名。\n\n在这里，字母和数字可以来自任何字母表，而不只是拉丁字母。例如，`π` 和 `élévation` 都是有效的变量名。大小写是敏感的：`count`\
  \ 和 `Count` 是不同的名称。\n\n你不能在名称中使用空格或符号。最后，你不能使用如 `double` 等关键字作为名称。\n\n按照习惯，变量和方法的名称以小写字母开头，类的名称以大写字母开头。Java\
  \ 程序员喜欢“驼峰命名法”（camel case），即当名称由多个单词组成时使用大写字母，例如 `countOfInvalidInputs`。\n\n###\
  \ 1.3.3 初始化\n\n在方法中声明变量时，必须在使用它之前对其进行初始化。例如，以下代码会导致编译时错误：\n\n点击此处查看代码\n\n```java\n\
  int count;\ncount++; // 错误—使用了未初始化的变量\n```\n\n编译器必须能够验证变量在使用之前已已初始化。例如，以下代码也是错误：\n\
  \n点击此处查看代码\n\n```java\nint count;\nif (total == 0) {\n    count = 0;\n} else {\n\
  \    count++; // 错误—`count` 可能未初始化\n}\n```\n\n你允许在方法内的任何地方声明变量。尽可能晚地声明变量（即在第一次需要它之前）被认为是一种良好的编程风格。例如：\n\
  \n点击此处查看代码\n\n```java\nScanner in = new Scanner(System.in); // 读取输入请参见第 1.6.1 节\n\
  System.out.println(\"How old are you?\");\nint age = in.nextInt();\n```\n\n变量是在其初始值可用点声明的。\n\
  \n### 1.3.4 常量\n\n`final` 关键字表示一个一旦赋值就不能更改的值。在其他语言中，人们会将此类值称为常量。例如：\n\n```java\n\
  final int DAYS_PER_WEEK = 7;\n```\n\n按照习惯，常量名称使用大写字母。\n\n你也可以使用 `static` 关键字在方法之外声明常量：\n\
  \n点击此处查看代码\n\n```java\npublic class Calendar {\n    public static final int DAYS_PER_WEEK\
  \ = 7;\n    ...\n}\n```\n\n然后该常量可以在多个方法中使用。在 `Calendar` 内部，引用 `DAYS_PER_WEEK`。在另一个类中使用它，请引用\
  \ `Calendar.DAYS_PER_WEEK`。\n\n![Image](img/00003.jpeg) Note\n\n（注：提供的原文在最后部分存在大量重复干扰，已清理以维护\
  \ Java 常量和运算符的语义。）\n\n## 1.4 算术运算\n\nJava 使用与任何 C 语言类似的熟悉运算符（参见表 1-3）。我们将在后续章节中回顾它们。\n\
  \n（表格内容根据来源重建）\n\n![Image](img/00003.jpeg) Note\n\n在此表中，运算符按优先级递减列出。例如，由于 `+` 的优先级高于\
  \ `<<`，`3 + 4 << 5` 的值为 `(3 + 4) << 5`。如果运算符是*左结合*的，则它从左到右分组。例如，`3 - 4 - 5` 意味着\
  \ `(3 - 4) - 5`。但 `-=` 是右结合的，`i -= j -= k` 意味着 `i -= (j -= k)`。\n\n### 1.4.1 赋值\n\
  \n表格最后一行显示了赋值运算符。语句\n\n`x = expression;` 将 `x` 设置为右侧的值，替换旧值。当 `=` 前有运算符时，该运算符会将左右结合并将结果赋值。例如：\n\
  \n`amount -= 10;`\n\n等同于\n\n`amount = amount - 10;`\n\n### 1.4.2 基础算术\n\n加法、减法、乘法和除法由\
  \ `+ - * /` 表示。例如，`2 * n + 1` 意味着乘以 `2` 和 `n` 并加 `1`。\n\n\n\n\n你需要小心使用 `/` 运算符。如果两个操作数都是整数类型，它表示整数除法，舍弃余数。例如，`17\
  \ / 5` 的结果是 `3`，而 `17.0 / 5` 的结果是 `3.4`。\n\n整数除零会产生异常，如果没有捕获，将终止你的程序。（有关异常处理的更多信息请参见第\
  \ 5 章。）浮点数除零会产生无限值或 `NaN`（参见第 1.2.2 节，“浮点类型](#part0007.html_ch01lev2sec5)”第 12 页），而不会引发异常。\n\
  \n`%` 运算符产生余数。例如，`17 % 5` 的结果是 `2`，即 17 减去 15（能够“容纳”17 的 5 的最大整数倍数）后剩余的数量。如果 `a\
  \ % b` 的余数为 0，则 `a` 是 `b` 的整数倍。\n\n一个常见的用途是测试整数是否为偶数。如果 `n` 是偶数，表达式 `n % 2` 为 `0`。如果\
  \ `n` 是奇数呢？如果 `n` 为正数，`n % 2` 为 `1`；如果 `n` 为负数，则为 `-1`。这种对负数的处理在实践中并不理想。在使用可能为负的操作数使用\
  \ `%` 时务必小心。\n\n考虑这个问题：你计算时时针的位置。应用了一个调整，你想将其归一化为 0 到 11 之间的数字。这很容易：`(position +\
  \ adjustment) % 12`。但如果 `adjustment` 让位置变成了负数呢？你可能会得到负数。所以你必须引入分支，或者使用 `((position\
  \ + adjustment) % 12 + 12) % 12`。无论哪种方法，都很麻烦。\n\n***\n\n![Image](img/00009.jpeg)\
  \ 提示\n\n在这种情况下，使用 `Math.floorMod` 方法更简单：`Math.floorMod(position + adjustment, 12)`\
  \ 总是产生 `0` 到 `11` 之间的值。\n\n遗憾的是，`floorMod` 对负除数会给出负结果，但这种情况在实践中并不经常发生。\n\n***\n\n\
  Java 拥有递和和减少运算符：\n\n```java\nn++; // 给 `n` 加 1\nn--; // 从 `n` 减 1\n```\n\n与其他基于\
  \ C 的语言一样，这些运算符也有前置形式。`n++` 和 `++n` 都会增加变量 `n` 的值，但它们在在表达式内部使用时的值不同。第一种形式产生增加之前的值，第二种形式产生增加之后的值。例如，\n\
  \n```java\nString arg = args[n++];\n```\n\n这会将 `arg` 设置为 `args[n]`，*然后*增加 `n`。这在三十年前是有意义的，因为当时的编译器优化代码方面做得并不好。如今，使用两个独立的语句没有性能上的缺陷，许多程序员发现显式形式更易读。\n\
  \n***\n\n![Image](img/00003.jpeg) 注意\n\nJava 编程语言的目标之一是可移植性。无论由哪个虚拟机执行，计算都应该产生相同的结果。然而，许多现代处理器使用超过\
  \ 64 位的浮点寄存器以增加精度并减少计算中间步骤中溢出的风险。Java 允许这些优化，否则浮点运算将更慢且更不准确。对于少数关注此问题的用户，有一个 `strictfp`\
  \ 修饰符。当它被添加到方法时，该方法中的所有浮点操作都是严格可移植的。\n\n***\n\n#### 1.4.3 数学方法\n\n没有用于计算幂的运算符。相反，调用\
  \ `Math.pow` 方法：`Math.pow(x, y)` 产生 `x^(y)`。要计算 `x` 的平方根，调用 `Math.sqrt(x)`。\n\n\
  这些是*静态*方法，不作用于对象。与 `static` 常数一样，你需要在声明它们的类名前加上类名。\n\n`Math.min` 和 `Math.max` 用于计算两个值的最小值和值也非常有用。\n\
  \n此外，`Math` 类还提供了三角函数、对数函数以及常量 `Math.PI` 和 `Math.E`。\n\n***\n\n![Image](img/00003.jpeg)\
  \ 注意\n\n`Math` 类提供了几种方法来使整数运算更安全。当计算溢出时，数学运算符会静默地返回错误的结果。例如，十亿乘以三（`1000000000 *\
  \ 3`）的结果为 `-1294967296`，因为最大的 `int` 值略大于二十亿。如果你改为调用 `Math.multiplyExact(1000000000,\
  \ 3)`，则会产生异常。你可以捕获该异常或让程序终止，而不是带有错误的结果静默继续。还有 `addExact`、`subtractExact`、`incrementExact`、`decrementExact`、`negateExact`\
  \ 方法，它们都有 `int` 和 `long` 参数。\n\n***\n\n一些数学方法在其他类中。例如，`Integer` 和 `Long` 类中有 `compareUnsigned`、`divideUnsigned`\
  \ 和 `remainderUnsigned` 方法用于处理无符号值。\n\n如所述，某些用户需要严格的浮点计算，即使它们的效率较低。`StrictMath`\
  \ 类提供了这些实现。\n\n#### 1.4.4 数字转换\n\n当运算符结合不同类型时，数字会被转换为公共类型：\n\n1. 如果操作数之一是 `double`，另一个转换为\
  \ `double`。\n2. 如果操作数之一是 `float`，另一个转换为 `float`。\n3. 如果操作数之一是 `long`，另一个转换为 `long`。\n\
  4. 否则，都转换为 `int`。\n\n例如，在 `3 + 14` 中，结果被转换为 `int`。\n\n要进行不在这些范围内的转换，使用强制转换运算符：括号中的目标类型名称。例如，\n\
  \n```java\ndouble x = 3.75;\nint n = (int) x;\n```\n\n在这种情况下，小数部分被丢弃，`n` 被设置为 `3`。如果你想舍入到最近的整数，请使用\
  \ `Math.round` 方法。该方法返回 `long`。\n\n```java\nint n = (int) Math.round(x);\n```\n\n\
  在我们的示例中，`x` 为 `3.75`，`n` 被设置为 `4`。\n\n要将整数类型转换为另一个字节更少的类型，也使用强制转换：\n\n```java\n\
  int n = 1;\nchar next = (char)('J' + n); // 将 75 转换为 'K'\n```\n\n在这样的强制转换中，只保留最后的字节。\n\
  \n```java\nint n = (int) 3000000000L; // 将 `n` 设置为 -1294967296\n```\n\n从整数类型转换为浮点类型总是合法的，但可能会丢失信息。\n\
  \n![Image](img/00007.jpeg)\n\n如果你担心强制转换会静默丢数字的重要部分，请改用 `Math.toIntExact` 方法。当它无法将\
  \ `long` 转换为 `int` 时，会发生异常。\n\n#### 1.4.5 关系和逻辑运算符\n\n`==` 和 `!=` 运算符测试相等性。例如，当\
  \ `n` 不为零时，`n != 0` 为 `true`。\n\n\n\n\n\n还有常用的 `<`（小于）、`>`（大于）、`<=`（小于等于）和 `>=`（大于或））运算符。\n\
  \n你可以将 `boolean` 类型的表达式与 `&&`（与）、`||`（或）和 `!`（非）运算符结合。例如：\n\n```\n0 <= n && n <\
  \ length\n```\n\n如果 `n` 位于零（包含）和 `length`（不包含）之间，则结果为 `true`。\n\n如果第一个条件为 `false`，则第二个条件将不会被求值。这种“短路”求值在第二个条件可能导致错误时非常有用。考虑以下条件：\n\
  \n点击此处查看代码图片\n\n```\nn != 0 && s + (100 - s) / n < 50\n```\n\n如果 `n` 为 0，那么包含除以\
  \ `n` 操作的第二个条件永远不会被求值，因此不会发生错误。\n\n短路求值也用于“或”操作，但只要操作数为 `true`，求值就会停止。例如，以下计算的结果：\n\
  \n点击此处查看代码图片\n\n```\nn == 0 || s + (100 - s) / n >= 50\n```\n\n如果 `n` 为 0，结果为 `true`，同样不会求值第二个条件。\n\
  \n最后，`conditional`（三元）运算符接受三个操作数：一个条件和两个值。如果条件为 `true`，结果为第一个值；否则为第二个值。例如：\n\n```\n\
  time < 12 ? \"am\" : \"pm\"\n```\n\n如果 `time < 12`，结果为字符串 `\"am\"`；否则结果为字符串 `\"\
  pm\"`。\n\n***\n\n![Image](img/00003.jpeg) 注意\n\n还有与逻辑运算符相关的 `bitwise` 位运算符 `&`（与）、`|`（或）和\
  \ `^`（异异）。它们作用于整数的位模式。例如，由于 `0xF` 的二进制数字为 `0...01111`，`n & 0xF` 产生 `n` 的低四位，`n =\
  \ n | 0xF` 将低四位设置为 1，而 `n = n ^ 0xF` 则翻转这些位。与 `!` 运算符对应的是 `~`，它会翻转其参数的所有位：`~0xF`\
  \ 是 `1...10000`。\n\n还有将位模式向左或向右移动的运算符。例如，`0xF << 2` 的二进制数字为 `0...0111100`。有两种右移运算符：`>>`\
  \ 将符号位扩展到高位，而 `>>>` 则用零填充高位。如果你在程序中进行位操作，你就知道这意味着什么。如果没有，你就不需要这些运算符。\n\n***\n\n\
  ***\n\n![Image](img/00007.jpeg) 警告\n\n如果左侧是 `int`，则位移运算符的右侧参数数将对 32 取模；如果左侧是 `long`，则对\
  \ 64 取模。例如，`1 << 35` 的值与 `1 << 3` 或 `8` 相同。\n\n***\n\n***\n\n![Image](img/00009.jpeg)\
  \ 提示\n\n`&`（与）和 `|`（或）运算符在应用于 `boolean` 值时，强制在合并结果之前对两个操作数进行求值。这种用法非常罕。只要右侧没有副作用，它们的作用与\
  \ `&&` 和 `||` 一样，只是效率较低。如果你确实需要强制对第二个操作数进行求值，请将其赋值给一个 `boolean` 变量，以便执行流清晰可见。\n\n\
  ***\n\n#### 1.4.6 大数\n\n如果基本类型整数和浮点数的精度不足，你可以转向 `java.math` 包中的 `BigInteger` 和 `BigDecimal`\
  \ 类。这些类的对象表示具有任意长度数字序列的数字。`BigInteger` 类实现了任意精度的整数算术，而 `BigDecimal` 对浮点数执行相同的操作。\n\
  \n静态方法 `valueOf` 可将 `long` 转换为 `BigInteger`：\n\n点击此处查看代码图片\n\n```\nBigInteger n\
  \ = BigInteger.valueOf(876543210123456789L);\n```\n\n你也可以从数字字符串构造 `BigInteger`：\n\
  \n点击此处查看代码图片\n\n```\nBigInteger k = new BigInteger(\"9876543210123456789\");\n```\n\
  \n存在预定义的常量 `BigInteger.ZERO`、`BigInteger.ONE`、`BigInteger.TWO` 和 `BigInteger.TEN`。\n\
  \nJava 不允许对象使用运算符，因此你必须使用方法调用来处理大数。\n\n点击此处查看代码图片\n\n```\nBigInteger r = BigInteger.valueOf(5).multiply(n.add(k));\
  \ // r = 5 * (n + k)\n```\n\n在 1.2 中，你看到 `Double.valueOf(0.1).add(Double.valueOf(0.2))`\
  \ 的结果是 `0.3000000000000004` 而不是 `0.3`。这就是为什么财务计算应使用 `BigDecimal`。\n\n## 1.5 字符串\n\
  \n字符串是字符序列。在 Java 中，字符串可以包含任何 Unicode 字符。\n\n### 1.5.1 拼接\n\n使用 `+` 运算符拼接两个字符串。例如：\n\
  \n```\nString greeting = \"Hello \" + \"World\";\n```\n\n将 `greeting` 设置为 `\"Hello\
  \ World\"`。\n\n将字符串与另一个值拼接时，该值会被转换为字符串。例如：\n\n```java\nint age = 42;\nString output\
  \ = \"Age: \" + age;\n```\n\n`output` 为 `\"Age: 42\"`。\n\n***\n\n要带分隔符组合多个字符串，使用\
  \ `join` 方法：\n\n```\nString names = String.join(\", \", \"Peter\", \"Paul\", \"\
  Mary\");\n```\n\n`names` 为 `\"Peter, Paul, Mary\"`。\n\n### 1.5.2 子字符串\n\n要分解字符串，使用\
  \ `substring` 方法。例如：\n\n```\nString greeting = \"Hello, World!\";\nString location\
  \ = greeting.substring(7, 12);\n```\n\n`location` 为 `\"World\"`。\n\n`substring`\
  \ 方法的第一个参数是要提取的子字符串的起始位置。位置从 0 开始。\n\n第二个参数是不包含在子字符串中的第一个位置。在我们的示例中，`greeting` 的位置\
  \ 12 是 `!`。\n\n有时，你想从字符串中提取所有由分隔符分隔的子字符串。`split` 方法执行该任务，返回子字符串数组。\n\n```\nString\
  \ names = \"Peter, Paul, Mary\";\nString[] result = names.split(\", \");\n```\n\n\
  `result` 是包含三个字符串的数组 `[\"Peter\", \"Paul\", \"Mary\"]`。\n\n\n\n\n\n分隔符可以是任何正则表达式（参见第\
  \ 9 章）。例如，`input.split(\"\\\\s+\")` 会在空白字符处将 `input` 分割。\n\n### 1.5.3 字符串比较\n\n\
  要检查两个字符串是否相等，请使用 `equals` 方法。例如：\n\n```java\nlocation.equals(\"World\")\n```\n\n\
  如果 `location` 实际上是字符串 `\"World\"`，则返回 `true`。\n\n***\n\n![Image](img/00007.jpeg)\
  \ 注意\n\n永远不要使用 `==` 运算符来比较字符串。这种比较\n\n点击此处查看代码图片\n\n```java\nlocation == \"World\"\
  \ // 千别这样做！\n```\n\n只有当 `location` 和 `\"World\"` 是*内存中的同一个对象*时，结果才会为 `true`。在虚拟机中，每个字面量字符串只有一个实例，因此\
  \ `\"World\" == \"World\"` 将为 `true`。但如果 `location` 是通过计算得到的，例如：\n\n点击此处查看代码图片\n\
  \n```java\nString location = greeting.substring(7, 12);\n```\n\n那么结果将被放入一个单独的 `String`\
  \ 对象中，比较 `location == \"World\"` 将返回 `false`！\n\n***\n\n和任何对象变量一样，`String` 变量可以为\
  \ `null`，这表示该变量没有引用任何对象，甚至不是空字符串。\n\n```java\nString middleName = null;\n```\n\n\
  要测试一个对象是否为 `null`，确实可以使用 `==` 运算符：\n\n```java\nif (middleName == null) ...\n```\n\
  \n注意 `null` 不同于空字符串 `\"\"`。空字符串是一个长度为零的字符串，而 `null` 并不是任何字符串。\n\n***\n\n![Image](img/00007.jpeg)\
  \ 注意\n\n在 `null` 上调用任何方法会导致“空指针异常”。像所有异常一样，如果你不显式地处理它，它将终止你的程序。\n\n***\n\n***\n\n\
  ![Image](img/00009.jpeg) 提示\n\n在将字符串与字面量字符串比较时，将字面量放在前面是一个好主意：\n\n```java\nif (\"\
  World\".equals(location)) ...\n```\n\n即使 `location` 为 `null`，这个测试也能正常工作。\n\n***\n\
  \n要不区分大小地比较两个字符串，请使用 `equalsIgnoreCase` 方法。例如：\n\n点击此处查看代码图片\n\n```java\n\"world\"\
  .equalsIgnoreCase(location);\n```\n\n如果 `location` 是 `\"World\"`、`\"world\"`、`\"\
  WORLD\"` 等，则返回 `true`。\n\n有时，需要对字符串进行排序。`compareTo` 方法告诉你一个字符串在字典顺序上是否在另一个字符串之前。调用\n\
  \n```java\nfirst.compareTo(second)\n```\n\n如果 `first` 在 `second` 之前，返回一个负整数（不一定是\
  \ `-1`）；如果 `first` 在 `second` 之后，返回一个正整数（不一定是 `1`）；如果它们相等相等，则返回 `0`。\n\n字符串是逐字符进行比较的，直到其中一个用尽了字符或发现不匹配。例如，在比较\
  \ `\"word\"` 和 `\"world\"` 时，前三个字符是相同的。由于 `d` 的 Unicode 值小于 `l` 的 Unicode 值，因此 `\"\
  word\"` 靠前。调用 `\"word\".compareTo(\"world\")` 返回 `-8`，这是 `d` 和 `l` 的 Unicode 值之间的差值。\n\
  \n这种比较对人类来说可能是不直观的，因为它取决于字符的 Unicode 值。`\"blue/green\"` 在 `\"bluegreen\"` 之前，因为\
  \ `/` 的 Unicode 值恰好小于 `g`。\n\n***\n\n![Image](img/00009.jpeg) 提示\n\n在对人类可读字符串进行排序时，请使用了解特定语言排序规则的\
  \ `Collator` 对象。更多信息请参见第 13 章。\n\n***\n\n### 1.5.4 数字与字符串之间的转换\n\n要将整数转换为字符串，请调用静态方法\
  \ `Integer.toString`：\n\n点击此处查看代码图片\n\n```java\nint n = 42;\nString str = Integer.toString(n);\
  \ // 将 str 设置为 \"42\"\n```\n\n该方法的变体有一个第二个参数，基数（在 `2` 到 `36` 之间）：\n\n点击此处查看代码图片\n\
  \n```java\nString str2 = Integer.toString(n, 2); // 将 str2 设置为 \"101010\"\n```\n\
  \n***\n\n![Image](img/00003.jpeg) 注意\n\n将整数转换为字符串的更简单方法是与空字符串拼接：`\"\" + n`。有些人认为这种方法很丑，而且效率略低。\n\
  \n***\n\n相反，要将包含整数的字符串转换为数字，请使用 `Integer.parseInt` 方法：\n\n点击此处查看代码图片\n\n```java\n\
  String str = \"101010\";\nint n = Integer.parseInt(str);\n```\n\n对于浮点数，使用 `Double.toString`\
  \ 和 `Double.parseDouble`：\n\n```java\nString str = Double.toString(3.14);\ndouble\
  \ x = Double.parseDouble(str);\n```\n\n### 1.5.5 String API\n\n正如你预期的，`String` 类有许多方法。其中一些实用的方法如表\
  \ 4 所示。\n\n**表 4 有用的 String 方法**\n\n| 方法 | 目的 |\n| :--- | :--- |\n| `boolean startsWith(String\
  \ str)` `boolean endsWith(String str)` `boolean contains(CharSequence str)` | 检查字符串是否以、结尾或包含指定的字符串。\
  \ |\n| `int indexOf(String str)` `int lastIndexOf(String str)` `int indexOf(String\
  \ str, int fromIndex)` `int lastIndexOf(String str, int fromIndex)` | 获取字符串第一次或最后一次出现的位置，从\
  \ `fromIndex` 开始搜索。如果未找到则返回 `-1`。 |\n| `String replace(CharSequence oldString, CharSequence\
  \ newString)` | 返回一个将所有 `oldString` 替换为 `newString` 的字符串。 |\n| `String toUpperCase()`\
  \ `String toLowerCase()` | 返回一个由原字符串字符转换为大写或小写的字符串。 |\n| `String trim()` | 返回一个删除了所有前后空格的字符串。\
  \ |\n\n注意在 Java 中，`String` 类是*不可变*的。也就是说，没有任何 `String` 方法会修改它们操作的字符串。例如：\n\n```java\n\
  greeting.toUpperCase()\n```\n\n返回一个新的字符串 `\"HELLO, WORLD!\"` 而不会改变 `greeting`。\n\
  \n此外注意某些方法的参数是 `CharSequence`。这是 `String`、`StringBuilder` 以及其他字符序列的通用父类型。\n\n有关每个方法的详细说明，请访问在线\
  \ API 文档 [`docs.oracle.com/javase/9/docs/api`](http://docs.oracle.com/javase/9/docs/api)。在搜索框中输入类名并选择匹配的类型（在这种情况下为\
  \ `java.lang.String`），如图 1-4 所示。\n\n![Image](img/00010.jpeg)\n\n**图 1-4 搜索 API 文档**\n\
  \n然后你将得到一个记录每个方法的页面（如图 1-5 所示）。\n\n![Image](img/00011.jpeg)\n\n**图 1-5 API 文档中的\
  \ String 方法**\n\n在本书中，我没有详细介绍 API，因为浏览 API 文档更方便。如果你并不总是连接互联网，可以下载并解压文档进行离线查看。\n\
  \n#### 1.5.6 代码点与代码单元\n\n\n\n\n\n当 Java 刚创建时，它自豪地拥抱了不久前开发的 `Unicode` 标准。`Unicode`\
  \ 标准的设计是为了解决字符编码中一个棘手的问题。在 `Unicode` 之前，存在许多不兼容的字符编码。对于英语，世界几乎统一对 7 位 `ASCII` 标准达成共识，该标准为所有英文字母、阿拉伯数字和许多符号分配了\
  \ `0` 到 `127` 之间的代码。在西欧，`ASCII` 被扩展为 8 位代码，包含了诸如 `ä` 和 `é` 等带重音的字符。但在俄罗斯，`ASCII`\
  \ 被扩展到 `128` 到 `255` 的位置以包含西里尔字母。在日本，则使用了变长度编码来处理英语和日语字符。其他所有国家都采取了类似的做法。交换不同编码的文件是一个重大问题。\n\
  \n`Unicode` 旨在通过为人类设计过的所有文字系统中的每个字符分配一个 `0` 到 `65535` 之间的唯一 16 位代码来解决所有这些问题。`1991`\
  \ 年，`Unicode 1.0` 发布，使用了可用 `65536` 个代码值中略于一半的。`Java` 从底层就被设计为使用 16 位 `Unicode` 字符，这与使用\
  \ 8 位字符的其他编程语言相比是一个巨大的进步。但随后发生了一些尴尬的事。字符数量比以前估计的要多得多——大部分是汉字。这使得 `Unicode` 远远超出了\
  \ 16 位代码的范围。\n\n如今，`Unicode` 需要 21 位。每个有效的 `Unicode` 值都被称为一个 `code point`（代码点）。例如，字母\
  \ `A` 的代码点是 `U+0041`，而八元数集的数学符号 ![Image](img/00012.jpeg)（[`math.ucr.edu/home/baez/octonions`](http://math.ucr.edu/home/baez/octonions)）的代码点为\
  \ `U+1D546`。\n\n有一种向后兼容的变长度编码，称为 `UTF-16`，它用单个 16 位值表示所有“经典” `Unicode` 字符，并将 `U+FFFF`\
  \ 之外的字符表示为从代码空间中一个称为“代理字符”（surrogate characters）的特殊区域取的 16 位值对。在这种编码中，字母 `A` 是 `\\\
  u0041`，而 ![Image](img/00012.jpeg) 是 `\\ud835\\udd46`。\n\n`Java` 的痛苦在于它出生于 16 位到\
  \ 21 位过渡的时期。`Java` 字符串并不是纯净的 `Unicode` 字符或代码点的序列，而是 `code units`（代码单元）的序列，即 `UTF-16`\
  \ 编码中的 16 位单元。\n\n如果你不需要担心汉字，并且愿意为了像 ![Image](img/00012.jpeg) 这样的特殊字符而“不计代价”，那么你可以接受\
  \ `String` 是 `Unicode` 字符序列的这种幻觉。在这种情况下，你可以通过以下方式获取第 `i` 个字符：\n\n```java\nchar ch\
  \ = str.charAt(i);\n```\n\n获取字符串的长度为：\n\n```java\nint length = str.length();\n```\n\
  \n但如果你想正确地处理字符串，你就必须付出更多努力。\n\n要获取第 `i` 个 `Unicode` 代码点，请调用\n\n点击此处查看代码图像\n\n```java\n\
  int codePoint = str.codePointAt(str.offsetByCodePoints(0, i));\n```\n\n代码点的总数是：\n\
  \n点击此处查看代码图像\n\n```java\nint length = str.codePointCount(0, str.length());\n```\n\
  \n这个循环顺序提取代码点：\n\n点击此处查看代码图像\n\n```java\nint i = 0;\nwhile (i < s.length()) {\n\
  \    int j = s.offsetByCodePoints(i, 1);\n    String codePoint = str.substring(i,\
  \ j);\n    ...\n    i = j;\n}\n```\n\n或者，你可以使用 `codePoints` 方法，它会产生一个 `int` 值的 `stream`（流），每个值对应一个代码点。我们将在第\
  \ 8 章中讨论流。你可以这样将流转换为数组：\n\n点击此处查看代码图像\n\n```java\nint[] codePoints = str.codePoints().toArray();\n\
  ```\n\n***\n\n![Image](img/00003.jpeg) 注意\n\n在过去，字符串在内部始终以 `UTF-16` 编码表示，即 `char`\
  \ 值的数组。现在，`String` 对象尽可能使用 `ISO-8859-1` 字符的 `byte` 数组。`Java` 的未来版本可能会切换到内部使用 `UTF-8`。\n\
  \n***\n\n## 1.6 输入和输出\n\n为了让示例程序更有趣，它们应该能够与用户交互。在接下来的章节中，你将看到如何读取终端输入以及如何产生格式化输出。\n\
  \n### 1.6.1 输入\n\n如何读取终端输入并产生格式化输出。在下面的章节中，你将看到如何读取终端输入以及如何产生格式化输出。\n\n当你调用 `System.out.println`\
  \ 时，输出被发送到标准输出并显示在终端窗口。从标准输入流读取并不简单。为了读取字符串和数字，构造一个连接到 `System.in` 的 `Scanner`：\n\
  \n```java\nScanner in = new Scanner(System.in);\n```\n\n读取单单词使用 `next()`。\n\n读取整数使用\
  \ `nextInt()`。\n\n```java\nSystem.out.print(\"Your age: \");\nint age = in.nextInt();\n\
  ```\n\n然后光标停留在提示符后面而不是换行。同样，`nextDouble` 方法检查是否有行、整数或浮点数。\n\n```java\nif (in.hasNextInt())\
  \ {\n    int age = in.nextInt();\n}\n```\n\n`Scanner` 类位于 `java.util` 包中。为了使用该类，在程序顶部添加：\n\
  \n```java\nimport java.util.Scanner;\n```\n\n***\n\n![Image](img/00003.jpeg) 注意\n\
  \n读取密码时你不想使用 `Scanner` 类，因为输入是可见的。相反，使用 `Console` 类：\n\n```java\nConsole terminal\
  \ = System.console();\nString username = terminal.readLine(\"User name: \");\nchar[]\
  \ passwd = terminal.readPassword(\"Password: \");\n```\n\n密码以字符数组的形式返回。这比将密码存储在\
  \ `String` 中稍微安全，因为你可以在完成后覆盖数组。\n\n***\n\n***\n\n![Image](img/00009.jpeg) 提示\n\n\
  如果你想从文件读取输入或向文件输出，可以使用 shell 的重定向语法：\n\n```bash\njava mypackage.MainClass < input.txt\
  \ > output.txt\n```\n\n现在 `System.in` 从 `input.txt` 读取，`System.out` 写入 `output.txt`。你将在第\
  \ 9 章](#part0023.html_ch09)看到如何执行更通用的文件输入输出。\n\n***\n\n### 1.6.2 格式化输出\n\n你已经见过\
  \ `System.out` 对象的 `println` 方法用于输出一行。还有一个 `print` 方法，它不会换行。该方法经常用于输入提示：\n\n```java\n\
  System.out.print(\"Your age: \");\nint age = in.nextInt();\n```\n\n然后光标停留在提示符后面而不是换行。\n\
  \n当你用 `print` 或 `println` 打印分数时，除了末尾的零以外的所有数字都会被显示。例如：\n\n```java\nSystem.out.print(1000.0\
  \ / 3.0);\n```\n\n打印 333.3333333333333\n\n如果你想显示例如美元和分，这就会一个问题。要限制位数，使用 `printf`\
  \ 方法：\n\n```java\nSystem.out.printf(\"%8.2f\", 1000.0 / 3.0);\n```\n\n\n\n\n\n格式字符串\
  \ `\"%8.2f\"` 表示以 8 的字段宽度和 2 位精度打印浮点数。也就是说，输出结果将包含两个前导空格和六个字符：\n\n```\n  333.33\n\
  ```\n\n你可以为 `printf` 提供多个参数。例如：\n\n点击此处查看代码图片\n\n```java\nSystem.out.printf(\"Hello,\
  \ %s. Next year, you'll be %d.\\n\", name, age);\n```\n\n每个以 `%` 字符开头的格式化说明符都会被相应的参数替换。格式化说明符结尾的转换字符表示要格式化的值的类型：`f`\
  \ 是浮点数，`s` 是字符串，`d` 是十进制整数。表 1-5 显示了所有的转换字符。\n\n### 表 1-5 格式化输出的转换字符\n\n| 转换字符 |\
