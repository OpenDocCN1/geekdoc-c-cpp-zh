ge#part0009.html_p083pro01a)![Image#part0009.html_p084pro01a)![Image#part0009.html_p085pro01a)![Image#part0009.html_p085pro02a)![Image#part0009.html_p085pro03a)![Image#part0009.html_p085pro04a)![Image#part0009.html_p086pro01a)![Image#part0009.html_p086pro02a)![Image#part0009.html_p086pro03a)![Image#part0009.html_p087pro01a)![Image#part0009.html_p087pro02a)![Image#part0009.html_p087pro03a)![Image#part0009.html_p088pro01a)![Image#part0009.html_p088pro02a)![Image#part0009.html_p089pro01a)![Image#part0009.html_p089pro02a)![Image#part0009.html_p089pro03a)![Image#part0009.html_p089pro04a)![Image#part0009.html_p090pro01a)![Image#part0009.html_p091pro01a)![Image#part0009.html_p092pro01a)![Image#part0009.html_p092pro02a)![Image#part0009.html_p092pro03a)\n\
  \n- 3.1 接口\n- 3.2 静态、默认和私有方法\n- 3.3 接口示例\n- 3.4 Lambda 表达式\n- 3.5 方法和构造函数引用\n- 3.6\
  \ 处理 Lambda 表达式\n- 3.7 Lambda 表达式与变量作用域\n- 3.8 高阶函数\n- 3.9 局部类和匿名类\n- 3.10 练习\n\n\
  Java 是在 20 世纪 90 年设计的面向对象编程语言，当时面向对象编程是软件开发的主要范式。接口是面向对象编程的一项关键特性：它们允许你指定做什么，而无需提供实现。\n\
  \n在面向对象编程出现很久以前就已经有了函数式编程语言，例如 Lisp，在这些语言中，函数而不是对象是主要的结构机制。最近，函数式编程的重要性日益提高，因为它非常适合并发和事件驱动（或“响应式”）编程。Java\
  \ 支持函数表达式，为面向对象和函数式编程之间提供了良好的桥梁。在本章中，你将学习接口和 Lambda 表达式。\n\n本章的关键点如下：\n\n1. 接口指定了实现类必须提供的方法。\n\
  2. 接口是任何实现类的超类型。因此，你可以将类的实例赋值给接口类型的变量。\n3. 接口可以包含静态方法。接口中的所有变量自动都是公共、静态且最后的。\n4.\
  \ 接口可以包含默认方法，实现类可以继承或覆盖这些方法。\n5. 接口可以包含私有方法，实现类无法调用或覆盖这些方法。\n6. `Comparable` 和 `Comparator`\
  \ 接口用于比较对象。\n7. 函数式接口是一个只有一个抽象方法的接口。\n8. Lambda 表达式表示可以在以后某个时刻执行的代码块。\n9. Lambda\
  \ 表达式被转换为函数式接口。\n10. 方法和构造函数引用引用方法或构造函数而不调用它们。\n11. Lambda 表达式和局部类可以访问闭包作用域中的有效最终变量。\n\
  \n\n\n\n`interface`（接口）是一种用于规定双方之间约的机制：即服务的提供者与希望其对象可以使用该服务的类。在接下来的章节中，你将看到如何在 Java\
  \ 中定义和使用接口。\n\n### 3.1.1 声明接口\n\n考虑一个处理整数序列的服务，该服务报告前 `n` 个值的平均值：\n\n点击此处查看代码图片\n\
  \n```java\npublic static double average(IntSequence seq, int n)\n```\n\n这些序列可以有许多形式。以下是一些示例：\n\
  \n• 用户提供的整数序列\n• 随机整数序列\n• 质数序列\n• 整数数组中的元素序列\n• 字符串中的代码点序列\n• 数字中的数字序列\n\n我们希望实现`一种单一的机制`来处理所有这些类型的序列。\n\
  \n首先，让我们列出整数序列的共同点。至少，处理序列需要两个方法：\n\n• 测试是否存在下一个元素\n• 获取下一个元素\n\n要声明一个接口，你需要提供方法头，如下所示：\n\
  \n点击此处查看代码图片\n\n```java\npublic interface IntSequence {\n    boolean hasNext();\n\
  \    int next();\n}\n```\n\n你不需要实现这些方法，但如果你愿意，可以提供默认实现——参见第 3.2.2 节，“默认方法](#part0011.html_ch03lev2sec9)”（第\
  \ 106 页）。如果没有提供实现，我们称该方法为 `abstract`（抽象的）。\n\n***\n\n![Image](img/00003.jpeg) 笔记\n\
  \n接口的所有方法自动都是 `public` 的。因此，没有必要将 `hasNext` 和 `next` 声明为 `public`。某些程序员为了更高的清晰度仍然会这样做。\n\
  \n***\n\n接口中的方法已足够实现 `average` 方法：\n\n点击此处查看代码图片\n\n```java\npublic static double\
  \ average(IntSequence seq, int n) {\n    int count = 0;\n    double sum = 0;\n \
  \   while (seq.hasNext() && count < n) {\n        count++;\n        sum += seq.next();\n\
  \    }\n    return count == 0 ? 0 : sum / count;\n}\n```\n\n### 3.1.2 实现接口\n\n现在让我们来看硬币的另一面：希望可以使用\
  \ `average` 方法的类。它们需要 `implement`（实现）`IntSequence` 接口。是这样一个类：\n\n点击此处查看代码图片\n\n\
  ```java\npublic class SquareSequence implements IntSequence {\n    private int i;\n\
  \    public boolean hasNext() {\n        return true;\n    }\n    public int next()\
  \ {\n        i++;\n        return i * i;\n    }\n}\n```\n\n平方数有无穷，该类的对象一个个交付它们。（为了保持示例简单，我们忽略了整数溢出——参见练习\
  \ 6。）\n\n`implements` 关键字表示 `SquareSequence` 类意图符合 `IntSequence` 接口。\n\n***\n\n\
  ![Image](img/00007.jpeg) 注意事项\n\n实现类必须将接口的方法声明为 `public`。否则，它们将默认为包访问权限（package\
  \ access）。由于接口要求公共访问，编译器将报告错误。\n\n***\n\n这段代码获取前 100 个平方数的平均值：\n\n点击此处查看代码图片\n\n\
  ```java\nSquareSequence squares = new SquareSequence();\ndouble avg = average(squares,\
  \ 100);\n```\n\n有许多类可以实现 `IntSequence` 接口。例如，这个类产生一个有限序列，即从最低有效位开始的正整数的数字：\n\n点击此处查看代码图片\n\
  \n```java\npublic class DigitSequence implements IntSequence {\n    private int\
  \ number;\n    public DigitSequence(int n) {\n        number = n;\n    }\n    public\
  \ boolean hasNext() {\n        return number != 0;\n    }\n    public int next()\
  \ {\n        int result = number % 10;\n        number /= 10;\n        return result;\n\
  \    }\n    public int rest() {\n        return number;\n    }\n}\n```\n\n一个 `new\
  \ DigitSequence(1729)` 对象在 `hasNext` 返回 `false` 之前交付数字 `9 2 7 1`。\n\n***\n\n![Image](img/00003.jpeg)\
  \ 笔记\n\n`SquareSequence` 和 `DigitSequence` 类实现了 `IntSequence` 接口的所有方法。如果一个类只实现部分方法，那么它就是\
  \ `abstract`（抽象的）。\n\n### 3.1.3 转换为接口\n\n`interface` 是一种用于规定双方之间约的机制：服务的提供者与希望其对象可以使用该服务的类。在接下来的章节中，你将看到如何在\
  \ Java 中定义和使用接口。\n\n### 3.1.4 强制转换与 `instanceof` 运算符\n\n偶尔，你需要相反的转换——从父类到子类。这时你使用\
  \ `cast`（强制转换）。例如，如果你知道存储在 `IntSequence` 中的对象实际上是 `DigitSequence`，你可以这样转换它：\n\n\
  点击此处查看代码图片\n\n```java\nIntSequence sequence = ...;\nDigitSequence digits = (DigitSequence)\
  \ sequence;\nSystem.out.println(digits.rest());\n```\n\n在这种情况下，强制转换是必要的，因为 `rest`\
  \ 是 `DigitSequence` 的方法而不是 `IntSequence` 的方法。\n\n参见练习 2 以获得更有说服力的示例。\n\n你只能将对象转换为其实际类或其父类之一。如果你搞错了，就会发生编译时错误或类转换异常：\n\
  \n点击此处查看代码图片\n\n```java\nString digitString = (String) sequence; // 不可能工作——IntSequence\
  \ 不是 String 的父类\nRandomSequence randoms = (RandomSequence) sequence; // 可能工作，如果不是则会抛出类转换异常\n\
  ```\n\n为了避免异常，你可以先使用 `instanceof` 运算符测试对象是否为目标类型。表达式\n\n`object instanceof Type`\n\
  \n如果 `object` 是具有 `Type` 作为父类的类的实例，则返回 `true`。在使用强制转换之前进行此类检查是一个好主意。\n\n点击此处查看代码图片\n\
  \n```java\nif (sequence instanceof DigitSequence) {\n    DigitSequence digits =\
  \ (DigitSequence) sequence;\n    ...\n}\n```\n\n***\n\n![Image](img/00003.jpeg)\
  \ 笔记\n\n`instanceof` 运算符是 `null`-安全的：如果 `obj` 为 `null`，则表达式 `obj instanceof Type`\
  \ 为 `false`。毕竟，`null` 不可能是任何给定类型对象的引用。\n\n### 3.1.5 接口扩展\n\n接口可以 *extend*（扩展）另一个接口，在原始方法的基础上要求或提供额外的方法。例如，`Closeable`\
  \ 是一个带有单一方法的接口：\n\n```java\npublic interface Closeable {\n    void close();\n}\n\
  ```\n\n正如你在第 5 章中看到的，这是一个在发生异常时关闭资源的重要接口。\n\n`Channel` 接口扩展了此接口：\n\n\n\n\n\n点击此处查看代码图片\n\
  \n```java\npublic interface Channel extends Closeable {\n    boolean isOpen();\n\
  }\n```\n\n实现 `Channel` 接口的类必须提供这两个方法，并且其对象可以转换为这两种接口类型。\n\n### 3.1.6 实现多个接口\n\n\
  一个类可以实现任意数量的接口。例如，一个从文件读取整数的 `FileSequence` 类除了实现 `IntSequence` 之外，还可以实现 `Closeable`\
  \ 接口：\n\n点击此处查看代码图片\n\n```java\npublic class FileSequence implements IntSequence,\
  \ Closeable {\n    ...\n}\n```\n\n那么，`FileSequence` 类同时拥有 `IntSequence` 和 `Closeable`\
  \ 两个超类型。\n\n### 3.1.7 常量\n\n接口中定义的任何变量都自动是 `public static final`。\n\n例如，`SwingConstants`\
  \ 接口定义了指南针方向的常量：\n\n点击此处查看代码图片\n\n```java\npublic interface SwingConstants {\n \
  \   int NORTH = 1;\n    int NORTH_EAST = 2;\n    int EAST = 3;\n    ...\n}\n```\n\
  \n你可以通过完全限定名 `SwingConstants.NORTH` 来引用它们。如果你的类选择实现 `SwingConstants` 接口，你可以省略 `SwingConstants`\
  \ 限定符，直接写 `NORTH`。然而，这并不是一种常见的做法。使用枚举（enumerations）来表示一组常量要好得多；参见第 4 章。\n\n* *\n\
  \n![Image](img/00003.jpeg) 释\n\n接口中不能有实例变量。接口规定的是行为，而不是对象状态。\n\n* *\n\n### 3.2 静态、默认和私有方法\n\
  \n在 Java 的早期版本中，接口的所有方法都必须是抽象的——即没有方法体。现在，你可以添加三种带有具体实现的方法：静态方法、默认方法和私有方法。接下来的章节将描述这些方法。\n\
  \n#### 3.2.1 静态方法\n\n技术上从未有过理由规定接口不能拥有静态方法，但它们不符合接口作为抽象规范的观点。这种想法现在已经演变了。特别是，工厂方法（factory\
  \ methods）在接口中非常有意义。例如，`IntSequence` 接口可以有一个静态方法 `digitsOf`，用于生成给定整数的数字序列：\n\n点击此处查看代码图片\n\
  \n```java\nIntSequence digits = IntSequence.digitsOf(1729);\n```\n\n该方法产生一个实现 `IntSequence`\
  \ 接口的某个类的实例，但调用者不需要关心它是哪一个类。\n\n点击此处查看代码图片\n\n```java\npublic interface IntSequence\
  \ {\n    ...\n    static IntSequence digitsOf(int n) {\n        return new DigitSequence(n);\n\
  \    }\n}\n```\n\n* *\n\n![Image](img/00003.jpeg) 释\n\n在过去，将静态方法放在伴侣类（companion\
  \ class）中是常见的做法。在 Java API 中你会发现接口和工具类的成对，例如 `Collection`/`Collections` 或 `Path`/`Paths`。这种划分不再是了。\n\
  \n* *\n\n#### 3.2.2 默认方法\n\n你可以为任何接口方法提供一个 `default` 实现。你必须用 `default` 修饰符来标记此类方法。\n\
  \n点击此处查看代码图片\n\n```java\npublic interface IntSequence {\n    default boolean hasNext()\
  \ { return true; }\n    // 默认情况下，序列是无限的\n    int next();\n}\n```\n\n实现此接口的类可以选择重写\
  \ `hasNext` 方法，也可以继承默认实现。\n\n* *\n\n![Image](img/00003.jpeg) 释\n\n默认方法结束了一种经典模式，即提供一个接口和一个实现了其大部分或全部方法的伴侣类，例如\
  \ Java API 中的 `Collection`/`AbstractCollection` 或 `WindowListener`/`WindowAdapter`。现在，你只需要在接口中实现这些方法即可。\n\
  \n* *\n\n默认方法的一个重要用途是*接口演进*（interface evolution）。以在 Java 中存在了多年的 `Collection` 接口为例。假设在很久年前，你提供了一个类：\n\
  \n点击此处查看代码图片\n\n```java\npublic class Bag implements Collection\n```\n\n稍后在 Java\
  \ 8 中，接口中添加了一个 `stream` 方法。\n\n假设 `stream` 方法不是默认方法。那么 `Bag` 类将无法编译，因为它没有实现这个新方法。在接口中添加非默认方法是不源码兼容的。\n\
  \n但假设你没有重新编译该类而直接使用旧的 JAR 包。该类仍然可以加载，即使缺少该方法。然而，如果程序在 `Bag` 上调用 `stream` 方法，就会发生\
  \ `AbstractMethodError`。将方法设为 `default` 解决了这个问题。该类将再次变为二进制兼容的。\n\n#### 3.2.3 解决默认冲突\n\
  \n如果一个类实现了两个接口，其中一个有一个默认方法而另一个（无论是否是默认）具有相同的方法，那么你必须解决这种冲突。这种情况并不常见，而且通常很容易处理。让我们来看一个例子。假设我们有一个具有此类方法的接口\
  \ `Person`：\n\n点击此处查看代码图片\n\n```java\npublic interface Person {\n    String getName();\n\
  \    default int getId() { return 0; }\n}\n```\n\n并且假设另一个接口 `Identified` 也具有此类方法：\n\
  \n点击此处查看代码图片\n\n```java\npublic interface Identified {\n    default int getId()\
  \ { return Math.abs(hashCode()); }\n}\n```\n\n如果你形成一个实现这两个类的类会怎样？它继承了 `Person` 和\
  \ `Identified` 两个 `getId` 方法。Java 编译器无法选择其中一个。编译器会报告错误并由你来解决歧。在 `Employee` 类中提供\
  \ `getId` 方法，要么实现你自己的方案，要么委托给其中一个方法，如下：\n\n点击此处查看代码图片\n\n```java\npublic class Employee\
  \ implements Person, Identified {\n    public int getId() {\n        return Identified.super.getId();\n\
  \    }\n    ...\n}\n```\n\n* *\n\n![Image](img/00003.jpeg) 释\n\n`super` 关键字允许你调用超类型方法。在这种情况下，我们需要指定是哪个超类型。这种语法看起来有点奇怪，但它与你在第\
  \ 4 章中看到的调用父类方法的一致。\n\n* *\n\n现在假设 `Identified` 接口没有为 `getId` 提供默认实现：\n\n```java\n\
  interface Identified {\n    int getId();\n}\n```\n\n`Employee` 类可以继承 `Person` 接口的默认方法吗？从乍一看，这似乎是合理的。但编译器如何知道\
  \ `Person.getId` 方法是否执行了 `Identified.getId` 预期的操作呢？毕竟，它返回的是人的弗洛伊德本意识（id），而不是 ID\
  \ 编号。\n\nJava 设计者选择了安全性和统一性。无论两个接口之间如何冲突，只要至少有一个接口提供了实现，编译器就会报告错误，并由程序员来解决这种歧义。\n\
  \n\n\n\n如果两个接口都没有为共享方法提供默认实现，那么就不存在冲突。实现类有两个选择：实现该方法，或者留空不实现并将该类声明为 `abstract`（抽象）。\n\
  \n***\n\n***\n\n![Image](img/00003.jpeg) 笔记\n\n如果一个类继承了一个父类（参见第 4 章）并实现了一个接口，且从两者都继承了相同的方法，规则就变得简单了。在这种情况下，只有父类的方法起作用，接口中的任何默认方法都会被忽略。这实际上比接口冲突的情况更常见。详情请参见第\
  \ 4 章。\n\n***\n\n### 3.2.4 私有方法\n\n从 Java 9 开始，接口中的方法可以是私有的（private）。私有方法可以是 `static`（静态）方法或实例方法，但不能是\
  \ `default`（默认）方法，因为默认方法是可以被重写的。由于私有方法只能在接口本身的方法中使用，因此它们的用途仅限于作为接口其他方法的辅助方法。\n\n\
  例如，假设 `IntSequence` 类提供了以下方法：\n\n```\nstatic of(int a)\nstatic of(int a, int b)\n\
  static of(int a, int b, int c)\n```\n\n那么这些方法中的每一个都可以调用一个辅助方法：\n\n点击此处查看代码图片\n\n\
  ```\nprivate static IntSequence makeFiniteSequence(int... values) { ... }\n```\n\
  \n### 3.3 接口示例\n\n从初上看，接口似乎并没有太大作用。接口只是类承诺实现的一组方法集合。为了让接口的重要性更加直观，接下来的章节将向你展示 Java\
  \ API 中四个常用接口的示例。\n\n#### 3.3.1 `Comparable` 接口\n\n假设你想对一个对象数组进行排序。排序算法会反复比较元素，如果它们的顺序不对，就会重新排列它们。当然，每个类的比较规则是不同的，排序算法只需要调用类提供的方法即可。只要所有类都能对该方法的名称达成一致，排序算法就能完成工作。这就是接口发挥作用的地方。\n\
  \n如果一个类想要让它的对象支持排序，它应该实现 `Comparable` 接口。关于这个接口有一个技术点：我们希望比较字符串与字符串、员工与员工等。正因于此，`Comparable`\
  \ 接口带有一个类型参数。\n\n点击此处查看代码图片\n\n```java\npublic interface Comparable<T> {\n    int\
  \ compareTo(T other);\n}\n```\n\n例如，`String` 类实现了 `Comparable<String>`，因此它的 `compareTo`\
  \ 方法签名如下：\n\n```\nint compareTo(String other)\n```\n\n***\n\n![Image](img/00003.jpeg)\
  \ 笔记\n\n带有类型参数的类型如 `Comparable` 或 `ArrayList` 是*泛型*（generic）类型。你将在第 6 章学习关于泛型类型的所有知识。\n\
  \n***\n\n调用 `x.compareTo(y)` 时，`compareTo` 方法返回一个整数值，用来指示 `x` 或 `y` 应该在前面。返回正值（不一定是\
  \ `1`）表示 `x` 应该在 `y` 之后。当 `x` 应该在 `y` 之前时，返回负整数（不一定是 `-1`）。如果 `x` 和 `y` 被视为相等，则返回值为\
  \ `0`。\n\n注意，返回值可以是任何整数。这种灵活性很有用，因为它允许你返回两个整数的差值。只要差值不会产生整数溢出，这种方法就很方便。\n\n点击此处查看代码图片\n\
  \n```java\npublic class Employee implements Comparable<Employee> {\n    ...\n  \
  \  public int compareTo(Employee other) {\n        return getId() - other.getId();\
  \ // 如果 ID 始终 ≥ 0 则是安全的\n    }\n}\n```\n\n***\n\n![Image](img/00007.jpeg) 警告\n\n\
  返回整数的差值并不总是有效。对于符号相反的大操作数，差值可能会溢出。在这种情况下，请使用 `Integer.compare` 方法，它对所有整数都能正常工作。然而，如果你知道整数是非负的，或者它们的绝对值小于\
  \ `Integer.MAX_VALUE / 2`，那么使用差值就没问题的。\n\n***\n\n比较浮点值时，你不能直接返回差值。相反，请使用静态的 `Double.compare`\
  \ 方法。即使对于 ±∞ 和 NaN，它也能正确处理。\n\n以下是 `Employee` 类如何实现 `Comparable` 接口并按薪资对员工进行排序示例：\n\
  \n点击此处查看代码图片\n\n```java\npublic class Employee implements Comparable<Employee> {\n\
  \    ...\n    public int compareTo(Employee other) {\n        return Double.compare(salary,\
  \ other.salary);\n    }\n}\n```\n\n***\n\n![Image](img/00003.jpeg) 笔记\n\n如果一个类继承了一个父类（参见第\
  \ 4 章）并实现了一个接口，且从两者都继承了相同的方法，规则就变得简单了。在这种情况下，只有父类的方法起作用，接口中的任何默认方法都会被忽略。这实际上比接口冲突的情况更常见。详情请参见第\
  \ 4 章。\n\n***\n\n![Image](img/00003.jpeg) 笔记\n\n带有类型参数的类型如 `Comparable` 或 `ArrayList`\
  \ 是*泛型*类型。你将在第 6 章学习关于泛型类型的所有知识。\n\n***\n\n![Image](img/00007.jpeg) 警告\n\n返回整数的差值并不总是有效。对于符号相反的大操作数，差值可能会溢出。在这种情况下，请使用\
  \ `Integer.compare` 方法，它对所有整数都能正常工作。然而，如果你知道整数是非负的，或者它们的绝对值小于 `Integer.MAX_VALUE\
  \ / 2`，那么使用差值就没问题的。\n\n***\n\n#### 3.3.2 `Comparator` 接口\n\n假设我们想按长度对字符串进行排序，而不是字典顺序。为了处理这种情况，`Arrays.sort`\
  \ 方法有一个重载，其参数是一个数组和一个比较器（comparator）——即 `Comparator` 类的实例。\n\n为了按长度比较字符串，定义一个实现\
  \ `Comparator<String>` 的类：\n\n点击此处查看代码图片\n\n```java\nclass LengthComparator implements\
  \ Comparator<String> {\n    public int compare(String first, String second) {\n\
  \        return first.length() - second.length();\n    }\n}\n```\n\n为了实际进行比较，你需要创建一个实例：\n\
  \n点击此处查看代码图片\n\n```java\nComparator<String> comp = new LengthComparator();\nif (comp.compare(words[i],\
  \ words[j]) > 0) ...\n```\n\n将此调用与 `words[i].compareTo(words[j])` 进行对比。`compare`\
  \ 方法是在比较器对象上调用的，而不是字符串本身。\n\n***\n\n![Image](img/00003.jpeg) 笔记\n\n即使 `LengthComparator`\
  \ 对象没有状态，你仍然需要实例化。你需要实例来调用 `compare` 方法——它不是静态方法。\n\n***\n\n要对数组排序，将 `LengthComparator`\
  \ 对象传递给 `Arrays.sort` 方法：\n\n点击此处查看代码图片\n\n```java\nString[] friends = { \"Peter\"\
  , \"Paul\", \"Mary\" };\nArrays.sort(friends, new LengthComparator());\n```\n\n\
  现在数组是 `[\"Paul\", \"Mary\", \"Peter\"]` 或 `[\"Mary\", \"Paul\", \"Peter\"]`。\n\n\
  你将在第 3.4.2 节、函数式接口（115 页）学习如何使用 Lambda 表达式更轻松地使用 `Comparator`。\n\n#### 3.3.3 `Runnable`\
  \ 接口\n\n`Runnable` 接口只有一个方法。在几乎每个处理器都有多个核心的时代，你想让这些核心忙起来。你可能希望在单独的线程运行某些任务，或者将它们交给线程池执行。要定义任务，你需要实现\
  \ `Runnable` 接口。\n\n\n\n\n\n点击此处查看代码图片\n\n```java\nclass HelloTask implements Runnable\
  \ {\n    public void run() {\n        for (int i = 0; i < 1000; i++) {\n       \
  \     System.out.println(\"Hello, World!\");\n        }\n    }\n}\n```\n\n如果你想在一个线程中执行此任务，请从\
  \ `Runnable` 创建线程并启动它。\n\n点击此处查看代码图片\n\n```java\nRunnable task = new HelloTask();\n\
  Thread thread = new Thread(task);\nthread.start();\n```\n\n现在，`run` 方法在独立的线程中执行，当前线程可以继续其他工作。\n\
  \n***\n\n![Image](img/00003.jpeg) Note\n\n在第 10 章中，你将看到执行 `Runnable` 的其他方法。\n\n\
  ***\n\n***\n\n![Image](img/00003.jpeg) Note\n\n还有一个 `Callable<T>` 接口，用于返回类型为 `T`\
  \ 结果的任务。\n\n***\n\n### 3.3.4 用户界面回调\n\n在图形用户界面中，你必须指定当用户点击按钮、选择菜单选项、拖动滑块时要执行的操作。这些操作通常被称为回调（callbacks），因为当用户操作发生时，某些代码会被“回调”。\n\
  \n在基于 Java 的 GUI 库中，接口用于回调。例如，在 JavaFX 中，以下接口用于报告事件：\n\n点击此处查看代码图片\n\n```java\n\
  public interface EventHandler<T> {\n    void handle(T event);\n}\n```\n\n这也是一个泛型接口，其中\
  \ `T` 是正在报告的事件类型，例如按钮点击的 `ActionEvent`。\n\n要指定操作，请实现该接口：\n\n点击此处查看代码图片\n\n```java\n\
  class CancelAction implements EventHandler<ActionEvent> {\n    public void handle(ActionEvent\
  \ event) {\n        System.out.println(\"Oh noes!\");\n    }\n}\n```\n\n然后，创建该类的对象并将其添加到按钮中：\n\
  \n点击此处查看代码图片\n\n```java\nButton cancelButton = new Button(\"Cancel\");\ncancelButton.setOnAction(new\
  \ CancelAction());\n```\n\n***\n\n![Image](img/00003.jpeg) Note\n\n由于 Oracle 将 JavaFX\
  \ 定为 Swing GUI 工具包的继任者，我在示例中使用了 JavaFX。（别担心——你不需要对 JavaFX 了解比你刚刚看到的这几个语句多。）细节并不重要；在每个用户界面工具包中（无论是\
  \ Swing、JavaFX 还是 Android），你只需给按钮一些代码，在按钮被点击时运行。\n\n***\n\n当然，这种定义按钮操作的方法相当繁琐的。在其他语言中，你只需要给按钮一个要执行的函数，而无需经过创建类并实例化的迂弯路。下一节将展示如何在\
  \ Java 中实现相同的操作。\n\n### 3.4 Lambda 表达式\n\nLambda 表达式是一个可以传递的代码块，以便稍后执行（一次或多次）。在前面的节中，你已经看到在很多情况下，指定这样的代码块是有帮助的：\n\
  \n- 向 `Arrays.sort` 传递比较方法\n- 在单独线程中运行任务\n- 指定在点击按钮时应该发生的操作\n\n然而，Java 是一门面向对象的语言，（几乎）所有内容都是对象。Java\
  \ 中没有函数类型。相反，函数被表示为对象，即实现特定接口的类实例。Lambda 表达式为你提供了创建此类实例的便利语法。\n\n#### 3.4.1 Lambda\
  \ 表达式的语法\n\n再次考虑第 3.3.2 节中的排序示例，“`Comparator` 接口”（第 111 页）。传递了检查一个字符串是否比另一个短的代码。我们计算：\n\
  \n点击此处查看代码图片\n\n`first.length() - second.length()`\n\n`first` 和 `second` 是什么？它们都是字符串。Java\
  \ 是一门强类型语言，我们也必须指定这一点：\n\n点击此处查看代码图片\n\n`(String first, String second) -> first.length()\
  \ - second.length()`\n\n你刚刚看到了你的第一个 Lambda 表达式。\n\n\n\n\n\n```java\n(first, second)\
  \ -> first.length() - second.length());\n```\n\n在底层，`Arrays.sort` 方法的第二个参数变量接收的是一个实现了\
  \ `Comparator<String>` 的类的对象。在那个对象上调用 `compare` 方法会执行 lambda 表达式的体。对这些对象和类的管理完全取决于实现，并且经过了高度优化。\n\
  \n在大多数支持函数字面量的编程语言中，你可以声明诸如 `(String, String) -> int` 这样的函数类型，声明这些类型的变量，将函数放入这些变量中并调用它们。在\
  \ Java 中，你对 lambda 表达式只能做*一件事*：将其放入类型为函数式接口的变量中，以便将其转换为该接口的实例。\n\n***\n\n![Image](img/00003.jpeg)\
  \ 注意\n\n你不能将 lambda 表达式赋值给 `Object` 类型的变量，因为它是 Java 中所有类的公共超类（参见第 4 章）。`Object`\
  \ 是一个类，而不是函数式接口。\n\n***\n\nJava API 提供了大量的函数式接口（参见第 3.6.2 节”，第 120 页）。其中之一是：\n\n\
  点击此处查看代码图片\n\n```java\npublic interface Predicate<T> {\n    boolean test(T t);\n\
  \    // Additional `default` and `static` 方法\n}\n```\n\n`ArrayList` 类有一个 `removeIf`\
  \ 方法，其参数是一个 `Predicate`。它专门为接收 lambda 表达式而设计。例如，以下语句从数组列表中移除所有 `null` 值：\n\n点击此处查看代码图片\n\
  \n```java\nlist.removeIf(e -> e == null);\n```\n\n### 3.5 方法引用和构造器引用\n\n有时候，已经有一个方法恰好执行你想传递给其他代码的操作。*方法引用*有一种特殊的语法，它比调用方法的\
  \ lambda 表达式还要短。构造器也有类似的快捷方式。你将在接下来的章节中看到它们。\n\n#### 3.5.1 方法引用\n\n假设你想不分字母大小地排序字符串。你可以调用：\n\
  \n点击此处查看代码图片\n\n```java\nArrays.sort(strings, (x, y) -> x.compareToIgnoreCase(y));\n\
  ```\n\n相反，你可以传递这个方法表达式：\n\n点击此处查看代码图片\n\n```java\nArrays.sort(strings, String::compareToIgnoreCase);\n\
  ```\n\n表达式 `String::compareToIgnoreCase` 是一个*方法引用*，等同于 lambda 表达式 `(x, y) -> x.compareToIgnoreCase(y)`。\n\
  \n这是另一个例子。`Objects` 类定义了一个方法 `isNull`。调用 `Objects.isNull(x)` 仅仅返回 `x == null` 的值。似乎没必要为这种情况专门设置一个方法，但它的设计是为了作为方法表达式传递的。调用：\n\
  \n点击此处查看代码图片\n\n```java\nlist.removeIf(Objects::isNull);\n```\n\n会移除列表中所有的 `null`\
  \ 值。\n\n另一个例子，假设你想打印列表的所有元素。`ArrayList` 类有一个 `forEach` 方法，它可以将函数应用到每个元素。你可以调用：\n\
  \n点击此处查看代码图片\n\n```java\nlist.forEach(x -> System.out.println(x));\n```\n\n然而，如果可以直接将\
  \ `println` 方法传递给 `forEach` 方法就更了。这是实现方法：\n\n点击此处查看代码图片\n\n```java\nlist.forEach(System.out::println);\n\
  ```\n\n从这些示例中可以看出，`::` 运算符将方法名与类或对象的名称隔离开。它有三种变体：\n\n1. `Class::instanceMethod`\n\
  2. `Class::staticMethod`\n3. `object::instanceMethod`\n\n在第一的情况下，第一个参数变成方法的接收者，任何其他参数都会传递给该方法。例如，`String::compareToIgnoreCase`\
  \ 等同于 `(x, y) -> x.compareToIgnoreCase(y)`。\n\n在第二种情况下，所有参数都会传递给静态方法。方法表达式 `Objects::isNull`\
  \ 等同于 `x -> Objects.isNull(x)`。\n\n在第三种情况下，方法在给定的对象上调用，参数传递给实例方法。因此，`System.out::println`\
  \ 等同于 `x -> System.out.println(x)`。\n\n***\n\n![Image](img/00003.jpeg) 注意\n\n当存在多个同名的重载方法时，编译器会根据上下文推断你指的是哪一个。例如，`println`\
  \ 方法有多个版本。当传递给 `forEach` 方法时，编译器知道 `System.out::println` 指的是 `println(String)` 方法。\n\
  \n***\n\n#### 3.5.2 构造器引用\n\n构造器引用与方法引用相似，区别在于方法名是 `new`。例如，`Employee::new` 指向 `Employee`\
  \ 构造器。如果类有多个构造器，则取决于上下文来选择哪一个。\n\n\n\n\n\n-   仅在需要时运行代码\n\n让我们来看一个简单的例子。假设你想重复执行某个操作\
  \ `n` 次。该操作和次数被传递给一个 `repeat` 方法：\n\n点击此处查看代码图像\n\n```\nrepeat(10, () -> System.out.println(\"\
  Hello, World!\"));\n```\n\n为了接受这个 lambda 表达式，我们需要选择（或在少数情况下提供）一个函数式接口。在这种情况下，我们可以直接使用\
  \ `Runnable`：\n\n点击此处查看代码图像\n\n```java\npublic static void repeat(int n, Runnable\
  \ action) {\n    for (int i = 0; i < n; i++) action.run();\n}\n```\n\n注意，lambda\
  \ 表达式的体会在调用 `action.run()` 时执行。\n\n现在让我们让这个例子变得稍微复杂一点。我们想告诉操作它发生在哪一次迭代中。为此，我们需要选择一个具有\
  \ `int` 参数且返回值为 `void` 方法的函数式接口。与其自己编写一个，我强烈建议你使用下一节中描述的标准接口之一。处理 `int` 值的标准接口是\n\
  \n点击此处查看代码图像\n\n```java\npublic interface IntConsumer {\n    void accept(int value);\n\
  }\n```\n\n这是 `repeat` 方法的改进版本：\n\n点击此处查看代码图像\n\n```java\npublic static void repeat(int\
  \ n, IntConsumer action) {\n    for (int i = 0; i < n; i++) action.accept(i);\n\
  }\n```\n\n这里是调用它的方式：\n\n点击此处查看代码图像\n\n```java\nrepeat(10, i -> System.out.println(\"\
  Countdown: \" + (9 - i)));\n```\n\n### 3.6.2 选择函数式接口\n\n在大多数函数式编程语言中，函数类型是*结构化*的。要指定一个将两个字符串映射到整数的函数，你使用类似于\
  \ `Function2<String, String, Integer>` 或 `(String, String) -> int` 的类型。在 Java 中，你通过函数式接口（如\
  \ `Comparator<String>`）来声明函数的意图。在编程语言理论中，这被称为*名义*类型。\n\n当然，在很多情况下，你想接受没有特定语义的“任何函数”。有许多泛型函数类型可用于此目的（参见表\
  \ 3-1），在可能的情况下使用它们之一是非常好的主意。\n\n**表 3-1** 常见函数式接口\n\n| 函数式接口 | 参数类型 | 返回类型 | 抽象方法名\
