  \ 和 `java.util.stream.Collectors` 使用静态导入声明是很常见的，因为它们提供了大量的静态方法。\n\n## 2.6 嵌套类\n\n\
  在前面的节中，你已经学习了如何将类组织成包。或者，你可以将一个类放在另一个类内部。这样的类被称为*嵌套类*。这可以用于限制可见性，或者避免用如 `Element`、`Node`\
  \ 或 `Item` 等通用名称弄乱包。Java 有两种嵌套类，其行为略有不同。让我们在接下来的章节中检查这两种。\n\n### 2.6.1 静态嵌套类\n\n\
  考虑一个为项目计费的 `Invoice` 类，每个项目都有描述、数量和单价。我们可以将 `Item` 变成一个嵌套类：\n\n点击此处查看代码图像\n\n```java\n\
  public class Invoice {\n    private static class Item { // `Item` 嵌套在 `Invoice`\
  \ 内部\n        String description;\n        int quantity;\n        double unitPrice;\n\
  \        double price() { return quantity * unitPrice; }\n    }\n    private ArrayList<Item>\
  \ items = new ArrayList<>();\n    public void addItem(String description, int quantity,\
  \ double unitPrice) {\n        Item item = new Item(description, quantity, unitPrice);\n\
  \        items.add(item);\n    }\n}\n```\n\n由于 `warningString` 变量不是私有的，`java.awt`\
  \ 包中所有类的方法都可以访问它。实际上...（省略）所以程序员可能简单地忘记了加上 `private` 修饰符。\n\n这可能是一个安全问题，因为包是开放的。任何类都可以通过提供相应的\
  \ `package` 语句将自己添加到某个包中。\n\n如果你担心包的这种开放性，你并不孤单。一种解决办法是将你的包放入一个模块中——参见第 15 章。当一个包位于模块中时，无法向该包添加类。Java\
  \ 库中的所有包都分组成了模块，因此你不能仅仅通过在 `java.awt` 包中编写类来访问 `Window.warningString` 变量。\n\n###\
  \ 2.5.5 导入类\n\n`import` 语句允许你在不使用完全限定名的情况下使用类。例如，当你使用：\n\n```java\nimport java.util.Random;\n\
  ```\n\n那么你可以在代码中写 `Random` 而不是 `java.util.Random`。\n\n![Image](img/00003.jpeg) 注意\n\
  \n导入声明是一种便利，但并非必需品。你可以丢弃所有的导入声明，并在到处使用完全限定的类名。\n\n点击此处查看代码图像\n\n```java\njava.util.Random\
  \ generator = new java.util.Random();\n```\n\n将 `import` 语句放在源文件中第一个类声明的上方，但放在 `package`\
  \ 语句下方。\n\n你可以使用通配符导入一个包中的所有类：\n\n```java\nimport java.util.*;\n```\n\n通配符只能导入类，不能导入包。你不能使用\
  \ `import java.*;` 来获取所有以 `java` 开头的包。\n\n当你导入多个包时，可能会发生名称冲突。例如，`java.util` 和 `java.sql`\
  \ 包都包含一个 `Date` 类。假设你同时导入了这两个包：\n\n```java\nimport java.util.*;\nimport java.sql.*;\n\
  ```\n\n如果你的程序没有使用 `Date` 类，那么这不是一个问题。但如果你在不带包名的情况下引用 `Date`，编译器就会报错。\n\n在这种情况下，你可以导入你需要的特定类：\n\
  \n```java\nimport java.util.*;\nimport java.sql.*;\nimport java.sql.Date;\n```\n\
  \n如果你确实需要这两个类，你必须对其中至少一个使用完全限定名。\n\n![Image](img/00003.jpeg) 注意\n\n`import` 语句是为程序员提供的便利。在类文件中，所有的类名都是完全限定的。\n\
  \n![Image](img/00003.jpeg) 注意\n\n`import` 语句与 C 和 C++ 中的 `#include` 指令非常不同。该指令包含用于编译的头文件。导入不会导致文件被重新编译。它们只是缩短了名称，类似于\
  \ C++ 的 `using` 语句。\n\n### 2.5.6 静态导入\n\n`import` 语句的一种形式允许导入静态方法和变量。例如，如果你添加了指令：\n\
