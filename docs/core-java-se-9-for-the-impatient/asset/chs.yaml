  | `Predicate<T>` | `T` | `boolean` | `test` | 布尔值函数 | `and`, `or`, `negate`, `isEqual`\
  \ |\n| `BiPredicate<T, U>` | `T`, `U` | `boolean` | `test` | 带有两个参数的布尔函数 | `and`,\
  \ `or`, `negate` |\n\n例如，假设你写了一个方法来处理符合某些标准的文件。你应该使用具有描述性的 `java.io.FileFilter`\
