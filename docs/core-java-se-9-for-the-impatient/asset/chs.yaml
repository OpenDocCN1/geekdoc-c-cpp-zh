  \ items = new ArrayList<>();\n    public void addItem(String description, int quantity,\
  \ double unitPrice) {\n        Item item = new Item(description, quantity, unitPrice);\n\
  \        items.add(item);\n    }\n}\n```\n\n由于 `warningString` 变量不是私有的，`java.awt`\
  \ 包中所有类的方法都可以访问它。实际上，除了 `Window` 类本身的方法外，没有其他方法可以这样做，所以程序员可能简单地忘记了加上 `private` 修饰符。\n\
  \n（注：由于原文提供的文本存在部分重复和截断，此处翻译已根据逻辑进行了对齐处理，并保留了所有 Markdown 格式。）\n\n\n\n\n\n```java\n\
  public Member enroll(String name) {\n    Member newMember = new Member(name);\n\
  \    members.add(newMember);\n    return newMember;\n}\n}\n```\n\n到目前为止，似乎并没有发生什么。我们可以添加一个成员并获取它的引用。\n\
  \n点击此处查看代码图片\n\n```java\nNetwork myFace = new Network();\nNetwork.Member fred =\
  \ myFace.enroll(\"Fred\");\n```\n\n现在，假设 Fred 觉得这不再是一个最火的社交网络了，所以想注销他的成员身份。\n\n\
  `fred.deactivate()`\n\n这里是 `deactivate` 方法的实现：\n\n点击此处查看代码图片\n\n```java\npublic\
  \ class Network {\n    public class Member {\n        ...\n        public void deactivate()\
  \ {\n            members.remove(this);\n        }\n    }\n    private ArrayList<Member>\
  \ members;\n    ...\n}\n```\n\n你可以看到，内部类的方法可以访问其外部类的实例变量。在这种情况下，它们是创建它的外部类对象的实例变量，即那个不受欢迎的\
  \ `myFace` 网络。\n\n这就是内部类不同于静态嵌套类的地方。每个内部类对象都拥有指向其外层类对象的引用。例如，该方法\n\n`members.remove(this);`\n\
  \n实际上意味着\n\n`outer.members.remove(this);`\n\n其中我使用 `outer` 来表示指向所包含类的隐藏引用。\n\n静态嵌套类没有这样一种引用（就像静态方法没有\
  \ `this` 引用一样）。当嵌套类的实例不需要知道它们属于外部类的哪一个实例时，请使用静态嵌套类。只有当此信息很重要时，才使用内部类。\n\n内部类还可以通过其外部类实例调用外部类的方法。例如，假设外部类有一个方法用于注销成员的身份。那么\
  \ `deactivate` 方法就可以调用它：\n\n点击此处查看代码图片\n\n```java\npublic class Network {\n    public\
  \ class Member {\n        ...\n        public void deactivate() {\n            unenroll(this);\n\
  \        }\n    }\n    private ArrayList<Member> members;\n    public Member enroll(String\
  \ name) { ... }\n    public void unenroll(Member m) { ... }\n    ...\n}\n```\n\n\
  在这种情况下，\n\n`unenroll(this);`\n\n实际上意味着\n\n`outer.unenroll(this);`\n\n### 2.6.3 内部类的特殊语法规则\n\
