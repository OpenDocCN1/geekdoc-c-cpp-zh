  \ 第 7 章 集合开发许多数据结构是为了让程序员能够高效地存储和检索值。在本章中，你将学习如何处理列表、集合、映射和其他集合。本章的要点如下：1.  `Collection`\
  \ 接口为所有集合提供了通用方法，但由 `Map` 接口描述的映射除外。2.  列表（list）是一种顺序访问的集合。3.  集合（set）是针对包含测试进行优化的。4.\
  \  对于映射（map），你可以选择 `HashMap` 或 `TreeMap` 实现。5.  视图（views）通过标准接口访问存储的数据。## 7.1 集合框架概述\
  \ Java 集合框架提供了常见数据结构的实现。为了方便编写独立于数据结构选择的代码，集合框架提供了一通用接口，如图 7-1 所示。基础接口是 `Collection`，其方法如表\
  \ 7-1 所示。![Image](img/0564.jpeg)\n**图 7-1** Java 集合框架中的接口\n\n**表 7-1** `Collection<E>`\
  \ 接口的方法\n\n| **方法** | **描述** |\n| :--- | :--- |\n| `boolean add(E e)` `boolean addAll(Collection<?\
  \ extends E> c)` | 添加 `e` 或 `c` 中的元素。如果集合发生变化则返回 `true`。 |\n| `boolean remove(Object\
  \ o)` `boolean removeAll(Collection<?> c)` `boolean retainAll(Collection<?> c)`\
  \ `boolean removeIf(Predicate<? super E> filter)` `void clear()` | 移除 `o`、`c` 中的元素、不在\
  \ `c` 中的元素、匹配过滤的元素或所有元素。前四个方法在集合发生变化时返回 `true`。 |\n| `int size()` | 返回集合中元素的数量。\
  \ |\n| `boolean isEmpty()` `boolean contains(Object o)` `boolean containsAll(Collection<?>\
  \ c)` | 如果集合为空、包含 `o` 或包含 `c` 中的所有元素，则返回 `true`。 |\n| `Iterator<E> iterator()` `Stream<E>\
  \ stream()` `Stream<E> parallelStream()` | |\n\n## 7.2 迭代器\n\n## 7.3 集合\n\n## 7.4\
  \ 映射\n\n## 7.5 其他集合\n\n## 7.6 视图\n\n## 7.7 练习题\n\n\n\n\n\n`Spliterator<E> spliterator()`\
  \ | 返回一个迭代器、流、或者可能是并行流，或者用于访问此集合中元素的 spliterator。迭代器请参阅第 7.2 节，流请参阅第 8 章。Spliterator\
  \ 仅对流的实现者感兴趣。 |\n\n| `Object[] toArray()` `T[] toArray(T[] a)` | 返回一个包含此集合元素的数组。如果\
  \ `a` 的长度足够，则第二个方法返回 `a`。 |\n\n`List` 是一个顺序集合：元素具有位置 0, 1, 2 等。表 7-2 显示了该接口的方法。\n\
  \n#### 表 7-2 `List` 接口\n\n| 方法 | 描述 |\n| :--- | :--- |\n| `boolean add(int index,\
  \ E e)` `boolean addAll(int index, Collection<? extends E> c)` `boolean add(E e)`\
  \ `boolean addAll(Collection<? extends E> c)` | 在 `index` 之前或末尾添加 `e` 或 `c` 中的元素。如果列表发生变化则返回\
  \ `true`。 |\n| `E get(int index)` `E set(int index, E element)` `E remove(int index)`\
  \ | 获取、设置或删除指定索引处的元素。最后两个方法返回调用前索引处的元素。 |\n| `int indexOf(Object o)` `int lastIndexOf(Object\
  \ o)` | 返回与 `o` 相等的第一个或最后一个元素的索引，如果没有匹配则返回 `-1`。 |\n| `ListIterator<E> listIterator()`\
  \ `ListIterator<E> listIterator(int index)` | 返回所有元素或从 `index` 开始的元素的列表迭代器。 |\n\
  | `void replaceAll(UnaryOperator<E> operator)` | 将每个元素替换为对该应用运算符的结果。 |\n| `void\
  \ sort(Comparator<? super E> c)` | 使用 `c` 提供的排序对此列表进行排序。 |\n| `static List<E> of(E...\
  \ elements)` | 返回一个包含给定元素的不可变列表。 |\n| `List<E> subList(int fromIndex, int toIndex)`\
  \ | 返回从 `fromIndex` 开始到 `toIndex` 结束之前的子列表视图（第 7.6 节）。 |\n\n`List` 接口由 `ArrayList`\
  \ 类（你在书中到处都见过它）和 `LinkedList` 类实现。如果你上过数据结构课程，你可能还记得链表——一组链接的节点，每个节点承载一个元素。在链表中间插入是非常快速的——你只需接入一个节点即可。但要到达中间，你必须从头开始跟随所有的链接，这很慢。链表有应用场景，但大多数应用程序程序员在需要顺序集合时可能会倾向于使用数组列表。尽管如此，`List`\
  \ 接口仍然有用。例如，`Collections.nCopies(n, o)` 方法返回一个包含 `n` 个对象 `o` 副本的 `List` 对象。该对象实际上在“作弊”，因为它并没有实际存储\
  \ `n` 份副本，而是当你询问其中任何一个时，它会返回 `o`。\n\n***\n\n![图像](img/00007.jpeg) 注意\n\n`List` 接口提供了访问列表第\
  \ n 个元素的方法，尽管这种访问可能并不高效。为了表明访问是高效的，集合类应该实现 `RandomAccess` 接口。这是一个没有方法的标记接口。例如，`ArrayList`\
  \ 实现了 `List` 和 `RandomAccess`，但 `LinkedList` 只实现了 `List` 接口。\n\n***\n\n在 `Set` 中，元素不会插入到特定位置，且不允许重复元素。`SortedSet`\
  \ 允许按排序顺序迭代，`NavigableSet` 具有寻找元素邻居的方法。你将在第 7.3 节“集合”（第 242 页）中学习关于集合。\n\n`Queue`\
  \ 保留插入顺序，但你只能在尾部插入元素并在头部移除元素（就像排队一样）。`Deque` 是双端队列，可以在两端进行插入和删除。\n\n所有集合接口都是泛型的，具有用于元素类型的类型参数（`Collection<E>`、`List<E>`\
  \ 等）。`Map<K, V>` 接口具有用于键类型的类型参数 `K` 和用于值类型的类型参数 `V`。\n\n鼓励你在代码中尽可能使用接口。例如，在构造一个\
  \ `ArrayList` 后，将引用存储在类型为 `List` 的变量中：\n\n点击此处查看代码图像\n\n```\nList<String> words\
  \ = new ArrayList<>();\n```\n\n每当你实现一个处理集合的方法时，请使用限制性最少的接口作为参数类型。通常，一个 `Collection`、`List`\
  \ 或 `Map` 就足够了。\n\n集合框架的优势之一是在处理常用算法时，你不需要重新发明轮子。一些基本算法（如 `addAll` 和 `removeIf`）是\
  \ `Collection` 接口的方法。`Collections` 工具类包含了许多操作各种类型集合的额外算法。\n\n#### 表 7-3 `Collections`\
  \ 有用方法\n\n| 方法（静态） | 描述 |\n| :--- | :--- |\n| `boolean disjoint(Collection<?> c1,\
  \ Collection<?> c2)` | 如果两个集合没有共同元素则返回 `true`。 |\n| `boolean addAll(Collection<?\
  \ super T> c, T... elements)` | 将 `elements` 添加到 `c`。 |\n| `void copy(List<? super\
  \ T> dest, List<? extends T> src)` | 将 `src` 复制到 `dest`（必须至少包含 `src`）。 |\n| `boolean\
  \ replaceAll(List<T> list, T oldVal, T newVal)` | 将所有的 `oldVal` 替换为 `newVal`，如果至少有一个匹配则返回\
  \ `true`。 |\n| `void fill(List<? super T> list, T obj)` | 将列表的所有元素设置为 `obj`。 |\n\
  | `List<T> nCopies(int n, T o)` | 返回包含 `n` 个 `o` 副本的列表。 |\n| `int frequency(Collection<?>\
  \ c, Object o)` | `c` 中等于 `o` 的元素个数。 |\n| `int indexOfList(List<?> source, List<?>\
  \ target)` `int lastIndexOfList(List<?> source, List<?> target)` | 返回 `target` 列表在\
  \ `source` 中首次或最后出现的位置，如果没有则返回 `-1`。 |\n| `int binarySearch(List<? extends Comparable\
  \ super T>> list, T key)` `int binarySearch(List<? extends T> list, T key, Comparator<?\
  \ super T> c)` | 假设列表按自然顺序或 `c` 排序，返回 `key` 的位置。如果不存在，返回 `-i-1`，其中 `i` 是应插入的位置。\
  \ |\n| `void sort(List<T> list)` `void sort(List<T> list, Comparator<? super T>\
  \ c)` | 使用自然顺序或 `c` 对列表排序。 |\n| `void swap(List<?> list, int i, int j)` | 交换指定位置元素。\
  \ |\n| `void rotate(List<?> list, int distance)` | 旋转列表，将索引为 `i` 的元素移动到 `(i + distance)\
  \ % list.size()`。 |\n| `void reverse(List<?> list)` `void shuffle(List<?> list)`\
  \ `void shuffle(List<?> list, Random rnd)` | 反转或随机洗牌列表。 |\n| `synchronized(Collection<T>\
  \ | List<T> | Set<T> | SortedSet<T> | NavigableSet<T> | Map<K, V> | SortedMap<K,\
  \ V> | NavigableMap<K, V>)` | 返回一个同步视图（参见第 7.6 节）。 |\n| `unmodifiable(Collection<T>\
  \ | List<T> | Set<T> | SortedSet<T> | NavigableSet<T> | Map<K, V> | SortedMap<K,\
  \ V> | NavigableMap<K, V>)` | 返回一个不可变视图（参见第 7.6 节）。 |\n| `checked(Collection<T>\
  \ | List<T> | Set<T> | SortedSet<T> | NavigableSet<T> | Map<K, V> | SortedMap<K,\
  \ V> | NavigableMap<K, V> | Queue<T>)` | 返回一个检查视图（参见第 7.6 节）。 |\n\n### 7.2 Iterators\n\
  \n每个集合都提供了一种以某种顺序遍历其元素的方法。`Collection` 的父接口 `Iterable<T>` 定义了一个方法\n\n```\nIterator<T>\
  \ iterator()\n```\n\n\n\n\n它产生一个迭代器，你可以使用它来访问所有元素。\n\n点击此处查看代码图片\n\n```java\nCollection<String>\
  \ coll = ...;\n\nIterator<String> iter = coll.iterator();\n\nwhile (iter.hasNext())\
  \ {\n    String element = iter.next();\n    Process `element`\n}\n```\n\n在这种情况下，你可以简单地使用增强型\
  \ `for` 循环：\n\n```java\nfor (String element : coll)  {\n    Process `element`\n\
  }\n```\n\n***\n\n![Image](img/00003.jpeg) 注意\n\n对于任何实现了 `Iterable<E>` 接口的类对象 `c`，增强型\
  \ `for` 循环会被翻译为上述的形式。\n\n******\n\n`Iterator` 接口还有一个 `remove` 方法，用于移除上一次访问的元素。此循环删除了所有符合条件的元素：\n\
  \n点击此处查看代码图片\n\n```java\nwhile (iter.hasNext()) {\n    String element = iter.next();\n\
  \    if (element fulfills the condition)\n        iter.remove();\n}\n```\n\n然而，使用\
  \ `removeIf` 方法更简单：\n\n点击此处查看代码图片\n\n```java\ncoll.removeIf(e -> e fulfills the\
  \ condition);\n```\n\n***\n\n![Image](img/00007.jpeg) 注意\n\n`remove` 方法移除的是迭代器最近返回的那个元素，而不是迭代器当前指向的元素。你不能在没有中间调用\
  \ `next` 或 `previous` 的情况下连续调用两次 `remove`。\n\n***\n\n`ListIterator` 接口是 `Iterator`\
  \ 的子接口，它具有在迭代器之前添加元素、将已访问的元素设置为不同值以及向后导航的方法。它主要用于处理链表表。\n\n点击此处查看代码图片\n\n```java\n\
  List<String> friends = new LinkedList<>();\n\nListIterator<String> iter = friends.listIterator();\n\
  \niter.add(\"Fred\"); // Fred |\n\niter.add(\"Wilma\"); // Fred Wilma |\n\niter.previous();\
  \ // Fred | Wilma\n\niter.set(\"Barney\"); // Fred | Barney\n```\n\n***\n\n![Image](img/00007.jpeg)\
  \ 注意\n\n如果你有多个迭代器正在访问同一个数据结构，并且其中一个对其进行了修改，其他的迭代器可能会失效。如果你继续使用失效的迭代器，可能会抛出 `ConcurrentModificationException`。\n\
  \n***\n\n### 7.3 集合 (Sets)\n\n集合可以高效地测试一个值是否为元素，但它也牺牲了一些东西：它不记录元素被添加的顺序。在顺序不重要的情况下，集合是非常有用的。例如，如果你想不允许一组坏词作为用户名，那么这些词的顺序并不重要。你只需要知道提议的用户名是否在集合中。\n\
  \n`Set` 接口由 `HashSet` 和 `TreeSet` 类实现。在内部，这些类使用了完全不同的实现方式。如果你上过数据结构课程，你可能知道如何实现哈希表和二叉树——但你可以在了解它们内部机制的情况下使用这些类。\n\
  \n通常，如果你为元素准备了良好的 `hash function`，哈希集合会更高效。像 `String` 或 `Path` 这样的库类拥有良好的哈希函数。你已经在\
  \ 第 4 章 中学习了如何为自己的类编写哈希函数。\n\n例如，那个坏词集合可以简单地实现为\n\n点击此处查看代码图片\n\n```java\nSet<String>\
  \ badWords = new HashSet<>();\n\nbadWords.add(\"sex\");\n\nbadWords.add(\"drugs\"\
  );\n\nbadWords.add(\"c++\");\n\nif (badWords.contains(username.toLowerCase()))\n\
  \    System.out.println(\"Please choose a different user name\")\n```\n\n如果你想按排序顺序遍历集合，可以使用\
  \ `TreeSet`。你可能想这样做的原因之一是向用户展示排序后的选项列表。\n\n集合的元素类型必须实现 `Comparable` 接口，或者需要在构造函数中提供一个\
  \ `Comparator`。\n\n点击此处查看代码图片\n\n```java\nTreeSet<String> countries = new TreeSet<>();\
  \ // 按排序顺序访问已添加的国家\n\ncountries = new TreeSet<>((u, v) ->\n    u.equals(v) ? 0\n\
  \    : u.equals(\"USA\") ? -1\n    : v.equals(\"USA\") ? 1\n    : u.compareTo(v));\n\
  \    // USA 始终在前\n```\n\n`TreeSet` 类实现了 `SortedSet` 和 `NavigableSet` 接口，其方法在表 7-4\
  \ 和 7-5 所示。\n\n**表 7-4** `SortedSet<E>`\n\n| 方法 | 说明 |\n| :--- | :--- |\n| `first()`\
  \ `last()` | 此集合中的第一个和最后一个元素。 |\n| `headSet(E toElement)` `subSet(E fromElement,\
  \ toElement)` | 从 `fromElement` 开始到 `toElement` 结束的视图。 |\n\n**表 7-5** `NavigableSet<E>`\n\
  \n| 方法 | 说明 |\n| :--- | :--- |\n| `higher(E e)` `ceiling(E e)` `floor(E e)` | 返回大于、大于等于或小于\
  \ e 的元素。 |\n| `pollFirst()` `pollLast()` | 移除并返回第一个或最后一个元素，如果为空则返回 null。 |\n| `headSet(E\
  \ toElement, boolean inclusive)` | 返回到 `toElement` 的视图（包含或不包含）。 |\n\n### 7.4 映射\
  \ (Maps)\n\n映射存储键和值之间的关联。调用 `put` 添加新关联或更改现有键的值。此示例使用了哈希映射，如下所示获取键关联的值：\n\n点击此处查看代码图片\n\
  \n```java\nMap<String, Integer> counts = new HashMap<>();\n```\n\n如果键不存在，`get` 方法返回\
  \ `null`。在这个示例中，当值被解箱时会导致 `NullPointerException`。更好的替代方案是\n\n点击此处查看代码图片\n\n```java\n\
  int count = counts.getOrDefault(\"Alice\", 0);\n```\n\n这样如果键不存在则返回 `0`。\n\n当你更新映射中的计数器时，你首先需要检查计数器是否存在，如果存在，给现有值加\
  \ 1。`merge` 方法简化了这种常见操作。调用点击此处查看代码图片\n\n```java\ncounts.merge(word, 1, Integer::sum);\n\
  ```\n\n如果键之前不存在，则与 `word` 关联 1；否则使用 `Integer::sum` 函数合并之前的值和 1。\n\n表 7-6 总结了映射的操作。\n\
  \n**表 7-6** `Map<K, V>`\n\n| 方法 | 说明 |\n| :--- | :--- |\n| `get(Object key)` `getOrDefault(Object\
  \ key, V defaultValue)` | 如果键关联了非空值 `v`，则返回 `v`。否则，返回 `null` 或 `defaultValue`。 |\n\
  | `put(K key, V value)` | 如果键关联了非空值 `v`，则将 `key` 关联 `value` 并返回 `v`。否则，添加元素并返回 `null`。\
  \ |\n| `putIfAbsent(K key, V value)` | 如果键关联了非空值 `v`，则忽略 `value` 并返回 `v`。否则，添加元素并返回\
  \ `null`。 |\n| `merge(K key, V value, BiFunction<    ? super V,? super V,? extends\
  \ V>    remappingFunction)` | 如果键关联了非空值 `v`，则将函数应用于 `v` 和 `value`，并将 `key` 关联到结果；如果结果为\
  \ `null`，则删除该键。否则，将 `key` 关联 `value`。返回 `get(key)`。 |\n| `compute(K key, BiFunction<\
  \    ? super K,? super V,? extends V> | |\n\n\n\n\n\n`remappingFunction)` | 将函数应用到\
  \ `key` 和 `get(key)`。将 `key` 与结果关联，或者如果结果为 `null`，则移除该键。返回 `get(key)`。 |\n\n| `V\
  \ computeIfPresent(K key, BiFunction<? super K, ? super V, ? extends V> remappingFunction)`\
  \ | 如果 `key` 关联了一个非-`null` 值 `v`，则将函数应用到 `key` 和 `v`，并将 `key` 与结果关联，或者如果结果为 `null`，则移除该键。返回\
  \ `get(key)`。 |\n\n| `V computeIfAbsent(K key, Function<? super K, ? extends V>\
  \ mappingFunction)` | 除非 `key` 关联了一个非-`null` 值，否则将函数应用到 `key`。将 `key` 与结果关联，或者如果结果为\
  \ `null`，则移除该键。返回 `get(key)`。 |\n\n| `void putAll(Map<? extends K, ? extends V>\
  \ m)` | 添加来自 `m` 中的所有条目。 |\n\n| `V remove(Object key)` `V replace(K key, V newValue)`\
  \ | 移除键及其关联的值，或替换旧值。返回旧值，如果不存在则返回 `null`。 |\n\n| `boolean remove(Object key, Object\
  \ value)` `boolean replace(K key, V value, V newValue)` | 只要 `key` 关联了 `value`，就移除该条目或替换旧值并返回\
  \ `true`。否则，什么都不做并返回 `false`。这些方法在并发访问 map 时主要很有价值。 |\n\n| `int size()` | 返回条目的数量。\
  \ |\n\n| `boolean isEmpty()` | 检查此 map 是否为空。 |\n\n| `void clear()` | 移除所有条目。 |\n\
  \n| `void forEach(BiConsumer<? super K, ? super V> action)` | 将操作应用到所有条目。 |\n\n\
  | `void replaceAll(BiFunction<? super K, ? super V, ? extends V> function)` | 在所有条目上调用函数。将键与非-`null`\
  \ 结果关联，并移除结果为 `null` 的键。 |\n\n| `boolean containsKey(Object key)` `boolean containsValue(Object\
  \ value)` | 检查 map 是否包含指定的键或值。 |\n\n| `Set<K> keySet()` `Collection<V> values()`\
  \ `Set<Map.Entry<K, V>> entrySet()` | 返回键、值和条目的视图。 |\n\n| `static Map<K, V> of()`\
  \ `static Map<K, V> of(K k1, V v1)` `static Map<K, V> of(K k1, V v1, K k2, V v2)`\
  \ ... | 生成一个包含最多十个键对的不可修改 map。 |\n\n你可以通过调用这些方法获取 map 的键、值和条目的视图：\n\n```\nSet<K>\
  \ keySet()\nSet<Map.Entry<K, V>> entrySet()\nCollection<V> values()\n```\n\n返回的集合不是\
  \ map 数据的拷贝，但它们与 map 是连接的。如果你从视图中移除一个键或条目，那么该条目也会从底层 map 中移除。\n\n要遍历 map 的所有键和值，你可以遍历\
  \ `entrySet` 方法返回的集合：\n\n点击此处查看代码图片\n\n```\nfor (Map.Entry<String, Integer> entry\
  \ : counts.entrySet()) {\n    String k = entry.getKey();\n    Integer v = entry.getValue();\n\
  \    Process `k`, `v`\n}\n```\n\n或者简单使用 `forEach` 方法：\n\n```\ncounts.forEach((k,\
  \ v) -> {\n    Process `k`, `v`\n});\n```\n\n***\n\n![Image](img/00007.jpeg) 注意事项\n\
  \n某些 map 实现（例如 `ConcurrentHashMap`）不允许键或值为 `null`。对于那些允许 `null` 的实现（如 `HashMap`），如果你确实使用\
  \ `null` 值，则需要非常小心。许多 map 方法会将 `null` 值解释为条目不存在或应该被移除的指示。\n\n***\n\n***\n\n![Image](img/00009.jpeg)\
  \ 提示\n\n有时，你需要以不同于排序的顺序展示 map 键。例如，在 JavaServer Faces 框架中，你用 map 来指定选择框的标签和值。如果选项按字母顺序（周五、周一、周六、周日、周四、周二、周三）或哈希码顺序排序，用户会感到惊讶。在这种情况下，请使用\
  \ `LinkedHashMap`，它会记住条目添加的顺序并按照该顺序进行迭代。\n\n***\n\n## 7.5 其他集合\n\n在接下来的章节中，我简要讨论了一些你可能在实践中发现有用的集合类。\n\
  \n#### 7.5.1 Properties\n\n`Properties` 类实现了一个 map，可以使用纯文本格式轻松地保存和加载。此类 map 通常用于存储程序的配置选项。例如：\n\
  \n点击此处查看代码图片\n\n```\nProperties settings = new Properties();\nsettings.put(\"width\"\
  , \"200\");\nsettings.put(\"title\", \"Hello, World!\");\ntry (OutputStream out\
  \ = Files.newOutputStream(path)) {\n    settings.store(out, \"Program Properties\"\
  );\n}\n```\n\n结果是如下文件：\n\n```text\n# Program Properties\nwidth=200\ntitle=Hello,\
  \ World!\n```\n\n***\n\n![Image](img/00003.jpeg) 注意\n\n某些 map 实现（例如 `ConcurrentHashMap`）不允许键或值为\
  \ `null`。对于那些允许 `null` 的实现（如 `HashMap`），如果你确实使用 `null` 值，则需要非常小心。许多 map 方法会将 `null`\
  \ 值解释为条目不存在或应该被移除的指示。\n\n***\n\n***\n\n![Image](img/00009.jpeg) 提示\n\n有时，你需要以不同于排序的顺序展示\
  \ map 键。例如，在 JavaServer Faces 框架中，你用 map 来指定选择框的标签和值。如果选项按字母顺序（周五、周一、周六、周日、周四、周二、周三）或哈希码顺序排序，用户会感到惊讶。在这种情况下，请使用\
  \ `LinkedHashMap`，它会记住条目添加的顺序并按照该顺序进行迭代。\n\n***\n\n## 7.5 其他集合\n\n在接下来的章节中，我简要讨论了一些你可能在实践中发现有用的集合类。\n\
  \n#### 7.5.1 Properties\n\n`Properties` 类实现了一个 map，可以使用纯文本格式轻松地保存和加载。此类 map 通常用于存储程序的配置选项。例如：\n\
  \n点击此处查看代码图片\n\n```\nProperties settings = new Properties();\nsettings.put(\"width\"\
  , \"200\");\nsettings.put(\"title\", \"Hello, World!\");\ntry (OutputStream out\
  \ = Files.newOutputStream(path)) {\n    settings.store(out, \"Program Properties\"\
  );\n}\n```\n\n结果是如下文件：\n\n```text\n# Program Properties\nwidth=200\ntitle=Hello,\
  \ World!\n```\n\n***\n\n![Image](img/00003.jpeg) 注意\n\n某些 map 实现（例如 `ConcurrentHashMap`）不允许键或值为\
  \ `null`。对于那些允许 `null` 的实现（如 `HashMap`），如果你确实使用 `null` 值，则需要非常小心。许多 map 方法会将 `null`\
  \ 值解释为条目不存在或应该被移除的指示。\n\n`System.getProperties()` 方法产生一个包含系统属性的 `Properties` 对象。Table\
  \ 7-7 描述了最有用的。\n\n**Table 7-7** 有用的系统属性\n\n| **属性键** | **描述** |\n| :--- | :--- |\n\
  | `user.dir` | 虚拟机的当前工作目录 |\n| `user.home` | 用户主目录 |\n| `user.name` | 用户账户 |\n|\
  \ `java.version` | 运行时版本 |\n| `java.home` | Java 安装目录 |\n| `java.class.path` | 启动\
  \ VM 的类路径 |\n| `java.io.tmpdir` | 临时目录（如 `/tmp`） |\n| `os.name` | 操作系统名称（如 `Linux`）\
  \ |\n| `os.arch` | 操作系统架构（如 `amd64`） |\n| `os.version` | 操作系统版本（如 `3.13.0-generic`）\
  \ |\n| `file.separator` | 文件分隔符（Unix 为 `/`，Windows 为 `\\`） |\n| `path.separator`\
  \ | 路径分隔符（Unix 为 `:`，Windows 为 `;`） |\n| `line.separator` | 换行符（Unix 为 `\\n`，Windows\
  \ 为 `\\r\\n`） |\n\n***\n\n#### 7.5.2 Bit Sets\n\n`BitSet` 类存储位序列。位集将位打包到 `long`\
  \ 数组中，因此使用位集比使用 `boolean` 数组更高效。位集适用于标志位序列或非负整数集合，其中第 i 位为 1 表示 i 在集合中。\n\n`BitSet`\
  \ 类提供了方便的方法来设置单个位。这比在 `int` 或 `long` 变量中存储位所需的位操作要简单得多。还有对所有位进行操作以执行集合运算的方法，并集和交集。完整列表请参见\
  \ Table 7-8。注意 `BitSet` 类不是集合类——它没有实现 `Collection<Integer>`。\n\n**Table 7-8** `BitSet`\
  \ 类的方法\n\n| **方法** | **描述** |\n| :--- | :--- |\n| `BitSet()` `BitSet(int nbits)`\
  \ | 构建一个初始可以包含 64 个或 `nbits` 个位的位集。 |\n| `void set(int bitIndex)` `void set(int\
  \ fromIndex, int toIndex)` | |\n\n\n\n\n\n`void set(int bitIndex, boolean value)`\n\
  \n`void set(int fromIndex, int toIndex, boolean value)` | 将指定索引或从 `fromIndex`（包含）到\
  \ `toIndex`（不包含）的位设置为 `1` 或给定的值。\n\n`void clear(int bitIndex)`\n`void clear(int\
  \ fromIndex, int toIndex)`\n`void clear()` | 将指定索引或从 `fromIndex`（包含）到 `toIndex`（不包含）或所有位设置为\
  \ `0`。\n\n`void flip(int bitIndex)`\n`void flip(int fromIndex, int toIndex)` | 反转指定索引或从\
  \ `fromIndex`（包含）到 `toIndex`（不包含）的位。\n\n`boolean get(int bitIndex)`\n`BitSet get(int\
  \ fromIndex, int toIndex)` | 获取指定索引或从 `fromIndex`（包含）到 `toIndex`（不包含）的位。\n\n`int\
  \ nextSetBit(int fromIndex)`\n`int previousSetBit(int fromIndex)`\n`int nextClearBit(int\
  \ fromIndex)`\n`int previousClearBit(int fromIndex)` | 返回下一个/上一个 `1`/`0` 位的索引，如果不存在则返回\
  \ -1。\n\n`void and(BitSet set)`\n`void andNot(BitSet set)`\n`void or(BitSet set)`\n\
  `void xor(BitSet set)` | 与 `set` 形成交集|差集|并集|对称差。\n\n`int cardinality()` | 返回此位集中\
  \ `1` 位的数量。**注意：** `size` 方法返回的是位向量的大小，而不是集合的大小。\n\n`byte[] toByteArray[]`\n`long[]\
  \ toLongArray[]` | 将此位集的位封装到数组中。\n\n`IntStream stream()`\n`String toString()` |\
  \ 返回此位集中整数（即 `1` 位的索引）的流或字符串。\n\n`static BitSet valueOf(byte[] bytes)`\n`static\
  \ BitSet valueOf(long[] longs)`\n`static BitSet valueOf(ByteBuffer bb)`\n`static\
  \ BitSet valueOf(LongBuffer lb)` | 生成一个包含所提供位的位集。\n\n`boolean isEmpty()`\n`boolean\
  \ intersects(BitSet set)` | 检查此位集是否为空，或者与 `set` 是否公共元素。\n\n### 7.5.3 枚举集合和映射\n\n\
  如果你需要收集枚举值的集合，请使用 `EnumSet` 类而不是 `BitSet`。`EnumSet` 类没有公共构造函数。使用静态工厂方法来构建集合：\n\n\
  点击此处查看代码图片\n\n```\nenum Weekday { MONDAY, TUESDAY, WEDNESDAY, THURSDAY, FRIDAY,\
  \ SATURDAY, SUNDAY };\n\nSet<Weekday> always = EnumSet.allOf(Weekday.class);\nSet<Weekday>\
  \ never = EnumSet.noneOf(Weekday.class);\nSet<Weekday> workday = EnumSet.range(Weekday.MONDAY,\
  \ Weekday.FRIDAY);\nSet<Weekday> mwf = EnumSet.of(Weekday.MONDAY, Weekday.WEDNESDAY,\
  \ Weekday.FRIDAY);\n```\n\n你可以使用 `Set` 接口的方法来操作 `EnumSet`。\n\n`EnumMap` 是一个键属于某个枚举类型的映射。它被实现为值的数组。你可以在构造函数中指定键类型：\n\
  \n点击此处查看代码图片\n\n```\nEnumMap<Weekday, String> personInCharge = new EnumMap<>(Weekday.class);\n\
  personInCharge.put(Weekday.MONDAY, \"Fred\");\n```\n\n### 7.5.4 栈、队列、双端队列和优先级队列\n\
  \n栈（Stack）是一种在某一端（栈的“顶部”）添加和删除元素的数据结构。队列（Queue）允许你高效地在的一端（尾部）添加元素并在另一端（头部）删除。双端队列（Deque）支持在两端插入和删除。在所有这些数据结构中都不支持在中间添加元素。\n\
  \n`Queue` 和 `Deque` 接口定义了这些数据结构的方法。Java 框架中没有 `Stack` 接口，只有一个 Java 早期的遗留 `Stack`\
  \ 类，你应该避免使用。如果你需要栈、队列或双端队列且不担心线程安全，请使用 `ArrayDeque`。\n\n使用栈时，使用 `push` 和 `pop` 方法。\n\
  \n点击此处查看代码图片\n\n```\nArrayDeque<String> stack = new ArrayDeque<>();\nstack.push(\"\
  Peter\");\nstack.push(\"Paul\");\nstack.push(\"Mary\");\n\nwhile (!stack.isEmpty())\n\
  \    System.out.println(stack.pop());\n```\n\n使用队列时，使用 `add` 和 `remove`。\n\n点击此处查看代码图片\n\
  \n```\nQueue<String> queue = new ArrayDeque<>();\nqueue.add(\"Peter\");\nqueue.add(\"\
  Paul\");\n```\n\n\n\n\n\n点击此处查看代码图片\n\n```java\nMap<String, Integer> scores = Map.of(\"\
  Peter\", 2, \"Paul\", 3, \"Mary\", 5);\n```\n\n元素、键或值不能为 `null`。\n\n`List` 和 `Set`\
  \ 接口拥有 11 个 `of` 方法接受 0 到 10 个参数，以及一个接受变长参数的 `of` 方法。为了效率，提供了这些特化实现。\n\n对于 `Map`\
  \ 接口，无法提供变长参数的版本，因为参数类型在键和值类型之间交替。有一个静态方法 `ofEntries`，它可以接受任意数量的 `Map.Entry<K, V>`\
  \ 对象，你可以使用静态方法 `entry` 来创建这些对象。例如，\n\n点击此处查看代码图片\n\n```java\nimport static java.util.Map.*;\n\
  \n...\n\nMap<String, Integer> scores = ofEntries(\n    entry(\"Peter\", 2),\n  \
  \  entry(\"Paul\", 3),\n    entry(\"Mary\", 5));\n```\n\n`of` 和 `ofEntries` 方法产生的对象具有每个元素的实例变量，或者由数组支持。\n\
  \n这些集合对象是**不可修改的**（`unmodifiable`）。任何试图更改其内容的尝试都会导致 `UnsupportedOperationException`。\n\
  \n如果你需要一个可变的集合，可以将不可修改的集合传递给构造函数：\n\n点击此处查看代码图片\n\n```java\nList<String> names =\
  \ new ArrayList<>(List.of(\"Peter\", \"Paul\", \"Mary\"));\n```\n\n***\n\n![Image](img/00003.jpeg)\
  \ 注意\n\n还有一个静态的 `Arrays.asList` 方法，它与 `List.of` 。它返回一个可变但不可调整大小的列表。也就是说，你可以对列表调用\
  \ `set`，但不能调用 `add` 或 `remove`。\n\n***\n\n### 7.6.2 范围 (Ranges)\n\n你可以形成列表的子列表视图。例如，\n\
  \n点击此处查看代码图片\n\n```java\nList<String> sentence = ...;\n\nList<String> nextFive =\
  \ sentence.subList(5, 10);\n```\n\n此视图访问索引从 5 到 9 的元素。子列表的任何变异（如设置、添加或删除元素）都会影响原始。\n\
  \n对于排序集合和映射，你通过下界和上界指定范围：\n\n点击此处查看代码图片\n\n```java\nTreeSet<String> words = ...;\n\
  \nSortedSet<String> asOnly = words.subSet(\"a\", \"b\");\n```\n\n与 `subList` 类似，第一个边界是包含的，第二个边界是排外的。\n\
  \n`headSet` 和 `tailSet` 方法产生一个没有下界或上界的子范围。\n\n点击此处查看代码图片\n\n```java\nNavigableSet<String>\
  \ nAndBeyond = words.tailSet(\"n\");\n```\n\n在 `NavigableSet` 接口中，你可以为每个边界选择其应该是包含的还是排外的——参见表\
  \ 7-5。\n\n对于排序映射，有对应的方法 `subMap`、`headMap` 和 `tailMap`。\n\n### 7.6.3 不可修改视图 (Unmodifiable\
  \ Views)\n\n有时，你想共享集合的内容，但又不希望它被修改。当然，你可以将值复制到新集合中，但这可能是昂贵的。不可修改视图是一个更好的选择。这里是一个典型的情况：一个\
  \ `Person` 对象维护一个朋友列表。如果 `getFriends` 出了该列表的引用，调用者就可以修改它。但提供一个不可修改的列表视图是安全的：\n\n\
  点击此处查看代码图片\n\n```java\npublic class Person {\n    private ArrayList<Person> friends;\n\
  \n    public List<Person> getFriends() {\n        return Collections.unmodifiableList(friends);\n\
  \    }\n\n    ...\n}\n```\n\n所有变异方法在不可修改视图上被调用时都会抛出异常。\n\n如你从表 7-3 所示，你可以获取集合、列表、集合、排序集合、导航集合、映射、排序映射和导航映射的不可修改视图。\n\
  \n***\n\n![Image](img/00003.jpeg) 注意\n\n在第 6 章中，你看到了如何将错误类型的元素混入泛型集合中（这种现象被称为“堆污染”），并且在检索不适当元素时会报告运行时错误，而不是在插入时。如果你需要调试此类问题，请使用\
  \ `unmodifiable`。\n\n### 练习题\n\n1. 实现“埃拉托尼筛法”算法来确定所有 ≤ n 的质数。使用 `BitSet`。\n\n2.\
