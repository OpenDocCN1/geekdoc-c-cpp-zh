  \n点击此处查看代码图片\n\n```java\nString message = String.format(\"Hello, %s. Next year,\
  \ you'll be %d.\\n\", name, age);\n```\n\n## 1.7 控制流\n\n在接下来的章节中，你将看到如何实现分支和循环。控制流语句的\
  \ Java 语法与其他常用语言非常相似，特别是 C/C++ 和 JavaScript。\n\n### 1.7.1 分支\n\n`if` 语句在括号内有一个条件，后面跟一个语句或一组括号。点击此处查看代码图片\n\
  \n```java\nif (count > 0) {\n    double average = sum / count;\n    System.out.println(average);\n\
  }\n```\n\n如果条件不满足，可以有一个 `else` 分支。点击此处查看代码图片\n\n```java\nif (count > 0) {\n    double\
  \ average = sum / count;\n    System.out.println(average);\n} else {\n    System.out.println(0);\n\
  }\n```\n\n`else` 分支中的语句可以是另一个 `if` 语句：点击此处查看代码图片\n\n```java\nif (count > 0) {\n\
  \    double average = sum / count;\n    System.out.println(average);\n} else if\
  \ (count == 0) {\n    System.out.println(0);\n} else {\n    System.out.println(\"\
  Huh?\");\n}\n```\n\n当你需要对有限数量的常量值测试表达式时，使用 `switch` 语句。点击此处查看代码图片\n\n```java\nswitch\
  \ (count) {\n    case 0:\n        output = \"None\";\n        break;\n    case 1:\n\
  \        output = \"One\";\n        break;\n    case 2:\n    case 3:\n    case 4:\n\
  \    case 5:\n        output = Integer.toString(count);\n        break;\n    default:\n\
  \        output = \"Many\";\n        break;\n}\n```\n\n执行从匹配的 `case` 标签开始，如果没有匹配，则从\
  \ `default` 标签开始（如果存在）。执行所有语句直到遇到 `break` 或到达 `switch` 语句结束。![Image](img/00007.jpeg)\
  \ 注意忘记 `break` 是常见的错误。此时执行会“贯穿”到下一个分支。你可以通过命令行选项让编译器留意此类 bug：点击此处查看代码图片\n\n```bash\n\
  javac -Xlint:fallthrough mypackage/MainClass.java\n```\n\n使用此选项，当分支没有以 `break` 或\
  \ `return` 语句结束时，编译器将发出警告信息。如果你确实想使用贯穿行为，请在该方法上标记 `@SuppressWarnings(\"fallthrough\"\
  )`。这样该方法就不会生成警告。（注解为编译器或其他工具提供信息。你将在第 11 章学习有关注解的所有知识。）在前例中，`case` 标签是整数。你可以使用以下类型的值：\n\
  \n- `char`、`byte`、`short` 或 `int` 的常量表达式（或它们对应的包装类 `Character`、`Byte`、`Short` 和\
  \ `Integer`，将在 1.8.3 节 “数组列表”，第 45 页）中介绍）\n- 字符串字面量\n- 枚举值（见第 4 章\n\n```java\nRandom\
  \ generator = new Random();\n```\n\n此调用会获取一个 0 到 9 之间的随机整数：点击此处查看代码图片\n\n```java\n\
  int next = generator.nextInt(10);\n```\n\n以下是形成和的循环：点击此处查看代码图片\n\n```java\nwhile\
  \ (sum < target) {\n    int next = generator.nextInt(10);\n    sum += next;\n  \
  \  count++;\n}\n```\n\n这是 `while` 循环的典型用法。当和小于目标时，循环继续执行。\n\n有时，你需要在评估条件之前执行循环体。假设你想找出获取某个特定值需要多久。在测试该条件之前，你需要进入循环并获取该值。在这种情况下，请使用\
  \ `do`/`while` 循环：点击此处查看代码图片\n\n```java\nint next;\ndo {\n    next = generator.nextInt(10);\n\
  \    count++;\n} while (next != target);\n```\n\n进入循环体并为 `next` 赋值。只要条件满足，就会重复循环体。\n\
  \n\n\n\n在前面的示例中，循环的迭代次数是不可知的。然而，在实践中出现的很多循环中，迭代次数是固定的。在这些情况下，使用 `for` 循环是最佳的。\n\n\
  此循环计算了固定数量随机值的总和：\n\n点击此处查看代码图片\n\n```java\nfor (int i = 1; i <= 20; i++) {\n  \
  \  int next = generator.nextInt(10);\n    sum += next;\n}\n```\n\n该循环运行 20 次，在每次循环迭代中，`i`\
  \ 分别设置为 1、2、`...`、20。\n\n你可以将任何 `for` 循环重写为 `while` 循环。上面的循环等同于：\n\n点击此处查看代码图片\n\
  \n```java\nint i = 1;\nwhile (i <= 20) {\n    int next = generator.nextInt(10);\n\
  \    sum += next;\n    i++;\n}\n```\n\n然而，使用 `while` 循环时，变量 `i` 的初始化、测试和更新分散在不同的地方。而使用\
  \ `for` 循环时，它们保持整齐地聚集在一起。\n\n初始化、测试和更新可以采取任意的形式。例如，你可以在值小于目标值时将其翻倍：\n\n点击此处查看代码图片\n\
  \n```java\nfor (int i = 1; i < target; i *= 2) {\n    System.out.println(i);\n}\n\
  ```\n\n与其在 `for` 循环的头部声明变量，不如初始化一个已有的变量：\n\n点击此处查看代码图片\n\n```java\nfor (i = 1; i\
  \ <= target; i++) // 使用已有的变量 `i`\n```\n\n你可以声明或初始化多个变量，并提供多个更新，用逗号隔开。例如：\n\n点击此处查看代码图片\n\
  \n```java\nfor (int i = 0, j = n - 1; i < j; i++, j--)\n```\n\n如果不需要初始化或更新，请将其留空。如果你省略了条件，它被认为始终为\
  \ `true`。\n\n```java\nfor (;;) // 一个无限循环\n```\n\n你将在下一节中看到如何跳出此类循环。\n\n### 1.7.3\
  \ 跳出 (break) 和 继续 (continue)\n\n如果你想在循环中间退出循环，可以使用 `break` 语句。例如，假设你想处理单词，直到用户输入字母\
  \ Q 为止。这里有一个使用 `boolean` 变量控制循环的解决方案：\n\n```java\nboolean done = false;\nwhile (!done)\
  \ {\n    String input = in.next();\n    if (\"Q\".equals(input)) {\n        done\
  \ = true;\n    } else {\n        Process input\n    }\n}\n```\n\n这个循环使用 `break`\
  \ 语句执行相同的任务：\n\n点击此处查看代码图片\n\n```java\nwhile (true) {\n    String input = in.next();\n\
  \    if (input.equals(\"Q\")) break; // 退出循环\n    Process input\n}\n// `break` 跳到这里\n\
  ```\n\n当遇到 `break` 语句时，循环立即退出。\n\n`continue` 语句与 `break` 类似，但它不是跳转到循环的结束，而是跳转到当前循环迭代的结束。你可能用它来跳过不需要的输入，如下所示：\n\
  \n点击此处查看代码图片\n\n```java\nwhile (in.hasNextInt()) {\n    int input = in.nextInt();\n\
  \    if (input < 0) continue; // 跳到 `in.hasNextInt()` 的测试\n    Process input\n}\n\
  ```\n\n在 `for` 循环中，`continue` 语句跳转到下一个更新语句：\n\n点击此处查看代码图片\n\n```java\nfor (int i\
  \ = 1; i <= target; i++) {\n    int input = in.nextInt();\n    if (n < 0) continue;\
  \ // 跳到 `i++`\n    Process input\n}\n```\n\n`break` 语句只会跳出直接包含它的循环或 `switch`。如果你想跳转到另一个嵌套语句的末尾，请使用带标签的\
  \ `break` 语句。为应该退出的语句标记标签，并在 `break` 时提供该标签，如下：\n\n```java\nouter:\nwhile (...)\
  \ {\n    while (...) {\n        ...\n        if (...) break outer;\n        ...\n\
  \    }\n}\n// 带标签的 `break` 跳到这里\n```\n\n标签可以是任何名称。\n\n![images/0007.jpeg] 注意 你在语句顶部标记了标签，但\
  \ `break` 语句会跳转到结尾。\n\n普通的 `break` 只能用于退出循环或 `switch`，但带标签的 `break` 可以将控制转移到任何语句的结尾。\n\
