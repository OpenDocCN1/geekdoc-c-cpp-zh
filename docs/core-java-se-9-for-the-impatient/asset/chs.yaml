  \ `void` | `run` | 执行不带参数或返回值的操作 | |\n| `Supplier<T>` | 无 | `T` | `get` | 提供类型为\
  \ `T` 的值 | |\n| `Consumer<T>` | `T` | `void` | `accept` | 类型为 `T` 的值 | `andThen`\
  \ |\n| `BiConsumer<T, U>` | `T`, `U` | `void` | `accept` | 使用类型为 `T` 和 `U` 的值 |\
