  \ = Locale.getDefault();\n```![Image](img/00003.jpeg) 注意\n\n在 Unix 中，可以通过设置 `LC_NUMERIC`、`LC_MONETARY`\
  \ 和 `LC_TIME` 环境变量为数字、货币和日期指定不同的区域设置。Java 不注意这些设置。\n\n***\n\n![Image](img/00009.jpeg)\
  \ 提示\n\n为了测试，你可能需要切换区域设置。启动程序时提供语言和地区。例如，在这里我们将默认区域设置为 `de`。\n\n***\n\n你可以通过调用以下一个点击此处查看代码图像来更改虚拟机的默认区域设置：\n\
  \n```java\nLocale.setDefault(newLocale);\n```\n\n```java\nLocale.setDefault(category,\
  \ newLocale);\n```\n\n第一次调用更改了所有类别的 `Locale.getDefault()` 和 `Locale.getDefault(category)`\
  \ 返回的区域设置。\n\n#### 13.1.3 显示名称\n\n你想允许用户在一组区域设置为进行选择。你不想显示晦涩的字符串；`getDisplayName`\
  \ 方法返回一个描述区域设置的字符串，可以呈现给用户的格式，例如“德语（瑞士）”。\n\n实际上，这里有一个问题。显示名称是用默认区域设置发布的。这可能并不合适。如果用户已经选择了德语作为首选语言，你可能希望用德语显示字符串。你可以通过传入德语区域设置来实现。代码\n\
  \n点击此处查看代码图像\n\n```java\nLocale loc = Locale.forLanguageTag(\"de-CH\");\nSystem.out.println(loc.getDisplayName(Locale.GERMAN));\n\
  ```\n\n打印 Deutsch (Schweiz)\n\n这个示例展示了为什么你需要 `Locale` 对象。你将它们传递给产生呈现给不同位置用户的文本的区域感知方法。你将在后续章节中看到许多示例。\n\
  \n***\n\n![Image](img/00007.jpeg) 注意\n\n即使是像将字符串转换为小写或大写这样普通的操作也是特定区域的。例如，在土耳其语中，字母\
  \ I 的小写是不点的 ı。尝试通过将其存储为小写来归一化字符串的程序对土耳其客户失败了。始终使用带有 `Locale` 参数的 `toUpperCase` 和\
  \ `toLowerCase` 变体是一个好主意。例如，尝试：\n\n点击此处查看代码图像\n\n```java\nString cmd = \"QUIT\"\
  .toLowerCase(Locale.forLanguageTag(\"tr\"));\n   // \"quıt\" 带点的 ı\n```\n\n当然，在土耳其，由于\
  \ `Locale.getDefault()` 产生该区域设置，`\"QUIT\".toLowerCase()` 不等于 `\"quit\"`。\n\n如果你想将英语字符串归一化为小写，你应该向\
  \ `toLowerCase` 方法传递一个英语区域设置。\n\n***\n\n***\n\n\n\n\n\n![Image](img/00003.jpeg)\
  \ 注意\n\n你可以显式设置输入输出操作的区域设置（locale）。\n\n- 当从 `Scanner` 读取数字时，可以使用 `useLocale` 方法设置它的区域设置。\n\
  - `String.format` 和 `PrintWriter.printf` 方法可以选择性地接收一个 `Locale` 参数。\n\n* *\n\n###\
  \ 13.2 数字格式化\n\n`java.text` 包中的 `NumberFormat` 类为格式化器提供了三个工厂方法，用于对数字进行格式化和解析：`getNumberInstance`、`getCurrencyInstance`\
  \ 和 `getPercentInstance`。例如，这里是如何使用德语格式化货币值：\n\n点击此处查看代码图片\n\n```java\nLocale loc\
  \ = Locale.GERMANY;\nNumberFormat formatter = NumberFormat.getCurrencyInstance(loc);\n\
  double amt = 123456.78;\nString result = formatter.format(amt);\n```\n\n结果是\n\n\
  123.456,78€\n\n注意货币符号是 €，并且它位于字符串末尾。此外，注意小数点和小数逗号的颠倒。\n\n相反，要读取按照特定区域设置习惯输入或存储的数字，请使用\
  \ `parse` 方法：\n\n点击此处查看代码图片\n\n```java\nString input = ...;\nNumberFormat formatter\
  \ = NumberFormat.getNumberInstance();\n// 获取默认格式区域的数字格式化器\nNumber parsed = formatter.parse(input);\n\
  double x = parsed.doubleValue();\n```\n\n`parse` 的返回类型是抽象类型 `Number`。返回的对象是 `Double`\
  \ 或 `Long` 包装对象，取决于解析出的数字是否为浮点数。如果你不在乎这种区别，可以简单地使用 `Number` 类的 `doubleValue` 方法来获取包装后的数字。\n\
  \n如果数字文本格式不正确，该方法将抛出 `ParseException`。例如，字符串中开头的空格是不允许的（调用 `trim` 来移除它）。然而，字符串中数字后的任何字符都将被直接忽略，且不会抛出异常。\n\
  \n### 13.3 货币\n\n为了格式化货币值，你可以使用 `NumberFormat.getCurrencyInstance` 方法。然而，该方法并不灵活——它返回一个单一货币的格式化器。假设你正在为一个美国客户准备一份发票，其中某些金额是美元，另一些是欧元。你不能仅仅使用两个格式化器\n\
  \n点击此处查看代码图片\n\n```java\nNumberFormat dollarFormatter = NumberFormat.getCurrencyInstance(Locale.US);\n\
  NumberFormat euroFormatter = NumberFormat.getCurrencyInstance(Locale.GERMANY);\n\
  ```\n\n你的发票看起来会非常奇怪，某些值格式化为 `$100,000`，另一些格式化为 `100.000`€。（注意欧元值使用的是小数点，而不是逗号。）\n\
  \n相反，使用 `Currency` 类来控制格式化器使用的货币。你可以通过向静态方法 `Currency.getInstance` 传递货币标识符来获取 `Currency`\
  \ 对象。表 13-3 列出了常见的标识符。静态方法 `Currency.getAvailableCurrencies` 会产生包含虚拟机已知的货币的 `Set<Currency>`。\n\
  \n**表 13-3** 常见货币标识符\n\n| 货币 | 标识符 | 货币 | 标识符 |\n| :--- | :--- | :--- | :--- |\n\
  | 美元 | `USD` | 人民币（元） | `CNY` |\n| 欧元 | `EUR` | 印度卢比 | `INR` |\n| 英镑 | `GBP` | 俄罗斯卢\
  \ | `RUB` |\n| 日元 | `JPY` | 瑞士法郎 | `CHF` |\n\n一旦你获得了一个 `Currency` 对象，为格式化器调用 `setCurrency`\
  \ 方法。以下是如何为你的美国客户格式化欧元金额：\n\n点击此处查看代码图片\n\n```java\nNumberFormat formatter = NumberFormat.getCurrencyInstance(Locale.US);\n\
  formatter.setCurrency(Currency.getInstance(\"EUR\"));\nSystem.out.println(formatter.format(euros));\n\
  ```\n\n如果你需要显示货币的本地化名称或符号，请调用\n\n`getDisplayName()`\n\n`getSymbol()`\n\n这些方法返回默认显示区域设置的字符串。你也可以提供一个显式的\
  \ locale 参数。\n\n### 13.4 日期和时间格式化\n\n在格式化日期和时间时，有四个取决于区域设置的问题：\n\n1. 月份和星期的名称应该以本地语言呈现。\n\
  2. 年、月、日的顺序会有本地偏好。\n3. 格列哥日历可能不是表示日期的本地偏好。\n4. 必须考虑所在位置的时区。\n\n使用 `java.time.format`\
  \ 包中的 `DateTimeFormatter`，而不是旧的 `java.util.DateFormat`。决定你需要日期、时间还是两者都有。从四种格式中选择一种——参见表\
  \ 13-4。如果你格式化日期和时间，你可以任选一种。\n\n**表 13-4** 区域特定格式化\n\n| 样式 | 日期 | 时间 |\n| :--- |\
  \ :--- | :--- |\n| `SHORT` | 7/16 | 9:32 |\n| `MEDIUM` | Jul 16 | 9:32 |\n| `LONG`\
  \ | July 16, 69 | 9:32 AM |\n| `FULL` | Wednesday, July 16, 69 | 9:32 AM |\n\n然后获取格式化器：\n\
  \n```java\nFormatStyle style = ...;\nDateTimeFormatter dateFormatter = DateTimeFormatter.ofLocalizedDate(style);\n\
  DateTimeFormatter timeFormatter = DateTimeFormatter.ofLocalizedTime(style);\nDateTimeFormatter\
  \ dateTimeFormatter = DateTimeFormatter.ofLocalizedDateTime(style);\n```\n\n这些格式化器使用当前的区域设置。要使用不同的区域设置，使用：\n\
  \n```java\nDateTimeFormatter dateFormatter = ...;\nstyle.withLocale(locale);\n```\n\
  \n现在你可以格式化 `LocalDate`、`LocalDateTime` 或 `ZonedDateTime`：\n\n```java\nZonedDateTime\
  \ appointment = ...;\nString formatted = formatter.format(appointment);\n```\n\n\
  解析字符串，使用 `LocalDate`、`LocalDateTime` 或 `ZonedDateTime` 的静态 `parse` 方法：\n\n```java\n\
  LocalTime time = LocalTime.parse(\"9:32 AM\", formatter);\n```\n\n如果字符串无法成功解析，将抛出\
  \ `DateTimeParseException`。\n\n* *\n\n![Image](img/00007.jpeg) 注意\n\n这些方法不适用于人类输入，至少在没有预处理的情况下不是。例如，美国的短时间可以解析\
  \ `\"9:32 AM\"`，但不能解析 `\"9:32AM\"` 或 `\"9:32 am\"`。\n\n* *\n\n* *\n\n![Image](img/00007.jpeg)\
  \ 注意\n\n日期格式化器会解析不存在的日期（例如 11 月 31 日），并将其调整为该月的最后一天。\n\n* *\n\n有时你只需要星期和月份的名称，例如在日历应用程序中。调用\
  \ `DayOfWeek` 和 `Month` 枚举的 `getDisplayName` 方法。\n\n```java\nfor (Month m : Month.values())\
  \ {\n    System.out.println(m.getDisplayName(textStyle, locale) + \" \");\n}\n```\n\
  \n表 13-5 显示了文本样式。`STANDONE` 版本用于格式化日期之外的显示。例如，在芬兰语中，一月在日期内部是“tammikuuta”，但在独立显示时是“tammikuu”。\n\
  \n**表 13-5** `java.time.format.TextStyle` 枚举的值\n\n| 样式 | 示例 |\n| :--- | :--- |\n\
  | `FULL` / `FULL_STANDALONE` | January |\n| `SHORT` / `SHORT_STANDALONE` | Jan |\n\
  | `NARROW` / `NARROW_STANDALONE` | J |\n\n* * *\n\n每周的第一天可以是周六、周日或周一，取决于区域设置。你可以这样获取它：\n\
  \n```java\nDayOfWeek first = WeekFields.of(locale).getFirstDayOfWeek();\n```\n\n\
  \n\n\n\n大多数程序员都知道如何使用 `String` 类的 `compareTo` 方法来比较字符串。遗憾的是，在与人类用户交互时，这个方法并不好用。`compareTo`\
  \ 方法使用字符串的 UTF-16 编码值，这导致即使在英语中也会出现荒谬的结果。例如，以下五个字符串是根据 `compareTo` 方法排序的：\n\n```\n\
  Athens\nZulu\nable\nzebra\nÅngström\n```\n\n对于字典排序，你可能需要考虑大写和小写的等效性，且重音符号不应该是重要的。对于英语母者来说，这个单词示例列表应该排序为：\n\
  \n```\nable\nÅngström\nAthens\nzebra\nZulu\n```\n\n然而，这种顺序对瑞典用户来说是不可接受的。在瑞典语中，字母\
  \ `Å` 与字母 `A` 不同，而且它排在字母 `Z` *之后*！也就是说，瑞典用户希望按以下顺序排序单词：\n\n```\nable\nAthens\nzebra\n\
  Zulu\nÅngström\n```\n\n要获取一个区域敏感的比较器，请调用静态方法 `Collator.getInstance`：\n\n点击此处查看代码图片\n\
  \n```java\nCollator coll = Collator.getInstance(locale);\nwords.sort(coll);\n//\
  \ `Collator` implements `Comparator<Object>`\n```\n\n比较器有几个高级设置。你可以设置比较器的 `strength`\
  \ 来调整它的选择性。字符差异被分为初级、次级或三级。例如，在英语中，`e` 和 `f` 之间的差异被视为一级，`e` 和 `é` 之间的差异是次级，而 `e`\
  \ 和 `E` 之间是三级。\n\n例如，在处理城市名称时，你可能不在乎以下项之间的差异：\n\n```\nSan José\nSan Jose\nSAN JOSE\n\
  ```\n\n在这种情况下，通过调用以下方法配置比较器：\n\n点击此处查看代码图片\n\n```java\ncoll.setStrength(Collator.PRIMARY);\n\
  ```\n\n一个更具技术的设置是 `decomposition mode`（分解模式），它处理的是一个字符或字符序列在 Unicode 中有时可以用超过一种方式描述的情况。例如，`é`\
  \ (U+00E9) 也可以表示为普通的 `e` (U+0065) 后跟一个 `′`（组合重音符号 U+0301）。你可能不在乎这种差异，在默认情况下，它是不重要的。如果你在乎，则需要如下所示配置比较器：\n\
  \n点击此处查看代码图片\n\n```java\ncoll.setStrength(Collator.IDENTICAL);\ncoll.setDecomposition(Collator.NO_DECOMPOSITION);\n\
  ```\n\n相反，如果你想非常宽容，并将商标符号 `™` (U+2122) 视为与字符组合 `TM` ，则将分解模式设置为 `Collator.FULL_DECOMPOSITION`。\n\
  \n即使你不进行排序，可能也想将字符串转换为规范化形式——例如，为了持久化存储或与其他程序通信。Unicode 标准定义了四种规范化形式（C, D, KC 和\
  \ KD）——参见 [www.unicode.org/unicode/reports/tr15/tr15-23.html](http://www.unicode.org/unicode/reports/tr15/tr15-23.html)。在规范化形式\
  \ C 中，带重音的字符总是组合的。例如，`e` 和组合重音 `′` 的序列被组合成单个字符 `é`。在形式 D 中，带重音的字符总是分解为它们的基础字母和组合重音：`é`\
  \ 变为 `e` 后跟 `′`。形式 KC 和 KD 也会分解如商标符号 `™` 等字符。W3C 建议你在互联网上传输数据时使用规范化形式 C。\n\n`java.text.Normalizer`\
  \ 类的静态方法 `normalize` 执行规范化过程。例如：\n\n点击此处查看代码图片\n\n```java\nString city = \"San Jose\\\
  u0301\";\nString normalized = Normalizer.normalize(city, Normalizer.Form.NFC);\n\
  ```\n\n### 13.6 消息格式化\n\n当对程序进行国际化时，你通常会有带有变量部分的消息。`MessageFormat` 类的静态方法 `format`\
  \ 接收一个带有占位符的模板字符串，随后是占位符的值，如下所示：\n\n点击此处查看代码图片\n\n```java\nString template = \"\
  {0} has {1} messages\";\nString message = MessageFormat.format(template, \"Pierre\"\
  , 42);\n```\n\n当然，你不应该硬编码模板，而应该查找特定区域的模板，例如法语中的 `\"Il y a {1} messages pour {0}\"\
  `。你将在 第 13.7 节，“资源包](#part0031.html_ch13lev1sec7)”（435 页）中看到如何这样做。\n\n注意占位符的顺序在不同语言之间可能不同。在英语中，消息是“Pierre\
  \ has 42 messages”，但在法语中，它是“Il y a 42 messages pour Pierre”。占位符 `{0}` 是 `format`\
  \ 调用中的第一个参数，`{1}` 是下一个参数，依此类推。\n\n（注：原文后续部分存在大量重复和混乱描述，译文已根据核心逻辑进行了清理和翻译。）\n\n\n\
  \n\n\n点击此处查看代码图像\n\n`MessageFormat mf = new MessageFormat(template, locale);`\n\n\
  `String message = mf.format(new Object[] { arg1, arg2, ... });`\n\n### 13.7 资源包\
  \ (Resource Bundles)\n\n在对应用程序进行本地化时，最好是将程序与消息字符串、按钮标签和其他需要翻译的文本分离。在 Java 中，你可以将它们放入\
  \ `resource bundles`（资源包）中。然后，你可以将这些资源包交给翻译人员，他们可以进行编辑而无需触碰程序的源代码。\n\n* *\n\n![Image](img/00003.jpeg)\
  \ Note\n\n第 4 章 描述了 JAR 文件资源的概念，通过该概念可以将数据文件、声音和图像放入 JAR 文件中。`Class` 类的 `getResource`\
  \ 方法找到文件、打开它并返回一个指向资源的 `URL`。这对于将文件与程序打包是一个非常有用的机制，但它不支持本地化。\n\n* *\n\n#### 13.7.1\
  \ 组织资源包\n\n在对应用程序进行本地化时，你会生成一组资源包。每个包要么是一个属性文件，要么是一个特殊类，包含特定本地化或一组匹配本地化的条目。\n\n\
  在本节中，我只讨论属性文件，因为它们比资源类常见得多。属性文件是一个扩展名为 `.properties` 的文本文件，其中包含键/值对。例如，文件 `messages_de_DE.properties`\
  \ 可能包含：\n\n```properties\ncomputeButton=Rechnen\ncancelButton=Abbrechen\ndefaultPaperSize=A4\n\
  ```\n\n你需要对构成这些资源包的文件使用特定的命名约定。例如，特定于德国的资源放入文件 `bundleName_de_DE` 中，而所有德语国家共享的资源则放入\
  \ `bundleName_de` 中。对于给定的语言、脚本和国家组合，会考虑以下 `candidates`（候选者）：\n\n点击此处查看代码图像\n\n`bundleName_language_script_country`\n\
  \n`bundleName_language_script`\n\n`bundleName_language_country`\n\n`bundleName_language`\n\
  \n如果 `bundleName` 包含点，则文件必须存放在匹配的子目录下。例如，资源包 `com.mycompany.messages` 的文件是 `com/mycompany/messages_de_DE.properties`，以此此类推。\n\
  \n要加载资源包，请调用\n\n点击此处查看代码图像\n\n`ResourceBundle res = ResourceBundle.getBundle(bundleName);`\n\
  \n用于默认本地化，或者\n\n点击此处查看代码图像\n\n`ResourceBundle bundle = ResourceBundle.getBundle(bundleName,\
  \ locale);`\n\n用于给定的本地化。\n\n* *\n\n![Image](img/00007.jpeg) Caution\n\n第一个 `getBundle`\
  \ 方法*没有*使用默认显示本地化，而是使用整体的默认本地化。如果你为用户界面查找资源，请务必将 `Locale.getDefault(Locale.Category.DISPLAY)`\
  \ 作为本地化参数传递。\n\n* *\n\n要查找字符串，请带键调用 `getString` 方法。\n\n点击此处查看代码图像\n\n`String computeButtonLabel\
  \ = bundle.getString(\"computeButton\");`\n\n加载资源包文件的规则有点复杂，涉及两个阶段。在第一阶段，会定位匹配的资源包。这涉及多达三个步骤。\n\
  \n1. 首先，按照上述给定的顺序尝试包名、语言、脚本、国家和变体的所有候选组合，直到找到匹配项。例如，如果目标本地化是 `de-DE` 且没有 `messages_de_DE.properties`\
  \ 但存在 `messages_de.properties`，则后者成为匹配的资源包。\n\n2. 如果没有匹配项，则对默认本地化重复此过程。例如，如果请求德语资源包但不存在，且默认本地化是\
  \ `en-US`，则 `messages_en_US.properties` 被接受为匹配项。\n\n3. 如果默认本地化也没有匹配项，则无后缀的资源包（例如\
  \ `messages.properties`）为匹配项。如果连它不存在，则搜索失败。\n\n* *\n\n![Image](img/00003.jpeg) Note\n\
  \n对于变体、简体和繁体中文脚本以及挪威语有特殊的规则。详情请参阅 `ResourceBundle.Control` 的 Javadoc。\n\n* *\n\n\
  在第二阶段，会定位匹配资源包的 `parents`（父包）。父包是候选列表中位于匹配资源包下方的包以及无后缀的资源包。例如，`messages_de_DE.properties`\
  \ 的父包是 `messages_de.properties` 和 `messages.properties`。\n\n`getString` 方法在匹配的资源包及其父包中查找键。\n\
  \n* *\n\n![Image](img/00003.jpeg) Note\n\n如果在第一阶段已找到匹配的资源包，那么它的父包永远不会从默认本地化中获取。\n\
  \n* *\n\n* *\n\n![Image](img/00003.jpeg) Note\n\n过去，属性文件限于使用 ASCII 字符集。所有非 ASCII\
  \ 字符都必须进行编码。现在，属性文件被假设为 UTF-8，你可以直接写出：\n\n```properties\nprefs=Prférences\n```\n\
  \n* *\n\n#### 13.7.2 资源类\n\n要提供非字符串的资源，定义扩展 `ResourceBundle` 的类。使用类似于属性文件的命名约定，例如：\n\
  \n点击此处查看代码图像\n\n`com.mycompany.MyAppResources_en_US`\n\n`com.mycompany.MyAppResources_de`\n\
  \n`com.mycompany.MyAppResources`\n\n要实现资源包，你可以扩展 `ListBundle` 类。将你的资源放入键/值对数组中并在\
  \ `getContents` 方法中返回。例如：\n\n点击此处查看代码图像\n\n```java\npackage com.mycompany;\n\npublic\
  \ class MyAppResources_de extends ListBundle {\n    public Object[][] getContents()\
  \ {\n        return new Object[][] {\n            {\"backgroundColor\", Color.BLACK},\n\
  \            {\"defaultPaperSize\", new double[] { 210, 297 }}\n        };\n   \
  \ }\n}\n```\n\n从此类资源包中获取对象，调用 `getObject` 方法：\n\n点击此处查看代码图像\n\n`ResourceBundle bundle\
  \ = ResourceBundle.getBundle(\"com.mycompany.MyAppResources\", locale);`\n\n`Color\
  \ backgroundColor = (Color) bundle.getObject(\"backgroundColor\");`\n\n`double[]\
  \ paperSize = (double[]) bundle.getObject(\"defaultPaperSize\");`\n\n* *\n\n![Image](img/00007.jpeg)\
  \ Caution\n\n`ResourceBundle.getBundle` 方法在发现同名的类和属性文件时会优先考虑类。\n\n* *\n\n### 13.8\
  \ 字符编码\n\nJava 使用 Unicode 并不意味着所有的编码问题都消失了。幸运的是，你不需要担心 `String` 对象的编码。接收到的任何字符串，无论是命令行参数、控制台输入还是\
  \ GUI 文本字段输入，都将 UTF-16 编码字符串，包含了用户提供的文本。\n\n当你显示字符串时，虚拟机会将其编码为本地平台。存在两个潜在问题：显示字体可能没有某个\
  \ Unicode 字符的字形。在 Java GUI 中，此类字符将显示为空框。对于控制台输出，如果控制台使用的字符编码无法表示所有输出字符，缺失字符将显示为\
  \ '?'。用户可以通过安装合适的字体或将控制台切换到 UTF-8 来解决这些问题。\n\n当你的程序读取用户生成的纯文本文件时，情况变得复杂。简单的文本编辑器通常按本地平台编码生成文件。你可以通过调用来获取该编码：\n\
  \n点击此处查看代码图像\n\n`Charset platformEncoding = Charset.defaultCharset();`\n\n这是对用户喜欢的字符编码的合理猜测，但你应该允许用户覆盖它。\n\
  \n\n\n\n\n如果你想提供字符编码的选择，可以通过以下方式获取本地化的名称：\n\n点击此处查看代码图片\n\n```java\nString `displayName`\
  \ = encoding.displayName(locale);\n```\n// 输出诸如 `UTF-8`、`ISO-8859-6` 或 `GB18030`\
  \ 之类的名称\n\n遗憾的是，这些名称对于想要在 Unicode、阿拉伯语、简体中文等之间进行选择的最终用户来说并不十分合适。\n\n![Image](img/00009.jpeg)\
  \ **Tip**\n\nJava 源文件也是文本文件。假设你不是项目中唯一的程序员，请不要将源文件存储在平台编码中。虽然你可以使用 `\\uxxxx` 转义字符在代码或注释中表示任何非\
  \ ASCII 字符，但那是繁琐的。相反，将你的文本编辑器设置为使用 UTF-8。你可以将你的控制台偏好设置为 UTF-8，或者在编译时指定：\n\n```bash\n\
  javac -encoding UTF-8 *.java\n```\n\n### 13.9 偏好设置\n\n我将用一个与国际化间接相关的 API 来结束本章——用户偏好设置的存储（可能包括首选区域）。\n\
  \n当然，你可以将偏好设置存储在程序启动时加载的属性文件中。然而，对于配置文件的命名和存放并没有标准约定，这增加了用户在安装多个 Java 时发生冲突的概率。\n\
  \n某些操作系统拥有用于配置信息的中央存储库。最为人知的例子是 Microsoft Windows 中的注册表。`Preferences` 类是 Java 中存储用户偏好设置的标准机制，它在\
  \ Windows 上使用注册表。在 Linux 上，信息则存储在本地文件系统中。对于使用 `Preferences` 类的程序员来说，具体的存储库实现是透明的（透明）。\n\
  \n`Preferences` 存储库包含一个节点树。存储库中的每个节点都有一个键/值对表。值可以是数字、`boolean` 值、字符串或字节数组。\n\n![Image](img/00003.jpeg)\
  \ **Note**\n\n此处没有提供存储任意对象的规定。当然，如果你不担心使用序列化进行长期存储，你可以自由地将序列化对象存储为字节数组。\n\n节点的路径看起来像\
  \ `/com/mycompany/myapp`。与包名一样，你可以通过以反向域名开头路径来避免名称冲突。\n\n有两棵并行的树。每个程序用户拥有一棵树。还有一个名为“系统树”的树用于所有用户通用的设置。`Preferences`\
  \ 类使用操作系统的“当前用户”概念来访问相应的用户树。要访问树中的节点，从用户或系统根节点开始：\n\n点击此处查看代码图片\n\n```java\nPreferences\
  \ `root` = Preferences.userRoot();\n```\n\n或者\n\n点击此处查看代码图片\n\n```java\nPreferences\
  \ `root` = Preferences.systemRoot();\n```\n\n然后通过它们的路径名访问节点：\n\n点击此处查看代码图片\n\n```java\n\
  Preferences `node` = `root.node(\"/com/mycompany/myapp\")`;\n```\n\n或者，向静态方法 `userNodeForPackage`\
  \ 或 `systemNodeForPackage` 提供一个 `Class` 对象，节点路径将根据该类的包名推导出。\n\n点击此处查看代码图片\n\n```java\n\
  Preferences `node` = Preferences.userNodeForPackage(obj.getClass());\n```\n\n一旦获取了节点，就可以访问键/值表。通过以下方法获取字符串：\n\
  \n点击此处查看代码图片\n\n```java\nString `preferredLocale` = `node.get(\"locale\", \"\");\n\
  ```\n\n对于其他类型，使用以下方法之一：\n\n点击此处查看代码图片\n\n```java\nString get(String key, String\
  \ defval)\nint getInt(String key, int defval)\nlong getLong(String key, long defval)\n\
  float getFloat(String key, float defval)\ndouble getDouble(String key, double defval)\n\
  boolean getBoolean(String key, boolean defval)\nbyte[] getByteArray(String key,\
  \ byte[] defval)\n```\n\n在读取信息时必须指定默认值，以防存储库数据不可。\n\n相反，你可以使用类似 `put` 方法将数据写入存储库，例如：\n\
  \n点击此处查看代码图片\n\n```java\nvoid put(String key, String value)\nvoid putInt(String\
  \ key, int value)\n```\n\n以及此类方法。\n\n要从节点中删除条目，请调用\n\n```java\nvoid remove(String\
  \ key)\n```\n\n调用 `node.removeNode()` 可以移除整个节点及其子节点。\n\n你可以使用以下方法列出节点中存储的所有键以及节点的所有子路径：\n\
  \n```java\nString[] keys()\nString[] childrenNames()\n```\n\n![Image](img/00003.jpeg)\
  \ **Note**\n\n没有提供查询值类型的方法。\n\n你可以通过调用方法导出子树的偏好设置：\n\n点击此处查看代码图片\n\n```java\nvoid\
  \ exportSubtree(OutputStream out)\n```\n\n在子树的根节点上执行。\n\n数据以 XML 格式保存。你可以通过调用方法将其导入另一个存储库：\n\
  \n点击此处查看代码图片\n\n```java\nInputStream `in` = Files.newInputStream(path);\nPreferences.importPreferences(in);\n\
  ```\n\n## 练习\n\n1. 编写一个程序，演示法国、中国和泰国的日期格式样式。\n\n2. JVM 中哪些区域在格式化数字时不使用西方数字？\n\n\
  3. JVM 中哪些区域使用的日期格式与美国相同（月/日/年）？\n\n4. 编写一个程序打印 JVM 中所有区域的语言名称。对它们进行排序并去除重复。\n\n\
  5. 对货币名称重复上述练习。\n\n6. 编写一个程序，列出在至少两个区域中具有不同符号的货币。\n\n7. 编写一个程序，列出所有区域中不同的显示名称和独立月份名称，排除那些独立名称由数字组成的情况。\n\
  \n8. 编写一个程序，列出所有在规范化形式 KC 或 KD 下扩展为两个或多个 ASCII 字符的 Unicode 字符。\n\n9. 将你的其中一个程序进行国际化，使用至少两种语言的资源包。\n\
  \n10. 提供一种机制来显示可用的字符编码并带有人类可读的描述，就像你的网络浏览器一样。语言名称应该是本地化的。（使用区域语言的翻译。）\n\n11. 提供一个用于显示区域特定纸尺寸的类，使用给定区域的首选尺寸单位和默认纸尺寸。\n\
  \n\n\n\n\n## 第 14 章 编译与脚本\n\n在本章中，你将学习如何使用 `compiler` API 从应用程序内部编译 Java 代码。你还将看到如何使用\
  \ `scripting` API 运行用其他语言编写的程序。本章的要点如下：\n\n1. 通过 `compiler` API，你可以动态生成 Java 代码并对其进行编译。\n\
  2. `scripting` API 让 Java 程序能够与多种脚本语言进行交互。\n3. JDK 包含了 `Nashorn`，它是一个性能良好且忠于 JavaScript\
  \ 标准的 JavaScript 解释器。\n4. `Nashorn` 为处理 Java 列表、映射（maps）以及 JavaBeans 提供了方便的语法。\n\
  5. `Nashorn` 支持 lambda 表达式，并提供了扩展 Java 类和实现 Java 接口的有限机制。\n6. `Nashorn` 支持用 JavaScript\
  \ 编写 shell 脚本。\n\n### 14.1 编译器 API\n\n有很多工具需要编译 Java 代码。显然，开发环境和教授 Java 编程的程序位于其中，还有测试和构建自动化工具。另一个例子是\
  \ JavaServer Pages（JSP）的处理——即嵌入了 Java 语句的网页。\n\n#### 14.1.1 调用编译器\n\n调用编译器非常简单。这里有一个示例调用：\n\
  \n```java\nJavaCompiler compiler = ToolProvider.getSystemJavaCompiler();\nOutputStream\
  \ outStream = ...;\nOutputStream errStream = ...;\nint result = compiler.run(null,\
  \ outStream, errStream, \"-sourcepath\", \"src\", \"Test.java\");\n```\n\n`result`\
  \ 值为 `0` 表示编译成功。编译器会将输出和错误信息发送到提供的流。你可以将这些参数设置为 `null`，在这种情况下将使用 `System.out` 和\
  \ `System.err`。`run` 方法的第一个参数是输入流。由于编译器不接受控制台输入，你始终可以将其留为 `null`。（`run` 方法继承自一个通用的\
  \ `Tool` 接口，该接口允许读取输入的工具使用。）\n\n`run` 方法的其余参数是如果你在命令行调用 `javac` 时将传递给它的参数。这些参数可以是选项或文件名。\n\
  \n#### 14.1.2 启动编译任务\n\n通过 `CompilationTask` 对象，你可以对编译过程进行更细致控制。如果你想从字符串提供源码、在内存中捕获类文件或处理错误和警告信息，这将非常有用。\n\
  \n要获取一个 `CompilationTask`，请像上一节一样从 `compiler` 对象开始。然后调用：\n\n```java\nJavaCompiler.CompilationTask\
  \ task = compiler.getTask(\n    errorWriter, // 如果为 null 则使用 System.err\n    fileManager,\
  \ // 如果为 null 则使用标准文件管理器\n    diagnostics, // 如果为 null 则使用 System.err\n    options,\
  \ // 没有选项则为 null\n    classes, // 用于注解处理；如果没有则为 null\n    sources\n);\n```\n\n最后三个参数是\
  \ `Iterable` 实例。例如，一组选项可以这样指定：\n\n```java\nIterable<String> options = List.of(\"\
  -d\", \"bin\");\n```\n\n`sources` 参数是 `JavaFileObject` 实例的 `Iterable`。如果你想编译磁盘文件，请获取一个\
  \ `StandardJavaFileManager` 并调用它的 `getJavaFileObjects` 方法：\n\n```java\nStandardJavaFileManager\
  \ fileManager = compiler.getStandardFileManager(null, null, null);\nIterable<JavaFileObject>\
  \ sources = fileManager.getJavaFileObjectsFromFiles(\"File1.java\", \"File2.java\"\
  );\n```\n\n```java\nJavaCompiler.CompilationTask task = compiler.getTask(null, null,\
  \ null, options, null, sources);\n```\n\n`getTask` 方法返回任务对象，但尚未启动编译过程。`CompilationTask`\
  \ 类实现了 `Callable<Boolean>`。你可以将其传递给 `ExecutorService` 进行并发执行，或者也可以直接进行同步调用：\n\n\
  ```java\nBoolean success = task.call();\n```\n\n#### 14.1.3 从内存读取源文件\n\n如果你动态生成源码，可以使其从内存中进行编译，而无需将文件保存到磁盘。使用此类来持有代码：\n\
  \n```java\npublic class StringSource extends SimpleJavaFileObject {\n    private\
  \ String code;\n    StringSource(String name, String code) {\n```\n\n\n\n\n\n```java\n\
  super(URI.create(\"string:///\" + name.replace('.','/') + \".java\"), Kind.SOURCE);\n\
  \nthis.code = code;\n\n}\n\npublic CharSequence getCharContent(boolean ignoreEncodingErrors)\
  \ {\n    return code;\n}\n\n}\n```\n\n然后为你的类生成代码，并向编译器提供一个 `StringSource` 对象列表。\n\
  \n点击此处查看代码图片\n\n```java\nString pointCode = ...;\n\nString rectangleCode = ...;\n\
  \nList<StringSource> sources = List.of(\n    new StringSource(\"Point\", pointCode),\n\
  \    new StringSource(\"Rectangle\", rectangleCode));\n\ntask = compiler.getTask(null,\
  \ null, null, null, null, sources);\n```\n\n#### 14.1.4 将字节码写入内存\n\n如果你在运行时动态编译类，则不需要将类文件保存到磁盘。你可以将它们保存到内存并立即加载。\n\
  \n首先，这里有一个用于保存字节的类：\n\n点击此处查看代码图片\n\n```java\npublic class ByteArrayClass extends\
  \ SimpleJavaFileObject {\n    private ByteArrayOutputStream out;\n\n    ByteArrayClass(String\
  \ name) {\n        super(URI.create(\"bytes:///\" + name.replace('.','/') + \".class\"\
  ), Kind.CLASS);\n    }\n\n    public byte[] getCode() {\n        return out.toByteArray();\n\
  \    }\n\n    public OutputStream openOutputStream() throws IOException {\n    \
  \    out = new ByteArrayOutputStream();\n        return out;\n    }\n}\n```\n\n\
  接下来，你需要配置文件管理器以使用这些类作为输出：\n\n点击此处查看代码图片\n\n```java\nList<ByteArrayClass> classes\
  \ = new ArrayList<>();\n\nStandardJavaFileManager stdFileManager = compiler.getStandardFileManager(null,\
  \ null, null);\n\nJavaFileManager fileManager = new ForwardingJavaFileManager<JavaFileManager>(stdFileManager)\
  \ {\n    public JavaFileObject getJavaFileForOutput(Location location,\n       \
  \ String className, Kind kind, FileObject sibling)\n            throws IOException\
  \ {\n        if (kind == Kind.CLASS) {\n            ByteArrayClass outfile = new\
  \ ByteArrayClass(className);\n            classes.add(outfile);\n            return\
  \ outfile;\n        } else\n            return super.getJavaFileForOutput(location,\
  \ className, kind, sibling);\n    }\n};\n```\n\n要加载这些类，你需要一个类加载器（参见第 4 章）：\n\n点击此处查看代码图片\n\
  \n```java\npublic class ByteArrayClassLoader extends ClassLoader {\n    private\
  \ Iterable<ByteArrayClass> classes;\n\n    public ByteArrayClassLoader(Iterable<ByteArrayClass>\
  \ classes) {\n        this.classes = classes;\n    }\n\n    @Override\n    public\
  \ Class<?> findClass(String name) throws ClassNotFoundException {\n        for (ByteArrayClass\
  \ cl : classes) {\n            if (cl.getName().equals(\"/\" + name.replace('.','/')\
  \ + \".class\")) {\n                byte[] bytes = cl.getCode();\n             \
  \   return defineClass(name, bytes, 0, bytes.length);\n            }\n        }\n\
  \        throw new ClassNotFoundException(name);\n    }\n}\n```\n\n编译完成后，使用该类加载器调用\
  \ `Class.forName` 方法：\n\n点击此处查看代码图片\n\n```java\nByteArrayClassLoader loader = new\
  \ ByteArrayClassLoader(classes);\n\nClass<?> cl = Class.forName(\"Rectangle\", true,\
  \ loader);\n```\n\n#### 14.1.5 捕获诊断信息\n\n要监听错误消息，请安装一个 `DiagnosticListener`。当编译器报告警告或错误时，监听器会接收一个\
  \ `Diagnostic` 对象。`DiagnosticCollector` 类实现了此接口。它简单地收集所有的诊断信息，以便你在编译完成后对它们进行迭代。\n\
  \n点击此处查看代码图片\n\n```java\nDiagnosticCollector<JavaFileObject> collector = new DiagnosticCollector<>();\n\
  compiler.getTask(null, fileManager, collector, null, null, sources).call();\nfor\
  \ (Diagnostic<? extends JavaFileObject> d : collector.getDiagnostics()) {\n    System.out.println(d);\n\
  }\n```\n\n一个 `Diagnostic` 对象包含了关于问题位置的信息（包括文件名、行号和列号）以及人类可读的描述。\n\n你也可以为标准文件管理器安装\
  \ `DiagnosticListener`，以防你想要捕获关于文件缺失的消息：\n\n点击此处查看代码图片\n\n```java\nStandardJavaFileManager\
  \ fileManager = compiler.getStandardFileManager(diagnostics, null, null);\n```\n\
  \n### 14.2 脚本 API\n\n脚本语言是一种通过在运行时解释程序文本来避免通常的“编辑/编译/链接/运行”循环的语言。这鼓励了实验。此外，脚本语言通常复杂性较低，使其适合作为你程序的专家用户的扩展语言。\n\
  \n脚本 API 允许你结合脚本语言和传统语言的优点。它让你能够调用用 JavaScript、Groovy、Ruby 甚至像 Scheme 和 Haskell\
  \ 等冷门语言编写的脚本。\n\n#### 14.2.1 获取脚本引擎\n\n脚本语言是一种通过在运行时解释程序文本来避免通常的“编辑/编译/链接/运行”循环的语言。这鼓励了实验。此外，脚本语言通常复杂性较低，使其适合作为你程序的专家用户的扩展语言。\n\
  \n脚本 API 允许你结合脚本语言和传统语言的优点。它让你能够调用用 JavaScript、Groovy、Ruby 甚至像 Scheme 和 Haskell\
  \ 等冷门语言编写的脚本。\n\n脚本引擎是一种通过在运行时解释程序文本来避免通常的“编辑/编译/链接/运行”循环的语言。这鼓励了实验。此外，脚本语言通常复杂性较低，使其适合作为你程序的专家用户的扩展语言。\n\
  \n脚本 API 允许你结合脚本语言和传统语言的优点。它让你能够调用用 JavaScript、Groovy、Ruby 甚至像 Scheme 和 Haskell\
  \ 等冷门语言编写的脚本。\n\n当虚拟机启动时，它会发现可用的脚本引擎。要枚举它们，构造一个 `ScriptEngineManager` 并调用 `getEngineFactories`\
  \ 方法。例如：\n\n```java\nScriptEngineManager manager = new ScriptEngineManager();\n\n\
  ScriptEngine engine = manager.getEngine(\"nashorn\");\n```\n\nJava 开发包包含一个名为“Nashorn”的\
  \ JavaScript 引擎，在 14.3 节中描述（第 452 页）。你可以通过提供必要的 JAR 文件来添加更多语言。\n\n一旦你有了引擎，你只需通过名称来请求它。例如：\n\
  \n```java\nScriptEngineManager manager = new ScriptEngineManager();\n\nScriptEngine\
  \ engine = manager.getEngineByName(\"nashorn\");\n```\n\nJava 开发包包含一个与 Java 集成的\
  \ JSR 223 支持（第 452 页）。你可以找到你喜喜欢的脚本引擎。\n\n一旦你有了引擎，你可以简单地通过以下方式来执行脚本：\n\n```java\n\
  Object result = engine.eval(scriptString);\n```\n\n你也可以从 `Reader` 读取脚本：\n\n```java\n\
  Object result = engine.eval(Files.newBufferedReader(path, charset));\n```\n\n你可以在同一个引擎上调用多个脚本。如果一个脚本定义了变量、函数或类，大多数脚本引擎会保留这些定义供以后使用。例如：\n\
  \n```java\nengine.eval(\"n = 1728\");\n\nObject result = engine.eval(\"n + 1\");\n\
  ```\n\n将返回 `1729`。\n\n![Image](img/00003.jpeg) 注意\n\n要找出是否可以在多线程中并发执行脚本，调用 `engine.getFactory().getParameter(\"\
  THREADING\")`。返回值是以下之一：\n\n- `null`：并发执行安全。\n- `\"MULTITHREADED\"`：并发执行安全。一个线程的影响对另一个线程可见。\n\
  - `\"THREAD-ISOLATED\"`：此外，每个线程维护不同的变量绑定。\n- `\"STATELESS\"`：此外，脚本不会更改变量绑定。\n\n\
  * *\n\n#### 14.2.2 绑定\n\n一个*绑定（binding）由一个名称和一个关联的 Java 对象组成。例如，考虑以下语句：\n\n```java\n\
  engine.put(\"k\", 1728);\n\nObject result = engine.eval(\"k + 1\");\n```\n\n相反，你可以检索由脚本语句绑定的变量：\n\
  \n\n\n\n\n```javascript\nengine.eval(\"n = 1728\");\n\nObject result = engine.get(\"\
  n\");\n```\n\n这些绑定存在于 `engine scope` 中。此外，还有一个全局作用域。你添加到 `ScriptEngineManager` 中的任何绑定对所有引擎都是可见的。\n\
  \n与其直接将绑定添加到引擎或全局作用域，你也可以将它们收集在 `Bindings` 类型的对象中，并将其传递给 `eval` 方法：\n\n点击此处查看代码图片\n\
  \n```javascript\nBindings scope = engine.createBindings();\n\nscope.put(\"k\", 1728);\n\
  \nObject result = engine.eval(\"k + 1\", scope);\n```\n\n如果一组绑定不应该在后续的 `eval` 方法调用中持续存在，这种方法非常有用。\n\
  \n### 14.2.3 重定向输入和输出\n\n你可以通过调用脚本上下文的 `setReader` 和 `setWriter` 方法来重定向脚本的标准输入和输出。例如，\n\
  \n点击此处查看代码图片\n\n```javascript\nStringWriter writer = new StringWriter();\n\nengine.getContext().setWriter(writer);\n\
  \nengine.eval(\"print('Hello')\");\n\nString result = writer.toString();\n```\n\n\
  任何使用 JavaScript `print` 函数写入的输出都会被发送到 `writer`。\n\n`setReader` 和 `setWriter` 方法仅影响脚本引擎的标准输入和输出源。例如，如果你执行以下\
  \ JavaScript 代码：\n\n点击此处查看代码图片\n\n```javascript\nprint('Hello');\n\njava.lang.System.out.println('World');\n\
  ```\n\n只有第一个输出被重定向了。\n\n***\n\n![Image](img/00003.jpeg) Note\n\nNashorn 引擎没有标准输入源的概念。调用\
  \ `setReader` 没有效果。\n\n***\n\n![Image](img/00003.jpeg) Note\n\n在 JavaScript 中，行末的分号是可选的。尽管许多\
  \ JavaScript 程序员仍然会加上它们，但在本章中，我省略了它们，以便你更更容易区分 Java 和 JavaScript 代码段。\n\n出于同样的原因，在编写\
  \ JavaScript 字符串时，尽可能使用 `'...'` 而不是 `\"...\"`。\n\n***\n\n### 14.2.4 调用脚本函数和方法\n\n\
  对于某些脚本引擎，你可以直接调用脚本语言中的函数，而无需将调用的代码作为脚本进行求值。如果你允许用户使用他们选择的脚本语言来实现服务，这样你就可以从 Java\
  \ 中调用它，这种方法就非常有用。\n\n提供此功能的脚本引擎（包括 Nashorn）实现了 `Invocable` 接口。要调用函数，请调用 `invokeFunction`\
  \ 方法并传入函数名，随后是参数：\n\n点击此处查看代码图片\n\n```javascript\n// 在 `JavaScript` 中定义 `greet`\
  \ 函数\n\nengine.eval(\"function greet(how, whom) { return how + ', ' + whom + '!'\
  \ }\");\n\n// 使用参数 \"Hello\", \"World\" 调用函数\nresult = ((Invocable) engine).invokeFunction(\n\
  \    \"greet\", \"Hello\", \"World\");\n```\n\n如果脚本语言是面向对象的，请调用 `invokeMethod`：\n\
  \n点击此处查看代码图片\n\n```javascript\n// 在 `JavaScript` 中定义 `Greeter` 类\n\nengine.eval(\"\
  function Greeter(how) { this.how = how }\");\nengine.eval(\"Greeter.prototype.welcome\
  \ = \"\n    + \" function(whom) { return this.how + ', ' + whom + '!' }\");\n\n\
  // 构造实例\nObject yo = engine.eval(\"new Greeter('Yo')\");\n\n// 在实例上调用 `welcome`\
  \ 方法\nresult = ((Invocable) engine).invokeMethod(yo, \"welcome\", \"World\");\n\
  ```\n\n***\n\n![Image](img/00003.jpeg) Note\n\n有关更多关于如何在 JavaScript 中定义类的信息，请参阅\
  \ Douglas Crockford 写的 *JavaScript—The Good Parts* (O’Reilly, 2008)。\n\n***\n\n\
  ![Image](img/00003.jpeg) Note\n\n如果脚本引擎没有实现 `Invocable` 接口，你可能仍然能够以一种与语言的方式调用方法。`ScriptEngineFactory`\
  \ 类的 `getMethodCallSyntax` 方法会生成一个字符串，你可以将其传递给 `eval` 方法。\n\n***\n\n你可以更进一步，要求脚本引擎实现\
  \ Java 接口。然后你就可以使用 Java 方法调用语法来调用脚本函数和方法。细节取决于脚本引擎，但通常你需要为接口的每个方法提供一个函数。例如，考虑以下\
  \ Java 接口：\n\n点击此处查看代码图片\n\n```java\npublic interface Greeter {\n    String welcome(String\
  \ whom);\n}\n```\n\n如果你在 Nashorn 中定义了一个同名的全局函数，你就可以通过这个接口调用它。\n\n点击此处查看代码图片\n\n\
  ```javascript\n// 在 `JavaScript` 中定义 `greet` 函数\n\nengine.eval(\"function greet(how,\
  \ whom) { return how + ', ' + whom + '!' }\");\n```\n\n### 14.2.5 编译脚本\n\n某些脚本引擎可以将代码编译为中间形式以便高效执行。这些引擎实现了\
  \ `Compilable` 接口。下面的示例展示了如何编译并执行：\n\n```java\nif (engine implements Compilable)\
  \ {\n    Reader reader = Files.newBufferedReader(path, charset);\n    CompiledScript\
  \ script = ((Compilable) engine).compile(reader);\n    script.eval();\n}\n```\n\n\
  当然，如果需要频繁执行，那么编译脚本是有意义的。\n\n### 14.3 Nashorn 引擎\n\nJava Development Kit 自带了一个名为\
  \ Nashorn 的脚本引擎，它非常快并且符合 ECMAScript 5.1 标准（6.0 实现正在进行中）。你可以像使用其他引擎一样使用 Nashorn，但它具有与\
  \ Java 交互的特殊功能。\n\n***\n\n![Image](img/00003.jpeg) Note\n\nNashorn 是德语中“犀牛”的意思——这指的是一本封面上有犀牛的赞誉的书。（如果你把它读作\
  \ nas-horn 而不是 na-shorn，你会获得额外的业力。） \n\n### 14.3.1 从命令行运行 Nashorn\n\nJava Development\
  \ Kit 自带了一个名为 `jjs` 的命令行工具，它与 `jshell` 工具类似，但它是用于 JavaScript 的 shell。只需启动它并输入 JavaScript\
  \ 命令。\n\n```\n$ jjs\n\njjs> 'Hello, World'\nHello, World\n```\n\nJavaScript shell\
  \ 提供了一个“读取-求值-打印”循环，即 REPL。每当你输入一个表达式，它的值就会打印出来。\n\n```javascript\njjs> 'Hello,\
  \ World!'.length\n13\n```\n\n你可以定义函数并调用它们：\n\n```javascript\njjs> function factorial(n)\
  \ { return n <= 1 ? 1 : n * factorial(n - 1) }\nfunction factorial(n) { return n\
  \ <= 1 ? 1 : n * factorial(n - 1) }\n\njjs> factorial(10)\n3628800\n```\n\n***\n\
  \n![Image](img/00009.jpeg) Tip\n\n编写更复杂的函数时，将 JavaScript 代码放入文件中并使用 `load` 命令将其加载到\
  \ `jjs` 中是一个好主意：\n\n```javascript\nload('functions.js')\n```\n\n***\n\n你可以调用 Java\
  \ 方法：\n\n点击此处查看代码图片\n\n```javascript\nvar url = new java.net.URL('http://horstmann.com');\n\
  var input = new java.util.Scanner(url.openStream());\ninput.useDelimiter('$');\n\
  var contents = input.next();\n```\n\n现在，当你输入 `contents` 时，就能看到网页的内容。\n\n\n\n\n\n\
  看看这多么清爽。你不需要担心异常。你可以动态地进行实验。我之前不太确定通过将分隔符设为 `$` 是否可以读取全部内容，但我试了一下，它确实可以运行。而且我不需要写\
  \ `public static void main`。我不需要编译任何东西。我不需要在 IDE 中创建一个项目。REPL 是探索 API 的一种简单方式。用\
  \ JavaScript 驱动 Java 有点奇特，但也很方便。注意看我不需要为 `input` 和 `contents` 变量定义类型。\n\n***\n\n\
  ![Image](img/00009.jpeg) 提示\n\n如果 JavaScript REPL 支持命令行编辑，它会变得更加清爽。在 Linux/Unix/Mac\
  \ OS 上，你可以安装 `rlwrap` 并运行 `rlwrap jjs`。然后你就可以按 `↑` 键获取之前的命令，并对它们进行编辑。或者，你也可以在 Emacs\
  \ 内部运行 `jjs`。别担心——这完全无害。启动 Emacs，按下 M-x（即 Alt+x 或 Esc x），输入 `shell` 回车，然后输入 `jjs`。像往常一样表达式。使用\
  \ M-p 和 M-n 回顾上一行或下一行，并使用左右箭头键在行内移动。编辑一个命令，然后按回车查看其执行结果。\n\n***\n\n### 14.3.2 调用\
  \ Getter、Setter 和重载方法\n\n当你在 Nashorn 程序中拥有 Java 对象时，可以对它们调用方法。例如，假设你获取了 Java 类 `NumberFormat`\
  \ 的一个实例：\n\n点击此处查看代码图片\n\n```javascript\nvar fmt = java.text.NumberFormat.getPercentInstance()\n\
  ```\n\n当然，你可以对它调用方法：\n\n点击此处查看代码图片\n\n```javascript\nfmt.setMinimumFractionDigits(2)\n\
  ```\n\n但在处理属性 getter 或 setter 的情况下，你可以使用属性访问语法做得更好：\n\n点击此处查看代码图片\n\n```javascript\n\
  fmt.minimumFractionDigits = 2\n```\n\n如果表达式 `fmt.minimumFractionDigits` 出现在 `=`\
  \ 运算符的左侧，它会被翻译为 `setMinimumFractionDigits` 方法的调用。否则，它将变为调用 `fmt.getMinimumFractionDigits()`。\n\
  \n你甚至可以使用 JavaScript 的括号符号来访问属性：\n\n点击此处查看代码图片\n\n```javascript\nfmt['minimumFractionDigits']\
  \ = 2\n```\n\n注意 `[]` 运算符的参数是一个字符串。在这个上下文中，它并没用，但你可以使用字符串变量调用 `fmt[str]`，从而访问任意属性。\n\
  \nJavaScript 没有方法重载的概念。给定的名称只能有一个方法，且它可以有任意数量、任意类型的参数。Nashorn 尝试通过查看参数的数量和类型来选择正确的\
  \ Java 方法。\n\n在几乎所有情况下，都只有一个 Java 方法匹配所提供的参数。如果没有，你可以使用以下这种相当奇异的语法手动选择正确的方法：\n\n\
  ```javascript\nlist'remove(Object)'\n```\n\n在这里，我们指定了 `remove(Object)` 方法，用于从列表中移除\
  \ `Integer` 对象 1。（还有一个 `remove(int)` 方法，用于移除位置在 11 的对象。）\n\n### 14.3.3 构建 Java 对象\n\
  \n当你想要在 JavaScript 中构造对象时（而不是由脚本引擎传递给你），你需要知道如何访问 Java 包。有两种机制。\n\n有全局对象 `java`、`javax`、`javafx`、`com`、`org`\
  \ 和 `edu`，它们通过点符号产生包对象和类对象。例如，\n\n点击此处查看代码图片\n\n```javascript\nvar javaNetPackage\
  \ = java.net // 一个 `JavaPackage` 对象\nvar URL = java.net.URL // 一个 `JavaClass` 对象\n\
  ```\n\n如果你需要访问一个不以上述标识符开头的包，可以在 `Package` 对象中找到它，例如 `Package.ch.cern`。\n\n或者，调用\
  \ `Java.type` 函数：\n\n点击此处查看代码图片\n\n```javascript\nvar URL = Java.type('java.net.URL')\n\
  ```\n\n这比 `java.net.URL` 快一点，而且你可以获得更好的错误检查。（如果你拼写了错误，如 `java.net.Url`，Nashorn 会认为它是一个包。）但如果你追求速度和良好的错误处理，你可能根本就不该使用脚本语言了，所以我坚持使用较短的形式。\n\
  \n***\n\n![Image](img/00003.jpeg) 注意\n\nNashorn 文档建议类对象应该定义在脚本文件的顶部，就像你将 import\
  \ 放在 Java 文件的顶部一样：\n\n点击此处查看代码图片\n\n```javascript\nvar URL = Java.type('java.net.URL')\n\
  ```\n\n\n\n\n\n```javascript\nvar price = 10\njava.lang.String.format('Price: %.2f',\
  \ price)\n// Error: `f` format not valid for `java.lang.Integer`\n```\n\n`price`\
  \ 的值恰好是一个整数，它被赋值给一个 `Object`，因为 `format` 方法有一个 `Object...` 变变参数参数。因此，Nashorn 产生了一个\
  \ `java.lang.Integer`。这导致 `format` 方法失败，因为 `f` 格式是为浮点数设计的。在这种情况下，你可以通过调用 `Number`\
  \ 函数强制将其转换为 `java.lang.Double`：\n\n点击此处查看代码图片\n\n```javascript\njava.lang.String.format('Unit\
  \ price: %.2f', Number(price))\n```\n\n### 14.3.6 数组的操作\n\n要构造一个 Java 数组，首先创建一个类对象：\n\
  \n点击此处查看代码图片\n\n```javascript\nvar intArray = Java.type('int[]')\nvar StringArray\
  \ = Java.type('java.lang.String[]')\n```\n\n然后调用 `new` 操作符并提供数组的长度：\n\n点击此处查看代码图片\n\
  \n```javascript\nvar numbers = new intArray(10) // 一个原始类型 `int[]` 数组\nvar names\
  \ = new StringArray(10) // 一个 `String` 引用的数组\n```\n\n然后按照通常的方式使用方括号符号：\n\n```javascript\n\
  numbers[0] = 42\nprint(numbers[0])\n```\n\n你可以通过 `numbers.length` 获取数组的长度。要遍历 `names`\
  \ 数组的所有值，请使用\n\n点击此处查看代码图片\n\n```javascript\nfor each (var elem in names)\n    对\
  \ elem 进行操作\n```\n\n这等于 Java 中的增强型 `for` 循环。如果你需要索引值，请使用以下循环：\n\n```javascript\n\
  for (var i in names)\n    对 i 和 names[i] 进行操作\n```\n\n***\n\n![Image](img/00007.jpeg)\
  \ 注意\n\n尽管这个循环看起来和 Java 中的增强型 `for` 循环一样，但它访问的是索引值。JavaScript 数组可以是稀疏的。假设你初始化一个\
  \ JavaScript 数组为\n\n```javascript\nvar names = []\nnames[0] = 'Fred'\nnames[2] =\
  \ 'Barney'\n```\n\n那么循环 `for (var i in names) print(i)` 会打印 `0` 和 `2`。\n\n***\n\n\
  Java 和 JavaScript 数组非常不同。当你需要在 Java 数组的地方提供 JavaScript 数组，Nashorn 会执行转换。但有时你需要帮助它。给定一个\
  \ JavaScript 数组，使用 `Java.to` 方法获取等等的 Java 数组：\n\n点击此处查看代码图片\n\n```javascript\nvar\
  \ javaNames = Java.to(names, StringArray) // 一个类型为 `String[]` 的数组\n```\n\n相反，使用\
  \ `Java.from` 将 Java 数组转换为 JavaScript 数组：\n\n点击此处查看代码图片\n\n```javascript\nvar jsNumbers\
  \ = Java.from(numbers)\njsNumbers[-1] = 42\n```\n\n你需要使用 `Java.to` 来解决重载歧义。例如，\n\
  \n点击此处查看代码图片\n\n```javascript\njava.util.Arrays.toString([1, 2, 3])\n```\n\n这是歧义的，因为\
  \ Nashorn 无法决定是将将其转换为 `int[]` 还是 `Object[]` 数组。在那种情况下，调用\n\n点击此处查看代码图片\n\n```javascript\n\
  java.util.Arrays.toString(Java.to([1, 2, 3], Java.type('int[]')))\n```\n\n或者简单地\n\
  \n点击此处查看代码图片\n\n```javascript\njava.util.Arrays.toString(Java.to([1, 2, 3], 'int[]'))\n\
  ```\n\n### 14.3.7 列表和映射\n\nNashorn 为 Java 列表和映射 提供了“语法糖”。你可以对任何 Java `List` 使用方括号操作符来调用\
  \ `get` 和 `set` 方法：\n\n点击此处查看代码图片\n\n```javascript\nvar names = java.util.List.of('Fred',\
  \ 'Wilma', 'Barney')\nvar first = names[0]\nnames[0] = 'Duke'\n```\n\n方括号操作符也适用于\
  \ Java map：\n\n点击此处查看代码图片\n\n```javascript\nvar scores = new java.util.HashMap\n\
  scores['Fred'] = 10 // 调用 `put`\n```\n\n要遍历 map 中的所有键值对，你可以使用\n\n点击此处查看代码图片\n\n\
  ```javascript\nfor each (var entry in scores)\n    对 entry 进行操作\n```\n\n要遍历 map\
  \ 中的所有键，你可以使用\n\n点击此处查看代码图片\n\n```javascript\nfor each (var key in scores.keys())\n\
  \    对 key 进行操作\n```\n\n要遍历 map 中的所有值，你可以使用\n\n点击此处查看代码图片\n\n```javascript\nfor\
  \ each (var value in scores.values())\n    对 value 进行操作\n```\n\n***\n\n![Image](img/00007.jpeg)\
  \ 注意\n\n### 14.3.8 Lambda 表达式\n\nJavaScript 拥有匿名函数，例如\n\n点击此处查看代码图片\n\n```javascript\n\
  java.util.Arrays.sort([1, 2, 3])\n```\n\n如果你在 ECMAScript 6，你可以使用箭头语法：\n\n点击此处查看代码图片\n\
  \n```javascript\njava.util.Arrays.sort([1, 2, 3], (a, b) => a - b)\n```\n\n### 14.3.9\
  \ 扩展类和实现接口\n\n要扩展 Java 类，或实现接口，请使用 `Java.extend` 函数。提供类对象或接口以及包含要覆盖方法的 JavaScript\
  \ 对象。例如，这里有一个产生随机数的迭代器。我们重写了两个方法 `next` 和 `hasNext`：\n\n点击此处查看代码图片\n\n```javascript\n\
  var RandomIterator = Java.extend(java.util.Iterator, {\n    next: function() { return\
  \ Math.random() },\n    hasNext: function() { return true }\n}) // `RandomIterator`\
  \ 是一个类对象\n\nvar iter = new RandomIterator() // 使用它来实例化\n```\n\n***\n\n![Image](img/00007.jpeg)\
  \ 注意\n\n另一种 Nashorn 语法允许你定义接口或抽象类的子类。当 `new JavaClassObject` 后面跟着一个 JavaScript 对象时，会返回该扩展类的对象。例如，\n\
  \n点击此处查看代码图片\n\n```javascript\nvar iter = new java.util.Iterator {\n    next: function()\
  \ { return Math.random() },\n    hasNext: function() { return true }\n}\n```\n\n\
  如果父类型是抽象的且只有一个抽象方法，你甚至不需要命名该方法。相反，像它是构造函数参数一样传递函数：\n\n点击此处查看代码图片\n\n```javascript\n\
  var task = new java.lang.Runnable(function() { print('Hello') })\n```\n\n// `task`\
  \ 是实现 `Runnable` 的匿名类对象\n\n***\n\n![Image](img/00007.jpeg) 警告\n\n在扩展*具体*类时，你不能使用这种构造语法。例如，\n\
  \n点击此处查看代码图片\n\n```javascript\nnew java.lang.Thread(function() { print('Hello')\
  \ })\n```\n\n调用了 `Thread` 构造函数，在这种情况下是 `Thread(Runnable)` 构造函数。`new` 的调用返回一个 `Thread`\
  \ 类对象，而不是 `Thread` 子类的对象。\n\n***\n\n如果你想在子类中包含实例变量，请将它们添加到 JavaScript 对象中。例如，这里有一个产生十个随机数的迭代器：\n\
  \n\n\n\n\n点击此处查看代码图像\n\n```javascript\nvar iter = new java.util.Iterator {\n   \
  \ count: 10,\n    next: function() { this.count--; return Math.random() },\n   \
  \ hasNext: function() this.count > 0\n}\n```\n\n注意，JavaScript 方法 `next` 和 `hasNext`\
  \ 指向实例变量 `this.count`。\n\n在重写方法时，可以调用父类方法，但这非常棘手。调用 `Java.super(obj)` 会产生一个对象，通过该对象你可以调用\
  \ `obj` 所属类的父类方法，但你必须拥有该对象。以下是实现这一目标的方法：\n\n点击此处查看代码图像\n\n```javascript\nvar arr\
  \ = new (Java.extend(java.util.ArrayList)) {\n    add: function(x) {\n        print('Adding\
  \ ' + x);\n        return Java.super(arr).add(x)\n    }\n}\n```\n\n当你调用 `arr.add('Fred')`\
  \ 时，在值被添加到列表之前会打印一条消息。注意，调用 `Java.super(arr)` 需要 `arr` 变量，该变量正被设置为 `new` 返回的值。调用\
  \ `Java.super(this)` 是不起的——它获取的是定义该方法的 JavaScript 对象，而不是 Java 代理。`Java.super` 机制仅用于定义单个对象，而不是子类。\n\
  \n* * *\n\n![图像](img/00003.jpeg) 注意\n\n与其调用 `Java.super(arr).add(x)`，你也可以使用语法 `arr.super$add(x)`。\n\
  \n* * *\n\n### 14.3.10 异常\n\n当 Java 方法抛出异常时，你可以用通常的方式在 JavaScript 中捕获它：\n\n点击此处查看代码图像\n\
  \n```javascript\ntry {\n    var first = list.get(0)\n    ...\n} catch (e) {\n  \
  \  if (e instanceof java.lang.IndexOutOfBoundsException) {\n        print('list\
  \ is empty')\n}\n```\n\n注意，这里只有一个 `catch` 子句，不像 Java 中可以按类型捕获表达式。这同样符合动态语言的精神，即所有类型查询都在运行时进行。\n\
  \n### 14.4 使用 Nashorn  Shell 脚本\n\n如果你需要在计算机上自动执行重复任务，很有可能你已经将命令放在 `shell script`（shell\
  \ 脚本）中——这是一种重放一组操作系统级命令的脚本。我有一个 `~/bin` 目录，里面满了几十个 shell 脚本：将文件上传到我的网站、博客、照片存储以及出版商的\
  \ FTP 站点；将图像转换为博客尺寸；给我的学生群发邮件；在凌晨两点备份我的计算机。\n\n对我来说，这些是 bash 脚本，但在我使用 Windows 的旧时代，它们是批处理文件（batch\
  \ files）。这有什么错呢？当你需要分支和循环时，问题就出现了。由于某种原因，大多数命令行壳的实现者在编程语言设计方面非常糟糕。bash 中实现变量、分支、循环和函数的方式简直太差了，而\
  \ Windows 的批处理语言更糟。我有几个 bash 脚本最初很简单，但随着时间的推移堆积了太多冗余代码，变得无法管理。这是一个常见问题。\n\n为什么不直接用\
  \ Java 编写这些脚本呢？Java 非常冗长。如果你通过 `Runtime.exec` 调用外部命令，你需要管理标准输入/输出/错误流。Nashorn 的设计者希望你将\
  \ JavaScript 视为一种替代方案。它的语法相对轻量，且 Nashorn 提供了一些专门为 shell 程序员准备的便利性。\n\n#### 14.4.1\
  \ 执行 Shell 命令\n\n要使用 Nashorn 中的脚本扩展，请运行\n\n```bash\njjs -scripting\n```\n\n现在，你可以通过将命令包含在反引号中来执行\
  \ shell 命令，例如：\n\n```\nls -al\n```\n\n上一个命令的标准输出和标准错误流被捕获在 `$OUT` 和 `$ERR` 中。命令的退出码在\
  \ `$EXIT` 中。（按照惯，退出码 0 表示成功，非零代码描述错误情况。）\n\n你也可以通过将反引号命令的结果赋值给变量来捕获标准输出：\n\n```javascript\n\
  var output = `ls -al`\n```\n\n你可以使用熟悉的 `<` 和 `>` 运算符来重定向标准输入和输出：\n\n```bash\nsort\
  \ < /etc/group\nls -al > /tmp/dir.txt\n```\n\n使用 `|` 运算符将一个命令的输出管道到另一个命令的输入：\n\n\
  ```bash\nls -al | sort\n```\n\n使用分号分隔命令：\n\n```bash\ncd /usr/bin ; ls -al\n```\n\
  \n#### 14.4.2 字符串插值\n\n在 shell 脚本中，`${...}` 内的表达式在双引号和反引号字符串中会被求值。这被称为“字符串插值”。例如：\n\
  \n点击此处查看代码图像\n\n```javascript\ntry {\n    var first = list.get(0)\n    ...\n} catch\
  \ (e) {\n    if (e instanceof java.lang.IndexOutOfBoundsException) {\n        print('list\
  \ is empty')\n    }\n}\n```\n\n注意只有一个 `catch` 子句，不像 Java 中可以按类型捕获表达式。这同样符合动态语言的精神，即所有类型查询都在运行时进行。\n\
  \n\n\n\n\n当你在带有命令行参数的脚本中使用 shebang 时，脚本用户需要在参数之前提供破折号：\n\n```\nscript.js -- arg1\
  \ arg2 arg3\n```\n\n## 练习\n\n1. 在 JavaServer Pages (JSP) 技术中，网页是 HTML 和 Java 的混合体，例如：\n\
