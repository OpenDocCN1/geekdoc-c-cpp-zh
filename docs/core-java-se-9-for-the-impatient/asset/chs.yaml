  \n***\n\n### 2.7.3 方法注释\n\n将每个方法注释紧挨在它的方法之前。对以下特性进行说明：\n\n• 每个参数，带有注释 `@param` `variable\
  \ description`\n• 返回值，如果不是 `void`：`@return` `description`\n• 任何抛出的异常（参见第 5 章）：`@throws`\
  \ `ExceptionClass description`\n\n这里是一个方法注释的示例：\n\n点击此处查看代码图像\n\n```java\n/**\n\
  * 提高员工的工资。\n* @param byPercent 增加工资的百分比（例如，10 表示增加 10%）\n* @return 调薪的金额\n*/\npublic\
  \ double raiseSalary(double byPercent) {\n    double raise = salary * byPercent\
  \ / 100;\n    salary += raise;\n    return raise;\n}\n```\n\n### 2.7.4 变量注释\n\n\
  你只需要记录公共变量——通常意味着静态常量。例如：\n\n点击此处查看代码图像\n\n```java\n/**\n* 地球每年的天数（不包括闰年）\n*/\n\
  public static final int DAYS_PER_YEAR = 365;\n```\n\n### 2.7.5 通用注释\n\n在所有文档注释中，你都可以使用\
  \ `@since` 标签来描述该特性可用的版本：\n\n`@since version 1.7.1`\n\n`@deprecated` 标签会添加一条注释，说明该类、方法或变量不再应被使用。文本应建议一个替代方案。例如：\n\
  \n点击此处查看代码图像\n\n`@deprecated 请改用 setVisible(true)`\n\n***\n\n![Image](img/00003.jpeg)\
  \ 注意\n\n还有一个 `@Deprecated` 注解，编译器在使用已弃用的项时会用它发出警告——参见第 11 章）。该注解没有建议替代方案的机制，因此你应该为已弃用的项同时提供注解和\
  \ Javadoc 注释。\n\n***\n\n### 2.7.6 链接\n\n你可以使用 `@see` 和 `@link` 标签向 javadoc 文档的其他相关部分或外部文档添加超链接。\n\
  \n标签 `@see` `reference` 会会在“另另”（see also）部分添加一个超链接。它可以同时用于类和方法。在这里，reference 可以是以下之一：\n\
  \n• `package.Class#feature label`\n• `<a href=\"...\">label</a>`\n• `\"text\"`\n\
  \n第一种情况是最用的。你提供类、方法或变量的名称，`javadoc` 会插入一个指向其文档的超链接。例如：\n\n点击此处查看代码图像\n\n`@see com.horstmann.corejava.Employee#raiseSalary(double)`\n\
  \n创建一个指向 `com.horstmann.corejava.Employee` 类中 `raiseSalary(double)` 方法的链接。你可以省略包名，或者同时省略包名和类名。这样，特性将在当前包或类中查找。\n\
  \n注意你必须使用 `#` 而不是 `.` 来分隔类与方法或变量名。Java 编译器本身非常擅长猜测点 `.` 作为包、子包、类、内部类及其方法和变量之间分隔符的各种含义。但\
  \ `javadoc` 工具并不那么聪明，所以你必须帮助它。\n\n如果 `@see` 标签后面紧跟一个 `<` 字符，说明你正在指定一个超链接。你可以链接到任何你喜欢的\
  \ URL。例如：`@see <a href=\"http://en.wikipedia.org/wiki/Leap_year\">闰年</a>`。\n\n在这些每情况下，你都可以指定一个可选的标签作为链接锚点。如果你省略了标签，用户将看到目标代码名或\
  \ URL 作为锚点。\n\n如果 `@see` 标签后面紧跟一个 `\"` 字符，引号中的文本将显示在“另另”部分。例如：\n\n点击此处查看代码图像\n\n\
  `@see \"Core Java for the Impatient\"`\n\n你可以为一个特性添加多个 `@see` 标签，但必须将它们全部保持在一起。\n\
  \n如果你愿意，可以在任何文档注释的任何地方放置指向其他类或方法的超链接。在注释的任何地方插入如下形式的标签\n\n`{@link package.class#feature\
  \ label}`\n\n特性的描述遵循与 `@see` 标签相同的规则。\n\n### 2.7.7 包、模块和概览注释\n\n类、方法和变量注释位于类、方法和变量之前，用\
  \ `/** ... */` 包裹。然而，为了生成包注释，你需要在每个包中名为 `package-info.java` 的文件。该文件必须包含 `/** ...\
  \ */` 注释，后面跟着 `package` 语句。\n\n要文档模块，你需要在 `module-info.java` 文件中放置注释，用 `/** ...\
  \ */` 包裹。（参见第 15 章 关于模块。）\n\n你还可以为源文件提供概览注释，放在 `overview.html` 中。该注释会在用户从导航栏选择“概览”（Overview）时显示。\n\
  \n### 2.7.8 注释提取\n\n在这里，`docDirectory` 是你希望 HTML 文件存放的目录名称。遵循以下步骤：\n\n1. 进入要文档的源文件目录。如果你有嵌套包，如\
  \ `com.horstmann.corejava`，你必须在 `com` 目录下。\n2. 运行命令点击此处查看代码图像\n\n```bash\njavadoc\
  \ -d docDirectory package1 package2\n```\n\n如果你省略了 `-d docDirectory` 选项，HTML 文件将提取到当前目录。这会导致混乱，因此我不这样做。\n\
  \n`javadoc` 程序可以通过许多命令行选项进行微调。例如，你可以使用 `-author` 和 `-version` 选项在文档中包含 `@author`\
  \ 和 `@version` 标签。（默认情况下，它们会被省略。）\n\n另一个有用的选项是 `-link`，用于链接标准类。例如，如果你运行命令点击此处查看代码图像\n\
  \n```bash\njavadoc -link http://docs.oracle.com/javase/9/docs/api *.java\n```\n\n\
  所有标准库类都自动链接到 Oracle 文档。\n\n如果你使用 `-linksource` 选项，每个源文件都被转换为 HTML，每个类和方法名变成指向源代码的超链接。\n\
