    ### 引言


    C++ 程序本质上是一个文本文件，其中包含一段使用特定 C++ 文本编写的命令序列。我们可以将这种文本文件称为*源文件*，它通常以 .CPP 扩展名结尾（就像音频文件以
    .MP3 结尾或 PDF 文档以 .PDF 结尾一样）。


    编写 C++ 程序的目的是将一系列特定的 C++ 命令组合在一起，由计算机将其转换为*机器语言*，从而执行我们想要完成的任何任务。这个转换过程称为*编译*，由编译器执行。此外，我们编写的代码还必须包含初始化和清理指令，这个过程称为*链接*。编译和链接的过程合在一起称为*构建*，它将我们的代码构建成计算机可以识别并作为程序运行的机器可执行
    .EXE 文件。


    要在 C++ 中编写程序，你只需要两样东西——一个用于编写代码并构建 .CPP 文件的编辑器，以及一个将代码（源文件）转换为机器可执行文件的编译器，该文件将执行我们为其编程的任务（例如打开文件、播放视频、在屏幕上打印文本等）。


    本书将使用示例供你跟随 Microsoft Visual Studio 进行操作——它是初学者和更高级的 C++ 程序员的完美伴侣。


    '
