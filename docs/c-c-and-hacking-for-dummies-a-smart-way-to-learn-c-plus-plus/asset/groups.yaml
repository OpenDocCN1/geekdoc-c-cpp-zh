  mdcn: "\n\n## 第6章 – 数组\n\n数组与变量非常相似，因为它们允许我们存储信息以备后用。数组允许我们在单个名称下存储一组数据，这意味着我们可以在组织数据方面拥有更高程度的控制力，这在处理具有数千行代码的大型程序时尤其有用。\n\
    \n为了举例说明一组数据如何存储在数组中，想象一下你想设计一个程序来显示5个人的年龄。你需要声明变量的名称和变量的值，看起来会像这样：\n\n```cpp\n\
    int age1=15;\nint age2=24;\nint age3=54;\nint age4=33;\nint age5=120;\n```\n\n\
