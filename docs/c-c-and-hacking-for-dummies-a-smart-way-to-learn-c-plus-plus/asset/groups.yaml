    wherever this letter x appears, it will be worth the number 1. In essence, the
    letter x is *holding or storing* the number 1 until it needs to be used in a statement
    or algorithm. Variables work in exactly the same way in C++, except for the fact
    that we will always include a scope bracket at the end to imply and tell the program
    that it is the end of a function. For example:


