    ## 第2章 – 关系模型示例


    由于我在上一章一直使用人员数据库，现在我将给你一个联系人数据库，作为关系模型的完美示例。


    一个简单的联系人数据库通常如下所示：


    | 名 | 姓 | 电子邮件地址 |

    |---|---|---|

    | John | Doe | johndoe@email.com |

    | Mae | Lee | maelee@email.com |


    在这张表中，我们有三个用于查找特定数据的列。第一列要求填写名，第二列要求填写姓，第三列要求填写此人的电子邮件地址。


    我们的行（不包括第一行）指代单个实体。第一个实体所在的行指代名为 John Doe 的人，他的电子邮件是 johndoe@email.com。第二个实体所在的行指代
    Mae Lee，其电子邮件地址是 maelee@email.com。


    这是一个包含两个实体、分为三列的数据库示例。


    假设 John Doe 有两个电子邮件地址，而 Mae Lee 有三个。有些人最终会通过添加列来加入额外数据。因此，表格最终会变成这样。


    | 名 | 姓 | 电子邮件 1 | 电子邮件 2 | 电子邮件 3 |

    |---|---|---|---|---|

    | John | Doe | johndoe@… | johndoe2@… | NULL |

    | Mae | Lee | maelee@… | maelee2@… | maelee3@… |


    如果我们使用这种数据库设计，这里就有一个问题。首先，假设我们手头的问题是要找出每个人有多少个电子邮件地址，那会怎样？这相当困难


    ## 第3章 – SQL 语句


    SQL 是一种特定的数据库语言。我们使用这种语言来创建语句。这些语句由有效单词组成。其中一些单词应由 SQL 定义，而另一些单词应由你定义。你将在这些语句中声明的一些单词是表名、列名，以及表中的变量或数据。


    ### SQL 事实


    在我们继续之前，我想向你展示一些关于 SQL 的重要事实。


    关于 SQL，你需要知道的第一件事是它可读，因为它是用英语编写的。换句话说，学习 SQL 比学习任何其他编程语言都更容易。


    第二，使用 SQL 可以做更多事情。这与大多数人的印象相反，他们认为 SQL 只用于数据查询。这是错误的。


    第三，有效的 SQL 语句应以分号（;）结尾。尽管有些人会告诉你它不再需要，但我建议你在查询中加上它，因为它是 ANSI 标准的一部分。此外，它在旧数据库和现代数据库中都能正常工作。分号让你可以方便地将多条语句一起声明为我们所说的一个批处理。这种方法即使在现代数据库中也有效。


    第四，SQL 不区分大小写。你可以将变量写成小写和大写。两种方式在结构化查询语言中都能正常工作。练习这一点的一个好方法是：将 SQL 特定关键字写成大写，将用户定义的关键字写成小写。这将让你能够高效快速地识别语句中的不同关键字。


    ### SQL 命令


    重要的是要记住，所有 SQL 语句都以命令开头。命令通常是一个动词，用来表示数据库需要做什么。SQL 语句中使用的命令的一个好例子是 SELECT。


    SELECT 命令告诉数据库选择一组数据。如你所见，它是一个基于英语的单词，系统会做什么也相当明显。该命令在 SQL 语句中使用时如下所示。


    ```sql

    SELECT VALUES

    FROM TABLENAME;

    ```


    上面的示例是一个 SQL 语句的通用示例，我稍后会逐部分讨论它。


    请注意，你在语句中需要声明的值或变量集合取决于你试图执行什么命令。所有这些变量都紧跟在命令之后出现在语句中。


    ### 命名值


    正如我已经说过的，SQL 语句由 SQL 规范内的词和用户创建的名称组成。这意味着在 SQL 中，为键、表名、列等命名很重要。


    在 SQL 中命名事物没有绝对规则。人们有自己命名变量的方式，但为了保持一致，我建议你遵循我在本书中使用的方法。以下是我将在本书中采用的两条命名规则：


    - 所有表名必须使用单数形式。（例如 person、email、phone、user 等）


    ### 在 SQL 中创建数据


    我无意教你如何从零开始创建数据库。作为初学者，你的任务应该只围绕向已有数据库添加或更新值。不过，我感觉你们中有些人仍然渴望学习 SQL，以便创建包括数据库本身在内的整个应用程序。因此，我会介绍
    SQL 的那部分内容，但只介绍足够帮助你起步的内容。


    用于创建新数据库的 SQL 关键字是 CREATE DATABASE 语句，这属于 ANSI 规范。假设你想为人们的联系电话创建一个新数据库，并想将这个新数据库命名为
    Contacts。你可以按以下方式操作。


    ```sql

    CREATE DATABASE Contacts;

    ```


    为了在该数据库上工作，你需要先使用它。我们这里需要的关键字是 USE DATABASE 命令。我们将按以下方式执行它。


    ```sql

    USE DATABASE Contacts;

    ```


    如果你想在 Contacts 数据库中创建表，那么你需要执行 CREATE TABLE 命令，方法如下。


    ```sql

    CREATE TABLE Contacts.User (...);

    ```


    之后，你就可以放入所有列名、类型和定义。


    ### 数据类型


    数据类型很重要，因为它遵循列限制。每一列都有一条规则，规定可以在其中存储哪种类型的数据。


    以下是一些主要数据类型及其简要说明。


    | 数据类型 | 描述 |

    |---|---|

    | CHARACTER | 用于定义列中允许的字符数。不能多，也不能少。 |

    | CHARACTER VARYING | 用于定义列中允许的最大字符数。可以少于该值，但不能多于该特定值。 |

    | BINARY | 用于将列专用于存储十六进制数据。 |

    | SMALLINT | 用于存储从 -32,768 到 32,767 的数值数据。 |

    | INTEGER | 用于存储从 -2,147,483,648 到 2,147,483,647 的数值数据。 |

    | BIGINT | 用于存储从 -9,223,372,036,854,775,808 到 9,223,372,036,854,775,807 的数值数据。
    |

    | BOOLEAN | 用于存储 TRUE 或 FALSE 值。 |

    | DATE | 用于按以下格式存储日、月和年：YYYY-MM-DD。 |

    | TIME | 用于按以下格式存储秒、分和时：HH:MM:SS。 |

    | TIMESTAMP | 用于同时存储时间和日期。 |


    例如，还支持其他数据类型，可用于更复杂的数字。也有针对 UNICODE 字符与常规字符的特定数据类型。现在这些只是你可以在数据库编程中使用的少数几种类型。


    ## 第4章 – 在 MySQL 中编码


    我将教你如何使用 MySQL 编写 SQL 数据库代码。为什么选择 MySQL？首先，因为它是一个开源平台，你可以免费获取。其次，因为它兼容所有主流操作系统：Linux、OSX
    和 Windows。第三，因为它具有 ANSI 模式，可以对你的数据库强制执行 ANSI 规范。并非所有 RDBMS 都有这种功能。


    在本章中，我将教你如何高效使用 SELECT 命令。这将让你能够有效地使用该命令来创建有趣且高效的数据查询。


    '
