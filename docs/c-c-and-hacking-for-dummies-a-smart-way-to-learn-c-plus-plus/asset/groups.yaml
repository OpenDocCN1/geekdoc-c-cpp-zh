  mdcn: "\n要查看条件并让程序做出选择，我们将使用如下语法：\n\n```text\nif (and then we include our condition\
    \ here)\n{\n    insert our program here for the program to work out\n}\n```\n\n\
    这基本上是在说：“如果发生这种情况，那么就执行这个”。你应该熟悉 IF、THEN、AND、OR 这些基本术语，它们属于基础数学和问题求解技能。不过，条件是我们放在括号里的，程序可以据此选择是否执行该条件。例如，如果我们有三个变量\
    \ x、y 和 z，首先需要向程序声明它们的值。不过，为了开始在表达式中引入一些运算符，假设变量“x”大于变量“y”。\n\n我们的代码会像这样：\n\n\
    ```cpp\nint x,y,z;\n\ncin>>x;\n\ncin>>y;\n\nif(x>y)\n{\n    z = x+y;\n    cout<<z;\n\
    }\n```\n\n一旦我们声明了变量 x 和 y 的值，程序就会判断“x”是否确实大于“y”。如果程序发现这一点为真，那么未初始化的变量“z”将被赋值为\
    \ x 与 y 的和，然后给我们答案。然而，如果程序发现 x 不大于变量 y，则什么也不会发生。\n\n在这里，我们让程序能够选择在不同场景下可以做什么。在这个例子中，我们现在必须告诉程序：如果\
    \ x 不大于变量 y，应该做什么。\n\n看看下面的代码：\n\n```cpp\nint x,y,z;\n\ncin>>x;\ncin>>y;\n\nif(x>y)\n\
    {\n    z = x+y;\n    cout<<z;\n}\nelse if (x<y)\n{\n    z=x-y;\n    cout<<z;\n\
    }\n```\n\n现在我们已经告诉程序：如果 x 不大于 y，就转到下一个选项，该选项告诉我们要给出 x 减 y 的结果作为答案。你可以按需添加任意多个这样的条件，这将使你能够创建一个用途非常广泛、可应用于多种方式的程序。但是，沿用我们的例子，如果变量\
    \ x 既不大于也不小于变量 y，会怎样？什么也不会发生。我们仍然希望程序做*某些事情*，因此可以加入：\n\n```cpp\n//Full Working\
    \ Program\n#include <iostream>\nusing namespace std;\n\nint main()\n{\n    int\
    \ x,y,z;\n\n    cin>>x;\n    cin>>y;\n\n    if(x>y)\n    {\n        z=x+y;\n \
    \       cout<<z;\n    }\n    else if (x<y)\n    {\n        z=x-y;\n        cout<<z;\n\
    \    }\n    else\n    {\n        cout<<\"x is not greater or less than y so they\
    \ must be equal\"<<endl;\n    }\n    return 0;\n}\n```\n\n现在我们创建了一个程序：如果 x 既不大于也不小于变量\
    \ y，那么“if”和“else if”条件将不会被执行。由于前两个条件无法满足，程序现在可以选择执行第三个条件“else”。我们还可以在这些条件串中使用许多不同类型的运算符。请参阅前面关于运算符的章节。\n\
    \n## 第 5 章 – 循环\n\n我们已经了解了基础编程、变量、运算符和条件。现在我们必须看看循环。循环是编程中非常重要的一部分，因为它们使我们的程序能够按照你指定的次数反复运行相同的代码行。你可能认为一遍又一遍地做同样的任务毫无意义且没有用处，但随着我们学习接下来的内容，循环背后的意义会变得非常清楚。\n\
    \n让我们看看下面这段程序中的代码行。\n\n```cpp\n#include <iostream>\n\nusing namespace std;\n\n\
    int main()\n{\n    cout<<\"1\"<<endl;\n    cout<<\"2\"<<endl;\n    cout<<\"3\"\
    <<endl;\n    cout<<\"4\"<<endl;\n    cout<<\"5\"<<endl;\n    cout<<\"6\"<<endl;\n\
    \    cout<<\"7\"<<endl;\n    cout<<\"8\"<<endl;\n    cout<<\"9\"<<endl;\n    cout<<\"\
    10\"<<endl;\n\n    return 0;\n}\n```\n\n你大概可以看出，根据我们目前所学，这个简单的程序会向我们显示从 1 到 10\
    \ 的数字。你大概能猜到，如果你不得不在程序中加入许多这样的代码行，这项任务会变得非常无聊和单调。你能想象如果必须设计一个显示从 1 到 1000 的数字的程序吗？不过幸运的是，有一个解决方案可以让我们的工作轻松得多。我们可以创建一种语法，把上面的例子变成一行简单的代码。这种语法就是循环，看起来像这样：\n\
    \n```cpp\nfor (initialization; condition; increment/decrement)\n```\n\n这基本上是在说：“对于下面的内容，执行这个”。初始化是程序的起点（你现在应该已经知道），条件是我们交给程序去执行的选择，最后，递增和递减表示随着程序和循环继续运行，我们希望从起始数字中增加或减去多少。\n\
    \n下面是与上面相同的例子，只不过这次我们加入了一个循环。\n\n```cpp\n#include <iostream>\n\nusing namespace\
    \ std;\n\nint main()\n{\n    int x;\n\n    for (x=0; x<=10; x++)\n    {\n    \
    \    cout<<x;\n    }\n\n    return 0;\n}\n```\n\n这个程序执行后打印数字的效果与上面的例子完全相同，只不过在这个程序中，我们不需要为程序指定\
    \ 1 到 10 之间的每一个数字来显示。\n\n这组新代码之所以更有效，是因为我们可以看到我们使用了“for (x=0; x<=10; x++)”，这就是上面看过的（初始化；条件；递增/递减）语句。在这里，我们声明程序开始时\
    \ x 等于 0，并且当 x 小于或等于 10 时程序将结束。“x++”的递增/递减意味着 x 的值会在每次循环结束时增加 1。\n\n进一步解释一下，循环运行的条件是程序会问自己：x\
    \ 是否等于 10 或小于 10？如果是，就给 x 加 1。然后程序会问自己：如果 x 现在为 1，它等于或小于 10 吗？是的，所以我再加 1。最终程序会对自己说：“x\
    \ 等于 10，它等于或小于 10 吗？是的。我不会再循环，现在结束程序”。这基本上就是循环的工作方式。程序会有一定数量的条件被持续检查，如果这些条件通过或满足，就会再进行一次循环或重复该序列。\n\
    \n我们刚才看到的是“for”循环。我们还将了解另外两种循环。我们要看的第一个新循环称为“while”循环。while 循环将使你的程序在某些情况下更加灵活，基本语法大致如下：\n\
    \n```cpp\nwhile (condition)\n{\n    statement section;\n}\n```\n\n这是因为 while 循环只关注为它设置的条件，以及循环之间数字的递增。我们也可以通过编写以下内容来简化\
    \ while 循环：\n\n```cpp\nwhile (x<=10)\n{\n    cout<<x++<<endl;\n}\n```\n\n这表示当\
    \ x 小于或等于 10 时，它会给 x 加 1。这里唯一的区别是 x 已在程序开始时声明。\n\n我们要看的第三种循环称为“do while”循环。它会执行相同的任务，但条件放在循环末尾，因此直到循环第一次运行之后，才会检查它是否应该执行。例如：\n\
    \n```cpp\n//Full Working Program\n#include <iostream>\nusing namespace std;\n\n\
    int main()\n{\n    int x=0;\n    do\n    {\n        cout<<x<<endl;\n        x++;\n\
    \    } while(x<=10);\n\n    return 0;\n}\n```\n\n这表示当 x 小于或等于 10 时，会给 x 加 1。你注意到\
    \ while 循环末尾的分号了吗？这意味着我们将这一行作为一个语句结束，供程序执行。\n\n"
