    \n```cpp\n#include <iostream>\nusing namespace std;\n\nint main()\n{\n    int\
    \ ages [5];\n    ages={15,24,54,33,120};\n    cout<<ages<<endl;\n\n\nreturn 0;\n\
    }\n```\n\n你能看出上面代码中的错误吗？大多数人会认为我们可以像之前的示例那样编写这个程序，即定义一组变量，然后让程序在执行时列出这些变量。然而，在处理数组时情况并非如此。这段代码的问题在于，我们在定义数组后，以“cout<<ages<<endl;”结束了程序。问题在于C++不能直接打印整个数组，因为必须告诉编译器（Microsoft\
    \ Visual Studio）要显示哪个数组。例如，如果我们想显示年龄120，就需要让它显示ages[4]。然后我们需要像下面这样列出每个变量：\n\n\
    ```cpp\nint main()\n{\n    int ages [5];\n    ages={15,24,54,33,120};\n    cout<<ages[0]<<endl;\n\
    \    cout<<ages[1]<<endl;\n    cout<<ages[2]<<endl;\n    cout<<ages[3]<<endl;\n\
    \    cout<<ages[4]<<endl;\n\n\nreturn 0;\n}\n```\n\n但你不是说有办法将一整套整数存储到数组中吗？确实有，我们这样做的方式是声明一个变量，比如“k”，并告诉程序它存储的是要使用的整数。\n\
    \n例如：\n\n```cpp\n//Full working program\n#include <iostream>\n\nusing namespace\
    \ std;\n\nint main ()\n{\n    int k;\n    int ages [5];\n    ages = {15,24,54,33,120};\n\
    \n        for (k=0; k<5; k++)\n        {\n                cout<<ages[k]<<endl;\n\
    \        }\n\nreturn 0;\n}\n```\n\n注意我们是如何定义“k”为一个变量，并声明它包含上面的整个数组的？基本上，“k”被声明为0，只要“k”保持小于5，它就会执行数组（如果你注意到这里使用的运算符不同，在这种情况下是不等于）。程序基本上是在说，它会显示这些年龄，直到“ages”数据类型达到5，此时程序将停止显示年龄。\n\
    \n```cpp\n*p=25.3;\n```\n\n现在这表示，通过将p设为指针，并将p指向x，x等于25.3。由于p持有x，x现在的值为25.3（无论p的值是什么）。如果我们想编写一个完整的程序，使用指针并为其赋值，我们可以这样写：\n\
    \n```cpp\n//Full working program\n#include <iostream>\n#include <stdlib.h>\n\n\
    using namespace std;\n\nint main()\n{\ndouble x;\ndouble *p;\np=&x;\n*p=25.3;\n\
    \    cout<<x<<endl;\n\nsystem(\"pause\");\nreturn 0;\n}\n```\n\n这个程序将p指向x，并告诉程序x的值为25.3。然而，这看起来似乎指针并不是很有用。我们完全可以只使用变量并定义它们（也许再使用一些条件循环）来让程序工作。不过，它们的有用之处在于，只需将一个变量指向另一个变量，就能操纵信息和代码。这就是它们真正变得有用的地方。\n\
    \n比如说，你已经编写了几千行代码。现在，想象一下，如果你突然需要更改代码中50个变量的值呢？要在代码行中找到所有这些值会花费很长时间，甚至可能意味着你必须重写整个代码。如果你在这个过程中意外更改了不应更改的内容，程序可能会被破坏。\n\
    \n幸运的是，这正是指针真正发挥重要有用功能的地方。我们可以使用指针来更改程序中已经存在的变量的值，也可以在编写程序开始时指向并声明这些变量。指针允许我们操纵函数，而普通变量则无法做到这一点。\n\
    \n这就是入门阶段你需要了解的关于指针的全部内容。\n\n一切事物，甚至代码行，都需要存储空间来保存和执行。例如，当你将一首歌或一张照片从电脑复制到手机，或者反过来复制时，会有一个程序在文件移动之前询问手机或电脑是否有足够的空间。这是因为如果没有足够的存储空间来保存新文件，那么尝试移动它是毫无意义的。程序会在操作执行之前确定是否有足够的存储空间来执行该操作。\n\
    \n然而，在某些情况下，程序要等到执行时才会知道需要多少内存或存储空间，而且这个内存量可能会不断变化。这就是为什么在编写任何C++程序时，你需要告诉它分配一定数量的内存或存储空间来满足需求（而这个数量有时可能是未知的）。这里我们将重点讨论第二种内存类型，因为在任务执行之前确定存储的内存需求是很容易的。\n\
    \n每次程序执行时，分配的内存需求可以称为“new”运算符。但是，一旦不再需要该内存分配，我们就称之为“delete”运算符。其语法如下所示：\n\n```cpp\n\
    new datatype;\n```\n\n这基本上意味着我们正在定义一个新的运算符，后面跟随着我们之后定义的任何内容。举个例子，我们可以编写一些代码，在程序执行时立即使用指针分配内存：\n\
    \n```cpp\ndouble* pvalue = NULL;\npvalue = new double;\n```\n\n然而，这些代码行不会告诉我们内存是否已成功分配——它只是一个分配命令。在这种情况下，为了让程序告诉我们内存已成功分配，我们可以这样写：\n\
    \n```cpp\ndouble* pvalue = NULL;\nif( !(pvalue = new double ))\n{\n    cout <<\
    \ \"Error: out of memory.\" <<endl;\n    exit(1);\n```\n\n"
