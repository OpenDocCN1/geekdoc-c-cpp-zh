  mdcn: "\n本书到目前为止学到的其他内容。但让我们进一步看看还有哪些其他方式可以为程序分配内存。例如，假设我们想编写一个程序，向我们显示一行 100 个字符。基于上面的示例，代码将如下所示：\n\
    \n```cpp\nchar* pvalue = NULL;\npvalue = new char[100];\n```\n\n这表示我们声明指针为 NULL，并且已经执行了一个新的内存请求，以便为我们的\
    \ 100 个字符分配内存。一旦我们不再需要分配这块内存，就插入一个 delete 运算符：\n\n```cpp\ndelete [] pvalue;\n\
    ```\n\n现在我们已经告诉程序删除前面几行代码中指针所指向的数组。但是，如果我们想同时为多个数组分配内存呢？我们不需要为每一个都启动一个新的运算符。相反，我们可以这样写：\n\
    \n```cpp\ndouble ** pvalue = NULL;\npvalue = new double [4] [5];\n```\n\n这里，我们首先声明指针的值为\
    \ NULL，然后告诉程序我们要为一个维度为 4x5 的数组分配内存。删除操作与之前相同：\n\n```cpp\ndelete [] pvalue;\n```\n\
    \n## 第9章——类与对象\n\n现在我们已经学习了 C++ 编程的基础知识，是时候看看稍微高级一些的内容了。类是所谓“面向对象”编程的一部分。这让我们可以通过使用对象来把程序应用于日常生活。对象可以定义为我们在日常生活中使用的任何东西——例如汽车、电脑、手机等等。到现在我们应该已经了解到，一个程序是由其中许多很小的程序组成的，就像汽车由许多很小的部件组成，这些部件协同工作以便汽车运行。其中一些组件可以改变，比如打开和关闭汽车里的灯，而另一些则不能改变，比如汽车的中心计算机。这些可以通过我们所说的“私有”和“公共”变量来区分，换句话说，就是哪些允许你更改，哪些不允许（但我们稍后会讨论这一点）。\n\
    \n在学习 C++ 时，类存在于稍微更高级的层面上，因为它们涉及的内容更多。然而，学习它们会带来很大的回报，因为它将使我们能够创建和开发可应用于日常生活的程序。它们还允许我们重用代码并将其应用于不同的场景。例如，一支足球队中的每名球员都会有姓名、年龄和收入，但每个球员的这些信息都会不同。在这种情况下，代码将创建类的属性，也就是每名球员的姓名、年龄和收入。\n\
    \n将这个作为示例写出来，我们用于球员信息的代码将如下所示：\n\n```cpp\nclass Player\n{\n    string name;\n\
    \    string age;\n    double income;\n};\n```\n\n我们的 Player 类现在有了结构。从现在开始，每当我们为单个球员的各个变量声明值时，我们都会创建一条新记录，或者说创建一个存在于\
    \ Player 类中的新对象。每个对象都将包含姓名、年龄和收入。为了声明每个 Player 类型的变量，我们使用与声明任何其他变量相同的方法：\n\n```cpp\n\
    Player player1;\nPlayer player2;\nPlayer player3;\n```\n\n一旦我们像第一个示例那样创建了一个类，我们就可以像使用之前用过的任何其他数据类型示例一样使用它。然而，我们还希望能够限制程序在这些类结构中可以访问和操作的内容。有些对象或类必须始终保持不变（私有类），而有些则可以更改（公共）。例如，只包含姓名、年龄和收入的类必须保持私有，因为这是常量。另一方面，我们为每个个体声明的变量是公共的，因为该信息不是常量。\n\
    \n要在代码中看到这一点，我们会这样写：\n\n```cpp\nclass Player\n{\nprivate:\n    string name;\n\
    \    string age;\n    double income;\n\npublic:\n    Player();\n};\n```\n\n执行上面的代码行将禁止程序更改姓名、年龄和收入的私有类，但会允许它更改单个球员信息的公共类。我们在声明\
    \ private 和 public 后使用“:”，因为它们告诉程序，其后的所有内容都被视为该类别类型。\n\n当我们看到构造函数在代码中的作用时，理解起来会简单得多。基本上，它们会根据我们给它的内容创建一个类或一条信息条目。它们在一定程度上为我们完成了工作。然而，我们还需要看看析构函数以及它们在程序中的作用。\n\
    \n析构函数与构造函数相反，因为它们会删除而不是创建数据。执行析构函数所用的语法是 ~ 后跟类的名称。例如：\n\n```cpp\n~Player();\n\
    ```\n\n以上就是 C++ 编程中类和对象的基础知识。当然，还有很多内容可以研究，但那超出了初学者水平的范围。\n\n## 结论\n\n总之，通过阅读本书，你现在应该具备理解\
    \ C++ 编程语言基础知识所需的基本技能，并且现在应该能够轻松地编写自己的简单 C++ 程序。只需记住，尽管从表面上看每个程序都很复杂，并且充满了许多行代码，但它实际上只是一组组成整体的较小程序。只要专注于一次处理这些较小的程序，你就没问题了。\n\
