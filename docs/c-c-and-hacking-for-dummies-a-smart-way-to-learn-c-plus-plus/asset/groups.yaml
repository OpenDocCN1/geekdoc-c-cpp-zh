    \n数组的语法如下所示：\n\n```cpp\ndatatype name [index];\n```\n\n这意味着我们想要列出一系列存储的值，就像变量一样。为了创建一个存储类似内容的数组，在本例中即5个人的年龄，我们可以这样写：\n\
    \n```cpp\nint ages [5];\n```\n\n这意味着我们有一个包含5个元素的列表，程序此时只知道它叫做“ages”。就像为字母“x”声明一个值一样，我们也必须为这个名为“ages”的新变量声明值。我们可以通过以下方式做到这一点：\n\
    \n```cpp\nint ages [5];\n```\n\n```cpp\nages[0]=15;\nages[1]=24;\nages[2]=54;\n\
    ages[3]=33;\nages[4]=120;\n```\n\n虽然我提到过有一个更简单的方法来编写这个索引，但上面的写法看起来完全一样。原因在于我想向你们展示我们如何声明这个新的ages数据类型。当我们启动程序时，我们已告诉它，在开始时有一个包含[5]个元素的数组。我们的声明列表从0开始的原因，是因为计算机就是这样读取数字列表的。0始终表示第一个。\n\
