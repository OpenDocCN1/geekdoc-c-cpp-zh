- pgno: 29
  md: '# ### Creating Data in SQL


    I have no intention to teach you how to create a database from scratch. As beginners,
    your tasks should only circle around adding or updating values to an already existing
    database. However, I have a feeling that some of you still have that eagerness
    to learn SQL in order to create the entire application including the database
    itself. And so, I will introduce that part of SQL, but just enough to help you
    jumpstart.


    The SQL keyword to create a new database is the statement CREATE DATABASE and
    this falls under ANSI specification. Let us say you want to create a new database
    for contact numbers of people and you want to name this new database as Contacts.
    Here is how you are going to do it.


    ```

    ```sql

    CREATE DATABASE Contact;

    ```

    ```


    In order for you to work on that database, you need to use it first. The keyword
    we need here is the USE DATABASE command. This is how we are going to execute
    it.


    ```

    ```sql

    USE DATABASEContact;

    ```

    ```


    If you want to create a table inside the Contact database, then what you need
    to execute is the CREATE TABLE command and here is you do it.


    ```

    ```sql

    CREATE TABLE Contacts.User (...);

    ```

    ```'
  merge: -1
