- pgno: 38
  md: '# # FROM Command


    Selecting a single table is fairly easy to write an SQL statement. As you can
    see from previous examples, it only follows a simple format.


    ```

    ```sql

    FROM [TABLE_NAME]

    ```

    ```


    In FROM clause, you can shorten the name of your table by creating an alias for
    the table name. Let us say that your table name is “telecommunication” and you
    are looking for the list of owner names that can be found under the “owner” column
    of our table. Typing it with the use of the generic format will give you this.


    ```

    ```sql

    SELECTtelecommunication.ownerFROMtelecommunication;

    ```

    ```


    Why do we need to type the table name before the column name in our format above?
    This is because we must qualify the column by using the table name. Furthermore,
    this will save you from name collisions in the future if there will be columns
    with similar names. I suggest you make this a habit.


    Going back to the topic, doing so is too much of inconvenience. We can shorten
    the table name by assigning an alias in the FROM clause. Here’s the format.


    ```

    ```sql

    SELECT      [TABLE_NAME_ALIAS].[COLUMN_NAME]      FROM

    [TABLE_NAME] [TABLE_NAME_ALIAS];

    ```

    ```'
  merge: -1
  img_proc: true
- pgno: 39
  md: 'Using the owner column and telecommunication table, our new statement will
    look like this.


    ```

    ```sql

    SELECT t.owner FROM telecommunication t;

    ```

    ```


    As you can see, I assigned the letter “t” to be the alias of the table name. This
    is easier to write than repeating the complete name over and over again. Keep
    in mind that it is not necessary to use the first character of your table name
    as an alias. You can assign any alias to the table name and it can also be a combination
    of characters. Just make sure that you are consistent with the alias you use.


    # Limiting The Results


    Whenever you execute a SELECT query, the database will give you all the rows under
    the column you specified. This means that if your table has 20, 000 rows, then
    it will return 20, 000 values to answer your statement.


    There are two ways to address this issue. One is to assert additional clause after
    the FROM clause. The other is by adding the DISTINCT qualifier before the select
    list. This shown in this format.


    ```

    ```sql

    SELECT DISTINCT [SELECT LIST] FROM [TABLE_NAME];

    ```

    ```


    This format will only give you distinct values in return instead of providing
    you with all the values under the specified column. This is the perfect way to
    have all the unique values under that column. For example, you have a table for
    your contacts and some entities were asserted in several rows because they own
    multiple phone numbers.


    Relying on the generic format will give you duplicated results. This is not efficient
    if you only want to know who are your contacts, right? Using the DISTINCT qualifier
    will prevent you from receiving multiple rows for the same entity.'
  merge: -1
