- pgno: 78
  md: "Everything, even lines of code, need storage space to be stored and to be executed.\
    \ For example, when you are copying a song or a photo from your computer to your\
    \ phone or vice versa, there will be a program which will ask the phone or the\
    \ computer if there is enough space before the file is moved. This is because\
    \ if there is not enough storage space to store the new file, it is pointless\
    \ even trying to move it. The program will determine before the process is executed\
    \ if there is enough storage space for the operation to be executed.\n\nHowever,\
    \ there are cases when the program will not know how much memory or storage is\
    \ needed until the program is executed, and this amount of memory can constantly\
    \ change. This is why when you write any C++ program, you need to tell it to allocate\
    \ a certain amount of memory or storage to accommodate for this (and this can\
    \ sometimes be unknown). This second type of memory is what we will be focusing\
    \ on here, since it is easy to determine memory needs of storage before a task\
    \ is executed.\n\nEvery time the program is executed, the allocated memory needs\
    \ can be referred to as the “new” operator. But, as soon as the memory allocation\
    \ is no longer needed, we refer to “delete” operator. The syntax for this looks\
    \ like:\n\n```\n```\nnew datatype;\n```\n```\n\nThis basically means that we are\
    \ defining a new operator, followed by whatever it is that we define afterwards.\
    \ As an example, we can write some code where we will use a pointer to allocate\
    \ memory as soon as the program is executed:\n\n```\n```cpp\ndouble* pvalue =\
    \ NULL;\npvalue = new double;\n```\n```\n\nHowever, these lines of code will not\
    \ tell us if memory has been successfully allocated – it is only a command to\
    \ allocate. In that case, to have the program tell us that memory has been successfully\
    \ allocated, we would write:\n\n```\n```cpp\ndouble* pvalue = NULL;\nif( !(pvalue\
    \ = new double ))\n{\n    cout << “Error: out of memory.” <<endl;\n    exit(1);\n\
    ```\n```"
