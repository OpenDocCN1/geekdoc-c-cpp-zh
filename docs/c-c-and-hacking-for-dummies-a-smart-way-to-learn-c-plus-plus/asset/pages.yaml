  md: '# # CHAPTER 4 – Coding in MySQL


    I will teach you how to code SQL database using MySQL. Why MySQL? First is because
    it is an open-source platform and you can get it for free. Second is because it
    is compatible with all major operating systems: Linux, OSX, and Windows. Third
    is because it features ANSI mode which enforces ANSI specifications to your database.
    Not all RDMs have this kind of feature.


    In this chapter, I will teach you how to efficiently use the SELECT command. This
    will allow you to effectively use this command to create interesting and efficient
    data queries.'
