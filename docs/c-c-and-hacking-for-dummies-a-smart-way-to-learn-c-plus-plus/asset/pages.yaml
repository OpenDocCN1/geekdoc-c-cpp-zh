  md: '# # Chapter 6 – ARRAYS


    Arrays are very similar to variables in that they allow us to store information
    for later use. Arrays allow us to store a collection of data under a single name,
    which means that we have a greater level of control in organizing our data which
    becomes very useful especially dealing with large programs with thousands of lines
    of code.


    To give you an example of how a set of data could be stored in an array, imagine
    that you wanted to design a program which would display the age of 5 people. You
    would need to declare the name of the variable and the value of the variable,
    which would look something like this:


    ```

    ```

    int age1=15;

    int age2=24;

    int age3=54;

    int age4=33;

    int age5=120;

    ```

    ```


    We are now faced with the same problem as before in the previous chapter where
    we wanted to print the numbers from 1 through to 10. Imagine if you had to design
    a program to display a list of the ages of 500 people? Luckily though, just as
    we saw in the previous chapter, there is a way to display this information without
    having to manually type in every single line of code.


    The syntax for an array looks like this:


    ```

    ```

    datatype name [index];

    ```

    ```'
