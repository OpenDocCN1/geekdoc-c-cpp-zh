  md: "the other things that we have learnt in this book so far. But let’s have a\
    \ further look at other ways we can allocate memory to our program. For example,\
    \ let’s assume that we want to make a program that will display to us a line of\
    \ 100 characters. Based on the examples above, the code would look like this:\n\
    \n```\n    char* pvalue = NULL;\n    pvalue = new char[100];\n```\n\nThis is saying\
    \ that we declare our pointer to be NULL, and that we have executed a new request\
    \ for memory to be allocated for our 100 characters. Once we do no longer need\
    \ this memory to be allocated, we insert a delete operator:\n\n```\n    delete\
    \ [] pvalue;\n```\n\nNow we have told our program to delete our array which we\
    \ have pointed to in the previous lines of code. But, what if we wanted to allocate\
    \ memory for multiple arrays at the same time? We do not need to start a new operator\
    \ for each one. Instead, we can write the following:\n\n```\n    double ** pvalue\
    \ = NULL;\n    pvalue = new double [4] [5];\n```\n\nHere, we first declare that\
    \ our pointer is valued as NULL, and then we tell our program that we want to\
    \ allocated memory for an array with the dimensions of 4x5. Deleting is the same\
    \ as before:\n\n```\n    delete [] pvalue;\n```"
