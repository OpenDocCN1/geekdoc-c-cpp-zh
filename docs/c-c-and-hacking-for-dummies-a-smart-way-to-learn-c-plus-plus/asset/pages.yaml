- pgno: 84
  md: 'Much more simple to understand when looking at what a constructor does when
    we see it in code. Basically, they create a class or an entry of information based
    on what we give it. It does the work for us to a degree. However, we also need
    to look at destructors and what they achieve within our program.


    A destructor is the opposite to a constructor in that they will remove instead
    of create data. The syntax used to execute a destructor is ~ followed by the name
    of your class. For example:


    ```

    ~~~cpp

    ~Player();

    ~~~

    ```


    And that is the basics of classes and objects within C++ programming. There are
    of course a lot more which we could look at, but that scope goes beyond the realm
    of the beginner level.'
