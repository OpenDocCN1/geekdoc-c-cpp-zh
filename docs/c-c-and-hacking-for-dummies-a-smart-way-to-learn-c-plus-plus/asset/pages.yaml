- pgno: 81
  md: "# # Chapter 9 – CLASSES AND OBJECTS\n\nNow that we have learnt the basics of\
    \ programming in C++, it is time to have a look at something slightly more advanced.\
    \ Classes are part of what we call “object orientated” programming. This allows\
    \ us to use programs in everyday life by using objects. Objects can be defined\
    \ as anything that we use in everyday life – such as cars, computers, mobile phones,\
    \ and so on. As we should have learnt by now, a program is made up of very small\
    \ programs within it, just the same as a car is made up of very small parts which\
    \ work together in order for the car to operate. Some of these components can\
    \ be changed, like turning the lights on and off in the car, whereas others cannot\
    \ be changed, such as the central computer of the car. These can be differentiated\
    \ by what we call “private” and “public” variables, or in other words, what you\
    \ are allowed to change, and what you are not (but we will look at that in a moment).\n\
    \nClasses exist on a slightly more advanced level when learning C++ because they\
    \ are more involved. Learning them however is a great reward, as it will allow\
    \ us to create and develop programs which we can apply for use in everyday life.\
    \ They also allow us to reuse code and apply it to different scenarios. For example,\
    \ every player in a football team with have a name, age and an income, but each\
    \ of these will be different for every player. In this case, the code would create\
    \ the attribute of class which is simply the name, age and income for each player.\n\
    \nTo write this as an example, our code for our player information would look\
    \ like this:\n\n```\n~~~cpp\nClass Player\n{\n    string name;\n    string age;\n\
    \    double income;\n};\n~~~\n```\n\nOur player Class now has structure. From\
    \ now on, every time that we declare a"
  merge: -1
  img_proc: true
- pgno: 82
  md: "value to each of the variables of the individual player, we will be creating\
    \ a new record, or a new object that exists within Class Player. Every object\
    \ will consist of a name, age and income. In order to declare the variables of\
    \ each Player type, we use the same method as we would declaring any other variable:\n\
    \n```\nPlayer player1;\nPlayer player2;\nPlayer player 3;\n```\n\nOnce we have\
    \ created a Class as seen in the first example, we can use it like any other example\
    \ of data type that we have previously used. However, we want to also be able\
    \ to limit what the program is able to access and manipulate within these class\
    \ structures. Some objects or classes must remain the same at all times (private\
    \ class), where some can be changed (public). For example, the class which contains\
    \ only name, age and income must remain private, as this is a constant. On the\
    \ other hand, the variables that we declare for each individual is public, because\
    \ that information is not constant.\n\nTo see this in code, we would write the\
    \ following:\n\n```\nClass Player\n{\nprivate:\n    string name;\n    string age;\n\
    \    double income;\n\npublic:\n    Player();\n};\n```\n\nExecuting the above\
    \ lines of code would prohibit the program from being able to make changes to\
    \ the private class of name, age and income, but would allow it to make changes\
    \ to the public class of individual player information. We use “:” after declaring\
    \ private and public, because they tell the program that everything afterwards\
    \ is considered that class type."
