  md: '# Data Clustering in C++: An Object-Oriented Approach


    | Class | Type | Description |

    | --- | --- | --- |

    | vector | Sequence | Rapid insertions and deletions at back. Direct access to
    any element. |

    | deque | Sequence | Rapid insertions and deletions at front or back. Direct access
    to any element. |

    | list | Sequence | Rapid insertion and deletion anywhere. |

    | set | Associative | Rapid lookup, no duplicates allowed. |

    | multiset | Associative | Rapid lookup, duplicates allowed. |

    | map | Associative | One-to-one mapping. No duplicates allowed. Rapid key-based
    lookup. |

    | multimap | Associative | One-to-many mapping. Duplicates allowed. Rapid key-based
    lookup. |

    | stack | Adapter | Last-in, first-out (LIFO). |

    | queue | Adapter | First-in, first-out (FIFO). |

    | priority_queue | Adapter | Highest-priority element is always the element out.
    |


    TABLE 5.1: STL containers


    STL provides three sequence containers: vector, list, and deque. Class vector
    is probably the most popular container and is used for applications that need
    frequent insertions and deletions only at back. Class deque is used for applications
    that require frequent insertions and deletions at both ends of a container. Class
    list is appropriate for applications that require frequent insertions and deletions
    in the middle and/or at the extremes of a container.


    The C++ program in Listing 5.1 illustrates how to use the three sequence containers.
    From the program we see that STL containers are very convenient. We do not need
