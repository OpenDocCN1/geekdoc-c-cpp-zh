    # The Unified Modeling Language


    The Unified Modeling Language (UML) is a standardized general-purpose modeling
    language used to specify, document, and visualize software systems. The UML includes
    a set of well-defined and expressive notations used to create visual models of
    software systems. This standard set of notation makes it possible for readers
    to be formulated and communicated unambiguously to others. Since the Object Management
    Group (OMG), an international non-profit consortium adopted the UML as a standard
    in 1997, the UML has been revised many times. In this chapter, we give a brief
    introduction to UML 2.0. For further details on UML 2.0, readers are referred
    to Booch et al. (2007). In what follows, UML means UML 2.


    There are two types of UML diagrams: structure diagrams and behavior diagrams
    (see Figure 2.1)(Figure2.1). The UML structure diagrams are used to show the static
    structure of elements in a software system. The UML structure diagrams include
    the following six types of diagrams: package diagram, class diagram, component
    diagram, deployment diagram, object diagram, and composite structure diagram.
    The UML behavior diagrams are used to describe the dynamic behavior of a software
    system. The UML behavior diagrams include the following seven types of diagrams:
    use case diagram, activity diagram, state machine diagram, sequence diagram, communication
    diagram, and interaction overview diagram, the last four of which are also called
    interaction diagrams.


    In this chapter, we introduce several types of UML diagrams.


