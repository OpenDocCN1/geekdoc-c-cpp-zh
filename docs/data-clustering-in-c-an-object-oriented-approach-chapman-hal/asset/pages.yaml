  md: '# Chapter 13


    # DIANA


    Hierarchical clustering algorithms can be agglomerative or divisive. In the previous
    chapter, we implemented several agglomerative hierarchical clustering algorithms.
    In this chapter, we implement a divisive hierarchical clustering algorithm, DIANA,
    which was described in Kaufman and Rousseeuw (1990), Chapter 6.


    # 13.1 Description of the Algorithm


    DIANA (DIVisive is a divisive hierarchical clustering algorithm based on the idea
    of Macnaughton-Smith et al. (1964). Given a dataset consisting of $n$ records,
    there are $2^{n-1}$ ways to divide the dataset into nonempty groups. The DIANA
    algorithm does not consider all divisions.


    Specifically, let $X=\{\mathbf{x}_0, \mathbf{x}_1, \dots, \mathbf{x}_n\}$ be a
    dataset with $n$ records. At the beginning, all $n$ records are in one cluster.
    In the first step, the algorithm divides the dataset into two groups using an
    iterative process. To do this, the algorithm first finds the record that has the
    greatest average distance to the rest of the records. The average distance between
    record $\mathbf{x}_i$ to the rest of the records is calculated as


    ```

    $D_i = \frac{1}{n-1} \sum_{j=0, j\neq i} D(\mathbf{x}_i, \mathbf{x}_j),

    ```


    where $D(\cdot,\cdot)$ is a distance measure.

    Suppose $D_0 = \max_{0\leq i\leq n-1} D_i$; i.e., $\mathbf{x}_0$ is split from
    the dataset. We have two groups: $G_1=\{\mathbf{x}_0\}$ and $G_2=X\setminus G_1=\{\mathbf{x}_1,
    \mathbf{x}_2, \dots, \mathbf{x}_{n-1}\}$. Then the algorithm checks every record
    in $G_2$ to see if the record should be moved to $G_1$. To do this, the algorithm
    calculates the distance between $\mathbf{x}$ and $G_2 \setminus \{\mathbf{x}\}$
    for all $\mathbf{x} \in G_2$. The distance between $\mathbf{x}$ and $G_1$ is calculated
    as


    ```

    $D_{G_1}(\mathbf{x}) = \frac{1}{|G_1|} \sum_{y\in G_1} D(\mathbf{y}, \mathbf{x}),
    \quad \mathbf{x} \in G_2 \quad (13.1)$

    ```


    where $|G_1|$ denotes the number of records in $G_1$. The distance between x and'
  merge: -1
  pgno: 230
- img_proc: true
  md: '# 218 Data Clustering in C++: An Object-Oriented Approach


    $G_2 \setminus \{x\}$ is calculated as


    ```

    $D_{G_2}(\mathbf{x}) = \frac{1}{|G_2|} \sum_{y \in G_2} D(\mathbf{x}, \mathbf{y}),
    \quad \mathbf{x} \in G_2. \quad (13.2)$

    ```


    If $D_{G_1}(\mathbf{x}) < D_{G_2}(\mathbf{x})$, then $\mathbf{x}$ is moved from
    $G_2$ to $G_1$. The algorithm continues checking all other records in $G_2$ until
    no records are moved. At this stage, the dataset is divided into two clusters:
    $G_1$ and $G_2$.


    In the second step, the algorithm first finds the cluster that has the largest
    diameter. The diameter of a cluster is defined as the maximum distance between
    two records in the cluster. That is,


    ```

    $Diam(G) = \max_{x,y \in G} D(x, y). \quad (13.3)$

    ```


    If $Diam(G_1) > Diam(G_2)$, the algorithm applies the process described in the
    first step to divide cluster $G_1$ into two clusters: $G_3$ and $G_4$.


    The algorithm repeats the above procedure until every cluster contains only one
    record. The algorithm can finish the process in $n-1$ steps.


    # 13.2 Implementation


    To implement the divisive hierarchical clustering algorithm, we need to assign
    a unique identifier to each cluster in the hierarchical clustering tree and a
    level to these clusters. To do this, we follow the same approach as implement
    the agglomerative hierarchical clustering algorithms. That is, given a dataset
    $X = \{x_0, x_1, \dots, x_{n-1}\}$, the initial cluster that contains all records
    has index of $2n-2$. We denote the first cluster by $X_{2n-2}$.


    At the first step, $X_{2n-2}$ is divided into two clusters. If both clusters have
    more than one record, the two clusters are denoted as $X_{2n-3}$ and $X_{2n-4}$.
    If one of the clusters has only one record, then we denote the one-record cluster
    by $X_i$ if the cluster contains $x$. If the other cluster has more than one record,
    then we denote the cluster $X_{2n-3}$. At the end, the clustering tree includes
    clusters $X_{2n-2}, X_{2n-3}, \dots, X_1$, and $X_0$. The clusters $X_0, X_1,
    \dots, X_{n-1}$ are one-record clusters. All other clusters contain more than
    record.


    The DIANA algorithm is implemented as a class `Diana`, whose declaration is shown
    in Listing 13.1. Class `Diana` contains several data members. Data member `cm`
    is used to store the pair-wise distances of records in a dataset. Class `mapA`
    is a double-map class described in Section 11.2.


    Data member `unsplitClusters` is used to store the identifiers of unsplit clusters,
    i.e., clusters containing more than one record. At the beginning, this data member
    contains one element, $2-2$, which is the identifier of the cluster that contains
    all the records in the dataset.'
