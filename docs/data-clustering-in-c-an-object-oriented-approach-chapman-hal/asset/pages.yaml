    Chapter 20. A Parallel k-means Algorithm. This chapter introduces a simple parallel
    version of the k-means algorithm based on the message passing interface and Boost
    MPI library.


    Chapters 2-5 introduce programming related materials. Readers who are already
    familiar with object-oriented programming in C++ can skip those chapters. Chapters
    6-11 introduce the base clustering classes and some utilities. Chapter 12 includes
    several agglomerative hierarchical clustering algorithms. Each of the last eight
    chapters is devoted to one particular set of clustering algorithms as divisive
    clustering, center-based clustering, fuzzy clustering, mixed-type data clustering,
    search-based clustering, subspace clustering, mode-based clustering, and parallel
    data clustering.


    A key learning to a clustering algorithm is to implement and experiment the clustering
    algorithm. I encourage readers to compile and experiment the examples included
    in this book. After getting familiar with the classes and their usage, readers
    can implement new clustering algorithms using these classes or even improve the
    designs and implementations presented in this book. To this end, I included some
    exercises and projects in the appendix of this book.


    This book grew out of my wish to help undergraduate and graduate students who
    study data clustering to learn how to do it in a better way. When I was a PhD
    student, there were no books or papers to teach me how to implement clustering
    algorithms. It took me a long time to implement my first clustering algorithm.
    The clustering programs I wrote at that time were just C programs written in C++.
    It has taken me years to learn how to use the powerful C++ language in the right
    way. With the help of this book, readers should be able to learn to implement
    clustering algorithms and how to do it in a better way in a short period of time.


