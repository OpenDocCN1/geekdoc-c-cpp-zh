    # Chapter 1. Introduction to Data Clustering. In this chapter, we review some
    basic concepts of data clustering. The clustering process, data types, similarity
    and dissimilarity measures, hierarchical and partitioning algorithms, cluster
    validity, and applications of data clustering are briefly introduced. In addition,
    a list of survey papers and books related to data clustering are presented.


    # Chapter 2. The Unified Modeling Language. The Unified Modeling Language (UML)
    is a general-purpose modeling language that includes a set of standardized graphic
    notation to create visual models of software systems. In this chapter, we introduce
    several UML diagrams such as class diagrams, use-case diagrams, and activity diagrams.
    Illustrations of these UML diagrams are presented.


    # Chapter 3. Object-Oriented Programming and C++. Object-oriented programming
    is a programming paradigm that is based on the concept of objects, which are reusable
    components. Object-oriented programming has three pillars: encapsulation, inheritance,
    and polymorphism. In this chapter, these pillars are introduced and illustrated
    with simple programs in C++. The exception handling ability of C++ is also discussed
    in this chapter.


    # Chapter 4. Design Patterns. Patterns are reusable components. In fact, a design
    pattern is a general reusable solution to a problem that occurs over and over
    in software design. In this chapter, several design patterns are described and
    illustrated by simple C++ programs.


    # Chapter 5. C++ Libraries and Tools. As an object-oriented programming language,
    C++ has many well-designed and useful libraries. In this chapter, the standard
    template library (STL) and several Boost C++ libraries are introduced and illustrated
    by C++ programs. The GNU build system (i.e., GNU Autotools) and the Cygwin system,
    which simulates a Unix-like platform under Microsoft Windows, are also introduced.


    # Chapter 6. The Clustering Library. This chapter introduces the file system of
    the clustering library, which is a collection of reusable classes to develop clustering
    algorithms. The structure of the library and file name convention are introduced.
    In addition, the GNU configuration files, the error handling class, unit testing,
    and compilation of the clustering library are described.


    # Chapter 7. Datasets. This chapter introduces the design and implementation of
    datasets. In this book, we assume that a dataset consists of a set of records
    and a record is a vector of values. The attribute value class, the attribute information
    class, the schema class, the record class, and the dataset class are introduced
    in this chapter. These classes are illustrated by an example in C++.


    # Chapter 8. Clusters. A cluster is a collection of records. In this chapter,
    the cluster and its child classes such as the center cluster class and the subspace
    cluster class are introduced. In addition, partitioning clustering and hierarchical
    clustering class are also introduced.'
