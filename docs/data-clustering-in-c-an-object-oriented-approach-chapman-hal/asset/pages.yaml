  md: '# The c-means Algorithm


    The program is compiled as part of the clustering library. The Makefile.am file
    for this program can be found in Listing B.113.


    The c-means algorithm initializes the cluster centers by randomly selecting k
    distinct records from the dataset. In order to alleviate the impact of the initial
    cluster centers on the clustering results, we run the c-means algorithm multiple
    times. The code in Listing 15.7 shows how we runs the c-means algorithm multiple
    times.


    The program calculates the average number of iterations and the average error
    (i.e., the objective function value) over multiple runs. The run that has the
    lowest error is also saved. The seed provided by users is used only if the number
    of runs is one.


    # Listing 15.7: Code to run the c-means algorithm multiple times.


    ```

    boost: timer t;

    t. restart();


    Results Res;

    Real avgiter = 0.0;

    Real avgerror = 0.0;

    Real dMin = MAX_REAL;

    Real error;

    For(Size i=1; i<=numrun; i++) {

    Cmean ca;

    Arguments &Arg = ca.getArguments();

    Arg.ds = ds;

    Arg.insert("alpha", alpha);

    Arg.insert("epsilon", epsilon);

    Arg.insert("threshold", threshold);

    Arg.insert("numcluster", numcluster);

    Arg.insert("maxiter", maxiter);

    Arg.insert("seed", seed);

    if (numrun == 1) {

    Arg.additional("seed") = seed;

    } else {

    Arg.additional("seed") = i;

    }

    ca.cluster();

    }


    const Results &tmp = ca.getResults();

    avgiter += any_cast<Size>(tmp.get("numiter"));

    avgerror = any_cast<Real>(tmp.get("dObj"));

    if (error < dMin) {

    dMin = error;

    Res = tmp;

    }

    avgiter /= numrun;

    avgerror /= numrun;


    double seconds = t.elapsed();

    ```


    Note that a new instance of the c-means algorithm is created for each run (line
    10). In fact, it is necessary to create a new instance for each run in order to
    prevent the previous run''s affecting the current run. In Exercise A.10, readers
    are asked to override the reset in class Cmean so that a reset object is the same
    as a new object.'
