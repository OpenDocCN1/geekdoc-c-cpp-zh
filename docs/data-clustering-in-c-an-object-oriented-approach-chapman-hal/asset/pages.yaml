    iteration is set to 1 before the iterative process begins (line 5)


    In the iterative process (lines 6-34), the function checks for every record to
    see if it should be moved to another cluster. If a record is close to another
    cluster, its cluster membership will be changed accordingly and it will be moved
    from its current cluster to another cluster (lines 22-23). All records are checked,
    the function calls the method updateCenter to update the cluster centers based
    on the updated cluster memberships. Afterward, the function checks for the number
    of iterations to see if it reaches the maximum number of iterations (lines 31-33).
    If the maximum number of iterations is reached, the iterative process stops.


