    # 6.2.1 configure.ac


    The file configure.ac (see Listing B.1) is the configuration file for the clustering
    library ClusLib. This file contains Autoconf macros that test the system features
    the clustering library needs. One can use the autoscan to create a configure.ac
    file.


    The macros AC_INIT and AC_OUTPUT are the two macros required by the configuration
    script. The macro AC_INIT in the first line takes three arguments: the name of
    the package, the version of the package, and the bug report address. The macro
    AC_OUTPUT in the last line takes no arguments and generates the makefiles in the
    argument of the macro AC_CONFIG_FILES that are required for building the package.
    Note that AC_OUTPUT also creates files in the argument of the macro AC_CONFIG_HEADERS.


    The macro AC_CONFIG_SRCDIR takes one argument that is a file in the source directory
    and checks for the existence of the file to make sure that source directory does
    contain the file. This macro does a safety check to make sure people specify the
    right directory with AC_CONFIG_SRCDIR.


    The macro AC_CONFIG_AUX_DIR takes one argument that is a directory and tells configuration
    to use auxiliary build tools (e.g., install-sh, config.guess, etc.) in the directory.


    The macro AC_CONFIG_HEADERS takes one argument that is a header file and makes
    AC_OUTPUT create the file, which contains C preprocessor #define statements.


    The macro AC_CONFIG_MACRO_DIR specifies the location of additional local Autoconf
    macros. If this macro is used, we need to set ACLOC_AMFLAGS=-I in the top-level
    Makefile.am, where dir is the location specified in the macro AC_CONFIG_MACRO_DIR.


    The macro AM_INIT_AUTOMAKE has two forms: one takes only one argument and the
    other form takes two or more arguments.'
