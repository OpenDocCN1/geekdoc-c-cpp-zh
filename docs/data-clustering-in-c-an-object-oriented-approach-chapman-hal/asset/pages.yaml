    \ In Exercise A.2, readers are asked to improve this.\n\n# 9.5 Mixed Distance\n\
    \nMixed distance is a distance measure used for mixed-type records, which contain\
    \ both numeric attributes and categorical attributes. Separate distance measures\
    \ for mixed-type data have been proposed and used for cluster analysis (Gan et\
    \ al., 2007). For example, the general similarity coefficient (Gower, 1971; Wishart,\
    \ 2002), the general distance coefficient (Gower, 1971), and the generalized Minkowski\
    \ distance (Ichino, 1988; Ichino and Yaguchi, 1994) are measures for mixed-type\
    \ data.\n\nHere we implement a mixed distance that combines the squared Euclidean\
    \ distance and the simple matching distance. Before we present the actual implementation\
    \ of the distance, let us define the first distance. Let **x** and **y** be mixed-type\
    \ records described by *d* attributes. Without loss of generality, we assume that\
    \ the first *m* ($1 < m < d$) attributes are numeric and the rest categorical.\
    \ The mixed distance is defined as (Huang, 1998):\n\n> $D_{mix}(\\mathbf{x},\\\
    mathbf{y}) = \\sum_{j=1}^{m} (x_j - y_j)^2 + \\beta \\sum_{j=m+1}^{d} \\delta(x_j,\
    \ y_j), \\quad (9.4)$\n\nwhere $\beta$ is a balance weight used to avoid favoring\
    \ either type of attribute and $\\delta(\\cdot,\\cdot)$ is defined in Equation\
    \ (9.3).\n\nThe declaration of the mixed distance class MixedDistance is shown\
    \ in Listing 9.8. The class has a protected data member **_beta**, which holds\
    \ the balance weight, and two constructors. When the constructor is called without\
    \ argument, the data member **_beta** is set to 1.0 (see Listing 9.74). The constructor\
    \ is called with an argument, **_beta** is set to the value of the argument."
