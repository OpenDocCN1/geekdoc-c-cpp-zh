    **Exercise A.10.** The **reset** method of member `_results` in Algorithm (see
    Listing B.11) only resets the contents of member. *Override* the reset method
    in derived classes (e.g., class *Kmean*, class *Cmean*, etc.) so that the **reset**
    method will also reset the clustering results in objects of these derived class.
    That is, calling the **reset** method will revert an object to its initial state.


    **Exercise A.11.** The genetic *k*-modes algorithm implemented in Section 17.2
    runs through all the generations no matter whether the algorithm converges or
    not. By converge, we mean that the populations between two generations do not
    change. Modify the function *iteration* so that the function will stop when the
    algorithm converges.


    **Exercise A.12.** Vanjak and Mornar (2001) proposed a general object-oriented
    framework for iterative optimization algorithms. The framework includes program
    code to output progress information and program code used to terminate the iterative
    process. In addition, the framework allows one to separate the implementation
    of the algorithm from program code used to output progress information and program
    code used to terminate the program execution. Many data clustering algorithms
    (e.g., the *k*-means algorithm) are formulated as iterative optimization algorithms.
    Implement the *k*-means algorithm using the framework.'
