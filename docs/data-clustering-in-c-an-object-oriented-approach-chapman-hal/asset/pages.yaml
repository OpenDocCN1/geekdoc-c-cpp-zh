    \ and random access. An input iterator is used to read an element from a container\
    \ and can move in the forward direction one element at a time. An output iterator\
    \ is used to write an element to a container. Like an input iterator, an output\
    \ iterator can move only in the forward direction one element at a time. A forward\
    \ iterator combines the capabilities of input and output iterators. A bidirectional\
    \ iterator combines the capabilities of a forward iterator with the ability to\
    \ move in the backward direction. A random access iterator has the capabilities\
    \ of a bidirectional iterator and the ability to directly access any element of\
