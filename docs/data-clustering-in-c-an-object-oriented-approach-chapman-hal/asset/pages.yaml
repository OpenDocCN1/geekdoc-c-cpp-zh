    the child class or subclass and the pre-existing class is called the base class,
    parent class, or superclass.


    Inheritance not only allows the child class to inherit the public interface and
    the implementation of the parent class, but also allows the child class to redefine
    any methods of the parent class that it does not like over overriding, which is
    the process of a child class rewriting a method that appears in the parent class
    in order to change the method''s behavior. The beautiful thing about overriding
    is it allows one to change the way an object works without touching the definition
    of the parent class.


    C++ supports single inheritance as well as multiple inheritance. In single inheritance,
    a child class inherits from only one base class. In multiple inheritance, a child
    class inherits from multiple base classes. In what follows, we will illustrate
    the concept of inheritance in C++ using the Distance class and the EuclideanDistance
    class.'
