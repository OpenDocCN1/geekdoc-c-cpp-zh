  md: '# 4.4 Strategy


    The strategy pattern is a behavioral pattern that is used to encapsulate a group
    of algorithms inside classes to make these algorithms interchangeable so that
    the algorithm can vary independently from the clients that use it. For example,
    there are different strategies to cluster a dataset. The solution of the strategy
    pattern is to declare a common abstract base class for all strategies and let
    derived classes implement concrete strategies. Table 4.5 shows the four components
    of the strategy pattern.


    | Element Description |

    | Pattern Name | Strategy |

    | Problem | Need a group of algorithmic classes that have no correlation and are
    not easily exchanged to be interchangeable |

    | Solution | Design an abstract base class as an interface and let derived classes
    implement the details |

    | Consequences | Eliminate conditional statements Increased number of objects
    |


    TABLE 4.5: The strategy pattern.


    The class diagram in Figure 4.4 shows the basic structure of the strategy pattern.
    In the strategy pattern, we declare an interface common to all supported strategies.
    The concrete strategies classes are derived from the abstract base strategy class
    and implement the strategy interface. The context class maintains a pointer pointing
    to strategy and an interface that lets a strategy access its data.


    ![](img/42581d0418a3878bb54bd52fb20c73c2_87_0.png)


    FIGURE 4.4: The strategy pattern.'
