    # 20.2 Description of the Algorithm


    Parallel data clustering is a process of using parallel processing to cluster
    data in order to reduce the execution time of the clustering algorithm. In this
    section, we describe a simple parallel k-means algorithm.


    In Section 14.1, we introduced a sequential k-means algorithm. The sequential
    k-means algorithm calculates the distances between all records and all centers.
    A straightforward way to parallelize the k-means algorithm is to let each participating
    process handle n/p records, where p is the total number of processes and n is
    the number of records contained in the data set (Judd et al., 1998; Othman et
    al., 2005).


    The major steps of the parallel k-means algorithm are given below:


    +   (a) Master process: Read data from a data file and send blocks of data to
    client processes;


    +   (b) Master process: Initialize cluster centers and broadcast those centers
    to client processes;'
  merge: -1
  pgno: 320
- img_proc: true
  md: '# A Parallel k-means Algorithm


    +   (c) All process: Calculate the distances between each record of its data block
    and cluster centers, and assign the record to the nearest cluster;


    +   (d) All process: Update the new cluster centers;


    +   (e) All process: Repeat Step (c) and Step (d) until some condition is met;


    +   (f) Master process: Collect cluster results and output clustering summary.


    In the parallel k-means algorithm, each process is responsible for handling a
    data block. The parallel k-means algorithm spends some time on I/O operations,
    by broadcasting data blocks from the master process to client processes. As a
    result, clustering a small data set with the parallel k-means algorithm on multiple
    CPUs or cores may take more time than clustering the small data set with the parallel
    k-means algorithm on a single CPU or core. This is the case when the time reduction
    due to parallel distance calculations does not offset the overhead due to I/O
    operations.


    # 20.3 Implementation


    In this section, we introduce the implementation of the simple parallel k-means
    algorithm described in the previous section. To implement the parallel k-means
    algorithm, we just modify the sequential k-means algorithm implemented in Section
    14.2. In what follows, we take a look at functions of the parallel k-means program.


    The parallel k-means algorithm is implemented as a class, whose declaration is
    shown in Listing 20.2. Class MPIKmean is very similar to class Kmean given in
    Listing 14.1. In class MPIKmean, we remove updateCenter and distance from class
    Kmean and add _centers, _data, _numAttr, and _world. A member function dist is
    also added to calculate the Euclidean distance.


    Member _centers is a vector that contains all the clusters. The first _numAttr
    elements are the coordinates of the first cluster. The second _numAttr elements
    are the coordinates of the second cluster centers, and so on. We encode all cluster
    centers into a vector so that we can transmit the cluster centers from one to
    another easily. Similarly, member _data is a vector that contains the data block
    assigned to a process. Member _numObj is the number of records contained in _data.
    Member _numAttr is the number of attributes of the data set. Member _world is
    an object of boost::mpi::communicator.'
