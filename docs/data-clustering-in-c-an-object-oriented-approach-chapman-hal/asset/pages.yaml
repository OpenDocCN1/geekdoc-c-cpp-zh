  md: '# # Chapter 12


    # ## Agglomerative Hierarchical Algorithms


    A hierarchical clustering algorithm is a clustering algorithm that divides a dataset
    into a sequence of nested partitions. Hierarchical clustering algorithms can be
    classified into two categories: agglomerative hierarchical algorithms and divisive
    hierarchical algorithms (Gan et al., 2007).


    An agglomerative hierarchical algorithm starts with every single record in a single
    cluster and repeats merging the closest pair of clusters according to some similarity
    or dissimilarity measure until all records are in one cluster. In contrast to
    an agglomerative hierarchical algorithm, a divisive hierarchical algorithm starts
    with all records in one cluster and repeats splitting a cluster into two smaller
    ones until all clusters contain only a single record.


    In this chapter, we introduce the implementation of several agglomerative hierarchical
    algorithms. In particular, we focus on agglomerative hierarchical algorithms that
    use the Lance-Williams recurrence formula (Lance and Williams, 1967a,b).


    # ### 12.1 Description of the Algorithm


    Let $\{x_0, x_1, \dots, x_{n-1}\}$ be a dataset with $n$ records. An agglomerative
    hierarchical algorithm starts with every single record as a cluster. Let $C_i
    = \{x_i\}, i=0, 2, \dots, n-1$ be the clusters at the beginning. Cluster $C_i(0
    \le i \le n-1)$ contains the record $x_i$. At each step, two clusters that have
    the minimum distance are merged to form a new cluster. An agglomerative hierarchical
    algorithm continues merging clusters until only one is left.


    For convenience, we assume that at step 1, a new cluster $C_n$ is formed by merging
    two clusters in the initial set of clusters $\mathcal{F}_0 = \{C_0, C_1, \dots,
    C_{n-1}\}$. Then after step 1 and before step 2, we have a set of clusters $\mathcal{F}_1
    = \mathcal{F}_0 \cup \{C_n\}$, if $C_0$ and $C_1$ have the minimum distance among
    all pairs of clusters, for example, $C_n = C_0 \cup C_1$ and $\mathcal{F}_0 =
    \{C_2, C_3, \dots, C_{n-1}\} = \mathcal{F}_0 \setminus \{C_0, C_1\}$.


    At step 2, a new cluster $C_{n+1}$ is formed by merging two clusters in the set
    of clusters $\mathcal{F}_1$. Similarly, let $\mathcal{F}_1$ be the set of unmerged
    clusters in $\mathcal{F}_1$.'
