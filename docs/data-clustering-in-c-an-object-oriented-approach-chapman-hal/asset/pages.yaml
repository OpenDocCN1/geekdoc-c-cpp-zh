  md: "# # Chapter 15\n\n# ## The c-means Algorithm\n\nThe c-means algorithm is also\
    \ referred to as the fuzzy c-means (FCM) algorithm, which was developed by Dunn\
    \ (1974a) and improved by Bezdek (1981b). Since the c-means algorithm is a fuzzy\
    \ clustering algorithm, it allows one record to belong to two or more clusters\
    \ with some weights. The c-means algorithm is very similar to the k-means algorithm\
    \ in other aspects. In this chapter, we implement the c-means algorithm and illustrate\
    \ it with some examples.\n\n# ### 15.1 Description of the Algorithm\n\nLet $X=\\\
    {\\mathbf{x}_0, \\mathbf{x}_1, \\dots, \\mathbf{x}_{n-1}\\}$ be a dataset containing\
    \ $n$ records, each of which is described by $d$ numeric attributes. Let $U$ be\
    \ an $n \times k$ fuzzy partition matrix that satisfies the following conditions:\n\
    \n$$0 \\le u_{ij} \\le 1, \\quad 0 \\le j \\le k-1, \\quad 1 \\le i \\le n-1,$$\
    \ \\quad (15.1a)$\n\n$$\\sum_{j=1}^k u_{ij} = 1, \\quad 0 \\le i \\le n-1,\\ \\\
    quad (15.1b)$\n\n$$\\sum_{i=1}^n u_{ij} > 0, \\quad 0 \\le j \\le k-1,\\ \\quad\
    \ (15.1c)$\n\nWhere $u_{ij}$ is the $(i, j)$ entry of the matrix $U$.\n\nGiven\
    \ the dataset $X$, the c-means algorithm finds a fuzzy partition of $X$ by minimizing\
    \ the following objective function:\n\n$$J_{\\alpha} = \\sum_{j=0}^{k-1} \\sum_{i=0}^{n-1}\
    \ u_{ij}^{\\alpha} D_{uc}(\\mathbf{x}_i, \\mu_j)^2,\\ \\quad (15.2)$\n\nWhere\
    \ $\\alpha \\in (1, \\infty)$ is a weighting exponent, $\\mu_j$ is the center\
    \ of cluster $j$, and $D_{uc}(\\cdot, \\cdot)$ is the Euclidean distance.\n\n\
    To minimize the objective function, the c-means algorithm employs an iterative\
    \ process. That is, the c-means algorithm updating the fuzzy"
  merge: -1
  pgno: 253
- img_proc: true
  md: '# Data Clustering in C++: An Object-Oriented Approach


    cluster memberships given the cluster centers and updating the cluster centers
    given the fuzzy memberships until some stop condition is met. At the beginning,
    the c-means algorithm selected $k$ distinct records from the dataset as initial
    cluster centers. Suppose $\mu_0^{(0)}, \mu_1^{(0)}, \dots, \mu_{k-1}^{(0)}$ are
    the initial cluster centers. Then the c-means algorithm updates the cluster memberships
    according to the following formula:


    ```

    $u_{ij}^{(1)} = \sum_{i=0}^{k-1} \left( \frac{D_{euc}(\mathbf{x}_i, \mu_j^{(0)})}{D_{euc}(\mathbf{x}_i,
    \mu_i^{(0)})} \right)^{\alpha-1}$  (15.3)

    ```


    for $j = 0, 1, \dots, k-1$ and $i = 0, 1, \dots, n-1$. The fuzzy cluster memberships
    allows to update the cluster centers according to the following formula:


    ```

    $\mu_j^{(1)} = \sum_{i=0}^{n-1} (u_{ij}^{(0)})^{\alpha} \mathbf{x}_i$  (15.4)

    ```


    for $j = 0, 1, \dots, k-1$. The c-means algorithm repeats the above steps until
    the change of the objective function between iterations is within the tolerance
    or the maximum number of iterations is reached.


    Once a fuzzy partitioning $U$ is obtained, the c-means algorithm produces a hard
    partition based on the fuzzy partition. Precisely, let $\gamma_0, \gamma_1, \dots,
    \gamma_{n-1}$ be the hard partition. That is, $\gamma_i$ is the index of the cluster
    to which record $\mathbf{x}_i$ belongs. Then the hard partition can be determined
    as follows:


    ```

    $\gamma_i = \argmax u_{ij}, \quad i = 0, 1, \dots, n-1.$  (15.5)

    ```


    # 15.2 Implementaion


    It is straightforward to implement the $c$-means algorithm. Listing 15.1 shows
    the declaration of class Cmean, which implements the $c$-means algorithm. Class
    Cmean inherits from the base algorithm class Algorithm. In addition to the members
    inherited from the base class, class Cmean has several other data members and
    member functions.


    Data member _clusters is a vector of shared pointers to objects of class CenterCluster.
    Since the c-means algorithm produces clusters with only one center, we use CenterCluster
    to represent these clusters. The fuzzy cluster memberships are not stored in objects
    of CenterCluster. Instead, the fuzzy cluster memberships are stored in data member
    _FCM, which is an object of uBLAS matrix.'
