    # 1.2 Data Types


    Most clustering algorithms are associated with data types. It is important to
    understand different types of data in order to perform cluster analysis. By data
    type we mean hereby the type of a single attribute.


    In terms of how the values are obtained, an attribute can be typed as discrete
    or continuous. The values of a discrete attribute are usually obtained by some
    sort of counting; while the values of a continuous attribute are obtained by some
    sort of measuring. For example, the number of cars is discrete and the weight
    of a person is continuous. There is a gap between two different discrete values
    and there is always a value between two continuous values.


    In terms of measurement scales, an attribute can be typed as ratio, interval,
    ordinal, or nominal. Nominal data are discrete data without a natural ordering.
    For example, name of a person is nominal. Ordinal data are discrete data that
    have a natural ordering. For example, the order of persons in a line is ordinal.
    Interval data are continuous data that have a specific order and equal intervals.
    For example, temperature is interval data. Ratio data are continuous data that
    are interval data and have a natural zero. For example,'
