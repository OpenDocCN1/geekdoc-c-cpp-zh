  md: "# Data Clustering in C++: An Object-Oriented Approach\n\nHowever, implementing\
    \ the Mahalanobis distance is not straightforward in C++ since the distance involves\
    \ the inverse of the covariance matrix. Computing the distance of Σ directly is\
    \ computationally expensive. Since Σ is a covariance matrix, it is at least semi-positive\
    \ definite. If all the diagonal elements of Σ are positive, then Σ is positive\
    \ definite. Hence we can calculate the Cholesky decomposition (Press et al., 1992)\
    \ of Σ first and calculate the inverse of the Cholesky decomposition of Σ which\
    \ is a triangular matrix.\n\nLet L be the Cholesky decomposition of Σ. That is,\
    \ L is a lower triangular matrix such that\n\nΣ = LL^T.\n\nThere is an efficient\
    \ algorithm to calculate L (Press et al., 1992). Listing B.103 and Listing B.104\
    \ show the implementation of Cholesky decomposition and the inverse of a triangular\
    \ matrix. For these calculations, we use uBLAS, which is a C++ template class\
    \ library that provides BLAS (Basic Linear Algebra Subprograms) functionality\
    \ for matrices.\n\nLet A be the inverse of L. Then A is also a lower triangular\
    \ matrix. The inverse of Σ can be calculated as\n\nΣ⁻¹ = (LL⁻¹)ᵀL⁻¹ = A^T A.\n\
    \nThen the Mahalanobis distance is shown in Equation (9.5) which can be formulated\
    \ as\n\n> D_mah(x, y) = √[A(x-y)ᵀA(x-y)]. (9.9)\n\nThe declaration of class MahalanobisDistance\
    \ is shown in Listing 9.10, from which we see the class has a protected data member\
    \ and a constructor with an argument. Classes symmetric_matrix (line 4) and triangular_matrix\
    \ (line 9) are defined in the Boost uBLAS library. The namespace numeric::ublas\
    \ (see matrix.hpp in Listing-B.103).\n\nThe data member A is the inverse of the\
    \ Cholesky decomposition of the matrix sigma in the constructor (see Listing B.103).\
    \ We calculate the Cholesky decomposition and its inverse only when the distance\
    \ object is constructed.\n\nListing 9.10: Declaration of class MahalanobisDistance.\n\
    \n```\nclass MahalanobisDistance : public Distance {\npublic:\n    MahalanobisDistance(const\n\
    \        ublas::symmetric_matrix<Real>& sigma);\n    Real operator()(const boost::shared_ptr<Record>&\
    \ x,\n        const boost::shared_ptr<Record>& y) const;\nprotected:\n    ublas::triangular_matrix<Real>\
    \ _A;\n};\n```\n\nListing 9.11 shows the calculation of the Mahalanobis distance\
    \ between two records. The function first checks whether the schema of the two\
    \ records"
