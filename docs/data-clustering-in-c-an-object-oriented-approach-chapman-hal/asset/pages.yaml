- img_proc: true
  md: "# The Genetic k-modes Algorithm 267\n\n$P_m$. That is, for each component of\
    \ each selected chromosome, the mutation operator is applied if a randomly generated\
    \ standard uniform number is less than $P_m$.\n\nOnce a selected chromosome is\
    \ mutated, the $k$-modes operator is applied to it. Let $\\Gamma$ be a chromosome.\
    \ The $k$-modes operator changes $\\Gamma$ into another chromosome $\\Gamma'$\
    \ based on the following two steps:\n\n**Updating clusters centers** Given the\
    \ cluster memberships $\\Gamma$, the cluster center $\\mu_j$ of cluster $C_j$\
    \ is updated to the cluster (see Section 16.1). $\\mu_j$ ($j=0, 1, \\dots, k-1$)\
    \ is the updated cluster centers.\n\n**Updating cluster members** Given the clusters\
    \ $\\mu_j$, the cluster memberships are updated as follows. The $i$-th component\
    \ $\\gamma_i$ of $\\Gamma$ is updated to\n\n$$\\hat{\\gamma}_i = \\text{argmin}_{0\
    \ \\le j \\le k-1} D_{sim}(\\mathbf{x}_i, \\mathbf{\\mu}_j), \\quad i=0, 1, \\\
    dots, n-1$.$\n\nIf a cluster is empty, the distance of a record between the cluster\
    \ is defined to be $\\infty$. Hence illegal chromosomes remain illegal after the\
    \ application of the $k$-modes operator.\n\n# 17.2 Implementation\n\nThe genetic\
    \ $k$-modes algorithm is implemented as a class called GKmode, whose declaration\
    \ is shown in Listing 17.1. Class GKmode has four mutable data members, which\
    \ can be changed by **const** member functions such as **iteration**. Data member\
    \ _clusters_ is a vector of shared pointers pointing to objects of class CenterCluster.\
    \ Data member _mp_ is a matrix, each row of which represents a chromosome (i.e.,\
    \ a vector of cluster memberships). Data member _dvFit_ is a vector of fitness\
