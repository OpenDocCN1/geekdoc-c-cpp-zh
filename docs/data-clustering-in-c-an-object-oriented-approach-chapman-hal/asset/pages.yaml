  md: "# Chapter 10\n\n# Clustering Algorithms\n\nA clustering algorithm is an algorithm\
    \ that assigns data points or records into\ngroups in a certain way. Over the\
    \ past 50 years, many clustering algorithms\nhave been developed and applied to\
    \ various areas such as gene expression\ndata analysis (Yeung et al., 2003) and\
    \ psychology (Clatworthy et al., 2005).\nAlthough there are many different kinds\
    \ of clustering algorithms, they have\nat least three commonalities. First, all\
    \ clustering algorithms require some\narguments or parameters. Second, all clustering\
    \ algorithms produce clustering\nresults. Third, all clustering algorithms perform\
    \ data clustering.\n\nIn this chapter, we introduce the design and implementation\
    \ of the base\nclass for all clustering algorithms based on the aforementioned\
    \ three common-\nalities.\n\n# 10.1 Arguments\n\nAlmost all clustering algorithms\
    \ require some arguments in order to per-\n data clustering. In addition, different\
    \ clustering algorithms might require\ndifferent types of arguments. For example,\
    \ the $k$-means algorithm (Macqueen,\n1967; Jain and Dubes, 1988) requires the\
    \ number of clusters. The $c$-means al-\ngorithm requires the number of clusters\n\
