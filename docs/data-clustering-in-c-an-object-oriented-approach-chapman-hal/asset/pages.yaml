    # C.2 Installing Boost


    Most of the Boost libraries are header-only libraries. Installing these

    header-only libraries is very simple. One can just download the package of

    Boost libraries from Boost''s website and uncompress the disk.

    To use these header-only libraries, one lets the program know where the Boost

    headers.


    Several Boost libraries are automatic linking libraries. For example, the

    program options library is an automatic linking library. These libraries re-\quire
    separate compilation. After the package of Boost libraries is downloaded

    and uncompressed, one has compile these automatic linking libraries into

    binaries before using them.


