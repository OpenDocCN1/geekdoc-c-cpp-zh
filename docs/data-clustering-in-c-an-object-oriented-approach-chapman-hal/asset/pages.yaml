  md: "# # Chapter 16\n\n# ## The $k$-prototypes Algorithm\n\nThe $k$-prototypes algorithm\
    \ (Huang, 1998) is a clustering algorithm designed to cluster mixed-type datasets.\
    \ The $k$-prototypes algorithm was based on the idea of the $k$-means algorithm\
    \ and the $k$-modes algorithm (Huang, 1998; Chaturvedi et al., 2001). In this\
    \ chapter, we implement the $k$-prototypes algorithm.\n\n# ### 16.1 Description\
    \ of the Algorithm\n\nLet $X = \\{\\mathbf{x}_0, \\mathbf{x}_1, \\dots, \\mathbf{x}_{n-1}\\\
    }$ be a mixed-type dataset containing $n$ records, each of which is described\
    \ by $d$ attributes. Without loss of generality, we assume that the first $p$\
    \ attributes are numeric and the last $d-p$ attributes are categorical. The distance\
    \ between records $\\mathbf{x}$ and $\\mathbf{y}$ in $X$ can be defined as (Huang,\
    \ 1998):\n\n```\n$D_{mix}(\\mathbf{x}, \\mathbf{y}, \\beta) = \\sum_{h=0}^{p-1}\
    \ (x_h - y_h)^2 + \\beta \\sum_{h=p}^{d-1} \\delta(x_h, y_h), \\quad (16.1)$\n\
    ```\n\nwhere $x_h$ and $y_h$ are the $h$th component of $\\mathbf{x}$ and $\\\
    mathbf{y}$, respectively, $\beta$ is a balance weight used to avoid favoring either\
    \ type of attribute, and $\\delta(\\cdot, \\cdot)$ is the simple matching distance\
    \ defined as\n\n```\n$\\delta(x_h, y_h) = \\begin{cases} 0, & \\text{if } x_h\
    \ = y_h; \\ 1, & \\text{if } x_h \\neq y_h. \\end{cases}$\n```\n\nThe objective\
    \ function that the $k$-prototypes algorithm tries to minimize defined as\n\n\
    ```\n$P_\\beta = \\sum_{j=0}^{k-1} \\sum_{\\mathbf{x} \\in C_j} D_{mix}(\\mathbf{x},\
    \ \\mu_j, \\beta), \\quad (16.2)$\n```\n\nwhere $D_{mix}(\\cdot, \\cdot, \\beta)$\
    \ is defined in Equation (16.1), $k$ is the number of clusters, $C_j$ is the $j$th\
    \ cluster, and $\\mu_j$ is the center or prototype of cluster $C_j$."
  merge: -1
  pgno: 266
- img_proc: true
  md: '# Data Clustering in C++: An Object-Oriented Approach


    To minimize the objective function defined in Equation (16.2), the algorithm repeats
    iteratively. That is, the k-prototypes algorithm repeats updating the cluster
    memberships given the cluster centers and updating the cluster centers until some
    stop condition is met.


    At the beginning, the k-prototypes algorithm initializes the k cluster centers
    by selecting k distinct records from the dataset randomly. $\mu_0^{(0)}, \mu_1^{(0)},
    \dots, \mu_{k-1}^{(0)}$ are the initial cluster centers. The k-prototypes algorithm
    updates the cluster members $\gamma_0, \dots, \gamma_{n-1}$ according to the following
    formula:


    ```

    $$\gamma_i^{(0)} = \text{argmin} D_{mix}(\mathbf{x}_i, \mu_j^{(0)}, \beta), \quad
    0 \leq j \leq k-1$ (16.3)

    ```


    Where $D_{mix}(\cdot, \cdot, \beta)$ is defined in Equation (16.1).


    Once the cluster memberships are updated, the algorithm continues to update the
    cluster centers around the following formula:


    ```

    $$\mu_{jh}^{(1)} = \frac{1}{|C_j|} \sum_{\mathbf{x}_h \in C_j} x_h, \quad h =
    0, 1, \dots, p-1,$ (16.4a)

    ```


    ```

    $$\mu_{jh}^{(1)} = \text{mode}_h(C_j), \quad h = p, p+1, \dots, d-1,$ (16.4b)

    ```


    Where $C_j = \{\mathbf{x}_i \in X : \gamma_i^{(0)} = j\}$ for $j = 0, 1, \dots,
    k-1$, and $\text{mode}_h(C_j)$ is the most frequent value of the $ht$ attribute
    in cluster $C_j$. $A_{h0}, A_{h1}, \dots, A_{h,m_h-1}$ are the distinct values
    the $ht$ attribute can take, where $m_h$ is the number of records in cluster $C_j$,
    whose $ht$ attribute takes value. Let $f_{ht}(C_j)$ be the number of records in
    cluster $C_j$, whose $ht$ attribute takes value $A_{ht}$ for $t = 0, 1, \dots,
    m_h-1$. That is,


    ```

    $f_{ht}(C_j) = |{\mathbf{x} \in C_j : x_h = A_{ht}\}|, \quad t = 0, 1, \dots,
    m_h-1.$

    ```


    Then


    ```

    $$\text{mode}_h(C_j) = \text{argmax}_{0 \leq t \leq m_h-1} f_{ht}(C_j), \quad
    h = p, p+1, \dots, d-1.$

    ```


    The k-prototypes algorithm repeats the steps until the cluster memberships do
    not change or the maximum number of iterations is reached.


    # 16.2 Implementation


    The k-prototypes algorithm is very similar to the k-means algorithm except for
    updating cluster centers. To reuse the function in the k-means algorithm, we implement
    the k-prototypes algorithm as a class, which inherits from class Kmean. Listing
    11 shows the declaration of class Kprototype.'
