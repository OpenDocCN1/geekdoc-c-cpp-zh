    # 12.2.3 The Group Average Algorithm


    The group algorithm calculates the distance between a new cluster $C_{n+i-1}$
    formed at step $i$ and an old cluster $C$ as


    $D(C, C_{n+i-1}) = \frac{D(C, C_{i_1} \cup C_{i_2})}{|C_{i_1}| + |C_{i_2}|} =
    \frac{|C_{i_2}|}{|C_{i_1}| + |C_{i_2}|}D(C, C_{i_1}) + \frac{|C_{i_1}|}{|C_{i_1}|
    + |C_{i_2}|}D(C, C_{i_2}) = \frac{|C_{i_1}| \cdot D(C, C_{i_1}) + |C_{i_2}| \cdot
    D(C, C_{i_2})}{|C_{i_1}| + |C_{i_2}|}$


    where $C_{i_1}$ and $C_{i_2}$ are the two clusters merged at step $i$ and $| \cdot
    |$ denotes the number of elements in the underlying set.

    **Listing 12.7** shows the implementation of the function *updated_dm* in class
    Average. The code in lines 11-12 calculates the distance between the new cluster
    and an unmerged or old cluster as defined in Equation (12.5).


