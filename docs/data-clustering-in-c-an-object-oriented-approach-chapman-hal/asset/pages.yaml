    # 1.8 Literature of Clustering Algorithms


    Since the k-means algorithm was published about 50 years ago (Jain, 2010), thousands
    of papers and a number of books on data clustering have been published. In this
    section, some books and survey papers related to data clustering are listed. For
    a list of journals and conference proceedings in which papers on data clustering
    are published, readers are referred to Gan et al. (2007).


    # 1.8.1 Books on Data Clustering


    The following is a list of books related to data clustering that were published
    in the past 40 years.


    +   (a) Principles of Numerical Taxonomy (Sokal and Sneath, 1963). This book reviewed
    most of the applications of numerical taxonomy in the field of biology at that
    time. A new edition of this book is titled Numerical Taxonomy: The Principles
    and Practice of Numerical Classification (Sokal and Sneath, 1973). Although the
    two books were written for researchers in the field of biology, these books reviewed
    much of the literature of cluster analysis and presented many clustering techniques.


    +   (b) Cluster Analysis: Survey and Evaluation of Techniques by Bijnen (1973)
    selected a number of clustering techniques related to sociological and psychological
    research.


    +   (c) Cluster Analysis: A Survey by Duran and Odell (1974) supplied an exposition
    of various works in the literature of cluster analysis at that time. Many references
    that played a role in developing the theory of cluster analysis are included in
    the book.


    +   (d) Cluster Analysis for Applications (Anderberg, 1973). This book collected
    many clustering techniques and provided many FORTRAN procedures to perform cluster
    analysis on real data.


    +   (e) Clustering Algorithms (Hartigan, 1975). This book presented data clustering
    from a statistician''s point of view. This book includes a wide range of procedures
    in FORTRAN, methods, and examples.


    +   (f) Cluster Analysis for Social Scientists (Lorr, 1983). This book is an elementary
    book on data clustering and was written for researchers and graduate students
    in the social and behavioral sciences.


    +   (g) Algorithms for Clustering Data (Jain and Dubes, 1988). This book was written
    for the scientific community and emphasizes informal algorithms for clustering
    data and interpreting results.'
