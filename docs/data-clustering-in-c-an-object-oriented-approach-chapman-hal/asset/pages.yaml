  md: '# # Chapter 1


    #  Introduction to Data Clustering


    In this chapter, we give a review of data clustering. First, we describe what
    data clustering is, the difference between clustering and classification, and
    the notion of clusters. Second, we introduce types of data and some similarity
    and dissimilarity measures. Third, we introduce several popular hierarchical and
    partitional clustering algorithms. Then, we discuss cluster validity and applications
    of data clustering in various areas. Finally, we present some books and review
    papers related to data clustering.


    # ## 1.1 Data Clustering


    *Data clustering* is a process of assigning a set of records into subsets, called
    *clusters*, that records in the same cluster are similar and records in different
    clusters are quite distinct (Jain et al., 1999). Data clustering is also known
    as *cluster analysis, segmentation analysis, taxonomy analysis,* or *unsupervised
    classification.*


    The term record is also referred to as *data point, pattern, observation, object,
    individual, item, and tuple* (Gan et al., 2007). A record in a multidimensional
    space is characterized by a set of *attributes, variables, or features.*


    A typical clustering process involves the following five steps (Jain et al., 1999):


    +   (a) pattern representation;


    +   (b) dissimilarity measure definition;


    +   (c) clustering;


    +   (d) data abstraction;


    +   (e) assessment of output.


    In the pattern representation step, the number and type of the attributes are
    determined. *Feature selection,* the process of identifying the most effective
    subset of the original attributes to use in clustering, and *feature extraction,*'
  merge: -1
  pgno: 23
- img_proc: true
  md: '# Data Clustering in C++: An Object-Oriented Approach


    the process of transforming the original attributes to new attributes, are also
    done in this step if needed.


    In the dissimilarity measure definition step, a distance measure appropriate to
    the data domain is defined. Various distance measures have been developed and
    used in data clustering (Gan et al., 2007). The most common one among them, for
    example, is the Euclidean distance.


    In the clustering step, a clustering algorithm is used to group a set of records
    into a number of meaningful clusters. The clustering can be hard clustering, where
    each record belongs to one and only one cluster, or fuzzy clustering, where a
    record can belong to two or more clusters with probabilities. The algorithm can
    be hierarchical, where a nested series of partitions is produced, or partitioning,
    where a single partition is identified.


    In the abstraction step, one or more prototypes (i.e., representative records)
    of a cluster is extracted so that the clustering results are easy to comprehend.
    For example, a cluster can be represented by a centroid.


    In the final step, the output of a clustering algorithm is assessed. There are
    three types of assessments: external, internal, and relative (Jain and Dubes,
    1988). In an external assessment, the recovered structure of the data is compared
    to the a priori structure. In an internal assessment, one tries to determine whether
    the structure is intrinsically appropriate to the data. In a relative assessment,
    a test is performed to compare two structures and measure their merits.


    # 1.1.1 Clustering versus Classification


    Data clustering is one of the essential tasks of data mining, which aims to discover
    useful information by exploring and analyzing large amounts of data (Berry and
    Linoff, 2000). Table 1.1 shows the six tasks of data mining, which are grouped
    into two categories: direct data mining and indirect data mining tasks. The difference
    between direct data mining and indirect data mining lies in whether a variable
    is singled out as a target.


    | Direct Data Mining | Indirect Data Mining |

    |---|---|

    | Classification | Clustering |

    | Estimation | Association Rules |

    | Prediction | Description and Visualization |


    TABLE 1.1: The six essential tasks of data mining.


    Classification is a direct data mining task. In classification, a set of labeled
    or classified records is provided and the task is to classify a newly encountered
    but unlabeled record. Precisely, a classification algorithm tries to model a set
    of labeled data points $(x_i, y_i)$ ($1 \le i \le n$) in terms of mathematical
    function $y = f(x, w)$ (Xu and Wunsch, II, 2009), where $x_i$ is a'
  merge: -1
  pgno: 24
- img_proc: true
  md: '# Introduction to Data Clustering


    data point, $y_i$ is the label or class of $x_i$, and $w$ is a vector of adjustable
    parameters. An inductive learning algorithm or inducer is used to determine the
    values of these parameters by minimizing an empirical risk function on the set
    of labeled data points (Kohavi, 1995; Cherkassy and Mulier, 1998; Xu and Wunsch,
    2009). $w^*$ is the vector of parameters determined by the inducer. We obtain
    an induced classifier $y = f(\mathbf{x}, w^*)$, which can be used to classify
    new data points. The set of labeled data points $(x_i, y_i)$ $(1 \le i \le n)$
    is also called the training data for the inducer.


    Unlike classification, data clustering is an indirect data mining task. The task
    is to group a set of unlabeled records into meaningful subsets or clusters, where
    each cluster is associated with a label. As mentioned at the beginning of this
    section, a clustering algorithm takes a set of unlabeled data points as input
    and tries to group these unlabeled data points into a finite number of groups
    or clusters such that data points in the same cluster are similar and data points
    in different clusters are quite distinct (Jain et al., 1999).


    # 1.1.2 Definition of Clusters


    Over the last 50 years, thousands of clustering algorithms have been developed
    (Jain, 2010). However, there is still no formal uniform definition of the cluster.
    In fact, formally defining cluster is difficult and may be misplaced (Everitt
    et al., 2001).


    Although no formal definition of cluster exists, there are several operational
    definitions of cluster. For example, Bock (1989) suggested that a cluster is a
    group of data points satisfying various plausible criteria such as


    +   (a) Share the same or closely related properties;


