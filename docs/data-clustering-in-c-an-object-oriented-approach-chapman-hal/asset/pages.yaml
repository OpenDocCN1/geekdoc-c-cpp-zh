    # 4.6 Visitor


    The visitor pattern is a behavioral pattern that is used to add operations on
    elements in a tree structure. Using the visitor pattern, we do not need to code
    the operations inside an element class. Instead, we use in references to other
    classes that have dared the desired operations. The visitor pattern is a little
    more complex than other design patterns. The visitor pattern involves two class
    hierarchies: one for the elements being operated on and one for the visitors that
    define operations on the elements. Table 4.7 shows the four elements of the visitor
    pattern.


    Figure 4.6 shows the basic structure of the visitor pattern. In this class diagram,
    we see two class hierarchies mentioned before: the element hierarchy and the visitor
    class hierarchy. The visitor class hierarchy is based on the element class hierarchy.
    Class Visitor is an abstract base class, which declares a number of visitor functions
    depending on the number of concrete elements. If we add a new element class, we
    have to add a new visitor function to every class in the visitor class hierarchy.
    This is a drawback of the visitor pattern.


    In every class in the element class hierarchy, we define an accept method, which
    takes a reference of visitor as argument. In every class in the visitor class
    hierarchy, we define VisitElementA and VisitElementB since there are two element
    classes.


    The visitor pattern is usually used together with the composite pattern introduced
    before. The C++ program in Listing 4.6 illustrates the visitor'
