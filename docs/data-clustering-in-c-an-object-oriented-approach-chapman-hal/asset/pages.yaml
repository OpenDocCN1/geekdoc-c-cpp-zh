    \ x and y be two numeric records. Then the Minkowski distance is defined as\n\n\
    ```\n$D_{min}(x,y) = \\left( \\sum_{j=1}^{d} |x_j - y_j|^p \\right)^{1/p} \\quad\
    \ (9.1)$\n```\n\n$x_j$ is the jth component of record x, $y_j$ is the jth component\
    \ of record y, $d$ is the number of attributes describing the record, and $p \\\
    ge 1$.\nThe Minkowski distance is implemented as a class MinkowskiDistance, which\
    \ is derived from the base class Distance. Listing 9.2 shows the declaration of\
    \ class MinkowskiDistance. We see that the class has one private data member and\
    \ three public member functions, two of which are constructors. If the constructor\
    \ is called without argument, the data member $p$ is set to the default value\
    \ of 2.0. If the constructor is called with an argument, the data member is set\
    \ to the value of the argument. One can see the complete implementation in Listing\
    \ 8.72 and Listing 8.73.\n\nListing 9.2: Declaration of class MinkowskiDistance.\n\
    \n```\nclass MinkowskiDistance {\npublic:\n    MinkowskiDistance();\n    MinkowskiDistance(Real\
    \ p);\n    Real operator())(const boost::shared_ptr<Record>&,\n        const boost::shared_ptr<Record>&)\
