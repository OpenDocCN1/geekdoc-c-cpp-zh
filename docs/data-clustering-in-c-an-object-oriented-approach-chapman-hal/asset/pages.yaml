  md: '# # Chapter 7


    # ## Datasets


    Data is an important part of a clustering algorithm and is also the purpose of
    developing a clustering algorithm. Hence it is important to design and implement
    data before designing and implementing clustering algorithms.


    In this chapter, we describe how we design and implement datasets in the clustering
    library *ClusLib*. In the literature of data clustering, a data set is a collection
    of records and a record is characterized by a set of attributes (Gan et al., 2007).
    Hence it is natural to model attributes, records, and then datasets.


    # ### 7.1 Attributes


    An attribute denotes an individual component of a record. We can classify attributes
    into four categories: ratio, interval, ordinal, and nominal. We can use a real
    number to store a ratio or interval attribute value and an integer to store an
    ordinal or nominal attribute value.


    We follow the method in *MLC++* (Kohavi et al., 1998) to design and implement
    attributes. In *MLC++, the union structure was used to store a real number or
    an integer. However, union is not type safe and hence it is not a good practice
    in object-oriented programming. In *ClusLib*, we use boost::variant to store a
    real number or an integer.


    To implement attributes, we designed four classes: AttrValue, AttrInfo, CAttrInfo,
    and DAttrInfo. The UML class diagram in Figure 7.1 shows the relationships among
    these four classes. For the sake of space, we do not show methods in the class
    diagram. CAttrInfo and DAttrInfo inherit from class AttrInfo. AttrValue has two
    friend classes, which have access to its private members.


