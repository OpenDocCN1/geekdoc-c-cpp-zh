    # 20.5 Summary


    In this chapter, we introduced and implemented a simple $k$-means algorithm. We
    implemented the parallel $k$-means algorithm using the message passing interface
    and the Boost MPI library, which are also brief introduced in this chapter. Our
    illustrative examples show that the parallel version of the $k$-means algorithm
    reduces the run time when we use multiple processes.


    A number of researchers have studied parallel data clustering. For example, Kwok
    et al. (2002) proposed a fuzzy c-means algorithm. Güröy and Cengiz (2001) and
    Gursoy (2004) developed a parallel version of the tree-based k-means algorithm
    (Absalti et al., 1998) to cluster low-dimensional data on message passing computers.
    Jiménez and Vidal (2005) proposed two parallel clustering algorithms based on
    the $k$-means algorithm: $\alpha$-Bisecting $k$-means and $\alpha$-Bisecting spherical
    $k$-means. Hai and Susumu (2005) proposed a paral-'
  merge: -1
  pgno: 330
- img_proc: true
  md: lel clustering algorithm for categorical and mixed-type data. Song et al. (2008)
    proposed a parallel spectral clustering algorithm. Zhao et al. (2009) proposed
    a parallel k-means clustering algorithm based on MapReduce. Readers interested
    in parallel clustering can refer to those papers and the references therein.
