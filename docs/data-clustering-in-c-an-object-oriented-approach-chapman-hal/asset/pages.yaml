  md: '# 4.1 Singleton


    The singleton pattern is a design pattern used to ensure that a class has exactly
    one instance and provides a global point of access to it. Sometimes we want a
    class to have exactly one instance. For example, there should be only one window
    manager. To ensure that a class has only one instance and that the instance is
    easily accessible, the solution of the singleton pattern is to make the class
    itself responsible for keeping tracking of its sole instance and providing a way
    to access the instance (Gamma et al., 1994). Table 4.2 shows the four elements
    of the singleton pattern.


    | Element | Description |

    | --- | --- |

    | Pattern Name | Singleton |

    | Problem | Only one instance of an object is allowed to exist in the system at
    any one time |

    | Solution | Let the object manage its own creation and access through a class
    method |

    | Consequences | Controlled access to the object instance Difficult to inherit
    a singleton |


    TABLE 4.2: The singleton pattern.


    Figure 4.1 shows the UML class diagram of the singleton pattern. The singleton
    class contains a private static member, which is a point to the instance of the
    class. The class also contains a static method, which returns the pointer to the
    instance if the instance was already created or creates the instance and returns
    the pointer to the newly created instance. The constructor of the singleton class
    is protected, preventing users to instantiate the class.


    ```

    Singleton return _instance*

    static_instance : Singleton*=

    Singleton()

    static instance()

    ```


    FIGURE 4.1: The singleton pattern


    The singleton class shown in Figure 4.1 is not useful. To make the class useful,
    we need to add other functions to the class. The Logger class shown in Listing
    4.1 is a singleton class, which we can use to write log messages to screen or
    a file.'
