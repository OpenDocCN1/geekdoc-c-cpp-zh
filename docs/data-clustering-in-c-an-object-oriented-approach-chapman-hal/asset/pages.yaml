    In 16, the program uses the function rank to get the unique number (rank) associated
    with each process. The process with rank zero sends the message "a msg from master"
    to all other processes (lines 18-20). Processes with a non-zero rank receive the
    message and print the message to screen (lines 23-24). Functions send and recv
    are used to send and receive messages, respectively.


    In line 28, the program declares a vector of strings. The process with rank zeros
    pools the vector with four elements (29-34). Then the program uses the function
    broadcast to broadcast the vector of strings from the process with rank zero to
    all other processes so that all processes can use the vector. The broadcast method
    is one of the collective operations.


    In line 39, the program summarizes the strings from each process into a single
    string with rank zero. The reduce method is another collective operation. The
    value of str (line 38) is different for different ranks. The value of strum (line
    39) for a process with rank zero is the sum of str from the other processes.


    The reduce method does not broadcast the collective value to other processes.
    We need to use the all_reduce method to summarize the strings and broadcast the
    sum of the strings to all processes.


    Now let us compile the program. Compiling an MPI C++ program is a little different
    from compiling an ordinary C++ program. To compile an MPI C++ program, we need
    to use the command mpic++ provided by the MPICH2 library. However, the compilation
    options are the same as those used with g++. To compile the MPI program shown
    in Listing 20.1, we use the following command:


    ```

    mpic++ -o mpia -I/usr/local/include mpia.cpp -L/usr/local/lib -lboost_mpi -lboost_serialization

    ```


    The -I and -L options tell the compiler the locations of the Boost headers and
    libraries, respectively. Since the program uses the Boost MPI library and the
    Boost serialization library, we need to link these libraries using the -l option.


    To execute the program, we use the command mpun provided by the MPICH2 library.
    Before we execute the program, we need to make sure that an MPD is running on
    each cluster node used by the program. An MPD is an MPICH2 daemon that controls,
    runs, and stops the processes on the cluster nodes. To start an MPD, we use the
    command mpd& provided by the MPICH2 library. The & symbol tells the computer to
    run the daemon in background.


