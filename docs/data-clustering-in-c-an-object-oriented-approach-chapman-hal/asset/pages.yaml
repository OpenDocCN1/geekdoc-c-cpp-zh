  md: 'Chapter 9. Dissimilarity Measures. Dissimilarity or distance measures are an
    important part of clustering algorithms. In this chapter, the design of the distance
    base class is introduced. Several popular distance measures such as the Euclidean
    distance, the simple matching distance, and the mixed distance are introduced.
    In this chapter, we also introduce the implementation of the Mahalanobis distance.


    Chapter 10. Clustering Algorithms. This chapter introduces the design and implementation
    of the clustering algorithm class. All data clustering algorithms have three components:
    arguments or parameters, clustering method, and results. In this chapter, we introduce
    the argument class, the result class, and the base class. A dummy clustering algorithm
    is used to illustrate the usage of the base clustering algorithm class.


    Chapter 11. Utility Classes. This chapter, as its title implies, introduces several
    utility classes used frequently in the clustering library. Two template classes,
    the CSV (comma-separated values) dataset reader class and a multivariate Gaussian
    mixture dataset generator class are also introduced in this chapter. In addition,
    two hierarchical visitor classes, the join value visitor class and the partition
    creator class, are introduced in this chapter. This chapter also includes two
    classes that provide functionalities to draw dendrograms in EPS (Encapsulated
    PostScript) figures for hierarchical clustering trees.


    Chapter 12. Agglomerative Hierarchical Algorithms. This chapter introduces the
    implementations of several agglomerative hierarchical clustering algorithms that
    are based on the Lance-Williams framework. In this chapter, simple linkage, complete
    linkage, group average, weighted group average, centroid, and Ward''s method are
    implemented and illustrated by a synthetic dataset and the Iris dataset.


    Chapter 13. DIANA. This chapter introduces a divisive hierarchical clustering
    algorithm and its implementation. The algorithm is illustrated by a synthetic
    dataset and the Iris dataset.


    Chapter 14. The k-means Algorithm. This chapter introduces the standard k-means
    algorithm and its implementation. A synthetic dataset and the Iris dataset are
    used to illustrate the algorithm.


    Chapter 15. The c-means Algorithm. This chapter introduces the fuzzy c-means algorithm
    and its implementation. The algorithm is also illustrated by a synthetic dataset
    and the Iris dataset.


    Chapter 16. The k-prototype Algorithm. This chapter introduces the k-prototype
    algorithm and its implementation. This algorithm was designed to cluster mixed-type
    data. A numeric dataset (the Iris dataset), a categorical dataset (the Soybean
    dataset), and a mixed-type dataset (the heart dataset) are used to illustrate
    the algorithm.


    Chapter 17. The Genetic k-modes Algorithm. This chapter introduces the genetic
    k-modes algorithm and its implementation. A brief introduction to the genetic
    algorithm is also presented. The Soybean dataset is used to illustrate the algorithm.'
