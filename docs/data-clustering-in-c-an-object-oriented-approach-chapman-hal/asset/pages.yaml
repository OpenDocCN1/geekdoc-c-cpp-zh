    # 16.4 Summary


    In this chapter, we implemented the $k$-prototypes algorithm and illustrated it
    with different types of datasets. The $k$-prototypes algorithm integrates the
    $k$-means algorithm and the $k$-modes algorithm. The distance measure for the
    attributes and the distance for categorical attributes. The two components of
    the $k$-prototypes algorithm includes two components: the distance for numerical
    attributes and the distance for categorical attributes are balanced using a weight.
    In our implementation, we used the squared Euclidean distance for numerical attributes
    and the simple matching distance for the categorical attributes. In fact, the
    $k$-prototypes algorithm can use other mixed-type distance measures. For example,
    the general Minkowski distance (Ichino, 1988; Ichino and Yamaguchi, 1994).'
