  md: '# C.3 Installing Cygwin


    Installing Cygwin on Windows systems is very easy. One can follow the steps to
    install Cygwin.


    +   (a) Download the setup.exe file from http://www.cygwin.com;

    (b) Double click the setup program and click “Next” button;

    (c) Check “Install from Internet” and click “Next";

    (d) Click “Next” in the “Choose Installation Directory” window;

    (e) Click “Next” in the “Select Local Package Directory” window;

    (f) Click “Next” in the “Select Connection Type” window;

    (g) Choose a download site in the “Choose Download Site(s)” window and click “Next";

    (h) Expand the “Devel” section and choose “autoconof”, “automake”, “gcc-++”, “gdb”,
    “libboost”, “libtool”, and “make";

    (i) Expand the “Editors” section and choose “vim” (or other editors like);

    (j) Click “Next";

    (k) Click “Finish”.


    Note that some download sites have the latest Boost binaries and download sites
    may have old Boost binaries.


