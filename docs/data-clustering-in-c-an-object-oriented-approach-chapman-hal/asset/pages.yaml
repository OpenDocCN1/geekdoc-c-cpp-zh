    # 18.4 Summary


    In this chapter, we implemented the FSC algorithm and illustrated the algorithm
    with several examples. The FSC algorithm is an extension of the $k$-means algorithm
    for subspace clustering. The FSC algorithm also applies the idea of fuzzy sets
    to attribute selection. Rather than treating an attribute as relevant or not relevant
    to a cluster, the FSC algorithm assigns a weight to the attribute to indicate
    the importance of the attribute. More information about the FSC algorithm and
    other relevant algorithms (e.g., mean shift for subspace clustering) can be found
    in Gan (2007) and Gan et al. (2007).'
