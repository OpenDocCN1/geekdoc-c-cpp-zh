    # 1.3 Dissimilarity and Similarity Measures


    Dissimilarity or distance is an important part of clustering as all clustering
    algorithms rely on some distance measure to define the clustering criteria. Since
    records might have different types of attributes, the appropriate distance measures
    are also different. For example, the most popular Euclidean distance is used to
    measure dissimilarities between continuous records; i.e., records consist of continuous
    attributes.


    A distance D on a dataset X is a binary function that satisfies the following
    conditions (Andberg, 1973; Zhang and Srihari, 2003; Xu and Wunsch, II, 2009):


    +   (a) D(x,y) ≥ 0 (Nonnegativity);

    (b) D(x,y) = D(y,x) (Symmetry or Commutativity);

    (c) D(x,y) = 0 if and only if x = y (Reflexivity);

    (d) D(x,y) ≤ D(x,z) + D(z+y) (Triangle inequality),


    where x, y, and z are arbitrary data points in X. A distance function is also
    called a metric, which satisfies the four conditions.


    If a function satisfies the first three conditions and does not satisfy the triangle
    inequality, then the function is called a semimetric. In addition, if a metric
    D satisfies the following condition


    ```

    D(x,y) ≤ max{D(x,z), D(z + y)}

    ```


    then the metric is called an ultrametric (Johnson, 1967).


    Unlike distance measures, similarity measures are defined in the opposite way.
    The more two data points are similar to each other, the larger the similarity
    is and the smaller the distance is.'
