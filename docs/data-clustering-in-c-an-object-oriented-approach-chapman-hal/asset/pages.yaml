  md: "# Clusters\n\n# 135\n\n# 8.3 Hierarchical Clustering\n\nIn this section, we\
    \ describe the design and implementation of the result of a hierarchical clustering\
    \ algorithm. For convenience, we call the result a hierarchical clustering. Similar\
    \ to a partial clustering, a hierarchical clustering is also a collection of clusters.\
    \ However, a hierarchical clustering is more complicated than a partial clustering.\
    \ In fact, a hierarchical clustering is a nested tree of partial clusterings.\
    \ Here it is natural to apply the composite design pattern to design a hierarchical\
    \ clustering.\n\nBefore we introduce the design of a hierarchical clustering,\
    \ let us introduce the classes used to implement the composite design pattern.\
    \ The composite design pattern is implemented by three classes: Node, LeafNode,\
    \ and InternalNode.\n\nThe declaration of class Node is shown in Listing 8.5.\
    \ This class has three protected data members: _parent, _id, and _level. Data\
    \ member _parent holds a shared pointer to the parent of the node. Data member\
    \ _id is the identifier of the node. Data member _level holds the level of the\
    \ node in the hierarchical tree. All leaf nodes have a level of zero. Figure 8.2\
    \ shows a hierarchical tree with levels. In Figure 8.2, a circle denotes a node\
