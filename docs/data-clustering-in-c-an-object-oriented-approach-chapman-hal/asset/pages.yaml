    a number of small and independent objects, each of which is self-contained and
    does its job independently of others. Once an object is encapsulated, the object
    can be viewed as a black box.


    An encapsulated object has an interface that lists the methods provided by the
    object. The methods in an object''s interface have three levels of access: public,
    protected, and private. Public methods can be accessed by all objects; protected
    methods can be accessed by the object and of any subclasses; private methods can
    be accessed by the object only.


    Encapsulated objects have the following valuable benefits:


    +   - An encapsulated object is pluggable. In order to use an encapsulated object,
    one needs to understand only how to use the object''s public interface;

    - An encapsulated object can be changed without affecting other objects as long
    as its interface is untouched; and

    - An encapsulated object can be used without causing unexpected side effects between
    the object and the rest of the program, since the interaction with the rest of
    the program is limited to its interface.


    A well-encapsulated object should have all the following three characteristics
    (Sintes, 2001):


    +   - Abstraction;

    - Implementation hiding; and

    - Division of responsibilities.


    Abstraction is the process of identifying a solution to a general problem rather
    than a specific problem. For example, we can design a generic container to hold
    different types of data (e.g., integers and floats) in a sorting algorithm. In
    this way, we can use the sorting algorithm to sort integers and floats. Hence,
    abstraction helps you achieve.


    Implementation hiding, as its name implies, is to hide the implementation behind
    the interface. As long as we do not change the interface of an object, we can
    change the implementation of the object without affecting other parts of the program.
    Obviously, implementation hiding leads to flexible design.


    Division of responsibilities means that each object has one or a small number
    of responsibilities and should do it.


