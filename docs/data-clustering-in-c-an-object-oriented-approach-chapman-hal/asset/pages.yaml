    # 7.5 Summary


    In this chapter, we introduced our design and implementation of datasets in C++.
    Our design and implementation follows the approaches employed in MLC++ (Kohavi
    et al., 1998). In ClusLib, however, we used a data structure that is more type-safe
    and follows object-oriented design.


    In addition, we used many C++ language features that were not available many years
    ago. For example, MLC++ implemented its own containers to hold individual components
    of a record. In ClusLib, we used class vector provided by the C++ standard library
    to hold individual components of a record.


    We also gave an example to illustrate how to create datasets and manipulate data
    using the functions provided by the dataset classes.'
