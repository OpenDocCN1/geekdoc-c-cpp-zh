    # 1.3.1 Measures for Continuous Data


    The most common distance metric for continuous data is the Euclidean distance.
    Given two data points **x** and **y** in a $d$-dimensional space, the Euclidean
    distance between the two data points is defined as


    ```

    $$D_{uc}(\mathbf{x},\mathbf{y}) = \sum_{j=1}^{d}(x_j - y_j)^2, \quad (1.1)$$

    ```


    where $x_j$ and $y_j$ are the $jth$ components of **x** and **y**, respectively.

    The Euclidean distance is a metric (Xu and Wunsch, 2009). Clustering algorithms
    use the Euclidean distance tend to produce spherical clusters. Clusters produced
    by clustering algorithms that use the Euclidean distance are invariant to translations
    and rotations in the data space (Duda et al., 2001). One disadvantage of the Euclidean
    distance is that attributes with large values and variances dominate attributes
    with small values and variances. However, this problem can be alleviated by normalizing
    the data so that each attribute contributes equally to the distance.

    The squared Euclidean distance between two data points is defined as


    ```

    $$D_{sq}(\mathbf{x},\mathbf{y}) = \sum_{j=1}^{d}(x_j - y_j)^2. \quad (1.2)$$

    ```


