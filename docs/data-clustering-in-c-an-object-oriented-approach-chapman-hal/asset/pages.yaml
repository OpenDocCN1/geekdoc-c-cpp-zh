  md: '# Chapter 4


    # Design Patterns


    A design pattern is a general reusable solution to a problem that occurs over
    and over again in software design. A design pattern has four essential elements:
    the pattern name, the problem, the solution, and the consequences (Gamma et al.,
    1994).

    The pattern name is a handle we use when we talk about the design pattern. The
    problem describes when to apply the pattern and the solution describes how to
    apply the pattern. The consequences describe the results and trade-offs of applying
    the pattern.


    | Creational | Structural | Behavioral |

    | --- | --- | --- |

    | Factory | Adapter | Interpreter |

    | Abstract Factory | Bridge | Template Method |

    | Builder | Composite | Chain of Responsibility |

    | Prototype | Decorator | Command |

    | Singleton | Facade | Iterator |

    | | Proxy | Mediator |

    | | | Memento |

    | | | Observer |

    | | | State |

    | | | Visitor |


    TABLE 4.1: Categories of design patterns.


    Table 4.1 gives a list of 23 design patterns, which are classified into three
    categories: creational patterns, structural patterns, and behavioral patterns
    (Gamma et al., 1994). Creational patterns are related to the process of object
    creation. Structural patterns concern the composition of classes or objects. Behavioral
    patterns model how classes or objects interact and distribute responsibilities.'
