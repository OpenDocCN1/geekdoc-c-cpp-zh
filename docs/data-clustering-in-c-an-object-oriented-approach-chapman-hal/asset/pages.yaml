    ```

    $^{d-1}w_{jr}=1, \quad 0 \leq j \leq k-1. \quad (18.2b)$

    ```


    The FSC algorithm tries to minimize the objective function defined in Equation
    (18.1) using an iterative process. The iterative process is very similar to that
    of the $k$-means algorithm. That is, the FSC algorithm repeats updating the cluster
    centers given the fuzzy dimension weight matrix and updating the fuzzy dimension
    weight matrix by the cluster centers.


    At the beginning, the FSC algorithm initializes the centers by selecting $k$ distinct
    random and initializes the fuzzy dimension weight matrix equally, i.e., $w_{jr}^{(0)}=\frac{1}{2}$
    for $j=0, 1, \dots, k-1, r=0, 1, \dots, d-1$. Propose $\mu_{j}^{(0)}(j=0, 1, \dots,
    k-1)$ are the initial cluster centers. Then the FSC algorithm updates the clusters
    $C_0, C_1, \dots, C_{k-1}$ based on the initial centers and the initial fuzzy
    dimension weight matrix as follows:


    ```

    $\mu_{j}^{(0)} = \left\ \x \in X : D_{euc}(\x, \mu_{j}^{(0)}) = \min_{0 \leq l
    \leq k-1} D_{euc}(\x, \mu_{l}^{(0)}) \right\; \quad (18.3)$

    ```


    for $j=0, 1, \dots, k-1$, where


    ```

    $D_{euc}(\x, \mu_{l}^{(0)}, W^{(0)}) = \left( \sum_{r=0}^{d-1} w_{jr}^{(0)})^{\alpha}
    (x_r - \mu_{lr}^{(0)})^{\2} \right)^{1/\alpha}, \quad 0 \leq l \leq k-1. \quad
    (18.4)$

    ```


    Then the FSC algorithm updates the fuzzy dimension weight matrix based on the
    cluster centers and the clusters according to the following formula:


    ```

    $w_{jr}^{(1)} = \frac{\left( \sum_{\x \in C_{j}^{(0)}} (x_r - \mu_{jr}^{(0)})^{\2}
    + \epsilon \right)^{-\alpha-1}}{\sum_{l=0}^{k-1} \left( \sum_{\x \in C_{l}^{(0)}}
    (x_l - \mu_{jl}^{(0)})^{\2} + \epsilon \right)^{-\alpha-1}} \quad (18.5)$

    ```


    for $j=0, 1, \dots, k-1$ and $r=0, 1, \dots, d-1$.


    Once the fuzzy dimension weight matrix is updated. The FSC algorithm will update
    the cluster centers based on the fuzzy dimension weight matrix and the clusters
    according to the following formula:


    ```

    $\mu_{jr}^{(1)} = \frac{\sum_{\x \in C_{j}^{(0)}} x_r}{|C_{j}^{(0)}|} \;quad (18.6)$

    ```'
