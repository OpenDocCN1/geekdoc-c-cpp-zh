    # 1.4.2 Divisive Hierarchical Algorithms


    Divisive hierarchical algorithms can be classified into two categories: monotonic
    and polymorphic (Willet, 1988; Everitt, 1993). A monothetic algorithm divides
    a dataset on a single specified attribute. A polymorphic algorithm divides a dataset
    on the values of all attributes.

    Given a dataset containing $n$ records, there are $2^{n-1} - 1$ different ways
    to split the dataset into two pieces (Edwards and Cavalli-Sforza, 1965). As a
    result, it is not feasible to enumerate all possible ways of dividing a large
    dataset. Another difficulty of divisive hierarchical clustering is to choose which
    cluster to split in order to ensure monotonicity.


    Divisive hierarchical algorithms that do not consider all possible divisions and
    are monotonic exist. For example, the algorithm DIANA (DIverse Anysis) is such
    a divisive hierarchical clustering algorithm (Kaufman and Rousseau, 1990).


