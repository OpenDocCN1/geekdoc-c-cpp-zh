    # 3.1 Object-Oriented Programming


    Object-oriented programming (OOP) is a programming paradigm that is based on the
    concept of *objects*, which are data structures consisting of data and methods
    (Sintes, 2001).


    Prior to the invention of OO programming, programmers used machine language programming,
    procedural programming, and modular programming to write their programs. In machine
    language programming, as the name suggests, programmers write their programs in
    the machine''s binary languages and enter the programs directly into the computer''s
    memory via bank switches. Obviously, machine language programming is error prone
    and the resulting code is difficult to read and maintain.


    In procedural programming, programmers split their programs into a sequence of
    modules, which are easier to understand and debug. This represents a significant
    improvement over machine language programming. Procedural programming still has
    some drawbacks. For example, procedural programming limits code reuse and its
    data-centric nature requires each procedure to know how to manipulate the data.


    In modular programming, programmers break their programs into a number of modules,
    which combine data and the procedures used to process the data. Clearly, modular
    programming improves on some of the deficiencies found in procedural programming.
    However, modules are not extendable, that is, one has to break the open code and
    make changes directly when making changes to a module.


    OO programming improves modular programming by adding inheritance and polymorphism
    to the module. In OO programming, a program is a collection of interacting objects,
    each of which models some aspect of the problem'
