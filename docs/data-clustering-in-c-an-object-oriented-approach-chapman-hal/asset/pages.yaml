  md: '# Appendix C


    # Software


    # C.1 An Introduction to Makefiles


    In this appendix, we give a basic introduction to makefiles, which tell the program
    make what to do. For a detailed introduction to makefiles, readers are referred
    to Vaughan et al. (2010), Mecklenburg (2004), and Calcote (2010).


    A makefile is a file that contains a set of rules used by make to build an application.
    The first rule in the file is the default rule. Usually, a rule consists of three
    parts: the target, its prerequisites, and one or more commands to execute. The
    format of a rule is:


    ```

    target target2: prerequisite1 prerequisite2

    command1

    command2

    ```


    The target is the file that we want to create or label representing a command
    script. The prerequisites are files on which the target depends. The commands
    are shell commands used to create the target from those prerequisites. If the
    prerequisites do not exist, then make will refuse to work. Also note that a command
    must start with a tab character. The pound sign # is the comment character for
    make.


    # C.1.1 Rules


    There are several kinds of rules in make: explicit rules, pattern rules, and suffix
    rules. Pattern rules and suffix rules are also called implicit rules. Explicit
    rules specify particular files as targets and prerequisites. Unlike explicit rules,
    pattern rules use wildcards rather than filename to specify targets and prerequisites.
    Suffix rules are built-in rules of make, which enable make to handle common tasks
    by knowing the file types.


    When a target is a label rather than a file, we call it a phony target. For example,
    clean is a standard phony target:


    ```

    .PHONY:clean

    clean:

    rm -f *.o ~

    ```'
  merge: -1
  pgno: 470
- img_proc: true
  md: '# Data Clustering in C++: An Object-Oriented Approach


    The target .PHONY is a special target which tells make that a target is not a
    real file. Other examples of standard phony targets include all and install.


    # C.1.2 Variables


    A makefile will define some variables. In general, a variable has the syntax:


    ```

    $(variable-name)

    ```


    For example, the command to compile a C++ program is contained in the variable
    COMPILE.cc.

    The program also defines a set of automatic variables which are set by make after
    a rule is matched. Table C.1 shows several very automatic variables. These automatic
    variables have two variants by appending a “D” to the symbol or appending an “F”
    to the symbol. For example, $@(D) returns only the directory portion of the value;
    While $@(F) returns only the file portion of the value.


    | Variable | Description |

    | --- | --- |

    | $@ | The filename of the target. |

    | % | The filename of an archive member specification. |

    | $< | The filename of the first prerequisite. |

    | ? | The filenames of all prerequisites that are newer than the target, separated
    by black spaces. |

    | ^ | The filenames of all prerequisites with duplicate filenames removed. |

    | + | The filenames of all prerequisites with duplicates. |


    > TABLE C.1: Some automatic variables in make.


    Usually, the sources of an application are in a number of directories. For example,
    header files are in a directory named “include” and implementation files are in
    a directory named “src”. Unless we direct it, make will not find these files.
    In this case, we can use VPATH and vpath to make search for files in different
    directories. For example, to tell make to look in the directory “src”, we can
    add a VPATH assignment to the makefile:


    ```

    VPATH = src

    ```


    The vpath feature is more sophisticated than the VPATH feature. The syntax of
    vpath is:


    ```

    vpath pattern directory-list

    ```


    For example, the following example


    ```

    vpath %.h include

    vpath %.cpp src

    ```'
