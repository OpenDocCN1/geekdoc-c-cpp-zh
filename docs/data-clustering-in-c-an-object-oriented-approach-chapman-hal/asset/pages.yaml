    # 1.5.4 Grid-Based Clustering Algorithms


    Grid-based clustering algorithms are very efficient for clustering very large
    datasets since these algorithms perform clustering on the grid cells rather than
    the individual data points. A typical grid-based clustering algorithm consists
    of the following basic steps (Grabusts and Borisov, 2002):


    +   (a) Construct a grid structure by dividing the data space into a finite number
    of cells;


    +   (b) Calculate the density for each cell;


    +   (c) Sort the cells based on their densities;


    +   (d) Identify cluster centers;


    +   (e) Traverse neighbor cells.


    The STING (Statistical Information Grid-based) algorithm is a grid-based clustering
    algorithm proposed by Wang et al. (1997) for spatial datasets. STING was designed
    for scalable clustering high-dimensional data. and cannot be scalable. Keim and
    Hinburg (1999) proposed a grid-based clustering algorithm, OptGrid, for clustering
    high-dimensional data. Schikuta and Erhart (1997) proposed a BANG-clustering algorithm,
    which is also a grid-based clustering algorithm. Nagesh et al. (2001) proposed
    a clustering algorithm on adaptive grids. Other grid-based clustering algorithms
    include GRIDCLUS (Schikuta, 1996), GDILC (Zao and Song, 2001), and WaveCluster
    (Sheikholeslami et al., 2000).


    More recently, Qiu et al. (2007) also proposed a grid-based clustering algorithm
    that is capable of dealing with high-dimensional datasets. Park and Lee (2007)
    proposed a grid-based subspace algorithm to cluster data streams. Lin et al. (2008)
    proposed a grid-based clustering algorithm that is less influenced by the size
    of grid cells than many other grid-based clustering algorithms.


    # 1.5.5 Density-Based Clustering Algorithms


    Density-based clustering algorithms are a kind of clustering algorithm that is
    capable of finding arbitrarily shaped clusters. In density-based clustering, a
    cluster is defined as a dense region surrounded by low-density regions. Usually,
    density-based clustering algorithms do not require specifying the number of clusters
    (El-Sonbaty et al., 2004). One drawback of most density-based clustering algorithms
    is that it is hard to determine certain parameters, such as the density threshold.


    Popular density-based clustering algorithms include DBSCAN (Ester et al., 1996)
    and their variations and extensions such as GBSCAN (Sander et al., 1998), PBSCAN
    (Xu et al., 1999), DBCluc (Zaiane and Lee, 2002).'
  merge: -1
  pgno: 40
- img_proc: true
  md: '# Introduction to Data Clustering


    BRIDGE (Dash et al., 2001) is a hybrid clustering algorithm that is based on the
    k-means algorithm and DBSCAN. Other density-based clustering algorithms include
    DENCLUE (Keim and Hinneburger, 1999) and CUBN (Wang and Wang, 2003).


    # 1.5.6 Model-Based Clustering Algorithms


    Mode-based clustering algorithms are clustering algorithms based on probability
    models. The term model usually refers to the theory of constraints and geometric
    properties of the covariance matrices (Martinez and Martinez, 2005). In model-based
    clustering, the data are viewed as samples coming from a mixture of probability
    distributions, each of which represents a cluster.


    In model-based clustering, there are two approaches to formulate a model for the
    composite clusters: the classification likelihood approach and the mixture likelihood
    approach (Celeux and Govaert, 1995; Faley and Raftery, 1998). In the classification
    likelihood approach, the objective function


    ```

    $L_C(\Theta_1, \Theta_2, \cdots, \Theta_k; \gamma_1, \gamma_2, \cdots, \gamma_n|X)
    = \prod_{i=1}^n f_{\gamma_i}(\mathbf{x}_i|\Theta_{\gamma_i})$

    ```


    is maximized, where $\gamma_i=j$ if record $x_i$ belongs to the $jth$ component
    or cluster, $\Theta_j (j=1, 2,\cdots,k)$ are parameters, and $X=\{\mathbf{x}_1,
    \mathbf{x}_2, \cdots, \mathbf{x}_n\}$ is a dataset.


    In the mixture likelihood approach, the objective function


    ```

    $L_M(\Theta_1, \Theta_2, \cdots, \Theta_k; \tau_1, \tau_2, \cdots, \tau_k|X) =
    \prod_{i=1}^n \sum_{j=1}^k \tau_j f_j(\mathbf{x}_i|\Theta_j)$

    ```


    is maximized, where $\tau_j \ge 0$ is the probability that a record belongs to
    the $jth$ component and


    ```

    $$\sum_{j=1}^k \tau_j = 1.$

    ```


    Some classical and powerful model-based clustering algorithms are based on Gaussian
    mixture models (Banfield and Rafter, 1993). Celeux and Govaert (1995) presented
    sixteen model-based clustering algorithms under different constraints on the Gaussian
    mixture model. These algorithms use the EM algorithm (Dempster et al., 1977; Meng
    and van Dyk, 1997) to estimate the parameters.


    Beck (1996) presented a survey of data clustering based on a probabilistic and
    inferential framework. Edwards and Cavalli-Sforza (1965), Day (1969), Wolfe (1970),
    Scott and Symons (1971), and Binder (1978) presented some early work on model-based
    clustering. Other model-based clustering algorithms are discussed in (Gan et al.,
    2007, Chapter 14).'
  merge: -1
  pgno: 41
