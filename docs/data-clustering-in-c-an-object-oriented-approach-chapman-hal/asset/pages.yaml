  md: '# Chapter 20


    # A Parallel $k$-means Algorithm


    In this chapter, we implement a basic $k$-means algorithm using message passing
    interface (MPI). First, we give a brief introduction to the MPI standard and the
    Boost MPI library. Then we introduce the parallel $k$-means algorithm. Finally,
    we present the implementation of the parallel $k$-means algorithm and examples
    of applying the algorithm.


    # 20.1 Message Passing Interface


    The Message Passing Interface (MPI) standard is a language-independent, flexible,
    and efficient API (application programming interface) specification used to program
    parallel computers (Gropp et al., 1999). There are many MPI libraries that implement
    the MPI standard. For example, OpenMPI, MPICH, and LAM/MPI are different implementations
    of the MPI standard. Almost all MPI libraries are implemented in C.


    An MPI library (e.g., MPICH) provides functionalities to support MPI environment
    management, point-to-point communications, and collective communications. Point-to-point
    communication allows a process to send and receive messages from other processes.
    Collective communication allows processes to coordinate as a group.


    The Boost MPI library is not a new MPI library but a C++ friendly interface to
    the MPI. That is, the Boost MPI library is not an implementation of the MPI standard.
    To use the Boost MPI library, we first need to install an MPI library such as
    MPICH2. Section C.5 introduces how to install MPICH2 library and the Boost MPI
    library.


    Suppose we have installed MPICH2 and the Boost MPI library following Now let us
    consider a simple C++ MPI program to illustrate the aforementioned concepts. The
    code of the C++ MPI program is shown in Listing 20.1. Before we compile and execute
    the program, let us take a look at the code first.


    The program includes the Boost header `mpi.hpp` (line 2), which contains all the
    headers of the Boost MPI library. Since data is serialized before trans-'
