    \ 1988; Legendre and Legendre, 1983; Gordon, 1999; Everitt et al., 2001).\n\n\
    This chapter focuses on the design and implementation of some distance measures\
    \ that can be reused for different clustering algorithms.\n\n# 9.1 The Distance\
    \ Base Class\n\nIn data clustering, a distance measure is used to measure the\
    \ dissimilarity between two records. Although we frequently measure the dissimilarity\
    \ between a record and a cluster, such dissimilarity can be measured between the\
    \ record and the representative records of the cluster. Hence we design the distance\
    \ classes for measuring the distance between two records.\n\n9.1 shows the declaration\
