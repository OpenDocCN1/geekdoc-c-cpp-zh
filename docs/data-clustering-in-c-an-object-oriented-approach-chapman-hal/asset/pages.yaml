  md: '# # Chapter 8


    # ## Clusters


    In data clustering, a cluster is a collection of objects or records that share
    the same properties (Carmichael et al., 1968; Bock, 1989; Everitt, 1993). The
    result of applying a clustering algorithm to a dataset is a collection of clusters.


    In this chapter, we introduce the design and implementation of clusters. First,
    we introduce the design of a single cluster. Then, we introduce how we design
    the result of a partitional clustering algorithm. Finally, we introduce the design
    of the result of a hierarchical clustering algorithm.


    # ### 8.1 Clusters


    In cluster analysis, there is no uniform definition for a cluster (Everitt, 1993).
    The term *cluster* is essentially used in an intuitive manner. In general, a cluster
    is formed by objects or records that have one or more of the following properties
    (Bock, 1989; Gan et al., 2007):


    +   (a) The objects in the cluster share the same or closely related properties.


    +   (b) The objects in the cluster show small mutual distances.


    +   (c) The objects have relations with at least one other object in the cluster.


    +   (d) The objects can be clearly distinguishable from objects that are not in
    the cluster.


    Clusters come with many different forms. For example, there are one-center clusters,
    multi-center clusters, fuzzy clusters, subspace clusters, to name a few. Although
    clusters have many properties, they share the same property: a cluster is a collection
    of records. Hence it is natural to design the base cluster class as a collection
    of records. The piece of code in Listing 8.1 shows the declaration of class `Clustert`.


    Class `Cluster` inherits from class `Container` realized with the parameter `boost::shared_ptr<Record>`.
    Here class `Cluster` inherits all the methods from class `Container` that are
    used to access and modify an individual `Record` object. In addition, class `Cluster`
    has one private member and three'
