  md: '# Agglomerative Hierarchical Algorithms


    proposed by Jambu (1978) and discussed in (Gordon, 1996) and (Gan et al., 2007).


    The first four algorithms (i.e., single linkage, complete linkage, group averaging
    and weighted average) are referred to as graph hierarchical methods (Murtag, 1993).
    The last three algorithms (i.e., centroid, median, and Ward''s method) are referred
    to as geometric hierarchical methods. The last three algorithms require Euclidean
    distance in the Lance-Williams formula. For geometric hierarchical algorithms,
    the centers of a cluster formed by merging two clusters can be calculated from
    the centers of the merged clusters. In addition, the distance between two clusters
    can be calculated from the distance between centers of the two clusters. Table
    12.2 shows the calculation of clusters and distances for the geometric hierarchical
    algorithms.


    | Algorithm | $\mu(C_1 \cup C_2)$ | $D(C_1, C_2)$ |

    | --- | --- | --- |

    | Centroid | $\frac{|C_1|\mu(C_1)|C_2|\mu(C_2)}{|C_1|+|C_2|}$ | $D_{euc}(\mu(C_1),
    \mu(C_2))^2$ |

    | Median | $\frac{\mu(C_1)+\mu(C_2)}{2}$ | $D_{euc}(\mu(C_1), \mu(C_2))^2$ |

    | Ward''s | $\frac{|C_1|\mu(C_1)|C_2|\mu(C_2)}{|C_1|+|C_2|}$ | $D_{euc}(\mu(C_1),
    \mu(C_2))^2$ |


    **Table 12.2:** Centers of combined clusters and distances between clusters for
    geometric hierarchical algorithms, where $\mu(\cdot)$ denotes the center of a
    cluster and $D_{euc}(\cdot,\cdot)$ is the Euclidean distance.


    A hierarchical clustering algorithm is said to be monotonic if at each step we
    have


    > $D(C_1, C_1 \cup C_2) \geq D(C_1, C_2),\quad (12.2)$


    where $C_1$ and $C_2$ are the two clusters to be merged and $C$ is an unmerged
    cluster. The single linkage algorithm and the complete linkage algorithm are monotonic
    (Johnson, 1967). However, other agglomerative hierarchical algorithms might violate
    the monotonic inequality (Milligan, 1979).


    # 12.2 Implementation


    To implement the agglomerative hierarchical algorithms that use the Lance-Williams
    formula, we use the template method design pattern. The UML class design of these
    agglomerative hierarchical algorithms is shown in Figure 12.1. Class $LW$ is an
    abstract class that contains a template method (i.e., `performClustering`) that
    calls several other functions, including the pure virtual function `update_dm`.
    Each class of class $LW$ is a concrete class that provides concrete implementation
    of the function `update_dm.'
