  md: '# # Chapter 14


    # ## $k$-means Algorithm


    The $k$-means algorithm is the most popular and the simplest partial clustering
    algorithm (Jain, 2010). The $k$-means algorithm has many variations (see Section
    1.5). In this chapter, we implement the standard $k$-means algorithm.


    # ### 14.1 Description of the Algorithm


    Let $X = \{\mathbf{x}_0, \mathbf{x}_1, \dots, \mathbf{x}_{n-1}\}$ be a numeric
    dataset containing $n$ records and $k$ be an integer in $\{1, 2, \dots, n\}$.
    The $k$-means algorithm tries to divide the dataset into $k$ clusters $C_0, C_1,
    \dots$, and $C_{k-1}$ by minimizing the following objective function


    ```

    $E = \sum_{i=0}^{k-1} \sum_{\mathbf{x} \in C_i} D(\mathbf{x}, \mu_i), \quad (14.1)$

    ```


    where $D(\cdot,\cdot)$ is a distance measure and $\mu_i$ is the mean of cluster
    $C_i$, i.e.,


    ```

    $$\mu_i = \frac{1}{|C_i|} \sum_{\mathbf{x} \in C_i} \mathbf{x}.$

    ```


    Let $\gamma_i$ be the cluster membership of record $\mathbf{x}_i$ for $i = 0,
    1, \dots, n-1$. That is, $\gamma_i = j$ if $\mathbf{x}_i$ belongs to cluster $C_j$.
    Then Equation (14.1) be rewritten as


    ```

    $E = \sum_{i=0}^{n-1} D(\mathbf{x}_i, \mu_{\gamma_i}). \quad (14.2)$

    ```


    To minimize the objective function, the $k$-means algorithm employs an iterative
    process. At the beginning, the $k$-means algorithm selects $k$ random records
    from the dataset $X$ as cluster centers.

    Suppose $\mu_0^{(0)}, \mu_1^{(0)}, \dots, \mu_{k-1}^{(0)}$ are the initial cluster
    centers. Based on these cluster, the $k$-means algorithm updates the cluster memberships
    $\gamma_0^{(0)}, \gamma_1^{(0)}, \dots, \gamma_{n-1}^{(0)}$ as follows:


    ```

    $$\gamma_i^{(0)} = \text{argmin}_{0 \le j \le k-1} D(\mathbf{x}_i, \mu_j^{(0)}),
    \quad (14.3)$

    ```'
