  md: '# Data Clustering in C++: An Object-Oriented Approach


    The standard k-means algorithm is a center-based clustering algorithm and is also
    one of the most popular and simple clustering algorithms. Although the k-means
    algorithm was first published in 1955 (Jain, 2010), many more than 50 years ago,
    it is still widely used.


    Let $X = \{x_1, x_2, \dots, x_n\}$ be a dataset with $n$ records. The k-means
    algorithm tries to divide the dataset into $k$ disjoint clusters $C_1, C_2, \dots,
    C_k$ by minimizing the objective function


    ```

    $E = \sum_{i=1}^{k} \sum_{x \in C_i} D(x, \mu(C_i)),$

    ```


    Where $D(\cdot, \cdot)$ is a distance function and $\mu(C_i)$ is the center of
    the cluster $C_i$ and is usually defined as


    ```

    $$\mu(C_i) = \frac{1}{|C_i|} \sum_{x \in C_i} x.$

    ```


    The standard k-means algorithm minimizes the objective function using an iterative
    process (Selim and Ismail, 1984; Bobrowski and Bezdek, 1991; Phillips, 2002).


    The standard k-means algorithm has several variations (Gan et al., 2007). For
    example, the continuous k-means algorithm (Faber, 1994), the comparison-means
    algorithm (Phillips, 2002), the sort-means algorithm (Phillips, 2002), the k-means
    algorithm based on kd-tree (Pelleg and Moore, 1999), and the timed k-means algorithm
    (Cuesta-Albertoos et al., 1997) are variations of the standard k-means algorithm.


    Other center-based clustering algorithms include the k-modes algorithm (Huang,
    1998; Chaturverdi et al., 2001), the k-probabilities algorithm (Wishart, 2002),
    the k-prototypes algorithm (Huang, 1998), the x-means algorithm (Pelleg and Moore,
    1999), the k-harmonic means algorithm (Zhang et al., 2001), the mean-shift algorithm
    (Fukunaga and Hotetler, 1975; Cheng, 1995; Comanciu and Meer, 2002), and the maximum-entropy
    clustering (MEC) algorithm (Rose et al., 1990).


    # 1.5.2 Search-Based Clustering Algorithms


    Many clustering algorithms are formulated as optimization problems (Dun, 1974a;
    Ng and Wong, 2002), which are complicated and have many local optimal solutions.
    Most of the clustering algorithms will stop when they find a locally optimal partition
    of the dataset. That is, most of the clustering algorithms may not be able to
    find the globally partition of the dataset. For example, the fuzzy k-means algorithm
    (Selim and Ismail, 1984) is convergent but may stop at a local minimum of the
    optimization problem.


    Search-based clustering algorithms are developed to deal with the problem mentioned
    above. A search-based clustering algorithm aims at finding a'
  merge: -1
  pgno: 38
- img_proc: true
  md: '# Introduction to Data Clustering


    globally optimal partition of a dataset by exploring the solution space of the
    underlying optimization problem. For example, clustering algorithms based on genetic
    algorithms (Holland, 1975) and tabu search (Glover et al., 1993) are search-based
    clustering algorithms.

    Al-Sultan and Fedj (1997) proposed a clustering algorithm based on a tabu search
    technique. Ng and Wong (2002) improved the fuzzy $k$-means algorithm using a tabu
    search. Other search-based clustering algorithms include the $J$-means algorithm
    (Mladenovic and Hansen, 1997), the genetic $k$-means algorithm (Krishna and Narasimha,
    1999), the global $k$-means algorithm (Likas and Verbeek, 2003), the generic $k$-modes
    algorithm (Gan et al., 2005), and the SARS algorithm (Hua et al., 1994).


    # 1.5.3 Graph-Based Clustering Algorithms


    Clustering algorithms based on graphs have also been proposed. A graph is a collection
    of vertices and edges. In graph-based clustering, a vertex represents a data point
    or an edge between a pair of vertices represents the similarity between the two
    records represented by the pair of vertices (Xu and Wunsch, 2009). A cluster usually
    corresponds to a highly connected subgraph (Hartuv and Shamir, 2000).

    Several graph-based clustering algorithms have been proposed and developed. The
    chameleon (Karypis et al., 1999) is a graph-based clustering algorithm that uses
    a sparse graph to represent a dataset. The CACTUS algorithm (Ganti et al., 1999)
    is another graph-based clustering algorithm that uses a graph, called the similarity
    graph, to represent the inter-attribute and intra-attribute summaries. The ROCK
    algorithm (Guha et al., 2000) is an agglomerative hierarchical clustering algorithm
    that uses a graph connectivity to calculate the similarities between data points.

    Gib et al. (2000) proposed a clustering algorithm based on hypergraphs and dynamical
    systems. Foggia et al. (2007) proposed a graph-based clustering algorithm that
    is able to find clusters of any size and shape and does not require specifying
    the number of clusters. Foggia et al. (2009) compared the performance of several
    graph-based clustering algorithms.

    Most of the graph-based algorithms mentioned above use data structures and do
    not use graph analysis. Spectral clustering algorithms, which are also graph-based
    clustering algorithms, first construct a similarity graph and then use Laplacian
    matrices and standard linear algebra methods to divide a dataset into a number
    of clusters. Luxburg (2007) presented a tutorial on spectral clustering. Filippo
    et al. (2008) also presented a survey of spectral clustering. Interested readers
    are referred to these two papers and the book by Ding and Zha (2010).'
