  md: 'However, as a divisive hierarchical clustering algorithm, DIANA is not the
    exact counterpart of an agglomerative hierarchical clustering algorithm.


    # 13.4 Summary


    In this chapter, we introduced the implementation of a divisive hierarchical clustering
    algorithm called DIANA. Examples to illustrate the DIANA algorithm were also presented.


    The DIANA algorithm was based on the idea presented in Macnaughton-Smith et al.
    (1964). However, the original idea of Macnaughton-Smith et al. (1964) is to split
    all available clusters. Kaufman and Rousseeuw (1990) modified this original method
    by defining the diameter for a cluster and first splitting the cluster with the
    largest diameter. The modified method proposed by Kaufman and Rousseeuw (1990)
    produces a monotonic hierarchical clustering. One drawback of this modified method
    is that it is sensitive to outliers.'
