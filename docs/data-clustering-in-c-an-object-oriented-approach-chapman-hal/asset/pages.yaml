  md: '# Chapter 5


    # C++ Libraries and Tools


    In this chapter, we introduce some useful C++ libraries and tools. First, we introduce
    the C++ standard template library (STL). Then we introduce some of the Boost C++
    libraries. Finally, we introduce the GNU build system and the Cygwin software.


    # 5.1 The Standard Template Library


    The C++ Standard Template Library (STL) is a collection of template-based components
    that implement many common data structures and algorithms used to process those
    data structures. Alexander Stepanov and Meng Lee developed the STL at Hewlett-Packard
    based on their research in the field of generic programming, with significant
    contributions from David Muller (Deitel and Deitel, 2009).


    STL consists of three key components: containers, iterators, and algorithms. Containers
    are data structures capable of storing objects of almost any data type. Iterators
    are similar to pointers and are used by programs to manipulate the elements in
    containers. Algorithms are functions that perform common data manipulations such
    as searching, sorting, and comparing elements.


    # 5.1.1 Containers


    STL can be further classified into three categories: sequence containers, associative
    containers and container adapters (Deitel and Deitel, 2009). Table 5.1 gives a
    list of STL containers grouped into the three categories.


    Sequence containers implement linear data structures, such as vectors. Associative
    containers implement nonlinear data structures that typically can locate elements
    stored in the containers quickly. Stacks and queues are constrained versions of
    sequential containers and are implemented as container adapters that enable a
    program to view a sequential container in a constrained manner.'
