    \ objects. A smart pointer is similar to a C++ built-in pointer except the smart\
    \ pointer automatically deletes the object pointed to at the appropriate time.\n\
    \nSmart pointers are very useful as they ensure proper destruction of dynamically\
    \ allocated objects, even in the event of an exception. In, smart pointers are\
    \ seen as owning the object pointed to, and thus responsible for deleting the\
    \ object when it is no longer needed.\n\nThe Boost smart pointer library provides\
    \ six smart pointer templates. Table 5.10 gives the descriptions of these class\
    \ templates. We use shared_ptr extensively in the clustering library developed\
    \ in this book.\n\n| Class | Description |\n| --- | --- |\n| scoped_ptr | Simple\
    \ ownership of single objects. Noncopyable. |\n| scopedarray | Simple ownership\
    \ of arrays. Noncopyable. |\n| shared_ptr | Object ownership shared among multiple\
    \ pointers. |\n| shared_array | Array ownership shared among multiple pointers.\
    \ |\n| weak_ptr | Non-owning observers of an object owned by an embedded reference\
    \ count. |\n| intrusive_ptr | Shared ownership of objects with |\n\n> TABLE 5.10:\
    \ A program that illustrates shared_ptr.\n\n```\n// shared_ptr.cpp\n#include<iostream>\n\
    #include<boost/shared_ptr.hpp>\n\nusing namespace std;\nusing namespace boost;\n\
    \nclass A {\npublic:\n    A() {\n        cout<<\"A'constructor_is_called\"<<endl;\n\
