    # 14.4 Summary


    In this chapter, we introduced the standard $k$-means algorithm and its implementation.
    We also applied the $k$-means algorithm to a synthetic dataset and the Iris dataset
    with different parameters. Our experiments show that the $k$-means algorithm is
    sensitive to initial cluster centers and may terminate at local optimum solutions.


    As the most popular and the simplest partitional clustering algorithm, the $k$-means
    algorithm has a long history. In fact, the algorithm was independently discovered
    by several people from different scientific fields (Jain, 2010). Since then many
    variations of the $k$-means algorithm have been proposed. For more information
    about the $k$-means algorithm and its variations, readers are referred to Gan
    et al. (2007) and references therein.'
