  md: '# 3.6 Exception Handling


    An exception is a problem that occurs during the execution of a program. For example,
    an attempt to divide by zero is an exception. Dereferencing a null pointer is
    another example of an exception. Exception programming language feature that is
    designed to handle exceptions. Exception handling is very useful in that it allows
    programmers to create applications that can handle exceptions. In most cases,
    if an exception is encountered and handled, a program can continue normal execution
    if no problem had occurred. Even if a program cannot continue normal execution
    when an exception allows the program to notify the user of the problem and terminate
    in a controlled manner.


    C++ is a programming language that supports exception handling. In C++, the header
    file <exception> defines the base class exception for all standard exceptions
    and the header file <stdexcept> defines several other exceptions derived from
    exception. Figure 3.1 shows the hierarchy of the C++ standard library exception
    classes.


    ![](img/42581d0418a3878bb54bd52fb20c73c2_74_0.png)


    FIGURE 3.1: Hierarchy of C++ standard library exception classes.'
