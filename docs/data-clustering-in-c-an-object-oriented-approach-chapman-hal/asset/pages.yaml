  md: '# # Chapter 18


    # ## The FSC Algorithm


    In fuzzy clustering algorithms such as the c-means algorithm, each record has
    a fuzzy membership associated with each cluster that indicates the degree of association
    of the record to the cluster. In the fuzzy subspace clustering (FSC) algorithm,
    each attribute has a fuzzy membership associated with each cluster that indicates
    the degree of importance of the attribute to the cluster. In this chapter, we
    implement the FSC algorithm (Gan, 2007; Gan et al., 2007).


    # ### 18.1 Description of the Algorithm


    The FSC algorithm is an extension of the k-means algorithm for subspace clustering.
    The FSC algorithm imposes weights on the distance of the k-means algorithm. Given
    a dataset $X = \{x_0, x_1, \dots, x_{n-1}\}$ consisting of $n$ records, each is
    described by $d$ numeric attribute. Recall that the objective function of the
    k-means algorithms is


    ```

    $E = \sum_{j=0}^{k-1} \sum_{x=0}^{c_j} D_{uc}(\mathbf{x}, \mu_j)^2 = \sum_{j=0}^{k-1}
    \sum_{r=0}^{d-1} (x_r - \mu_{jr})^2$

    ```


    where $C_0, C_1, \dots, C_{k-1}$ are $k$ clusters, $(0 \leq j \leq k-1)$ is the
    center of cluster $C_j$, $D_{uc}(\cdot, \cdot)$ is the Euclidean distance, and
    $x_r$ and $\mu_{jr}$ are the $r$th components of $\mathbf{x}$ and $\mu_{jr}$,
    respectively.


    The objective function of the FSC algorithm is defined as


    ```

    $E_{\alpha, \epsilon} = \sum_{j=0}^{k-1} \sum_{r=0}^{c_j} w_{jr}^\alpha (x_r -
    \mu_{jr})^2 + \epsilon \sum_{j=0}^{k-1} \sum_{r=0}^{d-1} w_{jr}$,   (18.1)

    ```


    where $\alpha \in (1, \infty)$ is a weight component or fuzzifier, $\epsilon$
    is a very small real number used to prevent divide-by-zero error, and $w_{jr}$
    $(0 \leq j \leq k-1, 0 \leq r \leq d-1)$ is the $(j, r)$ entry of the so fuzzy
    dimension weight matrix $W$. A $k \times d$ weight matrix $W$ satisfies the following
    conditions:


    ```

    $w_{jr} \in [0, 1], \quad 0 \leq j \leq k-1, \quad 0 \leq r \leq d-1$,   (18.2a)

    ```'
