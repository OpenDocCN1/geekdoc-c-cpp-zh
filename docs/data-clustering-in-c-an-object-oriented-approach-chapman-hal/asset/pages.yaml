    # 11.3.3 A Dataset Normalizer


    In this subsection, we introduce a dataset normalizer class, which is used to
    standardize numeric datasets or the numeric part of mixed-type datasets. The dataset
    normalizer class implements a very simple data standardization method. Let $X
    = \{x_1, x_2, \dots, x_n\}$ be a dataset containing $n$ records, each of which
    is described by $d$ attributes. Then each numeric attribute $j$ of $X$ will be
    normalized to range $[0, 1]$ according to the following formula:


    ```

    $x''_{ij} = \frac{x_{ij} - R_{min}(j)}{R_{max}(j) - R_{min}(j)}, \quad i = 1,
    2, \dots, n,$

    ```


    $R_{min}(j)$ and $R_{max}(j)$ are the minimum and maximum values of the $j$th
    attribute, respectively, and $x_{ij}$ is the $j$th component of $\mathbf{x}_i$.

    The declaration of the dataset normalizer class is shown in Listing 11.14.

