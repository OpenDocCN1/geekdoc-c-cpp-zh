  md: '# Chapter 17


    # The Genetic $k$-modes Algorithm


    The $k$-modes algorithm is a center-based clustering algorithm designed to cluster
    categorical datasets (Huang, 1998; Chaturvedi et al., 2001). In the $k$-modes
    algorithm, centers of clusters are referred to as modes. One drawback of the $k$-modes
    algorithm is that the algorithm can guarantee only a locally optimal solution.
    The genetic $k$-modes algorithm (Gan et al., 2005) was developed to improve the
    $k$-modes algorithm by integrating the $k$-modes algorithm with the genetic algorithm
    (Holland, 1975). Although the genetic $k$-modes algorithm cannot guarantee a globally
    optimal solution, the genetic $k$-modes algorithm is more likely to find a globally
    optimal solution than the $k$-modes algorithm. In this chapter, we implement the
    genetic $k$-modes algorithm and illustrate the algorithm with examples.


    # ## 17.1 Description of the Genetic Algorithm


    Before we introduce the genetic $k$-modes algorithm, let us first give a brief
    introduction to the genetic algorithm, which was originally introduced by Holland
    (1975). In genetic algorithms, solutions (i.e., parameters) of a problem are encoded
    in chromosomes and a population is composed of many solutions. Each solution is
    associated with a fitness value.


    A genetic algorithm evolves over generations. During each generation, three genetic
    operators (natural selection, crossover, and mutation) are applied to the current
    population to produce a new population. The natural selection operator selects
    a few chromosomes from the current population based on the principle of survival
    of the fittest. The selected chromosomes are modified by the crossover operator
    and the mutation operator before being put into the new population.


    The genetic $k$-modes algorithm was developed based on the genetic $k$-means algorithm
    (Krishna and Narasimha, 1999). The genetic $k$-modes algorithm has five elements:
    coding, initialization, selection, mutation, and $k$-modes operator. In the genetic
    $k$-modes algorithm, the crossover operator is replaced by the $k$-modes operator.


    In the $k$-modes algorithm, a solution (i.e., a partition) is coded as a vector'
  merge: -1
  pgno: 275
- img_proc: true
  md: '# Data Clustering in C++: An Object-Oriented Approach


    of cluster memberships. Let $X = \{\mathbf{x}_0, \mathbf{x}_1, \dots, \mathbf{x}_{n-1}\}$
    be a dataset consisting of $n$ records and $C_0, C_1, \dots, C_{k-1}$ be a partition
    of $X$. The vector of cluster memberships corresponding to the partition is defined
    as


    > $\gamma_i = j \quad \text{if} \quad \mathbf{x}_i \in C_j$


    for $i = 0, 1, \dots, n-1$ and $j = 0, 1, \dots, k-1$. A chromosome is said to
    be legal if each of the cluster represented by $\Gamma = (\gamma_0, \gamma_1,
    \dots, \gamma_{n-1})$ is defined as


    > $L(\Gamma) = \sum_{i=0}^{n-1} D_{sim}(\mathbf{x}_i, \mu_{\gamma_i}), \quad (17.1)


    where $\mu_j$ ($0 \le j \le k-1$) is the center of cluster $C_j$, and $D_{sim}(\cdot,\cdot)$
    is the simple matching distance (see Section 9.4). The fitness value for the solution
    is defined as


    > $F(\Gamma) = \begin{cases} cL_{max}-L(\Gamma) & \Gamma \text{ is legal,} \ e(F_{min})
    & \text{otherwise,} \end{cases} \quad (17.2)


    where $L(\Gamma)$ is defined in Equation (17.1), $c \in (0, 3)$ is a constant,
    $L_{max}$ is the maximum number of chromosomes in the current population, $F_{min}$
    is the smallest fitness value of the legal chromosomes in the current population
    if legal chromosomes exist or 1 otherwise, and $e(F)$ is the legality ratio defined
    by the ratio of the number of nonclusters over $k$.


    The selection operator randomly selects a chromosome from the current population
    according to the following distribution:


    > $P(\Gamma_i) = \frac{F(\Gamma_i)}{\sum_{r=0}^{N-1} F(\Gamma_r)}$


    where $N$ is the number of chromosomes in the current population and $F(\cdot)$
    is defined in Equation (17.2). Hence chromosomes with higher fitness values are
    more likely to be selected. The selection operator is applied $N$ times in order
    to select the new population.


    The mutation operator replaces the cluster $\ $\gamma_i$ of a chromosome $\Gamma
    = (\gamma_0, \gamma_1, \dots, \gamma_{n-1})$ with a cluster index randomly selected
    from $\{0, 1, \dots, k-1\}$, according to the following distribution:


    > $P(j) = \frac{c_m d_{max}(\mathbf{x}_i) - D_{sim}(\mathbf{x}_i, \mu_j)}{\sum_{l=0}^{k-1}
    [c_m d_{max}(\mathbf{x}_i) - D_{sim}(\mathbf{x}_i, \mu_l)]} \quad (17.3)


    where $c_m > 1$ is a constant


    > $d_{max}(\mathbf{x}_i) = \max_{0 \le l \le k-1} D_{sim}(\mathbf{x}_i, \mu_l),
    \quad i = 0, 1, \dots, n-1$.


    In the genetic algorithm, mutation occurs with some mutation probability'
  merge: -1
