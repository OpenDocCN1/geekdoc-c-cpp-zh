    # 11.7 Summary


    In this section, we introduced several utility classes. These classes give us
    very good examples of static polymorphism and dynamic polymorphism supported by
    the C++ programming language. The container class and the double-key map class
    are template classes, which can be used for many types of data. The data adapter
    classes and the node visitor classes are examples of dynamic polymorphism, which
    is achieved by using virtual functions.


    Unlike the machine learning C++ library MLC++, which uses many utility classes
    developed for the library, the clustering library ClusLib uses only a few utility
    classes described in this chapter ClusLib uses many classes from the Boost libraries.
    Without the Boost libraries, we would have to develop smart pointer classes, heterogeneous
    container classes, and matrix classes, to name just a few.'
