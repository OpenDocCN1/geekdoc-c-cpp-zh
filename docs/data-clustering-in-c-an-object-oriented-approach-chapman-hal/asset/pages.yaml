    In OO programming, a class defines the attributes and behaviors common to a type
    of object and an object is an instance of a class. Attributes of a class are visible
    characteristics of the class. For example, name and address of a person are attributes
    of some classes. A behavior of a class is an action taken by an object of the
    class when passed a message or in response to a state change. Some common behaviors
    of a class are constructors, accessors, and mutators. Constructors of a class
    are methods used to initialize objects of the class during their instantiation
    or creation. Accessors of a class are methods that allow one to access an object''s
    internal data. Mutators are methods that allow one to change an object''s internal
    state.


    An OO program has the following five characteristics (Sintes, 2001):


    +   (a) OO programming enables one to model a problem at a functional level rather
    than at the implementation level.


    +   (b) OO programs that are well-designed and carefully written are reliable.
    In addition, the modular nature of objects allows one to make changes to one part
    of the program without affecting other parts.


    +   (c) Reusable. Objects can be reused in many different programs and can be
    extended.


    +   (d) Maintainable. Well-designed OO programs are maintainable. For example,
    one needs to correct only one place in order to fix a bug.


    +   (e) Extendable. The features of OO programming, such as inheritance and polymorphism,
    allow one to extend the existing code easily.


