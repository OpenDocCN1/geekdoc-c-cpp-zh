    # 4.2 Composite


    The composite pattern is a design pattern used to compose objects into a tree
    structure to represent a part-whole hierarchy, which allows clients to treat individual
    objects and their containers in a uniform way. For example, the files and folders
    on a disk form a file-folder hierarchy. The solution of the composite pattern
    is to make an abstract base class that represents both components and their containers.
    Table 4.3 shows the four elements of the composite pattern.


    | Element | Description |

    | --- | --- |

    | Pattern Name | Composite |

    | Problem | Composite objects into a tree structure so that individual objects
    and compositions of objects can be treated uniformly |

    | Solution | Design an abstract class that represents both components and and
    their containers |

    | Consequences | Easy to add new kinds of components Makes the design overly general
    |


    TABLE 4.3: The composite pattern.


    The UML class diagram of the composite pattern is shown in Figure 4.2. The component
    class is an abstract base class for the leaf class and the composite class. A
    leaf class is used to hold an individual object. A composite class is used to
    hold a set of components, each of which can be an individual object or a composite.
    The UML class diagram in Figure 4.2 shows the basic structure of the composite
    pattern.


    Now let us consider the file-folder example. The C++ code of the example'
