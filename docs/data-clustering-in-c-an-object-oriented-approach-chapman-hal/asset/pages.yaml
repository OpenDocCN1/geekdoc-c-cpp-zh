    # 8.4 Summary


    In this chapter, we introduced the design and implementation of clusters, partitional
    clusterings, and hierarchical clusterings. In particular, we introduced the implementation
    of one-center clusters and subspace clusters. We would also implement fuzzy clusters.
    However, fuzzy clusters might not contain all the records in a dataset with different
