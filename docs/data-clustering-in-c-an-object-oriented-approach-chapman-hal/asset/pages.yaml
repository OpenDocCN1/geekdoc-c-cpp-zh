  md: '# Agglomerative Hierarchical Algorithms


    # 12.3 Examples


    In this section, we present some examples of applying the agglomerative hierarchical
    clustering algorithms implemented in the previous section. The main program is
    shown in Listing B.108.


    The program uses the Boost program options to parse line arguments. The code in
    lines 16–57 deals with command line options. The code in lines 59–63 reads a dataset
    from the input file and prints the summary of the dataset to screen. The code
    in lines 65–83 creates an object of the Euclidean distance and an object of the
    clustering algorithm selected by users. The default algorithm is single linkage
    if users do not provide an option for clustering algorithms.


    The code in lines 85–87 transfers the dataset and the distance into the clustering
    algorithm. The code in lines 89–93 does the clustering and measures the time used
    by the clustering algorithm. The code in lines 95–120 outputs results. The dendrogram,
    join values, and the summary of the partition created from the hierarchical clustering
    are saved to files.


    The program is compiled as part of the clustering library when we issue the make
    command in the top folder of the clustering library (e.g., in the ClusLib). The
    Makefile .am file for this program is shown in Listing B.107. Before compiling
    the clustering library, we need to specify the location of the Boost program options
    by setting the LDFLFLAGS.


    When we execute the program without arguments or with the argument --help, we
    see the help message:


    Allowed options:


    ```

    --help                    produce help message

    --method arg (=single) method (single, complete, gaverage, wgaage,

    centroid, median, ward)

    --datafile arg the data file

    maximum number of nodes to show in dendrogram

    --p arg (=50) maximum number of clusters

    --maxclust arg (=3) maximum number of clusters

    ```


    The command line options allow us to set the algorithm, the data file, the maximum
    number of nodes to show in the dendrogram, and the maximum number of clusters
    to extract from the hierarchical clustering tree. Except for the data file, all
    options have default values. For example, the maximum number of nodes to show
    in a dendrogram is 50.


    In the following subsections, we test these agglomerative hierarchical clustering
    algorithms using two datasets. The first dataset is a two-dimensional dataset
    consisting of 600 records (see Figure 1.1) and is generated by the dataset generator
    program (see Section 11.3). For convenience, we call the first dataset the synthetic
    dataset. The second dataset is the Iris dataset, which is a four-dimensional dataset
    consisting of 150 records.'
