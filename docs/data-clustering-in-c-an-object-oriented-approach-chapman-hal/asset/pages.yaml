    # 4.3 Prototype


    The prototype pattern is a creational pattern that is used when creating an object
    of a class is very time-consuming or complex in some way. If we want to replicate
    an object, we need to consider whether a shallow copy (i.e., member-wise copy)
    is good enough or not. The object contains references or pointers to other objects,
    we need to conduct a deep copy in order to get a true copy of the object. In a
    deep copy, all objects referenced or pointed to are also copied. The prototype
    pattern is applicable when we want a deep copy or clone of an object. In such
    case, the new method provided by C++ is not good enough unless we member-wise
    copy.


    The solution of the prototype pattern is to declare an abstract base class that
    specifies a pure clone method and let the derived classes override this clone
    method by implementing an operation to clone itself. Then clients can create a
    new object by asking a prototype to clone itself. Table 4.4 shows the four elements
    of the prototype pattern.


    | Element | Description |

    | --- | --- |

    | Pattern Name | Prototype |

    | Problem | Need to duplicate an object for some reason creating the object by
    new is not appropriate. |

    | Solution | Design an abstract base class that specifies a pure virtual clone
    method |

    | Consequences | Configure an application with classes dynamically Each subclass
    must implement the clone method |


    TABLE 4.4: The prototype pattern.


    The UML class diagram in Figure 4.3 shows a simple structure of the prototype
    pattern. Class Prototype is an abstract class with a public member called clone,
    which is a pure virtual function that returns a pointer pointing to it. Another
    two are derived from the base class and override the clone method. We note that
    the clone method in class ConcreteA returns a pointer to ConcreteA instead of
    Prototype. The clone method in class ConcreteB does similarly. In C++, this is
    covariant return types.


    The C++ program showing in Listing 4.3 illustrates the idea of the prototype pattern.
    The program defines an abstract class named Shape consisting of a virtual destructor
    and two pure virtual functions: the draw method and the clone method (lines 7–12).
    The virtual destructor of class Shape is necessary since class Shape is designed
    to be used as a base class.'
