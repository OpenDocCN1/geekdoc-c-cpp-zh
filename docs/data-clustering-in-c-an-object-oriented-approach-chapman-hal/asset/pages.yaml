  md: "# # Chapter 19\n\n# ## The Gaussian Mixture Algorithm\n\nClustering based on\
    \ Gaussian mixture models is a classical and powerful approach. Celeux and Govaert\
    \ (1995) summarized sixteen Gaussian mixture models which result in sixteen clustering\
    \ algorithms. These sixteen Gaussian mixture models are based on different assumptions\
    \ on the component variance matrices. Four commonly used Gaussian mixture models\
    \ are (Celeux and Govaert, 1995):\n\n+   (a) No restriction is imposed on the\
    \ component variance matrices $\\Sigma_0, \\Sigma_1, \\cdots$, and $\\Sigma_{k-1}$;\n\
    \n+   (b) $\\Sigma_0 = \\Sigma_1 = \\cdots = \\Sigma_{k-1} = \\Sigma$;\n\n+  \
    \ (c) $\\Sigma_0 = \\Sigma_1 = \\cdots = \\Sigma_{k-1} = \text{Diag}(\\sigma_0^2,\
    \ \\sigma_1^2, \\cdots, \\sigma_{d-1}^2)$, where $\\sigma_0, \\sigma_1, \\cdots,\
    \ \\sigma_{d-1}$ are unknown;\n\n+   (d) $\\Sigma_0 = \\Sigma_1 = \\cdots = \t\
    ext{Diag}(\\sigma^2, \\sigma^2, \\cdots, \\sigma^2)$, where $\\sigma$ is unknown.\n\
    \nIn this chapter, we implement the clustering algorithm based on the Gaussian\
    \ mixture model, i.e., the most general one.\n\n# ## 19.1 Description of the Algorithm\n\
    \nLet $X = \\{x_0, x_1, \\cdots, x_{n-1}\\}$ be a numeric dataset containing $n$\
    \ records, each of which is described by $d$ numeric attributes. In Gaussian mixture\
    \ models, each record in the dataset $X$ is assumed to be a sample drawn from\
    \ a distribution characterized by the following probability density function (Celeux\
    \ and Govaert, 1995):\n\n```\n$f(\\mathbf{x}) = \\sum_{j=0}^{k-1} p_j \\Phi(\\\
    mathbf{x}|\\mu_j, \\Sigma_j), \\quad (19.1)$\n```\n\nwhere $\boldsymbol{\\mu}_j$\
    \ is the mean of the $jth$ component, $\\Sigma_j$ is the variance of the $jth$\
    \ component, $p_j$ is the mixing proportion of the $jth$ component, and $\\Phi$\
    \ is the probability density function of the multivariate Gaussian distribution.\n\
    \nThe mixing proportions $p_0, p_1, \\cdots, p_{k-1}$ in Equation (19.1) satisfy\
    \ the following conditions:"
  merge: -1
  pgno: 301
- img_proc: true
  md: "# Data Clustering in C++: An Object-Oriented Approach\n\n+   a) $p_j \\in (0,1)$\
    \ for $j = 0, 1, \\dots, k-1$;\n\n+   b) The sum of the mixing proportions is\
    \ equal to 1, i.e.,\n\n```\n$sum_{j=0}^{k-1} p_j = 1$.\n```\n\nThe probability\
    \ density function of the multivariate Gaussian distribution is defined as\n\n\
    ```\n$\\Phi(\\mathbf{x}, \\Sigma) = \\frac{1}{\\sqrt{(2\\pi)^{|\\Sigma|}}} \\\
    exp\\left(-\\frac{1}{2}(\\mathbf{x}-\\boldsymbol{\\mu})^T\\Sigma^{-1}(\\mathbf{x}-\\\
    boldsymbol{\\mu})\\right), \\quad (19.2)$\n```\n\nwhere $\boldsymbol{\\mu}$ is\
    \ the mean, $\\Sigma$ is the variance matrix, and $|\\Sigma|$ is the determinant\
    \ of $\\Sigma$. We assume that $\\mathbf{x}$ and $\boldsymbol{\\mu}$ are column\
    \ vectors.\n\nThere are two approaches to cluster a dataset based on the Gaussian\
    \ mixture model (Celeux and Goaert, 1995): the mixture approach and the classification\
    \ approach. In the mixture approach, the likelihood is maximized over the mixture\
    \ parameters. In the classification approach, the likelihood is maximized over\
    \ the mixture parameters as well as over the identifying labels of the mixture\
    \ component for each record.\n\nIn this chapter, we implement the Gaussian mixture\
    \ model-based clustering algorithm based on the first approach, i.e., the mixture\
    \ approach. In this approach, the parameters need to be estimated\n\n```\n$\\\
