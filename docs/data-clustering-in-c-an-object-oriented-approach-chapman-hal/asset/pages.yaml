    # 1.4 Hierarchical Clustering Algorithms


    A hierarchical clustering algorithm is a clustering algorithm that divides a dataset
    into a sequence of nested partitions. Hierarchical clustering algorithms can be
    further classified into two categories: agglomerative hierarchical clustering
    algorithms and divisive hierarchical clustering algorithms.


    An agglomerative hierarchical algorithm starts with every single record as a cluster
    and repeats merging the closest pair of clusters according to some similarity
    criteria until only one cluster is left. For example, Figure 1.3 shows an agglomerative
    clustering of a dataset with 5 records.


    In contrast to agglomerative clustering algorithms, a divisive clustering algorithm
    starts with all records in a single cluster and then repeats splitting large clusters
    into smaller ones until every cluster contains only a single record. Figure 1.4
    shows an example of divisive clustering of a dataset with 5 records.'
