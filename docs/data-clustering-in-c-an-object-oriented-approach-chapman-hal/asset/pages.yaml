    # Exercises and Projects


    **Exercise A.1.** In class Dataset, we overloaded the operator “<<” (see Listing-7.7).
    Using class Dataset as an example, overload operator “<<” for class AttrValue
    and class Record so that the values are stored in objects of classes AttrValue
    and class Record can be outputted using streams. Use commas to separate the base
    arguments in a record.


    **Exercise A.2.** In the implementation of the overloaded operator “()” of class
    MinkowskiDistance (cf. Section 9.2) and class SimpleMatchingDistance (cf. Section
    9.4), we added code to check whether the schemata of two records are equal to
    each other. Implement a function in the base class Distance to do the check so
    that we can call the function rather than rewrite this piece of code many times.
    This function should be a protected member function of class Distance and has
    the same arguments as the operator “()”.


    **Exercise A.3.** The Manhattan distance and the maximum distance are defined
    in Equation (1.3) and Equation (1.4), respectively. Implement the two distance
    measures in class ManhattanDistance and class MaximumDistance that are derived
    from the base class.


