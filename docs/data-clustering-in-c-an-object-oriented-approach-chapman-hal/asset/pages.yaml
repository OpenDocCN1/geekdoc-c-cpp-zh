    # 1.4.4 Dendrograms


    Results of a hierarchical clustering algorithm are usually visualized by dendrograms.
    A dendrogram is a tree in which each internal node is associated with a height.
    The heights in a dendrogram satisfy the following ultrametric conditions (Johnson,
    1967):


    ```

    $h_{ij} \leq \max\{h_{ik}, h_{jk}\}\quad \forall i, j, k \in {1, 2, \dots, n\}$

    ```


    $n$ is the number of records in a dataset and $h_{ij}$ is the height of the internal
    node corresponding to the smallest cluster to which both record $i$ and record
    $j$ belong.


    Figure 1.5 shows a dendrogram of the famous Iris dataset (Fisher, 1936). This
    dendrogram was created by the single linkage algorithm with the Euclidean distance.
    From the dendrogram we see that the single linkage algorithm produces two natural
    clusters for the Iris dataset.


    More information about dendrograms can be found in Gordon (1996), Gordon (1987),
    Sibson (1973), Jardine et al. (1967), Baufield (1976), van Rijbergen (1970), Rohlf
    (1974), and Gower and Ross (1969). Gordon (1987) discussed the ultrametric conditions
    for dendrograms. Sibson (1973) presented a mathematical representation of a dendrogram.
    Rohlf (1974) and Gower and Ross (1969) discussed algorithms for plotting dendrograms.


