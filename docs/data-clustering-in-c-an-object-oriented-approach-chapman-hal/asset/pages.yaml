  md: '# Data Clustering in C++: An Object-Oriented Approach


    after step 2 and before step 3, we have a set of clusters $\mathcal{F}_2 = \mathcal{F}_1
    \cup \{C_{n+1}\}$. The algorithm continues until step $n-1$ when the last clusters
    are merged to form the cluster $C_{n-2}$. After step $n-1$, we have $\mathcal{F}_{n-1}
    = \{C_{n-2}\}$, which contains only one cluster. The algorithm stops after step
    $n-1$.


    In the above process, we have $|\mathcal{F}_0| = n, |\mathcal{F}_1| = n-1, \dots$,
    and $|\mathcal{F}_{n-1}| = 1$, where $|\cdot|$ denotes the number of elements
    in the set. At each step, the algorithm merges two clusters to merge, we need
    to calculate the distances between clusters. Lance and Williams (1967a) proposed
    a recurrence formula to compute the distance between an old cluster and a new
    cluster formed by two old clusters.


    The Lance-Williams formula is defined as follows. Before step $i$ ($1 \le i \le
    n-1$), we have a set of clusters $\mathcal{F}_{i-1}$, which contains $n-i+1$ clusters.
    Suppose $C_{ij}$ and $C_{ij}$ have the smallest distance among all the pairs of
    clusters in $\mathcal{F}_{i-1}$. Then $C_{ij}$ and $C_{ij}$ are merged to form
    the cluster $C_{n+i-1}$. The Lance-Williams formula computes the distance between
    an old cluster $C \in \mathcal{F}_{i-1} \setminus \{C_{ij}, C_{ik}\}$ as


    ```

    $D(C, C_{ij} \cup C_{ik}) = \alpha_{ij} D(C, C_{ij}) + \alpha_{ik} D(C, C_{ik})
    + \beta D(C_{ij}, C_{ik}) \n + \gamma |D(C, C_{ij}) - D(C, C_{ik})|, \quad (12.1)$

    ```


    where $\alpha_{ij}, \alpha_{ik}, \beta$, and $\gamma$ are parameters. DuBien and
    Ward (1979) investigated some properties of the Lance-Williams formula.


    | | $\alpha_{ij}$ | $\alpha_{ik}$ | $\beta$ | $\gamma$ |

    |---|---|---|---||

    | Single linkage | $1/2$ | $1/2$ | 0 | $-1/2$ |

    | Complete linkage | $1/2$ | $1/2$ | 0 | $1/2$ |

    | Group average | $\frac{|C_{ij}|}{|C_{ij}|+|C_{ik}|}$ | $\frac{|C_{ik}|}{|C_{ij}|+|C_{ik}|}$
    | 0 | 0 |

    | Weighted group average | $1/2$ | $1/2$ | 0 | 0 |

    | Centroid | $\frac{|C_{ij}|}{|C_{ij}|+|C_{ik}|}$ | $\frac{|C_{ik}|}{|C_{ij}|+|C_{ik}|}$
    | $-\frac{|C_{ij}| \cdot |C_{ik}|}{(|C_{ij}|+|C_{ik}|)^2}$ | 0 |

    | Median | $1/2$ | $1/2$ | 0 | $-1/4$ |

    | Ward''s method | $\frac{|C_{ij}|}{\Sigma}$ | $\frac{|C_{ik}|}{\Sigma}$ | $-\frac{|C|}{\Sigma}$
    | 0 |


    **TABLE 12.1:** Parameters for the Lance-Williams formula, where $\Sigma = |C|
    + |C_{ij}| + |C_{ik}|$.


    Table 12.1 gives seven sets of parameters for the Lance-Williams formula defined
    in Equation (12.1). Each set of parameters results in an agglomerative hierarchical
    clustering algorithm. A more general recurrence formula was'
