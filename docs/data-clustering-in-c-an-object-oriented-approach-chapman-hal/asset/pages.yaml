    The UML notation for the label <include> relationship is a dashed arrow with an
    open head and the label “<include>” in the middle of the arrow as shown in Figure
    2.13. The tail of the arrow is located at the including use case and the head
    is located at the included use case. The <include> relationship indicates that
    the included use case is required for the completion of the including use case.
    That is, the included use case must be executed when the including use case is
    executed. In Figure 2.13, for example, Use case B must be executed when Use case
    A is executed because Use case A Includes case B.


    The UML notation for the <extend> relationship is the same as that for the <include>
    relationship except that the label in the middle of the arrow is “<extend>”. The
    <extend> relationship indicates that the extending case is optional to the included
    use case.


    Maksimchuk and Naibug (2005) summarized the following key differences of the <include>
    relationship and the <extend> relationship:


    +   (a) The extending use case is optional, the included use case is not;

    (b) The base use case (i.e., the included or extending use case) is complete without
    the extending use case, but is not without the included use case;

    (c) The execution of the extending use case is conditional, but that of the included
    use case is not;

    (d) The extending use case changes the behavior of the base use case, but the
    included use case does not.


    The UML notation for the generalization relationship is a solid line ending in
    a hollow triangle drawn from the generalized use case to the more general use
    case as shown in Figure 2.13.


