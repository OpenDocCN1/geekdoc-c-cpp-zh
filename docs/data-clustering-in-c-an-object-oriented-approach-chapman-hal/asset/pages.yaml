  md: 'Chapter 18. The FSC Algorithm. This chapter introduces the fuzzy subspace clustering
    (FSC) algorithm and its implementation. The algorithm is illustrated by a synthetic
    dataset and the Iris dataset.


    Chapter 19. The Gaussian Mixture Model Clustering Algorithm. This chapter introduces
