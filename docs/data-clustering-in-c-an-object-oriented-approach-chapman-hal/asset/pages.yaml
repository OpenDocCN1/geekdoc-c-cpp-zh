    # 1.5.7 Subspace Clustering Algorithms


    Almost conventional clustering algorithms do not work well for high dimensional
    datasets due to the following two problems associated with high dimensional data.
    First, the distance between any two data points in a high dimensional space becomes
    almost the same (Beyer et al., 1999). Second, clustering of high dimensional data
    are embedded in the subspaces of the data space and different clusters may exist
    in different subspaces (Agrawal et al., 1998). Subspace clustering algorithms
    are algorithms that are capable of finding clusters embedded in subspaces of the
    original data space.


    Most subspace clustering algorithms can be classified into two major categories
    (Parsons et al., 2004): top-down algorithms and bottom-up algorithms. In top-down
    subspace clustering, a conventional clustering is performed and then the subspace
    of each cluster is evaluated. In bottom-up subspace clustering, regions in low
    dimensional spaces are identified and then these regions are formed to clusters.


    Examples of top-down subspace clustering algorithms include PART (Cao and Wu,
    2002), PROCLUS (Aggarwal et al., 1999), ORCLUS (Aggarwal and Yu, 2000), and FINDIT
    (Woo and Lee, 2002), and $\delta$-cluster (Yang et al., 2002). Examples of bottom-up
    subspace clustering algorithms include CLIQUE (Agrawal et al., 1998), ENCLUS (Cheng
    et al., 1999), MAFIA (Goil et al., 1999), CLTree (Liu et al., 2000), DOC (Procopiuc
    et al., 2002), and CBF (Chang and Jin, 2002).


    There are some subspace clustering algorithms that do not fit into the aforementioned
    categories. For example, the FSC (Fuzzy Subspace Clustering) algorithm (Gan et
    al., 2006; Gan and Wu, 2008) is subspace clustering, which is very similar to
    the $k$-means algorithm. The FSC uses a weight to represent the importance of
    a dimension or attribute to a cluster and incorporates the weights into the optimization
    problem.


    Other subspace clustering algorithms include SUBAC (Gan and Wu, 2004), the MSSC
    (Mean Shift for Subspace Clustering) algorithm (Gan, 2007; Gan et al., 2007),
    and the grid-based subspace clustering algorithm (Park and Lee, 2007). Recent
    work on subspace clustering is presented in Patrikainen and Meila (2006), Jing
    et al. (2007), Müller et al. (2009), Kriegel et al. (2009), and Deng et al. (2010).


    # 1.5.8 Neural Network-Based Clustering Algorithms


    Neural network-based clustering algorithms are related to the concept of competitive
    learning (Fukushima, 1975; Grossberg, 1976a,b; Rumelhart and Zipser, 1986). There
    are two types of competitive learning paradigms: hard competitive learning and
    soft competitive learning. Hard competitive learning is also known as winner-take-all
    or crisp competitive learning (Baraldi and Blonda, 1999a,b). In competitive learning,
    only a particular neuron that matches best with the given input pattern is allowed
    to learn. In'
  merge: -1
  pgno: 42
- img_proc: true
  md: '# Introduction to Data Clustering


    soft competitive learning, all neurons have the opportunity to learn based on
    the input pattern. Hence soft competitive learning is also known as winner-take-most
    competitive learning (Baraldi and Blonda, 1999,b).


    Examples of neural network-based clustering algorithms include PART (Cao and Wu,
    2002, 2004), which is also a subspace clustering algorithm. The PARTCAT algorithm
    (Gan et al., 2006b) is based on PART but was developed for clustering categorical
    data. Several other neural network-based clustering algorithms are presented and
    discussed in (Xu and Wunsch, II, 2009).


    # 1.59 Fuzzy Clustering Algorithms


    Most of the clustering algorithms presented in the previous several sections are
    hard clustering algorithms, which require that each record belongs to one and
    only one cluster. Sense Zadeh (1965) introduced the concept of fuzzy sets, fuzzy
    set theory has been applied to the area of data clustering (Bellman et al., 1966;
    Rusini, 1969). In fuzzy clustering, a record is allowed to belong to two or more
    clusters with probabilities.


    Examples of fuzzy clustering algorithms include the fuzzy k-means algorithm (Bezdek,
    1974, 1981a), the fuzzy k-modes algorithm (Huang and Ng, 1999), and the c-means
    algorithm (Dunn, 1974a,b; Selim and Ismail, 1986; Hathaway et al., 1987; Hathaway
    and Bezdek, 1984; Fukuyama and Sugeno, 1989). For more information on fuzzy clustering,
    readers are referred to the book by Höppner et al. (1999) and the survey paper
    by Döring et al. (2006). For recent work on fuzzy clustering, readers are referred
    to Zhang et al. (2008) and Campello et al. (2009).


    # 1.6 Cluster Validity


    Cluster validity is a collection of quantitative and qualitative measures that
    are used to evaluate and assess the results of clustering algorithms (Jain and
    Dubois, 1988; Jain, 2010). Cluster validity indices can be defined on three fundamental
    criteria: internal criteria, relative criteria, and external criteria (Jain and
    Dubois, 1988; Theodoridis and Kroutbas, 1999; Halkidi et al., 2002a,b). Both internal
    and external criteria are related to statistical testing.


    In the external criteria approach, the results of a clustering algorithm are evaluated
    based on a prespecified structure imposed on the underlying dataset. Usually,
    external criteria require using the Monte Carlo simulation to do the evaluation
    (Halkidi et al., 2002b). Hence cluster validity based on external criteria is
    computationally expensive.


    In the internal criteria approach, the results of a clustering algorithm are evaluated
    based only on quantities and features inherited from the under-'
  merge: -1
  pgno: 43
- img_proc: true
  md: 'ing dataset. Cluster validity based on internal criteria can be used to assess
    results of hierarchical clustering algorithms as well as partitioning clustering
    algorithms.


    In the relative criteria approach, the results of a clustering algorithm are evaluated
    with other clustering results, which are produced by different clustering algorithms
    or the same algorithm but with different parameters. For example, a relative criterion
    is used to compare the results produced by the k-means algorithm with different
    parameter $k$ (the number of clusters) in order to find the best clustering of
    the dataset.


    # 1.7 Clustering Applications


    Data clustering has been applied to many fields. According to Scoltolock (1982),
    data clustering has been applied to the following five major groups:


    +   (a) Biology and zoology. Clustering algorithms have been used to group animals
    and plants and develop taxonomies. In fact, data clustering algorithms were first
    developed in this field where clustering is known as taxonomy analysis.


    +   (b) Medicine and psychiatry. Clustering algorithms have been used to group
    diseases, including mental and physical diseases.


    +   (c) Sociology, criminology, anthropology, and archaeology. In fields in this
    group, data clustering algorithms have been used to group organizations, criminals,
    crimes, and cultures.


    +   (d) Geology, geography, and remote sensing. In the fields in this group, clustering
    algorithms have been used to group rock samples, sediments, cities, and land-use
    patterns.


    +   (e) Information retrieval, pattern recognition, market research, and economics.
    Clustering algorithms have been used to analyze images, documents, industries,
    consumers, products, and markets.


    The above list shows the applications of data clustering about 30 years ago. Nowadays,
    data clustering has a very broad application. For example, data clustering has
    been applied to areas such as computational intelligence, machine learning, electrical
    engineering, genetics, and insurance (Xu and Wunsch, II, 2009; Everitt et al.,
    2001).'
  merge: -1
