    This one is very hard to explain. Imagine a full operating system: booting, libraries,
    peripherals, APIs, memory management, file system, command line, and graphical
    user interface, everything you need. Obviously, some of the lowest parts of an
    operating system cannot turn the back to assembly language, but the rest can be
    managed using only C++.


    Examples: well, Windows 95, 98, 2000 and XP. Apparently, Windows Vista had both
    C# and C++ and that was some of the reasons of its poor effiency, after that,
    Microsoft used completely C#.


    Another one: Mac OS X.


    ### Another programming language


    It sound kind of strange. You might think “How can another language be made using
    C++?” Well yes, it can be done. It is not easy but indeed can be accomplished
    with some programming skills and some of Compilers Theory. Guess what language
    was made using C++? Java.


    Being a little bit more technic, the Java Virtual Machine (the box that executes
    everything Java need regardless the operating system) was made using C. But, C++
    inherits all of the features of C plus its own STL, memory management and many
    more tools.


    The same story goes to python. Python is an interpreted programming language and
    not a compilation programming language. What this means is that the code is executed
    by an interpreter, rather than the operating system. In python there are no executables,
    only scripts. But I will let you guess in what language was written the interpreter?
    Yes, that’s right.


    In conclussion, you can develop whatever comes to mind using C++, it''s just a
    matter of creativity.


    # Chapter 3: Project #1 Calculator


    This project will focus on the use of the math tools that C++ has for performing
    math calculations.


    Look at this code:


    ```cpp

    #include <iostream>

    #include <cmath>


    using namespace std;

    ```


    Here we define our headers. The `<cmath>` header is the one that has the functions
    that C++ uses for the math operations. It is an original C library that can be
    used along with C++. Our calculator will have four kinds of operations: arithmetical,
    trigonometrical, exponential and logarithmic. In our main function we’ll have
    something like this:


    ```cpp

    int main()

    {

    int sel = 0;

    cout << "ADVANCED CALCULATOR\n";

    cout << "ENTER THE TYPE OF OPERATION YOU WANT TO CALCULATE\n";

    cout << "[1] Arithmetic\n";

    cout << "[2] Trigonometric\n";

    cout << "[3] Exponential\n";

    cout << "[4] Logarithmic\n";

    cout << "Your choice: ";

    cin >> sel;

    switch(sel)

    {

    case 1:

    arithmetic();

    break;

    case 2:

    trigonometric();

    break;

    case 3:

    exponential();

    break;

    case 4:

    logarithmic();

    break;

    default:

    cout << "invalid operation";

    }

    return 0;

    }

    ```


    Here we define our menu for the user to select the kind of operation it wants
    to perform. This operation is stored in the `sel` variable. After this, we tell
    the user the different kinds of operation along with the value that must be entered.


    The value for `sel` will be used to control the flow of the program as can be
    seen on the `switch` statement. Only applies for values between 1 and 4. With
    something different than this the program will end.


    ```cpp

    void arithmetic()

    {

    int op = 0;

    float A = 0;

    float B = 0;

    cout << "Select operation\n";

    cout << "[1] Addition\n";

    cout << "[2] Substraction\n";

    cout << "[3] Product\n";

    cout << "[4] Division\n";

    cin >> op;

    cout << "Enter first number: ";

    cin >> A;

    cout << "Enter second number: ";

    cin >> B;

    cout << "Result: ";

    switch(op)

    {

    case 1:

    cout << (A+B);

    break;

    case 2:

    cout << (A-B);

    break;

    case 3:

    cout << (A*B);

    break;

    case 4:

    cout << (A/B);

    break;

    default:

    cout << "Invalid operation";

    break;

    }

    cout << endl;

    }

    ```


    In the `arithmetic` function, we request another time the user what kind of operation
    wants to perform, This section is only for the four basic operations. Here the
    user enters the kind of operation and both operators. After the program knows
    this data, it can perform the opration and show it to the screen. At the end,
    the control flow return to `main`.


    ```cpp

    void trigonometric()

    {

    int op = 0;

    float val = 0.0;

    cout << "Select\n";

    cout << "[1] Sine\n";

    cout << "[2] Cosine\n";

    cout << "Op: ";

    cin >> op;

    cout << "Enter value: ";

    cin >> val;

    if(op==1)

    {

    cout << sin(val);

    }

    else if(op==2)

    {

    cout << cos(val);

    }

    else

    {

    cout << "Invalid operation";

    }

    cout << endl;

    }

    ```


    With the trigonometrical part, is almost the same, but here the user can calculate
    the sine and cosine functions. The user gives the value and the program return
    the result.


    ```cpp

    void exponential()

    {

    float base = 0.0;

    float eee = 0.0;

    cout << "Enter base: ";

    cin >> base;

    cout << "Enter expnent: ";

    cin >> eee;

    cout << pow(base, eee) << endl;

    }

    ```


    The exponential part calculates any operation from $x^n$. Here the user enters
    the base and the power and, C++, using the `pow()` functions, calculates the value
    and displays it.


    ```cpp

    void logarithmic()

    {

    float value = 0.0;

    cout << "Enter value for calculate the log(e): ";

    cin >> value;

    cout << log(value) << endl;

    }

    ```


    Logarithmic section is almost the same but calculates the same but here, it calculates
    tle e-based logarithm of the data that the user inputs to the program.


    # Chapter 4: Project #2: Agenda


    For this project, we will simulate a phone agenda, like the one you have in your
    house and use them to keep record of all the important numbers you need, but we
    will do it using C++. For each contact, their name and their phone will be stored
    (although you can add as many fields as you want). Also, we will be using a new
    and very powerful feature of the Standard Template Library of C++: `vector`.


    ### Using vectors


    Imagine this phone agenda will have more than 100 phone numbers. Are you going
    to declare 100 variables for the numbers? And another 100 for the names? Of course
    not. Here is where `vector` fits perfectly. With `vector`, you will be able to
    insert as many elements as you like. For using vector inside C++, we must add
    the library `<vector>` in our code. We will also need `iostream` and `string`.


    ```cpp

    #include <iostream>

    #include <string>

    #include <vector>


    using namespace std;

    ```


    After the namespace `std`, we are going to declare our vector. The will go outside
    the `main` function. By declaring any variable outside `main` (or any function)
    it means that this variable will be global. In other terms, anyone has access
    to them for reading and writing. Look closely at the syntax:


    ```cpp

    vector<string> Names;

    vector<string> Phones;

    ```


    The word `vector` obviously says that these variables will be vectors, but now,
    look inside the signs. There is the word `string`. With this, we tell C++ that
    our vectors will contain only strings. We can only have vectors of `, of `, or
    any. You cannot mix data types in a single `vector`. Now, we will write our `main`
    function. Due to the nature of our program, we need to be able to navigate through
    its sections. The program will have three sections: add a contact, search for
    a contact using its ID and search for a contact using their name. For accomplish
    this, we will use a menu that will give us these three options and also an exit
    from the program.


    ```cpp

    int main()

    {

    int sel = 0;

    while(true)

    {

    cout << "My Agenda++\n\n";

    cout << "Choose a number to execute an option\n\n";

    cout << "[1] New Contact\n";

    cout << "[2] Search by ID\n";

    cout << "[3] Search by Name\n";

    cout << "[4] Exit\n";

    cout << "Your choice: ";

    cin >> sel;

    switch(sel)

    {

    case 1:

    case 2:

    NewContact();

    break;

    SearchByID();

    break;

    SearchByName();

    break;

    case 3:

    }

    if(sel==4)

    {

    break;

    }

    }

    return 0;

    }

    ```

