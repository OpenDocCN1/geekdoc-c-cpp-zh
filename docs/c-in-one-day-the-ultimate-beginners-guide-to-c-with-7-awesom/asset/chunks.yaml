    \ 等于 10（这意味着运行 10 次）。之后，进入代码块。程序要求用户输入五个成绩。不用担心同一行上的 `cout` 和 `cin`，那是分号的作用，用于分隔句子。五个成绩输入完成后，会计算平均值并显示在屏幕上。当我们到达代码块末尾时，回到递增部分，此时\
    \ `i` 等于 `i + 1`。`++` 运算符表示变量加 1。通过这段代码，我们可以运行循环 10 次。\n\n但是，假设我们想告诉循环学校里有多少学生，而不仅仅是死板地运行\
    \ 10 次。可以这样写：\n\n```cpp\nint limit;\ncout << \"How many students are in your school?\
