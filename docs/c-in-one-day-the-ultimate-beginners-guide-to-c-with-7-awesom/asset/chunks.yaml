    类型读取的。虽然是以字符串读取的，但我们无法对字符串进行算术运算，因此我们使用 `atof()` 将字符串转换为浮点数。此值存储在 `tval` 中，并将
    `tval` 插入到 `prices` 向量。


    回到 `main`，我们有了典型的菜单，允许用户选择想要执行的选项。第一个选项 `NewClient()` 将执行一次新销售：


