    首先，我们必须为任何卡牌定义类。在这里我们将处理多个文件，因此请创建一个名为 `card.h` 的新文件并添加以下代码：


    ```cpp

    #ifndef _CARD_H_

    #define _CARD_H_


    class Card

    {

    public:

    int number;

    int sign;

    void Assign(int, int);

    };


    #endif

    ```


    当我们使用多个文件时，`#ifndef` 是一个预处理器定义。通过它，我们可以确保该文件只被包含一次。如果它在同一个程序中被包含多次，会导致符号重复的麻烦。


    所以，我们的卡牌将有一个数字、一个花号和一个名为 `Assign` 的函数，通过这个函数，我们将为每张卡牌分配值。现在，创建一个名为“card.cpp”的新文件：


    ```cpp

    #include "card.h"


    void Card::Assign(int num, int si)

    {

    number = num;

    sign = si;

    }

    ```


    在这个文件中，将包含我们函数的实现。在这里，我们将函数的参数赋值给对象将拥有的值。注意，我们必须包含我们的“card.h”文件。这就是我们之前创建的那个。必须包含它才能实现这些函数。


    现在我们有了卡牌类，必须创建玩家类了。`Player.h` 的定义如下：


    ```cpp

    #ifndef _PLAYER_H_

    #define _PLAYER_H_


    #include <iostream>

    #include <string>

    #include <vector>

    #include "card.h"


    using namespace std;


    class Player

    {

    public:

    string name;

    vector<Card> hand;

    void GetCard(Card);

    void ShowHand();

    };


    #endif

    ```


    `Player` 类有两个属性：玩家的名字和一个向量（vector）。看：这里我们没有使用任何字符串。它是一个 `CARD`！即我们之前定义的类。这个卡牌向量可以看作是玩家拥有的牌。此外，我们还有一个名为
    `GetCard()` 的函数，这个函数允许我们的玩家接收卡牌并将其加入手牌中。最后是 `ShowHand()` 函数。


    这只会显示手牌内部的值。让我们看看“Player.cpp”中的实现代码：


    ```cpp

    #include <vector>

    #include "card.h"

    #include "player.h"


    using namespace std;


    void Player::GetCard(Card c)

    {

    hand.push_back(c);

    }


    void Player::ShowHand()

    {

    cout << name << "''s hand: ";

    for (int i = 0; i != hand.size(); i++)

    {

    cout << hand[i].sign << "-" << hand[i].number << " ";

    }

    cout << endl;

    }

    ```


    在这个实现中，我们必须包含 `Card` 和 `Player`，因为我们将都会用到它们。`Card` 函数接收一个 `Card` 类型的参数并将其插入手牌。`showHand`
    遍历玩家的手牌，获取每张卡牌的值并显示在屏幕上。


    但是……谁来发牌呢？显然是发牌员！


    让我们在“dealer.h”中为发牌员定义一个类：


    ```cpp

    #ifndef _DEALER_H_

    #define _DEALER_H_


    #include <string>

    #include <vector>

    #include "card.h"


    using namespace std;


    class Dealer

    {

    public:

    vector<Card> Deck;

    Dealer();

    Card GiveCard();

    void ShuffleCards();

    };


    #endif

    ```


    发牌员只有一个属性，但它是游戏中最重要的属性：牌组！


    我们该如何表示牌组呢？同样作为卡牌的向量。发牌员还将拥有发牌和洗牌的能力。现在，让我们来看下实现部分：


    ```cpp

    #include <algorithm>

    #include <vector>

    #include <string>

    #include <random>

    #include <chrono>

    #include "dealer.h"

    #include "card.h"


    using namespace std;


    Card Dealer::GiveCard()

    {

    Card c = Deck[0];

    Deck.erase(Deck.begin());

    return c;

    }


    void Dealer::ShuffleCards()

    {

    unsigned seed =

    std::chrono::system_clock::now().time_since_epoch().count();

    shuffle(Deck.begin(), Deck.end(),

    std::default_random_engine(seed));

    }


    Dealer::Dealer()

    {

    for (int i = 0; i != 12; i++)

    {

    for (int j = 0; j != 4; j++)

    {

    Card newCard;

    newCard.number = (i + 1);

    newCard.sign = (j + 1);

    Deck.push_back(newCard);

    }

    }

    }

    ```


    在这里我们引入了新的库：

    - Algorithm：将用于洗牌我们的牌组。

    - Random：生成随机数。

    - Chrono：访问计时库。


    首先，看 `GiveCard()` 函数。它会选择牌组顶部的卡牌。从牌组中移除它，然后提取到另一个地方，即任何玩家的手牌。在 `ShuffleCards()`
    中，我们将生成一个基于时间的种子，用于随机顺序洗牌。另外，看 `Dealer()` 函数。它包含一个嵌套循环（另一个循环内部的循环），通过它，我们生成了卡牌。从
    1 到 12，每种从 1 到 4。之后，每张卡牌都被插入到牌组中，现在牌组创建完成！


    现在，是最重要的部分，主函数：


    ```cpp

    #include <iostream>

    #include <string>

    #include <vector>

    #include "player.h"

    #include "card.h"

    #include "dealer.h"


    using namespace std;


    // 手牌允许的卡牌数量

    int CardNumber = 5;


    int main()

    {

    // 创建玩家

    Player player1;

    Player player2;

    player1.name = "CPU";

    string name;

    cout << "Enter your name: ";

    cin >> name;

    player2.name = name;

    Dealer theDealer;

    theDealer.ShuffleCards();


    // 给玩家发牌

    for (int i = 0; i != CardNumber; i++)

    {

    player1.GetCard(theDealer.GiveCard());

    player2.GetCard(theDealer.GiveCard());

    }

    player2.ShowHand();

    cout << "\n";

    player1.ShowHand();

    return 0;

    }

    ```


    这里没有未知的库。记住我们必须添加所有的类头文件。这里有一个常量 `CardNumber`。它会被发牌员用于发牌。当主函数开始时，创建了两个玩家。我们为 `player1`
    分配名字“CPU”，对于玩家 2，名字将由用户给出。


    之后我们创建了发牌员（通过创建发牌员，牌组也被创建了），并告诉发牌员洗牌。现在，从 0 到 `CardNumber`，发牌员将为每个玩家获取一张卡牌，将其从牌组中移除并交给玩家的手牌。之后，双方手牌都会显示出来，就可以确定游戏的结果。


    在这个例子中，很容易理解这些现实世界对象是如何抽象并引入到 C++ 这样的编程范式的。这里没有功能逻辑，只有 OOP 逻辑。


    # 第 10 章：下一步


    到目前为止，我们涵盖了一些关于 C++ 的基础和中级内容。然而，为了精通 C++，还有更多专门主题需要学习。


    - **内存管理**：将操作系统提供的可用内存用于我们的对象中。`new` 和 `delete` 关键字。通过这两个关键字，你可以管理正在使用多少内存、分配何时以及分配给谁内存，甚至可以优化你的程序。

    - **标准模板库 (STL)**：在门课程中我们只涵盖了两个模板：`map` 和 `vector`。然而，C++ 的 STL 远超这两个对象。像 `stack`、`queue`、`list`、`deque`
    等结构都是 C++ 内置的。

    - **迭代器**：迭代器是 C++ 遍历模板的方式但不使用索引。相反，迭代器会适应所需的容器。

    - **指针**：指针是 C++ 中非常重要的部分，它将允许你有更好的内存管理，并创建多个对象以节省大量内存。

    - **字符串管理**：可以使用字符串实现多种操作。搜索模式、复杂的拼接、标记分词、处理字符串、完全或部分替换字符串等等。

    - **面向对象编程 (OOP) 基础**：虽然我们在示例项目中涵盖了一些 OOP 的要点，但这门课程并不是关于 OOP 的。所以，涵盖完整的 OOP 理论以生成更好的编程设计是一个好主意。一些概念将
    `类`、`抽象`、`成员`、`成员函数`、`单继承`、`多继承` 甚至 `多态`。

    '
- fmt: '

    Create your own libraries: As we saw on the course, you can generate your own
    `.h` and `.cpp` files. Here we used them as external linking for classes. But
    it can be also implemented with your own home-made functions. You might have functions
    that you need to use multiple times and do not want to have to rewrite them several
    times. So, a good idea would be to implement all of these functions in a single
    `.cpp` file and add it to a future project.


    If you cover all of points mentioned here, you can move on to more advanced features
    like:


    * Templates

    * Operator overloading

    * Complex file processing

    * Graphical programming

    * On windows: Microsoft Foundation Classes

    * On Linux: `GTK+` or `QT`


    Even, with graphical programming, there is the `OpenGL` open source programming.
    With `OpenGL` you can generate 2D and 3D graphics using `C++`. In the 2D mode,
    you can draw multiple figures using vertex and matrix. You can add textures, colors
    and refresh screen whenever you want. In the 3D mode, you can design your own
    3D environments, define textures and 3D models. At this point, animations become
    accessible. Also, in both modes, you can enable the use of the keyboard and assign
    actions with each key. With `OpenGL` you can also design videogames, from the
    easiest to the hardest. It depends on your programming skills. Moreover, `OpenGL`
    also enables you to add background audios, and all of this using `C++`. However,
    you should take note that `OpenGL` runs well on the `Microsoft Visual Studio`
    compiler. Extra configurations might be needed in the `GNU G++` compiler. As you
    can see, the limit in `C++` programming is up to your imagination.


    # Conclusion


    After the topics we have covered, you can have a clearer scene of how `C++` programming
    is developed. We have tried to have an applied aspect of the applications of `C++`.
    The reason is that many times, the user does not understand how all the pieces
    can work together as a complete system. So we have been careful in the applied
    focus for this course.


    As you might have noticed, the complex programs are, at the end, are made using
    the same basic instructions explained in chapter one. One example of this is the
    creation of a menu: here we have variable declaration, an infinite loop, a switch
    statement and some input. Using these basic structures we can build the menu and
    many more stuff.


    One thing that we have to remember (and that many people don’t see) is that the
    console is not the only output. You might think that the console is completely
    useless and is not attractive. And, in a certain way, this is right. The console
    is not the appropriate input and output system for most programming in these days.
    However, remember: the power of `C++` is its speed, its complexity and its `STL`.
    The input and output system can be always changed: sometimes it can be from console,
    other times can be a file, and another a graphical user interface (GUI) or whatever
    you want. But don’t be mistaken by the false fact that the programs that are ugly
    are completely useless.


    Having this course, you can advance to a more complex graphical system, where
    you can make more comfortable software while still having the power of `C++`.
    Examples of this is `GTK+` or `QT`. With these `C++` expansions, you can design
    graphical interfaces for complementing your projects.


    This course also covered some features that `C++` inherits from its predecessor,
    `C`, like the math functions. These are not the only ones. You can dive up into
    the complete `C` library and find a bunch more of tools to use in your `C++` programming,
    just remember to make the proper type conversions.


    After this course, you are now able to develop your own solutions. And you are
    not limited by the solutions. Now, you can do file processing, data storage, report
    creation, data type conversion and more features that are widely used for calculations.
    Something has to be said: plain text is not the best way to save information.
    The optimal way would be a database. But this is a more complex to cover in a
    basic course. However, with this basic knowledge of data storage, you can move
    on to a better storing technique.


    After this point, it is in the interest of this course that you are now able to
    interpret `C++` code and to provide solutions using the language. Many resources
    are available on the internet, like reference pages, that can complement all of
    your `C++` knowledge and that you might now, with the concepts that we have covered,
    understand an implement new functionalities. Now the question would be, what are
    you going to do with your newly acquired knowledge?


    # Did you enjoy this book?


    I want to thank you for purchasing and reading this book. I really hope you got
    a lot out of it.


    Can I ask a quick favor though?


    If you enjoyed this book I would really appreciate it if you could leave me a
    positive review on Amazon.


    I love getting feedback from my customers and reviews on Amazon really do make
    a difference. I read all my reviews and would really appreciate your thoughts.


    Thanks so much.


    W.B Ean


    p.s. You can click here to go directly to the book on Amazon and leave your review.


    ALL RIGHTS RESERVED. No part of this publication may be reproduced or transmitted
    in any form whatsoever, electronic, or mechanical, including photocopying, recording,
    or by any informational storage or retrieval system without express written, dated
    and signed permission from the author.

