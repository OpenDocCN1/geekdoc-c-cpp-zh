    此之后，我们将使用一个 if 结构。`Strcmp` 是字符串比较函数。如果第二个参数（`argv[2]`）是“-e”，那么意味着这是一个加密过程。因此，文件名将带有“ENCRYPTED”标签。如果它包含“-d”字符串，那么它将是一个解密过程。


    然后，我们进行文件处理。在这里，我们将同时使用输入和输出文件流。


    输入流包含我们的原始消息，输出流包含转换后的消息。我们打开输入流并读取所有消息。


    此之后，我们将像处理向量一样处理我们的字符串。对于字符串中的每个字符，我们将在映射表中找到其对应的项进行翻译。然而，在字符串中是不允许使用 `[]` 操作符的。为了执行索引读取，我们必须使用
    `at()` 函数。实际字符将存储在 `tempChar` 变量中。


    当我们得到这个字符时，我们再次运行比较。如果第二个参数是“-e”，则意味着它是加密过程。因此，我们进行加密。


    我们将在 `messageEnc` 的末尾追加与其 `KEY` 对应的 `VALUE`。因此，`KEY` 将是字母，而值将是该键关联的值。全部来自 `theKey`
    映射。


    如果是解密过程，那么我们将不再与 `theKey` 比较，而是与 `revKey` 映射进行比较。


    当完成所有字符后，控制台中会出现一条消息，并将处理后的消息写入我们的输出文件。最后，两个文件都被关闭。如果未找到输入文件，将显示错误消息。


    程序不会显示任何消息。一切都进入文件。最后，我们结束程序并返回 `main` 函数。


    # 第 8 章：项目 #6 决斗游戏


    这个项目是一个自动化视频游戏的简单演示，一切通过控制台运行。核心思想是决斗。一场牛仔手对牛仔手的对峙。共有三种不同类型的牛仔：


    *   基础型 (Basic)

    *   防御型 (Resistance)

    *   快攻型 (Fast Attack)


    其中，基础型的数值正常，防御型的攻击点较低但生命值更多，而快攻型的攻击点更高但生命值较少。用户将输入他想要的牛仔类型。此之后，机器将随机选择其中的任意一种。在这个程序中，我们将使用类来定义牛仔类型。让我们来看头文件：


    ```cpp

    #include <iostream>

    #include <cstdlib>

    #include <ctime>

    using namespace std;

    ```


    此项目中的新头文件是 `<ctime>`。`ctime` 是原始 C 头文件，将用于生成随机数。现在，让我们来看看类：


    ```cpp

    class cowboy

    {

    public:

    int life;

    int player;

    int maxatk;

    int minatk;

    int type;

    cowboy()

    {


    }

    cowboy(int v, int am, int an, int t)

    {

    life = v;

    maxatk = am;

    minatk = an;

    type = t;

    }

    };

    ```


    `cowboy` 类是我们对 `Cowboy` 的定义。如你看到的，它包含了基本数值：生命值、玩家标识、最大攻击点、最小攻击点以及牛仔类型。


    它的构造函数 `cowboy(int, int, int, int)` 是一个函数，允许我们在牛仔创建时通过单条指令分配这四个值。在进入我们的 `Duel`
    类之前，让我们来看 `main` 函数：


    ```cpp

    int main()

    {

    duel theDuel;

    theDuel.mainmenu();

    system("pause");

