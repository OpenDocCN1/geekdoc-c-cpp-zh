  trans: "\n在这段代码中，我声明了几个额外的字符串。我们还要求用户提供他们的姓。在编程中，我们将拼接字符串的操作称为 `concatenate`。在这个例子中，我们将\
    \ `name`、一个空格和 `last name`（姓氏）拼接在一起，生成一个包含全名的唯一字符串。然后该字符串被发送到输出端。\n\n# 转义序列 (Escape\
    \ Sequences)\n\n这是对 I/O 主题的补充。在 C++ 中，有一些特殊的序列，允许程序员更好地布局所显示的信息。这些序列是：\n\n* `\\\
    n` – 换行\n* `\\t` – 插入制表符\n\n通过这两个序列，你可以设计出一个布局良好的界面。看这个示例：\n\n```cpp\ncout <<\
    \ “Here is a line\\n” << “Here is another line\\t” << “I am after a tab space”;\n\
    ```\n\n这是序列的一个简单示例，且只能与 `cout` 对象配合使用。\n\n# 程序流程 (Program Flow)\n\n到目前，我们涵盖了数据类型、如何在屏幕上显示信息以及从键盘获取数据。现在，C++\
    \ 中一个非常重要的部分是流程控制指令。通过这部分，你将能够做出决策并编写复杂的程序。\n\n## If 结构 (If Structure)\n\n`if`\
    \ 是一个条件结构。正如它的名字一样，如果发生了某事，就执行此操作。该结构如下：\n\n```cpp\nif(condition)\n{\n    // 执行某些操作\n\
    }\n```\n\n`condition` 是一个表达式，其结果为真或假。有一些运算符可以评估该条件：\n\n* `等于 (==) `：如果两个值相同，则结果为真。示例：`a==b`\n\
    * `逻辑与 (&&) `：如果所有值为真，则为真。\n* `逻辑或 (||) `：如果任意一个值为真，则为真。\n* `逻辑非 (!) `：如果值为假，则为真。\n\
    * `大于 (A>B)`：如果 `A` 大于 `B`，则为真。\n* `小于 (A<B)`：如果 `B` 大于 `A`，则为真。\n\n假设我们需要评估一个学生是否通过了某门课程。看下面的代码：\n\
    \n```cpp\n#include <iostream>\nusing namespace std;\n\nint main()\n{\n    int\
    \ note;\n    cout << \"Enter your note: \";\n    cin >> note;\n    if(note>6)\n\
    \    {\n        cout << \"Congratulations. You passed!\";\n    }\n    return 0;\n\
    }\n```\n\n我们要求用户输入课程分数。如果用户输入的数字大于 6，程序流程就会进入大括号包围的代码块。如果不是，它将忽略该块并继续执行。注意，`IF`\
    \ 指令不以分号结尾。这是因为后面跟着一个代码块。但是，当分数小于 6 时会发生什么？\n\n我们使用 `else` 关键字。\n\n```cpp\n#include\
    \ <iostream>\nusing namespace std;\n\nint main()\n{\n    int note;\n    cout <<\
    \ \"Enter your note: \";\n    cin >> note;\n    if(note>6)\n    {\n        cout\
    \ << \"Congratulations. You passed!\";\n    }\n    else\n    {\n        cout <<\
    \ \"Sorry. You did not passed\";\n    }\n    return 0;\n}\n```\n\n这段代码与上一个完全一样，只有一个区别。我们添加了\
    \ `else` 关键字及其相应的代码块。首先评估条件 `note>6`。如果该条件为真，则将执行 `if` 旁的代码块，并忽略 `else` 块的代码。如果条件为假，则将忽略\
    \ `if` 块的代码，并执行 `else` 块的代码。\n\n我们还可以在 `if` 子句中添加多个条件。看下面的代码：\n\n```cpp\nif(note==10)\n\
    {\n    cout << \"Excellent!\";\n}\nelse if(note>6 && note<10)\n{\n    cout <<\
    \ \"Congratulations. You passed\";\n}\nelse\n{\n    cout << \"Sorry. You did not\
    \ approve\";\n}\n```\n\n我们添加了被称为 `else if` 的结构，它允许程序员在同一个 `if` 上添加多个条件。在这个例子中，如果\
    \ `note` 等于 10，则只执行第一个代码块。在第二个条件中，如果 `note` 大于 6 且 `note` 小于 10，则执行中间的代码块。你可以根据需要添加尽可能数量的\
    \ `else if`。然而，如果 `IF` 或任何 `ELSE IF` 条件都不成立，则将执行 `ELSE` 代码块。只有当所有 `IF` 都不成立时，才会执行\
    \ `else`。\n\n创建多个条件可能会让你想：“嘿，如果我有很多条件，比如 20 个或 30 个呢？那会有很多代码。”是的，你是对的。处理许多条件会很麻烦。但\
    \ C++ 对这个问题有一个答案：`switch` 指令。通过 `switch`，我们可以以简单的方式使用多个条件。继续同样的分数的例子，假设我们想对通过的分数显示不同的消息。从\
    \ 6 分开始，会有 5 条通过的消息和 1 条不及格的消息。使用 `switch` 语句，代码看起来如下：\n\n```cpp\nswitch(note)\n\
    {\n    case 10:\n        cout << \"Excellent\";\n        break;\n    case 9:\n\
    \        cout << \"Very note\";\n        break;\n    case 8:\n        cout <<\
    \ \"Good job!\";\n        break;\n    case 7:\n        cout << \"Not bad. Keep\
    \ working\";\n        break;\n    case 6:\n        cout << \"You passed by a bit\"\
    ;\n        break;\n    default:\n        cout << \"You did not approve\";\n}\n\
    ```\n\n首先需要注意的是，我们要比较的变量放在 `switch` 语句旁的大括号内。它不需要以分号结尾，因为后面跟着代码块。对于每个比较，我们使用 `case`\
    \ 关键字后跟我们要查找的值。如果 `note` 的值为 10，“Excellent”将被输出。对于每个 `case`，我们必须添加 `break` 关键字。如果不这样做，`switch`\
    \ 语句将落到下一个 `case`。\n\n# 循环\n\n好了，现在你知道如何在程序中做出决策。你可以将流程引导到其他代码，并决定执行哪一个何时执行。太好了。假设你想计算平均分。每个学生修\
    \ 5 门学科，你想知道这些分数的平均分。简单，你把它们加起来除以 5。但是，学校不只有一个学生。你可以复制代码并重复 10 次或 15 次吗？嗯……你可以这样做，但代码会开始变得难以维护。那么，如何解决这个问题呢？C++\
    \ 拥有解决这项工作的工具，那就是循环。\n\n循环是一个在满足条件之前重复自身的代码块。我们有两种循环：计数循环和条件循环。第一个是 `for`，用于我们已经知道要重复代码块多少次的情况。`for`\
    \ 循环的语法如下：\n\n```cpp\nfor(VARIABLES; CONDITION; INCREMENT)\n{\n    // 重复某些代码\n\
    }\n```\n\n第二个命名为 `while`，它会一直循环直到满足某个条件。语法如下：\n\n```cpp\nwhile(CONDITION)\n{\n\
    \    // 重复某些代码\n}\n```\n\n遵循平均分的例子，计算 10 个学生的平均分看起来如下：\n\n```cpp\nfloat note1,\
    \ note2, note3, note4, note5;\nfloat avg;\n\nfor(int i = 0; i != 10; i++)\n{\n\
    \    cout << \"First note: \"; cin >> note1;\n}\n```\n"
