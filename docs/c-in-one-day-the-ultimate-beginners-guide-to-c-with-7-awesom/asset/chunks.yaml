- fmt: "\n![](cover.jpeg)\n\n# C++ In One Day\n## The Ultimate Beginners Guide To\
    \ C++ With 7 Awesome Projects\n\nBy W.B Ean\nCopyright 2016 - All Rights Reserved\
    \ – W.B Ean\n\nALL RIGHTS RESERVED. No part of this publication may be reproduced\
    \ or transmitted in any form whatsoever, electronic, or mechanical, including\
    \ photocopying, recording, or by any informational storage or retrieval system\
    \ without express written, dated and signed permission from the author.\n\n##\
    \ Table of Contents\n- Introduction: 4\n- Chapter 1: Basics of C++: 5\n- Chapter\
    \ 2: Types of things to build with C++: 1\n- Chapter 3: Project #1 Calculator\n\
    - Chapter 4: Project #2: Agenda\n- Chapter 5: PROJECT #3 SCHOOL NOTES SYSTEM\n\
    - Chapter 6: Project #4 Sales Point\n- Chapter 7: Project #5 Simple command line\
    \ encryption system\n- Chapter 8: Project #6 Duel Game\n- Chapter 9: Project #7\
    \ Poker Game\n- Chapter 10: What to do next\n- Conclusion: Did you enjoy this\
    \ book?\n\n# Introduction\n\nMany times we wonder how computers can work from\
    \ the inside. For the end user, there is practically no interaction with something\
    \ deeper. They do not need to know many details about how the computer works or\
    \ something about programming. The end user is only attracted by the functionality\
    \ and the program to have a simple interface that is easy to handle.\n\nHowever,\
    \ the software does not create by itself. Somebody has to do the dirty work. Or,\
    \ like other like to call it, the art of programming. The main part of computers\
    \ is their microprocessor, the brain that executes every instruction needed for\
    \ every task the user needs. These processor only understands binary code (zeros\
    \ and ones) and it does not know nothing about English or numbers.\n\nSo, how\
    \ can we interact with the processor? We use programming languages. Through history,\
    \ many languages have been developed for the interaction between the programmers\
    \ and the machines. In recent times, programming has become a major field of study\
    \ with a wide variety of programming language to choose depending on the purpose.\n\
    \nOne of the most preferred languages is `C++`. Why? Mainly because of its speed,\
    \ its standards and the wide range of applications. `C++` was developed as an\
    \ improvement for the `C` programming language. This change added many features,\
    \ like enabling object oriented programming, templates, memory handling, error\
    \ handling and more tools for the programmers.\n\nThe `C++` in one day Course\
    \ is targeted for people who want to learn the basics of the `C++` programming\
    \ language. We will cover from the most basic concepts and stuff, perfect for\
    \ beginners, and as the course goes, we will be adding more features from the\
    \ language and also start to develop some real life projects.\n\nThis course is\
    \ divided in four sections:\n\n1. **The basics of C++**: In this chapter, we will\
    \ cover the basics of `C++`. This is the main core of the course for beginners.\
    \ Here we will cover the basic structure for every `C++` program. A brief explanation\
    \ of the library system. The standard system of input and output from `C++`. Datatypes\
    \ are another fundamental topic to cover and will be discussed, including examples\
    \ of declaration, using and storing values. String processing will be covered.\n\
    In this chapter, we will also explain the basic flow structures that are used\
    \ in `C++` for designing software. The `if` structure, the `switch` structure,\
    \ the `while` structure and the `for` structure. Finally, a very brief introduction\
    \ to the basics of object oriented programming.\n2. **Things to do with C++**:\
    \ In this chapter, we will discuss what kinds of software can be developed using\
    \ the `C++` programming language.\n3. **Implementing projects with C++**: Here\
    \ we will write some code! 7 projects have been selected and programmed in order\
    \ to show you how you can do useful things with `C++`.\n4. **What to do next**:\
    \ Finally, we finish the course with some recommendations on topics that, while\
    \ are not very necessary for the basics, they are a good place to follow after\
    \ learning the basics. These features can enable you to design more optimal and\
    \ complex software.\n\nSo, let’s get started!\n\n# Chapter 1: Basics of C++\n\n\
    `C++` is a multipurpose programming language. What is this? That it can be used\
    \ for writing every type of software that the programmer wants. It can be from\
    \ a simple program like computing the sum of two numbers up to a full operating\
    \ system (for example, `Windows`) and videogames (PS3, PS4, XBOX). Some advantages\
    \ that `C++` has over its competitors (like `C#` or `Java`) are, in first place,\
    \ its speed. When you write a `C++` program, it is compiled to a binary file that\
    \ runs along with the operating system. Second, it is standard. `C++` has a very\
    \ well defined standard from beginning to end and this means that, if the programmer\
    \ writes code in standard `C++`, it can be ported to other compilers with minimum\
    \ or small changes.\n\nHowever, not everything is as simple as its sounds. Although\
    \ `C++` is very fast, it is very difficult to master due to the libraries that\
    \ it has and the Standard Template Library (`STL`) that will be discussed in later\
    \ chapters.\n\nBut let’s get started with the basics of the language.\n\n### Instructions\
    \ and compiler\n\nThrough the article we will be using the GNU C++ compiler, `g++`,\
    \ along with the IDE `CodeLite`. All of the code will be written in standard `C++`.\
    \ `CodeLite` and the compiler can be downloaded from http://downloads.codelite.org/\n\
    \n### Libraries\n\nThe full extension of `C++` has libraries for many purposes:\
    \ input and output, math, memory management, time, file processing, string processing\
    \ and many more features. However, when we start to code, we must define which\
    \ of these libraries we want to use in our program.\n\nSince 2003, `C++` also\
    \ implemented a feature named `namespaces`, which are another way to organize\
    \ all of the stuff inside the language.\n\n### The main function\n\nIn `C++`,\
    \ all programs must contain a function (or a piece of code) named `main`. The\
    \ purpose of this function is to indicate the compiler where will the program\
    \ start its execution.\n\n### Input and Output (I/O)\n\nAlmost every program in\
    \ `C++` needs an input and an output. There are some exceptions to the rule, but\
    \ normally, there is always I/O. The input is all the data that enters the computer,\
    \ like numbers, words. The output are the data that is showed to the screen (also\
    \ named console). The library used in `C++` for this operations is named `iostream`.\n\
    \nInside `iostream`, there are two objects that we will be using to read data\
    \ from the keyboard and showing data to the console: `cout` and `cin`.\n\nBefore\
    \ programming anything, in `CodeLite` we must create a new project. Steps for\
    \ creating a new project in `CodeLite`:\n\n* In the main screen you will see a\
    \ button with the text `NEW`. Click it.\n* When the new window appears, select\
    \ on the left side the `Console` and select `Simple executable (g++)` from the\
    \ list.\n* On the right panel choose a name for your project, for example `Example1`.\n\
    * In project path, select a folder in your computer where you will save your code.\n\
    * In the compiler section, be sure to have `gnu g++` selected.\n* Click `OK`\n\
    \nAfter doing this, go to the left side of your screen and will find a folder\
    \ with the name you selected for your project. Open it and you will see another\
    \ folder named `src` (abbreviation for source). Inside `src`, there will be a\
    \ file named `main.cpp`. This is the file where you will write your `C++` code.\n\
    \nThe example code for a simple input and output in `C++` is as following:\n\n\
    ```cpp\n#include <iostream>\n\nusing namespace std;\n\nint main()\n{\n    cout\
    \ << \"This is my first C++ program\";\n    return 0;\n}\n```\n\nAs you can appreciate,\
    \ the first line we included the library for I/O. On the second line, usingusing\
    \ namespace std` we say to `C++` that we want to use all of the features inside\
    \ the selected libraries (like `cout`).\n"
