    \ `limit` 的变量。该数字是从键盘获取的，循环将一直持续到 `i` 等于 `limit`。\n\n正如你所观察到的，我们必须始终知道循环何时结束（无论是\
    \ 10 还是一个变量）。但是，当我们不知道如何停止时该怎么办？这就是 `while` 循环非常有用场了。假设你想计算平均分，但你不知道学校有多少门学科。只需让程序一直运行，直到你告诉它停止为止。这可能是一个真实的情况，而且我们无法询问学生。所以，看这段代码：\n\
    \n```cpp\nint val = 1;\nwhile(val==1)\n{\n    cout << \"First note: \"; cin >>\
