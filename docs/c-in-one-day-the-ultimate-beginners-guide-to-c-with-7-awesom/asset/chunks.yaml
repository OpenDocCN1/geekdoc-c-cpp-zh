    found = true;

    }

    }

    if(!found)

    {

    }

    }

    ```


    在这里我们声明了两个变量，`found` 和 `name`。`name` 将是我们想要寻找的字符串，`found` 是一个数据类型为 `BOOL` 的变量（只有真或假），它将告诉我们搜索是成功还是失败。


    首先，我们请求用户输入要搜索的姓名，之后，我们将使用 `for` 循环遍历所有元素。累加器像往常一样从零开始。现在可以注意我们的条件发生了变化：`i !=
    Names.size()`


    得益于这个名为 `size()` 的小函数，我们的 `for` 循环将遍历所有元素直到到达它的末尾。有了这个 `size()` 函数，我们可以完全确定没有超出
    vector 的边界。如果你不使用 `size()`，你将面临某种遍历 vector 的风险。如果发生此错误，它将在运行时发生，编译器不会警告你，所以使用
    `size` 函数更安全。


    我们循环的每次迭代都会将 vector 中 `i` 位置的字符串与用户输入的字符串进行比较。如果两个字符串相等，它将向用户显示该联系人的姓名和电话。同时，它会将
    `found` 的状态改为 `true`。


    在退出循环后，我们将检查 `found` 是否为 `false`。变量前的感叹号表示否定（NOT），所以，如果 `found` 为 `false`，则流程将进入
    `if` 的代码块并向用户显示“No contact was found with this name”。


    在验证状态后，函数结束，程序流返回到 `main` 函数。


    ```cpp

    cout << "No contact was found with this name!\n\n";

