  trans: "\n创建你自己的库：正如我们在课程中所看到的，你可以生成自己的 `.h` 和 `.cpp` 文件。在这里，我们将它们用作类的外部链接。但也可以通过你自定义的函数来实现。你可能拥有一些需要多次使用的函数，且不想多次编写它们。因此，一个好主意是将这些函数都实现在单个\
    \ `.cpp` 文件中，并将其添加到未来的项目里。\n\n如果你涵盖了这里提到的所有点，你就可以学习更高级的特性，例如：\n\n* 模板\n* 运算符重载\n\
    * 复杂文件处理\n* 图形化编程\n* 在 Windows 上：微软基础类 (MFC) \n* 在 Linux 上：`GTK+` 或 `QT`\n\n即使是图形化编程，也有\
    \ `OpenGL` 开源编程。通过 `OpenGL`，你可以使用 `C++` 生成 2D 和 3D 图形。在 2D 模式下，你可以使用顶点和矩阵绘制多个图形。你可以随时添加纹理、颜色并刷新屏幕。在\
    \ 3D 模式下，你可以设计自己的 3D 环境，定义纹理和 3D 模型。此时，动画变得触手可及。此外，在两种模式下，你都可以启用键盘使用并为每个键分配操作。通过\
    \ `OpenGL`，你还可以设计视频游戏，从最简单的到最难的。这取决于你的编程技能。此外，`OpenGL` 还允许你添加背景音频，而这一切都是使用 `C++`\
    \ 实现的。然而，你应该注意 `OpenGL` 在 `Microsoft Visual Studio` 编译器上运行良好。在 `GNU G++` 编译器中可能需要额外的配置。正如你看到的，`C++`\
    \ 编程的限制取决于你的想象力。\n\n# 结论\n\n在涵盖了这些的话题后，你对 `C++` 编程是如何开发的有一个更清晰的认识。我们尝试从 `C++`\
    \ 应用的应用方面入手。原因是很多时候，用户并不理解所有部分是如何作为一个完整的系统协同工作的。因此，这门课程在应用侧重点上非常谨慎。\n\n正如你可能注意到的，复杂的程序归底都是使用第一章解释的相同基本指令制成的。一个例子是创建菜单：这里有变量声明、无限循环、switch\
    \ 语句和一些输入。使用这些基本结构，我们可以构建菜单以及许多其他内容。\n\n我们必须记住的一点（许多人并没有注意到）是，控制台不是唯一的输出。你可能认为控制台完全没用且没有吸引力。在某种程度上，这是正确的。对于如今的大多数编程来说，控制台不是合适的输入输出系统。然而，请记住：`C++`\
    \ 的力量在于它的速度、复杂性以及它的 `STL`。输入输出系统可以随时更改：有时可以是控制台，有时可以是文件，另一个可以是图形用户界面 (GUI) 或你想要的任何。但不要被“界面的程序完全没用”这一错误事实所误导。\n\
    \n通过这门课程，你可以进入更复杂的图形系统，在那里你可以在保持 `C++` 力的同时制作出更舒适的软件。例子有 `GTK+` 或 `QT`。通过这些 `C++`\
    \ 扩展，你可以为你的项目设计图形界面。\n\n本课程还涵盖了 `C++` 从其前身语言 `C` 继承的一些特性，例如数学函数。这些并不是全部。你可以深入研究整个\
    \ `C` 库，找到许多可以在 `C++` 编程中使用的工具，只需记住进行适当类型转换即可。\n\n在本课程之后，你现在能够开发自己的解决方案了。而且你不再限于这些解决方案。现在，你可以进行文件处理、数据存储、报告创建、数据类型转换以及许多广泛用于计算的特性。必须说：纯文本不是保存信息的最佳方式。理想的方法是数据库。但这对于基础课程来说涵盖起来太复杂。然而，有了这些数据存储的基础知识，你就可以转向更好的存储技术。\n\
    \n从这一点开始，符合本课程利益的是，你现在已经能够解释 `C++` 代码并使用该语言提供解决方案。互联网上有许多资源（如参考页面），可以补充你所有的 `C++`\
    \ 知识，而且通过我们涵盖的概念，你现在可能理解并实现新的功能。现在的问题是，你打算用你新学的知识做些什么呢？\n\n# 你喜欢这本书吗？\n\n感谢你购买并阅读这本书。我真心希望你从中获益良。\n\
    \n不过，我可以请你个小忙吗？\n\n如果你喜欢这本书，如果能在亚马逊上给我留一个好评，我将不胜感激。\n\n我喜欢收到客户的反馈，亚马逊上的评价确实会产生很大影响。我会阅读所有的评论，并非常感谢你的想法。\n\
    \n非常感谢。\n\nW.B Ean\n\n附注：你可以点击此处直接进入亚马逊上的书籍并留下你的评价。\n\n版权所有。未经作者明确书面、日期和签字许可，本出版物的任何部分不得以任何形式（电子或机械形式，包括复印、录制或通过任何信息存储或检索系统）复制或传输。\n\
