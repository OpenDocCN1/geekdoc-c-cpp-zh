    \ <map>\n#include <vector>\n\nusing namespace std;\n```\n\n有两个新库：`<cstring>` 和\
    \ `<map>`。`cstring` 库是一个原始的 C 语言库，我们将用它来进行字符串比较。它对字符串有更多功能，但在此情况下，我们将仅限于使用该函数。\n\
    \n下一个是 `map`，它是一个 STL 容器。为了解释这一点，请查看 `vector`。它使用单个变量名持有多个值。所有这些值通过索引（即我们放在括号内的数字）与它们区分。那么，`map`\
