    第一件事是声明我们的计数器变量。`Id` 将拥有输入项目的 ID。`qty` 将存储客户购买的相同物品的数量。`itemqty` 将持有客户购买的总项目数，`sum`
    将所有产品价格的总和。在我们的无限循环中，我们要求用户输入产品 ID。如果我们不想输入新项目并继续结账，必须输入 `-1`。任何其他内容将查找项目。当插入一个项目时，用户必须输入相同项目的数量。我们通过项目值与数量的乘积计算项目总额。


    此循环将持续直到客户想要的所有。当他输入 `-1` 退出时，程序进入结账。计算税费和总额并将这些值显示在屏幕上。然后，程序要求客户输入支付金额。如果他输入的数值低于总额，则将不会继续。当用户输入有效值时，计算找零并打开“sales.dat”文件。注意
    `ios::app`。这表示文件不会被覆盖。此值将添加到文件的末尾。我们将保存项目数量和销售总额，最后关闭文件。


    现在，我们将查看 `DisplayCatalog()` 函数。该函数将向客户显示所有产品及其价格：


