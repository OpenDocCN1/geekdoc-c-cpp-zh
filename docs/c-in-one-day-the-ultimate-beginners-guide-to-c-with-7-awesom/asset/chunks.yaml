    First of everything, we must define our class for any card. Here we will work
    with multiple files, so, create a new file named `card.h` and add this code:


    ```cpp

    #ifndef _CARD_H_

    #define _CARD_H_


    class Card

    {

    public:

    int number;

    int sign;

    void Assign(int, int);

    };


    #endif

    ```


    When we use multiple files, the `#ifndef` is a pre-processor definition. With
    this, we assure that this file will only be included once. If it is included multiple
    times in the same program, will cause trouble for duplicated symbols.


    So, our card will have its number, its sign and a function named `Assign`, and
    with this function, we will assign each card its values. Now, create a new file
    named “card.cpp”:


    ```cpp

    #include "card.h"


    void Card::Assign(int num, int si)

    {

    number = num;

    sign = si;

    }

    ```


    In this file, there will be the implementations of our functions. Here, we assign
    the parameters from the function to the values that the object will have. Notice
    that we must include our “card.h” file. That is the one that we created before.
    It must be included so it can implement the functions.


    Now that we have the card classs we must create the player class. `Player.h` defines
    like:


    ```cpp

    #ifndef _PLAYER_H_

    #define _PLAYER_H_


    #include <iostream>

    #include <string>

    #include <vector>

    #include "card.h"


    using namespace std;


    class Player

    {

    public:

    string name;

    vector<Card> hand;

    void GetCard(Card);

    void ShowHand();

    };


    #endif

    ```


    The `Player` class will have two properties: the name of the player and a vector.
    Look: here we do not use any string. It is a `CARD`! The class we defined previously.
    This vector of cards can be viewed like the hand that the player owns. Also, we
    have a function named `GetCard()`, this function will allow our player to receive
    cards and add them to its hand. And finally, the function `ShowHand()`.


    This will only show the values inside the hand. Let’s see the implementation that
    will be inside “Player.cpp”:


    ```cpp

    #include <vector>

    #include "card.h"

    #include "player.h"


    using namespace std;


    void Player::GetCard(Card c)

    {

    hand.push_back(c);

    }


    void Player::ShowHand()

    {

    cout << name << "''s hand: ";

    for (int i = 0; i != hand.size(); i++)

    {

    cout << hand[i].sign << "-" << hand[i].number << " ";

    }

    cout << endl;

    }

    ```


    In this implementation, we must include `Card` and `Player` because we will be
    using both. The function `Card` receives a parameter of type `Card` and is inserted
    in the hand. The `showHand` loops through the hand of the player, obtains the
    values for each card and displays them to the screen.


    But… who will give the cards? The dealer obviously!


    Let’s define a class for our dealer in “dealer.h”:


    ```cpp

    #ifndef _DEALER_H_

    #define _DEALER_H_


    #include <string>

    #include <vector>

    #include "card.h"


    using namespace std;


    class Dealer

    {

    public:

    vector<Card> Deck;

    Dealer();

    Card GiveCard();

    void ShuffleCards();

    };


    #endif

    ```


    The dealer only has one property but it is the most important property from the
    game: The deck!


    And how will we represent de deck? Also as an vector of cards. The dealer will
    also have the hability to give cards and to shuffle the cards. Now, lets look
    the implementation:


    ```cpp

    #include <algorithm>

    #include <vector>

    #include <string>

    #include <random>

    #include <chrono>

    #include "dealer.h"

    #include "card.h"


    using namespace std;


    Card Dealer::GiveCard()

    {

    Card c = Deck[0];

    Deck.erase(Deck.begin());

    return c;

    }


    void Dealer::ShuffleCards()

    {

    unsigned seed =

    std::chrono::system_clock::now().time_since_epoch().count();

    shuffle(Deck.begin(), Deck.end(),

    std::default_random_engine(seed));

    }


    Dealer::Dealer()

    {

    for (int i = 0; i != 12; i++)

    {

    for (int j = 0; j != 4; j++)

    {

    Card newCard;

    newCard.number = (i + 1);

    newCard.sign = (j + 1);

    Deck.push_back(newCard);

    }

    }

    }

    ```


    Here we inserted new libraries:

    - Algorithm: will be used to shuffle our deck

    - Random: generate a random number

    - Chrono: access to timing libraries


    First, look at the `GiveCard()`. It will select the card that is on the top of
    the deck. Will remove it form them and then extract it to another part, that would
    be the hand of any player. On the `ShuffleCards()`. We will generate a time-based
    seed which we will use for shuffling the deck in a random order. Also, look at
    the `Dealer()` function. It has a nested loop (a loop inside another loop) and,
    with this, we generate the cards. From 1 to 12 and each from 1 to 4. After this,
    each card is inserted to the deck and now the deck is created!


    Now, the most important part, the main function:


    ```cpp

    #include <iostream>

    #include <string>

    #include <vector>

    #include "player.h"

    #include "card.h"

    #include "dealer.h"


    using namespace std;


    // Number of cards allowed in hand

    int CardNumber = 5;


    int main()

    {

    // Create players

    Player player1;

    Player player2;

    player1.name = "CPU";

    string name;

    cout << "Enter your name: ";

    cin >> name;

    player2.name = name;

    Dealer theDealer;

    theDealer.ShuffleCards();


    // Give cards to the players

    for (int i = 0; i != CardNumber; i++)

    {

    player1.GetCard(theDealer.GiveCard());

    player2.GetCard(theDealer.GiveCard());

    }

    player2.ShowHand();

    cout << "\n";

    player1.ShowHand();

    return 0;

    }

    ```


    There are no unknown libraries. Remember that we must add all of our class headers.
    There is the constant `CardNumber`. It will be used by the dealer for giving cards.
    When the main function starts, two players are created. We assign `player1` the
    name “CPU” and for player 2, the name will be given by the user.


    After this we create the dealer (and by creating the dealer, also the deck is
    created) and tell the dealer to shuffle cards. Now, from 0 to `CardNumber`, the
    dealer will obtain a card for each player, remove it from the deck and give it
    to the hand of the player. After this, both hands are shown and the outcome of
    the game can be determined.


    In this example, it can be very easy to understand how all of these real life
    objects are abstracted and taken to a programming paradigm like C++. Here there
    is no functional logic, only OOP logic.


    # Chapter 10: What to do next


    Up until now, we covered some basic and intermediate stuff concerning C++. However,
    in order to master C++, there are more specialized topics that should be learned.


    - **Memory management**: The use of the memory available from the operating system
    into our objects. The keywords `new` and `delete`. With these two keywords, you
    can manage how many memory is being used, assign when and to whom assign memory
    and even optimize your programs.

    - **Standard Template Library**: In this course we covered only two templates:
    `map` and `vector`. However, the C++’s STL is way beyond this these two objects.
    Structures like the `stack`, `queue`, `list`, `deque` and more are built-in within
    C++.

    - **Iterators**: The iterators is the way that C++ loops through the templates
    but do not use indexes. Instead, the iterators adapt to the needed container.

    - **Pointers**: Pointers are a very important part of C++ and will allow you to
    have a better memory management and create multiple objects saving huge amounts
    of memory.

    - **String management**: Multiple operations can be realized using strings. Search
    for patterns, complex concatenation, tokenize tokens, processing strings, replacing
    totally or partially strings, etc.

    - **Fundaments of OOP**: Although we covered some points from OOP in the sample
    projects, this course was not about OOP. So it would be a good idea to cover full
    OOP theory in order to generate better design of programming. Some concepts would
    be `class`, `abstraction`, `member`, `member functions`, `simple inherence`, `multiple
    inherence` and even `polymorphism`.

