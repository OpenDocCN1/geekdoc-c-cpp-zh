  trans: "\n\n![](img/cover.jpeg)\n\n# 一天学会 C++\n## 带有 7 个酷酷项目的 C++ 初学者终极指南\n\n作者：W.B\
    \ Ean\n版权 2016 - 版权所有 – W.B Ean\n\n版权所有。在没有作者明确书面、注明日期并签名的许可的情况下，不得以任何形式、任何方式（无论是电子的还是机械的，包括复印、录制或通过任何信息存储或检索系统）复制或传输本出版物的任何部分。\n\
    \n## 目录\n- 序言: 4\n- 第一章：C++ 基础: 5\n- 第二章：用 C++ 构建构建的类型: 1\n- 第三章：项目 #1 计算器\n-\
    \ 第四章：项目 #2 日程表\n- 第五章：项目 #3 学习笔记系统\n- 第六章：项目 #4 销售点\n- 第七章：项目 #5 命令行加密系统\n- 第八章：项目\
    \ #6 决斗游戏\n- 第九章：项目 #7 扑克游戏\n- 第十章：接下来做什么\n- 结论：你喜欢这本书吗？\n\n# 序言\n\n很多时候，我们好奇计算机内部是如何工作的。对于终端用户来说，实际上并没有与更深层次的内容进行交互。他们不需要了解关于计算机如何工作的细节或编程方面的知识。终端用户只会被功能和易于操作的简单界面所吸引。\n\
    \n然而，软件并不是凭空产生的。必须有人做这些“脏活”。或者像其他人所说的，这就是编程的艺术。计算机的主要部分是微处理器，它是执行用户所需的每个任务所需指令的大脑。这些处理器只理解二进制代码（0\
    \ 和 1），它们对英语或数字一无不知。\n\n那么，我们如何与处理器交互呢？我们使用编程语言。在历史上，已经开发许多用于程序员与机器之间交互的语言。最近，编程已成为主要的研究领域，根据用途有多种编程语言供选择。\n\
    \n最受青爱的语言之一是 `C++`。为什么？主要因为它的速度、标准以及广泛的应用范围。`C++` 是作为 `C` 编程语言的改进版而开发的。这种改进增加了许多功能，如支持面向对象编程、模板、内存处理、错误处理以及为程序员提供的更多工具。\n\
    \n《一天学会 C++》课程面向想要学习 `C++` 编程语言基础的人。我们将涵盖最基础的概念和内容，非常适合初学者，随着课程的进行，我们将添加语言的更多功能，并开始开发一些现实世界的项目。\n\
    \n本课程分为四个部分：\n\n1. **C++ 基础**：在本章中，我们将涵盖 `C++` 的基础知识。这是初学者课程的核心。在这里，我们将涵盖每个 `C++`\
    \ 程序的 Basic structure。对库系统的简要说明。`C++` 的标准输入输出系统。数据类型另一个需要涵盖的基础主题，并将进行讨论，包括声明、使用和存储值的示例。将涵盖字符串处理。\n\
    2. **用 C++ 可以做的事项**：在本章中，我们将讨论使用 `C++` 编程语言可以开发什么种软件。\n3. **用 C++ 实现项目**：在这里我们将编写一些代码！我们选择了并编写了\
    \ 7 个项目，以向你展示如何使用 `C++` 做有用的事情。\n4. **接下来做什么**：最后，我们将对一些主题给出建议来结束课程，这些主题虽然对于基础来说并不必要，但在学习基础之后是很好的后续方向。这些功能可以让你设计更优化、更复杂的软件。\n\
    \n那么，让我们开始吧！\n\n# 第一章：C++ 基础\n\n`C++` 是一种多用途编程语言。它是什么？它是指可以用于编写程序员想要的任何类型的软件。它可以是一个简单的程序（如计算两个数字之和），也可以是完整的操作系统（例如，`Windows`）和视频游戏（PS3,\
    \ PS4, XBOX）。`C++` 相比其竞争对手（如 `C#` 或 `Java`）具有的一些优势，首先是它的速度。当你编写一个 `C++` 程序时，它会被编译成与操作系统一起运行的二进制文件。其次，它是标准的。`C++`\
    \ 从头到尾都有一套非常明确标准，这意味着如果程序员编写的是标准的 `C++` 代码，它可以以最小或很小的更改移植到其他编译器。\n\n然而，并不是一切都如听起来那么简单。虽然\
    \ `C++` 非常快，但由于它拥有的库以及将在后续章节讨论的标准模板库 (`STL`)，它很难掌握。\n\n但让我们从语言的基础开始吧。\n\n### 指令和编译器\n\
    \n在本文中我们将使用 GNU C++ 编译器 `g++` 以及 IDE `CodeLite`。所有代码将用标准的 `C++` 编写。`CodeLite`\
    \ 和编译器可以从 http://downloads.codelite.org/ 下载。\n\n### 库\n\n`C++` 的完整扩展拥有许多用途的库：输入和输出、数学、内存管理、时间、文件处理、字符串处理等许多功能。然而，当我们开始编写代码时，必须定义在程序中使用哪些库哪些。\n\
    \n自 2003 年以来，`C++` 还实现了一个名为 `namespaces`（命名空间）的特性，这是组织语言内部所有内容的另一种方式。\n\n### 主函数\n\
    \n在 `C++` 中，所有程序必须包含一个名为 `main` 的函数（或代码段）。该函数的作用指示编译器程序从哪里开始执行。\n\n### 输入和输出 (I/O)\n\
    \n`C++` 中的几乎每个程序都需要输入和输出。这个规则有一些例外，但通常情况下总会有 I/O。输入是进入计算机的数据，如数字、单词。输出是显示在屏幕上（也称为控制台）的数据。`C++`\
    \ 中用于这些操作的库名为 `iostream`。\n\n在 `iostream` 内部，有两个对象将用于从键盘读取数据并向控制台显示数据：`cout` 和\
    \ `cin`。\n\n在编写任何程序之前，在 `CodeLite` 中我们必须创建一个项目。在 `CodeLite` 中创建新项目的步骤如下：\n\n*\
    \ 在主界面上看到一个文字为 `NEW` 的按钮。点击它。\n* 当新窗口出现时，在左侧选择 `Console` 并在列表中选择 `Simple executable\
    \ (g++)`。\n* 在右侧面板中为你的项目选择名称，例如 `Example1`。\n* 在项目路径中，选择计算机上一个用于保存代码的文件夹。\n* 在编译器部分，确保选择了\
    \ `gnu g++`。\n* 点击 `OK`\n\n完成这些操作后，转到屏幕左侧，将找到一个为你选择的项目命名的文件夹。打开它，你将看到另一个名为 `src`（source\
    \ 的缩写）的文件夹。在 `src` 内部将有一个名为 `main.cpp` 的文件。这就是你编写 `C++` 代码的文件。\n\n`C++` 中一个简单的输入和输出示例代码如下所示：\n\
    \n```cpp\n#include <iostream>\n\nusing namespace std;\n\nint main()\n{\n    cout\
    \ << \"This is my first C++ program\";\n    return 0;\n}\n```\n\n正如你可以看到的，第一行我们包含了\
    \ I/O 库。在第二行，通过 `using namespace std`，我们告诉 `C++` 我们想要使用所选库中的所有功能（如 `cout`）。\n\n"
- fmt: "\nAfter this, we find our main function. Here is where all the execution begins.\
    \ All functions in C++ hace an opening and closing brace that indicates where\
    \ the function starts and ends. Inside main, there is the line `cout << \"This\
    \ is my first C++ program\";` This line will output everything inside the double\
    \ quotes to the console. Notice that this line ends with a semicolon. In C++,\
    \ all the instructions inside a block of code end with a semicolon (there are\
    \ some exceptions that will be covered).\n\nYou can see that between the `cout`\
    \ object and our text, there are two `<` signs. They are named overloaded operators\
    \ and they represent the direction where the information is traveling, in this\
