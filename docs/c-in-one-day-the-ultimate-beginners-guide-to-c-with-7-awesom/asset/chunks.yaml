    # Chapter 6: Project #4 Sales Point


    This project will have a catalog of different product that are sold in a common
    supermarket. All the products are stored in a file including their price. This
    file can be modified. The program gives the option to the user for selling products
    to the customers, calculating the subtotal, the tax and the final total of the
    whole sale. When the sale is finished, the item quantity and the total are stored
    on a separate file. This file stores all the sales and will be used to generate
    total reports from the sales. Let’s start as always, with the libraries:


    ```cpp

    #include <cstdlib>


    #include <fstream>


    #include <iostream>


    #include <string>


    #include <vector>


    using namespace std;


    vector<string> products;


    vector<float> prices;

    ```


    These are all known libraries except for `<cstdlib>`. This is a C library and
    we will use the function `atof`, which will convert a string to a float value.
    We will see this a little bit later. The two global vectors will hold the name
    and the values (prices) for each item. Let’s go to the `main` function, which
    is very similar to the previous projects:


    ```cpp

    int main()


    {


    LoadValues();


    int sel = 0;


    while(true)


    {


    cout << "SUPERMARKET SYSTEM\n\n";


    cout << "[1] New client\n";


    cout << "[2] View Catalog\n";


    cout << "[3] View sales\n";


    cout << "[4] Exit\n";


    cout << "Select > ";


    cin >> sel;


    switch(sel)


    {


    case 1:


    NewClient();


    break;


    case 2:


    DisplayCatalog();


    break;


    case 3:


    DisplaySales();


    break;


    case 4:


    return 0;


    break;


    }


    }


    return 0;


    }

    ```


    Before anything, you can see that the first thing we do is call to the `CallValues`
    function. This function will load the values of the products from the file named
    “products.dat”. Look at the function:


    ```cpp

    void LoadValues()


    {


    // The program will load a file named "products.dat"

    // This information will be stored to the vectors


    string temp;


    float tval = 0.0;


    ifstream productInfo;


    productInfo.open("products.dat");


    if(productInfo.is_open())


    {


    while(productInfo >> temp)


    {


    products.push_back(temp);


    productInfo >> temp;


    tval = atof(temp.c_str());


    prices.push_back(tval);


    }


    }


    else

    {


    cout << "Product information file not found. Data was not return.\n";


    }


    }

    ```


    The program opens the file “products.dat” and if it’s open, then will read all
    the values. The first one is inserted in `products` and then, reads again, this
    time for the price. The price is read as a `string`. It is read as a string, but
    we cannot make arithmetic operations with strings, so we use `atof()` to convert
    from string to float. This value is stored in `tval` and we insert `tval` in the
    `prices` vector.


    Returning to `main`, we have our typical menu and the user is allowed to select
    which option wants to execute. The first option, `NewClient()`, will perform a
    new sale:


    ```cpp

    void NewClient()


    {


    int id = 0;


    int qty = 0;


    int itemqty = 0;


    float sum = 0.0;


    cout << "NEW SALE\n";


    cout << "INSTRUCTIONS:\n";


    cout << "Enter the ID of the product. After this, enter the quantity and press
    enter\n";


    cout << "If you have finished, enter -1 on product and will exit\n\n";


    while(true)


    {


    cout << "Enter product ID: ";


    cin >> id;


    if(id == -1)


    {


    break;


    }


    cout << "Enter quantity: ";


    cin >> qty;


    float value = prices[id] * qty;


    sum = sum + value;


    itemqty++;


    cout << endl;


    }


    float tax = (sum*0.0825);


    float total = (sum+(sum*0.0825));


    // After the customer has entered all items


