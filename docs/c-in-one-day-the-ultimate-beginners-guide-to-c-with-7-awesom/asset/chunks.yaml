    ## Functions In C++


    Functions In C++ are a way of modeling the program. Not all the code is written
    inside the `main` function because it would be very difficult to follow and also
    to imagine how all of the piece of code connect themselves. Instead, we divide
    the program into small modules, where each one takes care of a single task.


    **Important note**: In the code, the `main` function must be the last function.
    Write all of the following functions in lines before `main`.


    In this example, the function `NewContact()` has the job to request the user to
    give a new name and a new phone, like this:


    ```cpp

    void NewContact()

    {

    string name;

    string phone;

    cout << "\n\Enter a name for the contact: ";

    cin >> name;

    cout << "Enter the phone for this contact: ";

    cin >> phone;

    cout << "The ID for this contact will be " << Names.size() <<

    "\n\n";


    Names.push_back(name);

    Phones.push_back(phone);

    }

    ```


    Look how the function starts, it is very similar to the `main` function. The word
    `void` means that this function does not return anything (right now may sound
    confusing, but you’ll get it soon). After the brace is where the function code
    actually starts. The first thing we do is to declare a couple of string, one named
    `name` and the other one `phone`. These string will be used for the input from
    the user.


    We request the user to enter the name and the phone for the new contact. Now that
    we have it, we must assing this contact its ID number. Remember classes? The `vector`
    contains a property named `size()`, which tells us how many elements does the
    vector holds. In this case, we assign the ID as the current size.


    After that, we use another great tool from `vector`, actually the most basic one:
    `push_back`. Imagine a vector like a deck of cards. The function `push_back` will
    add a new element at the back of the actual deck.


    For this example, we add at the end of our `name` vector the value that the user
    entered. The same thing for the `phones`. And now we have both values in our vectors.


    ## Search Functions


    Now that we have our function for inserting values, we need to retrieve them from
    their storage.


    That is where the functions for search will be implemented. As mentioned before,
    we will use two types for searching values: one using the ID of the contact and
    the other one using the name.


    For the ID, our function will be like this:


    ```cpp

    void SearchByID()

    {

    int value;

    cout << "\n\Enter the ID of the contact to search: ";

    cin >> value;

    if(value >= Names.size())

    {

    cout << "This ID does not exist\n\n";

    return;

    }

    cout << "Information for contact " << value << "\n";

    cout << "Name: " << Names[value] << "\n";

    cout << "Phone: " << Phones[value] << "\n";

    }

    ```


    Again, first off everything, we write the function name, in this case will be
    `SearchByID`. After this, the variable `value` will contain the value that the
    user wants to search. Before making any search, we must assure that this variable
    is withing range from our `vector`. What does this means? Well, suppose we have
    a vector with 5 elements and the user inputs the number 8. What should we do?


    We already know that our vector is 5 elements long, so, if the number that the
    user enters in the search is equal or greater than the size of our vector, then
    it will be of range.


    This is implemented using the `if` shown on the function. If this certain condition
    occurs, it will show a message on our program stating that “This ID does not exist”
    followed by the `return` keyword.


    The function of `return` is to terminate the function. In order to NOT execute
    any search, we must exit the function before it reaches the next code. Because
    of this, the `return` keyword is added and after the `cout` inside our condition,
    the function immediately ends and return to the `main` function.


    If the value entered by the user is a valid one, then, it will locate the information.
    Notice how in the last two `cout`s we use the `[]` operator. This is called an
    index and it is used to differentiate values within the `vector`. It goes from
    0 up to `size() -1`.


    Let’s suppose that the user enters for name the values: John, Michael, Sean. And
    for the phones: 111111, 333333, 555555. Then, our vectors would be like this:


    `Names` = John, Michael, Sean

    `Phones`: 111111,333333,555555


    If we want to retrieve the information, `Names[0]` would be John; `Names[1]` would
    be Michael and `Names[2]` would be Sean. The same occurs with the phones. So here,
    we use the ID given to retrieve these data and the show it to the screen.


    Finally, we’ll go to the search function but this time we will search by the name
    of the contact we want to find. The code for this function looks like this:


    ```cpp

    void SearchByName()

    {

    bool found = false;

    string name;

    cout << "\n\Enter the name to search: ";

    cin >> name;

    for(int i = 0; i != Names.size(); i++)

    {

    if(Names[i] == name)

    {

    cout << "Name: " << Names[i] << "\n";

    cout << "Phone: " << Phones[i] << "\n";

    found = true;

    }

    }

    if(!found)

    {

    }

    }

    ```


    Here we declared two variables, `found` and `name`. `name` will be the string
    that we want to look for and `found` is a variable of data type `BOOL` (those
    that are only true or false) and will tell us if our search was either successful
    or failed.


    First, we request the user to enter the name to search for and after this, we
    will use a `for` loop to cycle through all of the elements. The accumulator is
    started, like usual, at zero. Now even notice how our condition has changed: `i
    != Names.size()`


    Thanks to this little function named `size()`, our for loop will be able to go
    through all of the elements until it reaches the end of itself. With this `size()`
    function, we can be completely sure that we do not go out of bound of our vector.
    If you do not use `size()`, then you will have some kind of risk looping through
    the vector. If this error happens, it will be on runtime and the compiler wont
    warn you about this, so it’s safer to use the `size` function.


    Each lap that our loop has will compare the string at the `i` position in the
    vector with the string that the user entered. If both strings are equal, then
    it will show the user the name and the phone for that contact. Also, it will change
    the state of `found` to `true`.


    After exiting the loop, it will check if the variable `found` is `false`. The
    exclamation sign at the start of the variable means a negation (NOT) so, if `found`
    IS `false`, then the flow will fall on to the block of code of the `if` and show
    the user the message “No contact was found with this name”.


    After verifying the state, the function ends and the flow of the program returns
    to the `main` function.


    ```cpp

    cout << "No contact was found with this name!\n\n";

    ```


