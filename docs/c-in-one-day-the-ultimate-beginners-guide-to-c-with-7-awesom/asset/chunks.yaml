    的属性，它告诉我们 vector 包含多少个元素。在这种情况下，我们将 ID 分配为当前的大小。


    之后，我们使用了 `vector` 的另一个强大工具，实际上是最基础的一个：`push_back`。将 `vector` 想象成一叠扑牌。`push_back`
