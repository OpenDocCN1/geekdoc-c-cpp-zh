    ```


    除了 `<cstdlib>` 之外，这些都是已知库。这是一个 C 库，我们将使用函数 `atof`，它将把字符串转换为浮点数值。我们稍后会看到它。这两个全局向量将持有每个项目的名称和值（价格）。让我们进入
    `main` 函数，它与之前的项目非常相似：


    ```cpp

    int main()


    {


    LoadValues();


    int sel = 0;


