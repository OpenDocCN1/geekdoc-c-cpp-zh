  raw: 'After this, we find our main function. Here is where all the execution begins.
    All functions in C++ hace an opening and closing brace that indicates where the
    function starts and ends. Inside main, there is the line cout << “This is my first
    C++ program”; This line will output everything inside the double quotes to the
    console. Notice that this line ends with a semicolon.  In C++, all the instructions
    inside a block of code end with a semicolon (there are some exceptions that will
    be covered).


    You can see that between the cout object and our text, there are two < signs.
    They are named overloaded operators and they represent the direction where the
    information is traveling, in this case the information is going outside the computer.
    As you may think, when we want to make an input to the program, we will be using
    the >> operators.


    For executing the program, go to the Build menu and select the option Build and
    Run project. You will see how a black screen appears. This is the console and
    this is where we will perform our input and output.


    Pausing the execution


    If the console appears and immediately closes, don’t worry, it is normal. But
    we need to see the output. For this, add:


    cin.get()


    Before return 0;


    Data Types and variables


    When we work with a program, there are many types of data we can use. For example:
    numbers, text, and some special types of data. All of these are called Data Types.
    They are very important in C++ because it is the main point for developing inputs.
    In C++ we have 3 categories: numeric, alphabetic and binary.


    In the numeric category we have 3 types of data:


    *   int – Represent integer numbers


    *   float – Represents numbers with 7 decimal positions after the point


    *   double – Represents numbers with 15/16 decimal positions after the point


    There are more specific numeric data types but for the purposes of this article,
    these three are enough. For the alphabetic category we have two types of data:


    *   char – Store one alphanumeric digit


    *   string – Store a sequence of alphanumeric digits


    And in the binary category, there is only one data type:


    *   bool – Store a true or false. Zero or One.


    The bool data type may sound very useless at first but it has its handy applications
    when programming some specific routines.


    But, why do we need all of these types? Simple: In C++ there is a concept named
    variable. A variable can store information of any of these mentioned types. Imagine
    a variable like a box that can hold some value for a certain time and you can
    do any operation with that value.


    In C++, before using variables, we must declare them. How? Like this:


    <datatype> <nameOfVariable>


    Let’s make a simple example. We want to calculate the sum of two numbers. These
    numbers are integer. So, in order to accomplish this, we must declare three variables,
    one for each number and another one for the result:


    int numberA;


    int numberB;


    int result;


    As you can see, for each variable we defined the int type and after the data type,
    the name for the variable. You can name the variables in the way that you want,
    but it is recommendable to give them a name similar to the use it will have. Now
    the question is: How can we assing a value? We use the equal =  operator:


    numberA = 10;


    numberB = 5;


    result = numberA + numberB;


    For this, I assigned 10 to numberA and 5 to numberB. After that, we assigned the
    value of result to the sum of both variables. The complete program would look
    like this:


    #include <iostream>


    using namespace std;


    int main()


    {


                  int numberA;


                  int numberB;


                  int result;


                  numberA = 10;


                  numberB = 5;


                  result = numberA + numberB;


                  cout << result;


                  cin.get();


                  return 0;


    }


    Notice that here, we used cout << result; for our output without the double quotes.
    When you use double quoutes, ALL the text inside the quotes will go directly to
    the screen. However, when we want to display the value of a variable, we must
    write the name of the variable without quotes. C++ then will look for the value
    inside the variable and show it on your screen.


    There are some limitations to this code. For example: we have to assign values
    directly inside the code for the sum. The optimal way would be giving the user
    the option for input the values into the program. This can be done like this:


    #include <iostream>


    using namespace std;


    int main()


    {


                  int numberA;


                  int numberB;


                  int result;


                  cout << "Enter first value: ";


                  cin >> numberA;


                  cout << "Enter second value: ";


                  cin >> numberB;


                  result = numberA + numberB;


                  cout << "The sum of both values is: " << result;


                  cin.get();


                  return 0;


    }


    Notice some differences in relation to the other code. First, the declaration
    of the three variables we need. After this, we tell the user to enter the first
    value. We can see how cin>>numerA  is used. With this line, we tell C++ to capture
    the input from the keyboard and the value assign it to the variable numberA. The
    same for numberB. After this, the result of the sum is calculated and is sent
    to the output. Notice how in the last output, the overloaded operation appears
    twice. This is very convenient we want to show multiple values in the same line.


    Now, let’s say we want to know the average of these two values. We can modify
    the result line in the following way:


    result = (numberA + numberB) / 2;


    The parenthesis indicates that the mathematical operations inside the parenthesis
    will be done firstly. After that, it will continue with the rest of the expression.
    However, we have a problem with this line. Suppose numberA has the value of 5
    and numberB has a value of 6\. The result would be 5.5\. No problem here until…
    we notice that result is declared as int. And, according to our data types, the
    int data type is reserved only for integer. So, what should we use? We must change
    the datatype of result to either float or double.


    double result;


    Besides sum and divition, there are more math operators to perform operations.
    The sustraction is performed with the “-“ operator, the product is performed with
    the “*” operator. And a special case is the “%” operator, named Modulus. The modulus
    will return the left over of a division.


    More complex mathemathical operations can be performed with C++ using the <complex>
    library. Por example, power, square root, trigonometrical functions, and more.


    String I/O


    The management of string in C++ can be done with the library <string>. It includes
    the object string that we need to use. For example, let’s suppose we want a program
    to say goodbye to anyone. It would look like this:


    #include <iostream>


    #include <string>


    using namespace std;


    int main()


    {


                  string name;


                  cout << "What''s your name? ";


                  cin >> name;


                  cout << "Goodbye " << name;


                  cin.get();


                  return 0;             


    }


    The first thing you may notice is that we added the string library. Inside main,
    just like any variable, we declared name as string type. After that, we requested
    the user to write their name and then output the sentence “Goodbye” followed by
    the given name. Let’s see another example:


    #include <iostream>


    #include <string>


    using namespace std;


    int main()


    {


                  string name;


                  string lastname;


                  string fullname;


                  cout << "What''s your name? ";


                  cin >> name;


                  cout << "And your last name? ";


                  cin >> lastname;


                  fullname = name + " " + lastname;


                  cout << "Goodbye " << fullname;


                  cin.get();


                  return 0;             


    }'
