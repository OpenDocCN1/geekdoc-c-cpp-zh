    # Chapter 8: Project #6 Duel Game


    This project is a simple demonstration of an automated videogame, everything running
    through console. The main idea is a duel. A confrontation from cowboy vs cowboy.
    There are three different kinds of cowboys:


    * Basic

    * Resistence

    * Fast Attack


    Where the Basic has normal values, the resistance has lower attack point but more
    life points and the fast attack has more attack points but less life points. The
    user will enter the kind of cowboy that he wants. After this, the machine will
    randomly select any of the three. In this program, we will use classes for defining
    our types of cowboys. Let’s look at the headers:


    ```cpp

