    ## 搜索函数


    现在我们已经有了插入值的函数，需要从存储器中检索它们。


    这正是实现搜索函数的地方。正如之前所提到的，我们将使用两种类型来搜索值：其中一种是使用联系人的 ID，另一种是使用姓名。


    对于 ID，我们的函数将像这样：


    ```cpp

    void SearchByID()

    {

    int value;

    cout << "\n\Enter the ID of the contact to search: ";

    cin >> value;

    if(value >= Names.size())

    {

    cout << "This ID does not exist\n\n";

    return;

    }

    cout << "Information for contact " << value << "\n";

    cout << "Name: " << Names[value] << "\n";

    cout << "Phone: " << Phones[value] << "\n";

    }

    ```


    同样，首先，我们写函数名，在这种情况下是 `SearchByID`。之后，变量 `value` 将包含用户想要搜索的值。在进行任何搜索之前，我们必须确保该变量在我们
    `vector` 的范围内。这意味着什么呢？假设我们有一个有 5 个元素的 vector，而用户输入了数字 8。我们该怎么办？


    我们已经知道 vector 的长度是 5 个元素，所以，如果用户在搜索中输入的数字等于或大于我们 vector 的大小，那么就会越界。


    这是通过函数中显示的 `if` 实现的。如果发生了这个特定条件，它将在我们的程序上显示一条消息说“This ID does not exist”，然后是 `return`
    关键字。


    `return` 函数的作用是终止函数。为了不执行任何搜索，我们必须在到达下一段代码之前退出函数。因如此，添加了 `return` 关键字，在我们条件内部的
    `cout` 之后，函数立即结束并返回到 `main` 函数。


    如果用户输入的值是有效的，那么它将定位信息。注意在最后两个 `cout` 中我们使用了 `[]` 运算符。这被称为索引，用于区分 `vector` 内部的值。它从
    0 到 `size() -1`。


    假设用户输入的姓名的值为：John, Michael, Sean。电话的值为：111111, 333333, 555555。那么，我们的 vector 将如下所示：


    `Names` = John, Michael, Sean

