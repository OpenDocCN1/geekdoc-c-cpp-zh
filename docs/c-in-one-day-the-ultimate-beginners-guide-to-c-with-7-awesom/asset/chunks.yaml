    switch(sel)


    {


    case 1:


    NewClient();


    break;


    case 2:


    DisplayCatalog();


    break;


    case 3:


    DisplaySales();


    break;


    case 4:


    return 0;


    break;


    }


    }


    return 0;


    }

    ```


    在开始之前，你可以看到我们做的第一件事是调用 `CallValues` 函数。该函数将从名为“products.dat”的文件中加载产品值。看这个函数：


    ```cpp

    void LoadValues()


    {


    // 程序将加载一个名为 "products.dat" 的文件

    // 这些信息将存储在向量中


