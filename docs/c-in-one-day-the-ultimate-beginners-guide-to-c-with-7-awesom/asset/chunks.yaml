  trans: "\n\n在此之后，我们找到了主函数。这里是所有执行开始的地方。C++ 中的所有函数都有左大括号和右大括号表示函数的开始和结束。在 `main`\
    \ 函数中，有这样一行 `cout << \"This is my first C++ program\";` 这一行将把双引号内的所有内容输出到控制台。注意这一行以分号结尾。在\
    \ C++ 中，代码块中的所有指令都以分号结尾（会有一些特殊情况，将在后文中介绍）。\n\n你可以看到，在 `cout` 对象和我们的文本之间有两个 `<`\
    \ 符号。它们被称为重载运算符，代表了信息传输的方向，在这种情况下，信息正在向计算机外部传输。正如你可能想的那样，当我们想要向程序输入内容时，我们将使用 `>>`\
    \ 运算符。\n\n要执行程序，请进入 Build（构建）菜单并选择“Build and Run project”（构建并运行项目）选项。你将看到一个黑屏出现。这就是控制台，也是我们进行输入和输出的地方。\n\
    \n### 暂停执行\n\n如果控制台出现后立即关闭，不要担心，这是正常的。但我们需要看到输出。为了实现这一点，请在 `return 0;` 之前添加：\n\
    \n```\ncin.get()\n```\n\n### 数据类型与变量\n\n当我们编写程序时，有许多我们可以使用的数据类型。例如：数字、文本和某些特殊类型的数据。所有这些都被称为数据类型（Data\
    \ Types）。它们在 C++ 中非常重要，因为它是开发输入的关键。在 C++ 中，我们有三类：数值、字母和二进制。\n\n在数值类别中，我们有 3 种数据类型：\n\
    \n* `int` – 代表整数\n* `float` – 代表小数点后有 7 位数字数字\n* `double` – 代表小数点后有 15/16 位数字\n\
    \n还有更具体的数值数据类型，但对于本文而言，这三种已经足够了。在字母类别中，我们有两种数据类型：\n\n* `char` – 存储一个字母数字\n* `string`\
    \ – 存储一个字母数字序列\n\n在二进制类别中，只有一种数据类型：\n\n* `bool` – 存储真或假。0 或 1。\n\n`bool` 数据类型初听起来可能非常没用，但在编写某些特定程序时它有非常方便的用途。\n\
    \n但是，为什么我们需要所有这些类型呢？简单来说：在 C++ 中有一个名为“变量”（variable）的概念。变量可以存储上述任何一种类型的信息。想象变量就像一个盒子，可以存储一段时间的某个值，你可以对该值进行任何操作。\n\
    \n在 C++ 中，在使用变量之前，我们必须声明它们。怎么做呢？如下所示：\n\n`<datatype> <nameOfVariable>`\n\n让我们举简单的例子。我们想要计算两个数字之和。这些数字是整数。因此，为了实现这一点，我们必须声明三个变量，每个数字一个，另一个用于结果：\n\
    \n```\nint numberA;\nint numberB;\nint result;\n```\n\n你可以看到，对于每个变量，我们定义了 `int`\
    \ 类型，在数据类型之后是变量名。你可以按照喜欢的方式命名变量，但建议给它们起一个与其用途相似的名称。现在问题是：我们如何赋值？我们使用等号 `=` 运算符：\n\
    \n```\nnumberA = 10;\nnumberB = 5;\nresult = numberA + numberB;\n```\n\n为此，我给\
    \ `numberA` 分配了 10，给 `numberB` 分配了 5。之后，我们将两个变量之和的值赋值给 `result`。完整的程序看起来如下：\n\n\
    ```cpp\n#include <iostream>\n\nusing namespace std;\n\nint main()\n{\n    int\
    \ numberA;\n    int numberB;\n    int result;\n    numberA = 10;\n    numberB\
    \ = 5;\n    result = numberA + numberB;\n    cout << result;\n    cin.get();\n\
    \    return 0;\n}\n```\n\n注意，这里我们使用 `cout << result;` 进行输出，没有使用双引号。当你使用双引号时，引号内的所有文本将直接显示在屏幕上。然而，当我们想要显示变量的值时，必须不带引号写变量名。C++\
    \ 然后将查找变量内部的值并显示在你的屏幕上。\n\n这段代码有一些局限性。例如：我们必须在代码中直接为和赋值。最好的方法是让用户提供输入值到程序的选项。可以这样做：\n\
    \n```cpp\n#include <iostream>\n\nusing namespace std;\n\nint main()\n{\n    int\
    \ numberA;\n    int numberB;\n    int result;\n    cout << \"Enter first value:\
    \ \";\n    cin >> numberA;\n    cout << \"Enter second value: \";\n    cin >>\
    \ numberB;\n    result = numberA + numberB;\n    cout << \"The sum of both is:\
    \ \" << result;\n    cin.get();\n    return 0;\n}\n```\n\n（注：第二个示例的源代码在最后一个块中包含大量的损坏字符/重复，已清理并调整，以反映有效的\
    \ C++ 语法，同时保留了文中描述的逻辑。）\n\n"
- fmt: "\nIn this code, I declared a couple of extra strings. We also request the\
    \ user their last name. In programming, we call `concatenate` to the action of\
    \ attach strings. In this example, we concatenate `name`, an empty space and `last\
    \ name` to produce a unique string containing the full name. And that string is\
    \ sent to the output.\n\n# Scape Sequences\n\nThis is an addition to the I/O topic.\
    \ In C++, there are special sequences that allow the programmer a better distribution\
    \ of the information that is displayed. The sequences are:\n\n* `\\n` – End of\
    \ line\n* `\\t` – Insertion of tabular space\n\nWith these two sequences, you\
    \ can design a well distributed interface. Look at the example:\n\n```cpp\ncout\
    \ << “Here is a line\\n” << “Here is another line\\t” << “I am after a tab space”;\n\
    ```\n\nThis is a simple example of the sequences and can be used only with the\
    \ `cout` object.\n\n# Program Flow\n\nUp until this point. We have covered the\
    \ types of data, how to show info to the screen and capturing data from the keyboard.\
    \ Now, a very important part of C++ are the flow control instructions. With this\
    \ part, you will be able to take decisions and make complex programs.\n\n## If\
    \ Structure\n\nThe `if` is a conditional structure. Like its own name says, if\
    \ something happens, then do this thing. The structure goes as follow:\n\n```cpp\n\
    if(condition)\n{\n    // do something\n}\n```\n\nThe `condition` is a expression\
    \ in which the result will be true or false. There are some operators to evaluate\
    \ the condition:\n\n* `EQUALS (==) ` : Will be true if both values are the same.\
    \ Example: `a=b`\n* `AND (&&) ` : Will be true if all values are true.\n* `OR\
    \ (||) ` : Will be true if any of the values are true.\n* `NOT (!) ` : Will be\
    \ true if the value is false.\n* `GREATER (A>B)` : Will be true if `A` is greater\
    \ than `B`\n* `LESS (A<B)` : Will be true if `B` is greater than `A`.\n\nLet’s\
    \ suppose we must evaluate if a student approved or not a course. Look a the following\
    \ code:\n\n```cpp\n#include <iostream>\nusing namespace std;\n\nint main()\n{\n\
    \    int note;\n    cout << \"Enter your note: \";\n    cin >> note;\n    if(note>6)\n\
    \    {\n        cout << \"Congratulations. You passed!\";\n    }\n    return 0;\n\
    }\n```\n\nWe ask the user for their course note. If the user enters a number greater\
    \ than 6, then the flow of the program enters the code block surrounded by the\
    \ braces. If not, it ignores this block and continues its execution. Notice that\
    \ the `IF` instruction does not end with semicolon. This is because it is followed\
    \ by a block of code. But, what happens when the note is less than six?\n\nWe\
    \ use the `else` keyword.\n\n```cpp\n#include <iostream>\nusing namespace std;\n\
    \nint main()\n{\n    int note;\n    cout << \"Enter your note: \";\n    cin >>\
    \ note;\n    if(note>6)\n    {\n        cout << \"Congratulations. You passed!\"\
    ;\n    }\n    else\n    {\n        cout << \"Sorry. You did not passed\";\n  \
    \  }\n    return 0;\n}\n```\n\nThis code is exactly the same as the last one with\
    \ one difference. We added the `else` keyword with its respective block of code.\
    \ First, the condition `note>6` is evaluated. If this condition is true, then\
    \ the block of code next to the `if` will be executed and the `else` block code\
    \ will be ignored. If the condition is false, then the `if` block code will be\
    \ ignored and the `else` block code will be executed.\n\nWe can also add multiple\
    \ conditions in the `if` clause. Look at the following code:\n\n```cpp\nif(note==10)\n\
    {\n    cout << \"Excellent!\";\n}\nelse if(note>6 && note<10)\n{\n    cout <<\
    \ \"Congratulations. You passed\";\n}\nelse\n{\n    cout << \"Sorry. You did not\
    \ approve\";\n}\n```\n\nWe added something called `else if` and it allows the\
    \ programmer to add multiple conditions on the same `if`. In this example, if\
    \ `note` equals to ten, only the first block of code is going to be executed.\
    \ On the second contidion, if `note` is greater than six AND `note` is less than\
    \ 10, then the middle block of code will be executed. You can add as `else if`\
    \ as you may want or need. However, neither the `IF` nor any of the `ELSE IF`\
    \ conditions are true, then the `ELSE` block of code will be executed. The `else`\
    \ is only executed when none of the `IF` are true.\n\nMaking multiple conditions\
    \ might think “Hey, what if I have a lot of conditions, like 20 or 30? It will\
    \ be a lot of code” and yes, you are right. It would be a lot of hard having many\
    \ conditions. But C++ has a answer for this: the `switch` instruction. With `switch`,\
    \ we can use multiple conditions in a simple way. Continuing the same example\
    \ of the notes, let’s we want a different message for the approving notes. Starting\
    \ from six, there will be 5 messages for approving and a single message for failing.\
    \ Using the `switch` statement, the code would look like this:\n\n```cpp\nswitch(note)\n\
    {\n    case 10:\n        cout << \"Excellent\";\n        break;\n    case 9:\n\
    \        cout << \"Very note\";\n        break;\n    case 8:\n        cout <<\
    \ \"Good job!\";\n        break;\n    case 7:\n        cout << \"Not bad. Keep\
    \ working\";\n        break;\n    case 6:\n        cout << \"You passed by a bit\"\
    ;\n        break;\n    default:\n        cout << \"You did not approve\";\n}\n\
    ```\n\nThe first thing to watch is that the variable we want to compare goes inside\
    \ curly braces next to the `switch` statement. It does not need to end with semicolon\
    \ because it is followed by the block of code for the `switch`. For each comparison,\
    \ we use the `case` keyword followed by the value we are looking. In case `note`\
    \ has a value of 10, the message “Excellent” goes to the output. For each `case`,\
    \ we must add the `break` keyword. If we do not do this, the `switch` statement\
    \ will fall to the next `case` until either finds a `break` or the end of the\
    \ `switch` code block.\n\n# Loops\n\nAlright, so you now know how to take decisions\
    \ on your program. You can direct the flow to another pieces of code and decide\
    \ which one execute and when. Excellent. Let’s say that you want to calculate\
    \ an average. Each student is taking 5 subjects and you want to know the average\
    \ of those note. Simple, you sum them up and divide by 5. But, there is not one\
    \ student on the school. Can you copy the code and repeat this 10 or 15 times?\
    \ Well.. yes, you could do it, but the code would start being unmanageable. So,\
    \ how can we fix this problem? C++ has the right tool for the job, and it is loops.\n\
    \nA loop is a block of code that will repeat itself until a condition is satisfied.\
    \ We have two kinds of loops: counting loops and conditional loops. The first\
    \ one is `for` and it is used when we already know how many times we want to repeat\
    \ the block of code. The syntax for the `for` loop is like this:\n\n```cpp\nfor(VARIABLES;\
    \ CONTION; INCREMENT)\n{\n    // Repeat some code\n}\n```\n\nThe second is named\
    \ `while`, and it will loop until some condition is satisfied. The syntax looks\
    \ like this:\n\n```cpp\nwhile(CONDITION)\n{\n    // Repeat some code\n}\n```\n\
    \nFollowing the example of the averages, calculating the average for 10 students\
    \ will look like this:\n\n```cpp\nfloat note1, note2, note3, note4, note5;\nfloat\
    \ avg;\n\nfor(int i = 0; i != 10; i++)\n{\n    cout << \"First note: \"; cin >>\
    \ note1;\n}\n```\n"
  raw: 'In this code, I declared a couple of extra strings. We also request the user
    their last name. In programming, we call concatenate to the action of attach strings.
    In this example, we concatenate name, an empty space and last name to produce
    a unique string containing the full name. And that string is sent to the output.


    Scape Sequences


    This is an addition to the I/O topic. In C++, there are special sequences that
    allow the programmer a better distribution of the information that is displayed.
    The sequences are:


    *   \n – End of line


    *   \t – Insertion of tabular space


    With these two sequences, you can design a well distributed interface. Look at
    the example:


                  cout << “Here is a line\n” << “Here is another line\t” << “I am
    after a tab space”;


    This is a simple example of the sequences and can be used only with the cout object.


    Program Flow


    Up until this point. We have covered the types of data, how to show info to the
    screen and capturing data from the keyboard. Now, a very important part of C++
    are the flow control instructions. With this part, you will be able to take decisions
    and make complex programs.


    If Structure


    The if is a conditional structure. Like its own name says, if something happens,
    then do this thing. The structure goes as follow:


    if(condition)


    {


    // do something


    }


    The condition is a expression in which the result will be true or false. There
    are some operators to evaluate the condition:


    *   EQUALS (==) : Will be true if both values are the same. Example: a=b


    *   AND (&&) : Will be true if all values are true.


    *   OR (||) : Will be true if any of the values are true.


    *   NOT (!) : Will be true if the value is false.


    *   GREATER (A>B) : Will be true if A is greater than B


    *   LESS (A<B) : Will be true if B is greater than A.


    Let’s suppose we must evaluate if a student approved or not a course. Look a the
    following code:


    #include <iostream>


    using namespace std;


    int main()


    {


                  int note;


                  cout << "Enter your note: ";


                  cin >> note;


                  if(note>6)


                  {


                                cout << "Congratulations. You passed!";


                  }             


                  return 0;             


    }


    We ask the user for their course note. If the user enters a number greater than
    6, then the flow of the program enters the code block surrounded by the braces.
    If not, it ignores this block and continues its execution. Notice that the IF
    instruction does not end with semicolon. This is because it is followed by a block
    of code. But, what happens when the note is less than six?


    We use the else keyword.


    #include <iostream>


    using namespace std;


    int main()


    {


                  int note;


                  cout << "Enter your note: ";


                  cin >> note;


                  if(note>6)


                  {


                                cout << "Congratulations. You passed!";


                  }             


                  else


                  {


                                cout << "Sorry. You did not passed";


                  }


                  return 0;             


    }


    This code is exactly the same as the last one with one difference. We added the
    else keyword with its respective block of code. First, the condition note>6 is
    evaluated. If this condition is true, then the block of code next to the if will
    be executed and the else block code will be ignored. If the condition is false,
    then the if block code will be ignored and the else block code will be executed.


    We can also add multiple conditions in the if clause. Look at the following code:


    if(note==10)


    {


                  cout << "Excellent!";


    }             


    else if(note>6 && note<10)


    {


                  cout << "Congratulations. You passed";


    }


    else


    {


                  cout << "Sorry. You did not approve";


    }


    We added something called else if and it allows the programmer to add multiple
    conditions on the same if. In this example, if note equals to ten, only the first
    block of code is going to be executed. On the second contidion, if note is greater
    than six AND note is less than 10, then the middle block of code will be executed.
    You can add as many else if as you may want or need. However, if neither the IF
    nor any of the ELSE IF conditions are true, then the ELSE block of code will be
    executed. The else is only executed when none of the IF or ELSE IF are true.


    Making easier multiple conditions


    You might think “Hey, what if I have a lot of conditions, like 20 or 30? It will
    be a lot of code” and yes, you are right. It would definitely be a lot of hard
    work having many conditions. But C++ has a answer for this: the switch instruction.
    With switch, we can use multiple conditions in a simple way. Continuing the same
    example of the notes, let’s suppose we want a different message for the approving
    notes. Starting from six, there will be 5 different messages for approving and
    a single message for failing. Using the switch statement, the code would look
    like this:


    switch(note)


                  {


                                case 10:


                                              cout << "Excellent";


                                              break;


                                case 9:


                                              cout << "Very good note";


                                              break;


                                case 8:


                                              cout << "Good job!";


                                              break;


                                case 7:


                                              cout << "Not bad. Keep working";


                                              break;


                                case 6:


                                              cout << "You passed by a bit";


                                              break;


                                default:


                                              cout << "You did not approve";             
                 


                  }


    The first thing to watch is that the variable we want to compare goes inside curly
    braces next to the switch statement. It does not need to end with semicolon because
    it is followed by the block of code for the switch. For each comparison, we use
    the case keyword followed by the value we are looking. In case note has a value
    of 10, the message “Excellent” goes to the output. For each case, we must add
    the break keyword. If we do not do this, the switch statement will fall to the
    next case until either finds a break or the end of the switch code block.


    Loops


    Alright, so you now know how to take decisions on your program. You can direct
    the flow to another pieces of code and decide which one execute and when. Excellent.
    Let’s say that you want to calculate an average. Each student is taking 5 subjects
    and you want to know the average of those note. Simple, you sum them up and divide
    by 5. But, there is not one student on the school. Can you copy the code and repeat
    this 10 or 15 times? Well.. yes, you could do it, but the code would start being
    very unmanageable. So, how can we fix this problem? C++ has the right tool for
    the job, and it is called loops.


    A loop is a block of code that will repeat itself until a condition is satisfied.
    We have two kinds of loops: counting loops and conditional loops. The first one
    is called for and it is used when we already know how many times we want to repeat
    the block of code. The syntax for the for loop is like this:


    for(VARIABLES; CONTIDION; INCREMENT)


    {


                  // Repeat some code


    }


    The second is named while, and it will loop until some condition is satisfied.
    The syntax looks like this:


    while(CONDITION)


    {


                  // Repeat some code


    }


    Following the example of the averages, calculating the average for 10 students
