    # 第 6 章：项目 #4 销售点


    这个项目将包含一个在普通超市销售的不同产品目录。所有产品都存储在一个文件中，并包含价格。该文件可以修改。程序为用户提供了向客户销售产品的选项，计算小计、税费以及整个销售的最终总额。销售完成后，商品数量和总额将存储在一个单独的文件。该文件存储所有的销售记录，并将用于从销售中生成总报告。让我们像往常一样从库开始：


    ```cpp

    #include <cstdlib>


