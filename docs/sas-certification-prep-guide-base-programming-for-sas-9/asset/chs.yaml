- "# SAS 认证备考指南：SAS 9 基础编程\n\n\n\n\n\n\n\n\n\n\n\n# 关于本书\n\n## 读者群\n\n《SAS Certification\
  \ Prep Guide: Advanced Programming for SAS^®9, Fourth Edition》适用于准备参加 SAS Advanced\
  \ Programming for SAS 9 考试的新手或资深 SAS 程序员。\n\n### 要求与详述\n\n### 目的与内容\n本指南帮助你准备参加\
  \ SAS Advanced Programming for SAS 9 考试。新手或资深 SAS 用户将发现本指南是一份非常有价值的资源，涵盖了考试中测试的目标。主要主题包括使用\
  \ SAS 进行 SQL 处理、使用 SAS 宏语言、高级 SAS 编程技术以及优化 SAS 程序。你还将熟悉 SAS^®9 中提供的增强和新功能。\n书中包含了测验，用于测试你对每章内容的理解情况。书末附有测验答案。\n\
  欲查找本指南的更新，请访问 SAS 培训与书籍网站 [`support.sas.com/publishing/cert`](http://support.sas.com/publishing/cert\
  \ \"opens in a new browser tab\")。\n注意：考试目标可能会发生。请在 [`support.sas.com/certify`](http://support.sas.com/certify\
  \ \"opens in a new browser tab\") 查看当前的考试目标。\n\n### 前提条件\n在参加 SAS Advanced Programming\
  \ for SAS 9 考试之前，必须获得 SAS Certified Base Programmer for SAS 9 认证。《SAS Certification\
  \ Prep Guide: Base Programming for SAS^®9》涵盖了 SAS Base Programming for SAS 9 考试测试的目标，包括导入导出原始数据文件；创建和修改\
  \ SAS 数据集；以及识别并修正数据、语法和编程逻辑错误。\n要查看你是否具备必要的 Base SAS 编程知识，请访问 [`support.sas.com/basepractice`](http://support.sas.com/basepractice\
  \ \"opens in a new browser tab\")。\n\n### 如何创建练习数据\n\n## SAS 环境\n\n在 SAS 中设置练习数据，请从\
  \ SAS 主菜单选择 Help>Learning SAS Programming。当出现 SAS Online Training Sample Data 窗口时，点击\
  \ OK 创建示例数据。\n\n## SAS Studio 和 SAS University Edition\n\n如果你在使用 SAS Studio 或 SAS\
  \ University Edition，你可能没有存储示例数据的 Sasuser 目录的写入权限。\n要确定 Sasuser 文件夹是否只读，请提交以下代码：\n\
  \n```\nproc options option=rsasuser;\nrun;\n```\n\n如果 `PROC OPTIONS` 代码的结果为 `NORSASUSER`，则\
  \ Sasuser 文件夹是可写的，你可以按照以下步骤在 SAS Studio 中设置练习数据：\n\n1. 将示例数据程序复制到 SAS Studio 中的新\
  \ Code 窗口中。你可以在 [`support.sas.com/publishing/cert/sampdata.txt`](http://support.sas.com/publishing/cert/sampdata.txt\
  \ \"opens in a new browser tab\") 获取示例数据。\n2. 点击运行。\n\n如果 `PROC OPTIONS` 代码的结果为\
  \ `RSASUSER`，则 Sasuser 文件夹是只读的，你需要使用 `LIBNAME` 语句重定向 Sasuser 文件夹。要设置练习数据：\n\n1.\
  \ 在 Folders 格中选择 My Folders。然后右键点击并选择 New>Folder。\n2. 在 Name 框中输入文件夹名称。在我们的示例中，我们使用\
  \ `certprep`。点击 Save。\n\n```\nlibname sasuser \"/folders/certprep\";\n```\n\n注意：必须使用目录名称。在我们的示例中，我们使用\
  \ `certprep`。如果你使用了其他文件名，请将 `certprep` 替换为你创建的。如果你使用的是 SAS Studio，请执行：\n\n1. 右键点击你创建的文件夹并选择\
  \ Properties。\n2. 复制 Location 字段中的路径。\n3. 输入以下代码，将 `location field` 替换为你复制的路径：\n\
  \n```\nlibname sasuser \"location field\";\n```\n\n4. 点击运行。\n5. 将程序保存为 `libname_cert.sas`。每次处理示例数据都要重新提交此\
  \ `LIBNAME` 程序。\n6. 将示例数据程序复制到 SAS Studio 中的新 Code 窗口中。你可以在 [`support.sas.com/publishing/cert/sampdata.txt`](http://support.sas.com/publishing/cert/sampdata.txt\
  \ \"opens in a new browser tab\") 获取示例数据。\n7. 点击运行。\n\n现在你已经将示例数据存储在永久目录中，每次需要使用数据时重新执行\
  \ `LIBNAME` 语句。\n\n## SAS Enterprise Guide\n\n下载示例数据：\n\n1. 启动 SAS Enterprise Guide。\n\
  2. 在 Welcome to SAS Enterprise 窗口中选择 New Project。\n3. 选择 File>New>Program。\n4. 根据你的网络配置，你可能没有存储示例数据的\
  \ Sasuser 目录的写入权限。要确定 Sasuser 文件夹的状态，提交以下代码：\n\n```\nproc options option=rsasuser;\n\
  run;\n```\n\n\n\n\n5. 如果 `PROC OPTIONS` 代码的结果为 `RSASUSER`，你必须通过创建一个新文件夹来重定向 `Sasuser`\
  \ 文件夹。从你的服务器区域，打开 `Files` 文件夹，右键点击驱动器或文件夹，并选择 `New Folder`。输入新文件夹名称。注意：如果 `PROC\
  \ OPTIONS` 代码的结果为 `NORSASUSER`，则 `Sasuser` 文件夹是可写的，你不需要重定向 `Sasuser` 文件夹。因此，你可以跳过此步和下一步。\n\
  \n6. 在 Code 窗口中提交以下代码：\n\n```sas\nlibname sasuser \"/folders/myfolders/certprep\"\
  ;\n```\n\n注意：你必须使用新文件夹的。在我们的示例中，我们使用 `certprep` 名称。如果你使用其他文件名，请用你创建的文件夹名称替换 `certprep`。\n\
  \n7. 将示例数据程序复制到 `Program` 窗口中然后运行程序。你可以在 [`support.sas.com/publishing/cert/sampdata.txt`](http://support.sas.com/publishing/cert/sampdata.txt\
  \ \"在新浏览器标签页中打开\") 访问示例数据。\n\n8. 因为你不需要使用这些快捷方式，可以从项目中删除 `Program` 项和所有快捷方式。此操作不会删除你创建的数据。要从项目中删除该项，右键点击\
  \ `Program` 并选择 `Delete`。\n\n9. 在 `Confirmation` 窗口中，点击 `Yes`。\n\n### 考试\n\nSAS\
  \ 认证练习考试：SAS 9 高级编程可以帮助你准备 SAS 9 高级编程考试。这门练习考试测试的是与官方认证考试相同的知识和技能。你可以在 SAS 认证类别下访问此考试：[`support.sas.com/edu/schedules.html?id=449`](https://support.sas.com/edu/schedules.html?id=449\
  \ \"在新浏览器标签页中打开\")。此练习考试需要付费。要注册官方 SAS 9 高级编程考试，请访问 SAS 全球认证网站：[`support.sas.com/certify`](http://support.sas.com/certify\
  \ \"在新浏览器标签页中打开\")。\n\n### 额外资源\n\n在学习 SAS 编程时，以下资源可以帮助你。\n\n| 来自 SAS 软件 |\n| ---\
  \ |\n| 帮助 | 对于 SAS^®9，选择 `Help>SAS Help and Documentation`；SAS Enterprise Guide，选择\
  \ `Help>SAS Enterprise Guide Help` |\n| 文档 | 对于 SAS^®9，选择 `Help>SAS Help and Documentation`；SAS\
  \ Studio，选择 ![SAS Studio 帮助图标](img/question_circle.png) |\n\n| 网上 |\n| --- |\n|\
  \ 书店 | [`support.sas.com/publishing/`](http://support.sas.com/publishing/ \"在新浏览器标签页中打开\"\
  ) |\n| 培训 | [`support.sas.com/training/`](http://support.sas.com/training/ \"在新浏览器标签页中打开\"\
  ) |\n| 文档（包括 SAS Enterprise Guide） | [`support.sas.com/documentation/`](http://support.sas.com/documentation/\
  \ \"在新浏览器标签页中打开\") |\n| 认证 | [`support.sas.com/certify/`](http://support.sas.com/certify/\
  \ \"在新浏览器标签页中打开\") |\n| SAS 全球学术计划 | [`support.sas.com/learn/ap`](http://support.sas.com/learn/ap\
  \ \"在新浏览器标签页中打开\") |\n| SAS OnDemand | [`support.sas.com/ondemand/`](http://support.sas.com/ondemand/\
  \ \"在新浏览器标签页中打开\") |\n| 知识库 | [`support.sas.com/resources/`](http://support.sas.com/resources/\
  \ \"在新浏览器标签页中打开\") |\n| 支持 | [`support.sas.com/techsup/`](http://support.sas.com/techsup/\
  \ \"在新浏览器标签页中打开\") |\n| 学习中心 | [`support.sas.com/learn/`](http://support.sas.com/learn/\
  \ \"在新浏览器标签页中打开\") |\n| 社区 | [`support.sas.com/community/`](http://support.sas.com/community/\
  \ \"在新浏览器标签页中打开\") |\n\n### 语法规范\n\n以下示例显示了书中所示 SAS 代码的一般形式。\n\n| `PROC SQL;SELECT\
  \ column-1<,...column-n>FROM table-1|view-1<,...table-n|view-n><WHERE expression><GROUP\
  \ BY column-1<, ... column-n>><ORDER BY column-1<,... column-n>>;` |\n| --- |\n\
  | `PROC SQL` 调用 SQL 过程。 |\n| `SELECT` 指定要选择的列。 |\n| `FROM` 指定要查询的表。 |\n| `WHERE`\
  \ 根据条件对数据进行子集划分。 |\n| `GROUP BY` 根据指定的列将数据分类。 |\n| `ORDER BY` 根据指定列的值对查询返回的行进行排序。\
  \ |\n\n以下是详细信息。`SELECT`、`FROM`、`WHERE`、`GROUP BY` 和 `ORDER BY` 使用大写，因为它们必须按所示拼写。`column-1`、`table-1`、`view-1`\
  \ 和 `expression` 使用斜体，因为它们每个都代表你提供的值。`<,...column-n>` 包在角括号中，因为它是可选语法。`table-1`\
  \ 和 `view-1` 之间用竖线（ `|` ）隔开，表示它们是互斥的。本书涵盖了你准备认证考试所需的所需的基础语法。\n\n# 第 1 章：使用 PROC\
  \ SQL 执行查询\n\n## 概述\n\n## 引言\n\n有时你需要关于数据的快速答案。你可能想对单个数据集或数据集组合进行查询（检索数据），以实现以下操作：\n\
  \n- 检查数据值之间的关系\n- 查看数据的子集\n- 快速计算值\n\nSQL 过程 (`PROC SQL`) 提供了一种简单灵活的方法来合并你的数据。本章将你如何使用一个或多个表创建基础查询![SAS\
  \ 表和输出](img/m10f1g1.png)\n\n## PROC 基础\n\n\n\n\n```\nproc sql;\n   select empid,jobcode,salary,\n\
  \          salary*.06 as bonus\n      from sasuser.payrollmaster\n      where salary<32000\n\
  \      order by jobcode;\n```\n\n*   `PROC SQL` 步骤不需要 `RUN` 语句。`PROC SQL` 会自动执行每个查询。如果你在\
  \ `PROC SQL` 步骤中使用 `RUN` 语句，SAS 会忽略该 `RUN` 语句，照常执行语句，并在 SAS 日志中生成如下所示的注释。\n\n表 1.1\
  \ SAS 日志\n\n```\n1884 proc sql; \n1885    select empid,jobcode,salary, \n1886  \
  \         salary*.06 as bonus\n1887       from sasuser.payrollmaster \n1888    \
  \   where salary<32000 \n1889       order by jobcode;\n1890 run;\nNOTE: PROC SQL\
  \ statements are executed immediately;\n      The RUN statement has no effect.\n\
  ```\n\n*   与许多其他 SAS 过程不同，在提交一个步骤后，`PROC SQL` 会继续运行。要结束该过程，你必须提交另一个 `PROC` 步骤、`DATA`\
  \ 步骤或 `QUIT` 语句，如下：\n\n```\nproc sql;\n   select empid,jobcode,salary,\n       \
  \   salary*.06 as bonus\n      from sasuser.payrollmaster\n      where salary<32000\n\
  \      order by jobcode;\nquit;\n```\n\n当你提交一个没有结束的 `PROC SQL` 步骤时，状态栏会显示消息：\n\n\
  ```\nPROC SQL running\n```\n\n注意：作为预防措施，SAS Enterprise Guide 在你将代码提交到 SAS 时会自动向你的代码中添加\
  \ `QUIT` 语句。然而，你应该养成在代码中添加 `QUIT` 语句的习惯。\n\n### 编写 PROC SQL 步骤\n\n## 概述\n\n在创建查询之前，你必须先引用存储表所在的库。然后，你编写一个\
  \ `PROC SQL` 步骤来查询你的表。\n\n| 通用形式，执行查询的 Basic PROC SQL 步骤：`PROC SQL;SELECT column-1<,...column-n>FROM\
  \ table-1|view-1<,...table-n|view-n><WHERE expression><GROUP BY column-1<, ... column-n>><ORDER\
  \ BY column-1<,... column-n>>;` | 此处是该语法的解释： | `PROC SQL` 调用 SQL 过程 | `SELECT` 指定要选择的列\
  \ | `FROM` 指定要查询的表 | `WHERE` 根据一个或多个条件对数据进行子集划分 | `GROUP BY` 根据指定的列将数据分类为组 | `ORDER\
  \ BY` 根据指定列的值对查询返回的行进行排序。 | |\n\n**注意**：与其他 SAS 过程不同，`PROC SQL` 中 `SELECT` 语句的子句顺序是重要的。子句必须按照上述所示的顺序出现。\n\
  **注**：查询也可以包含 `HAVING` 子句，该子句将在本章末尾介绍。要了解更多关于 `HAVING` 子句的信息，请参阅 使用 PROC SQL 执行高级查询。\n\
  \n## SELECT 语句\n\n跟在 `PROC SQL` 语句之后的 `SELECT` 语句用于检索和显示数据。它由以关键字开头的子句组成，后面跟着一个或多个组件。以下示例代码中的\
  \ `SELECT` 语句包含四个子句：必需子句 `SELECT` 和 `FROM`，以及可选子句 `WHERE` 和 `ORDER BY`。语句的结束由分号指示。\n\
  \n```\nproc sql;\n |-select empid,jobcode,salary,\n |        salary*.06 as bonus\n\
  \ |----from sasuser.payrollmaster\n |----where salary<32000\n |----order by jobcode;\n\
  ```\n\n**注**：包含一个或多个 `SELECT` 语句的 `PROC SQL` 步骤被称为 `PROC SQL` 查询。`SELECT` 语句只是可与\
  \ `PROC SQL` 使用的多个语句之一。下面的 `PROC SQL` 查询创建了所示输出报告：\n\n```\nproc sql;\n   select\
  \ empid,jobcode,salary,\n          salary*.06 as bonus\n      from sasuser.payrollmaster\n\
  \      where salary<32000\n      order by jobcode;\n```\n\n![显示 EmpID, JobCode,\
  \ Salary 和 bonus 的输出报告](img/m10-6-g1.png)\n\n`PROC SQL` 查询产生结果集，该结果可以输出为报告、表或 `PROC\
  \ SQL` 视图。\n\n| 输出类型 | PROC SQL 语句 |\n| --- | --- |\n| 报告 | `SELECT` |\n| 表 | `CREATE\
  \ TABLE` |\n| PROC SQL 视图 | `CREATE VIEW` |\n\n**注**：`CREATE TABLE` 语句在本章稍后部分介绍。你可以在\
  \ 使用 PROC SQL 创建和管理表 中学习创建表。你可以在 使用 PROC SQL 创建和管理视图 中了解更多关于 `PROC SQL` 视图的信息。将在后续章节中学习更多\
  \ `SELECT` 语句。\n\n### 选择列\n\n## 概述\n\n要指定在查询中显示哪些列，你需要编写 `SELECT` 子句。在 `SELECT`\
  \ 关键字之后列出一个或多个列，并用逗号分隔列名。在 `SELECT` 子句中，你可以同时指定现有列（存储在表中）和新列。下面的 `SELECT` 子句指定了\
  \ `EmpID`、`JobCode` 和 `Salary`。名为 `bonus` 的列是一个新列。\n\n```\nproc sql;\n   select\
  \ empid,jobcode,salary,\n          salary*.06 as bonus\n      from sasuser.payrollmaster\n\
  \      where salary<32000\n      order by jobcode;\n```\n\n## 创建新列\n\n你可以创建包含或计算的新列。除非创建了表或视图，否则新列仅在查询期间存在。要创建新列，请\
  \ `SELECT` 子句中包含任何有效的 SAS 表达式。通过使用关键字 `AS` 后跟名称为新列分配别名。\n**注**：别名必须 SAS 名称规则。在示例\
  \ `PROC SQL` 查询中，使用表达式来计算新列：`Salary` 的值乘以 `.06`。使用 `AS` 关键字为新列分配别名 `bonus`。\n\n\
  ```\nproc sql;\n   select empid,jobcode,salary,\n          salary*.06 as bonus\n\
  \      from sasuser.payrollmaster\n      where salary<32000\n      order by jobcode;\n\
  ```\n\n列别名非常有用，因为它允许你在查询的其他地方引用该列。\n**注**：此外，列别名作为列标题。下面的输出显示了计算列显示。注意列别名 `bonus`\
  \ 以小写显示，与你在 `SELECT` 子句中指定的相同。\n\n![带有计算 Bonus 的输出](img/m10-7-g1.png)\n\n在 `SELECT`\
  \ 子句中，你可以为现有列或新列指定标签。如果为新列同时指定标签别名和列别名，则标签将作为输出中的列标题。如果只指定列别名，则确保按照你希望在输出中显示的格式来指定列别名。\n\
  **注**：你可以在 使用 PROC SQL 执行高级查询 中学习创建文本的新列以及指定标签。\n\n### 指定表\n\n在编写 `SELECT` 子句之后，在\
  \ `FROM` 子句中指定要查询的表。输入关键字 `FROM`，后接表名，如下所示：\n\n```\nproc sql;\n   select empid,jobcode,salary,\n\
  \          salary*.06 as bonus\n      from sasuser.payrollmaster\n      where salary<32000\n\
  \      order by jobcode;\n```\n\n上述 `PROC SQL` 步骤查询了存储在分配了 libref `Sasuser` 的 SAS\
  \ 库中的永久 SAS 表 `Payrollmaster`。\n\n# 指定子集条件\n\n\n\n\n要根据条件对数据进行子集划分，请在 `SELECT` 语句中使用\
  \ `WHERE` 子句。与其他 SAS 过程中使用的 `WHERE` 语句和 `WHERE` 命令一样，`WHERE` 子句中的表达式可以是任何有效的 SQL\
  \ 表达式。在 `WHERE` 子句中，你可以指定底层表中的任何列。`WHERE` 子句中指定的列并不一定必须在 `SELECT` 子句中指定。在接下来的 `PROC\
  \ SQL` 查询中，`WHERE` 子句选择了 `Salary` 列值小于 `32,000` 的行。输出结果也如下所示。\n\n| | ```\nproc sql;\n\
  \   select empid,jobcode,salary,\n          salary*.06 as bonus\n      from sasuser.payrollmaster\n\
  \      where salary<32000\n      order by jobcode;\n``` | ![工资小于 32,000 的工资子集](img/m10-12-g1.png)\
  \ |\n\n# 行的排序\n\n## 概述\n`PROC SQL` 查询输出的行顺序无法保证，除非你指定了排序顺序。要按特定列的值对行进行排序，可以在 `SELECT`\
  \ 语句中使用 `ORDER BY` 子句。指定关键字 `ORDER BY`，后面跟上用逗号分隔的一个或多个列名。在接下来的 `PROC SQL` 查询中，`ORDER\
  \ BY` 子句按 `JobCode` 列的值对行进行排序：\n\n```\nproc sql;\n   select empid,jobcode,salary,\n\
  \          salary*.06 as bonus\n     from sasuser.payrollmaster\n     where salary<32000\n\
  \      order by jobcode;\n```\n\n注意：在例例中，`ORDER BY` 子句是 `SELECT` 语句中的最后一个子句，因此 `ORDER\
  \ BY` 子句以分号结束。在下方所示的示例查询输出中，行按 `JobCode` 的值排序。默认情况下，`ORDER BY` 子句按升序对行排序![Emplid,\
  \ jobcode, salary, bonus](img/m10-14-g1.png)。要按降序排序行，请在列名后指定关键字 `DESC`。例如，前面的 `ORDER\
  \ BY` 子句可以修改如下：\n\n```\norder by jobcode desc;\n```\n\n在 `ORDER BY` 子句中，你也可以通过列在\
  \ `SELECT` 子句列表中的位置而不是通过名称来引用列。使用整数指示列的位置。上述 `PROC SQL` 查询中的 `ORDER BY` 子句已在下方修改，通过列在\
  \ `SELECT` 子句列表中的位置（`2`）而不是名称来指定 `JobCode` 列：\n\n```\nproc sql;\n   select empid,jobcode,salary,\n\
  \          salary*.06 as bonus\n      from sasuser.payrollmaster\n      where salary<32000\n\
  \      order by 2;\n```\n\n## 多列排序\n要按两个或多个列的值对行进行排序，请在 `ORDER BY` 子句中列出多个列名（或数字），并使用逗号分隔列名（或数字）。在接下来的\
  \ `PROC SQL` 查询中，`ORDER BY` 子句按两个列 `JobCode` 和 `EmpID` 的值进行排序：\n\n```\nproc sql;\n\
  \   select empid,jobcode,salary,\n          salary*.06 as bonus\n      from sasuser.payrollmaster\n\
  \      where salary<32000\n      order by jobcode,empid;\n```\n\n行首先按 `JobCode`\
  \ 排序，然后按 `EmpID` 排序，如下方的所示![Emplid, jobcode, salary, bonus](img/m10-15-g1.png) 注意：你可以在\
  \ `ORDER BY` 子句中混合使用两种列引用类型（名称和数字）。例如，前面的 `ORDER BY` 子句可以重写为：\n\n```\norder by 2,empid;\n\
  ```\n\n你还可以在 `ORDER BY` 子句中引用列别名。这里有一个示例：\n\n```\norder by 2, empid, bonus;\n```\n\
  \n# 多表查询\n\n## 概述\n本主题涉及从两个或多个表中提取数据这一更复杂的任务。之前，你已经学习了如何编写 `PROC SQL` 步骤来查询单表。假设你现在想检查存储在两个表中的数据。`PROC\
  \ SQL` 允许你从水平方向上合并表，换句话说，就是合并数据行![表 a，表 b](img/m10-19-g2.png)。在 SQL 术语中，水平合并表被称为连接表（joining\
  \ tables）。连接操作不会更改原始表。\n\n假设你想创建一个报告，显示公司员工的以下信息：员工编号、姓氏、原始工资和新工资。没有一个单表包含所有这些列，因此你必须连接\
  \ `Sasuser.Salcomps` 和 `Sasuser.Newsals` 这两个表。在你的查询中，你想选择四个列，其中两个来自第一张表，两个来自第二个表。你还需要确保所连接的行属于同一个员工。为了检查这一点，你希望对合并的行的员工编号进行匹配，并只选择匹配的行![SAS\
  \ 表 Salcomps 和 Newsals](img/m10f1g1.png) 这种连接被称为内连接（inner join）。内连接为所有匹配项返回结果集。假设你想创建一个显示公司员工的以下信息的报告：员工编号、姓氏、原始工资和新工资。没有一个单表包含所有这些列，因此你必须连接\
  \ `Sasuser.Salcomps` 和 `Sasuser.Newsals` 这两个表。注意：关于水平 SQL 连接的更多信息，请参见 [Combining\
  \ Tables Horizontally Using PROC SQL](https://support.sas.com/help/en/libref/le94/procsql/n/combining-tables-horizontally.htm)。在你的查询中，你想选择四个列，其中两个来自第一张表，两个来自第二个表。你还需要确保所连接的行属于同一个员工。为了检查这一点，你希望对合并的行的员工编号进行匹配，并只选择匹配的行。这种连接被称为内连接（inner\
  \ join）。内连接为所有匹配项返回结果集。\n\n\n\n\n\n```sql\nproc sql;\n   select salcomps.empid,lastname,\n\
  \          newsals.salary,newsalary\n      from sasuser.salcomps,sasuser.newsals\n\
  \      where salcomps.empid=newsals.empid\n      order by lastname;\n```\n\n部分输出显示所示。![通过\
  \ empid 链接的表](img/m10-24-g1.png) 注意：在 `Sasuser.Newsals` 表中，`Salary` 列的标签为 `Employee\
  \ Salary`，如此输出所示。**注意**：如果将不包含一个或多个与另一个具有匹配数据值的列表进行连接，可能会出现几种意料之外的结果。你可能会产生大量数据，可能会产生所有可能的行组合。\n\
  \n# 对行排序\n\n与仅查询单个表的 `PROC SQL` own 类似，`ORDER BY` 子句指定了使用哪些列（列）对输出中的行进行排序。在下面的查询中，按\
  \ `LastName` 排序：\n\n|  \n\n```sql\nproc sql;\n  select salcomps.empid,lastname,\n\
  \         newsals.salary,newsalary\n     from sasuser.salcomps,sasuser.newsals\n\
  \     where salcomps.empid=newsals.empid\n     order by lastname;\n```\n\n | ![按\
  \ LastName 排序的行](img/m10-25-g1.png) |\n\n# 数据组的汇总\n\n我们可以使用 `PROC SQL` 步骤创建详细报告。但你可能还想对数据进行分组汇总。为了为了汇总数据进行分组，可以使用\
  \ `GROUP BY` 子句。`GROUP BY` 子句用于包含一个或多个汇总函数的查询。汇总函数为 `GROUP BY` 子句中定义的每个组生成一个统计摘要。\n\
  \n## 示例\n\n下面的示例演示了 `GROUP BY` 子句和汇总函数。假设你想确定常客旅客计划会员在三个会员等级（金牌、银牌和铜牌）中每个等级旅行的总里数数。常客旅客计划信息存储在\
  \ `Sasuser.Frequentflyers` 表中。要对你的数据进行汇总，可以提交以下 `PROC SQL` 步骤：\n\n```sql\nproc sql;\n\
  \   select membertype,\n          sum(milestraveled) as TotalMiles\n      from sasuser.frequentflyers\n\
  \      group by membertype;\n```\n\n在这种情况下，`SUM` 函数对 `MilesTraveled` 列的值求总和以创建 `TotalMiles`\
  \ 列。`GROUP BY` 子句根据 `MemberType` 的值对数据分组。与 `ORDER BY` 子句类似，在 `GROUP BY` 子句中，你指定关键字\
  \ `GROUP BY`，随后是一个或多个由逗号分隔的列名。结果显示了按等级（MemberType）划分的总里程。![MemberType, TotalMiles](img/m10-28-g1.png)\
  \ 注意：如果你在不包含汇总函数的查询中指定了 `GROUP BY` 子句，该子句将变为 `ORDER BY` 子句，并在 SAS 日志中写入相应信息。\n\n\
  ## 汇总函数\n\n要汇总数据，你可以在 `PROC SQL` 中使用以下汇总函数。注意某些函数有多个名称，以适应 SAS 和 SQL 规范。当列出多个名称时，第一个名称是\
  \ SQL 名称。\n\n| `AVG,MEAN` | 值的平均数或平均值 |\n| `COUNT, FREQ, N` | 非空值的个数 |\n| `CSS`\
  \ | 修正平方和 |\n| `CV` | 变异系数（百分比） |\n| `MAX` | 最大值 |\n| `MIN` | 最小值 |\n| `NMISS` |\
  \ 缺失值的个数 |\n| `PRT` | 学生 t 分布绝对值大于概率 |\n| `RANGE` | 值的范围 |\n| `STD` | 标准差 |\n| `STDERR`\
  \ | 均标准误 |\n| `SUM` | 值的总和 |\n| `T` | 用于检验总体均值为零假设的学生 t 值 |\n| `USS` | 未修正的平方和 |\n\
  | `VAR` | 方差 |\n\n### 创建输出表\n\n## 概述\n\n要从查询结果创建新表，请使用 `CREATE TABLE` 语句，该语句包含关键字\
  \ `AS` 以及在 `PROC SQL` 查询中使用的子句：`SELECT`、`FROM` 以及任何可选子句（如 `ORDER BY`）。`CREATE TABLE`\
  \ 语句将你的查询结果存储在表中，而不是作为报告显示结果。\n\n| 通用形式，用于从查询结果创建表的基本 PROC SQL 步骤：`PROC SQL;CREATE\
  \ TABLE table-name ASSELECT column-1<,...column-n>FROM table-1|view-1<,...table-n|view-n><WHERE\
  \ expression><GROUP BY column-1<,... column-n>><ORDER BY column-1<,... column-n>>;`\
  \ 这里是对语法的解释：`table-name` 指定要创建的表的名称。 |\n\n注意：查询还可以包含 `HAVING` 子句，该子句将在本章末尾介绍。要了解更多关于\
  \ `HAVING` 子句的信息，请参阅 使用 PROC SQL 执行高级查询。注意：`CREATE TABLE` 语句不产生输出。要查看表的内容，请使用 SELECT\
  \ 语句 中描述的 `SELECT` 语句。\n\n## 示例\n\n假设你想确定 `Sasuser.Frequentflyers` 每个会员等级（金牌、银牌和铜牌）的旅行总里数，并将这些信息存储在临时表\
  \ `Work.Miles` 中。要这样做，你可以提交以下 `PROC SQL` 步骤：\n\n```sql\nproc sql;\ncreate table\
  \ miles as\n      select membertype,\n             sum(milestraveled) as TotalMiles\n\
  \      from sasuser.frequentflyers\n      group by membertype;\n``` SAS 日志\n\n```text\n\
  NOTE: 已创建 WORK.MILES，具有三行两列。\n```\n\n在此示例中，要永久保存使用 Sasuser\n\n### 附加功能\n\n为了进一步筛选包含\
  \ `GROUP BY` 子句的查询，可以使用 `HAVING` 子句。`HAVING` 子句配合 `GROUP BY` 子句根据一个或多个条件进行。例如，下面的\
  \ `PROC SQL` 查询使用汇总函数 `AVG` 来指定平均工资大于 40000 的组。\n\n```sql\nproc sql;\n   select\
  \ jobcode,avg(salary) as Avg\n      from sasuser.payrollmaster\n      group by jobcode\n\
  \      having Avg>40000\n      order by jobcode;\n```\n\n注意：你可以在使用 PROC SQL 执行高级查询中了解更多关于\
  \ `HAVING` 子句的信息。\n\n## 总结\n\n## 文字总结\n\n### PROC SQL 基础\n\n`PROC SQL` 使用结构化查询语言（SQL）编写的语句，SQL\
  \ 是一种广泛用于检索和更新表以及基于表的视图语言。当你想要检查数据值之间的关系、划分数据或计算值时，SQL 过程提供了一种灵活的方法。PROC SQL 与大多数其他\
  \ SAS 过程有几个不同之处：\n\n*   `PROC SQL` 中的许多语句包含子句。\n\n*   `PROC SQL` 步骤不需要 `RUN` 语句。\n\
  \n*   `PROC SQL` 在提交步骤后会继续运行。你需要提交另一个 `PROC` 步骤、`DATA` 步骤或 `QUIT` 语句来结束过程。\n\n###\
  \ 编写 PROC SQL 步骤\n\n在创建查询之前，必须为要使用的 SAS 库分配 libref。然后提交 `PROC SQL` 步骤。你使用 `PROC\
  \ SQL` 语句来调用 SQL 过程。\n\n### 选择列\n\n要指定查询中显示的列（列），请在 `SELECT` 语句的第一个子句中写 `SELECT`\
  \ 子句。在 `SELECT` 子句中，你可以指定现有列并创建包含文本或计算结果的新列。\n\n### 指定表\n\n你在 `FROM` 子句中指定要查询的表。\n\
  \n\n\n\n\n要根据条件划分子集，请编写一个包含表达式的 `WHERE` 子句。\n\n### 行排序\n\n`PROC SQL` 查询输出的行顺序是无法保证的，除非你指定了排序顺序。要按特定列的值对行排序，请使用\
  \ `ORDER BY` 子句。\n\n### 查询多个表\n\n你可以使用 `PROC SQL` 步骤查询存储在两个或多个表中的数据。在 SQL 术语中，这被称为连接表（joining）。按照以下步骤连接多个表：\n\
  \n1. 在 `SELECT` 子句中指定来自一个或两个表的列名；如果你选择的列在多个表中具有相同的名称，请在该列名前前加上表名前缀。\n2. 在 `FROM`\
  \ 子句中指定每个表名。\n3. 使用 `WHERE` 子句根据条件从两个或多个表中选择行。\n4. 使用 `ORDER BY` 子句根据所选列（或列）的值对从两个或多个表中检索的行进行排序。\n\
  \n### 汇总分组数据\n\n你可以在 `PROC SQL` 步骤中使用 `GROUP BY` 子句对数据进行分组汇总。`GROUP BY` 子句用于包含一个或多个汇总函数的查询。汇总函数会为\
  \ `GROUP BY` 子句中定义的每个组生成统计摘要。\n\n### 创建输出表\n\n要根据查询结果创建新表，你可以在 `PROC SQL` 步骤中使用\
  \ `CREATE TABLE` 语句。该语句允许你将结果存储在表中，而不是将查询结果作为报告显示。\n\n### 附加功能\n\n若要进一步细化化包含 `GROUP\
  \ BY` 子句的 `PROC SQL` 查询，你可以使用 `HAVING` 子句。`HAVING` 子句与 `GROUP BY` 子句配合使用，根据一个或多个指定的条件限制输出中显示的组。\n\
  \n## 示例程序\n\n### 查询表\n\n```\nproc sql;\n   select empid,jobcode,salary,\n      \
  \    salary*.06 as bonus\n      from sasuser.payrollmaster\n      where salary<32000\n\
  \      order by jobcode;\nquit;\n```\n\n### 汇总分组数据\n\n```\nproc sql;\n   select\
  \ membertype,\n          sum(milestraveled) as TotalMiles\n      from sasuser.frequentflyers\n\
  \      group by membertype;\nquit;\n```\n\n### 从两个表的查询结果创建表\n\n```\nproc sql;\n\
  \   create table work.miles as\n      select salcomps.empid,lastname,\n        \
  \     newsals.salary,newsalary\n      from sasuser.salcomps,sasuser.newsals\n  \
  \    where salcomps.empid=newsals.empid\n      order by 2;\nquit;\n```\n\n## 注意事项\n\
  \n- 不要对 SQL 过程使用 `RUN` 语句。\n- 不在子句末尾不要加分号，除非它是语句中的最后一个子句。\n- 当连接多个表时，务必在 `WHERE`\
  \ 子句中指定具有匹配数据值的列。\n- 要结束 SQL 过程，你可以提交另一个 `PROC` 步骤、一个 `DATA` 步骤或 `QUIT` 语句。\n\n\
