  \n## 注意事项\n\n* `CREATE TABLE` 语句仅生成表作为输出，而不是生成报告。\n* `UPDATE` 语句不会向表中插入新行。要插入行，你必须使用\
  \ `INSERT` 语句。\n\n# 测验\n\n为每个问题选择最佳答案。完成测验后，使用附录中的答案键检查你的答案。\n\n1. 下列哪个 `PROC SQL`\
