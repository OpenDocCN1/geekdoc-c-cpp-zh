  \    2.  在 `PROC SQL` 视图中包含宏变量引用\n    3.  在执行 `SCL` 程序期间访问宏变量的值\n    4.  以上所有情况\n\
  \n7. 下列哪项正确地在 `PROC SQL` 步中创建了宏变量？\n\n    1.  ```sas\n       call symput(daily_fee,\
  \ put(fee/days, dollar8.));\n       ```\n    2.  ```sas\n       %let daily_fee=put(fee/days,\
  \ dollar8.)\n       ```\n    3.  ```sas\n       select fee/days format=dollar8\\\
  . \n       into :daily_fee from sasuser.all;\n       ```\n    4.  ```sas\n     \
  \  select fee/days format=dollar8\\. \n       into daily_fee from sasuser.all;\n\
  \       ```\n\n8. 根据此处显示的全局符号表，对 `&&teach&crs` 引引用解析值是什么？![Global Symbol Table](img/m51-41-g1.png)\n\
  \n    1.  `&TEACH3`\n    2.  TEACH3\n    3.  Forest, Mr. Peter\n    4.  以上都不是\n\n\
  9. 下列哪条语句正确地在 `DATA` 步执行期间创建一个名为 `Price` 的 `DATA` 步变量，并为其赋值宏变量 `daily_fee` 的值？\n\
  \n    1.  ```sas\n       price=&daily_fee;\n       ```\n    2.  ```sas\n       price=symget(daily_fee);\n\
  \       ```\n    3.  ```sas\n       price=symget(&daily_fee);\n       ```\n    4.\
  \  ```sas\n       price=symget(\"daily_fee\");\n       ```\n\n10. 下列哪项是错误的？\n\n\
  \    1.  `SYMPUT` 程序可以在执行 `DATA` 步期间或执行 `SCL` 程序期间创建宏变量。\n    2.  在 `DATA` 步中，`SYMPUT`\
  \ 程序会自动将你尝试赋值给宏变量的任何数值值转换为字符值。\n    3.  `PROC SQL` 会自动将你尝试与数值进行比较的任何宏变量值转换为数值。\n\
  \    4.  在 `SCL` 程序中，可以使用 `SYMPUTN` 程序将数值值赋值给宏变量。\n\n# 第 11 章：创建和使用宏程序\n\n概述基础概念开发和调试宏使用宏参数理解符号表条件处理语句迭代处理语句使用算术和逻辑表达式总结测试\n\
  \n## 概述\n\n## 引言\n\n和宏变量一样，宏程序（也称为宏）允许你将文本替换到 SAS 程序中。宏与宏变量不同，因为它们可以使用条件逻辑对你替换到程序中的文本做出决策。使用宏可以帮助你的\
  \ SAS 程序更具动态性和可重用性。例如，假设你每天都会提交一个 SAS 程序，为本月晚些时候将举办的课程创建注册列表。然后，假设你每个周五还会提交一个 SAS\
  \ 程序，以创建本月目前为止产生的收入摘要。通过使用宏，你可以自动化此过程，因此只需要一个 SAS 程序。该程序提交每日报告，并在如果是周五时条件性地提交周报。此外，你可以创建并存储一个宏来自动化此过程，你每天只需要提交这段代码即可：\n\
  \n```sas\n%reports\n```\n\n# 基础概念\n\n## 定义宏\n\n为了创建一个宏程序，你必须首先定义它。你从 `%MACRO` 语句开始宏定义，用\
  \ `%MEND` 语句结束定义。\n\n| 通用格式、`%MACRO`语句和`%MEND`语句： |\n| `%MACRO macro-name;text%MEND\
  \ <macro-name>;` |\n\n以下是对该语法的解释：`macro-name` 为宏命名。`macro-name` 的值可以是任何有效的 SAS 名称，只要它不是\
  \ SAS 宏设施中的保留字即可。`text` 可以是：\n\n*   常量文本，可能包括 SAS 数据集名称\n*   宏变量，可能包括 SAS 数据集名称\n\
  * 宏函数\n* 宏语句\n\n提示：`macro-name` 为宏命名。`macro-name` 的值可以是任何有效的 SAS 名称，只要它不是 SAS 宏设施中的保留字即可。`text`\
  \ 可以是：\n\n*常量文本，可能包括 SAS 数据集名称\n* 宏变量，可能包括 SAS 数据集名称\n* 宏函数\n* 宏语句\n\n提示：`macro-name`\
  \ 为宏命名。`macro-name` 的值可以是任何有效的 SAS 名称，只要它不是 SAS 宏设施中的保留字即可。`text` 可以是：\n\n*常量文本，可能包括\
  \ SAS 数据集名称\n* 宏变量，可能包括 SAS 数据集名称\n* 宏函数\n* 宏语句\n\n提示：`macro-name` 为宏命名。`macro-name`\
  \ 的值可以是任何有效的 SAS 名称，只要它不是 SAS 宏设施中的保留字即可。`text` 可以是：\n\n*常量文本，可能包括 SAS 数据集名称\n*\
  \ 宏变量，可能包括 SAS 数据集名称\n* 宏函数\n* 宏语句\n\n提示：`macro-name` 为宏命名。`macro-name` 的值可以是任何有效的\
  \ SAS 名称，只要它不是 SAS 宏设施中的保留字即可。`text` 可以是：\n\n*常量文本，可能包括 SAS 数据集名称\n* 宏变量，可能包括 SAS\
  \ 数据集名称\n* 宏函数\n* 宏语句\n\n提示：`macro-name` 为宏命名。`macro-name` 的值可以是任何有效的 SAS 名称，只要它不是\
  \ SAS 宏设施中的保留字即可。`text` 可以是：\n\n*常量文本，可能包括 SAS 数据集名称\n* 宏变量，可能包括 SAS 数据集名称\n* 宏函数\n\
