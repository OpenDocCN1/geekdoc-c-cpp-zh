  ```\n3. ```sas\nproc transpose data=work.fishdata\n     out=fishsize\n     prefix=size;\n\
  run;\n```\n4. ```sas\nproc transpose data=work.fishdata\n     out=fishsize\n   \
  \  prefix=size;\nrun;\n```\n\n# 第 17 章 格式化数据\n\n## 概述\n\n## 引言\n自定义格式用于以特定方式显示变量值，例如，假设你有一些航空公司数据并希望使用格式将数值显示为文本。你已经熟悉如何使用\
  \ `FORMAT` 过程创建格式，本章将学习如何使用 `VALUE` 语句创建格式，以及如何在 SAS 数据集中存储这些格式。\n\n## 使用 VALUE\
  \ 语句创建格式\n\n### 非重叠格式的回顾\n你可以使用 `VALUE` 语句在 `FORMAT` 过程中创建非重叠格式。例如，假设你有一些航空公司数据并需要创建非重叠格式来执行报告任务。你需要格式来执行以下操作：\n\
  \n* 将航空公司路线分组区域\n* 将机场代码标记为国际或国内\n* 将货物收入分组范围\n\n以下 `PROC FORMAT` 步骤创建了这些格式：\n\n\
  ```sas\nproc format;\n   value $routes\n         'Route1' = 'Zone 1'\n         'Route2'\
  \ - 'Route4' = 'Zone 2'\n         'Route5' - 'Route7' = 'Zone 3'\n         ' ' =\
  \ 'Missing'\n         other = 'Unknown';\n   value $dest\n         'AKL','AMS','ATH','BKK',\n\
  \         'CBR','CCU','CDG','CPT','DEL',\n         'DXB','FBU','FRA','GVA',\n  \
  \       'HEL','HKG','HND','JED','JNB',\n         'JRS','LHR','LIS','MAD','NBO',\n\
  \         'PEK','PRG','SIN','SYD','VIE','WLG' = 'International'\n         'ANC','BHM','BNA','BOS','DFW','HNL',\n\
  \         'IAD','IND','JFK','LAX','MCI','MIA',\n         'MSY','ORD','PWM','RDU','SEA','SFO'\
  \ = 'Domestic';\n   value revfmt\n         . = 'Missing'\n         low - 10000 =\
  \ '最多 $10,000'\n         10000 <- 20000 = '$10,000 to $20,000'\n         20000 <-\
  \ 30000 = '$20,000 to $30,000'\n         30000 <- 40000 = '$30,000 to $40,000'\n\
  \         40000 <- 50000 = '$40,000 to $50,000'\n         50000 <- 60000 = '$50,000\
  \ to $60,000'\n         60000 <- HIGH  = '超过 $60,000';\nrun;\n```\n\n`PROC FORMAT`\
  \ 步骤创建了三个格式：`$ROUTES.` 和 `$DEST.` 是字符格式，而 `REVFMT.` 是数值格式。`$ROUTES.` 将航空公司路线分组。在\
  \ `$ROUTES.` 中，以下情况为真：\n\n* 单个值和范围都分配了标签\n* 缺失值由引号内的空格指定，并分配了标签“Missing”\n\n\n\n\
  \n\n- 关键字 `OTHER` 用于对任何未在范围内的值分配标签“Unknown”（未知）\n\n`$DEST.` 将机场代码标记为“International”（国际）或“Domestic”（国内）。在\
  \ `$DEST.` 中，以下条件成立：\n\n- 唯一的字符值被包含在引号中，并用逗号分隔\n- 此格式不处理缺失值以及未包含在范围内的值\n\n`REVFMT.`\
  \ 将货运收入数字分组为范围。在 `REVFMT.` 中，以下条件成立：\n\n- 使用小于运算符（`<`）显示不包含边界的范围（`10000<-20000`\
  \ 表示第一个值不包含在范围内）\n- 关键字 `LOW` 用于指定变量值范围的下限，但它包含缺失值\n- 缺失值用点（`.`）指定并分配标签 `Missing`（缺失）\n\
  - 关键字 `HIGH` 用于指定变量值范围的上限\n\n# 创建具有重叠范围的格式\n\n有时，你需要创建一个格式，将相同的值分到不同的范围内。若要创建重叠范围，请在\
  \ `PROC FORMAT` 的 `VALUE` 语句中使用 `MULTILABEL` 选项。\n\n| 通用形式，带有 `MULTILABEL` 选项的 `VALUE`\
  \ 语句： | `VALUE format-name (MULTILABEL);` |\n| --- | --- |\n| `format-name` 是正在创建的字符或数值格式的名称。\
  \ | |\n\n以下是对语法的解释：`format-name` 是正在创建的字符或数值格式的名称。\n\n## 示例\n\n假设你想创建一个日期分组为重叠类别的格式。在下表中，注意每个月份都出现在两个组中。\n\
  \n| 值 (Value) | 标签 (Label) |\n| --- | --- |\n| Jan - Mar | 第一季度 |\n| Apr - Jun |\
  \ 第二季度 |\n| Jul - Sep | 第三季度 |\n| Oct - Dec | 第四季度 |\n| Jan - Jun | 上半年 |\n| Jul-\
  \ Dec | 下半年 |\n\n在下方的 `PROC FORMAT` 步骤中，添加了 `MULTILABEL` 选项，表示 `DATES.` 格式具有重叠范围的值：\n\
  \n```\nproc format;\n   value dates (multilabel) \n         '01jan2000'd - '31mar2000'd\
  \ = '1st Quarter'\n         '01apr2000'd - '30jun2000'd = '2nd Quarter'\n      \
  \   '01jul2000'd - '30sep2000'd = '3rd Quarter'\n         '01oct2000'd - '31dec2000'd\
  \ = '4th Quarter'\n         '01jan2000'd - '30jun2000'd = 'First Half of Year'\n\
  \         '01jul2000'd - '31dec2000'd = 'Second Half of Year';\nrun; \n```\n\n多标签（Multilabel）格式允许观测值包含在多个行或类别中。要使用多标签格式，你可以在支持它的过程在类变量上指定\
  \ `MLF` 选项：\n\n- `PROC TABULATE`\n- `PROC MEANS`\n- `PROC SUMMARY`\n\n当将多标签格式分配给类变量时，`MLF`\
  \ 选项会激活多标签格式处理。例如，这些语句对于以下 `TABULATE` 过程代码是正确的：\n\n- `FORMAT=` 选项指定 `DOLLAR15.2`\
  \ 为每个表格单元格中值的格式\n- `CLASS` 语句将 `Date` 识别为类变量，并使用 `MLF` 选项激活多标签格式处理。\n- `TABLE` 语句的行维度为每个格式化后的\
  \ `Date` 值创建一个行。\n- `FORMAT` 语句为类变量 `Date` 引用了新格式 `DATES.`。\n\n```\nproc tabulate\
  \ data = sasuser.sale2000 format = dollar15.2;\n   class Date / mlf;\n   var RevCargo;\n\
  \   table Date, RevCargo*(mean median);\n   format Date dates.;\nrun;\n```\n\n![RevCargo](img/m58-5-g1.png)\
  \ 提示：关于使用 `MULTILABEL` 选项的更多信息，请参阅 SAS `FORMAT` 过程文档。\n\n# 使用 PICTURE 语句创建自定义格式\n\
  \n## 概述\n\n你已经学习了 `VALUE` 语句可以将文本标签与离散数值或字符值相关联。假设你想在数值值中插入文本字符。例如，你可能将电话号码存储为数值（如\
  \ `1111231234`），并想将其显示为 `(111) 123-1234`。你可以使用 `PICTURE` 语句为打印数字创建一个模板。\n\n| 通用形式，带有\
  \ `PICTURE` 语句的 `PROC FORMAT`： | `PROC FORMAT;PICTURE format-namevalue-or-range='picture';RUN;`\
  \ |\n| --- | --- |\n| `format-name` 是你正在创建的格式的名称。 | |\n| `value-or-range` 是你想标记的单个值或值范围。\
  \ | |\n| `picture` 指定了格式化数值变量值的模板。该模板是引号括括的字符序列。图片的最大长度为 40 个字符。 |\n\n## 指定图片的方法\n\
  \n图片使用三种类型的字符进行指定：\n\n- 数字选择器（digit selectors）\n- 消息字符（message characters）\n- 指令（directives）\n\
  \n考虑先使用数字选择器和消息字符。你将在稍后的主题中学习指令。数字选择器是数字（`0` 到 `9`），用于定义数字的位置。如果你使用非零数字选择器，则根据需要向格式化值中添加零。如果你使用零作为数字选择器，则不会向格式化值中添加零。在下方的图片定义中，你可以看到非零选择器（`9`）和零选择器（`0`）的区别。\n\
  \n| 图片定义 | 数据值 | 格式化后的值 |\n| --- | --- | --- |\n| `picture month 99` | 1 | 11 |\n\
  | `picture month 00` | 1 | 01 |\n\n消息字符是要打印的非数字字符。数字选择器必须位于消息字符之前。前缀选项（prefix option）可追加文本。\n\
  \n| 图片定义 | 数据值 | 格式化后的值 |\n| --- | --- | --- |\n| `picture month='99'` | 1 | JAN\
  \ |\n| `picture month='00'` | 1 | 1 |\n\n## 示例\n\n以下 `PICTURE` 语句包含了数字选择器和消息字符。`RAINAMT.`\
  \ 格式对带有前导零的值使用零选择器。\n\n```\nproc format;\n   picture rainamt\n           0-2='99\
  \ slight'\n           2-4='99 moderate'\n           4-10='99 heavy'\n          \
  \ other='999 check';\nrun;\ndata rain;\n   input Amount;\n   datalines;\n   4\n\
  \   3.9\n   20\n   .5\n   6\n;\nproc print data=rain;\n   format amount rainamt.;\n\
  run;\n```\n\n以下输出显示了应用 `RAINAMT.` 格式的值。\n\n# 使用指令使用 PICTURE 语句\n\n指定图片的最后一种方法是使用指令。如果你使用指令，你必须在\
  \ `PICTURE` 语句中指定 `DATATYPE=` 选项。该选项指定图片适用于 SAS 日期、SAS 时间或 SAS 日期时间。\n\n| 通用形式，带有\
  \ `DATATYPE=` 选项的 `PICTURE` 语句： | `PICTURE format-namevalue-or-range, 'picture'\
  \ (DATATYPE=SAS-date-value-type);` |\n| --- | --- |\n\n## 指定指令的指南\n\n百分号（%）后跟字母表示指令。用于创建图片格式的指令列如下表所示。\n\
  \n| 指令 | 结果 |\n| --- | --- |\n| %a | 缩写的星期名称 |\n| %A | 完整的星期名称 |\n| %b | 缩写的月份名称\
  \ |\n| %B | 完整的月份名称 |\n| %d | 日期中的数字（1-31），无前导零 |\n| %H | 24 小时制的小时（0-23），无前导零 |\n\
  | %I | 12 小时制的小时（1-12），无前导零 |\n| %j | 年中的天数（1-366），无前导零 |\n| %m | 月份数字（1-12），无前导零\
  \ |\n\n\n\n\n\n| %M | 0-59 之间的分钟小数，不带前导零 |\n| %p | AM 或 PM |\n| %S | 0-59 之间的秒数，不带前导零\
  \ |\n| %U | 年周数（星期日为一周的第一天），0-53 之间的数字，不带前导零 |\n| %w | 星期几（1=星期日，到 7） |\n| %y |\
  \ 0-99 之间的年份（不世纪），不带前导零 |\n| %Y | 带有世纪的年份 |\n\n尽管指令通常返回不带前导零的数字，但你可以在指令中添加 `0`，这样如果返回的是一位数，则会在其前面加一个\
  \ `0`。如下所示，当你使用指令创建图形（picture）时，引号内的字符数是格式化后值的最大长度。如果你的值包含的字符比图形多，必须向指令中添加末尾空格。否则，格式化后的值将被截断。![directives](img/m58-8-g2.png)\n\
  \n## 示例\n\n假设你想以 `dd-mmmyyyy` 格式显示员工入职日期（例如 `25-JAN2000`）。该格式需要 10 个字符的空间。以下代码创建了这种格式。关于图形定义，你需要注意以下几点：\n\
  \n- 使用 `LOW` 和 `HIGH` 关键字包含所有值。\n- `%d` 指令中的 `0` 表示如果日几为一位数，则应在其前面加一个 `0`。\n- 因为单引号内只有八个字符，你必须添加两个空格来将长度设为\
  \ 10。\n\n```\nproc format;\n   picture mydate\n           low-high='%0d-%b%Y  '\
  \ (datatype=date);\nrun;\n\nproc print data=sasuser.empdata \n     (keep=division\
  \ hireDate lastName obs=5);\n   format hiredate mydate.;\nrun;\n```\n\n下面的输出显示了使用\
  \ `MYDATE.` 图形格式化的 `HireDate` 值。![MYDATE. picture format](img/m58-8-g1.png)提示：有关关于使用\
  \ `PICTURE` 语句的更多信息，请参阅 `FORMAT` 过程的文档。\n\n# 管理自定义格式\n\n## 使用 PROC FORMAT 配合 FMTLIB\
  \ 记录格式\n\n当你创建了大量的永久格式时，很容易忘记特定格式名称的精确拼写或其值范围。记住，在 `PROC FORMAT` 语句中添加关键字 `FMTLIB`\
  \ 可以显示指定目录中所有格式的列表，以及它们取值的描述。\n\n```\nlibname myfmts 'c:\\sas\\newfmt';\nproc format\
  \ lib=myfmts fmtlib;\nrun;\n```\n\n你还可以使用 `SELECT` 和 `EXCLUDE` 语句来处理特定的格式，而不是整个目录。\n\
  \n| 通用形式，带有 `FMTLIB` 以及 `SELECT` 和 `EXCLUDE` 语句的 `PROC FORMAT`：`PROC FORMAT LIB=library\
  \ FMTLIB;SELECT format-name;EXCLUDE format-name;RUN;`这里是对语法的解释：`library` 是存储格式的库名称。如果你未指定\
  \ `LIB=` 选项，将列出 `Work` 库中的格式。`format-name` 是你想选择或排除的格式。 |\n\n## 示例\n\n以下代码仅显示 `$ROUTES.`\
  \ 格式的文档。注意，在 `SELECT` 语句中指定格式时，格式名称末尾不需要加点。\n\n```\nlibname myfmts 'c:\\sas\\newfmt';\n\
  proc format lib=myfmts fmtlib;\n   select $routes;\nrun;\n```\n\n表 17.1 SAS 输出\n\
  \n| FORMAT NAME : $ROUTES LENGTH: 7 NUMBER OF VALUES: 5 MIN LENGTH: 1 MAX LENGTH:\
  \ 40 DEFAULT LENGTH: 7 FUZZ: 0 |\n| --- |\n| START | END | LABEL (VER. V7&#124|V8\
  \ 29AUG2002:11:13:14) |\n| | | Missing |\n| Route1 | Route1 | Zone 1 |\n| Route2\
  \ | Route4 | Zone 2 |\n| Route5 | Route7 | Zone 3 |\n| OTHER | OTHER | Unknown |\n\
  \n提示如果你在 `SELECT` 或 `EXCLUDE` 语句上指定了多个格式，请按如下方式用空格分隔每个格式名称：\n\n```\nselect $routes\
  \ newdate;\n```\n\n## 使用 PROC CATALOG 管理格式\n\n由于格式是保存为目录项（catalog entries），你可以使用\
  \ `CATALOG` 过程来管理你的格式。使用 `PROC CATALOG` 允许你执行以下操作：\n\n- 创建目录内容的列表\n- 复制目录或目录中的选项\n\
  - 删除或重命名目录中的项\n\n| 通用形式，`PROC CATALOG` 步骤：`PROC CATALOG CATALOG=libref.catalog;CONTENTS\
  \ <OUT=SAS-data-set>;COPY OUT=libref.catalog <options>;SELECT entry-name.entry-type(s);EXCLUDE\
  \ entry-name.entry-type(s);DELETE entry-name.entry-type(s);RUN;QUIT;`这里是对语法的解释：带有\
  \ `CATALOG=` 参数的 `libref.catalog` 是要处理的 SAS 目录。`SAS-data-set` 是包含目录列表的数据集名称。带有 `OUT=`\
  \ 参数的 `libref.catalog` 是将项复制到的 SAS 目录。`entry-name.entry-type(s)` 是要处理的目录项全名。 |\n\
  \n## 示例\n\n第一个 `PROC CATALOG` 步骤将 `$ROUTES.` 格式从 `Library.Formats` 目录复制到 `Work`\
  \ 目录。注意在 `SELECT` 语句中指定了格式名称。\n\n```\nproc catalog catalog=myts.formats;\n   copy\
  \ out=work.formats;\n   select $routes;\nrun;\n```\n\n`step` 步骤显示了 `Work.Formats`\
  \ 的内容。当格式被复制时，日志中会写入一条注释。![Contents of WORK.FORMATS](img/m58)\n```\n\n# 使用自定义格式\n\
  \n## 概述\n\n在创建自定义格式后，你可以使用 SAS 语句在 `DATA` 步骤中将格式永久分配给变量，可以在 `PROC` 步骤中临时指定格式以确定数据值的显示方式。你应该已经熟悉在\
  \ `FORMAT` 语句中引用格式。另一种为现有数据集中的变量分配、更改或删除格式的方法是使用 `DATASETS` 过程。\n\n| 通用形式，带有 `MODIFY`\
  \ 和 `FORMAT` 语句的 `DATASETS` 过程：`PROC DATASETS LIB=SAS-library <NOLIST>;MODIFY SAS-data-set;FORMAT\
  \ variable(s) format;QUIT;`这里是对语法的解释：`SAS-library` 是包含要修改数据的 SAS 库名称。`NOLIST` 抑制目录列表。`SAS-data-set`\
  \ 是要修改的数据集名称。`variable` 是你想分配、更改或删除格式的一个或多个变量的名称。`format` 是应用于前面的变量或变量的格式名称。如果你没有指定格式，则会删除与变量关联的任何格式。\
  \ |\n\n注意：`DATASETS` 过程是交互式的，在执行 `QUIT` 语句之前它一直留在内存中。\n\n## 示例\n\n在以下代码中，`Flights`\
  \ 数据集中的两个变量被更改了。`$DEST.` 格式关联变量 `Dest`，并从变量 `Baggage` 删除了格式。\n\n```\nproc datasets\
  \ lib=Mylib;\n   modify flights;\n   format baggage;\n```\n\n## 使用永久位置存储格式\n\n当你为数据集中的变量永久关联格式时，重要的是确保你引用的格式存储在永久位置。记住格式的存储位置是在\
  \ `FORMAT` 过程中创建格式时确定的。当你要在后续 SAS 会话中使用格式时，采取这些步骤非常有用：\n\n1. 在运行 `PROC FORMAT` 步骤的\
  \ SAS 会话中将库 `libref` 分配给 SAS 库。\n2. 在创建格式的 `PROC FORMAT` 步骤中指定 `LIB=LIBRARY`。\n\n\
  \n\n\n### 3. 在程序中包含引用格式的 `LIBNAME` 语句，将库引用 `libref` 分配给包含永久格式目录的库。\n\n你可以将格式存储在所选择的任何目录（catalog）中。然而，在访问它们之前，你必须向\
  \ `SAS` 标识格式目录。你将在后面的主题中学习到这一内容。当引用格式时，`SAS` 会按照以下顺序自动查找这些库：\n\n1. `Work.Formats`\n\
  2. `Library.Formats`\n\n建议对格式使用 `Library` 库引用，因为在引用格式时，它会被自动搜索。如果你将格式存储在默认搜索路径中的这些库之外的库或目录中，则你必须使用\
  \ `FMTSEARCH=` 系统选项来告诉 `SAS` 在何处找到你的格式。\n\n| 通用形式，`FMTSEARCH=` 系统选项：`OPTIONS FMTSEARCH=(catalog-1\
  \ catalog-2...catalog-n);` | 此处是该语法的解释：`catalog` 是要搜索的一个或多个目录的名称。`catalog` 的值可以是\
  \ `libref` 或 `libref.catalog`。如果只给出 `libref`，则 `SAS` 假设目录名为 `Formats`。 |\n\n`Work.Formats`\
  \ 目录总是第一个被搜索，接着搜索 `Library.Formats` 目录，除非其中一个或两个目录出现在 `FMTSEARCH=` 列表中。\n\n## 示例\n\
  \n假设你有一个存储在 `Rpt` 库和 `Prod.Newfmt` 目录中的格式。以下 `OPTIONS` 语句告诉 `SAS` 在何处找到你的格式：\n\n\
  ```\noptions fmtsearch=(rpt prod.newfmt);\n```\n\n由于没有为 `Rpt` 库引用指定目录，因此假设了默认目录名\
  \ `Formats`。此 `OPTIONS` 语句创建了以下搜索顺序：![Search order](img/m58-18-g1.png) 由于 `FMTSEARCH=`\
  \ 选项中未指定 `Work` 和 `Library` 库引用，因此将按照默认顺序进行搜索。\n\n#### 避免格式错误\n\n考虑一下如果你忘记在 `FMTSEARCH=`\
  \ 选项中指定目录、拼写错误的格式名称，或者犯了其他导致 `SAS` 无法找到你指定的格式的错误会发生什么。\n\n默认情况下，`FMTERR` 系统选项生效。如果你使用\
  \ `SAS` 无法加载的格式，`SAS` 会发出错误消息并停止处理该步骤。为了防止这种情况，你必须将系统选项 `FMTERR` 改为 `NOFMTERR`。当\
  \ `NOFMTERR` 生效时，`SAS` 会用默认格式替换缺失的格式并继续处理。\n\n| 通用形式，`FMTERR` 系统选项：`OPTIONS FMTERR\
  \ | NOFMTERR;` | 此处是语法的解释：`FMTERR` 指定当 `SAS` 找不到指定的变量格式时，它会生成错误消息并停止处理。不会发生默认格式替换。`NOFMTERR`\
  \ 将缺失的格式替换为 `w.` 或 `$w.` 默认格式并继续处理。 |\n\n## 示例\n\n假设 `FMTERR` 系统选项生效。在之前的示例中，我们创建了\
  \ `$ROUTES.` 格式将航空公司路线分组到不同的区域。在下面的代码中，`$ROUTES.` 格式拼写错误了：\n\n```\nproc print data=sasuser.cargorev(obs=10);\n\
  \   format route $route.;\nrun;\n```\n\n由于 `FMTERR` 生效，无法找到格式，`SAS` 停止处理该步骤。错误消息被写入日志中。\n\
  \n表 17.2 SAS 日志\n\n| |\n| ```\n30   proc print data=sasuser.cargorev(obs=10);\n\
  31      format route $route.;\nERROR: The format $ROUTE was not found or could not\
  \ be loaded.\n32   run;\n\nNOTE: The SAS System stopped processing this step because\
  \ of errors.\n``` | |\n\n如果指定了 `NOFMTERR` 系统选项，则会发生默认格式替换，`SAS` 继续处理该步骤。\n\n```\n\
  options nofmterr;\nproc print data=sasuser.cargorev(obs=10);\n   format Route $route.;\n\
  run;\n```\n\n`SAS` 用 `$w.` 格式替换了无法找到的 `$ROUTE.` 格式。日志中没有写入消息，处理继续。你可以从输出中看到，你打算使用的格式尚未应用。![RevCargo](img/m58-20-g1.png)\n\
  \n### 从 SAS 数据集创建格式\n\n## 概述\n\n你已经看到可以在 `PROC FORMAT` 步骤中指定值和标签来创建格式。你也可以从包含值信息（称为控制数据集）的\
  \ SAS 数据集创建格式。要此此，你使用 `CNTLIN=` 选项读取数据并创建格式。\n\n| 通用形式，`PROC FORMAT` 中的 `CNTLIN=`\
  \ 选项：`PROC FORMAT LIBRARY=libref.catalog CNTLIN=SAS-data-set;` | 此处是语法的解释：`libref.catalog`\
  \ 是你想要存储格式的目录名称。`SAS-data-set` 是你用来创建格式的 SAS 数据集的名称。 |\n\n## 示例\n\n假设你有一个名为 `Routes`\
  \ 的 SAS 数据集，其中包含创建格式所需的变量。你如下所示在 `CNTLIN=` 选项中指定数据集：\n\n```\nproc format lib=myfmts\
  \ cntlin=routes;\nrun;\n```\n\n你可以看到，从数据集创建格式的代码是简单的。然而，在创建格式之前，控制数据集必须包含某些变量。因此，大多数数据集在创建格式之前必须进行重组。\n\
  \n#### 控制数据集的规则\n\n当你使用程序语句来创建格式时，你需要指定格式名称、范围值以及每个范围或值的标签，如 `VALUE` 语句所示：\n\n```\n\
  value rainfall 'none';\n```\n\n创建格式的控制数据集必须提供这些信息。也就是说，`CNTLIN=` 选项指定的数据集必须满足以下要求：\n\
  \n- 它必须包含 `FmtName`、`Start` 和 `Label` ，分别对应格式名称、范围起始值和标签。\n- 如果指定了范围，它必须包含 `End`。如果没有\
  \ `End`，`SAS` 假设范围的结束值等于 `Start` 值。\n- 对于字符格式，它必须包含 `Type` ，除非 `FmtName` 以 `$` 开头。\n\
  - 如果指定了多个格式，它必须按 `FmtName`分组。\n\n## 示例\n\n## 概述\n\n假设你想将三字母机场代码标记为机场所在的城市。你有一个包含机场代码和机场城市的数据集\
  \ `Acities`。然而，该数据没有 `CNTLIN=` 选项所需的变量。\n\n表 17.3 SAS 数据集 Sasuser.Acities（部分列表）\n\
  \n| 机场所在城市 | 起点 | 机场名称 | 机场所在国家 |\n| --- | --- | --- |\n| Auckland | AKL | International\
  \ | 新西兰 |\n| Amsterdam | AMS | Schiphol | 荷兰 |\n| Anchorage, AK | ANC | International\
  \ Airport | 美国 |\n| Stockholm | ARN | Arlanda | 瑞典 |\n| Athens (Athanai) | ATH |\
  \ Hellinikon International Airport | 希腊 |\n| Birmingham, AL | BHM | Birmingham International\
  \ Airport | 美国 |\n| Bangkok | BKK | Don Muang International Airport | 泰国 |\n\n从该数据集创建格式，你需要：\n\
  \n1. 列出数据集变量。\n2. 重组数据。\n\n#### 步骤 1：列出数据集变量\n\n记得你需要 `FmtName`、`Start` 和 `Label`。你可以提交一个\
  \ `PROC CONTENTS` 步骤来获取 `sasuser.acities` 数据集的变量列表。\n\n| 部分输出 |\n| --- |\n| ```\n\
  proc contents data=sasuser.acities; \nrun;\n``` |\n![部分输出](img/m58-24-g1.png)\n\n\
  提示你还可以通过 `PROC DATASETS` 配合 `CONTENTS` 语句，或者在 SAS Explorer 窗口中查看 SAS 数据集的属性来获取变量列表。\n\
  \n#### 步骤 2：重组数据\n\n\n\n\n一旦你查看了数据并知道了变量名，就可以准备编写一个 `DATA` 步来处理数据了。变量 `Code` 是三字母机场代码，变量\
  \ `City` 是机场所在的城市。你可以将变量 `Code` 重命名为 `Start`，将变量 `City` 重命名为 `Label`，但你还需要创建一个名为\
  \ `FmtName` 的变量。以下代码是准备你的数据的一种高效方法。该 `DATA` 步使用了以下语句：\n\n*   使用 `KEEP` 语句仅将指定的变量写入输出数据集。\n\
  *   使用 `RETAIN` 语句（保留）创建变量 `FmtName` 并将其值设置为 `'$airport'`。\n*   使用 `RENAME` 数据集选项将变量\
  \ `Code` 重命名为 `Start`（你不需要名为 `End` 的变量，因为你正在标记离散值，范围范围），并将变量 `City` 重命名为 `Label`。\n\
  \n```\ndata sasuser.aports;\n   keep Start Label FmtName;\n   retain FmtName '$airport';\n\
  \   set sasuser.acities (rename=(Code=Start \n       City= Label));\nrun;\n\nproc\
  \ print data=sasuser.aports(obs=10) noobs;\nrun;\n```\n\n下面是新数据集 `Sasuser.Aports`\
  \ 中前十个观测值的列表![前十个观测值](img/m58-24-g2.png) 该数据集现在已经是正确的格式，可以使用 `CNTLIN=` 选项来创建格式。一旦数据格式正确，你就可以使用\
  \ `CNTLIN=` 选项来创建格式。第一个 `PROC FORMAT` 步从数据集 `Sasuser.Aports` 创建了一个格式。第二个 `PROC FORMAT`\
  \ 步对该新格式进行文档说明。\n\n```\nproc format library=sasuser cntlin=sasuser.aports;\nrun;\n\
  \nproc format library=sasuser fmtlib;\n   select $airport;\nrun;\n```\n\n输出的前几行所示所示。\n\
  \n表 17.4 部分 SAS 输出\n\n| FORMAT NAME : $AIRPORT LENGTH: 22 NUMBER OF VALUES: 52 MIN\
  \ LENGTH: 1 MAX LENGTH: 40 DEFAULT LENGTH: 22 FUZZ: 0 |\n| --- |\n| START | END\
  \ | LABEL (VER. V7&#124;V8 21OCT2002:14:13:14) |\n| AKL | AKL | Auckland |\n| AMS\
  \ | AMS | Amsterdam |\n| ANC | ANC | Anchorage, AK |\n| ARN | ARN | Stockholm |\n\
  | ATH | ATH | Athens (Athanai) |\n| BHM | BHM | Birmingham, AL |\n| BKK | BKK |\
  \ Bangkok |\n\n## 应用格式\n\n考虑应用于数据集 `Sasuser.Cargo99` 的格式。以下 `PROC PRINT` 代码将 `$AIRPORT.`\
  \ 格式分配给 `Dest` 和 `Origin` 变量：\n\n```\noptions fmtsearch=(sasuser);\nproc print data=sasuser.cargo99\
  \ (obs=5);\n   var origin dest cargorev;\n   format origin dest $airport.;\nrun;\n\
  ```\n\n| ![Sasuser.Cargo99](img/m58-25-g1.png) |\n\n提示：有关关于使用 `CNTLIN=` 选项的更多信息，请参阅\
  \ `FORMAT` 过程的 SAS 文档。\n\n# 从自定义格式创建 SAS 数据集\n\n## 概述\n\n你知道如何从 SAS 数据集创建格式，但如果你想从格式创建\
  \ SAS 数据集怎么办？要实现这一点，你需要使用 `CNLOUT=` 选项。\n\n| `PROC FORMAT` 中 `CNLOUT=` 选项的一形式：`PROC\
  \ FORMAT LIBRARY=libref.catalog CNTLOUT=SAS-data-set;SELECT format-name format-name...;EXCLUDE\
  \ format-name format-name...;RUN;` | 这里是对该语法的解释：`libref.catalog` 是格式所在目录的名称。`SAS-data-set`\
  \ 是你想创建的 SAS 数据集的名称。`format-name` 是你想要选择或排除的格式名称。 |\n\n输出控制数据集将包含完全描述每个格式所有方面的变量，包括可选设置。输出数据集包含指定目录每个每个格式的每个范围一个观测值。你可以使用\
  \ `SELECT` 或 `EXCLUDE` 语句将特定格式包含在数据。当你需要修改格式但不再拥有用于创建该格式的 SAS 数据集时，从格式创建 SAS 数据集非常有用。当你需要更新格式时，请采取以下操作：\n\
  \n1.  使用 `CNLOUT=.` 从格式中的值创建 SAS 数据集。\n2.  使用任意方法编辑数据集。\n3.  使用 `CNTLIN=.` 从更新后的\
  \ SAS 数据集创建格式。\n\n## 示例\n\n## 概述\n\n在上一个示例中，你创建了 `$AIRPORT.` 格式。假设你想向格式添加以下机场代码![机场代码](img/m58-31-g2.png)\n\
  \n### 第 1 步：从格式创建 SAS 数据集\n\n首先，将 `$AIRPORT.` 格式写为 SAS 数据集。在下面的代码中，输出数据集命名为 `Sasuser.Fmtdata`。使用\
  \ `SELECT` 语句是为了使生成的数据集仅包含 `$AIRPORT.` 的数据。\n\n```\nproc format;\n   out=sasuser.fmtdata;\n\
  \   run;\n```\n\n当你使用 `CNLOUT=` 选项时，输出数据集包含了关于格式的每个。`sasuser.fmtdata` 数据集具有相同的观测值。在\
  \ `PRINT` 过程中，`VAR` 语句指定了其中的几个：\n\n```\nproc print data=sasuser.fmtdata (obs=5)\
  \ noobs;\n   var fmtname start end\n       default;\nrun;\n```\n\n![Sasuser.Cargo99](img/m58-25-g1.png)\n\
  \n等待，更新格式的下一步是编辑数据集。你可以使用 `PROC SQL` 或 `DATA` 步向数据集添加观测值。无论你选择哪种方法，都必须添加 `Start`\
  \ 和 `End` 的取值。如果 `Start` 和 `End` 同时存在，SAS 将返回错误。你不需要添加数据集的其他变量。\n\n### 第 3 步：从数据集创建格式\n\
  \n一旦数据集经过编辑并保存，你就可以 `CNTLIN=` 选项从数据集创建格式。以下代码创建 `$AIRPORT.` 格式，然后使用 `FMTLIB` 对其进行文档说明：\n\
  \n```\nproc format library=sasuser cntlin=sasuser.fmtdata;\nrun;\n\nproc format\
  \ library=sasuser fmtlib;\n   select $airport;\nrun;\n```\n\n输出的前几行所示所示。\n\n所示的部分输出包含了格式中的新机场。\n\
  \n表 17.5 部分 SAS 输出\n\n| FORMAT NAME : $AIRPORT LENGTH: 22 NUMBER OF VALUES: 56 MIN\
  \ LENGTH: 1 MAX LENGTH: 40 DEFAULT LENGTH: 22 FUZZ: 0 |\n| --- |\n| START | END\
  \ | LABEL (CONT'D) |\n| SYD | END | Sydney, New South Wales |\n| VIE | VIE | Wien\
  \ (Vienna) |\n| WLG | WLG | Wellington |\n| YQB | YQB | Quebec, QC |\n| YUL | YUL\
  \ | Montreal, QC |\n| YYC | YYC | Calgary, AB |\n| YYZ | YYZ | Toronto, ON |\n\n\
  ## 总结\n\n## \n\n### 使用 VALUE 语句创建自定义格式\n\n通过 `FORMAT` 过程中的 `VALUE` 语句创建字符和数值格式。当你指定\
  \ `libref` 时，格式存储在指定的库中。\n\n### 创建具有重叠范围的格式\n\n使用 `MULTILABEL` 选项创建具有重叠范围的格式。当格式具有重叠范围时，格式中的值可能有多个标签。该格式可以使用支持\
  \ `MLF` 选项的过程。\n\n### 使用 PICTURE 语句创建自定义格式\n\n`PICTURE` 语句用于为数值变量的值创建格式化模板。图片使用数字选择器、消息字符和指令来定义。\n\
  \n\n\n\n在 `PROC FORMAT` 语句中使用 `FMTLIB` 关键字可以获取指定目录中格式的文档。输出将显示格式名称、起始和结束值以及标签。您还可以使用\
  \ `SELECT` 和 `EXCLUDE` 语句来处理特定格式，而不是整个目录。\n\n## 管理格式\n\n由于格式被存储为目录条目，因此您可以使用 `PROC\
  \ CATALOG` 来复制、重命名、删除或创建目录中条目的列表。\n\n## 使用自定义格式\n\n一旦您创建了格式，就可以像引用 SAS 格式一样引用它。如果您将格式存储在\
  \ ` `Work.Formats` 以外的位置，则必须使用 `FMTSEARCH=` 系统选项将该位置添加到搜索路径中，以便 SAS 能够找到该格式。将默认的\
  \ `FMTERR` 系统选项更改为 `NOFMTERR` 可能很有用。更改默认系统选项后，如果 SAS 无法找到您引用的格式，它将替换 `w.` 或 `$w.`\
  \ 格式并继续处理。您可以通过使用 `PROC DATASETS` 修改数据集，将格式与变量永久关联。\n\n## 从 SAS 数据集创建格式\n\n使用 `CNTLIN=`\
  \ 选项指定一个用于创建格式的 SAS 数据集。该 SAS 数据集必须包含 `FmtName`、`Start` 和 `Label` 变量。如果值具有范围，则必须存在\
  \ `End` 变量。\n\n## 从格式创建 SAS 数据集\n\n使用 `CNTLOUT=` 选项从格式创建 SAS 数据集。这对维护格式非常有用，因为您可以轻松地更新\
  \ SAS 数据集。\n\n## 示例\n\n### 创建多标签格式\n\n```\nproc format;\n   value dates (multilabel)\n\
  \         '01jan2000'd - '31mar2000'd = '1st Quarter'\n         '01apr2000'd - '30jun2000'd\
  \ = '2nd Quarter'\n         '01jul2000'd - '30sep2000'd = '3rd Quarter'\n      \
  \   '01oct2000'd - '31dec2000'd = '4th Quarter'\n         '01jan2000'd - '30jun2000'd\
  \ = 'First Half of Year'\n         '01jul2000'd - '31dec2000'd = 'Second Half of\
  \ Year';\nrun;\n```\n\n### 创建图片格式\n\n```\nproc format;\n   picture rainamt\n   \
  \        0-2='9.99 slight'\n           2<-4='9.99 moderate'\n           4<-<10='9.99\
  \ heavy'\n           other='999 check value';\nrun;\n```\n\n### 使用指令创建图片格式\n\n```\n\
  proc format;\n   picture mydate\n           low-high='%0d-%b%Y  ' (datatype=date);\n\
  run;\n```\n\n### 重构 SAS 数据集并从数据创建格式\n\n```\ndata sasuser.aports;\n   keep Start\
  \ Label FmtName;\n   retain FmtName '$airport';\n   set sasuser.acities (rename=(Code=Start\n\
  \       City= Label));\nrun;\n\nproc format library=sasuser cntlin=sasuser.aports;\n\
  run;\n```\n\n### 从格式创建 SAS 数据集\n\n```\nproc format library=sasuser cntout=sasuser.formats;\n\
  run;\n```\n\n## 注意事项\n\n- 由于格式被存储为目录条目，因此您可以使用 `PROC CATALOG` 来复制、重命名、删除或创建目录中条目的列表。\n\
  - 默认情况下，SAS 会搜索格式。如果您将格式存储在 `Work.Formats` 以外的位置，则必须使用 `FMTSEARCH=` 系统选项将该位置添加到搜索路径中。以便\
  \ SAS 能够找到该格式。将默认的 `FMTERR` 系统选项更改为 `NOFMTERR` 可能很有用。更改默认系统选项后，如果 SAS 无法找到您引用的格式，它将替换\
  \ `w.` 或 `$w.` 格式并继续处理。\n- 您可以通过使用 `PROC DATASETS` 修改数据集，将格式与变量永久关联。\n- 使用 `CNTLIN=`\
  \ 选项指定一个用于创建格式的 SAS 数据集。该 SAS 数据集必须包含 `FmtName`、`Start` 和 `Label` 变量。如果值具有范围，则必须存在\
  \ `End` 变量。\n- 使用 `CNTLOUT=` 选项从格式创建 SAS 数据集。这对维护格式非常有用，因为您可以轻松地更新 SAS 数据集。\n- 在\
  \ `PROC FORMAT` 语句中使用 `FMTLIB` 关键字可以获取指定目录中格式的文档。\n\n# 测验\n\n1. 使用哪个系统选项来识别格式？\n\
  \    a. `NOFMTERR`\n    b. `FMTLIB`\n    c. `CATALOG`\n    d. `FMTSEARCH=`\n\n2.\
  \ 给定以下 OPTIONS 语句，SAS 将以什么顺序搜索以找到用户定义的格式？\n    ```\n    options fmtsearch=(work\
  \ abc.newfmt sasuser);\n    ```\n    a. `Work.Formats>Library.Formats>Abc.Newfmt>Sasuser.Formats`\n\
  \    b. `Work.Formats>Library.Formats>Abc.Newfmt>Sasuser`\n    c. `Work.Formats>Abc.Newfmt>Sasuser.Format`\n\
  \n3. 当 `NOFMTERR` 生效时，当 SAS 遇到无法找到的格式时会发生什么？\n    a. 创建默认格式。\n    b. 替换 `w.` 或 `$w.`\
  \ 格式并继续处理。\n    c. 停止处理并向日志写入错误。\n    d. 跳过下一步。\n\n4. `CNTLIN=` 必须包含以下哪些变量？\n  \
  \  a. `End`\n    b. `FmtName`\n    c. `Value`\n    d. `Description`\n\n5. 给定以下代码，缺少哪个选项？\n\
  \    ```\n    proc format;\n       value times\n             '00:00'-04:59' = 'Red'\n\
  \             '05:00'-11:59' = 'Morning'\n             '12:00'-17:59' = 'Afternoon'\n\
  \             '18:00'-23:59' = 'Evening';\n    run;\n    ```\n    a. `MULTABEL`\n\
  \    b. `MULTIRANGE`\n    c. `ML`\n    d. `MULTIFMAT`\n\n6. 使用哪个选项从格式创建 SAS 数据集？\n\
  \    a. `CNTLIN=`\n    b. `LIB=`\n    c. `CNTLOUT=`\n    d. `FMTLIB`\n\n7. `PROC\
  \ FORMAT` 使用哪个选项来获取特定目录中的格式文档？\n    a. `FMTSEARCH`\n    b. `FMTERR`\n    c. `CATALOG`\n\
  \    d. `FMTLIB`\n\n8. 将将哪些语句添加到 `PROC CATALOG` 代码中，将 `Sasuser.Formats` 目录中的 `LEVELS.`\
  \ 和 `$PICKS.` 格式复制到 `Work.Formats` 目录？\n    ```sas\n    proc catalog cat=sasuser.formats;\n\
  \        ?\n        ?\n    run;\n    ```\n    a. `copy out=sasuser.formats; select\
  \ levels.format $picks.format;`\n    b. `copy out=work.formats; select levels $picks;`\n\
  \    c. `copy out=work.formats; select levels.format picks.formatc;`\n    d. `copy\
  \ out=work.formats; select levels.format $picks.format;`\n\n9. 给定以下 `PROC FORMAT`\
  \ 步骤，当应用 `SKICOND` 格式时，值 6.1 如何显示？\n    ```\n    proc format;\n       value skicond\n\
  \              0-3='Poor'\n              3<-6='Fair'\n              6<-9='Good'\n\
  \              9<-high='Excellent';\n    run;\n    ```\n    a. 6.1\n    b. Fair\n\
  \    c. Good\n    d. .\n\n\n\n\n## 概述\n\n## 引言\n\n有时，你希望在不替换整个数据集的情况下修改 SAS 数据集的观测值。你可以在\
  \ DATA 步中使用 `MODIFY` 语句来实现。通过使用 `MODIFY` 语句，你可以在不创建额外额外副本的情况下，替换、删除或追加现有数据集中的观测值。在本章中，你将学习修改数据集中的所有观测值、使用\
  \ `BY` 语句匹配观测值，以及使用索引定位观测值。在修改数据时，保护你的数据并跟踪所做的更改通常是关重要的。在本章中，你将学习如何创建完整性约束来保护你的数据。你还将学习两种跟踪更改的不同方法：审计跟踪（audit\
  \ trails）和生成数据集（generation data sets）。你使用审计跟踪来跟踪对数据集进行原地修改的更改，并使用生成数据集来跟踪在重建数据集时所做的更改。\n\
  \n# 使用 MODIFY 语句\n\n当你提交一个带有 `MERGE`、`UPDATE` 或 `SET` 语句的 DATA 步时，如果输出数据集已经存在，SAS\
  \ 会创建输出数据集的第二个副本。执行完成后，SAS 会删除数据的原始副本。结果是原始数据集被具有相同名称的新数据集替换。新数据集可能包含与原始数据集不同的变量集。新数据集中的变量属性可能与原始数据集不同。![set\
  \ statement](img/m59-2-g1.png) 相此，当你提交一个带有 `MODIFY` 语句的 DATA 步时，输入输出数据集必须相同。SAS\
  \ 不会创建数据的第二个副本，而是对数据集进行原地更新。新变量可以添加到程序数据向量 (PDV) 中，但它们不会写入数据集。因此，在修改数据时，数据集中的变量集改变。![MODIFY\
  \ statement](img/m59-2-g2.png) 当你使用 `MODIFY` 语句时，DATA 步底部有一个隐含的 `REPLACE` 语句而不是\
  \ `OUTPUT` 语句。使用 `MODIFY` 语句，你可以更新：\n\n* 数据集中的每个观测值\n* 使用事务数据集和 `BY` 语句的观测值\n* 使用索引定位的观测值\n\
  \n警告：如果使用 `MODIFY` 语句的 DATA 步在处理过程中异常终止，可能会丢失数据并可能损坏主数据集。你可以通过以下操作从失败中恢复：\n\n* 从备份恢复主数据集并重启该步，或\n\
  * 保留审计跟踪文件并使用它确定哪些主观测值已更新。\n\n首先我们考虑使用 `MODIFY` 语句修改数据集中的所有观测值。\n\n# 修改 SAS 数据集中所有观测值\n\
  \n## 概述\n\n当 SAS 数据集中的每个观测值都需要相同的修改时，可以使用 `MODIFY` 语句并使用赋值语句指定修改内容。\n\n| 带有赋值语句的\
  \ MODIFY 语句通用形式：\n```\nDATA SAS-data-set;\nMODIFY SAS-data-set;\nexisting-variable\
  \ = expression;\nRUN;\n```\n以下是对语法的解释：\nSAS-data-set 是你想要修改的数据集名称。\nexisting-variable\
  \ 是你想要更新的变量名称。\nexpression 是你想要应用的函数或其他表达式。 |\n\n## 示例\n\n假设某航空公司决定为乘客提供更多空间。该航空公司必须减少商务舱和经济舱的座位数量。SAS\
  \ 数据集 `Capacity` 具有 `Econ` 和 `Business` 变量，存储了座位数量的值。在下面的程序中，`Econ` 的赋值语句将经济舱的座位数减少到原始数量的\
  \ 95%，`Business` 的赋值语句将商务舱的座位数减少到原始数量的 90%。两个赋值语句都使用了 `INT` 函数来返回结果的整数部分。注意：如果你选择运行此示例，必须从\
  \ `sasuser` 库将数据集 `Capacity` 复制到 `work` 库。\n\n```\nproc print data=capacity (obs=4);\n\
  run;\n\ndata capacity;\n    capacity;\n   Econ = int(Econ * .95);\n   Business =\
  \ int(Business * .90);\nrun;\n\nproc print data=capacity (obs=4);\nrun;\n```\n\n\
  以下输出显示 `MODIFY` 语句之前的数据。![output before the modify statement](img/m59-3-g1.png)\
  \ 以下输出显示 `MODIFY` 语句之后的数据。你可以看到 `Business` 和 `Econ` 中的值已经减少。![output after the modify\
  \ statement](img/m59-3-g2.png)\n\n# 使用事务数据集修改观测值\n\n## 概述\n\n你可以使用 `MODIFY` 语句更新数据集中的所有观测值，但有时你只想更新选定的观测值。你可以通过使用带有\
  \ `BY` 语句的 `MODIFY` 语句通过匹配观测值来应用更新，从而使用事务数据集中的值来修改主数据集。\n\n| 带有 BY 语句的 MODIFY 语句通用形式：\n\
  ```\nDATA SAS-data-set;\nMODIFY SAS-data-set transaction-data-set;\nBY key-variable;\n\
  RUN;\n```\n以下是对语法的解释：\nSAS-data-set 是你想要修改的数据集名称（也称为主数据集）。\ntransaction-data-set\
  \ 是包含更新值的数据集名称。\nkey-variable 是主数据集和事务集中用于匹配的变量名称。 |\n\n注意：在 `MODIFY` 语句中，你必须先列主数据集，然后是事务数据集。`BY`\
  \ 语句将事务数据集中的观测值与主数据集中的观测值进行匹配。当 `MODIFY` 语句从事务数据集读取一个观测值时，它使用动态 `WHERE` 处理（SAS 内部生成\
  \ `WHERE` 语句）在主数据集中定位匹配的观测值。主数据集中的匹配观测值可以被替换（replace）、删除（delete）或追加（append）。默认情况下，该观测值会被替换。注意：由于\
  \ `MODIFY` 语句使用 `WHERE` 处理来定位匹配的观测值，因此两个数据集都不排序。然而，让主数据集排序或建立索引并让事务数据集排序可以减少处理开销，特别是对于大文件。\n\
  \n\n\n\n假设你有一个主数据集 `Capacity`，其中包含某航空公司的航线编号。某些航线发生了变化，这些更改存储在事务数据集 `Newrtnum` 中。通过匹配变量\
  \ `FlightID` 的值来更新主数据集。\n\n```\nproc print data=capacity(obs=5);\nrun;\n\ndata capacity;\n\
  \   modify capacity sasuser.newrtnum;\n   by flightid;\nrun;\n\nproc print data=capacity(obs=5);\n\
  run;\n```\n\n以下 `PROC PRINT` 输出显示了在应用更新之前数据集 `Capacity` 的前五行。![Capacity 的输出](img/m59-7-g1.png)对于每个匹配的观测值，`RouteID`\
  \ 的值都会被更新。![capacity 的输出](img/m59-7-g2.png)\n\n## 处理重复值\n\n当你使用 `MODIFY` 和 `BY`\
  \ 语句更新数据集时，`WHERE` 处理从主数据集的顶部开始，找到第一个匹配项并对其更新。考虑一下如果主数据集或事务数据集中存在重复值会发生什么。假设你有以下代码，使用事务数据集\
  \ `T` 来更新主数据集 `M`：\n\n```\ndata m;\n    modify m t;\n    by a;\nrun;\n```\n\n如果主数据集中存在\
  \ `BY` 变量的重复值，则只有重复值组中的第一个观测值会被更新。![主数据集](img/m59-10-g1.png)如果 `etransaction` 数据集中存在\
  \ `BY` 变量的重复值，则事务将相互覆盖，导致该组中的最后一个事务成为主数据集中的结果。![事务数据集](img/m59-10-g2.png)或者，你可以编写代码来累积每个事务的数值。\n\
  \n## 处理缺失值\n\n如果事务数据集中存在缺失值，SAS 不会用缺失值替换主数据集中的数据，除非它们是特殊缺失值。**注意**：特殊缺失值是一种数值型缺失值，它允许你使用字母\
  \ `A-Z` 或下划线来表示不同类型的缺失数据。你可以在 `DATA` 步中使用 `MISSING` 语句来指定特殊缺失值。更多信息，请参阅 SAS 文档。你可以通过使用\
  \ `MODIFY` 语句中的 `UPDATEMODE=` 选项指定如何处理事务数据集中的缺失值。\n\n| 通用格式，带有 `UPDATEMODE=` 选项的\
  \ `MODIFY` 语句：`MODIFY master-data-set transaction-data-set UPDATODE=MISSINGCHECK\
  \ &#124; NOMISSINGCHECK;` | 以下是语法的解释：`master-data-set`是你想要修改的 SAS 数据集的名称。`transaction-data-set`是存储更新后值的\
  \ SAS 数据集的名称。`MISSINGCHECK` 防止事务数据集中的缺失值替换主数据集中的值，除非它们是特殊缺失值。`MISSINGCHECK` 是默认值。`NOMISSINGCHECK`\
  \ 允许事务数据集中的缺失值替换主数据集中的值。事务数据集中的特殊缺失值仍然会替换主数据集中的值。 |\n\n# 修改通过索引定位的观测值\n\n## 概述\n\
  \n你已经学习可以使用 `BY` 语句通过匹配来访问主数据集中想要更新的值。当你拥有一个带索引的主数据集时，你可以使用索引直接访问想要更新的观测值。要实现这一点，你需要使用以下语句：\n\
  \n* 一个带有 `KEY=` 选项的 `MODIFY` 语句，用于命名索引以定位要更新的观测值\n* 一个 `SET` 语句或 `INPUT` 语句，用于读取具有同名变量或值提供给索引的变量的事务数据集\n\
  \n| 通用格式，带有 `KEY=` 选项的 `MODIFY` 语句：`MODIFY SAS-data-set KEY=index-name;` | 以下是语法的解释：`SAS-data-set`是主数据集，或者你想要更新的数据集。`index-name`是你用于定位观测值的简单或复合索引的名称。\
  \ |\n\n使用索引更新与使用 `BY` 语句更新不同。当你使用带有 `KEY=` 选项的 `MODIFY` 语句命名索引时，必须发生以下情况：\n\n* 你必须显式指定想要执行的更新。\n\
  * 事务数据集中的每个观测值在主数据集中必须有一个匹配的观测值。如果一个主观测值对应多个事务观测值，则只应用事务中的第一个观测值。其他观测值将产生运行时错误并终止\
  \ `DATA` 步（除非使用 `UNIQUE` 选项，该选项在本章稍后部分讨论）。\n\n## 示例\n\n假设 1999 年的航空货物重量存储在主数据集 `Cargo99`\
  \ 中，它在 `FlightID` 和 `Date` 变量上有一个名为 `FlghtDte` 的复合索引。部分数据是不正确的，数据集需要更新。正确的货物数据存储在事务数据集\
  \ `Newcgnum` 中。在下面的程序中，`KEY=` 选项指定了 `FlghtDte` 索引。当在 `Cargo99` 中找到匹配观测值时，三个变量（`CapCargo`、`CargoWgt`\
  \ 和 `CargoRev`）会被更新。**注意**：如果你选择运行此示例，必须从 `Sasuser` 拷贝数据集 `Cargo99`。\n\n```\nproc\
  \ print data=cargo99(obs=5);\nrun;\n\ndata cargo99;\n   set sasuser.newcgnum (rename\
  \ = (capcargo = newCapCargo\n                               cargowgt = newCargoWgt\n\
  \                               cargorev = newCargoRev));\n   modify cargo99 key=flghtdte;\n\
  \   capcargo = newCapCargo;\n   cargowgt = newCargoWgt;\n   cargorev = newCargoRev;\n\
  run;\n\nproc print data=cargo99(obs=5);\nrun;\n```\n\n下面的输出显示了在应用更新之前数据集 `Cargo99`\
  \ 的前五行。![Capacity 的输出](img/m59-g1.png) 下面的输出显示了在被 `Newcgnum` 更新后 `Cargo99` 的前五行。注意第一个观测值的三个变量已被更新。![Capacity\
  \ 的输出](img/m59-g2.png)\n\n## 处理重复值\n\n当你使用索引定位要更新的观测值时，事务数据集中索引变量的重复可能会导致问题。我们考虑当使用以下代码用事务数据集\
  \ `T` 更新主数据集 `M` 的各种情况。`M` 数据集上的索引是基于变量 `A` 的：\n\n```\ndata m;\n   set t (rename=(b=newb));\n\
  \   modify m key=a;\n   b=newb;\nrun;\n```\n\n如果主数据集中存在重复，只有第一次出现会被更新。![主数据集中的重复](img/m59-10-g1.png)**提示**：如果你想用事务值更新主数据集中的所有重复，请使用\
  \ `DO` 循环多次执行带有 `KEY=` 选项的 `SET` 语句。如果事务集中存在非连续重复，SAS 更新主数据集中的第一个匹配项。最后一个重复事务值是更新后主数据集中的结果。![事务数据集中的非连续重复](img/m59-10-g2.png)如果事务集中存在连续重复（即某些值在主数据集中没有匹配项），则\
  \ SAS 将执行一对一更新，直到找到非匹配项。此时，`DATA` 步将因错误终止![事务数据集中的连续重复](img/m59-10-g3.png)在 `MODIFY`\
  \ 语句中添加 `UNIQUE` 选项可以避免 `DATA` 步中的错误。`UNIQUE` 选项导致 `DATA` 步在每次查找匹配项时都返回索引顶部。`UNIQUE`\
  \ 选项只能与 `KEY=` 选项一起使用。\n\n\n\n\n| 通用格式，带有 `UNIQUE` 选项的 `MODIFY` 语句：`MODIFY SAS-data-set\
  \ KEY=index-name /UNIQUE;`\n以下是语法解释：`SAS-data-set` 是你想要修改的 SAS 数据集的名称（主数据集）。`index-name`\
  \ 是你用于定位观测值的简单索引或复合索引的名称。 |\n\n你可以指定 `UNIQUE` 选项来执行以下操作之一：\n\n- 对一个主观测值应用多次事务\n\
  - 标识主数据集中的每个观测值都包含一个索引变量的唯一值。\n\n当你使用 `UNIQUE` 选项且事务数据集中存在连续的重复值时，SAS 会更新主数据集中的第一个观测值。这与事务数据集中存在非连续重复值时的情况类似。如果应该将事务数据集中的值累加到主数据集的值上，你可以编写一条语句来累积所有重复值的值。![使用\
  \ UNIQUE 选项](img/m59-17-g4.png)\n\n# 控制更新过程\n\n## 概述\n\n当 DATA 步包含 `MODIFY` 语句时，SAS\
  \ 将当前观测值写入其在 SAS 数据集中的原始位置。此操作默认通过 DATA 步底部的隐式 `REPLACE` 语句执行。然而，你可以通过显式添加 `OUTPUT`、`REPLACE`\
  \ 或 `REMOVE` 语句来覆盖此默认行为。\n\n| `OUTPUT`、`REPLACE` 和 `REMOVE` 语句的通用格式：`OUTPUT;REPLACE;REMOVE;`\n\
  以下是语法解释：`OUTPUT` 将当前观测值添加到数据集的末尾。`REPLACE` 将当前观测值写入数据集的相同位置。`REMOVE` 从数据删除当前观测值。\
  \ |\n\n在带有 `MODIFY` 语句的 DATA 步中使用 `OUTPUT`、`REPLACE` 或 `REMOVE` 语句可以更改观测值的默认替换行为。只要顺序逻辑，你就可以同时使用这三个语句。**注意**：如果你将\
  \ `OUTPUT` 语句与 `REPLACE` 或 `REMOVE` 语句结合使用，请确保 `OUTPUT` 语句在任何 `REPLACE` 或 `REMOVE`\
  \ 语句之后执行，以确保索引位置的完整性。\n\n## 示例\n\n假设 SAS 数据集 `Transaction` 有名为 `Code` 的变量，其值为 `yes`、`no`\
  \ 和 `new`，你可以提交以下程序来执行以下操作之一：\n\n- 删除 `Code` 值为 `no` 的行\n- 更新 `Code` 值为 `yes` 的行\n\
  - 附加 `Code` 值为 `new` 的行。\n\n```\ndata master;\n   set transaction;\n   modify master\
  \ key = id;\n   a = b;\n   if code = 'no' then remove;\n   else if code = 'yes'\
  \ then replace;\n   else if code = 'new' then output;\nrun;\n```\n\n注意：你无法运行此示例，因为\
  \ `Transaction` 和 `Master` 是虚构数据集。\n\n## 监控 I/O 错误状态\n\n当你使用带有 `BY` 语句或 `KEY=` 选项的\
  \ `MODIFY` 语句更新数据集时，由于几个原因，错误检查非常。最重要的原因是这些工具使用了非顺序访问方法，因此无法保证观测值所在的位置能够满足请求。错误检查允许你根据\
  \ I/O 条件的结果决定是否执行更新。当你配合 `BY` 语句或 `KEY=` 选项使用 `MODIFY` 语句时，会创建自动变量 `_IORC_`（输入输出返回代码）。`_IORC_`\
  \ 的值是一个数值返回代码，指示最近执行的 I/O 操作的状态。检查此变量的值允许你检测异常的 I/O 条件并按特定方式引导执行，而不是让应用程序异常终止。\n\
  \n## 与 %SYSRC 使用 _IORC_\n\n由于 `_IORC_` 自动变量的值是内部的可能会发生，因此创建了自动调用宏 `%SYSRC`，以便你测试特定的\
  \ I/O 条件，同时保护你的代码免受未来 `_IORC_` 值变化的影响。\n\n| 通用格式配合 `%SYSRC` 自动调用宏的 `_IORC_`：`IF\
  \ _IORC_=%SYSRC (mnemonic) THEN executable_statement;`\n以下是语法解释：`mnemonic` 是特定 I/O\
  \ 条件的代码。 |\n\n注意：`%SYSRC` 自动调用库中。你必须启用 `MACRO` 系统选项才能使用此宏。当你使用 `%SYSRC` 时，可以通过指定下面列出的助符之一来检查\
  \ `_IORC_` 的值。\n\n| 助符 | 含义 |\n| --- | --- |\n| `_DSENMR` | 事务数据集中的观测值在主数据集中不存在（仅用于\
  \ `MODIFY` 和 `BY` 语句）。 |\n| `_DSEMTR` | 事务数据集中的多个观测值在主数据集中（仅用于 `MODIFY` 和 `BY` 语句）。\
  \ |\n| `_DSENOM` | 无匹配的观测值（用于 `KEY=` 选项）。 |\n| `_SOK` | 已找到观测值。 |\n\n## 示例\n\n假设你正在使用带有\
  \ `KEY=` 选项的 `MODIFY` 语句更新 SAS 数据集。在下面的程序中，当 `_IORC_` 的值为 `_SOK` 时，更新观测值。当 `_IORC_`\
  \ 的值为 `_DSENOM` 时，未找到匹配的观测值，因此通过 `OUTPUT` 语句将观测值添加到数据，并在 `do` 组中 `_ERROR_` 重置为 0。\n\
  \n```\ndata master;\n   set transaction;\n   modify master key = id;\n   if _IORC_=%sysrc(_sok)\
  \ then\n      do;\n         a = b;\n         replace;\n      end;\n   else\n   \
  \   if _IORC_=%sysrc(_dsenom) then\n         do;\n            output;\n        \
  \    _ERROR_ = 0;\n         end;\nrun;\n```\n\n提示：有关 `_IORC_` 自动变量和 `%SYSRC` 的更多信息，请参见\
  \ SAS 文档中关于错误检查工具的信息。\n\n# 理解完整性约束\n\n## 概述\n\n现在你已经知道如何原地修改数据，你可能会好奇在修改数据时如何保护或确保数据的完整性。完整性约束是你指定的规则，用于限制数据集中变量可以存储的值。当使用原地修改数据的技术添加、更新或删除与变量关联的值时，SAS\
  \ 会强制完整性约束，例如：\n\n- 带有 `MODIFY` 语句的 DATA 步\n- 交互数据窗口\n- 使用 `INSERT INTO`、`SET` 或\
  \ `UPDATE` 语句的 PROC SQL\n- PROC APPEND\n\n当你向表添加完整性约束时，SAS 会检查所有数据是否满足该约束。\n\n|\
  \ 类型 | 操作 |\n| --- | --- |\n| `CHECK` | 确保特定值或范围是该列的唯一值。它还可以根据同一行中的另一个列的值检查一个值的有效性。\
  \ |\n| `NOT NULL` | 保证列在每行中都有空值。 |\n| `UNIQUE` | 强制列值的唯一性。 |\n| `PRIMARY KEY` |\
  \ 唯一定义表中的行，可以是单个列或一组列。表只能有一个主键。`PRIMARY KEY` 约束包含了 `NOT NULL` 和 `UNIQUE` 约束的属性。\
  \ |\n| `FOREIGN KEY` | 指定其值与另一个数据集的主键变量值关联的变量。这种父子关系限制了对两个表进行的修改。 |\n\n注意：当你对 SAS\
  \ 数据集放置完整性约束时，你需要指定要创建的约束类型。每个约束都有不同的操作。你可以通过两种方式使用完整性约束：通用和引用。通用约束在数据集内部，引用约束在数据集之间。\n\
  \n## 通用完整性约束\n\n通用完整性约束允许你限制单个数据变量的值。以下约束可以作为通用完整性约束：\n\n- `CHECK`\n- `NOT NULL`\n\
  - `UNIQUE`\n- `PRIMARY KEY`。\n\n\n\n\n\n注意：只要 `PRIMARY KEY` 约束没有任何引用它的 `FOREIGN\
  \ KEY` 约束，它就是一种通用的完整性约束。当 `PRIMARY KEY` 作为通用约束使用时，它仅仅是分配 `NOT NULL` 和 `UNIQUE` 约束的快捷方式。\n\
  \n## 引用完整性约束\n\n引用约束允许你将一个数据集中列的值链接到另一个数据集中列的值。当一个数据集中的 `FOREIGN KEY` 完整性约束引用另一个数据集中的\
  \ `PRIMARY KEY` 完整性约束时，你就创建了一个引用完整性约束。要创建引用完整性约束，你必须执行以下操作：\n\n1. 在第一个数据集上定义 `PRIMARY\
  \ KEY` 约束。\n\n2. 在其他数据集上定义 `FOREIGN KEY` 约束。\n\n# 在数据集上放置完整性约束\n\n## 概述\n\n可以使用\
  \ `DATASETS` 过程或 `SQL` 过程创建完整性约束。虽然可以使用任一种过程在现有数据集上创建完整性约束，但如果你想在创建数据集的同时创建完整性约束，则必须使用\
  \ `PROC SQL`。在本章中，你将学习使用 `PROC DATASETS` 在现有数据集上放置完整性约束。\n\n| 使用 `IC CREATE` 语句的\
  \ `DATASETS` 过程通用形式：\n```\nPROC DATASETS LIB=libref <NOLIST>;\nMODIFY SAS-data-set;\n\
  IC CREATE constraint-name=constraint<MESSAGE='Error Message'>;\nQUIT;\n```\n以下是对语法的解释：\n\
  `libref` 是存储数据集的库。如果你未指定 `LIB=` 选项，过程将使用 `Work` 库。\n`NOLIST` 抑制目录列表。\n`SAS-data-set`\
  \ 是你想要应用完整性约束的数据集名称。\n`constraint-name` 是你给完整性约束指定的任何名称。\n`constraint` 是你正在创建的约束类型，按以下格式指定：\n\
  \n*   `NOT NULL (variable)`\n*   `UNIQUE (variables)`\n*   `CHECK (where-expression)`\n\
  *   `PRIMARY KEY (variables)`\n*   `FOREIGN KEY (variables) REFERENCES table-name.`\n\
  \n`Error Message` 是当违反约束时写入日志的可选消息。 |\n\n注意：你可以交叉使用 `IC` 或 `INTEGRITY CONSTRAINT`。提示：要了解如何使用\
  \ `SQL` 过程创建完整性约束，请参阅 使用 PROC SQL 创建和管理表。\n\n## 示例\n\n假设你有一个数据集，包含航空公司每个等舱舱的路线信息和乘客容量。你需要创建完整性约束，以确保在更新数据集时满足以下条件：\n\
  \n*   路线 ID 码必须是唯一的且必填的（`PRIMARY KEY`）。\n*   商务舱乘客容量必须为空，或大于头等舱乘客容量（`CHECK`）。\n\n\
  在下面的代码中，使用 `IC CREATE` 语句在数据集 `Capinfo` 的变量上创建了两个通用完整性约束：\n\n*   `PRIMARY KEY` 约束放置在\
  \ `RouteID` 变量上。该约束确保在更新 `RouteID` 值时，它们必须是唯一且非空的。注意：通过同时应用 `UNIQUE` 和 `NOT NULL`\
  \ 约束也可以相同的效果，但 `PRIMARY KEY` 约束被用作快捷方式。\n*   `CHECK` 约束使用 `WHERE` 表达式来确保 `CapBusiness`\
  \ 的唯一允许值是大于 `Cap1st` 或缺失的。\n\n注意：如果你选择运行此示例，必须从 `Sasuser` 库将数据集 `Capinfo` 拷贝到 `Work`\
  \ 库。\n\n```\nproc datasets nolist;\n   modify capinfo;\n   ic create PKIDInfo=primary\
  \ key(routeid)\n      message='You must supply a Route ID Number';\n   ic create\
  \ Class1=check(where=(cap1st<capbusiness or capbusiness=.))\n      message='Cap1st\
  \ must be less than CapBusiness';\nquit;\n```\n\n注意使用 `NOLIST` 选项来防止 `PROC DATASETS`\
  \ 默认生成 `Work` 库列表。当创建约束时，消息会写入 SAS 日志。\n\n表 18.1 SAS 日志\n\n|\n\n```\n45 modify capinfo;\n\
  46 ic create PKIDInfo = primary key (routeid)\n47 message = 'You must supply a Route\
  \ ID Number';\nNOTE: Integrity constraint PKIDInfo defined. \n48 ic create Class1\
  \ = check (where = (cap1st < capbusiness \n49 or capbusiness = .)) message = 'Cap1st\
  \ must be less \n50 than CapBusiness'; \nNOTE: Integrity constraint Class1 defined.\
  \ \n51 run;\n```\n\n |\n\n注意：对于 `UNIQUE` 和 `PRIMARY KEY` 约束，如果不存在适当的索引，SAS 将相关列上构建索引。由完整性约束创建的索引都可以用于其他用途，例如\
  \ `WHERE` 处理或 `SET` 语句中的 `KEY=` 选项。提示：有关创建完整性约束的更多信息，请参阅 `DATASETS` 过程的 SAS 文档。\n\
  \n## 如何强制约束\n\n一旦放置了完整性约束，SAS 每当原地修改数据集时就会强制执行它们。原地修改数据的技术包括使用以下元素：\n\n*   带有 `MODIFY`\
  \ 语句的 `DATA` \n*   交互式数据编辑窗口\n*   带有 `INSERT INTO`、`SET` 或 `UPDATE` 语句的 `PROC SQL`\n\
  *   `PROC APPEND`\n\n## 示例\n\n上一个示例代码在 `Cap1st` 和 `CapBusiness` 上放置了检查约束，以确保商务舱的容量值大于头等舱或缺失。假设你运行了以下程序将头等舱容量增加三倍。这可能会违反某些观测值的检查约束。\n\
  \n```\ndata capinfo;\n   modify capinfo;\n   cap1st=cap1st*3;\nrun;\n```\n\n未通过完整性约束的观测值将写入\
  \ SAS 日志。\n\n表 18.2 SAS 日志\n\n|\n\n```\nFlightID=IA0100 RouteID=000001 Origin=RDU\
  \ Dest=LHR Cap1st=42\nCapBusiness=30 Econ=163\n_ERROR_=1 _IORC_=66130 _N_=1\nFlightID=IA0201\
  \ RouteID=000002 Origin=LHR Dest=RDU Cap1st=42\nCapBusiness=30 Econ=163\n_ERROR_=1\
  \ _IORC_=66130 _N_=2\nFlightID=IA0300 RouteID=000003 Origin=RDU Dest=FRA Cap1st=42\n\
  CapBusiness=30 Econ=163\n_ERROR_=1 _IORC_=66130 _N_=3\nFlightID=IA0400 RouteID=000004\
  \ Origin=FRA Dest=RDU Cap1st=42\nCapBusiness=30 Econ=163\n_ERROR_=1 _IORC_=66130\
  \ _N_=4\nFlightID=IA2900 RouteID=0000029 Origin=SFO Dest=HNL Cap1st=42\nCapBusiness=30\
  \ Econ=163\n_ERROR_=1 _IORC_=66130 _N_=29\nFlightID=IA3000 RouteID=0000030 Origin=HNL\
  \ Dest=SFO Cap1st=42\nCapBusiness=30 Econ=163\n_ERROR_=1 _IORC_=66130 _N_=30\nFlightID=IA3300\
  \ RouteID=0000033 Origin=RDU Dest=ANC Cap1st=42\nCapBusiness=30 Econ=163\n_ERROR_=1\
  \ _IORC_=66130 _N_=33\nFlightID=IA3400 RouteID=0000034 Origin=ANC Dest=RDU Cap1st=42\n\
  CapBusiness=30 Econ=163\n_ERROR_=1 _IORC_=66130 _N_=34\n```\n\n\n\n\n\n要查看数据的描述符部分（包括你对数据集设置的完整性约束），你可以使用\
  \ `DATASETS` 过程中的 `CONTENTS` 语句。\n\n| 通用格式，带有 `CONTENTS` 语句的 `DATASETS` 过程：\n```\n\
  PROC DATASETS LIB=libref <NOLIST>;\nCONTENTS DATA=SAS-data-set;\nQUIT;\n```\n以下是语法的解释：`libref`\
  \ 是存储数据集的库。`NOLIST` 抑制目录列表。`SAS-data-set` 是你想要获取信息的数据集名称。\n\n注意：`DATASETS` 过程中的\
  \ `CONTENTS` 语句产生的信息与 `CONTENTS` 过程相同。\n\n## 示例\n\n以下代码显示了关于 `Capinfo` 数据集的信息，包括上一个示例中添加到该数据集的完整性约束。注意，这里使用了\
  \ `NOLIST` 选项来抑制 `Work` 库中所有数据集的列表。使用此选项，仅列出 `Capinfo` 数据集的信息。\n\n```\nproc datasets\
  \ nolist;\n   contents data=capinfo;\nquit;\n```\n\n下方仅显示输出中的完整性约束部分。![输出的完整性约束部分](img/m59-31-g1.png)\n\
  \n# 删除完整性约束\n\n## 概述\n\n要从数据删除完整性约束，请使用带有 `IC DELETE` 语句的 `DATASETS` 过程。\n\n| 通用格式，带有\
  \ `IC DELETE` 语句的 `DATASETS` 过程：\n```\nPROC DATASETS LIB=libref <NOLIST>;\nMODIFY\
  \ SAS-data-set;\nIC DELETE constraint-name;\nQUIT;\n```\n以下是语法的解释：`libref` 是存储数据集的库名。如果没有指定\
  \ `LIB=` 选项，过程将使用 `Work` 库。`NOLIST` 抑制目录列表。`SAS-data-set` 是具有完整性约束的数据集名称。`constraint-name`\
  \ 是你想删除的完整性约束名称。\n\n## 示例\n\n以下代码删除 `Capinfo` 数据上的完整性约束：\n\n```\nproc datasets;\n\
  \    modify capinfo;\n    ic delete pkidinfo;\n    ic delete class1;\n quit;\n```\n\
  \n当删除完整性约束时，SAS 日志中会写入一条消息。\n\n表 18.3 SAS 日志\n\n|  ```\n53      modify capinfo;\n\
  54      ic delete pkidinfo;\nNOTE: Integrity constraint PKIDInfo deleted.\n55  \
  \    ic delete class1;\nNOTE: All integrity constraints defined on WORK.CAPINFO.DATA\
  \ \n      have been deleted.\n56   run;NOTE: Integrity constraint PKIDInfo deleted.\n\
  ``` |\n\n# 理解审计跟踪\n\n当你修改数据集时，你可能希望通过审计跟踪（audit trail）来跟踪你所做的更改。审计跟踪是一个可选的 SAS 文件，用于记录对\
  \ SAS 表的修改。审计跟踪用于跟踪在数据集上直接进行的更改。具体而言，审计跟踪会记录通过以下方式进行的更改：\n\n* `VIEWTABLE` 窗口\n*\
  \ 数据网格\n* `DATA` 步中的 `MODIFY` 语句\n* `PROC SQL` 中的 `UPDATE`、`INSERT` 或 `DELETE` 语句\n\
  \n对于数据的每次添加、删除和更新，审计跟踪都会自动存储被更新观测值中的变量副本，还会存储诸如谁进行了修改、修改了什么以及何时进行修改等信息。审计跟踪还可以在用户定义的变量中存储额外信息。以下\
  \ `PROC CONTENTS` 输出列出了一个具有变量 `A` 和 `B` 的数据集审计跟踪文件中的变量。你将在本章后面学习更多关于这些变量的内容![PROC\
  \ CONTENTS 输出](img/m59-34-g1.png) 注意：任何替换数据集的过程或操作（例如 `DATA` 步、`PROC SQL` 中的 `CREATE\
  \ TABLE` 或没有 `OUT=` 选项的 `SORT`）都会删除审计跟踪。不应使用 Windows 资源管理器等系统工具删除审计跟踪。一个 SAS 表只能有一个审计跟踪文件。关于审计跟踪文件：\n\
  \n* 它是只读文件。\n* 它是由 `PROC DATASETS` 创建的。\n* 它必须与与其关联的数据文件位于同一个库中。\n* 它与它监控集集名，但成员类型为\
  \ `AUDIT`。\n\n# 启动和读取审计跟踪\n\n## 概述\n\n你使用带有 `AUDIT` 和 `INITIATE` 语句的 `DATASETS`\
  \ 过程启动审计跟踪。\n\n| 通用格式，启动审计跟踪的 `DATASETS` 过程：\n```\nPROC DATASETS LIB=libref <NOLIST>;\n\
  AUDIT SAS-data-set <SAS-password>;\nINITIATE;\nQUIT;\n```\n以下是语法的解释：`AUDIT` 启动并控制向审计文件进行事件记录。`libref`\
  \ 是被审计数据集所在的库名。`NOLIST` 抑制目录列表。`SAS-data-set` 是你想要审计的 SAS 数据集名称。`SAS-password` 是\
  \ SAS 数据集密码（如果存在）。`INITIATE` 在 `AUDIT` 语句指定的数据集上开始审计跟踪。\n\n## 示例\n\n以下代码在 `Capinfo`\
  \ 数据集上启动审计跟踪。注意：如果你选择运行此示例，必须将 `Capinfo` 数据集从 `Sasuser` 库复制到 `Work` 库。\n\n```\n\
  proc datasets nolist;\n   audit capinfo;\n   initiate;\nquit;\n```\n\n表 18.4 SAS\
  \ 日志\n\n|  ```\n60   audit capinfo;\n61   initiate;\nWARNING: The audited data file\
  \ WORK.CAPINFO.DATA is not\n         protected.\n62   quit;\nNOTE: The data set\
  \ AUDIT has 0 observations\n      and 13 variables.\n``` | 注意：审计跟踪使用分配给数据集的密码。因此，建议修改数据集的密码。\n\
  \n# 读取审计跟踪文件\n\n启动审计跟踪后，在第一次修改数据集之前没有观测值。当审计跟踪文件包含数据时，可以使用任何读取数据集的 SAS 组件来读取它。要引用审计跟踪文件，使用\
  \ `TYPE=` 数据选项。\n\n| 通用格式，指定审计文件的 `TYPE=` 数据选项：(`TYPE=AUDIT`) |\n\n## 示例\n\n以下 `PROC\
  \ CONTENTS` 代码显示审计文件的内容：\n\n```\nproc contents data=mylib.sales (type=audit);\n\
  run;\n```\n\n以下 `PROC PRINT` 代码列出 `Capinfo` 数据审计跟踪中的数据：\n\n```\nproc print data=capinfo\
  \ (type=audit);\nrun;\n```\n\n# 控制审计跟踪数据\n\n## 概述\n\n现在你已经了解如何启动审计跟踪和读取审计跟踪文件，请考虑审计跟踪文件包含的信息。审计跟踪文件可以包含三种变量：\n\
  \n* 存储被审计数据集列副本的数据集变量\n* 自动存储数据修改信息的审计跟踪变量\n* 存储用户输入信息的用户变量\n\n![控制审计跟踪数据](img/m59-39-g1.png)\
  \ 你可以在 `PROC DATASETS` 步中使用额外的语句来控制审计跟踪中显示的变量。我们考虑在审计跟踪中找到的三类变量。\n\n## 数据集变量\n\n\
  正如你预期的那样，审计跟踪文件与被审计数据集具有相同的变量集。如果数据集包含变量 `A` 和 `B`，那么变量 `A` 和 `B` 也出现在审计跟踪中。接下来考虑自动存储你对数据更改信息的审计跟踪变量。\n\
  \n\n\n\n\n审计跟踪变量会自动存储有关数据修改的信息。审计跟踪变量名以 `AT` 开头，后跟一个特定字符串，例如 `DATETIME`。\n\n| 审计跟踪变量\
  \ | 存储的信息 |\n| --- | --- |\n| `ATDATETIME` | 修改的日期和时间 |\n| `ATUSERID` | 与修改相关的登录用户\
  \ ID |\n| `ATOBSNO_` | 除非 `REUSE=YES`，否则受修改影响的观测编号 |\n| `ATRETURNCODE` | 事件返回代码\
  \ |\n| `ATMESSAGE` | 修改时的 SAS 日志消息 |\n| `ATOPCODE` | 描述操作类型的代码 |\n\n## `ATOPCODE`\
  \ 变量的值\n\n`ATOPCODE` 变量包含一个描述将观测值写入审计文件的操作类型的代码。例如，如果您修改了受审计数据集中的所有观测值，则审计文件中包含的观测值数量将是原始数据集的两倍。审计文件将包含一个与原始观测值匹配且\
  \ `ATOPCODE` 值为 `DR` 的观测值，以及一个 `ATOPCODE` 值为 `DW` 的更新后的观测值。以下是 `ATOPCODE` 变量可能的值。\n\
  \n| `ATOPCODE` | 事件 |\n| --- | --- |\n| DA | 添加数据记录镜像 |\n| DD | 删除数据记录镜像 |\n| DR\
  \ | 更新前的记录镜像 |\n| DW | 更新后的记录镜像 |\n| EA | 观测值添加失败 |\n| ED | 观测值删除失败 |\n| EU | 观测值更新失败\
  \ |\n\n在启动审计跟踪时可以使用 `LOG` 语句来定义审计文件中存储的信息。\n\n## 使用 LOG 语句控制审计跟踪中的数据\n\n在启动审计跟踪时，`LOG`\
  \ 语句中的选项决定了存储在审计跟踪中的记录类型及其相应的 `ATOPCODE` 值。`ERROR_IMAGE` 选项控制 `E` 操作代码。`BEFORE_IMAGE`\
  \ 选项控制 `DR` 操作代码，而 `DATA_IMAGE` 选项控制所有其他 `D` 操作代码。如果您在启动审计跟踪时省略了 `LOG` 语句，默认行为是记录所有镜像。\n\
  \n`LOG` 语句的通用格式：`LOG <audit-settings>;`。以下是对语法的解释：`audit-settings` 是以下任意内容：\n\n\
  * `BEFORE_IMAGE=YES|NO` 控制更新前记录镜像的存储（'DR' 操作）。\n* `DATA_IMAGE=YES|NO` 控制更新后记录镜像的存储（例如以\
  \ 'D' 开头的操作）。\n* `ERROR_IMAGE=YES|NO` 控制更新失败记录镜像的存储（例如以 'E' 开头的操作）。\n\n## 示例\n\n\
  以下代码对数据集 `Capinfo` 启动审计跟踪，但仅存储错误记录镜像。这意味着审计文件仅包含发生错误时的记录。`ATOPCODE` 值只能为 `EA`、`ED`\
  \ 和 `EU`。注意：如果您选择运行此示例，必须将数据集 `Capinfo` 从 `Sasuser` 库复制到 `Work` 库。\n\n```\nproc\
  \ datasets nolist;\n   audit capinfo;\n   initiate;\n   log data_image=NO before_image=NO;\n\
  quit;\n```\n\n## 用户变量\n\n用户变量允许编辑文件的人输入有关对数据所做更改的信息。虽然数据值存储在审计文件中，但您可以像更新其他变量一样在数据集中更新它们。用户变量通过审计跟踪规范中的\
  \ `USER_VAR` 语句创建。\n\n`USER_VAR` 语句的通用格式：`USER_VAR variable-name <$><length><LABEL='variable-label'>;`。以下是对语法的解释：`variable-name`\
  \ 是您创建的用户变量名。`$` 表示该变量是字符变量。`length` 指定变量的长度（默认为 8）。`variable-label` 指定包含在引号内的变量标签。\n\
  \n注意：您可以在单条 `USER_VAR` 语句中创建多个用户变量。用户变量在 SAS 中是唯一的，因为它们存储在一个文件中（审计文件），并在另一个文件中（数据集）中打开进行更新。当数据集被打开进行更新时，会显示用户变量，您可以像处理数据集的一部分一样编辑它们进行。\n\
  \n## 示例\n\n假设您必须监控数据集 `Capinfo` 的更新。以下代码为数据集 `Capinfo` 启动审计跟踪，并创建两个用户变量 `who` 和\
  \ `why`，用于存储是谁更改了数据集以及进行更改的原因。注意：如果您选择运行此示例，必须将数据集 `Capinfo` 从 `Sasuser` 库复制到 `Work`\
  \ 库。\n\n```\nproc datasets nolist;\n   audit capinfo;\n   initiate;\n   user_var\
  \ who $20 label = 'Who made the change'\n            why $20 label = 'Why the change\
  \ was made';\nquit;\n```\n\n一旦设置了这些用户变量，就会从审计跟踪中检索并在打开数据集进行更新时显示。您可以像处理任何数据变量一样为用户变量输入数据值。当保存每个观测值时，数据值会被保存到审计跟踪。当数据以浏览或打印模式打开时，用户变量是不可用的。要重命名用户变量或修改其属性，需要修改数据集，而不是审计文件。\n\
  \n# 控制审计跟踪\n\n## 概述\n\n一旦激活审计跟踪，您可以通过重新提交带有附加语句的 `PROC DATASETS` 步骤暂停、恢复日志以及终止（删除）审计跟踪。您使用\
  \ `DATASETS` 过程来暂停并恢复审计跟踪。您也可以使用该过程删除审计跟踪。\n\n用于暂停、恢复或终止审计跟踪的 `DATASETS` 过程通用格式：`PROC\
  \ DATASETS LIB=libref<NOLIST>;AUDIT SAS-data-set <SAS-password>;SUSPEND|RESUME|TERMINATE;QUIT;`。以下是对语法的解释：`libref`\
  \ 是被审计表所在的库名。`NOLIST` 抑制目录列表。`SAS-data-set` 是您要审计的 SAS 数据集名称。`SAS-password` 是 SAS\
  \ 数据文件密码（如果存在）。`SUSPEND` 暂停对审计文件的记录，但不删除文件。`RESUME` 恢复对审计文件的记录（如果已暂停）。`TERMINATE`\
  \ 终止记录并删除审计文件。\n\n提示 由于数据文件的每次更新都会写入审计文件，审计跟踪会对系统性能产生不利影响。您可能考虑在大型定期计划批更新期间暂停审计跟踪。\n\
  \n## 示例\n\n以下代码终止数据集 `Capinfo` 的审计跟踪。注意：如果您选择运行此示例，必须将数据集 `Capinfo` 从 `Sasuser`\
  \ 库复制到 `Work` 库。\n\n```\nproc datasets nolist;\n   audit capinfo;\n   terminate;\n\
  quit;\n```\n\n当审计跟踪终止时，日志会写入一条消息。\n\n表 18.5 SAS 日志\n\n|  \n\n```\n65   audit capinfo;\n\
  66   terminate;\nNOTE: Deleting WORK.CAPINFO (memtype=AUDIT).\n67 quit;\n```\n\n\
  \n\n\n\n你已经了解到，可以保留审计轨迹来跟踪对单个数据集进行的就地更新。然而，如果你替换了该数据集，审计轨迹就会丢失。生成代数据集（Generation\
  \ data sets）允许你维护 SAS 数据集的多个版本或代次。每当文件被替换时，就会创建一个新代。默认情况下，生成代数据集是不生效的。当 SAS 数据集\
  \ `A` 被替换时，SAS 库中会有 `A` 的两个副本。当 `DATA` 步执行完成时，SAS 会从库中删除数据集 `A` 的原始副本。\n\n![生成代数据集](img/m59-48-g1.png)\n\
  \n当生成代数据集生效状态且 SAS 数据集 `A` 被替换时，SAS 库中会有 `A` 的两个副本。当 `DATA` 步执行完成时，SAS 会在库中保留 SAS\
  \ 数据集 `A` 的原始副本并对其重命名。\n\n![生成代数据集](img/m59-48-g2.png)\n\n生成代数据集的每一代都存储为代组（generation\
  \ group）的一部分。代组中的每个生成代数据集具有相同的根成员名，但每个代都有不同的版本号。最新版本被称为基版本（base version）。当代生效状态时，SAS\
  \ 文件名限制为 28 个字符。最后四个字符保留给版本号使用。\n\n注意：VMS 上不支持生成代数据集。\n\n# 初始化生成代数据集\n\n## 概述\n\n\
  要初始化生成代数据集并指定要维护的最大版本数，你在创建或替换数据集时会使用输出数据集选项 `GENMAX=`。如果数据集已存在，你可以在 `DATASETS`\
  \ 过程和 `MODIFY` 语句中使用 `GENMAX=` 选项。\n\n带有 `GENMAX=` 选项的 `DATASETS` 过程和 `MODIFY` 语句的通用形式如下：\n\
  \n```\nPROC DATASETS LIB=libref <NOLIST>;\nMODIFY SAS-data-set (GENMAX=n);\nQUIT;\n\
  ```\n\n以下是对该语法的解释：\n- `libref` 是包含你要修改的数据的库。\n- `NOLIST` 抑制目录列表。\n- `SAS-data-set`\
  \ 是你想要修改的 SAS 数据集的名称。\n- `n` 是你想要保留的历史版本数，包括基版本：\n    - `n=0`，不保留任何历史版本（这是默认值）。\n\
  \    - `n>0`，保留文件指定数量的文件版本。该数量包含基版本。\n\n## 示例\n\n以下 `DATASETS` 过程修改了数据集 `Cargorev`，并请求保留最多四个版本（一个基版本和三个历史版本）。注意：如果你选择运行此示例，你必须从\
  \ `Sasuser` 库将数据集 `Cargorev` 复制到 `Work` 库。\n\n```\nproc datasets nolist;\n   modify\
  \ cargorev (genmax=4);\nquit;\n```\n\n当你指定 `GENMAX=` 选项时，日志中不会写入任何信息。\n\n## 创建生成代数据集\n\
  \n记住，生成代数据集的新版本只有在数据集被替换时才会创建，而不是在就地修改时。要创建新代，请使用以下方法之一：\n\n- 带有 `SET` 语句的 `DATA`\
  \ 步\n- 带有 `MERGE` 语句的 `DATA` 步\n- 不带 `OUT=` 选项的 `PROC SORT`\n- 带有 `CREATE TABLE`\
  \ 语句的 `PROC SQL`\n\n# 处理生成代数据集\n\n## 概述\n\n一旦你拥有了一个包含多个生成代数据集的代组，你可能想要选择特定的数据集进行处理。要选择特定的代，你使用\
  \ `GENNUM=` 数据集选项。\n\n`GENNUM=` 数据集选项的通用形式如下：\n\n```\nGENNUM=n\n```\n\n以下是对该语法的解释：\n\
  - `n` 指定数据集的特定历史版本：\n    - `n>0` 是通过代数对历史版本的绝对引用。\n    - `n<0` 是对历史版本的相对引用。\n  \
  \  - `n=0` 是当前版本。\n\n## 示例\n\n要打印数据的当前版本，你不需要使用 `GENNUM=` 选项。只需使用如下代码即可：\n\n```\n\
  proc print data=year;\nrun;\n```\n\n要打印最年轻的历史版本，你有多种选择。你可以在 `GENNUM=` 选项中指定绝对引用或相对引用，所示：\n\
  \n```\nproc print data=year(gennum=4);  /*绝对引用*/\nrun;\n```\n\n```\nproc print data=year(gennum=-1);\
  \  /*相对引用*/\nrun;\n```\n\n你也可以使用 `PROC CONTENTS` 配合 `GENNUM=` 选项查看有关特定代的信息，所示：\n\
  \n```\nproc contents data=year(gennum=-1);  /*相对引用*/\nrun;\n```\n\n现在你已经看到了一些使用\
  \ `GENNUM=` 选项的示例，请考虑代数是如何变化的。\n\n## 代数如何变化\n\n当你使用 `GENNUM=` 选项时，可以引用绝对代数或相对代数。理解代数是如何变化的很有帮助，以便识别你想要处理的代。首先，考虑\
  \ SAS 如何命名生成代数据集。当启用代状态的数据集第一次被替换时，SAS 保留被替换的数据集，并在其成员名后追加一个四位的版本号。该名称包含井号（`#`）和数字。对于名为\
  \ `A` 的数据集，第一次被替换时，SAS 保留替换的数据集并将其变为 `A#001`。当数据集被第二次替换时，替换的数据集变为 `A#002`。对于名为 `A`\
  \ 的数据集，`A#002` 是最接近基版本的版本。SAS 可以追加的版本号限制是 `#999`。在替换 1000 次后，SAS 将最新版本号重置为 `#000`。现在考虑绝对和相对代数（在\
  \ `GENNUM=` 选项中指定）的变化。每当 SAS 创建新代时，绝对代数增加。随着旧代的删除，它们的绝对代数会失效。相比之下，相对代数始终相对于基。基或当前代始终是\
  \ 0，-1 是最年轻的版本。下表显示了数据集名称。表 18.6 使用 GENNUM 的数据集名称\n\n| 迭代 | SAS 代码 | 数据集名称 | GENNUM\
  \ 绝对引用 | GENNUM 相对引用 | 解释 |\n| :--- | :--- | :--- | :--- | :--- | :--- |\n| 1 |\
  \ `data Year (genmax=3);` | Year | 1 | 0 | 创建数据集 Year，并请求三个代。 |\n| 2 | `data Year;`\
  \ | Year#001 | 2 | 0-1 | Year 被替换。迭代 1 的 Year 被重命名为 Year#001。 |\n| 3 | `data Year;`\
  \ | Year#002Year#001 | 3 | 0-1-2 | Year 被替换。迭代 2 的 Year 被重命名为 Year#002。 |\n| 4 |\
  \ `data Year;` | Year#003Year#002 | 4 | 0-1-2 | Year 被替换。迭代 3 的 Year 被重命名为 Year#003。迭代\
  \ 1 的 Year#001 最旧，被删除。 |\n| 5 | `data Year (genmax=2);` | Year#004 | 5 | 0-1 | Year\
  \ 被替换，且代数改为 2。迭代 4 的 Year 被重命名为 Year#004。两个最旧的版本被删除。 |\n\n你已经了解到使用 `PROC DATASETS`\
  \ 在现有的 SAS 数据集上初始化生成代数据集。一旦你创建了生成代数据集，可以使用 `PROC DATASETS` 执行管理任务，例如：\n\n- 删除所有或部分代\n\
  - 将整个代组或代组中的任何成员重命名为新的基名。\n\n\n\n\n\n# 通用格式\n\n通用格式带有 `CHANGE` 和 `DELETE` 语句的 `PROC\
  \ DATASETS` 格式：\n\n```\nPROC DATASETS LIB=libref <NOLIST>;\nCHANGE SAS-data-set<(GENNUM=n)>=new-data-set-name;\n\
  DELETE SAS-data-set<(GENNUM=n | HIST | ALL)>;\nQUIT;\n```\n\n以下是语法的解释：\n- `libref`\
  \ 是包含你想要修改的数据的库。\n- `NOLIST` 抑制目录列表显示。\n- `SAS-data-set` 是你想要更改或删除的 SAS 数据集的名称。\n\
  - `new-data-set-name` 是 `CHANGE` 语句中 SAS 数据集的新名称。\n- `n` 是对生成代号（generation number）的绝对或相对引用。\n\
  - `HIST` 指除基础版本以外的所有代。\n- `ALL` 指基础版本和所有代。\n\n## 示例\n\n以下代码使用 `CHANGE` 语句将数据集 `SalesData`\
  \ 重命名为 `Sales`。如果已经创建了多个代数据，则所有代的基础名称都将被重命名。\n\n```\nproc datasets library=quarter1\
  \ nolist;\n   change salesData=sales;\nquit;\n```\n\n以下代码使用 `GENNUM=` 选项仅重命名第二个历史数据集：\n\
  \n```\nproc datasets library=quarter1 nolist;\n   change sales(gennum=2)=newsales;\n\
  quit;\n```\n\n以下代码删除了一个历史版本。此操作可能会在生成组中留下空隙。\n\n``````proc datasets library=quarter1\
  \ nolist;\n   delete newsales(gennum=-1);\nquit;\n```\n\n当你在 `DELETE` 语句中使用 `GENNUM=`\
  \ 选项时，可以使用 `HIST` 和 `ALL` 关键字。以下代码使用 `HIST` 关键字删除所有的历史版本：\n\n```\nproc datasets\
  \ library=quarter1 nolist;\n   delete newsales(gennum=HIST);\nquit;\n```\n\n以下代码在\
  \ `GENNUM=` 选项中使用 `ALL` 关键字来删除生成组中的所有 SAS 数据集：\n\n```\nproc datasets library=quarter1\
  \ nolist;\n   delete newsales(gennum=ALL);\nquit;\n```\n\n**提示**：有关更多关于使用 `DATASETS`\
  \ 过程处理数据的信息，请参阅 SAS 文档。\n\n## 总结\n\n## 文本总结\n\n### 使用 MODIFY 语句\n\n当你使用 `MODIFY`\
  \ 语句修改 SAS 数据集时，SAS 不会像使用 `SET`、`MERGE` 或 `UPDATE` 语句那样创建数据的第二个副本。SAS 数据集的描述部分保持不变。更新后的观测值将写回与原始观测值相同的位置。\n\
  \n### 修改 SAS 数据集中所有观测值\n\n你可以使用 `MODIFY` 语句配合赋值语句来修改 SAS 数据集中所有的观测值。\n\n### 使用事务数据集修改观测值\n\
  \n要使用事务数据集修改主数据集，你需要使用 `MODIFY` 语句配合 `BY` 语句指定匹配的变量或变量。当你使用 `MODIFY` 或 `BY` 语句时，SAS\
  \ 使用动态 `WHERE` 子句定位主数据集中的观测值。你可以通过使用 `MODIFY` 语句中的 `UPDATEMODE=` 选项来指定如何处理事务数据集中的缺失值。\n\
  \n### 通过索引定位观测值\n\n你可以使用 `MODIFY` 语句配合 `KEY=` 选项为正在修改的 SAS 数据集命名简单或复合索引。`KEY=` 参数根据事务数据集中由同名变量提供的索引值从主数据集中检索观测值。如果你在事务集中存在连续的重复（即某些项在主数据集中没有匹配），你可以使用\
  \ `UNIQUE` 选项使 `KEY=` 搜索始终从顶部开始。\n\n\n\n\n\n* 完整性约束仅在对数据进行修改时才会执行。如果替换了数据集，完整性约束将会丢失。\n\
  \n* 审计跟踪文件（Audit trail files）通过以下方式跟踪对数据集进行就地修改的更改：\n    * `DATA` 步中的 `MODIFY` 语句\n\
  \    * `PROC SQL` 中的 `UPDATE`、`INSERT` 或 `DELETE` 语句\n* 生成数据集（Generation data sets）用于跟踪通过以下方式替换数据集时所产生的更改：\n\
  \    * 在 `DATA` 步中使用-`SET`、`MERGE` 或 `UPDATE` 语句\n    * 使用 `PROC SORT` 对数据进行就地排序\n\
  \    * 在 `PROC SQL` 中使用 `CREATE TABLE` 语句\n\n# 测试\n\n请为每个问题选择最佳答案。完成测试后，请使用附录中的答案对照检查你的答案。\n\
  \n1. 你会在变量 `StoreID` 上设置哪种类型的完整性约束，以确保没有缺失值且没有重复值？\n    1. `UNIQUE`\n    2. `CHECK`\n\
  \    3. `PRIMARY KEY`\n    4. `NOT NULL`\n\n2. 哪段代码为 SAS 数据集 `Reports.Quarter1`\
  \ 创建审计跟踪？\n    1.\n    ```\n    proc datasets nolist;\n       audit quarter1;\n\
  \       initiate;\n    quit;\n    ```\n    2.\n    ```\n    proc datasets lib=reports\
  \ nolist;\n       audit initiate reports.quarter1;\n    quit;\n    ```\n    3.\n\
  \    ```\n    proc datasets lib=reports nolist;\n       initiate audit quarter1;\n\
  \    quit;\n    ```\n    4.\n    ```\n    proc datasets lib=reports nolist;\n  \
  \     audit quarter1;\n       initiate;\n    quit;\n    ```\n\n3. 哪一个 `DATA` 步使用事务数据集\
  \ `Records.Overnight` 通过 `accumAmt` 更新主数据数据集 `Records.Snowfall`？\n    1.\n    ```\n\
  \    data records.snowfall;\n       modify records.snowfall records.overnight\n\
  \       key=accumAmt;\n    run;\n    ```\n    2.\n    ```\n    data records.snowfall;\n\
  \       modify records.overnight records.snowfall;\n       by accumAmt;\n    run;\n\
  \    ```\n    3.\n    ```\n    data records.snowfall;\n       modify records.snowfall\
  \ records.overnight;\n       by accumAmt;\n    run;\n    ```\n    4.\n    ```\n\
  \    data records.snowfall;\n       modify records.snowfall records.overnight\n\
  \       update accumAmt;\n    run;\n    ```\n\n4. 当你使用 `MODIFY` 语句配合 `BY` 语句或 `KEY=`\
  \ 选项时，会创建变量 `_IORC_`。你如何使用 `_IORC_` 的值？\n    1. 确定 `KEY=` 选项指定的索引是否为有效索引\n    2.\
  \ 确定主数据集中被更新的观测数量\n    3. 确定 I/O 操作的状态\n    4. 确定主数据集中无法更新的观测数量\n\n5. 哪一个 `PROC\
  \ DATASETS` 步在数据集 `Survey` 上创建一个名为 `val_age` 的完整性约束，以确保变量 `Age` 的值大于或等于 18？\n  \
  \  1.\n    ```\n    proc datasets nolist;\n       modify age;\n       ic create\
  \ val_age=check(where=(age>=18));\n    quit;\n    ```\n    2.\n    ```\n    proc\
  \ datasets nolist;\n       modify Survey;\n       ic create val_age=check(age>=18);\n\
  \    quit;\n    ```\n    3.\n    ```\n    proc datasets nolist;\n       modify survey;\n\
  \       integrity constraint\n                 val_age=check(where=(age>=18));\n\
  \    quit;\n    ```\n    4.\n    ```\n    proc datasets nolist;\n       modify survey;\n\
  \       ic create val_age=check(where=(age>=18));\n    quit;\n    ```\n\n6. 关于在\
  \ `DATA` 步中使用 `MODIFY` 语句的哪种描述是正确的？\n    1. `MODIFY` 在数据中的变量与 `WHERE` 子句匹配时创建数据的第二个副本，然后删除该第二个副本。\n\
  \    2. 你不能使用 `MODIFY` 语句修改数据集的描述符部分。\n    3. 你可以使用 `MODIFY` 语句更改变量的名称。\n    4.\
  \ 如果使用 `WHERE` 语句的 `DATA` 步在处理过程中异常终止，SAS 会自动保存未修改数据集的副本。\n\n7. 关于审计跟踪，以下哪种说法是正确的？\n\
  \    1. 它们创建数据的历史版本，因此在每次替换数据时都会保存数据集的副本。\n    2. 每次替换数据集时，它们都会记录数据集观测值更改的信息。\n\
  \    3. 每次对数据集进行就地修改时，它们都会记录数据集观测值更改的信息。\n    4. 审计跟踪文件名与其监控的 SAS 数据文件名相同，但在数据集名称末带有\
  \ `#AUDIT`。\n\n8. 哪段代码在现有的 SAS 数据集 `Sasuser.Amounts` 上启动生成数据集，并指定除基础版本外保存五个历史版本？\n\
  \    1.\n    ```\n    proc datasets lib=sasuser nolist;\n       modify Amounts (genmax=6);\n\
  \    quit;\n    ```\n    2.\n    ```\n    proc datasets lib=sasuser nolist;\n  \
  \     modify Amounts (genmax=5);\n    quit;\n    ```\n    3.\n    ```\n    proc\
  \ datasets lib=sasuser nolist;\n       modify Amounts (gennum=6);\n    quit;\n \
  \   ```\n    4.\n    ```\n    proc datasets lib=sasuser nolist;\n       modify Amounts\
  \ (gennum=5);\n    quit;\n    ```\n\n9. 关于在 `MODIFY` 语句中使用 `KEY=` 选项的哪种说法正确？\n \
  \   1. SAS 使用 `KEY=` 选项指定的索引定位要更新的变量，像使用 `MODIFY` 或 `BY` 语句那样自动覆盖非空事务值。\n    2.\
  \ 当你使用 `KEY=` 选项时，必须显式说明你想进行的更新。SAS 不会自动覆盖非空事务值。\n    3. `KEY=` 选项用于指定匹配观测值的变量。\n\
  \    4. `KEY=` 选项命名的索引必须是简单索引。\n\n10. 哪段代码删除了 `Sasuser.Amounts` 的所有生成，包括基础数据集？\n\
  \    1.\n    ```\n    proc datasets lib=sasuser nolist;\n       delete amounts (gennum=ALL);\n\
  \    quit;\n    ```\n    2.\n    ```\n    proc datasets lib=sasuser nolist;\n  \
  \     delete amounts (gennum=HIST);\n    quit;\n    ```\n    3.\n    ```\n    proc\
  \ datasets lib=sasuser nolist;\n       delete amounts (gennum=0);\n    quit;\n \
  \   ```\n    4.\n    ```\n    proc datasets lib=sasuser nolist;\n       delete amounts;\n\
  \    quit;\n    ```\n\n\n\n\n\n运行 SAS 程序会使用以下资源：\n\n| 资源 | 说明 |\n| --- | --- |\n\
  | CPU 时间![clock](img/m80-2-g1.png) | 中央处理器 (CPU) 执行所请求任务（如计算、数据读取和写入、条件逻辑和迭代逻辑）时花费的时间。\
  \ |\n| 实际时间![clock](img/m80-2-g1.png) | 执行一个作业或步骤所需的时钟时间（经过时间）。实际时间很大程度上取决于系统容量和负载（共享系统资源的用户数）。由于你无法总是控制系统的容量需求和负载需求，有时实际时间作为程序效率的衡量标准不如\
  \ CPU 时间 有用。然而，实际时间的过度使用通常会促使程序员提高程序的效率。某些存储过程允许你使用线程处理来缩短实际时间。线程处理可能会增加 CPU 时间。因此，建议同时跟踪\
  \ CPU 时间和实际时间。 |\n| 内存![work area](img/m80-2-g2.png) | 用于存放可执行程序模块、数据和缓冲区所需的易失性内存中的工作区域大小。\
  \ |\n| 数据存储空间![disk space](img/m80-2-g3.png) | 存储数据所需的磁盘或磁带空间大小。数据存储空间以多种单位衡量，其中某些单位仅用于特定的操作系统环境，如下所示：<br>*\
  \ 所有操作系统环境都使用字节 (bytes)、千字节 (kilobytes)、兆字节 (megabytes)、吉字节 (gigabytes) 和太字节 (terabytes)。<br>*\
  \ z/OS 还使用块、磁道和柱面。 | |\n| I/O![storage device to memory](img/m80-2-g4.png) | 数据和程序从存储设备复制到内存（输入）或从内存复制到存储或显示设备（输出）时执行的读写操作测量。\
  \ |\n\n# 评估站点的效率需求\n\n优化 SAS 程序的第一步是评估您站点的技术环境、程序以及数据。\n\n## 评估您的技术环境\n\n要确定您的站点哪些资源是稀缺或昂贵的，请与\
  \ IT 部门合作分析您技术环境的以下特征：\n\n| 类别 | 特征 |\n| --- | --- |\n| 硬件 | * 可用内存量<br>* CPU 数量<br>*\
  \ 外围设备的数量和类型<br>* 通信硬件<br>* 网络带宽<br>* 存储容量<br>* I/O 带宽<br>* 升级能力 |\n| 运行环境 | * 资源分配<br>*\
  \ 调度算法<br>* I/O 方法 |\n| 系统负载 | * 共享系统资源的用户或作业数量<br>* 网络流量（预期）<br>* 未来负载的预期增长 |\n\
  | SAS 环境 | * 安装了哪些 SAS 软件产品<br>* 为 SAS 编程分配的 CPU 数量和内存量<br>* 您的站点可以使用哪些运行 SAS 程序的方法\
  \ |\n\n开发一个高效的程序需要时间和思考。要确定节省的资源是否值得投入时间，请考虑程序的以下特征：\n\n| 特征 | 优化指南 |\n| --- | ---\
  \ |\n| 程序大小 | 随着程序增大增大，潜在节省空间随之增加。 |\n| 程序运行次数 | 运行一次或少数的低效程序与高效程序之间的差异较小，而运行多次的差异很大。\
  \ |\n\n## 评估您的数据\n\n任何效率技术的有效性很大程度上取决于您的数据。当您了解数据的特征时，可以可以选择利用这些特征的技术：\n\n| 特征 |\
  \ 优化指南 |\n| --- | --- |\n| 数据量 | 随着容量增加，潜在效率也随之增加。 |\n| 数据类型 | 特定技术对某些类型的数据可能效果更好。\
  \ |\n\n# 理解效率权衡\n\n在优化 SAS 程序时，理解存在权衡是非常重要的。减少一种资源的使用会增加另一种资源的使用。下表显示了常见权衡的示例：\n\
  \n| 减少此资源的使用 | 增加此资源的使用可能增加 |\n| --- | --- |\n| 磁盘空间![disk space](img/m80-2-g3.png)\
  \ | CPU 时间![clock](img/m80-2-g1.png) |\n| I/O![storage device to memory](img/m80-2-g4.png)\
  \ | 内存![work area](img/m80 2-g2.png) |\n| 实际时间![clock](img/m80-2-g1.png) | CPU 时间![clock](img/m80-2-g1.png)\
  \ |\n\n没有单一的最佳优化方法。它取决于您的情况。然而，以下章节提供了可以帮助确定哪些技术最高效的信息：\n\n* 控制内存使用\n* 控制数据存储空间\n\
  * 使用最佳实践\n* [高效查询数据](/certpgadv/html/p034xwg6jtv8n19\n\n# 使用 SAS 系统选项跟踪资源\n\n您可以指定一个或多个\
  \ SAS 系统选项 `STIMER`、`MEMRPT`、`FULLSTER` 和 `STATS` 来跟踪并报告资源使用。这些选项的可用性、用法和功能取决于操作系统，如下所示：\n\
  \n| 选项 | z/OS | UNIX 和 Windows |\n| --- | --- | --- |\n| STIMER | 会话期间跟踪 CPU 时间。仅可以在启动时设置。是默认设置。\
  \ | 会话期间跟踪 CPU 时间和实时统计并写入 SAS 日志。可以在启动时或使用 OPTIONS 语句设置。是默认设置。 |\n| MEMRPT | 会话期间跟踪内存使用统计。可以在启动时或使用\
  \ OPTIONS 语句设置。 | 不作为独立选项可用；此功能是 `FULLSTER` 选项的一部分。 |\n| FULLSTER | 会话期间跟踪所有可用的资源使用统计并写入\
  \ SAS 日志。可以在启动时或使用 OPTIONS 语句设置。在 z/OS 操作系统环境中，`FULLSTER` 是 `STATS` 选项的别名。除非 `STIMER`\
  \ 或 `MEMRPT` 有效，否则忽略此选项。 | 在 Windows 操作系统中，除非在启动时指定 `FULLSTER`，否则某些统计数据计算不准确。 |\n\
  \n\n\n\n\n| STATS | 告诉 SAS 将由前面的选项组合所跟踪的统计数据写入 SAS 日志中。可以在调用时设置，也可以通过 OPTIONS 语句设置。这是默认设置。\
  \ | 不作为独立选项可用。 |\n\nSAS 系统选项在调用 SAS 时通过默认设置初始化。然而，某些 SAS 系统选项的默认设置会根据操作系统环境和站点而异。详细信息请参阅适用于您的操作系统环境的\
  \ SAS 文档。您可以使用以下选项关闭任何这些系统选项：\n\n* `NOSTIMER`\n* `NOMEMRPT`\n* `NOFULLSTIMER`\n\
  * `NOSTATS`\n\n注意：在 z/OS 环境中，`NOFULLSTIMER` 是 `NOFULLSTATS` 选项的别名。\n注意：解释 `FULLSTIMER`\
  \ SAS 系统选项生成的统计数据的指南也可以在 `support.sas.com` 找到。\n注意：您还可以使用 SAS 响应测量 (`ARM`) 宏来监控应用程序的性能。本课程不涵盖\
  \ `ARM` 宏。要了解更多关于 `ARM` 宏的信息，请参阅 SAS 文档以及 `support.sas.com` 上关于 `ARM` 宏的详细信息。\n\n\
  # 使用基准测试比较技术\n\n为了决定哪种 SAS 编程技术对于特定任务最高效，您可以对比较的每种技术进行资源测试（测量和比较）。您应该使用实际数据进行基准测试，以确定最高的技术。\n\
  \n## 基准测试指南\n\n遵循以下指南，您的基准测试最可能产生有用结果：\n\n* 在测试编程技术之前，开启报告资源使用的 SAS 系统选项。如前所述，为了跟踪和报告资源使用情况，可以使用\
  \ `STIMER`、`MEMRPT`、`FULLSTIMER` 和 `STATS` 部分或全部系统选项。这些选项的可用性、用法和功能取决于操作系统环境。您还可以指定\
  \ `MSGLEVEL=I` 在 SAS 日志中显示额外的注释。使用 `FULLSTIMER` 选项记录使用的资源的完整列表。\n注意：要开启 `FULLSTIMER`\
  \ 选项，请使用以下语句：\n\n```\noptions fullstimer;\n```\n\n* 在独立的 SAS 会话中执行每种编程技术的代码。第一次引用程序代码（包括\
  \ `DATA` 步、函数、格式和 SAS 过程）时，操作系统可能必须将代码加载到内存或为其分配虚拟地址空间。第一次读取数据时，数据通常会被加载到缓存中，以便下次读取时可以更快地检索。执行这些操作所需的资源使用是开销。为每种技术更改使用独立的\
  \ SAS 会话可以最大限度地减少开销对您的资源统计的影响。\n\n* 在您测试的每种编程技术中，仅包含执行任务必需的 SAS 代码。如果您在每种技术的代码中包含过多的元素，您将不知道结果产生的原因。如果您正在进行基准测试的程序不大，可以通过一次一次更改单个编程技术来优化它，并在每次更改后运行整个程序，以测量对资源使用情况的影响。然而，更复杂的程序可能通过识别使用最多资源的步骤并将这些步骤提取到单独的程序中更容易优化。您可以通过反复更改、运行和测量单独程序来衡量不同编程技术的影响。在隔离您的程序部分时，请务必在它们在完整程序中使用的条件下测量它们的资源使用情况。\n\
  \n* 如果您的系统在您运行基准测试时同时在执行其他工作，请确保多次运行每种编程技术的代码。多次运行代码可以减少与系统正在执行的其他工作相关的资源消耗的波动。您如何处理多次测量取决于资源类型，如下所示：\n\
  \n    * 使用最小的实际时间和 CPU 时间测量值，因为这些值最接近您的编程技术实际所需的时间。较大的时间值（特别是在实际时间的情况下）是程序程序运行时计算机正在执行的其他工作干扰的结果。\n\
  \n    * 内存量不应在每次试验之间变化。如果内存确实发生了变化，可能是您的程序有时与另一个程序共享资源。\n\n\n\n\n正如你所学到的，没有哪一组编程技术在所有情况下都是最高效或最合适的。然而，如果减少执行时间是你计算环境中的一个重要考虑因素，那么实现该目标的一种方法是减少\
  \ SAS 从存储介质读取或写入的次数。在本章，你将学习使用选项（options）和语句（statement）来控制数据缓冲区的大小和数量，从而减少 SAS 必须执行的\
  \ I/O 操作次数来影响你的程序的执行时间。\n\n# 控制页面大小和缓冲区数量\n\n## 测量 I/O\nI/O 的改进可能以增加内存消耗为代价。为了理解\
  \ I/O 与内存之间的关系，了解数据何时被复制到缓冲区以及何时测量 I/O 会很有帮助。当你使用 `DATA` 步创建 SAS 数据集时，会发生以下操作：\n\
  \n1. SAS 从输入数据集复制一页数据到内存中的缓冲区。\n2. 每次将一个观测值从缓冲区加载到程序数据向量（PDV）。\n3. 每个观测值从 `PDV`\
  \ 写入输出缓冲区。\n4. 当输出缓冲区满时，将输出缓冲区的内容写入磁盘。\n\n![](img/m81-2-g1.png)读取外部文件的过程也类似。然而，每条记录首先从系统缓冲区读取到单记录输入缓冲区，然后才解析并读取到程序数据向量中。![](img/m81-2-g2.png)在这两种情况下，当输入数据被复制到内存中的缓冲区以及从输出缓冲区复制到输出数据集时，都会测量\
  \ I/O。\n\n## 页面大小\n将缓冲区视为内存中的一个容器，恰好保存一页数据。页描述如下：\n\n* 它是存储设备和内存之间数据传输的单位。\n* 它在创建数据集时大小固定，可以是默认值，也可以是用户指定的值。\n\
  \n较大的页面大小可以通过减少 SAS 从存储介质读取或写入的次数来减少执行时间。然而，执行时间的改进是以增加内存消耗为代价的。\n\n## 报告页面大小\n\
  你可以使用 `CONTENTS` 过程或 `DATASETS` 过程中的 `CONTENTS` 语句来报告页面大小和页面数量。\n\n| PROC CONTENTS\
  \ 部分输出 |\n| --- |\n| |\n\n```\nproc contents \n     data=company.order_fact;\nrun;\n\
  ```\n![](img/m81-4-g1.png)\n\n数据文件占据的字节总数等于页面大小乘以页面数量。例如，`Company.Order_fact` 的页面大小为\
  \ `8192`，页面数量为 `9423`。因此，数据文件占用 `77,193,216` 字节。注意：从 `PROC CONTENTS` 获取的信息取决于操作系统环境。注意：在未压缩的数据文件中，每页有\
  \ 40 字节的开销（64 位操作系统环境中）或 24 字节的开销（32 位操作系统环境中），外加每个观测值 1 比特的开销（向上舍入到最近字节），用于标记观测值是否已删除。你可以在[控制数据存储空间](../../certpgadv/html/p0bu1zpppbn7win1flrca4h00inw7.htm）中了解未压缩和压缩数据文件的结构。\n\
  \n## 使用 BUFSIZE= \n为了选择默认页面大小，SAS 使用基于观测长度、引擎和操作系统的算法。默认页面大小对于大多数 SAS 活动都是最优的，特别是在支持并发运行多个\
  \ SAS 业的计算机上。然而，在某些情况下，选择比默认更大的页面大小或缓冲区大小可以通过减少 SAS 从存储介质读取或写入的次数来加快执行速度。你可以使用 `BUFSIZE=`\
  \ 系统选项或数据集选项来控制输出 SAS 数据集的页面大小。新的缓冲区大小是数据集的永久属性。一旦指定，每当处理该数据集时都会使用它。\n\n| 通用格式 `BUFSIZE=`\
  \ 选项：`BUFSIZE= MIN | MAX | n;` |\n| --- |\n| 以下是该语法的解释：`MIN` 将页面大小设置为你环境中最小可能的数字。`MAX`\
  \ 将页面大小设置为你环境中最大可能的数字。`n` 指定以字节为单位的页面大小。例如，值 `8` 表示页面大小为 8 字节，值 `4K` 表示页面大小为 `4096`\
  \ 字节。默认值为 `0`，这会导致 SAS 使用该环境的最优页面大小。 |\n\n注意：`MIN` 可能会导致意外的结果，应避免使用。使用 `BUFSIZE=0`\
  \ 将缓冲区页面大小重置为你环境中的默认值。注意：此处显示的语法适用于 `OPTIONS` 语句。在命令行或配置文件中，语法取决于你的环境。详细信息请参阅你操作系统环境的\
  \ SAS 文档。每个环境只有某些页面大小或缓冲区大小值是有效的。如果你请求一个对环境无效的值，SAS 会自动向上舍入到下一个有效的页面大小或缓冲区大小。`BUFSIZE=0`\
  \ 被解释为请求默认页面大小或缓冲区大小。在下面的程序中，`BUFSIZE=` 系统选项指定的页面大小为 `30720`。\n\n```\noptions bufsize=30720;\n\
  filename orders 'c:\\orders.dat';\ndata company.order_fact;\n   infile orders;\n\
  \   ...\nrun;\n```\n\n在更改默认页面大小之前，考虑数据的访问模式以及硬件的 I/O 传输率是重要的。某些情况下，增加页面大小可能会降低性能，特别是当使用直接访问数据时。注意：`BUFSIZE=`\
  \ 的默认值由环境决定，并设置为优化顺序访问。为了提高直接访问的性能，你应该更改 `BUFSIZE=` 值。有关直接访问的默认设置和可能的设置，请参阅操作系统中的\
  \ `BUFSIZE=` 系统选项。注意：你可以通过 `BUFSIZE=` 数据集选项覆盖 `BUFSIZE=` 系统选项。注意：如果你使用 `COPY` 过程将数据集复制到通过不同引擎访问的库，则不一定保留原始页面大小或缓冲区大小。\n\
  \n## 使用 BUFNO=\n你可以使用 `BUFNO=` 系统或数据集选项来控制读写 SAS 数据集的缓冲区数量。通过增加缓冲区数量，你可以控制每次 I/O\
  \ 传输加载到内存的页面数。注意：在 Windows 和 UNIX 环境中，增加缓冲区数量可能影响性能，特别是当你处理大型数据集时。默认情况下，Windows\
  \ 和 UNIX 环境每次读取一个缓冲区。在窗口环境下，你可以在调用 SAS 时开启 `SGIO` 系统选项来覆盖此默认。有关 `SGIO` 系统选项的详细信息，请参阅\
  \ Windows 的 SAS 文档。以下技术可能减少 I/O 消耗：\n\n* 当处理小型数据集时，分配与页面数量相同的缓冲区，以便将整个数据集加载到内存中。这种技术在处理过程中多次读取同一观测值时最有效。\n\
  * 在 z/OS 环境中，随着数据集增大，应增加分配的缓冲区数量，而不是每个缓冲区的大小。\n\n\n\n\n| 通用格式，`BUFNO=` 选项：`BUFNO=`\
  \ `MIN` &#124; `MAX` &#124;`n;以下是该语法的解释：`MIN` 导致 SAS 使用操作系统环境的最小优化值。这是默认值。`MAX`\
  \ 将缓冲区数量设置为操作系统环境中可能的最大数量，最高为最大的 4 字节有符号整数，即 `2³¹-1`，或约 20 亿。`n` 指定了要分配的缓冲区数量。 |\n\
  \n注意：此选项的推荐最大值为 10。注意：此处显示的语法适用于 `OPTIONS` 语句。在命令行或配置文件中，语法取决于您的操作系统环境。详细信息，请参阅适用于您的操作系统环境的\
  \ SAS 文档。在以下程序中，`BUFNO=` 系统选项指定可用 4 个缓冲区。\n\n```\noptions bufno=4;\nfilename orders\
  \ 'c:\\orders.dat';\ndata company.orders_fact;\n   infile orders;\n   <more SAS\
  \ code>\nrun;\nproc print data=company.orders_fact;\nrun;\n```\n\n缓冲区数量不是数据集的永久属性，仅对当前步骤或\
  \ SAS 会话有效。图 20.1 当前 SAS 会话![当前 SAS 会话](img/m81-8-g1.png)注意：您可以使用 `BUFNO=` 数据集选项来覆盖\
  \ `BUFNO=` 系统选项。注意：在 SAS 9 及更高版本中，`BUFNO=` 选项对 z/OS 操作系统环境下的启用线程的过程没有影响。`BUFNO=`\
  \ 和 `BUFSIZE=` 的乘积（而不是任一选项的具体值）决定了单次 I/O 操作可以传输多少数据。增加任一选项的值都会增加单次 I/O 操作传输的数据量。\n\
  \n| `BUFSIZE` | `BUFNO` | 单次 I/O 操作中传输的字节数 |\n\n| --- | --- | --- |\n| 6144 | 2\
  \ | 12,288 |\n| 6144 | 10 | 61,440 |\n| 30,720 | 2 | 61,440 |\n| 30,720 | 10 | 307,200\
  \ |\n\n缓冲区数量和缓冲区大小对 CPU 使用率的影响极小。\n\n## 比较示例：使用 `BUFSIZE=` 选项和 `BUFNO=` 选项\n\n###\
  \ 示例设置\n\n假设您想比较使用不同缓冲区大小和不同数量缓冲区读取数据集时的资源用用情况。以下示例程序比较了 `BUFNO=` 选项和 `BUFSIZE=`\
  \ 选项的设置。您可以使用这些示例作为模型，在您自己的环境中创建基准测试程序。您的结果可能会根据数据结构、操作系统环境以及您处的可用资源而异。注意：6144 字节是\
  \ z/OS 操作系统环境下的默认页大小。\n\n### 编程技术\n\n| ![1](img/callout01.png) `BUFSIZE=6144, BUFNO=2`此程序读取数据集\
  \ `Retail.Order_fact` 并创建数据集 `Work.Orders`。`BUFSIZE=` 选项指定创建 `Work.Orders` 时缓冲区大小为\
  \ 6144 字节。`BUFNO=` 选项指定每次 I/O 传输时将 2 页数据加载到内存中。 |\n\n```\ndata work.orders (bufsize=6144\
  \ bufno=2);\n   set retail.order_fact;\nrun;\n```\n\n |\n\n| ![2](img/callout02.png)\
  \ `BUFSIZE=6144, BUFNO=5`此程序读取数据集 `Retail.Order_fact` 并创建数据集 `Work.Orders`。`BUFSIZE=`\
  \ 选项指定创建 `Work.Orders` 时缓冲区大小为 6144 字节。`BUFNO=` 选项指定每次 I/O 传输时将 5 页数据加载到内存中。 |\n\
  \n```\ndata work.orders (bufsize=6144 bufno=5);\n   set retail.order_fact;\nrun;\n\
  ```\n\n |\n\n| ![3](img/callout03.png) `BUFSIZE=6144, BUFNO=10`此程序读取数据集 `Retail.Order_fact`\
  \ 并创建数据集 `Work.Orders`。`BUFSIZE=` 选项指定创建 `Work.Orders` 时缓冲区大小为 6144 字节。`BUFNO=`\
  \ 选项指定每次 I/O 传输时将 10 页数据加载到内存中。 |\n\n```\ndata work.orders (bufsize=6144 bufno=10);\n\
  \   set retail.order_fact;\nrun;\n```\n\n |\n\n| ![4](img/callout04.png) `BUFSIZE=12288,\
  \ BUFNO=2`此程序读取数据集 `Retail.Order_fact` 并创建数据集 `Work.Orders`。`BUFSIZE=` 选项指定创建 `Work.Orders`\
  \ 时缓冲区大小为 12288 字节。`BUFNO=` 选项指定每次 I/O 传输时将 2 页数据加载到内存中。 |\n\n```\ndata work.orders\
  \ (bufsize=12288 bufno=2);\n   set retail.order_fact;\nrun;\n```\n\n |\n\n| ![5](img/callout05.png)\
  \ `BUFSIZE=12288, BUFNO=5`此程序读取数据集 `Retail.Order_fact` 并创建数据集 `Work.Orders`。`BUFSIZE=`\
  \ 选项指定创建 `Work.Orders` 时缓冲区大小为 12288 字节。`BUFNO=` 选项指定每次 I/O 传输时将 5 页数据加载到内存中。 |\n\
  \n```\ndata work.orders (bufsize=12288 bufno=5);\n   set retail.order_fact;\nrun;\n\
  ```\n\n |\n\n| ![6](img/callout06.png) `BUFSIZE=6144, BUFNO=10`此程序读取数据集 `Retail.Order_fact`\
  \ 并创建数据集 `Work.Orders`。`BUFSIZE=` 选项指定创建 `Work.Orders` 时缓冲区大小为 6144 字节。`BUFNO=`\
  \ 选项指定每次 I/O 传输时将 10 页数据加载到内存中。 |\n\n```\ndata work.orders (bufsize=6144 bufno=10);\n\
  \   set retail.order_fact;\nrun;\n``` |\n\n# 使用 SASFILE 语句\n\n## 概述\n\n另一种改进性能的方法是使用\
  \ `SASFILE` 语句将文件保留在内存中，以便供多个步骤使用。保持文件在内存中可以减少 I/O 处理和打开/关闭操作。\n\n| 通用格式，`SASFILE`\
  \ 语句：`SASFILE SAS-data-file <(password))> `OPEN` &#124; `LOAD` &#124; `CLOSE`;以下是该语法的解释：SAS-data-file\
  \ 是有效数据集（类型）。password-options 指定一个或多个选项。OPEN 打开文件并分配缓冲区，但推迟将数据加载到内存。LOAD 打开文件、分配缓冲区并将数据加载到内存。CLOSE\
  \ 关闭文件并释放缓冲区。 |\n\n`SASFILE` 语句打开文件并分配足够的缓冲区来容纳整个文件。一旦文件被读取，数据将保留在内存中，直到发生以下任一情况：\n\
  \n*   执行 `SASFILE CLOSE` 语句，释放缓冲区并关闭文件\n*   SAS 会话结束，自动释放缓冲区并关闭文件\n\n在以下程序中，第一个\
  \ `SASFILE` 语句打开文件 `Company.Sales`，分配缓冲区并将数据加载到内存。\n\n```\nsasfile company.sales\
  \ load;\nproc print data=company.sales;\n   var Customer_Age_Group;\nrun;\nproc\
  \ tabulate data=company.sales;\n   class Customer_Age_Group;\n   var Customer_BirthDate;\n\
  \   table Customer_Age_Group,Customer_BirthDate*(mean median);\nrun;\nsasfile company.sales\
  \ close;\n```\n\n注意：`SASFILE` 语句也可用于减少重复读取一个或多个 SAS 视图的 CPU 时间和 I/O。使用 `DATA` 步骤在\
  \ Work 库中创建一个视图结果集的 SAS 数据集。然后使用 `SASFILE` 语句将该数据集加载到内存。注意：虽然使用 `SASFILE` 语句打开的文件可用于后续的输入或更新处理，但不支持后续的实用或输出处理。例如，您无法替换文件或重命名其变量。\n\
  \n## 使用 SASFILE 语句的指南\n\n执行 SASFILE 语句时，SAS 根据数据文件索引文件的页数分配缓冲区。如果内存中的文件在处理过程中由于更改或添加而增大，缓冲区数量也会随之增加。重要的是，只有在有足够的实际内存的情况下才能减少\
  \ I/O 处理。如果没有足够的实际内存，操作系统可能会使用以下内容：\n\n*   虚拟内存\n\n\n\n\n\n*   默认缓冲区数量\n\n如果 SAS\
  \ 使用了虚拟内存，性能可能会下降。如果您需要重复处理部分 SAS 数据文件，且整个文件无法完全装入内存，请使用带有 `SASFILE` 语句的 `DATA`\
  \ 步创建一个可以完全放入内存的文件子集。然后反复处理该子集。此操作可以在处理步骤中节省 CPU 时间，因为这些步骤读取的是较小的文件，而且还有文件驻留于内存带来的益处。\n\
  \n注意：当使用 `SASFILE` 语句时，请在程序运行时监控分页活动（由您操作环境的虚拟内存管理子系统所执行的 I/O 活动）。如果分页活动大幅增加，请考虑减少内存中的数据量。\n\
