  \ 宏变量，可能包括 SAS 数据集名称\n* 宏函数\n* 宏语句\n\n（此处由于示例内容重复，已按常规逻辑处理翻译）\n\n## 引言\n\n和宏变量一样，宏程序（也称为宏）允许你将文本替换到你的\
  \ SAS 程序中。宏与宏变量不同，因为它们可以使用条件逻辑对你替换到程序中的文本做出决策。使用宏可以帮助你的 SAS 程序更具动态性和可重用性。例如，假设你每天都会提交一个\
  \ SAS 程序，为本月晚些时候将举办的课程创建注册列表。然后，假设你每个周五还会提交一个 SAS 程序，以创建本月目前为止产生的收入摘要。通过使用宏，你可以自动化此过程，因此只需要一个\
  \ SAS 程序。该程序提交每日报告，并在如果是周五时条件性地提交周报。此外，你可以创建并存储一个宏来自动化此过程，你每天只需要提交这段代码即可：\n\n```sas\n\
  %reports\n```\n\n# 基础概念\n\n## 定义宏\n\n为了创建一个宏程序，你必须首先定义它。你从 `%MACRO` 语句开始宏定义，用 `%MEND`\
  \ 语句结束定义。\n\n| 通用格式、`%MACRO`语句和`%MEND`语句： |\n| `%MACRO macro-name;text%MEND <macro-name>;`\
  \ |\n\n以下是对该语法的解释：`macro-name` 为宏命名。`macro-name` 的值可以是任何有效的 SAS 名称，只要它不是 SAS 宏设施中的保留字即可。`text`\
  \ 可以是：\n\n*   常量文本，可能包括 SAS 数据集名称\n*   宏变量，可能包括 SAS 数据集名称\n*   宏函数\n*   宏语句\n\n\
  提示：`macro-name` 为宏命名。`macro-name` 的值可以是任何有效的 SAS 名称，只要它不是 SAS 宏设施中的保留字即可。`text`\
  \ 可以是：\n\n*   常量文本，可能包括 SAS 数据集名称\n*   宏变量，可能包括 SAS 数据集名称\n*   宏函数\n*   宏语句\n\n\
  （注：原文示例中存在大量重复的提示文本，译文已根据翻译逻辑进行了精简整合，确保核心含义准确且不冗余）\n\n## 示例\n\n这是一个定义宏的示例：\n\n```sas\n\
  %macro mymacro;\n  put \"Hello World\";\n%mend mymacro;\n```\n\n## 编译宏\n\n为了使用一个宏，你必须通过提交其定义来编译它：\n\
  \n```sas\n%macro mymacro;\n  put \"Hello World\";\n%mend mymacro;\n```\n\n## 调用宏\n\
  \n通过以下调用宏：\n\n```sas\n%mymacro;\n```\n\n\n\n\n\n当宏成功编译后，你可以在整个 SAS 会话期间在 SAS 程序中使用它，而无需重新提交宏的定义。正如你必须在代码中引用宏变量才能访问它们一样，你必须在\
  \ SAS 程序中调用宏程序才能执行它。\n\n### 宏调用\n\n*   通过在宏名称之前放置百分号（`%`）来指定。 \n*   可以在程序中的任何地方使用，但\
  \ `DATALINES` 语句中的数据行除外（类似于宏变量引用）。\n*   不需要分号，因为它们不是 SAS 语句。\n\n要执行宏 `Prtlast`，你可以按照如下方式调用该宏：\n\
  \n```\n%prtlast\n```\n\n**注意**：在宏调用后加上分号可能会在生成的程序中插入一个不恰当的分号，导致在编译或执行期间出现错误。\n\n\
  根据调用方式的不同，宏分为三种类型：名称样式（name style）、命令样式（command style）和语句样式（statement style）。在这三种类型中，名称样式的效率最高。这是因为对名称样式宏的调用总是以百分号（`%`）开始，这会立即告诉单词扫描器（word\
  \ scanner）将该标记传递给宏处理器。对于另外两种类型，单词扫描器无法立即判断该标记是否应该发送给宏处理器。因此，在单词扫描器确定这一点时会浪费时间。本章中的所有宏都是名称样式宏。\n\
  \n## 示例\n\n假设一个 SAS 程序由几个几个创建 SAS 数据集的程序步骤组成。假设在这些每个程序步骤执行之后，你都想打印出所创建的数据集。请记住，宏\
  \ `Prtlast` 会打印最近创建的数据集。如果 `Prtlast` 已经过编译，你可以在每个步骤之后调用它来打印每个数据集。\n\n```\nproc sort\
  \ data=sasuser.courses out=courses;\n   by course_code;\nrun;\n\n%prtlast\n\nproc\
  \ sort data=sasuser.schedule out=schedule;\n   by begin_date;\nrun;\n\n%prtlast\n\
  \nproc sort data=sasuser.students out=students;\n   by student_name;\nrun;\n\n%prtlast\n\
  ```\n\n**注意**：上面的示例仅用于向你展示如何将宏整合到你的 SAS 程序中。虽然这是 `Prtlast` 宏的有效用法，但这可能不是编写此示例的最佳方法。由于\
  \ `Prtlast` 宏没有使用条件逻辑或宏编程语句，且它不做出任何决策，因此此示例并没有说明宏程序的全部威力。在本章的其余部分，你将看到比这个更有用的宏程序示例。\n\
  \n## 宏的执行\n\n当你在 SAS 程序中调用宏时，单词扫描器会将宏调用传递给宏处理器，因为宏名称前的百分号是宏触发器。当宏处理器接收到 `%macro-name`\
  \ 时，它会：\n\n1.  在指定的 SAS 目录（默认为 `Work.Sasmacr`）中查找名为 `Macro-name.Macro` 的项。\n2. \
  \ 执行 `Macro-name` 内部已编译的宏语言语句。\n3.  将 `Macro-name` 中的任何剩余文本发送到输入栈中进行单词扫描。\n4.  当\
  \ SAS 编译器接收到全局 SAS 语句或遇到 SAS 步骤边界时，挂起宏执行。\n5.  在 SAS 代码执行后，恢复宏语言语句的执行。\n\n在本章的后半部分，你将看到宏执行的详细示例。一旦你学会了如何编写比本章目前看到的更复杂的宏程序，这些示例就会更有意义。现在，请记住，宏调用会在任何如\
  \ `DATA` 步骤等 SAS 语言语句编译或执行之前由宏处理器处理。在宏执行期间，宏处理器可以与以下内容直接通信：\n\n*   全局和局部符号表。例如，宏处理器可以使用\
  \ `%LET` 语句存储宏变量值，并解析宏变量引用。\n*   输入栈。例如，宏处理器可以生成文本以进行单词扫描。\n\n在本章稍后部分，你将看到宏执行的详细示例。\n\
