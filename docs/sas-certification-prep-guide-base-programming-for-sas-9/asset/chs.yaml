  zurich.dat);\n       ```\n    2. ```\n       filename onsale 'c:\\routes\\new\\\
  london.dat'\n           'c:\\routes\\new\\paris.dat'\n           'c:\\routes\\new\\\
  zurich.dat';\n       ```\n    3. ```\n       filename onsale (c:\\routes\\new\\\
  london.dat,\n           c:\\routes\\new\\paris.dat\n           c:\\routes\\new\\\
  zurich.dat);\n       ```\n    4. ```\n       filename onsale 'c:\\routes\\new\\\
  london.dat\n           c:\\routes\\new\\paris.dat\n           c:\\routes\\new\\\
  zurich.dat\n       ```\n\n2. 下列哪个说法是正确的？\n\n    1. `FILEVAR=`选项可动态更改当前打开的输入文件。\n\
  \    2. `FILEVAR=`变量不会写入数据集。\n    3. `FILEVAR=`必须包含字符字符串。\n    4. 以上所有。\n\n3. 给定以下程序，哪个表格显示了对应的\
