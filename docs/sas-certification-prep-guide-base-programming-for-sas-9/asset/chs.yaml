  \ `MODIFY` 子句）、添加新定义（包括 `ADD` 子句）或删除现有列（包括 `DROP` 子句）。\n\n### 9. 正确答案：c\n`DESCRIBE\
  \ TABLE` 语句列指定表的列属性。\n\n### 10. 正确答案：a\n`CREATE TABLE` 语句可以包含列规范以创建一个空表。整组列规范必须封装在一个括号内。你必须列出每个列的名称、数据类型以及（对于字符列）长度。长度以括号中的整数形式指定。多个列规范之间必须用逗号分隔。\n\
  \n# 第 6 章：使用 PROC SQL 创建和管理索引\n\n### 1. 正确答案：d\n指定的索引基于一列，因此它是一个简单索引。在 `CREATE INDEX`\
  \ 语句中，你在关键字 `CREATE INDEX` 之后指定索引名称。你不需要包含关键字来指定这是一个简单索引。键列的名称在表名后的括号中指定。简单索引的名称必须与键列的名称相同。\n\
  \n### 2. 正确答案：b\n要创建唯一索引，需要在 `CREATE INDEX` 语句中在关键字 `CREATE` 和 `INDEX` 之间添加 `UNIQUE`\
  \ 关键字。\n\n### 3. 正确答案：d\n复合索引基于两个或多个列。在 `CREATE INDEX` 语句中，你在关键字 `CREATE INDEX`\
  \ 之后指定索引名称。你不需要包含关键字来指定这是一个复合索引。键列的名称在表名后的括号中指定。复合索引的名称不能与表中任何列的名称相同。\n\n### 4.\
  \ 正确答案：a\n指定选项 `MSGLEVEL=I` 会导致关于索引使用的信息性消息写入 SAS 日志。\n\n### 5. 正确答案：c\n`DROP INDEX`\
  \ 语句从表中删除一个或多个指定的索引。你在关键字 `DROP INDEX` 之后指定要删除的每个索引的名称。表名在关键字 `FROM` 之后指定。语句中不指定索引类型和被索引列的名称。\n\
  \n### 6. 正确答案：b\n`DESCRIBE TABLE` 语句列出你指定的的一个或多个表的所有索引，以及关于这些表的其他信息。\n\n### 7. 正确答案：a\n\
  `IDXWHERE=YES` 数据集选项告诉 SAS 使用最佳可用索引，即使该索引没有优化性能。\n\n### 8. 正确答案：c\n索引可以在字符列或数值列上创建。\n\
  \n### 9. 正确答案：d\n使用索引将优化特定类别的 `PROC SQL` 查询。键列仅在 `SELECT` 子句中指出的查询不属于这些查询之一。\n\n\
  ### 10. 正确答案：c\n`IDXNAME=` 数据集选项引导 `PROC SQL` 使用你指定的索引。指定的索引必须存在，并且必须通过至少第一列或唯一列匹配\
  \ `WHERE` 表达式中的条件是有效的。\n\n# 第 7 章：使用 PROC SQL 创建和管理视图\n\n### 1. 正确答案：a\n`PROC SQL`\
  \ 视图访问最新的底层数据，并可以与表或其他视图连接。此外，`PROC SQL` 视图可以：\n\n*   在 SAS 程序中代替实际的 SAS 数据文件\n\
  *   从一个或多个表、`PROC SQL` 视图或 `DATA` 步骤视图派生。\n\n### 2. 正确答案：d\n`PROC SQL` 视图很有用，因为它们：\n\
  \n*   通常可以节省空间（与其访问的数据相比，视图通常很小）\n*   防止用户不断提交查询来忽略不需要的列或行\n*   向用户隐藏复杂的连接或查询。\n\
  \n此外，`PROC SQL` 视图：\n\n*   确保输入数据集始终是最新的，因为数据是在执行时从表中派生的。\n*   可以用于向用户屏蔽敏感或机密列，同时允许这些用户查看同一表中的其他列。\n\
  \n### 3. 正确答案：c\n你使用 `CREATE VIEW` 语句创建视图。关键字 `CREATE VIEW` 之后是视图名称和关键字 `AS`。\n\n\
  ### 4. 正确答案：b\n`DESCRIBE VIEW` 语句在 SAS 日志中显示视图定义。\n\n### 5. 正确答案：a\n你可以像使用实际的 SAS\
  \ 表一样在 `PROC SQL` 步骤中使用视图。\n\n### 6. 正确答案：d\n`USING` 子句允许你在视图定义中嵌入 `LIBNAME` 语句。`USING`\
  \ 子句必须是 `CREATE VIEW` 语句中的最后一个子句。\n\n### 7. 正确答案：d\n`PROC SQL` 视图可以从 SAS 数据文件、`DATA`\
  \ 步骤视图、`PROC SQL` 视图或关系数据库表访问数据。\n\n### 8. 正确答案：d\n当你处理 `PROC SQL` 视图时，最好：\n\n*\
  \   避免在视图中使用 `ORDER BY` 子句。如果你指定了 `ORDER BY` 子句，则每次引用视图都必须对数据进行排序。\n*   避免创建基于结构可能会变化的表的视图。当视图引用不存在的列时，该视图将失效。\n\
  *   如果视图与贡献表位于同一个 SAS 数据库中，在 `FROM` 子句中指定单级名称。在 `FROM` 子句中使用单级名称可以防止你在为包含视图及其贡献表（或表）的\
  \ SAS 数据库分配不同的 `libref` 时必须更改视图。\n\n### 9. 正确答案：c\n你可以更新 `PROC SQL` 视图，前提是视图没有连接或链接到另一个表、视图没有子查询，或者你正尝试更新派生列。你可以更新包含\
  \ `WHERE` 子句的视图。`WHERE` 子句可以在 `UPDATE` 子句中也可以在视图中。你不能更新包含任何其他子句（如 `ORDER BY` 或 `HAVING`\
  \ 子句）的视图。\n\n### 10. 正确答案：b\n`DROP VIEW` 语句从指定的库删除视图。\n\n# 第 8 章：使用 PROC SQL 管理处理\n\
  \n### 1. 正确答案：a\n`PROC SQL` 选项在 `PROC SQL` 语句中指定。指定选项后，它一直有效直到你更改它或重新调用 `PROC SQL`。\n\
  \n### 2. 正确答案：b\n`INOBS=` 选项限制 `PROC SQL` 从单个源输入的行数。`INOBS=` 选项类似于 SAS 系统选项 `OBS=`，对于大表的查询很有用。`OUTOBS=`\
  \ 选项限制 `PROC SQL` 显示或写入的行数。\n\n### 3. 正确答案：c\n指定选项后，它一直有效直到你更改它或重新调用 `PROC SQL`。你可以使用\
  \ `RESET` 语句在不重新调用 SQL 过程的情况下添加、删除或更改 SQL 选项。在正确答案中，`RESET` 语句添加了 `NUMBER` 选项和 `OUTOBS=`\
  \ 选项。结果输出列出了 `Sasuser.Flightattendants` 表中 `Jobcode` 等于 `FA2` 的前 10 行，并包含一个名为 `Row`\
  \ 的列。\n\n### 4. 正确答案：d\n`DOUBLE | NODOUBLE` 选项指定列表输出中 `PROC SQL` 输出的双倍行距。`FLOW |\
  \ NOFLOW | FLOW=n | FLOW=n m` 选项控制列表输出中宽字符列。这两个选项都不影响 HTML 输出。\n\n### 5. 正确答案：d\n\
  `PROC SQL` 中的 `STIMER | NOSTIMER` 选项指定 `PROC SQL` 是否将每个语句的计时信息写入 SAS 日志，而不是作为整个过程的累计值。`NOSTIMER`\
  \ 是默认值。为了在 `PROC SQL` 中使用 `STIMER` 选项，SAS 系统选项 `STIMER`（默认值）也必须生效。如果你只使用系统选项，你将获得整个过程的计时信息，而不是逐个语句的计时。\n\
  \n\n\n\n\n## 第 8 章（续）\n\n6. 正确答案：dA `Dictionary` 表是一个特殊的只读 SAS 数据视图，它包含有关当前 SAS\
  \ 会话中正在使用或可用的 SAS 数据库、SAS 数据集、SAS 宏和外部文件的信息。`Dictionary` 表还包含当前生效的 SAS 系统选项的设置。\n\
  \n7. 正确答案：d-`Dictionary` 表在每次于 SAS 程序中被引用时都会创建，并自动更新，且仅限于只读访问。访问 `Dictionary` 表会使\
  \ SAS 确定 SAS 会话的当前状态，并返回您想要的信息。\n\n8. 正确答案：d-可以通过使用 `Dictionary` libref 针对该表运行 `PROC\
  \ SQL` 查询来访问 `Dictionary` 表。虽然 SAS librefs 通常限制为 8 个字符，但 `Dictionary` 是一个自动分配的保留字。您也可以通过引用存储在\
  \ `Sashelp` 库中的该表的 `PROC SQL` 视图来访问 `Dictionary` 表。\n\n10. 正确答案：b-要查看 `Dictionary`\
  \ 表是如何定义的，请提交 `DESCRIBE TABLE` 语句。`DESCRIBE TABLE` 语句会在 SAS 日志中为 `DESCRIBE TABLE`\
  \ 语句中指定的表写入 `CREATE TABLE` 语句。\n\n11. 正确答案：a-要显示特定库中文件的信息，请在 `SELECT` 语句中指定列名并在\
  \ `FROM` 子句中指定 `Dictionary` 表名。`WHERE` 子句中的库名必须大大写，因为这是它在 SAS 中的存储方式，并且必须包含在引号中。\n\
  \n# 第 9 章：宏变量简介\n\n1. 正确答案：b-宏变量始终独立于 SAS 数据集的文本字符串。宏变量的值长度可达 65,534 个字符，宏变量的名称长度可达\
  \ 32 个字符。宏变量可以在 SAS 任何地方（数据行除外）定义或引用。宏变量有两种类型：自动宏和用户定义宏。\n\n2. 正确答案：c-要引用宏变量，请在名称前加一个\
  \ `&` 符号。您不需要将宏变量引用括在引号中。\n\n3. 正确答案：a-在 SAS 日志中显示宏变量值有两种方法：您可以开启 `SYMBOLGEN` 系统选项来列出所有使用的宏变量的值，或者可以使用\
  \ `%PUT` 语句将特定文本（包括宏变量值）写入日志。\n\n4. 正确答案：d-您使用 `%LET` 语句来定义宏变量。您不需要将值括在引号中。如果您在赋值给宏变量的值中包含了引号，则引号将作为值的一部分被存储。\n\
  \n5. 正确答案：d-宏变量以字符字符串的形式存储。引号和大多数特殊字符按照其赋值的方式精确存储，但赋值值中的前空格会被删除。您还可以在 `%LET` 语句中包含对其他宏变量的引用。\n\
  \n6. 正确答案：d-`SYSDATE9` 是一个自动宏变量，它以 `ddmmmyyyy` 格式存储 SAS 会话开始的日期。您可以使用 `%SYSFUNC`\
  \ 函数配合任何 DATA 步函数，因此 `TODAY()` 函数和 `DATE()` 函数都会产生当前日期。\n\n7. 正确答案：c-诸如 `%UPCASE`\
  \ 和 `%SUBSTR` 等宏字符函数允许您对宏变量值进行字符操纵。\n\n8. 正确答案：b-`scanner` 单词识别四种类型的标记（tokens）。表达式不是标记的一种类型。\n\
  \n9. 正确答案：c-您可以将宏变量引用与文本结合以创建新的文本字符串。如果您在宏变量之前加上文本，宏变量名称开头的 `&` 符号表示文本的结束和宏变量名称的开始。如果您想让文本紧随宏变量值，必须用句点\
  \ `.` 标记宏变量名称的结束。\n\n10. 正确答案：c-在这种情况下，您使用 `%QSYSFUNC` 函数来掩盖由 `worddate.` 格式产生的逗号。您必须掩盖这个逗号，因为\
  \ `LEFT()` 函数只接受一个参数。\n\n# 第 10 章：执行时处理宏变量\n\n1. 正确答案：c-大多数宏函数在 `DATA` 步中的任何 SAS\
  \ 语言语句执行之前已由宏处理器处理。例如，`%LET` 语句和任何宏变量引用（`&macvar`）在程序编译之前传递给宏处理器。为了在 DATA 步执行期间创建或更新宏变量，您需要使用\
  \ `SYMPUT` 过程。\n\n2. 正确答案：a-要创建一个宏变量并为其赋值一个基于 DATA 步变量的值，您需要使用 `SYMPUT` 过程。在 `SYMPUT`\
  \ 过程中，要将字面量作为宏变量名，请将字面量括在引号中。要将字面量作为宏变量的值，请将字面量括在引号中。\n\n3. 正确答案：d-`SYMPUT` 过程允许您将数据集变量作为宏变量的值。您还可以使用\
  \ `SYMPUT` 过程创建一系列相关的宏变量。由于所有宏变量值都是字符字符串，`SYMPUT` 会自动转换您尝试赋值给宏变量的任何数值值。在 SCL 程序中，如果您尝试将数值值赋值给宏变量，必须使用\
  \ `SYMPUTN` 而不是 `SYMPUT`。\n\n4. 正确答案：b-当一个宏变量的值是另一个宏变量的名称时，可以使用多个 `&` 来创建间接引用。如果在\
  \ SYMPUT 过程中将 DATA 变量名括在引号中，则新宏变量将与该 DATA 变量同名，而不是以该 DATA 变量的值作为名称。使用 `SYMGET` 函数在\
  \ DATA 步执行期间获取宏变量的值。\n\n5. 正确答案：b-如果连续四个以上的 `&` 在标记之前，重新扫描将从左到右持续直到可以解析更多标记。向前扫描规则（Forward\
  \ Re-scan）描述了宏处理器如何解析以多个 `&` 或多个 `%` 开头的宏变量引用。\n\n6. 正确答案：dA 宏变量引用（`&macvar`）在向编译器发送任何\
  \ SAS 语言语句之前解析。`SYMGET` 函数允许您在 DATA 步或 PROC SQL 步执行期间获取宏变量的值。`SYMGET` 函数还可以用于在 SCL\
  \ 程序执行期间获取宏变量的值。\n\n7. 正确答案：c-要在 PROC SQL 步执行期间创建宏变量，请使用 `SELECT` 语句的 `INTO` 子句。在\
  \ `INTO` 子句中，宏变量名称前加 `:`。\n\n8. 正确答案：c-您可以使用多个 `&` 来延迟宏变量引用的解析。您还可以结合宏变量引用创建新的标记。在这个示例中，引用\
  \ `&&teach&crs` 在第一次扫描时解析为 `&teach3`。在下一次扫描中，`&teach3` 解析为 `Forest, Mr. Peter`。\n\
  \n\n\n\n\n10. 正确答案：c `SYMPUT` 例程可以在 `DATA` 步或 SCL 程序中使用。在 `DATA` 步中，`SYMPUT` 例程将对你尝试赋值给宏变量的数值值进行自动转换，并使用\
  \ `BEST12. ` 格式。在 SCL 程序中，如果你想将数值赋值为宏变量的值，则应该使用 `SYMPUTN` 例程。在 `PROC SQL` 步中，你需要在将宏变量的值与其他数值进行比较之前，使用\
  \ `INPUT` 函数将宏变量的值转换为数值。\n\n# 第 11 章：创建和使用宏程序\n\n1. 正确答案：b 宏定义必须以 `%MACRO` 语句开始，并以\
  \ `%MEND` 语句结束。宏定义可以包含宏语言语句，也可以包含 SAS 语言语句。当编译宏时，系统会检查宏语言语句是否有语法错误。编译后的宏默认存储在临时的\
  \ SAS 目录中。\n\n2. 正确答案：c 将要在宏定义中包含位置参数，你需要在括号中列出这些参数并用逗号分隔。当宏执行时，宏变量将在局部符号表中创建，且其名称与参数相同。然后你可以在宏内部使用这些宏变量。\n\
  \n3. 正确答案：c 调用包含位置参数的宏时，要在宏名称前加一个百分号。你需要在括号中列出由参数定义的宏变量的值。请按参数列出的相同顺序列出这些值，并用逗号分隔。记住，宏调用不是\
  \ SAS 语言语句，因此不需要分号。\n\n4. 正确答案：d 在混合参数列表中，位置参数必须列在任何关键字参数之前。位置参数和关键字参数都会在局部符号表中创建宏变量。若要为关键字参数分配空值，你可以在宏调用中不带任何值地列出该参数。\n\
  \n5. 正确答案：c 当你提交一个宏定义时，该宏会被编译并存储在 SAS 目录中。然后当你调用该宏时，该宏会被执行。该宏在当前 SAS 会话期间任何时候都可以用于执行。\n\
  \n6. 正确答案：d 你可以使用 `%IF-%THEN` 语句对代码进行条件处理。在 `%IF-%THEN` 语句内部，你必须使用 `%DO` 和 `%END`\
  \ 语句来封装多个语句。`%IF-%THEN` 语句与 `DATA` 步中的 `IF THEN` 语句类似，但它们属于宏语言。\n\n7. 正确答案：d 通过使用\
  \ `%IF-%THEN` 语句，你可以将整个步、单个语句或语句的一部分放入输入栈中。\n\n8. 正确答案：c 有多种方法可以在局部符号表中创建宏变量。通过宏定义中的参数或\
  \ `%LOCAL` 语句创建的宏变量始终在局部表中创建。在宏定义内部，通过 `%LET` 语句或 `SYMPUT` 例程创建的宏变量也可能创建在局部表中。\n\
  \n9. 正确答案：b 要定义带有 `%DO` 循环的宏，你需要使用一个 `%DO` 语句和一个 `%END` 语句。请确保在语句中的所有关键字前都加上百分号，因为\
  \ `%DO` 和 `%END` 语句是宏语言语句。此外，请确保这些语句以分号结束。\n\n10. 正确答案：d 当你提交对一个已编译宏的调用时，该宏会被执行。具体而言，宏处理器首先执行编译后的宏语言语句。当遇到任何\
  \ SAS 语言语句时，宏处理器会将这些语句放入输入栈并暂停，直到它们传递给编译器并执行。然后，宏处理器继续重复这些步骤，直到遇到 `%MEND` 语句。\n\n\
  # 第 12 章：存储宏程序\n\n1. 正确答案：d `%INCLUDE` 语句可以将外部文件的内容插入到 SAS 程序中。如果宏定义存储在外部文件中，当它被插入到\
  \ SAS 程序时，`%INCLUDE` 语句会导致宏定义被编译。只有在指定了 `SOURCE2` 选项时，宏定义的内容才会写入 SAS 日志。\n\n2. 正确答案：a\
  \ 当宏定义存储为目录 `SOURCE` 条目时，你必须在从 SAS 程序调用它之前对其进行编译。你通过使用 `CATALOG` 访问方法来编译存储为目录 `SOURCE`\
  \ 条目的宏。这会创建一个会话编译的宏，它将在 SAS 会话结束时被删除。`PROC CATALOG` 语句允许你查看 SAS 目录内容的列表。\n\n3. 正确答案：c\
  \ 要调用存储在自动调用（autocall）库中的宏，你必须同时指定 `MAUTOSOURCE` 系统选项和 `SASAUTOS=` 系统选项。`SASAUTOS=`\
  \ 系统选项可以设置为包含多个路径或文件引用。一旦设置了这两个系统选项，你就可以在宏名称前加百分号来调用该宏。\n\n4. 正确答案：d 存储编译宏设施（Stored\
  \ Compiled Macro Facility）允许你永久存储编译后的宏，以便在后的 SAS 会话中重复使用它们而无需再次编译。编译宏必须存储在名为 `Sasmacr`\
  \ 的目录中，并且必须指定 `MSTORED` 系统选项和 `SASMSTORE=` 系统选项。\n\n5. 正确答案：b 为了创建一个永久存储的编译宏，你必须指定\
  \ `MSTORED` 系统选项。必须指定 `SASMSTORE=` 系统选项指向你想要存储宏的库。你还在 `%MACRO` 语句中使用 `STORE` 选项。\n\
  \n6. 正确答案：a 当你提交宏定义时，SAS 会创建一个会话编译的宏并将其存储在临时 SAS 目录 `Sasmacr` 中。该宏将在会话结束时删除。\n\n\
  7. 正确答案：d 如果你将宏定义存储在外部文件中，你就可以与他人共享这些文件。此外，你可以使用任何文本编辑器编辑存储在外部文件中的宏定义，并在其他 SAS 会话中重用它。\n\
  \n8. 正确答案：b `PROC CATALOG` 步骤允许你查看 SAS 目录内容的列表。如果你将宏定义存储永久 SAS 目录中的 `SOURCE` 条目，这可能特别有用。你可能还会使用\
  \ `PROC CATALOG` 步骤查看存储在 `Sasmacr` 中的会话编译宏列表。\n\n9. 正确答案：c 要使用存储编译宏设施，你需要指定 `MSTORED`\
  \ 和 `SASMSTORE=` 系统选项。存储编译宏设施将编译宏保存在永久 SAS 目录中，但它不保存宏定义。你无法跨操作系统移动编译宏。由于无法从编译宏重新创建宏定义，建议永久保存源程序。\n\
  \n# 第 13 章：创建索引\n\n1. 正确答案：d 索引是数据集的一个独立文件，包含数据集内观测的信息。具体而言，索引包含值/标识符对，指示数据集内观测的位置以及该观测中一个或多个键变量的值。\n\
  \n\n\n\n\n## 索引概念\n\n2. 正确答案：c 要在创建数据集的同时创建索引，你可以使用 `DATA` 语句中的 `INDEX=` 选项。你必须为复合索引分配一个唯一的名称，而简单索引会自动将键变量的名称作为其名称。你可以将系统选项\
  \ `MSGLEVEL=` 的值设置为 `I`，以便在 SAS 日志中查看有关索引的消息。\n\n3. 正确答案：a 对于你对数据集执行的许多维护任务，SAS\
  \ 会自动对索引文件执行相应的任务。例如，如果你删除了一个数据集，索引文件也会被删除。如果你在 `DATASETS` 过程中使用 `CHANGE` 语句重命名一个数据集，SAS\
  \ 会自动重命名索引文件。如果你在 `DATASETS` 过程中使用 `COPY` 语句将数据集复制到新位置，SAS 会在新位置自动重建索引文件。\n\n4.\
  \ 正确答案：d 你可以使用 `DATASETS` 过程或 `SQL` 过程从现有数据集中创建或删除索引。你还可以使用 `DATA` 步重建索引，并使用 `INDEX=`\
  \ 选项在重建的数据集上创建索引。然而，重建数据集比使用 `DATASETS` 或 `SQL` 过程向现有数据集添加索引消耗更多的系统资源。\n\n5. 正确答案：a\
  \ 你使用 `SQL` 过程的 `CREATE INDEX` 语句在现有数据集上创建索引。在 `SQL` 过程中，你必须在 `CREATE INDEX` 语句中命名索引；对于简单索引，索引名称必须与键变量的名称匹配。\n\
  \n6. 正确答案：b 你可以使用 `CONTENTS` 过程或 `DATASETS` 过程中的 `CONTENTS` 语句生成有关数据集的信息列表，包括现有索引列表。一个数据集的所有索引都存储在一个单独文件中，该文件与数据集分离，但名称相同。\n\
  \n7. 正确答案：b 索引可以提高 SAS 访问数据集中某些观测值的效率。然而，索引并不总是有用。SAS 不会使用索引来处理子集 `IF` 语句，或其他 SAS\
  \ 认为不使用索引处理可能更高效的其他语句。\n\n# 第 14 章：垂直合并数据\n\n1. 正确答案：c 当使用 `FILENAME` 语句将文件引用（fileref）分配给多个原始数据文件时，文件列表必须包含在一对括号内。指定的每个文件名必须包含在引号中。\n\
