  \ | 是 | 否 |\n| 是语句 | 否 | 是 |\n| 可以作为语句的一部分 | 是 | 是（等等，不是，`CALL` 是语句） |\n| 以 `CALL`\
  \ 开头 | 否 | 是 |\n\n有关 `PROC FCMP` 的更多信息，请参阅《Base SAS 过程指南》中的“PROC FCMP”。\n\n# 测验\n\
