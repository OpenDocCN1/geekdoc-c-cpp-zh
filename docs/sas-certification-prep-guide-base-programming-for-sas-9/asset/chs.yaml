  \n## %QUPCASE 函数\n\n如果参数包含特殊字符、助记操作符或宏触发器，您需要使用 `%QUPCASE` 函数。`%QUPCASE` 的语法与 `%UPCASE`\
  \ 函数相同，其工作原理与 `%UPCASE` 相同，不同在于它还会掩盖函数结果中的助记操作符和特殊字符（包括宏触发器）。\n\n## 示例\n\n这些语句显示了\
  \ `%UPCASE` 和 `%QUPCASE` 生成的结果：\n\n```\n%let a=begin;\n%let b=%nrstr(&a);\n\n%put\
  \ UPCASE produces: %upcase(&b);\n%put QUPCASE produces: %qupcase(&b);\n```\n\n在第一个\
  \ `%PUT` 语句中，宏引用 `&b` 解析为 `&a`，由于 `%UPCASE` 函数的作用，它被转换为 `&A`。由于解析后的值包含宏触发器，它被视为宏变量引用，因此\
  \ `&A` 解析为值 `begin`。第二个 `%PUT` 语句使用了 `%QUPCASE` 函数，该函数掩盖了宏变量 `b` 解析值中的 ampersand\
  \ 符号（&），使得该值不会被视为另一个宏变量引用。执行这些语句会在 SAS 日志中产生以下消息。\n\n表 9.9 SAS 日志\n\n| |\n\n```\n\
  6    %let a=begin;\n7    %let b=%nrstr(&a);\n8\n9    %put UPCASE produces: %upcase(&b);\n\
  UPCASE produces: begin\n10   %put QUPCASE produces: %qupcase(&b);\nQUPCASE produces:\
  \ &A\n```\n\n| |\n\n## %SUBSTR 函数\n\n`%SUBSTR` 函数允许您从宏变量的值中提取字符字符串的一部分。\n\n| `%SUBSTR`\
  \ 函数的通用形式： | `%SUBSTR (argument, position<,n>)` | 以下是该语法的说明：`argument` 是一个字符字符串或文本表达式，从中返回子字符串。`position`\
  \ 是一个整数或产生整数的表达式（文本、逻辑或数学表达式），用于指定子字符串中第一个字符的位置。`n` 是可选的整数或产生整数的表达式（文本、逻辑或数学表达式），用于指定子字符串中的字符数。\
  \ |\n\n注意：如果 `n` 的长度大于 `argument` 中 `position` 之后的字符数，`%SUBSTR` 会发出警告消息并返回从 `position`\
  \ 到字符串末尾的子字符串。如果未指定 `n`，`%SUBSTR` 也会返回从 `position` 到字符串末尾的子字符串。例如，假设宏变量 `date` 的值为\
  \ `05JAN2002`。\n\n*   代码 `%substr(&date,3)` 返回值 `JAN2002`。\n*   代码 `%substr(&date,3,3)`\
  \ 返回值 `JAN`。\n*   代码 `%substr(&date,3,9)` 返回值 `JAN2002` 并产生警告消息。\n\n`position` 和\
  \ `n` 的值也可以产生整数的数学表达式的结果。例如，`%substr(&var,%length(&var)-1)` 返回宏变量 `var` 值的最后两个字符。注意：`%LENGTH`\
  \ 函数接受字符字符串或文本表达式作为参数。如果参数是字符字符串，`%LENGTH` 返回字符串的长度。如果参数是文本表达式，`%LENGTH` 返回解析值的长度。如果参数为空值，`%LENGTH`\
  \ 返回 0。\n\n## 示例\n\n假设您想打印一份自本月初以来所有课程的报告。您可以使用 `%SUBSTR` 函数来确定月份。\n\n\n\n\n`%SCAN`\
  \ 函数允许你从宏变量的值中提取单词。\n\n| 通用格式，%SCAN` 函数：`%SCAN (argument, n<,delimiters>)` | 以下是该语法的解释：\
  \ |\n| :--- | :--- |\n| `argument` 由常量文本、宏变量引用、宏函数或宏调用组成。 | `n` 是一个整数或产生整数的文本表达式，用于指定要返回单词的位置。如果\
  \ `n` 大于 `argument` 中的单词数，函数将返回空字符串。 |\n| `delimiters` 指定一个可选的列表，该列表由一个或多个字符组成，用于分隔“单词”或产生一个或多个字符的文本表达式。\
  \ |\n\n注意：如果 `argument` 包含逗号，你必须使用引号函数将 `argument` 括起来。同样地，为了将单个空格或单个逗号作为唯一分隔符，你必须将该字符封装在\
  \ `%STR` 函数中。`%SCAN` 识别的分隔符在 ASCII 和 EBCDIC 系统之间有所不同。如果你省略了 `delimiters`，SAS 将以下字符视为默认分隔符：\n\
  \n- ASCII 系统：`blank . < ( + & ! $ * ) ; ^ - / , % |`\n- EBCDIC 系统：`blank . < ( +\
  \ | & ! $ * ) ; ¬ - / , % ¦ ¢`\n\n如果 `delimiters` 列表包含你系统的任何默认分隔符，则剩余的默认分隔符将被视为文本。\n\
  \n## 示例\n\n你可以使用 `PROC DATASETS` 配合 `%SCAN` 函数和 `SYSLAST` 宏变量来调查最近创建的数据集的结构：\n\n\
  ```\ndata work.thisyear;\n   set sasuser.schedule;\n    where year(begin_date) =\n\
  \          year(\"&sysdate9\"d);\nrun;\n\n%let libref=%scan(&syslast,1,.);\n%let\
  \ dsname=%scan(&syslast,2,.);\nproc datasets lib=&libref nolist;\ntitle \"Contents\
  \ of the Data Set &syslast\";\n   contents data=&dsname;\nrun;\nquit;\n```\n\n![contents\
  \ of WORK.THISYEAR](img/m50-46-g1.png)\n\n## %QSCAN 函数\n\n如果 `argument` 包含特殊字符、助记符或宏触发器，你需要使用\
  \ `%QSCAN` 函数。`%QSCAN` 的语法与 `%SCAN` 函数相同，其工作方式与 `%SCAN` 相同，但它还会掩码函数结果中的助记符和特殊字符（包括宏触发器）。\n\
  \n## 示例\n\n这些语句显示了 `%SCAN` 和 `%QSCAN` 产生的结果：\n\n```\n%let a=one;\n%let b=two;\n\
  %let c=%nrstr(&a*&b);\n\n%put C: &c;\n%put With SCAN: %scan(&c,1,*);\n%put With\
  \ QSCAN: %qscan(&c,1,*);\n```\n\n执行这些语句会在 SAS 日志中产生以下消息。\n\n表 9.12 SAS 日志\n\n| |\n\
  \n```\n47   %let a=one;\n48   %let b=two;\n49   %let c=%nrstr(&a*&b);\n50\n51  \
  \ %put C: &c;\nC: &a*&b\n52   %put With SCAN: %scan(&c,1,*);\nWith SCAN: one\n53\
  \   %put With QSCAN: %qscan(&c,1,*);\nWith QSCAN: &a\n```\n\n | |\n\n# 在宏变量中使用 SAS\
  \ 函数\n\n## %SYSFUNC 函数\n\n你已经学习了通过使用自动宏变量 `SYSDATE9` 和 `SYSTIME` 可以在标题中包含日期和时间：\n\
  \n```\ntitle1 \"Report Produced on &sysdate9\";\ntitle2 \"at &systime\";\n```\n\n\
  ![Report Produced on &sysdate9](img/m50-50-g1.png) `SYSDATE9` 代表 SAS 会话启动时的日期，`SYSTIME`\
  \ 代表 SAS 会话启动的时间。假设你希望以其他格式查看日期，或者想查看当前的日期或时间。你可以使用 `%SYSFUNC` 函数作为宏机制的一部分执行其他 SAS\
  \ 函数。\n\n| 通用格式，%SYSFUNC` 函数：`%SYSFUNC (function (argument(s)) <,format>)` | 以下是该语法的解释：\
  \ |\n| :--- | :--- |\n| `function` 是要执行的 SAS 函数名称。 |\n| `argument(s)` 是函数使用的一个或多个参数。使用逗号分隔所有参数。参数可以是宏变量引用，也可以是产生函数参数的文本表达式。\
  \ |\n| `format` 是应用到函数结果的可选格式。默认情况下，数值结果将使用 `BEST12.` 格式转换为字符字符串，而字符结果将按原样使用，不进行格式化或翻译。\
  \ |\n\n所有的 SAS 函数都可以配合 `%SYSFUNC` 使用，但例外：\n\n| ALLCOMB | LEXCOMB |\n| :--- | :---\
  \ |\n| ALLPERM | LEXCOMBI |\n| DIF | LEXPERK |\n| DIM | LEXPERM |\n| HBOUND | MISSING\
  \ |\n| INPUT | PUT |\n| IORCMSG | RESOLVE |\n| LAG | SYMGET |\n| LBOUND | 变量信息函数\
  \ |\n\n注意：变量信息函数包括如 `VNAME` 和 `VLABEL` 等函数。完整的函数列表请参阅“SAS 函数和例程”（Functions and Routines）。注意：可以使用\
  \ `INPUTC` 或 `INPUTN` 函数替换 `INPUT` 函数。同样，可以使用 `PUTC` 或 `PUTN` 函数替换配合 `%SYSFUNC`\
  \ 的 `PUT` 函数。\n\n## 示例\n\n假设在 11 月 4 日（周五）提交了以下代码：\n\n```\ntitle \"Report Produced\
  \ on &sysdate9\";\n```\n\n## 使用 QSCAN\n\n如果参数包含特殊字符、助记符或宏触发器，你需要使用 `%QSCAN` 函数。`%QSCAN`\
  \ 的语法与 `%SCAN` 函数相同，其工作方式与 `%SCAN` 相同，但它还会掩码函数结果中的助记符和特殊字符（包括宏触发器）。\n\n## 示例\n\n\
  假设你想创建一个包含当前日期的报告。你可以使用语句：\n\n```\ntitle \"Report Produced on %sysfunc(today(),date.)\"\
  ;\n```\n\n这将导致标题为：\n\n```\nReport Produced on November 4, 2011\n\n```\n\n# 文本引用\n\
  \n## 概述\n\n你可以在程序的任何地方引用宏变量。某些应用程序可能需要将宏变量引用与前导文本（`text&variable`）、后缀文本（`&variabletext`）或相邻宏变量（`&variable&variable`）结合以构建新标记。在组合宏变量引用和文本时，记住\
  \ SAS 如何解释标记非常重要。当单词扫描器检测到新标记标记或标记后的空格时，标记结束。你可以将文本放在宏变量引用之前以构建新标记。例如，假设数据集存储在 SAS\
  \ 库中，使用命名规范 `Yyymon`，其中 `yy` 是两位年份（如 02 或 01），`mon` 是三个字母月份（如 JUN 或 AUG）。你可以编写程序使用宏变量来构建数据集名称的月份部分。\n\
  \n```\n%let month=jan;\nproc chart data=sasuser.y02&month;\n   hbar week / sumvar=sale;\n\
  run;\nproc plot data=sasuser.y02&month;\n   plot sale*day;\nrun;\n```\n\n表 9.14\
  \ 替换后的代码\n\n| |\n\n```\nproc chart data=sasuser.y02jan;\n    hbar week / sumvar=sale;\n\
  run;\nproc plot data=sasuser.y02jan;\n    plot sale*day;\nrun;\n```\n\n\n\n\n你可以引用之间没有空格的宏变量来构建新的令牌（tokens）。例如，你可以修改之前的程序，以便允许月份和年份被替换：\n\
  \n```\n%let year=02;\n%let month=jan;\nproc chart data=sasuser.y&year&month;\n \
  \  hbar week / sumvar=sale;\nrun;\nproc plot data=sasuser.y&year&month;\n   plot\
  \ sale*day;\nrun;\n```\n\n表 9.15 替换后的代码\n\n```\nproc chart data=sasuser.y02jan;\n\
  \    hbar week / sumvar=sale;\nrun;\nproc plot data=sasuser.y02jan;\n    plot sale*day;\n\
  run;\n```\n\n生成的程序与上一个示例中的程序相同。也就是说，编译器在这这两个示例看到的是相同的代码。只要宏变量名称仍然能够被正确分词，你就可以在宏变量引用之后立即放置文本。例如，你可以修改之前的程序以替换分析变量的名称：\n\
  \n```\n%let year=02;\n%let month=jan;\n%let var=sale;\nproc chart data=sasuser.y&year&month;\n\
  \   hbar week / sumvar=&var;\nrun;\nproc plot data=sasuser.y&year&month;\n   plot\
  \ &var*day;\nrun;\n```\n\n表 9.16 替换后的代码\n\n```\nproc chart data=sasuser.y02jan;\n\
  \    hbar week / sumvar=sale;\nrun;\nproc plot data=sasuser.y02jan;\n    plot sale*day\n\
  run;\n```\n\n生成的程序与前两个示例中的程序相同。也就是说，尽管你更改了所提交的代码，但你并没有更改编译器看到的代码。\n\n## 宏变量名称中的分隔符\n\
  \n有时，你可能希望将宏变量名称置于特殊字符以外的文本之前。例如，你可能想修改之前的程序，以便于在 Base SAS 软件的 `CHART` 和 `PLOT`\
  \ 过程与 SAS/GRAPH 软件的 `GCHART` 和 `GPLOT` 过程之间切换。\n\n```\n/* GRAPHICS 应该是 null 或 G\
  \ */\n%let graphics=g;\n%let year=02;\n%let month=jan;\n%let var=sale;\nproc &graphicschart\
  \ data=sasuser.y&year&month;\n   hbar week / sumvar=&var;\nrun;\nproc &graphicsplot\
  \ data=sasuser.y&year&month;\n   plot &var*day;\nrun;\n```\n\n写入 SAS 日志的消息显示了该程序存在的问题。\n\
  \n表 9.17 SAS 日志\n\n```\n13     %let graphics=g;\n14     %let year=02;\n15     %let\
  \ month=jan;\n16     %let var=sale;\n17     proc &graphicschart data=sasuser.y&year&month;\n\
  \            -\n            10\n\nWARNING: Apparent symbolic reference GRAPHICSCHART\
  \ not resolved.\n\nERROR 10-205: Expecting the name of the procedure to be executed.\n\
  ```\n\nSAS 将宏变量名解释为 `graphicschart` 而不是 `graphics`，因为宏变量引用和后续文本之间没有分隔符。扫描在遇到不能作为名称部分的特殊字符时，会识别宏变量名称的结束。换句话说，特殊字符充当了分隔符的作用。例如，点（`.`）是一个特殊字符，它被视为宏变量引用的一部分，并且在宏变量解析时不会出现。要修正上一个示例中的问题，你需要在宏变量\
  \ `graphics` 的引用之后添加点。\n\n```\n %let graphics=g;\n %let year=02;\n %let month=jan;\n\
  \ %let var=sale;\n proc &graphics.chart data=sasuser.y&year&month;\n   hbar week\
  \ / sumvar=&var;\nrun;\nproc &graphics.plot data=sasuser.y&year&month;\n   plot\
  \ &var*day;\nrun;\n```\n\n当执行这些 SAS 语句时：\n- 单词扫描器将 `&graphics.` 处理为引用\n- 宏变量 `graphics`\
  \ 的值返回到输入栈\n- 单词扫描器将 `gchart` 处理为一个单一令牌。\n\n表 9.18 替换后的代码\n\n```\nproc chart data=sasuser.y02jan;\n\
  \   hbar week / sumvar=sale;\nrun;\nproc plot data=sasuser.y02jan;\n   plot sale*day;\n\
  run;\n```\n\n我们可以扩展这个示例，并进一步修改之前的程序，包含一个用于定义库引用（libref）的宏变量：\n\n```\n%let lib=sasuser;\n\
  %let graphics=g;\n%let year=02;\n%let month=jan;\n%let var=sale;\nlibname &lib 'SAS-data-library';\n\
  proc &graphics.chart data=&lib.y&month;\n   hbar week / sumvar=&var;\nrun;\nproc\
  \ &graphics.plot data=&lib.y&month;\n   plot &var*day;\nrun;\n```\n\n然而注意，这段代码并没有执行预期的替换。\n\
  \n表 9.19 替换后的代码\n\n```\nlibname sasuser 'SAS-data-library';\nproc chart data=sasuserery2jan;\n\
  \   hbar week / sumvar=sale;\nrun;\nproc plot data=sasuserery2jan;\n   plot sale*day;\n\
  run;\n```\n\n`&lib` 之后的点被解释为分隔符。你需要在分隔符之后使用第二个点来提供必要的令牌：\n\n```\n%let lib=sasuser;\n\
  ...\nlibname &lib 'SAS-data-library';\nproc &graphics.chart data=&lib..y&month;\n\
  ...\nproc &graphics.plot data=&lib..y&month;\n```\n\n第一个点被视为分隔符，而第二个点被视为文本。\n\n\
  表 9.20 替换后的代码\n\n```\nproc chart data=sasuser.y02jan;\n...\nproc plot data=sasuserery2jan;\n\
  ```\n\n## 总结\n\n## 总结\n\n### 基础概念\n宏变量可以提供各种信息，从操作系统信息到 SAS 会话信息，甚至是任何文本字符串。如果你在程序中使用宏变量，更新对变量、数据集或文本字符串的多次引用是一个简单的过程。宏变量是\
  \ SAS 宏功能的一部分，该工具用于扩展和自定义 SAS，并减少你为了执行常用操作必须输入的文本量。宏变量存储在符号表中。存储在全局符号表中的值总是可用的。为了在程序中替换宏变量的值，你需要在宏变量名称前加上符号符号（`&`）。你可以在数据行之外任何地方引用宏变量。\n\
  \n### 使用自动宏变量\nSAS 提供了包含计算环境信息的自动宏变量。自动宏变量在调用 SAS 时创建。许多此类变量具有固定值，在 SAS 会话期间保持不变。其他变量则根据提交的语句自动更新。\n\
  \n### 使用用户定义宏变量\n你可以使用 `%LET` 语句创建并定义自己的宏变量。`%LET` 语句允许为你的新宏变量赋值并将其存储在全局符号表中。宏变量的值是字符字符串；对于前后空格，值按其出现的形式存储。\n\
  \n### 处理宏变量\n提交时，SAS 程序进入称为输入栈的内存区域。从那里，单词扫描器将程序分成小的令牌，并将其传递给相应的编译器进行执行。某些令牌序列是宏触发器，会被发送到宏处理器进行解析。一旦宏变量被宏处理器解析，存储的值将回写到程序中，并继续单词扫描。\n\
  \n### 在 SAS 日志中显示宏变量值\n你可以使用 `SYMBOLGEN` 选项来监控替换宏变量引用的值。你还可以使用 `%PUT` 语句将包含宏变量值的消息写入\
  \ SAS 日志。\n\n\n\n\n可以使用宏字符函数对宏变量的值进行字符字符串操作。`%UPCASE` 函数允许你将值从小写更改为大写。`%QUPCASE`\
  \ 函数的作用与 `%UPCASE` 相同，不同之处在于它还会掩码函数结果中的特殊字符和助记操作符。`%SUBSTR` 函数允许你从宏变量值中提取字符串的部。`%QSUBSTR`\
  \ 函数的作用与 `%SUBSTR` 相同，不同之处在于它还会掩码结果中的特殊字符和助记操作符。`%INDEX` 函数允许你确定字符字符串在源数据中第一个字符出现的位置。使用\
  \ `%SCAN` 函数，你可以从宏变量的值中提取单词。`%QSCAN` 函数的作用与 `%SCAN` 相同，不同之处在于它还会掩码结果中的特殊字符和助记操作符。\n\
  \n## 在宏变量中使用 SAS 函数\n\n你可以使用 `%SYSFUNC` 函数来执行其他 SAS 函数。`%QSYSFUNC` 函数的作用与 `%SYSFUNC`\
  \ 函数相同，不同之处在于它还会掩码函数结果中的特殊字符和助记操作符。\n\n## 将宏变量引用与文本结合\n\n你可能需要将宏变量引用与其他文本结合。你可以将文本紧放在宏变量引用的之前或之后。你还可以结合两个宏变量引用以创建一个新的标记。在结合宏变量引用与文本时，你可能需要使用分隔符。\n\
  \n## 示例程序\n\n### 使用 `%LET` 语句创建宏变量\n\n```\noptions symbolgen; \n%let year=2002;\n\
  proc print data=sasuser.schedule;\n   where year(begin_date)=&year;\n   title \"\
  Scheduled Classes for &year\";\nrun;\nproc means data=sasuser.all sum;\n   where\
  \ year(begin_date)=&year;\n   class location;\n   var fee;\n   title1 \"Total Fees\
  \ for &year Classes\";\n   title2 \"by Training Center\";\nrun;\n```\n\n### 使用自动宏变量\n\
  \n```\nfootnote1 \"Created &systime &sysday, &sysdate9\";    \nfootnote2 \"on the\
  \ &sysscp system using Release &sysver\";      \ntitle \"REVENUES FOR DALLAS TRAINING\
  \ CENTER\";      \nproc tabulate data=sasuser.all(keep=location course_title fee);\
  \         \n   where upcase(location)=\"DALLAS\";\n        class course_title;\n\
  \        var fee;\n        table course_title=\" \" all=\"TOTALS\",\n          \
  \    fee=\" \"*(n*f=3\\. sum*f=dollar10.)\n              / rts=30 box=\"COURSE\"\
  ;\nrun;\n```\n\n### 在文本之后立即插入宏变量\n\n```\n%let year=02;\n%let month=jan;\nproc chart\
  \ data=sasuser.y&year&month;\n   hbar week / sumvar=sale;\nrun;\nproc plot data=sasuser.y&year&month;\n\
  \  plot sale*day;\nrun;\n```\n\n### 在文本之前立即插入宏变量\n\n```\n%let graphics=g;\n%let\
  \ year=02;\n%let month=jan;\n%let var=sale;\nproc &graphics.chart data=sasuser.y&year&month;\n\
  \  hbar week / sumvar=&var;\nrun;\nproc &graphics.plot data=sasuser.y&year&month;\n\
  \  plot &var*day;\nrun;\n```\n\n## 需要事项的点\n\n- 宏变量可以使你的程序更具重用性和动态性。\n- 当你向 SAS 提交代码时，宏变量引用由宏处理器解析，其值将替换到你的程序中。\n\
  - 你可以使用 `%PUT` 语句将任何文本（包括解析后的宏变量）写入 SAS 日志中。\n 如果 如果你在双引号内引用宏变量，则必须使用双引号。包含在单引号中的宏变量引用无法被解析。\n\
  - 大多数宏字符函数都有相应的函数（例如 `%QSUBSTR` 和 `%QSCAN`），这些函数也会掩码函数结果中的特殊字符和助记操作符。\n\n# 测验\n\n\
  为每个问题选择最佳答案。完成测试后，使用附录中的答案检查你的答案。\n\n1. 下列哪个陈述是错误的？\n\n    1.  宏变量可以在 SAS 程序中除数据行以外的任何地方定义和引用。\n\
  \    2.  宏变量始终由用户定义，其值在被用户更改之前保持保持不变。\n    3.  宏变量是独立于 SAS 数据集的文本字符串。\n    4.  宏变量的值长度可达\
  \ 65,534 个字符。\n\n2. 下列哪个 `TITLE` 语句正确引用了宏变量 `month`？\n\n    1. ``` ```\n       title\
  \ \"Total Sales for '&month' \";\n       ```\n    2. ``` ```\n       title \"Total\
  \ Sales for 'month'\";\n       ```\n    3. ``` ```\n       title \"Total Sales for\
  \ &month\";\n       ```\n    4. ``` ```\n       title Total Sales for \"&month\"\
  ;\n       ```\n\n3. 下列哪个陈述在尝试在 SAS 日志显示宏变量 `month` 的值时会生成错误消息？\n\n    1. ``` ```\n\
  \       options &month;\n       ```\n    2. ``` ```\n       %PUT &month;\n     \
  \  ```\n    3. ``` ```\n       options symbolgen;\n       ```\n    4. ``` ```\n\
  \       %PUT the macro variable MONTH has the value &month.;\n       ```\n\n4. 哪个语句创建名为\
  \ `location` 值为 `storage` 的宏变量？\n\n    1. ``` ```\n       &let location = storage;\n\
  \       ```\n    2. ``` ```\n       let location = storage;\n       ```\n    3.\
  \ ``` ```\n       %let location = \"storage\";\n       ```\n    4. ``` ```\n   \
  \    %let location = storage;\n       ```\n\n5. 这些语句为宏变量 `reptitle` 赋值了什么值：\n\n\
  \    ```\n%let area = \"Southeast\";\n%let reptitle = *&area*;\n    ```\n\n    1.\
  \ `Sales Report for Southeast`\n    2. `Sales Report for \"Southeast\"`\n    3.\
  \ `*Sales Report for Southeast*\n    4. `* Southeast`\n\n6. 假设你今天开始 SAS 会话，哪个语句正确将宏变量\
  \ `currdate` 设置为今天的日期：\n\n    1. ``` ```\n       %let currdate = %sysfunc(today(),worddate.);\n\
  \       ```\n    2. ``` ```\n       %let currdate = &sysdate;\n       ```\n    3.\
  \ ``` ```\n       %let currdate = %sysfunc(date());\n       ```\n    4. 以上都是\n\n\
  7. 宏字符函数\n\n    1. 可用于操作宏变量值的字符串。\n    2. 与对应的函数语法相同并产生相似的结果。\n    3. 以上都是\n   \
  \ 4. 以上都不是\n\n8. SAS 识别的四种标记类型为\n\n    1. 表达式、字面量、名称和特殊字符。\n    2. 字面量、名称、数字和特殊字符。\n\
  \    3. 表达式、名称、数字和特殊字符。\n    4. 表达式、字面量、数字和特殊字符。\n\n9. 定义宏变量的结果是什么？\n\n    ```\n\
  %let month1 = June;\n%let month2 = July;\n%let period1 = &month1&month2;\n%let period2\
  \ = May&month1;\n%let period3 = &month2.Aug;\n    ```\n\n    1. month1 Junemonth2\
  \ Julyperiod1 June Julyperiod2 May Juneperiod3 July Aug\n    2. month1 Junemonth2\
  \ Julyperiod1 JuneJulyperiod2 MayJuneperiod3 July.Aug\n    3. month1 Junemonth2\
  \ Julyperiod1 JuneJulyperiod2 MayJuneperiod3 JulyAug\n    4. month1 Junemonth2 Julyperiod1\
  \ junejulyperiod2 Mayjuneperiod3 julyaug\n\n10. 下列哪个语句正确产生一个标题，其中当前日期左对齐以删除多余的空格？\n\
  \n    1. ``` ```\n       title \"Report for %sysfunc(left(%sysfunc(today(),worddate.)))\"\
  ;\n       ```\n    2. ``` ```\n       title \"Report for %sysfunc(left(today(),\
  \ worddate.))\";\n       ```\n    3. ``` ```\n       title \"Report for %sysfunc(left(%qsysfunc(today(),worddate.)))\"\
  ;\n       ```\n    4. ``` ```\n       title \"Report for %left(today(), worddate.))\"\
  ;\n       ```\n\n\n\n\n\n## 概述\n\n## 引言\n由于宏功能在 SAS 程序执行之前就会完成其任务，因此宏功能提供的信息不依赖于\
  \ SAS 程序执行期间访问或计算出的值。然而，有时有必要在 SAS 程序的执行期间访问或创建宏变量。有几种方法可以使宏功能在执行时创建或访问宏变量。在本章中，你将学习在执行以下内容使用宏变量：\n\
  * 一个 `DATA` 步骤\n* 一个 `PROC SQL` 步骤\n* 一个 `SCL` 程序。\n\n![macro variable](img/m51-1-g1.png)\n\
  \n# 在 DATA 步骤执行期间创建宏变量\n\n## 概述\n在许多应用程序中，你需要在 `DATA` 步骤执行期间创建宏变量。你可能需要根据以下内容创建宏变量并为其赋值：\n\
  * `SAS` 数据集或外部文件中的数据值\n* 自身的*编程逻辑\n* 计算出的值。\n\n例如，假设你想根据 `Sasuser.All` 数据集中的数据创建一个报告，列出参加了特定课程的学生。假设你想在报告中包含一个脚注，以指示是否有学生未缴纳学费。以下程序使用\
  \ `SAS` 编程逻辑来确定给宏变量 `foot` 分赋值什么值。然后在程序稍后的 `FOOTNOTE` 语句中引用 `foot`。\n\n```\noptions\
  \ symbolgen pagesize=30;\n%let crsnum=3;\ndata revenue;\n   set sasuser.all end=final;\n\
  \   where course_number=&crsnum;\n   total+1;\n   if paid='Y' then paidup+1;\n \
  \  if final then do;\n      put total= paidup=; /* Write information\n         \
  \                   to the log. */\n      if paidup<total then do; \n         %let\
  \ foot=Some Fees Are Unpaid;\n      end; \n      else do; \n         %let foot=All\
  \ Students Have Paid; \n      end; \n   end;\nrun;\n\nproc print data=revenue;\n\
  \   var student_name student_company paid;\n   title \"Payment Status for Course\
  \ &crsnum\";\n   footnote \"&foot\";\nrun;\n```\n\n运行该程序产生如下报告：![Payment status\
  \ for course 3](img/m51-2-g1.png)尽管你可以看到几个学生仍有未缴费用，但脚注显示所有学生都已缴。显然，这个脚注是错误的。也就是说，宏变量\
  \ `foot` 在不应该解析的时候解析为了值 `All Students Have Paid`（所有学生已缴）。查看下面的示例。\n\n## 示例\n为了理解此示例中的问题，你应该考虑宏变量处理是如何与\
  \ `SAS` 处理协同工作的。请记住，当宏语言语句和 SAS 语言语句出现在同一个步骤时，宏处理器会在执行任何 SAS 语言语句之前执行宏语言语句。请记住，你想根据\
  \ `Sasuser.All` 数据集中的数据创建一个报告，列出参加了特定课程的学生，并且你想在报告中包含一个脚注，以指示是否有学生未缴纳学费。以下程序使用 `SAS`\
  \ 编程逻辑来确定给宏变量 `foot` 分赋值什么值。然后在程序稍后的 `FOOTNOTE` 语句中引用 `foot`。\n\n```\noptions symbolgen\
  \ pagesize=30;\n%let crsnum=3;\ndata revenue;\n   set sasuser.all end=final;\n \
  \  where course_number=&crsnum;\n   total+1;\n   if paid='Y' then paidup+1;\n  \
  \ if final then do;\n      put total= paidup=; /* Write information\n          \
  \                  to the log. */\n      if paidup<total then do;\n         %let\
  \ foot=Some Fees Are Unpaid;\n      end;\n      else do;\n         %let foot=All\
  \ Students Have Paid;\n      end;\n   end;\nrun;\n\nproc print data=revenue;\n \
  \  var student_name student_company paid;\n   title \"Payment Status for Course\
  \ &crsnum\";\n   footnote \"&foot\";\nrun;\n```\n\n在这个示例中，`DATA` 步骤内部第一个 `%LET`\
  \ 语句一旦单词扫描器（word scanner）遇到它，就会传递给宏处理器。宏处理器在符号表中创建一个宏变量 `foot` 并分配值 `Some Fees Are\
  \ Unpaid`。单词扫描器继续读取程序并将第二个 `%LET` 语句传递给宏处理器。这次，宏处理器在符号表中为 `foot` 重新分配值 `All Students\
  \ Have Paid`。当遇到 `DATA` 步骤中的 `RUN` 语句时，`SAS` 识别到该步骤已完成。由于 `%LET` 语句始终由宏处理器处理，因此\
  \ `foot` 的值始终是最后一个 `%LET` 语句分配的值。以下是替换后的代码表示：\n\n表 10.1\n\n```\ndata\n   set sasuser.all\
  \ end=final;\n   where course_number=3;\n   total+1;\n   if paid='Y' then paidup+1;\n\
  \   if final then do;\n      put total= paidup=;\n      if paidup<total then do;\n\
  \      end;\n      else do;\n      end;\n   end;\nrun;\nproc print data=revenue;\n\
  \   var student_name student_company paid;\n   title \"Payment Status for Course\
  \ 3\";\n   footnote \"All Students Have Paid\";\nrun;\n```\n\n |我们可以通过以下信息解决这个问题。\n\
  \n## SYMPUT 程\n`DATA` 步骤提供了函数和一种 `CALL` 程，允许你在正在执行的 `DATA` 步骤和宏处理器之间传输信息。你可以使用 `SYMPUT`\
  \ 程创建宏变量，并为其分配 `DATA` 步骤中可用的任何值。\n\n`SYMPUT` 程的一般形式：`CALL SYMPUT(macro-variable,text);`\n\
  此处语法解释如下：`macro-variable` 被分配 `text` 的字符值。`macro-variable` 和 `text` 都可以指定为\n* 用引号括的字面量\n\
  * `DATA` 步骤变量\n* `DATA` 步骤表达式。\n\n注意：如果 `macro-variable` 已经存在，`text` 的值将替换旧值。当你在\
  \ `DATA` 步骤中使用 `SYMPUT` 程创建宏变量时，在 `DATA` 步骤执行之前，宏变量实际上并没有创建并分配值。因此，在导致 `DATA` 步骤执行的步骤边界之前，你无法通过在前加\
  \ & 符号成功引用用 `SYMPUT` 程创建的宏变量。在接下来的章节中，你将看到 `SYMPUT` 程在不同情况下的用法示例。\n\n### 使用字面量 SYMPUT\n\
  在 `SYMPUT` 程中，你对以下内容使用字面字符串：\n* 第一个参数指定宏变量名称的精确名称\n* 第二个参数指定要分配给宏变量的精确字符值。\n\n要在\
  \ `SYMPUT` 程中使用字面量，请将字面字符串括在引号中。`CALL SYMPUT('macro-variable', 'text')`\n\n\n\n\n\
  \n回想之前的示例，其中你想要根据 DATA 步执行期间生成的值，为宏变量 `foot` 条件地赋值一个值。你可以使用 `SYMPUT` 程，并将字面字符串作为两个参数来实现这一目标。\n\
  \n```\noptions symbolgen pagesize=30;\n%let crsnum=3;\ndata revenue;\n   set sasuser.all\
  \ end=final;\n   where course_number=&crsnum;\n   total+1;\n   if paid='Y' then\
  \ paidup+1;\n   if final then do;\n   if paidup<total then do;\n      call symput('foot','Some\
  \ Fees Are Unpaid');\n   end;\n   else do;\n      call symput('foot','All Students\
  \ Have Paid');\n   end;\nend;\nrun;\n\nproc print data=revenue;\n   var student_name\
  \ student_company paid;\n   title \"Payment Status for Course &crsnum\";\n   footnote\
  \ \"&foot\";\nrun;\n```\n\n这一次，赋值给 `foot` 的值是 `Some Fees Are Unpaid` 或 `All Students\
  \ Have Paid`，取决于 DATA 步变量 `Paidup` 的值，因为赋值是在 DATA 步执行期间完成的。当你提交这段代码时，将得到如下输出。![Payment\
  \ status for course 3](img/m51-6-g1.png)\n\n## 在 DATA 步变量中使用 SYMPUT\n\n你可以通过将 DATA\
  \ 步变量名作为 `SYMPUT` 程的第二个参数，将 DATA 步变量的值赋值给宏变量。要在 `SYMPUT` 程中将 DATA 步变量作为宏变量的值，你需要将\
  \ DATA 步变量的名称放在宏变量名称之后，并用逗号分隔。不要给 DATA 步变量名加上引号。\n\n`CALL SYMPUT('macro-variable',DATA-step-variable);`\
  \ 这种形式的 `SYMPUT` 程创建一个名为 `macro-variable` 的宏变量，并将 `DATA-step-variable` 的当前值赋值给它。当你将\
  \ DATA 步变量作为第二个参数时：\n\n*   接收的宏变量最多可以分配 32,767 个字符。\n*   DATA 步变量值包含的任何前导或尾尾空格都会存储在宏变量中。\n\
  *   数值型变量的值会自动转换为字符型值，并使用 `BEST12.` 格式。\n\n**注意**：如果你给 DATA 步变量名加上引号，SAS 会将该名称解释为字面值而非变量名，导致\
  \ DATA 步变量的值无法被解析。\n\n## 示例\n\n再次假设你想要创建一个关于注册了某特定课程的学生的报告。这次，假设你想添加一个包含课程标题和课程编号的标题，并想包含一个总结多少学生已交费情况的脚注。在这个示例中，名为\
  \ `paidup` 的 DATA 步变量记录了已缴费的人数，名为 `total` 的 DATA 步变量记录了注册该课程的总人数。创建宏变量来记录 `paidup`\
  \ 的值、`total` 的值以及 `Course_title` 的值。这些宏变量在程序的后续被引用。\n\n```\n%let crsnum=3;\ndata\
  \ revenue;\n   set sasuser.all end=final;\n   where course_number=&crsnum;\n   total+1;\n\
  \   if paid='Y' then paidup+1;\n   if final then do;\n      call symput('numpaid',paidup);\n\
  \      call symput('numstu',total);\n      call symput('crsname',course_title);\n\
  \   end;\nrun;\nproc print data=revenue noobs;\n   var student_name student_company\
  \ paid;\n   title \"Fee Status for &crsname (#&crsnum)\";\n   footnote \"Note: &numpaid\
  \ Paid out of &numstu Students\";\nrun;\n```\n\n这一次，脚注显示了学生缴费人数的正确信息。![Fee status\
  \ for local area networks (#3)](img/m51-8-g1.png)\n\n## 在 DATA 步表达式中使用 CALL SYMPUT\n\
  \n如果你使用列表输出（listing output）而不是 HTML 输出运行上一个示例，你将在标题的课程标题和课程编号之间以及脚注中看到额外的空格。\n\n\
  表 10.2 SAS 列表输出\n\n```\n Fee Status for Local Area Networks       (#3)         \
  \         \n\n Student_Name                Student_Company                  Paid\n\
  \n Bills, Ms. Paulette         Reston Railway                    Y\n Chevarley,\
