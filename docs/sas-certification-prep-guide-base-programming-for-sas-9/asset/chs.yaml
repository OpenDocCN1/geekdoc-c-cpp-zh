  \n4. 正确答案：b `NOT NULL` 完整性约束指定数据是必须的且不能为空（缺失）值。\n\n5. 正确答案：d `DELETE` 语句从表中删除 `WHERE`\
  \ 子句指定的行。如果没有指定 `WHERE` 子句，则删除所有行。`DROP TABLE` 语句删除整个表；选项 c 中的语法无效。\n\n6. 正确答案：b\
