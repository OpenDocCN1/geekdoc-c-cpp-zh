  proc sql;\n   select sex,mean(weight) as avgweight\n      from company.employees\
  \ company.health\n      where employees.id=health.id\n      group by sex;\n```\n\
  \n1. `SELECT`\n2. `FROM`\n3. `WHERE`\n4. `GROUP BY`\n\n# 结束注释\n\n脚注 1：列标签的显示进一步取决于\
  \ `LABEL|NOLABEL` 系统选项。如果该选项被设置为 `NOLABEL`，则标签将不会作为输出中的列标题。该选项可以由你的站点管理员设置。返回]\n\
  \n# 第 2 章：使用 PROC SQL 执行高级查询\n\n\n\n\n\n## 概述\n\n## 引言\n\n`SELECT` 语句是 `PROC SQL`\
  \ 的主要工具。使用 `SELECT` 语句，你可以从一个或多个表和视图识别、处理和检索数据列。你应该已经熟悉如何使用 `SELECT` 语句及其大部分子句来创建基本的\
  \ PROC SQL 查询。在现有技能的基础上，本章介绍了各种实用的查询技术，例如使用子查询对数据进行子集处理。下面所示 PROC SQL 查询说明了一些新的查询技术：\n\
  \n```\nproc sql outobs=20;\ntitle 'Job Groups with Average Salary';\ntitle2 '> Company\
  \ Average';\n   select jobcode, \n          avg(salary) as AvgSalary format=dollar11.2,\n\
  \          count(*) as Count\n      from sasuser.payrollmaster\n      group by jobcode\n\
  \      having avg(salary) >\n         (select avg(salary)\n            from sasuser.payrollmaster)\n\
  \      order by avgsalary desc;\n```\n\n![PROC SQL query](img/m70-1-g1.png)\n\n\
  # 查看 SELECT 语句语法\n\n`SELECT` 语句及其子句是构建所有 PROC SQL 查询的基石。\n\n| 通用形式，`SELECT` 语句：`SELECT\
  \ column-1<, ... column-n>FROM table-1<, ... table-n | view-n><WHERE expression><GROUP\
  \ BY column-1<, ... column-n>><HAVING expression><ORDER BY column-1<, ... column-n>>;`\
  \ 这里是对语法的解释：`SELECT` 指定在输出中出现的列（s）；`FROM` 指定要查询的表（s）或视图（s）；`WHERE` 使用表达式根据一个或多个条件对数据进行子集或限制；`GROUP\
  \ BY` 根据指定的列（s）将数据分组；`HAVING` 使用表达式根据分组条件对数据组进行子集或限制；`ORDER BY` 根据指定列（s）的值对查询返回的行进行排序。\
  \ |\n\n注意：PROC SQL `SELECT` 语句中的子句必须按照所示顺序指定。除了 `HAVING` 子句外，你应该熟悉 `SELECT` 语句的所有子句。`HAVING`\
  \ 子句的使用将在本章后面介绍。现在，我们来看一些限制和划分查询输出中显示列数的方法。\n\n### 显示所有列\n\n你已经知道如何在 `SELECT` 语句中列出特定列来选择输出列。然而，对于某些任务，你会发现同时显示表的所有列是有用的。例如，在创建复杂查询之前，你可能想查看你正在处理的表的内容。\n\
  \n## 使用 SELECT *\n\n要按照表中存储的顺序显示所有列，请在 `SELECT` 子句中使用星号 (`*`)。默认情况下显示所有行，除非你对其进行限制或划分。以下\
  \ `SELECT` 步骤显示了 `Sasuser.Staffchanges` 表中的所有列和行，该表列出了公司所有就业状态发生变化的员工。\n\n```\n\
  proc sql;\n   select *\n      from sasuser.staffchanges;\n```\n\n如输出所示，表包含六列六行。![显示\
  \ Sasuser.Staffchanges 表中的所有行列](img/m70-3-g1.png)\n\n## 使用 FEEDBACK 选项\n\n当你指定 `SELECT\
  \ *` 时，也可以 PROC SQL 语句中使用 `FEEDBACK` 选项，它会将扩展列表写入 SAS 日志。例如，以下查询显示了：\n\n```\nproc\
  \ sql feedback;\n   select *\n      from sasuser.staffchanges;\n```\n\n`FEEDBACK`\
  \ 选项是一个调试工具，让你确切看到提交了什么。它会将星号 (`*`) 扩展为列列表。\n\n### 限制显示的行数\n\n## 概述\n\n在创建 PROC\
  \ SQL 查询时，有时发现限制显示的行数是有用的。要指定显示的最大行数，你可以在 PROC SQL 语句中使用 `OUTOBS=` 选项。\n\n| 通用形式，带有\
  \ `OUTOBS=` 的 PROC SQL 语句：` 这里是对语法的解释：`OUTOBS=` 指定行数。 |\n\n注意：`OUTOBS=` 选项限制的是显示的行，而不是读取的行。要限制\
  \ PROC SQL 接收输入的行数，请使用 `INOBS=` 选项。\n\n## 示例\n\n假设你想快速查看表中的值类型，而不必打印所有行。以下 PROC\
  \ SQL 查询从 `Sasuser.flightschedule` 表中选择数据，该表包含 200 多行。为了只打印输出的前 10 行，你向 PROC SQL\
  \ 语句中添加了 `OUTOBS=` 选项。\n\n```\nproc sql outobs=10;\n   select flightnumber, date\n\
  \      from sasuser.flightschedule;\n```\n\n![来自 Sasuser.Staffchanges 表的前 10 行](img/m70-5-g1.png)\n\
  \n当你限制显示的行数时，SAS 日志中会出现类似下面的消息。\n\n```\nWARNING: Statement terminated early due\
  \ to OUTOBS=10 option.\n````OUTOBS=` 和 `INOBS=` 选项影响使用 `CREATE TABLE` 语句创建表以及你的报告输出\n\
  \n# 消除输出中的重复行\n\n在某些情况下，你可能只想显示 `SELECT` 子句列出的列（s）中的唯一值或值的组合。你可以通过在 `SELECT` 子句中使用\
  \ `DISTINCT` 关键字从查询结果中消除重复行。`DISTINCT` 关键字适用于 `SELECT` 子句列出的所有列且仅这些列。\n\n## 示例\n\
  \n假设你想显示当月飞行的所有国际航班唯一航班号和目的列表。以下 PROC SQL 中的 `SELECT` 语句选择了 `Sasuser.Internationalflights`\
  \ 表中的 `FlightNumber` 和 `Destination` 列：\n\n```\nproc sql outobs=12;\n   select flightnumber,\
  \ destination\n      from sasuser.internationalflights;\n```\n\n\n\n\n这是输出结果。![Sasuser.Internationalflights](img/m70-6-g1.png)如你所见，仅在前\
  \ 12 行中，`FlightNumber`（航班号）和`Destination`（目的地）就有几对重复的值。例如，飞往 `YYZ` 的航班号 `182` 出现在第\
  \ 1 行和第 8 行。整个表格包含许多更多具有重复航班号和目的地的行，因为每班航班都有固定的行程。要删除包含重复值的行，请在 `SELECT` 语句的 `SELECT`\
  \ 关键字之后添加 `DISTINCT` 关键字，如下例所示：\n\n```\nproc sql;\n   select distinct flightnumber,\
  \ destination\n      from sasuser.internationalflights\n      order by 1;\n```\n\
  \n删除重复值后，输出的行数少得多，因此从 `PROC SQL` 语句中删除了 `OUTOBS=` 。此外，为了通过 `FlightNumber`（`SELECT`\
  \ 子句列表中的第 1 列）排序输出，添加了 `ORDER BY` 子句。这是修改后的程序的输出。![Sasuser.Internationalflights\
  \ output](img/m70-6-g2.png)输出中没有重复行。该表中有 7 个唯一的 `FlightNumber-Destination` 值对。\n\
  \n# 使用条件运算符对行进行子集\n\n## 概述\n\n在 `PROC SQL` 查询的 `WHERE` 子句中，你可以指定任何有效的 SAS 表达式来子集或限制在输出中显示的数据。该表达式可能包含各种类型的运算符，如下所示。\n\
  \n| 运算符类型 | 示例 |\n| --- | --- |\n| 比较 | ```sql\nwhere membertype='GOLD'\n``` | |\n\
  | 逻辑 | ```sql\nwhere visits<=3 or status='new'\n``` | |\n| 连接 | ```sql\nwhere name=trim(last)||',\
  \ '||'first\n``` | |\n\n注意：有关可在 SAS 表达式中使用的运算符完整列表，请参阅 SAS 文档。\n\n## 在 PROC SQL\
  \ 中使用运算符\n\n比较、逻辑和连接运算符在 `PROC SQL` 中的用法与其他 SAS 过程中的用法相同。例如，以下 `WHERE` 子句包含：\n\n\
  *   逻辑运算符 `AND`，它用于连接多个条件。\n*   两个比较运算符：等号 (`=`) 和大于符号 (`>`) 。\n\n```sql\nproc sql;\n\
  \   select ffid, name, state, pointsused\n      from sasuser.frequentflyers\n  \
  \    where membertype='GOLD' and pointsused>0\n      order by pointsused;\n```\n\
  \n在 `PROC SQL` 查询中，你还可以使用以下条件运算符。除了 `ANY`、`ALL` 和 `EXISTS` 之外，所有这些运算符也可以用于其他 SAS\
  \ 过程。\n\n| 条件运算符 | 测试对象 | 示例 |\n| --- | --- | --- |\n| BETWEEN-AND | 发生于闭区间范围内的值\
  \ | ```sql\nwhere salary between 70000\n             and 80000\n``` | |\n| CONTAINS\
  \ 或 `?` | 包含指定字符串的值 | ```sql\nwhere name contains 'ER' \nwhere name ? 'ER'\n```\
  \ | |\n| IN | 匹配列表中任一值的值 | ```sql\nwhere code in ('PT' , 'NA', 'FA')\n``` | |\n\
  | IS MISSING 或 IS NULL | 缺失值 | ```sql\nwhere dateofbirth is missing\nwhere dateofbirth\
  \ is null\n``` | | |\n| LIKE (带有 `%`, `_`) | 匹配指定模式的值 | ```sql\nwhere address like\
  \ '% P%PLACE'\n``` | | |\n| `=*` | 听音类似于指定值的值 | ```sql\nwhere lastname=* 'Smith'\n\
  ``` | | |\n| ANY | 相对于子查询返回的任一值，满足特定条件的值 | ```sql\nwhere dateofbirth < any\n   (select\
  \ dateofbirth\n      from sasuser.payrollmaster\n      where jobcode='FA3')\n```\
  \ | | |\n| ALL | 相对于子查询返回的所有值，满足特定条件的值 | ```sql\nwhere dateofbirth < all\n   (select\
  \ dateofbirth\n      from sasuser.payrollmaster\n      where jobcode='FA3')\n```\
  \ | | |\n| EXISTS | 子查询返回的值是否存在 | ```sql\nwhere exists\n   (select *\n      from\
  \ sasuser.flightschedule\n      where fa.empid=\n            flightschedule.empid)\
  \ \n``` | | |\n\n提示：要创建反向条件，可以在这些条件运算符（`ANY` 和 `ALL` 之外）之前加上 `NOT` 运算符。这些大多数条件运算符及其用法将在接下来的几节中介绍。`ANY`、`ALL`\
  \ 和 `EXISTS` 将在章节的后部分讨论。\n\n## 使用 BETWEEN-AND 运算符选择范围内的值\n\n要根据数值或字符值的范围来选择行，请在\
  \ `WHERE` 子句中使用 `BETWEEN-AND` 运算符。`BETWEEN-AND` 运算符是包含边界的，因此你指定的作为范围限制的值会被包含在查询结果中，外加两个限制之间的任何值。\n\
  \n| 通用形式，`BETWEEN-AND` 运算符：`BETWEEN value-1 AND value-2` 这里是对该语法的解释：`value-1` 是范围一端的值；`value-2`\
  \ 是范围另一端的值。 |\n\n注意：在指定值范围的限制时，没有必要先指定较小的值。以下是包含 `BETWEEN-AND` 运算符的 `WHERE` 子句示例，显示不需要先指定较小值的情况。\n\
  \n| 示例 | 返回的行 |\n| --- | --- |\n| ```sql\nwhere salary between 70000\nand 80000\n\
  ``` | 范围在 70000 到 80000 之间的值（包含边界）。 |\n| ```sql\nwhere date between '2023-01-01'\
  \ and '2023-12-31'\n``` | 日期在 2023-01-01 到 2023-12-31 之间的值（包含边界）。 |\n\n## 使用 CONTAINS\
  \ 或问号运算符选择字符串\n\n`CONTAINS` 或问号 (`?`) 运算符通常用于选择包含特定字符串的行。这些运算符是通用的。\n\n| 通用形式，`CONTAINS`\
  \ 运算符：`sql-expression CONTAINS sql-expression` | 这里是对该语法的解释：`sql-expression` 是字符列、字符串（常量）或表达式。要匹配的字符串必须放在引号内。\
  \ |\n\n注意：`PROC SQL` 获取字符串（或第二个表达式）出现在列中的任何位置的位置。匹配是区分大小写的。注意：`CONTAINS` 或问号 (`?`)\
  \ 运算符不属于 ANSI 标准；它是 SAS 的增强功能。\n\n## 示例\n\n以下 `PROC SQL` 查询使用 `CONTAINS` 来选择 `Name`\
  \ 列中包含 `ER` 的行。如输出所示，`Name` 列中任何包含 `ER` 的行都会被显示。\n\n```sql\nproc sql outobs=10;\n\
  \   select name\n      from sasuser.frequentflyers\n      where name contains 'ER';\n\
  ```\n\n![列中包含 'ER'](img/m70-10-g1.png)\n\n\n\n\n\n要选择包含缺失值（包括字符和数值）的行，请使用 `IS MISSING`\
  \ 或 `IS NULL` 运算符。这两个运算符是可以互用的。\n\n| 通用形式，`IS MISSING` 或 `IS NULL` 运算符 |\n| :---\
  \ |\n| `column IS MISSING` <br> `column IS NULL` |\n| **以下是语法说明：** <br> `column`\
  \ 指定所选的列名。 |\n\n注意：`IS MISSING` 运算符并不是 ANSI SQL 标准的一部分。它是 SAS 的增强功能。\n\n## 示例\n\n\
  假设你想查找 `Sasuser. Marchflights` 表的 `Boarded` 列中是否有任何缺失值。你可以使用以下 `PROC SQL` 查询来从表中检索出具有缺失值的行：\n\
  \n```\nproc sql;\n   select boarded, transferred,\n          nonrevenue, deplaned\n\
  \      from sasuser.marchflights\n      where boarded is missing;\n```\n\n输出显示表中中有两行的\
  \ `Boarded` 缺失值。![Sasuser. Marchflights](img/m70-13-g1.png)\n\n提示：或者，你也可以不使用 `IS\
  \ MISSING` 或 `IS NULL` 运算符来指定缺失值，如下例所示：\n\n```\nwhere boarded = .\nwhere flight\
  \ = ' '\n```\n\n然而，使用 `IS MISSING` 或 `IS NULL` 运算符的优势在于你不需要指定列的数据类型（字符或数值）。\n\n\
  ## 使用 LIKE 运算符选择模式\n\n要选择符合特定字符模式而非固定字符字符串的行，请使用 `LIKE` 运算符。例如，使用 `LIKE` 运算符，你可以选择所有\
  \ `LastName` 值以 `H` 开头的行。（如果你想选择所有姓氏中包含字符串 `HAR` 的行，则将需要使用 `CONTAINS` 运算符。）\n\n\
  | 通用形式，`LIKE` 运算符 |\n| :--- |\n| `column LIKE 'pattern'` |\n| **以下是语法说明：** <br>\
  \ `column` 指定列名 <br> `pattern` 指定要匹配的模式，包含一个或两个特殊字符：下划线 (`_`) 和百分号 (`%`)。 整个模式必须包含在引号中，且匹配是区分大小写的。\
  \ |\n\n在查询中使用 `LIKE` 运算符时，`PROC SQL` 使用模式匹配，将指定列中的每个值与你在 `WHERE` 子句中使用 `LIKE` 运算符指定的模式进行比较。查询输出将显示所有匹配的行。你可以使用下所示的一个或两个特殊字符来指定模式。\n\
  \n| 特殊字符 | 表示 |\n| :--- | :--- |\n| 下划线 (`_`) | 任意单个字符 |\n| 百分号 (`%`) | 任意零或多个字符的序列\
  \ |\n\n注意：下划线 (`_`) 和百分号 (`%`) 有时被称为通配符。\n\n## 指定模式\n\n要指定模式，请将一个或两个特殊字符与你想要匹配的任何其他字符结合。特殊字符可以出现在其他字符之前、之后或双侧。考虑如何组合这些特殊字符来指定模式。假设你正在处理一个包含以下名称列表的表列：\n\
  \n* Diana\n* Diane\n* Dianna\n* Dianthus\n* Dyan\n\n以下是你可以使用的几种模式，用于从列表中选择一个或多个名称。每个模式都使用一个或两个特殊字符。\n\
  \n| LIKE 模式 | 选择的名称 |\n| :--- | :--- |\n| `LIKE 'D_an'` | Dyan |\n| `LIKE 'D_an_'`\
  \ | Diana, Diane |\n| `LIKE 'D_an__` | Dianna |\n| `LIKE 'D_an%'` | 列表中所有的名称 |\n\
  \n## 示例\n\n以下 `PROC SQL` 查询使用 `LIKE` 运算符找到所有街道名称以 `P` 开头并 `PLACE` 结尾的常旅客会员。以下 `PROC\
  \ SQL` 步骤执行了此查询：\n\n```\nproc sql;\n   select ffid, name, address\n      from sasuser.frequentflyers\n\
  \      where address like '% P%PLACE';\n```\n\n模式 `'% P%PLACE'` 指定了以下序列：\n\n* 任意数量字符\
  \ (`%`)\n* 一个空格\n* 字母 `P`\n* 任意数量字符 (`%`)\n* 单词 `PLACE`。\n\n这是该查询的结果。![PROC SQL\
  \ query](img/m70-14-g1.png)\n\n## 使用 Sounds-Like (=*) 运算符选择拼写变体\n\n要选择包含你指定的另一个值读似值的行，请在\
  \ `WHERE` 子句中使用读似运算符 `=*`。\n\n| 通用形式，sounds-like (`*=`) 运算符 |\n| :--- |\n| `sql-expression\
  \ =* sql-expression` |\n| **以下是语法说明：** <br> `sql-expression` 是字符列、字符串（字符常量）或表达式。字符串是用于匹配的字符序列，必须包含在引号中。\
  \ |\n\n读似运算符 `=*` 使用 `SOUNDEX` 算法将列的每个值（或其他 `sql-expression`）与你指定的单词或词（或其他 `sql-expression`）进行比较。任何包含你指定值的拼写变体的行都会被选中输出。例如，这里有一个包含读似运算符的\
  \ `WHERE` 子句：\n\n```\nwhere lastname =* 'Smith';\n```\n\n读似运算符 `=*` 并不总是选择所有可能的值。例如，假设你从以下列表中选择读音\
  \ 似于 `Smith` 的名称：\n\n* Schmitt\n* Smithson\n* Smitt\n* Smythe\n\n列表中的 Schmitt 和\
  \ Smithson 没有被选中。注意：`SOUNDEX` 算法是英语偏的，对于其他语言用处较小。关于 `SOUNDEX` 算法的更多信息，请参阅 SAS 文档。\n\
  \n# 使用计算值子集行\n\n## 理解 PROC SQL 处理计算列\n\n你应该已经知道如何通过 `SELECT` 子句执行计算来定义新列。例如，下面的\
  \ `PROC SQL` 查询通过添加现有列 `Boarded`、`Transferred` 和 `Nonrevenue` 创建新列 `Total`：\n\n\
  ```\nproc sql;\n   select boarded, transferred,\n          nonrevenue, deplaned\n\
  \      from sasuser.marchflights\n```\n\n你还可以在 `WHERE` 子句中使用计算列来划分子集。然而，由于 SQL 查询的处理方式，你不能直接在\
  \ `WHERE` 子句中指定别名。为了观察结果，我们对之前的 `PROC SQL` 查询在 `WHERE` 语句中引用计算列 `Total`，如下所示：\n\n\
  ```\nproc sql outobs=10;\n   select date, destination,\n          boarded + transferred\
  \ + nonrevenue\n          as Total\n      from sasuser.marchflights\n      where\
  \ total < 100;\n```\n\n当执行此查询时，SAS 日志中显示以下错误信息。\n\n表 2.3 SAS 日志\n\n|  |\n```\n519\
  \  proc sql outobs=10;\n520      select date, destination,\n521             boarded\
  \ + transferred + nonrevenue\n522             as Total\n523          from sasuser.marchflights\n\
  524          where total < 100;\nERROR: The following columns were not found in\
  \ the contributing tables: total.\n``` |\n\n产生此错误是因为在 SQL 查询中，`WHERE` 子句在 `SELECT`\
  \ 子句之前处理。SQL 处理器会在表中查找 `WHERE` 子句中命名的列。`Sasuser.Marchflights` 表不包含名为 `Total` 的列。\n\
  \n## 使用关键字 CALCULATED\n\n当在 `WHERE` 子句中使用别名引用计算值时，必须配合别名使用 `CALCULATED` 关键字。`CALCULATED`\
  \ 关键字告知 `PROC SQL` 该值是在查询内部计算的。现在，PROC SQL 查询如下如下：\n\n```\n proc sql outobs=10;\n\
  \    select flightnumber, date, destination,\n           boarded + transferred +\
  \ nonrevenue\n           as Total\n       from sasuser.marchflights\n       where\
  \ calculated total < 100;\n```\n\n\n\n\n该查询执行成功并产生以下输出。![PROC SQL query](img/m70-18-g1.png)注意：作为使用\
  \ `CALCULATED` 关键字的替代方案，可以在 `WHERE` 子句中重复该计算。然而，这种方法的效率较低，因为 `PROC SQL` 必须执行两次计算。在前面的查询中，替代的\
  \ `WHERE` 语句将：\n\n```\nwhere boarded + transferred + nonrevenue <100;\n```\n\n你也可以在查询的其他部分使用\
  \ `CALCULATED` 关键字。在接下来的示例中，`SELECT` 子句计算了新列 `Total`，然后根据 `Total` 计算了第二个新列。要创建第二个计算列，你必须在\
  \ `SELECT` 子句中指定关键字 `CALCULATED`。\n\n```\nproc sql outobs=10;\n   select flightnumber,\
  \ date, destination,\n          boarded + transferred + nonrevenue\n          as\
  \ Total,\n          calculated total/2 as Half\n       from sasuser.marchflights;\n\
  ```\n\n该查询产生以下输出。![PROC SQL query](img/m70-18-g2.png)注意：`CALCULATED` 关键字是 SAS 的增强功能，在\
  \ ANSI SQL 标准中并未指定。\n\n### 增强查询输出\n\n## 概述\n当你使用 `PROC SQL` 时，你可能会发现表中的数据格式并不是你希望出现的样子。幸运的是，通过\
  \ `PROC SQL`，你可以使用如下增强功能来改进查询输出的外观：\n\n* 列标签和格式\n* 标题（titles）和脚注（footnotes）\n* 包含字符常量的列\n\
  \n你如何在如何在 SAS 过程中使用前两种增强方法。你也可以通过处理以下查询来增强 `PROC SQL` 查询输出：\n\n```\n proc sql outobs=15;\n\
  \     select empid, jobcode, salary,\n            salary * .10 as Bonus\n      \
  \  from sasuser.payrollmaster\n        where salary>75000\n        order by salary\
  \ desc;\n```\n\n此查询将输出限制为 15 个观测值。`SELECT` 子句从表 `Sasuser.Payrollmaster` 中选择了三个现有的列，并计算了第四个（`Bonus`）。`WHERE`\
  \ 子句仅检索 `salary` 大于 75,000 的行。`ORDER BY` 子句按 `Salary` 列进行排序，并使用关键字 `DESC` 进行降序排列。这是该查询的输出。![PROC\
  \ SQL output](img/m70-21-g1.png)注意：`Salary` 列在表中指定了 `DOLLAR9.` 格式。仔细观察此输出你会发现可以进行改进。你将通过以下方法学习如何增强此输出：\n\
  \n* 用新标签替换原始列名\n* 为 `Bonus` 列指定格式，以便所有值都以相同的小数位数显示\n* 在输出顶部显示标题\n* 使用字符常量添加一列\n\n\
  ## 指定列格式和标签\n默认情况下，`PROC SQL` 使用已保存在表中的列属性来格式化输出，如果没有保存任何属性，则使用默认属性。要控制输出中列的格式化，你可以在\
  \ `SELECT` 子句中指定的任何列名之后指定列修饰符，例如 `LABEL=` 和 `FORMAT=`。当你在 `SELECT` 子句中定义新列时，如果你愿意，可以分配一个标签而不是别名。\n\
  \n| 列修饰符 | 指定... | 示例 |\n| --- | --- | --- |\n| `LABEL=` | 为列显示的标签 |  ```\nselect\
  \ hiredate\n       label='Date of Hire'\n``` |\n| `FORMAT=` | 用于显示列数据的格式 |  ```\n\
  select hiredate\n       format=date9.\n``` |\n\n注意：`LABEL=` 和 `FORMAT=` 不属于 ANSI\
  \ 标准的一部分。这些列修饰符是 SAS 的增强功能。提示：若要强制 `PROC SQL` 忽略表中的永久标签，请指定系统选项 `NOLABEL`。你的第一个任务是为前两列指定列标签。下面，在\
  \ `EmpID` 和 `JobCode` 之后都添加了 `LABEL=` 选项，并且每个标签的文本都括在引号内。为了方便阅读，`SELECT` 子句中的四个列现在每个都单独列成一行。\n\
  \n```\nproc sql outobs=15;\n   select empid label='Employee ID',\n          jobcode\
  \ label='Job Code',\n          salary,\n          salary * .10 as Bonus\n      from\
  \ sasuser.payrollmaster\n      where salary>75000\n      order by salary desc;\n\
  ```\n\n接下来，你为 `Bonus` 列添加格式。因为 `Bonus` 值是金额，所以你使用格式 `Dollar12.2.`。`FORMAT=` 修饰符已添加在下面的\
  \ `SELECT` 子句中，紧随列别名 `Bonus` 之后：\n\n```\nproc sql outobs=15;\n   select empid label='Employee\
  \ ID',\n          jobcode label='Job Code',\n          salary,\n          salary\
  \ * .10 as Bonus\n          format=dollar12.2\n   from sasuser.payrollmaster\n \
  \  where salary>75000\n   order by salary desc;\n```\n\n现在已经指定了列格式和标签，你可以为此 `PROC\
  \ SQL` 查询添加一个标题。\n\n## 指定标题和脚注\n你应该已经如何在其他 SAS 过程中指定和取消标题和脚注。当你使用 `PROC SQL` 查询指定标题和脚注时，你必须在以下位置之一放置\
  \ `TITLE` 和 `FOOTNOTE` 语句：\n\n* `PROC SQL` 语句之前\n* `PROC SQL` 语句与 `SELECT` 子句之间\n\
  \n在接下来的 `PROC SQL` 查询中，在 `PROC SQL` 语句和 `SELECT` 子句之间添加了两个标题行：\n\n```\n proc sql\
  \ outobs=15;\ntitle 'Current Bonus Information';\ntitle2 'Employees with Salaries\
  \ > $75,000';\n    select empid label='Employee ID',\n           jobcode label='Job\
  \ Code',\n           salary,\n           salary * .10 as Bonus\n           format=dollar12.2\n\
  \       from sasuser.payrollmaster\n       where salary>75000\n       order by salary\
  \ desc;\n```\n\n现在更改已完成，你可以查看输出。![Bonus Information, Employees with Salaries > $75,000](img/m70-23-g1.png)前两列具有新标签，`Bonus`\
  \ 值格式统一，且顶部显示了两个标题行。\n\n## 在输出中添加字符常量\n另一种增强 `PROC SQL` 查询输出的方法是定义一个包含字符常量的列。为此，句中使用引号包含字符串。提示：你可以以类似的方式定义包含数值常量的列，即在\
  \ `SELECT` 子句中列出数值（不带引号）。你可以再次查看之前的 `PROC SQL` 输出，确定可以在哪里添加字符串。![Bonus Information,\
  \ Employees with Salaries > $75,000](img/m70-24-g1.png)你可以移除列标签 `Bonus`，并在 `Bonus`\
  \ 列左侧在新列中显示 `bonus is:`。这就是你希望查询输出的样子。![Bonus Information, Employees with Salaries\
  \ > $75,000](img/m70-24-g2.png)要指定一个包含字符常量的新列，你需要在 `SELECT` 列表中使用引号包含字符串。你修改后的 `PROC\
  \ SQL` 查询所示：\n\n```\nproc sql outobs=15;\ntitle 'Current Bonus Information';\ntitle2\
  \ 'Employees with Salaries > $75,000';\n   select empid label='Employee ID',\n \
  \         jobcode label='Job Code',\n          salary,\n          'bonus is:',\n\
  \          salary * .10 format=dollar12.2\n      from sasuser.payrollmaster\n  \
  \    where salary>75000\n      order by salary desc;\n```\n\n在 `SELECT` 子句列表中，`Salary`\
  \ 和 `Bonus` 之间添加了字符串 `bonus is:`。注意，`SELECT` 子句最后一行已删除了 `as Bonus` 代码。现在已经添加了字符常量，不再需要列别名\
  \ `Bonus`。\n\n\n\n与其仅仅列出单独的行，您可以使用摘要函数（也称为聚合函数）来生成表格中数据的统计摘要。例如，在以下查询的 `SELECT`\
  \ 子句中，`AVG` 函数计算了频繁飞行员俱乐部会员的平均（或平均）里程数。`GROUP BY` 子句告诉 `PROC SQL` 计算并显示每个会员组（`MemberType`）的平均值。\n\
  \n```\nproc sql;\n   select membertype, \n          avg(milestraveled)\n       \
  \   as AvgMilesTraveled\n      from sasuser.frequentflyers\n      group by membertype;\n\
  ```\n\n| | ![每个成员类型的平均里程数](img/m70-26-g1.png) | |\n\n您应该已经熟悉了 `PROC SQL` 查询中可以使用的摘要函数列表。`PROC\
  \ SQL` 根据多种因素的组合以不同的方式计算摘要函数并输出结果。四个关键因素是：\n\n- 摘要函数是否指定了一个列或多个列作为参数\n- 查询是否包含 `GROUP\
  \ BY` 子句\n- 如果在 `SELECT` 子句中指定了摘要函数，是否列出了摘要函数之外的额外列\n- 如果存在 `WHERE` 子句，它是否仅包含在 `SELECT`\
  \ 子句中指定的列\n\n为了确保您的 `PROC SQL` 查询产生预期的输出，理解上述因素如何影响摘要函数的处理至关重要。请考虑对所有因素进行概述，随后通过一个详细的示例来阐述每个因素。\n\
  \n## 参数数量与摘要函数处理\n\n摘要函数在括号中指定一个或多个参数。在本章所示的示例中，参数始终是所查询表中的列。注意：ANSI 标准摘要函数（如 `AVG`\
  \ 和 `COUNT`）只能与单个参数一起使用。SAS  own 摘要函数（如 `MEAN` 和 `N`）可以使用单个或多个参数。下表显示了指定作为参数的列数如何影响\
  \ `PROC SQL` 计算摘要函数。\n\n| 如果摘要函数... | 那么计算将... | 示例 |\n| --- | --- | --- |\n| 指定一个列作为参数\
  \ | 沿列向下执行 | ```sql\\nproc sql;\\n    select avg(salary)as AvgSalary\\n       from\
  \ sasuser.payrollmaster;\\n``` ``` |\n| 指定多个列作为参数 | 针对每行跨列执行 | ```sql\\nproc sql\
  \ outobs=10;\\n    select sum(boarded,transferred,nonrevenue)\\n           as Total\\\
  n       from sasuser.marchflights;\\n``` ``` |\n\n## 分组与摘要函数处理\n\n摘要函数对数据组进行计算。当\
  \ `PROC SQL` 处理摘要函数时，它会寻找 `GROUP BY` 子句：\n\n| 如果存在 `GROUP BY` 子句... | 那么 `PROC SQL`...\
  \ | 示例 |\n| --- | --- | --- |\n| 查询中不存在 | 将函数应用于整个表 | ```sql\\nproc sql outobs=10;\\\
  n    select jobcode, avg(salary)\\n           as AvgSalary\\n       from sasuser.payrollmaster;\\\
  n``` ``` |\n| 查询中存在 | 将函数应用到 `GROUP BY` 子句中指定的每个组 | ```sql\\nproc sql outobs=10;\\\
  n    select jobcode, avg(salary)\\n           as AvgSalary\\n       from sasuser.payrollmaster\\\
  n       group by jobcode;\\n``` ``` |\n\n如果查询包含 `GROUP BY` 子句，`SELECT` 子句中所有不包含摘要函数的列都应该列在\
  \ `GROUP BY` 子句中，否则可能会返回意外的结果。\n\n## SELECT 子句列与摘要函数处理\n\n包含摘要函数的 `SELECT` 子句还可以列出未在摘要函数中指定的额外列。`SELECT`\
  \ 列表中这些额外列的存在会导致 `PROC SQL` 以不同的方式显示输出。\n\n| 如果 `SELECT` 子句... | 那么 `PROC SQL`...\
  \ | 示例 |\n| --- | --- | --- |\n| 包含摘要函数且摘要函数之外没有列 | 使用摘要函数为整个表计算单个值；或者如果 `GROUP\
  \ BY` 子句中指定了组，则为每个组将信息合并或汇总为整个表的单行输出；或者如果指定了组，则针对每个组 | ```sql\\nproc sql;\\n   \
  \ select avg(salary)\\n           as AvgSalary\\n       from sasuser.payrollmaster;\\\
  n``` ``` |\n| 包含摘要函数以及摘要函数外的额外列 | 为整个表计算单个值，或者如果指定了组，则为每个组计算，并带有重复的单值或分组值显示所有输出行\
  \ | ```sql\\nproc sql;\\n    select jobcode,\\n            gender,\\n          \
  \ avg(salary)\\n           as AvgSalary\\n       from sasuser.payrollmaster\\n \
  \      group by jobcode,gender;\\n``` ``` |\n\n注意：`WHERE` 子句的列也会影响摘要函数的处理。如果 `WHERE`\
  \ 子句仅引用了 `SELECT` 子句中指定的列，`PROC SQL` 将信息合并为单行输出。然而，本章未涵盖此情况。更多信息请参阅 SQL 过程 文 文。在接下来的几节中，请仔细查看上述查询示例，了解前三个因素如何影响摘要函数的处理。比较两个包含摘要函数的\
  \ `PROC SQL` 查询：一个带单个参数，另一个带多个参数。为了简单起见，这些查询不包含 `GROUP BY` 子句。\n\n## 使用单参数（列）的摘要函数\n\
  \n下面是一个 `PROC SQL` 查询，用于显示 `Sasuser.Payrollmaster` 表中所有员工的平均薪资：\n\n```sql\n proc\
  \ sql;\n    select avg(salary) as AvgSalary\n       from sasuser.payrollmaster;\n\
  ```\n\n`SELECT` 语句包含摘要函数 `AVG`，并将 `Salary` 作为其参数。因为只有一个列作为参数，该函数沿 `Salary` 列向下计算统计值，显示单个值：所有员工的平均薪资。输出所示![平均薪资](img/m70-29-g1.png)\n\
  \n## 使用多参数（列）的摘要函数\n\n考虑一个包含多个列作为参数的摘要函数的 `PROC SQL` 查询。该查询通过相加 `boarded`、`transferred`\
  \ 和 `nonrevenue` 乘客的数量，计算 3 月份每个航班的总人数：\n\n```sql\n proc sql outobs=10;\n    select\
  \ sum(boarded,transferred,nonrevenue)\n           as Total\n       from sasuser.marchflights;\n\
  ```\n\n`SELECT` 子句包含摘要函数 `SUM`，并将三个列作为参数。由于该函数包含多个参数，统计值针对每行跨这三列进行计算，产生如下输出![来自列的输出](img/m70-29-g2.png)\
  \ 注意：如果没有 `OUTOBS=` 选项，表中的所有行将显示在输出中。考虑包含 `GROUP BY` 子句和摘要函数外的列如何影响包含摘要函数的 `PROC\
  \ SQL` 查询。\n\n## 不带 GROUP BY 子句使用摘要函数\n\n再次是这个 `PROC SQL` 查询，用于显示 `Sasuser.Payrollmaster`\
  \ 表中所有员工的平均薪资。该查询包含摘要函数，但由于目标是显示所有员工的平均值，因此没有 `GROUP BY` 子句。\n\n```sql\n proc sql\
  \ outobs=20;\n    select avg(salary) as AvgSalary\n       from sasuser.payrollmaster;\n\
  ```\n\n注意 `SELECT` 子句仅列出一列：由摘要计算定义的计算列。摘要函数之外没有其他列。这是查询输出![所有员工的平均薪资](img/m70-30-g1.png)\n\
  \n## 在摘要函数外的列使用摘要函数\n\n\n\n\n假设你为每个作业组计算了平均值，并按作业代码对结果进行分组。你的第一步是在 `SELECT` 子句列表中添加一个现有的列（`JobCode`）。修改后的查询显示所示：\n\
  \n```\nproc sql outobs=20;\n   select jobcode, avg(salary) as AvgSalary\n      from\
  \ sasuser.payrollmaster;\n```\n\n现在考虑由于 `SELECT` 语句包含了一个不是汇总函数参数的列（`JobCode`），查询的输出看起来是什么样子的。![带有\
  \ JobCode 的平均薪资](img/m70-30-g2.png) 注意：请记住此 `PROC SQL` 查询使用 `OUTOBS=` 选项将输出限制在 20\
  \ 行。如果没有此限制，此查询的输出将显示表中的所有 148 行。如结果所示，在 `SELECT` 子句中添加一个不在汇总函数内的列会导致 `PROC SQL`\
  \ 输出所有行，而不是单个值。为了生成此输出，`PROC SQL`\n\n* 计算了整列的平均薪资作为一个单个值（54079.62）\n* 在输出中显示了所有行，因为\
  \ `JobCode` 未在汇总函数中指定。\n\n因此，`AvgSalary` 的单个值在每行中重复。注意：当提交此查询时，SAS 日志显示一条指示发生数据重新合并（data\
  \ remerging）的消息。数据重新合并将在本章后部分解释。这个结果很有趣，但你还没有达到目标：按 `JobCode` 对数据分组。下一步是添加 `GROUP\
  \ BY` 子句。\n\n## 使用 GROUP BY 子句使用汇总函数\n\n下面是前一页的 `PROC SQL` 查询，其中添加了指定列 `JobCode`\
  \ 的 `GROUP BY` 子句。（在 `SELECT` 子句中，指定了 `JobCode` 但未将其用作汇总函数参数。）查询的其他更改还包括移除 `OUTOBS=`\
  \ 选项（它是不必要的）并为 `AvgSalary` 列指定格式。\n\n```\n proc sql;\n    select jobcode, \n   \
  \        avg(salary) as AvgSalary format=dollar11.2\n       from sasuser.payrollmaster\n\
  \       group by jobcode;\n```\n\n考虑添加 `GROUP BY` 子句如何影响输出。![按 JobCode 分组的平均薪资](img/m70-31-g1.png)\
  \ 成功！已为每个 `JobCode` 组计算了汇总函数，并且结果按 `JobCode` 分了组。\n\n## 使用 COUNT 汇总函数计数值\n\n有时你想统计整个表或行组的行数。在\
  \ `PROC SQL` 中，你可以使用 `COUNT` 汇总函数来计算具有非缺失值的行数。使用 `COUNT` 函数有三种主要方法。\n\n| 使用这种形式的\
  \ COUNT... | 返回... | 示例 |\n| --- | --- | --- |\n| `COUNT(*)` | 组或表中的总行数 | \n```\n\
  select count(*) as Count\n``` |\n| `COUNT(column)` | 选定列中具有非缺失值的组或表中的总行数 | \n```\n\
  select count(jobcode) as Count\n``` |\n| `COUNT(DISTINCT column)` | 列中唯一值的总数 | \n\
  ```\nselect count(distinct jobcode)\n       as Count\n``` | |\n\n**注意**`COUNT` 汇总函数只计算非缺失值；缺失值会被忽略。许多其他汇总函数也忽略缺失值。例如，`AVG`\
  \ 函数仅返回非缺失值的平均值。当你对包含缺失值的数据使用汇总函数时，结果可能无法提供你预期的信息。在查询中使用汇总函数之前，熟悉数据是一个好主意。提示：要统计缺失值的数量，请使用\
  \ `NMISS` 函数。有关 `NMISS` 函数的更多信息，请参阅 SAS 文档。考虑使用 `COUNT` 函数的三种方法。\n\n## 统计所有行\n\n\
  假设你想知道 `Sasuser. Payrollmaster` 表中列出了多少员工。该表每个员工都有单独的行，因此统计表中的行数即可得到员工人数。以下 `PROC\
  \ SQL` 查询完成了此任务：\n\n```\n proc sql;\n    select count(*) as Count\n       from sasuser.payrollmaster;\n\
  ```\n\n![员工总数](img/m70-34-g1.png) 注意：`COUNT` 汇总函数是唯一允许使用星号（`*`）作为参数的函数。你也可以使用 `COUNT(*)`\
  \ 来统计数据组内的行。要这样做，你需要在 `GROUP BY` 子句中指定组。考虑一个使用 `COUNT(*)` 进行分组的更复杂的 `PROC SQL` 查询。这次的目标是使用与上面相同的表，找到每个作业类别内的员工总数。\n\
  \n```\nproc sql;\n   select substr(jobcode,1,2)\n          label='Job Category',\n\
  \          count(*) as Count\n      from sasuser.payrollmaster\n      group by 1;\n\
  ```\n\n此查询在 `SELECT` 子句中定义了两个新列。标记为 `JobCategory` 的第一列是通过使用 SAS 函数 `SUBSTR` 从现有的\
  \ `JobCode` 字段中提取两个字符的作业类别创建的。第二列 `Count` 是通过 `COUNT` 函数创建的。`GROUP BY` 子句指定结果按第\
  \ 1 列分组（由于列未命名，故引用 `1`；因为该列未命名——此处原文括号有误）。![按 jobcode 计数](img/m70-34-g2.png) **注意**：当列包含缺失值时，`PROC\
  \ SQL` 将缺失值视为一个组。这有时会产生意外的结果。\n\n## 统计列中的非缺失值\n\n假设你想统计特定列中的非缺失值，而不是整个表。要这样做，你需要将列名作为\
  \ `COUNT` 函数的参数。例如，以下 `PROC SQL` 查询统计 `JobCode` 列的非缺失值：\n\n```\n proc sql;\n   \
  \ select count(JobCode) as Count\n       from sasuser.payrollmaster;\n```\n\n |\
  \ ![缺失值计数](img/m70-35-g1.png) 由于表中没有缺失数据，此查询的结果与使用 `COUNT(*)` 相同。`JobCode` 每行都有非缺失值。然而，如果\
  \ `JobCode` 列包含缺失值，此查询产生的 `Count` 值将较低。例如，如果 `JobCode` 有三个缺失值，`Count` 的值为 145。\n\
  \n## 统计列中的唯一值\n\n要统计列中的唯一值，请在作为参数的列之前添加关键字 `DISTINCT`。例如，这里是修改后的查询，仅计算唯一值：\n\n```\n\
  proc sql;\n   select count(distinct jobcode) as Count\n      from sasuser.payrollmaster;\n\
  ```\n\n此查询统计了 `JobCode` 的 16 个唯一值。![JobCode 的唯一值计数](img/m70-35-g2.png)要显示唯一的 `JobCode`\
  \ 值，你可以应用之前讨论的去重方法。以下查询列出了唯一的 `JobCode` 值：\n\n```\nproc sql;\n   select distinct\
  \ jobcode\n      from sasuser.payrollmaster;\n```\n\n有 16 个作业代码，因此输出包含 16 行![唯一的\
  \ JobCode 值列表](img/m70-35-g3.png)\n\n## 使用 HAVING 子句分组\n\n你已经看到了如何使用 `GROUP BY`\
  \ 子句对数据分组。例如，以下查询计算了每个作业代码组的平均薪资，并显示每个作业代码的平均值：\n\n```\n proc sql;\n    select jobcode,\
  \ \n           avg(salary) as AvgSalary\n           format=dollar11.2\n       from\
  \ sasuser.payrollmaster\n       group by jobcode;\n```\n\n\n\n表中包含 16 个作业代码，因此输出显示了\
  \ 16 行。![每个 JobCode 的平均工资](img/m70-37-g1.png)现在，假设你只想为查询输出选择一组组的子集。你可以在 `GROUP BY`\
  \ 子句之后使用 `HAVING` 子句，来选择（或过滤）要显示的组。`HAVING` 子句影响组的方式与 `WHERE` 子句影响单行的方式相似。与 `WHERE`\
  \ 子句一样，`HAVING` 子句包含一个用于对数据进行子集的表达式。可以使用任何有效的 SAS 表达式。当你使用 `HAVING` 子句时，`PROC SQL`\
  \ 只会显示满足 `HAVING` 表达式的组。\n\n注意：你可以在 `HAVING` 子句中使用摘要函数，但不能在 `WHERE` 子句中使用它们，因为 `HAVING`\
  \ 子句用于组，而 `WHERE` 子句只能用于单行。修改上方所示的查询，使其仅选择平均工资超过 $56,000 的 `JobCode` 组。查询末尾已添加了\
  \ `HAVING` 子句。\n\n```\n proc sql;\n    select jobcode, \n           avg(salary)\
  \ as AvgSalary\n           format=dollar11.2\n       from sasuser.payrollmaster\n\
  \       group by jobcode\n       having avg(salary) > 56000;\n```\n\n提示：另一种，由于平均工资已经在\
  \ `SELECT` 子句中计算过，`HAVING` 子句可以指定列别名 `AvgSalary`：\n\n```\nhaving AvgSalary > 56000\n\
  ```\n\n注意，你不需要在 `HAVING` 子句中指定 `CALCULATED` 关键字；但在 `WHERE` 子句中必须指定。查询输出如下所示。此输出比之前的输出小，因为只显示了作业代码组的子集![每个\
  \ JobCode 超过 $56,000 的平均工资](img/m70-37-g2.png)如果你在包含 `HAVING` 子句的查询中省略了 `GROUP BY`\
  \ 子句，那么 `HAVING` 子句和摘要函数（如果有指定的话）将把整个表视为一组。如果没有 `GROUP BY` 子句，上述示例中的 `HAVING` 子句将计算整个表的平均工资（公司所有的作业），而不是每个组（每个作业代码）的。输出要么包含表中的所有行（如果整个表的平均工资大于\
  \ $56,000），要么不包含表中的任何行（如果整个表的平均工资小于 $56,000）。\n\n## 理解数据重新合并 (Data Remerging)\n\n\
  有时，当你在 `SELECT` 子句或 `HAVING` 子句中使用摘要函数时，`PROC SQL` 必须重新合并数据（对表进行两次扫描）。重新合并需要额外的处理时间，而且通常是不可避免的。然而，在某些情况下，你可能修改查询以避免重新合并。了解重新合并何时以及何时发生可以提高编写高效查询的能力。考虑一个需要重新合并的\
  \ `PROC SQL` 查询。该查询计算每个导航员工资占所有导航员工资的百分比：\n\n```\nproc sql;\n   select empid, salary,\n\
  \          (salary/sum(salary)) as Percent\n          format=percent8.2\n      from\
  \ sasuser.payrollmaster\n      where jobcode contains 'NA';\n```\n\n当你提交此查询时，SAS\
  \ 日志会显示以下消息。\n\n表 2.4 SAS Log\n\n| `NOTE: The query requires remerging summary statistics\
  \ back with the original data.` |\n\n只要存在以下任一条件，就会发生重新合并：\n\n*   摘要函数返回的值被用于计算。\n\
  *   `SELECT` 子句指定了一个包含摘要函数的列以及未列在 `GROUP BY` 子句中的其他列。\n*   `HAVING` 子句指定了一个或多个列或列表达式，这些列未包含在子查询或\
  \ `GROUP BY` 子句中。\n\n在重新合并期间，`PROC SQL` 对表进行两次扫描：\n\n1. `PROC SQL` 计算并返回摘要函数的值。`PROC\
  \ SQL` 还根据 `GROUP BY` 子句对数据进行分组。\n2. `PROC SQL` 获取在输出中显示所需的任何额外列和行，并使用摘要函数的结果来计算任何参与摘要函数的算术表达式。\n\
  \n## 示例\n\n考虑 `PROC SQL` 在处理以下查询时是如何重新合并数据的：\n\n```\nproc sql;\n   select empid,\
  \ salary,\n          (salary/sum(salary)) as Percent\n          format=percent8.2\n\
  \      from sasuser.payrollmaster\n      where jobcode contains 'NA';\n```\n\n在第一遍扫描中，对于\
  \ `jobcode` 包含 `'NA` 的行，`PROC SQL` 计算并返回 `SUM` 函数的值（在 `SELECT` 子句中指定）。在第二遍扫描中，`PROC\
  \ SQL` 获取输出中所需的额外列和行（`EmpID`, `Salary`）以及 `JobCode` 包含 `'NA` 的行。`PROC SQL` 还使用 `SUM`\
  \ 函数的结果来计算算术表达式 `(salary/sum(salary))`。注意：某些 SQL 的实现不支持重新合并，并将上述示例视为错误。提示：你可以通过使用子查询来获得相同的结果。子查询将在本章稍后部分讨论。\n\
  \n# 使用子查询进行数据子集\n\n## 子查询简介\n\n`WHERE` 和 `HAVING` 子句都根据表达式对数据进行过滤。在本章之前的查询示例中，`WHERE`\
  \ 和 `HAVING` 子句包含了标准的 SAS 表达式。例如，下面的 `WHERE` 子句使用了 `BETWEEN-AND` 条件运算符并将 `salary`\
  \ 列作为操作数：\n\n```\nwhere salary between 70000 and 80000\n```\n\n`PROC SQL` 还提供了另一种用于\
  \ `WHERE` 和 `HAVING` 子句过滤数据的表达式类型：子查询。子查询是嵌套在另一个查询中并作为其部分的查询。注意：子查询也被称为嵌套查询、内部查询和子选择。下面的\
  \ PROC SQL 查询在 `HAVING` 子句中包含一个子查询，返回平均工资大于公司平均工资的所有作业代码：\n\n```\nproc sql;\n  \
  \ select jobcode, \n          avg(salary) as AvgSalary\n          format=dollar11.2\n\
  \      from sasuser.payrollmaster\n      group by jobcode\n      having avg(salary)\
  \ >\n         (select avg(salary)\n            from sasuser.payrollmaster);\n```\n\
  \n提示建议将子查询（内部查询）括在括号中，所示。子查询从表中选择一个或多行，然后向外部查询返回单个或多个值。上面的子查询是单值子查询；它向外部查询返回一个值，即该表的平均工资。子查询可以返回多行的值，但只针对单列。子查询引用的表可以是与外部查询引用的表相同，也可以不同。在上述\
  \ PROC SQL 查询中，子查询从相同的表中选择数据。\n\n## 子查询的类型\n\n有两种子查询。\n\n| 子查询类型 | 描述 |\n\n| ---\
  \ | --- |\n| 非相关 (noncorrelated) | 独立的子查询，不依赖外部查询执行 |\n| 相关 (correlated) | 依赖性子查询，在外部查询向其传递一个或多个值之前，子查询才能向外部查询返回值\
  \ |\n\n非相关和相关子查询都可以向外部查询返回单个或多个值。接下来的几节将深入探讨非相关和相关子查询以及它们是如何被处理的。\n\n\n\n\n最简单的子查询是返回单个值的非相关子查询。接下来的\
  \ `PROC SQL` 查询与上一节使用的查询相同。该查询显示了平均薪资超过公司平均薪资的职位代码（job codes）。`HAVING` 子句包含一个非相关子查询。\n\
  \n```\nproc sql;\n   select jobcode, \n          avg(salary) as AvgSalary \n   \
  \       format=dollar11.2\n      from sasuser.payrollmaster\n      group by jobcode\n\
  \      having avg(salary) >\n         (select avg(salary)\n            from sasuser.payrollmaster);\n\
  ```\n\n`PROC SQL` 始终会在外部查询之前评估非相关子查询。如果一个查询中包含多个层级的非相关子查询，`PROC SQL` 会先评估最内层的子查询，然后向外进行，最后评估最外层的查询。在上述所示的查询中，内部查询和外部查询的处理方式如下：\n\
  \n1. 为了完成 `HAVING` 子句中的表达式，子查询使用 `AVG` 汇总函数并以 `Salary` 为参数，计算整个公司（表中的所有行）的平均薪资。\n\
  2. 子查询将平均薪资的值返回给外部查询。\n3. 外部查询计算每个 `JobCode` 组（由 `GROUP BY` 子句定义）的平均薪资（在 `SELECT`\
  \ 子句中），并仅选择平均薪资大于公司平均薪资的组。\n\n查询输出所示![每个 JobCode 的平均薪资](img/m70-41-g1.png) 该非相关子查询仅向外部查询返回单个值，即整个公司的平均薪资。子查询和外部查询都使用相同的表作为源。\n\
  \n## 使用多值非相关子查询\n\n某些子查询是多值子查询：它们向外部查询返回多个值（行）。如果你的非相关子查询可能为多行返回值，请务必在 `WHERE` 或\
  \ `HAVING` 子句中使用以下可以处理多个值的运算符之一：\n\n-  条件运算符 `IN`\n- 由 `ANY` 或 `ALL` 修改的比较操作符\n\
  -  条件运算符 `EXISTS`\n\n**注意**：如果你创建了一个返回多个值的非相关子查询，但外部查询的 `WHERE` 或 `HAVING` 子句包含上述指定运算符之外的运算符，则查询会失败。SAS\
  \ 日志中会显示错误信息，指示子查询评估的结果多于一行。例如，如果你使用等号 (`=`) 运算符配合返回多个值的非相关子查询，查询将失败。等号运算符只能处理单个值。请考虑一个既包含条件运算符\
  \ `IN` 又包含返回多个值的非相关子查询的查询。（`ANY`、`ALL` 和 `EXISTS` 运算符将在本章稍后介绍。）\n\n## 示例\n\n假设你想向即将过生日的员工发送生日卡片。你决定创建一个\
  \ `PROC SQL` 查询，列出所有在 2 月份生日的员工姓名和地址。与上一页所示查询不同，此查询从两个不同的表中选取数据：\n\n- `Sasuser.Staffmaster`\
  \ 表中的员工姓名和地址\n- `Sasuser.Payrollmaster` 表中的员工出生日期\n\n在这两个表中，员工都通过员工识别码 (`EmpID`）来标识。在接下来的\
  \ `PROC SQL` 查询中，`WHERE` 子句包含条件运算符 `IN`，后跟一个非相关子查询：\n\n```\n proc sql;\n    select\
  \ empid, lastname, firstname, \n           city, state\n       from sasuser.staffmaster\n\
  \       where empid in\n          (select empid\n             from sasuser.payrollmaster\n\
  \             where month(dateofbirth)=2);\n```\n\n该查询的处理方式如下：\n\n1. 为了完成外部查询 `WHERE`\
  \ 子句中的表达式，子查询选取出生日期为 2 月的员工。注意子查询使用了 `MONTH` 函数。\n2. 随后，子查询将选定员工的 `EmpID` 值返回给外部查询。\n\
  3. 外部查询为子查询标识的员工显示数据（来自 `SELECT` 子句中标识的列）。\n\n如下所示所示列出了六位在 2 月份生日的员工![2 月份生日的员工](img/m70-43-g1.png)尽管使用内连接（inner\
  \ join）也能产生相同的结果，但在本例中使用子查询更好，因为输出中没有来自 `sasuser.payrollmaster` 表的列。\n\n## 使用子查询进行比较\n\
  \n有时，将一个值与子查询返回的一组值进行比较是有帮助的。当子查询可能返回多个值时，你必须使用条件运算符 `ANY` 或 `ALL` 之一，在 `WHERE`\
  \ 或 `HAVING` 子句中紧邻子查询之前修改比较运算符。例如，以下 `WHERE` 子句包含小于 (`<`) 比较运算符和条件运算符 `ANY`：\n\n\
  ```\nwhere dateofbirth < any\n   <subquery...>\n```\n\n**注意**：如果你创建了一个返回多个值的非相关子查询，且外部查询的\
  \ `WHERE` 或 `HAVING` 子句包含未被 `ANY` 或 `ALL` 修改的比较运算符，则查询会失败。当外部查询包含被 `ANY` 或 `ALL`\
  \ 修改的比较运算符时，外部查询将将其检索到的每个值与返回的值（值）进行比较。如果指定了 `ANY`，外部查询将与子查询返回的值进行比较。如果指定了 `ALL`，则只有在与子查询返回的所有值比较都为真时，该值才包含在输出中。\n\
  \n## 使用 ANY 运算符\n\n指定 `ANY` 运算符的外部查询会选取与子查询返回的任何值通过测试的值。例如，假设有一个外部查询包含以下 `WHERE`\
  \ 子句：\n\n`where dateofbirth < any`\n\n该子句指定 `DateofBirth`（操作数）小于子查询返回的 `any` 值（比较运算符）。下表显示了\
  \ `ANY` 与这些比较运算符配合：大于 (`>`)、小于 (`<`) 和等于 (`=`)。\n\n| 带 ANY 的比较运算符 | 外部查询选取... |\
  \ 示例 |\n| --- | --- | --- |\n| `> ANY` | 大于子查询返回的任何值 | 如果子查询返回 20, 30, 40，则外部查询选取所有\
  \ `> 20`（返回的最小值）的值 |\n| `< ANY` | 小于子查询返回的任何值 | 如果子查询返回 20, 30, 40，则外部查询选取所有 `<\
  \ 40`（返回的最大值）的值 |\n| `= ANY` | 等于子查询返回的任何值 | 如果子查询返回 20, 30, 40，则外部查询选取所有 `= 20`\
  \ 或 `= 30` 或 `= 40` 的值 |\n\n**提示**：与其在子查询中使用 `ANY` 运算符，不如可以使用某些 SAS 函数以更高的效率实现相同的结果。与其使用\
  \ `> ANY`，不如在子查询中使用 `MIN` 函数。与其使用 `< ANY`，不如在子查询中使用 `MAX` 函数。\n\n## 示例\n\n假设你想识别出比所有\
  \ 3 级空乘年龄大的 1 级或 2 级空乘。职位类型和级别在 `JobCode` 中标识；每个空乘的代码为 `FA1`、`FA2` 或 `FA3`。接下来的\
  \ `PROC SQL` 查询通过子查询和 `ANY` 运算符完成此任务。\n\n\n\n\n\n```\nproc sql;\n   select empid,\
  \ jobcode, dateofbirth\n      from sasuser.payrollmaster\n      where jobcode in\
  \ ('FA1','FA2')\n            and dateofbirth < any\n               (select dateofbirth\n\
  \                  from sasuser.payrollmaster\n                  where jobcode='FA3');\n\
  ```\n\n当处理此查询时，发生以下情况：\n\n1. 子查询返回所有 3 级空乘员的出生日期。\n2. 外部查询仅选择出生日期小于子查询返回的任何日期的 1\
  \ 级和 2 级空乘员。\n\n注意，外部查询和子查询都使用了同一张表。注意：在内部，SAS 将日期值表示为从 1960 年 1 月 1 日到指定日期的天数。例如，1991\
  \ 年 10 月 17 日的 SAS 日期为 `11612`。将日期表示为自参考日期的天数便于计算机存储它们并进行日历计算。然而，这些数字对用户没有意义，因此在大多数常用的表示法中，有多种格式用于显示日期和时间值。\n\
  \n下面是查询结果。\n![比 3 级年长的 1 级和 2 级空乘员](img/m70-47-g1.png)\n\n**提示** 使用 `ANY` 运算符解决此问题会导致大量的计算，增加处理时间。对于此示例，在子查询中使用\
  \ `MAX` 函数会更高效。替代方案如下：\n\n```\nwhere jobcode in ('FA1','FA2') \n      and dateofbirth\
  \ < \n         (select max(dateofbirth)\n            from [...]\n```\n\n关于 `MAX`\
  \ 函数的更多信息，请参见 SAS 文档。\n\n# 使用 ALL 运算符\n\n指定 `ALL` 运算符的外部查询会选择通过与子查询返回的所有值比较测试的值。下表显示了使用\
  \ `ALL` 配合常用比较运算符（大于 `>` 和小于 `<`）的效果。\n\n| 带有 `ALL` 的比较运算符 | 子查询返回的示例值 | 表示... |\n\
  | :--- | :--- | :--- |\n| `> ALL` | `(20, 30, 40)` | `> 40`（大于列表中的最大数字） |\n| `<\
  \ ALL` | `(20, 30, 40)` | `< 20`（小于列表中的最小数字） |\n\n## 示例\n\n在之前的查询中将 `ANY` 替换为 `ALL`。以下查询识别比所有\
  \ 3 级空乘员都年长的 1 级和 2 级空乘员：\n\n```\nproc sql;\n   select empid, jobcode, dateofbirth\n\
  \      from sasuser.payrollmaster\n      where jobcode in ('FA1','FA2')\n      \
  \      and dateofbirth < all\n               (select dateofbirth\n             \
  \     from sasuser.payrollmaster\n                  where jobcode='FA3');\n```\n\
  \n当处理此查询时，发生以下情况：\n\n1. 子查询返回所有 3 级空乘员的出生日期。\n2. 外部查询仅选择出生日期小于子查询返回的所有日期的 1 级和 2\
  \ 级空乘员。\n\n下面的查询结果显示，只有 1 级或 2 级空乘员比所有 3 级空乘员年长。\n![比所有 3 级年长的 1 级和 2 级空乘员](img/m70-48-g1.png)\n\
  \n**提示** 对于此示例，使用子查询中的 `MIN` 函数代替 `ALL` 运算符来解决此问题会更高效。替代的 `WHERE` 子句如下：\n\n```\n\
  where jobcode in ('FA1','FA2') \n      and dateofbirth <\n        (select min(dateofbirth)\n\
  \           from [...]\n```\n\n关于 `MIN` 函数的更多信息，请参见 SAS 文档。\n\n# 使用相关子查询筛选数据\n\n\
  ## 概述\n\n相关子查询无法独立评估，其结果取决于外部查询传递它们的值。相关子查询会对外部查询中的每一行进行评估，因此比非子查询需要更多的处理时间。\n\n\
  注意：通常，`PROC SQL` 链接是相关子查询更高效的替代方案。你应该已经熟悉基本的 `PROC SQL` 链接。\n\n## 示例\n\n考虑一个包含相关子查询的\
  \ `PROC SQL` 查询示例。以下查询显示所有同时也是经理的导航员名称。子查询中的 `WHERE` 子句列出了 `Staffmaster.EmpID`。外部查询必须将此列传递给相关子查询。\n\
  \n```\nproc sql;\n   select lastname, firstname\n      from sasuser.staffmaster\n\
  \      where empid = (select empid\n                    from sasuser.supervisors\n\
  \                    where staffmaster.empid = supervisors.empid);\n```\n\n注意：当一列出现在多个表时，列名之前会加上表名或别名以避免歧义。在本示例中，`empid`\
  \ 出现在两个表中，因此在对该列的每次引用之前都指定了相应的表名。此查询的输出如所示。有三个导航员同时也是经理。\n![作为经理的导航员列表](img/m70-51-g1.png)\n\
  \n# 使用 EXISTS 和 NOT EXISTS 条件运算符\n\n在 `WHERE` 子句或外部查询的 `HAVING` 子句中，你可以使用 `EXISTS`\
  \ 或 `NOT EXISTS` 条件运算符来测试子查询返回的值集是否存在。\n\n| 条件 | 如果满足则真 |\n| :--- | :--- |\n| `EXISTS`\
  \ | 子查询返回至少一行 |\n| `NOT EXISTS` | 子查询未返回数据 |\n\n注意：`EXISTS` 和 `NOT EXISTS` 运算符可以用于相关子查询和非子查询。\n\
  \n## 示例：带有 NOT EXISTS 的相关查询\n\n考虑一个包含 `NOT EXISTS` 条件运算符的示例 `PROC SQL` 查询。假设你有以下表：\n\
  \n* `Flightendants` 包含空乘员的姓名和员工 ID 号。\n* `Flightschedule` 每个日期对应一个行数据。\n\n如图所示，这两个表的交集包含了所有已安排工作的空乘员的数据。\n\
  ![已安排工作的空乘员](img/m70-g1.png)\n\n现在假设你想列出没有安排工作的空乘员。也就是说，你想识别下方高亮区域的数据。\n![已安排工作的空乘员，高亮未安排工作的部分](img/m70-g2.png)\n\
  \n以下 `PROC SQL` 查询通过使用相关子查询和 `NOT EXISTS` 运算符完成此任务：\n\n```\nproc sql;\n    select\
  \ lastname, firstname\n       from sasuser.flightendants\n       where not exists\n\
  \          (select *\n             from sasuser.flightschedule\n             where\
  \ flightendants.empid=flightschedule.empid);\n```\n\n输出所示。\n![未安排航班的员工列表](img/m70-g3.png)\n\
  \n### 验证查询语法\n\n## 概述\n\n当你构建 `PROC SQL` 查询时，可能会发现在不实际执行的情况下检查查询更高效。为了在不执行查询的情况下验证语法以及引用的列和表的存在性，请使用以下任一方法：\n\
  \n* `PROC SQL` 语句中的 `NOEXEC` 选项\n* `SELECT` 语句前的 `VALIDATE` 关键字\n\n考虑如何指定 `NOEXEC`\
  \ 选项和 `VALIDATE` 关键字，并检查它们之间的细微差异。\n\n## 使用 NOEXEC 选项\n\n在以下 `PROC SQL` 语句中指定了 `NOEXEC`\
  \ 选项：\n\n```\nproc sql noexec;\n   select empid, jobcode, salary\n      from sasuser.payrollmaster\n\
  \      where jobcode contains 'NA'\n      order by salary;\n```\n\n如果查询有效且所有引用的列和表存在，SAS\
  \ 日志将显示以下消息。\n\n表 2.5 SAS 日志\n\n| `NOTE: Statement not executed due to NOEXEC option.`\
  \ |\n\n\n\n\n\n或者，如果查询中有任何错误，SAS 会在日志中显示标准错误信息。当你调用 `NOEXEC` 选项时，SAS 会检查该 `PROC\
  \ SQL` 步骤中所有查询的准确性，但不执行它们。\n\n## 使用 `VALIDATE` 关键字\n\n你在 `SELECT` 语句之前指定 `VALIDATE`\
  \ 关键字；它不用于任何其他 `PROC SQL` 语句。我们将使用 `VALIDATE` 关键字代替 `NOEXEC` 选项来修改前面的 `PROC SQL`\
  \ 查询：\n\n```\nproc sql;\n   validate\n   select empid, jobcode, salary\n      from\
  \ sasuser.payrollmaster\n      where jobcode contains 'NA'\n      order by salary;\n\
  ```\n\n注意：注意 `VALIDATE` 关键字后面没有分号。如果查询有效，SAS 日志将显示以下消息。\n\n表 2.6 SAS 日志\n\n| `NOTE:\
  \ PROC SQL statement has valid syntax.` |\n\n如果查询中有错误，SAS 会在日志中显示标准错误信息。`VALIDATE`\
  \ 关键字与 `NOEXEC` 选项的主要区别在于，`VALIDATE` 关键字仅影响紧随其后的 `SELECT` 语句，而 `NOEXEC` 选项适用于 `PROC\
  \ SQL` 步骤中的所有查询。如果你正在处理包含多个 `SELECT` 语句的 `PROC SQL` 查询，则必须在你检查的每个 `SELECT` 语句之前指定\
  \ `VALIDATE` 关键字。\n\n### 附加功能\n\n除了 `SELECT` 语句外，`PROC SQL` 还支持以下语句。\n\n| 语句 | 用途\
  \ ... |\n| --- | --- |\n| `ALTER TABLE expression;` | 在表中添加、删除和修改列 |\n| `CREATE\
  \ expression;` | 构建新表、视图或索引 |\n| `DELETE expression;` | 从表或视图中删除不需要的行 |\n| `DESCRIBE\
  \ expression;` | 显示表和视图的属性 |\n| `DROP expression;` | 删除整个表、视图或索引 |\n| `INSERT expression`\
  \ | 向表或视图添加数据行 |\n| `RESET <option(s)>;` | 在不重新调用过程的情况下添加或更改 `PROC SQL` 选项 |\n|\
  \ `UPDATE expression;` | 修改表或视图现有行中的数据值 |\n\n## 总结\n\n## 文本总结\n\n### 查看 `SELECT`\
  \ 语句语法\n\n`SELECT` 语句及其从句是你用于构建所有 `PROC SQL` 查询的构建组件。\n\n### 显示所有列\n\n要按照列在表中的存储顺序显示所有列，请在\
  \ `SELECT` 子句中使用 `*`。要将展开的列列表写入 SAS 日志，请在 `PROC SQL` 语句中使用 `FEEDBACK` 选项。\n\n###\
  \ 限制显示的行数\n\n要限制 `PROC SQL` 输出输出的行数，请在 `PROC SQL` 语句中使用 `OUTOBS=n` 选项。\n\n### 从输出中消除重复行\n\
  \n要从查询结果中消除重复行，请在 `SELECT` 子句中使用 `DISTINCT` 关键字。\n\n### 使用条件运算符划分行子集\n\n在 `PROC\
  \ SQL` 查询中，使用 `WHERE` 子句配合任何有效的 SAS 表达式对数据划分子集。SAS 表达式可以包含一个或多个运算符，包括以下条件运算符：\n\n\
  - `BETWEEN-AND` 运算符选择闭区间值范围内的值\n- `CONTAINS` 或 `?` 运算符选择字符字符串\n- `IN` 运算符从固定值列表中选择\n\
  - `IS MISSING` 或 `IS NULL` 运算符选择缺失值\n- `LIKE` 运算符选择模式\n- `sounds-like` (`=*`) 运算符选择拼写变体\n\
  \n### 使用计算值划分行子集\n\n理解 `PROC SQL` 如何处理计算列是非常重要的。当你在 `WHERE` 子句中使用列别名来引用计算值时，你必须配合别名使用\
  \ `CALCULATED` 关键字。\n\n### 增强查询输出\n\n你可以通过 SAS 增强功能（如列格式和标签、标题和脚注，以及字符限制）来增强 `PROC\
  \ SQL` 查询输出。\n\n### 汇总和分组\n\n`PROC SQL` 计算汇总函数并以不同的方式输出结果，这取决于因素的组合：\n\n- 汇总函数是否指定了一个或多个多个列作为参数\n\
  - 查询是否包含 `GROUP BY` 子句\n- 如果在 `SELECT` 子句中指定了汇总函数，是否还列出了汇总函数之外的其他列\n- `WHERE` 子句（如果有）是否仅包含\
  \ `SELECT` 子句中指定的列。\n\n要计算非缺失值的计数，请使用 `COUNT` 汇总函数。要选择要显示的组，请在 `GROUP BY` 子句之后使用\
  \ `HAVING` 子句。当你在 `SELECT` 子句或 `HAVING` 子句中使用汇总函数时，在某些情况下 `PROC SQL` 必须重新合并数据。当\
  \ `PROC SQL` 重新合并数据时，会对数据进行两次扫描，这需要额外的处理时间。\n\n### 使用子查询划分数据\n\n在 `PROC SQL` 查询的\
  \ `WHERE` 子句或 `HAVING` 子句中，你可以使用子查询对数据划分子集。子查询是嵌套在另一个查询中并作为其一部分查询。子查询可以向外部查询返回单行或多行的值，但只能返回单列的值。\n\
  \n### 使用非相关子查询划分数据\n\n非相关子查询独立于外部查询执行执行。你可以使用返回单个值或多个值的非相关子查询。为了进一步限定在 `WHERE` 子句或\
  \ `HAVING` 子句中指定的比较，可以使用 `ANY` 和 `ALL` 运算符配合非相关（或相关）子查询。\n\n### 使用相关子查询划分数据\n\n\
  相关子查询无法独立评估，因为它们的结果依赖于外部查询返回的值。在外部查询的 `WHERE` 子句或 `HAVING` 子句中，你可以使用 `EXISTS` 和\
  \ `NOT EXISTS` 运算符测试子查询返回的值集的存在或不存在性。\n\n### 验证查询语法\n\n要在不实际执行查询的情况下检查查询的有效性，请使用\
  \ `NOEXEC` 选项或 `VALIDATE` 语句。\n\n### 附加功能\n\n除了 `SELECT` 语句外，`PROC SQL` 支持许多语句。\n\
  \n## 示例程序\n\n### 在输出中显示所有列并在日志显示展开列表\n\n```\nproc sql feedback;\n   select *\n \
  \     from sasuser.staffchanges;\nquit;\n```\n\n### 从输出中消除重复行\n\n```\nproc sql;\n\
  \   select distinct flightnumber, destination\n      from sasuser.internationalflights\n\
  \      order by 1;\nquit;\n```\n\n### 使用计算值划分行子集\n\n```\nproc sql outobs=10;\n \
  \  validate\n   select flightnumber, destination,\n          boarded + transferred\
  \ + nonrevenue\n          as Total\n      from sasuser.marchflights\n      where\
  \ calculated total between 100 and 150;\nquit;\n```\n\n### 使用非相关子查询划分数据\n\n```\n\
  proc sql noexec;\n   select jobcode,\n          avg(salary) as AvgSalary\n     \
  \     format=dollar1.2\n      from sasuser.payrollmaster\n      group by jobcode\n\
  \      having avg(salary) >\n         (select avg(salary)\n            from sasuser.payrollmaster);\n\
  quit;\n```\n\n### 使用相关子查询划分数据\n\n```\nproc sql;\ntitle '不是员工的频繁飞行客';\n   select\
  \ count(*) as Count\n      from sasuser.frequentflyers\n      where not exists\n\
  \         (select *\n            from sasuser.staffmaster\n            where name=\n\
  \                  trim(lastname)||', '||firstname);\nquit;\n```\n\n## 注意事项\n\n\
  - 当你使用汇总函数时，注意缺失值。如果表中包含缺失值，你的结果可能不符合预期。许多汇总函数在计算时会忽略缺失值，且 `PROC SQL` 将列中的缺失值视为一个组。\n\
  - 当你创建复杂查询时，使用 `NOEXEC` 选项或 `VALIDATE` 语句来验证查询而不执行它是有帮助的。\n\n# 测验\n\n\n\n\n为每个问题选择最佳答案。完成测验后，请使用附录中的答案键检查您的答案。\n\
