  \ sasuser.all;\n           if location='Boston' then do;\n              call symput('region',\
  \ 'East');\n           end;\n           else do;\n              call symput('region',\
  \ 'West');\n           end;\n        run;\n        ```\n    2.\n        ```\n  \
  \      data new;\n           set sasuser.all;\n           if location='Boston' then\
  \ do;\n              %let region=East;\n           end;\n           else\n     \
  \         %let region=West;\n           end;\n        run;\n        ```\n    3.\n\
  \        ```\n        data new;\n           set sasuser.all;\n           if location='Boston'\
  \ then do;\n              call symput('region', 'East');\n           end;\n    \
  \       else do\n              call symput('region', 'West');\n           end;\n\
  \        run;\n        ```\n    4.\n        ```\n        data new;\n           set\
  \ sasuser.all;\n           if location='Boston' then do;\n              %let region=East;\n\
  \           end;\n           else\n              %let region=West;\n           end;\n\
  \        run;\n        ```\n\n3. `SYMPUT` 例程不能\n    1. 将数据集变量赋值给宏变量。\n    2. 在 `DATA`\
  \ 步骤中用于更新宏变量。\n    3. 在 `DATA` 步骤执行期间将数值值转换为字符值进行赋值。\n    4. 在 `SCL` 程序中用于创建宏变量。\n\
  \n4. 下列哪个程序正确创建了一系列以数据集变量 `Course_code` 为值的宏变量，然后在后续步骤中间接引用这些宏变量？\n\n    1.\n  \
