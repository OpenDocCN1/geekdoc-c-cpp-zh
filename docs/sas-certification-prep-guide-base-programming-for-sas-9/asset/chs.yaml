  \n如果你在程序文本中使用错误的大小写来构造 `%IF` 语句，该语句将永远为真。例如，下面的 `%IF` 语句始终为假，因为 `_null_` 以小写形式指定，但在\
  \ SAS 中始终以大写形式存储：\n\n```\n%macro prtlast;\n   %if &syslast=_null_ %then %do;\n \
  \     %put No data sets created yet.;\n   %end;\n   %else %do;\n      proc print;\n\
  \         title \"Last Created Data Set is &syslast\";\n      run;\n   %end;\n%mend;\n\
  options mprint mlogic symbolgen;\n%prtlast\n```\n\n假设当你提交此示例时 `SYSLAST` 的值为 `_NULL_`。以下信息被写入了\
  \ SAS 日志。\n\n表 11.19 SAS 日志\n\n|  \n\n```\n29   %prtlast\nMLOGIC(PRTLAST): Beginning\
  \ execution.\nSYMBOLGEN: Macro variable SYSLAST resolves to _NULL_\nMLOGIC(PRTLAST):\
  \ %IF condition &syslast = _null_ is FALSE\n\nNOTE: The SAS System stopped processing\
  \ this step because of errors.\nNOTE: PROCEDURE PRINT used:\n      real time   \
  \        1:32.58\n      cpu time            0.05 seconds\n\nMPRINT(PRTLAST): proc\
  \ print;\nERROR: There is not a default input data set (_LAST_ is _NULL_).\nSYMBOLGEN:\
  \ Macro variable SYSLAST resolves to _NULL_\nMPRINT(PRTLAST): title \"Last Created\
  \ Data Set is _NULL_\";\nMPRINT(PRTLAST): run;\n\nNOTE: The SAS System stopped processing\
  \ this step because of errors.\nNOTE: PROCEDURE PRINT used:\n      real time   \
  \        0.01 seconds\n      cpu time            0.01 seconds\nMLOGIC(PRTLAST):\
