  \ 连接中与表结合。\n4. 此 `PROC SQL` 查询包含一个使用有效语法的内联视图：\n\n```sql\nproc sql;\n   select name,\
  \ numvisits\n      from (select name, sum(checkin) \n           as numvisits\n \
  \             from facility as f, members as m\n              where area='POOL'\
  \ and\n                    f.id=m.id\n              group by name)\n      where\
  \ numvisits<=10\n      order by name\n```\n\n8. 哪个 `PROC SQL` 查询与所示的 `DATA` 步骤产生相同的输出？\n\
  \n```sas\ndata merged;\n   merge table1 table2;\n   by g3;\nrun;\n```\n\n| ![Table1,\
  \ Table2 和 Merged 表](img/m71-39-g17.png) |\n\n1. ```sql\nproc sql;\n   select a.*,\
  \ z\n      from table1 as a\n      left join\n          table2 as b\n      on a.g3=b.g3;\n\
  ```\n2. ```sql\nproc sql;\n   select a.*, z\n      from table1 as a\n      full\
  \ join\n          table2 as b\n      on a.g3=b.g3;\n```\n3. ```sql\nproc sql;\n\
  \   select a.*, z\n      from table1 as a\n      inner join\n          table2 as\
  \ b\n      on a.g3=b.g3;\n```\n4. ```sql\nproc sql;\n   select a.*, z\n      from\
  \ table1 as a\n      right join\n          table2 as b\n      on a.g3=b.g3;\n```\n\
  \n9. `PROC SQL` 内连接可以合并\n\n1. 链的表。\n2. 最多 256 个表或内联视图。\n3. 最多 256 个表，包括任何表。\n4.\
  \ 2 列。\n\n10. 关于使用表别名的哪个描述是错误的？\n\n1. 当引用不同库中的相同名称时，必须使用表别名。\n2. 表别名可以通过 `AS` 关键字进行引用。\n\
  3. 当引用在两个表中均相同的列名时，必须使用表别名（或完整的表名）。\n4. 在使用聚合函数时必须使用表别名。\n\n\n\n\n\n每个集合操作符以不同的方式合并查询结果。在本章中，你将学习如何使用各种集合操作符（带有或不带可选关键字\
  \ `ALL` 和 `CORR`（`CORRESPONDING`））来合并多个查询的结果。注意：在本章中，除非另有说明，对表的引用也适用于视图。\n\n# 理解集合操作\n\
  \n## 概述\n\n一个集合操作包含：\n* 查询（每个都以 `SELECT` 子句开头）\n* 一个集合操作符\n* `ALL` 和 `CORR`（`CORRESPONDING`）关键字中的一个\n\
  \n使用集合操作符的 SQL 查询通用形式：`SELECT column-1<, ... column-n>FROM table-1 | view-1<, ...\
  \ table-n | view-n><optional query clauses>set-operator <ALL> <CORR>SELECT column-1<,\
  \ ... column-n>FROM table-1 | view-1<, ... table-n | view-n><optional query clauses>;`\n\
  \n以下是该语法的解释：\n`SELECT` 指定将出现在结果中的列。\n`FROM` 指定要查询的表或视图。\n`optional query clauses`\
  \ 用于进一步细化查询，包含 `WHERE`、`GROUP BY`、`HAVING` 和 `ORDER BY` 子句。\n* `set-operator` 是以下内容之一：`EXCEPT`\
  \ | `INTERSECT` | `UNION` | `OUTER UNION`。\n* 可选关键字 `ALL` 和 `CORR`（`CORRESPONDING`）进一步修改集合操作。\n\
  \n查询或集合操作包含一个分号，放在最后一个 `SELECT` 语句之后。\n\n## 示例\n\n在下面的 PROC SQL 步骤中，`SELECT` 语句包含一个集合操作。该集合操作使用集合操作符\
  \ `UNION` 将对表 `Sasuser.Stress98` 的查询结果与对表 `Sasuser.Stress99` 的查询结果合并。\n\n```\nproc\
  \ sql;\n   select *\n      from sasuser.stress98\n   union\n   select *\n      from\
  \ sasuser.stress99;\n```\n\n你将在本章后面的部分学习使用每个集合操作符的细节。\n\n## 处理单个集合操作\n\nPROC SQL\
  \ 评估带有一个集合操作的 `SELECT` 语句如下：\n1. 评估每个查询以产生中间（内部）结果表。\n2. 每个中间结果表然后变成与集合操作符链接的操作数，形成一个表达式（例如，`Table1\
  \ UNION Table2`）。\n3. PROC SQL 评估整个表达式以产生单个的输出结果集。\n\n## 使用多个集合操作符\n\n单个 `SELECT`\
  \ 语句可以包含多个集合操作。每个额外的集合操作包含一个集合操作符和一组查询子句，如下所示：\n\n```\nproc sql;\n   select *\n\
  \      from table1\n   set-operator\n   select *\n      from table2\n   set-operator\n\
  \   select *\n      from table3;\n```\n\n此 `SELECT` 语句使用两个集合操作符将三个查询连接在一起。无论 `SELECT`\
  \ 语句中有多少个集合操作，该语句只包含一个分号，放在最后一个查询之后。\n\n## 示例\n\n下面的 PROC SQL 步骤包含两个集合操作符（都是 `OUTER\
  \ UNION`），它们合并了三个查询：\n\n```\n proc sql; \n    select *\n       from sasuser.mechanicslevel1\n\
  \    outer union\n    select *\n       from sasuser.mechanicslevel2\n    outer union\n\
  \    select *\n       from sasuser.mechanicslevel3;\n```\n\n## 处理多个集合操作\n\n当 PROC\
  \ SQL 评估包含多个集合操作 `SELECT` 语句时，需要一个额外的处理步骤（下述步骤 3）：\n1. 评估每个查询以产生中间（内部）结果表。\n2. 每个中间结果表然后变成与集合操作符链接的操作数，形成一个表达式（例如，`Table1\
  \ UNION Table2`）。\n3. 如果集合操作包含两个以上的查询，则前两个查询的结果（在下面的示例中用括号括起来）将成为下一个集合操作符和操作的操作数。例如：\n\
  \    * 使用两个集合操作符：`(Table1 UNION Table2) EXCEPT Table3`\n    * 使用三个集合操作符：`((Table1\
  \ UNION Table2) EXCEPT Table3) INTERSECT Table4`。\n4. PROC SQL 评估整个表达式以产生单个的输出结果集。\n\
  \n注意：在处理集合操作符时，PROC SQL 遵循默认的优先级，除非该顺序被表达式中的括号覆盖。默认情况下，`INTERSECT` 先被评估。`OUTER UNION`、`UNION`\
  \ 和 `EXCEPT` 的优先级相同。\n\n## 介绍集合操作符\n\n四个集合操作符 `EXCEPT`、`INTERSECT`、`UNION` 和 `OUTER\
  \ UNION` 各都以不同的方式选择行和处理列，如下所示。注意：在下表中，`Table 1` 是第一个查询引用的表，`Table 2` 是第二个查询引用的表。\n\
  \n| 集合操作符 | 行的处理 | 列的处理 | 示例 |\n| --- | --- | --- | --- |\n| `EXCEPT` | 从第一个表中选择在第二个表中未找到唯一行![Venn\
  \ Diagram，EXCEPT 操作符](img/m72-4g1.png) | 根据列在 `SELECT` 子句中的位置进行重叠，而不考虑具体的列名。 | <br>```proc\
  \ sql;\n    select *\n       from table1\n    except\n    select *\n       from\
  \ table2;\n``` |\n| `INTERSECT` | 选择两个表中共有的唯一行![Venn Diagram，INTERSECT 操作符](img/m72-4g2.png)\
  \ | 根据列在 `SELECT` 子句中的位置进行重叠，而不考虑具体的列名。 | <br>```proc sql;\n    select *\n     \
  \  from table1\n    intersect\n    select *\n       from table2;\n``` |\n| `UNION`\
  \ | 从两个表中选择唯一行![Venn Diagram，UNION 操作符](img/m72-4g3.png) | 根据列在 `SELECT` 子句中的位置进行重叠，而不考虑具体的列名。\
  \ | <br>```proc sql;\n    select *\n       from table1\n    union\n    select *\n\
  \       from table2;\n``` | |\n| `OUTER UNION` | 选择两个表的所有行。`OUTER UNION` 操作符拼接查询结果![Venn\
  \ Diagram，OUTER UNION 操作符](img/m72-4g4.png) | 不进行列重叠。 | <br>```proc sql;\n    select\
  \ *\n       from table1\n    outer union\n    select *\n       from table2;\n```\
  \ |\n\n注意：选择唯一行的集合操作符在输出中仅显示一次行。\n\n## 处理唯一行与重复行\n\n在处理仅显示唯一行的集合操作（包含集合操作符 `EXCEPT`、`INTERSECT`\
  \ 或 `UNION` 的集合操作）时，PROC SQL 默认对数据进行两次扫描：\n1. PROC SQL 消除表中的重复（非唯一）行。\n2. PROC SQL\
  \ 选择符合行并在需要时重叠列。\n\n对于同时显示唯一行和重复行的集合操作，只需要对数据进行一次扫描（上述步骤 2）。\n\n## 合并重叠列\n\n\n\n\
  \n\n您可以使用集合操作来合并列数和行数不同，或者列的顺序不同的表。四个集合操作符中的三个（`EXCEPT`、`INTERSECT` 和 `UNION`）通过叠加（overlaying）来合并列。（集合操作符\
  \ `OUTER UNION` 不会进行列重叠。）\n\n默认情况下，集合操作符 `EXCEPT`、`INTERSECT` 和 `UNION` 根据列在 `SELECT`\
  \ 子句中的相对位置进行列重叠。列名会被忽略。您可以通过在 `SELECT` 子句中按相应的顺序指定列，来控制 `PROC SQL` 如何将一个表中的列映射到另一个表的列。第一个查询的\
  \ `SELECT` 子句中指定的第一个列与第二个查询的 `SELECT` 子句中指定的第一个列重叠，依此类推。\n\n当对列进行重叠时，`PROC SQL`\
  \ 使用来自第一张表（第一个查询中引用的表）的列名。如果第一张表中没有列名，则使用第二张表中的列名。当 `SELECT` 子句中包含星号（`*`）而不是列名列表时，集合操作将根据列在表中的位置合并表（并且，如果适用，重叠列）。\n\
  \n例如，下面的集合操作使用了集合操作符 `EXCEPT`，因此列会被重叠。每个查询的 `SELECT` 子句都使用星号（`*`），因此列根据它们在表中的位置进行重叠。表\
  \ `One` 中的第一列（`X`）与表 `Two` 中的第一列（`X`）重叠，依此类推。\n\n| ```\nproc sql;\n   select *\n\
  \      from one\n   except\n   select *\n      from two;\n``` | ![Tables One, Two,\
  \ and Combined, Overlaid Table](img/m72-5-g1.png) |\n\n为了能够重叠，两个 `SELECT` 子句中相同相对位置的列必须具有相同的数据类型。如果类型不同，`PROC\
  \ SQL` 会 SAS 日志中生成警告消息并停止执行。例如，在上述表中，如果列 `One.X` 的数据类型与列 `Two.X` 不同，SAS 日志将显示以下错误信息。\n\
  \n表 4.1 SAS Log\n\n| ```\nERROR: Column 1 from the first contributor of EXCEPT \n\
  is not the same type as its counterpart from the second.\n``` | |\n\n接下来，我们使用关键字\
  \ `ALL` 和 `CORR` 来修改集合操作符的默认行为。\n\n# 使用关键字修改结果\n\n要修改集合操作符的行为，您可以在集合操作符之后立即使用关键字\
  \ `ALL` 或 `CORR` 的其中一个或两者：\n\n```\nproc sql;\n   select *\n      from table1\n \
  \  set-operator <all> <corr> \n   select *\n      from table2;\n```\n\n下面描述了每个关键字的用法。\n\
  \n| 关键字 | 操作 | 适用场景... |\n| --- | --- | --- |\n| `ALL` | 对数据进行单次扫描且不删除重复行。 | 您不在乎是否有重复项。不存在重复项。`ALL`\
  \ 不能与 `OUTER UNION` 一起使用。 |\n| `CORR` (或 `CORRESPONDING`) | 按名而不是按位置比较并重叠列：* 与 `EXCEPT`、`INTERSECT`\
  \ 和 `UNION` 使用时，移除两个表中名称不相同的任何列。* 与 `OUTER UNION` 使用时，重叠同名列并显示名称不匹配的列而不叠加。如果 `SELECT`\
  \ 子句中的列分配了别名，`CORR` 将使用别名而不是永久列名。 | 两个表具有某些或所有公共列，但列的顺序不同。 |\n\n在本章的剩余部分，您将学习更多关于每个集合操作符的使用，以及带有关键字\
  \ `ALL` 和 `CORR`。\n\n# 使用 EXCEPT 集合操作符\n\n## 概述\n\n集合操作符 `EXCEPT` 同时执行以下操作：\n\n\
  * 从第一张表（第一个查询指定的表）中选择第二张表（第二个查询指定的表）中未找到的唯一行\n* 重叠列。\n\n![overlays columns](img/m72-4g1.png)\
  \ 考虑 `EXCEPT` 在单独使用以及与关键字 `ALL` 和 `CORR` 使用时的工作原理。\n\n## 单独使用 EXCEPT 操作符\n\n假设您想显示表\
  \ `One` 中不在表 `Two` 中的唯一行。对应的包含 `EXCEPT` 操作符、表 `One` 和 `Two` 以及集合操作输出的 `PROC SQL`\
  \ 集合操作所示：\n\n| ```\nproc sql;\n   select *\n      from one\n   except\n   select\
  \ *\n      from two;\n``` | ![Tables One, Two, and Output](img/m72-9-g1.png) |\n\
  \n集合操作符 `EXCEPT` 按位置重叠列。在输出输出中，以下列被重叠了：\n\n* 第一列，`One.X` 和 `Two.X`，两者均为数值型\n* 第二列，`One.A`\
  \ 和 `Two.B`，均为字符型。\n\n使用了来自表 `One` 的列名，因此输出的第二列命名为 `A` 而不是 `B`。考虑 `PROC SQL` 如何从表\
  \ `One` 中选择行显示在输出中。在第一次扫描中，`PROC SQL` 消除了表中的任何重复行。如下所示，有一个重复行：在表 `One` 中。`PROC SQL`\
  \ 从表 `One` 中选择行显示在输出中的过程如下：\n\n```\nproc sql;\n   select *\n      from one\n   except\n\
  \   select *\n      from two;\n``` ![Tables One and Two](img/m72-9-g2.png)\n\n在第二次扫描中，`PROC\
  \ SQL` 识别表 `One` 中在表 `Two` 中有匹配的行并消除它们。如下所示，有一个匹配行被消除：\n\n```\nproc sql;\n   select\
  \ *\n      from one\n   except\n   select *\n      from two;\n``` ![Tables One and\
  \ Two](img/m72-9-g3.png)\n\n表 `One` 中剩余的所有行显示在输出中。![m72-g4.png## 在 EXCEPT 操作符使用关键字\
  \ ALL 要选择第一表中所有行（包括唯一和重复的）且在第二表中未出现的行，请在 `EXCEPT` 操作符之后添加关键字 `ALL`。修改后的 `PROC SQL`\
  \ 集合操作、表 `One` 和 `Two` 以及输出所示：``` ```proc sql;   select *      from one   except\
  \ all   select *      from two;``` | ![Tables One, Two, and Output](img/m72-10-g1.png)\
  \ |\n\n输出现在包含六行。`PROC SQL` 再次消除了表 `One` 中在表 `Two` 中匹配的行（第五行）。记住，当与 `EXCEPT` 操作符使用关键字\
  \ `ALL` 时，`PROC SQL` 不会对数据进行额外扫描以删除表 `One` 中的重复行。因此，表 `One` 中的第二行现在被包含在输出中。\n\n\
  ## 在 EXCEPT 操作符使用关键字 CORR\n\n要显示以下内容，请在集合操作符之后添加关键字 `CORR`：\n\n* 仅名称相同的列\n* 第一表中未出现在第二表的所有唯一行\n\
  \n修改后的 `PROC SQL` 集合操作、表 `One` 和 `Two` 以及输出所示：\n\n| ```\nproc sql;\n   select *\n\
  \      from one\n   except corr\n   select *\n      from two;\n``` | ![Tables One,\
  \ Two, and Output](img/m72-10-g2.png) |\n\n`X` 是两个表中名称相同的列，因此 `X` 是 `PROC SQL` 检查并显示在输出中的唯一列。在第一次扫描中，`PROC\
  \ SQL` 从输出中消除了表 `One` 的第二行和第三行，因为它们在表中不是唯一的；它们包含的 `X` 值重复了表 `One` 第一行的 `X` 值。在第二次扫描中，`PROC\
  \ SQL` 消除了表 `One` 的第一行、第四行和第五行，因为每每行包含的 `X` 值都匹配表 `Two` 中某行的 `X` 值。输出显示了表 `One`\
  \ 中剩余的两个行，即在表 `One` 中唯一且在表 `Two` 中没有具有匹配 `X` 值的行。\n\n\n\n\n当关键字 `ALL` 和 `CORR` 一起使用时，`EXCEPT`\
  \ 算符会显示第一个表中所有未在第二个表中出现的唯一和重复行，并叠加且仅显示具有相同名称的列。修改后的 `PROC SQL` 集合操作、表 `One` 和 `Two`\
  \ 以及输出所示：\n\n```\nproc sql;\n   select *\n      from one\n   except all corr\n \
  \  select *\n      from two;\n```\n\n|  | ![Tables One, Two, and Output](img/m72-10-g3.png)\
  \ |\n\n再次，`PROC SQL` 仅查看并显示两个表中具有相同名称的列：`X`。由于使用了 `ALL` ，`PROC SQL` 不会消除表 `One`\
  \ 中的任何重复行。因此，表 `One` 中的第二行和第三行（它们是表 `One` 第一行的重复）出现在输出中。`PROC SQL` 确实从输出中消除了表 `One`\
  \ 的第一、第四行和第五行，因为对于这三行中的每一行，表 `Two` 中都有一个具有匹配 `X` 行。正如示例所示，当在使用 `EXCEPT` 算符配合 `ALL`\
  \ 关键字时，除非表 `One` 中的行在表 `Two` 中有一个独立的匹配行，否则该行无法从输出中消除。表 `One` 包含三行 `X` 值为 1 的行，但表\
  \ `Two` 只有一行 `X` 值为 1。表 `Two` 中的那一行导致了表 `One` 中三个具有匹配 `X` 值的第一行被从输出中消除。然而，表 `Two`\
  \ 并没有另外两个 `X` 值为 1 的行，因此表 `One` 的另外两行没有被消除，并出现在输出中。\n\n## 示例：EXCEPT 算符\n\n`EXCEPT`\
  \ 算符可以解决真实的业务问题。假设你想显示公司所有新员工的姓名。没有哪个表专门包含新员工的信息，因此你使用了以下两个表的数据。\n\n| 表 | 相关列 |\n\
  | --- | --- |\n| `Sasuser.Staffchanges` 列出所有新员工以及薪水或职位代码发生变化的现有员工的信息 | `FirstName,\
  \ LastName` |\n| `Sasuser.Staffmaster` 列出所有现有员工的信息 | `FirstName, LastName` |\n\n\
  这两个表之间的关系如下图所示：![EXCEPT Operator](img/m72-12g1.png) 这两个表的交集包含了所有职位代码或薪水发生变化的现有员工的信息。阴影部分（即\
  \ `Sasuser.Staffchanges` 中与 `Sasuser.Staffmaster` 不重叠的部分）包含了你想要的信息：新员工。为了将 `Sasuser.Staffchanges`\
  \ 中的新员工与现有员工隔离开，你创建了一个集合操作，显示第一个表（`Sasuser.Staffchanges`）中不存在于第二个表（`Sasuser.Staffmaster`）的所有行。以下\
  \ `PROC SQL` 步骤解决了此问题：\n\n```\nproc sql;\n   select firstname, lastname\n      from\
  \ sasuser.staffchanges\n   except all\n   select firstname, lastname\n      from\
  \ sasuser.staffmaster;\n```\n\n此 `PROC SQL` 集合操作包含了算符 `EXCEPT` 和关键字 `ALL`。虽然你不希望输出包含重复行，但你已经知道这两个表之间没有重复项。因此，指定\
  \ `ALL` 是为了防止 `PROC SQL` 对数据进行额外扫描，从而加快此查询的处理速度。`PROC SQL` 仅比较 `SELECT` 子句中指定的列，并且这些列按照它们指定的顺序进行比较。输出显示了两个新员工的姓和名。![PROC\
  \ SQL set operation](img/m72-12-g1.png) 注意：在使用 `EXCEPT` 算符的集合操作中，表在 `SELECT` 语句中列出的顺序是有区别的。如果此示例中的表顺序反过来，输出将显示所有薪水或职位代码没有发生变化的现有员工。\n\
  \n## 示例：内联视图中的 EXCEPT 算符\n\n此示例是前一个集合操作的变体。假设你想显示薪水或职位代码没有变化的现有员工人数。再次，查询使用了以下表和列。\n\
  \n| 表 | 相关列 |\n| --- | --- |\n| `Sasuser.Staffchanges` 列出所有新员工以及薪水或职位代码发生变化的现有员工的信息\
  \ | `FirstName, LastName` |\n| `Sasuser.Staffmaster` 列出所有现有员工的信息 | `FirstName, LastName`\
  \ |\n\n以下 `PROC SQL` 查询解决了这个问题：\n\n```\nproc sql;\n   select count(*) label='No.\
  \ of Persons'\n      from (select EmpID\n              from sasuser.staffmaster\n\
  \            except all\n            select EmpID\n              from sasuser.staffchanges);\n\
  ```\n\n此 `PROC SQL` 查询使用了：\n- `COUNT` 函数并以星号（`*`）作为参数，用于计算集合操作返回的员工 ID 数量\n- 内联视图中的集合算符\
  \ `EXCEPT`。\n\n内联视图返回一个包含薪水或职位代码没有变化的员工的虚拟表。然后将此虚拟表传递给 `COUNT(*)` 汇总函数，该函数计算虚拟表中的行数。输出显示了没有薪水或职位代码变化的现有员工人数![PROC\
  \ SQL with COUNT](img/m72-13)\n\n# 使用 INTERSECT 集合算符\n\n## 概述\n\n`INTERSECT` 算符执行以下两个操作：\n\
  - 选择两个表中共同的行\n- 叠加列\n\n![overlays columns](img/m72-4g2.png) 以下示例展示了其工作方式\n\n## 单独使用\
  \ INTERSECT 算符\n\n`INTERSECT` 算符以与 `EXCEPT` 算符相同的方式比较并叠加列，但按列位置而不是列名。然而，`INTERSECT`\
  \ 选择行的方式不同，它显示两个表中共同的行。以下 PROC SQL 集合操作使用了之前两个表 `One` 和 `Two`：\n\n|  | |\n\n```\n\
  proc sql;\n   select *\n      from one\n   intersect\n   select *\n      from two;\n\
  ```\n\n| ![Tables One, Two, and Output](img/m72-15-g1.png) |\n\n表 `One` 和 `Two`\
  \ 只有一个共同行，该行出现在输出中。（这是包含 `EXCEPT` 算符的示例中被消除的同一行。）\n\n## 在 INTERSECT 算符中使用关键字 ALL\n\
  \n在之前的 `PROC SQL` 查询中添加 `ALL` 关键字可以防止 `PROC SQL` 对数据进行额外扫描。如果表 `One` 和 `Two` 之间存在任何其他共同行的重复项，它们也将被包含在输出中。然而，正如你所看到的，这些表中只有一个共同行。修改后的\
  \ `PROC SQL` 查询等所示：\n\n|  | |\n\n```\nproc sql;\n   select *\n      from one\n \
  \  intersect all\n   select *\n      from two;\n```\n\n| ![Tables One, Two, and\
  \ Output](img/m72-16-g1.png) |\n\n与之前一样，输出只有一行。\n\n## 在 INTERSECT 算符中使用关键字 CORR\n\
  \n要根据列名而不是列位置显示两个表中共同的唯一行，请在 `PROC SQL` 集合操作中添加 `CORR` 关键字。修改后的查询、表 `One` 和 `Two`\
  \ 以及输出所示：\n\n|  | |\n\n```\nproc sql;\n   select *\n      from one\n   intersect\
  \ corr\n   select *\n      from two;\n```\n\n| ![Tables One, Two, and Output](img/m72-16-g2.png)\
  \ |\n\n\n\n\n`X` 是两个表中共同的唯一列名，因此 `X` 是 `PROC SQL` 检查并在输出中显示的唯一列项。在第一轮处理中，`PROC SQL`\
  \ 删除了每个表内部重复的行：表 `One` 中的第二行和第三行其 `X` 值与第一行相同，而表 `Two` 中的第四行其 `X` 值与第三行相同。在第二轮处理中，`PROC\
  \ SQL` 删除了任何在两个表间不共同的行：表 `One` 中的第四行、第五行，以及表 `Two` 中的第五行在另一个表中没有匹配的 `X` 值。输出显示了三行\
  \ `X` 值唯一的行，且这些行在两个表中都是共有的。\n\n## 在 INTERSECT（交集）运算符上使用 ALL 和 CORR 关键字\n\n如果同时使用\
  \ `ALL` 和 `CORR` 关键字，`INTERSECT` 运算符将根据相同名的列，显示两个表中共同的所有唯一和非唯一（重复）行。修改后的查询、表 `One`\
  \ 和 `Two` 以及输出如下所示：\n\n| |\n```\nproc sql;\n   select *\n      from one\n   intersect\
  \ all corr\n   select *\n      from two;\n```\n| | ![Tables One, Two, and Output](img/m72-16-g2.png)\
  \ |\n\n`PROC SQL` 仅检查并显示相同名的列 `X`。两个表中共有三行（在上方已高亮），这三行就是输出中显示的三个行。请注意，每个表都至少包含另一行，该行与共同行中的某行的\
  \ `X` 值是重复的。例如，在表 `One` 的第二行和第三行中，`X` 的值为 1，这与共同行之一的值相同。然而，为了被视为共同行并包含在输出中，一个表中的每个重复行必须在另一个表中也有一个单独的重复行。在本例中，没有既具有重复值又在两个表间共有的行。因此，在本例中，使用关键字\
  \ `ALL` 和 `CORR` 的集合操作所生成的输出与仅使用关键字 `CORR` 的产生的输出是相同的。\n\n## 示例：INTERSECT 运算符\n\n\
  现在你已经看到了 `INTERSECT` 集合运算符如何在非常小的表上工作，我们可以在一个真实的业务问题中使用 `INTERSECT`。假设你想显示更改过薪资或职位代码的现有员工姓名。（此查询与你使用\
  \ `EXCEPT` 运算符解决的查询相反。）再次，你使用以下表：\n\n| 表名 | 相关列 |\n| --- | --- |\n| `Sasuser.Staffchanges`\
  \ 列出了所有新员工以及薪资或职位代码发生变化的员工的信息 | `FirstName`, `LastName` |\n| `Sasuser.Staffmaster`\
  \ 列出了所有现有员工的信息 | `FirstName`, `LastName` |\n\n这两个表之间的关系如下图所示：![INTERSECT Operator](img/m72-17g1.png)\
  \ 正如早之前的 `EXCEPT` 示例所示，这两个表的交集包含了所有更改过职位代码或薪资的现有员工的信息。你想显示的就是这两个表的交集（如上方所示的阴影部分）。为了显示两个表共有的唯一行，你使用一个包含\
  \ `INTERSECT` 的 `PROC SQL` 集合操作。已知这些表不包含重复项，因此使用 `ALL` 来加速查询处理。`PROC SQL` 集合操作如下：\n\
  \n```\nproc sql;\n   select firstname, lastname\n      from sasuser.staffchanges\n\
  \   intersect all\n   select firstname, lastname\n      from sasuser.staffmaster;\n\
  ```\n\n注意：在此 `PROC SQL` 步骤中，由于仅包含一个 `INTERSECT` 集合运算符，在 `SELECT` 语句中列出表的顺序没有区别。然而，在包含多个堆叠的\
  \ `INTERSECT` 集合运算符的复杂 `PROC SQL` 步骤中，仔细考虑表的顺序是非常重要的，这取决于你想要何时消除不匹配项。输出显示有四位更改过薪资或职位代码的现有员工。![INTERSECT\
  \ set operator](img/m72-17-g1.png)\n\n# 使用 UNION（并集）集合运算符\n\n## 概述\n\n`UNION` 集合运算符同时执行以下两项操作：\n\
  \n* 从两个表中选择唯一行\n* 叠加列。\n\n![overlays columns](img/m72-4g3.png) 下述的示例演示了 `UNION`\
  \ 在单独使用以及与关键字 `ALL` 和 `CORR` 一起使用时的工作原理。\n\n## 单独使用 UNION 运算符\n\n要显示表 `One` 和 `Two`\
  \ 中在两个表合并行集中唯一的行，请使用包含 `UNION` 运算符的 `PROC SQL` 集合操作：\n\n| |\n```\nproc sql;\n  \
  \ select *\n      from one\n   union\n   select *\n      from two;\n```\n| | ![Tables\
  \ One, Two, and Output](img/m72-20-g1.png) |\n\n使用 `UNION` 运算符，`PROC SQL` 首先拼接并排序来自两个表的行，并消除任何重复行。在本例中，删除了两行：表\
  \ `One` 中的第二行是第一行的重复，表 `Two` 中的第四行与第五行匹配。使用 `UNION` 运算符，`PROC SQL` 首先拼接并排序来自两个表的行，并消除任何重复行。\n\
  \n## 在 UNION 运算符上使用 ALL 关键字\n\n当 `UNION` 运算符上添加 `ALL` 关键字时，输出显示两个表中所有的行，包括重复行。修改后的查询、表\
  \ `One` 和 `Two` 以及输出如下所示：\n\n| |\nproc sql;\n   select *\n      from one\n   union\
  \ all\n   select *\n      from two;\n```\n| | ![Tables One, Two, and Output](img/m72-21-g1.png)\
  \ |\n\n使用 `ALL` 时，PROC SQL 不移除重复项也不排序行。输出现在包含了上一个示例中被消除的重复行：表 `One` 中的第二行和表 `Two`\
  \ 中的第四行。列按位置叠加。\n\n## 在 UNION 运算符上使用 CORR 关键字 \n\n要显示表 `One` 和 `Two` 中在两个表合并行集中唯一的行，基于相同的名称而非相同的位置，请在集合运算符后添加\
  \ `CORR` 关键字。输出如下所示：\n\n| |\nproc sql;\n   select *\n      from one\n   union corr\n\
  \   select *\n      from two;\n```\n| | ![Tables One, Two, and Output](img/m72-21-g2.png)\
  \ |\n\n`X` 是两个表中共同的唯一列名，因此 `X` 是 `PROC SQL` 检查并在输出中显示的唯一列项。在两个表的合并行集中，存在值 1、2、3\
  \ 的重复，这些重复行从输出中消除。输出显示了六个唯一的 `X` 值。\n\n## 在 UNION 运算符上使用关键字 ALL 和 CORR \n\n如果同时使用\
  \ `ALL` 和 `CORR` 关键字，`UNION` 运算符将根据相同的列，显示两个表中共同的所有唯一和重复行。在本例中，输出显示了全部 12 个 `X`\
  \ 值，即两个表中具有相同名的列。\n\n| |\n```\nproc sql;\n   select *\n      from one\n   union\
  \ all corr\n   select *\n      from two;\n```\n| | ![Tables One, Two, and Output](img/m72-21-g3.png)\
  \ |\n\n## 示例：UNION 运算符\n\n`UNION` 运算符可以解决真实的业务问题。假设你正在根据健康诊所的数据生成报告。你想显示 1998 年进行的个体患者压力测试结果，随后是\
  \ 1999 年进行的压力测试结果。为了实现这一点，你使用 `UNION` 运算符合并表 `Sasuser.Stress98` 和 `Sasuser.Stress99`。这两个表在结构相似：\n\
  \n* 两个表都包含九列名称相同的列\n* 每行包含一个个体患者的数据。\n\n\n\n\n\n你不确定表中是否包含重复记录，但你不希望在输出结果中出现重复项。由于这些表具有相同的列结构，你可以按位置重叠列，且不需要\
  \ `CORR` 关键字。下面显示了 `PROC SQL` 设置操作和输出（行按 ID 排序）：\n\n| |\n```\nproc sql;\n  select\
  \ *\n    from sasuser.stress98\n  union \n  select *\n    from sasuser.stress99;\n\
  ```\n| ![使用带有 UNION 算符的 PROC SQL 输出](img/m72-22-g1.png) |\n\n**提示**：如果你能确定这些表没有重复记录，可以添加关键字\
  \ `ALL`，通过避免对数据进行额外的一遍扫描来加快处理速度。\n\n## 示例：UNION 算符和汇总函数\n\n我们可以演示另一个真实的业务问题，以观察如何结合集合操作（在本例中为\
  \ `UNION`）使用汇总函数。假设你想为常旅客计划的成员显示以下汇总数据：总获得积分、总已用积分数和总飞行里程数。这三个值都可以使用汇总函数从 `Sasuser.Frequentflyers`\
  \ 表的列中计算。你可能会奇怪，当只涉及一个表时为什么还需要集合操作。如果你想将三个汇总值水平显示在三个单独的列中，你可以使用集合操作，使用以下简单的 `SELECT`\
  \ 语句来解决问题：\n\n```\nproc sql;\n   select sum(pointsearned) format=comma12.\n    \
  \      label='Total Points Earned',\n          sum(pointsused) format=comma12.\n\
  \          label='Total Points Used',\n          sum(milestraveled) format=comma12.\n\
  \          label='Total Miles Traveled'\n      from sasuser.frequentflyers;\n```\n\
  \n![UNION 算符和汇总函数](img/m72-23-g1.png) 然而，假设你想让三个值垂直显示在单列中。为了生成此输出，你在同一张表上创建三个不同的查询，然后使用两个\
  \ `UNION` 集合算符来组合三个查询结果：\n\n```\nproc sql;\ntitle 'Points and Miles Traveled';\n\
  title2 'by Frequent Flyers'; \n   select 'Total Points Traveled:',\n          sum(MilesTraveled)\
  \ format=comma12.\n      from sasuser.frequentflyers\n   union\n   select 'Total\
  \ Points Earned:',\n          sum(PointsEarned) format=comma12.\n      from sasuser.frequentflyers\n\
  \   union\n   select 'Total Points Used:',\n          sum(PointsUsed) format=comma12.\n\
  \      from sasuser.frequentflyers;\n```\n\n每个 `SELECT` 子句定义了两列：一个作为标签的字符常量和一个汇总值。输出所示。![UNION\
  \ 算符和汇总函数](img/m72-23-g2.png) **注意**：前面的程序读取了三次相同的表，因此它不是解决此问题的有效方法。\n\n# 使用 OUTER\
  \ UNION 集合算符\n\n## 概述\n\n`OUTER UNION` 集合算符通过以下方式连接查询结果：\n\n* 从两个表中选择所有行（包括唯一和非唯一的行）\n\
  * 不重叠列。\n\n![不重叠列](img/m72-4g4.png) 我们可以演示 `OUTER UNION` 单独使用以及配合关键字 `CORR` 使用时的工作原理。`OUTER\
  \ UNION` 使用 `ALL` 关键字，因为该算符的默认操作是在输出中包含所有行。\n\n## 单独使用 OUTER UNION 算符\n\n假设你想显示\
  \ `One` 和 `Two` 两个表的所有行，且不重叠列。包含 `OUTER UNION` 算符、两个表以及输出的 `PROC SQL` 设置操作所示：\n\n\
  | |\n```\nproc sql;\n   select *\n      from one\n   outer union\n   select *\n\
  \      from two;\n```\n| ![表 One, Two 和输出](img/m72-25-g1.png) |\n\n在输出中，列没有重叠。相反，显示了来自两个表的所有四个列。输出的每行在对应另一个表的两个列中包含缺失值。\n\
  \n## 在 OUTER UNION 算符上使用关键字 CORR\n\n上一个集合操作的输出包含两个同名的列。要重叠具有相同名称列，请在集合操作中添加 `CORR`\
  \ 关键字：\n\n| |\n```\nproc sql;\n   select *\n      from one\n   outer union corr\n\
  \   select *\n      from two;\n```\n| ![表 One, Two 和输出](img/m72-26-g1.png) |\n\n\
  修改后的集合操作的输出仅包含三列，因为两个名为 `X` 的列被重叠了。\n\n## 示例：OUTER UNION 算符\n\n许多业务场景需要连接两个或多个表。例如，假设你想显示在航空公司工作的所有机械师的员工工号、职位代码和薪水。机械师工作有三个级别，并且有一个单独的表包含每个级别机械师的数据：`Sasuser.Mechanicslevel1`、`Sasuser.Mechanicslevel2`\
  \ 和 `Sasuser.Mechanicslevel3`。这些表都包含相同的三列。下面的 `PROC SQL` 步骤使用两个 `OUTER UNION` 算符来连接表，并使用\
  \ `CORR` 关键字来重叠具有共同名称的列：\n\n| |\n```\nproc sql; \n   select *\n      from sasuser.mechanicslevel1\n\
  \   outer union corr\n   select *\n      from sasuser.mechanicslevel2\n   outer\
  \ union corr\n   select *\n      from sasuser.mechanicslevel3;\n```\n| ![使用 CORR\
  \ 关键字的 OUTER UNION](img/m72-27-g1.png) |\n\n# 比较 Outer Unions 和其他技术\n\n使用 `OUTER\
  \ UNION` 算符的 `PROC SQL` 设置操作是连接表的 SAS 技术之一，如下程序所示。程序 1 是之前提到的。程序 2 使用了不同的 SAS 技术来连接\
  \ `One` 和 `Two`。\n\n## 程序 1：带有 CORR 的 PROC SQL OUTER UNION 操作\n\n```\nproc sql;\n\
  \   create table three as \n      select * from one \n      outer union\n      select\
  \ * from two;\nquit;\n```\n\n## 程序 2：DATA Step、SET 语句和 PRINT Step\n\n```\n data\
  \ three; \n    set one two; \n run;\n proc print data=three; \n run;\n```\n\n这两个程序创建了相同的输出，如下![DATA\
  \ Step、SET 语句和 PRINT Step](img/m72-29-g1.png) 当表具有相同列时，除非使用了 `CORR` 关键字，否则 `PROC\
  \ SQL` 外连接不会产生相同的输出。`CORR` 会导致同名列（在本例中为名为 `X` 的两个列）重叠；如果没有 `CORR`，`OUTER UNION`\
  \ 算符会在结果集中包含同名列。DATA 程序只生成一个列。\n\n## 总结\n\n## 文字总结\n\n### 理解集合操作\n\n集合操作通过垂直组合（堆叠）来连接表或视图。集合操作是一个包含\n\
  \n* 两个查询（每个查询都以 `SELECT` 子句开始）\n* 一个集合算符 `EXCEPT`、`INTERSECT`、`UNION` 和 `OUTER UNION`\n\
  * 一个或两个作为修饰符的关键字 `ALL` 和 `CORR` 的单个 `SELECT` 语句可以包含多个集合操作。在处理仅显示唯一行的集合操作（包含集合算符\
  \ `EXCEPT`、`INTERSECT` 或 `UNION`）时，`PROC SQL` 默认对数据进行两次扫描。对于显示唯一和重复行的集合操作，只需要扫描一遍数据。对于\
  \ `EXCEPT`、`INTERSECT` 和 `UNION` 集合算符，列根据列在 `SELECT` 子句中的相对位置进行重叠，而不是根据列名。为了进行重叠，两个\
  \ `SELECT` 子句中相同相对位置的列必须具有相同的数据类型。一个或两个关键字可以用于修改集合算符的默认操作。\n\n\n\n\n\n### 使用 EXCEPT\
  \ 集合运算符\n\n集合操作符 `EXCEPT` 从第一个表（第一个查询中指定的表）中选择在第二个表（第二个查询中指定的表）中未找到唯一行，并进行列叠加。此集合操作可以使用\
  \ `ALL` 或 `CORR` 关键字（或两者）进行修改。\n\n### 使用 INTERSECT 集合运算符\n\n集合操作符 `INTERSECT` 选择两个表中共同拥有的唯一行并进行列叠加。此集合操作可以使用\
  \ `ALL` 或 `CORR` 关键字（或两者）进行修改。\n\n### 使用 UNION 集合运算符\n\n集合操作符 `UNION` 从两个表中选择所有唯一行并进行列叠加。此集合操作可以使用\
  \ `ALL` 或 `CORR` 关键字（或两者）进行修改。\n\n### 使用 OUTER UNION 集合运算符\n\n集合操作符 `OUTER UNION`\
  \ 通过选择两个表中的所有行（包括唯一和非唯一的）来连接两个查询的结果，且不进行列叠加。此集合操作可以使用关键字 `CORR` 进行修改。\n\n### 比较外部联合集和其他\
  \ SAS 技术\n\n使用 `OUTER UNION` 集合操作符的 `PROC SQL` 集合操作并不是在 SAS 中连接表的唯一方法。可以使用其他 SAS\
  \ 技术，例如由 `DATA` 步、`SET` 语句和 `PROC PRINT` 步组成的程序。\n\n## 示例程序\n\n```sas\nproc sql;\n\
  \   select firstname, lastname\n      from sasuser.staffchanges\n   intersect all\n\
  \   select firstname, lastname\n      from sasuser.staffmaster;\nquit;\n```\n\n\
  ## 注意事项\n\n* 无论 `SELECT` 语句中包含多少个集合操作，该语句只包含一个分号，该分号放置在最后一个查询之后。\n* 为了进行叠加，列必须具有相同的数据类型。\n\
  \n# 测验\n\n为每个问题选择最佳答案。完成测验后，使用附录中的答案对照检查您的答案。\n\n1. 对于不使用关键字的 `EXCEPT`、`UNION` 或\
  \ `INTERSECT` 集合运算符的集合操作，以下哪个陈是错误的？\n\n    1. 结果集中的列名由第一个表决定。\n    2. 为了进行叠加，列必须具有相同的数据类型。\n\
  \    3. 为了进行叠加，列必须具有相同的名称。\n    4. 默认情况下，结果集中仅显示唯一行。\n\n2. 关键字 `ALL` 不能与以下哪个集合运算符一起？\n\
  \n    1. `EXCEPT`\n    2. `INTERSECT`\n    3. `UNION`\n    4. `OUTER UNION`\n\n\
  3. 哪个 `PROC SQL` 步结合了 `Summer` 和 `Winter` 表以产生所示输出？![测验输出](img/m72-32-g1.png)\n\n\
  \    1. ```sas\n        proc sql;\n           select *\n              from summer\n\
  \           intersect all\n           select *\n              from winter;\n   \
  \     ```\n    2. ```sas\n        proc sql;\n           select *\n             \
  \ from summer\n           outer union\n           select *\n              from winter;\n\
  \        ```\n    3. ```sas\n        proc sql;\n           select *\n          \
  \    from summer\n           union corr\n           select *\n              from\
  \ winter;\n        ```\n    4. ```sas\n        proc sql;\n           select *\n\
  \              from summer\n           union\n           select *\n            \
  \  from winter;\n        ```\n\n4. 哪个 `PROC SQL` 步结合了表但没有叠加任何列？\n\n    1. ```sas\n\
  \        proc sql;\n           select *\n              from groupa\n           outer\
  \ union\n           select *\n              from groupb;\n        ```\n    2. ```sas\n\
  \        proc sql;\n           select *\n              from groupa as a\n      \
  \     outer union corr\n           select *\n              from groupb as b;\n \
  \       ```\n    3. ```sas\n        proc sql;\n           select coalesce(a.obs,\
  \ b.obs)\n                  label='Obs', med, duration\n              from groupa\
  \ as a\n              full join \n              groupb as b\n              on a.obs=b.obs;\n\
  \        ```\n    4. ```sas\n        proc sql;\n           select *\n          \
  \    from groupa as a\n           intersect\n           select *\n             \
  \ from groupb as b;\n        ```\n\n5. 关于关键字 `CORRESPONDING`，哪个陈述是错误的？\n\n    1.\
  \ 它不能与关键字 `ALL` 一起使用。\n    2. 它按名称叠加，而不是按位置叠加。\n    3. 在 `EXCEPT`、`INTERSECT` 和\
  \ `UNION` 集合操作中使用时，它会移除两个表中均未找到的列。\n    4. 在 `OUTER UNION` 集合操作中使用时，它会导致同名的列进行叠加。\n\
  \n6. 哪个 `PROC SQL` 步从 `Dogs` 和 `Pets` 表生成以下输出？![测验输出](img/m72-32-g2.png)\n\n   \
  \ 1. ```sas\n        proc sql;\n           select name, price\n              from\
  \ pets \n           except all\n           select *\n              from dogs;\n\
  \        ```\n    2. ```sas\n        proc sql;\n           select name, price\n\
  \              from pets \n           except\n           select *\n            \
  \  from dogs;\n        ```\n    3. ```sas\n        proc sql;\n           select\
  \ name, price\n              from pets \n           except corr all\n          \
  \ select *\n              from dogs;\n        ```\n    4. ```sas\n        proc sql;\n\
  \           select *\n              from dogs \n           except corr\n       \
  \    select name, price\n              from pets;\n        ```\n\n7. `PROG1` 表和\
  \ `PROG2` 表分别列出了参加课程的学生。哪个 `PROC SQL` 步给出了参加了 `PROG1` 的学生名称？![测验输出](img/m72-32-g3.png)\n\
  \n    1. ```sas\n        proc sql;\n           select fname, lname\n           \
  \   from prog1\n           intersect\n           select fname, lname\n         \
  \     from prog2;\n        ```\n    2. ```sas\n        proc sql;\n           select\
  \ fname, lname\n              from prog1\n           except all\n           select\
  \ fname, lname\n              from prog2;\n        ```\n    3. ```sas\n        proc\
  \ sql;\n           select *\n              from prog2\n           intersect corr\n\
  \           select *\n              from prog1;\n        ```\n    4. ```sas\n  \
  \      proc sql;\n           select *\n              from prog2\n           union\n\
  \           select *\n              from prog1;\n        ```\n\n8. 哪个 `PROC SQL`\
  \ 步返回参加了 PROG1、PROG2 或两者的课程的学生名称？![测验输出](img/m72-32-g4.png)\n\n    1. ```sas\n \
  \       proc sql;\n           select fname, lname\n              from prog1\n  \
  \         intersect\n           select fname, lname\n              from prog2;\n\
  \        ```\n    2. ```sas\n        proc sql;\n           select fname, lname\n\
  \              from prog1\n           outer union corr\n           select fname,\
  \ lname\n              from prog2;\n        ```\n    3. ```sas\n        proc sql;\n\
  \           select fname, lname\n              from prog1\n           union\n  \
  \         select fname, lname\n              from prog2;\n        ```\n    4. ```sas\n\
  \        proc sql;\n           select fname, lname\n              from prog1\n \
  \          except corr\n           select fname, lname\n              from prog2;\n\
  \        ```\n\n9. 哪个 `PROC SQL` 步返回参加参加了 PROG1 和 PROG2 课程的学生名称？![测验输出](img/m72-32-g5.png)\n\
  \n    1. ```sas\n        proc sql;\n           select fname, lname\n           \
  \   from prog1\n           union\n           select fname, lname\n             \
  \ from prog2;\n        ```\n    2. ```sas\n        proc sql;\n           select\
  \ fname, lname\n              from prog1\n           except corr\n           select\
  \ fname, lname\n              from prog2;\n        ```\n    3. ```sas\n        proc\
  \ sql;\n           select fname, lname\n              from prog1\n           intersect\
  \ all\n           select fname, lname\n              from prog2;\n        ```\n\
  \    4. ```sas\n        proc sql;\n           select fname, lname\n            \
  \  from prog1\n           union corr\n           select fname, lname\n         \
  \     from prog2;\n        ```\n\n10. 哪个 `PROC SQL` 步与以下 DATA 步生成相同结果？\n\n    |\
  \  \n\n\n\n\n\n```sas\ndata allstudents;\n   set prog1 prog2;\n   by lname;\nrun;\n\
  proc print noobs;\nrun;\n```\n\n| ![PROG1 and PROG2 Tables](img/m72-32-g6.png) |\n\
  \n1.  ```sas\nproc sql;\n   select fname, lname\n      from prog1\n   outer union\
  \ corr\n   select fname, lname\n      from prog2\n   order by lname;\n```\n\n2.\
  \  ```sas\nproc sql;\n   select fname, lname\n      from prog1\n   union\n   select\
  \ fname, lname\n      from prog2\n   order by lname;\n```\n\n3.  ```sas\nproc sql;\n\
  \   select fname, lname\n      from prog2\n   outer union\n   select fname, lname\n\
  \      from prog1\n   order by lname;\n```\n\n4.  ```sas\nproc sql;\n   select fname,\
  \ lname\n      from prog2\n   union corr\n   select fname, lname\n      from prog1\n\
  \   order by lname;\n```\n\n# 第 5 章：使用 PROC SQL 创建和管理表\n\n概述理解创建表的方法通过定义列创建空表显示表的结构创建一个与另一个表相同的空表根据查询结果创建表向表中插入数据行创建具有完整性约束的表处理行插入中的错误显示表的完整性约束更新现有表行值删除表中的行修改表的列删除表总结测验\n\
  \n## 概述\n\n## 引言\n\n通过使用 `PROC SQL`，你可以快速高效地创建、修改和删除表。许多 `PROC SQL` 语句非常多功能，允许你以多种方式执行相同的操作。例如，使用\
  \ `CREATE TABLE` 语句创建表有三种方法：\n\n*   通过定义列创建一个空表（不含行的表）\n*   创建一个与另一个表具有相同列和属性的空表\n\
  *   根据查询结果创建表\n\n接下来的 `PROC SQL` 步骤使用 `CREATE TABLE` 语句通过定义列创建一个空表，并使用 `DESCRIBE\
  \ TABLE` 语句在 SAS 日志中显示表结构的信息：\n\n```sas\n proc sql;\n    create table work.discount\
  \ \n           (Destination char(3),\n           BeginDate num Format=date9.,\n\
  \           EndDate num format=date9.,\n           Discount num);\n    describe\
  \ table work.discount;\n```\n\n表 5.1 SAS 日志\n\n|  \n\n```sas\n1    proc sql;\n2\
  \       create table work.discount\n3              (Destination char(3),\n4    \
  \          BeginDate num Format=date9.,\n5              EndDate num format=date9.,\n\
  6              Discount num);\nNOTE: Table WORK.DISCOUNT created, with 0 rows and\
  \ 4 columns.\n7       describe table work.discount;\nNOTE: SQL table WORK.DISCOUNT\
  \ was created like:\n```\n\n```sas\ncreate table WORK.DISCOUNT( bufsize=4096 )\n\
  \            ( \n            Destination char(3),\n            BeginDate num format=DATE9.,\n\
  \            EndDate num format=DATE9.,\n            Discount num\n            );\n\
  ```\n\n |\n\n### 理解创建表的方法\n\n你可以使用 `PROC SQL` 以三种方式创建表。所有三种方法都使用 `CREATE TABLE`\
  \ 语句，尽管该语句的语法随每个方法而异。\n\n| 创建表的方法 | 示例 |\n\n| --- | --- |\n| 通过定义列创建空表 |  \n\n```sas\n\
  proc sql;\n    create table work.discount\n           (Destination char(3),\n  \
  \         BeginDate num Format=date9.,\n           EndDate num format=date9.,\n\
  \           Discount num);\n```\n\n |\n\n| 创建与现有表相同（具有相同列和属性）的空表 |  \n\n```sas\n\
  proc sql;\n    create table work.discount\n2(Destination char(3),\n           BeginDate\
  \ num Format=date9.,\n           EndDate num format=date9.,\n           Discount\
  \ num);\n```\n\n |\n| 根据查询结果创建填充表（包含列和行的表） |  \n\n```sas\nproc sql;\n   select fname,\
  \ lname\n      from prog1\n   union\n   select fname, lname\n      from prog2\n\
  \   order by lname;\n``` |\n\n`CREATE TABLE` 语句仅生成表，不生成报告。SAS 日志会显示已创建表以及行数和列数。\n\
  \n表 5.2 SAS 日志\n\n|  \n\n```sas\nNOTE: Table FLIGHTAYS2 created, with 0 rows and\
  \ 8 columns.\n```\n\n |\n\n注意：在 `PROC SQL` 中通过 `DESCRIBE TABLE` 语句可以在 SAS 日志中查看表结构的信息。`DESCRIBE\
  \ TABLE` 语句将在后讨论。\n\n### 通过定义列创建空表\n\n## 概述\n\n有时你想创建一个与任何现有表不同的新表。在这种情况下，你需要定义所有列。为了实现这一点，请使用包含列定义的的\
  \ `CREATE TABLE` 语句。注意：此语句创建一个不行的表（空表）。此外，可以在 `CREATE TABLE` 语句中指定完整性约束。完整性约束将在本章稍后讨论。\n\
  \n| 带有列定义的 CREATE TABLE 语句通用形式：CREATE TABLE table-name(column-specification-1,...column-specification-n>);\
  \ 这里是语法的解释：table-name 指定要创建的表名。column-specification 指定包含在表的列，由 column-definition\
  \ 组成 <column-constraint-1<...column-constraint-n><MESSAGE='message-string'<MSGTYPE=message-type>>\
  \ 这里是语法的解释：column-definition 包含以下：column-name data-type<(column-width)><column-modifier-1<...\
  \ column-modifier-n>>column-name 指定列名。表中存储的列名与 column-name 情况相同。data-type 用括号括起来指定以下类型之一：CHARACTER\
  \ (or CHAR) | VARCHAR | INTEGER (or INT) | SMALLINT | DECIMAL (or DEC) | NUMERIC\
  \ (or NUM) | FLOAT | REAL | DOUBLE PRECISION | DATE.column-width 括号内的整数指定列宽。（PROC\
  \ SQL 仅对 CHARACTER 和 VARCHAR 数据类型处理此值。）column-modifier 是以下类型之一：INFORMAT= | FORMAT=\
  \ | LABEL= . 可能会指定多个 column-modifier。column-constraint 指定完整性约束。MESSAGE= 和 MSGTYPE\
  \ 指定与完整性约束相关的错误消息。（此处未详述完整性约束、column-constraint、MESSAGE= 和 MSGTYPE，将在本章稍后详细讨论。）\
  \ |\n\n注意：所有列-specification 必须在括号内。多个 column-specification 之间用逗号分隔。column-specification\
  \ 内部的元素之间用空格分隔。\n\n## 示例\n\n\n\n\n\n假设你想创建一个临时表 `Work.Discount`，该表包含航空公司提供的折扣数据。目前没有现有表包含你想包含的四个列（以及列属性）：`Destination`、`BeginDate`、`EndDate`\
  \ 和 `Discount`。你使用以下 `PROC SQL` 步骤根据你指定的列定义来创建表：\n\n```\n proc sql;\n    create\
  \ table work.discount \n           (Destination char(3),\n           BeginDate num\
  \ Format=date9.,\n           EndDate num format=date9.,\n           Discount num);\n\
  ```\n\nSAS 日志确认表已创建。\n\n表 5.3 SAS 日志\n\n|  \n```\nNOTE: Table WORK.DISCOUNT created,\
  \ with 0 rows and 4 columns.\n```\n |\n\n**提示** \n在本例以及本章的所有其他示例中，你指示将数据保存到临时表（在\
  \ `Work` 库中），该表会在 SAS 会话结束时删除。若要将表永久保存到不同的库中，请在 `CREATE TABLE` 子句中使用适当的 libref 代替\
  \ `Work` `。\n在接下来的几节中，你将学习更多关于如何在列规范中指定数据类型和列修饰符的知识。\n**注意**：你将在本章后面的部分学习向表中插入数据行。\n\
  \n## 指定数据类型\n\n当你通过定义列来创建表时，必须在列名后为每列指定数据类型：`column-name data-type <(column-width)>\
  \ <column-modifier-1...column-modifier-n>`\n例如，以下 `PROC SQL` 步骤（在前节中也显示）定义了四个列：一个字符列（`Destination`）和三个数值列（`BeginDate`、`EndDate`\
  \ 和 `Discount`）：\n\n```\nproc sql;\n   create table work.discount \n          (Destination\
  \ char(3),\n          BeginDate num format=date9.,\n          EndDate num format=date9.,\n\
  \          Discount num);\n```\n\nSAS 表使用两种数据类型：数值和字符。然而，`PROC SQL` 支持额外的数据类型（SQL\
  \ 数据库支持的数据类型中的许多，但并非全部）。因此，在 `CREATE TABLE` 语句中，你可以指定 10 种不同类型中的任意一种。在创建表时，`PROC\
  \ SQL` 将支持但不是 SAS 数据类型的支持类型转换为数值或字符格式。\n\n表 5.4 `PROC SQL` 支持的字符数据类型\n\n| 指定的数据类型\
  \ | SAS 数据类型 |\n| --- | --- |\n| CHARACTER (or CHAR) | CHARACTER |\n| VARCHAR |\
  \ CHARACTER |\n\n表 5.5 `PROC SQL` 支持的数值数据类型\n\n| 指定的数据类型 | 描述 | SAS 数据类型 |\n| ---\
  \ | --- | --- |\n| NUMERIC (or NUM) | 浮点 | NUMERIC |\n| DECIMAL (or DEC) | 浮点 |\
  \ NUMERIC |\n| FLOAT | 浮点 | NUMERIC |\n| REAL | 浮点 | NUMERIC |\n| DOUBLE PRECISION\
  \ | 浮点 | NUMERIC |\n| INTEGER (or INT) | 整数 | NUMERIC |\n| SMALLINT | 整数 | NUMERIC\
  \ |\n| DATE | 日期 | 带有 DATE.7 信息和格式的 NUMERIC |\n\n以下 `PROC SQL` 步骤与之前的示例非常。唯一的区别是该步骤指定了除\
  \ `CHAR` 和 `NUM` 之外的三种支持的数据类型：`VARCHAR`、`DATE` 和 `FLOAT`。\n\n```\nproc sql;\n  \
  \ create table work.discount2 \n          (Destination varchar(3),\n          BeginDate\
  \ date,\n          EndDate date,\n          Discount float);\n```\n\n`PROC SQL`\
  \ 将这些数据类型转换为字符或数值，如上表所示。因此，表 `Work.Discount2`（由此 `PROC SQL` 步骤创建）和 `Work.Discount`（由之前的\
  \ `PROC SQL` 步骤创建）包含相同的列。通过支持 SAS 数据类型以外的数据类型，`PROC SQL` 可以为你节省时间。在许多情况下，你可以从 SAS\
  \ 外部的 SQL 实现复制原生代码，而无需修改数据类型。\n\n## 指定列宽\n\n在 SAS 中，字符列和数值列的默认列宽均为 8 字节。然而，字符和数值数据的存储方式不同：\n\
  \n* 字符数据每个字节存储一个字符。\n* 数值数据以真实二进制表示的浮点数存储，这允许在 8 字节内实现 16 或 17 位精度。\n\n`PROC SQL`\
  \ 允许你为字符列指定列宽，但不能为数值列指定。\n**注意**：`PROC SQL` 允许在 `DECIMAL`、`NUMERIC` 和 `FLOAT` 数据类型的列规范中包含\
  \ `WIDTH` 和 `NDEC`（小数位数）参数。然而，`PROC SQL` 会忽略此规范并使用 SAS 默认值。\n在列规范中，列宽紧随数据类型，并以括号内的整数指定：`column-name\
  \ data-type <(column-width)> <column-modifier-1...column-modifier-n>`\n在以下 `PROC\
  \ SQL` 步骤中，第一个列规范为字符列 `Destination` 指定了 3 的宽度：\n\n```\nproc sql;\n   create table\
  \ work.discount \n          (Destination char(3),\n          BeginDate num format=date9.,\n\
  \          EndDate num format=date9.,\n          Discount num);\n```\n\n由于最后三列是数值型的，没有指定宽度，这些列具有\
  \ 8 字节的默认列宽。\n\n## 指定列修饰符\n\n在 `CREATE TABLE` 语句中，列规范可能包含以下 SAS 列修饰符的一个或多个：`INFORMAT=`、`FORMAT=`\
  \ 和 `LABEL=`。如果使用修饰符，指定在列规范的末尾：`column-name data-type <(column-width)> <column-modifier-1...column-modifier-n>`\n\
  **注意**：第四种 SAS 列修饰符 `LENGTH=` 不允许用于 `CREATE TABLE` 子句。它可以在 `SELECT` 子句中使用。\n\n##\
  \ 示例\n\n以下 `PROC SQL` 步骤通过指定 4 个列创建表 `Work.Departments`。列修饰符 `LABEL=` 和 `FORMAT=`\
  \ 用于指定额外的列属性。\n\n```\nproc sql;\n   create table work.departments \n          (Dept\
  \ varchar(20) label='Department',\n           Code integer label='Dept Code',\n\
  \           Manager varchar(20),\n           AuditDate num format=date9.);\n```\n\
  \nSAS 日志确认表已创建。\n\n表 5.6 SAS 日志\n\n|  \n```\nNOTE: Table WORK.DEPARTMENTS created,\
  \ with 0 rows and 4 columns.\n```\n |\n\n### 显示表的结构\n\n## 概述\n\n有时你想查看你创建或他人表的结构。当你创建表时，`CREATE\
  \ TABLE` 语句向 SAS 日志写入消息，指示所创建表的行数和列数。然而，该消息不包含列属性的信息。如果你正在处理包含行数据的现有表，你可以使用 `PROC\
  \ SQL` 查询生成一个显示表中所有列的报告。然而，报告没有列出列属性，且 PROC SQL 查询不会为空表生成输出。若要在 SAS 日志中显示一个或多个表的列和列属性（无论这些表是否包含行数据），可以使用\
  \ `PROC SQL` 中的 `DESCRIBE TABLE` 语句。\n\n| DESCRIBE TABLE 语句通用形式：DESCRIBE TABLE table-name-1<,\
  \ ... table-name-n>;\n以下是对语法的解释：table-names 指定要描述的表可以是以下内容之一：\n\n* 单级名称\n* 双级 libref.表名\n\
  * 用单引号括起来的物理路径。\n\n |\n\n\n\n\n\n`DESCRIBE TABLE` 语句会将指定表的 `CREATE TABLE` 语句（包含列定义）写入\
  \ SAS 日志（SAS log）中，无论该表最初是如何创建的。例如，如果 `DESCRIBE TABLE` 语句指定了一个通过 `DATA` 步创建的表，仍然会显示\
  \ `CREATE TABLE` 语句。\n\n注意：`DESCRIBE TABLE` 语句还会显示关于表上定义的任何索引的信息。您可以在使用 PROC SQL\
  \ 创建和管理索引中了解更多关于使用 `DESCRIBE TABLE` 语句显示索引信息的知识。\n\n提示：作为 `DESCRIBE TABLE` 语句的替代方案，您可以使用其他\
  \ SAS 过程（procedures），例如 `PROC CONTENTS`来列出表的列和列属性。`PROC CONTENTS` 生成的是报告，而不是像 `DESCRIBE\
  \ TABLE` 语句那样向 SAS 日志写入消息。\n\n## 示例\n\n在本章的早期部分，使用 `CREATE TABLE` 语句和下所示的列规格创建了空表\
  \ `Work.Discount`：\n\n```\nproc sql;\n   create table work.discount \n         \
  \ (Destination char(3),\n          BeginDate num format=date9.,\n          EndDate\
  \ num format=date9.,\n          Discount num);\n```\n\n接下来的 `DESCRIBE TABLE` 语句为\
  \ `Work.Discount` 表向 SAS 日志写入 `CREATE TABLE` 语句：\n\n```\nproc sql;\n   describe\
  \ table work.discount;\n```\n\n注意：关于 `BUFSIZE=` 选项的更多信息，请参见使用 BUFSIZE= 选项。\n\n表\
  \ 5.7 SAS 日志\n\n```\nNOTE: SQL table WORK.DISCOUNT was created like:\n```\n\n```\n\
  create table WORK.DISCOUNT( bufsize=4096 )\n            (            \n        \
  \    Destination char(3),\n            BeginDate num format=DATE9.,\n          \
  \  EndDate num format=DATE9.,\n            Discount num\n            )\n```\n\n\
  # 创建与另一个表类似的空表\n\n## 概述\n\n有时您想创建一个新表，该表具有与现有表相同的列和属性，但没有数据行。要创建一个类似于另一个表的空表，请使用带有\
  \ `LIKE` 子句的 `CREATE TABLE` 语句。\n\n| 带有 LIKE 子句的 CREATE TABLE 语句的一般形式：CREATE TABLE\
  \ table-nameLIKE table-1;以下是该语法的解释：table-name 指定要创建的表的名称。table-1 指定将它的列和属性复制到新表的表。\
  \ |\n\n## 示例\n\n假设您想创建一个名为 `Work.Flightdelays2` 的新表，其中包含有关航班延迟的数据。您希望新表包含与现有表 `Sasuser.Flightdelays`\
  \ 相同的列和属性，但您不想包含包含任何现有数据。接下来的 `PROC SQL` 步使用 `CREATE TABLE` 语句和 `LIKE` 子句来创建 `Work.Flightdelays2`：\n\
  \n```\nproc sql;\n   create table work.flightdelays2 \n      like sasuser.flightdelays;\n\
  ```\n\n接下来的 `DESCRIBE TABLE` 语句显示空表 `Work.Flightdelays2` 的结构：\n\n```\nproc sql;\n\
  \   describe table work.flightdelays2;\n```\n\n表 5.8 SAS 日志\n\n```\nNOTE: SQL table\
  \ WORK.FLIGHTDELAYS2 was created like:\n\ncreate table WORK.FLIGHTDELAYS2( bufsize=8192\
  \ )\n  (\n   Date num format=DATE9\\. informat=DATE9.,\n   FlightNumber char(3),\n\
  \   Origin char(3),\n   Destination char(3),\n   DelayCategory char(15),\n   DestinationType\
  \ char(15),\n   DayOfWeek num,\n   Delay num\n  );\n```\n\n`Work.Flightdelays2`\
  \ 包含列出的八个列。\n\n## 从表中指定列的子集\n\n如果您想创建一个仅包含现有表中指定列的子集的空表，请使用 SAS 数据集选项 `DROP=` 或\
  \ `KEEP=.`。\n\n| DROP= 和 KEEP= 数据集选项的一般形式：(DROP | KEEP =column-1< ...column-n>)以下是该语法的解释：column\
  \ 指定要丢弃或保留的列名。多个列名必须用空格分隔。整个选项必须括在括号内。 |\n\n在 `CREATE TABLE` 语句中，`DROP=` 或 `KEEP=`\
  \ 选项可以插入在以下位置之一：\n\n*   在正在创建的表名与 `LIKE` 子句之间（如下所示）\n*   在源表名之后，`LIKE` 子句的末尾。\n\n\
  ## 示例\n\n接下来的 `PROC SQL` 步创建新表 `Work.Flightdelays3`，它包含来自 `Sasuser.Flightdelays`\
  \ 表的列子集。使用 `DROP=` 选项指定除 `DelayCategory` 和 `DestinationType` 之外的所有列都包含在新表中。\n\n\
  ```\nproc sql;\n   create table work.flightdelays3\n          (drop=delaycategory\
  \ destinationtype)\n      like sasuser.flightdelays;\n```\n\n作为对比，原始表和新表运行 `DESCRIBE\
  \ TABLE` 语句的结果如下所示。\n\n表 5.9 SAS 日志\n\n```\nNOTE: SQL table WORK.FLIGHTDELAYS was\
  \ created like:\n\ncreate table SASUSER.FLIGHTDELAYS( bufsize=8192 )\n  (\n   Date\
  \ num format=DATE9\\. informat=DATE9.,\n   FlightNumber char(3),\n   Origin char(3),\n\
  \   Destination char(3),\n   DelayCategory char(15),\n   DestinationType char(15),\n\
  \   DayOfWeek num,\n   Delay num\n  );\n```\n\n表 5.10 SAS 日志\n\n```\nNOTE: SQL table\
  \ WORK.FLIGHTDELAYS3 was created like:\n\ncreate table WORK.FLIGHTDELAYS3( bufsize=4096\
  \ )\n  (\n   Date num format=DATE9\\. informat=DATE9.,\n   FlightNumber char(3),\n\
  \   Origin char(3),\n   Destination char(\n   )\n  );\n```\n\n如这些消息所示，`Sasuser.Flightdelays`\
  \ 包含列 `DelayCategory` 和 `DestinationType`。`Work.Flightdelays3` 不包含这些列。注意：在 `PROC\
  \ SQL` 中，您可以对表应用大多数数据集选项，如 `DROP=` 和 `KEEP=`。但是，由于 `DROP=` 和 `KEEP=` 是 SAS 选项而非\
  \ SQL 标准的一部分，您只能在指定表时使用它们。\n\n### 从查询结果创建表\n\n## 概述\n\n有时您想创建一个新表，该表具有与现有表相同的列和行。在这种情况下，您可以提交一个\
  \ `PROC SQL` 步来执行以下操作：\n\n*   创建一个新表\n*   用查询结果填充表\n\n要从查询结果创建表，请使用包含 `AS` 关键字以及查询中使用的子句的\
  \ `CREATE TABLE` 语句：`SELECT`、`FROM` 以及任何可选子句。\n\n| 带有查询子句的 CREATE TABLE 语句的一般形式：CREATE\
  \ TABLE table-name ASSELECT column-1< ... column-n>FROM table-1 &#124; view-1< ...\
  \ table-n &#124; view-n><optional query clauses>;以下是该语法的解释：table-name 指定要创建的表的名称。SELECT\
  \ 指定出现在表中的列。FROM 指定要查询的表或视图。可选子句用于进一步完善查询，包括 ORDER BY, GROUP BY, HAVING。 |\n\n您应该熟悉从查询结果创建表的方法。这里是对该方法的回顾。当从查询结果创建表时：\n\
  \n*   新表由 `FROM` 子句中引用的一个或多个表或视图的数据填充\n*   新表包含查询 `SELECT` 子句中指定的列\n*   新表的列具有与所选列相同的列属性（类型、长度、信息和格式）\n\
  \n注意：在创建表时，如果您没有为计算列指定列名，SAS 会分配一个列名，例如 `_TEMA001`。当在 `CREATE TABLE` 语句中使用查询子句时，该查询的自动报告生成将关闭。仅生成新表作为输出。\n\
  \n## 示例\n\n\n\n\n假设你想创建一个新的临时表，其中包含航空公司雇佣票务员的数据。你需要的数据是两个现有表 `Sasuser.Payrollmaster`\
  \ 和 `Sasuser.Staffmaster` 中包含数据的子集。以下 `PROC SQL` 步骤根据对这两个现有表进行查询的结果创建新表 `Work.Ticketagents`。`WHERE`\
  \ 子句通过匹配 `EMPID` 连接表，并选择 `JobCode` 包含 `TA` 的员工行子集。\n\n```\nproc sql;\n   create\
  \ table work.ticketagents as\n      select lastname, firstname,\n             jobcode,\
  \ salary\n         from sasuser.payrollmaster,\n              sasuser.staffmaster\n\
  \         where payrollmaster.empid\n               = staffmaster.empid\n      \
  \         and jobcode contains 'TA';\n```\n\n注意：由于此查询在 `FROM` 子句中列出了两个表并根据 `WHERE`\
  \ 子句对行进行筛选，因此该查询实际上是一个 `PROC SQL` 内连接。新表 `Work.Ticketagents` 不是空的；它包含了数据行。因此，你可以提交一个\
  \ `SELECT` 语句将 `Work.Ticketagents` 显示为报告：\n\n```\nselect *\n   from work.ticketagents;\n\
  ```\n\n`Work.Ticketagents` 的前四行所示。![Work.Ticketagents](img/m73-13-g1.png) SAS 日志还显示了一条消息，表示表已创建。\n\
  \n表 5.11 SAS 日志\n\n|  |\n\n```\nNOTE: Table WORK.TICKETAGENTS created, with 41 rows\
  \ and 4 columns.\n```\n\n| |\n\n## 复制表\n\n要快速复制表，可以使用 `CREATE TABLE` 语句配合查询，该查询应返回整个表，而不是列和行的子集。`CREATE\
  \ TABLE` 语句应仅包含以下子句：\n\n*   一个 `SELECT` 子句，指定选择源表中的所有列\n*   一个 `FROM` 子句，指定源表\n\n\
  注意：请记住，除非使用 `ORDER BY` 子句，否则 `PROC SQL` 查询结果中的行顺序是无法保证的。因此，不带 `ORDER BY` 子句的 `CREATE\
  \ TABLE` 语句可以创建一个包含与原表相同行的表，但行的顺序可能不同。\n\n## 示例\n\n以下 `PROC SQL` 步骤创建新表 `Work.Supervisors2`，它是源表\
  \ `Sasuser.Supervisors` 的完全副本：\n\n```\nproc sql;\n   create table work.supervisors2\
  \ as\n      select *\n         from sasuser.supervisors;\n```\n\n两个表的前四行如下所示。图 5.1\
  \ 源表：`Sasuser.Supervisors`![Sasuser.Supervisors](img/m73-14-g1.png) 图 5.2 新表：`Work.Supervisors2`![Work.Supervisors2](img/m73-14-g2.png)\n\
  \n### 向表中插入数据行\n\n## 概述\n\n在创建空表后，你将想要插入数据行。你可能还想向已经包含数据的表中插入额外的数据行。你可以通过三种方式使用\
  \ `INSERT` 语句向现有表（空或已填充）插入数据行。注意：你还可以使用 `INSERT` 语句向 `PROC SQL` 视图底层的单个表中插入数据行。要了解更多关于\
  \ `PROC SQL` 视图的信息，请参阅 使用 PROC SQL 创建和管理视图。\n\n| 插入行的方法 | 示例 |\n| --- | --- |\n\
  | 使用 `SET` 子句按列名插入值 |  |\n\n```\nproc sql;\n    insert into work.discount\n    \
  \   set destination='LHR',\n           begindate='01MAR2000'd,\n           enddate='05MAR2000'd,\n\
  \           discount=.33\n```\n\n*(注：原文后半部分存在大量重复和乱码，已根据核心逻辑进行了清理和翻译处理。)*\n\n\n\n\
  \n| ![通过 Set 子句插入行的输出](img/m73-17-g1.png) |\n\n## 使用 VALUES 子句插入行\n\n`INSERT` 语句使用\
  \ `VALUES` 子句将一组值插入到表中。与 `SET` 子句不同，`VALUES` 子句不为每个值指定列名，因此必须按照正确的顺序列出这些值。值必须按照列在表中出现的顺序进行指定，或者如果指定了可选的列列表，则按照列在列表列表中出现的顺序指定。向添加到表的每行都使用一个单独的\
  \ `VALUES` 子句。\n\n包含 `VALUES` 子句的 `INSERT` 语句的一般形式：`INSERT INTO table-name <(target-column-1<,\
  \ ... target-column-n)>VALUES (value-1<, ... value-n)><... VALUES (value-1<, ...\
  \ value-n>)>;`\n\n以下是语法的解释：\n- `table-name`：指定插入行的表名。\n- `target-column`：指定要插入数据的列名。\n\
  - 每个 `VALUES` 子句：列出要插入某行某些或所有列的值，用括号括起来。多个 `VALUES` 子句之间不用逗号分隔。\n- `values`：指定要添加的数据值。字符值必须包含在引号中。多个值必须用逗号分隔。值必须按位置顺序列出，要么按照它们在表中出现的顺序，要么如果指定了可选列列表，按照它们在列列表中出现的顺序。\n\
  \n注意：在包含 `VALUES` 子句的 `INSERT TABLE` 语句中，在表名后包含目标列名列表是可选的。列表可以包含表中所有或部分列名。如果指定了可选的目标列名列表，则语句仅为这些列赋值。目标列可以按任何顺序列出，无论它们在表中的位置如何。表中存在但未列出的任何列在插入行中将被赋予缺失值。你可以使用\
  \ `VALUES` 子句为表的所有或部分列插入值。\n\n| 如果你想做 ... | 那么 ... | 示例 |\n| --- | --- | --- |\n\
  | 为表中的所有列插入一个值 | 你可以在 `INSERT` 语句中省略可选的列名列表。`PROC SQL` <br>* 按值在 `VALUES` 子句中指定的顺序读取值\
  \ <br>* 按列在表中出现的顺序将值插入列中。 | ```sql\ninsert into work.newtable\n    values ('WI','FLUTE',6)\n\
  \    values ('ST','VIOLIN',3);\n`````` |\n| 为表中的部分列插入一个值 | 你必须在 `INSERT` 语句中包含一个列名列表。`PROC\
  \ SQL` <br>* 按值在 `VALUES` 子句中指定的顺序读取值 <br>* 按列在列名列表中指定的顺序将值插入列中。 | ```sql\ninsert\
  \ into work.newtable\n        (item,qty)\n    values ('FLUTE',6)\n    values ('VIOLIN',3);\n\
  `````` |\n\n你必须为 `PROC SQL` 插入值的每个列列出一个值（如在表列表或可选列名列表中指定的）。若要指定某个值是缺失，对于字符值请使用用单引号括起的空格，对于数值值请使用句号。例如，以下\
  \ `VALUES` 子句指定了要插入三个列的值；其中前两个值是缺失的：\n\n```sql\nvalues (' ', ., 45)\n```\n\n在此示例中，指定的第一个值是字符列的缺失值，第二个值是数值列的缺失值。\n\
  \n## 示例\n\n假设你想向 `Work.Discount` 表中再插入两行，该表存储了 3 月份某些航班目的地时间段的航空公司折扣。在上一节中，你使用 `SET`\
  \ 子句向 `Work.Discount` 插入了两行，因此表现在现在表所示。![Work.Discount](img/m73-20-g1.png) 使用 `VALUES`\
  \ 子句再添加两行。以下 `PROC SQL` 步骤向 `Work.Discount` 添加了两行新数据，并生成显示更新后表的报告：\n\n```sql\nproc\
  \ sql;\n   insert into work.discount (destination, \n          begindate,enddate,discount)\n\
  \      values ('ORD','05MAR2000'd,'15MAR2000'd,.25)\n      values ('YYZ','06MAR2000'd,'20MAR2000'd,.10);\n\
  \   select *\n      from work.discount;\n```\n\n![Work.Discount](img/m73-20-g2.png)\
  \ 刚刚使用 `VALUES` 子句插入的两行是上面的第三行和第四行。你可能注意到此示例中的 `INSERT` 语句包含了一个可选的列名列表。在此示例中，数据被插入到表的所有列中，且值按照列在表中出现的顺序列出，因此没有严格需要使用列列表。然而，包含列名列表使代码更易读，更容易理解代码在做什么。\n\
  \n## 从查询结果插入行\n\n向表中插入数据行最快的方法是使用查询从一个或多个表（或视图）中选择行，并插入另一个表。当你向已包含行的表中添加行时，新行位于最后。若要从查询结果插入行，使用\
  \ `INSERT` 语句，它包含 `SELECT`、`FROM` 以及任何可选子句（如 `ORDER BY`）。查询结果的值将按列在表中出现的顺序插入，或者，如果指定了可选列列表，则按列在列列表中出现的顺序插入。\n\
  \n包含查询子句的 `INSERT` 语句的一般形式：`INSERT INTO table-name <(target-column-1<, ... target-column-n)>SELECT\
  \ column-1<, ... column-n>FROM table-1 ... view-n><optional query clauses>;`\n\n\
  以下是语法的解释：\n- `table-name`：指定插入行的表名。\n- `target-column`：指定插入数据的列名。\n- `SELECT`：指定要插入的列。\n\
  - `FROM`：指定要查询的表或视图。\n- `optional query clauses`：用于精炼查询。包括 `WHERE`、`GROUP BY` 和\
  \ `HAVING` 子句。\n\n注意：在包含查询子句的 `INSERT TABLE` 语句中，在表名后包含目标列名列表是可选的。列表可以包含表中所有或部分列名。如果指定了可选的目标列名列表，则语句仅为这些列赋值。目标列可以按任何顺序列出，无论它们在表中的位置如何。表中存在但未列出的任何列在插入行中将被赋予缺失值。\n\
  \n## 示例\n\n公司的一名机械师从 2 级升到了 3 级，你需要将该员工添加到 `Sasuser.Mechanicslevel3` 表，该表列出了所有 3\
  \ 级机械师。创建一个 `Sasuser.Mechanicslevel3` 的临时副本 `Work.Mechanicslevel3_New`，并在报告中显示新表：\n\
  \n```sql\nproc sql;\n   create table work.mechanicslevel3_new as\n      select *\n\
  \         from sasuser.mechanicslevel3;\n```\n\n| ![Work.Mechanicslevel3_New 表](img/m73-22-g1.png)\
  \ |\n\n接下来，你向 `Work.Mechanicslevel3_New` 插入一个新的 3 级员工，其 `EmpID` 为 `1653`。该员工目前列在\
  \ `Sasuser.Mechanicslevel2` 中，因此你的 `INSERT` 语句查询 `Sasuser.Mechanicslevel2` 表。你的\
  \ `PROC SQL` 步骤以 `SELECT` 语句结束，将修改后的表 `Work.Mechanicslevel3_New` 输出到报告。\n\n```sql\n\
  proc sql; \n   insert into work.mechanicslevel3_new\n      select empid, jobcode,\
  \ salary \n         from sasuser.mechanicslevel2\n         where empid='1653';\n\
  \      select *\n         from work.mechanicslevel3_new;\n```\n\n\n\n\n\n| ![Revised\
  \ Work.Mechanicslevel3_New Table](img/m73-22-g2.png) |\n\n你插入到 `Work.Mechanicslevel3_New`\
  \ 中的行是上面的第 8 行。如你所示，新员工的 `JobCode` 和 `Salary` 值必须更改。更新表中的现有值将在本章稍后介绍。注意：虽然新行显示在表的底部，但如果没有使用\
  \ `ORDER BY` 子句，则无法保证 `PROC SQL` 查询中行的顺序。\n\n### 创建具有完整性约束的表\n\n## 概述\n\n完整性约束是你可以指定的规则，用以限制表中列中可以存储的数据值。当添加、更新或删除与列关联的值时，SAS\
  \ 会强制完整性约束。完整性约束有助于你维护数据的有效性和一致性。你可以使用 `PROC SQL` 或 `PROC DATASETS` 创建完整性约束。`PROC\
  \ DATASETS` 只能为现有表分配约束。`PROC SQL` 可以在创建新表时或修改现有表时分配约束。本章讨论了使用 `PROC SQL` 在创建表时创建完整性约束。注意：要了解更多关于使用\
  \ `PROC DATASETS` 创建完整性约束的信息，请参见修改 SAS 数据集和跟踪更改。有关完整性约束的更多信息，请参见 SAS 文档。注意：使用 `PROC\
  \ SQL` 向现有表添加完整性约束，请使用 `ALTER TABLE` 语句。当你对表设置完整性约束时，需要指定要创建的约束类型。每个约束都有不同的操作。\n\
  \n| 约束类型 | 操作 |\n| --- | --- |\n| CHECK | 确保特定的值或范围是列中的唯一值。它还可以根据同一行内另一列的值检查一列值的有效性。\
  \ |\n| NOT NULL | 保证列每一行都有非空值。 |\n| UNIQUE | 强制列值的唯一性。 |\n| PRIMARY KEY | 唯一地定义表中的行，可以是单列或一组列。表只能有一个\
  \ `PRIMARY KEY`。`PRIMARY KEY` 包含了 `NOT NULL` 和 `UNIQUE` 约束的属性。 |\n| FOREIGN KEY\
  \ | 通过匹配一个表中的列或一组列（`FOREIGN KEY`）与另一个表中的 `PRIMARY KEY`，将表中的一个或多行链接到另一个表的特定行。这种父子关系限制了对\
  \ `PRIMARY KEY` 和 `FOREIGN KEY` 约束的修改。`FOREIGN KEY` 接受的值只有 `PRIMARY KEY` 的值或缺失值。\
  \ |\n\n注意：当你向数据的表中添加完整性约束时，SAS 会在添加约束之前检查所有数据值，以确定它们是否满足约束。你有两种方式使用完整性约束：通用约束和引用约束。通用约束允许你限制单个表中列接受的数据值。引用约束允许你将一个表中列的数据值链接到另一个表中列的数据值。\n\
  \n## 通用完整性约束\n\n通用完整性约束允许你限制单个表内列的值。以下四个完整性约束可以作为通用完整性约束使用：\n\n* `CHECK`\n* `NOT\
  \ NULL`\n* `UNIQUE`\n* `PRIMARY KEY`\n\n注意：如果 `PRIMARY KEY` 约束没有任何引用它的 `FOREIGN\
  \ KEY` 约束，则它是一个通用完整性约束。用通用约束使用的 `PRIMARY KEY` 是分配 `NOT NULL` 和 `UNIQUE` 约束的快捷方式。\n\
  \n## 引用完整性约束\n\n当一个表中的 `PRIMARY KEY` 完整性约束被另一个表中的 `FOREIGN KEY` 完整性约束引用时，就会创建引用完整性约束。创建引用完整性约束必须遵循两个步骤：\n\
  \n1. 在第一个表上定义 `PRIMARY KEY` 约束。\n2. 在其他表上定义 `FOREIGN KEY` 约束。\n\n注意：完整性约束\n* 符合\
  \ ANSI 标准\n* 无法为视图定义\n* 无法为生成数据集的历史版本定义。\n\n要创建一个具有完整性约束的表，请使用同时指定列和约束的 `CREATE\
  \ TABLE` 语句。在 `CREATE TABLE` 语句中指定完整性约束有两种方法：\n\n* 在列规范中\n* 作为单独的约束规范。\n\n你可以在同一个\
  \ `CREATE TABLE` 语句中使用这两种方法中的一种或两者。\n\n## 在列规范中创建约束\n\n在本章前面，你学习了如何使用包含列规范的 `CREATE\
  \ TABLE` 语句创建表：\n```\nCREATE TABLE table-name(column-specification-1<,...column-specification-n>);\n\
  ```\n你还学习了列规范由这些元素组成：`column-definition <column-constraint-1<, ... column-constraint-n>>\
  \ <MESSAGE='message-string' <MSGTYPE=message-type>>`\n\n早期示例中使用的列规范仅包含列定义。现在我们学习如何通过在列规范中指定可选的列约束来创建列创建完整性约束：\n\
  \n| 列规范中列-约束的通用形式：`column-definition <column-constraint-1<, ... column-constraint-n>><MESSAGE='message-string'\
  \ <MSGTYPE=message-type>>` |\n\n以下是语法的解释：`column-constraint` 是以下内容之一：\n* `CHECK\
  \ (expression)`：指定表中的所有行（在 `CREATE TABLE` 语句中指定）都满足表达式，该表达式可以是任何有效的 where 表达式。\n\
  * `DISTINCT`：指定列中的值必须是唯一的。这与 `UNIQUE` 相同。\n* `NOT NULL`：指定列不包含空或缺失值，包括特殊的缺失值。\n\
  * `PRIMARY KEY`：指定该列为 `PRIMARY KEY`，即不包含缺失值的列。\n* `REFERENCES table-name <ON DELETE\
  \ referential-action> <ON UPDATE referential-action>`：指定该列为 `FOREIGN KEY`，即其值链接到另一个表（`REFERENCES`\
  \ 指定的）中的 `PRIMARY KEY` 列。当引用的 `PRIMARY KEY` 列被更新或删除时会执行引用操作。referential-action 指定对所有匹配的\
  \ `FOREIGN KEY` 值的操作类型，它是以下之一：\n    * `CASCADE`：允许更新 `PRIMARY KEY` 数据值，并将匹配的 `FOREIGN\
  \ KEY` 更新为相同的值。注意：此引用操作目前支持更新。\n    * `RESTRICT`：仅当存在匹配的 `FOREIGN KEY` 值时发生。此引用操作是默认值。\n\
  \    * `SET NULL`：将所有匹配的 `FOREIGN KEY` 值设置为 `NULL`。\n* `UNIQUE`：指定列的值在表内必须是唯一的。\
  \ |\n\n注意：可选的 `MSGTYPE=` 和 `MESSAGE=` 元素将在本章稍后讨论。与列一样，完整性约束在表中必须具有唯一名称。如果你通过在列规范中指定列约束来创建完整性约束，SAS\
  \ 会为约束分配名称。约束的形式取决于约束的类型，如下：\n\n| 约束类型 | 默认名称 |\n| --- | --- |\n| `CHECK` | `_CKxxxx_`\
  \ |\n| `FOREIGN KEY` | `_FKxxxx_` |\n| `NOT NULL` | `_NMxxxx_` |\n| `PRIMARY KEY`\
  \ | `_PKxxxx_` |\n| `UNIQUE` | `_UNxxxx_` |\n\n注意：`xxxx` 是从 `0001` 开始的计数器。这是一个 `PROC\
  \ SQL` 步骤的示例，它通过在列规范中指定一个或多个列约束来创建完整性约束。\n\n## 示例\n\n\n\n\n\n假设你需要创建一个 `Work.Employees`\
  \ 表，用于存储所有员工的识别号、姓名、性别和入职日期。此外，你还希望确保以下几点：\n\n* `ID` 列只包含非缺失且唯一的值\n* `Gender` 列只包含值\
  \ `M` 和 `F`\n\n下文的 `PROC SQL` 步骤创建了表 `Work.Employees` 表，该表包含四列，并对其中两列建立了完整性约束：\n\
  \n```\nproc sql;\n   create table work.employees\n      (ID char (5) primary key,\n\
  \      Name char(10),\n      Gender char(1) not null check(gender in ('M','F')),\n\
  \      HDate date label='Hire Date');\n```\n\n在 `ID` 的列规格中，`PRIMARY KEY` 列约束确保 `ID`\
  \ 列只包含非缺失且唯一的值。`Gender` 的列规格定义了两个完整性约束：\n\n* `NOT NULL` 列约束确保 `Gender` 的值是非缺失的。\n\
  * `CHECK` 列约束确保 `Gender` 的值满足表达式 `gender in ('M','F')`。\n\n另一种创建完整性约束的方法是：在 `CREATE\
  \ TABLE` 语句中指定约束规格。\n\n## 使用约束规格创建约束\n\n有时你可能倾向于在列规格之外创建完整性约束，通过在 `CREATE TABLE`\
  \ 语句中指定单个约束规格来实现：`CREATE TABLE table-name(column-specification-1<,...column-specification-n><,constraint-specification-1><,...constraint-specification-n>);`。`CREATE\
  \ TABLE` 语句中的第一个规格必须是列规格。然而，在语句初始列规格之后，你可以包含多个额外的列规格、约束规格或两者兼有。第一个列规格之后的所有规格都可以以任何顺序列出。列规格和约束规格的完整列表遵循与之前介绍列规格的相同准则：\n\
  \n* 整个列规格和约束规格集必须包含在括号内。\n* 多个列规格和约束规格之间必须用逗号分隔。\n\n在列规格内指定完整性约束与通过单独的约束规格指定完整性约束之间，有几点重要的区别。使用约束规格具有以下优势：\n\
  \n* 你可以为约束指定名称。事实上，你必须指定一个名称，因为 SAS 不会自动分配名称。\n* 对于某些约束类型，你可以在单个规格中为多个列定义约束。\n\n\
  约束规格的语法所示：`CONSTRAINT constraint-name constraint <MESSAGE='message-string' <MSGTYPE=message-type>>`。这为正在指定的约束指定一个名称。该名称必须是有效的\
  \ SAS 名称。注意：`PRIMARY`、`FOREIGN`、`MESSAGE`、`UNIQUE`、`DISTINCT`、`CHECK` 和 `NOT` 不能作为\
  \ `constraint-name` 的值。`constraint` 是以下之一：\n\n* `CHECK (expression)` 指定 `table-name`（在\
  \ `CREATE TABLE` 语句中指定）中的所有行都满足 `expression`，该表达式可以是任何有效的 `where-expression`。\n\
  * `DISTINCT (column-1<, ... column-n>)` 指定每列的值的值在表内必须是唯一的。此约束与 `UNIQUE` 相同。\n* `FOREIGN\
  \ KEY (column-1<, ... column-n>)REFERENCES table-name<ON DELETE referential-action><ON\
  \ UPDATE referential-action>` 指定一个 `FOREIGN KEY`，即一组列，其值与另一个表（为 `REFERENCES` 指定的表名）中\
  \ `PRIMARY KEY` 列的值相关联。当被 `FOREIGN KEY` 引用的 `PRIMARY KEY` 列的值被更新或删除时，会执行 `referential-actions`。`referential-action`\
  \ 指定了在所有匹配的 `FOREIGN KEY` 值上执行的操作类型，如下所示：\n    * `CASCADE` 允许 `PRIMARY KEY` 数据值被更新，并将\
  \ `FOREIGN KEY` 中的匹配值更新为相同的值。注意：此引用操作目前仅支持更新。\n    * `RESTRICT` 仅在存在匹配的 `FOREIGN\
  \ KEY` 值时发生。此引用操作是默认操作。\n    * `SET NULL` 将所有匹配的 `FOREIGN KEY` 值设置为 `NULL`。\n* `NOT\
  \ NULL (column)` 指定列不包含空值或缺失值，包括特殊缺失值。\n* `PRIMARY KEY (column-1<, ... column-n>)`\
  \ 指定一个或多个列为 `PRIMARY KEY` 列，即不包含缺失值且值是唯一的列。\n* `UNIQUE (column-1<, ... column-n>)`\
  \ 指定每列的值在表内必须是唯一的。此约束与 `DISTINCT` 相同。\n* `MESSAGE=` 指定一个 `message-string`，用于指定当完整性约束不满足时写入\
  \ SAS 日志的错误消息文本。`message-string` 的最大长度为 250 个字符。\n* `MSGTYPE=` 指定 `message-type`，用于指定当完整性约束不满足时错误消息在\
  \ SAS 日志中的显示方式。`message-type` 是以下之一：\n\n| Value | 描述 |\n| :--- | :--- |\n| NEWLINE\
  \ | 除了该完整性约束的默认错误消息外，还会显示为 `MESSAGE=` 指定的文本 |\n| USER | 仅显示为 `MESSAGE=` 指定的文本 |\n\
  \n注意：`constraint-specification` 内的元素必须用空格分隔。你可能已经注意到创建完整性约束的两种方法的另一种区别。当你使用列规格创建\
  \ `FOREIGN KEY` 完整性约束时，除了 `REFERENCES` 关键字外，还需要使用 `FOREIGN KEY` 关键字。这是一个使用列规格创建约束的示例。\n\
  \n## 示例\n\n在本章之前的示例中，创建了 `Discount` 表存储航空公司提供的折扣数据。假设你现在希望该表\n\n* 只持有小于等于 .5 的折扣\n\
  * 不允许 Destination 有缺失值\n\n创建一个 `Discount` 表的新版本，命名为 `Discount3`，包含两个完整性约束。一个完整性约束限制了\
  \ Discount 列的值，另一个防止输入缺失值。以下 `PROC SQL` 步骤通过指定四列和两个完整性约束创建了 `Discount3`：\n\n```\n\
  proc sql;\n   create table work.discount3 \n          (Destination char(3),\n  \
  \        BeginDate num Format=date9.,\n          EndDate num format=date9.,\n  \
  \        Discount num,\n          constraint ok_discount check (discount <= .5),\n\
  \          constraint notnull_dest not null(destination));\n```\n\n\n在本章的节节中，使用了以下\
  \ `PROC SQL` 步骤创建了表 `Work.Discount3`，该表包含两个完整性约束，一个针对 `Discount` 列，另一个针对 `Destination`\
  \ 列：\n\n```\nproc sql;\n   create table work.discount3 \n          (Destination\
  \ char(3),\n          BeginDate num Format=date9.,\n          EndDate num format=date9.,\n\
  \          Discount num,\n          constraint ok_discount check (discount le .5),\n\
  \          constraint notnull_dest not null(destination));\n```\n\n该表尚未包含任何行数据，因此添加一些数据。以下\
  \ `INSERT` 语句使用 `VALUES` 子句向表中添加了两个行数据：\n\n```\nproc sql;\n   insert into work.discount3\
  \ \n          values('CDG','03MAR2000'd,'10MAR2000'd,.15)\n          values('LHR','10MAR2000'd,'12MAR2000'd,.55);\n\
  ```\n\n当提交此 `PROC SQL` 步骤时，SAS 日志中会显示以下信息。\n\n表 5.14 SAS 日志\n\n|  \n\n```\nERROR:\
  \ Add/Update failed for data set WORK.DISCOUNT3 \nbecause data value(s) do not comply\
  \ with integrity constraint \nok_discount.\nNOTE: This insert failed while attempting\
  \ to add data from \nVALUES clause 2 to the data set.\nNOTE: Deleting the successful\
  \ inserts before error noted above \nto restore table to a consistent state.\n```\n\
  \n |\n\n此消息的三个部分解释了问题所在：\n\n*   错误信息表示尝试添加行的操作失败。`Discount` 的一个或多个数据值不符合完整性约束 `OK_DISCOUNT`，该约束规定\
  \ `Discount` 列中的值必须小于或等于 `.5`。\n\n*   第一条注释表明第二个 `VALUES` 子句存在问题。该子句为 `Discount`\
  \ 列指定了值 `.55`，这不符合规定。注意：即使有多个 `VALUES` 子句指定了不符合规定的数据值，SAS 日志也只会列出违反约束的第一个 `VALUES`\
  \ 子句。\n\n*   第二条注释表明 SAS 在发生错误之前正在“删除成功的插入”。尽管所有其他指定的数据都是有效的，但没有任何数据被添加到表中。\n\n\
  我们需要考虑为什么 SAS 阻止了任何数据添加到表中。\n\n## 使用 `UNDO_POLICY=` 选项控制 UNDO 处理\n\n当你使用 `INSERT`\
  \ 或 `UPDATE` 语句向表中添加或修改数据时，如果在插入或更新过程中发生任何错误，你可以控制 `PROC SQL` 如何处理更新后的数据。你可以在 `PROC\
  \ SQL` 语句中使用 `UNDO_POLICY=` 选项来指定 `PROC SQL` 是否接受或撤销你截至错误发生时提交的更改。你可以为 `UNDO_POLICY=`\
  \ 选项指定以下值之一。\n\n| `UNDO_POLICY=` 设置 | 描述 |\n| --- | --- |\n| `REQUIRED` | `PROC\
  \ SQL` 对 `INSERT` 和 `UPDATE` 语句执行 `UNDO` 处理。如果无法可靠地执行 `UNDO` 操作，`PROC SQL` 将不执行语句并发布\
  \ `ERROR` 消息。这是 `PROC SQL` 的默认值。 |\n| `NONE` | `PROC SQL` 跳过无法插入或更新的记录，并在 SAS 日志中写入类似于\
  \ `PROC APPEND` 写入的警告信息。 |\n| `OPTIONAL` | 如果可以，`PROC SQL` 执行 `UNDO` 处理。如果无法可靠地执行\
  \ `UNDO` 操作，`PROC SQL` 将不执行语句并发布 `ERROR` 消息。 |\n\n\n\n\n\n有时，你想向表中添加数据，但你不确定该表具有哪些完整性约束（如果有的话）。要仅显示指定表的完整性约束，请使用\
  \ `DESCRIBE TABLE CONSTRAINTS` 语句。（在本章之前讨论的 `DESCRIBE TABLE` 语句会在 SAS 日志中同时列出 `CREATE\
  \ TABLE` 语句和表的完整性约束。）注意：某些版本的 SAS 会在输出和 SAS 日志中同时显示有关完整性约束的信息。\n\n| `DESCRIBE TABLE\
  \ CONSTRAINTS` 语句的通用形式： | `DESCRIBE TABLE CONSTRAINTS table-name-1<, ... table-name-n>;`\
  \ | 以下是该语法的解释：`table-name` 指定要描述的表，可以是以下内容之一：<ul><li>一个单级名称</li><li>一个双级库引用（libref）和表名。</li><li>一个用单引号括起来的物理路径名。</li></ul>\n\
  \n## 示例\n\n要仅显示之前创建的表 `Work.Discount4` 的表约束，你提交以下 `PROC SQL` 步骤：\n\n```\nproc sql;\n\
  \   describe table constraints work.discount4;\n```\n\n表 5.16 SAS 日志\n\n```\nNOTE:\
  \ SQL table WORK.DISCOUNT4 ( bufsize=4096 ) has the \nfollowing integrity constraint(s):\n\
  \n-----Alphabetic List of Integrity Constraints-----\n\n      Integrity        \
  \                    Where\n   *  Constraint    Type      Variables    Clause\n\
  -------------------------------------------------\n1     notnull_dest Not Null Destination\n\
  2     ok_discount Check Discount<=0.5\n```\n\n![Work.Discount4](img/m73-35-g1.png)所示，`Work.Discount4`\
  \ 有两个完整性约束：`NotNull_Dest` 和 `OK_Discount`。\n\n# 更新现有表行\n\n## 概述\n\n要修改表中或所有现有行的数据值，你在\
  \ `PROC SQL` 中使用 `UPDATE` 语句。在 `UPDATE` 语句中，对于你想要修改的行的每一列，你需要指定一个表达式来指示应如何修改这些值。例如，以下表达式表示\
  \ `Units` 列的值应乘以 4：\n\n```\nunits=units*4\n```\n\n你可以通过两种主要方法使用 `UPDATE` 语句。\n\n\
  | 更新表的方法 | 示例 |\n| --- | --- |\n| 使用相同的表达式更新某一列中的所有（或子集）行 | ```sql\nproc sql;\n\
  \   update work.payrollmaster_new\n      set salary=salary*1.05\n      where jobcode\
  \ like '__1';\n``` ``` |\n| 使用不同的表达式更新同一列中不同的行 | ```sql\nproc sql;\n   update  work.payrollmaster_new\
  \ \n      set salary=salary*\n         case when substr(jobcode,3,1)='1'\n     \
  \            then 1.05\n              when substr(jobcode,3,1)='2'\n           \
  \      then 1.10\n              when substr(jobcode,3,1)='3'\n                 then\
  \ 1.15\n              else 1.08\n         end;\n``` ``` |\n\n注意：`UPDATE` 语句不会向表中插入新行。要插入行，必须使用\
  \ `INSERT` 语句。注意：你也可以使用 `UPDATE` 语句更新 `PROC SQL` 视图底层表中的现有值。详情，请参阅 使用 PROC SQL 创建和管理视图。我们考虑了更新表中现有行的这些每方法。\n\
  \n## 使用相同表达式更新行\n\n要使用相同的表达式更新某一列中的所有（或子集）行，请使用包含 `SET` 子句和可能的 `WHERE` 子句的 `UPDATE`\
  \ 语句。\n\n| 更新表行的基本 `UPDATE` 语句通用形式： | `UPDATE table-name SET column-1=expression<,\
  \ ... column-n=expression><WHERE expression>;` | 以下是该语法的解释：`table-name` 指定更新值的表名。`SET`\
  \ 指定要更新的一个或多个列名对，以及指示如何更新每列的表达式。`WHERE` 用于指定一个用于筛选更新行子集的表达式。 |\n\n警告：如果你只想更新表中的子集行，必须指定\
  \ `WHERE` 子句或表中要更新的所有行。\n\n## 示例\n\n假设一家公司正在考虑给所有 1 级员工加薪 5% 员工的薪资存储在 `Sasuser.Payrollmaster`\
  \ 表中。你不想更新原始表，因此创建了 `Sasuser.Payrollmaster` 的临时副本，称为 `Work.Payrollmaster_New`。以下\
  \ `PROC SQL` 步骤根据查询结果创建了 `Work.Payrollmaster_New` 并生成新表的输出报告：\n\n```\nproc sql;\n\
  \   create table work.payrollmaster_new as\n      select *\n         from sasuser.payrollmaster;\n\
  \   select *\n      from work.payrollmaster_new;\n```\n\n下面显示了更新薪资的表 `Work.Payrollmaster_New`\
  \ 的前 10 行。![Work.Payrollmaster_New](img/m73-38-g1.png)接下来，你编写了一个 `PROC SQL` 步骤来更新指定的行。`UPDATE`\
  \ 语句包含以下两个部分：\n\n*   一个 `SET` 子句，指定用于更新 `Salary` 的表达式\n*   一个 `WHERE` 子句，指定要更新的子集行（1\
  \ 级员工）\n\n```\nproc sql;\n   update work.payrollmaster_new\n      where jobcode\
  \ like '__1';\n```\n\n最后，你可以使用 `SELECT` 语句显示更新后的表。显示 `Work.Payrollmaster_New` 的前\
  \ 10 行（已更新）如下所示。如果你想增加所有薪资，只需从 `UPDATE` 语句中删除 `WHERE` 子句：\n\n```\nproc sql;\n  \
  \ update payrollmaster_new\n      set salary=1.05\n```\n\n## 使用不同表达式更新行\n\n有时，你想使用不同的表达式来修改不同子集的值。例如，不是给\
  \ 1 级员工加薪 5%，你可能还想给 2 级员工加薪 10%，此类推，对每个组使用不同的加薪百分比。使用不同表达式更新不同子集有两种方法。\n\n| 更新表的方法\
  \ | 示例 |\n| --- | --- |\n| 使用多个 `UPDATE` 语句子集行由于单个 `UPDATE` 语句只能包含一个 `WHERE` 子句，因此需要多个\
  \ `UPDATE` 语句为多个子集指定表达式 | ```sql\nproc sql;\n   update work.payrollmaster_new\n\
  \      set salary=salary*1.05\n         where substr(jobcode,3,1)='1';\n   update\
  \ work.payrollmaster_new\n      set salary=salary*1.10\n         where substr(jobcode,3,1)='2';\n\
  \   update work.payrollmaster_new\n      set salary=salary*1.15\n         where\
  \ substr(jobcode,3,1)='3';\n``` ``` |\n| 使用一个包含 `CASE` 表达式的单个 `UPDATE` 语句 | ```sql\n\
  proc sql;\n   update work.payrollmaster_new \n      set salary=salary*\n       \
  \  case \n              when substr(jobcode,3,1)='1'\n                 then 1.05\n\
  \              when substr(jobcode,3,1)='2'\n                 then 1.10\n      \
  \        when substr(jobcode,3,1)='3'\n                 then 1.15\n            \
  \  else 1.08\n         end;\n``` ``` |\n\n第一种方法（使用多个 `UPDATE` 语句）非常繁琐，因为 `SET` 语句和表达式在每个\
  \ `UPDATE` 语句中重复。在这个示例中，第一种方法的效率很低，因为必须读取三次 `Work.Payrollmaster_New` 表。第二种方法（使用条件处理——`CASE`\
  \ 表达式）是推荐的。我们现在考虑第二种方法。\n\n\n\n\n\n# CASE 表达式\n\n通用形式，CASE 表达式：`CASE <case-operand>WHEN\
  \ when-condition THEN result-expression<...WHEN when-condition THEN result-expression><ELSE\
  \ result-expression>END;`\n\n以下是该语法的解释：\n- `CASE` 执行条件处理。\n- `case-operand` 是一个可选表达式，它解析为一个表列，其值将与所有\
  \ `when-conditions` 进行比较。\n- `WHEN` 指定一个 `when-condition`，这是一种简短的表达式，它假设 `case-operand`\
  \ 为其操作数之一，并解析为真或假。\n- `THEN` 指定一个 `result-expression`，这是一个解析为特定值的表达式。\n- `ELSE`\
  \ 指定一个 `result-expression`，当没有 `when-conditions` 被执行时，它将提供一个备选操作。\n- `END` 表示 `CASE`\
  \ 表达式的结束。\n\n**注意**：虽然 `ELSE` 子句是可选的，但强烈建议使用它。如果你省略了 `ELSE` 子句，则对于未在任何 `WHEN` 子句中描述的行，其正在更新的列都将接收缺失值（missing\
  \ value）。\n\n**备注**：你还可以在 `INSERT` 和 `SELECT` 语句中使用 `CASE` 表达式。\n\n## 示例\n\n在下面的\
  \ `UPDATE` 语句中，`CASE` 表达式包含三个 `WHEN-THEN` 子句，指定了表 `Work.Insure_New` 中三个不同的行子集：\n\
  \n- 由 Acme 保险的房屋\n- 由 Reliable 保险的房屋\n- 由 Homelife 保险的房屋\n\n```sql\nupdate work.insure_new\n\
  \   set pctinsured=pctinsured*\n      case \n         when company='ACME' \n   \
  \           then 1.10\n         when company='RELIABLE' \n              then 1.15\n\
  \         when company='HOMELIFE' \n              then 1.25 \n         else 1 \n\
  \      end;\n```\n\n`PROC SQL` 会根据相应的 `WHEN-THEN`（或 `ELSE`）子句不同地更新每个指定的行子集。\n\n\
  ## PROC SQL 如何根据 CASE 表达式更新行\n\n当你指定一个 `CASE` 表达式时，`PROC SQL` 按如下方式更新每行：\n\n1. 在\
  \ `CASE` 表达式中，`PROC SQL` 找到包含该行匹配条件的 `WHEN-THEN` 子句。\n2. 随后，`CASE` 表达式将匹配的 `WHEN-THEN`\
  \ 子句的结果返回给 `SET` 子句。返回的值完成了 `SET` 子句中的表达式。\n3. `SET` 子句使用完成后的表达式更新当前行中指定列的值。\n\n\
  `CASE` 表达式之所以高效，是因为 `PROC SQL` 处理 `WHEN-THEN` 子句的方式。`CASE` 表达式中的 `WHEN-THEN` 子句是顺序评估的。当找到匹配的情况时，会评估并设置\
  \ `THEN` 表达式，并且不再考虑剩余的 `WHEN` 情况。\n\n## Case 操作数的工作原理\n\n在接下来的几节中，你将学习在 `UPDATE`\
  \ 语句中使用 `CASE` 表达式，包括带有和不带可选操作数：`CASE <case-operand>`\n\n## 使用不带 Case 操作数的 CASE\
  \ 表达式更新行\n\n这是一个使用 `CASE` 表达式进行条件处理的 `UPDATE` 语句示例。该示例展示了不包含可选操作数的 `CASE` 表达式形式。\n\
  \n## 示例\n\n假设一家公司正在考虑给所有员工加薪，每个级别的员工加薪比例不同：\n\n- level-1 员工获得 5% 的加薪\n- level-2\
  \ 员工获得 10% 的加薪\n- level-3 员工获得 15% 的加薪\n\n首先，你创建一个临时表 `Work.Payrollmaster3`，它是包含员工工资数据的表\
  \ `Sasuser.Payrollmaster` 的副本。`Work.Payrollmaster3` 的前 10 行所示：![Work.Payrollmaster3](img/m73-43-g1.png)\n\
  \n接下来，你创建一个 `PROC SQL` 步骤，使用包含 `SET` 子句和 `CASE` 表达式的 `UPDATE` 语句来更新行：\n\n```sql\n\
  proc sql;\n   update work.payrollmaster3\n      set salary=salary*\n         case\
  \ \n            when substr(jobcode,3,1)='1'\n                 then 1.05\n     \
  \       when substr(jobcode,3,1)='2'\n                 then 1.10\n            when\
  \ substr(jobcode,3,1)='3'\n                 then 1.15\n            else 1.08\n \
  \        end;\n```\n\n在此示例中，`CASE` 表达式包含三个 `WHEN` 子句，每个对应一个行子集（level-1、level-2 和\
  \ level-3 员工），随后跟一个 `ELSE` 子句以处理任何不符合预期条件的行。更新后，`Work.Payrollmaster3` 的前 10 行所示：![Work.Payrollmaster3](img/m73-43-g2.png)\n\
  \n通过比较 `Work.Payrollmaster3` 原始版本和更新版本的 `Salary` 值（如上所示），你可以看到值是如何根据 `JobCode` 中指示的职位级别发生变化的。\n\
  \n## 使用带有 Case 操作数的 CASE 表达式更新行\n\n如果 `SET` 子句中的表达式使用了等号（`=`）比较运算符，你可能会在 `CASE`\
  \ 表达式中使用可选的操作数。考虑前面的 `PROC SQL` 步骤，查看如何使用可选操作数来重写 `UPDATE` 语句中的 `CASE` 表达式。\n\n\
  ## 示例\n\n在下面的 `PROC SQL` 步骤中，`CASE` 表达式包含三个 `WHEN-THEN` 子句，每个子句对应一个行子集，使用了相同的 `SUBSTR`\
  \ 函数：\n\n```sql\nproc sql;\n   update work.payrollmaster3\n      set salary=salary*\n\
  \         case \n            when substr(jobcode,3,1)='1'\n                 then\
  \ 1.05\n            when substr(jobcode,3,1)='2'\n                 then 1.10\n \
  \           when substr(jobcode,3,1)='3'\n                 then 1.15\n         \
  \   else 1.08\n         end;\n```\n\n由于 `SET` 子句中的表达式使用了等号（`=`）运算符，你可以使用替代语法来重构\
  \ `CASE` 表达式。在替代语法中，`SUBSTR` 函数从每个 `WHEN-THEN` 子句中移除，并放在 `CASE` 关键字之后作为操作数：\n\n\
  ```sql\nproc sql;\n   update work.payrollmaster3\n      set salary=salary*\n   \
  \      case substr(jobcode,3,1)\n            when '1'\n                 then 1.05\n\
  \            when '2'\n                 then 1.10\n            when '3'\n      \
  \           then 1.15\n            else 1.08\n         end;\n```\n\n使用替代语法，`SUBSTR`\
  \ 函数只被评估一次，因此这种 `PROC SQL` 步骤效率更高。\n\n## 在 SELECT 语句中使用 CASE 表达式\n\n你可以在三种不同的 `PROC\
  \ SQL` 语句中使用 `CASE` 表达式：`UPDATE`、`INSERT` 和 `SELECT`。在 `SELECT` 语句中，你可以在列定义中使用 `CASE`\
  \ 表达式为不同的行子集指定值。\n\n## 示例\n\n假设你想创建一个显示员工姓名、职位代码和职位级别的输出报告。你的 `PROC SQL` 查询从 `Sasuser.Staffmaster`\
  \ 中选择 `LastName` 和 `FirstName`，从 `Sasuser.Payrollmaster` 中选择 `JobCode`。`SELECT`\
  \ 语句必须将 `JobLevel` 定义为新列，因为它在任何一个表中都不作为单独列存在。你想根据 `jobcode` 末尾的数字来分配 `JobLevel`\
  \ 的值（预期每个 `JobCode` 值的末尾数字为 `1`、`2` 或 `3`）。为了创建 `JobLevel`，你可以使用 `CASE` 表达式的操作数形式来指定三个可能的条件（加上一个防万一的\
  \ `ELSE` 条件）。`PROC SQL` 查询所示：\n\n```sql\nproc sql outobs=10;\n   select lastname,\
  \ firstname, jobcode, \n          case substr(jobcode,3,1)\n             when '1'\n\
  \                  then 'junior'\n             when '2'\n                  then\
  \ 'intermediate'\n             when '3'\n                  then 'senior'\n     \
  \        else 'none'\n          end as JobLevel\n      from sasuser.payrollmaster,\n\
  \           sasuser.staffmaster\n      where staffmaster.empid=\n            payrollmaster.empid;\n\
  ```\n\n| ![PROC SQL Query Output](img/m73-46-g1.png) |\n\n\n\n\n\n`SELECT` 子句使用\
  \ `CASE` 表达式为新 `JobLevel` 列中的每行分配 `junior`、`intermediate`、`senior` 或 `none` 的值。\n\
  \n### 删除表中的行\n\n## 概述\n要删除表中的部分或所有行，请使用 `DELETE` 语句。当语句成功执行时，SAS 日志会显示一条消息，指示已删除的行数。\n\
  \n| 删除表中行的 `DELETE` 语句的通用形式： |\n`DELETE FROM table-name<WHERE expression>;` 此处是语法的说明：`table-name`\
  \ 指定要删除行所在的表名。`WHERE` 用于指定一个表达式，以划分要删除的行子集。 |\n\n**注意**：如果您只想删除表中的部分行，则必须指定 `WHERE`\
  \ 子句，否则表中的所有行都将被删除。\n**注意**：您还可以使用 `DELETE` 语句删除 `PROC SQL` 视图底层的基础表中的行。有关关于在 `DELETE`\
  \ 语句中引用 `PROC SQL` 视图的更多信息，请参阅使用 PROC SQL 创建和管理视图。\n\n## 示例\n假设您想要删除所有用尽常飞行计划里程或花费里程超过账户余额的常旅客飞行计划成员的记录。首先，您通过从现有表\
  \ `Sasuser.Frequentflyers` 复制部分列来创建临时表 `Work.Frequentflyers2`：\n\n```\nproc sql;\n\
  \   create table work.frequentflyers2 as\n      select ffid, milestraveled, \n \
  \            pointsearned, pointsused\n         from sasuser.frequentflyers;\n```\n\
  \n下面显示了 `Work.Frequentflyers2` 的前 10 行![Work.Frequentflyers2](img/m73-48-g1.png)。接下来，您编写了一个\
  \ `PROC SQL` 步骤来删除指定的行：\n\n```\nproc sql;\n   delete from work.frequentflyers2\n\
  \      where pointsearned-pointsused <= 0;\n```\n\nSAS 日志中的消息会告诉您删除了多少行。\n\n表 5.17\
  \ SAS 日志\n```\nNOTE: 13 rows were deleted from WORK.FREQUENTFLYERS2\n```\n\n**提示**：要删除表中的所有行，请从\
  \ `DELETE` 语句中移除 `WHERE` 子句。\n\n## 修改表中的列\n\n## 概述\n您已经看到如何使用 `DELETE` 语句删除表中的行。要添加、删除（移除）或修改表中的列，请使用\
  \ `ALTER TABLE` 语句。\n\n| `ALTER TABLE` 语句的通用形式： |\n`ALTER TABLE table-name<ADD column-definition-1<,\
  \ ... column-definition-n>><DROP column-name-1<, ... column-name-n>><MODIFY column-definition-1<,\
  \ ... column-definition-n>>;` 此处是语法的说明：`table-name` 指定要添加、删除或修改列的表名。必须指定以下子句中的至少\
  \ `<ADD, DROP, MODIFY>`：`ADD` 指定要添加的列的一个或多个列定义。`DROP` 指定要删除（移除）的列的一个或多个列名。`MODIFY`\
  \ 指定要修改的列的一个或多个列定义，其中 `column-definition` 指定要添加或修改的列，其格式如下：`column-name data-type\
  \ <(column-width)> <column-modifier-1 <...column-modifier-n>>` 在所有三个子句中，多个列定义或列名必须用逗号分隔。\
  \ |\n\n**注意**：您无法对视图使用 `ALTER TABLE` 语句。\n**注意**：`ALTER TABLE` 语句还支持类似的子句，用于添加、删除和修改现有表中的完整性约束。这些子句在本章中没有讨论。要了解有关添加、删除和修改完整性约束的信息，请参阅\
  \ SQL 过程 SAS 文档。考虑使用 `ALTER TABLE` 语句对列可以进行的每种类型的修改。\n\n## 向表中添加列\n要向表中添加列，请使用 `ALTER\
  \ TABLE` 语句中的 `ADD` 子句。`ADD` 子句指定一个或多个列定义。列定义的语法与 `CREATE TABLE` 语句中的相同：`column-name\
  \ data-type <(column-width)> <column-modifier-1< ...column-modifier-n>>`。然而，在 `ALTER`\
  \ 语句中，整个列定义组没有包含在括号内。\n\n## 示例\n假设您正在处理临时表 `Work.Payrollmaster4`，它是现有表 `Sasuser.Payrollmaster`\
  \ 的完全副本。`Work.Payrollmaster4` 的前 10 行所示![Work.Payrollmaster4](img/m73-51-g1.png)。随后的\
  \ `PROC SQL` 步骤使用 `ALTER TABLE` 语句中的 `ADD` 子句向 `Work.Payrollmaster4` 添加了 `Bonus`\
  \ 和 `Level` 列：\n\n```\nproc sql;\n   alter table work.payrollmaster4\n      add\
  \ Bonus num format=comma10.2,\n          Level char(3);\n```\n\n下面显示带有两个新列的 `Work.Payrollmaster4`\
  \ 前 10 行![Work.Payrollmaster4](img/m73-51-g1.png)。\n\n## 从表中删除列\n要从表中删除（移除）列，请使用\
  \ `ALTER TABLE` 语句中的 `DROP` 子句。`DROP` 子句指定一个或多个列名，多个列名用逗号分隔。\n\n## 示例\n假设您想从临时表\
  \ `Work.Payrollmaster4` 中删除 `Bonus` 和 `Level` 列（这些列是在上一个示例中添加的）。`Work.Payrollmaster4`\
  \ 的前 10 行所示![Work.Payrollmaster4](img/m73-51-g1.png)。下面的 `PROC SQL` 步骤使用 `ALTER\
  \ TABLE` 语句中的 `DROP` 子句删除 `Bonus` 和 `Level`：\n\n```\nproc sql;\n   alter table work.payrollmaster4\n\
  \      drop bonus, level;\n```\n\n下面显示了没有 `Bonus` 和 `Level` 的 `Work.Payrollmaster4`\
  \ 前 10 行![Work.Payrollmaster4](img/m73-51-g1)。\n\n## 修改表中的列\n要修改表中一个或多个现有列的属性，请使用\
  \ `ALTER TABLE` 语句中的 `MODIFY` 子句。您可以使用 `MODIFY` 子句更改：\n\n* `length`（长度）——仅适用于字符列\n\
  * `informat`\n* `format`\n* `label`\n\n**注意**：您无法使用 `MODIFY` 子句执行以下操作：\n\n* 将字符列更改为数值列或反之。要更改列的数据类型，请删除该列并重新添加（数据），或者使用\
  \ `DATA` 步骤。\n* 更改列名。您无法通过 `ALTER TABLE` 语句更改此属性。相反，可以使用数据集选项 `RENAME=` 或带有 `RENAME`\
  \ 语句的 `DATASETS` 过程。要了解有关带有 `RENAME` 语句的 `DATASETS` 过程的信息，请参阅创建索引。与 `ADD` 子句一样，`MODIFY`\
  \ 子句指定一个或多个列定义，每个定义由以下内容组成：`column-name <data-type (column-width)> <column-modifier-1>`。在每个列定义中，您指定必需元素（列名），然后是您想要修改的任何可选属性。**注意**：当您使用\
  \ `ALTER TABLE` 语句中的 `ADD` 子句来添加新列，或在 `CREATE TABLE` 语句中指定新列时，`data-type` 是必需元素。然而，当您在\
  \ `ALTER TABLE` 语句的 `MODIFY` 子句中使用列定义时（如下例所示），`data-type` 对于数值列始终不是需要的，对于字符列是可选的。只有当您想要修改字符列的宽度时，才必须指定\
  \ `data-type (column-width)`。**注意**：在修改字符变量的宽度时，如果长度规格太小，可能会截断变量的值。\n\n```\nalter\
  \ table work.payrollmaster\nmodify jobcode char(2);\nselect * from payrollmaster;\n\
  ```\n\n\n\n\n假设你想修改临时表 `Work.Payrollmaster4` 中现有列 `Salary` 的属性。下面显示了 `Work.Payrollmaster4`\
  \ 的前 10 行（如上一个示例结束时的状态）。![修改列](img/m73-53-g1.png) `Salary` 列是一个数值字段，目前格式为 `DOLLAR9`。接下来的\
  \ `PROC SQL` 步骤修改了 `Salary` 的格式并添加了标签：\n\n```\nproc sql;\n   alter table work.payrollmaster4\n\
  \      modify salary format=dollar11.2 label=\"Salary Amt\";\n```\n\n下面显示了具有新 `Salary`\
  \ 列属性的 `Work.Payrollmaster4` 的前 10 行。![修改列](img/m73-53-g2.png) \n\n## 在单条语句中添加、删除和修改列\n\
  \n在最后几个示例中，`ALTER TABLE` 语句仅通过一个子句对表列进行了一项更改。然而，你可以在单个 `ALTER TABLE` 语句中包含多个子句，以同时完成添加、删除和修改列的操作。\n\
  \n## 示例\n\n假设你想使用单个 `ALTER TABLE` 语句对表 `Work.Payrollmaster4` 执行以下所有更改：\n\n*   使用\
  \ `ADD` 子句添加新列 `Age`\n*   使用 `MODIFY` 子句将 `DateOfHire` 列的格式（目前为 `DATE9.`）更改为 `MMDDYY10.`\n\
  *   使用 `DROP` 子句删除 `DateOfBirth` 和 `Gender` 列\n\n下面显示了如上一个示例结束时 `Work.Payrollmaster4`\
  \ 的前 10 行。![在单条语句中添加、删除和修改列](img/m73-54-g1.png) 接下来的 `PROC SQL` 步骤在 `ALTER TABLE`\
  \ 语句中使用多个子句来完成上述列的所有三个更改：\n\n```\nproc sql;\n   alter table work.payrollmaster4\n\
  \      add Age num \n      modify dateofhire date format=mmddyy10.\n      drop dateofbirth,\
  \ gender;\n```\n\n下面显示了经过这三项更改的 `Work.Payrollmaster4` 的前 10 行。![在单条语句中添加、删除和修改列](img/m73-54-g2.png)\
  \ 使用 `UPDATE` 语句填充新列。\n\n# 删除表\n\n## 概述\n\n要删除（移除）一个或多个整个表，请使用 `DROP TABLE` 语句。\n\
  \n| 通用格式，`DROP TABLE` 语句：`DROP TABLE table-name-1 <, ... table-name-n>;` |\n以下是对语法的解释：`table-name`\
  \ 指定要删除的表名，可以是以下内容之一：\n\n*   单级名称\n*   两级库引用（libref）和表名\n*   用单引号括起来的物理路径名。\n\n\
  ## 示例\n\n在最后几个示例中，你对临时表 `Work.Payrollmaster4` 进行了多处更改。现在你决定不再需要这张表了。接下来的 `PROC SQL`\
  \ 步骤使用 `DROP TABLE` 语句删除 `Work.Payrollmaster4`：\n\n```\n proc sql;\n    drop table\
  \ work.payrollmaster4;\n```\n\nSAS 日志显示一条表已删除的消息：\n\n表 5.18 SAS 日志\n\n| ``` NOTE:\
  \ Table WORK.PAYROLLMASTER4 has been dropped.\\n ``` |\n\n## 总结\n\n## 文字总结\n\n###\
  \ 理解创建表的方法\n\n你可以使用 `CREATE TABLE` 语句以三种不同的方式创建表：\n\n*   通过定义列来创建一个没有行的表（空表）\n*\
  \   创建一个与另一个表相似的空表\n*   根据查询结果创建一个包含行的表\n\n### 通过定义列创建空表\n\n你可以使用包含列规范的 `CREATE\
  \ TABLE` 语句来创建一个没有行的表。列规范包含以下元素：列名（必需的）、数据类型（必需的）、列宽（可选）、一个或多个列修饰符（可选）以及列约束（可选）。\n\
  \n### 显示表结构\n\n若要在 SAS 日志中显示表的列列表及其属性以及关于表的其他信息，请使用 `DESCRIBE TABLE` 语句。\n\n###\
  \ 创建与另一个表相似的空表\n\n要创建一个与现有表结构相同的无行表，请使用包含 `LIKE` 关键字的 `CREATE TABLE` 语句。要指定从现有表中复制的列子集，请在你的\
  \ `CREATE TABLE` 语句中使用 SAS 数据集选项 `DROP=` 或 `KEEP=`。\n\n### 从查询结果创建表\n\n要创建一个包含源自现有表或多个表的列和行的新表，请使用包含\
  \ `AS` 关键字和查询中所用子句的 `CREATE TABLE` 语句。这种方法允许你快速复制现有表。\n\n### 向表中插入数据行\n\n`INSERT`\
  \ 语句可以用三种方式向现有表（无论是空的还是已填充的）插入数据行。你可以通过以下方式插入行：\n\n*   使用 `SET` 子句成对指定列名和值\n*  \
  \ 使用 `VALUES` 子句指定值列表\n*   使用查询中用于从现有表中返回行的子句\n\n### 创建具有完整性约束的表\n\n完整性约束是你指定的规则，用于限制存储在列中的数据。要创建一个具有完整性约束的表，请使用\
  \ `CREATE TABLE` 语句。完整性约束可以通过两种方式定义：\n\n*   通过规范中的约束\n*   使用约束指定\n\n### 处理插入行时的错误\n\
  \n当你向具有完整性约束的表添加行时，`PROC SQL` 会评估新数据以确保符合条件。在使用 `INSERT` 或 `UPDATE` 语句添加或修改数据时，你可以使用\
  \ `PROC SQL` 语句中的 `UNDO_POLICY=` 选项来指定 `PROC SQL` 是否撤回到错误点为止提交的更改。\n\n### 显示表的完整性约束\n\
  \n若要在 SAS 日志中显示表的完整性约束，请使用 `DESCRIBE TABLE CONSTRAINTS` 语句。\n\n### 更新现有表的值\n\n要修改表中某些或所有行的值，请使用带有内容的\
  \ `UPDATE` 语句：\n\n*   `SET` 子句以及可能的 `WHERE` 子句指定单个更新表达式。若要更新多个表达式，请使用多个 `UPDATE`\
  \ 语句。\n*   `CASE` 表达式指定多个更新表达式。`CASE` 表达式可以不带可选的操作数，或者如果 `SET` 子句中的表达式使用了等号（=）比较运算符，则可以带有操作数。`CASE`\
  \ 表达式也可以用于新列定义的 `SELECT` 语句，为不同的行集指定不同的值。\n\n删除 删除表行\n\n要删除表中某些或所有行，请使用 `DELETE`\
  \ 语句。\n\n### 修改表列\n\n要修改表的列，请使用包含以下一个或多个子句的 `ALTER TABLE` 语句：\n\n*   `ADD` 子句，向表添加一个或多个列\n\
  *   `DROP` 子句，删除表中的一个或多个列\n*   `MODIFY` 子句，修改列的属性\n\n## 示例程序\n\n### 通过定义列创建空表\n\n\
  ```\n proc sql;\n    create table work.discount \n           (Destination char(3),\n\
  \           BeginDate num Format=date9.,\n           EndDate num format=date9.,\n\
  \           Discount num);\nquit;\n```\n\n### 创建与另一个表相似的空表\n\n```\nproc sql;\n \
  \  create table work.flightdelays2\n          (drop=delaycategory destinationtype)\
  \ \n      like sasuser.flightdelays;\nquit;\n```\n\n\n\n\n```sas\nproc sql;\n  \
  \ create table work.ticketagents as\n      select lastname, firstname,\n       \
  \      jobcode, salary\n         from sasuser.payrollmaster,\n              sasuser.staffmaster\n\
  \         where payrollmaster.empid\n               = staffmaster.empid\n      \
  \         and jobcode contains 'TA';\nquit;\n```\n\n### 显示表的结构\n\n```sas\nproc sql;\n\
  \   describe table work.discount;\nquit;\n```\n\n### 通过指定列名和值向表中插入行\n\n```sas\n\
  proc sql;\n   insert into work.discount\n        set destination='LHR',\n      \
  \      begindate='01MAR2000'd,\n            enddate='05MAR2000'd,\n            discount=.33\n\
  \        set destination='CPH',\n            begindate='03MAR2000'd,\n         \
  \   enddate='10MAR2000'd,\n            discount=.15;\nquit;\n```\n\n### 通过指定值列表向表中插入行\n\
  \n```sas\nproc sql;\n   insert into work.discount (destination, \n          begindate,enddate,\
  \ discount)\n      values ('LHR','01MAR2000'd, \n             '05MAR2000'd,.33)\n\
  \      values ('CPH','03MAR2000'd,\n             '10MAR2000'd,.15);\nquit;\n```\n\
  \n### 从查询结果向表中插入行\n\n```sas\nproc sql; \n   insert into work.payrollchanges2\n \
