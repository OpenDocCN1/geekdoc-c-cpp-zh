  1.  在指定的 SAS 目录（默认为 `Work.Sasmacr`）中查找名为 `Macro-name.Macro` 的项。\n2.  执行 `Macro-name`\
  \ 内部已编译的宏语言语句。\n3.  将 `Macro-name` 中的任何剩余文本发送到输入栈中进行单词扫描。\n4.  当 SAS 编译器接收接收全局 SAS\
  \  或遇到 SAS  边界时，，挂起执行。\n5.  在 SAS SAS 执行后后恢复宏语言语句的执行。\n\n在本章的后半部分，你将看到宏执行的详细示例。一旦你学会了如何编写比本章目前看到的更复杂的宏程序，这些示例就会更有意义。现在，请记住，宏调用会在任何如\
  \ `DATA` 步骤等 SAS 语言语句编译或执行之前由宏处理器处理。在宏执行期间，宏处理器可以与以下内容直接通信：\n\n*   全局和局部符号表。例如，宏处理器可以使用\
  \ `%LET` 语句存储宏变量值，并解析宏变量引用。\n*   输入栈。例如，宏处理器可以生成文本以进行单词扫描。\n\n**注意**：关于全局和局部符号表，将在稍后介绍。\n\
  \n示例\n\n当你在 SAS 程序中调用宏时，单词扫描器会将宏调用传递给宏处理器，因为宏名称前的百分号是宏触发器。当宏处理器接收到 `%macro-name`\
  \ 时，它：\n\n1.  在指定的 SAS 目录（默认为 `Work.Sasmacr`）中查找名为 `Macro-name.Macro` 的项。\n2.  执行\
  \ `Macro-name` 内部已编译的宏语言语句。\n3.  将 `Macro-name` 中的任何剩余文本发送到输入栈中进行单词扫描。\n4.  当 SAS\
  \ 编译器接收到全局 SAS 语句或遇到 SAS 步骤边界时，挂起宏执行。\n5.  在 SAS 代码执行后，恢复宏语言语句的执行。\n\n（由于提供的待翻译文本存在大量重复的乱码，上述翻译已根据核心逻辑进行了结构化处理，并确保格式一致性。）\n\
  \n\n\n\n您可能希望在以下条件下指定 `MPrint` 系统选项：\n\n* 您遇到了 SAS 语法错误或执行错误\n* 您想要查看生成的生成的 SAS\
  \ 代码。\n\n`MPrint` 系统选项通常与 `SOURCE` 系统选项同步，用于显示或隐藏已执行的 SAS 代码。\n\n## 示例\n\n假设你想调用\
  \ `Prtlast` 宏，并使用 `MPrint` 系统选项显示宏执行后生成的 SAS 代码。目录项（Catalog Entry）\n\n```\n%macro\
  \ prtlast;\n   proc print data=&syslast (obs=5);\n      title \"Listing of &syslast\
  \ data set\";\n   run;\n%mend;\n```\n\n下面的示例代码创建一个名为 `Sales` 的数据集，指定了 `MPrint` 选项，并引用了\
  \ `Prtlast` 宏：\n\n```\ndata sales;\n   price_code=1;\nrun;\noptions mprint;\n%prtlast\n\
  ```\n\n写入 SAS 日志的消息显示了发送给编译器的文本。注意，在写入 SAS 日志的 `MPrint` 消息中，宏变量引用（`&SYSLAST`）被解析为值\
  \ `Work.Sales`。\n\n表 11.3 SAS 日志\n\n| |\n```\n101  %prtlast\nMPRINT(PRTLAST): proc\
  \ print data=WORK.SALES (obs=5);\nMPRINT(PRTLAST): title \"Listing of WORK.SALES\"\
  ;\nMPRINT(PRTLAST): run;\nNOTE: There were 1 observations read from the dataset\
  \ WORK.SALES.\nNOTE: PROCEDURE PRINT used:\n      real time           0.04 seconds\n\
  \      cpu time            0.04 seconds\n```\n |\n\n## MLOGIC 选项\n\n在调试程序时，另一个可能用的系统选项是\
  \ `MLOGIC` 选项。`MLOGIC` 选项会打印指示宏执行期间所采取操作的消息。\n\n| 通用格式，`MLOGIC | NOMLOGIC` 选项：`OPTIONS\
  \ MLOGIC | NOMLOGIC;` 以下是语法解释：`NOMLOGIC` 是默认设置，指定在宏执行期间不将宏操作的消息打印到 SAS 日志中。`MLOGIC`\
  \ 指定在宏执行期间将宏操作的消息打印到日志中。 |\n\n当 `MLOGIC` 系统选项生效时，SAS 日志消息中显示的信息包括\n\n* 宏执行的开始\n\
  * 调用时宏参数的值\n* 每条宏程序语句的执行\n* 每个 `%IF` 条件是真还是假\n* 宏执行的结束。\n\n## 示例\n\n假设你想在仅启用 `MLOGIC`\
  \ 选项的情况下重复上一个示例。此示例代码创建一个名为 `Sales` 的数据集，设置了 `MLOGIC` 系统选项，并调用了 `Prtlast` 宏。\n\n\
  ```\ndata sales;\n   price_code=1;\nrun;\noptions nomprint mlogic;\n%prtlast\n```\n\
  \n当提交此代码时，写入 SAS 日志的消息将显示宏处理的开始和结束。。\n\n表 11.4 SAS 日志\n\n| |\n```\n107   %prtlast\n\
  MLOGIC(PRTLAST): Beginning execution.\nNOTE: There were 1 observations read from\
  \ the dataset WORK.SALES.\nNOTE: PROCEDURE PRINT used:\n      real time        \
  \   0.02 seconds\n      cpu time            0.02 seconds\nMLOGIC(PRTLAST): Ending\
  \ execution.\n```\n |\n\n`MLOGIC` 选项与 `SYMBOLGEN` 选项通常被\n\n\n\n* 为了开发和调试目的而开启\n\
  * 在应用程序处于生产模式时关闭。\n\n## 宏程序中的注释\n\n与任何其他程序一样，你的宏程序也可以从注释中获益。如果你计划永久保存宏或与其他用户共享宏，注释将特别有帮助。你可以通过宏注释语句在宏定义中放置注释。\n\
  \n| 通用格式，宏注释语句：`%*comment;` 以下是语法解释：`comment` 可以是任何消息。像其他 SAS 语句一样，每个宏注释语句都以分号结束。\
  \ |\n\n## 示例\n\n下面的代码使用宏注释来描述宏的功能：\n\n```\n%macro printit;\n   %* The value of &syslast\
  \ will be substituted appropriately ;\n   %* as long as a data set has been created\
  \ during this session. ;\n   proc print data=&syslast(obs=5);\n/* 只打印前 5 个观测 */\n\
  \   title \"Last Created Data Set Is &syslast\";\n   run;\n%mend;\n```\n\n注意：你也可以在宏内部使用注释符号\
  \ `/*` 和 `*/`。当这些符号出现时，宏处理器会忽略注释内的文本。\n\n# 使用宏参数\n\n你已经看到了宏定义的 Basic 形式。你的宏通常包含宏变量。为了让宏更具动态性，你可以使用\
  \ `%LET` 语句更新宏内部使用的宏变量的值。然而，宏定义中的参数列表允许你更方便地更新宏程序中的宏变量。参数列表是 `%MACRO` 语句的可选部分，用于命名一个或多个宏变量，当你在调用宏时指定这些宏变量的值。\n\
  \n## 示例\n\n假设编译后的宏 `Printdsn` 包含了对宏变量 `dsn`（记录数据集名称）和 `vars`（记录数据集变量列表）的引用，如下：\n\
  \n```\n%macro printdsn;\n   proc print data=&dsn;\n      var &vars;\n   title \"\
  Listing of %upcase(&dsn) data set\";\n   run;\n%mend;\n```\n\n你可以通过在调用宏之前使用 `%LET`\
  \ 语句更改宏变量 `dsn` 或 `vars` 的值来修改 `Printdsn` 的行为。例如，你可以在宏执行时将 `sasuser.courses` 替换为\
  \ `dsn`，将 `course_code course_title days` 替换为 `vars`，如下：\n\n```\n%let dsn=sasuser.courses;\n\
  %let vars=course_code course_title days;\n%printdsn\n```\n\n如果在提交此代码时开启了 `MPrint`\
  \ 系统选项，则以下消息被写入 SAS 日志。注意，你在 `%LET` 语句中提供的值在宏出现在 SAS 日志时已替换到宏中。\n\n表 11.5 SAS 日志\n\
  \n| |\n```\n7     options mprint;\n8     %let dsn=sasuser.courses;\n9     %let vars=course_code\
  \ course_title days;\n10    %printdsn\nNOTE: Writing HTML Body file: sashtm.htm\n\
  MPRINT(PRINTDSN): proc print data=sasuser.courses;\nMPRINT(PRINTDSN):  var course_code\
  \ course_title days;\nMPRINT(PRINTDSN):  title \"Listing of SASUSER.COURSES data\
  \ set\";\nMPRINT(PRINTDSN):  run;\nNOTE: There were 6 observations read from the\
  \ dataset\n      SASUSER.COURSES.\nNOTE: PROCEDURE PRINT used (Total process time):\n\
  \      real time           6.59 seconds\n      cpu time            0.28 seconds\n\
  ```\n |\n\n然后你可以提交新的 %LET 语句，以便在执行时将 `dsn` 的值更改为 `sasuser.schedule`，并将 `vars` 的值更改为\
  \ `course_code location begin_date`，如下：\n\n```\n%let dsn=sasuser.schedule;\n%let\
  \ vars=course_code location begin_date;\n%printdsn\n```\n\n提交此代码时写入 SAS 日志的消息显示，新值已替换宏中的宏变量引用。\n\
  \n表 11.6 SAS 日志\n\n| |\n```\n11   %let dsn=sasuser.schedule;\n12   %let vars=course_code\
  \ location begin_date;\n13   %printdsn\nMPRINT(PRINTDSN):   proc print data=sasuser.schedule;\n\
  MPRINT(PRINTDSN):   var course_code location begin_date;\nMPRINT(PRINTDSN):   title\
  \ \"Listing of SASUSER.SCHEDULE data set\";\nMPRINT(PRINTDSN):   run;\nNOTE: There\
  \ were 18 observations read from the dataset\n      SASUSER.SCHEDULE.\nNOTE: PROCEDURE\
  \ PRINT used (Total process time):\n      real time           0.76 seconds\n   \
  \   cpu time            0.08 seconds\n```\n |\n\n你可以通过在宏定义中使用参数创建宏变量，从而使这些宏变量更容易更新。这样你就可以每次调用宏时向宏变量传递值，而不是使用独立的\
  \ %LET 语句。接下来的几节将介绍如何使用各种类型的参数创建宏变量。\n\n## 包含位置参数的宏\n\n\n\n\n\n当你在宏定义中包含位置参数时，在调用宏时，会为每个参数自动创建一个宏变量。要定义包含位置参数的宏，你需要在宏定义的\
  \ `%MACRO` 语句中列出宏变量的名称。之所以被称为位置参数，是因为你在宏定义中指定它们的顺序决定了它们从宏调用中获取值赋值的顺序。也就是说，当你调用一个包含位置参数的宏时，你必须按照参数在定义中定义的顺序，指定在参数中定义的宏变量的值。\n\
  \n| 通用形式，包含位置参数的宏定义：`%MACRO macro-name(parameter-1<,...,parameter-n>);text%MEND\
  \ <macro-name>`;这里是对语法的解释：`parameter-1<,...,parameter-n>` 指定一个或多个位置参数，用逗号分隔。你必须为每个参数提供一个名称：你不能使用文本表达式来生成它。\
  \ |\n\n要调用包含位置参数的宏，请在宏名称前加上百分号符号，并将参数值括在括号内。按照参数在宏定义中列出的顺序相同的顺序列出这些值，并用逗号分隔，如下：`macro-name(value-1<,...,value-n>)`。宏调用中列出的值：\n\
  \n*   可以为空值、文本、宏变量引用或宏调用\n*   通过一对一对应关系赋值给参数变量。\n\n## 示例\n\n你可以使用位置参数在 `Printdsn`\
  \ 宏定义中创建宏变量 `dsn` 和 `vars`，如下：\n\n```\n%macro printdsn(dsn,vars);\n   proc print\
  \ data=&dsn;\n      var &vars;\n   title \"Listing of %upcase(&dsn) data set\";\n\
  \   run;\n%mend;\n```\n\n在这种情况下，当你调用 `Printdsn` 宏时，你为参数中创建的宏变量分配值。在接后的示例中，值 `sasuser.courses`\
  \ 被赋值给宏变量 `dsn`，值 `course_code course_title days` 被赋值给宏变量 `vars`。注意，`dsn` 的值列在第一，`vars`\
  \ 的值列在第二，因为这是它们在宏定义中列出的顺序。\n\n```\n%printdsn(sasuser.courses,course_code course_title\
  \ days)\n```\n\n注意：要为一个或多个位置参数替换空值，请使用逗号作为省略值的占位符，如下：\n\n```\n%printdsn(,course_code\
  \ course_title days)\n```\n\n## 包含关键字参数的宏\n\n你也可以在宏定义中包含关键字参数。与位置参数一样，关键字参数也会创建宏变量。然而，当你使用关键字参数创建宏变量时，你需要在宏定义中指定每个宏变量的名称、随后的等号以及值。关键字参数可以以任何顺序列出。为\
  \ `%MACRO` 语句中的每个参数（或变量）分配的任何值都将成为它的默认值。允许使用空值。\n\n| 通用形式，包含关键字参数的宏定义：`%MACRO macro-name(keyword-1=<value-1><,...,keyword-n=<value-n>>);text%MEND\
  \ <macro-name>`;这里是对语法的解释：`keyword-1=<value-1><,...,keyword-n=<value-n>` 指定一个或多个宏参数，后面紧跟等号。你可以在等号之后指定默认值。如果你省略了默认值，则关键字参数的值为空值。\
  \ |\n\n当你调用定义包含关键字参数的宏时，你需要指定关键字、随后的等号以及每个参数的值。顺序并不重要。如果你在宏调用中省略了关键字参数，则关键字变量将保留其默认值，如下：\n\
  \n```\n%macro-name(keyword-1=value-1<,...,keyword-n=value-n>)\n```\n\n## 示例\n\n\
  你可以使用关键字参数在 `Printdsn` 宏中创建宏变量 `dsn` 和 `vars`。此示例为宏变量 `dsn` 赋值了默认值 `sasuser.courses`，并为宏变量\
  \ `vars` 赋值了默认值 `course_code course_title days`：\n\n```\n%macro printdsn(dsn=sasuser.courses,\n\
  \               vars=\ncourse_code course_title days);\n   proc print data=&dsn;\n\
  \      var &vars;\n   title \"Listing of %upcase(&dsn) data set\";\n   run;\n%mend;\n\
  ```\n\n要为 `dsn` 赋值 `sasuser.schedule` 并为 `vars` 赋值 `teacher course_title begin_date`\
  \ 来调用 `Printdsn` 宏，请执行以下调用：\n\n```\n%printdsn(dsn=sasuser.schedule, vars=teacher\
  \ course_code begin_date)\n```\n\n要使用参数的默认值调用 `Printdsn` 宏（`sasuser.courses` 作为\
  \ `dsn` 的值，`course_code course_title days` 作为 `vars` 的值），你可以执行以下调用：\n\n```\n%printdsn()\n\
  ```\n\n注意：要使用参数的默认值调用宏 `Printdsn`，你也可以执行一个显式指定这些值的宏调用，如下：\n\n```\n%printdsn(dsn=sasuser.courses,vars=course_code\
  \ course_title days)\n```\n\n## 包含混合参数列表的宏\n\n你也可以在宏定义中包含同时含有位置参数和关键字参数的参数列表。`%MACRO`\
  \ 语句中的所有位置参数变量必须在任何关键字参数变量列出。\n\n| 通用形式，包含混合参数的宏定义：`%MACRO macro-name(parameter-1<,...,parameter-n>,keyword-1=<value-1><,...,keyword-n=<value-n>>);text%MEND`;这里是对语法的解释：`parameter-1<,...,parameter-n>`\
  \ 列在 `keyword-1=<value-1><,...,keyword-n=<value-n>>` 之前。 |\n\n同样，当你调用包含混合参数列表的宏时，你必须在任何关键字值之前列出位置值，如下：\n\
  \n```\n%macro-name(value-1<,...,value-n>,\n            keyword-1=value-1<,...,keyword-n=value-n>)\n\
  ```\n\n## 示例\n\n你可以结合位置参数和关键字参数来在 `Printdsn` 宏定义中创建宏变量。这段代码使用位置参数来创建宏变量 `dsn`，使用关键字参数来创建宏变量\
  \ `vars`：\n\n```\n%macro printdsn(dsn, vars=course_title code_code days);\n   proc\
  \ print data=&dsn;\n      var &vars;\n   title \"Listing of %upcase(&dsn) data set\"\
  ;\n   run;\n%mend;\n```\n\n对 `Printdsn` 宏的以下调用将 `sasuser.schedule` 赋值给宏变量 `dsn`，并将\
  \ `teacher location begin_date` 赋值给宏变量 `vars`。注意 `dsn` 的值列在第一，因为 `dsn` 是位置参数。\n\n\
  ```\n%printdsn(sasuser.schedule, vars=teacher location begin_date)\n```\n\n现在，假设你想执行\
  \ `Printdsn` 宏，为宏变量 `vars` 赋值默认值 `course_title code_code days` 并为宏变量 `dsn` 赋值 `sasuser.courses`。你可以执行以下调用：\n\
  \n```\n%printdsn(sasuser.courses)\n```\n\n由于此调用省略了关键字参数（vars），因此使用了该参数的默认值。\n\n\
  ## 包含 PARMBUFF 选项的宏\n\n你可以在宏定义中使用 PARMBUFF 选项来创建一个每次调用接受不同数量参数的宏。PARMBUFF 选项会将宏调用中的整个参数列表（包括名称式调用中的括号）赋值为自动宏变量\
  \ `SYSPBUFF` 的值。\n\n| 通用形式，带有 PARMBUFF 选项的宏定义：`%MACRO macro-name /PARMBUFF;text%MEND`;这里是对语法的解释：text\
  \ 包含了对自动宏变量 `SYSPBUFF` 的引用。 |\n\n## 示例\n\n以下宏定义创建了一个名为 `Printz` 的宏。`Printz` 使用不同数量的参数和自动宏变量\
  \ `SYSPBUFF` 来显示宏调用中指定的参数。该宏还使用循环来打印作为参数命的数据集。\n\n\n\n\n\n```\n%macro printz/parmbuff;\n\
  \   %put Syspbuff contains: &syspbuff;\n   %local num;\n   %do num=1 %to %sysfunc(countw(&syspbuff));\n\
  \   %let dsname=%scan(&syspbuff,&num);\n      proc print data=sasuser.&dsname;\n\
  \      run;\n   %end;\n%mend printz;\n```\n\n如果你提交一个包含两个参数的宏调用，`Printz` 宏会在 SAS\
  \ 日志中写入以下行，并打印两个数据集。\n\n```\n%printz(courses, schedule)\n```\n\n表 11.7 SAS 日志\n\n\
  | |\n```\nSyspbuff contains: (courses,schedule)\n```\n| |\n\n如果你提交一个包含一个参数的宏调用，`Printz`\
  \ 宏会在 SAS 日志中写入以下行，并打印一个数据集：\n\n```\n%printz(courses)\n```\n\n表 11.8 SAS 日志\n\n\
  | |\n```\nSyspbuff contains: (courses)\n```\n| |\n\n注意：如果宏定义同时包含一组参数和 PARMBUFF 选项，宏调用会导致参数接收值，并将整个值列表分配给\
  \ `SYSPBUFF`。\n\n# 符号符号表\n\n## 全局符号表\n\n你已经对全局符号表相当熟悉了。请记住，自动宏变量存储在全局符号表中。你在开放代码（宏定义外部的代码）中使用\
  \ `%LET` 语句创建的用户自定义宏变量也存储在全局符号表中。![global 符号表](img/m52-27-g1.png)全局符号表在 SAS 会话初始化期间创建，并在会话结束时删除。全局符号表中的宏变量：\n\
  \n*   在会话期间任何时候都可用\n*   可以由用户创建\n*   其值可以在会话期间更改（某些自动宏变量除外）。\n\n你可以通过以下方式创建全局宏变量：\n\
  \n*   使用 `%LET` 语句（在宏定义外部）\n*   包含 `SYMPUT` 过程的 `DATA` 步\n*   包含 `SYMPUTX` 过程的 `DATA`\
  \ 步\n*   `PROC SQL` 中包含 `INTO` 子句的 `SELECT` 语句\n*   一个 `%GLOBAL` 语句\n\n你应该已经熟悉 `%LET`\
  \ 语句、`SYMPUT` 过程和 `INTO` 子句了。让我们检查 `%GLOBAL` 语句。\n\n## %GLOBAL 语句\n\n`%GLOBAL` 语句：\n\
  \n*   在全局符号表中创建一个或多个宏变量并为它们分配空值\n*   可以用在宏定义内部或外部\n*   对已在全局符号表中的变量没有影响\n\n`%GLOBAL`\
  \ 语句的通用形式：`%GLOBAL macro-variable-1 <...macro-variable-n>;`\n\n以下是对语法的解释：`macro-variable`\
  \ 是宏变量的名称，或者是生成宏变量名称的文本表达式。\n\n## 示例\n\n要在宏定义内部创建全局宏变量，可以使用 `%GLOBAL` 语句。以下示例中的\
  \ `%GLOBAL` 语句创建了两个全局宏变量 `dsn` 和 `vars`。`%LET` 语句如下为新的全局宏变量分配了值：\n\n```\n%macro\
  \ printdsn;\n   %global dsn vars;\n   %let dsn=sasuser.courses;\n   %let vars=course_title\
  \ course_code days;\n   proc print data=&dsn;\n      var &vars;\n   title \"Listing\
  \ of &dsn data set\";\n   run;\n%mend;\n\n%printdsn\n```\n\n注意：你使用 `%SYMDEL` 语句在\
  \ SAS 会话期间从全局符号表中删除宏变量。要从全局符号表中删除宏变量 `dsn`，提交以下语句：\n\n```\n%symdel dsn;\n```\n\n\
  ## 局部符号表\n\n当调用包含参数列表的宏或在宏执行期间请求创建局部变量时，会创建一个局部符号表。宏执行完成后，局部符号表会被删除。也就是说，局部符号表只在宏执行期间存在。![local\
  \ 符号表](img/m52-29-g1.png)局部符号表包含可以：\n\n*   在宏调用时创建并初始化（即通过参数）\n*   在宏执行期间创建或更新\n\
  *   在宏内部任何地方引用的\n\n你可以通过以下方式创建局部宏变量：\n\n*   宏定义中的参数\n*   宏定义内部的 `%LET` 语句\n*   宏定义内部包含\
  \ `SYMPUT` 过程的 `DATA` 步\n*   宏定义内部包含 `SYMPUTX` 过程的 `DATA` 步\n*   宏定义内部 `PROC SQL`\
  \ 中包含 `INTO` 子句的 `SELECT` 语句\n*   一个 `%LOCAL` 语句 \n\n注意：如果已经存在局部符号表，`SYMPUT` 过程可以创建一个局部宏变量。如果在执行\
  \ `SYMPUT` 过程时不存在局部符号表，它将创建一个全局宏变量。你已经学习了在宏定义中使用参数。你也应该已经熟悉 `%LET` 语句、`SYMPUT` 过程和\
  \ `INTO` 子句了。让我们检查 `%LOCAL` 语句。\n\n## %LOCAL 语句 \n\n`%LOCAL` 语句：\n\n*   只能出现在宏定义内部\n\
  *   在局部符号表中创建一个或多个宏变量并为它们分配空值\n*   对已在局部符号表中的变量没有影响\n\n在请求创建局部变量之前，不会创建局部符号表。由于局部符号表与全局符号表独立存在，可能存在名称相同但值不同的局部宏变量和全局变量。在这个示例中，第一个\
  \ `%LET` 语句创建了一个全局宏变量 `dsn` 并为其分配了值 `sasuser.courses`。宏定义内部的 `%LOCAL` 语句创建了一个局部变量\
  \ `dsn`，宏定义内部的 `%LET` 语句为其分配了值 `sasuser.register`。宏定义内部的 `%PUT` 语句将局部 `dsn` 的值写入\
  \ SAS 日志：\n\n```\n%macro printdsn;\n   %global dsn vars;\n   %let dsn=sasuser.courses;\n\
  \   %let vars=course_title course_code days;\n   proc print data=&dsn;\n      var\
  \ &vars;\n   title \"Listing of &dsn data set\";\n   run;\n%mend;\n\n%printdsn\n\
  ```\n\n当提交此代码时，以下语句将被写入 SAS 日志。\n\n表 11.9 SAS 日志\n\n| |\n```\n199  %let dsn=sasuser.courses;\n\
  200\n201  %macro printdsn;\n202     %local dsn;\n203     %let dsn=sasuser.register;\n\
  204     %put The value of DSN inside Printn is &dsn;\n205  %mend;\n206\n207  %printdsn\n\
  The value of DSN inside Printn is sasuser.register\n208  %put The value of DSN outside\
  \ Printn is &dsn;\nThe value of DSN outside Printn is sasuser.courses\n```\n| |\n\
  \n## 创建和更新变量的规则\n\n当宏处理器在宏执行期间接收到创建或更新宏变量的请求时，宏处理器遵循某些规则。假设宏处理器在宏调用期间接收到如下 `%LET`\
  \ 语句：\n\n```\n%let macvar=value;\n```\n\n宏处理器处理以下步骤：\n\n1.  宏处理器检查宏变量 `macvar` 是否已存在于局部符号表中。如果是，宏处理器在局部符号表中更新\
  \ `macvar` 值为 value。如果 `macvar` 不在表中，宏处理器跳转到第 2 步。\n2.  宏处理器检查宏变量 `macvar` 是否已存在于全局符号表中。如果是，宏处理器在全局符号表中更新\
  \ `macvar` 值为 value。如果 `macvar` 不在全局符号表中，宏处理器跳转到第 3 步。\n3.  宏处理器在局部符号表中创建一个名为 `macvar`\
  \ 的宏变量并为其分配值 value。\n\n\n\n\n\n![macro variable macvar](img/m52-31-g1.png) 同样，假设宏处理器在宏调用期间接收到以下引用：\n\
  \n```\n&macvar\n```\n\n宏处理器执行以下步骤：\n\n1. 宏处理器检查宏变量 `macvar` 是否存在于本地符号表中。如果存在，则宏处理器从本地符号表中检索\
  \ `macvar` 的值。如果 `macvar` 不存在于本地表中，则宏处理器将继续执行到第 2 步。\n2. 宏处理器检查宏变量 `macvar` 是否存在于全局符号表中。如果存在，则宏处理器从全局符号表中检索\
  \ `macvar` 的值。如果 `macvar` 不存在于全局表中，则宏处理器将继续执行到第 3 步。\n3. 宏处理器将标记（tokens）返回给单词扫描器（word\
  \ scanner）。在 SAS 日志中写入一条警告消息，以指示该引用未解析。\n\n![Warning message](img/m52-31-g2.png)\
  \ 注意：请记住，如果宏处理器在开放代码（open code）中接收到 `%LET` 语句或宏变量引用（`&macvar`），它仅检查全局符号表中是否存在该宏变量。如果宏程序当前没有执行，则不存在本地符号表。\n\
  \n## 多个本地符号表\n\n如果你使用了嵌套宏，在宏执行期间可以同时存在多个本地符号表。也就是说，如果你定义了一个调用另一个宏程序的宏程序，并且两个宏都创建了本地符号表，那么在执行第二个宏时，会存在两个本地符号表。\n\
  \n## 示例\n\n假设已经编译了以下两个宏：`Outer` 和 `Inner`。名为 `Outer` 的宏创建了一个名为 `variX` 的本地宏变量，并为其赋值值\
  \ `one`。然后 `Outer` 调用另一个名为 `Inner` 的宏程序。名为 `Inner` 的宏创建了一个名为 `variY` 的本地宏变量，并将 `variX`\
  \ 的值赋值给它。\n\n```\n%macro outer;\n   %local variX;\n   %let variX=one;\n   %inner\n\
  %mend outer;\n\n%macro inner;\n   %local variY;\n   %let variY=&variX;\n%mend inner;\n\
  ```\n\n我们来检查提交以下代码时，符号表会发生什么：\n\n```\n%let variX=zero;\n%outer\n```\n\n1. 宏处理器接收到\
  \ `%let variX=zero;`。它检查全局符号表中是否存在名为 `variX` 的宏变量。不存在，因此宏处理器创建 `variX` 并为其赋值为零。![global\
  \ symbol table](img/m52-33-g1.png)\n2. 宏处理器接收到 `%outer`。宏处理器从 `Work.Sasmacr` 中检索宏\
  \ `Outer` 并开始执行它。\n3. 宏处理器遇到 `%local variX;`。它创建了一个本地符号表。宏处理器在该本地表中创建宏变量 `variX`\
  \ 并为其赋值一个空值（null）。这不会影响存储在全局符号表中的宏变量 `variX`。![global symbol table](img/m52-33-g2.png)\n\
  4. 宏处理器遇到 `%let variX=one;`。宏处理器检查本地符号表中的 `variX` 并为其赋值为一。![global symbol table](img/m52-33-g3.png)\n\
  5. 宏处理器接收到 `%inner`。它从 `Work.Sasmacr` 中检索宏 `Inner` 并开始执行它。\n6. 宏处理器遇到 `%local variY;`。它创建了一个本地符号表。宏处理器在该表中创建宏变量\
  \ `variY` 并为其赋值一个空值。现在存在两个本地符号表![global symbol table](img/m52-33-g4.png)\n7. 宏处理器遇到\
  \ `%let variY=&variX;`。它检查最近创建的本地表中的 `variX`。该符号表中不存在该宏变量，因此宏处理器接着检查另一个本地符号表。它从该表中检索值\
  \ `one` 并该值替换到 `%LET` 语句中。然后，宏处理器检查最近创建的本地符号表中是否存在名为 `variY` 的宏变量。当它找到该宏变量时，为其赋值为一![global\
  \ symbol table](img/m52-33-g5.png)\n8. `Inner` 宏执行完毕，在该宏内创建的本地符号表被删除。现在只存在一个本地符号表![global\
  \ symbol table](img/m52-33-g6.png)\n9. `Outer` 宏执行完毕，在该宏内创建的本地符号表被删除。现在不存在本地符号表。自从\
  \ `variX` 创建并被赋值为零以来，全局符号表没有发生变化![global symbol table](img/m52-33-g7.png)\n\n如你所示，上述示例中的每个宏程序都有自己的本地符号表，只要宏在执行，该表就会存在。当宏执行结束时，它的本地符号表以及该表中包含的所有本地宏变量都会被擦除。全局符号表及其包含的所有全局宏变量保持不变。\n\
  \n## MPRINTNEST 选项\n\n`MPRNEST` 选项允许将嵌套信息写入 MPRINT 输出。请记住，如果宏处理器在开放代码中接收到 `%LET`\
  \ 语句或宏变量引用（`&macvar`），它仅检查全局符号表中是否存在该宏变量。如果宏程序当前没有执行，则不存在本地符号表。\n\n| 选项 | 说明 |\n\
  | :--- | :--- |\n| `MPRNEST` | 允许嵌套信息写入 MPRINT 输出。 |\n| `MLOGICNEST` | 允许嵌套信息写入\
  \ SAS 日志。 |\n\n*(注：原文中 `MPRNEST` 似乎是 `MPRNEST` 的拼写错误，此处保留原样或根据上下文理解为 MPRINTNEST)*\n\
  \n由于原文文本在某些部分存在重复或格式混乱，上述翻译已按照要求进行了逻辑整理。\n\n\n\n\n\n```\nMLOGIC(OUTER):  Beginning\
  \ execution.\nMLOGIC(OUTER):  %PUT THIS IS OUTER\nTHIS IS OUTER\nMLOGIC(OUTER.INNER):\
  \  Beginning execution.\nMLOGIC(OUTER.INNER):  %PUT THIS IS INNER\nTHIS IS INNER\n\
  MLOGIC(OUTER.INNER.INRMOST):  Beginning execution.\nMLOGIC(OUTER.INNER.INRMOST):\
  \  %PUT THIS IS INRMOST\nTHIS IS INRMOST\nMLOGIC(OUTER.INNER.INRMOST):  Ending execution.\n\
  MLOGIC(OUTER.INNER): Ending execution.\nMLOGIC(OUTER): Ending execution.\n```\n\n\
  |\n\n# 条件性地处理语句\n\n## 条件执行\n\n你可以使用宏来控制语句的条件条件执行。回想本章开头的示例，在该示例中，你想运行一份每日报告，为在本月晚些时候的课程创建注册列表。请记住，你还想在每个周五运行一份周报，以汇总本月目前为止已产生的收入。如果你使用条件执行来确定是否应该运行第二个报告，你就可以用一个程序完成这些任务。你可以在宏级别通过\
  \ `%IF-%THEN` 和 `%ELSE` 语句执行条件执行。\n\n| 通用形式，`%IF-%THEN` 和 `%ELSE` 语句：`%IF expression\
  \ %THEN text;<%ELSE text;`这里是对该语法的解释：`expression` 可以是任何解析为整数的有效宏表达式。`text`可以指定为\
  \ \n\n* 常量文本\n\n* 文本表达式\n\n* 宏变量引用、宏调用或宏程序语句。 |\n\n如果 `expression` 解析结果为零，则它为假，并且不处理\
  \ `%THEN` 文本（取而处理可选的 `%ELSE` 文本）。如果它解析结果为除零以外的任何整数，则该表达式为真，并处理 `%THEN` 文本。如果解析结果为空或任何非整数值，则会发出错误消息。`%ELSE`\
  \ 语句是可选的。然而，宏语言不包含子集形式 `%IF` 语句。因此，你不能在没有 `%THEN` 的情况下使用 `%IF`。\n\n## %IF-%THEN\
  \ 与 IF-THEN 的比较\n\n尽管它们看起来相似，但 `%IF-%THEN/%ELSE` 语句和 `IF-THEN/ELSE` 语句属于两种不同的语言。适用于\
  \ DATA 步 `IF-THEN/ELSE` 语句大部分规则也适用于 `%IF-%THEN/%ELSE` 语句。然而，宏 `%IF-%THEN` 语句与 DATA\
  \ 步 `IF-THEN` 语句之间存在几个重要的区别。\n\n| %IF-%THEN... | IF-THEN... |\n\n| --- | --- |\n\
  | 仅用于宏程序。 | 仅用于 DATA 步程序。 |\n| 在宏执行期间执行。 | 在 DATA 步执行期间执行。 |\n| 在逻辑表达式中使用宏宏变量，且不能在逻辑表达式中引用\
  \ DATA 步变量。 | 在逻辑表达式中使用 DATA 步变量。 |\n| 决定哪些文本应该被复制到输入栈。 | 决定应该执行哪些 DATA 步语句(s)。在宏定义内部时，它被作为文本复制到输入栈。\
  \ |\n\n简单的 `%DO` 和 `%END` 语句通常与 `%IF-%THEN/%ELSE` 语句结合使用，以根据 `%IF` 条件的真假来指定要处理的宏部分。在\
  \ `%THEN` 或 `%ELSE` 之后使用 `%DO` 和 `%END` 语句，以便将包含多个语句的文本条件地放入输入栈。每个 `%DO` 语句必须与一个\
  \ `%END` 语句配对。\n\n| 通用形式，带有 `%IF-%THEN` 和 `%ELSE` 语句的 `%DO-%END`：`%IF expression\
  \ %THEN %DO;text and/or macro language statements%END;%ELSE %DO;text and/or macro\
  \ language statements%END;`这里是对该语法的解释：`text and/or macro language statements` 可以是常量文本、文本表达式和/或宏语句。\
  \ |\n\n注意：语句 `%IF-%THEN`、`%ELSE`、`%DO` 和 `%END` 是宏语言语句，只能在宏程序内部。\n\n## 示例\n\n你可以通过\
  \ `%IF-%THEN` 控制复制到输入栈的文本，同时通过 `IF-THEN` 控制 DATA 步逻辑。在这个示例中，宏变量 `status` 的值决定了哪些变量包含在新的数据集中。数据集变量\
  \ `Location` 的值决定了新数据集变量 `Totalfee` 的值。\n\n```\n%macro choice(status);\n   data\
  \ fees;\n      set sasuser.all;\n      %if &status=PAID %then %do;\n         where\
  \ paid='Y';\n         keep student_name course_code begin_date totalfee;\n     \
  \ %end;\n      %else %do;\n         where paid='N';\n         keep student_name\
  \ course_code\n              begin_date totalfee latechg;\n         latechg=fee*.10;\n\
  \      %end;\n      /* add local surcharge */\n      if location='Boston' then totalfee=fee*1.06;\n\
  \      else if location='Seattle'  then totalfee=fee*1.025;\n      else if location='Dallas'\
  \  then totalfee=fee*1.05;\n   run;\n%mend choice;\n```\n\n如果 `MPRINT` 和 `MLOGIC`\
  \ 系统选项都设置，SAS 日志将显示发送到编译器的文本。例如，假设你提交了以下宏调用：\n\n```\noptions mprint mlogic;\n%choice(PAID)\n\
  ```\n\n以下消息被写入日志。注意 `MLOGIC` 选项显示了 `%IF` 语句中表达式的评估，但没有显示 `IF` 语句中表达式的评估。\n\n表 11.12\
  \ SAS 日志\n\n|  \n\n```\n160  %choice(PAID)\nMLOGIC(CHOICE): Beginning execution.\n\
  MLOGIC(CHOICE): Parameter STATUS has value PAID\nMPRINT(CHOICE): data fees;\nMPRINT(CHOICE):\
  \ set sasuser.all;\nMLOGIC(CHOICE): %IF condition &status=PAID is TRUE\nMPRINT(CHOICE):\
  \ where paid='Y';\nMPRINT(CHOICE): keep student_name course_code begin_date totalfee;\n\
  MPRINT(CHOICE): if location='Boston' then totalfee=fee*1.06;\nMPRINT(CHOICE): else\
  \ if location='Seattle' then totalfee=fee*1.025;\nMPRINT(CHOICE): else if location='Dallas'\
  \ then totalfee=fee*1.05;\nMPRINT(CHOICE): run;\n```\n\n |\n\n假设你提交以下宏调用：\n\n```\n\
  options m mlogic;\n%choice(OWED)\n```\n\n以下消息被发送到 SAS 日志。注意这次写入输入栈的文本不同。\n\n表 11.13\
  \ SAS 日志\n\n|  \n\n```\n161  %choice(OWED)\nMLOGIC(CHOICE): Beginning execution.\n\
  MLOGIC(CHOICE): Parameter STATUS has value OWED\nMPRINT(CHOICE): data fees;\nMPRINT(CHOICE):\
  \ set sasuser.all;\nMLOGIC(CHOICE): %IF condition &status=PAID is FALSE\nMPRINT(CHOICE):\
  \ where paid='N';\nMPRINT(CHOICE): keep student_name course_code\n             \
  \ begin_date totalfee latechg;\nMPRINT(CHOICE): latechg=fee*.10;\nMPRINT(CHOICE):\
  \ if location='Boston' then totalfee=fee*1.06;\nMPRINT(CHOICE): else if location='Seattle'\
  \ then totalfee=fee*1.025;\nMPRINT(CHOICE): else if location='Dallas' then totalfee=fee*1.05;\n\
  MPRINT(CHOICE): run;\n```\n\n |\n\n早些你学习了宏程序编译时发生的过程。现在你已经看到了更复杂的宏程序，我们可以再次检查这个过程。记住，在宏编译期间会检查宏语句的语法错误。如果宏定义包含宏语句语法错误，则会将错误消息写入\
  \ SAS 日志，并创建一个不可执行的（虚拟）宏。\n\n## 示例\n\n假设你尝试编译一个包含语法错误的宏。例如，以下程序在 `%IF-%THEN` 语句中缺少了百分号：\n\
  \n```\n%macro printit;\n   if &syslast ne _NULL_ then %do;\n      proc print data=_last_(obs=5);\n\
  \      title \"Last Created Data Set Is &syslast\";\n      run;\n   %end;\n%mend;\n\
  ```\n\n当你提交此宏定义时，宏处理器会检查 `%IF-%THEN` 语句以及 `%DO`/`END` 语句的语法错误。由于 `%IF-%THEN` 语句存在语法错误，以下错误消息将被写入\
  \ SAS 日志。\n\n表 11.14 SAS 日志\n\n|\n\n\n\n\n\n```\n10   %macro printit;\n11     %if\
  \ &syslast ne _NULL_ then %do;\nERROR: Macro keyword DO appears as text. A semicolon\
  \ or other\n       delimiter may be missing.\nERROR: Expected %THEN statement not\
  \ found. A dummy macro will be\n       compiled.\n12         proc print data=_last_(obs=5);\n\
  13         title \"Last Created Data Set Is &syslast\";\n14         run;\n15   \
  \  %end;\nERROR: There is no matching %DO statement for the %END. This\n      statement\
  \ will be ignored.\n16  %mend;\n```\n\n## 带条件处理的宏执行\n\n在此之前你学习过，当宏处理器接收到 `%macro-name`\
  \ 时，它会执行编译后的宏语言语句，例如 `%IF-%THEN`。在 `%IF` 逻辑表达式中使用的宏变量值会在宏执行期间进行解析。`%IF` 逻辑表达式会自动求值。\n\
  \n## 示例\n\n假设 `Printit` 宏已经编译并存储在 `Work.Sasmacr` 目录中。\n\n1.  首先，你提交了对 `Printit`\
  \ 宏的调用，如下：\n\n    ```\n    %printit\n    ```\n\n2.  宏处理器在 SAS 目录 `Work.Sasmacr.Catalog`\
  \ 条目 `Work.Sasmacr.Printit.Macro` 中找到该宏。\n\n    ```\n    %macro printit;\n     \
  \  %if &syslast ne _NULL_ %then %do;\n          proc print data=_last_(obs=5);\n\
  \          title \"Last Created Data Set Is &syslast\";\n          run;\n      \
  \ %end;\n    %mend;\n    ```\n\n3.  宏处理器开始执行来自 `Printit` 的编译后的宏语言语句（即 `%IF-%THEN`\
  \ 语句）。由于 `%IF` 表达式为真，因此处理 `%DO` 块。\n\n4.  宏处理器将 `%DO` 语句之后的文本（即 `PROC PRINT` 步骤）置于输入栈中。输入栈：\n\
  \n    ```\n    proc print data=_last_(obs=5);\n       title \"Last Created Data\
  \ Set Is &syslast\";\n    run;\n    ```\n\n5.  单词扫描按常例对 `PROC PRINT` 步骤进行。当遇到如 `&syslast`\
  \ 这样的宏触发器时，宏引用被传递给宏处理器进行解析。宏处理器将解析后的值返回输入栈。\n\n6.  当单词扫描器将 `PROC PRINT` 步骤的所有标记发送给编译器，并遇到\
  \ `RUN` 语句后，`PROC PRINT` 步骤开始执行。\n\n7.  当 `PROC PRINT` 步骤执行时，宏执行会暂停；当遇到 `%MEND`\
  \ 语句时，宏执行停止。\n\n可以条件地将单个语句插入输入栈中，即使是在步骤的中间。\n\n## 示例\n\n假设你想根据数据集 `Sasuser.All`\
  \ 中列出的内容，生成一份每个培训中心的注册人数报告。你可以指定宏程序，使得如果请求了特定课程，宏将插入一个 `WHERE ALSO` 语句，以便将报告限制为该课程。此示例还根据是否选择了课程来自定义第二行标题，如下所示：\n\
  \n\n\n```\n%macro attend(crs,start=01jan2001,stop=31dec2001);\n   %let start=%upcase(&start);\n\
  \   %let stop=%upcase(&stop);\n   proc freq data=sasuser.all;\n      where begin_date\
  \ between \"&start\"d and \"&stop\"d;\n      table location / nocum;\n      title\
  \ \"Enrollment from &start to &stop\";\n      %if &crs= %then %do;\n         title2\
  \ \"for all Courses\";\n      %end;\n      %else %do;\n         title2 \"for Course\
  \ &crs only\";\n         where also course_code=\"&crs\";\n      %end;\n   run;\n\
  %mend;\n```\n\n注意：在上面的程序中，当 `crs` 值为空时，`%IF` 语句 `%if &crs=` 为真。假设你提交了以下调用，指定了一个特定课程：\n\
  \n```\n%attend(C003)\n```\n\n此调用导致如下输出。注意第二个标题是根据宏中的 `%ELSE %DO` 语句编写的。![FREQ 过程输出](img/m52-45-g1.png)\n\
  \n表 11.15 SAS Log\n\n|  \n\n```\n18   %attend(C003)\nMPRINT(ATTEND):   proc freq\
  \ data=sasuser.all;\nMPRINT(ATTEND):   where begin_date between \"01JAN2001\"d and\
  \ \"31DEC2001\"d;\nMPRINT(ATTEND):   table location / nocum;\nMPRINT(ATTEND):  \
  \ title \"Enrollment from 01JAN2001 to 31DEC2001\";\nMPRINT(ATTEND):   title2 \"\
  for Course C003 only\";\nMPRINT(ATTEND):   where also course_code=\"C003\";\nNOTE:\
  \ WHERE clause has been augmented.\nMPRINT(ATTEND):   run;\n\nNOTE: Writing HTML\
  \ Body file: sashtml.htm\nNOTE: 从数据集 SASUSER.SCHEDULE 读取了 2 条观测值。\n      WHERE (Course_Code='C003')\
  \ and (Begin_Date>='01JAN2001'D and \n                                         \
  \       Begin_Date<='31DEC2001'D);\nNOTE: 从数据集 SASUSER.STUDENTS 读取了 207 条观测值。\n\
  NOTE: 从数据集 SASUSER.REGISTER 读取了 434 条观测值。\nNOTE: 从数据集 SASUSER.COURSES 读取了 1 条观测值。\n\
  \      WHERE Course_Code='C003';\nNOTE: 从数据集 SASUSER.ALL 读取了 50 条观测值。\n      WHERE\
  \ (begin_date>='01JAN2001'D and begin_date<='31DEC2001'D) \n                   \
  \                              and (course_code='C003');\n```\n\n |\n\n现在假设你提交了以下调用，它指定了开始日期但没有指定课程：\n\
  \n```\n%attend(start=01jul2001)\n```\n\n此调用导致如下输出。注意在该输出中，第二个标题行是根据宏中的 `%IF-%THEN`\
  \ 语句编写的。![注册输出](img/m52-45-g2.png)\n\n表 11.16 SAS Log\n\n|  \n\n```\n19   %attend(start=01jul2001)\n\
  MPRINT(ATTEND):   options mprint;\nMPRINT(ATTEND):   proc freq data=sasuser.all;\n\
  MPRINT(ATTEND):   where begin_date between \"01JAN2001\"d and \"31DEC2001\"d;\n\
  MPRINT(ATTEND):   table location / nocum;\nMPRINT(ATTEND):   title \"Enrollment\
  \ from 01JAN2001 to 31DEC2001\";\nMPRINT(ATTEND):   title2 \"for all Courses\";\n\
  MPRINT(ATTEND):   run;\n\nNOTE: 从数据集 SASUSER.SCHEDULE 读取了 6 条观测值。\n      WHERE (Course_Code\
  \ in ('C01', 'C002', 'C003', 'C004', 'C005', 'C006')) and\n      (Begin_Date>='01JAN2001'D\
  \ and Begin_Date<='31DEC2001'D);\nNOTE: 从数据集 SASUSER.STUDENTS 读取了 207 条观测值。\nNOTE:\
  \ 从数据集 SASUSER.REGISTER 读取了 434 条观测值。\nNOTE: 从数据集 SASUSER.COURSES 读取了 1 条观测值。\n\
  NOTE: 从数据集 SASUSER.ALL 读取了 50 条观测值。\n      WHERE (begin_date>='01JAN2001'D and begin_date<='31DEC2001'D)\
  \ \n                                                 and (course_code='C003');\n\
  ```\n\n |\n\n## 语句部分的条件处理\n\n作为条件逻辑结果处理的文本可以是语句的一小部分。这使得在语句中间条件地插入文本成为可能。\n\n##\
  \ 示例\n\n假设从 SAS 数据集中打印频率计数表。你可以根据宏参数的值生成单向表或双向表。此示例在调用中仅指定了 `cols` 参数时，会创建一个单向表。如果也指定了\
  \ `rows` 参数，它会创建一个双向表。\n\n```\n%counts (cols=_all_,rows=,dsn=&syslast);\n   title\
  \ \"Frequency Counts for %upcase(&dsn) data set\";\n   proc freq data=&dsn;\n  \
  \    tables\n      %if &rows ne %then &rows *;\n      &cols;\n   run;\n%mend counts;\n\
  ```\n\n假设你提交了以下调用，它同时指定了 `cols` 和 `rows`：\n\n```\n%counts(dsn=sasuser.all, cols=paid,\
  \ rows=course_number)\n```\n\n此调用的部分输出如下所示。注意宏创建了一个双向表。![频率计数](img/m52-46-g1.png)日志显示了此宏生成的\
  \ PROC FREQ 代码。\n\n表 11.17 SAS Log\n\n|  \n\n\n\n\n\n```\n 28   %counts(dsn=sasuser.all,\
  \ cols=paid, rows=course_number)\nMPRINT(COUNTS):   title \"Frequency Counts for\
  \ SASUSER.ALL data set\";\nMPRINT(COUNTS):   proc freq data=sasuser.all;\nMPRINT(COUNTS):\
  \   tables course_number * paid;\nMPRINT(COUNTS):   run;\n\nNOTE: There were 18\
  \ observations read from the data set SASUSER.SCHEDULE.\n      WHERE Course_Code\
  \ in ('C001', 'C002', 'C003', 'C004', 'C005', 'C006');\nNOTE: There were 207 observations\
  \ read from the data set SASUSER.STUDENTS.\nNOTE: There were 434 observations read\
  \ from the data set SASUSER.REGISTER.\nNOTE: There were 6 observations read from\
  \ the data set SASUSER.COURSES.\nNOTE: There were 434 observations read from the\
  \ data set SASUSER.ALL.\nNOTE: PROCEDURE FREQ used (Total process time):\n```\n\n\
  现在假设你提交了以下调用，它指定了 `cols` 但没有指定 `rows`：\n\n```\n%counts(dsn=sasuser.all, cols=paid)\n\
