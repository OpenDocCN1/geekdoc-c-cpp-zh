  \ (obs=10);\n   format ctarget1 dollar15.2;\n   var month year revcargo ctarget1;\n\
  run;\n```\n\n![SAS 数据集 Work](img/m57-22-g1.png)\n\n# 使用哈希对象作为查找表\n\n## 概述\n\n从 SAS\
  \ 9 开始，哈希对象可以在 `DATA step` 中使用。哈希对象提供了一种高效、方便的机制，用于快速存储和检索。与使用一系列连续整数来访问数组元素的数组不同，哈希对象可以使用任何数值和字符值的组合作为地址。与只返回单个值的数组不同，哈希对象可以从指定的查找返回多个值。哈希对象可以从硬编码值或\
  \ SAS 数据集加载，它是动态调整大小的，并在整个 `DATA step` 期间存在。对于使用可以放入内存的无序数据的查找，哈希对象是一个很好的选择，因为它提供了内存存储和检索，并且不需要数据进行排序或索引![SAS\
  \ 数据集，哈希对象](img/m57-25-g1.png)\n\n## 哈希对象的结构\n\n当查找取决于字符键值时，可以使用哈希对象。哈希对象类似于具有行和列的表格，包含键组件和数据组件。键组件具有以下特性：\n\
  \n*   可能由数值和字符值组成\n*   将键映射到数据行\n*   必须唯一\n*   可以是复合的\n\n数据组件具有以下特性：\n\n*   每个键值可以包含多个数据值\n\
  *   可以是数值和字符值组成\n\n## 示例\n\n\n\n\n\n假设你有一个名为 `Sasuser.Contrib` 的数据集，其中列出了退休基金的季度贡献金额。你可以使用哈希对象（hash\
  \ object）来计算每个季度实际贡献金额与目标金额之间的差异。![SAS Data Set Sasuser. Contrib](img/m57-26-g1.png)以下程序创建一个哈希对象，用于存储员工向退休基金贡献的季度目标。为了计算实际贡献金额与目标金额之间的差异，程序根据键值（key\
  \ values）从哈希对象中检索目标金额。\n\n```\ndata work.difference (drop= goalamount);\n   if _N_\
  \ = 1 then do;\n      declare hash goal( );\n      goal.definekey(\"QtrNum\");\n\
  \      goal.definedata(\"GoalAmount\");\n      goal.definedone( ); \n      call\
  \ missing(goalamount);\n      goal.add(key:'qtr1', data:10 );\n      goal.add(key:'qtr2',\
  \ data:15 );\n      goal.add(key:'qtr3', data: 5 );\n      goal.add(key:'qtr4',\
  \ data:15 );\n  end;\n  set sasuser.contrib;\n  goal.find();\n  Diff = amount -\
  \ goalamount;\nrun;\n```\n\n我们将看到哈希对象是如何设置的。\n\n## DATA 步组件对象\n\n哈希对象是一个 DATA 步组件对象。组件对象是由属性（attributes）和方法（methods）组成的数据元素。属性是用于指定与对象相关信息的属性。方法定义了对象可以执行的操作。要在你的\
  \ SAS 程序中使用 DATA 步组件对象，你必须先声明并创建（实例化）该对象。\n\n## 声明哈希对象\n\n你使用 `DECLARE` 语句来声明哈希对象。\n\
  \n| 通用形式，`DECLARE` 语句：`DECLARE object-name <(<argument_tag-1: value-1<, ...argument-tag-n:\
  \ value-n>>)>;` |\n`object` 指定组件对象。 |\n`object-name` 指定组件对象的名称。 |\n`arg_tag` 指定用于创建组件对象实例的信息。\
  \ |\n`value` 指定参数标签的值。有效值取决于组件对象。对象的有效值如下： |\n| `hash` 表示一个哈希对象。 |\n| `hiter` 表示一个哈希迭代器对象（hash\
  \ iterator object）。 |\n\n注意：哈希迭代器对象按键升序或降序从哈希对象中检索数据。以下 `DECLARE` 语句创建一个名为 `Goal`\
  \ 的哈希对象。\n\n```\ndata work.difference (drop= goalamount);\n   if _N_ = 1 then do;\n\
  \      declare hash goal();\n```\n\n此时，你已经声明了一个名为 `Goal` 的哈希对象。注意：`DECLARE` 语句是一个可执行语句。\n\
  \n## 定义键和数据\n\n记住，哈希对象使用查找键（lookup keys）来存储和检索数据。键和数据是 DATA 步变量，你通过点符号方法调用（object\
  \ dot notation method calls）来初始化哈希对象。\n\n| 通用形式，对象点符号方法调用：`object.method(<argument_tag-1:\
  \ value-1<, ...argument-tag-n: value-n>>);` 这里是对该语法的解释： |\n`object` 指定 DATA 步组件对象的名称。\
  \ |\n`method` 指定要调用的方法名称。 |\n`argument-tag` 标识传递给方法的参数。 |\n`value` 指定参数值。 |\n\n\
  键组件通过将键变量名传递给 `DEFINEKEY` 方法来定义。数据组件通过将数据变量名传递给 `DEFINEDATA` 方法来定义。当所有键和数据组件定义完成后，会调用\
  \ `DEFINEDONE` 方法。键和数据可以由任意数量的字符或数值 DATA 步变量组成。以下代码初始化了键变量 `QtrNum` 和数据变量 `GoalAmount`。\n\
  \n```\ndata work.difference (drop= goalamount);\n   length goalamount 8;\n   if\
  \ _N_ = 1 then do;\n      declare hash goal();\n      goal.definekey (\"QtrNum\"\
  );\n      goal.definedata (\"GoalAmount\");\n      goal.definedone();\n```\n\n##\
  \ 使用 Call Missing 程序\n\n由于变量 `GOALAMOUNT` 不在输入集中，且未出现在赋值语句的等号左侧，SAS 会发出注释，说明该变量未初始化。为了避免接收这些注释，请使用\
  \ `CALL MISSING` 程序，并将键和数据变量作为参数。`CALL MISSING` 程序为指定的字符或数值变量分配一个缺失值。\n\n```\ndata\
  \ Work.Difference (drop= goalamount);\nif _N_ = 1 then do; declare hash goal();\n\
  \   goal.definekey(\"QtrNum\");\n   goal.definedata(\"GoalAmount\");\n   goal.definedone();\n\
  \   call missing(goalamount);\n```\n\n## 加载键和数据值\n\n到为止，你已经声明并实例化了哈希对象，并初始化了哈希对象的键和数据变量。你现在准备好使用\
  \ `ADD` 方法填充哈希对象。以下代码使用 `ADD` 方法将键值 `qtr1`、`qtr2`、`qtr3` 和 `qtr4` 以及对应的数据值 `10`、`15`、`5`\
  \ 和 `15` 加载到哈希对象中。\n\n```\ndata work.difference (drop= goalamount);\nif _N_ = 1\
  \ then do;\n   declare hash goal( );\n   goal.definekey(\"QtrNum\");\n   goal.definedata(\"\
  GoalAmount\");\n   goal.definedone( );\n   goal.add(key:'qtr1', data:10 );\n   goal.add(key:'qtr2',\
  \ data:15 );\n   goal.add(key:'qtr3', data: 5 );\n   goal.add(key:'qtr4', data:15\
  \ );\nend;\n```\n\n## 获取匹配数据\n\n使用 `FIND` 方法从哈希对象中检索数据。`FIND` 方法生成一个返回代码，指示键是否存在于哈希对象中。返回值为\
  \ 0 表示找到，非零表示查找失败。如果键在哈希对象中，`FIND` 方法还将数据赋值给变量，以便稍后使用。\n\n```\ndata work.difference\
  \ (drop= goalamount);\nif _N_ = 1 then do;\n   declare hash goal( );\n   goal.definekey(\"\
  QtrNum\");\n   goal.definedata(\"GoalAmount\");\n   goal.definedone( );\n   call\
  \ missing(goalamount);\n   goal.add(key:'qtr1', data:10 );\n   goal.add(key:'qtr2',\
  \ data:15 );\n   goal.add(key:'qtr3', data: 5 );\n   goal.add(key:'qtr4', data:15\
  \ );\nend;\nset sasuser.contrib;\ngoal.find();\nDiff = amount - goalamount;\nrun;\n\
  ```\n\n## 哈希对象处理\n\n我们将考虑提交程序时会发生什么。\n\n```\ndata Work.difference (drop= goalamount);\n\
  \   if _N_ = 1 then do;\n      declare hash goal( );\n      goal.definekey(\"QtrNum\"\
  );\n      goal.definedata(\"GoalAmount\");\n      goal.definedone( );\n      call\
  \ missing(goalamount);\n      goal.add(key:'qtr1', data:10 );\n      goal.add(key:'qtr2',\
  \ data:15 );\n      goal.add(key:'qtr3', data: 5 );\n      goal.add(key:'qtr4',\
  \ data:15 );\n   end;\n   set sasuser.contrib;\n   goal.find();\n   Diff = amount\
  \ - goalamount;\nrun;\n```\n\n程序一直执行到 `SET` 语句遇到 `sasuser.contrib` 文件的结束。`PROC PRINT`\
  \ 显示了完成的数据集。\n\n```\nproc print data=work.difference;\nrun;\n```\n\n![proc output](img/m57-31.png)\n\
  \n## 从数据集创建哈希对象\n\n假设你需要创建一个显示收入、支出、利润和机场信息的报告。你有两个包含部分数据的数据集。`Sasuser.Revenue`\
  \ 数据集包含机票收入。`Sasuser.Acities` 数据集包含机场数据，包括机场代码、地点和名称。\n\n表 16.27 `Sasuser.Revenue`\
  \ 数据集（前五个观测值）\n\n| Origin | Dest | FlightID | Date | Rev1st | RevBusiness | RevEcon\
  \ |\n| --- | --- | --- | --- | --- | --- | --- |\n| ANC | RDU | IA03400 | 02DEC1999\
  \ | 15829 | 28420 | 68688 |\n| ANC | RDU | IA03400 | 14DEC1999 | 20146 | 26460 |\
  \ 72981 |\n| ANC | RDU | IA03400 | 26DEC1999 | 20146 | 23520 | 59625 |\n| ANC |\
  \ RDU | IA03401 | 09DEC1999 | 15829 | 22540 | 58671 |\n| ANC | RDU | IA03401 | 21DEC1999\
  \ | 20146 | 22540 | 65826 |\n\n表 16.28 `Sasuser.Acities` 数据集（前五个观测值）\n\n| City |\
  \ Code | Name | Country |\n| --- | --- | --- | --- |\n| Auckland | AKL | International\
  \ | New Zealand |\n| Amsterdam | AMS | Schiphol | Netherlands |\n\n\n\n\n\n| Anchorage,\
  \ AK | ANC | Anchorage International Airport | USA |\n| Stockholm | ARN | Arlanda\
  \ | Sweden |\n| Athens (Athanai) | ATH | Hellinikon International Airport | Greece\
  \ |\n\n要创建此报告，你可以使用哈希对象（hash object）从 `Sasuser.Acities` 中检索匹配的机场数据。在以下代码中，`DECLARE`\
  \ 语句创建了 `Airports` 哈希对象并从 `Sasuser.Acities` 加载它。\n\n```sas\ndata work.report;\n\
  \   if _N_=1 then do;\n      declare hash airports (dataset: \"sasuser.acities\"\
  );\n```\n\n## 使用非执行的 SET 语句\n\n为了初始化来自现有 SAS 数据集的哈希变量的属性，你可以使用非执行的 `SET` 语句。因为在执行期间\
  \ `IF` 条件为假（false），所以 `SET` 语句会被编译但不会执行。程序数据向量（`PDV`）将根据 `Sasuser.Acities` 中的 `Code`、`City`\
  \ 和 `Name` 变量进行创建。\n\n```sas\ndata work.report;\n   if _N_=1 then do;\n      if\
  \ 0 then\n         set sasuser.acities (keep=Code City Name);\n```\n\n当你使用这种技术时，不需要\
  \ `CALL MISSING`。\n\n## 处理多个数据变量\n\n你在本章之前处理过的哈希对象包含一个键变量（key variable）和一个数据变量。在这个示例中，你需要为每个键关联多个一个数据值。在以下代码中，`DECLARE`\
  \ 语句创建了 `Airports` 哈希对象并从 `Sasuser.Acities` 加载它。`DEFINEKEY` 方法调用将键定义为变量 `Code` 的值。`DEFINEDATA`\
  \ 方法调用将数据定义为变量 `City` 和 `Name` 的值。\n\n```sas\ndata work.report;\n      if 0 then\n\
  \         set sasuser.acities (keep=Code City Name);\n   if _N_=1 then do;\n   declare\
  \ hash airports (dataset: \"sasuser.acities\")\n   airports.definekey (\"Code\"\
  );\n   airports.definedata (\"City\", \"Name\");\n   airports.definedone();\nend;\n\
  ```\n\n### 表 16.29 哈希对象机场\n\n| Key: Code | Data: City | Data: Name |\n| --- | ---\
  \ | --- |\n| ANC | Anchorage, AK | Anchorage International Airport |\n| BNA | Nashville,\
  \ TN | Nashville International Airport |\n| CDG | Paris | Charles de Gaulle |\n\
  | LAX | Los Angeles, CA | Los Angeles International Airport |\n| RDU | Raleigh-Durham,\
  \ NC | Raleigh-Durham International Airport |\n\n注：要将所有数据集变量定义为哈希对象的数据变量，请使用 `ALL:`\
  \ `\"YES\"` 选项。示例：`hashobject.DEFINEDATA (ALL:\"YES\");`。\n注：哈希对象可以存储多个键变量以及多个数据变量。\n\
  \n## 检索多个数据值\n\n你可以多次使用 `FIND` 方法来检索多个数据值。在程序中，`FIND` 方法根据 `Origin` 的值从 `Airports`\
  \ 哈希对象中检索 `City` 和 `Name` 的值。\n\n```sas\ndata work.report;\n   if _N_=1 then do;\n\
  \        if 0 then set sasuser.acities (keep=Code City Name);\n      declare hash\
  \ airports (dataset: \"sasuser.acities\");\n      airports.definekey (\"Code\");\n\
  \      airports.definedata (\"City\", \"Name\");\n      airports.definedone();\n\
  \   end;\n set sasuser.revenue;\n rc=airports.find(key:origin);\n OriginCity=city;\n\
  \ OriginAirport=name;\n rc=airports.find(key:dest);\nDestCity=city;\nDestAirport=name;\n\
  run;\n```\n\n`PROC PRINT` 输出显示了完整的数据。\n\n```sas\nproc print data=work.report;\n\
  \   var origin dest flightid date origincity originairport\n      destcity destairport;\n\
  run;\n```\n\n图 16.4 部分输出（所选变量的前五个观测值）![Partial Output (first five observations of\
  \ selected variables)](img/m57-36-g1.png)\n\n## 在 FIND 方法中使用返回代码\n\n记住，方法调用会生成一个数值返回代码，用于指示方法执行成功还是失败。值\
  \ `0` 表示方法成功。非零值表示方法失败。要将返回代码的值存储在变量中，请在方法调用开始指定变量名 `RC`。示例所示：\n\n```sas\n rc=hashobject.find\
  \ (key:keyvalue);\n```\n\n返回代码变量可以用于条件逻辑，以确保 `FIND` 方法在哈希对象中找到了与 `PDV` 中的 `KEY`\
  \ 值匹配的 `KEY`。\n\n## 示例\n\n提交以下程序时，错误信息将写入日志（log）。\n\n```sas\ndata work.report;\n\
  \   if _N_=1 then do;\n  \t     if 0 then set sasuser.acities (keep=Code City Name);\n\
  \      declare hash airports (dataset: \"sasuser.acities\");\n      airports.definekey\
  \ (\"Code\");\n      airports.definedata (\"City\", \"Name\");\n      airports.definedone();\n\
  \   end;\nset sasuser.revenue;\nairports.find(key:origin);\nOriginCity=city;\nOriginAirport=name;\n\
  airports.find(key:dest);\nDestCity=city;\nDestAirport=name;\nrun;\n```\n\n### 表\
  \ 16.30 SAS 日志\n\n```text\nNOTE: There were 50 observations read from the data set\
  \ SASUSER.ACITIES.\nERROR: Key not found.\nERROR: Key not found.\nERROR: Key not\
  \ found.\n```\n\n\n\n\n\n# 使用多维数组\n\n当查找操作依赖于多个一个序数数值键时，可以使用多维数组。使用 `ARRAY` 语句创建数组。`ARRAY`\
  \ 语句定义了一组你计划作为一个整体处理的元素。\n\n## 使用存储的数组值\n\n在许多情况下，你可能更倾向于加载存储在 SAS 数据集（data set）中的数组值，而不是在\
  \ `ARRAY` 语句中加载。当满足以下条件时，查找表应存储在 SAS 数据集中：\n\n*   值过多，无法在数组中轻松进行初始化\n*   值频繁变化\n\
  *   相同的值在许多程序中被使用\n\n从数据集中加载数组的第一步是创建一个数组来存放源数据集中的值。下一步是加载数组元素。完成此任务的方法之一是在 `DO`\
  \ 循环中中加载数组。最后一步是读取基础数据集。\n\n## 使用 PROC TRANSPOSE\n\n当数据集的方向不同时，可以使用 `PROC TRANSPOSE`\
  \ 过程来准备数据。`PROC TRANSPOSE` 通过重构 SAS 数据集中的值来创建输出数据集，从而将选定的变量转置为观测值（observations）。然后可以将转置后的（输出）数据集与另一个数据集合并以匹配数据。输出数据集包含几个默认变量。\n\
  \n*   `NAME` 是 `PROC TRANSPOSE` 创建的变量的默认名称，用于识别输出数据集中每个观测值中值的来源。该变量是一个字符变量，其值是从输入数据集中转置的变量名称。要覆盖默认名称，请使用\
  \ `NAME=` 选项。\n*   剩余的转置变量默认命名为 `COL1...COLn`。要覆盖默认名称，请使用 `PREFIX=` 选项。\n\n## 合并转置后的数据集\n\
  \n你可能需要在使用 `PROC TRANSPOSE` 时配合 `BY` 语句，以便为合并正确结构化数据。对于每个 `BY` 分组，`PROC TRANSPOSE`\
  \ 为其转置的每个变量创建一个观测值。`BY` 变量本身不会被转置。为了为合并结构化数据，你可能还需要对输出数据集进行排序。任何其他源数据集可能也需要重新组织和排序。当数据结构化正确后，就可以合并数据集。\n\
  \n## 使用哈希对象作为查找表\n\n从 SAS 9 开始，哈希对象（hash object）可以在 `DATA` 步中使用。哈希对象提供了一种高效、方便的机制，用于快速数据存储和检索。哈希对象类似于具有行和列的表格；它包含一个键（key）组件和一个数据组件。与数组使用一系列连续整数来访问数组元素不同，哈希对象可以使用任何数值和字符值的组合作为寻址。\n\
  \n哈希对象是一个 `DATA` 步组件对象。组件对象是由属性和方法组成的数据元素。要在你的 SAS 程序程序使用 `DATA` 步组件对象，你必须首先声明并创建（实例化）该对象。在声明了哈希对象的键组件和数据组件后，你可以从硬编码的值或\
  \ SAS 数据集中填充哈希对象。使用 `FIND` 方法调用的返回代码，该代码是一个数值。该值指定了方法执行是成功还是失败。值为 `0` 表示方法成功。非零值表示方法失败。返回代码变量可用于条件逻辑，以确保\
  \ `FIND` 方法在哈希对象中找到了与 PDV 中的 `KEY` 值匹配的 `KEY` 值。\n\n## 示例程序\n\n### 使用多维数组\n\n```\n\
  data work.wndchill (drop = column row);\n  array WC{4,2} _temporary_ \n     (-22,-16,-28,-22,-32,-26,-35,-29);\n\
  \  set sasuser.flights;\n  row = round(wspeed,5)/5;\n  column = (round(temp,5)/5)+3;\n\
  \  WindChill= wc{row,column};\nrun;\n```\n\n### 使用存储的数组值\n\n```\ndata work.lookup1;\n\
  \   array Targets{1997:1999,12} _temporary_; \n   if _n_=1 then do i= 1 to 3;\n\
  \      set sasuser.ctargets;\n      array Mnth{*} Jan--Dec;\n      do j=1 to dim(mnth);\n\
  \         targets{year,j}=mnth{j};\n      end;\n   end;\n   set sasuser.monthsum(keep=salemon\
  \ revcargo monthno);\n   year=input(substr(salemon,4),4.); \n   Ctarget=targets{year,monthno};\
  \ \n   format ctarget dollar15.2; \nrun;\n```\n\n### 使用 PROC TRANSPOSE 和合并\n\n```\n\
  \ proc transpose data=sasuser.ctargets \n      out=work.ctarget2\n      name=Month\n\
  \      prefix=Ctarget;\n    by year;\n run;   \n\nproc sort data=work.ctarget2;\n\
  \   by year month;\nrun; \n\ndata work.mnthsum2;\n   set sasuser.monthsum(keep=SaleMon\
  \ RevCargo);\n   length Month $ 8;\n   Year=input(substr(SaleMon,4),4.);\n   Month=substr(SaleMon,1,1)\n\
  \         ||lowcase(substr(SaleMon,2,2));\nrun; \n\nproc sort data=work.mnthsum2;\n\
  \   by year month;\nrun;\n\ndata work.merged;\n   merge work.mnthsum2 work.ctarget2;\n\
  \   by year month;\nrun;\n```\n\n### 从硬编码值加载哈希对象\n\n```\ndata work.report;\n   declare\
  \ hash h('hash');\n   h.define('key', key);\n   h.define('data', amount);\n   h.define_end();\n\
  \   h.add_key(1, amount=10);\n   h.add_key(2, amount=20);\n   set _null_;\n   if\
  \ (h.find(key) = 0) then output;\nrun;\n```\n\n### 从数据集加载哈希对象\n\n```\ndata work.report;\n\
  \   declare hash h('hash');\n   h.define('key', key);\n   h.define('data', amount);\n\
  \   h.define_end();\n   set sasuser.input;\n   h.add_key(key, amount);\n   set _null_;\n\
  \   if (h.find(key) = 0) then output;\nrun;\n```\n\n## 注意事项\n\n*   数组的名称必须是 SAS\
  \ 名称，且不能是 SAS 函数的名称。\n*   数组元素必须全为数值或全为字符。\n*   数组指定的初始值可以是数值或字符字符串。你必须为字符字符串加上引号。\n\
  *   在使用 PROC TRANSPOSE 时，除非使用 `NOTSORT` 选项，否则必须对输入数据集进行排序。\n*   哈希对象是无序数据的良好选择，因为它提供了内存中存储和检索，且不需要对数据进行排序。\n\
  *   哈希对象的大小是动态的，并在整个 `DATA` 步期间存在。\n\n# 测验\n\n为每个问题选择最佳答案。完成测试后，请参考附录中的答案检查你的结果。\n\
