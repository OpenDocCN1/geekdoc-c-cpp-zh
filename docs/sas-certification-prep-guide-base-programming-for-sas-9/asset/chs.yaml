  \          公司                          已支付\n\nBills, Ms. Paulette         Reston\
  \ Railway                    Y\nChevarley, Ms. Arlene       Motor Communications\
  \              N\nClough, Ms. Patti           Reston Railway                   \
  \ N\nCrace, Mr. Ron              Von Crump Seafood                 Y\nDavis, Mr.\
  \ Bruce            Semi;Conductor                    Y\nElsins, Ms. Marisa F.  \
  \     SSS Inc.                          N\nGandy, Dr. David            Paralegal\
  \ Assoc.                  Y\nGash, Ms. Hedy              QA Information Systems\
  \  Center    Y\nHaubold, Ms. Ann            Reston Railway                    Y\n\
  Hudock, Ms. Cathy           So. Cal. Medical Center           Y\nKimble, Mr. John\
  \            Alforone Chemical                 N\nKochen, Mr. Dennis          Reston\
  \ Railway                    Y\nLarocque, Mr. Bret          Physicians IPA     \
  \               Y\nLicht, Mr. Bryan            SII                             \
  \  Y\nMcKnight, Ms. Maureen E.    Federated Bank                    Y\nScannell,\
  \ Ms. Robin         Amberly Corp.                     N\nSeitz, Mr. Adam       \
  \      Lomax Services                    Y\nSmith, Ms. Jan              Reston Railway\
  \                    N\nSulzbach, Mr. Bill          Sailbest Ships             \
  \       Y\nWilliams, Mr. Gene          Snowing Petroleum                 Y\n\n \
  \                 备注：20 名学生中有 14 人已支付\n```\n\n## PUT 函数\n\n请记住宏变量的值始终是字符串。你已经看到，在\
  \ `DATA` 步中，`SYMPUT` 例程会对你尝试分配给宏变量的任何数值执行自动的从数值到字符的转换。消息会写入 SAS 日志，以提醒你发生了自动转换。请记住，`SYMPUT`\
  \ 例程在转换时会自动使用 `BEST12\\.` 格式。\n\n有时，你可能希望对数值到字符的转换进行显式控制。`PUT` 函数返回一个通过指定格式写入值而形成的字符字符串。你可以使用\
  \ `PUT` 函数执行以下操作：\n\n*   执行显式的数值到字符的转换\n*   格式化数值表达式的结果。\n\n`PUT` 函数的一般形式：`PUT(source,format.)`\n\
  以下是对该语法的解释：\n`source` 是常量、变量或表达式（数值型或字符型）。\n`format.` 是任何 SAS 格式或用户定义的格式，它决定了：\n\
  *   结果字符串的长度\n*   字符串是右对齐还是左对齐。\n\n`source` 和 `format.` 必须是相同类型（数值型或字符）。\n\n## 示例\n\
  \n假设你想创建一个报告，显示特定课程未支付的费用金额。在以下示例中，你使用 `SYMPUT` 例程用 `MMDDYY10\\.` 格式化数值变量 `Begin_date`\
  \ 的值，并将该值分配给宏变量 `date`。然后，你再次调用 `SYMPUT` 例程，将涉及 `Fee`、`total` 和 `paidup` 的表达式结果格式化为金额，并将该值分配给宏变量\
  \ `due`。\n\n```\n%let crsnum=3;\ndata revenue;\n   set sasuser.all end=final;\n\
  \   where course_number=&crsnum;\n   total+1;\n   if paid='Y' then paidup+1;\n \
  \  if final then do;\n     call symput('crsname',trim(course_title));\n     call\
  \ symput('date',put(begin_date,mmddyy10.));\n     call symput('due',strip(put(fee*(total-paidup),dollar8.)));\n\
  \   end;\nrun;\n```\n\n你可以在 `PROC PRINT` 步中使用宏变量 `date` 和 `due` 来创建报告。这些宏变量的值在报告中显示为你在创建它们时分配给它们的格式。\n\
  \n```\nproc print data=revenue;\n   var student_name student_company paid;\n   title\
  \ \"Fee Status for &crsname (#&crsnum) Held &date\";\n   footnote \"Note: &due in\
  \ Unpaid Fees\";\nrun;\n```\n\n![2001 年 01 月 08 日举行的局域网费用状态 (#3) 所示](img/m51-13-g1.png)\n\
  \n## SYMPUTX 例程\n\n`SYMPUTX` 例程与 `SYMPUT` 例程非常相似。除了创建宏变量并为其赋值值外，`SYMPUTX` 例程还会自动移除两个参数前导和尾的空格。\n\
  \n`SYMPUTX` 例程的一般形式：`CALL SYMPUTX(macro-variable,expression);`\n以下是对该语法的解释：\n`macro-variable`\
  \ 被赋予 `expression` 的字符值，并且会移除 `macro-variable` 和 `expression` 前导或尾的空格。\n`macro-variable`\
  \ 和 `expression` 都可以指定为：\n*   用引号括的字面量\n*   `DATA` 步变量\n*   `DATA` 步表达式\n\n备注：如果\
  \ `macro-variable` 已经存在，`expression` 的值将替换旧值。\n\n## 示例\n\n记得之前创建一个关于选修特定课程学生的报告示例。这次，假设你希望标题包含课程名称、课程编号以及课程举办日期。此外，你还希望脚注列出该课程当前的未支付费用金额。\n\
  \n在此示例中，创建了三个宏变量。宏变量 `csrname` 记录 `DATA` 步变量 `Course_title` 的值。宏变量 `date` 记录 `DATA`\
  \ 步变量 `Begin_date` 以 `MMDDYY10\\.` 格式的值。最后，宏变量 `due` 使用 `DATA` 步变量 `paidup`、`total`\
  \ 和 `fee` 的值，以 `DOLLAR8.` 格式记录当前的未支付费用金额。这些宏变量在程序后的标题和脚注语句中被引用。\n\n```\n%let crsnum=3;\n\
  data revenue;\n   set sasuser.all end=final;\n   where course_number=&crsnum;\n\
  \   total+1;\n   if paid='Y' then paidup+1;\n   if final then do;\n      call symputx('crsname',course_title);\n\
  \      call symputx('date',put(begin_date,mmddyy10.));\n      call symputx('due',put(fee*(total-paidup),dollar8.));\n\
  \   end;\nrun;\nproc print data=revenue;\n   var student_name student_company paid;\n\
  \   title \"Fee Status for &crsname (#&crsnum) Held &date\";\n   footnote \"Note:\
  \ &due in Unpaid Fees\";\nrun;\n```\n\n![2001 年 01 月 08 日举行的局域网费用状态 (#3) 所示](img/m51-9-g1.png)\n\
  \n# 在 DATA 步执行期间创建宏变量\n\n## 使用 CALL SYPUT 创建宏变量\n\n有时你可能希望在一个 `DATA` 步中创建多个宏变量。例如，假设你想编写一个列出特定课程所有安排日期的程序，并使用宏变量记录课程标题。\n\
  \n```\n%let crsid=C005;\ndata _null_;\n   set sasuser.courses;\n   where course_code=\"\
  &crsid\";\n   call symput('title',trim(course_title));\nrun;\n\nproc print data=sasuser.schedule\
  \ noobs label;\n   where course_code=\"&crsid\";\n   var location begin_date teacher;\n\
  \   title1 \"Schedule for &title\";\n   options nodate nonumber;\nrun;\n```\n\n\
  在此示例中，`Course_code` 为 `C005` 的课程数据集变量 `Course_title` 的值被赋值为宏变量 `title` 的值。`data`\
  \ 语句中的 `_null_`是因为我们在示例中不需要创建数据集。为了创建另一个课程的列表，你需要更改 `%LET` 语句并重新提交 `DATA` 步以为 `title`\
  \ 分配新值。然后，你需要重新提交 `PROC PRINT` 步。虽然你需要重新提交 `DATA` 步和 `PROC PRINT` 步，但这两个步骤与你为第一个报告提交的步骤完全相同。这是一个极其低效的程序。\n\
  \n```\n%let crsid=C004;\ndata _null_;\n   set sasuser.courses;\n   where course_code=\"\
  &crsid\";\n   call symput('title',trim(course_title));\nrun;\n\nproc print data=sasuser.schedule\
  \ noobs label;\n   where course_code=\"&crsid\";\n   var location begin_date teacher;\n\
  \   title1 \"Schedule for &title\";\n   options nodate nonumber;\nrun;\n```\n\n\n\
  \n\n与其通过执行多个 `DATA` 步来更新同一个宏变量，你可以在一个 `DATA` 步中创建相关的宏变量。要创建多个宏变量，你可以使用 `SYMPUT`\
  \ 程，并对两个参数都使用 `DATA` 步表达式。\n\n| 通用形式，使用 `DATA` 步表达式的 `SYMPUT` 句程：`CALL SYMPUT(expression1,expression2);`\
  \ | 以下是对该语法的解释：`expression1` 评估为有效宏变量名称的字符值。每当你想要创建另一个宏变量时，该值都应该发生变化。`expression2`\
  \ 是你想要赋值给特定宏变量的值。 |\n\n## 示例\n\n在本示例中，你通过调用一次 `SYMPUT` 句程，为 `DATA` 步变量 `Course_code`\
  \ 的每个值创建一个宏变量，并将 `Course_title` 的相应值赋值给每个宏变量。也就是说，对于 `Sasuser.Courses` 中的每个观测值，宏处理器都会创建一个新的宏变量。新宏变量的名称与该观测值的数据集变量\
  \ `Course_code` 的值相同。新宏变量的值则是该观测值的数据集变量 `Course_title` 的值。\n\n```\ndata _null_;\n\
  \   set sasuser.courses;\n   call symput(course_code, trim(course_title));\nrun;\n\
  %put _user_;\n```\n\nSAS 日志显示从数据集 `Sasuser.Courses` 中读取了 6 个观测值，并创建并赋值了 6 个全局宏变量。\n\
  \n表 10.4 SAS 日志\n\n| |\n\n```\n2   data _null_;\n3      set sasuser.courses;\n4\
  \      call symput(course_code, trim(course_title));\n5   run;\n\nNOTE: There were\
  \ 6 observations read from the dataset \n      SASUSER.COURSES.\nNOTE: DATA statement\
  \ used:\n      real time           0.52 seconds\n      cpu time            0.13\
  \ seconds\n\n7   %put _user_;\nGLOBAL C006 Computer Aided Design\nGLOBAL C001 Basic\
  \ Telecommunications\nGLOBAL C002 Structured Query Language\nGLOBAL C003 Local Area\
  \ Networks\nGLOBAL C004 Database Design\nGLOBAL C005 Artificial Intelligence\n```\n\
  \n| |\n\n然后你可以使用这些新的宏变量仅通过一个 `DATA` 步来打印各种课程的信息列表，如下：\n\n```\ndata _null_;\n   set\
  \ sasuser.courses;\n   call symput(course_code,trim(course_title));\nrun; \n\n%let\
  \ crsid=C005;\nproc print data=sasuser.schedule noobs label;\n   where course_code=\"\
  &crsid\";\n   var location begin_date teacher;\n   title1 \"Schedule for &c005\"\
  ;\nrun;\n\n%let crsid=C002;\nproc print data=sasuser.schedule noobs label;\n   where\
  \ course_code=\"&crsid\";\n   var location begin_date teacher;\n   title1 \"Schedule\
  \ for &c002\";\nrun;\n```\n\n这是第一个 `PROC PRINT` 步的输出。![人工智能课程表](img/m51-17-g1.png)这是第二个个\
  \ `PROC PRINT` 步的输出。![结构化查询语言课程表](img/m51-17-g2.png)本节中的程序比上一节所示的程序更高效，因为在最新的示例中\
  \ `Sasuser.Courses` 数据集仅读取了一次。然而，仍然有改进空间。\n\n# 间接引用宏变量\n\n## 引言\n\n在上一个示例中，你了解了如何使用\
  \ `SYMPUT` 句程创建一系列基于 `Course_code` 值的宏变量。然而，你仍然需要修改每个 `PROC PRINT` 步中的 `TITLE` 语句来打印每个课程的输出。假设你想写一个无需任何修改即可重用的\
  \ `PROC PRINT` 步，以打印每个课程的信息。你可以通过在 `TITLE` 语句中使用间接引用来实现这一点。\n\n```\ndata _null_;\n\
  \   set sasuser.courses;\n   call symput(course_code,trim(course_title));\nrun;\n\
  \n%let crsid=C002;\nproc print data=sasuser.schedule noobs label;\n   where course_code=\"\
  &crsid\";\n   var location begin_date teacher;\n   title1 \"Schedule for ???\";\n\
  run;\n```\n\n在上面的示例中，宏变量 `C002`（由 `SYMPUT` 句程创建）的值为 `Structured Query Language`。因此，`TITLE`\
  \ 语句应该引用解析为 `Structured Query Language` 的宏变量。记住，你希望此引用足够灵活，只需更改 `%LET` 语句即可适用于 `SYMPUT`\
  \ 句程创建的任何宏变量（例如 `C003` 或 `C004`）。为了获取值 `Structured Query Language`，你需要通过宏变量 `crsid`\
  \ 的引用间接引用宏变量 `C002`。如果宏变量 `crsid` 的值为 `C002`，则你需要执行以下步骤：\n\n1. 将宏变量 `crsid` 解析为值\
  \ `C002`。\n2. 在解析后的值前面加上一个连接符 (`&`) 以创建一个新的引用（`&C002`）。\n3. 将生成的宏变量引用解析为值 `Structured\
  \ Query Language`。\n\n这一序列意味着你应该使用对宏变量 `crsid` 的引用，将其值转换为 `Structured Query Language`。\n\
  \n## 向前扫描规则 (Forward-Scan Rule)\n\n向前扫描规则可以总结如下：\n\n- 当多个 `&` 或 `%` 位于名称之前，宏处理器会将两个\
  \ `&` (`&&`) 解析为一个 `&` (`&`) 并重新扫描该引用。\n- 为了重新扫描引用，宏处理器从左到右扫描并解析标记，直到没有更多触发器。\n\n\
  根据向前扫描规则，当宏变量的值是一个名称时，需要在前面使用三个 `&`。\n\n## 示例\n\n假设你想使用宏变量 `crsid` 间接引用宏变量 `C002`![全局符号表](img/m51-20-g1.png)下表显示了几个引用及其解析值![带有解析值的引用](img/m51-20-g2.png)在宏变量引用前面加上两个\
  \ `&` 可以延迟引用的解析。当引用第一次被扫描时，只会解析双 `&`（变为单 `&`）。为了创建一个间接引用（其值为另一个宏变量的引用），你必须使用三个 `&`。因此，为了使用解析为\
  \ `Structured Query Language` 的间接引用，原始引用必须是 `&&&crsid`。\n\n```\noptions symbolgen;\n\
  data _null_;\n   set sasuser.courses;\n   call symput(course_code, trim(course_title));\n\
  run;\n\n%let crsid=C005;\nproc print data=sasuser.schedule noobs label;\n   where\
  \ course_code=\"&crsid\";\n   var location begin_date teacher;\n   title1 \"Schedule\
  \ for &&&crsid\";\nrun;\n\n%let crsid=C002;\nproc print data=sasuser.schedule noobs\
  \ label;\n   where course_code=\"&crsid\";\n   var location begin_date teacher;\n\
  \   title1 \"Schedule for &&&crsid\";\nrun;\n```\n\n\n\n\n```sas\n43   options symbolgen;\n\
  44   data _null_;\n45      set sasuser.courses;\n46      call symput(course_code,\
  \ trim(course_title));\n47   run;\nNOTE: There were 6 observations read from the\
  \ dataset\n      SASUSER.COURSES.\nNOTE: DATA statement used:\n      real time \
  \          0.07 seconds\n      cpu time            0.05 seconds\n\n48\n49   %let\
  \ crsid=C005;\n50   proc print data=sasuser.schedule noobs label;\n51      where\
  \ course_code=\"&crsid\";\nSYMBOLGEN: Macro variable CRSID resolves to C005\n52\
  \      var location begin_date teacher;\nSYMBOLGEN:  && resolves to &.\nSYMBOLGEN:\
  \  Macro variable CRSID resolves to C005\nSYMBOLGEN:  Macro variable C005 resolves\
  \ to Artificial\n            Intelligence\n53      title1 \"Schedule for &&&crsid\"\
  ;\n54   run;\n\nNOTE: There were 3 observations read from the dataset\n      SASUSER.SCHEDULE.\n\
  \      WHERE course_code='C005';\nNOTE: PROCEDURE PRINT used:\n      real time \
  \          0.09 seconds\n      cpu time            0.04 seconds\n\n55\n56   %let\
  \ crsid=C002;\n57   proc print data=sasuser.schedule noobs label;\n58      where\
  \ course_code=\"&crsid\";\n\nSYMBOLGEN:  Macro variable CRSID resolves to C002\n\
  59      var location begin_date teacher;\nSYMBOLGEN:  && resolves to &.\nSYMBOLGEN:\
  \  Macro variable CRSID resolves to C002\nSYMBOLGEN:  Macro variable C002 resolves\
  \ to Structured\n            Query Language\n60      title1 \"Schedule for &&&crsid\"\
  ;\n61   run;\n\nNOTE: There were 3 observations read from the dataset\n      SASUSER.SCHEDULE.\n\
  \      WHERE course_code='C002';\nNOTE: PROCEDURE PRINT used:\n      real time \
  \          0.06 seconds\n      cpu time            0.04 seconds\n```\n\n这是第一个 `PROC\
  \ PRINT` 步骤的输出。![人工智能课程表](img/m51-21-g1.png)这是第二个 `PROC PRINT` 步骤的输出。![结构化查询语言课程表](img/m51-21-g2.png)注意，生成这些报告的\
  \ `PROC PRINT` 步骤是相同的。只有每个 `PROC PRINT` 步骤之前的 `%LET` 语句以及宏变量的解析值发生了变化。当你在处理一系列相关的宏变量时，间接引用特别别有用。在介绍宏变量中，你学习了如何通过组合多个宏变量引用来构建新的标记。你也可以将间接宏变量引用与其他宏变量引用结合使用。也就是说，当一个宏变量的值与第二个宏变量名称的部分匹配时，你可以在引用中使用两个\
  \ `&` 符号。\n\n## 示例\n\n你可以创建一个系列宏变量 `teach1` 到 `teachn`，每个变量都包含分配给特定课程的导师名称。\n\n\
  ```sas\noptions symbolgen;\ndata _null_;\n   set sasuser.schedule;\n   call symput('teach'||left(course_number),\n\
  \               trim(teacher));\nrun;\n```\n\n注意：连接运算符 `||` 用于合并文本。在上面的示例中，字面字符串\
  \ `teach` 被连接到对变量 `Course_number` 的解析值进行左对齐后生成的文本。![全局符号表](img/m51-22-g1.png)然后，当指定课程号时，你可以引用这些变量之一。如果你在\
  \ `%LET` 语句中指定了课程号，你可以使用多个 `&` 符号来创建对应当前课程号的 `teachn` 宏变量引用。\n\n```sas\n%let crs=3;\n\
  proc print data=sasuser.register noobs;\n   where course_number=&crs;\n   var student_name\
  \ paid;\n   title1 \"Roster for Course &crs\";\n   title2 \"Taught by &&teach&crs\"\
  ;\nrun;\n```\n\nSAS 日志显示了导致引用 `&&teach&crs` 解析的步骤。\n\n表 10.6 SAS 日志\n\n|  \n\n```sas\n\
  65   %let crs=3;\n66   proc print data=sasuser.register noobs;\n67      where course_number=&crs;\n\
  SYMBOLGEN:   Macro variable CRS resolves to 3\n68      var student_name paid;\n\
  SYMBOLGEN:   Macro variable CRS resolves to 3\n69     title1 \"Roster for Course\
  \ &crs\";\nSYMBOLGEN:  && resolves to &.\nSYMBOLGEN:  Macro variable CRS resolves\
  \ to 3\nSYMBOLGEN:  Macro variable TEACH3 resolves to\n            Forest, Mr. Peter\n\
  70     title2 \"Taught by &&teach&crs\";\n71   run;\n```\n\n |\n\n这是示例的输出。![Forest\
  \ 先生执教的第 3 号课程名单](img/m51-22-g2.png)\n\n# 在 DATA 步执行期间获取宏变量值\n\n## SYMGET 函数\n\n\
  之前你已经学习了如何使用 `SYMPUT` 过程在 DATA 步中创建宏变量。你还熟悉使用宏变量引用如 `&var` 来获取值。现在，假设你想在 DATA 步执行期间获取宏变量的值。你可以通过\
  \ `SYMGET` 函数在 DATA 步执行期间获取宏变量。`SYMGET` 函数返回数据变量的值。\n\n| SYMGET 的通用形式：`SYMGET(macro-variable)`\
  \ 以下是语法的解释：`macro-variable` 可以是：\n\n* 带引号的宏变量名\n\n* 数据变量名\n\n* 宏变量表达式 |\n\n## 示例\n\
  \n你可以使用 `SYMGET` 函数在每次 DATA 步迭代时获取宏变量的值。在此示例中，数据集变量 `Teacher` 被赋值为 `Sasuser.Register`\
  \ 中的值，其中假设宏变量 `teachn` 已经创建。\n\n```sas\ndata teachers;\n   set sasuser.register;\n\
  \   length Teacher $20;\n   teacher=symget('teach'||left(course_number));\nrun;\n\
  \nproc print data=teachers;\n   var student_name course_number teacher;\n   title1\
  \ \"Teacher for Each Student\";\n```\n\n![使用 SYMGET 函数的输出](img/m51-25-g2.png) |\
  \ 程序创建的 SAS 输出所示。注意数据集 `Teachers` 包含一个名为 `Teacher` 的变量，其值与全局符号表中的宏变量 `teach1-teach3`\
  \ 相同。![每个学生的课程表](img/m51-25-g1.png)\n\n# 在 PROC SQL 步骤期间创建宏变量\n\n## INTO 子句和 NOPPRINT\
  \ 选项\n\n你已经看到过如何在 DATA 步中创建宏变量。你也可以在 `PROC SQL` 步骤期间创建或更新宏变量。记住 `PROC SQL` 步骤中的\
  \ `SELECT` 语句检索并显示数据。`INTO` 子句在 `SELECT` 语句中允许你创建或更新宏变量。当你在 `PROC SQL` 执行期间创建或更新宏变量时，你可能不希望有输出。`PRINT\
  \ | NOPPRINT` 选项指定是否在输出中显示 `SELECT` 语句的结果。`PRINT` 是默认设置。\n\n| NOPPRINT 选项和 INTO\
  \ 子句的 PROC SQL 通用形式：`PROC SQL NOPPRINT;SELECT column1<,column2,...>INTO :macro-variable-1,:macro-variable-2,...>FROM\
  \ table-1 || view-1<WHERE expression>;QUIT;` 以下是语法的解释：`column1, column2,...` 指定了\
  \ SQL 表 `table-1 || view-1` 的一个或多个列。`:macro-variable-1, :macro-variable-2,...` 指定了要创建的宏变量。`expression`\
  \ 产生用于子集的值。`other clauses` 是其他用于分组、子集或排序数据的有效子句。注意：宏变量名前带有冒号。注意：有关 `PROC SQL` 的更多信息，请参阅\
  \ SAS 文档。这种形式的 `INTO` 子句不能在创建表或视图时使用。\n\n\n\n\n\n你可以创建一个名为 `totalfee` 的宏变量，其中包含所有课程费的总和，并在后续步骤中使用该宏变量。你使用\
  \ `NOPRINT` 选项来抑制 `PROC SQL` 步骤的输出。\n\n```\nproc sql noprint;\n   select sum(fee)\
  \ format=dollar10\\. into :totalfee\n      from sasuser.all;\nquit;\n%let totalfee=&totalfee;\n\
  \nproc means data=sasuser.all sum maxdec=0;\n   class course_title;\n   var fee;\n\
  \   title \"Grand Total for All Courses Is &totalfee\";\nrun;\n```\n\n注意：这种形式的 `INTO`\
  \ 子句不会修剪前后的空格，但 `%LET` 语句会移除存储在 `totalfee` 值中的任何前或后空格。`PROC MEANS` 步骤的输出显示了 `DOLLAR10.`\
  \ 格式的所有课程费总和。![所有课程的总额](img/m51-28-g1.png)\n\n## 使用 INTO 子句创建变量\n\n在此之前你已经学习了如何在\
  \ `DATA` 步骤执行期间使用 `SYMPUT` 过程创建一系列相关的宏变量。有时，你可能想在 `PROC SQL` 步骤执行期间创建一系列相关的宏变量。你可以使用\
  \ `INTO` 子句为 `SELECT` 语句结果中的每一行创建一个新的宏变量。\n\n| 通用形式，带有 `INTO` 子句且用于宏变量范围的 `SELECT`\
  \ 语句：`PROC SQL NOPRINT;SELECT column1INTO :macro-variable-1 - :macro-variable-n\
  \ FROM table-1 | view-1<WHERE expression><other clauses>;QUIT;` 以下是该语法的解释：`column1`\
  \ 指定由 `table-1 | view-1` 指定的 SQL 表的列。`:macro-variable-1 - :macro-variable-n,...`\
  \ 指定要创建的宏变量名称。`expression` 生成一个用于数据子集的值。`other clauses` 是其他用于分组、子集化或排序数据的有效子句。 |\n\
  \n在将值存储到宏变量范围中，或使用 `SEPARATED BY` 选项将多个值存储在一个宏变量中时，`PROC SQL` 的 `INTO` 子句会修剪任何前导或尾部空格。如果你希望保留空格，请使用\
  \ `NOTRIM` 选项。这种对前导和尾部空格的处理与将 `DATA` 步骤变量的值赋值给宏变量 (SYMPUT 过程的情况不同。 |\n\n## 示例\n\n\
  你可以创建一个系列宏变量，包含 2002 年安排的前三门课程的课程代码、地点和开始日期。在这个示例中，宏变量 `crsid1`-`crsid3` 被赋予 `PROC\
  \ SQL` 结果前三行中数据集变量 `Course_code` 的值：\n\n```\nproc sql;\n   select course_code, location,\
  \ begin_date format=mmddyy10.\n   into :crsid1-:crsid3,\n        :place1-:place3,\n\
  \        :date1-:date3\n      from sasuser.schedule\n      where year(begin_date)=2002\n\
  \      order by begin_date;\nquit;\n```\n\n这是 `PROC SQL` 步骤的结果。![课程代码，地点](img/m51-29-g1.png)\
  \ 这是此 `PROC SQL` 步骤运行后符号表的表示。![全局符号表](img/m51-29-g2.png) 如果不知道创建了多少个宏变量，可以发布查询来确定需要多少宏变量，并创建一个宏变量来存储该数字。然后你可以运行查询，使用该宏变量作为每组宏变量中最后一个宏变量的后缀。\n\
  \n## 示例\n\n假设你想创建一个系列宏变量范围，包含 2002 年安排的所有课程的课程代码、地点和开始日期。你不知道课程的数量。如果你将一个任意大的数字作为最后一个宏变量范围的后缀，则只会创建与查询结果集对应的宏变量。宏变量\
  \ `SQLOBS` 被赋予一个反映结果集行数的值，该值与每个范围中创建的宏变量数量相。\n\n```\nproc sql noprint;\n   select\
  \ course_code, location,\n          begin_date format=mmddyy10.\n      into :crsid1-:crsid999,\n\
  \           :place1-:place999,\n           :date1-:date999\n      from sasuser.schedule\n\
  \      where year(begin_date)=2002\n      order by begin_date;\n   %let numrows=&sqlobs;\n\
  \   %put There are &numrows courses in 2002;\n   %put _user_;\nquit;\n```\n\nSAS\
  \ 日志显示 `numrows` 被赋值为 `4`。程序末尾的 `%PUT` 语句显示了 `SELECT` 语句中创建的所有宏变量的名称和值。表 10.7 SAS\
  \ 日志\n\n```\n 114  proc sql noprint;\n115    select course_code, location,\n116\
  \        begin_date format=mmddyy10.\n117      into :crsid1-:crsid999,\n118    \
  \       :place1-:place999,\n119           :date1-:date999\n120      from sasuser.schedule\n\
  121      where year(begin_date)=2002\n122      order by begin_date;\n123   %let\
  \ numrows=&sqlobs;\n124   %put There are &numrows courses in 2002;\n125   %put _user_;\n\
  126 quit;\n```\n\n## 创建分隔值列表\n\n有时，在 `PROC SQL` 步骤执行期间，你可能想创建一个宏变量，包含某个数据集变量的所有值。你可以使用\
  \ `INTO` 子句的另一种形式将一列的值合并到一个宏变量中。\n\n| 通用形式，带有 `INTO` 子句且用于将值合并到一个宏变量的 `SELECT` 语句：`PROC\
  \ SQL NOPRINT;SELECT column1INTO :macro-variable-1SEPARATED BY 'delimiter1'FROM\
  \ table-1 | view-1<WHERE expression><other clauses>;QUIT;` 以下是该语法的解释：`column1` 指定由\
  \ `table-1 | view-1` 指定的 SQL 表的列。`:macro-variable-1` 指定要创建的宏变量名称。`'delimiter1'`\
  \ 在引号内，指定作为宏变量值中分隔符的字符。`expression` 生成一个用于数据子集的值。`other clauses` 是其他用于分组、子集化或排序数据的有效子句。\
  \ |\n\n## 示例\n\n你可以使用 SQL 过程创建一个名为 `sites` 的宏变量，包含 `Sasuser.Schedule` 中出现的所有培训地的名称。这些名称用空格分隔。\n\
  \n```\nproc sql noprint;\n   select distinct location into :sites separated by '\
  \ '\n      from sasuser.schedule;\nquit;\n```\n\n现在你可以在标题中使用新的宏变量。\n\n```\nproc\
  \ means data=sasuser.all sum maxdec=0;\n   var fee;\n   title1 'Total Revenue';\n\
  \   title2 \"from Course Sites: &sites\";\nrun;\n```\n\n# 使用 PROC SQL 视图\n\n当你提交\
  \ `PROC SQL` 步骤时，PROC SQL 程序代码被放入输入栈，并对宏触发器进行单词扫描，这与其他 SAS 程序中的过程相同。在以下代码中，宏变量引用\
  \ `&crsid` 在创建 `PROC SQL` 视图期间被解析，导致每次使用该视图时都得到一个常数值。例如，如果在提交此代码代码时 `crsid` 的值为\
  \ `C003`，则视图 `Subcrsid` 是基于课程代码 C003 的。\n\n\n\n\n\n```\nproc sql;\n   create view\
  \ subcrsid as\n      select student_name, student_company,paid\n         from sasuser.all\n\
  \         where course_code=\"&crsid\";\nquit;\n```\n\n更好的方法是使用 `SYMGET` 函数，使视图能够查找宏变量的值。在接下来的示例中，当使用视图\
  \ `Subcrsid` 时，它是基于 `crsid` 的当前值生成的：\n\n```\n proc sql;\n   create view subcrsid\
  \ as\n      select student_name,student_company,paid\n         from sasuser.all\n\
  \         where course_code=symget('crsid');\nquit;\n\n%let crsid=C003;\nproc print\
  \ data=subcrsid noobs;\n   title \"Status of Students in Course Code &crsid\";\n\
  run;\n\n%let crsid=C004;\nproc print data=subcrsid noobs;\n   title \"Status of\
  \ Students in Course Code &crsid\";\nrun;\n```\n\n`PROC SQL` 不执行自动数据转换。如果将宏变量与数值变量进行比较，则必须使用\
  \ `INPUT` 函数将宏变量的值转换为数值。以下代码执行了一个基于宏变量 `crsnum` 当前值的数值等价值的查询。在该 `WHERE` 语句中，`INPUT`\
  \ 函数是必要的，因为数据集变量 `Course_number` 的值是数值，而 `crsnum` 是字符值，因为它是一个宏变量。\n\n```\nproc sql;\n\
  \    create view subcnum as\n       select student_name, student_company, paid\n\
  \          from sasuser.all\n          where course_number=input(symget('crsnum'),2.);\n\
  quit;\n\n%let crsnum=4;\nproc print data=subcnum noobs;\n   title \"Status of Students\
  \ in Course Number &crsnum\";\nrun;\n```\n\n# 在 SCL 程序中使用宏变量\n\n## 概述\n\nSAS 组件语言\
  \ (SCL) 程序被放置在输入栈中，并且在与其他 SAS 相同的相同的过程中，对宏触发器进行单词扫描。在 `SUBMIT` 块之外的宏变量引用在执行执行前会被解析。因此，在接下来的示例中，在\
  \ SCL 执行期间，会将常量值与 SCL 变量 `Wage` 进行比较：\n\n```\nMAIN:\n   erroroff wage;\n   if wage\
  \ gt &max then erroron wage;\nreturn;\n```\n\n`SUBMIT` 块内的任何文本都被假认为 SAS 代码，因此在编译\
  \ SCL 程序时，SCL 编译器会忽略它们。`SUBMIT` 块内的宏变量引用在 `SUBMIT` 块执行且 `SUBMIT` 块内的 SAS 代码被分词化之前，不会被解析。当\
  \ `SUBMIT` 块执行时，SAS 尝试将宏变量引用（`&name`）解析为对应的 SCL 变量。如果没有对应的 SCL 变量，则该引用将传递给宏处理器以在全局符号表中进行查找。你可以通过在名称前加上两个\
  \ 符号（`&&name`），强制将 `SUBMIT` 块内的引用（`&name`）作为宏变量引用传递。此外，还有几个函数和例程可以使 SCL 程序和宏设施在执行时交换信息。我们将检查这些函数和例程。你已经学习了如何在\
  \ `DATA` 步执行如何使用 `SYMPUT` 例程和 `SYMGET` 函数。`SYMPUT` 例程和 `SYMGET` 函数都可以在 SCL 程序中使用。每个者的语法与在\
  \ `DATA` 步中完全相同。此外，`SYMPUT` 例程和 `SYMGET` 函数都有用于 SCL 程序的数值等价物。\n\n## SYMPUTN 例程\n\
  \n`SYMPUTN` 例程允许你在 SCL 程序执行期间创建一个宏变量并为其分配一个数值值。\n\n| 通用形式，`SYMPUTN` 例程：`CALL SYMPUTN('macro-variable',\
  \ value);` |\n| :--- |\n| 以下是对语法的解释：`macro-variable` 是用单引号括起来的全局宏变量名称，且不带 & 符号。或者，它是一个\
  \ SCL 变量的名称（不带引号），其值是全局宏变量的名称。`value` 是分配给 `macro-variable` 的数值值，它可以是一个数字或数值型 SCL\
  \ 变量的名称。 |\n\n## 示例\n\n假设 SCL 变量 `unitvar` 的值为 `unit`，SCL 变量 `unitnum` 的数值为 200。为了创建一个名称为\
  \ `unitvar` 值（在此例中为 `unit`）的宏变量，并分配一个等于 SCL 变量 `unitnum` 值（在此例中为 200）的值，你在 `SUBMIT`\
  \ 块中提交以下语句：\n\n```\ncall symputn(unitvar, unitnum);\n```\n\n同样，为了创建一个名为 `unitvar`\
  \ 的宏变量并为其分配数值 500，你在 `SUBMIT` 块中提交以下语句。\n\n```\ncall symputn('unitvar', 500);\n\
  ```\n\n## SYMGETN 函数\n\n`SYMGETN` 函数允许你在 SCL 程序执行期间获取宏变量的数值值。\n\n| 通用形式，`SYMGETN`\
  \ 函数：`SCL-variable = SYMGETN('macro-variable');` |\n| :--- |\n| 以下是对语法的解释：`SCL-variable`\
  \ 是一个数值变量的名称，用于接收 `macro-variable` 的值。`macro-variable` 是用单引号括起来的全局宏变量名称，且不带 & 符号。或者，它是一个\
  \ SCL 变量的名称（不带引号），其值是全局宏变量的名称。 |\n\n## 示例\n\n假设 SCL 变量 `unitvar` 的值为 `unit`，宏变量\
  \ `unit` 的值为 200，而宏变量 `unitvar` 的值为 500。第一个语句创建一个名为 `unitnum` 的 SCL 变量并为其赋值 200。第二个语句创建一个名为\
  \ `unit` 的 SCL 变量并为其赋值 500。\n\n```\nunitnum=symgetn(unitvar);\nunit=symgetn('unitvar');\n\
  ```\n\n关于使用宏变量的更多信息，请参考宏语言。\n\n## 总结\n\n## 文字总结\n\n### 在 DATA 步中创建宏变量\n\n当你使用 `%LET`\
  \ 语句创建宏变量时，所有的宏处理都在 `DATA` 步执行之前完成。`SYMPUT` 例程允许在 `DATA` 步期间创建或更新宏变量。根据编码方式的不同，你可以创建一个或多个宏变量。你可以使用字面量通过\
  \ `SYMPUT` 例程创建宏变量，并为其分配精确的名称或文本值。你可以使用 `DATA` 变量通过 `SYMPUT` 例程将该 `DATA` 变量的值分配给宏变量。你可以使用\
  \ `SYMPUTX` 例程在 `DATA` 步期间创建或更新宏变量，并自动去除宏变量名称和值的两端空格。你还可以将 `DATA` 表达式作为 `SYMPUT`\
  \ 例程的参数，以便在赋值分配给宏变量之前应用 `DATA` 函数。\n\n### 在 DATA 步中创建多个宏变量\n\n你可以在一个 `DATA` 步中使用两个\
  \ `DATA` 表达式通过 `SYMPUT` 或 `SYMPUTX` 例程创建一系列相关的宏变量。\n\n### 间接引用宏变量\n\n有时，间接引用宏变量是有用的。例如，你可能想用一个宏变量来构造另一个宏变量的名称。通过在宏变量名前加上两个或多个\
  \ & 符号，你可以间接引用宏变量。\n\n\n\n\n\n你可以在 `PROC SQL` 步骤中使用 `SELECT` 语句中的 `INTO` 子句来访问宏功能。`INTO`\
  \ 子句的各种形式允许你创建一系列宏变量、数量变化的宏变量，或者一个通过连接 SQL 变量的唯一值创建的单个宏变量。你可以使用 `NOPRINT` 选项防止 `PROC\
  \ SQL` 步骤创建输出。\n\n### 使用 PROC SQL 视图\n\n当你提交一个 `PROC SQL` 步骤时，`PROC SQL` 程序代码被放入输入栈中，并与其他\
  \ SAS 程序相同的过程中，在同一进程中对宏触发器进行单词扫描。\n\n### 在 SCL 程序中使用宏变量\n\nSAS 组件语言 (SCL) 也有为宏变量赋值以及从宏符号表中获取取值的例程和函数。`SYMPUT`\
  \ 例程和 `SYMGET` 函数在 `SCL` 程序中的用法与它们在 `DATA` 步骤程序中的用法相同。此外，`SYMPUTN` 例程可以用于在 `SCL`\
  \ 程序执行期间创建宏变量并为这些变量分配数值。`SYMGETN` 函数可以用于在 `SCL` 程序执行期间获取宏变量的数值。\n\n## 示例程序\n\n###\
  \ 使用 CALL SYMPUT 创建宏变量\n\n```\n options symbolgen pagesize=30;\n %let crsnum=3;\n\
  \ data revenue;\n    set sasuser.all end=final;\n    where course_number=&crsnum;\n\
  \    total+1;\n    if paid='Y' then paidup+1;\n    if final then do;\n       if\
  \ paidup<total then do;\n          call symput('foot','Some Fees Are Unpaid');\n\
  \       end;\n       else do;\n          call symput('foot','All Students Have Paid');\n\
  \       end;\n    end;\nrun;\nproc print data=revenue;\n   var student_name student_company\
  \ paid;\n   title \"Payment Status for Course &crsnum\";\n   footnote \"&foot\"\
  ;\nrun;\n```\n\n### 间引用宏变量\n\n```\noptions symbolgen;\ndata _null_;\n    set sasuser.courses;\n\
  \    call symput(course_code, trim(course_title));\nrun;\n\n%let crsid=C005;\nproc\
  \ print data=sasuser.schedule noobs label;\n    where course_code=\"&crsid\";\n\
  \    var location begin_date teacher;\n    title1 \"Schedule for &&&crsid\";\nrun;\n\
  \n%let crsid=C002;\nproc print data=sasuser.schedule noobs label;\n    where course_code=\"\
  &crsid\";\n    var location begin_date teacher;\n    title1 \"Schedule for &&&crsid\"\
  ;\nrun;\n```\n\n### 使用 SYMGET 获取宏变量值\n\n```\ndata teachers;\n   set sasuser.register;\n\
  \   length Teacher $ 20;\n   teacher=symget('teach'||left(course_number));\nrun;\n\
  \nproc print data=teachers;\n   var student_name course_number teacher;\ntitle1\
  \ \"Teacher for Each Registered Student\";\nrun;\n```\n\n### 使用 INTO 子句创建宏变量\n\n\
  ```\nproc sql noprint;\n   select course_code, location, begin_date format=mmddyy10.\n\
  \      into :crsid1-:crsid3,\n           :place1-:place3,\n           :date1-:date3\n\
  \      from sasuser.schedule\n      where year(begin_date)=2002\n      order by\
  \ begin_date;\nquit;\n```\n\n## 注意事项\n\n- `SYMPUT` 例程可用于在 `DATA` 步骤执行期间创建或更新宏变量。\n\
  - 宏变量的值始终字符值。在 `DATA` 步骤中，`SYMPUT`会对你尝试分配给宏变量的任何数值执行自动的从数值到字符的转换。\n- `SYMGET` 函数可用于在\
  \ `DATA` 步骤、`PROC SQL` 步骤或 `SCL` 程序执行期间获取宏变量的值。\n- `INTO` 子句可用于 `SELECT` 语句中，在 `PROC\
  \ SQL` 步骤执行期间创建或更新宏变量。\n- `SYMPUT` 和 `SYMPUTN` 例程可用于在 `SCL` 程序执行期间创建或更新宏变量。\n\n\
  # 测验\n\n为每个问题选择最佳答案。完成测验后，使用附录中的答案键检查你的答案。\n\n1. 下列哪项是错误的？\n    1. `%LET` 语句会导致宏处理器在程序编译之前创建宏变量。\n\
