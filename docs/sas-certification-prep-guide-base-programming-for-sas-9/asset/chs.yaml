  \n9. 正确答案：c 单个内连接最多可以合并 256 张表。如果连接涉及视图（内联视图或 `PROC SQL` 视图），则视图底层的表数量（而不是视图数量）计入\
  \ 256 的限制中。\n\n10. 正确答案：d 使用汇总函数不需要使用表别名。这里显示的所有关于表别名的其他语句都是正确的。\n\n# 第 4 章：使用 PROC\
  \ SQL 垂直合并表\n\n1. 正确答案：c 在使用运算符 `EXCEPT`、`INTERSECT` 或 `UNION` 且没有关键字的集合操作中，列根据它们在\
  \ `SELECT` 子句中的位置进行重叠。重叠列是否具有相同名称无关。当列重叠时，列名取自 `SELECT` 子句中指定的第一个表。\n\n2. 正确答案：d\
  \ 默认情况下，在处理包含 `EXCEPT`、`INTERSECT` 和 `UNION` 集合运算符的集合操作时，`PROC SQL` 对数据进行额外扫描以消除重复行。关键字\
  \ `ALL` 用于抑制这种对表的额外扫描，允许重复行出现在结果集中。由于 `OUTER UNION` 集合运算符显示所有行，因此关键字 `ALL` 是无效的，且不能与\
  \ `OUTER UNION` 一起使用。\n\n3. 正确答案：d 输出包含两个表合并行集中所有唯一的行，且列已根据位置进行了重叠。此输出是由一个使用集合运算符\
  \ `UNION` 且无关键字的集合操作生成的。\n\n4. 正确答案：a 使用无关键字的集合运算符 `OUTER UNION` 的 `PROC SQL` 集合操作是显示的唯一没有在输出中重叠任何列的代码。\n\
  \n5. 正确答案：a 关键字 `CORRESPONDING` (`CORR`) 可以单独使用，也可以与关键字 `ALL` 一起使用。\n\n6. 正确答案：b\
  \ 此 `PROC SQL` 输出包含了 `Pets` 表中未出现在 `Dogs` 表中的所有行。不显示重复项。包含无关键字的集合运算符 `EXCEPT` 的\
