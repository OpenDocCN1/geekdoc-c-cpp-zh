  \ nobs';\n       ```\n\n\n\n\n- 概述基础概念使用自动宏变量使用用户定义宏变量处理宏变量在 SAS Log 中显示宏变量值使用宏函数掩码特殊字符使用宏函数处理字符串结合\
  \ SAS 函数与宏变量宏变量引用与文本结合总结练习\n\n## 概述\n\n## 引言\n\nSAS 宏变量允许你在 SAS 程序中替换文本。宏变量可以提供各种信息，包括：\n\
  \n* 操作系统信息\n* SAS 会话信息\n* 文本字符串。\n\n当你在 SAS 程序中引用宏变量时，SAS 会将引用替换为分配给该宏变量的文本值。通过在程序中替换文本，SAS\
  \ 宏变量使你的程序更具重用性和动态。下面的示例显示了如何使用宏变量替换整个程序中的年份值，让你能够快速方便地更改整个程序中的 `year` 值：\n\n```\n\
  %let year=2002;\nproc print data=sasuser.schedule;\n   where year(begin_date)=&year;\n\
  \   title \"Scheduled Classes for &year\";\nrun;\nproc means data=sasuser.all sum;\n\
  \   where year(begin_date)=&year;\n   class location;\n   var fee;\n   title1 \"\
  Total Fees for &year Classes\";\n   title2 \"by Training Center\";\nrun;\n```\n\n\
  # 基础概念\n\n## 概述\n\n在你编写的 SAS 程序中，你可能会发现需要多次引用同一个变量、数据集或文本字符串。\n\n```\ntitle \"Total\
  \ Sales for 2002\";\ndata perm.sales2002;\n   set perm.sales;\n   if year(enddate)=2002;\n\
  run;\nproc print data=perm.sales2002;\nrun;\n```\n\n这时，你可能需要更改程序中的引用，以引用不同的变量、数据集或文本字符串。如果你的程序很长，手动扫描特定引用并更新它们将耗费大量时间，而且很容易忽略需要更新的引用。\n\
  \n```\ntitle \"Total Sales for 2001\";\ndata perm.sales2001;\n   set perm.sales;\n\
  \   if year(enddate)=2002;\nrun;\nproc print data=perm.sales2001;\nrun;\n```\n\n\
  如果你在程序中使用宏变量，这些更新将变得快速且简单，因为你只需要在一个地方进行更改。\n\n```\n%let year=2002;\ntitle \"Total\
  \ Sales for &year\";\ndata perm.sales&year;\n   set perm.sales;\n   if year(enddate)=&year;\n\
  run;\nproc print data=perm.sales&year;\nrun;\n```\n\n宏变量的值会被插入到你的程序中，因此你只需要更改一次，更改就会出现在整个程序中。\n\
  \n## 宏变量\n\n宏变量是 SAS 宏功能的一部分，该功能是一种用于扩展和自定义 SAS，并减少为了执行常用任务时必须输入的程序代码数量的工具。宏功能有其自己的语言，允许你将少量或大量的文本封装成具有名称的单元。从那时起，你就可以使用名称而不是文本本身进行工作。宏变量有两种类型：\n\
  \n* 自动宏变量，由 SAS 提供\n* 用户定义宏变量，其值由你创建和定义。\n\n无论是自动还是用户定义的，宏变量都独立于 SAS 数据集，并包含一个文本字符串值，该值在你更改它之前保持不变。在程序引用宏变量的地方，宏变量的值就会被替换到程序中。宏变量的值存储在符号表中。自动宏变量始终存储在全局符号表中，这意味着这些值在你的\
  \ SAS 会话中始终可用。用户定义宏变量的值通常也存储在全局符号表中。\n\n```\n%let city=Dallas;\n%let date=05JAN2000;\n\
  %let amount=975;\n```\n\n![全局符号表](img/m50-3-g1.png)\n\n宏变量可以在 SAS 程序中的任何地方定义和引用，但数据行内部除外。\n\
  \n## 引用宏变量\n\n为了替换宏变量的值，你必须在宏变量名前加上一个符号符号 `&`。宏处理器会在符号表中查找该变量，如果找到，则将其替换为该值。某些宏变量在\
  \ SAS 启动时具有固定值。\n\n### 示例：引用宏变量\n\n要引用符号表中的变量 `amount`，你需要在程序中放置 `&amount`：\n\n\
  ```\ndata new;\n   set perm.sales;\n   where fee=&amount;\nrun;\n```\n\n### 替换后的代码\n\
  \n```\ndata new;\n   set perm.sales;\n   where fee=975;\nrun;\n```\n\n### 示例：在标题中引用宏变量\n\
  \n要在标题中引用宏变量 `city`，你需要使用双引号包含标题文本：\n\n```sas\ntitle \"Students from &city\";\n\
  ```\n\n当宏处理器无法解析宏变量时，SAS Log 会打印消息。例如，引用不存在的宏变量会导致警告。引用无效变量名会导致错误。\n\n#### 表 9.1\
  \ SAS Log\n\n```\n34 title \"Students from &cityst\";\n35 WARNING: Apparent symbolic\
  \ reference CITYST not resolved.\n36 title \"Students from \"the_city_in_which_the_student_is_located\"\
  ;ERROR: Symbolic variable THE_CITY_IN_WHICH_THE_STUDENT_I must be 32 or fewer characters\
  \ long.\n``` 使用自动宏变量\n\n## 概述\n\nSAS 创建并定义若干自动宏变量。自动宏变量包含有关你计算环境的信息，例如会话的日期和时间以及你运行的\
  \ SAS 版本。这些自动宏变量\n\n* 在 SAS 启动时创建\n* 是全局的（始终可用）\n* 通常由 SAS 分配值\n* 在某些情况下可以由用户赋值\n\
  \n某些自动宏变量在 SAS 启动时具有固定值。\n\n| 名称 | 值 |\n| --- | --- |\n| SYSDATE | SAS 启动的日期 (DATE7.)\
  \ |\n| SYSDATE9 | SAS 启动的日期 (DATE9.) |\n| SYSDAY | SAS 启动时的星期几 |\n| SYSTIME | SAS\
  \ 启动的时间 |\n| SYSENV | FORE（交互式执行）或 BACK（非交互式或批处理执行） |\n| SSCP | 使用的操作系统简称，例如 WIN\
  \ 或 LINUX |\n| SYSVER | 使用的 SAS 版本 |\n| SYSJOBID | 当前 SAS 会话或当前批处理作业的标识符（主机的系统的用户\
  \ ID 或作业名，其他系统的进程 ID PID） |\n\n\n\n\n一些自动宏变量的值会根据提交的 SAS 语句自动发生变化。\n\n| 名称 | 值 |\n\
  | --- | --- |\n| `SYSLAST` | 最近创建的 SAS 数据集的名称，格式为 `LIBREF.NAME.` .。此值始终以全大写字母存储。如果没有创建任何数据集，则该值为\
  \ `NULL`。注意：在本书中，示例程序经常使用关键字 `NULL` 来代替数据集名称。使用 `NULL` 可以抑制输出数据集的创建。在进行基准测试时使用 `NULL`，可以让你确定读取\
  \ SAS 数据集时使用了哪些资源。 |\n| `SYSPARM` | 在调用 SAS 时指定的文本 |\n| `SYSERR` | 包含由 `DATA` 步和某些\
  \ SAS 过程设置的返回代码状态，指示该步或过程是否执行成功 |\n\n## 示例\n\n你可以在报告的脚注中使用系统信息，例如调用 SAS 会话的时间、天、日期以及你正在运行的\
  \ SAS 版本。\n\n```\nfootnote1 \"Created &systime &sysday, &sysdate9\";\nfootnote2\
  \ \"on the &sysscp system using Release &sysver\";\ntitle \"REVENUES FOR DALLAS\
  \ TRAINING CENTER\";\nproc tabulate data=sasuser.all(keep=location course_title\
  \ fee);\n   where upcase(location)=\"DALLAS\";\n         class course_title;\n \
  \        var fee;\n         table course_title=\" \" all=\"TOTALS\",\n         \
  \      fee=\" \"*(n*f=3\\. sum*f=dollar10.)\n               / rts=30 box=\"COURSE\"\
  ;\nrun;\n```\n\n![课程信息](img/m50-9-g1.png)\n\n1. 一天的时间 (`SYSTIME`)\n2. 星期几 (`SYSDAY`)\n\
  3. 日期（日、月、年） (`SYSDATE9`)\n4. 操作系统环境 (`SYSSCP`)\n5. SAS 版本 (`SYSVER`)\n\n# 使用用户定义的宏变量\n\
  \n## %LET 语句\n\n你已经看到 SAS 为你提供了各种宏变量。你也可以创建自己的宏变量。定义自定义宏变量最简单的方法是使用 `%LET` 语句。`%LET`\
  \ 语句允许你定义一个宏变量并为其赋值。\n\n| %LET 语句的一般形式： | `%LET variable=value;` |\n| 这里是对语法的解释：`variable`\
  \ 是任何符合 SAS 命名规范的名称。`value` 可以是从 0 到 65,534 个字符的任何字符串。如果 `variable` 或 `value` 包含对另一个宏变量的引用（例如\
  \ `&macvar`），该引用将在赋值之前求值。 |\n\n注意：如果 `variable` 已经存在，则 `value` 将替换当前值。\n\n## 示例\n\
  \n要创建一个名为 `time` 的宏变量并为其赋值值 `afternoon`，你将提交以下 `%LET` 语句：\n\n```\n%let time=afternoon;\n\
  ```\n\n当使用 `%LET` 语句定义宏变量时，你应该记住以下规则：\n\n* 所有值都以字符字符串的形式存储。\n* 数学表达式不会被求值。\n* 值的的大小会被保留。\n\
  * 包围字面量的引号将作为值的一部分存储。\n* 在赋值之前，会删除值前后的空白字符。\n\n## %LET 语句示例\n\n在定义宏变量时，请记住它的值始终是一个字符字符串。下表提供了宏变量赋值的示例，以说明上一节列出的规则。\n\
  \n| %LET 语句 | 变量名 | 变量值 | 长度 |\n| --- | --- | --- | --- |\n| `%let name= Ed Norton\
  \ ` | `name` | ` Ed Norton ` | 9 |\n| `%let name2=' Ed Norton ';` | `name2` | `'\
  \ Ed Norton ` | 13 |\n| `%let title=\"Joan's Report\";` | `title` | `\"Joan's Report\"\
  ` | 15 |\n| `%let start=;` | `start` | | 0 |\n| `%let total=0;` | `total` | `0`\
  \ | 1 |\n| `%let sum=4+3;` | `sum` | `4+3` | 3 |\n| `%let total=&total+&sum` | `total`\
  \ | `0+4+3` | 5 |\n| `%let x=varlist;` | `x` | `varlist` | 7 |\n| `%let &x=name\
  \ height;` | `varlist` | `name height` | 15 |\n\n在接下来的示例中，值 `DALLAS` 被赋值给宏变量 `site`。然后宏变量\
  \ `site` 被用于控制程序的输出。\n\n```\n%let site=DALLAS;\ntitle \"REVENUES FOR &site TRAINING\
  \ CENTER\";\nproc tabulate data=sasuser.all(keep=location\n                    \
  \     course_title fee);\n   where upcase(location)=\"&site\";\n   class course_title;\n\
  \   var fee;\n   table course_title=' ' all='TOTALS',\n         fee=' '*(n*f=3\\\
  . sum*f=dollar10.)\n         / rts=30 box='COURSE';\nrun;\n```\n\n![达拉斯培训中心收入](img/14-g1)\n\
  \n# 处理宏变量\n\n## SAS 处理\n\n你已经了解了如何创建和引用宏变量。为了在你编写的程序中使用宏变量，你需要理解宏变量是如何被处理和存储的。首先，理解\
  \ SAS 处理是如何工作的至关重要。SAS 程序可以是以下内容的任何组合：\n\n* `DATA` 步和 `PROC` 步\n* 全局语句\n* SAS 组件语言\
  \ (SCL) 代码\n* 结构查询语言 (SQL) 代码\n* SAS 宏语言代码\n\n当你提交程序时，它会进入一个称为输入栈（input stack）的内存区域。适用于你提交的所有代码，例如\
  \ `DATA` 步、`SCL` 代码或 `SQL` 代码![输入栈](img/m50-9-g1) 一旦 SAS 代码进入输入栈，SAS 将：\n\n* 读取输入栈中的文本（从左到右，从上到下）\n\
  * 根据需要将文本路由到适当的编译器\n* 当遇到如 `RUN` 语句之类的步边界时，暂停此活动\n* 如果没有编译错误，则执行编译后的代码\n* 对任何后续步重复此过程。\n\
  \n![编译器](img/19-g2)\n\n## 分词\n\n在输入栈和编译器之间，SAS 程序会被分词为更小的部分。SAS 的一个称为单词扫描器会将程序分解为标记（tokens）。\n\
  \n* 标记根据需要传递给编译器。\n* 编译器请求标记直到收到分号。\n* 编译器对语句进行语法检查。\n\n![编译器](img/20-g1) SAS 停止发送语句到编译器，直到到达步边界。步边界示例包括\
  \ `run;` 或新 `DATA` 或 `PROC` 步的开始。一旦整个步编译，就会执行。单词扫描器识别四种标记：\n\n* 字面量标记是被视为整体的字符字符串。该字符串由单引号或双引号包围。例如：`\"\
  Any text\" 'Any text'`\n* 数字标记是包含数字的字符串，可以包含小数点或 E 表示法（实数）。日期常量、时间常量、日期时间常量十六进制常量也是数字标记。例如：`23\
  \ 109 '01jan2002'd 5e8 42.7`\n* 名称标记是以字母或下划线开头，后续下划线、字母或数字的字符串。小数点有时可以是名称的一部分。例如：`infile\
  \ _n_ item3 univariate dollar10.2`\n* 特殊标记是对编译器具有保留含义的任何字符或字符组。例如：`* / + - ** ;\
  \ ( ) . & %`\n\n当单词扫描器检测到以下内容时，标记结束：\n\n* 另一个标记的开始\n* 标记后的空格\n\n任何标记的最大长度为 32,767\
  \ 个字符。\n\n## 示例\n\n* ``````\n    var x1-x10      z   ;\n    ```\n\n    此示例包含六个标记：`var\
  \ x1 - x10 z ;`\n\n* ``````\n    title 'Report for May';\n    ```\n\n    此示例包含三个标记：`title\
  \ 'Report for May' ;`\n\n## 宏触发器\n\n\n\n\n宏变量引用和 `%LET` 语句是宏语言的一部分。宏功能包含一个宏处理器，负责处理所有宏语言元素。某些标记符序列被称为宏触发器（macro\
  \ triggers），它们会通知词法扫描器，随后的代码应被发送给宏处理器。词法扫描器将以下标记符序列识别为宏触发器：\n\n*   `%` 后面紧跟一个名称标记符（例如\
  \ `%let`）\n*   `&` 后面紧跟一个名称标记符（例如 `&amt`）\n\n当检测到宏触发器时，词法扫描器将其传递给宏处理器进行求值。宏处理器：\n\
  \n*   检查这些标记符\n*   根据需要请求额外的标记符\n*   执行所指示的动作。\n\n对于宏变量，处理器会执行以下操作中的其中一种：\n\n* \
  \  在符号表中创建一个宏变量并为该变量赋值\n*   更改符号表中已存在的宏变量的值\n*   在符号表中查找已存在的宏变量，并将变量的值返回到输入栈，以替换原始引用。\n\
  \n随后，词法扫描器继续从输入栈处理标记符。注意：词法扫描器不识别包含在单引号中的宏触发器。记住，如果你需要在字面标记符内部引用宏变量（例如 `TITLE` 语句中的标题文本），你必须将文本字符串包含在双引号中，否则宏变量引用将不会被解析。\n\
  \n# 在 SAS 日志中显示宏变量值\n\n## SYMBOLGEN 选项\n\n当提交一个宏变量引用时，宏处理器会解析该引用并将值直接传回输入栈。因此，你无法看到编译器接收到的值。为了调试你的程序，查看替换你的宏变量引用的值可能对你很有帮助。你可以使用\
  \ `SYMBOLGEN` 系统选项来监控替换宏变量引用的值。\n\n| 通用格式，带有 SYMBOLGEN 选项的 OPTIONS 语句：`OPTIONS NOSYMBOLGEN\
  \ | SYMBOLGEN;` |\n| :--- | :--- |\n| `NOSYMBOLGEN` | 指定不显示关于宏变量引用的日志消息。这是默认设置。\
  \ |\n| `SYMBOLGEN` | 指定显示关于宏变量引用的日志消息。 |\n\n该系统选项在 SAS 日志中显示解析宏变量引用的结果。换句话之，当开启\
  \ `SYMBOLGEN` 选项时，SAS 会为程序中所引用的每个宏变量向日志写入一条消息。该消息说明宏变量名称和解析后的值。注意：记住，由于 `SYMBOLGEN`\
  \ 是系统选项，它的设置将一直有效，直到你修改它或结束 SAS 会话。\n\n## 示例\n\n假设你之前为宏变量 `amount`、`city` 和 `company`\
  \ 分配了值，并提交了以下代码：\n\n```sas\ndata new;\n   set sasuser.all;\n   where fee>&amount;\n\
  \   where also city_state contains \"&city\";\n   where also student_company contains\
  \ '&company';\nrun;\n```\n\n这是一个示例 SAS 日志，显示了该代码由 `SYMBOLGEN` 选项生成的消息。`WHERE ALSO`\
  \ 条件使用 `AND` 运算符增强了初始的 `WHERE` 条件。在这个示例中，where 处理是针对以下条件进行的：`(fee>&amount) AND (city_state\
  \ contains \"&city\") AND (student_company contains '&company')`。\n\n表 9.2 SAS 日志\n\
  \n| |\n| :--- |\n| ```sas\n110 where fee>&amount;\nSYMBOLGEN: Macro variable AMOUNT\
  \ resolves to 975\n111 where city_state contains \"&city\";\nSYMBOLGEN: Macro variable\
  \ CITY resolves to Dallas\n112 where student_company contains '&company';\n``` |\n\
  \n注意，最后一个宏变量引用（`'&&company'`）没有显示任何消息。因为这个宏变量引用被包含在单引号而不是双引号中，词法扫描器没有调用宏功能来解析它。\n\
  \n## %PUT 语句\n\n验证宏变量值的另一种方法是向 SAS 日志写入你自己的消息。`%PUT` 语句将文本写入 SAS 日志。\n\n| 通用格式，基本\
  \ %PUT 语句：`%PUT text;` |\n| :--- | :--- |\n| `text` | 任意文本字符串。 |\n\n`%PUT` 语句：\n\
  \n*   仅写入 SAS 日志\n*   始终写入新的日志行，并从第一列开始\n*   如果未指定文本，则写入一个空行\n*   文本周围不需要引号\n* \
  \  在文本写入之前解析文本中的宏触发器\n*   除非使用了宏引用函数，否则会移除文本前导和结尾的空格\n*   当文本长度大于当前行大小设置时进行换行\n\
  *   可以在宏定义内部或外部使用。\n\n## 示例\n\n假设你想验证宏变量 `city` 的值。由于 `%PUT` 语句在将文本写入 SAS 日志之前解析文本中的宏引用，你可以用它显示\
  \ `city` 的存储值。\n\n```sas\n%put The value of the macro variable CITY is: &city;\n\
  ```\n\n表 9.3 SAS 日志\n\n| |\n| :--- |\n| ```sas\n120 %put The value of the macro\
  \ variable CITY is: &city;\nThe value of the macro variable CITY is: Dallas\n```\
  \ |\n\n你也可以简单地提交 `&put &city;` 语句而不带任何额外文本。该语句将宏变量 `city` 的解析值写入 SAS 日志。然而，它不会向日志中写入任何额外文本。你可能会发现，在\
  \ `%PUT` 语句中添加解释性文本以保持清晰度是一个好主意。`%PUT` 语句有几个可选参数。\n\n| 参数 | 日志结果 |\n| :--- | :---\
  \ |\n| `_ALL_` | 显示所有宏变量的值 |\n| `_AUTOMATIC_` | 显示自动宏变量的值 |\n| `_LOCAL_` | 显示本地宏变量的值\
  \ |\n| `_USER_` | 显示用户定义的宏变量的值 |\n\n表 9.4 SAS 日志\n\n| |\n| :--- |\n| ```sas\n121\
  \ %let year=2002;\n122 %let city=New York;\n123 %let region=South;\n124 %put _all_;\n\
  GLOBAL YEAR 2002\nGLOBAL REGION South\nGLOBAL CITY New York\nAUTOMATIC AFDSID 0\n\
  AUTOMATIC AFDSNAME\nAUTOMATIC AFLIB\nAUTOMATIC AFSTR1\nAUTOMATIC AFSTR2\nAUTOMATIC\
  \ FSPBDV\nAUTOMATIC SYSBUFFR\nAUTOMATIC SYSCC 0\nAUTOMATIC SYSCHARWIDTH 1\nAUTOMATIC\
  \ SYSCMD\nAUTOMATIC SYSDATE 29MAY02\n``` |\n\n注意，可选参数每个宏变量名称都会写入日志，并带有 AUTOMATIC\
  \ 或 GLOBAL 标签。\n\n# 使用宏函数屏蔽特殊字符\n\n## 宏引用函数\n\nSAS 编程语言使用成对的双引号或单引号来区分常量和名称。引号本身不作为它们定义的标记的一部分存储。例如，在下面的程序中，`var`\
  \ 被存储为值为 `text` 的四字节变量。如果 `text` 没有包含在引号中，它将被视为一个变量名。`var2` 被存储为值为 `example` 的七字节变量。\n\
  \n```sas\ndata one;\n   var='text';\n   text='example';\n   var2=text;\nrun;\n```\n\
  \n同样，以下示例中的标题文本是 `Joan's Report`。虽然 `TITLE` 语句包含成对的双引号，但标题本身并不包含这些外部引号。然而，外部引号导致文本内部未匹配的单引号被解释为标题文本的一部分（撇号）。\n\
  \n```sas\nproc print;\n   title \"Joan's Report\";\nrun;\n```\n\n## 示例\n\n之前你学习了宏变量值是字符字符串，并看到了包含特殊字符的宏变量示例。现在，假设要在宏变量中存储一个或多个\
  \ SAS 语句。例如，你想创建一个名为 `prog` 的宏变量，将其值存储为 `data new; x=1; run;`。\n\n\n\n\n```\noptions\
  \ symbolgen;\n%let prog=data new; x=1; run;;\n&prog\nproc print;\nrun;\n```\n\n\
  这里是由上述程序生成的 SAS 日志的一部分。\n\n表 9.5 SAS Log\n\n|  \n\n```\n25 options symbolgen;\n\
  26\n27 %let prog=data new; x=1; run;\n27 %let prog=data new; x=1; run;\n       \
  \                -\n                       180\nERROR 180-322: Statement is not\
  \ valid or it is used out of proper order.\nSYMBOLGEN: Macro variable PROG resolves\
  \ to data new\n28      &prog\n29      proc print;\n30      run;\nNOTE: The data\
  \ set WORK.NEW has 1 observations and 0 variables.\nNOTE: The data set WORK.PROC\
  \ has 1 observations and 0 variables.\nNOTE: The data set WORK.PRINT has 1 observations\
  \ and 0 variables.\nNOTE: DATA statement used (Total process time):\n      real\
  \ time           0.25 seconds\n      cpu time            0.07 seconds\n```\n\n |\n\
  \n注意，根据日志中的 `SYMBOLGEN` 语句，宏变量 `prog` 已被赋值为 `data new`。SAS 将第一个分号解释为宏赋值语句的结束。在这种情况下，我们希望分号是宏变量值的一部分，但\
  \ SAS 无法得知这一点。在这种情况下，你需要掩码掉你想要赋值给宏变量的文本。也就是说，你需要让宏处理器忽略分号的普通含义。你可以使用宏引用函数来实现这一点。\n\
  \n## %STR 函数\n\n`%STR` 函数用于在编译期间对标记（tokens）进行掩码（或在其周围加上引号），以确保宏处理器不会将其解释为宏层面的语法。也就是说，`%STR`\
  \ 函数会隐藏分号和其他特殊标记，以及比较或逻辑运算符的记忆等效符的普通含义，使它们作为常量文本出现。特殊标记和记忆等效符包括\n\n```\n; + - *\
  \ / , < > = blank ^ ~ # | \nLT EQ GT AND OR NOT LE GE NE IN\n```\n\n`%STR` 函数还可以\n\
  \n*   允许宏触发器正常工作\n*   保留其参数开头和结尾的空格。\n\n| 通用形式，`%STR` 函数：`%STR (argument)`这里是对该语法的解释：`argument`\
  \ 是文本和宏触发器的任意组合。 |\n\n将此应用于我们之前的示例，文本有多种被引的方式。请记住，我们想要创建一个名为 `prog` 的宏变量，其赋值值为 `data\
  \ new; x=1; run;`。\n\n方法一\n你可以对所有文本进行引用。`%let prog=%str(data new; x=1; run;);`\n\
  \n方法二\n你可以只对分号进行引用。`%let prog=data new%str(;) x=1%str(;)run%str(:);`\n\n方法三\n你可以创建一个额外的宏变量，给它分配一个引用值，并在\
  \ `prog` 宏变量的赋值语句中引用它。`%let s=%str(;); %let prog=data new&s x=1&s run&s;`\n\n这些方法都实现了相同的功能：它们都将值\
  \ `data=new; x=1; run;` 赋值给宏变量 `prog`。`%STR` 函数还可以用于对通常成对出现的标记进行引用：\n\n```\n' \"\
  \ ) (\n```\n\n## 示例\n\n假设你想给宏变量分配一个包含撇号（` '`）的文本。如果没有任何引用，这会导致错误。\n\n```\noptions\
  \ symbolgen;\n%let text=Joan's Report;\nproc print data=sasuser.courses;\n   where\
  \ days > 3;\ntitle \"&text\";\nrun;\n```\n\n表 9.6 SAS Log\n\n|  \n\n```\n75 %let\
  \ text=Joan's Report;\n                ---------\n                32\nWARNING 32-169:\
  \ The quoted string currently being processed has\n                become more than\
  \ 262 characters long. You may\n                have unbalanced quotation marks.\n\
  ```\n\n |\n\n单词扫描器将撇号解释为由一对单引号定义的字面量的开始。你可以使用 `%STR` 函数来避免此错误。在上一节中，你看到了几种使用 `%STR`\
  \ 函数来掩码分号普通含义的方法。然而，显示的方法中没有一个能正确地掩码我们当前示例中的撇号。当你引用通常成对出现的标记（如引号或括号）时，你必须额外执行一步。为了执行这种引用，你需要在\
  \ `%STR` 函数参数中在你想要引用的标记前面加上一个百分号（`%`）。\n\n```\n%let text=%str(Joan%'s Report);\n\
  %let text=Joan%str('%')s Report;\n```\n\n在两种情况下，`text` 的值都是 `Joan's Report`。\n\n\
  ## %NRSTR 函数\n\n有时你想隐藏波浪（`&`）或百分号（`%`）的普通含义。`%NRSTR` 函数执行与 `%STR` 相同的引用功能，因为它还掩码了宏触发器（`&`\
  \ 和 `%`）。`%NRSTR` 名称中的 NR 代表“不解析”（No Resolution）。`%NRSTR` 的语法与 `%STR` 相同。\n\n##\
  \ 示例\n\n假设你想创建一个名为 `period` 的宏变量，并为其分配一个 `May&Jun` 的值。如果你尝试在赋值语句中使用 `%STR` 函数，SAS\
  \ 将 `&` 解释为宏触发器并生成警告消息。你需要使用 `%NRSTR` 函数。\n\n```\n%let Period=%str(May&Jun);\n%put\
  \ Period:&period;\n%let Period=%nrstr(May&Jun);\n%put Period:&period;\n```\n\nSAS\
  \ 日志的后续部分显示了此示例中 `%STR` 函数和 NRSTR 函数的结果。\n\n表 9.7 SAS Log\n\n|  \n\n```\n1    %let\
  \ Period=%str(May&Jun);\nWARNING: Apparent reference Jun not resolved.\n2    %put\
  \ Period:&period;\nWARNING: Apparent reference Jun not resolved.\nPeriod: May&Jun\n\
  3\n4    %let Period=%nrstr(May&Jun);\n5    %put Period:&period;\nPeriod: May&Jun\n\
  ```\n\n## %BQUOTE 函数\n\n与 `%STR` 函数一样，`%BQUOTE` 函数用于对特殊字符和记忆运算符进行掩码（或在其加上引号）。`%STR`\
  \ 函数在编译期间执行，而 `%BQUOTE` 在执行期间执行。也就是说，`BQUOTE` 函数在执行期间掩码字符字符串或解析后的值，使得特殊字符和记忆运算符不会被解释为纯文本以外的任何内容。特殊标记和记忆等效符包括\n\
  \n```\n' \" ) ( + - * / , < > = blank ^ ~ # | \nLT EQ GT AND OR NOT GE NE IN\n```\n\
  \n`%BQUOTE` 函数还可以\n\n*   不需要标记引号\n*   允许宏触发器正常工作\n*   保留其参数开头和结尾的空格。\n\n| 通用形式，`%BQUOTE`\
  \ 函数：`%BQUOTE (argument)`这里是对该语法的解释：`argument` 是文本和宏触发器的任意组合。 |\n\n## 示例\n\n记得你想给宏变量分配包含撇号（`'`）文本的示例。你使用了\
  \ `%STR` 函数来掩码撇号。你可以使用 `%BQUOTE` 函数完成此任务。`BQUOTE` 函数不需要标记不匹配的引号，因此包含撇号的标题不需要特殊语法。\n\
  \n```\n%let text=%bquote(Joan's Report);\n```\n\n# 使用宏函数处理字符串\n\n## 宏字符函数\n\n在处理宏变量时，经常需要处理字符串。你可以通过宏字符函数来实现这一点。通过宏字符函数，你可以：\n\
  \n*   将小写字母转换为大写字母\n*   产生字符串的子字符串\n*   从字符串中提取单词\n*   确定字符串的长度等等。\n\n宏字符函数的基本语法与对应的\
  \ DATA 步函数相同，并产生相似的结果。重要的是记住，尽管它们可能相似，但宏字符函数与 DATA 步函数是不同的。作为宏语言的一部分，宏函数允许你与宏处理器进行通信，以处理插入你的\
  \ SAS 程序中的文本字符串。接下来的几节将详细探讨几个宏字符函数。\n\n## %UPCASE 函数\n\n\n\n\n`%UPCASE` 函数允许您在 SAS\
  \ 程序中替换该值之前，将宏变量的值从小写转换为大写。由于 SAS 语言中的大多数比较运算符都是区分大小大小的，因此通常需要将值转换为大写。\n\n| `%UPCASE`\
  \ 函数的通用形式： | `%UPCASE (argument)` | 以下是该语法的说明：`argument` 是一个字符字符串。 |\n\n## 示例\n\n\
  `Sasuser.All` 数据集包含了学生信息和计算机培训课程的注册信息。假设您想创建一个未收缴学费的摘要：\n\n```\n%let paidval=n;\n\
  proc means data=sasuser.all sum maxdec=0;\n   where paid=\"&paidval\";\n   var fee;\n\
  \   class course_title;\ntitle \"Uncollected Fees for Each Course\";\nrun;\n```\n\
  \n表 9.8 SAS 日志\n\n| |\n\n```\n163 %let paidval=n;\n164  proc means data=sasuser.all\
  \ sum maxdec=0;\n165       where paid=\"&paidval\";\n166       var fee;\n167   \
  \    class course_title;\n168  title \"Uncollected Fees for Each Course\";\n169\
  \  run;\n\nNOTE: No observations were selected from data set SASUSER.ALL.\n```\n\
  \n| |\n\n由于宏变量 `paidval` 的值是以小写指定的，因此 `WHERE` 表达式没有找到匹配的观测值。数据集变量 `Paid` 的所有值都以大写形式存储。现在，我们可以在\
  \ `WHERE` 语句中使用 `%UPCASE` 函数：\n\n```\n%let paidval=n;\nproc means data=sasuser.all\
  \ sum maxdec=0;\n   where paid=\"%upcase(&paidval)\";\n   var fee;\n   class course_title;\n\
  title \"Uncollected Fees for Each Course\";\nrun;\n```\n\n您看到，这次 `WHERE` 表达式确实找到了匹配的观测值![每门课程的未收缴费用](img/m50-39-g1.png)\n\
  \n## %QUPCASE 函数\n\n如果参数包含特殊字符、助记操作符或宏触发器，您需要使用 `%QUPCASE` 函数。`%QUPCASE` 的语法与 `%UPCASE`\
  \ 函数相同，其工作原理与 `%UPCASE` 相同，不同在于它还会掩盖函数结果中的助记操作符和特殊字符（包括宏触发器）。\n\n## 示例\n\n这些语句显示了\
  \ `%UPCASE` 和 `%QUPCASE` 生成的结果：\n\n```\n%let a=begin;\n%let b=%nrstr(&a);\n\n%put\
  \ UPCASE produces: %upcase(&b);\n%put QUPCASE produces: %qupcase(&b);\n```\n\n在第一个\
  \ `%PUT` 语句中，宏引用 `&b` 解析为 `&a`，由于 `%UPCASE` 函数的作用，它被转换为 `&A`。由于解析后的值包含宏触发器，它被视为宏变量引用，因此\
  \ `&A` 解析为值 `begin`。第二个 `%PUT` 语句使用了 `%QUPCASE` 函数，该函数掩盖了宏变量 `b` 解析值中的 ampersand\
  \ 符号（&），使得该值不会被视为另一个宏变量引用。执行这些语句会在 SAS 日志中产生以下消息。\n\n表 9.9 SAS 日志\n\n| |\n\n```\n\
  6    %let a=begin;\n7    %let b=%nrstr(&a);\n8\n9    %put UPCASE produces: %upcase(&b);\n\
  UPCASE produces: begin\n10   %put QUPCASE produces: %qupcase(&b);\nQUPCASE produces:\
  \ &A\n```\n\n| |\n\n## %SUBSTR 函数\n\n`%SUBSTR` 函数允许您从宏变量的值中提取字符字符串的一部分。\n\n| `%SUBSTR`\
  \ 函数的通用形式： | `%SUBSTR (argument, position<,n>)` | 以下是该语法的说明：`argument` 是一个字符字符串或文本表达式，从中返回子字符串。`position`\
  \ 是一个整数或产生整数的表达式（文本、逻辑或数学表达式），用于指定子字符串中第一个字符的位置。`n` 是可选的整数或产生整数的表达式（文本、逻辑或数学表达式），用于指定子字符串中的字符数。\
  \ |\n\n注意：如果 `n` 的长度大于 `argument` 中 `position` 之后的字符数，`%SUBSTR` 会发出警告消息并返回从 `position`\
  \ 到字符串末尾的子字符串。如果未指定 `n`，`%SUBSTR` 也会返回从 `position` 到字符串末尾的子字符串。例如，假设宏变量 `date` 的值为\
  \ `05JAN2002`。\n\n*   代码 `%substr(&date,3)` 返回值 `JAN2002`。\n*   代码 `%substr(&date,3,3)`\
  \ 返回值 `JAN`。\n*   代码 `%substr(&date,3,9)` 返回值 `JAN2002` 并产生警告消息。\n\n`position` 和\
  \ `n` 的值也可以产生整数的数学表达式的结果。例如，`%substr(&var,%length(&var)-1)` 返回宏变量 `var` 值的最后两个字符。注意：`%LENGTH`\
  \ 函数接受字符字符串或文本表达式作为参数。如果参数是字符字符串，`%LENGTH` 返回字符串的长度。如果参数是文本表达式，`%LENGTH` 返回解析值的长度。如果参数为空值，`%LENGTH`\
  \ 返回 0。\n\n## 示例\n\n假设您想打印一份自本月初以来所有课程的报告。您可以使用 `%SUBSTR` 函数来确定月份。（注：此处提供的原始文本存在大量重复和错乱，已根据逻辑进行了清理和翻译）。\n\
  \n[content]\n`%UPCASE` 函数允许您在 SAS 程序中替换该值之前，将宏变量的值从小写转换为大写。由于 SAS 语言中的大多数比较运算符都是区分大小写的，因此通常需要将值转换为大写。\n\
  \n| `%UPCASE` 函数的通用形式： | `%UPCASE (argument)` | 以下是该语法的说明：`argument` 是一个字符字符串。 |\n\
  \n## 示例\n\n`Sasuser.All` 数据集包含了学生信息和计算机培训课程的注册信息。假设您想创建一个未收缴学费的摘要：\n\n```\n%let\
