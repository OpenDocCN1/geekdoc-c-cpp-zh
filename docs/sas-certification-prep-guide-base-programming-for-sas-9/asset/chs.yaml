  \  create table work.names\n              set (FullName char(25), Age num);\n  \
  \     ```\n\n# 第 6 章：使用 PROC SQL 创建和管理索引\n\n## 概述\n\n在处理包含子集 `WHERE` 子句或连接多个表的查询时，`PROC\
  \ SQL` 必须在所引用的表中定位特定行。为表创建索引允许 `PROC SQL` 在某些情况下更快速、更高效地定位特定行。索引是一个辅助文件，用于存储表中一个或多个指定列（键列）值的物理位置。在索引中，键列（列）的每个唯一值都与包含该值的行标识符配对。就像你使用书籍的主题索引查找讨论特定主题的页码一样，`PROC\
  \ SQL` 使用索引中的引导系统通过索引值直接访问表中的特定行。你可以为单个表创建多个索引。SAS 表的所有索引都存储在一个索引文件中。注意：你不能在视图上创建索引。以下\
  \ `PROC SQL` 步骤使用 `CREATE INDEX` 语句为表创建索引，并使用 `DESCRIBE TABLE` 语句在 SAS 日志中显示有关索引的信息以及关于表的其他信息：\n\
  \n```sql\nproc sql;\n   create unique index empid \n      on work.payrollmaster(empid);\n\
  \   describe table work.payrollmaster;\n```\n\n注意：有关 `BUFSIZE=` 选项的更多信息，请参阅[使用 BUFSIZE=\
  \ 选项]。\n\n表 6.1 SAS 日志\n\n```sql\ncreate table WORK.PAYROLLMASTER( bufsize=4096\
  \ ) \n  ( \n   DateOfBirth num format=DATE9\\. informat=DATE9.,\n   DateOfHire num\
  \ format=DATE9\\. informat=DATE9.,\n   EmpID char(4),\n   Gender char(1),\n   JobCode\
  \ char(3),\n   Salary num format=DOLLAR9.\n  );\ncreate unique index EmpID on WORK.PAYROLLMASTER(EmpID);\n\
  ```\n\n在本章中，你将学习使用 `PROC SQL` 创建和管理各种类型的索引。\n\n### 理解索引\n\n## 访问表中的行\n\n当你对没有索引的表提交查询时，`PROC\
  \ SQL` 会按照行在表中的存储顺序读取。然而，如果存在索引，`PROC SQL` 可以使用索引更高效地访问行。例如，如果你在某一列上创建了索引，`PROC\
  \ SQL` 可以使用索引检索满足 `WHERE` 子句的行，而无需读取所有行。这在表很大时特别有用。\n\n## 简单索引和复合索引\n\n你可以创建两种类型的索引：\n\
  \n- **简单**：简单索引基于一列。\n- **复合**：复合索引基于两个或多个列。例如，如果你在 `LastName` 和 `FirstName` 上建立复合索引。\n\
  \n## 唯一索引\n\n如果你要求键列（列）的值对于每行来说必须是唯一的，你可以创建一个简单索引或复合索引作为唯一索引。一旦在表的一个或多个列上定义了唯一索引，SAS\
  \ 将拒绝任何导致多行在指定列或列组上具有相同值的表表更改操作。\n\n## 示例\n\n假设你正在处理 `Sasuser.Payrollmaster` 表。该表的前八行显示所示：\n\
  \n| DateOfBirth | DateOfHire | EmpID | Gender | JobCode | Salary |\n| --- | ---\
  \ | --- | --- | --- |\n| 16SEP1958 | 07JUN1985 | 1919 | M | TA2 | $48,126 |\n| 19OCT1962\
  \ | 12AUG1988 | 1653 | F | ME2 | $49,151 |\n| 08NOV1965 | 19OCT1988 | 1400 | M |\
  \ ME1 | $41,677 |\n| 04SEP1963 | 01AUG1988 | 1350 | F | FA3 | $46,040 |\n| 19DEC1948\
  \ | 21NOV1983 | 1401 | M | TA3 | $54,351 |\n| 29APR1952 | 11JUN1978 | 1499 | M |\
  \ ME3 | $60,235 |\n| 09JUN1960 | 04OCT1988 | 1101 | M | SCP | $26,212 |\n\n\n\n\n\
  \n| 03APR1959 | 14FEB1979 | 1333 | M | PT2 | $124,048 |\n\n如果你知道列 `JobCode` 经常出现在\
  \ `WHERE` 子句表达式中，那么你可能想在 `JobCode` 列上创建一个简单索引。你必须将键列 `JobCode` 的名称指定为索引名称。现在，假设你计划编写许多查询，这些查询在\
  \ `WHERE` 子句表达式中同时指定了 `EmpID` 和 `DateOfHire`。在这种情况下，你可能想在这两个列上 true 一个复合索引。由于员工识别码应该是唯一的，因此将此索引创建为唯一索引是合适的。因此，你应该为你的索引指定一个名称，该名称不能与表中任何现有列或索引的名称相同。例如，你可以将此索引命名为\
  \ `Whenhired`。\n\n### 决定是否创建索引\n\n## 概述\n\n索引可以缩短定位一组行所需的时间，特别是大型数据文件。然而，创建、存储和维护索引是有成本的。在决定是否创建索引时，你必须权衡性能改进的收益与资源使用增加的成本。注意：本章专门讨论了与使用\
  \ `PROC SQL` 索引相关的收益和成本。要了解在其他 SAS 过程中使用索引的成本和收益，请参阅 SAS 文档。\n\n## 可通过索引优化的 PROC\
  \ SQL 查询\n\n在 `PROC SQL` 中有效使用索引，了解可以使用索引更高效地处理的查询类型至关重要。以下是可以优化的查询类型。\n\n| 当键列出现在以下位置时，查询性能会得到优化\
  \ | 示例 |\n| --- | --- |\n| 包含比较运算符、`TRIM` 或 `SUBSTR` 函数、`CONTAINS` 运算符或 `LIKE` 运算符的\
  \ `WHERE` 子句表达式。 | |\n\n```\nproc sql;\n    select empid, jobcode, salary\n    \
  \   from sasuser.payrollmaster\n       where jobcode='FA3'\n       order by empid;\n\
  ```\n键列（列）：`JobCode` |\n| 返回返回值给 `IN` 运算符的子查询中。 | |\n```\nproc sql;\n    select\
  \ empid, lastname, firstname,\n            city, state\n       from sasuser.staffmaster\n\
  \       where empid in\n          (select empid\n             from sasuser.payrollmaster\n\
  \             where salary>40000);\n```\n键列（列）：`EmpID` |\n| 关联子查询，其中与关联引用比较的列已建立索引。\
  \ | |\n```\nproc sql;\n    select lastname, firstname\n       from sasuser.staffmaster\n\
  \       where 'NA'=\n          (select jobcategory\n             from sasuser.supervisors\n\
  \             where staffmaster.empid =\n                    supervisors.empid);\n\
  ```\n键列（列）：`Supervisors.EmpID` |\n| 连接，其中连接表达式包含等号（`=`）运算符（等值连接），且连接表达式中的所有列在被连接的表中都建立了索引。\
  \ | |\n```\nproc sql;\n    select *\n       from sasuser.payrollmaster as p,\n \
  \           sasuser.staffmaster as s\n       where p.empid =\n             s.empid\n\
  \       order by jobcode;\n```\n键列（列）：`Payrollmaster.EmpID` 或 `Staffmaster.EmpID`\
  \ |\n\n## 使用索引的收益\n\n对于 `PROC SQL`，直接使用索引访问数据（而不是顺序读取数据）主要有三个收益：\n\n*   可以更快地访问一小部分数据（小于行数的\
  \ 15%）。随着子集的增大，使用索引的优势会降低。\n*   可以在不需要内部排序的情况下执行等值连接。\n*   通过创建唯一索引可以强制唯一性。\n\n\
  ## 示例：使用索引访问较小数据集\n\n假设你正在编写一个引用 `Work.Payrollmaster` 表的查询。（`Work.Payrollmaster`\
  \ 是 `Sasuser.Payrollmaster` 表的副本）。`Work.Payrollmaster` 存储员工的工资信息，并在 `JobCode` 列上定义了一个简单索引。你的查询的\
  \ `WHERE` 子句表达式引用了键列：\n\n```\nproc sql;\n   select empid, jobcode, salary\n    \
  \  from work.payrollmaster\n      where jobcode='FA3'\n      order by empid;\n```\n\
  \n如果表中大多数行的 `JobCode` 值为 `FA3`，那么使用索引不会显著提高后续查询的效率。事实上，性能可能会下降。但是，如果只有 10% 的行值为\
  \ `FA3`，则 `PROC SQL` 可以通过使用索引更高效地处理查询。注意：在本章中，如果你想提交任何引用临时表（存储在 `Work` 库中的表）的示例代码，首先需要通过复制\
  \ `Sasuser` 库中同名的表来创建临时表。\n\n## 理解使用索引的成本\n\n当你决定是否创建索引时，应该考虑相关的资源使用增加，包括：\n\n*\
  \   创建索引、在修改表时维护索引以及使用索引从表中读取行需要额外的 CPU 时间。\n*   与顺序读取表相比，使用索引从表中读取行可能需要额外的 I/O（输入/输出）请求。\n\
  *   使用索引需要额外的内存，用于加载索引页的缓冲区。\n*   存储索引文件需要额外的磁盘空间，该文件在 Windows 中显示为独立文件，在 z/OS 中可能是数据文件的一部分。\n\
  \n## 创建索引的指南\n\n为了有效使用索引，请遵循以下创建索引的指南：\n\n*   尽量减少索引数量，以减少存储和更新成本。\n*   不要为小表创建索引。小表的顺序访问更快。\n\
  *   不要对不同值非常少的列创建索引（例如，只包含 `Male` 和 `Female` 值的性别列）。\n*   对检索较小行集（即小于 15%）的查询使用索引。\n\
  *   不要对与主键相同的列创建多个索引。\n\n提示许多因素都会影响 SAS 程序的处理。确定是否为特定表或列创建索引的最准确方法是进行基准测试。\n\n###\
  \ 创建索引\n\n## 概述\n\n要在表的列或多个列上创建索引，请使用 `CREATE INDEX` 语句。\n\n| CREATE INDEX 语句的通用格式：\
  \ |\n| --- |\n| `CREATE <UNIQUE> INDEX index-name ON table-name (column-name-1<,\
  \ ...column-name-n>);` 说明：`UNIQUE` 是一个关键字，指定语句指定的列值必须是唯一的。`index-name` 指定要创建的索引名称。如果你只列列创建索引，则\
  \ `index-name` 必须与 `column-name-1` 相同。如果你对多个列创建索引，则 `index-name` 不能与表中任何现有列或索引的名称相同。`table-name`\
  \ 指定创建索引的表名。`column-name` 指定要索引的列。列可以以任何顺序指定。但是，列的顺序对于数据检索至关重要。第一个名的列是主键，第二个列是辅助键，以此类推。\
  \ |\n\n\n\n\n\n提示：创建复合索引时，指定列的顺序应与您在 `ORDER BY` 子句中指定的顺序相同。\n提示：如果您在预排序的表上创建索引，可以提高索引性能。SAS\
  \ 会对表的所有更改维护索引，无论这些更改源自 `PROC SQL` 还是其他源，只要整个表没有重新创建。如果您修改了列的定义或更新了其值，SAS 也会更新索引。然而，如果表中的键列被删除，则该列上的索引也会随之删除。\n\
  \n## 创建多个索引\n\n您不能基于同一列创建多个简单索引，也不能基于同一组列创建多个复合索引。虽然可以在同一列上同时创建简单索引和复合索引，但通常这样做并没什么优势。如果如果在某列上定义了简单索引，且该列也是复合索引中的主键，则\
  \ `PROC SQL` 在处理引用该列的查询时使用复合索引。您可以在同一张表上创建多个索引，但必须为每个想要创建的索引使用单独的 `CREATE INDEX`\
  \ 。\n\n## 示例：创建简单索引\n\n以下 `PROC SQL` 步骤使用 `CREATE INDEX` 语句在临时表 `Work.Payrollmaster`\
  \ 中基于列 `EmpID` 创建一个简单的唯一索引。（`Work.Payrollmaster` 是表 `Sasuser.Payrollmaster` 的副本。）\n\
  \n```\nproc sql;\n   create unique index EmpID\n      on work.payrollmaster(empid);\n\
  ```\n\n指定的索引名称（`EmpID`）必须与键列的名称相同。当提交此步骤时，SAS 日志将显示以下消息。\n\n上表 6.2 SAS 日志\n\n```\n\
  NOTE: Simple index EmpID has been defined.\n```\n\n## 示例：创建复合唯一索引\n\n以下 `PROC SQL`\
  \ 步骤使用 `CREATE INDEX` 语句在列 `FlightNumber` 和 `Date` 上创建复合唯一索引 `daily`：\n\n```\nproc\
  \ sql;\n   create unique index daily\n      on work.marchflights(flightnumber,date);\n\
  ```\n\n当提交此步骤时，SAS 日志将显示以下消息。\n\n表 6.3 SAS 日志\n\n```\nNOTE: Composite index daily\
  \ has been defined.\n```\n\n注意：SAS 日志中的说明信息显示的索引名称与您指定的完全一致。在本例中，索引名称 `daily` 是以小写形式指定的。在上一个示例中，索引名称\
  \ `EmpID` 是以大小写指定的。然而，索引名称使用大写或小写并不重要，因为 SAS 无论索引名称在代码中如何格式都能识别。如果键列集 `FlightNumber`\
  \ 和 `Date` 具有重复值，则不会创建索引。相反，SAS 日志将显示如下所示的消息。\n\n表 6.4 SAS 日志\n\n```\nERROR: Duplicate\
  \ values not allowed on index daily for file MARCHFLIGHTS.\n```\n\n# 显示索引规格\n\n\
  ## 概述\n\n有时您想知道现有表是否存在任何索引。为了在 SAS 日志中为一个或多个指定表定义的每个索引显示 `CREATE INDEX` 语句，可以使用\
  \ `DESCRIBE TABLE` 语句。（`DESCRIBE TABLE` 语句还会为每个指定的表向 SAS 日志写入 `CREATE TABLE` 语句。）\n\
  \n通用格式，`DESCRIBE TABLE` 语句：`DESCRIBE TABLE table-name-1<, ... table-name-n>;`\n\n\
  以下是对语法的解释：`table-name` 指定要描述的表，可以是以下之一：\n\n*   单级名称\n*   两级 libref.table 名称\n* \
  \  用单引号括起来的物理路径\n\n如果指定的表没有索引，则不会出现 `CREATE INDEX` 语句。\n\n## 示例\n\n在本章前面的部分，使用了以下代码在临时表\
  \ `Marchflights` 中对列 `FlightNumber` 和 `Date` 创建了名为 `daily` 的唯一复合索引。\n\n```\nproc\
  \ sql;\n   create unique index daily\n      on work.marchflights(flightnumber,date);\n\
  ```\n\n以下 `DESCRIBE TABLE` 语句为 `Marchflights` 表向 SAS 日志写入了一个 `CREATE INDEX` 语句（跟在\
  \ `CREATE TABLE` 语句之后）：\n\n```\nproc sql;\n   describe table marchflights;\n```\n\
  \n表 6.5 SAS 日志\n\n```\nNOTE: SQL table WORK.MARCHFLIGHTS was created like:\n\ncreate\
  \ table WORK.MARCHFLIGHTS( bufsize=8192 )\n  (\n   Date num format=DATE9\\. informat=DATE9.,\n\
  \   DepartureTime num format=TIME5\\. informat=TIME5.,\n   FlightNumber char(3),\n\
  \   Origin char(3),\n   Destination char(3),\n   Distance num,\n   Mail num,\n \
  \  Freight num,\n   Boarded num,\n   Transferred num,\n   NonRevenue num,\n   Deplaned\
  \ num,\n   PassengerCapacity num\n  );\ncreate unique index daily on WORK.MARCHFLIGHTS(FlightNumber,Date);\n\
  ```\n\n如果 `Marchflights` 表没有定义索引，则 SAS 日志中不会出现 `CREATE INDEX` 语句。\n\n## DESCRIBE\
  \ TABLE 语句的替代方案\n\n`DESCRIBE TABLE` 语句只是列出表上定义的索引信息的多种方法之一。另一种方法是查询特殊表 `Dictionary.Indexes`，它包含了对于当前\
  \ SAS 会话已知的所有表所定义的索引信息（`Dictionary.Indexes` 是 `PROC SQL` 初始化时创建的许多只读字典表之一。这些表包含当前\
  \ SAS 会话使用的或可用的 SAS 库、SAS 宏和外部文件的信息）。可以使用其他 SAS 过程（如 `PROC CONTENTS` 和 `PROC DATASETS`生成报告。\n\
  \n# 管理索引使用\n\n## 概述\n\n为了有效管理索引，了解以下内容非常重要：\n\n*   SAS 如何决定是否使用索引以及使用哪个索引\n*   如何确定\
  \ SAS 是否正在使用索引\n*   如何控制 SAS 是否使用索引，或它使用哪个索引\n\n## 理解 SAS 如何决定是否使用索引\n\n默认情况下，每当您提交包含\
  \ `WHERE` 表达式的查询（或其他 SAS 程序）时，SAS 都会决定使用索引还是读取数据文件中的所有观测值。为了做出此决定，SAS 执行以下操作：\n\n\
  1. 识别可用的一个或多个索引。\n2. 估计符合条件的行数。如果有多个索引，SAS 将选择估计返回最小行集的索引。\n3. 比较资源使用情况，以决定通过索引还是顺序读取所有观测值来满足\
  \ `WHERE` 表达式效率。\n\n接下来考虑如何发现 SAS 是否正在使用索引。\n\n## 确定 SAS 是否正在使用索引\n\n创建索引后，监控该索引是否被使用很重要。如果索引没有被使用，维护索引的成本可能大于收益，您应该考虑删除（drop）该索引。默认情况下，当在\
  \ SAS 中提交 `PROC SQL` 查询或任何程序时，SAS 日志只记录备注、警告和错误消息。为了显示附加消息（例如关于已定义并在处理程序期间索引的信息），请指定\
  \ SAS 系统选项 `MSGLEVEL=I`。您可以在 `PROC SQL` 语句之前的 `OPTIONS` 语句中指定 `MSGLEVEL=` 选项。\n\n\
  \n\n\n通常，在调试和测试时将选项 `MSGLEVEL=` 设置为 `I`，而在生产作业中将其设置为 `N`。\n\n## 示例：使用索引的查询\n\n假设你正在编写一个引用临时表\
  \ `Marchflights` 的 `PROC SQL` 查询。在本章的较早部分中，已在 `Marchflights` 表的 `FlightNumber` 和\
  \ `Date` 列上创建了一个名为 `daily` 的唯一复合索引。你的查询中的 `WHERE` 表达式指定了键列 `FlightNumber`。为了确定 `PROC\
  \ SQL` 在处理你的查询时是否使用了 `daily` 索引，你可以在查询之前指定 `MSGLEVEL=I`：\n\n```\noptions msglevel=i;\n\
  proc sql;\n   select *\n      from marchflights\n      where flightnumber='182';\n\
  ```\n\nSAS 日志中的信息显示处理过程中使用了该索引。\n\n表 6.6 SAS 日志\n\n| |\n```\nINFO: Index daily selected\
  \ for WHERE clause optimization.\n```\n |\n\n## 示例：不使用索引的查询\n\n假设你提交了另一个引用键列 `FlightNumber`\
  \ 的查询：\n\n```\nproc sql;\n   select *\n      from marchflights\n      where flightnumber\
  \ in ('182','202');\n```\n\n在此示例中，SAS 日志显示该查询没有使用索引。\n\n表 6.7 SAS 日志\n\n| |\n```\n\
  INFO: Index daily not used. Sorting into index order may help.\nINFO: Index daily\
  \ not used. Increasing bufno to 8 may help.\n```\n |\n\n注意：关于 `BUFSIZE=` 选项的更多信息，请参见使用\
  \ BUFSIZE= 选项。注意：SAS 版本 8 显示指示何时使用索引的信息性消息，但不显示指示何时未使用索引的消息。提示：由于 `OPTIONS` 语句是全局的，这些设置将一直有效，直到你修改它们或结束\
  \ SAS 会话。因此，在第二个查询或任何后续查询中，你不需要再次指定 `MSGLEVEL=I`，除非你想更改该设置或 SAS 会话结束。\n\n## 控制索引的使用\n\
  \n通常情况下，建议让 SAS 在处理 `PROC SQL` 查询（或其他 SAS 程序）时自行决定是否使用索引或使用哪种索引。然而，在某些情况下（例如测试），你可能会发现控制\
  \ SAS 使用索引是有用的。要控制索引的使用，请使用 `IDXWHERE=` 和 `IDXNAME=` SAS 数据集选项来覆盖默认设置。你可以使用这两个选项中的任意一个，但不能同时使用。与其他\
  \ SAS 数据集选项一样，你可以在 `PROC SQL` 查询的 `FROM` 子句的表名括号中指定 `IDXWHERE=` 或 `IDXNAME=` 选项。\n\
  \n## 使用 IDXWHERE= 指定 SAS 使用或不使用索引\n\n`IDXWHERE=` 选项允许你覆盖 SAS 关于是否使用索引的决定。\n\n`IDXWHERE=`\
  \ 选项的标准形式：`IDXWHERE=YES | NO;`\n\n以下是对语法的解释：\n`YES` 告诉 SAS 选择最佳索引来优化 `WHERE` 表达式，并忽略对表的顺序搜索可能更节省资源的可能性。\n\
  `NO` 告诉 SAS 忽略所有索引，通过对表的顺序搜索来满足 `WHERE` 表达式条件。\n\n注意：当你知道可用索引无法优化 `WHERE` 子句的处理时，请使用\
  \ `IDXWHERE=NO` 选项。\n\n## 示例\n\n在之前的示例中，你使用了选项 `MSGLEVEL=I` 来验证 `PROC SQL` 确实使用了索引来处理以下查询：\n\
  \n```\noptions msglevel=i;     \nproc sql;\n   select *\n      from marchflights\n\
  \      where flightnumber='182';\n```\n\n要强制 SAS 忽略索引并按顺序处理表行，请在查询中指定 `IDXWHERE=NO`：\n\
  \n```\nproc sql;\n   select *\n      from marchflights (idxwhere=no)\n      where\
  \ flightnumber='182';\n```\n\nSAS 日志中的信息显示 SAS 被强制按顺序处理数据。\n\n表 6.8 SAS 日志\n\n|\
  \ |\n```\nINFO: Data set option (IDXWHERE=NO) forced a sequential pass of the data\
  \ \nrather than use of an index for where-clause processing.\n```\n |\n\n## 使用 IDXNAME=\
  \ 指定 SAS 使用指定的索引\n\n`IDXNAME=` 选项引导 SAS 使用指定的索引，即使 SAS 原本选择不使用索引或使用不同的索引。\n\n`IDXNAME=`\
  \ 选项的标准形式：`IDXNAME=index-name;`\n\n以下是对语法的解释：\n`index-name` 指定了用于处理的索引名称。\n\n如果满足以下条件，SAS\
  \ 将使用指定的索引：\n* 指定的索引必须存在。\n* 指定的索引必须合适，其至少第一列或唯一列匹配 `WHERE` 表达式中的条件。\n\n注意：当你知道更好的索引时，请使用\
  \ `IDXNAME=` 选项，这样 SAS 就无需进行评估。\n\n## 示例\n\n在之前的示例中，在临时表 `Marchflights` 的 `FlightNumber`\
  \ 和 `Date` 列上定义了一个名为 `daily` 的复合索引。假设你通过以下 `PROC SQL` 步骤在 `Date` 列（复合索引中的次要键）上创建第二个索引，即简单索引：\n\
  \n```\nproc sql;\n   create index Date    \n      on marchflights(Date);\n```\n\n\
  接下来，你提交了以下查询：\n\n```\nproc sql;\n   select *\n      from marchflights\n      where\
  \ date='MAR2000';\n```\n\n此查询的 `WHERE` 子句引用了 `Date`。默认情况下，SAS 决定是否使用索引或使用哪种索引。你决定强制\
  \ PROC SQL 使用 `daily` 索引，因此在查询中添加了 `IDXNAME=`：\n\n```\nproc sql;\n   select *\n\
  \      from marchflights (idxname=daily)\n      where flightnumber='182';\n```\n\
  \n提交此查询后，SAS 日志中的信息显示 PROC SQL 使用了索引：\n\n表 6.9 SAS 日志\n\n| |\n```\nINFO: Index daily\
  \ selected for WHERE clause optimization.\n```\n |\n\n删除一个或多个索引，使用 `DROP INDEX`\
  \ 语句。\n\n`DROP INDEX` 语句的标准形式：`DROP INDEX index-name <,...index-name> FROM table-name;`\n\
  \n以下是对语法的解释：\n`index-name` 指定存在的索引。\n`table-name` 指定包含索引的表。`table-name` 可以是以下之一：\n\
  *   单级名称\n*   双级 libref.表名\n*   用单引号括起来的物理路径\n\n## 示例：删除复合索引\n\n以下 `PROC SQL` 步骤使用\
  \ `DROP INDEX` 语句删除 `Marchflights` 表中的复合唯一索引 `daily`。（该索引在本章较早的示例中创建。）\n\n```\n\
  proc sql;\n   drop index daily\n      from work.marchflights;\n```\n\n当提交此步骤时，SAS\
  \ 日志显示一条消息指示索引已删除。\n\n表 6.11 SAS 日志\n\n| |\n```\nNOTE: Index daily has been dropped.\n\
  ```\n |\n\n## 总结\n\n## 总结\n\n### 理解索引\n\n索引是定义在表的一个或多个列（称为键列）上的辅助文件。索引存储唯一的列值以及允许通过索引值访问表行的系统方向。当使用索引处理\
  \ `PROC SQL` 查询时，`PROC SQL` 直接访问（无需读取之前的所有行），而不是顺序访问。你可以创建两种类型的索引：\n*   简单索引（单列的索引）\n\
  *   复合索引（两个或多个列的索引）\n\n你可以将任何类型的索引定义为唯一索引，这要求键列的值对于每行都是唯一的。\n\n### 决定是否创建索引\n\n\n\
  \n\n\n在决定是否创建索引时，你必须权衡性能改进的收益与资源使用增加的成本。某些类别的 `PROC SQL` 查询可以使用索引进行优化。为了优化你的 `PROC\
  \ SQL` 查询的性能，你可以遵循一些创建索引的基本准则。\n\n### 创建索引\n要对表的一个列或多个列创建索引，请使用 `CREATE INDEX` 语句。要指定唯一索引，请添加关键字\
  \ `UNIQUE`。\n\n### 显示索引规格\n要为针对一个或多个指定表定义的每个索引在 SAS 日志（SAS log）中显示 `CREATE INDEX`\
  \ 语句，请使用 `DESCRIBE TABLE` 语句。\n\n### 管理索引使用\n为了有效管理索引，了解 SAS 如何决定是否使用索引以及使用哪个索引非常重要。要检查是否正在使用索引，请在\
  \ `PROC SQL` 语句之前的 `OPTIONS` 语句中指定 SAS 选项 `MSGLEVEL=I`。此选项允许 SAS 将有关索引使用的提示信息性消息（以及其他附加信息）写入\
  \ SAS 日志中。默认设置 `MSGLEVEL=N` 仅显示备注、警告和错误消息。要强制 SAS 使用最佳可用索引、使用特定索引或完全不使用索引，请在 `PROC\
  \ SQL` 查询中包含 SAS 数据集选项 `IDXWHERE=` 或 `IDXNAME=`。\n\n### 删除索引\n要删除（移除）一个或多个索引，请使用\
  \ `DROP INDEX` 语句。\n\n## 示例程序\n\n### 创建简单的唯一索引和复合索引\n```\nproc sql;\n   create unique\
  \ index EmpID\n      on work.payrollmaster(empid);\n   create index daily\n    \
  \  on work.marchflights(flightnumber,date);\nquit;\n```\n\n### 显示索引规格\n```\nproc\
  \ sql;\n   describe table marchflights;\nquit;\n```\n\n### 判断 SAS 是否正在使用索引\n```\n\
  options msglevel=i;\nproc sql;\n   select *\n      from marchflights\n      where\
  \ flightnumber='182';\nquit;\n```\n\n### 指导 SAS 忽略所有索引\n```\nproc sql;\n   select\
  \ *\n      from marchflights (idxwhere=no)\n      where flightnumber='182';\nquit;\n\
  ```\n\n### 指导 SAS 使用指定的索引\n```\nproc sql;\n   select *\n      from marchflights\
  \ (idxname=daily)\n      where flightnumber='182';\nquit;\n```\n\n### 删除一个索引\n```\n\
  proc sql;\n   drop index daily\n      from work.marchflights;\nquit;\n```\n\n##\
  \ 注意事项\n* 索引无法在视图（view）上创建。\n* 保持索引数量最少，以减少磁盘存储和更新成本。\n* 不要为小表创建索引；小表上的顺序访问更快。\n\
  * 不要根据具有极少数不同值（低基数）列创建索引（例如，仅包含 `Male` 和 `Female` 两个值的 `Gender` 列）。\n* 对于检索较小行子集的查询——即少于\
  \ 15% 的行——请使用索引。\n* 不要创建与主键基于同一列的多个及以上的索引。\n\n# 测验\n为每个问题选择最佳答案。完成测验后，使用附录中的答案键检查你的答案。\n\
  \n1. 下列哪项为 `Sasuser.Staffmaster` 表的 `EmpID` 列创建索引？\n    1. ```\n       proc sql;\n\
  \          create simple index(empid) \n             on sasuser.staffmaster;\n \
  \      ```\n    2. ```\n       proc sql;\n          create empid index \n      \
  \        on sasuser.staffmaster(empid);\n       ```\n    3. ```\n       proc sql;\n\
  \          create simple index \n              on empid from sasuser.staffmaster;\n\
  \       ```\n    4. ```\n       proc sql;\n          create index \n           \
  \   on sasuser.staffmaster(empid);\n       ```\n\n2. 为了确保不存在重复值，你必须在索引定义中添加哪个关键字？\n\
  \    1. `KEY`\n    2. `UNIQUE`\n    3. `NODES`\n    4. `NODUP`\n\n3. 下列哪项为 `delays`\
  \ 创建一个复合索引？（`delays` 包含以下列：`Date`、`Origin`、`Destination`、`DayOfWeek`, `Delay`）\n\
  \    1. ```\n       proc sql;\n          create index \n              on flightnumber,destination\n\
  \       ```\n    2. ```\n       proc sql;\n          create composite index \n \
  \             on flightnumber,destination\n       ```\n    3. ```\n       proc sql;\n\
  \          create index \n              on \n              flightnumber,destination\n\
  \       ```\n    4. ```\n       proc sql;\n          create index \n           \
  \   on flightnumber,destination\n       ```\n\n4. 下列哪项会在 SAS 日志中显示 `PROC SQL` 是否使用了索引？\n\
  \    1. ```\n       options msglevel=i;\n       proc sql;\n          select *\n\
  \              from internationalflights\n       ```\n    2. ```\n       options\
  \ index=yes;\n       proc sql;\n          select *\n              from internationalflights\n\
  \       ```\n    3. ```\n       proc sql;\n          select * (idxwhere=yes)\n \
  \             from internationalflights\n       ```\n    4. ```\n       proc sql;\n\
  \          select * (msglevel=i)\n              from internationalflights\n    \
  \   ```\n\n5. 下列哪项用于删除一个或多个索引？\n    1. ```\n       proc sql;\n          drop index\
  \ \n              from marchflights;\n       ```\n    2. ```\n       proc sql;\n\
  \          delete index \n              on sasuser.staffmaster(flightnumber,date);\n\
  \       ```\n    3. ```\n       proc sql;\n          drop index daily\n        \
  \      from work.marchflights;\n       ```\n    4. ```\n       proc sql;\n     \
  \     delete index \n              on marchflights;\n       ```\n\n6. 下列哪项语句显示表中定义的所有索引？\n\
  \    1. `DESCRIBE INDEX`\n    2. `DESCRIBE TABLE`\n    3. `SELECT`\n    4. `IDXNAME`\n\
  \n7. 指定数据集选项 `IDXWHERE=YES` 的目的是什么？\n    1. 它强制 SAS 使用最佳可用索引处理 `WHERE` 表达式。\n  \
  \  2. 它根据 `WHERE` 子句创建索引。\n    3. 它将有关索引使用的消息写入 SAS 日志。\n    4. 它停止 SAS 使用任何索引。\n\
  \n8. 关于使用索引，下列哪项是错误的？\n    1. 连接可以在不需要排序的情况下进行。\n    2. 索引提供了快速访问较小数据集的方法。\n   \
  \ 3. 索引只能为数值列创建。\n    4. 索引可以强制执行唯一性。\n\n9. 在何种情况下，使用索引不太可能优化 `PROC SQL` 查询？\n \
  \   1. 查询包含引用键列的 `IN` 子查询。\n    2. 键列指定在 `WHERE` 子表达式中包含比较运算符、`TRIM` 或 `SUBSTR`\
  \ 函数、`CONTAINS` 运算符或 `LIKE` 运算符。\n    3. 查询是一个等连接，且连接表达式中的所有列在被连接的表中都有索引。\n    4.\
  \ 键列仅指定在 `SELECT` 子句中。\n\n10. 关于 `IDXNAME=` 数据集选项，下列哪项是错误的？\n    1. 指定的索引必须存在。\n\
  \n\n\n\n\n2. 指定索引必须是合适的，其至少第一列或唯一列必须匹配 `WHERE` 表达式中的某个条件。\n\n3. 该选项允许你在表上创建并命名索引。\n\
  \n4. 该选项引导 SAS 使用你指定的索引。\n\n# 第 7 节：使用 PROC SQL 创建和管理视图\n\n## 概述\n\n## 引言\n\n`PROC\
  \ SQL` 视图是一个存储的查询表达式，它从其底层文件读取数据值，这些底层文件可以包括 SAS 数据文件、DATA 步视图、其他 PROC SQL 视图或 DBMS\
  \ 数据。你可以在查询中引用视图，就像引用表一样。视图的数据源于其 `FROM` 子句中列出的表或视图。视图访问的数据是其底层表（或视图）中数据的子集或超集。\n\
  \n```\nproc sql;\n   create view sasuser.raisev as\n      select empid, jobcode,\
  \ \n             salary format=dollar12.2, \n             salary/12 as MonthlySalary\n\
  \             format=dollar12.2\n         from payrollmaster;\n   select *\n   \
  \   from sasuser.raisev\n      where jobcode in ('PT2','PT3');\n```\n\n| ![来自 payrollmaster\
  \ 表的 sasuser.raisev 视图](img/m75-1-g1.png) |\n\nPROC SQL 视图\n\n* 可用于 SAS 程序代替实际 SAS\
  \ 数据文件\n* 可与表或其他视图连接\n* 可从一个或多个表、PROC SQL 视图或 DATA 步视图派生\n* 可以从 SAS 数据集、DATA 步视图、PROC\
  \ SQL 视图或关系数据库表访问数据\n* 可以提取底层数据，从而让你访问最新的数据。\n\n# 创建和使用 PROC SQL 视图\n\n## PROC SQL\
  \ 视图\n\n`PROC SQL` 视图是一个存储的查询，当你在 SAS 过程或 DATA 步中使用视图时就会执行。视图仅包含描述符以及从其他 SAS 文件（SAS\
  \ 数据文件、DATA 步视图或其它 PROC SQL 视图）或外部文件（DBMS 数据文件）检索数据值所需的其他信息。视图仅包含访问数据的逻辑，而不包含数据本身。由于\
  \ `PROC SQL` 视图不是数据的独立副本，因此它们被称为虚拟表。它们不像真实表那样作为独立实体存在。然而，视图使用与表相同的命名规范，并可以在 SAS\
  \ 程序中代替实际 SAS 表。与表一样，视图被视为 SAS 数据集。视图之所以有用是因为它们执行了以下操作：\n\n* 通常可以节省空间（与其访问的数据相比，视图通常非常小）\n\
  * 防止用户不断提交查询来忽略不需要的列或行\n* 确保输入数据集始终是最新的，因为数据是在执行时从表中派生的\n* 为用户屏蔽敏感或机密列，同时允许这些用户查看同一张表中的其他列\n\
  * 向用户隐藏复杂的连接或查询。\n\n## 创建 PROC SQL 视图\n\n你使用 `CREATE VIEW` 语句来创建视图。\n\n`CREATE VIEW`\
  \ 语句的一般：\n`CREATE VIEW proc-sql-view AS SELECT column-1<, ... column-n> FROM table-1\
  \ | view-1<, ... table-n | view-n><optional query clauses>;`\n\n以下是该语法的解释：\n\n*\
  \ `proc-sql-view` 指定你正在创建的 `PROC SQL` 视图的名称。\n* `SELECT` 指定表中出现的列（列）。\n* `FROM`\
  \ 指定要查询的表（表）或视图（视图）。\n* `optional query clauses`（可选查询子句）用于进一步完善查询，包括 `WHERE`、`GROUP\
  \ BY`、`HAVING` 和 `ORDER BY` 子句。\n\n`PROC SQL` 视图的数据源于 `FROM` 子句中列出的表或视图。视图访问的数据是其底层表（或视图）中数据的子集或超集。当在\
  \ SAS 过程或 DATA 步中引用视图时，它会被执行，并且在概念上，会构建一个内部表。`PROC SQL` 处理此内部表就像处理任何其他表一样。\n\n##\
  \ 示例\n\n以下 `PROC SQL` 步创建了一个包含空乘人员信息的视图。该视图始终返回截至当前的员工年龄。视图 `Sasuser.Faview` 根据伴随的\
  \ `SELECT` 语句创建一个虚拟表。虽然底层表 `Sasuser.Payrollmaster` 和 `Sasuser.Staffmaster` 可能会发生，但构成视图的指令保持不变。`FROM`\
  \ 子句中指定的 libref 是可选的。假设参与的表是可用的。\n\n```\nproc sql;\n   create view sasuser.faview\
  \ as\n      select lastname, firstname, gender,\n             int((today()-datebirth)/365.25)\
  \ as Age,\n             substr(jobcode,1) as Level,\n             salary\n     \
  \    from payrollmaster,\n              staffmaster\n         where jobcode = 'FA';\n\
  ```\n\n当提交此 `PROC SQL` 步时，SAS 不会实际执行 `AS` 之后的 `SELECT` 语句，而是编译并将语句存储在类型为 VIEW 的数据文件中。SAS\
  \ 日志中的消息确认视图已定义。\n\n表 7.1 SAS 日志\n\n```\n    proc sql;\n   create view sasuser.faview\
  \ as\n      select lastname, firstname, gender,\n             int((today()-datebirth)/365.25)\
  \ as Age,\n             substr(jobcode,1) as Level,\n             salary\n     \
  \    from payrollmaster,\n              staffmaster\n         where jobcode = 'FA';\n\
  NOTE: SQL view SASUSER.FAVIEW has been defined.\n```\n\n## 使用 PROC SQL 视图\n\n你可以在\
  \ `PROC SQL` 步或同一步的后期使用视图，就像使用实际 SAS 表一样。在以下示例中，`PROC SQL` 视图 `Sasuser.Faview` 用于查询。由于存储在视图中的查询根据当前日期计算空乘人员的年龄，此\
  \ `PROC SQL` 步的输出显示每个空乘人员截至当前的年龄。如果 `Sasuser.Faview` 是静态表而不是视图，显示的空乘人员年龄将永远不会改变。\n\
  \n```\nproc sql;\n   select *\n      from sasuser.faview;\n```\n\n部分输出所示![Sasuser.Faview](img/m75-4-g1.png)你可以在其他\
  \ SAS 过程和 DATA 步中使用 PROC SQL 视图。在以下示例中，`PROC TABULATE` 使用视图 `Sasuser.Faview` 按级别计算空乘人员的平均年龄：\n\
  \n```\nproc tabulate data=sasuser.faview;\n   class level; \n   var age; \n   table\
  \ level*age*mean;\nrun;\n```\n\n![按级别的空乘人员平均年龄](img/m75-4-g2.png)注意：变量 `Age` 的值取决于取决于执行代码的日期。注意：有关\
  \ `TABULATE` 过程的信息，请参阅 SAS 文档。\n\n# 显示 PROC SQL 视图的定义\n\n## 概述\n\n你可以使用 `DESCRIBE\
  \ VIEW` 语句在 SAS 日志中显示视图的定义。\n\n\n\n\n\n# 管理 PROC SQL 视图\n\n## 使用 PROC SQL 视图的准则\n\
  \n### DESCRIBE VIEW\n通用格式，`DESCRIBE VIEW` 语句：`DESCRIBE VIEW proc-sql-view-1<,...proc-sql-view-n>;`\
  \ \n以下是对语法的解释：\n`proc-sql-view` 指定一个 `PROC SQL` 视图，它可以是以下内容之一：\n* 单级名称\n* 二级名称 `libref.view`\n\
  * 用单引号括起来的物理路径名。\n\n提示：如果你在基于或派生自另一个视图的 `DESCRIBE VIEW` 语句中使用 `PROC SQL` 视图，那么你可能希望在\
  \ `PROC SQL` 语句中使用 `FEEDBACK` 选项。该选项会在 SAS 日志中显示底层视图的定义，并展开在此视图定义中使用的任何表达式。\n\n\
  ## 示例\n以下 `PROC SQL` 步骤将 `Sasuser.Faview` 的视图定义写入 SAS 日志：\n\n```\nproc sql;\n  \
  \ describe view sasuser.faview;\n```\n\n表 7.2 SAS 日志\n\n```\nNOTE: SQL view SASUSER.FAVIEW\
  \ is defined as:\n      select lastname, firstname, gender,\n             INT((TODAY()-dateofbirth)/365.25)\
  \ as Age,\n      SUBSTR(jobcode, 3, 1) as Level, salary\n      from SASUSER.PAYROLLMASTER,\
  \ SASUSER.STAFFMASTER\n      where jobcode contains 'FA' and\n            (staffmaster.empid=payrollmaster.empid);\n\
  ```\n\n## 省略 Libref\n`FROM` 子句中表或多个表的默认 `libref` 是包含该视图的库的 `libref`。在 `FROM` 子句中使用单级名称，可以避免在您为包含该视图及其贡献表的\
  \ SAS 库分配不同的 `libref` 时，仍必须更改视图的麻烦。\n\n以下 `PROC SQL` 步骤创建了视图 `Sasuser.Payrollv`。`FROM`\
  \ 子句为贡献表 `Sasuser.Payrollmaster` 指定了二级名称。然而，没有必要指定 `libref` `Sasuser`，因为假设贡献表存储在与视图相同的库中。\n\
  \n```\nproc sql;\n   create view sasuser.payrollv as\n      select *\n         from\
  \ sasuser.payrollmaster;\n```\n\n当 `FROM` 子句中使用单级名称 `Payrollmaster` 时，实际上指定的是 `Sasuser.Payrollmaster`，尽管看起来像是指定了\
  \ `Work.Payrollmaster`。\n\n```\nproc sql;\n   create view sasuser.payrollv as\n\
  \      select *\n         from payrollmaster;\n```\n\n注意：如果您创建的视图与 `FROM` 子句中引用的表存储在不同的库中，则必须为该表（们）指定二级名称。\n\
  \n## 使用嵌入式 LIBNAME 语句\n作为在 `FROM` 子句中省略 `libref` 的替代方案，您可以在 `USING` 子句中嵌入 `LIBNAME`\
  \ 语句，以在视图中存储 SAS `libref`。嵌入 `LIBNAME` 语句是一种更具灵活的方法，因为：\n* 无论视图表和底层表是否位于同一个库中，都可以使用。\n\
  * 它避免了如果 `FROM` 子句中的表名中省略 `libref` 可能产生的混淆。\n\n嵌入式 `LIBNAME` 语句只能用于 `PROC SQL` 视图。使用嵌入式\
  \ `LIBNAME` 语句创建的 `libref` 不与 SAS 会话中同名的 `libref` 冲突。\n\n通用格式，`USING` 子句：`USING\
  \ libname-clause-1<,... libname-clause-n>;`\n以下是对语法的解释：`libname-clause` 是以下内容之一：\n\
  * 有效的 `LIBNAME` 语句\n* 有效的 SAS/ACCESS `LIBNAME` 语句。\n\n注意：`USING` 子句必须是 `CREATE VIEW`\
  \ 语句的最后一个子句。\n\n## 示例\n在以下示例中，当视图 `Sasuser.Payrollv` 在 `PROC PRINT` 步骤中执行时，`libref`\
  \ `Airline` 在 `USING` 子句中动态赋值。\n\n```\nproc sql;\n   create view sasuser.payrollv\
  \ as\n      select*\n         from airline.payrollmaster\n         using libname\
  \ airline 'SAS-library-one';\nquit;\nproc print data=sasuser.payrollv;\nrun;\n```\n\
  \n如果之前存在 `libref` `AIRLINE` 的赋值，`EMBEDDED LIBNAME` 语句视图执行期间覆盖该赋值。视图执行后，原始的 `libref`\
  \ 赋值将恢复，嵌入式赋值将被清除。\n\n## 创建视图以增强表安全性\n`PROC SQL` 视图的一个优势是它们可以从不同的来源汇总数据。这使得视图可以用于向某些用户屏蔽敏感或机密列，同时允许这些用户查看同一张表中的其他列。\n\
  \n注意：虽然可以使用 `PROC SQL` 视图来增强表安全性，但强烈建议您使用操作系统环境中提供的安全功能。\n\n## 示例\n以下 `PROC SQL`\
  \ 步骤创建了视图 `Manager.Infoview`。该视图访问存储在三个库（`Fa1`、`Fa2` 和 `Fa3`）中的空乘人员数据。可以分配访问权限，以防止：\n\
  * 1 级空乘人员读取存储在 `Fa2` 和 `Fa3` 中的数据\n* 2 级空乘人员读取存储在 `Fa1` 和 `Fa3` 中的数据\n* 3 级空乘人员读取存储在\
  \ `Fa1` 和 `Fa2` 中的数据\n\n还可以分配访问权限，允许允许访问所有库的经理查看所有信息。\n\n```\nproc sql;\n   create\
  \ view manager.infoview as\n      select *\n         from fa1.info\n      outer\
  \ union corr\n      select *\n         from fa2.info\n      outer union corr\n \
  \     select *\n         from fa3.info;\n```\n\n# 更新 PROC SQL 视图\n\n## 概述\n您可以在以下条件下使用\
  \ `INSERT`、`DELETE` 和 `UPDATE` 语句更新 `PROC SQL` 视图的底层数据：\n* 您只能通过视图更新单个表。表不能与其他表连接，也不能包含子查询。\n\
  * 您可以使用别名更新列，但不能更新派生列（通过表达式产生的列）。\n* 您可以更新包含 `WHERE` 子句的视图。`WHERE` 子句可以在 `UPDATE`\
  \ 子句中指定，也可以在视图中指定。您不能更新包含其他子句（如 `ORDER BY` 或 `HAVING`）的视图。\n* 您不能更新汇总视图（包含 `GROUP\
  \ BY` 子句的视图）。\n\n更新视图不会更改存储的视图指令。只有底层表的数据会被更新。\n\n## 示例\n以下 `PROC SQL` 步骤创建了视图 `Sasuser.Raisev`，它包含\
  \ `Salary` 和 `MonthlySalary` 列。随后的引用该视图的查询将显示这些列。\n\n```\nproc sql;\n   create view\
  \ sasuser.raisev as\n      select empid, jobcode, \n             salary format=dollar12.,\
  \ \n             salary/12 as MonthlySalary\n             format=dollar12.\n   \
  \      from payrollmaster;\n\nproc sql;\n   select *\n      from sasuser.raisev\n\
  \      where jobcode in ('PT2','PT3');\n```\n\n\n\n\n\n假设你想更新视图，以显示工作代码为 `PT3` 的员工薪资增加。你可以使用\
  \ `UPDATE` 语句来更改 `Salary` 列，并在 `UPDATE` 子句中使用 `WHERE` 子句来识别 `JobCode` 值等于 `PT3`\
  \ 的行。虽然 `MonthlySalary` 是派生列，无法使用 `UPDATE` 语句进行更改，但因为它派生自 `Salary`，所以它也会被更新。当提交\
  \ `PROC SQL` 步骤时，SAS 日志中会出现一条注释，指示更新了多少行数据：\n\n```\nproc sql;\n   update sasuser.raisev\n\
  \      set salary=salary * 1.20 \n      where jobcode='PT3';\n```\n\n表 7.3 SAS 日志\n\
  \n| |\n| :--- |\n| ```\n116   proc sql;\n117      update sasuser.raisev\n118   \
  \      set salary=salary * 1.20\n119         where jobcode='PT3';\nNOTE: 2 rows\
  \ were updated in SASUSER.RAISEV.\n``` |\n\n注意：记住，更新是在视图 `Sasuser.Raisev` 的底层表中进行的。当你重新提交查询时，`JobCode`\
  \ 等于 `PT3` 的行中将出现 `Salary` 和 `MonthlySalary` 的更新值：\n\n| |\n| :--- |\n| ```\nproc\
  \ sql;\n   select *\n      from sasuser.raisev\n      where jobcode in ('PT2','PT3');\n\
  ``` | ![带有更新值的 Sasuser.Raisev 视图](img/m75-14-g2.png) |\n\n# 删除 PROC SQL 视图\n\n##\
  \ 概述\n\n要删除视图，请使用 `DROP VIEW` 语句。\n\n`DROP VIEW` 语句的一般形式：`DROP VIEW view-name-1\
  \ <,...view-name-n>;`\n以下是对该语法的解释：`view-name` 指定任意类型的 SAS 数据视图（`PROC SQL` 视图或 `DATA`\
  \ 步骤视图），并可以是以下内容之一：\n\n* 单级名称\n* 二级库引用（libref）和视图名\n* 用单引号括起来的物理路径名。\n\n## 示例\n\n\
  以下 `PROC SQL` 步骤删除了视图 `Sasuser.Raisev`。提交步骤后，SAS 日志中会出现一条消息，确认视图已删除。\n\n```\nproc\
  \ sql;\n   drop view sasuser.raisev;\n```\n\n表 7.4 SAS 日志\n\n| |\n| :--- |\n| ```\n\
  21   proc sql;\n22      drop view sasuser.raisev;\nNOTE: View SASUSER.RAISEV has\
  \ been dropped.\n``` |\n\n## 总结\n\n## 文本总结\n\n### 使用 PROC SQL 视图\n\n`PROC SQL` 视图是一个存储的查询，当你在\
  \ SAS 过程或 `DATA` 步骤中使用该视图时会执行它。视图仅包含描述符以及从其他 SAS 文件（SAS 数据文件、`DATA` 步骤视图或其他 `PROC\
  \ SQL` 视图）或外部文件（DBMS 数据文件）检索数据值所需的其他信息。在执行时，`PROC SQL` 视图的输出可以是一个或多个底层文件的子集或超集。视图不包含数据，但描述或定义了存储在其他处的数据。`PROC\
  \ SQL` 视图：\n\n* 可以在 SAS 程序中代替实际的 SAS 数据文件\n* 可以与表或其他视图进行连接\n* 可以派自一个或多个表、`PROC SQL`\
  \ 视图、`DATA` 步骤视图或 SAS/ACCESS 视图。\n* 提取底层数据，使你能够访问最新数据。\n\n由于 `PROC SQL` 视图不是数据的独立副本，因此它们被称为虚拟表。它们不像真实表那样作为独立实体存在。然而，视图使用了与表相同的命名约定，并可以在\
  \ SAS 程序中代替实际的 SAS 表。与表一样，视图被视为 SAS 数据集。\n\n### 创建 SQL 视图\n\n你使用 `CREATE VIEW` 语句来创建视图。`PROC\
  \ SQL` 视图的数据派自 `FROM` 子句中列出的表或视图。视图访问的数据是其底层表（或）或视图（或）中数据的子集或超集。当在 SAS 过程或 `DATA`\
  \ 步骤中引用视图时，它会被执行，从概念上讲，会构建一个内部表。`PROC SQL` 处理此内部表的方式就像处理任何其他表一样。在随后的 `PROC SQL`\
  \ 步骤中，可以像使用实际的 SAS 表一样使用视图。\n\n### 显示 PROC SQL 视图的定义\n\n你可以使用 `DESCRIBE VIEW` 语句在\
  \ SAS 日志中显示视图的定义。\n\n### 管理 PROC SQL 视图\n\n`FROM` 子句中表或多个表的默认库引用（libref）是包含视图的库的库引用。使用单级名称可以避免在你为包含视图及其组成表的\
  \ SAS 库分配不同的库引用时必须更改视图。作为在 `FROM` 子句中省略库引用的更灵活的替代方案，如果你想在视图中存储 SAS 库引用，可以在使用句的 `USING`\
  \ 子句中嵌入 `LIBNAME` 语句。在 `USING` 子句中嵌入 `LIBNAME` 语句不会与 SAS 会话中同名的库引用发生冲突。`PROC SQL`\
  \ 视图的一个优势是它们可以从不同的来源汇集数据。这使得视图可以用于防止某些用户访问某些敏感或机密列，同时允许这些用户查看同一张表中的其他列。尽管 `PROC\
  \ SQL` 视图可以增强数据安全，但建议你使用操作环境中提供的安全功能来维护数据安全。\n\n### 更新 PROC SQL 视图\n\n在满足以下条件下，可以使用\
  \ `INSERT`、`DELETE` 和 `UPDATE` 语句更新视图的底层数据：\n\n* 只能通过视图更新单个表。表不能与其他表连接，也不能包含子查询。\n\
  * 可以表达式更新列，但不能更新派生列。\n* 可以更新包含 `WHERE` 子句的视图。`WHERE` 子句可以在 `UPDATE` 子句中。\n* 不能更新汇总视图（包含\
  \ `GROUP BY` 子句的视图）。\n\n## 示例程序\n\n### 删除 PROC SQL 视图\n\n要删除视图，请使用 `DROP VIEW` 语句。\n\
  \n### 创建 PROC SQL 视图\n\n```\nproc sql;\n   create view sasuser.raisev as\n     \
  \ select empid, jobcode, \n             salary format=12., \n             salary/12\
  \ as MonthlySalary\n             format=12.\n         from payrollmaster\n     \
  \    using libname 'c:\\data';\nquit;\n```\n\n### 显示 PROC SQL 视图的定义\n\n```\nproc\
  \ sql;        \n   describe view sasuser.raisev;\nquit;\n```\n\n### 在查询中使用 PROC\
  \ SQL 视图\n\n```\nproc sql;\n   select *\n      from sasuser.raisev\n      where\
  \ jobcode in ('PT2','PT3');\nquit;\n```\n\n### 更新 PROC SQL 视图\n\n```\nproc sql;\n\
  \   update sasuser.raisev\n      set salary=salary * 1.20 \n      where jobcode='PT3';\n\
  quit\n```\n\n### 删除 PROC SQL 视图\n\n```\nproc sql;\n   drop view sasuser.raisev;\n\
  quit;\n```\n\n# 测验\n\n为每个问题选择最佳答案。完成测验后，使用附录中的答案对照检查你的答案。\n\n1. 关于 `PROC SQL` 视图，哪个陈述是错误的？\n\
  \n    1. 视图不能与其他表进行连接。\n    2. 视图访问最新的底层数据。\n    3. 视图遵循与表相同的命名约定。\n    4. 视图可以在\
  \ SAS 程序中代替实际的 SAS 数据文件。\n\n\n\n\n\n## 2. 下述哪个语句描述了使用 PROC SQL 视图的优点？\n\n1. 视图通常可以节省空间，因为与其访问的数据相比，视图通常非常小。\n\
  2. 视图可以防止用户不断提交查询来忽略不需要的列或行。\n3. 视图可以向用户隐藏复杂的连接或查询。\n4. 以上所有。\n\n## 3. 下述哪一个 `PROC\
  \ SQL` 步骤创建了一个查询表 `Sasuser.Payrollmaster` 的视图？\n\n1. ```sql\nproc sql;\n   insert\
  \ into sasuser.newview\n      select * from sasuser.payrollmaster;\n```\n2. ```sql\n\
  proc sql;\n   create sasuser.newview as\n      select * from sasuser.payrollmaster;\n\
  ```\n3. ```sql\nproc sql;\n   create view sasuser.newview as\n      select * from\
  \ sasuser.payrollmaster;\n```\n4. ```sql\nproc sql;\n   select * from sasuser.payrollmaster\n\
  \      into view sasuser.newview;\n```\n\n## 4. 下述哪一个 `PROC SQL` 步骤允许你查看视图定义的描述？\n\
  \n1. ```sql\nproc sql;\n   select * from sasuser.payrollmasterv;\n```\n2. ```sql\n\
  proc sql;\n   describe view sasuser.payrollmasterv;\n```\n3. ```sql\nproc sql;\n\
  \   list sasuser.payrollmasterv;\n```\n4. ```sql\nproc sql;\n   contents view=sasuser.payrollmasterv;\n\
  ```\n\n## 5. 下述哪一个 `PROC SQL` 步骤正确引用了视图 `Data.Empview`？\n\n1. ```sql\nproc sql;\n\
  \   select *\n      from data.empview;\n```\n2. ```sql\nproc sql; \n   select *\
  \ \n      from view data.empview;\n```\n3. ```sql\nproc sql; \n   select view *\
  \ \n      from data.empview;\n```\n4. ```sql\nproc sql; \n   select * \n      from\
  \ data\n      where view='empview';\n```\n\n## 6. 下述哪一个 `PROC SQL` 步骤正确地将 `LIBNAME`\
  \ 语句嵌入到视图定义中？\n\n1. ```sql\nproc sql;\n   insert into sasuser.newview\n      select\
  \ * from airline.supervisors\n         libname airline 'c:\\mysql';\n```\n2. ```sql\n\
  proc sql;\n   create view sasuser.newview as\n      from airline.supervisors\n \
  \        embed libname airline 'c:\\mysql';\n```\n3. ```sql\nproc sql;\n   using\
  \ airline 'c:\\mysql';\n      insert into sasuser.newview\n         select * from\
  \ airline.supervisors;\n```\n4. ```sql\nproc sql;\n   create view sasuser.newview\
  \ as\n      select * from airline.supervisors\n         using libname airline 'c:\\\
  mysql';\n```\n\n## 7. `PROC SQL` 视图可以访问来自以下的数据：\n\n1. SAS 数据文件。\n2. 另一个 `PROC SQL`\
  \ 视图。\n3. 关系数据库表。\n4. 以上所有。\n\n## 8. 当你使用 `PROC SQL` 视图时，最好是：\n\n1. 避免在视图中使用 `ORDER\
  \ BY` 子句。\n2. 避免创建基于结构可能发生变化的表的视图。\n3. 如果视图与贡献表位于同一个 SAS 库中，请在 `FROM` 子句中指定单级名称。\n\
  4. 以上所有。\n\n## 9. 在下列条件下，你可以使用 `INSERT`、`DELETE` 和 `UPDATE` 语句更新 `PROC SQL` 视图的底层数据：\n\
  \n1. 视图与另一个表连接或链接。\n2. 视图包含子查询。\n3. 视图包含 `WHERE` 子句。\n4. 以上所有。\n\n## 10. 下述哪个程序删除了（drops）一个视图？\n\
  \n1. ```sql\nproc sql;\n   delete sasuser.newview;\n```\n2. ```sql\nproc sql;\n\
  \   drop view sasuser.newview;\n```\n3. ```sql\nproc sql;\n   erase view sasuser.newview;\n\
  ```\n4. ```sql\nproc sql;\n   remove newview from sasuser;\n```\n\n# 第 8 章：使用 PROC\
  \ SQL 管理处理\n\n- 概述\n- 指定 SQL 选项\n- 控制执行\n- 控制输出\n- 测试和评估性能\n- 重置选项\n- 使用字典表\n- 其他功能\n\
  - 总结\n- 测验\n\n## 概述\n\n## 引言\n`SQL` 过程提供了多种控制处理的选项。某些选项控制执行。例如，你可以限制行数。其他选项控制输出。例如，你可以控制列的显示。选项也用于测试。元数据存储在字典表中，字典是关于\
  \ SAS 库、数据集和外部文件的只读 SAS 表。字典表包含设置。\n\n# 指定 SQL 选项\n记住 `PROC SQL` 选项是在 `proc sql`\
  \ 语句中指定的。\n\n通用形式，`proc sql <option(s)>;` 这里的语法 `option(s)` 指定要使用的 `option(s)`。\n\
  \n> 在指定一个选项后，它将一直生效，直到你更改它或重新调用 `PROC SQL`。下表列出了本章涵盖的控制处理选项。每个选项的完整描述出现在后续。\n\n\
  ### 表 8.1 控制执行的选项\n| 执行操作 | 使用此选项... |\n| --- | --- |\n| 限制输入行数 | `INOBS=` |\n|\
  \ 限制输出行数 | `OUTOBS=` |\n\n### 表 8.2 控制输出的选项\n| 执行操作 | 使用此选项... |\n| --- | --- |\n\
  | 输出双倍行距 | `DOUBLE` 或 `NODOUBLE` |\n| 列内字符换行 | `FLOW`、`NOFLOW` 或 `FLOW=n` |\n\n\
  ### 表 8.3 测试和评估性能的选项\n| 执行操作 | 使用此选项... |\n| --- | --- |\n| 指定 `PROC SQL` 将每个语句的时间信息写入\
  \ SAS 日志 | `STIMER`, `NOSTIMER` |\n\n注意：完整的选项列表请参阅 SQL 过程文档。\n\n# 控制执行\n\n### 限制行处理\n\
  针对大表开发查询时，可以通过减少 `PROC SQL` 处理的行数来缩短查询运行时间。使用 `WHERE` 子句划分表集是一种方法。在 `PROC SQL` 中\
  \ `INOBS=` 和 `OUTOBS=` 选项是另一种方法。你已经知道可以使用 `OUTOBS=` 选项限制 `PROC SQL` 显示或写入到表的行数。然而，`OUTOBS=`\
  \ 选项并不限制读取的行。`INOBS=` 选项限制了 `PROC SQL` 从任何单一源输入的行数。`INOBS=` 选项类似于 SAS 系统选项 `OBS=`，适用于调试大表查询。](p184saqukbcv03n1cd6lhu2v2ias.htm)\n\
  \n\n\n\n\n在接下来的 `PROC SQL` 操作中，指定了 `INOBS=5`。正如日志所示，每个源表 `Sasuser.Mechanicslevel1`\
  \ 和 `Sasuser.Mechanicslevel2` 仅使用了前五行。生成的表包含 10 行。\n\n```\nproc sql inobs=5;\n \
  \  select *\n      from sasuser.mechanicslevel1\n   outer union corr\n   select\
  \ *\n      from sasuser.mechanicslevel2;\n```\n\n表 8.4 SAS 日志\n\n|     \n\n```\n\
  183   proc sql inobs=5;\n184     select *\n185        from sasuser.mechanicslevel1\n\
  186     outer union corr\n187     select *\n188        from sasuser.mechanicslevel2;\n\
  \nWARNING: Only 5 records were read from SASUSER.MECHANICSLEVEL1\n         due to\
  \ INOBS= option.\nWARNING: Only 5 records were read from SASUSER.MECHANICSLEVEL2\n\
  \         due to INOBS= option.\n```\n\n |\n\n![sas log](img/m76-3-g1.png)提示：你可以将\
  \ `PROMPT | NOPROMPT` 选项与 `INOBS=` 和 `OUTOBS=` 选项配合使用，以便在达到这些选项设置的限制时提示停止或继续处理。注意：关于\
  \ PROC SQL 设置 操作的更多信息，请参考使用 PROC SQL 垂直合并表。警告：在简单查询中，使用 `INOBS=` 或 `OUTOBS=` 可能没有明显区别。其他时候，选择正确的选项非常重要。例如，对带有\
  \ `PROC SQL` 选项 `INOBS=10` 的列使用平均函数，返回的是该列读取的 10 个值的平均值。\n\n# 控制输出\n\n## 包含行号列\n\
  \n`NUMBER | NONUMBER` 选项指定查询输出是否包含一个名为 `ROW` 的列，该列显示行号。`NONUMBER` 是默认值。该选项类似于 `PRINT`\
  \ 过程中的 `NOOBS` 选项。\n\n## 示例\n\n以下 `PROC SQL` 步骤指定了 `NUMBER` 选项。该步骤的输出包含一个名为 `Row`\
  \ 的列，其中包含行号。\n\n|     \n\n```\nproc sql inobs=10 number;\n   select flightnumber,\
  \ destination \n      from sasuser.internationalflights;\n```\n\n | ![PROC SQL Output\
  \ with Number Option](img/m76-7-g1.png) |\n\n## 双倍间距输出\n\n在某些情况下，将输出双倍间距可以更容易阅读。`DOUBLE\
  \ | NODOUBLE` 选项指定 `PROC SQL` 输出是否为双倍间距。默认是 `NODOUBLE`。注意：`DOUBLE | NODOUBLE` 选项不影响\
  \ HTML、PDF 或 RTF 输出的外。要查看此选项的效果，请在 SAS Enterprise Guide 中选择文本。\n\n## 示例\n\n以下 `PROC\
  \ SQL` 步骤指定了 `DOUBLE` 选项。该步骤的列表输出为双倍间距。该步骤的 HTML 输出保持为单倍间距。\n\n```\nproc sql inobs=10\
  \ double; \n   select flightnumber, destination \n      from sasuser.internationalflights;\n\
  ```\n\n图 8.1 列表输出![Listing Output](img/m76-8-g2.png)图 8.2 HTML 输出![HTML Output](img/m76-8-g1.png)\n\
  \n## 列内字符流\n\n`FLOW | NOFLOW | FLOW=n | FLOW=n m` 选项控制列表输出中宽字符列的外观。`FLOW` 选项导致文本在列内流，而不是换行整行。指定\
  \ `n` 可设置流式列的宽度。指定 `n` 和 `m` 则让列宽在限制之间浮动，以实现平衡布局。注意：`FLOW | NOFLOW | FLOW=n | FLOW=nm`\
  \ 选项不影响 HTML、PDF 或 RTF 输出的外。要查看此选项的效果，请在 SAS Enterprise Guide 中选择文本输出。\n\n## 示例\n\
  \n以下 `PROC SQL` 步骤未指定 `FLOW` 选项。注意在输出中，由于宽字符列的存在，`ZipCode` 列的名称和值出现在 `FFID` 列的名称和值下方。\n\
  \n```\nproc sql inobs=5;\n   select ffid, membertype, name, address, city, \n  \
  \        state, zipcode\n      from sasuser.frequentflyers\n      order by pointsused;\n\
  ```\n\n图 8.3 未使用 FLOW 选项 PROC SQL 步骤输出![Output from PROC SQL Step without FLOW Option](img/m76-9-g1.png)指定\
  \ `flow=10 15` 会导致字符列内的文本在 10 到 15 个空格之间浮动，防止 `ZipCode` 列换行到 `FFID` 列下方。\n\n```\n\
  \ proc sql inobs=5 flow=10 15;\n    select ffid, membertype, name, address, city,\
  \ \n           state, zipcode\n       from sasuser.frequentflyers\n       order\
  \ by pointsused;\n```\n\n图 8.4 使用 FLOW 选项 PROC SQL 步骤输出![Output from PROC SQL Step\
  \ with FLOW Option](img/m76-9-g2.png)\n\n# 测试和评估性能\n\n## 为每个语句编写计时信息\n\n`PROC SQL`\
  \ 选项 `STIMER | NOSTIMER` 指定 `PROC SQL` 是否将每条语句的计时信息写入 SAS 日志，而不是写入整个过程的累积值。`NOSTIMER`\
  \ 是默认值。为了在 `PROC SQL` 中使用 `STIMER` 选项，必须启用 SAS 系统选项 `STIMER`（默认）。某些主机环境要求你指定 SAS\
  \ 系统选项。`STIMER` 控制 SAS 日志中性能统计信息的打印。如果你仅使用系统选项，结果将包含整个过程的计时信息。你可以使用 `OPTIONS` 过程列出\
  \ SAS 的当前设置。要检查是否已启用 `STIMER` 选项，请提交以下语句：\n\n表 8.5 SAS 日志\n\n|    \n\n```\nOption\
  \ Value Information For SAS Option STIMER\n    Option Value: STIMER\n    Option\
  \ Scope: SAS Session\n    How option set: Shipped Default\n```\n\n注意：PROC OPTIONS\
  \ 会产生特定于你运行 SAS 的操作环境的额外信息。有关此的更多信息以及主机特定选项的说明，请参阅 文档。\n\n## 示例\n\n以下 `PROC SQL`\
  \ 步骤中的两个查询都列出了 `Sasuser.Frequenters` 表中客户的名称、地址、城市、州和邮政编码。然而，第二个查询仅列出了积分超过 7000\
  \ 且少于 3000 的客户信息。当提交 `PROC SQL` 语句且没有 `STIMER` 选项时，两个查询的计时信息将作为整个过程的累积值写入 SAS 日志。\n\
  \n```\nproc sql;        \n   select name, address, city, state, zipcode \n     \
  \ from sasuser.frequentflyers;\n   select name, address, city, state, zipcode \n\
  \      from sasuser.frequentflyers  \n      where pointarned gt 7000 and pointsused\
  \ lt 3000;\nquit;\n```\n\n注意：PROC SQL 步骤的计时信息在提交 `QUIT` 语句或开始另一个 `PROC` 或 `DATA`\
  \ 步骤之前写入 SAS 日志。\n\n表 8.6 SAS 日志\n\n|     \n\n```\n28   proc sql;\n29   select name,\
  \ address, city, state, zipcode\n30       from sasuser.frequentflyers;\n31   select\
  \ name, address, city, state, zipcode\n32       from sasuser.frequentflyers\n33\
  \     where pointsearned gt 7000 and pointsused lt 3000;\n34   quit;\nNOTE: PROCEDURE\
  \ SQL used (Total process time):\n      real time 0.34 seconds \n      cpu time\
  \ 0.30 seconds\n```\n\n |\n\n当提交带有 `STIMER` 选项的 `PROC SQL` 语句时，计时信息将为每条 `SELECT`\
  \ 语句写入 SAS 日志。\n\n```\nproc sql stimer;        \n   select name, address, city,\
  \ state, zipcode \n      from sasuser.frequentflyers;\n   select name, address,\
  \ city, state, zipcode \n      from sasuser.frequentflyers  \n      where pointsearned\
  \ gt 7000 and pointsused lt 3000;\nquit;\n```\n\n表 8.7 SAS 日志\n\n|  \n\n\n\n\n\n\
  ```\n33   proc sql stimer;\nNOTE: SQL Statement used (Total process time):  \n \
  \     real time           0.00 seconds  \n      cpu time            0.00 seconds\n\
  \n34 select name, address, city, state, zipcode \n     from sasuser.frequentflyers;\n\
  NOTE: SQL Statement used (Total process time):\n      real time 0.22 seconds \n\
  \      cpu time 0.17 seconds\n\n35 select name, address, city, state, zipcode\n\
  \     from sasuser.frequentflyers\n36   where pointsearned gt 7000 and pointsused\
  \ lt 3000;\nNOTE: SQL Statement used (Total process time):  \n      real time 0.25\
  \ seconds\n      cpu time 0.08 seconds\n\n37 quit;\nNOTE: PROCEDURE SQL used (Total\
  \ process time): \n      real time 0.29 seconds  \n      cpu time 0.03 seconds\n\
  ```\n\n注意：当在 `PROC SQL` 中使用 `STIMER` 时，写入 SAS 日志的注释（Notes）的确切措辞可能会根据 SAS 版本的不同而变化。注意：当某个操作可以通过多种方式完成且你正在对这些技术进行基准测试时，`PROC\
  \ SQL` 中的 `STIMER` 选项非常有用。尽管需要考虑代码的可读性和维护性，你可能也想知道哪个 `PROC SQL` 步骤运行最快。\n\n# 重置选项\n\
  \n## 概述\n\n在指定一个选项后，它将一直有效，直到你更改它或重新调用 `PROC SQL`。你可以使用 `RESET` 语句添加、删除或更改 `PROC\
  \ SQL` 选项，而无需重新调用 SQL 过程。\n\n| 通用格式，`RESET` 语句：`RESET <option(s)>;` 以下是对语法的解释：`option(s)`\
  \ 以任意顺序列出选项。 |\n\n选项是累加的。例如，你可以在 `PROC SQL` 语句中指定 `NOPRINT` 选项，提交查询，然后提交带有 `NUMBER`\
  \ 选项的 `RESET` 语句，而不会影响 `NOPRINT` 选项。\n\n## 示例\n\n假设你想在一个 `PROC SQL` 步骤中提交两个 `PROC\
  \ SQL` 查询。你希望\n\n* 两个查询都只输出前五行\n* 第二个查询在输出中显示行号\n\n在接下来的 `PROC SQL` 步骤中，`PROC SQL`\
  \ 语句指定了 `OUTOBS=` 选项来限制输出的行数。在第一个 `SELECT` 语句之后，`RESET` 语句添加了 `NUMBER` 选项在结果集中显示行号。\n\
  \n```\nproc sql outobs=5;\n   select flightnumber, destination \n      from sasuser.internationalflights;\n\
  reset number;\n   select flightnumber, destination \n      from sasuser.internationalflights\n\
  \      where boarded gt 200;\n```\n\n输出包含两个结果集，如下所示。第一个 `SELECT` 语句的结果集仅反映了 `OUTOBS=`\
  \ 选项的影响。第二个 `SELECT` 语句的结果集则反映了 `OUTOBS=` 选项和 `RESET` 语句中指定的 `NUMBER` 选项。\n\n| ![使用\
  \ OUTOBS= 选项的 PROC SQL 输出](img/m76-16-g1.png) | ![使用 OUTOBS= 和 NUMBER 选项的 PROC SQL\
  \ 输出](img/m76-16-g2.png) |\n\n现在，假设你想修改 `PROC SQL` 步骤，使得仅第一个 `SELECT` 语句的结果集限制为五行输出。在修改后的\
  \ `PROC SQL` 步骤中，`RESET` 语句添加了 `OUTOBS=` 选项，以更改（重置）`PROC SQL` 语句指定的 `OUTOBS=` 选项。修改后的步骤如下：\n\
  \n```\n proc sql outobs=5;\n    select flightnumber, destination \n       from sasuser.internationalflights;\n\
  \ reset outobs= number;\n    select flightnumber, destination \n       from sasuser.internationalflights\n\
  \       where boarded gt 200;\n```\n\n在输出中，第二个 `SELECT` 语句的结果集现在包含了查询生成的所有行。\n\n\
  | ![带有 OUTOBS=5 的 PROC SQL](img/m76-16-g3.png) | ![重置 OUTOBS= 的 PROC SQL](img/m76-16-g4.png)\
  \ |\n\n# 使用字典表\n\n## 概述\n\n字典表（Dictionary tables）通常用于监控和管理 SAS 会话，因为 own 数据比来自 `PROC\
  \ DATASETS` 等过程的输出更容易处理。字典表是特殊的只读 SAS 表，包含有关当前 SAS 会话正在使用或可用的 SAS 库、SAS 宏和外部文件的信息。字典表还包含当前生效的\
  \ SAS 系统选项以及 SAS 标题（titles）和脚注（footnotes）。例如，`Dictionary.Columns` 表包含有关当前 SAS 会话已知的所有表中所有列的信息（如名称、类型、长度和格式）。字典表具有以下特点：\n\
  \n* 每次在 SAS 程序中被引用时都会创建\n* 自动更新\n* 仅限只读\n\n访问字典表会导致 SAS 确定 SAS 会话的当前状态并返回你需要的信息。可以通过针对\
  \ `Dictionary` 库引用（libref）运行 `PROC SQL` 查询来访问字典表。虽然 SAS 库引用通常限于 8 个字符，但 `Dictionary`\
  \ 是一个自动分配的保留字。你也可以通过引用 `PROC SQL` 视图来访问字典表，该视图存储在 `Sashelp` 库中。下表描述了部分字典表及其对应的视图。要查看完整的字典表列表，请参阅\
  \ SQL 过程文档。\n\n| 字典表 | Sashelp 视图 | 包含 |\n| --- | --- | --- |\n| Catalogs | Vcatalg\
  \ | 目录项信息 |\n| Columns | Vcolumn | 变量详细信息 |\n| Extfiles | Vextfl | 当前分配的文件引用 |\n\
  | Indexes | Vindex | 数据索引信息 |\n| Macros | Vmacro | 用户和系统定义的宏变量 |\n| Members | Vmember\
  \ | 库成员信息 |\n| Options | Voption | 系统选项设置 |\n| Tables | Vtable | 数据集的详细信息 |\n| Titles\
  \ | Vtitle | 分配给标题和脚注的文本 |\n| Views | Vview | 数据视图的基本信息 |\n\n## 使用字典表\n\n你可以像查询其他表一样查询字典表，包括使用\
  \ `WHERE` 子句进行筛选、排序结果、创建表以及创建 `PROC SQL` 视图。由于字典表是只读对象，你无法为其插入行或列、更改列属性或添加完整性约束。要查看每个字典表的定义，请提交\
  \ `DESCRIBE TABLE` 语句。`DESCRIBE TABLE` 语句会在 SAS 日志中写入指定表的 `CREATE TABLE` 语句。在了解表的定义方式后，你可以在\
  \ `WHERE` 子句中使用其列名来检索特定信息。\n\n## 示例\n\n`Dictionary.Tables` 表包含表的详细信息。接下来的 `DESCRIBE\
  \ TABLE` 语句会在日志窗口中显示 `Dictionary.Tables` 表的信息。这些信息包含了表中存储的列名。\n\n```\nproc sql;\n\
  \   describe table dictionary.tables;\n```\n\n表 8.8 SAS 日志\n\n|  \n\n```\ncreate\
  \ table DICTIONARY.TABLES  \n  (  \n   libname char(8) label='Library Name', \n\
  \   memname char(32) label='Member Name', \n   memtype char(8) label='Member Type',\
  \  \n   memlabel char(256) label='Dataset Label',  \n   typemem char(8) label='Dataset\
  \ Type', \n   crdate num format=DATETIME informat=DATETIME label='Date Created',\
  \ \n...);\n``` |\n\n要显示特定库的文件信息，请在 `SELECT` 语句中指定列名，并在 `FROM` 子句中指定字典表名。例如，接下来的\
  \ `PROC SQL` 步骤将显示 Sasuser 库中表的\n\n* Memname（成员名）\n* Nobs（观测值数）\n* Nvar（变量数）\n*\
  \ Crdate（创建日期）\n\n\n\n\n字典列名在 `SELECT` 语句中指定，而字典表 `Dictionary.Tables` 则在 `FROM`\
  \ 子句中指定。库名 `Sasuser` 在 `WHERE` 子句中指定。\n**注意**：请注意，你必须在 `WHERE` 子句中使用大写字母指定库名（因为\
  \ SAS 内部是这样存储的），并用引号括起来。\n\n```\nproc sql;\n   select memname format=$20., nobs,\
  \ nvar, crdate\n      from dictionary.tables\n      where libname='SASUSER';\n```\n\
  \n下方显示了部分输出。![Dictionary.Tables](img/m76-20-g1.png)\n注意：`ALL` 的 `nobs` 值缺失是因为它是一个视图而不是表。注意：你的输出可能与上述所示有所不同，这取决于你的\
  \ `Sasuser` 库中的内容。你也可以使用字典表来确定更具体的信息，例如 SAS 库中的哪些表包含特定的列。\n\n## 示例\n\n`Dictionary.Columns`\
  \ 表包含关于变量及其属性的详细信息。与 `Dictionary.Tables` 类似，`Dictionary.Columns` 表包含一个名为 `Memname`\
  \ 的列，列出了库中每个表的名称。\n\n```\nproc sql;\n   describe table dictionary.columns;\n```\n\
  \n表 8.9 SAS 日志\n\n| |\n\n```\ncreate table DICTIONARY.COLUMNS  \n  (   \n   libname\
  \ char(8) label='Library Name',  \n   memname char(32) label='Member Name', \n \
  \  memtype char(8) label='Member Type', \n   name char(32) label='Column Name',\
  \ \n   type char(4) label='Column Type', \n   length num label='Column Length',\n\
  ...);\n```\n |\n\n下面的 `PROC SQL` 步骤列出了 `Sasuser` 库中所有包含名为 `EmpID` 列的表。字典列名 `Memname`\
  \ 在 `SELECT` 语句中指定。字典表 `Dictionary.Columns` 在 `FROM` 子句中指定。库名 `Sasuser` 和列名 `EmpID`\
  \ 在 `WHERE` 子句中指定。\n\n```\nproc sql;\n   select memname\n      from dictionary.columns\n\
  \      where libname='SASUSER'\n            and name='EmpID';\n```\n\n下方显示了部分输出。![Partial\
  \ output](img/m76-21-g1.png)记住，你也可以通过引用存储在 `sashelp` 库中的 `PROC SQL` 视图来访问字典表。在接下来的\
  \ `PROC PRINT` 步骤中，`DATA=` 选项指定了 `Sashelp` 视图 `Vcolumn`。`PROC PRINT` 步骤的结果与之前的输出相同。\n\
  \n```\nproc print data=sashelp.vcolumn;\n   var memname;\n   where libname='SASUSER'\
  \ and name='EmpID';\nrun;\n```\n\n**注意**：请注意 `WHERE` 子句中的列名必须与字典表使用的大小写一致，并必须用引号括起来。注意：你可以在任何\
  \ SAS 过程或 `DATA` 步骤中使用 `Sashelp` 视图。然而，字典表只能通过 SQL 过程读取。\n\n### 附加功能\n\n## 限制循环次数\n\
  \n`LOOPS=` 选项限制了 `PROC SQL` 中内部循环的迭代次数。通过设置限制，你可以防止查询消耗过多资源。例如，在连接三个大表时不满足连接匹配条件，可能会创建一个巨大的内部表，处理起来效率极低。使用\
  \ `LOOPS=` 选项可以防止这种情况发生。你可以使用 `PROMPT | NOPROMPT` 选项来修改 `LOOPS=` 选项的效果，当达到 `LOOPS=`\
  \ 选项设置的限制时，提示你停止或继续处理。注意：你可以使用 `SQLOOPS` 宏变量中报告的迭代次数（在执行每个 `PROC SQL` 语句后）来衡量 `LOOPS=`\
  \ 选项的合适值。有关关于 `SQLOOPS` 宏变量的更多信息，请参阅 SQL 过程的 SAS 文档。\n\n## 在 PROC SQL 中遇到错误后停止执行\n\
  \n你已经知道可以使用 `EXEC | NOEXEC` 选项来指定在通过语法准确性检查后是否执行该语句。如果 `EXEC` 选项生效，SAS 会检查 `PROC\
  \ SQL` 语法的准确性，如果没有发现错误，则执行 SQL 语句。`ERRORSTOP | NOERRORSTOP` 选项指定 `PROC SQL` 在遇到错误时是否停止执行。该选项仅在\
  \ `EXEC` 选项生效时有用。在批处理或非交互式会话中默认为 `ERRORSTOP`，在交互式 SAS 会话中默认为 `NOERRORSTOP`。`ERRORSTOP`\
  \ 指示 `PROC SQL` 停止执行语句，但在遇到错误后继续检查语法。`ERRORSTOP` 只在 SAS 以批处理或非交互式执行模式运行时有效。`NOERRORSTOP`\
  \ 指示 `PROC SQL` 执行语句并在发生后继续检查语法。如果你希望批处理作业在遇到错误后继续执行 SQL 过程语句，则 `NOERRORSTOP` 非常有用。\n\
  \n## 总结\n\n## 内容总结\n\n### 指定 SQL 选项\n\nSQL 过程提供了多种影响处理的选项。某些选项控制执行。例如，你可以限制查询期间读取或写入的行数，或者限制\
  \ `PROC SQL` 执行的内部循环次数。其他选项控制输出。例如，你可以对输出进行流式处理或编号。还有用于测试和评估性能的选项。这些选项指定在 `PROC\
  \ SQL` 语句中。\n\n### 限制行处理\n\n`OUTOBS=` 选项限制 `PROC SQL` 显示或写入表的行数。`INOBS=` 选项限制 `PROC\
  \ SQL` 从任何源获取的行数。`INOBS=` 选项类似于 SAS 系统选项 `OBS=`，对于调试大型表很有用。\n\n### 控制输出\n\n`NUMBER\
  \ | NONUMBER` 选项指定 `SELECT` 语句是否包含名为 `ROW` 的列，该列是数据检索时的行号。`NONUMBER` 是默认值。该选项类似于\
  \ `PRINT` 过程中的 `NOOBS` 选项。在某些情况下，对输出进行双倍行距更容易阅读。`DOUBLE | NODOUBLE` 选项指定 `PROC SQL`\
  \ 输出是否使用双倍行距。默认值为 `NODOUBLE`。`FLOW | NOFLOW | FLOW=n| FLOW=n m` 选项控制列表输出中宽列的形式。`FLOW`\
  \ 选项导致文本在列内流动而不是换行整行。指定 `n` 设置流动宽度。指定 `n` 和 `m` 则在范围内浮动宽度以实现平衡布局。\n\n### 测试和评估性能\n\
  \n`STIMER | NOSTIMER` 选项指定 `PROC SQL` 是否向 SAS 日写入每个语句的时间信息，以及整个过程的累计值。`NOSTIMER`\
  \ 是默认值。为了在 `PROC SQL` 中使用 `STIMER` 选项，必须同时启用 SAS 系统选项 `STIMER`（默认值）。\n\n### 重置选项\n\
  \n指定一个选项后，它将一直有效直到你更改它或重新调用 `PROC SQL`。你可以使用 `RESET` 语句在不重新调用 SQL 过程的情况下添加、删除或更改\
  \ `PROC SQL` 选项。\n\n### 使用字典表\n\n\n\n\n\nSAS 会话元数据存储在字典表（Dictionary tables）中，这些是特殊的只读\
  \ SAS 表，包含有关当前 SAS 会话中可用 SAS 库、SAS 宏和外部文件的信息。字典表还包含当前生效的 SAS 系统选项设置，以及 SAS 标题（Titles）和脚注（Footnotes）。访问字典表会导致\
  \ `PROC SQL` 确定 SAS 会话的当前状态并返回您想要的信息。可以通过使用 `Dictionary` 库引用对该表运行 `PROC SQL` 查询来访问字典表。您也可以引用存储在\
  \ `Sashelp` 库中的表的 `PROC SQL` 视图来访问字典表。\n\n要查看每个字典表的定义情况，请提交 `DESCRIBE TABLE` 语句。在了解表的定义后，您可以在子集\
  \ `WHERE` 子句中使用其列名来检索特定信息。要显示特定库中文件的信息，请在 `SELECT` 语句中指定列名，并在 `FROM` 子句中指定字典表名。您还可以使用字典表来确定更具体的信息，例如\
  \ SAS 库中的哪些表包含特定列。\n\n###附加功能\n\n`LOOPS=` 选项限制了 `PROC SQL` 中内部循环的迭代次数。通过设置限制，可以防止查询消耗过多资源。`ERRORSTOP\
  \ | NOERRORSTOP` 选项指定了 `PROC SQL` 在遇到错误时是否停止执行。\n\n## 示例\n\n### 使用 PROC SQL 选项查询表\n\
  \n```sas\nproc sql outobs=5;      \n   select flightnumber, destination  \n    \
  \  from sasuser.internationalflights;  \nreset number;      \n   select flightnumber,\
  \ destination    \n      from sasuser.internationalflights\n      where boarded\
  \ gt 200;\nquit;\n```\n\n### 描述和查询字典表\n\n```sas\nproc sql;\n   describe table dictionary.columns;\n\
  \   select memname\n      from dictionary.columns\n      where libname='SASUSER'\n\
  \            and name='EmpID';\nquit;\n```\n\n## 注意事项\n\n- 在指定选项后，该选项将保持生效，直到您更改它或重新调用\
  \ `PROC SQL`。\n- `DOUBLE | NODOUBLE` 以及 `FLOW | NOFLOW | FLOW=n| FLOW=n m` 选项不会影响使用输出交付系统（Output\
  \ Delivery System）创建的 HTML、PDF 或 RTF 输出的外观。\n- 如果您查询特定库中文件的字典表，则 `WHERE` 子句中使用的库名必须用大写字母指定，因为在\
  \ SAS 中是这样存储的。`WHERE` 子句中使用的列名必须与在字典表中出现的大小写一致。\n\n# 测验\n\n为每道题选择最佳答案。完成测试后，使用附录中的答案检查您的答案。\n\
