  \ 子句，`HAVING` 子句会将整个表视为一组。\n\n4. 是。\n\n# 第 3 章：使用 PROC SQL 水平合并表\n\n## 概述\n\n##\
  \ 引言\n当你需要从多个表中选择数据并将这些表进行水平合并（并列）时，`PROC SQL` 可以作为其他 SAS 过程或 `DATA` 步的高效替代方案。你可以使用\
  \ `PROC SQL` 连接（join）来水平合并表：\n\n```\nproc sql;\n   select *\n      from a, b\n \
  \     where a.x=b.x;\n```\n\n![表 A，表 B](img/m71-1g1.png)\n\n`PROC SQL` 连接是一种指定要合并的多个表和/或视图的查询，并且通常指定了匹配行并将其返回到结果集的条件。你应该已经熟悉了使用\
  \ `PROC SQL` 连接表的基础知识。在本章中，你将更深入地研究连接表。\n\n### 理解连接\n连接通过组合行来水平（并列）地合并表。被连接的表并不要求具有相同的行数或列数。注意：你也可以使用连接来合并视图以及表。以下大多数对表的引用也适用于视图；任何特殊情况均已说明。内联视图将在本章稍后部分介绍。有关\
  \ `PROC SQL` 视图的更多信息，请参阅使用 PROC SQL 创建和管理视图。当你使用 `PROC SQL` 查询连接表时，你必须决定你希望如何组合来自不同表的行。连接主要有两种类型，如下文所示。\n\
  \n| 连接类型 | 输出 |\n| --- | --- |\n| 内连接 (Inner join)![韦图，内连接](img/m71-2-g1.png) |\
  \ 仅包含跨所有表（或多个表）匹配的行 |\n| 外连接 (Outer join)![韦图，外连接](img/m71-2-g2.png) | 跨表匹配的行（如内连接所示）加上来自一个或多个表的不匹配行\
  \ |\n\n当处理任何类型的类型的连接时，`PROC SQL` 首先生成笛卡尔积（Cartesian product），它包含所有表中行所有可能的组合。考虑一下笛卡尔积是如何生成的。\n\
  \n### 生成笛卡尔积\n最基本的连接类型是合并 `SELECT` 语句 `FROM` 子句中指定的两个表的数据。当你在 `FROM` 子句中指定多个表但不包含用于划分子集的\
  \ `WHERE` 语句时，`PROC SQL` 会返回表的笛卡尔积。在笛卡尔积中，第一表中的每一行都与第二个表中的每一行组合。以下是这种类型查询的示例，它连接了\
  \ `One` 和 `Two` 表。\n\n```\nproc sql;\n   select *\n      from one, two;\n```\n\n\
  ![表 One 和 Two 的笛卡尔积](img/m71-3a1.png)\n\n上面的输出显示了 `One` 表中每行与 `Two` 表所有行的所有可能组合。注意，每个表都有一个名为\
  \ `X` 的列，这两个列都出现在输出中。笛卡尔积包含了源表的所有列。具有相同名称列不会重叠。在大多数情况下，生成多个表行的所有可能组合并不会产生有用的结果，因此笛卡尔积很少是你想要的查询结果。例如，在包含员工信息的两个表的笛卡尔积中，输出的每行可能包含两个不同员工的信息。通常，你希望连接只返回表中的行子集。笛卡尔积的大小也可能是一个问题。笛卡尔积的行数等于参与表行数的乘积。在前一个示例中使用的\
  \ `One` 和 `Two` 表各包含三行，如下所示![表 One 和表 Two](img/m71-4g1.png)。`One` 和 `Two` 笛卡尔积的行数计算方式如下：\n\
  \n```\n3 x 3 = 9\n```\n\n连接如 `One` 和 `Two` 这样的小表会产生较小的笛卡尔积。然而，连接大表的结果可能是巨大的，并需要大量的系统资源。例如，连接两个各有\
  \ 1000 行的表将导致输出为：\n\n```\n1000 x 1000 = 1,000,000\n```\n\n当你运行无法优化的查询时，`PROC SQL`\
  \ 会将以下警告信息写入 SAS 日志。\n\n表 3.1 SAS 日志\n| `注意：此查询的执行涉及一个或多个无法优化的笛卡尔积连接.` |\n\n尽管你通常不会主动选择创建笛卡尔积，但理解它是如何构建的。。在所有类型的连接中，`PROC\
  \ SQL` 都会生成笛卡尔积，然后消除不符合任何子集标准的行。\n\n### 使用内连接\n\n### 介绍连接语法\n内连接根据 `WHERE` 子句中指定的匹配标准（也称为连接条件），合并并仅显示来自第一个表的与第二个表的行匹配的行。连接条件是指定要连接表的列的表达式。以下图说明了两个表的内连接。重叠的阴影区域表示内连接作为输出返回的匹配行（行子集）![韦图，表\
  \ 1 和表 2 的内连接](img/m71-6g1.png 注意：内连接有时被称为常规连接。内连接语法建立在之前所示的最简单连接类型的语法之上。在内连接中，添加\
  \ `WHERE` 子句来限制显示在输出中的笛卡尔积行。\n\n| 通用形式，内连接的 SELECT 语句：`SELECT column-1<,...column-n>FROM\
  \ table-1 | view-1, table-2 | view-2<,...table-n | view-n>WHERE join-condition(s)<AND\
  \ other subsetting condition(s)><other clauses>;`\n此处语法的解释：\n- `join-condition(s)`\
  \ 指指定要连接表的列或列的一个或多个表达式。\n- `other subsetting condition(s)` 指用于划分查询结果行的可选表达式。\n-\
  \ `<other clauses>` 指可选的 `PROC SQL` 子句。 |\n\n\n\n\n\n当在前面所示 `PROC SQL` 查询中添加 `WHERE`\
  \ 子句时，只有部分行会被包含在输出中。修改后的查询、表和输出如文所示：\n\n| |\n```\nproc sql;\n   select *\n     \
  \ from one, two\n      where one.x = two.x;\n```\n| ![使用 Where 子句进行内连接](img/m71-6-g1.png)\
  \ |\n\n由于 `WHERE` 子句的存在，此内连接不会显示来自笛卡尔积（两个表中行的所有可能的组合）的所有行，而只显示行的一个子集。`WHERE` 子句表达式（连接条件）指定结果集应仅包含\
  \ `One` 表中列 `X` 的值等于 `Two` 表列 `X` 值的行。只有 `One` 表中的一行和 `Two` 表中的一行具有匹配的 `X` 值。这两行被合并为输出中的某一行。注意：除非连接条件中比较的列（在本例中为\
  \ `One.X` 和 `Two.X`）具有相同的数据类型，否则 `PROC SQL` 不会执行连接。然而，这两个列不需要具有相同的名称。例如，如果 `ID`\
  \ 和 `EmpID` 具有相同的数据类型，则后续 `WHERE` 语句所示的连接是有效的：\n\n```\nwhere table1.id = table2.empid\n\
  ```\n\n注意：`WHERE` 子句中指定的连接条件通常包含等号 (`=`) 运算符，但表达式可能包含一个或多个其他运算符。基于等号 (`=`) 运算符匹配行的内连接（即一个表中的列或表达式的值必须等于另一个表的列或表达式的值）被称为**等值连接\
  \ (equijoin)**。考虑 `PROC SQL` 如何处理此内连接。\n\n## 理解连接是如何处理的\n\n理解 `PROC SQL` 如何处理内连接和外连接，有助于你理解每种连接生成的哪种输出。从概念上讲，`PROC\
  \ SQL` 遵循以下步骤处理连接：\n\n* 构建指定表的行笛卡尔积\n* 根据 `WHERE` 子句中指定的连接条件（以及任何其他子集条件）评估笛卡尔积中的每行，并移除任何不符合指定条件的行\n\
  * 如果指定了摘要函数，则对适用行进行汇总\n* 返回要在输出中显示的行。\n\n注意：`PROC SQL` 查询优化器遵循比此处描述的概念方法更复杂的过程，通过将笛卡尔积拆分为更小的部分。对于每个查询，优化器根据特定情况选择最有效的处理方法。默认情况下，`PROC\
  \ SQL` 连接不会重叠同名的列。相反，输出会显示所有具有相同名的列。为了避免在内连接或外连接的输出中出现同名列，你可以消除或重命名重复列。提示：你也可以在内连接或外连接中使用\
  \ `COALESCE` 函数来重叠同名的列。本章稍后将与外连接一起讨论 `COALESCE` 函数。\n\n## 消除重复列\n\n考虑使用内连接组合 `One`\
  \ 和 `Two` 表的示例 `PROC SQL` 查询：\n\n| |\n```\nproc sql;\n    select *\n       from\
  \ one, two\n       where one.x = two.x;\n```\n| ![内连接，表 One 和 Two](img/m71-8-g1.png)\
  \ |\n\n这两个表都有一个名称相同的列（`X`）。由于上述所示查询中的 `SELECT` 子句包含星号 (`*`)，输出显示了两个表的所有列。要消除重复列，你可以在\
  \ `SELECT` 语句中仅指定重复列中的一个。前面的 `PROC SQL` 查询中的 `SELECT` 语句可以修改如下：\n\n```\nproc sql;\n\
  \   select one.x, a, b\n      from one, two\n      where one.x = two.x\n```\n\n\
  在这里，`SELECT` 子句指定仅将 `One` 表中的列 `X` 包含在输出中。只显示一个 `X` 列的输出如下所示![表 One 输出](img/m71-8-g2.png)注意：在内等值连接中（如此处所示），在\
  \ `SELECT` 语句中列出哪个同名列并不重要。示例中的 `SELECT` 语句可以指定 `Two.X` 而不是 `One.X`。在上述示例中消除重复 `X`\
  \ 列的另一种方法如下所示：\n\n```\nproc sql;\n   select one.*, b\n      from one, two\n    \
  \  where one.x = two.x;\n```\n\n通过使用星号 (`*`) 选择来自 `One` 表的所有列，并仅从 `Two` 表选择 `B`，此查询生成的与之前的版本相同的输出。\n\
  \n## 使用列别名重命名列\n\n如果你正在处理多个具有相同名称列但数据略有不同的表，你可能希望两个列都出现在输出中。为了避免显示两个同名不同列的混淆，你可以通过在\
  \ `SELECT` 语句中指定列别名来重命名重复列之一。例如，你可以如下修改示例查询的 `SELECT` 语句：\n\n```\nproc sql;\n  \
  \ select one.x as ID, two.x, a, b\n      from one, two\n      where one.x = two.x;\n\
  ```\n\n修改后查询的输出在此处![修改后的查询输出](img/71-8-g3.png)现在 `One.X` 已重命名为 `ID`，输出清晰地指示了两个列。\n\
  \n## 连接具有匹配值的表\n\n考虑当你连接两个在列上具有重复值的表时会发生什么。`Three` 和 `Four` 在 `X` 列上具有多个匹配值。后续 `PROC\
  \ SQL` 内连接匹配行：\n\n| |\n```\nproc sql;\n    select *\n       from three, four\n \
  \      where three.x=four.x;\n```\n| ![表和 Four](img/9-g1.png) |\n\n输出显示了此内连接如何处理重复值![PROC\
  \ SQL 输出](img/9-g2.png)没有其他值的匹配，因此不显示其他行。注意：DATA 步合并只会输出两行，因为它从上到下处理数据。本章稍后将比较 `PROC\
  \ SQL` 连接和 DATA 步合并。\n\n## 指定表别名\n\n为了让 `PROC SQL` 区分不同表中的同名列，你使用限定列名。要创建限定列名，可以在列名前面加上表名。例如，下面的\
  \ PROC SQL 内连接包含多个限定列名：\n\n```\nproc sql;\ntitle 'Employee Names and Job Codes';\n\
  \   select staffmaster.empid, lastname, firstname, jobcode\n      from sasuser.staffmaster,\
  \ sasuser.payrollmaster\n      where staffmaster.empid=payrollmaster.empid;\n```\n\
  \n包含长限定列名的 `PROC SQL` 代码可能难以阅读。此外，输入长表名可能非常耗时。幸运的是，你可以在任何 `PROC SQL` 查询的任何或所有表使用临时替代名称。此临时名称称为表别名，指定在\
  \ `FROM` 子句的表名之后。通常使用 `AS` 关键字，尽管其是可选的。修改后的 PROC SQL 查询在 `FROM` 子句中指定了表别名，然后在 `SELECT`\
  \ 和 `WHERE` 子句中使用表别名来限定列名：\n\n```\nproc sql;\ntitle 'Employee Names and Job Codes';\n\
  \   select s.empid, lastname, firstname, jobcode\n      from sasuser.staffmaster\
  \ as s, \n           sasuser.payrollmaster as p\n      where s.empid=p.empid;\n\
  ```\n\n在此查询中，可选的 `AS` 关键字用于定义 `FROM` 子句中的表别名。如果省略 `AS`，`FROM` 子句同样有效，如下所示：\n\n```\n\
  from sasuser.staffmaster s,\n     sasuser.payrollmaster p\n```\n\n\n\n\n\n注意：虽然使用表别名可以帮助你更高效工作，但使用表别名不会导致\
  \ SAS 执行查询更快。表别名通常是可选的。然而，在以下两种情况下需要使用它们，如下所示。\n\n| 需要使用表别名的情况... | 示例 |\n| ---\
  \ | --- |\n| 表与其自身连接（称为自连接或反射连接）时 | ```sql\nfrom airline.staffmaster as s1,\n  \t\
  \  airline.staffmaster as s2\n``` |\n| 你需要引用不同库中同名表的列时 | ```sql\nfrom airline.flightdelays\
  \ as af,\n       work.flightdelays as wf\n where af.delay > wf.delay\n``` |\n\n\
  到为止，你已经看到了内连接的相对简单的示例。然而，与任何其他 `PROC SQL` 查询一样，内连接也可以包含更高级的组件，例如：\n\n* 标题（titles）和页脚（footers）\n\
  * `SELECT` 子句中的函数和表达式\n* `WHERE` 子句中的多个条件\n* 用于用于排序的 `ORDER BY` 子句\n* 带有分组的汇总函数。\n\
  \n这里是一些更复杂的内连接的示例。\n\n## 示例：复杂的 PROC SQL 内连接\n\n假设你想显示居住在纽约的所有公司员工的姓名（首字母和姓氏）、职位代码（job\
  \ codes）和年龄。你还希望结果按职位代码和年龄进行排序。你需要的数据存储在下面列出的两个表中。\n\n| 表 | 相关列 |\n| --- | --- |\n\
  | Sasuser.Staffmaster | EmpID, LastName, FirstName, State |\n| Sasuser.Payrollmaster\
  \ | EmpID, JobCode, DateOfBirth |\n\n在你想要显示的三个列中，`JobCode` 是表中已存在的唯一列。另外两个列需要从现有列中创建。这里显示的\
  \ `PROC SQL` 查询使用内连接来生成你需要的输出：\n\n```sql\n proc sql outobs=15;\n title 'New York\
  \ Employees';\n    select substr(firstname,1,1) || '. ' || lastname \n         \
  \  as Name,\n           jobcode,\n           int((today() - dateofbirth)/365.25)\n\
  \           as Age\n       from sasuser.payrollmaster as p,\n            sasuser.staffmaster\
  \ as s\n       where p.empid =\n             s.empid\n             and state='NY'\n\
  \       order by 2, 3;\n```\n\n![New York Employees](img/m71-13-g1.png)下方显示的 `SELECT`\
  \ 子句指定了新列 `Name`、现有列 `JobCode` 和新列 `Age`：\n\n```sql\nselect substr(firstname,1,1)\
  \ || '. ' || lastname \n       as Name,\n       jobcode,\n       int((today() -\
  \ dateofbirth)/365.25)\n       as Age\n```\n\n为了创建这两个新列，`SELECT` 子句使用了如下函数和表达式：\n\
  \n* 为了创建 `Name`，使用 `SUBSTR` 函数从 `FirstName` 中提取首字母。然后，使用连接运算符将首字母与点、空格，以及 `LastName`\
  \ 列的内容结合起来。最后，使用关键字 `AS` 为该新列命名。\n* 为了计算 `Age`，使用 `INT` 函数返回计算结果的整数部分。在作为 `INT`\
  \ 函数参数的表达式中，用今天的日期（由 `TODAY` 函数返回）减去员工的出生日期（`DateOfBirth`），并将差除以一年的天数（`365.25`）。\n\
  \n`WHERE` 子句包含两个由逻辑运算符 `AND` 链接的表达式：\n\n```sql\nwhere p.empid =\n      s.empid\n\
  \      and state='NY'\n```\n\n此查询仅输出 `EmpID` 匹配且 `State` 值为 `NY` 的行。你不需要用表名修缀列名\
  \ `State`，因为 `State` 只出现在其中一个表中。\n\n## 示例：带有汇总函数的 PROC SQL 内连接\n\n你还可以在 `PROC SQL`\
  \ 连接中对数据进行汇总和分组。为了说明这一点，修改之前的 `PROC SQL` 内连接，使输出显示每个职位代码下纽约员工的以下汇总列：员工人数和平均年龄。修改后的查询所示：\n\
  \n```sql\nproc sql outobs=15;\ntitle 'Avg Age of New York Employees';\n   select\
  \ jobcode,\n          count(p.empid) as Employees,\n          avg(int((today() -\
  \ dateofbirth)/365.25))\n          format=4.1 as AvgAge\n      from sasuser.payrollmaster\
  \ as p,\n           sasuser.staffmaster as s\n      where p.empid =\n          \
  \  s.empid\n            and state='NY'\n      group by jobcode\n      order by jobcode;\n\
  ```\n\n为了创建两个新列，`SELECT` 子句使用了如下汇总函数：\n\n* 为了创建 `Employees`，使用 `COUNT` 函数并将 `p.EmpID`（`Payrollmaster.EmpID`）作为其参数。\n\
  * 为了创建 `AvgAge`，使用 `AVG` 函数并将表达式作为参数。如前面的示例所示，该表达式使用 `INT` 函数计算每个员工的年龄。\n\n此修改后查询的输出所示。![Average\
  \ Age of New York Employees](img/m71-14-g1.png)。\n\n### 使用外连接\n\n## 外外连接类型\n\n外连接合并并显示跨表的所有匹配行，基于指定的匹配标准（也称为连接条件），以及部分或所有不匹配的行。你可以认为外连接是内连接的扩展：外连接返回内连接生成的行，加上额外的不匹配行。\n\
  \n| 外连接类型 | 输出 |\n| --- | --- |\n| 左外连接 | 所有匹配行加上来自 FROM 子句指定的第一个表（左表）的不匹配行![Left\
  \ Join](img/m71-16g1.png) |\n| 右外连接 | 所有匹配行加上来自 FROM 子句指定的第二个表（右表）的不匹配行![Right Join](img/m71-16g2.png)\
  \ |\n| 全外连接 | 所有匹配行加上两边的不匹配行![Full Join](img/m71-16g3.png) |\n\n外连接的语法所示。\n\n| 外连接的通用形式\
  \ SELECT 语句： |\n| --- |\n| `SELECT column-1,...column-n> FROM table-1 view-1 LEFT\
  \ JOIN | RIGHT JOIN | FULL JOIN table-2 view-2 ON join-condition(s)<other clauses>`;LEFT\
  \ JOIN`, `RIGHT JOIN`, `FULL JOIN` 是指定外连接类型的关键字。`ON` 指定连接条件，即用于连接表的列或列的表达式。<other\
  \ clauses>`指的是可选的 PROC SQL 子句。 |\n\n注意：为了进一步过滤查询输出中的行，你可以在 `ON` 子句后跟随一个 `WHERE`\
  \ 子句。`WHERE` 子句在执行外连接之前对详细行进行过滤。然后 `ON` 子句指定如何选择剩余的行。注意：你每次只能对两个表或视图执行外连接。视图将在本章稍后介绍。考虑每种外连接的工作方式。\n\
  \n## 使用左外连接\n\n左外连接根据指定的匹配标准（连接条件）检索跨表的所有匹配行，加上左表（FROM 子句中指定的第一个表）的不匹配行。假设你正在使用以下\
  \ `PROC SQL` 左连接来合并表 One 和 Two。连接条件位于 `ON` 关键字后的表达式中。这两个表和三行输出如下所示：\n\n```sql\n\
  proc sql;\n    select *\n       from one\n        left join\n        two\n     \
  \  on one.x=two.x;\n```\n\n![Left Outer Join Output](img/m71-17-g1.png)\n\n\n\n\n\
  在输出的每一行中，前两列对应于 `table One`（左表），后两列对应于 `table Two`（右表）。因为这是一个左连接，`table One`（左表）的所有行（包括匹配和不匹配的行）都包含在输出中（前两列）。只有当\
  \ `table Two`（右表）的行与 `table One` 的某行相匹配时，它们才会显示在输出中（后两列）。\n\n在此示例中，根据 `ON` 子句中指定的匹配准则（连接条件），输出的第二行是唯一的一行\
  \ `table One` 的行与 `table Two` 的某行相匹配的行。在输出的第一行和第三行中，`table One` 的某行在 `table Two`\
  \ 中没有匹配的行。\n\n注意：在所有类型的外连接（左连接、右连接和全连接）中，结果行（合并后的行）中来自未匹配行的列都将被设置为缺失值。\n\n为了消除任何外连接中的其中一个重复列（在本例中为\
  \ `X`），正如前面的内连接所示，你可以修改 `SELECT` 子句来列出要显示的特定列。在这里，前面的查询的 `SELECT` 子句已被修改以删除重复的 `X`\
  \ 列：\n\n```sql\nproc sql;\n    select one.x, a, b\n       from one\n       left\
  \ join\n       two\n       on one.x=two.x;\n```\n\n| ![左连接输出，已删除重复列](img/m71-17-g2.png)\
  \ |\n\n## 使用右外连接\n\n右外连接根据指定的匹配准则（连接条件）检索跨表中匹配的所有行，加上来自右表（`FROM` 子句中指定的第二个表）的不匹配行。考虑一下当使用右连接合并上一个示例中使用的两个表会发生什么。以下\
  \ `PROC SQL` 查询使用右连接根据 `ON` 子句中指定的连接条件合并 `One` 和 `Two` 的行：\n\n```sql\nproc sql;\n\
  \    select *\n       from one\n       right join\n       two\n       on one.x=two.x;\n\
  ```\n\n| ![右连接输出](img/m71-18-g1.png) |\n\n在输出的每一行中，前两列对应于 `table One`（左表），后两列对应于\
  \ `table Two`（右表）。因为这是一个右连接，`table Two`（右表）的所有行（包括匹配和不匹配的行）都包含在输出中（后两列）。只有当 `table\
  \ One`（左表）的行与 `table Two` 的某行相匹配时，它们才会显示在输出中（前两列）。\n\n在此示例中，`table One` 中只有一行与 `table\
  \ Two` 中的 `X` 值相匹配，这两行匹配行组合形成输出的第一行。在输出的其余行中，没有匹配项，且对应于 `table One` 的列被设置为缺失值。\n\
  \n## 使用全外连接\n\n全外连接从两个表中同时检索匹配的行和不匹配的行。再次合并相同的两个表，这次使用全连接。下文显示 `PROC SQL` 查询、表和输出：\n\
  \n```sql\nproc sql;\n   select *\n      from one \n      full join\n      two\n\
  \      on one.x=two.x;\n```\n\n| ![全外连接输出](img/m71-19-g1.png) |\n\n因为这是一个全连接，两个表的所有行（包括匹配和不匹配的行）都包含在输出中。`table\
  \ One` 和 `table Two` 之间只有一个匹配项，因此只有一行输出在所有列中显示值。输出的所有其余行仅包含来自 `table One` 或 `table\
  \ Two` 的值。其余列被设置为缺失值。\n\n## 示例：外连接\n\n现在你已经了解了三种外连接的工作原理，请考虑一个需要使用外连接的实际情况。假设你想列出某航空公司在\
  \ 3 月份的所有航班，以及相应的延迟信息（如果存在）。每班航班都通过航班日期和航班号识别。你的输出应该显示以下数据：航班日期、航班号、目的地以及延迟时长（分钟）。\n\
  \n你需要的数据存储在所示的两个表中。已标识出每个表的适用列。\n\n| 表 | 相关列 |\n| --- | --- |\n| Sasuser.Marchflights\
  \ | `Date, FlightNumber, Destination` |\n| Sasuser.Flightdelays | `Date, FlightNumber,\
  \ Destination, Delay` |\n\n你的输出应该包含上述列出的列以及所有以下行：\n\n*   跨两个表的 `Date` 和 `FlightNumber`\
  \ 具有匹配值的行。\n*   `Sasuser.Marchflights` 中在 `Sasuser.Flightdelays` 中没有匹配行的行。\n\n为了生成你想要的输出，以下\
  \ `PROC SQL` 查询使用了左外连接。`Sasuser.Marchflights` 被指定为左（第一个）表。\n\n```sql\nproc sql outobs=20;\n\
  title 'All March Flights';\n   select m.date,\n          m.flightnumber \n\t   \
  \          label='Flight Number',\n          m.destination\n          label='Left',\n\
  \          f.destination\n          label='Right',\n          delay\n          label='Delay\
  \ in Minutes'\n      from sasuser.marchflights as m \n           left join\n   \
  \        sasuser.flightdelays as f\n      on m.date=f.date\n         and m.flightnumber=\n\
  \             f.flightnumber\n      order by delay;\n```\n\n注意以下几点：\n\n*   `SELECT`\
  \ 子句通过指定来源为 `Sasuser.Marchflights` 消除了重复的 `Date` 和 `FlightNumber` 列。然而，`SELECT`\
  \ 子句列出了两个表的 `Destination` 列并为每个列分配了表别名。\n*   `ON` 子句包含两个连接条件，根据两个列 `Date` 和 `FlightNumber`\
  \ 匹配表。\n\n查询输出所示 certpgadv/images/m71-21-g1.png。输出的前 12 行显示了 `Sasuser.Marchflights`\
  \ 中在 `Sasuser.Flightdelays` 中没有匹配行的行。因此，在这 12 行中，最后 2 列被设置为缺失值。注意：可以使用右连接来生成相同的结果。`Sasuser.Marchflights`\
  \ 被指定为右（第二个）表。\n\n\n\n\n\n当 `BY` 变量的所有值都匹配时，你可以使用 `PROC SQL` 的内连接（inner join）来产生与\
  \ `DATA` 步合并（match-merge）相同的结果。假设你想合并 `One` 和 `Two` 两个表，如下所示![Tables One and Two](img/m71-24-g2.png)。这两个表共有列\
  \ `X`，且每个表中每行 `X` 的所有值在两个表中都是匹配的。两个表都已按照 `X` 排序。接下来的 `DATA` 步合并（随后跟跟一个 `PROC PRINT`\
  \ 步）和 `PROC SQL` 内连接将产生完全相同的报告。\n\n| DATA Step Match-Merge | PROC SQL Inner Join\
  \ |\n| --- | --- |\n| | |\n\n```\ndata merged;\n    merge one two;\n    by x; run;\n\
  \n  proc print data=merged noobs;\n    title 'Table Merged';\n run;\n```\n | |\n\
  \n```sql\nproc sql;\n title 'Table Merged';\n    select one.x, a, b\n       from\
  \ one, two\n       where one.x = two.x\n       order by x;\n```\n| |\n\n![DATA step\
  \ match-merge](img/m71-24-g1.png) 注意：`DATA` 步合并会创建一个数据集，而此处所示的 `PROC SQL` 内连接仅创建一个一个报告作为输出。为了让这两个程序完全相同，可以重写\
  \ `PROC SQL` 内连接以创建一个表。关于使用 `PROC SQL` 创建表的详细信息，请参阅使用 PROC SQL 创建和管理表。Note:Note。注意：如果输出中行的顺序不重要，则可以从\
  \ `PROC SQL` 连接中删除 `ORDER BY` 子句。没有了 `ORDER BY` 子句，该连接的效率更高，因为 `PROC SQL` 不需要对数据进行第二次扫描。\n\
  \n## 当只有部分值匹配时\n\n当 `BY` 变量的只有部分值匹配时，你可以使用 `PROC SQL` 的全外连接（full outer join）来产生与\
  \ `DATA` 步合并相同的结果。然而，与 `DATA` 步合并不同，`PROC SQL` 外连接默认不会重叠两个公共列。要重叠公共列，你必须在 `PROC\
  \ SQL` 全外连接中使用 `COALESCE` 函数。注意：`COALESCE` 函数也可以用于内连接操作符。考虑一下在没有 `COALESCE` 函数的情况下使用\
  \ `PROC SQL` 全外连接会发生什么。假设你想合并 `Three` 和 `Four` 两个表。这两个表共有列 `X`，但 `X` 的大部分值在表之间是不匹配的。两个表都已按照\
  \ `X` 排序。接下来的 `DATA` 步合并（随后跟跟一个 `PROC PRINT` 步）和 `PROC SQL` 外连接合并了这些表，但没有生成相同的输出。`COALESCE`\
  \ 函数也可以用于内连接操作符。\n\n| DATA Step Match-Merge | PROC SQL Full Outer Join |\n| ---\
  \ | --- |\n| | |\n\n```sas\ndata merged;\n    merge three four;\n    by x;\nrun;\n\
  \nproc print data=merged noobs;\n    title 'Table Merged';\nrun;\n```\n | |\n\n\
  ```sql\nproc sql;\ntitle 'Table Merged';\n    select three.x, a, b\n       from\
  \ three\n       full join\n       four\n       on three.x = four.x\n       order\
  \ by x;\n```\n| |\n\n![DATA step match-merge](img/m71-25-g1.png) `DATA` 步合并会自动重叠公共列\
  \ `X`。`PROC SQL` 外连接仅从一个表（表 `Three`）中选择 `X` 值，因此表 `Four` 中的 `X` 值不会包含在 `PROC SQL`\
  \ 输出中。然而，`PROC SQL` 外连接默认无法重叠列。两个合并表中发生变化的值在上方已**加粗**。考虑一下 `COALESCE` 函数是如何在 `PROC\
  \ SQL` 外连接中使用以重叠公共列的。\n\n## 当只有部分值匹配时：使用 COALESCE 函数\n\n当你将 `COALESCE` 函数添加到 `PROC\
  \ SQL` 外连接的 `SELECT` 子句中时，`PROC SQL` 外连接就可以产生与 `DATA` 步合并相同的结果。\n\n| 通用形式，在基础 `SELECT`\
  \ 子句中使用 `COALESCE` 函数：`SELECT COALESCE (column-1<,...column-n>)` 这里是对该语法的解释：`column-1`\
  \ 到 `column-n` 是两个或多个要重叠列的名称。`COALESCE` 函数要求所有参数具有相同的数据类型。 |\n\n`COALESCE` 函数通过以下方式重叠指定的列：：\n\
  * 按照列列出的顺序检查每个列的值\n* 返回第一个 SAS 非缺失值。\n\nNote:Note。如果所有返回值都是缺失的，`COALESCE` 将返回一个缺失值。当将\
  \ `COALESCE` 函数添加到前面的 `PROC SQL` 全外连接中时，`DATA` 步合并（带有 `PROC PRINT` 步）和 `PROC SQL`\
  \ 全外连接将以相同的方式合并行。这两个程序、表和输出如下所示。\n\n| DATA Step Match-Merge | PROC SQL Full Outer\
  \ Join |\n| --- | --- |\n| | |\n\n```sas\ndata merged;\n    merge three four;\n\
  \    by x;\nrun;\n\nproc print data=merged noobs;\n    title 'Table Merged';\nrun;\n\
  ```\n | |\n\n```sql\nproc sql;\ntitle 'Table Merged';\n    select coalesce(three.x,\
  \ four.x)\n       as X, a, b\n       from three\n       full join\n       four\n\
  \       on three.x = four.x;\n```\n|\n\n### 使用内联视图\n\n## 引入内联视图\n\n有时，你可能希望指定内联视图而非表作为\
  \ `PROC SQL` 查询的数据。内联视图是指定在外部查询的 `FROM` 子句中的嵌套查询。（你应该已经熟悉子查询，它是指定在 `WHERE` 子句中的嵌套查询。）内联视图从一个或多个表中选择数据，以产生一个临时（或虚拟）表，外部查询随后使用该表。例如，下面的\
  \ `FROM` 子句指定了一个内联视图：\n\n```sql\n from (select flightnumber, date,\n           \
  \   boarded/passengercapacity*100 \n              as pctfull\n              format=4.1\
  \ label='Percent Full'\n         from sasuser.marchflights)\n```\n\n这个内联视图选择了两个现有列（`FlightNumber`\
  \ 和 `Date`），并根据表 `Sasuser.Marchflights` 定义了新列 `PctFull`。与表不同，内联视图仅存在于查询执行期间。由于它是临时的，内联视图可以在定义它的查询中引用。此外，内联视图可以分配别名，但不能分配永久名称。Note:Note。在\
  \ `FROM` 子句中，你还可以指定 `PROC SQL` 视图，视图是已经创建（使用 `CREATE` 语句）并存储的查询。你可以在[使用 SQL 创建和管理视图](../../../../certpgadv/html/n12kcs025dxzdfn147whk5ylt668.htm）学习更多关于创建\
  \ `PROC SQL` 视图的信息。Note:Note。与其他查询不同，内联视图不能包含 `ORDER BY` 子句。\n\n\n\n\n\n- 代码的复杂性通常会降低，因此代码更易编写和理解。\n\
  - 在某些情况下，`PROC SQL` 能够更高效地处理代码。\n\n## 在其他视图或表中引用内联视图\n\n前面的 `FROM` 子句来自一个简单的 `PROC\
  \ SQL` 查询，该查询仅引用了一个数据源：内联视图。然而，`PROC SQL` 查询可以连接多个表和内联视图。例如，下所示的 `FROM` 子句同时指定了表\
  \ (`Sasuser.Flightschedule`) 和内联视图。\n\n```\n from sasuser.flightschedule,\n    \
  \  (select flightnumber, date,\n              boarded/passengercapacity*100 \n \
  \             as pctfull\n              format=4.1 label='Percent Full'\n      \
  \   from sasuser.marchflights)\n```\n\n## 在内联视图中引用多个表\n\n你可以在内联视图的 `FROM` 子句中指定多个表，如下所示：\n\
  \n```\n from (select marchflights.flightnumber, \n               marchflights.date,\n\
  \               boarded/passengercapacity*100 \n               as pctfull\n    \
  \           format=4.1 label='Percent Full',\n               delay\n           from\
  \ sasuser.marchflights, \n                sasuser.flightdelays\n           where\
  \ marchflights.flightnumber=\n                 flightdelays.flightnumber\n     \
  \            and marchflights.date=\n                 flightdelays.date)\n```\n\n\
  换句话说，你可以基于连接创建一个内联视图。注意：请记住，内联视图中引用的每个表都计入 256 个表的内连接限制。\n\n## 为内联视图分配别名\n\n你可以像为表一样为内联视图分配别名。在以下示例中，第一个\
  \ `FROM` 子句添加了别名 `f` 以引用表 `Sasuser.Flightschedule`，并将别名 `m` 与内联视图的结果关联。在主 `FROM`\
  \ 子句之后，添加了一个同时使用这两个别名的 `WHERE` 子句。\n\n```\nfrom sasuser.flightschedule as f,\n \
  \    (select flightnumber, date\n             boarded/passengercapacity*100 \n \
  \            as pctfull\n             format=4.1 label='Percent Full'\n        \
  \ from sasuser.marchflights) as m\nwhere m.flightnumber=f.flightnumber\n      and\
  \ m.date=f.date\n```\n\n## 示例：包含内联视图的查询\n\n假设你想识别 3 月份误误最严重的航空旅行目的地。你希望输出显示以下所有数据：\n\
  \n- 目的地 (destination)\n- 平均延迟\n- 最大延迟\n- 延迟概率。\n\n你的 `PROC SQL` 查询使用内联视图来计算除最后一列以外的所有新列：\n\
  \n```\nproc sql;\ntitle \"Flight Destinations and Delays\";\n   select destination,\
  \ \n          average format=3.0 label='Average Delay',\n          max format=3.0\
  \ label='Maximum Delay', \n          late/(late+early) as prob format=5.2\n    \
  \      label='Probability of Delay'\n      from (select destination,\n         \
  \          avg(delay) as average,\n                   max(delay) as max,\n     \
  \              sum(delay > 0) as late,\n                   sum(delay <= 0) as early\n\
  \                   from sasuser.flightdelays\n                   group by destination)\n\
  \      order by average;\n```\n\n考虑外部查询的每个子句，从 `FROM` 子句开始，因为 `PROC SQL` 在评估 `SELECT`\
  \ 子句之前评估 `FROM` 子句。`FROM` 子句指定了一个内联视图而不是表。内联视图（嵌套查询）指定了 `Sasuser.Flightdelays` 表中或基于该表列的以下列：\n\
  \n- 现有列 `Destination`\n- 新列 `Average`\n- 新列 `Max`\n- 新列 `Late`\n- 新列 `Early`。\n\n\
  `Average`、`Max`、`Late` 和 `Early` 列都是通过摘要函数计算的。在 `Late` 和 `Early` 列的计算中，使用布尔表达式作为摘要函数的参数。布尔函数解析为\
  \ 1（真）或 0（假）。例如，`Late` 是通过对布尔表达式 `delay > 0` 求 `sum` 来计算的。对于每一个大于 0 的 `Delay` 值，布尔表达式解析为\
  \ 1；等于或小于 0 的值解析为 0。`SUM` 函数相加所有 `Delay` 的值，以指示每个目的地发生的延迟次数。内联视图以 `group by destination`\
  \ 子句结束，指定内联视图数据应根据 `Destination` 的值进行分组和汇总。如果你提交此内联视图（嵌套查询）作为单独查询，它将生成以下输出。![in-line\
  \ view (nested query)](img/m71-31-g1.png) 考虑外部查询的 `SELECT` 和 `ORDER BY` 子句：\n\n\
  ```\nproc sql;\ntitle \"Flight Destinations and Delays\";\n   select destination,\n\
  \          average format=3.0 label='Average Delay',\n          max format=3.0 label='Maximum\
  \ Delay',\n          late/(late+early) as prob format=5.2\n          label='Probability\
  \ of Delay'\n      from (select destination,\n                   avg(delay) as average,\n\
  \                   max(delay) as max,\n                   sum(delay > 0) as late,\n\
  \                   sum(delay <= 0) as early\n                   from sasuser.flightdelays\n\
  \                   group by destination)\n      order by average;\n```\n\n\n\n\n\
  \n| --- | --- |\n\n| Data | `Sasuser.Flightschedule (EmpID, Date, Destination)`\
  \ `Sasuser.Staffmaster (EmpID, FirstName, LastName, State)` `Sasuser.Payrollmaster\
  \ (EmpID, JobCode)` `Sasuser.Supervisors (EmpID, State, JobCategory)` |\n\n注意：主管与他们监管的员工住在同一个州。每个州每个职业类别对应一名主管。完成上述任务需要一个复杂的查询，其中包含多个子查询、连接和内联视图。为了使任务更易于管理，请分四步逐步构建此复杂查询：\n\
  \n1. 确定飞往哥本哈根航班的工作人员。\n2. 找到第一个查询返回的机组成员州和职业类别。\n3. 根据第二个查询返回的州和职业类别，找到人员主管的员工编号。\n\
  4. 根据第三个查询返回的员工编号，找到主管的名字。\n\n注意，在四个步骤中的每一步，都会添加最终查询的一个部分。最终查询包含了这四个独立的部分。\n\n###\
  \ 查询 1：确定飞往哥本哈根 (CPH) 航班的工作人员\n\n此查询列出了哥本哈根航班上所有六名机组成员的员工 ID：\n\n```\nproc sql;\n\
  \   select empid\n      from sasuser.flightschedule\n      where date='04mar2000'd\n\
  \            and destination='CPH';\n```\n\n![哥本哈根航班的员工 ID](img/m71-34-g1.png) |\n\
  \n### 查询 2：找到机组成员的州和职业类别\n\n查询 1 变成子查询，并将六名哥本哈根机组成员的员工 ID 返回给外部查询查询 2。（查询 2 为阴影部分）。查询\
  \ 2 使用内连接合并两个表。查询 2 为六名机组成员选择了职业类别（通过使用 `SUBSTR` 函数从 `JobCode` 中提取职业类别）和州。\n\n```\n\
  proc sql;\n   select substr(JobCode,1,2) as JobCategory,\n          state \n   \
  \   from sasuser.staffmaster as s,\n           sasuser.payrollmaster as p\n    \
  \  where s.empid=p.empid and s.empid in\n         (select empid\n            from\
  \ sasuser.flightschedule\n            where date='04mar2000'd\n                \
  \  and destination='CPH');\n```\n\n![哥本哈根机组成员的职业类别和州](img/m71-34-g2.png) |\n\n###\
  \ 查询 3：找到人员主管的员工编号\n\n查询 2 成为查询 3 中的内联视图，并为内联视图分配了别名 `c`。查询 2 向查询 3 返回每个机组成员的职业类别和州。查询\
  \ 3 选择职业类别和州与机组成员匹配的主管的员工 ID。注意：`Sasuser.Supervisors` 为 `EmpID` 列指定了标签 Supervisor\
  \ ID，该标签会显示在输出中。\n\n```\nproc sql;\n   select empid\n      from sasuser.supervisors\
  \ as m,\n         (select substr(jobcode,1,2) as JobCategory,\n                \
  \ state\n            from sasuser.staffmaster as s,\n                 sasuser.payrollmaster\
  \ as p\n            where s.empid=p.empid and s.empid in\n               (select\
  \ empid\n                  from sasuser.flightschedule\n                  where\
  \ date='04mar2000'd\n                        and destination='CPH')) as c\n    \
  \  where m.jobcategory=c.jobcategory\n            and m.state=c.state;\n```\n\n\
  ![主管 ID、与机组成员匹配的职业类别和州](img/m71-34-g3.png) |\n\n注意两行包含相同的 `EmpID` 值：`1983`。这种重复两个两个机组成员有同一个经理。总而言，哥本哈根航班的六名机组成员共有五位主管。\n\
  \n### 查询 4：找到主管的名字\n\n查询 3 成为查询 4 中的子查询。查询 3 向查询 4 返回哥本哈根机组成员主管的员工编号（主管 ID）。查询 4\
  \ 选择主管的名字。\n\n```\nproc sql;\n  select firstname, lastname\n    from sasuser.staffmaster\
  \ \n    where empid in\n      (select empid\n        from sasuser.supervisors as\
  \ m,\n          (select substr(jobcode,1,2) \n                  as JobCategory,\
  \ \n                  state\n             from sasuser.staffmaster as s,\n     \
  \             sasuser.payrollmaster as p\n             where s.empid=p.empid\n \
  \                  and s.empid in\n               (select empid\n              \
  \   from sasuser.flightschedule\n                 where date='04mar2000'd\n    \
  \                   and destination='CPH'))\n                       as c\n     \
  \   where m.jobcategory=c.jobcategory\n              and m.state=c.state);\n```\n\
  \n![主管名字](img/m71-34-g4.png) |\n\n注意输出有五行，每个主管对应一行。主管的重复名字已被消除。技术 1 产生了一个包含内容的 `PROC\
  \ SQL` 查询：\n\n- 四个 `SELECT` 语句\n- 四个表，每个表单独读取。\n\n## 示例：技术 2 (PROC SQL 多路连接)\n\n\
  | Task | 列出 3 月 4 日航班的主管。 |\n| --- | --- |\n| Data | `Sasuser.Flightschedule (EmpID,\
  \ Date, Destination)` `Sasuser.Staffmaster (EmpID, FirstName, LastName, State)`\
  \ `Sasuser.Payrollmaster (EmpID, JobCode)` `Sasuser.Supervisors (EmpID, State, JobCategory)`\
  \ |\n\n注意：主管与他们监管的员工住在同一个州。每个州每个职业类别对应一名主管。你也可以通过自连接的多路连接（将表与其连接）来解决此问题。代码所示：\n\n\
  ```\nproc sql;\n   select distinct e.firstname, e.lastname\n      from sasuser.flightschedule\
  \ as a,\n           sasuser.staffmaster as b,\n           sasuser.payrollmaster\
  \ as c,\n           sasuser.supervisors as d,\n           sasuser.staffmaster as\
  \ e\n      where a.date='04mar2000'd and\n            a.destination='CPH' and\n\
  \            a.empid=b.empid and\n            a.empid=c.empid and\n            d.jobcategory=substr(c.jobcode,1,2)\n\
  \            and d.state=b.state\n            and d.empid=e.empid;\n```\n\n![输出：自连接的多路连接](img/m71-35-g1.png)\n\
  \n技术 2 使用多路连接提供了比技术 1 更高效的解决方案。在多路连接中，`PROC SQL` 每次连接两个表并按最高效顺序执行连接（该顺序最小化了笛卡尔积）。这种多路连接代码比技术\
  \ 1 的代码更难逐步构建。注意在此查询中 `Sasuser.Staffmaster` 被读取了两次：这就是自连接。如 `FROM` 子句所示，`Sasuser.Staffmaster`\
  \ 每次读取时都分配了不同的表别名：首先是 `b`，然后是 `e`。第一次读取（名为 `b`）是为了查找哥本哈根机组成员的州，第二次读取（名为 `e`）是为了查找主管的名字。\n\
  \n## 示例：技术 3（传统的 SAS 编程）\n\n| Task | 列出 3 月 4 日航班的主管名字。 |\n| --- | --- |\n| Data\
  \ | `Sasuser.Flightschedule (EmpID, Date, Destination)` `Sasuser.Staffmaster (EmpID,\
  \ FirstName, LastName, State)` `Sasuser.Payrollmaster (EmpID, JobCode)` `Sasuser.Supervisors\
  \ (EmpID, State, JobCategory)` |\n\n为了对比，请查看解决此问题的传统 SAS 编程。代码如下所示，其后是输出。\n\n\n\n\
  \n\n```sas\n/* 查找航班的机组。 */\n\nproc sort data=sasuser.flightschedule (drop=flightnumber)\n\
  \          out=crew (keep=empid);\n   where destination='CPH' and date='04MAR2000'd;\n\
  \   by empid;\nrun;\n\n/* 查找机组的州和职位代码。 */\n\nproc sort data=sasuser.payrollmaster\n\
  \               (keep=empid jobcode)\n          out=payroll;\n   by empid;\nrun;\n\
  \nproc sort data=sasuser.staffmaster\n             (keep=empid state firstname lastname)\n\
  \          out=staff;\n   by empid;\nrun;\n\ndata st_cat (keep=state jobcategory);\n\
  \   merge crew (in=c)\n         staff\n         payroll;\n   by empid;\n   if c;\n\
  \   jobcategory=substr(jobcode,1,2);\nrun;\n\n/* 查找主管 ID。 */\n\nproc sort\n    \
  \ data=st_cat;\n        by jobcategory state;\nrun;\n\nproc sort data=sasuser.supervisors\n\
  \          out=superv;\n   by jobcategory state;\nrun;\n\ndata super (keep=empid);\n\
  \   merge st_cat(in=s)\n         superv;\n   by jobcategory state;\n   if s;\nrun;\n\
  \n/* 查找主管的名字。 */\n\nproc sort data=super;\n   by empid;\nrun;\n\ndata names(drop=empid);\n\
  \   merge super (in=super)\n         staff (keep=empid firstname lastname);\n  \
  \ by empid;\n   if super;\nrun;\n\nproc print data=names noobs uniform;\nrun;\n\
  ```\n\n![传统的 SAS 编程](img/m71-36-g1.png)此输出与 `PROC SQL` 方法（技术 1 和 2）的输出并不相同。SQL 查询消除了此处看到的重复名称。当你使用技术\
  \ 3 时，可以通过在最后一个 `PROC SORT` 语句中添加 `NODUPKEY` 选项来消除重复项，如下所示：\n\n```sas\nproc sort\
  \ data=super nodupkey;\n```\n\n基于大型机批模式下的基准测试，与此非 SQL 程序相比，SQL 查询使用的 CPU 时间较少，但\
  \ I/O 操作更多。\n\n## 总结\n\n## 文本总结\n\n### 理解连接\n\n`PROC SQL` 连接是一种通过组合行来水平（并排）组合表的查询。连接的两种主要类型是内连接（inner\
  \ joins）和外连接（outer joins）。\n\n### 生成笛卡尔积\n\n当你在 `FROM` 子句中指定多个表但没有包含 `WHERE` 语句来划分数据集时，`PROC\
  \ SQL` 会返回表的笛卡尔积。在笛卡尔积中，第一个表中的每行都与第二个表中的每行组合。在所有类型的连接中，`PROC SQL` 都会首先生成笛卡尔积，然后删除不符合你指定的任何子集条件的行。\n\
  \n### 使用内连接\n\n内连接根据 `WHERE` 子句中指定的匹配标准（也称为连接条件），合并并显示来自第一个表的与第二个表的行相匹配的行。当连接的表包含具有相同名称的列时，你可能想要消除结果中的重复列，或指定列别名来重命名其中一个重复列。为了在内连接或任何\
  \ `PROC SQL` 步骤中引用表，你可以指定一个称为表别名的临时名称。\n\n### 使用外连接\n\n外连接根据指定的匹配标准（也称为连接条件），合并并显示跨表匹配的所有行，加上部分或全部不匹配的行。外连接有三种类型：\n\
  \n*   **左外连接**（left outer join）根据指定的匹配标准（连接条件）检索所有跨表匹配的行，加上来自左表（`FROM` 子句中指定的第一个表）的不匹配行。\n\
  \n*   **右外连接**（right outer join）根据指定的匹配标准（连接条件）检索所有跨表匹配的行，加上来自右表（`FROM` 子句中指定的第一个表*）的不匹配行。\n\
  \n*   **全外连接**（full outer join）从两个表中同时检索匹配和不匹配的行。\n\n### 使用外连接风格语法创建内连接\n\n如果你想对所有连接使用一致的语法，可以使用与外连接相同的语法风格编写内连接。\n\
  \n### 比较 SQL 连接和 DATA 步骤匹配合并\n\n`DATA` 步骤匹配合并和 `PROC SQL` 连接可以产生相同的结果，尽管这两种技术之间存在重要的差异。\n\
  \n*   当 `BY` 变量（列）的所有值都匹配且没有重复的 `BY` 变量时，你可以使用 `PROC SQL` 内连接。\n\n*   当只有部分 `BY`\
  \ 变量的值匹配时，你可以使用 `PROC SQL` 全外连接。为了重叠公共列，你必须在 `PROC SQL` 连接中配合 `COALESCE` 函数。\n\n\
  ### 使用内联视图\n\n内联视图（in-line view）是出现在 `FROM` 子句中的子查询。内联视图从一个或多个表中选择数据生成临时（或虚拟）表，外部查询使用该表选择输出数据。你可以与其他视图或其他表引用内联视图，在内联视图中引用多个表，并为内联视图分配别名。\n\
  \n### 连接多个表和视图\n\n当你执行组合两个以上表或视图的复杂查询时，你可能需要在几种技术之间进行选择。\n\n## 示例程序\n\n### 使用内连接合并表\n\
  \n```sas\nproc sql outobs=15;\ntitle '纽约员工';\n   select substr(firstname,1) || '\
  \ ' || lastname \n          as Name,\n          jobcode,\n          int((today()\
  \ - dateofbirth)/365.25) as Age\n      from payrollmaster as p,\n           staffmaster\
  \ as s\n      where p.empid=s.empid and state='NY'\n      order by 2, 3;\nquit;\n\
  ```\n\n### 使用左连接合并表\n\n```sas\nproc sql outobs=20;\ntitle '所有航班';\n   select m.date,\n\
  \          m.flightnumber as='Flight Number',\n          m.destination as='Left',\n\
  \          f.destination as='Right',\n          delay as='Delay in Minutes'\n  \
  \    from marchflights as m \n           left join \n           flightdelays as\
  \ f\n      on m.date=f.date and m.flightnumber=f.flightnumber\n      order by delay;\n\
  quit;\n```\n\n### 在全连接中重叠公共列\n\n```sas\n proc sql;\n    select coalesce(p.empid,\
  \ s.empid) \n           as ID, firstname, lastname, gender\n       from payrollmaster\
  \ as p \n               full join \n            staffmaster as s\n       on p.empid\
  \ = s.empid\n       order by id;\nquit;\n```\n\n### 使用子查询和内联视图连接表\n\n```sas\n proc\
  \ sql;\n    select empid\n       from supervisors as m,\n          (select substr(jobcode,1,2)\
  \ as JobCategory,\n                  state\n             from staffmaster as s,\n\
  \                  payrollmaster as p\n             where s.empid=p.empid and s.empid\
  \ in\n                (select empid\n                   from flightschedule\n  \
  \                 where date='04mar2000'd\n                         and destination='CPH'))\
  \ as c\n       where m.jobcategory=c.jobcategory\n              and m.state=c.state;\n\
  quit;\n```\n\n## 注意事项\n\n*   大多数情况下，多个表的所有组合不会产生有用结果，因此笛卡尔积很少是你想要的查询结果。\n\n*   单个内连接的最大表数取决于你的\
  \ SAS 版本。如果连接涉及视图，的是视图底层表的数量，而不是视图的数量。外连接一次只能对两个表或视图进行。\n\n# 练习\n\n为每个问题选择最佳答案。完成测验后，使用附录中的答案对照检查你的答案。\n\
