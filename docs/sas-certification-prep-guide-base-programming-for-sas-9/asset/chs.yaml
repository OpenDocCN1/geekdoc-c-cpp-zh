  \ `PROC SQL` 为消除重复行而对数据的额外扫描。单独使用 `EXCEPT` 也会产生问题中指定的输出。\n\n8. 正确答案：c 集合运算符 `UNION`\
  \ 返回两个表合并行集中所有唯一的行。\n\n9. 正确答案：c 集合运算符 `INTERSECT` 返回两个表共有的行。指定关键字 `ALL` 抑制 `PROC\
  \ SQL` 为消除重复行而对数据的额外扫描。\n\n10. 正确答案：a `DATA` 步骤返回第一表的所有行以及第二个表的所有行，并保持 `BY` 语句指定的顺序。默认情况下同名列会重叠。`OUTER\
  \ UNION` 运算符返回两个表的所有行。`CORR` 关键字导致同名列重叠。\n\n# 第 5 章：使用 PROC SQL 创建和管理表\n\n1. 正确答案：b\
  \ 包含 `LIKE` 子句的 `CREATE TABLE` 语句将现有表的列和属性复制到新表中。不插入任何数据行。\n\n2. 正确答案：a 包含 `AS`\
