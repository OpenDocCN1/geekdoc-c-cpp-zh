  -   如果文件结构是动态的，请使用数据视图。\n-   创建数据视图合并多个数据集。\n-   创建数据视图访问频繁使用的子集。\n\n## 总结\n\n##\
  \ 减少字符变量的空间\n\nSAS 以每个字节一个字符存储数据。你可以使用 `LENGTH` 语句减少字符变量的长度。你还可以使用其他技术来减少字符数据空间。\n\
  \n## 减少数值变量的空间\n\nSAS 以浮点表示存储数值数据。数值变量的默认长度为 8 字节。你可以使用 `LENGTH`语句减少数值变量的长度。与读取全长度数值变量相比，读取短长度数值变量需要更少的\
  \ I/O 但更多的 CPU 资源。你可以使用 `PROC COMPARE` 查看精度损失。\n\n## 压缩数据文件\n\n默认情况下，SAS 数据文件是不压缩的。你可以压缩数据文件以节省空间，尽管某些文件不是良好的压缩对象。使用\
  \ `COMPRESS=` 数据选项或系统选项压缩数据文件。使用 `POINBS=YES` 数据选项允许 SAS 直接访问压缩文件而非顺序访问。使用 `REUSE=YES`\
  \ 数据选项或系统选项指定 SAS 在添加或更新观测值时重用压缩文件的空间。\n\n## 使用 SAS DATA 视图节省存储\n\n你可以将数据保留在原始存储位置，并使用\
  \ SAS 数据视图访问数据以减少磁盘所需的空间。DATA 视图是在 `DATA` 步中使用 `VIEW=` 选项创建的特定类型视图。使用 `DESCRIBE`\
  \ 语句将数据视图的代码写入 SAS 日志。使用 DATA 视图而不是数据文件的优点之一是它们始终访问动态文件的最新数据，并且所需的磁盘空间较少。然而，这对性能可能会影响\n\
  \n# 测试\n\n为每个问题选择最佳答案。完成测试后，使用附录中的答案检查你的答案。\n\n1.  关于未压缩 SAS 数据文件，以下哪个是正确的？\n  \
  \  1. 描述部分存储在任何足够的空间的页面上。\n    2. 新观测值总是添加到第一个足够的可用空间。\n    3. 已删除的观测值空间会被跟踪。\n\
  \    4. 新观测值总是添加到数据集的末尾。\n\n2.  关于压缩 SAS 数据文件，以下哪个是正确的？\n\n\n\n\n\n1. 描述符部分存储在任何具有足够空间的数据页上。\n\
  2. 已删除的观测空间可以被重用。\n3. 压缩的 SAS 数据文件比未压缩的 SAS 数据具有更小的开销。\n4. 在压缩的 SAS 数据集中，每个观测值的大小必须相同。\n\
  \n3. 下面哪个程序正确地创建了长度减少的数值型变量？\n1. ```sas\ndata temp;\n   infile file1;\n   input\
  \ x 4.\n         y 3.\n         z 2.;\n run;\n```\n2. ```sas\ndata temp;\n   format\
  \ x 4.\n          y 3.\n          z 2.;\n   infile file1;\n   input x 4.\n     \
  \    y 3.\n         z 2.;\nrun;\n```\n3. ```sas\ndata temp;\n   length x 4\n   \
  \       y 3\n          z 2;\n   infile file1;\n   input x 4.\n         y 3.\n  \
  \       z 2.;\n run;\n```\n4. ```sas\ndata temp;\n   informat x 4.\n           \
  \ y 3.\n            z 2.;\n   infile file1;\n   input x 4.\n         y 3.\n    \
  \     z 2.;\nrun;\n```\n\n4. 关于 SAS 数据视图（data views）的以下陈述哪个是正确的？\n1. SAS 数据视图比 SAS\
  \ 数据文件占用更磁盘空间，但消耗更多 CPU 资源。\n2. SAS 数据视图只能在永久性 SAS 库中创建。\n3. SAS 数据视图比 SAS 数据文件消耗更\
  \ CPU 资源，但占用更多的磁盘空间。\n4. SAS 数据视图只能在临时 SAS 库中创建。\n\n5. 你应该使用以下哪个程序来检测 `Company.Regular`\
  \ 中默认长度数值型变量与数据集 `Company.Reduced` 中长度减少的数值型变量之间是否存在精度损失？\n1. ```sas\nproc contents\
  \ data=company.regular;\n   compare data=company.reduced;\nrun;\n```\n2. ```sas\n\
  proc compare base=company.regular\n   compare=company.reduced;\nrun;\n```\n3. ```sas\n\
  proc print data=company.regular;\nrun;\n\nproc print data=company.reduced;\nrun;\n\
  ```\n4. ```sas\nproc datasets library=company;\n   contents data=regular compare=reduced;\n\
  run;\n```\n\n# 第 22 章：使用最佳实践\n\n## 概述\n\n## 引言\n本章演示了如何使用 SAS 最佳编程实践来优化性能。在比较本章描述的技术时，请记住，资源使用的差异受你所工作的操作环境以及数据特征的影响。每个主题都包含了可以提高程序效率的示例。编写程序来生成你自己的基准测试，并采用能为你节省最多开的编程技术。注意：本章不涵盖\
  \ SAS 可扩展性能数据引擎（SAS SPD Engine），这是一种用于线程处理的 SAS 9.1 技术。关于使用 SAS SPD Engine 提高性能的详情，请参阅\
  \ SAS 文档。\n\n# 执行必要的语句\n\n## 概述\n当以最有效的顺序执行最少量的语句时，你可以减少 SAS 使用的硬件资源。受影响的资源包括磁盘占用、内存使用和\
  \ CPU 使用。这里有两个需要记住的技巧：\n* 在逻辑允许的情况下对数据进行子集划分。\n* 使用最合适的技术根据条件条件处理你的数据。\n\n## 子集划分\
  \ IF 语句的位置\n为了根据新派生或计算的变量对数据进行子集划分，请在 `DATA` 步中使用子集 IF 语句，以便仅处理符合特定条件的观测值。子集 IF\
  \ 语句会导致 `DATA` 步继续处理满足该语句中指定的表达式条件的观测值。生成的 SAS 数据集或数据集包含原始外部文件或 SAS 数据集的子集。将子集 IF\
  \ 语句放置在程序中，使其在逻辑允许的情况下尽快检查子集条件。结果是不必要的语句将不会执行。当子集条件为假时，该观测值将不再处理后续语句。此外，请记住在执行计算之前对数据进行子集划分，并尽量减少函数调用或算术运算符的使用。对不需要的观测值进行不必要的处理会导致硬件资源的消耗。\n\
  \n## 比较示例：创建数据子集\n\n## 概述\n假设你想通过读取 SAS 数据 `Retail.Order_fact` 创建数据子集，计算六个新变量并根据条件输出数据。输出数据集应包含以下内容的新变量：\n\
  * 订单月份\n* 订单日期与交付日期之间的时间\n* 基于零售价、折扣和单价的利润\n* 总利润\n* 总折扣\n* 总等待时间\n仅包含 12 月订单的数据子集约占数据的\
  \ 10%。你可以通过子集 IF 语句完成此任务。该语句在 `DATA` 步中的位置会影响 `DATA` 步在 CPU 时间和实时方面的效率。以下示例程序比较了两种技术。你可以将这些示例作为模型在你自己的环境中创建基准测试程序。你的结果可能会根据数据结构、操作环境以及你所在地的可用资源而异。\n\
  \n### 编程技术\n\n#### 底部的子集 IF 语句\n该程序在子集 IF 语句选择 `Month` 值为 12 的观测值之前，计算了六个新变量。\n\n\
  ```sas\ndata profit;\n   retain TotalProfit TotalDiscount TotalWait Count 0;   \
  \ \n   set retail.order_fact;\n   MonthOfOrder=month(order_date);\n   WaitTime=sum(delivery_date,-order_date);\n\
  \   if discount gt . then\n      CalcProfit=sum((total_retail_price*discount),-costprice_per_unit)\n\
  \                 *quantity;\n   else CalcProfit=sum(total_retail_price,-costprice_per_unit)\n\
  \                 *quantity;\n   TotalProfit=sum(totalprofit,calcprofit);\n   TotalDiscount=sum(totaldiscount,discount);\n\
  \   TotalWait=sum(totalwait,waittime);\n   Count+1;    \n   if monthoforder=12;\n\
  run;\n```\n\n#### 顶部的子集 IF 语句\n在该程序中，子集 IF 语句位于计算出 `MonthofOrder` 值之后之后。如果该值不是 12，则对该观测值不再处理后续语句。在该程序中，计算在较少的观测值上进行，从而产生了更高的程序效率。\n\
  \n\n\n\n\n```\ndata profit;\n   retain TotalProfit TotalDiscount TotalWait Count\
  \ 0;  \n   set retail.order_fact;\n   MonthOfOrder=month(order_date);\n   if monthoforder=12;\n\
  \   WaitTime=sum(delivery_date,-order_date);\n   if discount gt . then\n      CalcProfit=sum((total_retail_price*discount),-costprice_per_unit)\n\
  \                 *quantity;\n   else CalcProfit=sum(total_retail_price,-costprice_per_unit)\n\
  \                 *quantity;\n   TotalProfit=sum(totalprofit,calcprofit);\n   TotalDiscount=sum(totaldiscount,discount);\n\
  \   TotalWait=sum(totalwait,waittime);\n   Count+1;\nrun;\n```\n\n|\n\n## 高效使用条件逻辑\n\
  \n你可以使用条件逻辑来改变 SAS 处理可选观测的方式。两种技术——`IF-THEN/ELSE` 语句和 `SELECT` 语句可以交叉使用且性能相当。根据你的数据特征并取决于你的环境，其中一种技术可能会为你提供更好的性能。选择一种能够节省你编程时间并使程序最易读的技术。注意：测试的条件数量以及测试的变量类型会影响\
  \ CPU 资源。为了最佳实践，请遵循以下指南编写高效的 `IF/THEN` 或 `SELECT` 语句逻辑：\n\n*   在使用 `IF/THEN` 语句处理互斥条件时，除第一个条件外的所有条件请使用\
  \ `ELSE IF` 语句而非 `IF` 语句。\n*   首先检查频率最高的条件，并按频率降序继续检查条件。\n*   当你根据条件执行多个语句时，将这些语句放在\
  \ `DO` 组中。\n\n在编写条件逻辑之前，确定你的数据值的分布。你可以使用以下过程：\n\n*   `FREQ` 过程检查数据值的分布\n*   `GCHART`\
  \ 或 `GPLOT` 过程以图形形式显示分布\n*   `UNIVARIATE` 过程检查分布统计并以图形形式显示信息\n\n## 对比示例：使用 DO 组条件地创建变量\n\
  \n## 概述\n\n假设你想根据数据集 `Retail.Order_fact` 中变量 `Order_Type` 的值来计算调整后的利润。对于值为 1 的零售销售，调整后的利润应计算为利润的\
  \ 105%。对于值为 2 的目录销售，调整后的利润应计算为利润的 103%。对于值为 3 的互联网销售，调整后的利润应等于利润。下表显示变量 `Order_Type`\
  \ 的值并非均匀分布。![使用 DO 组条件地创建变量](img/m83-7-g1.png) 下表显示变量 `Discount` 的值也不是均匀分布。![使用\
  \ DO 组条件地创建变量](img/m83-7-g2.png) 以下示例程序比较了两种技术。你可以将这些示例作为模型，在你自己的环境中创建基准程序。你的结果可能会根据你的数据结构、操作系统环境以及你所在地的资源而有所不同。\n\
  \n### 编程技术\n\n| ![1](img/callout01.png) IF-THEN/ELSE 语句此程序使用 `IF-THEN/ELSE` 语句结合\
  \ `DO` 组，有条件地执行多个计算调整后利润的语句。条件按频率降序检查。 \n\n```\ndata retail.order_info_1;\n   set\
  \ retail.order_fact;\n   if order_type=1 then \n      do;                     /*\
  \ 零售销售 */\n         Float=delivery_date-order_date;\n         RevenueQuarter=qtr(order_date);\n\
  \         AveragePrice=total_retail_price/quantity;\n         if discount=. then\
  \ NetPrice=total_retail_price;\n         else NetPrice=total_retail_price-discount;\n\
  \         Profit=netPrice-(quantity*costprice_per_unit)*1.05;\n      end;\n   else\
  \ if order_type=2 then\n      do;                    /* 目录销售 */\n         Float=delivery_date-order_date;\n\
  \         RevenueQuarter=qtr(order_date);\n         AveragePrice=total_retail_price/quantity;\n\
  \         if discount=. then NetPrice=total_retail_price;\n         else NetPrice=total_retail_price-discount;\n\
  \         Profit=netprice-(quantity*costprice_per_unit)*1.03;\n      end;\n   else\
  \ \n      do;                    /* 互联网销售 */\n         Float=delivery_date-order_Date;\n\
  \         RevenueQuarter=qtr(order_date);\n         AveragePrice=total_retail_price/quantity;\n\
  \         if discount=. then NetPrice=total_retail_price;\n         else NetPrice=total_retail_price-discount;\n\
  \         Profit=netprice-(quantity*costprice_per_unit);\n      end;\nrun;\n```\n\
  \n |\n\n| ![2](img/callout02.png) SELECT 语句此程序使用 `SELECT` 和 `WHEN` 语句结合 `DO` 组，有条件地执行多个计算调整后利润的语句。条件按频率降序检查。\
  \ \n\n```\ndata retail.order_info_2;\n   set retail.order_fact;\n   select(order_type);\n\
  \      when (1)\n          do;                                    /* 零售销售 */\n \
  \           Float=delivery_date-order_date;\n            RevenueQuarter=qtr(order_date);\n\
  \            AveragePrice=total_retail_price/quantity;\n            if discount=.\
  \ then NetPrice=total_retail_price;\n            else NetPrice=total_retail_price-discount;\n\
  \            Profit=netprice-(quantity*costprice_per_unit)*1.05;\n         end;\n\
  \      when (2)\n          do;                                   /* 目录销售 */\n  \
  \          Float=delivery_date-order_date;\n            RevenueQuarter=qtr(order_date);\n\
  \            AveragePrice=total_retail_price/quantity;\n            if discount=.\
  \ then NetPrice=total_retail_price;\n            else NetPrice=total_retail_price-discount;\n\
  \            Profit=netprice-(quantity*costprice_per_unit)*1.03;\n         end;\n\
  \      otherwise\n         do;                                  /* 互联网销售 */\n  \
  \          Float=delivery_date-order_date;\n            RevenueQuarter=qtr(order_date);\n\
  \            AveragePrice=total_retail_price/quantity;\n            if discount=.\
  \ then NetPrice=total_retail_price;\n            else NetPrice=total_retail_price-discount;\n\
  \            Profit=netprice-(quantity*costprice_per_unit);\n         end;\n   end;\n\
  run;\n```\n\n## 通用建议\n\n*   无论使用 `IF-THEN/ELSE` 还是 `SELECT` 和 `WHEN` 语句，首先检查频率最高的条件，并按频率降序继续检查条件。\n\
  *   当你根据条件执行多个语句时，将这些语句放在 `DO` 组中。\n\n## 对比示例：调用函数条件地创建变量\n\n## 概述\n\n假设你想创建一个报告，其中包含一个基于\
  \ SAS 数据集 `Retail.Order_fact` 中现有变量的新变量。新 `Month` 变量的值是通过使用 `MONTH` 函数从现有变量 `Order_Date`\
  \ 中提取的。下表显示 `Month` 的值分布均匀。![调用函数条件地创建变量](img/m83-9-g1.png)\n\n\n\n\n\n```\ndata\
  \ retail.orders;\n   set retail.order_fact;\n   if month(order_date)=1 then Month='Jan';\n\
  \   if month(order_date)=2 then Month='Feb';\n   if month(order_date)=3 then Month='Mar';\n\
  \   if month(order_date)=6 then Month='Jun';\n   if month(order_date)=7 then Month='Jul';\n\
  \   if month(order_date)=8 then Month='Aug';\n   if month(order_date)=9 then Month='Sep';\n\
  \   if month(order_date)=10 then Month='Oct';\n   if month(order_date)=11 then Month='Nov';\n\
  \   if month(order_date)=12 then Month='Dec';\nrun;\n```\n\n|\n\n| ![2](img/callout02.png)\
  \ ELSE IF 语句，多次函数引用此程序使用了调用 `MONTH()` 函数的 `ELSE IF` 语句。一旦找到真条件，后续的 `ELSE IF` 语句将不再执行。这比使用并行的\
  \ `IF` 语句效率更高，但 `MONTH()` 函数被执行了多次。 |\n\n```\ndata retail.orders;\n   set retail.order_fact;\n\
  \   if month(order_date)=1 then Month='Jan';\n   else if month(order_date)=2 then\
  \ Month='Feb';\n   else if month(order_date)=3 then Month='Mar';\n   else if month(order_date)=4\
  \ then Month='Apr';\n   else if month(order_date)=5 then Month='May';\n   else if\
  \ month(order_date)=6 then Month='Jun';\n   else if month(order_date)=7 then Month='Jul';\n\
  \   else if month(order_date)=10 then Month='Oct';\n   else if month(order_date)=11\
  \ then Month='Nov';\n   else if month(order_date)=12 then Month='Dec';\nrun;\n```\n\
  \n |\n\n| ![3](img/callout03.png) ELSE IF 语句，单次函数引用此程序使用 `MONTH()` 函数查找 `Order_Date`\
  \ 的值，但只调用一次。`MONTH()` 函数在读取数据集后、在任何 `IF-THEN/ELSE` 语句执行之前立即调用。这种做法是高效的。 |\n\n```\n\
  data retail.orders(drop=mon);\n   set retail.order_fact;\n   mon=month(order_date);\n\
  \   if mon=1 then Month='Jan';\n   else if mon=2 then Month='Feb';\n   else if mon=3\
  \ then Month='Mar';\n   else if mon=4 then Month='Apr';\n   else if mon=5 then Month='May';\n\
  \   else if mon=6 then Month='Jun';\n   else if mon=7 then Month='Jul';\n   else\
  \ if mon=8 then Month='Aug';\n   else if mon=9 then Month='Sep';\n   else if mon=10\
  \ then Month='Oct';\n   else if mon=11 then Month='Nov';\n   else if mon=12 then\
  \ Month='Dec';\nrun;\n```\n\n |\n\n| ![4](img/callout04.png) SELECT 分组在此程序中，`SELECT`\
  \ 语句在 `WHEN` 语句执行并为 `Month` 赋值之前，仅调用了一次 `MONTH()` 函数。这种做法是高效的。 |\n\n```\ndata retail.orders;\n\
  \   set retail.order_fact;\n   select(month(order_date));\n      when (1) Month='Jan';\n\
  \      when (2) Month='Feb';\n      when (3) Month='Mar';\n      when (4) Month='Apr';\n\
  \      when (5) Month='May';\n      when (6) Month='Jun';\n      when (7) Month='Jul';\n\
  \      when (8) Month='Aug';\n      when (11) Month='Nov';\n      when (12) Month='Dec';\n\
  \      otherwise;\n   end;\nrun;\n```\n\n |\n\n### 一般建议\n\n- 避免使用并行的 `IF` 语句，这种方式消耗资源最多，是条件执行语句效率最低的方法。\n\
  - 使用 `IF-THEN/ELSE` 语句和 `SELECT` 块来提高效率。\n- 为了显著减少资源消耗，请编写只调用一次函数的程序，而不是在许多语句中重复使用同一个函数。SAS\
  \ 函数虽然方便，但在 CPU 资源方面可能代价昂贵。\n\n## 高效使用 DO 组\n\n你可以通过将必要的语句放在与 `IF-THEN/ELSE` 语句或\
  \ `SELECT/WHEN` 语句相关的 `DO` 组中，从而根据条件执行必要的语句。语句组仅在特定条件为真时执行。在使用 `IF-THEN/ELSE` 语句配合\
  \ `DO` 组时，在 `THEN` 子句之后添加 `DO`，并在所有想要分组执行的语句之后添加 `END` 语句。\n\n```\ndata orders;\n\
  \   set company.orders;\n   if order_type = 1 then \n      do;\n      <此处有多个可执行语句>\n\
  \      end;\n   else if order_type = 2 then \n      do;\n      <此处有多个可执行语句>\n  \
  \     end;\n   else if order_type = 3 then \n       do;\n       <此处有多个可执行语句>\n \
  \      end;\nrun;\n```\n\n注意：根据条件创建多个变量时，请使用 `IF-THEN DO` 组。在使用带有 `SELECT/WHEN`\
  \ 语句的 `DO` 组时，在 `WHEN` 条件之后添加 `DO`，并在所有想要执行的语句之后添加 `END` 语句。使用 `OTHERWISE` 语句来指定未满足任何\
  \ `WHEN` 条件时执行的语句。\n\n```\ndata orders;\n   set company.orders;\n   select(order_type)\n\
  \      when (1) \n         do;\n         end;\n      when (2) \n         do;\n \
  \        end;\n      when (3) \n         do;\n         end;\n      otherwise;\n\
  \   end;\nrun;\n```\n记住 `IF-THEN/ELSE` 和 `SELECT/WHEN` 需要对应的语句。\n\n## 比较示例：使用 DO\
  \ 组创建数据\n\n## 概述\n\n假设你想根据数据集识别哪些客户组是 `Club Members`、`Club Gold Members` 或 `Internet/Catalog`。你还想根据活动性质识别\
  \ `inactive`、`low activity`、`medium activity` 或 `high activity`。![创建数据](img/m8-12-g1)\
  \ 以下示例比较了不同的技术。你可以将这些示例作为你自己环境的参考。\n\n### 编程技术\n\n| ![1](img/callout01.png) 并行 IF\
  \ 语句此程序通过读取 `Customer_hybrid` 数据集创建一个名为 `Retail.Customers` 的永久 SAS 数据集。串行 `IF` 语句用于填充\
  \ `Customer_Group` 和 `Customer_Activity` 变量。 |\n\n```\ndata retail.customers;\n\
  \   length Customer_Group $26 Customer_Activity $15;\n   set retail.customer_hybrid;\n\
  \   if substr(put(customer_type_ID,4),1,2)='10' then\n      customer_group='Orion\
  \ Club members';\n   if substr(put(customer_type_ID,4),1,2)='20' then\n      customer_group='Orion\
  \ Club Gold members';\n   if substr(put(customer_type_ID,4),1,2)='30' then\n   \
  \   customer_group='Internet/Catalog Customers';\n   if substr(put(customer_type_ID,4),1,2)\
  \ in ('10', '20') and\n      substr(put(customer_type_ID,4),3,2)='10' then\n   \
  \      customer_activity='inactive';\n   if substr(put(customer_type_ID,4),1,2)\
  \ in ('10', '20') and\n      substr(put(customer_type_ID,4),3,2)='20' then\n   \
  \      customer_activity='low activity';\n   if substr(put(customer_type_ID,4),1,2)\
  \ in ('10', '20') and\n      substr(put(customer_type_ID,4),3,2)='30' then\n   \
  \      customer_activity='medium activity';\n   if substr(put(customer_type_ID,4),1,2)\
  \ in ('10', '20') and\n      substr(put(customer_type_ID,4),3,2)='40' then\n   \
  \      customer_activity='high activity';\nrun;\n```\n\n |\n\n| ![2](img/callout02.png)\
  \ SELECT, IF/SELECT 语句此程序通过读取 `Customer_hybrid` 数据集创建一个名为 `Retail.Customers` 的永久\
  \ SAS 数据集。`SELECT/WHEN` 逻辑和 `IF/THEN DO` 组中的 `SELECT/WHEN` 语句用于填充 `Customer_Group`\
  \ 和 `Customer_Activity` 变量。如果 `Customer_Type_ID` 的前两位是 `10`、`20` 或 `30`，则填充 `Customer_Group`。如果\
  \ `Customer_Type_ID` 的前两位是 `10` 或 `20`，则通过读取 `Customer_Type_ID` 的后两位来填充 `Customer_Activity`。\
  \ |\n\n\n\n\n```\ndata retail.customers;\n   length Customer_Group $ 26 Customer_Activity\
  \ $ 15;\n   set retail.customer_hybrid;\n      select(substr(put(customer_type_ID,4.),1,2));\n\
  \         when ('10') customer_group='Orion Club members';\n         when ('20')\
  \ customer_group='Orion Club Gold members';\n         when ('30') customer_group='Internet/Catalog\
  \ Customers';\n         otherwise;\n      end;\n   if substr(put(customer_type_ID,4.),1,2)\
  \ in ('10', '20') then\n      do;\n         select(substr(put(customer_type_ID,4.),3,2));\n\
  \            when ('10') customer_activity='inactive';\n            when ('20')\
  \ customer_activity='low activity';\n            when ('30') customer_activity='medium\
  \ activity';\n            when ('40') customer_activity='high activity';\n     \
  \       otherwise;\n         end;\n      end;\nrun;\n```\n\n## 嵌套 SELECT 语句\n该程序通过读取\
  \ `Retail.Customer_hybrid` 数据集创建一个名为 `Retail.Customers` 的永久 SAS 数据集。嵌套的 `SELECT`\
  \ 语句用于填充 `Customer_Group` 和 `Customer_Activity` 变量。\n\n```sas\ndata retail.customers;\n\
  \   length Customer_Group $ 26 Customer_Activity $ 15;\n   set retail.customer_hybrid;\n\
  \   select(substr(put(customer_type_ID,4.),1,2));\n      when ('10')\n         do;\n\
  \            customer_group='Orion Club members';\n            select(substr(put(customer_type_ID,4.),3,2));\n\
  \               when ('10') customer_activity='inactive';\n               when ('20')\
  \ customer_activity='low activity';\n               when ('30') customer_activity='medium\
  \ activity';\n               when ('40') customer_activity='high activity';\n  \
  \             otherwise;\n            end;\n         end;\n      when ('20')\n \
  \        do;\n            customer_group='Orion Club Gold members';\n          \
  \  select(substr(put(customer_type_ID,4.),3,2));\n               when ('10') customer_activity='inactive';\n\
  \               when ('20') customer_activity='low activity';\n               when\
  \ ('30') customer_activity='medium activity';\n               when ('40') customer_activity='high\
  \ activity';\n               otherwise;\n            end;\n         end;\n     \
  \ when ('30') customer_group='Internet/Catalog Customers';\n      otherwise;\n \
  \  end;\nrun;\n```\n\n## 带有链接的 IF-THEN/ELSE IF 语句\n该程序通过读取 `Retail.Customer_hybrid`\
  \ 数据集创建一个名为 `Retail.Customers` 的永久 SAS 数据集。使用带有链接的 `IF-THEN/ELSE IF` 语句填充 `Customer_Group`\
  \ 和 `Customer_Activity` 变量。\n\n```sas\ndata retail.customers;\n   length Customer_Group\
  \ $ 26 Customer_Activity $ 15;\n   set retail.customer_hybrid;\n   if substr(put(customer_type_ID,4.),1,2)='10'\
  \ then\n      do;\n         customer_group='Orion Club members';\n         link\
  \ activity;\n      end;\n   else if substr(put(customer_type_ID,4.),1,2)='20' then\n\
  \      do;\n         customer_group='Orion Club Gold members';\n         link activity;\n\
  \      end;\n   else if substr(put(customer_type_ID,4.),1,2)='30' then\n      customer_group='Internet/Catalog\
  \ Customers';\n   return;\n   activity:\n   if substr(put(customer_type_ID,4.),3,2)='10'\
  \ then\n      customer_activity='inactive';\n   else if substr(put(customer_type_ID,4.),3,2)='20'\
  \ then\n      customer_activity='low activity';\n   else if substr(put(customer_type_ID,4.),3,2)='30'\
  \ then\n      customer_activity='medium activity';\n   else if substr(put(customer_type_ID,4.),3,2)='40'\
  \ then\n      customer_activity='high activity';\n   return;\nrun;\n```\n\n### 一般建议\n\
  - 避免并行的 `IF` 语句，因为它们会消耗额外的资源。\n\n# 消除不必要的数据扫描\n最佳实践规定，你应该消除不必要的数据扫描。为了最大限地减少 I/O\
  \ 操作和 CPU 时间，请避免比必要的多次读取或写入数据。\n\n## 比较示例：创建 SAS 数据集的多个子集\n\n## 概述\n假设你想从 `Retail.Customer`\
  \ 数据集中创建五个子集。你需要为五个国家中的每个国家创建一个子集。以下示例程序比较了两种技术。你可以将这些示例作为在你自己的环境中创建基准程序的模型。你的结果可能会取决于数据结构、操作系统环境以及你所在地的可用资源。\n\
  \n### 编程技术\n\n#### 1. 多个 DATA 步\n该程序包含多个 `DATA` 步，并随后从同一个 `Retail.Customer` 数据集中读取了五次数据。各个子集\
  \ `IF` 语句出现在五个独立的 `DATA` 步中。\n\n```sas\ndata retail.UnitedStates;\n   set retail.customer;\n\
  \   if country='US';\nrun;\n\ndata retail.France;\n   set retail.customer;\n   if\
  \ country='FR';\nrun;\n\ndata retail.Italy;\n   set retail.customer;\n   if country='IT';\n\
  run;\n\ndata retail.Germany;\n   set retail.customer;\n   if country='DE';\nrun;\n\
  \ndata retail.Spain;\n   set retail.customer;\n   if country='ES';\nrun;\n```\n\n\
  #### 2. 单独 DATA 步\n该程序使用单个 `DATA` 步创建五个输出。`Retail.Customer` 数据集仅读取了一次。使用 `IF-THEN/ELSE`\
  \ 语句输出到特定的数据集。\n\n```sas\ndata retail.UnitedStates \n     retail.France \n     retail.Italy\
  \ \n     retail.Germany \n     retail.Spain;\n   set retail.customer;\n   if country='US'\
  \ then output retail.UnitedStates;\n   else if country='FR' then output retail.France;\n\
  \   else if country='IT' then output retail.Italy;\n   else if country='DE' then\
  \ output retail.Germany;\n   else if country='ES' then output retail.Spain;\nrun;\n\
  ```\n\n#### 3. 使用 WHERE 语句的 SORT 过程\n良好的编程习惯是利用 `SORT` 过程在同一个步骤中进行排序和筛选的能力。这比使用两个独立的步骤（一个\
  \ `DATA` 步后接一个 `procedure` 步）更高效。\n\n```sas\nproc sort data=retail.customer out=retail.CountrySubset;\n\
  \   by country;\n   where country in('US','FR','IT','DE','ES');\nrun;\n```\n\n###\
  \ 一般建议\n当从数据集创建多个子集时，使用带有 `IF-THEN/ELSE` 逻辑的单个 `DATA` 步输出到适当的数据集。\n\n\n\n\n*   当你需要用过程处理数据的子集时，请在过程中使用\
  \ `WHERE` 语句，而不是创建一个数据的子集后再用过程读取该数据。\n*   编写一个既能排序又提取子集的程序步骤。这种方法比编写两个单独的提取子集和排序的程序步骤更节省程序员的时间和调试时间。\n\
  \n## 使用 DATASETS 过程修改变量属性\n\n使用 `PROC DATASETS` 代替 `DATA` 步来修改数据属性。`PROC DATASETS`\
  \ 过程比 `DATA` 步消耗的资源更少，因为它只处理数据集的描述符部分，而不处理数据部分。`PROC DATASETS` 会保留排序标记以及索引。注意：你无法使用\
  \ `DATASETS` 过程来修改变量的类型、长度或位置，因为这些属性会直接影响数据集的数据部分。要执行这些操作，请使用 `DATA` 步。\n\n## 比较示例：更改\
  \ SAS 数据集的变量属性\n\n## 概述\n\n假设你想更改 `Retail.NewCustomer` 中的变量属性，使其使其与 `Retail.Customer`\
  \ 数据集中的属性保持一致。`Retail.NewCustomer` 数据集包含 89954 条观测值和 12 个变量。下表显示了每个 SAS 数据集的变量名和格式。\n\
  \n| SAS 数据集 | 变量名 | 变量格式 |\n| --- | --- | --- |\n| `Retail.Customer` | `Country`\
  \ | `$COUNTRY.` |\n| `Retail.Customer` | `Birth_Date` | `DATE9.` |\n| `Retail.NewCustomer`\
  \ | `Country_ID` | `$COUNTRY.` |\n| `Retail.NewCustomer` | `Birth_Date` | `MMDDYYP10`\
  \ |\n\n以下示例程序比较了两技术。你可以将这些示例作为在你自己的环境中创建基准程序的模型。你的结果可能会取决于数据的结构、操作系统环境以及你所在地可用的资源。\n\
  \n### 编程技术\n\n| ![1](img/callout01.png) 一个 DATA 步 此程序使用带有 `RENAME` 语句和 `FORMAT`\
  \ 语句的 `DATA` 步来修改变量 `Country_ID` 和 `Birth_Date` 的属性。 |\n\n```\ndata retail.newcustomer;\n\
  \   set retail.newcustomer;\n   rename Country_ID=country;\n   format birth_date\
  \ date9.;\nrun;\n```\n\n| ![2](img/callout02.png) PROC DATASETS 此程序使用 `PROC DATASETS`\
  \ 修改变量 `Country_ID` 和 `Birth_Date` 的名称和格式。 |\n\n```\nproc datasets lib=retail nolist;\n\
  \   modify newcustomer;\n   rename Country_ID=country;\n   format birth_date date9.;\n\
  quit;\n```\n\n### 一般建议\n\n*   为了节省大量资源，请使用带有 `NOLIST` 选项的 `DATASETS` 过程代替 `DATA`\
  \ 步来更改 SAS 数据集的属性。\n\n## 只读写必要数据\n\n## 概述\n\n最佳实践规定，你应该编写只读取和写入必要数据的程序。如果你处理更少的观测值和变量，就能节省资源。本主题涵盖了许多提高性能的各种技术。\n\
  \n## 使用子集 IF 代替 WHERE 语句选择观测值\n\n你可以使用 `WHERE` 语句或子集 `IF` 语句来提取子集。虽然这两个语句都会测试条件以确定\
  \ SAS 是否应该选择观测值，但 `WHERE` 语句效率更高。下面的图说明了这些语句之间的区别。![使用子集 IF 代替 WHERE 语句选择观测值](img/m83-22-g1.png)\
  \ I/O 操作是根据数据在包含输入 SAS 数据的磁盘与内存中的输入缓冲区之间移动，以及数据从输出缓冲区移动到包含输出数据集的磁盘来衡量的。输入数据不受 `WHERE`\
  \ 语句或子集 `IF` 语句的影响。然而，输出数据受两者的影响。当数据必须在程序数据向量中处理时，会测量 CPU 时间。如果处理更少的观测值，就可以节省 CPU\
  \ 时间。`WHERE` 语句和子集 `IF` 语句对程序数据向量的使用方式不同。`WHERE` 语句在观测值加载到程序数据向量之前进行选择，这节省了 CPU\
  \ 操作。子集 `IF` 语句将每个观测值顺序加载到程序数据向量中。如果子集条件为真，则处理该观测值并将其写入输出页面缓冲区。`WHERE` 语句作用于现有 SAS\
  \ 数据集中的现有变量。子集 `IF` 语句可以作用于程序数据向量中的任何变量，包括新变量或现有变量。\n\n## 比较示例：创建 SAS 数据集的子集\n\n\
  ## 概述\n\n假设你想创建 `Retail.Customer` 数据集的子集。你只想包含英国的数据。该子集包含 `Retail.Customer` 约 6%\
  \ 的。以下示例程序比较了两技术。你可以将这些示例作为在你自己的环境中创建基准程序的模型。你的结果可能会取决于数据的结构、操作系统环境以及你所在地可用的资源。\n\
  \n### 编程技术\n\n| ![1](img/callout01.png) 子集 IF 语句 此程序使用 `IF` 语句在 `Country` 值为 `GB`\
  \ 时选择观测值。 |\n\n```\ndata retail.UnitedKingdom;\n   set retail.customer;\n   if country='GB';\n\
  run;\n```\n\n| ![2](img/callout02.png) WHERE 语句 此程序使用 `WHERE` 语句在 `Country` 值为 `GB`\
  \ 时选择观测值。这比使用子集 `IF` 语句更高效。 |\n\n```\ndata retail.UnitedKingdom;\n   set retail.customer;\n\
  \   where country='GB';\nrun;\n```\n\n### 一般建议\n\n*   当子集较小时，请使用 `WHERE` 语句代替子集\
  \ `IF` 语句来提取 SAS 数据集。\n\n## IF 和 WHERE 语句的其他区别\n\n查看下表注意 `IF` 语句和 `WHERE` 语句的其他区别。\n\
  \n| 操作 | 子集 IF 语句 | WHERE 语句 |\n| --- | --- | --- |\n| 选择数据 | 可以从外部文件选择记录、从 SAS\
  \ 数据集选择观测值、通过 `INPUT` 语句创建观测值或根据计算或派生变量选择 | 只能从 SAS 数据集选择观测值 |\n| 条件执行 | 是执行语句 |\
  \ 不是执行语句 |\n| 使用 BY 语句分组 | 对 `FIRST.` 或 `LAST.` 标记没有影响 | 影响 `FIRST.` 或 `LAST.` 标记，这些标记在处理表达式后设置\
  \ |\n| 合并数据 | 在合并当前观测值后选择 | 在合并观测值之前对每个输入数据集应用选择 |\n\n注意：如果你在同一个 `DATA` 步中使用了 `WHERE=`\
  \ 数据选项和 `WHERE` 语句，SAS 会忽略输入数据集的 `WHERE` 语句。`WHERE=` 数据选项和 `WHERE` 语句调用相同的 SAS 程。\n\
  \n##  OBS= 和 FIRSTOBS= 使用 WHERE 语句\n\n另一种只读写必要数据的方法是处理子集的片段。你通过结合 `WHERE` 表达式和 `OBS=`\
  \ 以及 `FIRSTOBS=` 数据选项来完成这项任务。在下面的示例中，`WHERE` 表达式在应用 `OBS=` 和 `FIRSTOBS=` 之前选择。`OBS=`\
  \ 和 `FIRSTOBS=` 指定的值是子集中的逻辑观测值，而不是数据集中的物理观测值。\n\n| |\n\n```\noptions fmtsearch=(formats);\n\
  \nproc print \n     data=company.organization_dim(firstobs=5 obs=8);\n     var employee_id\
  \ employee_gender salary;\n     where salary>40000;\nrun;\n``` |\n\n\n\n\n\n`FIRSTOBS\
  \ = 5` 是子集中第 5 个观测值，而它是数据集中第 101 个观测值；`Company.Organization.OBS = 8` 是子集中第 8 个观测值，而它是数据集中第\
  \ 159 个观测值。\n\n## 从外部文件读取数据时选择观测值\n\n在 `DATA` 步中放置子集 `IF` 语句，使其在读取所有数据之前，仅读取选择子集所必需的变量，可以减少处理数据所需的开销。接下来的图表展示了数据如何从外部文件读取、加载到输入缓冲区，并读取到程序数据向量（PDV）中![](img/m83-28-g1.png)。请记住，I/O\
  \ 操作是通过数据在磁盘和缓冲区之间的移动来衡量的——对于输入和输出数据。每条记录在移动到程序数据向量进行处理之前，都会加载到输入缓冲区，因此 I/O 不受 `DATA`\
  \ 步中子集 `IF` 语句位置的影响。你可以通过限制读取到程序数据向量的内容，来减少处理数据所需的 CPU 资源。将子集 `IF` 语句放置在 `INPUT`\
  \ 语句之后，该 `INPUT` 语句仅读取检查特定条件所需的数据。对于不需要的观测值，后续语句将不会执行。注意：将原始字符字段转换为 SAS 字符变量所需的\
  \ CPU 时间比将原始数值字段转换为 SAS 数值变量的实际二进制编码所需的少。\n\n## 比较示例：通过从外部文件读取数据创建数据子集\n\n## 概述\n\
  \n假设你想通过从由文件引用 `Customerdata` 引用的外部文件中读取数据子集，来创建一个 SAS 数据集。你希望该子集仅包含英国的客户。该子集约占外部文件中国家数的\
  \ 6%，该文件包含 89,954 条记录和 12 个字段。以下几个示例程序比较了两种技术。你可以将这些示例作为模型，在你自己的环境中创建基准程序。你的结果可能会根据数据结构、你的操作系统环境以及你所在地的可用资源而异。\n\
  \n### 编程技术\n\n| ![1](img/callout01.png) 读取所有变量并进行子集化在此程序中，`INPUT` 语句在子集 `IF` 语句检查\
  \ `Country` 值之前读取所有变量。然后，如果 `Country` 的值为 `GB`，则将该观测值写入输出数据集 `Retail.UnitedKingdom`。\n\
  \n```sas\ndata retail.UnitedKingdom;\n   infile customerdata;\n   input @1   Customer_ID\
  \         12.\n         @13  Country             $2.\n         @15  Gender     \
  \         $1.\n         @16  Personal_ID        $15.\n         @31  Customer_Name\
  \      $40.\n         @71  Customer_FirstName $20.\n         @91  Customer_LastName\
  \  $30.\n         @121 Birth_Date       date9.\n         @130 Customer_Address \
  \  $45.\n         @175 Street_ID           12.\n         @199 Street_Number    \
  \   $8.\n         @207 Customer_Type_ID     8.;\n    if country='GB';\nrun;\n```\n\
  \n| |\n\n| ![2](img/callout02.png) 读取选定变量并进行子集化在此程序中，第一个 `INPUT` 语句仅读取 `Country`\
  \ 并使用单个末尾 `@` 符号将记录保留在输入缓冲区中。然后程序使用子集 `IF` 语句检查 `Country` 的值。如果 `Country` 的值不是 `GB`，则其他变量不会被读取或写入输出数据集\
  \ `Retail.UnitedKingdom`。如果 `Country` 的值为 `GB`，则输入其他变量的值并写入输出数据集 `Retail.UnitedKingdom`。\n\
  \n```sas\ndata retail.UnitedKingdom;\n   infile customerdata;\n   input @13 Country\
  \ $2\\. @;\n   if country='GB';\n   input @1   Customer_ID         12.\n       \
  \  @15  Gender              $1.\n         @16  Personal_ID        $15.\n       \
  \  @31  Customer_Name      $40.\n         @71  Customer_FirstName $20.\n       \
  \  @91  Customer_LastName  $30.\n         @121 Birth_Date       date9.\n       \
  \  @130 Customer_Address   $45.\n         @175 Street_ID           12.\n       \
  \  @199 Street_Number       $8.\n         @207 Customer_Type_ID     8.;\nrun;\n\
  ```\n\n| |\n\n### 一般建议\n\n*   在 `DATA` 步中放置子集 `IF` 语句，使得在进行子集处理之前只读取选择记录所必需的变量。这可以节省大量的\
  \ CPU 时间。两种技术在 I/O 或内存使用上没有区别。\n\n*   当从外部文件选择记录时，在将所有字段读取到程序数据向量之前，先读取用于选择的字段或多个字段。\n\
  \n*   使用单个末尾 `@` 符号来滞留输入缓冲区，以便当变量或多个变量满足 `IF` 条件时，你可以继续读取该记录。\n\n*   使用 `@1 Customer_ID`\
  \ 重置指针，以便能够从第一个位置开始读取记录。\n\n除了子集观测值外，你还可以通过语句或选项高效地只读写核心数据来筛选变量。\n\n## 使用 KEEP 和\
  \ DROP 语句及选项筛选变量筛选\n\n要筛选变量，可以使用以下任一：\n\n*   `DROP` 和 `KEEP` 语句\n\n*   `DROP=` 和\
  \ `KEEP=` 数据集选项\n\n![使用 KEEP 和 DROP 语句筛选变量](img/m83-g1.png)使用 `KEEP=` 数据集选项和 `DROP=`\
  \ 数据集选项对资源使用的影响取决于它们是用于 `SET` 或 `MERGE` 语句还是 `DATA` 语句。下面的图显示了这些选项如何处理数据。![使用 KEEP\
  \ 和 DROP 语句筛选变量](img/m83-g2.png)在 `SET` 或 `MERGE` 语句中使用，`KEEP=` 和 `DROP=` 数据集选项影响读取到程序数据向量的变量。在\
  \ `DATA` 步中只读取需要的变量有时提高效率。在 `DATA` 语句中使用，这些相同的选项会对要排除的变量标记并影响写入输出数据集的变量。`DROP` 和\
  \ `KEEP` 语句的作用与 `DATA` 语句中的 `KEEP=` 或 `DROP=` 选项相似。下表描述了 `KEEP` 语句和 `KEEP=` 数据集选项将变量写入\
  \ SAS 数据集时的差异。\n\n| DROP 或 KEEP 语句 | DROP= 或 KEEP= 输出数据集选项 | DROP= 或 KEEP= 输入数据集选项\
  \ |\n| --- | --- | --- |\n| 将选定的变量写入所有输出数据集。 | 可以向不同的数据集写入不同的变量。 | 将选定的变量读取到 PDV。\
  \ |\n| 仅适用于 `DATA` 步。 | 适用于 `DATA` 步或大多数 `PROC` 步。 | 适用于 `DATA` 步或大多数 `PROC` 步。\
  \ |\n\n## 比较示例：创建包含平均值和中位数统计的报告\n\n## 概述\n\n假设你想通过由文件引用 `Customerdata` 引用的外部文件中读取数据子集，来创建一个\
  \ SAS 数据集。你希望该子集仅包含英国的客户。该子集约占外部文件中数的 6%，该文件包含 89,954 条记录和 12 个字段。以下示例程序比较了读取和写入数据集变量的两种技术。\n\
  \n| ![1](img/callout01.png) 未使用 KEEP= 选项此程序从数据集 `Retail.Order_fact` 读取所有变量，且不限制写入输出数据集\
  \ `Retail.Profit` 的变量。`PROC MEANS` 读取数据集中的所有变量。\n\n\n\n\n\n```\ndata retail.profit;\n\
  \   set retail.order_fact;  \n   if discount=. then    \n      Profit=(total_retail_price-costPrice_Per_Unit)*quantity;\
  \  \n   else Profit=((total_retail_price*discount)-costprice_per_unit)*quantity;\n\
  run;\nproc means data=retail.profit mean median maxdec=2;\n   title 'Order Information';\n\
  \   class employee_id;\n   var profit;\nrun;\n```\n\n| ![2](img/callout02.png) 在\
  \ DATA 语句中使用 KEEP= | 该程序在 `DATA` 语句中使用 `KEEP=` 数据集选项，将两个变量写入输出数据集 `Retail.Profit`。`PROC\
  \ MEANS` 仅从数据集中读取两个变量。 |\n\n```\ndata retail.profit(keep=employee_id profit);\n\
  \   set retail.order_fact;\n   if discount=. then\n      Profit=(total_retail_price-costprice_per_unit)*quantity;\n\
  \   else Profit=((total_retail_price*discount)-costprice_per_unit)*quantity;\nrun;\n\
  proc means data=retail.profit mean median maxdec=2;\n   title 'Order Information';\n\
  \   class employee_id;\n   var profit;\nrun;\n```\n\n| ![3](img/callout03.png) 在\
  \ DATA 和 SET 语句中使用 KEEP= | 该程序在 `SET` 语句中使用 `KEEP=` 选项从 `Retail.Order_fact` 读取六个变量，并在\
  \ `DATA` 语句中使用 `KEEP=` 数据集选项将两个变量写入输出数据集 `Retail.Profits`。`PROC MEANS` 仅从数据集中读取两个变量。\
  \ |\n\n```\ndata retail.profits(keep=employee_id profit);  \n   set retail.order_fact(keep=employee_id\
  \ total_retail_price discount \n                              costprice_per_unit\
  \ quantity);  \n      if discount=. then  \n         Profit=(total_retail_price-costprice_per_unit)*quantity;\
  \  \n      else Profit=((total_retail_price*discount)-costprice_per_unit)*quantity;\n\
  run;\nproc means data=retail.profit mean median maxdec=2;\n   title 'Order Information';\n\
  \   class employee_id;\n   var profit;\nrun;\n```\n\n| ![4](img/callout04.png) 在\
  \ SET 和 MEANS 语句中使用 KEEP= | 该程序在 `SET` 语句中使用 `KEEP=` 选项从 `Retail.Order_fact` 读取选定的变量，并在\
  \ `MEANS` 语句中使用 `KEEP=` 数据集选项处理统计报告所需的变量。如果你在 `Retail.Profits` 中需要额外的变量进行后续处理，但\
  \ `PROC MEANS` 只需处理两个变量，可以这样做。 |\n\n```\ndata retail.profit;\n  set retail.order_fact(keep=employee_id\
  \ total_retail_price discount\n                             costprice_per_unit quantity);\n\
  \  if discount=. then\n     Profit=(total_retail_price-costprice_per_unit)*quantity;\n\
  \  else Profit=((total_retail_price*discount)-costprice_per_unit)*quantity;\nrun;\n\
  proc means data=retail.profit(keep=employee_id profit) mean median maxdec=2;\n \
  \  title 'Order Information';\n   class employee_id;\n   var profit;\nrun;\n```\n\
  ```\n\n### 通用建议\n\n* 为了减少 CPU 时间和 I/O 操作，请避免读取和写入不需要的变量。\n\n### 比较示例：创建一个仅包含特定变量的\
  \ SAS 数据集\n\n## 概述\n\n假设你想从由文件引用 `Rawdata` 引用的外部文件中读取数据，并创建一个仅包含 `Customer_ID`、`Country`、`Gender`\
  \ 和 `Customer_Name` 变量的 SAS 数据集。以下示例程序比较了两种技术。你可以将这些示例作为模型，在你自己的环境中创建基准程序。你的结果可能会根据数据结构、你的操作系统环境以及你所在地的可用资源而有所不同。\n\
  \n### 编程技术\n\n| ![1](img/callout01.png) 读取所有字段 | 在此程序中，`KEEP=` 数据集选项仅将需要的变量写入输出数据集，而\
  \ `INPUT` 语句从外部文件中读取所有字段。 |\n\n```\ndata retail.customers(keep=Customer_ID Country\
  \ Gender Customer_Name);\n   infile rawdata;\n   input @1   Customer_ID        \
  \ 12.\n         @13  Country             $2.\n         @15  Gender             \
  \ $1.\n         @16  Personal_ID        $15.\n         @31  Customer_Name      $40.\n\
  \         @71  Customer_FirstName $20.\n         @91  Customer_LastName  $30.\n\
  \         @121 Birth_Date       date9.\n         @130 Customer_Address   $45.\n\
  \         @175 Street_ID           12.\n         @199 Street_Number       $8.\n\
  \         @207 Customer_Type_ID     8.;\nrun;\n```\n\n| ![2](img/callout02.png)\
  \ 读取选定字段 | 在此程序中，`INPUT` 语句从外部文件中读取选定的字段，默认情况下，这些字段会被写入输出数据集。该程序是高效处理的示例。 |\n\n\
  ```\ndata retail.customers;\n   infile rawdata;\n   input @1   Customer_ID     \
  \    12.\n         @13  Country             $2.\n         @15  Gender          \
  \    $1.\n         @31  Customer_Name      $40.\nrun;\n```\n\n### 通用建议\n\n* 为了减少\
  \ CPU 时间和 I/O 操作，请避免读取和写入不需要的变量。\n* 为了节省 CPU 资源，请从外部文件中仅读取需要的字段。\n* 为了节省 CPU 时间，请避免转换不需要的数据。\n\
  \n\n\n\n\n```\ndata _null_;\n   infile rawdata;\n   input @1   Customer_ID     \
  \    12.\n         @13  Country             $2.\n         @15  Gender          \
  \    $1.\n         @16  Personal_ID        $15.\n         @31  Customer_Name   \
  \   $40.\n         @71  Customer_FirstName $20.\n         @91  Customer_LastName\
  \  $30.\n         @121 Birth_Date       date9.\n         @130 Customer_Address \
  \  $45.\n         @175 Street_ID           12.\n         @199 Street_Number    \
  \   $8.\n         @207 Customer_Type_ID     8.;\nrun;\n```\n\n| ![2](img/callout02.png)\
  \ 从 SAS 数据集读取 | 在此程序中，`SET`语句直接从现有的 SAS 数据集中读取数据。与上一个程序一样，`DATA`语句使用 `_NULL_` 而不是命名数据集。\
  \ |\n\n```\ndata _null_;  \n   set retail.customer;\nrun;\n```\n\n### 通用建议\n\n*\
  \ 为了节省 CPU 资源，请读取 SAS 数据集而不是外部文件。\n* 为了减少 I/O 操作，请读取 SAS 数据集而不是外部文件。I/O 操作的减少很大程度上取决于外部文件的块大小和\
  \ SAS 数据集的页大小。\n\n# 避免不必要的过程调用\n\n## 概述\n\n最佳实践规定您应避免不必要的过程调用。实现此点的方法是利用一次调用即可完成多个任务的过程。几个过程允许您通过调用一次过程来执行多个任务或创建多个报告。这些包括：\n\
  \n* `SQL` 过程\n* `DATASETS` 过程\n* `FREQ` 过程\n* `TABULATE` 过程。\n\n注意：`BY` 组处理也可以减少不必要的过程调用。为了说明这一原理，请查看\
  \ `DATASETS` 过程的特性。\n\n## 执行 DATASETS 过程\n\n`DATASETS` 过程可以使用 `RUN-group` 处理来处理多组语句。`RUN-group`\
  \ 处理允许您在不结束过程的情况下提交一组语句。当 `DATASETS` 过程执行时，会发生以下操作：\n\n* SAS 读取与一个任务相关的程序语句，直到遇到\
  \ `RUN` 语句或隐含的 `RUN` 语句。\n* SAS 执行之前的所有语句，然后继续读取直到遇到另一个 `RUN` 语句或隐含的 `RUN` 语句。\n\
  \n要执行最后一个任务，您必须使用 `RUN` 语句或 `QUIT` 语句。\n\n```\nproc datasets lib=company;\n   modify\
  \ orders;\n      rename quantity=Units_Ordered;\n      format costprice_per_unit\
  \ dollar13.2;\n      label delivery_date='Date of Delivery';\n   run;\n   modify\
  \ customers;\n      format customer_birthdate mmddyy10.\n   run;\nquit;\n```\n\n\
  您可以通过提交 `DATA` 语句、`PROC` 语句或 `QUIT` 语句来终止 `PROC DATASETS` 的执行。\n\n## RUN 组处理\n\n\
  `RUN-group` 处理避免了不必要的过程调用。支持 `RUN-group` 处理的过程包括：\n\n* `CHART`, `GCHART`\n* `PLOT`,\
  \ `GPLOT`\n* `GIS`, `GMAP`\n* `GLM`\n* `REG`\n* `DATASETS`\n\n## 使用 PROC DATASETS\
  \ 使用不同类型的 RUN 组\n\n`DATASETS` 过程支持四种类型的 `RUN groups`。每个 `RUN group` 都由组成其并导致其执行的语句定义。`PROC\
  \ DATASETS` 中的某些语句充当隐含的 `RUN` 语句，因为它们会导致它们之前的 `RUN`组执行。以下语句构成了一个 `RUN`组，以及导致每个 `RUN`组执行的原因：\n\
  \n* `PROC DATASETS` 语句始终立即执行。不需要其他语句即可触发 `PROC DATASETS` 语句的执行。因此，`PROC DATASETS`\
  \ 语句本身就是一个 `RUN`组。\n* `MODIFY` 语句及其任何从属语句形成一个 `RUN`组。这些 `RUN`组总是立即执行。不需要其他语句即可触发\
  \ `MODIFY RUN`组的执行。\n* `APPEND`、`CONTENTS` 和 `COPY` 语句（包括存在的 `EXCLUDE` 和 `SELECT`）形成它们各自独立的\
  \ `RUN groups`。每个 `APPEND` 语句形成一个单语句 `RUN group`，每个 `CONTENTS` 语句形成一个单语句 `RUN group`，每个\
  \ `COPY` 步形成一个 `RUN`组。过程中的任何其他语句（属于 `COPY` 或 `MODIFY` 语句的从属语句外）都会导致 `RUN`组执行。\n\n\
  此外，以下一个或多个语句形成一个 `RUN`组：\n\n* `AGE`\n* `EXCHANGE`\n* `CHANGE`\n* `REPAIR`\n\n如果这些任何语句顺序出现在\
  \ `PROC` 步中，该序列就会形成一个 `RUN`组。例如，如果 `REPAIR` 语句紧跟在 `SAVE` 语句之后，`REPAIR` 语句不会强制 `SAVE`\
  \ 语句执行；它成为同一个 `RUN`组的一部分。要执行该 `RUN`组，请提交以下语句之一：\n\n* `PROC DATASETS`\n* `MODIFY`\n\
  * `APPEND`\n* `QUIT`\n* `CONTENTS`\n* `RUN`\n* `COPY`\n* 其他 `DATA` 或 `PROC` 步\n\n\
  ## 示例：修改 SAS 数据集的描述部分\n\n## 概述\n\n假设您想使用 `DATASETS` 过程修改数据集 `NewCustomer`、`NewOrders`\
  \ 和 `NewItems`。以下示例程序比较了两种技术。您可以将这些示例作为在您自己的环境中创建基准程序的模型。您的结果取决于数据结构、您的操作环境以及现场的资源。\n\
  \n### 编程技术\n\n| ![1](img/callout01.png) 多次 DATASETS 过程 | 此程序调用三次 `PROC DATASETS`\
  \ 来修改数据集 `NewCustomer` 的描述部分，调用两次修改 `NewOrders` 的描述部分，并调用一次数据集 `NewItems` 的名称。 |\n\
  \n```\nproc datasets lib=company nolist;\n   modify newcustomer;\n   rename Country_ID=Country\n\
  \          Name=Customer_Name;\nquit;\n\nproc datasets lib=company nolist;\n   modify\
  \ newcustomer;\n   format birth_date date9.;\nquit;\n\nproc datasets lib=company\
  \ nolist;\n   modify newcustomer;\n   label  birth_date='Date of Birth';\nquit;\n\
  \nproc datasets lib=company nolist;\n   modify neworders;\n   rename order=Order_ID\n\
  \          employee=Employee_ID\n          customer=Customer_ID;\nquit;\n\nproc\
  \ datasets lib=company nolist;\n   modify neworders;\n   format order_date date9.;\n\
  quit;\n\nproc datasets lib=company nolist;\n   change newitems=NewOrder_Items;\n\
  quit;\n``` |\n\n| ![2](img/callout02.png) 单次 DATASETS 过程 | 此程序调用一次 `PROC DATASETS`\
  \ 来修改数据集 `NewCustomer` 和 `NewOrders` 的描述部分，并修改数据集 `NewItems` 的名称。这种技术更高效。 |\n\n\
  ```\nproc datasets lib=company nolist;\n   modify newcustomer;\n   rename country_ID=Country\n\
  \          name=Customer_Name;\n   format birth_date date9.;\n   label  birth_date='Date\
  \ of Birth';\n   modify neworders;\n   rename order=Order_ID\n          employee=Employee_ID\n\
  \          customer=Customer_ID;\n   format order_date date9.;\n   change newitems=NewOrder_Items;\n\
  quit;\n``` |\n\n\n\n\n通过以最高效的顺序执行最少的语句，您可以度地减少 SAS 使用的 CPU 时间。在创建数据子集时，请将子集 `IF`\
  \ 语句放在逻辑上尽可能早的 `DATA` 步骤中。查阅有关如何高效使用 `IF-THEN/ELSE` 语句或 `SELECT` 语句进行条件逻辑的指南。请记要尽量减少使用\
  \ SAS 函数或算术运算符的语句数量。通过将语句放在与 `IF-THEN/ELSE` 语句或 `SELECT/WHEN` 语句相关的组中，仅条件地执行必要的语句。语句组仅在特定条件为真时执行。查阅有关高效使用\
  \ `DO` 组的标准。\n\n## 消除不必要的数据扫描\n\n为了尽量减少 I/O 操作，您应该避免比必要的多次读取或写入数据。您可以使用多种技术。例如，使用单个\
  \ `DATA` 步骤通过对输入数据进行一次扫描来创建多个输出数据集，而不是在每次创建输出数据集时都使用多个 `DATA` 步骤来处理输入数据。通过使用 `SORT`\
  \ 过程对数据进行子集处理来创建排序后的子集，而不是在 `DATA` 步骤中进行子集处理后再进行排序。使用 `PROC DATASETS` 而不是 `DATA`\
  \ 步骤来更改变量属性。\n\n## 只读写核心数据\n\n如果处理的观测值和变量少，SAS 会执行更少的 I/O 操作。要限制处理的观测值数量，可以使用子集\
  \ `IF` 语句和 `WHERE` 语句。理解子集 `IF` 语句和 `WHERE` 语句之间的其他差异，就可以应用最佳编程实践。您还可以通过结合 `WHERE`\
  \ 语句应用 `OBS=` 和 `FIRSTOBS=` 处理来提高性能。从外部文件读取数据时选择观测值，请在 `DATA` 步骤中放置子集 `IF` 语句，使其在读取所有数据之前仅读取选择子集所需的变量。这可以减少处理数据所需的开销。要限制处理的变量数量，可以使用以下任一种方法：\n\
  \n*   `DROP` 和 `KEEP` 语句\n*   `DROP=` 和 `KEEP=` 数据集选项\n\n在 `SET` 语句中，`DROP=` 或 `KEEP=`\
  \ 数据集选项控制哪些变量被读取并随后处理。在 `DATA` 语句中，`DROP=` 或 `KEEP=` 数据集选项控制哪些变量在处理后写入输出数据集。使用带有这些选项的\
  \ `SET` 语句是最高效的最佳实践。\n\n## 将 SAS 数据存储在 SAS 数据集中\n\n当使用 SAS 重复分析或操作任何特定组的数据时，创建一个\
  \ SAS 数据集而不是每次读取原始数据。从外部文件读取数据而不是从 SAS 数据集中读取会大幅增加 CPU 使用。\n\n## 避免不必要的过程调用\n\n\
  调用一次过程而不是多次。多个过程允许您在仅调用一次过程的情况下创建多个报告。使用单个 `DATASETS` 过程代替多个 `DATASETS` 过程来修改数据集的描述部分可以显著节省\
  \ CPU 和 I/O 操作。此外，您还可以利用 `RUN` 组处理在不结束过程的情况下提交语句组。\n\n# 练习\n\n为每个问题选择最佳答案。完成测试后，使用附录中的答案键检查您的答案。\n\
  \n1. 将子集 `IF` 语句放在 `DATA` 步骤的顶部而不是底部可以节省 CPU 使用。如果子集很大而不是很小会发生什么？\n    1. 随着子集增大，CPU\
  \ 使用的节省也会增加，因为 I/O 随之增加。\n    2. 随着子集增大，CPU 使用的节省会减少。然而，将子集 `IF` 语句放在 `DATA` 步骤的顶部始终比放在底部消耗更少资源。\n\
  \    3. 随着子集增大，CPU 使用的节省保持不变。然而，将子集 `IF` 语句放在数据集的底部更为理想。\n    4. 随着子集增大，CPU 使用的节省会减少。然而，将子集\
  \ `IF` 语句放在数据集的底部会增加 I/O。\n\n2. 关于修改数据和属性的技术，以下哪种描述是正确的？\n    1. 您可以使用 `PROC DATASETS`\
  \ 修改数据值和变量属性。\n    2. 您可以使用 `PROC DATASETS` 仅修改数据值。\n    3. 您可以使用 `DATA` 步骤同时修改数据值和变量属性。\n\
  \    4. 您可以使用 `DATA` 步骤仅修改变量属性。\n\n3. 对于选择观测值，子集 `IF` 语句还是 `WHERE` 语句更高效？为什么？\n\
  \    1. 子集 `IF` 语句更高效，因为它将所有观测值顺序加载到程序数据向量（PDV）中。\n    2. 子集 `IF` 语句更高效，因为它检查输入缓冲区中的内容并在它们加载到程序数据向量之前选择观测值，从而节省了\
  \ CPU 操作。\n    3. `WHERE` 语句更高效，因为它将所有观测值顺序加载到程序数据向量中。\n    4. `WHERE` 语句更高效，因为它检查输入页缓冲区中的内容并在它们加载到程序数据向量之前选择观测值，从而节省了\
  \ CPU 操作。\n\n4. 在什么情况下创建临时 SAS 数据集比创建永久 SAS 数据集更有优势？\n    1. 当基于数据集的外部文件在 SAS 会话之间可能会发生时。\n\
  \    2. 当基于数据集的外部文件在 SAS 会话之间不会变化时。\n    3. 当数据集需要在多个 SAS 会话中使用。\n    4. 当您将原始数值转换为\
  \ SAS 数据值时。\n\n5. 将使用多个 `DATASETS` 过程的技术与使用单个 `DATASETS` 过程修改数据集描述部分进行比较，哪项是正确的？\n\
  \    1. 单个 `DATASETS` 过程会导致 I/O 操作增加。\n    2. 多个 `DATASETS` 过程会导致 I/O 操作减少。\n  \
  \  3. 单个 `DATASETS` 过程会导致 CPU 使用减少。\n    4. 多个 `DATASETS` 过程会导致 CPU 使用减少。\n\n\n\n\
  \n注意：本章不涵盖 SAS 可扩展性能数据引擎 (SAS SPD Engine)。有关使用 SAS SPD Engine 提高性能的详细信息，请参 SAS 文档。\n\
  \n# 使用索引进行高效的 WHERE 处理\n\n## 概述\n\n在处理 `WHERE` 表达式时，SAS 会确定以下哪种访问方法可能最有效：\n\n| ![顺序访问](img/m85-2-g1.png)\
  \ | SAS 按照物理顺序顺序检查所有的观测值。 |\n\n| ![直接访问](img/m85-2-g2.png) | SAS 使用索引直接访问特定的观测值。使用索引处理\
  \ `WHERE` 表达式被称为优化 `WHERE` 表达式。 |\n\n使用索引处理 `WHERE` 表达式在某些情况下可以提高性能，但在其他情况下则不会。例如，使用索引选择较小的子集比选择大型子集更有效。此外，索引在消耗某些资源的同时也节省了其他资源。在\
  \ SAS 决定是否创建索引之后，您在决定 SAS 可以使用哪种访问方法方面也起着决定作用。当您的程序包含 `WHERE` 表达式时，您应该检查程序，看看您是否同意直接访问可能更有效。如果是，您可以通过创建新索引或维护现有索引来确保索引可用。为了帮助您对是否创建索引做出更有效的决策，本主题以及接下来的几个主题将让您深入了解以下内容：\n\
  \n*   SAS 执行顺序访问和直接访问的步骤\n*   使用索引的益处和成本\n*   SAS 确定哪种访问方法最高效执行的步骤\n*   影响索引访问资源使用的因素\n\
  *   决定是否创建、使用和维护索引的指南\n\n注意：您应该已经知道如何通过 `DATA` 语句中的 `INDEX=` 数据集选项、`DATASETS` 过程和\
  \ `SQL` 过程来创建和维护索引。要查看这些 SAS 元素，请参见使用 PROC SQL 创建和管理索引 和 创建索引。注意：SAS 还可以使用索引来处理\
  \ `BY` 语句。`BY` 处理允许您根据 `BY` 语句中指定的一个或多个变量的值按特定顺序处理观测值。对数据文件建立索引允许您无需排序数据文件即可使用 `BY`\
  \ 语句。当您指定 `BY` 语句时，SAS 会检查 `Sorted` 指示器的值。如果 `Sorted` 指示器设置为 `NO`，则 SAS 将寻找合适的索引。如果存在合适的索引，软件将按照索引顺序从数据文件中自动检索观测值。使用索引处理\
  \ `BY` 语句并不总是比简单排序数据文件更有效。因此，对 `BY` 语句使用索引通常是为了方便，而不是为了性能。\n\n## 顺序访问数据\n\n在顺序访问观测值时，SAS\
  \ 必须在数据文件中按照其物理顺序检查所有的观测值。\n\n## 示例\n\n假设您想创建一个新的数据集 `Company.D02jul2000`，该数据集包含来自\
  \ `Company.Dates` 数据集的观测值子集。以下 `DATA` 步使用 `WHERE` 语句选择所有 `Date_ID` 为 `02JUL2000`\
  \ 的观测值：\n\n```\ndata company.d02jul2000;\n   set company.dates;\n   where date_id='02JUL2000'd;\n\
  run;\n```\n\n数据集 `Company.Dates` 不包含定义在变量 `Date_ID` 上的索引，因此 SAS 必须使用顺序访问来处理 `WHERE`\
  \ 语句。注意：如果数据集 `company.dates` 已经按 `date_id` 排序，则 SAS 将顺序搜索数据，直到满足 `WHERE` 标准（`date_id='02JUL2000'd`）。\n\
  \n## 直接访问数据\n\n使用索引进行 `WHERE` 处理时，SAS 会访问每个所需的观测值，而无需读取数据集中的每个观测值。\n\n## 示例\n\n\
  假设您已经在 `Company.Dates` 数据集的变量 `Date_ID` 上定义了一个索引。这一次，当您提交以下 `DATA` 步时，SAS 使用索引来处理\
  \ `WHERE` 语句：\n\n```\ndata company.d02jul2000;\n   set company.dates;\n   where\
  \ date_id='02JUL2000'd;\nrun;\n```\n\n通过索引（直接访问）检索数据的过程比顺序访问更复杂，因此直接访问每个检索到的观测值所需的\
  \ CPU 时间比顺序访问更多。然而，对于较小的子集，使用索引可以减少 SAS 加载到输入缓冲区页面数量，从而减少 I/O 操作次数。注意：当数据集中的值按照它们在索引中出现的顺序排序时，符合条件的观测值是相邻的。在这种情况下，SAS\
  \ 加载到输入缓冲区页面比数据随机分布在集中要少。因此，当数据集排序时，所需的 I/O 操作更。\n\n## 使用索引的益处和成本\n\n如前面的示例所示，使用索引既有益处也有成本。权衡这些益处和成本是决定使用索引是否高效的重要部分。使用索引的主要益处包括：\n\
  \n*   提供对较小观测值子集的快速访问\n*   按排序顺序返回值\n*   可以强制唯一性\n\n使用索引的主要成本包括：\n\n*   创建和维护索引需要额外的\
  \ CPU 周期和 I/O 操作\n*   读取数据需要额外的 CPU 时间\n*   存储索引需要额外的磁盘空间\n*   加载索引页需要额外的内存\n\n\
  注意：使用索引时，SAS 需要额外的缓冲区。当打开数据文件时，SAS 打开的是数据文件而不是索引。除非使用索引，否则不需要缓冲区，但 SAS 为准备使用索引会分配缓冲区。索引的层数决定了分配的缓冲区数量。如果这些缓冲区未用于索引，则可以用于其他处理。\n\
  \n## SAS 如何选择访问方法\n\n当 SAS 处理 `WHERE` 表达式时，它首先通过执行以下步骤确定是使用直接访问还是顺序访问：\n\n1.  识别可用索引\n\
  2.  识别可以优化的条件\n3.  估计符合条件的观测值数量\n4.  比较两种方法的资源使用\n\n# 识别可用索引\n\n## 概述\n\nSAS 的第一步是确定是否存在可以处理\
  \ `WHERE` 表达式的索引。具体来说，SAS  `WHERE` 表达式中每个条件的变量，以确定该变量是否是索引的键变量![Order_Date 索引](img/m85-8-g1.png)SAS\
  \ 可以简单索引或复合索引来优化 `WHERE` 表达式。要用于优化单个 `WHERE` 条件，必须满足以下要求之一：\n\n*   `WHERE` 条件中的变量是简单索引的键变量\n\
  *   `WHERE` 条件中的变量是复合索引的第一个键变量\n\nSAS 识别定义在 `WHERE` 表达式中任何变量上的所有索引。然而，无论有多少可用索引，SAS\
  \ 只能使用一个索引来处理 `WHERE` 表达式。因此，如果有多个索引，SAS 必须在它们之间进行选择。当 SAS 寻找可用索引时，有三种结果：\n\n| 索引\
  \ | 结果 |\n\n| --- | --- |\n\n\n\n\n\n| WHERE 表达式中的任何变量均未定义索引。 | SAS 不继续执行决策过程。SAS\
  \ 必须使用顺序访问来处理 WHERE 表达式。 |\n| WHERE 表达式中的一个或多个变量上定义了一个可用索引。 | SAS 继续执行决策过程，并确定使用可用索引是否比使用顺序访问更高效。\
  \ |\n| 存在多个可用索引。每个索引都定义在 WHERE 表达式中的一个或多个变量上。 | SAS 继续执行决策过程。SAS 必须在接下来的几步中在可用索引之间进行选择。SAS\
  \ 尝试选择满足最多条件且选出最小观测值子集的索引。 |\n\n注意：如果程序同时指定了 `WHERE` 表达式和 `BY` 语句，SAS 会寻找一个同时满足这两个者条件的索引。如果没有找到此类索引，则\
  \ `BY` 语句具有优先权，以便 SAS 能够确保返回的数据按排序排列。使用 `BY` 语句时，如果优化会破坏 `BY` 顺序，则 SAS 无法使用索引来优化\
  \ `WHERE` 表达式。\n\n## 示例：识别单个可用索引\n\n假设你提交了一个包含以下 `WHERE` 语句的程序，并假设数据集有一个索引，如下所示：\n\
  \n| WHERE 语句 | 可用索引 |\n| --- | --- |\n| |\n```\nwhere delivery_date='02jul2000'd\n\
  ```\n| 定义在 `Delivery_Date` 上的简单索引 |\n\n此 `WHERE` 表达式包含一个条件，该条件中的变量（`Delivery_Date`）是简单索引中的键变量。如果后续步骤满足优化的所有其他要求，则\
  \ SAS 就可以使用此索引来优化 `WHERE` 表达式。同样，如果唯一的可用索引是 `Delivery_Date` 为第一个键变量的复合索引，只要满足所有其他优化要求，SAS\
  \ 就可以使用该索引。即使 `WHERE` 语句有多个条件，SAS 也可以使用简单索引或复合索引来优化其中某一个条件。例如，假设你的程序包含一个两个条件的 `WHERE`\
  \ 语句，并假设数据集有一个索引，如下所示：\n\n| WHERE 语句 | 可用索引 |\n| --- | --- |\n| |\n```\nwhere order_date='01jan2000'd\
  \ and \ndelivery_date='02jul2000'd';\n```\n| 定义在 `Delivery_Date` 上的简单索引 |\n\n假设满足了所有其他优化要求，SAS\
  \ 可以此索引来优化该 `WHERE` 表达式中的第二个条件。\n\n## 示例：识别多个可用索引\n\n假设你的程序包含一个带有两个条件的 `WHERE` 语句，并假设每个条件都引用了不同索引中的键变量，如下所示：\n\
  \n| WHERE 语句 | 可用索引 |\n| --- | --- |\n| |\n```\nwhere order_date='01jan2000'd and\
  \ \ndelivery_date='02jul2000'd';\n```\n| |\n* - 定义在 `Order_Date` 上的简单索引\n* - 定义在\
  \ `Delivery_Date` 上的简单索引。 |\n\n尽管有两个可用索引，但 SAS 只能使用一个索引来优化 `WHERE` 语句。在过程的后续步骤中，SAS\
  \ 会尝试选择满足最多条件且选出最小观测值子集的索引。\n\n## 复合优化\n\n无论 `WHERE` 表达式包含多少个条件和变量，SAS 通常只使用一个索引来处理一个条件。但在一个被称为“复合优化”的过程中，SAS\
  \ 可以使用复合索引来优化多个变量上的多个条件，这些条件通过逻辑运算符（如 `AND`）连接。构建 `WHERE` 表达式以利用单个索引中的多个键变量，可以大大提高性能。为了发生复合优化，复合索引中的至少前两个键变量必须被用于\
  \ `WHERE` 条件中。在本章的后后部分，你将学习到要发生复合优化必须满足的其他要求。注意：`WHERE` 表达式也可以包含非索引变量，且键变量和非索引变量可以以任何顺序出现在表达式中。\n\
  \n## 示例：用于优化多个条件的复合索引\n\n假设你的程序包含一个带有两个条件的 `WHERE` 语句，并假设每个条件都引用了复合索引中的前两个键变量之一：\n\
  \n| WHERE 语句 | 可用索引 |\n| --- | --- |\n| |\n```\nwhere order_date='01jan2000'd and\
  \ \ndelivery_date='02jul2000'd';\n```\n| 定义在以下变量上的复合索引：\n* - `Order_Date`（第一个键变量）\n\
  * - `Delivery_Date`（第二个键变量）\n* - `Product_ID`（第三个键变量） |\n\n由于 `WHERE` 表达式中引用的两个变量是复合索引的前两个键变量，只要\
  \ `WHERE` 条件满足所有其他优化要求，SAS 就可以使用复合索引进行复合优化。\n\n## 示例：用于优化一个条件的复合索引\n\n以下 `WHERE`\
  \ 语句也包含两个条件，每个条件都引用了复合索引中的变量之一：\n\n| WHERE 语句 | 可用索引 |\n| --- | --- |\n| |\n```\n\
  where order_date='01jan2000'd and \nproduct_id='220101400106';\n```\n| 定义在以下变量上的复合索引：\n\
  * - `Order_Date`（第一个键变量）\n* - `Delivery_Date`（第二个键变量）\n* - `Product_ID`（第三个键变量）\
  \ |\n\n与上一个 `WHERE` 语句一样，`Order_Date` 是索引中的第一个键变量。然而，在这种情况下，复合索引仅可以优化第一个条件。第二个条件引用了第三个键变量\
  \ `Product_ID`，但 `WHERE` 表达式没有引用第二个键变量 `Delivery_Date`。由于缺乏第一个和第二个键变量的引用，无法进行复合优化。\n\
  \n## 示例：无法用于优化的复合索引\n\n现在假设你的程序包含一个引用复合索引中第二个和第三个键变量的 `WHERE` 语句，如下：\n\n| WHERE\
  \ 语句 | 可用索引 |\n| --- | --- |\n| |\n```\nwhere delivery_date='02jul2000'd and \n\
  product_id='220101400106';\n```\n| 定义在以下变量上的复合索引：\n* - `Order_Date`（第一个键变量）\n* -\
  \ `Delivery_Date`（第二个键变量）\n* - `Product_ID`（第三个键变量） |\n\n在这种情况下，由于 `WHERE` 语句没有无法无法无法无法索引无法优化。\n\
  \n# 识别可以优化的条件\n\n除了包含键变量，`WHERE` 条件还需要满足其他要求才能成为优化候选。SAS 只对包含某些运算符和函数的 `WHERE` 条件使用索引。因此，SAS\
  \ 的下一步是考虑包含键变量的条件的运算符和函数。\n\n## 优化单个 WHERE 条件的要求\n\nSAS 会对包含以下任何运算符和函数的 `WHERE`\
  \ 条件使用索引：注意：对于以下所有示例，假设数据集在 `Quarter`、`Date_ID` 和 `Region` 变量上有简单索引。\n\n| 运算符 |\
  \ 示例 |\n| --- | --- |\n| 比较运算符 | |\n```\nwhere quarter = '1998Q1';\n```\n```\nwhere\
  \ date_id < '03JUL2000'd;\n```\n```\nwhere quarter in ('1998Q2','1998Q3');\n```\
  \ |\n| 带有 NOT 的比较运算符 | |\n```\nwhere quarter ne '1999Q1';\n```\n```\nwhere quarter\
  \ not in ('1999Q1','1999Q4');\n``` |\n| 带有冒号修符的比较运算符可以在任何比较运算符上添加冒号修符 (:) 以比较字符字符串的指定前缀。冒号修符不能与\
  \ PROC SQL 使用；请应使用 `LIKE` 运算符。 | |\n```\nwhere quarter =: '1998';\n``` |\n| CONTAINS\
  \ 运算符 | |\n```\nwhere quarter contains 'Q4';\n``` |\n\n\n\n\n\n| 指定了上限和下限的完全边界范围条件，包括\
  \ `BETWEEN-AND` 运算符 | |\n\n```\nwhere '01Jan1999'd < date_id\n      < '31Dec1999'd;\n\
  ```\n\n```\nwhere date_id between '01Jan1999'd\n              and '31Dec1999'd\n\
  ``` |\n| 模式匹配运算符 `LIKE` | |\n\n```\nwhere quarter like '%Q%';\n``` |\n\n| `IS NULL`\
  \ 或 `IS MISSING` 符 | |\n\n```\nwhere quarter is null;\n```\n\n```\nwhere quarter\
  \ is missing;\n``` |\n\n| 函数 | 示例 |\n| --- | --- |\n| `TRIM` 函数 | |\n```\nwhere\
  \ trim(region) = 'Queensland';\n``` |\n| 形式为 `WHERE SUBSTR(variable,position,length)='string';`\
  \ 的 `SUBSTR` 函数，满足以下条件：<br>*position = 1` <br>*length` 小于等于 `variable` 的长度 <br>*length`\
  \ 等于 `string` 的长度 | |\n```\nwhere substr(quarter,1,4) = '1998';\n``` |\n\n**注意**：上述列出的部分但并非所有要求也适用于复合优化。复合优化要求将在在本章后文中介绍。\n\
  \n## 无法优化的 WHERE 条件\n\nSAS 不使用索引来处理包含下列表任何元素的 `WHERE` 条件。注意：对于以下所有示例，假设数据集在变量 `Date_ID`、`Quarter`\
  \ 和 `Quantity` 上建有简单索引。\n\n| WHERE 条件中的元素 | 示例 |\n| --- | --- |\n| 除 `TRIM` 或 `SUBSTR`\
  \ 外的任何函数 | |\n```\nwhere weekday(date_id)=2;\n``` |\n| 从第一个位置之后的任何位置开始搜索字符串的 `SUBSTR`\
  \ 函数 | |\n```\nwhere substr(quarter,6,1)='1';\n``` |\n| 似音运算符 (`=*`) | |\n```\n\
  where quarter=*'1900Q0';\n``` |\n| 算术运算符 | |\n```\nwhere quantity=quantity+1;\n\
  ``` |\n| 变量与变量之间的条件 | |\n```\nwhere quantity gt threshold;\n``` |\n\n## 复合优化要求\n\
  \n对于优化单个条件时接受的大多数相同运算符也适用于复合优化。然而，复合优化对出现在 `WHERE` 表达式中的运算符有特殊要求：\n\n* `WHERE` 条件必须使用\
  \ `AND` 运算符连接，或者（如果所有条件都引用同一个变量）则使用 `OR` 运算符连接。\n* 包含键变量的 `WHERE` 条件中至少有一个必须包含 `EQ`\
  \ 或 `IN` 运算符。\n\n## 示例：复合优化\n\n假设你的程序包含以下 `WHERE` 语句，它选择所有名字为 John Smith 的人。`WHERE`\
  \ 语句包含两个条件。每个条件引用不同的变量：\n\n```\nwhere lastname eq 'Smith' and \n      frstname eq\
  \ 'John';\n```\n\n假设 `Lastname` 是复合索引中的第一个键变量`Frstname` 是第二个键变量。该 `WHERE` 语句满足复合优化的所有要求：\n\
  \n* `WHERE` 表达式引用了一个复合索引中的至少两个键变量。\n* 两个 `WHERE` 条件通过 `AND` 运算符连接。\n* 条件中至少一个包含\
  \ `EQ` 运算符。\n\n如果 `WHERE` 语句中的两个条件调换位置如下所示，该语句仍然满足复合优化的所有要求。键变量出现的顺序并不重要。\n\n```\n\
  where frstname eq 'John' and \n      lastname eq 'Smith';\n```\n\n现在假设 `WHERE` 语句中的条件是用运算符\
  \ `OR` 而不是 `AND` 组合的：\n\n```\nwhere frstname eq 'John' or\n      lastname eq 'Smith';\n\
  ```\n\n这些条件无法被优化，因为它们通过 `OR` 连接，但没有引用同一个变量。\n\n# 估计观测值数量\n\n## 概述\n\n对于较小的子集，使用索引访问比对较大的子集使用顺序访问更高效。因此，在识别出任何可用索引并评估\
  \ `WHERE` 表达式中的条件后，SAS 会估计符合索引的观测值数量。SAS 是否使用索引取决于符合条件的观测值的百分比（子集相对于数据集的大小），如下所示![SAS\
  \ 索引](img/m85-17-g1.png)\n\n* 如果子集小于数据集的 3%，则直接访问几乎比顺序访问更有效，SAS 将使用索引。在这种情况下，SAS\
  \ 不会继续比较可能的资源使用。\n* 如果子集在数据集的 3% 到 33% 之间，直接访问可能比顺序访问更有效，SAS 可能会使用索引。\n* 如果子集大于数据集的\
  \ 33%，则直接访问比顺序访问更有效的概率较低，SAS 可能使用也可能不使用。\n\n当存在多个索引时，SAS 选择产生符合观测值最少（子集最小）的一个。即使每个索引返回的子集小于数据集的\
  \ 3%，SAS 也会这样做。\n\n## 输出分位数信息\n\n为了帮助 SAS 估计通过 `WHERE` 表达式选择的观测值数量，每个索引都存储 21 个称为累计百分位数（centiles）的统计数据。分位数提供了变量分布的信息。理解数据值的分布可以帮助你提高\
  \ `WHERE` 处理的效率。你可以通过以下位置之一指定 `CENTILE` 选项来打印索引文件的分位数：\n\n* `CONTENTS` 过程\n* `DATASETS`\
  \ 过程中的 `CONTENTS` 语句\n\n| `PROC CONTENTS <options>`; `RUN;` | `PROC DATASETS <options>`;\
  \ `QUIT;` |\n\n## 示例\n\n以下 SAS 程序为数据集 `Company.Organization` 打印分位数信息：\n\n```\nproc\
  \ contents data=company.organization centiles;\nrun;\n```\n\n此程序的部分输出所示。如左侧所示，`Employee_ID`\
  \ 上定义了索引。右侧列出了 21 个分位数。\n\n| 列表位置 | 显示的值 | 描述 |\n| --- | --- | --- |\n| 1 (第一个)\
  \ | 120101 | 索引的最小值（0% 的值小于此值） |\n| 2-20 | 120152 - 121097 | 从底部 5% 到底部 95% 的 19\
  \ 个百分位数中的每个值 |\n| 21 (最后一个) | 9999999 | 索引的最大值（100% 的值小于或等于此值） | ![索引和属性字母列表](certpgadv/images/m85-18-g1.png\n\
  \n注意：关于更新和刷新数据文件分位数的信息，请参 SAS 文档。\n\n# 比较可能的资源使用\n\n## 概述\n\n在 SAS 估计了符合条件的观测值数量并选择了符合观测值最少的索引后，SAS\
  \ 必须确定通过索引或顺序读取所有观测值来满足 `WHERE` 表达式更快（更高效）。具体而言，SAS 会预测为了通过每种访问方法满足 `WHERE` 表达式需要多少\
  \ I/O 操作。然后比较这两种资源成本。注意：记住，如果 SAS 估计子集小于数据集的 3%，则 SAS 不需要估计资源使用。在这种情况下，SAS 使用索引来处理\
  \ `WHERE` 语句。\n\n## SAS 如何比较资源使用\n\n为了比较资源使用，SAS 执行以下步骤：\n\n\n\n\n\n1. SAS 会预测如果使用索引来满足\
  \ `WHERE` 表达式，需要多少次 I/O 操作。为此，SAS 将索引定位到包含符合值的第一个条目处。在考虑当前可用缓冲区数量的缓冲区管理模拟中，将处理该索引页上的\
  \ `RIDs`（记录标识符），这指示了读取数据文件中的观测值需要多少次 I/O。\n2. SAS 计算对整个数据文件进行顺序扫描的 I/O 成本。\n3. SAS\
  \ 比较这两种资源成本，并确定哪种访问方法的成本更低。\n\n注意：如果比较资源成本的结果相等，SAS 将选择索引。\n\n## 影响 I/O 的因素\n\n\
  多个因素会影响 `WHERE` 处理所需的 I/O 操作次数，包括以下因素：\n\n* 子集大小相对于数据集的大小\n* 数据文件中的页数\n* 数据的顺序\n\
  * 为了顺序读取而对压缩文件解压缩的成本\n\n这些因素在下文中得到了更详细的讨论。\n\n## 子集大小相对于数据集的大小\n\n正如本章前面解释的那样，SAS\
  \ 更有可能使用索引来访问一小部分观测值。使用索引检索数据的过程本质上比顺序处理数据更复杂。然而，对于小型子集，仅读取少数观测值的益处大于复杂处理的成本。子集越小，性能增益越大。请记住，如果子集小于数据集的\
  \ 3%，SAS 将使用索引；如果子集在数据集的 3% 到 33% 之间，SAS 可能会使用索引。\n\n## 数据文件中的页数\n\n对于较小的数据文件，顺序处理通常与索引处理一样高效。如果数据文件的页数少于三页，即使子集小于整个数据集的\
  \ 3%，顺序访问也会更快。\n\n注意：在单次 I/O 操作中可以传输到单个缓冲区的数据量称为页大小。要查看数据文件中有多少页，请使用 `CONTENTS`\
  \ 过程或 `DATASETS` 过程中的 `CONTENTS` 语句。有关关于报告数据文件页大小的更多信息，请参阅控制内存使用。\n\n## 数据的顺序\n\n\
  数据的顺序（排序顺序）按下文所示影响 I/O 操作次数：\n\n| 数据的顺序 | 对 I/O 操作的影响 |\n| --- | --- |\n| 观测值随机分布在整个数据文件中\
  \ | 符合条件的观测值位于较多的数据文件页上。每当 SAS 加载一个页，就需要一次 I/O 操作。因此，数据文件中的数据随机性越高，使用索引所需的 I/O 操作就越多。\
  \ |\n| 观测值按索引变量或变量排序 | 数据的顺序更像索引（按值升序），因此符合条件的观测值位于较少的数据文件页上。因此，数据文件中的数据随机性越低，使用索引所需的\
  \ I/O 操作就越少。 |\n\n注意：通常，在索引之前按键变量对数据集进行排序会产生更高的效率。数据文件相对于键变量的顺序性越高，索引的利用效率就越高。如果数据文件有多个索引，则按最常用的键变量对数据进行排序效率最高。即使\
  \ SAS 不使用索引，对数据集也会产生更高效的 `WHERE` 处理。\n\n## 为了顺序读取而对压缩文件解压缩的成本\n\n当 SAS 读取压缩数据文件时，SAS\
  \ 在将观测值读入程序数据向量（PDV）时会自动将其解压缩。这需要额外的 CPU 资源，但由于数据集页较少，所需的 I/O 操作较少。对压缩数据文件进行顺序读取时，SAS\
  \ 必须解压缩文件中的所有观测值。然而，使用直接访问时，SAS 只需要解压缩符合条件的观测值。因此，顺序读取解压缩观测值的资源成本比直接访问更高。\n\n注意：压缩文件是一个减少表示每个观测值所需的字节数的过程。默认情况下，SAS\
  \ 数据文件是不压缩的。有关压缩文件的更多信息，请参阅控制数据存储空间。\n\n## 影响资源使用的其他因素\n\n数据类型和长度是影响索引效率的其他两个因素。数值型键变量通常比字符型键变量消耗更多的\
  \ CPU ，因为当值读入索引或从索引中检索时，数值型变量必须转换为可以排序的格式。字符值已经是可以排序的格式了。\n\n### 决定是否创建索引\n\n在之前的节中，你学习了\
  \ SAS 如何确定对于 `WHERE` 处理，是顺序访问还是直接访问可能最有效。你还学习了可以进行评估的各种因素，以确定哪种访问方法最有效。做出判断后，你可以使用以下指南来决定创建索引是否高效。\n\
  \n## 决定是否创建索引的指南\n\n* 尽量减少索引数量，以减少磁盘存储和更新成本。仅对查询中经常使用的变量或（当数据无法排序时）在 `BY`-组处理中使用的变量创建索引。\n\
  * 当你打算从大型数据文件中检索一小部分观测值时，请创建索引。\n* 如果数据文件的页数少于三页，请不要创建索引。顺序访问数据更快。\n* 在具有区分性的变量上创建索引。区分变量具有许多不同的值，可以精确识别观测值。基于区分变量的\
  \ `WHERE` 表达式生成的子集比引用非区分变量的更小。非区分变量是指只有两个值的变量（例如，性别不是创建索引的良好变量）。\n* 为了减少 I/O 操作，在创建索引之前按键变量对数据进行排序。然后，为了提高性能，按键变量的顺序维护数据文件。注意：如果你选择不使用索引且数据集很大，对数据集进行排序仍然更有效。\n\
  * 考虑你的应用程序频繁使用索引。索引必须频繁使用，才能补偿创建和维护它所消耗的资源。\n* 考虑经常更改的数据文件的索引成本。\n* 当你为处理 `WHERE`\
  \ 表达式创建索引时，不要尝试用一个索引满足所有查询。\n\n考虑三个示例查询，以查看如何应用上一节列出的指南。这些查询说明了一个因素——子集大小相对于数据集的大小——对访问方法选择的影响。对于每个查询，你将了解到：\n\
  \n* SAS 可能选择哪种访问方法\n* 你是否可以通过创建索引提高性能\n\n## 示例：从不同大小的数据集中选择不同大小的子集\n\n假设你正在处理两个数据集。每个数据集都包含公司订单的信息：\n\
  \n| 数据集名称 | 页数 | 观测值 |\n| --- | --- | --- |\n| Company.Orders_large | 285,500 |\
  \ 19,033,380 |\n| Company.Orders_small | 2 | 140 |\n\n你想创建查询来生成三个子集详细报告，每个对应以下类型的子集之一：\n\
  \n* 大型数据集中的小型子集\n\n\n\n\n\n- 来自大型数据集的大型子集\n- 来自小型数据集的小型子集\n\n在这三个查询中，`WHERE` 表达式都指定了变量\
  \ `Order_Date`。你已知该变量在查询中频繁使用，并且是一个区分性变量。根据上一节的指南，这两点都是在该变量上创建索引的准则。然而，目前两个数据集中都没有为该变量定义索引。\n\
  \n## 查询 1：大型数据集中的小型子集\n\n第一份报告显示了 `Company.Orders_large` 中所有在 1998 年 1 月 10 日生成的订单。你的查询如下所示，以及你估计的子集大小：\n\
  \n| 查询 | 子集大小 |\n| --- | --- |\n| | |\n```\ndata _null_;\n    set company.orders_large;\n\
  \    where order_date='10JAN1998'd;\nrun;\n```\n| 2232 条观测值（共 19,033,380 条）<.02%\
  \ 的数据集 | |\n\n由于子集小于整个数据集的 3%，在 `Order_Date` 上使用索引应该比使用顺序访问更高效。如果可用索引，SAS 会使用索引进行\
  \ `WHERE` 处理。为了提高性能，你应该在运行此程序之前在 `Order_Date` 上创建一个索引。\n\n## 查询 2：大型数据集中的大型子集\n\n\
  第二份报告显示了 `Company.Orders_large` 中所有在 2000 年 1 月 1 日之前生成的订单。你的查询和预估的子集大小如下所示：\n\n\
  | 查询 | 子集大小 |\n| --- | --- |\n| | |\n```\ndata _null_;\n   set company.orders_large;\n\
  \   where order_date<'01JAN2000'd;\nrun;\n```\n| 12,752,365 条观测值（共 19,033,380 条）≈\
  \ 数据集的 67% | |\n\n由于子集超过了整个数据集的 33%，使用索引可能没有使用顺序访问效率高。SAS 可能不会在 `WHERE` 处理中使用该索引。\n\
  \n## 查询 3：小型数据集中的小型子集\n\n第三份报告显示了较小数据集 `Company.Orders_small` 中所有在 1998 年 6 月 30\
  \ 日生成的订单。你的查询和预估的子集大小如下所示：\n\n| 查询 | 子集大小 |\n| --- | --- |\n| | |\n```\ndata _null_;\n\
  \   set company.orders_small;\n   where order_date='30JUN1998'd;\nrun;\n```\n| 2\
  \ 条观测值（共 140 条）<= 2 % 的数据集 | |\n\n由于子集小于整个数据集的 3%，SAS 将使用索引进行 `WHERE` 处理。然而，数据文件的页数少于三页，因此使用顺序访问更高效。在这种情况下，最好不要创建索引。\n\
  \n## 使用 IDXWHERE= 和 IDXNAME= 数据集选项\n\n在大多数情况下，让 SAS 决定是否在 `WHERE` 处理中使用索引是是最好的。但是，有时你可能想控制\
  \ SAS 是否使用已有的索引。例如，如果你知道你的查询选择了一个大型子集，因此索引访问并不高效，你可以告诉 SAS 忽略任何索引，并通过对数据集进行顺序搜索来满足\
  \ `WHERE` 表达式的条件。或者，如果你的查询选择了一个小型子集且有多个可用索引，你可以确保 SAS 使用特定的索引来处理你的 `WHERE` 语句。最后，在你进行基准测试时，可能希望强制\
  \ SAS 使用（或不使用）索引。数据集选项 `IDXWHERE=` 和 `IDXNAME=` 控制索引的使用。\n\n| 选项 | 操作 |\n| --- |\
  \ --- |\n| `IDXWHERE=` | 指定 SAS 是否应该使用索引来处理 `WHERE` 表达式，无论 SAS 估计哪种访问方法更快。你不能使用\
  \ `IDXWHERE=` 来覆盖处理 `BY` 语句时对索引的使用。 |\n| `IDXNAME=` | 导致 SAS 使用特定的索引。 |\n\n注意：你可以使用\
  \ `IDXWHERE=` 或 `IDXNAME=`，但不能同时使用两者。有关 `IDXWHERE=` 和 `IDXNAME=` 数据集选项的更多信息，请参阅\
  \ 使用 PROC SQL 创建和管理索引。\n\n## 指定 MSGLEVEL=I 来确定 SAS 是否使用了索引\n\n要确定 SAS 是否使用了索引处理\
  \ `WHERE` 表达式，请将 `I` 指定为 `MSGLEVEL=` 系统选项的值。`MSGLEVEL=I` 会导致 SAS 在 SAS 日中显示有关索引使用的信息。注意：为了最有效地利用资源，请仅将\
  \ `MSGLEVEL=I` 用于调试和验证索引使用。注意：有关 `MSGLEVEL=` 系统选项的更多信息，请参阅 创建索引 或 使用 PROC SQL 创建和管理索引。\n\
  \n## 示例：使用 IDXWHERE=NO 防止索引使用\n\n假设你编写了以下查询，列出所有在销售部门工作的员工。\n\n```\nproc print data=company.orders\n\
  \   where department='Sales';\nrun;\n```\n现在假设 `Company.organization` 的 `department`\
  \ 变量上定义了索引。你知道你的查询选择了一个大型子集，因此索引访问并不高效，你可以告诉 SAS 忽略任何索引，并通过对数据集进行顺序搜索来满足 `WHERE`\
  \ 表达式的条件。或者，如果你的查询选择了一个小型子集且有多个可用索引，你可以确保 SAS 使用特定的索引来处理你的 `WHERE` 语句。最后，在你进行基准测试时，可能希望强制\
  \ SAS 使用（或不使用）索引。数据集选项 `IDXWHERE=` 和 `IDXNAME=` 控制索引的使用。\n\n修改后的程序如下：\n\n```\noptions\
  \ msglevel=i;\nproc print data=company.organization (idxwhere=no);\n   where department='Sales';\n\
  run;\n```\n\n当你运行此程序时，SAS 日志显示没有使用索引。\n\n表 23.1 SAS 日志\n\n| |\n```\nINFO: Data set\
  \ option (IDXWHERE=NO) forced a sequential pass of the data\nrather than use of\
  \ an index for where-clause processing.\n```\n|\n\n\n\n\n\n```\nproc sql;\n   select\
  \ product_id product_name\n          supplier_name\n      from company.products\n\
  \      where supplier_country='SE';\nquit;\n```\n\n这两个步骤都使用 `WHERE` 处理来对数据进行子集划分。在这种情况下，`PROC\
  \ PRINT` 程序可能比 `PROC SQL` 程序消耗少的 CPU 和内存资源。I/O 资源的使用大致相同。\n\n## 报告 3：排序详细报告\n\n\
  排序后的详细报告列出了所有产品的产品 ID、产品名称和供应商名称，按供应商国家对观测值进行了排序。生成此报告的 `PROC PRINT` 程序和 `PROC SQL`\
  \ 程序所示：\n\n| PROC PRINT | PROC SQL |\n| --- | --- |\n| | |\n```\nproc sort data=company.products\n\
  \     out=product;\n   by supplier_country;\nrun;\n\nproc print data=product;\n\
  \   var product_id product_name\n       supplier_name;\nrun;\n``` | | ```\nproc\
  \ sql;\n   select product_id product_name\n          supplier_name\n      from company.products\n\
  \      order by supplier_country;\nquit;\n``` |\n\n为了对数据进行排序，`PROC PRINT` 程序中添加了一个\
  \ `PROC SORT` 步骤，并且 `PROC SQL` 程序中添加了 `ORDER BY` 子句。在这种情况下，`PROC PRINT` 程序可能比 `PROC\
  \ SQL` 程序消耗少的 CPU 和内存资源。I/O 资源的使用大致相同。\n\n## 报告 4：排序子集详细报告\n\n排序后的子集详细报告列出了所有来自瑞典（SE）的产品\
  \ ID、产品名称和供应商名称，按供应商名称对观测值进行了排序。生成此报告的 `PROC PRINT` 程序和 `PROC SQL` 程序所示：\n\n| PROC\
  \ PRINT | PROC SQL |\n| --- | --- |\n| | |\n```\nproc sort data=company.products\n\
  \     (keep=Product_ID Product_Name\n     Supplier_Name Supplier_Country)\n    \
  \ out=product;\n     where supplier_country='SE';\n   by supplier_name;\nrun;\n\n\
  proc print data=product;\n   var product_id product_name\n       supplier_name;\n\
  run;\n``` | | ```\nproc sql;\n   select product_id product_name\n          supplier_name\n\
  \      from company.products\n      where supplier_country='SE'\n      order by\
  \ supplier_name;\nquit;\n``` |\n\n为了对数据进行排序，`PROC PRINT` 程序中添加了一个 `PROC SORT` 步骤。`PROC\
  \ SORT` 步骤使用 `KEEP=` 选项对观测值进行子集划分，这提高了效率。`PROC SQL` 步骤使用 `ORDER BY` 子句排序并使用 `WHERE`\
  \ 子句进行划分。在这种情况下，`PROC PRINT` 程序和 `PROC SQL` 程序的 CPU 和内存使用大致相同。\n\n# 比较数据汇总工具\n\n\
  ## 概述\n\nSAS 提供了多种汇总数据的工具。这些汇总工具生成的输出相似但并不相同，且它们的效率各不相同。注意：在本节中，对 `MEANS` 过程的所有引用也适用于\
  \ `SUMMARY` 过程。\n\n| 工具 | 说明 |\n| --- | --- |\n| `MEANS` 过程或 `SUMMARY` 过程 | - 计算数值变量的描述性统计<br>-\
  \ 可以生成打印报告并创建输出数据集 |\n| `TABULATE` 过程 | - 以表格形式生成描述性统计<br>- 可以生成带有描述性统计的 1、2 或 3\
  \ 维表格<br>- 也可以创建输出数据集 |\n| `REPORT` 过程 | - 将 `PRINT`、`MEANS` 和 `TABULATE` 过程的功能与\
  \ `DATA` 步骤的功能结合到单一报告编写工具中，可以生成各种报告<br>- 也可以创建输出数据集 |\n| `SQL` 过程 | - 计算一个或多个 SAS\
  \ 数据集或 DBMS 表的描述性统计<br>- 可以生成打印报告或创建 SAS 数据集 |\n| `DATA` 步骤 | - 可以生成打印报告<br>- 也可以创建输出数据集\
  \ |\n\n注意：还可以使用 `FREQ` 和 `UNVARIATE` 过程生成汇总数据报告，但本章未涵盖这些过程。有关这些汇总工具的任何一个的更多信息，请参阅《Base\
  \ SAS Procedures Guide》中 `PROC FREQ` 和 `PROC UNIVARIATE` 的 SAS 文档。这些工具中的任何一个都可以汇总整个数据集，或按一个或多个类变量的任意组合进行汇总。要对数据分组，`PROC\
  \ MEANS`、`PROC SUMMARY` 和 `PROC TABULATE` 使用 `CLASS` 语句。`PROC SQL` 使用 `GROUP BY`\
  \ 子句。除 `PROC SQL` 之外的所有工具都接受 `BY` 语句。\n\n## 跨汇总工具的资源使用比较\n\n在对一个或多个类变量汇总数据时，以下组中的工具在资源使用上是类似的：\n\
  \n- `PROC MEANS`（或 `PROC SUMMARY`）、`PROC REPORT` 和 `PROC TABULATE`\n- `PROC SQL`\
  \ 和带有 `PROC SORT` 的 `DATA` 步骤\n\n然而，这两组工具的相对效率可能会根据 `CLASS` 变量的值而变化。你需要用你的数据测试这些技术。\n\
  \n## 对比示例：显示单个类变量的汇总统计\n\n## 概述\n\n假设你想通过计算每个类变量 `Order_Type` 取值的销售产品平均数量来汇总 `Retail.Orders`\
  \ 数据集。你可以使用多种技术来生成汇总报告。以下程序比较了五种技术。你可以将这些示例作为创建基准程序的模型。你的结果可能取决于数据结构、运行环境以及可用资源。\n\
  \n### 编程技术\n\n| ![1](img/callout01.png) `PROC MEANS` | 此 `PROC MEANS` 步骤创建一个报告，显示类变量\
  \ `Order_Type` 每个值的分析变量平均值。\n```\nproc means data=retail.orders\n     (keep=order_type\
  \ quantity)\n     meand=2;\nclass order_type;\nvar quantity;\nrun;\n``` |\n| ![2](img/callout02.png)\
  \ `PROC REPORT` | 此 `PROC REPORT` 步骤创建一个报告，显示类变量 `Order_Type` 每个值的分析变量平均值。\n```\n\
  proc report data=retail.orders\n     (keep=order_type quantity);\ncolumn order_type\
  \ quantity;\ndefine order_type / group width=13\n          'Order Type';\ndefine\
  \ quantity / mean format=5.2\n          'Average Quantity'\n          width=8;\n\
  run;\n``` |\n| ![3](img/callout03.png) `PROC SORT` 和 `DATA` 步骤 | 此程序使用 `PROC SORT`\
  \ 步骤和 `DATA` 步骤创建一个报告。`PROC SORT` 步骤对数据排序，保留必要的变量并生成临时输出数据集 `Orders`。`DATA` 步骤计算\
  \ `Order_Type` 每个值的分析变量 `Quantity` 的平均值，并在报告中显示这些值。\n```\nproc sort data=retail.orders\n\
  \     (keep=order_type quantity)\n     out=orders;\n   by order_type;\nrun;\n\n\
  data _null_;\n   set orders;\n   by order_type;\n   format average_order 5.2;\n\
  \   if first.order_type then do;\n      num=0;\n      sum=0;\n   end;\n   num+1;\n\
  \   sum+quantity;\n   if last.order_type then do;\n      average_order=sum / num;\n\
  \      file print;\n      put @5 'Order Type' @20 'Average Order';\n      put;\n\
  \      put @13 order_type 1\\. @27 average_order 5.2;\n   end;\nrun;\n``` |\n| ![4](img/callout04.png)\
  \ `PROC SQL` | 此 `PROC SQL` 步骤创建一个报告显示分组变量 `Order_Type` 每个值的分析变量平均值。\n```\nproc\
  \ sql;\n   select order_type,\n     avg(quantity) label='Average Order'\n      \
  \             format=5.2\n     from retail.orders\n     group by order_type;\nquit;\n\
  ``` |\n| ![5](img/callout05.png) `PROC TABULATE` | 此 `PROC TABULATE` 步骤创建一个报告，显示类变量\
  \ `Order_Type` 每个值的分析变量平均值。\n```\nproc tabulate data=retail.orders\n     (keep=order_type\
  \ quantity)\n     format=comma8.2;\nclass order_type;\nvar quantity;\ntable order_type,\
  \ quantity*mean;\nrun;\n``` |\n\n### 一般建议\n\n\n\n\n\n- 当对单个类变量进行数据汇总时，请测试您的数据以确定哪种汇总工具效率最高。\n\
  \n## 使用 PROC MEANS 显示类变量组合的汇总统计\n\n要为类变量的组合生成汇总统计数据，你可以通过以下方式使用 `PROC MEANS`。这些技术在资源使用上有所不同。\n\
  \n| 类变量组合 | 技术 | 示例 |\n| --- | --- | --- |\n| 所有可能的组合：abca * ba * cb * ca * b *\
  \ c | 基础 `PROC MEANS` 步骤 | |\n\n```\nproc means data=lib.dataset mean;\n   class\
  \ a b c;\n   var salary;\n   output out=summary1 \n          mean=average;\nrun;\n\
  ```\n| 特定组合：a * b 和 a * c | `PROC MEANS` 中的 `TYPES` 语句 | |\n\n```\nproc means data=lib.dataset\
  \ mean;\n   class a b c;\n   var salary;\n   types a*b a*c;\n   output out=summary2\
  \ \n          mean=average;\nrun;\n```\n| 特定组合：a * b 和 a * c | 多个 `PROC MEANS` 步骤中的\
  \ `NWAY` 选项 | |\n\n```\nproc means data=lib.dataset nway;\n   class a b;\n   var\
  \ salary;\n   output out=summary3a \n          mean=average;\nrun;\n\nproc means\
  \ data=lib.dataset nway;\n   class a c;\n   var salary;\n   output out=summary3b\n\
  \          mean=average;\nrun;\n```\n| 特定组合：a * b 和 a * c | `PROC MEANS` 中 `OUTPUT`\
  \ 语句的 `WHERE=` 选项 | |\n\n```\nproc means data=lib.dataset;\n   class a b c;\n  \
  \ var salary;\n   output out=summary4\n          (where=(_type_ in (5,3)))\n   \
  \       n=employees\n          mean=average;\nrun;\n```\n\n## 三种 PROC MEANS 技术的资源使用\n\
  \n汇总特定类变量组合数据的三种技术（基础 `PROC MEANS` 步骤之外）在资源使用上如下：\n\n- `PROC MEANS` 步骤中的 `TYPES`\
  \ 语句使用的资源最少。\n- 包含多个 `PROC MEANS` 步骤并带有 `NWAY` 选项的程序使用的资源最多，因为 SAS 必须为每个 `PROC MEANS`\
  \ 步骤单独读取数据集。单个 `PROC MEANS` 步骤中的 `NWAY` 选项是高效的。\n- `PROC MEANS` 步骤中的 `WHERE=` 数据集选项使用的资源比\
  \ `PROC MEANS` 中的 `TYPES` 语句，因为 SAS 在子集之前必须计算类变量的所有可能组合。然而，`PROC MEANS` 中的 `WHERE=`\
  \ 数据集选项使用的资源少于多个 `PROC MEANS` 步骤中的 `NWAY` 选项。\n\n我们将学习如何使用基础 `PROC MEANS` 步骤以及上述列出的其他三种技术。\n\
  \n## 使用基础 PROC MEANS 步骤合并所有类变量\n\n`PROC MEANS`（或 `PROC SUMMARY`）会创建：\n\n- 一个输出报告，对数据分组并显示所有类变量组合的汇总统计。这是默认操作。\n\
  - 如果出现 `OUTPUT` 语句，`PROC MEANS` 会创建一个输出数据集，包含所有 `n` 个类变量的可能组合（从 1 维到 `n` 维）以及整个整个数据集的汇总统计数据。\n\
  \n## 示例：显示类变量所有组合的汇总统计\n\n假设你想计算平均员工薪资，并根据三个类变量 `Employee_Country`、`Department`\
  \ 和 `Employee_Gender` 的组合对结果分组。以下 `PROC MEANS` 程序同时创建了一个报告数据集和一个 SAS 数据集：\n\n```\n\
  proc means data=company.organization_dim mean;\n   class employee_country department\
  \ \n         employee_gender;\n   var salary;\n   output out=summary mean=average;\n\
  run;\n```\n\n报告显示了三个类变量每种组合的汇总统计。下方显示了部分报告：![Analysis Variable: Salary](img/m85-35-g1.png)\
  \ 输出数据集包含以下内容的汇总统计数据：\n\n- 三个类变量的所有可能组合（1 维、2 维和 3 维）：\n    - `Employee_Gender`\n\
  \    - `Department`\n    - `Employee_Country`\n    - `Department` 和 `Employee_Gender`\n\
  \    - `Employee_Country` 和 `Employee_Gender`\n    - `Employee_Country` 和 `Department`\n\
  \    - `Employee_Country` 和 `Department` 和 `Employee_Gender`\n- 整个数据集\n\n输出数据集的部分视图所示：![partial\
  \ output](img/m85-35-g2.png)\n\n## 理解 Types\n\n用于 `PROC MEANS` 计算和分组统计的每种类变量组合被称为一个\
  \ `type`（类型）。例如，以下基础 `PROC MEANS` 步骤指定了三个类变量 `a`、`b` 和 `c`：\n\n```\nproc means data=lib.dataset\
  \ mean;\n   class a b c;\n   var salary;\n   output out=summary1 \n          mean=average;\n\
  run;\n```\n\n此 `PROC MEANS` 步骤生成七种可能的类型（三个变量的组合）：\n\n| 组合变量 | 维度 |\n| --- | ---\
  \ |\n| `a` | 1-way |\n| `b` | 1-way |\n| `c` | 1-way |\n| `b * c` | 2-way |\n| `a\
  \ * b` | 2-way |\n| `a * c` | 2-way |\n| `a * b * c` | 3-way\n\n`_TYPE_` 变量为 `PROC\
  \ MEANS` 中的每种类变量组合分配一个唯一的值，基于 `CLASS` 语句中的顺序。例如：\n\n| `_TYPE_` 值 | 组合描述 | 维度 |\n\
  | --- | --- | --- |\n| 1 | 仅右侧变量 | 1-way |\n| 2 | 仅中间变量 | 1-way |\n| 3 | 右侧和中间变量\
  \ | 2-way |\n| 4 | 左侧变量 | 1-way |\n| 5 | 左侧和右侧变量 | 2-way |\n| 6 | 左侧和中间变量 | 2-way\
  \ |\n| 7 | 三者变量组合 | 3-way |\n\n随着类变量数量的增加，类型的数量也会增加。然而，上述示例中的七种类型包含了类变量的组合。![types](img/m85-36-g2.png)\
  \ 输出数据集中的第一个观测值的 `_TYPE_` 值为 0，表示为整个数据集生成统计。默认情况下，`PROC MEANS` 生成的数据集包含每个类型中类变量值的每个唯一组合的单独观测值。类型中的每个唯一值组合被称为该类型的\
  \ level（级别）。在上述输出的数据集中，类型 2 有 17 个 level。因此，17 个观测值的 `_TYPE_` 值为 2。`PROC MEANS`\
  \ 生成的报告仅包含组合。\n\n## 使用 TYPES 语句合并类变量\n\n`TYPES` 语句指定类变量的所需组合。使用 `TYPES` 语句时需要 `CLASS`\
  \ 语句。\n\n`TYPES` 语句的通用形式：`TYPES request(s);` 语法说明如下：`request(s)` 指定类变量的组合或组合。请求包括：\n\
  \n- 单个类变量名\n- 用星号分隔的多个类变量名\n- `( )` 请求总体结果（`_TYPE_=0`）\n\n为了更简洁地请求类变量组合，可以使用分组语法，将多个变量括起来并与其他变量或变量组合连接。以下\
  \ `TYPES` 语句示例说明了分组语法的使用：\n\n| 使用分组语法的示例 | 等效的未使用分组语法的示例 |\n| --- | --- |\n| ```sas\n\
  types a*(b c);\n``` | ```sas\ntypes a*b a*c;\n``` |\n| ```sas\ntypes (a b)*(c d);\n\
  ``` | ```sas\ntypes a*c a*d b*c b*d;\n``` |\n| ```sas\ntypes (a b c)*d;\n``` | ```sas\n\
  types a*d b*d c*d;\n``` |\n| ```sas\ntypes () a*(b c);\n``` | |\n\n\n\n\n\n```\n\
  types a*b*c a*b a*c;\n```\n\n## 示例：在 PROC MEANS 中使用 TYPES \n\n假设你想像上一个示例一样计算员工的平均薪水。这次，你想要下面的两个类变量组合：\n\
  \n- `Employee_Country` 和 `Department`\n- `Employee_Country` 和 `Employee_Gender`\n\
  \n要实现这一点，你可以在 `PROC MEANS` 步骤中添加 `TYPES` 语句：\n\n```\nproc means data=company.organization_dim\
  \ mean;\n   class employee_country department \n         employee_gender;\n   var\
  \ salary;\n   types employee_country*department\n         employee_country*employee_gender;\n\
  \   output out=summary mean=average;\nrun;\n```\n\n此 `PROC MEANS` 步骤会生成一个报告数据集和一个输出数据集。下所示报告为\
  \ `TYPES` 语句中指定的两种组合中的每一个提供了一个单独的表格：![分析变量：工资年薪](img/m85-37-g1.png) 输出数据集仅包含 `TYPES`\
  \ 语句中指定的组合。输出数据集的部分视图所示：![部分输出](img/m85-37-g2.png)\n\n## 在 PROC MEANS 中使用 NWAY 选项合并类变量\n\
  \n指定类变量组合另一种方法是使用 `PROC MEANS` 中的 `NWAY` 选项：\n\n| `PROC MEANS` 语句中 `NWAY` 选项的通用形式：`PROC\
  \ MEANS NWAY;` | 语法说明：`NWAY` 指定输出数据集包含所有指定类变量组合的统计信息（仅具有最高 `_TYPE_` 值的观测值）。 | `NWAY`\
  \ 选项为所有类变量的每种组合生成摘要统计。因此，为了为不同的类变量组合生成统计信息，可以为每个组合指定一个单独的带有 `PROC MEANS` 步骤。 |\n\
  \n## 示例：在多个 PROC MEANS 步骤中使用 NWAY 选项\n\n假设你想计算员工的平均薪水，并对以下类变量组合的结果分组：\n\n- `Employee_Country`\
  \ 和 `Department`\n- `Employee_Country` 和 `Employee_Gender`\n\n你可以使用两个 `PROC MEANS`\
  \ 步骤，每个步骤都包含 `NWAY` 选项，如下所示。第一个 `PROC MEANS` 步骤为第一种类变量组合生成统计信息，第二个 `PROC MEANS`\
  \ 步骤为第二种类变量组合生成统计信息。\n\n```\nproc means data=company.organization_dim nway;\n  \
  \ class employee_country department;\n   var salary;\n   output out=summary1\n \
  \         n=employees\n          mean=average;\nrun;\n\nproc means data=company.organization_dim\
  \ nway;\n   class employee_country  employee_gender;\n   var salary;\n   output\
  \ out=summary2\n          n=employees\n          mean=average;\nrun;\n```\n\n在处理此程序时，SAS\
  \ 为每个 `PROC MEANS` 步骤读取一次数据集。这种处理效率不高。该程序生成两个报告和两个输出数据集。部分所示报告为每个 `PROC MEANS` 步骤提供了一个单独的表格：![分析变量：工资年薪](img/m85-38-g1.png)![部分输出](img/m85-38-g2.png)\
  \ 每个输出数据集的部分视图所示：图 23.2 SAS 数据集 Work.Summary1![数据集 Work.Summary1](img/m85-38-g3.png)图\
  \ 23.3 SAS 数据集 Work.Summary2![SAS 数据 Work.Summary2](img/m85-38-g4.png)\n\n## 在 PROC\
  \ MEANS 中使用 WHERE= 输出数据集选项选择所需的类型\n\n选择所需类型的另一种方法是使用 `OUTPUT` 语句中的 `WHERE=` 输出数据集选项：\n\
  \n| 基础 `OUTPUT` 语句中 `WHERE=` 输出数据集选项的通用形式：`OUTPUT <OUT=SAS-data-set> (WHERE=(where-expression-1\
  \ <logical-operator where-expression-n>));` | 语法说明：`SAS-data-set` 指定输出数据集的 1 层或\
  \ 2 层名称。`where-expression` 是算术或逻辑表达式，由运算符、操作数和 SAS 函数序列组成。该表达式必须括在括号内。`logical-operator`\
  \ 可以是 AND、AND NOT、OR 或 OR NOT。 |\n\n当你在 `OUTPUT` 语句中使用 `WHERE=` 输出数据集选项时，SAS 必须计算类变量的所有可能组合。在结果写入输出数据集之前不会进行子集划分。\n\
  \n## 示例：在 PROC MEANS 中使用 WHERE= 输出数据集选项\n\n假设你想计算员工平均薪水，并为三个类变量 `Employee_Country`、`Department`\
  \ 和 `Employee_Gender` 的两个双向组合选择结果。这些变量的所有可能组合列如下：\n\n| `_TYPE_` 值 | 组合变量 | 维度 |\n\
  | --- | --- | --- |\n| 1 | `Employee_Gender` | 1 向 |\n| 2 | `Department` | 1 向 |\n\
  | 3 | `Department * Employee_Gender` | 2 向 |\n| 4 | `Employee_Country` | 1 向 |\n\
  | 5 | `Employee_Country * Employee_Gender` | 2 向 |\n| 6 | `Employee_Country * Department`\
  \ | 2 向 |\n| 7 | `Employee_Country * Department * Employee_Gender` | 3 向 |\n\n要通过\
  \ `_TYPE_` 值指定类型，你可以如下所示在 `OUTPUT` 语句中使用 `WHERE=` 输出数据集选项：\n\n```\nproc means data=company.organization_dim;\n\
  \   class employee_country department \n         employee_gender;\n   var salary;\n\
  \   output out=summary \n          (where=_type_ in (5,6))\n          n=employees\n\
  \          mean=average;\nrun;\n```\n\n报告的部分所示。`PROC MEANS` 报告代表最高类型，即 `NWAY` 组合类型\
  \ 7，这并不是请求的![部分输出](img/m85-39-g1.png) 输出数据集 Work.Summary 部分视图所示。数据集包含了请求的类型 5 和\
  \ 6![Work.Summary](img/m85-39-g2.png)\n\n## 比较示例：显示类变量组合的摘要统计\n\n## 概述\n\n假设你想通过计算四个类变量的两个三向组合的员工平均薪水来汇总\
  \ `Retail.Organization` 数据集：\n\n- `Employee_Country`、`Department` 和 `Employee_Gender`\n\
  - `Department`、`Section` 和 `Employee_Gender`\n\n你可以使用多种技术来生成报告和多个输出数据集。以下程序比较了三种技术。你可以将这些示例作为在你自己的环境中创建基准程序的模型。\n\
  \n### 编程技术\n\n| ![1](img/callout01.png) PROC MEANS 中的 TYPES 语句 | 此程序计算类变量 `Employee_Country`、`Department`\
  \ 和 `Employee_Gender` 的两个三向组合的平均薪水。`TYPES` 语句请求了这两个组合。程序生成一个报告和一个名为 `Summary` 的输出数据集。```\n\
  proc means data=retail.organization mean;\n   class employee_country department\n\
  \         employee_gender section;\n   var salary;\n   types employee_country*department*employee_gender\n\
  \         department*section*employee_gender;\n   output out=summary\n         \
  \ n=employees\n          mean=average;\nrun;``` | ![2](img/callout02.png) 多个 PROC\
  \ MEANS 步骤中的 NWAY 选项 | 此程序的两个 `PROC MEANS` 步骤分别为四个类变量 `Employee_Country`、`Department`\
  \ 和 `Section` 的三向组合计算平均薪水。在每个步骤中，`NWAY` 选项指定 `CLASS` 语句中指定的三个变量进行组合。程序生成两个报告和名为\
  \ `Summary1` 和 `Summary2` 的两个输出数据集。```\nproc means data=retail.organization nway;\n\
  \   class employee_country department;\n   var salary;\n   output out=summary1\n\
  \          n=employees\n          mean=average;\nrun;\n\nproc means data=retail.organization\
  \ nway;\n   class employee_country  employee_gender;\n   var salary;\n   output\
  \ out=summary2\n          n=employees\n          mean=average;\nrun;\n``` |\n\n\n\
  \n\n```\nproc means data=retail.organization nway;\n   class employee_country department\n\
  \         employee_gender;\n   var salary;\n   output out=summary1\n          n=employees\n\
  \          mean=average;\nrun;\n\nproc means data=retail.organization nway;\n  \
  \ class department section\n         employee_gender;\n   var salary;\n   output\
  \ out=summary2\n          n=employees\n          mean=average;\nrun;\n```\n\n| ![3](img/callout03.png)\
  \ WHERE= Option in PROC MEANS 此程序计算了类变量 Employee_Country、Department、Employee_Gender\
  \ 和 Section 的两种三路组合的平均员工薪资。`OUTPUT` 语句中的 `WHERE=` 数据集通过其 `TYPE` 值指定了这两个组合。该程序生成了一个报告和一个名为\
  \ Summary3 的输出数据集。 |\n\n```\nproc means data=retail.organization;\n   class employee_country\
  \ department\n         employee_gender section;\n   var salary;\n   output out=summary3\
  \ (where=(_type_ in (7,14)))\n          n=employees\n          mean=average;\nrun;\n\
  ```\n\n### 通用建议\n\n- 要为类变量的特定组合汇总数据，请使用 `PROC MEANS` 中的 `TYPES` 语句。\n\n### 附加功能\n\
  \n`PROC MEANS` 中的 `WAYS` 语句提供了另一种显示类变量组合的摘要统计量的方法。在 `WAYS` 语句中，您指定一个或多个整数，用于定义组合类变量的数量，以形成类变量的所有唯一组合。例如，以下程序使用\
  \ `WAYS` 语句为三个类变量 `Employee_Country`、`Department` 和 `Employee_Gender` 的以下组合创建摘要统计量：\n\
  \n- 每个单独变量（所有 1 路组合）\n- 所有 2 路组合（`Employee_Country` 与 `Department`、`Employee_Country`\
  \ 与 `Employee_Gender` 以及 `Employee_Gender` 与 `Department`）\n\n```\nproc means data=company.organization\
  \ mean;\n   class employee_country department\n         employee_gender;\n   var\
  \ salary;\n   ways 1 2;\n   output out=summary\n          mean=average;\nrun;\n\
  ```\n\n`WAYS` 语句可以替代 `TYPES` 语句，也可以与其结合使用。注意：有关关于 `WAYS` 语句的更多信息，请参阅 SAS 文档。\n\n\
  ## 总结\n\n## 使用索引进行高效 WHERE 处理\n\n在处理 `WHERE` 表达式时，SAS 会确定是顺序访问（通过检查所有观测值）还是直接访问（使用索引访问特定观测值）更高效。使用索引处理\
  \ `WHERE` 表达式可能会提高性能，这被称为优化 `WHERE` 表达式。通过决定是否创建索引，您决定了 SAS 可以使用何种访问方法。为了决定是否使用索引，您必须评估使用索引的收益和成本。SAS\
  \ 会执行一系列步骤，以确定是使用索引处理 `WHERE` 表达式还是按顺序读取所有观测值。\n\n## 识别可用索引\n\n首先，SAS 确定是否存在可以用于处理\
  \ `WHERE` 表达式的现有索引。具体而言，SAS 会检查 `WHERE` 表达式中每个条件中的变量，以确定该变量是简单索引中的键变量，还是复合索引中的第一个键变量。无论有多少可用索引，SAS\
  \ 只能使用一个索引来处理 `WHERE` 表达式。因此，如果存在多个索引，SAS 必须在它们之间进行选择。最常见的情况是 SAS 使用索引仅处理 `WHERE`\
  \ 表达式中的一个条件。然而，在名为“复合优化”的过程中，SAS 可以使用复合索引优化多个变量上的多个条件，这些条件是使用 `AND` 等逻辑运算符连接的。\n\
  \n## 识别可优化的条件\n\n其次，SAS 在包含键变量的 `WHERE` 条件中寻找可以被优化的运算符和函数。也有某些运算符和函数是无法优化的。对于复合优化，`WHERE`\
  \ 条件必须满足略有不同的标准才能成为优化候选。\n\n## 估算观测值数量\n\n第三，SAS 估计符合索引的观测值数量。当存在多个索引时，SAS 会选择似乎产生最少符合观测值（最小子集）的索引。SAS\
  \ 是否使用索引取决于符合观测值的百分比（子集相对于数据集的大小）。对于小子集使用直接访问、对于大子集使用顺序访问更高效。如果 SAS 估计符合观测值少于数据文件的\
  \ 3%，它将自动使用索引，而不比较可能的资源使用情况。为了帮助 SAS 估计 `WHERE` 表达式将选择多少观测值，每个索引都存储了 21 个称为累积百分位数（centiles）的统计数据。分位数提供了有关索引变量值分布的信息。\n\
  \n## 比较可能的资源使用情况\n\n第四，SAS 决定使用索引还是顺序读取所有观测值来满足 `WHERE` 表达式更高效。为了做出决定，SAS 会预测每种访问方法满足\
  \ `WHERE` 表达式需要多少 I/O 操作，然后比较两种资源成本。影响 `WHERE` 处理所需的 I/O 操作数量的因素包括：\n\n- 子集大小相对于数据集的大小\n\
  - 数据文件中的页数\n- 数据顺序\n- 顺序读取压缩文件的代价\n\n数据类型和长度是影响索引效率的两个因素。\n\n### 决定是否创建索引\n\n当您使用\
  \ `WHERE` 表达式选择子集时，可以使用特定指南决定创建索引是否高效。取决于子集相对于数据集的大小等因素，您可能会选择或不创建索引。在大多数情况下，让 SAS\
  \ 决定是否对 `WHERE` 使用索引是。但有时您可能希望控制 SAS 使用现有索引。可以使用数据集选项 `IDXWHERE=` 或 `IDXNAME=` 中的任意一个，但不能同时使用。您可以指定\
  \ `MSGLEVEL=I` 以让 SAS 在日志中显示索引使用信息。\n\n## 比较生成详细报告的过程\n\n当您生成详细报告时，可以在 `PRINT` 过程和\
  \ `SQL` 过程之间进行选择。为了执行特定任务，单用途工具如 `PROC PRINT` 通常比多功能工具如 `PROC SQL` 使用更少的资源。对于详细报告，`PROC\
  \ PRINT` 步骤通常（并非总是）比 `PROC SQL` 步骤消耗更少：\n\n- 生成简单详细报告、子集详细报告和排序详细报告时，`PROC PRINT`\
  \ 比 `PROC SQL` 更高效。\n- `PROC PRINT` 和 `PROC SQL` 在生成排序子集详细报告时可能消耗相似。\n\n## 数据汇总工具比较\n\
  \nSAS 提供了多种汇总工具，包括 `MEANS` 过程（或 `SUMMARY` 过程）、`TABULATE` 过程、`REPORT` 过程、`SQL` 过程和\
  \ `DATA` 步骤。如果您为一个类变量汇总数据，以下组工具的资源使用是相似的：\n\n- `PROC MEANS`（或 `PROC SUMMARY`）、`PROC\
  \ REPORT` 和 `PROC TABULATE`\n- `PROC SQL` 和 `DATA` 步骤\n\n\n\n\n然而，这两组工具的相对效率取决于数据的形状。你可以以多种方式使用\
  \ `PROC MEANS` 为类变量（class variables）的组合生成摘要统计。每个类变量的组合被称为一个类型（type）。要对所有类变量的所有组合进行数据汇总，你可以使用基础的\
  \ `PROC MEANS` 步骤（或 `PROC SUMMARY` 步骤）。要为特定的类变量组合生成摘要统计，你可以按以下方式使用 `PROC MEANS`：\n\
  \n*   `PROC MEANS` 步骤中的 `TYPES` 语句\n*   多个 `PROC MEANS` 步骤中的 `NWAY` 选项\n*   `PROC\
  \ MEANS` 步骤中的 `WHERE=` 输出数据集选项\n\n这三种技术的效率各不相同；`PROC MEANS` 中的 `TYPES` 语句效率最高。你也可以使用\
  \ `PROC MEANS` 中的 `WAYS` 语句来为特定的类变量组合生成摘要统计。\n\n# 测验\n\n为每个问题选择一个最佳答案。完成测验后，请使用附录中的答案页检查你的答案。\n\
  \n1. 为什么使用索引可以减少访问较小子集所需的 I/O 操作次数？\n    1. 使用索引需要更大的 I/O 内存缓冲区，它可以容纳更多页面。\n   \
  \ 2. 索引不需要加载到内存缓冲区中。\n    3. SAS 必须加载到程序数据向量 (`PDV`) 中的观测值数量减少了。\n    4. SAS 必须加载到\
  \ I/O 缓冲区中的页面减少了。\n\n2. 你想从数据集 `Company.Products` 中选择观测值的子集，并且你已经在变量 `Rating` 上定义了一个简单索引。SAS\
  \ 无法使用索引处理以下哪个 `WHERE` 语句？\n    1. ```sas\n       where rating is missing;\n   \
  \    ```\n    2. ```sas\n       where rating=int(rating);\n       ```\n    3. ```sas\n\
  \       where rating between 3.5 and 7.5;\n       ```\n    4. ```sas\n       where\
  \ rating=5.5;\n       ```\n\n3. 在以下情况下，顺序访问在 `WHERE` 处理中可能比直接访问更高效？\n    1. 子集包含数据集中\
  \ 75% 以上的观测值。\n    2. `WHERE` 表达式在单个复合索引中指定了两个键变量。\n    3. 数据已按键变量排序。\n    4. 数据集非常大。\n\
  \n4. 你想汇总数据并按一个变量进行分组。以下哪个工具不能？\n    1. 带有 `BY`-组处理的 `DATA` 步骤。\n    2. 不带 `BY`-组处理的\
  \ `DATA` 步骤。\n    3. 带有 `GROUP BY` 子句的 `PROC SQL`。\n    4. 带有 `CLASS` 语句的 `PROC\
  \ MEANS`。\n\n5. 下哪些技术没有为类变量的特定组合汇总数据？\n    1. 多个 `PROC MEANS` 步骤中的 `NWAY` 选项。\n\
  \    2. `PROC MEANS` 步骤中的 `TYPES` 语句。\n    3. `PROC MEANS` 步骤中的 `WHERE=` 输出数据集选项。\n\
  \    4. 基础的 `PROC MEANS` 步骤。\n\n# 第 24 章：使用 PROC FCMP 创建函数\n\n## 概述\n\n## 引言\n\n\
  SAS 函数编译器 (`FCMP`) 过程允许你创建、测试和存储用户定义的函数、`CALL` 例和子程序，以供其他 SAS 过程和 `DATA` 步骤使用。\n\
  \n# 使用 PROC FCMP\n\n## 概述\n\n`FCMP` 过程使用 SAS 语言编译器来创建用户定义的函数。编译器子系统为运行 SAS 的计算机生成机器语言代码。你可以在\
  \ `PROC FCMP` 中创建的函数和子程序可以用于 `DATA` 步骤、`WHERE` 语句、输出交付系统 (`ODS`) 以及以下过程：\n\n| `PROC\
  \ CALIS` | `PROC OPTLSO` |\n| :--- | :--- |\n| `PROC GA` | `PROC QUANTREG` |\n|\
  \ `PROC GENMOD` | `PROC REPORT` COMPUTE 块 |\n| `PROC GLIMMIX` | SAS Risk Dimensions\
  \ 过程 |\n| `PROC MCMC` | `PROC SEVERITY` |\n| `PROC MODEL` | `PROC SIMILARITY` |\n\
  | `PROC NLIN` | `PROC SQL` (不支持带有数组参数的函数) |\n| `PROC NLMIXED` | `PROC SURVEYPHREG`\
  \ |\n| `PROC NLP` | `PROC VARMAX` |\n\n## 编写 PROC FCMP 步骤\n\n以下是 `PROC FCMP` 的语法：\n\
  \n创建和保存函数的基础 `PROC FCMP` 步骤的一般形式：\n```sas\nPROC FCMP OUTLIB= libref.data-set.package;\n\
  Function function-name(argument-1<$>,...,argument-n<$><length>);\n```\n\n`OUTLIB=`\
  \ 选项指定存储编译函数的包。`PROC FCMP` 语句开始 `FCMP` 步骤。必须指定 `OUTLIB=` 。\n\n`FUNCTION` 语句开始定义函数并以\
  \ `ENDSUB` 语句结束。下面的示例创建了一个名为 `ReverseName` 的函数。\n\n```sas\nproc fcmp outlib=orion.functions.dev;\n\
  function ReverseName(name $) $40;\n```\n\n`RETURN` 语句指定函数的返回值。\n\n```sas\nreturn(catx('',scan(name,2,','),scan(name,1,)));\n\
  ```\n\n# 关于 PROC FCMP\n\n`FCMP` 过程使用 SAS 语言编译器创建用户定义的函数。编译器子系统为运行 SAS 的计算机生成机器语言代码。你可以在\
  \ `PROC FCMP` 中创建的函数和子程序用于 `DATA` 步骤、`WHERE` 语句、输出交付系统 (`ODS`) 以及以下过程：\n\n| `PROC\
  \ CALIS` | `PROC OPTLSO` |\n| :--- | :--- |\n| `PROC GA` | `PROC QUANTREG` |\n|\
  \ `PROC GENMOD` | `PROC REPORT` 块 |\n| `PROC GLIMMIX` | Risk Dimensions 过程 |\n|\
  \ `PROC MCMC` | `PROC SEVERITY` |\n| `PROC MODEL` | `PROC SIMILARITY` |\n| `PROC\
  \ NLIN` | `PROC SQL` (不支持带有数组参数的函数) |\n| `PROC NLMIXED` | `PROC SURVEYPHREG` |\n\
  | `PROC NLP` | `PROC VARMAX` |\n\n# PROC FCMP 语句\n\n`PROC FCMP` 语句开始 `FCMP` 步骤。`OUTLIB=`\
  \ 选项指定存储编译函数的包。函数和子程序名称在包内必须是唯一的。\n\n```sas\nproc fcmp outlib=orion.functions.dev;\n\
  ```\n\n# FUNCTION 语句\n\n`FUNCTION` 语句开始定义函数并以 `ENDSUB` 语句结束。下面的示例创建了一个名为 `ReverseName`\
  \ 的函数。\n\n```sas\nfunction ReverseName(name $) $40;\n```\n\n# RETURN 语句\n\n`RETURN`\
  \ 语句指定函数的返回值。\n\n```sas\nreturn(catx('',scan(name,2,','),scan(name,1,)));\n```\n\
  \n# 使用定义的函数\n\n为了在 `DATA` 步骤或支持的 `PROC` 步骤中使用新函数，必须指定 `CMPLIB=` 系统选项。`CMPLIB=` 选项指定一个或多个存储用户定义的函数。在这个示例中，函数\
  \ `ReverseName` 保存到 `orion.functions`。\n\n```sas\noptions cmplib=orion.functions;\n\
  ```\n\n在以下代码中调用函数 `ReverseName`：\n\n```sas\noptions cmplib=orion.functions;\ndata\
  \ work.emplist;\n    set orion.employeeaddresses;\n    NewName=ReverseName(EmployeeName);\n\
  run;\n```\n\n# 使用 PROC FCMP 创建子程序\n\n`ROUTINE` 语句命名处理的代码块并指定参数。`OUTARGS` 语句指定子程序更新的参数。在下面的示例中，子程序\
  \ `CALC_YEARS` 用于从日期变量计算到期时间（years）：\n\n```sas\nsubroutine calc_years(maturity,\
  \ current_date, years);\n   outargs years;\n   years=(maturity - current_date) /\
  \ 365.25;\nendsub;\n```\n\n下面的代码是调用 `CALC_YEARS` 子程序的示例：\n\n```sas\ndata _null_;\n\
  \  myCD='23jul2017'd;\n  now=today();\n  how_many_years=.;\n  call calc_years(myCD,now,how_many_years);\n\
  \  put how_many_years=;\nrun;\n```\n\n# 测验\n\n为每个问题选择一个最佳答案。完成测验后，请使用附录中的答案页检查你的答案。\n\
  \n1. 为什么使用索引可以减少访问较小子集所需的 I/O 操作次数？\n    1. 使用索引需要更大的 I/O 内存缓冲区，它可以容纳更多页面。\n   \
  \ 2. 索引不需要加载到内存缓冲区中。\n    3. SAS 必须加载到程序数据向量 (`PDV`) 中的观测值数量减少了。\n    4. SAS 必须加载到\
  \ I/O 缓冲区中的页面减少了。\n\n2. 你想从数据集 `Company.Products` 中选择观测值的子集，并且你已经在变量 `Rating` 上定义了一个简单索引。SAS\
