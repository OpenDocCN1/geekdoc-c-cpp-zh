  \n    1. 当 `month=8` 时\n    2. 当 `month=9` 时\n    3. 当 `month=10` 时\n    4. 以上均不是\n\
  \n4. 如果当前日期是 2003 年 3 月 30 日，哪个表格正确显示了 `y1`、`y2`、`y3` 和 `Nextfile` 的值？\n\n    ```\n\
  \    data work.quarter (drop=monthnum midmon lastmon); \n       y3=year(today());\n\
  \       y2=y3-1;\n       y1=y3-2;\n       do i = y3, y2, y1;\n          nextfile=\"\
  c:\\data\\Y\"!!put(i,4.)!!\".dat\";        \n          do until (lastobs); \n  \
  \           infile temp filevar=nextfile \n               end=lastobs; \n      \
  \       input Flight $ Origin $ Dest $ \n                   Date : date9.;\n   \
  \          output;\n          end;\n       end;\n       stop;\n    run;\n    ```\n\
  \n    1. `y1=2001`, `nextfile=c:\\data\\Y2001.dat`\n    2. `y2=2002`, `nextfile=c:\\\
  data\\Y2002.dat`\n    3. `y3=2003`, `nextfile=c:\\data\\Y2003.dat`\n    4. 以上所有。\n\
  \n\n\n\n\n| --- | --- |\n| y1 | `c:\\data\\Y2003.dat` |\n| y2 | `c:\\data\\Y2002.dat`\
  \ |\n| y3 | `c:\\data\\Y2001.dat` |\n\n4. | `i=` | `Nextfile=` |\n| --- | --- |\n\
  | y1 | `c:\\data\\Y3.dat` |\n| y2 | `c:\\data\\Y2.dat` |\n| y3 | `c:\\data\\Y1.dat`\
  \ |\n\n### 5. 当 SAS 处理输入文件中的最后数据记录时会发生什么？\n\n1. `END=` 变量被设置为 1。\n2. `END=` 变量被设置为\
  \ 0。\n3. `END=` 变量被设置为输入文件中的记录数。\n4. `END=` 变量写入 SAS 数据集。\n\n### 6. 哪个程序将 `Work.London`\
  \ 追加到 `Work.Flights` 之后？\n\n1. ```\nproc append base=work.london \n            data=work.flights;\n\
  run;\n```\n2. ```\nproc append data=work.london \n            base=work.flights;\n\
  run;\n```\n3. ```\nproc append data=work.london work.flights;\nrun;\n```\n4. ```\n\
  proc append data=work.flights work.london;\nrun;\n```\n\n### 7. 提交以下程序时会发生什么？\n\n\
  ```\nproc append base=staff.marketing\n            data=staff.sales force;\nrun;\n\
  ```\n\n| Staff.Marketing 的数据集描述 | Staff.Sales 的数据集描述 |\n| --- | --- |\n| ![](img/m55-27-g11.png)\
  \ | ![](img/m55-27-g12.png) |\n\n1. `Staff.Marketing` 中的 `LastName` 长度被转换为 20。\n\
  2. `Staff.Marketing` 中删除了 `LastName`。\n3. 从 `Staff.Sales` 读取的 `LastName` 观测值被分配缺失值。\n\
  4. 从 `Staff.Sales` 读取的观测值中，`LastName` 的某些值可能会被截断。\n\n### 8. 哪个程序将 `Work.April` 追加到\
  \ `Work.Y2003` 之后？\n\n| Work.Y2003 的数据集描述 | Work.April 的数据集描述 |\n| --- | --- |\n\
  | ![](img/m55-27-g13.png) | ![](img/m55-27-g14.png) |\n\n1. ```\nproc append base=work.y2003\
  \ \n            data=work.april;\nrun;\n```\n2. ```\nproc append base=work.april\
  \ \n            data=work.y2003 force;\nrun;\n```\n3. ```\nproc append base=work.y2003\n\
  \            data=work.april force;\nrun;\n```\n4. ```\nproc append base=work.april\
  \ \n            data=work.y2003;\nrun;\n```\n\n### 9. 使用 `PROC APPEND` 将 SAS 数据集\
  \ `Work.NewHires` 追加到 SAS 数据集 `Work.Employees` 时会发生什么？\n\n| Work.Employees 的数据集描述\
  \ | Work.NewHires 的数据集描述 |\n| --- | --- |\n| ![](img/m55-27-g15.png) | ![](img/m55-27-g16.png)\
  \ |\n\n1. 从 `Work.NewHires` 读取的观测值的 `Room` 被分配了缺失值。\n2. `Work.Employees` 中所有观测值的\
  \ `Room` 被分配了缺失值。\n3. `Work.Employees` 中删除了 `Room`。\n4. 从 `Work.NewHires` 读取的观测值中，`Name`\
  \ 的值被截断。\n\n### 10. 在以下情况下，你不需要配合 `PROC APPEND` 使用 `FORCE` 选项：\n\n1. `DATA=` 数据集包含\
  \ `BASE=` 数据集中不存在的变量。\n2. `BASE=` 数据集包含 `DATA=` 数据集中不存在的变量。\n3. `DATA=` 数据集中的变量比\
  \ `BASE=` 数据集中对应的变量更长。\n4. `DATA=` 数据集中的变量类型与 `BASE=` 数据集中对应的变量类型不同。\n\n# 第 15 章：水平合并数据\n\
  \n## 概述\n\n## 引言\n水平合并数据是指将多个数据集合并或连接到一个数据集的过程。这个过程被称为水平合并，是因为在最终的数据集中，每个观测值（或水平行）将包含来自多个输入数据集的变量。![水平合并](img/m56-1-g1.png)如果有包含相关信息的数据集，水平合并数据是非常有用的。例如，假设你有一个包含\
  \ IDNumber、Name 和 Address 的员工数据数据集，以及另一个包含 Salary 的员工数据数据集。你可以水平地合并这两个数据集的数据，创建一个包含\
  \ IDNumber、Name、Address 和 Salary 的输出数据集。本章将重点介绍在 DATA 步中水平合并数据的几种方法，并比较了 DATA 步匹配-合并与\
  \ PROC SQL 链接。本章还涵盖了将输入数据集与非数据集值进行水平合并的几种技术。\n\n## 回顾术语\n\n## 概述\n在检查水平合并数据的技术之前，这里是对本章使用的一些术语的回顾。\n\
  \n| 术语 | 定义 |\n| --- | --- |\n| 水平合并数据 | 根据主源变量的值，从辅助源或源检索数据的技术。 |\n| 执行表查找 | 根据主源变量的值，从辅助源或源检索数据的技术。\
  \ |\n| 基表 | 水平合并中的主源。在本章中，基表始终是一个 SAS 数据集。 |\n| 查找表或表 | 用于水平合并的基表以外的输入源。 |\n| 查找值或返回值\
  \ | 水平合并期间从查找表或表中检索的数据值或值。 |\n| 键变量或变量 | 基表和查找表中共同存在的多个变量。通常，键值在查找表中唯一的，但在基表中并不唯一。\
  \ |\n| 键值或值 | 当基表中的键值在查找表中找到匹配的键值时，查找成功。 |\n\n注意：水平合并数据和表查找是同义词，在本章中交替使用。注意：本章将\
  \ PROC SQL 技术与 DATA 步技术进行了比较。在 PROC SQL 术语中，SAS 数据集通常称为表，变量通常称为列，观测值通常称为行。下图说明了一个用于水平合并的基表和查找表。键变量是\
  \ Num。键值在 Num 下方垂直列出。![水平合并](img/m56-2-g1.png)\n\n## 输入数据源之间的关系\n\n\n\n\n\n在执行表查找时，需要考虑的一个重要因素是输入数据源之间的关系。为了在水平方向合并数据，你必须能够匹配来自每个输入数据源的观测值。例如，每个输入数据源可能有一个或多个共同的变量。输入数据源之间的关系描述了根据这些键值，一个源中的观测值与另一个源中的观测值之间的关系。以下术语描述了基表和查找表之间可能的关系：\n\
  \n- 一对一匹配\n- 一对多匹配\n- 多对多匹配\n- 不匹配数据\n\n在一对一匹配中，基表和查找表中的键值都是唯一的。因此，对于基表中的每个观测值，查找表中最多有一个观测值具有匹配的键值。![one-to-one\
  \ match](img/m56-3-g1.png) 在一对多匹配中，基表中的键值是唯一的，但查找表中的键值不是唯一的。也就是说，对于基表中的每个观测值，查找表中可以有一个或多个具有匹配键值的观测值。![one-to-one\
  \ match](img/m56-3-g2.png) 在多对多匹配中，基表或查找表中的键值均不唯一。也就是说，基表中至少有一个观测值匹配查找表中的多个观测值，且查找表中至少有一个观测值匹配基表中的多个观测值。多对多是一种理论上或数学上的可能性，但很少代表实际的业务应用。如果一个业务应用看起来是多对多的，通常是因为不小心向查找表中添加了重复行。![one-to-one\
  \ match](img/m56-3-g3a.png) 有时你会遇到一对一、一对多或多对多的匹配，同时也包含不匹配数据。也就是说，基表中存在不匹配查找表中任何观测值的观测值，或者查找表中存在某些观测值在基表中没有匹配的观测值。如果你的基表或查找表包含包含不匹配数据，你将出现以下情况之一：\n\
  \n- 密集匹配（dense match），其中一个表的每个或几乎每个观测值在另一个表中都有匹配的观测值。在底图中，基表中的第一个观测值是未的。![dense\
  \ match](img/m56-3-g4.png)\n- 稀疏匹配（sparse match），其中有很多不匹配的观测值。![sparse match](img/m56-3-g5.png)\n\
  \n# 在 SAS 数据集之外使用查找值\n\n## 概述\n\n请记住，你的查找表并不非是一个 SAS 数据集。假设你想将基表的数据与未存储在 SAS 数据集中的查找值合并。你可以使用以下技术将查找值硬编码到程序中：\n\
  \n- `IF-THEN/ELSE` 语句\n- SAS 数组（arrays）\n- 用户定义的 SAS 格式（formats）\n- 哈希对象（hash objects）\n\
  \n## IF-THEN/ELSE 语句\n\n你应该熟悉 `IF-THEN/ELSE` 语句的语法和用法。总体而言，这种技术易于使用且易于理解。由于其简单性，并且你可以配合它使用其他\
  \ DATA step 语法，`IF-THEN/ELSE` 语句作为执行查找操作的技术可以非常灵活。如果你的查找值没有存储在数据集中，可以使用这种技术，并用它来处理基表和查找表之间任何可能的关系。你可以用它检索单个或多个值。例如，你可以使用\
  \ DO 组根据条件提供多个值。请记住，这种技术需要维护。如果你预计查找值会发生，或者你有大量的查找值，或者你在多个程序中使用这些查找值，那么维护程序中 `IF-THEN/ELSE`\
  \ 语句所需的资源可能会使这种技术不再适用。此外，这种技术可能会导致程序冗长得难以接受，甚至导致程序因为超时而无法执行。\n\n## 示例：使用 IF-THEN/ELSE\
  \ 语句合并数据\n\n假设你有一个数据集 `Mylib.Employees`，其中包含关于员工的信息。`Mylib.Employees` 包含一个名为 `IDnum`\
  \ 的变量，记录每个员工的唯一识别码。如果你想将 `Mylib.Employees` 中的数据与未存储在数据集中的员工出生日期列表合并，可以使用 `IF-THEN/ELSE`\
  \ 语句来实现。\n\n```sas\ndata mylib.employees_new;\n   set mylib.employees;\n   if IDnum=1001\
  \ then Birthdate='01JAN1963'd;\n   else if IDnum=1002 then Birthdate='08AUG1946'd;\n\
  \   else if IDnum=1003 then Birthdate='23MAR1950'd;\n   else if IDnum=1004 then\
  \ Birthdate='17JUN1973'd;\nrun;\n```\n\n## SAS 数组\n\n你应该熟悉 `ARRAY` 语句的语法和用法。通过 `ARRAY`\
  \ 语句，你既可以将查找值硬编码到程序中，也可以从数据集中读取到数组中。SAS 数组的元素是通过位置引用的。也就是说，你使用数值值作为数组的指针。因此，你必须通过位置或根据另一个数值来标识数组元素。你可以使用多个值或数值表达式来确定返回的数组元素。这种技术能够从查找操作返回单个值。数组的维度必须在编译时通过宏变量提供。\n\
  \n## 示例：使用 ARRAY 语句合并数据\n\n我们将考虑将 `Mylib.Employees` 的数据与查找值列表合并的示例。请记住 `Mylib.Employees`\
  \ 包含关于员工的信息，其识别码（`IDnum`），但未包含出生日期。你可以使用 `ARRAY` 语句将出生日期硬编码到名为 `Birthdates` 的临时数组中，然后使用该数组与\
  \ `Mylib.Employees` 中的数据合并。在下面的 DATA step 中，作为数组下标的值对应于基表 `Mylib.Employees` 中的变量\
  \ `IDnum`。新变量 `Birthdate` 的赋值语句根据 `IDnum` 的当前值从 `Birthdates` 数组检索值。\n\n```sas\n\
  data mylib.employees_new;\n   array birthdates{1001:1004} _temporary_ ('01JAN1963'd\n\
  \         '08AUG1946'd '23MAR1950'd '17JUN1973'd);\n   set mylib.employees;\n  \
  \ Birthdate=birthdates{IDnum};\nrun;\n```\n\n## 用户定义的 SAS 格式\n\n你应该熟悉 `FORMAT` 过程结合\
  \ `VALUE` 语句的语法和用法。格式可以在 `FORMAT` 语句、`PUT` 语句以及赋值 `WHERE` 或 `IF` 语句中的 `PUT` 函数中引用。`FORMAT`\
  \ 过程对查找表使用二进制查找。使用这种技术的另一个优点是维护是集中化的；如果查找值发生变化，你只需要在一个地方（格式中）进行更改，每个使用该格式的程序都会使用新值。\n\
  \n## 示例：使用 FORMAT 过程合并数据\n\n再次假设数据集 `Mylib.Employees` 根据员工识别码（`IDnum`）包含员工信息，但不包含员工的出生日期。你可以使用格式将员工的出生日期与存储在\
  \ `Mylib.Employees` 中的数据合并。下面的 `PROC FORMAT` 步骤使用 `VALUE` 语句在 `BIRTHDATE` 格式中硬编码查找值。DATA\
  \ step 使用 `PUT` 函数将格式查找值与 `IDnum` 的值关联。`INPUT` 函数将查找值与 `DATE9.` 格式关联，并将格式化值分配给新变量\
  \ `Birthdate`。\n\n\n\n\n\n```sas\nproc format;\n   value birthdate 1001 = '01JAN1963'\n\
  \                   1002 = '08AUG1946'\n                   1003 = '23MAR1950'\n\
  \                   1004 = '17JUN1973';\n   run;\n\n   data mylib.employees_new;\n\
  \   set mylib.employees;\n   Birthdate=input(put(IDnum,birthdate.),date9.);\nrun;\n\
  ```\n\n# 使用 DATA 步进行匹配-合并数据\n\n## DATA 步匹配-合并\n当每个输入数据集中都有共同的 `BY` 变量时，你应该已经知道如何在\
  \ `DATA` 步中合并多个数据集。当你使用 `MERGE` 语句执行表查找操作时，你的查找值必须存储在一个或多个 SAS 数据集中。这种技术要求基准表和查找表（或多个表）都已根据\
  \ `BY` 变量或变量进行了排序或建立索引。只要所有输入数据集具有共同的 `BY` 变量，你就可以在 `MERGE` 语句中指定任意数量的输入。`MERGE`\
  \ 语句可以合并任意大小的数据集。`MERGE` 语句能够返回多个值。你可以使用多个 `BY` 变量来执行依赖于多个一个变量的查找。`MERGE` 语句默认同时返回匹配项和不匹配项，但你可以使用\
  \ `DATA` 步语法来仅返回精确匹配项，或仅包含查找表中的特定变量。\n\n**注意**：尽管你可以使用 `MERGE` 语句合并来自任何类型关系源的数据，但在处理多对多匹配时，这种技术可能无法产生预期的结果。在\
  \ `DATA` 步中合并数据集时，观测值是按顺序匹配并组合的。一旦某个观测值被读取，它就不会被重新读取。这意味着 `DATA` 步的 `MERGE` 语句不会创建笛卡尔积。因此，在处理多对多匹配时，`DATA`\
  \ 步 `MERGE` 语句可能不是执行查找操作的合适技术。\n\n## 处理多个查找表\n有时，你可能需要合并来自三个或更多相关 SAS 数据集的数据以创建一个新数据集。例如，下面列出的三个数据集都包含关于一家虚拟航空公司航班和机场的不同信息。`Sasuser.Acities`\
  \ 包含关于各种机场的数据，`Sasuser.Revenue` 包含由各种航班产生的收入的数据，`Sasuser.Expenses` 包含由各种航班产生的费用的数据。这些数据集中的变量列在此处。\n\
  \n![处理多个查找表](img/m56-10-g1.png)\n\n假设你想创建一个名为 `Sasuser.Alldata` 的新数据集，包含来自这三个输入数据集的数据。如下所示，`Sasuser.Alldata`\
  \ 数据集包含新变量 `Profit`，该变量根据存储在 `Sasuser.Revenue` 中的收入值和存储在 `Sasuser.Expenses` 中的费用值计算得出。\n\
  \n![处理多个查找表](img/m56-10-g2.png)\n\n只要所有输入数据集具有共同的 `BY` 变量，你就可以在 `MERGE` 语句中指定任意数量的输入数据集。然而，从上面的数据集变量列表中可以看出，这三个数据集并没有共同的变量。我们将考虑一种对这三个数据集执行匹配-合并的方法。\n\
  \n尽管 `Sasuser.Acities`、`Sasuser.Revenue` 和 `Sasuser.Expenses` 这三个数据集没有共同的 `BY` 变量，但有几个变量是三个数据集中的两个共有的。如下所示，`Date`\
  \ 和 `FlightID` 在 `Revenue` 和 `Expenses` 共有。`Acities` 数据集中的变量 `Code` 和 `Revenue`\
  \ 数据集中的变量 `Dest` 虽然命名不同，但它们包含相同类型和长度的数据。\n\n![处理多个查找表](img/m56-11-g1.png)\n\n注意\
  \ `Acities` 中的 `Code` 和 `Revenue` 中的 `Dest` 被列为相互对应，尽管它们的名称不同。当你在这数据集之间寻找共同变量时，变量名并不重要，因为它们可以通过\
  \ `MERGE` 语句中的 `RENAME=` 选项进行更改。相反，你应该寻找在每个输入数据集中记录相同信息且具有相同类型的变量。共同变量不需要具有相同的长度，但你应该记住，第一个列出的数据集中的变量长度将决定输出数据集中变量的长度。\n\
  \n**注意**：在 `MERGE` 语句的多个数据集中具有相同名的变量也必须具有相同的类型。如果不同输入数据集中的任何变量具有相同名称但类型不同，SAS 日志中将写入\
  \ `ERROR` 和 `WARNING` 信息，且匹配-合并失败。在这种情况下，`Acities` 中的 `Code` 和 `Revenue` 中的 `Dest`\
  \ 都记录了机场的三字母缩写。\n\n**提示**：你可以使用 `PROC CONTENTS` 查看关于变量的信息，如类型、长度和描述。由于显示的三个数据集之间存在对共有变量，你可以通过在两个后续的\
  \ `DATA` 步中使用 `MERGE` 语句将这些数据集合并为一个数据集。也就是说，你可以先对其中两个数据集执行一次匹配-合并以创建一个新数据集，然后对该新数据集和剩余数据集执行另一次匹配-合并。考虑以下示例。\n\
  \n## 示例\n在以下程序中，`Sasuser.Expenses` 和 `Sasuser.Revenue` 都按 `FlightID` 和 `Date` 排序，并放入临时数据集以准备合并。然后这两个数据集在\
  \ `DATA` 步中创建一个名为 `Revexns` 的临时输出数据集。为了减少输出数据集的变量数，创建了一个新变量 `Profit`，并删除了创建 `Profit`\
  \ 的变量。\n\n```sas\nproc sort data=sasuser.expenses out=expenses;\n   by Flightid\
  \ date;\nrun;\n\nproc sort data=sasuser.revenue out=revenue;\n   by flightid date;\n\
  run;\n\ndata revexpns (drop=rev1st revecon);\n   merge expenses(in=e) revenue(in=r);\n\
  \   by flightid date;\n   if e and r;\n   Profit=sum(rev1st, revbusiness, revecon,\
  \ -expenses);\nrun;\n```\n\n**注意**：上述 `IF` 语句中使用 `IN=` 变量 `E` 和 `R` 确保包含两个数据集数据的观测值被包含在输出集中。\n\
  \n在以下程序中，输出数据集 `Revexns` 按 `Dest` 排序。`Sasuser.Actities` 按 `Code` 排序并放入临时数据集。记住，尽管名称不同，`Dest`\
  \ 和 `Code` 都是对应的变量。排序后的数据集随后在 `DATA` 步中合并。由于两个数据集必须至少有一个精确匹配的变量才能合并，`RENAME=` 选项将\
  \ `Code` 重命名为 `Dest`。`DATA` 步将 `Revexns` 和 `Aities` 合并为名为 `Alldata` 的新输出数据集。\n\n\
  ```sas\nproc sort data=revexns;\n   by dest;\nrun;\n\nproc sort data=sasuser.acities\
  \ out=acities;\n   by code;\nrun;\n\ndata sasuser.alldata;\n   merge revexpns(in=r)\
  \ acities\n         (in=a rename=(code=dest) keep=city name code);\n   by dest;\n\
  \   if r and a;\nrun;\n\nproc print data=sasuser.alldata(obs=5) noobs;\n   title\
  \ '合并三个数据集的结果';\n   format Date date9.;\nrun;\n```\n\n`PROC PRINT` 步骤打印示例中创建的 `Sasuser.Alldata`\
  \ 数据集的前五个观测值，如下所示![处理多个查找表](img/m56-12-g1.png)\n\n# 使用 PROC SQL 连接数据\n\n## SQL 过程\n\
  \n\n\n\n\n另一种可以用于连接没有公共变量的数据集的方法是 SQL 过程。你应该已经熟悉如何使用 `PROC SQL` 根据内连接（inner join）的结果来创建表。在\
  \ `PROC SQL` 步骤中，你可以从每个输入数据集中仅选择你想要包含在新数据集中的特定变量。输入数据集不需要包含公共的 `BY` 变量，也不需要进行排序或索引。然而，如果查找表具有索引，SQL\
  \ 过程可以利用索引来提供更快的查找值检索。你可以使用 SQL 过程连接多达 256 个表，从具有任何类型关系（一对一、一对多、多对多或不匹配）的源从水平方向合并数据。\n\
  \n注意：尽管 `PROC SQL` 可以实现许多类型的连接，但本章仅讨论了内连接。因此，在本章的剩余部分中，`PROC SQL` 连接指的是对多个表进行内连接，其结果存储在一个新表中。你可以在使用\
  \ PROC SQL 水平合并表 中了解更多关于 `PROC SQL` 连接的知识。\n\n使用 SQL 过程执行表查找的一个缺点是不能在 `PROC SQL`\
  \ 中使用 `DATA` 步骤语法。因此，复杂的业务逻辑很难纳入连接中。然而，通过使用 `PROC SQL`，你通常一个步骤中完成需要多个 `PROC SORT`\
  \ 和 `DATA` 步骤才能完成的工作。\n\n## 示例：处理多个查找表\n\n以下示例将 `Sasuser.Revenue`、`Sasuser.Expenses`\
  \ 和 `Sasuser.Acities` 连接到名为 `Work.Sqljoin` 的新数据集：\n\n```\nproc sql;\n   create table\
  \ sqljoin as\n      select revenue.flightid, revenue.date format=date9.,\n     \
  \        revenue.origin, revenue.dest,\n             sum(revenue.rev1st,\n     \
  \            revenue.revbusiness,\n                 revenue.revecon)\n         \
  \    -expenses.expenses as Profit,\n             acities.city,\n             acities.name\n\
  \         from sasuser.expenses, sasuser.revenue,\n             sasuser.acities\n\
  \         where expenses.flightid=revenue.flightid\n              and expenses.date=revenue.date\n\
  \              and acities.code=revenue.dest\n         order by revenue.dest,\n\
  \                 revenue.flightid,\n                 revenue.date;\nquit;\n\nproc\
  \ print data=work.sqljoin(obs=5);\n   title 'Result of Joining Three Data Sets';\n\
  run;\n```\n\n`PROC PRINT` 步骤产生上述 `PROC SQL` 步骤中创建的 `Work.Sqljoin` 数据集的前五个观测值，所示：![处理多个查找表](img/m56-16-g1.png)\
  \ 注意：注意 `Work.Sqljoin` 数据集与之前在 `DATA` 步骤合并中创建的 `Sasuser.Alldata` 数据集相同。\n\n# 比较\
  \ DATA 步骤匹配合并与 PROC SQL 连接\n\n## 概述\n\n你已经看到通过 `DATA` 步骤匹配合并（match-merge）和 `PROC\
  \ SQL` 内连接可以创建相同的结果。尽管结果可能是相同的，但这两个过程非常不同，选择其中一种方法而非另一种方法涉及权衡。下表总结了这两种方法的某些优缺点。\n\
  \n### 表 15.1 DATA 步骤匹配合并\n\n| 优点 | 缺点 |\n| --- | --- |\n| <ul><li>输入数据集的数量没有限制。</li><li>通过使用\
  \ `DATA` 步骤处理（包括数组和 `DO` 循环）以及 `MERGE` 功能，可以将复杂的业务逻辑纳入新数据。</li><li>多个 `BY` 变量允许依赖于多个变量的查找。</li></ul>\
  \ | <ul><li>数据集在合并之前必须按 `BY` 变量或变量进行排序或索引。</li><li>`BY` 变量或变量必须存在于所有数据集中，且键变量或变量的名称必须完全匹配。</li><li>必须找到键值或键值的精确匹配。</li></ul>\
  \ |\n\n### 表 15.2 PROC SQL 连接\n\n| 优点 | 缺点 |\n| --- | --- |\n| <ul><li>数据集不需要排序或索引，但可以使用索引来提高性能。</li><li>可以在一个步骤中连接多个数据集，而无需在所有集中具有公共变量。</li><li>你可以使用合并后的数据创建数据集（表）、视图或报告。</li></ul>\
  \ | <ul><li>一次可以连接的最大表数为为 256 个。</li><li>复杂的业务逻辑很难纳入连接中。</li><li>对于简单的连接，`PROC SQL`\
  \ 可能比带有 `MERGE` 语句的 `DATA` 步骤需要更多资源。</li></ul> |\n\n尽管通过 `DATA` 步骤匹配合并和 `PROC SQL`\
  \ 连接可以产生相同的结果，但这两个过程默认并不总是产生相同的结果。考虑以下简化的示例以查看每种方法在各种情况下的工作原理。以下两个步骤显示了产生具有变量 `X`\
  \ 的两个数据集 `Data1` 和 `Data2` 相同组合的两种不同方法。如果 `Data1` 包含两个变量 `X` 和 `Y`，而 `Data2` 包含两个变量\
  \ `X` 和 `Z`，那么以下两个步骤都会产生一个名为 `Data3` 的包含三个变量 `X`、`Y` 和 `Z` 的输出数据集。注意：以下两个步骤的代码说明了\
  \ `DATA` 步骤匹配合并与 `PROC SQL` 连接的简单比较。这种比较将在接几节中探讨。\n\n```\ndata data3;\n   merge\
  \ data1 data2;\n   by x;\nrun;\n\nproc sql;\n   create table data3 as\n      select\
  \ data1.x, data1.y, data2.z\n         from data1, data2\n         where data1.x=data2.x;\n\
  quit;\n```\n\n`Data3` 的内容取决于每个输入数据集中的值以及使用的合并方法。考虑以下示例。\n\n## 示例\n\n\n\n\n\n无论是在\
  \ `DATA` 步中合并数据集，还是在 `PROC SQL` 步中连接数据集，一对一匹配产生的结果都是相同的。假设 `Data1` 和 `Data2` 包含相同数量的观测值。同时，假设在每个数据集中\
  \ `X` 的值都是唯一的，且每个值在两个数据集中都出现。当这些数据集在 `DATA` 步中合并或在 `PROC SQL` 步中连接时，`Data3` 将为每个唯一的\
  \ `X` 值包含一个观测值，且其观测值数量与 `Data1` 和 `Data2` 相同。![Comparing DATA Step Match-Merges](img/m56-19-g1.png)\n\
  \n无论是在 `DATA` 步中合并数据集，还是在 `PROC SQL` 步中连接数据集，一对多匹配产生的结果都是相同的。假设 `Data1` 包含唯一的 `X`\
  \ 值，但 `Data2` 并不包含唯一的 `X` 值。也就是说，`Data2` 包含多个条具有相同 `X` 值的观测值，因此其观测值数量多于 `Data1`。当这两个数据集在\
  \ `DATA` 步中合并或在 `PROC SQL` 步中连接时，`Data3` 的观测值数量与 `Data2` 相同。在 `Data3` 中，`Data1`\
  \ 中具有特定 `X` 值的观测值可能会与 `Data2` 中多个具有相同 `X` 值的观测值匹配。![Comparing DATA Step Match-Merges](img/m56-19-g2.png)\n\
  \n多对多匹配产生的结果取决于数据集是在 `DATA` 步中合并还是在 `PROC SQL` 步中连接。假设 `Data1` 和 `Data2` 中的 `X`\
  \ 值均不唯一。当数据集在 `DATA` 步中合并时，这些观测值是按顺序进行匹配和组合的。在下面的示例中，`Data3` 的观测值数量与两个输入集中数量较大的那个相同。在\
  \ `BY` 变量值上存在多对多匹配的情况下，`DATA` 步匹配合并可能不会产生预期的输出，因为输出数据集不会包含所有可能的匹配观测值组合。当数据集在 `PROC\
  \ SQL` 步中连接时，每个匹配项都会作为输出数据集中的一个独立观测值出现。在下面的示例中，`Data1` 中 `X` 值为 `1` 的第一个观测值将与 `Data2`\
  \ 中每个 `X` 值为 `1` 的观测值匹配并组合。然后，`Data1` 中 `X` 值为 `1` 的第二个观测值也将与 `Data2` 中每个 `X` 值为\
  \ `1` 的观测值匹配并组合，依此类推。![Comparing DATA Step Match-Merges](img/m56-20-g1.png)\n\n\
  数据集之间不匹配的数据产生的结果取决于数据集是在 `DATA` 步中合并，还是通过使用 `PROC SQL` 内连接进行组合。当包含不匹配 `BY` 变量值的数据集在\
  \ `DATA` 步中合并时，每个数据集中的观测值都按顺序进行处理。`Data3` 将为出现在 `Data1` 或 `Data2` 中的每个唯一的 `X` 值包含一个观测值。对于不匹配的\
  \ `X` 值，`Data3` 中的观测值在在来自另一个输入数据集的变量上将具有缺失值。在 `PROC SQL` 步中，输出数据集将仅包含 `BY` 变量具有匹配值的观测值。在下面的示例中，`Data3`\
  \ 没有带有缺失值的观测值，因为来自 `Data1` 或 `Data2` 的任何包含不匹配 `X` 值的观测值都没有包含在 `Data3` 中。![Comparing\
  \ DATA Step Match-Merges](img/m56-20-g2.png)\n\n你已经在几个简单场景中看到了 `DATA` 步匹配合并和 `PROC\
  \ SQL` 连接的结果。为了帮助你更全面地理解这些，请考虑 `DATA` 步如何处理匹配合并，以及 `PROC SQL` 如何处理连接。\n\n## DATA\
  \ Step Match-Merge\n\n在 `DATA` 步中合并数据集时，每个输入数据集中的观测值被顺序读取，并在输出数据集中进行匹配和组合。下面的示例描述了两个简单输入数据集的\
  \ `DATA` 步匹配合并。\n\n## Execution of a DATA Step Match-Merge\n\n1. 此示例展示了下方 `DATA`\
  \ 步的执行。该 `DATA` 步通过对两个输入数据集执行基础匹配合并创建一个新的数据集。\n\n```sas\ndata work.data3;\n   merge\
  \ data1 data2;\n   by x;\nrun;\n```\n\n2. 在编译阶段，SAS 读取输入数据集的描述部分，并默认创建一个包含来自每个输入数据集每个变量的\
  \ `PDV`。\n\n3. 执行开始。SAS 检查每个输入数据集中的第一条观测值，以确定 `BY` 值是否匹配。如果是，SAS 将每个数据集的第一条观测值读取到\
  \ `PDV` 中。\n\n4. SAS 将合并后的观测值写入输出数据集。\n\n5. 如果 `BY` 值不匹配，SAS 将从 `BY` 值最低的输入数据集读取。如果\
  \ `BY` 值与上一个观测值的 `BY` 值匹配，则 SAS 不会重新初始化 `PDV`，而是覆盖 `PDV` 中的值。如果 `BY` 值与上一个 `BY`\
  \ 值不匹配，则 SAS 会初始化 `PDV`。此时，`PDV` 和输出数据集对于另一个数据集特有的变量将包含缺失值。\n\n6. SAS 继续匹配合并观测值，直到所有输入数据集的所有观测值都被读取并写入新数据集。在此示例中，`Work.Data3`\
  \ 包含三个变量和四个观测值。\n\n## PROC SQL Join\n\n`PROC SQL` 连接使用与 `DATA` 步合并不同的过程来组合表。概念上，`PROC\
  \ SQL` 首先创建所有输入表的笛卡尔积。也就是说，`PROC SQL` 首先将每行与每行匹配。\n\n## Execution of a PROC SQL\
  \ Join\n\n1. 此示例展示了下方 `DATA` 步的执行。（注：此处应指 `PROC SQL`）。该 `PROC SQL` 步创建一个新表来存储两个输入表之间内连接的结果。\n\
  \n```sas\nproc sql;\n   create table work.data3 as\n      select *\n        from\
  \ data1, data 2\n        where data1.x=data2.x;\nquit;\n```\n\n2. 概念上，`PROC SQL`\
  \ 首先创建所有输入表的笛卡尔积。也就是说，`PROC SQL` 首先将每行与每行匹配。\n\n3. 然后，`PROC SQL` 消除结果集中任何不满足 `WHERE`\
  \ 子句的观测值。\n\n\n\n\n\n## 示例：合并多对多匹配的数据\n\n假设你想合并来自 `Sasuser.Flightschedule` 和 `Sasuser.Flightattendants`\
  \ 的数据。`Sasuser.Flightschedule` 数据集包含某家虚构航空公司已安排的航班数据。`Sasuser.Flightattendants`\
  \ 数据集包含该虚构航空公司乘务服务员的信息。下面显示这两个数据集的各个部分列表。\n\n表 15.3 `Sasuser.Flightschedule`（部分列表）\n\
  \n| Date | Destination | FlightNumber | EmpID |\n| --- | --- | --- | --- |\n| 01MAR2000\
  \ | YYZ | 132 | 1739 |\n| 01MAR2000 | YYZ | 132 | 1478 |\n| 01MAR2000 | YYZ | 132\
  \ | 1130 |\n| 01MAR2000 | YYZ | 132 | 1390 |\n| 01MAR2000 | YYZ | 132 | 1983 |\n\
  | 01MAR2000 | YYZ | 132 | 1111 |\n| 01MAR2000 | YYZ | 182 | 1076 |\n| 01MAR2000\
  \ | YYZ | 182 | 1118 |\n\n表 15.4 `Sasuser.Flightattendants`（部分列表）\n\n| EmpID | JobCode\
  \ | LastName | FirstName |\n| --- | --- | --- | --- |\n| 1350 | FA3 | Arthur | Barbara\
  \ |\n| 1574 | FA2 | Cahill | Marshall |\n| 1437 | FA3 | Carter | Dorothy |\n| 1988\
  \ | FA3 | Dean | Sharon |\n| 1983 | FA2 | Dunlap | Donna |\n| 1125 | FA2 | Eaton\
  \ | Alicia |\n| 1475 | FA1 | Fields | Diana |\n| 1422 | FA1 | Fletcher | Marie |\n\
  \n假设你想将 `Sasuser.Flightschedule` 数据集中的所有变量与安排在每个航班上的每个乘务服务员的姓和名合并。`Sasuser.Flightschedule`\
  \ 包含 45 个航班的数据。每个航班安排了 3 名乘务服务员工作。因此，你的输出数据集应该包含 135 条观测值（每个航班三个）。你可以使用以下 `PROC\
  \ SQL` 步骤来合并 `Sasuser.Flightschedule` 和 `Sasuser.Flightattendants`。\n\n```\nproc\
  \ sql;\n   create table flightemps as\n      select flightschedule.*, firstname,\
  \ lastname\n         from sasuser.flightschedule, sasuser.flightattendants\n   \
  \         where flightschedule.empid=flightattendants.empid;\nquit;\n```\n\n生成的\
  \ `Flightemps` 数据集包含 135 条观测值。现在，假设你使用以下 `DATA` 步匹配合并（match-merge）来合并这两个数据集。\n\n\
  ```\nproc sort data=sasuser.flightattendants out=fa;\n   by empid;\nrun;\n\nproc\
  \ sort data=sasuser.flightschedule out=fs;\n   by empid;\nrun;\n\ndata flightemps2;\n\
  \   merge fa fs;\n   by empid;\nrun;\n```\n\n生成的 `Flightemps2` 数据集包含 272 条观测值。`DATA`\
  \ 步匹配合并没有产生正确的结果，因为它是顺序合并数据的。在正确的结果中，来自 `Sasuser.Flightschedule` 的每个唯一航班对应三条观测值，且任何观测值中均没有缺失值。相比之下，`DATA`\
  \ 步匹配合并的结果每个唯一航班包含六条观测值，并且许多观测值具有缺失值。在最后一个例子中，数据是从两个具有多对多匹配的数据集合并的。`PROC SQL` 产生产生了正确的结果，但\
  \ `DATA` 步匹配合并没有。然而，你可以在 `DATA` 步中产生正确的结果。首先，考虑使用多个 `SET` 语句来合并数据。\n\n## 使用多个 SET\
  \ 语句\n\n你可以使用多个 `SET` 语句合并来自多个 SAS 数据集的观测值。例如，以下 `DATA` 步创建了一个名为 `Combine` 的新数据集。`Combine`\
  \ 中的每个观测值包含来自 `Dataset1` 中一条观测值的数据以及 `Dataset2` 中一条观测值的数据。\n\n```\ndata combine;\n\
  \   set dataset1;\n   set dataset2;\nrun;\n```\n\n当你使用多个 `SET` 语句时，会发生以下结果：\n\n\
  * 当当 SAS 遇到任一数据集的文件结束（EOF）标记时，处理停止（即使另一个数据集还有更多数据）。因此，输出数据集的观测值数量与最小的输入数据集相同。\n\
  * 当执行第二个 `SET` 语句时，程序数据向量 (`PDV`) 中的变量不会被重新初始化。\n* 对于两个输入数据集共有的任何变量，第二个 `SET` 语句数据集中的值或多个值将覆盖\
  \ PDV 中第一个 `SET` 语句数据集的值或多个值。\n\n请记住，使用多个 `SET` 语句合并没有一对一匹配的多个输入源的数据可能是复杂的。如果你处理的数据源没有一对一匹配，或者包含不匹配的数据，你将需要添加额外的\
  \ `DATA` 步语法以产生你想要的结果。\n\n## 示例：在多对多匹配中使用多个 SET 语句\n\n回记得，在上一个例子中，你想合并 `Sasuser.Flightschedule`\
  \ 和 `Sasuser.Flightattendants`。你的生成数据集应该包含 135 条观测值。你可以使用以下 `DATA` 步来执行此操作。\n\n\
  ```\ndata flightemps3(drop=num);\n   set sasuser.flightschedule;\n   do i=1 to num;\n\
  \      set sasuser.flightattendants;\n      if empid=empid then output;\n   end;\n\
  run;\n```\n\n\n\n\n\n| JAN1999 | $280,350,393.00 | 1 | $8,593,432,002.35 | |\n\n\
  ```\n<RevCargo/Cargosum>\n```\n\n| FEB1997 | $177,671,530.40 | 2 | $8,593,432,002.35\
  \ | |\n\n```\n<RevCargo/Cargosum>\n```\n\n| FEB1998 | $215,959,695.50 | 2 | $8,593,432,002.35\
  \ | |\n\n```\n<RevCargo/Cargosum>\n```\n\n| FEB1999 | $253,999,924.00 | 2 | $8,593,432,002.35\
  \ | |\n\n```\n<RevCargo/Cargosum>\n```\n\n我们将更仔细地检查此任务。\n\n# MEANS 过程\n\n你应该已经知道如何使用\
  \ `MEANS` 过程来生成汇总统计。默认情况下，`PROC MEANS` 会生成一个包含描述性统计的报告。可以使用 `OUTPUT` 语句将描述性统计重定向到\
  \ SAS 数据集中。可以使用 `NOPRINT` 选项抑制默认报告。\n\n带有 `OUTPUT` 语句的 `PROC MEANS` 通用形式：\n`PROC\
  \ MEANS DATA=input-SAS-data-set NOPRINT;<VAR variable(s);>OUTPUT OUT= output-SAS-data-set\
  \ statistic=output-variable(s);RUN;`\n\n以下是对语法的解释：\n`input-SAS-data-set` 识别生成汇总统计的数据集。\n\
  `variable(s)` 是正在分析的变量或多个变量的名称。\n`output-SAS-data-set` 命名存储描述性统计的数据集。\n`statistic`\
  \ 是生成的汇总统计量之一。\n`output-variable(s)` 命名在输出数据集中存储 `statistic` 值或多个值的变量或多个变量。\n\n\
  `PROC MEANS` 步骤创建的输出数据集包含请求的统计值作为 `output-variable(s)` 的值，以及自动包含的两个额外变量，如下：\n\n\
  - `_TYPE_` 包含关于类变量的信息\n- `_FREQ_` 包含一个输出级别代表的观测值数量\n\n## 示例\n\n以下程序创建了一个名为 `Sasuser.Summary`\
  \ 的汇总数据集。`Sasuser.Summary` 包含来自 `Sasuser.Monthsum` 的 `Revcargo` 值的和，存储在变量 `Cargosum`\
  \ 中。\n\n```\nproc means data=sasuser.monthsum noprint;\n   var revcargo;\n   output\
  \ out=sasuser.summary sum=Cargosum;\nrun;\n\nproc print data=sasuser.summary;\n\
  run;\n```\n\n由于使用了 `NOPRINT` 选项，`PROC MEANS` 步骤不会产生报告。打印 `Sasuser.Summary` 数据集产生如下报告。![Comparing\
  \ DATA Step Match-Merges](img/m56-28-g1.png) 一旦创建了汇总统计，你就将此汇总信息与数据集的详细行结合，以便计算百分比。记住你可以使用多个\
  \ `SET` 语句来水平合并数据。考虑通过使用多个 `set` 语句将 `Sasuser.Monthsum` 的详细行与我们在 `Sasuser.Summary`\
  \ 中创建的汇总数据相结合，了解此过程是如何工作的。\n\n## 示例\n\n此示例创建了一个名为 `Percent1` 的新数据集，它结合了：\n\n- 来自\
  \ `Sasuser.Summary` 的汇总数据（三年期货运总收入）\n- 来自 `Sasuser.Monthsum` 的详细数据（月份和该月总货量）\n\n\
  `Percent1` 还包含一个名为 `PctRev` 的新变量，记录每个观测值所占总收入的计算百分比。记住自动变量 `_N_` 跟踪 `DATA` 步骤迭代的次数。以下\
  \ `DATA` 步骤使用 `_N_` 防止 SAS 在该步骤第一次迭代后到达 `Sasuser.Summary` 的文件末尾。由于从 SAS 数据集读取的变量不会重新初始化，因此在从\
  \ `Sasuser.Monthsum` 读取每个观测值时，`Cargosum` 的值会保留在 PDV（程序数据向量）中。\n\n1. 此示例显示了下方 `DATA`\
  \ 步骤的编译和执行。此 `DATA` 步骤创建了一个新数据集，结合了来自一个输入数据集（`Sasuser.Summary`）的汇总数据和来自第二个输入数据集（`Sasuser.Monthsum`）的详细数据。\n\
  \n```\ndata sasuser.percent1(drop=cargosum);\n   if _N_=1 then set sasuser.summary(keep=cargosum);\n\
  \   set sasuser.monthsum(keep=salemon revcargo);\n   PctRev=revcargo/cargosum;\n\
  run;\n```\n\n2. 在编译阶段，SAS 读取输入数据集的描述部分并创建 PDV。`_N_` 是 PDV 中的一个临时变量，尽管它不会包含在输出集中。\n\
  \n3. 开始执行。在 `DATA` 步骤的第一次迭代中，`_N_` 的值为 1。`IF` own 语句为真，因此第一个 `SET` 语句从 `Sasuser.Summary`\
  \ 将 `Cargosum` 的值读入 PDV。\n\n4. 第二个 `SET` 语句将 `Sasuser.Monthsum` 中的第一个观测值读入 PDV。\n\
  \n5. SAS 计算 `PctRev` 的值并记录在 PDV 中。\n\n6. 在 `DATA` 步骤的底部，SAS 将 PDV 中的值写入输出数据集。`_N_`\
  \ 是临时变量，并从输出集中丢弃。\n\n7. 在 `DATA` 步骤的第二次迭代中，`_N_` 为 2，因此 `IF` 语句为假，第一个 `SET` 语句不执行。然而，`Cargosum`\
  \ 的值保留在 PDV 中。\n\n8. 第二个 `SET` 语句将 `Sasuser.Monthsum` 中的第二个观测值读入 PDV。\n\n9. 计算并记录\
  \ PDV 中的 `PctRev` 的值。SAS 将 PDV 中的值写入输出数据集（`_N_` 除外）。\n\n10. `DATA` 步骤继续执行，直到从 `Sasuser.Monthsum`\
  \ 读取了所有观测值。\n\n11. 结合汇总数据和详细数据的另一种方法是在同一个 `DATA` 步骤中创建汇总统计并将其结合。这样做你需要：\n\n- 一次读取数据并计算汇总统计\n\
  - 再次读取数据以结合汇总统计\n\n## Sum 语句\n\n你可以使用和语句在 `DATA` 步骤中获取汇总统计。和语句将表达式的结果加到累加变量上。\n\n\
  通用形式，和语句：`variable+expression;`\n\n以下是对语法的解释：\n`variable` 指定累加变量的名称。该变量必须是数值型的。在读取第一个观测值之前，该变量会被设置为\
  \ 0。该变量在每次迭代之间保留。\n`expression` 是任何数值表达式。\n\n注意：如果表达式产生缺失值，和语句会忽略它。这与表达式产生缺失值时分配缺失值的赋值语句不同。注意：和语句和赋值语句是少数不以关键字开头的\
  \ SAS 语句。\n\n和语句将加号（+）右侧表达式的结果加上加号左侧的数值变量。在 `DATA` 步骤的顶部，数值变量的值不像通常读取原始数据那样被设置为缺失。相反，该变量在程序数据向量中保留新值，以便处理下一个观测值。\n\
  \n## 示例\n\n此示例使用和语句在 `DO UNTIL` 循环中生成汇总统计。在 `DATA` 步骤的第一次迭代中，`DO UNTIL` 循环读取 `Sasuser.Monthsum`\
  \ 的每个观测值，并对每个观测值的 `RevCargo` 总进行进行累加。在 `DATA` 步骤的后续每次迭代中，此累加值（存储在变量 `TotalRev` 中）除以\
  \ `RevCargo` 以计算新变量 `PctRev`。注意：记住 `set` 语句选项 `END=` 创建了一个包含文件结束指示器的临时变量。\n\n\n\n\
  \n\n```\ndata sasuser.percent2(drop=totalrev);\n   if _N_=1 then do until (LastObs);\n\
  \      set sasuser.monthsum(keep=revcargo) end=lastobs;\n      TotalRev+revcargo;\n\
  \   end;\n   set sasuser.monthsum(keep=salemon revcargo);\n   PctRev=revcargo/totalrev;\n\
  run;\n```\n\n2. 在编译阶段，SAS 读取输入数据集的描述部分并创建 PDV。`_N_`、`LastObs` 和 `TotalRev` 是包含在\
  \ PDV 中但不会写入输出数据集的临时变量。\n\n3. 执行开始。临时变量被初始化为值。`IF` 语句在 `DATA` 步的第一次迭代中为真，因此 `DO\
  \ UNTIL` 循环开始执行。请记住，在 `DO UNTIL` 循环中，条件是在循环底部评估的。\n\n4. 第一个 `SET` 语句从 `Sasuser.Monthsum`\
  \ 中读取第一个观测值，并将 `RevCargo` 的值写入 PDV。\n\n5. `TotalRev` 的值增加了 `RevCargo` 的值，并在 PDV\
  \ 中被覆盖。\n\n6. 在 `DO` 循环底部，SAS 评估 `UNTIL` 表达式。由于 `LastObs` 的值为 `0`，该表达式为假，因此循环继续执行。\n\
  \n7. 第一个 `SET` 语句从 `Sasuser.Monthsum` 读取第二个观测值，覆盖 PDV 中 `RevCargo` 的值，并将此值加到累加变量\
  \ `TotalRev`。\n\n8. `DO UNTIL` 循环继续执行，直到第一个 `SET` 语句从 `Sasuser.Monthsum` 读取最后一个观测值，且\
  \ `LastObs` 的值被设置为 `1`。此时，PDV 中 `TotalRev` 的值是 `Sasuser.Monthsum` 中所有 `RevCargo`\
  \ 值的和。循环满足条件。\n\n9. 第二个 `SET` 语句读取与第一个 `SET` 语句相同的数据。然而，这次 `SaleMon` 和 `RevCargo`\
  \ 被读入 PDV。`TotalRev` 在 PDV 中保持填充状态。\n\n10. 为观测值 1 计算 `PctRev` 并记录在 PDV 中。然后，SAS\
  \ 将 PDV 中的值写入输出数据集 `Sasuser.Percent2`，临时变量和 `TotalRev` 变量除外。\n\n11. 在 `DATA` 步的第二次迭代中，`_N_`\
  \ 的值增加到 `2`，因此 `IF` 表达式为假。第二个 `SET` 语句从 `Sasuser.Monthsum` 的第二个观测值读取到 PDV。\n\n12.\
  \ 累加变量 `TotalRev` 的值保留自上次迭代，并用于计算 `PctRev` 的新值，结果记录在 PDV 中。SAS 将 PDV 中的值写入输出数据集。\n\
  \n13. `DATA` 步一直迭代到 `Sasuser.Monthsum` 的文件末尾。\n\n# 使用索引合并数据\n\n## 概述\n\n假设你想从两个数据集合并数据，且其中一个数据集比另一个大得多。同时，假设你只想从较大的数据集中选择那些根据一个或多个公共变量的值、与较小数据集中的观测值匹配的观测值。你应该已经知道如何在\
  \ SAS 数据集上创建索引。你已经学习过 `PROC SQL` 可以利用索引提高连接的性能。你也可以在 `DATA` 步中利用索引来合并来自多个数据集中匹配观测值的数据，如果该索引是建立在所有输入数据集共有的变量上的。例如，假设你想合并来自\
  \ `Sasuser.Dnunder` 和 `Sasuser.Sale2000` 匹配观测值的数据。`Sasuser.Sale2000`（包含 156 个观测值）中的航班只有一部分也存在\
  \ `Sasuser.Dnunder`（仅包含 57 个观测值）。假设你只想选择匹配的观测值。假设 `Sasuser.Sale2000` 关联有一个名为 `Flightdate`\
  \ 的复合索引。`Flightdate` 的值是唯一的，并且基于 `FlightID` 和 `Date` 变量的值。你可以使用 `FLIGHTDATE` 索引通过直接访问高效地仅选择匹配的观测值![使用索引合并数据](img/m56-36-g1.png)\
  \ 接下来的几个章节将展示如何使用 `Flightdate` 索引合并来自 `Sasuser.Sale2000` 数据集和 `Sasuser.Dnunder`\
  \ 数据集的匹配观测值。\n\n## KEY= 选项\n\n你已经看到如何在 `DATA` 步中使用多个 `SET` 语句以便在新数据集中合并汇总数据和详细数据。你也可以使用多个\
  \ `SET` 语句只读取匹配的观测值。你在 `SET` 语句中指定 `KEY=` 选项来使用索引从查找数据检索匹配的观测值。\n\n`KEY=` 选项的 `SET`\
  \ 语句的标准形式：`SET SAS-data-set-name KEY= index-name;` 语法解释：`index-name` 是与 `SAS-data-set-name`\
  \ 数据集关联的索引名称。\n\n使用带有 `KEY=` 选项的 `SET` 语句执行查找操作所需的值必须存储在具有索引的 SAS 数据集中。这种技术适用于当你处理一对一匹配，且查找表大小任意时。当遇到带有\
  \ `KEY=` 选项的 `SET` 语句时，SAS 使用索引从查找数据集中检索匹配观测值。这种技术可以结合其他 `DATA` 步语法来返回多个值。例如，如果\
  \ `Sasuser.Sale2000` 数据集有一个名为 `Flightdate` 的索引，后续 `SET` 语句使用 `Flightdate` 索引来定位：\n\
  \n```sas\nset sasuser.sale000 key=flightdate;\n```\n\n当该 `SET` 语句开始执行时，PDV 中必须已经\
  \ `FlightID` 的值和 `Date` 的值。SAS 然后使用 `Flightdate` 索引从 `Sasuser.Sale000` 获取观测值。为了在执行带有\
  \ `KEY=` 选项的 `SET` 语句之前在 PDV 中分配键值，需要在该语句之前使用另一个 `SET` 语句。\n\n## 示例\n\n记住你想合并 `Sasuser.Sale2000`\
  \ 和 `Sasuser.Dnunder`，并且 `Sasuser.Sale2000` 有一个基于 `FlightID` 和 `Date` 值的索引 `Flightdate`。你可以使用两个\
  \ `SET` 语句合并这两个数据集，并在第二个 `SET` 语句中使用 `KEY=` 选项来利用索引。在以下示例中，发生了这些结果：\n\n* 第一个 `SET`\
  \ 语句从 `Sasuser.Dnunder` 数据集顺序读取观测值。SAS 将该观测值的值写入 PDV，然后移动到第二个 `SET` 语句。\n* 第二个 `SET`\
  \ 语句使用 `Sasuser.Sale2000` 上的 `Flightdate` 索引在 `Sasuser.Sale2000` 中查找一个观测值，其 `FlightID`\
  \ 和 `Date` 的值与第一个 `SET` 语句填充的值匹配。\n* `Work.Profit` 是输出数据集。\n\n注意：如果你使用 `KEY=` 选项读取\
  \ SAS 数据集，则在同一个 `DATA` 步中无法对该数据集使用 `WHERE` 处理。\n\n1. 此示例展示了 `DATA` 步的执行，该步使用两个 `SET`\
  \ 语句从两个输入数据集（`Sasuser.Sale2000` 和 `Sasuser.Dnunder`）合并到一个输出数据集（`Work.Profit`）。`DATA`\
  \ 步使用较大的输入数据集之一 `Sasuser.Sale2000` 的索引来查找匹配的观测值。\n\n```sas\ndata work.profit;\n\
  \   set sasuser.dnunder;\n   set sasuser.sale2000(keep=routeid flightid date rev1st\n\
  \                        revbusiness revecon revcargo)\n                       \
  \ key=flightdate;\n   Profit=sum(rev1st, revbusiness, revecon, revcargo,\n     \
  \            -expenses);\nrun;\n```\n\n2. SAS 读取输入数据集描述部分并创建 PDV。\n\n3. 第一个 `SET`\
  \ 语句执行并创建 PDV。SAS 将 `Sasuser.Dnunder` 中的第一个观测值读入 PDV。\n\n\n\n\n\n4. 当第二个 `SET` 语句执行时，`KEY=`\
  \ 选项使用 `Flightdate` 索引直接访问 `Sasuser.Sale2000` 中的观测值，该观测值中的 `FlightID` 和 `Date` 必须与\
  \ PDV 中已有的值相匹配。随后，将匹配的观测值读入 PDV 中。\n\n5. SAS 计算 `Profit` 的值并将其记录在 PDV 中。然后，SAS 将\
  \ PDV 中的当前观测值写入输出数据集。\n\n6. `DATA` 步继续迭代。只有 `Profit` 变量被重新初始化为缺失值。第一个 `SET` 语句将\
  \ `Sasuser.Dnunder` 中的第二个观测值读入 PDV，覆盖了之前的值。\n\n7. 第二个 `SET` 语句使用 `Flightdate` 索引在\
  \ `Sasuser.Sale2000` 中寻找匹配的观测值。匹配的观测值被读入 PDV，覆盖了之前的值。计算并记录 `Profit` 的新值。将当前观测值写入输出数据集。\n\
  \n8. `DATA` 步继续迭代，直到到达 `Sasuser.Dnunder` 的文件末尾。\n\n记住，当 SAS 遇到带有 `KEY=` 选项的 `SET`\
  \ 语句时，构建 `KEY=` 索引的关键变量必须已经存在于 PDV 中。因此，这两个 `SET` 语句按照所示精确顺序排列重要。\n\n## 示例\n\n如果你仔细检查\
  \ `Work.Profit` 输出数据集，你会发现输出数据集中的最后一个观测值包含的几个变量的值与上一个观测值的值相同。这种情况发生在第二个 `SET` 语句未能在\
  \ `sasuser.sale2000` 中找到匹配的观测值时。包含不匹配数据的观测值会被打印到日志中。如下方的日志示例所示，不匹配的观测值包含一个 `_Error_`\
  \ 变量，其值为 `1`，表示数据不匹配。`_N_` 变量表示发生错误的 `DATA` 步的迭代次数。\n\n表 15.8 SAS 日志\n\n| |\n\n\
  ```\nFlightID=IA11802 RouteID=0000108 Date=30DEC2000 Expenses=3720\nRev1st=1270\
  \ RevBusiness=. RevEcon=5292 RevCargo=1940 Profit=4782\n\n_ERROR_=1 _IORC_=1230015\
  \ _N_=57\nNOTE: There were 57 observations read from the data set\n      SASUSER.DNUNDER.\n\
  NOTE: The data set WORK.PROFIT has 57 observations and 9 variables.\nNOTE: DATA\
  \ statement used (Total process time):\n      real time           0.38 seconds\n\
  \      cpu time            0.04 seconds\n```\n\n| |\n\n注意，在 SAS 日志中打印的观测值也包含一个名为\
  \ `_IORC_` 的变量。\n\n## `_IORC_` 变量\n\n使用 `KEY=` 选项时，SAS 会创建一个名为 `_IORC_` 的自动变量，代表输入/输出返回代码（INPUT/OUTPUT\
  \ Return Code）。你可以使用 `_IORC_` 判断索引搜索是否成功。如果 `_IORC_` 的值为零，则 SAS 找到了匹配的观测值。如果 `_IORC_`\
  \ 的值不零，则 SAS 未找到匹配的观测值。为了防止将数据错误写入日志（以及你的输出数据集），请执行以下操作：\n\n* 检查 `_IORC_` 的值以确定是否找到匹配\n\
  * 如果没有匹配，将 `_ERROR_` 设置为 `0`\n* 删除不匹配的数据或将不匹配的数据写入错误数据集\n\n## 示例\n\n以下示例使用 `Flightdate`\
  \ 索引将 `Sasuser.Sale2000` 的数据与 `Sasuser.Dnunder` 的数据合并，并将合并后的数据写入名为 `Work.Profit3`\
  \ 的新数据集。不匹配的观测值被写入 `Work.Errors`。不应该有观测值写入 SAS 日志。\n\n```\ndata work.profit3 work.errors;\n\
  \   set sasuser.dnunder;\n   set sasuser.sale2000(keep=routeid flightid date rev1st\n\
  \       revbusiness revecon revcargo)key=flightdate;\n   if _iorc_=0 then do;\n\
  \      Profit=sum(rev1st, revbusiness, revecon, revcargo,\n            -expenses);\n\
  \      output work.profit3;\n   end;\n   else do;\n      _error_=0;\n      output\
  \ work.errors;\n   end;\nrun;\n```\n\n如果你检查上述程序的运行结果，你会发现 `Work.Profit3` 输出数据集中的观测值比\
  \ `Work.Profit` 输出数据集少一个。不匹配的观测值被写入了 `Work.Errors` 数据集。\n\n# 使用事务数据集\n\n## 概述\n\n\
  有时，你可能不仅仅是合并两个数据集的数据，而是想用另一个数据集中存储的数据来更新一个数据集中的数据。也就是说，你可能想用事务数据集中的值覆盖某些值来更新主数据集。例如，假设数据集\
  \ `Mylib.Empmaster` 包含过的数据。当前数据存储在另一个名为 `Mylib.Empchanges` 的数据集中`Mylib.Empmaster`\
  \ 包含 148 个观测值，而 `Mylib.Empchanges` 包含 6 个观测值。变量 `EmpID` 在两个数据集中都包含唯一值。`Mylib.Empmaster`\
  \ 的部分列表和 `Mylib.Empchanges` 的完整列表所示。注意，在两个数据集中，有一个观测值具有相同的 `EmpID` 值为 `165`（此处）。对于这些观测值，`JobCode`\
  \ 和 `Salary` 的值是不同的。\n\n表 15.9 `Mylib.Empmaster`（部分列表）\n\n| DateOfBirth | DateOfHire\
  \ | EmpID | Gender | JobCode |\n| :--- | :--- | :--- | :--- | :--- |\n| --- | ---\
  \ | --- | --- | --- |\n| 30JUN1955 | 31JAN1982 | 1639 | F | TA3 |\n| 29JAN1942 |\
  \ 10JAN1985 | 1065 | M | ME2 |\n| 03DEC1961 | 10Oct1985 | 1561 | M | TA3 |\n| 25SEP1965\
  \ | 07OCT1989 | 1221 | F | FA3 |\n| 11AUG1970 | 01NOV2000 | 1447 | F | FA1 |\n|\
  \ 13SEP1968 | 05NOV2000 | 1998 | M | SCP |\n\n表 15.10 `Mylib.Empchanges`\n\n| DateOfBirth\
  \ | DateOfHire | EmpID | Gender | JobCode | Salary |\n| :--- | :--- | :--- | :---\
  \ | :--- | :--- |\n| --- | --- | --- | --- | --- | --- |\n| 05MAR1957 | 30MAR1990\
  \ | 1009 | M | TA1 | |\n| 23MAY1963 | 20OCT1979 | 1017 | M | TA3 | |\n| 14APR1962\
  \ | 17SEP1990 | 1037 | F | TA3 | |\n| 17JUL1967 | 26NOV1989 | 1038 | F | TA1 | |\n\
  | 11JUL1961 | 27AUG1984 | 1050 | M | ME2 | |\n| 29JAN1942 | 10JAN1985 | 1065 | M\
  \ | ME2 | |\n\n如果你能看到 `Mylib.Empmaster` 的完整列表，你会发现 `Mylib.Empchanges` 中的每个观测值在 `Mylib.Empmaster`\
  \ 中都有基于 `EmpID` 的匹配观测值。`Mylib.Empmaster` 中还有许多观测值在 `Mylib.Empchanges` 中没有匹配的观测值。为了更新\
  \ `Mylib.Empmaster`，你需要找到所有匹配的观测值，并用 `Mylib.Empchanges` 中的新值更新它们的 `JobCode` 和 `Salary`。你可以使用\
  \ `UPDATE` 语句进行这些更改。\n\n## UPDATE 语句\n\n使用 `UPDATE` 语句通过事务数据集更新主数据集。`UPDATE` 语句可以执行以下任务：\n\
  \n* 修改主集中变量的值\n* 向数据集添加观测值\n* 向数据集添加变量\n\n| `UPDATE` 语句的通用形式：`DATA master-data-set;\
  \ UPDATE master-data-set transaction-data-set; BY by-variable(s); RUN;` 以下是对语法的解释：`master-data-set`\
  \ 指定主文件的 SAS 数据集。`transaction-data-set` 指定要应用到主数据集的更改的 SAS 数据集。`by-variable(s)`\
  \ 指定同时出现在 `master-data-set` 和 `transaction-data-set` 中的变量。`master-data-set` 中的每个观测值对于\
  \ `by-variable` 必须是唯一的，但 `transaction-data-set` 可以包含多个具有相同 `by-variable` 值的观测值。\
  \ |\n\n\n\n\n\n`UPDATE` 语句根据每个 `BY` 变量值匹配的观测值，将主数据集中的值替换为来自事务数据集的值。在主数据集或事务数据集中，任何\
  \ `BY` 变量值不匹配的观测值都将包含在输出数据集中。此外，默认情况下，如果事务数据集中中的现有值被编码为点（针对数值型变量）或空格（针对字符型变量），SAS\
  \ 不会将主数据集中的现有值替换为缺失值。当您使用 `UPDATE` 语句时，请记住以下限制：\n\n-   `UPDATE` 语句中最多可以出现两个数据集名称。\n\
  -   主数据集必须列在第一个。\n-   必须使用指定匹配变量的 `BY` 语句。\n-   两个数据集都必须按 `BY` 变量排序，或具有基于 `BY` 变量的索引。\n\
  -   在主数据集中，每个观测值的 `BY` 变量值必须是唯一的。\n\n## 示例\n\n请记住，您想要用事务数据集 `Mylib.Empchanges` 更新主数据集\
  \ `Mylib.Empmaster`。您可以像下面的程序所示，使用 `UPDATE` 语句完成此任务。记住，两个数据集都必须按 `BY` 变量排序或对其建立索引。\n\
  \n```\nproc sort data=mylib.empmaster;\n   by empid;\nrun;\n\nproc sort data=mylib.empchanges;\n\
  \   by empid;\nrun;\n\ndata mylib.empmaster;\n   update mylib.empmaster mylib.empchanges;\n\
  \   by empid;\nrun;\n```\n\n更新后的 `Mylib.Empmaster` 数据集的前八个观测值如下所示。请注意，`EmpID` 值为\
  \ `1065` 的观测值现在包含了 `JobCode` 和 `Salary` 的更新值。\n\n```\n proc print data=mylib.empmaster\
  \ (obs=8) noobs;\nrun;\n```\n\n![使用事务数据集](img/m56-46-g1.png)\n\n## 总结\n\n## 文本总结\n\
  \n### 复习术语\n\n您可以回顾本章中重要术语的定义。您还可以回顾表查找操作中各种输入源之间各种关系的图表和描述。\n\n### 在 SAS 数据集外部处理查找值\n\
  \n您可以在 `DATA` 步中使用 `IF-THEN/ELSE` 语句将基表数据与未存储在 SAS 数据集中的查找值合并。您还可以使用 `FORMAT` 过程或\
  \ `ARRAY` 语句将基表数据与未存储在 SAS 数据集中的查找值合并。\n\n### 使用 DATA Step Match-Merge 合并数据\n\n\
  您可以在 `DATA` 步中使用 `MERGE` 语句合并多个数据集的数据，只要这些输入数据集具有公共变量。如果每个输入数据集至少包含一个与至少另一个数据集相同的变量，则您可以在多个\
  \ `DATA` 步中合并两个缺少公共变量的数据集。\n\n### 使用 PROC SQL 链接数据\n\n如果没有所有输入表共有的单个列，您也可以使用 `PROC\
  \ SQL` 来连接来自多个表的数据。如果您在 `PROC SQL` 步中创建一个带有内连接（inner join）结果的新表，其结果与 `DATA` 步 match-merge\
  \ 的结果非常相似。\n\n### 比较 DATA Step Match-Merge 和 PROC SQL Join\n\n通过基础的 `DATA` 步 match-merge\
  \ 和 `PROC SQL` 连接可以创建相同的结果。然而，这两种方法之间存在显著差异，并且各自有优缺点。在某些情况下，例如当输入数据集中的 `BY` 变量值存在一对一或一对多的匹配时，这两种方法会产生相同的结果。在其他情况下，例如当\
  \ `BY` 变量值存在多对多的匹配，或者存在 `BY` 变量的不匹配值时，这两种方法会产生不同的结果。这些差异反映了 `DATA` 步 match-merge\
  \ 和 `PROC SQL` 连接的处理方式不同。即使处理多对多匹配或不匹配的数据，也可以其他的 `DATA` 步技术（例如多个 `SET` 语句）创建与 `PROC\
  \ SQL` 步创建相同的结果。\n\n### 合并汇总数据和详细数据\n\n为了执行诸如根据数据的汇总统计量计算数据单个值百分比等任务，您需要合并汇总数据和详细数据。创建汇总数据集的一种方法是使用\
  \ `PROC MEANS`。一旦有了汇总数据集，您可以使用多个 `SET` 语句将汇总数据与原始数据集中的详细数据合并。还可以在一个 `DATA` 步中使用\
  \ `sum` 语句创建汇总数据并将其与详细数据合并。\n\n### 使用索引合并数据\n\n如果索引是基于所有输入数据集共有的变量构建的，则可以使用索引合并多个数据集中匹配观测值的数据。特别是当一个输入数据集非常大时，索引可以提高合并效率。您可以使用\
  \ `SET` 语句中的 `KEY=` 选项并结合另一个 `SET` 语句来使用索引合并数据。可以使用 `_IORC_` 变量来防止不匹配的数据包含在输出数据集中。\n\
  \n### 使用事务数据集\n\n有时，您可能用存储在另一个数据集中的数据更新一个数据集的数据。您使用 `UPDATE` 语句根据每个 `BY` 变量值匹配的观测值，将主数据集中的值替换为来自事务数据集的值。\n\
  \n## 示例\n\n### 使用 IF-THEN/ELSE 语句合并数据\n\n```\ndata mylib.employees_new;\n   set\
  \ mylib.employees;\n   if salary > 50000 then status = 'High';\n   else status =\
  \ 'Low';\nrun;\n```\n\n### 使用 ARRAY 语句合并数据\n\n```\ndata mylib.employees;\n   array\
  \ scores[3] score1 score2 score3;\nrun\n```\n\n### 使用 FORMAT 过程合并数据\n\n```\nproc\
  \ format;\n   value status_fmt\n   1-5 = 'Low'\n   6-high = 'High';\nrun;\n```\n\
  \n### 执行 DATA Step Match-Merge\n\n```\nproc sort data=sasuser.expenses out=expenses;\n\
  \   by flightid date;\nrun;\n\nproc sort data=sasuser.revenue out=revenue;\n   by\
  \ flightid date;\nrun;\n\ndata revexpns (drop=rev1st revbusiness reconcon)\n   \
  \  expenses);\n   merge expenses(in=e) revenue(in=r);\n   by flightid date;\n  \
  \ if e and r;\n   Profit=sum(rev1st, revbusiness, recon,\n          -expenses);\n\
  run;\n```\n\n### 执行 PROC SQL Join\n\n```\nproc sql;\n   create table sqljoin as\n\
  \   select revenue.flightid,\n          revenue.date format=date9.,\n          revenue.origin,\
  \ revenue.dest,\n          sum(revenue.rev1st,\n              revenue.revbusiness,\n\
  \               revenue.reconcon)\n          -expenses.expenses as Profit,\n   \
  \       acities.city, acities.name\n   from sasuser.expenses, sasuser.revenue,\n\
  \        sasuser.acities\n   where expenses.flightid=revenue.flightid\n        \
  \ and expenses.date=revenue.date\n         and acities.code=revenue.dest\n   order\
  \ by revenue.dest, revenue.flightid,\n            revenue.date;\nquit;\n```\n\n\n\
  \n\n\n```sas\nproc means data=sasuser.monthsum noprint;\n   var revcargo;\n   output\
  \ out=sasuser.summary sum=Cargosum;\nrun;\n\ndata sasuser.percent1;\n   if _n_=1\
  \ then set sasuser.summary\n                     (keep=cargosum);\n   set sasuser.monthsum\n\
  \       (keep=salemon revcargo);\n   PctRev=revcargo/cargosum;\nrun;\n\ndata sasuser.percent2(drop=totalrev);\
  \ \n   if _n_=1 then do until(lastobs); \n      set sasuser.monthsum(keep=revcargo)\
  \ \n          end=lastobs; \n      totalrev+revcargo; \n   end; \n   set sasuser.monthsum\
  \ (keep=salemon revcargo);\n   PctRev=revcargo/totalrev;\nrun;\n```\n\n### 使用索引合并数据\n\
  \n```sas\ndata work.profit work.errors;\n   set sasuser.dnunder;\n   set sasuser.sale2000(keep=routeid\n\
  \       flightid date rev1st revbusiness\n       revecon revcargo)key=flightdate;\n\
  \   if _iorc_=0 then do;\n      Profit=sum(rev1st,business, revecon,\n         \
  \    revcargo, -expenses);\n      output work.profit;\n   end;\n   else do;\n  \
  \    _error_=0;\n      output work.errors;\n   end;\nrun;\n```\n\n### 使用事务数据集\n\n\
  ```sas\nproc sort data=mylib.empmaster;\n   by empid;\nrun;\n\nproc sort data=mylib.empchanges;\n\
  \   by empid;\nrun;\n\ndata mylib.empmaster;\n   update mylib.empmaster mylib.empchanges;\n\
  \   by empid;\nrun;\n```\n\n## 注意事项\n\n- 在 `DATA` 步的匹配-合并（match-merge）中，你可以使用 `RENAME=`\
  \ 为输入数据集中的相同变量赋予相同的名称，前提是这些变量包含相同的数据且具有相同的类型和长度。\n- 你可以使用 `OUTPUT` 语句和配合 `MEANS`\
  \ 过程的 `NOPRINT` 选项将统计数据路由到输出数据集，并抑制默认报告。\n- 自动变量 `_N_` 跟踪 `DATA` 步迭代的次数。当将汇总数据集的数据与较大的详细数据集的数据合并时，`_N_`\
  \ 变量非常有用。\n- 当你使用 `UPDATE` 语句时，两个数据集都必须根据 `BY` 变量排序或具有基于 `BY` 变量的索引。\n\n# Quiz\n\
