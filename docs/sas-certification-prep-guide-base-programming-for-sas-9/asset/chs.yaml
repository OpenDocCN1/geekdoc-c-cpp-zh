  \ 函数的更多信息，请参见介绍宏变量。\n\n# 迭代处理语句\n\n## 概述\n\n许多宏应用需要迭代处理。通过迭代 `%DO` 语句，你可以反复：\n\n\
  * 执行宏编程代码\n* 生成 SAS 代码\n\n| 带有 `%END` 语句的迭代 `%DO` 语句通用形式：`%DO index-variable=start\
  \ %TO stop <%BY increment>;text%END;` | 以下是对语法的说明：`index-variable` 是宏变量名或生成宏变量名称的文本表达式。`start`\
  \ 和 `stop` 指定整数或生成整数的宏表达式，用于控制迭代 `%DO` 和 `%END` 语句之间的宏部分的处理次数。`increment` 指定整数（非\
  \ 0）或宏表达式 | 迭代 `%DO` 语句可以用于：\n\n* 执行宏编程代码\n* 生成 SAS 代码。\n\n（注：由于原文中存在大量重复和错误片段，已根据要求进行清理并翻译核心内容。）\n\
  \n\n\n\n```\nMLOGIC(HEX): %DO loop index variable I is now 30; loop will\n     \
  \          iterate again.\nMPRINT(HEX): value=30;\nMPRINT(HEX): put \"Hexadecimal\
  \ form of 30 is \" value hex6.;\nMLOGIC(HEX): %DO loop index variable I is now 32;\
  \ loop will\n               not iterate again.\nMPRINT(HEX): run;\n\nHexadecimal\
  \ form of 20 is 000014\nHexadecimal form of 22 is 000016\nHexadecimal form of 24\
  \ is 000018\nHexadecimal form of 26 is 00001A\nHexadecimal form of 28 is 00001C\n\
  Hexadecimal form of 30 is 00001E\nNOTE: DATA statement used:\n      real time  \
  \         0.06 seconds\n      cpu time            0.06 seconds\n\nMLOGIC(HEX): Ending\
  \ execution.\n```\n\n## 生成完整的步骤\n\n你可以使用迭代 `%DO` 语句来构建创建完整 SAS 步骤的宏循环。\n\n## 示例\n\
  \n假设几年的课程设置存储在系列以年份命名的外部文件中，例如 `Raw1999.dat` 和 `Raw2000.dat`。所有文件具有相同的记录布局。假设你想将每个文件读取到独立的\
  \ SAS 数据集中。以下宏使用 `%DO` 语句创建一个循环，从每个指定的外部文件中创建一个数据集：\n\n```sas\n%macro readraw(first=1999,last=2005);\n\
  \   %local year;\n   %do year=&first %to &last;\n      data year&year;\n       \
  \  infile \"raw&year..dat\";\n         input course_code $4.\n         location\
  \ $15.\n         begin_date date9.\n         teacher $25.;\n      run;\n\n     \
  \ proc print data=year&year;\n         title \"Scheduled classes for &year\";\n\
  \         format begin_date date9.;\n      run;\n   %end;\n%mend readraw;\n```\n\
  \n假设你向 `Readraw` 宏提交了以下调用：\n\n```sas\n%readraw(first=2000,last=2002)\n```\n\n该宏创建了名为\
  \ `Year2000`、`Year2001` 和 `Year2002` 的三个数据集。记住，为了让程序正常运行，原始数据文件必须命名命名，并且必须存储在程序指定的位置。生成的\
  \ DATA 步骤显示在日志中。\n\n表 11.22 SAS 日志\n\n```\n336  %readraw(first=2000,last=2002)\n\
  MLOGIC(READRAW):  Beginning execution.\nMLOGIC(READRAW):  Parameter FIRST has value\
  \ 2000\nMLOGIC(READRAW):  Parameter LAST has value 2002\nMLOGIC(READRAW):  %LOCAL\
  \  YEAR\nMLOGIC(READRAW):  %DO loop beginning; index variable YEAR; start value\
  \ is 2000; \n      stop value is 2002; by value is 1.\nMPRINT(READRAW):   data year2000;\n\
  MPRINT(READRAW):   infile \"raw2000.dat\";\nMPRINT(READRAW):   input course_code\
  \ $4\\. location $15\\. begin_date date9\\. \n                          teacher\
  \ $25.;\nMPRINT(READRAW):   run; \n```\n\n# 使用算术和逻辑表达式\n\n## %EVAL 函数\n\n`%EVAL`\
  \ 函数评估整数算术表达式或逻辑表达式。逻辑表达式和算术表达式是运算符和操作数的序列，形成一组指令，并对其进行评估以产生结果。\n\n* 算术表达式包含一个算术运算符。\n\
  * 逻辑表达式包含一个逻辑运算符。\n\n| 通用形式，`%EVAL` 函数：`%EVAL(arithmetic or logical expression)`\
  \ |\n\n%EVAL` 函数\n\n* 将整数字符串和十六进制字符串转换为整数\n* 将代表算术、比较和逻辑运算符的标记转换为宏层级运算符\n* 执行算术和逻辑操作。\n\
  \n对于算术表达式，如果操作结果为非整数值，`%EVAL` 将该值截断为整数。此外，当在算术表达式中使用非整数时，`%EVAL` 会返回空值并发出错误消息。`%EVAL`\
  \ 评估逻辑表达式并返回一个值来表示该表达式是真还是假。值为 `0` 表示表达式为假，值为 `1` 或任何其他数值表示表达式为真。`%EVAL` 函数不将以下内容转换为数值：\n\
  \n* 包含句号或 E 计数法的数值字符串\n* SAS 日期和时间常量。\n\n以下是一些示例。\n\n## 示例\n\n下表显示了算术和逻辑表达式的示例，以及\
  \ `%EVAL` 在评估这些表达式时产生的结果。\n\n| 如果你提交了这些语句... | 这些消息被写入日志中... |\n| --- | --- |\n\
  | ```sas\n%put value=%eval(10 lt 2);\n``` | ```sas\nvalue=0\n``` |\n| ```sas\n%put\
  \ value=10+2; \n%put value=%eval(10+2);\n``` | ```sas\nvalue=10+2 \nvalue=12\n```\
  \ |\n| ```sas\n%put value=%eval(10 lt 2);\n``` | ```sas\nvalue=0\n``` |\n| ```sas\n\
  %put value=10+2; \n%put value=%eval(10+2);\n``` | ```sas\nvalue=10+2 \nvalue=12\n\
  ``` |\n| ```sas\n%put value=%eval(10 lt 2);\n``` | ```sas\nvalue=0\n``` |\n| ```sas\n\
  %put value=10+2; \n%put value=%eval(10+2);\n``` | ```sas\nvalue=10+2 \nvalue=12\n\
  ``` |\n| ```sas\n%put value=%eval(10 lt 2);\n``` | ```sas\nvalue=0\n``` |\n| ```sas\n\
  %put value=10+2; \n%put value=%eval(10+2);\n``` | ```sas\nvalue=10+2 \nvalue=12\n\
  ``` |\n| ```sas\n%put value=%eval(10 lt 2);\n``` | ```sas\nvalue=0\n``` |\n| ```sas\n\
  %put value=10+2; \n%put value=%eval(10+2);\n``` | ```sas\nvalue=10+2 \nvalue=12\n\
  ``` |\n| ```sas\n%put value=%eval(10 lt 2);\n``` | ```sas\nvalue=0\n``` |\n| ```sas\n\
  %put value=10+2; \n%put value=%eval(10+2);\n``` | ```sas\nvalue=10+2 \nvalue=12\n\
  ``` |\n\n*(注：上述表格是提供文本的紧凑表示)*\n\n\n\n\n宏程序通过宏定义创建，宏由一个 `%MACRO` 语句和一个 `%MEND` 语句组成。`%MACRO`\
  \ 语句还为宏提供了一个名称。宏语言语句和 SAS 语言语句的任何组合都可以放在宏定义中。宏定义在执行之前必须经过编译。`MCOMPILENOTE=` 选项会在宏编译完成后向\
  \ SAS 日志中输出一条备注。要执行名称风格的宏，您需要在宏名称前加上百分号 `%` 来提交对宏的调用。\n\n### 开发和调试宏\n\n两个系统选项 `MLOGIC`\
  \ 和 `MPRINT` 对宏的开发和调试非常有帮助。`MLOGIC` 选项会将跟踪宏执行情况的消息写入 SAS 日志。`MPRINT` 选项会在所有宏解析完成后打印发送到编译器的文本。`SYMBOLGEN`\
  \ 选项和宏注释对宏的开发和调试也很有用。\n\n### 使用宏参数\n\n您可以在宏定义中使用参数列表，使您的宏更具活性且易于适应。参数可以是位置参数，也可以是关键字参数。您还可以使用包含位置参数和关键字参数的混合参数列表。参数定义了宏变量，在调用宏时它们可以取不同的值，包括空值。您可以使用\
  \ `PARMBUFF` 选项结合自动宏变量 `SYSPBUFF` 来定义一个每次调用时都能接受不同数量参数的宏。\n\n### 理解符号表\n\n当宏执行时，它有时会创建自己的临时符号表，称为局部符号表。除了全局符号表外，还局部符号表。如果宏创建或解析了宏变量，则可能会使用局部符号表。为了完全控制宏的行为，您必须理解宏处理器在特定情况下确定访问哪种符号表的基本规则。`%GLOBAL`\
  \ 和 `%LOCAL` 等语句允许您显式地定义宏变量的存储位置。`%SYMDEL` 语句允许您在 SAS 会话期间从全局符号表中删除宏变量。您可以在宏定义内部调用另一个宏。也就是说，您可以嵌套宏。当调用嵌套宏时，可能会同时存在多个局部符号表。`MPRINTNEST`\
  \ 和 `MLOGICNEST` 选项会在为 `MPRINT` 和 `MLOGIC` 选项写入 SAS 日志的消息中提供嵌套信息。\n\n### 条件处理语句\n\
  \n通过 `%IF-%THEN/%ELSE` 语句可以使用条件处理。这些语句控制当表达式求值为真或假时，宏处理器采取的操作。该操作可以是执行其他宏编程语句，也可以是将文本放置在输入栈上。如果描述此操作的代码包含多个语句，则必须将这些代码封装在\
  \ `%DO` 语句和 `%END` 语句之间。可以条件地将整个 SAS 步骤、整个 SAS 语句或 SAS 语句的部分放置在输入栈上。\n\n### 迭代处理语句\n\
  \n要执行重复操作，您可以使用 `%DO` 循环。您可以使用迭代处理生成完整的 SAS 步骤、单个语句或依赖于数据的步骤。\n\n### 使用算术和逻辑表达式\n\
  \n您使用 `%EVAL` 函数来评估不包含任何非整数或缺失值的算术或逻辑表达式。需要数值或逻辑表达式宏语言函数和语句会自动使用 `%EVAL` 函数。您使用\
  \ `%SYSEVALF` 函数来评估包含非整数或缺失值的算术或逻辑表达式。\n\n## 示例程序\n\n### 定义基础宏\n\n```\n%macro prtlast;\n\
  \   proc print data=&syslast (obs=5);\n   title \"Listing of &syslast data set\"\
  ;\n   run;\n%mend;\n```\n\n### 定义带有位置参数的宏\n\n```\n%macro printdsn(dsn,vars);\n \
  \  proc print data=&dsn;\n      var &vars;\n      title \"Listing of %upcase(&dsn)\
  \ data set\";\n   run;\n%mend;\n```\n\n### 定义带有关键字参数的宏\n\n```\n%macro printdsn(dsn=sasuser.courses,\n\
  \              vars=course_code \n              course_title days);\n   proc print\
  \ data=&dsn;\n      var &vars;\n      title \"Listing of %upcase(&dsn) data set\"\
  ;\n   run;\n%mend;\n```\n\n### 定义带有混合参数的宏\n\n```\n%macro printdsn(dsn, vars=course_title\
  \ course_code days);\n   proc print data=&dsn;\n      var &vars;\n      title \"\
  Listing of %upcase(&dsn) data set\";\n   run;\n%mend;\n```\n\n### 使用 %IF-%THEN 语句\n\
  \n```\n%macro choice(status);\n   data fees;\n      set sasuser.all;\n      %if\
  \ &status=PAID %then %do;\n         where paid='Y';\n         keep student_name\
  \ course_code begin_date totalfee;\n      %end;\n      %else %do;\n         where\
  \ paid='N';\n         keep student_name course_code\n              begin_date totalfee\
  \ latechg;\n         latechg=fee*1.10;\n      %end;\n      /* add local surcharge\
  \ */\n     if location='Boston' then totalfee=fee*1.06;\n     else if location='Seattle'\
  \ then totalfee=fee*1.025;\n     else if location='Dallas' then totalfee=fee*1.05;\n\
  \   run;\n%mend choice;\n```\n\n### 使用迭代 %DO 语句\n\n```\n%macro hex(start=1,stop=10,incr=1);\n\
  \   %local i;\n   data _null_;\n   %do i=&start %to &stop %by &incr;\n      value=&i;\n\
  \      put \"Hexadecimal form of &i is \";\n   %end;\n   run;\n%mend hex;\noptions\
  \ mprint mlogic symbolgen;\n%hex(20,30)\n```\n\n## 注意要点\n\n* 宏程序通过使用 `%MACRO` 语句和\
  \ `%MEND` 语句来定义。\n* 通过在宏名称前输入 `%` 来执行和调用宏。\n* `MPRINT`、`MLOGIC` 和 `SYMBOLGEN` 系统选项对开发和调试很有用。\n\
  * 参数可以通过创建值可被宏调用更新的宏变量，使您的宏程序更具活性。\n* 您可以使用 `%IF-%THEN` 语句条件地处理整个 SAS 步骤、SAS 语句或语句的部分。\n\
  * 您可以使用迭代 `%DO` 语句创建可以处理重复任务的宏循环。\n\n# 测试\n\n请为每个问题选择最佳答案。完成测试后，请使用附录中的答案页检查您的答案。\n\
  \n1. 下列哪项是错误的？\n\n    1. `%MACRO` 语句必须与 `%MEND` 语句配对。\n    2. 宏定义可以包含宏变量引用，但不能包含\
  \ SAS 语言语句。\n    3. 编译宏时，只对宏语言语句进行语法错误检查。\n    4. 编译后的宏默认存储在临时的 SAS 目录中。\n\n2. 下列哪个示例正确定义了一个名为\
  \ `Print` 且实现了名为 `vars` 和 `total` 参数的宏？\n\n    1. ```\n       %macro print(vars,\
  \ total);\n           proc print data=classes;\n              var vars;\n      \
  \        sum total;\n           run;\n       %mend print;\n       ```\n    2. ```\n\
  \       %macro print('vars', 'total');\n           proc print data=classes;\n  \
  \            var &vars;\n              sum &total;\n           run;\n       %mend\
  \ print;\n       ```\n    3. ```\n       %macro print(vars, total);\n          \
  \ proc print data=classes;\n              var &vars;\n              sum &total;\n\
  \           run;\n       %mend print;\n       ```\n    4. ```\n       %macro print(vars,\
  \ total);\n           proc print data=classes;\n              var :vars;\n     \
  \         sum :total;\n           run;\n       %mend print;\n       ```\n\n3. 下列哪项正确引用了此处所示名为\
  \ `Printdsn` 的宏：\n\n\n\n\n\n```sas\n%macro printdsn(dsn,vars);\n   %if &vars= %then\
  \ %do;\n      proc print data=&dsn;\n      title \"Full Listing of %upcase(&dsn)\
  \ data set\";\n      run;\n   %end;\n   %else %do;\n      proc print data=&dsn;\n\
  \             var &vars;\n          title \"Listing of %upcase(&dsn) data set\"\
  ;\n          run;\n   %end;\n%mend;\n```\n\n1. ```sas\n%printdsn(sasuser.courses,\
  \ course_title days);\n```\n\n2. ```sas\n%printdsn(dsn=sasuser.courses, vars=course_title\
  \ days)\n```\n\n3. ```sas\n%printdsn(sasuser.courses, course_title days);\n```\n\
  \n4. ```sas\n%printdsn(sasuser.courses, course_title, days)\n```\n\n4. 如果你在宏程序定义中使用使用了混合参数列表，下列哪项是错误的？\n\
  \n    1. 你必须在任何关键字参数之前列出位置参数。\n\n    2. 位置参数和关键字参数的值都存储在本地符号表中。\n\n    3. 关键字参数的默认值是在宏定义中分配的值，而位置参数的默认值为空值（null）。\n\
  \n    4. 在调用宏时，通过省略调用中的参数可以为关键字参数分配空值（null）。\n\n5. 下列哪项是错误的？\n\n    1. 宏程序在你提交宏定义时会被编译。\n\
  \n    2. 宏程序在你调用它（`%macro-name`）时会被执行。\n\n    3. 宏程序只有在执行执行后才会被存储在 SAS 目录条目中。\n\n\
  \    4. 宏程序在编译它的 SAS 会话期间一直是可以执行的。\n\n6. 当你在宏程序中使用 `%IF-%THEN` 语句时，\n\n    1. 如果描述条件动作的代码包含多个语句，你必须在代码周围放置\
  \ `%DO` 和 `%END` 语句。\n\n    2. `%ELSE` 语句是可选的。\n\n    3. 你不能在 `%IF` 语句的逻辑表达式中引用\
  \ DATA 步变量。\n\n    4. 以上均都是。\n\n7. 下列哪项可以被放入输入栈（input stack）？\n\n    1. 仅完整的步骤（steps）。\n\
  \n    2. 仅完整的步骤或完整的语句。\n\n    3. 仅完整的语句或语句内部的文本片段。\n\n    4. 完整的步骤、完整的语句或语句内部的文本片段。\n\
  \n8. 下列哪项在本地符号表中创建名为 `class` 的宏变量？\n\n    1. ```sas\n       data _null_;\n     \
  \     set sasuser.courses;\n          %let class=course_title;\n       run;\n  \
  \  ```\n\n    2. ```sas\n       data _null_;\n          set sasuser.courses;\n \
  \         call symput('class', course_title);\n       run;\n    ```\n\n    3. ```sas\n\
  \       %macro sample(dsn);\n          %local class;\n          %let class=course_title;\n\
  \          data_null_;\n             set &dsn;\n           run;\n       %mend;\n\
  \    ```\n\n    4. ```sas\n       %global class;\n       %macro sample(dsn);\n \
  \         %let class=course_title;\n          data _null_;\n             set &dsn;\n\
  \           run;\n       %mend;\n    ```\n\n9. 下列哪个示例正确定义了宏程序 `Hex`？\n\n    1. ```sas\n\
  \       %macro hex(start=1, stop=10, incr=1);\n          %local i;\n          data\
  \ _null_;\n          %do i=&start to &stop by &incr;\n             value=&i;\n \
  \            put \"Hexadecimal form of &i is \" value hex6.;\n          %end;\n\
  \          run;\n       %mend hex;\n    ```\n\n    2. ```sas\n       %macro hex(start=1,\
  \ stop=10, incr=1);\n          %local i;\n          data _null_;\n          %do\
  \ i=&start %to &stop %by &incr;\n             value=&i;\n             put \"Hexadecimal\
  \ form of &i is \" value hex6.;\n          %end;\n          run;\n       %mend hex;\n\
  \    ```\n\n    3. ```sas\n       %macro hex(start=1, stop=10, incr=1);\n      \
  \    %local i;\n          data _null_;\n          %do i=&start to &stop by &incr;\n\
  \             value=&i;\n             put \"Hexadecimal form of &i is \" value hex6.;\n\
  \          run;\n       %mend hex;\n    ```\n\n    4. ```sas\n       %macro hex(start=1,\
  \ stop=10, incr=1);\n          %local i;\n          data _null_;\n          %do\
  \ i=&start %to &stop %by &incr;\n             value=&i;\n             put \"Hexadecimal\
  \ form of &i is \" value hex6.;\n          %end\n          run;\n       %mend hex;\n\
  \    ```\n\n10. 当你提交对已编译宏的调用时，发生了什么？\n\n    1. 首先，宏处理器检查宏中所有的宏编程语句以是否有语法错误。然后，宏处理器执行宏中的所有语句。\n\
  \n    2. 宏处理器执行编译的宏编程语句。然后，宏处理器执行宏中的所有语句。\n\n    3. 首先，宏处理器检查宏中所有的宏编程语句以是否有语法错误。然后，宏处理器执行宏中的所有语句。\n\
  \n    4. 宏处理器执行编译的宏编程语句。然后，宏处理器执行宏中的所有语句。\n\n\n\n\n\n永久存储宏程序的一种方法是将其保存到外部文件中。然后，你可以使用\
  \ `%INCLUDE` 语句将存储在外部文件的语句插入到程序中。如果外部文件包含宏定义，则在提交 `%INCLUDE` 语句时会编译该宏。之后，你可以在同一个程序的后续再次调用该宏，或者在当前\
  \ SAS 会话的后续任何时候再次调用。\n\n| 通用格式，`%INCLUDE`语句：`%INCLUDE file-specification </SOURCE2>;`\
  \ | 以下是语法的解释：<br>`file-specification` 描述包含要插入的 SAS 代码的文件位置。<br>`SOURCE2` 导致插入到程序中的\
  \ SAS 语句显示在 SAS 日志（log）中。如果在 `%INCLUDE` 语句中未指定 `SOURCE2`，则由 SAS 系统选项 `SOURCE2` 的设置来控制是否显示插入的代码。\
  \ |\n\n通过在外部存储你的宏程序并使用 `%INCLUDE` 语句，与使用会话编译的宏相比，你获得了几个优势：\n\n- 宏定义的源代码不需要包含在你的程序中。\n\
  - 宏定义的单个副本可以被多个程序共享。\n- 外部文件中的宏定义可以使用任何文本编辑器轻松查看和编辑。\n- 访问存储在外部文件中的宏定义不需要特殊的 SAS\
  \ 系统选项。\n\n## 示例\n\n你可以通过使用 `%INCLUDE` 语句将宏定义插入程序中来编译宏。然后，你可以调用该宏来执行它。假设以下宏定义存储在外部文件\
  \ `C:\\sasfiles\\prtlast.sas` 中：\n\n```\n%macro prtlast;\n   %if &syslast ne _NULL_\
  \ %then %do;\n      proc print data=&syslast (obs=5);\n         title \"Listing\
  \ of &syslast data set\";\n      run;\n   %end;\n   %else\n      %put No data set\
  \ has been created yet.;\n%mend;\n```\n\n你可以提交以下代码来访问、编译并执行 `Prtlast` 宏。此示例中包含了\
  \ `PROC SORT` 步骤，以便创建一个 `Prtlast` 宏可以打印的数据集。\n\n```\n%include 'c:\\sasfiles\\prtlast.sas'\
  \ /source2;\n\nproc sort data=sasuser.courses out=bydays;\n   by days;\nrun;\n\n\
  %prtlast\n```\n\n注意：外部文件的位置和名称取决于你的操作系统环境。当提交此代码时，以下消息将写入 SAS 日志。请注意，由于在 `%INCLUDE`\
  \ 语句中指定了 `SOURCE2`，因此宏定义被写入日志。\n\n表 12.1 SAS 日志\n\n```\nNOTE: %INCLUDE (level 1)\
  \ file prtlast.sas is file\n              C:\\sasfiles\\prtlast.sas.\n31   +%macro\
  \ prtlast;\n32   +   %if &syslast ne _NULL_ %then %do;\n33   +      proc print data=&syslast(obs=5);\n\
  34   +      title “Listing of &syslast data set”;\n35   +      run;\n36   +   %end;\n\
  37   +   %else\n38   +      %put No data set has been created yet.;\n39   +%mend;\n\
  NOTE: %INCLUDE (level 1) ending.\n40\n41   proc sort data=sasuser.courses out=bydays;\n\
  42      by days;\n43   run;\n\nNOTE: There were 6 observations read from the dataset\n\
  \      SASUSER.COURSES.\nNOTE: The data set WORK.BYDAYS has 6 observations and\n\
  \      4 variables.\nNOTE: PROCEDURE SORT used:\n      real time           0.04\
  \ seconds\n      cpu time            0.04 seconds\n\n44\n45   %prtlast\nNOTE: There\
  \ were 5 observations read from the dataset\n      WORK.BYDAYS.\nNOTE: PROCEDURE\
  \ PRINT used:\n      real time           1.07 seconds\n      cpu time          \
  \  0.26 seconds\n```\n\n这里是代码生成的输出。![Listing of WORK.BYDAYS data set](img/m53-4-g1.png)\n\
  \n# 在目录 SOURCE 项中存储宏定义\n\n## 概述\n\n永久存储宏的另一种方法是将宏定义存储在 SAS 目录（catalog）的 `SOURCE`\
  \ 项。如果你决定将宏程序存储在 SAS 目录中，则必须将每个宏程序存储在单独的 `SOURCE` 项。将每个 `SOURCE` 项命名为与其存储的宏相同的名称是一个好习惯。例如，名为\
  \ `Printit` 的宏将存储在同样名为 `Printit` 的 `SOURCE` 项中。\n\n注意：SAS 目录是存储程序源代码和其他类型内容的 SAS\
  \ 库（libraries）的成员。要将宏定义作为 SAS 目录中的 `SOURCE` 项，你需要使用“另存对象”（Save As Object）窗口。\n\n\
  ## 示例\n\n将 `Printit` 宏定义保存到 `Sasuser.Mymacs` 目录，请执行以下步骤：\n\n1. 选择 `File>Save As\
  \ Object`。在 `Save As Object` 窗口中，选择 `Sasuser` 库。\n2. 如果 `Sasuser.Mymacs` 目录尚不存在，你需要创建它。你可以选择“创建新目录”（Create\
  \ New Catalog）图标，或右键点击 `Save As Object` 窗口并选择 `New` 以打开“新目录”窗口。输入 `Mymacs` 作为新目录的并点击\
  \ `OK`。\n3. 在 `Entry Name` 字段中输入 `Printit`。确保 `Entry Type` 设置为 `SOURCE`，然后点击 `Save`。\n\
  \n提示：若你使用“程序编辑器”（Program Editor），也可以使用 `SAVE` 命令将宏定义保存为目录项。在 `libref.catalog` 中，`libref`\
  \ 是库名，`catalog` 是目录名。\n\n## CATALOG 过程\n\n如果你将宏存储在目录中，你可能想查看目录的内容。你可以通过资源管理器（Explorer）窗口双击它来查看目录内容。`CONTENTS`\
  \ 过程列出了目录的内容。\n\n| 通用格式，带有 `CONTENTS`语句的 `PROC CATALOG`：`PROC CATALOG=libref;CONTENTS;`\
  \ | 以下是语法的解释：`libref` 是有效的目录。 |\n\n注意：`CAT=` 是 `CATALOG` 的别名。\n\n## 示例\n\n你可以如下所示使用\
  \ `PROC CATALOG` 查看临时目录 `Work.Sasmacr` 中的所有宏：\n\n```\nproc catalog cat=work.sasmacr;\n\
  \   contents;\n   title \"Default Storage of SAS Macros\";\nquit;\n```\n\n此 `PROC\
  \ CATALOG` 步骤产生的结果类似于。当前 SAS 会话期间编译的宏。Default Storage of SAS Macros `PROC CATALOG`\
  \ 可以显示宏的名称和属性，但无法查看宏定义本身。\n\n## CATALOG 访问方法\n\n如果你将宏定义存储在 SAS 目录的 `SOURCE` 项，你可以在\
  \ `FILENAME` 语句中使用 `CATALOG` 访问方法，结合 `%INCLUDE` 语句将宏定义插入到 SAS 程序中。\n\n| 通用格式，引用单个\
  \ `SOURCE`的`CATALOG`访问方法：`FILENAME fileref CATALOG 'libref.catalog.entry-name.entry-type';%INCLUDE\
  \ fileref;` | 以下是语法的解释：`fileref` 是有效的引用。`libref.catalog.entry-name.entry-type` 是四级目录名。`entry-type`\
  \ 是 `SOURCE`。 |\n\n## 示例\n\n假设你已将宏定义作为 `SOURCE` 项存储在 `Sasuser.Mymacs` 目录中：\n\n```\n\
  %macro prtlast;\n   %if &syslast ne _NULL_ %then %do;\n      proc print data=&syslast\
  \ (obs=5);\n         title \"Listing of &syslast data set\";\n      run;\n   %end;\n\
  \   %else\n      %put No data set has been created yet.;\n%mend;\n```\n\n你可以使用 `CATALOG`\
  \ 访问方法结合 `%INCLUDE` 语句来编译 `Prtlast` 宏。然后你可以在程序的后续部分引用该宏。\n\n```sas\nfilename prtlast\
  \ catalog 'sasuser.mymacs.prtlast.source';\n%include prtlast;\nproc sort data=sasuser.courses\
  \ out=bydays;\n   by days;\nrun;\n%prtlast\n```\n\n你也可以使用 `CATALOG` 访问方法引用多个 `SOURCE`\
  \ 项，只要这些项存储在同一个 SAS 目录中即可。\n\n\n\n\n\n| 通用格式，使用 `CATALOG` 访问方法引用多个 `SOURCE` 条目：`fileref\
  \ CATALOG 'libref.catalog';%INCLUDE fileref(entry-1);%INCLUDE fileref(entry-2);`\
  \ 以下是该语法的解释：`fileref` 是有效的 `fileref`。`libref.catalog` 是一个两级目录库名称。`entry-1` 和 `entry-2`\
  \ 是 `library.catalog` 中 `SOURCE` 条目的名称。 |\n\n## 示例\n\n假设你有两个宏，分别名为 `Prtlast` 和 `Sortlast`，它们被存储在一个\
  \ SAS 目录库（catalog）中。目录库条目：`Sasuser.Mymacs.Prtlast.Source`\n\n```\n%macro prtlast;\n\
  \   %if &syslast ne _NULL_ %then %do;\n      proc print data=&syslast(obs=5);\n\
  \      title \"Listing of &syslast data set\";\n      run;\n   %end;\n   %else\n\
  \     %put No data set has been created yet.;\n%mend;\n```\n\n目录库条目：`Sasuser.Mymacs.Sortlast.Source`\n\
  \n```\n%macro sortlast(sortby);\n   %if &syslast ne _NULL_ %then %do;\n      proc\
  \ sort data=&syslast out=sorted;\n         by &sortby;\n      run;\n   %end;\n \
  \  %else\n     %put No data set has been created yet.;\n%mend;\n```\n\n你可以结合 `CATALOG`\
  \ 访问方法和 `%INCLUDE` 语句来编译这两个宏。然后，你可以在程序的后续部分调用这些宏。在此示例中，假设宏的名称与存储它们的的 `SOURCE` 条目名称相同：\n\
  \n```\nfilename prtsort catalog 'sasuser.mymacs';\n%include prtsort(prtlast) / source2;\n\
  %include prtsort(sortlast) / source2;\n\ndata current(keep=student_name course_title\
  \ begin_date location);\n   set sasuser.all;\n   if year(begin_date)=2001;\n   diff=year(today())-year(begin_date);\n\
  \   begin_date=begin_date+(365*diff);\nrun;\n\n%sortlast(begin_date)\n%prtlast\n\
  ```\n\n此代码产生以下输出：![Listing of WORK.SORTED data set](img/m53-11-g1.png)\n\n# 使用自动调用功能\
  \ (Autocall Facility)\n\n## 概述\n\n你可以通过自动调用功能在预定义的源库中搜索宏定义，从而使你的 SAS 会话或程序可以使用宏。这些预定义的源库被称为自动调用库（autocall\
  \ libraries）。你可以将宏定义永久性地存储在自动调用库中，并且可以设置多个自动调用库。当你使用这种方法时，不需要编译宏即可对其进行执行。也就是说，如果宏定义存储在自动调用库中，那么在提交对宏的调用之前，不需要提交或包含该宏的定义。假设你已经在自动调用库中存储了一个包含宏定义的文件。当提交提交对该宏的调用时：\n\
  \n*   宏处理器会在自动调用库中搜索该宏\n*   宏会被编译并存储，方式就像你手动提交了它一样（即编译后的宏存储在 `Work.Sasmacr` 的默认位置）\n\
  *   宏会被执行。\n\n一旦宏被编译，就可以在同一个 SAS 会话中根据需要执行。在 SAS 会话结束时，编译后的宏将从 `Work.Sasmacr` 目录库中删除，但源代码仍保留在自动调用库中。\n\
  \n## 创建自动调用库\n\n自动调用库可以是以下任意一种：\n\n*   包含源文件的目录\n*   分区数据集 (PDS)\n*   SAS 目录库 (catalog)\n\
  \n创建自动调用库的方法取决于你正在使用的操作系统环境。要在基于目录的操作系统（如 Windows 或 UNIX）中创建自动调用库，请创建一个用于存储宏定义的目录。该目录中的每个宏定义都是一个独立的文件，扩展名为\
  \ `.sas`，且文件名与其包含的宏同名。\n\n## 示例\n\n假设你想将宏 `Prtlast` 保存到自动自动调用库中。在基于目录的操作系统中，第一步是创建一个存放你的宏源文件的目录。你可以使用“另存为”窗口创建目录，并将宏定义保存到该目录中。在活动的代码编辑窗口中带有\
  \ `Prtlast` 定义的情况下，选择`文件>另存为`。在“另存为”窗口中，导航到你想要创建自动调用库的位置。选择`新建文件夹`，输入目录名称并点击`确定`。然后输入文件名\
  \ `Prtlast`，确保文件类型为 `.sas`，并点击`保存`。\n\n**提示**：你也可以 `FILE` 命令将你的宏定义保存到自动调用库中。要使用\
  \ `FILE` 命令，你需要在命令行中输入 `file '<<path>external-file-name'`。\n\n## 默认自动调用库\n\nSAS\
  \ 为你提供了几个默认的自动调用库。这里列出了 SAS 提供的自动调用库中的某些宏。\n\n| 宏语法 | 目的 |\n| --- | --- |\n| `%LOWCASE(argument)`\
  \ | 将参数中的大写字母转换为小写 |\n| `%QLOWCASE(argument)` | 将参数中的大写字母转换为小写，并返回一个掩码特殊字符和助记操作符的结果\
  \ |\n| `%LEFT(argument)` | 删除参数开头的空格 |\n| `%TRIM(argument)` | 删除参数末尾的空格 |\n| `%CMPRES(argument)`\
  \ | 删除参数中的多个空格 |\n| `%DATATYP(argument)` | 根据参数是否为整数返回 NUMERIC 或 CHAR |\n\n你可能熟悉\
  \ SAS 函数如 `TRIM` 和 `LEFT`。SAS 提供的这些宏看起来像函数，但实际上是宏。这些宏的一个用处是，除了在程序中使用它们，你还可以查看它们的源代码。\n\
  \n## 示例\n\n`lowcase` 的宏定义所示。注意此宏中的注释提供了关于使用该宏的信息。\n\n```\n%macro lowcase(string);\n\
  %**************************************;\n%* 宏：LOWCASE\n%* 用法：1) %lowcase(argument)\n\
  %* 说明：\n%   此宏返回传递给它的参数，并将所有大写字母转换为小写。\n%* 例：%let macvar=%lowcase(SAS Institute.);\n\
  %* 变量 macvar 的值为 \"sas institute inc。\"\n% 注意：\n%   虽然 %UPCASE 函数的参数可以包含逗号，但 %LOWCASE\
  \ 的参数不能，除非加引号。\n%   由于 %LOWCASE 是宏而不是函数，它会将逗号解释为参数的结束。\n%**************************************;\n\
  %sysfunc(lowcase(%nrbquote(&string)))\n%mend;\n```\n\n\n\n\n\n# MAUTOSOURCE 系统选项\n\
  \n| 通用形式，`MAUTOSOURCE` 系统选项 | `OPTIONS MAUTOSOURCE` \\| `NOMAUTOSOURCE` |\n| :---\
  \ | :--- |\n| 以下是语法说明：`MAUTOSOURCE` 是默认设置，指定可以使用自动调用（autocall）功能。`NOMAUTOSOURCE`\
  \ 指定不可用自动调用功能。 |\n\n`SASAUTOS=` 系统选项控制宏处理程序在何处查找自动调用宏。\n\n# SASAUTOS= 系统选项\n\n|\
  \ 通用形式，`SASAUTOS=` 系统选项 | `OPTIONS SASAUTOS=library-1;` \\| `OPTIONS SASAUTOS=(library-1,...,library-n);`\
  \ |\n| :--- | :--- |\n| 以下是语法说明：`library-1` 到 `library-n` 的值是对包含宏定义的源库的引用。要指定一个你可以可以\n\
  \n使用的源库，可以： |\n\n*   使用 `fileref`（文件引用名）来引用其位置\n*   指定库的 `pathname`（路径，用引号括起来）。\n\
  \n除非您的系统管理员更改了 `SASAUTOS=` 系统选项的默认值，否则它的值为 `fileref` `Sasautos`，且该 `fileref` 指向安装期间创建的默认自动调用库的位置。`Sasautos`\
  \ `fileref` 可以引用多个连接在一起的位置。通常情况下，将您自己创建的任何自动调用库与 `SASAUTOS=` 系统选项值中的默认自动调用库合并是一个好主意。否则，新的自动调用库将替换\
  \ `SASAUTOS=` 值中的默认或现有库，自动调用功能将仅访问新的自动调用库。\n\n## 示例\n\n假设您想访问 `Prtlast` 宏，该宏存储在自动调用库\
  \ `C:\\Mysasfiles` 中。同时您还想确保默认自动调用库（`fileref` `Sasautos` 指向的位置）仍然可自动调用功能使用。您可以提交以下代码：\n\
  \n```\noptions mautosource sasautos=('c:\\mysasfiles',sasautos);\n%prtlast\n```\n\
  \n注意：`MAUTOLOCDISPLAY` 选项是一个布尔选项，它会在 SAS 日志中输出一条备注，指示编译自动调用宏时源代码的来源。该备注与使用 `MLOGIC`\
  \ 选项时显示的信息类似。此选项的默认设置为 `NOMAUTOLOCDISPLAY`。当自动调用功能生效时，如果您调用了一个之前未编译过的宏，宏处理程序将自动\n\
  \n1.  在自动调用库（或如果在 `SASAUTOS=` 系统选项中识别出多个库，则逐一搜索每个自动调用库）中搜索与调用宏同名的成员\n2.  如果找到成员，则将源语句引入当前\
  \ SAS 会话\n3.  如果未找到成员，则输出错误信息\n4.  顺序提交成员中的所有语句以编译宏\n5.  将编译后的宏存储在临时目录 `Work.Sasmacr`\
  \ 中\n6.  调用该宏\n\n如果宏在当前 SAS 会话期间已经编译过，则自动调用功能将不再自动调用库中搜索。在这种情况下，将执行会话编译的宏。\n\n#\
  \ 使用存储的编译宏\n\n## 存储编译宏功能\n\n请记住，当宏被编译时，默认存储在临时 SAS 目录 `Work.Sasmacr` 中。您也可以将编译后的宏存储在永久的\
  \ SAS 目录中。然后您可以使用存储编译宏功能来访问包含编译宏的永久 SAS 目录。使用存储编译宏有几个优点：\n\n*   当进行宏调用时，SAS 不需要编译宏定义。\n\
  *   会话编译的宏和自动调用功能在同一会话中同样可用。\n*   用户无法修改编译后的宏。\n\n两个 SAS 系统选项影响存储的编译宏：`MSTORED`\
  \ 和 `SASMSTORE=`。`MSTORED` 系统选项控制存储编译宏功能可用。\n\n| 通用形式，`MSTORED` 系统选项 | `OPTIONS\
  \ MSTORED` \\| `NOMSTORED` |\n| :--- | :--- |\n| 以下是语法说明：`NOMSTORED` 是默认设置，指定存储编译宏功能不搜索编译后的宏。`MSTORED`\
  \ 指定存储编译宏功能在 `SASMSTORE=` 选项引用的 SAS 库目录中搜索存储的编译宏。 |\n\n`SASMSTORE=` 系统选项控制宏处理程序在何处查找存储的编译宏。\n\
  \n| 通用形式，`SASMSTORE=` 系统选项 | `OPTIONS SASMSTORE=libref;` |\n| :--- | :--- |\n| 以下是语法说明：`libref`\
  \ 指定包含（或包含存储编译 SAS 宏目录的 SAS 库的 `libref`。`Work.Sasmacr` 是该目录。`MSTORED` 和 `SASMSTORE=`\
  \ 选项可以在调用时或使用语句时设置。 |\n\n## 创建存储的编译宏\n\n要创建永久存储的宏，您必须执行以下操作：\n\n1.  为存储宏的 SAS 库分配一个\
  \ `fileref`\n2.  设置系统选项 `MSTORED` 和 `SASMSTORE=`\n3.  在 `%MACRO` 语句中使用 `STORE` 选项\n\
  \n| 通用形式，带有 `STORE` 选项的宏定义 | `%MACRO macro-name <parameter list)> /STORE='description>';%MEND\
  \ macro-name;` |\n| :--- | :--- |\n| 以下是语法说明：`description` 是目录中的可选文本。`macro-name`\
  \ 是宏的名字。`parameter list` 是指定的一个或多个宏变量。 |\n\n存储编译宏有几项限制：\n\n*   `Sasmacr` 是可以存储编译宏的唯一目录。您可以在任何\
  \ SAS 库中创建它。\n*   您无法跨操作系统复制存储的编译宏。您必须复制源程序并重新创建宏。\n*   无法从编译宏重新创建源码。\n\n## 使用 SOURCE\
  \ 选项\n\n将源程序与编译宏分开保存的替代方案是在 `%MACRO` 语句中使用 `SOURCE` 选项，将编译宏的源码与编译代码合并存储。`SOURCE`\
  \ 选项要求设置 `STORE` 选项和 `MSTORED` 选项。下面的 `%MACRO` 语句显示了使用 `SOURCE` 选项的正确语法。\n\n```\n\
  %macro macro-name<(parameter list)> /STORE SOURCE;\n```\n\n由 `SOURCE` 选项保存的源码从 `%MACRO`\
  \ 关键字开始，到 `%MEND` 语句后的分号结束。提示：`SOURCE` 选项用于嵌套宏定义。\n\n## 示例\n\n假设您想在 SAS 库中编译形式存储\
  \ `Words` 宏。此示例了 `Words` 宏的定义。该宏接收一个字符串，将其分割，并创建一系列宏变量来存储每个单词。注意，定义中同时使用了 `STORE`\
  \ 选项和 `SOURCE` 选项，这样 `Words` 就会以编译宏的形式永久存储，并与其源码一起存储，如下：\n\n```\nlibname macrolib\
  \ 'c:\\storedlib';\noptions mstored sasmstore=macrolib;\n\n%macro words(text,root=w,delim=%str(\
  \ ))/store source;\n   %local i word;\n   %let i=1;\n   %let word=%scan(&text,&i,&delim);\n\
  \   %do %while (&word ne );\n      %global &root&i;\n      %let &root&i=&word;\n\
  \      %let i=%eval(&i+1);\n      %let word=%scan(&text,%i,&delim);\n   %end;\n\
  \   %global &root.num;\n   %let &root.num=%eval(&i-1);\n%mend words;\n```\n\n\n\n\
  \n如果 `Macrolib` 库中不存在 `Sasmacr` 目录，它将被自动创建。你可以列出 `Macrolib.Sasmacr` 目录的内容以验证编译后的宏是否已创建，如下：\n\
  \n```\nproc catalog cat=macrolib.sasmacr;\n   contents;\n   title \"Stored Compiled\
  \ Macros\";\nquit;\n```\n\n如果 `Macrolib.Sasmacr` 中没有存储其他编译后的宏，则是 `PROC CATALOG`\
  \ 步骤的输出：![Stored Compiled Macros](img/m53-25-g1.png)\n\n## 访问存储的编译宏\n\n为了访问存储的编译宏，你必须执行以下操作：\n\
  \n1. 为包含存储宏的 `Sasmacr` 目录的 SAS 库分配一个 `libref`。\n2. 设置系统选项 `MSTORED` 和 `SASMSTORE=libref`。\n\
  3. 调用该宏。\n\n## 示例\n\n以下程序调用了 `Words` 宏。假设 `Words` 宏已经在之前的 SAS 会话中被编译并存储。\n\n```\n\
  libname macrolib 'c:\\storedlib';\noptions mstored sasmstore=macrolib;\n\n%words(This\
  \ is a test)\n%put Number of Words (wnum): &wnum;\n%put Word Number 1 (w1): &w1;\n\
  %put Word Number 2 (w2): &w2;\n%put Word Number 3 (w3): &w3;\n%put Word Number 4\
  \ (w4): &w4;\n```\n\n以下是提交此代码时写入 SAS 日志的部分消息。\n\n表 12.2 SAS 日志\n\n```\n9    libname\
  \ macrolib 'c:\\storedlib';\nNOTE: Libref MACROLIB was successfully assigned as\
  \ follows:\n      Engine:        V9\n      Physical Name: c:\\storedlib\n10    \
  \   options mstored sasmstore=macrolib;\n11\n12       %words(This is a test)\n13\
  \       %put Number of Words (wnum): &wnum;\nNumber of Words (wnum): 4\n14     \
  \  %put Word Number 1 (w1): &w1;\nWord Number 1 (w1): This\n15       %put Word Number\
  \ 2 (w2): &w2;\nWord Number 2 (w2): is\n16       %put Word Number 3 (w3): &w3;\n\
  Word Number 3 (w3): a\n17       %put Word Number 4 (w4): &w4;\nWord Number 4 (w4):\
  \ test\n```\n\n## 访问存储的宏代码\n\n如果你使用 `%MACRO` 语句的 `SOURCE` 选项将宏源代码与存储的编译宏一起存储，你可以使用\
  \ `%COPY` 语句来访问存储的源码。\n\n`%COPY` 语句的通用格式：`%COPY macro-name /SOURCE <other option(s)>;`\n\
  \n以下是对语法的解释：\n* `macro-name` 要访问源码的宏名称。\n* `SOURCE` 指定将宏的源代码复制到输出目标。如果没有指定输出目标，则源码将写入\
  \ SAS 日志。\n* `other options` 包括以下选项：\n    * `LIBRARY=` 指定包含存储的编译 SAS 宏目录的 SAS 库的\
  \ `libref`。如果未指定库，则使用 `SASMSTORE=` 选项指定的 `libref`。该 `libref` 不能为 `Work`。\n    *\
  \ `OUTFILE=` 指定 `%COPY` 语句的输出目标。该值可以是 `fileref` 或外部文件。\n\n## 示例\n\n假设你提交了以下程序创建一个名为\
  \ `Words` 的存储编译宏。\n\n```\nlibname macrolib 'c:\\storedlib';\noptions mstored sasmstore=macrolib;\n\
  \n%macro words(text,root=w,delim=%str( ))/store source;\n   %local i word;\n   %let\
  \ i=1;\n   %let word=%scan(&text,&i,&delim);\n   %do %while (&word ne );\n     \
  \ %global &root&i;\n      %let &root&i=$word;\n      %let i=%eval(&i+1);\n     \
  \ %let word=%scan(&text,&i,&delim);\n      %end;\n   %global &root.num;\n   %let\
  \ &root.num=%eval(&i-1);\n%mend words;\n```\n\n`%COPY` 语句将 `Words` 宏的源码写入 SAS 日志。这是一个示例：\n\
  \n```\n%copy words/source;\n```\n\n下面的 SAS 日志显示了 `Words` 宏的源码。\n\n表 12.3 SAS 日志\n\
  \n```\n17     %copy words/source;\n%macro words(text,root=w,delim=%str( ))/store\
  \ source;\n\n        %local i word;\n        %let i=1;\n        %let word=%scan(&text,&i,&delim);\n\
  \        %do %while (&word ne );\n           %global &root&i;\n           %let &root&i=$word;\n\
  \           %let i=%eval(&i+1);\n           %let word=%scan(&text,&i,&delim);\n\
  \        %end;\n        %global &root.num;\n        %let &root.num=%eval(&i-1);\n\
  %mend words;\n```\n\n存储编译宏功能可以与 `Autocall Facility` 以及会话编译宏结合使用。当你提交如 `Words` 这样的宏调用时，它会搜索：\n\
  \n1. `Work` 库中的 `Sasmacr` 目录。\n2. `SASMSTORE=` 选项指定的 `libref` 中的 `Sasmacr` 目录。\n\
  3. `SASAUTO=` 选项指定的 `autocall libraries` 中的 `Sasmacr` 目录。\n\n\n\n\n\n*   你可以通过四种方式为程序提供宏支持：作为会话编译宏、使用\
  \ `%INCLUDE` 语句、通过自动调用（autocall）功能，或者作为存储的已编译宏。\n\n*   如果你使用自动调用功能，则必须指定 `MAUTOSOURCE`\
  \ 和 `SASAUTOS=` 系统选项。\n\n*   如果你使用存储已编译宏功能，则必须指定 `MSTORED` 和 `SASMSTORE=` 系统选项。\n\
  \n*   宏编译发生的时间取决于你使用哪种方法来访问宏。\n\n# 测验\n\n为每个问题选择一个最佳答案。完成测验后，请使用附录中的答案检查你的答案。\n\n\
  1.  `%INCLUDE` 语句\n    1.  可以将外部文件的内容插入程序中。\n    2.  当该文件的内容插入插入程序并提交时，可以导致存储在外部文件中的宏定义被编译。\n\
  \    3.  可以使用 `SOURCE2` 选项指定，将插入到程序的外部文件内容写入 SAS 日志中。\n    4.  以上所有。\n\n2.  如果你在\
  \ SAS 目录的 `SOURCE` 条目中存储宏定义\n    1.  可以使用 `FILENAME` 和 `%INCLUDE` 语句提交宏定义进行编译。\n\
  \    2.  你可以使用 `PROC CATALOG` 语句来编译宏。\n    3.  `SOURCE` 条目在会话结束时被删除。\n    4.  在程序中调用宏之前不需要编译该宏。\n\
  \n3.  下列哪个程序正确设置了相应的系统选项并调用了宏 `Prtlast`？假设 `Prtlast` 以文本文件形式存储在自动调用库中，且在当前 SAS 会话期间尚未被编译。\n\
  \    1.  \n    ```\n    libname mylib 'c:\\mylib';\n    filename macsrc 'mylib.macsrc';\n\
  \    options mautosource sasautos=(macsrc, sasautos);\n    %prtlast\n    ```\n \
  \   2.  \n    ```\n    libname mylib 'c:\\mylib';\n    filename macsrc catalog 'mylib.macsrc';\n\
  \    %prtlast\n    ```\n    3.  \n    ```\n    filename mylib 'c:\\mylib';\n   \
  \ options mautosource sasautos=(sasautos,mylib);\n    %prtlast\n    ```\n    4.\
  \  \n    ```\n    libname mylib 'c:\\mylib';\n    options mautosource sasautos=mylib;\n\
  \    %prtlast\n    ```\n\n4.  如果你使用存储已编译宏功能，\n    1.  宏处理器不会在每次使用时都编译宏。\n    2.\
  \  存储已编译宏功能能够访问的已编译宏只有存储在 `Sasmacr` 目录中的宏。\n    3.  你需要指定 `MSTORED` 和 `SASMSTORE=`\
  \ 系统选项。\n    4.  以上所有。\n\n5.  下列哪项操作正确创建了持久化存储的已编译宏？\n    1.  \n    ```\n    libname\
  \ macrolib 'c:\\mylib';\n    options sasmstore;\n    %macro prtlast; / store\n \
  \      proc print data=&syslast (obs=5);\n          title \"Listing of &syslast\
  \ data set\";\n       run;\n    %mend;\n    ```\n    2.  \n    ```\n    libname\
  \ macrolib 'c:\\mylib';\n    options mstored sasmstore=macrolib;\n    %macro prtlast\
  \ / store;\n       proc print data=&syslast (obs=5);\n          title \"Listing\
  \ of &syslast data set\";\n       run;\n    %mend;\n    ```\n    3.  \n    ```\n\
  \    libname macrolib 'c:\\mylib';\n    options mstored sasmstore=macrolib;\n  \
  \  %macro prtlast;\n       proc print data=&syslast (obs=5);\n          title \"\
  Listing of &syslast data set\";\n       run;\n    %mend;\n    ```\n    4.  \n  \
  \  ```\n    libname macrolib 'c:\\mylib';\n    %macro prtlast / store;\n       proc\
  \ print data=&syslast (obs=5);\n          title \"Listing of &syslast data set\"\
  ;\n       run;\n    %mend;\n    ```\n\n6.  当提交以下代码时，会发生什么？\n    ```\n    %macro\
  \ prtlast;\n       proc print data=&syslast (obs=5);\n          title \"Listing\
  \ of &syslast data set\";\n       run;\n    %mend;\n    ```\n    1.  一个名为 `Prtlast`\
  \ 的会话编译宏被存储在 `Work.Sasmacr` 中。\n    2.  一个名为 `Prtlast` 的宏存储在自动调用库中。\n    3.  `Prtlast`\
  \ 宏作为存储已编译宏存储。\n    4.  `Prtlast` 宏作为持久 SAS 目录中的 `SOURCE` 条目存储。\n\n7.  你为什么想将宏存储在外部文件中？\n\
  \    1.  你可以轻松地与其他共享你的宏。\n    2.  你可以使用任何文本编辑器编辑你的宏。\n    3.  你的宏可以在后续 SAS 会话中可用。\n\
  \    4.  以上所有。\n\n8.  以下 `PROC CATALOG` 步骤做了什么？\n    ```\n    proc catalog cat=mylib.sasmacr;\n\
  \       contents;\n    quit;\n    ```\n    1.  将 `Sasmacr` 目录的内容复制到临时集。\n    2.\
  \  列出 `Sasmacr` 目录的内容。\n    3.  将内容复制到 SAS 目录。\n    4.  以上都不是。\n\n9.  关于存储宏，下列哪项是不正确的？\n\
  \    1.  因为这些存储宏是经过编译的，你应该将宏定义保存在不同的位置。\n    2.  存储已编译功能编译并将宏保存在指定的持久化目录中。\n   \
  \ 3.  使用存储已编译功能不需要指定任何系统选项。\n    4.  你无法移动宏。\n\n10. 下列哪项是不正确的？\n    1.  自动调用功能将已编译宏存储在外部文件中。\n\
  \    2.  自动调用库可以连接。\n    3.  自动调用功能的一个缺点是，当你第一次调用宏时，宏处理器必须对其进行编译。\n    4.  自动调用功能可以与存储已编译功能结合使用。\n\
  \n# 第 13 章：创建索引\n\n*   概述\n*   使用索引\n*   在 DATA 步中创建索引\n*   使用 PROC DATASETS 管理索引\n\
  *   使用 PROC SQL 管理索引\n*   索引的文档与维护\n*   总结\n*   测验\n\n## 概述\n\n本章讨论直接访问。例如，你可以根据数据中的值选择子集。你可以通过使用\
  \ `INDEX=` 数据集选项创建索引来实现此操作。`WHERE` 子句可以使用该索引。通过直接访问所需的观测值，而不是顺序访问所有观测值，你的程序运行得更快。\n\
  \n### 使用索引\n\n## 概述\n\n索引可以帮助你快速定位想要读取的一个多个观测值。索引根据一个或多个键变量的值对 SAS 数据集中的观测值提供直接访问。索引的应用包括\n\
  \n*   为 `WHERE` 处理提供更快的观测子集访问\n*   执行表查找操作\n*   连接观测值\n\n\n如果没有索引，SAS 将按照观测值在数据集中存储的顺序进行顺序访问。例如，为了访问下方示例\
  \ SAS 数据集中变量 `Name` 值为 `Smith` 的观测值，SAS 将从第一条观测值开始读取，逐一读取每一条，直到找到满足条件的观测值为止。![示例\
  \ SAS 数据集](img/m54-19-g2.png)当对 SAS 数据集建立索引时，SAS 会创建一个索引文件，该文件按特定变量或多个变量的**升序**存储值，并包含有关这些值在数据文件中位置的信息。也就是说，索引由“值/标识符”键值对组成，这允许你通过值来定位观测值。例如，如果你对下方的示例\
  \ SAS 数据集基于变量 `Name` 创建了一个索引，SAS 将直接使用该索引找到 `Name` 值为 `Smith` 的观测值，而无需读取之前所有的观测值。![示例\
  \ SAS 数据集](img/m54-19-g1.png)\n\n## 索引类型\n\n你可以创建两种类型的索引：\n\n*   简单索引（simple index）\n\
  *   复合索引（composite index）\n\n简单索引由一个键变量的值组成，该变量可以是字符型或数值型。当你创建简单索引时，SAS 会用该键变量命名索引。复合索引由多个键变量的值组成，这些变量可以是字符型、数值型或它们的组合。这些键变量的值被拼接成一个单一值。例如，如果在键变量\
  \ `Lastname` 和 `Firstname` 上建立索引，则该索引的值将包括 `Lastname` 的值，后跟 `Firstname` 的值。当你创建复合索引时，必须指定一个唯一的索引名称，该名称不能与数据集中任何现有变量或索引重名。通常，复合索引中仅第一个变量会被使用。在示例中，你可以将上文指定的复合索引（`Lastname`\
  \ 加上 `Firstname`）用于仅使用 `Lastname` 的 `WHERE` 表达式。例如，表达式 `where Lastname='Smith'`\
  \ 使用了该复合索引，因为 `Lastname` 是该索引中的第一个变量。也就是说，`Lastname` 的值是索引中列出的值的第一部分。\n\n# 在 DATA\
  \ 步中创建索引\n\n## 概述\n\n要在创建数据集的同时创建索引，请在 `DATA` 语句中使用 `INDEX=` 数据集选项。\n\n| 通用格式，带有\
  \ `INDEX=` 选项的 `DATA` 语句：`DATA SAS-data-file-name (INDEX=(index-specification-1<UNIQUE><...index-specification-n></UNIQUE>))`\
  \ | 以下是语法的解释：`SAS-data-file-name` 是有效的 SAS 数据集名称。简单索引的 `index-specification` 是键变量的名称。复合索引的\
  \ `index-specification` 为 `(index-name=(variable-1...variable-n))`。`UNIQUE` 指定每个观测值的键变量值必须是唯一的。\
  \ |\n\n你你可以在单个 SAS 数据集上创建多个索引。但是，请记住，创建和存储索引会消耗系统资源。因此，你应该只对经常用于选择观测值的变量创建索引。`UNIQUE`\
  \ 选项保证了键变量或复合变量组的值对于数据集中的每条观测值都保持唯一。在现有数据集中，如果尝试对其创建唯一索引的变量或多个变量具有重复值，则索引将无法创建。同样，如果更新尝试向该数据集添加一个具有索引变量重复值的观测值，则该更新将被拒绝。\n\
  \n## 示例\n\n以下示例在 `Simple` 数据集上创建了一个简单索引。索引命名为 `Division`，它包含 `Division` 变量的值。\n\n\
  ```\ndata simple (index=(division));\n   set sasuser.empdata;\nrun;\n```\n\n以下示例在\
  \ `Simple2` 数据集上创建了两个简单索引。第一个索引名为 `Division`，包含 `Division` 变量的值。第二个索引名为 `EmpID`，包含\
  \ `EmpID` 变量的唯一值。\n\n```\ndata simple2 (index=(division empid/unique));\n   set\
  \ sasuser.empdata;\nrun;\n```\n\n以下示例在 `Composite` 数据集上创建了一个复合索引。索引名为 `Empdiv`，它包含\
  \ `Division` 变量和 `EmpID` 变量的拼接值。\n\n```\ndata composite (index=(Empdiv=(division\
  \ empid)));\n   set sasuser.empdata;\nrun;\n```\n\n当你创建或使用索引时，可能想验证它是否已正确创建或使用。要在\
  \ SAS 日志中显示有关索引创建或使用的信息，请将系统选项 `MSGLEVEL=` 设置为 `I`。\n\n| 通用格式，`MSGLEVEL=` 系统选项：`OPTIONS\
  \ MSGLEVEL= N|I` | 以下是语法的解释：`N` 仅打印备注（notes）、警告和错误消息。这是默认设置。`I` 会打印与索引使用、合并处理和排序工具相关的附加备注或\
  \ `INFO` 消息，以及标准的备注、警告和错误消息。 |\n\n## 示例\n\n以下代码将 `MSGLEVEL=` 系统选项设置为 `I`，并创建带有两个索引的\
  \ `Sasuser.Sale2000` 数据集：\n\n```\noptions msglevel=i;\ndata sasuser.sale2000(index=(origin\n\
  \     flightdate=(flightid date)/unique));\n   infile sale2000 dsd;\n   input FlightID\
  \ $ RouteID $ Origin $\n         Dest $ Cap1st CapBusiness\n         CapEcon CapTotal\
  \ CapCargo\n         Date Psgr1st PsgrBusiness\n         PsgrEcon Rev1st RevBusiness\n\
  \         RevEcon SaleMon $ CargoWgt\n         RevEcon Sale;\n   format date.;\n\
  run;\n```\n\n提交上述程序时，写入 SAS 日志的这些如下。\n\n表 13.1 SAS 日志\n\n|  \n\n```\nNOTE: The infile\
  \ SALE000 is:\n      File Name=C:\\My SAS Files\\9.0\\sale000.dat,\n      RECFM=V,LRECL=256\n\
  \nNOTE: 153 records were read from the infile sale000.\n      The minimum record\
  \ length was 82.\n      The maximum record length was 100.\nNOTE: The data set SASUSER.SALE2000\
  \ has 153 observations\n      and 19 variables.\nNOTE: Composite index flightdate\
  \ has been defined.\nNOTE: Simple index origin has been defined.\nNOTE: DATA statement\
  \ used (Total process time):\n      real time           1.08 seconds\n```\n\n##\
  \ 判断 SAS 是否使用了索引\n\nSAS 并不总是能够或高效地使用索引来访问特定观测值。在以下情况下不会使用索引：\n\n*   在 `DATA` 步中使用过滤\
  \ `IF` 语句\n*   特定的 `WHERE` 表达式\n*   如果 SAS 认为顺序读取数据更高效\n\n## 示例\n\n你可以使用 `MSGLEVEL=`\
  \ 选项来判断是否使用了索引。以下 SAS 日志显示了指示是否使用的 `INFO` 消息示例。\n\n表 13.2 SAS 日志\n\n|  \n\n```\n\
  options msglevel=i;\n\nproc print data=sasuser.revenue;\n     where flightid ne\
  \ 'IA1200';\nINFO: Index FlightID not used. Increasing bufno to 3 may help.\n```\n\
  \n\n\n表 13.3 SAS 日志\n\n|  \n\n```\noptions msglevel=i;\n\ndata somflights;\n   \
  \  set sasuser.revenue;\n     where flightid > 'IA1200';\nINFO: Index FlightID selected\
  \ for WHERE clause optimization.\n```\n\n\n\n\n## 使用 `PROC DATASETS` 创建和删除索引的通用形式：\n\
  \n```sas\nPROC DATASETS LIBRARY= libref <NOLIST>;\nMODIFY SAS-data-set-name;\nINDEX\
  \ DELETE index-name;\nINDEX CREATE index-specification;\nQUIT;\n```\n\n以下是语法的解释：\n\
  - `libref`:指向包含 `SAS-data-set-name` 的 SAS 库。\n- `NOLIST`: 选项抑制在 SAS 日志和 ODS 输出中打印\
  \ SAS 文件的目录。\n- `index-name`:要删除的现有索引的名称。\n- `index-specification`:对于简单索引，格式为键变量的名称。\n\
  - `index-specification`:对于复合索引，格式为 `index-name=(variable-1...variable-n)`。\n\n如果要创建的索引已经存在，则无法使用\
  \ `PROC DATASETS` 中的 `INDEX CREATE` 语句。在这种情况下，你必须删除同名的现有索引，然后创建新索引。\n\n**提示**：`PROC\
  \ DATASETS` 按照顺序执行语句。因此，如果你在同一个步骤中删除并创建索引，应该先删除旧索引，这样新创建的索引就可以重用已删除索引占据的空间。\n\n\
  ## 示例\n\n下面的示例在 `Sasuser.Sale2000` 数据集上创建一个名为 `Origin` 的索引。`Origin` 是一个基于键变量 `Origin`\
  \ 的简单索引。\n\n```sas\nproc datasets library=sasuser nolist;\n   modify sale2000;\n\
  \   index create origin;\nquit;\n```\n\n下面的示例首先从 `Sasuser.Sale2000` 数据集中删除 `Origin`\
  \ 索引，然后在 `Sasuser.Sale2000` 数据集上创建两个新索引。`FlightID` 是一个基于键变量 `FlightID` 值的简单索引。`Fromto`\
  \ 是一个基于键变量 `Origin` 和 `Dest` 拼接值的复合索引。\n\n```sas\nproc datasets library=sasuser\
  \ nolist;\n   modify sale2000;\n   index delete origin;\n   index create flightid;\n\
  \   index create Fromto=(origin dest);\nquit;\n```\n\n# 使用 PROC SQL 管理索引\n\n## 概述\n\
  \n你也可以在 `PROC SQL` 步骤中从现有数据集中创建或删除索引。`CREATE INDEX` 语句允许你对数据集创建索引。`DROP INDEX` 语句允许你从数据集中删除删除索引。\n\
  \n## 使用 `PROC SQL` 创建和删除索引的通用形式：\n\n```sas\nPROC SQL;\nCREATE <UNIQUE > INDEX index-name\
  \ ON table-name(column-name-1<...,column-name-n>);\nDROP INDEX index-name FROM table-name;\n\
  QUIT;\n```\n\n以下是语法的解释：\n- `index-name`: 如果索引仅基于一列的值，则 `index-name` 与 `column-name-1`相同。\n\
  - `index-name`: 如果索引基于多个列，则 `index-name` 与任何 `column-name` 相同。\n- `table-name`:\
  \ `index-name` 关联的数据集的名称。\n\n## 示例\n\n下面的示例在 `Sasuser.Sale2000` 数据集上创建一个名为 `Origin`\
  \ 的简单索引。该索引基于 `Origin` 列的值。\n\n```sas\nproc sql;\n   create index origin on sasuser.sale2000(origin);\n\
  quit;\n```\n\n下面的示例从 `Sasuser.Sale2000` 数据集中删除 `Origin` 索引，并创建一个名为 `Tofrom` 的新索引，该索引基于\
  \ `Origin` 和 `Dest` 列值的拼接：\n\n```sas\nproc sql;\n   drop index origin from sasuser.sale2000;\n\
  \   create index Tofrom\n      on sasuser.sale2000(origin, dest);\nquit;\n```\n\n\
  # 索引的文档记录与维护\n\n## 概述\n\n索引存储在与被索引的数据集相同的 SAS 库中，但存储在与数据集不同的 SAS 文件中。索引文件的成员类型为\
  \ `INDEX`。每个数据集只有一个索引文件；数据集的所有索引都存储在同一个文件中。\n\n下图显示了在 Windows 操作系统环境下 SAS 数据集文件和\
  \ SAS 索引文件的关系。请注意，索引文件的名称与其关联的数据集相同，但它们具有不同的文件扩展名。此外，请注意每个索引文件可以包含一个或多个索引，不同的索引文件可以包含名称相同的索引。\n\
  \n![SAS 数据集文件和 SAS 索引文件](img/m54-30-g1.png)\n\n**注意**：索引文件存储在与其关联的数据集相同的位置。然而，请记住以下点：\n\
  - 索引文件不会出现在 SAS Explorer 窗口中。\n- 在 z/OS 操作系统文件列表中，索引文件不会作为单独的文件显示。\n\n有时，你可能想要查看数据集存在的索引列表。你可能还想查看索引的信息，例如它们是否是唯一的，以及它们使用了哪些键变量。让我们考虑记录索引的一些方法。\n\
  \n索引信息存储在数据集的描述部分（descriptor portion）。你可以使用使用 `CONTENTS` 过程或 `PROC DATASETS` 中的\
  \ `CONTENTS` 语句来列出描述部分的信息。`CONTENTS` 过程或 `PROC DATASETS` 中 `CONTENTS` 语句的输出包含关于数据集的以下信息：\n\
  - 概要信息\n- 引擎相关信息\n- 变量属性列表\n- 完整性约束列表\n- 索引列表\n\n## `PROC CONTENTS` 的通用形式：\n\n```sas\n\
  PROC CONTENTS DATA=<libref>;\nRUN;\n```\n\n## 使用 `PROC DATASETS` 的 `CONTENTS` 语句的通用形式：\n\
  \n```sas\nPROC DATASETS LIBRARY= libref <NOLIST>;\nCONTENTS <data-set-name>;\nQUIT;\n\
  ```\n\n以下是语法的解释：\n- `data-set-name`: 要列出信息的数据集。\n- `NOLIST`: 选项抑制在 SAS 日志和 ODS 输出中打印\
  \ SAS 文件的目录。\n\n**注意**：如果你使用了 `DATA=` 选项，则不需要指定 `libref`。同样，如果你在 `DATA=` 选项中指定了\
  \ `libref`，则不需要使用 `LIBRARY=` 选项。\n\n## 示例\n\n下面的示例打印 `Sasuser.Sale2000` 数据集的信息。请注意，库是在\
  \ `PROC DATASETS` 的 `LIBRARY=` 选项中指定的。\n\n```sas\nproc datasets library=sasuser\
  \ nolist;\n   contents sale2000;\nquit;\n```\n\n下面的示例也打印 `Sasuser.Sale2000` 数据集的信息。请注意，库是在\
  \ `CONTENTS` 语句中指定的。\n\n```sas\nproc datasets nolist;\n   contents data=sasuser.sale2000;\n\
  quit;\n```\n\n下面的示例打印 `Sasuser.Sale2000` 数据集：\n\n```sas\nproc contents data=sasuser.sale2000;\n\
  run;\n```\n\n这些程序的 `PROC DATASETS` 和 `PROC CONTENTS` 输出是相同的。每组输出的最后部分信息是 `Sasuser.Sale2000`\
  \ 创建的索引列表，如下：\n\n![Sasuser.Sale2000](img/m54-31-g1.png)\n\n你也可以使用这些方法之一列出整个库而不是单个数据集。要使用\
  \ `PROC CONTENTS` 或 `PROC DATASETS` 中的 `CONTENTS` 语句列出库中的所有文件，需要在 `DATA=` 选项中指定关键字\
  \ `_ALL_`。\n\n## 示例\n\n下面的示例打印 `Work` 库所有文件的信息：\n\n```sas\nproc contents data=work._all_;\n\
  run;\n```\n\n下面的示例也打印 `Work` 库所有文件的信息：\n\n```sas\nproc datasets library=work nolist;\n\
  \   contents data=_all_;\nquit;\n```\n\n索引存储在单独的文件中。对数据集进行维护操作时，可能会对索引文件产生影响。如果你更改数据集中的变量或值，可能会对特定索引中的值/标识对产生影响。\n\
  \n| 任务 | 影响 |\n| --- | --- |\n| 向数据集添加观测值或观测值。 | 值/标识对将被添加到索引或多个索引中。 |\n\n\n\n\n\
  \n| 从数据集中删除一个或多个观测值。 | 从索引或多个索引中删除值/标识符对。 |\n| 在数据集中更新一个或多个观测值。 | 在索引或多个索引中更新值/标识符对。\
  \ |\n| 删除数据集。 | 索引文件被删除。 |\n| 使用 `DATA` 步重建数据集。 | 索引文件被删除。 |\n| 在 `PROC SORT` 中使用\
  \ `FORCE` 对数据进行原地排序。 | 索引文件被删除。 |\n\n让我们考虑你可能对数据集上执行的一些其他常见任务，以及 SAS 结果结果对索引文件执行的操作。\n\
  \n## 复制数据集\n\n你可能希望将带有索引的数据集复制到新位置。你可以在 `PROC DATASETS` 步中使用 `COPY` 语句来复制数据集。当你使用\
  \ `COPY` 语句复制具有关联索引的数据集时，SAS 会为新的数据文件自动创建一个新的索引文件。\n\n带有 `COPY` 语句的 `PROC DATASETS`\
  \ 一般形式：\n```\nPROC DATASETS LIBRARY=old-libref <NOLIST>;\nCOPY OUT=new-libref;\n\
  SELECT SAS-data-set-name;\nQUIT;\n```\n以下是语法的解释：\n- `old-libref`:指定复制数据集的库名。\n-\
  \ `new-libref`:指定数据集复制到的库名。\n- `SAS-data-set-name`:指定被复制的数据集名称。\n\n你也可以使用 `COPY`\
  \ 过程将数据集复制到新位置。通常，`PROC COPY` 的功能与 `DATASETS` 过程中的 `COPY` 语句相同。当你使用 `PROC COPY`\
  \ 复制具有关联索引的数据集时，SAS 会为新的数据文件自动创建一个新的索引文件。如果你在 `COPY` 过程中使用 `MOVE` 选项，索引文件将从原始位置删除并在位置重建。\n\
  \n`PROC COPY` 步的一般形式：\n```\nPROC COPY OUT=new-libref IN=old-libref<MOVE>;\nSELECT\
  \ SAS-data-set-name(s);\nRUN;\nQUIT;\n```\n以下是语法的解释：\n- `old-libref`:指定复制数据集的库名。\n\
  - `new-libref`:指定数据集复制到的库名。\n- `SAS-data-set-name`:指定被复制的一个或多个数据集名称。\n\n## 示例\n\n\
  以下程序产生相同的结果。两个程序都从 `Sasuser` 库复制 `Sale2000` 数据集并将其放置在 `Work` 库中。同样，这两个程序都会为 `Work.Sale2000`\
  \ 创建一个新的索引文件，该文件包含了 `Sasuser.Sale2000` 中存在的所有索引。\n\n```\nproc datasets library=sasuser\
  \ nolist;\n   copy out=work;\n   select sale2000;\nquit;\n\nproc copy out=work in=sasuser;\n\
  \   select sale2000;\nrun;\n```\n\n注意：如果你在 SAS Explorer 或 SAS Enterprise Guide 中复制并粘贴数据集，SAS\
  \ 会为新的数据文件自动创建一个新的索引文件。\n\n## 重命名数据集\n\n另一个常见任务是重命名带有索引的数据集。为了保留索引，你可以使用 `PROC DATASETS`\
  \ 中的 `CHANGE` 语句来重命名数据集。索引文件也会自动重命名。\n\n带有 `CHANGE` 语句的 `PROC DATASETS` 一般形式：\n\
  ```\nPROC DATASETS LIBRARY=libref <NOLIST>;\nCHANGE old-data-set-name = new-data-set-name;\n\
  QUIT;\n```\n以下是语法的解释：\n- `libref`:指定存储数据集的 SAS 库。\n- `old-data-set-name`:数据集的当前名称。\n\
  - `new-data-set-name`:数据集的新名称。\n\n## 示例\n\n以下示例将 `Revenue` 数据集从 `Sasuser` 复制到 `Work`，并将\
  \ `Work.Revenue` 数据集重命名为 `Work.Income`。与 `Work.Revenue` 关联的索引文件也会重命名为 `Work.Income`。\n\
  \n```\nproc copy out=work in=sasuser;\n   select revenue;\nrun;\n\nproc datasets\
  \ library=work nolist;\n   change revenue=income;\nquit;\n```\n\n## 重命名变量\n\n你已经看到如何使用\
  \ `PROC DATASETS` 重命名索引数据集。同样，你可能也想重命名索引数据集中的一个或多个变量。为了保留与数据集关联的任何索引，你可以使用 `DATASETS`\
  \ 过程中的 `RENAME` 语句来重命名变量。\n\n带有 `RENAME` 语句的 `PROC DATASETS` 一般形式：\n```\nPROC DATASETS\
  \ LIBRARY=libref <NOLIST>;\nMODIFY SAS-data-set-name;\nRENAME old-var-name-1 = new-var-name-1<...old-var-name-n\
  \ = new-var-name-n>;\nQUIT;\n```\n以下是语法的解释：\n- `libref`:指定存储数据集的 SAS 库。\n- `SAS-data-set-name`:包含要重命名变量的数据集名称。\n\
  - `old-var-name`:原始变量名。\n- `new-var-name`:分配给变量的新名称。\n\n当你使用 `RENAME` 语句重命名具有简单索引的变量时，该索引也会被重命名。如果你重命的变量用于复合索引，复合索引将自动引用新的变量名。然而，如果你尝试将变量重命名为已用于复合索引的名称，将收到错误。\n\
  \n## 示例\n\n以下示例将 `Work.Income` 数据集的 `FlightID` 变量重命名为 `FlightNum`。如果存在简单索引，它将被重命名。\n\
  \n```\nproc datasets library=work nolist;\n   modify income;\n```\n\n## 总结\n\n###\
  \ 使用索引\n\n索引是与数据集关联的 SAS 文件，包含数据关键变量的位置和值。索引允许 SAS 直接访问观测值，而无需顺序读取所有观测值。索引可以是简单的，也可以是复合的。\n\
  \n### 在 DATA 步中创建索引\n\n你可以在创建数据集的同时通过 `INDEX=` 选项创建索引。如果数据集中任何关键变量没有重复值，简单索引和复合索引都可以唯一的。你可以在一个数据集上创建多个索引。你可以使用\
  \ `MSGLEVEL=` 系统选项向 SAS 日志写入有关索引的消息。索引可以提高效率，但在某些情况下索引不会提高效率，因此不应使用。\n\n### 使用 PROC\
  \ DATASETS 和 SQL 管理索引\n\n你可以使用 `PROC DATASETS` 中的 `INDEX CREATE` 语句或 `INDEX DELETE`\
  \ 语句从现有数据创建或删除索引。使用 `PROC DATASETS` 管理索引比在 `DATA` 步中重建数据集并更新索引消耗的系统资源更少。如果你要在同一个\
  \ `PROC DATASETS` 步中删除并创建索引，你应该先删除旧索引再创建索引，以便 SAS 重用已删除索引的空间。你也可以使用 `PROC SQL` 创建或删除索引。\n\
  \n### 索引的文档编制和维护\n\n为特定数据集创建的所有索引都存储在与数据集相同的 SAS 库中。你可以使用 `PROC CONTENTS` 打印数据集存在的所有索引列表，以及数据集的其他信息。`PROC\
  \ DATASETS` 步的 `CONTENTS` 语句可以生成相同的索引列表和数据集信息。你对数据集执行的许多维护任务都会影响与其关联的索引文件。当你使用 `PROC\
  \ DATASETS` 中的 `COPY` 语句复制数据集时，索引文件将为你重建。当你使用 `PROC DATASETS` 重命名数据集或重命名变量时，索引文件会自动更新以反映此更改。\n\
  \n\n\n\n\n```\noptions msglevel=i;\ndata sasuser.sale2000(index=(origin FlightDate=\n\
  \                      (flightid date)/unique));\n   infile 'sale2000.dat';\n  \
  \ input FlightID $7\\. RouteID $7\\. Origin $3.\n         Dest $3\\. Cap1st 8\\\
  . CapBusiness 8.\n         CapEcon 8\\. CapTotal 8\\. CapCargo 8.\n         Date\
  \ date9\\. Psgr1st 8./\n         PsgrBusiness 8\\. PsgrEcon 8.\n         Rev1st\
  \ dollar15.2\n         RevBusiness dollar15.2\n         RevEcon dollar15.2 SaleMon\
  \ $7.\n         CargoWgt 8./ RevCargo dollar15.2;\nrun;\n```\n\n### 使用 PROC DATASETS\
  \ 管理索引\n\n```\nproc datasets library=sasuser nolist;\n   modify sale2000;\n   index\
  \ delete origin;\n   index create flightid;\n   index create Tofrom=(origin dest);\n\
  quit;\n```\n\n### 使用 PROC SQL 管理索引\n\n```sas\nproc sql;\n   create index Tofrom\
  \ on\n          sasuser.sale2000(origin, dest);\n   drop index origin from sasuser.sale2000;\n\
  quit;\n```\n\n你也可以使用 `Dictionary.Indexes` 表来生成报告\n\n```\nproc sql;\n   select *\n\
  \        from dictionary.indexes\n          where libname='SASUSER' and\nmemname='SALE2000';\n\
  \   quit;\n```\n\n## 注意事项\n\n- 索引可以使 SAS 更高效地访问数据集中的特定观测值。然而，由于索引会使用系统资源，因此只应在经常用于选择观测值的变量上创建索引。\n\
  - 索引与数据集关联，但存储为单独的文件。你可以使用 `PROC DATASETS` 或 `PROC CONTENTS` 生成关于数据集索引的报告。你也可以在\
  \ SAS Explorer 资源管理器中右键点击数据集并选择“查看列”（view columns）来查看数据集索引的列表。你应该在对数据集执行维护任务后查看此信息，以确保索引文件已得到维护。\n\
  \n# 测验\n\n请为每个问题选择最佳答案。完成测验后，请使用附录中的答案对照检查你的答案。\n\n1. 关于索引的哪种描述是正确的？\n    1. 它是一个与数据集关联的可选文件。\n\
  \    2. 它允许根据一个或多个键变量的值，直接访问数据集的特定观测值。\n    3. 它可以被分类为简单索引或复合索引，其中任一种都可以由唯一值组成。\n\
  \    4. 以上都是。\n\n2. 下列哪项正确地从 `Sasuser.Revenue` 数据集创建了一个名为 `Flights` 的数据集，创建了一个基于\
  \ `Origin` 和 `Dest` 值的名为 `Fromto` 的复合索引，并向 SAS 日志打印有关索引的提示消息？\n    1. ```sas\n \
  \       options msglevel=i;\n        data flights index=(Fromto=origin dest);\n\
  \           set sasuser.revenue;\n        run;\n        ```\n    2. ```sas\n   \
  \     options msglevel=n;\n        data flights (index=(Fromto=origin dest));\n\
  \           set sasuser.revenue;\n        run;\n        ```\n    3. ```sas\n   \
  \     options msglevel=i;\n        data flights (index=(Fromto=(origin dest)));\n\
  \           set sasuser.revenue;\n        run;\n        ```\n    4. ```sas\n   \
  \     options msglevel=n;\n        data flights (index=Fromto);\n           set\
  \ sasuser.revenue;\n        run;\n        ```\n\n3. 下列哪项是正确的？\n    1. 当你向数据集添加观测值时，索引或多个索引会自动更新添加额外的值/标识符对。\n\
  \    2. 当你重命名作为简单索引键变量的变量时，必须重新创建索引。\n    3. 当你删除数据集时，索引文件将一直保留，直到你也删除它。\n    4.\
  \ 当使用 `COPY` 语句复制数据集时，必须在另一个步骤中复制索引文件。\n\n4. 要在现有数据集上创建索引，你使用以下哪项？\n    1. `PROC\
  \ DATASETS`\n    2. `PROC SQL`\n    3. 使用带有 `INDEX=` 选项的 `DATA` 步骤重建数据集\n    4.\
  \ 以上任何一项\n\n5. 下列哪项正确地在 `Revenue` 数据集上创建一个名为 `Origin` 的简单索引？\n    1. ```sas\n  \
  \      proc sql;\n           create index origin on revenue(origin);\n        quit;\n\
  \        ```\n    2. ```sas\n        proc sql;\n           modify revenue;\n   \
  \        index=origin;\n        quit;\n        ```\n    3. ```sas\n        proc\
  \ sql data=revenue;\n           create index origin;\n        quit;\n        ```\n\
  \    4. ```sas\n        proc sql;\n           index=origin on revenue;\n       \
  \ quit;\n        ```\n\n6. 要查看与数据集关联的索引列表，你使用以下哪项？\n    1. `PROC COPY` 或 `PROC DATASETS`\
  \ 中的 `COPY` 语句\n    2. `PROC CONTENTS` 或 `PROC DATASETS` 中的 `CONTENTS` 语句\n    3.\
  \ `MSGLEVEL=` 系统选项和 `PROC PRINT` 步骤\n    4. 以上任何一项\n\n7. 假设 `Sasuser.Revenue` 数据集有一个名为\
  \ `FlightID` 的简单索引。下列哪些程序使用了索引？\n    1. ```sas\n        proc print data=sasuser.revenue;\n\
  \           where index;\n        ```\n    2. ```sas\n        data flights;\n  \
  \         set sasuser.revenue;\n           where index;\n        run;\n        ```\n\
  \    3. ```sas\n        data flights;\n           set sasuser.revenue;\n       \
  \    if index;\n        run;\n        ```\n    4. ```sas\n        proc print data=sasuser.revenue;\n\
  \           where origin='';\n        ```\n\n# 第 14 章：垂直合并数据\n\n## 概述\n## 引言\n垂直合并数据指的是拼接或交错数据的过程。在某些情况下，数据可能位于数据集中；在其他情况下，数据可能存储在原始文件中。在本章中，你将学习如何使用\
  \ `FILENAME` 和 `INFILE` 语句通过拼接原始文件来创建数据集。你还将学习如何使用 `PROC APPEND` 合并数据集。\n\n## 使用\
  \ FILENAME 语句\n## 概述\n你已经知道可以使用 `FILENAME` 语句将文件引用（fileref）与单个原始文件关联。你也可以使用 `FILENAME`\
  \ 语句通过将单个文件引用分配给要合并的原始文件来拼接原始文件。\n\n`FILENAME` 一般形式：`FILENAME fileref ('external-file1'\
  \ 'external-file2' ...'external-filen');` 语法解释：`fileref` 是任何不超过 8 个字符的 SAS 名称。`external-file`\
  \ 是外部文件的物理名称。物理名称是操作系统识别的名称。\n\n注意：所有文件规范都必须包含在括号内。当在 `INFILE` 语句中指定文件引用时，所引用的每个原始文件都可以使用\
  \ `INPUT` 语句顺序读取到数据。提示：如果你不熟悉原始文件的内容和结构，可以使用 `PROC FIST` 查看它们。\n\n## 示例\n在下面的程序中，`FILENAME`\
  \ 语句创建了文件引用 `Qtr1`，它引用了原始文件 `Month1.dat`、`Month2.dat` 和 `Month3.dat`。这些文件存储在 Windows\
  \ 操作系统的 `C:\\Sasuser` 目录下。在 `DATA` 步骤中，`INFILE` 语句标识文件引用，`INPUT` 语句描述数据，就像 `Qtr1`\
  \ 引用了单个原始文件一样。\n\n```sas\nfilename qtr1 ('c:\\sasuser\\month1.dat''c:\\sasuser\\\
  month2.dat'\n               'c:\\sasuser\\month3.dat');\ndata work.firstqtr;\n \
  \  infile qtr1;\n   input Flight $ Origin $ Dest\n         Date : date9\\. RevCargo\
  \ : comma15.;\nrun;\n```\n\n表 14.1 原始文件 Month1.dat（前五记录）\n\n|  \n\n\n\n\n\n```\n\
  ----+----10---+----20---+----30---+----40 \nIA10200 SYD HKG 01JAN2000 $191,187.00\
  \ \nIA10201 SYD HKG 01JAN2000 $169,653.00 \nIA10300 SYD CBR 01JAN2000 $850.00 \n\
  IA10301 SYD CBR 01JAN2000 $970.00 \nIA10302 SYD CBR 01JAN2000 $1,030.00\n```\n\n\
  表 14.2 原始数据文件 `Month2.dat`（前五记录）\n\n```\n----+----10---+----20---+----30---+----40\
  \ \nIA10200 SYD HKG 01FEB2000 $177,801.00 \nIA10201 SYD HKG 01FEB2000 $174,891.00\
  \ \nIA10300 SYD CBR 01FEB2000 $1,070.00 \nIA10301 SYD CBR 01FEB2000 $1,310.00 \n\
  IA10302 SYD CBR 01FEB2000 $850.00\n```\n\n表 14.3 原始数据文件 `Month3.dat`（前五记录）\n\n```\n\
  ----+----10---+----20---+----30---+----40 \nIA10200 SYD HKG 01MAR2000 $181,293.00\
  \ \nIA10201 SYD HKG 01MAR2000 $173,727.00 \nIA10300 SYD CBR 01MAR2000 $1,150.00\
  \ \nIA10301 SYD CBR 01MAR2000 $910.00 \nIA10302 SYD CBR 01MAR2000 $1,170.00 \n```\n\
  \nSAS 日志显示，`Qtr1` 引用的原始数据文件已顺序读取到 SAS 数据集 `Work.FirstQtr`。注意：三个原始数据文件的读取计数均为 50\
  \ 条记录。输出 SAS 数据集的写入计数为 150 个观测值。\n\n表 14.4 SAS 日志\n\n```\n9    filename qtr1 ('c:\\\
  sasuser\\month1.dat''c:\\sasuser\\month2.dat'\n10                  'c:\\sasuser\\\
  month3.dat');\n\n11   data work.firstqtr;\n12      infile qtr1;\n13      input Flight\
  \ $ Origin $ Dest $\n14      Date : date9\\. RevCargo : comma15.;\n15   run;\n\n\
  NOTE: The infile QTR1 is:\n      File Name=c:\\sasuser\\month1.dat,\n      File\
  \ List=('c:\\sasuser\\month1.dat' 'c:\\sasuser\\month2.dat' \n                 'c:\\\
  sasuser\\month3.dat'),\n      RECFM=V,LRECL=256\n\nNOTE: The infile QTR1 is:\n \
  \     File Name=c:\\sasuser\\month2.dat,\n      File List=('c:\\sasuser\\month1.dat'\
  \ 'c:\\sasuser\\month2.dat' \n                 'c:\\sasuser\\month3.dat'),\n   \
  \   RECFM=V,LRECL=256\n\nNOTE: The infile QTR1 is:\n      File Name=c:\\sasuser\\\
  month3.dat,\n      File List=('c:\\sasuser\\month1.dat' 'c:\\sasuser\\month2.dat'\
  \ \n                 'c:\\sasuser\\month3.dat'),\n      RECFM=V,LRECL=256\n\nNOTE:\
  \ 50 records were read from the infile QTR1.\n      The minimum record length was\
  \ 33.\n      The maximum record length was 37.\nNOTE: 50 records were read from\
  \ the infile QTR1.\n      The minimum record length was 33.\n      The maximum record\
  \ length was 37.\nNOTE: 50 records were read from the infile QTR1.\n      The minimum\
  \ record length was 33.\n      The maximum record length was 37.\nNOTE: The data\
  \ set WORK.FIRSTQTR has 150 observations \n      and 5 variables.\nNOTE: DATA statement\
  \ used (Total process time):\n      real time           4.02 seconds\n      cpu\
  \ time            0.93 seconds\n```\n\n以下 `PROC PRINT` 输出显示了 `Work.FirstQtr` 数据集中的部分观测值。\n\
  \n```\nproc print \n     data=work.firstqtr (firstobs=45 obs=55);\n     format date\
  \ date9\\. \n            revcargo dollar11.2;\nrun;\n```\n\n![Work,FirstQtr Data\
  \ Set](img/m55-2-g2.png)\n\n# 使用 FILEVAR= \n\n## 概述\n\n你可以通过使用带有 `FILEVAR=` 选项的\
  \ `INFILE` 语句，使合并原始数据的过程更加灵活。`FILEVAR=` 选项允许你动态地更改当前打开的输入文件。\n\n### 带有 FILEVAR=\
  \ 选项的通用 INFILE 语句\n\n当使用带有 `FILEVAR=` 选项的 `INFILE` 语句时，指定的文件是一个占位符，而不是实际文件名。该变量值的更改会导致\
  \ `INFILE` 语句关闭当前输入文件并打开一个新的输入文件。与自动变量一样，该变量不会写入数据集。\n\n## 示例\n\n假设你想创建一个包含三个月原始数据文件数据的\
  \ SAS 数据集。这三个月是当前月份以及前两个月![certpgadv/images/m55-5-g1.png]。在接下来的 `INFILE` 语句中，`Temp`\
  \ 是任意命名的占位符，而不是实际文件名。`FILEVAR=` 变量 `Nextfile` 包含要读取的原始文件名（例如 `Month9.dat`、`Month10.dat`\
  \ 或 `Month11.dat`）。由于程序尚未完成，因此没有包含 `RUN` 语句。\n\n```\ndata work.quarter;\n   infile\
  \ temp filevar=nextfile;\n   input Flight $ Origin $ Dest\n         Date : date9\\\
  . RevCargo : comma15.;\n```\n\n表 14.5 原始数据文件 `Month9.dat`（前五记录）\n\n```\n----+----10---+----20---+----30---+----40\
  \ \nIA10200 SYD HKG 01SEP2000 $189,441.00 \nIA10201 SYD HKG 01SEP2000 $175,473.00\
  \ \nIA10300 SYD CBR 01SEP2000 $1,370.00 \nIA10301 SYD CBR 01SEP2000 $710.00 \nIA10302\
  \ SYD CBR 01SEP2000 $1,210.00\n```\n\n表 14.6 原始数据文件 `Month10.dat`（前五记录）\n\n```\n\
  ----+----10---+----20---+----30---+----40 \nIA10200 SYD HKG 01OCT2000 $182,457.00\
  \ \nIA10201 SYD HKG 01OCT2000 $160,923.00 \nIA10300 SYD CBR 01OCT2000 $1,030.00\
  \ \nIA10301 SYD CBR 01OCT2000 $870.00 \nIA10302 SYD CBR 01OCT2000 $770.00\n```\n\
  \n表 14.7 原始数据文件 `Month11.dat`（前五记录）\n\n```\n----+----10---+----20---+----30---+----40\
  \ \nIA10200 SYD HKG 01NOV2000 $176,637.00 \nIA10201 SYD HKG 01NOV2000 $164,997.00\
  \ \nIA10300 SYD CBR 01NOV2000 $1,230.00 \nIA10301 SYD CBR 01NOV2000 $1,230.00 \n\
  IA10302 SYD CBR 01NOV2000 $790.00\n```\n\n注意：你也可以使用多个 `INFILE` 语句或操作系统技术来合并原始数据文件。本章仅讨论\
  \ `FILENAME` 语句和带有 `FILEVAR=` 选项的 `INFILE` 语句。\n\n## 分配要读取的文件名\n\n下一步是将要读取的三个文件名赋值给变量\
  \ `Nextfile`：\n\n```\n data work.quarter;\n    infile temp filevar=nextfile;\n \
  \   input Flight $ Origin $ Dest \n          Date : date9\\. RevCargo : comma15.;\n\
  ```\n\n在这种情况下，使用原始数据文件 `Month9.dat`、`Month10.dat` 和 `Month11.dat`。注意原始数据文件的标题非常相似。它们都以“Month”开头，后面跟着数字和文件扩展名\
  \ .dat：\n\n* `Month9.dat`\n* `Month10.dat`\n* `Month11.dat`\n\n你可以使用迭代 `DO` 循环和\
  \ `PUT` 函数来自动更改赋值给 `Nextfile` 的值。\n\n## 示例\n\n在以下代码中，`DO` 语句创建索引变量 `Month` 并将其赋值为\
  \ 9、10 和 11。赋值语句随后使用 `Month` 的当前值和 `PUT` 函数将原始数据文件名赋值给 `Nextfile`。`PUT` 函数将 `Month`\
  \ 的数值值转换为长度为 2 的文本值。`Month9.dat`、`Month10.dat` 和 `Month11.dat` 存储在 Windows 环境下的\
  \ `C:\\Sasuser` 目录下。在赋值语句的右侧，文本字符串 `c:\\sasuser\\month` 使用双感叹号（!!）连接运算符与 `Month`\
  \ 的当前值连接。然后将 `c:\\sasuser\\monthMonth` 与文本字符串 `.dat` 连接。\n\n```\ndata work.quarter;\n\
  \   do Month = 9, 10, 11;\n      nextfile=\"c:\\sasuser\\month\"\n             \
  \  !!put(Month,2.)!!\".dat\";\n      infile temp filevar=nextfile;\n      input\
  \ Flight $ Origin $ Dest \n            Date : date9\\. RevCargo : comma15.;\n  \
  \ end;\n```\n\n下表显示了当 `Month` 值变化时 `Nextfile` 的值。\n\n| 当 Month= | Nextfile= |\n\
  | --- | --- |\n| 9 | `c:\\sasuser\\Month 9.dat` |\n| 10 | `c:\\sasuser\\Month10.dat`\
  \ |\n| 11 | `c:\\sasuser\\Month11.dat` |\n\n\n\n\n\n提示：取决于键盘上可用的字符，你用作连接符的符号可以是双竖线\
  \ (`||`)、双断开竖线 (`¦¦`) 或双双感叹号 (`!!`)。\n\n## 使用 `COMPRESS` 函数\n\n注意 `c:\\sasuser\\\
  month 9.dat` 中 `Month` 和 `9` 之间的空格。你可以使用 `COMPRESS` 函数来消除该空格。\n\n| 当 Month= | Nextfile=\
  \ |\n| --- | --- |\n| 9 | c:\\sasuser\\Month 9.dat |\n| 10 | c:\\sasuser\\Month10.dat\
  \ |\n| 11 | c:\\sasuser\\Month11.dat |\n\n`COMPRESS` 函数的标准形式：`COMPRESS(source, <characters-to-remove>);`\
  \ \n以下是语法的解释：\n`source` 指定包含要删除字符的源字符串。`characters-to-remove` 指定 SAS 从源字符串中删除的字符或字符。\n\
  \n注意：如果省略 `characters-to-remove` 的值，`COMPRESS` 函数将删除源字符串中的空格。\n\n## 示例\n\n在以下代码中，`COMPRESS`\
  \ 函数删除了 `Nextfile` 值中的空格：\n\n```\ndata work.quarter;\n   do Month = 9, 10, 11;\n\
  \      nextfile=\"c:\\sasuser\\month\"!!put(Month,2.)!!\".dat\";\n      nextfile=compress\
  \ (nextfile,' ');\n      infile temp filevar=nextfile;\n      input Flight $ Origin\
  \ $ Dest $ \n            Date : date9\\. RevCargo : comma15.;\n      end;\n```\n\
  \n`COMPRESS` 函数可以与赋值语句结合以提高效率：\n\n```\ndata work.quarter;\n   do Month = 9, 10,\
  \ 11;\n      nextfile=\"c:\\sasuser\\month\"!!compress(put(Month,2.)!!\".dat\",'\
  \ ');\n      infile temp filevar=nextfile;\n      input Flight $ Origin $ Dest $\
  \ \n            Date : date9\\. RevCargo : comma15.;\n      end;\n```\n\n加上 `COMPRESS`\
  \ 函数后，当 `Month` 的值等于 9 时，`Nextfile` 被赋予正确的值 `c:\\sasuser\\month9.dat`。\n\n| 当 Month=\
  \ | Nextfile= |\n| --- | --- |\n| 9 | c:\\sasuser\\Month9.dat |\n| 10 | c:\\sasuser\\\
  Month10.dat |\n| 11 | c:\\sasuser\\Month11.dat |\n\n`DO` 循环中的 `OUTPUT` 语句将每个观测值输出到\
  \ SAS 数据集 `Work.Quarter`。`STOP` 语句防止 `DATA` 步出现无限循环。\n\n```\ndata work.quarter;\n\
  \   do Month = 9, 10, 11;\n      nextfile=\"c:\\sasuser\\month\"\n             \
  \  !!compress(put(Month,2.)!!\".dat\",' ');\n      infile temp filevar=nextfile;\n\
  \      input Flight $ Origin $ Dest $ Date : date9.\n            RevCargo : comma15.;\n\
  \      output;\n   end;\n   stop;\n```\n\n程序几乎已完成。\n\n## 使用 `END=` 选项\n\n当你读取到输入文件的最后一行之后时，`DATA`\
  \ 步通常会停止处理。在这个示例中，我们正在读取三个原始数据文件。我们不能读取超过前两个文件的最后记录，因为这会导致 `DATA` 步提前停止处理。你可以使用\
  \ `INFILE` 语句中的 `END=` 选项来确定何时读取到最后一个原始数据文件的最后记录。\n\n带有 `END=` 选项的 `INFILE` 语句的标准形式：`INFILE\
  \ file-specification END=variable;`\n以下是语法的解释：\n`variable` 是一个 SAS 设置为以下值的变量：\n\
  * 当当前输入数据记录不是输入文件的最后记录时，值为 0 (假)\n* 当当前输入记录是输入文件的最后记录时，值为 1 (真)\n\n注意：与自动变量一样，`END=`\
  \ 不会写入 SAS 数据集。你可以测试 `END=` 的值来判断 `DATA` 步是否应该继续处理。\n\n## 示例\n\n`END=` 变量 `Lastobs`\
  \ 在 `INFILE` 语句中创建。`DO UNTIL` 语句条件执行，直到 `Lastobs` 的值等于 1 (真)。`RUN` 语句完成程序。\n\n```\n\
  data work.quarter; \n   do Month = 9, 10, 11; \n   nextfile=\"c:\\sasuser\\month\"\
  \n            !!compress(put(Month,2.)!!\".dat\",' ');\n         do until (lastobs);\
  \ \n         infile temp filevar=nextfile end=lastobs;\n         input Flight $\
  \ Origin $ Dest $ Date : date9.\n               RevCargo : comma15.;\n         output;\n\
  \      end;\n   end;\n   stop;\nrun;\n```\n\n`PROC PRINT` 输出显示了 SAS 数据集 `Work.Quarter`\
  \ 中的部分观测值。注意变量 `Nextfile` 和 `Lastobs` 并没有写入数据集中。\n\n```\n proc print \n     data=work.quarter\
  \ \n     (firstobs=45 obs=55);\n     format date date9\\. \n          revcargo dollar11.2;\n\
  run;\n```\n\n![Work.Quarter Data Set](img/m55-8-g1.png)\n\n\n\n\n\n```sas\ndata\
  \ work.quarter (drop=monthnum midmon lastmon);\n   monthnum=month(today());\n  \
  \ midmon=month(intnx('month',today(),-1));\n   lastmon=month(intnx('month',today(),-2));\n\
  \   do Month = monthnum, midmon, lastmon;\n      nextfile=\"c:\\sas\\month\"!!compress(put(Month,2.)!!\"\
  .dat\",' ');\n      do until (lastobs); \n         infile temp filevar=nextfile\
  \ end=lastobs;\n         input Flight $ Origin $ Dest $ Date : date9.\n        \
  \       RevCargo : comma15.;\n         output;\n      end;\n   end;\n   stop;\n\
  run;\n```\n\n| ![Values Assigned to the Monthnum, Midmon, and Lastmon Variables](img/m55-14-g3.png)\
  \ |\n\n以下 `PROC PRINT` 输出显示了 `Work.Quarter` 中部分观测值。\n\n```sas\nproc print data=work.quarter\
  \ \n           (firstobs=45 obs=55);\n   format date date9\\. \n          revcargo\
  \ dollar11.2;\nrun;\n```\n\n| ![Work.Quarter Data Set](img/m55-14-g1.png) |\n\n\
  # 追加 SAS 数据集\n\n## 概述\n\n现在你已经学习了合并原始数据文件的几种方法，请使用 `APPEND` 过程来合并两个 SAS 数据集。\n\n\
  通用格式 `PROC APPEND`：`PROC APPEND BASE=SAS-data-set DATA=SAS-data-set;RUN;` \n\n以下是对语法的解释：\n\
  - `BASE=SAS-data-set`：指定你想要添加观测值的数据集。\n- `DATA=SAS-data-set`：包含观测值的 SAS 数据集，这些观测值将追加到\
  \ `BASE=` 数据集的末尾。\n\n`PROC APPEND` 只读取 `DATA=` SAS 数据集中的数据，而不读取 `BASE=` SAS 数据集。因此，此操作非常高效。即使\
  \ `BASE=` 数据集中可能存在 `DATA=` 数据集中不存在的变量，`PROC APPEND` 也会执行数据集合并。当 `BASE=` 数据集包含的变量比\
  \ `DATA=` 数据集多时，对于从 `DATA=` 数据集中读入的观测值，额外的变量将被赋予缺失值，并在 SAS 日志中写入警告信息。\n\n## 示例\n\
  \nSAS 数据集 `Work.Cap2001` 和 `Work.Capacity` 都包含以下变量：`Cap1st`、`CapBusiness`、`CapEcon`、`Dest`、`FlightID`、`Origin`\
  \ 和 `RouteID`。但是，`BASE=` 数据集（`Work.Cap2001`）包含一个 `DATA=` 数据集（`Work.Capacity`）未包含的额外变量\
  \ `Date`。当提交以下程序时，SAS 日志显示 `DATA=` 文件未找到变量 `Date`。\n\n```sas\nproc append base=work.cap2001\
  \ \n            data=work.capacity;\nrun;\n```\n\n表 14.8 SAS 日志\n\n```sas\nNOTE:\
  \ Appending WORK.CAPACITY to WORK.CAP2001.\nWARNING: Variable Date was not found\
  \ on DATA file.\nNOTE: There were 50 observations read from the data set WORK.CAPACITY.\n\
  NOTE: 50 observations added.\nNOTE: The data set WORK.CAP2001 has 100 observations\
  \ and 8 variables.\nNOTE: PROCEDURE APPEND used (Total process time):\n```\n\n追加后的\
  \ `Work.Cap2001` 的 `PROC PRINT` 输出显示，对于从 `DATA=` 数据集中读入的观测值，`Date` 已被赋值为缺失值。\n\n\
  ```sas\nproc print data=work.cap2001 \n           (firstobs=45 obs=55);\nrun;\n\
  ```\n\n| ![Work.Cap2001 Data Set](img/18-g1.png) |\n\n注意：你也可以使用 `DATA` 步中的 `SET`\
  \ 语句来合并数据。如果 `SET` 语句中出现多个数据集名称，输出数据集将是所有数据集的合并。与 `APPEND` 过程不同，`DATA` 步中的 `SET`\
  \ 语句会读取所有数据集的观测值以进行合并。因此，`APPEND` 过程只读取 `DATA=` 数据集的数据，在合并数据集时更高效。在以下程序中，SAS 读取了\
  \ `Work.Cap2001` 的所有观测值，然后读取了 `Work.Capacity` 的所有观测值。\n\n```sas\ndata work.new;\n\
  \   set work.cap2001 work.capacity;\nrun;\n```\n\n注意：你还可以使用 `SQL` 过程垂直合并数据。关于使用\
  \ `SQL` 过程垂直合并数据的信息，请参阅垂直合并表格。\n\n## 使用 FORCE 选项\n\n在上例中，`DATA=` 数据集（`Work.Capacity`）的变量少于\
  \ `BASE=` 数据集（`Work.Cap201`）。然而，当 `DATA=` 数据集的变量多于 `BASE=` 数据集时，可能需要追加。当 `DATA=`\
  \ 数据集包含 `BASE=` 数据集中不存在的变量时，必须在 `APPEND` 过程中使用 `FORCE` 选项来合并数据集。\n\n带有 `FORCE` 选项的\
  \ `PROC APPEND` 通用格式：`PROC APPEND BASE=SAS-data-set DATA=SAS-data-set FORCE>`\n\n\
  注意：`FORCE` 选项会导致数据丢失。\n\n## 示例\n\n在上例中，`DATA=` 数据集（`Work.Capacity`）的变量少于 `BASE=`\
  \ 数据集（`Work.Cap201`）。然而，当 `DATA=` 数据集的变量多于 `BASE=` 数据集时，可能需要追加。记住 SAS 数据集 `Work.Cap201`\
  \ 和 `Work.Capacity` 都包含以下变量：`Cap1st`、`CapBusiness`、`CapEcon`、`Dest`、`FlightID`、`Origin`\
  \ 和 `RouteID`。在这种情况下，`BASE=` 数据集包含一个 `DATA=` 集中没有变量 `Date`。提交以下程序时，SAS 日志显示未找到 `Date`\
  \ 而未追加数据集。\n\n```sas\nproc append base=work.capacity \n            data=work.cap201;\n\
  run;\n```\n\n表 14.9 SAS 日志\n\n```sas\nNOTE: Appending WORK.CAPACITY to WORK.CAP2001.\n\
  WARNING: Variable Date was not found in BASE set.\nNOTE: data sets were not appended\
  \ because of above.\n```\n\n在 `PROC APPEND` 中使用 `FORCE` 选项时，SAS 日志显示从 `DATA=` 数据集中读取了观测值，但发生了删除或截断。\n\
  \n```sas\nproc append base=work.capacity\n            data=work.cap201 force;\n\
  run;\n```\n\n表 14.10 SAS 日志\n\n```sas\nNOTE: Appending WORK.CAPACITY to WORK.CAP2001.\n\
  WARNING: Variable Date was not found on BASE file.\nNOTE: FORCE is specified, so\
  \ dropping/truncating will occur.\nNOTE: There were 50 observations read from the\
  \ data set WORK.CAPACITY.\nNOTE: 50 observations added.\nNOTE: The data set WORK.CAPACITY\
  \ has 100 observations and 7 variables.\nNOTE: PROCEDURE APPEND used (Total process\
  \ time):\n      real time 0.03 seconds\n      cpu time 0.03 seconds\n```\n\n`PROC\
  \ PRINT` 输出显示变量 `Date` 已从 `Work.Capacity` 的追加版本中删除。\n\n```sas\nproc print data=work.capacity\
  \ \n     (firstobs=45 obs=55);\nrun;\n```\n\n| ![Work.Capacity Data Set](img/m55-19-g1.png)\
  \ |\n\n## 追加不同长度的变量\n\n如果 `DATA=` 数据集中包含的变量长度大于 `BASE=` 数据集中同名的变量，则必须在 `PROC APPEND`\
  \ 中使用 `FORCE` 选项。使用 `FORCE` 选项允许你追加数据集，但 `DATA=` 变量的值可能会被截断。\n\n## 示例\n\n在 SAS 数据集\
  \ `Work.Acities` 中，变量 `City` 的长度为 22。在 SAS 数据集 `Work.WestAust` 中，`City` 的长度为 50。你可以使用\
  \ `CONTENTS` 过程查看每个数据变量的属性。\n\n```sas\nproc contents data=work.acities;\nrun;\n\
  ```\n\n| ![Work.Acities Data Set](img/m55-20-g1.png) |\n\n```sas\nproc contents\
  \ data=work.westaust;\nrun;\n```\n\n| ![Work.WestAust Data Set](img/m55-20-g2.png)\
  \ |\n\n当提交以下程序时，SAS 日志显示由于 `BASE=` 和 `DATA=` 数据集中 `City` 的长度不同，未追加数据集。\n\n```sas\n\
  proc append base=work.acities \n            data=work.westaust;\nrun;\n```\n\n\n\
  \n\n\n```\nNOTE: Appending WORK.WESTAUST to WORK.ACITIES.\nWARNING: Variable City\
  \ has different lengths on BASE and\n         DATA files (BASE 22 DATA 50).\nERROR:\
  \ No appending done because of anomalies listed above.\n       Use FORCE option\
  \ to append these files.\nNOTE: 0 observations added.\nNOTE: The data set WORK.ACITIES\
  \ has 50 observations and 4 variables.\nNOTE: Statements not processed because of\
  \ errors noted above.\nNOTE: PROCEDURE APPEND used (Total process time):\n     \
  \ real time           1.44 seconds\n      cpu time            0.06 seconds\nNOTE:\
  \ The SAS System stopped processing this step because of errors.\n```\n\n当使用 `FORCE`\
  \ 选项时，SAS 日志显示数据集已追加，但发生了丢弃或截断。\n\n```\nproc append base=work.acities \n       \
  \     data=work.westaust force;\nrun;\n```\n\n表 14.12 SAS 日志\n\n```\nNOTE: Appending\
  \ WORK.WESTAUST to WORK.ACITIES.\nWARNING: Variable City has different lengths on\
  \ BASE and DATA files\n         (BASE 22 DATA 50).\nNOTE: FORCE is specified, so\
  \ dropping/truncating will occur.\nNOTE: There were 50 observations read from the\
  \ data set WORK.WESTAUST.\nNOTE: 50 observations added.\nNOTE: The data set WORK.ACITIES\
  \ has 100 observations and 4 variables.\nNOTE: PROCEDURE APPEND used (Total process\
  \ time):\n      real time           1.44 seconds\n      cpu time            0.06\
  \ seconds\n```\n\n`Work.Acities` 追加版本的 `PROC CONTENTS` 输出显示，变量 `City` 保留了来自 `BASE=`\
  \ 数据集的长度 22。此外，请注意变量 `Code` 保留了来自 `BASE=` 数据集的标签 `Start Point`。\n\n``````\nproc\
  \ contents \n     data=work.acities;\nrun;\n```\n\n![Work.Acities 数据集](img/m55-20-g3.png)\n\
  \n`PROC PRINT` 输出显示，在 `Work.Acities` 追加版本中，`City` 的某些值被截断了。\n\n```\nproc print \n\
  \     data=work.acities \n          (firstobs=45 obs=55);\nrun;\n```\n\n![Work.Acities\
  \ 数据集](img/m55-20-g4.png)\n\n## 追加不同类型的变量\n\n如果 `DATA=` 数据集中包含的变量与 `BASE=` 数据集中对应变量的类型不同，则在使用\
  \ `PROC APPEND` 时必须使用 `FORCE` 选项。使用 `FORCE` 选项允许你追加数据集。然而，对于类型不匹配的变量，`DATA=` 变量将被赋值缺失值。\n\
  \n## 示例\n\n在 SAS 数据集 `Work.Allemps` 中，变量 `Phone` 是字符变量。在 SAS 数据集 `Work.Newemps`\
  \ 中，`Phone` 是数值变量。你可以使用 `PROC CONTENTS` 查看每个数据变量的属性。\n\n```\nproc contents data=work.allemps;\n\
  run;\n```\n\n![Work.Allemps 数据集](img/m55-21-g2.png)\n\n```\nproc contents data=work.newemps;\n\
  run;\n```\n\n![Work.Newemps 数据集](img/m55-21-g1.png)\n\n当提交以下程序时，SAS 日志显示变量 `Phone`\
  \ 类型不匹配，且数据集未追加。\n\n```\nproc append base=work.allemps \n            data=work.newemps;\n\
  run;\n```\n\n表 14.13 SAS 日志\n\n```\nNOTE: Appending WORK.NEWEMPS to WORK.ALLEMPS.\n\
  WARNING: Variable Phone not appended because of type mismatch.\nERROR: No appending\
  \ done because of anomalies listed above.\n       Use FORCE option to append these\
  \ files.\nNOTE: 0 observations added.\nNOTE: The data set WORK.ALLEMPS has 550 observations\
  \ and 5 variables.\nNOTE: Statements not processed because of errors noted above.\n\
  NOTE: PROCEDURE APPEND used (Total process time):\n      real time           0.08\
  \ seconds    \n      cpu time            0.01 seconds\nNOTE: The SAS System stopped\
  \ processing this step because of errors.\n```\n\n当使用 `FORCE` 选项时，SAS 日志显示数据集已追加，但由于类型不匹配，变量\
  \ `Phone` 未被追加。\n\n```\nproc append base=work.allemps \n            data=work.newemps\
  \ force;\nrun;\n```\n\n表 14.14 SAS 日志\n\n```\nNOTE: Appending WORK.NEWEMPS to WORK.ALLEMPS.\n\
  WARNING: Variable Phone not appended because of type mismatch.\nNOTE: FORCE is specified,\
  \ so dropping/truncating will occur.\nNOTE: There were 19 observations read from\
  \ the data set WORK.NEWEMPS.\nNOTE: 19 observations added.\nNOTE: The data set WORK.ALLEMPS\
  \ has 569 observations and 5 variables.\nNOTE: PROCEDURE APPEND used (Total process\
  \ time):\n      real time           0.05 seconds\n      cpu time            0.02\
  \ seconds\n```\n\n`Work.Allemps` 追加版本的 `PROC CONTENTS` 输出显示，变量 `Phone` 保留了来自 `BASE=`\
  \ 数据集的字符类型。\n\n```\nproc contents \n     data=work.allemps;\nrun;\n```\n\n![Work.Allemps\
  \ 数据集](img/m55-21.png)\n\n`Work.Acities` 追加版本的 `PROC PRINT` 输出显示，`BASE=` 数据集中 `City`\
  \ 的值是缺失的。\n\n```\nproc print \n     data=work.acities \n          (firstobs=45);\n\
  ```\n\n![Work.Acities 数据集](img/m55-24.png)\n\n### 附加功能\n\n除了本章讨论的追加数据集的方法外，你还可以使用数据集或外部文件来追加数据集。\n\
  \n## 将文件名存储在数据集中\n\n在以下程序中，`Route1.dat`、`Route2.dat`、`Route3.dat`、`Route4.dat` 和\
  \ `Route5.dat` 被追加以创建数据集 `Work.NewRoute`。这些文件名存储在 `Sasuser` 数据集中，并使用 `SET` 语句引用。`FILEVAR=`\
  \ 变量是从 `Rawdata` 读取的变量名。\n\n```sas\ndata newroute;\n  set sasuser.rawdata;\n  infile\
  \ filevar=readit end=lastfile;\n  do while(lastfile = 0);       \n    input  @1\
  \ RouteID $7. @8 Origin $3. @11 Dest $3. \n           @14 Distance 5. @19 Fare1st\
  \ 4. \n           @23 FareBusiness 4. @27 Farecon 4. \n           @31 FareCargo\
  \ 5.;\t         \n    output;\n  end;\nrun;\n```\n\n![Sasuser.Rawdata 数据集](img/m55-25.png)\n\
  \n## 将文件名存储在外部文件中\n\n在以下程序中，`Route1.dat`、`Route2.dat`、`Route3.dat`、`Route4.dat`\
  \ 和 `Route5.dat` 也被追加以创建数据集 `Work.NewRoute`。在本例中，数据集文件名存储在外部文件 `Rawdatafiles.dat`\
  \ 中，该文件在第一个 `INFILE` 语句中引用。`FILEVAR=` 变量 `readit` 是从 `Rawdatafiles` 读取的变量。`readit`\
  \ 的值为要读取的文件名。\n\n表 14.15 原始文件 Rawdatafiles.dat\n\n```\n1---+----10---+----20\nroute1.dat\
  \  \nroute2.dat  \nroute3.dat   \nroute4.dat   \nroute5.dat\n```\n\n```sas\ndata\
  \ newroute;\n   infile 'rawdatafiles.dat';\n   input readit $10.;\n   infile filevar=readit\
  \ end=lastfile;\n   do while(lastfile = 0);       \n      input  @1 RouteID $7.\
  \ @8 Origin $3. @11 Dest $3. \n             @14 Distance 5. @19 Fare1st 4. \n  \
  \           @23 FareBusiness 4. @27 Farecon 4. \n             @31 FareCargo 5.;\t\
  \         \n      output;\n   end;\nrun;\n```\n\n## 总结\n\n### 使用 FILENAME 语句\n\n\
  你可以通过为要合并的所有原始文件分配单个引用来使用 `FILENAME` 语句追加原始文件。当在 `INFILE` 语句中指定引用时，可以使用 `INPUT`\
  \ 语句顺序读取引用的每个原始文件到数据集。\n\n### 使用 INFILE 语句\n\n\n\n\n\n通过使用带有 `FILEVAR=`选项的 `INFILE`\
  \ 语句，可以让原始数据文件的合并过程更加灵活。`FILEVAR=`选项允许你动态地将当前打开的输入文件更改新的输入文件。当 `INFILE` 语句执行时，它从\
  \ `FILEVAR=` 变量指定的文件读取数据。\n\n在某些情况下，你可能需要使用 `COMPRESS` 函数来消除生成的文件名中的空格。当读取原始数据文件的最后一条记录时，`DATA`\
  \ 步通常会停止处理。当你合并原始数据文件时，你不希望在最后一条记录之后停止，直到到达最后一个输入文件的末尾。你可以通过 `INFILE` 语句的 `END=`\
  \ 选项来判断是否正在读取最后一个原始数据文件的最后一条记录。然后，你可以测试 `END=` 变量的值来确定 `DATA` 步是否应该继续处理。如果你正在处理与日期相关的数据，可以通过消除在\
  \ SAS 语句中包含显式月份数字的需求，使你的程序更具灵活性。要创建一个始终读取当前月及前两个月的程序，可以使用 `MONTH` 和 `TODAY` 函数获取今天日期的月份数，以开始滚动季度。在某些情况下，你可能需要结合\
  \ `TODAY` 和 `MONTH` 函数使用 `INTNX` 函数来正确确定月份。\n\n## 追加 SAS 数据集\n\n你可以使用 `PROC APPEND`\
  \ 来合并两个 SAS 数据集。`PROC APPEND` 只读取 `DATA=` SAS 数据集中的数据，而不读取 `BASE=` SAS 数据集中的数据。即使\
  \ `BASE=` 数据集中可能存在 `DATA=` 数据集中不存在的变量，`PROC APPEND` 也会对数据集进行合并。如果 `DATA=` 数据集包含以下特征的变量，则必须使用\
  \ `FORCE` 选项：\n\n* 它们不在 `BASE=` 数据集中。\n* 它们比 `BASE=` 数据集中的变量长。\n* 它们的类型与 `BASE=`\
  \ 数据集中的变量不同。\n\n使用 `FORCE` 选项可能会由于变量的截断或删除导致数据丢失。下表总结了使用 `FORCE` 选项的后果。\n\n| `DATA=`\
  \ 数据集中变量的特征 | 是否需要 FORCE | 使用 FORCE 选项的后果 |\n| --- | --- | --- |\n| 它们在 `BASE=`\
  \ 数据集中，但 `BASE=` 数据集的变量更多。 | 否 | 为额外的 `BASE=` 数据集变量分配缺失值。 |\n| 它们不在 `BASE=` 数据集中。\
  \ | 是 | 丢额外的 `DATA=` 数据集变量。 |\n| 它们比 `BASE=` 数据集中对应的变量长。 | 是 | `DATA=` 数据集的变量值可能会被截断。\
  \ |\n| 它们的类型与 `BASE=` 数据集中对应的变量不同。 | 是 | 为数据类型不匹配的 `DATA=` 数据集变量分配缺失值。 |\n\n## 其他功能\n\
  \n你还可以使用 SAS 数据集或包含要追加的原始数据文件名的外部文件来追加原始数据文件。\n\n## 示例程序\n\n### 使用 FILENAME 语句合并原始数据文件\n\
  \n```\nfilename qtr1 ('c:\\data\\month1.dat''c:\\data\\month2.dat\n            \
  \   'c:\\data\\month3.dat');\ndata work.firstqtr;         \n   infile qtr1;'\n \
  \  input Flight $ Origin $ Dest $   \n         Date : date9\\. RevCargo : comma15.;\n\
  run;\n```\n\n### 使用 INFILE 语句合并原始数据文件\n\n```\ndata quarter (drop=monthnum midmon\
  \ lastmon);\n   monthnum=month(today());\n   midmon=month(intnx('month',today(),-1));\n\
  \   lastmon=month(intnx('month',today(),-2));\n   do month = monthnum, midmon, lastmon;\
  \  \n      nextfile=\"c:\\sasuser\\month\"\n               !!compress(put(month,2.)!!\"\
  .dat\",' ');\n      do until (lastobs); \n         infile temp filevar=nextfile\
  \ end=lastobs; \n         input Flight $ Origin $ Dest $ Date : date9.\n       \
  \        RevCargo : comma15.;\n         output; \n      end; \n   end;  \n   stop;\
  \ \nrun;\n```\n\n### 使用 PROC APPEND 合并 SAS 数据集\n\n```\nproc append base=work.acities\n\
  \            data=work.airports force;\nrun;\n```\n\n## 注意事项\n\n* 当使用带有 `FILEVAR=`选项的\
  \ `INFILE` 语句时，文件规范只是一个占位符，而不是之前分配给文件的实际文件名或引用名（fileref）。\n* 与自动变量一样，`FILEVAR=`变量和\
  \ `END=`变量不会被写入数据集。\n* 在 `PROC APPEND` 中使用 `FORCE` 选项可能会由于变量的截断或删除导致数据丢失。\n* `BASE=`\
  \ 数据集的结构将用于追加的数据集。\n\n# 测验\n\n为每个问题选择最佳答案。完成测试后，使用附录中的答案键检查你的答案。\n\n1. 下列哪个语句将引用名\
