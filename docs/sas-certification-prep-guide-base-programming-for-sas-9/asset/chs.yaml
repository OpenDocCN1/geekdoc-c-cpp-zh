  \n10. 正确答案：c `PROC SQL` 可以执行此查询，但查询不会产生你想要的结果。如果你在包含 `HAVING` 子句的查询中省略了 `GROUP BY`\
  \ 子句，那么 `HAVING` 子句和任何汇总函数会将整个表视为一组。在没有 `GROUP BY` 子句的情况下，此示例中的 `HAVING` 子句计算的是整个表的平均循环次数（图书馆中的所有书籍），而不是每个组（每类书籍）的。输出要么包含表中的所有行（如果整个表的平均循环次数小于\
  \ 2500），要么不包含表中的任何行（如果整个表的平均循环次数大于 2500）。\n\n# 第 3 章：使用 PROC SQL 水平合并表\n\n1. 正确答案：a\
  \ 当在 `PROC SQL` 链接中未指定连接条件时，将返回笛卡尔积。在笛卡尔积中，第一表中的每一行都与第二个表中的每一行进行组合。\n\n2. 正确答案：b\
  \ 此 `PROC SQL` 查询是一个内连接（inner join）。它根据 `WHERE` 子句中指定的匹配标准，将第一表中与第二个表匹配的行组合在一起。列不会重叠，因此会显示所引用表中的所有列（包括任何重名列）。任一表中的任何未匹配的行都不会被显示。\n\
  \n3. 正确答案：d 此 `PROC SQL` 查询是一个右外连接（right outer join），它根据 `ON` 子句中的连接条件，检索跨表匹配的所有行，外加上右侧（第二个）表中不匹配的行。\n\
  \n4. 正确答案：d 编写 `PROC SQL` 内连接有两种有效格式。问题顶部显示的 `PROC SQL` 查询使用了第一种内连接格式，该格式没有使用关键字来指示连接类型。另一种格式类似于外连接，并使用了关键字\
  \ `INNER JOIN`。\n\n5. 正确答案：a 此 `PROC SQL` 查询是一个左外连接（left outer join），它检索跨表匹配的所有行（基于\
  \ `ON` 子句中的连接条件），外加上左侧（第一个）表中不匹配的行。列不会重叠，因此会显示两个表中的所有列。\n\n6. 正确答案：c 内连接根据 `WHERE`\
  \ 子句中的一个或多个连接条件，将第一表中与第二个表匹配的行组合在一起。被匹配的列必须具有相同的数据类型，但并不要求具有相同的名称。对于连接来说，被连接的表可以具有不同数量的列，且不需要进行排序。\n\
  \n7. 正确答案：a 与表不同，内联视图（in-line view）仅在查询执行期间存在。由于它是临时的，内联视图只能在定义它的查询中引用。\n\n8. 正确答案：c\
