  ## 第 11 章\n## 数字处理\n### 11.1 引言\n就像每种高级编程语言一样，C++ 提供了许多现成的子程序（函数），你可以随时随地根据需要使用它们。“子程序”简单来说是一组被封装成单个单元的语句。每个子程序都有一个描述性的名称，并执行特定的任务。\n\
  \n为了更好地理解 C++ 的函数，让我们看看海伦的迭代公式，该公式用于计算正数的平方根。\n\n.![Image](img/chapter11-01.png)\n\
  \n其中\n\n`y` 是你想要找到平方根的数字\n`x[n]` 是 `y` 的平方根的第 n 次迭代值\n\n你现在可能感到有点沮丧。你可能认为应该写一个程序来通过海伦公式计算一个数字的平方根，但事实并非如此！目前，没有人用这种方式计算数字的平方根。幸运的是，C++\
  \ 包含一个为此目的的函数！这个函数实际上是一个小的子程序，被命名为 `sqrt`，你只需要通过它的名称调用它，它就会为你完成工作。`sqrt` 函数可能使用了海伦迭代公式，也可能来自另一个古代或现代数学家的公式。事实是，你并不在乎！真正重要的是\
  \ `sqrt` 给了你正确的结果！示例所示。\n\n```cpp\n#include <iostream>\n#include <cmath>\nusing\
  \ namespace std;\nint main() {\n    double x, y;\n    cin >> x;\n    y = sqrt(x);\n\
  \    cout << y;\n    return 0;\n}\n```\n\n\n\n\n\n![](img/notice.jpg)函数 `sqrt()`\
  \ 定义在库 `cmath` 中。因此，为了使用函数 `sqrt()`，你必须在程序的开头使用语句 `#include <cmath>` 包含 `cmath`\
  \ 库。\n\n尽管 C++ 支持许多数学子程序（函数），但本章仅涵盖了那些对于本书的目的而言绝对必要的函数。不过，如果你需要更多信息，可以访问以下地址之一：\n\
  \n- [`tinyurl.com/2v2eadrf`](https://tinyurl.com/2v2eadrf)\n- [`cplusplus.com/reference/cmath/`](https://cplusplus.com/reference/cmath/)\n\
  \n.![Image](img/chapter11-02.png)\n\n![](img/notice.jpg)每当你需要执行数学计算时，就会使用数学子程序，例如寻找平方根、正弦、余弦、绝对值等。\n\
  \n### 11.2 有用的数学函数（子程序）以及\n\n### 绝对值\n\n`abs(number)`\n\n此函数返回 `number` 的绝对值。\n\n\
  #### 示例\n\n![](img/my_exercise_header.png) project_11.2a\n```cpp\n#include <iostream>\n\
  using namespace std;\nint main() {\n    int a, b;\n    a = -5;\n    b = abs(a);\n\
  \    cout << abs(a) << endl;     //它显示: 5\n    cout << b << endl;          //它显示:\
  \ 5\n    cout << abs(-5.2) << endl;  //它显示: 5.2\n    cout << abs(5.2) << endl; \
  \  //它显示: 5.2\n    return 0;\n}\n```\n\n### 圆周率\n\n`M_PI`\n\n这包含 $\\pi$ 的值。\n\n\
  ![](img/notice.jpg)注意 `M_PI` 是一个常量，而不是函数。这就是为什么没有使用括号。\n\n#### 示例\n\n![](img/my_exercise_header.png)\
  \ project_11.2b\n```cpp\n#include <iostream>\n#include <cmath>\nusing namespace\
  \ std;\nint main() {\n    cout << M_PI << endl;   //它显示: 3.14159\n    cout.precision(19);\
  \     //设置显示的最大数字位数\n    cout << M_PI << endl;   //它显示: 3.141592653589793116\n \
  \   return 0;\n}\n```\n\n![](img/notice.jpg)常量 `M_PI` 定义在库 `cmath` 中。它在 C++ 中无法直接访问，因此你需要包含\
  \ `cmath` 库。然而，在 Visual Studio Community 中，为了使用常量 `M_PI`，而不是包含 `cmath` 库，你需要在程序的开头使用语句\
  \ `#define _USE_MATH_DEFINES` 定义 `_USE_MATH_DEFINES`。\n\n![](img/notice.jpg)语句 `cout.precision(19)`\
  \ 将 `cout` 语句显示的最大数字位数设置为 19。\n\n### 正弦\n\n`sin(number)`\n\n此函数返回 `number` 的正弦。`number`\
  \ 的值必须以弧度表示。你可以乘以 `M_PI / 180` 将角度转换为弧度。\n\n#### 示例\n\n![](img/my_exercise_header.png)\
  \ project_11.2c\n```cpp\n#include <iostream>\n#include <cmath>\nusing namespace\
  \ std;\nint main() {\n    double a, b;\n    a = sin(3 * M_PI / 2);            //3π/2\
  \ 弧度的正弦\n    b = sin(270 * M_PI / 180);       //270 度的正弦\n    cout << a << \"  \"\
  \ << b << endl;    //它显示: -1  -1\n    return 0;\n}\n```\n\n![](img/notice.jpg)函数\
  \ `sin()` 定义在库 `cmath` 中。它在 C++ 中无法直接访问，因此你需要包含 `cmath` 库。\n\n### 余弦\n\n`cos(number)`\n\
  \n此函数返回 `number` 的余弦。`number` 的值必须以弧度表示。你可以乘以 `M_PI / 180` 将角度转换为弧度。\n\n#### 示例\n\
  \n![](img/my_exercise_header.png) project_11.2d\n```cpp\n#include <iostream>\n#include\
  \ <cmath>\nusing namespace std;\nint main() {\n    double a, b;\n    a = cos(2 *\
  \ M_PI);                //2π 弧度的余弦\n    b = cos(360 * M_PI / 180);       //360 度的余弦\n\
  \    cout << a << \"  \" << b << endl;    //它显示: 1  1\n    return 0;\n}\n```\n\n\
  ![](img/notice.jpg)函数 `cos()` 定义在库 `cmath` 中。它在 C++ 中无法直接访问，因此你需要包含 `cmath` 库。\n\
  \n### 正切\n\n`tan(number)`\n\n此函数返回 `number` 的正切。`number` 的值必须以弧度表示。你可以乘以 `M_PI /\
  \ 180` 将角度转换为弧度。\n\n#### 示例\n\n![](img/my_exercise_header.png) project_11.2e\n```cpp\n\
  #include <iostream>\n#include <cmath>\nusing namespace std;\nint main() {\n    double\
  \ a;\n    a = tan(10 * M_PI / 180);  //10 度的正切\n    cout << a << endl;         //它显示:\
  \ 0.176327\n    return 0;\n}\n```\n\n![](img/notice.jpg)函数 `tan()` 定义在库 `cmath`\
  \ 中。它在 C++ 中无法直接访问，因此你需要包含 `cmath` 库。\n\n### 字符串转整数\n\n`stoi(value)`\n\n此函数将整数的字符串表示转换为其数值等价物。\n\
  \n#### 示例\n\n![](img/my_exercise_header.png) project_11.2f\n```cpp\n#include <iostream>\n\
  using namespace std;\nint main() {\n    string s1 = \"5\";\n    string s2 = \"3\"\
  ;\n    int k;\n    k = stoi(s1);\n    cout << k << endl;             //它显示: 5\n\
  \    cout << stoi(s2) << endl;       //它显示: 3\n    cout << stoi(s1) + stoi(s2) <<\
  \ endl; //它显示: 8\n    return 0;\n}\n```\n\n### 字符串转实\n\n`stod(value)`\n\n此函数将实数的字符串表示转换为其数值等价物。\n\
  \n#### 示例\n\n![](img/my_exercise_header.png) project_11.2g\n```cpp\n#include <iostream>\n\
  using namespace std;\nint main() {\n    string s1 = \"6.5\";\n    string s2 = \"\
  3.4\";\n    double x;\n    x = stod(s1);\n    cout << x << endl;             //它显示:\
  \ 6.5\n    cout << stod(s2) << endl;       //它显示: 3.4\n    cout << stod(s1) + stod(s2)\
  \ << endl; //它显示: 9.9\n    return 0;\n}\n```\n\n### 整数值（类型转换）\n\n`(int)number`\n\
  \n这返回 `number` 的整数部分。如果 `number` 包含小数部分，该部分在转换过程中会丢失。\n\n#### 示例\n\n![](img/my_exercise_header.png)\
  \ project_11.2h\n```cpp\n#include <iostream>\nusing namespace std;\nint main() {\n\
  \    double a = 5.4;\n    cout << (int)a << endl;     //它显示: 5\n    cout << (int)3\
  \ << endl;     //它显示: 3\n    cout << (int)3.9 << endl;     //它显示: 3\n    cout <<\
  \ (int)-3.999 << endl;  //它显示: -3\n    return 0;\n}\n```\n\n![](img/notice.jpg)在计算机科学中，类型转换是将一种数据类型转换为另一种的方法。注意\
  \ `(int)` 不是函数。它只是在 C++ 中将实数转换为整数的方法。\n\n### 值（类型转换）\n\n`(double)number`\n\n这将数字作为实数返回。\n\
  \n#### 示例\n\n![](img/my_exercise_header.png) project_11.2i\n```cpp\n#include <iostream>\n\
  using namespace std;\nint main() {\n    int a = 5;\n    cout << a / 2 << endl; \
  \          //它显示: 2\n    cout << (double)a / 2 << endl;     //它显示: 2.5\n    cout\
  \ << (double)a / 2 << endl;     //它显示: 2.5\n    cout << a / (double)2 << endl; \
  \    //它显示: 2.5\n    cout << (double)a / (double)2 << endl; //它显示: 2.5\n    cout\
  \ << a / 2.0 << endl;           //它显示: 2.5\n    return 0;\n}\n```\n\n![](img/notice.jpg)在计算机科学中，类型转换是将一种数据类型转换为另一种的方法。注意\
  \ `(double)` 不是函数。它只是在 C++ 中将整数转换为实数（浮点）。\n\n### 幂\n\n`pow(number, exp)`\n\n此函数返回\
  \ `number` 的 `exp` 次幂的结果。\n\n#### 示例\n\n![](img/my_exercise_header.png) project_11.2j\n\
  ```cpp\n#include <iostream>\n#include <cmath>\nusing namespace std;\nint main()\
  \ {\n    double a, b, c;\n    a = 2;\n    b = 3;\n    cout << pow(a, b) << endl;\
  \  //它显示: 8\n    c = pow(3, 2);\n    cout << c << endl;      //它显示: 9\n    return\
  \ 0;\n}\n```\n\n![](img/notice.jpg)函数 `pow()` 定义在库 `cmath` 中。它在 C++ 中无法直接访问，因此你需要包含\
  \ `cmath` 库。\n\n### 随机\n\n`rand()`\n\n此函数返回一个 0 到 `RAND_MAX` 之间的伪随机整数，其中 `RAND_MAX`\
  \ 是值至少为 32767 的 C++ 常量。\n\n#### 示例\n\n\n\n\n\n![](img/my_exercise_header.png) project_11.2\n\
  \n```cpp\n#include <iostream>\n#include <cstdlib>\nusing namespace std;\nint main()\
  \ {\n    cout << rand() << endl;  //它显示一个 0 到 RAND_MAX 之间的随机整数\n    cout << rand()\
  \ << endl;  //它显示一个 0 到 RAND_MAX 之间的随机整数\n    cout << rand() << endl;  //它显示一个 0\
  \ 到 RAND_MAX 之间的随机整数\n    return 0;\n}\n```\n\n![](img/notice.jpg)函数 `rand()` 定义在\
  \ `cstdlib` 库中。它在 C++ 中无法被直接访问，因此你需要包含 `cstdlib` 库。\n\n![](img/notice.jpg)随机数在计算机游戏中被广泛使用。例如，“敌人”可能会在随机的时间出现或以随机的方向移动。此外，随机数还被用于仿真程序、统计程序、计算机安全中的数据加密等。\n\
  \n伪随机数看起来像是随机的，但实际上它们并不是！如果你执行之前的程序，你会发现每次执行它时，得到的都是完全相同的“随机”数序列。\n\n这就像拿了一副已经洗好的牌牌，按顺序取出第一张，然后是第二张，然后第三张……以此类推。然后你按照取牌前的顺序将牌放回牌堆中。接着你再次开始，按顺序取出第一张、第二张、第三张……以此类推。显然，这三张牌与你之前取出的牌是一样的。所以这里你需要的是在开始取牌之前总是将牌洗乱。\n\
  \n在 C++ 中，你需要做同样的操作。你需要“洗牌”。为了做到这一点，你可以在程序的开头使用 `srand(time(NULL))` 语句，如下例所示。\n\n\
  ![](img/my_exercise_header.png) project_11.2\n\n```cpp\n#include <iostream>\n#include\
  \ <ctime>\n#include <cstdlib>\nusing namespace std;\nint main() {\n    srand(time(NULL));\n\
  \    cout << rand() << endl;  //它显示一个 0 到 RAND_MAX 之间的随机整数\n    cout << rand() <<\
  \ endl;  //它显示一个 0 到 RAND_MAX 之间的随机整数\n    cout << rand() << endl;  //它显示一个 0 到\
  \ RAND_MAX 之间的随机整数\n    return 0;\n}\n```\n\n![](img/notice.jpg)函数 `time()` 定义在\
  \ `ctime` 库中。它在 C++ 中无法被直接访问，因此你需要包含 `ctime` 库。\n\n如果你想得到一个最小值和最大值之间的伪随机整数，可以使用以下模式：\n\
  \n`minimum + rand() % (maximum - minimum + 1)`\n\n![](img/my_exercise_header.png)\
  \ project_11.2m\n\n```cpp\n#include <iostream>\n#include <ctime>\n#include <cstdlib>\n\
  using namespace std;\nint main() {\n    srand(time(NULL));\n    cout << 2 + rand()\
  \ % (10 - 2 + 1) << endl;  //它显示一个 2 到 10 之间的随机整数\n    cout << 20 + rand() % 6 <<\
  \ endl;            //它显示一个 20 到 25 之间的随机整数\n    return 0;\n}\n```\n\n## 四舍舍入\n\n\
  `round(number)`\n\n该函数返回 `number` 最接近的整数。\n\n### 示例\n\n![](img/my_exercise_header.png)\
  \ project_11.2n\n\n```cpp\n#include <iostream>\n#include <cmath>\nusing namespace\
  \ std;\nint main() {\n    double a = 5.9;\n    cout << round(a) << endl;    //它显示:\
  \ 6\n    cout << round(5.4) << endl;  //它显示: 5\n    return 0;\n}\n```\n\n![](img/notice.jpg)函数\
  \ `round()` 定义在 `cmath` 库中。它在 C++ 中无法被直接访问，因此你需要包含 `cmath` 库。\n\n如果你需要将 `number`\
  \ 四舍五入到指定的精度，可以使用以下公式：\n\n`round(number * pow(10, precision)) / pow(10, precision)`\n\
  \n### 示例\n\n![](img/my_exercise_header.png) project_11.2o\n\n```cpp\n#include <iostream>\n\
  #include <cmath>\nusing namespace std;\nint main() {\n    double a, y;\n    a =\
  \ 5.312;\n    y = round(a * pow(10, 2)) / pow(10, 2);\n    cout << y << endl;  \
  \             //它显示: 5.31\n    a = 5.315;\n    y = round(a * pow(10, 2)) / pow(10,\
  \ 2);\n    cout << y << endl;               //它显示: 5.32\n    cout << round(2.3447\
  \ * pow(10, 3)) / pow(10, 3) << endl;  //它显示: 2.345\n    cout << round(2.3447 *\
  \ 1000) / 1000 << endl;              //它显示: 2.345\n    return 0;\n}\n```\n\n###\
  \ 平方\n\n`sqrt(number)`\n\n该函数返回 `number` 的平方根，其中 `number` 可以是正值或零。\n\n### 示例\n\n\
  ![](img/my_exercise_header.png) project_11.2p\n\n```cpp\n#include <iostream>\n#include\
  \ <cmath>\nusing namespace std;\nint main() {\n    double x, y;\n    cout << sqrt(9)\
  \ << endl;    //它显示: 3\n    cout << sqrt(2) << endl;    //它显示: 1.41421\n    cout.precision(17);\n\
  \    cout << sqrt(2) << endl;    //它显示: 1.4142135623730951\n    x = sqrt(8);\n \
  \   cout << x << endl;          //它显示: 2.8284271247461903\n    y = round(sqrt(8));\n\
  \    cout << y << endl;          //它显示: 3\n    return 0;\n}\n```\n\n![](img/notice.jpg)函数\
  \ `sqrt()` 定义在 `cmath` 库中。它在 C++ 中无法被直接访问，因此你需要包含 `cmath` 库。\n\n![](img/remember.jpg)语句\
  \ `cout.precision(17)` 将语句 `cout` 显示的最大数字位数设置为 17。\n\n![](img/notice.jpg)注意函数 `sqrt()`是如何嵌套在函数\
  \ `round()` 之中的。内层（嵌套）函数（或多个函数）的结果被用作外部函数的参数。这是大多数程序员倾向于遵循的编写风格，因为它有助于节省大量的代码行。当然，如果你嵌套了太多函数，没有人能理解你的代码。嵌套最多四层是可以接受的。\n\
  \n#### 练习 11.2-1 计算两点之间的距离\n\n编写一个 C++ 程序，提示用户输入两个点的坐标 (x, y)，然后计算它们之间的直线距离。所需的公式是\n\
  \n.![Image](img/chapter11-03.png)\n\n##### 答案\n\n在这个练习中，你需要使用函数 `sqrt()`，该函数返回一个数字的平方根。\n\
  \n为了简化操作，项 `(x[1] - x[2])²` 和 `(y[1] - y[2])²` 被逐别计算，并将结果赋值给两个临时变量。C++ 程序所示所示。\n\
  \n![](img/my_exercise_header.png) project_11.2-1a\n\n```cpp\n#include <iostream>\n\
  #include <cmath>\nusing namespace std;\nint main() {\n    double d, x1, x2, xTemp,\
  \ y1, y2, yTemp;\n    cout << \"Enter coordinates for point A:\" << endl;\n    cin\
  \ >> x1 >> y1;\n    cout << \"Enter coordinates for point B:\" << endl;\n    cin\
  \ >> x2 >> y2;\n    xTemp = pow(x1 - x2, 2);\n    yTemp = pow(y1 - y2, 2);\n   \
  \ d = sqrt(xTemp + yTemp);\n    cout << \"Distance between points: \" << d << endl;\n\
  \    return 0;\n}\n```\n\n现在，让我们看看另一种方法。实际上，在函数调用中执行所有操作是可能的。这样做，操作的结果将直接用作函数的参数。这是大多数程序员倾向于遵循的编写风格，因为它可以节省大量的变量和代码行。C++\
  \ 程序所示。\n\n![](img/my_exercise_header.png) project_11.2-1b\n\n```cpp\n#include <iostream>\n\
  #include <cmath>\nusing namespace std;\nint main() {\n    double d, x1, x2, y1,\
  \ y2;\n    cout << \"Enter coordinates for point A:\" << endl;\n    cin >> x1 >>\
  \ y1;\n    cout << \"Enter coordinates for point B:\" << endl;\n    cin >> x2 >>\
  \ y2;\n    d = sqrt(pow(x1 - x2, 2) + pow(y1 - y2, 2));\n    cout << \"Distance\
  \ between points: \" << d << endl;\n    return 0;\n}\n```\n\n![](img/remember.jpg)你可以将一个子程序嵌套在另一个程序中。注意\
  \ `pow()` 函数是如何嵌套在 `sqrt()` 函数中的。嵌套函数的结果被用作外部函数的参数。\n\n#### 练习 11.2-2 汽车行驶了多远？\n\
  \n汽车汽车从静止开始，沿直线道路以恒加速度运动指定的距离。编写一个 C++ 程序，提示用户输入加速度和汽车行驶距离，然后计算行驶的时间。所需的公式是\n\n\
  .![Image](img/chapter10-01.png)\n\n其中\n\n`S` 是汽车行驶的距离，单位为米 (m)，`u[0]` 是汽车的初速度（速度），单位为米/秒\
