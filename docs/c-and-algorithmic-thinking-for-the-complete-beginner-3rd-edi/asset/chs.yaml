  \ 3% |\n| $50 ≤ amount < $100 | 5% |\n| $100 ≤ amount | 10% |\n\n在每次折扣计算结束时，程序必须询问用户是否希望计算另一个金额的折扣。如果答案是“yes”，程序必须重复；否则结束。让你的程序能够接受所有可能形式的答案，如“yes”、“YES”、“Yes”\
  \ 甚至“YeS”。\n\n此外，使用循环控制结构，当用户为 `amount` 输入任何非正值时，程序必须验证数据输入并显示错误消息。\n\n### 42) LAV\
