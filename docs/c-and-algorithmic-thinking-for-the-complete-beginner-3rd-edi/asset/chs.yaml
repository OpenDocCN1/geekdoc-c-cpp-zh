  \ {\n    double x;\n    cin >> x;\n    cout << abs(x) << endl;\n    return 0;\n\
  }\n```\n\n### 16.2 复习题：判断对错\n\n对以下每个陈述判断对或错。\n\n\n\n\n\n## 第 17 章：双分支选择结构\n\n##\
  \ 单分支选择结构\n\n1) 当必须执行一组语句时，就会使用单分支选择结构。\n2) 你使用单分支选择结构是为了让其他程序员更容易理解你的程序。\n3) 单分支选择结构中包含的语句可能一个都不执行。\n\
  4) 在流程图中，`Decision`（决策）符号代表算法的开始和结束（判断点）。\n5) 下面的代码在语法上是正确的：\n```cpp\n#include <iostream>\n\
  using namespace std;\nconst int if = 5;\nint main() {\n    int x;\n    x = if +\
  \ 5;\n    cout << x << endl;\n    return 0;\n}\n```\n6) 单分支选择结构使用了保留关键字 `else`。\n\
  7) 下面的代码段满足确定性属性：\n```cpp\nif (b != 3) {\n    x = a / (b - 3);\n}\n```\n8) 下面的 C++\
  \ 程序满足确定性属性：\n```cpp\n#include <iostream>\nusing namespace std;\nint main() {\n\
  \    double a, b, x;\n    cin >> a >> b;\n    if (b != 3) {\n        x = a / (b\
  \ - 3);\n    }\n    cout << x << endl;\n    return 0;\n}\n```\n\n### 16.3 复习题：单选择\n\
  \n为下列每个陈述选择正确答案。\n\n1) 单分支选择结构用于：\na) 语句一个接一个地执行。\nb) 在执行某些语句之前必须做出决策。\nc) 以上都不是\n\
  d) 以上都是\n\n2) 单分支选择结构在以下哪个路径上包含一个语句或语句块：\na) 仅限假路径。\nb) 两条路径都是。\nc) 仅限真路径。\n\n3)\
  \ 在下面的代码段中：\n```cpp\nif (x == 3) x = 5;\ny++;\n```\n语句 `y++` 的执行情况：\na) 仅当变量 `x`\
  \ 的值为 3 时。\nb) 仅当变量 `x` 的值为 5 时。\nc) 仅当变量 `x` 的值不等于 3 时。\nd) 总是执行。\n\n4) 在下面的代码段中：\n\
  ```cpp\nif (x % 2 == 0) y++;\n```\n语句 `y++` 在什么情况下执行：\na) 变量 `x` 正好被 2 整除。\nb) 变量\
  \ `x` 包含一个偶数。\nc) 变量 `x` 不包含奇数。\nd) 以上都是\ne) 以上都不是\n\n5) 在下面的代码段中： \n```cpp\nx =\
  \ 3 * y;\nif (x > y) y++;\n```\n语句 `y++` 是：\na) 总是执行。\nb) 永远不执行。\nc) 仅当变量 `y` 包含正值时执行。\n\
  d) 以上都不是\n\n### 16.4 复习练习\n\n完成以下练习题。\n\n1) 识别下列 C++ 程序中的语法错误：\n```cpp\n#include\
