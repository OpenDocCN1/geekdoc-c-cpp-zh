  - **变量 `temp1`**：\n    - 在虚线矩形外部未初始化/更新；因此它不应传递给子程序。\n    - 在虚线矩形内初始化，但其值在外部未使用；因此它不应返回给调用者。\n\
  \    - 根据流程图，由于变量 `temp1` 既不需要传递也不需要返回，该变量可以仅仅作为子程序内部的局部变量。\n- **变量 `gender`**：\n\
  \    - 在虚线矩形外部未初始化/更新；因此它不应传递给子程序。\n    - 在虚线矩形内初始化，然后其值在外部被使用；因此它必须返回给调用者。\n\n\
  因此，由于必须向主代码返回一个值，可以使用所示所示函数。\n\n```cpp\n//First part\nstring getGender(int i) {\n\
