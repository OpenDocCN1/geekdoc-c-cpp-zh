  \n\n```cpp\nminimum = b[i][j];\n}\nif (b[i][j] > maximum) {\n    maximum = b[i][j];\n\
  }\n}\ncout << minimum << \"  \" << maximum << endl;\nreturn 0;\n```\n\n### 34.4\
  \ 数组排序\n\n排序算法是计算机科学中的重要课题。排序算法是将数组元素按特定顺序排列的算法。有很多排序算法，每种算法都有特定的优缺点。\n\n大多数排序算法通过比较数组中的元素来工作。它们通常根据效率和内存需求来评估。\n\
  \n排序算法有很多，其中一些包括：\n\n-   冒泡排序\n-   改进的冒泡排序\n-   选择排序\n-   插入排序\n-   堆排序\n-   归并排序\n\
  -   快速排序\n\n就效率而言，冒泡排序被认为是效率最低的，而列表中随后的每个算法都优于前一个。快速排序算法被认为是最好、最快的排序算法之一，特别是对于大规模数据操作。\n\
  \n排序算法不仅可以用于按升序或降序显示数据，还可以帮助从给定的值集中找到最小值和最大值。例如，在升序排列的数组中，最小值位于第一个索引位置，最大值位于最后一个索引位置。虽然仅为了寻找最大最小值而对数组排序是非常无效的，但如果程序由于其他原因对数组进行了排序，你随后需要最小值或最大值，你就知道在哪里可以找到它们了！\n\
  \n另一种你可能需要排序算法的场景是你想找到并显示数组中的三个最大（或最小）数字。在这种情况下，你可以将数组按降序排列，然后只显示位于索引 0、1 和 2 的前三个元素。\n\
  \n正如你所知道的，C++ 包含了用于数组排序的 `sort()` 函数。然而，在某些情况下，必须实现自定义排序算法，特别是当你需要在排序数组的同时保持与第二个数组元素的一一对应关系时。\n\
  \n#### 练习 34.4-1 冒泡排序算法 – 对数值一维数组排序\n\n编写一个 C++ 程序，让用户输入 20 个数值到数组中，然后使用冒泡排序算法将它们按升序排序。\n\
  \n解决方案\n\n冒泡排序算法可能是效率最低的排序算法之一，但它被广泛用于教学。其核心思想（当要求升序排序数组时）是重复地将数组中最小的元素移动到索引最低的位置。其工作原理如下：算法遍历数组元素，比较每对相邻元素，然后交换它们的内容（如果它们的顺序错误）。这个过程会重复多次，直到数组排序就绪。\n\
  \n例如，让我们尝试按升序排序以下数组。\n\n.![Image](img/chapter34-08.png)\n\n最小值是值 5。根据冒泡排序算法，这个值必须逐渐“冒泡”或“上升”到位置\
  \ 0，就像可乐中在杯子中冒出的气泡一样。当值 5 被移动到位置 0 后，下一个较小的值是值 8。现在，值 8 必须“冒泡”到位置 1。接下来是值 12，它必须“冒泡”到位置\
  \ 2，以此此类推。这个过程不断重复，直到所有元素都被放置在正确的位置。\n\n但如何使用算法完成这种“冒泡”过程呢？让我们更详细地查看整个过程。对于之前包含六个元素的数组\
  \ `A`，必须执行五轮遍历。\n\n第一轮\n\n**第 1 次比较**\n初始比较索引位置 4 和 5 的元素。由于值 12 小于值 49，这两个元素交换了内容。\n\
  \n**第 2 次比较**\n比较索引位置 3 和 4 的元素。由于值 12 不小于值 5，因此不进行交换。\n\n**第 3 次比较**\n比较索引位置 2\
  \ 和 3 的元素。由于值 5 小于值 8，这两个元素交换了内容。\n\n**第 4 次比较**\n比较索引位置 1 和 2 的元素。由于值 5 小于值 25，这两个元素交换了内容。\n\
  \n**第 5 次比较**\n比较索引位置 0 和 1 的元素。由于值 5 小于值 17，这两个元素交换了内容。\n\n![Image](img/chapter34-09.png)\n\
  \n第一轮已经完成，但正如你所看到的，数组还没有排序。唯一能保证放置在正确位置的值是值 5。然而，由于后续还有更多轮，值 5 无需参与随后的比较。在接下来的一轮中，将少执行一次比较——即四次比较。\n\
  \n第二轮\n\n**第 1 次比较**\n比较索引位置 4 和 5 的元素。由于值 49 不小于值 12，因此不进行交换。\n\n**第 2 次比较**\n\
  比较索引位置 3 和 4 的元素。由于值 12 不小于值 8，因此不进行交换。\n\n**第 3 次比较**\n比较索引位置 2 和 3 的元素。由于值 8 小于值\
  \ 25，这两个元素交换了内容。\n\n**第 4 次比较**\n比较索引位置 1 和 2 的元素。由于值 8 小于值 17，这两个元素交换了内容。\n\n![Image](img/chapter34-10.png)\n\
  \n第二轮已经完成，值 8 保证被放置在正确的位置。然而，由于后续还有更多轮，值 8（当然还有值 5）无需参与随后的比较。在接下来的一轮中，将少执行一次比较——即三次比较。\n\
  \n第三轮\n\n在这一轮中，执行了三次比较（但只有两次交换），如下所示。\n\n![Image](img/chapter34-11.png)\n\n第三轮已经完成，值\
  \ 12 保证被放置在正确的位置。与之前一样，由于后续还有更多轮，值 12（当然还有值 5 和 8）无需参与随后的比较。在接下来的一轮中，将少执行一次比较——即两次比较。\n\
  \n第四轮\n\n在这一轮中，执行了两次比较（没有交换），如下所示。\n\n![Image](img/chapter34-12.png)\n\n第四轮已经完成，值\
  \ 17 保证被放置在正确的位置。与之前一样，由于还有最后一轮，值 17（当然还有值 5、8 和 12）无需参与随后的比较。在接下来的最后一轮遍历中，将少执行一次比较——即一次比较。\n\
  \n第五轮\n\n在最后一轮遍历中，只执行了一次比较。由于值 49 不小于值 25，因此不进行交换。\n\n.![Image](img/chapter34-13.png)\n\
  \n第五轮已经完成，最后两个值（25 和 49）现在保证处于正确的位置。冒泡排序算法已结束，数组已按升序排序！\n\n现在你需要一个可以完成整个过程的 C++\
  \ 程序。让我们使用“从内层到外层”的方法。下面显示了仅执行第一轮的代码片段。请注意这是内层（嵌套）循环控制结构。假设变量 `m` 包含值 1。\n\n```cpp\n\
  for (n = ELEMENTS - 1; n >= m; n--) {\n    if (a[n] < a[n - 1]) {\n        temp\
  \ = a[n];\n        a[n] = a[n - 1];\n        a[n - 1] = temp;\n    }\n}\n```\n\n\
  ![](img/notice.jpg)在第一轮中，变量 `m` 必须包含值 1。这确保了最后一次迭代中比较的元素是索引位置 1 和 0 的元素。\n\n\n\n\
  \n交换两个元素的内容使用了你已经学习过的方法！请回想一下两杯橙汁和一瓶柠檬汁。如果这让你没有没有印象，你需要复习一下记忆并重新阅读练习 8.1-3。\n\n\
  如果只是重新执行之前的代码段，就可以进行第二轮循环。然而，变量 `m` 需要包含值 `2`。这将确保索引位置为 `0` 的元素不会被再次比较。同样，对于第三次循环，由于相同的原因，可以重新执行之前的代码段，但变量\
  \ `m` 需要包含值 `3`。\n\n因此，之前的代码段需要执行五次（每轮执行一次），并且每次变量 `m` 必须递增 `1`。使用冒泡排序算法排序数组 `a`\
  \ 的最终代码段如下。\n\n```cpp\nfor (m = 1; m <= ELEMENTS - 1; m++) {\n    for (n = ELEMENTS\
  \ - 1; n >= m; n--) {\n        if (a[n] < a[n - 1]) {\n            temp = a[n];\n\
  \            a[n] = a[n - 1];\n            a[n - 1] = temp;\n        }\n    }\n\
  }\n```\n\n对于 `N` 个元素，算法需要执行 `N - 1` 轮。例如，如果数组 `a` 包含 20 个元素，语句 `(m = 1; m <= ELEMENTS\
  \ - 1; m++)` 将执行 19 轮。\n\n完整的 C++ 程序如下。\n\n![](img/my_exercise_header.png) 项目 _34.4-1\n\
  ```cpp\n#include <iostream>\nusing namespace std;\nconst int ELEMENTS = 20;\nint\
  \ main() {\n    int i, m, n;\n    double temp;\n    double a[ELEMENTS];\n    for\
  \ (i = 0; i <= ELEMENTS - 1; i++) {\n        cin >> a[i];\n    }\n    for (m = 1;\
  \ m <= ELEMENTS - 1; m++) {\n        for (n = ELEMENTS - 1; n >= m; n--) {\n   \
  \         if (a[n] < a[n - 1]) {\n                temp = a[n];\n               \
  \ a[n] = a[n - 1];\n                a[n - 1] = temp;\n            }\n        }\n\
  \    }\n    for (i = 0; i <= ELEMENTS - 1; i++) {\n        cout << a[i] << \"\\\
  t\";\n    }\n    return 0;\n}\n```\n\n![](img/notice.jpg) 冒泡排序算法是非常低效的。它执行的比较总数为\
  \ ![Image](img/chapter34-14.png)，其中 `N` 是数组元素的总数。\n\n![](img/notice.jpg) 交换的总数取决于给定的数组。最坏的情况是你想对一个已经按降序排列的数组进行升序排序，反之亦然。\n\
  \n### 练习 34.4-2 带有字母数字值的一维数组\n\n编写一个代码段，使用冒泡排序算法对数组中的字母数字值进行降序排序。\n\n##### 答案\n\n\
  将此练习的措辞与之前的相比，有两个不同点。首先，冒泡排序算法需要对字母数字值（例如姓名或城市名）进行排序；其次，它必须按降序排序。\n\n为了对字母数字数据进行排序，你不需要更改算法中的任何内容！C++\
  \ 处理字母的方式与处理数字相同。字母“A”被认为“小于”字母“B”，“B”被认为“小于”字母“C”，以此此类推。当然，如果数组包含第一个字母相同的单词，C++\
  \ 会继续比较它们的第二个字母，可能还会比较第三个字母（如果需要的话）。例如，名字“Johathan”被认为“小于”名字“Jone”，因为第四个字母“a”“小于”第四个字母“e”。\n\
  \n![](img/notice.jpg) 结合英语字典组织单词的背景考虑字母数字排序。\n\n现在，让我们看看需要修改什么才能让算法按降序而不是升序排序。你还记得冒泡排序算法实际上是如何工作的吗？元素逐渐“浮”到低索引位置，就像可乐杯中的气泡上升一样。你在这个练习中想要的是让较大的元素（而不是较小的元素）“浮”到较低的索引位置。因此，你只需要简单地反转决策控制结构中的比较运算符即可！\n\
  \n降序排序字母数字值的代码段如下。\n\n```cpp\nstring tempStr;\nfor (m = 1; m <= ELEMENTS - 1; m++)\
  \ {\n    for (n = ELEMENTS - 1; n >= m; n--) {\n        if (a[n] > a[n - 1]) {\n\
  \            tempStr = a[n];\n            a[n] = a[n - 1];\n            a[n - 1]\
  \ = tempStr;\n        }\n    }\n}\n```\n\n### 练习 34.4-3 在保持与第二个数组关系的同时排序一维数组\n\n\
  编写一个 C++ 程序，让用户输入 20 个湖泊的名称及其对应的平均面积。程序必须使用冒泡排序算法按平均面积升序对它们进行排序。\n\n##### 答案\n\n\
  在这个练习中，你需要以下两个数组。\n\n![Image](img/chapter34-15.png) 如果你想在保持两个数组元素之间一对应关系的同时对面积进行排序，你必须重新排列名称数组的元素。这意味着每当面积元素发生交换时，名称元素也必须交换。该\
  \ C++ 程序如下。\n\n![](img/my_exercise_header.png) 34.4-3\n```cpp\n#include <iostream>\n\
  using namespace std;\nconst int LAKES = 20;\nint main() {\n    int i, m, n;\n  \
  \  double temp;\n    string tempStr;\n    string names[LAKES];\n    double areas[LAKES];\n\
  \    for (i = 0; i <= LAKES - 1; i++) {\n        cin >> names[i];\n        cin >>\
  \ areas[i];\n    }\n    for (m = 1; m <= LAKES - 1; m++) {\n        for (n = LAKES\
  \ - 1; n >= m; n--) {\n            if (areas[n] < areas[n - 1]) {\n            \
  \    temp = areas[n];\n                areas[n] = areas[n - 1];\n              \
  \  areas[n - 1] = temp;\n                tempStr = names[n];\n                names[n]\
  \ = names[n - 1];\n                names[n - 1] = tempStr;\n            }\n    \
  \    }\n    }\n    for (i = 0; i <= LAKES - 1; i++) {\n        cout << names[i]\
  \ << \"\\t\" << areas[i] << endl;\n    }\n    return 0;\n}\n```\n\n![](img/notice.jpg)\
  \ 注意，你不能使用变量 `temp` 来交换名称数组的内容；因为 `temp` 声明为 `double`，而名称数组包含字符串。因此，你需要一个声明为 `string`\
  \ 的第二个变量 (`tempStr`)。\n\n### 练习 34.4-4 排序姓和名\n\n编写一个 C++ 程序，提示用户输入 100 个人的姓和名。程序随后必须按姓氏的字母顺序显示姓名。在两个或多个人拥有相同姓氏的情况下，他们的名字也应该按字母顺序显示。\n\
  \n##### 答案\n\n你已经知道如何在保持与第二个数组元素的一一对应关系的情况下排序数组。现在，你必须处理第一个数组中两个姓相同的情况。根据练习的措辞，第二个数组中的名字也必须按字母顺序排序。例如，下面的数组\
  \ `lastNm` 包含了 100 个人的姓。它是按字母顺序排列的，并且包含了三次“Parker”。在数组 `firstNm` 中对应的名字“Andrew”、“Anna”和“Chloe”也必须按字母顺序排序，如下。\n\
  \n![Image](img/chapter34-16.png)\n\n为了方便起见，这里再次给出冒泡排序算法的基础版本。请注意，该算法保持了 `lastNm`\
  \ 和 `firstNm` 数组元素之间的一对应关系。\n\n```cpp\nfor (m = 1; m <= PEOPLE - 1; m++) {\n   \
  \ for (n = PEOPLE - 1; n >= m; n--) {\n        if (lastNm[n] < lastNm[n - 1]) {\n\
  \            tempStr = lastNm[n];\n            lastNm[n] = lastNm[n - 1];\n    \
  \        lastNm[n - 1] = tempStr;\n            tempStr = firstNm[n];\n         \
  \   firstNm[n] = firstNm[n - 1];\n            firstNm[n - 1] = tempStr;\n      \
  \  }\n    }\n}\n```\n\n![](img/notice.jpg) 注意，使用变量 `tempStr` 来交换 `lastNm` 和 `firstNm`\
  \ 两个数组的内容。这是可以接受的，因为这两个数组都包含字符串。\n\n\n\n然而，为了解决这个练习，必须对冒泡排序算法进行相应的调整。根据这个基础版本的冒泡排序算法，当位置\
  \ `n` 处的最后一个姓氏“小于”位置 `n - 1` 处的最后一个姓氏时，算法会交换对应的内容。但如果这些位置上的姓氏相同，算法则必须验证对应的名字顺序是否正确。如果不是，则需要在数组\
  \ `firstNm` 中进行交换。调整后的冒泡排序算法如代码代码段所示。\n\n```cpp\nfor (m = 1; m <= PEOPLE - 1; m++)\
  \ {\n    for (n = PEOPLE - 1; n >= m; n--) {\n        if (lastNm[n] < lastNm[n -\
  \ 1]) {\n            tempStr = lastNm[n];\n            lastNm[n] = lastNm[n - 1];\n\
  \            lastNm[n - 1] = tempStr;\n            tempStr = firstNm[n];\n     \
  \       firstNm[n] = firstNm[n - 1];\n            firstNm[n - 1] = tempStr;\n  \
  \      }\n        else if (lastNm[n] == lastNm[n - 1]) { //If the last names are\
  \ equal\n            if (firstNm[n] < firstNm[n - 1]) { //check the corresponding\
  \ first names\n                tempStr = firstNm[n]; //and swap if not in correct\
  \ order\n                firstNm[n] = firstNm[n - 1];\n                firstNm[n\
  \ - 1] = tempStr;\n            }\n        }\n    }\n}\n```\n\n接下来是最终的 C++ 程序。\n\n\
