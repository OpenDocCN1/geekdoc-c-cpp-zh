  \n![](img/remember.jpg)`length()` 方法返回变量 `message` 包含的字符数，而 `message[i]` 记法返回字符串变量\
  \ `message` 中指定位置（由变量 `i` 指定）的字符（参见第 14.3 节）。\n\n### 练习 26.1-1 创建追踪表\n\n设计相应的流程图并创建一个追踪表，以确定当输入值为\
