  \ x 和 y\n\n编写一个 C++ 程序，在 -20 到 +20 范围内显示满足以下公式的 x 和 y 的可能整数值：\n\n3x² − 6y² = 6\n\
  \n##### 解决方案\n\n如果你只想显示 x 和 y 的所有组合，可以使用以下代码片段：\n\n```cpp\nint x, y;\nfor (x = -20;\
  \ x <= 20; x++) {\n    for (y = -20; y <= 20; y++) {\n        cout << x << \"  \"\
