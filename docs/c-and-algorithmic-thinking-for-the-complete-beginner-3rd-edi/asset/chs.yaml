  \ << \"\\t\";\n\n}return 0;}\n```\n\n### 34.3 在数组中寻找最小值和最大值\n\n\n\n\n这是本书第三次也是最后一次提到这个主题。第一次是在第\
  \ 23.2 节 中使用决策控制结构，第二次是在第 30.4 节 中使用循环控制结构。因此，没有什么剩下的可以讨论了，除了：当你想要在一个已经包含某些值的数据结构中找到最小值或最大值，你不需要担心变量\
  \ `minimum` 或 `maximum` 的初始值，因为你只需要将数据结构第一个元素的值赋值给它们即可！\n\n### 练习 34.3-1 哪个深度最深？\n\
  \n编写一个 C++ 程序，让用户输入 20 个湖泊的深度，然后显示最深的一个湖泊的深度。\n\n##### 答案\n\n在用户将 20 个湖泊的深度输入数组\
  \ `depths` 后，变量 `maximum` 的初始值可以设置为 `depths[0]` 的值，即数组 `depths` 的第一个元素。程序随后可以从索引\
  \ 1 开始搜索任何大于此值的后续值。最终解决方案非常直接，将在接下来给出不再做进一步解释。\n\n```cpp\n#include <iostream>\n\
  using namespace std;\nconst int LAKES = 20;\nint main() {\n    int i;\n    double\
  \ maximum;\n    double depths[LAKES];\n    for (i = 0; i <= LAKES - 1; i++) {\n\
  \        cin >> depths[i];\n    }\n    maximum = depths[0]; //初始值\n    // 从此之后从索引\
  \ 1 开始搜索\n    for (i = 1; i <= LAKES - 1; i++) {\n        if (depths[i] > maximum)\
  \ {\n            maximum = depths[i];\n        }\n    }\n    cout << maximum <<\
  \ endl;\n    return 0;\n}\n```\n\n从位置 0 而不是 1 开始迭代也没有错，尽管程序会执行一次无用的迭代。\n\n给变量 `maximum`\
  \ 分配一个“几乎任意”的初始值也没有错，但没有理由这样做。第一个元素的值就足够了！不过，如果你坚持要这样做，可以分配 0 作为初始值，因为地球上不存在深度为负的湖泊。\n\
  \n但请记住，寻找数组最大值的另一种方法是使用 `max_element()` 函数，如下所示。\n\n```cpp\n#include <iostream>\n\
  #include <algorithm>\nusing namespace std;\nint main() {\n    const int LAKES =\
  \ 20;\n    int i;\n    double maximum;\n    double depths[LAKES];\n    for (i =\
  \ 0; i <= LAKES - 1; i++) {\n        cin >> depths[i];\n    }\n    maximum = *max_element(depths,\
  \ end(depths));\n    cout << maximum << endl;\n    return 0;\n}\n```\n\n相应地，如果你想找到数组的最小值，可以使用\
  \ `min_element()` 函数。\n\n### 练习 34.3-2 哪个湖泊最深？\n\n编写一个 C++ 程序，让用户输入 20 个湖泊的名称和深度，然后显示最深湖泊的名称。\n\
  \n##### 答案\n\n如果你不知道如何找到最深湖泊的名称，可能需要通过重新阅读练习 30.4-2 来复习记忆。\n\n在这次练习中，你需要两个一维数组：一个用于存储名称，另一个用于存储湖泊的深度。解决方案所示。\n\
  \n```cpp\n#include <iostream>\nusing namespace std;\nconst int LAKES = 20;\nint\
  \ main() {\n    int i;\n    double maximum;\n    string mName;\n    string names[LAKES];\n\
  \    double depths[LAKES];\n    for (i = 0; i <= LAKES - 1; i++) {\n        cin\
  \ >> names[i];\n        cin >> depths[i];\n    }\n    maximum = depths[0];\n   \
  \ mName = names[0];\n    for (i = 1; i <= LAKES - 1; i++) {\n        if (depths[i]\
  \ > maximum) {\n            maximum = depths[i];\n            mName = names[i];\n\
  \        }\n    }\n    cout << mName << endl;\n    return 0;\n}\n```\n\n在这次练习中不能使用\
  \ `max_element()` 函数！它会返回最大深度，而不是具有该最大深度的湖泊名称！\n\n### 练习 34.3-3 哪个国家的哪个湖泊（平均面积为多少）最深？\n\
  \n编写一个 C++ 程序，让用户输入 20 个湖泊的名称、深度，以及它们所属的国家和平均面积。程序必须显示关于最深湖泊的所有可用信息。\n\n##### 答案\n\
  \n让我们来看下一个六个湖泊的例子。深度以英尺为单位，平均面积以平方英里为单位。\n\n![Image](img/chapter34-05.png)\n\n显而易见，贝加湖是最深的湖泊，位于索引\
  \ 2。如果你按照类似于上一个练习的方法（练习 34.3-2 {\n    int i, indexOfMax;\n    double maximum;\n\
  \    string names[LAKES];\n    double depths[LAKES];\n    string countries[LAKES];\n\
  \    double areas[LAKES];\n    for (i = 0; i <= LAKES - 1; i++) {\n        cin >>\
  \ names[i];\n        cin >> depths[i];\n        cin >> countries[i];\n        cin\
  \ >> areas[i];\n    }\n    // 找到最大深度以及该最大深度所在的索引\n    maximum = depths[0];\n   \
