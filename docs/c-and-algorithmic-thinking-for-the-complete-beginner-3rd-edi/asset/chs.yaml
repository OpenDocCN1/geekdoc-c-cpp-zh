  \ 章：面向对象编程简介\n\n### 39.1 什么是面向对象编程？\n\n在第七部分 中，你阅读甚至编写的所有程序都在使用子程序（函数和 `void` 函数）。这种编程风格被称为过程化编程，大多数时候它是完全可以的！但当编写大型程序，或在微软、Facebook\
  \ 或 Google 这样的大公司工作时，面向对象编程是必须使用的编程风格！\n\n面向对象编程通常称为 `OOP`，是一种关注对象的编程风格。在 `OOP`\
  \ 中，数据和功能被结合并封装在一个被称为“对象”的东西内部。应用面向对象编程原则可以让你更轻松地维护代码，并编写出他人容易理解和使用的代码。\n\n“OOP\
  \ 关注对象”这句话的真正含义是什么？让我们考虑一个现实世界的例子。想象一辆汽车。你会如何描述某个特定的汽车？它有特定的属性，如品牌、型号、颜色和车牌。此外，这辆车还可以执行或曾经执行过特定的动作。例如，有人可以启动或关闭它、加速或刹车停车。\n\
  \n在 `OOP` 中，这辆车可以表示为一个具有特定属性（通常称为字段）并执行特定动作（称为方法）的对象。\n\n显然，你现在可能在问：“我首先如何创建对象呢？”答案很简单！你只需要一个类。类类似于一个“橡皮印章”！在图\
  \ 39-1 中有一个印章（这就是类），带有四个空字段和三个动作（方法）。\n\n![Image](img/chapter39-01.png)\n\n图 39-1\
  \ 类类似于“橡皮印章”\n\n使用这个印章的人可以盖出很多辆汽车（这些就是对象）。例如，在图 39-2 中，一个小男孩盖出了那两辆汽车，然后给它们涂了颜色，并用每辆汽车的字段填充了特定的属性。\n\
  \n![Image](img/chapter39-02.png)\n\n图 39-2 你可以使用同一个橡皮印章作为模板来盖出很多辆汽车\n\n![](img/notice.jpg)创建一个新对象（类的的新实例）的过程被称为“实例化”。\n\
  \n![](img/notice.jpg)类是一个模板，每个对象都是从类中创建的。每个类都应该设计为执行一个且仅一个任务！这就是为什么在大多数情况下，需要使用多个类来构建整个应用程序！\n\
  \n![](img/notice.jpg)在 `OOP` 中，橡皮印章就是类。你可以使用同一个类作为模板来创建（实例化）很多对象！\n\n### 39.2 C++\
  \ 中的类和对象\n\n现在你已经掌握了类和对象背后的理论概念，让我们深入到 `C++` 中编写一个真实的类吧！以下代码段创建了 `Car` 类。类中有四个字段和三个方法。\n\
  \n```cpp\nclass Car {\npublic:\n    // 定义四个字段（属性）\n    string brand = \"\";\n  \
  \  string model = \"\";\n    string color = \"\";\n    string licensePlate = \"\"\
  ;\n    // 定义方法 turnOn()\n    void turnOn() {\n        cout << \"The car turns on\"\
  \ << endl;\n    }\n    // 定义方法 turnOff()\n    void turnOff() {\n        cout <<\
  \ \"The car turns off\" << endl;\n    }\n    // 定义方法 accelerate()\n    void accelerate()\
  \ {\n        cout << \"The car accelerates\" << endl;\n    }\n};\n```\n\n这里有一个趣的小知识：类中的字段和方法本质上就是普通的变量和子程序！\n\
  \n![](img/notice.jpg)在面向对象编程 (`OOP`) 中，使用的术语是“方法”（而不是“函数”）和“void 方法”（而不是“void 函数”）。\n\
  \n![](img/notice.jpg)`Car` 类只是一个模板。目前还没有创建任何对象！\n\n![](img/notice.jpg)关键字 `public`\
  \ 指定了该关键字下方的所有字段和方法都可以通过类的实例从类外部访问。\n\n![](img/notice.jpg)注意类末尾有分号 ( ; ) 字符。\n\n\
  ![](img/notice.jpg)类名应该遵循大驼峰命名法，以及 5.4 节中介绍的所有变量命名规则。\n\n要创建两个对象（换句话说创建两个 `Car`\
  \ 类实例），你需要以下两行代码。\n\n```cpp\nCar car1;\nCar car2;\n```\n\n![](img/notice.jpg)对象无非是类的实例，这就是为什么很多时候它被称为“类实例”或“类对象”。\n\
  \n![](img/remember.jpg)当你创建一个新对象（类的的新实例）时，这个过程被称为“实例化”。\n\n现在你已经创建（实例化）了两个对象，你可以为它们的字段赋值。这样做请使用点符号。这意味着你需要编写对象的名称，后面跟着点，然后是你想访问的字段或方法的名称。以下代码段创建了两个对象\
  \ `car1` 和 `car2`，并为它们的字段赋值。\n\n\n\n\n\n```cpp\nint main() {\n  Car car1;\n  Car\
  \ car2;\n  car1.brand = \"Mazda\";\n  car1.model = \"6\";\n  car1.color = \"Gray\"\
  ;\n  car1.licensePlate = \"AB1234\";\n  car2.brand = \"Ford\";\n  car2.model = \"\
  Focus\";\n  car2.color = \"Blue\";\n  car2.licensePlate = \"XY9876\";\n  cout <<\
  \ car1.brand << endl;  //It displays: Mazda\n  cout << car2.brand << endl;  //It\
  \ displays: Ford\n  return 0;\n}\n```\n\n![](img/notice.jpg)\n在上一个示例中，`car1` 和 `car2`\
  \ 是同一类的两个实例。使用点操作符访问 `car1` 和 `car2` 允许你一次引用其中一个实例。如果你对其中一个实例进行任何更改，将不会影响另一个实例！\n\
  \n下面的代码段分别调用了对象 `car1` 和 `car2` 的 `turnOff()` 和 `accelerate()` 方法。\n\n```cpp\ncar1.turnOff();\n\
  car2.accelerate();\n```\n\n![](img/remember.jpg)\n类是一个不可执行的模板，而对象是类的实例，是可以执行的！\n\
  \n![](img/remember.jpg)\n一个类可以被用来创建你想要的任意数量的对象（实例化）！\n\n### 39.3 构造函数与 this 关键字\n\
  \n在 C++ 中，有一种方法具有特殊作用，被称为构造函数。每当类的实例（对象）被创建时，构造函数方法就会自动执行。你想要对对象进行的任何初始化都可以在此方法中完成。在\
  \ C++ 中，构造函数是一个名称与所在类名相同的方法。\n\n请看下面的示例。构造函数方法 `Person()` 会被自动调用两次，一次是在对象 `p1` 创建时，另一次是在对象\
  \ `p2` 创建时，这意味着消息“An object was created”会被显示两次。\n\n![](img/my_exercise_header.png)\
  \ project_39.3a\n```cpp\n#include <iostream>\nusing namespace std;\nclass Person\
  \ {\npublic:\n    //定义构造函数\n    Person() {\n        cout << \"An object was created\"\
  \ << endl;\n    }\n};\nint main() {\n    Person p1, p2;\n    return 0;\n}\n```\n\
  \n![](img/notice.jpg)\n注意，构造函数名称前面没有 `void` 关键字。\n\n在使用 C++ 的面向对象编程 (OOP) 中，有一个名为\
  \ `this` 的关键字，它充当指向当前对象的引用变量。请看下面的示例。\n\n![](img/my_exercise_header.png) project_39.3b\n\
  ```cpp\n#include <iostream>\nusing namespace std;\nclass Person {\npublic:\n   \
  \ string name;\n    int age;\n    //定义构造函数\n    Person() {\n        cout << \"An\
  \ object was created\" << endl;\n    }\n    void sayInfo() {\n        cout << \"\
  I am \" << this->name << endl;\n        cout << \"I am \" << this->age << \" years\
  \ old\" << endl;\n    }\n};\nint main() {\n    Person person1;\n    //给其字段赋值\n \
  \   person1.name = \"John\";\n    person1.age = 14;\n    person1.sayInfo();   //调用对象\
  \ person1 的 sayInfo() 方法\n    return 0;\n}\n```\n\n![](img/notice.jpg)\n注意，在方法外部声明字段\
  \ `name` 和 `age`（但在类内部）时，你写字段名不需要箭头操作符 (`->`)。然而，从方法内部访问字段时，你应该使用箭头操作符 (`->`)，例如\
  \ `this->name` 和 `this->age`。\n\n你现在脑海中可能正在旋转的问题是：“为什么在 `sayInfo()` 方法内部必须将这些字段\
  \ `name` 和 `age` 称为 `this->name` 和 `this->age` 呢？真的有在它们前面使用 `this` 关键字吗？”一个简单的回答是，在方法内部始终存在存在两个同名额外局部变量（`name`\
  \ 和 `age`）的可能性。因此，你需要一种方法来区分这些局部变量和对象的字段。如果你感到困惑，请尝试理解以下示例。在 `MyClass` 类中有一个字段 `b`，在该类的\
  \ `myMethod()` 方法中有一个局部变量 `b`。`this` 关键字用于区分局部变量和字段。\n\n![](img/my_exercise_header.png)\
  \ project_39.3c\n```cpp\n#include <iostream>\nusing namespace std;\nclass FooClass\
  \  {\npublic:\n    string b;   //这是一个字段\n    void myMethod() {\n        string b\
  \ = \" *** \";  //这是一个局部变量\n        cout << b << this->b << b << endl;\n    }\n\
  };\nint main() {\n    FooClass x;    //创建对象 x\n    x.b = \"Hello!\";   //给其字段赋值\n\
  \    x.myMethod();     //显示为：*** Hello! ***\n    return 0;\n}\n```\n\n![](img/notice.jpg)\n\
  `this` 关键字可以用于从类的方法内部引用该类的任何成员（字段或方法）。\n\n### 39.4 向构造函数传递初始值\n\n任何方法，即使是构造函数方法，可以在其形式参数列表中拥有形式参数。例如，在构造函数方法中，你可以使用参数在创建期间向对象传递一些初始值。接下来的示例创建了四个对象，每个对象代表希腊神话中的一个泰坦。\n\
  \n![](img/my_exercise_header.png) project_39.4\n```cpp\n#include <iostream>\nusing\
  \ namespace std;\nclass Titan {\npublic:\n    string name;\n    string gender;\n\
  \    //定义构造函数\n    Titan(string n, string g) {\n        this->name = n;\n      \
  \  this->gender = g;\n    }\n};\nint main() {\n    Titan titan1(\"Cronus\", \"male\"\
  );\n    Titan titan2(\"Oceanus\", \"male\");\n    Titan titan3(\"Rhea\", \"female\"\
  );\n    Titan titan4(\"Phoebe\", \"female\");\n    return 0;\n}\n```\n\n在 C++ 中，拥有同名的一个字段和一个局部变量（甚至可以是一个形式参数）是合法的。因此，`Titan`\
  \ 类也可以写如下：\n\n```cpp\nclass Titan {\npublic:\n    string name;\n    string gender;\n\
  \    //定义构造函数\n    Titan(string name, string gender) {\n        this->name = name;\
  \     //字段和参数可以有相同的名称\n        this->gender = gender;\n    }\n};\n```\n\n变量 `name`\
  \ 和 `gender` 是用于向构造函数传递值的参数，而 `this->name` 和 `this->gender` 是用于在对象内部存储值的字段。\n\n\
  #### 练习 39.4-1 历史事件\n\n执行以下操作：\n\ni)编写一个名为 `HistoryEvents` 的类，其中包含\na)一个名为 `day`\
  \ 的公共字符串字段。\nb)一个大小为 2 的名为 `events` 的公共字符串数组字段。\nc)一个构造函数，通过其形式参数列表接受字段 `day` 的初始值。\n\
  ii)编写一个 C++ 程序，为以下历史事件创建两个 `HistoryEvents` 类的对象：\n\n7 月 4 日 (4th of July)\ni) 1776：美国签署独立宣言\n\
  ii) 1810：法国军队占领阿姆丹\n\n10 月 28 日 (28th of October)\ni) 969：拜占庭军队\nii) 1940：希腊\n\n\
  然后显示所有可用信息。\n\n答案\n\n解决方案如下。\n\n![](img/my_exercise_header.png) project_39.4-1\n\
  ```cpp\n#include <iostream>\nusing namespace std;\nclass HistoryEvents {\npublic:\n\
  \    string day;\n    string events[2];\n    //定义构造函数\n    HistoryEvents(string\
  \ day) {\n        this->day = day;\n    }\n};\nint main() {\n    HistoryEvents h1(\"\
  4th of July\");\n    h1.events[0] = \"1776: Declaration of Independence in United\
  \ States\";\n    h1.events[1] = \"1810: French troops occupy Amsterdam\";\n    HistoryEvents\
  \ h2(\"28th of October\");\n    h2.events[0] = \"969: Byzantine troops occupy Antioch\"\
  ;\n    h2.events[1] = \"1940: Ohi Day in Greece\";\n    cout << h1.day << endl;\n\
  \    cout << h1.events[0] << endl;\n    cout << h1.events[1] << endl;\n    cout\
  \ << endl;\n    cout << h2.day << endl;\n    cout << h2.events[0] << endl;\n   \
  \ cout << h2.events[1] << endl;\n    return 0;\n}\n```\n\n### 39.5 Getter 和 Setter\
  \ 方法\n\n字段是直接在类中定义的变量。然而，面向对象编程的原则规定，类的数据应该是隐藏的，并且防止意外更改。想象一下有一天你可能会编写其他程序员在程序中使用的类。因此，你不希望他们知道你的类内部有什么！类的内部操作应该对外部世界隐藏。通过不暴露字段，你成功隐藏了类的内部实现。字段应该对类是私有的，并通过\
  \ getter 和 setter 方法访问。\n\n![](img/notice.jpg)\n通常，程序员应该只对具有私有或受保护访问权限的数据字段。在 C++\
  \ 中，你可以使用特殊的关键字 `private` 或 `protected` 分别将字段（或方法）设置为私有或受保护。\n\n让我们通过一个示例尝试理解所有这些新内容。假设你编写了以下类，它可以将华氏温度转换为等值的摄氏温度。\n\
  \n\n\n\n\n![](img/my_exercise_header.png) 项目 39.5a\n\n```cpp\n#include <iostream>\n\
  using namespace std;\nclass FahrenheitToCelsius {\npublic:\n    double temperature;\n\
  \    //定义构造函数\n    FahrenheitToCelsius(double value) {\n        this->temperature\
  \ = value;   //初始化字段\n    }\n    //此方法获取温度\n    double getTemperature() {\n    \
  \    return 5.0 / 9.0 * (this->temperature - 32.0);\n    }\n};\n\nint main() {\n\
  \    FahrenheitToCelsius x(-68);  //创建对象 x\n    cout << x.getTemperature() << endl;\n\
  \    return 0;\n}\n```\n\n这个类几乎是完美了，但有一个主要的缺点。它没有考虑到温度不能低于 −459.67 华氏度（−273.15 摄氏度）。这个温度被称为绝对零度。因此，一个使用你的类且对物理一无所知的初级程序员，可能会向构造函数传递一个\
  \ −500 华氏度的值，如下代码片段所示：\n\n```cpp\nFahrenheitToCelsius x(-500);\ncout << x.getTemperature()\
  \ << endl;\n```\n\n尽管程序可以完美运行并显示出 −295.55 摄氏度的值，但遗憾的是，这个温度在整个宇宙中是不存在的！因此，该类的稍微不同版本可能会部分解决这个问题。\n\
  \n![](img/my_exercise_header.png) 项目 39.5b\n\n```cpp\n#include <iostream>\nusing\
  \ namespace std;\nclass FahrenheitToCelsius {\npublic:\n    double temperature;\n\
  \    //定义构造函数\n    FahrenheitToCelsius(double value) {\n        this->setTemperature(value);\
  \   //使用方法来设置字段 temperature 的值\n    }\n    //此方法获取温度\n    double getTemperature()\
  \ {\n        return 5.0 / 9.0 * (this->temperature - 32.0);\n    }\n    //此方法设置温度\n\
  \    void setTemperature(double value) {\n        if (value >= -459.67) {\n    \
  \        this->temperature = value;\n        }\n        else {\n            throw\
  \ runtime_error(\"There is no temperature below -459.67\");\n        }\n    }\n\
  };\n\nint main() {\n    FahrenheitToCelsius x(-500);  //创建对象 x\n    cout << x.getTemperature()\
  \ << endl;\n    return 0;\n}\n```\n\n![](img/notice.jpg) `throw` 语句强制程序抛出一个异常（运行时错误），导致执行流停止。\n\
  \n这一次，使用了一个名为 `setTemperature()` 的方法来设置字段 `temperature` 的值。这更好，但并不完全完美，因为程序员必须小心，并始终记住在每次想要更改字段\
  \ `temperature` 的值时都使用这个方法。问题是，字段 `temperature` 的值仍然仍然通过其名称直接更改，如下代码片段所示：\n\n```cpp\n\
  FahrenheitToCelsius x(-50);  //创建对象 x\ncout << x.getTemperature() << endl;\nx.setTemperature(-65);\
  \      //这是可以的\ncout << x.getTemperature() << endl;\nx.temperature = -500;     \
  \  //遗憾的是，这仍然是被允许的！\ncout << x.getTemperature() << endl;\n```\n\n如果你将字段 `temperature`\
  \ 声明为 `private`，这个问题就可以被完全解决！当字段被声明为 `private` 时，调用者（在此处为对象 `x`）无法直接访问该字段，如下面的 C++\
  \ 程序所示。\n\n![](img/my_exercise_header.png) 项目 39.5c\n\n```cpp\n#include <iostream>\n\
  using namespace std;\nclass FahrenheitToCelsius {\nprivate:\n    double _temperature;\
  \  //将字段 temperature 声明为私\npublic:\n    //定义构造函数\n    FahrenheitToCelsius(double\
  \ value) {\n        this->setTemperature(value);   //调用 setter\n    }\n    //此方法获取温度\n\
  \    double getTemperature() {\n        return 5.0 / 9.0 * (this->_temperature -\
  \ 32.0);\n    }\n    //此方法设置温度\n    void setTemperature(double value) {\n      \
  \  if (value >= -459.67) {\n            this->_temperature = value;\n        }\n\
  \        else {\n            throw runtime_error(\"There is no temperature below\
  \ -459.67\");\n        }\n    }\n};\n\nint main() {\n    FahrenheitToCelsius x(-50);\
  \   //创建对象 x。这调用了构造函数，\n    //反过来调用了 setter。\n    cout << x.getTemperature() <<\
  \ endl;  //这调用了 getter。\n    x.setTemperature(-65);               //这调用了 setter。\n\
  \    cout << x.getTemperature() << endl;  //这调用了 getter。\n    x._temperature = -50;\
  \                //这是不允许的！\n    cout << x._temperature << endl;      //这也是不允许的！\n\
  \    return 0;\n}\n```\n\n![](img/notice.jpg) 许多程序员倾向于在私有字段前加上下划线（`_`）。\n\n####\
  \ 练习题 39.5-1 罗马数字\n\n罗马数字如表所示。\n\n| 数字 | 罗马数字 |\n| --- | --- |\n| 1 | I |\n| 2 |\
  \ II |\n| 3 | III |\n| 4 | IV |\n| 5 | V |\n\n执行以下操作：\n\ni) 编写一个名为 `Romans` 的类，它包含：\n\
  a) 一个名为 `_number` 的私有整数字段。\nb) 分别名为 `getNumber` 和 `setNumber` 的 getter 和 setter\
  \ 方法。它们将用于以整数格式获取和设置字段 `_number` 的值。当数字无法被识别时，setter 方法必须抛出错误。\nc) 分别名为 `getRoman`\
  \ 和 `setRoman` 的 getter 和 setter 方法。它们将用于以罗马数字格式获取和设置字段 `_number` 的值。当罗马数字无法被识别时，setter\
  \ 方法必须抛出错误。\nii) 使用上述类编写一个 C++ 程序，显示数值 3 对应的罗马数字，以及罗马数字“V”对应的数字。\n\n解决方案\n\n整数格式字段\
  \ `_number` 的 getter 和 setter 方法非常简单，所以没有什么特别需要解释的。然而，罗马数字格式字段 `_number` 的 getter\
  \ 和 setter 方法需要一些解释。\n\n罗马数字格式字段 `_number` 的 getter 方法可以写如下：\n\n```cpp\n//定义 getter\n\
  string getRoman() {\n    if (this->_number == 1) {\n        return \"I\";\n    }\
  \ else if (this->_number == 2) {\n        return \"II\";\n    } else if (this->_number\
  \ == 3) {\n        return \"III\";\n    } else if (this->_number == 4) {\n     \
  \   return \"IV\";\n    } else if (this->_number == 5) {\n        return \"V\";\n\
  \    }\n}\n```\n\n然而，由于你现在了解许多无序映射（unordered maps），你可以使用更好的方法，如下代码片段所示：\n\n```cpp\n\
  //定义 getter\nstring getRoman() {\n    unordered_map<int, string> number2roman =\
  \ {\n        {1, \"I\" }, { 2, \"II\" }, { 3, \"III\" }, { 4, \"IV\"}, { 5, \"V\"\
  \ }\n    };\n    return number2roman[this->_number];\n}\n```\n\n相应地，setter 方法可以如下：\n\
  \n```cpp\n//定义 setter\nvoid setRoman(string value) {\n    unordered_map<string,\
  \ int> roman2number = {\n        {\"I\", 1 }, { \"II\", 2 }, { \"III\", 3 }, { \"\
  IV\", 4}, { \"V\", 5}\n    };\n    if (roman2number.count(value) == 1) {\n     \
  \   this->_number = roman2number[value];\n    }\n    else {\n        throw runtime_error(\"\
  Roman numeral not recognized\");\n    }\n}\n```\n\n![](img/remember.jpg) C++ 内置方法\
  \ `struct.count(key_name)` 如果键 `key_name` 于无序映射 `struct` 中则返回 1，如果 `key_name` 不存在则返回\
  \ 0。\n\n最终的 C++ 程序如下：\n\n![](img/my_exercise_header.png) 项目 39.5-1\n\n```cpp\n#include\
  \ <iostream>\n#include <unordered_map>\nusing namespace std;\nclass Romans {\nprivate:\n\
  \    int _number;\npublic:\n    //定义 getter\n    int getNumber() {\n        return\
  \ this->_number;\n    }\n    //定义 setter\n    void setNumber(int value) {\n    \
  \    if (value >= 1 && value <= 5) {\n            this->_number = value;\n     \
  \   }\n        else {\n            throw runtime_error(\"Number not recognized\"\
  );\n        }\n    }\n    //定义 getter\n    string getRoman() {\n        unordered_map<int,\
  \ string> number2roman = {\n            {1, \"I\" }, { 2, \"II\" }, { 3, \"III\"\
  \ }, { 4, \"IV\"}, { 5, \"V\" }\n        };\n        return number2roman[this->_number];\n\
  \    }\n    //定义 setter\n    void setRoman(string value) {\n        unordered_map<string,\
  \ int> roman2number = {\n            {\"I\", 1 }, { \"II\", 2 }, { \"III\", 3 },\
  \ { \"IV\", 4 }, { \"V\", 5 }\n        };\n        if (roman2number.count(value)\
  \ == 1) {\n            this->_number = roman2number[value];\n        }\n       \
  \ else {\n            throw runtime_error(\"Roman numeral not recognized\");\n \
  \       }\n    }\n};\n\nint main() {\n    Romans x;\n    x.setNumber(3);\n    cout\
  \ << x.getNumber() << endl;  //显示: 3\n    cout << x.getRoman() << endl;  //显示: III\n\
  \    x.setRoman(\"V\");\n    cout << x.getNumber() << endl;  //显示: 5\n    cout <<\
  \ x.getRoman() << endl;  //显示: V\n    return 0;\n}\n```\n\n### 39.6 方法可以调用同类中的另一个方法吗？\n\
  \n\n\n\n\n在第 37.2 节中，你学习了子程序可以调用另一个子程序。显然，这对于类方法也是同样的——一个方法可以调用同类的另一个方法！毕竟，方法无非都是子程序！所以，如果你想让一个方法调用同类的另一个方法，你应该在想要调用的方法前面使用\
  \ `this` 关键字（使用箭头运算符 `->`），如下例所示。\n\n![](img/my_exercise_header.png) 练习 39.6\n```cpp\n\
  #include <iostream>\nusing namespace std;\nclass JustAClass  {\npublic:\n    void\
  \ foo1() {\n        cout << \"foo1 was called\" << endl;\n        this->foo2();\
  \     //使用点操作符调用 foo2()\n    }\nvoid foo2() {\n        cout << \"foo2 was called\"\
  \ << endl;\n    }\n}};\nint main() {\n    JustAClass x;\n    x.foo1();    //调用 foo1()，而\
  \ foo1 又将调用 foo2()\n    return 0;\n}\n```\n\n#### 练习 39.6-1 算术\n\n完成以下操作：\n\ni)\
  \ 写一个名为 `DoingMath` 的类，其中包含：\na) 一个名为 `square` 的 `private void` 方法，通过其形式参数列表接收一个数字，然后计算其平方并显示消息“XX\
  \ 的平方是 YY”，其中 `XX` 和 `YY` 必须替换为实际值。\nb) 一个名为 `squareRoot` 的 `private void` 方法，通过其形式参数列表接收一个数字，然后计算其平方根并显示消息“XX\
  \ 的平方根是 YY”，其中 `XX` 和 `YY` 必须替换为实际值。然而，如果数字小于零，方法必须显示错误信息。\nc) 一个名为 `displayResults`\
  \ 的 `public void` 方法，通过其形式参数列表接收一个数字，然后调用 `square()` 和 `squareRoot()` 方法来显示结果。\n\
  ii) 使用上述类编写一个 C++ 程序，提示用户输入一个数字。该程序必须显示该数字的平方和平方根。\n\n##### 答案\n\n这个练习非常简单。`square()`、`squareRoot()`\
  \ 和 `displayResults()` 方法必须在它们的形式参数列表中包含形式参数，以便接收传递的值。解决方案如下。\n\n![](img/my_exercise_header.png)\
  \ 练习 39.6-1\n```cpp\n#include <iostream>\n#include <cmath>\nusing namespace std;\n\
  class DoingMath {\nprivate:\n    void square(double x) {  //参数 x 接收传递的值\n      \
  \  cout << \"The square of \" << x << \" is \" << x * x << endl;\n    }\nvoid squareRoot(double\
  \ x) {    //参数 x 接收传递的值\n        if (x < 0) {\n            cout << \"Cannot calculate\
  \ square root\" << endl;\n        }\n        else {\n            cout << \"Square\
  \ root of \" << x << \" is \" << sqrt(x) << endl;\n        }\n    }\npublic:\n \
  \   void displayResults(double x) {    //参数 x 接收传递的值\n        this->square(x);\n\
  \        this->squareRoot(x);\n    }\n}};\nint main() {\n    double b;\n    DoingMath\
  \ dm;\n    cout << \"Enter a number: \";\n    cin >> b;\n    dm.displayResults(b);\n\
  \    return 0;\n}\n```\n\n### 39.7 类继承\n\n类继承是面向对象编程（OOP）的核心概念之一。它允许你使用另一个类作为基类来编写类。当一个类基于另一个类时，程序员会说“它继承了另一个类”。被继承的类被称为父类、基类或超类。进行继承的类被称为子类、派生类或子类。\n\
  \n子类会自动继承父类的所有方法和字段。然而，最棒的部分是，你可以向子类添加额外的特征（方法或字段）。因此，当你需要编写几个共享许多共同特征但并不完全相同的类时，你就使用继承。要做到这一点，你的操作如下：首先，你编写一个包含所有共同特征的父类。接下来，你编写从父类继承所有这些共同特征的子类。最后，你添加每个子类特有的额外且独特的特征。就像人类一样，正是这些额外的、独特的特征使得子类与其父类区分开来，对吧？\n\
  \n假设你想写一个程序来跟踪学校里的老师和学生。他们有一些共同特征，如姓名和年龄，但他们也有特定的特征，例如老师的工资和学生的最终成绩，这些是不共有的。你在这里可以做的是写名为\
  \ `SchoolMember` 的父类，包含老师和学生共同的所有特征。然后你可以写两个名为 `Teacher` 和 `Student` 的子类，一个用于老师，一个用于学生。这两个子类都可以继承\
  \ `SchoolMember` 类，但必须相应地在 `Teacher` 和 `Student` 类中添加名为 `salary` 和 `finalGrade`\
  \ 的额外字段。\n\n这里显示了父类 `SchoolMember`：\n\n```cpp\nclass SchoolMember {\npublic:\n \
  \   string name;\n    int age;\n    //定义构造函数\nSchoolMember(string name, int age)\
  \ {\n        this->name = name;\n        this->age = age;\n        cout << \"A SchoolMember\
  \ was created\";\n    }\n\n```\n\n如果你想让一个类继承 `SchoolMember` 类，它的定义如下：\n\n```cpp\n\
  class SchoolMember {\nprivate:\n    //额外的私有字段\n    //额外的私有方法\npublic:\n    //额外的公有字段\n\
  \    //额外的公有方法\n    // 额外的构造函数\n}\n```\n\n这里的 `SchoolMember` 类的定义如下：\n\n```cpp\n\
  class SchoolMember {\npublic:\n    string name;\n    int age;\n    //定义构造函数\nSchoolMember(string\
  \ name, int age) {\n        this->name = name;\n        this->age = age;\n     \
  \   cout << \"A SchoolMember was created\";\n    }\n};\n```\n\n这里的 `SchoolMember`\
  \ 是 `Teacher` 的类。\n\n那么，`Teacher` 类的定义如下：\n\n```cpp\nclass Teacher : public SchoolMember\
  \ {\npublic:\n    double salary; //额外的字段\n    // 额外的构造函数\nTeacher(string name, int\
  \ age, double salary) : SchoolMember(name, age) {\n        this->salary = salary;\n\
  \        cout << \"A Teacher was created\";\n    }\n};\n```\n\n同样，`Student` 类的定义如下：\n\
  \n```cpp\nclass Student : public SchoolMember {\npublic:\n    string finalGrade;\
  \ //额外的字段\n    // 额外的构造函数\nStudent(string name, int age, string finalGrade) : SchoolMember(name,\
  \ age) {\n        this->finalGrade = finalGrade;\n        cout << \"A Student was\
  \ created\";\n    }\n};\n```\n\n完整的 C++ 程序如下：\n\n```cpp\n#include <iostream>\n#include\
  \ <string>\nusing namespace std;\nclass SchoolMember {\npublic:\n    string name;\n\
  \    int age;\n    //定义构造函数\nSchoolMember(string name, int age) {\n        this->name\
  \ = name;\n        this->age = age;\n        cout << \"A SchoolMember was created\"\
  ;\n    }\n};\n\nclass Teacher : public SchoolMember {\npublic:\n    double salary;\
  \ //额外的字段\n    // 额外的构造函数\nTeacher(string name, int age, double salary) : SchoolMember(name,\
  \ age) {\n        this->salary = salary;\n        cout << \"A Teacher was created\"\
  ;\n    }\n};\n\nclass Student : public SchoolMember {\npublic:\n    string finalGrade;\
  \ //额外的字段\n    // 额外的构造函数\nStudent(string name, int age, string finalGrade) : SchoolMember(name,\
  \ age) {\n        this->finalGrade = finalGrade;\n        cout << \"A Student was\
  \ created\";\n    }\n};\n\nint main() {\n    Teacher t1(\"Alice\", 40, 50000.0);\n\
  \    cout << endl;\n    Student s1(\"Bob\", 20, \"A\");\n    cout << endl;\n   \
  \ return 0;\n}\n```\n\n\n\n\n\n```cpp\n}//This is an additional method for this\
  \ class\nvoid displayValues() {\n    cout << \"Name: \" << this->name << endl;\n\
  \    cout << \"Age: \" << this->age << endl;\n    cout << \"Final grade: \" << this->finalGrade\
  \ << endl;\n}};\n\nint main() {\n    Teacher teacher1(\"Mr. John Scott\", 43, 35000);\n\
  \    Teacher teacher2(\"Mrs. Ann Carter\", 5, 32000);\n    Student student1(\"Mark\
  \ Nelson\", 14, \"A\");\n    Student student2(\"Mary Morgan\", 13, \"B\");\n   \
  \ teacher1.displayValues();\n    teacher2.displayValues();\n    student1.displayValues();\n\
  \    student2.displayValues();\n    return 0;\n}\n```\n\n### 39.8 复习题：判断对错\n\n对下列每个陈述判断对或错。\n\
  \n1) 在编写大型程序时，过程化编程优于面向对象编程。\n2) 面向对象编程关注对象。\n3) 对象将数据和功能结合在一起。\n4) 面向对象编程让你能够更容易维护代码，但你的代码无法被他人方便使用。\n\
  5) 你可以在不使用类的情况下创建对象。\n6) 创建类的新实例的过程被称为“安装（installation）”。\n7) 在 OOP 中，你必须为同一个类创建至少两个实例。\n\
  8) 构造函数方法在对象实例化时执行。\n9) 当你创建两个同类的实例时，该类的构造函数方法会执行两次。\n10) 字段上方的 `private` 关键字指定该字段可以从类外部访问。\n\
  11) 方法上方的 `public` 关键字指定该方法可以从类外部调用。\n12) 面向对象编程原则规定，类的数据应该是隐藏的，并防止被意外修改。\n13) Getter\
  \ 和 setter 方法提供了一种灵活的机制来读取、写入或计算字段的值。\n14) Getter 和 setter 方法暴露了类的内部实现。\n15) 类继承是\
  \ OOP（面向对象）的核心概念之一。\n16) 当一个类被继承时，它被称为“派生类（derived class）”。\n17) 父类会自动继承子类的所有方法和字段。\n\
