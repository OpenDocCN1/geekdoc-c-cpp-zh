  \ << values[i] << endl;\n        }\n    }\n    return 0;\n}\n```\n\n### 31.8 什么是\
  \ Map（映射）？\n\n在计算机科学中，map 和数组之间的主要区别是 map 元素可以使用键（key）来唯一标识，而不一定非要整数值。map 的每个键都与一个元素相关（如果你愿意的话，也可以称为映射）。map\
  \ 键的类型可以是 `string`、`int`、`double` 等。\n\n下面的示例展示了一个存储家庭成员的 map。该 map 的名称为 `family`，对应的键写在每个元素上方。\n\
  \n![Image](img/chapter31-10.png)\n\n![](img/notice.jpg)map 元素的键在 map 内部必须是唯一的。这意味着在\
  \ `family` 这个 map 中，例如，你不能有两个命名为 `father` 的键。\n\n![](img/notice.jpg)map 元素的值可以是任何类型。\n\
  \n### 31.9 在 C++ 中创建无序映射（Unordered Maps）\n\n让我们尝试使用最常用的方法来创建以下无序 map。\n\n![Image](img/chapter31-11.png)\n\
  \n##### 第一种方法\n\n要创建一个无序 map 并直接为其元素赋值，可以使用下面通用形式的 C++ 语句：\n\n```cpp\nunordered_map<key_type,\
  \ value_type> map_name = {{ key0, value0 },{ key1, value1 },{ key2, value3 },\n\
  // …\n// …\n{ keyM, valueM }};\n```\n\n其中：\n\n* `key_type` 是键的类型。它可以是 `string`、`int`、`double`\
  \ 等。\n* `value_type` 是元素的类型。可以是 `string`、`int`、`double` 等。\n* `map_name` 是无序 map\
  \ 的名称。\n* `key0`, `key1`, `key2`, … , `keyM` 是 map 元素的键。\n* `value0`, `value1`,\
  \ `value2`, … , `valueM` 是 map 元素的值。\n\n使用这种方法，可以使用以下语句创建无序 map `pupil`：\n\n```cpp\n\
  unordered_map<string, string> pupil = {{\"firstName\", \"Ann\"},{\"lastName\", \"\
  Fox\"},{\"age\", \"8\"},{\"class\", \"2nd\"}};\n```\n\n![](img/notice.jpg)每个键都用逗号（`,`）与其值隔开，元素包含在大括号\
  \ `{ }` 内并用逗号隔开，而所有内容包含在大括号 `{ }` 内。\n\n![](img/notice.jpg)在 第 5.4 节 中，你学习了为变量命名时必须遵循的规则。为无序\
  \ map 命名遵循完全相同的规则！\n\n![](img/notice.jpg)`unordered_map` 结构定义在库 `unordered_map`\
  \ 中。它在 C++ 中无法直接访问，因此你需要包含库 `unordered_map`。\n\n### 第二种方法\n\n在这种方法中，你可以使用下面通用形式的语句创建一个完全为空的无序\
  \ map：\n\n```cpp\nunordered_map<key_type, value_type> map_name;\n```\n\n然后按照下面通用形式的\
  \ C++ 语句添加一个元素（键-值对）：\n\n```cpp\nmap_name[key] = value;\n```\n\n使用这种方法，可以使用以下代码片段创建无序\
  \ map `pupil`：\n\n```cpp\nunordered_map<string, string> pupil;\npupil[\"firstName\"\
  ] = \"Ann\";\npupil[\"lastName\"] = \"Fox\";\npupil[\"age\"] = \"8\";\npupil[\"\
  class\"] = \"2nd\";\n```\n\n### 31.10 如何从无序 map 中获取值\n\n要获取特定 map 元素的值，必须使用其键指向该元素。下面的代码片段创建了一个无序\
  \ map 并显示它。\n\n```cpp\nunordered_map<string, string> olympians;\nolymans[\"Zeus\"\
  ] = \"King of the Gods\";\nolymans[\"Hera\"] = \"Marriage\";\nolymans[\"Poseidon\"\
  ] = \"God of the Sea\";\nolymans[\"Demeter\"] = \"Harvest\";\nolymans[\"Artemis\"\
  ] = \"Hunt\";\nolymans[\"Apollo\"] = \"Music\";\nolymans[\"Aphrodite\"] = \"Love\"\
  ;\nolymans[\"Hermes\"] = \"Messenger\";\nolymans[\"Athena\"] = \"Wisdom\";\nolymans[\"\
  Hephaistos\"] = \"Fire\";\nolymans[\"Dionysus\"] = \"Wine\";\n```\n\n![](img/notice.jpg)map\
  \ 元素的键在 map 内部必须是唯一的。这意味着在 `family` 这个 map 中，例如，你不能有两个命名为 `father` 的键。\n\n![](img/notice.jpg)map\
  \ 元素的值可以是任何类型。\n\n#### 练习 31.10-1 罗马数字转数字\n\n下面的表显示了罗马数字：\n\n| 数字 | 罗马数字 |\n| ---\
  \ | --- |\n| 1 | I |\n| 2 | II |\n| 3 | III |\n| 4 | IV |\n| 5 | V |\n\n编写一个 C++\
  \ 程序，提示用户输入一个 I 到 V 之间的罗马数字，然后显示对应的数字。假设用户输入有效值。\n\n解决方案如下。\n\n```cpp\n#include\
  \ <iostream>\n#include <unordered_map>\nusing namespace std;\nint main() {\n   \
  \ string romanNumeral;\n    int number;\n    unordered_map<string, int> roman2 =\
  \ {\"I\", 1}, {\"II\", 2}, {\"III\", 3}, {\"IV\", 4}, {\"V\", 5};\n    cout << \"\
  Enter a Roman numeral: \";\n    cin >> romanNumeral;\n    number = roman2[romanNumeral];\n\
  \    cout << romanNumeral << \": \" << number << endl;\n    return 0;\n}\n```\n\n\
  #### 练习 31.10-2 在无序 map 中不存在不存在的键\n\n以下 C++ 程序哪里错了？\n\n```cpp\nunordered_map<string,\
  \ string> family = {\"father\", \"John\"},{\"mother\", \"Maria\"},{\"son\", \"George\"\
  };\ncout << family[\"daughter\"] << endl;\n```\n\n##### 解决方案\n\n与数组类似，这段代码不满足确定性（definiteness）。你永远不能引用不存在的元素。由于没有\
  \ `daughter` 键，最后一条语句会抛出运行时错误。\n\n### 31.11 如何修改 map 元素的值\n\n要修改现有 map 元素的值，你需要使用相应的键并为该元素分配新值。接下来的示例展示了这一点。\n\
  \n```cpp\nunordered_map<string, string> tribes = {\"Indian\", \"Navajo\"},{\"African\"\
  , \"Zulu\"}};\ncout << tribes[\"Indian\"] << endl; // 输出: Navajo\ncout << tribes[\"\
  African\"] << endl; // 输出: Zulu\ntribes[\"Indian\"] = \"Apache\"; // 修改现有元素的值\n\
  cout << tribes[\"Indian\"] << endl; // 输出: Apache\ncout << tribes[\"African\"] <<\
  \ endl; // 输出: Zulu\n```\n\n#### 练习 31.11-1 为不存在的键赋值\n\n以下代码片段中有错误吗？\n\n```cpp\n\
  unordered_map<int, string> tribes = {{0, \"Navajo\"},{1, \"Cherokee\"},{2, \"Sioux\"\
  }};\ntribes[3] = \"Apache\";\n```\n\n##### 解决方案\n\n不，这次这段代码片段中完全没有错误。乍一看，你可能认为最后一条语句试图修改一个不存在的键并抛出错误。但对于\
  \ C++ 的无序 map 并非如此。由于 `tribes` 是一个无序 map 且键 `3` 不存在，最后一条语句向无序 map 添加了一个全新的第四个元素！\n\
  \n\n\n\n\n![](img/remember.jpg)无序映射（unordered map）的键可以是 `string`、`int`、`double`\
  \ 等类型。\n\n但记住，如果 `tribes` 实际上是一个数组，那么最后一条语句肯定会报错。查看以下代码片段：\n\n```cpp\nstring tribes[]\
  \ = {\"Navajo\", \"Cherokee\", \"Sioux\"};\ntribes[3] = \"Apache\";\n```\n\n在这个示例中，由于\
  \ `tribes` 是数组且索引 `3` 不存在，最后一条语句试图修改一个不存在的元素的值，显然会报错！\n\n### 31.12 如何遍历 map\n\n\
  要遍历 map 的元素，你可以使用 `for` 循环。以下是一个通用形式的代码片段\n\n```cpp\nfor (const auto& element :\
  \ map_name) {\n    process element.first;\n    process element.second;\n    process\
  \ map_name[element.first];\n}\n```\n\n其中：\n\n- ► `process` 是任何 C++ 语句或语句块，在每次迭代时处理无序映射\
  \ `map_name` 的一个元素。\n- ► `element.first` 是元素的键（key）。\n- ► `element.second` 是元素的值（value）。\n\
  \n下面的 C++ 程序显示字母 A、B、C、D 及其它们对应的摩斯密码。\n\n```cpp\nunordered_map<string, string> morseCode\
  \ = {{\"A\", \".-\"},{\"B\", \"-...\"},{\"C\", \"-.-.\"},{\"D\", \"-..\"}};\nfor\
  \ (const auto& element : morseCode) {\n    cout << element.first << \"  \" << element.second\
  \ << endl;\n}\n//或者你可以这样做\nfor (const auto& element : morseCode) {\n    cout <<\
  \ element.first << \"  \" << morseCode[element.first] << endl;\n}\n```\n\n下一个示例为一家计算机软件公司的每位员工发放了\
  \ $2000 的奖金！\n\n```cpp\nunordered_map<string, double> salaries = {{\"Project Manager\"\
  , 83000.0},{\"Software Engineer\", 81000.0},{\"Network Engineer\", 64000.0},{\"\
  Systems Administrator\", 61000.0},{\"Software Developer\", 70000.0}};\nfor (const\
  \ auto& x : salaries) {\n    salaries[x.first] = salaries[x.first] + 2000;\n}\n\
  ```\n\n### 31.13 复习题：判断对错\n\n对以下每个陈述判断对错。\n\n1) 数组是能够存储多个值的结构。\n2) 数组元素位于主内存（RAM）中。\n\
  3) 数组可以只有一维数组和二维数组。\n4) 不存在四维数组。\n5) 数组被称为“多维”数组，是因为它可以包含不同类型的值。\n6) 每个数组元素都有一个唯一的非负索引。\n\
  7) 无序映射中可以存在两个相同的键。\n8) 在数组中，索引编号默认始终从零开始。\n9) 最后一个数组元素的索引等于其元素的总数。\n10) 可以存在两百维数组。\n\
  11) 下述语句包含语法错误。`string[10] studentNames;`\n12) 在 C++ 程序中，两个数组不能有相同的名称。\n13) 下述语句在语法上是正确的。`unordered_map<string,\
  \ string> student = {{\"firstName\": \"Ann\"},{\"lastName\": \"Fox\"},{\"age\":\
  \ \"8\"}};`\n14) 在 C++ 程序中，两个数组不能有相同的元素数量。\n15) 你不能使用变量作为数组的索引。\n16) 你可以使用数学表达式作为数组的索引。\n\
  17) 你不能使用变量作为无序映射的键。\n18) 下述代码片段报错。`string a = \"a\"; unordered_map<string, string>\
  \ fruits = {{\"o\", \"Orange\"},{\"a\", \"Apple\"},{\"w\", \"Watermelon\"}}; cout\
  \ << fruits[a] << endl;`\n19) 如果你使用变量作为数组的索引，该变量必须包含一个整数值。\n20) 为了计算 20 个用户提供的数值之和，你必须使用数组。\n\
  21) 你可以使用语句 `cout << b[k]` 让用户向数组 `b` 输入一个值。\n22) 下述语句创建了一个包含两个空元素的一维数组。`string\
  \ names[3];`\n23) 下述代码片段将值 10 赋值给索引 7 的元素。`values[5] = 7; values[values[5]] = 10;`\n\
  24) 下述代码片段将不带双引号的“Sally”赋值给索引 2 的元素。`string names[3]; names[2] = \"John\"; names[1]\
