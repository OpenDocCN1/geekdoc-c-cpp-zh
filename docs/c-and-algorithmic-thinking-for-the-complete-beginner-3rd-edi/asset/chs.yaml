  \ names[] = {\"John\", \"George\", \"Sally\"};`\n26) 下述代码片段在屏幕上显示不带双引号的“Sally”。`string\
  \ names[3]; k = 0; names[k] = \"John\"; k++; names[k] = \"George\"; k++; names[k]\
  \ = \"Sally\"; k--; cout << names[k] << endl;`\n27) 下述代码片段在语法上是正确的。`string names[]\
  \ = {\"John\", \"George\", \"Sally\"}; cout << names[] << endl;`\n28) 下述代码片段在屏幕上显示不带双引号的“Maria”。`string\
  \ names[] = {\"John\", \"George\", \"Sally\", \"Maria\"}; cout << names[(int)M_PI]\
  \ << endl;`\n29) 下述代码片段满足确定性（definiteness）。`string grades[] = {\"B+\", \"A+\", \"\
  A\"}; cout << grades[3] << endl;`\n30) 下述代码片段满足确定性。`int v[] = {1, 3, 2, 9}; cout\
