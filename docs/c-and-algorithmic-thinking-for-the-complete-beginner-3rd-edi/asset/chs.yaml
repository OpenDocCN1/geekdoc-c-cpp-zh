  \ `i ≤ 5` 求值结果为 `true`，执行语句 `Write i` 并在屏幕上显示值 `1`。变量 `i` 加 1，执行流回到菱形符号正上方的点。布尔表达式再次求值为\
  \ `true`，显示值 `2`，该过程重复进行。在第 `5^(th)` 次迭代中，显示值 `5`，变量 `i` 的值变为 `6`，布尔表达式求值为为 `false`，执行流退出循环。\n\
  \n![Image](img/chapter26-02.png)\n\n当变量 `counter` 增加（或减少）`1` 时，使用复合赋值运算符甚至自增（或自减）运算符会更方便。。接下来的示例使用自增运算符\
  \ `++` 显示了从 `1` 到 `10` 的数字。\n\n![](img/my_exercise_header.png) project_26.1b\n```cpp\n\
  #include <iostream>\nusing namespace std;\nint main() {\n    int i;\n    for (i\
  \ = 1; i <= 10; i++) {\n        cout << i << endl;\n    }\n    return 0;\n}\n```\n\
  \n接下来的示例使用复合赋值运算符 `-=` 显示了从 `10` 到 `2` 的偶数。\n\n![](img/my_exercise_header.png) project_26.1c\n\
  ```cpp\n#include <iostream>\nusing namespace std;\nint main() {\n    int i;\n  \
  \  for (i = 10; i >= 2; i -= 2) {\n        cout << i << endl;\n    }\n    return\
  \ 0;\n}\n```\n\n![](img/notice.jpg)注意，当 `counter`（此处为 `i`）递减时，比较运算符应为 `>=`，当 `counter`\
  \ 增加时应为 `<=`。\n\n虽然不推荐这样做，但由于 `for` 循环实际上是一个预测试循环结构，你可以将 `for` 语句替换为 `while` 语句。上一个示例可以使用\
  \ `while` 语句写如下。\n\n![](img/my_exercise_header.png) project_26.1d\n```cpp\n#include\
  \ <iostream>\nusing namespace std;\nint main() {\n    int i;\n    i = 10;\n    while\
  \ (i >= 2) {\n        cout << i << endl;\n        i -= 2;\n    }\n    return 0;\n\
  }\n```\n\n接下来的示例使用变量而非常数值 `initial_value`、`final_value` 和 `offset` 来显示了从 `-2` 到\
  \ `-10` 的偶数。\n\n![](img/my_exercise_header.png) project_26.1e\n```cpp\n#include\
  \ <iostream>\nusing namespace std;\nint main() {\n    int i;\n    int x1 = -2, x2\
  \ = -10, t = -2;\n    for (i = x1; i >= x2; i += t) {\n        cout << i << endl;\n\
  \    }\n    return 0;\n}\n```\n\n![](img/notice.jpg)千万不要尝试在循环内部修改 `counter`（此处为\
  \ `i`）的值！同样适用于 `initial_value`（此处为 `x1`）、`final_value`（此处为 `x2`）和 `offset`（此处为 `t`）。这会让你的代码变得不可读，并可能导致错误结果。如果你坚持要这样做，请使用\
