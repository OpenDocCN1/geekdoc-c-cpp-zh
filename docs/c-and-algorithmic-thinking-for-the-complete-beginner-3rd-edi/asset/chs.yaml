  \ 个格子的米数。如果你需要找到棋盘上的总米数，可以叠加所有格子的米数，即 1 + 2 + 4 + 8 = 15。\n\n在现实世界中，真正的棋盘包含 8 ×\
  \ 8 = 64 个格子，因此你需要迭代 63 次。C++ 程序如下。\n\n```cpp\n#include <iostream>\nusing namespace\
  \ std;\n\nint main() {\n    int i;\n    unsigned long long grains, total;\n    double\
  \ weight;\n    total = grains = 1;\n    for (i = 2; i <= 64; i++) {\n        grains\
  \ = 2 * grains;\n        total = total + grains;\n    }\n    weight = total / 30000.0;\n\
  \    cout << total << \"  \" << weight << endl;\n    return 0;\n}\n```\n\n如果你好奇这些数字有多大，这里是答案：棋盘上将会有\
  \ 18,446,744,073,709,551,615 粒米；即 614,891,469,123,651.8 磅！\n\n不将变量 `grains` 和 `total`\
  \ 声明为 `int` 甚至 `long` 的原因是这两种类型无法容如此巨大的数字。`long` 类型的上限是 +2⁶³ − 1，遗憾的是，这仍然不够。\n\n\
  ## 练习题 30.6-3 仅仅是调查\n\n一家民意调查公司询问 1000 名市民他们早上是否吃早餐。编写一个 C++ 程序，提示市民输入性别（M 代表男性，F\
  \ 代表女性，O 代表其他）以及对该问题的回答（Y 代表是，N 代表否，S 代表有时），然后计算并显示回答“是”的市民人数，以及在回答“否”的市民中女性的百分比。使用循环控制结构，程序还必须验证数据输入，并且性别只接受值\
  \ M、F 或 O，回答只接受值 Y、N 或 S。\n\n##### 解决方案\n\n该 C++ 程序如下。\n\n```cpp\n#include <iostream>\n\
  #include <boost/algorithm/string.hpp>\nusing namespace boost::algorithm;\nusing\
  \ namespace std;\n\nconst int CITIZENS = 1000;\n\nint main() {\n    int totalYes,\
  \ femaleNo, i;\n    string gender, answer;\n    totalYes = femaleNo = 0;\n    for\
  \ (i = 1; i <= CITIZENS; i++) {\n        do {\n            cout << \"Enter gender:\
  \ \";\n            cin >> gender;\n            gender = to_lower_copy(gender);\n\
  \        } while (gender != \"m\" && gender != \"f\" && gender != \"o\");\n    \
  \    do {\n            cout << \"Do you eat breakfast in the morning? \";\n    \
  \        cin >> answer;\n            answer = to_lower_copy(answer);\n        }\
  \ while (answer != \"y\" && answer != \"n\" && answer != \"s\");\n        if (answer\
  \ == \"y\") {\n            totalYes++;\n        }\n        if (gender == \"f\" &&\
  \ answer == \"n\") {\n            femaleNo++;\n        }\n    }\n    cout << totalYes\
  \ << \"  \" << femaleNo * 100 / (double)CITIZENS << \"%\" << endl;\n    return 0;\n\
  }\n```\n\n## 练习题 30.6-4 判定消息是回文吗？\n\n回文是指正读和反读都相同的单词或句子。（你可能记得在练习题 23.5-4 中数字也可以是回文）。编写一个\
  \ C++ 程序，提示用户输入一个单词或句子，然后显示消息，说明用户提供的单词或句子是否为回文。以下是一些回文单词和消息。\n\n-   Anna\n-   Radar\n\
  -   Madam\n-   A nut for a jar of tuna.\n-   Dennis and Edna sinned.\n-   Murder\
  \ for a jar of red rum.\n-   Borrow or rob?\n-   Are we not drawn onward, we few,\
  \ drawn onward to new era?\n\n##### 解决方案\n\n在开始逐个比较字母并检查第一个字母是否与最后一个相同、第二个字母是否与倒数相同的相同以此类推之前，你需要记住几点。\n\
  \n-   在给定的句子或单词中，某些字母可能是大写的，某些可能是小写的。例如，在句子“A nut for a jar of tuna”中，虽然第一个和最后一个相同，但它们并不被认为是相等。因此，程序在开始比较之前，必须先将所有字母转换为（例如小写）。\n\
  -   移除空格、句号、问号和逗号等字符对于程序准确比较至关重要。\n\n\n\n\n\n### 第二种方法\n\n之前的方法可以正常工作，但假设用户输入了一个非常长且不是回文句子；例如，它的第二个字母与最后一个字母不同。遗憾的是，在之前的方法中，尽管变量\
  \ `palindrome` 从第二次迭代开始就被设置为 `false`，但最后一个 `for` 循环仍然会继续迭代到句子的中间。因此，让我们尝试让这个程序变得更好。正如你已经所知道的，你可以使用\
  \ `break` 语句在循环完成所有迭代之前跳出。\n\n此外，由于只有四种不同的字符需要删除（空格、逗号、句号和问号），你只需要调用四次函数 `replace_all_copy()`，就可以避免第一个循环，如下所示的\
  \ C++ 所示所示。\n\n```cpp\n#include <iostream>\n#include <boost/algorithm/string.hpp>\n\
  using namespace boost::algorithm;\nusing namespace std;\n\nint main() {\n    int\
  \ i, middlePos, j;\n    string message, messageClean;\n    bool palindrome;\n  \
  \  cout << \"Enter a message: \";\n    getline(cin, message);\n    message = to_lower_copy(message);\n\
  \    //创建一个新字符串，其中包含除空格、逗号、句号和问号以外的所有字符\n    messageClean = replace_all_copy(message,\
  \ \"  \", \"\");\n    messageClean = replace_all_copy(messageClean, \",\", \"\"\
  );\n    messageClean = replace_all_copy(messageClean, \".\", \"\");\n    messageClean\
  \ = replace_all_copy(messageClean, \"?\", \"\");\n    j = messageClean.length()\
  \ - 1;\n    middlePos = (int)(j / 2);\n    palindrome = true;\n    for (i = 0; i\
  \ <= middlePos; i++) {\n        if (messageClean[i] != messageClean[j]) {\n    \
  \        palindrome = false;\n            break;\n        }\n        j--;\n    }\n\
  \    if (palindrome) {\n        cout << \"The message is palindrome\" << endl;\n\
  \    }\n    return 0;\n}\n```\n\n显然，一个问题有很多解决方案。找到最优取决于取决于！\n\n如果你想删除所有不需要的字符（空格、逗号、句号、问号、&\
  \ 符号等），可以使用下面的代码段。它只在变量 `messageClean` 中保留字母！\n\n```cpp\n//创建一个只包含字母的新字符串\nmessageClean\
  \ = \"\";\nstring validChars = \"abcdefghijklmnopqrstuvwxyz\";\nfor (i = 0; i <\
  \ message.length(); i++) {\n    if (validChars.find(message[i]) != -1) {\n     \
  \   messageClean += message[i];   // 拼接\n    }\n}\n```\n\n### 30.7 复习题：判断对错\n\n\
  请对下列每个陈述选择对或错。\n\n1) 数据验证是限制数据输入的过程，强制用户只输入有效值。\n2) 你可以使用确定次数循环来验证数据输入。\n3) 为了强制用户只输入正数且不显示任何错误信息，可以使用下面的代码段。\n\
