  ### 练习 34.6-5 夏季奥运会射箭\n\n在夏季奥运会的射箭比赛，20 名运动员每人射六支箭。编写一个 C++ 程序，提示用户输入每位运动员的名字以及每支箭的得分。程序必须根据哪位运动员获得最高分，显示获得金牌、银牌和铜牌的三位运动员的名字。假设没有两个运动员的总分相等。\n\
