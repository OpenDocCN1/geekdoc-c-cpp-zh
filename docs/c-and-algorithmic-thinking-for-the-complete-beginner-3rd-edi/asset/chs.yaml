  \ 和 `b` 对应位置的最大值。\n\n##### 解决方案\n\n\n\n\n这里没有新内容！你需要两个 `for-loops` 来读取数组 `a` 和 `b`\
  \ 的值，一个用于创建数组 `newArr`，另一个用于在屏幕上显示数组 `newArr`。\n\nC++ 程序所示所示。\n\n![](img/my_exercise_header.png)\
  \ project_34.1-2\n```cpp\n#include <iostream>\nusing namespace std;\nconst int ELEMENTS\
  \ = 20;\nint main() {\n    int i;\n    //Read arrays a and b\n    double a[ELEMENTS];\n\
  \    for (i = 0; i <= ELEMENTS - 1; i++) {\n        cin >> a[i];\n    }\n    double\
  \ b[ELEMENTS];\n    for (i = 0; i <= ELEMENTS - 1; i++) {\n        cin >> b[i];\n\
  \    }\n    //Create array newArr\n    double newArr[ELEMENTS];\n    for (i = 0;\
  \ i <= ELEMENTS - 1; i++) {\n        if (a[i] > b[i]) {\n            newArr[i] =\
  \ a[i];\n        } else {\n            newArr[i] = b[i];\n        }\n    }\n   \
  \ //Display array newArr\n    for (i = 0; i <= ELEMENTS - 1; i++) {\n        cout\
  \ << newArr[i] << endl;\n    }\n    return 0;\n}\n```\n\n#### 练习 34.1-3 合并一维数组\n\
  \n编写一个 C++ 程序，对于两个分别包含 10 和 15 个元素的给定数组 `a` 和 `b`，创建一个包含 25 个元素的新数组 `newArr`。这个新数组必须在前\
  \ 10 个位置包含数组 `a` 的元素，在接下来的 15 个位置包含数组 `b` 的元素。\n\n解决方案\n\n如接例所示，数组 `a` 的元素索引位置与数组\
  \ `newArr` 的索引位置之间存在直接的一一对应关系。具体来说，数组 `a` 位置 0 的元素存储在数组 `newArr` 的位置 0，数组 `a` 位置\
  \ 1 的元素存储在数组 `newArr` 的位置 1，以此类推。然而，这种对应关系不适用于数组 `b`；它的元素在 `newArr` 中需要移动 10 位。\n\
  \n![Image](img/chapter34-02.png)\n\n为了将数组 `a` 的值赋值给数组 `newArr`，你可以使用以下代码片段。\n\n\
  ```cpp\nfor (i = 0; i <= ELEMENTS_OF_A - 1; i++) {newArr[i] = a[i];}\n```\n\n然而，将数组\
  \ `b` 的值赋值给数组 `newArr`，你的代码片段应该略有不同，如下：\n\n```cpp\nfor (i = 0; i <= ELEMENTS_OF_B\
  \ - 1; i++) {newArr[ELEMENTS_OF_A + i] = b[i];}\n```\n\n最终的 C++ 程序如下。\n\n![](img/my_exercise_header.png)\
  \ project_34.1-3\n```cpp\n#include <iostream>\nusing namespace std;\nint main()\
  \ {\n    int i;\n    //Create arrays a and b\n    int a[] = { 5, 10, 9, 6, 7, -6,\
  \ 13, 12, 11, 2 };\n    int b[] = { -11, 25, 4, 45, 67, 87, 34, 23, 33, 55, 13,\
  \ 15, -4, -2, -22 };\n    //Calculate the number of elements of the arrays a, b,\
  \ and newArr\n    const int ELEMENTS_OF_A = sizeof(a) / sizeof(a[0]);\n    const\
  \ int ELEMENTS_OF_B = sizeof(b) / sizeof(b[0]);\n    const int ELEMENTS_OF_NEW_ARR\
  \ = ELEMENTS_OF_A + ELEMENTS_OF_B;\n    //Create array newArr\n    int newArr[ELEMENTS_OF_NEW_ARR];\n\
  \    for (i = 0; i <= ELEMENTS_OF_A - 1; i++) {\n        newArr[i] = a[i];\n   \
  \ }\n    for (i = 0; i <= ELEMENTS_OF_B - 1; i++) {\n        newArr[ELEMENTS_OF_A\
  \ + i] = b[i];\n    }\n    //Display array newArr\n    for (i = 0; i <= ELEMENTS_OF_NEW_ARR\
  \ - 1; i++) {\n        cout << newArr[i] << \"\\t\";\n    }\n    return 0;\n}\n\
  ```\n\n#### 练习 34.1-4 创建两个数组 – 分离正负值\n\n编写一个 C++ 程序，允许用户向数组中输入 100 个数值，然后创建两个新数组\
  \ `pos` 和 `neg`。数组 `pos` 必须包含正值，而数组 `neg` 必须包含负值。数值 0（如果有的话）不应添加到任何一个最终数组 `pos`\
  \ 或 `neg` 中。\n\n解决方案\n\n让我们使用下面的示例来分析这种方法。\n\n![Image](img/chapter34-03.png)\n\n\
  在这个练习中，数组 `ar` 的元素索引位置与数组 `pos` 和 `neg` 之间不存在一一对应关系。例如，数组 `ar` 位置 1 的元素并不存储在 `neg`\
  \ 的位置 1，或者数组 `ar` 位置 2 的元素并不存储在 `pos` 的位置 2。因此，你不能这样做：\n\n```cpp\nfor (i = 0; i\
  \ <= ELEMENTS - 1; i++) {if (ar[i] > 0) {\n    pos[i] = ar[i];\n}else if (ar[i]\
  \ < 0) {\n    neg[i] = ar[i];}}\n```\n\n因为这会导致以下两个数组。\n\n![Image](img/chapter34-04)\n\
  \n在这里需要两个独立的索引变量：数组 `pos` 的 `posIndex` 和数组 `neg` 的 `negIndex`。这些索引变量必须在元素添加到相应的数组时独立地增加。索引变量\
  \ `posIndex` 只有在元素添加到数组 `pos` 时才增加，而索引变量 `negIndex` 只有在元素添加到数组 `neg` 时才增加，如下代码所示。\n\
  \n```cpp\nposIndex = 0;\nnegIndex = 0;\nfor (i = 0; i <= ELEMENTS - 1; i++) {\n\
  \    if (ar[i] > 0) {\n        pos[posIndex] = ar[i];\n        posIndex++;\n   \
  \ }else if (ar[i] < 0) {\n        neg[negIndex] = ar[i];\n        negIndex++;\n\
  \    }\n}\n```\n\n这可以等价地写为：\n\n```cpp\nposIndex = 0;\nnegIndex = 0;\nfor (i = 0;\
  \ i <= ELEMENTS - 1; i++) {\n    if (ar[i] > 0) {\n        pos[posIndex] = ar[i];\n\
  \        posIndex++;\n    }else if (ar[i] < 0) {\n        neg[negIndex] = ar[i];\n\
  \        negIndex++;\n    }\n}\n```\n\n注意 `posIndex` 和 `negIndex` 具有双重作用。当循环迭代时，它们指向新数组的下一个位置。此外，当创建新数组的循环结束时，这些变量的值也与数组中的元素总数匹配！完整的解决方案如下。\n\
  \n![](img/my_exercise_header.png) project_34.1-4\n```cpp\n#include <iostream>\n\
  using namespace std;\nconst int ELEMENTS = 100;\nint main() {\n    int i;\n    double\
  \ ar[ELEMENTS];\n    for (i = 0; i <= ELEMENTS - 1; i++) {\n        cin >> ar[i];\n\
  \    }\n    //Create arrays pos and neg\n    posIndex = 0;\n    negIndex = 0;\n\
  \    double pos[ELEMENTS];\n    double neg[ELEMENTS];\n    for (i = 0; i <= ELEMENTS\
  \ - 1; i++) {\n        if (ar[i] > 0) {\n            pos[posIndex] = ar[i];\n  \
  \          posIndex++;\n        }else if (ar[i] < 0) {\n            neg[negIndex]\
  \ = ar[i];\n            negIndex++;\n        }\n    }\n    for (i = 0; i <= posIndex\
  \ - 1; i++) {\n        cout << pos[i] << \"\\t\";\n    }\n    cout << endl;\n  \
  \  for (i = 0; i <= negIndex - 1; i++) {\n        cout << neg[i] << \"\\t\";\n \
  \   }\n    return 0;\n}\n```\n注意数组 `pos` 和 `neg` 分别包含 `posIndex` 和 `negIndex` 个元素。这就是为什么最后一个循环结构一直迭代到\
  \ `ELEMENTS - 1`，正如你误预期的那样。\n\n#### 练习 34.1-5 创建包含数字 5 的数组\n\n编写一个 C++ 程序，允许用户向数组输入\
  \ 100 个两位整数，然后创建一个仅包含至少一个数字 5 的数组。\n\n解决方案\n\n这个练习需要以前的知识。在练习 13 中，你学习了如何使用商和余数将一个整数拆分为各个数字。在这里，用户提供的整数是两位数；因此你可以使用以下代码片段拆分变量\
  \ `x` 中的任何两位整数。\n\n```cpp\nlastDigit = x % 10;\nfirstDigit = (int)(x / 10);\n```\n\
  \n接下来的程序使用额外变量作为新数组的索引。当你想要使用旧数组中的值创建新数组且它们的索引位置之间不存在一一对应关系时，这是必要的。当然，只有当新元素添加到新数组中时，该变量才增加\
  \ 1。此外，当创建新数组的循环结束时，该变量的值也与新数组中的元素总数匹配！最终的 C++ 程序如下。\n\n![](img/my_exercise_header.png)\
  \ project_34.1-5\n```cpp\n#include <iostream>\nusing namespace std;\nconst int ELEMENTS\
  \ = 100;\nint main() {\n    int i, k, lastDigit, firstDigit;\n    int a[ELEMENTS];\n\
  \    for (i = 0; i <= ELEMENTS - 1; i++) {\n        cin >> a[i];\n    }\n    k =\
  \ 0;\n    int b[ELEMENTS];\n    for (i = 0; i <= ELEMENTS - 1; i++) {\n        lastDigit\
  \ = a[i] % 10;\n        firstDigit = (int)(a[i] / 10);\n        if (lastDigit ==\
  \ 5 || firstDigit == 5) {\n            b[k++] = a[i];\n        }\n    }\n    for\
  \ (i = 0; i <= k - 1; i++) {\n        cout << b[i] << \"\\t\";\n    }\n    return\
  \ 0;\n}\n```\n\n\n\n\n正如你已经在第 30.3 节中学习过的那样，有三种方法可以用于验证数据输入。你的方法取决于你是否希望显示错误消息，以及你是希望为每种输入错误显示不同的错误消息，还是对任何类型的错误显示一个通用的错误消息。让我们看看如何将这三种方法调整并应用于数组。\n\
  \n#### 第一种方法 – 不带错误消息的数据输入验证\n\n在第 30.3 节中，你学习了如何在不显示任何错误消息的情况下验证用户输入的单个值。为了方便起见，这里再次给出了通用形式给出的代码片段。\n\
  \n```cpp\ndo {cout << \"Prompt message\";cin >> input_data;} while (input_data test\
  \ 1 fails || input_data test 2 fails || …);\n```\n\n你还记得它是如何运行的吗？如果用户输入有效值，执行流将直接进入程序的下一个部分。然而，如果他们输入无效值，主要目标是反复提示他们，直到他们最终提供有效值为止。\n\
  \n在向数组中输入数据时，你可以使用相同的原理。如果你使用 `for` 循环遍历数组的所有元素，代码片段将如下。\n\n```cpp\nfor (i = 0;\
  \ i <= ELEMENTS - 1; i++) {do {\n\n> cout << \"Prompt message\";\n\n> cin >> input_data;\n\
  \n} while (input_data test 1 fails || input_data test 2 fails || …);input_array[i]\
  \ = input_data;}\n```\n\n如你所示，当执行流退出嵌套的后置测试循环结构时，变量 `input_data` 绝对包含一个有效值，该值随后赋值给数组\
  \ `input_array` 的元素。然而，可以使用更简单的方法实现相同的过程，无需使用额外的变量 `input_data`，如下：\n\n```cpp\n\
  for (i = 0; i <= ELEMENTS - 1; i++) {do {\n\n> cout << \"Prompt message\";\n\n>\
  \ cin >> input_array[i];\n\n} while (input_array[i] test 1 fails || input_array[i]\
  \ test 2 fails || … );}\n```\n\n#### 第二种方法 – 带有通用错误消息的数据输入验证\n\n与之前一样，下一个代码片段取自第\
  \ 30.3 节 并调整为适用于数组操作。它验证数据输入并显示通用错误消息（即对任何类型的输入错误显示相同的错误消息）。\n\n```cpp\nfor (i =\
  \ 0; i <= ELEMENTS - 1; i++) {cout << \"Prompt message\";cin >> input_array[i];while\
  \ (input_array[i] test 1 fails || input_array[i] test 2 fails || … ) {\n\n> cout\
  \ << \"Error message\" << endl;\n\n> cout << \"Prompt message\";\n\n> cin >> input_array[i];\n\
  \n}}\n```\n\n#### 第三种方法 – 带有不同错误消息的数据输入验证\n\n再次，下一个代码片段取自第 30.3 节 并调整为适用于数组操作。它验证数据输入并为每种输入错误显示不同的错误消息。\n\
  \n```cpp\nfor (i = 0; i <= ELEMENTS - 1; i++) {do {\n\n> cout << \"Prompt message\"\
  ;\n\n> cin >> input_array[i];\n\n> failure = false;\n\n> if (input_array[i] test\
  \ 1 fails) {\n\n> > cout << \"Error message 1\" << endl;\n\n> > failure = true;\n\
  \n> }\n\n> else if (input_array[i] test 2 fails) {\n\n> > cout << \"Error message\
  \ 2\" << endl;\n\n> > failure = true;\n\n> }\n\n> else if (…\n\n> …\n\n> }\n\n}\
  \ while (failure);}\n```\n\n### 练习 34.2-1 逆序显示奇数\n\n编写一个 C++ 程序，提示用户向数组中输入 20 个奇数正整数，然后按照它们提供的顺序的完全相反顺序显示它们。程序必须验证数据输入，防止用户输入非正值、浮点数或偶数。分三个版本解决此练习题：\n\
  \na) 验证数据输入但不显示任何错误消息。\nb) 验证数据输入并显示通用错误消息。\nc) 验证数据输入并为每种输入错误显示不同的错误消息。\n\n#####\
  \ 答案\n\n这里将介绍你在第 34.2 节中学习的所有三种数据输入验证方法。让我们先在不进行数据验证的情况下解决这个练习。\n\n```cpp\nconst\
  \ int ELEMENTS = 20;\nint main() {\nint i, x;\nint odds[ELEMENTS];\nfor (i = 0;\
  \ i <= ELEMENTS - 1; i++) {\n\n> cout << \"Enter an odd positive integer: \";  \
  \ \n\n> cin >> x;\n\n> odds[i] = x;\n\n}//倒序显示元素\nfor (i = ELEMENTS - 1; i >= 0;\
  \ i--) {\n\n> cout << odds[i] << \"\\t\";\n\n}return 0;}\n```\n\n##### **不带错误消息的验证**\n\
  \n要在不显示任何错误消息的情况下验证数据输入，请使用第 34.2 节中的第一种方法。只需将虚矩形标记的语句替换为以下代码片段。\n\n```cpp\ndo {cout\
  \ << \"Enter an odd positive integer: \";cin >> x;} while (x <= 0 || x != (int)x\
  \ || (int)x % 2 == 0);odds[i] = (int)x;\n```\n\n最终程序变为：\n\n![](img/my_exercise_header.png)\
  \ project_34.2-1a\n```cpp\n#include <iostream>\nusing namespace std;\nconst int\
  \ ELEMENTS = 20;\nint main() {\nint i;\ndouble x;\nint odds[ELEMENTS];\nfor (i =\
  \ 0; i <= ELEMENTS - 1; i++) {\n\n> do {                          \n\n> > cout <<\
  \ \"Enter an odd positive integer: \";\n\n> > cin >> x;\n\n> } while (x <= 0 ||\
