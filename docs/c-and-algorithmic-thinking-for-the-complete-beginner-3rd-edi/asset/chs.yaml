  \ = a + b;` |\n| −= | 减法赋值 | `a −= b;` | `a = a − b;` |\n| *= | 乘法赋值 | `a *= b;`\
  \ | `a = a * b;` |\n| /= | 除法赋值 | `a /= b;` | `a = a / b;` |\n| %= | 取模赋值 | `a %=\
  \ b;` | `a = a % b;` |\n\n![](img/notice.jpg)记住在流程图中，本书仅使用“等于”列所示常用运算符。例如，C++ 语句\
  \ `a += b` 在流程图中表示为\n\n![Image](img/chapter07-12.png)\n\n#### 练习 7.4-1 哪些 C++ 语句语法上是正确的？\n\
  \n以下哪些 C++ 赋值语句在语法上是正确的？\n\ni) `a = −10;`\nii) `10 = b;`\niii) `aB = aB + 1;`\n\
  iv) `a = \"COWS\";`\nv) `a = COWS;`\nvi) `a + b = 40;`\nvii) `a = 3 b;`\nviii) `a\
  \ = \"true\";`\nix) `a = true;`\nx) `a /= 2;`\nxi) `a += 1;`\nxii) `a =* 2;`\n\n\
  **解**\n\ni) 正确。它将整数值 `-10` 赋值给变量 `a`。\nii) 错误。在赋值运算符的左侧只能存在变量。\niii) 正确。它将变量 `aB`\
  \ 增加了 1。\niv) 正确。它将字符串 “COWS”（不带双引号）赋值给变量 `a`。\nv) 正确。它将常量（甚至是变量）`COWS` 的内容赋值给 `a`。\n\
  vi) 错误。在赋值运算符的左侧只能存在变量（而不是表达式）。\nvii) 错误。它应该写为 `a = 3 * b`。\nviii) 正确。它将字符串 “true”（不带双引号）赋值给变量\
  \ `a`。\nix) 正确。它将值 `true` 赋值给变量 `a`。\nx) 正确。这等同于 `a = a / 2`。\nxi) 正确。等同于 `a = a\
  \ + 1`。\nxii) 错误。它应该写为 `a *= 2`（等同于 `a = a * 2`）。\n\n#### 练习 7.4-2 寻找变量类型\n\n以下每个变量的类型是什么？\n\
  \ni) `a = 15;`\nii) `width = \"10 meters\";`\niii) `b = \"15\";`\niv) `temp = 13.5;`\n\
  v) `b = true;`\nvi) `b = \"true\";`\n\n**解**\n\ni) 值 `15` 属于整数集，因此变量 `a` 是整数。\n\
  ii) 值 “10 meters” 是文本，因此变量 `width` 是一个字符串。\niii) 值 “15” 是文本，因此变量 `b` 是字符串。\niv)\
  \ 值 `13.5` 属于实数集，因此变量 `temp` 是实数（float）。\nv) 值 `true` 是布尔值，因此变量 `b` 是布尔值。\nvi) 值\
  \ “true” 是文本，因此变量 `b` 是字符串。\n\n7.5 增/减运算符\n\n在流程图中，本书仅使用“等于”列所示的常用运算符。例如，C++ 语句\
