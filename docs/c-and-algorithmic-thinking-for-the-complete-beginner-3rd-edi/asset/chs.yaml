  Even\" << endl;\n    } else {\n        cout << \"Odd\" << endl;\n    }\n    return\
  \ 0;\n}\n```\n\n#### 练习 17.1-5 周薪\n\n总工资取决于薪率和每周工作的总小时数。然而，如果某人工作超过 `40` 小时，他们超过\
  \ `40` 小时的所有小时将获得加班工资。设计一个流程图并编写相应的 C++ 程序，让用户输入薪率和工作时长，然后计算并显示总工资。\n\n##### 答案\n\
  \n这个练习可以使用双路择一决策结构解决。当小时超过 `40` 时，总工资的计算公式为：\n`gross pay = payRate * 40 + 1.5 *\
  \ payRate * (hoursWorked - 40)`\n\n解决此问题的流程图所示。\n\n![Image](img/chapter17-06.png)\n\
  \nC++ 程序在此处。\n\n```cpp\n#include <iostream>\nusing namespace std;\nint main() {\n\
  \    int hoursWorked;\n    double payRate, grossPay;\n    cin >> payRate;\n    cin\
  \ >> hoursWorked;\n    if (hoursWorked <= 40) {\n        grossPay = payRate * hoursWorked;\n\
  \    } else {\n        grossPay = payRate * 40 + 1.5 * payRate * (hoursWorked -\
  \ 40);\n    }\n    cout << \"Gross Pay: \" << grossPay << endl;\n    return 0;\n\
  }\n```\n\n### 17.2 复习题：判断题\n\n对以下每个陈述进行判断对或错。\n\n1) 双路择一决策结构中的语句可能一个都不执行。\n2) 双路择一决策结构必须包含两个语句。\n\
