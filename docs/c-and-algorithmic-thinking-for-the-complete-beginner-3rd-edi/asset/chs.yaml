  \ `for`-循环来将数组 `x` 的元素复制到数组 `auxX` 中。\n\n### 37.7 将代码部分转换为子程序\n\n编写大型程序而不将其划分为较小的子程序会导致代码难以理解或维护。假设你有一个大型程序，并希望将其划分为较小的子程序。下一个程序是一个解释必须遵循的步骤的示例。程序中用虚线矩形标记的部分必须转换为子程序。\n\
