  vi) 错误。在赋值运算符的左侧只能存在变量（而不是表达式）。\nvii) 错误。它应该写为 `a = 3 * b`。\nviii) 正确。它将字符串 “true”（不带双引号）赋值给变量\
  \ `a`。\nix) 正确。它将值 `true` 赋值给变量 `a`。\nx) 正确。这等同于 `a = a / 2`。\nxi) 正确。等同于 `a = a\
  \ + 1`。\nxii) 错误。它应该写为 `a *= 2`（等同于 `a = a * 2`）。\n\n#### 练习 7.4-2 寻找变量类型\n\n以下每个变量的类型是什么？\n\
  \ni) `a = 15;`\nii) `width = \"10 meters\";`\niii) `b = \"15\";`\niv) `temp = 13.5;`\n\
  v) `b = true;`\nvi) `b = \"true\";`\n\n**解**\n\ni) 值 `15` 属于整数集，因此变量 `a` 是整数。\n\
  ii) 值 “10 meters” 是文本，因此变量 `width` 是一个字符串。\niii) 值 “15” 是文本，因此变量 `b` 是字符串。\niv)\
  \ 值 `13.5` 属于实数集，因此变量 `temp` 是实数（float）。\nv) 值 `true` 是布尔值，因此变量 `b` 是布尔值。\nvi) 值\
  \ “true” 是文本，因此变量 `b` 是字符串。\n\n7.5 增/减运算符\n\n增/减运算符在程序中非常频繁使用，它们用于对数字增加 1，或者从数字中减去\
  \ 1。为了提高代码的效率，可以在表达式中直接使用增/减运算符，如下所示。在下一个示例中\n\n（注：此处原文中存在大量重复段落，翻译已根据“不要重复输出原文”的原则进行逻辑合并与翻译）\n\
  \n7.6 字符串运算符\n\n将两个独立的字符串合并成一个被称为拼接。有两个运算符可以使用可以使用你来拼接（连接）字符串，如下表所示。\n\n| 运算符 |\
