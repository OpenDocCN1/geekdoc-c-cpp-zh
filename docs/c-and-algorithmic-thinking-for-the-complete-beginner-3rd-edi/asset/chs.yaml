  \ \"No one found!\" << endl;\n    }\n    return 0;\n}\n```\n\n![](img/notice.jpg)由于程序处理字母数字数据，因此需要\
  \ `to_upper_copy()` 函数，以便程序能够对任何提供的值正确运行。例如，如果 `firstNames` 数组中存在“John”，而用户想搜索“JOHN”，`to_upper_copy()`\
  \ 函数确保了程序能找到所有的 John。\n\n#### 练习 34.5-3 线性搜索算法 – 在可能包含多个相同值的二维数组中搜索\n\n编写代码段，对二维数组的每行进行搜索以找到用户提供的值。假设数组可能包含多个相同值。使用线性搜索算法。\n\
  \n##### 答案\n\n\n\n\n这段代码段必须在二维数组的每一行中搜索用户提供的数字，该数组可能包含多个相同的值。这意味着代码段必须搜索第一行，并显示所有找到用户提供的数字的列；否则，它必须显示消息，说明在第一行未找到用户提供的数字。然后，它必须搜索第二行，此过程将一直持续到所有行都检查完毕。\n\
  \n为了更好地理解这个练习，使用了“从内层到外层”的方法。以下代码段仅在名为 `haystack` 的二维数组的第一行中搜索给定的值（变量 `needle`）。假设变量\
  \ `i` 的值为 0。\n\n```cpp\nfound = false;for (j = 0; j <= COLUMNS - 1; j++) {\n   \
