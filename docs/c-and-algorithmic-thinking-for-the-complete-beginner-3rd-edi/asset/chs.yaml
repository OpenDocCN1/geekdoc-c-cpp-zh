  \ found it!”，以及用户所尝试的总次数。\n\n### 38) 扩展上一个练习/游戏，使其支持两个玩家运行。获胜者是那个用较少次数找到随机秘密数字的人。\n\
  \n### 39) 电视屏幕的尺寸始终指的是其对角线长度。例如，40 英寸的电视屏幕对角线长度为 40 英寸，从顶部一个角到底部另一个角。旧式电视屏幕的长宽比为\
  \ 4:3，这意味着电视屏幕高度每有 3 英寸，宽度就有 4 英寸。如今，大多数电视屏幕的长宽比为 16:9，这意味着电视屏幕高度每有 9 英寸，宽度就有 16\
  \ 英寸。使用这些宽高比例和勾股拉斯定理，你可以很容易地确定：\n\n- 对于所有 4:3 的电视屏幕：宽度 = 对角线 × 0.8，高度 = 对角线 × 0.6\n\
  - 对于所有 16:9 的电视屏幕：宽度 = 对角线 × 0.87，高度 = 对角线 × 0.49\n\n编写一个 C++ 程序显示以下菜单：\n\n1) 4/3\
