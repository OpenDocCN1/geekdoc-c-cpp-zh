  \ \" << S << \" meters\" << endl;\n    return 0;\n}\n```\n\n#### 练习 10.1-4 摄尔度转华氏度\n\
  \n编写一个 C++ 程序，将温度值从华氏度^([[8]](#footnotes.html_Endnote_8)) 转换为对应的摄尔度^([[9]](#footnotes.html_Endnote_9))。所需的公式为\n\
  \n1.8 × Kelvin = Fahrenheit + 459.67\n\n##### 解决方案\n\n给出的公式不能直接在你的程序中使用。在 C++ 等计算机语言中，不允许写成：\n\
  \n```\n1.8 * kelvin = fahrenheit + 459.67;\n```\n\n![](img/remember.jpg)在 (`=`)\
  \ 符号的左侧位置，只能存在一个变量。该变量实际上是 RAM 中的一个区域，可以在其中存储值。\n\n根据本次练习的措辞，程序必须将华氏度转换为摄尔度。华氏度值是一个已知值并由用户提供，而摄尔度值是\
  \ C++ 程序必须计算的。因此，你需要求解 `Kelvin` 的值。经过一番处理后，公式变为\n\n.![Image](img/chapter10-03.png)\n\
  \nC++ 程序如所示。\n\n![](img/my_exercise_header.png) `project_10.1-4`\n\n```cpp\n#include\
  \ <iostream>\nusing namespace std;\nint main() {\n    double fahrenheit, kelvin;\n\
  \    cout << \"Enter a temperature in Fahrenheit: \";\n    cin >> fahrenheit;\n\
  \    kelvin = (fahrenheit + 459.67) / 1.8;\n    cout << \"The temperature in Kelvin\
  \ is \" << kelvin << endl;\n    return 0;\n}\n```\n\n#### 练习 10.1-5 计算销售税\n\n员工需要一个程序来输入税前价格并计算最终价格。假设销售税（VAT）为\
  \ 19%。\n\n##### 解决方案\n\n销售税可以很容易计算。你必须将税前价格乘以 `VAT` 速率。\n\n![](img/my_exercise_header.png)\
  \ `project_10.1-5`\n\n```cpp\n#include <iostream>\nusing namespace std;\nconst double\
  \ VAT = 0.19;\nint main() {\n    double priceAfterTax, priceTax;\n    cout << \"\
  Enter the before-tax price: \";\n    cin >> priceTax;\n    salesTax = priceTax *\
  \ VAT;\n    priceAfterTax = priceTax + salesTax;\n    cout << \"The after-tax price\
  \ is \" << priceAfterTax << endl;\n    return 0;\n}\n```\n\n![](img/notice.jpg)注意\
  \ `VAT` 是在函数 `main` 外声明的。\n\n#### 练习 10.1-6 计算折扣\n\n编写一个 C++ 程序，提示用户输入商品价格和折扣率（以\
  \ 100 为基准）。然后程序必须计算并显示新价格。\n\n##### 解决方案\n\n折扣金额可以很容易计算。你必须将折前价格乘以折扣值，然后除以 100。除法是必要的，因为用户输入的是以\
  \ 100 为基准的值。\n\n![](img/my_exercise_header.png) `project_10.1-6`\n\n```cpp\n#include\
  \ <iostream>\nusing namespace std;\nint main() {\n    int discount;\n    double\
  \ discountAmount, priceAfterDiscount, priceBeforeDiscount;\n    cout << \"Enter\
  \ the price of an item: \";\n    cin >> priceBeforeDiscount;\n    cout << \"Enter\
  \ the discount offered (0 - 100): \";\n    cin >> discount;\n    discountAmount\
  \ = priceBeforeDiscount * discount / 100;\n    priceAfterDiscount = priceBeforeDiscount\
  \ - discountAmount;\n    cout << \"The price after discount is \" << priceAfterDiscount\
  \ << endl;\n    return 0;\n}\n```\n\n#### 练习 10.1-7 计算销售折扣和税\n\n员工需要一个程序来输入税前价格和提供的折扣率（以\
  \ 100 为基准）。然后程序必须计算并显示新价格。假设销售税率为 19%。\n\n##### 解决方案\n\n这个练习是前两个练习的结合！\n\n![](img/my_exercise_header.png)\
  \ `project_10.1-7`\n\n```cpp\n#include <iostream>\nusing namespace std;\nint main()\
  \ {\n    int discount;\n    double discountAmount, priceAfterDiscount, priceAfterTax;\n\
  \    double priceBeforeDiscount, salesTax = 0.19;\n    cout << \"Enter the price\
