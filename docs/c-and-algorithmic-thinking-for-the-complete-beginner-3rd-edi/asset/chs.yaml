  \ `VBA` 编写的脚本。其目的是自动化 Microsoft Office 内部的某些功能。\n\n### 2.5 Boost `C++` 库\n\nBoost\
  \ 是一个用于 `C++` 的库集合，为事件处理、字符串处理、内存处理、异步输入/输出 (`I/O`) 等许多任务提供支持。它包含超过 140 个库，帮助你在无需等待\
  \ `C++` 标准下次修订的情况下提高效率。在书中，一些练习和示例使用了一组非常小的 Boost 库。\n\n如果你需要更多信息，可以访问：\n\n[`tinyurl.com/mr2fvt`](https://tinyurl.com/mr2fvt)\n\
  \n[`www.boost.org/doc/libs/`](https://www.boost.org/doc/libs/)\n\n![Image](img/chapter02-01.png)\n\
  \n### 2.6 集成开发环境\n\n集成开发环境（简称 IDE）是一种软件，包含了程序员编写和测试程序所需的所有基本工具。IDE 通常包含一个源代码编辑器，并集成了编译器或解释器等工具以及调试器。Visual\
  \ Studio Community 和 Visual Studio Code 是允许程序员编写和执行源代码的 IDE 示例。\n\n![](img/notice.jpg)“调试器”是一种帮助程序员发现并修正许多错误的工具。\n\
  \n### 2.7 Microsoft Visual Studio\n\nMicrosoft Visual Studio 是一个集成开发环境 (IDE)，它为许多编程语言（通过单独安装的扩展）提供了强大的工具集，并让你轻松创建适用于\
  \ Android、iOS、macOS、Windows 和云端的应用程序，以及网站、Web 应用程序和 Web 服务。\n\nVisual Studio 不仅仅是一个文本编辑器。它可以缩进、匹配单词和括号，并高亮编写错误的源代码。它还提供自动代码完成\
  \ (`IntelliSense`®)，这意味着当你输入时，它会显示可能的补全列表。IDE 还提供提示帮助你分析代码并发现任何潜在问题。它甚至提供了解决这些问题的简单建议。你可以使用\
  \ Visual Studio 不仅用于编写程序，还可以直接从 IDE 执行你的程序。\n\n\n\n\n\n- Visual Studio（社区版、专业版或企业版），运行于\
