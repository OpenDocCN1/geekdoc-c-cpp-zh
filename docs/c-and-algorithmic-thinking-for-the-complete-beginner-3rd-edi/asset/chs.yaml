  d) 成绩低于“B”的女孩总数\ne) 最高分和最低分\nf) 全班的平均分\n\n添加所有必要的检查以确保程序满足确定性（definiteness）属性。此外，使用循环控制结构，程序在老师输入任何以下内容时必须验证数据输入并显示错误消息：\n\
  \n- 学生总数为非正值\n- 学生成绩为负数或大于 100 的值\n- 性别非 M、F 或 O 的值\n\n### 41) 编写一个 C++ 程序，根据下表计算并显示客户根据订单金额享有的折扣。\n\
