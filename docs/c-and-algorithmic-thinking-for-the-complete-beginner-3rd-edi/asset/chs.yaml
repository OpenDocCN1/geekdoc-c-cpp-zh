  \ `a`。\nix) 正确。它将值 `true` 赋值给变量 `a`。\nx) 正确。这等同于 `a = a / 2`。\nxi) 正确。等同于 `a = a\
  \ + 1`。\nxii) 错误。它应该写为 `a *= 2`（等同于 `a = a * 2`）。\n\n#### 练习 7.4-2 寻找变量类型\n\n以下每个变量的类型是什么？\n\
