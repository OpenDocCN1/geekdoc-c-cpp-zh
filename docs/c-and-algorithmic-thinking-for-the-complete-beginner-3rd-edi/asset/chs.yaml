  \n编写一个 C++ 程序，提示用户输入 FIFA 世界足杯 32 支国家队的名字、每支队伍 24 名球员的名字以及每位球员进的进球总数。程序必须显示每支球队的名称及其五位最高得分者。使用冒泡排序算法。\n\
  \n#### 解答\n\n在本次练习中你需要以下三个数组。\n\n![Image](img/chapter34-48.png)\n\n![notice.jpg)\
  \ 为了节省纸张，使用了短数组名，但显而易见数组 `t` 存储了 32 支国家队的名字，数组 `p` 存储每支队伍 24 名球员的名字，而数组 `g` 存储每个球员进的进球总数。\n\
  \nC++ 程序必须对数组 `g` 的每一行进行降序排序，但必须注意保持与数组 `p` 元素的一一对应关系。这意味着，每当冒泡排序算法交换 `g` 数组中两个元素的内容时，数组\
  \ `p` 数组中对应的元素也必须进行交换。然而，不需要执行 23 轮（有 24 名球员），考虑到只需要找到五位最高得分者，算法只需执行 5 轮。当排序完成后，五位最高得分者将出现在前五列。\n\
  \n再次使用了“从内层到外”的方法。以下代码片段对 `g` 数组的第一行（行索引为 0）进行降序排序，同时注意保持与 `p` 数组元素的一一对应关系。假设变量\
  \ `i` 的值为 0。\n\n```cpp\nfor (m = 1; m <= 5; m++) {  //Perform 5 passes\n    for\
  \ (n = PLAYERS - 1; n >= m; n--) {\n        if (g[i][n] < g[i][n - 1]) {\n     \
  \       temp = g[i][n];\n            g[i][n] = g[i][n - 1];\n            g[i][n\
  \ - 1] = temp;\n            tempStr = p[i][n];\n            p[i][n] = p[i][n - 1];\n\
  \            p[i][n - 1] = tempStr;\n        }\n    }\n}\n```\n\n现在，为了对所有行进行排序，你需要将这段代码嵌套在一个遍历所有行的\
  \ `for` 循环中，如下所示。\n\n```cpp\nfor (i = 0; i <= TEAMS - 1; i++) {\n    for (m = 1;\
  \ m <= 5; m++) // // 5 passes\n        for (n = PLAYERS - 1; n >= m; n--) {\n  \
  \          if (g[i][n] > g[i][n - 1]) {\n                temp = g[i][n];\n     \
  \           g[i][n] = g[i][n - 1];\n                g[i][n - 1] = temp;\n      \
  \          tempStr = p[i][n];\n                p[i][n] = p[i][n - 1];\n        \
  \        p[i][n - 1] = tempStr;\n            }\n        }\n    }\n}\n```\n\n最终的\
  \ C++ 程序如下。\n\n![](img/my_exercise_header.png) project_34.6-6\n\n```cpp\n#include\
  \ <iostream>\nusing namespace std;\nconst int TEAMS = 32;\nconst int PLAYERS = 24;\n\
  int main() {\n    int i, j, m, n, temp;\n    string tempStr;\n    //Read team names,\
