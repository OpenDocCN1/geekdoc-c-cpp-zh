  \ 以上都不是\n\n5) 下列哪个不属于创建算法的三个主要阶段？\n   a) 数据保护\n   b) 数据输入\n   c) 结果输出\n   d 数据处理\n\
  \n6) 流程图可以：\n   a) 展示在纸上。\n   b) 直接输入输入计算机。\n   c) 以上都是。\n\n7) 流程图中的矩形代表：\n   a)\
