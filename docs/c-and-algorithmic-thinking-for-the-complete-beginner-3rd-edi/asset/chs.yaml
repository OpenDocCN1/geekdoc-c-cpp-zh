  \ 23.1-1 是整数吗？\n\n编写一个 C++ 程序，提示用户输入一个数字，然后显示消息指示该数字的数据类型是整数还是实数。\n\n##### 答案\n\n\
  众所周知，当数字不包含小数部分时，被视为整数。在 C++ 中，你可以使用 `(int)` 类型转换运算符获取任何实数的整数部分。如果用户提供的数字与其整数部分相等，则该数字被视为整数。\n\
  \n例如，如果用户输入数字 7，该数字及其整数部分 `(int)` 是相等的。\n\n```cpp\n#include <iostream>\nusing namespace\
  \ std;\nint main() {\n    double x;\n    cout << \"Enter number: \";\n    cin >>\
  \ x;\n    if (x == (int)x) {\n        cout << x << \" is integer\" << endl;\n  \
  \  } else {\n        cout << x << \" is real\" << endl;\n    }\n    return 0;\n\
  }\n```\n\n#### 练习 23.1-2 验证数据输入并寻找奇偶数\n\n设计一个流程并编写一个 C++ 程序，提示用户输入一个非负整数，然后显示它是偶数还是奇数。\n\
  \n##### 答案\n\n```cpp\n#include <iostream>\nusing namespace std;\nint main() {\n\
  \    int x;\n    cout << \"Enter a non-negative integer: \";\n    cin >> x;\n  \
  \  if (x < 0) {\n        cout << \"Invalid input\" << endl;\n    } else {\n    \
  \    if (x % 2 == 0) {\n            cout << \"Even\" << endl;\n        } else {\n\
  \            cout << \"Odd\" << endl;\n        }\n    }\n    return 0;\n}\n```\n\
  \n#### 练习 23.1-3 缴费员在哪里？\n\n在收费站，有一个自动系统可以识别通过的车辆是否是摩托车、汽车还是卡车。编写一个 C++ 程序，让用户输入车辆类型（M\
  \ 代表摩托车，C 代表汽车，T 代表卡车），然后根据下表显示司机必须支付的金额。\n\n| 车辆类型 | 金额 |\n| --- | --- |\n| 摩托车\
  \ | $1 |\n| 汽车 | $2 |\n| 卡车 | $4 |\n\n##### 答案\n\n```cpp\n#include <iostream>\n\
  #include <boost/algorithm/string.hpp>\nusing namespace boost::algorithm;\nusing\
  \ namespace std;\nint main() {\n    string v;\n    cout << \"Enter vehicle type\
  \ (M, C, T): \";\n    cin >> v;\n    v = to_upper_copy(v); // 将全部转换为大写字母\n    if\
  \ (v == \"M\") {\n        cout << \"$1\" << endl;\n    } else if (v == \"C\") {\n\
  \        cout << \"$2\" << endl;\n    } else if (v == \"T\") {\n        cout <<\
  \ \"$4\" << endl;\n    } else {\n        cout << \"Invalid vehicle\" << endl;\n\
  \    }\n    return 0;\n}\n```\n\n\n\n\n\n```cpp\n} else if (v == \"M\") {\n    cout\
  \ << \"You need to pay $1\" << endl;\n} else if (v == \"C\") {\n    cout << \"You\
  \ need to pay $2\" << endl;\n} else if (v == \"T\") {\n    cout << \"You need to\
  \ pay $4\" << endl;\n}returnreturn 0;}\n```\n\n然而，如果将多分支决策结构中的第一个情况移动到末尾，这个练习题可以提高得更高，如下所示。\n\
  \n![](img/my_exercise_header.png) project_23.1-3\n```cpp\n#include <iostream>\n\
  #include <boost/algorithm/string.hpp>\nusing namespace boost::algorithm;\nusing\
  \ namespace std;\nint main() {\n    string v;\n    cin >> v;\n    v = to_upper_copy(v);\
  \ //将全部转换为大写\n    if (v == \"M\") {\n        cout << \"You need to pay $1\" << endl;\n\
  \    } else if (v == \"C\") {\n        cout << \"You need to pay $2\" << endl;\n\
