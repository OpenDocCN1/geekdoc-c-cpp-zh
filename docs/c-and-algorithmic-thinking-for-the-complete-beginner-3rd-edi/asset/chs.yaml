  2) 如果使用 `fstream f(filename, fstream::in)` 语句打开文件且文件 `filename` 不存在，C++ 会创建一个新文件。\n\
  3) 如果使用 `fstream f(filename, fstream::app)` 语句打开文件且文件 `filename` 不存在，C++ 会创建一个新文件。\n\
  4) 如果使用 `fstream f(filename, fstream::out)` 语句打开文件且文件 `filename` 不存在，C++ 会抛出一个运行时错误。\n\
  5) 语句 `fstream f(filename, fstream::app)` 会覆盖文件 `filename`（当文件已存在时）。\n6) 以下程序是正确的：\n\
  ```cpp\n#include <iostream>\n#include <fstream>\nusing namespace std;\nint main()\
  \ {\n    string x;\n    fstream ff(\"grades.txt\");\n    getline(ff, x);\n    cout\
  \ << x;\n    ff.close();\n    return 0;\n}\n```\n7) 下面的代码片段是正确的：\n```cpp\nfstream\
  \ f(\"grades.txt\", fstream::out);\ngetline(f, x);\n```\n8) 下面的代码片段是正确的：\n```cpp\n\
  fstream f(\"grades.txt\");\nf >> \"OK\";\n```\n9) 下面的代码片段是正确的：\n```cpp\nfstream\
  \ f(\"grades.txt\", fstream::out);\nf << \"OK\";\n```\n10) 如果名为“test.txt” 的文件中有\
  \ 10 个字符，执行以下程序后，文件的大小会变大：\n```cpp\nint main() {\n    fstream f(\"test.txt\", fstream::out);\n\
  \    f << \"Hello\";\n    f.close();\n    return 0;\n}\n```\n11) 如果名为“test.txt”\
  \ 的文件中有 10 个字符，执行以下程序后，文件的大小会变大：\n```cpp\nint main() {\n    fstream f(\"test.txt\"\
  , fstream::app);\n    f << \"Hello\";\n    f.close();\n    return 0;\n}\n```\n12)\
  \ 下面的代码片段是正确的：\n```cpp\nfstream f(\"c:\\data\\test.txt\");\nf << 10;\nf.close();\n\
  ```\n13) 在反复执行以下程序三次后，“test.txt”文件中将只有两行文本：\n```cpp\nint main() {\n    fstream f(\"\
  test.txt\", fstream::app);\n    f << \"Good Morning\" << endl;\n    f << \"Good\
  \ Evening\" << endl;\n    f.close();\n    return 0;\n}\n```\n14) 在反复执行以下程序三次后，“test.txt”文件中将只有两行文本：\n\
