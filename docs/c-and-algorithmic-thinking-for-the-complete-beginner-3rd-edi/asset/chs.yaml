  \  cout << \"' as an answer\" << endl;\n}\nreturn 0;\n```\n\n### 练习 34.5-7：检查值是否存在于所有列\n\
  \n编写一个 C++ 程序，用户向 $20 \\times$ $30$ 的数组中输入数值。在输入所有数值后，程序让用户输入一个值。最后，如果用户提供的值在数组的每一列中至少出现一次，则必须显示一条消息。\n\
  \n##### 解决方案\n\n此练习可以使用线性搜索算法和计数变量 `count` 来解决。C++ 程序将遍历第一列；如果找到了用户提供的值，C++ 程序随后将停止在第一列中继续搜索，并且变量\
  \ `count` 加 1。然后，程序将遍历第二列；如果再次找到用户提供的值，C++ 程序将随后停止在第二列中继续搜索，变量 `count` 再次加 1。此过程必须重复直到所有列都检查完毕。在过程结束时，如果\
  \ `count` 的值等于列的总数，则意味着用户提供的值在数组的每一列中至少存在一次。\n\n让我们使用“从内层到外”的方法。以下代码段在数组的第一列（列索引为\
  \ 0）中搜索，如果找到了用户提供的值，执行流将退出 `for` 循环且变量 `count` 加 1。假设变量 `j` 包含值 0。\n\n```cpp\nfound\
  \ = false;\nfor (i = 0; i <= ROWS - 1; i++) {\n    if (haystack[i][j] == needle)\
  \ {\n        found = true;\n        break;\n    }\n}\nif (found) {\n    count++;\n\
  }\n```\n\n现在你就可以将这段代码段嵌套在一个遍历所有列的 `for` 循环中。\n\n```cpp\nfor (j = 0; j <= COLUMNS\
  \ - 1; j++) {\n    found = false;\n    for (i = 0; i <= ROWS - 1; i++) {\n     \
  \   if (haystack[i][j] == needle) {\n            found = true;\n            break;\n\
  \        }\n    }\n    if (found) {\n            count++;\n    }\n}\n```\n\n你几乎准备好了——但请考虑一个小细节！如果内层\
  \ `for` 循环在某一列中没有找到用户提供的值，外层 `for` 循环必须停止迭代。继续下去是没有意义的，因为用户提供的值在至少一列中不存在。因此，更好的方法是如后续代码段所示，为外层循环使用\
  \ `break` 语句。\n\n```cpp\nfor (j = 0; j <= COLUMNS - 1; j++) {\n    found = false;\n\
  \    for (i = 0; i <= ROWS - 1; i++) {\n        if (haystack[i][j] == needle) {\n\
  \            found = true;\n            break;\n        }\n    }\n    if (found)\
  \ {\n            count++;\n    }else {\n        break;\n    }\n}\n```\n\n最终的 C++\
  \ 程序如下。\n\n```cpp\n#include <iostream>\nusing namespace std;\nconst int ROWS = 20;\n\
  const int COLUMNS = 30;\nint main() {\n    int i, j, count;\n    bool found;\n \
  \   double needle;\n    double haystack[ROWS][COLUMNS];\n    for (i = 0; i <= ROWS\
  \ - 1; i++) {\n        for (j = 0; j <= COLUMNS - 1; j++) {\n            cin >>\
  \ haystack[i][j];\n        }\n    }\n    cout << \"Enter a value to search: \";\n\
  \    cin >> needle;\n    count = 0;\n    for (j = 0; j <= COLUMNS - 1; j++) {\n\
  \        found = false;\n        for (i = 0; i <= ROWS - 1; i++) {\n           \
  \ if (haystack[i][j] == needle) {\n                found = true;\n             \
  \   break;\n            }\n        }\n        if (found) {\n            count++;\n\
  \        }else {\n            break;\n        }\n    }\n    if (count == COLUMNS)\
  \ {\n        cout << needle << \" found in every column!\" << endl;\n    }\n   \
  \ return 0;\n}\n```\n\n如果你需要当用户提供的值在每一行中至少出现一次（而不是每一列）时显示消息，C++ 程序可以遵循之前所示的步骤，但在此情况下，它必须遍历行而不是列。\n\
  \n### 练习 34.5-8：二分查找算法——在排序的一维数组中搜索\n\n编写一个代码段，在排序的一维数组上执行搜索以找到给定值。使用二分查找算法。\n\n\
  ##### 解决方案\n\n二分查找算法被认为非常快，可以用于大规模数据。但它的主要缺点是数据需要经过排序。\n\n二分查找算法的主要思想是首先检查数组中间的元素。如果它不匹配你正在寻找的“大海捞针”，算法将确定目标是小于还是大于中间元素。换句话说，如果目标小于中间元素，则搜索缩小到数组的前半部分；否则，则缩小到后半部分。这个过程一直持续直到找到“针”或者剩余检查的区域减少到一个元素（此时意味着“针”不在数组中）。\n\
  \n困惑？让我们通过一个例子来分析二分查找算法。以下数组按升序排列了数值。假设你要找的值是 44。使用了三个变量。初始 `left` 包含 0（第一个元素的索引），`right`\
  \ 包含 13（最后一个元素的索引），`middle` 包含 6（大约是中间元素的索引）。\n\n你要找的针 44 大于中间值 39，因此目标可能在后半部分。因此\
  \ `left` 更新为指向索引 7，`middle` 更新为 `left` 和 `right` 之间的新值。\n\n现在，你要找的针 44 小于中间值 57，因此目标可能在前半部分中。因此，是变量\
  \ `right` 更新为指向索引 9，`middle` 更新为 `left` 和 `right` 之间的新值。\n\n你完成了！“针”在索引 8 处找到，整个过程可以停止！每次失败的比较都会使待检查的元素数量减少一半！索引变量\
  \ `left` 和 `right` 每次分别指向被检查区域的开头和结尾。\n\n现在让我们看看对应的代码段。\n\n```cpp\nleft = 0;\nright\
  \ = ELEMENTS - 1;\nfound = false;\nwhile (left <= right && !found) {\n    middle\
  \ = (int)((left + right) / 2);  //这是一个除 2 操作\n    if (needle < haystack[middle])\
  \ {  // 如果针在被检查区域的前半部分，更新右索引\n        right = middle - 1;\n    }else if (needle\
  \ > haystack[middle]) {  // 如果在后半部分，更新左索引\n        left = middle + 1;\n    }else\
  \ {\n        found = true;\n    }\n}\nif (!found) {\n    cout << \"Nothing found!\"\
  \ << endl;\n}else {\n    cout << needle << \" found at position: \" << middle <<\
  \ endl;\n}\n```\n\n\n\n\n\n![](img/notice.jpg)二分查找算法非常高效，因为它每次迭代都极大地减少了搜索空间，使得它对于有序数组非常有效。在示例数组上使用该算法，只需三次迭代即可找到值\
  \ `44`。相比之下，对于相同的数据，线性搜索算法则需要九次迭代次数！\n\n![](img/notice.jpg)如果数组中包含多个相同的值，二分查找算法只能找到其中一个出现的位置。\n\
