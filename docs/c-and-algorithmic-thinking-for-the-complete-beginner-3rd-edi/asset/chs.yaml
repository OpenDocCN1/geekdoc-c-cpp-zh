  if (n6 > maximum) {\n    maximum = n6;\n    maxI = 6;\n}\n// 显示哪个数字在数组中出现频率最高\n\
  cout << maxI << endl;\n```\n\n但现在你已经到了这本书的末尾，当然可以做一些更有创意的事情。与其将 `searchAndCount()`\
