  \ 12, ....\n\n![](img/notice.jpg) 注意 `zero` 被视为偶数。\n\n在这个练习中，你需要找到方法来判断一个数是奇数还是偶数。你需要找到所有偶数之间、或者所有奇数之间一个共同属性。实际上确实有一个！所有偶数都能被\
  \ `2` 整除。所以，当 `x MOD 2` 的结果等于 `0` 时，`x` 是偶数。流程图所示。\n\n![Image](img/chapter17-05.png)\n\
