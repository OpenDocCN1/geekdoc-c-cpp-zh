  \n### 练习 23.4-4 寻找 y 的值\n\n设计一个流程图并编写相应的 C++ 程序，在以下公式中寻找并显示 `y` 的值（如果可能）：\n\n![Image](img/chapter23-18.png)\n\
  \n##### 解决方案\n\n在本次练习中，分式有两个限制：\n\n- 在分式 ![Image](img/chapter23-19.png) 中，`x` 的值不能为\
  \ −1。\n- 在分式 ![Image](img/chapter23-20.png) 中，`x` 的值不能为 +9。\n\n对于所有其他分式，由于 `x` 所在的范围，分母不可能为零。\n\
  \nC++ 程序所示：\n\n```cpp\n#include <iostream>\nusing namespace std;\n\nint main() {\n\
  \    double x, y;\n    cout << \"Enter a value for x: \";\n    cin >> x;\n    if\
  \ (x > -5 && x <= 0) {\n        if (x != -1) {\n            y = x / (x - 3) + (8\
  \ + x) / (x + 1);\n            cout << y << endl;\n        } else {\n          \
  \  cout << \"Invalid value\" << endl;\n        }\n    } else if (x > 0 && x <= 6)\
  \ {\n        y = 40 * x / (x - 8);\n        cout << y << endl;\n    } else if (x\
  \ > 6 && x <= 20) {\n        if (x != 9) {\n            y = 3 * x / (x - 9);\n \
  \           cout << y << endl;\n        } else {\n            cout << \"Invalid\
  \ value\" << endl;\n        }\n    } else {\n        y = abs(x);\n        cout <<\
  \ y << endl;\n    }\n    return 0;\n}\n```\n\n如果你在想是否可以移除所有的 `cout << y << endl`\
  \ 语句，并改为在程序末尾使用单个 `cout << y << endl` 语句，答案是“不能”。由于存在不包含该语句的路径，你必须在每个要求的路径中都包含它。然而，通过对代码进行轻微修改并在开头检查无效值，你可以机会将\
  \ `cout << y << endl` 语句移动到所有路径的末尾。修改后的 C++ 程序所示：\n\n```cpp\n#include <iostream>\n\
  using namespace std;\n\nint main() {\n    double x, y;\n    cout << \"Enter a value\
  \ for x: \";\n    cin >> x;\n    if (x == -1 || x == 9) {\n        cout << \"Invalid\
  \ value\" << endl;\n    } else {\n        if (x > -5 && x <= 0) {\n            y\
  \ = x / (x - 3) + (8 + x) / (x + 1);\n        } else if (x > 0 && x <= 6) {\n  \
  \          y = 40 * x / (x - 8);\n        } else if (x > 6 && x <= 20) {\n     \
  \       y = 3 * x / (x - 9);\n        } else {\n            y = abs(x);\n      \
  \  }\n        cout << y << endl;\n    }\n    return 0;\n}\n```\n\n现在，你可能在想带下划线的布尔表达式是多余的，对吧？假设你确实删除了它们，并且用户为\
  \ `x` 输入了值 −20。执行流将到达布尔表达式 `x <= 0`，其评估结果为真。为了能够移除带下划线的布尔表达式，你需要对代码进行轻微修改。之后，你可以找到一个建议的解决方案。\n\
  \n### 练习 23.4-5 阶梯电价与用电量\n\nLAV 公司根据下表对订阅者的用电量收费（每月费率）。假设所有额外费用（如传输服务费和分配费）均已包含在内。\n\
