  \ offered (0 - 100): \";\n    cin >> discount;\n    discountAmount = priceBeforeDiscount\
  \ * discount / 100;\n    priceAfterDiscount = priceBeforeDiscount - discountAmount;\n\
  \    salesTax = priceAfterDiscount * VAT;\n    priceAfterTax = priceAfterDiscount\
  \ + salesTax;\n    cout << \"The discounted after-tax price is: \" << priceAfterTax\
  \ << endl;\n    return 0;\n}\n```\n*(注：由于原文代码块中 `VAT` 未定义常量，在翻译代码时为逻辑一致性使用了 `const\
