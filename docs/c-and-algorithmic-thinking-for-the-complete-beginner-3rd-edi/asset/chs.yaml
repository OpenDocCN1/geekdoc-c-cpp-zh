  ### 20.2 复习题：判断对错\n\n对以下每一项判断对错。\n\n1) 决策控制结构的嵌套描述了一个一个或多个决策控制路径包含其他路径的情况。\n2) 嵌套深度可以达到程序员所意的任何深度。\n\
  3) 当一个问题既可以使用分支决策结构也可以使用嵌套决策结构解决时，后者更好，因为程序变得更具可读性。\n4) 可以将多分支决策结构嵌套在分支决策结构中，但反之不行。\n\
  \n### 20.3 复习练习\n\n完成以下练习。\n\n1) 创建一个追踪表，确定下一个 C++ 程序在四种不同执行情况下每一步变量的值。\n\n四次执行的输入值为：(i)\
  \ 20, 1；(ii) 20, 3；(iii) 12, 8 以及 (iv) 50, 0。\n\n```cpp\n#include <iostream>\nusing\
  \ namespace std;\nint main() {\n    int x, y;\n    cin >> x;\n    cin >> y;\n  \
  \  if (x < 30) {\n        switch (y) {\n            case 1:\n                x =\
  \ x % 3;\n                y = 5;\n                break;\n            case 2:\n\
  \                x = x * 2;\n                y = 2;\n                break;\n  \
  \          case 3:\n                x = x + 5;\n                y += 3;\n      \
  \          break;\n            default:\n                x -= 2;\n             \
  \   y++;\n        }\n    } else {\n        y++;\n    }\n    cout << x << \", \"\
  \ << y << endl;\n    return 0;\n}\n```\n\n2) 创建一个追踪表，确定下一个程序在四种不同执行情况下每一步变量的值。\n\
