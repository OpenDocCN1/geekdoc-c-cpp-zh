  \ namespace std;\nstring prependTitle(string name, string title = \"M\") {\n   \
  \ return title + \"  \" + name;\n}\nint main() {\n    cout << prependTitle(\"John\
  \ King\") << endl;           //It displays: M John King\n    cout << prependTitle(\"\
  Maria Miller\", \"Ms\") << endl;  //It displays: Ms Maria Miller\n    return 0;\n\
  }\n```\n\n![](img/notice.jpg)当为形式参数列表中的参数分配了默认值时，该参数被称为“可选参数”。\n\n![](img/notice.jpg)在形式参数列表中，任何可选参数必须位于任何非可选参数的右侧；相反操作将是错误的。\n\
