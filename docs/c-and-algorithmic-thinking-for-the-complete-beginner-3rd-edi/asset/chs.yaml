  \ (m/sec)\n►`t` 是汽车行驶的时间，单位为秒 (sec)\n►`a` 是加速度，单位为米/秒² (m/sec²)\n\n##### 解决方案\n\n\
  由于汽车是从静止开始的，初始速度（速率）`u[0]` 为零。因此，公式变为\n\n.![Image](img/chapter10-02.png)\n\n对应的\
