  \ 1582，必须显示错误信息。\n\n（注意：这涉及数据验证！）\n\n##### 解决方案\n\n根据 1582 年首次引入的格里略历，当满足以下条件之一时，该年份为闰年：\n\
  \n1. 第 `1` 种条件：年份能被 `4` 整除，且不能被 `100` 整除。\n2. 第 `2` 种条件：年份能被 `400` 整除。\n\n在下表中，某些年份不是闰年，因为两个条件都不为真。\n\
  \n| 年份 | 是否为闰年 | 条件 |\n| --- | --- | --- |\n| 1600 | 是 | 第 2 种条件为真。它能被 400 整除 |\n\
  | 1900 | 否 | 两个条件均为假。 |\n| 1904 | 是 | 第 1 种条件为真。它能被 4 整除，且不能被 100 整除 |\n| 1905 |\
  \ 否 | 两个条件均为假。 |\n| 2000 | 是 | 第 2 种条件为真。它能被 400 整除 |\n| 2002 | 否 | 两个条件均为假。 |\n\
  | 2004 | 是 | 第 1 种条件为真。它能被 4 整除，且不能被 100 整除 |\n| 2024 | 是 | 第 1 种条件为真。它能被 4 整除，且不能被\
  \ 100 整除 |\n\n此处是该 C++ 程序。\n\n![](img/my_exercise_header.png) project_23.5-1\n```cpp\n\
  #include <iostream>\nusing namespace std;\nint main() {\n    int y;\n    cout <<\
