  \ `findMax()` 也是如此，因为它也返回一个值。主代码必须提示用户将 50 个人的名、姓和年龄分别输入到数组 `firstNames`、`lastNames`\
  \ 和 `ages` 中。然后，在函数 `findMax()` 的帮助下，可以找到数组 `ages` 中最大值的索引位置。解决方案所示。\n\n![](img/my_exercise_header.png)\
  \ project_38.2-1\n```cpp\n#include <iostream>\nusing namespace std;\nconst int PEOPLE\
  \ = 50;\nint getAge() {\n    int age;\n    cout << \"Enter an age: \";\n    cin\
  \ >> age;\n    while (age <= 0) {\n        cout << \"Error: Invalid age\\nEnter\
  \ a positive number: \";\n        cin >> age;\n    }\n    return age;\n}\nint findMax(int\
  \ a[]) {\n    int i, maximum, maxI;\n    maximum = a[0];\n    maxI = 0;\n    for\
  \ (i = 1; i <= PEOPLE - 1; i++) {\n        if (a[i] > maximum) {\n            maximum\
  \ = a[i];\n            maxI = i;\n        }\n    }\n    return maxI;\n}\nint main()\
  \ {\n    int i, indexOfMax;\n    string firstNames[PEOPLE];\n    string lastNames[PEOPLE];\n\
  \    int ages[PEOPLE];\n    for (i = 0; i <= PEOPLE - 1; i++) {\n        cout <<\
  \ \"Enter first name of person No \" << i + 1 << \": \";\n        cin >> firstNames[i];\n\
  \        cout << \"Enter last name of person No \" << i + 1 << \": \";\n       \
  \ cin >> lastNames[i];\n        ages[i] = getAge();\n    }\n    indexOfMax = findMax(ages);\n\
  \    cout << \"The oldest person is:\" << endl;\n    cout << firstNames[indexOfMax]\
  \ << lastNames[indexOfMax] << endl;\n    cout << \"They are \" << ages[indexOfMax]\
  \ << \" years old!\" << endl;\n    return 0;\n}\n```\n\n#### 练习 38.2-2 使用子程序对数组排序\n\
  \n执行以下操作：\n\ni) 编写一个名为 `mySwap` 的子程序，通过其形式参数列表接收一个字符串数组以及两个索引。该子程序交换相应索引位置处元素的值。\n\
  ii) 使用上述子程序 `mySwap()`，编写一个名为 `mySort` 的子程序，通过其形式参数列表接收一个字符串数组，然后使用冒排序算法对数组进行排序。它必须能够以升序或降序排序。为了实现这一点，在形式参数列表中包含一个额外的布尔参数。\n\
  iii) 编写一个名为 `displayArray` 的子程序，通过其形式参数列表接收一个数组并显示它。\niv) 使用上述子程序 `mySort()` 和 `displayArray()`，编写一个\
  \ C++ 程序，提示用户输入 20 个人的名字，然后显示两次：一次按升序排序，一次按降序排序。\n\n解决方案\n\n如下方的 C++ 程序所示，void 函数\
  \ `mySort()` 使用了改进版的冒排序算法。当向参数 `ascending` 传递值 `true` 时，算法按升序排序数组 `a`。当传递值 `false`\
  \ 时，算法按降序排序数组 `a`。\n\n此外，void 函数 `mySort()` 在每次两个元素的内容之间需要交换时，都会调用 void 函数 `mySwap()`。\n\
  \n![](img/my_exercise_header.png) project_38.2-2\n```cpp\n#include <iostream>\n\
  using namespace std;\nconst int PEOPLE = 20;\nvoid mySwap(string a[], int index1,\
  \ int index2) {\n    string temp;\n    temp = a[index1];\n    a[index1] = a[index2];\n\
  \    a[index2] = temp;\n}\nvoid mySort(string a[], bool ascending) {\n    int m,\
  \ n;\n    for (m = 1; m <= PEOPLE - 1; m++) {\n        for (n = PEOPLE - 1; n >=\
  \ m; n--) {\n            if (ascending) {\n                if (a[n] < a[n - 1])\
  \ {\n                    mySwap(a, n, n - 1);\n                }\n            }\
  \ else {\n                if (a[n] > a[n - 1]) {\n                    mySwap(a,\
  \ n, n - 1);\n                }\n            }\n        }\n    }\n}\nvoid displayArray(string\
  \ a[]) {\n    int i;\n    for (i = 0; i <= PEOPLE - 1; i++) {\n        cout << a[i]\
  \ << endl;\n    }\n}\nint main() {\n    int i;\n    string names[PEOPLE];\n    for\
  \ (i = 0; i <= PEOPLE - 1; i++) {\n        cout << \"Enter a name: \";\n       \
  \ cin >> names[i];\n    }\n    mySort(names, true); // 按升序排序名字\n    displayArray(names);\
  \ // 并显示它们\n    mySort(names, false); // 按降序排序名字\n    displayArray(names); // 并显示它们。\n\
  \    return 0;\n}\n```\n![](img/notice.jpg) 在 C++ 中，数组是通过引用传递的。这就是为什么在子程序 `mySort()`\
  \ 中不需要包含 `return` 语句。\n\n#### 练习 38.2-3 阶进电价与用电量\n\nLAV 电力公司根据下表向订阅者收取用电费（家庭账户的月费率）。\n\
  \n| 千瓦时 (kWh) | 每 kWh 价格（美元 |\n| :--- | :--- |\n| `kWh ≤ 400` | `$0.08` |\n| `401\
  \ ≤ kWh ≤ 1500` | `$0.22` |\n| `1501 ≤ kWh ≤ 2000` | `$0.35` |\n| `2001 ≤ kWh` |\
  \ `$0.50` |\n\n执行以下操作：\n\ni) 编写一个名为 `getConsumption` 的子程序，提示用户输入总 kWh 数并返回该值。使用循环控制结构，该子程序在用户输入任何负值时必须验证数据输入并显示错误信息。\n\
  ii) 编写一个名为 `findAmount` 的子程序，通过其形式参数列表接收 kWh 并返回支付金额（根据上表）。\niii) 使用上述子程序，编写一个 C++\
  \ 程序，提示用户输入总 kWh 数并显示支付金额。程序根据用户的意愿重复多次。在每次计算结束时，程序询问用户是否希望计算支付金额。如果答案是“yes”，则程序继续；否则结束。\n\
  \n解决方案\n\n这里没有新内容。处理阶进电价已经学过的！如果这让你感到陌生，你需要复习相关的 23.4。\n\nC++ 程序如下。\n\n![](img/my_exercise_header.png)\
  \ project_38.2-3\n```cpp\n#include <iostream>\n#include <boost/algorithm/string.hpp>\n\
  using namespace boost::algorithm;\nusing namespace std;\nint getConsumption() {\n\
  \    int consumption ;\n    cout << \"Enter kWh consumed: \";\n    cin >> consumption;\n\
  \    while (consumption < 0) {\n        cout << \"Error: Invalid number!\" << endl;\n\
  \        cout << \"Enter a non-negative number: \";\n        cin >> consumption;\n\
  \    }\n    return consumption;\n}\ndouble findAmount(int kwh) {\n    double amount;\n\
  \    if (kwh <= 400) {\n        amount = kwh * 0.08;\n    }else if (kwh <= 1500)\
  \ {\n        amount = 400 * 0.08 + (kwh - 400) * 0.22;\n    }else if (kwh <= 2000)\
  \ {\n        amount = 400 * 0.08 + 1100 * 0.22 + (kwh - 1500) * 0.35;\n    }else\
  \ {\n        amount = 400 * 0.08 + 1100 * 0.22 + 500 * 0.35 + (kwh - 2000) * 0.50;\n\
  \    }\n    amount += 0.26 * amount;\n    return amount;\n}\nint main() {\n    int\
  \ kwh;\n    string answer;\n    do {\n        kwh = getConsumption();\n        cout\
  \ << \"You need to pay: \" << findAmount(kwh) << endl;\n        cout << \"Would\
  \ you like to repeat? \";\n        cin >> answer;\n    } while (to_upper_copy(answer)\
  \ == \"YES\");\n    return 0;\n}\n```\n\n#### 练习 38.2-4 掷出、掷、掷出……骰子！\n\n执行以下操作：\n\
  \n\n\n\n\ni) 编写一个名为 `dice` 的子程序，返回一个 1 到 6 之间的随机整数。\nii) 编写一个名为 `searchAndCount`\
  \ 的子程序，通过其形式参数列表接受一个整数和一个整数数组，并返回该整数在数组中出现的次数。\niii) 使用上述子程序，编写一个 C++ 程序，向一个数组中填入\
  \ 100 个随机整数（1 到 6 之间），然后让用户输入一个整数。该程序必须显示该用户提供的整数在数组中出现的次数。\n\n##### 解决方案\n\n这两个子程序都可以写成函数，因为它们都只返回一个值。函数\
  \ `dice()` 返回一个 1 到 6 之间的随机整数，而函数 `searchAndCount()` 返回一个数字，表示一个整数在数组中出现的次数。解决方案所示。\n\
  \n![](img/my_exercise_header.png) 项目 38.2-4\n\n```cpp\n#include <iostream>\n#include\
  \ <ctime>\n#include <cstdlib>\nusing namespace std;\nconst int ELEMENTS = 100;\n\
  int dice() {\n    return 1 + rand() % 6;\n}\nint searchAndCount(int x, int a[])\
  \ {\n    int count = 0;\n    int i;\n    for (i = 0; i <= ELEMENTS - 1; i++) {\n\
  \        if (a[i] == x) {\n            count++;\n        }\n    }\n    return count;\n\
  }\nint main() {\n    int x, i;\n    srand(time(NULL));\n    int a[ELEMENTS];\n \
  \   for (i = 0; i <= ELEMENTS - 1; i++) {\n        a[i] = dice();\n    }\n    cin\
  \ >> x;\n    cout << \"Provided value exists in the array \" << searchAndCount(x,\
  \ a) << \" times\" << endl;\n    return 0;\n}\n```\n\n## 练习 38.2-5 骰子每个数字出现了几次？\n\
  \n使用上一个练习中提到的 `dice()` 和 `searchAndCount()` 函数（练习 38.2-4），编写一个 C++ 程序，向一个数组中填入 100\
  \ 个随机整数（1 到 6 之间），然后显示这六个数字在数组中各出现的次数，以及哪个数字出现频率最高。\n\n##### 解决方案\n\n如果你不使用循环控制结构来解决这个练习，可以按照以下步骤操作。\n\
  \n```cpp\n// 将值 1 在数组 an1 中出现的次数赋值给 n1\nn1 = searchAndCount(1, a);\n// 将值 2 在数组\
  \ an2 中出现的次数赋值给 n2\nn2 = searchAndCount(2, a);\n...\n// 将值 6 在数组 an6 中出现的次数赋值给 n6\n\
  n6 = searchAndCount(6, a);\n// 显示六个数字在数组 a 中各出现的次数\ncout << n1 << \"  \" << n2 <<\
  \ \"  \" << n3 << \"  \" << n4 << \"  \" << n5 << \"  \" << n6 << endl;\n// 找到 n1,\
  \ n2… n6 的最大值\nmaximum = n1;\nmaxI = 1;\nif (n2 > maximum) {\n    maximum = n2;\n\
