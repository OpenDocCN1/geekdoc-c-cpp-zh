  \n### 7.4 复合赋值运算符\n\nC++ 提供了一组特殊的运算符，称为复合赋值运算符，它们可以帮助你更快地编写代码。下表详细列出了这些运算符。每个运算符都提供了一个示例，而“等于”列显示了不使用复合赋值运算符的对应语句。\n\
