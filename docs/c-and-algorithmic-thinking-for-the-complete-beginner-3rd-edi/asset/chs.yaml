  | 5 | `cout << Ugly << endl` | 显示: Beautiful | | | |\n| 6 | `cout << Handsome <<\
  \ endl` | 显示: Beautiful | | | |\n\n### 练习 8.1-3 交换变量的值\n\n编写一个 C++ 程序，让用户输入两个值并存储在变量\
  \ `a` 和 `b` 中。在程序结束时，这两个变量必须交换它们的值。例如，如果变量 `a` 和 `b` 分别包含 5 和 7，在交换值后，变量 `a` 必须包含值\
  \ 7，而变量 `b` 必须包含值 5！\n\n##### 答案\n\n下面的代码段虽然看起来正确，但实际上是错误的，并没有真正交换变量 `a` 和 `b` 的值！\n\
  \n```cpp\nint a, b;\ncin >> a;\ncin >> b;\na = b;\nb = a;\ncout << a << \"  \" <<\
  \ b << endl;\n```\n\n让我们来看看为什么！假设用户输入了两个值，5 和 7。追踪表所示。\n\n| 步骤 | 语句 | 注 | a | b\
  \ |\n| :--- | :--- | :--- | :--- | :--- |\n| 1 | `cin >> a` | 用户输入值 5 | 5 | ? |\n\
  | 2 | `cin >> b` | 用户输入值 7 | 5 | 7 |\n| 3 | `a = b` | 将变量 `b` 的值赋值给变量 `a`。值 5 丢失了！\
  \ | 7 | 7 |\n| 4 | `b = a` | 将变量 `a` 的值赋值给变量 `b` | 7 | 7 |\n| 5 | `cout << a <<\
  \ \" \" << b << endl` | 显示: 7 7 | | |\n\n哎呀！值 5 在哪里呢？\n\n答案终底并不那么明显！那么，到底如何真正交换值呢？\n\
  \n考虑两个杯子：一杯橙汁（称为杯子 A），一杯柠檬汁（称为杯子 B）。如果你想交换它们的内容，你只需要找到并使用一个额外的空杯子（称为杯子 C）。\n\n![Image](img/chapter08-01.png)\n\
  \n必须遵循的步骤是：\n\n1) 将 A 杯中的内容（橙汁）倒入 C 杯中。\n\n![Image](img/chapter08-02.png)\n\n2)\
  \ 将 B 杯中的内容（柠檬汁）倒入 A 杯中。\n\n![Image](img/chapter08-03.png)\n\n3) 将 C 杯中的内容（橙汁）倒入\
  \ B 杯中。\n\n![Image](img/chapter08-04.png)\n\n交换成功完成！\n\n你可以按照相同的步骤在 C++ 中交换两个变量的内容。\n\
  \n```cpp\n#include <iostream>\nusing namespace std;\nint main() {\n    int a, b,\
  \ c;\n    cin >> a;\n    cin >> b;\n    c = a;    // 将 A 杯中的内容（橙汁）倒入 C 杯中\n    a\
  \ = b;    // 将 B 杯中的内容（柠檬汁）倒入 A 杯中\n    b = c;    // 将 C 杯中的内容（橙汁）倒入 B 杯中\n    cout\
  \ << a << \"  \" << b << endl;\n    return 0;\n}\n```\n\n![](img/remember.jpg) 双斜杠\
  \ (`//`) 后的文本被注释，永远不会执行。\n\n### 练习 8.1-4 交换变量的值 – 另一种方法\n\n编写一个 C++ 程序，让用户输入两个整数值并存储在变量\
  \ `a` 和 `b` 中。最后，这两个变量必须交换它们的值。然后，使用输入值为 5 和 7 的追踪表来确认你的代码的正确性。\n\n##### 答案\n\n\
  由于变量包含数值，你可以使用以下 C++ 程序（作为另一种方法）。\n\n```cpp\n#include <iostream>\nusing namespace\
  \ std;\nint main() {\n    int a, b;\n    cin >> a;\n    cin >> b;\n    a = a + b;\n\
  \    b = a - b;\n    a = a - b;\n    cout << a << \"  \" << b << endl;\n    return\
  \ 0;\n}\n```\n\n现在让我们使用输入值为 5 和 7 的追踪表来确认变量 `a` 和 `b` 正确地交换了内容。\n\n| 步骤 | 语句 | 注\
  \ | a | b |\n| :--- | :--- | :--- | :--- | :--- |\n| 1 | `cin >> a` | 用户输入值 5 |\
  \ 5 | ? |\n| 2 | `cin >> b` | 用户输入值 7 | 5 | 7 |\n| 3 | `a = a + b` | | 12 | 7 |\n\
  | 4 | `b = a - b` | | 12 | 5 |\n| 5 | `a = a - b` | | 7 | 5 |\n| 6 | `cout << a\
  \ << \" \" << b << endl` | 显示: 7 5 | | |\n\n![](img/remember.jpg) 这种方法的缺点是可能会溢出。\n\
