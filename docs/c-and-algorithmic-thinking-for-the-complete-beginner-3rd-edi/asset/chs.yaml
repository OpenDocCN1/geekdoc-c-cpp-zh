  # 第 VI 部分：C++ 数据结构\n\n## 第 31 章：一维数组和映射\n\n### 31.1 引言\n\n变量是存储内存中值的好方法，但它们有一个局限性——一次只能存储一个值。然而，在许多情况下，程序需要在内存中保留大量数据，此时变量并不是最佳选择。\n\
  \n\n\n\n\n例如，考虑以下练习：\n\n编写一个 C++ 程序，让用户输入三个数字。然后按升序排列显示这些数字。\n\n考虑以下代码片段。它让用户输入这三个数字。\n\
  \n```cpp\nfor (i = 0; i <= 2; i++) {cin >> number;}\n```\n\n当循环最终完成迭代时，变量 `number`\
  \ 只包含最后提供的那个数字。遗憾的是，之前的两个数字都丢失了！使用这段代码片段，无法将它们按升序排列显示。\n\n一种可能的解决方案是使用三个独立的变量，如下：\n\
  \n```cpp\ncin >> num1;cin >> num2;cin >> num3;if (num1 <= num2 && num2 <= num3)cout\
  \ << num1 << \"  \" << num2 << \"  \" << num3 << endl;else if (num1 <= num3 && num3\
  \ <= num2)cout << num1 << \"  \" << num3 << \"  \" << num2 << endl;else if (num2\
  \ <= num1 && num1 <= num3)cout << num2 << \"  \" << num1 << \"  \" << num3 << endl;else\
  \ if (num2 <= num3 && num3 <= num1)cout << num2 << \"  \" << num3 << \"  \" << num1\
  \ << endl;else if (num3 <= num1 && num1 <= num2)cout << num3 << \"  \" << num1 <<\
  \ \"  \" << num2 << endl;elsecout << num3 << \"  \" << num2 << \"  \" << num1 <<\
  \ endl;\n```\n\n这不是一个完美的解决方案，但它有效！然而，如果这个练习的措辞要求用户输入 1,000 个数字而不是三个呢？想一下！你能为所有这些数字编写一个类似的\
  \ C++ 程序吗？显然不能！幸运的是，有数据结构！\n\n![](img/notice.jpg)在计算机科学中，数据结构是组织数据的集合，以便以便最有效的方式对其进行操作。\n\
  \nC++ 中有多种可用的数据结构，包括数组（arrays）、向量（vectors）、有序和无序映射（maps）以及字符串（strings）。是的，你听没错！由于字符串是字母数字字符的集合，因此被认为是一种数据结构。\n\
  \n除了字符串（你已经学习了足够的内容），数组和无序映射是 C++ 中最常用的数据结构。接下来的章节将分析这两种结构。\n\n## 31.2 什么是数组？\n\n\
  数组是一种在一个公共名称下持有多个值的数据结构类型。它可以被视为元素的集合，其中每个元素都被分配一个唯一的数字，称为索引位置（index position），或简单的索引（index）。数组是可变的（changeable），这意味着一旦创建了数组，其元素的值就可以更改。\n\
  \n![](img/notice.jpg)计算机科学中的数组类似于数学中使用的矩阵。数学矩阵是数字或其他数学对象的集合，按行和列排列。\n\n数组有一维数组和多维数组。多维数组可以是二维、三维、四维等。\n\
  \n### 一维数组\n\n下面的示例展示了一个存储六个学生成绩的一维数组。数组的名称为 `grades`。为了方便起见，相应的索引写在每个元素上方。在 C++\
  \ 中，默认情况下，索引编号始终从零开始。\n\n![Image](img/chapter31-01.png)\n\n![](img/remember.jpg)由于索引编号从零开始，数组最后一个元素的索引比数组中的元素总数少\
  \ 1。在数组 `grades` 中，最后一个元素的索引是 5，而元素总数为 6。\n\n你可以将数组想象成六个独立的变量——`grades0`、`grades1`、`grades2`、……\
  \ `grades5`——每个变量持有一个学生的成绩。然而，数组的优势在于它可以在一个公共名称下持有多个值。\n\n### 二维数组\n\n通常情况下，多维数组对于处理多组数据非常有用。例如，假设你想存储加利福尼亚州四月四周的每日最高气温。一种方法是使用四个一维数组，每周一个。此外，每个数组将有七个元素，对应每周的每一天，如下。\n\
  \n![Image](img/chapter31-02.png)\n\n然而，这种方法有点笨拙，因为你必须单独处理每个数组。更好的方法是使用一个具有四行（每周一行）和七列（每周每一天一列）的二维数组，如下。\n\
  \n![Image](img/chapter31-03.png)\n\n### 三维数组\n\n下一个示例展示了一个三维数组，存储了 2013 年和 2014\
  \ 年加利福尼亚州四月四周的每日最高气温。\n\n![Image](img/chapter31-04.png)\n\n![](img/notice.jpg)注意，四维、五维甚至一百维数组也是存在的。然而，经验表明，作为一名程序员的一生中，你需要的最大数组维度可能是二或三。\n\
  \n#### 练习 31.2-1 设计数组\n\n设计一个可以存储 8 个人年龄的数组，然后向数组添加一些典型值。\n\n解答\n\n这是一个简单的题。你所做的就是设计一个具有\
  \ 8 个元素的数组（索引 0 到 7）。它可以是一行或一列的数组，如下。\n\n![Image](img/chapter31-05.png)\n\n但请记住，C++\
  \ 中没有一行或一列的数组。这些概念可能存在于数学矩阵中（或在你的想象中！），但不存在于 C++ 中。C++ 中的数组是一维的——到此为止！如果你想将它们视觉化为一行或一列，那取决于你。\n\
  \n#### 练习 31.2-2 设计数组\n\n设计必要的数组来存储七个人的名字和年龄，然后向数组添加一些典型值。\n\n解答\n\n这个练习可以用两个数组来实现。让我们把它们每个都设计为一列。\n\
  \n![Image](img/chapter31-06.png)\n\n你可以看到，数组 `names` 中的元素与数组 `ages` 中的元素之间是一一对应的关系。七个人中的第一个是\
  \ John Thompson，他 17 岁。“John Thompson”这个名字存储在 `names` 数组的索引 0 处，在 `ages` 数组相同的索引处存储了他的年龄。下一个人人的名字（Ava\
  \ Miller）和她的年龄（25）分别存储在 `names` 和 `ages` 数组的索引 1 处，依此类推。\n\n#### 练习 31.2-3 设计数组\n\
  \n设计必要的数组来存储十个人的名字以及他们一月、二月和三月的平均体重（磅）。然后向数组添加一些典型值。\n\n解答\n\n在这个练习中，你需要一个用于存储名字的一维数组和一个用于存储人们体重的二维数组，它们的元素之间存在一一对应的关系。\n\
  \n![Image](img/chapter31-07.png)\n\n## 31.3 在 C++ 中创建一维数组\n\nC++ 有许多方法创建数组并向其中添加元素（和值）。取决于给定的问题，使用哪种方法取决于你。\n\
  \n让我们尝试使用最常见的方法创建以下数组。\n\n![Image](img/chapter31-08.png)\n\n### 第一种方法\n\n要创建一个数组并直接对其元素赋值，可以使用通形式的\
  \ C++ 语句：\n\n```cpp\ntype array_name[] = { value0, value1, value2, … , valueM };\n\
  ```\n\n其中\n\n- `type` 可以是 `int`、`double`、`string` 等。\n- `array_name` 是数组的名称。\n-\
  \ `value0`、`value1`、`value2`、…… `valueM` 是数组元素的值。\n\n对于这种方法，你可以可以使用语句创建数组 `ages`：\n\
  \n```cpp\nint ages[] = {12, 25, 9, 11};\n```\n\n![](img/notice.jpg)索引会自动设置。值 12\
  \ 被分配给索引位置 0 的元素，值 25 被分配给索引位置 1 的元素，依此类推。默认情况下索引始终从零开始。\n\n![](img/notice.jpg)在第\
  \ 5.4 节中，你学习了为变量命名时必须遵守的规则。为数组命名也遵循完全相同的规则！\n\n### 第二种方法\n\n你可以使用以下通形式的语句在 C++ 中创建一个包含空元素的数组：\n\
  \n```cpp\ntype array_name[size];\n```\n\n\n\n\n其中 `size` 可以是任何正整数值，甚至可以是一个包含任何正整数值的变量。\n\
  \n下一条语句创建一个包含 4 个空元素的数组 `ages`。\n\n```cpp\nint ages[4];\n```\n\n![](img/notice.jpg)语句\
  \ `int ages[4]` 在主内存（RAM）中预留了四个位置。\n\n要给数组元素赋值，你可以使用下面的语句，其通用形式如下：\n\n```cpp\narray_name[index]\
  \ = value;\n```\n\n其中 `index` 是该元素在数组中的索引位置。\n\n接下来的代码段创建了数组 `ages`（在主内存中预留了四个位置），然后给它的元素赋值。\n\
  \n```cpp\nint ages[4];\nages[0] = 12;\nages[1] = 25;\nages[2] = 9;\nages[3] = 11;\n\
  ```\n\n![](img/notice.jpg)数组 `ages` 的大小为 4。\n\n当然，除了直接使用常量值作为 `index`，你还可以使用变量或表达式，如下所示。\n\
  \n```cpp\nint k;\nint ages[4];\nk = 0;\nages[k] = 12;\nages[k + 1] = 25;\nages[k\
  \ + 2] = 9;\nages[k + 3] = 11;\n```\n\n### 31.4 如何从一维数组中获取值\n\n从数组中获取值只需要指向特定的元素即可。一维数组的每个元素都可以使用\
  \ `index` 唯一标识。接下来的代码段创建了一个数组并在屏幕上显示“A+”（不包含双引号）。\n\n```cpp\nstring grades[] = {\"\
  B+\", \"A+\", \"A\", \"C-\"};\ncout << grades[1] << endl;\n```\n\n当然，除了直接使用常量值作为\
  \ `index`，你还可以使用变量或表达式。下面的示例创建了一个数组并在屏幕上显示“Aphrodite and Hera”（不包含双引号）。\n\n```cpp\n\
  string gods[] = {\"Zeus\", \"Ares\", \"Hera\", \"Aphrodite\", \"Hermes\"};\nk =\
  \ 2;\ncout << gods[k + 1] << \" and \" << gods[k] << endl;\n```\n\n#### 练习 31.4-1\
  \ 创建追踪表\n\n为接下来的代码段创建追踪表。\n\n```cpp\nint x;\nint a[4];\na[3] = 9;\nx = 0;\na[x]\
  \ = a[3] + 4;\na[x + 1] = a[x] * 3;\nx++;\na[x + 2] = a[x - 1];\na[2] = a[1] + 5;\n\
  a[3] = a[3] + 1;\n```\n\n解答\n\n不要忘记你可以像操作变量一样操作数组的每个元素。因此，当你为数组的 C++ 程序创建追踪表时，可以为每个元素设置一列，如下：\n\
  \n| 步骤 | 语句 | 注释 | x | a[0] | a[1] | a[2] | a[3] |\n| --- | --- | --- | --- | ---\
  \ | --- | --- | --- |\n| 1 | `int a[4]` | 创建了一个没有值的数组 a | ? | ? | ? | ? | ? |\n\
  | 2 | `a[3] = 9` | | ? | ? | ? | ? | 9 |\n| 3 | `x = 0` | | 0 | ? | ? | ? | 9 |\n\
  | 4 | `a[x] = a[3] + 4` | | 0 | 13 | ? | ? | 9 |\n| 5 | `a[x + 1] = a[x] * 3` |\
  \ | 0 | 13 | 39 | ? | 9 |\n| 6 | `x++` | | 1 | 13 | 39 | ? | 9 |\n| 7 | `a[x + 2]\
  \ = a[x - 1]` | | 1 | 13 | 39 | ? | 13 |\n| 8 | `a[2] = a[1] + 5` | | 1 | 13 | 39\
  \ | 44 | 13 |\n| 9 | `a[3] = a[3] + 1` | | 1 | 13 | 39 | 44 | 14 |\n\n#### 练习 31.4-2\
  \ 使用不存在的索引\n\n以下 C++ 程序没有满足算法的哪些种属性？\n\n```cpp\n#include <iostream>\nusing namespace\
  \ std;\nint main() {\n    string grades[] = {\"B+\", \"A+\", \"A\", \"C-\"};\n \
  \   cout << grades[100] << endl;\n    return 0;\n}\n```\n\n解答\n\n这个 C++ 程序没有满足两个属性。第一个是显而易见的：没有数据输入。第二个是确定性（definiteness）。你永远不能引用数组中不存在的元素。在这个练习中，由于索引位置\
  \ 100 没有元素，最后一条语句抛出了运行时错误。\n\n### 31.5 如何修改数组元素的值\n\n修改现有数组元素的值轻而易举。你只需要使用相应的索引并给该元素赋新值。下面的示例展示了这一点。\n\
  \n```cpp\n//创建数组\nstring tribes[] = {\"Navajo\", \"Cherokee\", \"Sioux\"};\n//修改现有元素的值\n\
  tribes[1] = \"Apache\";\n```\n\n### 31.6 如何遍历数组\n\n现在到了有趣的部分。遍历一维数组有两种方法。\n\n**第一种方法**\n\
  \n使用带有索引的 `for` 循环：\n\n```cpp\nint i;\nfor (i = 0; i < size; i++) {\n    // 处理 array[i]\n\
  }\n```\n\n**第二种方法**\n\n使用 foreach 循环，这种方法有时更方便：\n\n```cpp\nfor (const auto& element\
  \ : sequence) {\n    // 处理 element\n}\n```\n\n\n\n\n编写一个 C++ 程序，创建一个包含以下值的数组：\n\n\
  `56, 12, 33, 8, 3, 2, 98`\n\n然后计算并显示它们的总和。\n\n##### 解决方案\n\n你学习了两种遍历数组元素的方法。让我们使用这两种方法并观察它们的区别。\n\
  \n#### 第一方法\n\n解决方案如下。\n\n![](img/my_exercise_header.png) project_31.6-1a\n\n```cpp\n\
  #include <iostream>\nusing namespace std;\nint main() {\n    int i, total;\n   \
  \ int values[] = {56, 12, 33, 8, 3, 2, 98};\n    total = 0;\n    for (i = 0; i <=\
  \ 6; i++) {\n        total += values[i];  //This is equivalent to total = total\
  \ + values[i]\n    }\n    cout << total << endl;\n    return 0;\n}\n```\n\n### 第二种方法\n\
  \n解决方案如下。\n\n![](img/my_exercise_header.png) project_31.6-1b\n\n```cpp\n#include\
  \ <iostream>\nusing namespace std;\nint main() {\n    int total;\n    int values[]\
  \ = {56, 12, 33, 8, 3, 2, 98};\n    total = 0;\n    for (const auto& value : values)\
  \ {\n        total += value;\n    }\n    cout << total << endl;\n    return 0;\n\
  }\n```\n\n## 31.7 如何向一维数组添加用户输入的值\n\n这里并没有新新意。与其从键盘读取一个值并将其赋值给变量，不如直接将该值赋值给特定的数组元素。下一个代码片段提示用户输入四个人的名字，并将它们赋值给数组\
  \ `names` 中索引位置为 0, 1, 2 和 3 的元素。\n\n```cpp\nint main() {\n    string names[4];\
