  \ x << \"  \" << y << endl;\n            }\n        }\n    }\n    return 0;\n}\n\
  ```\n\n#### 练习 30.5-3 俄罗斯乘法算法\n\n你可以使用“俄罗斯乘法算法”来乘以两个正整数，该算法在下流程图中给出：\n\n![Image](img/chapter30-02.png)\n\
