  \n- **变量 `answer` 和 `gender`**：\n    - 在子程序外部初始化/更新；因此它们必须传递给子程序。\n    - 在子程序内未更新；因此它们不应返回给调用者。\n\
  - **变量 `totalYes` 和 `femaleNo`**：\n    - 在子程序外部初始化；因此它们必须传递给子程序。\n    - 在子程序内更新，然后其值在外部被使用；因此它们必须返回给调用者。\n\
  \n因此，由于必须向主代码返回两个值，可以使用 `void` 函数，并将 `totalYes` 和 `femaleNo` 以引用方式传递，如下所示。\n\n```cpp\n\
  //Third part\nvoid countResults(string answer, string gender, int &totalYes, int\
  \ &femaleNo) {\n    if (answer == \"yes\") {\n        totalYes++;\n    }\n    if\
  \ (gender == \"female\" && answer == \"no\") {\n        femaleNo++;\n    }\n}\n\
