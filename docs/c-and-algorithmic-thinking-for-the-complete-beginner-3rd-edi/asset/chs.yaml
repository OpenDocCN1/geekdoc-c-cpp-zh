  \ (m)\n► `u0` 是车辆的初速度，单位为米/秒 (m/sec)\n► `t` 是车辆行驶的时间，单位为秒 (sec)\n► `a` 是加速度，单位为每/秒平方\
  \ (m/sec²)\n\n假设用户提供的加速度值互不同。同样假设用户输入的是有效值。\n\n\n\n\n当执行多重决策结构时，会评估 `Boolean_Expression_1`。如果其评估结果为真，则执行紧随其后的对应语句或语句块；然后跳过该结构的其余部分，继续执行多重决策结构之后可能存在的任何语句。然而，如果\
  \ `Boolean_Expression_1` 的评估结果为假，执行流将评估 `Boolean_Expression_2`。如果其评估结果为真，则执行紧随其后的对应语句或语句块，并跳过结构的其余部分。这个过程将持续，直到有一个布尔表达式评估结果为真，或者没有更多的布尔表达式剩余。\n\
  \n当之前的布尔表达式都没有评估为真时，将执行最后一个语句或语句块 `N + 1`。此外，这个最后一个语句或语句块 `N + 1` 是可选的，可以省略。这取决于你尝试解决的算法。\n\
  \nC++ 语句的一般形式如下：\n\n```cpp\nif (Boolean_Expression_1) {A statement or block of statements\
  \ 1}else if (Boolean_Expression_2) {A statement or block of statements 2}else if\
  \ (Boolean_Expression_3) {A statement or block of statements 3}...else if (Boolean_Expression_N)\
  \ {A statement or block of statements N}else {A statement or block of statements\
  \ N + 1}\n```\n\n![](img/notice.jpg)最后一个语句或最后一个语句块 `N + 1` 是可选的，可以省略（你也需要省略 `else`\
