  \ 给变量 `m_i` 和 `m_j` 分配初始值 0 是必要的，因为始终存在最小值等于元素 `t[0][0]` 值的可能性。\n\n### 练习 34.3-7\
  \ 寻找每一行的最小值和最大值\n\n编写一个 C++ 程序，让用户向一个 20 × 30 元素的数组 `b` 中输入值，然后找到并显示每一行的最小值和最大值。\n\
  \n#### 答案 \n\n实际上有两种方法。第一种方法创建两个辅助一维数组 `minimum` 和 `maximum`，然后显示它们。数组 `minimum`\
  \ 和 `maximum` 将在每个位置分别包含每行的最小值和最大值。另一方面，第二种方法是直接找到并显示每一行的最小值和最大值。让我们学习一下这两种方法。\n\
  \n#### 第一种方法 – 创建辅助数组\n\n为了更好地理解这种方法，让我们使用“从内层向外”的方法。当以下代码片段完成迭代时，辅助一维数组 `minimum`\
  \ 和 `maximum` 将在位置 0 分别包含数组 `b` 第一行（行索引 0）的最小值和最大值。假设变量 `i` 的值为 0。\n\n```cpp\nminimum[i]\
  \ = b[i][0];\nmaximum[i] = b[i][0];\nfor (j = 1; j <= COLUMNS - 1; j++) {\n    if\
  \ (b[i][j] < minimum[i]) {\n        minimum[i] = b[i][j];\n    }\n    if (b[i][j]\
  \ > maximum[i]) {\n        maximum[i] = b[i][j];\n    }\n}\n```\n\n![](img/notice.jpg)\
