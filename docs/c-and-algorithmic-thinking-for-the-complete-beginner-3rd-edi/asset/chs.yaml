  \n假设你想显示一条消息，表示女性在不同温度下可能穿着的衣服类型。\n\n| 室外温度（华氏度） | 女性可能穿着的衣服类型 |\n| --- | --- |\n\
  | 温度 < 45 | 毛衣、大衣、牛仔裤、衬衫、鞋 |\n| 45 ≤ 温度 < 65 | 毛衣、牛仔裤、夹克、鞋 |\n| 65 ≤ 温度 < 75 | 七分裤、短裤、T\
  \ 恤、背心、人字拖、运动鞋 |\n| 75 ≤ 温度 | 短裤、T 恤、背心、短裙、连衣裙、人字拖 |\n\n初看之下，单分支决策结构似乎是逻辑上的选择。虽然没有错误，但更深入的分析表明，每个条件都是相互依赖的，这意味着当其中一个条件为真时，其他条件都不应该被评估。你只需要从一组可能性中选择一个备选方案。\n\
  \n要解决此类练习，你可以使用多分支决策结构或嵌套决策控制结构。然而，前者是最好的选择，因为它更方便且增加了可读性，如下面的代码片段所示。\n\n```cpp\n\
  if (temperature < 45)cout << \"Sweater, coat, jeans, shirt, shoes\" << endl;else\
  \ if (temperature >= 45 && temperature < 65)cout << \"Sweater, jeans, jacket, shoes\"\
  \ << endl;else if (temperature >= 65 && temperature < 75)cout << \"Capris, shorts,\
  \ t-shirt, tank top, flip flops, athletic shoes\" << endl;else if (temperature >=\
  \ 75)cout << \"Shorts, t-shirt, tank top, skort, skirt, flip flops\" << endl;\n\
  ```\n\n然而，仔细检查后发现，所有下划线的布尔表达式实际上并不是都是需要的。例如，如果第一个布尔表达式 `temperature < 45` 结果为假，执行流将继续评估第二个布尔表达式。但在这一步中，由于第一个布尔表达式已经求值为假，变量\
  \ `temperature` 显然大于或等于 45。因此，布尔表达式 `temperature >= 45` 在求值时显然为真，因此可以省略。同样的逻辑适用于所有情况；你可以省略所有下划线的布尔表达式。最终代码片段在此所示，已删除了所有不必要的评估。\n\
  \n```cpp\nif (temperature < 45)cout << \"Sweater, coat, jeans, shirt, shoes\" <<\
  \ endl;else if (temperature < 65)cout << \"Sweater, jeans, jacket, shoes\" << endl;else\
  \ if (temperature < 75)cout << \"Capris, shorts, t-shirt, tank top, flip flops,\
