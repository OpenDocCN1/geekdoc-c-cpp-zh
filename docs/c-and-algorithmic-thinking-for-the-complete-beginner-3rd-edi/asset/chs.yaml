- "# C++ 与算法思维：初学者入门指南（第3版）\n\n\n\n![](img/cover.jpg)\n\n为了获得最佳阅读体验，请将设备旋转至横屏模式。\n\
  \n\n# 第一部分\n\n# 入门知识\n\n## 第一章\n\n# 计算机是如何工作的\n\n### 1.1 引言\n\n在当今社会，几乎每个任务都需要使用计算机。在学校，学生使用计算机搜索互联网并发送电子邮件。在工作中，人们使用它们进行演示、分析数据以及与客户交流。在家中，人们使用计算机玩游戏、连接社交网络并与各地的人聊天。当然，不要忘记智能手机。它们也是计算机！\n\
  \n\n\n\n通常是硬盘或 `SSD`（固态硬盘），有时（但较少见）是 `CD/DVD 驱动器`。与主内存（`RAM`）相比，这种内存可以存储长时间的数据，即使计算机没有电源也是如此。然而，存储在这种内存中的程序不能直接执行。它们必须被传输到更快的内存中，即主内存。\n\
  \n## 输入设备\n\n输入设备是指所有从外部世界收集数据并输入计算机进行进一步处理的设备。键盘、鼠标和麦克风都是输入设备。\n\n## 输出设备\n\n输出设备是指将数据输出到外部世界的设备。显示器（屏幕）和打印机都是输出设备。\n\
  \n## 1.3 什么是软件？\n\n计算机的所有操作都由软件控制。软件分为两类：系统软件和应用程序。\n\n**系统软件**是控制和管理计算机基本操作的程序。例如，系统软件控制计算机的内部操作。它管理所有连接到它的设备，保存数据、加载数据以及允许其他程序的执行。系统软件的主要三个类型是：\n\
  \n- **操作系统**。`Windows`、`Linux`、`macOS`、`Android` 和 `iOS` 都是操作系统的示例。\n- **实用软件**。这类软件通常与操作系统一起安装。它们用于让计算机尽可能高效地运行。防病毒实用程序和备份实用程序被认为是实用软件。\n\
  - **设备驱动程序**。设备驱动程序控制连接到计算机的设备，例如鼠标或显卡。驱动程序是一个像翻译器的程序。它将操作系统的指令翻译成设备可以实际理解的指令。\n\
  \n**应用程序**是指你用于日常任务的所有其他程序，例如浏览器、文字处理软件、记事本、游戏等等。\n\n## 1.4 计算机如何执行（运行）程序\n\n当电脑启动计算机时，主内存（`RAM`）是完全空的。计算机需要做的第一件事是将操作系统从硬盘传输到主内存。\n\
  \n在操作系统加载到主内存后，你就可以执行（运行）任何你喜欢的程序（应用程序）。这通常通过点击、双击或触摸程序相应的图标来实现。例如，假设你点击了你喜欢的文字处理器的图标。此操作命令计算机从硬盘复制（或加载）文字处理程序到主内存（`RAM`），以便\
  \ `CPU` 可以执行它。\n\n程序存储在硬盘等次级存储设备上。当你在计算机上安装程序时，程序会被复制到硬盘上。然后，当你执行程序时，程序会从硬盘复制（加载）到主内存（`RAM`），并执行该程序的副本。\n\
  \n“运行”（run）和“执行”（execute）是同义词，可以相互替。\n\n## 1.5 编译器和解释器\n\n计算机可以执行用严格定义的计算机语言编写的程序。你不能使用英语或希腊语等自然语言编写程序，因为你的计算机不懂！\n\
  \n但计算机实际上理解什么？计算机可以理解一种称为机器语言的特定低级语言。在机器语言中，所有的语句（或命令）都由 01 组成。以下是用机器语言编写的程序示例，用于计算两个数字之和。\n\
  \n```\n0010 0001 0000 01000001 0001 0000 01010011 0001 0000 01100111 0000 0000 0001\n\
  ```\n\n感到惊讶吗？别担心，你不会用这种方式编写程序的。希望现在不再有人以这种方式编写计算机程序了。如今，所有的程序员都用高级语言编写程序，然后他们使用特殊的程序将它们翻译成机器语言。\n\
  \n高级语言是一种不限于特定类型计算机的语言。\n\n程序员用于执行翻译的程序有两种：编译器和解释器。\n\n**编译器**是一个将用高级语言编写的语句翻译成独立的机器语言程序的程序。你可以随需要的任何时候执行该机器语言程序。翻译完成后，除非你对高级语言程序进行了更改，否则不需要再次运行编译器。\n\
  \n**解释器**是一个同时翻译并执行用高级语言编写的语句的程序。当解释器读取高级语言程序中的每一条语句时，它将其翻译成机器语言代码并直接执行。这个过程对程序中的每条语句都会重复。\n\
  \n## 1.6 什么是源代码？\n\n程序员用高级语言编写的语句（通常称为指令或命令）被称为源代码或简称为代码。程序员首先将源代码输入到代码代码编辑器中，然后使用编译器将其翻译成机器语言程序，或者使用解释器同时翻译并执行它。\n\
  \n虽然在现在看来可能并不常见，但使用简单的文本编辑器编写程序是完全可能的！\n\n## 1.7 复习题：判断对错\n\n为以下每个陈述选择对或错。\n\n1)\
  \ 现代计算机能够执行许多不同的任务是因为它们具有可编程能力。\n2) 计算机可以在没有程序运行。\n3) 硬盘是硬件的示例。\n4) 数据可以长时间存储主内存（`RAM`）中，即使计算机没有电源。\n\
  5) 数据存储在主内存（`RAM`）中，但程序不是。\n6) 声器是输出设备的示例。\n7) `Windows` 和 `Linux` 是软件的示例。\n8) 设备驱动程序是硬件的示例。\n\
  9) 媒体播放器是系统软件的示例。\n10) 当启动计算机时，主内存（`RAM`）已经包含了操作系统。\n11) 当打开文字处理应用时，它实际上是从次级存储设备复制到主内存（`RAM`）的。\n\
  12) 在机器语言中，所有语句（命令）都是 0 和 1 的序列。\n13) 现在，计算机无法理解 0 和 1。\n14) 现在，软件是用由 01 组成的语言编写的。\n\
  15) 软件指的是计算机的物理组成部分。\n16) 编译器和解释器是软件。\n17) 编译器将源代码翻译成可执行文件。\n18) 解释器创建一个机器语言程序。\n\
  19) 考虑到程序可能会被执行多次，在通过解释翻译并执行一次后，对解释器的需求就变得多余了。\n20) 源代码可以使用简单的文本编辑器编写。\n21) 源代码可以在不经过编译或解释的情况下由计算机执行。\n\
  22) 用机器语言编写的程序需要编译（翻译）。\n23) 编译器翻译用高级语言编写的程序。\n\n## 1.8 复习题：单选择\n\n为以下每个陈述选择正确答案。\n\
  \n\n\n\n### 1) 以下哪一项不是计算机硬件？\na) 硬盘\nb) DVD 碟片\nc) 声卡\nd) 主内存 (`RAM`)\n\n### 2)\
  \ 以下哪一项不是次级存储设备？\na) DVD 读写器设备\nb) 固态硬盘 (`SSD`)\nc) USB 闪存盘\nd) `RAM`\n\n### 3)\
  \ 以下哪项操作是 CPU 无法执行的？\na) 将数据传输到主内存 (`RAM`)。\nb) 从主内存 (`RAM`) 传输数据。\nc) 执行算术运算。\n\
  d) 外科手术。\n\n### 4) 触摸屏是\na) 一种输入设备\nb) 一种输出设备\nc) 以上两者皆是\n\n### 5) 以下哪一项不是软件？\n\
  a) Windows\nb) Linux\nc) iOS\nd) 视频游戏\ne) 网页浏览器\nf) 以上均为软件。\n\n### 6) 以下哪种陈述是正确的？\n\
  a) 程序存储在硬盘上。\nb) 程序存储在 USB 闪存盘（U 盘）中。\nc) 程序存储在主内存 (`RAM`) 中。\nd) 以上全部正确。\n\n###\
  \ 7) 以下哪种陈述是正确的？\na) 程序直接从硬盘执行。\nb) 程序直接从 DVD 碟片执行。\nc) 程序直接从主内存 (`RAM`) 执行。\nd)\
  \ 以上全部正确。\ne) 以上陈述均不正确。\n\n### 8) 程序员无法使用以下语言编写计算机程序：\na) 机器语言\nb) 像英语、希腊语等自然语言。\n\
  c) `C++`\n\n### 9) 编译器会将什么\na) 用机器语言编写的程序翻译成高级语言程序。\nb) 用自然语言（英语、希腊语等）编写的程序翻译成机器语言程序。\n\
  c) 用高级计算机语言编写的程序翻译成机器语言程序。\nd) 以上都不是\ne) 以上都是\n\n### 10) 机器语言是\na) 机器之间相互通信使用的语言。\n\
  b) 一种由数值指令组成、计算机直接使用的语言。\nc) 一种使用英语单词进行操作的语言。\n\n## 11) 在用高级计算机语言编写的程序中如果如果相同的语句连续出现，解释器会\n\
  a) 翻译并执行第一个，然后翻译并执行第二个。\nb) 先翻译第一个，再翻译第二个，然后都执行它们。\nc) 仅翻译第一个（因为它们是相同的），然后执行两次。\n\
  \n## 第 2 章\n### C++ 与集成开发环境\n\n### 2.1 什么是 `C++` ？\n\n`C++` 是一种广泛使用的通用型、高级计算机编程语言，它允许程序员创建桌面或移动端应用程序、大规模应用、嵌入式系统、操作系统内核、驱动程序、客户端/服务器应用程序以及许多其他类型的软件。`C++`\
  \ 是其前身 `C` 编程语言的扩展。`C++` 与 `C` 的主要区别在于 `C++` 包含了现代编程技术，例如面向对象编程 (`OOP`)。此外，在 `C++`\
  \ 中，可以使用“C 风格”或“面向对象风格”编写代码——甚至两者兼用！\n\n### 2.2 脚本和程序有什么区别？\n\n从技术上讲，脚本是解释执行的，而程序是编译的，但这实际上并不是它们的主要区别。它们之间还有另一个更重要的区别！\n\
  \n用 `JavaScript` 或 `VBA`（应用程序视觉 Basic）等脚本语言编写的脚本的主要目的是控制另一个应用程序。因此你可以说，在某些方面 `JavaScript`\
  \ 控制网页浏览器，而 `VBA` 控制 Microsoft^® Office 应用程序（如 `MS Word` 或 `MS Excel`）。\n\n另一方面，用\
  \ `C++`、`C#` 或 `Java`（仅列举）等编程语言编写的程序独立于任何其他应用程序执行。用户在任何需要时程序都可以作为独立程序运行，而不需要宿应用程序。\n\
