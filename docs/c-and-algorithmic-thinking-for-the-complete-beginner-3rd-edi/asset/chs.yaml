  ![chapter28-16]\n\n13) 编写对应以下流程图的 C++ 程序：\n![chapter28-17]\n\n## 第 29 章\n循环控制结构的技巧与窍门\n\
  \n### 29.1 引言\n\n本章专门教授一些可以帮助你编写“更好”代码的技巧和窍门。在设计算法或 C++ 程序时，你应该始终记住这些技巧。\n\n这些技巧可以帮助提高代码的可读性，帮助你在解决特定问题时选择更好的循环控制结构，并使代码更短或运行更快。\n\
  \n![remember] 小的算法并不总是解决问题的最佳方案。为了解决特定问题，你编写的简洁算法可能会消耗大量的 CPU 时间或内存（RAM）。另一方面，你可以使用另一个长但计算更快或占用内存更少的算法。\n\
  \n### 29.2 选择循环控制结构\n\n下面的图可以帮助你根据迭代次数为每个问题选择最合适的循环控制结构。\n\n![chapter29-01]\n\n\
  ![notice] 此图推荐的是最佳选项，而非唯一选项。例如，当迭代次数已知时，使用测试循环或尾循环结构并不是错误的。不过，建议 `for` 循环更为方便。\n\
  \n### 29.3 “终极”规则\n\n在使用测试循环或尾循环结构时，经常困扰程序员的问题是：哪些语句应该写在循环内部，哪些写在外部，以及顺序是什么。\n\n\
  有一个简单而强大的规则——终极规则！一旦你遵循了它，逻辑错误的概率就会降为零！\n\n终极规则规定：\n\n- 参与循环表达式的变量或变量必须在进入循环之前初始化。\n\
  - 参与循环表达式的变量或变量必须在循环内部进行更新（修改）。具体来说，执行此更新/修改的语句必须是循环的最后语句之一。\n\n例如，如果变量 `x` 是参与循环表达式的变量，那么测试循环的形式如下：\n\
  \n```\n初始化 x\nwhile ( 表达式(x) ) {\n    语句或语句块\n    更新/修改 x\n}\n```\n\n而尾循环的形式如下：\n\
  \n```cpp\n初始化 x\ndo {\n    语句或语句块\n    更新/修改 x\n} while ( 表达式(x) );\n```\n\n其中：\n\
  \n- `初始化 x` 是任何给变量 `x` 分配初始值的语句。它可以是 `cin` 等输入语句，也可以使用赋值运算符（=`）的赋值语句。但在尾循环结构中，该语句有时是冗的，可以省略，因为\
  \ `x` 的初始化可以直接发生在循环内部。\n- `表达式(x)` 可以是从简单到复杂的依赖变量 `x` 的逻辑表达式。\n- `更新/修改 x` 是任何改变\
  \ `x` 值的语句，例如另一个输入语句、使用赋值运算符（=`）的赋值语句，甚至是复合赋值运算符。重要重要的是，该语句必须位于循环表达式求值点之前。这意味着它是循环内部的最后语句之一。\n\
  \n以下是使用“终极”规则的一些示例。\n\n示例 1\n\n```cpp\ncin >> a; // 初始化 a\nwhile (a > 0) { // 依赖\
  \ a 的表达式\n    cout << a << endl;\n    a = a - 1; // 更新/修改 a\n}\n```\n\n示例 2\n\n\
  ```cpp\ncin >> a; // 初始化 a\ncin >> b; // 初始化 b\nwhile (a > b) { // 依赖 a 和 b 的表达式\n\
  \    cout << a << \"  \" << b << endl;\n    cin >> a; // 更新/修改 a\n    cin >> b;\
  \ // 更新/修改 b\n}\n```\n\n示例 3\n\n```cpp\ns = 0; // 初始化 s\ndo {\n    cin >> y;\n \
  \   s = s + y; // 更新/修改 s\n} while (s < 1000); // 依赖 s 的表达式\n```\n\n示例 4\n\n```cpp\n\
  y = 0; // 初始化 y\ndo {\n    cin >> y; // 更新/修改 y\n} while (y < 0); // 依赖 y 的表达式\n\
  ```\n\n\n\n\n在此示例中，在循环外部初始化变量 `y` 是多余的，可以省略，如下所示。\n\n```cpp\ndo {cin >> y;  //对\
  \ y 进行初始化和更新/修改} while (y < 0);  //依赖于 y 的布尔表达式\n```\n\n###  5\n\n```cpp\nodd =\
  \ 0;   //初始化 odd\neven = 0;  //初始化 even\nwhile (odd + even < 5) {  //依赖于 odd 和 even\
  \ 的布尔表达式\ncin >> x;if (x % 2 == 0) {\n\n> even++;  //对 even 进行更新/修改\n\n}else {\n\
  \n> odd++;   //对 odd 进行更新/修改\n\n}}cout << \"Odds: \" << odd << \" Evens: \" << even\
  \ << endl;\n```\n\n现在，你会明白为什么要始终遵循“终极”规则了！让我们来看下面的练习：\n\n编写一段代码片段，让用户重复输入数字，直到总共输入了三个正数。\n\
  \n这个练习题是布置给一个班级的，一个学生给出的代码片段作为答案。\n\n```cpp\nint positivesCount;double x;positivesCount\
  \ = 0;cin >> x;while (positivesCount != 3) {if (x > 0) {\n\n> positivesCount +=\
  \ 1;\n\n}cin >> x;}cout << \"Three Positives provided!\" << endl;\n```\n\n乍看之下它是正确的。它让用户输入一个数字，进入循环，检查用户提供的数字是否为正数，然后让用户输入第二个数字，以此此类推。然而，这段代码包含一个逻辑错误——不幸的是，这是一个非常隐蔽的错误。你能发现它吗？\n\
  \n尝试不同的输入值（正数、负数，甚至是零）来跟踪执行流。当用户输入一个正数时，变量 `positivesCount` 加 1；而当他们输入负数或零时，它保持不变。一切看起来运行得很顺畅，不是吗？——顺畅到甚至可能让你怀疑这本书是否可靠，或者你是否应该把它扔掉！\n\
  \n只有当用户尝试输入所有三个预期的正值时，问题才会变得显而易见。下面的追踪表可以帮助你确定问题所在。假设用户想要输入值 5、−10、−2、4 和 20。\n\n\
  | 步骤 | 语句 | 备注 | positivesCount | x |\n| --- | --- | --- | --- | --- |\n| 1 | `positivesCount\
  \ = 0` | | 0 | ? |\n| 2 | `cin >> x` | | 0 | 5.0 |\n| 3 | `while (positivesCount\
  \ != 3)` | 结果为真 | | |\n| 4 | `if (x > 0)` | 结果为真 | | |\n| 5 | `positivesCount +=\
  \ 1` | | 1 | 5.0 |\n| 6 | `cin >> x` | | 1 | −10.0 |\n| 7 | `while (positivesCount\
  \ != 3)` | 结果为真 | | |\n| 8 | `if (x > 0)` | 结果为假 | | |\n| 9 | `cin >> x` | | 1 |\
  \ −2.0 |\n| 10 | `while (positivesCount != 3)` | 结果为真 | | |\n| 11 | `if (x > 0)`\
  \ | 结果为假 | | |\n| 12 | `cin >> x` | | 1 | 4.0 |\n| 13 | `while (positivesCount !=\
  \ 3)` | 结果为真 | | |\n| 14 | `if (x > 0)` | 结果为真 | | |\n| 15 | `positivesCount +=\
  \ 1` | | 2 | 4.0 |\n| 16 | `cin >> x` | | 2 | 20.0 |\n| 17 | `while (positivesCount\
  \ != 3)` | 结果为真 | | |\n| 18 | `if (x > 0)` | 结果为真 | | |\n| 19 | `positivesCount\
  \ += 1` | | 3 | 20.0 |\n| 20 | `cin >> x` | | 3 | ??? |\n\n逻辑错误就在这里！在第 20 步，尽管用户提供的正数总数已经是三个，你预期执行会结束，但不幸的是，用户被要求输入额外的数字！但是，你需要的是一个让用户输入三个正数而不是四个的代码片段，对吧？\n\
  \n这就是为什么你应该始终“按部就班”！让我们看看这段代码片段应该怎么写。\n\n由于 while 循环的布尔表达式依赖于变量 `positivesCount`，因此该变量必须在循环外初始化。该变量也必须在循环内部进行更新/修改。执行此更新/修改的语句必须是循环内的最后一条语句，如下代码片段（通用形式）所示。\n\
  \n```cpp\npositivesCount = 0;            //初始化 positivesCount\nwhile (positivesCount\
  \ != 3) {  //这依赖于 positivesCount\n一条语句或语句块\nif (x > 0) {\n\n> positivesCount +=\
  \ 1;       //对 positivesCount 进行更新/修改\n\n}}\n```\n\n现在你可以添加任何必要的语句来完成代码。为了完成代码，唯一的语句是（即显示）：\n\
  \n```cpp\nint positivesCount;double x;positivesCount = 0;cin >> x;while (positivesCount\
  \ != 3) {if (x > 0) {\n\n> positivesCount += 1;\n\n}cin >> x;}cout << \"Three Positives\
  \ provided!\" << endl;\n```\n\n### 29.4 退出循环\n\n循环可能会消耗太多时间，特别是当它们在条件不满足时一直运行。有些人可能认为\
  \ 900 次迭代并不是什么，他们可能是正确的。然而，在大规模数据处理中，每次迭代都至关重要。因此，在使用循环结构时要非常小心，特别是那些迭代次数大量的循环。如果密码是十位的呢？这意味着循环将必须执行\
  \ 9,000,000,000 次迭代！\n\n有两种方法可以帮助你让程序运行得更快。这两种方法的核心思想都是满足特定条件时退出循环；在这种情况下是找到了隐藏密码。\n\
  \n#### 第一种方法——使用 break 语句\n\n你可以通过 `break` 语句在循环实际完成所有迭代之前退出它。\n\n看下面的 C++ 程序。当找到隐藏密码时，执行流会退出（跳出）for\
  \ 循环。\n\n```cpp\nfound = false;for (i = 100; i <= 999; i++) {if (i == hiddenPassword)\
  \ {\n\n> password = i;\n\n> found = true;\n\n> break;\n\n}}if (found) {cout << \"\
  Hidden password is: \" << password << endl;}\n```\n\n#### 第二种方法——使用标记位 \n\n`break`\
  \ 语句并不存在于所有的计算机语言中；由于本书的意图是教你“算法思维”（而不仅仅是只有 C++ 支持的特殊语句），让我们来看另一种方法。\n\n在下面的 C++\
  \ 程序中，当找到隐藏密码时，布尔表达式 `found == false` 会强制执行流退出循环。\n\n```cpp\nfound = false;i = 100;while\
  \ (found == false && i <= 999) {if (i == hiddenPassword) {\n\n> password = i;\n\n\
  > found = true;\n\n}i++;}if (found) {cout << \"Hidden password is: \" << password\
  \ << endl;}\n```\n\n\n\n\n![](img/notice.jpg)将变量 `found` 视为标记。初始时，该标记未被“触发”（`found\
  \ = false`）。执行流进入循环，只要标记保持为未触发状态（`while found == false` …），循环就会继续迭代。当循环内部发生触发标记的操作（将变量\
  \ `found` 赋值为 `true`）时，执行流退出循环。\n\n![](img/notice.jpg)`while (found == false &&\
  \ i <= 999)` 也可以写为 `while (!found && i <= 999)`。\n\n![](img/notice.jpg)在隐藏密码未找到的情况下，`i\
  \ <= 999` 布尔表达式仍然是必要的。\n\n### 29.5 清理你的循环\n\n如所述，循环可能会消耗过多的 CPU 时间，因此你必须非常小心并节使用它们。虽然大量的迭代有时是不可避免的，但你总是可以通过一些事情来你的循环运行得更好。\n\
  \n下一个代码片段计算数字 1, 2, 3, 4, 5, … 10000 的和。\n\n```\ns = 0;i = 1;do {countOfNumbers\
  \ = 10000;s = s + i;i++;} while (i <= countOfNumbers);cout << s << endl;\n```\n\n\
  在使用循环（尤其是执行多次迭代的循环）时，你应该始终记住避免在循环内部放置任何对该循环没有作用的语句。在上例中，语句 `countOfNumbers = 10000`\
  \ 就是这样的语句。不幸的是，只要它存在于循环内部，计算机就会无故地执行 10000 次，这自然会影响计算机性能。\n\n为了解决这个问题，你可以简单地将此语句移动循环外部，如下：\n\
  \n```\ncountOfNumbers = 10000;s = 0;i = 1;do {s = s + i;i++;} while (i <= countOfNumbers);cout\
  \ << s << endl;\n```\n\n#### 练习 29.5-1 清理循环\n\n以下代码片段计算数字 1, 2, 3, 4, … 10000 的平均值。尝试尽可能将语句移到循环外部，以使程序更高效。\n\
  \n```\ns = 0;for (i = 1; i <= 10000; i++) {s = s + i;average = s / 10000;}cout <<\
  \ average << endl;\n```\n\n##### 解决方案\n\n新手程序员在计算平均值时会犯的一个非常常见的错误，是将总和除以数字个数的语句（这里是\
  \ `average = s / 10000`）放在循环内部。想一下！假设你想计算学校的平均分。你的第一步是计算你所修的所有 10 门课程成绩的总和。然后，当所有成绩相加后，你将总和除以\
  \ 10。这意味着你执行了 10 次加法只执行了一次除法。\n\n![](img/notice.jpg)计算平均值是一个步骤步骤。\n\n因此，在循环内部计算平均值是没有意义的。你可以将此语句移到循环外部并紧跟循环之后，让循环仅用于累加数字，如下：\n\
  \n```\ns = 0;for (i = 1; i <= 10000; i++) {s = s + i;}average = s / 10000;cout <<\
  \ average << endl;\n```\n\n#### 练习 29.5-2 清理循环\n\n下一个公式\n\n.![Image](img/chapter29-02.png)\n\
  \n使用以下代码片段求解，其中 `N` 由用户提供。\n\n```\nint n, i, j, denom;double s;cout << \"Enter N:\
  \ \";cin >> n;s = 0;for (i = 1; i <= n; i++) {denom = 0;for (j = 1; j <= n; j++)\
  \ { denom += pow(j, j)}s += i / (double)denom;}\n```\n\n尝试将尽可能多的语句移到循环外部，使代码更高效。\n\
  \n##### 解决方案\n\n从公式可以看出，分母对于所有分数都是通用的。因此，对每个分数反复计算分母是没有意义的。你可以计算一次分母并多次使用结果，如下：\n\
  \n```\nint n, i, j, denom;double s;cout << \"Enter N: \";cin >> n;denom = 0; for\
  \ (j = 1; j <= n; j++) {denom += pow(j, j);}s = 0;for (i = 1; i <= n; i++) {s +=\
  \ i / (double)denom;}cout << s << endl;\n```\n\n### 29.6 死循环以及如何停止它们\n\n所有的 while\
  \ 循环必须在循环内部包含最终会导致执行流退出循环的内容。但错误会发生！例如，以下代码片段包含死循环。不幸的是，程序员忘记在循环内部增加变量 `i`；因此 `i`\
  \ 永远无法达到 10。\n\n```\ni = 1;while (i != 10) {cout << \"Hello there!\" endl;}\n```\n\
  \n![](img/notice.jpg)如果循环无法停止，被称为死循环或无限循环。\n\n程序员可能犯的另一个错误如下：\n\n```\ni = 1;while\
  \ (i != 10) {cout << \"Hello there!\" endl;i += 2;}\n```\n\n尽管这段代码片段包含一个增加变量 `i`\
  \ 的语句，执行流永远不会退出循环，因为值 10 从未赋值给变量 `i`。\n\n死循环持续迭代，停止它的唯一方法是使用强制手段！例如，当 Windows 系统中的应用程序“无响应”（因为执行流进入了死循环），用户必须使用组合键\
  \ `ALT+CTRL+DEL` 来强制应用程序结束。\n\n在 Visual Studio Community 或 Visual Studio Code 中，当你意外编写并执行死循环时，只需点击工具栏上的“停止调试”![stop_button.png)\
  \ 或“停止”![code_stop_button.png)，执行就会停止。![](img/notice.jpg)在 Visual Studio Code 中，强制应用程序结束的另一种方法是在终端窗口中使用组合键\
  \ `CTRL+C`。\n\n### 29.7 “由内而外”方法\n\n由内而外是本书提出的一个方法，帮助你从内向外学习“算法思维”。这种方法首先处理并设计内部（嵌套）控制结构，然后随着算法（或程序）的发展，添加越来越多的控制结构。这种方法可以用于大型复杂的控制结构，因为它帮助你设计无误的流程图甚至是\
  \ C++ 程序。本书在任何以及需要的地方都使用这种方法。\n\n尝试以下示例。\n\n编写一个 C++ 程序显示所示的乘法表。\n\n![Image](img/chapter29-03.png)\n\
  \n根据“由内而外”方法，你从编写内部控制结构开始，当一切测试并运行良好后，你可以添加外部控制结构。\n\n所以，让我们尝试只显示乘法表的第一行。如果你检查这一行，会发现在每次乘法中，乘数始终是\
  \ 1。让我们认为乘数为值为 1 的变量 `i`。只显示乘法表第一行的循环控制结构如下。\n\n![](img/my_exercise_header.png)\
  \ 代码片段 1\n```\nfor (j = 1; j <= 10; j++) {cout << i << \"x\" << j << \"=\" << i\
  \ * j << \"\\t\";}\n```\n\n如果你执行这段代码片段，结果是：\n\n![Image](img/chapter29-04.png)\n\n\
  ![](img/notice.jpg)特殊字符序列 `\\t` 在每次迭代后显示一个制表符。这确保了所有内容正确对齐。\n\n内部（嵌套）循环控制结构已经就绪。你现在需要一种执行该控制结构九次的方法，但每次变量\
  \ `i` 必须包含从 1 到 9 的不同值。可以通过如下实现：\n\n![](img/my_exercise_header.png) 主代码\n```\nfor\
  \ (i = 1; i <= 9; i++) {一条语句或语句块 cout << endl;}\n```\n\n![](img/notice.jpg)`cout\
  \ << endl` 语句用于在行与行之间换行。\n\n将代码片段 1 嵌入主代码中，最终的 C++ 程序变为：\n\n![](img/my_exercise_header.png)\
  \ project_29.7\n```cpp\n#include <iostream>\nusing namespace std;\nint main() {int\
  \ i, j;for (i = 1; i <= 9; i++) {\n\nfor (j = 1; j <= 10; j++) {\n\n> cout << i\
  \ << \"x\" << j << \"=\" << i * j << \"\\t\";\n\n}\n\n> cout << endl;\n\n}return\
  \ 0;}\n```\n\n\n\n\n\n### 29.8 复习题：判断对错\n\n对以下每个陈述进行判断对错。\n\n1) 当迭代次数未知时，你可以使用定值循环（definite\
  \ loop）。\n2) 当迭代次数已知时，你不能使用后测试循环结构（post-test loop）。\n3) 根据“终极规则”，在先测试循环结构中，参与循环布尔表达式的变量初始化必须在循环内部完成。\n\
  4) 根据“终极规则”，在先测试循环结构中，更新/改变参与循环布尔表达式的变量值的语句必须是循环内的最后一条语句。\n5) 根据“终极规则”，在后测试循环结构中，参与循环布尔表达式的变量初始化有时可以在循环内部完成。\n\
  6) 根据“终极规则”，在后测试循环结构中，参与循环布尔表达式的变量的更新/改动必须是循环内的第一条语句。\n7) 在 C++ 中，你可以使用 `exit break`\
  \ 语句在循环完成所有迭代之前跳出循环。\n8) 给变量赋常量值的语句最好放在循环控制结构之外。\n9) 在下面的代码段中，至少有一条语句可以移动到 `for`\
  \ 循环之外。\n```cpp\nfor (i = 1; i <= 30; i++) {\n    a = \"Hello\";\n    cout << a\
  \ << endl;\n}\n```\n10) 在下面的代码段中，至少有一条语句可以移动到 `while` 循环之外。\n```cpp\ns = 0;\ncount\
  \ = 1;\nwhile (count < 100) {\n    cin >> a;\n    s += a;\n    average = s / (double)count;\n\
  \    count++;\n}\ncout << average << endl;\n```\n11) 在下面的代码段中，至少有一条语句可以移动到 `while`\
  \ 循环之外。\n```cpp\ns = 0;\ncin >> y;\nwhile (y != -99) {\n    s = s + y;\n    cin\
  \ >> y;\n}\n```\n12) 下面的代码段满足有限性。\n```cpp\ni = 1;\nwhile (i != 100) {\n    cout\
  \ << \"Hello there!\" << endl;\n    i += 5;\n}\n```\n13) 当先测试循环结构的布尔表达式中使用不等于（`!=`）比较运算符时，循环将永远无限迭代。\n\
  14) 下面的代码段满足有限性。\n```cpp\ni = 0;\ndo {\n    cout << \"Hello there!\" << endl;\n\
  \    i += 5;\n} while (i < 100);\n```\n\n### 29.9 复习题：单选题\n\n为以下每个陈述选择正确答案。\n\n\
  1) 当迭代次数未知时，你可以使用：\na) 先测试循环结构。\nb) 后测试循环结构。\nc) 以上所有\n2) 当迭代次数已知时，你可以使用：\na) 先测试循环结构。\n\
  b) 后测试循环结构。\nc) `for`-循环。\nd) 以上所有\n3) 根据“终极规则”，在先测试循环结构中，参与循环布尔表达式的变量初始化必须在：\n\
  a) 循环内部。\nb) 循环外部。\nc) 以上所有\n4) 根据“终极规则”，在先测试循环结构中，参与循环布尔表达式的变量的更新/改动必须在：\na) 循环内部。\n\
  b) 循环外部。\nc) 以上所有\n5) 根据“终极规则”，在后测试循环结构中，参与循环布尔表达式的变量初始化可以：\na) 在循环内部。\nb) 在循环外部。\n\
  c) 以上所有\n6) 在下面的代码段中：\n```cpp\ns = 0;\nfor (i = 1; i <= 100; i++) {\n    s = s +\
  \ i;\n    x = 100.0;\n    average = s / x;\n}\n```\n可以移动到 `for` 循环之外的语句数量是：\na)\
  \ 0。\nb) 1。\nc) 2。\nd) 3\n7) 当此比较运算符用于后测试循环结构的布尔表达式时，循环将永远迭代：\na) `==`\nb) `!=`\n\
  c) 取决于情况\n\n### 29.10 复习练习\n\n完成以下练习。\n\n1) 下面程序提示用户反复输入名称，直到输入单词“STOP”（用作名称）。在最后，程序必须显示输入的名称总数，以及这些名称中不是“John”的个数。\n\
