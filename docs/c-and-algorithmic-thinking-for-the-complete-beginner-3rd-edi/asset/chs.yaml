  \ The year cannot be less than 1582\" << endl;\n    } else {\n        if (y % 4\
  \ == 0 && y % 100 != 0 || y % 400 == 0) {\n            cout << \"Leap year!\" <<\
  \ endl;\n        } else {\n            cout << \"Not a leap year\" << endl;\n  \
  \      }\n    }\n    return 0;\n}\n```\n\n![](img/remember.jpg) `AND` (`&&`) 运算符的优先级高于\
  \ `OR` (`||`) 运算符。\n\n#### 练习 23.5-2 显示月份的天数\n\n编写一个 C++ 程序，提示用户输入年份和月份，然后显示该月份有多少天。该程序需要考虑闰年的情况。在闰年情况下，二月有\
