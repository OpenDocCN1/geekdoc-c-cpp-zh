  \n### 32.1 在 C++ 中创建二维数组\n\n二维数组是一种可以存储按行和列组织的值的数据结构。它允许你高效地表示和操作表格数据。例如，一个可以容三名学生四节课程成绩的数组如下。\n\
  \n![Image](img/chapter32-01.png)\n\n二维数组有行有列。在这个特定的示例中，数组 `grades` 具有 3 行 4 列。\n\
  \n与一维数组一样，有许多方法创建并向二维数组中添加元素（以及值）。让我们尝试使用最常用的方法来创建 `grades` 数组。\n\n#### 方法一\n\n\
  要创建一个数组并直接向其元素赋值，你可以可以使用下一个 C++ 语句，其通用形式如下：\n\n`type array_name[number_of_rows][number_of_columns]\
  \ = {{value0-0, value0-1, value0-2, …, value0-M},{value1-0, value1-1, value1-2,\
  \ …, value1-M},{value2-0, value2-1, value2-2, …, value2-M},…{valueN-0, valueN-1,\
  \ valueN-2, …, valueN-M}};`\n\n其中：\n\n- `type` 可以是 `int`、`double`、`string` 等。\n\
  - `array_name` 是数组的名称。\n- `number_of_rows` 和 `number_of_columns`可以是任何正整数。`number_of_rows`\
  \ 值是可选的。\n- `value0-0`、`value0-1`、`value0-2`、……`valueN-M` 是数组元素的值。\n\n对于这种方法，你可以可以使用语句创建\
  \ `grades` 数组：\n\n`string grades[3][4] = {{\"B+\", \"A+\", \"A\", \"C-\"}, {\"...\"\
  }, {\"...\"}};` \n\n这也可以写成：\n\n`string grades[][4] = {{\"B+\", \"A+\", \"A\", \"\
  C-\"}, {\"...\"}, {\"...\"}};`\n\n索引会自动设置。第一个值 \"B+\" 被赋值给索引 0, 0，第二个值 \"A+\" 被赋值给索引\
  \ 0, 1，依此类推。\n\n#### 方法二\n\n你可以使用以下 C++ 语句创建一个带有空元素的二维数组，其通用形式如下：\n\n`type array_name[number_of_rows][number_of_columns];`\n\
  \n其中：\n\n- `type` 可以是 `int`、`double`、`string` 等。\n- `array_name` 是数组的名称。\n- `number_of_rows`\
  \ 和 `number_of_columns`可以是任何正整数。这两个值都是必须的。\n\n然后可以使用以下语句为数组元素赋值：\n\n`array_name[row_index][column_index]\
  \ = value;`\n\n其中 `row_index` 和 `column_index` 分别是数组元素的行索引和列索引。\n\n以下代码片段创建一个具有\
  \ 3 行 4 列 12 个空元素的 `grades` 数组，然后给其元素赋值：\n\n```cpp\nstring grades[3][4];\ngrades[0][0]\
  \ = \"B+\";\ngrades[0][1] = \"A+\";\ngrades[0][2] = \"A\";\ngrades[0][3] = \"C-\"\
  ;\ngrades[1][0] = \"B\";\ngrades[1][1] = \"A\";\ngrades[1][2] = \"C\";\ngrades[1][3]\
  \ = \"A+\";\ngrades[2][0] = \"B\";\ngrades[2][1] = \"B\";\ngrades[2][2] = \"B-\"\
  ;\ngrades[2][3] = \"B+\";\n```\n\n### 32.2 如何从二维数组获取值\n\n二维数组由行和列组成。下面的示例展示了一个具有\
  \ 3 行 4 列的二维数组。\n\n![Image](img/chapter32-03.png)\n\n二维数组的每个元素都可以使用一对索引来唯一标识：行索引和列索引，如下所示。\n\
  \n`array_name[row_index][column_index]`\n\n以下代码片段创建一个具有 3 行 4 列的二维数组 `grades`，然后显示它的部分元素：\n\
  \n```cpp\nstring grades[3][4] = {{\"B+\", \"A+\", \"A\", \"C-\"},{\"B\", \"A\",\
  \ \"C\", \"D\"},{\"B\", \"B\", \"B-\", \"B+\"}};\ncout << grades[1][2] << endl;\
  \ // 它显示: C\ncout << grades[2][2] << endl; // 它显示: B-\ncout << grades[0][0] << endl;\
  \ // 它显示: B+\n```\n\n#### 练习 32.2-1 创建跟踪表\n\n为下一个代码片段创建跟踪表。\n\n\n\n\n\n```cpp\n\
  int a[3][2] = {{0, 0},{0, 0},{0, 0}};a[1][0] = 9;a[0][1] = 1;a[0][0] = a[0][1] +\
  \ 6;x = 2;a[x][1] = a[0][0] + 4;a[x - 1][1] = a[0][1] * 3;a[x][0] = a[x - 1][1]\
  \ - 3;\n```\n\n##### 解决方案\n\n这段代码段使用了 `3 × 2` 数组，即具有 3 行 2 列的数组。跟踪表下所示。\n\n| 步骤\
  \ | 语句 | 注释 | x | a |\n| :--- | :--- | :--- | :--- | :--- |\n| 1 | `int[3][2] a\
  \ = {{0, 0}, {0, 0}, {0, 0}}` | 这创建了一个值为零的数组 `a`。 | ? | \\| 0, 0 \\| \\| 0, 0 \\\
  | \\| 0, 0 \\| |\n| 2 | `a[1][0] = 9` | | ? | \\| 0, 0 \\| \\| 9, 0 \\| \\| 0, 0\
  \ \\| |\n| 3 | `a[0][1] = 1` | | ? | \\| 0, 1 \\| \\| 9, 0 \\| \\| 0, 0 \\| |\n\
  | 4 | `a[0][0] = a[0][1] + 6` | | ? | \\| 7, 1 \\| \\| 9, 0 \\| \\| 0, 0 \\| |\n\
  | 5 | `x = 2` | | 2 | \\| 7, 1 \\| \\| 9, 0 \\| \\| 0, 0 \\| |\n| 6 | `a[x][1] =\
  \ a[0][0] + 4` | | 2 | \\| 7, 1 \\| \\| 9, 0 \\| \\| 0, 11 \\| |\n| 7 | `a[x - 1][1]\
  \ = a[0][1] * 3` | | 2 | \\| 7, 1 \\| \\| 9, 3 \\| \\| 0, 11 \\| |\n| 8 | `a[x][0]\
  \ = a[x - 1][1] - 3` | | 2 | \\| 7, 1 \\| \\| 9, 3 \\| \\| 0, 11 \\| |\n\n## 32.3\
  \ 如何遍历二维数组\n\n由于二维数组由行和列组成，程序可以遍历行也可以遍历列。\n\n### 按行遍历\n\n按遍历意味着首先处理第 0 行，接着处理第 1\
  \ 行，然后是第 2 行，依此类推。接下来是一个 `3 × 4` 数组的示例。箭头显示了执行行遍历时遵循的“路径”，换说，它们展示了元素的处理顺序。\n\n![Image](img/chapter32-04.png)\n\
  \n![](img/remember.jpg) `3 × 4` 数组是一个具有 3 行 4 列的二维数组。在 `Y × X` 表示法中，第一个数字 (Y) 始终代表总行数，第二个数字\
  \ (X) 始终代表总列数。\n\n当按行遍历时，数组元素的处理方式如下：\n\n- ► 第 0 行的元素按照以下顺序处理：`a[0][0] → a[0][1]\
  \ → a[0][2] → a[0][3]`\n- ► 第 1 行的元素按照以下顺序处理：`a[1][0] → a[1][1] → a[1][2] → a[1][3]`\n\
  - ► 第 2 行的元素按照以下顺序处理：`a[2][0] → a[2][1] → a[2][2] → a[2][3]`\n\n### 方法一\n\n使用 C++\
  \ 语句，让我们尝试按行遍历处理 `3 × 4` 数组（3 行 4 列）的所有元素。\n\n```cpp\ni = 0; // 变量 i 指第 0 行。\nfor\
  \ (j = 0; j <= 3; j++) { // 这个循环控制结构处理第 0 行的所有元素\n    process a[i][j];\n}\ni = 1;\
  \ // 变量 i 指第 1 行。\nfor (j = 0; j <= 3; j++) { // 这个循环控制结构处理第 1 行的所有元素\n    process\
  \ a[i][j];\n}\ni = 2; // 变量 i 指第 2 行。\nfor (j = 0; j <= 3; j++) { // 这个循环控制结构处理第\
  \ 2 行的所有元素\n    process a[i][j];\n}\n```\n\n当然，可以使用如下所示的嵌套控制结构来实现相同的结果。\n\n```cpp\n\
  for (i = 0; i <= 2; i++) {\n    for (j = 0; j <= 3; j++) {\n        process a[i][j];\n\
  \    }\n}\n```\n\n让我们看一些例子。以下代码段允许用户向数组 `b` 输入 `10 × 10 = 100` 个值。\n\n```cpp\nfor\
  \ (i = 0; i <= 9; i++) {\n    for (j = 0; j <= 9; j++) {\n        cin >> b[i][j];\n\
  \    }\n}\n```\n\n以下代码段将数组 `b` 的所有值减 1。\n\n```cpp\nfor (i = 0; i <= 9; i++) {\n\
  \    for (j = 0; j <= 9; j++) {\n        b[i][j]--; // 等于：b[i][j] = b[i][j] - 1\n\
  \    }\n}\n```\n\n以下代码段显示数组 `b` 的所有元素。\n\n```cpp\nfor (i = 0; i <= 9; i++) {\n \
  \   for (j = 0; j <= 9; j++) {\n        cout << b[i][j] << \"\\t\";\n    }\n   \
  \ cout << endl;\n}\n```\n![](img/notice.jpg) `cout << endl` 语句用于换行。\n\n### 方法二\n\
  \n另一种非常简单的方法，但没有前面的方法灵活。如下面所示，在某些情况下它无法使用。\n\n```cpp\nfor (const auto& row : array_name)\
  \ {\n    for (const auto& element : row) {\n        process element;\n    }\n}\n\
  ```\n这个 C++ 程序每次迭代显示一个元素。但请记住，这种方法不能用于修改数组的值。例如，如果你想将数字翻倍，你不能执行操作：\n\n```cpp\nint\
  \ numbers[2][4] = {{5, 10}, {2, 6}};\n```\n\n\n\n\n\n```cpp\nint main() {\n  string\
  \ names[3][2];\n  cout << \"Name for row 0, column 0: \"; cin >> names[0][0];\n\
  \  cout << \"Name for row 0, column 1: \"; cin >> names[0][1];\n  cout << \"Name\
  \ for row 1, column 0: \"; cin >> names[1][0];\n  cout << \"Name for row 1, column\
  \ 1: \"; cin >> names[1][1];\n  cout << \"Name for row 2, column 0: \"; cin >> names[2][0];\n\
  \  cout << \"Name for row 2, column 1: \"; cin >> names[2][1];\n  …\n}\n```\n\n\
  使用嵌套 for 循环，这段代码片段可以等价地写为：\n\n```cpp\nconst int ROWS = 3;\nconst int COLUMNS = 2;\n\
  int main() {\n  int i, j;\n  string names[ROWS][COLUMNS];\n  for (i = 0; i <= ROWS\
  \ - 1; i++) {\n    for (j = 0; j <= COLUMNS - 1; j++) {\n      cout << \"Name for\
  \ row \" << i << \", column \" << j << \": \";\n      cin >> names[i][j];\n    }\n\
  \  }\n  return 0;\n}\n```\n\n### 练习 32.4-1 仅显示实数\n\n编写一个 C++ 程序，提示用户在 5 × 7 数组中输入数值，然后显示包含实数的元素的索引。\n\
  \n##### 解决方案\n\n遍历行是最流行的方法，所以让我们让我们使用它吧。解决方案如下。\n\n![](img/my_exercise_header.png)\
  \ project_32.4-1\n```cpp\n#include <iostream>\nusing namespace std;\nconst int ROWS\
  \ = 5;\nconst int COLUMNS = 7;\nint main() {\n  int i, j;\n  double a[ROWS][COLUMNS];\n\
  \  for (i = 0; i <= ROWS - 1; i++) {\n    for (j = 0; j <= COLUMNS - 1; j++) {\n\
  \      cout << \"Enter a value for element \" << i << \", \" << j << \": \";\n \
  \     cin >> a[i][j];\n    }\n  }\n  for (i = 0; i <= ROWS - 1; i++) {\n    for\
  \ (j = 0; j <= COLUMNS - 1; j++) {\n      if (a[i][j] != (int)(a[i][j])) { // 检查是否为实数（浮点）\n\
  \        cout << \"A real found at position: \" << i << \", \" << j << endl;\n \
  \     }\n    }\n  }\n  return 0;\n}\n```\n\n### 练习 32.4-2 仅显示奇数列\n\n编写一个 C++ 程序，提示用户在\
  \ 5 × 7 数组中输入数值，然后显示索引为奇数的列元素（即列索引 1、3 和 5）。\n\n##### 解决方案\n\n接下来是该 C++ 程序。\n\n\
  ![](img/my_exercise_header.png) project_32.4-2\n```cpp\n#include <iostream>\nusing\
  \ namespace std;\nconst int ROWS = 5;\nconst int COLUMNS = 7;\nint main() {\n  int\
  \ i, j;\n  double a[ROWS][COLUMNS];\n  for (i = 0; i <= ROWS - 1; i++) {\n    for\
  \ (j = 0; j <= COLUMNS - 1; j++) {\n      cout << \"Enter a value for element \"\
  \ << i << \", \" << j << \": \";\n      cin >> a[i][j];\n    }\n  }\n  // 遍历列\n\
  \  for (j = 1; j <= COLUMNS - 1; j += 2) { // 从 1 开始并步增 2\n    for (i = 0; i <=\
  \ ROWS - 1; i++) {\n      cout << a[i][j] << \"  \";\n    }\n  }\n  return 0;\n\
  }\n```\n\n![](img/notice.jpg) 本书尝试尽可能使用变量 `i` 作为行索引，使用变量 `j` 作为列索引。当然，你也可以使用其他变量名，例如用于行索引的\
  \ `row、r` 或用于列索引的 `column、c`，但变量 `i` 和 `j` 被大多数程序员广泛使用。在使用一段时间后，你的大脑会将 `i` 与行联系起来，将\
  \ `j` 与列联系起来。因此，在二维数组中使用这些变量名作为索引的算法或程序将更容易被理解。\n\n### 32.5 变量 i 和 j 有什么故事？\n\n\
  许多程序员认为名称 `i` 代表“index”（索引），而 `j` 的使用仅仅是因为它排在 `i` 后面。还有人认为名称 `i` 代表“integer”（整数）。事实可能介于两者之间。\n\
  \n在计算机出现很久，数学家就已经使用 `i`、`j` 和 `k` 来在数学中表示整数。后来，在第一种高级计算机语言之一 `FORTRAN` 中，变量 `i`、`j`、`k`、`l`、`m`\
  \ 和 `n` 都是整数。因此，第一批程序员养成了在程序中使用变量 `i` 和 `j` 的习惯，这成为了大多数计算机语言中的约定。\n\n### 32.6 方阵\n\
  \n在数学中，行数和列数相同的矩阵被称为方阵。以下是方阵的一些示例。\n\n.![Image](img/chapter32-06.png)\n\n.![Image](img/chapter32-07.png)\n\
  \n### 练习 32.6-1 寻找主对角线元素之和\n\n编写一个 C++ 程序，让用户在 10 × 10 数组中输入数值，然后计算其主对角线元素之和。\n\n\
  ##### 解决方案\n\n在数学中，方阵的主对角线是从左上角到右下角的元素集合。以下是一些用深色背景突出主对角线的方阵示例。\n\n.![Image](img/chapter32-08.png)\n\
  \n.![Image](img/chapter32-09.png)\n\n![](img/notice.jpg) 注意，主对角线上元素的行索引等于它们的列索引。\n\
  \n你可以通过两种不同的方法计算主对角线元素的和。让我们都学习它们。\n\n#### 第一种方法——遍历所有元素\n\n在这种方法中，程序遍历行并检查行索引是否等于列索引。对于表示为\
  \ `N × N` 的方阵（此处为数组），行和列数相等，所以你只需要定义一个常量 `N`。解决方案如下。\n\n![](img/my_exercise_header.png)\
  \ project_32.6-1a\n```cpp\n#include <iostream>\nusing namespace std;\nconst int\
  \ N = 10;\nint main() {\n  int i, j;\n  double total;\n  double a[N][N];\n  for\
  \ (i = 0; i <= N - 1; i++) {\n    for (j = 0; j <= N - 1; j++) {\n      cin >> a[i][j];\n\
  \    }\n  }\n  // 计算总和\n  total = 0;\n  for (i = 0; i <= N - 1; i++) {\n    for\
  \ (j = 0; j <= N - 1; j++) {\n      if (i == j) {\n          total += a[i][j];\n\
  \      }\n    }\n  }\n  cout << \"Sum = \" << total << endl;\n  return 0;\n}\n```\n\
  \n#### 第二种方法——直接遍历对角线\n\n在这种方法中，程序遍历行并检查行索引是否等于列索引。对于表示为 `N × N` 的方阵，行和列数相等，所以你只需要定义一个常量\
  \ `N`。解决方案如下。\n\n![](img/my_exercise_header.png) project_32.6-1\n```cpp\n#include\
  \ <iostream>\nusing namespace std;\nconst int N = 10;\nint main() {\n  int i, j;\n\
  \  double total;\n  double a[N][N];\n  for (i = 0; i <= N - 1; i++) {\n    for (j\
  \ = 0; j <= N - 1; j++) {\n      cin >> a[i][j];\n    }\n  }\n  // 计算总和\n  total\
  \ = 0;\n  for (i = 0; i <= N - 1; i++) {\n    total += a[i][i];\n  }\n  cout <<\
  \ \"Sum = \" << total << endl;\n  return 0;\n}\n```\n\n*(注：由于提供的原始文本在 Exercise 32.6-2\
  \ 处出现了重复和错乱，上述翻译已基于逻辑修正了部分错乱内容。)*\n\n\n\n\n\n```cpp\nj = N - i - 1;       //等同于：\n\
  total += a[i][j];    //total += a[i][N - i - 1];\n}\ncout << \"Sum = \" << total\
  \ << endl;\nreturn 0;}\n```\n\n![](img/notice.jpg)注意，负责计算反对对角线元素和的 for 循环是直接遍历反对对角线的。\n\
  \n### 练习 32.6-3 填充数组\n\n编写一个 C++ 程序，创建并显示以下数组。\n\n![Image](img/chapter32-11.png)\n\
  \n##### 答案\n\n如你所见，主对角线上有一个 $-1$ 的值。你已经知道方矩阵主对角线元素的共同特征是它们的行索引等于它们的列索引。现在，你还需要找到所有包含值\
  \ `10` 的元素之间的一个共同特征，以及所有包含值 `20` 的元素之间的另一个这样的共同特征。事实上，这些特征是存在的！ 任何包含值 `10` 的元素的行索引在任何情况下都大于其对应的列索引，同样，任何包含值\
  \ `20` 的元素的行索引在任何情况下都小于其对应的列索引。\n\n因此，该 C++ 程序如下。\n\n![](img/my_exercise_header.png)\
  \ \n\n```cpp\nproject_32.6-3\n#include <iostream>\nusing namespace std;\nconst int\
  \ N = 5;\nint main() {\n    int i, j;\n    int a[N][N];\n    for (i = 0; i <= N\
  \ - 1; i++) {\n        for (j = 0; j <= N - 1; j++) {\n            if (i == j) {\n\
  \                a[i][j] = -1;\n            } else if (i > j) {\n              \
  \  a[i][j] = 10;\n            } else {\n                a[i][j] = 20;\n        \
  \    }\n        }\n    }\n    for (i = 0; i <= N - 1; i++) {\n        for (j = 0;\
  \ j <= N - 1; j++) {\n            cout << a[i][j] << \"\\t\";\n        }\n     \
  \   cout << endl;\n    }\n    return 0;\n}\n```\n\n### 32.7 复习题：判断对错\n\n对以下每个陈述选择对或错。\n\
  \n1) 二维数组的所有元素必须包含不同的值。\n2) 为了引用二维数组中的一个元素，你需要两个索引。\n3) 二维数组的两个索引必须全都是变量，或者全都是常数值。\n\
