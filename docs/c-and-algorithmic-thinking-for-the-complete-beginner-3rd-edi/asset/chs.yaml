  \n假设有一些男人，你想找到最轻的一个。假设每个人都走过来并告诉你他的体重。你必须做的是记住第一个来人的体重，对于每一个新来的人，你必须将他的体重与你保留的那个进行比较。如果他更重，你就忽略它。然而，如果他更轻，你就需要忘记之前的体重并记住新的。同样的程序一直持续，直到所有人人都走过来。\n\
  \n让我们请四个人按随机顺序走过来。假设他们的体重按出现顺序是 165、170、160 和 180 磅。\n\n| 步骤 | 你脑海中变量 minimum 的值！\
  \ |\n| --- | --- |\n| 第一个人走过来。他的体重是 165 磅。将他的体重记在脑子里（想象脑海中有一个名为 minimum 的变量）。 |\
  \ minimum = 165 |\n| 第二个人走过来。他的体重是 170 磅。他的体重没有你脑海中保留的体重轻，所以你必须忽略他的体重。你脑海中的变量 minimum\
  \ 仍然包含值 165。 | minimum = 165 |\n| 第三角形走过来。他的体重是 160 磅，比你脑海中保留的体重轻，所以你必须忘记之前的值并在变量\
  \ minimum 中记住 160 这个值。 | minimum = 160 |\n| 第四个人走过来。他的体重是 180 磅。他的体重没有你脑海中保留的体重轻，所以你必须忽略他的体重。变量\
  \ minimum 仍然包含值 160。 | minimum = 160 |\n\n当程序结束时，脑海中的变量 minimum 包含了最轻男人的体重！\n\n\
  以下是流程图和相应的 C++ 程序，它提示用户输入四个男人的体重，然后找到并显示最轻的重量。\n\n.![Image](img/chapter23-04.png)\n\
