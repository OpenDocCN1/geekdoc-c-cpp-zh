  15) 在反复执行以下程序三次后，“test.txt”文件中将只有两行文本：\n```cpp\nint main() {\n    fstream f(\"test.txt\"\
  , fstream::out);\n    f << \"Good Morning\\n\";\n    f << \"Good Evening\\n\";\n\
  \    f.close();\n    return 0;\n}\n```\n16) `getline()` 函数从文件中读取一行。\n17) `getline()`\
  \ 函数总是读取当前行中的所有字符。\n18) 你不能使用 `while`-循环来遍历文件的内容。\n19) 你不能使用 `for`-循环来遍历文件的内容。\n\
