  \ names[indexOfMax] << \"  \" << countries[indexOfMax] << \"  \" << areas[indexOfMax]\
  \ << endl;\n    return 0;\n}\n```\n\n### 练习 34.3-4 哪些学生获得了最高分？\n\n编写一个 C++ 程序，提示用户输入\
