  \ 什么是嵌套循环？\n\n嵌套循环是在另一个循环内部的循环，换句话说，就是外层循环中的内层循环。\n\n外层循环控制内层循环完全迭代的次数。这意味着外层循环的第一次迭代触发内层循环开始直到完成。然后，外层循环的第二次迭代再次触发内层循环直到完成。这个过程一直重复，直到外层循环执行完所有的迭代。\n\
  \n以以下 C++ 程序为例。\n\n![](img/my_exercise_header.png) project_27.1\n\n```cpp\n#include\
  \ <iostream>\nusing namespace std;\nint main() {\n    int i, j;\n    for (i = 1;\
  \ i <= 2; i++) {\n        for (j = 1; j <= 3; j++) {\n            cout << i << \"\
  \  \" << j << endl;\n        }\n    }\n    return 0;\n}\n```\n\n在这个程序中，由变量 `i` 控制的外层循环决定了内层循环执行完全迭代次数。具体来说，当变量\
  \ `i` 为 1 时，内层循环执行三次迭代（对于 `j = 1`、`j = 2` 和 `j = 3`）。在完成内层循环后，外层循环还需要执行一次迭代（对于 `i\
  \ = 2`）。结果，内层循环重启，再次执行三次新的迭代（对于 `j = 1`、`j = 2` 和 `j = 3`）。\n\n上一个例子与下一个相似。\n\n\
  ```cpp\nint i, j;\ni = 1; // 外层循环给变量 i 赋值为 1\nfor (j = 1; j <= 3; j++) { // 内层循环执行三次迭代\n\
  \    cout << i << \"  \" << j << endl;\n}\ni = 2; // 外层循环给变量 i 赋值为 2\nfor (j = 1;\
  \ j <= 3; j++) { // 内层循环重新开始并执行三次新的迭代\n    cout << i << \"  \" << j << endl;\n}\n\
  ```\n\n输出结果如下。\n\n![Image](img/chapter27-01.png)\n\n![](img/notice.jpg) 只要不违反语法规则，你就可以根据需要嵌套任意数量的循环控制结构。但是，出于实际考虑，当你进入四层或五层嵌套时，整个结构会变得非常复杂且难以理解。然而，经验表明，作为一名程序员，你一生中进行的最大嵌套层数可能只有三四层。\n\
  \n![](img/notice.jpg) 内层循环和外层循环不需要是同一类型。例如，一个 `for` 语句可以嵌套（包含）一个 `while` 语句，反之亦然。\n\
  \n#### 练习 27.1-1 说“Hello Zeus”。统计总迭代次数。\n\n找到消息“Hello Zeus”被显示的次数。\n\n![](img/my_exercise_header.png)\
  \ project_27.1-1\n\n```cpp\n#include <iostream>\nusing namespace std;\nint main()\
  \ {\n    int i, j;\n    for (i = 0; i <= 2; i++) {\n        for (j = 0; j <= 3;\
  \ j++) {\n            cout << \"Hello Zeus\" << endl;\n        }\n    }\n    return\
  \ 0;\n}\n```\n\n##### 答案\n\n变量 `i` 和 `j` 的值（按出现顺序）如下：\n\n* 对于 `i = 0`，内层循环执行 4 次迭代（对于\
  \ `j = 0`、`j = 1`、`j = 2` 和 `j = 3`），消息“Hello Zeus”显示了 4 次。\n* 对于 `i = 1`，内层循环执行\
  \ 4 次迭代（对于 `j = 0`、`j = 1`、`j = 2` 和 `j = 3`），消息“Hello Zeus”显示了 4 次。\n* 对于 `i =\
  \ 2`，内层循环执行 4 次迭代（对于 `j = 0`、`j = 1`、`j = 2` 和 `j = 3`），消息“Hello Zeus”显示了 4 次。\n\
  \n因此，消息“Hello Zeus”总共显示了 3 × 4 = 12 次。\n\n![](img/remember.jpg) 外层循环控制内层的完全迭代次数！\n\
  \n#### 练习 27.1-2 创建追踪表\n\n对于接下来的代码段，确定变量 `a` 在结束时包含。\n\n```cpp\nint a, i, j;\na\
  \ = 1;\ni = 5;\nwhile (i < 7) {\n    for (j = 1; j <= 3; j += 2) {\n        a =\
  \ a * j + i;\n    }\n    i++;\n}\ncout << a << endl;\n```\n\n##### 答案\n\n追踪表所示：\n\
  \n| 步骤 | 语句 | 注释 | a | i | j |\n| :--- | :--- | :--- | :--- | :--- | :--- |\n| 1\
  \ | `a = 1` | | 1 | ? | ? |\n| 2 | `i = 5` | | 1 | 5 | ? |\n| 3 | `i < 7` | 结果为真\
  \ | | | |\n| 4 | `j = 1` | | 1 | 5 | 1 |\n| 5 | `j <= 3` | 结果为真 | | | |\n| 6 | `a\
  \ = a * j + i` | | 6 | 5 | 1 |\n| 7 | `j += 2` | | 6 | 5 | 3 |\n| 8 | `j <= 3` |\
  \ 结果为真 | | | |\n| 9 | `a = a * j + i` | | 23 | 5 | 3 |\n| 10 | `j += 2` | | 23 |\
  \ 5 | 5 |\n| 11 | `j <= 3` | 结果为假 | | | |\n| 12 | `i++` | | 23 | 6 | 5 |\n| 13 |\
  \ `i < 7` | 结果为真 | | | |\n| 14 | `j = 1` | | 23 | 6 | 1 |\n| 15 | `j <= 3` | 结果为真\
  \ | | | |\n| 16 | `a = a * j + i` | | 29 | 6 | 1 |\n| 17 | `j += 2` | | 29 | 6 |\
  \ 3 |\n| 18 | `j <= 3` | 结果为真 | | | |\n| 19 | `a = a * j + i` | | 93 | 6 | 3 |\n\
  | 20 | `j += 2` | | 93 | 6 | 5 |\n| 21 | `j <= 3` | 结果为假 | | | |\n| 22 | `i++` |\
  \ | 23 | 6 | 5 |\n| 23 | `i < 7` | 结果为真 | | | |\n| 24 | `cout << a << endl` | 显示：93\
  \ | |\n\n在程序结束时，变量 `a` 包含 93。\n\n### 27.2 嵌套循环的规则\n\n除了对于 循环的四个规则外（见 26.2)），编写嵌套循环时还必须遵循两个额外规则，因为它们可以避免意外的影响。\n\
  \n* **规则 1**：内层循环必须在外层循环内部开始并结束，这意味着循环不能重叠。\n* **规则 2**：外层循环和内层循环不能使用同一个计数器。\n\n\
  #### 练习 27.2-1 违反规则 1\n\n设计一个违反第一规则的流程图，该规则规定：“内层循环必须在外层循环内部完全结束”。\n\n##### 答案\n\
  \n以下流程图违反了第一规则。\n\n![Image](img/chapter27-02.png)\n\n如果你尝试追踪该流程图的执行流，你会发现它顺利地执行了\
  \ 5 × 10 = 50 次迭代。没有人能看出这个流程图是错误的。事实上，它技术上是正确的。然而，问题在于它的可读性。极难看出这个流程图想要实现什么。\n\n\
  #### 练习 27.2-2 违反规则 2\n\n找到消息“Hello”被显示的次数。\n\n```cpp\nfor (i = 1; i <= 3; i++)\
  \ {\n    for (i = 5; i >= 1; i--) {\n        cout << \"Hello\" << endl;\n    }\n\
  }\n```\n\n##### 答案\n\n乍一看，人们会认为“Hello”显示了 3 × 5 = 15 次。然而，仔细观察会发现事实并非如此。这个程序违反了嵌套循环的第二个规则，该规则规定：“外层循环和内层循环不能使用同一个计数器变量”。让我们设计对应的流程图。\n\
  \n![Image](img/chapter27-03.png)\n\n如果你尝试追踪此流程图的执行流，你可以看到当内层循环完成所有五次迭代时，变量 `i` 的值为\
  \ 0。然后，变量 `i` 增加 1，外层循环再次重复。这个过程可以永远进行，因为变量 `i` 永远不会超过外层循环布尔表达式所需的  3。因此，消息“Hello”显示了无限次。\n\
  \n### 27.3 复习题：判断对错\n\n对以下每个陈述判断对或错。\n\n\n\n\n\n1) `嵌套循环`（nested loop）是位于外部循环内部的循环。\n\
  2) 可以将一个中测试循环结构嵌套在一个预测试循环结构中。\n3) 循环控制结构的最大嵌套层数为四层。\n4) 当两个循环控制结构相互嵌套时，后启动的循环必须先完成。\n\
  5) 当两个循环控制结构相互嵌套时，它们不能使用同一个计数器变量。\n6) 在下面的代码片段中，单词“Hello”显示了六次。\n```cpp\nfor (i\
  \ = 1; i <= 3; i++) {\n    for (j = 1; j <= 3; j++) {\n        cout << \"Hello\"\
  \ << endl;\n    }\n}\n```\n7) 在下面的代码片段中，单词“Hello”显示了 12 次。\n```cpp\nfor (i = 0;\
  \ i <= 1; i++) {\n    for (j = 1; j <= 3; j++) {\n        for (k = 1; k <= 4; k\
  \ += 2) {\n            cout << \"Hello\" << endl;\n        }\n    }\n}\n```\n8)\
  \ 在下面的代码片段中，单词“Hello”显示了无限次。\n```cpp\nfor (i = 1; i <= 3; i++) {\n    for (i = 3;\
  \ i >= 1; i--) {\n        cout << \"Hello\" << endl;\n    }\n}\n```\n9) 在下面的代码片段中，单词“Hello”显示了九次。\n\
  ```cpp\nfor (i = 0; i <= 2; i++) {\n    j = 1;\n    do {\n        cout << \"Hello\"\
  \ << endl;\n        j++;\n    } while (j < 4);\n}\n```\n10) 在下面的代码片段中，至少存在一个中测试循环结构。\n\
  ```cpp\nint s, a;\ns = 0;\nwhile (!false) {\n    while (!false) {\n        cin >>\
  \ a;\n        if (a >= -1) break;\n    }\n    if (a == -1) break;\n    s += a;\n\
  }\ncout << s << endl;\n```\n\n### 27.4 复习题：单选题\n\n为下列每个语句选择正确答案。\n\n1) 在下面的代码片段中\n\
  ```cpp\nfor (i = 1; i <= 2; i++) {\n    for (j = 1; j <= 2; j++) {\n        cout\
  \ << \"Hello\" << endl;\n    }\n}\n```\n变量 `i` 和 `j` 的值（按出现顺序）为：\na) `j = 1, i =\
  \ 1, j = 1, i = 2, j = 2, i = 1, j = 2, i = 2`\nb) `i = 1, j = 1, i = 1, j = 2,\
  \ i = 2, j = 1, i = 2, j = 2`\nc) `i = 1, j = 1, i = 2, j = 2`\nd) `j = 1, i = 1,\
  \ j = 2, i = 2`\n\n2) 在下面的代码片段中\n```cpp\nx = 2;\nwhile (x > -2) {\n    do {\n  \
