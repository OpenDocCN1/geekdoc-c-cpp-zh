  \ 岁之间”这个句子可以用所示的图示表示。\n\n（注：由于原文文本存在严重的逻辑混乱和重复，译文已根据核心技术含义进行整理）\n\n\n\n\n\n| `&&`\
  \ | `||` |\n| `||` | `&&` |\n| `!` | `!` |\n\n![](img/notice.jpg)注意，非 (`!`) 运算符保持不变。\n\
  \n例如，如果原始布尔表达式是：\n\n```cpp\nx > 5 && y == 3\n```\n\n那么取反后的布尔表达式变为：\n\n```cpp\nx\
  \ <= 5 || y != 3\n```\n\n然而，有一个小细节需要注意。如果 AND (`&&`) 和 OR (`||`) 运算符同时存在于一个复杂的布尔表达式中，那么在取反后的布尔表达式中\
  \ much OR (`||`) 运算符的表达式必须包含在括号内，以保持初始的优先级。\n\n例如，如果原始布尔表达式是：\n\n```cpp\nx >= 5\
  \ && x <= 10 || y == 3\n```\n\n那么取反后的布尔表达式必须是：\n\n```cpp\n(x < 5 || x > 10) && y\
  \ != 3\n```\n\n![](img/notice.jpg)如果你忘记给表达式 `x < 5 || x > 10` 加上括号，由于 AND (`&&`)\
  \ 运算符的优先级高于 OR (`||`) 运算符，表达式 `x > 10 && y != 3` 将被求值，这显然是！\n\n### 练习 15.8-1: 取反布尔表达式\n\
  \n使用两种方法取反以下布尔表达式。\n\ni) `b != 4`\nii) `a * 3 + 2 > 0`\niii) `!(a == 5 && b >= 7)`\n\
  iv) `a == true`\nv) `b > 7 && !(x > 4)`\nvi) `a == 4 || b != 2`\n\n#### 解 Solution\n\
  \n#### 第一方法\n\ni) `!(b != 4)`\nii) `!(a * 3 + 2 > 0)`\niii) `!(!(a == 5 && b >=\
  \ 7))`，或者等价的 `a == 5 && b >= 7`\n\n![](img/notice.jpg)双否定成立。也就是说，两个连续的非 (`!`) 运算符会相互抵消。\n\
  \niv) `!(a == true)`\nv) `!(b > 7 && !(x > 4))`\nvi) `!(a == 4 || b != 2)`\n\n####\
  \ 第二方法\n\ni) `b == 4`\nii) `a * 3 + 2 <= 0`\n\n![](img/notice.jpg)注意，算术运算符是不被“取反”的。永远不要用加号\
  \ (`+`) 替换为减号 (`−`)运算符！\n\niii) `!(a != 5 || b < 7)`\n\n![](img/notice.jpg)注意，非\
  \ (`!`) 运算符保持不变。\n\niv) `a != true`\nv) `b <= 7 || !(x <= 4)`\nvi) `a != 4 && b\
  \ == 2`\n\n### 15.9 复习题：对/错\n\n对以下每个语句判断对或错。\n\n1) 布尔表达式是一个始终产生两个值之一的表达式。\n2) 布尔表达式包含至少一个逻辑运算符。\n\
  3) 在 C++ 中，表达式 `x = 5` 测试变量 `x` 是否等于 5。\n4) 下述语句不是有效的 C++ 语句：`a = b == c;`\n5) 布尔表达式\
  \ `b < 5` 测试变量 `b` 是否小于或等于 5。\n6) AND (`&&`) 运算符也称为逻辑取析运算符。\n7) OR (`||`) 运算符也称为逻辑逻辑运算符。\n\
  8) 在两个布尔表达式都为真的情况下，两个布尔表达式的逻辑与的结果等于它们逻辑取析的结果。\n9) 当两个布尔表达式的值不同时，逻辑取析的结果一定为真。\n10)\
  \ 表达式 `c == 3 && d > 7` 是复杂的布尔表达式。\n11) 当两个操作数都为真时，逻辑运算符 OR (`||`) 的结果为真。\n12) 当变量\
  \ `x` 为 5 以外的任何值时，布尔表达式 `!(x == 5)` 的结果为真。\n13) 非 (`!`) 运算符优先级最高。\n14) OR (`||`)\
  \ 运算符优先级最低。\n15) 在布尔表达式 `(x > y || x == 5) && x <= z` 中，AND (`&&`) 操作在 OR (`||`)\
  \ 操作之前执行。\n16) 在布尔表达式 `a * b + c > 21 || c == b` 中，程序首先测试 `c` 是否大于 21。\n17) 当老师想寻找小于\
  \ 8 岁且大于 11 岁的学生时，对应的布尔表达式是 `age < 8 && age > 11`。\n18) 布尔表达式 `x < 0 && x > 100`\
  \ 对于任何 `x` 值始终为假。\n19) 布尔表达式 `x > 0 || x < 100` 对于任何 `x` 值始终为真。\n20) 布尔表达式 `x >\
  \ 5` 等于 `!(x < 5)`。\n21) 布尔表达式 `!(x > 5 && y == 5)` 等于 `!(x > 5) && y == 5`。\n22)\
  \ 在莎比亚的《哈姆莱特》（第三幕第一场）中，主角说“生存还是……”如果你将其写成布尔表达式 `toBe || !toBe`，那么以下代码的结果为真：\n```cpp\n\
  toBe = 1 > 0;\nthatQuestion = toBe || !toBe;\n```\n23) 布尔表达式 `!(!(x > 5))` 等于 `x\
  \ > 5`。\n\n### 15.10 复习题：单选择\n\n为每个语句选择正确答案。\n\n1) 下列哪个不是比较运算符？\na) `>=`\nb) `<=`\n\
