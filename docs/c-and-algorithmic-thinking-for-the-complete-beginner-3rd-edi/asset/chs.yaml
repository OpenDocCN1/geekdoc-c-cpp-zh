  \ << endl;\n    } else if (x > 99999) {\n        cout << \"You entered more than\
  \ five digits\" << endl;\n    } else {\n        xStr = to_string((int)x);\n    \
  \    if (xStr[0] == xStr[4] && xStr[1] == xStr[3]) {\n            cout << \"Palindrome\"\
  \ << endl;\n        } else {\n            cout << \"Not palindrome\" << endl;\n\
  \        }\n    }\n    return 0;\n}\n```\n\n### 23.6 布尔表达式参考与技巧\n\n本节总结了你目前为止在 C++\
  \ 之旅途中遇到的所有布尔表达式以及额外的技巧。无论你是初学者还是资深程序员，这些表达式都将是你工具箱中的宝贵工具。请记住它们，因为你不知道它们何时会有用。对于某些，提供了两种或多种实现方法。\n\
  \n1) 检查数字 `x` 是否在 A 和 B 之间：`x >= A && x <= B`\n2) 检查数字 `x` 是否不在 A 和 B 之间：`!(x >=\
  \ A && x <= B)` 或 `x < A || x > B`\n3) 检查 `x` 是否等于 A、B 或 C：`x == A || x == B ||\
  \ x == C`\n4) 检查 `x` 是否既不等于 A，也不等于 B 或 C：`x != A && x != B && x != C`\n5) 检查 `x`\
  \ 是否为整数。请注意 `x` 必须是 `double` 类型：`x == (int)x`\n6) 检查 `x` 是否为浮点数：`x != (int)x`\n\
  7) 检查 `x` 是否为偶数：`x % 2 == 0`\n8) 检查 `x` 是否为奇数：`x % 2 == 1` 或 `x % 2 != 0`\n9) 检查\
  \ `x` 是否为 `y` 的整数倍：`x % y == 0`\n10) 提取实数的小数部分：`x - (int)x`\n11) 提取实数的第一位小数：`(int)(x\
  \ * 10) % 10`\n12) 提取实数的第二位小数：`(int)(x * 100) % 10`\n13) 提取实数的第 `N` 位小数：`(int)(x\
  \ * pow(10, N)) % 10`\n14) 提取整数的最后一位：`x % 10`\n15) 提取整数的倒数第二位：`(int)(x / 10) % 10`\n\
  16) 提取整数的第 `N` 位到最后一位：`(int)(x / pow(10, N)) % 10`\n17) 检查单词/句子是否以字母“B”开头：`x[0]\
  \ == 'B'`\n18) 检查单词/句子是否以句号结尾：`x[x.length() - 1] == '.'`\n19) 在三个数字 `x, y, z` 中找到中间数字：`x\
  \ + y + z - minimum - maximum`\n20) 找到三个数字 `x, y, z` 中两个最小数字的和：`x + y + z - maximum`\n\
  21) 找到三个数字 `x, y, z` 中两个最大数字的和：`x + y + z - minimum`\n22) 在五个数字 `x, y, z, w, 和 u`\
  \ 中找到三个中间数字的和：`x + y + z + w + u - minimum - maximum`\n23) 检查两个数字之间的距离大于 NUMBER：`abs(x\
  \ - y) > NUMBER`\n24) 检查正整数是否为三位数：`x >= 100 && x <= 999` 或 `to_string(x).length()\
  \ == 3`\n25) 检查整数是否为三位数：`abs(x) >= 100 && abs(x) <= 999` 或 `to_string(abs(x)).length()\
  \ == 3`\n26) 检查正整数是否为四位数并以 5 开头：`x >= 5000 && x <= 5999`\n27) 检查两个数字是否具有相同符号：`x\
  \ > 0 && y > 0 || x < 0 && y < 0` 或 `x * y > 0`\n28) 检查两个数字是否同为偶数或奇：`x % 2 == 0\
  \ && y % 2 == 0 || x % 2 == 1 && y % 2 == 1` 或 `x % 2 == y % 2`\n29) 检查两个条件 `BE1`\
  \ 或 `BE2` 是否恰好为一个真，但不同为真（异或运算）：`BE1 && !(BE2) || BE2 && !(BE1)`\n30) 检查年份 `y` 是否为闰年：`y\
  \ % 4 == 0 && y % 100 != 0 || y % 400 == 0`\n\n### 23.7 复习练习\n\n完成以下练习。\n\n\n\n\n\
