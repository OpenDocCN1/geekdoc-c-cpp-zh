  - 确定每个虚线矩形中存在哪些变量以及它们在对应矩形中的作用。\n\n接下来的流程图可以帮助你决定处理每个变量，即它是必须传递给子程序并/或从子程序返回，还是仅仅作为子程序内部的局部变量。\n\
  \n![Image](img/chapter37-02.png)\n\n因此，在流程图的帮助下，让我们一个处理一个虚线矩形！未标记虚线矩形的部分组成主代码。\n\
  \n# 第一部分\n\n在第一个虚线矩形中有三个变量：`i`、`temp1` 和 `gender`。然而，并不是它们都必须包含在替换该矩形的子程序的形式参数列表中。让我们来看看为什么！\n\
