  \    a) `cout << \"Hello Apollo << endl;`\n    b) `/* cout << \"Hello Artemis\"\
  \ << endl; */`\n    c) `//This will be executed// cout << \"Hello Ares\" << endl;`\n\
  \    d) `/* This will be executed */ cout << \"Hello Aphrodite\" << endl;`\n   \
  \ e) 以上都不是\n\n# 第 5 章：变量与常量\n\n### 5.1 什么是变量？\n\n在计算机科学中，变量是计算机主内存（RAM）中的一个位置，程序可以在其中存储一个值并在程序执行时更改它。\n\
  \n将变量想象成一个透明的盒子，你一次可以放入并保持一个东西。因为盒子是透明的，你也可以看到里面装了什么。此外，如果你有两个或多个盒子，你可以给每个盒子起一个唯一的名称。例如，你有三个盒子，每个盒子包含一个不同的数字，你可以将盒子命名为\
  \ `numberA`、`numberB` 和 `numberC`。\n\n![Image](img/chapter05-01.png)\n\n示例中名为 `numberA`、`numberB`\
  \ 和 `numberC` 的盒子分别包含数字 13、8 和 4。当然，你随时可以检查甚至更改这些盒子中任何一个包含的值。\n\n现在，假设有人要求你找到前两个盒子的值的和，然后将结果存储最后一个盒子中。你必须遵循的步骤是：\n\
  \n1) 观察前两个盒子并检查它们包含的值。\n2) 使用你的 `CPU`（这就是你的大脑）计算总和（结果）。\n3) 将结果（即值 21）插入最后一个盒子中。然而，由于每个盒子一次只能包含一个值，值\
  \ 4 实际上被数字 21 替换了。\n\n盒子现在看起来这样。\n\n![Image](img/chapter05-02.png)\n\n在流程图中，将值存储在变量中的操作由左箭头表示。\n\
  \n![Image](img/chapter05-03.png)\n\n此操作通常表示为“将一个值或表达式的结果赋值给变量”。左箭头被称为赋值运算符。\n\n\
  ![](img/notice.jpg)注意，这个箭头始终指向左侧。你不允许使用右箭头。此外，在箭头的左侧只能存在一个变量。\n\n在真实的计算机科学中，这三个盒子实际上是主内存（RAM）中的三个独立区域，命名为\
  \ `numberA`、`numberB` 和 `numberC`。\n\n![Image](img/chapter05-04.png)\n\n当程序指示 `CPU`\
  \ 执行以下语句时：\n\n```\nnumberC ← numberA + numberB\n```\n\n它遵循与之前示例相同的三个步骤。\n\n1) 数字\
  \ 13 和 8 从 RAM 中命名为 `numberA` 和 `numberB` 的区域传输到 `CPU`。（这是第一步，你检查了前两个盒子中包含的值）。\n\
  2) `CPU` 计算 13 + 8 的总和。（这是第二步，你用大脑计算了总和或结果）。\n3) 结果 21 从 `CPU` 传输到 RAM 中命名为 `numberC`\
  \ 的区域，替换现有的数字 4。（这是第三步，你将结果插入了最后一个盒子中）。\n\n执行后，RAM 看起来像。\n\n![Image](img/chapter05-05.png)\n\
  \n![](img/remember.jpg)当 C++ 程序运行时，变量可以持有各种值，但一次只能有一个值。当你给变量赋值时，该值将一直存储，直到你分配一个新值来替换旧值。\n\
  \n![](img/notice.jpg)变量的内容可以变为不同的值，但它的名称将始终相同，因为名称只是内存位置的标识符。\n\n变量是计算机科学中最重要的元素之一，因为它帮助你与存储在主内存（RAM）中的数据交互。很快，你将学会如何在\
  \ C++ 中使用变量。\n\n### 5.2 什么是常量？\n\n有时，你可能需要使用一个在程序运行时不能改变的值。这样的值被称为常量。简单来说，常量可以被认为是一个锁定的变量。这意味着当程序开始时，没有任何可以改变该值。\n\
  \n在流程图中，你可以用 `=` 号表示将常量设置为某个值的操作。\n\n![Image](img/chapter05-06.png)\n\n![](img/notice.jpg)本书使用大写字母来区分常量和变量。\n\
  \n考虑一种算法，允许用户输入三种不同产品的价格，然后计算并显示每个产品 20% 的增值税（称为 VAT）。图 5–1 中的流程图显示了不使用常量时的过程。\n\
  \n![Image](img/chapter05-07.png)\n\n图 5–1 在不使用常量的情况下计算三种产品的 20% VAT\n\n尽管这个算法是完全正确的，但问题在于作者使用了三次\
  \ 20% 的 VAT 税率（`20/100`）。如果这是一个真实的计算机程序，`CPU` 将被迫独立地计算三次除法运算的结果（`20/100`）。\n\n![](img/notice.jpg)通常来说，除法和乘法是消耗\
  \ CPU 时间的操作，必须尽可能避免。\n\n一个更好的解决方案是使用变量，如图 5–2 所示。这减少了除法操作的次数，也减少了拼写错误的可能性。\n\n![Image](img/chapter05-08.png)\n\
  \n图 5–2 使用变量 vat 计算三种产品的 20% VAT\n\n这一次，除法（`20/100`）只计算了一次，然后使用其结果计算每个产品的 VAT。但即使现在这样，这个算法（之后可能会变成计算机程序）并不完美；`vat`\
  \ 是一个变量，任何程序员都可能在程序下方不小心更改它的值。\n\n理想的解决方案是将变量 `vat` 改为常量 `VAT`，如图 5–3 所示。\n\n![Image](img/chapter05-09.png)\n\
  \n图 5–3 使用常量 VAT 计算三种产品的 20% VAT\n\n![](img/notice.jpg)注意，在流程图中声明常量时，使用 `=` 号而不是左箭头。\n\
  \n出于许多原因，最后一个解决方案是最佳选择。\n\n\n\n\n\n- 包括程序员在内的任何人，都无法通过在程序的任何位置意外编写诸如 `VAT ← 0.60`\
  \ 这样的语句来改变常量 `VAT` 的值。\n- 拼写错误的可能性被降到了最低。\n- 算术操作次数保持在尽可能低的水平。\n- 如果某天财政部长决定将增值税率从\
  \ 20% 提高到 22%，程序员只需要更改一行代码即可！\n\n### 5.3 存在多少类型的变量和常量？\n\n在大多数计算机语言中存在许多不同类型的变量和常量。这种多样性的由于每个变量或常量可以持有不同类型的数据。大多数情况下，变量和常量持有以下类型的数据。\n\
  \n- **整数 (Integers)**：整数值是不带任何小数部分的正或负数，例如 `5`、`100`、`135`、`−25` 和 `-5123`。\n- **实数数\
  \ (Reals)**：实数值是包含小数部分的正或负数，例如 `5.1`、`7.23`、`5.0`、`3.14` 和 `−23.78976`。实数也被称为 `floats`。\n\
  - **布尔值 (Booleans)**：布尔变量（或常量）只能持有两个值之一：`true` 或 `false`。\n- **字符 (Characters)**：字符是一个字母数字（字母、符号或数字），它通常包含在单引号或双引号中，例如\
  \ `\"a”`、'c' 或 `“@”`。在计算机科学中，字符序列被称为 `string`（字符串）。“string”这个词可能会让你联想到某种可以穿戴的东西，但遗憾的是它并不是。请让你那宝贵的脑袋专注于计算机科学！字符串的示例有\
  \ `\"Hello Zeus”`、`\"I am 25 years old”` 或 `“Peter Loves Jane For Ever”`。\n\n![](img/notice.jpg)在\
  \ C++ 中，字符串必须包含在双引号中。\n\n### 5.4 C++ 中变量和常量命名规则和约定\n\n为变量或常量命名时必须遵循某些规则。\n\n- 变量或常量的名称只能由拉丁字母（英语大写或小写字母）、数字和下划线字符（`_`）组成。特别是对于常量，尽管允许小写字母，但建议只使用大写字母。这种约定有助于在视觉上区分常量和变量。变量名的示例有\
  \ `firstName`、`lastName1` 和 `age`，而常名的示例有 `VAT` 和 `COMPUTER_NAME`。\n- 变量和常量名区分大小写，这意味着大写字母和小写字母之间存在明显区别。例如，`myVAR`、`myvar`、`MYVAR`\
  \ 和 `MyVar` 实际上是四个名称。\n- 不允许出现空格。如果变量或常量名包含多个单词，你可以在单词之间使用下划线字符（`_`），或者将每个单词（第一个除外）的首字母大写（驼峰命名法）。例如，变量名\
  \ `student first name` 是错误的。相反，你可以使用 `student_first_name`，或者更好的是 `studentFirstName`。\n\
  - 有效的变量或常量名可以字母字母或下划线开头。允许数字，但不能放在名称的开头。例如，变量名 `1studentName` 写得不正确。相反，你可以使用类似 `studentName1`\
  \ 或 `student1Name` 的名称。\n- 变量或常量名的选择方式通常能够描述其所包含数据的含义和角色。例如，存储温度值的变量可能会被命名为 `temperature`、`temp`\
  \ 甚至 `t`。\n- 不要使用 `C++` 的任何保留字作为变量或常量名。例如，`while` 名字不能作为有效的变量或常量名，因为它是 `C++` 中的保留字。\n\
  \n![](img/notice.jpg)“驼峰命名法（Camel Case convention）”是计算机编程中命名标识符（变量、子程序、类等）的一种风格。它被称为“驼峰式”，是因为名称中间的大写字母像骆驼的驼。驼峰命名法主要有两种变体：a)\
  \ 小驼峰命名（Lower Camel Case 或 Camel Case），标识符的第一个字母用小写字母开头，后续每个单词的首字母用大写字母开头；b) 大驼峰命名（Upper\
  \ Camel Case 或 Pascal Case），与小驼峰命名类似，但标识符的第一个字母用大写字母开头。\n\n![](img/notice.jpg)小驼峰命名通常用于命名变量和子程序，而大驼峰命名用于命名类。你将在相应的\
  \ [第七部分] 和 [第八部分] 中学习更多关于子程序和类的知识。\n\n### 5.5 “声明变量”这句话是什么意思？\n\n声明是在主内存（RAM）中预留部分空间以存储变量内容的过程。在许多高级计算机语言（包括\
  \ `C++`）中，程序员必须在使用变量之前编写特定的语句在 RAM 中预留那部分空间。在大多数情况下，他们甚至需要指定变量类型，以便编译器或解释器确切知道需要预留多少空间。\n\
  \n以下是在不同高级计算机语言中声明变量的示例。\n\n| 声明语句 | 高级计算机语言 |\n| :--- | :--- |\n| `Dim sum As Integer`\
  \ | Visual Basic |\n| `int sum;` | C#, C, C++, Java 等许多 |\n| `sum: Integer;` | Pascal,\
  \ Delphi |\n| `var sum;` | Javascript |\n\n### 5.6 如何在 C++ 中声明变量\n\n`C++` 是一种强类型编程语言。这意味着每个变量都对应一个特定的数据类型。在\
  \ `C++` 中，一些基本数据类型有：`bool`、`short`、`int`、`float`、`double` 和 `char`。使用哪一个取决于给的问题！\n\
  \n- `type bool` 只能持有两个值：即 `true` 或 `false`\n- `type unsigned short` 可以持有至少 `0` 到\
  \ `65535` 之间的无符号整数\n- `type short` 可以持有至少 `−32768` 到 `+32767` 之间的有符号整数\n- `type\
  \ unsigned int` 可以持有至少 `0` 到 `+2³² −1` 之间的无符号整数\n- `type int` 可以持有至少 `−2³¹` 到 `+2³¹\
  \ −1` 之间的有符号整数\n- `type float` 可以持有单精度有符号实数\n- `type double` 可以持有双精度有符号实数\n- `type\
  \ char` 可以持有单个字符或至少 `−128` 到 `+127` 之间的有符号整数\n\n![](img/notice.jpg)在许多计算机语言中，还有一种变量类型“string”（字符串），它可以持有字符序列。这些字符序列（或字符串）通常包含在双引号或单引号中，例如“Hello\
  \ Zeus”、“I am 25 years old”等。`C++` 也支持字符串，但请记住 `C++` 中的字符串不是基本数据类型。在不详述，`C++` 中的字符串声明方式与声明基本数据类型相同，但\
  \ `C++` 在内部存储和处理它们完全不同。\n\n要声明变量，`C++` 语句的一般形式为\n\n```cpp\ntype name [ = value];\n\
  ```\n\n其中\n\n- `type` 可以是 `bool`、`short`、`int`、`string` 等。\n- `name` 是一个有效的变量名。它应该遵循小驼峰命名法以及\
  \ 5.4 节中介绍的所有变量命名规则。\n- `value` 是可选的。如果提供，它可以是任何有效的初始值。\n\n接下来是在 `C++` 中声明某些变量的示例。\n\
  \n```cpp\nint number1;\nbool found;\nstring firstName;\nstring studentName;\n```\n\
  \n下面是声明并直接为某些变量赋值初始值的示例\n\n```cpp\nint num = 5;\nstring name = \"Hera\";\nchar favoriteCharacter\
  \ = 'w';\n```\n\n这些等同于以下：\n\n```cpp\nint num;\nstring name;\nchar favoriteCharacter;\n\
  num = 5;\nname = \"Hera\";\nfavoriteCharacter = 'w';\n```\n\n![](img/notice.jpg)在\
  \ `C++` 中，为变量赋值是通过使用等号（ = ）完成的。这一操作相当于流程图中的左箭头。\n\n![](img/notice.jpg)注意在 `C++`\
  \ 中，你使用双引号 (\" \") 为 `string` 类型的变量赋值，但使用单引号 (' ') 为 `char` 类型的变量赋值。\n\n\n\n\n\n\
  最后但同样重要的是，你可以通过逗号分隔，在同一行内声明多个相同类型的变量。\n\n```cpp\nint a, b;double x, y, z;unsigned\
  \ int w = 3, u = 2;\n```\n\n### 5.7 如何在 C++ 中声明常量\n\n你可以使用 `const` 关键字在 C++ 中声明常量。语句的一般形式如下。\n\
  \n```cpp\nconst type NAME = value;\n```\n\n其中\n\n- `type` 可以是 `bool`、`short`、`int`、`string`\
  \ 等。\n- `NAME` 是有效的常量名。它应该遵循第 5.4 节中介绍所有常量命名规则和约定。\n- `value` 是任何有效值。\n\n以下示例了如何在\
  \ C++ 中声明了一些常量。\n\n```cpp\nconst double VAT = 0.22;const int NUMBER_OF_PLAYERS =\
  \ 25;const string COMPUTER_NAME = \"pc01\";const string FAVORITE_SONG = \"We are\
  \ the world\";const char FAVORITE_CHARACTER = 'w';\n```\n\n![](img/notice.jpg)注意，在\
  \ C++ 中，你使用双引号 (`\" \"`) 声明 `string` 类型的常量，但使用单引号 (`' '`) 声明 `char` 类型的常量。\n\n![](img/remember.jpg)一旦定义常量，它的值在程序运行时就无法更改。\n\
  \n![](img/remember.jpg)C++ 要求所有语句必须以分号（`;）结束。\n\n![](img/remember.jpg)虽然常量名可以包含小写字母，但建议只使用大写字母。这有助于你在视觉上区分常量和变量。\n\
  \n### 5.8 复习题：判断题\n\n对以下每个陈述选择对或错。\n\n1) 变量是计算机次级存储设备中的一个位置。\n2) 在流程图中，对于赋值运算符，你可以使用左箭头或右箭头。\n\
  3) 变量的内容在程序执行期间可以改变。\n4) 常量的内容在程序执行期间可以改变。\n5) 值 `10.0` 是整数。\n6) 布尔变量只能持有两个值中的一个。\n\
  7) 包在双引号中的值 `\"10.0\"` 是实数值。\n8) 在计算机科学中，string（字符串）是你可以穿的东西！\n9) 变量名可以包含数字。\n10)\
  \ 变量可以在程序执行期间改变其名称。\n11) 变量名不能是数字。\n12) 常量名必须始终是描述性的。\n13) 名称 `student name` 不是一个有效的变量名。\n\
  14) 名称 `STUDENT_NAME` 是一个有效的常量名。\n15) 在 C++ 中，常量名可以包含大写和小写字母。\n16) 在 C++ 中，你需要在使用变量之前声明它。\n\
  17) 在 C++ 程序中，你必须始终使用一个常量。\n\n### 5.9 复习题：单选题\n\n为以下每个陈述选择正确答案。\n\n1) 变量是位于以下的地方\n\
  a) 硬盘。\nb) DVD 光盘。\nc) USB 闪存盘。\nd) 以上都是\ne) 以上都不是\n2) 变量可以持有\na) 一时持有一个值。\nb) 一时持有多个值。\n\
  c) 以上都是\nd) 以上都不是\n3) 一般来说，在程序中使用常量\na) 帮助程序员完全避免拼写错误。\nb) 帮助程序员避免使用除法和乘法。\nc) 以上都是\n\
  d) 以上都不是\n4) 以下哪一个是是整数？\na) 5.0\nb)−5\nc) “5”\nd) 以上哪个是整数。\n5) 布尔变量可以持有值\na) one.\n\
  b) “true”.\nc) true.\nd) 以上都不是\n6) 在 C++ 中，字符可以是\na) 包在单引号内。\nb) 包在双引号内。\nc) 以上两种均是。\n\
  7) 以下哪一个不是有效的 C++ 变量？\na) city_name\nb) cityName\nc) cityname\nd) city-name\n8)\
  \ 你可以使用关键字 `const` 定义一个常量。一旦定义了常量，\na) 它永远无法被更改。\nb) 可以使用 `const` 关键字再次更改。\nc) 以上都不正确。\n\
  \n### 5.10 复习练习\n\n完成以下练习。\n\n1) 将第一列的每个元素与第二列中的一个元素匹配。\n\n| 值 | 数据类型 |\n| --- |\
  \ --- |\n| 1. “true” | a. Boolean |\n| 2. 123 | b. Real |\n| 3. false | c. String\
  \ |\n| 4. 10.0 | d. Integer |\n\n2) 将第一列的每个元素与第二列中的一个元素匹配。\n\n| 值 | 数据类型 |\n| ---\
  \ | --- |\n| 1. 人的名字 | a. Boolean |\n| 2. 人的年龄 | b. Real |\n| 3. 除法 5.0/2.0 的结果\
  \ | c. Integer |\n| 4. 是黑的还是白的？ | d. String |\n\n3) 完成下表。\n\n| 值 | 数据类型 | 声明与初始化\
  \ |\n| --- | --- | --- |\n| 我朋友的名字 | String | `string name = \"Mark\";` |\n| 我的地址\
  \ | | `string address = \"254 Lookout Rd. Wilson, NY 27893\";` |\n| 平均每日气温 | | |\n\
  | 电话号码 | | `string phoneNumber = \"1‑891‑764‑2410\";` |\n\n\n\n\n你还记得创建算法或计算机程序涉及三个主要阶段吗？第一阶段是“数据输入”阶段，在该阶段，计算机允许用户输入数据，如数字、姓名、地址或出生年份。\n\
  \n流程图使用斜四边形和保留字 `Read` 来让用户输入数据。\n\n![Image](img/chapter06-07.png)\n\n其中 `var_name1`、`var_name2`\
  \ 和 `var_name3` 必须是变量。\n\n你刚刚看到的斜四边形等同于以下流程图片段。\n\n.![Image](img/chapter06-08.png)\n\
  \n![](img/notice.jpg)当执行 `Read` 语句时，执行流会被中断，直到用户输入所有数据。当数据输入完成后，执行流将继续到下一条语句。通常数据是从键盘输入的。\n\
  \n在 C++ 中，数据输入可以使用以下 C++ 语句之一来实现。\n\n```cpp\n//从键盘读取数字或字符串（不含空格或制表符）\ncin >> var_name1\
  \ >> var_name2 >> var_name3 >> …;\n//从键盘读取包含空格和制表符的字符串\ngetline(cin, var_name_str);\n\
  ```\n\n其中\n\n* `var_name1`、`var_name2`、`var_name3`、`…`可以是任意类型的变量。\n* `var_name_str`\
  \ 可以是任何 `string` 类型的变量。\n\n![](img/notice.jpg)在 C++ 中，`>>` 运算符被称为“提取运算符”。\n\n![](img/notice.jpg)注意，当\
  \ `cin` 从键盘读取字符串时，它会将空格字符视为终止字符。因此，使用 `cin` 读取字符串意味着始终读取单个单词，而不是短语或整个句子。要读取两个或更多单词，你应该使用\
  \ `getline()` 函数。\n\n接下来的示例允许用户输入姓名，然后在其前面加上“Hello”一词并显示出来。\n\n```cpp\nstring name;\n\
  cin >> name;\ncout << \"Hello \" << name;\n```\n\n当此示例中的 `cin` 语句执行时，执行流会停止，等待用户输入姓名。`cout\
  \ << \"Hello \" << name` 语句尚未执行！只要用户不输入任何内容，计算机就会一直等待，如图 6–5 所示。\n\n.![Image](img/chapter06-09.png)\n\
  \n图 6–5 当 `cin` 语句执行时，计算机等待数据输入。\n\n当用户最终输入姓名并按下“Enter ![Image](img/key_enter.png)”键时，执行流将会继续到下一条\
  \ `cout` 语句，如图 6–6 所示。\n\n.![Image](img/chapter06-10.png)\n\n图 6–6 当用户按下“Enter ![Image](img/key_enter.png)”键时，执行流继续。\n\
  \n然而，如果如果在每次数据输入之前显示“提示”（prompt）消息，那么之前的示例就可以得到改进。这使得程序更加用户友好。例如，查看以下代码片段。\n\n```cpp\n\
  string name;\ncout << \"What is your name? \";\ncin >> name;\ncout << \"Hello \"\
  \ << name;\n```\n\n在前面的代码片段中，在 `cin` 语句执行之前，会显示消息“What is your name?”（不带双引号），如图\
  \ 6–7 所示。\n\n.![Image](img/chapter06-11.png)\n\n图 6–7 在 `cin` 语句之前显示“提示”消息。\n\n\
  `cin` 语句也可以用于请求多个一个值。接下来的代码片段允许用户输入姓名和年龄。\n\n```cpp\nstring name;\nint age;\ncin\
  \ >> name >> age;\ncout << \"Wow, you are already\" << age << \"years old,\" <<\
  \ name << \"!\";\n```\n\n然而，正如已经所出的，如果在每次数据输入之前显示“提示”消息，效果会更好。接下来的代码片段提示用户输入姓名和年龄。\n\
  \n```cpp\nstring name;\nint age;\ncout << \"What is your name? \";\ncin >> name;\n\
  cout << \"What is your age? \";\ncin >> age;\ncout << \"Wow, you are already \"\
  \ << age << \" years old, \" << name << \"!\";\n```\n\n对应的流程图片段如下。\n\n![Image](img/chapter06-12.png)\n\
  \n接下来的代码片段提示用户输入产品名称和价格。\n\n```cpp\nstring productName;\ndouble productPrice;\n\
  cout << \"Enter product name: \";\ngetline(cin, productName);\ncout << \"Enter product\
  \ price: \";\ncin >> productPrice;\n```\n\n然而，如果在 `cin` 语句之后使用 `getline()` 函数，就会出现特定问题。由于\
  \ `cin` 忽略了 `\\n` 字符序列（“Enter ![Image](img/key_enter.png)”键）并将其留在输入缓冲区（流）中，随后的 `getline()`\
  \ 函数会遇到该序列并停止读取后续内容。在接下来的示例中，变量 `productName` 将保持为空，因为 `getline()` 函数识别了前一个 `cin`\
  \ 语句在输入缓冲区中留下的残留 `\\n` 字符序列。\n\n```cpp\ndouble productPrice;\nstring productName;\n\
  cout << \"Enter product price: \";\ncin >> productPrice;\ncout << \"Enter product\
  \ name: \";\ngetline(cin, productName);\ncout << productPrice << \" \" << productName;\n\
  ```\n\n![](img/notice.jpg)当用户输入数据并按下“Enter ![Image](img/key_enter.png)”键时，执行流将继续到下一条语句。要解决这个问题，你需要在使用\
  \ `getline()` 之前清除输入缓冲区中的任何 `\\n` 序列。\n\n```cpp\ndouble productPrice;\nstring productName;\n\
  cout << \"Enter product price: \";\ncin >> productPrice;\n// 清除缓冲区中的 \\n\ncin.ignore();\n\
  cout << \"Enter product name: \";\ngetline(cin, productName);\ncout << productPrice\
  \ << \" \" << productName;\n```\n\n最后但不是最重要的，在书中，词“prompts”和“lets”之间是有区别的。当书说“prompts”用户输入……这意味着他们必须先输入姓名和年龄，还是相反？\n\
  \n```cpp\ncin >> name >> age;```\n\n### 6.4 复习题：判断题\n\n对以下陈述判断对错。\n\n1. 在 C++ 中，`cin`\
  \ 是一个保留字。\n2. `cout` 语句可以显示消息或变量的内容。\n3. 当 `cin` 语句执行时，执行流会被中断，直到用户输入值。\n4. 你不能使用单个\
  \ `cin` 语句读取多个数据值。\n5. 在数据输入之前，必须显示提示消息。\n\n### 6.5 复习题：多选择\n\n为每个陈述选择正确答案。\n\n\
  1. `cout << hello` 显示\n   a) “hello”（不带双引号）\n   b) “hello”（带双引号）\n   c) 变量 `hello`\
  \ 的内容\n   d) 以上均不是\n\n2. `cout << \"HELLO\"` 显示\n   a) “HELLO”（不带双引号）\n   b) “HELLO”（带双引号）\n\
  \   c) 常量 `HELLO` 的内容\n   d) 以上均不是\n\n3. `cout << \"Hello\\nHermes\"` 显示\n   a)\
  \ “Hello Hermes”（不带双引号）\n   b) “Hello”在第一行，“Hermes”在下一行（不带双引号）\n   c) “HelloHermes”（不带双引号）\n\
  \   d) “Hello\\nHermes”（不带双引号）\n   e) 以上均不是\n\n4. `cin >> data1data2`\n   a) 让用户输入一个值并赋值给\
  \ `data1`。变量 `data2` 保持为空。\n   b) 让用户输入一个值并赋值给 `data1data2`。\n   c) 让用户输入两个值并将它们赋值给变量\
  \ `data1` 和 `data2`。\n   d) 以上均不是\n\n\n\nC++ 中最常用的运算符是值赋值运算符（`=`）。例如，以下 C++ 语句将值\
  \ 5 赋值给变量 `x`。\n\n```cpp\nx = 5;\n```\n\n正如你在第 5 章中读到的，这等同于流程图中使用的左箭头。\n\n.![Image](img/chapter07-01.png)\n\
  \n可能流程图中使用的左箭头比（`=` 符号）更方便、更清晰，因为它视觉直观地展示了右侧的值或表达式的结果被赋值给左侧的变量。\n\n需要注意的是，`=` 符号并不等同于数学中使用的等号。在数学中，表达式\
  \ `x = 5` 读作“x 等于 5”。但在 C++ 中，表达式 `x = 5` 读作“将值 5 赋值给 `x`”或“将 `x` 设置为 5”。它们看起来一样，但作用却不同！\n\
  \n例如，在数学中，以下两行是等价。第一行可以读作“x 等于 y 和 z 之和”，第二行可以读作“y 和 z 之和等于 x”。\n\n```cpp\nx = y\
  \ + z;\ny + z = x\n```\n\n另一方面，在 C++ 中，这两个语句绝对是不等价的。\n\n```cpp\nx = y + z;\ny +\
  \ z = x;\n```\n\n第一个语句是一个有效的 C++ 语句，传达了“将 `y` 和 `z` 之和赋值给 `x`”。然而，第二个语句是无效的，因为它试图将\
  \ `x` 的值赋值给 `y + z`，这在 C++ 中是不允许的！\n\n![](img/remember.jpg)在 C++ 中，`=` 符号左侧的变量代表内存（RAM）中的一个区域，该区域可以存储值。\n\
  \n![](img/remember.jpg)`=` 符号左侧只能存在单个变量，而右侧可以是数字、变量、字符串，甚至是复杂的数学表达式。\n\n在表 7-1 中，你可以找到一些值赋值的示例。\n\
  \n| 示例 | 描述 |\n| --- | --- |\n| `a = 9;` | 将值 9 赋值给变量 `a`。 |\n| `b = c;` | 将变量 `c`\
  \ 的内容赋值给变量 `b`。 |\n| `d = \"Hello Zeus\";` | 将字符串 Hello Zeus 赋值给变量 `d`。 |\n| `d\
  \ = a + b;` | 计算变量 `a` 和 `b` 内容之和，并将结果赋值给变量 `d`。 |\n| `b = x + 1;` | 计算变量 `x` 内容与\
  \ 1 之和，并将结果赋值给变量 `b`。请注意，变量 `x` 的内容不会被改变。 |\n| `x = x + 1;` | 计算变量 `x` 内容与 1 之和，并将结果赋值回变量\
  \ `x`。换句话说，将变量 `x` 增加 1。 |\n\n表 7-1 值赋值示例\n\n对最后一个感到困惑吗？你现在是在想你的数学老师吗？如果你在黑板上写下\
  \ `x = x + 1`，他们的反应会是什么？你能个人想象出一个等于自己加 1 的数字吗？这个语句暗示 5 等于 6，10 等于 11，这显然是错误的！\n\n\
  显然，在计算机科学中情况是不同的。语句 `x = x + 1` 是绝对有效的！它指示 CPU 从主内存（RAM）中提取变量 `x` 的值，在该值上加 1，并将结果赋值回变量\
  \ `x`。变量 `x` 的旧值被新值取代。\n\n还是不理解？让我们看看 CPU 和主内存（RAM）是如何协作执行语句 `x = x + 1` 的。\n\n\
  假设内存中有一个命名为 `x` 的区域，它包含数字 13。\n\n![Image](img/chapter07-02.png)\n\n当程序指示 CPU 执行语句时：\n\
  \n```cpp\nx = x + 1;\n```\n\n将执行以下步骤：\n\n►将数字 13 从 RAM 中命名为 `x` 的区域传输到 CPU；►CPU\
  \ 计算 13 和 1 之和；以及►将结果 14 从 CPU 传输到 RAM 的区域 `x`，替换现有的数字 13。\n\n执行后，RAM 看起来是这样的。\n\
  \n.![Image](img/chapter07-03.png)\n\n现在你已经理解了一切，让我们深入研究最后一个细节。在 C++ 中，你可以用一个语句将单个值赋值给多个变量。以下语句将值\
  \ 4 赋值给变量 `a`、`b` 和 `c`。\n\n```cpp\na = b = c = 4;\n```\n\n### 7.2 算术运算符\n\n就像每种高级编程语言一样，C++\
  \ 支持几乎所有的算术运算符。\n\n| 算术运算符 | 描述 |\n| --- | --- |\n| `+` | 加法 |\n| `-` | 减法 |\n|\
  \ `*` | 乘法 |\n| `/` | 除法 |\n| `%` | 整除后的余数（模） |\n\n前两个运算符非常简单，不需要进一步解释。\n\n如果你需要乘以两个数字或两个变量的内容，必须使用星号（`*`）符号。例如，如果你想让\
  \ `y` 乘以 2，你必须写成 `2 * y`。\n\n![](img/notice.jpg)在数学中，跳过乘法运算符并编写 `3x` 是合法的，意思是“3\
  \ 乘以 x”。但在 C++ 中，在任何存在乘法操作的地方都必须使用星号。这是初学者程序员在 C++ 中编写数学表达式时最常见的错误之一。\n\n要执行除法，必须使用斜杠（`/`）符号。例如，如果你想用\
  \ 10 除以 2，你必须写成 `10 / 2`。\n\n然而，需要注意的是，在 C++ 中，两个整数相除的结果始终是一个整数。因此，在表达式 `7 / 2`\
  \ 中，由于两个数字 `7` 和 `2` 都是整数，结果是 3（而不是人们可能错误预期的 3.5）。相比之下，在表达式 `7.0 / 2` 中，至少有一个数字是浮点数（float），结果确实是\
  \ 3.5。\n\n以下三个语句是等价的。它们都输出值 3.5。\n\n```cpp\ncout << 7.0 / 2;\ncout << 7 / 2.0;\n\
  cout\n```\n\n模运算符（`%`）返回整数除的余数，这意味着语句\n\n```cpp\nc = 13 % 3;\n```\n\n将 1 赋值给变量 `c`。\n\
  \n![](img/notice.jpg)在 C++ 中，模运算符（`%`）不能用于浮点数。例如，操作 `13.4 % 4` 是无法执行的。\n\n![](img/notice.jpg)记住流程图是表示算法的一种松散方法。虽然流程图允许模（`%`）运算符，但本书使用了常用的\
  \ MOD 运算符！例如，C++ 语句 `y = 13 % 3` 在流程图中表示为\n\n.![Image](img/chapter07-04.png)\n\n\
  在数学中，正如你可能已经知道的，可以使用括号（()）、大括号（{}）以及方括号（[]），如如下表达式所示。\n\n.![Image](img/chapter07-06.png)\n\
  \n然而，在 C++ 中没有大括号和方括号。你只有括号；因此，相同的表达式必须使用括号代替大括号或方括号。\n\n```cpp\ny = 5.0 / 2.0 *\
  \ (3 + 2 * (4 + 7 * (6 – 4)));\n```\n\n### 7.3 算术运算符的优先级是什么？\n\n算术运算符遵循与数学相同的优先级规则，这些规则是：乘法和除法先执行，加法和减法后执行。\n\
  \n| 优先级高 ![Image](img/arrow_up.jpg) 优先级低 | 算术运算符 |\n| --- | --- |\n| `*`, `/`, `%`\
  \ | |\n| `+`, `-` | |\n\n当乘法和除法出现在同一个表达式中，由于它们的优先级相同，它们将从左到右执行（与你阅读的方式相同），这意味着表达式\n\
  \n```cpp\ny = 6 / 3 * 2;\n```\n\n等价于 ![Image](img/chapter07-07.png)，并将值 4 赋值给变量\
  \ `y`（除法先于乘法）。\n\n然而，如果你想乘法先于除法执行，可以使用括号来改变优先级。这意味着\n\n```cpp\ny = 6 / (3 * 2);\n\
  ```\n\n等价于 ![Image](img/chapter07-08.png)，并将值 1 赋值给变量 `y`（乘法先于除法）。\n\n\n\n\n\n![](img/notice.jpg)请记住，在\
  \ C++ 中，无法以 ![Image](img/chapter07-09.png) 或 ![Image](img/chapter07-10.png) 的形式编写分数。忘记它吧！Visual\
  \ Studio Code 或任何 IDE 中都没有公式编辑器。所有的分数必须写在单行内。例如，![Image](img/chapter07-09.png) 必须写为\
  \ `6 / 3`，而 ![Image](img/chapter07-10.png) 必须写为 `(4 * x + 5) / 6`。\n\n操作顺序可以总结如下：\n\
  \n1) 首先执行任何位于括号内的操作。\n2) 接下来，从左到右执行任何乘法和除法操作。\n3) 最后，从左到右执行任何加法和减法操作。\n\n因此，在下一个示例中\n\
  \n```\ny = 12 + (20 + 3) - 8 / 4 * 3;\n```\n\n操作执行顺序如下：\n\n![Image](img/chapter07-11.png)\n\
  \n### 7.4 复合赋值运算符\n\nC++ 提供了一组特殊的运算符，称为复合赋值运算符，它们可以帮助你更快地编写代码。下表详细列出了这些运算符。每个运算符都提供了一个示例，而“等于”列显示了不使用复合赋值运算符的对应语句。\n\
