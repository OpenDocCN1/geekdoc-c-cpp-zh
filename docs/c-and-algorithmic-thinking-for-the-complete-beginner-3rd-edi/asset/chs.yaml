  8) 编写一个 C++ 程序，对于每一行，如果存在标点符号，则显示消息“There is a punctuation mark”。\n\n## 第 41 章 文件进\n\
  \n### 41.1 通用练习\n\n#### 练习 41.1-1 计算和\n假设有一个文件 `f_data41.1.txt`，其中包含 10 个整数（用空格分隔）。其结构示例所示。\n\
  编写一个 C++ 程序计算并显示它们的总和。\n\n**解决方案**\n遍历此文件中数字的方法有两种。\n\n**第一种方法**\n在这种方法中，名为 `values`\
  \ 的 `string` 变量获取行的内容。然后，在 `for`-循环中使用 `substr()` 方法分割数字。这些数字然后使用 `stoi()` 转换为整数。\n\
  ```cpp\n#include <iostream>\n#include <fstream>\nusing namespace std;\nint main()\
  \ {\n    int i, total;\n    string values;\n    fstream f(\"f_data41.1.txt\");\n\
  \    getline(f, values);\n    f.close();\n    total = 0;\n    // ... substr 和 stoi\
  \ 的逻辑 ...\n}\n```\n\n**第二种方法**\n由于值是用空格分隔的，你可以在 `for`-循环中使用提取运算符（`>>`）。与第一方法相反，由于\
  \ `value` 变量类型为 `int`，因此不使用 `stoi()` 函数。\n```cpp\n#include <iostream>\n#include\
  \ <fstream>\nusing namespace std;\nint main() {\n    int i, value, total;\n    fstream\
  \ f(\"f_data41.1.txt\");\n    total = 0;\n    for (i = 0; i < 10; i++) {\n     \
  \   f >> value;\n        total += value;\n    }\n}\n```\n\n#### 练习 41.1-2 计算未知数量数字的平均值\n\
  假设有一个名为 `f_data41.1.txt` 的文件，其中每行一个数字，最后一行包含短语“End of file”。编写一个 C++ 程序计算并显示它们的平均值。\n\
  \n**解决方案**\n根据第 29.3 节讨论的“终”规则，`while`-循环应该如下，通用形式所示：\n```cpp\ngetline(fin, sNumber);\n\
  while (sNumber != \"End of file\") {\n    // 语句或语句块\n    getline(fin, sNumber);\n\
  }\n```\n最终程序如下：\n```cpp\n#include <iostream>\n#include <fstream>\nusing namespace\
  \ std;\nint main() {\n    double total = 0;\n    int count = 0;\n    string sNumber;\n\
  \    fstream fin(\"f_data41.1.txt\");\n    getline(fin, sNumber);\n    while (sNumber\
  \ != \"End of file\") {\n        total += stod(sNumber);\n        count += 1;\n\
  \        getline(fin, sNumber);\n    }\n    fin.close();\n    if (count > 0) {\n\
  \        cout << total / count << endl;\n    }\n    return 0;\n}\n```\n\n#### 练习\
  \ 41.1-3 寻找最小值和最大值\n假设有一个名为“f_data41.1-3.txt”的文件，其中每行一个数字。编写一个 C++ 程序寻找最大值和最小值，并将它们存储在名为“output.txt”的文件中，格式如下：\n\
  ```\n33.5 \n13.172\n```\n\n\n\n\n假设文件 `f_data41.1-3.txt` 中至少包含一个值。\n\n##### 解决方案\n\
  \n最终程序如下。\n\n![](img/my_exercise_header.png) project_41.1-3\n```cpp\n#include <iostream>\n\
  #include <fstream>\nusing namespace std;\nconst string PATH = \"c:/temp/\";\nint\
  \ main() {\n    double number, maximum, minimum;\n    fstream fin(PATH + \"f_data41.1-3.txt\"\
  );\n    //读取第一个值\n    fin >> maximum;\n    minimum = maximum;\n    // 逐行读取其余值\n\
  \    while (!fin.eof()) {\n        fin >> number;\n        if (number > maximum\
  \ ) {\n            maximum = number;\n        }\n        if (number < minimum) {\n\
  \            minimum = number;\n        }\n    }\n    fin.close();\n    // 将最大值和最小值写入文件\n\
  \    fstream fout(PATH + \"output.txt\", fstream::out);\n    fout << maximum <<\
  \ \"  \" << minimum;\n    fout.close();\n    return 0;\n}\n```\n\n## 练习 41.1-4 合并文件\n\
  \n假设有两个名为 `text1.txt` 和 `text2.txt` 的文本文件。编写一个 C++ 程序，合并这两个文件的内容，并将合并后的文本写入名为 `final.txt`\
  \ 的第三文件中，将 `text1.txt` 的内容放在 `text2.txt` 的内容之前。\n\n##### 解决方案\n\n这个练习可以使用多种方法解决。让我们来看其中两种。\n\
  \n### 第一种方法\n\n程序打开文件 `text1.txt`，读取所有内容，将其赋值给变量 `contents`，然后关闭文件。接下来，打开文件 `text2.txt`，读取所有内容，将其与之前的内容（变量\
  \ `contents` 中的内容）合并，并关闭文件。最后，打开文件 `final.txt` 并合并后的内容写入其中，如下程序所示。\n\n![](img/my_exercise_header.png)\
  \ project_41.1-4a\n```cpp\n#include <iostream>\n#include <fstream>\nusing namespace\
  \ std;\nconst string PATH = \"c:/temp/\";\nint main() {\n    string s, contents\
  \ = \"\";\n    fstream fin;\n    fin.open(PATH + \"text1.txt\");\n    while (!fin.eof())\
  \ {\n        getline(fin, s);\n        contents += s + \"\\n\";\n    }\n    fin.close();\n\
  \    fin.open(PATH + \"text2.txt\");\n    while (!fin.eof()) {\n        getline(fin,\
  \ s);\n        contents += s + \"\\n\";\n    }\n    fin.close();\n    fstream fout(PATH\
  \ + \"final.txt\", fstream::out);\n    fout << contents;\n    fout.close();\n  \
  \  return 0;\n}\n```\n\n![](img/notice.jpg) 注意对象 `fin` 是在程序开头声明的。这样你你可以反复使用同一个对象来打开和读取多个文件。\n\
  \n### 第二种方法\n\n下面的程序在开始时打开三个文件，写入合并后的内容，然后关闭它们。\n\n![](img/my_exercise_header.png)\
  \ project_41.1-4b\n```cpp\n#include <iostream>\n#include <fstream>\nusing namespace\
  \ std;\nconst string PATH = \"c:/temp/\";\nint main() {\n    string s, contents\
  \ = \"\";\n    fstream fin1(PATH + \"text1.txt\");\n    fstream fin2(PATH + \"text2.txt\"\
  );\n    fstream fout(PATH + \"final.txt\", fstream::out);\n    while (!fin1.eof())\
  \ {\n        getline(fin1, s);\n        contents += s + \"\\n\";\n    }\n    while\
  \ (!fin2.eof()) {\n        getline(fin2, s);\n        contents += s + \"\\n\";\n\
  \    }\n    fout << contents;\n    fout.close();\n    fin2.close();\n    fin1.close();\n\
  \    return 0;\n}\n```\n\n![](img/notice.jpg) 关闭文件的顺序不需要与打开文件的顺序一致。例如，你可以先打开 `text2.txt`\
  \ 文件，最后关闭它；或者先打开它并先关闭它。\n\n## 练习 41.1-5 在文件中搜索\n\n在美国，社会安全号码（SSN）是一个九位身份号码，适用于所有美国公民，用于在社会安全目的上对他们进行身份识别。假设有一个名为\
  \ `SSN.txt` 的文件，其中包含了加利福尼亚州所有公民的 SSN（社会安全号码）以及他们的姓名，每行一条记录。文件结构示例所示：\n\n123456789\
  \ Aristides Bouras\n123000000 Loukia Ainarozidou\n121212121 John Papas Junior\n\n\
  编写一个 C++ 程序，提示用户输入要搜索的 SSN 前几位，然后在文件中搜索并显示所有 SSN 以这些数字开头的公民的姓名。\n\n##### 解决方案\n\n\
  在这个特定的练习中，如果用户输入了 SSN 的所有九位进行搜索并且找到了该 SSN，程序必须显示相应公民的姓名并在之后停止搜索。相反，如果用户输入的搜索位数少于九位，程序必须搜索并显示所有\
  \ SSN 以这些数字开头的公民的姓名。该练习的解决方案如下。\n\n![](img/my_exercise_header.png) project_41.1-5\n\
  ```cpp\n#include <iostream>\n#include <fstream>\nusing namespace std;\nconst string\
  \ PATH = \"c:/temp/\";\nint main() {\n    string ssnToSearch, line, ssn, fullName;\n\
  \    bool found;\n    cout << \"Enter SSN to search: \";\n    cin >> ssnToSearch;\n\
  \    fstream fin(PATH + \"SSN.txt\");\n    found = false;\n    while (!fin.eof())\
  \ {\n        getline(fin, line);\n        ssn = line.substr(0, 9);\n        fullName\
  \ = line.substr(10);\n        // 如果找到了\n        if (ssnToSearch == ssn) {\n    \
  \        cout << fullName << endl;\n            found = true;\n            // 如果\
  \ SSN 包含 9 位则退出循环\n            if (ssnToSearch.length() == 9) {\n              \
  \  break;\n            }\n        }\n    }\n    fin.close();\n    if (!found) {\n\
  \        cout << \"Not found!\" << endl;\n    }\n    return 0;\n}\n```\n\n## 练习\
  \ 41.1-6 使用子程序合并文件\n\n执行以下操作：\n\ni) 编写一个名为 `readContent` 的子程序，接受一个文件名并返回其内容。\nii)\
  \ 编写一个名为 `writeContent` 的子程序，接受一个文件名和一个字符串，并将该字符串写入文件。\niii) 使用上述子程序，编写一个 C++ 程序，提示用户输入两个文件的文件名，然后将第一个文件的内容复制到第二个。假设用户输入的是有效文件名。\n\
  \n##### 解决方案\n\n尽管这个特定的练习看起来非常简单，但有必要强调 `readContent()` 函数的一些情况。检查下面的 `readContent()`\
  \ 函数并尝试找到错误。该错误是一个逻辑错误，而不是语法错误。该函数执行成功，C++ 编译器没有抛出任何语法错误。然而，错误确实存在，而且很难发现！\n\n```cpp\n\
  string readContent(string filename) {\n    string s, contents = \"\";\n    fstream\
  \ fin(filename);\n    while (!fin.eof()) {\n        getline(fin, s);\n        contents\
  \ += s + \"\\n\";\n    }\n    return contents;\n    fin.close();\n}\n```\n\n这里发生的情况是，当执行\
  \ `return` 语句时，C++ 会忽略函数剩余的语句，这意味着文件可能不会关闭。想象多次调用这个特定的函数。你最终会有许多打开的文件，它们可能永远不会关闭。\n\
  \n![](img/notice.jpg) 最新版本的 C++ 可能会在没有对文件的引用（`fin`）时自动关闭文件，但将文件打开并等待 C++ 为你关闭它是一个坏习惯。良好的做法是将\
  \ `return` 语句放在函数的末尾，如下面的程序所示。\n\n![](img/my_exercise_header.png) project_41.1-6\n\
  ```cpp\n#include <iostream>\n#include <fstream>\nusing namespace std;\nstring readContent(string\
  \ filename) {\n    string s, contents = \"\";\n    fstream fin(filename);\n    while\
  \ (!fin.eof()) {\n        getline(fin, s);\n        contents += s + \"\\n\";\n \
  \   }\n    fin.close();\n    return contents;\n}\nvoid writeContent(string filename,\
  \ string contents) {\n    fstream fout(filename, fstream::out);\n    fout << contents;\n\
  \    fout.close();\n}\nint main() {\n    string source, destination;\n    cout <<\
  \ \"Enter source filename: \";\n    cin >> source;\n    cout << \"Enter destination\
  \ filename: \";\n    cin >> destination;\n    string c = readContent(source);  //\
  \ 等同于：\n    writeContent(destination, c);    //writeContent(destination, readContent(source))\n\
  \    return 0;\n}\n```\n\n### 41.2 复习练习\n\n完成以下练习。\n\n1)假设有一个名为 `f_data41.2-1.txt`\
