  \ false || y == 3`\nv) `!(x >= 2 && y >= 2)`\nvi) `x != −2 && x <= 2`\n\n## 第 16\
  \ 章：单分支决策结构\n\n## 16.1 单分支决策结构\n\n这是最简单的决策控制结构。它仅在“真”路径上包含一条语句或一个语句块，如下面的般形式的流程图片段所示。\n\
  \n![Image](img/chapter16-01.png)\n\n如果 `Boolean_Expression` 的求值为真（true），则执行该结构中的语句或语句块；否则，跳过这些语句。\n\
  \nC++ 语句的一般形式为：\n\n```cpp\nif (Boolean_Expression) {A statement or block of statements}\n\
  ```\n\n注意，语句或语句块缩进了 2 个空格。\n\n在下一个示例中，只有当用户输入的数值小于 18 时，才会显示“你未成年！”的消息。当用户输入的数值大于或等于\
  \ 18 时，不显示任何内容。\n\n![](img/my_exercise_header.png) project_16.1a\n```cpp\n#include\
  \ <iostream>\nusing namespace std;\nint main() {\n    int age;\n    cout << \"Enter\
  \ your age: \";\n    cin >> age;\n    if (age < 18) {\n        cout << \"You are\
  \ underage!\" << endl;\n    }\n    return 0;\n}\n```\n\n注意 `cout` 语句缩进了 2 + 2 =\
  \ 4 个空格。\n\n在下一个示例中，只有当用户输入的数值小于 18 时，才会显示“你未成年！”和“你还需要再等几年”的消息。与之前一样，当用户输入的数值大于或等于\
  \ 18 时，不显示任何消息。\n\n![](img/my_exercise_header.png) project_16.1b\n```cpp\n#include\
  \ <iostream>\nusing namespace std;\nint main() {\n    int age;\n    cout << \"Enter\
  \ your age: \";\n    cin >> age;\n    if (age < 18) {\n        cout << \"You are\
  \ underage!\" << endl;\n        cout << \"You have to wait for a few more years.\"\
  \ << endl;\n    }\n    return 0;\n}\n```\n\n注意：所有出现在 `if` 语句内部的语句应该向右缩进相同数量的。在上一个示例中，两个\
  \ `cout` 语句都缩进了 2 个空格。\n\n注意：为了节约，本书每缩进层级使用 2 个空格。然而，专家建议每缩进层级使用 4 个空格。\n\n注意：为了缩进文本光标，而不是输入空格字符，你可以按一次“Tab\
  \ ![Image](img/key_tab.png)”键！\n\n注意：为了缩进现有的语句或语句块，请选择它并按下“Tab ![Image](img/key_tab.png)”键！\n\
  \n注意：为了取消语句或语句块的缩进，请选择它并按下“Shift ↑ + Tab ![Image](img/key_tab.png)”组合键！\n\n在下一个示例中，只有当用户输入名字“Zeus”时，才会显示“你是众神之王！”的消息。然而，无论用户输入什么名字，都会显示“你住在奥林匹斯山上”。\n\
  \n![](img/my_exercise_header.png) project_16.1c\n```cpp\n#include <iostream>\nusing\
  \ namespace std;\nint main() {\n    string name;\n    cout << \"Enter the name of\
  \ an Olympian: \";\n    cin >> name;\n    if (name == \"Zeus\") {\n        cout\
  \ << \"You are the King of the Gods!\" << endl;\n    }\n    cout << \"You live on\
  \ Mount Olympus.\" << endl;\n    return 0;\n}\n```\n\n注意最后一个 `cout` 语句不属于单分支决策结构的语句块。\n\
  \n初级程序员在编写 C++ 程序时犯的一个非常常见的错误是将值赋值运算符与“相等”运算符混淆。他们经常错误地写成 `if (name = \"Zeus\")`，而他们实际上想表达的是\
  \ `if (name == \"Zeus\")`。\n\n当 `if` 语句只包含一条单语句时，你可以省略大括号 `{ }`。因此，`if` 语句可以写成：\n\
  \n```cpp\nif (Boolean_Expression) One_Single_Statement;\n```\n\n或者你甚至可以将整个决策结构写在一行中，如下：\n\
  \n```cpp\nif (Boolean_Expression) One_Single_Statement;\n```\n\n只有当 `if` 语句中包含多条语句时，才需要大括号。如果没有大括号，C++\
  \ 假设只有顺序上的下一个语句才是决策控制结构的一部分。\n\n然而，为了防止潜在的逻辑错误，许多程序员倾向于始终使用大括号，即使 `if` 语句只包含一条单语句。在以下两个示例中，`cout\
  \ << x` 语句都不是 `if` 语句的一部分。\n\n```cpp\nif (x == y)\n    x++;\ncout << x;\n\nif (x\
  \ == y) {\n    x++;\n}\n```\n\n#### 练习 16.1-1 跟踪表与单分支结构\n\n为两种不同的执行设计相应的流程图并创建跟踪表：(i)\
