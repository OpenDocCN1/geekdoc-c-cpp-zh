  \n\n\n\n\n![](img/notice.jpg)取决于所使用的计算机语言，“函数（function）”和“过程（procedure）”术语可能有所不同。例如，在\
  \ Visual Basic 中，它们被称为“functions”和“subprocedures”，在 FORTRAN 中被称为“functions”和“subroutines（子例程）”，而在\
  \ C++ 中，通常首选术语是“functions”和“void functions”。\n\n### 35.2 什么是过程化编程？\n\n假设你被分配了一个解决你所在地区滥药物问题的项目。一种可能的方法（事实证明非常困难甚至无法实现）是尝试自己来解决这个问题！\n\
  \n然而，更好的方法是将大问题细分为更小的子问题，例如预防、治疗和康复，每个子问题都可以进一步细分为更小的子问题，如图 35–1 所示。\n\n![Image](img/chapter35-01.png)\n\
  \n图 35–1 一个大问题可以被细分为更小的问题。\n\n作为该项目的负责人，你可以租一栋建筑并在其中建立三个部门：预防部门及其所有下部门；治疗部门及其所有下部门；以及康复部门及其所有下部门。最后，你会聘请员工（来自各个领域的专家），组建团队并雇佣他们为你完成工作！\n\
  \n过程化编程做的正是完全相同的事情。它将一个初始问题细分为更小的子问题，每个子问题再进一步细分为更小的子问题。最后，为每个子问题编写一个小型子程序，然后主程序（就像负责人一样）调用（雇佣）每一个子程序来完成工作的的不同部分。\n\
  \n过程化编程具有以下几个优势：\n\n- 它允许程序员在任何需要时重用相同的代码，而无需重写或复制它。\n- 它相对容易实现。\n- 它帮助程序员更容易地跟踪执行流，从而简化了调试过程。\n\
  \n![](img/notice.jpg)当一个非常大的程序全部集成在一起时，其调试和维护可能会变得非常困难。因此，将其细分为若干较小的子程序（每个子程序执行一个定义明确的过程）通常更容易。\n\
  \n### 35.3 什么是模块化编程？\n\n在模块化编程中，具有共同功能的子程序可以组合到独立的模块中，每个模块可以拥有自己的 set 数据。因此，一个程序可以由多个部分组成，而其中每个部分（模块）都可以包含一个或多个更小的部分（子程序）。\n\
  \n![](img/notice.jpg)`cmath` 库就是这样一个例子。它包含了许多常见功能的子程序（与数学相关），例如 `sqrt()`、`sin()`、`cos()`、`tan()`\
  \ 等许多函数。\n\n如果你在之前的滥药物问题示例中使用模块化编程，那么你可以拥有三栋独立的建筑：一栋用于安置预防部门及其所有下部门，第二栋用于安置治疗部门及其所有下部门，第三栋用于安置康复部门及其所有下部门（如图\
  \ 35–2 所示）。这三栋建筑可以被认为是模块化编程中的三个不同模块，每个模块都包含常见功能的子程序。\n\n![Image](img/chapter35-02.png)\n\
  \n图 35–2 具有共同功能的子程序可以组合到独立的模块中。\n\n### 35.4 复习题：判断对错\n\n对下列每个陈述判断对错。\n\n1) 子程序是一个封装成单元的执行特定任务的语句块。\n\
  2) 通常来说，子程序有两种类型：函数（functions）和过程（procedures）。\n3) 通常来说，函数和过程的区别在于过程返回结果，而函数不返回。\n\
  4) `C++` 只支持过程。\n5) 过程化编程将初始问题细分为更小的子问题。\n6) 过程化编程的优势是能够重用相同的代码，而无需重写或复制它。\n7) 过程化编程帮助程序员更容易地跟踪执行流。\n\
  8) 模块化编程提高了程序开发速度。\n9) 在模块化编程中，具有共同功能的子程序被组合到独立的模块中。\n10) 在模块化编程中，每个模块可以拥有自己的数据。\n\
  11) 模块化编程使用的结构与结构化编程不同。\n12) 程序可以由多个模块组成。\n\n## 第 36 章：用户自定义子程序\n\n### 36.1 返回值的子程序\n\
  \n在 `C++` 和许多其他计算机语言中，返回值的子程序被称为函数。函数分为两类：一类内置函数（如 `abs()`），另一类自定义函数（即你可以亲自编写并在自己的程序中使用的函数）。\n\
  \n返回值的 `C++` 函数的通用形式如下所示：\n\n```cpp\nreturn_type name([type1 arg1, type2 arg2, type3\
  \ arg3, …]) {\n    Local variables declaration section\n    A statement or block\
  \ of statements\n    return value;\n}\n```\n\n其中\n\n- `return_type` 是函数返回的值的数据类型。\n\
  - `name` 是函数的名称。\n- `arg1`, `arg2`, `arg3`, …` 是用于从调用者传递值到函数的参数列表（变量、数组等）。参数的数量根据需要可以任意多个。\n\
  - `type1`, `type2`, `type3`, …` 是每个参数的数据类型。每个参数必须有一个数据类型。\n- `value` 是返回给调用者的值。它可以是一个常量值、变量、表达式，甚至是数据结构。它的数据类型必须与函数的\
  \ `return_type` 匹配。\n\n![](img/notice.jpg)注意参数是可选的；也就是说函数可以不包含参数。\n\n![](img/notice.jpg)在\
  \ 第 5.4 节 中你学习了为变量命名时必须遵循的规则。为子程序命名遵循完全相同的规则！\n\n函数名可以比作一个盒子（见图 36–1），它包含一个语句或语句块。它接受参数\
  \ `arg1`, `arg2`, `arg3`, …,` 作为输入值，并返回 `value` 作为输出值。\n\n![Image](img/chapter36-01.png)\n\
  \n图 36–1 函数可以比作一个盒子\n\n例如，下一个函数通过参数 `num1` 和 `num2` 接受两个数字，然后计算它们的和并返回结果。\n\n```cpp\n\
  double getSum(double num1, double num2) {\n    double result;\n    result = num1\
  \ + num2;\n    return result;\n}\n```\n\n当然，这也可以写为：\n\n```cpp\ndouble getSum(double\
  \ num1, double num2) {\n    return num1 + num2;\n}\n```\n\n### 36.2 如何调用函数\n\n每次函数调用如下：你写函数名，后面跟上参数列表（如果需要），可以放在将函数返回值赋值给变量的语句中，也可以直接放在表达式中。\n\
  \n让我们来看一些例子。以下函数通过参数 `num` 接受一个数值，并返回该值的三次方的结果。\n\n```cpp\ndouble cube(double num)\
  \ {\n    double result;\n    result = num * num * num;\n    return result;\n}\n\
  ```\n\n现在，假设你想计算以下表达式的结果：\n\n![Image](img/chapter36-02.png)\n\n你可以选择将函数 `cube()`\
  \ 的返回值赋值给一个变量，如下：\n\n```cpp\ncin >> x;\ncb = cube(x); // 将返回值赋值给变量\ny = cb + 1 /\
  \ x; // 并使用该变量\ncout << y << endl;\n```\n\n或者你可以直接在表达式中调用函数：\n\n```cpp\ncin >> x;\n\
  y = cube(x) + 1 / x; // 在表达式中直接调用函数\ncout << y << endl;\n```\n\n或者你甚至可以在 `cout`\
  \ 语句中直接调用函数：\n\n```cpp\ncin >> x;\ncout << cube(x) + 1 / x << endl; // 在 cout 语句中直接调用函数\n\
  ```\n\n![](img/notice.jpg)自定义函数可以像 `C++` 的内置函数一样调用。\n\n现在让我们来看另一个例子。下一个 `C++` 程序定义了函数\
  \ `getMessage()`，然后主代码调用了它。返回值被赋值给变量 `a`。\n\n\n\n\n\n![](img/my_exercise_header.png)\
  \ project_36.2\n\n```cpp\n#include <iostream>\nusing namespace std;\n//Define the\
  \ function\nstring getMessage() {\n    string msg;\n    msg = \"Hello Zeus\";\n\
  \    return msg;\n}\n//Main code starts here\nint main() {\n    string a;\n    cout\
  \ << \"Hi there!\" << endl;\n    a = getMessage();\n    cout << a << endl;\n   \
  \ return 0;\n}\n```\n\n如果你运行此程序，将显示以下消息。\n\n![Image](img/chapter36-03.png)\n\n![](img/notice.jpg)注意，子程序必须写在主函数之外。\n\
  \n![](img/notice.jpg)函数在程序开始运行时并不会立即执行。在上一个例子中，实际执行的第一条语句是 `cout << \"Hi there!\"\
  \ << endl`。\n\n你可以向函数传递（发送）值，只要函数括号内至少存在一个参数。在下一个例子中，函数 `display()` 被调用了三次，但每次都通过参数\
  \ `color` 传递了不同的值。\n\n![](img/my_exercise_header.png) project_36.2b\n\n```cpp\n\
  #include <iostream>\nusing namespace std;\n//Define the function\nstring display(string\
  \ color) {\n    return \"There is \" + color + \" in the rainbow\";\n}\n//Main code\
  \ starts here\nint main() {\n    cout << display(\"red\") << endl;\n    cout <<\
  \ display(\"yellow\") << endl;\n    cout << display(\"blue\") << endl;\n    return\
  \ 0;\n}\n```\n\n如果你运行此程序，将显示以下消息。\n\n![Image](img/chapter36-04.png)\n\n在下一个例子中，必须向函数\
  \ `display()` 传递两个值。\n\n![](img/my_exercise_header.png) project_36.2c\n\n```cpp\n\
  #include <iostream>\nusing namespace std;\nstring display(string color, bool exists)\
  \ {\n    string neg = \"\";\n    if (!exists) {\n        neg = \"n't any\";\n  \
  \  }\n    return \"There is\" + neg + \"  \" + color + \" in the rainbow\";\n}\n\
  int main() {\n    cout << display(\"red\", true) << endl;\n    cout << display(\"\
  yellow\", true) << endl;\n    cout << display(\"black\", false) << endl;\n    return\
  \ 0;\n}\n```\n\n如果你运行此程序，将显示以下消息。\n\n![Image](img/chapter36-05.png)\n\n![](img/notice.jpg)在\
  \ C++ 中，你必须将函数放在主代码的上方。在其他计算机语言中，如 `Java` 或 `PHP`，你可以将函数放在主代码的上方或下方。尽管如此，大多数程序员仍然倾向于将所有函数放在顶端，以便于观察。\n\
  \n### 36.3 不返回值的子程序\n\n在计算机科学中，不返回值的子程序可以被称为过程、子过程、子程序、void 函数等。在 C++ 中，首选的术语通常是\
  \ `void function`。\n\nC++ void 函数的通用形式是：\n\n```cpp\nvoid name([type1 arg1, type2\
  \ arg2, type3 arg3, …]) {\n    Local variables declaration section\n    A statement\
  \ or block of statements\n}\n```\n\n其中：\n\n- `name` 是 void 函数的名字。\n- `arg1`、`arg2`、`arg3`、…\
  \ 是参数列表（变量、数组等），用于从调用者将值传递给 void 函数。你可以根据需要任意数量的参数。\n- `type1`、`type2`、`type3`、…\
  \ 是每个参数的数据类型。每个参数必须有一个数据类型。\n\n![](img/notice.jpg)注意，参数是可选的；也就是说，void 函数可以不包含参数。\n\
  \n例如，下一个 void 函数通过参数 `num1` 和 `num2` 接收两个数字，然后计算它们的和，最后显示结果。\n\n```cpp\nvoid displaySum(double\
  \ num1, double num2) {\n    double result;\n    result = num1 + num2;\n    cout\
  \ << result << endl;\n}\n```\n\n### 36.4 如何调用 void 函数\n\n你可以通过直接写函数名来调用 void 函数。下一个例子定义了\
  \ void 函数 `displayLine()`，主代码在每次需要显示水平线时调用该 void 函数。\n\n![](img/my_exercise_header.png)\
  \ project_36.4a\n\n```cpp\n#include <iostream>\nusing namespace std;\n//Define the\
  \ void function\nvoid displayLine() {\n    cout << \"---------------------\" <<\
  \ endl;\n}\nint main() {\n    cout << \"Hello there!\" << endl;\n    displayLine();\n\
  \    cout << \"How do you do?\" << endl;\n    displayLine();\n    cout << \"What\
  \ is your name?\" << endl;\n    displayLine();\n    return 0;\n}\n```\n\n你可以向 void\
  \ 函数传递（发送）值，只要 void 函数的括号内至少存在一个参数。在下一个例子中，void 函数 `displayLine()` 被调用了三次，但每次都通过变量\
  \ `length` 传递了不同的值，导致打印出三条长度不同的线。\n\n![](img/my_exercise_header.png) project_36.4b\n\
  \n```cpp\n#include <iostream>\nusing namespace std;\nvoid displayLine(int length)\
  \ {\n    int i;\n    for (i = 1; i <= length; i++) {\n        cout << \"-\";\n \
  \   }\n    cout << endl;\n}\nint main() {\n    cout << \"Hello there!\" << endl;\n\
  \    displayLine(12);\n    cout << \"How do you do?\" << endl;\n    displayLine(14);\n\
  \    cout << \"What is your name?\" << endl;\n    displayLine(18);\n    return 0;\n\
  }\n```\n\n![](img/remember.jpg)由于 void 函数 `displayLine()` 没有返回值，因此下行代码是错误的。你不能将\
  \ void 函数赋值给变量，因为没有任何返回的值！\n\n`y = display_line(12);`\n\n此外，你不能在语句中调用它。下行代码也是错误的。\n\
  \n`cout << \"Hello there!\\n\" << display_line(12);`\n\n### 36.5 形式参数和实际参数\n\n每个函数（或\
  \ void 函数）都包含一个称为形式列表的参数列表。如前所述，形式列表可以不包含参数、包含一个参数或包含多个参数。\n\n当调用子程序（函数）时，会将一个参数列表传递给子程序。这个列表被称为实际列表。\n\
  \n在下一个例子中，形式参数（变量）`n1` 和 `n2` 构成了形式列表，而实际参数（变量）`x` 和 `y` 以及（表达式）`x + y` 和 `y / 2`\
  \ 构成了实际列表。\n\n![](img/my_exercise_header.png) project_36.5\n\n```cpp\n#include <iostream>\n\
  using namespace std;\n//Define the function\n//The two arguments n1 and n2 are formal\
  \ arguments.\ndouble multiply( double n1, double n2 ) {\n    double result;\n  \
  \  result = n1 * n2;\n    return result;\n}\n//Main code starts here\nint main()\
  \ {\n    double x, y, w;\n    cin >> x;\n    cin >> y;\n    //Call the function.\n\
  \    //The two arguments x and y are actual arguments.\n    w = multiply( x, y );\n\
  \    //Call the function.\n    //The two arguments x + y and y / 2 are actual arguments.\n\
  \    cout << multiply( x + 2, y / 2 ) << endl;\n    return 0;\n}\n```\n\n![](img/notice.jpg)注意形式参数和实际参数之间存在一对应的关系。在第一次调用中，实际参数\
  \ `x` 的值被传递给形式参数 `n1`，实际参数 `y` 的值被传递给形式参数 `n2`。在第二次调用中，实际参数（表达式）`x + 2` 的值被传递给形式参数\
  \ `n1`，实际参数（表达式）`y / 2` 的值被传递给形式参数 `n2`。\n\n### 36.6 函数是如何执行的？\n\n当主代码调用函数时，会执行以下步骤：\n\
  \n- 中断主代码语句的执行。\n- 将实际参数列表中变量的值或表达式的结果传递（赋值）给形式参数列表中的相应参数（变量），执行流跳转到函数定义的地方。\n-\
  \ 执行函数的语句。\n- 当执行流遇到 `return` 语句时，值从函数返回到主代码，执行流从调用函数之前的位置继续。\n\n在下一个 C++ 程序中，函数\
  \ `maximum()` 接收两个参数（数值），并返回两个值中较大的一个。\n\n```cpp\n#include <iostream>\nusing namespace\
  \ std;\ndouble maximum(double val1, double val2) {\n    double m;\n    m = val1;\n\
  \    if (val2 > m) {\n        m = val2;\n    }\n    return m;\n}\n```\n\n\n\n\n\
  当 C++ 程序开始运行时，第一个被执行的语句是 `cin >> a` 语句（这被认为是程序的第一条语句）。\n\n下面是一个追踪表，它展示了确切的执行流、变量\
  \ `a` 和 `b` 的值如何从主代码传递到函数，以及函数如何返回其结果。假设用户输入了值 3 和 8。\n\n| 步骤 | 主代码语句 | a | b |\
  \ maxim |\n| --- | --- | --- | --- | --- |\n| 1 | `cin >> a` | 3.0 | ? | ? |\n|\
  \ 2 | `cin >> b` | 3.0 | 8.0 | ? |\n| 3 | `maxim = maximum(a, b)` | | | |\n\n当调用函数\
  \ `maximum()` 时，主代码语句的执行被中断，变量 `a` 和 `b` 的值被传递（如果你愿意，也可以理解为赋值）给对应的形式形参数（变量）`val1`\
  \ 和 `val2`，执行流跳转到函数定义所在。然后，执行函数的语句。\n\n| 步骤 | 函数 maximum() 语句 | val1 | val2 | m\
  \ |\n| --- | --- | --- | --- | --- |\n| 4 | `m = val1` | 3.0 | 8.0 | 3.0 |\n| 5\
  \ | `if (val2 > m)` | 此求值结果为真 | | |\n| 6 | `m = val2` | 3.0 | 8.0 | 8.0 |\n| 7 |\
  \ `return m` | | | |\n\n当执行流到达 `return` 语句时，值 8 从函数返回到主代码（并赋值给变量 `maxim`），执行流从调用函数之前的位置继续执行。主代码在用户的屏幕上显示值\
  \ 8。\n\n| 步骤 | 主代码语句 | a | b | maxim |\n| --- | --- | --- | --- | --- |\n| 8 | `cout\
  \ << maxim << endl` | 3.0 | 8.0 | 8.0 |\n\n### 练习 36.6-1 回到基础 – 计算两个数之和\n\n执行以下操作：\n\
