  - 如果客户购买了 4 瓶葡萄酒或更多，将获得 45 分。\n\n使用分支决策结构，编写一个 C++ 程序，提示用户输入他们每月购买的葡萄酒总数，然后显示积分。假设用户输入的是有效值。\n\
  \n7) 使用分支决策结构，编写一个 C++ 程序，提示用户输入姓名，然后显示“Hello NN!”或“Hi NN!”或“What's up NN!”,其中 NN\
  \ 是用户的姓名。显示的消息必须随机选择。\n\n8) 使用分支决策结构，编写一个 C++ 程序，让用户输入一个数字（例如 0、1 或 2），然后将其转换为相应的单词（例如“zero”、“one”或“two”）。必须对\
  \ 0 到 9 的数字进行。当用户输入未知数字时，显示“I don't know this number!”\n\n9) 蒲福等级（Beaufort scale）是一种将风速与陆上或海上条件的经验标准。使用分支决策结构，编写一个\
