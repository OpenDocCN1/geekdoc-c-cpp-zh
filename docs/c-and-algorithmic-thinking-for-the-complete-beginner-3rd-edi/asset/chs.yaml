  \n## 练习 4\n某运输公司的 IT 管理员需要一个程序，从名为 `f_data41.2-4.txt` 的文件中提取有关公司运输物品的有用信息。假设该文件包含每个物品的宽度、长度、高度和描述。物品的尺寸单位为英寸，每个尺寸占据文件中\
  \ 4 个字符（2 个字符用于整数部分，1 个用于小数点，1 个用于小数）。该文件的结构示例下所示：\n```\n110.5 011.2 020.9 Box No\
  \ 37 (Plastic bottles)\n022.6 023.1 040.2 Container No 23 (6 glasses)\n009.5 156.6\
  \ 020.0 Package No 12 (Fragile items)\n024.2 020.1 030.1 Container No 29 (Glass\
  \ bottles)\n```\n\n编写一个 C++ 程序：\n\ni) 提示用户输入一个关键词以在物品描述中搜索。例如，如果用户输入单词 `glass`，程序必须显示以下消息：\n\
  ```\nKeyword 'glass' found!\nContainer No 23 (6 glasses) – Dimensions: 22.6 x 23.1\
  \ x 40.2\nContainer No 29 (Glass bottles) - Dimensions: 24.2 x 20.1 x 30.1\n```\n\
  \nii) 找到并显示每个物品的体积（立方英尺为单位）。消息格式必须如例所示：\n```\nVolume of each item:\nBox No 37 (Plastic\
  \ bottles): Volume = 14.9686 cubic feet\nContainer No 23 (6 glasses): Volume = 12.1451\
  \ cubic feet\nPackage No 12 (Fragile items): Volume = 17.2187 cubic feet\nContainer\
  \ No 29 (Glass bottles): Volume = 8.472940 cubic feet\n```\n\niii) 找到并显示所有物品的总体积（立方英尺为单位）。\n\
  iv) 找到并显示体积最大的箱子的描述。\n\n请记住，一个立方英尺等于 `1728` 立方英寸。\n\n## 练习 5\n编写一个 C++ 程序，提示用户输入两个文件名。程序必须合并这两个文件的内容并将合并后的文本写入名为\
  \ `final.txt` 的第三个文件中，将第一个文件的内容放在第二个文件内容之后。如果用户提供的文件名不包含 `.txt` 扩展名，程序必须显示错误信息。\n\
  \n## 练习 6\n假设有一个名为 `f_data41.2-6.txt` 的文件，其中包含 15 个数字，每行一个。编写一个 C++ 程序使用冒泡排序算法对这些数字进行升序排序，并将排序后的值写入同一个文件中，位于初始未排序值的下方。\n\
  \n## 练习 7\n假设有一个名为 `f_data41.2-7.txt` 的文件，其中包含八个城市名称及其在特定日的最高温度。该文件的结构示例如下：\n```\n\
  New York\n82.3\nWashington DC\n84.3\n```\n\n因此，奇数行包含城市名称，偶数行包含每个城市的最高温度。编写一个 C++\
  \ 程序逐行读取文件，并将城市名称和温度分别存储在数组 `cities` 和 `temperatures` 中。假设文件中至少有一个城市名称及其对应的温度。程序随后必须：\n\
  \ni) 计算并显示所有城市的平均温度。\nii) 找到并显示最高温度以及具有该温度的所有城市名称。\n\n## 练习 8\n有些单词如“revolutionary”和“internationalization”非常长，反复书写它们会非常累。假设如果一个单词的长度超过\
  \ 10 个字符，我们就认为它太长了。在这种情况下，该单词必须替换为特殊的缩写，生成方法如下：保留单词的第一个和最后一个字母，并在它们之间插入字母的数量。例如，“revolutionary”变为\
  \ `r11y`，“internationalization”变为 `i18n`。\n\n假设有一个名为 `f_data41.2-8.txt` 的文件，其中包含一段英文文本。执行以下操作：\n\
  \ni) 编写一个子程序 `abbreviate`，接收一个单词，当其长度超过 10 个字符时返回其缩写；否则返回原单词。\nii) 使用上述子程序，编写一个\
  \ C++ 程序读取文件，并将所有长单词替换为它们的缩写。\n\n假设单词之间用空格分隔。\n\n## 练习 9\nPig Latin（猪丁语）是一种在英语国家常用的趣味语言游戏。它根据简单的规则修改单词字母。将单词转换为\
  \ Pig Latin 的规则如下：\n- 如果单词以元音开头，直接在单词末尾加上“way”。例如，“apple”变为 `appleway`。\n- 如果单词以一个或多个辅音开头，将辅音移动到单词末尾并加上“ay”。例如，“banana”变为\
  \ `ananabay”，“flower”变为 `owerflay`。\n\n假设名为 `f_data41.2-9.txt` 的文件包含英文文本。执行以下操作：\n\
  \ni) 编写一个子程序 `pigLatinTranslator`，接收一个单词并返回相应的 Pig Latin 翻译。\nii) 使用上述子程序，编写一个 C++\
  \ 程序读取文件，并将结果写入名为 `pig_latin_translation.txt` 的文件中。\n\n假设文本仅包含小写字母且单词之间用空格分隔。\n\n\
  ## 练习 10\n给定两个字符串 `X = \"ABCDEFGHIJKLMNOPQRSTUVWXYZ\"` 和 `Y = \"JKWCTAMEDXSLBYUNGZOHP\"\
  `，你可以加密任何消息。持有字符串 `Y` 的人可以通过将字符串 `X` 的字母映射到 `Y` 来解密。具体来说，“A”加密为“J”，“B”为“K”，“C”为“W”，以此此类推。根据这种加密方法，编写一个\
  \ C++ 程序提示用户输入一条消息，然后将加密消息写入名为 `encrypted.txt` 的文件中。空格字符不能加密，在加密消息中保持原样。\n\n## 练习\
  \ 11\n编写一个 C++ 程序解密上一个练习的消息（位于 `encrypted.txt` 中），并将解密消息写入名为 `decrypted.txt` 的文件中。\n\
  \n## 练习 12\n编写一个名为 `copyFile` 的子程序，接受两个参数（`source` 和 `destination`），然后使用 `destination`\
  \ 创建 `source` 文件的副本。\n\n## 练习 13\n假设有一个名为 `f_data41.2-13.txt` 的文件，其中包含三角形三边的长度（每行一个）。该文件的结构示例如下：\n\
  ```\n16.0\n20.6\n22.7\n```\n\n执行以下操作：\n\ni) 编写一个名为 `Triangle` 的类，包括\na) 三个私有浮点字段\
  \ `_sideA`、`_sideB` 和 `_sideC`。\nb) 构造函数，从文件中读取三边并将它们赋值给字段 `_sideA`、`_sideB` 和 `_sideC`。\n\
  c) 一个公共布尔方法 `canBeTriangle`，并在字段 `_sideA`、`_sideB` 和 `_sideC` 的值可以作为三角形的三边长度时返回\
  \ true；否则返回 false。\n\n提示：在任何三角形中，每边的长度都小于其他两边长度之和。\n\n\n\n\n\nd) 一个名为 `displayLengths`\
  \ 的 `public void method`，用于显示三边的长度，并显示一条消息指示这些长度是否可以构成三角形的三边。\n\ne) 一个名为 `displayArea`\
  \ 的 `public void method`，如果这些长度可以构成三角形的三边，则计算并显示三角形的面积。你可以使用 `Heron's formula`，它已经为人知近\
  \ 2000 年了！\n\n![Image](img/chapter12-24.png)\n\n其中 `S` 是半周 ![Image](img/chapter12-25.png)\n\
  \nf) 一个名为 `displayPerimeter` 的 `public void method`，如果这些长度可以构成三角形的三边，则计算并显示三角形的周长。\n\
  \nii) 使用上述类，编写一个 C++ 程序来显示关于三角形的所有可用信息。\n\n## 在“文件”中复习\n\n### 复习习字谜游戏\n\n1) 解决下面的字谜游戏。\n\
