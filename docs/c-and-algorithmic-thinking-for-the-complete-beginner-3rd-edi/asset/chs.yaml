  \n## 第 13 章：商与余数的练习\n\n### 13.1 引言\n\n哪些类型的问题可能需要使用商和余数？商和余数可以用于：\n- 将整数拆分为数字\n\
  - 检查整数是否为奇偶\n- 检查整数是否为某个整数的倍数\n- 将时间转换为小时、分钟和秒\n- 将金额转换为美元\n- 计算最大公约数\n- 判断一个整数是否为回文\n\
  - 统计某个特定数字在整数中出现的次数\n\n\n\n\n| 第四位 = 3 | 最后一个剩余的数字恰好是第四位，为 `digit4 = 53 % 10` |\n\
  \n解决该算法的 C++ 程序所示处。\n\n![](img/my_exercise_header.png) project_13.1-2a\n```cpp\n\
  #include <iostream>\nusing namespace std;\nint main() {\n    int digit1, digit2,\
  \ digit3, digit4, number, r, total;\n    cout << \"Enter a four-digit integer: \"\
  ;\n    cin >> number;\n    digit1 = (int)(number / 1000);\n    r = number % 1000;\n\
  \    digit2 = (int)(r / 100);\n    r = r % 100;\n    digit3 = (int)(r / 10);\n \
  \   digit4 = r % 10;\n    total = digit1 + digit2 + digit3 + digit4;\n    cout <<\
  \ total << endl;\n    return 0;\n}\n```\n\n你刚刚看到的程序的追踪表所示处。\n\n| 步骤 | 语句 | 备注 |\
  \ number | digit1 | digit2 | digit3 | digit4 | r | total |\n| --- | --- | --- |\
  \ --- | --- | --- | --- | --- | --- | --- |\n| 1 | `cout << \"Enter…` | 显示：Enter\
  \ a four-digit integer: | | | | | | | | |\n| 2 | `cin >> number` | 用户输入 6753 | 6753\
  \ | ? | ? | ? | ? | ? | ? |\n| 3 | `digit1 = (int)(number / 1000)` | | 6753 | 6\
  \ | ? | ? | ? | ? | ? |\n| 4 | `r = number % 1000` | | 6753 | 6 | ? | ? | ? | 753\
  \ | ? |\n| 5 | `digit2 = (int)(r / 100)` | | 6753 | 6 | 7 | ? | ? | 753 | ? |\n\
  | 6 | `r = r % 100` | | 6753 | 6 | 7 | ? | ? | 53 | ? |\n| 7 | `digit3 = (int)(r\
  \ / 10)` | | 6753 | 6 | 7 | 5 | ? | 53 | ? |\n| 8 | `digit4 = r % 10` | | 6753 |\
  \ 6 | 7 | 5 | 3 | 53 | ? |\n| 9 | `total = digit1 + digit2 + digit3 + digit4` |\
  \ | 6753 | 6 | 7 | 5 | 3 | 53 | 21 |\n| 10 | `cout << total << endl` | 显示：21 | |\
  \ | | | | | | |\n\n为了进一步帮助你，下面提供一个通用的 C++ 程序，它可以用于拆分任何给定的整数。由于你的程序长度取决于位数 `N`，你只需要做的就是编写\
  \ `N−1` 对语句即可。\n\n`cout << \"Enter an N-digit integer: \"; cin >> number; digit1\
  \ = (int)(number / 10^(N-1)); r = number % 10^(N-1); digit2 = (int)(r / 10^(N-2));\
  \ r = r % 10^(N-2);...digit(N-2) = (int)(r / 100); r = r % 100; digit(N-1) = (int)(r\
  \ / 10); digit(N) = r % 10;`\n\n例如，如果你想拆分一个六位整数，你需要像接下来的程序所示编写五对语句。\n\n![](img/my_exercise_header.png)\
  \ project_13.1-2b\n```cpp\n#include <iostream>\nusing namespace std;\nint main()\
  \ {\n    int digit1, digit2, digit3, digit4, digit5, digit6, number, r;\n    cout\
  \ << \"Enter an six-digit integer: \";\n    cin >> number;\n    digit1 = (int)(number\
  \ / 100000);\n    r = number % 100000;\n    digit2 = (int)(r / 10000);\n    r =\
  \ r % 10000;\n    digit3 = (int)(r / 1000);\n    r = r % 1000;\n    digit4 = (int)(r\
  \ / 100);\n    r = r % 100;\n    digit5 = (int)(r / 10);\n    digit6 = r % 10;\n\
  \    cout << digit1 << \"  \" << digit2 << \"  \" << digit3 << \"  \";\n    cout\
  \ << digit4 << \"  \" << digit5 << \"  \" << digit6 << endl;\n    return 0;\n}\n\
  ```\n\n### 第二种方法\n\n对于给定的四位整数，第一方法执行了三对除法——先除以 1000，然后除以 100，最后除以 10——从左到右分离数字。相比之下，这种第二种方法中的三对除法全部都是除以\
  \ 10，从右到左分离数字。再次为了深入研究这种方法，让我们使用相同的用户数字：6753。\n\n| 第四位 = 3 | 如果你将用户提供的数字除以 10 并使用\
  \ `%` 运算符，就可以分离出第四位 `digit4 = 6753 % 10` |\n| 剩余数字 = 675 | 如果你再次将用户提供的数字除以 10 并使用\
  \ `/` 运算符和 `(int)` 类型转换运算符，得到整数商 `r = (int)(6753 / 10)` |\n| 第三位 = 5 | 如果你将剩余数字除以\
  \ 10 并使用 `%` 运算符，就可以分离出第三位 `digit3 = 675 % 10` |\n| 剩余数字 = 67 | 剩余数字现在是 `r = (int)(675\
  \ / 10)` |\n| 第二位 = 7 | 如果你将剩余数字除以 10 并使用 `%` 运算符，就可以分离出第二位 `digit2 = 67 % 10` |\n\
  | 第一位 = 6 | 最后一个剩余的数字恰好是第一位，为 `digit1 = (int)(67 / 10)` |\n\n该算法的 C++ 程序所示。\n\n\
  ![](img/my_exercise_header.png) project_13.1-2c\n```cpp\n#include <iostream>\nusing\
  \ namespace std;\nint main() {\n    int digit1, digit2, digit3, digit4, number,\
  \ r;\n    cout << \"Enter a four-digit integer: \";\n    cin >> number;\n    digit4\
  \ = number % 10;\n    r = (int)(number / 10);\n    digit3 = r % 10;\n    r = (int)(r\
  \ / 10);\n    digit2 = r % 10;\n    digit1 = (int)(r / 10);\n}\n```\n为了进一步帮助你，下面是一个可以用于拆分任何给定整数的通用\
  \ C++ 程序。该程序使用了第二种方法。再次，由于程序的长度取决于位数 `N`，你所做的就是编写 `N−1` 对语句。\n\n`cout << \"Enter\
  \ a N-digit integer: \"; cin >> number; digit(N) = number % 10; r = (int)(number\
  \ / 10); digit(N-1) = r % 10; r = (int)(r / 10);...digit3 = r % 10; r = (int)(r\
  \ / 10); digit2 = r % 10; digit1 = (int)(r / 10);`\n\n例如，如果你想拆分一个五位整数，必须像下面的程序所示使用四对语句。\n\
  \n![](img/my_exercise_header.png) project_13.1-2d\n```cpp\n#include <iostream>\n\
  using namespace std;\nint main() {\n    int digit1, digit2, digit3, digit4, digit5,\
  \ number, r;\n    cout << \"Enter a five-digit integer: \";\n    cin >> number;\n\
  \    digit5 = number % 10;\n    r = (int)(number / 10);\n    digit4 = r % 10;\n\
  \    r = (int)(r / 10);\n    digit3 = r % 10;\n    r = (int)(r / 10);\n    digit2\
  \ = r % 10;\n    digit1 = (int)(r / 10);\n    cout << digit1 << \"  \" << digit2\
  \ << \"  \" << digit3 << \"  \" << digit4 << \"  \" << digit5 << endl;\n    return\
  \ 0;\n}\n```\n\n#### 练习 13.1-3 显示已时间\n\n编写一个 C++ 程序，提示用户输入一个表示经过秒数的整数，然后以“DD day(s)\
  \ HH hour(s) MM minute(s) and SS second(s)”的格式显示。例如，如果用户输入数字 700005，必须显示“8 day(s)\
  \ 2 hour(s) 26 minute(s) and 45 second(s)”。\n\n##### 解决方案\n\n你可能已经知道，一分钟 60 秒，一小时有\
  \ 3600 秒（60 × 60），一天有 86400 秒（3600 × 24）。让我们尝试使用上一个练习中学到的第一方法来分析数字 700005。\n\n|\
  \ 天数 = 8 | 如果你将用户提供的整数除以 86400 并使用 `/` 运算符和 `(int)` 类型转换运算符，得到整数商 `days = (int)(700005\
  \ / 86400)` |\n| 剩余秒 = 8805 | 如果你再次将用户提供的整数除以 86400，这次使用 `%` 运算符得到整数余数 `r = 700005\
  \ % 86400` |\n| 小时 = 2 | 如果你将剩余秒除以 3600 并使用 `/` 运算符和 `(int)` 类型转换运算符，得到整数商 `hours\
  \ = (int)(8805 / 3600)` |\n| 剩余秒 = 1605 | 剩余秒现在是 `r = 8805 % 3600` |\n| 分钟 = 26\
  \ | 如果你将剩余秒除以 60 并使用 `/` 运算符和 `(int)` 类型转换运算符，得到整数商 `minutes = (int)(1605 / 60)`\
  \ |\n| 秒 = 45 | 最后一个余数恰好是剩余的秒数，为 `seconds = 1605 % 60` |\n\n该算法的 C++ 程序所示。\n\n```cpp\n\
  #include <iostream>\nusing namespace std;\nint main() {\n    int days, hours, minutes,\
  \ number, r, seconds;\n    cout << \"Enter a period of time in seconds: \";\n  \
  \  cin >> number;\n    days = (int)(number / 86400);   // 60 * 60 * 24 = 86400\n\
  \    r = number % 86400;\n    hours = (int)(r / 3600);        // 60 * 60 = 3600\n\
  \    r = r % 3600;\n    minutes = (int)(r / 60);\n    seconds = r % 60;\n    cout\
  \ << days << \" day(s) \" << hours << \" hour(s) \" << endl;\n    cout << minutes\
  \ << \" minute(s) and \" << seconds << \" second(s)\" << endl;\n    return 0;\n\
  }\n```\n\n\n\n\n\n![](img/my_exercise_header.png) # project_13.1-3b\n\n```cpp\n\
  #include <iostream>\nusing namespace std;\nint main() {\n    int days, hours, minutes,\
  \ number, r, seconds;\n    cout << \"Enter a period of time in seconds: \";\n  \
  \  cin >> number;\n    seconds = number % 60;\n    r = (int)(number / 60);\n   \
  \ minutes = r % 60;\n    r = (int)(r / 60);\n    hours = r % 24;\n    days = (int)(r\
  \ / 24);\n    cout << days << \" day(s) \" << hours << \" hour(s) \" << endl;\n\
  \    cout << minutes << \" minute(s) and \" << seconds << \" second(s)\" << endl;\n\
  \    return 0;\n}\n```\n\n#### 练习 13.1-4 反转数字\n\n编写一个 C++ 程序，提示用户输入三位整数，然后构建并显示其反转数字。例如，如果用户输入数字\
  \ 875，程序必须显示 578。\n\n##### 解决方案\n\n为了分离用户提供的整数的三位数字，你可以使用第一种或第二种方法。之后，这个练习的唯一困难在于构建反转数字。\n\
  \n以数字 875 为例。分离后，三个数字将是：\n\n`digit1 = 8`\n`digit2 = 7`\n`digit3 = 5`\n\n然后你可以简单地计算乘积之和来构建反转数字：\n\
  \n`digit3 × 100 + digit2 × 10 + digit1 × 1 = 5 × 100 + 7 × 10 + 8 × 1 = 578`\n\n\
  为了换一种方式，让我们使用第二种方法分离用户提供的数字。C++ 程序将如下。\n\n![](img/my_exercise_header.png) # project_13.1-4\n\
  \n```cpp\n#include <iostream>\nusing namespace std;\nint main() {\n    int digit1,\
  \ digit2, digit3, number, r, reversedNumber;\n    cout << \"Enter a three-digit\
  \ integer: \";\n    cin >> number;\n    digit3 = number % 10;      //这是最右边的数字\n\
  \    r = (int)(number / 10);\n    digit2 = r % 10;           //这是中间的数字\n    digit1\
  \ = (int)(r / 10);    //这是最左边的数字\n    reversedNumber = digit3 * 100 + digit2 * 10\
  \ + digit1;\n    cout << reversedNumber << endl;\n    return 0;\n}\n```\n\n### 13.2\
