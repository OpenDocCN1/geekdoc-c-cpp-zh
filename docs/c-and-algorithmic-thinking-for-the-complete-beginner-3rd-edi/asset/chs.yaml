  \ 代表要找到的未知量。因为 `x` 的幂次是，该方程被分类为一次方程，也称为线性方程。\n\n方程的根是 `x` 的值，使得 `ax + b` 等于零。在练习中，用户必须输入系数\
  \ `a` 和 `b` 的值，可能会出现三种情况：\n\ni) 用户可能对系数 `a` 输入值 0，对系数 `b` 输入非零值。在这种情况下，`x` 的结果是未定义的。如你所知，除以零的操作无法执行。\n\
  \nii) 用户可能对两个系数 `a` 和 `b` 输入值 0。在这种情况下，这被称为不定式。\n\niii) 用户可能输入任何其他值对。\n\n这三种情况以及产生的路径在下方使用多分支决策表示出来。\n\
