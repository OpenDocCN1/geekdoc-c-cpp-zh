  \n编写一个 C++ 程序，提示用户输入一个英文句子，并统计句子中每个元元的出现频率。使用 `unordered_map` 来存储元音作为键，并将它们的频率作为值。\n\
  \n##### 解决方案\n\n在编程领域，文本数据的处理和分析起着至关重要的作用。一项常见任务是统计给定文本中特定元素的频率，从而为其语言特征提供见解。元音是英语语言的基础组成部分，分析它们的频率可以揭示模式、辅助语言处理，甚至有助于某些加密算法。\n\
  \n在下面的解决方案中，程序首先创建一个名为 `vowelsFrequency` 的 `unordered_map` 来存储和管理每个元音（A, E, I, O,\
  \ U）的频率，初始频率均设为零。对于用户提供的句子中的每个字符，程序会检查它是否为元音，如果是，则更新 `vowelsFrequency` map 中相应的频率计数。\n\
  \n```cpp\n#include <iostream>\n#include <unordered_map>\n#include <boost/algorithm/string.hpp>\n\
  using namespace boost::algorithm;\nusing namespace std;\n\nint main() {\n    string\
  \ sentence, letter;\n    // 创建一个 unordered map 来存储每个元音频率，初始\n    //频率均设为零。\n   \
  \ unordered_map<string, int> vowelsFrequency = {\n        {\"A\", 0},\n        {\"\
  E\", 0},\n        {\"I\", 0},\n        {\"O\", 0},\n        {\"U\", 0}\n    };\n\
  \    cout << \"Enter an English sentence: \";\n    getline(cin, sentence);\n   \
  \ // 遍历用户提供句子的字符，如果它是元音，\n    // 更新（增加）vowelsFrequency unordered map 中相应的频率计数。\n\
  \    for (const auto& character : to_upper_copy(sentence)) {\n        letter = character;\n\
  \        if (vowelsFrequency.count(letter) == 1) {\n            vowelsFrequency[letter]++;\n\
  \        }\n    }\n    // 显示每个元元的频率\n    for (const auto& element : vowelsFrequency)\
  \ {\n        cout << element.first << \": \" << element.second << endl;\n    }\n\
  \    return 0;\n}\n```\n\nC++ 内置方法 `struct.count(key_name)` 在键 `key_name` 存在于 `unordered_map`\
  \ `struct` 中时返回 1，如果 `key_name` 不存在则返回 0。\n\n## 34.7 复习题：判断对错\n\n判断每个陈述的对错。\n\n\
  1) 冒泡排序算法（按升序排序数组时）的核心思想是反复将数组中最小的元素移动到最低索引位置。\n2) 在升序排序的数组中，第一个元素是所有元素最大的。\n3)\
  \ 使用冒泡排序算法时，交换次数取决于给数组。\n4) 冒泡排序算法执行次数交换次数的情况是你想对一个已经升序排序的数组进行降序排序。\n5) 在冒泡排序算法中，当决策控制结构测试布尔表达式\
  \ `A[n] > A[n – 1]` 时，意味着数组 `A` 的元素正在按降序排序。\n6) 在 C++ 中，排序算法比较字母的方式与比较数字相同。\n7)\
  \ 如果你想排序数组 `A` 但保留与数组 `B` 元素的一一对应关系，你必须也重新排列数组 `B` 的元素。\n8) 冒泡排序算法有时优于改进后的冒泡排序算法。\n\
  9) 根据冒泡排序算法，在每一轮中（最后一次除外），只有一个元素被保证放置在正确的位置。\n10) 冒泡排序算法只能通过 `for`-循环实现。\n11) 快速排序算法不能用于对二维数组的每一列进行排序。\n\
  12) 插入排序算法可以按降序或升序排序。\n13) 最快的排序算法之一是改进后的冒泡排序算法。\n14) 对于包含 `N` 个元素的一维数组，冒泡排序算法执行\
  \ `N(N-1)/2` 次比较。\n15) 对于包含 `N` 个元素的一维数组，冒泡排序算法执行 `N-1` 轮遍历。\n16) 使用改进后的冒泡排序算法时，如果执行了一次完整遍历且没有发生交换，则算法知道数组已排序，不需要再进行后续遍历。\n\
  17) 使用选择排序算法时，如果你想按降序排序数组，你需要寻找最大值。\n18) 选择排序算法在主内存有限的计算机系统上表现良好。\n19) 选择排序算法适用于大规模规模数据操作。\n\
  20) 选择排序算法是一种非常复杂的算法。\n21) 插入排序算法的性能通常优于选择排序和冒泡排序算法。\n22) 插入排序算法有时甚至比快速排序算法更快。\n\
  23) 快速排序算法被认为是最好最快的排序算法之一。\n24) 排序后的数组只包含互不同的元素。\n25) 搜索算法是一种在数据集中搜索具有特定特征项的算法。\n\
  26) 顺序搜索算法只能用于包含算术值的数组。\n27) 最常用的搜索算法之一是快速搜索算法。\n28) 一种搜索算法被称为堆算法。\n29) 线性（或顺序）搜索算法的工作方式如下：它可以检查数组的最后一个元素是否等于给定值，然后检查倒数第二个元素，依此类推，直到到达数组开头或找到给定的值。\n\
  30) 线性搜索算法在某些情况下可以比二分搜索算法更快地找到元素。\n31) 线性搜索算法可以用于大规模数据操作。\n32) 线性搜索算法不能用于已排序的数组。\n\
  33) 二分搜索算法可以用于大规模数据操作。\n34) 如果数组包含多次出现的值，二分搜索算法只能找到给定值的按顺序的第一次出现。\n35) 使用搜索算法时，如果数组包含唯一值且找到了你寻找的元素，则没有需要进一步检查。\n\
  36) 二分搜索算法的主要缺点是数据需要经过排序。\n37) 二分搜索算法只能用于包含算术值的数组。\n38) 如果你寻找的元素在数组的最后一个位置，从数组开始搜索的线性搜索算法将检查数组中的所有元素。\n\
  39) 线性搜索算法可以用于二维数组。\n40) 如果使用二分搜索算法寻找的元素位于至少有三个元素的数组的第一个位置，它将在一次迭代中被找到。\n\n## 34.8\
