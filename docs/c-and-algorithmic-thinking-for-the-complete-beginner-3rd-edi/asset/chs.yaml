  # 字符串处理\n\n### 14.1 引言\n\n通常来说，字符串是任何你可以输入的内容，包括字母、符号（如 `*`）和数字。在 C++ 中，字符串始终包含在双引号中。下面是一个使用字符串的\
  \ C++ 程序。\n\n`a = \"Everything enclosed in double quotes\";`\n`cout << a << endl;`\n\
  `b = \"3, 4, 5\";`\n`cout << b << endl;` \n\n程序经常处理以字符串形式出现的数据。字符串无处不在——从文字处理器到网络浏览器。书中的许多练习都使用了字符串。尽管\
  \ C++ 支持许多函数，但本章仅涵盖必要的函数。如果你需要更多信息，可以访问以下地址：\n\n- `https://tinyurl.com/ymew8dc`\n\
  - `https://cplusplus.com/reference/string/`\n\n![Image](img/chapter14-01.png) \n\
  \n### 14.2 字符在字符串中的位置\n\n让我们在示例中使用“Hello World”文本。该字符串包含 11 个字符（包括单词之间的空格）。C++ 假设第一个字符位于位置\
  \ 0，第二个位于位置 1，依此类推。这里显示了每个字符的位置。\n\n![Image](img/chapter14-02.png)\n\n### 14.3 有用的字符串函数/方法与其他\n\
  \n### 修剪 (Trimming)\n\n修剪是从字符串开头或结尾移除空白字符的过程。例如，你可以修剪用户在字符串末尾输入的空格。用于修剪字符串的函数是：\n\
  \n`trim_copy(subject)`\n\n该函数返回 `subject` 的副本，其中字符串开头和结尾的任何空白字符都被移除。\n\n```cpp\n\
  #include <iostream>\n#include <boost/algorithm/string.hpp>\nusing boost::algorithm;\n\
  using namespace std;\nint main() {\n    string a, b;\n    a = \" Hello\";\n    b\
  \ = trim_copy(a);\n    cout << b << \" Poseidon!\" << endl; // 显示：Hello Poseidon!\n\
  \    cout << a << \" Poseidon!\" << endl; // 显示：  Hello   Poseidon!\n    return\
  \ 0;\n}\n```\n\n`trim_copy()` 函数定义在 boost 库中。C++ 无法直接访问，因此你需要包含 boost 库的 `string.hpp`\
  \ 文件。注意变量 `a` 的内容没有改变。如果你确实需要更改它的内容，一种解决方案是使用语句 `a = trim_copy(a);`。\n\n#### 字符串替换\n\
  \n`replace_all_copy(subject, search, replace)`\n\n该函数在 `subject` 中搜索并返回其副本，其中所有出现的\
  \ `search` 字符串都被替换为 `replace` 字符串。\n\n示例\n\n\n\n\n\n![](img/my_exercise_header.png)\
  \ project_14.3\n\n```cpp\n#include <iostream>\n#include <boost/algorithm/string.hpp>\n\
  using namespace boost::algorithm;\nusing namespace std;\nint main() {\n    string\
  \ a, b;\n    a = \"I am newbie in Java. Java rocks!\";\n    b = replace_all_copy(a,\
  \ \"Java\", \"C++\");\n    cout << b << endl;    //输出为: I am newbie in C++. C++\
  \ rocks\n    cout << a << endl;    //输出为: I am newbie in Java. Java rocks\n    return\
  \ 0;\n}\n```\n\n![](img/notice.jpg)函数 `replace_all_copy()` 定义在 `boost` 库中。它在 C++\
  \ 中无法直接访问，因此你需要包含 `boost` 库中的 `string.hpp` 文件。\n\n![](img/notice.jpg)注意变量 `a` 的内容没有被修改。如果你确实修改它的内容，一种解决方案是使用语句\
  \ `a = replace_all_copy(a, \"Java\", \"C++\");`。\n\n## 统计字符数量\n\n`subject.length()`\n\
  \n该方法返回 `subject` 的长度，换句话说，就是 `subject` 包含字符的数量。\n\n### 示例\n\n![](img/my_exercise_header.png)\
  \ project_14.3c\n\n```cpp\n#include <iostream>\nusing namespace std;\nint main()\
  \ {\n    string a, b;\n    int k;\n    a = \"Hello Olympians!\";\n    cout << a.length()\
  \ << endl;   //输出为: 16\n    k = a.length();\n    cout << k << endl;            //输出为:\
  \ 16\n    return 0;\n}\n```\n\n![](img/remember.jpg)字符包含任何可以使用键盘输入的字符，例如字母、符号、数字和空格字符。\n\
  \n![](img/notice.jpg)注意 `length()` 是一个方法。你将在第八部分学习更多关于方法的知识。\n\n## 查找字符串位置\n\n`subject.find(search)`\n\
  \n该方法返回 `search` 在 `subject` 中首次出现的数字位置，如果未找到 `search`，则返回 −1。\n\n### 示例\n\n![](img/my_exercise_header.png)\
  \ project_14.3d\n\n```cpp\n#include <iostream>\nusing namespace std;\nint main()\
  \ {\n    int i;\n    string a;\n    a = \"I am newbie in C++. C++ rocks!\";\n  \
  \  i = a.find(\"newbie\");\n    cout << i << endl;                    //输出为: 5\n\
  \    cout << a.find(\"C++\") << endl;        //输出为: 15\n    cout << (int)a.find(\"\
  Java\") << endl;  //输出为: -1\n    return 0;\n}\n```\n\n![](img/notice.jpg)注意 `find()`\
  \ 是一个方法。你将在第八部分学习更多关于方法的知识。\n\n![](img/remember.jpg)第一个字符位于位置 0。\n\n### 转换为小写\n\n\
  `to_lower_copy(subject)`\n\n该函数返回 `subject` 的副本，其中字符串 `subject` 中的所有字母都被已转换为小写。\n\
  \n### 示例\n\n![](img/my_exercise_header.png) project_14.3e\n\n```cpp\n#include <iostream>\n\
  #include <boost/algorithm/string.hpp>\nusing namespace boost::algorithm;\nusing\
  \ namespace std;\nint main() {\n    string a, b;\n    a = \"My NaMe is JohN\";\n\
  \    b = to_lower_copy(a);\n    cout << b << endl;    //输出为: my name is john\n \
  \   cout << a << endl;    //输出为: My NaMe is JohN\n    return 0;\n}\n```\n\n![](img/notice.jpg)函数\
  \ `to_lower_copy()` 定义在 `boost` 库中。它在 C++ 中无法直接访问，因此你需要包含 `boost` 库中的 `string.hpp`\
  \ 文件。\n\n![](img/notice.jpg)注意变量 `a` 的内容没有被修改。如果你确实修改它的内容，一种解决方案是使用语句 `a = to_lower_copy(a);`。\n\
  \n### 转换为大写\n\n`to_upper_copy(subject)`\n\n该函数返回 `subject` 的副本，其中字符串 `subject` 中的所有字母都被已转换为大写。\n\
  \n### 示例\n\n![](img/my_exercise_header.png) project_14.3f\n\n```cpp\n#include <iostream>\n\
  #include <boost/algorithm/string.hpp>\nusing namespace boost::algorithm;\nusing\
  \ namespace std;\nint main() {\n    string a, b;\n    a = \"My NaMe is JohN\";\n\
  \    b = to_upper_copy(a);\n    cout << b << endl;    //输出为: MY NAME IS JOHN\n \
  \   cout << a << endl;    //输出为: My NaMe is JohN\n    return 0;\n}\n```\n\n![](img/notice.jpg)函数\
  \ `to_upper_copy()` 定义在 `boost` 库中。它在 C++ 中无法直接访问，因此你需要包含 `boost` 库中的 `string.hpp`\
  \ 文件。\n\n![](img/notice.jpg)注意变量 `a` 的内容没有被修改。如果你确实修改它的内容，一种解决方案是使用语句 `a = to_upper_copy(a);`。\n\
  \n## 从字符串中获取单个字符\n\n`subject[index]`\n\n这种表示法返回位于 `subject` 指定索引的字符。如前，字符串索引从 0\
  \ 开始。你可以使用索引 0 访问第一个字符，索引 1 访问第二个字符，以此类推。最后一个字符的索引是字符串长度减 1。\n\n![](img/notice.jpg)`subject[index]`\
  \ 表示法被称为“子字符串表示法”。子字符串表示法让你引用字符串中的单个字符。\n\n### 示例\n\n![](img/my_exercise_header.png)\
  \ project_14.3g\n\n```cpp\n#include <iostream>\nusing namespace std;\nint main()\
  \ {\n    string a;\n    a = \"Hello World\";\n    cout << a[0] << endl; //输出第一个字母:\
  \ H\n    cout << a[6] << endl; //输出: W\n    cout << a[10] << endl; //输出: d\n   \
  \ return 0;\n}\n```\n\n![](img/notice.jpg)注意单词“Hello”和“World”之间的空格也被视为一个字符。因此 W\
  \ 位于位置 6 而不是 5。\n\n![](img/remember.jpg)字符串索引必须在 0 到长度减 1 的范围内。\n\n### 获取字符串的一部分\n\
  \n`subject.substr(beginIndex [, length])`\n\n该方法返回 `subject` 的部分。具体而言，它从位置 `beginIndex`\
  \ 开始，返回长度为 `length` 的子字符串，或者直到 `subject` 的结束，以先到的为准。`length` 参数是可选的。如果省略，则返回从位置\
  \ `beginIndex` 开始到 `subject` 结束的子字符串。\n\n### 示例\n\n![](img/my_exercise_header.png)\
  \ project_14.3h\n\n```cpp\n#include <iostream>\nusing namespace std;\nint main()\
  \ {\n    string a;\n    a = \"Hello Athena\";\n    cout << a.substr(6, 3) << endl;\
  \   //输出: Ath\n    cout << a.substr(6, 4) << endl;   //输出: Athen\n    cout << a.substr(7)\
  \ << endl;      //输出: then\n    return 0;\n}\n```\n\n![](img/notice.jpg)注意 `substr()`\
  \ 是一个方法。你将在第八部分学习更多关于方法的知识。\n\n## 将数字转换为字符串\n\n`to_string(subject)`\n\n该函数返回 `subject`\
  \ 的字符串版本，换句话说，它将数字（实数或整数）转换为字符串。\n\n### 示例\n\n```cpp\n#include <iostream>\nusing\
  \ namespace std;\nint main() {\n    string a;\n    double b = 4.12345;\n    a =\
  \ to_string(b);\n    cout << a << endl;    //输出为: 4.12345\n    int c = 12;\n   \
  \ int d = 34;\n    cout << c + d << endl;             //输出为: 46\n    cout << to_string(c)\
  \ + to_string(d) << endl; //输出为: 1234\n    return 0;\n}\n```\n\n\n\n\n在视觉上区分名字和姓氏的字符是它们之间的空格字符。问题在于，这个字符并不总是位于位置\
  \ 3。有些人的名字很短，比如“Tom”，而有些人的名字则较长，比如“Robert”。因此，你需要一种能够忽略字符串内容、实际找到空格字符位置的方法。\n\n\
  `find()` 函数正是你所寻找的！如果你用它来查找字符串“Tom Smith”中空格字符的位置，它会返回值 3。但如果你用它来查找另一个字符串（例如“Angelina\
  \ Brown”）中的空格字符，它返回的是值 8。\n\n![](img/notice.jpg)\n值 3 不仅仅是空格字符所在的位置。它代表了单词“Tom”包含的字符数！对于字符串“Angelina\
  \ Brown”返回的值 8 也是如此。它既代表了空格存在的位置，也代表了单词“Angelina”包含的字符数！\n\n这里是该算法的 C++ 程序。\n\n\
  ![](img/my_exercise_header.png) project_14.3\n```cpp\n#include <iostream>\nusing\
  \ namespace std;\nint main() {\n    string fullName, name1, name2;\n    int spacePos;\n\
  \    cout << \"Enter your full name: \";\n    getline(cin, fullName);\n    //Find\
  \ the position of space character. This is also the number\n    //of characters\
  \ first name contains\n    spacePos = fullName.find(\"  \");\n    //Get spacePos\
  \ number of characters starting from position 0\n    name1 = fullName.substr(0,\
  \ spacePos);\n    // Get the rest of the characters starting from position spacePos\
  \ + 1\n    name2 = fullName.substr(spacePos + 1);\n    fullName = name2 + \"  \"\
  \ + name1;\n    cout << fullName << endl;\n    return 0;\n}\n```\n\n![](img/remember.jpg)\n\
  `cin`语句在从键盘读取字符串时会将空格视为终止字符。因此，使用 `cin` 读取字符串意味着总是读取单个单词，而不是短语或整个句子。要读取两个或多个单词，可以使用\
  \ `getline()` 函数。\n\n![](img/remember.jpg)\n函数 `subject.substr(beginIndex, length)`\
  \ 返回 `subject` 的一部分。具体来说，它从位置 `beginIndex` 开始，并返回一个长度为 `length` 的子字符串。\n\n![](img/notice.jpg)\n\
  注意，此程序无法适用于西班牙语名字，例如“Maria Teresa García Ramírez de Arroyo”。原因显而易见！\n\n### 练习题 14.3-3\
  \ 创建登录 ID\n\n编写一个 C++ 程序，提示用户输入姓氏，然后根据名字的前四个字母（小写）和一个三位随机整数创建一个登录 ID。\n\n### 题答案\n\
  \n要创建一个随机整数，你可以使用 `rand()` 函数。由于你需要一个三位的随机整数，范围必须在 100 到 999 之间。\n\n这里是该算法的 C++\
  \ 程序。\n\n![](img/my_exercise_header.png) project_14.3-3\n```cpp\n#include <iostream>\n\
  #include <ctime>\n#include <cstdlib>\n#include <boost/algorithm/string.hpp>\nusing\
  \ namespace boost::algorithm;\nusing namespace std;\nint main() {\n    int randomInt;\n\
  \    string lastName;\n    srand(time(NULL));\n    cout << \"Enter last name: \"\
  ;\n    cin >> lastName;\n    //Get random integer between 100 and 999\n    randomInt\
  \ = 100 + rand() % 900;\n    cout << to_lower_copy(lastName.substr(0, 4)) << randomInt\
  \ << endl;\n    return 0;\n}\n```\n\n![](img/remember.jpg)\n你可以将一个子程序嵌套另一个程序内部。注意\
  \ `substr()` 方法是如何嵌套在 `to_lower_copy()` 函数中的。内部（嵌套）方法的结果被用作外部函数的参数。\n\n### 练习题 14.3-4\
  \ 创建随机单词\n\n编写一个 C++ 程序，显示一个由三个字母组成的随机单词。\n\n### 题答案\n\n要创建一个随机单词，你需要一个包含英语字母表中所有\
  \ 26 个字母的字符串。然后你可以使用 `rand()` 函数在位置 0 到 25 之间随机选择一个字母。。\n\n这里是该算法的 C++ 程序。\n\n![](img/my_exercise_header.png)\
  \ project_14.3-4a\n```cpp\n#include <iostream>\n#include <ctime>\n#include <cstdlib>\n\
  using namespace std;\nint main() {\n    string alphabet;\n    srand(time(NULL));\n\
  \    alphabet = \"abcdefghijklmnopqrstuvwxyz\";\n    cout << alphabet[rand() % 26]\
  \ << alphabet[rand() % 26] << alphabet[rand() % 26] << endl;\n    return 0;\n}\n\
  ```\n\n![](img/notice.jpg)\n注意函数 `rand()` 被调用了三次，每次都可能返回一个不同的随机数。\n\n你也可以使用 `length()`\
  \ 方法来获取字符串 `alphabet` 的长度，如下所示。\n\n![](img/my_exercise_header.png) project_14.3-4b\n\
  ```cpp\n#include <iostream>\n#include <ctime>\n#include <cstdlib>\nusing namespace\
  \ std;\nint main() {\n    string alphabet;\n    srand(time(NULL));\n    alphabet\
  \ = \"abcdefghijklmnopqrstuvwxyz\";\n    cout << alphabet[rand() % alphabet.length()]\
  \ <<\n    alphabet[rand() % alphabet.length()] <<\n    alphabet[rand() % alphabet.length()]\
  \ << endl;\n    return 0;\n}\n```\n\n### 练习题 14.3-5 寻找数字位之和\n\n编写一个 C++ 程序，提示用户输入一个三位整数，然后计算其数字位之和。在不使用整数取余（`%`）运算符的情况下解决此练习题。\n\
  \n### 题答案\n\n现在你可能疑惑为什么这个练习题被放在这一章（这一章主要关注字符串操作）。你可能会认为你已经知道了如何将一个三位整数拆分为三个数字，并将每个数字分配给单独的变量，就像你在第\
  \ 13 章中使用除法（`/`）和整数取余（`%`）运算符学习的那样。那么，为什么要在这里讨论这个练习题呢？\n\n原因是 C++ 是一种非常强大的语言，你可以利用它的魔法以完全不同的方式解决这个练习题。主要思想是将用户提供的整数转换为\
  \ `string` 类型，并将每个数字（每个字符）分配给各个变量。\n\n![](img/my_exercise_header.png) project_14.3-5\n\
  ```cpp\n#include <iostream>\nusing namespace std;\nint main() {\n    int number,\
  \ total;\n    string sNumber, digit1, digit2, digit3;\n    cout << \"Enter an three-digit\
  \ integer: \";\n    cin >> number;\n    sNumber = to_string(number);  //Convert\
  \ number to string\n    digit1 = sNumber[0];  //Assign character at position 0 (and\
  \ convert to string)\n    digit2 = sNumber[1];  //Assign character at position 1\
  \ (and convert to string)\n    digit3 = sNumber[2];  //Assign character at position\
  \ 2 (and convert to string)\n    total = stoi(digit1) + stoi(digit2) + stoi(digit3);\n\
  \    cout << total << endl;\n    return 0;\n}\n```\n\n![](img/notice.jpg)\n由于变量\
  \ `digit1`、`digit2` 和 `digit3` 的类型是 `string`，在变量 `total` 中寻找它们的和之前，你需要使用 `stoi()`\
  \ 函数将它们转换为整数。\n\n### 14.4 复习题：对/错\n\n请判断以下每个陈述的对或错。\n\n\n\n\n\n1) 字符串是任何你可以使用键盘输入的任何内容。\n\
