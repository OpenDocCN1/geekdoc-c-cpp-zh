  | 3 | `if (a > 100)` | 51 | 5 |\n| 4 | `y = a * 4` | 51 | 204 |\n| 5 | `cout <<\
  \ a << \" \" << y` | 51 | 204 |\n\n#### 练习 16.1-2 数字的绝对值\n\n设计一个流程图并编写相应的 C++ 程序，让用户输入一个数字然后显示其绝对值。\n\
  \n解答：\n\n实际上有两种方法。第一种方法使用单分支决策结构，而第二种使用内置的 `abs()` 函数。\n\n#### 第一种方法——使用单分支决策结构\n\
  \n该方法很简单。如果用户输入负值（例如 −5），该值将被改变并显示为 +5。然而，正数或零则保持不变。解决方案如后续流程图所示。\n\n![Image](img/chapter16-03.png)\n\
