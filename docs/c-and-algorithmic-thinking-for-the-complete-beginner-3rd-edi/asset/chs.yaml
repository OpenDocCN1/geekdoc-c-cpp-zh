  \ 3;\n```\n\n操作执行顺序如下：\n\n![Image](img/chapter07-11.png)\n\n7.6 字符串运算符\n\n将两个独立的字符串合并成一个被称为拼接。有两个运算符可以使用你来拼接（连接）字符串，如下表所示。\n\
  \n| 运算符 | 描述 | 示例 | 等于 |\n| --- | --- | --- | --- |\n| + | 拼接 | `a = \"Hi\" + \"\
  \ there\";` | |\n| += | 拼接赋值 | `a += \"Hello\";` | `a = a + \"Hello\";` |\n\n以下代码片段显示“What's\
  \ up, dude?”\n\n```cpp\nstring a, b, c;\na = \"What's \";\nb = \"up, \";\nc = a\
  \ + b;\nc += \"dude?\";\ncout << c << endl;\n```\n\n### 练习 7.6-1 拼接姓名\n\n编写一个 C++\
  \ 程序提示用户输入名和姓（赋值两个不同的变量）。然后将它们合并成一个字符串（拼接）并显示在用户的屏幕上。\n\n**解**\n\nC++ 程序如下所示。\n\n\
  ```cpp\n#include <iostream>\nusing namespace std;\nint main() {\n    string firstName,\
  \ lastName, fullName;\n    cout << \"Enter first name: \";\n    cin >> firstName;\n\
  \    cout << \"Enter last name: \";\n    cin >> lastName;\n    fullName = firstName\
  \ + \"  \" + lastName;\n    cout << fullName << endl;\n    return 0;\n}\n```\n\n\
