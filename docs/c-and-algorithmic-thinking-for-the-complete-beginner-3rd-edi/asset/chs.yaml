  \n## 第 30 章 循环结构的进阶\n\n### 30.1 循环结构的简单练习\n\n#### 练习 30.1-1 根据大小计数\n\n编写一个 C++ 程序，提示用户输入\
  \ 10 对数字，然后统计并显示用户提供的第一个数字大于第二个数字的次数，以及第二个数字大于第一个数字的次数。\n\n解答\n\nC++ 程序如下。它使用变量\
  \ `countA` 计数第一个提供的数字大于第二个数字的次数，使用变量 `countB` 计数第二个数字大于第一个数字的次数。\n\n![](img/my_exercise_header.png)\n\
  ```cpp\nproject_30.1-1\n#include <iostream>\nusing namespace std;\nint main() {\n\
  \    int countA, countB, i, a, b;\n    countA = 0;\n    countB = 0;\n    for (i\
  \ = 1; i <= 10; i++) {\n        cout << \"Enter number A: \";\n        cin >> a;\n\
  \        cout << \"Enter number B: \";\n        cin >> b;\n        if (a > b) {\n\
  \            countA++;\n        }\n        else if (b > a) {\n            countB++;\n\
  \        }\n    }\n    return 0;\n}\n```\n\n\n\n\n\n```cpp\ncout << countA << \"\
  \  \" << countB << endl;return 0;}\n```\n\n人们可能会提出的合理问题是：“为什么要使用多分支控制结构？为什么不使用二选一决策结构呢？”\n\
  \n假设确实使用了二选一决策结构，如下所示：\n\n```cpp\nif (a > b) {countA++;}else {countB++;}\n```\n\n\
  在这个决策控制结构中，当变量 `b` 大于变量 `a` 时，变量 `countB` 会增加（这是符合预期的），但当变量 `b` 等于变量 `a` 时，它也会增加（这是不符合预期的）。相比之下，使用多分支控制结构可以确保变量\
  \ `countB` 仅在变量 `b` 大于变量 `a` 时（而不是在等于 `a` 时）才增加。\n\n### 练习题 30.1-2 根据数字位数计数数字\n\n\
  编写一个 C++ 程序，提示用户输入 20 个整数，然后统计并显示一位数、两位数和三位数整数的总数。假设用户输入的值在 1 到 999 之间。\n\n#####\
  \ 答案\n\n利用练习 18.1-2 中的知识，该 C++ 程序如下。\n\n![](img/my_exercise_header.png) project_30.1-2\n\
  ```cpp\n#include <iostream>\nusing namespace std;\nint main() {\n    int count1,\
  \ count2, count3, i, a;\n    count1 = count2 = count3 = 0;\n    for (i = 1; i <=\
  \ 20; i++) {\n        cout << \"Enter a number: \";\n        cin >> a;\n       \
  \ if (a <= 9) {\n            count1++;\n        } else if (a <= 99) {\n        \
  \    count2++;\n        } else {\n            count3++;\n        }\n    }\n    cout\
  \ << count1 << \"  \" << count2 << \"  \" << count3 << endl;\n    return 0;\n}\n\
  ```\n\n### 练习题 30.1-3 有多少数字能凑入和中\n\n编写一个 C++ 程序，让用户重复输入数值，直到它们的和超过 1000。程序结束时必须显示输入的数字总数。\n\
  \n##### 答案\n\n在这种情况下，由于确切的迭代次数未知，无法使用定次数循环；需要使用不确定循环。让我们使用预测试循环来创建该循环。然而，为了确保程序没有逻辑错误，遵循在第\
  \ 29.3 节中讨论的“Ultimate”规则至关重要。根据该规则，预测试循环的结构如下（通用形式）：\n\n```cpp\n初始化 total\nwhile\
  \ (total <= 1000) {\n    一条语句或语句块\n    更新/修改 total\n}\n```\n\n由于循环的布尔表达式依赖于变量 `total`，因此该变量必须在循环开始前初始化，并在循环内部进行更新（修改）。更具体地说，更新/修改变量\
  \ `total` 的语句必须是循环的最后一条语句。随后，C++ 程序变为：\n\n![](img/my_exercise_header.png) project_30.1-3\n\
  ```cpp\n#include <iostream>\nusing namespace std;\nint main() {\n    int count;\n\
  \    double total, x;\n    count = 0;\n    total = 0; // 初始化 total\n    while (total\
  \ <= 1000) { // 布尔表达式依赖于 total\n        cin >> x;\n        count++;\n        total\
  \ += x; // 更新/修改 total\n    }\n    cout << count << endl;\n    return 0;\n}\n```\n\
  \n### 练习题 30.1-4 寻找正整数的总数\n\n编写一个 C++ 程序，提示用户重复输入整数值，直到输入一个实数为止。程序结束时，必须显示输入的正整数总数。\n\
  \n##### 答案\n\n再次，你不知道确切的迭代次数，因此无法使用 for 循环。\n\n根据“Ultimate”规则，预测试循环的结构如下（通用形式）：\n\
  \n```cpp\ncout << \"Enter a number: \"; cin >> x; // 初始化 x\nwhile (( (int)(x) ==\
  \ x ) { // 布尔表达式依赖于 x\n    一条语句或语句块\n    cout << \"Enter a number: \"; cin >> x;\
  \ // 更新/修改 x\n}\n```\n\n最终的 C++ 程序如下。\n\n![](img/my_exercise_header.png) project_30.1-4\n\
  ```cpp\n#include <iostream>\nusing namespace std;\nint main() {\n    double x;\n\
  \    int count;\n    count = 0;\n    cout << \"Enter a number: \"; cin >> x;\n \
  \   while ((int)(x) == x) {\n        if (x > 0) {\n            count++;\n      \
  \  }\n        cout << \"Enter a number: \";\n        cin >> x;\n    }\n    cout\
  \ << count << endl;\n    return 0;\n}\n```\n\n![](img/notice.jpg)注意，即使用户提供的第一个数字是实数（浮点数），程序也能正常运行；预测试循环结构确保了执行流永远不会因为实数进入循环！\n\
  \n### 练习题 30.1-5 按用户意愿次数\n\n编写一个 C++ 程序，提示用户输入两个数字，然后计算并显示第一个数字的第二个数字的幂。程序必须根据用户的意愿进行多次迭代。在每次计算结束后，程序必须提示用户是否希望再次计算。如果答案是“yes”（是），程序必须重复；否则必须结束。让你的程序接受所有可能的答案形式，如“yes”、“YES”、“Yes”甚至“YeS”。\n\
  \n答案\n\n根据“Ultimate”规则，预测试循环的结构如下（通用形式）：\n\n```cpp\nanswer = \"YES\"; // 初始化 answer\n\
  while (to_upper_copy(answer) == \"YES\") {\n    提示用户输入两个数字，然后计算并显示第一个数字的第二个数字的幂。\n\
  \    cout << \"Would you like to repeat? \";\n    cin >> answer; // 更新/修改 answer\n\
  }\n```\n\n![](img/notice.jpg)`to_upper_copy()` 函数确保了程序对于用户提供的任何答案都能正常运行：“yes”、“YES”、“Yes”甚至“YeS”或“yEs”！\n\
  \n然而，这次我们不使用预测试循环结构，而是采用后测试循环结构。更好的方法，因为可以省略循环外的答案变量初始化。与预测试循环结构不同，执行流无论如何都会进入循环，而答案的初始化将在后测试循环内部完成，如下代码片段（通用形式）所示。\n\
  \n```cpp\ndo {\n    提示用户输入两个数字，然后计算并显示第一个数字的第二个数字的幂。\n    cout << \"Would you like\
  \ to repeat? \";\n    cin >> answer; // 初始化并更新/修改 answer\n} while (to_upper_copy(answer)\
  \ == \"YES\");\n```\n\n该练习题的答案变为：\n\n![](img/my_exercise_header.png) project_30.1-5\n\
  ```cpp\n#include <iostream>\n#include <cmath>\n#include <boost/algorithm/string.hpp>\n\
  using namespace boost::algorithm;\nusing namespace std;\nint main() {\n    int a,\
  \ b;\n    double result;\n    string answer;\n    do {\n        cout << \"Enter\
  \ two numbers: \" << endl;\n        cin >> a >> b;\n        result = pow(a, b);\n\
  \        cout << \"The result is: \" << result << endl;\n        cout << \"Would\
  \ you like to repeat? \";\n        cin >> answer;\n    } while (to_upper_copy(answer)\
  \ == \"YES\");\n    return 0;\n}\n```\n\n### 练习题 30.1-6 寻找数字之和\n\n编写一个 C++ 程序，让用户输入一个整数，然后计算其数字之和。\n\
  \n答案\n\n在练习 13.1-2 中，你学习了如何在已知总位数的情况下拆分整数的数字。但在本练习中，用户允许输入任何值，无论大小。因此，数字的总数是一个未知数量。\n\
  \n#### 方法一\n\n在这种方法中，核心思想是在每次迭代中分离出一个数字。然而，挑战在于确定所需的迭代次数，因为它取决于用户提供的整数的大小。那么，这会构成障碍吗？当然不会！\n\
  \n在循环内部，用户提供的整数应该不断减少，直到它最终变为零。这个零值可以作为停止循环控制结构迭代的条件。让我们尝试通过以下流程图理解所提的解决方案。某些语句以通用形式编写。\n\
  \n\n\n\n\n![Image](img/chapter30-01.png)\n\n# 语句\n\n`digit ← 提取变量 x 的最后一位数字.`\n\n\
  可以使用众知的 `MOD 10` 操作来编写，如下所示。\n\n`digit ← x MOD 10`\n\n然而，整个概念依赖于以下语句：\n\n`x ← 保留变量\
  \ x 除最后一位数字以外的所有数字.`\n\n该语句最终会将变量 `x` 的值置零，然后执行流退出循环。要编写该语句，你可以可以使用所示的 `DIV 10`\
  \ 操作。\n\n`x ← x DIV 10`\n\n因此，C++ 程序变如下：\n\n![](img/my_exercise_header.png) project_30.1-6a\n\
  ```cpp\n#include <iostream>\nusing namespace std;\nint main() {\n    int x, s, digit;\n\
  \    cin >> x;\n    s = 0;\n    while (x != 0) {\n        digit = x % 10;      //这就是\
  \ x MOD 10 操作\n        s = s + digit;\n        x = (int)(x / 10);   //这就是 x DIV\
  \ 10 操作\n    }\n    cout << s << endl;\n    return 0;\n}\n```\n\n让我们为输入值 `4753`\
  \ 创建一个追踪表，以更好地理解到底发生了什么。\n\n| 步骤 | 语句 | Notes | x | digit | s |\n| --- | --- | ---\
  \ | --- | --- | --- |\n| 1 | `cin >> x` | 用户输入值 4753 | 4753 | ? | ? |\n| 2 | `s\
  \ = 0` | | 4753 | ? | 0 |\n| 3 | `while (x != 0)` | 结果为真 | | | |\n| 4 | `digit =\
  \ x % 10` | | 4753 | 3 | 0 |\n| 5 | `s = s + digit` | | 4753 | 3 | 3 |\n| 6 | `x\
  \ = (int)(x / 10)` | | 475 | 3 | 3 |\n| 7 | `while (x != 0)` | 结果为真 | | | |\n| 8\
  \ | `digit = x % 10` | | 475 | 5 | 3 |\n| 9 | `s = s + digit` | | 475 | 5 | 8 |\n\
  | 10 | `x = (int)(x / 10)` | | 47 | 5 | 8 |\n| 11 | `while (x != 0)` | 结果为真 | |\
  \ | |\n| 12 | `digit = x % 10` | | 47 | 7 | 8 |\n| 13 | `s = s + digit` | | 47 |\
  \ 7 | 15 |\n| 14 | `x = (int)(x / 10)` | | 4 | 7 | 15 |\n| 15 | `while (x != 0)`\
  \ | 结果为真 | | | |\n| 16 | `digit = x % 10` | | 4 | 4 | 15 |\n| 17 | `s = s + digit`\
  \ | | 4 | 4 | 19 |\n| 18 | `x = (int)(x / 10)` | | 0 | 4 | 19 |\n| 19 | `while (x\
  \ != 0)` | 结果为假 | | | |\n| 20 | `cout << s << endl` | 显示为: 19 | | | |\n\n![](img/remember.jpg)在\
  \ C++ 中，两个整数除法的结果始终是一个整数。因此，在语句 `x = (int)(x / 10)` 中，由于变量 `x` 和常量值 `10` 都是整数，`(int)`\
  \ 强制类型转换符是多余的。然而，为了提高可读性，保留它也是一种良好的做法。\n\n### 第二种方法\n\n在这种方法中，核心思想是将用户提供的整数转换为字符串，然后使用\
  \ `for`循环遍历其所有字符（数字）。然而，在 `for`循环中，你需要在先将每个数字从 `char` 类型转换回 `int` 类型，然后将其累加到变量 `s`\
  \ 中。C++ 程序如下。\n\n![](img/my_exercise_header.png) project_30.1-6b\n```cpp\n#include\
  \ <iostream>\nusing namespace std;\nint main() {\n    int i, x, s;\n    string xStr,\
  \ digit;\n    cin >> x;\n    xStr = to_string(x);  //将用户输入转换为字符串\n    s = 0;\n \
  \   for (i = 0; i <= xStr.length() - 1; i++) {\n        digit = xStr[i];  //获取字符串形式的“数字”\n\
  \        s = s + stoi(digit);\n    }\n    cout << s << endl;\n    return 0;\n}\n\
  ```\n\n### 30.2 嵌套循环控制结构的练习\n\n#### 练习 30.2-1 显示所有包含给定数字的三位整数\n\n编写一个 C++ 程序，提示用户输入一个数字（0\
  \ 到 9），然后显示所有至少包含该用户提供数字的三位整数。例如，对于用户提供的值 7，357、771 和 700 都是这样的整数。\n\n解决方案\n\n有三种不同的方法！第一种仅使用一个\
  \ `for`循环，第二种使用三个嵌套的 `for`循环，最后一种将所有三位整数转换为字符串。让我们分析一下所有方法！\n\n###### 第一种方法——使用\
  \ for 循环和决策控制结构\n\n核心思想是使用一个 `for`循环，变量 `counter` 的值从 100 变到 999。在循环内部，将 `counter`\
  \ 变量拆分为各个单独数字（`digit[3]`、`digit[2]`、`digit[1]`），并使用决策控制结构检查其数字中是否至少有一个与提供的数字相等。C++\
  \ 程序如下。\n\n![](img/my_exercise_header.png) project_30.2-1a\n```cpp\n#include <iostream>\n\
  using namespace std;\nint main() {\n    int x, i, digit3, r, digit2, digit1;\n \
  \   cout << \"Enter a digit 0 - 9: \";\n    cin >> x;\n    for (i = 100; i <= 999;\
  \ i++) {\n        digit3 = (int)(i / 100);\n        r = i % 100;\n        digit2\
  \ = (int)(r / 10);\n        digit1 = r % 10;\n        if (digit3 == x || digit2\
  \ == x || digit1 == x) {\n            cout << i << endl;\n        }\n    }\n   \
  \ return 0;\n}\n```\n\n###### 第二种方法——使用嵌套循环控制结构和决策控制结构\n\n这里的核心思想是使用三个嵌套的 `for`循环。在这种情况下，有三个计数变量（`digit3`、`digit2`\
  \ 和 `digit1`），每一个变量都对应三位整数中的一个数字。C++ 程序如下。\n\n![](img/my_exercise_header.png) project_30.2-1b\n\
  ```cpp\n#include <iostream>\nusing namespace std;\nint main() {\n    int x, digit3,\
  \ digit2, digit1;\n    cout << \"Enter a digit 0 - 9: \";\n    cin >> x;\n    for\
  \ (digit3 = 1; digit3 <= 9; digit3++) {\n        for (digit2 = 0; digit2 <= 9; digit2++)\
  \ {\n            for (digit1 = 0; digit1 <= 9; digit1++) {\n                int\
  \ i = digit3 * 100 + digit2 * 10 + digit1;\n                if (digit3 == x || digit2\
  \ == x || digit1 == x) {\n                    cout << i << endl;\n             \
  \   }\n            }\n        }\n    }\n    return 0;\n}\n```\n*(注：此处原文示例代码逻辑似乎存在排版或复制错误，翻译已根据原意保留)*\n\
  \n###### 第三种方法——将所有三位整数转换为字符串\n\n使用 `for`循环，变量 `counter` 的值从 100 变到 999。在循环内部，将计数器转换为字符串，并使用\
  \ `find()` 函数检查用户提供的数字是否存在于字符串中。C++ 程序如下。\n\n![](img/my_exercise_header.png) project_30.2-1c\n\
  ```cpp\n#include <iostream>\nusing namespace std;\nint main() {\n    int i;\n  \
  \  string x;\n    cout << \"Enter a digit 0 - 9: \";\n    cin >> x;\n    for (i\
  \ = 100; i <= 999; i++) {\n        if (to_string(i).find(x) != -1) {\n         \
  \   cout << i << endl;\n        }\n    }\n    return 0;\n}\n```\n\n#### 练习 30.2-2\
  \ 显示符合特定条件的实例\n\n编写一个 C++ 程序，显示所有第一位小于第二位且第二位小于第三位的三位整数。例如，357、456 和 159 是这样的整数。\n\
  \n解决方案\n\n利用从练习 30.2-1 的知识，有三种方法！\n\n###### 第一种方法——使用 for 循环和决策控制结构\n\nC++ 程序如下。\n\
  \n![](img/my_exercise_header.png) project_30.2-2a\n```cpp\n#include <iostream>\n\
  using namespace std;\nint main() {\n    int i, r, digit1, digit2, digit3;\n    for\
  \ (i = 100; i <= 999; i++) {\n        digit3 = (int)(i / 100);\n        r = i %\
  \ 100;\n        digit2 = (int)(r / 10);\n        digit1 = r % 10;\n        if (digit3\
  \ < digit2 && digit2 < digit1) {\n            cout << i << endl;\n        }\n  \
  \  }\n    return 0;\n}\n```\n\n###### 第二种方法——使用嵌套循环控制结构和决策控制结构\n\nC++ 程序如下。\n\n\
  ![](img/my_exercise_header.png) project_30.2-2b\n```cpp\n#include <iostream>\nusing\
  \ namespace std;\nint main() {\n    int digit3, digit2, digit1;\n    for (digit3\
  \ = 1; digit3 <= 9; digit3++) {\n        for (digit2 = 0; digit2 <= 9; digit2++)\
  \ {\n            for (digit1 = 0; digit1 <= 9; digit1++) {\n                int\
  \ i = digit3 * 100 + digit2 * 10 + digit1;\n                if (digit3 < digit2\
  \ && digit2 < digit1) {\n                    cout << i << endl;\n              \
  \  }\n            }\n        }\n    }\n    return 0;\n}\n```\n\n\n\n\n\n![](img/my_exercise_header.png)\
  \ project_30.2-2b\n```cpp\n#include <iostream>\nusing namespace std;\nint main()\
  \ {\n    int digit1, digit2, digit3;\n    for (digit3 = 1; digit3 <= 9; digit3++)\
  \ {\n        for (digit2 = 0; digit2 <= 9; digit2++) {\n            for (digit1\
  \ = 0; digit1 <= 9; digit1++) {\n                if (digit3 < digit2 && digit2 <\
  \ digit1) {\n                    cout << digit3 * 100 + digit2 * 10 + digit1 <<\
  \ endl;\n                }\n            }\n        }\n    }\n    return 0;\n}\n\
  ```\n\n### 第三种方法 – 仅使用嵌套循环控制结构\n\n这种方法基于第二方法。它们的主要区别在于，在这种情况下，变量 `digit1` 总是从大于\
  \ `digit2` 的值开始，而变量 `digit2` 总是从大于 `digit3` 的值开始。这样一来，第一个显示的整数将是 `123`。\n\n![](img/.jpg)在数值\
  \ `123` 和 `789` 之间，没有整数可以使布尔表达式 `digit3 < digit2 && digit2 < digit1` 为真。\n\n该 C++\
  \ 程序如下。\n\n![](img/my_exercise_header.png) project_30.2-2c\n```cpp\n#include <iostream>\n\
  using namespace std;\nint main() {\n    int digit3, digit2, digit1;\n    for (digit3\
  \ = 1; digit3 <= 7; digit3++) {\n        for (digit2 = digit3 + 1; digit2 <= 8;\
  \ digit2++) {\n            for (digit1 = digit2 + 1; digit1 <= 9; digit1++) {\n\
  \                cout << digit3 * 100 + digit2 * 10 + digit1 << endl;\n        \
  \    }\n        }\n    }\n    return 0;\n}\n```\n\n![](img/notice.jpg)这个解决方案是效率最高的，因为它没有使用任何决策控制结构，而且迭代次数被保持在最低！\n\
  \n![](img/remember.jpg)正如你所看到的，一个问题可以有很多解决方案。找到最优解取决于你自己！\n\n### 30.3 使用循环控制结构进行数据验证\n\
  \n如你所知的，数据验证是限制数据输入的过程，强制用户只输入有效值。你已经遇到过一种使用决策控制结构进行数据验证的方法。让我们回顾一个例子。\n\n```cpp\n\
  cout << \"Enter a non-negative number: \";cin >> x;if (x < 0) {\n    cout << \"\
  Error: Negative number entered!\";\n}else {\n    cout << sqrt(x) << endl;\n}\n```\n\
  \n然而，这种方法对用户可能不是最方便的。如果他们输入无效数字，程序会显示错误消息，执行流就会到达结尾。用户必须重新启动程序以输入有效数字。\n\n接下来，你将找到三种通用形式的通过循环控制结构验证数据输入的方法。在用户输入无效值的情况下，主要目标是反复提示，直到他们最终提供有效值。当然，如果用户最初输入了有效值，执行流将直接进入程序的下一个部分。\n\
  \n你使用哪种方法取决于你是否希望显示错误消息，以及你是否希望显示不同的错误消息（每种输入错误类型显示一种），或者只对任何类型的错误显示一个通用错误消息。\n\n\
  #### 第一种方法 – 不带错误消息的数据输入验证\n\n为了在不显示任何错误消息的情况下验证数据输入，可以使用以下通用代码片段。\n\n```cpp\ndo\
  \ {\n    cout << \"Prompt message\";cin >> input_data;\n} while (input_data test\
  \ 1 fails || input_data test 2 fails || …);\n```\n\n#### 第二种方法 – 带有通用错误消息的数据输入验证\n\
  \n为了验证数据输入并显示通用错误消息（即对任何类型的输入错误显示相同的错误消息），可以使用以下通用代码片段。\n\n```cpp\ncout << \"Prompt\
  \ message\";cin >> input_data;\nwhile (input_data test 1 fails || input_data test\
  \ 2 fails || … ) {\n    cout << \"Error message\" << endl;\n    cout << \"Prompt\
  \ message\";cin >> input_data;\n}\n```\n\n#### 第三种方法 – 使用不同错误消息的数据输入验证\n\n为了验证数据输入并为每种输入错误显示不同的错误消息，可以使用以下通用代码片段。\n\
  \n```cpp\ndo {\n    cout << \"Prompt message\";cin >> input_data;\n    failure =\
  \ false;\n    if (input_data test 1 fails) {\n        cout << \"Error message 1\"\
  \ << endl;\n        failure = true;\n    }else if (input_data test 2 fails) {\n\
  \        cout << \"Error message 2\" << endl;\n        failure = true;\n    }else\
  \ if (……)\n} while (failure);\n```\n\n![](img/notice.jpg)语句 `while (failure)` 等同于语句\
  \ `while (failure == true)`。\n\n### 练习 30.3-1 寻找奇偶数 - 不带错误消息的验证\n\n编写一个 C++ 程序，提示用户输入一个非负整数，然后显示一条消息指示该数是否为偶数；否则必须显示“Odd”。使用循环控制结构，程序还必须验证数据输入，允许用户只输入非负整数。\n\
  \n##### 解决方案\n\n你在第 30.3 节 中学习的所有三种验证数据输入的方法将在这里给出。但首先，让我们在不进行数据验证的情况下解决这个练习。\n\n\
  ```cpp\ncout << \"Enter a non-negative integer: \"; cin >> x;if (x % 2 == 0) {\n\
  \    cout << \"Even\" << endl;\n}else {\n    cout << \"Odd\" << endl;\n}\n```\n\n\
  ##### 不带错误消息的验证\n\n为了在不显示任何错误消息的情况下验证数据输入，请使用第 30.3 节中的第一种方法。只需将用虚线框标记的语句替换为以下代码片段。\n\
  \n```cpp\ndo {\n    cout << \"Enter a non-negative integer: \";cin >> x;\n} while\
  \ (x < 0 || (int)x != x);\n```\n\n最终的 C++ 程序变为\n\n![](img/my_exercise_header.png)\
  \ project_30.3-1a\n```cpp\n#include <iostream>\nusing namespace std;\nint main()\
  \ {\n    double x;\n    do {\n        cout << \"Enter a non-negative integer: \"\
  ;cin >> x;\n    } while (x < 0 || (int)x != x);\n    if ((int)x % 2 == 0) {\n  \
  \      cout << \"Even\" << endl;\n    }else {\n        cout << \"Odd\" << endl;\n\
  \    }\n    return 0;\n}\n```\n\n![](img/notice.jpg)变量 `x` 必须声明为 `double`。这是为了允许用户输入整数或浮点数。\n\
  \n##### 带有通用错误消息的验证\n\n为了验证数据输入并显示通用错误消息，请用第 30.3 节中的第二种方法对应的代码片段替换用虚线框标记的语句。该 C++\
  \ 程序如下。\n\n![](img/my_exercise_header.png) project_30.3-1b\n```cpp\n#include <iostream>\n\
  using namespace std;\nint main() {\n    double x;\n    cout << \"Enter a non-negative\
  \ integer: \";\n    cin >> x;\n    while (x < 0 || (int)x != x) {\n        cout\
  \ << \"Error! A negative value or float entered.\" << endl;\n        cout << \"\
  Enter a non-negative integer: \";\n        cin >> x;\n    }\n    if ((int)x % 2\
  \ == 0) {\n        cout << \"Even\" << endl;\n    }else {\n        cout << \"Odd\"\
  \ << endl;\n    }\n    return 0;\n}\n```\n\n##### 带有不同错误消息的验证\n\n在这里，替换的代码片段基于第\
  \ 30.3 节中的第三种方法。为了验证数据输入并为每种输入错误显示不同的错误消息，该 C++ 程序如下。\n\n```cpp\n#include <iostream>\n\
  using namespace std;\nint main() {\n    double x;\n    bool failure;\n    do {\n\
  \        cout << \"Enter a non-negative integer: \";\n        cin >> x;\n      \
  \  failure = false;\n        if (x < 0) {\n            cout << \"Error! You entered\
  \ a negative value\" << endl;\n            failure = true;\n        }else if ((int)x\
  \ != x) {\n            cout << \"Error! You entered a float\" << endl;\n       \
  \     failure = true;\n        }\n    } while (failure);\n    if ((int)x % 2 ==\
  \ 0) {\n        cout << \"Even\" << endl;\n    }else {\n        cout << \"Odd\"\
  \ << endl;\n    }\n    return 0;\n}\n```\n\n### 练习 30.3-2 寻找四个数的之和\n\n编写一个 C++ 程序，提示用户输入四个正数，然后计算并显示它们的和。使用循环控制结构，程序还必须验证数据输入，并在用户输入任何非正值时显示错误消息。\n\
  \n解决方案\n\n\n\n\n此练习已经在 练习 26.1-4 中讨论过。唯一的区别在于，该程序必须对数据输入进行验证，并在用户输入无效值时显示错误消息。为了方便起见，这里还原了该练习中提出的解决方案。\n\
  \n```cpp\ntotal = 0;for (i = 1; i <= 4; i++) {cout << \"Enter a number: \";cin >>\
  \ x;total += x;}cout << total << endl;\n```\n\n此练习的主要目的是演示如何将验证数据输入的循环控制结构嵌套到其他现有的循环控制结构中。在本次练习中，您应该将用虚线矩形标记的语句替换为以下代码段\n\
  \n```cpp\ncout << \"Enter a number: \";cin >> x;while (x <= 0) {cout << \"Please\
  \ enter a positive value!\" << endl;cout << \"Enter a number: \"; cin >> x;}\n```\n\
  \n最终的 C++ 程序将变为：\n\n![](img/my_exercise_header.png) project_30.3-2\n```cpp\n#include\
  \ <iostream>\nusing namespace std;\nint main() {\n    int i;\n    double total,\
  \ x;\n    total = 0;\n    for (i = 1; i <= 4; i++) {\n        cout << \"Enter a\
  \ number: \";\n        cin >> x;\n        while (x <= 0) {\n            cout <<\
  \ \"Please enter a positive value!\" << endl;\n            cout << \"Enter a number:\
  \ \";\n            cin >> x;\n        }\n        total += x;\n    }\n    cout <<\
  \ total << endl;\n    return 0;\n}\n```\n\n![](img/notice.jpg)注意，替换后的代码段完全嵌套在这个外部\
  \ for 循环中。\n\n### 30.4 使用循环控制结构寻找最小值和最大值\n\n在第 23.2 节中，您学习了如何使用单分支决策结构找到四个值中的极值。现在，以下代码段实现了相同的结果，但仅使用变量\
  \ `w` 用于用户提供的值。\n\n```cpp\ncin >> w;   //用户输入第一个值\nmaximum = w;\ncin >> w;   //用户输入第二个值\n\
  if (w > maximum) {maximum = w;}\ncin >> w;   //用户输入第三个值\nif (w > maximum) {maximum\
  \ = w;}\ncin >> w;   //用户输入第四个值\nif (w > maximum) {maximum = w;}\n```\n\n第一对语句外，所有其他语句块都是相同的。因此，您可以仅保留这些对中的一对，并将其封装在一个执行三次迭代的循环控制结构中，如下所示。\n\
  \n```cpp\ncin >> w;   //用户输入第一个值\nmaximum = w;\nfor (i = 1; i <= 3; i++) {\n   \
  \ cin >> w;   //用户输入第二、第三和第四个值\n    if (w > maximum) {\n        maximum = w;\n \
  \   }\n}\n```\n\n当然，如果您想允许用户输入更多值，只需增加 for 循环的 `final_value`。\n\n因此，接下来展示一个寻找并显示\
  \ 10 个人中最重者的程序。\n\n![](img/my_exercise_header.png) project_30.4a\n```cpp\n#include\
  \ <iostream>\nusing namespace std;\nint main() {\n    int w, maximum, i;\n    cout\
  \ << \"Enter a weight (in pounds): \";\n    cin >> w;\n    maximum = w;\n    for\
  \ (i = 1; i <= 9; i++) {\n        cout << \"Enter a weight (in pounds): \";\n  \
  \      cin >> w;\n        if (w > maximum) {\n            maximum = w;\n       \
  \ }\n    }\n    cout << maximum << endl;\n    return 0;\n}\n```\n\n![](img/notice.jpg)注意，for\
  \ 循环的迭代次数比用户提供的值的总数少一次。\n\n尽管这个 C++ 程序运行正常，但让我们尝试一些稍微不同的方法。与其在循环之前提示用户输入第一个值，然后在循环内输入其余九个值，不如让他们在循环内输入所有值。\n\
  \n然而，这里出现的问题是，无论如何，在循环开始迭代之前必须始终给变量 `maximum` 分配一个初始值。但这个值不能任意选择；它取决于给定的问题。因此，选择一个“几乎任意”的初始值需要仔细考虑，因为错误的选择可能会导致不准确的结果。\n\
  \n在本次练习中，所有用户提供的值都与人的体重有关。由于没有可能找到体重为负的人（至少在地球上如此），您可以安全地为变量 `maximum` 分配初始值 `-1`，如下：\n\
  \n![](img/my_exercise_header.png) project_30.4b\n```cpp\n#include <iostream>\nusing\
  \ namespace std;\nint main() {\n    int maximum, i, w;\n    maximum = -1;\n    for\
  \ (i = 1; i <= 10; i++) {\n        cout << \"Enter a weight (in pounds): \";\n \
  \       cin >> w;\n        if (w > maximum) {\n            maximum = w;\n      \
  \  }\n    }\n    cout << maximum << endl;\n    return 0;\n}\n```\n\n一旦执行流进入循环，用户输入第一个值，决策控制结构就会判定为真。变量\
  \ `maximum` 中的初始值 `-1` 然后会被这第一个用户提供的值覆盖，此后执行流将正常进行。\n\n![](img/notice.jpg)注意这种方法可能不适用于所有情况。如果练习要求用户输入任何数字（不限于正数），则无法应用此方法，因为用户可能只输入负值。如果发生这种情况，初始值\
  \ `-1` 将永远不会被任何用户提供的值替换。此方法仅当用户提供的下限已知时才用于寻找最大值。\n\n#### 练习 30.4-1 使用循环控制结构寻找最小值和最大值\n\
  \n编写一个 C++ 程序，提示用户输入 10 个人的体重，然后寻找最轻和最重的。使用循环控制结构，程序还对数据输入进行验证，并在用户输入非正值或大于 1500\
  \ 的值时显示错误消息。\n\n解决方案\n\n通过之前的练习指南，您现在应该能够闭眼完成。为了验证数据输入，您只需要将之前练习中的以下两行代码：\n\n```cpp\n\
  cout << \"Enter a weight (in pounds): \";cin >> w;\n```\n\n替换为以下代码段：\n\n```cpp\n\
  cout << \"Enter a weight (in pounds): \";cin >> w;\nwhile (w < 1 || w > 1500) {\n\
  \    cout << \"Invalid value! Enter a weight between 1 and 1500 (in pounds):\";\n\
  \    cin >> w;\n}\n```\n\n以下是寻找最轻和最重的最终程序。\n\n![](img/my_exercise_header.png) project_30.4-1\n\
  ```cpp\n#include <iostream>\nusing namespace std;\nint main() {\n    int minimum,\
  \ maximum, i, w;\n    minimum = 1500;\n    maximum = 0;\n    for (i = 1; i <= 10;\
  \ i++) {\n        cout << \"Enter a weight (in pounds): \";\n        cin >> w;\n\
  \        while (w < 1 || w > 1500) {\n            cout << \"Invalid value! Enter\
  \ a weight between 1 and 1500 (in pounds):\";\n            cin >> w;\n        }\n\
  \        if (w < minimum) {\n            minimum = w;\n        }\n        if (w\
  \ > maximum) {\n            maximum = w;\n        }\n    }\n    cout << minimum\
  \ << \"  \" << maximum << endl;\n    return 0;\n}\n```\n\n#### 练习 30.4-2 验证并寻找最热行星\n\
  \n编写一个 C++ 程序，提示用户反复输入行星的名称和平均温度，直到输入“STOP”（作为名称）。最后，程序必须显示最热行星的名称。此外，由于 −459.67°o（华氏度）是可能的最低温度（被称为绝对零），程序还必须对数据输入进行验证（使用循环控制结构），并在用户输入低于绝对零度的温度时显示错误消息。\n\
  \n解决方案\n\n首先，让我们编写不使用数据验证 C++ 程序。根据“终极”规则，预测试循环结构应该如通用形式所示：\n\n\n\n\n\n```cpp\n\
  cout << \"Enter the name of a planet: \"; cin >> name; // Initialization of name\n\
  while (to_upper_copy(name) != \"STOP\") {\n    // A statement or block of statements\n\
  \    cout << \"Enter the name of a planet: \"; cin >> name; // Update/alteration\
  \ of name\n}\n```\n\n现在，让我们添加其余语句，仍然不进行数据输入验证。请记住，由于 -459.67^o 是温度标的下限，你可以使用比此值的值作为变量\
  \ `maximum` 的初始值。\n\n```cpp\nmaximum = -460;\nmName = \"\";\ncout << \"Enter the\
  \ name of a planet: \"; cin >> name; // Initialization of name\nwhile (to_upper_copy(name)\
  \ != \"STOP\") {\n    cout << \"Enter its average temperature: \"; cin >> t;\n \
  \   if (t > maximum) {\n        maximum = t;\n        mName = name;\n    }\n   \
  \ cout << \"Enter the name of a planet: \"; cin >> name; // Update/alteration of\
  \ name\n}\nif (maximum != -460) {\n    cout << \"The hottest planet is: \" << mName\
  \ << endl;\n} else {\n    cout << \"Nothing Entered!\" << endl;\n}\n```\n\n![](img/notice.jpg)\n\
  使用 `if (maximum != -460)` 语句是必要的，因为存在用户可能从一开始就输入单词“STOP”。\n\n为了验证数据输入，你只需要将以下两行代码：\n\
  \n```cpp\ncout << \"Enter its average temperature: \"; cin >> t;\n```\n\n替换为以下代码片段：\n\
  \n```cpp\ncout << \"Enter its average temperature: \"; cin >> t;\nwhile (t < -459.67)\
  \ {\n    cout << \"Invalid value! Enter its average temperature: \"; cin >> t;\n\
  }\n```\n\n最终程序如下。\n\n![](img/my_exercise_header.png) project_30.4-2\n```cpp\n#include\
  \ <iostream>\n#include <boost/algorithm/string.hpp>\nusing namespace boost::algorithm;\n\
  using namespace std;\n\nint main() {\n    double maximum, t;\n    string mName,\
  \ name;\n    maximum = -460;\n    mName = \"\";\n    cout << \"Enter the name of\
  \ a planet: \"; cin >> name;\n    while (to_upper_copy(name) != \"STOP\") {\n  \
  \      cout << \"Enter its average temperature: \";\n        cin >> t;\n       \
  \ while (t < -459.67) {\n            cout << \"Invalid value! Enter its average\
  \ temperature: \";\n            cin >> t;\n        }\n        if (t > maximum) {\n\
  \            maximum = t;\n            mName = name;\n        }\n        cout <<\
