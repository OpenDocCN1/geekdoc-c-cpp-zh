  4) `sin()` 函数返回数字的 _____。\n5) `abs()` 函数返回数字的 __________ 值。\n\n## 复习题\n\n回答以下问题。\n\
  1) 什么是顺序控制结构？\n2) 顺序控制结构可以执行哪些操作？\n3) 在计算机科学中，“类型转换”（type casting）是什么意思？\n4) 给出一个如何使用整数除法的商和余数的例子。\n\
  5) 什么是函数？\n6) “嵌套函数”是什么意思？\n\n# 第四部分选择控制结构\n\n## 第 15 章：提出问题\n\n### 15.1 引言\n\n\
  你目前为止所学的所有内容都是顺序控制结构，语句按照它们在程序中出现的相同顺序执行。然而，在真正的 C++ 编程中，你很少希望按顺序执行语句。很多时候你希望在一种情况下执行一组语句，而在另一种情况下执行完全不同的另一个语句。\n\
  \n### 15.2 什么是布尔表达式？\n\n假设变量 `x` 包含值 5。这意味着如果你问“`x > 2` 吗？”答案显而见是“是”。对于计算机来说，这些问题被称为布尔表达式。例如，如果你写下\
  \ `x > 2`，这是一个布尔表达式，计算机必须检查表达式 `x > 2` 为真还是假。\n\nnotice.jpg)布尔表达式是一个产生布尔值的表达式，即真或假。\n\
  \n![](img/notice.jpg)布尔表达式是问题，其读法应该是“某物是否等于/大于/小于某物？”，答案只是“是”或“否”（真或假）。\n\n\n\n\n\
  \n![](img/remember.jpg)决策控制结构可以评估一个布尔表达式或一组布尔表达式，然后决定执行哪块语句。\n\n## 15.3 如何编写简单的布尔表达式\n\
  \n一个简单的布尔表达式的写法为：\n\n`Operand1 Comparison_Operator Operand2`\n\n其中：\n\n* `Operand1`\
  \ 和 `Operand2` 可以是值、变量、常量或数学表达式。\n* `Comparison_Operator` 可以是表 15-1 所示的运算符之一。\n\n\
  | 比较运算符 | 描述 |\n| --- | --- |\n| == | 等于（非赋值操作符） |\n| != | 不等于 |\n| > | 大于 |\n|\
  \ < | 小于 |\n| >= | 大于等于 |\n| <= | 小于等于 |\n\n*表 15-1 C++ 中的比较运算符*\n\n以下是一些布尔表达式的示例：\n\
  \n* `x > y`。这个布尔表达式是向计算机提出的一个提问，可以读作“`x` 是否大于 `y`？”\n* `x <= y`。这个布尔表达式也是向计算机提出的一个提问，可以读作“`x`\
  \ 是否小于或等于 `y`？”\n* `x != 3 * y + 4`。这可以读作“`x` 是否不等于表达式 `3 * y + 4` 的结果？”\n* `s ==\
  \ \"Hello\"`。这可以读作“`s` 是否等于单词 'Hello'？”。换句话说，这个提问可以读作“`s` 包含单词 'Hello' 吗？”\n* `x\
  \ == 5`。这可以读作“`x` 是否等于 `5`？”\n\n![](img/notice.jpg)初学者在编写 C++ 程序时经常犯的一个非常常见的错误是将赋值操作符与等于运算符混淆。他们经常在实际想表达\
  \ `x == 5` 时，却错误地写成了 `x = 5`。\n\n#### 练习 15.3-1 填充表格\n\n根据变量 `a`、`b` 和 `c` 的值，在下表中填入“true”（真）或“false”（假）。\n\
  \n| a | b | c | a == 10 | b <= a | c > 3 * a − b |\n| --- | --- | --- | --- | ---\
  \ | --- |\n| 3 | −5 | 7 | | | |\n| 10 | 10 | 21 | | | |\n| −4 | −2 | −9 | | | |\n\
  \n##### 答案\n\n前两个布尔表达式非常直观，不需要进一步解释。\n\n对于布尔表达式 `c > 3 * a − b`，请注意 `b` 为负数的情况。例如，在第一行中，`a`\
  \ 等于 `3`，`b` 等于 `-5`。表达式 `3 * a - b` 的结果是 `3 * 3 − (−5) = 3 * 3 + 5 = 14`。由于变量 `c`\
  \ 的内容（第一行中）并不大于 `14`，因此布尔表达式 `c > 3 * a − b` 的结果为 `false`。\n\n经过计算，表格如下：\n\n| a\
  \ | b | c | a == 10 | b <= a | c > 3 * a − b |\n| --- | --- | --- | --- | --- |\
  \ --- |\n| 3 | −5 | 7 | false | true | false |\n| 10 | 10 | 21 | true | true | true\
  \ |\n| −4 | −2 | −9 | false | false | true |\n\n## 15.4 逻辑运算符和复杂布尔表达式\n\n复杂的布尔表达式由更简单的布尔表达式构建，可以写成：\n\
  \n`BE1 Logical_Operator BE2`\n\n其中：\n\n* `BE1` 和 `BE2` 可以是任何布尔表达式。\n* `Logical_Operator`\
  \ 可以是表 15-2 所示的运算符之一。\n\n| 逻辑运算符 | 描述 |\n| --- | --- |\n| && | 与（AND，也称为逻辑与） |\n\
  | || | 或（OR，也称为逻辑或取） |\n| ! | 非（NOT，也称为否定或逻辑取反） |\n\n*表 15-2 C++ 中的逻辑运算符*\n\n![](img/notice.jpg)当你将简单的布尔表达式与逻辑运算符结合时，整个布尔表达式被称为“复杂布尔表达式”。例如，表达式\
  \ `x == 3 && y > 5` 就是一个复杂的布尔表达式。\n\n![](img/notice.jpg)在流程图中，本本书使用了通用的 AND、OR 和\
  \ NOT 运算符！\n\n### 与 ( && ) 运算符\n\n当你在两个布尔表达式之间使用 AND (`&&`) 运算符（`BE1 && BE2`）时，意味着只有当两个布尔表达式（`BE1`\
  \ 和 `BE2`）都为真，整个复杂表达式的结果为真。\n\n你可以将信息组织在所谓的真表中。真表显示了两个或多个布尔表达式在所有可能的取值组合下的逻辑操作结果。与\
  \ (`&&`) 运算符的真表所示所示：\n\n| BE1 (布尔表达式 1) | BE2 (布尔表达式 2) | BE1 && BE2 |\n| --- |\
  \ --- | --- |\n| false | false | false |\n| false | true | false |\n| true | false\
  \ | false |\n| true | true | true |\n\n你仍然感到困惑吗？你不应该！这很简单！让我们来看一个例子。复杂的布尔表达式\n\n\
  `name == \"John\" && age > 5`\n\n只有当变量 `name` 包含单词“John”（不带双引号）且变量 `age` 包含大于 5\
  \ 的值时，才为真。\n\n### 或 ( || ) 运算符\n\n当你在两个布尔表达式之间使用 OR (`||`) 运算符（`BE1 || BE2`）时，意味着只要其中一个布尔表达式（`BE1`\
  \ 或 `BE2`）为真，整个复杂表达式的结果为真。\n\n或 (`||`) 运算符的真表所示：\n\n| BE1 (布尔表达式 1) | BE2 (布尔表达式\
  \ 2) | BE1 || BE2 |\n| --- | --- | --- |\n| false | false | false |\n| false | true\
  \ | true |\n| true | false | true |\n| true | true | true |\n\n让我们来看一个例子。复杂的布尔表达式\n\
  \n`name == \"John\" || name == \"George\"`\n\n当变量 `name` 包含单词“John”或“George”（不带引号）时，为真。至少有一个布尔表达式必须为真。如果两个布尔表达式都为假（例如变量\
  \ name 包含单词“Maria”），那么整个布尔表达式为假。\n\n### 非 ( ! ) 运算符\n\n当你在布尔表达式前面使用 NOT (`!`) 运算符（`!(BE)`）时，意味着当布尔表达式为假时，整体的结果为真，反之亦然。\n\
  \n非 (`!`) 运算符的真表所示：\n\n| BE (布尔表达式) | !(BE) |\n| --- | --- |\n| false | true |\n\
  | true | false |\n\n例如，表达式\n\n`!(age > 5)`\n\n当 `age` 小于等于 5 时为真。例如，如果 age 的值为 6，则表达式为假。\n\
  \n![](img/notice.jpg)逻辑运算符 NOT (`!`) 反转布尔表达式的结果。在 C++ 中，布尔表达式必须放在括号内。\n\n#### 练习\
  \ 15.4-1 计算复杂表达式的结果\n\n当变量 `a`、`b`、`c` 和 `d` 分别包含 5、2、7 和 -3 时，计算以下复杂表达式的结果：\n\n\
  i) `(3 * a + b / 47 - c * b / a > 23) && (b != 2)`\nii) `(a * b - c / 2 + 21 * c\
  \ / 3) || (a >= 5)`\n\n##### 答案\n\n不要害怕！结果可以很容易找到。你只需要回忆与 (`&&`) 和或 (`||`) 运算符的规则。\n\
  \ni) 与 (`&&`) 运算符的结果只有在两个布尔表达式都为真时为真。仔细观察，右侧布尔表达式（`b != 2`）的结果为假。因此，不需要计算左侧表达式的结果。最终结果为假。\n\
  ii) 或 (`||`) 运算符的结果在至少有一个布尔表达式为真时为真。仔细观察，右侧布尔表达式（`a >= 5`）实际上为真。因此，不必去计算左侧表达式的结果。最终结果为真。\n\
  \n## 15.5 将布尔表达式的结果赋值给变量\n\n由于布尔表达式实际上返回一个值（真或假），这个值可以直接赋值给变量。例如，语句\n\n`a = x >\
  \ y;`\n\n将真或假赋值给布尔变量 `a`。它可以读作“如果变量 `x` 的内容大于变量 `y` 的内容，则将真赋值给变量 `a`；否则，赋值假”。接下来的示例将在屏幕上显示值\
  \ 1（真）。\n\n\n\n\n\n![](img/my_exercise_header.png) 项目 _15.5\n```cpp\n#include <iostream>\n\
  using namespace std;\nint main() {\n    int x, y;\n    bool a;\n    x = 8;\n   \
  \ y = 5;\n    a = x > y;\n    cout << a << endl;\n    return 0;\n}\n```\n\n![](img/notice.jpg)在\
  \ `C++` 中，布尔值 `true` 等于整数值 `1`。\n\n## 15.6 逻辑运算符的优先级顺序是什么？\n\n一个更复杂的布尔表达式可能会使用多个逻辑运算符，如下所示的表达式：\n\
  \n`x > y || x == 5 && x <= z || !(z == 1)`\n\n因此，一个合理的问题是：“哪个逻辑操作是先执行？”\n\n`C++`\
  \ 中的逻辑运算符遵循与大多数编程语言相同的优先级规则。优先级的顺序是：逻辑非（`!`）首先执行，逻辑与（`&&`）次执行，逻辑或（`||`）最后执行。\n\n\
