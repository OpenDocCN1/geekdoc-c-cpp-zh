  \n# 第五部分：循环控制结构\n\n## 第 24 章：循环控制结构简介\n\n### 24.1 什么是循环控制结构？\n\n循环控制结构是一种控制结构，它允许在满足指定条件之前多次执行一条语句或语句块。\n\
  \n### 24.2 从顺序控制到循环控制结构\n\n下一个示例允许用户输入四个数字，然后计算并显示它们的和。如你所见，还没有使用循环控制结构，只有熟悉的顺序控制结构。\n\
  \n```cpp\ndouble x, y, z, w, total;\ncin >> x;cin >> y;cin >> z;cin >> w;\ntotal\
  \ = x + y + z + w;\ncout << total << endl;\n```\n\n虽然这段代码很短，但考虑一个类似的程序，它允许用户输入 1000\
  \ 个数字而不是仅仅是四个。你能想象需要写一千次 `cin` 输入语句吗？如果只需要写一次这个语句并指示计算机执行一千次，就会方便得多吗？这就是循环控制结构大显身场的地方！\n\
  \n在深入学习控制结构之前，先尝试解决一个谜题！在还没有循环控制结构的情况下，尝试重写上面的示例，只使用两个变量：`x` 和 `total`。是的，你没听错！这段代码必须计算并显示四个用户提供的数字之和，但必须只使用两个变量！你能找到方法吗？\n\
  \n嗯……显然你现在在想：“用两个变量唯一能做的的就是在变量 `x` 中读取单个值，然后将该值赋值给变量 `total`。”你的想法非常正确，展示如下：\n\n\
  ```cpp\ncin >> x; // 读取第一个数字\ntotal = x;\n```\n\n这可以等价地变为\n\n```cpp\ntotal = 0;\n\
  cin >> x; // 读取第一个数字\ntotal = total + x;\n```\n\n现在呢？现在你实际上可以做三件事，这些是：思考、思考，当然思考！\n\
  \n第一个用户数字已经存储在变量 `total` 中，所以变量 `x` 现在可以释放出来！因此，你可以重用变量 `x` 读取第二个值，它也会累加到变量 `total`\
  \ 中，如下。\n\n```cpp\ntotal = 0;\ncin >> x; // 读取第一个数字\ntotal = total + x;\ncin >>\
  \ x; // 读取第二个数字\ntotal = total + x;\n```\n\n\n\n\n\n![](img/notice.jpg)\n`total\
  \ = total + x` 将 `x` 的值累加到 `total` 中，这意味着它将 `x` 的值加到 `total` 之前的任何旧值上。例如，如果变量 `total`\
  \ 的值为 5，变量 `x` 的值为 3，则语句 `total = total + x` 将值 8 赋值给变量 `total`。\n\n由于第二个由用户提供的数字已经累加在变量\
  \ `total` 中，变量 `x` 可以被重复使用！这个过程可以一直重复，直到四个数字都被读取并累加到变量 `total` 中。最终代码如下。请注意，它目前还没有使用任何循环控制结构！\n\
  \n```\ntotal = 0;cin >> x;total = total + x;cin >> x;total = total + x;cin >> x;total\
  \ = total + x;cin >> x;total = total + x;cout << total << endl;\n```\n\n![](img/notice.jpg)这段代码和本节开头的初始代码被认为是等价的。然而，它们之间的区别在于后者包含了四对完全相同的语句。\n\
  \n显然，你可以使用这个示例来读取并找到四个以上数字之和。然而，多次编写这些语句对可能会非常繁琐，而且如果不小心漏掉了某一对，可能会导致错误。\n\n你真正需要的是保留一对语句，但使用循环控制结构来执行它四次（如果你愿意，甚至可以\
  \ 1000 次）。你可以使用下面的代码片段。\n\n```\ntotal = 0;execute_these_statements_4_times {cin\
  \ >> x;total = total + x;}cout << total << endl;\n```\n\n显然，在 C++ 中并没有任何 `execute_these_statements_4_times`\
  \ 语句。这仅用于演示目的，但很快你就会学到关于 C++ 支持的所有循环控制结构的所有知识！\n\n### 24.3 复习题：判断对错\n\n判断以下每个陈述的正确（true）或错误（false）。\n\
  \n1) 循环控制结构是一种允许语句或语句块执行多次，直到满足特定运行的结构。\n2) 可以使用顺序控制结构提示用户输入 1000 个数字，然后计算它们的和。\n\
  3) 下面的代码片段在变量 `total` 中累加了值 10。`total = 10;a = 0;total = total + a;`\n4) 下面的 C++\
  \ 程序满足有效性属性。\n```cpp\n#include <iostream>using namespace std;int main() {int a,\
  \ total;a = 5;total = total + a;cout << total << endl;return 0;}\n```\n5) 以下两个代码片段都将值\
  \ 5 赋值给变量 `total`。`a = 5;total = a;total = 0;a = 5;total = total + a;`\n\n## 第 25\
  \ 章\n\n前测试循环、中测试循环和后测试循环结构\n\n### 25.1 前测试循环结构\n\n前测试循环结构如下图图所示。\n\n![Image](img/chapter25-01.png)\n\
  \n让我们看看当执行流到达前测试循环结构时会发生什么。如果 `Boolean_Expression` 求值为真（true），则执行该结构的语句或语句块，并且执行流返回再次检查\
  \ `Boolean_Expression`。如果 `Boolean_Expression` 再次求值为真，则重复该过程。当 `Boolean_Expression`\
  \ 在某一点求值为假（false）时，迭代停止，执行流退出循环。\n\n![](img/notice.jpg)判定符号（菱形）既用于判定控制结构，也用于循环控制结构。然而，在循环控制结构中，菱形的出口之一总有一个向上的方向。\n\
  \n![](img/notice.jpg) 这种“前测试循环结构”之所以这样命名，是因为首先求值布尔表达式，然后执行该结构的语句或语句块。\n\n![](img/notice.jpg)因为布尔表达式在进入循环之前就已经进行了求值，所以前测试循环可能执行从零到多次的迭代。\n\
  \n![](img/notice.jpg)每次执行循环控制结构的语句或语句块时，计算机科学中的术语是“循环正在迭代”或“循环执行一次迭代”。\n\nC++ 语句的通用形式是：\n\
  \n```cpp\nwhile (Boolean_Expression) {语句或语句块}\n```\n\n下面的示例显示了从 1 到 10 的数字。\n\n\
  ![](img/my_exercise_header.png) project_25.1\n```cpp\n#include <iostream>using namespace\
  \ std;int main() {int i = 1;while (i <= 10) {\n\n> cout << i << endl;\n\n> i++;\n\
  \n}return 0;}\n```\n\n![](img/notice.jpg)正如在判定控制结构中一样，循环控制结构内部的语句应该缩进。\n\n与判定控制结构类似，当只需要一个语句作为\
  \ `while` 语句的一部分时，你允许省略大括号 `{ }`。因此，`while` 语句可以像下面所示。\n\n```cpp\nwhile (Boolean_Expression)单条语句;\n\
  ```\n\n![](img/remember.jpg)为了防止潜在的逻辑错误，许多程序员倾向于始终使用大括号，即使 `while` 语句只包含一条语句。\n\n\
  #### 练习 25.1-1 设计流程图并计算迭代次数\n\n为下面的代码片段设计相应的流程图。这段 C++ 代码执行了多少次迭代？\n\n```cpp\nint\
  \ i = 4;while (i > 0) {i--;}cout << \"The end\";\n```\n\n解答\n\n相应的流程图片段如下。\n\n.![Image](img/chapter25-02.png)\n\
  \n接下来，跟踪表可以帮助你观察执行流。\n\n| 步骤 | 语句 | 注释 | i |\n| :--- | :--- | :--- | :--- |\n| 1\
  \ | i = 4 | | 4 |\n| 2 | while (i > 0) | 结果为真 | 第 1 次 |\n| 3 | i-- | | 3 |\n| 4\
  \ | while (i > 0) | 结果为真 | 第 2 次 |\n| 5 | i-- | | 2 |\n| 6 | while (i > 0) | 结果为真\
  \ | 第 3 次 |\n| 7 | i-- | | 1 |\n| 8 | while (i > 0) | 结果为真 | 第 4 次 |\n| 9 | i--\
  \ | | 0 |\n| 10 | while (i > 0) | 结果为假 | |\n| 11 | cout << \"The end\" | 输出: The\
  \ end | |\n\n![](img/notice.jpg)当前测试循环的语句或语句块执行 N 次时，布尔表达式求值 N+1 次。因此，要确定迭代次数，应计算语句或语句块执行的次数，而不是布尔表达式求值的次数。\n\
  \n#### 练习 25.1-2 计算总迭代次数\n\n这段代码执行了多少次迭代？\n\n```cpp\nint i = 4;while (i >= 0) {cout\
  \ << i;i--;}cout << \"The end\";\n```\n\n解答\n\n这个练习与上一个几乎相同。区别在于布尔表达式在 i = 0 时仍然为真。因此它多执行了一次迭代，即五次迭代。\n\
  \n#### 练习 25.1-3 计算总迭代次数\n\n这段代码执行了多少次迭代？\n\n```cpp\nint i = 1;while (i != 6) {i\
  \ += 2;}cout << \"The end\";\n```\n\n解答\n\n让我们创建一个跟踪表来观察执行流。\n\n| 步骤 | 语句 | 注释 |\
  \ i |\n| :--- | :--- | :--- | :--- |\n| 1 | i = 1 | | 1 |\n| 2 | while (i != 6)\
  \ | 结果为真 | 第 1 次 |\n| 3 | i += 2 | | 3 |\n| 4 | while (i != 6) | 结果为真 | 第 2 次 |\n\
  | 5 | i += 2 | | 5 |\n| 6 | while (i != 6) | 结果为真 | 第 3 次 |\n| 7 | i += 2 | | 7\
  \ |\n| 8 | while (i != 6) | 结果为真 | ... |\n| 9 | … | … | |\n\n正如你从跟踪表中看到的，由于值 6 从未赋值给变量\
  \ `i`，这段代码片段将无限迭代下去！显然，这段代码不满足有限性属性。\n\n#### 练习 25.1-4 计算总迭代次数\n\n这段代码执行了多少次迭代？\n\
  \n```cpp\nint i = -10;while (i > 0) {cout << i;i--;}cout << \"The end\";\n```\n\n\
  解答\n\n最初，值 -10 被赋值给变量 `i`。布尔表达式直接求值为假，执行流直接进入 `cout << \"The end\"` 语句。因此，这段代码片段执行了零次迭代。\n\
  \n\n\n\n\n## 练习 25.1-5 求解四个数的和\n\n使用预测试循环结构，编写一个 C++ 程序，让用户输入四个数字，然后计算并显示它们的和。\n\
  \n##### 解决方案\n\n你还记得第 24.2 节中计算四个数之和的示例吗？在最后，经过简单的处理后，建议的代码片段变为：\n\n`total = 0;execute_these_statements_4_times\
  \ {cin >> x;total = total + x;}cout << total << endl;`\n\n现在，你需要一种方法用真实的 C++ 语句来“呈现”\
  \ `execute_these_statements_4_times` 语句。`while` 语句可以实现这一点，但你需要一个额外的变量来计数。这样，当执行了所需的次数后，执行流将退出循环。\n\
  \n下面是一个通用的代码片段，它会按照 `total_number_of_iterations`指定的次数进行迭代：\n\n```cpp\ni = 1;while\
  \ ( i <= total_number_of_iterations ) {A statement or block of statementsi++;}\n\
  ```\n\n其中 `total_number_of_iterations` 可以是一个常量值，甚至是一个变量或表达式。\n\n将此代码片段与之前的结合后，最终程序变为：\n\
  \n![](img/my_exercise_header.png) project_25.1-5\n```cpp\n#include <iostream>\n\
  using namespace std;\nint main() {double total, x;int i;total = 0;i = 1;while (i\
  \ <= 4) {\n\n> cin >> x;      \n\n> total = total + x;\n\n> i++;\n\n}cout << total\
  \ << endl;return 0;}\n```\n\n![](img/notice.jpg)变量 `i` 的名称并不是固定的。你可以使用任何喜欢的变量名，例如\
  \ `counter`、`count`、`k` 等。\n\n#### 练习 25.1-6 求解奇数的和\n\n设计一个流程图并编写相应的 C++ 程序，让用户输入\
  \ 20 个整数，然后计算并显示这些奇数的和。\n\n##### 解决方案\n\n这非常简单。程序在循环内部必须做的是检查用户提供的数字是否为奇数，如果是，则该数字必须累加到变量\
  \ `total` 中；偶数则必须忽略。流程图如下。它包含一个嵌套在预测试循环结构中的单分支决策结构。\n\n![Image](img/chapter25-03.png)\n\
  \n相应的 C++ 程序如下所示。\n\n![](img/my_exercise_header.png) project_25.1-6\n```cpp\n#include\
  \ <iostream>\nusing namespace std;\nint main() {int total, i, x;total = 0;i = 1;while\
  \ (i <= 20) {\n\n> cin >> x;\n\n> if (x % 2 != 0) {\n\n> > total += x;    //这等于\
  \ total = total + x\n\n> }\n\n> i++;\n\n}cout << total << endl;return 0;}\n```\n\
  \n![](img/notice.jpg)只要保持语法和逻辑上的正确性，你可以将任何决策控制结构嵌套在任何循环控制结构中。\n\n### 练习 25.1-7 求解\
  \ N 个数的和\n\n编写一个 C++ 程序，让用户输入 N 个数字，然后计算并显示它们的和。N 的值必须在程序开始时由用户提供。\n\n##### 解决方案\n\
  \n在这个练习中，总迭代次数取决于用户必须输入的值。下面是一个执行 N 次迭代的通用代码片段，其中 N 由用户提供。\n\n```cpp\ncin >> n;i\
  \ = 1;while (i <= n) {A statement or block of statementsi++;}\n```\n\n根据你目前为止学到的知识，最终程序变为：\n\
  \n![](img/my_exercise_header.png) project_25.1-7\n```cpp\n#include <iostream>\n\
  using namespace std;\nint main() {int n, i;double x, total;total = 0;cin >> n;i\
  \ = 1;while (i <= n) {\n\n> cin >> x;\n\n> total += x;\n\n> i++;\n\n}cout << total\
  \ << endl;return 0;}\n```\n\n## 练习 25.1-8 求解未知数量数字的和\n\n编写一个 C++ 程序，让用户重复输入整数值，直到输入\
  \ -1 为止。当数据输入完成后，必须显示输入数字之和。（-1 的值不能包含在最终和中）。接下来，创建一个跟踪表，使用 10、20、5 和 -1 作为输入值来检查你的程序是否运行正常。\n\
  \n##### 解决方案\n\n在这个练习中，总迭代次数是未知的。如果你使用决策控制结构，你的程序看起来像下面的代码片段。\n\n```cpp\ntotal =\
  \ 0;cin >> x;if (x != -1) {  //检查变量 x\ntotal += x;   //并执行此语句\ncin >> x;     //再执行这一\n\
  if (x != -1) {  //检查变量 x\n\n> total += x;   //并执行此语句\n\n> cin >> x;     //再执行这一\n\
  \n> if (x != -1) {  //检查变量 x\n\n> > total += x;   //并执行此语句\n\n> > cin >> x;    \
  \ //再执行这一\n\n> > …\n\n> > …\n\n> }\n}}\ncout << total << endl;\n```\n\n现在让我们用循环控制结构来重写这个程序。最终程序如下所示。如果你尝试跟踪执行流，你会发现它的运行方式与之前的等效。\n\
  \n![](img/my_exercise_header.png) project_25.1-8\n```cpp\n#include <iostream>\n\
  using namespace std;\nint main() {double total, x;total = 0;cin >> x;while (x !=\
  \ -1) {  //检查变量 x\n\n> total += x;      //并执行此语句\n\n> cin >> x;        //再执行这一\n\
  \n}cout << total << endl;return 0;}\n```\n\n现在让我们创建一个跟踪表，使用 10、20、5 和 -1 作为输入值来确定此程序是否运行正常。\n\
  \n| 步骤 | 语句 | 备注 | x | total |\n| --- | --- | --- | --- | --- |\n| 1 | total = 0\
  \ |    | ? | 0 |\n| 2 | cin >> x |    | 10 | 0 |\n| 3 | while (x != ‑1) | 结果为真 |\
  \ | |\n| 4 | total += x |    | 10 | 10 |\n| 5 | cin >> x |    | 20 | 10 |\n| 6 |\
  \ while (x != ‑1) | 结果为真 | | |\n| 7 | total += x |    | 20 | 30 |\n| 8 | cin >>\
  \ x |    | 5 | 30 |\n| 9 | while (x != ‑1) | 结果为真 | | |\n| 10 | total += x |   \
  \ | 5 | 35 |\n| 11 | cin >> x |    | −1 | 35 |\n| 12 | while (x != ‑1) | 结果为假 |\
  \ | |\n| 13 | cout << total << endl | 显示为: 35 | | |\n\n如你所见，最后变量 `total` 包含值 35，这确实是值\
  \ 10 + 20 + 5 的和。此外，用户提供的最终值 -1 不参与最终的和。\n\n![](img/notice.jpg)当在循环开始迭代之前已知迭代次数时，该循环通常被称为“定数循环”。但在本练习中，迭代次数在循环开始之前是未知的，它取决于某个条件。这种循环通常被称为“不定循环”。\n\
  \n## 练习 25.1-9 求解 20 个数的乘积\n\n编写一个 C++ 程序，让用户输入 20 个数字，然后计算并显示它们的乘积。\n\n##### 解决方案\n\
  \n如果你使用顺序控制结构，它将像下面的代码片段。\n\n```cpp\np = 1;cin >> x;      \np = p * x;cin >> x;p\
  \ = p * x;……cin x;p = p * x;\n```\n\n![](img/notice.jpg)注意变量 `p` 初始化为 1 而不是 0。这对于让\
  \ `p = p * x` 语句正常运行是必要的；否则最终的乘积将为零。\n\n利用之前练习的知识，最终程序变为：\n\n![](img/my_exercise_header.png)\
  \ project_25.1-9\n```cpp\n#include <iostream>\nusing namespace std;\nint main()\
  \ {double p, x;int i;p = 1;i = 1;while (i <= 20) {\n\n> cin >> x;\n\n> p = p * x;\n\
  \n> i++;\n\n}cout << p << endl;return 0;}\n```\n\n### 25.2 后测试循环结构\n\n后测试循环结构如流程图所示。\n\
  \n![Image](img/chapter25-04.png)\n\n![](img/remember.jpg)在循环控制结构中，菱形的一个出口始终有一个上的方向。\n\
  \n让我们看看当执行流到达后测试循环结构时发生了什么。结构的语句或语句块被直接执行，如果 `Boolean_Expression` 结果为真，执行流将回到结构语句或语句块上方的点。语句或语句块再次执行一次，如果\
  \ `Boolean_Expression` 再次为真，则重复该过程。当 `Boolean_Expression` 在某处结果为假时，迭代停止，执行流退出循环。\n\
  \n\n\n\n\n![](img/notice.jpg)后测试循环与先测试循环的区别在于，后测试循环首先执行结构中的语句或语句块，然后才评估布尔表达式。因此，后测试循环至少执行一次迭代！\n\
  \n![](img/remember.jpg)当循环控制结构的语句或语句块每执行一次时，计算机科学中使用的术语是“循环正在迭代”或“循环执行了一次迭代”。\n\n\
  C++语句的通用形式为：\n\n```cpp\ndo {A statement or block of statements} while (Boolean_Expression);\n\
  ```\n\n以下示例显示了 1 到 10 的数字。\n\n![](img/my_exercise_header.png) project_25.2\n```cpp\n\
  #include <iostream>\nusing namespace std;\nint main() {\n    int i;\n    i = 1;\n\
  \    do {\n        cout << i << endl;\n        i++;\n    } while (i <= 10);\n  \
  \  return 0;\n}\n```\n\n![](img/notice.jpg)注意 `do-while` 语句末尾有一个分号（`;`）字符。\n\n当只需要一个单一语句作为\
  \ `do-while` 语句的一部分时，允许省略大括号 `{ }`。因此，`do-while` 语句可以如下所示。\n\n```cpp\ndoOne_Single_Statement;while\
  \ (Boolean_Expression);\n```\n\n![](img/notice.jpg)为了防止潜在的逻辑错误，许多程序员倾向于在 `do-while`\
  \ 语句仅包含一个语句时也始终使用大括号。\n\n### 练习 25.2-1 设计流程图并计算总迭代次数\n\n为以下代码段设计对应的流程图。这段 C++ 代码执行了多少迭代？\n\
  \n```cpp\nint i;i = 3;do {i--;} while (i > 0);cout << \"The end\";\n```\n\n#####\
  \ 答案\n\n对应的流程图片段如下。\n\n.![Image](img/chapter25-05.png)\n\n现在，让我们创建一个追踪表来观察执行流。\n\
  \n| 步骤 | 语句 | 注释 | i | | |\n| --- | --- | --- | --- | --- | --- |\n| 1 | `i = 3`\
  \ | | 3 | | |\n| 2 | `i--` | | 2 | 第 1 次 | 迭代 |\n| 3 | `while (i > 0)` | 评估结果为真\
  \ | | | |\n| 4 | `i--` | | 1 | 第 2 次 | 迭代 |\n| 5 | `while (i > 0)` | 评估结果为真 | |\
  \ | |\n| 6 | `i--` | | 0 | 第 3 次 | 迭代 |\n| 7 | `while (i > 0)` | 评估结果为假 | | | |\n\
  | 8 | `cout << \"The end\"` | 显示: The end | | | |\n\n如从追踪表中可以看出，总迭代次数为三次。\n\n![](img/notice.jpg)后测试循环结构中的语句或语句块都执行了\
  \ `N` 次，布尔表达式被评估了 `N` 次。因此，要确定总迭代次数，你可以计算语句或语句块执行的次数，或者布尔表达式评估的次数。这两个计数都相等！\n\n\
  ### 练习 25.2-2 计算总迭代次数\n\n这段代码段执行了多少迭代？\n\n```cpp\nint i = 3;do {cout << i;i--;}\
  \ while (i >= 0);cout << \"The end\";\n```\n\n##### 答案\n\n这个练习与上一个几乎相同。主要区别在于这里的布尔表达式在\
  \ `i = 0` 时也保持为真。因此，它执行了一次额外的迭代，即四次。\n\n### 练习 25.2-3 设计流程图并计算总迭代次数\n\n为以下代码段设计对应的流程图。这段代码执行了多少迭代？\n\
  \n```cpp\nint i = -1;do {cout << \"Hello there!\" << endl;i--;} while (i > 0);cout\
  \ << \"The end\";\n```\n\n##### 答案\n\n对应的流程图片段如下。\n\n.![Image](img/chapter25-06.png)\n\
  \n初始将值 `-1` 分给变量 `i`。在循环内部，显示消息“Hello there!”并且变量 `i` 减 1（结果为 `-2`）。布尔表达式 `i > 0`\
  \ 评估为假，执行流直接进入写入（\"The end\"）语句。因此，该算法执行了一次迭代！\n\n### 练习 25.2-4 计算总迭代次数\n\n这段代码段执行了多少迭代？\n\
  \n```cpp\nint i = 1;do {i = i + 2;} while (i != 4);cout << \"The end\";\n```\n\n\
  ##### 答案\n\n让我们创建一个追踪表来观察执行流。\n\n| 步骤 | 语句 | 注释 | i | | |\n| --- | --- | --- | ---\
  \ | --- | --- |\n| 1 | `i = 1` | | 1 | | |\n| 2 | `i = i + 2` | | 3 | 第 1 次 | 迭代\
  \ |\n| 3 | `while (i != 4)` | 评估结果为真 | | | |\n| 4 | `i = i + 2` | | 5 | 第 2 次 |\
  \ 迭代 |\n| 5 | `while (i != 4)` | 评估结果为真 | | | |\n| 6 | `i = i + 2` | | 7 | 第 3 次\
  \ | 迭代 |\n| 7 | `while (i != 4)` | 评估结果为真 | | | |\n| 8 | … | … | ... | ... | |\n\
  | 9 | … | … | | | |\n\n如从追踪表所示，由于值 `4` 从未赋值给变量 `i`，这段代码段将无限迭代！显然，这段代码不满足有限性属性。\n\
  \n### 练习 25.2-5 求 N 个数的乘积\n\n编写一个 C++ 程序，让用户输入 `N` 个数，然后计算并显示它们的乘积。`N` 值必须在程序开始时由用户提供。如果将后测试循环结构切换为先测试循环结构会怎样？对于所有可能的输入\
  \ `N`，两个程序的操作方式是否完全相同？\n\n##### 答案\n\n下面的两个程序都允许用户输入 `N` 个数，计算并显示它们的乘积。左侧使用先测试，右侧使用后测试循环结构。如果你尝试执行它们并为\
  \ `N` 输入任何大于零的值，两个程序的操作方式完全相同！\n\n![](img/my_exercise_header.png) project_25.2-5a\n\
  ```cpp\n#include <iostream>\nusing namespace std;\nint main() {\n    int n, i;\n\
  \    double p, x;\n    cin >> n;\n    p = 1;\n    i = 1;\n    while (i <= n) {\n\
  \        cin >> x;\n        p = p * x;\n        i++;\n    }\n    cout << p << endl;\n\
  \    return 0;\n}\n```\n![](img/my_exercise_header.png) project_25.2-5b\n```cpp\n\
  #include <iostream>\nusing namespace std;\nint main() {\n    int n, i;\n    double\
  \ p, x;\n    cin >> n;\n    p = 1;\n    i = 1;\n    do {\n        cin >> x;\n  \
  \      p = p * x;\n        i++;\n    } while (i <= n);\n    cout << p << endl;\n\
  \    return 0;\n}\n```\n\n然而，这两个 C++ 程序在用户输入非正值时操作方式不同。例如，如果输入值 `0`，左侧程序执行零次迭代，而右侧程序执行一次迭代。显然，左侧程序是解决此题的正确选择！\n\
  \n![](img/notice.jpg)先测试循环可能会执行零次迭代，这与至少执行一次的后测试循环形成对比！\n\n### 25.3 中测试循环结构\n\n\
  中测试循环结构如图所示。\n\n![Image](img/chapter25-07.png)\n\n让我们看看执行流到达中测试循环时会发生什么。结构中的语句 1\
  \ 或语句块被直接执行，如果 `Boolean_Expression` 评估为假，则执行语句 2 或语句块，然后执行流回到语句 1 或语句块上方的点。语句 1\
  \ 或语句块再次执行，如果 `Boolean_Expression` 再次评估为假，则重复该过程。当 `Boolean_Expression` 在某处评估为真时，迭代停止。\n\
  \n尽管这种循环控制结构在 Ada 等某些计算机语言中被支持，但遗憾 C++并不如此。然而，你仍然可以使用 `while` 语句配合 `if` 和 `break`\
  \ 语句来编写中测试循环。主思想是创建一个无限循环，并在结构中两个语句（或语句块）之间的布尔表达式评估为真时跳出循环。该思想在下方的通用形式代码段所示。\n\n\
  ```cpp\nwhile (true) {\n    A statement or block of statements 1\n    if (Boolean_Expression)\
  \ break;\n    A statement or block of statements 2\n}\n```\n\n\n\n\n\n![](img/my_exercise_header.png)\
  \ project_25.3\n\n```cpp\n#include <iostream>\nusing namespace std;\nint main()\
  \ {\n    int i = 1;\n    while (true) {\n        cout << i << endl;\n        if\
  \ (i >= 10) break;\n        i++;\n    }\n    return 0;\n}\n```\n\n#### 练习 25.3-1\
  \ 设计流程图并计算总迭代次数\n\n为以下代码段设计相应的流程图，并创建一个追踪表以确定每一步变量 `i` 的值。\n\n```cpp\nint i = 10;\n\
  while (true) {\n    cout << i << endl;\n    i += 5;\n    if (i > 45) break;\n  \
  \  cout << i * i << endl;\n    i += 10;\n}\ncout << \"The end\";\n```\n\n##### 答案\n\
  \n对应的流程图片段如下。\n\n![Image](img/chapter25-08.png)\n\n现在，让我们创建一个追踪表来观察执行流。\n\n| 步骤\
  \ | 语句 | 注释 | i |\n| --- | --- | --- | --- |\n| 1 | `i = 10` | | 10 |\n| 2 | `cout\
  \ << i << endl` | 显示：10 | |\n| 3 | `i += 5` | | 15 |\n| 4 | `if (i > 45)` | 结果为假\
  \ | |\n| 5 | `cout << i * i << endl` | 显示：225 | |\n| 6 | `i += 10` | | 25 |\n| 7\
  \ | `cout << i << endl` | 显示：25 | |\n| 8 | `i += 5` | | 30 |\n| 9 | `if (i > 45)`\
  \ | 结果为假 | |\n| 10 | `cout << i * i << endl` | 显示：900 | |\n| 11 | `i += 10` | |\
  \ 40 |\n| 12 | `cout << i << endl` | 显示：40 | |\n| 13 | `i += 5` | | 45 | |\n| 14\
  \ | `if (i > 45)` | 结果为假 | |\n| 15 | `cout << i * i << endl` | 显示：2025 | |\n| 16\
  \ | `i += 10` | | 55 | |\n| 17 | `cout << i << endl` | 显示：55 | |\n| 18 | `i += 5`\
  \ | | 60 | |\n| 19 | `if (i > 45)` | 结果为真 | |\n| 20 | `cout << \"The end\"` | 显示：The\
  \ end | |\n\n### 25.4 复习题：判断对错\n\n判断下列每个陈述的对错。\n\n1) 先测试循环（pre-test loop）可能执行 0\
  \ 次迭代。\n2) 在流程图中，先测试循环结构中菱形符号的两个出口方向都是向上的。\n3) 先测试循环结构中的语句或语句块至少执行一次。\n4) `while`\
  \ 语句在其布尔表达式求值为真时停止迭代。\n5) 在先测试循环结构中，当语句或语句块执行 `N` 次时，布尔表达式求值 `N - 1` 次。\n6) 后测试循环（post-test\
  \ loop）可能执行 0 次迭代。\n7) 在后测试循环结构中，当语句或语句块执行 `N` 次时，其布尔表达式也求值 `N` 次。\n8) 你不能在后测试循环结构内部嵌套决策控制结构。\n\
