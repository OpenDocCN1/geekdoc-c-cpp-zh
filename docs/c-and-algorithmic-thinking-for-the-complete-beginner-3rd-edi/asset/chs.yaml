  \ << endl | 显示为: Message #8 | | | |\n| 9 | cout << \"The end!\" << endl | 显示为: The\
  \ end! | | | |\n\n#### 练习 18.1-2 统计位数\n\n编写一个 C++ 程序，提示用户输入 0 到 999 之间的整数，然后统计其位数。必须显示消息“You\
  \ entered N digit number”。\n\n答案\n\n你可能在尝试思考如何使用除法来解决这个问题。你可能在考虑通过除以 10 或 100 来分别检查两位和三位数。你的想法体现在以下代码中。\n\
  \n```cpp\nif ((int)(x / 10) == 0)digits = 1;else if ((int)(x / 100) == 0)digits\
  \ = 2;else if ((int)(x / 1000) == 0)digits = 3;\n```\n\n如果用户提供的整数 `x` 有一位，第一个布尔表达式评估结果为真，剩下的表达式永远不会被检查！如果用户提供的整数有两位，第一个布尔表达式评估结果为假，第二个评估结果为真！最后，如果用户提供的整数有三位，第一个和第二个布尔表达式评估结果为假，最后一个评估结果为真！\n\
  \n这看起来很准确，不是吗？那么问题出在哪里呢？考虑如果练习的措辞是“编写一个 C++ 程序，提示用户输入一个整数，并在提供的整数由两位组成时显示一条消息”。很有可能你会按照如下操作：\n\
  \n```cpp\ncout << \"Enter an integer: \";cin >> x;if ((int)(x / 100) == 0)cout <<\
  \ \"A 2-digit integer\" << endl;\n```\n\n然而，这段代码是有缺陷的！虽然布尔表达式 `(int)(x / 100) ==\
  \ 0` 对于所有两位或以上的用户整数都能正常工作，遗憾的是，它对于一位整数失效了（因为对它们它没有评估为假）。因此，使用整数除法不是正确的方法。正确的答案比你想象的简单得多！\n\
  \n你想到的最小两位数是多少？是 10，对吧？你想到的最大是多少？是 99，对吧？所以，正确的解决方案如下。\n\n```cpp\ncout << \"Enter\
  \ an integer: \";cin >> x;if (x >= 10 && x <= 99)cout << \"A 2-digit integer\" <<\
  \ endl;\n```\n\n根据以上，练习的完整答案如下！\n\n![](img/my_exercise_header.png) project_18.1-2a\n\
  ```cpp\n#include <iostream>\nusing namespace std;\nint main() {\n    int x, digits;\n\
  \    cout << \"Enter an integer (0 - 999): \";\n    cin >> x;\n    if (x >= 0 &&\
  \ x <= 9) {\n        digits = 1;\n    }else if (x >= 10 && x <= 99) {\n        digits\
  \ = 2;\n    }else {\n        digits = 3;\n    }\n    cout << \"You entered a \"\
  \ << digits << \"-digit number\" << endl;\n    return 0;\n}\n```\n\n而且，如果你想让程序更好，并在用户输入不在\
  \ 0 到 999 之间的值时向用户显示错误消息，你可以这样做：\n\n\n\n\n\n![](img/my_exercise_header.png)\n\n\
  # project_18.1-2b\n\n```cpp\n#include <iostream>\nusing namespace std;\nint main()\
  \ {\n    int x;\n    cout << \"Enter an integer (0 - 999): \";\n    cin >> x;\n\
  \    if (x >= 0 && x <= 9) {\n        cout << \"A 1-digit integer entered\" << endl;\n\
  \    } else if (x >= 10 && x <= 99) {\n        cout << \"A 2-digit integer entered\
  \ \" << endl;\n    } else if (x >= 100 && x <= 999) {\n        cout << \"A 3-digit\
  \ integer entered \" << endl;\n    } else {\n        cout << \"Wrong integer\" <<\
  \ endl;\n    }\n    return 0;\n}\n```\n\n### 18.2 复习题：判断对错\n\n判断下列每个陈述的对错性。\n\n\
  1) 多分支决策结构用于扩展备选项的数量。\n2) 多分支决策结构最多可以有三个备选项。\n3) 在多分支决策结构中，一旦某个布尔表达式求值为真，下一个布尔表达式也会求值。\n\
  4) 在多分支决策结构中，最后一个语句或语句块 `N+1`（出现在 `else` 关键字下方）总是会被执行。\n5) 在多分支决策结构中，当之前的至少有一个布尔表达式求值为真时，最后一个语句或语句块\
