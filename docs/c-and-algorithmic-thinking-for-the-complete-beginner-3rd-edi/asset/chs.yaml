  \    }\n    cout << x << \", \" << y << endl;\n    return 0;\n}\n```\n\n3) 使用分支决策结构，编写一个\
  \ C++ 程序，提示用户输入月份数字，然后显示相应的名称（1 为一月，2 为二月，以此此类推）。\n\n4) 使用分支决策结构，编写一个 C++ 程序，显示以下菜单：\n\
