  \ 1 月份是一天、两天甚至更多天低于 36 华氏度。\n\n实际上，有两种方法。让我们来学习这两种方法。\n\n### 第一种方法 – 统计所有低于 36 华氏度的温度\n\
  \n在这种方法中，你可以使用程序中的一个变量来统计温度低于 36 华氏度的天数。在检查完所有天后，程序可以检查该变量的值。如果该值不为零，则意味着至少有一天存在下雪的可能性。\n\
  \n![](img/my_exercise_header.png) project_34.6-2a\n\n```cpp\n#include <iostream>\n\
