  );\n    return gender;\n}\n```\n\n![](img/remember.jpg) 函数的数据类型必须与返回值的数据类型匹配。\n\n\
  ### 第二部分\n\n在第二个虚线矩形中有两个变量，`temp2` 和 `answer`，但它们并不都需要包含在替换该矩形的子程序的形式参数列表中。让我们来看看为什么！\n\
  \n- **变量 `temp2`**：\n    - 在虚线矩形外部未初始化/更新；因此它不应传递给子程序。\n    - 在虚线矩形内初始化/更新，但其值在外部未使用；因此它不应返回给调用者。\n\
  \    - 根据流程图，由于变量 `temp2` 既不需要传递也不需要返回，该变量可以仅仅作为子程序内部的局部变量。\n- **变量 `answer`**：\n\
  \    - 在虚线矩形外部未初始化/更新；因此它不应传递给子程序。\n    - 在虚线矩形内初始化，然后其值在外部被使用；因此它必须返回给调用者。\n\n\
  因此，由于必须向主代码返回一个值，可以使用函数，如所示。\n\n```cpp\n//Second part\nstring getAnswer() {\n  \
  \  string temp2, answer;\n    do {\n        cout << \"Do you go jogging in the afternoon?\
  \ \";\n        cin >> temp2;\n        answer = to_lower_copy(temp2);\n    } while\
