  \ 33.2-1 寻找平均值\n\n有 20 名学生，每个人都收到了 10 节课的成绩。编写一个 C++ 程序，提示用户输入每个学生所有课程的成绩，然后计算并显示每个学生所有大于\
  \ 89 的平均值。\n\n#### 解答\n\n由于你已经学习了逐个处理每一行的两种方法，让我们把两种方法都用上。\n\n##### 第一种方法—— 创建辅助数组\n\
  \n在这种方法中，程序逐个处理每一行，并创建一个辅助数组，其中每个元素存储一行的平均值。下面所示所需的两个数组。\n\n![Image](img/chapter33-03.png)\n\
  \n在创建平均数组后，程序可以找到并显示所有大于 89 的平均值。该 C++ 程序如下。\n\n![](img/my_exercise_header.png)\
  \ \n\n```cpp\nproject_33.2-1a\n#include <iostream>\nusing namespace std;\nconst\
  \ int STUDENTS = 20;\nconst int LESSONS = 10;\nint main() {\n    int i, j;\n   \
  \ int grades[STUDENTS][LESSONS];\n    for (i = 0; i <= STUDENTS - 1; i++) {\n  \
  \      cout << \"For student No. \" << i + 1 << \"...\" << endl;\n        for (j\
  \ = 0; j <= LESSONS - 1; j++) {\n            cout << \"enter grade for lesson No.\
  \ \" << j + 1 << \": \";\n            cin >> grades[i][j];\n        }\n    }\n \
  \   //创建平均数组. 遍历行\n    double average[STUDENTS];\n    for (i = 0; i <= STUDENTS\
  \ - 1; i++) {\n        average[i] = 0;\n        for (j = 0; j <= LESSONS - 1; j++)\
  \ {\n            average[i] += grades[i][j];\n        }\n        average[i] /= LESSONS;\n\
  \    }\n    //显示所有大于 89 的平均值\n    for (i = 0; i <= STUDENTS - 1; i++) {\n      \
  \  if (average[i] > 89) {\n            cout << average[i] << endl;\n        }\n\
  \    }\n    return 0;\n}\n```\n\n##### 第二种方法—— 直接找到并显示！\n\n这种方法不使用辅助数组；它只是计算并直接显示所有大于\
  \ 89 的平均值。该 C++ 程序如下。\n\n![](img/my_exercise_header.png) \n\n```cpp\nproject_33.2-1b\n\
  #include <iostream>\nusing namespace std;\nconst int STUDENTS = 20;\nconst int LESSONS\
  \ = 10;\nint main() {\n    int i, j;\n    double average;\n    int grades[STUDENTS][LESSONS];\n\
  \    for (i = 0; i <= STUDENTS - 1; i++) {\n        cout << \"For student No. \"\
  \ << i + 1 << \"...\" << endl;\n        for (j = 0; j <= LESSONS - 1; j++) {\n \
  \           cout << \"enter grade for lesson No. \" << j + 1 << \": \";\n      \
  \      cin >> grades[i][j];\n        }\n    }\n    //计算每一行的平均值并直接显示大于 89 的值\n  \
  \  for (i = 0; i <= STUDENTS - 1; i++) {\n        average = 0;\n        for (j =\
  \ 0; j <= LESSONS - 1; j++) {\n            average += grades[i][j];\n        }\n\
  \        average /= LESSONS;\n        if (average > 89) {\n            cout << average\
  \ << endl;\n        }\n    }\n    return 0;\n}\n```\n\n### 33.3 逐个处理每一列\n\n逐个处理每一列意味着每一列都被分开处理，每一列的结果（可以是总和、平均值等）都可以被单独用于后续处理。假设你有以下\
  \ 4 × 5 数组。\n\n![Image](img/chapter33-04.png)\n\n和以前一样，让我们尝试单独寻找每一列的和和。同样，你有两种方法可以使用。这两种方法都会遍历列。\n\
  \n##### 第一种方法—— 创建辅助数组\n\n在这种方法中，程序逐个处理每一列，并创建一个辅助数组，其中每个元素存储一列的总和。这种方法赋予了你很大的灵活性，因为你可以在程序的后续部分使用这个新数组进行进一步处理。底部是辅助数组\
  \ `total`。\n\n![Image](img/chapter33-05.png)\n\n现在，让我们编写相应的代码段。为了更容易理解该过程，再次使用了“从内层到外层”的方法。以下代码段计算第一列（列索引\
  \ 0）的和并将结果存储在辅助数组 `total` 中。假设 `j` 包含该值。\n\n```cpp\nfor (j = 0; j <= COLUMNS - 1;\
  \ j++) {\n    total[j] = 0;\n    for (i = 0; i <= ROWS - 1; i++) {\n        total[j]\
  \ += b[i][j];\n    }\n}\n```\n\n这个程序可以等价地写为：\n\n```cpp\nfor (j = 0; j <= COLUMNS\
  \ - 1; j++) {\n    total[j] = 0;\n    for (i = 0; i <= ROWS - 1; i++) {\n      \
  \  total[j] += b[i][j];\n    }\n}\n```\n\n将此代码段嵌套在一个遍历列的 `for` 循环中，结果如下：\n\n```cpp\n\
  for (j = 0; j <= COLUMNS - 1; j++) {\n    total[j] = 0;\n    for (i = 0; i <= ROWS\
  \ - 1; i++) {\n        total[j] += b[i][j];\n    }\n}\n```\n\n##### 第二种方法—— 直接找到并显示\n\
  \n这种方法不使用辅助数组；它只是计算并直接显示总和。代码段如下。\n\n```cpp\nfor (j = 0; j <= COLUMNS - 1; j++)\
  \ {\n    total = 0;\n    for (i = 0; i <= ROWS - 1; i++) {\n        total += b[i][j];\n\
  \    }\n    cout << total;\n}\n```\n\n\n\n\n\n## 33.4 如何在程序中使用多个数据结构\n\n到为止，每个示例或练习都只使用了一个数组或一个无序映射（unordered\
  \ map）。但如果一个问题要求你使用两个数组，或者一个数组和一个无序映射，或者一个数组和两个无序映射呢？接下来你将发现一些练习，它们向你展示如何组合各种数据结构来应对各种挑战。\n\
  \n### 练习 33.4-1 使用三个一维数组\n\n有 20 名学生，每个人都收到了两门课程的成绩。编写一个 C++ 程序，提示用户输入每个学生两门课程的姓名和成绩。程序必须找到并显示所有两门课程成绩都大于\
  \ 89 的学生的姓名。\n\n##### 解决方案\n\n以下是所需的数组，包含一些典型值。\n\n![Image](img/chapter33-07.png)\n\
  \n如你所见，数组 `names` 中的元素与数组 `gradesLesson1` 以及 `gradesLesson2` 中的元素之间存在一一对应的对应关系。20\
  \ 个学生中的第一个学生是 George，他两门课程的成绩分别是 95 和 92 分。名字“George”存储在数组 `names` 的索引 `0` 处，在 `gradesLesson1`\
  \ 和 `gradesLesson2` 数组相同的索引处也存储了他两门课程的成绩。下一个学生（Anna）和她的成绩分别存储在 `names`、`gradesLesson1`\
  \ 和 `gradesLesson2` 数组的索引 `1` 处，以此此类推。\n\n该 C++ 程序如下。\n\n![](img/my_exercise_header.png)\n\
  ```cpp\n#include <iostream>\nusing namespace std;\nconst int STUDENTS = 20;\nint\
  \ main() {\n    int i;\n    string names[STUDENTS];\n    int gradesLesson1[STUDENTS];\n\
  \    int gradesLesson2[STUDENTS];\n    for (i = 0; i <= STUDENTS - 1; i++) {\n \
  \       cout << \"Enter student name No\" << (i + 1) << \": \";\n        cin >>\
  \ names[i];\n        cout << \"Enter grade for lesson 1: \";\n        cin >> gradesLesson1[i];\n\
  \        cout << \"Enter grade for lesson 2: \";\n        cin >> gradesLesson2[i];\n\
  \    }\n    //显示两门课程成绩都大于 89 的学生的姓名\n    for (i = 0; i <= STUDENTS - 1; i++) {\n\
  \        if (gradesLesson1[i] > 89 && gradesLesson2[i] > 89) {\n            cout\
  \ << names[i] << endl;\n        }\n    }\n    return 0;\n}\n```\n\n### 练习 33.4-2\
  \ 使用一维数组配合二维数组\n\n有 10 名学生，每个人都收到了五门课程的成绩。编写一个 C++ 程序，提示用户输入每个学生的姓名和所有课程的成绩，然后计算并显示多有一个成绩大于\
  \ 89 的学生姓名。\n\n##### 解决方案\n\n在这次练习中，你可以像在上一个练习中那样做。例如，你可以使用一个一维数组来存储学生姓名，使用五个一维数组来存储每个学生每门课程的成绩。这并不太方便，但行得通。显然，当成绩超过两个时，这不是最合适的方法。\n\
  \n这里的最佳方法是使用一个一维数组来存储学生姓名，并使用一个二维数组来存储每个学生每门课程的成绩。\n\n实际上有两种方法。使用哪种方法完全取决于你！如果你决定在二维数组中，行代表学生，列代表课程，那么你可以使用下面讨论的第一种方法。如果你决定行代表课程，列代表学生，那么可以使用接下来的第二种方法。\n\
  \n#### 第一种方法——行代表学生，列代表课程\n\n在这种方法中，二维数组必须有 10 行（每行一个学生）和 5 列（每列一门课程）。所有其他数组可以如下所示与该二维数组配合。\n\
  \n![Image](img/chapter33-08.png)\n\n![](img/notice.jpg)辅助数组 `count` 将由程序创建，并存储每个学生大于\
  \ 89 的成绩数量。\n\n现在，让我们看看如何读取值并将它们存储在 `names` 和 `grades` 数组中。一个简单的解决方案是使用一个 `for-loop`\
  \ 读取姓名，然后使用嵌套的 `for-loops` 读取成绩。然而，对于用户来说，先输入所有姓名再输入所有成绩可能并不 Practical 实用。更符合用户习惯的方法是提示用户输入一个学生姓名以及他们所有的成绩，然后处理下一个学生姓名及其相应的成绩，以此此类推。解决方案如下。\n\
  \n![](img/my_exercise_header.png)\n```cpp\n#include <iostream>\nusing namespace\
  \ std;\nconst int STUDENTS = 10;\nconst int LESSONS = 5;\nint main() {\n    int\
  \ i, j;\n    //一次性读取姓名和成绩。遍历 grades 数组中的行\n    string names[STUDENTS];\n    int\
  \ grades[STUDENTS][LESSONS];\n    for (i = 0; i <= STUDENTS - 1; i++) {\n      \
  \  cout << \"Enter name for student No. \" << i + 1 << \": \";\n        cin >> names[i];\n\
  \        for (j = 0; j <= LESSONS - 1; j++) {\n            cout << \"Enter grade\
  \ No. \" << j + 1 << \" for \" << names[i] << \": \";\n            cin >> grades[i][j];\n\
  \        }\n    }\n    //创建 count 数组。遍历行\n    int count[STUDENTS];\n    for (i =\
  \ 0; i <= STUDENTS - 1; i++) {\n        count[i] = 0;\n        for (j = 0; j <=\
  \ LESSONS - 1; j++) {\n            if (grades[i][j] > 89) {\n                count[i]++;\n\
  \            }\n        }\n    }\n    //显示多有一个成绩大于 89 的学生姓名\n    for (i = 0; i <=\
  \ STUDENTS - 1; i++) {\n        if (count[i] > 1) {\n            cout << names[i]\
  \ << endl;\n        }\n    }\n    return 0;\n}\n```\n\n#### 第二种方法——行代表课程，列代表学生\n\
  \n在这种方法中，二维数组必须有 5 行（每行一门课程）和 10 列（每列一个学生）。所有其他数组可以如下所示与该二维数组配合。\n\n![Image](img/chapter33-09.png)\n\
  \n![](img/notice.jpg)辅助数组 `count` 将由程序创建，并存储每个学生大于 89 的成绩数量。\n\n显然，为了创建数组 `count`，程序将遍历列。解决方案如下。\n\
  \n![](img/my_exercise_header.png)\n```cpp\n#include <iostream>\nusing namespace\
  \ std;\nconst int STUDENTS = 10;\nconst int LESSONS = 5;\nint main() {\n    int\
  \ i, j;\n    //一次性读取姓名和成绩。遍历 grades 数组中的列\n    string names[STUDENTS];\n    int\
  \ grades[LESSONS][STUDENTS];\n    for (j = 0; j <= STUDENTS - 1; j++) {\n      \
  \  cout << \"Enter name for student No. \" << j + 1 << \": \";\n        cin >> names[j];\n\
  \        for (i = 0; i <= LESSONS - 1; i++) {\n            cout << \"Enter grade\
  \ No. \" << i + 1 << \" for \" << names[j] << \": \";\n            cin >> grades[i][j];\n\
  \        }\n    }\n    //创建 count 数组。遍历列\n    int count[STUDENTS];\n    for (j =\
  \ 0; j <= STUDENTS - 1; j++) {\n        count[j] = 0;\n        for (i = 0; i <=\
  \ LESSONS - 1; i++) {\n            if (grades[i][j] > 89) {\n                count[j]++;\n\
  \            }\n        }\n    }\n    //显示多有一个成绩大于 89 的学生姓名\n    for (j = 0; j <=\
  \ STUDENTS - 1; j++) {\n        if (count[j] > 1) {\n            cout << names[j]\
  \ << endl;\n        }\n    }\n    return 0;\n}\n```\n\n### 练习 33.4-3 使用数组配合无序映射\n\
  \n有 30 名学生，每个人都收到了某次测试的成绩。编写一个 C++ 程序，提示用户输入每个学生的成绩（字母形式）。然后根据下表显示每个学生百分比形式的成绩。\n\
  \n| 等级 | 百分 |\n| :--- | :--- |\n| A | 90-100 |\n| B | 80-89 |\n| C | 70-79 |\n|\
  \ D | 60-69 |\n| E / F | 0-59 |\n\n##### 解决方案\n\n可以使用 `unordered_map` 来存储给定的表格。该解决方案非常直观，不需要额外的解释。\n\
  \n![](img/my_exercise_header.png)\n```cpp\n#include <iostream>\n#include <unordered_map>\n\
  using namespace std;\nconst int STUDENTS = 30;\nint main() {\n    int i;\n    string\
  \ grade, gradeAsPercentage;\n    unordered_map<string, string> gradesTable = {\n\
  \        {\"A\", \"90-100\"},\n        {\"B\", \"80-89\"},\n        {\"C\", \"70-79\"\
  },\n        {\"D\", \"60-69\"},\n        {\"E\", \"0-59\"},\n        {\"F\", \"\
  0-59\"}\n    };\n    string names[STUDENTS];\n    string grades[STUDENTS];\n   \
  \ for (i = 0; i <= STUDENTS - 1; i++) {\n        cout << \"Enter student name No\"\
  \ << i + 1 << \": \";\n        cin >> names[i];\n        cout << \"Enter grade for\
  \ \" << names[i] << \": \";\n        cin >> grades[i];\n    }\n    for (i = 0; i\
  \ <= STUDENTS - 1; i++) {\n        cout << names[i] << \": \" << gradesTable[grades[i]]\
  \ << endl;\n    }\n    return 0;\n}\n```\n\n\n\n\n\n```cpp\ncin >> names[i];\ncout\
  \ << \"Enter their grade: \";\ncin >> grades[i];\n}\nfor (i = 0; i <= STUDENTS -\
  \ 1; i++) {\n    grade = grades[i];\n    gradeAsPercentage = gradesTable[grade];\n\
  \    cout << names[i] << \"  \" << gradeAsPercentage << endl;\n}\nreturn 0;\n```\n\
  \n![](img/remember.jpg)`unordered_map` 结构定义在库 `unordered_map` 中。它在 C++ 中无法直接访问，因此你需要包含库\
  \ `unordered_map`。\n\n现在，如果你完全理解了上一个 `for-loop` 的工作原理，请看下面的代码段。它与上一个 `for-loop`\
  \ 等效，但执行效率更高，因为它使用的变量更少！\n\n```cpp\nfor (i = 0; i <= STUDENTS - 1; i++) {cout <<\
  \ names[i] << \"  \" << gradesTable[grades[i]] << endl;}\n```\n\n### 33.5 从二维数组创建一维数组\n\
  \n为了更容易理解如何从二维数组创建一维数组，让我们使用一个例子。\n\n编写一个 C++ 程序，从现有的 `3 × 4` 二维数组（如下所示）创建一个包含 12\
  \ 个元素的一维数组，要求如下：二维数组第一列的元素必须放置在一维数组的前三个位置，第二列的元素必须放置在一维数组的接下来的三个位置，依此类推。\n\n二维 `3\
  \ × 4` 数组以及新的一维数组如下所示。\n\n![Image](img/chapter33-10.png)\n\n接下来的 C++ 程序通过遍历列来创建新的一维数组，因为这样操作起来更方便。它使用了示例中给出的现有数组。\n\
  \n![](img/my_exercise_header.png) project_33.5\n```cpp\n#include <iostream>\nusing\
  \ namespace std;\nconst int ROWS = 3;\nconst int COLUMNS = 4;\nconst int ELEMENTS\
  \ = ROWS * COLUMNS;\nint main() {\n    int i, j, k;\n    int a[ROWS][COLUMNS] =\
  \ {\n        {5, 9, 3, 2},\n        {11, 12, 4, 1},\n        {10, 25, 22, 18}\n\
  \    };\n    k = 0;   //这是新数组的索引。\n    int b[ROWS * COLUMNS];\n    for (j = 0; j\
  \ <= COLUMNS - 1; j++) {  //遍历列\n        for (i = 0; i <= ROWS - 1; i++) {\n   \
  \         b[k] = a[i][j];\n            k++;\n        }\n    }\n    for (k = 0; k\
  \ <= ELEMENTS - 1; k++) {\n        cout << b[k] << \"\\t\";\n    }\n    return 0;\n\
  }\n```\n\n### 33.6 从一维数组创建二维数组\n\n为了更容易理解如何从一维数组创建二维数组，让我们使用一个例子。\n\n编写一个 C++ 程序，从现有的包含\
  \ 12 个元素的一维数组（如下所示）创建一个 `3 × 4` 的二维数组，要求如下：一维数组的前三个元素必须放置在二维数组的第一列，一维数组的下三个元素必须放置在二维数组的下一列，依此类推。\n\
  \n12 元素元素的一维数组以及新的二维数组如下所示。\n\n![Image](img/chapter33-11.png)\n\n接下来的 C++ 程序通过遍历列来创建新的二维数组，这种方式更方便。它使用了示例中给出的现有数组。\n\
  \n![](img/my_exercise_header.png) project_33.6\n```cpp\n#include <iostream>\nusing\
  \ namespace std;\nconst int ROWS = 3;\nconst int COLUMNS = 4;\nint main() {\n  \
  \  int k, j, i;\n    int a[] = {5, 11, 10, 9, 12, 25, 3, 4, 22, 2, 1, 18};\n   \
  \ k = 0;       //这是数组 a 的索引。\n    int b[ROWS][COLUMNS];\n    for (j = 0; j <= COLUMNS\
  \ - 1; j++) { //遍历列\n        for (i = 0; i <= ROWS - 1; i++) {\n            b[i][j]\
  \ = a[k];\n            k++;\n        }\n    }\n    for (i = 0; i <= ROWS - 1; i++)\
  \    //遍历行\n        for (j = 0; j <= COLUMNS - 1; j++) {\n            cout << b[i][j]\
  \ << \"\\t\";\n        }\n        cout << endl;\n    }\n    return 0;\n}\n```\n\n\
  ### 33.7 有用的数据结构函数/方法（子程序）\n\n#### 统计元素个数\n\n`sizeof(subject)`\n\n此函数返回任何数组或数组元素的大小（字节字节）。\n\
  \n示例\n\n![](img/my_exercise_header.png) project_33.7a\n```cpp\n#include <iostream>\n\
  using namespace std;\nint main() {\n    int i;\n    int a[] = {3, 6, 10, 12, 4,\
  \ 2, 1};\n    //每个整数通常占用 4 字节\n    cout << sizeof(a) << endl;    //它可能显示: 28\n \
  \   cout << sizeof(a) / sizeof(a[0]) << endl;    //它显示: 7\n    for (i = 0; i <=\
  \ sizeof(a) / sizeof(a[0]) - 1; i++) {\n        cout << a[i] << \"  \";        //它显示:\
  \ 3  6  10  12  4  2  1\n    }\n    int b[3][4] = {\n        {5, 9, 3, 2},\n   \
  \     {11, 12, 4, 1},\n        {10, 25, 22, 18}\n    };\n    cout << sizeof(b) /\
  \ sizeof(b[0]) << endl;          //它显示: 3\n    cout << sizeof(b[0]) / sizeof(b[0][0])\
  \ << endl;    //它显示: 4\n    return 0;\n}\n```\n\n![](img/notice.jpg)在二维数组 `b` 中，`sizeof()`\
  \ 函数可以获取数组的行数或列数。在这个示例中，`sizeof(b) / sizeof(b[0])` 等于值 `3`（三行），而 `sizeof(b[0]) /\
  \ sizeof(b[0][0])` 等于值 `4`（四列）。如果你想获取数组所有维度的元素总数，可以使用商数 `sizeof(b) / sizeof(b[0][0])`，它将等于值\
  \ `12`。\n\n#### 寻找最大值\n\n`max_element(array_name, end(array_name))`\n\n此语句返回数组 `array_name`\
  \ 的最大值。\n\n示例\n\n![](img/my_exercise_header.png) project_33.7b\n```cpp\n#include\
  \ <iostream>\n#include <algorithm>\nusing namespace std;\nint main() {\n    int\
  \ a[] = { 3, 6, 10, 2, 1, 12, 4 };\n    cout << *max_element(a, end(a)) << endl;\n\
  \    string b[] = {\"Apollo\", \"Hermes\", \"Athena\", \"Aphrodite\", \"Dionysus\"\
  };\n    cout << *max_element(b, end(b)) << endl; \n    return 0;\n}\n```\n\n![](img/notice.jpg)函数\
  \ `max_element()` 定义在库 `algorithm` 中。它在 C++ 中无法直接访问，因此你需要包含该库。\n\n#### 寻找最小值\n\n\
  `min_element(array_name, end(array_name))`\n\n此语句返回数组 `array_name` 的最小值。\n\n示例\n\
  \n![](img/my_exercise_header.png) project_33.7c\n```cpp\n#include <iostream>\n#include\
  \ <algorithm>\nusing namespace std;\nint main() {\n    int a[] = {3, 6, 10, 2, 1,\
  \ 12, 4};\n    cout << *min_element(a, end(a)) << endl;\n    string b[] = {\"Apollo\"\
  , \"Hermes\", \"Athena\", \"Aphrodite\", \"Dionysus\"};\n    cout << *min_element(b,\
  \ end(b)) << endl;\n    return 0;\n}\n```\n\n![](img/(notice.jpg)该函数定义在库 `algorithm`\
  \ 中。它在 C++ 中无法直接访问，因此你需要包含该库。\n\n#### 排序数组\n\n`sort(array_name, end(array_name))`\n\
  \n此语句按升序对数组 `array_name` 进行排序。\n\n示例\n\n![](img/my_exercise_header.png) project_33.7d\n\
  ```cpp\n#include <iostream>\n#include <algorithm>\nusing namespace std;\nint main()\
  \ {\n    int i;\n    int a[] = {3, 6, 10, 2, 1, 12, 4};\n    sort(a, end(a));\n\
  \    for (i = 0; i <= sizeof(a) / sizeof(a[0]) - 1; i++) {\n        cout << a[i]\
  \ << \"  \";\n    }\n    string b[] = {\"Hermes\", \"Apollo\", \"Dionysus\"};\n\
  \    sort(b, end(b));\n    for (i = 0; i <= sizeof(b) / sizeof(b[0]) - 1; i++) {\n\
  \        cout << b[i] << \"  \";\n    }\n    return 0;\n}\n```\n\n![](img/notice.jpg)函数\
  \ `sort()` 定义在库 `algorithm` 中。它在 C++ 中无法直接访问，因此你需要包含该库。\n\n#### 统计键\n\n`struct.count(key_name)`\n\
  \n此方法返回无序映射 `struct` 中键 `key_name` 的出现次数。由于无序映射中的所有键都是唯一的，此方法只能返回 1（如果键存在）或 0（如果键不存在）。\n\
  \n示例\n\n![](img/my_exercise_header.png) project_33.7e\n```cpp\n#include <iostream>\n\
  #include <unordered_map>\nusing namespace std;\nint main() {\n    unordered_map<string,\
  \ string> family = {\n        {\"father\", \"John\"},\n        {\"mother\", \"Maria\"\
  },\n        {\"son\", \"George\"},\n        {\"daughter\", \"Helen\"}\n    };\n\
  \    if (family.count(\"father\") == 1) {\n        cout << family[\"father\"] <<\
  \ endl;\n    }\n    if (family.count(\"grandpa\") == 0) {\n        cout << \"No\
  \ grandpa\" << endl;\n    }\n    return 0;\n}\n```\n\n### 33.8 复习习题：真/假\n\n判断以下每个陈述的对错。\n\
