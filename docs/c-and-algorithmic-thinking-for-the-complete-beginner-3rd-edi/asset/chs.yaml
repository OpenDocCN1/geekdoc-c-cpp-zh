  \ `a` 的值从未改变！\n\n## 36.8 复习题：判断对错\n\n对以下每个陈述选择对或错。\n\n1) C++ 中返回返回值的子程序有两类。\n2)\
  \ 用于向函数传递值的变量称为实参数（arguments）。\n3) `abs()` 函数是用户定义函数。\n4) 对用户定义函数的调用方式与调用 C++ 内置函数的方式相同。\n\
  5) 函数的形式参数列表中可以包含你需要的任意数量的参数。\n6) 在函数中，形式参数列表必须至少包含一个参数。\n7) 在函数中，形式参数列表是可选的。\n\
  8) 函数不能返回数组。\n9) 下述语句是有效的 C++ 语句：`return x + 1;`\n10) 形式参数可以是一个表达式。\n11) 实际参数可以是一个表达式。\n\
  12) 函数的实际参数列表中可以没有参数。\n13) 下一语句调用了函数 `cubeRoot()` 三次：`cb = cubeRoot(x) + cubeRoot(x)\
  \ / 2 + cubeRoot(x) / 3;`\n14) 下述代码段显示与语句 `cout << cubeRoot(x) + 5 << endl;` 完全相同的值：`cb\
  \ = cubeRoot(x); y = cb + 5; cout << y << endl;`\n15) 函数必须始终包含返回语句，而 `void` 函数则不需要。\n\
  16) 名字 `play-the-guitar` 可以是一个有效的函数名。\n17) 在 C++ 中，你可以将函数放置在主代码下方。\n18) 当主程序调用函数时，主程序语句的执行会被中断。\n\
  19) 一般而言，函数可以不向调用者返回任何值。\n20) `abs()` 函数是 C++ 的内置函数。\n21) 下述代码段显示值 0.5：\n```cpp\n\
  #include <iostream>\nusing namespace std;\ndouble divide(double b, double a) {\n\
  \    return a / b;\n}\nint main() {\n    double a = 10;\n    double b = 5;\n   \
  \ cout << divide(a, b) << endl;\n    return 0;\n}\n```\n22) 在计算机科学中，不返回结果的子程序被称为\
