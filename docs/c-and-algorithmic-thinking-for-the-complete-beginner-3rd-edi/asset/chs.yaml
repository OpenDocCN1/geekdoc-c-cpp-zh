  ;` | |\n| += | 拼接赋值 | `a += \"Hello\";` | `a = a + \"Hello\";` |\n\n以下代码片段显示“What's\
  \ up, dude?”\n\n```cpp\nstring a, b, c;\na = \"What's \";\nb = \"up, \";\nc = a\
  \ + b;\nc += \"dude?\";\ncout << c << endl;\n```\n\n### 练习 7.6-1 拼接姓名\n\n编写一个 C++\
