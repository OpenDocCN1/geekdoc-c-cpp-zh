  \   if (b[i][j] > maximum[i]) {\n            maximum[i] = b[i][j];\n        }\n\
  \    }\n}\n```\n\n最终的 C++ 程序如下。\n\n![](img/my_exercise_header.png) project_34.3-7a\n\
