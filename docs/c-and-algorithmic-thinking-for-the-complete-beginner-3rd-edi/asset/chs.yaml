  \n[One-dimensional Array]\n\n## 第 34 章\n数据结构进阶\n\n### 34.1 数组简单练习\n\n#### 练习 34.1-1\
  \ 创建一个包含相邻元素平均值的数组\n\n编写一个 C++ 程序，让用户向数组中输入 100 个正整数。然后，程序必须创建一个 98 个元素的新数组。该新数组在每个位置上必须包含当前元素及其后两个元素的平均值。\n\
  \n##### 解决方案\n\n让我们通过 10 个元素的示例来理解这个练习。\n\n[Example Image]\n\n`newArr` 是创建的新数组。在\
  \ `newArr` 中，位置 0 的元素是数组 `b` 中当前元素及其后两个元素的平均值，即 `(5 + 10 + 9) / 3 = 8`。位置 1 的元素是数组\
  \ `b` 中当前元素及其后两个元素的平均值，即 `(10 + 9 + 2) / 3 = 7`，以此此类推。\n\nC++ 程序如下：\n\n```cpp\n\
  #include <iostream>\nusing namespace std;\nconst int ELEMENTS_OF_A = 100;\nconst\
  \ int ELEMENTS_OF_NEW = ELEMENTS_OF_A - 2;\nint main() {\n    int i;\n    double\
  \ a[ELEMENTS_OF_A];\n    for (i = 0; i <= ELEMENTS_OF_A - 1; i++) {\n        cin\
