  \ 罗马数字 |\n| --- | --- |\n| 1 | I |\n| 2 | II |\n| 3 | III |\n| 4 | IV |\n| 5 | V\
  \ |\n| 6 | VI |\n| 7 | VII |\n| 8 | VIII |\n| 9 | IX |\n| 10 | X |\n\n使用分支决策结构，编写一个\
  \ C++ 程序，提示用户输入 1 到 10 之间的数字，然后显示相应的罗马数字。但是，如果输入的数字无效，则必须显示错误信息。\n\n6) 一家在线超市根据客户每月购买的总瓶数向其发放积分。积分规则如下：\n\
