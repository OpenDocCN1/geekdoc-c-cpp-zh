  using namespace std;\nint main() {\n    int i;\n    int values[100];\n    for (i\
  \ = 0; i < 100; i++) {\n        cin >> values[i];\n    }\n    for (i = 99; i >=\
  \ 0; i--) {\n        if (values[i] > 0) {\n            cout << values[i] << endl;\n\
  \        }\n    }\n    return 0;\n}\n```\n\n### 练习 31.7-3 计算平均值\n\n编写一个 C++ 程序，提示用户向数组输入\
