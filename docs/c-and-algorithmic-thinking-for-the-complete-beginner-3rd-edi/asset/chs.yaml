  \ <iostream>\nusing namespace std;\nint main() {\n    int x, y;\n    cin >> x;\n\
  \    cin >> y;\n    if ((x + y) / 2 <= 20) {\n        if (y < 10) {\n          \
  \  x = x % 3;\n            y += 2;\n        } else if (y < 20) {\n            x\
  \ = x * 5;\n            y += 2;\n        } else {\n            x = x - 2;\n    \
