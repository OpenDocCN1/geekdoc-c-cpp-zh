  \n#### 答案 \n\n在本次练习中，需要以下两个数组。\n\n![Image](img/chapter34-07.png)\n\n解决方案很简单。每当变量\
  \ `minimum` 更新其值时，两个变量 `m_i` 和 `m_j` 可以别地存储变量 `i` 和 `j` 的当前值。最后，这两个变量将包含最小值所在位置的行索引和列索引。解决方案如下。\n\
  \n![](img/my_exercise_header.png) project_34.3-6\n```cpp\n#include <iostream>\n\
  using namespace std;\nconst int CITIES = 10;\nconst int DAYS = 31;\nint main() {\n\
