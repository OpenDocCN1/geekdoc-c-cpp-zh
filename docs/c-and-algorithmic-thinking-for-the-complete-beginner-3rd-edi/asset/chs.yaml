  \ 语句写如下。\n\n![](img/my_exercise_header.png) project_26.1d\n```cpp\n#include <iostream>\n\
  using namespace std;\nint main() {\n    int i;\n    i = 10;\n    while (i >= 2)\
  \ {\n        cout << i << endl;\n        i -= 2;\n    }\n    return 0;\n}\n```\n\
  \n接下来的示例使用变量而非常数值 `initial_value`、`final_value` 和 `offset` 来显示了从 `-2` 到 `-10` 的偶数。\n\
  \n![](img/my_exercise_header.png) project_26.1e\n```cpp\n#include <iostream>\nusing\
  \ namespace std;\nint main() {\n    int i;\n    int x1 = -2, x2 = -10, t = -2;\n\
  \    for (i = x1; i >= x2; i += t) {\n        cout << i << endl;\n    }\n    return\
  \ 0;\n}\n```\n\n![](img/notice.jpg)千万不要尝试在循环内部修改 `counter`（此处为 `i`）的值！同样适用于 `initial_value`（此处为\
  \ `x1`）、`final_value`（此处为 `x2`）和 `offset`（此处为 `t`）。这会让你的代码变得不可读，并可能导致错误结果。如果你坚持要这样做，请使用\
  \ `while` 语句代替。\n\n接下来的示例显示了字母“H”、“e”、“l”、“l”和“o”（均不带双引号）。\n\n![](img/my_exercise_header.png)\
  \ project_26.1f\n```cpp\n#include <iostream>\nusing namespace std;\nint main() {\n\
  \    int i;\n    string message = \"Hello\";\n    for (i = 0; i <= message.length()\
  \ - 1; i++) {\n        cout << message[i] << endl;\n    }\n    return 0;\n}\n```\n\
  \n![](img/remember.jpg)`length()` 方法返回变量 `message` 包含的字符数，而 `message[i]` 记法返回字符串变量\
  \ `message` 中指定位置（由变量 `i` 指定）的字符（参见第 14.3 节）。\n\n### 练习 26.1-1 创建追踪表\n\n设计相应的流程图并创建一个追踪表，以确定当输入值为\
  \ `1` 时，下一个代码段在每一步中变量的值。\n\n```cpp\nint a, i;\ncin >> a;\nfor (i = -3; i <= 3; i\
  \ += 2) {\n    a = a * 3;\n}\ncout << i << \"  \" << a;\n```\n\n##### 答案\n\n相应的流程图片段如下。\n\
  \n.![Image](img/chapter26-03.png)\n\n![](img/remember.jpg)你应该始终记住，`for` 循环实际上是一个预测试循环结构！\n\
  \n如果你使用 `while` 语句重写代码片段，结果如下。\n\n```cpp\nint a, i;\ncin >> a;\ni = -3;\nwhile (i\
  \ <= 3) {\n    a = a * 3;\n    i += 2;\n}\ncout << i << \"  \" << a;\n```\n\n现在，为了给\
  \ `for` 语句创建追踪表，你有两个选择：可以使用相应的流程图，或者可以使用使用 `while` 语句编写的等效程序。\n\n| 步骤 | 语句 | 注释\
  \ | a | i | | |\n| --- | --- | --- | --- | --- | --- | --- |\n| 1 | `cin >> a` |\
  \ | 1 | ? | | |\n| 2 | `i = −3` | | 1 | −3 | | |\n| 3 | `i <= 3` | 此求值为 true | 1^(st)\
  \ | 迭代 | | |\n| 4 | `a = a * 3` | | 3 | −3 | | |\n| 5 | `i += 2` | | 3 | −1 | |\
  \ |\n| 6 | `i <= 3` | 此求值为 true | 3 | 2nd | 迭代 | | |\n| 7 | `a = a * 3` | | 9 |\
  \ -1 | | |\n| 8 | `i += 2` | | 9 | 1 | | |\n| 9 | `i <= 3` | 此求值为 true | 9 | 3rd\
  \ | 迭代 | | |\n| 10 | `a = a * 3` | | 27 | 1 | | | |\n| 11 | `i += 2` | | 27 | 3\
  \ | | | |\n| 12 | `i <= 3` | 此求值为 true | 27 | 4th | 迭代 | | |\n| 13 | `a = a * 3`\
  \ | | 81 | 3 | | | |\n| 14 | `i += 2` | | 81 | 5 | | | |\n| 15 | `i <= 3` | 此求值为\
  \ false | 81 | 5 | | | |\n| 16 | `cout << i << \"  \" << a` | | 81 | 5 | 81 | |\
  \ |\n\n*(注：原文中的追踪表值包含一些不一致/逻辑漏洞；上方表格遵循提供代码的逻辑).*\n\n![](img/notice.jpg)注意，当 `counter`（此处为\
  \ `i`）递减时，比较运算符应为 `>=`，当 `counter` 增加时应为 `<=`。\n\n\n\n\n\n### 练习 26.1-5 查找 0 到 N\
  \ 的平方根\n\n编写一个 C++ 程序，提示用户输入一个整数，然后计算并显示从 0 到该用户整数的所有整数的平方根。\n\n##### 答案\n\n这个练习非常直观。用户输入一个整数，程序按照该整数指定的次数进行迭代。C++\
  \ 程序如下。\n\n![](img/my_exercise_header.png) project_26.1-5\n```cpp\n#include <iostream>\n\
  #include <cmath>\nusing namespace std;\nint main() {\n    int num, i;\n    cout\
  \ << \"Enter an integer: \";\n    cin >> num;\n    for (i = 0; i <= num; i++) {\n\
  \        cout << sqrt(i) << endl;\n    }\n    return 0;\n}\n```\n\n### 练习 26.1-6\
  \ 计算 1 + 2 + 3 + … + 100 的和\n\n编写一个 C++ 程序，计算并显示以下求和：\n\n`S = 1 + 2 + 3 + … + 100`\n\
  \n##### 答案\n\n如果你使用序列控制结构来解决这个练习，它将像下面的代码片段。\n\n`s = 0; i = 1; s = s + i; i = i\
  \ + 1; s = s + i; i = i + 1;……s = s + i; i = i + 1;`\n\n让我们使用追踪表来更好地理解它。\n\n| 步骤\
  \ | 语句 | 注释 | i | s |\n| --- | --- | --- | --- | --- |\n| 1 | s = 0 | 0 | ? | 0\
  \ |\n| 2 | i = 1 | | 1 | 0 |\n| 3 | s = s + i | 0 + 1 = 1 | 1 | 1 |\n| 4 | i = i\
  \ + 1 | | 2 | 1 |\n| 5 | s = s + i | 0 + 1 + 2 = 3 | 2 | 3 |\n| 6 | i = i + 1 |\
  \ | 3 | 3 |\n| 7 | s = s + i | 0 + 1 + 2 + 3 = 6 | 3 | 6 |\n| 8 | i = i + 1 | |\
  \ 4 | 6 |\n| ... | … | | … | … |\n| ... | … | | … | … |\n| 199 | s = s + i | | 99\
  \ | 4950 |\n| 200 | i = i + 1 | | 100 | 4950 |\n| 201 | s = s + i | 0 + 1 + 2 +\
  \ 3 + …+ 99 + 100 = 5050 | 100 | 5050 |\n| 202 | i = i + 1 | | 101 | 5050 |\n\n\
  现在一切都清楚了，你可以做同样的事情，这次使用一个变量 `i` 每次增 1 的 for 循环。\n\n![](img/my_exercise_header.png)\
  \ project_26.1-6\n```cpp\n#include <iostream>\nusing namespace std;\nint main()\
  \ {\n    int s, i;\n    s = 0;\n    for (i = 1; i <= 100; i++) {\n        s = s\
  \ + i;\n    }\n    cout << s << endl;\n    return 0;\n}\n```\n\n### 练习 26.1-7 查找\
  \ 2 × 4 × 6 × 8 × 10 的积\n\n编写一个 C++ 程序，计算并显示以下乘积：\n\n`P = 2 × 4 × 6 × 8 × 10`\n\n\
  ##### 答案\n\n让我们使用下面的序列控制结构来解决这个练习。变量 `p` 必须初始化为 1 而不是 0。这是为了语句 `p = p * i` 能够正常运行所必要的；否则最终的乘积将为零。\n\
  \n`p = 1; i = 2; p = p * i; i += 2; p = p * i; i += 2; p = p * i; i += 2; p = p\
  \ * i; i += 2; p = p * i; i += 2;`\n\n与上一个练习（练习 26.1-6）一样，这个序列控制结构可以替换为 for 循环，如下。\n\
  \n![](img/my_exercise_header.png) project_26.1-7\n```cpp\n#include <iostream>\n\
  using namespace std;\nint main() {\n    int p, i;\n    p = 1;\n    for (i = 2; i\
  \ <= 10; i += 2) {\n        p = p * i;\n    }\n    cout << p << endl;\n    return\
  \ 0;\n}\n```\n\n### 练习 26.1-8 查找 2² + 4² + 6² + … (2N)² 的和\n\n编写一个 C++ 程序，让用户输入整数\
  \ `N`，然后计算并显示以下和：\n\n`S = 2² + 4² + 6² + … (2N)²`\n\n##### 答案\n\n在这个练习中，变量 `i` 必须递增\
  \ 2。但在每次迭代中，它的值在累加到变量 `s` 之前必须先进行平方运算。最终的 C++ 程序如下。\n\n![](img/my_exercise_header.png)\
  \ project_26.1-8\n```cpp\n#include <iostream>\n#include <cmath>\nusing namespace\
  \ std;\nint main() {\n    int N, i;\n    double s;\n    cin >> N;\n    s = 0;\n\
  \    for (i = 2; i <= 2 * N; i += 2) {\n        s = s + pow(i, 2);\n    }\n    cout\
  \ << s << endl;\n    return 0;\n}\n```\n\n### 练习 26.1-9 查找 3³ + 6⁶ + 9⁹ + … (3N)^(3N)\
  \ 的和\n\n编写一个 C++ 程序，让用户输入整数 `N`，然后计算并显示以下和：\n\n`S = 3³ + 6⁶ + 9⁹ + …+ (3N)^(3N)`\n\
  \n##### 答案\n\n这与上一个练习几乎相同。唯一的区别是变量 `i` 在累加到变量 `s` 之前必须先进行 `i` 次方幂运算。使用 for 循环，最终的\
  \ C++ 程序如下。\n\n![](img/my_exercise_header.png) project_26.1-9\n```cpp\n#include\
  \ <iostream>\n#include <cmath>\nusing namespace std;\nint main() {\n    int N, i;\n\
  \    double s;\n    cin >> N;\n    s = 0;\n    for (i = 2; i <= 2 * N; i += 2) {\n\
  \        s = s + pow(i, i);\n    }\n    cout << s << endl;\n    return 0;\n}\n```\n\
  \n### 练习 26.1-10 查找正数的平均值\n\n编写一个 C++ 程序，让用户输入 100 个数字，然后计算并显示平均值。\n\n##### 答案\n\
  \n由于你已经知道总迭代次数，可以使用 for 循环。但在循环内部，必须使用选择结构来检查用户提供的数字是否为正数；如果是，则将用户提供的数字累加到变量 `s`\
  \ 中。变量 `count` 计算正数的。当执行流退出循环时，可以计算平均值。C++ 程序如下。\n\n![](img/my_exercise_header.png)\
  \ project_26.1-10\n```cpp\n#include <iostream>\nusing namespace std;\nint main()\
  \ {\n    int count, i;\n    double s, x;\n    s = 0;\n    count = 0;\n    for (i\
  \ = 1; i <= 100; i++) {\n        cin >> x;\n        if (x > 0) {\n            s\
  \ = s + x;\n            count++;\n        }\n    }\n    if (count != 0) {\n    \
  \    cout << s / count << endl;\n    } else {\n        cout << \"No positive numbers\
  \ entered!\" << endl;\n    }\n    return 0;\n}\n```\n\n**注意：** `if (count != 0)`\
  \ 是必要的，因为用户可能只输入负值（零）。包含此检查可以防止除零错误，从而满足确定性。\n\n### 练习 26.1-11 统计元音\n\n编写一个 C++\
  \ 程序，提示用户输入一条消息，然后统计并显示消息中包含的元音数量。\n\n##### 答案\n\n下面的 C++ 程序统计英语消息中的元音。for 循环遍历消息包含的所有字符。单分支选择结构在每次迭代中检查一个字符，如果是元音，变量\
  \ `count` 增加一。\n\n![](img/my_exercise_header.png) project_26.1-11\n```cpp\n#include\
  \ <iostream>\n#include <boost/algorithm/string.hpp>\nusing namespace boost::algorithm;\n\
  using namespace std;\nint main() {\n    string message;\n    char character;\n \
  \   string vowels = \"AEIOU\";\n    int i, count;\n    cout << \"Enter an English\
  \ message: \";\n    getline(cin, message);\n    message = to_upper_copy(message);\n\
  \    count = 0;\n    for (i = 0; i <= message.length() - 1; i++) {\n        character\
  \ = message[i];\n        if (vowels.find(character) != -1) {\n            count++;\n\
  \        }\n    }\n    cout << \"Vowels: \" << count << endl;\n    return 0;\n}\n\
  ```\n\n### 26.2 适用于 for 循环的规则\n\n在编写 for 循环程序时，必须始终遵循某些规则，因为它们可以帮助你避免不良的副作用。\n\n\
  \n\n\n\n- **规则 1**：计数变量可以出现在循环内部的语句中，但其值绝不能被修改（参见随后的练习 26.2-1）。如果 `final_value`\
  \ 和 `offset` 是变量而非常量值，则适用相同规则。\n- **规则 2**：`offset` 绝不能为零。如果将其设置为零，循环将执行无限次迭代（参见随后的练习\
  \ 26.2-2）。\n- **规则 3**：如果 `initial_value` 小于 `final_value`，则 `offset` 必须为正数；如果是负数，循环将执行零次迭代（参见随后的练习\
  \ 26.2-3）。然而，在某些情况下，故意违反这一规则是有有用的。\n- **规则 4**：如果 `initial_value` 大于 `final_value`，则\
  \ `offset` 必须为负数；如果是正数，循环将执行零次迭代（参见随后的练习 26.2-4）。然而，在某些情况下，故意违反这一规则是有用的。\n\n####\
  \ 练习 26.2-1 统计迭代总数\n\n以下代码片段执行了多少次迭代？\n\n```cpp\nfor (i = 5; i <= 10; i++) {cout\
  \ << i;i--;}\n```\n\n##### 解答\n\n此代码片段违反了 for 循环的第一条规则，该规则规定计数变量可以出现在循环内部的语句中，但其值绝不能被修改。下面所示流程图片段可以帮助你更好地理解实际情况。\n\
  \n![Image](img/chapter26-05.png)\n\n如所示，由于变量 `i` 的初始值 5 小于 10，执行流进入了循环。但在循环内部，语句\
  \ `i ← i - 1` 取消了语句 `i ← i + 1`，导致变量 `i` 不递增，从而永远无法达到 `final_value` 10。因此，该循环执行了无限次迭代。\n\
  \n![](img/remember.jpg)与计数变量类似，如果 `final_value` 和 `offset` 是变量而非常量值，它们的值在循环内部绝不能被修改。\n\
  \n#### 练习 26.2-2 统计迭代总数\n\n以下代码片段执行了多少次迭代？\n\n```cpp\nfor (i = 5; i <= 10; i +=\
  \ 0) {cout << i;}\n```\n\n##### 解答\n\n此代码片段违反了 for 循环的第二条规则，该规则规定 `offset` 绝不能为零。随后的流程图片段可以帮助你更好地理解实际情况。\n\
  \n![Image](img/chapter26-06.png)\n\n如所示，由于变量 `i` 的初始值小于 10，执行流进入了循环。然而，语句 `i ← i\
  \ + 0` 永远不会增加变量 `i`，这意味着它永远无法达到 `final_value` 10。因此，循环执行了无限次迭代。\n\n![](img/remember.jpg)offset\
  \ 绝不能为零。\n\n#### 练习 26.2-3 统计迭代总数\n\n以下代码片段执行了多少次迭代？\n\n```cpp\nfor (i = 5; i >=\
  \ 10; i--) {cout << i;}\n```\n\n##### 解答\n\n此代码片段违反了 for 循环的第三条规则，该规则规定如果 `initial_value`\
  \ 小于 `final_value`，则 `offset` 必须为正数；如果是负数，循环将执行零次迭代。随后的流程图片段可以帮助你更好地理解实际情况。\n\n\
  ![Image](img/chapter26-07.png)\n\n![](img/remember.jpg)计数器递减时，比较运算符应为 `≥`，计数器递增时应为\
  \ `≤`。\n\n当执行流到达循环控制结构时，值 5 被赋值给变量 `i`。然而，布尔表达式为假，执行流从未进入循环！因此，循环执行了零次迭代。\n\n![](img/notice.jpg)for\
  \ 循环实际上是一种预测试循环结构。正因如此，它可能会执行零次到多次迭代。\n\n![](img/remember.jpg)在某些情况下，故意违反 for 循环的第三条规则是有用的。\n\
  \n#### 练习 26.2-4 统计迭代总数\n\n以下代码片段执行了多少次迭代？\n\n```cpp\nfor (i = 10; i <= 5; i++)\
  \ {cout << i;}\n```\n\n##### 解答\n\n此代码片段违反了 for 循环的第四条规则，该规则规定如果 `initial_value`\
  \ 大于 `final_value`，则 `offset` 必须为负数；如果是正数，循环将执行零次迭代。随后的流程图片段可以帮助你更好地理解实际情况。\n\n\
  ![Image](img/chapter26-08.png)\n\n![](img/remember.jpg)计数器递增时，比较运算符应为 `≤`，计数器递减时应为\
  \ `≥`。\n\n当执行流到达循环控制结构时，值 10 被赋值给变量 `i`。然而，布尔表达式为假，执行流从未进入循环！因此，循环执行了零次迭代。\n\n![](img/remember.jpg)在某些情况下，故意违反\
  \ for 循环的第四条规则是有用的。\n\n#### 练习 26.2-5 N 个数的和\n\n编写一个 C++ 程序，提示用户输入 N 个数，计算并显示它们的和。N\
  \ 的值在程序开始时提供。\n\n##### 解答\n\n解决方案所示。\n\n![](img/my_exercise_header.png) project_26.2-5\n\
  \n```cpp\n#include <iostream>\nusing namespace std;\nint main() {\n    int n, i;\n\
  \    double a, total;\n    cout << \"Enter quantity of numbers: \";\n    cin >>\
  \ n;\n    total = 0;\n    for (i = 1; i <= n; i++) {\n        cout << \"Enter number\
  \ \" << i << \": \";\n        cin >> a;\n        total += a; //这等同于 total + a\n\
  \    }\n    cout << \"Sum: \" << total << endl;\n    return 0;\n}\n```\n\n![](img/notice.jpg)尽管违反了\
  \ for 循环的第四条规则，在这种情况下非常有用。如果用户为变量输入非正值，for 语句执行零次迭代。\n\n### 26.3 复习题：判断题\n\n判断下列陈述对错。\n\
  \n1) 在 for 语句中，计数器在每次循环结束时自动递增或减少。\n2) 当迭代次数已知时可以使用确定循环。\n3) 在确定循环中，循环语句或语句块至少执行一次。\n\
  4) 在 for 循环中，initial_value 不大于 final_value。\n5) 当执行流退出 for 循环时，计数器等于 final_value。\n\
  6) 在 for 循环中，initial_value、final_value 和 offset 的值可以是整数或浮点数。\n7) 在 for 循环中，当 offset\
  \ 设置为零时，循环执行零次迭代。\n8) 在 for 循环中，计数变量可以出现在循环内部的语句中，但其值绝不能被修改。\n9) 在 for 循环中，在某些情况下\
  \ offset 可以为零。\n10) 在以下代码片段中，单词“Hello”显示 10 次：`for (i = 0; i <= 10; i++) {cout <<\
  \ \"Hello\" << endl;}`\n11) 下述代码片段满足有限性：`cin >> b;for (i = 0; i <= 8; i += b) {cout\
  \ << \"Hello\" << endl;}`\n12) 下述代码片段满足确定性：`int i;for (i = -10; i <= 10; i++) {cout\
  \ << sqrt(i) << endl;}`\n\n### 26.4 复习题：单选题\n\n为每个陈述选择正确答案。\n\n\n\n\n\n# 循环练习\n\n\
  1) 使用 `for` 语句的确定次数循环：\na) 执行次数比等价的先测试循环结构（使用 `while` 语句）多一次。\nb) 执行的次数比等价的先测试循环结构（使用\
  \ `while` 语句）少一次。\nc) 以上都不是。\n\n2) 使用 `for` 语句的确定次数循环可以用于以下问题：\na) 用户重复输入数字直到输入值\
  \ `-1` 为止。\nb) 用户重复输入数字直到所输入的值大于 `final_value` 为止。\nc) 以上都是。\nd) 以上都不是。\n\n3) 在\
