  \ < $70 | 5% |\n| $70 ≤金额 < 150 | 10% |\n| $150 ≤金额 | 20% |\n\nC++ 程序如下：\n\n[此处省略重复的原文和已翻译代码块，与上方逻辑一致，但由于输入文本存在严重重复错误，建议用户重新提供清晰文本]\n\
