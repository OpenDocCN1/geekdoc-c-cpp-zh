  \n### 12.1 编写复杂的数学表达式\n\n在 [第 7.2 节] 中你学习了所有算术运算符，但对如何使用它们以及如何编写自己的复杂数学表达式了解较少。在本章中，你将学习将数学表达式转换为\
  \ C++ 语句有多简单。\n\n算术运算符遵循与数学中相同的优先级规则，这意味着先执行乘法和除法，再执行加减法。此外，当乘法和除法同时出现在同一个表达式中时，由于它们的优先级相同，这些操作从左到右执行。\n\
  \n`pow()` 函数具有双重作用。除了用于计算一个数值对于另一个数值的幂外，它还用于使用已知的数学公式计算数的任何根。例如，你可以写 `y = pow(x,\
  \ 1 / 3.0)` 来计算 `x` 的立方根，或者写 `y = pow(x, 1 / 5.0)` 来计算 `x` 的五次方。\n\n#### 练习 12.1-1\
  \ 在 C++ 中表示数学表达式\n\n下列哪项 C++ 语句正确表示了以下数学表达式？\n\ni) `x = 1 * 27 / 10 + z;`\nii) `x\
  \ = 1 · 27 / (10 + z);`\niii) `x = 27 / 10 + z;`\niv) `x = 27 / (10 + z);`\nv) `x\
  \ = (1 / 10 + z) * 27;`\nvi) `x = 1 / ((10 + z) * 27);`\nvii) `x = 1 / (10 + z)\
  \ * 27;`\nviii) `x = 1 / (10 + z) / 27;`\n\n解答\n\ni) 错误。由于乘法和除法在加法之前执行，这等同于 ...\n\
  ii) 错误。乘法必须使用星号。\niii) 错误。由于除法在加法之前执行，这等同于 ...\niv) 正确。这等同于 ...\nv) 错误。在括号内部，除法在加法之前执行。这等同于\
  \ ...\nvi) 错误。括号首先执行，这等同于 ...\nvii) 正确。除法在乘法之前执行（从左到右）。先计算项 ...，然后将结果乘以 27。\nviii)\
  \ 错误。这等同于 ...\n\n#### 练习 12.1-2 在 C++ 中编写数学表达式\n\n编写一个 C++ 程序来计算该数学表达式。\n\n解答\n\n\
  首先，你必须区分数据输入和输出结果。显然，输出结果被赋值给 `y`，用户必须输入 `x` 和 `z` 的值。该练习的解法如下所示。\n\n```cpp\n#include\
  \ <iostream>\nusing namespace std;\nint main() {\n    double x, y, z;\n    cin >>\
  \ x >> z;\n    y = 10 * x - (10 - z) / 4;\n    cout << \"The result is: \" << y\
  \ << endl;\n    return 0;\n}\n```\n\n#### 练习 12.1-3 在 C++ 中编写复杂的数学表达式\n\n编写一个 C++\
  \ 程序来计算该数学表达式。\n\n假设用户只输入正值 `x`、`w` 和 `z`。\n\n解答\n\n哎！现在表达式更复杂了！事实上，它复杂得多！所以，让我们来看完全不同的方法。主要思想是将复杂的表达式拆分为更小的、简单的表达式，并将每个子结果赋值给临时变量。最后，你可以使用所有临时变量构建原始表达式！这种方法如下所示。\n\
  \n```cpp\n#include <iostream>\nusing namespace std;\nint main() {\n    double denominator,\
  \ nominator, temp1, temp2, temp3, w, x, y, z;\n    cin >> x >> w >> z;\n    temp1\
  \ = 3 * x * x + 5 * x + 2;\n    temp2 = 7 * w + 1 / z;\n    temp3 = (3 + x) / 7;\n\
  \    nominator = 5 * temp1 / temp2 + z;\n    denominator = 4 * temp3;\n    y = nominator\
  \ / denominator;\n    cout << \"The result is: \" << y << endl;\n    return 0;\n\
  }\n```\n\n\n\n\n你可能会：“好吧，但我浪费了这么多变量，而且众所周知，每个变量都占用主内存的一部分。我该如何将原始表达式写在一行内并减少内存浪费呢？”\n\
  \n这项工作对于高级程序员来说可能小菜一碟，但对你来说呢？对新手程序员来说？\n\n下一个方法将帮助你编写即使是最复杂的数学表达式，也不会出现任何语法或逻辑错误！规则非常简单：“在将复杂表达式拆分为更小、更简单的表达式并将每个子结果赋值给临时变量后，从后开始，将每个变量替换为其赋值的表达式。但注意！当你将变量替换为其赋值的表达式时，必须始终用括号包裹该表达式！”\n\
  \n感到困惑吗？别担心！操作起来更简单。让我们尝试重写之前的 C++ 程序。从后往前，将变量 `nominator` 和 `denominator` 替换为它们的赋值表达式。结果是：\n\
  \n![Image](img/chapter12-11.png)\n\n![](img/notice.jpg)注意添加的额外括号。\n\n现在你必须将变量 `temp1`、`temp2`\
  \ 和 `temp3` 替换为它们的赋值表达式，单行表达式完成了！\n\n![Image](img/chapter12-12.png)\n\n最后看起来可能很吓，但其实并没有那么，不是吗？\n\
  \n现在可以重写 C++ 程序了：\n\n![](img/my_exercise_header.png)\n\n```cpp\n#include <iostream>\n\
  using namespace std;\nint main() {\n    double w, x, y, z;\n    cin >> x >> w >>\
  \ z;\n    y = (5 * (3 * x * x + 5 * x + 2) / (7 * w + 1 / z) + z) / (4 * ((3 + x)\
  \ / 7));\n    cout << \"The result is: \" << y << endl;\n    return 0;\n}\n```\n\
