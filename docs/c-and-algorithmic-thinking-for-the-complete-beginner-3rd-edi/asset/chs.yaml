  \ w2 >> w3 >> w4;\n    //Memorize the weight of the first man\n    minimum = w1;\n\
  \    //If second man is lighter, forget previous\n    //value and memorize his weight\n\
  \    if (w2 < minimum) {\n        minimum = w2;\n    }\n    //If third man is lighter,\
  \ forget previous\n    //value and memorize his weight\n    if (w3 < minimum) {\n\
  \        minimum = w3;\n    }\n    //If fourth man is lighter, forget previous\n\
  \    //value and memorize his weight\n    if (w4 < minimum) {\n        minimum =\
