  ```\n\n![](img/notice.jpg)处理数组大小的一种非常好策略是使用常量。\n\n### 练习 31.7-1 反序显示单词\n\n编写一个 C++\
  \ 程序，让用户输入 20 个单词。程序必须按照它们提供的顺序的完全相反顺序显示这些单词。\n\n##### 解决方案\n\n数组非常适合此类问题。以下是一个合适的解决方案。\n\
