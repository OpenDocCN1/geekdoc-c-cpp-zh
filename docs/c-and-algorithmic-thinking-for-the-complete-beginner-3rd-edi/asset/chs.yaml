  \ `cin` 读取字符串意味着始终读取单个单词，而不是短语或整个句子。要读取两个或多个单词，可以使用 `getline()` 函数。\n\n#### 练习 23.5-4：数字是回文吗？\n\
  \n回文是指在反转数字后保持不变的数字。例如，数字 13631 就是回文。编写一个 C++ 程序，让用户输入五位整数，并测试该数字是否为回文。此外，当用户输入浮点数或任何少于或大于五位的整数时，必须为每种输入错误显示不同的错误信息。\n\
  \n（注意这涉及到数据验证！）\n\n##### 解决方案\n\n实际上有两种不同的方法！第一种是将数字位拆分为五个不同的变量，而第二种是将数字视为字符串处理。让我们分析一下这两种！\n\
  \n###### 第一种方法\n\n要测试用户输入的是回文数字，你需要像在第 13 章中学习的那样，将其位拆分为五个不同的变量。然后，你可以检查第 1 位是否等于第\
  \ 5 位，第 2 位是否等于第 4 位。如果结果为真，则该数字是回文。\n\n为了验证数据输入，你需要检查用户是否输入了五位数数字。记住，所有五位数数字都在\
  \ 10000 到 99999 之间。因此，你可以将数据输入限制在这个范围内。\n\n为了显示许多不同的错误信息，最佳实践是使用多重分支决策结构，首先检查所有情况的数据输入有效性，然后尝试解决所需的问题。例如，如果你需要检查各种错误，可以像如下：\n\
  \n![Image](img/chapter23-23.png)\n\n此处显示了最终的 C++ 程序。\n\n![](img/my_exercise_header.png)\
  \ project_23.5-4a\n```cpp\n#include <iostream>\nusing namespace std;\nint main()\
  \ {\n    int digit1, r, digit2, digit3, digit4, digit5;\n    double x;\n    cin\
  \ >> x;\n    if (x != (int)x) {\n        cout << \"You entered a float\" << endl;\n\
  \    } else if (x < 10000) {\n        cout << \"You entered less than five digits\"\
  \ << endl;\n    } else if (x > 99999) {\n        cout << \"You entered more than\
  \ five digits\" << endl;\n    } else {\n        // 将 x 的位拆分为 5 个不同的变量\n        digit1\
  \ = (int)(x / 10000);\n        r = (int)x % 10000;\n        digit2 = (int)(r / 1000);\n\
  \        r = r % 1000;\n        digit3 = (int)(r / 100);\n        r = r % 100;\n\
  \        digit4 = (int)(r / 10);\n        digit5 = r % 10;\n        if (digit1 ==\
  \ digit5 && digit2 == digit4) {\n            cout << \"Palindrome\" << endl;\n \
  \       } else {\n            cout << \"Not Palindrome\" << endl;\n        }\n \
  \   }\n    return 0;\n}\n```\n\n### 第二种方法\n\n这种方法将数字视为字符串。它比较第一个字符和最后一个字符，以及第二个字符和倒数第二个字符。如果它们相等，意味着该数字是回文。此处显示了\
  \ C++ 程序。\n\n![](img/my_exercise_header.png) project_23.5-4b\n```cpp\n#include <iostream>\n\
