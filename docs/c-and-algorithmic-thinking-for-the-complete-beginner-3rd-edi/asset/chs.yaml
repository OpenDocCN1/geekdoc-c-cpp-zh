  \n### 练习 34.5-10 在二维数组的每一列中进行搜索\n\n编写一个 C++ 程序，提示用户输入 10 个国家的名称、每个国家 20 个重要的历史事件（每个事件的简要描述）以及每个事件对应的年份。随后，该\
