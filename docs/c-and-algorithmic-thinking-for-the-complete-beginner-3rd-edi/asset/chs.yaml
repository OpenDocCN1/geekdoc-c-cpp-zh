  \n### 练习 31.7-2 反序显示正数\n\n编写一个 C++ 程序，让用户向数组输入 100 个数字。然后它仅按照用户提供的顺序的完全相反顺序显示正数。\n\
  \n##### 解决方案\n\n在这次练习中，程序必须接受用户的所有值并将它们存储在数组中。然而，在负责显示数组元素的 `for`-循环内部，必须使用嵌套的决策控制结构来检查并仅显示正值。解决方案如下。\n\
