  \ for 循环中，如下所示。\n\n```cpp\nfor (i = 0; i <= ROWS - 1; i++) {\n    minimum[i] = b[i][0];\n\
  \    maximum[i] = b[i][0];\n    for (j = 1; j <= COLUMNS - 1; j++) {\n        if\
