  \ <iostream>\nusing namespace std;\nint main() {\n    double x;\n    cin >> x;\n\
  \    if (x < 0) {\n        x = (-1) * x;\n    }\n    cout << x << endl;\n    return\
  \ 0;\n}\n```\n\n#### 第二种方法——使用 abs() 函数\n\n在这种情况下，你只需要几行代码，不需要任何决策控制结构！\n\n![](img/my_exercise_header.png)\
