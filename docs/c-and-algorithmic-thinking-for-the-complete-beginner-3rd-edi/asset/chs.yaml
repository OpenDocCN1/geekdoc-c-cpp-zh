  \ firstNm[i] << endl;\n    }\n    return 0;\n}\n```\n\n#### 练习 34.4-5 二维数组的排序\n\n\
  编写一个代码段，将二维数组的每一列都按升序排序。\n\n##### 解决方案\n\n二维数组的一个示例如下。\n\n![Image](img/chapter34-17.png)\n\
  \n由于该数组有七列，因此冒泡排序算法需要执行七次，每列执行一次。因此，整个冒泡排序算法应该嵌套在一个循环七次的 `for` 循环中。\n\n但让我们按照正确的顺序来。使用“从内层到外层”的方法，下一个代码段仅排序二维数组\
  \ `a` 的第一列（列索引 0）。假设变量 `j` 包含值 0。\n\n```cpp\nfor (m = 1; m <= ROWS - 1; m++) {\n\
  \    for (n = ROWS - 1; n >= m; n--) {\n        if (a[n][j] < a[n - 1][j]) {\n \
  \           temp = a[n][j];\n            a[n][j] = a[n - 1][j];\n            a[n\
  \ - 1][j] = temp;\n        }\n    }\n}\n```\n\n现在，为了排序所有列，你可以将此代码段嵌套在一个遍历所有列的 `for`\
  \ 循环中，如下：\n\n```cpp\nfor (j = 0; j <= COLUMNS - 1; j++) {\n    for (m = 1; m <=\
  \ ROWS - 1; m++) {\n        for (n = ROWS - 1; n >= m; n--) {\n            if (a[n][j]\
  \ < a[n - 1][j]) {\n                temp = a[n][j];\n                a[n][j] = a[n\
  \ - 1][j];\n                a[n - 1][j] = temp;\n            }\n        }\n    }\n\
  }\n```\n\n这并没有那么困难，对吧？\n\n#### 练习 34.4-6 修改后的冒泡排序算法 – 排序一维数组\n\n编写一个 C++ 程序，让用户输入\
  \ 20 个人的体重，然后显示三个最重和三个最轻的体重。使用修改后的冒泡排序算法。\n\n##### 解决方案\n\n为了解决这个练习，C++ 程序可以按升序排序用户提供的数据，然后显示索引位置\
  \ `17`、`18` 和 `19` 处的元素（三个最重的）以及索引位置 `0`、`1` 和 `2` 处的元素（三个最轻的）。但那个修改版的冒泡排序算法是什么，它是如何工作的呢？假设你有下面这样一个包含六个人体重的数组。\n\
  \n![Image](img/chapter34-18.png)\n\n如果你仔细观察，你可以自己确认不在正确位置的元素只有索引位置 `3` 和 `4` 处的元素。如果你交换它们的值，数组\
  \ `w` 立即就会变为有序！遗憾的是，冒泡排序算法并不是这样工作的。对于这个给定的六元素元素数组，无论如何它都将执行五轮遍历，总共进行 ![Image](img/chapter34-19.png)\
  \ 次比较，其中 `N` 是数组元素的总数。对于较大的数组，冒泡排序算法执行的比较次数呈指数级增长！例如，对于一个包含 1000 个元素的数组，冒泡排序算法执行了\
  \ 499,500 次比较！\n\n当然，修改后的冒泡排序算法可以通过如下方式克服这种情况：如果执行了完整的遍历且没有发生任何交换，则说明数组现在有序，不需要继续进行遍历。为了实现这一点，C++\
  \ 程序可以使用标记变量来指示是否发生了任何交换。在每次遍历开始时，可以给标记变量赋值 `false`；当发生交换时，赋值 `true`。如果遍历结束时，标记仍为\
  \ `false`，则说明没有发生任何交换，因此必须停止迭代。修改后的冒泡排序如接下来所示。\n\n```cpp\nfor (m = 1; m <= ELEMENTS\
  \ - 1; m++) {\n    swaps = false; //给变量 swaps 赋值 false\n    for (n = ELEMENTS -\
  \ 1; n >= m; n--) //执行新轮遍历\n        if (w[n] < w[n - 1]) {\n            temp = w[n];\n\
  \            w[n] = w[n - 1];\n            w[n - 1] = temp;\n            swaps =\
  \ true;\n        }\n    }\n    //如果变量 swaps 仍为 false，则在此轮遍历中没有发生交换。停止迭代！\n    if\
  \ (!swaps) break;\n}\n```\n\n接下来是最终的 C++ 程序。\n\n![](img/my_exercise_header.png)\
  \ project_34.4-6 \n\n```cpp\n#include <iostream>\nusing namespace std;\nconst int\
  \ ELEMENTS = 20;\nint main() {\n    int i, m, n;\n    bool swaps;\n    double temp;\n\
  \    double w[ELEMENTS];\n    for (i = 0; i <= ELEMENTS - 1; i++) {\n        cin\
  \ >> w[i];\n    }\n    for (m = 1; m <= ELEMENTS - 1; m++) {\n        swaps = false;\n\
  \        for (n = ELEMENTS - 1; n >= m; n--) {\n            if (w[n] < w[n - 1])\
  \ {\n                temp = w[n];\n                w[n] = w[n - 1];\n          \
  \      w[n - 1] = temp;\n                swaps = true;\n            }\n        }\n\
  \        if (!swaps) break;\n    }\n    cout << \"The heaviest weights are:\" <<\
  \ endl;\n    cout << w[ELEMENTS - 3] << \"  \" << w[ELEMENTS - 2] << \"  \" << w[ELEMENTS\
  \ - 1] << endl;\n    cout << \"The lightest weights are:\" << endl;\n    cout <<\
  \ w[0] << \"  \" << w[1] << \"  \" << w[2] << endl;\n    return 0;\n}\n```\n\n####\
  \ 练习 34.4-7 选择排序算法 – 排序一维数组\n\n编写一个代码段，使用选择排序算法对数组元素按升序排序。\n\n##### 解决方案\n\n选择排序算法对于大规模数据效率低下，就像冒泡排序算法一样，但它通常比后者性能更好。它是所有排序算法中最简单的，在主内存（RAM）受限的计算机系统中表现良好。\n\
  \n算法找到数组中最小的（或取决于排序顺序的最大）元素，并与位置 0 处的内容交换。然后对数组的剩余部分重复此过程；找到下一个最小的（或最大的）元素并放入下一个位置，直到检查完所有元素。\n\
  \n例如，让我们尝试按升序排序以下数组。\n\n\n\n\n\n![Image](img/chapter34-20.png)\n\n最低值是 4，位于位置 4。根据选择排序算法，该元素与位置\
  \ 0 处的元素交换内容。数组 `A` 变为：\n\n![Image](img/chapter34-21.png)\n\n数组剩余部分（索引位置 1 到 5）中的最低值是\
  \ 9，位于位置 5。该元素与位置 1 处的元素交换。数组 `A` 变为：\n\n![Image](img/chapter34-22.png)\n\n数组剩余部分（索引位置\
  \ 2 到 5）中的最低值是 18，位于位置 4。该元素与位置 2 处的元素交换。数组 `A` 变为：\n\n![Image](img/chapter34-23.png)\n\
  \n按照同样的方法，下一个最低值是 19，位于位置 5。数组 `A` 变为：\n\n![Image](img/chapter34-24.png)\n\n下一个最低值是\
  \ 36，位于位置 5。该元素与位置 4 处的元素交换，数组 `A` 最终按升序排序完成！\n\n![Image](img/chapter34-25.png)\n\
  \n现在，让我们编写对应的 C++ 程序。使用“从内向外”的方法是为了帮助你更好地理解整个过程。下一个代码段找到最小元素，然后将其内容与位置 0 处的元素交换。请注意，这是一个嵌套循环结构。假设变量\
  \ `m` 包含 0。\n\n```cpp\nminimum = a[m];\nindexOfMin = m;\nfor (n = m; n <= ELEMENTS\
  \ - 1; n++) {\n    if (a[n] < minimum) {\n        minimum = a[n];\n        indexOfMin\
  \ = n;\n    }\n}\n// 找到最小值！现在交换值。\ntemp = a[m];\na[m] = a[indexOfMin];\na[indexOfMin]\
  \ = temp;\n```\n\n为了对所有元素重复此过程，可以将此代码段嵌套遍历所有元素的 `for` 循环中。升序排序数组的选择排序算法如下：\n\n```cpp\n\
  for (m = 0; m <= ELEMENTS - 1; m++) {\n    minimum = a[m];\n    indexOfMin = m;\n\
  \    for (n = m; n <= ELEMENTS - 1; n++) {\n        if (a[n] < minimum) {\n    \
  \        minimum = a[n];\n            indexOfMin = n;\n        }\n    }\n    temp\
  \ = a[m];\n    a[m] = a[indexOfMin];\n    a[indexOfMin] = temp;\n}\n```\n\n![](img/notice.jpg)如果你想降序排序数组，只需要搜索最大值而不是最小值。![](img/remember.jpg)像冒泡算法一样，为了用选择排序算法排序数据，你可以做简单的一：保持算法不变！\n\
  \n### 练习 34.4-8 保持关系的一维数组\n\n编写一个 C++ 程序，提示用户输入每月的总电量。然后显示用量最高的三个月份以及对应的电量（降序）。使用选择排序算法。\n\
  \n##### 答案\n\n在此练习中，你需要以下两个一维数组。\n\n![Image](img/chapter34-26.png)\n\n当选择排序算法排序\
  \ `kwh` 数组时，必须保持与 `months` 数组一一对应。这意味着每当 `kwh` 数组的两个元素交换时，`months` 数组对应的元素也必须交换。\n\
  \n然而，考虑到你只需要用量最高的三个月份，选择排序算法应该只排序前三个元素。C++ 程序如下：\n\n![](img/my_exercise_header.png)\n\
  \n```cpp\n# project_34.4-8\n#include <iostream>\nusing namespace std;\nconst int\
  \ ELEMENTS = 12;\nint main() {\n    int i, m, indexOfMax, n;\n    double maximum,\
  \ temp;\n    string tempStr;\n    string months[] = {\"January\", \"February\",\
  \ \"March\", \"April\", \"May\", \"June\", \"July\", \"August\", \"September\",\
  \ \"October\", \"November\", \"December\"};\n    double kwh[ELEMENTS];\n    for\
  \ (i = 0; i <= ELEMENTS - 1; i++) {\n        cout << \"Enter kWh for \" << months[i]\
  \ << \": \";\n        cin >> kwh[i];\n    }\n    for (m = 0; m <= 2; m++) {  //\
  \ 只排序前三个元素\n        maximum = kwh[m];\n        indexOfMax = m;\n        for (n =\
  \ m; n <= ELEMENTS - 1; n++) {\n            if (kwh[n] > maximum) {\n          \
  \      maximum = kwh[n];\n                indexOfMax = n;\n            }\n     \
  \   }\n        // 交换 kwh 的值\n        temp = kwh[m];\n        kwh[m] = kwh[indexOfMax];\n\
  \        kwh[indexOfMax] = temp;\n        // 交换 months 的值\n        tempStr = months[m];\n\
  \        months[m] = months[indexOfMax];\n        months[indexOfMax] = tempStr;\n\
  \    }\n    for (i = 0; i <= 2; i++) {\n        cout << months[i] << \": \" << kwh[i]\
  \ << endl;\n    }\n    return 0;\n}\n```\n\n![](img/notice.jpg)如果此练习要求使用冒泡算法而不是选择排序算法，你可以采用同样的技巧。算法可以执行\
  \ 3 趟而不是 `ELEMENTS – 1` 趟。\n\n### 练习 34.4-9 插入排序算法 – 一维数组排序\n\n编写一个代码段，使用插入排序算法升序排序数组元素。\n\
  \n##### 答案\n\n插入排序算法在大规模数据上是无效的，选择排序和冒泡算法也是如此，但它通常比它们中的任何一个性能更好。此外，插入排序算法在排序非常小的数组时证明非常快——有时比快速排序算法还快。\n\
  \n插入排序算法类似于整理扑牌的方式。你开始时将所有的牌面朝下放在桌子上。桌上的牌代表未排序的“数组”。刚开始时你的左手是空的，但最后这只手将持有排序好的牌。处理过程如下：你一次从桌子上取一张牌，并将其插入左手的正确位置。要为一张牌找到正确位置，你从右到左与手中已有的每张牌进行比较。最后，桌子上不能有任何牌，你的左手将持有所有已排序的牌。\n\
  \n例如，让我们尝试升序排序以下数组。为了更好地理解这个例子，假设排序过程已经开始，前三个元素已经排序。\n\n![Image](img/chapter34-27.png)\n\
  \n![](img/notice.jpg)位置 0、1 和 2 的元素代表你手中的牌，而其余元素代表桌子上的牌。\n\n位置 3（值为 8）的元素从数组中移除，其左侧所有大于\
  \ 8 的元素都向右移动。数组 `A` 变为：\n\n![Image](img/chapter34-28.png)\n\n现在释放出了一个位置，将 8 插入其中。数组\
  \ `A` 变为：\n\n![Image](img/chapter34-29.png)\n\n位置 4（值为 10）的元素从数组中移除，其左侧所有大于 10 的元素都向右移动。数组\
  \ `A` 变为：\n\n![Image](img/chapter34-30.png)\n\n现在释放出了一个位置，将 10 插入其中。数组 `A` 变为：\n\
  \n![Image](img/chapter34-31.png)\n\n位置 5（值为 18）的元素从数组中移除，其左侧所有大于 18 的元素都向右移动。数组\
  \ `A` 变为：\n\n![Image](img/chapter34-32.png)\n\n将 18 插入释放的位置。数组 `A` 变为：\n\n![Image](img/chapter34-33.png)\n\
  \n位置 6（值为 9）的元素从数组中移除，其左侧所有大于 9 的元素都向右移动。数组 `A` 变为：\n\n![Image](img/chapter34-34.png)\n\
  \n最后，将 9 插入释放的位置，算法结束，数组现在已经排序完成。\n\n![Image](img/chapter34-35.png)\n\n![](img/notice.jpg)算法实际上的作用是一个个检查未排序的元素，并将每个元素插入到已排序元素中的适当位置。\n\
  \n使用插入排序算法升序排序数组的代码段如下：\n\n```cpp\nfor (m = 1; m <= ELEMENTS - 1; m++) {\n    //\"\
  从数组中“移除”索引位置 m 的元素并将其保存在变量 element 中\n    element = a[m];\n    // 将适当元素向右移动\n  \
  \  n = m;\n    while (n > 0 && a[n - 1] > element) {\n```\n\n\n\n\n\n```cpp\na[n]\
  \ = a[n - 1];  //等同于：\nn--;              //a[n--] = a[n – 1];\n}//将之前“被移除”的元素插入到索引位置\n\
  na[n] = element;}\n```\n\n![](img/notice.jpg)请注意，索引位置 `m` 处的元素并没有实际上从数组中删除，而是在执行右移操作时被覆盖了。这就是为什么在移动元素之前，它的值被保存在变量\
  \ `element` 中。\n\n![](img/notice.jpg)如果你想按降序排列数组，你只需要将 `while` 语句的布尔表达式更改为 `n >\
  \ 0 && a[n − 1] < element` 即可。\n\n![](img/remember.jpg)与之前的两个排序算法一样，为了对字母数字数据进行排序，你不需要此算法中的任何内容！\n\
  \n### 练习 34.4-10 三最慢用时\n\n十名赛车车手在赛道上尽可能快地行驶。每辆车跑 20 圈，并记录每一圈相应的用时（秒）。编写一个 C++ 程序，提示用户输入每位手手的名称以及他们每圈的用时。程序必须显示每位手手的名称及其三个最慢的用时。使用插入排序算法。\n\
  \n##### 答案\n\n在此练习中，你需要以下两个数组。\n\n![Image](img/chapter34-36.png)\n\n在用户输入所有数据后，C++\
  \ 程序必须对数组的每行进行降序排序，但最后必须显示前三列。\n\n使用“从内层到外层”的方法，下一个代码段使用插入排序算法对二维数组 `elapsedTimes`\
  \ 的第一行（行索引 0）进行降序排序。假设变量 `i` 包含值 0。\n\n```cpp\nfor (m = 1; m <= LAPS - 1; m++) {\n\
  \    element = elapsedTimes[i][m];\n    n = m;\n    while (n > 0 && elapsedTimes[i][n\
  \ - 1] < element) {\n        elapsedTimes[i][n] = elapsedTimes[i][n - 1];\n    \
  \    n--;\n    }\n    elapsedTimes[i][n] = element;\n}\n```\n\n现在，为了对所有行进行排序，你需要将此代码段嵌套在一个迭代所有行的\
  \ `for` 循环中，如下：\n\n```cpp\nfor (i = 0; i <= CARS - 1; i++) {\n    for (m = 1; m\
  \ <= LAPS - 1; m++) {\n        element = elapsedTimes[i][m];\n        n = m;\n \
  \       while (n > 0 && elapsedTimes[i][n - 1] < element) {\n            elapsedTimes[i][n]\
  \ = elapsedTimes[i][n - 1];\n            n--;\n        }\n        elapsedTimes[i][n]\
  \ = element;\n    }\n}\n```\n\n现在，让我们关注给定的练习。最终的 C++ 程序如下。\n\n![](img/my_exercise_header.png)\
  \ project_34.4-10\n```cpp\n#include <iostream>\nusing namespace std;\nconst int\
  \ CARS = 10;\nconst int LAPS = 20;\nint main() {\n    int i, j, m, n;\n    double\
  \ element;\n    // 一一起读取名称和用时\n    string names[CARS];\n    double elapsedTimes[CARS][LAPS];\n\
  \    for (i = 0; i <= CARS - 1; i++) {\n        cout << \"Enter name for driver\
  \ No. \" << i + 1 << \": \";\n        cin >> names[i];\n        for (j = 0; j <=\
  \ LAPS - 1; j++) {\n            cout << \"Enter elapsed time for lap No. \" << j\
  \ + 1 << \": \";\n            cin >> elapsedTimes[i][j];\n        }\n    }\n   \
  \ // 排序数组 elapsedTimes\n    for (i = 0; i <= CARS - 1; i++) {\n        for (m =\
  \ 1; m <= LAPS - 1; m++) {\n            element = elapsedTimes[i][m];\n        \
  \    n = m;\n            while (n > 0 && elapsedTimes[i][n - 1] < element) {\n \
  \               elapsedTimes[i][n] = elapsedTimes[i][n - 1];\n                n--;\n\
  \            }\n            elapsedTimes[i][n] = element;\n        }\n    }\n  \
  \  // 显示 3 个最慢的用时\n    for (i = 0; i <= CARS - 1; i++) {\n        cout << \"Worst\
  \ elapsed times of \" << names[i] << endl;\n        cout << \"-----------------------------------\"\
  \ << endl;\n        for (j = 0; j <= 2; j++) {\n            cout << elapsedTimes[i][j]\
  \ << endl;\n        }\n    }\n    return 0;\n}\n```\n\n### 34.5 数据结构中的元素搜索\n\n在计算机科学中，搜索算法是一种在数据集中搜索具有特定特征的项的算法。在数据结构的情况下，搜索算法通过搜索数据结构来找到与给定值相等的元素元素。\n\
  \n在数据结构中进行搜索时，有两种情况：\n\n- 你想在一个可能包含多个相同值的数据结构中搜索给定值。因此，你需要找到所有与该给定值相同的元素（或对应的索引）。\n\
  - 你想在一个每个值都是唯一的数据结构中搜索给定值。因此，你只需要找到一个与给定值相同的元素（或对应的索引），然后停止进一步搜索！\n\n最常用的搜索算法是：\n\
  \n- 线性（或顺序）搜索算法\n- 二分查找算法\n\n线性搜索和二分搜索算法都有优缺点。\n\n#### 练习 34.5-1 线性搜索算法 – 在可能包含多个相同值的一维数组中搜索\n\
  \n编写代码段，对一维数组进行搜索以找到用户提供的值。假设数组可能包含多个相同值。使用线性搜索算法。\n\n##### 答案\n\n线性（或顺序）搜索算法检查数组的第一个元素是否等于给定值，然后检查第二个元素、第三个元素，依此类推，直到数组末尾。由于这种逐个检查元素非常慢，因此线性搜索算法适用于元素较少的数组。\n\
  \n代码段所示。它在数组 `haystack` 中寻找用户提供的值 `needle`！\n\n```cpp\ncout << \"Enter a value to\
  \ search: \";\ncin >> needle;\nfound = false;\nfor (i = 0; i <= ELEMENTS - 1; i++)\
  \ {\n    if (haystack[i] == needle) {\n        cout << needle << \" found at position:\
  \ \" << i << endl;\n        found = true;\n    }\n}\nif (!found) {\n    cout <<\
  \ \"Nothing found!\" << endl;\n}\n```\n\n#### 练习 34.5-2 显示所有具有相同名字的人的姓\n\n编写一个 C++\
  \ 程序，提示用户输入 20 个人的名字：将他们的名字输入到 `firstNames` 数组，将他们的姓输入到 `lastNames` 数组。程序必须询问用户一个名字，然后它将搜索并显示所有名字与提供名字相同的人的姓。\n\
  \n##### 答案\n\n尽管在练习的表述中并不清楚，但 `firstNames` 数组确实可能包含多次相同值。例如，遇到两个名叫“John”的人有多稀奇呢？\n\
  \n程序必须在 `firstNames` 数组中搜索用户提供的名字，并且每当找到时，它必须从另一个数组中显示对应的姓。\n\n解决方案如下。\n\n![](img/my_exercise_header.png)\
  \ project_34.5-2\n```cpp\n#include <iostream>\n#include <boost/algorithm/string.hpp>\n\
  using namespace boost::algorithm;\nusing namespace std;\nconst int PEOPLE = 20;\n\
  int main() {\n    int i;\n    string needle;\n    bool found;\n    string firstNames[PEOPLE];\n\
  \    string lastNames[PEOPLE];\n    for (i = 0; i <= PEOPLE - 1; i++) {\n      \
  \  cout << \"Enter first name: \";\n        cin >> firstNames[i];\n        cout\
  \ << \"Enter last name: \";\n        cin >> lastNames[i];\n    }\n    // 获取要搜索的名字并将其转换为大写\n\
  \    cout << \"Enter a first name to search: \";\n    cin >> needle;\n    needle\
