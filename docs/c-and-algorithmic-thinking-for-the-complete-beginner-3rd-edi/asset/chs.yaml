  12) 编写一个 C++ 程序，提示用户输入三个温度，如果平均值大于 60，则显示消息“Heat Wave”。\n\n---\n\n## 双分支选择结构\n\n\
  ### 17.1 双分支结构\n\n与单分支选择结构不同，这种类型的逻辑控制在两条路径上都包含语句或语句块。\n\n如果 `Boolean_Expression`（布尔表达式）为真，则执行语句或语句块\
  \ 1；否则执行语句或语句块 2。\n\nC++ 语句的通用形式为：\n\n```cpp\nif (Boolean_Expression) {\n    语句或语句块\
  \ 1\n} else {\n    语句或语句块 2\n}\n```\n\n在下一个示例中，当用户输入的值大于等于 18 时显示“You are an adult”。否则显示“You\
  \ are underage!”。\n\n```cpp\n#include <iostream>\nusing namespace std;\nint main()\
  \ {\n    int age;\n    cout << \"Enter your age: \";\n    cin >> age;\n    if (age\
  \ >= 18) {\n        cout << \"You are an adult!\" << endl;\n    } else {\n     \
  \   cout << \"You are underage!\" << endl;\n    }\n    return 0;\n}\n```\n\n类似于单分支选择结构，单个语句可以写在大括号\
  \ `{ }` 内。`if-else` 语句可以写如下：\n\n```cpp\nif (Boolean_Expression)\n    单语句 1;\nelse\n\
  \    单语句 2;\n```\n\n#### 练习 17.1-1 寻找输出消息\n\n对于下面的流程图，确定三种不同执行情况下的输出消息。\n\n（流程图描述）\n\
  \n**答案：**\n\ni) 当用户输入值 3 时，布尔表达式为真。执行流遵循右路径并显示消息“Positive”。\nii) 当用户输入 −3 时，布尔表达式为假。执行流遵循左路径并显示消息“Negative”。\n\
  iii) 你能预测当用户输入 0 会发生什么吗？如果你认为没有任何消息会被显示，你就错了！双分支选择结构必须遵循某条路径，要么向右要么向左！它不能跳过两个语句块的执行。至少有一个语句或语句块会被执行。因此，在这种情况下，当用户输入\
  \ 0 时，布尔表达式为假，执行流遵循左路径，并显示消息“Negative”！\n\n\n\n\n\n![](img/notice.jpg)该算法目前并不满足对所有可能输入的的有效性（effectiveness）属性。虽然它能正确识别正值和负值，但忽略了零的情况。`Zero`\
  \ 是一个有效的输入，应该在算法逻辑中考虑到这一点，以确保它对所有潜在输入都能产生有意义的结果。在本书的后后部分（在练习 20.1-2 中），你将学习如何显示三种消息，取决于用户提供的值是大于、小于还是等于\
  \ `zero`。\n\n![](img/remember.jpg)决策符号有一个入口和两个出口路径！你不能有第三个出口！\n\n#### 练习 17.1-2\
  \ 追踪表与双路择一决策结构\n\n创建一个追踪表，以确定以下 C++ 程序在两种不同执行情况下每一步中变量的值。\n\n两次执行的输入值为 (i) `5` 和\
  \ (ii) `10`。\n\n![](img/my_exercise_header.png) project_17.1-2\n```cpp\n#include\
  \ <iostream>\nusing namespace std;\nint main() {\n    double a, z, w, y;\n    cin\
  \ >> a;\n    z = a * 10;\n    w = (z - 4) * (a - 3) / 7 + 36;\n    if (z >= w &&\
  \ a < z) {\n        y = 2 * a;\n    } else {\n        y = 4 * a;\n    }\n    cout\
  \ << y << endl;\n    return 0;\n}\n```\n\n##### 答案\n\ni) 对于输入值 `5`，追踪表如下。\n\n| 步骤\
  \ | 语句 | 注释 | a | z | w | y |\n| --- | --- | --- | --- | --- | --- | --- |\n| 1\
  \ | `cin >> a` | 用户输入值 5 | 5.0 | ? | ? | ? |\n| 2 | `z = a * 10` | | 5.0 | 50.0\
  \ | ? | ? |\n| 3 | `w = (z - 4) * (a - 3) / 7 + 36` | | 5.0 | 50.0 | 49.142 | ?\
  \ |\n| 4 | `if (z >= w && a < z)` | 结果为真 | | | | |\n| 5 | `y = 2 * a` | | 5.0 |\
  \ 50.0 | 49.142 | 10.0 |\n| 6 | `cout << y << endl` | 显示为: 10 | | | | |\n\nii) 对于输入值\
  \ `10`，追踪表如下。\n\n| 步骤 | 语句 | 注释 | a | z | w | y |\n| --- | --- | --- | --- | ---\
  \ | --- | --- |\n| 1 | `cin >> a` | 用户输入值 10 | 10.0 | ? | ? | ? |\n| 2 | `z = a\
  \ * 10` | | 10.0 | 100.0 | ? | ? |\n| 3 | `w = (z - 4) * (a - 3) / 7 + 36` | | 10.0\
  \ | 100.0 | 132.0 | ? |\n| 4 | `if (z >= w && a < z)` | 结果为假 | | | | |\n| 5 | `y\
  \ = 4 * a` | | 10.0 | 100.0 | 132.0 | 40.0 |\n| 6 | `cout << y << endl` | 显示为: 40\
  \ | | | | |\n\n#### 练习 17.1-3 谁值最大？\n\n设计一个流程图并编写相应的 C++ 程序，让用户输入两个数字 `A` 和 `B`，然后确定并显示这两个数中的较大者。\n\
  \n##### 答案\n\n这个练习可以使用双路择一或单路择一决策结构解决。所以，让我们两种都用用！\n\n###### 第一种方法——使用双路择一决策结构\n\
  \n这种方法测试数字 `B` 的值是否大于数字 `A`。如果是，则数字 `B` 最大；否则，数字 `A` 最大。使用这种方法解决此练习的相应流程图所示。\n\n\
  ![Image](img/chapter17-03.png)\n\n相应的 C++ 程序如下。\n\n![](img/my_exercise_header.png)\
  \ project_17.1-3a\n```cpp\n#include <iostream>\nusing namespace std;\nint main()\
  \ {\n    double a, b, maximum;\n    cin >> a >> b;\n    if (b > a) {\n        maximum\
  \ = b;\n    } else {\n        maximum = a;\n    }\n    cout << \"Greatest value:\
  \ \" << maximum << endl;\n    return 0;\n}\n```\n\n![](img/notice.jpg) 注意，这个练习是尝试确定最大值，而不是该值实际上赋值给了哪个变量（赋值给变量\
  \ `A` 还是变量 `B`）。\n\n###### 第二种方法——使用单路择一决策结构\n\n如下所示所示，这种方法最初假设数字 `A` 是最大值（这就是为什么它将变量\
  \ `a` 的值赋给变量 `maximum`）。然而，如果证明数字 `B` 大于数字 `A`，则更新最大值；变量 `maximum` 被赋予一个新值——变量 `b`\
  \ 的值。因此，无论数字 `A` 和 `B` 的值是多少，最后变量 `maximum` 始终包含最大值！\n\n![Image](img/chapter17-04.png)\n\
  \nC++ 程序在此处。\n\n![](img/my_exercise_header.png) project_17.1-3b\n```cpp\n#include\
  \ <iostream>\nusing namespace std;\nint main() {\n    double a, b, maximum;\n  \
  \  cin >> a >> b;\n    maximum = a;\n    if (b > a) {\n        maximum = b;\n  \
  \  }\n    cout << \"Greatest value: \" << maximum << endl;\n    return 0;\n}\n```\n\
  \n#### 练习 17.1-4 寻找奇数和偶数\n\n设计一个流程图并编写相应的 C++ 程序，提示用户输入正整数，然后显示一条消息指示该数是否为偶数；否则必须显示“Odd”（奇数）。\n\
