  \n顺序控制结构\n\n## 第 10 章 顺序控制结构简介\n\n### 10.1 什么是顺序控制结构？\n\n顺序控制结构指的是语句按行执行的方式，语句按照它们在程序中出现的相同顺序执行，而不跳过任何一个语句。例如，它们可以执行一系列读写操作、算术运算或给变量赋值。\n\
  \n以下程序显示了顺序执行的 C++ 语句示例。\n\n```cpp\n#include <iostream>\nusing namespace std;\n\
  int main() {\n    double num, result;\n    // 提示用户输入 num 的值\n    cout << \"Enter\
  \ a number: \";\n    cin >> num;\n    // 计算 num 的平方\n    result = num * num;\n \
  \   // 在用户屏幕上显示结果\n    cout << \"The square of \" << num << \" is \" << result <<\
  \ endl;\n    return 0;\n}\n```\n\n顺序控制结构是你在 4.11 节中学到的基本控制结构中最简单的。另外两个结构是“选择结构”和“循环结构”。所有的编程问题都可以使用这些结构来解决！\n\
  \n在 C++ 中，你可以使用双斜杠 (`//`) 添加注释。注释是给人类读者看的。编译器和解释器会忽略它们。\n\n#### 10.1-1 计算矩形面积\n\n\
  编写一个 C++ 程序，提示用户输入矩形的底边和高度，然后计算并显示其面积。\n\n解答\n\n你可能在学校里知道可以使用以下公式计算矩形的面积：\n\n面积\
  \ = 底 × 高\n\n在 4.6 节中，你学习了创建算法涉及的三个主要阶段：数据输入、数据处理和结果输出。\n\n在本次练习中，这三个主要阶段如下：\n\n\
  ► 数据输入 – 用户必须输入 Base 和 Height 值\n► 数据处理 – 程序必须计算矩形的面积\n► 结果输出 – 程序必须显示上一个阶段计算出的面积\n\
  \n该问题的解决方案所示此处。\n\n\n\n\n![](img/my_exercise_header.png) `project_10.1-1`\n\n```cpp\n\
  #include <iostream>\nusing namespace std;\nint main() {\n    double area, b, h;\n\
  \    //Data input - Prompt the user to enter values for base and height\n    cout\
  \ << \"Enter the length of base: \";\n    cin >> b;\n    cout << \"Enter the length\
  \ of height: \";\n    cin >> h;\n    //Data processing - Calculate the area of the\
  \ rectangle\n    area = b * h;\n    //Results output - Display the result on user's\
  \ screen\n    cout << \"The area of the rectangle is \" << area << endl;\n    return\
  \ 0;\n}\n```\n\n#### 练习 10.1-2 计算圆面积\n\n编写一个 C++ 程序，计算并显示圆的面积。\n\n##### 解决方案\n\n\
  你可以使用以下公式计算圆面积：\n\nArea = π · Radius²\n\n`π` 的值是一个已知量，大约等于 `3.14159`。因此，用户必须输入的是\
  \ `Radius` 的值。\n\n在本次练习中，你在 Section 4.6 中学到的三个主要阶段如下：\n\n►数据输入 – 用户必须输入 `Radius`\
  \ 的值\n►数据处理 – 程序必须计算圆的面积\n►结果输出 – 程序必须显示在上一阶段计算出的圆面积。\n\n该问题的解决方案在此所示。\n\n![](img/my_exercise_header.png)\
  \ `project_10.1-2a`\n\n```cpp\n#include <iostream>\nusing namespace std;\nint main()\
  \ {\n    double area, radius;\n    //Data input - Prompt the user to enter a value\
  \ for radius\n    cout << \"Enter the length of radius: \";\n    cin >> radius;\n\
  \    //Data processing - Calculate the area of the circle\n    area = 3.14159 *\
  \ radius * radius;\n    //Results output - Display the result on user's screen\n\
  \    cout << \"The area of the circle is \" << area << endl;\n    return 0;\n}\n\
  ```\n\n更好的方法是使用常量 `PI`。\n\n![](img/my_exercise_header.png) `project_10.1-2b`\n\n\
  ```cpp\n#include <iostream>\nusing namespace std;\nconst double PI = 3.14159;\n\
  int main() {\n    double area, radius;\n    //Data input - Prompt the user to enter\
  \ a value for radius\n    cout << \"Enter the length of radius: \";\n    cin >>\
  \ radius;\n    //Data processing - Calculate the area of the circle\n    area =\
  \ PI * radius * radius;\n    //Results output - Display the result on user's screen\n\
  \    cout << \"The area of the circle is \" << area << endl;\n    return 0;\n}\n\
  ```\n\n![](img/notice.jpg)注意常量 `PI` 是在函数 `main` 外声明的。\n\n#### 练习 10.1-3 汽车在哪里？计算行驶距离\n\
