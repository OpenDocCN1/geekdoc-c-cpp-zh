  \ C++ 有哪些可能的用途？\n21) 什么是 Visual Studio？\n\n# 第二部分 C++入门\n\n## 第 4 章算法概念简介\n\n###\
  \ 4.1 什么是算法？\n\n在技术术语中，算法^([[1]](#footnotes.html_Endnote_1)) 是一个严格定义的有限良定义语句序列（通常称为指令或命令），对于任何可接受的输入集合（如果有输入），它为问题或特定类问题提供了解决方案。换句话说，算法是解决问题的逐步过程。“有限”意味着算法必须到达一个终点，而不能永远运行。\n\
  \n你可以在现实生活的任何处发现算法，而不仅仅是计算机科学。例如，准备吐司或一杯茶的过程可以表示为算法。为了实现目标，必须按照特定的顺序遵循某些步骤。\n\n\
  ### 4.2 泡茶的算法\n\n以下是泡茶的算法。\n\n1)将茶包放入杯中。2)向水壶加水。3)烧开壶中的水。4)将一些开水倒入杯中。5)向杯中加入牛奶。6)向杯中加入糖。7)搅拌茶。8)喝茶。\n\
  \n如你所见，某些步骤必须被遵循。这些步骤有特定的顺序，尽管某些步骤可以重新排列。例如，步骤 5 和 6 可以调换。你可以先加糖，再加牛奶。\n\n![](img/notice.jpg)请记住，某些步骤的顺序可能会改变，但你不能将它们移离应该的位置太远。例如，你不能将步骤\
  \ 3（“烧开壶中的水”）移动到算法的末尾，因为你最终将喝到冰茶（而不是热茶），这与你的初始目标完全不同！\n\n### 4.3 算法的属性\n\n在它的著作《计算机程序设计艺术第一卷：基础算法》中，唐纳德·E·克努斯^([[3]](#footnotes.html_Endnote_3))\
  \ 断言算法必须满足以下五个属性：\n\n\n\n\n\n## 算法属性\n\n- **输入 (Input)**：算法必须来自指定集合的输入值。\n- **输出\
  \ (Output)**：算法必须根据一组指定的输入值产生输出值。输出值是该问题的解决方案。\n- **有限性 (Finiteness)**：对于任何输入，算法必须在有限的步数后终止。\n\
  - **确定性 (Definiteness)**：算法的所有步骤都必须精确定义。算法中的每条指令都应该是清晰且无歧的。算法必须显式描述如何执行计算。确定性属性确保执行指令的代理将始终知道下一步执行哪条命令。不符合确定性属性的算法示例包括：\n\
  \    - 一个在没有任何检查或保护措施的情况下将一个数除以零的算法。除以零在数学上是未定义的，不处理这种这种情况的算法可能会导致计算中出现意外的结果或错误。\n\
  \    - 一个尝试计算负数平方根但没有考虑复数的算法。负数的平方根不是实数，而是复数。如果算法没有妥善处理，可能会产生无效或无意义的结果。\n- **有效性\
  \ (Effectiveness)**：它指的是算法能够在有限时间内，对所有可能的有效输入（包括边界情况）持续且准确地产生意义且正确结果的能力。算法的步骤必须足够基础，以便例如使用笔和纸的人可以精确地执行它们。\n\
  \n### 4.4 算法很好，但计算机程序到底是什么？\n\n计算机程序无非是用计算机可以理解的语言（如 `C++`、`Python`、`C#` 或 `Java`）编写的算法。\n\
  \n计算机程序实际上不能为你泡杯茶或做晚餐，尽管算法可以指导你自己完成这些步骤。然而，程序可以（例如）用于计算一组数字的平均值，或找到它们中的最大值。人工智能程序甚至可以下棋或解决逻辑谜题。\n\
  \n### 4.5 三方参与！\n\n一个算法中总是涉及三方：编写算法的人、执行算法的人以及使用或享受算法的人。\n\n让我们以准备一饭的算法为例。某人编写算法（菜谱的作者），某人执行它（可能是你的母亲，她按照菜谱上的步骤准备食物），某人使用它（可能是你，你享受美味餐）。\n\
  \n现在考虑一个真实的计算机程序。以视频游戏为例。某人用计算机语言编写算法（程序员），某个东西执行它（通常是笔记本电脑或电脑），某人使用或玩它（用户）。\n\n\
  要小心，因为“程序员”和“用户”这两个术语有时可能是歧义的来源。当你编写计算机程序时，你暂时承担了“程序员”的角色，但当你使用自己的程序时，你就承担了“用户”的角色。\n\
  \n### 4.6 创建算法涉及的三个主要阶段\n\n算法应该由三个阶段组成：数据输入、数据处理和结果输出。这个顺序是特定的不能改变。\n\n考虑一个寻找三个数字平均值的计算机程序。首先，程序必须提示（询问）用户输入数字（数据输入阶段）。接下来，程序必须计算这些数字的平均值（数据处理阶段）。最后，程序必须在计算机屏幕上显示结果（结果输出阶段）。\n\
  \n让我们详细查看这些阶段。\n\n**第一阶段 – 数据输入**\n1) 提示用户输入一个数字。\n2) 提示用户输入第二个数字。\n3) 提示用户输入第三个数字。\n\
  \n**第二阶段 – 数据处理**\n4) 计算三个数字的和。\n5) 将和除以 `3`。\n\n**第三阶段 – 结果输出**\n6) 在屏幕上显示结果。\n\
  \n在某些罕情况下，输入阶段可能会缺失，计算机程序可能只包含两个阶段。例如，考虑一个用于计算以下和的计算机程序：\n\n```\n1 + 2 + 3 + 4 +\
  \ 5\n```\n\n在这个示例中，用户不需要输入任何值，因为计算机程序确切知道要做什么。它必须计算数字 `1` 到 `5` 的和，然后在用户的屏幕上显示值\
  \ `15`。这里显示了所需的两个阶段（数据处理和结果输出）。\n\n**第一阶段 – 数据输入**\n无事可做\n\n**第二阶段 – 数据处理**\n1)\
  \ 计算 `1 + 2 + 3 + 4 + 5` 的和。\n\n**第三阶段 – 结果输出**\n2) 在屏幕上显示结果。\n\n但是，如果你想让用户决定该和的上限呢？如果你想让用户决定是相加\
  \ `1` 到 `5` 的数字还是 `1` 到 `20` 的数字呢？在这种情况下，程序必须在开头包含一个输入阶段，让用户输入该上限。一旦用户输入了该上限，计算机就可以计算结果。这里显示了所需的三个阶段。\n\
  \n**第一阶段 – 数据输入**\n1) 提示用户输入一个数字。\n\n**第二阶段 – 数据处理**\n2) 计算和 `1 + 2 + …`（直到并包含用户输入的上限）。\n\
  \n**第三阶段 – 结果输出**\n3) 在屏幕上显示结果。\n\n例如，如果用户输入数字 `6` 作为上限，计算机将找到 `1 + 2 + 3 + 4 +\
  \ 5 + 6` 的结果。\n\n### 4.7 流程图\n\n流程图是展示算法的一种图形方法，通常在纸上。它是算法流的视觉化表示。换句话说，它视觉化地表示执行流如何从一个语句进行到下一个语句，直到结束。流程图中使用的基本符号所示。\n\
  \n| 流程图符号 |  |\n| :--- | :--- |\n| 开始/结束 | 代表算法的开始或结束。开始符号有一个出口，结束符号有一个入口。 |\n|\
  \ 箭头 | 显示执行流。从一个符号出发并指向另一个符号的箭头表示控制传递给箭头所指的符号。箭头始终被画成向上、向下或侧向的直线（绝不画斜线）。 |\n| 处理\
  \ | 代表一个过程或数学（公式）计算。处理符号有一个入口和一个出口。 |\n| 数据输入/输出 | 代表数据输入或结果输出。在大多数情况下，数据来自键盘，结果显示在屏幕上。数据输入/输出符号有一个入口和一个出口。\
  \ |\n| 决策 | 表示做出决策的点。根据给定的条件（可以为真或假），算法将遵循右路径或左路径。决策符号有一个入口和两个（且只有两个）出口。 |\n| 越页连接器\
  \ | 显示流程图在另一页的延续。当流程图太大无法放进一张纸时，它们被用于连接多个页面上的片段。输出越页连接器符号有一个入口，输入越页连接器符号有一个出口。 |\n\
  \n表 4-1 流程图符号及其功能\n\n流程图的示例如图 4–1 所示。算法提示用户输入三个数字，然后计算它们的平均值并显示在计算机屏幕上。\n\n####\
  \ 练习 4.7-1 寻找三个数字的平均值\n\n\n\n\n\n设计一个算法来计算三个数的平均值。每当平均值低于 10 时，必须显示消息“Fail!”。否则，如果平均值为\
  \ 10 或以上，必须显示消息“Pass!”。\n\n##### 解决方案\n\n在这个问题中，必须显示两条不同的消息，但每次执行算法时只能出现其中一条；消息的内容取决于平均值。这里是该算法的流程图。\n\
  \n![Image](img/chapter04-08.png)\n\n![](img/notice.jpg)为了节省纸张，你可以使用单个斜四边形提示用户输入所有三个数字。\n\
  \n![](img/remember.jpg)判定符号始终有一个入口和两个出口！\n\n当然，你很快就会开始创建属于自己的算法了。这个特定的练习非常简单，在本章中仅作为一个特例提出，仅用于演示目的。在开始创建你自己的算法甚至编写\
  \ `C++ programs` 之前，你还需要学习更多知识。请耐心等待！几个章节之后，大时刻就会到临！\n\n### 4.8 什么是“保留字”？\n\n在计算机语言中，保留字（或关键字）是具有严格预定义含义的单词——它被留作特殊用途，不能用于任何其他用途。例如，流程图中的\
  \ `Start`、`End`、`Read` 和 `Write` 单词具有预定义的含义。它们分别表示开始、结束、数据输入和结果输出。\n\n所有高级计算机语言都存在保留字。在\
  \ `C++` 中，有很多保留字，如 `if`、`while`、`else` 和 `for`。然而，每种语言都有自己的保留字集。例如，`C++` 中的保留字 `else\
  \ if` 在 `Python` 中写为 `elif`。\n\n### 4.9 语句 (Statement) 和命令 (Command) 有什么区别？\n\n\
  互联网上关于语句和命令之间是否存在差异有很大的讨论。有些人倾向于使用“语句”一词，而另一些人则使用“命令”。对于初级程序员来说，没有区别；它们都是给计算机的指令！\n\
  \n### 4.10 什么是结构化编程？\n\n结构化编程是一种使用模块化和结构化设计的软件开发方法。大型程序被拆分成更小的模块，每个模块都使用结构化代码，这意味着语句按照特定的方式组织，以最大限度地减少错误和误解。正如其名所示，结构化编程是在结构化编程语言中进行的，`C++`\
  \ 就是其中一种语言。\n\n结构化编程概念由 Corrado Böhm 和 Giuseppe Jacopini 在 1966 年正式提出。他们演示了使用序列、判定和迭代进行理论性计算机程序设计。\n\
  \n### 4.11 三种基本控制结构\n\n结构化编程中有三种基本的控制结构。\n\n- **顺序控制结构**：指的是逐行执行，即语句按照它们在程序中出现的顺序顺序执行，而不跳过其中任何一个。它也被称为顺序控制结构。\n\
  - **判定控制结构**：根据条件的真或假，判定控制结构可能会跳过整个语句块的执行，或者执行其中一个语句块而不是另一个块。它也称为选择控制结构。\n- **循环控制结构**：这是一种控制结构，允许多次执行一个语句块，直到满足特定条件。它也被迭代控制结构或重复控制结构。\n\
  \n![](img/notice.jpg)世界上没有任何一个计算机程序是只根据这三种控制结构编写的！\n\n#### 练习 4.11-1 使用流程图理解控制结构\n\
  \n使用流程图为每种类型的控制结构提供一个示例。\n\n##### 解决方案\n\n顺序控制结构的示例\n\n.![Image](img/chapter04-09.png)\n\
  \n判定控制结构的示例\n\n![Image](img/chapter04-10.png)\n\n循环控制结构的示例\n\n![Image](img/chapter04-11.png)\n\
  \n如果你还没有完全理解这三种控制结构的深层含义，不要担心，因为接下来的章节将对它们进行非常彻底的分析。耐心是一种美德。现在只需要等待！\n\n### 4.12\
  \ 你的第一个 C++ 程序\n\n将流程图转换为 `C++` 等计算机语言会生成一个 `C++ program`。`C++ program` 不仅仅是一个包含\
  \ `C++ statements` 的文本文件。`C++ programs` 甚至可以在你的文本编辑器中编写！但请记住，使用 `Visual Studio`\
  \ 编写 `C++ programs` 是一个更好的解决方案，因为它包含的所有功能都可以让你的生活更轻松。\n\n![](img/remember.jpg)`C++\
  \ source code` 以默认的 `.cpp` 扩展名保存在硬盘上。\n\n一个 `C++ program` 必须包含一个 `main` 函数，所示：\n\
  \n```cpp\n#include <iostream>\nusing namespace std;\nint main() {\n  // C++ code\
  \ goes here\n  return 0;\n}\n```\n\n这是一个非常简单的算法，在屏幕上显示三个消息。\n\n.![Image](img/chapter04-12.png)\n\
  \n这里是用 `C++ program` 编写的相同算法。\n\n```cpp\n#include <iostream>\nusing namespace std;\n\
  int main() {\n  cout << \"Hello World!\" << endl;\n  cout << \"Hallo Welt!\" <<\
  \ endl;\n  cout << \"The End\" << endl;\n  return 0;\n}\n```\n\n![](img/notice.jpg)注意\
  \ `C++` 要求所有语句必须以分号结束。\n\n### 4.13 语法错误、逻辑错误和运行时错误之间有什么区别？\n\n在编写或执行高级语言代码时，可能会发生三种类型的错误：语法错误、逻辑错误和运行时错误。\n\
  \n语法错误是一种错误，例如拼写错误的关键字、缺失的标点符号或缺失的右括号。语法错误由 `compiler` 或 `interpreter` 检测到。如果你尝试执行一个包含语法错误的\
  \ `C++ program`，你将在屏幕上收到错误信息，程序将不会执行。你必须纠正任何错误，然后尝试尝试执行程序。\n\n![](img/notice.jpg)某些\
  \ IDE（如 `Visual Studio Code`）会在你输入时检测这些错误，并用红色波浪线下划错误的语句。\n\n逻辑错误是阻止你的程序按照你预期的方式运行的错误。对于逻辑错误，你完全不会收到警告。你的代码编译并运行了，但结果不是预期的。逻辑错误很难检测。你必须彻底检查你的程序以找出错误在哪里。例如，考虑一个提示用户输入三个数字然后计算并显示其平均值的\
  \ `C++ program`。但在该程序中，程序员犯了一个拼写错误（一个“typo”）；他们的语句其中一个将三个数之和除以 `5`，而不是应该除以 `3`。当然，`C++\
  \ program` 正常执行，没有任何错误信息，提示用户输入三个数字并显示结果，但显然结果不是正确的结果！发现并纠正编写错误的 `C++ statement`\
  \ 是程序员的责任，而不是计算机、`interpreter` 或 `compiler` 的责任！毕竟，计算机并不那么智能！\n\n运行时错误是在程序执行期间发生的错误。运行时错误会导致程序意外终止，甚至导致系统关机。此类错误是最难检测的。在执行程序之前，无法确定这种错误是否会发生。尽管如此，你可以怀疑可能会发生！例如，内存耗尽或除以零会导致运行时错误。\n\
  \n![](img/notice.jpg)逻辑错误可能是运行时错误的原因！\n\n\n\n\n逻辑错误和运行时错误通常被称为“漏洞”（bugs），通常在软件发布前的调试过程中发现。当软件向公众发布后发现错误时，程序员通常会发布补丁（即小幅更新）来修复这些错误。\n\
  \n## 4.14 什么是“调试”\n\n调试是发现并减少计算机程序中缺陷（漏洞）数量的过程，使其能够按照预期运行。\n\n关于“调试（debugging）”一词的起源有一个传说。1940\
  \ 年，当格蕾丝·霍珀（Grace Hopper）在哈佛大学研究一台 `Mark II Computer` 时，她的同事发现一个继电器（一种电气开关）中卡住了一只飞虫。这只虫阻塞了\
  \ `Mark II computer` 的正常运行。因此，当她的同事试图移除这只虫时，格蕾丝·霍珀评论说他们正在“调试”系统！\n\n## 4.15 为代码编写注释\n\
  \n当你编写一个短而简单的程序时，任何人都可以逐行阅读并理解它的原理。然而，长程序很难理解，有时即使对于编写它们的本人来说也是如此。\n\n注释是可以包含在程序中的额外信息，使程序更易阅读和理解。通过注释，你可以添加解释和其他信息，包括：\n\
  \n- 谁编写了程序 \n- 程序是何时创建或最后修改的 \n- 程序是做什么的 \n- 程序是如何工作的\n\n注释是给人类读者看的。编译器和解释器会忽略你向程序中添加的任何注释。\n\
  \n然而，你不应该过度注释。没有必要解释程序的每一行代码。只有当程序的某特定部分难以理解时，才添加注释。\n\n在 `C++` 中，你可以使用以下方法之一添加注释：\n\
  \n- 双斜杠 `//`\n- 斜杠-星号、星号-斜杠分隔符 `/* …… */`\n\n以下程序演示了如何使用这两种注释。通常双斜杠（`//`）用于注释单行，而斜杠-星号、星号-斜杠分隔符\
  \ `/* …… */` 用于一次注释多行。\n\n```cpp\n#include <iostream>\nusing namespace std;\n/*Created\
  \ By Bouras Aristides\nDate created: 12/25/2003\nDate modified: 04/03/2008\nDescription:\
  \ This program displays some messages on the screen*/\nint main() {\n    cout <<\
  \ \"Hello Zeus!\" << endl;  //It displays a message on the screen\n    //Display\
  \ a second message on the screen\n    cout << \"Hello Hera!\" << endl;\n    /* Display\
  \ a third message on screen */\n    cout << \"Γεια σας\" << endl;//This is a comment\n\
  \    cout << \"The End\" << endl;\n    return 0;\n}\n```\n\n如你在前面的程序所示，你可以在语句上方或语句末尾添加注释，但不能放在语句前面。看最后一条语句，它本应该显示“The\
  \ End”信息。这条语句永远不会被执行，因为它被认为是注释的一部分。\n\n如果你在语句前面使用分隔符 `/* …… */` 添加注释，该语句仍然会被执行。在前面的示例中，尽管希腊语信息“Γεια\
  \ σας”被写在某些注释旁边，但仍然会被执行。然而，建议不要采用这种编写风格，因为这会让你的代码难以阅读。\n\n在程序运行时，用户对注释是不可见的。\n\n\
  ## 4.16 用户友好的程序\n\n什么是用户友好的程序？它是用户认为是朋友而不是敌人的程序，是对新手用户来说易于操作的程序。\n\n如果你想编写用户友好的程序，就必须设身处地考虑。用户希望计算机按照他们的方式完成工作，并且尽可能省力。隐藏的菜单、不清晰的标签和方向，以及误导性的错误信息都会让程序变得对用户不利！\n\
  \n最能定义用户友好设计的法律是“最小惊讶原则”（Law of Least Astonishment）：“程序的运行方式应该最少让用户感到惊讶”。这条法律也通常称为“最小惊讶原则”（`POLA`）。\n\
  \n## 4.17 复习题：判断题\n\n对以下每个陈述选择对或错。\n\n1) 一份菜的食谱实际上是一个算法。\n2) 算法仅用于计算机科学。\n3) 算法可以永远运行。\n\
  4) 在算法中，你可以将某一步移动到任何想要的位置。\n5) 算法必须为至少一组输入值产生正确的输出值。\n6) 计算机可以下象棋。\n7) 算法总是可以变成计算机程序。\n\
  8) 编程是创建计算机程序的过程。\n9) 计算机程序中总是涉及三方：程序员、计算机和用户。\n10) 程序员和用户有时可以是同一个人。\n11) 计算机程序可能无结果输出。\n\
  12) 流程图是一个计算机程序。\n13) 流程图由一组几何形状组成。\n14) 流程图是表示算法的方法。\n15) 为了表示算法，你可以设计不使用任何开始/结束（Start/End）符号的流程图。\n\
  16) 你设计不使用任何过程（Process）符号的流程图。\n17) 你设计不使用任何数据输入输出符号的流程图。\n18) 流程图必须包含至少一个判定（Decision）符号。\n\
  19) 在流程图中，判定符号根据给定问题可以有一个、两个或三个出口路径。\n20) 留字是所有具有严格含义的词。\n21) 结构化编程包括结构化设计。\n22)\
  \ C++是一种结构化计算机语言。\n23) 结构化编程的基本原理是它包含四种基本的控制结构。\n24) 写了十遍的语句被视为循环控制结构。\n25) 判定控制结构指的是逐行执行。\n\
  26) 拼错误的关键字被视为逻辑错误。\n27) 即使包含逻辑错误，C++ 程序也可以被执行。\n28) 如果在 C++ 语句末留下感叹号，它被视为语法错误。\n\
  29) 如果在 C++ 语句末留下感叹号，它无法阻止整个 C++ 程序的执行。\n30) 结构化编程的优点之一是编写计算机程序时不会产生错误。\n31) 逻辑错误在编译期间被。\n\
  32) 运行时错误在编译期间捕捉。\n33) 语法错误是最难检测的错误。\n34) 计算三角形面积但输出结果错误的程序包含逻辑错误。\n35) 当程序不包含输出语句时，它包含语法错误。\n\
  36) 程序必须包含注释。\n37) 如果你向程序中添加注释，计算机可以更容易理解它。\n38) 你不能在语句上方添加注释。\n39) 注释对程序用户是不可见的。\n\
  40) 如果一个程序对新手来说容易使用，它就是用户友好的。\n41) 缩写 `POLA` 代表“最小娱乐原则”。\n\n## 4.18 复习题：单选题\n\n\
  为以下每个陈述选择正确答案。\n\n\n\n\n\n# 测验\n\n1) 算法是一个严格定义的、定义良好的有限序列，为以下内容提供解决方案：\n   a) 一个问题。\n\
