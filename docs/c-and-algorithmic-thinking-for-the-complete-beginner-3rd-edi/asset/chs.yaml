  \ `totalYes` 和 `femaleNo`**：\n    - 在子程序外部初始化；因此它们必须传递给子程序。\n    - 在子程序内未更新；因此它们不应返回给调用者。\n\
  \n因此，由于不需要向主代码返回值，可以使用 `void` 函数，如下所示。\n\n```cpp\n//Fourth part\nvoid displayResults(int\
  \ totalYes, int femaleNo) {\n    cout << \"Total positive answers: \" << totalYes\
  \ << endl;\n    cout << \"Women's negative answers: \" << femaleNo << endl;\n}\n\
  ```\n\n### 最终程序\n\n包含主代码和所有子程序的最终程序所示：\n\n```cpp\nproject_37.7\n#include <iostream>\n\
  #include <algorithm/string.hpp>\nusing boost::algorithm;\nusing namespace std;\n\
  \n//First part\nstring getGender(int i) {\n    string gender, temp1;\n    do {\n\
