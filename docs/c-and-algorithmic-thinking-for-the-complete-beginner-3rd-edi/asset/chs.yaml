  \ 25 的近似平方根为 5.02。\n\n![](img/notice.jpg)显然，如果需要更高的精度，你可以选择继续该过程，直到找到一个被认为更接近 25\
  \ 平方根的值。\n\n现在，让我们对应的 C++ 程序。\n\n![](img/my_exercise_header.png)\n\n```cpp\nproject_30.5-7\n\
  #include <iostream>\n#include <ctime>\n#include <cstdlib>\nusing namespace std;\n\
  const double ACCURACY = 0.0000000000001;\nint main() {\n    double y, guess;\n \
  \   srand(time(NULL));\n    cout << \"Enter a non-negative number: \";\n    cin\
  \ >> y;\n    while (y < 0) {\n        cout << \"Invalid value. Enter a non-negative\
  \ number: \";\n        cin >> y;\n    }\n    guess = 1 + rand()%((int)y);  //在 1\
  \ 到用户提供的值之间产生一个随机初始猜测\n    while (abs(guess * guess - y) > ACCURACY) { //“足够接近”吗？\n\
  \        guess = (guess + y / guess) / 2;    //不是，创建一个新的“猜测”！\n    }\n    cout <<\
  \ guess << endl;\n    return 0;\n}\n```\n\n![](img/notice.jpg)注意检查“是否足够接近”的方式。当差的绝对值\
  \ `|guess² - y|` 小于 `0.0000000000001`（其中 `y` 是用户提供的值）时，执行流退出循环。\n\n### 练习 30.5-8\
  \ 计算 π\n\n编写一个 C++ 程序，使用 Madhava–Leibniz 级数计算 `π`，精度为 0.00001。\n\n![Image](img/chapter30-06.png)\n\
  \n##### 解决方案\n\nMadhava–Leibniz 级数可以求解 `π`，变为\n\n![Image](img/chapter30-07.png)\n\
  \n分式越多，精度越高！因此，为了计算这个公式，程序需要进行多次迭代，以便尽可能使用多的分数。但当然，它不能无限迭代！当当前计算出的 `π` 值与上一次迭代计算出的值“足够接近”时，循环必须停止迭代，这意味着它们差的绝对值已经变得很小。常量\
  \ `ACCURACY` 定义了这个差值必须小到什么程度。这里是 C++ 程序。\n\n```cpp\nmy_exercise_header.png\nproject_30.5-8\n\
  #include <iostream>\nusing namespace std;\nconst double ACCURACY = 0.00001;\nint\
  \ main() {\n    double pi, piPrevious;\n    int sign, denom;\n    pi = 0;\n    sign\
  \ = 1; //这是第一个分数的符号\n    denom = 1; //这是第一个分数的分母\n    do {\n        piPrevious =\
  \ pi; //保留上一个 pi\n        pi += sign * 4 / (double)denom; //通过加上分数（项）计算新的 pi\n \
  \       sign = -sign; //为下一个分数准备符号\n        denom += 2; //为下一个分数准备分母\n    } while\
  \ (abs(pi - piPrevious) > ACCURACY); //“足够接近”吗？\n    cout << \"Pi ~= \" << pi <<\
  \ endl;\n    return 0;\n}\n```\n\n![](img/notice.jpg)注意 `sign` 在每次迭代中于 `-1` 和 `+1`\
  \ 之间切换的方式。如果你减小 `ACCURACY` 的值，`π` 将计算得更精确。取决于你电脑的速度，你可以快速计算出 `π` 的前五位。然而，计算 `π`\
  \ 后续每个数字所需的时间呈指数级增长。使用这种方法计算 40 位 `π` 可能需要多年时间！\n\n### 练习 30.5-9 用分数近似实数\n\n编写一个\
  \ C++ 程序，提示用户输入一个 0 到 100 之间的实数，并尝试找到近似它的分式，其中 `N` 是 0 到 100 之间的整数，`M` 是 1 到 100\
  \ 之间的整数。使用循环控制结构，程序还必须验证输入，允许用户输入 0 到 100 之间的值。不需要显示任何错误信息。\n\n##### 解决方案\n\n解决方案很简单。你所做的就是遍历变量\
  \ `n` 和 `m` 的所有可能组合，并检查哪一个能更好地近似用户提供的实数。\n\n为了遍历变量 `n` 和 `m` 的所有可能组合，你可以使用嵌套循环结构，即嵌套在内部的两个\
  \ `for`-循环，如下：\n\n```cpp\nfor (n = 0; n <= 100; n++) {\n    for (m = 1; m <= 100;\
  \ m++) {\n        ...\n    }\n}\n```\n\n![](img/notice.jpg)总迭代次数为 `101 × 100 = 10100`。这是一个很大的数字，但对于现代计算机来说，这小小碟！\n\
  \n![](img/notice.jpg)变量 `m` 代表分的分母，分母不能为零。这就是为什么它从 1 开始而不是从 0 开始。以下标准 ![Image](img/chapter30-09.png)\
  \ 可以评估近似值有多“好”。\n\n困惑吗？让我们尝试用分数近似值 `0.333`，遍历 `N` 和 `M` 的所有可能组合。\n\n- 对于 `N = 1,\
  \ M = 1`，标准等于 ![Image](img/chapter30-10.png) = `0.6670`\n- 对于 `N = 1, M = 2`，标准等于\
  \ ![Image](img/chapter30-11.png) = `0.1670`\n- 对于 `N = 1, M = 3`，标准等于 ![Image](img/chapter30-12.png)\
  \ = `0.0003`\n- 对于 `N = 1, M = 4`，标准等于 ![Image](img/chapter30-13.png) = `0.0830`\n\
  - ...\n- 对于 `N = 100, M = 99`，标准等于 ![Image](img/chapter30-14.png) = `0.6771`\n-\
  \ 对于 `N = 100, M = 100`，标准等于 ![Image](img/chapter30-15.png) = `0.6670`\n\n显而易见`0.0003`\
  \ 是所有可能结果中的最小值。因此，组合 `N = 1` 和 `M = 3`（对应分数 `1/3`）被认为是值 `0.333` 的最佳近似。\n\n现在是 C++\
  \ 程序：\n\n```cpp\nmy_exercise_header.png\nproject_30.5-9\n#include <iostream>\nusing\
  \ namespace std;\nint main() {\n    double x, y, minimum;\n    int bestN, bestM,\
  \ n, m;\n    do {\n        cout << \"Enter a real between 0 and 100: \";\n     \
  \   cin >> x;\n    } while (x < 0 || x > 100);\n    minimum = 100;\n    for (n =\
  \ 0; n <= 100; n++) {\n        for (m = 1; m <= 100; m++) {\n            y = abs(n\
  \ /(double)m - x);\n            if (y < minimum) {\n                minimum = y;\n\
  \                bestN = n;\n                bestM = m;\n            }\n       \
  \ }\n    }\n    cout << \"The fraction is: \" << bestN << \" / \" << bestM << endl;\n\
  \    return 0;\n}\n```\n\n![](img/notice.jpg)将变量 `m` 转换为 `double` 类型可以欺骗 C++ 执行普通除法（返回实数的除法）。如果你省略\
  \ `(double)` 转换运算符，由于被除和除数都是 `int`，C++ 将执行整数除法并产生错误结果。\n\n### 30.6 循环结构的通用练习\n\n\
  #### 练习 30.6-1 华氏度到开尔文度，从 0 到 100\n\n编写一个 C++ 程序，显示 0 到 100 的所有华氏度以及它们对应的开尔文度。使用增量\
  \ 0.5。已知 `1.8 × Kelvin = Fahrenheit + 459.67`。\n\n##### 解决方案\n\n求解 `Kelvin` 的公式变为\
  \ ![Image](img/chapter30-16.png)\n\n这里你需要一个以 0.5 偏移量增加变量 `fahrenheit` 从 0 到 100\
  \ 的 `for`-循环。解决方案如下所示。\n\n```cpp\nmy_exercise_header.png\nproject_30.6-1\n#include\
  \ <iostream>\nusing namespace std;\nint main() {\n    double fahrenheit, kelvin;\n\
  \    for (fahrenheit = 0; fahrenheit <= 100; fahrenheit += 0.5) {\n        kelvin\
  \ = (fahrenheit + 459.67) / 1.8;\n        cout << \"Fahrenheit: \" << fahrenheit\
  \ << \" Kelvin: \" << kelvin << endl;\n    }\n    return 0;\n}\n```\n\n### 练习 30.6-2\
  \ 棋盘上的米\n\n\n\n\n\n关于一个发明了象棋的穷人有一个传说。印度国王对这个新游戏非常满意，他提议给那个穷人他想要的任何东西。那位贫穷但聪明的男人告诉国王，他希望棋盘的第一个格子要一粒米，第二个格子两粒，第三个格子四粒，以此类推，棋盘上\
  \ 64 个格子中的每一个格子米数都翻倍。国王认为这是一个非常谦和的要求，于是命令仆人拿来大米。\n\n编写一个 C++ 程序，计算并显示棋盘上最后有多少粒米以及多少磅米。假设一磅米大约包含\
  \ 30,000 粒。\n\n##### 解决方案\n\n假设棋盘只有 2 × 2 = 4 个格子，并且变量 `grains` 被赋予初始值 1（这是第 1 个格子的米数）。循环三次的\
  \ `for` 循环可以在每次迭代中将变量 `grains` 的值翻倍，如下代码片段所示。\n\n```cpp\ngrains = 1;\nfor (i = 2;\
  \ i <= 4; i++) {\n    grains = 2 * grains;\n}\n```\n\n变量 `grains` 在每次迭代结束时的值如下表所示。\n\
  \n| 迭代 | grains 的值 |\n| --- | --- |\n| 第 1 次 | 2 × 1 = 2 |\n| 第 2 次 | 2 × 2 = 4\
  \ |\n| 第 3 次 | 2 × 4 = 8 |\n\n在第 3 次迭代结束时，变量 `grains` 的值为 8。这个值并不是棋盘上的总米数，而只是第 4\
  \ 个格子的米数。如果你需要找到棋盘上的总米数，可以叠加所有格子的米数，即 1 + 2 + 4 + 8 = 15。\n\n在现实世界中，真正的棋盘包含 8 ×\
  \ 8 = 64 个格子，因此你需要迭代 63 次。C++ 程序如下。\n\n```cpp\n#include <iostream>\nusing namespace\
  \ std;\n\nint main() {\n    int i;\n    unsigned long long grains, total;\n    double\
  \ weight;\n    total = grains = 1;\n    for (i = 2; i <= 64; i++) {\n        grains\
  \ = 2 * grains;\n        total = total + grains;\n    }\n    weight = total / 30000.0;\n\
  \    cout << total << \"  \" << weight << endl;\n    return 0;\n}\n```\n\n如果你好奇这些数字有多大，这里是答案：棋盘上将会有\
  \ 18,446,744,073,709,551,615 粒米；即 614,891,469,123,651.8 磅！\n\n不将变量 `grains` 和 `total`\
  \ 声明为 `int` 甚至 `long` 的原因是这两种类型无法容如此巨大的数字。`long` 类型的上限是 +2⁶³ − 1，遗憾的是，这仍然不够。\n\n\
  ## 练习题 30.6-3 仅仅是调查\n\n一家民意调查公司询问 1000 名市民他们早上是否吃早餐。编写一个 C++ 程序，提示市民输入性别（M 代表男性，F\
  \ 代表女性，O 代表其他）以及对该问题的回答（Y 代表是，N 代表否，S 代表有时），然后计算并显示回答“是”的市民人数，以及在回答“否”的市民中女性的百分比。使用循环控制结构，程序还必须验证数据输入，并且性别只接受值\
  \ M、F 或 O，回答只接受值 Y、N 或 S。\n\n##### 解决方案\n\n该 C++ 程序如下。\n\n```cpp\n#include <iostream>\n\
  #include <boost/algorithm/string.hpp>\nusing namespace boost::algorithm;\nusing\
  \ namespace std;\n\nconst int CITIZENS = 1000;\n\nint main() {\n    int totalYes,\
  \ femaleNo, i;\n    string gender, answer;\n    totalYes = femaleNo = 0;\n    for\
  \ (i = 1; i <= CITIZENS; i++) {\n        do {\n            cout << \"Enter gender:\
  \ \";\n            cin >> gender;\n            gender = to_lower_copy(gender);\n\
  \        } while (gender != \"m\" && gender != \"f\" && gender != \"o\");\n    \
  \    do {\n            cout << \"Do you eat breakfast in the morning? \";\n    \
  \        cin >> answer;\n            answer = to_lower_copy(answer);\n        }\
  \ while (answer != \"y\" && answer != \"n\" && answer != \"s\");\n        if (answer\
  \ == \"y\") {\n            totalYes++;\n        }\n        if (gender == \"f\" &&\
  \ answer == \"n\") {\n            femaleNo++;\n        }\n    }\n    cout << totalYes\
  \ << \"  \" << femaleNo * 100 / (double)CITIZENS << \"%\" << endl;\n    return 0;\n\
  }\n```\n\n## 练习题 30.6-4 判定消息是回文吗？\n\n回文是指正读和反读都相同的单词或句子。（你可能记得在练习题 23.5-4 中数字也可以是回文）。编写一个\
