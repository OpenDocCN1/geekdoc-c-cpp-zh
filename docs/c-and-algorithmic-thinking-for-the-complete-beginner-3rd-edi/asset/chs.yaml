  \n### 4) 在希腊，你至少满 16 岁就可以驾驶小型滑板车，而年满 18 岁就可以驾驶汽车。编写一个 C++ 程序，提示用户输入其年龄，然后根据用户的年龄显示以下消息之一：\n\
  \n* 当用户小于 16 岁时，显示“你既不能驾驶小型滑板车也不能驾驶汽车”。\n* 当用户在 16 到 18 岁之间时，显示“你可以驾驶小型滑板车”。\n*\
  \ 当用户满 18 岁或以上时，显示“你可以驾驶汽车也可以驾驶小型滑板车”。\n\n当用户输入无效值时，必须显示错误信息。\n\n### 5) 一个滑板工厂的经理需要一个程序来计算工厂在一个月内的利润或亏损。以下是一些信息：\n\
  \n* 工厂制造每块滑板的为 150 美元。\n* 滑板售价为每个 250 美元。\n* 工厂每月为每位员工支付 1000 美元的保险。\n\n编写一个 C++\
  \ 程序，提示用户输入销售的滑板数量和公司的员工人数。根据公司的财务状况，程序随后必须显示以下消息之一：\n\n* 利润（Profit）\n* 亏损（Loss）\n\
  * 持平（Broke even）\n\n当用户销售的滑板数量为负数或员工人数非正数时，必须显示错误信息。\n\n### 6) 编写一个 C++ 程序，提示用户输入其姓名。程序必须选择一个\
  \ 1 到 24 之间的随机整数代表一个小时，然后必须显示消息“小时是 HH:00”，并根据该数字显示“Good morning NN!”、“Good Evening\
  \ NN!”、“Good Afternoon NN!”或“Good Night NN!”，其中 HH 是随机选择的小，NN 是用户名。完成两次练习，一次使用嵌套决策结构，另一次使用多分支决策结构。\n\
  \n### 7) 编写一个 C++ 程序，提示用户输入三角形三边的长度，然后判断用户提供的数字是否可以作为三角形的三边长。如果长度无效，必须显示相应的消息；否则，程序必须进一步判断该三角形是：\n\
  \na) 等边三角形\n提示：在等边三角形中，所有的边都相等。\n\nb) 直角三角形（right-angled）\n提示：使用勾股定理。\n\nc) 非特殊三角形\n\
  提示：在任何三角形中，每边的长度都小于另外两边长度之和。\n\n### 8) 自动取款机（ATM）内部有 10 美元、5 美元和 1 美元的钞票。编写一个 C++\
  \ 程序来模拟这台 ATM 的工作方式。开始时，机器提示用户输入四位 PIN 码，然后检查 PIN 的有效性（假设“1234”为有效 PIN）。如果用户提供的\
  \ PIN 正确，程序必须提示用户输入他们想要取出的金额（一个整数值），最后显示 ATM 必须取出的最少钞票数量。例如，如果用户输入 36 美元，程序必须显示“3\
  \ 张 10 美元钞票，1 张 5 美元钞票和 1 张 1 美元钞票”。此外，如果用户输入了错误的 PIN，机器将允许他们重试两次。如果用户三次都输入错误的 PIN，则必须显示消息“PIN\
  \ locked”并结束程序。假设用户输入的金额是有效值。\n\n### 9) 编写一个 C++ 程序，提示用户输入两个值，一个是温度，另一个是风速。如果温度高于\
  \ 75 华氏度，则该天被认为是炎热，否则为寒冷。如果风速超过每小时 12 英里，则该天被认为是大风，否则无风。程序必须根据用户提供的的值显示一条单一消息。例如，如果用户输入的温度是\
  \ 60，风速是 10，程序必须显示“该天气寒冷且无风”。假设用户输入的是有效值。\n\n---\n\n# 第 21 章\n## 更多关于决策控制结构的流程图\n\
  \n### 21.1 引言\n\n通过学习前面的章节，你已经熟悉了所有的决策控制结构。由于流程图是学习“算法思维”并帮助更好地理解特定控制结构的理想方式，本章专门用于教你如何将\
  \ C++ 程序转换为流程图，或将流程图转换为 C++ 程序。\n\n### 21.2 将 C++ 程序转换为流程图\n\n要将 C++ 程序转换为其对应的流程图，你需要回忆所有的决策控制结构及其对应的流程图片段。它们在这里都已总结完毕。\n\
  \n单分支决策结构\n\n![Image](img/chapter16-01.png)\n\n双分支决策结构\n\n![Image](img/chapter17-01.png)\n\
  \n多分支决策结构\n\n![Image](img/chapter18-01.png)\n\n![](img/notice.jpg)你也可以使用这个相同的流程图来表示使用\
  \ case 决策结构的 C++ 代码！\n\n#### 练习 21.2-1 设计流程图\n\n设计与以下 C++ 程序对应的流程图。\n\n```cpp\n\
  #include <iostream>\n#include <cmath>\nusing namespace std;\nint main() {\n    double\
  \ x, z, w, y, a;\n    cin >> x;\n    z = pow(x, 3);\n    w = (z - 4) * (x - 3) /\
  \ 7 + 36;\n    if (z >= w && x < z) {\n        y = 2 * x;\n        if (y > 0) {\
  \ // 嵌套的单分支决策结构\n            y++;\n        }\n    } else {\n        y = 4 * x;\n\
  \    }\n    cout << y << endl;\n    return 0;\n}\n```\n\n##### 解在这个 C++ 程序中有一个单分支决策结构嵌套在双分支决策结构中。其对应的流程图所示。\n\
  \n![Image](img/chapter21-01.png)\n\n![](img/remember.jpg)流程图是表示算法的一种非常灵活的方法。因此，只要熟悉流程图的人就能清楚你想表达什么。你可以写\
  \ `x³` 甚至使用 C++ 函数 `pow()`。随你所欲。\n\n![](img/remember.jpg)在流程图中，本书使用了常用的 AND、OR 和\
  \ NOT 运算符！\n\n#### 练习 21.2-2 设计流程图\n\n设计与以下通用形式代码片段对应的流程图。\n\n```cpp\nif (Boolean_Expression_A)\
  \ {\n    A statement or block of A1\n    if (Boolean_Expression_B) {\n        A\
  \ statement or block of B1\n    }\n    A statement or block of A2\n} else {\n  \
  \  A statement or block of A3\n    if (Boolean_Expression_C) {\n        A statement\
  \ or block of C1\n    } else {\n        A statement or block of C2\n    }\n}\n```\n\
  \n##### 解为了方便观察，再次给出代码片段，并将嵌套决策结构封装在矩形中。\n\n```cpp\nif (Boolean_Expression_A) {\n\
  \    A statement or block of A1\n    if (Boolean_Expression_B) {\n        A statement\
  \ or block of B1\n    }\n    A statement or block of A2\n} else {\n    A statement\
  \ or block of A3\n    if (Boolean_Expression_C) {\n        A statement or block\
  \ of C1\n    } else {\n        A statement or block of C2\n    }\n}\n```\n\n通用形式的流程图片段所示。\n\
  \n![Image](img/chapter21-02.png)\n\n#### 练习 21.2-3 设计流程图\n\n设计与以下 C++ 程序对应的流程图。\n\
  \n```cpp\n#include <iostream>\nusing namespace std;\nint main() {\n    double a,\
  \ y, b;\n    cin >> a;\n    if (a < 0)\n        y = a * 2;\n    else if (a < 10)\n\
  \        y = a / 2;\n    else if (a < 100)\n        y = a + 2;\n    else {\n   \
  \     cin >> b;\n        y = a * b;\n        if (y > 0) { // 这是一个嵌套的双分支决策结构\n  \
  \          y--;\n        } else\n        {}\n    }\n}\n```\n\n\n\n\n\n```cpp\ny++;\
  \      //\n}\ncout << y << endl;return 0;}\n```\n\n##### 解决方案\n\n在这个 C++ 程序中，一个双分支决策结构嵌套在一个多分支决策结构之中。\n\
  \n流程图所示。\n\n![Image](img/chapter21-03.png)\n\n### 21.3 一个你可能会犯的错误！\n\n在流程图中，初级程序员经常犯的一个常见错误是让某些路径未连接，如下方的流程所示所示\n\
  \n![Image](img/chapter21-04.png)\n\n请记住，每条路径都试图到达算法的终点，因此你不能留下任何一条未连接的路径。\n\n另一方面，尽量避免使用许多\
  \ `End` 符号的流程图（如下），因为这些算法难以阅读和理解。\n\n![Image](img/chapter21-05.png)\n\n假设你正在设计流程图的中间（见下图），并且你想要开始关闭所有的决策控制结构。\n\
  \n![Image](img/chapter21-06.png)\n\n只需记住，最后打开的决策控制结构必须第一个关闭！在这个例子中，最后一个决策控制结构是评估表达式\
  \ `a < 30` 的那一个。这是你需要关闭的第一个，此处所示。\n\n![Image](img/chapter21-07.png)\n\n接下来，你需要像此处所示关闭倒数第二个决策控制结构。\n\
  \n![Image](img/chapter21-08.png)\n\n最后，你需要像此处所示关闭倒数第三个决策控制结构。\n\n![Image](img/chapter21-09.png)\n\
  \n最后一个流程图可以重新排列，变成此处所示的样子。\n\n![Image](img/chapter21-10.png)\n\n### 21.4 将流程图转换为\
  \ C++ 程序\n\n这种转换并不总是容易。在某些情况下，流程图设计者没有遵循特定的规则，因此在将流程图转换为 C++ 程序之前，可能需要对其进行一些修改。其中一个情况的例如下。\n\
  \n![Image](img/chapter21-11.png)\n\n如你所见，此流程图片段包含的决策控制结构与你已经学习的任何决策控制结构都不匹配。因此，你只有一个选择，那就是通过添加额外的语句或删除现有语句来修改流程图，直到已知的决策控制结构开始出现。以下是一些初始流程图确实需要修改的练习。\n\
  \n#### 练习 21.4-1 编写 C++ 程序\n\n编写与以下流程图对应的 C++ 程序。\n\n![Image](img/chapter21-12.png)\n\
  \n##### 解决方案\n\n这非常简单。你必须克服的唯一障碍是真路径和假路径并不在正确的位置。你需要使用真路径而不是假路径来实际包含单分支决策结构中的语句。\n\
  \n交换这两条路径是可能的，但你还需要对相应的布尔表达式取反。以下两个流程图片段是等价的。\n\n![Image](img/chapter21-13.png)\n\
  \n因此，流程图可以修改并看起来如下所示。\n\n![Image](img/chapter21-14.png)\n\n对应的 C++ 程序如下所示。\n\n```cpp\n\
  #include <iostream>\nusing namespace std;\nint main() {\n    double x, y;\n    cin\
  \ >> x;\n    y = 50;\n    if (x / 2 <= 10) {\n        x = x / 3;\n        y = x\
  \ + 4;\n    }\n    cout << y << endl;\n    return 0;\n}\n```\n\n#### 练习 21.4-2 编写\
  \ C++ 程序\n\n编写与以下流程图对应的 C++ 程序。\n\n![Image](img/chapter21-15.png)\n\n##### 解决方案\n\
  \n在这个练习中，一个双分支决策结构嵌套在一个单分支结构中。你只需要对布尔表达式 `x == 100` 取反并交换真/假路径。C++ 程序如下所示。\n\n```cpp\n\
  #include <iostream>\nusing namespace std;\nint main() {\n    double x, y;\n    cin\
  \ >> x;\n    y = 1;\n    if (x != 100) {  //这是一个单分支决策结构\n        cin >> y;\n   \
  \     if (x < y) {   //这是一个嵌套的双分支决策结构\n            x = x - 3;\n            y = x\
  \ + 4;\n        } else {\n            x = x / 3 + 5;\n            y = x + 20;\n\
  \        }\n    }\n    cout << x << \"  \" << y << endl;\n    return 0;\n}\n```\n\
  \n#### 练习 21.4-3 编写 C++ 程序\n\n编写与以下流程图对应的 C++ 程序。\n\n![Image](img/chapter21-16.png)\n\
  \n##### 解决方案\n\n在这个流程图中，决策控制结构与你学习的任何决策控制结构都不匹配。因此，你必须通过添加额外的语句或删除现有语句来修改流程图，直到已知的决策控制结构开始出现！\n\
  \n在这个练习中必须克服的障碍是评估 `y MOD x ≠ 1` 布尔表达式的决策控制结构。注意，当执行流遵循假路径时，它会在到达算法终点之前执行语句 `a ←\
  \ 20` 然后执行语句 `Write a`。因此，如果你简单在假路径内部添加新语句 `Write a`，就可以保持执行流的完整。以下流程图与初始流程图等价。\n\
  \n![Image](img/chapter21-17.png)\n\n现在，流程图包含了已知决策控制结构；也就是说，一个嵌套在另一个双分支结构中的双分支决策结构。C++\
  \ 程序如下。\n\n```cpp\n#include <iostream>\nusing namespace std;\nint main() {\n   \
  \ double x, y;\n    cin >> x;\n    if (x % y != 1) {\n        if (x < y) {\n   \
