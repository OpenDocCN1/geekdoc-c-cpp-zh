- - '###'
  - 7) 编写一个 C++ 程序，提示用户输入三边的长度，然后判断数字是否可以作为三角形。如果无效，必须显示相应的消息；否则，程序进一步判断三角形是：
- - '###'
  - 8) 自动取款机（ATM）内部有 10 元、5 元和1 元。编写一个 C++ 程序来模拟这台 ATM。开始时，机器提示输入四位 PIN 码，然后检查 PIN
    是否有效（假设1234有效）。如果提供的 PIN 正确，程序提示用户想要取出的金额（一个整数）。如果用户输入错误，机器允许他们重试。如果三次都输入错误，必须显示“PIN
    locked”并结束。
- - '###'
  - 9) 编写一个 C++ 程序，提示用户输入两个值，一个是温度，另一个是风速。如果温度高于 75 华氏度，该天认为是炎热；如果风速超过 12，该天认为是大风。程序必须根据用户的值显示一条消息。例如，如果温度是
    60，风速是 10，程序必须显示“寒冷且无风”。假设输入的是有效值。
