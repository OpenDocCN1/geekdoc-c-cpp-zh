    ## - Singleton with double-checked locking


    In software design, the Singleton pattern is a creational pattern that ensures
    a class has only one instance and provides a global point of access to it. This
    pattern is widely used when exactly one object is needed to coordinate actions
    across the system, such as configuration settings or logging.


    However, ensuring thread safety in a Singleton implementation can be challenging.
    One effective solution is the Double-Checked Locking (DCL) idiom, which combines
    lazy initialization with minimal synchronization overhead.


    Concept and Workflow


    1\. Singleton: A class designed to have a single instance throughout the application''s
    lifecycle.


    2\. Lazy Initialization: Deferring the creation of the Singleton instance until
    it is first needed.


    3\. Double-Checked Locking: Reducing the overhead of acquiring a lock by first
    checking if the instance is already created outside of the lock and then again
    inside the lock.


    Key Characteristics


    - Thread Safety: Ensures that the Singleton instance is created only once, even
    in a multithreaded environment.


    - Performance: Minimizes the synchronization overhead by locking only when the
    instance is being created for the first time.


    - Lazy Initialization: The Singleton instance is created only when it is needed,
    saving resources if it is never used.


    Implementing Singleton with Double-Checked Locking in C++


    The Double-Checked Locking pattern involves checking the instance twice: once
    before acquiring the lock (to avoid unnecessary synchronization) and once after
    acquiring the lock (to ensure the instance is still not created by another thread).
    Here''s a step-by-step guide to implementing this pattern in C++.


    Step-by-Step Implementation


    Step 1: Define the Singleton Class


    ```cpp


    class Singleton {


    private:


    static Singleton* instance;


    static std::mutex mtx;


    // Private constructor to prevent instantiation


    Singleton() {


    std::cout << "Singleton instance created" << std::endl;


    }


    // Delete copy constructor and assignment operator to prevent copying


    Singleton(const Singleton&) = delete;


    Singleton& operator=(const Singleton&) = delete;


    public:


    static Singleton* getInstance() {


    if (instance == nullptr) {


    std::lock_guard<std::mutex> lock(mtx);


    if (instance == nullptr) {


    instance = new Singleton();


    }


    }


    return instance;


    }


    void doSomething() {


    std::cout << "Singleton instance is doing something" << std::endl;


    }


    };


    // Initialize static member variables


    Singleton* Singleton::instance = nullptr;


    std::mutex Singleton::mtx;


    ```


    Explanation


    1\. Private Constructor: Ensures that the Singleton instance cannot be created
    outside the class.


    2\. Deleted Copy Constructor and Assignment Operator: Prevents the Singleton instance
    from being copied or assigned.


    3\. Static Instance and Mutex: The `instance` pointer holds the Singleton instance,
    and `mtx` is used for synchronization.


    4\. getInstance() Method:


    - First, checks if `instance` is `nullptr` outside the lock.


    - Acquires the lock using `std::lock_guard<std::mutex>`.


    - Checks again if `instance` is `nullptr` inside the lock, then creates the Singleton
    instance if it is.


    Step 2: Usage Example


    ```cpp


    int main() {


    std::thread t1([] {


    Singleton::getInstance()->doSomething();


    });


    std::thread t2([] {


    Singleton::getInstance()->doSomething();


    });


    t1.join();


    t2.join();


    return 0;


    }


    ```


    In this example:


    - Two threads (`t1` and `t2`) attempt to get the Singleton instance and call `doSomething()`
    on it.


    - Both threads will safely get the same Singleton instance due to the double-checked
    locking mechanism.


    Key Points and Considerations


    1\. Thread Safety: Double-checked locking ensures that the Singleton instance
    is created in a thread-safe manner, preventing multiple threads from creating
    separate instances.


    2\. Performance: By checking the instance outside the lock, the performance overhead
    of acquiring a lock is minimized, as the lock is only acquired when the instance
    needs to be created.


    3\. Memory Ordering: The correctness of double-checked locking depends on the
    memory model. In C++, memory orderings and visibility issues are addressed by
    the use of `std::atomic` and proper synchronization mechanisms.


    Modern C++ Singleton with Double-Checked Locking


    In modern C++ (C++11 and beyond), we can leverage `std::atomic` to ensure memory
    order consistency and simplify the implementation of a Singleton with double-checked
    locking.


    ```cpp


    #include <atomic>


    #include <mutex>


    #include <iostream>


    #include <thread>


    class Singleton {


    private:


    static std::atomic<Singleton*> instance;


    static std::mutex mtx;


    Singleton() {


    std::cout << "Singleton instance created" << std::endl;


    }


    Singleton(const Singleton&) = delete;


    Singleton& operator=(const Singleton&) = delete;


    public:


    static Singleton* getInstance() {


    Singleton* tmp = instance.load(std::memory_order_acquire);


    if (tmp == nullptr) {


    std::lock_guard<std::mutex> lock(mtx);


    tmp = instance.load(std::memory_order_relaxed);


    if (tmp == nullptr) {


    tmp = new Singleton();


    instance.store(tmp, std::memory_order_release);


    }


    }


    return tmp;


    }


    void doSomething() {


    std::cout << "Singleton instance is doing something" << std::endl;


    }


    };


    std::atomic<Singleton*> Singleton::instance{nullptr};


    std::mutex Singleton::mtx;


    int main() {


    std::thread t1([] {


    Singleton::getInstance()->doSomething();


    });


    std::thread t2([] {


    Singleton::getInstance()->doSomething();


    });


    t1.join();


    t2.join();


    return 0;


    }


    ```


    Explanation


    1\. std::atomic<Singleton*> instance: Ensures atomic load and store operations,
    addressing memory ordering issues.


    2\. Memory Orderings:


    - `std::memory_order_acquire`: Ensures that subsequent reads and writes in the
    current thread cannot be reordered before this load.


    - `std::memory_order_release`: Ensures that previous writes in the current thread
    cannot be reordered after this store.


    - `std::memory_order_relaxed`: Allows for relaxed memory ordering during intermediate
    checks.


