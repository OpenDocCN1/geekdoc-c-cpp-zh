    ## - Future, promise, and async handling


    In modern C++ programming, especially in concurrent and parallel applications,
    futures, promises, and the `async` function play crucial roles. They provide a
    standardized way to manage asynchronous operations, allowing developers to write
    code that can handle tasks running in parallel without getting bogged down in
    complex thread management.


    A future represents a value that may be available at some point in the future.
    A promise is an object that can set the value of a future. The `async` function
    is a high-level abstraction that simplifies running tasks asynchronously and obtaining
    their results.


    Understanding Futures


    A future is an object that can be used to retrieve the result of an asynchronous
    operation. It acts as a placeholder for a value that will be computed in the future.
    The C++ Standard Library provides the `std::future` class to handle futures.


    Basic Usage of `std::future`


    ```cpp


    #include <iostream>


    #include <future>


    #include <thread>


    int computeSquare(int x) {


    std::this_thread::sleep_for(std::chrono::seconds(2)); // Simulate a long computation


    return x * x;


    }


    int main() {


    std::future<int> futureResult = std::async(std::launch::async, computeSquare,
    5);


    std::cout << "Waiting for the result..." << std::endl;


    int result = futureResult.get(); // Wait for the computation to finish and get
    the result


    std::cout << "Result: " << result << std::endl;


    return 0;


    }


    ```


    In this example:


    - `std::async` is used to run `computeSquare` asynchronously.


    - `futureResult` is a future that holds the result of the computation.


    - `get` is called in the future to retrieve the result, blocking until the result
    is ready.


    Understanding Promises


    A promise is an object that allows setting the value of a future. It provides
    a way to pass a value or an exception from one thread to another. The C++ Standard
    Library provides the `std::promise` class to handle promises.


    Basic Usage of `std::promise`


    ```cpp


    #include <iostream>


    #include <future>


    #include <thread>


    void computeSquare(std::promise<int>& prom, int x) {


    std::this_thread::sleep_for(std::chrono::seconds(2)); // Simulate a long computation


    prom.set_value(x * x); // Set the result


    }


    int main() {


    std::promise<int> prom;


    std::future<int> futureResult = prom.get_future();


    std::thread t(computeSquare, std::ref(prom), 5);


    std::cout << "Waiting for the result..." << std::endl;


    int result = futureResult.get(); // Wait for the computation to finish and get
    the result


    std::cout << "Result: " << result << std::endl;


    t.join();


    return 0;


    }


    ```


    In this example:


    - A `std::promise` object is created.


    - The `get_future` method of the promise is used to obtain a future.


    - The promise is passed to a thread, which sets the result of the promise.


    - The main thread waits for the result using the future.


    Using `async` for Asynchronous Execution


    The `async` function simplifies the process of running tasks asynchronously and
    obtaining their results. It abstracts the creation of threads and management of
    futures and promises.


    Basic Usage of `std::async`


    ```cpp


    #include <iostream>


    #include <future>


    #include <thread>


    int compute


    Square(int x) {


    std::this_thread::sleep_for(std::chrono::seconds(2)); // Simulate a long computation


    return x * x;


    }


    int main() {


    auto futureResult = std::async(std::launch::async, computeSquare, 5);


    std::cout << "Waiting for the result..." << std::endl;


    int result = futureResult.get(); // Wait for the computation to finish and get
    the result


    std::cout << "Result: " << result << std::endl;


    return 0;


    }


    ```


    In this example, `std::async` is used to run the `computeSquare` function asynchronously,
    and the result is obtained using the future.


    Advanced Features and Usage Patterns


    1\. Deferred Execution: By default, `std::async` can either run a function asynchronously
    or defer its execution until `get` or `wait` is called on the future. This behavior
    can be controlled using the `std::launch` policy.


    ```cpp


    #include <iostream>


    #include <future>


    #include <thread>


    int computeSquare(int x) {


    std::this_thread::sleep_for(std::chrono::seconds(2)); // Simulate a long computation


    return x * x;


    }


    int main() {


    auto futureResult = std::async(std::launch::deferred, computeSquare, 5);


    std::cout << "Future created. Calling get..." << std::endl;


    int result = futureResult.get(); // This will trigger the computation


    std::cout << "Result: " << result << std::endl;


    return 0;


