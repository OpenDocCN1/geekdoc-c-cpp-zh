    \n## 进程 vs 线程：详细比较\n\n### 内存管理\n- **进程**：每个进程都有自己独立的内存空间。这种隔离提供了保护，但需要更多的内存开销以及由操作系统进行更复杂的内存管理。\n\
    - **线程**：同一进程内的线程共享同一个内存空间。这允许高效的数据共享，但需要仔细的同步以避免数据损坏。\n\n### 资源分配\n- **进程**：操作系统为每个进程独立地分配资源（例如内存、文件句柄）。进程之间不直接共享资源，增强了安全性和稳定性。\n\
    - **线程**：线程共享其父进程分配的资源。这减少了资源开销，并允许更高效地利用资源。\n\n### 上文切换\n- **进程**：进程之间的上下文切换涉及保存和恢复大量的状态信息，开销相对较大。\n\
    - **线程**：同一进程内线程之间的上下文切换较轻量，因为线程共享相同的内存和资源上下文。这导致了更快的上下文切换。\n\n### 通信\n- **进程**：进程之间的通信需要进程间通信（IPC）机制，如管道、消息队列和共享内存。IPC\
    \ 通常比进程内通信更慢且更复杂。\n- **线程**：线程可以通过共享内存直接进行通信，使得通信更快、更高效。然而，这需要同步来防止数据竞态。\n\n###\
