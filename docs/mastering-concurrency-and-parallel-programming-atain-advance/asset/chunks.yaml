    \ **资源管理**：妥善处理线程中断可以确保文件句柄、网络连接和内存等资源被正确释放。\n2. **响应能力**：能够优雅中断线程的应用程序具有更高的响应性，因为它们可以在需要时及时停止长时间运行的任务。\n\
    3. **避免死锁**：适当的中断处理可以防止线程无限期等待不再使用的资源，从而避免死锁。\n4. **优雅关机**：在需要受控关机的应用程序（如服务器和\
    \ GUI 应用程序）中，处理线程中断对于干净地停止线程至关重要。\n\n## 在 C++ 中实现线程中断\n\n在 C++ 中实现线程中断的一种常用方法是使用一个线程定期检查的共享原子标记（atomic\
    \ flag）。如果该标记被设置，线程将优雅退出。\n\n## 线程中断示例\n\n```cpp\n#include <iostream>\n#include\
    \ <thread>\n#include <atomic>\n#include <chrono>\n\nstd::atomic<bool> stopFlag(false);\n\
    \nvoid worker() {\n    while (!stopFlag.load()) {\n        std::this_thread::sleep_for(std::chrono::milliseconds(100));\n\
    \        std::cout << \"Working...\" << std::endl;\n    }\n    std::cout << \"\
    Worker thread exiting.\" << std::endl;\n}\n\nint main() {\n    std::thread t(worker);\n\
    \    std::this_thread::sleep_for(std::chrono::seconds(1));\n    stopFlag.store(true);\n\
    \    t.join();\n    std::cout << \"Main thread exiting.\" << std::endl;\n    return\
    \ 0;\n}\n```\n\n在此示例中：\n- `stopFlag` 是主线程和工作线程之间共享的原子标记。\n- 工作线程定期检查 `stopFlag`，如果其被设置则退出。\n\
    - 主线程在一秒后将 `stopFlag` 设置为 `true`，信号工作线程停止。\n\n## 处理线程中断的最佳实践\n\n1. **定期检查**：确保线程定期检查中断标记，特别是在长时间的循环或阻塞操作中。\n\
    2. **优雅清理**：在线程退出前实现清理代码以释放资源并恢复应用程序状态。\n3. **原子标记**：使用原子标记或其他线程安全机制来发送中断信号，避免竞态条件并确保跨线程的可见性。\n\
    4. **异常处理**：在线程中捕获并处理异常，以确保即使发生错误，线程也能妥善清理。\n5. **协作式取消**：设计您的线程以协作响应中断信号，而不是强制终止。\n\
    \n## 在阻塞操作中处理中断\n\n阻塞操作（如等待条件变量或 I/O 操作）会让线程中断变得复杂。在这些情况下，处理中断的一种方法是结合超时和中断检查。\n\
    \n## 在阻塞操作中处理中断的示例\n\n[content]\n\nFutures 和 Promises 也可用于处理线程中断，特别是在处理异步任务时。\n\
    \n## 使用 Futures 和 Promises 处理中断的示例\n\n```cpp\n#include <iostream>\n#include <future>\n\
    #include <atomic>\n#include <chrono>\n[/content] \n接上文：\n\n[content]\nstd::atomic<bool>\
    \ stopFlag(false);\n\nint computeTask() {\n    for (int i = 0; i < 10; ++i) {\n\
    \        if (stopFlag.load()) {\n            std::cout << \"Task interrupted.\"\
    \ << std::endl;\n            return -1;\n        }\n        std::this_thread::sleep_for(std::chrono::milliseconds(200));\n\
    \        std::cout << \"Computing...\" << std::endl;\n    }\n    return 42;\n\
    }\n\nint main() {\n    auto futureResult = std::async(std::launch::async, computeTask);\n\
    \    std::this_thread::sleep_for(std::chrono::seconds(1));\n    stopFlag.store(true);\n\
    \    int result = futureResult.get();\n    std::cout << \"Result: \" << result\
    \ << std::endl;\n    return 0;\n}\n```\n\n在此示例中：\n- `stopFlag` 用于向异步任务发送中断信号。\n\
    - `computeTask` 函数定期检查 `stopFlag`，如果其被设置则退出。\n\n## 第 5 章：并发数据结构\n\n### 线程安全的栈\n\
    \n栈遵循后进先出（LIFO）原则，最后添加的元素最先移除。为了实现线程安全的栈，我们需要确保 `push`（添加元素）和 `pop`（移除元素）操作是原子执行的。\n\
    \n#### 使用 Mutex 实现\n\n实现线程安全栈的一种直接方法是使用 `std::mutex` 来锁定栈。\n\n```cpp\n#include\
    \ <iostream>\n#include <stack>\n#include <mutex>\n#include <thread>\n#include\
    \ <vector>\n\ntemplate<typename T>\nclass ThreadSafeStack {\nprivate:\n    std::stack<T>\
    \ stack;\n    mutable std::mutex mtx;\n\npublic:\n    void push(T value) {\n \
    \       std::lock_guard<std::mutex> lock(mtx);\n        stack.push(value);\n \
    \   }\n\n    bool pop(T& result) {\n        std::lock_guard<std::mutex> lock(mtx);\n\
    \        if (stack.empty()) {\n            return false;\n        }\n        result\
    \ = stack.top();\n        stack.pop();\n        return true;\n    }\n\n    bool\
    \ empty() const {\n        std::lock_guard<std::mutex> lock(mtx);\n        return\
    \ stack.empty();\n    }\n};\n\nint main() {\n    ThreadSafeStack<int> stack;\n\
    \n    auto pushTask = [&stack]() {\n        for (int i = 0; i < 10; ++i) {\n \
    \           stack.push(i);\n        }\n    };\n\n    auto popTask = [&stack]()\
    \ {\n        int value;\n        while (stack.pop(value)) {\n            std::cout\
    \ << \"Popped: \" << value << std::endl;\n        }\n    };\n\n    std::thread\
    \ t1(pushTask);\n    std::thread t2(popTask);\n\n    t1.join();\n    t2.join();\n\
    \n    return 0;\n}\n```\n\n"
