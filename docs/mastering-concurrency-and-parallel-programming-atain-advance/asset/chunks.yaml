  trans: "\n\n## 4. 线程安全\n\n`thread_local` 变量本质上是线程安全的，但请确保它们不会在没有适当同步的情况下无意访问共享资源。\n\
    \n线程本地存储是 C++ 中的一项强大功能，它提供了一种方便的方法来维护线程特定数据，而无需显式的同步机制。通过使用 `thread_local` 关键字，开发者可以提高多线程应用程序的性能和简单性。合理利用\
    \ `thread_local` 可以编写更高效、更易维护的代码，特别是在每个线程需要维护自身状态或缓存的场景。\n\n## 基于任务的并行 (Task-based\
    \ parallelism)\n\n基于任务的并行是并发编程的一种高级方法，侧于将程序分解为独立的任务。这些任务可以并行执行，以提高性能和效率。与涉及单个线程的线程并行不同，基于任务的并行抽象了线程管理的细节，使得编写和维护并发程序变得更加容易。\n\
    \nC++ 标准库（尤其是 C++11 及后续版本）提供了多种用于基于任务并行的结构，包括 `std::async` 函数、任务对象以及如 Intel 的\
    \ Threading Building Blocks (TBB) 和微软的 Parallel Patterns Library (PPL) 等库。\n\n\
    ### 基于任务的并行的优势\n\n1. **简单性**：基于任务的并行抽象了低层线程管理，减少了并发编程的复杂性。\n2. **可扩展性**：任务可以动态分布到可用的处理单元上，使得在多核系统上扩展应用程序变得更容易。\n\
    3. **改进负载均衡**：基于任务的系统可以自动在线程之间平衡工作负载，提高整体性能。\n4. **更好的资源利用**：通过抽象线程管理，基于任务的并行可以优化系统资源的使用，减少空闲时间并提高吞吐量。\n\
    \n### 使用 `std::async` 的基于任务并行\n\n`std::async` 函数是异步执行任务的一种直接方法。它返回一个 `std::future`\
    \ 对象，该对象持有异步任务的结果。\n\n#### `std::async` 示例\n\n```cpp\n#include <iostream>\n#include\
    \ <future>\n#include <vector>\n\nint compute(int x) {\n  return x * x;\n}\n\n\
    int main() {\n  std::vector<std::future<int>> futures;\n  for (int i = 1; i <=\
    \ 5; ++i) {\n    futures.push_back(std::async(std::launch::async, compute, i));\n\
    \  }\n  for (auto& fut : futures) {\n    std::cout << fut.get() << std::endl;\n\
    \  }\n  return 0;\n}\n```\n\n在此示例中，`compute` 任务被异步启动，并使用 futures 获取结果。\n\n###\
    \ 使用 Threading Building Blocks (TBB) 的基于任务并行\n\nIntel 的 Threading Building Blocks\
    \ (TBB) 是一个用于基于任务并行的强大库。它为并行算法、并发容器和任务调度提供了高层抽象。\n\n#### TBB Parallel For 示例\n\
    \n```cpp\n#include <iostream>\n#include <tbb/tbb.h>\n#include <vector>\n\nvoid\
    \ computeSquare(std::vector<int>& vec) {\n  tbb::parallel_for(tbb::blocked_range<size_t>(0,\
    \ vec.size()),\n    & {\n      for (size_t i = range.begin(); i != range.end();\
    \ ++i) {\n        vec[i] = vec[i] * vec[i];\n      }\n    });\n}\n\nint main()\
    \ {\n  std::vector<int> vec = {1, 2, 3, 4, 5};\n  computeSquare(vec);\n  for (int\
    \ val : vec) {\n    std::cout << val << \" \";\n  }\n  std::cout << std::endl;\n\
    \  return 0;\n}\n```\n\n在此示例中，`tbb::parallel_for` 被用于对整数向量的平方计算并行化。\n\n### 使用\
    \ Parallel Patterns Library (PPL) 的基于任务并行\n\n微软的 Parallel Patterns Library (PPL)\
    \ 提供了一组用于基于任务并行的并行算法和数据结构。它与 C++ 无缝集成，并为编写并行程序提供了简单的 API。\n\n#### PPL Parallel\
    \ ForEach 示例\n\n```cpp\n#include <iostream>\n#include <ppl.h>\n#include <vector>\n\
    \nvoid computeSquare(std::vector<int>& vec) {\n  concurrency::parallel_for_each(vec.begin(),\
    \ vec.end(),\n    [](int& x) {\n      x = x * x;\n    });\n}\n\nint main() {\n\
    \  std::vector<int> vec = {1, 2, 3, 4, 5};\n  computeSquare(vec);\n  for (int\
    \ val : vec) {\n    std::cout << val << \" \";\n  }\n  std::cout << std::endl;\n\
    \  return 0;\n}\n```\n\n在此示例中，`concurrency::parallel_for_each` 被用于对整数向量的平方计算并行化。\n\
    \n### 任务调度与负载均衡\n\n基于任务的并行中的一个关键方面是高效的任务调度和负载均衡。任务调度器负责将任务分发到可用线程上，并确保没有线程长时间空闲。\n\
    \n1. **工作窃取 (Work Stealing)**：许多任务调度器（包括 TBB 和 PPL）使用工作窃取算法。在工作窃取中，空闲线程可以从繁忙线程中“偷取”任务，确保工作负载分布均匀。\n\
    2. **动态调度**：基于任务的系统通常使用动态调度，根据可用性在运行时分配任务。这与在编译时分配任务到特定线程的静态调度形成对比。\n\n### 处理任务间的依赖关系\n\
    \n在实际应用中，任务通常存在依赖关系。基于任务的并行提供了高效处理这些依赖关系的机制。\n\n1. **Future 和 Promise**：Future\
    \ 和 Promise 可用于同步有依赖的任务。任务可以等待 future 准备绪后继续执行。\n2. **延续任务 (Continuation Tasks)**：某些库（如\
    \ PPL）提供了可以链式使用的延续任务。延续任务在其先驱任务完成后会开始。\n\n#### PPL 延续任务的示例\n\n```cpp\n#include\
    \ <iostream>\n#include <ppl.h>\n\nint main() {\n  auto task1 = concurrency::create_task([]\
    \ {\n    std::cout << \"Task 1\" << std::endl;\n    return 42;\n  });\n  auto\
    \ task2 = task1.then([](int result) {\n    std::cout << \"Task 2, received: \"\
    \ << result << std::endl;\n  });\n  task2.wait();\n  return 0;\n}\n```\n\n在此示例中，`task2`\
    \ 在 `task1` 完成后启动并接收来自 `task1` 的结果。\n\n### 基于任务并行的最佳实践\n\n1. **避免过度分解**：在分解程序为任务时，避免创建过多的微任务，这会导致任务调度和管理的开销过大。\n\
    2. **使用高层抽象**：利用来自 TBB 和 PPL 等库提供的高层并行算法和结构，而不是手动管理线程。\n3. **确保任务独立性**：确保任务尽可能独立，以避免复杂的依赖关系和同步问题。\n\
    4. **性能分析与调优**：对应用程序进行性能分析以识别瓶颈，并相应地调整任务分解和调度策略。\n5. **优雅的任务取消**：实现在任务不再需要时优雅取消的机制。这可以防止浪费计算并提高资源利用率。\n\
    \n"
- fmt: "\nIn C++, there is no direct equivalent to Java's `Thread.interrupt()`, but\
    \ similar behavior can be achieved through cooperative cancellation. Cooperative\
    \ cancellation relies on threads periodically checking a shared flag to determine\
    \ if they should stop their work.\n\n## Importance of Handling Thread Interruptions\n\
    \n1. **Resource Management**: Properly handling thread interruptions ensures that\
    \ resources such as file handles, network connections, and memory are released\
    \ correctly.\n2. **Responsiveness**: Applications that can interrupt threads gracefully\
    \ are more responsive, as they can stop long-running tasks promptly when required.\n\
    3. **Avoiding Deadlocks**: Proper interruption handling can prevent deadlocks\
    \ by ensuring that threads do not wait indefinitely for resources that are no\
    \ longer available.\n4. **Graceful Shutdown**: In applications that require a\
    \ controlled shutdown, such as servers and GUI applications, handling thread interruptions\
    \ is crucial for stopping threads cleanly.\n\n## Implementing Thread Interruptions\
    \ in C++\n\nTo implement thread interruptions in C++, a common approach is to\
    \ use a shared atomic flag that threads check periodically. If the flag is set,\
    \ the thread exits gracefully.\n\n## Example of Thread Interruption\n\n```cpp\n\
    #include <iostream>\n#include <thread>\n#include <atomic>\n#include <chrono>\n\
    \nstd::atomic<bool> stopFlag(false);\n\nvoid worker() {\n    while (!stopFlag.load())\
    \ {\n        std::this_thread::sleep_for(std::chrono::milliseconds(100));\n  \
    \      std::cout << \"Working...\" << std::endl;\n    }\n    std::cout << \"Worker\
    \ thread exiting.\" << std::endl;\n}\n\nint main() {\n    std::thread t(worker);\n\
    \    std::this_thread::sleep_for(std::chrono::seconds(1));\n    stopFlag.store(true);\n\
    \    t.join();\n    std::cout << \"Main thread exiting.\" << std::endl;\n    return\
    \ 0;\n}\n```\n\nIn this example:\n- `stopFlag` is an atomic flag shared between\
    \ the main thread and the worker thread.\n- The worker thread periodically checks\
    \ `stopFlag` and exits if it is set.\n- The main thread sets `stopFlag` to `true`\
    \ after one second, signaling the worker thread to stop.\n\n## Best Practices\
    \ for Handling Thread Interruptions\n\n1. **Periodic Checks**: Ensure that threads\
    \ periodically check the interruption flag, especially within long-running loops\
    \ or blocking operations.\n2. **Graceful Cleanup**: Implement cleanup code to\
    \ release resources and restore the application state before a thread exits.\n\
    3. **Atomic Flags**: Use atomic flags or other thread-safe mechanisms to signal\
    \ interruptions, avoiding race conditions and ensuring visibility across threads.\n\
    4. **Exception Handling**: Catch and handle exceptions in threads to ensure that\
    \ the thread can clean up properly even if an error occurs.\n5. **Cooperative\
    \ Cancellation**: Design your threads to cooperate with interruption signals rather\
    \ than forcing termination.\n\n## Handling Interruptions in Blocking Operations\n\
    \nBlocking operations, such as waiting on condition variables or I/O operations,\
    \ can complicate thread interruption. One way to handle interruptions in such\
    \ cases is to use a combination of timeouts and interruption checks.\n\n## Example\
    \ of Handling Interruptions in Blocking Operations\n\n```cpp\n#include <iostream>\n\
    #include <thread>\n#include <atomic>\n#include <condition_variable>\n#include\
    \ <mutex>\n#include <chrono>\n\nstd::atomic<bool> stopFlag(false);\nstd::mutex\
    \ mtx;\nstd::condition_variable cv;\n\nvoid worker() {\n    std::unique_lock<std::mutex>\
    \ lock(mtx);\n    while (!stopFlag.load()) {\n        if (cv.wait_for(lock, std::chrono::milliseconds(100))\
    \ == std::cv_status::timeout) {\n            std::cout << \"Working...\" << std::endl;\n\
    \        }\n    }\n    std::cout << \"Worker thread exiting.\" << std::endl;\n\
    }\n\nint main() {\n    std::thread t(worker);\n    std::this_thread::sleep_for(std::chrono::seconds(1));\n\
    \    stopFlag.store(true);\n    cv.notify_all();\n    t.join();\n    std::cout\
    \ << \"Main thread exiting.\" << std::endl;\n    return 0;\n}\n```\n\nIn this\
    \ example:\n- The worker thread waits on a condition variable with a timeout.\n\
    - After each timeout, it checks the `stopFlag` to decide whether to continue or\
    \ exit.\n- The main thread sets `stopFlag` and notifies the condition variable\
    \ to interrupt the wait.\n\n## Combining Interruptions with Futures and Promises\n\
    \nFutures and promises can also be used to handle thread interruptions, especially\
    \ when dealing with asynchronous tasks.\n\n## Example of Handling Interruptions\
    \ with Futures and Promises\n\n```cpp\n#include <iostream>\n#include <future>\n\
    #include <atomic>\n#include <chrono>\n\nstd::atomic<bool> stopFlag(false);\n\n\
    int computeTask() {\n    for (int i = 0; i < 10; ++i) {\n        if (stopFlag.load())\
    \ {\n            std::cout << \"Task interrupted.\" << std::endl;\n          \
    \  return -1;\n        }\n        std::this_thread::sleep_for(std::chrono::milliseconds(200));\n\
    \        std::cout << \"Computing...\" << std::endl;\n    }\n    return 42;\n\
    }\n\nint main() {\n    auto futureResult = std::async(std::launch::async, computeTask);\n\
    \    std::this_thread::sleep_for(std::chrono::seconds(1));\n    stopFlag.store(true);\n\
    \    int result = futureResult.get();\n    std::cout << \"Result: \" << result\
    \ << std::endl;\n    return 0;\n}\n```\n\nIn this example:\n- `stopFlag` is used\
    \ to signal interruption to the asynchronous task.\n- The `computeTask` function\
    \ periodically checks `stopFlag` and exits if it is set.\n\n## Chapter 5: Concurrent\
    \ Data Structures\n\n### Thread-Safe Stack\n\nA stack follows the Last-In-First-Out\
    \ (LIFO) principle, where the last element added is the first to be removed. To\
    \ implement a thread-safe stack, we need to ensure that operations like `push`\
    \ (adding an element) and `pop` (removing an element) are performed atomically.\n\
    \n#### Implementation Using Mutex\n\nA straightforward way to implement a thread-safe\
    \ stack is by using a `std::mutex` to lock the stack. \n\n```cpp\n#include <iostream>\n\
    #include <stack>\n#include <mutex>\n#include <thread>\n#include <vector>\n\ntemplate<typename\
    \ T>\nclass ThreadSafeStack {\nprivate:\n    std::stack<T> stack;\n    mutable\
    \ std::mutex mtx;\n\npublic:\n    void push(T value) {\n        std::lock_guard<std::mutex>\
    \ lock(mtx);\n        stack.push(value);\n    }\n\n    bool pop(T& result) {\n\
    \        std::lock_guard<std::mutex> lock(mtx);\n        if (stack.empty()) {\n\
    \            return false;\n        }\n        result = stack.top();\n       \
    \ stack.pop();\n        return true;\n    }\n\n    bool empty() const {\n    \
    \    std::lock_guard<std::mutex> lock(mtx);\n        return stack.empty();\n \
    \   }\n};\n\nint main() {\n    ThreadSafeStack<int> stack;\n\n    auto pushTask\
    \ = [&stack]() {\n        for (int i = 0; i < 10; ++i) {\n            stack.push(i);\n\
    \        }\n    };\n\n    auto popTask = [&stack]() {\n        int value;\n  \
    \      while (stack.pop(value)) {\n            std::cout << \"Popped: \" << value\
    \ << std::endl;\n        }\n    };\n\n    std::thread t1(pushTask);\n    std::thread\
    \ t2(popTask);\n\n    t1.join();\n    t2.join();\n\n    return 0;\n}\n```\n"
