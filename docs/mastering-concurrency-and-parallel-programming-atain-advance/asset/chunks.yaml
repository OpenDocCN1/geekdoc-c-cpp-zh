    }\n```\n\n### Detaching Threads\n\nThe `detach()` method allows a thread to run\
    \ independently from the thread handle. Once detached, the thread continues execution\
    \ on its own, and the `std::thread` object is no longer associated with it.\n\n\
    ```cpp\n#include <iostream>\n#include <thread>\n#include <chrono>\n\nvoid threadFunction()\
    \ {\n  std::this_thread::sleep_for(std::chrono::seconds(2));\n  std::cout << \"\
