    \    }\n}\n\nint main() {\n    std::thread t1(timed_lock_example);\n    std::thread\
    \ t2(timed_lock_example);\n    t1.join();\n    t2.join();\n    return 0;\n}\n\
    ```\n\n在这个示例中，`lock.try_lock_for` 尝试在 100 毫秒内获取锁。如果在此期间未获取锁，函数将返回 `false`，线程将在不进入临界区的情况下继续。\n\
    \n### 手动解锁与重新锁定\n\n如之前的示例所示，`std::unique_lock` 允许对互斥量进行手动解锁和重新锁定，对临界区提供了更多的控制。\n\
    \n## 使用锁（Lock Guards）的最佳实践\n\n1.  **优先使用 RAII 进行锁管理**：使用 `std::lock_guard` 和 `std::unique_lock`\
    \ 等 RAII 包装器可以确保锁始终正确释放，即使抛出异常或函数提前返回。这防止了资源泄漏并有助于维护程序的正确性。\n2.  **最小化锁的范围**：将临界区（锁定和解锁互斥量之间的代码）保持尽可能短。这减少了对互斥量的竞争并提高了应用程序的整体性能。\n\
    3.  **避免嵌套锁**：避免在同一作用域内锁定多个互斥量以防止死锁。如果嵌套锁不可避免，请务必在所有线程中以一致的顺序锁定多个互斥量。\n4.  **使用适当的锁**：对于简单的锁定场景选择\
    \ `std::lock_guard`；当需要更多灵活性（如延迟锁定、定时锁定或手动解锁）使用 `std::unique_lock`。\n5.  **优雅处理异常**：确保异常被妥善处理。\n\
    \n## 锁锁的高级用法\n\n### 组合锁\n\n在某些场景下，需要同时锁定多个互斥量。`std::lock` 可以结合 `std::unique_lock`\
    \ 使用以防止死锁。\n\n```cpp\n#include <iostream>\n#include <thread>\n#include <mutex>\n\
    \nstd::mutex mtx1, mtx2;\n\nvoid combined_lock_example() {\n    std::unique_lock<std::mutex>\
    \ lock1(mtx1, std::defer_lock);\n    std::unique_lock<std::mutex> lock2(mtx2,\
    \ std::defer_lock);\n    // 在不引起死锁的情况下锁定两个互斥量\n    std::lock(lock1, lock2);\n\
    \    std::cout << \"Thread \" << std::this_thread::get_id() << \" has both mutexes.\"\
    \ << std::endl;\n}\n\nint main() {\n    std::thread t1(combined_lock_example);\n\
    \    std::thread t2(combined_lock_example);\n    t1.join();\n    t2.join();\n\
    \    return 0;\n}\n```\n\n在这个示例中，`std::lock` 用于以无死锁的方式锁定 `mtx1` 和 `mtx2`。\n\n\
    ### 转移锁所有权\n\n`std::unique_lock` 支持在不同的 `std::unique_lock` 对象之间转移锁的所有权。这在需要将锁传递给另一个函数或线程时非常有用。\n\
    \n```cpp\n#include <iostream>\n#include <thread>\n#include <mutex>\n\nstd::mutex\
    \ mtx;\n\nvoid transfer_lock_ownership(std::unique_lock<std::mutex> lock) {\n\
    \    std::cout << \"Lock ownership transferred to thread \" << std::this_thread::get_id()\
    \ << std::endl;\n}\n\nvoid lock_transfer_example() {\n    std::unique_lock<std::mutex>\
    \ lock(mtx);\n    transfer_lock_ownership(std::move(lock));\n}\n\nint main() {\n\
    \    std::thread t1(lock_transfer_example);\n    std::thread t2(lock_transfer_example);\n\
    \    t1.join();\n    t2.join();\n    return 0;\n}\n```\n\n在这个示例中，锁的所有权通过 `std::move`\
    \ 从 `lock_transfer_example` 函数转移到 `transfer_lock_ownership` 函数。\n\n"
- fmt: "\nConcurrent programming, while powerful and essential for modern software\
    \ development, comes with its own set of challenges. Two significant issues that\
    \ developers must be wary of are deadlocks and livelocks. Both of these problems\
    \ can severely impact the performance and reliability of an application, making\
    \ it crucial to understand their causes, effects, and how to avoid them.\n\n##\
    \ Deadlocks\n\nA deadlock is a situation in which two or more threads are unable\
    \ to proceed because each is waiting for the other to release a resource. This\
    \ results in a standstill where none of the involved threads can make progress.\
    \ Deadlocks typically occur when four conditions hold simultaneously:\n\n1. **Mutual\
    \ Exclusion**: At least one resource must be held in a non-shareable mode. If\
    \ another thread requests that resource, the requesting thread must be delayed\
    \ until the resource is released.\n2. **Hold and Wait**: A thread holding at least\
    \ one resource is waiting to acquire additional resources held by other threads.\n\
    3. **No Preemption**: Resources cannot be forcibly removed from the threads holding\
    \ them until the resources are voluntarily released.\n4. **Circular Wait**: There\
    \ exists a set of threads such that each thread is waiting for a resource held\
    \ by the next thread in the set, forming a circular chain.\n\n### Example of Deadlock\n\
    \nConsider the following C++ code where two threads attempt to acquire two mutexes\
    \ in opposite order, leading to a deadlock:\n\n```cpp\n#include <iostream>\n#include\
    \ <thread>\n#include <mutex>\n\nstd::mutex mtx1;\nstd::mutex mtx2;\n\nvoid thread1()\
    \ {\n    std::lock_guard<std::mutex> lock1(mtx1);\n    std::this_thread::sleep_for(std::chrono::milliseconds(100));\
    \ // Simulate work\n    std::lock_guard<std::mutex> lock2(mtx2);\n    std::cout\
    \ << \"Thread 1 acquired both mutexes.\" << std::endl;\n}\n\nvoid thread2() {\n\
    \    std::lock_guard<std::mutex> lock2(mtx2);\n    std::this_thread::sleep_for(std::chrono::milliseconds(100));\
    \ // Simulate work\n    std::lock_guard<std::mutex> lock1(mtx1);\n    std::cout\
    \ << \"Thread 2 acquired both mutexes.\" << std::endl;\n}\n\nint main() {\n  \
    \  std::thread t1(thread1);\n    std::thread t2(thread2);\n    t1.join();\n  \
    \  t2.join();\n    return 0;\n}\n```\n\nIn this example, `thread1` locks `mtx1`\
    \ and then tries to lock `mtx2`, while `thread2` locks `mtx2` and then tries to\
    \ lock `mtx1`. Both threads end up waiting indefinitely for the other to release\
    \ the mutex it holds, resulting in a deadlock.\n\n### Preventing Deadlocks\n\n\
    1. **Avoid Circular Wait**: Ensure a consistent locking order across all threads\
    \ to prevent circular wait conditions. For example, always acquire `mtx1` before\
    \ `mtx2` in all threads.\n\n```cpp\nvoid thread1() {\n    std::lock(mtx1, mtx2);\
    \ // Lock both mutexes without deadlock\n    std::lock_guard<std::mutex> lock1(mtx1,\
    \ std::adopt_lock);\n    std::lock_guard<std::mutex> lock2(mtx2, std::adopt_lock);\n\
    \    std::cout << \"Thread 1 acquired both mutexes.\" << std::endl;\n}\n\nvoid\
    \ thread2() {\n    std::lock(mtx1, mtx2); // Lock both mutexes without deadlock\n\
    \    std::lock_guard<std::mutex> lock1(mtx1, std::adopt_lock);\n    std::lock_guard<std::mutex>\
    \ lock2(mtx2, std::adopt_lock);\n    std::cout << \"Thread 2 acquired both mutexes.\"\
    \ << std::endl;\n}\n```\n\n2. **Use Timed Locks**: Use `std::unique_lock` with\
    \ timed locking to avoid waiting indefinitely for a lock. If the lock is not acquired\
    \ within the specified time, the thread can take alternative actions or retry.\n\
    \n```cpp\nvoid thread1() {\n    std::unique_lock<std::mutex> lock1(mtx1, std::defer_lock);\n\
    \    std::unique_lock<std::mutex> lock2(mtx2, std::defer_lock);\n    if (std::lock(lock1,\
    \ lock2)) {\n        std::cout << \"Thread 1 acquired both mutexes.\" << std::endl;\n\
    \    } else {\n        std::cout << \"Thread 1 failed to acquire both mutexes.\"\
    \ << std::endl;\n    }\n}\n\nvoid thread2() {\n    std::unique_lock<std::mutex>\
    \ lock1(mtx1, std::defer_lock);\n    std::unique_lock<std::mutex> lock2(mtx2,\
    \ std::defer_lock);\n    if (std::lock(lock1, lock2)) {\n        std::cout <<\
    \ \"Thread 2 acquired both mutexes.\" << std::endl;\n    } else {\n        std::cout\
    \ << \"Thread 2 failed to acquire both mutexes.\" << std::endl;\n    }\n}\n```\n\
    \n3. **Try-Lock Strategy**: Use `std::try_lock` to attempt to acquire multiple\
    \ locks without blocking. If the locks cannot be acquired immediately, the thread\
    \ can back off and retry.\n\n```cpp\nvoid thread1() {\n    while (true) {\n  \
    \      if (mtx1.try_lock()) {\n            if (mtx2.try_lock()) {\n          \
    \      std::cout << \"Thread 1 acquired both mutexes.\" << std::endl;\n      \
    \          mtx2.unlock();\n                mtx1.unlock();\n                break;\n\
    \            } else {\n                mtx1.unlock();\n            }\n       \
    \ }\n        std::this_thread::sleep_for(std::chrono::milliseconds(10)); // Back\
    \ off and retry\n    }\n}\n\nvoid thread2() {\n    while (true) {\n        if\
    \ (mtx2.try_lock()) {\n            if (mtx1.try_lock()) {\n                std::cout\
    \ << \"Thread 2 acquired both mutexes.\" << std::endl;\n                mtx1.unlock();\n\
    \                mtx2.unlock();\n                break;\n            } else {\n\
    \                mtx2.unlock();\n            }\n        }\n        std::this_thread::sleep_for(std::chrono::milliseconds(10));\
    \ // Back off and retry\n    }\n}\n```\n\n## Livelocks\n\nA livelock, like a deadlock,\
    \ is a condition where two or more threads are unable to proceed. However, in\
    \ a livelock, the threads are not blocked; instead, they keep changing states\
    \ in response to each other without making any real progress.\n\n### Example of\
    \ Livelock\n\nConsider a scenario where two threads attempt to avoid a deadlock\
    \ by releasing their locks if they detect that they cannot acquire both locks\
    \ simultaneously. However, they end up in a situation where both threads keep\
    \ acquiring and releasing locks indefinitely:\n\n```cpp\n#include <iostream>\n\
    #include <thread>\n#include <mutex>\n\nstd::mutex mtx1;\nstd::mutex mtx2;\n\n\
    void thread1() {\n    std::unique_lock<std::mutex> lock1(mtx1, std::defer_lock);\n\
    \    std::unique_lock<std::mutex> lock2(mtx2, std::defer_lock);\n    if (std::lock(lock1,\
    \ lock2)) {\n        std::cout << \"Thread 1 acquired both mutexes.\" << std::endl;\n\
    \    } else {\n        std::cout << \"Thread 1 failed to acquire both mutexes.\"\
    \ << std::endl;\n    }\n}\n\nvoid thread2() {\n    std::unique_lock<std::mutex>\
    \ lock1(mtx1, std::defer_lock);\n    std::unique_lock<std::mutex> lock2(mtx2,\
    \ std::defer_lock);\n    if (std::lock(lock1, lock2)) {\n        std::cout <<\
    \ \"Thread 2 acquired both mutexes.\" << std::endl;\n    } else {\n        std::cout\
    \ << \"Thread 2 failed to acquire both mutexes.\" << std::endl;\n    }\n}\n\n\
    int main() {\n    std::thread t1(thread1);\n    std::thread t2(thread2);\n   \
    \ t1.join();\n    t2.join();\n    return 0;\n}\n```\n\nIn this example, both threads\
    \ keep acquiring and releasing the mutexes in response to each other, resulting\
    \ in a livock.\n\n### Preventing Livelocks\n\n1. **Random Backoff Strategy**:\
    \ Introduce random delays before retrying to acquire locks. This reduces the likelihood\
    \ of threads continuously interfering with each other.\n\n```cpp\nvoid thread1()\
    \ {\n    while (true) {\n        if (mtx1.try_lock()) {\n            if (mtx2.try_lock())\
    \ {\n                std::cout << \"Thread 1 acquired both mutexes.\" << std::endl;\n\
    \                mtx2.unlock();\n                mtx1.unlock();\n            \
    \    break;\n            } else {\n                mtx1.unlock();\n          \
    \  }\n        }\n        std::this_thread::sleep_for(std::chrono::milliseconds(rand()\
    \ % 100)); // Random backoff period.\n    }\n}\n\nvoid thread2() {\n    while\
    \ (true) {\n        if (mtx2.try_lock()) {\n            if (mtx1.try_lock()) {\n\
    \                std::cout << \"Thread 2 acquired both mutexes.\" << std::endl;\n\
    \                mtx1.unlock();\n                mtx2.unlock();\n            \
    \    break;\n            } else {\n                mtx2.unlock();\n          \
    \  }\n        }\n        std::this_thread::sleep_for(std::chrono::milliseconds(rand()\
    \ % 100)); // Random backoff period.\n    }\n}\n```\n"
  raw: 'Concurrent programming, while powerful and essential for modern software development,
    comes with its own set of challenges. Two significant issues that developers must
    be wary of are deadlocks and livelocks. Both of these problems can severely impact
    the performance and reliability of an application, making it crucial to understand
    their causes, effects, and how to avoid them.


    Deadlocks


    A deadlock is a situation in which two or more threads are unable to proceed because
    each is waiting for the other to release a resource. This results in a standstill
    where none of the involved threads can make progress. Deadlocks typically occur
    when four conditions hold simultaneously:


    1\. Mutual Exclusion: At least one resource must be held in a non-shareable mode.
    If another thread requests that resource, the requesting thread must be delayed
    until the resource is released.


    2\. Hold and Wait: A thread holding at least one resource is waiting to acquire
    additional resources held by other threads.


    3\. No Preemption: Resources cannot be forcibly removed from the threads holding
    them until the resources are voluntarily released.


    4\. Circular Wait: There exists a set of threads such that each thread is waiting
    for a resource held by the next thread in the set, forming a circular chain.


    Example of Deadlock:


    Consider the following C++ code where two threads attempt to acquire two mutexes
    in opposite order, leading to a deadlock:


    ```cpp


    #include <iostream>


    #include <thread>


    #include <mutex>


    std::mutex mtx1;


    std::mutex mtx2;


    void thread1() {


    std::lock_guard<std::mutex> lock1(mtx1);


    std::this_thread::sleep_for(std::chrono::milliseconds(100)); // Simulate work


    std::lock_guard<std::mutex> lock2(mtx2);


    std::cout << "Thread 1 acquired both mutexes." << std::endl;


    }


    void thread2() {


    std::lock_guard<std::mutex> lock2(mtx2);


    std::this_thread::sleep_for(std::chrono::milliseconds(100)); // Simulate work


    std::lock_guard<std::mutex> lock1(mtx1);


    std::cout << "Thread 2 acquired both mutexes." << std::endl;


    }


    int main() {


    std::thread t1(thread1);


    std::thread t2(thread2);


    t1.join();


    t2.join();


    return 0;


    }


    ```


    In this example, `thread1` locks `mtx1` and then tries to lock `mtx2`, while `thread2`
    locks `mtx2` and then tries to lock `mtx1`. Both threads end up waiting indefinitely
    for the other to release the mutex it holds, resulting in a deadlock.


    Preventing Deadlocks:


    1\. Avoid Circular Wait: Ensure a consistent locking order across all threads
    to prevent circular wait conditions. For example, always acquire `mtx1` before
    `mtx2` in all threads.


    ```cpp


    void thread1() {


    std::lock(mtx1, mtx2); // Lock both mutexes without deadlock


    std::lock_guard<std::mutex> lock1(mtx1, std::adopt_lock);


    std::lock_guard<std::mutex> lock2(mtx2, std::adopt_lock);


    std::cout << "Thread 1 acquired both mutexes." << std::endl;


    }


    void thread2() {


    std::lock(mtx1, mtx2); // Lock both mutexes without deadlock


    std::lock_guard<std::mutex> lock1(mtx1, std::adopt_lock);


    std::lock_guard<std::mutex> lock2(mtx2, std::adopt_lock);


    std::cout << "Thread 2 acquired both mutexes." << std::endl;


    }


    ```


    2\. Use Timed Locks: Use `std::unique_lock` with timed locking to avoid waiting
    indefinitely for a lock. If the lock is not acquired within the specified time,
    the thread can take alternative actions or retry.


    ```cpp


    void thread1() {


    std::unique_lock<std::mutex> lock1(mtx1, std::defer_lock);


    std::unique_lock<std::mutex> lock2(mtx2, std::defer_lock);


    if (std::lock(lock1, lock2)) {


    std::cout << "Thread 1 acquired both mutexes." << std::endl;


    } else {


    std::cout << "Thread 1 failed to acquire both mutexes." << std::endl;


    }


    }


    void thread2() {


    std::unique_lock<std::mutex> lock1(mtx1, std::defer_lock);


    std::unique_lock<std::mutex> lock2(mtx2, std::defer_lock);


    if (std::lock(lock1, lock2)) {


    std::cout << "Thread 2 acquired both mutexes." << std::endl;


    } else {


    std::cout << "Thread 2 failed to acquire both mutexes." << std::endl;


    }


    }


    ```


    3\. Try-Lock Strategy: Use `std::try_lock` to attempt to acquire multiple locks
    without blocking. If the locks cannot be acquired immediately, the thread can
    back off and retry.


    ```cpp


    void thread1() {


    while (true) {


    if (mtx1.try_lock()) {


    if (mtx2.try_lock()) {


    std::cout << "Thread 1 acquired both mutexes." << std::endl;


    mtx2.unlock();


    mtx1.unlock();


    break;


    } else {


    mtx1.unlock();


    }


    }


    std::this_thread::sleep_for(std::chrono::milliseconds(10)); // Back off and retry


    }


    }


    void thread2() {


    while (true) {


    if (mtx2.try_lock()) {


    if (mtx1.try_lock()) {


    std::cout << "Thread 2 acquired both mutexes." << std::endl;


    mtx1.unlock();


    mtx2.unlock();


    break;


    } else {


    mtx2.unlock();


    }


    }


    std::this_thread::sleep_for(std::chrono::milliseconds(10)); // Back off and retry


    }


    }


    ```


    Livelocks


    A livelock, like a deadlock, is a condition where two or more threads are unable
    to proceed. However, in a livelock, the threads are not blocked; instead, they
    keep changing states in response to each other without making any real progress.


    Example of Livelock:


    Consider a scenario where two threads attempt to avoid a deadlock by releasing
    their locks if they detect that they cannot acquire both locks simultaneously.
    However, they end up in a situation where both threads keep releasing and reacquiring
    locks indefinitely:


    ```cpp


    #include <iostream>


    #include <thread>


    #include <mutex>


    std::mutex mtx1;


    std::mutex mtx2;


    void thread1() {


    while (true) {


    std::unique_lock<std::mutex> lock1(mtx1, std::defer_lock);


    std::unique_lock<std::mutex> lock2(mtx2, std::defer_lock);


    std::lock(lock1, lock2);


    std::cout << "Thread 1 acquired both mutexes." << std::endl;


    std::this_thread::sleep_for(std::chrono::milliseconds(100)); // Simulate work


    std::cout << "Thread 1 releasing both mutexes." << std::endl;


    lock1.unlock();


    lock2.unlock();


    }


    }


    void thread2() {


    while (true) {


    std::unique_lock<std::mutex> lock1(mtx1, std::defer_lock);


    std::unique_lock<std::mutex> lock2(mtx2, std::defer_lock);


    std::lock(lock1, lock2);


    std::cout << "Thread 2 acquired both mutexes." << std::endl;


    std::this_thread::sleep_for(std::chrono::milliseconds(100)); // Simulate work


    std::cout << "Thread 2 releasing both mutexes." << std::endl;


    lock1.unlock();


    lock2.unlock();


    }


    }


    int main() {


    std::thread t1(thread1);


    std::thread t2(thread2);


    t1.join();


    t2.join();


    return 0;


    }


    ```


    In this example, both threads keep acquiring and releasing the mutexes in response
    to each other, resulting in a livelock where neither thread makes any real progress.


    Preventing Livelocks:


    1\. Random Backoff Strategy: Introduce random delays before retrying to acquire
    locks. This reduces the likelihood of threads continuously interfering with each
    other.


    ```cpp


    void thread1() {


    while (true) {


    std::unique_lock<std::mutex> lock1(mtx1, std::defer_lock);


    std::unique_lock<std::mutex> lock2(mtx2, std::defer_lock);


    if (std::lock(lock1, lock2)) {


    std::cout << "Thread 1 acquired both mutexes." << std::endl;


    std::this_thread::sleep_for(std::chrono::milliseconds(100)); // Simulate work


    std::cout << "Thread 1 releasing both mutexes." << std::endl;


    lock1.unlock();


    lock2.unlock();


    break;


    }


    std::this_thread::sleep_for(std::chrono::milliseconds(rand() % 100)); // Random


    backoff period.


    }


    }


    void thread2() {


    while (true) {


    std::unique_lock<std::mutex> lock1(mtx1, std::defer_lock);


    std::unique_lock<std::mutex> lock2(mtx2, std::defer_lock);


    if (std::lock(lock1, lock2)) {


    std::cout << "Thread 2 acquired both mutexes." << std::endl;


    std::this_thread::sleep_for(std::chrono::milliseconds(100)); // Simulate work


    std::cout << "Thread 2 releasing both mutexes." << std::endl;


    lock1.unlock();


    lock2.unlock();


    break;


    }


    std::this_thread::sleep_for(std::chrono::milliseconds(rand() % 100)); // Random
    backoff period.


    }


    }


    ```'
