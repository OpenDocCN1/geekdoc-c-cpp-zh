    ## - Task-based parallelism


    Task-based parallelism is a high-level approach to concurrent programming that
    focuses on decomposing a program into independent tasks. These tasks can then
    be executed in parallel to improve performance and efficiency. Unlike thread-based
    parallelism, which involves managing individual threads, task-based parallelism
    abstracts away the details of thread management, making it easier to write and
    maintain concurrent programs.


    The C++ Standard Library, especially with C++11 and beyond, provides several constructs
    for task-based parallelism, including the `std::async` function, task objects,
    and libraries such as Intel''s Threading Building Blocks (TBB) and Microsoft''s
    Parallel Patterns Library (PPL).


    Benefits of Task-Based Parallelism


    1\. Simplicity: Task-based parallelism abstracts away low-level thread management,
    reducing the complexity of concurrent programming.


    2\. Scalability: Tasks can be dynamically distributed across available processing
    units, making it easier to scale applications on multi-core systems.


    3\. Improved Load Balancing: Task-based systems can automatically balance the
    workload among threads, improving overall performance.


    4\. Better Resource Utilization: By abstracting thread management, task-based
    parallelism can optimize the use of system resources, reducing idle times and
    improving throughput.


    Task-Based Parallelism with `std::async`


    The `std::async` function is a straightforward way to execute tasks asynchronously.
    It returns a `std::future` object that holds the result of the asynchronous task.


    Example of `std::async`


    ```cpp


    #include <iostream>


    #include <future>


    #include <vector>


    int compute(int x) {


    return x * x;


    }


    int main() {


    std::vector<std::future<int>> futures;


    for (int i = 1; i <= 5; ++i) {


    futures.push_back(std::async(std::launch::async, compute, i));


    }


    for (auto& fut : futures) {


    std::cout << fut.get() << std::endl;


    }


    return 0;


    }


    ```


    In this example, `compute` tasks are launched asynchronously, and the results
    are retrieved using futures.


    Task-Based Parallelism with Threading Building Blocks (TBB)


    Intel''s Threading Building Blocks (TBB) is a powerful library for task-based
    parallelism. It provides high-level abstractions for parallel algorithms, concurrent
    containers, and task scheduling.


    Example of TBB Parallel For


    ```cpp


    #include <iostream>


    #include <tbb/tbb.h>


    #include <vector>


    void computeSquare(std::vector<int>& vec) {


    tbb::parallel_for(tbb::blocked_range<size_t>(0, vec.size()),


    [&](const tbb::blocked_range<size_t>& range) {


    for (size_t i = range.begin(); i != range.end(); ++i) {


    vec[i] = vec[i] * vec[i];


    }


    });


    }


    int main() {


    std::vector<int> vec = {1, 2, 3, 4, 5};


    computeSquare(vec);


    for (int val : vec) {


    std::cout << val << " ";


    }


    std::cout << std::endl;


    return 0;


    }


    ```


    In this example, `tbb::parallel_for` is used to parallelize the computation of
    squares over a vector of integers.


    Task-Based Parallelism with Parallel Patterns Library (PPL)


    Microsoft''s Parallel Patterns Library (PPL) provides a set of parallel algorithms
    and data structures for task-based parallelism. It integrates seamlessly with
    C++ and provides a simple API for writing parallel programs.


    Example of PPL Parallel ForEach


    ```cpp


    #include <iostream>


    #include <ppl.h>


    #include <vector>


    void computeSquare(std::vector<int>& vec) {


    concurrency::parallel_for_each(vec.begin(), vec.end(),


    [](int& x) {


    x = x * x;


    });


    }


    int main() {


    std::vector<int> vec = {1, 2, 3, 4, 5};


    computeSquare(vec);


    for (int val : vec) {


    std::cout << val << " ";


    }


    std::cout << std::endl;


    return 0;


    }


    ```


    In this example, `concurrency::parallel_for_each` is used to parallelize the computation
    of squares over a vector of integers.


    Task Scheduling and Load Balancing


    One of the critical aspects of task-based parallelism is efficient task scheduling
    and load balancing. Task schedulers are responsible for distributing tasks across
    available threads and ensuring that no thread remains idle for extended periods.


    1\. Work Stealing: Many task schedulers, including TBB and PPL, use a work-stealing
    algorithm. In work stealing, idle threads can "steal" tasks from busy threads,
    ensuring that the workload is evenly distributed.


    2\. Dynamic Scheduling: Task-based systems often use dynamic scheduling, where
    tasks are assigned to threads at runtime based on their availability. This contrasts
    with static scheduling, where tasks are assigned to specific threads at compile
    time.


    Handling Dependencies between Tasks


    In real-world applications, tasks often have dependencies. Task-based parallelism
    provides mechanisms to handle these dependencies efficiently.


    1\. Futures and Promises: Futures and promises can be used to synchronize tasks
    with dependencies. A task can wait for a future to be ready before proceeding.


    2\. Continuation Tasks: Some libraries, such as PPL, provide continuation tasks
    that can be chained together. A continuation task starts when its predecessor
    completes.


    Example of Continuation Task with PPL


    ```cpp


    #include <iostream>


    #include <ppl.h>


    int main() {


    auto task1 = concurrency::create_task([] {


    std::cout << "Task 1" << std::endl;


    return 42;


    });


    auto task2 = task1.then([](int result) {


    std::cout << "Task 2, received: " << result << std::endl;


    });


    task2.wait();


    return 0;


    }


    ```


    In this example, `task2` starts after `task1` completes and receives the result
    from `task1`.


    Best Practices for Task-Based Parallelism


    1\. Avoid Over-Decomposition: While breaking a program into tasks, avoid creating
    too many small tasks, which can lead to excessive overhead in task scheduling
    and management.


    2\. Use High-Level Abstractions: Utilize high-level parallel algorithms and constructs
    provided by libraries like TBB and PPL instead of manually managing threads.


    3\. Ensure Task Independence: Ensure that tasks are as independent as possible
    to avoid complex dependencies and synchronization issues.


    4\. Profiling and Tuning: Profile your application to identify bottlenecks and
    tune the task decomposition and scheduling strategy accordingly.


    5\. Graceful Task Cancellation: Implement mechanisms to cancel tasks gracefully
    if they are no longer needed. This can prevent wasted computation and improve
    resource utilization.


    Task-based parallelism offers a high-level approach to concurrent programming
    that simplifies the development and maintenance of parallel applications. By focusing
    on tasks rather than threads, developers can write cleaner, more scalable, and
    more efficient code. Leveraging libraries like Intel''s TBB and Microsoft''s PPL
    can further enhance the capabilities of task-based parallelism, providing powerful
    tools for task scheduling, load balancing, and handling task dependencies. By
    following best practices and utilizing these libraries, developers can effectively
    harness the power of multi-core processors and achieve significant performance
    improvements in their applications.


    ## - Handling thread interruptions


    Thread interruptions are a mechanism for signaling a thread to stop its current
    work and exit gracefully. Unlike abrupt thread termination, which can leave resources
    in an inconsistent state, thread interruptions allow threads to clean up and release
    resources properly before stopping.'
