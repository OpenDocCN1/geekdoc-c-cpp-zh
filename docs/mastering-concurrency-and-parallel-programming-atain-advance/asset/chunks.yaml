- fmt: "\n- Each thread acquires the lock before printing its ID, ensuring that the\
    \ output is not garbled.\n\n## 4. Performance Considerations\n\nWhile parallel\
    \ algorithms can significantly enhance performance, there are several factors\
    \ to consider to ensure that the benefits outweigh the costs.\n\n### Load Balancing\n\
    Effective load balancing ensures that all threads have an approximately equal\
    \ amount of work, preventing some threads from being idle while others are overloaded.\n\
