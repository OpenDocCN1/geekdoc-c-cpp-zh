    \n### 关键点与考虑因素\n\n1. **同步**：使用 `std::mutex` 和 `std::condition_variable` 确保生产者和消费者不会并发访问缓冲区，从而防止竞态条件和数据损坏。\n\
    2. **阻塞与等待**：生产者在缓冲区满时等待，消费者在缓冲区空时等待。这防止了忙等并高效利用了系统资源。\n3. **优雅退出**：此示例没有优雅地处理消费者退出。在现实应用中，你需要一种方法通知消费者停止（例如使用布尔标志或发送特殊的终止值）。\n\
    4. **可扩展性**：可以通过根据应用程序的需求和系统能力调整生产者和消费者线程的数量来扩展该模型。\n\n### 示例改进\n\n以下是使生产者-消费者模型更加健壮和实用的改进措施：\n\
    \n1. **优雅消费者终止**：引入一个标志，在所有生产者完成后通知消费者停止。\n\n"
