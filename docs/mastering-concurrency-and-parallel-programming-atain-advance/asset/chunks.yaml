    \n## 理解 Future\n\n`future` 是一个可以用于检索异步操作结果的对象。它充当未来将计算出的值的占位符。C++ 标准库提供了 `std::future`\
    \ 类来处理 future。\n\n### `std::future` 的基本用法\n\n```cpp\n#include <iostream>\n#include\
    \ <future>\n#include <thread>\n\nint computeSquare(int x) {\n    std::this_thread::sleep_for(std::chrono::seconds(2));\
