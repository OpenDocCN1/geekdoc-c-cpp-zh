  trans: "\n\n# C++ 中的并行算法\n\n并行算法是现代 C++ 编程的基石，于 `C++17` 并在 `C++20` 中得到了进一步增强。这些算法允许开发者利用多核处理器的能力进行并发计算，从而显著提高性能和效率。C++\
    \ 中的并行算法规范了我们执行并行计算的方式。通过引入并行执行策略，C++ 使得开发者更容易编写并行代码，而无需深入底层的线程细节。利用这些并行算法的关键在于理解执行策略，执行策略决定了并行化的实现方式。\n\
    \n## 执行策略\n\n1. `std::execution::seq`: 顺序执行，默认策略。\n2. `std::execution::par`: 并行执行。\n\
    3. `std::execution::par_unseq`: 并行且向量化执行，允许额外的优化。\n\n## C++17 中的并行算法\n\nC++17\
    \ 为若干标准算法引入了并行执行策略，使其能够以并行运行。以下是一些著名的算法及其并行版本：\n\n1. `std::for_each`:\n- 顺序：`std::for_each(first,\
    \ last, func);`\n- 并行：`std::for_each(std::execution::par, first, last, func);`\n\
    \n2. `std::transform`:\n- 顺序：`std::transform(first1, last1, first2, result, func);`\n\
    - 并行：`std::transform(std::execution::par, first1, last1, first2, result, func);`\n\
    \n3. `std::reduce` (引入于 C++17):\n- 顺序：`std::reduce(first, last, init);`\n- 并行：`std::reduce(std::execution::par,\
    \ first, last, init);`\n\n4. `std::sort`:\n- 顺序：`std::sort(first, last);`\n- 并行：`std::sort(std::execution::par,\
    \ first, last);`\n\n这些算法利用执行策略并发运行操作，为大型数据集提供了显著的性能提升。\n\n### 示例：并行的 std::for_each\n\
    \n```cpp\n#include <vector>\n#include <algorithm>\n#include <execution>\n#include\
    \ <iostream>\n\nvoid increment(int& n) {\n    ++n;\n}\n\nint main() {\n    std::vector<int>\
    \ data(1000000, 1);\n    std::for_each(std::execution::par, data.begin(), data.end(),\
    \ increment);\n    std::cout << \"Data processed in parallel.\" << std::endl;\n\
    \    return 0;\n}\n```\n\n在此示例中，`std::for_each` 以并行方式执行，并发地增加向量中的每个元素。与顺序执行相比，这带来了实质性的性能提升，特别是对于大型数据集而言。\n\
    \n## C++20 中的增强\n\nC++20 在 C++17 基础的基础上引入了更强大的并行算法并增强了现有算法。一些关键新增和改进包括：\n\n1.\
    \ `std::ranges::for_each`:\nC++20 引入了 `Ranges` 库，它提供了一种处理序列的更灵活、强大的方式。`std::ranges::for_each`\
    \ 算法也可以并行执行：\n\n```cpp\n#include <vector>\n#include <algorithm>\n#include <execution>\n\
    #include <ranges>\n\nvoid increment(int& n) {\n    ++n;\n}\n\nint main() {\n \
    \   std::vector<int> data(1000000, 1);\n    std::ranges::for_each(std::execution::par,\
