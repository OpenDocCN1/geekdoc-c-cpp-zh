    If the lock is not acquired within this period, the function returns `false`,
    and the thread proceeds without entering the critical section.


    Manual Unlocking and Re-locking:


    As shown in earlier examples, `std::unique_lock` allows for manual unlocking and
    re-locking of the mutex, providing more control over the critical sections.


    Best Practices for Using Lock Guards


    1\. Prefer RAII for Lock Management:


    Using RAII wrappers like `std::lock_guard` and `std::unique_lock` ensures that
    locks are always properly released, even if an exception is thrown or the function
    returns early. This prevents resource leaks and helps maintain program correctness.


    2\. Minimize the Scope of Locks:


    Keep the critical section (the code between locking and unlocking the mutex) as
    short as possible. This reduces contention for the mutex and improves the overall
    performance of the application.


    3\. Avoid Nested Locks:


    Avoid locking multiple mutexes within the same scope to prevent deadlocks. If
    nested locks are unavoidable, always lock multiple mutexes in a consistent order
    across all threads.


    4\. Use the Appropriate Lock Guard:


    Choose `std::lock_guard` for simple locking scenarios where the mutex needs to
    be locked and unlocked within a single scope. Use `std::unique_lock` when more
    flexibility is required, such as deferred locking, timed locking, or manual unlocking.


    5\. Handle Exceptions Gracefully:


    Ensure that exceptions are handled gracefully within critical sections. Use RAII
    wrappers to guarantee that mutexes are always properly released, even in the presence
    of exceptions.


    6\. Avoid Overusing Locks:


    Use locks judiciously to avoid excessive contention and performance degradation.
    Consider using other synchronization mechanisms, such as atomic operations, condition
