    Importance of Handling Thread Interruptions


    1\. Resource Management: Properly handling thread interruptions ensures that resources
    such as file handles, network connections, and memory are released correctly.


    2\. Responsiveness: Applications that can interrupt threads gracefully are more
    responsive, as they can stop long-running tasks promptly when required.


    3\. Avoiding Deadlocks: Proper interruption handling can prevent deadlocks by
    ensuring that threads do not wait indefinitely for resources that are no longer
    available.


    4\. Graceful Shutdown: In applications that require a controlled shutdown, such
    as servers and GUI applications, handling thread interruptions is crucial for
    stopping threads cleanly.


    Implementing Thread Interruptions in C++


    To implement thread interruptions in C++, a common approach is to use a shared
    atomic flag that threads check periodically. If the flag is set, the thread exits
    gracefully.


    Example of Thread Interruption


    ```cpp


    #include <iostream>


    #include <thread>


    #include <atomic>


    #include <chrono>


    std::atomic<bool> stopFlag(false);


    void worker() {


    while (!stopFlag.load()) {


    std::this_thread::sleep_for(std::chrono::milliseconds(100));


    std::cout << "Working..." << std::endl;


    }


    std::cout << "Worker thread exiting." << std::endl;


    }


    int main() {


    std::thread t(worker);


    std::this_thread::sleep_for(std::chrono::seconds(1));


    stopFlag.store(true);


    t.join();


    std::cout << "Main thread exiting." << std::endl;


    return 0;


    }


    ```


    In this example:


    - `stopFlag` is an atomic flag shared between the main thread and the worker thread.


    - The worker thread periodically checks `stopFlag` and exits if it is set.


    - The main thread sets `stopFlag`


    to `true` after one second, signaling the worker thread to stop.


    Best Practices for Handling Thread Interruptions


    1\. Periodic Checks: Ensure that threads periodically check the interruption flag,
    especially within long-running loops or blocking operations.


    2\. Graceful Cleanup: Implement cleanup code to release resources and restore
    the application state before a thread exits.


    3\. Atomic Flags: Use atomic flags or other thread-safe mechanisms to signal interruptions,
    avoiding race conditions and ensuring visibility across threads.


    4\. Exception Handling: Catch and handle exceptions in threads to ensure that
    the thread can clean up properly even if an error occurs.


    5\. Cooperative Cancellation: Design your threads to cooperate with interruption
    signals rather than forcing termination.


    Handling Interruptions in Blocking Operations


    Blocking operations, such as waiting on condition variables or I/O operations,
    can complicate thread interruption. One way to handle interruptions in such cases
    is to use a combination of timeouts and interruption checks.


    Example of Handling Interruptions in Blocking Operations


    ```cpp


    #include <iostream>


    #include <thread>


    #include <atomic>


    #include <condition_variable>


    #include <mutex>


    #include <chrono>


    std::atomic<bool> stopFlag(false);


    std::mutex mtx;


    std::condition_variable cv;


    void worker() {


    std::unique_lock<std::mutex> lock(mtx);


    while (!stopFlag.load()) {


    if (cv.wait_for(lock, std::chrono::milliseconds(100)) == std::cv_status::timeout)
    {


    std::cout << "Working..." << std::endl;


    }


    }


    std::cout << "Worker thread exiting." << std::endl;


    }


    int main() {


    std::thread t(worker);


    std::this_thread::sleep_for(std::chrono::seconds(1));


    stopFlag.store(true);


    cv.notify_all();


    t.join();


    std::cout << "Main thread exiting." << std::endl;


    return 0;


    }


    ```


    In this example:


    - The worker thread waits on a condition variable with a timeout.


    - After each timeout, it checks the `stopFlag` to decide whether to continue or
    exit.


    - The main thread sets `stopFlag` and notifies the condition variable to interrupt
    the wait.


    Combining Interruptions with Futures and Promises


    Futures and promises can also be used to handle thread interruptions, especially
    when dealing with asynchronous tasks.


    Example of Handling Interruptions with Futures and Promises


    ```cpp


    #include <iostream>


    #include <future>


    #include <atomic>


    #include <chrono>


    std::atomic<bool> stopFlag(false);


    int computeTask() {


    for (int i = 0; i < 10; ++i) {


    if (stopFlag.load()) {


    std::cout << "Task interrupted." << std::endl;


    return -1;


    }


    std::this_thread::sleep_for(std::chrono::milliseconds(200));


    std::cout << "Computing..." << std::endl;


    }


    return 42;


    }


    int main() {


    auto futureResult = std::async(std::launch::async, computeTask);


    std::this_thread::sleep_for(std::chrono::seconds(1));


    stopFlag.store(true);


    int result = futureResult.get();


    std::cout << "Result: " << result << std::endl;


    return 0;


    }


    ```


    In this example:


    - `stopFlag` is used to signal interruption to the asynchronous task.


    - The `computeTask` function periodically checks `stopFlag` and exits if it is
    set.


    - The main thread sets `stopFlag` after one second, interrupting the asynchronous
    task.


    Handling thread interruptions is crucial for writing robust and responsive concurrent
    programs. By using shared atomic flags, cooperative cancellation, and proper resource
    management, developers can ensure that threads exit gracefully and resources are
    released correctly. Integrating interruption handling with futures, promises,
    and condition variables further enhances the flexibility and reliability of concurrent
    applications. By following best practices and leveraging C++ concurrency features,
    developers can effectively manage thread interruptions and build scalable and
    maintainable multi-threaded programs.


    # Chapter 5:


    # Concurrent Data Structures


    ## - Thread-safe stack and queue


    Concurrent data structures are essential in multi-threaded programming, allowing
    multiple threads to access and modify shared data safely and efficiently. Two
    of the most commonly used data structures in concurrent programming are stacks
    and queues. Ensuring thread safety for these structures involves employing synchronization
    mechanisms to prevent race conditions and ensure data consistency.


    Thread-Safe Stack


    A stack follows the Last-In-First-Out (LIFO) principle, where the last element
    added is the first to be removed. To implement a thread-safe stack, we need to
    ensure that operations like `push` (adding an element) and `pop` (removing an
    element) are performed atomically.


    Implementation Using Mutex


    A straightforward way to implement a thread-safe stack is by using a `std::mutex`
    to lock the stack during modifications.


    ```cpp


    #include <iostream>


    #include <stack>


    #include <mutex>


    #include <thread>


    #include <vector>


    template<typename T>


    class ThreadSafeStack {


    private:


    std::stack<T> stack;


    mutable std::mutex mtx;


    public:


    void push(T value) {


    std::lock_guard<std::mutex> lock(mtx);


    stack.push(value);


    }


    bool pop(T& result) {


    std::lock_guard<std::mutex> lock(mtx);


    if (stack.empty()) {


    return false;


    }


    result = stack.top();


    stack.pop();


    return true;


    }


    bool empty() const {


    std::lock_guard<std::mutex> lock(mtx);


    return stack.empty();


    }


    };


    int main() {


    ThreadSafeStack<int> stack;


    auto pushTask = [&stack]() {


    for (int i = 0; i < 10; ++i) {


    stack.push(i);


    }


    };


    auto popTask = [&stack]() {


    int value;


    while (stack.pop(value)) {


    std::cout << "Popped: " << value << std::endl;


    }


    };


    std::thread t1(pushTask);


    std::thread t2(popTask);


    t1.join();


    t2.join();


    return 0;


    }


    ```


    In this example:


    - `std::lock_guard` is used to lock the mutex during `push` and `pop` operations,
    ensuring that only one thread can modify the stack at a time.


    - The `pop` method checks if the stack is empty before attempting to pop an element
    to prevent exceptions.


