    \n# 使用双重检查锁的单例模式\n\n在软件设计中，单例模式（Singleton pattern）是一种创建模式，确保一个类只有一个实例，并提供访问该实例的全局点。当恰好需要一个对象来协调系统的操作（例如配置设置或日志记录）时，该模式被广泛使用。\n\
    \n然而，在单例实现中确保线程安全可能是具有挑战性的。一种有效的解决方案是双重检查锁（Double-Checked Locking, DCL）惯用法，它将懒性初始化与最小同步开销结合起来。\n\
    \n## 概念与工作流\n\n1. **单例 (Singleton)**：设计为在整个应用程序生命周期内只有一个实例的类。\n2. **懒性初始化 (Lazy\
    \ Initialization)**：推迟单例实例的创建，直到第一次需要它。\n3. **双重检查锁 (Double-Checked Locking)**：通过首先在锁之外检查实例是否已经创建，然后在锁内部再次检查，来减少获取锁的开销。\n\
    \n## 关键特性\n- **线程安全**：确保单例实例只被创建一次，即使在多线程环境中也是如此。\n- **性能**：通过仅在第一次创建实例时加锁，最大限度地减少同步开销。\n\
    - **懒性初始化**：仅在需要时才创建单例实例，如果从不使用，则可以节省资源。\n\n## 在 C++ 中用双重检查锁实现单例\n\n双重检查锁模式涉及对实例两次检查：一次在获取锁之前（为了避免不必要的同步），一次在获取锁之后（以确保实例仍未被另一个线程创建）。以下是在\
    \ C++ 中实现此模式的分步骤指南。\n\n### 分步实现\n\n### 第 1 步：定义单例类\n\n```cpp\nclass Singleton\
    \ {\nprivate:\n    static Singleton* instance;\n    static std::mutex mtx;\n \
    \   // 私有构造函数以防止实例化\n    Singleton() {\n        std::cout << \"Singleton instance\
    \ created\" << std::endl;\n    }\n    // 删除拷贝构造函数和赋值运算符以防止拷贝\n    Singleton(const\
    \ Singleton&) = delete;\n    Singleton& operator=(const Singleton&) = delete;\n\
    public:\n    static Singleton* getInstance() {\n        if (instance == nullptr)\
    \ {\n            std::lock_guard<std::mutex> lock(mtx);\n            if (instance\
    \ == nullptr) {\n                instance = new Singleton();\n            }\n\
    \        }\n        return instance;\n    }\n    void doSomething() {\n      \
    \  std::cout << \"Singleton instance is doing something\" << std::endl;\n    }\n\
    };\n// 初始化静态成员变量\nSingleton* Singleton::instance = nullptr;\nstd::mutex Singleton::mtx;\n\
    ```\n\n#### 解释\n1. **私有构造函数**：确保不能在类外部创建单例实例。\n2. **删除的拷贝构造函数和赋值运算符**：防止单例实例被拷贝或赋值。\n\
    3. **静态实例和互斥锁**：`instance` 指针持有单例实例，`mtx` 用于同步。\n4. `getInstance()` 方法：\n   -\
    \ 首先，在锁之外检查 `instance` 是否为 `nullptr`。\n   - 使用 `std::lock_guard<std::mutex>` 获取锁。\n\
    \   - 在锁内部再次检查。\n\n### 第 2 步：使用示例\n\n```cpp\nint main() {\n    std::thread t1([]\
    \ {\n        Singleton::getInstance()->doSomething();\n    });\n    std::thread\
    \ t2([] {\n        Singleton::getInstance()->doSomething();\n    });\n    t1.join();\n\
    \    t2.join();\n    return 0;\n}\n```\n\n在此示例中：\n- 两个线程 `t1` 和 `t2` 尝试获取单例并调用\
    \ `doSomething()`。\n- 双重检查锁确保了单例。\n\n## 关键点与注意事项\n1. **线程安全**：双重检查锁防止了多个线程创建实例。\n\
    2. **性能**：在锁之外检查实例减少了同步的开销。\n3. **内存模型**：双重检查锁的正确性依赖于内存模型。\n\n## 现代 C++ 双重检查锁单例\n\
    \n在现代 C++（C++11 及以后）中，我们可以利用 `std::atomic` 来确保内存顺序并简化双重检查锁的实现。\n\n```cpp\n#include\
    \ <atomic>\n#include <mutex>\n#include <iostream>\n#include <thread>\n\nclass\
    \ Singleton {\nprivate:\n    static std::atomic<Singleton*> instance;\n    static\
    \ std::mutex mtx;\n    Singleton() {\n        std::cout << \"Singleton instance\
    \ created\" << std::endl;\n    }\n    Singleton(const Singleton&) = delete;\n\
    \    Singleton& operator=(const Singleton&) = delete;\npublic:\n    static Singleton*\
    \ getInstance() {\n        Singleton* tmp = instance.load(std::memory_order_acquire);\n\
    \        if (tmp == nullptr) {\n            std::lock_guard<std::mutex> lock(mtx);\n\
    \            tmp = instance.load(std::memory_order_relaxed);\n            if (tmp\
    \ == nullptr) {\n                tmp = new Singleton();\n                instance.store(tmp,\
    \ std::memory_order_release);\n            }\n        }\n        return tmp;\n\
    \    }\n    void doSomething() {\n        std::cout << \"Singleton instance is\
    \ doing something\" << std::endl;\n    }\n};\nstd::atomic<Singleton*> Singleton::instance{nullptr};\n\
    std::mutex Singleton::mtx;\n\nint main() {\n    std::thread t1([] {\n        Singleton::getInstance()->doSomething();\n\
    \    });\n    std::thread t2([] {\n        Singleton::getInstance()->doSomething();\n\
    \    });\n    t1.join();\n    t2.join();\n    return 0;\n}\n```\n\n#### 解释\n1.\
    \ `std::atomic<Singleton*> instance`：确保原子加载和存储操作，解决了内存排序问题。\n2. **内存顺序**：\n  \
    \ - `std::memory_order_acquire`：确保当前线程中的后续读取和写入不会重排到此加载之前。\n   - `std::memory_order_release`：确保当前线程中的之前的写入不会重排到此存储之后。\n\
    \   - `std::memory_order_relaxed`：在中间检查中允许松弛的内存排序。\n\n"
- fmt: "\n1. `Simplified Synchronization`: Atomic operations simplify the synchronization\
    \ logic by providing guarantees about memory order without the need for explicit\
    \ barriers.\n2. `Performance`: Atomic operations are generally faster than using\
    \ `mutexes`, especially in scenarios with low contention.\n\n## Key Points for\
    \ Robust Implementation\n\n1. `Memory Model`: Understand the underlying memory\
    \ model and orderings to ensure the correctness of the double-checked locking\
    \ mechanism.\n2. `Avoiding Pitfalls`: Ensure that all paths leading to the creation\
    \ and access of the `Singleton` instance are properly synchronized.\n3. `Testing`:\
    \ Thoroughly test the `Singleton` implementation in a multithreaded environment\
    \ to identify and resolve any synchronization issues.\n\n## Alternative Approaches\n\
    \n1. `Meyers' Singleton`: In C++11 and beyond, a simpler and thread-safe approach\
    \ to implementing `Singleton` is using static local variables, known as `Meyers'\
    \ Singleton`.\n\n```cpp\nclass Singleton {\npublic:\n    static Singleton& getInstance()\
    \ {\n        static Singleton instance;\n        return instance;\n    }\n   \
    \ void doSomething() {\n        std::cout << \"Singleton instance is doing something\"\
    \ << std::endl;\n    }\nprivate:\n    Singleton() {\n        std::cout << \"Singleton\
    \ instance created\" << std::endl;\n    }\n    Singleton(const Singleton&) = delete;\n\
    \    Singleton& operator=(const Singleton&) = delete;\n};\n```\n\nIn this approach:\n\
    - The `getInstance()` method returns a reference to a static local instance of\
    \ the `class`.\n- The instance is created the first time `getInstance()` is called\
    \ and is thread-safe due to the guarantees provided by C++11 for static local\
    \ variable initialization.\n\n2. `Call Once`: Another approach is using `std::call_once`\
    \ to ensure the `Singleton` instance is initialized only once.\n\n```cpp\n#include\
    \ <iostream>\n#include <thread>\n#include <mutex>\nclass Singleton {\npublic:\n\
    \    static Singleton& getInstance() {\n        std::call_once(initFlag, []()\
    \ {\n            instance.reset(new Singleton);\n        });\n        return *instance;\n\
    \    }\n    void doSomething() {\n        std::cout << \"Singleton instance is\
    \ doing something\" << std::endl;\n    }\nprivate:\n    Singleton() {\n      \
    \  std::cout << \"Singleton instance created\" << std::endl;\n    }\n    static\
    \ std::unique_ptr<Singleton> instance;\n    static std::once_flag initFlag;\n\
    };\nstd::unique_ptr<Singleton> Singleton::instance;\nstd::once_flag Singleton::initFlag;\n\
    int main() {\n    std::thread t1([] {\n        Singleton::getInstance().doSomething();\n\
    \    });\n    std::thread t2([] {\n        Singleton::getInstance().doSomething();\n\
    \    });\n    t1.join();\n    t2.join();\n    return 0;\n}\n```\n\nIn this approach:\n\
    - `std::call_once` ensures that the initialization code is executed only once,\
    \ making it thread-safe without explicit locking.\n\nThe `Singleton` pattern with\
    \ double-checked locking is a powerful idiom for ensuring thread-safe, lazy initialization\
    \ of a singleton instance in a concurrent environment. By carefully managing synchronization\
    \ and memory ordering, it provides a balance between performance and correctness.\
    \ However, understanding the underlying memory model and potential pitfalls is\
    \ crucial for a robust implementation. Alternatives like `Meyers' Singleton` and\
    \ `std::call_once` offer simpler and equally effective solutions in modern C++,\
    \ making them viable choices for implementing the `Singleton` pattern.\n\n## Object\
    \ pool pattern\n\nThe `Object Pool` pattern is a creational design pattern that\
    \ aims to optimize the use of resources that are expensive to create and maintain,\
    \ such as database connections, thread pools, or large objects. By reusing objects\
    \ from a fixed pool rather than creating and destroying them repeatedly, the `Object\
    \ Pool` pattern can significantly enhance performance and resource management.\n\
    \n### Concept and Workflow\n\n1. `Object Pool`: A container that manages a set\
    \ of reusable objects.\n2. `Acquire`: Method to obtain an object from the pool.\n\
    3. `Release`: Method to return an object to the pool after use.\n\n### Key Characteristics\n\
    \n- `Resource Optimization`: Reduces the overhead of creating and destroying objects.\n\
    - `Performance Improvement`: Minimizes resource allocation and deallocation time.\n\
    - `Scalability`: Manages a finite number of resources to prevent overconsumption.\n\
    \n## Implementing Object Pool Pattern in C++\n\nC++ provides the tools necessary\
    \ to implement an efficient object pool, leveraging features like smart pointers,\
    \ templates, and thread synchronization mechanisms.\n\n### Step-by-Step Implementation\n\
    \n### Step 1: Define the Poolable Object Class\n\n```cpp\nclass PoolableObject\
    \ {\npublic:\n    PoolableObject() {\n        std::cout << \"PoolableObject created\"\
    \ << std::endl;\n    }\n    ~PoolableObject() {\n        std::cout << \"PoolableObject\
    \ destroyed\" << std::endl;\n    }\n    void doSomething() {\n        std::cout\
    \ << \"PoolableObject is doing something\" << std::endl;\n    }\n    // Reset\
    \ the object to a reusable state\n    void reset() {\n        std::cout << \"\
    PoolableObject reset\" << std::endl;\n    }\n};\n```\n\n#### Explanation\n\n1.\
    \ `Constructor` and `Destructor`: Log the creation and destruction of the object.\n\
    2. `doSomething()` Method: Simulates some work done by the object.\n3. `reset()`\
    \ Method: Resets the object to a reusable state.\n\n### Step 2: Define the Object\
    \ Pool Class\n\n```cpp\n#include <iostream>\n#include <memory>\n#include <vector>\n\
    #include <mutex>\n#include <condition_variable>\ntemplate <typename T>\nclass\
    \ ObjectPool {\nprivate:\n    std::vector<std::shared_ptr<T>> pool;\n    std::mutex\
    \ mtx;\n    std::condition_variable cv;\n    size_t maxSize;\npublic:\n    ObjectPool(size_t\
    \ size) : maxSize(size) {\n        for (size_t i = 0; i < maxSize; ++i) {\n  \
    \          pool.push_back(std::make_shared<T>());\n        }\n    }\n    std::shared_ptr<T>\
    \ acquire() {\n        std::unique_lock<std::mutex> lock(mtx);\n        cv.wait(lock,\
    \ [this]() { return !pool.empty(); });\n        auto obj = pool.back();\n    \
    \    pool.pop_back();\n        return obj;\n    }\n    void release(std::shared_ptr<T>\
    \ obj) {\n        std::unique_lock<std::mutex> lock(mtx);\n        obj->reset();\n\
    \        pool.push_back(obj);\n        cv.notify_one();\n    }\n};\n```\n\n####\
    \ Explanation\n\n1. `Constructor`: Initializes the pool with a predefined number\
    \ of objects.\n2. `acquire()` Method:\n- Acquires a lock on `mtx`.\n- Waits until\
    \ an object is available in the pool.\n- Retrieves an object from the pool and\
    \ returns it.\n3. `release()` Method:\n- Acquires a lock on `mtx`.\n- Resets the\
    \ object to a reusable state.\n- Returns the object to the pool and notifies waiting\
    \ threads.\n\n### Step 3: Usage Example\n\n```cpp\nint main() {\n    ObjectPool<PoolableObject>\
    \ pool(2);\n    auto obj1 = pool.acquire();\n    obj1->doSomething();\n    auto\
    \ obj2 = pool.acquire();\n    obj2->doSomething();\n    pool.release(obj1);\n\
    \    pool.release(obj2);\n    auto obj3 = pool.acquire();\n    obj3->doSomething();\n\
    \    return 0;\n}\n```\n\nIn this example:\n- Two objects are acquired from the\
    \ pool and used.\n- The objects are then released back to the pool.\n- A third\
    \ object is acquired and used, demonstrating object reuse.\n\n## Key Points and\
    \ Considerations\n\n1. `Thread Safety`: The implementation ensures thread safety\
    \ using `mutexes` and `condition_variables`, allowing multiple threads to safely\
    \ acquire and release objects.\n2. `Resource Management`: Efficiently manages\
    \ resources by reusing objects and preventing the unnecessary creation and destruction\
    \ of objects.\n3. `Customization`: The `ObjectPool` class can be customized to\
    \ handle different types of objects and additional functionality, such as object\
    \ validation or customization during reset.\n\n## Enhancements and Optimizations\n\
    \n1. `Dynamic Pool Size`: Implementing a mechanism to adjust the pool size dynamically\
    \ based on demand can improve resource utilization.\n2. `Object Validation`: Adding\
    \ validation logic to ensure that objects are in a consistent state before they\
    \ are reused.\n3. `Idle Object Management`: Implementing mechanisms to handle\
    \ idle objects, such as destroying them after a certain period of inactivity,\
    \ to free up resources.\n\n## Alternative Implementations\n\n1. `Boost.ObjectPool`:\
    \ The Boost library provides an `object_pool` class that can be used for similar\
    \ purposes, offering more advanced features and optimizations.\n"
