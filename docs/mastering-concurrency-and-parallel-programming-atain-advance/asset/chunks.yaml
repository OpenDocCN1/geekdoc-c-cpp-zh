  trans: "\n\n2. **挂起 (Suspension)**：协程挂起执行 (`co_await`) 以等待异步事件。\n\n3. **恢复 (Resumption)**：一旦等待的事件完成，协程将恢复执行。\n\
    \n4. **完成 (Completion)**：协程完成执行并返回结果 (`co_return`)。\n\n在挂起期间，协程会交出控制权，允许其他任务或协程运行。这种协作式多任务确保了资源的高效利用。\n\
    \n## 可等待对象 (Awaitables) 与等待者 (Awaiters)\n\n要将协程与并发集成，理解 `awaitables` 和 `awaiters`\
    \ 至关重要。`awaitable` 是任何可以使用 `co_await` 进行 等待的对象。当协程遇到 `co_await` 时，它会与 `awaitable`\
    \ 的 `awaiter` 交互，该者必须提供以下方法：\n\n- `await_ready()`：决定协程是否应该挂起。\n- `await_suspend()`：处理挂起操作，通常与协程句柄交互。\n\
    - `await_resume()`：恢复后返回结果。\n\n## 自定义可等待对象示例\n\n这里有一个自定义可等待对象的示例：\n\n```cpp\n\
    #include <coroutine>\n#include <chrono>\n#include <iostream>\n#include <thread>\n\
    \nstruct Timer {\n    std::chrono::milliseconds duration;\n    Timer(std::chrono::milliseconds\
    \ d) : duration(d) {}\n    bool await_ready() const { return duration.count()\
    \ <= 0; }\n    void await_suspend(std::coroutine_handle<> h) const {\n       \
    \ std::thread([=]() {\n            std::this_thread::sleep_for(duration);\n  \
    \          h.resume();\n        }).detach();\n    }\n    void await_resume() const\
    \ {}\n};\n\nTask myTimedCoroutine() {\n    std::cout << \"Waiting...\\n\";\n \
    \   co_await Timer{std::chrono::seconds(1)};\n    std::cout << \"Done waiting!\\\
    n\";\n}\n```\n\n在此示例中，协程在恢复之前会等待指定的时长。\n\n## 协程的实际用例\n\n### 异步 I/O\n\n协程在处理异步\
    \ I/O 操作方面表现出色，例如从文件或网络读写数据。它们允许应用程序在等待 I/O 操作完成的同时执行其他任务。\n\n#### 示例：异步文件读取\n\
    \n```cpp\n#include <coroutine>\n#include <fstream>\n#include <iostream>\n#include\
    \ <vector>\n\nstruct FileRead {\n    std::ifstream file;\n    std::vector<char>\
    \ buffer;\n    bool await_ready() const { return false; }\n    void await_suspend(std::coroutine_handle<>\
    \ h) {\n        file.read(buffer.data(), buffer.size());\n        h.resume();\n\
    \    }\n    size_t await_resume() const { return file.gcount(); }\n};\n\nTask\
    \ readFileCoroutine(const std::string& fileName) {\n    FileRead fileRead{std::ifstream{fileName},\
    \ std::vector<char>(1024)};\n    size_t bytesRead = co_await fileRead;\n    std::cout\
    \ << \"Read \" << bytesRead << \" bytes from file\\n\";\n}\n```\n\n此示例演示了如何使用协程异步从文件中读取数据。\n\
    \n### 网络编程\n\n协程在处理网络操作方面同样有效，在网络操作中，非阻塞 I/O 对扩展性至关重要。\n\n#### 示例：异步网络请求\n\n```cpp\n\
    #include <coroutine>\n#include <iostream>\n#include <boost/asio.hpp>\n#include\
    \ <boost/asio/ssl.hpp>\n\nstruct NetworkRequest {\n    boost::asio::io_context&\
    \ io_context;\n    boost::asio::ip::tcp::resolver resolver;\n    boost::asio::ip::tcp::socket\
    \ socket;\n    boost::asio::streambuf response;\n    NetworkRequest(boost::asio::io_context&\
    \ context)\n    : io_context(context), resolver(context), socket(context) {}\n\
    \    bool await_ready() const { return false; }\n    void await_suspend(std::coroutine_handle<>\
    \ h) {\n        resolver.async_resolve(\"example.com\", \"80\",\n            this,\
    \ h {\n                if (!ec) {\n                    boost::asio::async_connect(socket,\
    \ endpoints,\n                    this, h {\n                        if (!ec)\
    \ {\n                            boost::asio::async_write(socket, boost::asio::buffer(\"\
    GET / HTTP/1.1\\r\\nHost: example.com\\r\\n\\r\\n\"),\n                      \
    \      this, h {\n                                if (!ec) {\n               \
    \                     boost::asio::async_read(socket, response,\n            \
    \                        this, h {\n                                        h.resume();\n\
    \                                    });\n                                }\n\
    \                            });\n                        }\n                \
    \    });\n                }\n            });\n    }\n    std::string await_resume()\
    \ const {\n        return boost::asio::buffer_cast<const char*>(response.data());\n\
    \    }\n};\n\nTask fetchWebsite() {\n    boost::asio::io_context io_context;\n\
    \    NetworkRequest request{io_context};\n    std::string result = co_await request;\n\
    \    std::cout << \"Response: \" << result;\n}\n```\n\n此示例展示了如何使用 Boost.Asio 进行异步网络请求。\n\
    \n## 高级协程模式\n\n### 带有执行器 (Executors)\n\n执行器提供了调度协程执行的方式，能够实现更细粒度的控制。\n\n示例：使用执行器\n\
    ```cpp\nboost::asio::io_context io_context;\nauto executor = io_context.get_executor();\n\
    boost::asio::co_spawn(executor, fetchWebsite(), detached);\n```\n\n在此示例中，`fetchWebsite`\
    \ 协程通过执行器启动。\n\n### 协程组合\n\n协程可以组合以创建复杂的工作流。这使得异步操作模块化。\n\n示例：组合多个协程\n```cpp\n\
    Task performComplexOperation() {\n    co_await step1();\n    co_await step2();\n\
    \    co_await step3();\n    std::cout << \"All steps completed\\n\";\n}\n\nTask\
    \ step1() {\n    std::cout << \"Step 1\\n\";\n    co_return;\n}\n\nTask step2()\
    \ {\n    std::cout << \"Step 2\\n\";\n    co_return;\n}\n\nTask step3() {\n  \
    \  std::cout << \"Step 3\\n\";\n    co_return;\n}\n```\n\n在此示例中，`performComplexOperation`\
    \ 组合了三个独立的协程。\n\n## 协程与并发的未来\n\n随着 C++ 语言的演进，协程预计成为并发和异步编程的核心。它们提供了一种更清晰高效的方法来处理异步任务，减少了复杂性并提高了可维护性。\n\
    \n### 协程的未来方向\n\n1. **增强库支持**：随着更多库和框架采用协程，集成将变得更加容易，为网络、文件 I/O 和 GUI 编程等领域提供现成的\
    \ API。\n2. **性能优化**：协程的编译器和优化将继续改进，使其更加高效，适用于高性能应用程序。\n3. **标准库扩展**：未来的 C++ 标准库可能会包含更多对协程友好的工具和算法，进一步简化并发应用的开发。\n\
    \n### 使用协程的最佳实践\n\n1. **最小化阻塞操作**：在协程内部避免阻塞操作，以保持其效率和响应能力。尽可能使用非阻塞替代方案。\n2. **资源管理**：确保协程内部内存和文件句柄等资源的正确管理。使用\
    \ RAII（资源获取初始化）模式自动处理资源清理。\n3. **错误处理**：在协程内部实现健壮的错误处理，以优雅管理异常和错误。等待错误处理协程以简化流程。\n\
    4. **测试与调试**：彻底测试和调试协程，因为其异步特性可能会引入微妙的 bug 和竞态条件。利用专为协程调试设计的工具和库。\n5. **文档与注释**：清晰地记录协程的行为和流程，因为异步执行可能使代码更难理解。使用注释和文档解释挂起点和恢复行为。\n"
- fmt: "\nCoroutines in C++20 represent a significant advancement in the way asynchronous\
    \ and concurrent programming is approached. By allowing developers to write code\
    \ that is both easier to understand and maintain, coroutines reduce the complexity\
    \ traditionally associated with asynchronous operations. Their ability to suspend\
    \ and resume execution, preserve state, and integrate seamlessly with existing\
    \ concurrency mechanisms makes them an invaluable tool in modern software development.\n\
    \n# Atomic Operations and Memory Models in C++\n\nConcurrency in software development\
    \ introduces complexities related to data consistency and synchronization. Atomic\
    \ operations and memory models in C++ provide mechanisms to manage these complexities,\
    \ ensuring correct and efficient execution of concurrent programs.\n\nAtomic operations\
    \ are fundamental operations that are executed without interruption. In the context\
    \ of concurrency, atomic operations ensure that a sequence of operations on shared\
    \ data is completed as a single, indivisible step, preventing race conditions\
    \ and ensuring data integrity.\n\n## Key Characteristics of Atomic Operations\n\
    \n1. **Indivisibility**: Atomic operations are executed as a single, uninterruptible\
    \ unit. This means that once an atomic operation starts, no other operation can\
    \ observe it in an intermediate state.\n2. **Lock-Free**: Atomic operations typically\
    \ do not use locks, reducing the overhead associated with synchronization mechanisms\
    \ like `mutexes`.\n3. **Hardware Support**: Most modern processors provide hardware-level\
    \ support for atomic operations, making them highly efficient.\n\n## Atomic Types\
    \ in C++\n\nThe C++ Standard Library provides the `<atomic>` header, which includes\
    \ atomic types and functions. These atomic types wrap fundamental data types and\
    \ provide atomic operations on them.\n\n### Basic Atomic Types\n\n- `std::atomic<T>`:\
    \ A template class that provides atomic operations for any type `T` that is trivially\
    \ copyable.\n- Specializations for integral types: `std::atomic<int>`, `std::atomic<bool>`,\
    \ etc.\n\n### Example: Using `std::atomic`\n\n```cpp\n#include <atomic>\n#include\
    \ <iostream>\n#include <thread>\n\nstd::atomic<int> counter(0);\n\nvoid increment()\
    \ {\n    for (int i = 0; i < 1000; ++i) {\n        ++counter;\n    }\n}\n\nint\
    \ main() {\n    std::thread t1(increment);\n    std::thread t2(increment);\n \
    \   t1.join();\n    t2.join();\n    std::cout << \"Final counter value: \" <<\
    \ counter.load() << std::endl;\n    return 0;\n}\n```\n\nIn this example, `counter`\
    \ is an atomic integer, ensuring that increments by multiple threads are performed\
    \ atomically, preventing race conditions.\n\n### Atomic Operations\n\nThe `std::atomic`\
    \ class template provides several atomic operations:\n\n- Load and Store: `load()`,\
    \ `store()`\n- Exchange: `exchange()`\n- Fetch and Modify: `fetch_add()`, `fetch_sub()`,\
    \ `fetch_and()`, `fetch_or()`, etc.\n- Compare and Exchange: `compare_exchange_weak()`,\
    \ `compare_exchange_strong()`\n\n### Example: Compare and Exchange\n\n```cpp\n\
    #include <atomic>\n#include <iostream>\n#include <thread>\n\nstd::atomic<int>\
    \ value(0);\n\nvoid compareAndSwap() {\n    int expected = 0;\n    if (value.compare_exchange_strong(expected,\
    \ 1)) {\n        std::cout << \"Value was 0, now set to 1\\n\";\n    } else {\n\
    \        std::cout << \"Value was not 0, no change\\n\";\n    }\n}\n\nint main()\
    \ {\n    std::thread t1(compareAndSwap);\n    std::thread t2(compareAndSwap);\n\
    \    t1.join();\n    t2.join();\n    std::cout << \"Final value: \" << value.load()\
    \ << std::endl;\n    return 0;\n}\n```\n\nIn this example, `compare_exchange_strong`\
    \ atomically compares and swaps the value, ensuring thread-safe updates.\n\n##\
    \ Memory Models in C++\n\nMemory models define the behavior of memory operations\
    \ in concurrent programs, specifying how changes to memory by one thread become\
    \ visible to others. The C++ memory model provides a formal framework to reason\
    \ about these interactions.\n\n### Memory Ordering\n\nMemory ordering specifies\
    \ the sequence in which memory operations are observed. The C++ Standard Library\
    \ defines several memory orderings:\n\n1. `memory_order_relaxed`: No synchronization\
    \ or ordering constraints.\n2. `memory_order_consume`: Data dependency ordering.\n\
    3. `memory_order_acquire`: Ensures subsequent operations are not reordered before\
    \ the acquire.\n4. `memory_order_release`: Ensures previous operations are not\
    \ reordered after the release.\n5. `memory_order_acq_rel`: Combines acquire and\
    \ release semantics.\n6. `memory_order_seq_cst`: Enforces sequential consistency,\
    \ ensuring a total ordering of all operations.\n\n### Example: Memory Ordering\n\
    \n```cpp\n#include <atomic>\n#include <iostream>\n#include <thread>\n\nstd::atomic<int>\
    \ data(0);\nstd::atomic<bool> ready(false);\n\nvoid producer() {\n    data.store(42,\
    \ std::memory_order_relaxed);\n    ready.store(true, std::memory_order_release);\n\
    }\n\nvoid consumer() {\n    while (!ready.load(std::memory_order_acquire)) {\n\
    \        // Busy-wait\n    }\n    std::cout << \"Data: \" << data.load(std::memory_order_relaxed)\
    \ << std::endl;\n}\n\nint main() {\n    std::thread t1(producer);\n    std::thread\
    \ t2(consumer);\n    t1.join();\n    t2.join();\n    return 0;\n}\n```\n\nIn this\
    \ example, `memory_order_release` and `memory_order_acquire` ensure that the `consumer`\
    \ thread sees the correct value of `data` once `ready` is set to `true`.\n\n##\
    \ Synchronization with Atomic Operations\n\nAtomic operations are often used for\
    \ synchronization in concurrent programs, enabling lock-free and wait-free algorithms.\
    \ These algorithms ensure that operations on shared data do not require traditional\
    \ locks, improving performance and reducing contention.\n\n### Lock-Free and Wait-Free\
    \ Algorithms\n\n- **Lock-Free**: At least one thread can make progress in a finite\
    \ number of steps.\n- **Wait-Free**: Every thread can complete its operation in\
    \ a finite number of steps.\n\n### Example: Lock-Free Stack\n\n```cpp\n#include\
    \ <atomic>\n#include <iostream>\n#include <memory>\n\ntemplate <typename T>\n\
    class LockFreeStack {\npublic:\n    void push(T value) {\n        Node* newNode\
    \ = new Node(value);\n        newNode->next = head.load();\n        while (!head.compare_exchange_weak(newNode->next,\
    \ newNode)) {\n            // Retry until successful\n        }\n    }\n    bool\
    \ pop(T& result) {\n        Node* top = head.load();\n        while (top && !head.compare_exchange_weak(top,\
    \ top->next)) {\n            // Retry until successful\n        }\n        if\
    \ (top) {\n            result = top->value;\n            delete top;\n       \
    \     return true;\n        }\n        return false;\n    }\nprivate:\n    struct\
    \ Node {\n        T value;\n        Node* next;\n        Node(T val) : value(val),\
    \ next(nullptr) {}\n    };\n    std::atomic<Node*> head{nullptr};\n};\n\nint main()\
    \ {\n    LockFreeStack<int> stack;\n    stack.push(1);\n    stack.push(2);\n \
    \   stack.push(3);\n    int value;\n    while (stack.pop(value)) {\n        std::cout\
    \ << \"Popped: \" << value << std::endl;\n    }\n    return 0;\n}\n```\n\nIn this\
    \ example, the `LockFreeStack` uses atomic operations to ensure thread-safe push\
    \ and pop operations.\n\n## Understanding the C++ Memory Model\n\nThe C++ memory\
    \ model provides a formal framework for understanding the behavior of concurrent\
    \ programs. It defines how operations on shared memory interact and how changes\
    \ made by one thread become visible to others.\n\n### Sequential Consistency\n\
    \nSequential consistency is the simplest and most intuitive memory model, where\
    \ all operations appear to execute in a strict sequential order. However, it is\
    \ also the most restrictive and can limit performance.\n\n### Example: Sequential\
    \ Consistency\n\n```cpp\n#include <atomic>\n#include <iostream>\n#include <thread>\n\
    \nstd::atomic<int> x(0), y(0);\n\nvoid write_x() {\n    x.store(1, std::memory_order_seq_cst);\n\
    \    y.store(2, std::memory_order_seq_cst);\n}\n\nvoid read_y_then_x() {\n   \
    \ int r1 = y.load(std::memory_order_seq_cst);\n    int r2 = x.load(std::memory_order_seq_cst);\n\
    \    std::cout << \"r1: \" << r1 << \", r2: \" << r2 << std::endl;\n}\n\nint main()\
    \ {\n    std::thread t1(write_x);\n    std::thread t2(read_y_then_x());\n    t1.join();\n\
    \    t2.join();\n    return 0;\n}\n```\n\nIn this example, the use of `memory_order_seq_cst`\
    \ ensures a sequentially consistent view of memory operations.\n"
  raw: 'Coroutines in C++20 represent a significant advancement in the way asynchronous
    and concurrent programming is approached. By allowing developers to write code
    that is both easier to understand and maintain, coroutines reduce the complexity
    traditionally associated with asynchronous operations. Their ability to suspend
    and resume execution, preserve state, and integrate seamlessly with existing concurrency
    mechanisms makes them an invaluable tool in modern software development.


    ## -  Atomic Operations and Memory Models in C++


    Concurrency in software development introduces complexities related to data consistency
    and synchronization. Atomic operations and memory models in C++ provide mechanisms
    to manage these complexities, ensuring correct and efficient execution of concurrent
    programs.


    Atomic operations are fundamental operations that are executed without interruption.
    In the context of concurrency, atomic operations ensure that a sequence of operations
    on shared data is completed as a single, indivisible step, preventing race conditions
    and ensuring data integrity.


    Key Characteristics of Atomic Operations


    1\. Indivisibility: Atomic operations are executed as a single, uninterruptible
    unit. This means that once an atomic operation starts, no other operation can
    observe it in an intermediate state.


    2\. Lock-Free: Atomic operations typically do not use locks, reducing the overhead
    associated with synchronization mechanisms like mutexes.


    3\. Hardware Support: Most modern processors provide hardware-level support for
    atomic operations, making them highly efficient.


    Atomic Types in C++


    The C++ Standard Library provides the `<atomic>` header, which includes atomic
    types and functions. These atomic types wrap fundamental data types and provide
    atomic operations on them.


    Basic Atomic Types


    - `std::atomic<T>`: A template class that provides atomic operations for any type
    `T` that is trivially copyable.


    - Specializations for integral types: `std::atomic<int>`, `std::atomic<bool>`,
    etc.


    Example: Using `std::atomic`


    ```cpp


    #include <atomic>


    #include <iostream>


    #include <thread>


    std::atomic<int> counter(0);


    void increment() {


    for (int i = 0; i < 1000; ++i) {


    ++counter;


    }


    }


    int main() {


    std::thread t1(increment);


    std::thread t2(increment);


    t1.join();


    t2.join();


    std::cout << "Final counter value: " << counter.load() << std::endl;


    return 0;


    }


    ```


    In this example, `counter` is an atomic integer, ensuring that increments by multiple
    threads are performed atomically, preventing race conditions.


    Atomic Operations


    The `std::atomic` class template provides several atomic operations:


    - Load and Store: `load()`, `store()`


    - Exchange: `exchange()`


    - Fetch and Modify: `fetch_add()`, `fetch_sub()`, `fetch_and()`, `fetch_or()`,
    etc.


    - Compare and Exchange: `compare_exchange_weak()`, `compare_exchange_strong()`


    Example: Compare and Exchange


    ```cpp


    #include <atomic>


    #include <iostream>


    #include <thread>


    std::atomic<int> value(0);


    void compareAndSwap() {


    int expected = 0;


    if (value.compare_exchange_strong(expected, 1)) {


    std::cout << "Value was 0, now set to 1\n";


    } else {


    std::cout << "Value was not 0, no change\n";


    }


    }


    int main() {


    std::thread t1(compareAndSwap);


    std::thread t2(compareAndSwap);


    t1.join();


    t2.join();


    std::cout << "Final value: " << value.load() << std::endl;


    return 0;


    }


    ```


    In this example, `compare_exchange_strong` atomically compares and swaps the value,
    ensuring thread-safe updates.


    Memory Models in C++


    Memory models define the behavior of memory operations in concurrent programs,
    specifying how changes to memory by one thread become visible to others. The C++
    memory model provides a formal framework to reason about these interactions.


    Memory Ordering


    Memory ordering specifies the sequence in which memory operations are observed.
    The C++ Standard Library defines several memory orderings:


    1\. `memory_order_relaxed`: No synchronization or ordering constraints.


    2\. `memory_order_consume`: Data dependency ordering.


    3\. `memory_order_acquire`: Ensures subsequent operations are not reordered before
    the acquire.


    4\. `memory_order_release`: Ensures previous operations are not reordered after
    the release.


    5\. `memory_order_acq_rel`: Combines acquire and release semantics.


    6\. `memory_order_seq_cst`: Enforces sequential consistency, ensuring a total
    ordering of all operations.


    Example: Memory Ordering


    ```cpp


    #include <atomic>


    #include <iostream>


    #include <thread>


    std::atomic<int> data(0);


    std::atomic<bool> ready(false);


    void producer() {


    data.store(42, std::memory_order_relaxed);


    ready.store(true, std::memory_order_release);


    }


    void consumer() {


    while (!ready.load(std::memory_order_acquire)) {


    // Busy-wait


    }


    std::cout << "Data: " << data.load(std::memory_order_relaxed) << std::endl;


    }


    int main() {


    std::thread t1(producer);


    std::thread t2(consumer);


    t1.join();


    t2.join();


    return 0;


    }


    ```


    In this example, `memory_order_release` and `memory_order_acquire` ensure that
    the `consumer` thread sees the correct value of `data` once `ready` is set to
    `true`.


    Synchronization with Atomic Operations


    Atomic operations are often used for synchronization in concurrent programs, enabling
    lock-free and wait-free algorithms. These algorithms ensure that operations on
    shared data do not require traditional locks, improving performance and reducing
    contention.


    Lock-Free and Wait-Free Algorithms


    - Lock-Free: At least one thread can make progress in a finite number of steps.


    - Wait-Free: Every thread can complete its operation in a finite number of steps.


    Example: Lock-Free Stack


    ```cpp


    #include <atomic>


    #include <iostream>


    #include <memory>


    template <typename T>


    class LockFreeStack {


    public:


    void push(T value) {


    Node* newNode = new Node(value);


    newNode->next = head.load();


    while (!head.compare_exchange_weak(newNode->next, newNode)) {


    // Retry until successful


    }


    }


    bool pop(T& result) {


    Node* top = head.load();


    while (top && !head.compare_exchange_weak(top, top->next)) {


    // Retry until successful


    }


    if (top) {


    result = top->value;


    delete top;


    return true;


    }


    return false;


    }


    private:


    struct Node {


    T value;


    Node* next;


    Node(T val) : value(val), next(nullptr) {}


    };


    std::atomic<Node*> head{nullptr};


    };


    int main() {


    LockFreeStack<int> stack;


    stack.push(1);


    stack.push(2);


    stack.push(3);


    int value;


    while (stack.pop(value)) {


    std::cout << "Popped: " << value << std::endl;


    }


    return 0;


    }


    ```


    In this example, the `LockFreeStack` uses atomic operations to ensure thread-safe
    push and pop operations without locks.


    Understanding the C++ Memory Model


    The C++ memory model provides a formal framework for understanding the behavior
    of concurrent programs. It defines how operations on shared memory interact and
    how changes made by one thread become visible to others.


    Sequential Consistency


    Sequential consistency is the simplest and most intuitive memory model, where
    all operations appear to execute in a strict sequential order. However, it is
    also the most restrictive and can limit performance.


    Example: Sequential Consistency


    ```cpp


    #include <atomic>


    #include <iostream>


    #include <thread>


    std::atomic<int> x(0), y(0);


    void write_x() {


    x.store(1, std::memory_order_seq_cst);


    y.store(2, std::memory_order_seq_cst);


    }


    void read_y_then_x() {


    int r1 = y.load(std::memory_order_seq_cst);


    int r2 = x.load(std::memory_order_seq_cst);


    std::cout << "r1: " << r1 << ", r2: " << r2 << std::endl;


    }


    int main() {


    std::thread t1(write_x);


    std::thread t2(read_y_then_x);


    t1.join();


    t2.join();


    return 0;


    }


    ```


    In this example, the use of `memory_order_seq_cst` ensures a sequentially consistent
    view of memory operations.'
