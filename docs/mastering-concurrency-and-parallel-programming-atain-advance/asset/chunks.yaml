    ## - Lock guards (std::lock_guard, std::unique_lock)


    In multithreaded programming, synchronization is key to ensuring that shared resources
    are accessed safely. One of the most effective ways to achieve this is through
    the use of lock guards. C++ offers two main types of lock guards: `std::lock_guard`
    and `std::unique_lock`. These tools help manage mutex locks, ensuring that locks
    are acquired and released safely and efficiently, thereby preventing issues such
    as race conditions and deadlocks.


    Lock guards are RAII (Resource Acquisition Is Initialization) wrappers that manage
    the acquisition and release of mutex locks. They provide a convenient and reliable
    way to ensure that mutexes are properly locked and unlocked, even in the presence
    of exceptions or early returns from functions.


    std::lock_guard


    `std::lock_guard` is a simple and efficient lock guard that locks a mutex upon
    construction and automatically unlocks it when the `std::lock_guard` object goes
    out of scope. This ensures that the mutex is always properly released, reducing
    the risk of deadlocks and other synchronization issues.


    Example Usage of std::lock_guard:


    ```cpp


    #include <iostream>


    #include <thread>


    #include <mutex>


    std::mutex mtx;


    void print_message(const std::string& message) {


    std::lock_guard<std::mutex> lock(mtx);


    std::cout << message << std::endl;


    }


    int main() {


    std::thread t1(print_message, "Hello from thread 1");


    std::thread t2(print_message, "Hello from thread 2");


    t1.join();


    t2.join();


    return 0;


    }


    ```


    In this example, `std::lock_guard` is used to lock the mutex `mtx` in the `print_message`
    function. The mutex is automatically unlocked when the `std::lock_guard` object
    `lock` goes out of scope, ensuring that the shared resource (`std::cout`) is accessed
    safely.


    Benefits of std::lock_guard:


    1\. Simplicity: `std::lock_guard` is easy to use and requires minimal code changes
    to add thread safety to critical sections.


    2\. Safety: It guarantees that the mutex will be unlocked when the `std::lock_guard`
    object is destroyed, preventing resource leaks and ensuring consistent lock management.


    3\. Efficiency: `std::lock_guard` incurs minimal overhead, making it suitable
    for performance-critical applications.


    std::unique_lock


    `std::unique_lock` is a more flexible lock guard that provides additional features
    beyond those offered by `std::lock_guard`. It allows for deferred locking, timed
    locking, and manual unlocking, making it suitable for more complex synchronization
    scenarios.


