    #include <numeric>\n#include <execution>\n#include <iostream>\n\nint main() {\n\
    \    std::vector<int> data = {1, 2, 3, 4, 5};\n    int sum = std::transform_reduce(\n\
    \        std::execution::par,\n        data.begin(), data.end(),\n        0,\n\
    \        std::plus<>(),\n        [](int n) { return n * n; }\n    );\n    std::cout\
    \ << \"Sum of squares: \" << sum << std::endl;\n    return 0;\n}\n```\n在此示例中，每个元素通过平方进行变换，然后并行对所有平方值求和。\n\
    \n3. `std::inclusive_scan` 和 `std::exclusive_scan`:\n这些算法执行并行前缀和：\n\n```cpp\n\
    #include <vector>\n#include <numeric>\n#include <execution>\n#include <iostream>\n\
    \nint main() {\n    std::vector<int> data = {1, 2, 3, 4, 5};\n    std::vector<int>\
    \ result(data.size());\n    std::inclusive_scan(\n        std::execution::par,\n\
    \        data.begin(), data.end(),\n        result.begin()\n    );\n    std::cout\
