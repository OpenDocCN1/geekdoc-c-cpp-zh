    \ `std::future` 用于获取任务结果。\n\n#### 3. 同步\n\n并行算法中的同步对于确保并发任务不会相互干扰导致数据损坏或结果不一致至关重要。\n\
    \n###### 锁与锁\n\n同步机制之一是使用互斥锁和锁。互斥锁（mutex）确保同一时间只有一个线程可以访问共享资源。\n\n##### 示例：使用\
