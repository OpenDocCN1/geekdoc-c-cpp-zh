    \ ensure that multiple tasks can make progress. This often involves context switching,\
    \ where the system switches between tasks, sharing CPU time among them.\n   -\
    \ Parallelism involves dividing a task into smaller sub-tasks and executing these\
    \ sub-tasks concurrently across multiple processors or cores, aiming to speed\
    \ up computation by utilizing additional hardware resources.\n3. **Granularity**:\n\
    \   - Concurrency can operate at various levels of granularity, from fine-grained\
    \ tasks (such as individual threads) to coarse-grained tasks (such as entire processes).\
    \ The focus is on managing the interactions and dependencies between these tasks.\n\
