    Best Practices for Handling Exceptions in Threads


    1\. Catch Exceptions in Each Thread:


    ● Ensure that every thread has a try-catch block to handle exceptions locally.
    This prevents unhandled exceptions from terminating the thread abruptly.


    2\. Use std::promise and std::future for Communication:


    ● Use `std::promise` and `std::future` to propagate exceptions between threads,
    ensuring that the main thread can handle errors occurring in worker threads.


    3\. Log Exceptions:


    ●        Log exceptions in each thread to facilitate debugging and monitoring
    of the application''s behavior.


    4\. Graceful Shutdown:


    ●        Design your application to handle exceptions gracefully, allowing for
    a controlled shutdown or recovery process.


    5\. Avoid Overuse of Exceptions:


    ● Use exceptions for exceptional conditions and errors, not for regular control
    flow. Overusing exceptions can make code harder to read and maintain.


    Advanced Techniques for Exception Handling


    In more complex applications, you may need advanced techniques to handle exceptions
    across multiple threads and ensure that your application remains stable.


    Thread Pools and Exception Handling


    When using thread pools, managing exceptions requires a centralized approach where
    exceptions from worker threads are collected and handled by the thread pool manager.
    Here’s a basic example:


    ```cpp


    #include <thread>


    #include <iostream>


    #include <vector>


    #include <queue>


    #include <mutex>


    #include <condition_variable>


    #include <future>


    class ThreadPool {


    public:


    ThreadPool(size_t numThreads);


    ~ThreadPool();


    template <class F>


    void enqueue(F&& f);


    private:


    std::vector<std::thread> workers;


    std::queue<std::function<void()>> tasks;


    std::mutex queueMutex;


    std::condition_variable condition;


    bool stop;


    std::vector<std::exception_ptr> exceptions;


    void worker();


    };


    ThreadPool::ThreadPool(size_t numThreads) : stop(false) {


    for (size_t i = 0; i < numThreads; ++i) {


    workers.emplace_back(&ThreadPool::worker, this);


    }


    }


    ThreadPool::~ThreadPool() {


    {


    std::unique_lock<std::mutex> lock(queueMutex);


    stop = true;


    }


    condition.notify_all();


    for (std::thread& worker : workers) {


    worker.join();


    }


    for (const auto& ex : exceptions) {


    if (ex) {


    try {


    std::rethrow_exception(ex);


    } catch (const std::exception& e) {


    std::cerr << "Exception caught in thread pool: " << e.what() << std::endl;


    }


    }


    }


    }


    void ThreadPool::worker() {


    while (true) {


    std::function<void()> task;


    {


    std::unique_lock<std::mutex> lock(queueMutex);


    condition.wait(lock, [this] { return stop || !tasks.empty(); });


    if (stop && tasks.empty()) return;


    task = std::move(tasks.front());


    tasks.pop();


    }


    try {


    task();


    } catch (...) {


    std::unique_lock<std::mutex> lock(queueMutex);


    exceptions.push_back(std::current_exception());


    }


    }


    }


    template <class F>


    void ThreadPool::enqueue(F&& f) {


    {


    std::unique_lock<std::mutex> lock(queueMutex);


    tasks.emplace(std::forward<F>(f));


    }


    condition.notify_one();


    }


    int main() {


    ThreadPool pool(4);


    for (int i = 0; i < 10; ++i) {


    pool.enqueue([i] {


    if (i % 2 == 0) {


    throw std::runtime_error("Error in task " + std::to_string(i));


    } else {


    std::cout << "Task " << i << " is running." << std::endl;


    }


    });


    }


    return 0;


    }


    ```


    In this example, the `ThreadPool` class collects exceptions from worker threads
    and rethrows them in the destructor, allowing the main thread to handle all exceptions
    at the end of the program.


    Exception handling in multithreaded applications requires careful planning and
    implementation. By catching exceptions within threads, using mechanisms like `std::promise`
    and `std::future` to propagate exceptions, and following best practices, you can
    build robust and resilient applications. Understanding and implementing effective
    exception handling strategies is crucial for maintaining the stability and reliability
    of multithreaded C++ programs.


    # Chapter 3:


    # Synchronization and Mutual Exclusion


    ## - Race conditions and data races


    In the world of concurrent programming, race conditions and data races are common
    problems that can lead to unpredictable and erroneous behavior in software. Understanding
    these concepts is crucial for designing robust multithreaded applications.


    Race Conditions:


    A race condition occurs when the behavior of a software system depends on the
    relative timing of events such as thread execution. This often leads to unpredictable
    outcomes because different threads might access and modify shared resources concurrently
    without proper synchronization.


    Example of a Race Condition:


    Consider the following simple example where two threads increment a shared counter:


    ```cpp


    #include <iostream>


    #include <thread>


    int counter = 0;


    void increment() {


    for (int i = 0; i < 1000; ++i) {


    ++counter;


    }


    }


    int main() {


    std::thread t1(increment);


    std::thread t2(increment);


    t1.join();


    t2.join();


    std::cout << "Final counter value: " << counter << std::endl;


    return 0;


    }


    ```


    In this example, the `counter` variable is shared between two threads. Both threads
    increment the counter 1000 times. Ideally, the final counter value should be 2000\.
    However, due to the race condition, the actual result can vary, often yielding
    a value less than 2000.


    Understanding Data Races:


    A data race is a specific type of race condition where two or more threads concurrently
    access shared data, and at least one of the accesses is a write operation. Data
    races can lead to undefined behavior because the outcome depends on the non-deterministic
    timing of thread execution.


    Example of a Data Race:


    In the previous example, the data race occurs because both threads are modifying
    the `counter` variable without synchronization. The increment operation `++counter`
    involves multiple steps (reading, incrementing, and writing), which can interleave
    in an unpredictable manner when executed concurrently.


    Consequences of Race Conditions and Data Races:


    1\. Unpredictable Behavior: The final result of computations can vary across different
    runs, leading to inconsistent and hard-to-debug issues.


    2\. Data Corruption: Shared data might become corrupted due to unsynchronized
    access, causing logical errors and system crashes.


    3\. Security Vulnerabilities: Race conditions can introduce security vulnerabilities
    by allowing unauthorized access to shared resources.


    Detecting Race Conditions and Data Races:


    1\. Code Reviews: Thoroughly review code to identify and address potential race
    conditions and data races.


    2\. Static Analysis Tools: Use tools like Clang ThreadSanitizer (TSan) to detect
    data races at compile-time.


    3\. Dynamic Analysis Tools: Use tools like Valgrind''s Helgrind and Intel Inspector
    to detect data races at runtime.


    Preventing Race Conditions and Data Races:


    1\. Mutexes and Locks: Use mutexes and locks to synchronize access to shared resources.


    2\. Atomic Operations: Use atomic operations for simple read-modify-write operations
    to ensure atomicity without needing explicit locks.


    3\. Thread-Safe Data Structures: Use thread-safe data structures provided by libraries
    or implement custom ones to handle concurrent access safely.


    ## - Mutexes and locks (std::mutex, std::recursive_mutex)


    Mutexes (mutual exclusions) and locks are fundamental tools for synchronizing
    access to shared resources in multithreaded applications. They help prevent race
    conditions and data races by ensuring that only one thread can access a critical
    section of code at a time.


    std::mutex:


    The `std::mutex` class is part of the C++ Standard Library and provides a simple
    and efficient mechanism for mutual exclusion. It ensures that only one thread
    can lock the mutex at any given time, thereby protecting shared resources.


