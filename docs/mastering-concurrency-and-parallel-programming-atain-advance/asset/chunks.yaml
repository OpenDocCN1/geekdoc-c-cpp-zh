  trans: "\n\n## 2. 线程开销\n创建和管理大量线程在 CPU 和内存资源方面都是昂昂的。每个线程都会消耗系统资源，过多的线程会导致由于上下文切换和调度开销而带来的收益递减。\n\
    \n## 3. 伪共享：这发生在不同处理器上的线程修改位于同一缓存行（cache line）上彼此的变量时。尽管这些变量是独立的，但缓存行在核心之间的抖动会导致严重的性能惩罚。\n\
    \n## 4. 负载均衡：线程之间工作分配不均会导致某些线程负担过重，而其他线程处于空闲状态，从而导致可用 CPU 资源的利用率低下。\n\n## 增强可扩展性的解决方案\n\
    \n### 减少锁竞争\n\n- **细粒度锁 (Fine-Grained Locking)**：与其使用一个控制共享资源大部分部分的粗粒度锁，不如使用多个较小的锁来管理资源较小部分的访问。这种方法减少了线程等待锁的时间。\n\
    - **无锁数据结构 (Lock-Free Data Structures)**：使用原子操作实现无锁数据结构可以显著减少竞争并提高可扩展性。这些结构的设计允许线程在不需要锁机制的情况下进展。\n\
    \n### 管理线程开销\n\n- **线程池 (Thread Pools)**：不要为每个任务创建新线程，而是使用预先创建线程池来动态分配任务。这不仅减少了线程创建和销毁的开销，还将线程数量保持在可管理的范围内，优化了资源利用。\n\
    - **工作窃取 (Work Stealing)**：实现工作窃取队列用于线程之间的任务分配。在这种模型中，如果线程没有任务可用，它可以从其他线程的队列中“窃取”任务，从而实现负载负载。\n\
    \n### 处理伪共享\n\n- **填充 (Padding)**：在数据结构中引入填充，确保频繁访问的共享变量不共享同一缓存行。这种方法可以防止多个线程导致缓存行失效。\n\
    - **对齐 (Alignment)**：将频繁访问的共享数据对齐到缓存行边界以避免伪共享。许多现代 C++ 编译器都提供指定对齐的支持。\n\n### 改进负载均衡\n\
    \n- **动态任务分配 (Dynamic Task Distribution)**：利用算法根据线程当前的负载在线程之间动态分配任务。这比静态分区更有效，特别是在任务具有不同计算需求的场景下。\n\
    - **异步任务处理 (Asynchronous Task Processing)**：利用异步编程模型，允许线程执行非阻塞操作并继续执行其他任务，提高整体\
    \ CPU 利用率。\n\n考虑一个处理成千上万并发连接的 Web 服务器。传统的每个连接一个线程的模型会导致高线程开销和扩展性问题。通过实现线程池并使用非阻塞\
    \ I/O 操作，服务器可以使用更少的资源处理更多连接。此外，使用细粒度锁或无锁队列管理连接状态可以进一步增强吞吐量和可扩展性。\n\n## 内存模型影响\n\
    \nC++ 内存模型定义了在多线程环境中涉及共享内存的操作是如何执行的。理解其影响对于开发健壮且可扩展的并发应用程序至关重要。\n\n### 可见性和排序\n\
    \n- **可见性 (Visibility)**：一个线程对共享内存的更改需要对其他线程可见。内存模型规定了一个线程的更改何时以及如何对其他线程可见，防止读取过时数据等问题。\n\
    - **排序 (Ordering)**：内存模型定义了线程操作的影响对其他线程可见的顺序。正确的排序对于防止读后写冲突至关重要。\n\n### 内存屏障 (Memory\
    \ Fences)\n\n内存屏障（Memory fences or barriers）用于强制执行顺序约束。它们防止某些类型的处理器优化，这些优化可能导致多线程环境中的错误执行。适当使用内存屏障可以确保一个线程中的写入能及时被另一个线程的读取看到。\n\
    \n### 原子操作 (Atomic Operations)\n\n原子操作在减少竞争和无需锁的情况下确保数据一致性方面起着至关重要的作用。它们相对于其他线程是单步完成的操作。C++\
    \ 标准库提供了各种原子类型和操作，保证了原子性并指定了内存排序语义。\n\n### 处理数据竞态 (Data Races)\n\n当两个线程并发访问同一个内存位置，且至少一次访问是写操作时，就会发生数据竞态。C++\
    \ 内存模型提供了清晰的规则来避免数据竞态，主要通过使用原子操作和同步原语。\n\n理解扩展性问题内存模型影响是开发高效健壮并发应用程序的基础。通过应用正确的技术并遵循\
    \ C++ 内存模型，开发者可以确保其应用程序在不同计算环境中保持正确行为的同时实现有效扩展。这种双重关注不仅增强了性能，还防止了多线程应用程序中可能出现的细微错误。\n\
    \n# 第 9 章：\n\n# 并发高级主题\n\n## 协程与并发 (C++20 及以后)\n\n协程是特殊的函数，可以在某些点挂起和恢复执行。与从开始到结束运行而不中断的传统函数不同，协程允许更灵活的控制流，这对于异步编程特别有用。\n\
    \n### 协程的关键特征\n\n1. **挂起与恢复 (Suspension and Resumption)**：协程可以在指定点（`co_await`）挂起并在稍后恢复，这对于非阻塞操作非常理想。\n\
    2. **状态保留 (State Preservation)**：当协程挂起时，它保留了自己的状态，允许稍后恢复执行，就像从未暂停过一样。\n3. **高效资源利用**：通过避免阻塞线程，协程可以帮助实现更好的资源利用和可扩展性。\n\
    \n### C++20 中的协程\n\nC++20 将协程作为语言的一部分引入，提供了一种编写异步并发代码的标准方法。创建和管理协程涉及的关键组件包括：\n\
    \n- `co_await` 表达式：用于挂起协程并等待结果。\n- `co_yield` 表达式：用于从协程中产生一个值。\n- `co_return`\
    \ 语句：用于从协程返回一个值。\n\n### 基础协程示例\n\n这是一个简单的协程示例，它在挂起前后打印消息：\n\n```cpp\n#include\
    \ <coroutine>\n#include <iostream>\n\nstruct Task {\n    struct promise_type;\n\
    \    using handle_type = std::coroutine_handle<promise_type>;\n    handle_type\
    \ coro;\n\n    Task(handle_type h) : coro(h) {}\n    ~Task() { if (coro) coro.destroy();\
    \ }\n\n    struct promise_type {\n        auto get_return_object() { return handle_type::from_promise(*this);\
    \ }\n        auto initial_suspend() { return std::suspend_always{}; }\n      \
    \  auto final_suspend() noexcept { return std::suspend_always{}; }\n        void\
    \ return_void() {}\n        void unhandled_exception() { std::terminate(); }\n\
    \    };\n};\n\nTask myCoroutine() {\n    std::cout << \"Before suspension\\n\"\
    ;\n    co_await std::suspend_always{};\n    std::cout << \"After suspension\\\
    n\";\n}\n```\n\n在这个示例中，协程打印一条消息，挂起，然后在恢复后打印另一条消息。\n\n### 协程与并发\n\n协程对于并发特别有利，因为它们允许以同步风格编写异步操作，这使得代码更容易于理解和维护。在这里，我们将探索如何将协程与\
    \ C++ 的并发机制集成。\n\n### 协程生命周期与并发\n\n协程的生命周期涉及几个阶段：\n\n1. **创建 (Creation)**：创建并初始化协程。\n\
    \n"
- fmt: "\n2. **Suspension**: The coroutine suspends execution (`co_await`) to wait\
    \ for an asynchronous event.\n\n3. **Resumption**: The coroutine resumes execution\
    \ once the awaited event completes.\n\n4. **Completion**: The coroutine completes\
    \ execution and returns a result (`co_return`).\n\nDuring suspension, the coroutine\
    \ yields control, allowing other tasks or coroutines to run. This cooperative\
    \ multitasking ensures efficient use of resources.\n\n## Awaitables and Awaiters\n\
    \nTo integrate coroutines with concurrency, understanding `awaitables` and `awaiters`\
    \ is crucial. An `awaitable` is any object that can be awaited using `co_await`.\
    \ When a coroutine encounters `co_await`, it interacts with the `awaitable`'s\
    \ `awaiter`, which must provide the following methods:\n\n- `await_ready()`: Determines\
    \ if the coroutine should suspend.\n- `await_suspend()`: Handles the suspension,\
    \ typically interacting with the coroutine's handle.\n- `await_resume()`: Returns\
    \ the result after resumption.\n\n## Custom Awaitable Example\n\nHere’s an example\
    \ of a custom awaitable:\n\n```cpp\n#include <coroutine>\n#include <chrono>\n\
    #include <iostream>\n#include <thread>\n\nstruct Timer {\n    std::chrono::milliseconds\
    \ duration;\n    Timer(std::chrono::milliseconds d) : duration(d) {}\n    bool\
    \ await_ready() const { return duration.count() <= 0; }\n    void await_suspend(std::coroutine_handle<>\
    \ h) const {\n        std::thread([=]() {\n            std::this_thread::sleep_for(duration);\n\
    \            h.resume();\n        }).detach();\n    }\n    void await_resume()\
    \ const {}\n};\n\nTask myTimedCoroutine() {\n    std::cout << \"Waiting...\\n\"\
    ;\n    co_await Timer{std::chrono::seconds(1)};\n    std::cout << \"Done waiting!\\\
    n\";\n}\n```\n\nIn this example, the coroutine waits for a specified duration\
    \ before resuming.\n\n## Practical Use Cases for Coroutines\n\n### Asynchronous\
    \ I/O\n\nCoroutines excel in handling asynchronous I/O operations, such as reading\
    \ from or writing to files and networks. They allow the application to perform\
    \ other tasks while waiting for I/O operations to complete.\n\n#### Example: Asynchronous\
    \ File Read\n\n```cpp\n#include <coroutine>\n#include <fstream>\n#include <iostream>\n\
    #include <vector>\n\nstruct FileRead {\n    std::ifstream file;\n    std::vector<char>\
    \ buffer;\n    bool await_ready() const { return false; }\n    void await_suspend(std::coroutine_handle<>\
