    2\. Thread Cleanup: Ensure that any resources allocated to `thread_local` variables
    are properly cleaned up when the thread terminates. This can be achieved by using
    smart pointers or custom cleanup functions.


    3\. Avoid Complex Initialization: Avoid complex initialization logic for `thread_local`
    variables to prevent potential issues during thread startup. Use simple initializers
    or lazy initialization patterns.'
