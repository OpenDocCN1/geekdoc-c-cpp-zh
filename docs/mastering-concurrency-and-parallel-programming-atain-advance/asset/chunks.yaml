    \ << \"Waiting for the result...\" << std::endl;\n    int result = futureResult.get();\
    \ // Wait for the computation to finish and get the result\n    std::cout << \"\
    Result: \" << result << std::endl;\n    return 0;\n}\n```\n\nIn this example,\
    \ `std::async` is used to run the `computeSquare` function asynchronously, and\
