  trans: "\n并发编程虽然强大且对现代软件开发至关重要，但也带来了一系列挑战。开发者必须警惕的两个重要问题是死锁和活锁。这两个问题都会严重影响应用程序的性能和可靠性，因此理解它们的成因、影响以及如何避免至关重要。\n\
    \n## 死锁 (Deadlocks)\n\n死锁是指两个或多个线程无法继续执行的情况，因为每个线程都在等待另一个释放资源。这导致了停滞，使得所有参与的线程都无法进展。死锁通常在以下四个条件同时满足时发生：\n\
    \n1. **互斥性**：至少有一个资源必须以非共享模式持有。如果另一个线程请求该资源，则请求线程必须等待，直到资源被释放。\n2. **持有并等待**：一个持有至少一个资源的线程正在等待获取由其他线程持有的额外资源。\n\
    3. **非抢占**：资源不能从持有它的线程中强制夺取，直到资源被自愿释放。\n4. **循环等待**：存在一个线程集合，其中每个线程都在等待该集合中下一个线程持有的资源，形成一个环形链。\n\
    \n### 死锁示例\n\n考虑以下 C++ 代码，两个线程尝试以相反顺序获取两个互斥锁，导致死锁：\n\n```cpp\n#include <iostream>\n\
    #include <thread>\n#include <mutex>\n\nstd::mutex mtx1;\nstd::mutex mtx2;\n\n\
    void thread1() {\n    std::lock_guard<std::mutex> lock1(mtx1);\n    std::this_thread::sleep_for(std::chrono::milliseconds(100));\
    \ // 模拟工作\n    std::lock_guard<std::mutex> lock2(mtx2);\n    std::cout << \"Thread\
    \ 1 acquired both mutexes.\" << std::endl;\n}\n\nvoid thread2() {\n    std::lock_guard<std::mutex>\
    \ lock2(mtx2);\n    std::this_thread::sleep_for(std::chrono::milliseconds(100));\
    \ // 模拟工作\n    std::lock_guard<std::mutex> lock1(mtx1);\n    std::cout << \"Thread\
    \ 2 acquired both mutexes.\" << std::endl;\n}\n\nint main() {\n    std::thread\
