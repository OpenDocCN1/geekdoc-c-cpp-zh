    ## - Condition variables (std::condition_variable)


    A condition variable in C++ is a synchronization primitive that enables threads
    to block or wait until a particular condition becomes true. While blocking, threads
    do not consume CPU resources. Condition variables are always used in conjunction
    with a mutex (or lock), which synchronizes access to the condition and the shared
    resources involved.


    Understanding `std::condition_variable`


    The `std::condition_variable` is used to block one or more threads until they
    are notified by another thread. This is typically used in scenarios where the
    state of some shared data affects the execution of concurrent threads. Key operations
    associated with condition variables are:


    - Waiting: A thread waits on a condition variable, effectively blocking its execution
    until it is notified or a spurious wakeup occurs.


    - Notifying: A thread modifies the shared data and notifies one or more waiting
    threads that the condition they are waiting for may have become true.


    Basic Syntax and Methods


    The C++ Standard Library provides `std::condition_variable`, which works with
    `std::unique_lock<std::mutex>` to provide a more flexible interface for condition
    synchronization. The primary methods include:


    - `wait(lock)`: Blocks the current thread until the condition variable is notified.


    - `notify_one()`: Unblocks one of the waiting threads.


    - `notify_all()`: Unblocks all waiting threads.


    Practical Example: Producer-Consumer Problem


    To understand the practical application of condition variables, consider the producer-consumer
    problem, where a producer thread generates data that a consumer thread processes.


    ```cpp


    #include <iostream>


    #include <thread>


    #include <mutex>


    #include <condition_variable>


    #include <queue>


    std::mutex mtx;


    std::condition_variable cv;


    std::queue<int> dataQueue;


    bool finished = false;


    void producer(int count) {


    for (int i = 0; i < count; ++i) {


    std::unique_lock<std::mutex> locker(mtx);


    dataQueue.push(i);


    locker.unlock();


    cv.notify_one(); // Notify one waiting consumer


    std::this_thread::sleep_for(std::chrono::milliseconds(50)); // Simulate work


    }


    std::unique_lock<std::mutex> locker(mtx);


    finished = true;


    cv.notify_all(); // Notify all waiting threads


    }


    void consumer() {


    while (true) {


    std::unique_lock<std::mutex> locker(mtx);


    cv.wait(locker, [] { return !dataQueue.empty() || finished; });


    if (!dataQueue.empty()) {


    int data = dataQueue.front();


    dataQueue.pop();


    locker.unlock();


    std::cout << "Processed: " << data << std::endl;


    } else if (finished) {


    break;


    }


    }


    }


    int main() {


    std::thread prod(producer, 10);


    std::thread cons(consumer);


    prod.join();


    cons.join();


    return 0;


    }


    ```


    In this example:


    - The producer places items into a queue and notifies the consumer thread waiting
    on the condition variable.


    - The consumer waits until the queue is not empty or the production is finished.


    - The use of `notify_one()` and `notify_all()` illustrates how to control thread
    wake-up behavior.


    Handling Spurious Wakeups and Predicate Use


    Condition variables can experience spurious wakeups; hence, waiting on a condition
    variable should always be done in a loop, checking the condition being waited
    on:


    ```cpp


    cv.wait(locker, []{ return condition; });


    ```


    This predicate form of `wait()` is crucial because it re-checks the condition
    upon waking up before proceeding, ensuring that the wake-up is valid and that
    the condition is truly met.


    Advanced Scenarios: Multiple Producers and Consumers


    In more complex systems involving multiple producers and consumers, `std::condition_variable`
    can effectively manage different states of data processing, ensuring synchronization
    and efficient data handling. Multiple condition variables can be used to manage
    different types of notifications, enhancing control over thread communication
    and resource allocation.


    Best Practices


    - Always use condition variables with a mutex.


    - Prefer `std::unique_lock` over `std::lock_guard` when using condition variables
    because `unique_lock` can be unlocked and relocked.


    - Always protect shared data by a mutex when it is being modified or checked.


    - Make use of RAII (Resource Acquisition Is Initialization) to manage locking
    and unlocking automatically.


    `std::condition_variable` is a powerful tool in C++ for managing complex synchronization
    problems in multithreaded applications. When used correctly, it ensures that threads
    do not consume CPU resources unnecessarily and that they react promptly to changes
    in their operating conditions.


