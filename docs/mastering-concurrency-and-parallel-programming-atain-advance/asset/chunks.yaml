    \ waits on the `cv_producer` condition variable until there is space in the buffer\
    \ (`buffer.size() < maxBufferSize`).\n- Once there is space, the producer generates\
    \ a unique item, adds it to the buffer, and notifies one of the consumers using\
    \ `cv_consumer.notify_one()`.\n\n#### Step 4: Define the Consumer Function\n\n\
    ```cpp\nvoid consumer(int id) {\n    while (true) {\n        std::unique_lock<std::mutex>\
    \ lock(mtx);\n        cv_consumer.wait(lock, [] { return !buffer.empty(); });\n\
    \        int item = buffer.front();\n        buffer.pop();\n        std::cout\
    \ << \"Consumer \" << id << \" consumed item \" << item << std::endl;\n      \
    \  // Notify the producer that there is space in the buffer\n        cv_producer.notify_one();\n\
    \    }\n}\n```\n\nIn this consumer function:\n- The consumer locks the shared\
