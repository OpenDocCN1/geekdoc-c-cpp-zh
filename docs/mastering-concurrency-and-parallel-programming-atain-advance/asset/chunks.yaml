    Introduction to Thread Local Storage


    Thread local storage (TLS) is a programming construct that allows data to be scoped
    per thread. In multi-threaded programs, TLS provides each thread with its own
    separate instance of a variable. This is particularly useful in concurrent programming
    where data consistency and isolation between threads are necessary.


    The `thread_local` keyword in C++ is used to declare thread-local variables. Each
    thread has its own instance of a `thread_local` variable, which is created when
    the thread begins and destroyed when the thread ends. This allows threads to maintain
    independent states without requiring synchronization mechanisms such as mutexes.


    Use Cases for Thread Local Storage


    1\. Maintaining Independent Thread State: `thread_local` is useful for scenarios
    where each thread needs to maintain its own state independently of other threads.
    For example, in logging, each thread might need its own log buffer.


    2\. Performance Optimization: Since `thread_local` variables do not require locking
    mechanisms, they can improve performance in multi-threaded applications by avoiding
    the overhead of mutexes.


    3\. Simplifying Code: Using `thread_local` can simplify code by avoiding the need
    for explicit management of thread-specific data structures.


    Basic Syntax and Usage


    Using `thread_local` in C++ is straightforward. The following example demonstrates
    its basic usage:


    ```cpp


    #include <iostream>


    #include <thread>


    thread_local int localVar = 0;


    void incrementLocalVar(int id) {


    localVar += 5;


    std::cout << "Thread " << id << ": " << localVar << std::endl;


    }


    int main() {


    std::thread t1(incrementLocalVar, 1);


    std::thread t2(incrementLocalVar, 2);


    t1.join();


    t2.join();


    return 0;


    }


    ```


    In this example:


    - `localVar` is declared as a `thread_local` variable.


    - Each thread has its own instance of `localVar`.


    - The value of `localVar` is modified independently in each thread.


