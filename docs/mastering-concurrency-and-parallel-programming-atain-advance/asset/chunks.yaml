    Condition variables allow threads to wait for certain conditions to be met. They
    work with mutexes to synchronize threads based on specific conditions.


    ```cpp


    #include <iostream>


    #include <thread>


    #include <mutex>


    #include <condition_variable>


    std::mutex mtx;


    std::condition_variable cv;


    bool ready = false;


    void printMessage(int id) {


    std::unique_lock<std::mutex> lock(mtx);


    cv.wait(lock, [] { return ready; });


    std::cout << "Thread " << id << " is running." << std::endl;


    }


    void setReady() {


    std::unique_lock<std::mutex> lock(mtx);


    ready = true;


    cv.notify_all();


    }


    int main() {


    std::thread t1(printMessage, 1);


    std::thread t2(printMessage, 2);


    std::this_thread::sleep_for(std::chrono::seconds(1));


    setReady();


    t1.join();


    t2.join();


    return 0;


    }


    ```


    In this example:


    - `std::condition_variable` `cv` is used to synchronize threads based on the `ready`
    condition.


    - Threads `t1` and `t2` wait until `ready` is set to `true` by the `setReady`
    function.


    Atomic Variables:


    Atomic variables provide a way to perform thread-safe operations on shared data
    without using explicit locks.


    ```cpp


    #include <iostream>


    #include <thread>


    #include <atomic>


    std::atomic<int> counter(0);


    void incrementCounter() {


    for (int i = 0; i < 1000; ++i) {


    ++counter;


    }


    }


    int main() {


    std::thread t1(incrementCounter);


    std::thread t2(incrementCounter);


    t1.join();


    t2.join();


    std::cout << "Final counter


    value: " << counter.load() << std::endl;


    return 0;


    }


    ```


    In this example:


    - `std::atomic<int>` `counter` is used to perform thread-safe increments without
    explicit locks.


    - Two threads increment the counter concurrently, demonstrating atomic operations.


    Best Practices for Multithreading with `std::thread`


    1\. Minimize Shared Data: Reduce the amount of shared data between threads to
    minimize the need for synchronization and avoid contention.


    2\. Use Synchronization Primitives: Utilize mutexes, condition variables, and
    atomic variables to ensure thread-safe access to shared resources.


    3\. Avoid Deadlocks: Be mindful of the order in which locks are acquired to prevent
    deadlocks. Use lock hierarchy or `std::lock` to manage multiple mutexes.


    4\. Join or Detach Threads: Always ensure that threads are either joined or detached
    before the program exits to avoid undefined behavior.


    5\. Monitor Performance: Use profiling tools to monitor thread performance and
    identify bottlenecks or contention points.


    6\. Handle Exceptions: Ensure that exceptions in threads are handled appropriately
    to prevent program crashes. Use try-catch blocks within thread functions.


    Creating and managing threads in C++ using `std::thread` provides a powerful way
    to write concurrent programs. By understanding the basic syntax, callable objects,
    thread management techniques, and synchronization mechanisms, you can effectively
    leverage multithreading to improve the performance and responsiveness of your
    applications. Following best practices for multithreading will help you avoid
    common pitfalls and create robust, efficient, and maintainable concurrent programs.


