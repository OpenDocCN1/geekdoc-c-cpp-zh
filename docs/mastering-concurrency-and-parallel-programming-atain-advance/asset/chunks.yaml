    \  t1.join();\n  t2.join();\n  std::cout << \"Final counter value: \" << counter.load()\
    \ << std::endl;\n  return 0;\n}\n```\n\nIn this example:\n- `std::atomic<int>`\
    \ `counter` is used to perform thread-safe increments without explicit locks.\n\
    - Two threads increment the counter concurrently.\n\n## Best Practices for Multithreading\
    \ with `std::thread`\n\n1. **Minimize Shared Data**: Reduce the amount of shared\
    \ data between threads to minimize the need for synchronization and avoid contention.\n\
    2. **Use Synchronization Primitives**: Utilize mutexes, condition variables, and\
    \ atomic variables to ensure thread-safe access to shared resources.\n3. **Avoid\
    \ Deadlocks**: Be mindful of the order in which locks are acquired to prevent\
    \ deadlocks. Use lock hierarchy or `std::lock` to manage multiple mutexes.\n4.\
    \ **Join or Detach Threads**: Always ensure that threads are either joined or\
    \ detached before the program exits to avoid undefined behavior.\n5. **Monitor\
    \ Performance**: Use profiling tools to monitor thread performance and identify\
    \ bottlenecks or contention points.\n6. **Handle Exceptions**: Ensure that exceptions\
    \ in threads are handled appropriately to prevent program crashes. Use try-catch\
    \ blocks within thread functions.\n"
