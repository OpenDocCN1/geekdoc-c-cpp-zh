    \ head.load()) {\n                if (old_head == last_tail) {\n             \
    \       if (next == nullptr) return std::shared_ptr<T>();\n                  \
    \  tail.compare_exchange_weak(last_tail, next);\n                } else {\n  \
    \                  std::shared_ptr<T> res = next->data;\n                    if\
