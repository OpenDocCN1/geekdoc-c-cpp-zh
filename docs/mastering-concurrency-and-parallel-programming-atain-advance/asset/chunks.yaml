    \ `computeSquare` 函数，并通过 `future` 获取结果。\n\n# 高级特性与用法模式\n\n1. **延迟执行**：默认情况下，`std::async`\
    \ 可能会异步运行函数，也可以在对 future 运行 `get` 或 `wait` 时才延迟执行。这种行为可以通过 `std::launch` 策略控制。\n\
    \n```cpp\n#include <iostream>\n#include <future>\n#include <thread>\n\nint computeSquare(int\
    \ x) {\n    std::this_thread::sleep_for(std::chrono::seconds(2)); // 模拟长时间计算\n\
    \    return x * x;\n}\n\nint main() {\n    auto futureResult = std::async(std::launch::deferred,\
    \ computeSquare, 5);\n    std::cout << \"Future created. Calling get...\" << std::endl;\n\
