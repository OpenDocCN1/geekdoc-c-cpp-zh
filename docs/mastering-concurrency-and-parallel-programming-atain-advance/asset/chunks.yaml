    \ 函数加 1，且该操作是并行应用的。\n- 使用 `std::execution::par` 的 `std::for_each` 确保函数在整个数据集上并发应用，从而可能减少处理大型数据集所需的时间。\n\
    \n### 优势与注意事项\n\n并行 `std::for_each` 对于本质上相互独立且不需要元素间进行同步的操作非常有效。它通过将工作负载分布到多个处理器上，显著降低了时间复杂度。然而，开发者必须确保所调用的函数不会引入数据竞态，也不会也不会在没有适当同步机制的情况下访问共享数据。\n\
    \n## 底层原理：并行算法如何工作\n\n理解并行算法的内部工作机制对于旨在优化应用程序性能的开发者来说至关重要。并行算法利用多线程和其他并发技术，将任务分解为较小的、独立的工作单元，这些单元可以同时执行。\n\
    \n#### 1. 任务分解\n\n任何并行算法的第一步都是任务分解。这个过程涉及将一个大问题分解为更小的、独立的子任务，以便能够并发执行。\n\n###\
    \ 示例：并行 `std::sort`\n\n考虑并行版本的 `std::sort`。该算法首先将输入数据划分为较小的块，每个块都可以独立地排序。\n\n\
    - **初始划分**：输入数组或 vector 被拆分为多个子数组。这些子数组的大小和数量取决于可用硬件资源，例如处理器核心的数量。\n- **递归排序**：然后使用递归分治法（如快速排序或归并排序）对每个子数组进行独立排序。\n\
    - **合并阶段**：在对子数组进行排序后，将它们合并在一起以形成排序后的输出。合并阶段本身也可以被并行化。\n\n### 代码示例\n\n这是一个关于并行快速排序可能如何工作的简化示例：\n\
