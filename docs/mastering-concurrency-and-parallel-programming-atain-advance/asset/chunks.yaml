    the rest of the program''s execution. This is crucial when the main thread (or
    any other thread) needs to wait for results from worker threads or when it is
    important to ensure that all threads complete before the program exits.


    How to Join a Thread:


    The `join()` method of the `std::thread` class is used to join a thread. Here''s
    a basic example:


    ```cpp


    #include <thread>


    #include <iostream>


    void worker() {


    std::cout << "Processing..." << std::endl;


    // Simulate work


    std::this_thread::sleep_for(std::chrono::seconds(1));


    }


    int main() {


    std::thread t(worker);


    std::cout << "Main thread continues to run." << std::endl;


    t.join();  // Wait for the worker thread to finish


    std::cout << "Worker thread has finished execution." << std::endl;


    return 0;


    }


    ```


    In this example, the main thread spawns a worker thread that simulates some work
    by sleeping for one second. The `join()` method is called on the thread object
    `t`, which blocks the main thread until the worker thread completes its execution.
    This ensures that the main thread does not exit prematurely, allowing the worker
    thread to finish its task.


