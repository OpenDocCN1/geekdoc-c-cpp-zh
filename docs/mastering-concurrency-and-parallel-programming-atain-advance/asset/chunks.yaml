- fmt: "\nThe `std::for_each` algorithm is another powerful tool that applies a function\
    \ to a range of elements. This capability is particularly useful in scenarios\
    \ where you need to execute a function on each element of a container independently,\
    \ making it a perfect candidate for parallelization.\n\n### Example: Using Parallel\
