    \n2. **C++17 中的读写锁**：在 C++17 中，`std::shared_mutex` 和 `std::shared_lock` 为读写锁提供了内置支持，简化了实现。\n\
    \n```cpp\n#include <shared_mutex>\n#include <thread>\n#include <vector>\n#include\
    \ <iostream>\n\nstd::shared_mutex rwLock;\n\nvoid reader(int id) {\n    std::shared_lock<std::shared_mutex>\
