    added is the first to be removed. Implementing a thread-safe queue involves ensuring
    that `push` (enqueue) and `pop` (dequeue) operations are thread-safe.


    Implementation Using Mutex and Condition Variables


    Condition variables can be used in conjunction with a mutex to handle situations
    where threads need to wait for the queue to become non-empty.


    ```cpp


    #include <iostream>


    #include <queue>


    #include <mutex>


    #include <condition_variable>


    #include <thread>


    #include <vector>


    template<typename T>


    class ThreadSafeQueue {


    private:


    std::queue<T> queue;


    mutable std::mutex mtx;


    std::condition_variable cv;


    public:


    void push(T value) {


    std::lock_guard<std::mutex> lock(mtx);


    queue.push(value);


    cv.notify_one();


    }


    bool pop(T& result) {


    std::unique_lock<std::mutex> lock(mtx);


    cv.wait(lock, [this]() { return !queue.empty(); });


    result = queue.front();


    queue.pop();


    return true;


    }


    bool empty() const {


    std::lock_guard<std::mutex> lock(mtx);


    return queue.empty();


    }


    };


    int main() {


    ThreadSafeQueue<int> queue;


    auto pushTask = [&queue]() {


    for (int i = 0; i < 10; ++i) {


    queue.push(i);


    }


    };


    auto popTask = [&queue]() {


    int value;


    while (queue.pop(value)) {


    std::cout << "Popped: " << value << std::endl;


    }


    };


    std::thread t1(pushTask);


    std::thread t2(popTask);


    t1.join();


    t2.join();


    return 0;


    }


    ```


    In this example:


    - `std::condition_variable` is used to wait for the queue to become non-empty
    in the `pop` method.


    - `std::unique_lock` is used with the condition variable to allow the `pop` method
    to release the lock while waiting and reacquire it when notified.


    Advanced Thread-Safe Stack and Queue


    For advanced scenarios, lock-free data structures can be implemented using atomic
    operations. Lock-free structures can provide better performance and scalability
    by reducing contention among threads.


    Lock-Free Stack


    A lock-free stack can be implemented using atomic operations and the `std::atomic`
    template. This approach avoids the overhead of locking and can improve performance
    in highly concurrent environments.


    ```cpp


    #include <iostream>


    #include <atomic>


    #include <memory>


    #include <thread>


    #include <vector>


    template<typename T>


    class LockFreeStack {


    private:


    struct Node {


    T data;


    std::shared_ptr<Node> next;


    Node(T const& data) : data(data) {}


    };


    std::shared_ptr<Node> head;


    public:


    void push(T const& value) {


    std::shared_ptr<Node> new_node = std::make_shared<Node>(value);


    new_node->next = head.load();


    while (!std::atomic_compare_exchange_weak(&head, &new_node->next, new_node)) {}


    }


    std::shared_ptr<T> pop() {


    std::shared_ptr<Node> old_head = head.load();


    while (old_head && !std::atomic_compare_exchange_weak(&head, &old_head, old_head->next))
    {}


    return old_head ? std::make_shared<T>(old_head->data) : std::shared_ptr<T>();


    }


    };


    int main() {


    LockFreeStack<int> stack;


    auto pushTask = [&stack]() {


    for (int i = 0; i < 10; ++i) {


    stack.push(i);


    }


    };


    auto popTask = [&stack]() {


    for (int i = 0; i < 10; ++i) {


    auto value = stack.pop();


    if (value) {


    std::cout << "Popped: " << *value << std::endl;


    }


    }


    };


    std::thread t1(pushTask);


    std::thread t2(popTask);


    t1.join();


    t2.join();


    return 0;


    }


    ```


    In this example:


    - `std::atomic` operations are used to manage the stack head, ensuring thread-safe
    push and pop operations without locks.


    Lock-Free Queue


    A lock-free queue can be more complex to implement than a lock-free stack. The
    Michael-Scott queue is a well-known lock-free queue algorithm that uses atomic
    operations to ensure thread safety.


    ```cpp


    #include <iostream>


    #include <atomic>


    #include <memory>


    #include <thread>


    #include <vector>


    template<typename T>


    class LockFreeQueue {


    private:


    struct Node {


    std::shared_ptr<T> data;


    std::atomic<Node*> next;


    Node() : next(nullptr) {}


    Node(T const& value) : data(std::make_shared<T>(value)), next(nullptr) {}


    };


    std::atomic<Node*> head;


    std::atomic<Node*> tail;


    public:


    LockFreeQueue() : head(new Node), tail(head.load()) {}


    ~LockFreeQueue() {


    while (Node* const old_head = head.load()) {


    head.store(old_head->next);


    delete old_head;


    }


    }


    void push(T const& value) {


    Node* new_node = new Node(value);


    Node* old_tail = tail.load();


    old_tail->next.store(new_node);


    tail.store(new_node);


    }


    std::shared_ptr<T> pop() {


    Node* old_head = head.load();


    if (old_head == tail.load()) {


    return std::shared_ptr<T>();


    }


    std::shared_ptr<T> result = old_head->next.load()->data;


    head.store(old_head->next);


    delete old_head;


    return result;


    }


    };


    int main() {


    LockFreeQueue<int> queue;


    auto pushTask = [&queue]() {


    for (int i = 0; i < 10; ++i) {


    queue.push(i);


    }


    };


    auto popTask = [&queue]() {


    for (int i = 0; i < 10; ++i) {


    auto value = queue.pop();


    if (value) {


    std::cout << "Popped: " << *value << std::endl;


    }


    }


    };


    std::thread t1(pushTask);


    std::thread t2(popTask);


    t1.join();


    t2.join();


    return 0;


    }


    ```


    In this example:


    - The queue uses atomic pointers for the head and tail nodes to ensure thread
    safety.


    - The `push` method adds new nodes to the tail, while the `pop` method removes
    nodes from the head.


    Thread-safe stacks and queues are fundamental data structures in concurrent programming,
    providing safe and efficient ways to handle shared data. Using mutexes and condition
    variables, developers can implement basic thread-safe versions of these structures.
    For advanced scenarios, lock-free implementations using atomic operations can
    offer better performance and scalability. By understanding and employing these
    techniques, developers can build robust and high-performance concurrent applications.


    ## - Designing a thread-safe list


    Designing a thread-safe list involves creating a data structure that can be safely
    accessed and modified by multiple threads simultaneously. This section provides
    a step-by-step guide to implementing a thread-safe list in C++.


    Step 1: Basic Structure


    Start by defining the basic structure of a linked list, including the node and
    the list class.


    ```cpp


    #include <iostream>


    #include <memory>


    #include <mutex>


    template<typename T>


    class ThreadSafeList {


    private:


    struct Node {


    T data;


    std::shared_ptr<Node> next;


    std::mutex node_mutex;


    Node(T value) : data(value), next(nullptr) {}


    };


    std::shared_ptr<Node> head;


    public:


    ThreadSafeList() : head(nullptr) {}


    void insert(T value) {


    std::shared_ptr<Node> new_node = std::make_shared<Node>(value);


    {


    std::lock_guard<std::mutex> lock(head_mutex);


    new_node->next = head;


    head = new_node;


    }


    }


    bool remove(T value) {


    std::lock_guard<std::mutex> lock(head_mutex);


    std::shared_ptr<Node> current = head;


    std::shared_ptr<Node> previous = nullptr;


    while (current) {


    if (current->data == value) {


    if (previous) {


    previous->next = current->next;


    } else {


    head = current->next;


    }


    return true;


    }


    previous = current;


    current = current->next;


    }


    return false;


    }


    void print() {


    std::shared_ptr<Node> current = head;


    while (current) {


    std::cout << current->data << " -> ";


    current = current->next;


    }


    std::cout << "nullptr" << std::endl;


    }


    };


    int main() {


    ThreadSafeList<int> list;


    list.insert(1);


    list.insert(2);


    list.insert(3);


    list.print();


    list.remove(2);


    list.print();


    return 0;


    }


    ```


    In this basic implementation:


    - Each node in the list contains a `data` field, a `next` pointer, and a `node_mutex`
    to protect individual node modifications.


    - The `insert` method adds new nodes to the head of the list.


    - The `remove` method searches for and removes nodes with the specified value.


    Step 2: Thread-Safe Operations


    Ensure that list operations are thread-safe by using mutexes to protect access
    to shared resources.


    Inserting Elements


    Use a mutex to protect the entire list during the insertion of new elements.'
