    \ <thread>\nint counter = 0;\n\nvoid increment() {\n    for (int i = 0; i < 100;\
    \ ++i) {\n        counter++;\n    }\n}\n\nint main() {\n    std::thread t1(increment);\n\
    \    std::thread t2(increment);\n    t1.join();\n    t2.join();\n    std::cout\
    \ << \"Final counter value: \" << counter << std::endl;\n    return 0;\n}\n```\n\
    \nIn this example, the `counter` variable is shared between two threads. Ideally,\
    \ the final counter should be 2000. However, due to the race condition, the actual\
    \ result can be less than 2000.\n\n### Understanding Data Races\n\nA data race\
    \ is a specific type of race condition where two or more threads concurrently\
    \ access data, and at least one of the accesses is a write. Data races can lead\
    \ to undefined behavior because the outcome depends on the non-deterministic timing\
    \ of thread execution.\n\n#### Example of a Races\n\nIn the previous example,\
    \ the data race occurs because both threads are modifying the `counter`. The increment\
    \ operation `++counter` involves multiple steps (reading, incrementing, and writing),\
