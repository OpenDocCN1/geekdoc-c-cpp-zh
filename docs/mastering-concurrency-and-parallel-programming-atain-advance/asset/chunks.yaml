    在现代 C++ 编程中，特别是在并发和并行应用中，`future`、`promise` 和 `async` 函数起着至关重要的作用。它们提供了一种管理异步操作的标准方法，允许开发者编写可以处理并行运行任务的代码，而不会被复杂的线程管理所困扰。\n\
