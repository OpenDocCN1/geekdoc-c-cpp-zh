    Passing Multiple Arguments


    When passing multiple arguments to a thread, ensure each argument is appropriately
    handled, whether by value, by reference, or through other means.


    Example:


    ```cpp


    #include <iostream>


    #include <thread>


    #include <vector>


    void processData(int id, const std::vector<int>& data) {


