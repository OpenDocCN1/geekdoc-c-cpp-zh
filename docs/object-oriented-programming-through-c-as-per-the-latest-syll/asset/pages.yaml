  md: "This approach is also acceptable in C++. Note that the call-by-reference method\
    \ is neater in the approach.\n\n# 4.5 RETURN BY REFERENCE\n\nA function can also\
    \ return a reference. Consider the following function:\n\n```\nint & max(int &x,\
    \ int &y)\n{\n    if (x > y)\n        return x;\n    else\n        return y;\n\
    }\n```\n\nSince the return type of max() is int &, the function reference to x\
