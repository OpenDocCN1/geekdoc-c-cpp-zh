    # # 15.6 STEPS IN OBJECT-ORIENTED ANALYSIS


    Object-oriented analysis provides us with a simple, yet powerful, mechanism for
    identifying objects, the building block of the software to be developed. The analysis
    is basically concerned with the decomposition of a problem into its component
    parts and establishing a logical model to describe the system functions.


    The object-oriented analysis OOA approach consists of the following steps:


    +   1. Understanding the problem

    2. Drawing the specifications of requirements of the user and the software

    3. Identifying the objects and their attributes

    4. Identifying the services that each object is expected to provide (interface)

    5. Establishing the inter-connections (collaborations) between the objects in
    terms of services required and services rendered


    Although we have shown the above tasks as a series of discrete steps, the last
    three activities are carried out inter-dependently as shown in Fig. 15.15.


    ![](img/c8042bb2c98f96c5758608865c161311_474_1.png)


    **Fig. 15.15** Activities of object-oriented analysis'
  merge: -1
  pgno: 474
- img_proc: true
  md: '# Problem Understanding


    The first step in the analysis process is to understand the problem of the user.
    The problem statement should be refined and redefined in terms of computer engineering
    that could suggest a computer-based solution. The problem statement should be
    stated, as far as possible, in a single, grammatically correct sentence. This
    will enable the software engineers to have a highly focussed attention on the
    solution of the problem. The problem statement provides the basis for drawing
    the requirements of both the user and the software.


    # Requirements Specification


    Once the problem is clearly defined, the next step is to understand what the proposed
    system is required to do. It is important at this stage to generate a list of
    user requirements. A clear understanding should exist between the user and the
    developer of what is required. Based on the user requirements, the specifications
    for the software should be drawn. The developer should state clearly


    +   * What outputs are required.

    * What processes are involved to produce these outputs.

    * What inputs are necessary.

    * What resources are required.


    These specifications often serve as a reference to test the final product for
    its performance of the intended tasks.


    # Identification of Objects


    Objects can be identified in terms of the real-world objects as well as the abstract
    objects. Therefore, the best place to look for objects is the application itself.
    The application may be analyzed by using one of the following approaches:


    +   1. Data flow diagrams (DFD)

    2. Textual analysis (TA)


    # Data Flow Diagram


    The application can be represented in the form of a data flow diagram indicating
    how the data moves from one point to another in the system. The boxes and data
    stores in the data flow diagram are good candidates for the objects. The process
    bubbles correspond to the processes. For example, Figure 15.16 illustrates a typical
    data flow diagram. It is also known as a data flow graph or a bubble chart.


    A DFD can be used to represent a system at any level of abstraction. For example,
    the DFD shown in Fig. 15.16 may be expanded to include more information (such
    as payment details) or de-sensed in Fig. 15.7 to show only one bubble.


    # Textual Analysis


    This approach is based on the textual description of the problem or proposed solution.
    The description may be of one or two sentences or one or two paragraphs depending
    on the type and complexity of the problem. The nouns are good indicators of the
    objects. The names can further be classified as proper nouns, common nouns, and
    mass or abstract nouns. Table 15.3 shows the various types of nouns and their
    meaning.'
