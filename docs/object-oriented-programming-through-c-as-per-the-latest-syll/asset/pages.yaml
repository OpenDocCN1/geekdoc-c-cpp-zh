  md: "C++ incorporates all these extensions in another user-defined type known as\
    \ class. There is very little syntactic difference between structures and classes\
    \ in C++ and, therefore, they can be used interchangeably with minor modifications.\
    \ Since class is a specially introduced data type in C++, most of the C++ programmers\
    \ intend to use structures for holding only data, and classes to hold both the\
    \ data and functions. Therefore, we will not discuss structures further.\n\n>\
    \ Note The only difference between a structure and a class in C++ is that, by\
    \ default, the members of a class are private, while, by default, the members\
    \ of a structure are public.\n\n# 5.3 SPECIFYING A CLASS\n\nA class is a way to\
    \ bind the data and its associated functions together. It allows the data (and\
    \ functions) to be hidden, if necessary, from external use. When defining a class,\
    \ we are creating a new abstract data type that can be treated like any other\
    \ built-in data type. Generally, a class specification has two parts:\n\n+   -\
    \ Class declaration\n- Class function definitions\n\nThe class declaration describes\
    \ the type and scope of its members. The class function definitions describe how\
    \ the class functions are implemented.\n\nThe general form of a class declaration\n\
    \n```\nclass class_name {\n  private:\n    variable declarations;\n    function\
    \ declarations;\n  public:\n    variable declarations;\n    function declarations;\n\
    }\n```\n\nThe class declaration is similar to a struct declaration. The keyword\
    \ class specifies, what that follows an abstract data type of class_name. A body\
    \ of a class is enclosed within braces and terminated by a semicolon. The class\
    \ body contains the declaration of variables and functions. These functions and\
    \ variables are collectively grouped under two sections, namely private and public\
    \ to denote which of the members are private and which of them are public. The\
    \ keywords private and public are known as visibility labels. These keywords are\
    \ followed by a colon.\n\nThe class members that have been declared as private\
    \ can be accessed only from within the class. The data hiding (using private declaration)\
    \ is the key feature of object-oriented programming. The use of the keyword private\
    \ is optional. By default, the members of a class are private. If both the labels\
    \ are missing, then, by default, all the members are private. Such a class is\
    \ completely hidden from the outside world and does not serve any purpose."
