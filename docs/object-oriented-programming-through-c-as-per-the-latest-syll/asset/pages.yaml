  md: "# Operator Overloading and Type Conversions\n\nThe output of Program 7.2 would\
    \ be:\n\n```\nC1 = 2.5 + j3.5\nC2 = 1.6 + j2.7\nC3 = 4.1 + j6.2\n```\n\nNote Let\
    \ us have a look at the function operator+() and see how the operator overloading\
    \ is implemented.\n\n```\ncomplex complex :: operator+(complex c)\n{\n    complex\
    \ temp;\n    temp.x = x + c.x;\n    temp.y = y + c.y;\n    return(temp);\n}\n\
    ```\n\nWe should note the following features of this function:\n\n+   1. It receives\
    \ only one complex type argument explicitly.\n2. It returns a complex type value.\n\
    3. It is a member function of complex.\n\nThe function is expected to add two\
    \ complex values and return a complex value as the result but receives only one\
    \ value as argument. Where does the other value come from? Now let us look at\
    \ the statement that this invokes\n\n```\nC3 = C1 + C2; // invokes operator+()\
    \ function\n```\n\nWe know that a member function can be invoked only by an object\
    \ of the same class. Here, the object C1 takes the responsibility of invoking\
    \ the function and C2 plays the role of an argument that is passed to the function.\
    \ The above invocation statement is equivalent to\n\n```\nC3 = C1.operator+(C2);\
    \ // usual function call syntax\n```\n\nTherefore, in the operator+() function,\
    \ the data members of C1 are accessed directly and the data members of C2 (that\
    \ is passed as argument) are accessed using the dot operator. Thus, both the objects\
    \ are available for the function. For, in the statement\n\n```\ntemp.x = x + c.x;\n\
    ```\n\nc.x refers to object C2 and x refers to object C1.temp.x is the real part\
    \ of temp that has been created specially to hold the results of addition of C1\
    \ and C2. The function returns the complex to be assigned to C3. Figure 7.1 shows\
    \ how this is implemented.\n\nAs a rule, in overloading of binary operators, the\
    \ left-hand operand is used to invoke the operator function and the right-hand\
    \ operand is passed as an argument.\n\nWe can avoid the creation of the temp object\
