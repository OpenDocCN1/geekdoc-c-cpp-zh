    \n# 8.10 ABSTRACT CLASSES\n\nAn abstract class is one that is not used to create\
    \ objects. An abstract class is designed only to act as a base class (to be inherited\
    \ by other classes). It is a design concept in program development and provides\
    \ a base upon which others may be built.\n\nIn real programming scenarios, the\
    \ concept of abstract base classes holds great significance. They are deliberately\
    \ used in a program for creating derived classes and are not meant for creating\
    \ instance objects as demonstrated in student class in Program 8.6. The concept\
    \ can be further explained through an example of abstract base class vehicle which\
    \ may be declared in a program for deriving LMV (light motor vehicle), HMV (heavy\
    \ motor vehicle) and TW (two wheeler) derived classes. A pure virtual function\
    \ spec() may set the specifications of LMV as per its four wheels and smaller\
    \ engine that may have more wheels and relatively larger engine.\n\nWhile the\
    \ abstract base class vehicle may look optional, it holds significance as far\
    \ as logical design is considered. Also, we may include some of the common characteristics\
    \ of all of the derived classes in the abstract base class itself. For example,\
    \ mileage, speed, rpm, etc., are some of the characteristics that are common across\
    \ all derived classes of the vehicle base class. However, one must never forget\
    \ the fact that a class can only be considered an abstract class if it has at\
    \ least one pure virtual function.\n\nThe general form of using abstract class\
    \ is shown below:\n\n```\nclass vehicle //abstract base class\n{\n  private:\n\
    \    data-type d1;\n    data-type d2;\n\n  public:\n    virtual void spec()=0;\
    \ //pure virtual function\n};\nclass LMV : public vehicle\n{\n  public:\n    void\
    \ spec()\n```"
