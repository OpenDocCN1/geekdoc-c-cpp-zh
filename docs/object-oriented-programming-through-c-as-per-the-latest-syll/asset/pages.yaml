  md: '# Linker Errors


    It is also possible to have errors during the linking process. For instance, you
    may not have included the file iostream.h. The program will compile correctly,
    but will fail to link. It will display an error message in the linking window.
    Press any key to see the message in the message window.


    # Run-time Errors


    Remember compiling and linking successfully does not always guarantee the correct
    results. Sometimes, the results may be wrong due to logical errors or to errors
    such as stack overflow. System might display the errors such as null pointer assignment.
    You must consult the manual for the meaning of such errors and modify the program
    accordingly.


    # C.11 HANDLING AN EXISTING FILE


    After saving your file to disk, your file has become a part of the list of files
    stored in the disk. How do we retrieve such files and execute the programs written
    to them? You can do this in two ways:


    +   1. Under DOS prompt

    2. Under IDE


    Under DOS prompt, you can invoke as follows:


    ```

    C > TC TEST.CPP

    ```


    Remember to type the complete and correct name of the file with .cpp extension.
    This first command brings Turbo C++ IDE and then loads edit window containing
    the file test.cpp.


    If you are under IDE, then select open from the file menu. This will prompt you
    for a file name and then loads the file as you respond with the correct file name.
    Now you can edit the program, compile it and execute it as before.


    # C.12 SOME SHORTCUTS


    It is possible to combine the two steps of compiling and linking into one. This
    can be achieved by Make EXE file from the compile dialogue window.


    We can shorten the process by combining the execution step as well as with the
    above step. In this case, we must select Run from the run dialogue window. This
    causes the program to be compiled, linked and executed.


    Many common operations can be activated directly without going through the main
    menu, again and again. Turbo C++ supports what are known as hot keys to provide
    these shortcuts. A list of hot keys and their functions are given in Table C.2.
    We can use them whenever necessary.


    | Hot Key | Meaning |

    |---|---|

    | F1 | Activates the online Help system. |

    | F2 | Saves the file currently being edited. |

    | F3 | Loads a file. |'
