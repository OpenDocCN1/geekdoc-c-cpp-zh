    # 1.6 BENEFITS OF OOP


    OOP offers several benefits to the program designer and the user. Object-orientation
    contributes to the solution of many problems associated with the development and
    quality of software products. The new technology promises greater productivity,
    better quality of software and lesser maintenance cost. The principal advantages
    are:


    +   * Through inheritance, we can eliminate redundant code and extend the use
    of classes.

    * We can build programs from the standard working modules that communicate with
    one another, rather than having to start the code from scratch. This leads to
    saving of development time and higher productivity.

    * The principle of data hiding helps the programmer to build secure programs that
    cannot be invaded by code in other parts of the program.

    * It is possible to have multiple instances of an object to co-exist without any
    interference.

    * It is possible to map objects in the project domain to those in the program.

    * It is easy to partition the work in a project based on objects.

    * The data-centered design approach enables us to capture more details of a model
    in implementable form.

    * Object-oriented systems can be easily upgraded from small to large systems.

    * Message passing techniques for communication between objects makes the interface
    descriptions with external systems much simpler.

    * Software complexity can be easily managed.


    While it is possible to incorporate all these features in an object-oriented system,
    their importance depends on the type of the object and the preference of the programmer.
    There are a number of issues that need to be tackled to reuse. For instance, object
    libraries must be available for reuse. The technology is still developing and
    current products may be supersed quickly. Strict controls and protocols need to
    be developed if reuse is not to be compromised.


    Developing a software that is easy to use makes it hard to build. It is hoped
    that the object-oriented programming tools would help manage this problem.'
