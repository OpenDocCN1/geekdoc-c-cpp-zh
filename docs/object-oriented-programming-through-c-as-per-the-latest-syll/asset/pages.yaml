  md: '# C.1 INTRODUCTION


    All programs in this book were developed and run under Turbo C++ compiler Version
    3.0, in an MS-DOS environment on an IBM PC compatible computer. We shall discuss
    briefly, in this appendix, the creation and execution of C++ programs under Turbo
    C++ system.


    # C.2 CREATION AND EXECUTION OF PROGRAMS


    Executing a computer program written in any high-level language involves several
    steps, as listed below:


    +   1. Develop the program (source code).

    2. Select a suitable file name under which you would like to store the program.

    3. Create the program in the computer and save it under the filename you have
    decided. This file is known as source code file.

    4. Compile the source code. The file containing the translated code is called
    object code file. If there are any errors, debug them and compile the program
    again.

    5. Link the object code with other library code that are required for execution.
    The resulting code is called the executable code. If there are errors in linking,
    correct them compile the program again.

    6. Run the executable code and obtain the results, if there are no errors.

    7. Debug the program, if errors are found in the output.

    8. Go to Step 4 and repeat the process again.


    These steps are illustrated in Fig. C.1. The exact steps depend upon the program
    environment and the compiler used. But, they will resemble the steps described
    above.


    Turbo C++ and Borland C++ are the most popular C++ compilers. They provide ideal
    platforms for learning and developing C++ programs. In general, both Turbo C++
    and Borland C++ work the same way, except some additional features supported by
    Borland C++ which are outside the scope of our discussions. Therefore, whatever
    we discuss about Turbo C++ applies to Borland C++ as well.'
