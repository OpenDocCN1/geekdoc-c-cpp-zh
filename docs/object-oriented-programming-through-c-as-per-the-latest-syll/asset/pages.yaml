  md: "# 436 Object Oriented Programming through C++\n\nThis approach becomes cumbersome\
    \ if the members of a namespace are frequently used. In such cases, we can use\
    \ a using directive to simplify their access. This can be done in ways:\n\n```\n\
    using namespace namespace_name; // using directive\nusing namespace_name::member_name;\
    \ // using declaration\n```\n\nIn the first form, all members declared within\
    \ the specified namespace may be accessed-out using qualification. In the second\
    \ form, we can access only the specified member in the program.\n\nExample:\n\n\
    ```\nusing namespace TestSpace;\nm = 100; // OK\ndisplay(200); // OK\n\nusing\
    \ TestSpace::m;\nm = 100; // OK\ndisplay(200); // Not ok, display not visible\n\
    ```\n\n# Nesting of Namespaces\n\nA namespace can be nested within another namespace.\
    \ Example:\n\n```\nnamespace NS1\n{\n    ....\n    ...\n    namespace NS2\n  \
    \  {\n        int m = 100;\n    }\n    ....\n}\n```\n\nTo access the variable\
    \ **m**, we must qualify the variable with both the enclosing namespace names.\
    \ The statement\n\n```\ncout << NS1::NS2::m;\n```\n\nwill display the value of\
    \ **m**. Alternatively, we can use\n\n```\nusing namespace NS1;\ncout << NS2::m;\n\
    ```\n\n# Unnamed Namespaces\n\nAn unnamed namespace is one that does not have\
    \ a name. Unnamed namespace members occupy global scope and are accessible in\
    \ all scopes following the declaration in the file. We can access them without\
    \ using any qualification."
