  md: "Classes and Objects\n\n153\n\n![](img/c8042bb2c98f96c5758608865c161311_169_0.png)\n\
    \n**Fig. 5.6** Accessing members of objects within a called function\n\n# 5.15\
    \ FRIENDLY FUNCTIONS\n\nWe have emphasizing throughout this chapter that the private\
    \ members cannot be accessed from outside the class. That is, a nonmember function\
    \ cannot have an access to the private data of a class. There could be a situation\
    \ where we would like two classes to share a particular function. For example,\
    \ consider a case where classes, **manager** and **scientist**, have been defined.\
    \ We would like to use a function `income_tax()` to operate on the objects of\
    \ both of these classes. In such situations, C++ allows the common function to\
    \ be made friendly with both the classes, allowing the function to have access\
    \ to the private data of these classes. Such a function need not be a member of\
    \ any of these classes.\n\nTo make an outside function \"friendly\" to a class,\
    \ we have to declare this function as a **friend** of the class as shown below:\n\
    \n```\nclass ABC\n{\npublic:\n    ...\n\n    friend void xyz(void); // declaration\n\
    \n};\n```\n\nThe function declaration should be preceded by the keyword **friend**.\
    \ The function is defined elsewhere in the program as a normal C++ function. The\
    \ function definition does not use either the keyword **friend** or the scope\
    \ operator ::. The functions that are declared with the keyword **friend** are\
    \ known as **friend functions**. A function can be declared in any number of classes.\
    \ A friend function, although not a member function, has full access rights to\
    \ the private members of the class.\n\nA friend function possesses special characteristics:\n\
    \n+   - It is not in the scope of the class to which it has been declared as **friend**.\n\
    - Since it is not in the scope of the class, it cannot be called using the object\
    \ of that class.\n- It can be invoked like a normal function without the help\
    \ of any object."
