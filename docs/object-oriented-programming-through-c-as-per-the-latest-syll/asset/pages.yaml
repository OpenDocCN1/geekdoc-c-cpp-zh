  md: '# Object Oriented Programming through C++


    Experience has also shown that the number of bugs that occur is related to the
    format of the program. The format should be such that it is easy to trace the
    flow of execution of statements. This would help not only in debugging but also
    in the review and maintenance of the program. One method of achieving the objective
    of an accurate, error-resistant and maintainable code is to use one or any combination
    of the following three control structures:


    +   1. Sequence structure (straight line)

    2. Selection structure (branching)

    3. Loop structure (iteration or repetition)


    Figure 3.4 shows how these structures are implemented using one-entry, one-exit
    concept, a popular approach used in modular programming.


    ![](img/c8042bb2c98f96c5758608865c161311_110_0.png)


    | (a) Sequence | (b) Selection | (c) Loop |

    |---|---|---|n**Fig. 3.4 Basic control structures**


    It is important to understand that all program processing can be coded by using
    only these three logic structures. The approach of using one or more of these
    basic control constructs in programming is known as structured programming, an
    important technique in software engineering.


    Using these basic constructs, we may represent a function structure in detail
    or in summary form as shown in Figs. 3.5 (a), (b) and (c).


    Like C, C++ also supports all the three basic control structures, and implements
    them using various control statements as shown in Fig. 3.6. This shows that C++
    combines the power of structured programming with the object-oriented paradigm.'
