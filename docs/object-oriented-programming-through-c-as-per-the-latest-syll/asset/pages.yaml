    \ points to object b\n```\n\nWe can make cptr point to the object d as:\ncptr\
    \ = &d; // cptr points to object d\n\nThis is perfectly valid with C++ as an object\
    \ derived from the class B. However, there is a problem with using cptr to access\
    \ the public members of the derived class D. Using cptr, we can access only members\
    \ which are inherited from B and not members originally belonging to D. If a member\
    \ of D has the same name as one of the members of B, then any reference to that\
    \ member by cptr will always access the base class member.\n\nAlthough C++ permits\
    \ a base pointer to any object derived from that base, the pointer cannot be directly\
    \ used to access all the members of the derived class. We may have to use another\
    \ pointer declared as pointer to the derived type.\nProgram 9.11 illustrates how\
