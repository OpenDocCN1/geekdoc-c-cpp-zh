  md: '# Object Oriented Programming through C++


    37. When a floating-point value is stored in an integer variable, the floating-point
    value is converted to an integer value by truncating its decimal value.


    38. The keyword const is used to define variables or objects that should not be
    modified.


    39. When writing a program that accepts input interactively, it is important that
    the program issues prompts to clarify the type and the form of the input.


    40. The compound assignment operators +=, -=, *=, %= perform an arithmetic operation
    on a variable and store the resulting back into the variable.


    41. C++ supports special operators, ++ and --, for incrementing and decrementing
    integral and floating-point objects.


    42. A logical expression evaluates true if the value of the expression is either
    a nonzero integer value or the bool value.


    43. A logical expression evaluates false if the value of the expression is integer
    zero or the bool value.


    44. The relational operators also produce logical values. The relational operators
    fall into two categories: equality and ordering.


    45. The equality operators == and != and the ordering <, <=, >, >= are defined
    for all fundamental and pointer types.


    46. If the statement has two forms. Both a logical expression is evaluated and
    if expression is true, an action is executed. In one of the forms, an action is
    also specified for, when the evaluated expression is false.


    47. The expression used to determine the course of action for a conditional or
    iterative construct is sometimes known as a test expression.


    48. The switch statement takes actions based on the value of an integral expression.
    The programmer specifies the case values of interest for that expression, and
    for each case the value desired for action is specified.


    49. Types defined by a programmer are known as user-defined or derived types.


    50. The enum statement is a method for organizing a collection of integral constants
    into a type.


    51. A loop is a group of statements whose actions are repeated while a logical
    expression evaluates to true.


    52. The while statement permits actions to be repeated while the logical expression
    is initially false, then the action of the construct is never executed; otherwise,
    the action is repeatedly executed until the test expression evaluates to false.


    53. The do statement is similar in nature to the while statement; however, its
    action is always executed at least once. This is because its test expression is
    evaluated only after its body is executed.


    54. The for statement is a generalization of the while construct that has a test
    expression, a one-time loop initialization and an increment section. All sections
    of a for statement are optional. In particular, if the test expression is omitted,
    then the value true is used instead.


    55. A typedef statement creates a new name for an existing type. Both the new
    and old names can be used in subsequent definitions.


    56. In C++, we can declare a variable as close as possible to its first use.


    57. The class describes the properties of a data type, and an object is an entity
    created according to that description.'
