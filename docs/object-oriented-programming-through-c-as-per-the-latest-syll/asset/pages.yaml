  md: '# Review of Problem Space Objects


    An exercise to review the objects identified in the problem space is undertaken
    as a first step in the design stage. The main objective of this review exercise
    is to refine the objects in their attributes and operations to identify other
    objects that are solution specific. Some guidelines might help the review process:


    +   1. If only one object is necessary for a service (operation), then it operates
    only on object.

    2. If two or more objects are required for an operation to occur, then it is necessary
    to identify which object''s private part should be known to the operation.

    3. If an operation requires knowledge of more than one type of objects, then the
    operation is not functionally cohesive and should be rejected.


    Applying these guidelines will help refine the services of the objects. Further,
    the redundant extraneous objects are removed, synonymous services are combined
    and the names of the operations (functions) are improved to clearly clear the
    kind of processing involved.


    # Class Dependencies


    Analysis of relationships between the classes is central to the structure of a
    system. Therefore, it is important to identify classes to represent the objects
    in the solution space and establish their relationships. The major relationships
    that are important in the context of design are:


    +   1. Inheritance relationships

    2. Containment relationships

    3. Use relationships


    Inheritance relationship is the highest relationship that can be represented in
    C++. It is a powerful way of representing a hierarchical relationship directly.
    The real appeal and power of the inheritance mechanism is that it allows us to
    reuse a class that is almost, not exactly, what we want and tailor the class in
    a way that it does not introduce any unwanted side effects into the rest of the
    class. We must review the attributes and operations of the classes and prepare
    a inheritance relationship table as shown in Table 15.5.


    Table 15.5 Inheritance relationship table


    | Class | Depends on |

    |---|---|

    | A | ... |

    | B | A |

    | C | A |

    | D | A |

    | B1 | B |

    | B2 | B |


    Containment relationship means the use of an object of a class as a member of
    another class. This is an alternative and complimentary technique to use the class
    inheritance. But, it is often a tricky issue to choose between the two techniques.
    Normally, if there is a need to override attributes or functions, then the inheritance
    is the best choice. On the other hand, if we want to represent a property by a
    variety of types, then the containment relationship is the right method to follow.
    Another place where we need to use an object as a member is when we need to pass
    an attribute of a class as an argument to the constructor of another class. The
    “another” class must have a member object'
  merge: -1
