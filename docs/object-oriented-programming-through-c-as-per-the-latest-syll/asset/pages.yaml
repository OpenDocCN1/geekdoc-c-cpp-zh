    \ is similar to the syntax for defining a class. The general form of namespace\
    \ is\n\n```\nnamespace namespace_name\n{\n    // Declaration of\n    // variables,\
    \ functions, classes, etc.\n}\n```\n\n> There is one difference between a class\
    \ definition and a namespace definition. The namespace is concluded with a closing\
    \ brace but no terminating semicolon.\n\nExample:\n\n```\nnamespace TestSpace\n\
    {\n    int m;\n    void display(int n)\n{\n        cout << n;\n    }\n}\\ No semicolon\
    \ here\n```\n\nHere, the variable m and the function display are inside the scope\
    \ defined by the TestSpace namespace. If we want to assign a value to m, we must\
