  md: "```\nstrcpy(A.name, \"John\");\nA.roll_number = 999;\nA.total_marks = 595.0;\n\
    Final_total = A.total_marks + 5;\n```\n\nStructures have arrays, pointers or structures\
    \ as members.\n\n# Limitations of a C Structure\n\nThe standard C does not allow\
    \ the struct type to be treated like built-in types. For example, consider the\
    \ following structure:\n\n```\nstruct complex\n{\n  float x;\n  float y;\n};\n\
    struct complex c1, c2, c3;\n```\n\nThe complex c1, c2, and c3 can easily be assigned\
    \ values using the dot operator, we cannot add two complex numbers or subtract\
    \ one from the other. For example,\n\n```\nc3 = c1 + c2;\n```\n\nis illegal in\
    \ C.\n\nAnother limitation of C structures is that they do not permit data hiding.\
    \ Structure members can be directly accessed by the structure variables by any\
    \ function anywhere in their scope. In other words, the structure members are\
    \ public members.\n\n# Extensions to Structures\n\nC++ supports all the features\
    \ of structures as defined in C. But C++ has expanded its capabilities to suit\
    \ its OOP philosophy. It attempts to bring the user-defined types as close as\
    \ possible to the built-in data types, and provides a facility to hide the data\
    \ which is one of the main principles of OOP. Inheritance, a mechanism by which\
    \ one can inherit characteristics from other types, is also supported by C++.\n\
    \nIn C++, the structure can have both variables and functions as members. It also\
    \ declare some of its members as 'private' so that they cannot be accessed directly\
    \ by the external functions.\n\nIn C++, the structure names are stand-alone and\
    \ can be used like any other type names. In other words, the keyword struct can\
    \ be omitted in the declaration of structure variables. For example, we can declare\
    \ the student variables As\n\n```\nstudent A; // C++ declaration\n```\n\nRemember,\
    \ this is an error in C."
