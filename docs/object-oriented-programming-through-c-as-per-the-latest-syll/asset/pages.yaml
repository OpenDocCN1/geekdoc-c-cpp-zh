    # Key Concepts


    | Software evolution | Procedure-oriented programming | Inheritance | Polymorphism
    | Dynamic binding | Message passing | Data abstraction | Encapsulation | Object-based
    languages | C with classes | C++ features | Main function | C++ comments | Output
    operator | Input operator | Header file | Return statement | Namespace | Variables
    | Cascading of operators | C++ program structure | Client-server model | Source
    file | Compilation | Linking |


    ![](img/c8042bb2c98f96c5758608865c161311_20_0.png)


    # 1.1 SOFTWARE CRISIS


    Developments in software technology continue to be dynamic. New tools and techniques
    are announced in quick succession. This has forced the software engineers and
    industry to continuously look for new approaches to software design and development,
    and they are becoming more and more critical in view of the increasing complexity
    of software systems as well as the competitive nature of the industry. These rapid
    advances appear to have created a situation of crisis within the industry. The
    following issues need to be addressed to this crisis:


    +   - How to represent real-life entities of problems in system design?

    - How to design systems with open interfaces?

    - How to ensure usability and extensibility of modules?

    - How to develop modules that are tolerant to any changes in future?

    - How to improve software productivity and decrease software cost?

    - How to improve the quality of software?

    - How to manage time schedules?

    - How to industrialize the software development process?


    Many software products are either not finished, not used, or else are delivered
    with major errors. Figure 1.1 shows the fate of the US defense projects undertaken
    in the 1970s.


    ![](img/c8042bb2c98f96c5758608865c161311_20_1.png)


    Fig. 1.1 The state of US defense projects (according to the US government)'
  merge: -1
