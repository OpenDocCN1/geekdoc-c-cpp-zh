    # Accessing Menu Items


    Before we proceed further, it is important to know how to access the menu items.
    There are two ways of accomplishing this:


    +   1. Using the mouse

    2. Using the keyboard


    # Mouse Actions


    Using the mouse for accessing an item is the most common approach in Windows programming.
    We can perform the following actions with the mouse:


    +   • Move the mouse pointer to a desired location by moving the mouse without
    pressing any button.

    • Click the left mouse button when the pointer is over the preferred option.


    # Keyboard Actions


    Though the use of mouse is must for Windows-based applications, the accessing
    can also be done through keyboard. Simultaneously activating the ALT key and the
    underscored letter of the menu item required will activate the corresponding pull-down
    menu. The underscored letter is known as hot key. Once a pull-down menu is displayed,
    using the down/up arrow keys can be highlighted and then pressing the ENTER key
    will activate that option.


    Some of the options in a pull-down menu can be activated by their key combinations
    against these options. For example, Ctrl+N is the hot key for the New Option in
    the File menu. Similarly by pressing Ctrl+S, a file can be saved without using
    pull-down menu. This shortcut approach can be used from anywhere within the Visual
    Workbench.


    ![](img/c8042bb2c98f96c5758608865c161311_535_0.png)


