    # Identification of Services


    Once the objects in the solution space have been identified, the next step is
    to identify a set of services that each object should offer. Services are identified
    by examining all the verbs and verb phrases in the problem description statement.
    Verbs which contain not actions or occurrences may be classified as shown in Table
    15.4.


    Table 15.4 Classification of verbs


    | Types of verb | Meaning | Examples |

    | :--- | :--- | :--- |

    | Doing verbs | operations | read , get, display, buy |

    | Being verbs | classifications | is an, belongs to |

    | Having verbs | composition | has an, is part of |

    | Compare verbs | operations | is less than, is equal to |

    | Stative verbs | invariance-condition | to be present, are owned |


    Doing verbs and compare verbs usually give rise to services (which we call functions
    in C++). Being verbs indicate the existence of the classification structure while
    having verbs give rise to the composition structures.


    # Establishing Interconnections


    This step identifies the services objects provide and receive. We may use an information
    flow diagram (IFD) or an entity-relationship (ER) diagram to enlist this information.
    Here, we must establish a correspondence between the services and the actual information
    (messages) that are being communicated.


    ![](img/c8042bb2c98f96c5758608865c161311_477_0.png)


    # 15.7 STEPS IN OBJECT-ORIENTED DESIGN


    Design is concerned with the mapping of objects in the problem space into objects
    in the solution space, creating an overall structure (architectural model) and
    computational models of the system. This fairly normally uses the bottom-up approach
    to build the structure of the system and the top-down functional decomposition
    approach to design the class functions that provide services. It is particularly
    important to construct structured hierarchies, to identify abstract classes, and
    to simplify the inter-object communications. Reusability of classes from the previous
    designs, classification of the objects into subsystems and determination of appropriate
    protocols are some of the considerations of the design stage. The object oriented
    design (OOD) approach may involve the following steps:


    +   1. Review of objects created in the analysis phase

    2. Specification of class dependencies

    3. Organization of class hierarchies

    4. Design of classes

    5. Design of member functions

    6. Design of driver program'
