    \ Containers | Sequence containers | Associative containers | Derived containers\
    \ | Algorithms | Iterators | Function object\n\n# 11.1 INTRODUCTION TO TEMPLATES\n\
    \nTemplates is one of the features added to C++ recently. It is a new concept\
    \ which enables us to define generic classes and functions that provides support\
    \ for generic programming. Generic programming is an approach where generic types\
    \ are used as parameters in algorithms so that they work for a variety of suitable\
    \ types and data structures.\n\nA template can be used to create a family of classes\
    \ or functions. For example, a template for an array class would enable us to\
    \ create arrays of various data types as int and float array. Similarly, we can\
    \ define a template for a function, mul(), that would help us create versions\
    \ of mul() using int, float and double types.\n\nA template can be considered\
    \ as a kind of macro. When an object of a specific type is defined for actual\
    \ use, the template definition for that class is substituted with the required\
    \ data type. Since a template is defined with a parameter that would be replaced\
    \ by a specified data type at the time of actual use of the class or function,\
    \ the templates are sometimes called parameterized classes or functions.\n\n#\
    \ 11.2 CLASS TEMPLATES\n\nConsider a vector class as follows:\n\n```\nclass vector\n\
    {\n    int *v;\n    int size;\npublic:\n    vector(int m) // create a null vector\n\
    \        v = new int[size = m];\n        for(int i=0; i<size; i++)\n         \
    \   v[i] = 0;\n    vector(int *a) // create a vector from an array\n    {\n}\n\
    ```"
