  md: '# PREFACE


    Object-Oriented Programming (OOP) has become the preferred programming approach
    by the software industries, as it offers a powerful way to cope with the complexity
    of real-world problems. Among the OOP languages today, C++ is by far the most
    widely used language.


    Since its creation by Bjarne Stroustrup in the early 1980s, C++ has undergone
    many changes and improvements. The language was standardized in 1998 by the American
    National Standards Institute (ANSI) and the International Standards Organization
    (ISO) by incorporating not only the new features but also the changes suggested
    by the user groups. The present edition completely follows the specifications
    of ANSI/ISO Standards.


    Object Oriented Programming with C++ is for programmers who wish to know all about
    the C++ language and object-oriented programming. It explains in a simple and
    easy-to-understand style the what, and how of object-oriented programming with
    C++. The book assumes that the readers are already familiar with C language, although
    she or he needs not be an expert programmer.


    The book provides numerous examples, illustrations and complete programs. The
    sample programs are meant to be both simple and educational. Wherever necessary,
    pictorial descriptions of concepts have been included to improve clarity and facilitate
    better understanding. The book also presents the concept of object-oriented approach
    and discusses important elements of object-oriented analysis and design of systems.


    # SALIENT FEATURES


    +   - Completely in tune with JNTU Kakinada syllabus regulation – 2013

    - Solution to previous year''s exam papers and model question papers for instructors

    - PowerPoint slides as web supplements for instructors

    - Simple and easy-to-understand language

    - Extended coverage to topics like Overloading, Abstract Classes, Typecasting,
    Dynamic Memory Allocation, Structures and Unions, and RTTI

    - Projects to enhance programming skills

    - Refreshed C++ proficiency test covering latest technical interview questions
    along with answers

    - Refreshed and enhanced pedagogy which includes over 500 pedagogical aids like
    programs, review questions, debugging exercise with answers, programming exercises,
    and special boxes with notes wherever relevant

    - Exhaustive Pedagogy

    - Solved Programs – 168

    - Review Questions – 130'
