  md: '# Key Concepts


    Errors and exceptions | Throwing mechanism | Multiple catching | Rethrow exceptions
    | Exception handling mechanism | Catching mechanism | Catching all exceptions
    | Restricting exceptions thrown


    # 12.1 INTRODUCTION


    We know that it is very rare that a program works correctly first time. It might
    have bugs. The two most common types of bugs are logic errors and syntactic errors.
    The logic errors occur due to poor understanding of the problem and solution procedure.
    The syntactic errors arise due to poor understanding of the language itself. We
    can detect these errors by exhaustive debugging and testing procedures.


    We often come across peculiar problems other than logic or syntax errors. They
    are known as exceptions. Exceptions are run time anomalies or unusual conditions
    that a program may encounter while executing. Anomalies might include conditions
    such as division by zero, access to an array outside of its bounds, or running
    out of memory or disk space. When a program encounters an exceptional condition,
    it is important that it is identified and dealt with effectively. ANSI C++ provides
    built-in features to detect and handle exceptions which are basically run-time
    errors.


    Exception handling was not part of the ANSI C++. It is a new feature added to
    ANSI C++. Today, almost all compilers support this feature. C++ exception handling
    provides a type-safe, integrated approach, for coping with the unpredictable problems
    that arise while executing a program.


    # 12.2 BASICS OF EXCEPTION HANDLING


    Exceptions are of two kinds, namely, synchronous exceptions and asynchronous exceptions.
    Errors such as ''out-of-range index'' and ''over-flow'' belong to the synchronous
    type exceptions. The errors that are caused by events beyond the control of the
    program (such as keyboard interrupts) are called asynchronous exceptions. The
    proposed exception handling mechanism in C++ is designed to handle only synchronous
    exceptions.


    The purpose of the exception handling mechanism is to provide means to detect
    and report an ''exceptional circumstance'' that appropriate action can be taken.
    The mechanism suggests a separate error handling code that performs the following
    tasks:


    +   - Find the problem (Hit the exception).

    - Inform that an error has occurred (Throw the exception).

    - Receive the error information (Catch the exception).

    - Take corrective actions (Handle the exception).'
