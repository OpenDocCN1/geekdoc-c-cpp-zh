    \ handler, the control goes to the statement immediately following the catch block.\n\
    \nDue to mismatch, if an exception is not caught, abnormal program termination\
    \ will occur. It is important to note that the catch block is simply skipped if\
    \ the catch statement does not catch an exception.\n\n# Multiple Catch Statements\n\
    \nIt is possible that program segment has more than one condition to throw an\
    \ exception. In such cases, we can associate more than one catch statement with\
    \ a try (much like the conditions in a switch statement) as shown below:\n\n```\n\
    try\n{\n    // try block\n}\ncatch(type1 arg)\n{\n    // catch block1\n}\ncatch(type2\
    \ arg)\n{\n    // catch block2\n}\n...\ncatch(typeN arg)\n{\n    // catch blockN\n\
    }}\n```\n\nWhen an exception is thrown, the exception handlers are searched in\
    \ order for an appropriate match. After executing the handler, the control goes\
    \ to the first handler that yields a match is executed. After the last catch block\
    \ for try. (In other words, all other handlers are bypassed). When no match is\
    \ found, the program is terminated.\n\nIt is possible that arguments of several\
    \ catch statements match the type of an exception. In such cases, the first handler\
    \ that matches the exception is executed.\n\nProgram 12.3 shows a simple example\
    \ where multiple catch statements are used to handle various types of exceptions."
