    # 7.9 TYPE CONVERSIONS


    We know that constants and variables of different types are mixed in an expression,
    C applies automatic type conversion to the operands as per certain rules. Similarly,
    an assignment operation also causes the automatic type conversion. The type of
    data to the right of an assignment operator is automatically converted to the
    type of the variable on the left. For example, the statements


    ```

    int m;

    float x = 3.14159;

    m = x;

    ```


    convert x to an integer before its value is assigned to m. Thus, the fractional
    part is truncated. The type conversions are automatic as long as the data types
    are built-in types.


    What happens when they are user-defined data types?


    Consider the following statement that adds two objects and assigns the result
    to a third object.


    ```

    v3 = v1 + v2; // v1, v2 and v3 are class type objects

    ```


    When the objects are of the same class, the operations of addition and assignment
    are carried out smoothly and the compiler does not make any claims. We have seen,
    in the case of class objects, the values of all data members of the right-hand
    object are simply copied into the corresponding members of the object on the left-hand.
    What if one of the operands is an object and the other is a built-in type variable?
    Or, if they belong to two different classes?'
