  md: "# 256 Object Oriented Programming through C++\n\nTable 8.2 Execution of base\
    \ class constructors\n\n| Method of inheritance | Order of execution |\n|--- |---\
    \ |\n| Class B: public A | A(); base constructor \n{ \n};\nB(); derived constructor\
