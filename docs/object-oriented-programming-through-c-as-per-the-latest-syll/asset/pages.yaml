  md: '# Object Oriented Programming through C++


    The scoping of const values differs. A const in C++ defaults to the internal linkage
    and therefore, it is local to the file where it is declared. In ANSI C, const
    values are global in nature. They are visible outside the file where they are
    declared; however, they can be made local by declaring them as static. To give
    a const value an external linkage so it can be referenced from another file, we
    must explicitly define it as an extern in C++. Example:


    ```

    extern const total = 100;

    ```


    Another method of naming integers constants is by enumeration under:


    ```

    enum {X,Y,Z};

    ```


    This defines X, Y and Z as integer constants with 0, 1, and 2 respectively. This
    is equivalent to


    ```

    const X = 0;

    const Y = 1;

    const Z = 2;

    ```


    We can also assign values to X, Y, and Z explicitly. Example:


    ```

    enum(X=100, Y=50, Z=200);

    ```


    Such values can be any integer values. Enumerated data type has been discussed
    in detail in Section 3.6.


    ![](img/c8042bb2c98f96c5758608865c161311_90_0.png)


    # 3.10 TYPE COMPATIBILITY


    C++ is very strict with regard to type compatibility compared to C. For instance,
    C++ defines int, short int, and long int as three different types. They must be
    cast when their values are assigned to one another. unsigned char, char, and signed
    char are considered different types, although each of these has a size of one
    byte. In C++, the types of values must be the same for complete compatibility,
    or a cast must be explicit. These restrictions in C++ are necessary in order to
    support function overloading where two functions with the same name are distinguished
    using the type of function arguments.


    Another difference is that the char constants are stored. In C, they are stored
    as ints, and therefore,


    ```

    sizeof (''x'')

    ```


    is equivalent to


    ```

    sizeof (int)

    ```


    in C. C++, however, char is not promoted to the size of int and therefore,


    ```

    sizeof (''x'')

    ```


    equals


    ```

    sizeof (char)

    ```'
