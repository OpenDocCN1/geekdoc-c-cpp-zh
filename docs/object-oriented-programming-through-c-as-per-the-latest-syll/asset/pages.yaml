    # Displaying Trailing Zeros and Plus Sign


    If we print the numbers 10.75, 25.00 and 15.50 using a field width of, say, eight
    positions, with two digits precision, then the output will be as follows:


    | | 1 | 0 | 7 | 5 |

    | | | | 2 | 5 |

    | | | 1 | 5 | 5 |


    Note that the trailing zeros in the second and third items have be truncated.


    Certain situations, such as a list of prices of items or the salary statement
    of employees, require trailing zeros to be shown. The above output would look
    better if they are printed as follows:


    ```

    10.75

    25.00

    15.50

    ```


    The setf() can be used with the flag ios::showpoint as a single argument to achieve
    this form of output. For example,


    ```

    cout.setf(ios::showpoint); // display trailing zeros

    ```


    would cost to display trailing zeros and trailing decimal point. Under default
    precision, the value 3.25 will be displayed as 3.250000. Remember, the default
    assumes a precision of six digits.


    Similarly, a plus sign can be printed before a positive number using the following
    statement:


    ```

    cout.setf(ios::showpos); // show +sign

    ```


    For example, the statements


    ```

    cout.setf(ios::showpoint);

    cout.setf(ios::showpos);

    cout.precision(3);

    cout.setf(ios::fixed, ios::floatfield);

    cout.setf(ios::internal, ios::adjustfield);

    cout.width(10);

    cout << 275.5 << "\n";

    ```


    will produce the following output:


    | + | 2 | 7 | 5 | . | 5 | 0 |'
