  md: "# 9.6 VIRTUAL FUNCTIONS\n\nAs mentioned earlier, polymorphism refers to the\
    \ property by objects belonging to different classes are able to respond to the\
    \ same message, in different forms. An essential requirement of polymorphism is\
    \ therefore the ability to refer to objects without any regard to their classes.\
    \ This necessitates the use of a single pointer variable to refer to the objects\
    \ of different classes. Here, we use the pointer to refer to all the derived objects,\
    \ but we discovered that a base pointer, when it is made to contain the address\
    \ of a derived class, always executes the function in the base class. The compiler\
    \ simply ignores the contents of the pointer and chooses the member function that\
    \ matches the type of the pointer. How do we achieve polymorphism? It is achieved\
    \ using what is known as 'virtual' functions.\n\nWhen we use the same function\
    \ name in both the base and derived class, the function in base class is declared\
    \ as virtual using the keyword virtual preceding its normal declaration. When\
    \ a function is made virtual, C++ determines which function to call at run time\
    \ based on the type of object pointed by the base pointer, rather than that of\
    \ the pointer. Thus, by making the base pointer to point to different objects,\
    \ we can execute different versions of the virtual function. Program 9.12 illustrates\
    \ this.\n\n# Program 9.12 Virtual Functions\n\n```\n#include <iostream>\nusing\
    \ namespace std;\nclass Base {\npublic:\n    void display() { cout << \"\\n Display\
    \ base\"; }\n    virtual void show() { cout << \"\\n show base\"; }\n};\nclass\
    \ Derived : public Base {\npublic:\n    void display() { cout << \"\\n Display\
    \ derived\"; }\n    void show() { cout << \"\\n show derived\"; }\n};\nint main()\
    \ {\n    Base B;\n    Derived D;\n    Base *bptr;\n\n    cout << \"\\n bptr points\
    \ to Base \\n\";\n    bptr = &D;\n    bptr -> display();      // calls Base version\n\
    \    bptr -> show();         // calls Base version\n```\n\n(Cont.)"
