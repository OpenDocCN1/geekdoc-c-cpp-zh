    # 11.15 FUNCTION OBJECTS


    A function object is a function that has been wrapped in a class so that it looks
    like an object. The class has only one member function, the overloaded () operator
    and no data. The class is templated so it can be used with different data types.


    Function objects are often used as arguments to certain containers and algorithms.
    For example, the statement


    ```

    sort(array, array+5, greater<int>());

    ```


    uses the function object greater<int>() to sort the elements contained in array
    in descending order. Besides comparisons, STL provides many other defined function
    objects for performing arithmetic and logical operations. Note in Table 11.14
    that there are function objects corresponding to all the major C++ operators.
    For using function objects, we must include <functional> header file.


    # Table 11.14 STL function objects in <functional/>


    | Function object | Type | Description |

    |---|---|---|n| divides<T> | arithmetic | x/y |

    | equal_to<T> | relational | x == y |

    | greater<T> | relational | x > y |

    | greater_equal<T> | relational | x >= y |

    | less<T> | relational | x < y |

    | less_equal<T> | relational | x <= y |

    | logical_and<T> | logical | x && y |

    | logical_not<T> | logical | !y |

    | logical_or<T> | logical | x || y |

    | minus<T> | arithmetic | x - y |

    | modulus<T> | arithmetic | x % y |


    (Contd.)'
