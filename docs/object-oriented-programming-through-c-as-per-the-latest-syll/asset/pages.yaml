    # 3.23 OPERATOR OVERLOADING


    As stated earlier, overloading assigns different meanings to an operation, depending
    on the context. C++ permits overloading of operators, allowing us to assign multiple
    meanings to operators. Actually we have used the concept of overloading in C.
    For example, the operator * when applied to a pointer variable, gives the value
    to the pointer being pointed to. But it is also commonly used for multiplying
    numbers. The number and type of operands decide the nature of operation to follow.


    The input/output operators << and >> are good examples of overloading. Although
    the built-in definition of the << operator is for shifting bits, it is also used
    for displaying the values of various data types. This has been made possible by
    the header file iostream where a number of overloading definitions for << are
    included. Thus, the statement


    ```

    cout << 75.86;

    ```


    invokes the definition for displaying a double type value, and


    ```

    cout << "well done";

    ```


    invokes the definition for displaying a char value. However, none of these definitions
    in iostream affect the meaning of the operator.


    Similarly, we can add definitions to other C++ operators. For example, we can
    define + operator to add two structures or objects. Almost all C++ operators can
    be overloaded with a few exceptions such as the member-access operators (. and
    *), conditional operator (?:), scope resolution operator (..) and the size operator
    (sizeof). Definitions for operator overloading are discussed in detail in Chapter
    7.'
