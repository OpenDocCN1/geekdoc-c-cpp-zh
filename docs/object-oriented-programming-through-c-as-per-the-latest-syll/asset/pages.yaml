  md: 'Input and Output in C++


    The data in the input stream can come from the keyboard or any other storage device.
    Similarly, the data in the output stream can go to the screen or any other storage
    device. As mentioned, a stream acts as an interface between the program and the
    input/output device. Therefore, a C++ program handles data (input or output) independent
    of the devices used.


    C++ contains several pre-defined streams that are automatically opened when a
    program begins its execution. These include cin and cout which have been used
    very often in our earlier programs. We know that cin represents the input stream
    connected to the standard input device (usually the keyboard) and cout represents
    the output stream connected to the standard output device (usually the screen).
    Note that the keyboard and the screen are default options. We can redirect streams
    to other devices or files, if necessary.


