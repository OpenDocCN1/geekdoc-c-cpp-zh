    # 3.4 IDENTIFIERS AND CONSTANTS


    Identifiers refer to the names of variables, functions, arrays, classes, etc.,
    created by the programmer. are the fundamental requirement of any language. Each
    language has its own rules for naming these identifiers. The following rules are
    common to both C and C++:


    +   * Only alphabetic characters, digits and underscores are permitted.

    * The name cannot start with a digit.

    * Uppercase and lowercase letters are distinct.

    * A declared keyword cannot be used as a variable name.


    A major difference between C and C++ is the limit on the length of a name. While
    ANSI C recognizes only the 32 namespaces in a name, ANSI C++ places no limit on
    its length, and therefore, the characters in a name are significant.


    Care be exercised when naming a variable which is shared by more than one file
    containing C and C++ programs. Some operating systems impose a restriction on
    the length of such a variable name.


    Constants refer to fixed values that do not change during the execution of a program.


    Like C, C++ supports several kinds of literal constants. They include integers,
    characters, floating point numbers and strings. Literal constant do not have memory
    locations.


