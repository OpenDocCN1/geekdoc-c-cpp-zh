  md: '# SUMMARY


    +   - A class is an extension to the structure data type. A class can have both
    variables and functions as members.


    +   - By default, members of the class are private whereas of structure are public.


    +   - Only the member functions can have access to the private data members and
    private functions. However the public members can be accessed from outside the
    class.


    +   - In C++, the class variables are called objects. With objects we can access
    the public members of a class using a dot operator.


    +   - We can define the member functions inside or outside the class. The difference
    between a member function and a normal function is that a member function uses
    a membership ''identity'' label in the header to indicate the class to which it
    belongs.


    +   - The memory space for the objects is allocated when they are declared. Space
    for member variables is allocated separately for each object, no separate space
    is allocated for member functions.


    +   - A data member of a class can be declared as a static and is normally used
    to maintain values common to the entire class.


    +   - The static member variables must be defined outside the class.


    +   - A static member function can have access to the static members declared
    in the same class and can be called using the class name.


    +   - C++ allows us to have arrays of objects.


    +   - We may use objects as function arguments.


    +   - A function declared as a friend is not in the scope of the class to which
    it has been declared as friend. It has full access to the private members of the
    class.


    +   - A function can also return an object.


    +   - If a member function does not alter any data in the class, then we may declare
    it as a const member function. The keyword const is appended to the function prototype.


    +   - It is also possible to define and use a class inside a function. Such a
    class is called a local class


