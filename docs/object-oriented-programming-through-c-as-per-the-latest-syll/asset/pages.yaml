    # Dynamic Binding


    Binding refers to the linking of a procedure call to the code to be executed in
    response to the call. Dynamic binding (also known as late binding) means that
    the code associated with a given procedure call is not known until the time of
    call at run-time. It is associated with polymorphism and inheritance. A function
    associated with a polymorphic reference depends on the dynamic type of that reference.


    Consider the procedure "draw" in Fig. 1.9. By inheritance, every object will have
    this procedure. Its algorithm is, however, unique to each object and so the draw
    procedure will be redefined in each class that defines the object. At run-time,
    the code matching under current reference will be called.


    # Message Passing


    An object-oriented program consists of a set of objects that communicate with
    each other. The process of programming in an object-oriented language, therefore,
    involves the following basic steps:


    +   1. Creating classes that define objects and their behavior,

    2. Creating objects from class definitions, and

    3. Establishing communication among objects.


    Objects communicate with one another by sending and receiving information much
    the same way as people pass messages to one another. The concept of message passing
    makes it easier to talk about building systems that directly model or simulate
    their real-world counterparts.'
