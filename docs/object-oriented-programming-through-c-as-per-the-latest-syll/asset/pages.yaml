    +   - Software technology has evolved through a series of phases during the last
    five decades.


    +   - The most popular phase till recently was procedure-oriented programming
    (POP).


    +   - POP employs top-down programming approach where a problem is viewed as a
    sequence of tasks to be performed. A number of functions are written to implement
    these tasks.


    +   - POP has two major drawbacks, viz., (1) data move freely around the program
    and are therefore vulnerable to changes by any function in the program, and (2)
    it does not model well the real-world problems.


    +   - Object-oriented programming (OOP) is invented to overcome the drawbacks
    of the POP. It employs the bottom-up programming approach. It treats data as a
    critical element in the program development and does not allow it to flow freely
    around the system. It ties data more closely to the functions that operate on
    it in a data structure called class. This feature is called data encapsulation.


    +   - In OOP, a problem is considered as a collection of a number of entities
    called objects. Objects are instances of classes.


    +   - Insulation of data from direct access by the program is called data hiding.


    +   - Data abstraction refers to putting essential features without including
    background details.


    +   - Inheritance is the process by which objects of one class acquire quality
    properties of another class.


    +   - Polymorphism means one, multiple forms. It allows us to have more than one
    function with the same name in a program. It also allows overloading of operators
    so that an operation can exhibit different behaviors in different instances.


    +   - Dynamic binding means that the code associated with a given procedure is
    not known until the time of the call at run-time.


    +   - Message passing involves specifying the name of the object, the name of
    the function (message) and the information to be sent.


    +   - Object-oriented technology offers several benefits over the conventional
    programming methods—the most important one being the reusability.


    (Contd.)'
