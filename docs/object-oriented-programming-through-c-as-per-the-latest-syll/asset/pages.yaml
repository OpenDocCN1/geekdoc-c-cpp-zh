  md: '# Inheritance


    Inheritance is the process by which objects of one class acquire the properties
    of objects of another class. It supports the concept of hierarchical classification.
    For example, the bird ''robin'' is a part of the class ''flying bird'' which is
    again a part of the class ''bird''. The principle behind this sort of division
    is that each derived class shares some common characteristics with the class from
    which it is derived as illustrated in Fig. 1.8.


    ![](img/c8042bb2c98f96c5758608865c161311_27_0.png)


    Fig. 1.8 Property inheritance


    In OOP, the concept of inheritance provides the idea of reusability. This means
    that we can add additional features to an existing class without modifying it.
    This is possible by deriving a new class from the existing one. The new class
    will have the combined features of both classes. The real appeal and power of
    the inheritance mechanism is that it allows the programmer to reuse a class that
    is almost, but not exactly, what he wants, and to tailor the class in such a way
    that it does not introduce any undesirable side-effects into the rest of the classes.


    Note that each sub-class defines only those features that are unique to it. Without
    the use of classification, each class would have to explicitly include all of
    its features.


    # Polymorphism


    Polymorphism is another important OOP concept. Polymorphism, a Greek term, means
    the ability to take more than one form. An operation may exhibit different behaviors
    in different instances. The behavior depends upon the types of data used in the
    operation. For example, consider the operation of addition. For two numbers, the
    operation will generate a sum. If the operands are strings, the operation will
    produce a third string by concatenation. The process of making an operator to
    exhibit different behaviors in different instances is known as operator overloading.'
