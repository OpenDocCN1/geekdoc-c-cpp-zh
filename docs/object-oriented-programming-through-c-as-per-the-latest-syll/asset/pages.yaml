  md: '# 528 Object Oriented Programming through C++


    ```

    (i) if (expression)

    statement-1;

    statement-2;

    (ii) if (expression)

    statement-1;

    else

    statement-2;

    ```


    In form (i), if the expression is nonzero (true), statement-1 is executed and
    then statement-2 is executed. If the expression is zero (false), statement-1 is
    skipped. In form (ii), if the expression is nonzero, statement-1 is executed and
    statement-2 will be skipped; if it is zero, statement-2 is executed and statement-1
    will be skipped.


    inline


    inline is a function specifier which specifies to the compiler that the function
    definition should be substituted in all places where the function is called.


    int


    It is one of the basic data types and is used to declare a variable that was assigned
    integer values.


    long


    long is a data type modifier that can be applied to some of the basic data types
    to increase their size. When used as shown below, the variable becomes signed


    ```

    long int;

    long m;

    ```


    mutable


    It is a data type. A item declared mutable may be modified even if it is a member
    of a const object or const function.


    namespace


    It is used to define a scope that could hold global identifiers. Example:


    ```

    namespace name

    {

    Declaration of identifiers

    }

    ```


    new


    It is an operator for allocating memory dynamically from free store. We use new
    in place of malloc() function.


    operator


    operator is used to define an operator function for overloading an operator use
    with class objects. Example:


    ```

    int operator*(vector &v1, vector &v2);

    ```


    private


    It is a visibility specifier for class members. A member listed under is not accessible
    to any function other than the member functions of the class in which it is accessible
    to any.


    protected


    Like private, protected is also a visibility specifier for class members. It makes
    a member accessible not only to the members of the class but also to the members
    of the classes derived from it.


    public


    This is the third visibility specifier for the class members. A member declared
    as public in a class is accessible publicly. That is, any function can access
    a public member.'
