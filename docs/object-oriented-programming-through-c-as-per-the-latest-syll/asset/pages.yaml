  md: '# 336 Object Oriented Programming through C++


    While opening the file using constructor, we need to pass the desired filename
    as a parameter to a constructor.


    The **open()** function can be used to open multiple files that use the same stream
    object. The second argument of the **open()** function called file mode, specifies
    the purpose for the file it is opened.


    If we do not specify the second argument of the **open()** function, the default
    values specified in the prototype of these class member functions are used while
    opening the file. The default values are as follows:


    ```

    ios : in - forstream functions, meaning-open vector for reading only.

    ios : out - forstream functions, meaning-open for writing only.

    ```


    +   When a file is opened for writing only, a new file is created if there is
    no file of name. If a file by name already exists, its contents are deleted and
    the file is presented as a clean file.


    +   To open an file for updating without losing its original contents, we need
    to open it in an append mode.


