  md: "# 5.6 MAKING AN OUTSIDE FUNCTION INLINE\n\nOne of the objectives of OOP is\
    \ to separate the details of implementation from the class definition. It is therefore\
    \ good practice to define the member functions outside the class.\n\nWe can define\
    \ a member function outside the class definition and still make it inline by just\
    \ using the qualifier inline in the header line of function definition. Example:\n\
    \n```\nclass item\n{\n  ....\n  public:\n    void getdata(int a, float b); //\
    \ declaration\n  inline void item :: getdata(int a, float b) // definition\n \
    \   number = a;\n    cost = b;\n}\n```\n\n# 5.7 NESTING OF MEMBER FUNCTIONS\n\n\
    We just discussed that a member function of a class can be called only by an object\
    \ of class using a dot operator. However, there is an exception to this. A member\
    \ function can be called using its name inside another member function of the\
    \ same class. This is known as nesting of member functions. Program 5.2 illustrates\
    \ this feature.\n\n# Program 5.2 Nesting of Member Functions\n\n```\n#include<iostream>\n\
    #include<conio.h>\n#include<string>\nusing namespace std;\n\nclass binary\n{\n\
    \  string s;\n\n  public:\n    void read(void)\n    {\n      cout<<\"Enter a binary\
    \ number\";\n      cin>>s;\n    }\n```"
