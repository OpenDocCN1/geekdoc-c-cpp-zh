  md: '# 3.24 OPERATOR PRECEDENCE


    Although C++ enables us to add multiple meanings to operators, yet their association
    and precedence remain the same. For example, the multiplication operator will
    continue having higher precedence than the add operator. Table 3.7 gives the precedence
    and associativity of all the C++ operators. The groups are listed in the order
    of decreasing precedence. The labels prefix and postfix distinguish of ++ and
    --, the symbols -, *, & are also used as both unary and binary operators.


    A complete list of ANSI C++ operators and their meanings, precedence, associativity
    and use are given in Appendix E.


    Table 3.7 Operator precedence and associativity

    | Operator | Associativity |

    | --- | --- |

    | : ( []) ++ postfix -- | left to right |

    | ->. prefix ++ prefix -- ~ ! unary unary * unary & (type) sizeof new delete |
    right to left |

