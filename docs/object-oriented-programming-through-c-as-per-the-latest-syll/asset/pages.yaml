  md: "# Object Oriented Programming through C++\n\nThe error-handling code basically\
    \ consists of two segments, one to detect errors and to throw exceptions, and\
    \ the other to catch the exceptions and to take appropriate actions.\n\n# 12.3\
    \ EXCEPTION HANDLING MECHANISM\n\nC++ exception handling mechanism is basically\
    \ built upon three keywords, namely, try, throw, and catch. The keyword try is\
    \ used to preface a block of statements (rounded by braces) which may generate\
    \ exceptions. This block of statements is known as try block. When an exception\
    \ is detected, it is thrown using a throw statement in the try block. A catch\
    \ block defined by the keyword catch 'catches' the exception 'thrown' by the throw\
    \ statement in the try block, and handles it appropriately. The relationship is\
    \ shown in Fig. 12.1.\n\n![](img/c8042bb2c98f96c5758608865c161311_404_0.png)\n\
    \nThe catch block that catches an exception must immediately follow the try block\
    \ that throws the exception. The general form of these blocks are as follows:\n\
    \n```\ntry {\n    throw exception; // Block of statements which\n    // detects\
    \ and throws an exception\n    ...\n    ...\n}\ncatch(type arg) {\n    // Catches\
    \ exception\n    ...\n    ...\n    // Block of statements that\n    // handles\
    \ the exception\n}\n```\n\nWhen the try block throws an exception, the program\
    \ control leaves the try block and enters the catch statement of the catch block.\
    \ Note that exceptions are objects used to transmit information about a problem.\
    \ If the type of object thrown matches the arg type in the catch statement, then\
    \ catch block is executed for handling the exception. If they do not match, the\
    \ program is aborted with the help of the abort() function which is invoked by\
    \ default. When no exception is detected and thrown,"
