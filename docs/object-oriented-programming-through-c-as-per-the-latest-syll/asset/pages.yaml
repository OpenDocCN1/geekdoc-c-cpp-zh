    conceptual background. A system can be viewed as a collection of entities that
    interact together to accomplish certain objectives (Fig. 15.3). Entities may represent
    physical objects such as equipment and people, and abstract concepts as data files
    and functions. In object-oriented analysis, the entities are called objects.'
