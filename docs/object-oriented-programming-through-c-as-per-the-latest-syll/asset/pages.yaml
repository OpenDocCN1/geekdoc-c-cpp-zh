  md: 'Object Oriented Programming through C++


    # Pseudocode


    A coding technique where precise descriptions of procedures are written in easy-to-read
    language constructs without the bother of precise attention to the syntax rules
    of a computer language.


    # Public Member


    A class member that is accessible to all users of the class. The access is not
    restricted to the member and friend functions of the class alone. A public member
    of a base class is inherited by a derived class. For more details on inheritance,
    see private base class and public base class.


    # Public Base Class


    A base class which allows its public and protected members to be inherited respectively,
    public and protected members of the derived class. Thus, the public members that
    are accessible to users of the base class are also accessible to users of the
    derived class. Also, protected members retain their protected status so that they
    can be inherited by classes derived from a class that itself inherited.


    # Pure Virtual Function


    A virtual function that is declared in a base class but not defined. The responsibility
    for defining the function falls on the derived classes, each of which provides
    a different definition. It is illegal to create instances of a class that declares
    a pure virtual function. So, such a class is necessarily an abstract base class.


    # Qualifier Recursion


    A word used to modify the meaning of a data declaration. Recursion occurs when
    a function calls itself directly or indirectly. (For a recursive definition, see
    recursion.)


    # Relational Operator


    An identifier that serves as an alternate name for a variable. A reference is
    defined in terms of an existing name for the variable and becomes an alias of
    that name. It provides a means, whereby the names of the data objects can, in
    effect, be passed and returned by the functions and operators.


    # Relational Operator


    An operator that compares two operands and returns either true or false on whether
    the relationship is true of false.


    # Return Statement


    A statement that signals the completion of a function and causes control to return
    to the caller.


    # Reusability


    A feature which is supported in object-oriented programming. This allows the reuse
    of existing classes without definition.


    # Right Shift Rounding Error


    The operation of moving the bits in a bit field by a specified amount. An error
    due to truncation in rounding.


    # Scope


    The scope of an identifier is the portion of the program text in which that identifier
    is accessible.


    # Scope


    The scope of a variable is the portion of a program where the name of the variable
    is known.


    # Scope Resolution Operator


    The operator which is usually used to indicate the class in which an identifier
    is declared.


    # Segmentation violation


    An error caused by a program trying to access memory outside of its address space.
    Caused by de-referencing a bad pointer.'
