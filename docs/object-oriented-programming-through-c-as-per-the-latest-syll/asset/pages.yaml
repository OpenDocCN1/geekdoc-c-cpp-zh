  md: '# Functions for Manipulation of File Pointers


    All the actions on the file as shown in Fig. 10.7 take place automatically by
    default. How we move a file pointer to any other desired position inside the file?
    This is possible only if we can take control of the movement of the file pointers.
    The file stream classes support the following functions to manage such situations:


    +   - seekg() Moves pointer (input) to a specified location.

    - seekp() Moves put pointer(output) to a specified location.

    - tellg() Gives the current position of the get pointer.

    - tellp() Gives the current position of the put pointer.


    For example, the statement


    ```

    infile.seekg(10);

    ```


    moves the file pointer to byte number 10. Remember, the bytes in a file are numbered
    beginning from zero. Therefore, the file pointer will be pointing to the 11th
    byte in the file.


    Consider the following statements:


    ```

    ofstream fileout;

    fileout.open("hello", ios::app);

    int p = fileout.tellp();

    ```


    On execution of these statements, the output pointer is moved to the end of the
    file "hello" and the value of p will represent the number of bytes in the file.


    # Specifying the Offset


    We have just seen how to move a file pointer to a desired location using the ''seek''
    functions. The argument to these functions represents the absolute position in
    the file. This is shown in Fig. 10.8.


    ![](img/c8042bb2c98f96c5758608865c161311_336_0.png)


    ‘Seek’ functions seekg() and seekp() can also be used with two arguments as:


    ```

    seekg(offset, refposition);

    seekp(offset, refposition);

    ```


    The parameter offset represents the number of bytes by the file pointer is to
    be moved from the location specified by the parameter refposition. The refposition
    takes one of the following three constants defined in the ios class:'
