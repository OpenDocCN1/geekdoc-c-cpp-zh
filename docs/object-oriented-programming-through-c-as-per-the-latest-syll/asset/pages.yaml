  md: "# Object Oriented Programming through C++\n\n```\npublic:\n  void setval(void);\n\
    \  void display(void);\n};\n```\n\nThe array a[] declared as a private member\
    \ of the class array can be used in the member functions, like any other array\
    \ variable. We can perform any operations on it. For instance, in the above class\
    \ definition, the member function setval() sets the values of elements of the\
    \ array a[] and display() displays the values. Similarly, we may use other member\
    \ functions to perform any operations on the array variables.\n\nWe consider a\
    \ shopping list of items for which we place an order with a dealer every month.\
    \ The list includes details such as the code number and price of each item. We\
    \ like to perform operations such as adding an item to the list, deleting an item\
    \ from the list and printing the total value of the order. Program 5.3 shows how\
    \ these operations are implemented using a class with arrays as members.\n\n#\
    \ Program 5.3 Processing Shopping List\n\n```\n#include <iostream>\n\nusing namespace\
    \ std;\n\nconst m=50;\n\nclass ITEMS {\n  int itemCode[m];\n  float itemPrice[m];\n\
    \  int count;\n\npublic:\n  void CNT(int count = 0); // initializes count to 0\n\
