  md: "# Classes and Objects 133\n\nSimilarly, the statement\n\n```\nx.putdata();\n\
    ```\n\nwould display the values of data members. Remember, a member function can\
    \ be invoked only by an object (of the same class). The statement like\n\n```\n\
    getdata(100, 75.5);\n```\n\nhas no meaning. Similarly, the statement\n\n```\n\
    x.number = 100;\n```\n\nis also illegal. Although x is an object of the type item\
    \ to which number belongs, the number (declared private) can be accessed through\
    \ a member function and not by the object directly.\n\nIt may be recalled that\
    \ objects communicate by sending and receiving messages. This is achieved through\
    \ the member functions. For example,\n\n```\nx.putdata();\n```\n\ns a message\
    \ to the object x requesting to display its contents.\n\nA variable declared as\
    \ public can be accessed by the objects directly. Example:\n\n```\nclass xyz\n\
    {\n  int x;\n  int y;\n  public:\n  int z;\n};\n\n...\nxyz p;\np.x = 0;      //\
    \ error, x is private\np.z = 10     // OK, z is public\n```\n\n> The use of data\
    \ in this manner defeats the very idea of data hiding and therefore should be\
    \ avoided.\n\n# 5.4 DEFINING MEMBER FUNCTIONS\n\nMember functions can be defined\
    \ in two places:\n\n+   * Outside the class definition\n* Inside the class definition\n\
    \nIt is obvious, irrespective of the place of definition, the function should\
    \ perform the same task. Therefore, the code for the function body would be identical\
    \ in both the cases. However, there is a subtle difference in the way the function\
    \ header is defined. Both these approaches are discussed in detail in this section."
