    \n  // activates operator-() function\n  -S;\n  cout << \"-S : \";\n  S.display();\n\
    \n  return 0;\n}\n```\n\nThe output of Program 7.1 would be\n\nS : x = 10 y =\
    \ -20 z = 30\n-S : x = -10 y = 20 z = -30\n\n> Note The operator() takes no argument.\
    \ Then, what does this operator function do? It changes the sign of data members\
    \ of the object S. Since this is a member function of the same class, it can directly\
    \ access the members of the object which activated it.\n\nRemember, a statement\
    \ like\n\nS2 = -S1;\n\nwill not work because, the function operator() does not\
    \ return any value. It can work if the function is modified to return an object.\n\
    \nIt is possible to overload a unary minus operator using a friend function as:\n\
    \n```\nfriend void operator-(space &s); // declaration\nvoid operator-(space &s)\
    \ // definition\n{\n  S.x = -S.x;\n  S.y = -S.y;\n  S.z = -S.z;\n}\n```\n\n> Note\
    \ that the argument is passed by reference. It will not work if we pass argument\
