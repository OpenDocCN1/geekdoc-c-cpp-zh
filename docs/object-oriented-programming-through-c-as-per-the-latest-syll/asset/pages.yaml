  md: '# 236 Object Oriented Programming through C++


    It is also possible to inherit a base class in **protected** mode (known as *protected*
    derivation). In protected derivation, both the **public** and **protected** members
    of the base class become **protected** members of the derived class. Table 8.1
    summarizes the visibility of base class members undergoes modifications in all
    the three types of derivation.


    **Table 8.1** Visibility of inherited members


    | Base visibility | Derived class visibility | |

    | --- | --- |

    | | Private derivation | Protected derivation |

    | Private → Not inherited | Not inherited | Not inherited |

    | Protected → Protected | Private | Protected |

    | Public → Public | Private | Protected |


    Now let us review the access to the **private** and **protected** members of a
    class. What are the various functions that have access to these members? They
    could be


    +   1. A function that is a friend of the class.

    2. A member function of a class that is a friend of the class.

    3. A member function of a derived class.


    While the friend functions and the member functions of a friend class can have
    direct access to both the **private** and **protected** data, the member functions
    of a derived class can directly access only the **protected** data. However, they
    can access the *private* data through the member functions of the base class.
    Figure 8.5 illustrates how the access control mechanism works in various situations.
    A simplified view of access control to the members of a class is shown in Fig.
    8.6.


    ![](img/c8042bb2c98f96c5758608865c161311_252_0.png)


    **Fig. 8.5** Access mechanism in classes'
