    # Rules for Virtual Functions


    When functions are created for implementing binding, we should observe some basic
    rules that the compiler requirements:


    +   1. The virtual functions must be members of some class.

    2. They cannot be static members.

    3. They are accessed using object pointers.

    4. A virtual function can be a friend of another class.

    5. A virtual function in a base class must be defined, even though it may not
    be used.

    6. The prototypes of the base class version of a virtual function and all the
    derived class versions must be identical. If two functions with the same name
    have different prototypes, C++ considers them as overloaded functions, and the
    virtual function mechanism is ignored.

    7. We cannot have virtual constructors, but we can have virtual destructors.

    8. While a base pointer can point to any type of the derived object, the result
    is not true. That is to say, we cannot use a pointer to a derived class to access
    an object of the base type.

    9. When a base pointer points to a derived class, incrementing or decrementing
    it will not make it point to the next object of the derived class. It is incremented
    or decremented only relative to its base type. Therefore we should not use this
    method to move the pointer to the next object.

    10. If a virtual function is defined in the base class, it need not necessarily
    be redefined in the derived class. In such cases, calls will invoke the base function.


    # 9.7 PURE VIRTUAL FUNCTIONS


    It is normal practice to declare a virtual function inside the base class and
    redefine it in the derived classes. The function inside the base class is seldom
    used for performing any task. It only serves as a placeholder. For example, we
    have not defined any object of class media and therefore the function display()
    in the base class has been defined ‘’. Such functions are called “do-nothing”
    functions. A “do-nothing” function may be defined as follows:


    ```

    virtual void display() = 0;

    ```


