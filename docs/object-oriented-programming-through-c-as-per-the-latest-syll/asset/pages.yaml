  md: "# 234 Object Oriented Programming through C++\n\n```\nb = 10\nc = 50\nter values\
    \ for a and b: 12 20\na = 12\nb = 20\nc = 240\n```\n\nSuppose a base class and\
    \ a derived class define a function of the same name. What will happen when a\
    \ derived class object invokes the function? In such cases, the derived class\
    \ function supersedes the base class definition. However, if the derived class\
    \ does not redefine the function, then the base class function will be called.\n\
    \n# 8.4 MAKING A PRIVATE MEMBER INHERITABLE\n\nWe have seen how to increase the\
    \ capabilities of an existing class without modifying it. We have also seen that\
    \ a private member of a base class cannot be inherited and therefore it is not\
    \ available for the derived class directly. What do we do if the private data\
    \ needs to be inherited by a derived class? This can be accomplished by modifying\
    \ the visibility limit of the private member by making it public. This would make\
    \ it accessible to all the other functions of the program, thus taking away the\
    \ advantage of data hiding.\n\nC++ provides a third visibility modifier, protected,\
    \ which serve a limited purpose in inheritance. A member declared as protected\
    \ is accessible by the member functions within its class and any class immediately\
    \ derived from it. It cannot be accessed by the functions outside these two classes.\
    \ A class can now use all three visibility modes as illustrated below:\n\n```\n\
    class alpha\n{\n    private:\n        ...\n// optional\n        // visible to\
    \ member functions\n        // within its class\n    protected:\n        ...\n\
    \        // visible to member functions\n        // of its own and that of derived\
    \ class\n    public:\n        ...\n        // visible to all functions\n     \
    \   // in the program\n};\n```\n\nA protected member is inherited in public mode,\
    \ it becomes protected in the derived class and therefore it is accessible by\
    \ the member functions of the derived class. It is also ready for further inheritance.\
    \ A protected member, inherited in the private mode derivation, becomes private\
    \ in the derived class. Although it is available to the member functions of the\
    \ derived class, it is not available for further inheritance (since private members\
    \ cannot be inherited). Figure 8.4 is the pictorial representation for the two\
    \ levels of derivation."
