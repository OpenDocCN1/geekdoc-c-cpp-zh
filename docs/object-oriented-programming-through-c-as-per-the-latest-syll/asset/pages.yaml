    # The iostream File


    A C++ program typically contains pre-processor directive statements at the beginning.
    Such statements are preceded with a # symbol to indicate the presence of a pre-processor
    directive to the compiler, which in turn handles the # directive statement. All
    C++ programs begin with a #include directive that includes the specified header
    file contents into the main program.


    We have used the following #include directive in the program:


    ```

    #include <iostream>

    ```


    This directive uses the preprocessor to add the contents of the iostream file
    to the program. It contains declarations for the identifier cout and the operator
    <<. Some old versions of C++ use a header file called iostream.h. This is one
