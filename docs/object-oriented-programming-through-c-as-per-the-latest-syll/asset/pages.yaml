  md: 'that represents the argument. The inheritance represents is_a relationship
    and the containment represents has_a relationship.


    Use relationship gives information such as the various class uses and the way
    it uses them. For example, a class A can use classes B and C in several ways:


    +   - A reads a member of B

    - A calls a member of C

    - A creates B using new operator


    The knowledge of such relationships is important to the design of a program.


    # Organization of Class Hierarchies


    In the previous step, we examined the inheritance relationships. We must re-examine
    them and create a class hierarchy so that we can reuse as much data and/ functions
    that have been designed already. Organization of the class hierarchy involves
    identification of common attributes and functions among a group of related classes
    and combining them to form a new class. The new class will serve as the super
    class and the others as subordinate classes (which derive attributes from the
    super class). The new class may or not have the meaning of an object by itself.
    If the object is created purely to combine the common attributes, it is called
    abstract class.


    This process may be repeated at different levels of abstraction with the sole
    objective of extending the classes. As hierarchy structure becomes progressively
    higher, the amount of specification and implementation inherited by the lower
    level increases. We may repeat the process until we are sure that no new class
    can be formed. Figure 15.18 illustrates a two-level iteration process.


