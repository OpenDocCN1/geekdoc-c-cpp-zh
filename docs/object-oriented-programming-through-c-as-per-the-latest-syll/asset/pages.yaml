    # 1.9 WHAT IS C++


    C++ is an object-oriented programming language. It was developed by Bjarne Stroustrup
    at AT&T Laboratories in Murray Hill, New Jersey, USA, in the early 1980''s. Stroustrup,
    admirer of Simula67 and a strong supporter of C, wanted to combine the best of
    both the languages and create a more powerful language that could support object-oriented
    programming features and still retain the power and elegance of C. The result
    was C++.++ is an extension of C with a major addition of the class construct feature
    of Simula67. Stroustrup initially called the new C with ''classes''. However,
    later in 1983, the name was changed to C++. The idea of C++ comes from the C increment
    operator++, suggesting that C++ is an augmented (incremented) version of C.


    During the early 1990s the language underwent a number of improvements and changes.
    In November 1997, the ANSI/ISO standards committee these changes and added several
    new features to the C language specifications.


    C is a superset of C. What we already know C applies to C++ also. Therefore, almost
    all C programs are also C++ programs. However, there are a few differences that
    will prevent a C program to run under C++ compiler. We shall see these differences
    later as and when they are encountered.


    The most important features of C++ that are on to C are inheritance, function
    overloading, and operator overloading. These features enable creation of abstract
    data types, inherit properties from existing data types and support polymorphism,
    making C++ a truly object-oriented language.


    The object-oriented features of C++ allow to build large programs with clarity,
    extensibility and ease of maintenance, incorporating the spirit and efficiency
    of C. The addition of new features transformed C from a language that currently
    facilitates top-down, structured design, to one that provides bottom-up, object-oriented
    design.


    ![](img/c8042bb2c98f96c5758608865c161311_32_1.png)


