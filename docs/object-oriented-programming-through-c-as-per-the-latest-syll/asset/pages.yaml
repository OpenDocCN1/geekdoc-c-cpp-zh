    the conversions automatically. This process is known as implicit or automatic
    conversion.


    When the compiler encounters an expression, it divides the expressions into sub-expressions
    consisting of one operand and two. For a binary operator, if the operands type
    differ, the compiler converts one of them to match with the other, using the rule
    that the "smaller" type is converted to the "wider" type. For example, if one
    of the operand is an int and the other is a float, the int is converted into a
    float because a float is wider than an int. The "waterfall" model shown in Fig.
    3.3 illustrates this rule.


