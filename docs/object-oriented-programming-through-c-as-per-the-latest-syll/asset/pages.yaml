    \ assign it to a pointer. The address of a member can be obtained by applying\
    \ the operator & to a \"fully qualified\" class name. A class member pointer can\
    \ be declared using the operator :: with the class name. For example, given the\
    \ class\n\n```\nclass A\n{\n  private:\n    int m;\n  public:\n    void show();\n\
    };\n```\n\nWe define a pointer to the member m as follows:\n\n```\nint A::* ip\
    \ = &A::m;\n```\n\nThe ip pointer thus acts like a class member in that it must\
    \ be invoked with a class object. In the statement above, the A::* means \"pointer-to-member\
    \ of A class\". The phrase &A::m means the \"address of the m member of A class\"\
    .\n\nRemember, the following statement is not valid:\n\n```\nint *ip = &m; //\
    \ won't work\n```"
