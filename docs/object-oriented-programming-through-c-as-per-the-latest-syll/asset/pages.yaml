  md: '# Object Oriented Programming through C++


    When the properties of one class are inherited by more than one class, it is called
    hierarchical inheritance.


    A private member of a class cannot be inherited in public mode or in private mode.


    A protected member inherited in public mode becomes protected, whereas inherited
    in private mode becomes private in the derived class.


    A public member inherited in public mode becomes public, whereas inherited in
    private mode becomes private in the derived class.


    The friend functions and the member functions of a class can directly access the
    private and protected data.


    The member functions of a derived class can directly access only the protected
    and public data. However, they can access the private data through the member
    functions of the base class.


    Multiple inheritance may lead to duplication of inherited members from a ''grandparent''
    base class. This may be avoided by making the common base class a virtual base
    class.


    In multiple inheritance, the base classes are constructed in the order in which
    they appear in the declaration of the derived class.


    In multilevel inheritance, the constructors are executed in the order of inheritance.


    A class can contain objects of other classes. This is known as inheritance or
    nesting.


