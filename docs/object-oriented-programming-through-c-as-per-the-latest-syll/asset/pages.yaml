  md: 'Applications with Files 309


    The I/O system of C++ handles file operations which are very much similar to the
    console input and output operations. It uses file streams as an interface between
    the programs and the files. The stream that supplies data to the program is known
    as input stream and the one that receives data from the program is known output
    stream. In other words, the input stream extracts (reads) data from the file and
    the output stream inserts (writes) to the file. This is illustrated in Fig. 10.2.


    The input operation involves the creation of an input stream and linking it with
    the program and the input file. Similarly, the output operation involves establishing
    an output stream with the necessary links with the program and the output file.


    ![](img/c8042bb2c98f96c5758608865c161311_325_0.png)


    # 10.2 CLASSES FOR FILE STREAM OPERATIONS


    The I/O system of C++ contains a set of classes that define the file handling
    methods. These include ifstream, ofstream and fstream. These classes are derived
    from fstreambase and the corresponding iostream class as shown in Fig. 10.3. These
    classes, designed to manage the disk files, are declared in istream and therefore,
    we must include this file in any program that uses files.


    Table 10.1 shows the details of file stream classes. Note that these classes contain
    many more features. For more details, refer to the manual.


    ![](img/c8042bb2c98f96c5758608865c161311_325_1.png)'
