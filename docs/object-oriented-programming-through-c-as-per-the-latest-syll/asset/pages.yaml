  md: "However, in C, any parentheses implies any number of arguments. That is, we\
    \ have fore-otyping. A C++ function can also have an 'open' parameter list by\
    \ the use of ellipses in the prototype as shown below:\n\n```\nvoid do_something(...);\n\
    ```\n\n# 4.4 CALL BY REFERENCE\n\nIn traditional C, a function passes arguments\
    \ by value. The called function creates a new set of variables and copies the\
    \ values of arguments into them. The function does not have access to the actual\
    \ variables in the calling program and can only work on the copies of values.\
    \ This mechanism is free if the function does not need to alter the values of\
    \ the original variables in the calling program. But, there may arise situations\
    \ where we would like to change the values of variables in the calling program.\
    \ For example, in bubble sort, we compare two adjacent elements in the list and\
    \ interchange their values if the first element is greater than the second. If\
    \ a function is used for bubble sort, then it is not possible if it should be\
    \ able to alter the values of variables in the calling function, the call-by-value\
    \ method is used.\n\nProvision of the reference variables in C++ permits us to\
    \ pass parameters to the functions by reference. When we pass arguments as reference,\
    \ the 'formal' arguments in the called function becomes aliases to the 'actual'\
    \ arguments in the calling function. This means that the function is working with\
    \ its own original data. Consider the following function:\n\n```\nvoid swap(int\
    \ &a, int &b)      // a and b are reference variables\n{\n    int t = a;     \
    \                     // Dynamic initialization\n    a = b;\n    b = t;\n}\n```\n\
    \nNow, if m and n are two integer variables, then the function call\n\n```\nswap(m,\
    \ n);\n```\n\nwill exchange the values of m and n using their aliases (reference\
    \ variables) a and b. Reference variables have been discussed in detail in Chapter\
    \ 3. In traditional C, this is accomplished using pointers and indirection as:\n\
    \n```\nvoid swap(int *a, int *b) /* Function definition */\n{\n    int t;\n  \
    \  t = *a;                  /* assign the value at address to t */\n    *a = *b;\
    \                  /* put the value at b into a */\n    *b = t;              \
    \    /* put the value at t into b */\n}\n```\n\nThis function can be called as\
    \ follows:\n\n```\nswap(&m, &n);          /* call by passing */\n    /* addresses\
    \ of variables */\n```"
