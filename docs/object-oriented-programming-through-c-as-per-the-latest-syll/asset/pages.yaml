  md: "# Binding, Virtual Functions and Polymorphism\n\nThe output of Program 9.14\
    \ would be\n\n```\nC text Book written by Balagurusamy\nC++ text Book written\
    \ by Balagurusamy\n```\n\n# 9.8 VIRTUAL CONSTRUCTORS AND DESTRUCTORS\n\n\"A constructor\
    \ cannot be virtual\". There are some valid reasons that justify this statement.\
    \ First, to create an object the constructor of the object class must be of the\
    \ same type as the class. This is not possible with a virtually implemented constructor.\
    \ Second, at the time of calling a constructor, the virtual table would not have\
    \ been created to resolve any virtual function calls. Thus, a virtual itself would\
    \ not have anywhere to look up to. As a result, it is not possible to declare\
    \ a constructor as virtual.\n\nA virtual destructor is perfectly feasible in C++.\
    \ In fact, its use is often promoted in certain situations. One situation is when\
    \ we need to make sure that the different destructors in an inheritance hierarchy\
    \ are called in order, particularly when the base class pointer is referring to\
    \ a derived type hierarchy. It must be noted here that the order of destructors\
    \ in an inheritance hierarchy is opposite to that of constructors.\n\nConsider\
    \ the following class declarations that make use of destructors:\n\n```\nclass\
    \ A {\n    public:\n    ~A()\n    {\n        //Base class destructor\n    }\n\
    }\nclass B : public A {\n    public:\n    ~B()\n    {\n        //Derived destructor\n\
    \    }\n}\nmain()\n{\n    A *ptr = new B();\n    delete ptr;\n}\n```\n\nIn the\
    \ above class declarations, both base class A and the derived class B have their\
    \ own destructors. Now, an A class pointer has been allocated a B class object.\
    \ When this object pointer is deleted using the delete operator, it will trigger\
    \ the base class destructor and the derived class destructor won't be called at\
    \ all. This may lead to a memory leak situation. To make sure that the derived\
    \ class destructor is mandatorily called, we must declare the base class destructor\
    \ as virtual, as shown below."
