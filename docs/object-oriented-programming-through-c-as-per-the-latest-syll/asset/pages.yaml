    # **Table A.1** (Contd.)


    | calc_liability() | This applicant class function is used to assess the loan
    applicant''s current liabilities and calculate a credit score. |

    | display_score() | This applicant class function is used to display the credit
    score and rate the applicant as high risk, average risk or low risk customer.
    |


    Table A.2 depicts the logic used by the **Credit CalC** application for calculating
    the credit score:


    # **Table A.2.** Application logic


    | Score | Logic |

    | Initial stage | • At the start of application, the score is initialized to zero
    |

    | Applicant''s age | • If the age of the applicant lies between 22 and 30, the
    score is incremented by 2

    • If the age lies between 30 and 35, the score is incremented by 1

    • If the age is above 35, the score is decremented by 1 |

    | Applicant''s liabilities | • If the sum of home and personal loan EMIs is less
    than one-fourth of the monthly salary, then the score is incremented by 5

    • If the sum is above 1/4th of the monthly salary but less than its 1/3rd, then
    the score is incremented by 3

    • If the sum is above 1/3rd of the monthly salary but less than its half, then
    the score is incremented by 1

    • If the sum is greater than half of the monthly salary, then the score is decremented
    by 1 |

    | Number of cheque bounce | • If the number of cheque bounces in the last six
    months is greater or equal to 2, then the score is decremented by 2

    • If the number of cheque bounces is equal to 1, then the score is decremented
    by 1

    • If there are no cheque bounces in the last six months, then the score is incremented
    by 1 |

    | Home loan versus personal loan EMIs | • If the total of home loan EMIs is greater
    or equal to the total of personal loan EMIs, then the score is incremented by
    1; else the score is decremented by 1 |

    | Own or rented house? | • If the applicant lives owned house then the score is
    incremented by 1; else if the applicant lives in a rented accommodation then the
    score is decremented by 1 |

    | Spouse working? | • If the applicant''s spouse is working then the score is
    incremented by 1; else the score is decremented by 1 |

    | Dependent parents? | • If the applicant has dependent parents then the score
    is decremented by 1; else the score is incremented by 1 |

    | Company tier | • If the company with which the applicant is employed is a tier
    1 company then the score is incremented by 3

    • If it is a tier 2 company then the score is incremented by 2; else, the score
    is decremented by 1 |'
