  md: '# 454 Object Oriented Programming through C++


    on the other hand, turns the software requirements into specifications for objects
    and derives class hierarchies from which the objects can be created. Finally,
    object-oriented programming (OOP) refers to the implementation of the program
    using objects, in an object-oriented programming language such as C++.


    By developing specifications of the objects found in the problem space, a clear
    and well-organized statement of the problem is actually built into the application.
    These objects form a high-level layer of definitions that are written in terms
    of the problem space. During refinement of the definitions and the implementation
    of the application objects, other objects are identified. Figure 15.5 illustrates
    the layers of the object specifications that result from this process.


    ![](img/c8042bb2c98f96c5758608865c161311_470_0.png)


    All the phases in the object-oriented approach work more closely together because
    of the commonality of the object model. In one phase, the problem domain objects
    are identified, while in the next phase additional objects required for a particular
    solution are specified. The design process is repeated for these implementation-level
    objects.


    In contrast to the top-down functional decomposition approach, the object-oriented
    approach has many attributes of both the top-down and bottom-up designs. The top
    functional techniques can be applied to the design of individual classes, while
    the final system can be constructed with the help of class modules using the bottom-up
    approach.


