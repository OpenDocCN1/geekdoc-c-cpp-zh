  md: "# Inheritance. Extending Classes\n\n![](img/c8042bb2c98f96c5758608865c161311_253_0.png)\n\
    \n**Fig. 8.6** A simple view of access control to the members of a class\n\n#\
    \ 8.5 MULTILEVEL INHERITANCE\n\nIt is not uncommon that a class is derived from\
    \ another derived class as shown in Fig. 8.7. The class **A** serves as a base\
    \ class for the derived class **B**, which in turn serves as a base class for\
    \ the derived class **C**. The class **B** is known as **intermediate** base class\
    \ since it provides a link for the inheritance between **A** and **C**. The chain\
    \ **ABC** is known as inheritance path.\n\nA derived class with multilevel inheritance\
    \ is declared as follows:\n\n```\nclass A{...};\\                // Base class\n\
    class B: public A {...};      // B derived from A\nclass C: public B {...};  \
    \    // C derived from B\n```\n\nThis process can be extended to any number of\
    \ levels.\n\n| Base class | Grandfather |\n| Intermediate base class | Father\
    \ |\n| Derived class | Child |\n\nLet us consider a simple example. Assume that\
    \ the test results of a batch of students are stored in three different classes.\
    \ Class **student** stores the roll-number, class **test** stores the marks obtained\
    \ in the tests and class **result** contains the **total marks** obtained in the\
    \ test. The class **result** can inherit the details of the marks obtained in\
    \ the test and the roll-number of students through multilevel inheritance. Example:\n\
    \n**Fig. 8.7** Multilevel inheritance\n\n```\nclass student {\n  protected:\n\
    \  int roll_number;\npublic:\n  void get_number(int);\n  void put_number(void);\n\
    };\n```"
