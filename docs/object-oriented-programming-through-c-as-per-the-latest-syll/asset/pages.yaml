  md: "# 6.2 CONSTRUCTORS\n\nA constructor is a 'special' member function whose task\
    \ is to initialize the objects of its class. It is special because its name is\
    \ the same as the class name. The constructor is invoked whenever an object of\
    \ its associated class is created. It is called constructor because it constructs\
    \ the values of data members of the class.\n\nA constructor is declared and defined\
    \ as follows:\n\n```\n// class with a constructor\nclass integer\n{\n    int m,\
    \ n;\n    public:\n        integer(void); // constructor declared\n    ...\n}\n\
    integer ::::integer(void) // constructor defined\n{\n    m = 0; n = 0;\n}\n```\n\
    \nWhen a class contains a constructor like the one defined above, it is guaranteed\
    \ that an object created by the class will be initialized automatically. For example,\
    \ the declaration\n\n```\ninteger int1;\n```\n\nnot only creates the object int1\
    \ of type integer but also initializes its data members m and n to zero. There\
    \ is no need to write any statement to invoke the constructor function (as we\
    \ do with the normal member functions). If a 'normal' member function is defined\
    \ for zero initialization, we would need to invoke this function for each of the\
    \ objects separately. This would be very inconvenient, if there are a large number\
    \ of objects.\n\n> A constructor that accepts no parameters is called the default\
    \ constructor. The default constructor for class A is A(). If no such constructor\
    \ is defined, the compiler supplies a default constructor. To make a statement\
    \ such as\n\n```\nA a;\n```\n\ninvokes the default constructor of the compiler\
    \ to create the object a.\nThe constructor functions have some special characteristics.\
    \ These are the following:\n\n+   - They should be declared in the public section.\n\
    - They are invoked automatically when the objects are created.\n- They do not\
    \ have return types, not even void and therefore, they cannot return return values.\n\
    - They cannot be inherited, though a derived class can call the base class constructor.\n\
    - Like other C++ functions, they can have default arguments."
