    # 10.6 FILE POINTERS AND THEIR MANIPULATIONS


    Each file has two pointers known as the file pointers. Each of them is called
    the input pointer (or get pointer) and the other is called the output pointer
    (or put pointer). We can use these pointers to move through the files while reading
    or writing. The input pointer is used for reading the contents of a given file
    location and the output pointer is used for writing to a given file location.
    Each time an input or output operation takes place, the appropriate pointer is
    automatically advanced.


    # Default Actions


    When we open a file in read-only mode, the input pointer is automatically set
    at the beginning so that we can read the file from the start. Similarly, when
    we open a file in write-only mode, the existing contents are deleted and the output
    pointer is set at the beginning. This enables us to write to the file from the
    start. In case, we want to open an file to add more data, the file is opened in
    ‘append’ mode. This moves the output pointer to the end of the file (i.e., the
    end of the contents). See Fig. 10.7.


    "hello" file


    ![](img/c8042bb2c98f96c5758608865c161311_335_1.png)


    Fig. 10.7 Action on file pointers while opening a file'
