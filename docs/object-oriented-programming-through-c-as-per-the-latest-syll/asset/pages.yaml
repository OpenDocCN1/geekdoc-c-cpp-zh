  md: '# D.1 INTRODUCTION


    C++ is one of the most popular languages due to its power and portability. It
    is available for different operating systems such as DOS, OS/2, UNIX, Windows
    and many others. C++ programs implemented under Windows are called Visual C++
    programs. Therefore, there is no difference between C++ and Visual C++ programs
    in terms of programming but the difference lies in terms of implementation.


    A C++ compiler for implementation under Windows is known as Visual C++. A C++
    program running on MS-DOS will also run successfully under Windows. This is because,
    the rules of programming are the same; only the environment of implementation
    is different and is shown in Fig. D.1.


    ![](img/c8042bb2c98f96c5758608865c161311_532_0.png)


    Fig. D.1 C++ Implementation environments


    A C++ programmer can easily become a Visual C++ programmer if he knows how to
    use the implementation tools of his Visual C++ system. In this appendix, we introduce
    the features of Microsoft Visual C++ and discuss how to create, compile and execute
    C++ programs under Windows.


    The Microsoft Corporation has introduced a Windows based C++ development environment
    named as Microsoft Visual C++ (MSVC). This development environment integrates
    a set of tools enable a programmer to create and run C++ programs with ease and
    style. Microsoft calls this integrated development environment (IDE) as Visual
    Workbench. Microsoft Visual Studio, a product sold by Microsoft Corporation, also
    includes Visual C++, in addition to other tools like Visual Basic, J++, Visual
    Foxpro, etc.


    # D.2 THE VISUAL WORKBENCH


    It is important to be familiar with the Visual Workbench that will be extensively
    used in the program development. The Visual Workbench is a visual user interface
    designed to help implement C++ pro-'
  merge: -1
