  md: '# Operator Overloading and Type Conversions 197


    where return type is the type of value returned by the specified operation and
    op is the operator overloaded. operator op is the function name, where operator
    is a keyword.


    Operator functions must be member functions (nonstatic) or friend functions. A
    basic difference between them is that a friend function will have one argument
    for unary operators and two for binary operators, while a member function has
    no arguments for unary operators and only one for binary operators. This is because
    the object used to invoke the member function is passed implicitly and is therefore
    available for the member function. This is not the case with friend functions.
    Arguments may be passed by value or reference. Operator functions are declared
    in the class using prototypes as follows:


    ```

    vector operator+(vector);          // vector addition

    vector operator();                   // unary minus

    friend vector operator+(vector,vector);// vector addition

    friend vector operator-(vector); // unary minus

    vector operator-(&);           // subtraction

    int operator==(vector);         // comparison

    friend int operator==(vector); // comparison

    ```


    vector is a data type of class and may represent both magnitude and direction
    (as in physics and engineering) or a series of points called elements (as in mathematics).


    The process of overloading involves the following steps:


    +   1. Create a class that defines the data type that is to be used in the overloading
    operation.

    2. Declare the operator function op() in the public part of the class. It may
    be either a member function or a friend function.

    3. Declare the operator function to implement the required operations.


    Overloaded operator functions can be invoked by expressions such as


    ```

    op x or x op

    ```


    for unary operators and


    ```

    x op y

    ```


    for binary operators. op x (or x op) would be interpreted as


    ```

    operator op (x)

    ```


    for friend functions. Similarly, the expression x op y would be interpreted as
    either


    ```

    x.operator op (y)

    ```


    in case of member functions, or


    ```

    operator op (x,y)

    ```


    in case of friend functions. When both the forms are declared, standard argument
    matching is applied to resolve any ambiguity.'
