    \ | Call by value | Return by reference | Inline functions | Default arguments\
    \ | Constant arguments | Function overloading\n\n# 4.1 INTRODUCTION\n\nWe know\
    \ that functions play an important role in C program development. Dividing a program\
    \ into functions is one of the major principles of top-down, structured programming.\
    \ Another advantage of using functions is that it is possible to reduce the size\
    \ of a program by calling and them at different places in the program.\n\nRecall\
