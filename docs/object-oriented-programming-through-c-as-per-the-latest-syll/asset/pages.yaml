  md: 'extend the capabilities of a class. Another interesting application of inheritance
    is to use it as a support to the hierarchical design of a program. Many programming
    problems can be cast into a hierarchy where certain features of one level are
    shared by many others below that level.


    As an example, Fig. 8.9 shows a hierarchical classification of students in a university.
    Another example could be the classification of accounts in a commercial bank as
    shown in Fig. 8.10. All the students have certain things in common and, similarly,
    all the accounts possess certain common features.


    ![](img/c8042bb2c98f96c5758608865c161311_262_0.png)


    Fig. 8.9 Hierarchical classification of students


    ![](img/c8042bb2c98f96c5758608865c161311_262_1.png)


    Fig. 8.10 Classification of bank accounts


    In C++, such problems can be easily converted into class hierarchies. The base
    class will include all the features that are common to the subclasses. A subclass
    can be constructed by inheriting the properties of the base class. A subclass
    can serve as a base class for the lower level classes, and so on.'
