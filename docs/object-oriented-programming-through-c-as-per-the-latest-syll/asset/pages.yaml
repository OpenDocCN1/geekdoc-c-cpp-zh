  md: "```\nclass A {\n    public:\n        virtual ~A()\n        {\n            //Base\
    \ destructor\n        }\n};\n```\n\n# SUMMARY\n\n+   - Polymorphism simply means\
    \ one having multiple forms.\n- There are two types of polymorphism, namely compile\
    \ time polymorphism and run time polymorphism.\n- Functions and operators overloading\
    \ are examples of compile time polymorphism. The overloaded member functions are\
    \ selected for invoking by matching arguments, both type and number. The compiler\
    \ knows this information at the compile time and, therefore, compiler is able\
    \ to select the appropriate function for a particular call at the compile time\
    \ itself. This is called early or static binding or static linking. It means that\
    \ an object is bound to the function at compile time.\n- In time polymorphism,\
    \ an appropriate member function is selected while the program is running. C++\
    \ supports run time polymorphism with the help of virtual functions. It is called\
    \ late or dynamic binding where the appropriate function is selected dynamically\
    \ at runtime. Dynamic binding requires pointers to objects and is one of the powerful\
    \ features of C++.\n- Object pointers are useful in creating objects at runtime.\
    \ It can be used to access the public members of an object, with an arrow operator.\n\
    - A pointer refers to an object that currently invokes a member function. For\
    \ example, the function call a.show() will set the pointer 'this' to the address\
    \ of the object 'a'.\n- Pointers to objects of a base class are compatible with\
    \ pointers to objects of a derived class. Therefore, we can use a single pointer\
    \ variable to point objects of base class as well as derived classes.\n- When\
    \ a function is made virtual, C++ determines which function to call at runtime\
    \ on the type of object pointed to by the base pointer, rather than the type of\
    \ the pointer. By making the base pointer to point to different objects, we can\
    \ execute different versions of the virtual function.\n- Run time polymorphism\
    \ is achieved only when a virtual function is accessed through a pointer to the\
    \ base class. It cannot be achieved using object name or with the dot operator\
    \ to access virtual function.\n- We have virtual destructors but not virtual constructors.\n\
    - If a virtual function is defined in the base class, it need not necessarily\
    \ redefined in the derived class. In such cases, the respective classes will invoke\
    \ the base class function.\n- A virtual function, equated to zero is called a\
    \ pure virtual function. It is a function declared in a base class that has no\
    \ definition relative to the base class. A class containing such pure function\
    \ is an abstract class."
