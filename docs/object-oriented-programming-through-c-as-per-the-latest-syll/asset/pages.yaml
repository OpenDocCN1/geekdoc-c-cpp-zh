    # 15.1 INTRODUCTION


    Software engineers have been trying various tools, methods, and procedures to
    control the process of software development in order to build high-quality software
    with improved productivity. The methods provide "how to s" for building the software
    while the tools provide automated or semi-automated support for the methods. They
    are used in all the stages of software development process, namely, planning,
    analysis, design, development and maintenance. The software development procedures
    integrate the methods and tools together enable rational and timely development
    of software systems (Fig. 15.1). They provide guidelines as how to apply the methods
    and tools, how to produce the deliverables at each stage, what controls to apply
    and what milestones to assess the progress.


    ![](img/c8042bb2c98f96c5758608865c161311_464_0.png)


    There exist a number of software development paradigms, each using a different
    set of methods and tools. The selection of a particular paradigm depends on the
    nature of the application, the-programming language used, and the controls and
    deliverables required. The development of a successful system depends not only
    on the use of the appropriate methods and techniques but also on the developer''s
    commitment to the objectives of the system. A successful system must'
