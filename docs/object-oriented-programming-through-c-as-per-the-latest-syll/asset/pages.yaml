    # 2.6 MANAGING OUTPUT WITH MANIPULATORS


    The header iomanip provides a set of functions called manipulators which can be
    used to manipulate the output formats. They provide the same features as the ios
    member functions and flags. Some manipulators are more convenient to use than
    their counterparts in the class ios. For example, two or more manipulators can
    be used as a chain in one shown as below:


    ```

    cout << manipulator1 << manipulator2 << manipulator3 << item;

    cout << manipulator1 << item1 << manipulator2 << item2;

    ```


    This kind of concatenation is useful when we want to display several columns of
    output.


    The most commonly used manipulators are shown in Table 2.6. The table also gives
    their meaning and equivalents. To access these manipulators, we must include the
    file iomanip in the program.'
