    # Derived Containers


    The STL provides three derived containers namely, stack, queue, and priority_queue.
    These are also known as container adaptors.


    Stacks, queues and priority queues can be created from different sequence containers.
    The derived containers do not support iterators and therefore cannot be used for
    data manipulation. However, they support two member functions pop() and push()
    for deleting and inserting operations.


    # 11.12 ALGORITHMS


    Algorithms can be used generally across a variety of containers for processing
    their contents. Although each container provides functions for its basic operations,
    STL provides more than sixty standard algorithms to support more extended or complex
    operations. Standard algorithms also permit us to work with two types of containers
    at the same time. Remember, STL algorithms are not member functions or friends
    of containers. They are standalone template functions.


    STL algorithms reinforce the philosophy of reusability. By using these algorithms,
    programmers can save a lot of time and effort. To have access to the STL algorithms,
    we must include <algorithm> in our program.


    STL algorithms, based on the nature of operations they perform, may be categorized
    under:


    +   - Mutating algorithms

    - Sorting algorithms

    - Set algorithms

    - Relational algorithms


    These algorithms are summarized in Tables 11.3 to 11.7. STL also contains a few
    numeric algorithms under the header file <numeric>. They are listed in Table 11.8.


