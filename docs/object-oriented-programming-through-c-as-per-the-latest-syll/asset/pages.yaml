  md: "# The dynamic_cast Operator\n\nThe dynamic cast is used to cast the type of\
    \ an object at runtime. Its main application is to perform casts on polymorphic\
    \ objects. Recall that polymorphic objects are created by base classes that contain\
    \ virtual functions. It takes the form:\n\n```\ndynamic_cast<type>(object)\n```\n\
    \nThe object is a class object whose type is to be checked and cast. It casts\
    \ the type of object to type. It never performs an invalid conversion. It checks\
    \ if the conversion is legal at runtime. If the conversion is not valid, it returns\
    \ NULL.\n\nThe type must be a pointer or a reference to a defined class. The argument\
    \ must be an expression that resolves to a pointer or reference. The use of the\
    \ operator dynamic_cast() is also called a type-safe downcast.\n\n# The typeid\
    \ Operator\n\nWe can use the typeid operator to obtain the types of unknown objects,\
    \ such as their class name at runtime. For example, the statement\n\n```\nchar\
    \ *objectType = typeid(object).name();\n```\n\nwill assign the type of \"object\"\
    \ to the character array objectType which can be printed out, if necessary. To\
    \ do this, it uses the name() member function of the type_info class. The object\
    \ may be of type int, float, or of any class.\n\nWe must include <typeinfo> header\
    \ file to use the operators dynamic_cast and typeid which provide run-time type\
    \ information (RTTI).\n\nAs the name suggests, RTTI is the process of determining\
    \ the dynamic type of an object at runtime. While we may have declared a pointer\
    \ with some static type, it is possible that at runtime it point to any class\
    \ derived from the static type. The following example demonstrates RTTI using\
    \ typeid operator:\n\n```\n#include <iostream>\n#include <typeinfo>\nclass Org\n\
    {\npublic:\n    // Members of Org class\n    virtual ~Org() {}\n};\nclass Dept\
    \ : public Org\n{\n    // Members of Dept class\n};\n\nint main ()\n```"
