    \ C++ operators except the following:\n  - class member operator(*)\n  - scope\
    \ resolution operator(:)\n  - size operator(sizeof)\n  - conditional operator(?)\n\
    - Operator overloading is done with the help of a special function, called operator\
    \ function, which describes the special task to operator.\n- There are certain\
    \ restrictions and limitations in overloading operators. Operator functions must\
    \ either be member functions (nonstatic) or friend functions. The overloading\
    \ operator must have at least one operand of user-defined type.\n- The compiler\
    \ does not support automatic type conversions for the defined data types. We can\
    \ using operator functions to achieve this.\n- The casting operator function should\
    \ satisfy the following conditions:\n  - It must be a class member.\n  - It must\
    \ not specify a return type.\n  - It must not have any arguments.\n\n# Key Terms\n\
    \narithmetic notation | binary operators | casting | casting operator | constructor\
    \ | conversion function | destination class | friend | friend function | functional\
    \ notation | manipulating strings | operator | operator function | operator overloading\
    \ | scalar multiplication | semantics | sizeof | source class | syntax | temporary\
    \ object | type conversion | unary operators"
