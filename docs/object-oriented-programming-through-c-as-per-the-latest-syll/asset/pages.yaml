  md: "# Object Oriented Programming through C++\n\nThe definition of main() would\
    \ look like this:\n\n```\nmain()\n{\n    // main program statements\n}\n```\n\n\
    In C++, the main() returns a value of type int to the operating system. C++, therefore,\
    \ explicitly defines main() as matching one of the following prototypes:\n\n```\n\
    int main();\nint main(int argc, char * argv[]);\n```\n\nThe functions that have\
    \ a return value should use the return statement for termination. The main() function\
    \ in C++ is, therefore, defined as follows:\n\n```\nint main()\n{\n    return\
    \ 0;\n}\n```\n\nSince the return type of functions is int by default, the keyword\
    \ int in the main() header is optional. Most C++ compilers will generate an error\
    \ or warning if there is no return statement. Turbo C++ issues the warning\n\n\
    > Function should return a value\n\nand proceeds to compile the program. It is\
    \ good programming practice to actually return a value from main().\n\nMany operating\
    \ systems test the return value (called exit value) to determine if there is any\
    \ problem. The normal convention is an exit value of zero means the program ran\
    \ successfully, while a non-zero value means there was a problem. The explicit\
    \ use of a return(0) statement will indicate that the program was successfully\
    \ executed.\n\n# 4.3 FUNCTION PROTOTYPING\n\nFunction prototyping is one of the\
    \ improvements added to C++ functions . The prototype describes the function interface\
    \ to the compiler by giving details such as the number and type of arguments and\
    \ the type of return values. When function prototyping, a template is always used\
    \ when declaring and defining a function. When a function is called, the compiler\
    \ uses the template to ensure that proper arguments are passed, and the return\
    \ value is treated correctly. Any violation in matching the arguments or the return\
    \ types will be caught by the compiler at the time of compilation itself. These\
    \ checks and controls did not exist in the C functions.\n\nRemember, C also uses\
    \ prototyping. But it was introduced first in C++ by Stroustrup and the success\
    \ of this feature inspired the ANSI C committee to adopt it. However, there is\
    \ a major difference in prototyping between C and C++. While C++ makes the prototyping\
    \ essential, ANSI C makes it optional, perhaps, to preserve the compatibility\
    \ with classic C.\n\n![](img/c8042bb2c98f96c5758608865c161311_122_0.png)"
