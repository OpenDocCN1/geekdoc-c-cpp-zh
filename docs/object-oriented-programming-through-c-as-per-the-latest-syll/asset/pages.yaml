  md: '# Appendix G 535


    +   18. A base class is one from which other, more specialized classes are derived.


    +   19. A derived class is one that inherits properties from a base class.


    +   20. Polymorphism is the capability of something to assume different forms.
    In an object-oriented language, polymorphism is provided by allowing a message
    or member function to mean different things depending on the type of object that
    receives the message.


    +   21. Instantiation is the process of creating an object from a class.


    +   22. We use the statement #include <iostream> a preprocessor directive that
    includes the necessary definitions for performing input and output operations.


    +   23. The C++ operator <<, the insertion operator, is used to insert text into
    an output stream.


    +   24. The C++ operator >>, the extraction operator, is used to insert text into
    an input stream.


    +   25. All C++ programs begin executing from the function. main main returns
    an integer value that indicates whether the program has been executed successfully
    or not. A value of 0 indicates successful execution, while the value 1 indicates
    that a problem or error occurred during the execution of the program.


    +   26. A value is returned from a function using the return statement. The statement


    ```

    return 0;

    ```


    returns the value 0.


    +   27. A C++ style comment begins with // and continues to the end of the line.


    +   28. A C++ identifiers consists of sequence of letters (upper and lowercase),
    digits, and underscores. A valid name cannot begin with a digit character.


    +   29. C identifiers are case sensitive. Name and name refer to two different
    identifiers.


    +   30. A variable must be defined before it is used. Smart programmers give a
    variable an initial value when it is defined.


    +   31. The automatic conversion specifies that operands of type char or short
    are converted to int before performing the operation.


    +   32. For an arithmetic operation involving two operands, the automatic conversion
    specifies that when the operands have different types, the one that is int is
    converted to long and a long operation is performed to produce a result.


    +   33. For an arithmetic operation involving two floating-point operands, the
    automatic conversion specifies that when the operands are of different types,
    the operand with less precision is converted to the type of the operand with greater
    precision.


    +   34. A mixed-mode arithmetic expression involves integral and floating-point
    operands. An integral operand is converted to the type of the floating-point operand,
    and the appropriate floating-point operation is performed.


    +   35. The precedence rules of C++ define the order in which operators are applied
    to operands. For the arithmetic operators, the precedence from highest to lowest
    is unary plus and minus; multiplication, division, and modules; addition and subtraction.


    +   36. It is a good programming practice to initialize a variable or an object
    when it is declared.'
