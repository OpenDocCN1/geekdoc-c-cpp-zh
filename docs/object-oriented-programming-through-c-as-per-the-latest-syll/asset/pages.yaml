  md: "# Object Oriented Programming through C++\n\nInheritance by the 'child' as\
    \ shown in Fig. 8.12 All the public and protected members of 'grandparent' are\
    \ inherited into 'child' twice, via 'parent1' and again via 'parent2'. This means,\
    \ 'child' would have duplicate sets of members inherited from 'grandparent'. This\
    \ introduces ambiguity and should be avoided.\n\n![](img/c8042bb2c98f96c5758608865c161311_266_0.png)\n\
    \nFig. 8.12 Multipath inheritance\n\nThe duplication of inherited members due\
    \ to these multiple paths can be avoided by making the common base class (ancestor\
    \ class) as virtual base class while declaring the direct or intermediate base\
    \ classes as shown below:\n\n```\nclass A // grandparent\n{\n    ...\n    ...\n\
    \    ...\n};\nclass B1 : virtual public A // parent1\n{\n    ...\n    ...\n  \
    \  ...\n};\nclass B2 : public virtual A // parent2\n{\n    ...\n    ...\n    ...\n\
    };\nclass C : public B1, public B2 // child\n{\n    ...\n    ...\n    ...\n  \
    \  // only one copy of A\n    // will be inherited\n};\n```\n\nWhen a class is\
    \ made a virtual base class, C++ takes necessary care to see that only one copy\
    \ of that class is inherited, regardless of how many inheritance paths exist between\
    \ the virtual base class and a derived class.\n\n> Note The keywords virtual and\
    \ public may be used in either order."
