  md: '# 5.10 MEMORY ALLOCATION FOR OBJECTS


    We have stated that the memory space for objects is allocated when they are declared
    and not when the class is specified. This statement is only partly true. Actually,
    the member functions are created and placed in the memory space only once they
    are defined as a part of a class specification. Since all the objects belonging
    to that class use the same member functions, no separate space is allocated for
    member functions when the objects are created. Only space for member variables
    is allocated separately for each object. Separate memory locations for the objects
    are essential, because the member variables will hold different data values for
    different objects. This is shown in Fig. 5.3.


    Common for all objects

    | member function 1 |

    | --- |

    | member function 2 |

    | --- | memory created when functions created |

    | Object 1 | Object 2 | Object 3 |

    | member variable 1 | member variable 1 | member variable 1 |

    | | | | |

    | member variable 2 | member variable 2 | member variable 2 |

    | | | | |

    | | | memory created when objects defined


    **Fig. 5.3 Object of memory**


    # 5.11 STATIC DATA MEMBERS


    A data member of a class can be qualified as static. The properties of a static
    member variable are similar to that of a C static variable. A static member variable
    has certain special characteristics. These are the following:


    +   * It is initialized to zero when the first object of its class is created.
    No other initialization is permitted.

    * Only one copy of that member is created for the entire class and is shared by
    all the objects of that class, no matter how many objects are created.

    * It is visible only within the class, but its lifetime is the entire program.'
