  md: "# Inheritance: Extending Classes\n\nThe general form of defining a derived\
    \ constructor\n\n| Derived-constructor | Arglist1, Arglist2, ... ArglistN, Arglist(D)\
    \ |\n|---|---|\n| base1(arglist1), base2(arglist2), | arguments for base(N) |\n\
    | ... | |\n| baseN(arglistN), Body of derived constructor |\n\nThe header line\
    \ of *derived-constructor* function contains two parts separated by a colon:).\
    \ The first part provides the declaration of the arguments that are passed to\
    \ the *derived-constructor* and the second part lists the function calls to the\
    \ base constructors.\n\n*base1(arglist1), base2(arglist2)* ... are function calls\
    \ to base constructors **base1(), base2(),** and therefore arglist1, arglist2,\
    \ ... represent the actual parameters that are passed to the base constructors.\
    \ Arglist1 through ArglistN are the argument declarations for base constructors\
    \ **base1** through baseN. Arglist(D) provides the parameters that are necessary\
    \ to initialize the members of the derived class.\n\nExample:\n\n```\nD(int a1,\
    \ int a2, float b1, float b2, int d1):\nnA(a1, a2),      /* call to constructor\
    \ A */\nB(b1, b2)      /* call to constructor B */\n{\n    d = d1;      /* executes\
    \ its own */\n}\n```\n\n(a1, a2) invokes the base constructor **A()** and **B(b1,\
    \ b2)** invokes another base constructor **B().** The constructor **D(i)** supplies\
    \ the values for these four arguments. In addition, it has one argument of its.\
    \ The constructor **D(i)** has a total of five arguments. **D()** may be invoked\
    \ as follows:\n\n```\nD objD(5, 12, 2.5, 7.54, 30);\n```\n\nThese values are assigned\
    \ to various parameters by the constructor **D()** as follows:\n\n```\n5 -> a1\n\
    12 -> a2\n2.5 -> b1\n7.54 -> b2\n30 -> d1\n```\n\nThe constructors for virtual\
    \ base classes are invoked before any nonvirtual base classes. If there are multiple\
    \ virtual base classes, they are invoked in the order in which they are declared.\
    \ Any non-virtual bases are then constructed before the derived class is executed.\
    \ Table 8.2."
