    max(a,b) = -1;\n```\n\nis legal and assigns -1 to a if it is larger, otherwise\
    \ -1 to b.\n\n# 4.6 INLINE FUNCTIONS\n\nOne of the objectives of using functions\
    \ in a program is to save memory space, which becomes appreciable when a function\
    \ is likely to be called many times. However, every time a function is called,\
    \ it takes a lot of extra time in executing a series of instructions for tasks\
    \ such as jumping to the stack, saving registers, pushing arguments to the stack,\
    \ and returning to the calling function. When a function is small, a substantial\
    \ percentage of execution time may be spent in such overheads.\n\nOne solution\
    \ to this problem is to use macros, popularly known as macros. Preprocessor macros\
    \ are popular in C. The major drawback with macros is that they are not really\
    \ functions and therefore, the usual error checking does not occur during compilation.\n\
    \nC++ has a new feature called inline function. An inline function is a function\
    \ that is expanded in line when it is invoked. That is, the compiler replaces\
    \ the function call with the corresponding code (similar to macros expansion).\
    \ The inline functions are defined as follows:\n\n```\ninline function-header\n\
    {\n    function body\n}\n```\n\nExample:\n\n```\ninline double cube(double a)\n\
    {\n    return(a*a*a);\n}\n```"
