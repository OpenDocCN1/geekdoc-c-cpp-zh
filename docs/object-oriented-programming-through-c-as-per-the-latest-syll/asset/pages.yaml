    # Variables


    The program uses four variables number1,number2, sum, and average. They are declared
    as float by the statement.


    ```

    float number1, number2, sum, average;

    ```


    All variables must be declared before they are used in the program.


    # Input Operator


    The statement


    ```

    cin >> number1;

    ```


    is an input statement and causes the program to wait for the user to type in a
    number. The number keyed in is placed in the variable number1. The identifier
    cin (pronounced ''cin'') is a predefined object in C++ that corresponds to the
    standard input. Here, this stream represents the keyboard.


    The operator >> is known as extraction or get operator. It extracts (or takes)
    the value from the keyboard and assigns it to the variable on its right (Fig.
    1.11). This corresponds to the family scanf() operation. Like << , the operator
    >> can also be overloaded.


    ![](img/c8042bb2c98f96c5758608865c161311_38_0.png)


    # Cascading of I/O Operators


    We have the insertion operator << repeatedly in the last two statements for printing
    results.


    The statement


    ```

    cout << "Sum = " << sum << "\n";

    ```


    first sends the string "Sum = " to cout and sends the value of sum. Finally, it
    sends the newline character that the output will be in the new line. The multiple
    of << in one statement is called cascading. When cascading an output operator,
    we should ensure blank spaces between different items. Using the cascading technique,
    the last two statements can be combined as follows:


    ```

    cout << "Sum = " << sum << "\n"

    << "Average = " << average << "\n";

    ```


    This is one statement but produces two lines of output. If you want only one line
    of output, the statement will be:


    ```

    cout << "Sum = " << sum << ","\n<< "Average = " << average << "\n";

    ```'
