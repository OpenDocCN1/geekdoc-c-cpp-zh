  md: '# New Features of ANSI C++ Standard


    Although these casts still work, ANSI C++ has added several new cast operators
    as *static casts*, *dynamic casts*, *reinterpret casts* and *constant casts*.
    It also adds another operator known as *typeid* to verify the type of unknown
    objects.


    # The static_cast Operator


    Like the conventional cast operators, the **static_cast** operator is used for
    any standard conversion of data types. It can also be used to cast a base pointer
    into a derived pointer. Its general form is:


    ```

    static_cast<type>(object)

    ```


    Here, *type* specifies the target type of the cast, and *object* is the object
    being cast into the new type. Examples:


    ```

    int m = 10;

    double x = static_cast<double>(m);

    char ch = static_cast<char>(m);

    ```


    The first statement casts the variable **m** to **double** and the second casts
    it it to **char**.


    Why use this new when the old style still works? The syntax of the one blends
    into the rest of the line and therefore it is difficult to locate them. The new
    format is easy to spot and search for using automated tools.


    # The const_cast Operator


    The **const_cast** operator is used to explicitly override **const** or **volatile**
    in a cast. It takes the following form:


    ```

    const_cast<type>(object)

    ```


    Since the purpose of this operator is to change its *const* or *volatile* attributes,
    the *target type* must be the same as the *source type*. It is mostly used for
    removing the constness of an object.


    # The reinterpret_cast Operator


    The **reinterpret_cast** is used to change one type into a fundamentally different
    type. For example, it can be used to cast a pointer type to integer pointer type
    or vice versa. It takes the following form:


    ```

    reinterpret_cast<type>(object)

    ```


    This operator should be used for casting inherently incompatible types. Examples:


    +   int m;

    float x;

    int* intptr;

    float* floatptr;

    intptr = reinterpret_cast<int*>(m);

    floatptr = reinterpret_cast<float*>( (x);'
