  md: '# Object Oriented Programming through C++


    Table 15.2 System development tools


    | Process | First generation | Second generation | Third generation |

    | --- | --- | --- | --- |

    | Physical processes | System flowcharts | Context diagrams | Inheritance graphs
    Object-relationship charts |

    | Data representation | Layout forms Grid charts | Data dictionary | Objects object
    dictionary |

    | Logical processes | Plisccript English narrative | Decision tables &trees Data
    graphs | Inheritance graphs Data flow diagrams |

    | Program representation | Program flowcharts I/O layouts | Structure charts Warner/Orr
    diagrams | State change diagrams Ptech diagrams Coad/Yourdon charts |


    This section gives an overview of some of the most frequently used first and second
    generation tools. Object-oriented development tools will be discussed later in
    this chapter (as when and they are required).


    +   **System flowcharts** A graphical representation of the important inputs,
    outputs, and data flow among the key points in the system.

    * **Program flowcharts** A graphical representation of the program logic.

    * **Plisccripts** A narrative description of executing a procedure.

    * **Layout forms** A format designed for putting the input data or displaying
    results.

    * **Grid charts** A chart showing the relationship between different modules of
    a system.

    * **Context diagrams** A diagram showing the inputs and their sources and their
    destinations. A context diagram basically outlines the system boundary.

    * **Data flow graphs** They describe the flow of data between the various components
    of a system. It is a network representation of the system which includes processes
    and data files.

    * **Data dictionary** A structured repository of data about data. It contains
    a list of terms and their definitions for all the data items and data stores.

    * **Structure chart** A graphical representation of the control logic of functions
    (modules) representing a system.

    * **Decision table** A table of contingencies for defining a problem and the actions
    to be taken. It presents the logic that tells us what to take when a given condition
    is true or otherwise.

