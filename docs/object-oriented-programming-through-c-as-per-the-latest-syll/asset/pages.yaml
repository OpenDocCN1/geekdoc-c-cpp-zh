  md: "# Key Concepts\n\nPolymorphism | Pointers | Pointers to objects | this pointer\
    \ | Pointers to derived classes | Virtual functions | Pure virtual function\n\n\
    # 9.1 INTRODUCTION\n\nPolymorphism is one of the crucial features of OOP. It simply\
    \ means 'one name, multiple forms'. We have already seen how the concept of polymorphism\
    \ is implemented using the overloaded functions and operators. The overloaded\
    \ member functions are 'selected' for invoking by matching arguments, both type\
    \ and number. This information is known to the compiler at the compile time and,\
    \ therefore, compiler is able to select the appropriate function for a particular\
    \ call at the compile time itself. This is called early binding or static binding\
    \ or static linking. Also known as compile polymorphism, early binding means that\
    \ an object is bound to its function call at compile time.\n\nNow let consider\
    \ a situation where the function name and prototype is the same in both the base\
    \ and derived classes. For example, consider the following class definitions:\n\
    \n```\nclass A\n{\n    int x;\n    public:\n    void show() {...}    // show()\
    \ in base class\n};\nclass B: public A\n{\n    int y;\n    public:\n    void show()\
    \ {...}    // show() in derived class\n};\n```\n\nHow do we use the member function\
    \ show() to print the values of objects of both the classes A and B? Since the\
    \ prototype of show() is the same in the places, the function is not overloaded\
    \ and therefore static binding does not apply. We have seen earlier that, in such\
    \ situations, we may use the class resolution operator to specify the class while\
    \ invoking the functions with the derived class objects.\n\nIt would be nice if\
    \ the appropriate member function could be selected while the program is running.\
    \ This is known as run time polymorphism. How could it happen? C++ supports a\
    \ mechanism as virtual function to achieve run time polymorphism. Please refer\
    \ Fig. 9.1."
