    # 10.1 INTRODUCTION


    Many real-life problems handle large volumes of data, and in such situations,
    we need to use some devices such as floppy disk or hard disk to store the data.
    The data is stored in these devices using the concept of files. A file is a collection
    of related data stored in a particular area on the disk. Programs can be designed
    to perform the read and write operations on these files.


    A program typically involves either or both of the following kinds of data communication:


    +   1. Data transfer between the console unit and the program.

    2. Data transfer between the program and a disk file.


    This is illustrated in Fig. 10.1.


    ![](img/c8042bb2c98f96c5758608865c161311_324_0.png)


    We have already discussed the technique of handling data communication between
    the console unit and the program. In this chapter, we will discuss various methods
    available for storing and retrieving the data from files.'
