  md: 'Applications with Files 321


    +   - ios::beg start of the file

    - ios::cur current position of the pointer

    - ios::end End of the file


    The seekg() moves the associated file''s ''get'' pointer while the seekp() function
    moves the associated file''s ''put'' pointer. Table 10.3 lists some pointer offset
    offset calls and their actions fout of ofstream object.


    Table 10.3 Pointer offset calls


    | Seek call | Action |

    | --- | --- |

    | fin.seekg(o, ios::beg); | Go to start |

    | fin.seekg(o, ios::cur); | Stay at the current position |

    | fin.seekg(o, ios::end); | Go to the end of file |

    | fin.seekg(m,ios::beg); | Move to (m + 1)th byte in the file |

    | fin.seekg(m,ios::cur); | Go forward by m byte from the current position |

    | fin.seekg(-m,ios::cur); | Go backward by m bytes from the current position |

    | fin.seekg(-m,ios::end); | Go backward by m bytes form the end |


    # 10.7 SEQUENTIAL INPUT AND OUTPUT OPERATIONS


    ![](img/c8042bb2c98f96c5758608865c161311_337_0.png)


    The file stream classes support a number of member functions for performing the
    input and output operations on files. One pair of functions, put() and get(),
    are designed for handling a single character at a time. Another pair of functions,
    write() and read(), are designed to write and read blocks of binary data.


    # put() and get() Functions


    The put() writes a single character to the associated stream. Similarly, the function
    get() reads a single character from the associated stream. Program 10.4 illustrates
    how these functions work on a file. The program requests for a string. On receiving
    the string, the program writes it, character by character, to the file by using
