- img_proc: true
  md: '# Introduction


    Around 50% of the software products were never delivered, and one-third of those
    which were were never used. It is interesting to note that only 2% were used as
    delivered, without being subjected to any changes. This illustrates that the software
    industry has a remarkably bad record in delivering products.


    Changes in user requirements have always been a major problem. Another study (Fig.
    1.2) shows that more than 50% of the systems required modifications due to changes
    in user requirements and data formats. It only illustrates that, in a changing
    world with dynamic business environment, requests for change are unavoidable and
    therefore systems must be adaptable and tolerant to changes.


    ![](img/c8042bb2c98f96c5758608865c161311_21_0.png)


    **Fig. 1.2 Breakdown of maintenance costs


    These studies and other reports on software implementation suggest that software
    products should be evaluated carefully for their quality before they are delivered
    and implemented. Some of the quality issues that must be considered for critical
    evaluation are


    +   1. Correctness

    2. Maintainability

    3. Reusability

    4. Openness and interoperability

    5. Portability

    6. Security

    7. Integrity

    8. User friendliness


    Selection and use of proper software tools would help resolving some of these
    issues.


    # 1.2 SOFTWARE EVOLUTION


    Ernest Tello, a well-known writer in the field of artificial intelligence, compared
    the evolution of software technology to the growth of a tree. Like a tree, the
