  md: "# 258 Object Oriented Programming through C++\n\nThe *assignment section* is\
    \ nothing but the body of the constructor function and is used to assign initial\
    \ values to its data members. The part immediately following the colon is known\
    \ as the *initialization section*. We can use this section to provide initial\
    \ values to the base constructors and initialize its class members. That we can\
    \ use of the sections to initialize the data members of the constructors class.\
    \ The initialization section basically contains a list of initializations separated\
    \ by commas. This is known as *initialization list*. Consider a simple example:\n\
    \n```\nclass XYZ {\n    int a;\n    int b;\npublic:\n    XYZ(int i, int j) : a(i),\
    \ b(2 * j) { }\n}\n\nmain() {\n    XYZ x(2, 3);\n}\n```\n\nThis program will initialize\
    \ **a** to **2** and **b** to **6**. Note how the data members are initialized,\
    \ just by using the variable name followed by the initialization value in the\
    \ parenthesis (like a function call). Any of the parameters of the argument list\
    \ may be used as the initialization value and the items in the list may be in\
    \ any order. For example, the constructor **XYZ** may also be written as:\n\n\
    ```\nXYZ(int i, int j) : b(i), a(i + j) { }\n```\n\nIn this case, **a** will be\
    \ initialized to 5 and **b** to 2. Remember, the data members are initialized\
    \ in the order of declaration, independent of the order in the initialization\
    \ list. This enables us to have state-members such as:\n\n```\nXYZ(int i, int\
    \ j) : a(i), b(a * j) { }\n```\n\nHere **a** is initialized to 2 and **b** to\
    \ 6. Remember, that a has declared first is initialized and its value is initialized\
    \ to **b**. However, the following will not work:\n\n```\nXYZ(int i, int j) :\
    \ b(i), a(b * j) { }\n```\n\nThe value of **b** is not available to **a** which\
    \ is to be initialized first.\n\nThe following statements are also valid:\n\n\
    ```\nXYZ(int i, int j) : a(i) { b = j; }\nXYZ(int i, int j) { a = i; b = j; }\n\
    ```\n\nWe can omit either section, if it is not needed. Program 8.8 illustrates\
    \ the use of initialization lists in the base and derived constructors."
