  md: '# # APPENDIX F

    C++ OPERATOR PRECEDENCE


    Table F.1 below lists all the operators supported by ANSI C++ according to their
    precedence (i.e., order of evaluation). Operators listed first have higher precedence
    than those listed next. Operators at the same level of precedence (between horizontal
    lines) evaluate either left to right or right to left according to associativity.


    | Operator | Meaning | Associativity | Use |

    | --- | --- | --- | --- |

    | :: | global scope | right to left | ::name |

    | :: | class, namespace scope | left to right | name::member |

    | -> | indirect member | left to right | object.member |

    | [] | subscript | | pointer->member |

    | () | function call | | pointer[expr] |

    | () | Type construction | | expr(arg) |

    | ++ | postfix increment | | m++ |

    | -- | postfix decrement | | m-- |

    | Sizeof | size of object | right to left | sizeof expr |

    | sizeof | size of type | | sizeof(type) |

    | ++ | prefix increment | | ++m |

    | -- | prefix decrement | | --m |

    | Typeid | type identification | | type(expr) |

    | const_cast | specialized cast | | const_cast<expr> |

    | dynamic_cast | specialized cast | | dynamic_cast<expr> |

    | reinterpret_cast | specialized cast | | reinterpret_cast<expr> |

    | static_cast | specialized cast | | static_cast<expr> |

    | () | traditional cast | | (type)expr |

    | ~ | logical NOT | | ~expr |

    | ! | | | ! expr |

    | -- | unary minus | | --expr |

    (Contd.)'
