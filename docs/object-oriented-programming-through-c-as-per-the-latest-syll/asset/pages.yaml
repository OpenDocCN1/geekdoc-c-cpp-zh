  md: "The template definition of vector class below illustrates the syntax of the\
    \ template:\n\n```\ntemplate<class T>\nclass vector\n{\n    T* v; // Type T vector\n\
    \    int size;\n    public:\n    vector(int m)\n    {\n        v = new T[size\
    \ = m];\n        for (int i=0; i<size; i++)\n        v[i] = 0;\n    }\n    vector(T*\
    \ a)\n    {\n        for (int i=0; i<size; i++)\n            v[i] = a[i];\n  \
    \  }\n    T operator*(vector &)\n    {\n        T sum = 0;\n        for(int i=0;\
    \ i<size; i++)\n            sum += this->v[i] * v[i];\n        return sum;\n \
    \   }\n};\n```\n\n> Note The class definition is very similar to an ordinary class\
    \ definition except the prefix template<class> and the use of type T. This prefix\
    \ tells the compiler that we are going to declare a template and use T as a name\
    \ in the declaration. Thus, vector has become a parameterized class with the type\
    \ T as its parameter. T may be substituted by any data type including the user-defined\
    \ types. Now, we can create vectors for different data types.\n\nExample:\n\n\
    ```\nvector <int> v1(10); // 10 element int vector\nvector <float> v2(25); //\
    \ 25 element float vector\n```\n\n> Note The type T may represent a class name\
    \ as well. Example:\nvector <complex> v3(5); // vector of 5 complex numbers\n\n\
    A class created from a class template is called a template class. The syntax for\
    \ defining an object of a template class is:\n\n```\nclassname<type> objectname(arglist);\n\
    ```\n\nThis process of creating a specific class from a class template is called\
    \ instantiation. The compiler will perform the error analysis only when an instantiation\
    \ takes place. It is, therefore, advisable to create and debug an ordinary class\
    \ before converting it into a template."
