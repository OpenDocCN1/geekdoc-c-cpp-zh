  md: '# 14.8 NEW HEADERS


    The ANSI C++ Standard has defined a new way to specify header files. They do not
    use .h extension to filenames.


    ```

    #include <iostream>

    #include <fstream>

    ```


    However, the traditional style <iostream.h, <fstream.h>, etc., is still supported.
    Some old header files are renamed as shown below:


    | Old style | New style |

    |--- |--- |

    | <assert.h> | <cassert> |

    | <ctype.h> | <ctype> |

    | <float.h> | <float> |

    | <limits.h> | <climits> |

    | <math.h> | <cmath> |

    | <stdio.h> | <cstdio> |

    | <stdlib.h> | <cstdlib> |

    | <string.h> | <string> |

    | <time.h> | <ctime> |


    +   SUMMARY

    - ANSI C++ Standard committee has added many new features to the original C++
    language specifications.

    - Two new data types bool and wchar_t have been added to enhance the range of
    data types available in C++.

    - The bool type can hold Boolean values, true and false.

    - The wchar_t type is meant to hold 16-bit character literals.

    - Four new cast operators have been added: static_cast, const_cast, reinterpret_cast
    and dynamic_cast.

    - The static_cast operator is used for any standard conversion of data types.

    - The const_cast operator may be used to explicitly change the const and volatile
    attributes of objects.

    - We can change the data type of an object to a fundamentally different type using
    the reinterpret_cast operator.

    - Casting of an object at run time can be achieved by the dynamic_cast operator.

    - Another new operator known as typedef can provide us run type information about
    objects.'
