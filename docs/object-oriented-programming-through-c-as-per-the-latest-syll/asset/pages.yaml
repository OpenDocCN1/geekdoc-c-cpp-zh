  md: 'Table 2.6 Manipulators and their meanings

    | Manipulator | Meaning | Equivalent |

    |---|---|--|

    | setw(int w) | Set the field width to w. | width() |

    | setprecision(int d) | Set the floating point precision to d. | precision() |

    | setfill(int c) | Set the fill character to c. | fill() |

    | setiosflags(long f) | Set the format flag f. | setf() |

    | resetiosflags(long f) | Clear the flag specified by f. | unsetf() |

    | endl | Insert new line and flush stream. | "\n" |


    Some examples of manipulators are given below:


    ```

    cout << setw(10) << 12345;

    ```


    This statement prints the value 12345 right-justified in a field width of 10 characters.
    The output can be made left-justified by modifying the statement as follows:


    ```

    cout << setw(10) << setiosflags(ios::left) << 12345;

    ```


    One statement can be used to format output for two or more values. For example,
    the statement


    ```

    cout << setw(5) << setprecision(2) << 1.2345

    << setw(10) << setprecision(4) << sqrt(2)

    << setw(15) << setiosflags(ios::scientific) << sqrt(3);

    << endl;

    ```


    will print all the three values in one line with the field sizes of 5, 10, and
    15 respectively. Note that each output is controlled by different sets of format
    specifications.


    We can join the manipulators and the ios functions in a program. The following
    segment of code is valid:


    ```

    cout.setf(ios::showpoint);

    cout.setf(ios::showpos);

    cout << setprecision(4);

    cout << setiosflags(ios::scientific);

    cout << setw(10) << 123.45678;

    ```


    > Note There is a difference in the way the manipulators are implemented compared
    to the ios member functions. The ios manipulator return the previous format state
    which can be used, if necessary. But the manipulator does not return the previous
    format state. In case, we need to save the old format state, we must use the ios
    member functions rather than the manipulators. Example:


    ```

    cout.precision(2); // previous state

    int p = cout.precision(4); // current state;

    ```


    When these statements are executed, p will hold the value of 2 (previous state)
    and the new format state will be 4. We can restore the previous format state as
    follows:


    ```

    cout.precision(p); // p = 2

    ```'
