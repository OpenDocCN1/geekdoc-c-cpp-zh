  md: 'We are using the fstream class to declare the streams. The fstream class inherits
    two buffers, for one input and for output, and synchronizes the movement of the
    file pointers on both buffers. That is, whenever we read from or write to the
    file, both the pointers move in tandem. Therefore, at any point of time, both
    the pointers point to the same byte.


    Since we have add new objects to the file as well as modify some of the existing
    objects, we open the file using ios::ate for input and output operations. Remember,
    the ios::app allows us to add data to the end of the file. The ios::ate mode sets
    the file pointers at the end of the file when opening it. We must therefore move
    the ''get'' pointer to the beginning of the file when seeking(g) to read the contents
    of the file.


    At the end of reading the program sets the current contents of the file, the EOF
    flag prevents any further reading or writing to the file. The EOF flag is turned
    off by the function clear(), which allows access to the file once again.


    After appending a new item, the program displays the contents of the appended
    file and also the total number of objects in the file and the memory space occupied
    by them.


    To modify an object, we should reach to the first byte of that object. This is
    achieved using the following


    ```

    int location = (object-1) * sizeof(item);

    inoutfile.seekp(location);

    ```


    The program accepts the number and the new values of the object to be modified
    and updates it. Finally, the contents of the appended and modified file are displayed.


    Remember, we are opening an existing file for reading and updating the values.
    It is, therefore, essential that the data members are of the same type and declared
    in the same order as in the existing file. Since, the member functions are not
    stored, they can be different.


    ![](img/c8042bb2c98f96c5758608865c161311_347_0.png)


    # 10.9 ERROR HANDLING DURING FILE OPERATIONS


    So far we have opening and using the files for reading and writing under the assumption
    that everything is fine with the files. This may not be true always. For instance,
    one of the following things may happen when dealing with the files:


    +   1. A file which we are attempting for reading does not exist.

    2. The file name used for a new file may already exist.

    3. We may attempt an invalid operation such as reading the end-of-file.

    4. There may not be any space in the disk for storing more data.

    5. We may use an invalid file name.

    6. We may attempt to perform an operation when the file is not opened for that
    purpose.


    The C++ file stream inherits a ''stream-state'' member from the class ios. This
    member carries information on the status of a file that is being used. The stream
    state member uses bits to store the status of the error conditions stated above.


    The class ios supports several member functions that can be used to read the status
    recorded in a file stream. These functions along with their meanings are listed
    in Table 10.4.'
