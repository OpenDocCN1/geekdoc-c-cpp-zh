  md: "The variables declared inside the class are known as data members and the functions\
    \ are known as member functions. Only the member functions can have access to\
    \ the private data members and private functions. However, the public members\
    \ (both functions and data) can be accessed from outside the class. This is illustrated\
    \ in Fig. 5.1. The binding of data and functions together into a single class-type\
    \ variable is referred to as encapsulation.\n\n![](img/c8042bb2c98f96c5758608865c161311_147_0.png)\n\
    \n# A Simple Class Example\n\nA typical class declaration would like\n\n```\n\
    class item\n{\n    int number;             // private declaration\n    float cost;\
    \             // private by default\npublic:\n    void getdata(int a, float b);\
    \ // functions declaration\n    void putdata(void);         // using prototype\n\
    };\n```\n\nWe usually give a class some meaningful name, such as item. This name\
    \ now becomes a new identifier that can be used to declare instances of that class\
    \ type. The class item contains two data members and two function members. The\
    \ data members are private by default while the functions are public. The declaration\
    \ getdata() can be used to assign values to the member variable name and cost,\
    \ and putdata() for displaying their values. These functions provide only access\
    \ to the data members from outside the class. This means that the data cannot\
    \ be accessed by any function that is not a member of the class item. Note that\
    \ the functions are declared, not defined. Actual function definitions will appear\
    \ later in the program. The data members are usually declared as private and the\
    \ member functions as public. Figure 5.2 shows two different notations used by\
    \ the OOP analysts to represent a class.\n\n# Creating Objects\n\nRemember that\
    \ the declaration of item as shown above does not define any objects of item it\
    \ but only specifies what they will contain. Once a class has been declared, we\
    \ can create variables of type by using the class name (like any other built-in\
    \ type variable)."
