    # 10.8 UPDATING A FILE: RANDOM ACCESS


    Updating is a routine task in the maintenance of any data file. The updating would
    include one or more of the following tasks:


    +   - Displaying the contents of a file

    - Modifying an existing item

    - Adding a new item

    - Deleting an existing item


    These actions require the file pointers to move to a particular location that
    corresponds to the item under consideration. This can be easily implemented if
    the file contains a collection of items/objects of equal lengths. In such cases,
    the size of each object can be obtained using the statement


    ```

    int object_length = sizeof(object);

    ```


    Then, the location of a desired object, say the mth object, may be obtained as
    follows:


    ```

    int location = m * object_length;

    ```


    The location gives the first byte of the file of the mth object. Now, we can set
    the file pointer to reach this byte with the help of seekg() or seekp.


    We can also find out the total number of objects in a file using the object_length
    as follows:


    ```

    int n = file_size/object_length;

    ```


    The file_size can be obtained using the function tellg() and tellp() when the
    file pointer is located at the end of the file.'
