    # 8.1 INTRODUCTION


    Reusability is yet another important feature of OOP. It is always nice if we could
    reuse something that already exists rather than trying to create the same all
    over again. It would not only save time and money also reduce frustration and
    increase reliability. For instance, the reuse of a class that has already been
    tested, debugged and used many times can save the effort of developing and testing
    the same again.


    Fortunately, C++ strongly supports the concept of *reusability*. The C++ classes
    can be reused in several ways. Once a class has been written and tested, it can
    be adapted by other programmers to suit their requirements. This is basically
    done by creating new classes, reusing the properties of the existing ones. The
    mechanism of deriving a new class from an old one is called *inheritance* (or
    derivation)*. The old class is referred to as the *base class* and the new one
    is called the *derived class* or subclass.


    The derived class inherits some or all of the traits from the base class. A class
    can also inherit properties from more than one class or from more one level. A
    derived class with only one base class, is called *single inheritance* and with
    several base classes is called *multiple inheritance*. On the other hand, the
    traits of one class may be inherited by more than one class. This process is known
    as *hierarchical inheritance*. The mechanism of deriving a class from another
    ‘derived class’ is known as *multilevel inheritance*. Figure 8.1 shows various
    forms of inheritance that could be used for writing extensible programs. The direction
    of arrow indicates the direction of inheritance. (Some authors show the arrow
    in opposite direction meaning “inherited from*.)'
