  md: "# Object Oriented Programming through C++\n\n+   - Constructors cannot be virtual.\
    \ (Meaning of virtual will be discussed later in Chapter 9.)\n- We cannot refer\
    \ to their addresses.\n- An object with a constructor (or destructor) cannot be\
    \ used as a member of a union.\n- They make `implicit calls` to the operators\
    \ new and delete when memory allocation is required.\n\nRemember, when a constructor\
    \ is declared for a class, initialization of the class objects becomes mandatory.\n\
    \n![](img/c8042bb2c98f96c5758608865c161311_190_0.png)\n\n# 6.3 PARAMETERIZED CONSTRUCTORS\n\
    \nThe constructor `integer()`, defined above, initializes the data members of\
    \ the objects to zero. However, in practice it may be necessary to initialize\
    \ the data elements of different objects with different values when they are created.\
    \ C++ permits us to achieve this objective by passing arguments to the constructor\
    \ function when the objects are created. The constructors that can take arguments\
    \ are called *parameterized constructors.\n\nThe constructor `integer()` may be\
    \ modified to take arguments as shown below:\n\n```\nclass integer\n{\n    int\
    \ m, n;\n    public:\n        integer(int x, int y); // parameterized constructor\n\
    \    ...\n}\ninteger :: integer(int x, int y)\n{\n    m = x; n = y;\n}\n```\n\n\
    When a constructor has been parameterized, the object declaration statement such\
    \ as `integer int1;` may not work. We must pass the initial values as arguments\
    \ to the constructor function when an object is declared. This can be done in\
    \ two ways:\n\n+   - By calling the constructor explicitly.\n- By calling the\
    \ constructor implicitly.\n\nThe following declaration illustrates the first method:\n\
    integer int1 = integer(100); // explicit call\nThis statement creates an integer\
    \ object int1 and passes the values 0 and 100 to it. The second is implemented\
