    \ of a variable anywhere in the scope. This means that a variable can be declared\
    \ right at the place of its first use. This makes the program much easier to write\
    \ and reduces the errors that may be caused by having to scan back forth. It also\
    \ makes the program easier to understand because the variables are declared in\
    \ the context of their use.\n\nThe example below illustrates this point.\n\n```\n\
