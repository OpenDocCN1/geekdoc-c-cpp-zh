  md: "# Object Oriented Programming through C++\n\n![](img/c8042bb2c98f96c5758608865c161311_148_0.png)\n\
    \nFor example,\n\n```\nitem x; // memory for x is created\n```\n\ncreates a variable\
    \ x of type **Item**. In C++, the class variables are known as **objects**. Therefore,\
    \ **x** is creates an object of type **item**. We may declare more than one object\
    \ in one statement. Example:\n\n```\nitem x, y, z;\n```\n\nThe declaration of\
    \ an object is similar to that of variable of any basic type. The necessary memory\
    \ space is allocated to an object at this stage. Note that class specification,\
    \ like a structure, provides only a **template** and does not create any memory\
    \ space for objects. Objects can also be created when a class is defined by placing\
    \ their names immediately after the closing brace, as we do in the case of structures.\
    \ That is to say, the definition\n\n```\nclass item\n{\n    ...\n} x,y,z;\n```\n\
    \nwould create the objects **x**, **y** and **z** of type **item**. This practice\
    \ is seldom followed because we would declare the objects far earlier where they\
    \ are used and not at the time of class definition.\n\n# Accessing Class Members\n\
    \nAs pointed out earlier, the private data of a class can be accessed only through\
    \ the member functions of that class. The **main()** cannot contain statements\
    \ that access **number** and **cost** directly. The following is the format for\
    \ calling a member function:\n\n```\nobject-name.function-name (actual-arguments);\n\
    ```\n\nFor example, the function call statement\n\n```\nx.getdata(100, 75.5);\n\
    ```\n\nis valid and assigns the value 100 to **number** and 75.5 to **cost** of\
    \ the object **x** by implementing the **getdata()** function. The assignments\
    \ occur in the actual function. Please refer Sec. 5.4 for further details."
