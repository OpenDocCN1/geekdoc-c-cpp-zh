  md: "Function prototype is a declaration statement in the calling program and is\
    \ of the following form:\n\n```\ntype function-name (argument-list);\n```\n\n\
    The argument-list contains the types and names of arguments that must be passed\
    \ to the function.\nExample:\n\n```\nfloat volume(int x, float y, float z);\n\
    ```\n\nNote that each argument variable must be declared independently inside\
    \ the parentheses. That is, a combined declaration like\n\n```\nfloat volume(int\
    \ x, float y, z);\n```\n\nillegal.\n\nIn a function declaration, the names of\
    \ the arguments are dummy variables and therefore, they are optional. This, the\
    \ form\n\n```\nfloat volume(int, float, float);\n```\n\nis acceptable at the place\
    \ of declaration. At this stage, the compiler only checks for the type of arguments\
    \ when the function is called.\n\nIn general, we can either include or exclude\
    \ the variable names in the argument list of prototypes. The variable names act\
    \ as placeholders, and therefore, if names are used, they don't have to match\
    \ the names used in the function call or function definition.\n\nIn the function\
    \ definition, names are required because the arguments must be referenced inside\
    \ the function:\n\n```\nfloat volume(int a,float b,float c)\n{\n    float v =\
    \ a*b*c;\n    ...\n    ....\n}\n```\n\nThe function volume() can be invoked in\
    \ a program as follows:\nfloat cubel = volume(b1,w1,hl); // Function call\n\n\
    The variable b1, w1, and h1 are known as the actual parameters which specify the\
    \ dimensions of cubel. Their types (which have been declared earlier) should match\
    \ with the types declared in the prototype. Remember, the calling statement should\
    \ not include type names in the argument list.\n\nWe can also declare a function\
    \ with an empty argument list, as in the following example:\n\n```\nvoid display(\
    \ );\n```\n\nIn C++, this means that the function does not pass any parameters.\
    \ It is identical to the statement\n\n```\nvoid display(void);\n```"
