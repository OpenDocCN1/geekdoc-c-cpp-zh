  md: "```\n{\nOrg orgl;\nDept deptpl;\nOrg *ptr = &deptl;\n\nstd::cout << typeid(ptr).name()\
    \ << std::endl;\n// Will not display Org * i.e. the static pointer type\n\nstd::cout\
    \ << typeid(*ptr).name() << std::endl;\n// This will display Dept i.e. the dynamic\
    \ pointer type\n}\n```\n\nIn the above program, the type (object) calls a reference\
    \ to the type_info object that contains information about the object's type. The\
    \ member function name () of the type_info class is used for retrieving the name\
    \ of the object type.\n\n# 14.4 CLASS IMPLEMENTATION\n\nANSI C++ Standard adds\
    \ two unusual keywords, explicit and mutable, for use with class members.\n\n\
    # The explicit keyword\n\nThe explicit keyword is used to declare class constructors\
    \ to be \"explicit\" constructors. We have seen earlier, while discussing constructors,\
    \ that any constructor called with one argument performs implicit conversion in\
    \ the constructor which the type received by the constructor is converted to an\
    \ object of the class in which the constructor is defined. Since the conversion\
    \ is automatic, we need not apply any casting. In case, we do not want such automatic\
    \ conversion to take place, we may do so by declaring the one-argument constructor\
    \ as explicit as shown below:\n\n```\nclass ABC {\n    int m;\npublic:\n    explicit\
    \ ABC (int i) // constructor\n    {\n        m = i;\n    }\n    // ...\n    //\
    \ ...\n};\n```\n\nHere, objects of ABC class can be created using only the following\
    \ form:\n\n```\nABC abc1(100);\n```\n\nThe automatic conversion form\n\n```\n\
    ABC abc1 = 100;\n```\n\nis not allowed and is also illegal. Remember, this form\
    \ is permitted when the keyword explicit is not applied to the conversion."
