    # A.1 MINOR PROJECT: CREDIT CalC


    # Learning Objectives


    After going through this project, you will be able to


    +   - learn how real-world applications are developed using C++ programming, and

    - develop menu-driven applications.


    # A.1.1 Credit CalC


    Credit CalC is a command-driven banking application that helps determine the credit
    worthiness of a loan applicant. The application takes into account various factors
    that could affect the repayment capability of the applicant in future. Some of
    key factors taken into consideration are:


    +   - Applicant''s age

    - Monthly salary

    - Current liabilities, such as existing loan EMIs

    - Bank transaction details

    - Accommodation status, i.e., owned house or rented

    - Spouse''s employment status

    - Whether the parents are dependent or not

    - Company tier


    After analyzing the factors, the Credit CalC application calculates a credit score
    and rates the applicant as high risk, average risk or low risk customer. Accordingly,
    a decision is taken to grant or deny credit or loan to the applicant.


    Table A.1. lists the key coding elements of the Credit CalC application:


    Table A.1. Key coding elements


    | Element | Description |

    |---|---|

    | applicant | This class is used to store and process loan applicant''s details.
    |

    | get_data() | This applicant class function is used to receive and store loan
    applicant''s details. |


    (Contd.)'
