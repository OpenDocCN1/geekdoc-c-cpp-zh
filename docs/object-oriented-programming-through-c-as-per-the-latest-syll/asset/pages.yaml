  md: "# 7.3 OVERLOADING UNARY OPERATORS\n\nLets consider the unary minus operator.\
    \ A minus operator when used as a unary, takes just one operand. We know that\
    \ this operator changes the sign of an operand when applied to a basic data item.\
    \ We will see how to overload this operator so that it can be applied to an object\
    \ in much the same way as is to an int or float variable. The unary minus when\
    \ applied to an object should change the sign of each of its data items.\n\nProgram\
    \ 7.1 shows how the unary minus operator is overloaded.\n\n# Program 7.1 Overloading\
    \ Unary Minus\n\n```\n#include <iostream>\n\nusing namespace std;\n\nclass space\n\
    {\n    int x;\n    int y;\n    int z;\npublic:\n    void getdata(int a, int b,\
    \ int c);\n    void display(void);\n    void operator-(); // overload unary minus\n\
    };\nvoid space :: getdata(int a, int b, int c)\n{\n    x = a;\n    y = b;\n  \
    \  z = c;\n}\nvoid space :: display(void)\n{\n    cout<<\"x\"=\"<<x<<\"x\";\n\
    \    cout<<\"y\"=\"<<y<<\"y\";\n    cout<<\"z\"=\"<<z<<\"\\n\";\n}\nvoid space\
    \ :: operator-()\n{\n    x = -x;\n    y = -y;\n}\n```\n\n(Contd.)"
