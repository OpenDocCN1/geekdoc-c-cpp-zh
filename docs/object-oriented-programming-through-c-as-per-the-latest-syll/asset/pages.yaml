  md: '# SUMMARY


    +   - C++ provides various types of tokens that include keywords, identifiers,
    constants, strings, and operators.


    +   - Identifiers refer to the names of variables, functions, arrays, classes,
    etc.


    +   - C++ provides an additional use of void, for declaration of generic pointers.


    +   - The enumerated data types differ slightly in C++. The tag names of the enumerated
    data types become new type names. That is, we can declare new variables using
    these tag names.


    +   - In C++, the size of character array should be one larger than the number
    of characters in the string.


    +   - C++ adds the concept of constant pointer and pointer to constant. In case
    of constant pointer, we can not modify the address that the pointer is initialized.
    In case of a pointer to a constant, contents of what it points cannot be changed.


    +   - Poointers are widely used in C++ for memory management and achieve polymorphism.


    +   - C++ provides a qualifier called const to declare named constants which are
    just like variables except that their values cannot be changed. A const modifier
    defaults to an int.


    +   - C++ is very strict regarding checking of variables. It does not allow to
    equate variables of two different types. The only way to break this is type casting.


    +   - A major application of the scope resolution (:) operator is in the classes
    to identify the class to which a member function belongs.


    +   - In addition to malloc(), calloc() and free, C++ also provides two operators,
    new and delete for the task of allocating and freeing the memory in a better and
    easier way.


    +   - C++ also provides manipulators to format the data display. The most commonly
    manipulators are endl and setw.


    +   - C++ supports seven types of expressions. When data types are mixed in an
    expression, C++ performs the conversion atomically using certain rules.


    +   - C++ also permits type conversion of variables and expressions using the
    type cast operators.


    +   - Like C, C++ also supports the three basic control structures namely, sequence,
    selection and loop, and implements them using various control statements such
    as, if, else, switch, ..while, while and for for.'
