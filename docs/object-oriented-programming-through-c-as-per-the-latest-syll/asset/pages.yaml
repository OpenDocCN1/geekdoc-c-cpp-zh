  md: "Examples:\n\n```\nclass derived: private base    // private derivation\n{\n\
    \    members of derived\n}\nclass derived: public base     // public derivation\n\
    {\n    members of derived\n}\nclass derived: base             // private derivation\
    \ by default\n{\n    members of derived\n};\n```\n\nWhen a base class is privately\
    \ inherited by a derived class, 'public members' of the base class become 'private\
    \ members' of the derived class and therefore the public members of the base class\
    \ can only be accessed by the member functions of the derived class. Remember,\
    \ a public member of a class can be accessed by its own objects using the *dot\
    \ operator*. The result is that no member of the base class is accessible to the\
    \ objects of the derived class.\n\nOn the other hand, when the base class is publicly\
    \ inherited, 'public members' of the base class become 'public members' of the\
    \ derived class and therefore they are accessible to the objects of the derived\
    \ class. In both cases, the private members are not inherited and therefore, the\
    \ private members of a base class will never become the members of its derived\
    \ class.\n\nIn inheritance, some of the base class data elements and member functions\
    \ are 'inherited' into the derived class. We can add our own data and member functions\
    \ and thus extend the functionality of the base class. Inheritance, when used\
    \ to modify and extend the capabilities of the existing classes, becomes a very\
