  md: '# CHAPTER ORGANIZATION


    The book has 6 units, Unit 1 deals with basics of object oriented programming
    and I/O in C++. Unit 2 deals with basic concepts of C++ programming. Unit 3 deals
    with classes, objects and member functions. Unit 4 deals with constructors, destructors,
    destructor overloading and type conversion. Unit 5 deals with inheritance, polymorphism
    and virtual functions. Unit 6 deals with file operations, generic programming
    and exception handling. Unit 7 and Appendices provide additional information on
    C++.


