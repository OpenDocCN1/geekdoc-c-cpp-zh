  md: '# Sequence Containers


    Sequence containers store elements in a linear sequence, like a line as shown
    in Fig. 11.3. Each element is related to other elements by its position on the
    line. They all expand themselves to allow insertion of elements and all of them
    support a number of operations on them.


    ![](img/c8042bb2c98f96c5758608865c161311_377_0.png)


    The STL provides three types of sequence containers:


    +   * Vector

    * List

    * Deque


    Elements in all these containers can be accessed using an iterator. The difference
    between the three of them is related only to their performance. Table 11.2 compares
    their performance in the speed of random access and insertion or deletion of elements.


    | Container | Random access | Insertion or deletion in the middle | Insertion
    or deletion at the ends |

    |---|---|---||

    | vector | Fast | Slow | Fast at back |

    | list | Slow | Fast | Fast at front |

    | deque | Fast | Slow | Fast at both the ends |


    # Associative Containers


    Associative containers are designed to support direct access to elements using
    keys. They are not sequential. There are four types of associative containers:


    +   * Set

    * Multiset

    * Map

    * Multimap


    All these containers store data in a structure tree which facilitates fast searching,
    deletion, and insertion. However, they are very slow for random access and inefficient
    for sorting.


    Containers set and multiset store a number of items and provide operations for
    manipulating them using the values as the keys. For example, a set might store
    objects of the student class which are ordered alphabetically using names as keys.
    We can search for a desired student using his name as the key. The main difference
    between a set and a multiset is that a multiset allows duplicate items while a
    set does not.


    Containers map and multimap are used to store pairs of items, one called the key
    and the other called the value. We can manipulate the values using the keys associated
    with them. The values are'
