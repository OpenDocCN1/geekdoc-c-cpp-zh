    # Opening Files Using open()


    As stated earlier, the function open() can be used to open multiple files that
    use the same stream object. For example, we may want to process a set of files
    sequentially. In such cases, we may create a single stream object and use it to
    open each file in turn. This is done as follows:


    ```

    file-stream-class stream-object;

    stream-object.open("filename");

    ```


    Example:


    ```

    ofstream outfile; // Create stream (for output)

    outfile.open("DATA1"); // Connect stream to DATA1

    ....n....

    file.close(); // Disconnect stream from DATA1

    outfile.open("DATA2"); // Connect stream to DATA2

    ....n....

    outfile.close(); // Disconnect stream from DATA2

    ....n....

    ```


    The previous segment opens two files in sequence for writing the data. Note that
    the first file is closed before opening the second one. This is necessary because
    a stream can be connected to only one file at a time. See Program 10.2 and Fig.
    10.6.'
