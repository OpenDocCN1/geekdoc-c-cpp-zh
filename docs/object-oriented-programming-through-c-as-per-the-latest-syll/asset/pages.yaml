    \nFig. 8.1 Forms of inheritance\n\n# 8.2 DEFINING DERIVED CLASSES\n\nA derived\
    \ class can be defined by specifying its relationship with the base class in addition\
    \ to its own details. The general form of defining a derived class is\n\n```\n\
    class derived-class-name : visibility-mode base-class-name\n{\n    // ...\n  \
    \  // members of derived class\n    // ...\n};\n```\n\nThe colon indicates that\
    \ the derived-class-name is derived from the base-class-name. The visibility-mode\
    \ is optional and, if present, may be either private or public. The default visibility-mode\
    \ is private. Visibility mode specifies whether the features of the base class\
    \ are privately derived or publicly derived."
