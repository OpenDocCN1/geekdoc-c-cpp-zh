  md: "# Operator Overloading and Type Conversions 203\n\nis equivalent to\n\n```\n\
    C3 = operator+(C1, C2);\n```\n\nIn most cases, we will get the same results by\
    \ the use of either a friend function or a member function. Why then an alternative\
    \ be available? There are certain situations where we would like to use a friend\
    \ function rather than a member function. For instance, consider a situation where\
    \ we need to use two different types of operands for a binary operator, say one\
    \ object and another built-in type data as shown below,\n\n```\nA = B + 2; (or\
    \ A = B * 2);\n```\n\nwhere A and B are objects of the same class. This will work\
    \ for a member function but the statement\n\n```\nA = 2 + B; (or A = 2 * B);\n\
    ```\n\nwill not work. Because the left-hand object is responsible for invoking\
    \ the member function should be object of the same class. However, friend function\
    \ allows both approaches. How?\n\nIt may be recalled that an object not be used\
    \ to invoke a friend function can be passed as an argument. Thus, we can use a\
    \ friend function with a built-in type data as the left-hand operand and an object\
    \ as the right-hand operand. Program 7.3 illustrates this, using scalar multiplication\
    \ of a vector. It also shows how to overload the input and output operators >>\
    \ and <<.\n\n# Program 7.3 Overloading Operations using Friends\n\n```\n#include\
    \ <iostream.h>\\\n\nconst size = 3;\nclass vector {\n    int v[size];\npublic:\n\
    \    vector(); // constructs null vector\n    vector(int *x); // constructs vector\
    \ from array\n    friend vector operator *(int a, vector b); // friend 1\n   \
    \ friend vector operator *(vector b, int a); // friend 2\n    friend ostream &\
    \ operator << (ostream &,, vector &);\n    friend ostream & operator >> (ostream\
    \ &, vector &);\n};\n\nvector::vector() {\n    for(int i=0; i<size; i++)\n   \
    \     v[i] = 0;\n}\n\nvector::vector(int *x)\n{\n    for(int i=0; i<size; i++)\n\
    \        v[i] = x[i];\n}\n```\n\n(Contd.)"
