    \n# 5.14 OBJECTS AS FUNCTION ARGUMENTS\n\nLike any other data type, an object\
    \ may be used as a function argument. This can be done in two ways:\n\n+   - A\
    \ copy of the entire object is passed to the function.\n- Only the address of\
    \ the object is transferred to the function.\n\nThe first method is called pass-by-value.\
    \ Since a copy of the object is passed, any changes made to the object inside\
    \ the function do not affect the object used to call the function. The second\
    \ method is called pass-by-reference. When an address of the object is passed,\
    \ the called function works directly on the actual object used in call. This means\
    \ that any changes to the object inside the function will reflect in the actual\
    \ object. The pass-by-reference method is more efficient since it requires to\
    \ pass only the address of the object and not the entire object.\n\nProgram 5.7\
