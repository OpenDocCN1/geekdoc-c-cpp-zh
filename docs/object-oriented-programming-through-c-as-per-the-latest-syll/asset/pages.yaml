  md: '# SUMMARY


    +   Exceptions are peculiar problems that a program may encounter at run time.


    +   Exceptions are of two types: synchronous and asynchronous. C++ provides mechanism
    for handling synchronous exceptions.


    +   An exception is typically caused by a faulty statement in a try block. The
    statement discovers the error and throws it, which is caught by a catch statement.


    +   The catch statement defines a block of statements to handle the exception
    appropriately.


    +   When an exception is not caught, the program is aborted.


    +   A try block may throw an exception directly or invoke a function that throws
    an exception. Irrespective of location of the throw point, the catch block is
    placed immediately after the try block.


    +   We can place two or more blocks together to catch and handle multiple types
    of exceptions thrown by a try block.


    +   It is also possible to make a catch statement to catch all types of exceptions
    using ellipses as its argument.


    +   We may also restrict a function to throw only a set of specified exceptions
    by adding a throw specification clause to the function definition.


    # Key Terms


    abort() function asynchronous exceptions bugs catch block catch(...) statement
    catching mechanism errors exception handler exception handling mechanism exception
    specifying exceptions logic multiple catch out-of-range index overflow rethrowing
    exceptions synchronous exceptions syntactic errors throw throw point throw statement
    throw() throwing mechanism try block


