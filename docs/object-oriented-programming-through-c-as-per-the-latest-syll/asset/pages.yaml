  md: "# The mutable Keyword\n\nWe know that a class object or a member function may\
    \ be declared as const making its member data not modifiable. however a situation\
    \ may arise where we want to declare a const object (or function) but we would\
    \ like to modify a particular data item only. In such situations, we can make\
    \ that particular data modifiable by declaring the item as mutable. Example:\n\
    \n```\nmutable int m;\n```\n\nAlthough a function(or class) that contains m is\
    \ declared const, the value of m may be modified. Program 14.2 demonstrates the\
    \ use of a mutable member.\n\n# Program 14.2 Use of mutable Keyword\n\n```\n#include\
    \ <iostream>\nusing namespace std;\n\nclass ABC\n{\n    private:\n        mutable\
    \ int m; // mutable member\n    public:\n        explicit ABC(int x = 0)\n   \
    \     {\n            m = x;\n        }\n        void change() const // const function\n\
    \        {\n            m = m+10;\n        }\n        int display() const // const\
    \ function\n        {\n            return m;\n        }\n};\nint main()\n{\n \
    \   ABC abc(100); // const object\n    cout << \"abc contains: \" << abc.display();\n\
    \n    abc.change(); // changes mutable data\n    cout << \"\\nabc now contains:\
    \ \" << abc.display();\n    cout << \"\\n\";\n\n    return 0;\n}\n}```\n```\n\n\
    The output of Program 14.2 would be\n\nabc contains: 100\nabc now contains: 110"
