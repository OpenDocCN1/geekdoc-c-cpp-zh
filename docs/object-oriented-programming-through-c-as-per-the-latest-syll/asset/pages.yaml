  md: '# Object-Oriented Systems Development 449


    +   1. satisfy the user requirements,

    2. be easy to understand by the users and operators,

    3. be easy to operate,

    4. have a good user interface,

    5. be easy to modify,

    6. be expandable,

    7. have adequate security controls against misuse of data,

    8. handle the errors and exceptions satisfactorily, and

    9. be delivered on schedule within the budget.


    In this chapter, we will review some of the conventional approaches that are being
    widely used in software development and then discuss some the current ideas that
    are applicable to the object-oriented software development.


    ![](img/c8042bb2c98f96c5758608865c161311_465_0.png)


    # 15.2 PROCEDURE-ORIENTED PARADIGMS


    Software development is usually characterized by a series of stages depicting
    the various tasks involved in the development process. Figure 15.2 illustrates
    the classic software life cycle that is most widely used for the procedure-oriented
    development. The classic life cycle is based on an underlying model, commonly
    referred to as the "water-fall" model. This model attempts to break up the identity
    into series of actions, each of which must be completed before the next begins.
    The activities include problem definition, requirement analysis, design, coding,
    testing, and maintenance. Further refinements to this model include iteration
    back to the previous stages in order to incorporate changes or merging links.


    **Problem Definition** This activity requires a precise definition of the problem
    in user terms. A clear statement of the problem is crucial to the success of the
    software. It helps not only the developer but also the user to understand the
    problem behavior.


    **Analysis** This covers a detailed study of the requirements of both the user
    and the software. This activity is basically concerned with what of the system
    such as


    +   * what are the inputs to the system?

    * what are the processes required?

    * what are the outputs expected?

    * what are the constraints?


    **Design** The design phase deals with various concepts of system design as data
    structure, software architecture, and algorithms. This phase translates the requirements
    into a representation of the software. This stage answers the questions of how.


    **Coding** Coding refers to the translation of the design into machine-readable
    form. The more detailed the design, the easier is the coding, and better its reliability.'
  merge: -1
  pgno: 465
- img_proc: true
  md: '![](img/c8042bb2c98f96c5758608865c161311_466_0.png)


    **Testing** Once the code is written, it should be tested rigorously for correctness
    of the code and results. Testing may involve the individual units and the whole
    system. It requires a detailed plan as to what, when and how to test.


    **Maintenance** After the software has been installed, it may undergo some changes.
    This may occur due to a change in the user''s requirement, a change in the operating
    environment, or an error in the software that has not been fixed during the testing.
    Maintenance ensures these changes are incorporated wherever necessary.


    Each phase of the life cycle has its own goals and outputs. The output of one
    phase acts as an input to the next phase. Table 15.1 shows typical outputs that
    could be generated for each phase of the life cycle.


    | Phase | Output |

    | --- | --- |

    | Problem definition (why) | - Problem statement sheet<br>- - Project request
    |

    | Analysis (what) | - Requirements document<br>- - Feasibility report<br>- - Specifications
    document |

    | | (Contd.) |'
