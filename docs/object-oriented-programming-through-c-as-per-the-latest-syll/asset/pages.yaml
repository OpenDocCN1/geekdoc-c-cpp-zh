    # Setting Precision: precision()


    By default, floating numbers are printed with six digits after the decimal point.
    However, we can specify the number of digits to be displayed after the decimal
    point while printing the floating-point numbers. This can be done by using the
    `precision()` function as follows:


    ```

    cout.precision(d);

    ```


    where d is the number of digits to the right of the decimal point. For example,
    the statements


    ```

    cout.precision(3);

    cout << sqrt(2) << "\n";

    out << 3.14159 << "\n";

    out << 2.50032 << "\n";

    ```


    will produce the following output:


    ```

    1.141 (truncated)

    3.142 (rounded to the nearest cent)

    2.5 (no trailing zeros)

    ```


    Not, unlike the function `width()`, `precision()` retains the setting in effect
    until it is reset. This is why we have declared only one statement for the precision
    setting which is used by all the three outputs.


    We can set different values to precision as follows:


    ```

    cout.precision(3);

    cout << sqrt(2) << "\n"; // Reset the precision

    cout.precision(5);

    cout << 3.14159 << "\n";

    ```


    We can combine the field specification with the precision setting. Example:


    ```

    cout.precision(2);

    cout.width(5);

    cout << 1.2345;

    ```


    The first two statements instruct: "print two digits after the decimal point in
    a field of five character width". Thus, the output will be


    | 1 | 2 | 3 |'
