  md: '468 Object Oriented Programming through C++


    might be too expensive and time consuming. One way of understanding the system
    design and its ramifications before a complete system is to build and test a working
    model of the proposed system. The system model is popularly known as a *prototype*,
    and the process is called *prototyping*. Since the object-oriented analysis and
    design approach is evolutionary, it is best suited for *prototyping paradigm*
    which is illustrated in Fig. 15.22.


    A prototype is a scaled down version of the system and may not have stringent
    performance criteria and resource requirements. Developer and customer agree upon
    certain “outline specifications” of the system and a prototype design is proposed
    with the outline requirements and available resources. The prototype is built
    and evaluated. The major interest is not in the prototype itself but in its performance
    which is used to refine the requirement specifications. Prototypes provide an
    opportunity to experiment and analyze various aspects of the system such as system
    structure, internal design, hardware requirements and the final system requirements.
    The benefits of using the prototype approach:


    +   - We can produce understandable specifications which are correct and complete
    as far as possible.

    - The user can understand what is being offered.

    - Maintenance changes that are required when a system is installed, are minimized.

    - Development engineers can work from a set of specifications which have been
    tested and approved.


    ![](img/c8042bb2c98f96c5758608865c161311_484_0.png)


    **Fig. 15.22** Prototype paradigm'
