  md: 'Object Oriented Programming through C++


    ![](img/c8042bb2c98f96c5758608865c161311_288_0.png)


    **Fig. 9.1** Achieving polymorphism


    At time, when it is known what class objects are under consideration, the appropriate
    version of the function is invoked. Since the function is linked with a particular
    class much later after the compilation, this process is termed as *late binding*.
    It is also known as *dynamic binding* because the selection of the appropriate
    function is done dynamically at runtime.


    Dynamic binding is one of the powerful features of C++. This requires the use
    of pointers to objects. We shall discuss in detail how the object pointers and
    virtual functions are used to implement dynamic binding.


    # # 9.2 POINTERS


    Pointers is one of the key aspects of C++ language similar to that of C. As we
    know, pointers offer offer a unique approach to handle data in C and C++. We have
    seen some of the applications of pointers in Chapters 3 and 5. In this section,
    we shall discuss the rudiments of pointers and the special usage of them in C++.


    We know that a pointer is a derived data type that refers to another data value
    by storing the variable''s memory address rather than data. A pointer variable
    defines where to get the value of a specific data variable instead of defining
    actual data.


    Like C, a pointer variable can also refer to (or point to) another pointer in
    C++. However, it often points to a data variable. Pointers provide an alternative
    approach to access other data objects.


    # ## Declaring and Initializing Pointers


    As discussed in Chapter 3, we can declare a pointer variable similar to other
    variables in C++. Like C, the declaration is based on the data type of the variable
    it points to. The declaration of a pointer variable takes the following format:


    ```

    data-type *pointer-variable;

    ```'
