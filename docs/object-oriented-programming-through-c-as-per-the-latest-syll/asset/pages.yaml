  md: '# Background


    It is a common practice in manufacturing companies to create purchase requisitions
    for the goods or items required. A purchase requisition typically contains the
    item code of the good required, its quantity and the date when it is required.
    On the submitted purchase requisition, the Buyer or the Purchasing Officer then
    generates a purchase order. A purchase order or PO is a legal document used by
    organizations for placing orders with their suppliers for procurement of goods.


    # A.2.1 PR2PO


    PR2PO is a command-driven procurement application that helps the users to


    +   * create a purchase requisition

    * view requisition details

    * convert purchase requisition into a purchase order


    Table A.3 lists the procurement-related assumptions for the PR2PO application.
    It details the various item codes, price and supplier details.


