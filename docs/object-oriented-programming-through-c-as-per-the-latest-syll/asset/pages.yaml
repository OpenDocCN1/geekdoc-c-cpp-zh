    file and its intended use:


    +   1. Suitable name for the file

    2. Data type and structure

    3. Purpose

    4. Opening method


    The filename is a string of characters that make up a valid filename for the operating
    system. It may contain two parts, a primary name and an optional period with extension.


    Examples:


    ```

    Input.data

    Test.doc

    INVENT.ORY

    student

    salary

    OUTPUT

    ```


    As stated earlier, for opening a file, we must first create a file stream and
    link it to the filename. A file stream can be defined using the classes ifstream,
    ofstream, and fstream that are contained in the header file fstream. The class
    to use depends upon the purpose, that is, whether we want to read data from the
    file or write data to it. A file can be opened in two ways:


    +   1. Using the constructor function of the class.

    2. Using the member function open() of the class.'
