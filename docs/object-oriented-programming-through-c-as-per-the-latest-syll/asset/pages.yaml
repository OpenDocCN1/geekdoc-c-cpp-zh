    # Formatting Flags, Bit-fields and setf()


    We have seen when the function width() is used, the value (whether text or number)
    is printed right-justified in the width created. But, it is a usual practice to
    print the text left-justified. How do we get a value printed left-justified? Or,
    how do we get a floating-point number printed in the scientific notation?


    The setf(), a member function of the ios class, can provide answers to these and
    many other formatting questions. The setf() (set stands for set flags) function
    can be used as follows:


    ```

    cout.setf(arg1, arg2)

    ```


    The arg1 is one of the formatting flags defined in the ios class. The formatting
    flag specifies the format action required for the output. Another ios constant,
    arg2, known as field specifies the group to which formatting flag belongs.


    Table 2.4 shows the bit fields, flags and their format actions. There are three
    fields and each has a group of format flags that are mutually exclusive. Examples:


    ```

    cout.setf(ios::left, ios::adjustfield)

    cout.setf(ios::scientific, ios::floatfield)

    ```


    | Table 2.4 Flags and bit fields for setf() function |

    | Required output | Flag (arg1) | Bit-field (arg2) |

    | --- | --- | --- |

    | Left-justified output | ios :: left | ios :: adjustfield |

    | Right-justified output | ios :: right | ios :: adjustfield |

    | Padding after sign or base | ios :: internal | ios :: adjustfield |

    | Indicator (like ++20) | | |

