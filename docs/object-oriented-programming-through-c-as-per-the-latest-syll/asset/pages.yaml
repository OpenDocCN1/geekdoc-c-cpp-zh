    # 6.1 INTRODUCTION


    We have seen, so far, a few examples of classes being implemented. In all the
    cases, we have used

    member functions such as putdata(a) and setValue() to provide initial values to
    the private member

    variables. For example, the following statement


    ```

    A.input();

    ```


    invokes the member function input(), which assigns the initial values to the data
    items of object A.

    Similarly, the statement


    ```

    x.getdata(100,299.95);

    ```


    passes the initial values to the function getdata(), where these values are assigned
    to the

    private variables of object x. All these ''function call'' statements are used
    with the appropriate

    objects that have already been created. These functions cannot be used to initialize
    the member

    variables at the time of creation of their objects.


    Providing the initial values as described above does not conform with the philosophy
    of C++

    language. We stated earlier that one of the aims of C++ is to create user-defined
    data types such as

    class, that behave very similar to the built-in types. This means that we should
    be able to initialize a

    class variable (object) when it is declared, the same way as initialization of
    an ordinary

    variable. For example,


    ```

    int m = 20;

    float x = 5.75;

    ```


    are valid initialization statements for basic data types.

    Similarly, when a variable of built-in type goes out of scope, the compiler automatically
    destroys

    the variable. But it has not happened with the objects we have so studied. It
    is therefore clear that

    more features of classes need to be explored enable us to initialize the objects
    when

    they are created and destroyed when their presence is no longer necessary.


    C++ provides a special member function called the constructor which enables an
    object to initialize

    elf when it is created. This is known as automatic initialization of objects.
    It also provides another

    member function called the destructor that destroys the objects when they are
    no longer required.'
