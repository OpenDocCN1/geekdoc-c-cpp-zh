    Standard Terms and Conditions


    +   1. PO should be acknowledged within 7 days of date of issue.

    2. PO will be null and void if goods are not delivered by delivery date.

    3. Defective goods will be returned back to the Supplier.

    4. Invoice can only be raised after 20 days of goods receipt.

    5. Damages during transit (if any) will be borne by the Supplier.


    Table A.4 lists the key elements of the PR2PO application.


    # Table A.4 Key coding elements


    | Element | Description |

    |---|---|

    | requisition | This class is used to store the purchase requisition details that
    are later used for generating the purchase order. |

    | get_data() | This requisition class function is used to receive and store requisition
    details. Every time a requisition is created, the get_data() function assigns
    it a unique identifier (requisition number). |

    | display() | This requisition class function is used to display the requisition.
    |

    | po | This class is used to represent a purchase order. Every time a new purchase
    order is created, the class constructor assigns it a unique identifier (purchase
    order number). |

    | generate() | This friend function of requisition and po classes is used to generate
    a purchase order from a requisition. The purchase order is stored in the Current_PO.txt
    file in the application root folder. |


