    The software life cycle, as described above, is often implemented using the functional
    decomposition technique, popularly known as top-down, modular approach. The functional
    decomposition technique is based on the interpretation of the problem space and
    its translain into the solution space as a sequence of progressively simpler functions
    that are eventually implemented. The final system is seen as a set of functions
    that are organized in a top-down hierarchical structure.


    There are several flaws in the top-down, functional decomposition approach. They
    include the:

    1. It does not allow evolutionary changes in the software.

    2. The system is characterized by a single function at the top which is not always
    true. In fact many systems have no top.

    3. Data is not given the importance that it deserves.

    4. It does not encourage reusability of the code.


    # 15.3 PROCEDURE-ORIENTED DEVELOPMENT TOOLS


    A large number of tools are used in the analysis and design of the systems. It
    is important to note that the process of systems development has been undergoing
    changes over the years due to continuous changes in the computer technology. Consequently,
    there has been an evolution of new development tools and techniques. These tools
    and techniques provide answers to the how questions of the system development.


    The development tools available today may be classified as the first generation,
    second generation, and third generation tools. The first generation developed
    in the 1960s and 1970s are called the traditional tools. The second generation
    tools introduced in the late 1970s and early 1980s are meant for the structured
    systems analysis and design and therefore they are known as the structured tools.
    The recent tools are the third generation evolved since late 1980s to suit the
    object-oriented analysis and design.


    Table 15.2 shows some of the popular tools used for various development processes
    under the three categories. Although this categorization is questionable, it gives
    a fair idea of the growth of the tools used during the last three decades.'
