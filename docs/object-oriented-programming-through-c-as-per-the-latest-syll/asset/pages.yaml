    # 2.1 INTRODUCTION


    Every program takes some data as input and generates processed data as output
    following the familiar input-process-output cycle. It is, therefore, essential
    to know how to provide the input data and how to present the results in a desired
    form. We, in the earlier chapters, used cin and cout with the operators >> and
    << for the input and output operations. We have not so far discussed as to how
    control how the output is printed. C++ supports a rich set of I/O functions (such
    as classes, derived classes and virtual functions), we need to know about them
    before really implementing the C++ I/O operations.


    Remember, C++ supports all of C''s rich set of I/O functions. We can use any of
    them in the C++ programs. But we are restrained from using them due to two reasons.
    First, I/O methods in C++ support the concepts of OOP and secondly, I/O methods
    in C++ cannot handle the user-defined data types as class objects.


    C++ uses the concept of stream and stream classes to implement I/O operations
    with the console and disk files. We will discuss in this chapter, how stream support
    the console-oriented input-output operations. File-oriented I/O operations will
    be discussed in the next chapter.


    # 2.2 C++ STREAMS


    The I/O system in C++ is designed to work with a wide variety of devices including
    terminals, disks, and tape drives. Each device is very different, the I/O system
    supplies an interface to the program-mer is independent of the actual device being
    accessed. This interface is known as stream.


    A stream is a sequence of bytes. Each acts as a source from which the input data
    can be obtained or a destination to which the output data can be sent. The source
    that provides data to the program is called the output stream and the destination
    stream that receives output from the stream and inserts into an output stream
    as illustrated in Fig. 2.1.


    ![](img/c8042bb2c98f96c5758608865c161311_48_1.png)'
