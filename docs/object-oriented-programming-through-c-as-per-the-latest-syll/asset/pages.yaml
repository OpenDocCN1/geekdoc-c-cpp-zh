    # 5.1 INTRODUCTION\n\nThe most important feature of C++ is the 'class'. Its significance\
    \ is highlighted by the fact that Stroustrup initially gave the name 'C with classes'\
    \ to his new language. A class is an extension of the idea used in C. It is a\
    \ new way of creating and implementing a user-defined data type. We shall discuss,\
    \ in this chapter, the concept of class by first reviewing the traditional structures\
    \ found in C and then the ways in which classes can be designed, implemented and\
    \ applied.\n\n# 5.2 C STRUCTURES VISITED\n\nWe know that one of the unique features\
    \ of the C language is structures. They provide a method for packing together\
    \ different types of items. A structure is a convenient tool for handling a group\
    \ of related data types items. It is a user-defined data type with a template\
    \ that serves to define its data properties. Once the structure type has been\
    \ defined, we can create variables of that type using declarations that are similar\
    \ to the built-in type declarations. For example, consider the following declaration:\n\
    \n```\nstruct student\n{\n    char name[20];\n    int roll_number;\n    float\
    \ total_marks;\n};\n```\n\nThe keyword struct declares student as a new data type\
    \ that can hold three fields of different data types. These fields are known as\
    \ structure members or elements. The identifier student, which is referred to\
    \ as structure name or structure tag, can be used to create variables of type\
    \ student. Example:\n\n```\nstruct student A; // C declaration\n```\n\nA is a\
    \ variable of type student and has three member variables as defined by the template.\
    \ Member variables can be accessed using the dot or period operator as follows:"
