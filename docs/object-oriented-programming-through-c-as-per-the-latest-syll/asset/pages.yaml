  md: '# 3.17 MEMORY MANAGEMENT OPERATORS


    C uses malloc() and calloc() functions to allocate dynamically at run time. Similarly,
    it uses the function free() to free dynamically allocated memory. We use dynamic
    allocation techniques when it is not known in advance how much memory is needed.
    C++ supports these functions, also defines two unary operators new and delete
    that perform the task of allocating and freeing memory in a better and easier
    way. Since these operators manage memory of the free store, they are also known
    as free store operators.


    An object can be created using new, and destroyed using delete, and as required.
    A data object created inside a box with new, will remain in existence until it
    is explicitly destroyed using delete. The lifetime of an object is directly under
    your control and is unrelated to the block structure of the program.


    The new operator can be used to create objects of any type. It takes the following
    general form:


    ```

    pointer-variable = new data-type;

    ```


    Here, pointer-variable is a pointer of data-type. The new operator allocates sufficient
    memory to hold a data object of type data-type and returns the address of the
    object. The data-type may be any valid data type. The pointer-variable holds the
    address of the memory space allocated.


    Examples:


    ```

    p = new int;

    q = new float;

    ```


    where p is a pointer of type int and q is a pointer of type float. Here, p and
    q must have already been declared as pointers of appropriate types. Alternatively,
    we can combine the declaration of pointers and their assignments as follows:


    ```

    int *p = new int;

    float *q = new float;

    ```


    Subsequently, the statements


    ```

    *p = 25;

    *q = 7.5;

    ```


    assign 25 to the newly created int object using the new operator and 7.5 to the
    float object.


    We can also initialize the memory using the new operator. This is as follows:


    ```

    pointer-variable = new data-type(value);

    ```


    Here, value specifies the initial value. Examples:


    ```

    int *p = new int(25);

    float *q = new float(7.5);

    ```


    As mentioned earlier, new can be used to create a memory space for any data type
    including user-defined types such as arrays, structures and classes.'
