  md: "Such functions are called pure virtual functions. A pure virtual function is\
    \ a function declared in a base class that has no definition relative to the base\
    \ class. In such cases, the compiler requires each derived class to either define\
    \ the function or redeclare it as a pure virtual. Remember that a class containing\
    \ pure virtual functions cannot be used to declare any objects of its own. As\
    \ stated earlier, such classes are called abstract base classes. The main objective\
    \ of an abstract base class is to provide some traits to the derived classes and\
    \ to create a base pointer for achieving runtime polymorphism.\n\nProgram 9.14\
    \ demonstrates the use of pure virtual function:\n\n# Program 9.14 Pure Virtual\
    \ Function\n\n```\n#include <iostream>\n\nusing namespace std;\n\nclass Balagurusamy\
    \ //base class\npublic:\n    virtual void example()=0; //Denotes pure virtual\
    \ Function Definition\n};\nclass C:public Balagurusamy //derived class 1\npublic:\n\
    \    void example()\n    {\n        cout<<\"C text Book written by Balagurusamy;\"\
