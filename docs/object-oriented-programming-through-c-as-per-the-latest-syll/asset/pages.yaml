  md: "# Key Concepts\n\nOverloading | Operator functions | Overloading unary operators\
    \ | String manipulations | Basic to class\ntype | Class to class type | Operator\
    \ overloading | Overloading binary operators | Using friends for\noverloading\
    \ | Type conversions | Class to basic type | Overloading rules\n\n# 7.1 INTRODUCTION\n\
    \nOperator overloading is one of the most exciting features of C++ language. We\
    \ have stated more than once that\nC++ tries to make the user-defined data types\
    \ behave much like the same way as the built-in types.\nFor instance, C++ permits\
    \ us to add two variables of user-defined types with the same syntax as is\nlied\
    \ the basic types. This means that C++ has the ability to provide the operators\
    \ with a special\nmeaning for a data type. The mechanism of giving special meanings\
    \ to an operator is known as\noperator overloading.\n\nOperator overloading provides\
    \ a flexible option for the creation of new definitions for most of the C+\noperators.\
    \ We can overload (give additional meaning to) all the C++ operators except the\
    \ following:\n\n+   - Class member operators (.*).\n- Scope resolution operator\
    \ (:).\n- Size operator (sizeof).\n- Conditional operator (?).\n\nThe reason we\
    \ cannot overload these operators may be attributed to the fact that these\noperators\
    \ take names (example class name) as their operand instead of values, as is the\
    \ case with\nother normal operators.\n\nAlthough the semantics of an operator\
    \ can be extended, we cannot change its syntax, the\ngrules that govern its use\
    \ such as the number of operands, precedence and associa-\ntivity. For example,\
    \ the multiplication operator will enjoy higher precedence than the addition\n\
    operator. Remember, when an operator is overloaded, its original meaning is not\
    \ lost.\nFor instance, the operator + , which has been overloaded to add two vectors,\
    \ can still be used to add\ntwo integers.\n\n# 7.2 DEFINING OPERATOR OVERLOADING\n\
    \nTo define an additional task to an operator, we must specify what it means in\
    \ relation to the class to\n the operator is applied. This is done with the help\
    \ of a special function, called operator function,\nwhich describes the task.\
    \ The general form of an operator function is\n\n```\nreturn type classname ::\
    \ operator op(arglist)\n{\n    Function body // task defined\n}\n```"
