  md: "# Outside the Class Definition\n\nMember functions that declared inside a class\
    \ have to be defined separately outside the class. Their definitions are very\
    \ much like the normal functions. They should have a function header and a function\
    \ body. Since C++ does not support the old version of function definition, ANSI\
    \ prototype form must be used for defining the function header.\n\nAn important\
    \ difference between a member function and a normal function is that member function\
    \ incorporates a membership 'identity label' in the header. This 'label' tells\
    \ the compiler class belongs to the function. The general form of a member function\
    \ is\n\n```\nreturn-type class-name :: function-name (argument declaration)\n\
    {\n  Function body\n}\n```\n\nThe member label class-name :: tells the compiler\
    \ that the function function-name belongs to the class class-name. That is, the\
    \ scope of the function is restricted to the class-name specified in the header\
    \ line. The :: is called resolution operator.\n\nFor instance, consider the member\
    \ functions getdata() and putdata() as discussed above. They may be coded as:\n\
    \n```\nvoid item :: getdata(int a, float b)\n{\n  number = a;\n  cost = b;\n}\n\
    void item :: putdata(void)\n{\n  cout << \"Number : \" << number << \"\\n\";\n\
    \  cout << \"Cost : \" << cost << \"\\n\";\n}\n```\n\nSince these functions do\
    \ not return any value, their return-type is void. Function arguments are declared\
    \ using the ANSI prototype.\n\nThe member functions have some special characteristics\
    \ that are often used in the program development. These characteristics are:\n\
    \n+   - Different classes can use the same function name. The 'membership label'\
    \ will resolve their scope.\n- Member functions can access the private data of\
    \ the class. A nonmember function cannot do so. (However, an exception to this\
    \ rule is a friend function discussed later.)\n- A member function can call another\
    \ member function directly, without using the dot operator.\n\n# Inside the Class\
    \ Definition\n\nAnother method of defining a member function is to replace the\
    \ function declaration by the actual function definition inside the class. For\
    \ example, we could define the item class as follows:"
