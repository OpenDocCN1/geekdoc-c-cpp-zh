    | Relational operations on strings | Comparing strings | String characteristics
    | Swapping strings


    # 13.1 INTRODUCTION


    A string is a sequence of characters. We know that C++ does not support a built-in
    string type. We have used earlier null-terminated character arrays to store and
    manipulate strings. These strings are called C-strings or C-style strings. Operations
    on C-strings often become complex and inefficient. We can define our own string
    classes with appropriate member functions to manipulate strings. This was illustrated
    in Program 7.4 (Mathematical Operation of Strings).


    ANSI C++ provides a new class string. This class improves on the conventional
    C-strings in several ways. In many situations, the string objects may be used
    like any other built-in type data. Furthermore, although it is not considered
    a part of the STL, string is treated as another class by C++ and therefore all
    the algorithms that are applicable for containers can use the string objects.
    For using the string class, we must include <string> in our program.


    The string class is very large and includes many constructors, member functions
    and operators. We may use the constructors, member functions and operators to
    achieve the following:


    +   * Creating string objects

    * Reading string objects from keyboard

    * Displaying string objects to the screen

    * Finding a substring from a string

    * Modifying string objects

    * Comparing string objects

    * Adding string objects

    * Accessing characters in a string

    * Obtaining the size of strings

    * Many other operations


    Table 13.1 gives prototypes of three most commonly used constructors and Table
    13.2 gives a list of important member functions. Table 13.3 lists a number of
    operators that can be used on string objects.'
