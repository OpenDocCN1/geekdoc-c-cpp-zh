    # 11.9 INTRODUCTION TO STANDARD TEMPLATE LIBRARY


    We have seen how templates can be used to create generic classes and functions
    that could extend support for generic programming. In order to help the C++ users
    in generic programming, Alexander Stepanov and Meng Lee of Hewlett-Packard developed
    a set of generic-purpose templated classes (data structures) and functions (algorithms)
    that could be used as a standard approach for storing and processing of data.
    The collection of these generic classes and functions is called the Standard Template
    Library (STL). The STL has now become part of the ANSI standard C++ library.


    STL is large and complex and it is difficult to discuss all of its features in
    this chapter. We therefore present here only the most important features that
    enable the readers to begin using the STL effectively. Using STL can save considerable
    time and effort, and lead to high quality programs. These benefits are possible
    because we are basically "reusing" the well-written and well-tested components
    defined in the STL.


    STL components which are now part of the Standard C++ Library are defined in the
    namespace std. We must therefore use the using namespace directive


    ```

    using namespace std;

    ```


    to inform the compiler that we intend to use the Standard C++ Library. All programs
    in this chapter use this directive.


    ![](img/c8042bb2c98f96c5758608865c161311_374_1.png)


    # 11.10 COMPONENTS OF STL


    The STL contains several components. But at its core are three key components.
    They are


    +   - Containers

    - Algorithms

    - Iterators'
