    # # 15.8 IMPLEMENTATION


    Implementation includes coding and testing. Coding includes writing codes for
    classes


    No program works correctly the first time. Testing the program before using is
    an essential part of the software development process. A detailed test plan should
    be drawn as to what, when and how to test. The class interfaces and class dependencies
    are important aspects for testing. The final goal of testing is to see that the
    system performs its intended job satisfactorily.


    # # 15.9 PROTOTPING PARADIGM


    Most the real-world application problems are complex in nature and therefore the
    structure of the system becomes too large to work out the precise requirements
    at the beginning. Some particulars become known and clear only when we build and
    test the system. After a large system is completed, incorporation of any feature
    that has been identified as "missing" at the testing or application stage'
