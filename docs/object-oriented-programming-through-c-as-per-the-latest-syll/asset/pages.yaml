    +   67. A local variable is a variable defined within a statement block.


    +   68. A global variable is a variable defined before all the functions in the
    program.


    +   69. Functions can use local and global variables and other functions, in their
    implementations.


    +   70. While calling a function, a programmer supplies actual parameters of the
