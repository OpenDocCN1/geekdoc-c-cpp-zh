    ```\nvoid show();      /* Function declaration */\nmain()\n{\n    show();    \
    \  /* Function call */\n}\nvoid show() /* Function definition */\n{\n    /* Function\
    \ body */\n}\n```\n\nWhen the function is called, control is transferred to the\
    \ first statement in the function body. The other statements in the function body\
    \ are then executed and control returns to the main program when the closing brace\
    \ is encountered. C++ is no exception. Functions continue to be the building blocks\
    \ of C++ programs. In fact, C++ has added many new features to functions to make\
    \ them reliable and flexible. Like C++ operators, a C++ function can be overloaded\
    \ to make it perform tasks depending on the arguments passed to it. Most of these\
    \ modifications are aimed at meeting the requirements of object-oriented facilities.\n\
    \nIn this chapter, we will briefly discuss the various new features that are added\
    \ to C++ functions and their implementation.\n\n# 4.2 THE MAIN FUNCTION\n\nC does\
    \ not specify any return type for the main() function which is the starting point\
    \ for the execution of a program."
