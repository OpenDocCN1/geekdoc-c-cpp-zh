  md: '# Constructors and Descriptors 179


    Let us look at the first constructor again.


    ```

    complex() { }

    ```


    It contains the empty body and does not anything. We just stated that this is
    used to create objects without any initial values. Remember, we have defined objects
    in the earlier examples with out using such a constructor. Why do we need this
    constructor now? As pointed out earlier, C++ compiler has an implicit constructor
    which creates objects, even though it was not defined in the class.


    This works fine as we do not use any constructors in the class. However, once
    we define a constructor, we must also define the "do-nothing" implicit constructor.
    This constructor will not do anything and is defined to satisfy the compiler.


    ![](img/c8042bb2c98f96c5758608865c161311_195_0.png)


    # 6.5 CONSTRUCTORS WITH DEFAULT ARGUMENTS


    It is possible to define constructors with default arguments. For example, the
    constructor complex() can be declared as follows:


    ```

    complex(float real, float imag=0);

    ```


    The default value of the argument imag is zero. Then, the statement


    ```

    complex C(5.0);

    ```


    assigns the value 5.0 to the real variable and 0.0 to imag (by default). However,
    the statement


    ```

    complex C(2.0,3.0);

    ```


    assigns 2.0 to real and to imag. The actual parameter, when specified, overrides
    the default value. As pointed out earlier, the missing arguments must be the trailing
    ones.


    It is important to distinguish between the default constructor A::() and the default
    argument constructor A::(int = 0). The argument constructor can be called with
    either one argument or no arguments. When called with no arguments, it becomes
    a default constructor. When these forms are used in a class, it causes ambiguity
    for a statement such as


    ```

    A a;

    ```


    The ambiguity is to ''call A::() or A::(int = 0).


    ![](img/c8042bb2c98f96c5758608865c161311_195_1.png)


    # 6.6 DYNAMIC INITIALIZATION OF OBJECTS


    Class objects can be initialized dynamically. That to say, the initial value of
    an object may be provided during run time. One advantage of dynamic initialization
    is that we can provide initialization formats, using overloaded constructors.
    This provides the flexibility of using different format of data at run time using
    dynamic initialization.


    Consider the long term deposit schemes working in the commercial banks. The banks
    provide interest rates for different schemes as well as for periods of investment.
    Program 6.3 illustrates how to use the class variables for holding account details
    and how to construct these variables at run time using dynamic initialization.'
