  md: '# APPENDIX

    G


    # POINTS TO REMEMBER


    +   1. Computers use the binary number system which uses binary digits called
    bits.

    2. The basic unit of storage in a computer is a byte represented by eight bits.

    3. A computer language is a language used to give instructions to a computer.

    4. A compiler translates instructions in programming language to instructions
    in machine language.

    5. Application software is a software that is designed to solve a particular problem
    or provide a particular service.

    6. Systems software is a software that is designed to support the development
    and execution of application programs.

    7. An operating system is a software that controls and manages the computing resources
    such as the memory, the input and output devices, and the CPU.

    8. An algorithm is a detailed, step-by-step procedure for solving a problem.

    9. The goal of a software design is to produce software that is reliable, understandable,
    cost effective, adaptable, and reusable.

    10. Abstraction is the process of highlighting the essential, inherent aspects
    of an entity while ignoring details.

    11. Encapsulation (or information hiding) is the process of separating the external
    aspects of an object from the implementation details which should be hidden from
    other objects.

    12. Modularity is the process of dividing a problem into smaller pieces so that
    each smaller module can be dealt with individually.

    13. Organizing a set of abstractions from most general to least general is known
    as inheritance hierarchy.

    14. Object-oriented programming is a paradigm in which a system is modeled as
    a set of objects that interact with each other.

    15. In C++ an abstraction is formed by creating a class. A class encapsulates
    the attributes and behaviors of an object.

    16. The data members of a class represent the attributes of a class.

    17. The member functions of a class represent the behaviors of a class.'
