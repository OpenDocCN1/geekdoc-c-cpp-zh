    \ \"\\nBlast Off!\" << endl;\n    return 0;\n}\n```\n\n![](img/bdf3833c5133a7f9b1eef9ebdb21a76d_60_4.png)\n\
    \n### STEP 10\n\nThe main advantage of using a do...while loop is because it’s\
