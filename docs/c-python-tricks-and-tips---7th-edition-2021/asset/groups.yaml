  - "[PAGE 50]\n\n**STEP 5** You can also define other elements as a constant. For\
    \ example, instead of using `\\n` for a newline in the `cout` statement, you can\
    \ define it at the start of the code:\n\n```\n```cpp\n#include <iostream>\nusing\
    \ namespace std;\n\n#define LENGTH 50\n#define WIDTH 40\n#define HEIGHT 60\n#define\
    \ NEWLINE '\\n'\n\nint main ()\n{\n    cout << \"Length is: \" << LENGTH << NEWLINE;\n\
    \    cout << \"Width is: \" << WIDTH << NEWLINE;\n    cout << \"Height is: \"\
    \ << HEIGHT << NEWLINE;\n}\n```\n```\n\n![](img/bdf3833c5133a7f9b1eef9ebdb21a76d_50_0.png)\n\
    \n**STEP 6** The code, when built and executed, does exactly the same as before,\
    \ using the new constant NEWLINE to insert a newline in the cout statement. Incidentally,\
    \ creating a newline constant isn’t a good idea unless you’re making it smaller\
    \ than `\\n` or even the endl command.\n\n![](img/bdf3833c5133a7f9b1eef9ebdb21a76d_50_1.png)\n\
    \n**STEP 7** Defining a constant is a good way of initialising your base values\
    \ at the start of your code. You can define that your game has three lives, or\
    \ even the value of PI without having to call up the C++ math library:\n\n```\n\
    ```cpp\n#include <iostream>\nusing namespace std;\n\n#define PI 3.14159\n\nint\
    \ main ()\n{\n    cout << \"The value of Pi is: \" << PI << endl;\n}\n```\n```\n\
    \n![](img/bdf3833c5133a7f9b1eef9ebdb21a76d_50_2.png)\n\n**STEP 8** Another method\
    \ of defining a constant is with the const keyword. Use const together with a\
    \ data type, variable and value: const type variable = value. Using Pi as an example:\n\
    \n```\n```cpp\n#include <iostream>\nusing namespace std;\n\nint main ()\n{\n \
    \   const double PI = 3.14159;\n    cout << \"The value of Pi is: \" << PI <<\
    \ endl;\n}\n```\n```\n\n![](img/bdf3833c5133a7f9b1eef9ebdb21a76d_50_3.png)\n\n\
    **STEP 9** Because you’re using const within the main block of code, you need\
    \ to finish the line with a semicolon. You can use either, as long as the names\
    \ and values don’t clash, but it’s worth mentioning that #define requires no memory,\
    \ so if you’re coding to a set amount of memory, #define is your best bet.\n\n\
    ![](img/bdf3833c5133a7f9b1eef9ebdb21a76d_50_4.png)\n\n**STEP 10** Const works\
    \ in much the same way as #define. You can create static integers and even newlines:\n\
    \n```\n```cpp\n#include <iostream>\nusing namespace std;\n\nint main()\n{\n  \
    \  const int LENGTH = 50;\n    const int WIDTH = 40;\n    const char NEWLINE =\
    \ '\\n';\n\n    int area;\n    area = LENGTH * WIDTH;\n\n    cout << \"Area is:\
    \ \" << area << NEWLINE;\n}\n```\n```\n\n![](img/bdf3833c5133a7f9b1eef9ebdb21a76d_50_5.png)"
  - "[PAGE 51]\n\n# File Input/Output\n\nThe standard iostream library provides C++\
    \ coders with the cin and cout input and output functionality. However, to be\
    \ able to read and write from a file you need to utilise another C++ library,\
    \ called Fstream.\n\n# FSTREAMS\n\nThere are two main data types within the fstream\
    \ library that are used to open a file, read from it and write to it, ofstream\
    \ and ifstream. Here’s how they work.\n\n**STEP 1** The first task is to create\
    \ a new C++ file and along with the usual headers you need to include the new\
    \ fstream header:\n\n```\n```cpp\n#include <iostream>\n#include <fstream>\nusing\
    \ namespace std;\n\nint main ()\n{\n\n}\n```\n```\n\n![](img/bdf3833c5133a7f9b1eef9ebdb21a76d_51_0.png)\n\
    \n**STEP 2** Begin by asking a user for their name and writing that information\
    \ to a file. You need the usual string to store the name, and getline to accept\
    \ the input from the user.\n\n```\n```cpp\n#include <iostream>\n#include <fstream>\n\
    using namespace std;\n\nint main ()\n{\n    string name;\n\n    ofstream newfile;\n\
    \    newfile.open(“name.txt”);\n\n    cout << “Enter your name: “ << endl;\n \
    \   getline(cin, name);\n\n    newfile << name << endl;\n\n    newfile.close();\n\
    }\n```\n```\n\n**STEP 3** We’ve included comments in the screenshot of step 2\
    \ to help you understand the process. You created a string called name, to store\
    \ the user’s inputted name. You also created a text file called name.txt (with\
    \ the ofstream newfile and newfile.open lines), asked the user for their name\
    \ and stored it and then written the data to the file.\n\n![](img/bdf3833c5133a7f9b1eef9ebdb21a76d_51_1.png)\n\
    \n**STEP 4** To read the contents of a file, and output it to the screen, you\
    \ need to do things slightly differently. First you need to create a string variable\
    \ to store the file’s contents (line by line), then open the file, use getline\
    \ to read the file line by line and output those lines to the screen. Finally,\
    \ close the file.\n\n```\n```cpp\nstring line;\nifstream newfile (“name.txt”);\n\
    \ncout << “Contents of the file: “ << endl;\n\ngetline(newfile, line);\ncout <<\
    \ line << endl;\nnewfile.close();\n```\n```\n\n![](img/bdf3833c5133a7f9b1eef9ebdb21a76d_51_2.png)"
  - "[PAGE 52]\n\n# ### STEP 5\n\nThe code above is great for opening a file with\
    \ one or two lines but what if there are multiple lines? Here we opened a text\
    \ file of the poem Cimmeria, by Robert E Howard:\n\n```\n    string line;\n  \
    \  ifstream newfile (\"c:\\\\users\\\\david\\\\Documents\\\\Cimmeria.txt\");\n\
    \n    cout << \"Cimmeria, by Robert E Howard: \\n\" << endl;\n\n    while (getline(newfile,\
    \ line))\n        cout << line << endl;\n\n    newfile.close();\n```\n\n![](img/bdf3833c5133a7f9b1eef9ebdb21a76d_52_0.png)\n\
    \n# ### STEP 6\n\nYou can no doubt see that we've included a while loop, which\
    \ we cover in a few pages time. It means that while there are lines to be read\
    \ from the text file, C++ getlines them. Once all the lines are read, the output\
    \ is displayed on the screen and the file is closed.\n\n![](img/bdf3833c5133a7f9b1eef9ebdb21a76d_52_1.png)\n\
    \n# ### STEP 7\n\nYou can also see that the location of the text file Cimmeria.txt\
    \ isn't in the same folder as the C++ program. When we created the first name.txt\
    \ file, it was written to the same folder where the code was located; this is\
    \ done by default. To specify another folder, you need to use double-back slashes,\
    \ as per the character literals/escape sequence code.\n\n```\n    string line;\n\
