  - "[PAGE 60]\n\n# STEP 5\n\nIf you want code to add up user inputted numbers until\
    \ the user enters zero:\n\n```\n```cpp\n{\n    float number, sum = 0.0;\n    cout\
    \ << \"**** Program to execute a Do... While loop continuously ****\" << endl;\n\
    \    cout << \"\\nEnter 0 to stop and display the sum of all the numbers entered\\\
    n\" << endl;\n    cout << \"\\n------------------------------\\n\" << endl;\n\
    \    do {\n        cout << \"\\nPlease enter a number: \";\n        cin >> number;\n\
    \        sum += number;\n    }\n    while(number != 0.0);\n    cout << \"Total\
    \ sum of all numbers: \" << sum;\n    return 0;\n}\n```\n```\n\n![](img/bdf3833c5133a7f9b1eef9ebdb21a76d_60_0.png)\n\
    \n# STEP 6\n\nThe code from Step 5 works as follows: two floating point variables\
    \ are assigned, number and sum, both with the value of 0.0. There is a brief set\
    \ of instructions for the user, then the do...while loop begins.\n\n![](img/bdf3833c5133a7f9b1eef9ebdb21a76d_60_1.png)\n\
    \n# STEP 7\n\nThe do...while loop in this instance asks the user to input a number,\
    \ which you assigned to the float variable, number. The calculation step uses\
    \ the second floating point variable, sum, which adds the value of number every\
    \ time the user enters a new value.\n\n![](img/bdf3833c5133a7f9b1eef9ebdb21a76d_60_2.png)\n\
    \n# STEP 8\n\nFinally, the while statement checks the condition of the variable\
    \ number. If the user has entered zero, then the loop is terminated, if not then\
    \ it continues indefinitely. When the user finally enters zero, the value of sum,\
    \ the total value of all the user’s input, is displayed. The loop, and the program,\
    \ then ends.\n\n![](img/bdf3833c5133a7f9b1eef9ebdb21a76d_60_3.png)\n\n# STEP 9\n\
    \nUsing the countdown and Blast Off! code used previously, a do...while loop would\
    \ look like:\n\n```\n```cpp\n{\n    int a = 10;\n    do\n    {\n        cout <<\
    \ a << endl;\n        a = a - 1;\n    }\n    while (a != 0);\n\n    cout << \"\
    \\nBlast Off!\" << endl;\n    return 0;\n}\n```\n```\n\n![](img/bdf3833c5133a7f9b1eef9ebdb21a76d_60_4.png)\n\
    \n# STEP 10\n\nThe main advantage of using a do...while loop is because it’s an\
    \ exit-condition loop; whereas a while loop is an entry-control loop. Therefore,\
    \ if your code requires a loop that needs to be executed at least once (for example,\
    \ to check the number of lives in a game), then a do...while loop is perfect.\n\
    \n![](img/bdf3833c5133a7f9b1eef9ebdb21a76d_60_5.png)"
  - "[PAGE 61]\n\n# # If Statement\n\nThe decision making statement ‘If’ is probably\
    \ one of the most used statements in any programming language, regardless of whether\
    \ it’s C++, Python, BASIC or anything else. It represents a junction in the code,\
    \ where IF one condition is true, do this, or IF it’s false, do that.\n\n# ##\
    \ IF ONLY\n\nIf uses a Boolean expression within its statement. If the Boolean\
    \ expression is true, the code within the statement is executed. If not, then\
    \ the code after the statement is executed instead.\n\n**STEP 1**  \nFirst, create\
    \ a new C++ file and enter the relevant standard headers, as usual.\n\n```\n```cpp\n\
    #include <iostream>\nusing namespace std;\n\nint main ()\n{\n\n}\n```\n```\n\n\
    ![](img/bdf3833c5133a7f9b1eef9ebdb21a76d_61_0.png)\n\n**STEP 2**  \nIf is best\
    \ explained when you use a number-based condition:\n\n```\n```cpp\n{\n    int\
    \ num = 1;\n    if ( num < 30 )\n    {\n        cout << “The number is less than\
    \ 30.” << endl;\n    }\n    cout << “Value of number is: “ << num << endl;\n \
    \   return 0;\n}\n```\n```\n\n![](img/bdf3833c5133a7f9b1eef9ebdb21a76d_61_1.png)\n\
    \n**STEP 3**  \nWhat’s going on here? To begin, an integer called `num` was created\
    \ and assigned with the value of 1. The if statement comes next, and in this case\
    \ we’ve instructed the code that if the condition, the value, of `num` is less\
    \ than 1, then the code within the braces should be executed.\n\n![](img/bdf3833c5133a7f9b1eef9ebdb21a76d_61_2.png)\n\
    \n**STEP 4**  \nThe second cout statement displays the current value of num and\
    \ the program terminates safely. It’s easy to see how the if statement works if\
    \ you were to change the initial value of num from 1 to 31.\n\n![](img/bdf3833c5133a7f9b1eef9ebdb21a76d_61_3.png)"
  - "[PAGE 62]\n\n# STEP 5\n\nWhen you change the value to anything above 30, then\
    \ build and run the code, you can see that the only line to be outputted to the\
    \ screen is the second cout statement, displaying the current value of num. This\
    \ is because the initial if statement is False, so it ignores the code within\
    \ the braces.\n\n![](img/bdf3833c5133a7f9b1eef9ebdb21a76d_62_0.png)\n\n# STEP\
    \ 6\n\nYou can include an if statement within a do…while loop. For example:\n\n\
    ```\n```cpp\n{\n    float temp;\n\n    do\n    {\n        cout << \"\\nEnter the\
    \ temperature (or -10000 to exit): \" << endl;\n        cin >> temp;\n       \
    \ if (temp <= 0)\n        {\n            cout << \"\\nBrrrr, it's really cold!\"\
    \ << endl;\n        }\n        if (temp > 0)\n        {\n            cout << \"\
    \\nAt least it's not freezing!\" << endl;\n        }\n    }\n    while (temp !=\
    \ -10000);\n\n    cout << \"\\nGood bye\\n\" << endl;\n\n    return 0;\n}\n```\n\
    ```\n\n![](img/bdf3833c5133a7f9b1eef9ebdb21a76d_62_1.png)\n\n# STEP 7\n\nThe code\
    \ in Step 6 is simplistic but effective. First we created a floating point integer\
    \ called temp, then a do…while loop that asks the user to enter the current temperature.\n\
    \n![](img/bdf3833c5133a7f9b1eef9ebdb21a76d_62_2.png)\n\n# STEP 8\n\nThe first\
    \ if statement checks to see if the user’s inputted value is less than or equal\
    \ to zero. If it is, then the output is ‘Brrr, it’s really cold!’. Otherwise,\
    \ if the input is greater than zero, the code outputs ‘At least it’s not freezing!’.\n\
    \n![](img/bdf3833c5133a7f9b1eef9ebdb21a76d_62_3.png)\n\n# STEP 9\n\nFinally, if\
    \ the user enters the value -10000, which is impossibly cold so is therefore a\
    \ unrealistic value, the do…while loop is terminated and a friendly ‘Good bye’\
    \ is displayed to the screen.\n\n![](img/bdf3833c5133a7f9b1eef9ebdb21a76d_62_4.png)\n\
    \n# STEP 10\n\nUsing if is quite powerful, if it’s used correctly. Just remember\
    \ that if the condition is true then the code executes what’s in the braces. If\
    \ not, it continues on its merry way. See what else you can come up with using\
    \ if and a combination of loops.\n\n![](img/bdf3833c5133a7f9b1eef9ebdb21a76d_62_5.png)"
  - "[PAGE 63]\n\n# If… Else Statement\n\nThere is a much better way to use an if\
    \ statement in your code, with if… else. If… else works in much the same way as\
    \ a standard if statement. If the Boolean expression is true, the code within\
    \ the braces is executed. Else, the code within the next set of braces is used\
    \ instead.\n\n# IF YES, ELSE NO\n\nThere are two sections of code that can be\
    \ executed depending on the outcome in an if… else statement. It’s quite easy\
    \ to visualise once you get used to its structure.\n\nSTEP 1 — Begin with a new\
    \ C++ file and the standard headers:\n\n```\n```cpp\n#include <iostream>\nusing\
    \ namespace std;\n\nint main ()\n{\n}\n```\n```\n\n![](img/bdf3833c5133a7f9b1eef9ebdb21a76d_63_0.png)\n\
    \nSTEP 2 — Let’s expand the code from the If Statement on the previous page:\n\
    \n```\n```cpp\n{\n    int num = 1;\n\n    if ( num < 30 )\n    {\n        cout\
    \ << “The number is less than 30!” << endl;\n    }\n    else\n    {\n        cout\
    \ << “The number is greater than 30!” << endl;\n    }\n\n    return 0;\n}\n```\n\
    ```\n\n![](img/bdf3833c5133a7f9b1eef9ebdb21a76d_63_1.png)\n\nSTEP 3 — The first\
    \ line in the code creates the integer called num and gives it a value of 1. The\
    \ if statement checks to see if the value of num is less than thirty and if it\
    \ is it outputs “The number is less than 30!” to the console.\n\n```\n```cpp\n\
    if ( num < 30 )\n{\n    cout << \"The number is less than 30!\" << endl;\n}\n\
    ```\n```\n\nSTEP 4 — The else companion to if checks if the number is greater\
    \ than 30 and if so, then displays “The number is greater than 30!” to the console;\
    \ and finally, the code is terminated satisfactorily.\n\n```\n```cpp\n}\nelse\n\
    {\n    cout << \"The number is greater than 30!\" << endl;\n}\n```\n```\n\nSTEP\
