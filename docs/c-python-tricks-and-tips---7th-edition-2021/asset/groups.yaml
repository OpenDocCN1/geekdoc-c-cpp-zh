    ### STEP 9\n\nHere’s an example of a for loop displaying the multiplication tables\
    \ of a user inputted number. Handy for students:\n\n```cpp\n{\n    int n;\n\n\
    \    cout << \"Enter a number to view its times table: \";\n    cin >> n;\n\n\
    \    for (int i = 1; i <= 12; ++i) {\n        cout << n << \" x \" << i << \"\
    \ = \" << n * i << endl;\n    }\n\n    return 0;\n}\n```\n\n![](img/bdf3833c5133a7f9b1eef9ebdb21a76d_58_3.png)\n\
    \n### STEP 10\n\nThe value of the integer i can be expanded from 12 to whatever\
    \ number you want, displaying a very large multiplication table in the process\
    \ (or a small one). Of course the data type within a for loop doesn’t have to\
    \ be an integer, as long as it’s valid, it works.\n\n```cpp\nfor ( float i = 0.00;\
    \ i < 1.00; i += 0.01)\n{\n    cout << i << endl;\n}\n\nreturn 0;\n```\n\n![](img/bdf3833c5133a7f9b1eef9ebdb21a76d_58_4.png)\n\
    \n## Do... While Loop\n\nA do... while loop differs slightly from that of a for\
    \ or even a while loop. Both for and while set and examine the state of the condition\
    \ at the start of the loop, or the top of the loop if you prefer. However, a do...\
    \ while loop is similar to a while loop but instead checks the condition at the\
    \ bottom of the loop.\n\n### DO LOOPS\n\nThe good thing about a do... while loop\
    \ is that it’s guaranteed to run through at least once. Its structure is: do,\
    \ followed by statements, while condition is true. This is how it works.\n\n###\
    \ STEP 1\n\n— Begin with a new, blank C++ file and enter the standard headers:\n\
    \n```cpp\n#include <iostream>\nusing namespace std;\n\nint main ()\n{\n}\n```\n\
    \n![](img/bdf3833c5133a7f9b1eef9ebdb21a76d_59_0.png)\n\n### STEP 2\n\n— Begin\
    \ with a simple number count:\n\n```cpp\n{\n    int num = 1;\n    do\n    {\n\
    \        cout << \"Number: \" << num << endl;\n        num = num + 1;\n    }\n\
    \    while (num < 30 );\n\n    return 0;\n}\n```\n\n![](img/bdf3833c5133a7f9b1eef9ebdb21a76d_59_1.png)\n\
    \n### STEP 3\n\n— Now, here’s a look at the structure of a do... while loop. First\
    \ you create an integer called num, with the value of 1. Now the do... while loop\
    \ begins. The code inside the body of the loop is executed at least once, then\
    \ the condition is checked for either true or false.\n\n```cpp\n// Create integer\
    \ with the value of 1\nint num = 1;\n\n// Do... While loop begins\ndo\n{\n   \
    \ cout << \"Number: \" << num << endl; // Display the current value of num\n \
    \   num = num + 1; // Adds 1 to the value of num\n}\nwhile (num < 30 ); // Tests\
    \ the condition of num (true or false)\n```\n\n### STEP 4\n\n— If the condition\
    \ is true, the loop is executed. This continues until the condition is false.\
    \ When the condition has been expressed as false, the loop terminates and the\
    \ code continues. This means you can create a loop where the code continues until\
    \ the user enters a certain character.\n\n![](img/bdf3833c5133a7f9b1eef9ebdb21a76d_59_2.png)\n"
  mdcn: "\n## while 循环\n\n### 第6步\n\n务必记住，不要在 while 语句末尾添加分号。为什么？如你所知，分号表示 C++ 代码行的结束。如果你在\
    \ while 语句末尾放置一个分号，你的循环将永久卡住，直到你关闭程序。\n\n![](img/bdf3833c5133a7f9b1eef9ebdb21a76d_56_0.png)\n\
    \n### 第7步\n\n在我们的示例中，如果执行代码，num 的值将是 1，这是由 int 语句设置的。当代码执行到 while 语句时，它读取到：只要\
    \ 1 小于 30 的条件为真，就循环。分号结束了这一行，因此循环会重复；但它永远不会给 num 加 1，因为它不会继续执行复合语句。\n\n![](img/bdf3833c5133a7f9b1eef9ebdb21a76d_56_1.png)\n\
    \n### 第8步\n\n你可以调整 while 语句，根据循环内的代码显示不同结果。例如，要逐词读取诗歌《辛梅里亚》，你会输入：\n\n```cpp\n\
    #include <iostream>\n#include <fstream>\nusing namespace std;\n\nint main ()\n\
    {\n    string word;\n    ifstream newfile (\"C:\\\\users\\\\david\\\\Documents\\\
    \\Cimmeria.txt\");\n\n    cout << \"Cimmeria, by Robert E Howard: \\n\" << endl;\n\
    \n    while (newfile >> word)\n    {\n        cout << word << endl;\n    }\n\n\
    \    return 0;\n}\n```\n\n### 第9步\n\n你可以进一步扩展代码，使诗歌中的每个单词每隔一秒出现。为此，你需要引入一个新库 <windows.h>。这是一个仅限\
    \ Windows 的库，在其中可以使用 Sleep() 函数：\n\n```cpp\n#include <iostream>\n#include <fstream>\n\
    #include <windows.h>\nusing namespace std;\n\nint main ()\n{\n    string word;\n\
    \    ifstream newfile (\"C:\\\\users\\\\david\\\\Documents\\\\Cimmeria.txt\");\n\
    \n    cout << \"Cimmeria, by Robert E Howard: \\n\" << endl;\n\n    while (newfile\
    \ >> word)\n    {\n        cout << word << endl;\n        Sleep(1000);\n    }\n\
    \n    return 0;\n}\n```\n\n![](img/bdf3833c5133a7f9b1eef9ebdb21a76d_56_2.png)\n\
    \n### 第10步\n\nSleep() 以毫秒为单位工作，因此 Sleep(1000) 是一秒，Sleep(10000) 是十秒，依此类推。将 sleep\
    \ 函数（以及它所需的头文件）与 while 循环结合，可以编写出一些有趣的倒计时代码。\n\n```cpp\n#include <iostream>\n\
    #include <windows.h>\nusing namespace std;\n\nint main ()\n{\n    int a = 10;\n\
    \n    while (a != 0)\n    {\n        cout << a << endl;\n        a = a - 1;\n\
    \        Sleep(1000);\n    }\n\n    cout << \"\\nBlast Off!\" << endl;\n\n   \
    \ return 0;\n}\n```\n\n## for 循环\n\n在某些方面，for 循环的工作方式与 while 循环非常相似，尽管其结构不同。for\
    \ 循环分为三个阶段：初始化、条件和增量步进。一旦设置好，循环会重复执行，直到条件变为假。\n\n### 循环的循环\n\nfor 循环的初始化阶段只执行一次，它设置循环的起始参考点。循环会评估条件以判断其为真还是假，然后执行增量。随后循环重复第二阶段和第三阶段。\n\
    \n### 第1步\n\n创建一个新的 C++ 文件，包含标准头文件：\n\n```cpp\n#include <iostream>\nusing namespace\
    \ std;\n\nint main ()\n{\n\n}\n```\n\n![](img/bdf3833c5133a7f9b1eef9ebdb21a76d_57_0.png)\n\
    \n### 第2步\n\n从简单开始，创建一个从 1 数到 30 的 for 循环，每次递增时在屏幕上显示该值：\n\n```cpp\n{\n    //For\
    \ Loop Begins\n    for( int num = 1; num < 30; num = num +1 )\n    {\n       \
    \ cout << \"Number: \" << num << endl;\n    }\n    return 0;\n}\n```\n\n### 第3步\n\
    \n逐步分析 for 循环的过程：首先创建一个名为 num 的整数，并赋值为 1。接下来设置条件，这里是 num 小于 30。最后阶段是创建增量；这里是让\
    \ num 的值加 1。\n\n```cpp\n{\n    //For Loop Begins\n    for( int num = 1; num <\
    \ 30; num = num +1 )\n```\n\n### 第4步\n\n在循环之后，你在大括号中创建了一个复合语句，用于显示整数 num 的当前值。每次\
    \ for 循环重复自身（即循环的第二和第三阶段）时，它都会加 1，直到 <30 的条件为假。然后循环结束，代码继续执行，最后以 return 0 干净地结束。\n\
    \n![](img/bdf3833c5133a7f9b1eef9ebdb21a76d_57_1.png)\n\n### 第5步\n\n在 C++ 中，for\
    \ 循环是一个相当整洁的封装，全部包含在其自身的括号内，而循环外部的其他元素则显示在下方。如果你想创建一个 10 秒倒计时，可以使用：\n\n```cpp\n\
    #include <iostream>\n#include <windows.h>\nusing namespace std;\n\nint main ()\n\
    {\n    //For Loop Begins\n    for( int a = 10; a != 0; a = a -1 )\n    {\n   \
    \     cout << a << endl;\n        Sleep(1000);\n    }\n\n    cout << \"\\nBlast\
    \ Off!\" << endl;\n    return 0;\n}\n```\n\n### 第6步\n\n对于倒计时代码，不要忘记包含 windows.h\
    \ 库，以便使用 Sleep 命令。构建并运行代码；在命令控制台中，你可以看到数字从 10 到 1 以一秒为增量倒计时，直到到达零并出现 Blast Off!。\n\
    \n![](img/bdf3833c5133a7f9b1eef9ebdb21a76d_58_0.png)\n\n### 第7步\n\n当然，你可以在 for\
    \ 循环中加入更多内容，包括一些用户输入：\n\n```cpp\nint i, n, fact = 1;\n\ncout << \"Enter a whole\
    \ number: \";\ncin >> n;\n\nfor (i = 1; i <= n; ++i) {\n    fact *= i;\n}\n\n\
    cout << \"\\nFactorial of \" << n << \" = \" << fact << endl;\n\nreturn 0;\n```\n\
    \n![](img/bdf3833c5133a7f9b1eef9ebdb21a76d_58_1.png)\n\n### 第8步\n\n第 7 步的代码在构建并运行后，会要求输入一个数字，然后通过\
    \ for 循环显示该数字的阶乘。用户的数字存储在整数 n 中，随后整数 i 用于检查条件为真还是假，每次加 1 并与用户的数字 n 进行比较。\n\n![](img/bdf3833c5133a7f9b1eef9ebdb21a76d_58_2.png)\n\
    \n### 第9步\n\n下面是一个 for 循环示例，显示用户输入数字的乘法表。对学生来说很方便：\n\n```cpp\n{\n    int n;\n\n\
    \    cout << \"Enter a number to view its times table: \";\n    cin >> n;\n\n\
    \    for (int i = 1; i <= 12; ++i) {\n        cout << n << \" x \" << i << \"\
    \ = \" << n * i << endl;\n    }\n\n    return 0;\n}\n```\n\n![](img/bdf3833c5133a7f9b1eef9ebdb21a76d_58_3.png)\n\
    \n### 第10步\n\n整数 i 的值可以从 12 扩展到任意你想要的数字，并在此过程中显示一个非常大的乘法表（或较小的乘法表）。当然，for 循环中的数据类型不必是整数，只要是有效的，就可以工作。\n\
    \n```cpp\nfor ( float i = 0.00; i < 1.00; i += 0.01)\n{\n    cout << i << endl;\n\
    }\n\nreturn 0;\n```\n\n![](img/bdf3833c5133a7f9b1eef9ebdb21a76d_58_4.png)\n\n\
    ## do... while 循环\n\ndo... while 循环与 for 甚至 while 循环略有不同。for 和 while 都在循环开始时（或者如果你愿意，在循环顶部）设置并检查条件状态。然而，do...\
    \ while 循环与 while 循环类似，但它是在循环底部检查条件。\n\n### do 循环\n\ndo... while 循环的好处是它保证至少执行一次。其结构是：do，后接语句，while\
    \ 条件为真。它的工作方式如下。\n\n### 第1步\n\n——从一个新的空白 C++ 文件开始，并输入标准头文件：\n\n```cpp\n#include\
    \ <iostream>\nusing namespace std;\n\nint main ()\n{\n}\n```\n\n![](img/bdf3833c5133a7f9b1eef9ebdb21a76d_59_0.png)\n\
    \n### 第2步\n\n——从一个简单的数字计数开始：\n\n```cpp\n{\n    int num = 1;\n    do\n    {\n \
    \       cout << \"Number: \" << num << endl;\n        num = num + 1;\n    }\n\
    \    while (num < 30 );\n\n    return 0;\n}\n```\n\n![](img/bdf3833c5133a7f9b1eef9ebdb21a76d_59_1.png)\n\
    \n### 第3步\n\n——现在来看看 do... while 循环的结构。首先创建一个名为 num 的整数，值为 1。现在 do... while 循环开始。循环体内的代码至少执行一次，然后检查条件为真还是假。\n\
    \n```cpp\n// Create integer with the value of 1\nint num = 1;\n\n// Do... While\
    \ loop begins\ndo\n{\n    cout << \"Number: \" << num << endl; // Display the\
    \ current value of num\n    num = num + 1; // Adds 1 to the value of num\n}\n\
    while (num < 30 ); // Tests the condition of num (true or false)\n```\n\n### 第4步\n\
    \n——如果条件为真，则执行循环。这一过程持续到条件为假。当条件被表示为假时，循环终止，代码继续执行。这意味着你可以创建一个循环，让代码持续执行，直到用户输入某个特定字符。\n\
    \n![](img/bdf3833c5133a7f9b1eef9ebdb21a76d_59_2.png)\n\n"
