    \ it’s not freezing!”。\n\n![](img/bdf3833c5133a7f9b1eef9ebdb21a76d_62_3.png)\n\
    \n### 第 9 步\n\n最后，如果用户输入值 -10000（这个温度冷得不可能，因此是不现实的值），do…while 循环终止，并向屏幕显示友好的“Good\
