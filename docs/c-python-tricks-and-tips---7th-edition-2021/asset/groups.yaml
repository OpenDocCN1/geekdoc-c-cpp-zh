    while(run==1):\n    try:\n        os.system('clear')\n    except OSError:\n  \
    \      os.system('cls')\n    print('\\n>>>>>>>>>>Python 3 File Manager<<<<<<<<<<\\\
    n')\n```\n\n## Beginner C++ Mistakes\n\nThere are many pitfalls the C++ developer\
    \ can encounter, especially as this is a more complex and often unforgiving language\
    \ to master. Beginners need to take C++ a step at a time and digest what they’ve\
    \ learned before moving on.\n\n### Common C++ Mistakes\n\nAdmittedly it’s not\
    \ just C++ beginners that make the kinds of errors we outline on these pages,\
    \ even hardened coders are prone to the odd mishap here and there. Here are some\
    \ common issues to try and avoid.\n\n### Undeclared Identifiers\n\nA common C++\
    \ mistake, and to be honest a common mistake with most programming languages,\
    \ is when you try and output a variable that doesn’t exist. Displaying the value\
    \ of x on-screen is fine but not if you haven’t told the compiler what the value\
    \ of x is to begin with.\n\n![](img/bdf3833c5133a7f9b1eef9ebdb21a76d_71_0.png)\n\
    \n### Std Namespace\n\nReferencing the Standard Library is common for beginners\
    \ throughout their code, but if you miss the std:: element of a statement, your\
    \ code errors out when compiling. You can combat this by adding:\n\n```cpp\nusing\
    \ namespace std;\n```\n\nUnder the #include part and simply using cout, cin and\
    \ so on from then on.\n\n![](img/bdf3833c5133a7f9b1eef9ebdb21a76d_71_1.png)\n\n\
    ### Semicolons\n\nRemember that each line of a C++ program must end with a semicolon.\
    \ If it doesn’t then the compiler treats the line with the missing semicolon as\
    \ the same line with the next semicolon on. This creates all manner of problems\
    \ when trying to compile, so don’t forget those semicolons.\n\n![](img/bdf3833c5133a7f9b1eef9ebdb21a76d_71_2.png)\n\
    \n### GCC or G++\n\nIf you’re compiling in Linux then you will no doubt come across\
    \ gcc and g++. In short, gcc is the GNU Compiler Collection (or GNU C Compiler\
    \ as it used to be called) and g++ is the GNU C++ (the C++ version) of the compiler.\
    \ If you’re compiling C++ then you need to use g++, as the incorrect compiler\
    \ drivers will be used.\n\n![](img/bdf3833c5133a7f9b1eef9ebdb21a76d_71_3.png)\n\
    \n### Comments (Again)\n\nIndeed the mistake of never making any comments on code\
    \ is back once more. As we’ve previously bemoaned, the lack of readable identifiers\
    \ throughout the code makes it very difficult to look back at how it worked, for\
    \ both you and someone else. Use more comments.\n\n```cpp\n#include <iostream>\n\
    #include <vector>\n#include <algorithm>\nusing namespace std;\n\nint main()\n\
    {\n    vector<double> v;\n    double d;\n    while (cin >> d) v.push_back(d);\
    \    // read elements\n    if (cin.eof()) {                    // check if input\
    \ failed\n        cerr << \"format error\\n\";       // error return\n       \
    \ return 1;\n    }\n\n    cout << \"read \" << v.size() << \" elements\\n\";\n\
    \    reverse(v.begin(), v.end());\n    cout << \"elements in reverse order:\\\
    n\";\n    for (int i = 0; i < v.size(); ++i) cout << v[i] << '\\n';\n\n    return\
    \ 0;                           // success return\n}\n```\n\n### Quotes\n\nMissing\
    \ quotes is a common mistake to make, for every level of user. Remember that quotes\
    \ need to encase strings and anything that’s going to be outputted to the screen\
    \ or into a file, for example. Most compiler errors are due to missing quotes\
    \ in the code.\n\n![](img/bdf3833c5133a7f9b1eef9ebdb21a76d_72_0.png)\n\n### Extra\
    \ Semicolons\n\nWhile it’s necessary to have a semicolon at the end of every C++\
    \ line, there are some exceptions to the rule. Semicolons need to be at the end\
    \ of every complete statement but some lines of code aren’t complete statements.\
    \ Such as:\n\n```text\n#include\nif lines\nswitch lines\n```\n\nIf it sounds confusing\
    \ don’t worry, the compiler lets you know where you went wrong.\n\n```cpp\n//\
    \ Program to print positive number entered by the user\n// If user enters negative\
    \ number, it is skipped\n\n#include <iostream>\nusing namespace std;\n\nint main()\n\
    {\n    int number;\n    cout << \"Enter an integer: \";\n    cin >> number;\n\n\
    \    // checks if the number is positive\n    if (number > 0)\n    {\n       \
    \ cout << \"You entered a positive integer: \" << number << endl;\n    }\n\n \
    \   cout << \"This statement is always executed.\";\n    return 0;\n}\n```\n\n\
    ### Too Many Braces\n\nThe braces, or curly brackets, are beginning and ending\
    \ markers around blocks of code. So for every `{` you must have a `}`. Often it’s\
    \ easy to include or miss out one or the other facing brace when writing code;\
    \ usually when writing in a text editor, as an IDE adds them for you.\n\n```cpp\n\
    #include <iostream>\nusing namespace std;\n\nint main()\n{\n    int x;\n    string\
    \ mystring = \"This is a string!\\n\";\n    cout << \"What's the value of x? \"\
    ;\n    cin >> x;\n    cout << x;\n    {\n        cout << \"\\n\\n\";\n       \
    \ cout << mystring;\n    }\n}\n```\n\n### Initialise Variables\n\nIn C++ variables\
    \ aren’t initialised to zero by default. This means if you create a variable called\
    \ x then, potentially, it is given a random number from 0 to 18,446,744,073,709,551,616,\
    \ which can be difficult to include in an equation. When creating a variable,\
    \ give it the value of zero to begin with: x=0.\n\n```cpp\n#include <iostream>\n\
    using namespace std;\n\nint main()\n{\n    int x;\n    x=0;\n\n    cout << x;\n\
    }\n```\n\n### a.out\n\nA common mistake when compiling in Linux is forgetting\
    \ to name your C++ code post compiling. When you compile from the Terminal, you\
    \ enter:\n\n```bash\ng++ code.cpp\n```\n\nThis compiles the code in the file code.cpp\
    \ and create an a.out file that can be executed with ./a.out. However, if you\
    \ already have code in a.out then it’s overwritten. Use:\n\n```bash\ng++ code.cpp\
    \ -o nameofprogram\n```\n\n![](img/bdf3833c5133a7f9b1eef9ebdb21a76d_72_1.png)\n"
