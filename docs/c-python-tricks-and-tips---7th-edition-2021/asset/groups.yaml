    ## If 语句\n\n决策语句“If”可能是任何编程语言中最常用的语句之一，无论它是 C++、Python、BASIC 还是其他语言。它表示代码中的一个分支点：如果某个条件为真，就执行这个；如果为假，就执行那个。\n\
    \n### 仅 IF 时\n\nIf 在其语句中使用布尔表达式。如果布尔表达式为真，则执行该语句内的代码。否则，改为执行该语句之后的代码。\n\n**第 1\
    \ 步**  \n首先，像往常一样新建一个 C++ 文件并输入相关的标准头文件。\n\n```cpp\n#include <iostream>\nusing\
