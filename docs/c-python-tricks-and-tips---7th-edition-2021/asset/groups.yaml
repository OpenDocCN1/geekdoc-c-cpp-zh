  - "[PAGE 33]\n\n# # Random Module\n\nThe random module is one you will likely come\
    \ across many times in your Python programming lifetime; as the name suggests,\
    \ it’s designed to create random numbers or letters. However, it’s not exactly\
    \ random but it will suffice for most needs.\n\n# ## RANDOM NUMBERS\n\nThere are\
    \ numerous functions within the random module, which when applied can create some\
    \ interesting and very useful Python programs.\n\n**STEP 1**  \nJust as with other\
    \ modules you need to import random before you can use any of the functions we’re\
    \ going to look at in this tutorial. Let’s begin by simply printing a random number\
    \ from 1 to 5:\n\n```\n```python\nimport random\nprint(random.randint(0,5))\n\
    ```\n```\n\n![](img/bdf3833c5133a7f9b1eef9ebdb21a76d_33_0.png)\n\n**STEP 2** \
    \ \nIn our example the number four was returned. However, enter the print function\
    \ a few more times and it will display different integer values from the set of\
    \ numbers given, zero to five. The overall effect, although pseudo-random, is\
    \ adequate for the average programmer to utilise in their code.\n\n![](img/bdf3833c5133a7f9b1eef9ebdb21a76d_33_1.png)\n\
    \n**STEP 3**  \nFor a bigger set of numbers, including floating point values,\
    \ you can extend the range by using the multiplication sign:\n\n```\n```python\n\
    import random\nprint(random.random() *100)\n```\n```\n\nWill display a floating\
    \ point number between 0 and 100, to the tune of around fifteen decimal points.\n\
    \n![](img/bdf3833c5133a7f9b1eef9ebdb21a76d_33_2.png)\n\n**STEP 4**  \nHowever,\
    \ the random module isn’t used exclusively for numbers. You can use it to select\
    \ an entry from a list from random, and the list can contain anything:\n\n```\n\
    ```python\nimport random\nrandom.choice([“Conan”, “Valeria”, “Belit”])\n```\n\
    ```\n\nThis will display one of the names of our adventurers at random, which\
    \ is a great addition to a text adventure game.\n\n![](img/bdf3833c5133a7f9b1eef9ebdb21a76d_33_3.png)\n\
    \n**STEP 5**  \nYou can extend the previous example somewhat by having random.choice()\
    \ select from a list of mixed variables. For instance:\n\n```\n```python\nimport\
    \ random\nlst=[“David”, 44, “BDM Publications”, 3245.23, “Pi”, True, 3.14, “Python”]\n\
    rnd=random.choice(lst)\nprint(rnd)\n```\n```\n\n![](img/bdf3833c5133a7f9b1eef9ebdb21a76d_33_4.png)"
  - "[PAGE 34]\n\n# STEP 6\n\nInterestingly, you can also use a function within the\
    \ random module to shuffle the items in the list, thus adding a little more randomness\
    \ into the equation:\n\n```\n```python\nrandom.shuffle(lst)\nprint(lst)\n```\n\
    ```\n\nThis way, you can keep shuffling the list before displaying a random item\
    \ from it.\n\n![](img/bdf3833c5133a7f9b1eef9ebdb21a76d_34_0.png)\n\n# STEP 7\n\
    \nUsing shuffle, you can create an entirely random list of numbers. For example,\
    \ within a given range:\n\n```\n```python\nimport random\nlst=[i for i in range(20)]\n\
    random.shuffle(lst)\nprint(lst)\n```\n```\n\nKeep shuffling the list and you can\
    \ have a different selection of items from 0 to 20 every time.\n\n![](img/bdf3833c5133a7f9b1eef9ebdb21a76d_34_1.png)\n\
    \n# STEP 8\n\nYou can also select a random number from a given range in steps,\
    \ using the start, stop, step loop:\n\n```\n```python\nimport random\nfor i in\
    \ range(10):\n    print(random.randrange(0, 200, 7))\n```\n```\n\nResults will\
    \ vary but you get the general idea as to how it works.\n\n![](img/bdf3833c5133a7f9b1eef9ebdb21a76d_34_2.png)\n\
    \n# STEP 9\n\nLet’s use an example piece of code which flips a virtual coin ten\
    \ thousand times and counts how many times it will land on heads or tails:\n\n\
    ```\n```python\nimport random\noutput={\"Heads\":0, \"Tails\":0}\ncoin=list(output.keys())\n\
    \nfor i in range(10000):\n    output[random.choice(coin)]+=1\n\nprint(\"Heads:\"\
    , output[\"Heads\"])\nprint(\"Tails:\", output[\"Tails\"])\n```\n```\n\n![](img/bdf3833c5133a7f9b1eef9ebdb21a76d_34_3.png)\n\
    \n# STEP 10\n\nHere’s an interesting piece of code. Using a text file containing\
