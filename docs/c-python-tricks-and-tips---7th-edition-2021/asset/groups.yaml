    \ GNU C++（C++ 版本）。如果你要编译 C++，就需要使用 g++，否则会使用错误的编译器驱动程序。\n\n![](img/bdf3833c5133a7f9b1eef9ebdb21a76d_71_3.png)\n\
    \n### 注释（再次）\n\n确实，从不对代码做任何注释这一错误又回来了。正如我们之前所抱怨的那样，代码中缺少可读的标识符会让你和其他人都很难回顾它当初是如何工作的。请多使用注释。\n\
