  - "[PAGE 46]\n\n# STEP 5\n\nThe principal works the same as the previous code. The\
    \ user’s input, their name, is stored in a string, because it contains multiple\
    \ characters, and retrieved in the second `cout` line. As long as the variable\
    \ ‘name’ doesn’t change, then you can recall it wherever you like in your code.\n\
    \n![](img/bdf3833c5133a7f9b1eef9ebdb21a76d_46_0.png)\n\n# STEP 6\n\nYou can chain\
    \ input requests to the user but just make sure you have a valid variable to store\
    \ the input to begin with. Let’s assume you want the user to enter two whole numbers:\n\
    \n```\n```cpp\n#include <iostream>\nusing namespace std;\n\nint main ()\n{\n \
    \   int num1, num2;\n\n    cout << “Enter two whole numbers: “;\n    cin >> num1\
    \ >> num2;\n\n    cout << “you entered “ << num1 << “ and “ << num2 << “\\n”;\n\
    }\n```\n```\n\n![](img/bdf3833c5133a7f9b1eef9ebdb21a76d_46_1.png)\n\n# STEP 7\n\
    \nLikewise, inputted data can be manipulated once you have it stored in a variable.\
    \ For instance, ask the user for two numbers and do some maths on them:\n\n```\n\
    ```cpp\n#include <iostream>\nusing namespace std;\n\nint main ()\n{\n    float\
    \ num1, num2;\n\n    cout << “Enter two numbers: \\n”;\n    cin >> num1 >> num2;\n\
    \n    cout << num1 << “ + “ << num2 << “ is: “ << num1 + num2 << “\\n”;\n}\n```\n\
    ```\n\n![](img/bdf3833c5133a7f9b1eef9ebdb21a76d_46_2.png)\n\n# STEP 8\n\nWhile\
    \ `cin` works well for most input tasks, it does have a limitation. `Cin` always\
    \ considers spaces as a terminator, so it’s designed for just single words not\
    \ multiple words. However, `getline` takes `cin` as the first argument and the\
    \ variable as the second:\n\n```\n```cpp\n#include <iostream>\nusing namespace\
    \ std;\n\nint main ()\n{\n    string mystr;\n    cout << “Enter a sentence: \\\
    n”;\n    getline(cin, mystr);\n\n    cout << “Your sentence is: “ << mystr.size()\
    \ <<\n    “ characters long.\\n”;\n}\n```\n```\n\n![](img/bdf3833c5133a7f9b1eef9ebdb21a76d_46_3.png)\n\
    \n# STEP 9\n\nBuild and execute the code, then enter a sentence with spaces. When\
    \ you’re done the code reads the number of characters. If you remove the getline\
    \ line and replace it with cin >> mystr and try again, the result displays the\
    \ number of characters up to the first space.\n\n![](img/bdf3833c5133a7f9b1eef9ebdb21a76d_46_4.png)\n\
    \n# STEP 10\n\nGetline is usually a command that new C++ programmers forget to\
    \ include. The terminating white space is annoying when you can’t figure out why\
    \ your code isn’t working. In short, it’s best to use `getline(cin, variable)`\
    \ in future:\n\n```\n```cpp\n#include <iostream>\nusing namespace std;\n\nint\
    \ main ()\n{\n    string name;\n    cout << “Enter your full name: \\n”;\n   \
    \ getline(cin, name);\n\n    cout << “\\nHello, “ << name << “\\n”;\n}\n```\n\
    ```\n\n![](img/bdf3833c5133a7f9b1eef9ebdb21a76d_46_5.png)"
  - "[PAGE 47]\n\n# Character Literals\n\nIn C++ a literal is an object or variable\
    \ that once defined remains the same throughout the code. However, a character\
    \ literal is defined by a backslash, such as the `\\n` you’ve been using at the\
    \ end of a cout statement to signify a new line.\n\n# ESCAPE SEQUENCE\n\nWhen\
    \ used in something like a cout statement, character literals are also called\
    \ Escape Sequence Codes. They allow you to insert a quote, an alert, new line\
    \ and much more.\n\n**STEP 1** Create a new C++ file and enter the relevant headers:\n\
    \n```\n```cpp\n#include <iostream>\nusing namespace std;\n\nint main ()\n{\n\n\
    }\n```\n```\n\n![](img/bdf3833c5133a7f9b1eef9ebdb21a76d_47_0.png)\n\n**STEP 2**\
    \ You’ve already experienced the `\\n` character literal placing a new line wherever\
    \ it’s called. The line: `cout << \"Hello\\n\" << \"I’m a C++\\n\" << \"Program\\\
    n\";` outputs three lines of text, each starting after the last `\\n`.\n\n![](img/bdf3833c5133a7f9b1eef9ebdb21a76d_47_1.png)\n\
    \n**STEP 3** If you wanted to insert speech quotes inside a cout statement, you\
    \ would have to use a backslash as it already uses quotes:\n\n```\n```cpp\n#include\
    \ <iostream>\nusing namespace std;\n\nint main ()\n{\n    cout << “Hello, user.\
    \ This is how to use \\\\\"quotes\\\\\".”;\n}\n```\n```\n\n![](img/bdf3833c5133a7f9b1eef9ebdb21a76d_47_2.png)\n\
    \n**STEP 4** There’s even a character literal that can trigger an alarm. In Windows\
    \ 10, it’s the notification sound that chimes when you use `\\a`. Try this code,\
    \ and turn up your sound.\n\n```\n```cpp\n#include <iostream>\nusing namespace\
    \ std;\n\nint main ()\n{\n    cout << “ALARM! \\\\a”;\n}\n```\n```\n\n![](img/bdf3833c5133a7f9b1eef9ebdb21a76d_47_3.png)"
  - "[PAGE 48]\n\n# A HANDY CHART\n\nThere are numerous character literals, or escape\
    \ sequence codes, to choose from. We therefore thought it would be good for you\
    \ to have a handy chart available, for those times when you need to insert a code.\n\
    \n| ESCAPE SEQUENCE CODE | CHARACTER |\n| --- | --- |\n| `\\\\` | Backslash |\n\
    | `\\'` | Single Quote |\n| `\\\"` | Double Quote (Speech Marks) |\n| `\\?` |\
    \ Question Mark |\n| `\\a` | Alert/Alarm |\n| `\\b` | Backspace |\n| `\\f` | Form\
    \ Feed |\n| `\\n` | New Line |\n| `\\r` | Carriage Return |\n| `\\t` | Horizontal\
    \ Tab |\n| `\\v` | Vertical Tab |\n| `\\0` | Null Character |\n| `\\uxxxx` | Unicode\
    \ (UTF-8) |\n| `\\Uxxxxxxxx` | Unicode (UTF-16) |\n\n# ## UNICODE CHARACTERS (UTF-8)\n\
    \nUnicode characters are symbols or characters that are standard across all platforms.\
    \ For example, the copyright symbol, that can be entered via the keyboard by entering\
    \ the Unicode code, followed by ALT+X. In the case of the copyright symbol enter:\
    \ 00A9 Alt+X. In C++ code, you would enter:\n\n```\n```cpp\n#include <iostream>\n\
    using namespace std;\n\nint main ()\n{\n    cout << \"\\u00A9\";\n}\n```\n```\n\
    \n![](img/bdf3833c5133a7f9b1eef9ebdb21a76d_48_0.png)\n\n# ## UNICODE CHARACTER\
    \ TABLE\n\nA complete list of the available Unicode characters can be found at\
    \ **www.unicode-table.com/en/**. Hover your mouse over the character to see its\
    \ unique code to enter in C++.\n\n![](img/bdf3833c5133a7f9b1eef9ebdb21a76d_48_1.png)"
  - "[PAGE 49]\n\n# # Defining Constants\n\nConstants are fixed values in your code.\
    \ They can be any basic data type but as the name suggests their value remains\
    \ constant throughout the entire code. There are two separate ways to define a\
    \ constant in C++, the #define pre-processor and const.\n\n# # #DEFINE\n\nThe\
    \ pre-processors are instructions to the compiler to pre-process the information\
    \ before it goes ahead and compiles the code. #include is a pre-processor as is\
    \ #define.\n\n# ### STEP 1\n\nYou can use the #define pre-processor to define\
    \ any constants you want in our code. Start by creating a new C++ file complete\
    \ with the usual headers:\n\n```\n~~~cpp\n#include <iostream>\nusing namespace\
    \ std;\n\nint main ()\n{\n}\n~~~\n```\n\n![](img/bdf3833c5133a7f9b1eef9ebdb21a76d_49_0.png)\n\
    \n# ### STEP 2\n\nNow let's assume your code has three different constants: length,\
    \ width and height. You can define them with:\n\n```\n~~~cpp\n#include <iostream>\n\
    using namespace std;\n#define LENGTH 50\n#define WIDTH 40\n#define HEIGHT 60\n\
    \nint main ()\n{\n}\n~~~\n```\n\n![](img/bdf3833c5133a7f9b1eef9ebdb21a76d_49_1.png)\n\
    \n# ### STEP 3\n\nNote the capitals for defined constants, it's considered good\
    \ programming practice to define all constants in capitals. Here, the assigned\
    \ values are 50, 40 and 60, so let's call them up:\n\n```\n~~~cpp\n#include <iostream>\n\
    using namespace std;\n\n#define LENGTH 50\n#define WIDTH 40\n#define HEIGHT 60\n\
    \nint main ()\n{\n    cout << \"Length is: \" << LENGTH << \"\\n\";\n    cout\
    \ << \"Width is: \" << WIDTH << \"\\n\";\n    cout << \"Height is: \" << HEIGHT\
    \ << \"\\n\";\n}\n~~~\n```\n\n![](img/bdf3833c5133a7f9b1eef9ebdb21a76d_49_2.png)\n\
    \n# ### STEP 4\n\nBuild and run the code. Just as expected, it displays the values\
    \ for each of the constants created. It's worth noting that you don't need a semicolon\
    \ when you're defining a constant with the #define keyword.\n\n![](img/bdf3833c5133a7f9b1eef9ebdb21a76d_49_3.png)"
