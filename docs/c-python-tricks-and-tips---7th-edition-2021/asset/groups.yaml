    \ \"The number is less than 30!\" << endl;\n    }\n    else\n    {\n        cout\
    \ << \"The number is greater than 30!\" << endl;\n    }\n\n    return 0;\n}\n\
    ```\n"
  mdcn: "\n### 第 5 步\n\n如果你想编写代码，将用户输入的数字累加，直到用户输入零：\n\n```cpp\n{\n    float number,\
