    \n![](img/bdf3833c5133a7f9b1eef9ebdb21a76d_72_0.png)\n\n### 多余的分号\n\n虽然 C++ 的每一行末尾都需要有分号，但这条规则也有一些例外。分号需要位于每个完整语句的末尾，但有些代码行并不是完整语句。例如：\n\
    \n```text\n#include\nif lines\nswitch lines\n```\n\n如果听起来令人困惑，不用担心，编译器会让你知道哪里出错了。\n\
