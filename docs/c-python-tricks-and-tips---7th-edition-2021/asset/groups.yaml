  - "[PAGE 59]\n\n# Do... While Loop\n\nA do... while loop differs slightly from that\
    \ of a for or even a while loop. Both for and while set and examine the state\
    \ of the condition at the start of the loop, or the top of the loop if you prefer.\
    \ However, a do... while loop is similar to a while loop but instead checks the\
    \ condition at the bottom of the loop.\n\n# DO LOOPS\n\nThe good thing about a\
    \ do... while loop is that it’s guaranteed to run through at least once. It’s\
    \ structure is: do, followed by statements, while condition is true. This is how\
    \ it works.\n\n**STEP 1** — Begin with a new, blank C++ file and enter the standard\
    \ headers:\n\n```\n```cpp\n#include <iostream>\nusing namespace std;\n\nint main\
    \ ()\n{\n}\n```\n```\n\n![](img/bdf3833c5133a7f9b1eef9ebdb21a76d_59_0.png)\n\n\
    **STEP 2** — Begin with a simple number count:\n\n```\n```cpp\n{\n    int num\
    \ = 1;\n    do\n    {\n        cout << “Number: “ << num << endl;\n        num\
    \ = num + 1;\n    }\n    while (num < 30 );\n\n    return 0;\n}\n```\n```\n\n\
    ![](img/bdf3833c5133a7f9b1eef9ebdb21a76d_59_1.png)\n\n**STEP 3** — Now, here’s\
    \ a look at the structure of a do... while loop. First you create an integer called\
    \ num, with the value of 1. Now the do... while loops begins. The code inside\
    \ the body of the loop is executed at least once, then the condition is checked\
    \ for either true or false.\n\n```\n```cpp\n// Create integer with the value of\
    \ 1\nint num = 1;\n\n// Do... While loops begins\ndo\n{\n    cout << \"Number:\
    \ \" << num << endl; // Display the current value of num\n    num = num + 1; //\
    \ Adds 1 to the value of num\n}\nwhile (num < 30 ); // Tests the condition of\
    \ num (true or false)\n```\n```\n\n**STEP 4** — If the condition is true, the\
    \ loop is executed. This continues until the condition is false. When the condition\
    \ has been expressed as false, the loop terminates and the code continues. This\
    \ means you can create a loop where the code continues until the user enters a\
    \ certain character.\n\n![](img/bdf3833c5133a7f9b1eef9ebdb21a76d_59_2.png)"
