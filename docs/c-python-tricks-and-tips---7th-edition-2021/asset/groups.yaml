    \ if your code requires a loop that needs to be executed at least once (for example,\
    \ to check the number of lives in a game), then a do...while loop is perfect.\n\
    \n![](img/bdf3833c5133a7f9b1eef9ebdb21a76d_60_5.png)\n\n## If Statement\n\nThe\
    \ decision making statement ‘If’ is probably one of the most used statements in\
    \ any programming language, regardless of whether it’s C++, Python, BASIC or anything\
    \ else. It represents a junction in the code, where IF one condition is true,\
    \ do this, or IF it’s false, do that.\n\n### IF ONLY\n\nIf uses a Boolean expression\
    \ within its statement. If the Boolean expression is true, the code within the\
    \ statement is executed. If not, then the code after the statement is executed\
    \ instead.\n\n**STEP 1**  \nFirst, create a new C++ file and enter the relevant\
    \ standard headers, as usual.\n\n```cpp\n#include <iostream>\nusing namespace\
    \ std;\n\nint main ()\n{\n\n}\n```\n\n![](img/bdf3833c5133a7f9b1eef9ebdb21a76d_61_0.png)\n\
    \n**STEP 2**  \nIf is best explained when you use a number-based condition:\n\n\
    ```cpp\n{\n    int num = 1;\n    if ( num < 30 )\n    {\n        cout << \"The\
    \ number is less than 30.\" << endl;\n    }\n    cout << \"Value of number is:\
    \ \" << num << endl;\n    return 0;\n}\n```\n\n![](img/bdf3833c5133a7f9b1eef9ebdb21a76d_61_1.png)\n\
    \n**STEP 3**  \nWhat’s going on here? To begin, an integer called `num` was created\
    \ and assigned with the value of 1. The if statement comes next, and in this case\
    \ we’ve instructed the code that if the condition—the value of `num`—is less than\
    \ 30, then the code within the braces should be executed.\n\n![](img/bdf3833c5133a7f9b1eef9ebdb21a76d_61_2.png)\n\
    \n**STEP 4**  \nThe second cout statement displays the current value of num and\
    \ the program terminates safely. It’s easy to see how the if statement works if\
    \ you were to change the initial value of num from 1 to 31.\n\n![](img/bdf3833c5133a7f9b1eef9ebdb21a76d_61_3.png)\n\
    \n### STEP 5\n\nWhen you change the value to anything above 30, then build and\
    \ run the code, you can see that the only line to be outputted to the screen is\
    \ the second cout statement, displaying the current value of num. This is because\
    \ the initial if statement is False, so it ignores the code within the braces.\n\
    \n![](img/bdf3833c5133a7f9b1eef9ebdb21a76d_62_0.png)\n\n### STEP 6\n\nYou can\
    \ include an if statement within a do…while loop. For example:\n\n```cpp\n{\n\
    \    float temp;\n\n    do\n    {\n        cout << \"\\nEnter the temperature\
    \ (or -10000 to exit): \" << endl;\n        cin >> temp;\n        if (temp <=\
    \ 0)\n        {\n            cout << \"\\nBrrrr, it's really cold!\" << endl;\n\
    \        }\n        if (temp > 0)\n        {\n            cout << \"\\nAt least\
    \ it's not freezing!\" << endl;\n        }\n    }\n    while (temp != -10000);\n\
    \n    cout << \"\\nGood bye\\n\" << endl;\n\n    return 0;\n}\n```\n\n![](img/bdf3833c5133a7f9b1eef9ebdb21a76d_62_1.png)\n\
    \n### STEP 7\n\nThe code in Step 6 is simplistic but effective. First we created\
    \ a floating point variable called temp, then a do…while loop that asks the user\
    \ to enter the current temperature.\n\n![](img/bdf3833c5133a7f9b1eef9ebdb21a76d_62_2.png)\n\
    \n### STEP 8\n\nThe first if statement checks to see if the user’s inputted value\
    \ is less than or equal to zero. If it is, then the output is ‘Brrr, it’s really\
    \ cold!’. Otherwise, if the input is greater than zero, the code outputs ‘At least\
    \ it’s not freezing!’.\n\n![](img/bdf3833c5133a7f9b1eef9ebdb21a76d_62_3.png)\n\
    \n### STEP 9\n\nFinally, if the user enters the value -10000, which is impossibly\
    \ cold so is therefore a unrealistic value, the do…while loop is terminated and\
    \ a friendly ‘Good bye’ is displayed to the screen.\n\n![](img/bdf3833c5133a7f9b1eef9ebdb21a76d_62_4.png)\n\
    \n### STEP 10\n\nUsing if is quite powerful, if it’s used correctly. Just remember\
    \ that if the condition is true then the code executes what’s in the braces. If\
    \ not, it continues on its merry way. See what else you can come up with using\
    \ if and a combination of loops.\n\n![](img/bdf3833c5133a7f9b1eef9ebdb21a76d_62_5.png)\n\
    \n## If… Else Statement\n\nThere is a much better way to use an if statement in\
    \ your code, with if… else. If… else works in much the same way as a standard\
    \ if statement. If the Boolean expression is true, the code within the braces\
    \ is executed. Else, the code within the next set of braces is used instead.\n\
    \n### IF YES, ELSE NO\n\nThere are two sections of code that can be executed depending\
    \ on the outcome in an if… else statement. It’s quite easy to visualise once you\
    \ get used to its structure.\n\nSTEP 1 — Begin with a new C++ file and the standard\
