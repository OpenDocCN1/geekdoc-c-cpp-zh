    \ndef text_generator(text):\n    tmp = ''\n    for letter in text:\n        tmp\
    \ += letter\n        if letter != ' ':\n            yield tmp\n\nclass DynamicText(object):\n\
    \    def __init__(self, font, text, pos, autoreset=False):\n        self.done\
    \ = False\n        self.font = font\n        self.text = text\n        self._gen\
