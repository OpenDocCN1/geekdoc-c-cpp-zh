    ```cpp\nusing namespace std;\n```\n\n在 #include 部分下方添加，然后从此以后直接使用 cout、cin 等即可。\n\
    \n![](img/bdf3833c5133a7f9b1eef9ebdb21a76d_71_1.png)\n\n### 分号\n\n请记住，C++ 程序的每一行都必须以分号结尾。如果没有，编译器会把缺少分号的那一行与下一个分号所在行视为同一行。这会在编译时造成各种各样的问题，所以不要忘记这些分号。\n\
