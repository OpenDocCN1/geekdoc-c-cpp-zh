    #include <iostream>\nusing namespace std;\n\nint main ()\n{\n\n}\n```\n\n![](img/bdf3833c5133a7f9b1eef9ebdb21a76d_47_0.png)\n\
    \n### STEP 2\n\nYou’ve already experienced the `\\n` character literal placing\
    \ a new line wherever it’s called. The line: `cout << \"Hello\\n\" << \"I'm a\
    \ C++\\n\" << \"Program\\n\";` outputs three lines of text, each starting after\
    \ the last `\\n`.\n\n![](img/bdf3833c5133a7f9b1eef9ebdb21a76d_47_1.png)\n\n###\
    \ STEP 3\n\nIf you wanted to insert speech quotes inside a cout statement, you\
    \ would have to use a backslash as it already uses quotes:\n\n```cpp\n#include\
    \ <iostream>\nusing namespace std;\n\nint main ()\n{\n    cout << \"Hello, user.\
    \ This is how to use \\\"quotes\\\".\";\n}\n```\n\n![](img/bdf3833c5133a7f9b1eef9ebdb21a76d_47_2.png)\n\
    \n### STEP 4\n\nThere’s even a character literal that can trigger an alarm. In\
    \ Windows 10, it’s the notification sound that chimes when you use `\\a`. Try\
    \ this code, and turn up your sound.\n\n```cpp\n#include <iostream>\nusing namespace\
    \ std;\n\nint main ()\n{\n    cout << \"ALARM! \\a\";\n}\n```\n\n![](img/bdf3833c5133a7f9b1eef9ebdb21a76d_47_3.png)\n\
    \n### A HANDY CHART\n\nThere are numerous character literals, or escape sequence\
    \ codes, to choose from. We therefore thought it would be good for you to have\
    \ a handy chart available, for those times when you need to insert a code.\n\n\
    | ESCAPE SEQUENCE CODE | CHARACTER |\n| --- | --- |\n| `\\` | Backslash |\n| `\\\
    '` | Single Quote |\n| `\\\"` | Double Quote (Speech Marks) |\n| `\\?` | Question\
    \ Mark |\n| `\\a` | Alert/Alarm |\n| `\\b` | Backspace |\n| `\\f` | Form Feed\
    \ |\n| `\\n` | New Line |\n| `\\r` | Carriage Return |\n| `\\t` | Horizontal Tab\
    \ |\n| `\\v` | Vertical Tab |\n| `\\0` | Null Character |\n| `\\uxxxx` | Unicode\
    \ (UTF-8) |\n| `\\Uxxxxxxxx` | Unicode (UTF-16) |\n\n### UNICODE CHARACTERS (UTF-8)\n\
    \nUnicode characters are symbols or characters that are standard across all platforms.\
    \ For example, the copyright symbol, that can be entered via the keyboard by entering\
    \ the Unicode code, followed by ALT+X. In the case of the copyright symbol enter:\
    \ 00A9 Alt+X. In C++ code, you would enter:\n\n```cpp\n#include <iostream>\nusing\
    \ namespace std;\n\nint main ()\n{\n    cout << \"\\u00A9\";\n}\n```\n\n![](img/bdf3833c5133a7f9b1eef9ebdb21a76d_48_0.png)\n\
    \n### UNICODE CHARACTER TABLE\n\nA complete list of the available Unicode characters\
    \ can be found at **www.unicode-table.com/en/**. Hover your mouse over the character\
    \ to see its unique code to enter in C++.\n\n![](img/bdf3833c5133a7f9b1eef9ebdb21a76d_48_1.png)\n\
    \n## Defining Constants\n\nConstants are fixed values in your code. They can be\
    \ any basic data type but as the name suggests their value remains constant throughout\
    \ the entire code. There are two separate ways to define a constant in C++, the\
    \ #define pre-processor and const.\n\n### #DEFINE\n\nThe pre-processors are instructions\
    \ to the compiler to pre-process the information before it goes ahead and compiles\
    \ the code. #include is a pre-processor as is #define.\n\n### STEP 1\n\nYou can\
    \ use the #define pre-processor to define any constants you want in our code.\
    \ Start by creating a new C++ file complete with the usual headers:\n\n```cpp\n\
    #include <iostream>\nusing namespace std;\n\nint main ()\n{\n}\n```\n\n![](img/bdf3833c5133a7f9b1eef9ebdb21a76d_49_0.png)\n\
    \n### STEP 2\n\nNow let's assume your code has three different constants: length,\
    \ width and height. You can define them with:\n\n```cpp\n#include <iostream>\n\
    using namespace std;\n#define LENGTH 50\n#define WIDTH 40\n#define HEIGHT 60\n\
    \nint main ()\n{\n}\n```\n\n![](img/bdf3833c5133a7f9b1eef9ebdb21a76d_49_1.png)\n\
    \n### STEP 3\n\nNote the capitals for defined constants, it's considered good\
    \ programming practice to define all constants in capitals. Here, the assigned\
    \ values are 50, 40 and 60, so let's call them up:\n\n```cpp\n#include <iostream>\n\
    using namespace std;\n\n#define LENGTH 50\n#define WIDTH 40\n#define HEIGHT 60\n\
    \nint main ()\n{\n    cout << \"Length is: \" << LENGTH << \"\\n\";\n    cout\
    \ << \"Width is: \" << WIDTH << \"\\n\";\n    cout << \"Height is: \" << HEIGHT\
    \ << \"\\n\";\n}\n```\n\n![](img/bdf3833c5133a7f9b1eef9ebdb21a76d_49_2.png)\n\n\
    ### STEP 4\n\nBuild and run the code. Just as expected, it displays the values\
    \ for each of the constants created. It's worth noting that you don't need a semicolon\
    \ when you're defining a constant with the #define keyword.\n\n![](img/bdf3833c5133a7f9b1eef9ebdb21a76d_49_3.png)\n"
  mdcn: "\n\n## C++ 输入/输出\n\n![](img/bdf3833c5133a7f9b1eef9ebdb21a76d_43_0.png)\n\n\
    ![](img/bdf3833c5133a7f9b1eef9ebdb21a76d_44_0.png)\n\n## C++ 输入/输出\n\n当你编写的代码能够请求用户输入，然后用该输入生成用户可以看到的内容时，会有一种令人满足的感觉。即使只是询问某人的名字，并显示一条个性化的欢迎信息，也是一次巨大的飞跃。\n\
    \n用户交互、字符字面量、定义常量以及文件输入和输出都将在以下页面中介绍。所有这些都能帮助你更好地理解 C++ 程序的工作方式。\n\n### 步骤 5\n\
    \n其原理与之前的代码相同。用户的输入（即他们的名字）存储在一个字符串中，因为它包含多个字符，并在第二个 `cout` 行中取出显示。只要变量“name”不改变，你就可以在代码中任意位置调用它。\n\
    \n![](img/bdf3833c5133a7f9b1eef9ebdb21a76d_46_0.png)\n\n### 步骤 6\n\n你可以连续向用户请求输入，但前提是必须有一个有效的变量来存储输入。假设你希望用户输入两个整数：\n\
    \n```cpp\n#include <iostream>\nusing namespace std;\n\nint main ()\n{\n    int\
    \ num1, num2;\n\n    cout << \"Enter two whole numbers: \";\n    cin >> num1 >>\
    \ num2;\n\n    cout << \"you entered \" << num1 << \" and \" << num2 << \"\\n\"\
    ;\n}\n```\n\n![](img/bdf3833c5133a7f9b1eef9ebdb21a76d_46_1.png)\n\n### 步骤 7\n\n\
    同样，一旦输入的数据存储在变量中，就可以对其进行操作。例如，要求用户输入两个数字并对它们进行一些数学运算：\n\n```cpp\n#include <iostream>\n\
    using namespace std;\n\nint main ()\n{\n    float num1, num2;\n\n    cout << \"\
    Enter two numbers: \\n\";\n    cin >> num1 >> num2;\n\n    cout << num1 << \"\
    \ + \" << num2 << \" is: \" << num1 + num2 << \"\\n\";\n}\n```\n\n![](img/bdf3833c5133a7f9b1eef9ebdb21a76d_46_2.png)\n\
    \n### 步骤 8\n\n虽然 `cin` 在大多数输入任务中表现良好，但它确实有一个局限性。`cin` 总是将空格视为终止符，因此它只适用于单个单词而非多个单词。然而，`getline`\
    \ 将 `cin` 作为第一个参数，将变量作为第二个参数：\n\n```cpp\n#include <iostream>\nusing namespace\
    \ std;\n\nint main ()\n{\n    string mystr;\n    cout << \"Enter a sentence: \\\
    n\";\n    getline(cin, mystr);\n\n    cout << \"Your sentence is: \" << mystr.size()\
    \ << \" characters long.\\n\";\n}\n```\n\n![](img/bdf3833c5133a7f9b1eef9ebdb21a76d_46_3.png)\n\
    \n### 步骤 9\n\n构建并执行代码，然后输入一个包含空格的句子。完成后，代码会读取字符数。如果你删除 `getline` 行，将其替换为 `cin\
    \ >> mystr` 并再次尝试，结果将显示直到第一个空格前的字符数。\n\n![](img/bdf3833c5133a7f9b1eef9ebdb21a76d_46_4.png)\n\
    \n### 步骤 10\n\n`getline` 通常是 C++ 初学者容易忘记的命令。当你无法找出代码不工作的原因时，终止空白符很令人烦恼。简而言之，将来最好使用\
    \ `getline(cin, variable)`：\n\n```cpp\n#include <iostream>\nusing namespace std;\n\
    \nint main ()\n{\n    string name;\n    cout << \"Enter your full name: \\n\"\
    ;\n    getline(cin, name);\n\n    cout << \"\\nHello, \" << name << \"\\n\";\n\
    }\n```\n\n![](img/bdf3833c5133a7f9b1eef9ebdb21a76d_46_5.png)\n\n## 字符字面量\n\n在\
    \ C++ 中，字面量是一个对象或变量，一旦定义，在整个代码中保持不变。然而，字符字面量由反斜杠定义，比如你在 `cout` 语句末尾使用的 `\\n`，用来表示换行。\n\
    \n### 转义序列\n\n当用于诸如 `cout` 语句中时，字符字面量也被称为转义序列代码。它们允许你插入引号、警报、换行等等。\n\n### 步骤 1\n\
    \n创建一个新的 C++ 文件并输入相关的头文件：\n\n```cpp\n#include <iostream>\nusing namespace std;\n\
    \nint main ()\n{\n\n}\n```\n\n![](img/bdf3833c5133a7f9b1eef9ebdb21a76d_47_0.png)\n\
    \n### 步骤 2\n\n你已经体验过 `\\n` 字符字面量在调用处插入换行的功能。代码行：`cout << \"Hello\\n\" << \"I'm\
    \ a C++\\n\" << \"Program\\n\";` 会输出三行文本，每行都从上一个 `\\n` 之后开始。\n\n![](img/bdf3833c5133a7f9b1eef9ebdb21a76d_47_1.png)\n\
    \n### 步骤 3\n\n如果你想在 `cout` 语句中插入说话引号，就必须使用反斜杠，因为它本身已经使用了引号：\n\n```cpp\n#include\
    \ <iostream>\nusing namespace std;\n\nint main ()\n{\n    cout << \"Hello, user.\
    \ This is how to use \\\"quotes\\\".\";\n}\n```\n\n![](img/bdf3833c5133a7f9b1eef9ebdb21a76d_47_2.png)\n\
    \n### 步骤 4\n\n甚至有一种字符字面量可以触发警报。在 Windows 10 中，当你使用 `\\a` 时，它会发出通知声音。试试这段代码，并把声音调大。\n\
    \n```cpp\n#include <iostream>\nusing namespace std;\n\nint main ()\n{\n    cout\
    \ << \"ALARM! \\a\";\n}\n```\n\n![](img/bdf3833c5133a7f9b1eef9ebdb21a76d_47_3.png)\n\
    \n### 便捷图表\n\n有许多字符字面量（或转义序列代码）可供选择。因此，我们认为为你准备一个便捷图表会很有用，方便你在需要插入代码时查阅。\n\n|\
    \ 转义序列代码 | 字符 |\n| --- | --- |\n| `\\` | 反斜杠 |\n| `\\'` | 单引号 |\n| `\\\"` | 双引号（说话引号）\
    \ |\n| `\\?` | 问号 |\n| `\\a` | 警报/闹铃 |\n| `\\b` | 退格 |\n| `\\f` | 换页 |\n| `\\\
    n` | 换行 |\n| `\\r` | 回车 |\n| `\\t` | 水平制表符 |\n| `\\v` | 垂直制表符 |\n| `\\0` | 空字符\
    \ |\n| `\\uxxxx` | Unicode（UTF-8） |\n| `\\Uxxxxxxxx` | Unicode（UTF-16） |\n\n###\
    \ Unicode 字符（UTF-8）\n\nUnicode 字符是在所有平台上都通用的符号或字符。例如，版权符号可以通过在键盘上输入 Unicode 代码，然后按\
    \ ALT+X 来输入。对于版权符号，请输入：00A9 Alt+X。在 C++ 代码中，你应输入：\n\n```cpp\n#include <iostream>\n\
    using namespace std;\n\nint main ()\n{\n    cout << \"\\u00A9\";\n}\n```\n\n![](img/bdf3833c5133a7f9b1eef9ebdb21a76d_48_0.png)\n\
    \n### Unicode 字符表\n\n完整的可用 Unicode 字符列表可以在 **www.unicode-table.com/en/** 上找到。将鼠标悬停在字符上即可查看其在\
    \ C++ 中输入的独特代码。\n\n![](img/bdf3833c5133a7f9b1eef9ebdb21a76d_48_1.png)\n\n## 定义常量\n\
    \n常量是代码中的固定值。它们可以是任何基本数据类型，但顾名思义，它们的值在整个代码中保持不变。在 C++ 中有两种不同的方式来定义常量：`#define`\
    \ 预处理器和 `const`。\n\n### #DEFINE\n\n预处理指令是给编译器的指令，在编译代码之前先对信息进行预处理。#include 是预处理指令，#define\
    \ 也是。\n\n### 步骤 1\n\n你可以使用 `#define` 预处理指令在代码中定义任何你想要的常量。首先创建一个新的 C++ 文件，并包含通常的头文件：\n\
    \n```cpp\n#include <iostream>\nusing namespace std;\n\nint main ()\n{\n}\n```\n\
    \n![](img/bdf3833c5133a7f9b1eef9ebdb21a76d_49_0.png)\n\n### 步骤 2\n\n现在假设你的代码有三个不同的常量：长度、宽度和高度。你可以用以下方式定义它们：\n\
    \n```cpp\n#include <iostream>\nusing namespace std;\n#define LENGTH 50\n#define\
    \ WIDTH 40\n#define HEIGHT 60\n\nint main ()\n{\n}\n```\n\n![](img/bdf3833c5133a7f9b1eef9ebdb21a76d_49_1.png)\n\
    \n### 步骤 3\n\n注意定义常量时使用大写字母，将所有常量定义为大写是良好的编程实践。这里，赋的值是 50、40 和 60，所以让我们调用它们：\n\
    \n```cpp\n#include <iostream>\nusing namespace std;\n\n#define LENGTH 50\n#define\
    \ WIDTH 40\n#define HEIGHT 60\n\nint main ()\n{\n    cout << \"Length is: \" <<\
    \ LENGTH << \"\\n\";\n    cout << \"Width is: \" << WIDTH << \"\\n\";\n    cout\
    \ << \"Height is: \" << HEIGHT << \"\\n\";\n}\n```\n\n![](img/bdf3833c5133a7f9b1eef9ebdb21a76d_49_2.png)\n\
    \n### 步骤 4\n\n构建并运行代码。正如预期的那样，它会显示每个已创建常量的值。值得注意的是，使用 `#define` 关键字定义常量时不需要分号。\n\
    \n![](img/bdf3833c5133a7f9b1eef9ebdb21a76d_49_3.png)\n\n"
