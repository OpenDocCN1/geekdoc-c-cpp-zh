  md: "\n## OS Module\n\nThe OS module allows you to interact directly with the built-in\
    \ commands found in your operating system. Commands vary depending on the OS you’re\
    \ running, as some will work with Windows whereas others will work with Linux\
    \ and macOS.\n\n### INTO THE SYSTEM\n\nOne of the primary features of the OS module\
    \ is the ability to list, move, create, delete and otherwise interact with files\
    \ stored on the system, making it the perfect module for backup code.\n\n- **STEP\
    \ 1** — You can start the OS module with some simple functions to see how it interacts\
    \ with the operating system environment that Python is running on. If you’re using\
    \ Linux or the Raspberry Pi, try this:\n\n```python\nimport os\nhome=os.getcwd()\n\
    print(home)\n```\n\n![](img/bdf3833c5133a7f9b1eef9ebdb21a76d_31_0.png)\n\n- **STEP\
    \ 2** — The returned result from printing the variable home is the current user’s\
    \ home folder on the system. In our example that’s `/home/pi`; it will be different\
    \ depending on the user name you log in as and the operating system you use. For\
    \ example, Windows 10 will output: `C:\\Program Files (x86)\\Python36-32`.\n\n\
    ![](img/bdf3833c5133a7f9b1eef9ebdb21a76d_31_1.png)\n\n- **STEP 3** — The Windows\
    \ output is different as that’s the current working directory of Python, as determined\
    \ by the system; as you might suspect, the `os.getcwd()` function is asking Python\
    \ to retrieve the Current Working Directory. Linux users will see something along\
    \ the same lines as the Raspberry Pi, as will macOS users.\n\n![](img/bdf3833c5133a7f9b1eef9ebdb21a76d_31_2.png)\n\
    \n- **STEP 4** — Yet another interesting element to the OS module, is its ability\
    \ to launch programs that are installed in the host system. For instance, if you\
    \ wanted to launch the Chromium browser from within a Python program you can use\
    \ the command:\n\n```python\nimport os\nbrowser=os.system(\"/usr/bin/chromium-browser\"\
    )\n```\n\n![](img/bdf3833c5133a7f9b1eef9ebdb21a76d_31_3.png)\n\n## Random Module\n\
    \nThe random module is one you will likely come across many times in your Python\
    \ programming lifetime; as the name suggests, it’s designed to create random numbers\
    \ or letters. However, it’s not exactly random but it will suffice for most needs.\n\
    \n### RANDOM NUMBERS\n\nThere are numerous functions within the random module,\
    \ which when applied can create some interesting and very useful Python programs.\n\
    \n- **STEP 1**  \nJust as with other modules you need to import random before\
    \ you can use any of the functions we’re going to look at in this tutorial. Let’s\
    \ begin by simply printing a random number from 1 to 5:\n\n```python\nimport random\n\
    print(random.randint(0,5))\n```\n\n![](img/bdf3833c5133a7f9b1eef9ebdb21a76d_33_0.png)\n\
    \n- **STEP 2**  \nIn our example the number four was returned. However, enter\
    \ the print function a few more times and it will display different integer values\
    \ from the set of numbers given, zero to five. The overall effect, although pseudo-random,\
    \ is adequate for the average programmer to utilise in their code.\n\n![](img/bdf3833c5133a7f9b1eef9ebdb21a76d_33_1.png)\n\
    \n- **STEP 3**  \nFor a bigger set of numbers, including floating point values,\
    \ you can extend the range by using the multiplication sign:\n\n```python\nimport\
    \ random\nprint(random.random() *100)\n```\n\nWill display a floating point number\
    \ between 0 and 100, to the tune of around fifteen decimal points.\n\n![](img/bdf3833c5133a7f9b1eef9ebdb21a76d_33_2.png)\n\
    \n- **STEP 4**  \nHowever, the random module isn’t used exclusively for numbers.\
    \ You can use it to select an entry from a list from random, and the list can\
    \ contain anything:\n\n```python\nimport random\nrandom.choice([\"Conan\", \"\
    Valeria\", \"Belit\"])\n```\n\nThis will display one of the names of our adventurers\
    \ at random, which is a great addition to a text adventure game.\n\n![](img/bdf3833c5133a7f9b1eef9ebdb21a76d_33_3.png)\n\
    \n- **STEP 5**  \nYou can extend the previous example somewhat by having random.choice()\
    \ select from a list of mixed variables. For instance:\n\n```python\nimport random\n\
    lst=[\"David\", 44, \"BDM Publications\", 3245.23, \"Pi\", True, 3.14, \"Python\"\
    ]\nrnd=random.choice(lst)\nprint(rnd)\n```\n\n![](img/bdf3833c5133a7f9b1eef9ebdb21a76d_33_4.png)\n\
    \n- **STEP 6**  \nInterestingly, you can also use a function within the random\
    \ module to shuffle the items in the list, thus adding a little more randomness\
    \ into the equation:\n\n```python\nrandom.shuffle(lst)\nprint(lst)\n```\n\nThis\
    \ way, you can keep shuffling the list before displaying a random item from it.\n\
    \n![](img/bdf3833c5133a7f9b1eef9ebdb21a76d_34_0.png)\n\n- **STEP 7**  \nUsing\
    \ shuffle, you can create an entirely random list of numbers. For example, within\
    \ a given range:\n\n```python\nimport random\nlst=[i for i in range(20)]\nrandom.shuffle(lst)\n\
    print(lst)\n```\n\nKeep shuffling the list and you can have a different selection\
    \ of items from 0 to 20 every time.\n\n![](img/bdf3833c5133a7f9b1eef9ebdb21a76d_34_1.png)\n\
    \n- **STEP 8**  \nYou can also select a random number from a given range in steps,\
    \ using the start, stop, step loop:\n\n```python\nimport random\nfor i in range(10):\n\
    \    print(random.randrange(0, 200, 7))\n```\n\nResults will vary but you get\
    \ the general idea as to how it works.\n\n![](img/bdf3833c5133a7f9b1eef9ebdb21a76d_34_2.png)\n\
    \n- **STEP 9**  \nLet’s use an example piece of code which flips a virtual coin\
    \ ten thousand times and counts how many times it will land on heads or tails:\n\
    \n```python\nimport random\noutput={\"Heads\":0, \"Tails\":0}\ncoin=list(output.keys())\n\
    \nfor i in range(10000):\n    output[random.choice(coin)]+=1\n\nprint(\"Heads:\"\
    , output[\"Heads\"])\nprint(\"Tails:\", output[\"Tails\"])\n```\n\n![](img/bdf3833c5133a7f9b1eef9ebdb21a76d_34_3.png)\n\
    \n- **STEP 10**  \nHere’s an interesting piece of code. Using a text file containing\
    \ 466 thousand words, you can pluck a user generated number of words from the\
    \ file (text file found at: **www.github.com/dwyl/english-words**):\n\n```python\n\
    import random\n\nprint(\">>>>>>>>>>Random Word Finder<<<<<<<<<<\")\nprint(\"\\\
    nUsing a 466K English word text file I can pick any words at random.\\n\")\n\n\
    wds=int(input(\"\\nHow many words shall I choose?\\n\"))\n\nwith open(\"/home/pi/Downloads/words.txt\"\
    , \"rt\") as f:\n    words = f.readlines()\nwords = [w.rstrip() for w in words]\n\
    \nprint(\"--------------------\")\n\nfor w in random.sample(words, wds):\n   \
    \ print(w)\n\nprint(\"--------------------\")\n```\n\n![](img/bdf3833c5133a7f9b1eef9ebdb21a76d_34_4.png)\n\
    \n## Tkinter Module\n\nWhile running your code from the command line, or even\
    \ in the Shell, is perfectly fine, Python is capable of so much more. The Tkinter\
    \ module enables the programmer to set up a Graphical User Interface to interact\
    \ with the user, and it’s surprisingly powerful too.\n\n### GETTING GUI\n\nTkinter\
    \ is easy to use but there’s a lot more you can do with it. Let’s start by seeing\
    \ how it works and getting some code into it. Before long you will discover just\
    \ how powerful this module really is.\n\n- **STEP 1**  \nTkinter is usually built\
    \ into Python 3. However, if it’s not available when you enter `import tkinter`,\
    \ then you need to `pip install tkinter` from the command prompt. We can start\
    \ to import modules differently than before, to save on typing and by importing\
    \ all their contents:\n\n```python\nimport tkinter as tk\nfrom tkinter import\
    \ *\n```\n\n![](img/bdf3833c5133a7f9b1eef9ebdb21a76d_35_0.png)\n\n- **STEP 2**\
    \  \nIt’s not recommended to import everything from a module using the asterisk\
    \ but it won’t do any harm normally. Let’s begin by creating a basic GUI window,\
    \ enter:\n\n```python\nwind=Tk()\n```\n\nThis creates a small, basic window. There’s\
    \ not much else to do at this point but click the X in the corner to close the\
    \ window.\n\n![](img/bdf3833c5133a7f9b1eef9ebdb21a76d_35_2.png)\n\n- **STEP 3**\
    \  \nThe ideal approach is to add `mainloop()` into the code to control the Tkinter\
    \ event loop, but we’ll get to that soon. You’ve just created a Tkinter widget\
    \ and there are several more we can play around with:\n\n```python\nbtn=Button()\n\
    btn.pack()\nbtn[\"text\"]=\"Hello everyone!\"\n```\n\nThe first line focuses on\
    \ the newly created window. Click back into the Shell and continue the other lines.\n\
    \n![](img/bdf3833c5133a7f9b1eef9ebdb21a76d_35_1.png)\n\n- **STEP 4**  \nYou can\
    \ combine the above into a New File:\n\n```python\nimport tkinter as tk\nfrom\
    \ tkinter import *\nbtn=Button()\nbtn.pack()\nbtn[\"text\"]=\"Hello everyone!\"\
    \n```\n\nThen add some button interactions:\n\n```python\ndef click():\n    print(\"\
    You just clicked me!\")\nbtn[\"command\"]=click\n```\n\n![](img/bdf3833c5133a7f9b1eef9ebdb21a76d_35_3.png)\n"
  mdcn: "\n## OS 模块\n\nOS 模块允许你直接与操作系统中内置的命令进行交互。命令会因你所运行的操作系统而异，因为有些命令适用于 Windows，而另一些则适用于\
    \ Linux 和 macOS。\n\n### 进入系统\n\nOS 模块的主要功能之一是能够列出、移动、创建、删除以及以其他方式与系统上存储的文件进行交互，这使其成为编写备份代码的理想模块。\n\
    \n- **步骤 1** — 你可以通过一些简单函数来启动 OS 模块，看看它如何与 Python 运行所在的操作系统环境交互。如果你使用的是 Linux\
    \ 或 Raspberry Pi，请尝试以下操作：\n\n```python\nimport os\nhome=os.getcwd()\nprint(home)\n\
    ```\n\n![](img/bdf3833c5133a7f9b1eef9ebdb21a76d_31_0.png)\n\n- **步骤 2** — 打印变量\
    \ home 返回的结果是系统上当前用户的主文件夹。在我们的示例中，它是 `/home/pi`；它会因你登录的用户名和使用的操作系统而异。例如，Windows\
    \ 10 将输出：`C:\\Program Files (x86)\\Python36-32`。\n\n![](img/bdf3833c5133a7f9b1eef9ebdb21a76d_31_1.png)\n\
    \n- **步骤 3** — Windows 的输出不同，因为这是系统确定的 Python 当前工作目录；正如你可能猜到的那样，`os.getcwd()`\
    \ 函数是在要求 Python 检索当前工作目录。Linux 用户会看到与 Raspberry Pi 类似的内容，macOS 用户也是如此。\n\n![](img/bdf3833c5133a7f9b1eef9ebdb21a76d_31_2.png)\n\
    \n- **步骤 4** — OS 模块另一个有趣的特性是能够启动安装在主机系统中的程序。例如，如果你想从 Python 程序内部启动 Chromium 浏览器，可以使用以下命令：\n\
    \n```python\nimport os\nbrowser=os.system(\"/usr/bin/chromium-browser\")\n```\n\
    \n![](img/bdf3833c5133a7f9b1eef9ebdb21a76d_31_3.png)\n\n## 随机模块\n\n随机模块是你在 Python\
    \ 编程生涯中很可能多次遇到的模块；顾名思义，它旨在生成随机数字或字母。不过，它并非真正随机，但对大多数需求来说已经足够。\n\n### 随机数\n\n随机模块中有许多函数，应用这些函数可以创建一些有趣且非常有用的\
    \ Python 程序。\n\n- **步骤 1**  \n就像其他模块一样，你需要先导入 random，然后才能使用本教程中将要介绍的任何函数。让我们先简单地打印一个\
    \ 1 到 5 之间的随机数：\n\n```python\nimport random\nprint(random.randint(0,5))\n```\n\
    \n![](img/bdf3833c5133a7f9b1eef9ebdb21a76d_33_0.png)\n\n- **步骤 2**  \n在我们的示例中，返回的是数字四。不过，再多执行几次\
    \ print 函数，它就会显示给定数字集合（0 到 5）中的不同整数值。整体效果虽然是伪随机的，但对于普通程序员在代码中使用已经足够。\n\n![](img/bdf3833c5133a7f9b1eef9ebdb21a76d_33_1.png)\n\
    \n- **步骤 3**  \n如果需要更大的一组数字（包括浮点值），你可以使用乘号来扩展范围：\n\n```python\nimport random\n\
    print(random.random() *100)\n```\n\n将显示一个 0 到 100 之间的浮点数，大约有十五位小数。\n\n![](img/bdf3833c5133a7f9b1eef9ebdb21a76d_33_2.png)\n\
    \n- **步骤 4**  \n然而，随机模块并非只用于数字。你可以用它从列表中随机选择一个条目，而列表可以包含任何内容：\n\n```python\nimport\
    \ random\nrandom.choice([\"Conan\", \"Valeria\", \"Belit\"])\n```\n\n这将随机显示我们冒险者中的一个名字，这对文字冒险游戏来说是很棒的补充。\n\
    \n![](img/bdf3833c5133a7f9b1eef9ebdb21a76d_33_3.png)\n\n- **步骤 5**  \n你可以通过让 random.choice()\
    \ 从混合变量列表中进行选择，在一定程度上扩展上一个示例。例如：\n\n```python\nimport random\nlst=[\"David\",\
    \ 44, \"BDM Publications\", 3245.23, \"Pi\", True, 3.14, \"Python\"]\nrnd=random.choice(lst)\n\
    print(rnd)\n```\n\n![](img/bdf3833c5133a7f9b1eef9ebdb21a76d_33_4.png)\n\n- **步骤\
    \ 6**  \n有趣的是，你还可以使用随机模块中的函数来打乱列表中的项目，从而为整个过程增加一点随机性：\n\n```python\nrandom.shuffle(lst)\n\
    print(lst)\n```\n\n这样，你可以在显示列表中的随机项之前不断打乱列表。\n\n![](img/bdf3833c5133a7f9b1eef9ebdb21a76d_34_0.png)\n\
    \n- **步骤 7**  \n使用 shuffle，你可以创建一个完全随机的数字列表。例如，在给定范围内：\n\n```python\nimport random\n\
    lst=[i for i in range(20)]\nrandom.shuffle(lst)\nprint(lst)\n```\n\n不断打乱列表，你每次都能得到\
    \ 0 到 20 之间不同的项目选择。\n\n![](img/bdf3833c5133a7f9b1eef9ebdb21a76d_34_1.png)\n\n\
    - **步骤 8**  \n你还可以使用起始、停止、步长循环，从给定范围内按步长选择随机数：\n\n```python\nimport random\nfor\
    \ i in range(10):\n    print(random.randrange(0, 200, 7))\n```\n\n结果会有所不同，但你能大致了解它是如何工作的。\n\
    \n![](img/bdf3833c5133a7f9b1eef9ebdb21a76d_34_2.png)\n\n- **步骤 9**  \n让我们使用一段示例代码，它抛掷一枚虚拟硬币一万次，并统计正面或反面出现的次数：\n\
    \n```python\nimport random\noutput={\"Heads\":0, \"Tails\":0}\ncoin=list(output.keys())\n\
    \nfor i in range(10000):\n    output[random.choice(coin)]+=1\n\nprint(\"Heads:\"\
    , output[\"Heads\"])\nprint(\"Tails:\", output[\"Tails\"])\n```\n\n![](img/bdf3833c5133a7f9b1eef9ebdb21a76d_34_3.png)\n\
    \n- **步骤 10**  \n这里有一段有趣的代码。使用一个包含 46.6 万个单词的文本文件，你可以从文件中摘取用户指定数量的单词（文本文件位于：**www.github.com/dwyl/english-words**）：\n\
    \n```python\nimport random\n\nprint(\">>>>>>>>>>Random Word Finder<<<<<<<<<<\"\
    )\nprint(\"\\nUsing a 466K English word text file I can pick any words at random.\\\
    n\")\n\nwds=int(input(\"\\nHow many words shall I choose?\\n\"))\n\nwith open(\"\
    /home/pi/Downloads/words.txt\", \"rt\") as f:\n    words = f.readlines()\nwords\
    \ = [w.rstrip() for w in words]\n\nprint(\"--------------------\")\n\nfor w in\
    \ random.sample(words, wds):\n    print(w)\n\nprint(\"--------------------\")\n\
    ```\n\n![](img/bdf3833c5133a7f9b1eef9ebdb21a76d_34_4.png)\n\n## Tkinter 模块\n\n\
    虽然从命令行甚至 Shell 中运行代码完全没问题，但 Python 的能力远不止于此。Tkinter 模块使程序员能够设置图形用户界面来与用户交互，而且它强大得令人惊讶。\n\
    \n### 开始使用 GUI\n\nTkinter 易于使用，但你还可以用它做更多事情。让我们先看看它如何工作，并编写一些代码。不久你就会发现这个模块究竟有多强大。\n\
    \n- **步骤 1**  \nTkinter 通常内置于 Python 3 中。但是，如果你输入 `import tkinter` 时它不可用，那么你需要从命令提示符中执行\
    \ `pip install tkinter`。我们可以开始以与之前不同的方式导入模块，以节省输入，并导入其全部内容：\n\n```python\nimport\
    \ tkinter as tk\nfrom tkinter import *\n```\n\n![](img/bdf3833c5133a7f9b1eef9ebdb21a76d_35_0.png)\n\
    \n- **步骤 2**  \n不建议使用星号从模块中导入所有内容，但通常不会造成任何损害。让我们先创建一个基本的 GUI 窗口，输入：\n\n```python\n\
    wind=Tk()\n```\n\n这会创建一个小型的基本窗口。此时除了单击角落的 X 关闭窗口之外，没有太多其他可做的。\n\n![](img/bdf3833c5133a7f9b1eef9ebdb21a76d_35_2.png)\n\
    \n- **步骤 3**  \n理想的做法是将 `mainloop()` 添加到代码中以控制 Tkinter 事件循环，但我们很快就会讲到。你刚刚创建了一个\
    \ Tkinter 小部件，还有几个其他小部件可以供我们尝试：\n\n```python\nbtn=Button()\nbtn.pack()\nbtn[\"\
    text\"]=\"Hello everyone!\"\n```\n\n第一行聚焦于新创建的窗口。单击回到 Shell，然后继续执行其他行。\n\n![](img/bdf3833c5133a7f9b1eef9ebdb21a76d_35_1.png)\n\
    \n- **步骤 4**  \n你可以将上述内容合并到一个新文件中：\n\n```python\nimport tkinter as tk\nfrom tkinter\
    \ import *\nbtn=Button()\nbtn.pack()\nbtn[\"text\"]=\"Hello everyone!\"\n```\n\
    \n然后添加一些按钮交互：\n\n```python\ndef click():\n    print(\"You just clicked me!\")\n\
    btn[\"command\"]=click\n```\n\n![](img/bdf3833c5133a7f9b1eef9ebdb21a76d_35_3.png)\n"
