    \n### 常见的 C++ 错误\n\n诚然，犯下我们这些页面中概述的这类错误的并不只有 C++ 初学者；即使是经验丰富的程序员也偶尔会出些差错。以下是一些需要尝试避免的常见问题。\n\
    \n### 未声明的标识符\n\n一个常见的 C++ 错误——老实说，也是大多数编程语言中的常见错误——是你试图输出一个不存在的变量。在屏幕上显示 x 的值没问题，但前提是你已经告诉编译器\
