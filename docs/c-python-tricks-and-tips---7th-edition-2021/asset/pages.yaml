- pgno: 23
  md: "# # Exceptions\n\nWhen coding, you’ll naturally come across some issues that\
    \ are out of your control. Let’s assume you ask a user to divide two numbers and\
    \ they try to divide by zero. This will create an error and break your code.\n\
    \n# ## EXCEPTIONAL OBJECTS\n\nRather than stop the flow of your code, Python includes\
    \ exception objects which handle unexpected errors in the code. You can combat\
    \ errors by creating conditions where exceptions may occur.\n\n+   **STEP 1**\
    \  \n+   You can create an exception error by simply trying to divide a number\
    \ by zero. This will report back with the ZeroDivisionError: Division by zero\
    \ message, as seen in the screenshot. The ZeroDivisionError part is the exception\
    \ class, of which there are many.\n\n![](img/bdf3833c5133a7f9b1eef9ebdb21a76d_23_0.png)\n\
    \n+   **STEP 2**  \n+   Most exceptions are raised automatically when Python comes\
    \ across something that’s inherently wrong with the code. However, you can create\
    \ your own exceptions that are designed to contain the potential error and react\
    \ to it, as opposed to letting the code fail.\n\n![](img/bdf3833c5133a7f9b1eef9ebdb21a76d_23_1.png)\n\
    \n+   **STEP 3**  \n+   You can use the functions raise exception to create our\
    \ own error handling code within Python. Let’s assume your code has you warping\
    \ around the cosmos, too much however results in a warp core breach. To stop the\
    \ game from exiting due to the warp core going supernova, you can create a custom\
    \ exception:\n\n```\n```python\nraise Exception(\"warp core breach\")\n```\n```\n\
    \n![](img/bdf3833c5133a7f9b1eef9ebdb21a76d_23_2.png)\n\n+   **STEP 4**  \n+  \
    \ To trap any errors in the code you can encase the potential error within a try:\
    \ block. This block consists of try, except, else, where the code is held within\
    \ try; then if there’s an exception do something, else do something else.\n\n\
    ![](img/bdf3833c5133a7f9b1eef9ebdb21a76d_23_3.png)"
  merge: -1
  img_proc: true
- pgno: 24
  md: "# STEP 5\n\nFor example, use the divide by zero error. You can create an exception\
    \ where the code can handle the error without Python quitting due to the problem:\n\
    \n```\n```python\ntry:\n    a=int(input(\"Enter the first number: \"))\n    b=int(input(\"\
    Enter the second number: \"))\n    print(a/b)\nexcept ZeroDivisionError:\n   \
    \ print(\"You have tried to divide by zero!\")\nelse:\n    print(\"You didn’t\
    \ divide by zero. Well done!\")\n```\n```\n\n![](img/bdf3833c5133a7f9b1eef9ebdb21a76d_24_0.png)\n\
    \n# STEP 8\n\nNaturally, you can quickly fix the issue by changing the “r” read\
    \ only instance with a “w” for write. This, as you already know, will create the\
    \ file and write the content then commit the changes to the file. The end result\
    \ will report a different set of circumstances, in this case, a successful execution\
    \ of the code.\n\n![](img/bdf3833c5133a7f9b1eef9ebdb21a76d_24_1.png)\n\n# STEP\
    \ 6\n\nYou can use exceptions to handle a variety of useful tasks. Using an example\
    \ from our previous tutorials, let’s assume you want to open a file and write\
    \ to it:\n\n```\n```python\ntry:\n    txt = open(\"/home/pi/Documents/textfile.txt\"\
    , \"r\")\n    txt.write(\"This is a test. Normal service will shortly resume!\"\
    )\nexcept IOError:\n    print (\"Error: unable to write the file. Check permissions\"\
    )\nelse:\n    print (\"Content written to file successfully. Have a nice day.\"\
    )\n    txt.close()\n```\n```\n\n![](img/bdf3833c5133a7f9b1eef9ebdb21a76d_24_2.png)\n\
    \n# STEP 9\n\nYou can also use a finally: block, which works in a similar fashion\
    \ but you can’t use else with it. To use our example from Step 6:\n\n```\n```python\n\
    try:\n    txt = open(\"/home/pi/Documents/textfile.txt\", \"r\")\n    try:\n \
    \       txt.write(\"This is a test. Normal service will shortly resume!\")\n \
    \   finally:\n        print (\"Content written to file successfully. Have a nice\
    \ day.\")\n        txt.close()\nexcept IOError:\n    print (\"Error: unable to\
    \ write the file. Check permissions\")\n```\n```\n\n![](img/bdf3833c5133a7f9b1eef9ebdb21a76d_24_3.png)\n\
    \n# STEP 7\n\nObviously this won’t work due to the file textfile.txt being opened\
    \ as read only (the “r” part). So in this case rather than Python telling you\
    \ that you’re doing something wrong, you’ve created an exception using the IOError\
    \ class informing the user that the permissions are incorrect.\n\n![](img/bdf3833c5133a7f9b1eef9ebdb21a76d_24_4.png)\n\
    \n# STEP 10\n\nAs before an error will occur as you’ve used the “r” read-only\
    \ permission. If you change it to a “w”, then the code will execute without the\
    \ error being displayed in the IDLE Shell. Needless to say, it can be a tricky\
    \ getting the exception code right the first time. Practise though, and you will\
    \ get the hang of it.\n\n![](img/bdf3833c5133a7f9b1eef9ebdb21a76d_24_5.png)"
