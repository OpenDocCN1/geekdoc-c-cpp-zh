  md: "# # Where Next?\n\nCoding, like most subjects, is a continual learning experience.\
    \ You may not class yourself as a beginner any more but you still need to test\
    \ your code, learn new tricks and hacks to make it more efficient and even branch\
    \ out and learn another programming language.\n\n# ## #INCLUDE<KEEP ON LEARNING>\n\
    \nWhat can you do to further your skills, learn new coding practices, experiment\
    \ and present your code and even begin to help others using what you've experienced\
    \ so far?\n\n# ### TWITTER\n\n# ### OPEN PROJECTS\n\nTwitter isn't all trolls\
    \ and antagonists; among the well-publicised vitriol are some genuine people who\
    \ are more than willing to spread their coding knowledge. We recommend you find\
    \ a few who you can relate to and follow them. Often they post great tips, hacks\
    \ and fixes for common coding problems.\n\nLook for open source projects that\
    \ you like the sound of and offer to contribute to the code to keep it alive and\
    \ up to date. There are millions of projects to choose from, so contact a few\
    \ and see where they need help. It may only be a minor code update but it's a\
    \ noble occupation for coders to get into.\n\n![](img/bdf3833c5133a7f9b1eef9ebdb21a76d_73_0.png)\n\
    \n![](img/bdf3833c5133a7f9b1eef9ebdb21a76d_73_1.png)\n\n# ### KEEP CODING\n\n\
    # ### SHARE SKILLS\n\nIf you've mastered Python fairly well, then turn your attention\
    \ to C++ or even C#. Still keep your Python skills going but learning a new coding\
    \ language keeps the old brain ticking over nicely and give you a view into another\
    \ community, and how they do things differently.\n\nBecome more active on coding\
    \ and development knowledge sites, such as StackExchange. If you have the skills\
    \ to start and help others out, not only will you feel really good for doing so\
    \ but you can also learn a lot yourself by interacting with other members.\n\n\
    ```\n```cpp\n#pragma once\n\n#define EXPAND_ME __FILE__ \":\" __LINE__\n\nconstexpr\
    \ auto pi = 3.14l;\nthread_local decltype(pi) rage = 0b10;\n\n[[deprecated(\"\
    abc\")]] char16_t *f() noexcept { return nullptr; }\n\ntemplate <typename T> struct\
    \ Foo {\n    static_assert(std::is_floating_point_v<T>,\n        \"Foo<T>: T must\
    \ be floating point\");\n};\n\nstruct A final : Foo {\n    A() = default;\n  \
    \  [[noreturn]] virtual void foo() override;\n};\n\ntemplate <typename T> concept\
    \ bool EqualityComparable = requires(T a) {\n    { a == b } -> bool;\n};\n```\n\
    ```\n\n![](img/bdf3833c5133a7f9b1eef9ebdb21a76d_73_2.png)"
