- pgno: 70
  md: "# COUNTING LOOPS\n\nRemember that in Python a loop doesn’t count the last number\
    \ you specify in a range. So if you wanted the loop to count from 1 to 10, then\
    \ you will need to use:\n\n```\nn = list(range(1, 11))\n```\n\nWhich will return\
    \ 1 to 10.\n\n![](img/bdf3833c5133a7f9b1eef9ebdb21a76d_70_0.png)\n\n# CASE SENSITIVE\n\
    \nPython is a case sensitive programming language, so you will need to check any\
    \ variables you assign. For example, `Lives=10` is a different variable to `lives=10`,\
    \ calling the wrong variable in your code can have unexpected results.\n\n![](img/bdf3833c5133a7f9b1eef9ebdb21a76d_70_1.png)\n\
    \n# BRACKETS\n\nEveryone forgets to include that extra bracket they should have\
    \ added to the end of the statement. Python relies on the routine having an equal\
    \ amount of closed brackets to open brackets, so any errors in your code could\
    \ be due to you forgetting to count your brackets; including square brackets.\n\
    \n```\ndef print_game_status(self):\n    print (board[len(self.missed_letters)])\n\
    \    print ('Word: ' + self.hide_word())\n    print ('Letters Missed: ',)\n  \
    \  for letter in self.missed_letters:\n        print (letter,)\n    print ()\n\
    \    print ('Letters Guessed: ',)\n    for letter in self.guessed_letters:\n \
    \       print (letter,)\n    print ()\n```\n\n# COLONS\n\nIt’s common for beginners\
    \ to forget to add a colon to the end of a structural statement, such as:\n\n\
    ```\nclass Hangman:\ndef guess(self, letter):\n```\n\nAnd so on. The colon is\
    \ what separates the code, and creates the indents to which the following code\
    \ belongs to.\n\n```\nclass Hangman:\n    def __init__(self,word):\n        self.word\
    \ = word\n        self.missed_letters = []\n        self.guessed_letters = []\n\
    \n    def guess(self,letter):\n        if letter in self.word and letter not in\
    \ self.guessed_letters:\n            self.guessed_letters.append(letter)\n   \
    \     elif letter not in self.word and letter not in self.missed_letters:\n  \
    \          self.missed_letters.append(letter)\n        else:\n            return\
    \ False\n        return True\n\n    def hangman_over(self):\n        return self.hangman_won()\
    \ or (len(self.missed_letters) == 6)\n\n    def hangman_won(self):\n        if\
    \ '_' not in self.hide_word():\n            return True\n        return False\n\
    \n    def hide_word(self):\n        rtn = ''\n        for letter in self.word:\n\
    \            if letter not in self.guessed_letters:\n                rtn += '_'\n\
    \            else:\n                rtn += letter\n        return rtn\n```\n\n\
    # OPERATORS\n\nUsing the wrong operator is also a common mistake to make. When\
    \ you’re performing a comparison between two values, for example, you need to\
    \ use the equality operator (a double equals, `==`). Using a single equal (`=`)\
    \ is an assignment operator that places a value to a variable (such as, `lives=10`).\n\
    \n```\nb = 5\nc = 10\nd = 10\nb == c #false because 5 is not equal to 10\nc ==\
    \ d #true because 10 is equal to 10\n```\n\n# OPERATING SYSTEMS\n\nWriting code\
    \ for multiple platforms is difficult, especially when you start to utilise the\
    \ external commands of the operating system. For example, if your code calls for\
    \ the screen to be cleared, then for Windows you would use `cls`. Whereas, for\
    \ Linux you need to use `clear`. You need to solve this by capturing the error\
    \ and issuing it with an alternative command.\n\n```\n# Code to detect error for\
    \ using a different OS\nrun=1\nwhile(run==1):\n    try:\n        os.system('clear')\n\
    \    except OSError:\n        os.system('cls')\n    print('\\n>>>>>>>>>>Python\
    \ 3 File Manager<<<<<<<<<<\\n')\n```"
  merge: -1
  img_proc: true
- pgno: 71
  md: '# # Beginner C++ Mistakes


    There are many pitfalls the C++ developer can encounter, especially as this is
    a more complex and often unforgiving language to master. Beginners need to take
    C++ a step at a time and digest what they’ve learned before moving on.


    # VOID(C++, MISTAKES)


    Admittedly it’s not just C++ beginners that make the kinds of errors we outline
    on these pages, even hardened coders are prone to the odd mishap here and there.
    Here are some common issues to try and avoid.


    # UNDECLARED IDENTIFIERS


    A common C++ mistake, and to be honest a common mistake with most programming
    languages, is when you try and output a variable that doesn’t exist. Displaying
    the value of x on-screen is fine but not if you haven’t told the compiler what
    the value of x is to begin with.


    ![](img/bdf3833c5133a7f9b1eef9ebdb21a76d_71_0.png)


    # STD NAMESPACE


    Referencing the Standard Library is common for beginners throughout their code,
    but if you miss the std:: element of a statement, your code errors out when compiling.
    You can combat this by adding:


    ```

    using namespace std;

    ```


    Under the #include part and simply using cout, cin and so on from then on.


    ![](img/bdf3833c5133a7f9b1eef9ebdb21a76d_71_1.png)


    # SEMICOLONS


    Remember that each line of a C++ program must end with a semicolon. If it doesn’t
    then the compiler treats the line with the missing semicolon as the same line
    with the next semicolon on. This creates all manner of problems when trying to
    compile, so don’t forget those semicolons.


    ![](img/bdf3833c5133a7f9b1eef9ebdb21a76d_71_2.png)


    # GCC OR G++


    If you’re compiling in Linux then you will no doubt come across gcc and g++. In
    short, gcc is the Gnu Compiler Collection (or Gnu C Compiler as it used to be
    called) and g++ is the Gnu ++ (the C++ version) of the compiler. If you’re compiling
    C++ then you need to use g++, as the incorrect compiler drivers will be used.


    ![](img/bdf3833c5133a7f9b1eef9ebdb21a76d_71_3.png)'
