  md: "# A HANDY CHART\n\nThere are numerous character literals, or escape sequence\
    \ codes, to choose from. We therefore thought it would be good for you to have\
    \ a handy chart available, for those times when you need to insert a code.\n\n\
    | ESCAPE SEQUENCE CODE | CHARACTER |\n| --- | --- |\n| `\\\\` | Backslash |\n\
    | `\\'` | Single Quote |\n| `\\\"` | Double Quote (Speech Marks) |\n| `\\?` |\
    \ Question Mark |\n| `\\a` | Alert/Alarm |\n| `\\b` | Backspace |\n| `\\f` | Form\
    \ Feed |\n| `\\n` | New Line |\n| `\\r` | Carriage Return |\n| `\\t` | Horizontal\
    \ Tab |\n| `\\v` | Vertical Tab |\n| `\\0` | Null Character |\n| `\\uxxxx` | Unicode\
    \ (UTF-8) |\n| `\\Uxxxxxxxx` | Unicode (UTF-16) |\n\n# ## UNICODE CHARACTERS (UTF-8)\n\
    \nUnicode characters are symbols or characters that are standard across all platforms.\
    \ For example, the copyright symbol, that can be entered via the keyboard by entering\
    \ the Unicode code, followed by ALT+X. In the case of the copyright symbol enter:\
    \ 00A9 Alt+X. In C++ code, you would enter:\n\n```\n```cpp\n#include <iostream>\n\
    using namespace std;\n\nint main ()\n{\n    cout << \"\\u00A9\";\n}\n```\n```\n\
    \n![](img/bdf3833c5133a7f9b1eef9ebdb21a76d_48_0.png)\n\n# ## UNICODE CHARACTER\
    \ TABLE\n\nA complete list of the available Unicode characters can be found at\
    \ **www.unicode-table.com/en/**. Hover your mouse over the character to see its\
    \ unique code to enter in C++.\n\n![](img/bdf3833c5133a7f9b1eef9ebdb21a76d_48_1.png)"
