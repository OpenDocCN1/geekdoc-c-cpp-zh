- pgno: 29
  md: '# Calendar Module


    Beyond the time module, the calendar module can produce some interesting results
    when executed within your code. It does far more than simply display the date
    in the time module-like format, you can actually call up a wall calendar type
    display.


    # WORKING WITH DATES


    The calendar module is built into Python 3. However, if for some reason it’s not
    installed you can add it using `pip install calendar` as a Windows administrator
    or `sudo pip install calendar` for Linux and macOS.


    STEP 1 — Launch Python 3 and enter: `import calendar` to call up the module and
    its inherent functions. Once it’s loaded into memory, start by entering:


    ```

    sep=calendar.TextCalendar(calendar.SUNDAY)

    sep.prmonth(2017, 9)

    ```


    ![](img/bdf3833c5133a7f9b1eef9ebdb21a76d_29_0.png)


    STEP 2 — You can see that the days of September 2017 are displayed in a wall calendar
    fashion. Naturally you can change the 2017, 9 part of the second line to any year
    and month you want, a birthday for example (1973, 6). The first line configures
    TextCalendar to start its weeks on a Sunday; you can opt for Monday if you prefer.


    ![](img/bdf3833c5133a7f9b1eef9ebdb21a76d_29_1.png)


    STEP 3 — There are numerous functions within the calendar module that may be of
    interest to you when forming your own code. For example, you can display the number
    of leap years between two specific years:


    ```

    leaps=calendar.leapdays(1900, 2018)

    print(leaps)

    ```


    The result is 29, starting from 1904 onward.


    ![](img/bdf3833c5133a7f9b1eef9ebdb21a76d_29_2.png)


    STEP 4 — You could even fashion that particular example into a piece of working,
    user interactive Python code:


    ```

    import calendar

    print(“>>>>>>>>Leap Year Calculator<<<<<<<<\n”)

    y1=int(input(“Enter the first year: “))

    y2=int(input(“Enter the second year: “))

    leaps=calendar.leapdays(y1, y2)

    print(“Number of leap years between”, y1, “and”, y2, “is:”, leaps)

    ```


    ![](img/bdf3833c5133a7f9b1eef9ebdb21a76d_29_3.png)'
  merge: -1
  img_proc: true
- pgno: 30
  md: "# STEP 5\n\nYou can also create a program that will display all the days, weeks\
    \ and months within a given year:\n\n```\n```python\nimport calendar\nyear=int(input(“Enter\
    \ the year to display: “))\nprint(calendar.prcal(year))\n```\n```\n\nWe’re sure\
    \ you’ll agree that’s quite a handy bit of code to have to hand.\n\n![](img/bdf3833c5133a7f9b1eef9ebdb21a76d_30_0.png)\n\
    \n# STEP 8\n\nYou’re also able to print the individual months or days of the week:\n\
    \n```\n```python\nimport calendar\nfor name in calendar.month_name:\n    print(name)\n\
    \nimport calendar\nfor name in calendar.day_name:\n    print(name)\n```\n```\n\
    \n![](img/bdf3833c5133a7f9b1eef9ebdb21a76d_30_1.png)\n\n# STEP 6\n\nInterestingly\
    \ we can also list the number of days in a month by using a simple for loop:\n\
    \n```\n```python\nimport calendar\ncal=calendar.TextCalendar(calendar.SUNDAY)\n\
    for i in cal.itermonthdays(2018, 6):\n    print(i)\n```\n```\n\n![](img/bdf3833c5133a7f9b1eef9ebdb21a76d_30_2.png)\n\
    \n# STEP 9\n\nThe calendar module also allows us to write the functions in HTML,\
    \ so that you can display it on a website. Let’s start by creating a new file:\n\
    \n```\n```python\nimport calendar\ncal=open(“/home/pi/Documents/cal.html”, “w”)\n\
    c=calendar.HTMLCalendar(calendar.SUNDAY)\ncal.write(c.formatmonth(2018, 1))\n\
    cal.close()\n```\n```\n\nThis code will create an HTML file called cal, open it\
    \ with a browser and it displays the calendar for January 2018.\n\n![](img/bdf3833c5133a7f9b1eef9ebdb21a76d_30_3.png)\n\
    \n# STEP 7\n\nYou can see that code produced some zeros at the beginning, this\
    \ is due to the starting day of the week, Sunday in this case, and overlapping\
    \ days from the previous month. So the counting of the days will start on Friday\
    \ 1st June 2018 and will total 30 as the output correctly displays.\n\n![](img/bdf3833c5133a7f9b1eef9ebdb21a76d_30_4.png)\n\
    \n# STEP 10\n\nOf course, you can modify that to display a given year as a web\
    \ page calendar:\n\n```\n```python\nimport calendar\n\nyear=int(input(“Enter the\
    \ year to display as a webpage: “))\ncal=open(“/home/pi/Documents/cal.html”, “w”)\n\
    cal.write(calendar.HTMLCalendar(calendar.MONDAY).formatyear(year))\ncal.close()\n\
    ```\n```\n\nThis code asks the user for a year, then creates the necessary webpage.\
    \ Remember to change your file destination.\n\n![](img/bdf3833c5133a7f9b1eef9ebdb21a76d_30_5.png)"
