- pgno: 46
  md: "# STEP 5\n\nThe principal works the same as the previous code. The user’s input,\
    \ their name, is stored in a string, because it contains multiple characters,\
    \ and retrieved in the second `cout` line. As long as the variable ‘name’ doesn’t\
    \ change, then you can recall it wherever you like in your code.\n\n![](img/bdf3833c5133a7f9b1eef9ebdb21a76d_46_0.png)\n\
    \n# STEP 6\n\nYou can chain input requests to the user but just make sure you\
    \ have a valid variable to store the input to begin with. Let’s assume you want\
    \ the user to enter two whole numbers:\n\n```\n```cpp\n#include <iostream>\nusing\
    \ namespace std;\n\nint main ()\n{\n    int num1, num2;\n\n    cout << “Enter\
    \ two whole numbers: “;\n    cin >> num1 >> num2;\n\n    cout << “you entered\
    \ “ << num1 << “ and “ << num2 << “\\n”;\n}\n```\n```\n\n![](img/bdf3833c5133a7f9b1eef9ebdb21a76d_46_1.png)\n\
    \n# STEP 7\n\nLikewise, inputted data can be manipulated once you have it stored\
    \ in a variable. For instance, ask the user for two numbers and do some maths\
    \ on them:\n\n```\n```cpp\n#include <iostream>\nusing namespace std;\n\nint main\
    \ ()\n{\n    float num1, num2;\n\n    cout << “Enter two numbers: \\n”;\n    cin\
    \ >> num1 >> num2;\n\n    cout << num1 << “ + “ << num2 << “ is: “ << num1 + num2\
    \ << “\\n”;\n}\n```\n```\n\n![](img/bdf3833c5133a7f9b1eef9ebdb21a76d_46_2.png)\n\
    \n# STEP 8\n\nWhile `cin` works well for most input tasks, it does have a limitation.\
    \ `Cin` always considers spaces as a terminator, so it’s designed for just single\
    \ words not multiple words. However, `getline` takes `cin` as the first argument\
    \ and the variable as the second:\n\n```\n```cpp\n#include <iostream>\nusing namespace\
    \ std;\n\nint main ()\n{\n    string mystr;\n    cout << “Enter a sentence: \\\
    n”;\n    getline(cin, mystr);\n\n    cout << “Your sentence is: “ << mystr.size()\
    \ <<\n    “ characters long.\\n”;\n}\n```\n```\n\n![](img/bdf3833c5133a7f9b1eef9ebdb21a76d_46_3.png)\n\
    \n# STEP 9\n\nBuild and execute the code, then enter a sentence with spaces. When\
    \ you’re done the code reads the number of characters. If you remove the getline\
    \ line and replace it with cin >> mystr and try again, the result displays the\
    \ number of characters up to the first space.\n\n![](img/bdf3833c5133a7f9b1eef9ebdb21a76d_46_4.png)\n\
    \n# STEP 10\n\nGetline is usually a command that new C++ programmers forget to\
    \ include. The terminating white space is annoying when you can’t figure out why\
    \ your code isn’t working. In short, it’s best to use `getline(cin, variable)`\
    \ in future:\n\n```\n```cpp\n#include <iostream>\nusing namespace std;\n\nint\
    \ main ()\n{\n    string name;\n    cout << “Enter your full name: \\n”;\n   \
    \ getline(cin, name);\n\n    cout << “\\nHello, “ << name << “\\n”;\n}\n```\n\
    ```\n\n![](img/bdf3833c5133a7f9b1eef9ebdb21a76d_46_5.png)"
