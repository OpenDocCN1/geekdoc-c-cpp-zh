- pgno: 69
  md: "# # Beginner Python Mistakes\n\nPython is a relatively easy language to get\
    \ started in where there's plenty of room for the beginner to find their programming\
    \ feet. However, as with any other programming language, it can be easy to make\
    \ common mistakes that'll stop your code from running.\n\n# ## DEF BEGINNER(MISTAKES=10)\n\
    \nHere are ten common Python programming mistakes most beginners find themselves\
    \ making. Being able to identify these mistakes will save you headaches in the\
    \ future.\n\n# ### VERSIONS\n\nTo add to the confusion that most beginners already\
    \ face when coming into programming, Python has two live versions of its language\
    \ available to download and use. There is Python version 2.7.x and Python 3.6.x.\
    \ The 3.6.x version is the most recent, and the one we'd recommend starting. But,\
    \ version 2.7.x code doesn't always work with 3.6.x code and vice versa.\n\n![](img/bdf3833c5133a7f9b1eef9ebdb21a76d_69_0.png)\n\
    \n# ### INDENTS, TABS AND SPACES\n\nPython uses precise indentations when displaying\
    \ its code. The indents mean that the code in that section is a part of the previous\
    \ statement, and not something linked with another part of the code. Use four\
    \ spaces to create an indent, not the Tab key.\n\n```\n    MOVESPEED = 11\n  \
    \  MOVE = 1\n    SHOOT = 15\n\n    # set up counting\n    SCORE = 0\n\n    # set\
    \ up font\n    font = pygame.font.Font('freesans', 50)\n\n    def makeplayer():\n\
    \        player = pygame.Rect(370, 635, 40, 25)\n        return player\n\n   \
    \ def makeinvaders():\n        for i in invaders:\n            for j in range(11):\n\
    \                invader = pygame.Rect(754+i, 75+j, 50, 20)\n                invaders.append(invader)\n\
    \            i += 60\n        return invaders\n\n    def makewalls(vals):\n  \
    \      wall = pygame.Rect(60, 520, 120, 30)\n        walls = pygame.Rect(252,\
    \ 520, 120, 30)\n        walls = pygame.Rect(352, 520, 120, 30)\n        walls\
    \ = pygame.Rect(452, 520, 120, 30)\n```\n\n# ### THE INTERNET\n\nEvery programmer\
    \ has and does at some point go on the Internet and copy some code to insert into\
    \ their own routines. There's nothing wrong with using others' code, but you need\
    \ to know how the code works and what it does before you go blindly running it\
    \ on your own computer.\n\n![](img/bdf3833c5133a7f9b1eef9ebdb21a76d_69_1.png)\n\
    \n# ### COMMENTING\n\nAgain we mention commenting. It's a hugely important factor\
    \ in programming, even if you're the only one who is ever going to view the code,\
    \ you need to add comments as to what's going on. Is this function where you lose\
    \ a life? Write a comment and help you, or anyone else, see what's going on.\n\
    \n```\n    # set up pygame\n    pygame.init()\n    mainClock = pygame.time.Clock()\n\
    \n    # set up the window\n    width = 800\n    height = 700\n    screen = pygame.display.set_mode((width,\
    \ height), 0, 32)\n    pygame.display.set_caption('caption')\n\n    # set up movement\
    \ variables\n    moveLeft = False\n    moveRight = False\n    moveUp = False\n\
    \    moveDown = False\n\n    # set up direction variables\n    DOWNLEFT = 1\n\
    \    DOWNRIGHT = 3\n```"
