    \ when the function returns and a new function is called.\n\n# Pure functions\n\
    \nA pure function is a function that has no side-effects and whose return value\
    \ depends only on the values of its arguments. This closely follows the mathematical\
    \ notion of a function.\n\nMultiple calls to a pure function with the same arguments\
    \ are used to produce the same result. A compiler can eliminate common subexpressions\
    \ that contain pure function calls and move out loop-invariant code containing\
    \ pure function calls. Unfortunately, the compiler cannot know that a function\
    \ is pure if the function is defined in a different module or a library function.\n\
    \nTherefore, it is necessary to do optimizations such as common subexpression\
