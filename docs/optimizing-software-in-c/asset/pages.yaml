  md: '# 9.6 Dynamic memory allocation


    Objects and arrays can be allocated dynamically with new and delete, or malloc
    and free. This can be useful when the amount of memory required is not known at
    compile time. Four typical uses of dynamic memory allocation can be mentioned
    here:


    +   - A large array can be allocated dynamically when the size of the array is
    not known at compile time.

    - A variable number of objects can be allocated dynamically when the total number
    of objects is not known at compile time.

    - Text strings and similar objects of variable size can be allocated dynamically.

    - Arrays that are too large for the stack can be allocated dynamically.


    The advantages of dynamic memory allocation are:


    +   - Gives a more clear program structure in some cases.

    - Does not allocate more space than needed. This makes data caching more efficient
    than a fixed-size array is made very big in order to cover the worst case situation
    of maximum possible memory requirement.

    - Useful when no unreasonable upper limit to the required amount of memory space
    can be given in advance.


    The disadvantages of dynamic memory allocation are:


    +   - The process of dynamic allocation and deallocation of memory takes much
    more time than other kinds of storage. See page 25.

    - The heap space becomes fragmented when objects of different sizes are allocated
    and deallocated in random order. This makes data caching inefficient.

    - An allocated array may need to be resized in the event that it becomes full.
    This may require a new bigger memory block allocated and the entire contents copied
    to the new block. Any pointers to data in the old block become invalid.

    - The heap manager will start garbage collection when the heap space has become
    too fragmented. This garbage collection may start at unpredictable times and cause
    delays in the program flow at inconvenient times when a user is waiting for response.

    - It is the responsibility of the programmer to make sure that everything has
    been allocated is also deallocated. Failure to do so will cause the heap to be
    filled up. This is a common programming error known as memory leaks.

    - It is the responsibility of the programmer to make sure that no object is accessed
    after it has been deallocated. Failure to do so is also a common programming error.

    - The allocated memory may not be optimally aligned. See page 133 for how to align
    dynamically allocated memory.

    - It is difficult for the compiler to optimize code that uses pointers because
    it cannot rule out aliasing (see page 81).'
