    are done with single or double precision, and intermediate results are always
    calculated with the same precision as the operands. The advantages of using the
    vector registers are:


    +   - It is easy to make floating point registers variables.


    +   - Vector operations are available for parallel calculations on multiple variables
    in vector registers (see page 115).


    Disadvantages are:


    +   - Long double precision is not supported.


    +   - The calculation of expressions whose operands have mixed precision require
    precision conversion instructions which can be quite time-consuming (see page
    153).


    +   - Mathematical functions point registers are available in all systems that
    have floating point capabilities (except in device drivers for 64-bit windows).
    The XMM, YMM, and ZMM registers use the SSE, AVX, and AVX512 instruction set,
    respectively. See page 135 for the testability of all these instruction sets.


    Modern compilers use vector registers for floating point calculations whenever
    they are available, i.e. in 64-bit mode or when the SSE or higher instruction
    set is enabled. Few compilers are able to mix the two types of floating point
    operations and choose the type that is optimal for each calculation.


    In most cases, double precision calculations take no more time than single precision
    as long as they are not joined into vectors. Single precision division, square
    root, and mathematical functions are faster than double precision when the XMM
    registers are used, while the speed of addition, subtraction, multiplication,
    else; is still the same regardless of precision on processors when vector operations
    are not used.


    You may use double precision without worrying about the costs if it is good for
    the application. You may use single precision if you have big arrays and want
    to get as much data into the data cache. Single precision is good if you take
    advantage of vector operations, explained on page 115. Half precision can be used
