    # 12.9 Aligning RGB video or 3-dimensional vectors


    RGB data has three values. This points does not fit into a vector of e.g. floats.
    The same applies to 3-dimensional geometry and other odd-sized vector data. The
    data to be aligned by the vector size for the sake of efficiency. Using unaligned
    reads and writes may slow down the execution to the point where it is less advantageous
    to use vector operations. You may choose one of the following solutions, depending
    on what fits best into the algorithm in question:


    +   * Put in an unused fourth value to make the data fit into the vector. This
    is a simple solution, but it increases the amount of memory used. You may avoid
    this method if memory access is a bottleneck.

    * Organize the data into groups of four (or eight) points with the R value in
    one vector, the four G values in the next, and the B value in the last vector.

    * Organize the data with all the R values first, then all the G values, and last
    all the B values.


    The choice of method to use depends on what fits best the algorithm in question.
    You may choose the method that gives the simplest code.


    If the number of points is not divisible by the vector size then add a few unused
    points in the end in order to get an integer number of vectors.


