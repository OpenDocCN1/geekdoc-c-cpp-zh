  md: "# 7.26 Unions\n\nA union is a structure where data members share the same memory\
    \ space. A union can be used for saving memory space by allowing two data members\
    \ that are never used at the same time to share the same piece of memory. See\
    \ page 94 for an example.\n\nA union can also be used for accessing the same data\
    \ in different ways. Example:\n\n```\n// Example 7.43\nunion {\n    float f;\n\
    \    int i;\n}\nx.f = 2.0f;\nx.i |= 0x80000000; // set sign bit of f\ncout <<\
    \ x.f; // will give -2.0\n```\n\nIn this example, the sign bit of **f** is set\
    \ by the bitwise OR operator, which can only be applied to integers.\n\n# 7.27\
    \ Bitfields\n\nBitfields may be useful for making data more compact. Accessing\
