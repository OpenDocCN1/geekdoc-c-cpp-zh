    #  3.2 Use a profiler to find hot spots


    Before you start to optimize, you have to identify the critical parts of the program.
    In some programs, more than 99% of the time is spent in the innermost loop mathematical
    calculations. In other programs, 99% of the time is spent on reading and writing
    data files while less than 1% goes to doing something on these data. It is very
    important to profile the parts of the code that matters rather than the parts
    of the code use only a small fraction of the total time. Optimizing less critical
    parts of the code will not only be a waste of time, it also makes the code less
    clear and more difficult to debug and maintain.


    Most compilers provide a profiler that can tell how many times function is called
    and how much time it uses. There are also third-party profilers like AQtime, Intel
    VTune and AMD CodeAnalyst.


    There are several different profiling methods:


    +   Instrumentation: The profiler inserts extra code at each function call to
    count how many times the function is called and how much time it takes.


    +   Debugging: The profiler inserts temporary debug breakpoints at every function
    or every code line.


    +   Time-based sampling: The profiler tells the operating system to generate an
    interrupt, e.g. every millisecond. The profiler counts how many times an interrupt
    occurs in each part of the program. This requires no modification of the program
    under, but is less reliable.


    +   Event-based sampling: The profiler tells the CPU to generate interrupts at
    certain events, every time a cache miss has occurred. This makes it possible to
    see which part of the program has most cache misses, branch mispredictions, floating
    point exceptions, etc. Event-based sampling reveals a CPU-specific profiler. For
    Intel CPUs use VTune, for AMD CPUs use AMD CodeAnalyst.


    Unfortunately, profilers are often unreliable. Sometimes they give misleading
    results or fail completely because of technical problems.


    Some common problems with profilers are:


    +   Coarse time measurement. If time is measured with millisecond resolution and
    the critical functions take microseconds to execute then measurements can become
    imprecise or zero.


    +   Execution time too small or too long. If the program under test finishes in
    a short time then the sampling generates too little data for analysis. If the
    program takes too long to execute then the profiler may sample more data than
    it can handle.


    +   Waiting for user input. Many programs spend most of their time waiting for
    user input or network resources. This is included in the profile. It may be necessary
    to modify the code'
