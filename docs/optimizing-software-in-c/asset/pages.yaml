    # 13.7 CPU dispatching in Intel compiler


    The Intel compiler comes in two versions, a legacy version called "Classic" and
    a newer version labeled "LLVM-based" which is a forking of the Clang compiler.


    The Intel compiler "Classic" has a feature for making multiple versions of a function
    for different Intel CPUs. Each uses the dispatch on every call method. When the
    function is called, a dispatch is made to the desired version of the function.
    The automatic dispatching can be made for all suitable functions in a module by
    compiling the module, with e.g. the option /QAVX or -aAVX. This will make multiple
    versions of all relevant functions. It is possible to do the dispatching only
    for speed-critical functions using declspec(cpu_dispatch(...)). See the Intel
    C++ Compiler Documentation for details.


    The Intel compiler Classic is currently the only compiler that can generate CPU
    dispatching on user code automatically. Unfortunately, the CPU dispatch mechanism
    in the Intel compiler works only for Intel CPUs, not for AMD or other brands.


    The CPU dispatch mechanism provided by Intel is less efficient than the Gnu compiler
    mechanism because it makes dispatching on every call of the critical function.
    While the Gnu mechanism stores a pointer to the desired version in a procedure
    linkage table. If a dispatch calls another function dispatched with the Intel
    compiler the dispatch branch of the latter is executed even though the CPU-type
    is already known at this place. This can be avoided by inlining the latter function,
    but it may be better to do the CPU dispatching explicitly as in example 13.1 on
    page 140.


    Intel function libraries have features for automatic CPU dispatching. Many Intel
    library functions have several versions for different processors and instruction
    sets.


    Unfortunately, the CPU detection mechanism in the Intel compiler Classic has several
    flaws:


    +   - The best version of the code is chosen only when running on an Intel processor.
    The CPU dispatcher checks whether the processor is an Intel before it checks instructions
    it supports. An inferior "generic" version of the code is selected if the processor
    is not Intel, even if it is compatible with a better version of the code. This
    can lead to a dramatic degradation of performance on AMD and VIA processors.

    - Explicit CPU dispatch works only with Intel processors. A non-Intel processor
    makes the dispatcher signal an error by performing an illegal operation that crashes
    the program or by printing an error message.

    - The CPU dispatcher does not check if XMM registers are supported by the operating
    system. It will crash on old operating systems that do not support SSE.


    Several function libraries published by Intel have similar CPU dispatch mechanisms,
    and some of these also treat non-Intel CPUs in a suboptimal way.'
