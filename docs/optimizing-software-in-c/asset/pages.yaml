    # 12 Using vector operations


    Today''s microprocessors have vector instructions that make it possible to do
    operations on all elements of a vector simultaneously. This is also called Single-Instruction-Multiple-Data
    (SIMD) operations. The total size of each vector can be 64 bits (MMX), 128 bits
    (XMM), 256 bits (YMM), and 512 bits (ZMM).


    Vector operations are useful when doing calculations on large data sets where
    the same operation is performed on multiple data elements and the program logic
    allows parallel calculations on vectors and matrices. Algorithms that are inherently
    serial, such as most sorting algorithms, are not well suited for vector operations.
    Examples are image processing, sound processing, and mathematical operations on
    vectors. Algorithms that rely heavily on table lookup or require data permutation,
    such as many encryption algorithms, are perhaps less suited for vector operations.


    The vector operations use a set of special vector registers. The maximum size
    of each vector register is 128 bits (XMM) if the SSE2 instruction is available,
    256 bits (YMM) if the AVX instruction set is available, and 512 bits when the
    AVX512 instruction set is available. The number of elements in each vector depends
    on the size and type of data elements, as follows:'
