- img_proc: true
  md: 'typically have much less memory and computing power than PCs. Therefore, it
    is even more important to economize the resource use on such systems than it is
    a PC platform. However, with a well optimized software design, it is possible
    to get a good performance for many applications on such small devices, as discussed
    on page 173.


    This manual is based on the standard PC platform with an Intel, AMD, or VIA processor
    and a Windows, Linux, BSD, or Mac operating system running in 32-bit or 64-bit
    mode. Much of the advice given here apply to other platforms as well, but the
    examples have been tested only on PC platforms.


    # Graphics accelerators


    The choice of platform is obviously influenced by the requirements of the task
    in question. For example, heavy graphics application is preferably implemented
    on a platform with a graphics coprocessor or graphics accelerator card. Some systems
    also have a dedicated physics processor for calculating the physical movements
    of objects in a computer game or animation.


    It is possible in some cases to use the high processing power of the processors
    on a graphics accelerator card for other purposes than rendering graphics on the
    screen. However, such applications are highly system dependent and therefore not
    recommended if portability is important. This manual does not cover graphics processors.


    # Programmable logic devices


    A programmable logic device is a chip that can be programmed in a hardware definition
    language, such as Verilog or VHDL. Common devices are CPLDs and FPGAs. The difference
    between a programming language, like C++, and a hardware definition language is
    that the software programming language defines an algorithm of instructions, where
    a hardware definition language defines hardware circuits consisting of digital
    building blocks such as gates, flip-flops, multiplexers, arithmetic units, etc.
    and the wires that connect them. The hardware definition language is inherently
    parallel because it defines electrical connections rather than sequences of operations.


    A complex digital operation can be executed faster in a programmable logic device
    than in a microprocessor because the hardware can be wired for a specific purpose.


    It is possible to implement a microprocessor in an FPGA as a so-called soft processor.
    Such a soft processor is much slower than a dedicated microprocessor and therefore
    not advantageous by itself. But a solution where a processor activates critical
    application-specific instructions that are coded in a hardware definition language
    in the same chip can be a very efficient solution in some cases. An even more
    powerful solution is the combination of a dedicated microprocessor core and an
    FPGA in the same chip. Hybrid solutions are used in some embedded systems.


    A look in my crystal ball reveals that similar solutions may be implemented in
    PC processors. The application program will be able to define application-specific
    instructions that can be coded in a hardware definition language. Such a processor
    will have an extra cache for the hardware definition code in addition to the code
    cache and the data cache.


    # 2.2 Choice of microprocessor


    The benchmark performance of comparing bands of microprocessors are very similar
    thanks to heavy competition. Processors with multiple cores are advantageous for
    applications that can be divided into multiple threads that run in parallel. Small
    processors with low power consumption are quite powerful and may be sufficient
    for less intensive applications.'
