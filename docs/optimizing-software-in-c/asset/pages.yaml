  md: 'can be implemented in compiled C++ and the rest of the code, including user
    interface etc., can be implemented in the high level framework. The optimized
    part of the code can possibly be compiled as a dynamic library (DLL) or shared
    object which is called by the rest of the code. This is not an optimal solution
