    # 12.7 Mathematical functions for vectors


    There are various libraries for computing mathematical functions such as logarithms,
    exponential functions, etc. in vectors. These function libraries are useful for
    vectorizing mathematical code.


    There are different kinds of vector math: long vector libraries and short vector
    libraries. To explain the difference, let''s say that you want to calculate the
    same function on a thousand numbers. With a long vector, you are feeding an array
    of numbers as a parameter to the library function, and the function stores the
    results in another array. The disadvantage of using a long vector is that if you
    are doing a sequence of calculations you have to store the intermediate result
    of each step of the sequence in memory before calling the function for the next
    step. With a short vector library, you divide the data by the size of registers
    in the CPU. If the registers can hold e.g. eight numbers, you have to call the
    library function 125 times with eight numbers at a time packed into a vector.
    The library function will return the result in a vector which can be fed directly
    to the next step in the sequence of calculations without needing to store intermediate
    results in RAM memory. Memory may be faster despite the extra calls, but the CPU
    can do calculations while simultaneously fetching the code of the next function.
    However, the short vector method may be a disadvantage if the sequence of calculations
    forms a long dependency chain. Each calculation depends on the previous sub-vector
    before it finishes. A long dependency chain may fill the queue of pending instructions
    in the CPU and prevent from fully utilizing its out-of-order calculation capabilities.


    Here is a list of short vector math libraries:


    +   - Intel vector math library (VML, MKL). Works with all x86 platforms. The
    performance of this library on non-Intel CPUs is uncertain. See page Error! Bookmark
    not defined.

    - Intel Primitives Priorities (IPP). Works with all x86. Works well with non-Intel
    CPUs. Includes many functions for statistics, signal processing and image processing.

    - Yepp. Open source library. Supports x86 and ARM platforms and various programming
    languages. www.yepp.info


    And here is a list of short vector math libraries:


    +   - Sleef. Supports many different platforms. Open source, www.sleef.org

    - Intel short vector math library (SVML). This is included with Intel compilers
    and invoked with automatic vectorization. This library works well with non-Intel
    CPUs if you are not using an Intel compiler. See page Error! Bookmark not defined.

    - Most compilers use a vector library that is used in automatic vectorization
    of loops containing math functions. See discussion below.

    - VCL vector library. Open source. Supports all x86 platforms. Microsoft, Intel,
    Gnu and Clang compilers. The code is inlined so there is no need to link with
    external libraries. https://github.com/vectorclass'
