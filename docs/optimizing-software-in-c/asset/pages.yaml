    Calling a function through a function pointer may take a few clock cycles more
    than calling the function directly if the target address can be predicted. The
    target address is predicted if the value of the function pointer is the same as
    last time the statement was executed. The target address will quite be mispredicted
    if the value of the function pointer changes. misprediction causes a long delay.
    See page 43 about branch prediction.


    # 7.8 Member pointers


    In simple cases, a data member pointer stores the offset of a data member relative
    to the beginning of the object, and a member function pointer is simply the address
    of the member function. There are special cases such as multiple inheritance where
    a more complicated implementation is needed. These complicated cases should definitely
    be avoided.


    A compiler has to use the most complicated implementation of member pointers if
    it has incomplete information about the class that the member refers to. For example:


    ```

    // Example 7.14

    class cl;

    int cl::*MemberPointer;

    ```


    Here the compiler has no information about the class cl other than its name at
    the time MemberPointer is declared. Therefore, it has to assume the worst possible
    case and make a complicated implementation of the member pointer. This can be
    avoided by making the full declaration of cl before MemberPointer is declared.
    Avoid multiple inheritance, virtual functions, and other complications that make
    member pointers less efficient.


    Most C++ compilers have options to control how the member pointers are implemented.
    Use the option that gives the simplest implementation if possible, and make sure
    you are using the same compiler option for all modules that use the member pointer.


