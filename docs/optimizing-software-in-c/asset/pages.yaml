  md: "The best way to fully utilize systems with multiple CPU cores is to divide\
    \ the job into multiple threads. Each thread can then run on its own CPU core.\n\
    \nThere are four kinds of costs of multithreading that we have to take into account\
    \ when optimizing multithreaded applications:\n\n+   - The cost of starting and\
    \ stopping threads. Do not put a task into a separate thread if it is short in\
    \ duration compared with the time it takes to start and stop the thread.\n- The\
    \ cost of task switching. This cost is minimized if the number of threads with\
    \ the same priority is no more than the number of CPU cores.\n- The cost of synchronizing\
    \ and communicating between threads. The overhead of semaphores, mutexes, etc.\
    \ is considerable. If two threads are waiting for other to get access to the resource,\
    \ then it may be better to join them into one thread. A variable that is shared\
    \ between multiple threads must be declared volatile. This prevents the compiler\
    \ from storing that in a register, which is not shared between threads.\n- The\
    \ threads need separate storage. No function or class that is used by multiple\
    \ threads should rely on static or global variables. (Thread-local storage p.\
