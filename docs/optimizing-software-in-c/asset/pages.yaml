  md: '# 8.4 Obstacles to optimization by CPU


    Modern CPUs can do a lot of optimization by executing instructions out of order.
    Long dependency chains in the code prevent the CPU from doing out-of-order execution,
    as explained on page 21. Avoid long dependency chains, especially loop-carried
    dependency chains with long latencies.


    # 8.5 C++ optimization options


    All C++ compilers have various optimization options that can be turned on and
    off. It is important to study the available options for the compiler you are using
    and turn on all relevant options. The most important options are explained below.


    Many optimization options are incompatible with debugging. A debugger can execute
    code line one at a time and show the values of all variables. Obviously, this
    is not possible when parts of the code have been reordered, indexed, or optimized.
    It is common to make two versions of a program: a debug version with full debugging
    optimization options turned on, which is used during program development, and
    a release version with all relevant options. Most IDE''s (Integrated Development
    Environments) have facilities for making a debug version and a release version
    of object files and executables. Make sure to distinguish these two versions and
    turn off debugging and profiling support in the optimized version of the executable.


    Most compilers offer a choice between optimizing for size and speed. Optimizing
    for size is relevant when the code is fast and you want the executable to be as
    small as possible. In some cases, you may get better performance when optimizing
    for size if the code cache, micro-cache, or loop buffer in the CPU is a limiting
    resource.


    Optimizing for speed is relevant when CPU access and memory access are critical
    consumers. The highest optimization option is often the best, but in some cases
    the highest optimization option is actually doing things that are not optimal
    in the specific case.


    Some compilers offer profile-guided optimization. This works in the following
    way: First you compile the program with profiling support. Then you make a test
    run with a profiler that determines the program flow and the number of times each
    function and branch is executed. The compiler can then use this information to
    optimizations to the hot spots and to put the different branches and functions
    in optimal order.


    Most compilers have support for whole program optimization. This works by compiling
    in two stages. All source files are first compiled to an intermediate file format
    not the usual object file format. The intermediate files are then linked in the
    second step where the compilation is finished. Register allocation and function
    inlining are done at the second step. The intermediate file format is not standardized.
    It is not even possible with different versions of the same compiler. It is therefore
    not possible to distribute function libraries in this format.


    Other compilers offer the possibility of compiling multiple .cpp files into a
    single object file. This enables the compiler to do cross-module optimizations
    when intercedural optimization is enabled. A more primitive, but very efficient,
    way of doing whole program optimization is to join all source files into one by
    means of #include directives and declare all non-function functions static or
    inline. This will enable the compiler to do intercedural optimizations of the
    whole program


    You may choose the newest instruction set available when compatibility with all
    CPUs is not needed. Alternatively, you may make multiple versions of the most
    critical part of the code to support different CPUs. This method is explained
    on page 135.'
