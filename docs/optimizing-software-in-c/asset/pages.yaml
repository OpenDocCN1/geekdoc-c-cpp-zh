    # Thread-local storage


    Most compilers can make thread-local storage of static and global variables by
    using the keyword thread local, thread or declspec(thread). These variables have
    one instance for each thread. Thread-local storage is inefficient because it is
    accessed through a pointer stored in a thread environment block. Static thread-local
    storage should be avoided, and replaced by storage on the thread''s stack (see
    above, p. 25). Non-static variables and objects that are declared in the thread
    function, or in any function called by the thread function, will be stored on
    the thread''s stack. These variables and objects will have a separate instance
    for each thread. The need for static thread-local storage can be avoided in most
    cases by declaring the variables or objects inside the thread function.


    # Far


    Systems with segmented memory, like the DOS and 16-bit Windows, allow variables
    to be stored in a far data segment using the keyword far (DOS arrays can be huge).
    Storage far, pointers, and procedures are inefficient. If a program has too much
    data for one segment then it is recommended to use a different operating system
    that allows larger segments (32-bit or 64-bit systems).


    # Dynamic memory allocation


    Dynamic memory allocation is done with the operators new and delete or with functions
    malloc and free. These operators and functions consume a significant amount of
    time. A part of memory is reserved for dynamic allocation. The heap can easily
    become fragmented when objects of different sizes are allocated and deallocated
    in random order. The heap manager can spend a lot of time cleaning up spaces that
    are no longer used and searching for vacant spaces. This is called garbage collection.
    Objects that are allocated in sequence are not necessarily stored sequentially
    in memory. They may be scattered around different places when the heap has fragmented.
    This makes data caching inefficient.


    Dynamic memory allocation also tends to make the code more complicated and error-prone.
    The program has to keep pointers to all allocated objects and keep track of when
    are no longer used. It is important that all allocated objects are also deallocated
    in all possible cases of program flow. Failure to do so is a common source of
    error known as memory leak. An even worse kind of error is to access an object
    after it has been deallocated. The program logic may need extra overhead to prevent
    such errors.


    See page 95 for a further discussion of the advantages and drawbacks of using
    dynamic memory allocation.


    Some programming languages, such as Java, use dynamic memory allocation for all
    objects. This is of course inefficient.


    # Variables declared inside a class


    Variables declared inside a class are stored in the order in they appear in the
    class declaration. The type of storage is determined when the object of the class
    is declared. An object of a class, structure, or union can use any of the storage
    methods mentioned above. An object cannot be stored in a register except in the
    simplest cases, but its data members can be copied into registers.


    A class member variable with the static modifier will be stored in static memory
    and will have one and only one instance. Non-static members of the class will
    be stored with each instance of the class.'
