    more RAM than ends users. The developers may fail to see the excessive memory
    swapping and other resource problems that cause the resource-hungry applications
    to perform poorly for the user end.


    +   - Installation problems. The procedures for installation and uninstallation
    of programs should be standardized and done by the operating system rather than
