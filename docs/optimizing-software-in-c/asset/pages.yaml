    \ + 1.0f;\n```\n\nThe compiler may replace the call to square by the code inside\
    \ square:\n\n```\n// Example 8.1b\nfloat parabola (float x) {\n    return x *\
    \ x + 1.0f;\n```\n\nThe advantages of function inlining are:\n\n+   - The overhead\
    \ of call and parameter transfer are eliminated.\n- Code coding will be better\
    \ because the code becomes contiguous.\n- The code becomes smaller if there is\
    \ only one call to the inlined function.\n- Function inlining can open the possibility\
    \ for other optimizations, as explained below.\n\nThe disadvantage of function\
    \ inlining is that the code becomes bigger if there is more than one call to the\
    \ inline function and the function is big. The compiler is more likely to inline\
    \ a function if it is small or if it is called from one or a few places.\n\n#\
    \ Constant folding and constant propagation\n\nAn expression or subexpression\
    \ containing only constants will be replaced by the calculated result: Example:\n\
    \n```\n// Example 8.2a\ndouble a, b;\na = b + 2.0 / 3.0;\n```\n\nThe compiler\
