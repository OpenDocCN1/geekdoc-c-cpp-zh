    # # 1 Introduction


    This manual is for advanced programmers and software developers who want to make
    their software faster. It is assumed that the reader has a good knowledge of the
    C++ programming language and a basic understanding of how compilers work. The
    C++ language is chosen as the basis for this manual for reasons explained below.


    This manual is based mainly on how study of processors and microprocessors work.
    The recommendations are based on the x86 family of microprocessors from Intel,
    AMD, and VIA including the 64-bit versions. The x86 processors are used in the
    most common platforms with Windows, Linux, BSD, and Mac OS operating systems,
    though these operating systems can also be used with other microprocessors and
    instruction sets. Many of the advices may apply to other platforms and other compiled
    programming languages as well.


    This is the first in series of five manuals:


    +   1. Optimizing software in C++: An optimization guide for Windows, Linux, and
    Mac platforms.

    2. Optimizing subroutines in assembly language: An optimization guide for x86
    platforms.'
