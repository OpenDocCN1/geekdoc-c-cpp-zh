    right format in each case.\n\n# Inlined functions have a non-inlined copy\n\n\
    Function inlining has the complication that the same function may be called from\
    \ another\nmodule. The compiler has a non-inlined copy of the inlined function\
    \ for the sake of\nthe possibility that the function is also called from another\
    \ module. This non-inlined copy is\ndied if other modules call the function. This\
    \ fragmentation of code makes\ncaching less efficient.\n\nThere are various ways\
    \ around this problem. If a function is not referenced from another\nmodule then\
    \ add the static to the function definition. This tells the compiler that\nunction\
    \ cannot be called from any other module. The static declaration makes it\nesier\
    \ for the compiler to evaluate whether it is optimal to inline the function, and\
    \ it prevents\nfrom making an unused copy of an inlined function. The static keyword\
    \ also\nmakes other optimizations possible because the compiler does not have\
