  md: 'The compilers are better at reducing integer expressions than floating point
    expressions, even though the rules of algebra are the same in both cases. This
    is because algebraic manipulations of floating point expressions may have undesired
    effects. This effect can be illustrated by the following example:


    ```

    // Example 8.18

    int a, b, c, y;

    y = a + b + c;

    ```


    According to the rules of algebra, we may write:


    ```

    y = c + b + a;

    ```


    This may be useful if the subexpression c+b can be reused elsewhere. Now consider
    the case where a is a large number b and c are large positive numbers so that
    the calculation of c+b overflows. An overflow will make the value wrap around
    and give a negative result. Fortunately, the overflow of c+b is canceled by a
    subsequent underflow when a is added. The result of a+b+c will be the same as
    c+b+a, even though the latter expression involves overflow and underflow, not
    the reason why it is safe to use algebraic manipulations on integer expressions
    (except for <, == and > operators).


    The same argument does not apply to floating point expressions. Floating point
    variables do not wrap around on overflow and underflow. The range of floating
    point variables is so large that we do not have to worry about overflow and underflow
    in special applications. But we have to worry about loss of precision. Let repeat
    the example with floating point numbers:


    ```

    // Example 8.19

    float a = -1.0E8, b = 1.23456, y;

    y = a + b + c;

    ```


    The calculation here a+b=0, and 0+1.23456 = 1.23456. But we will not get the same
    result if we change the order of the operands and add b and c first. b+c = 10000001.23456.
    The float type holds a precision of approximately seven digits, so the value of
    b+c will be rounded to 10000000. When we add a to this number we get r around
    1.23456.


    The conclusion to this is that the order of floating point operations cannot be
    changed without the risk of losing precision. The compilers will not do so unless
    you specify an option that allows less precise floating point calculations. With
    relaxed precision, the compiler will not do such reductions as 0*a=0 because this
    would be invalid if a is infinity or NAN (a number). Different compilers behave
    differently because there are different opinions on which reductions should be
    allowed and which not.


    You cannot rely on the compiler to do any algebraic reductions on floating point
    code unless you carefully specify the relevant floating point options that enable
    the reductions you will. See page 175 for a list of compiler options.


    It is safer to do algebraic reductions manually. I have tested the capacity to
    reduce various algebraic expressions on different compilers. The results are listed
    in table 8.1 below.


