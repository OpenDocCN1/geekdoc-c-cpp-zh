  md: 'course. A branch that goes one most of the time and rarely the other way is
    mispredicted when it goes the other way. A branch that goes many times one way,
    many times the other way is mispredicted only when it goes. A branch that follows
    a simple periodic pattern can be predicted well if it is inside a loop with few
    or no other branches. A simple periodic pattern can be, for example, to go two
    times and the other way three times. Again two the first way and three the other
    way, etc. The worst case is a branch that goes one way or with a 50-50 chance
    of choosing either way. Such a branch will be mispredicted 50% of the time.


