    or first in || expression. For example, that a is 50% of the time and b is true
    10% of the time. The expression a && b needs to evaluate b when a is true, which
    is 50% of the cases. The equivalent b && a needs to evaluate a only when b is
    true, which is only 10% of the time. This is if a and b take the same time to
    evaluate and are equally likely to be predicted by the branch prediction mechanism.
