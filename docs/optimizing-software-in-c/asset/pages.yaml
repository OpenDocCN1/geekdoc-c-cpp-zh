  md: "Unrolling a loop becomes a little more complicated if the number of iterations\
    \ is not divisible by the unroll factor. For example, if the number of elements\
    \ in list in example 11.2b is an odd number then we would have to add the last\
    \ element outside the loop or add an extra dummy element to list and make this\
    \ extra element zero.\n\nIt is not necessary to unroll a loop and use multiple\
    \ accumulators if there is no loop-carried dependency chain. A microprocessor\
    \ with out-of-order capabilities can overlap the iterations and start the calculation\
    \ of one iteration before the preceding iteration is finished. Example:\n\n```\n\
    // Example 11.3\nconst int size = 100;\nfloat a[size], b[size], c[size];\nregister\
    \ temp;\nfor (int i = 0; i < size; i++) {\n    temp = a[i] + b[i];\n    c[i] =\
    \ temp;\n}\n```\n\nMicroprocessors with out-of-order capabilities are very smart.\
    \ They can detect that the value of register temp in one iteration of the loop\
    \ in 11.3 is independent of the previous iteration. This allows it to begin calculating\
    \ a new value of temp before it is finished using the previous value. It does\
    \ this by assigning a new register to temp though the register in the machine\
    \ code is the same. This is called register renaming. The CPU can hold many renamed\
    \ instances of the same logical register.\n\nThis advantage comes automatically.\
    \ There is no reason to unroll the loop and have temp and temp2. Modern CPUs are\
    \ capable of renaming and doing multiple calculations in parallel if certain conditions\
    \ are satisfied. The conditions that make it possible for the CPU to overlap calculations\
    \ of loop iterations are:\n\n+   - No loop-carried dependency chain. In the calculation\
    \ of one iteration should depend on the result of the previous iteration (except\
    \ for the loop counter, which is calculated if it is an integer).\n- All intermediate\
    \ results should be saved in registers, not in memory. The renaming mechanism\
    \ works only on registers, not on variables in memory or cache. Compilers make\
    \ temp a register variable in example 11.3 even without the register keyword.\n\
    - The loop branch should be predicted. This is no problem if the repeat count\
    \ is large or constant Then the CPU can occasionally predict that the loop exits,\
    \ in fact it does not, and fail to start the next calculation. The out-of-order\
    \ execution allows the CPU to increment the loop counter ahead of time so it may\
    \ detect the misprediction before it is too late. You should not be worried about\
    \ this condition.\n\nIn general, the out-of-order execution mechanism works automatically.\
    \ However, there are a couple of things that the programmer can take maximum advantage\
    \ of out-of-order execution. The most important thing is to avoid dependency chains.\
    \ Another thing is to do different kinds of operations in order to divide the\
    \ work between the different execution units in the CPU. It can be advantageous\
    \ to mix integer and floating point calculations as long as you do not need conversions\
    \ between integers and floating point numbers. It can also be advantageous to\
    \ mix floating point addition with floating point multiplication, to mix simple\
    \ integer with vector operations, and to do mathematical calculations with memory\
    \ access.\n\nVery long dependency chains put a strain on the out-of-order resources\
    \ of the CPU, even if they do not carry into the next iteration of a loop. A modern\
    \ CPU can typically handle more"
