    \ MathLoop() {\n    const int arraysize = 1000; unsigned int dummy;\n    double\
    \ a[arraysize], c[arraysize];\n```\n\n```\n// Enable exception for floating point\
    \ overflow:\n    controlf_s(&dummy, 0, _EM_OVERFLOW);\n    //controlf_p(0, _EM_OVERFLOW);\
    \ // if above line doesn't work\n```\n\n```\nint i = 0; // Initialize loop counter\
    \ outside both loops\n    while (i < arraysize) { // The purpose of the while\
    \ loop is to resume after exceptions:\n        try {\n            // Main loop\
    \ for calculations:\n            for ( i = 0; i < arraysize; i++) {\n        \
    \        // Overflow may occur in multiplication:\n                a[i] = b[i]\
    \ * c[i];\n            }\n```\n\n```\n        // Catch floating point overflow\
    \ but no other exceptions:\n        _except (GetExecutionContext() == EXCEPTION_FLT_OVERFLOW\n\
    \            ? EXCEPTION_HANDLER : EXCEPTION_CONTINUE_SEARCH) {\n            //\
    \ Floating point overflow has occurred.\n            fsetenv(0);\n           \
    \ //controlf_s(&dummy, 0, _EM_OVERFLOW); // if above doesn't work\n```\n\n```\n\
    // Re-do the calculation in a way that avoids overflow:\n            a[i] = log(b[i])\
    \ + log(c[i]);\n\n        // Increment loop counter and go back into the for-loop:\n\
    \        i++;\n    }\n}\n```\n\nAssume that the numbers in b[i] and c[i] are so\
    \ big that overflow can occur in the multiplication b[i]*c[i], though this rarely\
    \ happens. The above code will catch an exception in case of overflow and redo\
    \ the calculation in a way that takes more time but avoids the overflow. Taking\
    \ the logarithm of each factor rather than the product makes that no overflow\
    \ can occur, but the calculation is double.\n\nThe time to make support for the\
    \ exception handling is negligible because there is no try block or function call\
    \ (other than log) in the innermost loop. log is a library function which we assume\
    \ is optimized. We cannot change its possible exception handling support anyway.\
    \ The exception is costly when it occurs, but this is not a problem since we are\
    \ assuring that its occurrence is rare.\n\nTesting for the overflow condition\
    \ inside the loop does not anything here because we are relying on the microprocessor\
    \ hardware for raising an exception in case of overflow. The exception is caught\
    \ by the operating system which redirects it to the exception handler in the program\
    \ if there is a try block."
