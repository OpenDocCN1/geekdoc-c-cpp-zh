- img_proc: true
  md: '# 2.3 Choice of operating system


    All newer microprocessors in the x86 family can run in both 16-bit, 32-bit, and
    64-bit mode.


    16-bit mode was used in the old operating systems DOS and Windows 3.x. These systems
    use segmentation of memory if the size of program or data exceeds 64 bytes. This
    quite inefficient for bigger programs. The modern microprocessors are not optimized
    for 16-bit mode and some operating systems are not backwards compatible with 16-bit
    programs. It is not recommended to make 16-bit programs, except for small embedded
    systems.


    64-bit operating systems are common today. These system are capable of running
    both 32-bit and 64-bit programs. The 64-bit systems can improve the performance
    by 5-10% for some CPU-intensive applications with many function calls and for
    applications that use large amounts of RAM memory. If the bottleneck is elsewhere,
    there is no difference in performance between 32-bit and 64-bit systems. Applications
    that use the larger address space of the 64-bit systems benefit from the larger
    address space.


    The Windows and Linux operating systems give almost identical performance for
    32-bit software because the two operating systems are using the same function
    calling conventions. Everything that is said about Linux also applies to BSD systems.


    The Intel-based Mac OS operating system is based on BSD, but the compiler uses
    position-independent code and lazy binding by default, which makes it less efficient.
    The performance can be improved by using static linking and by not using position-independent
    code (`fno-pic`).


    64-bit systems have several advantages over 32-bit systems:


    +   - The number of registers is doubled. This makes it possible to store intermediate
    data and local variables in registers rather than in memory. The number of vector
    registers in 64-bit mode is even larger if the AVX512 instruction set is enabled.

    - Function parameters are transferred in registers rather than on the stack. This
    makes function calls more efficient.

    - The size of the integer registers is extended to 64 bits. This is an advantage
    in applications that use 64-bit integers.

    - The allocation and deallocation of big memory blocks is more efficient.

    - The SSE instruction is supported on all 64-bit CPUs and operating systems.

    - The 64 bit instruction set supports self-relative addressing of data. This makes
    position-independent code more efficient.


    64-bit systems have the following disadvantages compared to 32-bit systems:


    +   - Pointers, references, and stack entries use 64 bits rather than 32 bits.
    This makes data caching less efficient.

    - Access to static or global arrays require a few extra instructions for address
    calculation in 64 bit mode if the image base is not guaranteed to be less than
    $2^{31}$.

    - Address calculation is more complicated in a large memory model where the size
    of code and data can exceed 2 Gbytes. This large memory model is hardly ever used,
    though.'
  merge: -1
  pgno: 6
- img_proc: true
  md: '+   - Some instructions are one byte longer in 64-bit mode than in 32-bit mode.


    In general, you can expect 64-bit programs to run a little faster than 32-bit
    programs if there are function calls, if there are many allocations of memory
    blocks, or if the program can take advantage of 64-bit integer calculations. It
    is necessary to use 64-bit systems if the program uses more than 2 gigabytes of
    data.


    The similarity between the operating systems disappears when running in 64-bit
    mode because the function call conventions are different. 64-bit Windows allows
    only four function parameters to be transferred in registers, whereas 64-bit Linux,
    BSD and Mac allow up to fourteen parameters to be transferred in registers (6
    and 8 floating point). There are other details that make function calling more
    efficient in 64-bit Linux than in 64-bit Windows (See page 49 and manual 5: “Calling
    conventions for different C++ compilers and operating systems”). An application
    with many function calls can run slightly faster in 64-bit Linux than in 64-bit
    Windows. The disadvantage of 64-bit Windows may be mitigated by making critical
    functions inline or static or by using a compiler that can do whole optimization.


    # 2.4 Choice of programming language


    Before a new software project, it is important to decide which programming language
    is best for the project at hand. Low-level languages are good for optimizing execution
    speed or program size, while high-level languages are good for clear and well-structured
    code and for fast development of user interfaces and interfaces to network resources,
    databases, etc.


    The efficiency of the final application depends on the way the programming language
    is implemented. The highest efficiency is obtained when the code is compiled and
    distributed as executable code. Most implementations of C++, Pascal, and Fortran
    are based on compilers.


    Other programming languages are implemented with interpretation. The program code
    is distributed as it is and interpreted line by line when it is run. Examples
    include JavaScript, PHP, ASP, and Unix shell script. Interpreted code is very
    inefficient because the body of a loop is interpreted again and again for every
    iteration of the loop.


    Some implementations use just-in-time compilation. The program code is distributed
    and stored as it is, and compiled when it is executed. An example is Perl.


    Modern programming languages use an intermediate code (byte code). The source
    code is compiled into an intermediate code, which is that to be distributed. The
    intermediate code cannot be executed as it is, but it must go through a second
    step of interpretation or compilation before it can run. Some implementations
    of Java are based on an interpreter which interprets the code by emulating the
    so-called Java virtual machine. The Java machines use just-in-time compilation
    of the most used parts of the code. C#, managed C++, and other languages in Microsoft''s
    .NET framework are based on just-in-time compilation of an intermediate code.


    The reason for using an intermediate code is that it is intended to be platform-independent
    and compact. The biggest disadvantage of using an intermediate code is that the
    user must install a large framework for interpreting or compiling the intermediate
    code. This framework typically uses more resources than the code itself.


    Another disadvantage of intermediate code is that it adds an extra level of abstraction
    which makes detailed optimization more difficult. On the other hand, a just-in-time
    compiler can optimize specifically for the CPU it is running on, while it is more
    complicated to make CPU-specific optimizations in precompiled code.'
