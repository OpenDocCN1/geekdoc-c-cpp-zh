    # 1.1 Why performance is slow


    In this situation, software developers are advised to improve the software rather
    than relying on still faster microprocessors: Avoid the most wasteful software
    tools and frameworks, and avoid feature bloat. Reducing the level of abstraction
    in software development will actually make it easier to understand the performance
    consequences of different code constructs, as explained in this manual.


    # 1.2 The costs of optimizing


    University courses in programming nowadays stress the importance of structured
    and object-oriented programming, modularity, reusability, multiple layers of abstraction,
    and systematization of the software development process. These requirements are
    often conflicting with the requirements of optimizing the software for size or
    speed.


    Today, it is not uncommon for software teachers to recommend that no function
    or method should be longer than a few lines. A few ago, the recommendation was
    the opposite: Do not put something in a separate subroutine if it is only called.
    The reasons for this shift in writing style are that software projects have become
    bigger and more complex, that there is more focus on the costs of software development,
    and that computers have become more powerful.'
  merge: -1
  pgno: 3
- img_proc: true
  md: 'The high priority of structured software development and the low priority of
    program efficiency is reflected, first and foremost, in the choice of programming
    language and interface frameworks. This is often a disadvantage for the end user
    who has to invest in ever more powerful computers to keep up with the bigger software
    packages and is still frustrated by unacceptably long response times, for even
    simple tasks.


    Sometimes, it is necessary to compromise on the advanced principles of software
    development in order to make software packages faster and smaller. This manual
    discusses how to make a sensible balance between these considerations. It is discussed
    how to identify and isolate the most critical part of a program and concentrate
    the optimization effort on that part. It is discussed how to overcome the dangers
    of a relatively primitive programming style that does not automatically check
    for array bounds violations, invalid pointers, etc. and it is discussed which
    of the advanced programming constructs are costly and which ones are cheap, in
    relation to execution time.


    # ## Choosing the optimal platform


    # ### 2.1 Choice of hardware platform


    The choice of hardware platform has become less important than it used to be.
    The distinctions between RISC and CISC processors, between PC''s and mainframes,
    and between simple processors and vector processors are becoming increasingly
    blurred by the standard PC processors with CISC instruction sets that have RISC
    cores, vector processing instructions, multiple cores, and a processing speed
    exceeding that of yesterday''s big mainframe processors.


    Today, the choice of a hardware platform for a given task is often determined
    by considerations such as price, compatibility, second source, and the availability
    of development tools, rather than by the processing power. Connecting standard
    PC''s in a network may be both cheaper and more efficient than investing in a
    big mainframe. Superscomputers with massively vector processing capabilities have
    a niche in scientific computing, but for most purposes the standard PC processors
    are preferred because of their performance/price ratio.


    The CISC instruction (x86) of the standard PC processors is not optimal a technical
    point of view. This instruction set is maintained for the sake of backwards compatibility
    with a line of software that dates back to around 1980 where RAM memory and disk
    space were scarce resources. However, the CISC instruction set is better than
    in the reputation. The compactness of the code makes caching much more efficient
    today where cache size is a limited resource. The CISC instruction set may actually
    be better than RISC in situations where code is critical. A further advantage
    of the CISC instruction set is that it needs fewer instructions to do the same
    job. A serious problem has been alleviated by 64-bit extension to the x86 instruction
    set where the number of general purpose registers has been doubled, and the number
    of vector registers has been quadrupled with the AVX512 instruction extension.


    Thin clients depend on network resources are not recommended for critical applications
    because the response time for network resources cannot be controlled.


    Small hand-held devices are becoming more popular and used for an increasing number
    of purposes such as an increasing number of devices and browsing which previously
    required a PC. Similarly, we are seeing an increasing number of devices with embedded
    microcontrollers. I am not making any specific recommendation about which platforms
    and operating systems are most efficient for such applications, but it is important
    to realize that such devices'
