    plus a constant index multiplied by a factor of 1, 2, 4 or 8, but not any other
    factor. If a and b in 8.16 were float instead of double, sizeof(S) would be 8
    and no induction variable would be needed because the CPU hardware support for
    multiplying the index by 8.


    Comilers will rarely make induction variables for floating point expressions or
    more complex integer expressions because this generates a loop-carried dependency
    chain that may limit the overall performance. See page 83 for an example of how
    to use floating point variables for calculating a polynomial.


    # Scheduling


    A compiler may reorder instructions for the sake of parallel execution. Example:


    ```

    // Example 8.17

    float a, b, c, d, e, f, y;

    x = a + b + c;

    y = d + e + f;

    ```


    The compiler may interleave the two formulas in this example so that a+b is calculated
    first, then d+e, f is added to the first sum to the second sum, then the first
    result is stored in x, and the last result is stored in y. The purpose of this
    is to help the CPU doing multiple calculations in parallel. Modern CPUs are actually
    able to reorder instructions without help of the compiler (see page 113), but
    the compiler can make this reordering easier for the CPU.


    # Algebraic reductions


    Most compilers can reduce simple algebraic expressions using the fundamental laws
    of algebra. For example, a compiler may change the expression -(a) to a.


    I do not think that programmers write expressions like -(a) very, but such expressions
    may occur as a result of other optimizations such as inlining. Reducible expressions
    also occur often as a result of macro expansions. For example, a programmer may
    prefer to use !(a || b) instead of the equivalent !(!a && !b) because the latter
    has one less operator. Fortunately, all compilers are able to do the reduction
    in case


    You cannot expect a compiler to reduce algebraic expressions. For example, not
    all compilers can reduce (a+b)*(c+b) to a*c+b*2. It is difficult to implement
    the many rules of algebra in a compiler. Some compilers can reduce other types
    of expressions but no compiler I have ever seen reduce them all. In the case of
    Boolean algebra, it is possible to implement a universal algorithm (e.g. Quine-McClorsky
    or Espresso) that can reduce any expression, but none of the compilers I have
    tested seemed to do so.'
