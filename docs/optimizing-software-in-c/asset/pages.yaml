  md: 'It is good to do a thorough analysis of the data structure, data flow and algorithms
    in the planning phase to predict which resources are most critical. However, there
    may be so many factors in the early planning stage that a detailed overview of
    the problem cannot easily be obtained. In complicated cases, a full understanding
    comes at a late stage in the development process. In this case, you may view the
    software development as a learning process where the main feedback comes from
    testing and from programming problems. Here, you should be prepared for several
    iterations of redesign in case you discover that a program structure is more efficient
    or more manageable.


    Some software development models have a strict formalism that requires several
    layers of abstraction in the logical architecture of the software. You should
    be aware that there are inherent performance costs to such a formalism. The splitting
    of software into an excessive number of layers of abstraction is a common cause
    of reduced performance.


    Since most development methods are incremental or iterative in nature, it is important
    to have a strategy for saving a backup copy of every intermediate version. For
    one-man projects, it is sufficient to make a zip file of every version. For team
    projects, it is recommended to use a version control tool.


    # 7 The efficiency of different C++ constructs


    Most programmers have little or no idea how a piece of program code is translated
    into machine code and how the microprocessor handles this case. For example, many
    programmers do not know that double precision calculations are as fast as single
    precision. And who would know that a template class is more efficient than a polymorphic
    class?


    This chapter is aiming at explaining the relative efficiency of different C++
    language elements in order to help the programmer choosing the most efficient
    alternative. The theoretical background is further explained in the volumes of
    this series of manuals.


    # 7.1 Kinds of variable storage


    Variables and objects are stored in different parts of the memory, depending on
    how they are declared in a C++ program. This has influence on the efficiency of
    the data cache (see page 91). Data caching is poor if data are scattered randomly
    in the memory. It is therefore important to understand how variables are stored.
    The storage principles are the same for simple variables, arrays, and objects.


    # On the stack


    Variables and objects declared inside a function are stored on the stack, except
    for the cases declared in the sections below.


    The stack is a part of memory that is organized in a first-in-last-out fashion.
    It is used for storing return addresses (i.e. where the function was called from),
    local variables, and for saving registers that have to be restored before the
    function returns. Every time a function is called, it allocates the required amount
    of space on the stack for all these purposes. This memory space is free when the
    function returns. The next time a function is called, it can use the same space
    for the parameters of the new function.


    The stack is the most efficient memory space to store data in because because
    the same range of memory addresses is reused again and again. It is almost certain
    that this part of the memory is mirrored in the level-1 data cache if there are
    no big arrays.'
