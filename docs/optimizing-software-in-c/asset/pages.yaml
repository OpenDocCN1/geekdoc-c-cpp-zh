    }\n```\n\nThe function F1 is supposed to call the destructor of the object x when\
    \ it returns. But if an exception occurs somewhere in F1? Then we are breaking\
    \ out of F1 without returning. F1 is prevented from cleaning up itself because\
    \ it has been interrupted. Now it is the responsibility of the exception handler\
    \ to call the destructor of x or any other cleanup that may be necessary. This\
    \ is only possible if F1 has saved all information about the destructor to call.\
    \ If F1 calls another function in turn calls another function, etc., and if an\
    \ exception occurs in the innermost function, then the exception handler needs\
    \ all information along the chain of function calls and it needs to follow the\
    \ track backwards through the chain of calls to check for all the necessary cleanup\
    \ jobs.\n\nAll functions have to save information for the exception handler, even\
    \ if no exception happens. In some compilers if exception handling is not necessary\
    \ for your application then you should disable it to make the code simpler and\
    \ more efficient. You can disable exception for the whole program by turning off\
    \ the exception option in the compiler. You can disable handling for a single\
    \ function by adding throw() to the function prototype:\n\n```\nvoid F1() throw();\n\
    ```\n\nThis allows the compiler to assure that F1 will never throw any exception\
    \ that it does not have to recover information for F1. However, if F1 calls another\
    \ function F2 that can possibly throw an exception then F1 has to check for exceptions\
    \ thrown by F2 and call the std::unexpected() function in case F2 actually throws\
    \ an exception. Therefore, you should apply every throw() specification to F1\
    \ only if all functions called by F1 also have an empty throw() specification.\
    \ Every throw() specification is useful for library functions.\n\nThe compiler\
    \ makes a distinction between leaf functions and frame functions. A frame function\
    \ is a function that calls at least one other function. A leaf function is a function\
    \ that does not call any other function. A leaf function is simpler than a frame\
    \ function because the stack unwinding information can be left out or if there\
    \ is nothing to clean up in case of an exception. A frame function can be turned\
    \ into a leaf function by inlining all the functions that it calls. The best performance\
    \ is obtained if the critical innermost loop of a program contains no calls to\
    \ frame functions.\n\nAn empty throw() statement can improve optimizations in\
    \ some cases, there is no need to add statements to match that throw(A,B,C) to\
    \ explicitly what kind of exceptions a function can throw. In fact, the compiler\
    \ may actually add extra code to show that thrown exceptions are indeed of the\
    \ specified types (see Sutter: A Pragmatic Look At Exception Specifications, Dr\
    \ Dobbs Journal, 2002).\n\nIn some cases, it is optimal to use exception handling\
    \ even in the most critical part of a program. This is if alternative implementations\
    \ are less efficient and you want to be able to recover from errors. The following\
    \ example illustrates such a case:"
