    # Signed unsigned integers


    In most cases, there is no difference in speed between using signed and unsigned
    integers. But there are few cases where it matters:


    +   - Division by count: Unsigned is faster when you divide an integer with a
    constant (see page 150). This also applies to the modulo operator %.

    - Conversion to floating point is faster than signed when using unsigned integers
    for most instruction sets.

    - Overflow behaves differently on signed and unsigned variables. An overflow of
    an unsigned variable produces a low positive result. An overflow of a signed variable
    is officially defined. The normal behavior is wrap-around of positive to a negative
    value, but the compiler may optimize branches that depend on overflow based on
    the assumption that overflow does not occur.


    The conversion between signed and unsigned integers is costly. It is simply a
    matter of interpreting the bits differently. A negative integer will be interpreted
    as a very large positive number when converted to unsigned.


    ```

