- img_proc: true
  md: 'The programming languages and their implementations reveal a zigzag course
    that reflects the conflicting considerations of efficiency, platform independence,
    and easy development. For example, the first PC''s had an interpreter for Basic.
    A compiler for Basic soon became available because the interpreted version of
    Basic was too slow. Today, the most popular version of Basic is Visual Basic .NET,
    which is implemented with an intermediate code and just-in-time compilation. Some
    early implementations of Pascal used an intermediate code like the one that is
    used for Java today. But this gained gained popularity when a genuine compiler
    became available.


    It should be clear from this discussion that the choice of programming language
    is a compromise between efficiency, portability, and development time. Interpre
    languages are out of the question when efficiency is important. A language based
    on intermediate code and just-in-time compilation may be a viable compromise when
    portability and ease of development are more important than speed. These languages
    such as C#, Visual Basic .NET and the best implementations. However, these languages
    have the disadvantage of a large runtime framework that must be loaded every time
    the program runs. The time it takes to load the framework and compile the program
    are often more than the time it takes to execute the program. The framework may
    require more resources than the program itself when running. Using such a framework
    sometimes has unacceptably long response times for simple tasks like pressing
    a button or moving the mouse. The .NET framework should be avoided when speed
    is critical.


    The fastest execution is doubt without a fully compiled code. Compiled languages
    C++, D+, Pascal, Fortran and several other well-known languages. My preference
    is for C++ for reasons. C++ is supported by some very good compilers and optimized
    function libraries. C++ is an advanced high-level language with a wealth of advanced
    features found in other languages. But the C++ language also includes the low-level
    C as a subset, giving access to low-level optimizes. Most C++ compilers are able
    to generate an assembly language output, which is useful for checking how well
    the compiler optimizes the code, most C++ compilers allow assembly-intrinsic functions,
    inline assembly, or linking to assembly language modules when the highest level
    of optimization is needed. The C++ language is portable in the sense that C++
    compilers exist for all platforms. Pascal has many of the advantages of C++ but
    is not versatile. Fortran is also quite efficient, but the syntax is very-fashioned.


    Development in C++ is efficient thanks to the availability of powerful tools.
    One powerful development tool is Microsoft Visual Studio. This tool can make two
    different implementations of C++, directly compiled code for the common language
    runtime of the .NET framework. Obviously, the directly compiled version is preferred
    when speed is important.


    An important disadvantage of C++ relates to security. There are no checks for
    array bounds violation, integer overflow, and invalid pointers. The absence of
    such checks makes the code execute faster than other languages but that is the
    responsibility of the programmer to make explicit checks for errors in cases where
    they cannot be ruled out by the program logic. Some guidelines are provided below,
    on page 14.


    C++ is definitely the preferred programming language when the optimization of
    performance has high priority. The gain in performance over other programming
    languages can be quite substantial. This gain in performance can easily justify
    a minor increase in development when time is important to the end user.


    There may be situations where a high level framework based on intermediate code
    is needed for other reasons, but part of the code still careful optimization.
    A mixed implementation can be a viable solution in such cases. The most critical
    part of the code'
