    ```


    In example 7.4 we are converting a to unsigned in order to make the division faster.
    For course, this works only if it is certain that a will never be negative. The
    last line is implicitly converting a to double before multiplying with the constant
    2.5, which is double. Here we prefer a to be signed.


    Be not to mix signed and unsigned integers in comparisons, such as < The result
    of comparing signed with unsigned integers is ambiguous and may produce undesired
    results.


