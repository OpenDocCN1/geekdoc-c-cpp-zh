    The highest performance that can possibly be obtained in a computationally intensive
    program is achieved when none of the time-consumers mentioned in the above sections
    are dominating and there are no dependency chains. In this case, the performance
    is limited by the throughput of the execution units rather than by the latency
    or memory access.


    The execution core of modern microprocessors is split between several execution
    units. Typically, there are two or more floating point units, or one floating
    point multiplication units. This means that it is possible to do an integer addition,
    a floating point addition, and a floating point multiplication at the same time.


    A code that does floating point calculations should preferably have a balanced
    mix of additions and multiplications. Subtractions use the same unit as additions.
    Divisions take longer. It is possible to do integer operations-between floating
    point operations without reducing the performance because the integer operations
    use different execution units. For example, a loop that does floating point calculations
    will typically use integer operations for incrementing a loop counter, comparing
    the loop with its limit, etc. In most cases, you can assume that these integer
    operations do not add to the total computation time.


    # 4 Performance and usability


    A better performing software product is one that saves time for the user. Time
    is a precious resource for many users and much time is wasted on software that
    is slow, difficult to use, incompatible, or error prone. All these problems are
    usability issues, and I believe that software performance should be seen in the
    broader perspective of usability.


    This is not a manual on usability, but I think it is necessary to draw the attention
    of software programmers to some the most common obstacles to efficient use of
    software. For this topic, see my free E-Book Usability for Nerds at Wikbooks.


    The following list points out some typical sources of runtime and waste of time
    for software users as well as important problems that software developers should
    be aware of.


    +   - Big runtime frameworks. The .NET framework and the Java virtual machine
    are frameworks that typically take more resources than the programs they are running.
    Such frameworks are frequent sources of resource problems and problems they waste
    a lot of time during installation of the framework itself, during installation
    of the program that runs during the frequent updates, during start of the program,
    and while the program is running. The main reason why runtime frameworks are used
    at all is for the sake of cross-platform portability. Unfortunately, the cross-platform
    compatibility is not always as as expected. I believe that the portability could
    be achieved more efficiently by better standardization of programming languages,
    operating systems, and API''s.


