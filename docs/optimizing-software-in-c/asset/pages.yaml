  md: '# 12.1 AVX instruction set YMM registers


    The 128-bit XMM registers are extended to 256-bit registers named YMM in the AVX
    instruction set. The main advantage of the AVX instruction set is that it allows
    larger floating point vectors. There are other advantages that may improve the
    performance somewhat. The AVX2 instruction set also allows 256-bit integer vectors.


    Code that is compiled for the AVX instruction can run only if the CPU and the
    operating system. Old operating systems without support for AVX are rarely in
    use, so this is not a problem. The AVX instruction is supported in the latest
    compilers from Microsoft, Intel, GNU and Clang.


    There is a problem with mixing code with and without AVX support on Intel processors.
    There is a performance penalty when going from AVX code to non-AVX code because
    of a change in the YMM register state. This penalty should be avoided by calling
    the intrinsic function `mm256_zeroupper()` before any transition from AVX code
    to non-AVX code. This can in the following cases:


    +   - If a program is compiled with AVX and another part of the program is compiled
    without AVX support then call `mm256_zeroupper()` before leaving the AVX part.

    - If a function is compiled in multiple versions with and without AVX using CPU
    dispatching then call `mm256_zeroupper()` before leaving the AVX part.

    - If a piece of code compiled with AVX support calls a function in a library other
    than the library that contains the compiler, and the library has no AVX support,
    then call `mm256_zeroupper()` before calling the library function.


    The compiler may not insert `mm256_zeroupper()` automatically. The assembly output
    from the compiler will tell what it will do.


    # 12.2 AVX512 instruction set and ZMM registers


    The 256-bit YMM registers are extended to 512-bit registers named ZMM in the AVX512
    instruction set. The number of vector registers is extended from 16 to 32 in 64-bit
    mode. There are only 8 vector registers in 32-bit mode. Therefore, AVX512 code
    should be compiled for 64-bit mode.


    The AVX512 instruction set also adds a set of mask registers. These are used as
    Boolean vectors. Almost every vector instruction can be masked with a mask register
    so that vector element is calculated only if the corresponding bit in the mask
    register is 1. This makes vectorization of code with branches more efficient.


    There are many additional extensions to AVX512. All processors with AVX512 have
    some of these extensions, but no processor has them all. Some of the known and
    extensions to AVX512 are:


    +   - AVX512F. Foundation. All AVX512 processors have this. Operations on 32-bit
    and 64-bit integers, float and double in 512-bit vectors, including masked operations.

    - AVX512VL. Includes the same operations on 128-bit and 256-bit integers, including
    masked operations and 32 vector registers.

    - AVX512BW. Operations on 8-bit and 16-bit integers in 512-bit vectors.

    - AVX512DQ. Multiplication and convolution instructions with 64-bit integers.
    Various operations on float and double.

    - AVX512ER. Fast reciprocal, reciprocal square root, and exponential function.
    Precise on float; approximate on double. Only available on few processors.'
