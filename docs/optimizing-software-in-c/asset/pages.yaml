    The operands of the Boolean operands && and || are evaluated in the following
    way. If the first operand of && is false, then the second operand is not evaluated
    at all because the result is known to be false regardless of the value of the
    second operand. Likewise, if the first operand of || is true, then the second
    operand is not evaluated, because the result is known to be true.


