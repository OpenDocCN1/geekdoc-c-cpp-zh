    # 16.3 Worst-case testing


    Most performance tests are done under the worst-case conditions. All disturbing
    influences are removed, all resources are sufficient, and the caching handlers
    are optimal. Best-case testing is useful because it gives more reliable and reproducible
    results. If you want to compare the performance of two different implementations
    of the same algorithm, then you need to remove all disturbing influences in order
    to make the measurements as accurate and reproducible


    However, there are cases where it is more relevant to test the performance under
    the worst-case conditions. For example, if you want to make sure that the response
    time to user never exceeds an acceptable limit, then you should test the response
    time under worst-case conditions.


    Programs that produce streaming audio or video should also be tested under worst-case
    conditions in order to make sure that they keep up with the expected real-time
    speed. Delays or glitches in the output are unacceptable.


    Each of the following methods could possibly be relevant when testing worst-case
    performance:


    +   - The first time you activate a particular part of the program, it is likely
    to be slower than the subsequent times because of lazy loading of the code, cache
    misses, and branch mispredictions.


    +   - Test the whole software package, including all runtime libraries and frameworks,
    rather than isolating a single function. Switch between different parts of the
    software package in order to increase the likelihood that certain parts of the
    program code are uncached or ever swapped to disk.


    +   - Software that relies on network resources and servers should be tested on
    a network with heavy traffic and a server in full use rather than a dedicated
    server.


    +   - Use large data files and databases with lots of data.


    +   - Use an old computer with a slow CPU. An insufficient amount of RAM, a lot
    of irrelevant software installed, a lot of background processes running, and a
    slow and fragmented hard disk.


    +   - Test with different brands of CPUs, different types of graphics cards, etc.


