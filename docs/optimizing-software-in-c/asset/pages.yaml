    whether to repeat or exit the loop. The loop-branch is usually predicted well
    if the repeat count is small and always the same. The maximum loop count can be
    predicted perfectly varies between 9 and 64, depending on the processor. On many
    processors, a loop that contains several branches will be not predicted well.


    A switch statement is a kind of branch that can go more than two ways. Switch
    statements are most efficient if the case labels follow a sequence where each
    label is equal to the preceding label plus one, because it can be implemented
    as a table of jump targets. A switch statement with many labels that have values
    far from each other is inefficient because the compiler must convert it to a branch
