  md: '# 12.5 Using vector classes


    Programming with intrinsic functions in the way of example 12.4b, c and d is quite
    tedious indeed. It is possible to write the same in a more clear and intelligible
    way by wrapping the vectors into C++ classes and using overloaded operators for
    things like adding vectors. The operators are inline so the resulting machine
    code becomes the same as if you had intrinsic functions. It is just easier to
    write $a + b$ than to write _mm512_add_epil6(a,b).


    The advantages of vectorize part of the code to vectorize, and how


    +   * You can specify explicitly part of the code to vectorize

    * You can overcome the obstacles to automatic vectorization listed on page 119

    * The code often becomes simpler than the compiler would with automatic vectorization
    because the compiler has to take care of special cases that may not be relevant
    in your case

    * The code is simpler and more readable than assembly code or intrinsic functions,
    yet equally efficient


    Various libraries of predefined vector classes are currently available, including
    one from Intel and one from me. My vector class library (VCL) has many features,
    see https://github.com/vectorclass. The Intel vector class library has few features
    and is rarely updated.


    | Vector class library | Intel | VCL (Agner) |

    |---|---|--|

    | Available from | Intel and Microsoft C++ compilers | https://github.com/vectorclass
    |

    | Include file | dvech.h | vectorclass.h |

    | Supported compilers | Intel, Microsoft, Mac | Intel, Microsoft, Gnu, Clang |

    | Supported operating systems | Windows, Linux, Mac | Windows, Linux, Mac, BSD
    |

    | Instruction set control | no | yes |

    | License | license included in compiler price | Apache 2.0 |


    Table 12.2. Vector class libraries


    The following table lists the available vector classes. Including the appropriate
    header file will give you access to all of these classes.'
