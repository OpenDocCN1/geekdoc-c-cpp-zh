  md: '+   • Locked mutexes.


    +   • Open database connections.


    +   • Open files and network connections.


    +   • Temporary files that need to be deleted.


    +   • User work that needs to be saved.


    +   • Any other allocated resource.


    The C++ handling of cleanup jobs is to make a destructor. A function that reads
    and writes a file can be wrapped in a class with a destructor that makes sure
    the file is closed. The same method can be used for any other resource, such as
    dynamically allocated memory, windows, mutexes, database connections, etc.


    The C++ exception handling system makes that all destructors for local objects
    are called. The program is exception safe if there are wrapper classes with destructors
    to take care of all cleanup of allocated resources. The system is likely to fail
    if the destructor causes another exception.


    If you make your error handling system instead of exception handling then you
    cannot be sure that destructors are called and resources cleaned up. If an error
    handler calls `exit()`, `abort()`, `endthread()`, then there is no guarantee that
    all destructors are called. The safe way is to handle an unrecoverable error without
    using exceptions is to return from the function. The function may return an error
    code if possible, or the error code may be stored in a global object. The calling
    function must check for the error code. If the latter function also has something
    to clean up then it must return the error to its caller, and so on.


    # 7.33 Other cases of stack unwinding


    The preceding paragraph described a mechanism called stack unwinding that is used
    by exception handlers for cleaning up and calling any necessary destructors after
    jumping out of a function in an exception using the normal return route. This
    mechanism is also used in two situations:


    The stack unwinding may be used when a thread is terminated. The purpose is to
    detect if any objects declared in the thread have a destructor that needs to be
    called. It is recommended to return from functions that require cleanup before
    terminating the thread. You need not to be certain that all `~endthread()` cleans
    up the stack. This behaviour is implementation dependent.


    The stack unwinding is also used when the function `longjmp` is used for jumping
    out of a function. Avoid the use of `longjmp`. Do not rely on `longjmp` in time-critical
    code.


    # 7.34 Propagation of NAN and INF


    Floating point errors will propagate to the end result of a series of calculations
    in most. This is a very effective alternative to exceptions and fault trapping.


    Floating overflow and division by zero gives infinity. If you add or multiply
    infinity with something get infinity as a result. The INF code may propagate to
    the end result in this way. However, not all operations with INF input will give
    INF as a result. If you divide a normal number by INF you get zero. The special
    cases INF-INF and INF/INF give NAN (not-'
