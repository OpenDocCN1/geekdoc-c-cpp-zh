  md: 'a-number). The special code NAN also occurs when you divide zero by zero and
    when the input of function is out of range, such as sqrt(-1) and log(-1).


    Most operations with a NAN input will give a NAN output, so that the NAN will
    propagate to the end result. This is simple and efficient way of detecting floating
    point errors. Almost all floating points will propagate to the end result they
    appear as INF or NAN. If you print the results, you will see INF or NAN instead
    of a number. No extra code is needed to keep track of the errors, and there is
    no extra cost to the propagation of INF and NAN.


    A NAN can contain a payload with extra information. A function library can put
    an error code into this payload in case of error, and this payload will propagate
    to the end result.


    The function finite() will return false when the parameter is INF or NAN, and
    true if it is a normal floating point number. This can be used for detecting errors
    before a floating point is converted to an integer and in other cases where we
    want to check for.


    The details of INF and NAN propagation are further explained in the document "NAN
    propagation versus trapping in floating point code" www.agner.org/optimize/nan_propagation.pdf.
    This document also discusses situations where the propagation of INF and NAN fails,
    as well as compiler optimization options that influence the propagation of these
    codes.


    # 7.35 Preprocessing directives


    Preprocessing directives (everything that begins with #) are costly in terms of
    program because they execute before the program is compiled:


    ```

    #if directives are useful for supporting multiple platforms or multiple configurations
    with the same source code. #if is more efficient than #if because #if is resolved
    at compile time while it is resolved at runtime.

    ```


    ```

    #define directives are equivalent to const definitions when used for defining
    constants. For example, #define ABC const int ABC = 123; are equally efficient
    because most, an optimizing compiler can replace an integer constant with its
    value. However, the const declaration in some cases takes memory space where a
    #define never takes memory space. A floating point constant always takes space,
    even when it has not been given a name.

    ```


    ```

    #define used as macros are sometimes more efficient than functions. See page 48
    for a discussion.

    ```


    # 7.36 Namespaces


    There is no cost in execution speed to using namespaces.


    # 8 Optimizations in the compiler


    # 8.1 How compilers optimize


    Modern compilers can do a lot of modifications to the code in order to improve
    performance. It is useful for the programmer to know what the compiler can do
    and what it cannot do. The following sections describe some of the compiler optimizations
    that it is relevant for the programmer to know about.'
