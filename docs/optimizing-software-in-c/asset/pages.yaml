  md: '# Floating point precision conversion


    Conversions between float, double and long double take extra time when the floating
    point register stack is used. It takes between 2 and 15 clock cycles (depending
    on the processor) when the XMM registers are used. See page 31 for an explanation
    of register stack versus XMM registers. Example:


    ```

    // Example 7.24

    float a; double b;

    a += b;

    ```


    In this example, the conversion is costly if XMM registers are used. a and b should
    be of the same type to avoid this. See page 153 for further discussion.


    # Integer to float conversion


    Conversion of a signed type to a float or double takes 4 - 16 clock cycles, depending
    on the processor and the type of registers used. Conversion of unsigned integers
    takes longer than signed integers unless the AVX512 instruction set is enabled
    (AVX512DQ for 64 bit unsigned integers). It is faster to convert the unsigned
    integer to a signed integer if there is no risk of overflow:


    ```

    // Example 7.25

    unsigned int u; double d;

    d = (double)(signed int)u; // Faster, but risk of overflow

    ```


    Integer to float conversions can be avoided by replacing an integer variable by
    a float example.


    ```

    // Example 7.26a

    float a[100]; int i;

    for (i = 0; i < 100; i++) a[i] = 2 * i;

    ```


    The conversion of i to float in this example can be avoided by making an additional
    floating point variable:


    ```

    // Example 7.26b

    float a[100]; int i; float i2;

    for (i = 0, i < 100; i++) i2 += 2.0f; a[i] = i2;

    ```


    # Float to integer conversion


    Conversion of a floating number to an integer takes a very long time unless the
    SSE2 or later instruction set is enabled. Typically, the conversion takes 50-100
    clock cycles. The reason is that the C/C++ standard specifies truncation unless
    the floating point rounding mode has been changed to truncation and back again.


    If there are floating-to-integer conversions in the critical part of a code then
    it is important to do something about it. Possible solutions are:


    +   Avoid the conversions by using different types of variables.


    Move the conversions out of the innermost loop by storing intermediate results
    as floating point.


    Use 64-bit mode or enable the SSE2 instruction set (requires a microprocessor
    that supports this).


    Use rounding instead of truncation and make a round function using assembly language.
    See page 154 for details about rounding.'
