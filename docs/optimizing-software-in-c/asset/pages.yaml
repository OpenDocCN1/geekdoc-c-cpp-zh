    Interrupt service routines and device drivers are particularly critical because
    they can block the execution of everything else. This normally belongs to the
    area of system programming, but in applications without an operating system this
    is the job of the application programmer. There is a higher risk that the programmer
    forgets that the system code is critical when there is no operating system, and
    therefore the system code is not separated from the application code. An interrupt
    service routine should do as little as possible. Typically it should save one
    unit of received data in a static buffer or send data from a buffer. It should
    never respond to a command or do other input/output than the specific event it
    is servicing. A command received by an interrupt should preferably be responded
    to at a lower priority level, typically in a message loop in the main program.
    See page 162 for further discussion of system code.


    In this chapter, I have described some of the considerations that are particularly
    important on small devices with limited resources. Most of the advice in the rest
    of the present manual is also relevant to small devices, but there are some differences
    due to the design of small microcontrollers:


    +   - Smaller microcontrollers have no branch prediction (see p. 43). There is
    no need to take branch prediction into account in the software.


    +   - Smaller microcontrollers have no cache (see p. 91). There is no need to
    organize data to optimize caching.


    +   - Smaller microcontrollers have no out-of-order execution. There is no need
    to break down dependency chains (see p. 21).'
