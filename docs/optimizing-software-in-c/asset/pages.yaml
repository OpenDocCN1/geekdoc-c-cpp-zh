  md: "The vector library VCL includes many features such as vector permutation and\
    \ mathematical functions. It also includes add-on packages for various purposes.\
    \ See the GitHub Site for details.\n\n# CPU dispatching with vector classes\n\n\
    The VCL class library makes it possible to compile for different instruction sets\
    \ from the same source code. It has preprocessing directives that select the best\
    \ implementation for a given instruction set.\n\nThe following example shows how\
    \ to make the SelectAddMul example (12.ae) with automatic CPU dispatching. The\
    \ code in this example should be compiled four times, for SSE2 instruction set,\
    \ for SSE4.1, for AVX2, and for AVX512BW. All minimum instruction set for the\
    \ vector class library, SSE4.1 gives an advantage in the select function, the\
    \ AVX2 instruction set gives the advantage of bigger vector registers, and AVX512\
    \ still better vectors and more efficient branching.\n\nThe vector class library\
    \ will use 512-bit vector registers, or two 256-bit vector registers, or four\
    \ 128-bit vector registers, depending on the instruction.\n\nThe preprocessor\
    \ macro INSTRUCT is used for giving a different name for each instruction set.\
    \ A CPU dispatcher sets a pointer to the best possible version the first time\
    \ the function is called. See the vectorclass manual for details.\n\n```\n// Example\
    \ 12.6. Vector code with automatic CPU dispatching\n#include \"vectorclass.h\"\
    \ // vector class library\n#include <stdio.h> // printf\n\n// function type FuncType\n\
    typef void FuncType(short int aa[], short int bb[], short int cc[]);\\n// function\
    \ prototypes for each version\nFuncType SelectAddMul, SelectAddMul_SSE2, SelectAddMul_SSE41,\n\
    SelectAddMul_AVX2, SelectAddMul_AVX512BW, SelectAddMul_dispatch;\n// Define function\
    \ name depending on instruction set\n#ifdef INSTRUCT_ // SSE2\n#define SelectAddMul_SSE2\n\
    #elif INSTRUCT_ == 5 // SSE4.1\n#define SelectAddMul_SSE41\n#elif INSTRUCT_ ==\
    \ 8 // AVX2\n#define SelectAddMul_AVX2\n#elif INSTRUCT_ == 10 // AVX512BW\n#define\
    \ SelectAddMul_AVX512BW\n#endif\n\n// specific version of the function. Compile\
    \ once for each version\nvoid FUNCNAME(short int aa[], short int bb[], short int\
    \ cc[]) {\nVec32s a, b, c; // biggest possible vector objects\n// Roll out by\
    \ 32 to fit the biggest vectors:\nfor (int i = 0; i < 256; i += 32) {\n\tb.load(bb[i]);\n\
    \tc.load(cc[i]);\n\ta.store(b > 0, c + 2, b * c);\n\ta.store(aa[i++]);\n}\n}\n\
    #if INSTRUCT_ == 2\n// make dispatcher in only the lowest of the compiled versions\n\
    #include \"instrut_detect.cpp\" // instrut_detect function\n```"
