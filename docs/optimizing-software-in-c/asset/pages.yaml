  md: '# 13.5 Implementation


    The CPU dispatch mechanism can be implemented in different places making the dispatch
    decision at different times:


    +   - Dispatch on every call. A branch tree or switch statement leads to the appropriate
    version of the critical function. The branching is done every the critical function
    is called. It has the disadvantage that branching takes times.

    - Dispatch on first call. The function is called through a function pointer which
    initially points to the dispatcher. The dispatcher changes the function pointer
    and makes it point to the right version of the function. This has the advantage
    that it does not spend time on deciding which version to use in case the function
    is never called. This method is illustrated in example 13.1.

    - Make pointer at initialization. The program or library has an initialization
    routine that is called before the first call to the critical function. The initialization
    routine sets a pointer to the right version of the function. This has the advantage
    that the response time is consistent for the function.

    - Load library at initialization. Each code version is implemented in a separate
    dynamic library (*.dll or *.). The program has an initialization routine that
    loads the appropriate version of the library. This method is useful if the library
    is large or if different versions are be compiled with different compilers.

    - Dispatch at load time. The program uses a procedure linking table (PLT) that
    is initialized when the program is loaded. This method requires OS support and
    is available in newer versions of Linux and perhaps Mac OS. See page 142.

    - Dispatch at installation time. Each code version is implemented in a separate
    dynamic library (*.dll or *.). The installation program makes a symbolic link
    to the appropriate version of the library. The application loads the library through
    the symbolic link.

    - Use different executables. This method can be used if instruction sets are mutually
    incompatible. You may make separate executables for 32-bit and 64-bit systems.
    The appropriate version of the program may be selected during the installation
    process or by an executable stub.


    If different versions of the critical code are compiled with different compilers
    then it is recommended to specify static linking for any library functions called
    by the critical code so do not have to distribute all the dynamic libraries (*.dll
    or *) that belong to each compiler with the application.


    The availability of various instruction sets can be determined with system calls
    (e.g. IsProcessorFeaturePresent in Windows). Alternatively, you may use the CPUID
    instruction directly, or use the InstructionSet() or the instrset_detect() from
    the library


