    > Table 12.1. Vector sizes available in different instruction set extensions


    For, a 128-bit MMX register can be organized as a vector of 16-bit integers or
    four float''s in the SSE instruction set is available. The older MMX registers,
    which are 64 bits wide, should be avoided because they cannot with x87 style point
    code.


    The 128-bit MMX vectors must be aligned by 16, i.e. for an instruction set later
    than AVX (below). The 256-bit YMM vectors are preferably aligned by 32 and the
    512-bit ZMM registers by 64, but the alignment requirements are less strict when
    conflicting with the AVX and later instruction sets.


    Vector operations are particularly fast on newer processors. Many processors can
    calculate a vector just as fast as a Scalar (means a single element). The first
    generation of processors that support a vector set sometimes has execution units,
    memory ports, of only half the size of the vector length.


    The use of vector operations is more advantageous the smaller the data elements
    are. For example, if you get sixteen float additions in the same time that it
    takes to do additions with double''s. It is almost always advantageous to use
    vector operations on contemporary CPUs if the data fit into the vector registers.'
