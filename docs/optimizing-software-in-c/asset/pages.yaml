  md: 'particular memory address cannot be loaded into an arbitrary cache line. Only
    one of the 32 sets is used, but any of the 4 lines in the set can be used. We
    can calculate such cache lines for a particular memory address by the formula:
    *set* = (memory address) / (number of sets). Here, / means division with truncation,
    and % means modulo. For example, if we want to read from memory address a = 10000,
    then we have *set* = (10000/32) % 32. This means that a must be read into one
