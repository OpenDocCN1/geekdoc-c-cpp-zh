    It is important to weigh the advantages against the disadvantages when deciding
    whether to use dynamic memory allocation. There is no reason to use dynamic memory
    allocation when the size of an array or the number of objects is known at compile
    time or a reasonable upper limit can be defined.


    The cost of dynamic memory allocation is negligible when the number of allocations
    is limited. Dynamic memory allocation can therefore be advantageous when a program
    has one or a few arrays of variable size. The alternative solution of making the
    arrays very big to cover the worst case situation is a waste of cache space. A
    situation where a program has several large arrays and where the size of each
    array is a multiple of the critical stride (see above, page 91) is likely to cause
    contentions in the data cache.


    If the number of elements in an array grows during program execution, then it
    is preferable to allocate the final array size from the beginning rather than
    allocating more step by step. In many systems, you cannot increase the size of
    a memory block that has already been allocated. If the final size cannot be predicted
    or if the prediction turns out to be too small, then it is necessary to allocate
    a new memory block and copy the contents of the old memory block into the beginning
    of the new memory block. This is inefficient, of cost, and causes the heap to
    become fragmented. An alternative is to keep multiple memory blocks, either in
    the form of a linked list or with an index of memory blocks. A method with multiple
    memory blocks makes the access to individual elements more complicated and time
    consuming.


    A collection of a variable number of objects is often implemented as a linked
    list. Each element in a linked list has its own memory block and a pointer to
    the next block. A linked list is less efficient than a linear array for the following
    reasons:


    +   • Each object is allocated separately. The deallocation, garbage collection
    takes a considerable amount of time.


    +   • The objects are not stored contiguously in the memory. This makes data caching
    less efficient.


    +   • Extra memory is used for the link pointers and for information stored by
    the heap manager for each allocated block.


    +   • Walking through a linked list takes more time than looping through a linear
