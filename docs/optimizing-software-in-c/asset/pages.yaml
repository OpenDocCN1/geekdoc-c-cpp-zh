    # 10.1 Simultaneous multithreading


    Many microprocessors are able to run two threads in each core. For example, a
    processor with four cores can run eight threads simultaneously. This processor
    has four processors but eight logical processors.


    “Hyperthreading” is Intel''s for simultaneous multithreading. Two threads running
    in the same core will always compete for the same resources, such as cache and
    execution units. There is no advantage to using simultaneous multithreading if
    any of the shared resources are limiting factors for the performance then. On
    the contrary, each thread may run at less than half speed of cache evictions and
    other resource conflicts. If a large fraction of time goes to cache misses, branch
    misprediction, or long dependency chains, then each thread will run at most like
    the single-thread speed. In this case there is an advantage to using simultaneous
    multithreading but performance is not doubled. A thread that shares the resources
    of the core with another thread will always be slower than a thread that runs
    in one core.


    It is often necessary to experiment in order to determine whether it is advantageous
    to use simultaneous multithreading or not in a particular application.


    If simultaneous multithreading is not advantageous then it is necessary to query
    certain operating systems (e.g.GetLogicalProcessorInformation in Windows) to determine
    if the processor has simultaneous multithreading. If so, then you can avoid simultaneous
    multithreading by using only the even-numbered logical processors (0, 2, 4, etc.).
    Other operating systems lack the necessary functions for distinguishing between
    the number of physical processors and the number of logical processors.


    There is no way to tell the processor to give higher priority to one thread than
    another. Therefore, a low-priority thread steals resources from a higher-priority
    thread running in the same core. It is the responsibility of the operating system
    to avoid running two threads with different priority in the same processor core.
    Unfortunately, contemporary operating systems are not able to handle this problem
    adequately.'
