    | Generate optimization report | /Fm | | /Qopt-report | -opt-report |


    Various floating point options represent different compromises between speed and
    precision.

    - -fp-contract=fast: *a+b is converted to a fused multiply-and-add instruction.
    The intermediate (*a+b) is calculated with unlimited precision.

    - -freciprocal-math: Dividing by a constant is replaced by multiplying by the
    reciprocal. This improves speed with a minimum effect on precision.

    - -associative-math: (a+b)*c = a*(b+c). This can have severe consequences for
    precision. Example: `float a = 1.El0, b = (1+a)-a` gives 0 with -fno-associative-math
    and 1 with -associative-math. The programmer may prefer to use parentheses to
    indicate which order of calculation is desired rather than using option.

    - -ffinite-math-only: Optimizations that fail to propagate NAN and INF. For example:
    x can be optimized to 0. This will be wrong if x != INF becomes INF-INF = NAN.
    Warning: Detection of NAN and INF may be impossible with this option.

    - -fno-trapping-math: Necessary for automatic vectorization. x=0.0/0.0 is reduced
    to x=NAN, giving no trap.

    - -fno-math-errno: Does not make a trap that sets errno for sqrt etc. This is
    necessary for automatic vectorization of branches calling sqrt.

    - -fno-signed-zeros: Enable optimizations that ignore the sign of zero, such as
    x*0 = 0 and x+0 = x.'
