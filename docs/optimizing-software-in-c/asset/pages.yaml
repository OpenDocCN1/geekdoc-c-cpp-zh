  md: '# 7.15 Function parameters


    Function parameters are transferred by value in most cases. This means that the
    value of the parameter is copied to a local variable. This is efficient for simple
    types such as int, float, double, bool, enum as well as pointers and references.


    Arrays are always transferred as pointers unless they are wrapped into a class
    or structure.


    The situation is more complex if the parameter has a composite type such as a
    structure or class. The transfer of a parameter of composite type is most efficient
    if all of the following conditions are:


    +   - the object is so small that it fits into a single register

    - the object has no copy constructor and destructor

    - the object has no virtual member

    - the object does not use runtime type identification (RTTI)


    If any of these conditions is not met then it is faster to transfer a pointer
    reference to the object. If the object is large then it obviously takes time to
    copy the entire object. Any copy constructor must be called when the object is
    copied to the parameter, and the destructor, if, any, must be called before the
    function returns.


    The preferred method for transferring composite objects to functions is by a const
    reference. A const reference ensures that the original object is not modified.
    Unlike a pointer or non-const reference, a const reference allows the function
    argument to be an expression or an anonymous object. The compiler can easily optimize
    a const reference if the function is inlined.


    An alternative solution is to make the function a member of the class or structure.
    This is equally efficient.


    Simple function are transferred on the stack in 32-bit systems, but in registers
    in 64-bit systems. The latter is more efficient. 64-bit Windows allow a maximum
    of four parameters to be transferred in registers. 64-bit Unix allows up to fourteen
    parameters to be transferred in registers (8 float or double plus 6 integer, or
    reference parameters). This pointer in member functions counts one parameter.
    Further details are given in manual 5: "Calling conventions for different C++
    compilers and operating systems"


    # 7.16 Function return types


    The return type of a function should preferably be a simple type, a pointer, or
    a reference. Returning objects of a composite type is more complex and inefficient.


    Objects of a composite type can be returned in registers only in the simplest
    cases. See manual 5: "Calling conventions for different C++ compilers and operating
    systems" for details on what can be returned in registers.


    Except for the simplest cases, objects are returned by constructing them into
    a place indicated by the caller through a hidden pointer. The copy constructor,
    if any, is usually called in the copying process, and the destructor is destroyed
    when the original is destroyed. In simple cases, the compiler may be to avoid
    the calls to the copy constructor and the destructor by constructing the object
    on its final destination, but do not count on it.


    Instead of returning a composite object, you may consider the following alternatives:


    +   - Make the function a constructor for the object.'
