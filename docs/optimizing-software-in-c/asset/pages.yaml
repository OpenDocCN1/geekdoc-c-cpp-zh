    # 3.13 Memory access


    Accessing data from RAM memory can take a long time the time it takes to calculations
    on the data. This is the reason why all modern computers have memory caches. Typically,
    there is a level-1 data cache of 8 - 64 Kbytes and a level-2 cache of 256 Kbytes
    to 2 Megabytes. There is also a level-3 cache of several Megabytes.

    If the combined size of data in a program is bigger than the level-2 cache and
    the cache are scattered around memory or accessed in a non-sequential manner then
    it is likely that memory access is the best time-consumer in the program. Reading
    or writing to a variable in memory takes only 2-4 clock cycles if it is cached,
    but several hundred cycles if it is not cached. See page 25 about data storage
    and page 91 about memory caching.


    # 3.14 Context switches


    A context switch is a switch between different tasks in a multitasking environment,
    between different threads in a multithreaded program, or between different parts
    of a big program. Frequent context switches can reduce the performance because
    the contents of data cache, code cache, branch target buffer, branch prediction,
    etc. may have to be renewed.


    Context switches are more frequent if the time slices allocated to each task or
    thread are smaller. The lengths of the time slices is determined by the operating
    system, not by the application program.


    The number of context switches is smaller in a computer with multiple CPUs or
    a CPU with multiple cores.


    # 3.15 Dependency chains


    Modern microprocessors can do out-of-order execution. This means that a piece
    of software specifies the calculation of A and then B, and the calculation of
    A is slow, the microprocessor can begin the calculation of B before the calculation
    of A is finished. Obviously, this is only possible if the value of A is not needed
    for the calculation of B.


    In order to take advantage of out-of-order execution, you have to avoid long dependency
    chains. A dependency chain is a series of calculations, where each calculation
    depends on the result of the preceding one. This prevents the CPU from doing multiple
    calculations simultaneously or out of order. See page 113 for examples of how
    to break a dependency chain.


    # 3.16 Execution unit throughput


    There is an important distinction between the latency and the throughput of an
    execution unit. For example, it may take three clock cycles to do a floating point
    addition on a modern CPU. But it is possible to start one or two new floating
    point additions every clock cycle. This means that if each addition depends on
    the result of the preceding addition then you'
