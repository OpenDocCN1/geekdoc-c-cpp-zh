    # Aligning data


    Loading data into a vector gathers the data is aligned to an address divisible
    by the vector size (16, 32, or 64 bytes). This has a significant effect on older
    processors and Intel Atom processors, but is less important on newest processors.
    The following example shows how to align arrays


    ```

    // Example 12.5. Aligned arrays

    const int size = 256;

    alignas(16) int64_t aa[size]; // Array size

    // Make aligned array

    ```


    # Vectorized table lookup


    Lookup tables are useful for optimizing code, as explained on page 144. Unfortunately,
    table lookup is an obstacle to vectorization. AVX2 and later instruction sets
    have gather instructions that are useful for table lookup. A vector of 32-bit
    or 64-bit integers float, or double values. The gather instruction takes several
    clock cycles because the elements are being read by one by one.


    If the table is so small that it can fit into one or four registers, it is more
    efficient to use permutations for table lookup. The AVX instruction set permits
    permutation of 32-bit floats in 256-bit vectors. Permutation with 16 bit integers
    requires the AVX512BW instruction. Permutation with 8 bit integers with more than
    16 elements requires the AVX512VBMI instruction.


    Using intrinsic functions can be quite tedious. The code becomes bulky and difficult
    to read. It is easier to use vector classes, as explained in the next section.'
