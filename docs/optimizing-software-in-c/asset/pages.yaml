    # 7.31 Threads


    Threads are used for doing two or more jobs simultaneously or seemingly simultaneously.
    Modern CPUs have multiple cores that make it possible to run multiple threads
    simultaneously. Each thread will have slices of 30 ms for foreground jobs and
    10 ms for background jobs when there are more than CPU cores. The context switches
    after each slice are quite costly because each cache have to adapt to the new
    context. It is possible to reduce the number of context switches by making longer
    slices. This will make applications run faster at the cost of longer response
    times for users input.


    Threads are useful for assigning different priorities to tasks. For example, in
    a word processor the user expects an immediate response to pressing a key or moving
    the mouse. This task must have a high priority. Other tasks such as spell-checking
    and repination are running in other threads with lower priority. If the different
    tasks were not divided into threads with different priorities, the user might
    experience unexpectedly long response times to keyboard and mouse inputs when
    the program is busy doing the spell checking.


    Any task that takes a long time, such as mathematical calculations, should be
    scheduled in a separate thread if the application has a graphical interface. Otherwise
    the program will be unable to respond quickly to keyboard or mouse input.


    It is possible to make a thread-like scheduling in an application program without
    invoking the overhead of the operating system thread scheduler. This can be accomplished
    by doing the heavy calculations piece by piece in a function that is called from
    the message loop of a graphical interface (Onid in Windows MFC). This method may
    be faster than making a separate thread in systems with few CPU cores, but it
    requires that the background job can be divided into small pieces of a suitable
    duration.'
