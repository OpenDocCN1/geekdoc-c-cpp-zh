  md: 'The code becomes more efficient when there is no exception handling. It is
    recommended to turn off support for exception handling unless the code relies
    on structured exception handling and you want the code to be recover from exceptions.
    See page 62.


    It is recommended to turn off support for runtime type identification (RTTI).
    See page 55.


    It is recommended to enable fast floating point calculations or turn off requirements
    for strict floating point calculations unless the strictness is required. See
    page 75 for discussions.


    Turn on the option for "function linking" if available. See page 84 for an explanation
    of this option.


    Use an option for "assume no pointer aliasing" if you are sure the code has no
    pointer aliasing. See page 81 for an explanation.


    Many compilers have an option for "standard stack frame" or "frame pointer". The
    standard stack frame is used for debugging and exception handling. Omitting the
    stack frame, makes function calls faster and makes an extra register available
    for other purposes. This is advantageous because registers are a scarce resource.
    Do not use a stack frame unless your program relies on exception handling.


    See page 175 for a detailed list of compiler options.


    # Options for optimizing floating point code


    Some of the obstacles to optimizing floating point code can be overcome by the
    use of specific compiler options.


    Most optimizations of integer expressions are enabled by setting the compiler
    optimization to 2 (-O2) or higher. Optimization of floating point expressions
    is more complicated because many optimizations may compromise precision or standards
    compliance. The programmer needs to consider several compiler options to tune
    the optimization of floating point code. The following discussion applies to the
    Gnu, Clang, and LLVM-based compilers.


    The options -ffp-fast -funsafe-math-optimizations will enable optimizations that
    require reordering of operands. $a+b+c$ and $c+b+a$ will not necessarily give
    the same result, as explained at page 81.9. A precise floating point model is
    necessary for optimizations involving reordering of operands or otherwise a slightly
    different precision. These options also enable the combination of a multiplication
    and an addition into a fused multiply-add instruction.


    Optimizations such as $a*=0$ and $a-=0$ are invalid if the variable $a$ can be
    infinity or NAN. The option -ffinite-math-only can tell the compiler to assume
    that numbers are not nan.


    -fno-trapping-math. This option tells the compiler to not rely on catching floating
    point exceptions with trycatch blocks or with a global floating point status register.
    This option is necessary for vectorization of loops that contains branches. The
    compiler cannot make branches in vector code without this option because an exception
    in a non-taken branch might raise a trap.


    -fno-math-errno. Mathematical functions such as sqrt and log are setting a variable
    named errno in case of errors. This way of detecting errors is inefficient and
    should be avoided. The option fno-math-errno is necessary for vectorization of
    loops containing mathematical functions. Further considerations for mathematical
    functions are discussed in the next section.'
