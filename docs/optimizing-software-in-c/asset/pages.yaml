    # 14.6 Floating point division


    Floating point division takes much longer than addition, subtraction and multiplication

    (20 - 45 clock cycles).


    Floating point division by a constant should be done by multiplying with the reciprocal:


    ```

    // Example 14.14a

    double a, b;

    a = b / 1.2345;

    ```


    Change this to:


    ```

    // Example 14.14b

    double a, b;

    a = b * (1. / 1.2345);

    ```


    The compiler will calculate (1./1.2345) at compile time and insert the reciprocal
    in the

    code, so you will never spend time doing the division. Some compilers will replace
    the code

    in 14.14a with 14.14b automatically if certain options are set to relax

    floating point precision (see page 75). It is therefore safer to do this optimization
    explicitly.


    Divisions can be eliminated completely. For example:


    ```

    // Example 14.15a

    if (a > b / c)

    ```


    can be replaced by


    ```

    // Example 14.15b

    if (a * c > b)

    ```


    But beware of the pitfalls here: The inequality sign must be reversed if c < 0.
    The division is

    inexact b and c are integers, while the multiplication is exact.


    Multiple divisions can be combined. For example:


    ```

    // Example 14.16a

    double y, a1, a2, b1, b2;

    y = a1/b1 + a2/b2;

    ```


    Here we can eliminate one division by making a common denominator:


    ```

    // Example 14.16b

    double y, a1, a2, b1, b2;

    y = (a1*b2 + a2*b1) / (b1*b2);

    ```


    The trick of using a common denominator can even be used on completely independent

    divisions. Example:


    ```

    // Example 14.17a

    double a1, a2, b1, b2, y1, y2;

    y1 = a1 / b1;

    y2 = a2 / b2;

    ```'
