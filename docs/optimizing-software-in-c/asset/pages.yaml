  md: "Compilers generally know that standard library functions like sqrt, pow and\
    \ log are pure functions, but unfortunately there is no standardized way to tell\
    \ a compiler that a user-defined function is pure.\n\n# Virtual functions and\
    \ function pointers\n\nIt is not always possible for the compiler to determine\
    \ with certainty which version of a virtual function will be called, or what a\
    \ function pointer points to. Therefore, it cannot inline a virtual function or\
    \ overoptimize across the call if the class is not known.\n\n# Algebraic reduction\n\
    \nMost compilers do simple algebraic reductions as -(a) = a, but they are not\
    \ always able to do more complicated reductions. Algebraic reduction is a complicated\
    \ process which is difficult to implement in a compiler.\n\nMany algebraic reductions\
    \ are not permissible for reasons of mathematical purity and precision. In many\
    \ cases it is possible to construct obscure examples where the reduction would\
    \ cause overflow or loss of precision, in floating point expressions (see page\
    \ 75). The compiler cannot run out the possibility that a particular reduction\
    \ would be invalid in a particular situation. It is therefore necessary to do\
    \ the algebraic reductions explicitly in many cases.\n\nInteger expressions are\
    \ less susceptible to overflow and loss of precision for reasons explained on\
    \ page 75. It is therefore possible for the compiler to do more reductions on\
    \ integer expressions than on floating point. Most reductions involving integer\
    \ addition, subtraction and multiplication are permissible in all cases, while\
    \ many reductions division and relational operators (e.g. '*') are not permissible\
    \ for reasons of mathematical purity. For example, compilers may not be able to\
    \ reduce the integer expression -a > b because of the possibility of overflow.\n\
    \nTable 8.1 (page 80) shows which reductions the compilers are able to do, at\
    \ least in some situations, with the relevant options enabled. All reductions\
    \ that the compilers cannot do must be done manually by the programmer.\n\n# Floating\
    \ point induction variables\n\nCompilers rarely make point induction variables\
    \ for floating point expressions because the load-carried dependency can decrease\
    \ performance, and accumulating rounding errors may reduce the precision. Floating\
    \ point induction variables may be useful, if a function of a loop counter can\
    \ be calculated more efficiently from the previous value than the loop counter.\
    \ An expression that is an nth degree of the loop counter can be calculated by\
    \ n additions and no multiplications. The following example shows this for a 2nd\
    \ order polynomial:\n\n```\n// Example 8.24a. Loop to make table of polynomial\n\
    \ double A = 1.5, B = 2.25, C = 3.5;// Polynomial coefficients\ndouble Table[100];\
    \ // Table\nint x;\nfor (x = 0; x < 100; x++) { // Loop counter\n  Table[x] =\
    \ A*x*x + B*x + C; // Calculate polynomial\n}\n```\n\nThe calculation of this\
    \ polynomial can be done with just two additions by the use of two induction variables:"
