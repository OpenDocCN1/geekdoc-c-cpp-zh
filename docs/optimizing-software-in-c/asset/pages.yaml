    # 16.2 The pitfalls of unit-testing


    It is common practice to test each function or class separately in software development.
    This unit-testing is necessary for verifying the functionality of an optimized
    function, but unfortunately the unit-test does not get the full information about
    the performance of the function in terms of speed.


    Assume you have two versions of a critical function and you want to find out which
    is fastest. The typical way to test this is to make a small test program that
    counts the critical many with a suitable set of test data and measure how long
    it takes. The version that performs best under this unit-test may have a larger
    footprint than the alternative. The penalty of cache misses is not seen in the
    test because the total amount of code and data used by the test program is likely
    to be less than the cache size.


    When the critical function is inserted in the final program, it is very likely
    that code cache, micro-op cache, and data cache are critical resources. Modern
    CPUs are fast so that the clock cycles spent on executing instructions are less
    likely to be a bottleneck than memory access and cache size. If this is the case
    then the optimal version of the critical function may be the one that takes longer
    in the unit-test but has a smaller memory footprint.


    If, for example, you want to find out whether it is advantageous to roll out a
    big loop that you cannot rely on without taking cache effects into account.


    You can calculate how much memory a function uses by looking at a link map or
    an assembly listing. Use the "generate map file" option for the linker. The branch
    target buffer is also a cache that can be critical. Therefore, the number of jumps,
    calls, and branches in a function should also be considered.


    A realistic performance test should include not only a single function or hot
    spot but also the innermost loop that includes the critical functions and hot
    spots. The test should be performed with a realistic set of data to get reliable
    results for mispredictions. The performance measurement should not include any
    part of the program that waits for user input. The time used for file input and
    output should be measured separately.'
