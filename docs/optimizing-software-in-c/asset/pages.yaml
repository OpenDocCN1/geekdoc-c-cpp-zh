  md: '# 11 Out of order execution


    All modern x86 CPUs can execute instructions out of order or more than one thing
    at the same time, except for some low-power CPUs (Intel Atom). The following example
    shows how to take advantage of this capability:


    ```

    // Example 11.1a

    float a, b, c, d, y;

    y = a + b + c + d;

    ```


    This expression is calculated as {(a+b)+c}+d. This is a dependency chain where
    each addition has to wait for the result of the preceding one. You can improve
    this by writing:


    ```

    // Example 11.1b

    float a, b, c, d, y;

    y = (a + b) + (c + d);

    ```


    Now the two parentheses can be calculated independently. The CPU will start to
    calculate (c+d) before it finishes the calculation of (a+b). This can save several
    cycles. You cannot assume that an optimizing compiler will change the code in
    11.1a to 11.1b, although it appears to be an obvious thing to do. The reason compilers
    do not make this kind of optimizations on point expressions is that it may cause
    a loss of precision, as explained on page 75. You have to set the parentheses
    manually.


    The effect of dependency chains is stronger when they are long. This is often
    the case in loops. Consider the following example, which calculates the sum of
    100 numbers:


    ```

    // Example 11.2a

    const int size = 100;

    float list[size], sum = 0; int i;

    for (i = 0; i < size; i++) sum += list[i];

    ```


    This has a long dependency chain. If a floating point addition takes 5 cycles,
    the loop will take approximately 500 cycles. You can improve the performance by
    unrolling the loop and splitting the dependency chain in:


    ```

    // Example 11.2b

    const int size = 100;

    float list[size], sum = 0, sum2;

    for (i = 0; i < size; i += 2) {

    sum += list[i];

    sum2 += list[i+1];}

    sum += sum2;

    ```


    If a processor with one adder is adding addition to sum1 from time T to T+5, then
    it can do another to sum2 from time T+1 to T+6, and the whole loop will take only
    256 cycles.


    Calculations in a loop where each iteration needs the result of the preceding
    one is called a loop-carried dependency chain. Such dependency chains can be very
    long and time-consuming. There is a lot to gain if such dependency chains can
    be broken up. The two summation variables sum1 and sum2 are accumulators. Current
    CPUs have one or two floating point addition units, and these units are pipelined,
    as explained above, so that it can start a new addition before the preceding addition
    is finished.


    The optimal number of accumulators for floating point addition and multiplication
    may be three or four, depending on the CPU.'
