    operators.


    A good compiler is often able to optimize the code after you have vectorized manually.
    The compiler can use optimization techniques such as function inlining, subexpression
    elimination, constant propagation, loop optimization, etc. These techniques are
    rarely used in manual assembly because it makes the code unwieldy, error prone,
    and almost impossible to maintain. The combination of manual vectorization with
    further optimization by the compiler can give the best result in difficult cases.
    Some experimentation may be needed to find the best solution. You may look at
    the assembly output or the disassembly display in a debugger to check what the
    compiler is doing.


    Vectorized code often contains a list of extra instructions for converting the
    data to the right format and getting them into the right positions in the vectors.
    This data conversion and permutation can sometimes take more time than the actual
    calculations. This should be taken into account when deciding whether it is profitable
    to use vectorized code or not. VCL Vector Class Library has very useful permutation
