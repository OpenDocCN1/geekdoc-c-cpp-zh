    # 14.12 Position-independent code


    Shared objects in Linux, BSD and Mac systems normally use the position-independent
    code. The name ''position-independent code'' actually implies more than it says.
    A code that is compiled as position-independent has the following features:


    +   - The code section contains no absolute addresses that need relocation, but
    only self-relative addresses. Therefore, the code section can be loaded at an
    arbitrary memory address between multiple processes.

    - The data section is not shared between multiple processes because it contains
    writeable data. Therefore, the data section may contain pointers or addresses
    that need relocation.

    - All public functions and public data can be overridden in Linux and BSD. If
    a function in the main executable has the same name as a function in a shared
    object, then the version in main will take precedence, not only when called from
    main, but also called from the shared object. Likewise, when a global variable
    in main has the same name as in the shared object, then instance in main will
    be used, even when accessed from the shared object. This-called symbol interposition
    is intended to mimic the behavior of static libraries. A shared object has a table
    of pointers to its functions, called procedure linkage table (PLT) and a table
    of pointers to its variables called global offset table (GOT) to implement this
    ''override'' feature. All accesses to functions and public variables go through
    the PLT and


    The symbol interpolation feature that allows overriding of public functions and
    data in Linux and BSD comes at a high price, and in most libraries it is never
    used. Whenever a function in a shared object is called, it is necessary to look
    up the address in the procedure linkage table (PLT). Whenever a public variable
    is accessed, it is necessary to first look up the address in the global offset
    table (GOT). These table lookups are needed even when the function or variable
