    # ## 2.5 Choice of compiler


    C++ compilers have become more and complicated in recent decades. With the AVX512
    instruction set for advanced vector operations, we now have thousands of different
    machine instructions. Many new advanced features in the C++ language standard
    have also added to the complexity. In the same period, the number of C++ compilers
    on the market has decreased, and some old compilers that were popular in the past
    are now obsolete or discontinued. It is said that the number of compilers may
    decrease further in the future.


    Some of the best up-to-date compilers for x86 and x86-64 platforms are mentioned
    below. These compilers all support 32-bit and 64-bit code and automatic vectorization.


    # ## Microsoft Visual Studio


    This is a very friendly compiler with many features and a good debugger. The full
    version is very expensive, but a limited non-commercial version is available for
    free. Visual Studio can build code with various programming languages (C++, C#,
    Basic) for various platforms. Visual Studio is not the best compiler in terms
    of code optimization, but it can be very useful during the development phase of
    a project. You may use a different compiler for the release version of your code
    if performance is important. It is possible to use the Studio integrated development
    environment (IDE) with a different compiler. The plugin for the Clang compiler
    can be recommended


    # ## Gnu


    The gcc ornu is among the best optimizing compilers available. It is less friendly
    than Visual Studio, and sometimes you have to be a real nerd to understand the
    many command line options. This compiler is free and open source, and it is available
    for almost any platform. The stand-alone compiler is run from the command line,
