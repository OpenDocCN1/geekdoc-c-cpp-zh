    The pre-increment operator ++i and the post-increment operator i++ are as fast
    as additions. When using simply to increment an integer variable, it makes no
    difference you use pre-increment or post-increment. The effect is identical. For
    example,

    for (i=0; i<n; i++) is the same as for (i=0; i<n; ++i). But when the result of
    the expression is used, there may be a difference in efficiency. For example,
    x = array[i++] is more efficient than x = array[++] because in the latter case,
    the calculation of the array element has to wait for the new value of i which
    will delay the availability of x for approximately two clock cycles. Obviously,
    the initial value of i must be adjusted if you change pre-increment to post-increment.


    There are situations where pre-increment is more efficient than post-increment.
    For example, in the case a = ++b; the compiler will recognize that the value of
    a and b are the same after this statement so it can use the same register for
    both, while the expression a = b++; will make the values of a and b different
    so that they cannot use the same register.


    Everything is said here about increment operators also applies to decrement operators
    on integer variables.


    # 7.3 Floating point variables and operators


    Modern microprocessors in the x86 family have two types of floating point registers
    and correspondingly two different types of floating point instructions. Each type
    has advantages and disadvantages.


    The original method of doing floating point operations involves eight floating
    point registers organized as a register stack, x87 registers. These registers
    have long double precision (80 bits). The advantages of using the register stack
    are:


    +   - All calculations are done with long precision.


    +   - Conversions between different precisions take no extra time.


    +   - There are intrinsic instructions for mathematical functions such as logarithms
    and trigonometric functions.


    +   - The code is compact and takes little space in the code cache.


    The register stack also has disadvantages:


    +   - It is difficult for the compiler to make register variables because of the
    way the register stack is organized.


    +   - Floating point comparisons are slow.


    +   - Conversions between integers and floating point numbers is inefficient.


    +   - Division, square root and mathematical functions take more time to calculate
    when long precision is used.'
