  md: "Structure and class objects can be made smaller by reordering the data members.\
    \ If the class has at least one virtual member functions then there is a pointer\
    \ to a virtual table before the first data member or the last member. This pointer\
    \ is 4 bytes in 32-bit systems and 8 bytes in 64-bit systems. If you are in doubt\
    \ how big a structure or each of its members are then you may make some tests\
    \ with the sizeof operator. The value returned by the sizeof operator includes\
    \ any unused bytes in the end of the object.\n\nThe code for accessing a data\
    \ member is more compact if the offset of the member relative to the beginning\
    \ of the structure or class is less than 128 because the offset can be expressed\
    \ as an 8-bit signed number. If the offset relative to the beginning of the structure\
    \ or class is 128 bytes or more then the offset has to be expressed as a 32-bit\
    \ number (the instruction has nothing between 8 and 32 bits offsets). Example:\n\
    \n```\n// Example 7.40\nclass S {\npublic:\n    int a[100]; // 400 bytes first\
    \ byte at 0, last byte at 399\n    int b; // 4 bytes first byte at 400, last byte\
    \ at 403\n    int readB() { return b; }\n};\n```\n\nThe offset of b is 400. Any\
    \ code that accesses b through a member function such as ReadB needs to code the\
    \ offset as a 32-bit number. If a and b are swapped then both have an offset that\
    \ is coded as an 8-bit signed number, or not offset at all. This makes the code\
    \ more compact so that the cache is used more efficiently. It is therefore recommended\
    \ that big arrays and other big objects come last in a structure or class declaration\
    \ and the most used data members come first. If it is not possible to contain\
    \ all data members within the first 128 bytes then put the most used members in\
    \ the first 128 bytes.\n\n# 7.21 Class member functions (methods)\n\nEach time\
    \ a new object of the class is created or declared it will generate a new instance\
    \ of the data members. Each member function has only one instance. The function\
    \ code is not copied because the same code can be applied to all instances of\
    \ the class.\n\nCalling a member function is as fast as calling a simple function\
    \ with a pointer or reference to a structure. For example:\n\n```\n// Example\
    \ 7.41\nclass S {\npublic:\n    int a;\n    int b;\n    int Sum1() { return a\
    \ + b; }\n};\nint Sum2(S * p) { return p->a + p->b; }\nint Sum3(S & r) { return\
    \ r.a + r.b; }\n```\n\nThe three functions Sum1, Sum2 and Sum3 are doing exactly\
    \ the thing and they are equally efficient. If you use the code generated by the\
    \ compiler you will notice that compilers will make nearly identical code for\
    \ the three functions. Sum1 has an implicit \"this\" pointer which does the same\
