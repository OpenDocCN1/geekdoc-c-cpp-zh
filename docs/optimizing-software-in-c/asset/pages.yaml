    #  7.22 Virtual member functions


    Virtual functions are used for implementing polymorphic classes. Each instance
    of a polymorphic class has a pointer to a table of pointers to the different versions
    of the virtual functions. This so-called virtual table is used for finding the
    right version of the virtual function at runtime. Polymorphism is one of the main
    reasons why object oriented programs can be less efficient than non-oriented programs.
    If you avoid virtual functions then you can obtain most of the advantages of object
    oriented programming without paying the costs.


    The time to call a virtual member function is a few cycles more than it takes
    to call a non-virtual member, provided that the function call always calls the
    same version of the virtual function. If the version changes then you may get
    a misprediction penalty of 10 cycles. The rules for prediction and misprediction
    of virtual function calls are the same as switch statements, as on page 44.


    The dispatch mechanism can be bypassed when the virtual function is called on
    an object of known type, then you can always rely on bypassing the dispatch mechanism
    when it would be obvious to do so. See page 76.


    Runtime polymorphism is needed only if it cannot be known at compile time which
    version of a polymorphic member function is called. If virtual functions are used
    in a critical part of a program then may consider whether it is possible to obtain
    the desired functionality without runtime polymorphism.


    It is sometimes possible to obtain the desired polymorphism with templates instead
    of virtual functions. The template parameter should be a class containing the
    functions that have multiple versions. This method is faster because the template
    parameter is always resolved at compile time rather than at runtime. Example 7.47
    shows an example of how to do this. Unfortunately, the syntax is so kludge that
    it may not be worth the effort.


    #  7.23 Runtime type identification (RTTI)


    Runtime type identification adds extra information to all class objects and is
    not efficient. If the compiler has an option for RTTI then turn it off or use
    alternative implementations.


