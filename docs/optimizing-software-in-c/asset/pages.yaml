  md: 'There is a possibility to catching hardware exceptions. The mechanism relies
    on non-standardized details in both compiler, operating system and CPU hardware.
    Porting such an application to a different platform will require modifications
    in the code.


    Let''s look at the alternatives to exception handling in this case. We might check
    for overflow by checking if bi[] and ci are too big before multiplying them. This
    would require two floating point comparisons, which are relatively costly because
    they be inside the innermost loop. Another possibility is always use the formula
    a[i] = log(b[i]) + log(c[i]); This would double the number of calls to log, and
    logarithms take a long time to calculate. There is a way to check for overflow
    outside the loop without checking before if all the factors are generated from
    the same few parameters. Or it might be possible to check after the loop if the
    results are combined by some function into a single result.


    # ### Exceptions and vector code


    Vector instructions are used for doing multiplications in parallel. This is described
    in chapter 12. Exception handling does not work with vector code because a single
    element in the vector may cause an exception while the other vector elements do
    not. You may even generate an exception in a not-taken branch of the vector branches
    implemented in vector code. The code can benefit from vector instructions then
    it is better to disable the trapping of exceptions and rely on the propagation
    of NAN and INF. See chapter 7.34. This is further described in the document www.agner.org/optimize/nan_propagation.pdf.


    # ### Avoiding the cost of exception handling


    Exception handling is not necessary when no attempt is made to recover from errors.
    If you just want the program to issue an error message and stop the program in
    case of an error then there is no reason to use try, catch, and throw. It is more
    efficient to define your own error-handling function that simply prints an error
    message and then calls exit.


    Calling exit may not be safe if there are allocated resources that need to be
    cleaned up, as explained below. There are other ways of handling errors without
    exceptions. The function return an error code which the calling function can use
    for recovering or issuing an error message.


    It is recommended to use a systematic and well-thought approach to error handling.
    You distinguish between recoverable and non-recoverable errors; make sure allocated
    resources are cleaned up in case of an error; and make appropriate error messages
    to the user.


    # ### Making exception-safe code


    Assume that a function opens a file in exclusive mode, and an error condition
    terminates the program before the file is closed. The file will remain locked
    after the program is terminated and the user will be unable to access the file
    until the computer is rebooted. To prevent this kind of problems you must make
    your program exception safe. In other, the program must clean up in case of an
    exception or other error condition. Things that may need to be cleaned up include:


    +   - Memory allocated with new or malloc.

    - Handles to windows, graphics brushes, etc.'
