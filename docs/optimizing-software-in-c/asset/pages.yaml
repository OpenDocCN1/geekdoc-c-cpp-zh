  md: '# 17 Optimization in embedded systems


    Microcontrollers in small embedded applications have less computing resources
    than standard PCs. The clock frequency may be a hundred or even a thousand times
    lower; and the amount of RAM memory may be a million times less than in a PC.
    Nevertheless, it is possible to make software that runs quite fast on such small
    devices if you avoid large graphics frameworks, interpreters, system database,
    and other software layers and frameworks typically used on bigger systems.


    The smaller the system, the more important it is to choose a software framework
    that has few resources. On the smallest devices, you do not have an operating
    system.


    The performance is obtained by choosing a programming language that can be cross-compiled
    on a PC and transferred as machine code to the device. Any language that requires
    compilation or interpretation on the device itself is a big waste of resources.
    For these reasons, the preferred language will often be C or C++. Critical drivers
    may need assembly language.


    C takes slightly more resources than C if you follow the guidelines below. You
    may either C or C++ based on what is most appropriate for the desired program
    structure.


    It is important to remember the use of RAM memory. Big arrays should be declared
    inside the function they are used so that they are deallocated when the function
    returns. Alternatively, you may reuse the same array for multiple purposes.


    All dynamic memory allocation using new/delete should be avoided because of the
    large overhead of managing a memory. The heap manager has a garbage collector
    that is likely to consume time at unpredictable intervals which may interfere
    with real time applications.


    Remember that C++ container classes use dynamic memory allocation with new and
    delete, and often excessively. These containers should be avoided unless you have
    ample resources. For example, a FIFO queue should be implemented as a circular
    buffer with fixed size to avoid dynamic memory allocation. Do not use a linked
    list (see page 97).


    All implementations of string classes use dynamic memory allocation. You should
    avoid this and handle text strings in the old fashioned C as character arrays.
    Note that the C style string functions have no check for overflow of the arrays.
    It is the responsibility of the programmer to make sure the arrays are sufficiently
    large to handle the strings including the terminating zero and to make checks
    where necessary (see page 105).


    Virtual functions in C++ take more resources than non-virtual functions. Avoid
    virtual if possible.


    Small microprocessors require a big floating point execution units. Any floating
    point operation on such processors is very time consuming. You should avoid any
    use of floating point expressions. For example, a = b*5 may be changed to a =
    b*5/2 (be aware of overflow on the intermediate expression b*5). As soon as you
    have even a single constant with a decimal point in your program, you will be
    loading the floating point library. If you want a number to be calculated with
    two decimals, for example, you should multiply it by 100 so it can be represented
    as an integer.


    Integer variables can be 8, 16 or 32 bits (rarely 64). You may save RAM space,
    if necessary, by using the smallest integer size that does not overflow in the
    particular'
