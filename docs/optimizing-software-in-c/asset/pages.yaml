    \ The best performance is obtained with the highest instruction set that the microprocessor\
    \ supports.\n\nAutomatic vectorization is further explained on page 18.\n\n# Induction\
    \ variables\n\nAn expression that is a linear function of a loop counter can be\
    \ calculated by adding a constant to the previous value. Example:\n\n```\n// Example\
    \ 8.15a\nint i, a[100];\nfor (i = 0; i < 100; i++) {\n    a[i] = i * 9 + 3;\n\
    }\n```\n\nThe compiler may avoid the multiplication by changing this to:\n\n```\n\
    // Example 8.15b\nint i, a[100], temp;\ntemp = 3;\nfor (i = 0; i < 100; i++) {\n\
    \    a[i] = temp;\n    temp += 9;\n}\n```\n\nInduction variables are often used\
    \ for calculating the addresses of array elements. Example:\n\n```\n// Example\
    \ 8.16a\nstruct S1 {double a; double b;};\nS1 list[100]; int i;\nfor (i = 0; i\
    \ < 100; i++) {\n    list[i].a = 1.0;\n    list[i].b = 2.0;\n}\n```\n\nIn order\
    \ to access an element in list, the compiler must calculate its address. The address\
    \ of list[i] is equal to the address of the beginning of list i*sizeof(S1). This\
    \ is a linear function of i which can be calculated by an induction variable.\
    \ The compiler can use the same induction variable for accessing list[i].a and\
