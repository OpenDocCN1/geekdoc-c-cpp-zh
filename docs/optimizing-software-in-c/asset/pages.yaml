    \ or make smaller files.\n\nIt is faster to compress a bitfield by the use of\
    \ << and | operations to write the members individually. Example:\n\n```\n// Example\
    \ 7.44a\nstruct Bitfield {\n    int a:4;\n    int b:2;\n    int c:2;\n}\nBitfield\
    \ x;\nint A, B, C;\nx.a = A;\nx.b = B;\nx.c = C;\n```\n\nAssuming that the values\
