    \ only the copy will\n    # be affected.\n    x[1] = 99\n\na = [1, 2, 3]\n\n#\
    \ Simulate call-by-value by making a copy\nfoo(a.copy())\n\nprint(a)  # [1, 2,\
    \ 3]\n```\n```"
