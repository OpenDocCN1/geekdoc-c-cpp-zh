    而且，它确实不是数字。它是一个字符序列，我们称之为字符串。字符串就像单词或句子，例如。


    等等……除了数字之外还有另一种类型的数据？是的！有很多类型的数据！我们称之为数据类型。


    Python 为每个变量关联一个类型。这意味着它会记录变量保存的是整数、浮点数还是字符字符串。


    下面是一些示例及其关联类型。当你把这些值之一存储到一个变量中时，变量会记住存储在其中的数据类型。


