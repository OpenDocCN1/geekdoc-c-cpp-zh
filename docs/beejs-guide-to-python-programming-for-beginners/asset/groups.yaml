    \ we can cross-reference.\n- We need to compute the distance and print that.\n\
    \n### Problem-solving step: Devising a Plan\n\n```python\nprint(f'{i:8}', end=\"\
    \")\nfor j in range(num_ships):\n    dist = 99.99\n    print(f'{dist:8.2f}', end=\"\
    \")\nprint()\n```\n\nAnd we get this:\n\n```text\n    0       1       2\n0   99.99\
    \   99.99   99.99\n1   99.99   99.99   99.99\n2   99.99   99.99   99.99\n```\n\
    \nEr, well, that's almost right. The top row is shifted one column left. We need\
    \ to stick 8 blank spaces in before it to scooch it over. So let's just do it,\
    \ using string multiplication to make us 8 spaces:\n\n```python\nprint(\" \" *\
    \ 8, end=\"\")   # <-- Add this\n\nfor i in range(num_ships):\n    print(f'{i:8}',\
    \ end=\"\")\nprint()\n```\n\nAnd now we have this:\n\n```text\n        0     \
    \  1       2\n0   99.99   99.99   99.99\n1   99.99   99.99   99.99\n2   99.99\
