    ### 17.3 Python 编译器优化


    如果你取上面来自 REPL 的这个例子：


    ```

    >>> s = "Beej!"

    >>> t = "Beej!"

    >>> s is t

    False

    ```


    并且你把它放在一个 python 程序中，比如 test.py：


    ```

    s = "Beej!"

    t = "Beej!"

    print(s is t)

    ```


    并且从命令行运行它，你会以为会得到 False，就像在 REPL 中一样。错了！


    ```

    $ python test.py

    True

    ```


    怎么回事？为什么第一种情况下是 False，第二种情况下是 True？好吧，在后一种情况下，Python 解释器变得有点聪明。在它甚至运行你的代码之前，它就会分析它。它看到你里面有两个
    "Beej!" 字符串，所以它就让它们变成同一个以节省你的内存。由于字符串是不可变的，你无法区分。


    ### 17.4 驻留


    在上面同一个例子中：


    ```

    >>> s = "Beej!"

    >>> t = "Beej!"

    >>> s is t

    False

    ```


    如果我们使用不同的字符串，比如 "Alice" 呢？


    ```

    >>> s = "Alice"

    >>> t = "Alice"

    >>> s is t

    True

    ```


    True?? 这是怎么回事？为什么 Alice 会得到特殊待遇？

    或者看这个：


    ```

    >>> x = 257

    >>> y = 257

    >>> x is y

    False

    ```


    这没问题——但然后看看这个，用 256 代替 257：


    ```

    >>> x = 256

    >>> y = 256

    >>> x is y

    True

    ```


    又是 True？

    我们正在进入 Python 的一个深层语言特性，叫做 internment。基本上 Python 确保某些特定数据值的内存中只有一个副本。

    对于这些值，所有变量都将引用内存中的同一项。

    它们是：


    - 介于 -5 和 256 之间（含）的整数。

    - 只包含字母、数字或下划线的字符串。

    - The `None` object.


    这就是为什么 "Beej!" 没有被驻留（因为它包含标点符号），而 "Alice" 被驻留的原因。


    你可以用 `sys.intern()` 来驻留自己的字符串以优化字典查找，但这是 99.99999% 的 Python 程序员永远不会费心去做的事情。


