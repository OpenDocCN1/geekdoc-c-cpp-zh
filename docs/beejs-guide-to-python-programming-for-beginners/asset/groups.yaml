    \n在之前的例子中，我们所有的星舰对象都是相同的且不包含任何信息。\n\n我们需要一种方法在星舰构造时传入这些信息。\n\n我们通过在类内部定义一个特殊函数来实现这一点。\n\
    \n另一个有趣的术语事实：在类内部声明的函数称为方法。\n\n这个特殊函数始终命名为 __init__()（带双下划线），称为构造函数。\n\n让我们为我们的\
    \ StarShip 类添加一个构造函数，允许我们在构造船只时传入船名：\n\n```python\nclass StarShip:\n    def __init__(self,\
