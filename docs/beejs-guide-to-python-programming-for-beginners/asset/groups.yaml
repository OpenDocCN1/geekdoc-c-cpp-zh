    \n类名按惯例使用驼峰命名法！让我们定义那个星舰类！\n\n```python\nclass StarShip:\n    pass\n```\n\n...就这样？那里的\
    \ pass 是什么？\n\n好吧，你抓到我了。出于自卫，我确实说过我们要从简单开始（而且不太正确）。我们那里有一个 StarShip 类，不过它就像一张空白的蓝图。里面什么都没有。\n\
    \n关键字 pass 在 Python 中表示“什么都不做”。它只是用来告诉 Python 这个类内部没有主体。\n\n随机术语事实：我们也说星舰对象是 StarShip\
    \ 类的一个实例。\n\n构造一个新的星舰对象也被称为从类实例化对象。\n\n让我们继续从蓝图制作几个对象。\n\n```python\nclass StarShip:\n\
    \    pass\n\ns0 = StarShip()\ns1 = StarShip()\ns2 = StarShip()\n```\n\n在类名后加上括号，我们是在告诉\
    \ Python 我们正从 StarShip 类创建一个新的星舰对象。事实上，我们制作了三个，并将每个的引用分别保存在 s0、s1 和 s2 中。当然，它们目前还没有名字或位置，但我们很快会解决这个问题。\n\
