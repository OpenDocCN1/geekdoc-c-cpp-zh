    In that example, as we learned earlier, there is one string "Hello" in memory,
    and both x and y refer to it.


    Strings are immutable. So you can''t do something like this:


    ```

    x = "Hello"

    y = x

    ```


    ```

    # Change character at index 2 to ''Z''

    x[2] = "Z"  # ERROR! Strings are immutable--you can''t change them

    ```


    But lists are mutable. We can change something that''s in a list. Let''s do an
    analogous example:


    ```

    x = ["A", "B", "C", "D"]

    y = x


    # Change string at index 2 to ''Z''

    x[2] = "Z"  # Works


    print(x[2])  # "Z"

    print(y[2])  # "Z" also!!!

    ```


    Wait—what happened there? We changed the value in the second index of x, but it
    also changed it in y! How did that happen?


    Remember: it''s because when we did:


    ```

    x = ["A", "B", "C", "D"]

    y = x

    ```


    both x and y came to point to the same list. There is only one list. Both x and
    y refer to it. So if you change that one list, you see that change reflected in
    both x and y.


    (If you could change a string, it would work the same way. But you can''t because
