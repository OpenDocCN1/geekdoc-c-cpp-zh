    \nThere! We successfully handled an error the classic way.\n\nBut now let's learn\
    \ another way.\n\n# 14.5 Error Handling with Exceptions\n\nProblem-solving step:\
    \ Understanding the Problem\n\nExceptions are another way of indicating that something's\
