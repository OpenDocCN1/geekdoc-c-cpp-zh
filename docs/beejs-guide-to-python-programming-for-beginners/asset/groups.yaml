    \ are listed as 99.99. Let's get that out of there and replace it with the real\
    \ distance between the ships.\n\n### Problem-solving step: Devising a Plan\n\n\
    Distance! We see the distance formula up there at the top, repeated here:\n\n\
    d = √(x₀ − x₁)² + (y₀ − y₁)² + (z₀ − z₁)²\n\nHow do we turn that into code?\n\n\
    We could use `math.sqrt()` to get the square root, and `math.pow()` to square\
    \ the numbers.\n\n### Problem-solving step: Carrying Out the Plan\n\nHere's computing\
    \ the distance between points p0 and p1 (both of which are lists of X,Y,Z triples)\
    \ using `math.pow()`:\n\n```python\nd = math.sqrt(\n    math.pow(p0[0] - p1[0],\
    \ 2) +  # difference in Xs\n    math.pow(p0[1] - p1[1], 2) +  # difference in\
    \ Ys\n    math.pow(p0[2] - p1[2], 2)    # difference in Zs\n)\n```\n\nAnd here's\
