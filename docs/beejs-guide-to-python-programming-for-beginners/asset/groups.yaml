    \n## 6.8 循环：for 循环\n\n### 解决问题的步骤：理解问题\n\n除了 while 循环之外，我们还有一种称为 for 循环的“猛兽”。我们稍后会看到它非常强大，但现在我只想讨论按特定次数循环的情况。（与在条件为真时循环相对。）\n\
