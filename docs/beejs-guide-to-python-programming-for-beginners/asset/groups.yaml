    \n| 函数 | 描述 |\n|---|---|\n| len(a) | 返回列表中的元素数量 |\n| enumerate(a) | 迭代列表中的索引/值对\
    \ |\n| a.append(x) | 将变量 x 追加到列表末尾 |\n| a.clear() | 清空列表中的所有元素 |\n| a.copy() |\
    \ 复制列表 |\n| a.count(v) | 统计列表中 v 出现的次数 |\n| a.extend(b) | 将列表 b 的元素添加到列表 a 的末尾\
    \ |\n| a.index(v) | 返回列表 a 中 v 的第一个索引 |\n| a.insert(i,v) | 在列表 a 的索引 i 前插入 v |\n\
    | a.pop() | 移除并返回 a 中的最后一个元素 |\n| a.pop(i) | 移除并返回 a 中索引 i 处的元素 |\n| a.reverse()\
    \ | 反转列表中的元素 |\n| a.sort() | 对列表进行排序 |\n\n让我们打开编辑器，开始尝试这些，看看它们是如何工作的。\n\n这里有一个名为\
    \ listops.py⁶ 的程序正好做了这件事。你也应该尝试这些的变体，以便熟悉它们：\n\n```\na = [5, 2, 8, 4, 7, 4, 0,\
    \ 9]\nprint(len(a))  # 8, the number of elements in the list\na.append(100)\n\
    print(a)  # [5, 2, 8, 4, 7, 4, 0, 9, 100]\n```\n\n换句话说，内存中只有一个值为 [1, 2, 3] 的列表。它同时被\
    \ x 和 z[0] 引用。两个变量引用同一个列表。\n\n在那个例子中，我们如何访问列表中的列表元素？\n\n我们将再次使用方括号表示法，而且会更多。\n\
    \n```\nx = [1, 2, 3]\ny = [4, 5, 6]\nz = [x, y]\n\nprint(z[0]) # z[0] refers to\
    \ x, so this prints [1, 2, 3]\nprint(z[1]) # z[1] refers to y, so this prints\
    \ [4, 5, 6]\n```\n\n到目前为止还不错？\n\n这里需要注意的是：由于 z[0] 和 z[1] 是列表，你可以通过再次使用方括号表示法来访问这些列表中的元素。\n\
    \n让我们尝试从第二个列表中取出数字 6。\n\n```\nprint(z[1][2]) # prints 6\n```\n\n拆解这行代码。发生了什么？\n\
    \n首先 Python 评估它遇到的第一个方括号。它知道 z 是一个列表，因此它评估 z[1] 得到列表 [4, 5, 6]。然后它取该列表并用 [2] 评估它，从而取出\
    \ 6。\n\n另一种思考方式是想象使用括号：\n\n```\n(z[1])[2] # first evaluate z[1], then evaluate\
    \ [2] on the result\nz[1][2]   # this is equivalent to the previous line\n```\n\
    \n（虽然 Python 不介意你这样使用括号，但程序员不会这样做，因为它会让代码看起来很混乱。）\n\n但这给了我们什么？列表的列表很令人兴奋之类的。（对吧？）它们有什么用？\n\
    \n拥有列表的列表实际上为你能表示的数据增加了第二个维度。单个列表可以表示一行数据，而列表的列表可以表示多行或数据网格。\n\n在计算中，网格或多行数据用在哪些地方？\n\
    \n电子表格！还有什么？看看是否能想到其他想法。\n\n对于声明列表的列表，常见的做法是一次性全部声明，而不使用中间变量来表示子列表。\n\n例如，我们上面使用的前一个列表可以更简单地这样声明：\n\
    \n```\nz = [\n    [1, 2, 3],\n    [4, 5, 6]\n]\n```\n\n或者，如果看起来更好并且你的风格指南允许，你可以把它放在一行上：\n\
    \n```\nz = [ [1, 2, 3], [4, 5, 6] ]\n\nprint(z[0][1])  # Prints 2\n```\n\n现在让我们看看是否能把这一切结合起来，完成本章的项目！\n\
    \n## 8.14 章节项目实现\n\n这是重头戏。这个项目将利用我们迄今为止学到的多个内容，并将它们结合成一个可行的解决方案。这使得这个项目比之前的项目更困难。我们将分解问题并决定我们知道哪些工具可以用来解决它。\n\
    \n这就是软件开发的全部内容。\n\n我并不期望答案显而易见。即使是经验丰富的开发者，你也很少会看到一个有明显解决方案的问题。但我们确实有问题解决框架来将问题分解为可操作的部分。所以让我们开始吧！\n\
    \n### 问题解决步骤：理解问题。\n\n我们希望用这个项目完成几件事：\n\n- 在屏幕上打印地图\n- 获取用户输入\n- 使用输入在地图上移动玩家指示器\n\
    - 确保玩家不会穿过墙壁\n- 不断重复直到玩家退出\n\n规范中缺少我们需要知道的内容是什么？\n\n还记得你的指南针方向吗？\n\n```\n    N\n\
    \    |\nW -+- E\n    |\n    S\n```\n\n现在是澄清问题的答案的时候了。现在做比在你写完错误的代码后再做要容易得多！\n\n\
    如果用户提供无效输入会怎样？规范中缺少这部分内容。对于这种情况，让我们打印一条错误信息：\n\n```\nUnknown command: {x}\n```\n\
    \n其中 x 是用户输入的任何内容。\n\n如果玩家试图穿过墙壁会怎样？让我们使用这个错误信息：\n\n```\nYou can't go that way.\n\
    ```\n\n规范中还有其他缺失的内容吗？\n\n### 问题解决步骤：制定计划。\n\n在制定计划时，我们将使用两种重要技术：简化问题和分解子问题。\n\n\
    简化问题意味着取我们最终的目标并移除需求以使其更容易编码。当然，最终我们必须把这些需求加回来，但简化问题使初始编码更容易。\n\n关于这个项目，我们可以简化哪些方面的例子？这里有一些想法：\n\
    \n- 不必在玩家所在位置的地图上放置 @\n- 允许玩家穿过墙壁\n- 无限重复，忽略 q\n- 不验证用户输入\n\n我们最终必须加上这些，但暂时移除它们使达到初始版本变得容易得多。\n\
    \n另一种技术，分解子问题，是我们一直在做的变体的。\n\n让我们从高层次的伪代码开始，然后在需要的地方进行分解。\n\n```\nwhile not quit:\n\
    \    print map and player indicator\n    get input\n    make sure input is valid\n\
    \    make sure we're not moving through walls\n```\n\n我们如何知道分解子问题对这个伪代码有用？第一个线索是有些步骤是实质性的，例如“print\
    \ map and player indicator”立刻会让人想到问题，“我们到底怎么做到这一点？”\n\n如果任何步骤过于复杂或不明确，就意味着你必须进一步分解它们。让我们对所有不明确的部分都这样做：\n\
    \n```\nwhile not quit:\n    print map and player indicator\n    for each row of\
    \ the map:\n        for each column of the map:\n            if this is where\
    \ the player is:\n                print @\n            else:\n               \
    \ print the map character\n\n    get input\n    make sure input is valid\n\n \
    \   if input invalid:\n        print error message\n\n    elif input is \"q\"\
    :\n        quit\n\n    else:\n        figure out the new row and column of the\
    \ player\n\n    if the map at the new player position is \"#\":\n        print\
    \ \"You can't go that way.\"\n    else:\n        set the current position to the\
    \ new position\n```\n\n这好多了。翻译成 Python 会容易得多。\n\n现在……我们将如何存储这个项目所需的数据？以及我们到底需要什么数据？\n\
    \n- 地图表示\n- 玩家当前的位置、行和列\n\n我们将如何存储地图？在规范中，它以文本形式显示，如下所示：\n\n```\n#################\n\
    #...#...........#\n#...#.......#...#\n#...#.......#...#\n#...#.......#...#\n#...#.......#...#\n\
    #...#.......#...#\n#...#.......#...#\n#################\n```\n\n其中 # 是墙，. 是空地板（我们可以穿过）。\n\
    \n我们可以把所有内容存储为一个字符串……但这可能会让我们的生活更困难一些，因为我们必须在玩家所在位置放置一个 @。\n"
