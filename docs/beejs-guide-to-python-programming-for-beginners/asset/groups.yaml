    \ minutes)')\n```\n\n最后，我们要做的就是为 `theaters` 列表中的所有影院调用 `print_theater()`：\n\n\
    ```\n# Main code\nfor t in theaters:\n    print_theater(t)\n```\n\n大功告成！（解决方案⁶）\n\
