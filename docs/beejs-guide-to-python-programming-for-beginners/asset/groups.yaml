  - '[PAGE 114]


    Always use the four problem-solving steps to solve these problems: understand
    the problem, devise a plan, carry it out, look back to see what you could have
    done better.


    1. Write a class that describes a car. What are the attributes the class would
    have? What methods? (There''s no one right answer here—think freely.) (Potential
    Solution³.)


    2. Write a class called SubwayCar that represents a single train car on a subway
    train. What attributes would it have? What methods?


    Add a name attribute to the class so you can name the cars.


    Add a next attribute to the class that points to the next SubwayCar in the train.
    This should refer to the next SubwayCar instance, or to None if it''s the last
    car.


    Have a variable, head, that points at the first subway car.


    This way you can "hook together" a train, like this (pseudocode):


    ```

    head = SubwayCar("Engine")

    car1 = SubwayCar("Passenger car 1")

    car2 = SubwayCar("Passenger car 2")

    car3 = SubwayCar("Passenger car 3")


    head.next = car1

    car1.next = car2

    car2.next = car3

    car3.next = None    # End of the train

    ```


    Now have a variable, location, that is your current location in the train. Start
    it at the head:


    ```

    location = head

    ```


    Then write a loop to "walk" the location variable down the train (by following
    the next pointers), printing out the name of each car as it goes, until it reaches
    the end.


    This famous data structure is actually called a linked list. But I disguised it
    as a subway train to be less intimidating. (Solution¹⁰.)


    3. Make a Room class that has a name attribute.


    Also give it n_to, s_to, w_to, and e_to attributes. These will refer to the rooms
    that are north, south, west, and east of a particular room. None in one of these
    attributes means there''s no exit in that direction.'
