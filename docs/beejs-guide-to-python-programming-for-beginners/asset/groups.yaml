    for that.


    There are tons of modules built-in to Python². Give the list a skim so you know
    what’s there, but you don’t need to drill down at all unless you’re dying of curiosity
    over a particular module.


    Are there are zillions of third-party modules³ you can use, as well.


    You can import as many modules as you want into an individual project.


    # 12.4 Using a Module


    Problem-solving step: Understanding the Problem.


    You declare your intent to use a module with the import keyword. We’re going to
    do an example with the built-in sys module⁴, which contains all kinds of useful
    information about the system.


    Let’s see what platform Python thinks we’re running.


    But first, some syntax.


    When using a function or variable inside a module, you use the dot operator to
    get the variable, similar to how you get attributes from objects. In fact, very
    similar. When you import a module, Python gives you an object by that name with
    functions and data attached to it as attributes.


    Step one is to import the module. Then you can access the members of that module.


    For example, if we:


    ```

    import sys

    ```


    we’ll end up with an object called sys with attributes that you can access!


    Problem-solving step: Devising a Plan


    Digging through the documentation for the sys module, we find there’s something
    called sys.platform that looks really promising.


    Let’s print it!


    Problem-solving step: Carrying Out the Plan


    ```

    import sys  # Gets us access to all the sys goodies

    print(sys.platform)

    ```


    What does it output for you?


    For me, on Linux or Windows WSL, it prints “Linux”. On Windows, it prints “win32”.


    Notice there was nothing we had to do ourselves to make this determination. (Which
    is good, because it would be a pain to write!) Fortunately, the sys module had
    everything we needed right there.


