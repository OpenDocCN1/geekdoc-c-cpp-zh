    \n# 14.13 Exception Objects\n\nProblem-solving step: Understanding the Problem\n\
    \nAt this point, we've covered catching exceptions, and this is all you need to\
    \ know 99% of the time you're using Python.\n\nBut that doesn't mean we should\
    \ stop there. Part of being a good dev is having a good mental model of how these\
    \ things work, not just to memorize some patterns to use. Having a deeper understanding\
    \ will serve you well.\n\nSo let's talk about how exceptions in Python are represented\
    \ by objects.\n\nWe've already hinted at this, above, where we talk about getting\
    \ more information from exceptions.\n\nWe found there is a class named ZeroDivisionError\
    \ and another named ValueError. Indeed, we can just make new ones of these if\
    \ we want:\n\n```\ne = ValueError()  # Construct a new ValueError object\n```\n\
    \nThere's a whole list of exceptions that are ready to use⁴, but if none of those\
    \ seem to fit, you can just make a new Exception with some information passed\
    \ to it:\n\n```\ne = Exception('Something went horribly awry')\n```\n\nLastly,\
    \ you can make your own new exception classes if you'd like. You don't have to—you\
    \ can use Exception or any of the other preexisting ones.\n\nBut if you do make\
    \ your own, the only catch is that these must inherit from the Exception base\
    \ class.\n\nWhoooaaaa, there, Beej. What are you even talking about?\n\nOkay,\
    \ you got me. I stepped into some Object-Oriented Programming terminology, there.\
    \ Now, we'll talk about what that all means in a later chapter, but for now, take\
    \ my word that you need to declare your new exception, you have to use similar\
    \ syntax to this:\n\n```\nclass MyAwesomeException(Exception):  # <-- Note \"\
    (Exception)\"\n    pass\n```\n\nThis is telling Python, \"I'm making a new class\
    \ called MyAwesomeException, but, here's the thing, MyAwesomeException is an Exception.\"\
    \n\nAlso, if you have a constructor, make sure you do this:\n\n```\nclass MyAwesomeException(Exception):\
    \  # <-- Note \"(Exception)\"\n    def __init__(self, *args):  # <-- Get all positional\
    \ args\n        print(\"In my constructor\")\n```"
