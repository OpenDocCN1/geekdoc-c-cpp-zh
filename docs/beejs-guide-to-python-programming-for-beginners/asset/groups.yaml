    \ # [0, 99, 0]\n```\n\n这很重要！即使我们更改了 s0 属性的值，其他对象（如 s1 和 s2）的属性仍然保持不变！（直到我们明确更改它们。）\n\
    \n我们已成功将单个船只的所有信息捆绑到这个单一对象中。很整洁。\n\n## 11.8 关于方法的更多内容\n\n问题解决步骤：理解问题。\n\n记住方法是可以连接到对象的函数。就像你可以把属性看作对象拥有的东西一样，你可以把方法看作对象做的事情。\n\
    \n让我们再添加一个方法来设置船只位置。\n\n```python\nclass StarShip:\n    def __init__(self, name):\
