    | -13.8 | Floating Point | float |

    | 0.0 | Floating Point | float |

    | "Hello!" | String | str |

    | "3490" | String | str |

    | "" | String (empty) | str |


    在上面的示例中，字符串使用双引号（`"`）声明，但也可以使用单引号，只要两端的引号匹配即可：


    ```

    "Hello!" # is the same as ''Hello!''

    ''Hello!'' # is the same as "Hello!"

    ```


    好了，这些都没问题。但 input() 返回的是字符串还是数字？我们在试验时两种情况都看到了，对吧？


    记住使用这四个问题解决步骤来解决这些问题：理解问题、制定计划、执行计划、回顾并看看哪些地方可以做得更好。


    它们是：


    - 1. 制作一个两个数求和代码的版本，使用浮点数而不是整数。数字总是准确相加吗，还是有时会有一点点偏差？教训：*浮点数学并不总是精确的*。有时会有微小偏差。（解法¹²。）

    - 2. 让程序打印出两个数的和与差。（解法¹³。）

    - 3. 允许用户输入 3 个数字，并对其进行运算。（解法¹⁴。）

    - 4. 编写一个程序，允许用户输入 x 的值，然后计算并打印 x²。请记住 `**` 是 Python 中的幂运算符。`3**2` 等于 9。（解法¹⁵。）

    - 5. 编写一个程序，允许用户输入 a、b、c，然后求解这些值的二次公式¹⁶。


    复习一下：对于如下形式的方程：


    a x² + b x + c = 0


    你可以用二次公式求解 x：


    x = (-b ± √(b² - 4ac)) / 2a


    这一切看起来太可怕了！你能感觉到自己的大脑在发紧吗？像被车灯照住的鹿一样不知所措？没关系。这就是开发人员面对新问题时的感受。真的！我们所有人都是如此！但我们要知道，我们有一个问题解决框架，无论问题初看起来多么困难，都可以用它来攻克。


    记住：理解、计划，然后编写代码。


    深呼吸。摆脱恐惧！


    你绝对能做到。这并不比之前的内容更难！开始吧！


    你的程序应该将 a、b、c 代入上述公式，并打印出 x 的结果值。


    确保 b² ≥ 4ac，否则不会有解，而且当你尝试对负数取平方根时会得到“domain error”。一些可以使用的 a、b、c 测试值：5、9、3 或 20、140、60。


    方程中 -b 后面的 ± 符号是什么？那是“加或减”。这意味着实际上有两个方程，一个用 +，一个用 -：


    x_plus = (-b + √(b² - 4ac)) / 2a   x_minus = (-b - √(b² - 4ac)) / 2a


    对于给定的 a、b、c，分别求解并输出两个答案。


    那么 b² - 4ac 的平方根呢？如何计算它？下面是一个计算 2 的平方根的演示程序——用它来学习如何使用 math.sqrt() 函数，然后将其应用到这个问题上。


    ```

    import math    # You need this for access to the sqrt() function

    x = math.sqrt(2)  # Compute sqrt(2)

    print(x)  # 1.4142135623730951

    ```


