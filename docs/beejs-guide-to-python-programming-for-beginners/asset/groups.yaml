    +   - Create new exceptions\n+   - Raise exceptions\n\nThat's not bad so far!\n\
    \n# 14.15 Re-raising Exceptions\n\nSometimes you might be interested in seeing\
    \ that an exception occurred, but don't want to stop it. You want it to continue\
    \ to propagate so that the caller can also see it.\n\nWe can do this pretty simply\
    \ with a lone raise inside the catch.\n\nThe following function notes a ValueError\
    \ if it occurs, but then re-raises it so that it can get caught by the try block\
    \ in the main code:\n\n```\ndef makeint(x):\n    try:\n        return int(x)\n\
    \    except ValueError:\n        print(\"Hey, I saw an exception!\")\n       \
    \ print(\"But I'll let someone else handle it.\")\n        raise  # Re-raise the\
    \ exception\ntry:\n    x = makeint(\"bee\")\nexcept ValueError as v:\n    print(f'Exception:\
    \ {v}')\n```\n\nThis outputs:\n\n```\nHey, I saw an exception!\nBut I'll let someone\
    \ else handle it.\nException: invalid literal for int() with base 10: 'bee'\n\
    ```\n\n# 14.16 Project Implementation\n\nGo ahead and review the project specification\
