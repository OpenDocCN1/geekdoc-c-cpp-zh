    ## 13.2 项目\n\n编写一个行编辑器。\n\n在过去，在终端功能非常强大之前，也在我们拥有像今天这样漂亮的编辑器和 IDE 之前，人们使用行编辑器。这些是使用简单命令编辑文件的简易文件编辑器。\n\
