    For square roots, the preferred way is to use the sqrt() function in the math
    module that you import:


    ```

    import math


    print(math.sqrt(12180100))  # prints 3490.0

    ```


    What about cube roots? Well, for that, we''re going to jump back to exponents
    and learn a little secret. You can raise numbers to fractional powers. Now, there
    are a lot of rules around this, but the short of it is that these equations are
    true:


    √x = x^(1/2)   ∛x = x^(1/3)   ∛x = x^(1/3)


    and so on. Raising a number to the 1/3 power is the same as taking the cube root!


    Like if we wanted to compute the cube root of 4913, we could compute:


    ∛4913 = 4913^(1/3) = 17


    And you can do that in Python with the regular exponent operator **:


    ```

    print(4913**(1/3))  # prints 16.999999999999996

    ```


    Hey—wait a second, that''s not 17! What gives?


    Well, turns out that floating point numbers in computers aren''t exact. They''re
    close, but not exact. It''s something developers need to be aware of and either
    live with or work around.


    Lastly, because square root, cube root, and all the other roots are just exponents
    in disguise, they have the same precedence as exponents: they happen before arithmetic.


