    \ call last):\n  File \"<stdin>\", line 1, in <module>\nValueError: invalid literal\
    \ for int() with base 10: 'manfrengensenton'\n```\n\nHey, it's ValueError again!\
    \ Conveniently, we're already catching that with an appropriate error message.\
    \ Totally handled.\n\nThat takes care of three of the four cases I saw where we\
    \ could get exceptions. What's the fourth?\n\n- Mathematics hat on. Do you see\
    \ it?\n\nThat's right, we're dividing there... and you can't divide by zero. What\
    \ happens when we do?\n\nWe already saw, above, that we get a ZeroDivisionError.\
    \ So let's add that to the end of our code:\n\n```\ntry:\n    x, y = input('Enter\
    \ two numbers separated by a space: ').split()\n    x = int(x)\n    y = int(y)\n\
    \    print(f'{x} / {y} == {x / y}')\nexcept ValueError:\n    print(\"That's not\
    \ two numbers separated by a space!\")\nexcept ZeroDivisionError:\n    print(\"\
    Can't divide by zero!\")\n```\n\nSo as you can see, you can handle as many different\
    \ types of exceptions as you want in their own except clauses after the try.\n\
    \n## 14.8 Catching Multiple Exceptions II\n\nIf you want to handle multiple exceptions\
    \ with the same handler code, you can make a list of them:\n\n```\nexcept (FileNotFoundError,\
    \ PermissionError):\n    print(\"File not found or insufficient permissions\"\
    )\n```\n\nThis isn't as frequently used, since often you want to take a different\
    \ course of action for different exceptions.\n\n## 14.9 Getting More Exception\
    \ Information\n\nEach exception is actually an instance of a class. And the class\
    \ name is the name you use in your except clauses.\n\nBecause it's an instance,\
    \ it has some additional information attached to it we can grab, but first, we\
    \ have to bind it (assign it) to a variable name. We can do that with the as statement.\n\
    \n```python\ntry:\n    1 / 0\nexcept ZeroDivisionError as e:  # e is a reference\
    \ to the exception\n    print(e)\n    print(repr(e))  # Print its representation\n\
    ```\n\nresults in:\n\ndivision by zero\nZeroDivisionError('division by zero')\n\
    \nThat could be useful for getting more detailed information. In our example in\
    \ the previous chapter, we catch ValueError, but we saw three different circumstances\
    \ that could lead to it. We could use this technique to give the user more detailed\
    \ information about the nature of the exception, should we choose.\n\nAll exceptions\
    \ have an attribute called args that is a list of the arguments that are passed\
    \ to the exception when it was created. The first of these is often a human-readable\
    \ error message.\n\nFor instance, this code:\n\n```python\ntry:\n    1 / 0\nexcept\
    \ Exception as e:\n    print(e.args[0])\n```\n\nprints the helpful message:\n\n\
    division by zero\n\nFurthermore, any exception that is based on IOError includes\
    \ the string attribute strerror that contains a human-readable error message corresponding\
    \ to the error. You can find the list of exceptions that are derived from IOError\
    \ in the exceptions documentation².\n\n## 14.10 Catching All Exceptions\n\nA catch\
    \ statement that doesn't specify a particular exception will catch all previously\
    \ uncaught exceptions.\n\nFor this reason, a blank catch should definitely be\
    \ last, after all the other catches. Python will stop at the first catch that\
    \ matches, even if it's a \"catch all\".\n\nWhen you're in any catch, you can\
    \ look at the results from the built-in function sys.exc_info(). This function\
    \ returns a tuple (think \"list\" for now, if you're not familiar with tuples)\
    \ with three pieces of information: the type of the exception, a reference to\
    \ the exception itself, and a traceback³.\n\nLet's mod our division program to\
    \ catch all exceptions and print out the exception info:\n\n```python\nimport\
    \ sys\n\ntry:\n    x, y = input('Enter two numbers separated by a space: ').split()\n\
    \    x = int(x)\n    y = int(y)\n    print(f'{x} / {y} == {x / y}')\n\nexcept:\n\
    \    print(sys.exc_info())\n```\n\nHere are some sample runs:\n\n```\nEnter two\
    \ numbers separated by a space: 1\n(<class 'ValueError'>, ValueError('not enough\
    \ values to unpack (expected 2, got 1)'), <traceback object at 0x7f789974f8b0>)\n\
    ```\n\n```\nEnter two numbers separated by a space: a b\n(<class 'ValueError'>,\
    \ ValueError('invalid literal for int() with base 10: 'a''), <traceback object\
    \ at 0x7f6d0c9732c0>)\n```\n\n```\nEnter two numbers separated by a space: 1 0\n\
    (<class 'ZeroDivisionError'>, ZeroDivisionError('division by zero'), <traceback\
    \ object at 0x7fe2ea373040>)\n```\n\nThis isn't as common, to catch and examine\
    \ exceptions in this way. But it is another tool in your toolbox.\n\nBe careful\
    \ with catch-alls. They might hide exceptions that you weren't expecting and should\
    \ have let through. They're rare in practice.\n\n## 14.11 Finally finally\n\n\
    Problem-solving step: Understanding the Problem\n\nThere's a greater structure\
    \ to be found here. We've already talked about try and catch, but there's a way\
    \ to add code that runs after the try no matter what, regardless of whether or\
    \ not an exception occurred.\n\nIt's the finally clause, and it comes after the\
    \ except clause(s).\n\nAgain, this block of code will run no matter what.\n\n\
    ```\ntry:\n    print(1/1)\nexcept ZeroDivisionError:\n    print(\"Divide by zero!\"\
    )\nfinally:\n    print(\"All done!\")\n```\n\nThe above code will print:\n\n```\n\
    1\nAll done!\n```\n\nIf we modified that first line to print(1/0), we'd get a\
    \ divide by zero exception and the output would be:\n\n```\nDivide by zero!\n\
    All done!\n```\n\nIn all cases, the finally block will run.\n\nYou can use this\
    \ block to execute finalization or cleanup code if you need to.\n\ntry-except\
    \ is really common. finally is less so, but not entirely uncommon.\n\n## 14.12\
    \ What Else? else!\n\nProblem-solving step: Understanding the Problem\n\nJust\
