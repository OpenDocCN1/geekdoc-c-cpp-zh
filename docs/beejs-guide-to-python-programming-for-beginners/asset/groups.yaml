    come up with will be solving the wrong problem! You know you understand the problem
    when you can explain it to someone completely.


    # 2. Devising a Plan


    How are you going to attack this with the tools you have at your disposal and
    the techniques you know? You know you''re done making a plan when you''re able
    to easily convert your plan into code.


    Often when planning you realize there''s something about the problem you don''t
    fully understand. Just for a bit, pop back to Step 1 until it''s clear, then come
    back to planning.


    # 3. Carrying out the plan


    Convert your plan into code and get it working.


    Often in this phase, you find that there was either something you didn''t understand
    or something the plan didn''t account for. Drop back a step or two until it''s
    resolved, then come back here.


    # 4. Looking Back.


    Look back on the code you got working, and consider what went right and what went
    wrong. What would you do differently next time? What techniques did you learn
    while writing the code? Was there any place you could have structured things better,
    or anyplace you could have removed redundant code?


    What''s neat about this is that developers apply the steps of problem-solving
    to the entire program, and they also apply it to the smaller problems within the
    program. A big computing problem is always composed of many subproblems! The problem-solving
    framework is used within the problem-solving framework! An example of a real-life
    problem might be "build a house". But that''s made up of subproblems, like "build
    a foundation" and "frame the walls" and "add a roof". And those are made up of
    subproblems, like "grade the lot" and "pour concrete". In programming, we break
    down problems into smaller and smaller subproblems until we know how to solve
    them with the techniques we know. And if we don''t know a technique to solve it,
    we go and learn one! Being a developer is the same as being a problem solver.
    The problems ain''t easy, but that''s why it pays the big bucks. So you should
    expect that any time you see a programming problem in this book, on a programming
    challenge website, at school, or at work, that the answer will not be obvious.
    You''re going to have to work hard and spend a lot of time to get through the
    first problem-solving steps before you''ll even be ready to start coding.


    # 2.5 What is Python?


    Python is a programming language. This means it''s vaguely readable by humans,
    and completely readable by a machine. (As long as you don''t make the finest mistake!)
    This is a good combination, since people are bad at reading the actual 10110101010110
    code that machines use. We use these higher-level languages to help us get by.


    In this case, another piece of software called the Python interpreter takes the
    code we write in the Python language and runs it, performing the operations we''ve
    requested.


    So before we begin, we need to install the Python interpreter. This is one of
    the most annoyingly painful parts of the whole book, but luckily it only has to
    be done once.


    Okay, gang! Let''s get it... over with! ...I really need to work on the end of
    that inspirational speech.


    # 2.6 Summary


    +   - A programmer is a problem solver. They then write programs that implement
    a solution to that problem.

    +   - A program is a series of instructions that can be carried out by a computer
    to solve the problem.

    +   - The main problem-solving steps are: Understand the Problem, Devise a Plan,
    Carry out the Plan, Look Back.'
