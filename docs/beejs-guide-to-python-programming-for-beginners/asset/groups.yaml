    1\n```\n\n### 15.4 负数\n\n我在这里不多讲，但负数是小于 0 的数，用数字前面的减号表示。−7 表示“比 0 小 7”。\n\n我知道这是个疯狂的概念。比如，桌子上怎么会有\
