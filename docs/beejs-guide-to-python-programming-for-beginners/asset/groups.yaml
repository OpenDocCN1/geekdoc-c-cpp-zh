    \n- 戴上数学帽。你看出来了吗？\n\n没错，我们在那里进行除法... 而除以零是不允许的。做了会怎样？\n\n我们上面已经看到，会得到一个 ZeroDivisionError。所以让我们把它加到代码末尾：\n\
    \n```\ntry:\n    x, y = input('Enter two numbers separated by a space: ').split()\n\
    \    x = int(x)\n    y = int(y)\n    print(f'{x} / {y} == {x / y}')\nexcept ValueError:\n\
    \    print(\"That's not two numbers separated by a space!\")\nexcept ZeroDivisionError:\n\
