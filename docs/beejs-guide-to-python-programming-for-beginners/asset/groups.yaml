    \n## 解题步骤：理解问题。\n\n这个问题乍一看可能并不棘手，但细节会让你措手不及。你可能会想，没问题，我们只需给 Movie 类添加时间，对吧？是的，但是……不同的影院都在放映同一部电影，但放映时间不同。如果你仔细想想，一部电影的放映时间更像是附着在影院上的数据，而不是附着在电影上的数据。迪士尼说：“今年冬天上映：《星球大战47》，晚上8点和10点！”这毫无意义。他们不知道影院什么时候会放映这部电影！那好吧，那我们就把时间挂到\
    \ Theater 类上。\n\n但这又给我们带来了另一个问题。我们如何将一组时间与特定的 Movie 对象关联起来？我们需要在代码中表明它们是关联的，以便可以将它们一起打印出来。\n\
    \n## 解题步骤：制定计划\n\n我们可以用一个新类——称为 MovieTime——来实现，该类既包含对电影的引用，也包含该电影放映的时间列表。然后我们可以将这个新类的实例添加到\
    \ Theater 对象中。这样，如果我们有一个对 Theater 的引用，就可以查找其 MovieTime 对象列表，然后对每一个 MovieTime 对象，查找其中包含的\
    \ Movie 对象引用，并连同时间一起打印出来。我们在中间插入一个新类，同时持有电影和放映时间。这样就能将它们捆绑在一起。\n\n## 解题步骤：执行计划\n\
    \n让我们添加这个新类，它同时持有对电影的引用及其放映时间：\n\n```\nclass MovieTime:\n    \"\"\"Holds a movie\
    \ and the times it is playing\"\"\"\n    def __init__(self, movie, times):\n \
    \       self.movie = movie\n        self.times = times\n```\n\n然后我们需要修改 Theater\
    \ 类，使其保存 MovieTime 对象列表，而不是 Movie 对象列表。\n\n```\nclass Theater:\n    \"\"\"Holds\
    \ all the information about a specific theater.\"\"\"\n    def __init__(self,\
    \ name):\n        self.name = name\n        self.movietimes = []  # <-- Now this\
    \ is MovieTime objects\n```\n\n现在，当我们构建影院信息列表时，需要向影院的列表中添加新的 MovieTime 对象。MovieTime\
    \ 对象包含对所放映电影的引用，以及放映时间列表。\n\n```\n# McMenamin's is showing Star Wars and Shaun\
    \ of the Dead\ntheaters[0].movietimes.append(MovieTime(movies[0], [\"7pm\", \"\
    9pm\", \"10pm\"]))\ntheaters[0].movietimes.append(MovieTime(movies[1], [\"5pm\"\
    , \"8pm\"]))\n\n# Tin Pan is showing Shaun of the Dead and Fastest Indian\ntheaters[1].movietimes.append(MovieTime(movies[1],\
    \ [\"2pm\", \"5pm\"]))\ntheers[1].movietimes.append(MovieTime(movies[2], [\"6pm\"\
    , \"8pm\", \"10pm\"]))\n\n# Tower is showing all three\ntheaters[2].movietimes.append(MovieTime(movies[0],\
    \ [\"3pm\"]))\ntheaters[2].movietimes.append(MovieTime(movies[1], [\"5pm\", \"\
    7pm\"]))\ntheaters[2].movietimes.append(MovieTime(movies[2], [\"6pm\", \"7pm\"\
    , \"8pm\"]))\n```\n\n最后，在打印时，我们需要从 MovieTime 对象中提取电影和放映时间，以便打印：\n\n```\ndef print_theater(theater):\n\
    \    \"\"\"Print all the information about a theater.\"\"\"\n\n    print(f'{theater.name}\
    \ is showing:')\n\n    for mt in theater.movietimes:\n        m = mt.movie\n \
    \       t = \" \".join(mt.times)  # Make string of times separated by spaces\n\
    \        print(f'    {m.name} ({m.genre}, {m.duration} minutes): {t}')\n```\n\n\
    就是这样！\n\n输出现在看起来如下：\n\n```\nMcMenamin's Old St. Francis Theater is showing:\n\
    \    Star Wars (scifi, 125 minutes): 7pm 9pm 10pm\n    Shaun of the Dead (romzomcom,\
    \ 100 minutes): 5pm 8pm\nTin Pan Theater is showing:\n    Shaun of the Dead (romzomcom,\
    \ 100 minutes): 2pm 5pm\n    Citizen Kane (drama, 119 minutes): 6pm 8pm 10pm\n\
    Tower Theater is showing:\n    Star Wars (scifi, 125 minutes): 3pm\n    Shaun\
    \ of the Dead (romzomcom, 100 minutes): 5pm 7pm\n    Citizen Kane (drama, 119\
    \ minutes): 6pm 7pm 8pm\n```\n\n（解法⁷。）\n\n## 解题步骤：回顾。\n\n除了上一次“回顾”中提到的改进之外，我们也许还能在处理时间的方式上稍作改进。\n\
    \n目前，我们将时间存储为字符串，但更好的做法是将它们存储为 Python 标准库⁸中的 datetime 对象。\n\n这样我们就可以对放映时间进行日期运算，例如告诉用户距离下一场放映还有多少分钟。\n\
    \n## 11.14 练习\n\n记住：要从这本书中获得价值，你必须做这些练习。在一个问题上卡了 20 分钟之后，你才可以查看解答。\n\n运用你所拥有的任何知识来解决这些问题，而不仅仅是本章学到的内容。\n\
    \n始终使用四个解题步骤来解决这些问题：理解问题、制定计划、执行计划，并回顾看看自己哪里还能做得更好。\n\n1. 编写一个描述汽车的类。这个类应该有哪些属性？有哪些方法？（这里没有唯一的正确答案——自由思考。）（可能的解法³。）\n\
    \n2. 编写一个名为 SubwayCar 的类，表示地铁列车中的一节车厢。它应该有哪些属性？有哪些方法？\n\n为该类添加一个 name 属性，以便你可以给车厢命名。\n\
    \n为该类添加一个 next 属性，指向列车中的下一节 SubwayCar。它应当指向下一个 SubwayCar 实例，如果是最后一节车厢，则指向 None。\n\
    \n使用一个变量 head 指向第一节地铁车厢。\n\n这样你就可以像这样将列车“挂接”在一起（伪代码）：\n\n```\nhead = SubwayCar(\"\
    Engine\")\ncar1 = SubwayCar(\"Passenger car 1\")\ncar2 = SubwayCar(\"Passenger\
    \ car 2\")\ncar3 = SubwayCar(\"Passenger car 3\")\n\nhead.next = car1\ncar1.next\
    \ = car2\ncar2.next = car3\ncar3.next = None    # End of the train\n```\n\n现在使用一个变量\
    \ location 表示你在列车中的当前位置。将它从 head 开始：\n\n```\nlocation = head\n```\n\n然后编写一个循环，让\
    \ location 变量沿列车“行进”（通过跟随 next 指针），每经过一节车厢就打印其名称，直到到达末尾。\n\n这个著名的数据结构实际上叫做链表。但我把它伪装成地铁列车，以降低吓人程度。（解法¹⁰。）\n\
    \n3. 创建一个具有 name 属性的 Room 类。\n\n同时为它提供 n_to、s_to、w_to 和 e_to 属性。这些属性将引用某个房间北、南、西、东方向的房间。如果其中一个属性为\
    \ None，则表示该方向没有出口。\n\n如果该方向没有房间，打印字符串 \"You can't go that way.\"。\n\n如果用户输入 q，则退出游戏。\n\
    \n（解法¹¹。）\n\n## 11.15 小结\n\n本章内容丰富多彩！我们初次涉足了类与对象的神奇世界，这是学习举世闻名的面向对象编程（OOP）的开端。\n\
    \n我们看到了如何将数据和功能简洁地捆绑到一个方便的类中，并以该类为蓝图创建对象。\n\n而且，重要的是，我们学到了多个变量可以引用同一个对象——赋值时并不会复制对象。\n\
    \n最后，我们提到了 None 可以用来表示“没有对象”。\n\n尽管对象和类构成了 OOP 的基础，但我们还没有真正触及这究竟意味着什么。但那是另一章的故事了。\n"
