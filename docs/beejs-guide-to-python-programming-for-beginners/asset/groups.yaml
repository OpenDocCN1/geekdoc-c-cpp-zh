    \n```\n$ python lineedit.py\nNone\n\n$ python lineedit.py test\ntest\n\n$ python\
    \ lineedit.py test something\nusage: lineedit.py [filename]\n```\n\n完美。接下来是什么？\n\
    \n### 问题解决步骤：制定计划\n\n看起来下一步合理的步骤是将文件读入内存，以便以后可以操作它。\n\n那么有几个问题：\n\n- 我们如何读取文件？\n\
    - 我们将其存储在何处？\n\n对于第一个问题，希望你一直在阅读本章，并了解如何打开文件进行读取以及如何从中读取单行。\n\n但是如何保存所有这些行呢？\n\
    \n想想我们到目前为止讨论过的所有数据结构……列表、字典、对象……文件最像什么？\n\n在接下来的几句话中我剧透之前，先好好想想。\n\n你可能会争辩说每一行都像一个对象。是的。拥有一个代表行的类也不会错。但无论如何你仍然需要存储一个行列表。\n\
    \n天啊，这太明显了！\n\n是的，列表似乎是个好主意。从某种意义上说，文本文件只是一个行列表。\n\n所以让我们一次读取文件一行，并在过程中将其存储到列表中。\n\
    \n这看起来像是一段自包含的代码，所以我将编写一个函数，它接受文件名作为参数，然后返回该文件中所有行的列表。\n\n- 创建一个空列表\n- 打开文件\n\
    - 对于文件的每一行，将其追加到列表中\n- 返回列表\n\n### 问题解决步骤：执行计划\n\n```python\ndef read_file(filename):\n\
    \    \"\"\"Read a file from disk\"\"\"\n    lines = []\n\n    with open(filename)\
    \ as f:\n        for line in f:\n            lines.append(line)\n\n    return\
    \ lines\n\nif filename is not None:\n    lines = read_file(filename)\nelse:\n\
    \    lines = []\n\n# Print it out just to make sure it works right\nprint(lines)\n\
    ```\n\n现在如果我们运行它并指定输入文件名，它应该打印出包含该文件中所有行的列表。\n\n当然，我们需要一个示例输入文件。你可以在 VS Code 中创建一个——只需编辑一个名为\
    \ lines.txt 的新文件并在其中放入你想要的内容。（大约五行适合测试。）如果你不想麻烦，examples 目录中有一个 lines.txt 文件。\n\
    \n运行它，我们就得到了我们想要的列表！\n\n```\n$ python lineedit.py lines.txt\n['This is line 1\\\
    n', 'This is line 2\\n', 'This is line 3\\n',\n'This is line 4\\n', 'This is line\
    \ 5']\n\n$ python lineedit.py\n[]\n```\n\n花点时间消化一下我们做了什么：我们复制了磁盘上的数据并将该副本存储在内存中。\n\
    \n在总体大计划中接下来是什么？看起来可能是时候进行用户输入循环了。\n\n### 问题解决步骤：制定计划\n\n这就像我们到目前为止做过的许多其他输入循环一样：\n\
    \n- 打印提示\n- 解析输入\n- 运行命令\n- 当用户说退出时停止循环\n\n### 问题解决步骤：执行计划\n\n你的标准输入循环。它唯一能做的就是让你输入\
    \ q：\n\n```\n# Main loop\n\ndone = False\n\nwhile not done:\n    command = input(\"\
    > \").strip()\n\n    if command[0] == 'q':\n        done = True\n```\n\n如果你按 RETURN，它会立即报错，因为如果字符串为空，command[0]\
    \ 就不存在。\n\n这里常见的操作是如果用户输入空行就打印另一个提示。我们可以在 input() 行之后添加以下内容来实现：\n\n```\n# if the\
    \ user entered a blank line, just give them another prompt\nif command == '':\n\
    \    continue\n```\n\n最后，让我们添加一些输出作为 else，以告诉用户如果他们输入了我们不识别的内容：\n\n```\nelse:\n\
    \    print(\"unknown command\")\n```\n\n好的！现在如果我们运行它，我们应该能够处理空行、未知命令以及 q 退出。\n\
    \n```\n$ python lineedit.py lines.txt\n> x\nunknown command\n>\n        [ user\
    \ hit RETURN a few times here ]\n>\n>\n> q\n$\n```\n\n到目前为止这还不是一个很好的编辑器，但 Facebook\
    \ 也不是一天建成的。我们只是慢慢地把各个部分放好。\n\n接下来做哪一块好呢？有很多选择，因为现在我们已经到了实现各种命令处理程序的地步（除了我们刚刚做的退出命令之外）。\n"
