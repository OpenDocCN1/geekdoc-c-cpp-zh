    \n负数乘以负数，结果是正数。\n\n−3 × −7 = 21\n\n负数乘以正数，结果是负数。\n\n−3 × 7 = −21\n\n负数加上正数，就像从正数中减去这个负数：\n\
    \n−7 + 100 = 93\n\n或者，等价地：\n\n100 + (−7) = 100 − 7 = 93\n\n### 15.5 绝对值\n\n可以把绝对值想象成数轴上任何数离\
    \ 0 有多远。\n\n10 离 0 有 10 远。10 的绝对值是 10。\n\n2.8 离 0 有 2.8 远。2.8 的绝对值是 2.8。\n\n嗯，这似乎有点平淡。为什么要费心？\n\
    \n原因在这里：\n\n−17 离 0 有 17 远。−17 的绝对值是 17。\n\n规则是：\n\n- 正数的绝对值是它本身。\n- 负数的绝对值是它的相反数，也就是它的正数版本。\n\
    \n总而言之，如果是负数，绝对值会把它变成正数。\n\n在数学符号中，我们用竖线表示绝对值：\n\nx = −17 如果 x 是 −17...\n|x| =\
    \ 17 ...那么 x 的绝对值是 17。\n|12| = 12 12 的绝对值是 12。\n| −13.8 | = 13.8 −13.8 的绝对值是 13.8。\n\
    \n在 Python 中，我们使用内置函数 `abs()` 计算绝对值：\n\n```\nprint(abs(-17))  # 17\nprint(abs(28.2))\
    \  # 28.2\n```\n\n就优先级而言，你可以把绝对值看成类似括号的东西。先计算绝对值内部的内容，然后再对结果取绝对值。\n\n### 15.6\
    \ 指数的威力\n\n假设你想把数字 7 自己乘自己，比如 8 次。我们可以这样写：\n\n7 × 7 × 7 × 7 × 7 × 7 × 7 × 7\n\n\
    我想这还不算太糟。\n\n那就更进一步。我想把 7 自己乘自己 3490 次。你处理这件事的时候，我要去酒吧了。完成后告诉我。\n\n幸运的是，数学家们很懒。他们讨厌多写东西，所以凭空发明新的记法来避免额外的工作。就像我不断把厨房垃圾压实，这样就不用跑出去倒一样。\n\
