    +   - Cats are superior to dogs OR dogs are superior to cats.


    All right! Now one more thing to remember: unless there are parentheses in an
    expression saying otherwise, AND takes precedence over OR. That is, do the ANDs
    first, and then do the ORs.


    Level: Advanced.


    Let''s say it''s raining, I''m over 25, and this fish is big. We could evaluate
    this expression:


    It''s sunny AND this fish is big OR I''m over 25.


    We do the AND first. It''s not sunny, and the fish is big. So that''s "false AND
    true", which evaluates to "false".


    So replace that AND expression with "false". And then we''ll do the OR:


    false OR I''m over 25.


    Now I am over 25, so that evaluates to "false OR true", which is "true".


    So the entire expression is true.


    And you can override with parentheses:


    It''s sunny AND (this fish is big OR I''m over 25).


    Do the work in parens first. So now we evaluate the OR, which evaluates to "true
    OR true" which is "true". Then we evaluate the AND, which is "It''s sunny AND
    true", which is "false AND true", which is "false".


    So the entire expression is false.


    Let''s do some examples with numeric conditional expressions. Do these evaluate
    to true or false?


    +   - 1 < 5

    +   - 5 > 1

    +   - 1 < 5 AND 5 < 10

    +   - 1 < 5 OR 5 < 10

    +   - 1 < 5 AND 5 > 10 OR 10 > 20

    +   - 1 < 5 AND (5 > 10 OR 10 > 20)


    Answers:


    +   - True

    +   - True

    +   - True AND True = True

    +   - False OR True = True

    +   - True AND False OR False = False OR False = False

    +   - True AND (False OR False) = True AND False = False


    Sometimes developers (but more usually hardware folks) describe these operations
    in what are called truth tables. A truth table shows what the result of a Boolean
    expression will be for some given inputs.


    Often these tables use 1 to represent True and 0 to represent False.


    Here are some truth tables for the operations we''ve seen so far.


    | A | B | A AND B |

    |---|---|---|

    | 0 | 0 | 0 |'
