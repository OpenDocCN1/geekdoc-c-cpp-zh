    # Chapter 19


    # Accelerating Beyond IDLE


    # 19.1 Objectives


    +   - Install a real IDE

    +   - Learn about the *command line*.

    +   - Get your terminal/shell up and running, and explain how it''s used


    # 19.2 What with the What Now?


    We''ve been using IDLE to edit code, and that''s fine to get started. But it''s
    a little bit underpowered for getting to the next level when it comes to programming.


    In this section, we''ll look at some tools that professional programmers use to
    get the job done.


    # 19.3 The Terminal


    Back in the day, people accessed mainframes through dedicated pieces of hardware
    called *terminals*. These looked like old TV sets with keyboards attached. Screens
    were typically monochrome, either white, green, or amber colored, with pixely
    text.


    Barely anyone has a real terminal anymore, but they have programs called *terminal
    emulators* that pretend to be terminals. In fact, real terminals are so rare,
    and terminal emulators are so common, if you hear someone say "terminal", they''re
    certainly talking about a terminal emulator.


    So a terminal emulator is a program you run that gives you a text window to interact
    with your computer.


    You know how you point, click, and drag with the mouse to command your computer
    to do things? We''re going to do the same things, except we''re going type commands
    in to get them done, instead.


    # 19.3.1 The Shell


    Sometimes you''ll hear people talk about the "shell" and "terminal" interchangeably.


    Technically, though, the terminal is what you launch, and then the terminal immediately
    launches another program, the *shell*, that you interact with.


    The terminal is pretty dumb on its own. All it does is handle input from the keyboard
    and output to its "screen". It''s the middleperson between you and the shell.
    The shell is the real brains of the outfit.


    The shell is a program that takes your typed-in commands and executes them, and
    tells you if something went wrong.'
  - '[PAGE 190]


    The most popular shell program on Unix-likes and Macs is the Bourne Again Shell
    (Bash)¹, although the Z-shell (Zsh) is growing in popularity. Bash is known by
    a $ prompt (sometimes prefixed with other information about which directory you''re
    in, or something similar). Zsh uses a % prompt.


    There are multitudes of shells, but we''ll just assuming you''re going to use
    Bash or Zsh (with a hat-tip to Windows''s built-in shells), and they''re compatible
    enough for our purposes.


    # 19.3.2 Windows Terminals and Shells


    For Windows, there are plenty of options, some of which you have installed already.


    +   - CMD: classic shell with origins way back in the MS-DOS days.

    +   - PowerShell: a new, more powerful shell.

    +   - Bash via Git: the famous Git² software package has a bash shell called,
    appropriately, gitbash.

    +   - Bash via WSL: if you install WSL (below), it uses bash, as well.


    Unless you''re going with one of the bash options, you should use PowerShell because
    it''s newer, better, and maintained.


    Almost all of the bash commands we use in this guide also work in PowerShell and
    CMD.


    Hitting the Windows key and running cmd will bring up the CMD prompt. (Type exit
    to get out.)


    Hitting the Windows key and running PowerShell will bring up the PowerShell prompt.
    (Type exit to get out.)


    # 19.3.3 Windows gitbash


    Git³ is a source code control system. And it''s great. Tons of people use it.
    You should install it.


    When you install it, it installs a bash shell called gitbash that you can use.


    # 19.3.4 Windows WSL


    The Windows Subsystem for Linux is an awesome piece of kit. It unobtrusively puts
    a little Linux install on your Windows machine. And then you can use the Linux
    command line.


    To install Follow the WSL setup instructions⁴


    There''s a recommendation in there to also install Windows Terminal, an alternate
    terminal to the existing ones. It''s a good choice.


    After installing, update the system:


    ```

    sudo apt update

    sudo apt -y upgrade

    ```


    and Python should be there; running this should get you the version number:


    ```

    python3 --version

    ```


    You can open a File Explorer window with:


    ```

    iexplore.exe .

    ```


    (Yes, that''s a period after a space at the end.)


    # 19.3.5 Mac


    Macs come with a terminal built-in. Run the Terminal app and you''ll be presented
    with a bash shell prompt.'
