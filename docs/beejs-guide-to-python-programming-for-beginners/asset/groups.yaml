  mdcn: "\n我们在这里开始深入探讨的是面向对象编程的世界。要讨论它的一切肯定会信息过载，所以我们只是在这里从基础开始，后续会重新审视一些概念。\n\n这里有一些术语，延续上面星舰的例子。\n\
