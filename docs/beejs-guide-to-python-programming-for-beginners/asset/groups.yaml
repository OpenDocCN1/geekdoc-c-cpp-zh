    \n### 第 4 行：返回结果\n\n函数可以可选地返回一个值。你知道参数是一种将数据传入函数的方式吗？返回值是把数据从函数传回调用者的方式。\n\n回到函数被调用的地方，你可以把函数调用看作具有返回值。然后你可以做诸如将其赋给变量之类的操作。\n\
    \n### 第 6 行：将返回结果捕获到变量中\n\n我们调用函数，并将该函数的返回值赋给变量 `answer`。然后我们可以对其进行操作，例如在第 7 行将其打印出来。\n\
    \n问题解决步骤：回顾。\n\n在上面编写的函数中，我们使用了大量变量来帮助演示围绕函数的许多概念和思想。\n\n但实际上，开发人员可能会将上面的代码简化为：\n\
    \n```\ndef do_the_math(x):\n    return (x + 13) * 7\n\nprint(do_the_math(30))\n\
    ```\n\n比较两者，直到你确信它们是等价的。\n\n## 10.7 多返回值\n\n问题解决步骤：理解问题。\n\n你始终可以从函数返回列表、字典或任何东西，但你也可以返回两个值并将它们赋给不同的变量。\n\
    \n```\n# Function that returns the argument times 10, and divided by 10\n\ndef\
    \ timesdiv10(x):\n    return x * 10, x / 10\n\na, b = timesdiv10(100)\n\nprint(a,\
    \ b)  # 1000 10\n```\n\n或者你可以将结果赋给单个变量。结果将是一个元组，它是一个只读列表，你可以用方括号表示法访问它：\n\n```\n\
    a = timesdiv10(100)\n\nprint(a[0], a[1])  # 1000 10\n```\n\n神奇！\n\n## 10.8 什么构成一个好的函数\n\
    \n问题解决步骤：理解问题。\n\n最大的规则是“只做一件事并做好它”。\n\n这更像是一个指导方针而不是规则，因为在编程方面你是老板。\n\n但这是一个很好的指导方针，只要能做到就应该遵循。\n\
    \n你使用函数的主要用途是：\n\n- 数学方程\n- 任何重复发生的事情\n- 将代码分解为更小、独立的部分\n\n让我们更详细地谈谈最后一项，因为它不太明显。\n\
    \n非常频繁——几乎总是——你会从需要执行的一系列步骤开始来解决这个问题，像这样：\n\n```\n# While we still have data to\
    \ process\n# Process the data\n# Output the data\n```\n\n然后你进去填充处理数据和输出数据的所有代码。\n\
    \n但这可能会导致臃肿、难以阅读的 while 循环。最好这样编码：\n\n```\nwhile d in data:\n    d = process(d)\n\
    \    output(d)\n```\n\n然后编写函数 `process()` 和 `output()` 来操作传入的数据。\n\n这使得循环的逻辑非常容易阅读。而易读性是王道（如果你愿意，也可以说是女王）。\n\
    \n如果你发现有大量代码变得深度嵌套，也许是时候将它们拆分为函数了，即使你只从那个单一位置调用这些函数。\n\n知道何时将代码拆分为函数更多是一种艺术而非科学。如果你开始觉得代码有点难以处理，请考虑将其拆分为不同函数后的样子。如果你更喜欢这样，就去做吧！\n\
    \n## 10.9 位置参数与关键字参数\n\n问题解决步骤：理解问题。\n\n我们稍后会更详细地讨论这个问题，但函数参数在 Python 中可以分为这两个大类：位置参数和关键字参数。\n\
    \n位置参数是必须在函数调用中出现在特定位置的参数。\n\n例如，如果我们想计算 14^12，我们需要以特定顺序将这两个参数传递给 `math.pow()`\
    \ 函数，该函数期望底数在前，指数在后：\n\n```\nmath.pow(14, 12)  # 56693912375296.0\n```\n\n如果你把\
    \ 12 放在前面，你会得到不同的答案。这些是位置参数。\n\n但对于某些函数，在位置参数之后，你可以指定额外的关键字参数。这些参数由特定名称标识。\n\n\
    例如，通常 `print()` 会在字符串末尾加上换行符。但你可以通过 `end` 关键字参数覆盖此行为，告诉 `print()` 在行尾放置空字符串（即什么都不放）：\n\
    \n```\n# Together, prints \"Beej\" on a single line\n\nprint(\"Be\", end=\"\"\
    )\nprint(\"ej\")\n```\n\n注意我们必须按名称标识关键字参数。\n\n如果你查阅文档，你可能会看到类似这样的内容（`print()`\
    \ 的文档）：\n\n```\nprint(*objects, sep=' ', end='\\n', file=sys.stdout, flush=False)\n\
    ```\n"
