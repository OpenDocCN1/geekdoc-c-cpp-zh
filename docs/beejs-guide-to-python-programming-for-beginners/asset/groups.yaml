    \n让我们开始吧！\n\n### 问题解决步骤：理解问题。\n\n如果需要，请回顾之前的规范，但该程序的基本组成部分是：\n\n- 解析命令行以获取文件名\n\
    - 读取文件\n- 写入文件\n- 读取用户命令作为输入\n- 在屏幕上列出文件\n- 向文件追加行\n- 编辑现有行\n- 删除行\n\n所以首先，确保我们知道这些都是做什么的。\n\
    \n然后我们就开始进攻。\n\n### 问题解决步骤：制定计划\n\n这次我们要做点不同的事情。我们将制定一个总体计划，然后在规划和执行由该较大计划组成的子计划之间来回切换。\n\
    \n> 这有点像双刃剑，需要练习和经验才能做好。你不想过度规划，因为你肯定需要改变一些东西，而你不想浪费时间。而且你也不想规划不足，因为隐藏的陷阱可能会……以后困扰你。你想要规划恰到好处的数量。不管那是什么。实际上，开发者\
    \ consistently 规划不足。而且他们仍然 somehow 让它工作，就像魔法一样。而“魔法”我的意思是大量的汗水、眼泪和粗俗的语言。\n\n能够做到这一点是非常重要的技能需要练习。软件开发真正发生的地方就在这里。剩下的编码只是写下来而已。\n\
    \n所以让我们根据上面“理解问题”中的大纲，做一个粗略的总体规划。\n\n- 首先我们将从命令行获取文件名。\n- 然后我们将读取文件。\n- 然后我们将循环获取用户想要执行的操作的输入（追加、列出、编辑、写入等）\n\
    - 对于用户输入的任何内容，我们将执行该操作。\n- 当用户输入 q 退出时，我们将退出。\n\n这是一个相当宽松的计划。我的意思是，“我们将做那件事”并不是说得特别详细。但我们知道它们是可以实现的，而且我们可以一次一个地处理这些单独的命令组件（因为它们彼此之间并没有真正的依赖关系）。\n\
    \n看起来其中一些我们可以马上开始做。\n\n### 问题解决步骤：制定计划\n\n让我们从简单开始。简化问题始终是完成零碎部分的好方法。此外，尽早让一个最小可工作的部分运行起来可以帮助指导我们的努力并保持动力。先建立一个核心部分，然后继续添加。\n\
    \n程序的简单版本是什么？\n\n好吧，我们可以先查看命令行，看看是否有文件名，如果有就存储它。\n\n记住用户可以选择在不指定文件名的情况下运行程序（因为也许他们正在创建新文件）。\n\
    \n所以我们想要检查 sys.argv 中的命令行参数。如果用户指定了文件名，我们将存储它。如果没有，我们将存储 None 来表示这种情况。如果他们指定了多个参数，我们将打印出使用信息。\n\
    \n太好了！让我们开始吧！\n\n### 问题解决步骤：执行计划\n\n```\nimport sys\n\n# Parse the command line\n\
    \nif len(sys.argv) == 2:\n    filename = sys.argv[1]\n\nelif len(sys.argv) ==\
    \ 1:\n    # We’ll use this as a sentinel value later if we need to prompt for\n\
