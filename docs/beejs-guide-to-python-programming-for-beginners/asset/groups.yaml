    # 15.8 Square root


    Square root is a funny one. It''s the opposite of squaring, which if you remember
    from the earlier section means raising to a power of 2. But, again, square root
    is the opposite of that.


    It''s asking the question, “For a given number, which number do I have to multiply
    by itself to get that number?”


    Let''s exemplify!


    But before we do, the weird lightning bolt line thing is the mathematical symbol
    for the square root of a number.


    Let''s ask for the square root of 9:

    √9 = ?


    That''s asking, what number multiplied by itself makes 9? Or, in other words,
    what number raised to the 2nd power makes 9? Or, in other words, what number squared
    makes 9?


    Hopefully by now you''ve determined that:

    3 × 3 = 9

    and, equivalently:

    3² = 9

    so therefore:

    √9 = 3


    What about some other ones?

    √16 = ? √25 = ? √36 = ? √1218100 = ?


    Note that all of those have integer answers. If the square root of number is an
    integer, we call that number a perfect square. 16, 25, 36... these are all perfect
    squares.


    But you can take the square root of any number.

    √17 = 4.123105625617661 approximately.


    17 is not a perfect square, since it doesn''t have an integer result.


    Now, you might be imagining what would happen if you tried to take the square
    root of a negative number:

    √−100 = ?


    After a bit of thought, you might realize that no number multiplied by itself
    can ever result in −100 so...

    what can you do?


    You might think, “We''re doomed,” but not mathematicians! They simply defined:

    √−1 = i


    and invented an entire mathematical system around what they called imaginary numbers³
    that actually have some amazing applications. But that''s something you can look
    up on your own.


    In addition to square roots, there are also cube roots. This is asking, “What
    number cubed results in this number?” This is indicated by a small 3 above the
    root symbol:

    ∛27 = x


    which is the inverse of the equation:

    x³ = 27


    Can you figure out what x is?


    What about how to do this in Python?'
