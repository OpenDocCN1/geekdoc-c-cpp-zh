    终端本身很笨。它所做的只是处理键盘输入和输出到其 "screen"。它是你和 shell 之间的中间人。shell 是这个装置的真正大脑。


    shell 是一个程序，它接收你输入的命令并执行它们，并告诉你是否出了问题。


