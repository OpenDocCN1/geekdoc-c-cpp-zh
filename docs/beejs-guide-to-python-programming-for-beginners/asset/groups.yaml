    \ IOError 派生的异常列表。\n\n## 14.10 捕获所有异常\n\n不指定特定异常的 catch 语句会捕获所有先前未捕获的异常。\n\n因此，空白的\
    \ catch 应该 definitely 放在最后，在所有其他 catch 之后。Python 会在第一个匹配的 catch 处停止，即使它是“捕获所有”。\n\
    \n当你在任何 catch 中时，你可以查看内置函数 sys.exc_info() 的结果。该函数返回一个元组（如果你不熟悉元组，就把它想成“列表”）包含三条信息：异常的类型、对异常本身的引用，以及\
    \ traceback³。\n\n让我们修改我们的除法程序以捕获所有异常并打印出异常信息：\n\n```python\nimport sys\n\ntry:\n\
    \    x, y = input('Enter two numbers separated by a space: ').split()\n    x =\
    \ int(x)\n    y = int(y)\n    print(f'{x} / {y} == {x / y}')\n\nexcept:\n    print(sys.exc_info())\n\
    ```\n\n这里有一些示例运行：\n\n```\nEnter two numbers separated by a space: 1\n(<class 'ValueError'>,\
    \ ValueError('not enough values to unpack (expected 2, got 1)'), <traceback object\
    \ at 0x7f789974f8b0>)\n```\n\n```\nEnter two numbers separated by a space: a b\n\
    (<class 'ValueError'>, ValueError('invalid literal for int() with base 10: 'a''),\
    \ <traceback object at 0x7f6d0c9732c0>)\n```\n\n```\nEnter two numbers separated\
    \ by a space: 1 0\n(<class 'ZeroDivisionError'>, ZeroDivisionError('division by\
    \ zero'), <traceback object at 0x7fe2ea373040>)\n```\n\n这种方式捕获并检查异常并不常见。但它是你工具箱中的另一个工具。\n\
    \n谨慎使用捕获所有。它们可能会隐藏你未预料到且本应放行的异常。实际上它们很少见。\n\n## 14.11 最后 finally\n\n问题解决步骤：理解问题\n\
    \n这里有一个更大的结构。我们已经讨论过 try 和 catch，但有一种方法可以添加无论发生什么、无论是否发生异常都会运行的代码。\n\n它是 finally\
    \ 子句，位于 except 子句之后。\n\n再次强调，这段代码无论如何都会运行。\n\n```\ntry:\n    print(1/1)\nexcept\
    \ ZeroDivisionError:\n    print(\"Divide by zero!\")\nfinally:\n    print(\"All\
    \ done!\")\n```\n\n上述代码将打印：\n\n```\n1\nAll done!\n```\n\n如果我们把第一行改为 print(1/0)，我们会得到除零异常，输出将是：\n\
    \n```\nDivide by zero!\nAll done!\n```\n\n在所有情况下，finally 块都会运行。\n\n如果需要，你可以使用这个块来执行最终化或清理代码。\n\
    \ntry-except 非常常见。finally 则没那么常见，但也不算完全罕见。\n\n## 14.12 还有什么？else！\n\n问题解决步骤：理解问题\n\
    \n就当你以为 try-except-finally 就是全部时，原来我们可以在其中添加 else，形成 try-except-else-finally。\n\
