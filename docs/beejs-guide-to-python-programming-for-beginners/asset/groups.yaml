    ```\n```\n\n+   - **Call by Value:** a copy of the argument is made and stored\
    \ in the parameter. The C programming language, among others, uses this one. (Sometimes\
    \ people say Python uses Call by Value, but this is technically not accurate since\
    \ parameters are not copied when they are passed in; only the reference to the\
    \ argument is copied. You can make Python simulate Call by Value by making a copy\
