    - 我们会一直循环到 range() 参数之前的一个数。到达但不超过该参数。\n\n但等等，还有更多！range() 多才多艺！它不仅能从零数到接近某个数字，你还可以给它另一个起始点：\n\
    \n```\nfor i in range(5, 10):  # loop from 5 to 9\n    print(i)\n```\n\n现在你愿意出多少钱？它能切片、能切丁！但我们还没说完！你还可以告诉\
