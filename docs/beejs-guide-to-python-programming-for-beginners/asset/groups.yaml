    \ 和 `y` 都引用它。所以如果你更改了那一个列表，你就会在 `x` 和 `y` 上都看到这一变化。\n\n（如果你能更改字符串，它也会以同样的方式工作。但你不能，因为它是不可变的。）\n\
    \n- 可变类型包括以下这些（其中一些我们还没有讨论过）：\n    - 列表\n    - 字典\n    - 对象¹\n    - 集合\n\n如果你想要列表的副本，而不只是引用的副本，该怎么办？你可以用多种方式强制复制列表，这里有三种常见的方式：\n\
    \n```\nb = a.copy()    # Copy with .copy() method\nb = list(a)     # Copy with\
    \ the list() function\nb = a[:]        # Copy by slicing the entire list\n```\n\
    \n### 8.5 `for` 与列表——强大的组合\n\n问题解决步骤：理解问题。\n\n还记得我们的老朋友 `for` 循环吗？我们用它与 `range`\
    \ 一起循环特定次数，也用它与字符串一起遍历字符串中的每个字符。\n\n我们还可以将它与列表²一起使用，按顺序对每个列表元素进行操作！\n\n下面是一个简单的例子，它打印列表中的所有元素：\n\
    \n```\nx = [11, 55, 33, 99]\n\nfor i in x:\n    print(f\"element is: {i}\")\n\
    ```\n\n这将输出：\n\n```\nelement is: 11\nelement is: 55\nelement is: 33\nelement is:\
    \ 99\n```\n\n但是等等，还有更多！\n\n回想一下上面的内容：如果你知道元素的索引，就可以从列表中取出该元素，例如 `x[2]`。\n\n让我们用另一种方式将这些组合起来使用\
    \ `for` 和列表。这个例子与上面做的是同一件事，只是方式不同：\n\n```\nx = [11, 55, 33, 99]\n\nfor i in range(4):\n\
    \    print(f\"element is: {x[i]}\")\n```\n\n虽然这不是地道的 Python³ 风格（第一个例子更好），但它演示了如何使用变量作为索引。我们在循环内部引用\
    \ `x[i]`，然后让 `i` 变化以遍历每个元素的索引。\n\n让我感到别扭的是，`range()` 中硬编码了 `4`。它只适用于长度为 4 的列表。让我们看看能否修复它。\n\
    \n剧透一下：你可以使用 `len()` 获取列表中的元素数量。\n\n让 `range()` 上升到“列表的长度”，而不是 `4`：\n\n```\nx\
    \ = [11, 55, 33, 99]\n\nfor i in range(len(x)):     # <--\n    print(f\"element\
    \ is: {x[i]}\")\n```\n\n现在它适用于任何长度的列表——好多了！\n\n### 8.6 `for` 与 `enumerate()`\n\
    \n问题解决步骤：理解问题。\n\n在上面的例子中，我们用 `for` 遍历了列表中的元素本身，也用 `range()` 遍历了列表中元素的索引。\n\n\
    如果你想同时做到这两点呢？也就是说，你既想要元素，又想要索引？\n\n有一个值得一提的函数是 `enumerate()`。它会遍历列表中的每个元素，返回元素及其索引。你可以同时得到它们！\n\
    \n```\nx = [11, 55, 33, 99]\n\nfor i, v in enumerate(x):\n    print(f\"The element\
    \ at index {i} has value {v}\")\n```\n\n"
