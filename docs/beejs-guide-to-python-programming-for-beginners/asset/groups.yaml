    # Chapter 4


    # How do I write a program?


    # 4.1 Objectives


    +   - Edit some source code in the IDLE editor.

    +   - Run that program.


    # 4.2 The Problem That Needs Solving


    Let''s use our problem-solving framework!


    +   1. **Understand the Problem:** We want to write a program that prints a neat
    little message to the screen.

    +   2. **Devise a plan**

    +      1. Run IDLE.

    +      2. Open a new file from the File pulldown.

    +      3. Write code and save it to that file.

    +      4. Run your program from within the IDE.

    +   3. **Carry out the Plan:** This is where we execute our plan. We''ll do that
    in the following sections.

    +   4. **Look Back:** We''ll do this, below, as well. In future chapters, we''ll
    leave these last two off the number list and just do them in subsequent sections.


    Let''s go!


    # 4.3 Launching your IDE and Opening a File


    Run IDLE as discussed in the previous chapter.


    Once in there, we''re going to make a new file.


    It used to be that everyone who used computers knew what a file was. But these
    days, many people use computers for years without encountering the concept.


    So! A file is a collection of data with a name. Examples of files would be images,
    movies, PDF documents, music files, and so on.


    The name indicates something about the contents of the file. Generally. It really
    can be anything, but that would be misleading, like labeling a box of raisins
    as "Chocolate".


    The name is split into two parts, commonly, separated by a period. The first part
    is the name, and the second part is the extension. Confusingly sometimes people
    refer to the name and extension together as the "name", so you''ll have to rely
    on context.


    Sometimes, depending on the system, the extension is optional.


    As an example, here''s a complete file name and extension:'
  - '[PAGE 16]


    {.default} hello.py


    There we have a file named hello and an extension .py. This is a common extension
    that means “this is a Python source code file”.


    Pull down “File → New” and that’ll bring up a blank window.


    And let’s enter some code!


    Type the following¹ into the editor (the line numbers, below, are for reference
    only and shouldn’t be typed in):


    ```

    print("Hello, world!")

    print("My name''s Beej and this is (possibly) my first program!")

    ```


    We’re (almost) ready to run!


    # 4.4 Running the Program!


