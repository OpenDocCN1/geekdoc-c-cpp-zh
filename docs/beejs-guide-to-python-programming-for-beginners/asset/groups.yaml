    \n指数必须是非负数，也就是零或更大。\n\n但等等——零？你怎么把一个数自己乘零次？这是个合理的问题，也是自古以来困扰哲学家的问题。但数学家不会！就像权力狂热的数字独裁者一样，他们喊道：“这是我们发明的，我们宣布任何数的零次方都是\
