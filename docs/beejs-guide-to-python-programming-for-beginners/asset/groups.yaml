    \n最终，我们将编写代码来表达“如果某个条件为真，则做一件事”或“如果某个条件为假，则做另一件事”。\n\n但在那之前，我们必须认识一个人：乔治·布尔。\n\
    \n## 6.4 布尔代数和表达式\n\n问题解决步骤：理解问题。\n\nGeorge Boole¹ 是一个相当有趣的人物。从 19 世纪早期的平凡出身开始，他发展出了在许多方面成为现代计算基础的数学。相当了不起。\n\
    \n他所发展的是我们今天所称的布尔代数。\n\n别担心——它比你想的那种代数更容易。事实上，你已经知道了，只是没有正式地、也不以这个名字。\n\n在布尔逻辑中，我们关心表达式是真还是假。然后我们可以据此做出决策。\n\
    \n在进入计算机内容之前，我们先做一些人类相关的例子。\n\n难度：简单。以下表达式对你来说是真还是假？\n\n- 我住在北美。\n- 现在正在下雨。\n\
    - 猫优于狗。\n\n希望这并不特别具有挑战性。让我们通过引入 AND 的概念来提高难度。对于这些情况，整个表达式只有在所有子表达式都为真时才为真。\n\n\
    例如，陈述“我身高超过 190 厘米 AND 我年龄小于 30 岁”是假的。虽然我身高超过 190 厘米，但我不是小于 30 岁，所以整个表达式为假。\n\n\
    相比之下，“我喜欢狗 AND 我喜欢摩托车”为真，因为这两个子表达式都为真。\n\n如果两者都不是真，结果也为假。\n\n难度：中等。以下表达式对你来说是真还是假？\n\
    \n- 我住在欧洲 AND 我年龄大于 25。\n- 现在正在下雨 AND 现在正在阳光明媚。\n- 猫优于狗 AND 狗优于猫。\n\n好吧！让我们做 AND\
    \ 的一个变体，即 OR。有 OR 时，只要一个或两个子表达式为真，整个表达式就为真。\n\n例如，我不喜欢跑步，但我喜欢骑自行车。尽管如此，以下陈述为真，因为至少有一个子表达式为真：“我喜欢跑步\
    \ OR 我喜欢骑自行车”。真。\n\n这是对以下问题的聪明回答的基础：\n\n> 你想要汤还是沙拉？\n\n> “真。我想要汤或我想要沙拉。”\n\n>\
    \ “滚出我的餐厅，布尔狂热者！”\n\n难度：中等。以下表达式对你来说是真还是假？\n\n- 我住在欧洲 OR 我年龄大于 25。\n- 现在正在下雨 OR\
    \ 现在正在阳光明媚。\n- 猫优于狗 OR 狗优于猫。\n\n好吧！现在还有一件事要记住：除非表达式中有括号另行说明，否则 AND 的优先级高于 OR。也就是说，先做\
    \ AND，然后做 OR。\n\n难度：高级。\n\n假设正在下雨，我超过 25 岁，这条鱼很大。我们可以评估这个表达式：\n\nIt's sunny AND\
    \ this fish is big OR I'm over 25.\n\n我们先做 AND。不是晴天，鱼很大。所以这是“false AND true”，求值为“false”。\n\
    \n所以用“false”替换那个 AND 表达式。然后我们做 OR：\n\nfalse OR I'm over 25.\n\n现在我超过 25 岁，所以求值为“false\
    \ OR true”，即“true”。\n\n所以整个表达式为真。\n\n你可以用括号来覆盖：\n\nIt's sunny AND (this fish is\
    \ big OR I'm over 25).\n\n先做括号里的运算。所以现在我们评估 OR，求值为“true OR true”，即“true”。然后我们评估\
    \ AND，即\"It's sunny AND true\"，即“false AND true”，即“false”。\n\n所以整个表达式为假。\n\n让我们用一些数值条件表达式做些例子。它们求值为真还是假？\n\
    \n- 1 < 5\n- 5 > 1\n- 1 < 5 AND 5 < 10\n- 1 < 5 OR 5 < 10\n- 1 < 5 AND 5 > 10\
    \ OR 10 > 20\n- 1 < 5 AND (5 > 10 OR 10 > 20)\n\n答案：\n\n- True\n- True\n- True\
    \ AND True = True\n- False OR True = True\n- True AND False OR False = False OR\
    \ False = False\n- True AND (False OR False) = True AND False = False\n\n有时开发者（但更常是硬件人员）用所谓的真值表来描述这些运算。真值表显示布尔表达式对于某些给定输入的结果会是什么。\n\
    \n这些表通常使用 1 表示 True，0 表示 False。\n\n以下是我们迄今为止看到的运算的一些真值表。\n\n| A | B | A AND B\
    \ |\n|---|---|---|\n| 0 | 0 | 0 |\n\n*块可以用制表符或空格的任意组合进行缩进，只要块中的每一行都以相同的制表符或空格模式开头即可。官方建议在\
    \ Python 中使用 4 个空格进行缩进。*\n\n*Python 中的缩进块是大多数开发者在喜欢或讨厌方面意见很强的事情之一。个人而言，我说无论你对它们的怪癖感觉如何，都要在任何语言中做一个好开发者。*\n\
    \n然后这个讨厌的 else 是什么？那是 if 的一个超级方便的功能。如果条件为 False，则 else 下面的块会被求值。基本上，我们在说，“如果条件为真，则执行此操作，否则执行此操作。”\n\
    \nif-else 家族中我们还可以使用一个构造：elif。它是 else if 的缩写，用于需要检查多个条件时。\n\n```\nif x < 10:\n\
    \    print(\"x is less than 10\")\nelif x < 20:\n    print(\"x is less than 20\"\
    )\nelif x < 30:\n    print(\"x is less than 30\")\nelse:\n    print(\"x is greater\
    \ than or equal to 30\")\n```\n\n在这个例子中，首先检查 x 是否小于 10。如果为 False，则测试下一个条件，以此类推。如果都不匹配，则进入\
    \ else 情况。\n\nif 语句是我们使用布尔逻辑控制程序流程的核心。它是计算机根据输入做出决策的方式。没有 if，就没有计算——它的重要性就在于此！\n\
    \n而作为开发者，你的工作是想出那种逻辑，那些 if 语句和条件，使你的程序对给定输入产生正确的输出。\n\n## 6.7 现在：while 循环！\n\n\
    问题解决步骤：理解问题。\n\n我们将稍微偏离一下，谈谈编程中的另一个重要概念：循环。循环允许我们在不重复自己的情况下重复执行同一段代码。\n\n这里有一个现实生活中的例子。假设你需要在屋顶上铺一些瓦片。步骤是放置一块瓦片，将其钉牢，然后移动到下一个位置。\n\
    \n四块瓦片的说明可能是：\n\n- 放置一块瓦片\n- 将其钉上\n- 移动到下一个位置\n- 放置一块瓦片\n- 将其钉上\n- 移动到下一个位置\n\
    - 放置一块瓦片\n- 将其钉上\n- 移动到下一个位置\n- 放置一块瓦片\n- 将其钉上\n- 移动到下一个位置\n\n但这啰嗦得令人厌烦。最好这样做：\n\
    \n- 当我们尚未放置 4 块瓦片时：\n  - 放置一块瓦片\n  - 将其钉上\n"
