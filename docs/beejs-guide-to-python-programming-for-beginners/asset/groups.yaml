    \n一定要用边界情况测试。边界情况是指那些位于程序条件边缘的输入。\n\n例如，我们有对输入与 5 和 50 进行比较的条件。所以用 4、5、50 和 51\
    \ 来测试，覆盖这些条件的两侧。\n\n代码中还有哪里存在边界情况？对了：打印时的 if。前 30 个应该是 #，之后是 *。所以用 30 测试，确保全部是\
