    \n## 14.8 捕获多个异常 II\n\n如果你想用相同的处理代码处理多个异常，可以将它们做成一个列表：\n\n```\nexcept (FileNotFoundError,\
    \ PermissionError):\n    print(\"File not found or insufficient permissions\"\
    )\n```\n\n这并不常用，因为通常你希望对不同的异常采取不同的处理方式。\n\n## 14.9 获取更多异常信息\n\n每个异常实际上都是一个类的实例。而类名就是你在\
    \ except 子句中使用的名称。\n\n因为它是实例，所以它附带了一些我们可以获取的额外信息，但首先，我们必须将其绑定（赋给）一个变量名。我们可以用 as\
    \ 语句做到这一点。\n\n```python\ntry:\n    1 / 0\nexcept ZeroDivisionError as e:  # e\
    \ is a reference to the exception\n    print(e)\n    print(repr(e))  # Print its\
    \ representation\n```\n\n结果为：\n\ndivision by zero\nZeroDivisionError('division\
    \ by zero')\n\n这对于获取更详细的信息可能很有用。在上一章的示例中，我们捕获 ValueError，但我们看到了三种可能导致它的不同情况。我们可以使用这种技术在需要时向用户提供有关异常性质的更详细信息。\n\
    \n所有异常都有一个名为 args 的属性，它是创建异常时传入参数的列表。其中第一个通常是人类可读的错误消息。\n\n例如，这段代码：\n\n```python\n\
