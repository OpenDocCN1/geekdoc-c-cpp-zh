    \ π，或任何东西。\n\n从技术上讲，Python 源文件也是文本文件，但它们是一种特定类型。所有 Python 源文件都是文本文件，但并非所有文本文件都是\
    \ Python 源文件。\n\n作为人类，你可以通过其扩展名来识别文件的类型。也就是说，文件名中最后一个句点之后的。\n\n对于 Python，我们一直使用\
    \ .py（读作“dot-pie”）作为扩展名，标识此文件为 Python 源文件。\n\n通用文本文件使用 .txt（“dot-text”）作为扩展名。你可以用编写\
    \ Python 代码的同一编辑器来创建它们。\n\n继续打开一个新文件，并将其命名为 wargames.txt。输入一些文本，如下所示：\n\n他做的事情很棒！他设计了他的电脑，使其能够从自己的错误中学习。\n\
    这样，下次他们玩的时候会更好。系统实际上学会了如何学习。它可以自我教学！\n\n现在，问题是，如何运行一个 Python 程序来读取此文件并将数据存储或操作在内存中？\n\
    \n## 13.4 以经典方式读取文件\n\n问题解决步骤：理解问题。\n\n在许多编程语言中，读取文件有三个步骤：\n\n- 1. 打开文件以进行读取。\n\
    - 2. 从文件中读取数据。\n- 3. 关闭文件。\n\n这是非常非常常见的。\n“打开”和“关闭”文件是什么意思？\n嗯，这类似于你在编辑器中打开文件然后关闭它。\n\
    “打开”是指请求操作系统¹（OS）给你访问文件的权限。你可以打开以进行读取、写入或两者兼有。\n对于本节，我们希望请求 OS 打开文件以进行读取。\n“关闭”文件与打开相反。我们告诉\
    \ OS 我们已完成文件的使用。OS 会进行必要的清理。你应该始终关闭打开的任何文件。（你打开的所有文件在程序运行完成后会自动关闭，但你仍应显式关闭它们²。）\n\
    而“读取”实际上是将磁盘上的文件数据拉入内存中的字符串。\n\n问题解决步骤：制定计划\n让我们编写一些代码³来读取我们的 wargames.txt 文件并在屏幕上打印出内容。\n\
    我们的步骤将是：\n\n- 1. 打开文件\n- 2. 读取数据\n- 3. 关闭文件\n- 4. 打印数据\n\n## 问题解决步骤：执行计划\n\n```\n\
    # Open the file\nf = open(\"wargames.txt\")\n\n# Read all data from the file\n\
    data = f.read()\n\n# Close the file\nf.close()\n\n# Print out the data we read\
    \ earlier\nprint(data)\n```\n\n需要注意的一些事项：\n\n- - 我们打开文件时没有指定读取或写入。在 Python 中，默认是“读取”。\n\
    - - 注意我们在打印任何内容之前就关闭了文件。我们不必这样做，但它演示了我们现在如何在内存中拥有数据的副本。我们仍然可以使用它，即使我们已经关闭了文件。\n\
    \n由于我们有数据的副本，我们可以做各种各样的事情来更改它。\n\n如果你将最后两行修改为：\n\n```\n# Print out the data we\
    \ read earlier\nprint(data.upper())\n```\n\n我们将得到大写输出。（但原始文件当然仍然是小写！）这是我们的副本，可以随意使用！\n\
    \n## 13.5 使用 with 打开文件\n\n现在有一种更规范⁴的方法使用 Python 中的 with 语句读取文件。\n\n之前，我们读取文件\n\
    \n```\nf = open(\"wargames.txt\")\ndata = f.read()\nf.close()\nprint(data)\n```\n\
    \n使用 with 语句的等价形式如下所示：\n\n```\nwith open(\"wargames.txt\") as f:\n    data = f.read()\n\
    \    print(data)\n```\n\n## 13.6 一次性读取一行数据\n"
