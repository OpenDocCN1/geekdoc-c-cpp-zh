    +   3. Close the file.


    This is super-duper common.

    What does it mean to "open" and "close" the file?

    Well, it''s analogous to when you open the file in your editor, and then close
    it.

    "Opening" is asking the operating system¹ (OS) to give you access to the file.
    You can open for reading, for writing, or both.

    For this section, we''ll want to ask the OS to open the file for reading.

    "Closing" the file is the opposite of opening. We''re telling the OS that we''re
    done with the file. The OS does any cleanup it has to. You should always close
    any files you open. (All files that you open will automatically be closed when
    your program completes its run, but you still should explicitly close them anyway².)

    And "reading" is actually pulling the data from the file on disk into strings
    in memory.


    Problem-solving step: Devising a Plan

    Let''s write some code³ to read our wargames.txt file and print out the contents
    on the screen.

    Our steps will be:


    +   1. Open the file

    +   2. Read the data

    +   3. Close the file

    +   4. Print the data'
