    ### 19.3 终端


    在过去，人们通过称为 *终端* 的专用硬件访问大型机。这些看起来像旧电视机带键盘。屏幕通常是单色的，要么是白色、绿色或琥珀色，带有像素化的文字。


    几乎没有人再有真正的终端了，但他们有称为 *终端模拟器* 的程序来假装成终端。事实上，真正的终端非常罕见，而终端模拟器非常常见，如果你听到有人说 "terminal"，他们肯定是在说终端模拟器。


    所以终端模拟器是一个你运行的程序，它为你提供一个文本窗口来与你的计算机交互。


    你知道你如何用鼠标指向、点击和拖动来命令计算机做事吗？我们将做同样的事情，只是我们将输入命令来完成，而不是这样。


    ### 19.3.1 Shell


    有时你会听到人们交替使用 "shell" 和 "terminal"。


