    Different languages have different behaviors when it comes to passing arguments\
    \ to functions.\n\nSome of them make copies of the values. Some of them just make\
    \ it so the parameter name is an alias for the argument name. Some of them give\
    \ you the option through some keyword.\n\nHow the programming language does this\
    \ is called it's evaluation strategy.\n\nThree very common ones are:\n\n+   -\
    \ **Call by Sharing:** This is what Python does. When you call a function, the\
    \ parameters become references to the same objects as their corresponding arguments.\
    \ This means that if, inside the function, you change the thing the parameter\
    \ refers to, you'll see that change reflected out in the caller. However, if you\
