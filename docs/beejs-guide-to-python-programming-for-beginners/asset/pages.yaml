- pgno: 136
  md: "Perfect. What's next?\n\n# Problem-solving step: Devising a Plan\n\nLooks like\
    \ the next reasonable step is to read the file into memory so that we can manipulate\
    \ it later.\n\nSo a couple of questions:\n\n+   - How do we read a file?\n+  \
    \ - What do we store it in?\n\nAs for the first, hopefully, you've been reading\
    \ this chapter and know about how to open a file for reading and read individual\
    \ lines from it.\n\nBut how to keep all those lines?\n\nThink about all the data\
    \ structures we've talked about so far... lists, dicts, objects... What is the\
    \ file the most like?\n\nGo ahead and give it some thought before I spoil it in\
    \ the next couple sentences.\n\nYou might argue that each line is like an object.\
    \ And it is. It wouldn't be wrong to have a class that represents the line. But\
    \ somehow you still need to store a list of lines.\n\nGah, what a giveaway!\n\n\
    Yeah, a list seems like a good idea. In a way, a text file is simply a list of\
    \ lines.\n\nSo let's read the file a line at a time, storing each into a list\
    \ as we go.\n\nThis seems like a self-contained piece of code, so I'm going to\
    \ go ahead and write a function that accepts a filename as an argument, and then\
    \ returns a list of all the lines in that file.\n\n+   - Make an empty list\n\
    +   - Open the file\n+   - For each line of the file, append it to the list\n\
    +   - Return the list\n\n# Problem-solving step: Carrying Out the Plan\n\n```\n\
    ```python\ndef read_file(filename):\n    \"\"\"Read a file from disk\"\"\"\n \
    \   lines = []\n\n    with open(filename) as f:\n        for line in f:\n    \
    \        lines.append(line)\n\n    return lines\n\nif filename is not None:\n\
    \    lines = read_file(filename)\nelse:\n    lines = []\n\n# Print it out just\
    \ to make sure it works right\nprint(lines)\n```\n```\n\nNow if we run that, and\
    \ specify an input filename, it should print out a list with all the lines in\
    \ that file.\n\nOf course, we need a sample input file. You can make one in VS\
    \ Code—just edit a new file called lines.txt and put whatever you want in it.\
    \ (About five lines is good for testing.) If you don't want to bother, there's\
    \ a file lines.txt in the examples directory.\n\nRunning it, we get our list,\
    \ just like we wanted!"
