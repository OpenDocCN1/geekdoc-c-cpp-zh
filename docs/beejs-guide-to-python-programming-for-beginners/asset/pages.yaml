    \ step: Carrying Out the Plan\n\nLet's add that new class that holds both a reference\
    \ to a movie as well as the times it's showing:\n\n```\nclass MovieTime:\n   \
    \ \"\"\"Holds a movie and the times it is playing\"\"\"\n    def __init__(self,\
