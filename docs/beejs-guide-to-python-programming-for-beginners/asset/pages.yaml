- pgno: 36
  md: "But how do we ask them repeatedly until they enter something valid? We need\
    \ to loop! How about looping while the input is invalid? Sure!\n\n```\n```python\n\
    input_valid = False  # Assume it's invalid to start\n\nwhile not input_valid:\
    \  # While not input valid (\"while input invalid\")\n    x = input(\"Enter a\
    \ number, 5-50 inclusive: \")\n    x = int(x)\n\n    if x >= 5 and x <= 50:\n\
    \        input_valid = True  # We got a good number!\n```\n```\n\nLet's study\
    \ that pattern because it's a common use of while.\n\nWe start by assuming that\
    \ the success condition isn't met. And then we check every iteration of the loop,\
    \ with if, to see if it is met. And we loop while the success condition is not\
    \ true.\n\nNow, we're also supposed to print an error if the input is out of range.\
    \ How? We can do it in two lines.\n\nIf the if condition is True, then we have\
    \ good input. Otherwise we have bad input and should print a message...if...else!\n\
    \n(Note: the code below is a continuation of the program, above. Pay attention\
    \ to the line numbers!)\n\n```\n```python\nif x >= 5 and x <= 50:\n    input_valid\
    \ = True  # We got a good number!\nelse:\n    print(\"The number must be between\
    \ 5 and 50, inclusive!\")\n```\n```\n\nIf you haven't already, code that up and\
    \ run it. No, it's not the complete program, but it's the complete first step\
    \ of the program, and we can test it before moving on just to be confident that\
    \ this part works.\n\nRun it and try it with some numbers. If you enter an invalid\
    \ number, it should tell you so and ask again. If you enter a valid number, input_valid\
    \ becomes True and the while loop exits (because the continuation condition is\
    \ not input_valid).\n\nOnce you're satisfied it's working correctly, let's move\
    \ back to the spec and concentrate on printing out the asterisks.\n\n# Problem-solving\
    \ step: Devising a Plan.\n\nIf the user enters x, we want to print out x count\
    \ of characters, total. The first 30 of these will be #, and any after that will\
    \ be *.\nBefore we start things out, let's use a different planning technique:\
    \ simplify the problem.\nLet's forget about the * for now and just print out #\
    \ characters, however many the user-specified. Later we'll add the code for *.\n\
    \n> > Simplifying the problem allows you to more easily tackle it, and leads you\
    \ to see ways to add the missing features later.\n\nThe plan for this simplified\
    \ phase isn't that tough:\n\n```\nFor however many numbers the user inputs:\n\
    \    Print a '#'.\n\n```\n\n# Problem-solving step: Carrying out the Plan.\n\n\
    Since we know how many #s we want to print (the user entered the number!) this\
    \ would be a great place for a for loop. Let's print those:\n\n```\n```python\n\
    # Print the line\nfor i in range(x):\n    print(\"#\")\n```\n```\n\nRun it! How\
    \ did it do?"
