- pgno: 92
  md: "+   - Anything that happens repeatedly\n+   - Breaking up code into smaller,\
    \ self-contained sections\n\nLet's talk about that last item more, since it's\
    \ less obvious.\n\nVery frequently—almost always—you'll start with a series of\
    \ steps you need to perform to solve the problem, like this:\n\n```\n# While we\
    \ still have data to process\n# Process the data\n# Output the data\n```\n\nAnd\
    \ then you go in and fill in all the code for processing the data and outputting\
    \ the data.\n\nBut that could make for a bulky, hard-to-read while loop. It might\
    \ be better to code it up like this:\n\n```\nwhile d in data:\n    d = process(d)\n\
    \    output(d)\n```\n\nand the write the functions process() and output() to operate\
    \ on the data that is passed into them.\n\nThis makes the logic of the loop really\
    \ easy to read. And being easy-to-read is king (or queen, if you prefer).\n\n\
    If you find you have some large amounts of code that are getting deeply-nested,\
    \ it might be time to break them out into functions, even if you only call those\
    \ functions from that single place.\n\nKnowing when to break up code into functions\
    \ is more of an art than a science. If you start feeling like your code is remotely\
    \ unwieldy, consider what it might look like split into different functions. If\
    \ you like it more, do it!\n\n# 10.9 Positional Arguments versus Keyword Arguments\n\
    \nProblem-solving step: Understanding the Problem.\n\nWe'll talk more about this\
    \ in detail later, but function arguments can be split into these two broad classes\
    \ in Python: positional and keyword.\n\nPositional arguments are the arguments\
    \ that have to occur at certain positions in a function call.\n\nFor instance,\
    \ if we want to compute 14^12, we need to pass those two arguments in a specific\
    \ order to the math.pow() function, which expects the base to be first and the\
    \ exponent to be second:\n\n```\nmath.pow(14, 12)  # 56693912375296.0\n```\n\n\
    If you put the 12 first, you get a different answer. These are positional arguments.\n\
    \nBut for some functions, after the positional arguments, you can specify additional\
    \ keyword arguments. These are arguments that are identified by a certain name.\n\
    \nFor example, normally print() puts a newline at the end of the string. But you\
    \ can override this behavior with the end keyword argument by telling print()\
    \ to put nothing (an empty string) at the end of the line:\n\n```\n# Together,\
    \ prints \"Beej\" on a single line\n\nprint(\"Be\", end=\"\")\nprint(\"ej\")\n\
    ```\n\nNotice how we had to identify the keyword argument by name.\n\nIf you're\
    \ looking through documentation, you might find something that looks like this\
    \ (the documentation for print()):\n\n```\nprint('objects, sep=' ', end='\\n',\
    \ file=sys.stdout, flush=False)\n```"
