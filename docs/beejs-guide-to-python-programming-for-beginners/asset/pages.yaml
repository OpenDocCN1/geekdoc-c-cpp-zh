- pgno: 104
  md: "This special function is always named __init__() (with the dunders) and is\
    \ called the constructor.\n\nLet's add a constructor to our StarShip class that\
    \ allows us to pass in a ship name when the ship is constructed:\n\n```\nclass\
    \ StarShip:\n    def __init__(self, shipname):  # The constructor\n        self.name\
    \ = shipname\n\ns0 = StarShip(\"MCRN Tachi\")\ns1 = StarShip(\"Red Dwarf\")\n\
    s2 = StarShip(\"USCSS Nostromo\")\n```\n\nWhoa, now... that's a lot of hard-to-read\
    \ punctuation³ to sift through.\n\nAnd there's that crazy self parameter to the\
    \ function, whatever that means!\n\nLet's start with self⁴. This is one of the\
    \ hardest concepts to grok about in this chapter, so we'll spend some time on\
    \ it.\n\nRemember how the class is the blueprint, and the objects are made from\
    \ that blueprint?\n\nAnd how after they're constructed, you get a reference back\
    \ to that newly-minted object? (These are the references we were storing in s0,\
    \ s1, and s2.)\n\nWell, what about the object that's being constructed right now\
    \ inside the __init__() method? It already exists but isn't fully initialized\
    \ yet. But inside the constructor, we have a reference to that object that is\
    \ being built right now. And that reference is in self.\n\nself means \"the object\
    \ that this method is operating on\".\n\nWhat's weird is that when we instantiated\
    \ the starships, we only passed one argument to __init__().\n\n```\ns0 = StarShip(\"\
    MCRN Tachi\")\n```\n\nWhen clearly __init__() has two parameters: self and name.\
    \ What gives?\n\n```\ndef __init__(self, shipname):  # The constructor\n```\n\n\
    Doesn't the number of arguments need to match the number of parameters?\n\nIt\
    \ does! But Python's doing something sneaky behind your back, here. When a method\
    \ has been called for a particular object, Python automatically fills in the first\
    \ parameter with the object that is being operated on. We don't have to worry\
    \ about it.\n\nPython then takes the arguments we did pass and tacks them on after\
    \ that.\n\nLet's take a look at that constructor again:\n\n```\nclass StarShip:\n\
    \    def __init__(self, shipname):  # The constructor\n        self.name = shipname\n\
    \ns0 = StarShip(\"MCRN Tachi\")\n```\n\nThis is a really common pattern, so let's\
    \ make sure we understand what's going on here. In particular, there's a weird\
    \ dot after self. What does that mean? But before we get there, let's look at\
