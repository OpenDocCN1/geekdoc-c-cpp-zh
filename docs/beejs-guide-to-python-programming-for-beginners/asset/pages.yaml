  md: "+   - Write each line to the file\n\nAlso:\n\n+   - Hook up the “w” command\
    \ in the main input loop.\n\nAnd:\n\n+   - Parse the argument from the “w” command\
    \ to get the filename\n\nSince “write a bunch of lines to disk” is a good self-contained\
    \ operation, I plan to write a function that does just that and nothing more.\
    \ I’ll write a different function to get called when a write is requested which\
    \ will make sure the args are correct and so on. Keep it modular!\n\n# Problem-solving\
    \ step: Carrying Out the Plan\n\nFirst, let’s add a function to write the file\
    \ to disk. As arguments, it’ll take the list of lines to write and a filename\
    \ to write it to.\n\nWhen we open the file, we’ll pass the “w” argument to it\
    \ to indicate that we’re writing this file.\n\nNote that as soon as you open a\
    \ file for writing, it erases that file if it exists. But this should be OK in\
    \ this case since we’re about to write it again.\n\nAnd since every line already\
    \ has a newline at the end, we don’t have to add one when we write it to disk.\n\
    \n```\n```python\ndef write_file(lines, filename):\n    \"\"\"Write a file to\
    \ disk\"\"\"\n    with open(filename, \"w\") as f:\n        for line in lines:\n\
    \            f.write(line)\n```\n```\n\nNow let’s write the handler for the command.\
    \ This will check if the arg was specified and print an error if not. And then\
    \ write the file.\n\n```\n```python\ndef handle_write(args, lines):\n    \"\"\"\
    Handle the write command\"\"\"\n    if len(args) == 1:\n        filename = args[0]\n\
    \    else:\n        print(\"usage: w filename\")\n        return\n    write_file(lines,\
    \ filename)\n```\n```\n\nLastly, we need to add a handler to the main command\
    \ loop so that when we type “w”, it saves the file:\n\n```\n```python\n# Write\
    \ (save) the file\nelif command[0] == 'w':\n    handle_write(args, lines, filename)\n\
    ```\n```\n\nAnd that’s that!\n\n# Problem-solving step: Looking Back\n\nThere\
    \ are a lot of things we can do to improve the code here.\n\n+   - Add the option\
    \ for the delete command to specify an ending as well as a starting line to erase\
    \ a block of lines at once.\n+   - Make it so that if the user specifies a filename\
    \ on the command line and does not specify one after the write command, it writes\
    \ to the same file specified on the command line.\n+   - Add an insert command\
    \ that works like append, except it puts the new material before the line specified.\
    \ How can you do this with minimal addition of code? After all, append and insert\
    \ are very similar."
