  md: "The process is similar to reading, except when we open the File, we need to\
    \ specify that we want to write. (If we don’t tell open() otherwise, it assumes\
    \ we’re opening for reading.)\n\n**WARNING:** if you open an existing file for\
    \ writing, the contents of that file is instantly lost!\n\nLet’s open a file and\
    \ write some data to it using the write() method.\n\n```\nwith open(\"newfile.txt\"\
    , \"w\") as f:\n    f.write(\"Hello, world!\\n\")\n```\n\nThere we go! If you\
    \ run this, then have a look, you’ll see a file called newfile.txt that has the\
    \ magic words in it.\n\nNow you have the power to save data to disk and read it\
    \ back again!\n\n# 13.8 Chapter Project\n\nIf you need to, review the specification\
    \ at the top of the chapter.\n\nThis project is a bit bigger than the others,\
    \ eh? I mean, writing an entire editor is kinda biting off a lot, isn’t it?\n\n\
    Sure! Yeah, it’s a lot. But we can do it using the problem-solving framework just\
    \ like always.\n\nSomething else a little different here is that I’m not going\
    \ to include line numbers in the listings. You’ll have to work out the proper\
    \ place to put the code based on my descriptions and what makes sense. With practice,\
    \ it should get clearer how things piece together.\n\nLet’s start!\n\nProblem-solving\
    \ step: Understanding the Problem.\n\nReview the spec from earlier if you have\
    \ to, but the basic chunks of this program are:\n\n+   - Parse the command line\
    \ to get the filename\n+   - Read a file\n+   - Write a file\n+   - Read user\
    \ commands as input\n+   - List the file on the screen\n+   - Append lines to\
    \ the file\n+   - Edit existing lines\n+   - Delete lines\n\nSo first, make sure\
    \ we know what all those do.\n\nThen we’ll attack.\n\nProblem-solving step: Devising\
    \ a Plan\n\nWe’re going to do something a little different this time. We’re going\
    \ to make an overarching plan, and then jump back and forth between Planning and\
    \ Carrying Out the sub plans the larger plan is comprised of.\n\n> This is a bit\
    \ of a double-edged sword, and it takes practice and experience to get it right.\
    \ You don’t want to over-plan, because you’re undoubtedly going to have to change\
    \ things and you don’t want to waste your time. And you don’t want to under-plan,\
    \ because then hidden gotchas might… get you later. You want to plan just the\
    \ right amount. Whatever that is. In reality, devs consistently under-plan. And\
    \ they still make it work somehow, like MAGIC. And by “MAGIC”, I mean tons of\
    \ sweat, tears, and off-color language.\n\nBeing able to do this is a really,\
    \ really important skill to practice. This is where software development really\
    \ happens. The rest of coding is just writing things down."
