    # 14.6 Catching Exceptions\n\nProblem-solving step: Understanding the Problem\n\
    \nBear with me, because this code is a little different in how it gets executed.\n\
    \nWe're going to use two new statements in conjunction: try and catch. Let's jump\
    \ right in with an example that we can dissect:\n\n```\ntry:\n    x = input(\"\
    Enter a number: \")\n    x = int(x)  # Convert to integer\n    print(x * 1000)\n\
    except ValueError:\n    print(f'error converting \"{x}\" to integer')\n```\n\n\
    What's happening there? Look at the big blocks first. We have a try block and\
    \ an except block.\n\nThink of the try block as the code you want to execute in\
    \ your shiny dreamworld where your user enters correct information every time.\n\
    \nLike the user enters 3490, and it converts to integer just fine, and then you\
    \ print out 3490000.\n\nPerfect.\n\nBut what if the user enters beans instead\
    \ of a number? int() is going to freak out and raise a ValueException, just like\
    \ we saw earlier.\n\nHere's the magic. If that happens, execution of the try block\
    \ will stop immediately, and Python will transfer control to the matching except\
    \ block, if it exists.\n\nSo for example, here's a successful run:\n\n```\nEnter\
    \ a number: 3490\n3490000\n```\n\nand here's a run where an exception is thrown:\n\
    \n```\nEnter a number: beans\nerror converting \"beans\" to integer\n```\n\nSee\
    \ how it transferred control right into the except block?\n\nThat's how we handle\
    \ exceptions!"
