  md: "```\nTraceback (most recent call last):\n  File \"foo.py\", line 8, in <module>\n\
    \    total_count = int(sys.argv[2])\nValueError: invalid literal for int() with\
    \ base 10: 'bananas'\n```\n\nIt's the ValueError exception that we've seen before.\
    \ Let's modify our code to catch that exception and handle it.\n\n```\nimport\
    \ sys\n\nif len(sys.argv) != 3:\n    print(\"usage: head.py filename count\")\n\
    \    sys.exit(1)\n\nfilename = sys.argv[1]\n\ntry:\n    total_count = int(sys.argv[2])\n\
    except ValueError:\n    print(\"head.py: count must be a positive integer\")\n\
    \    sys.exit(2)\n\nif total_count < 1:\n    print(\"head.py: count must be a\
    \ positive integer\")\n    sys.exit(2)\n```\n\nThere! That fixes it. And that\
    \ code works, but...\n\nNotice anything messy about it? That's right—we sure are\
    \ repeating ourselves a lot. Let's refactor and see if we can get rid of those\
    \ duplicate lines.\n\nOne option would be to set a flag in either case to True\
    \ if there was an error, and then print the message and exit. That would work,\
    \ and wouldn't be a bad solution at all.\n\nBut we can be a bit more clever and\
    \ actually make the exception handler do all the work for us by simply raising\
    \ a ValueError exception if the total_count is less than one. Then we'll get a\
    \ ValueError in both cases, and we can handle it in one place.\n\n```\ntry:\n\
    \    total_count = int(sys.argv[2])\n    if total_count < 1:\n        raise ValueError()\n\
    except ValueError:\n    print(\"head.py: count must be a positive integer\")\n\
    \    sys.exit(2)\n```\n\nCheck that out. If int() raises the exception, we catch\
    \ it. And if we raise the exception ourselves, we also catch it. Plus all the\
    \ logic for testing the input value for correctness is all in the same try block,\
    \ nicely.\n\nOK! We have the code getting the correct input. Let's go on to the\
    \ next step and print lines from the file.\n\nWe can start by simplifying the\
    \ problem to just print all the lines and not worrying about the count for now.\n\
    \nLet's take our code from before for printing out a file:\n\n```\nwith open(filename)\
    \ as f:\n    for line in f:\n        print(line, end=\"\")\n```"
