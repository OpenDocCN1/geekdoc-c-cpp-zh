    ```\nEnter two numbers separated by a space: 1 0\n(<class 'ZeroDivisionError'>,\
    \ ZeroDivisionError('division by zero'), <traceback object at 0x7fe2ea373040>)\n\
    ```\n\nThis isn't as common, to catch and examine exceptions in this way. But\
    \ it is another tool in your toolbox.\n\nBe careful with catch-alls. They might\
    \ hide exceptions that you weren't expecting and should have let through. They're\
    \ rare in practice.\n\n# 14.11 Finally finally\n\nProblem-solving step: Understanding\
    \ the Problem\n\nThere's a greater structure to be found here. We've already talked\
    \ about try and catch, but there's a way to add code that runs after the try no\
    \ matter what, regardless of whether or not an exception occurred.\n\nIt's the\
    \ finally clause, and it comes after the except clause(s).\n\nAgain, this block\
    \ of code will run no matter what.\n\n```\ntry:\n    print(1/1)\nexcept ZeroDivisionError:\n\
    \    print(\"Divide by zero!\")\nfinally:\n    print(\"All done!\")\n```\n\nThe\
    \ above code will print:\n\n```\n1\nAll done!\n```\n\nIf we modified that first\
    \ line to print(1/0), we'd get a divide by zero exception and the output would\
    \ be:\n\n```\nDivide by zero!\nAll done!\n```\n\nIn all cases, the finally block\
    \ will run.\n\nYou can use this block to execute finalization or cleanup code\
    \ if you need to.\n\ntry-except is really common. finally is less so, but not\
    \ entirely uncommon.\n\n# 14.12 What Else? else!\n\nProblem-solving step: Understanding\
    \ the Problem\n\nJust when you thought try-except-finally was all she wrote, turns\
    \ out we can add an else in there for try-except-else-finally.\n\nIt's entirely\
    \ possible that you won't ever see this, but I wanted to quickly touch on it here.\
    \ Just glance at it:"
