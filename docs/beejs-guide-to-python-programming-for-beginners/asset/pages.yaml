    \ to work.\n\nExceptions are raised (also sometimes said to be thrown) for all\
    \ kinds of things in Python.\n\nTry to open a nonexistent file for reading:\n\n\
    ```\nTraceback (most recent call last):\n  File \"<stdin>\", line 1, in <module>\n\
