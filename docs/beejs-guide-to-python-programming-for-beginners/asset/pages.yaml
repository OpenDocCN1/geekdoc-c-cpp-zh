    \ in Python are one of the things most devs are pretty opinionated about in terms\
    \ of loving or hating. Personally, I say be a good dev in any language, regardless\
    \ of how you feel about their idiosyncrasies.*\n\nAnd then what's this pesky else?\
    \ That's a super-handy feature of if. If the condition is False, then the block\
    \ under the else is evaluated instead. Basically, we're saying, \"If the condition\
    \ is true, then do this, otherwise do this.\"\n\nThere's one more construct we\
    \ can use in the if-else family: elif. This is short for else if and is used if\
    \ you need to check multiple conditions.\n\n```\nif x < 10:\n    print(\"x is\
    \ less than 10\")\nelif x < 20:\n    print(\"x is less than 20\")\nelif x < 30:\n\
    \    print(\"x is less than 30\")\nelse:\n    print(\"x is greater than or equal\
    \ to 30\")\n```\n\nIn that example, first we check if x is less than 10. If that's\
    \ False, the next condition is tested, and so on. If none of them match, then\
    \ we get to the else case.\n\nThe if statement is the core of what allows us to\
    \ use Boolean logic to control the flow of our program. It's how computers can\
    \ make decisions based on input. Without if, there would be no computing—that's\
    \ how important it is!\n\nAnd your job as a dev is to come up with that logic,\
    \ those if statements and conditions, that cause your program to give the proper\
    \ output for a given input.\n\n# 6.7 And Now: while Loops!\n\nProblem-solving\
    \ step: Understanding the Problem.\n\nWe're going to divert ever-so-slightly,\
    \ and talk about another important concept in programming: loops. A loop is what\
    \ allows us to execute the same piece of code repeatedly without repeating ourselves.\n\
    \nHere's a real-life example. Let's say you have to add some shingles to a roof.\
    \ The steps to do so are to place a shingle, nail it in place, and then move to\
    \ the next spot.\n\nInstructions for four shingles might be:\n\n+   - Place a\
    \ shingle\n+   - Nail it on\n+   - Move to the next spot\n+   - Place a shingle\n\
    +   - Nail it on\n+   - Move to the next spot\n+   - Place a shingle\n+   - Nail\
    \ it on\n+   - Move to the next spot\n+   - Place a shingle\n+   - Nail it on\n\
    +   - Move to the next spot\n\nBut that's irksomely verbose. It would be nicer\
