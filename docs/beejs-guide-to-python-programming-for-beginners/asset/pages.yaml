- pgno: 132
  md: "# Problem-solving step: Carrying Out the Plan\n\n```\n# Open the file\nf =\
    \ open(\"wargames.txt\")\n\n# Read all data from the file\ndata = f.read()\n\n\
    # Close the file\nf.close()\n\n# Print out the data we read earlier\nprint(data)\n\
    ```\n\nSome things to note:\n\n+   - When we opened the file, we didn't specify\
    \ read or write. In Python, it's \"read\" by default.\n+   - Notice that we close\
    \ the file before we print anything. We didn't have to, but it demonstrates how\
    \ we now have a copy of the data in memory. We can still use it, even though we've\
    \ closed the file.\n\nSince we have a copy of the data, we can do all kinds of\
    \ stuff to change it.\n\nIf you modify the last two lines to be:\n\n```\n# Print\
    \ out the data we read earlier\nprint(data.upper())\n```\n\nwe'll get the output\
    \ in uppercase. (But the original file is still lowercase, of course!) It's our\
    \ copy of the data to do with as we please!\n\n# 13.5 Opening Files with with\n\
    \nNow there is a more canonical⁴ approach to reading files using the with statement\
    \ in Python.\n\nEarlier, we read a file\n\n```\nf = open(\"wargames.txt\")\ndata\
    \ = f.read()\nf.close()\nprint(data)\n```\n\nThe equivalent using the with statement\
    \ looks like this:\n\n```\nwith open(\"wargames.txt\") as f:\n    data = f.read()\n\
    \    print(data)\n```\n\n# 13.6 Reading Data a Line at a Time"
