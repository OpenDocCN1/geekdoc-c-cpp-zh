- pgno: 137
  md: "```\n$ python lineedit.py lines.txt\n['This is line 1\\n', 'This is line 2\\\
    n', 'This is line 3\\n',\n'This is line 4\\n', 'This is line 5']\n\n$ python lineedit.py\n\
    []\n```\n\nTake a moment to digest what we did there: we made a copy of the data\
    \ that was on disk and stored that copy in memory.\n\nWhat's next in the big overall\
    \ plan? Looks like it might be time for a user-input loop.\n\n# Problem-solving\
    \ step: Devising a Plan\n\nThis is like so many other input loops we've done so\
    \ far:\n\n+   - Print a prompt\n+   - Parse the input\n+   - Run the command\n\
    +   - Stop looping when the user says to quit\n\n# Problem-solving step: Carrying\
    \ Out the Plan\n\nYour standard input loop. All it does is let you type q:\n\n\
    ```\n# Main loop\n\ndone = False\n\nwhile not done:\n    command = input(\"> \"\
    ).strip()\n\n    if command[0] == 'q':\n        done = True\n```\n\nIf you hit\
    \ RETURN it pukes right away because command[0] isn't a thing if the string is\
    \ empty.\n\nA common thing to do here is just print another prompt if the user\
    \ enters a blank line. We can add this after the input() line to do that:\n\n\
    ```\n# if the user entered a blank line, just give them another prompt\nif command\
    \ == '':\n    continue\n```\n\nAnd finally, let's add some output as an else to\
    \ tell the user if they input something we didn't recognize:\n\n```\nelse:\n \
    \   print(\"unknown command\")\n```\n\nOK! Now if we run it, we should be able\
    \ to handle blank lines, unknown commands, and q for quit.\n\n```\n$ python lineedit.py\
    \ lines.txt\n> x\nunknown command\n>\n        [ user hit RETURN a few times here\
    \ ]\n>\n>\n> q\n$\n```\n\nNot much of an editor so far, but Facebook wasn't built\
    \ in a day. We're just slowly getting the pieces in place.\n\nWhat's a good piece\
    \ to do next? Lots of options, because now we're to the point of implementing\
    \ the handlers for the various commands (besides the one for quitting, which we\
    \ just did)."
