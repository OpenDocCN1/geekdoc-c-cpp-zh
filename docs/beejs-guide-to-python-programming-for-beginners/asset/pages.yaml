    \ another problem. How do we associate a set of times with a particular Movie\
    \ object? We need a way in code to show that they're linked so that we can print\
    \ them out together.\n\n# Problem-solving step: Devising a Plan\n\nWe can do this\
    \ with a new class—call it MovieTime—that contains both a reference to a movie\
    \ and a list of times that movie is showing. And then we can add instances of\
