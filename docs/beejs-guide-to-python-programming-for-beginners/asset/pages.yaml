    ```\n```\n\nresults in:\n\ndivision by zero\nZeroDivisionError('division by zero')\n\
    \nThat could be useful for getting more detailed information. In our example in\
    \ the previous chapter, we catch ValueError, but we saw three different circumstances\
    \ that could lead to it. We could use this technique to give the user more detailed\
    \ information about the nature of the exception, should we choose.\n\nAll exceptions\
    \ have an attribute called args that is a list of the arguments that are passed\
    \ to the exception when it was created. The first of these is often a human-readable\
    \ error message.\n\nFor instance, this code:\n\n```\n```python\ntry:\n    1 /\
    \ 0\nexcept Exception as e:\n    print(e.args[0])\n```\n```\n\nprints the helpful\
    \ message:\n\ndivision by zero\n\nFurthermore, any exception that is based on\
    \ IOError includes the string attribute strerror that contains a human-readable\
    \ error message corresponding to the error. You can find the list of exceptions\
    \ that are derived from IOError in the exceptions documentation².\n\n# 14.10 Catching\
    \ All Exceptions\n\nA catch statement that doesn't specify a particular exception\
    \ will catch all previously uncaught exceptions.\n\nFor this reason, a blank catch\
    \ should definitely be last, after all the other catches. Python will stop at\
    \ the first catch that matches, even if it's a \"catch all\".\n\nWhen you're in\
    \ any catch, you can look at the results from the built-in function sys.exc_info().\
    \ This function returns a tuple (think \"list\" for now, if you're not familiar\
    \ with tuples) with three pieces of information: the type of the exception, a\
    \ reference to the exception itself, and a traceback³.\n\nLet's mod our division\
    \ program to catch all exceptions and print out the exception info:\n\n```\n```python\n\
    import sys\n\ntry:\n    x, y = input('Enter two numbers separated by a space:\
    \ ').split()\n    x = int(x)\n    y = int(y)\n    print(f'{x} / {y} == {x / y}')\n\
    \nexcept:\n    print(sys.exc_info())\n```\n```"
