  md: "```\nprint(x.antelopes)  # 10!\n```\n\nRemember that when you call a function,\
    \ it is assigning the argument into the parameter name, so both of them refer\
    \ to the same object. That is, in the code above, o refers to the same object\
    \ x does, just as if we'd done an assignment with o = x.\n\n# 11.11 Objects and\
    \ None\n\nWe've already seen that variables can point to the value None to indicate\
    \ nothing.\n\nThis gets commonly used with objects to indicate some \"not found\"\
    \ or error condition.\n\nFor example, let's have a list of objects and a function\
    \ to search them by name. The function should return the object that has a name\
    \ attribute that matches the name parameter to the function.\n\nBut a question\
    \ should naturally arise! What if there is no object by that name in the list?\
    \ What should the function return? None is a prime candidate here.\n\n```\nclass\
    \ Person:\n    def __init__(self, name):\n        self.name = name\n\n    def\
    \ __str__(self):\n        return self.name\n\ndef get_person_by_name(person_list,\
    \ name):\n    \"\"\"Return a person object with this name, or None if not found\"\
    \"\"\n    for p in person_list:\n        if p.name == name:\n            # If\
    \ we found them, return the object\n            return p\n\n    # If we got here,\
    \ we didn't find anyone by that name\n    return None\n\nperson_list = [\n   \
    \ Person(\"Annie\"),\n    Person(\"Beej\"),\n    Person(\"Chris\")\n]\n\np = get_person_by_name(person_list,\
    \ \"Chris\")\n\nprint(p)  # \"Chris\"\n\np = get_person_by_name(person_list, \"\
    Dave\")\n\nif p is None:\n    print(\"Dave's not here.\")\n```\n\n# 11.12 Testing\
    \ for Attributes\n\nSometimes at runtime, you want to see if an object has an\
    \ attribute or not. Or maybe you have the attribute name as a string and you want\
    \ to get or set that attribute on an object.\n\nThree built-in functions help\
    \ make this happen:\n\n+   - hasattr() tests to see if an attribute exists on\
    \ an object."
