    Notice how we just replace the named line in the list with whatever line is returned
    by input().


    Let''s try it!


    ```

    > l 1

    1: This is line 1

    2: This is line 2

    3: This is line 3

    4: This is line 4

    5: This is line 5

    > e 2

    NEW LINE 2!

    > l 1

    1: This is line 1

    2: NEW LINE 2!3: This is line 3

    4: This is line 4

    5: This is line 5

    >

    ```


    Wait a second! Lines 2 and 3 are all bunched up after I edited it! That can''t
    be right.


    # Problem-solving step: Understanding the Problem


    This all ties back to the newlines we keep at the end of lines in the list.


    Remember that we''re storing each line with the newline attached to the end.


    But input() strips the newline off! Not what we were after.


    # Problem-solving step: Devising a Plan


    So we have to add the newline to the end of the, er, new line that we just entered.
    We''ll just tack it on with the + string concatenation operator.


    # Problem-solving step: Carrying Out the Plan


    ```

    # Edit the line, adding a newline to the end (since input() strips

    # it off).

    lines[line_num] = input() + ''\n''

    ```


    And done with that one!


    What''s the next easiest thing to code up? Well, looks like there''s only one
    more editing command: "append".


    # Problem-solving step: Understanding the Problem


    This one''s a little different. It looks like we go ahead and read the line to
    append just like with any other command.


    But then we go into a weird mode where we repeatedly enter lines until the user
    enters a single period on a line by itself.


    And each of those lines are appended in turn.


    If the user says to append after line 0, the lines should be inserted at the top
    of the file.


    # Problem-solving step: Devising a Plan


    So let''s go ahead and do the usual command-line parsing to see which line we
    want to insert after.


    And then let''s loop until the user enters a single period.


    Inside the loop, we''ll read a line and append it into the list in the right place.'
