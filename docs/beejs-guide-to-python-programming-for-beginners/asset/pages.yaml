  md: "# 14.7 Catching Multiple Exceptions\n\nProblem-solving step: Understanding\
    \ the Problem\n\nWhat if your try block throws multiple exceptions?\n\nTurns out\
    \ you can catch multiple exceptions just by having multiple except clauses.\n\n\
    Let's try a program that divides a number by another:\n\n```\n```python\nx, y\
    \ = input('Enter two numbers separated by a space: ').split()\n\nx = int(x)\n\
    y = int(y)\n\nprint(f'{x} / {y} == {x / y}')\n```\n```\n\nWhat are the exceptions\
    \ that can be thrown?\n\nGood question. Although there is a list of built-in exceptions³,\
    \ it's not immediately obvious which one gets raised when.\n\nThe easy thing to\
    \ do is try it in the REPL. But try what?\n\nThink like a villain. What are the\
    \ things that can go wrong? What kinds of bad input can you pass this program?\n\
    \nGive it some thought. I count four things that can go wrong with bad user input.\
    \ Can you see them?\n\nWell, we're taking input, running it through .split(),\
    \ and then assigning the results into two variables. So the split() better return\
    \ a list of length 2, or something bad is going to happen.\n\nI'm going to put\
    \ that line of code into the REPL and see what it says if I enter something that's\
    \ not two numbers separated by a space.\n\n```\n```\n>>> x, y = input(\"Enter\
    \ 2 numbers: \").split()\nEnter 2 numbers: 1\nTraceback (most recent call last):\n\
    \  File \"<stdin>\", line 1, in <module>\nValueError: not enough values to unpack\
    \ (expected 2, got 1)\n```\n```\n\nCheck it out! I entered a single number, and\
    \ it raised ValueError exception (with a message saying there weren't enough values).\n\
    \nLet's try too many values:\n\n```\n```\n>>> x, y = input(\"Enter 2 numbers:\
    \ \").split()\nEnter 2 numbers: 1 2 3\nTraceback (most recent call last):\n  File\
    \ \"<stdin>\", line 1, in <module>\nValueError: too many values to unpack (expected\
    \ 2)\n```\n```\n\nValueError again! That means we can do something like this to\
    \ catch it:\n\n```\n```python\ntry:\n    x, y = input('Enter two numbers separated\
    \ by a space: ').split()\n    x = int(x)\n    y = int(y)\n    print(f'{x} / {y}\
    \ == {x / y}')\nexcept ValueError:\n    print(\"That's not two numbers separated\
    \ by a space!\")\n```\n```"
