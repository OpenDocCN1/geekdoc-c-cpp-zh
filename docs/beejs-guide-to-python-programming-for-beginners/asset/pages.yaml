  md: 'Address, the lyrics for the latest hit single by that one band, the number
    π computed to a million decimal places, or whatever.


    Technically, Python source files are text files, as well, but they''re a specific
    type. All Python source files are text files, but not all text files are Python
    source files.


    As a human, you can identify the type of file by its extension. That is, the part
    of the filename after the last period in the file.


    For Python, we''ve been using .py (pronounced "dot-pie") as the extension, identifying
    this file as a Python source file.


    General text files use .txt ("dot-text") as an extension. And you can make them
    with the same editor you''ve been using to write Python code.


    Go ahead and open a new file, and call it wargames.txt. Enter some text into it,
    like this:


    What he did was great! He designed his computer so that it could learn from its
    own mistakes.

    So, they''d be better the next time they played. The system actually learned how
    to learn. It could teach itself!


    Now, the question is, how do you run a Python program that reads this file in,
    and stores or manipulates the data in memory?


    # 13.4 Reading Files, The Classic Way


    Problem-solving step: Understanding the Problem.


    In many programming languages, there are three steps to reading a file:


    +   1. Open the file for reading.

    +   2. Read data from the file.

    +   3. Close the file.


    This is super-duper common.

    What does it mean to "open" and "close" the file?

    Well, it''s analogous to when you open the file in your editor, and then close
    it.

    "Opening" is asking the operating system¹ (OS) to give you access to the file.
    You can open for reading, for writing, or both.

    For this section, we''ll want to ask the OS to open the file for reading.

    "Closing" the file is the opposite of opening. We''re telling the OS that we''re
    done with the file. The OS does any cleanup it has to. You should always close
    any files you open. (All files that you open will automatically be closed when
    your program completes its run, but you still should explicitly close them anyway².)

    And "reading" is actually pulling the data from the file on disk into strings
    in memory.


    Problem-solving step: Devising a Plan

    Let''s write some code³ to read our wargames.txt file and print out the contents
    on the screen.

    Our steps will be:


    +   1. Open the file

    +   2. Read the data

