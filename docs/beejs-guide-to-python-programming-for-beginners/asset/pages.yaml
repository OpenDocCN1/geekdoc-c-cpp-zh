- pgno: 141
  md: "```\nhandle_list(args, lines)\nFile \"lineedit.py\", line 48, in handle_list\n\
    print(f'{i}: {lines[i]}', end=\"\")\nIndexError: list index out of range\n```\n\
    \nSame pukey error, but let's look at the lines before then. The good news is\
    \ we're getting all the lines printed. The bad news is that the line number on\
    \ the left is in computer 0-based land, and we need it in human 1-based land.\
    \ Let's add another helper function:\n\n```\ndef zero_to_one(n):\n    \"\"\"Convert\
    \ a number from a 0-based index to a 1-based index.\"\"\"\n    return n + 1\n\
    ```\n\nAnd then let's call that in our print output line:\n\n```\nprint(f'{zero_to_one(i)}:\
    \ {lines[i]}', end=\"\")\n```\n\nNow a run gives:\n\n```\n$ python lineedit.py\
    \ lines.txt\n> l 1\n1: This is line 1\n2: This is line 2\n3: This is line 3\n\
    4: This is line 4\n5: This is line 5\nTraceback (most recent call last):\n  File\
    \ \"lineedit.py\", line 80, in <module>\n    handle_list(args, lines)\n  File\
    \ \"lineedit.py\", line 52, in handle_list\n    print(f'{zero_to_one(i)}: {lines[i]}',\
    \ end=\"\")\nIndexError: list index out of range\n```\n\nBam! That's what we want.\
    \ All lines printed with correct line numbers.\n\nNow, what about that error?\
    \ It's telling us the list index is out of range, which isn't too surprising since\
    \ it's going off the end of the file.\n\nBefore our for-loop, let's just add some\
    \ code that makes sure the start and end are sane. (Remember we've decided that\
    \ they are 0-based indexes.)\n\n```\n# Make sure start isn't before the beginning\
    \ of the list\nif start < 0:\n    start = 0\n\n# Make sure end isn't past the\
    \ end of the list\nif end > len(lines):\n    end = len(lines)\n```\n\nAnd then\
    \ you can run the for-loop after that with impunity!\n\n```\n$ python lineedit.py\
    \ lines.txt\n> l 1\n1: This is line 1\n2: This is line 2\n3: This is line 3\n\
    4: This is line 4\n5: This is line 5\n> l 3\n3: This is line 3\n4: This is line\
    \ 4\n5: This is line 5\n>\n```"
