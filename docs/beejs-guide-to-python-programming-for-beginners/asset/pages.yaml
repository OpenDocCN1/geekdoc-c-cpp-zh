- pgno: 135
  md: "So let’s do the rough overall, based on the outline, above in Understanding\
    \ The Problem.\n\n+   - First we’ll get the filename from the command line.\n\
    +   - Then we’ll read the file.\n+   - Then we’ll loop to get input for whatever\
    \ it is the user wants to do (append, list, edit, write, etc.)\n+   - For whatever\
    \ the user enters, we’ll do that thing.\n+   - When the user says q to quit, we’ll\
    \ quit.\n\nThat’s a pretty loose plan. I mean, “We’ll do that thing,” isn’t exactly\
    \ well-fleshed-out. But we know it’s possible to do them, and we can work on those\
    \ individual command components one at a time (since none of them are really dependent\
    \ on one another).\n\nLooks like some of those we can work on right away.\n\n\
    # Problem-solving step: Devising a Plan\n\nLet’s start simple. Simplifying the\
    \ problem is always a good way to get bits and pieces done. Also, getting a minimum\
    \ working piece going as soon as possible can help direct our efforts and keep\
    \ motivation up. Get a core piece in place, and then keep adding on.\n\nWhat’s\
    \ a simple version of the program?\n\nWell, we could start by looking at the command\
    \ line to see if there’s a filename there or not, and storing it if there is.\n\
    \nRemember the user has the option to run the program without specifying a filename\
    \ (since maybe they’re creating a new file).\n\nSo we want to check the command\
    \ line args in sys.argv. If the user specified a filename, we’ll store it. If\
    \ they didn’t, we’ll store None to indicate that case. If they specify more than\
    \ one argument, we’ll print out a usage message.\n\nGreat! Let’s go!\n\n# Problem-solving\
    \ step: Carrying Out the Plan\n\n```\nimport sys\n\n# Parse the command line\n\
    \nif len(sys.argv) == 2:\n    filename = sys.argv[1]\n\nelif len(sys.argv) ==\
    \ 1:\n    # We’ll use this as a sentinel value later if we need to prompt for\n\
    \    # a filename when writing the file.\n    filename = None\n\nelse:\n    print(\"\
    usage: lineedit.py [filename]\", file=sys.stderr)\n    sys.exit(1)\n\n# Let’s\
    \ just print it here to make sure it’s working\nprint(filename)\n```\n\nThat last\
    \ line is only there temporarily. This lets us test things out.\n\n```\n$ python\
    \ lineedit.py\nNone\n\n$ python lineedit.py test\ntest\n\n$ python lineedit.py\
    \ test something\nusage: lineedit.py [filename]\n```"
