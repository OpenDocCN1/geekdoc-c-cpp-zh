    And you can do that in Python with the regular exponent operator **:


    ```

    print(4913**(1/3))  # prints 16.999999999999996

    ```


    Hey—wait a second, that''s not 17! What gives?


    Well, turns out that floating point numbers in computers aren''t exact. They''re
    close, but not exact. It''s something developers need to be aware of and either
    live with or work around.


    Lastly, because square root, cube root, and all the other roots are just exponents
    in disguise, they have the same precedence as exponents: they happen before arithmetic.


    # 15.9 Factorial


    Factorial is a fun function.


    Basically if I ask for something like “5 factorial”, that means that I want to
    know the answer when we multiply 5 by all integers less than 5, down to 1.


    So I''d want to know:

    5 × 4 × 3 × 2 × 1

    the answer to which is 120.


    But writing “factorial” is kind of clunky, so we have special notation for it:
    the exclamation point: !. “5 factorial” is written 5!.


    Another example:

    6! = 6 × 5 × 4 × 3 × 2 × 1 = 720


    As you can imagine, factorial grows very quickly.


    40! = 815915283247897734345611269596115894272000000000


    In Python, you can compute factorial by using the factorial() function in the
    math module.


    ```

    import math


    print(math.factorial(10))  # prints 3628800

    ```


    Factorial, being multiplication in disguise, has the same precedence as multiplication.
    You do it before addition and subtraction.


