- pgno: 34
  md: "— Move to the next spot\n\nThat's us looping. We're running the same piece\
    \ of code while a condition is True. At the very least, this can save us a lot\
    \ of typing!\n\nPython has several looping statements, but for this section, we'll\
    \ concentrate on what's called the while loop. It does something while a condition\
    \ is true.\n\nHere's an example⁵ that counts from 1200 to 1210:\n\n```\nx = 1200\n\
    \nwhile x <= 1210:\n    print(x)\n    x += 1\n\nprint(\"All done!\")\n```\n\n\
    It repeats the body of the loop (everything that's indented) as long as the condition\
    \ x <= 1210 is True.\n\nYou see inside the body of the loop, we increment (add\
    \ one to) x every iteration so that it increases toward 1210.\n\nWhat would happen\
    \ if we didn't increment x? In that case, it would loop forever. We call this\
    \ an infinite loop. If your program's running for a long time with no output (or\
    \ repeating output), it might be in an infinite loop.\n\nHow do you get out of\
    \ your program if it's caught in an infinite loop? You hit CTRL-C (AKA \"break\"\
    ). That'll get you back to your shell prompt.\n\nRemember one of our goals for\
    \ this chapter's program is to ask the user for a number between 5 and 50. And\
    \ we need to ask them again if they enter a number outside that range. That is,\
    \ we need to loop while the user has not given us valid input. Give that some\
    \ thought now, and we'll come back to it later.\n\n# 6.8 Looping: for Loops\n\n\
    Problem-solving step: Understanding the Problem.\n\nIn addition to while loops,\
    \ we also have a beast called a for loop. These are quite powerful as we'll find\
    \ out later, but for now, I just want to talk about looping for a certain number\
    \ of times. (As opposed to looping while a condition is true.)\n\nHere's an example\
    \ of printing out the numbers from 0 to 9 using a for loop and a function called\
    \ range(). (range() returns something called an iterator. More on iterators in\
    \ upcoming chapters—for now, just look at how they can be used with for loops.)\n\
    \n```\nfor i in range(10):  # loop from 0 to 9\n    print(i)\n```\n\nNotice a\
    \ few things:\n\n+   - i is the classic variable name for a looping index.\n+\
    \   - If you have a nested loop (a loop inside a loop—more on that later) you\
    \ can use j, then k, etc.\n+   - We loop until we get to one before the argument\
    \ to range(). Up to but not including.\n\nBut wait, there's more! range() is multi-talented!\
    \ Not only can it count up from zero to almost-a-number, but you could give it\
    \ another starting point, as well:\n\n```\nfor i in range(5, 10):  # loop from\
    \ 5 to 9\n    print(i)\n```\n\nNow how much would you pay? It slices, it dices!\
    \ But we're not done yet! You can also tell range() how far to skip each step!"
