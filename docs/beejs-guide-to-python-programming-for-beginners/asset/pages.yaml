- pgno: 93
  md: "Ignoring the *objects for now, look at all those keyword arguments... in the\
    \ docs, they have = followed by some value. This indicates the default value if\
    \ you don't specify one otherwise. In other words, they're optional keyword arguments.\n\
    \nYou can see that print() ends each line with a newline \\n unless we tell it\
    \ to end the line with some other string.\n\nFor now, it's enough to know that\
    \ these exist and how to call them. Later on, we'll talk about how to write our\
    \ own.\n\n# 10.10 Interlude: Evaluation Strategies\n\nIf you don't want to read\
    \ this section, it's OK to skip. But it's more fun if you read it.\n\nDifferent\
    \ languages have different behaviors when it comes to passing arguments to functions.\n\
    \nSome of them make copies of the values. Some of them just make it so the parameter\
    \ name is an alias for the argument name. Some of them give you the option through\
    \ some keyword.\n\nHow the programming language does this is called it's evaluation\
    \ strategy.\n\nThree very common ones are:\n\n+   - **Call by Sharing:** This\
    \ is what Python does. When you call a function, the parameters become references\
    \ to the same objects as their corresponding arguments. This means that if, inside\
    \ the function, you change the thing the parameter refers to, you'll see that\
    \ change reflected out in the caller. However, if you assign a new value into\
    \ a parameter, you will not see the change.\n\n```\n```python\ndef foo(x):\n \
    \   # Modify the passed-in object. Caller will see this change.\n    x[1] = 99\n\
    \n    # Assign a new list into x. The caller will _not_ see this change.\n   \
    \ x = [4, 5, 6]\n\na = [1, 2, 3]\n\nfoo(a)\nprint(a)  # [1, 99, 3]\n```\n```\n\
    \n+   - **Call by Value:** a copy of the argument is made and stored in the parameter.\
    \ The C programming language, among others, uses this one. (Sometimes people say\
    \ Python uses Call by Value, but this is technically not accurate since parameters\
    \ are not copied when they are passed in; only the reference to the argument is\
    \ copied. You can make Python simulate Call by Value by making a copy of the parameter\
    \ when calling the function.)\n\n```\n```python\n# Simulating call-by-value in\
    \ Python\n\ndef foo(x):\n    # Modify the passed-in object. The caller would normally\
    \ see this\n    # change, but if they called it with a copy, only the copy will\n\
    \    # be affected.\n    x[1] = 99\n\na = [1, 2, 3]\n\n# Simulate call-by-value\
    \ by making a copy\nfoo(a.copy())\n\nprint(a)  # [1, 2, 3]\n```\n```"
  merge: -1
  img_proc: true
