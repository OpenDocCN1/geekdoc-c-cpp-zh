    (Solution¹⁵.)

    +   5. Write a program that allows the user to enter a, b, and c, and the solves
    the quadratic formula¹⁶ for those values.


    A refresher: with equations of the form:


    a x² + b x + c = 0


    you can solve for x with the quadratic formula:


    x = (-b ± √b² - 4ac) / 2a


    This all looks terrifying! Can you feel your brain seizing up over it? Deer in
    the headlights? That''s OK. This is how developers feel when confronted with a
    new problem. Really! All of us! But what we know is that we have a problem solving
    framework we can use to attack this problem regardless of how difficult it seems
    initially.


    Remember: Understand, Plan, then Code It Up.


    Take a deep breath. Shake off the fear!


    You can absolutely do this. It''s not any harder than anything so far! Let''s
    go!


    Your program should plug a, b, and c into the above formula and print out the
    result value in x.


    Make sure b² ≥ 4ac or there won''t be a solution and you''ll get a "domain error"
    when you try to take the square root of a negative number. Some test values for
    a, b, and c that work: 5, 9, 3, or 20, 140, 60.


    What is that ± symbol after -b in the equation? That''s "plus or minus". It means
    there are actually two equations, one with + and one with -:


    x_plus = (-b + √b² - 4ac) / 2a   x_minus = (-b - √b² - 4ac) / 2a


    Solve them both and print out both answers for a given a, b, and c.


    What about that square root of b² - 4ac? How do you compute that? Here''s a demo
    program for computing the square root of 2—use it to learn how to use the math.sqrt()
    function, and then apply it to this problem.


    ```

    import math    # You need this for access to the sqrt() function

    x = math.sqrt(2)  # Compute sqrt(2)

    print(x)  # 1.4142135623730951

    ```'
