- pgno: 142
  md: "Perfection! That's the list functionality complete!\n\nThings only tend to\
    \ get easier from here on out. The first part of the implementation is the worst,\
    \ but now we just have variants on a theme:\n\n+   1. Check for the proper command\
    \ on input\n+   2. Pass the args to a handler function for that command\n+   3.\
    \ Build out the handler function\n+   4. Repeat\n\nWhat's the next simplest thing\
    \ to work on? How about \"delete a line\"?\n\nProblem-solving step: Understanding\
    \ the Problem.\n\nSo we want to delete a single line. This is as easy as removing\
    \ an element from the list containing all the lines.\n\nWe just need to know the\
    \ element number to remove.\n\nOf course, the user enters it after the d command,\
    \ so we can grab it from there.\n\nBut remember: what the user enters is 1-based!\
    \ We have to convert it to 0-based before we use the number to delete a line...\
    \ otherwise we'll delete the wrong line.\n\nProblem-solving step: Devising a Plan\n\
    \nSo we should be able to:\n\n+   - Add a handler to the main input loop\n+  \
    \ - In the delete handler, get the line to delete\n+   - Convert it to 0-based\n\
    +   - Delete that line from the list of lines\n\nA little digging in the help\
    \ reveals that the pop() method removes an element from a list at a given index:\n\
    \n```\npop(self, index=-1, /)\n\n    Remove and return item at index (default\
    \ last).\n```\n\nProblem-solving step: Carrying Out the Plan\n\nTo our main input\
    \ loop, let's go ahead and add a call to the handler if the user requests a deletion:\n\
    \n```\n# Delete a line\nelif command[0] == 'd':\n    handle_delete(args, lines)\n\
    ```\n\nAnd now let's write the delete handler. This is going to be similar to\
    \ the line listing handler at first: we have to get the line number the user entered,\
    \ and convert it to 0-based.\nAnd then make sure it's in range.\nAnd then delete\
    \ that line with the pop() method.\n\n```\ndef handle_delete(args, lines):\n \
    \   \"\"\"Delete a line in the file.\"\"\"\n    if len(args) == 1:\n        #\
    \ Get the line number to delete\n        line_num = one_to_zero(int(args[0]))\n\
    \    else:\n        print(\"usage: d line_num\")\n        return\n    # Make sure\
    \ we're in range\n    if line_num < 0 or line_num >= len(lines):\n        print(\"\
    no such line\")\n```"
