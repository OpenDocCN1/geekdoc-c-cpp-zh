- pgno: 138
  md: "Personally, if we have things that display data and things that modify data,\
    \ I prefer to do the ones that display the data first. They're less likely to\
    \ mess things up (since we're not modifying data), and if you can't display the\
    \ data correctly, your odds of modifying it correctly are low, indeed.\n\nSo let's\
    \ hit up that \"list\" command that will show us lines from the file.\n\n# Problem-solving\
    \ step: Devising a Plan\n\nThe list command takes a single argument representing\
    \ the line number to start listing from. And then it should list for 10 lines.\n\
    \nSince we have all the lines in a list already, this isn't too entirely horrible.\
    \ We just have to:\n\n+   - Parse the starting position as entered by the user.\n\
    +   - If they entered a number less than 1, assume they meant 1.\n+   - Start\
    \ looping from that number, printing out 10 lines.\n+   - If we hit the last line,\
    \ stop printing.\n\nSince we have all these different kinds of functionality,\
    \ let's put them in individual functions to keep the code well organized.\n\n\
    We'll make a handle_list() function that is called when the user asks to list\
    \ the file. It'll take a couple of arguments: the arguments the user typed after\
    \ a command, as well as the list of lines we're going to manipulate.\n\n# Problem-solving\
    \ step: Carrying Out the Plan\n\nFirstly, let's check and see if the user wants\
    \ to list lines by checking to see if the first letter of the command is l. If\
    \ it is, then it's on.\n\nBut there's an argument after the l, right? The user\
    \ has to specify which line to start listing from. And we have to get that into\
    \ our handle_list() function somehow.\n\nSo let's do two things. Let's parse those\
    \ arguments, if any, out of the overall command. We'll use split() to break the\
    \ command apart on spaces, and then we'll use a slice from [1:] (that is, from\
    \ the second element to the end) to get all the arguments.\n\nThe result will\
    \ have any arguments following the command in a list, or an empty list if there\
    \ were no arguments.\n\nAnd then we'll pass that to our handler function:\n\n\
    ```\n# Grab the arguments after the command\nargs = command.split(\" \")[1:]\n\
    \nif command[0] == 'q':\n    done = True\n\n# List lines\nelif command[0] == 'l':\n\
    \    handle_list(args, lines)\n```\n\nAnd let's code up a stub⁶ of the function\
    \ to handle it, just to see if it's working:\n\n```\ndef handle_list(args, lines):\n\
    \    print(f'Handle list: {args}, {lines}')\n```\n\nRunning, we get this:\n\n\
    ```\n$ python lineedit.py lines.txt\n> l\nHandle list: [], ['This is line 1\\\
    n', 'This is line 2\\n',\n'This is line 3\\n', 'This is line 4\\n', 'This is line\
    \ 5\\n']\n> l 99\n```\n\n⁶ A function stub is a callable function that takes all\
    \ the same arguments and, if necessary, returns a sensible value. But it doesn't,\
    \ in fact, do anything of use. It's a good way to test that your overall call\
    \ flow is working right. And it gives you a nice, easy TODO spot to fill out."
