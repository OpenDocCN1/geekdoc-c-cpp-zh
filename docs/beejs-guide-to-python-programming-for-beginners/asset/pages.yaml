  md: '{.default} hello.py


    There we have a file named hello and an extension .py. This is a common extension
    that means “this is a Python source code file”.


    Pull down “File → New” and that’ll bring up a blank window.


    And let’s enter some code!


    Type the following¹ into the editor (the line numbers, below, are for reference
    only and shouldn’t be typed in):


    ```

    print("Hello, world!")

    print("My name''s Beej and this is (possibly) my first program!")

    ```


    We’re (almost) ready to run!


    # 4.4 Running the Program!


    Hit F5 from the editor window (you might have to hit fn+F5 on the Mac) to run
    the code. Alternately, you can pull down the “Run” menu and select “Run Module”.


    If you haven’t saved the file, it will prompt you to save the file. (You can pull
    down “File → Save”, or hit COMMAND-S or CTRL-S to do this preemptively.)


    Give it a good name, like hello.py.


    And then, in the console window, you’ll see the output appear! [Angelic Chorus!]


    ```

    Hello, world!

    My name''s Beej and this is (possibly) my first program!

    ```


    Did you miss it? Hit F5 again and you’ll see it appear again.


    You just wrote some instructions and the computer carried it out!


    Next up: write a Quake III clone!


    Okay, so maybe there might be a small number of in between things that I skimmed
    over, but, as Obi-Wan Kenobi once said, “You’ve taken your first step into a larger
    world.”


    # 4.5 Exercises


    Remember to use the four problem-solving steps to solve these problems: understand
    the problem, devise a plan, carry it out, look back to see what you could have
    done better.


    +   1. Make another program called dijkstra.py that prints out your three favorite
    Edsger Dijkstra quotes².


    # 4.6 Summary


    +   - Use the problem solving framework!

    +   - Edit some source code in the IDLE editor.

    +   - Run that program from within IDLE.'
