  md: "What we're starting to delve into here is the world of Object-Oriented Programming.\
    \ To discuss everything about it would definitely be information overload, so\
    \ we're just going to start with the basics here, and revisit some of the concepts\
    \ later.\n\nA bit of terminology here, following up on the starship example from\
    \ above.\n\nFirst of all, we're going to construct new starship objects that hold\
    \ all the information about a single ship.\n\nWhen the object is constructed,\
    \ it is done based on a blueprint. We call this blueprint a class.\n\nSo we're\
    \ going to define a blueprint for a starship in a class, and then we're going\
    \ to build multiple, different starships based on that class.\n\nLet's do this\
    \ as simple as possible to start. It's not going to be a common way of doing things,\
    \ but it's a place to get your feet wet. We'll fix it soon.\n\nFirst of all, we'll\
    \ define a new class. Remember, this is just the blueprint for starships—it's\
    \ not a starship itself.\n\nClass names use camel case by convention. Let's define\
    \ that starship class!\n\n```\n```python\nclass StarShip:\n    pass\n```\n```\n\
    \n...that's it? What's that pass in there?\n\nOkay, you got me. I did say we were\
    \ going to start simple (and not quite Right), in my defense. What we have there\
    \ is a class StarShip, except it's like a blank blueprint. There's nothing in\
    \ it.\n\nThe keyword pass means \"do nothing\" in Python. It's just there to indicate\
    \ to Python that there's no body inside this class.\n\nRandom Terminology Facts:\
    \ We also say a starship object is an instance of the StarShip class.\n\nConstructing\
    \ a new starship object is also referred to as instantiating the object from the\
    \ class.\n\nLet's go on to make a couple of objects from the blueprint.\n\n```\n\
    ```python\nclass StarShip:\n    pass\n\ns0 = StarShip()\ns1 = StarShip()\ns2 =\
    \ StarShip()\n```\n```\n\nBy putting parens after the class name, we're telling\
    \ Python that we are creating a new starship object from the StarShip class. In\
    \ fact, we made three of them and saved a reference to each in s0, s1, and s2.\
    \ Of course, none of them have names or locations, but we'll remedy that shortly.\n\
    \nIf we print one, we get something like this:\n\n```\n```python\nprint(s1)  #\
    \ <__main__.StarShip object at 0x7fa11828c8e0>\n```\n```\n\nNot so pretty. But\
    \ we'll make that better soon, as well.\n\n# 11.5 Making Different StarShips\n\
    \nProblem-solving step: Understanding the Problem.\n\nIn the previous example,\
    \ all our starship objects were identical and contained no information.\n\nWhat\
    \ we need is a way to pass that information in when the starships are constructed.\n\
    \nWe do this by defining a special function inside the class.\n\nAnother Fun Terminology\
    \ Fact: functions declared inside classes are called methods."
