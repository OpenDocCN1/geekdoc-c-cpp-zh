- pgno: 109
  md: "+   - getattr() returns the value of an attribute, optionally returning a default\
    \ value if the attribute doesn't exist.\n+   - setattr() sets the value of an\
    \ attribute, creating it if it doesn't exist.\n\nThis gives you more flexibility\
    \ in writing your objects, because then you can have optional attributes on them.\n\
    \nLet's demo!\n\n```\nclass Foo:\n    pass\n\nf = Foo()\nf.bar = 12\n\nprint(hasattr(f,\
    \ \"bar\"))    # True\nprint(hasattr(f, \"frotz\"))  # False\n\nprint(getattr(f,\
    \ \"bar\"))            # 12\nprint(getattr(f, \"frotz\", None))    # None, since\
    \ attr frotz doesn't exist\n\nsetattr(f, \"frotz\", 99)  # Just like saying \"\
    f.frotz = 99\"\n\nprint(f.frotz)  # 99\n```\n\nI wouldn't say that these functions\
    \ get a lot of day-to-day use, but they're a powerful thing to add to your toolkit.\n\
