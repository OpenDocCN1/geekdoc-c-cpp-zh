  md: "# Line 4: Return the result\n\nA function can optionally return a value. You\
    \ know how arguments are a way to pass data into a function? The return value\
    \ is a way to pass data back out of the function to the caller.\n\nBack where\
    \ the function is called, you can think of the function call as having the return\
    \ value. Then you can do things like assign it into a variable.\n\n# Line 6: Capture\
    \ the returned result in a variable\n\nWe call our function, and we take the return\
    \ value from that function and assign it into the variable answer. Then we can\
    \ do things with it, like print it out on line 7.\n\nProblem-solving step: Looking\
    \ Back.\n\nIn the function as written, above, we use a lot of variables to help\
    \ demonstrate a number of concepts and ideas surrounding functions.\n\nBut in\
    \ reality, a dev would probably simplify the above code to:\n\n```\ndef do_the_math(x):\n\
    \    return (x + 13) * 7\n\nprint(do_the_math(30))\n```\n\nCompare the two until\
    \ you are convinced they are equivalent.\n\n# 10.7 Multiple Return Values\n\n\
    Problem-solving step: Understanding the Problem.\n\nYou can always return a list\
    \ or a dict or anything from a function, but you can also return two values and\
    \ assign them to different variables.\n\n```\n# Function that returns the argument\
    \ times 10, and divided by 10\n\ndef timesdiv10(x):\n    return x * 10, x / 10\n\
    \na, b = timesdiv10(100)\n\nprint(a, b)  # 1000 10\n```\n\nOr you can assign the\
    \ result to a single variable. The result will be a tuple, which is a read-only\
    \ list that you can access with square bracket notation:\n\n```\na = timesdiv10(100)\n\
    \nprint(a[0], a[1])  # 1000 10\n```\n\nMagic!\n\n# 10.8 What Makes a Good Function\n\
    \nProblem-solving step: Understanding the Problem.\n\nThe biggest rule is “do\
    \ one thing and do it well”.\n\nIt’s more of a guideline than a rule because you’re\
    \ the boss when it comes to programming.\n\nBut it’s a great guideline that should\
    \ be followed when you can.\n\nThe biggest things you’ll use functions for are:\n\
    \n+   - Mathematical equations"
