    # Importing Modules


    # 12.1 Objective


    +   - Learn what a module is

    +   - How to find modules to use

    +   - How to import modules


    # 12.2 Chapter Project Specification


    Open a ZIP archive and print out a directory of the files that are in there, their
    size in bytes, and the time they were last modified.


    If you''re unfamiliar with the ZIP format, it''s a way to take multiple files
    and compress them into a single file, called a ZIP archive. The table of contents
    shows what files exist within the ZIP file. They can be recovered later by extracting
    them, but we''re not going to do that for this project.


    An example ZIP file can be found in the examples directory¹.


    Output should be:


    | File Name | Modified | Size |

    |---|---|---|

    | hello.txt | 2020-02-09 15:12:20 | 6 |

    | world.txt | 2020-02-09 15:12:24 | 7 |


    (Spacing in the above example was changed to fit the margins—you don’t have to
    match spacing exactly.)


    Keep this project in mind as we go through this chapter’s material.


    # 12.3 What and Why of Modules


    Problem-solving step: Understanding the Problem.


    Modules are pieces of self-contained code that you can import into your code and
    use. Think of them as prefabricated building blocks that you can put together
    in your project to accomplish tasks without needing to write out the details yourself.


    This is actually a really powerful concept that you have at your disposal. Tons
    of code have already been written, and you can just use it!


    Do you want to compute anything to do with date and time? Python has a module
    for that.

    Do you want to draw graphics on the screen? Python has a module for that.

