    # 1.4 Email Policy


    I''m generally available to help out with email questions so feel free to write
    in, but I can''t guarantee a response. I lead a pretty busy life and there are
    times when I just can''t answer a question you have. When that''s the case, I
    usually just delete the message. It''s nothing personal; I just won''t ever have
    the time to give the detailed answer you require.


    As a rule, the more complex the question, the less likely I am to respond. If
    you can narrow down your question before mailing it and be sure to include any
    pertinent information (like platform, compiler, error messages you''re getting,
    and anything else you think might help me troubleshoot), you''re much more likely
    to get a response. For more pointers, read ESR''s document, How To Ask Questions
    The Smart Way.


    If you don''t get a response, hack on it some more, try to find the answer, and
    if it''s still elusive, then write me again with the information you''ve found,
    and hopefully, it will be enough for me to help out.


    Now that I''ve badgered you about how to write and not write me, I''d just like
    to let you know that I fully appreciate all the praise the guide has received
    over the years. It''s a real morale boost, and it gladdens me to hear that it
    is being used for good! :- ) Thank you!


    # 1.5 Mirroring


    You are more than welcome to mirror this site, whether publicly or privately.
    If you publicly mirror the site and want me to link to it from the main page,
    drop me a line at beej@beej.us.


    # 1.6 Note for Translators


    If you want to translate the guide into another language, write me at beej@beej.us
    and I''ll link to your translation from the main page. Feel free to add your name
    and contact info to the translation.


    This source markdown document uses UTF-8 encoding.


