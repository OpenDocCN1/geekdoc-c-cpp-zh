    \ means you can pass objects to functions as arguments, and the function can change\
    \ the values in the object's attributes.\n\n```\ndef set_antelopes_to_10(o):\n\
    \    o.antelopes = 10\n\nclass Forest:\n    pass\n\nx = Forest()\nx.antelopes\
