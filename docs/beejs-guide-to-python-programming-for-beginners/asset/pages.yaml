  md: "The big challenge here is how do we provide complete error checking of all\
    \ user inputs to make sure everything is sensible?\n\nWhat are all the things\
    \ that could go wrong?\n\nGo ahead and make a list on your own, and then you can\
    \ compare it to the list I have, below.\n\nSpoilers ahead!\n\nHere's what I can\
    \ think of happening:\n\n+   - User doesn't enter the correct number of command-line\
    \ arguments.\n+   - User enters a non-number for the second command-line argument.\n\
    +   - User enters a filename that doesn't exist.\n+   - User enters a non-positive\
    \ number.\n+   - The file isn't a regular file (e.g. it's a directory or other\
    \ special file).\n+   - The user doesn't have permission to read the file.\n+\
    \   - User enters a number that's larger than the number of lines in the file.\n\
    \nSome of these you can handle with simple if statements. Others we'll have to\
    \ catch with exceptions.\n\nThat last one, about what happens when you enter a\
    \ number larger than the number of lines in the file, is a great question. The\
    \ spec doesn't say. So we should ask the creator of the spec for clarification.\n\
    \n> \"Hey, BeeJ! The spec doesn't say what to do if the number of lines specified\
    \ is greater than the number of lines in the file. What do we do in that case?\"\
    \n\nLet's do this: we'll stop outputting lines at either the number of lines the\
    \ user specifies or the end of the file, whichever comes first. No message to\
    \ the user is required in either case.\n\nOk, let's plan!\n\n# Problem-solving\
    \ step: Devising a Plan\n\nLooking at the spec, the program can be broken down\
    \ into a number of parts.\n\n+   - Read user input\n+   - Open the file for reading\n\
    +   - Read the number of lines up to what the user-specified (or EOF)\n\nFor each\
    \ of those parts, we'll have to do input validation and tell the user if anything\
    \ went wrong.\n\n# Problem-solving step: Carrying Out the Plan\n\nSome of this\
    \ stuff we've seen before, so we'll skim over it a bit.\n\nFirst, let's get the\
    \ user input from the command line, check that the right number of arguments was\
    \ passed, and check the input to make sure it's sensible.\n\n```\nimport sys\n\
    \nif len(sys.argv) != 3:\n    print(\"usage: head.py filename count\")\n    sys.exit(1)\n\
    \nfilename = sys.argv[1]\ntotal_count = int(sys.argv[2])\n\nif total_count < 1:\n\
    \    print(\"head.py: count must be a positive integer\")\n    sys.exit(2)\n```\n\
    \nThat's partway there, but we're missing an error case. Do you see it?\n\nWhat\
    \ if the user enters \"bananas\" for the count? If we try to run it to see what\
    \ happens, sure enough, we get an exception."
