- pgno: 79
  md: "```\na = [10, 20, 30]\nd = { x: x*10 for x in a if x != 20 }\nprint(d)  # {10:\
    \ 100, 30: 300}\n```\n\nIf you have a list of key/value pairs, you can read those\
    \ into a dictionary pretty easily, too.\n\n```\na = [[\"alice\", 20], [\"beej\"\
    , 30], [\"chris\", 40]]\nd = { k: v for k, v in a }\nprint(d) # {'alice': 20,\
    \ 'beej': 30, 'chris': 40}\n```\n\n# 9.10 Dictionaries of Dictionaries\n\nProblem-solving\
    \ step: Understanding the Problem.\n\nHere's the deal: the value that you store\
    \ for a given key can be anything!\n\nWell, not like a whale, or Mars, but any\
    \ data type. So you can store strings, ints, floats, lists, or even other dictionaries\
    \ as the value for the dictionary key!\n\nCheck out this nested declaration, and\
    \ check out how we drill down through the dictionary layers to get to the data:\n\
    \n```\nd = {\n  \"a\": {\n    \"b\": \"Mars! Ha!\"\n  }\n}\nprint(d)      # {'a':\
    \ {'b': 'Mars! Ha!'}}\nprint(d[\"a\"])   # {'b': 'Mars! Ha!'}\nprint(d[\"a\"][\"\
    b\"]) # Mars! Ha!\n```\n\nNesting dictionaries like this can be a really powerful\
    \ method of storing data.\n\n# 9.11 Dictionaries are Mutable\n\nProblem-solving\
    \ step: Understanding the Problem.\n\nWhen you make an assignment copy of a dictionary,\
    \ it's copying the reference to the same dictionary, not making a new one. Just\
    \ like with lists and anything else.\n\nAnd this is important, because dictionaries\
    \ are mutable, just like lists.\n\n```\nd = { \"beej\": 3490 }\ne = d  # both\
    \ e and d refer to the same dict!\ne[\"beej\"] = 3491  # modify it\nprint(d[\"\
    beej\"])  # 3491\n```\n\nIf you want to make a copy of a dictionary use one of\
    \ the following:\n\n```\nd = { \"beej\": 3490 }\ne = d.copy() # make a copy, the\
    \ preferred way\ne = dict(d)  # make a copy\n```\n\nThat first way is preferred\
    \ because it's easier to read, and easy to read code is Happy Code™."
