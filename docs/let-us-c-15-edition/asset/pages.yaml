    # Let Us C


    As mentioned in the first chapter, Dennis Ritchie wanted C to remain compact.
    In keeping with this intention he omitted everything related to Input/Output (I/O)
    from his definition of the language. Thus, C simply has no provision for receiving
    data from any of the input devices (like keyboard, disk, etc.), or for sending
    data to the output devices (like VDU, disk, etc.). Then how do we manage I/O,
    and how is it that we were able to use printf() and scanf() if C has nothing to
    offer for I/O? This is what we intend to explore in this chapter.


    # Types of I/O


    Though C has no provision for I/O, it of course has to be dealt with at some point
    or the other. There is not much use writing a program that spends all its time
    telling itself a secret. Each Operating System has its own facility for inputting
    and outputting data from and the files and devices. It is a simple matter for
    a system programmer to write a few small programs that would link the C compiler
    for particular Operating System’s I/O facilities.


    The developers of C do do that. They write several standard I/O functions and
    put them in libraries. These libraries are available with all C compilers. Whichever
    C compiler you are using it is almost certain that you have access to a library
    of I/O functions.


    Understand that the I/O facilities with different operating systems would be different.
    Thus, the way one OS displays output on screen may be different than the way another
    OS does. For example, the standard library function printf() for DOS-based C compiler
    has been written keeping in mind the way DOS outputs characters to screen. Similarly,
    the printf() function for a Unix-based compiler has been written keeping in mind
    the way Unix outputs characters to screen. As programmers do not have to bother
    about which printf() has been written in what manner. We should just use printf()
    and it would take care of the rest of the'
