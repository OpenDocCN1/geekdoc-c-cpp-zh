    +   (e) The window that is created in memory is displayed using the ShowWindow()
    API function.


    +   (f) A ‘window class’ specifies various properties of the window that we are
    creating.


    +   (g) The header file ‘Windows.h’ contains declaration of several macros used
    in Windows programming.'
