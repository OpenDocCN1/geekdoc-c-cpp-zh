    # Let Us C


    API functions use __stdcall calling convention. If not mentioned, __cdecl calling
    convention is assumed by the compiler.


    HINSTANCE and LPSTR are nothing but typedefs. The first is an unsigned int and
    the second is a pointer to a char. These macros are defined in ''windows.h''.
    This header file must always be included while a C program under Windows. hInstance,
    hPreInstance, lpszCmdLine and nCmdShow are simple variable names. In place of
    these we can use i, j, k and l respectively. Let now understand the meaning of
    these parameters as well as the rest of the program.


    +   - WinMain() receives four parameters which are as under:


    +   **hInstance**: This is the ''instance handle'' for the running application.
    Windows creates this ID number when the application starts. We will use this value
    in many Windows functions to identify an application''s data.


    +   A handle is simply a 32-bit number that refers to an entity. The entity could
    be an application, a window, an icon, a brush, a cursor, a bitmap, a file, a device
    or any such entity. The actual value of the handle is unimportant to your programs,
    but the handle knows how to use it to refer to an entity. What is important that
    there is a unique handle for each entity and we can refer and reach the entity
    only using its handle.


    +   **hPreInstance**: This parameter is a remnant of earlier versions of Windows
    and is no longer significant. Now it always contains a value 0. It being persisted
    with only to ensure backward compatibility.


    +   **lpszCmdLine**: This is a pointer to a character string containing the command
    line arguments passed to the program. This is similar to the argv, argc parameters
    passed to main() in a DOS program.


