    # Let Us C


    This function loads the relevant font file. Then using the information in the
    font file and the font properties setup in the LOGFONT structure it creates a
    font in memory. CreateFontIndirect() returns the handle to the font created in
    memory. This handle is then passed to the SelectObject() API function to get the
    font into the DC. This function returns the handle to the existing font in the
    DC, which is preserved in holdfont variable. We have used the SetTextColor() API
    function to set the color of the text to TextOut(). The RGB() uses the displayed
    through red, green and blue component values to generate a 32-bit color value.
    Note that each color component can take a value from 0 to 255. To TextOut() we
    have to pass the handle to the DC, position where the text is to be displayed,
    and the text to displayed and its length.


    With hfont only one can be associated at a time. Before associating another font
    with we deleted the existing font using the DeleteObject() API function. Once
    outside the loop we have called the EndPoint() API function to release the DC
    handle. If not released we would be wasting precious memory, because the device
    context structure would remain in memory but we would not be able access it.


    In place of TextOut() we can also use the DrawText() API function. This function
    permits finer control over the way the text is displayed. You can explore this
    function on your own.


