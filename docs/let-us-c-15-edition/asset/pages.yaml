  md: "(c) Conditional Compilation\n(d) Miscellaneous directives\n\nLet us understand\
    \ these features of preprocessor one by one.\n\n# Macro Expansion\n\nHave a look\
    \ at the following program.\n\n```\n#define UPPER 25\nmain()\n{\n    int i = 1;\n\
    \    for (i = 1; i <= UPPER; i++)\n    printf(\"%n%d\", i);\n}\n```\n\nIn this\
    \ program instead of writing 25 in the for loop we are writing\nit in the form\
