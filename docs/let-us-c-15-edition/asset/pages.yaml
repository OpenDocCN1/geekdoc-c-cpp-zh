    # Relation Between Binary and Hex


    As it turns out, computers are more comfortable with binary numbering system.
    In a binary system, there are only two digits 0 and 1. This means you can''t count
    very far before you need to start using the next column:


    +   0

    1 last available digit

    10 start using a new column

    11


    Binary numbering system is a natural system for computers because each of the
    thousands of electronic circuits in the computer can be one of the two states—on
    or off. Thus, binary numbering system corresponds nicely with the circuits in
    the computer—0 means off, and 1 means on. 0 and 1 are called bits, a short-form
    of binary digits.


    Hex numbers are used primarily as shorthand for binary numbers that the computers
    work with. Every hex digit represents four bits of binary information (Refer Figure
    D.1). In binary numbering system 4 bits taken at a time give rise to sixteen different
    numbers, so the only way to represent each of these sixteen 4-bit binary numbers
    in a simple and short way is to use a base sixteen numbering system.


    Suppose we want to represent a binary number 11000101 in a short way. One way
    is to find it decimal equivalent by multiplying each binary digit with an appropriate
    power of 2 as shown below:'
