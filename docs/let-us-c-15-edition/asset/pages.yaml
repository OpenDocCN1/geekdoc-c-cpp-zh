    # Summary


    +   - A string is nothing but an array of characters terminated by "\0".

    - Being an array, all the characters of a string are stored in contiguous memory
    locations.

    - Though scanf() can be used to receive multi-word strings, gets() can do the
    same job in a cleaner way.

    - Both printf() and puts() can handle multi-word strings.

    - Strings can be operated upon using several standard library functions like strlen(),
    strcpy() and strcmp() which can manipulate strings. More importantly we imitated
    some of these functions to learn how these standard library functions are written.

    - Though in principle a 2-D array can be used to handle several strings, in practice
    array of pointers to strings is preferred because it takes less space and is efficient
    in processing strings.

    - malloc() function can be used to allocate space in memory the fly during execution
    of the program.


