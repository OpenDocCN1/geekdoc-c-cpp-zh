  md: '# 730


    # Let Us C


    The disk drives in DOS and Windows are organized as zero-based drives. That is,
    drive A is drive number 0, drive B is drive number 1, drive C is drive number
    2, etc. The hard disk drive can be further partitioned into logical partitions.
    Each disk consists of four logical parts—Boot Sector, File Allocation Table (FAT),
    Directory and Data space. When a file/directory is created on the disk, instead
    of allocating a sector for it, a group of sectors is allocated. This group of
    sectors is often known as a cluster. How many sectors form one cluster number?
    As the capacity goes on increasing, so also does the maximum cluster number. Accordingly,
    we have 12-bit, 16-bit or 32-bit FAT. In a 12-bit FAT each entry is of 12 bits.
    Since each entry in FAT represents a cluster number, the maximum cluster number
    possible in a 12-bit FAT is $2^{12}$ (4096). Similarly, in case of a 16-bit FAT
    the maximum cluster number is $2^{16}$ (65536). Also, for a 32-bit FAT the maximum
    cluster number is $2^{28}$ (268435456). Only 28 of the 32 bits are used in this
    FAT. All FAT systems are not supported by all versions of DOS and Windows. For
    example, the 32-bit FAT system is supported only in Win 95 OSR2 version or later.
    there FAT16 system on one hand and FAT32 on the other.


    In Chapter 19 Figure 19.6 we saw the breakup of the contents of the boot sector
    of a 12-bit FAT. Given below are the contents of the boot sector of 16-bit FAT
    and a 32-bit FAT.


