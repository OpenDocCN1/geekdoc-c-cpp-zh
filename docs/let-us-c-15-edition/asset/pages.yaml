    # Let Us C


    n Chapter 5 we saw how to add/delete functions to/from existing libraries. At
    times we may want to create our own library of functions. Here we would assume
    that we wish to create a library containing the functions factorial(), prime()
    and fibonacci(). As their names suggest, factorial() calculates and returns the
    factorial value of the integer passed to it, prime() reports whether the number
    passed to it is a prime number or not and fibonacci() prints the first n terms
    of the Fibonacci series, where n is the number passed to it. Here are the steps
    that need to be carried out to create this library. Note that these steps specific
    to Turbo C/C++ compiler and would vary for other compilers.


    +   (a) Define the functions factorial(), prime() and fibonacci() in a file, say
    ''myfuncs.c''. Do not define main in this file.


    +   (b) Create a file ''myfuncs.h'' and declare the prototypes of factorial(),
    prime() and fibonacci() in it as shown below:


    ```

    int factorial ( int );

    int prime ( int );

    void fibonacci ( int );

    ```


    +   (c) From the Options menu select the menu-item ''Application''.nFrom the dialog
    that pops us select the option ''Library''.

    Select OK.


    +   (d) Compile the program using Alt F9. This would create the library file called
    ''myfuncs.lib''.


    That''s it. The library now stands created. Now we have to use the functions defined
    in this library. Here is how it can be done.


    +   (a) Create a file, say ''sample.c'' and type the following code in it.


    ```

    #include "myfuncs.h"

    main()

    ```'
