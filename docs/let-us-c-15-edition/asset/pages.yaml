  md: '# 50 Let Us C


    We all need to alter our actions in the face of changing circumstances. If the
    weather is fine, I will go for a stroll. If the highway is busy we would take
    a diversion. If she says no, I would look elsewhere. If you like this book, I
    would write the next edition. You can notice that all these decisions depend on
