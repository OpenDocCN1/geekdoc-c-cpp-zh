    Since decimal numbering system is a base 10 numbering system any number in it
    is constructed using some combination of digits 0 to 9. This seems perfectly natural.
    However, the choice of 10 as a base is quite arbitrary, having its origin possibly
    in the fact that man has 10 fingers. It is very easy to use other bases as well.
    For example, if we wanted to use base 8 or octal numbering system, which uses
    only eight digits (0 to 7), here’s how the counting would look like:


    +   0

    1

    2

    3

    4

    5

    6

    7 last available digit

    10 start using a new column

    11

    12

    ..

    ..


    Similarly, a hexadecimal numbering system has a base 16. In hex notation, the
    ten digits 0 through 9 are used to represent the values zero through nine, and
    the remaining six values, ten through fifteen, are represented by symbols A to
    F. The hex digits A to F are usually written in capitals, but lowercase letters
    are also perfectly acceptable. Here is how the counting in hex would look like:


    +   0

    1'
