  md: "# Chapter 9: Puppetting Strings\n\nHere, 65544, 65446, 65474, etc. are the\
    \ base addresses of successive names. As seen from the above pattern some of the\
    \ names do not occupy all the bytes reserved for them. For example, even though\
    \ 10 bytes are reserved for storing the name “akshay”, it occupies only 7 bytes.\
    \ Thus, 3 bytes go waste. Similarly, for each name there is some amount of wastage.\
    \ In fact, more the number of names, more would be the wastage. Can this not be\
    \ avoided? Yes, it can be... by using what is called an ‘array of pointers’, which\
    \ is our next topic of discussion.\n\n# Array of Pointers to Strings\n\nAs we\
    \ know, a pointer variable always contains an address. Therefore, if we construct\
    \ an array of pointers it would contain a number of addresses. Let us see how\
