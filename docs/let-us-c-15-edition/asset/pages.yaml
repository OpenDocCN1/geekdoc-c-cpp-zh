    \ represent any valid C statement.\n\nWhat happens when we run a program containing\
    \ a switch? First, the integer expression following the keyword switch is evaluated.\
    \ The value it gives is matched, one by one, against the constant values that\
    \ follow the case statements. When a match is found, the program executes the\
    \ statements following that case, and all subsequent case and default statements\
    \ as well. If no match is found with any of the case statements, only the statements\
    \ following the default are executed. A few examples will show how this control\
    \ structure works.\n\nConsider the following program:\n\n```\nmain()\n{\n    int\
