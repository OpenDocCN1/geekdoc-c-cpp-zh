    because the exec family functions overwrite the image of the calling process with
    the code and data of the program that is to be executed. In our case the child
    process''s memory was overwritten by the code and data of the Is program. Hence
    the call to printf() did not materialize.


    It would make little sense in calling exec() before fork( ). This is a child who
    would not get created and execcl() would simply overwrite the main process itself.
    As a result, no statement beyond the call to execcl( ) would ever get executed.
    Hence fork( ) and execcl( ) usually go in hand.


    # Zombies and Orphans


    We know the ps -A command lists all the running processes. But from where does
    the ps program get this information? Well, Linux maintains a table containing
    information about all the processes. This table is called ''Process Table''. Apart
    from other information the process table contains an entry of ''exit code'' of
    the process. This integer value indicates the reason why the process was terminated.
    Even though the process comes to an end its entry would remain in the process
    table until such time that the parent of the terminated process queries the exit
    code. This act of querying'
