    # What is Linux


    Linux is a clone of the Unix operating system. Its kernel was written from scratch
    by Linus Torvalds with assistance from a loosely-knit team of programmers across
    the world on Internet. It has all the features you would expect in a modern OS.
    Moreover, unlike Windows or Unix, Linux is available free of cost. The kernel
    of Linux is available in source code form. Anybody is free to change it to suit
    its requirement, with a precondition that the changed kernel can be distributed
    only in the source code. Several programs, frameworks, utilities have been built
    around the Linux kernel. A common user may not want the headaches of downloading
    the kernel, going through the complicated compilation process, then downloading
    the frameworks, programs and utilities. Hence many organizations have come forward
    to make this job easy. They distribute the precompiled kernel, programs, utilities
    and frameworks on a common media. Moreover, they also provide installation scripts
    for easy installations of the Linux OS and applications. Some of the popular distributions
    are RedHat, SUSE, Caldera, Debian, Mandrake, Slackware, etc. Each of them contain
    the same kernel'
