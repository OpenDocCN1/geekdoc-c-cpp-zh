    If we want to refer to the second number of the group is the usual notation used
    is per2. Similarly, the fourth number of the group is referred as per4. However,
    in C, the fourth number is referred as per[3]. This is because in C the counting
    of elements begins with 0 and not with 1. Thus, in this per[3] refers to 23 and
    per[4] refers to 96. Generally, the notation used per[i], where i can take a value
    0, 1, 2, 3, or 4, depending on the position of the element being referred. Here
    per is the subscribed variable (array), whereas i is its subscript.


    Thus, an array is a collection of similar elements. These similar elements could
    be all ints, or all floats, or all chars, etc. Usually, the array of characters
    is called a ‘string’, whereas an array of ints or floats is called simply an array.
