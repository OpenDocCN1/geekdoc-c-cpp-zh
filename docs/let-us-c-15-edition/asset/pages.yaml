    # Text versus Binary Mode: Storage of Numbers


    The only function that is available for storing numbers in a disk file is the
    `fprintf(` ) function. It is important to understand how numerical data is stored
    on the disk by `fprintf(` ). Text and characters are stored one character per
    byte, as we would expect. Numbers are stored as they are in memory, two bytes
    for an integer, four bytes for a float, and so on?


    Numbers are stored as strings of characters. Thus, 1234, even though it occupies
    two bytes in memory, transferred to the disk using `fprintf(` ), would occupy
    four bytes, one byte per character. Similarly, the floating-point number 1234.56
    would occupy 7 bytes on disk. Thus, numbers with more digits require more disk
    space.


    If large amount of numerical data is to be stored in a disk file, using text mode
    may turn out to be inefficient. The solution is to open the file in binary mode
    and use those functions (`fread` and `fwrite`) which are discussed later) which
    store the numbers in binary format. It means each number would occupy same number
    of bytes on disk as it occupies in memory.


