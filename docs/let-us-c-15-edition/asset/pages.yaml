    # Rules for Constructing Real Constants


    Real constants are often called Floating Point constants. The real constants could
    be written in two forms—Fractional form and Exponential form.


    Following rules must be observed while constructing real constants expressed in
    fractional form:


    +   (a) A real constant must have at least one digit.

    (b) It must have a decimal point.

    (c) It could be positive or negative.

    (d) Default sign is positive.

    (e) No commas or blanks are allowed within a real constant.


    Ex.: +325.34426.0-32.76-48.5792


    The exponential form of representation of real constants is usually used if the
