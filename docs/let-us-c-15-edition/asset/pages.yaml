    To create the pattern brush we first need to load the bitmap in memory. We have
    done this using the LoadBitmap() API function. The first parameter passed to this
    function is the handle to the instance of the program. When InitInstance() function
    is called from one file called WinMain() it stores the handle in a global variable
    hinst. We have passed this LoadBitmap(). The second parameter passed to it is
