    # Let Us C


    # Code and Resources


    A program consists of both instructions and static data. Static data is portion
    of the program which is not executed as machine instructions and which does not
    change as the program executes. Static data are character strings, data to create
    fonts, bitmaps, etc. The designers of Windows wisely decided that static data
    should be handled separately from the program code. The terms for static data
    is ‘Resource data’, or simply ‘Resources’. By separating static data from the
    program code the creators of Windows were able to use a standard C/C++ compiler
    to create the code portion of the finished Windows program, and they only had
    to write a ‘Resource compiler’ to create the resources that Windows use. Separating
    the code from the resource data has other advantages like reducing memory demands
    and making programs more portable. It also means that a programmer can work on
    a program’s logic, like a designer works on how the program looks.


