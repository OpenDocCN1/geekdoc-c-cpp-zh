  md: '# 702


    # Let Us C


    programmers are great innovators of our times. Unhappily, among their most enduring
    accomplishments are several new techniques for wasting time. There is no shortage
    of horror stories about programs that took twenty times to ‘debug’ they did to
    ‘write’. And one hears again and again about programs that had to be rewritten
    all over again because the bugs present in it could not be located. A typical
    C programmer’s ‘morning after’ is red eyes, blue face and a pile of crumpled printouts
    and dozens of reference books all over the floor. Bugs are C programmer’s birthplace.
    But how do we chase them away. No-shot way for that. I thought if I make a list
    of more common programming mistakes it might be of help. They are not arranged
    in any particular order. But as you would surely quite a great help!


    +   [1] Omitting the ampersand before the variables used in scanf().


    For example,


    ```

    int choice;

    canf("%d", choice) ;

    ```


    Here, the & before the variable choice is missing. Another common mistake with
    scanf() is to give blanks either just before the format string or immediately
    after the format string as in,


    ```

    int choice;

    canf("%d", choice) ;

    ```


    Note that this is not a mistake, but till you don’t understand scanf() thoroughly,
    this is going to cause trouble. Safety is in eliminating the blanks. Thus, the
    correct form would be,


    ```

    int choice;

    canf("%d", &choice) ;

    ```


    Javasimplify.blogspot.com'
