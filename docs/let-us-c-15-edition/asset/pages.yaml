    Now a formal definition of an array—An array is a collective name given to a group
    of ‘similar quantities’. These similar quantities could be percentage marks of
    100 students, or salaries of 300 employees, or ages of 50 employees. What is important
    is the quantities be ‘similar’. Each member in the group is referred to by its
    position in the group. For example, assume the following group of numbers, which
    represent percentage marks obtained by five students.


    ```

