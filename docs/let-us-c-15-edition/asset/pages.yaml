    \ expressed as NULL). The following program illustrates how the comparison is\
    \ carried out.\n\n```\nmain()\\ {\n int arr[] = { 10, 20, 36, 72, 45, 36 };\n\
    \ int *j, *k;\n\n j = &arr[4];\n k = (arr + 4);\n\n if (j == k)\n printf (\"The\
    \ two pointers point to the same location\");\n else\n printf (\"The two pointers\
    \ do not point to the same location\");\n}\n```\n\nA word of caution! Do not attempt\
    \ the following operations on pointers... they would never work out.\n\n+   (a)\
