    # Let Us C


    Which mechanic is good enough knows how to repair only one type of vehicle? None.
    Same thing is true about C language. It wouldn''t have been so popular had it
    able to handle only ints, or all floats or chars at a time. In fact when we handle
    real world data, we don''t usually deal with little atoms of information by themselves—things
    like integers, characters and such. Instead we deal with entities that are collections
    of things, each thing having its own attributes, just as the entity we call a
    ''book'' is a collection of things such as title, author, call number, publisher,
    number of pages, date of publication, as you can see all this data is dissimilar,
    example author is a string, whereas number of pages is an integer. For dealing
    with such collections, C provides a data type called ''structure''. A structure
    gathers together, different atoms of information that comprise a given entity.
    And structure is the topic of this chapter.


    # Why Use Structures


    We have seen earlier how ordinary variables can hold one piece of information
    and how arrays can hold a number of pieces of information of the same data type.
    These two data types can handle a great variety of situations. But quite often
    we deal with entities that are collection of dissimilar data types.


    For example, suppose you want to store data about a book. You might want to store
    its name (a string), its price (a float) and number of pages in it (an int). If
    data say about 3 books is to be stored, then we can follow two approaches:


    +   (a) Construct individual arrays, one for storing names, another for storing
    prices and still another for storing number of pages.


    +   (b) Use a structure variable.


