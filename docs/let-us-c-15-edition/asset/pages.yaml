  md: "# 118\n\n# Let Us C\n\n# The break Statement\n\nWe often come across situations\
    \ where we want to jump out of a loop instantly, without waiting to get back to\
    \ the conditional test. The keyword break allows us to do this. When break is\
    \ encountered inside any loop, control automatically passes to the first statement\
    \ after the loop. A break is usually associated with an if. As an example, let's\
    \ consider the following example.\n\nExample: Write a program to determine whether\
    \ a number is prime or not. A prime number is one, which is divisible only by\
    \ 1 or itself.\n\nAll we have to do test whether a number is prime or not, is\
    \ to divide it successively by all numbers from 2 to one less than itself. If\
    \ remainder of any of these divisions is zero, the number is not a prime. If no\
    \ division yields a zero then the number is a prime number. Following program\
    \ implements this logic.\n\n```\nmain()\n{\n  int num, i;\n\n  printf (\"Enter\
    \ a number \");\n  scanf (\"%d\",&num);\n\n  i=2;\n  while (i<= num - 1)\n{\n\
    \    if ( num % i == 0)\n    {\n      printf (\"Not a prime number\");\n     \
    \ break;\n    }\n    i++;\n}\n```"
  merge: -1
  pgno: 136
- img_proc: true
  md: "# Chapter 3: The Loop Control Structure\n\nIn this program the moment num %\
    \ i turns out to be zero, (i.e. num is exactly divisible by i) the message \"\
    Not a prime number\" is printed and the control breaks out of the while loop.\
    \ Why does the program require the if statement after the while loop at all? Well,\
    \ there are two ways the control could have reached outside the while loop:\n\n\
    +   (a) It jumped out because the num proved to be a prime.\n(b) The loop came\
    \ to an end because the value of i became to num.\n\nWhen the loop terminates\
    \ in the second case, it means that there was no number between 2 to num - 1 that\
    \ could exactly divide num. That is, num is indeed a prime. If this is true, the\
    \ program should print out the message \"Prime number\".\n\nThe keyword break,\
    \ breaks the control only from the while in which it is placed. Consider the following\
    \ program, which illustrates this fact.\n\n```\nmain()\n{\n    int i=1, j=1;\n\
    \n    while (i++ <= 100)\n    {\n        while (j++ <= 200)\n        {\n     \
    \       if (j == 150)\n                break;\n            else\n            \
    \    printf(\"%d %d\\n\", i,\n        }\n    );\n```"
