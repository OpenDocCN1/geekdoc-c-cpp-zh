    Observe the last three lines of the output. 65526 is original value in x plus
    2, 65524 is original value in y plus 4, and 65520 is original value in z plus
    1. This happens because every time a pointer is incremented it points to the immediately
    next location of its type. That is why, when the integer pointer x is incremented,
    it points to an address two locations after the current location, since an int
    is 2 bytes long (under Windows/Linux since int is 4 bytes, value of x would be
    65528). y points to an address 4 locations after the current location and z points
    to 1 location after the current location. This is a very important result and
    can be effectively used while passing the entire array to a function.


    The way a pointer can be incremented, it can be decremented as well, thus the
    following operations can be performed on a pointer:


    +   Addition of a number to a pointer. For example,


    ```

    int i = 4, *j;

    jj = &i;

