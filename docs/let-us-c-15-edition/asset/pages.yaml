  md: "# Chapter 21: More Linux Programming\n\nsome other signals. Registering a common\
    \ handler makes sense if we want to react to different signals in exactly the\
    \ same way.\n\n# Blocking Signals\n\nSometimes we may want that flow of execution\
    \ of a critical/time-critical portion of the program should not be hampered by\
    \ the occurrence of one or more signals. In such a case we may decide to block\
    \ the signal. Once we are through with the critical/time-code we can unlock the\
    \ signals(s). Note that if a signal arrives when it is blocked it simply queued\
    \ into a signal queue. When the signals are unblocked the process immediately\
    \ receives all the pending signals one after another. Thus blocking of signals\
    \ the delivery of signals to a process till the execution of some critical/time-critical\
    \ code is over. Instead of ignoring the signals or letting the signals interrupt\
    \ the execution, it is preferable to block the signals for the moment and deliver\
    \ them some time later. Let us now write a program to understand signal blocking.\
    \ Here is the program...\n\n```\n#include <unistd.h>\n#include <sys/types.h>\n\
