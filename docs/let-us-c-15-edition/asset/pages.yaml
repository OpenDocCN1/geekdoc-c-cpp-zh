  md: '# Chapter 2: The Decision Control Structure


    (a) It’s not necessary that the conditional operators should be used only in arithmetic
    statements. This is illustrated by the following examples:


    ```

    Ex. int i;

    scanf("%d", &i);

    (i==1 ? printf("Amit") : printf("All and sundry"));

    ```


    ```

    Ex. char a=''z'';

    printf("%c", (a>=''a'' ? a:''!''));

    ```


    (b) The conditional operators can be nested as shown below.


    ```

    int a, b, c;

    big=(a>b?(a>c?3:4):(b>c?6:8));

    ```


    (c) Check out the following conditional expression:


    ```

    a>b?g=a:b;

    ```


    This will give you an error ‘Lvalue Required’. The error can be overcome by enclosing
    the statement in the : part within a pair of parenthesis. This is shown below:


    ```

    a>b?g=(g=b);

    ```


    In absence of parentheses the compiler believes that b is assigned to the result
    of the expression to the left of second =. Hence it reports an error.


    The limitation of the conditional operators is that after the ? or after the :
    only one C statement can occur. In practice this rarely the requirement. Therefore,
    in serious C programming conditional operators aren’t as frequently used as the
    if-else.


