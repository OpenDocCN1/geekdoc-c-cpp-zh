- img_proc: true
  md: 'In the entry ‘File system version number’ the high byte contains the major
    version number, whereas, the low byte contains the minor version number.


    The entry ‘File system information sector’ contains a value indicating the sector
    number where the file system information is present. This file system information
    consists of the fields shown in Figure G.3.


    | Description | Length |

    | - | - |

    | File system signature | 4 |

    | Total number of free clusters | 4 |

    | Sector number of the next free cluster | 4 |

    | Reserved | 6 |


    Figure G.3


    The entry ‘File information sector’ contains a value OFFFh if there is no such
    sector. The entry ‘Backup boot sector’ contains a value 0FFFFh there is no backup
    boot sector. Otherwise this value is any non-zero value less than the reserved
    sector count.'
