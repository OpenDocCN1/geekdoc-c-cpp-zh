  md: "# Chapter 4: The Case Control Structure 145\n\n```\nswitch ( a )\n{\n    case\n\
    \    3:\n    case 1 +\n    2:...\n}\n```\n\n(a), (b) and (c) above may lead you\
    \ to believe that these are obvious disadvantages with a switch, especially since\
    \ there weren't any such limitations with if-else. Then why use a switch at all?\
    \ For speed—switch works faster than an equivalent if-else ladder. How come? This\
    \ is because the compiler generates a jump table for a switch during compilation.\
    \ As a result, during execution it simply refers the jump table to decide which\
    \ case should be executed, rather than actually checking which case is satisfied.\
    \ As against this, if-else are slower because they are evaluated at execution\
    \ time. A switch with 2 cases would work faster than an equivalent if-else ladder.\
    \ Also, a switch with 2 cases would work slower than an equivalent if-else ladder.\
    \ If the 10th case is satisfied then jump table would be referred and statements\
    \ for the 10th case would be executed. As against this, in an if-else ladder 10\
    \ conditions would be evaluated at execution time, which makes it slow. Note that\
    \ a lookup in the jump table is faster than evaluation of a condition, especially\
    \ if the condition is complex.\n\nIf on the other hand the conditions in the if-else\
    \ were simple and less in number then would work faster than the lookup mechanism\
    \ of a switch. Hence a switch with two cases would work slower than an equivalent\
    \ if-else. Thus, as a programmer should take a decision of which of the two should\
    \ be used.\n\n# The goto Keyword\n\nAvoid goto keyword! They make a C programmer’s\
    \ life miserable. There is seldom a legitimate reason for using goto, and its\
    \ use is\n\nJavasimplify.blogspot.com"
