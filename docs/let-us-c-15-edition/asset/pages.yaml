    # Why Use Functions


    Why write separate functions at all? Why not squeeze the entire logic into one
    function, main)? Two reasons:


    +   (a) Writing functions avoids rewriting the same code over and over. Suppose
    you have a section of code in your program that calculates the area of a triangle.
    If later in the program you want to calculate the area of a different triangle,
    you won''t like it if you are required to write the same instructions over again.
    Instead, you would prefer to jump to a ‘section of code’ that calculates the area
    and then jump back to the place from where you left off. This section of code
    is nothing but a function.


    +   (b) Using functions it becomes easier to write programs and keep track of
    what they are doing. If the operation of a program can be divided into separate
    activities, and each activity placed in a different function, then each could
    be written and checked more or less independently. Separating the code into modular
    functions also makes the program easier to design and understand.


    What is the moral of the story? Don’t try to cram the entire logic in one function.
    It is a very bad style of programming. Instead, break a program into small units
    and write functions for each of these isolated subdivisions. Don''t hesitate to
    write functions that are called only once. What is important is that these functions
    perform some logically isolated task.'
