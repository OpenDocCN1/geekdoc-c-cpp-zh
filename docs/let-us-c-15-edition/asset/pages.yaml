    Suppose, from the bit pattern 1010101 of an operand, we want to check whether
    bit number 3 is ON (1) or OFF (0). Since we want to check the bit number 3, the
    second operand for the AND operation should be 1 * 2^3, which is equal to 8. This
    operand can be represented as 0000100.


    The ANDing operation would,


    | 1010101 | Original bit pattern |

    | 00001000 | AND mask |

    | 0000100 | Resulting bit pattern |


    The resulting value we get in this case is 8, i.e the value of the second operand.
    The result turned out to be 8 since the third bit of the first operand was ON.
    Had it been OFF, the bit number 3 in the resulting bit pattern would have evaluated
    to 0 and the complete bit pattern would have been 00000000.


    Thus, depending upon the bit number to be checked in the first operand we decide
    the second operand, and on ANDing these operands the result decides whether the
    bit is ON or OFF. If the bit is ON (1), the resulting value turns out to be a
    non-zero value which is equal to the value of second operand, and if the bit is
    OFF (0) the result is zero as seen above. The following program puts this logic
