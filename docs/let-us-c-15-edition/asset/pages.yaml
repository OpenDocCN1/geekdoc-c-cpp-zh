  md: '# Preface to the Fifteen Edition


    It is mid 2004. World has left behind the DOTCOM bust, 9/11 tragedy, the economic
    downturn, etc. and moved on. Countless Indians have relentlessly worked for close
    to two decades to successfully establish “India” as a software brand. At times
    I take secret pleasure in seeing that a book that I have been part of, has contributed
    in its own little way in shaping so many budding careers that have made the “India”
    brand acceptable.


    Computing and the way people use C for doing it keeps changing as years by go.
    So overwhelming has been the response to all the previous editions of “Let Us
    C” that I have now decided that each year would come up with a new edition of
    it so that I can keep the readers abreast with the way C is being used at that
    point in time.


    There are two phases in every C programmer’s life. In the first phase he is a
    learner trying to understand the language elements and its nuances. At this stage
    he wants a simple learning environment that helps him master the language. In
    my opinion, today there isn''t any learning environment that can beat Turbo C/C++
    for simplicity. Hence the first fifteen chapters are written keeping this environment
    in mind, though a majority of these programs in these chapters would work with
    any C compiler.


    Armed with the knowledge of language elements the C programmer enters the second
    phase. Here he wishes to use all that he has learnt to create programs that match
    the ability of programs that he see in today’s world. I am pointing towards programs
    in Windows and Linux world. Chapters 16 to 21 are devoted to this. I would like
    to your attention the fact that if you want to program Windows or Linux you need
    to have a very good grasp over the Javasimplify.blogspot.com'
