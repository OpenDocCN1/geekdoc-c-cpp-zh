    \n```\nmain()\n{\n    int i = 10;\n\n    while (i = 10)\n    {\n        printf\
    \ (\"got to get out\");\n        i++;\n    }\n}\n```\n\nAt first glance it appears\
    \ the message will be printed once and the control will come out of the loop since\
    \ i becomes 11. But, actually we have fallen in an indefinite loop. This is because\
    \ the = is used in the condition always assigns the value 10 to i, and since i\
    \ is non-zero the condition is satisfied and the body of the loop is executed\
    \ over and over again.\n\n[3] Ending a loop with a semicolon.\n\nObserve the following\
    \ program.\n\n```\nmain()\n{\n    int j = 1;\n\n    while (j <= 100 )\n    {\n\
