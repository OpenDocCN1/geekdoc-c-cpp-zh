    # Summary


    +   (a) To help manipulate hardware oriented data—individual bits rather than
    bytes a set of bitwise operators are used.

    (b) The bitwise operators include operators like one''s complement, right-shift,
    left-shift, bitwise AND, OR, and XOR.

    (c) The one''s complement converts all zeros in its operand and all 1s to 0s.

    (d) The right-shift and left-shift operators are useful in eliminating bits from
    a number—either from the left or from the right.

    (e) The bitwise AND operator is useful in testing whether a bit is on/off and
    in putting off a particular bit.

    (f) The bitwise OR operator is used to turn on a particular bit.

    (g) The XOR operator works almost same as the OR operator except one minor variation.


