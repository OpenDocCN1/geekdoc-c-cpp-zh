    ```\nchar *names[] = {\n    \"akshay\",\n    \"parag\",\n    \"raman\",\n    \"\
    srinivas\",\n    \"gopal\",\n    \"rajesh\"\n};\n```\n\nIn this declaration names[]\
    \ is an array of pointers. It contains base addresses of respective names. That\
    \ is, base address of “akshay” is stored in names[0], base address of “parag”\
    \ is stored in names[1] and so on. This is depicted in Figure 9.4."
