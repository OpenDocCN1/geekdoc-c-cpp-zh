    # Where Do You Go From Here


    You have now understood signal processing, the heart of programming under Linux.
    With that knowledge under your belt you are now capable of exploring the vast
    world of Linux on your own. Complete Linux programming deserves a book on its
    own. Idea was to raise the hood and show what you lies underneath it. I am sure
    that you have taken a good look at it you can try the rest yourselves. Good luck!


    # Summary


    +   (a) Programs can communicate with the Linux OS using library functions.

    (b) The Linux OS communicates with a program by means of signals.

    (c) The interrupt signal (SIGINT) is sent by the kernel to our program when we
    press Ctrl + C.

    (d) A term signal (SIGTERM) is sent to the program when we use the kill command.

    (e) A process cannot handle an un-catchable signal.

    (f) The kill –SIGKILL variation of the kill command generates an un-catchable
    SIGKILL signal that terminates a process.'
