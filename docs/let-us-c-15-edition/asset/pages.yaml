  md: "# The continue Statement\n\nIn this program when j equals 150, break takes\
    \ the control outside the inner while only, since it is placed inside the inner\
    \ while.\n\nIn some programming situations we want to take the control to the\
    \ beginning of the loop, bypassing the statements inside the loop, which have\
    \ not yet executed. The keyword continue allows us to do this. When continue is\
    \ encountered inside any loop, control automatically passes to the beginning of\
    \ the loop.\n\nA continue is usually associated with an if. As an example, let's\
    \ consider the following program.\n\n```\nmain() {\n  int i, j;\n  for (i = 1;\
    \ i <= 2; i++) {\n    for (j = 1; j <= 2; j++) {\n      if (i == j) {\n      \
    \  continue;\n      }\n      printf(\"%d %d\\n\", i, j);\n    }\n  }\n}\n\n```\n\
    \nThe output of the above program would be...\n\n12\n21"
