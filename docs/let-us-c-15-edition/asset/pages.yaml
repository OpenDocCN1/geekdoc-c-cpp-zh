    # Bitwise AND Operator


    This operator is represented as &. Remember it is different from &&, the logical
    AND operator. The & operator operates on two operands. While operating upon these
    two operands they are compared on a bit-by-bit basis. Hence both the operands
    must be of the same type (either char or int). The second operand is often called
    an AND mask. The & operator operates on bits to yield a resultant bit. The rules
    that decide the value of the resultant bit are shown below:


