  md: 'only count things, for example. In such a case we can declare the variable
    to be unsigned, as in,


    unsigned int num_students;


    With such a declaration, the range of permissible integer values (for a 16-bit
    OS) will shift from the range -32768 to +32767 to the range 0 to 65535. Thus,
    declaring an integer as unsigned almost doubles the size of the largest possible
