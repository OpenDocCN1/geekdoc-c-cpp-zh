    Note that in this program popping of sum and address is done by fun(), whereas
    popping of the two integers is done by main(). When it is done this way it is
    known as ‘Decl Calling Convention’. There are other conventions as well where
    instead of main(), fun() itself clears the two integers. The calling convention
    also decides whether the parameters are passed to the function are pushed on the
    stack in left-to-right or right-to-left order. The standard calling convention
    always uses the right-to-left'
