    ...continued


    | | | |

    |---|---||

    | BIOS drive number | 1 | 128 |

    | Reserved | 1 | 0 |

    | Boot signature | 1 | 41 |

    | Volume ID | 4 | 649825316 |

    | Volume label | 11 | ICIT |

    | File system type | 8 | FAT32 |


    Figure G.2


    There are significant changes in the contents of the boot sector of a 32-bit FAT
    system. The entries ‘Number of hidden sectors’ and ‘Huge sectors’ have now been
    made 4-byte entries. The first two bytes contain the low word of the value, whereas
    the next two bytes contain the high word value.


    The number of sectors per FAT in a 32-bit file system is likely to exceed what
    can be accommodated in two bytes. Hence the entry ‘Sectors per FAT’ for a disk
    with a 32-bit file system would typically have a value 0. The value of ‘Sectors
    per FAT’ is now stored as a 4-byte entity, with the similar arrangement of low
    word and high word as discussed earlier.


    The boot sector of a 32-bit FAT system also has new entries like ‘Drive description
    flag’, ‘File system version’ ‘Starting cluster number of the root directory’,
    ‘Sector number of the file system information sector’, and the sector number of
    the ‘Backup boot sector’


    The ‘Drive description flag’ is a two-byte entity. Bit 8 of this flag indicates
    whether or not the information written to the active FAT will be written to all
    copies of the FAT. The low four bits of this entry contains the 0-based FAT number
    of the active FAT. These bits are meaningful only if bit 8 is set.'
  merge: -1
