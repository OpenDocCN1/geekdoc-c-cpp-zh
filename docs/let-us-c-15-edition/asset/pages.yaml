    C language too must be able to perform different sets of actions depending on
    the circumstances. In this fact is what makes it its salt. C has three major decision
    making instructions—the if statement, the if-else statement, and the switch statement.
    A fourth, somewhat less important structure is the one that uses conditional operators.
    In this chapter we will explore all these ways (except switch, which has a separate
    chapter devoted to it, later) in which a C program can react to changing circumstances.


    # Decisions! Decisions!


    In the programs written in Chapter 1 we have used sequence control structure in
    which the various steps are executed sequentially, i.e. in the order in which
    they appear in the program. In fact to execute the instructions sequentially,
    we don''t have to do anything at all. By default the instructions in a program
    are executed sequentially. However, in serious programming situations, seldom
    do''t want the instructions to be executed sequentially. Many times, we want a
    set of instructions to be executed in one situation, and an entirely different
    set of instructions to be executed in another situation. This kind of situation
    is dealt in C programs using a decision control instruction. As mentioned earlier,
    a decision control instruction can be implemented in C using:


    +   (a) The if statement

    (b) The if-else statement

    (c) The conditional operators'
