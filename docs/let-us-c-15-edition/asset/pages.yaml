    By declaring char *s as const we are declaring that the source string remain constant
    (should not change). Thus the const qualifier ensures that your program does not
    inadvertently alter a variable that you intended to be a constant. It also reminds
    anybody reading the program listing that the variable is not intended to change.


    We can use const in several situations. The following code fragment will help
    you to fix your ideas about const further.


    ```

    char *p = "Hello"; /* pointer variable, so is string */

    *p = "M"; /* works */

    p = "Bye"; /* works */

    ```


    ```

    const char *q = "Hello"; /* string is fixed pointer is not */

    *q = "M"; /* error */

    q = "Bye"; /* works */

    ```


    ```

    const char *s = "Hello"; /* string is fixed pointer is not */

    *s = "M"; /* error */

    s = "Bye"; /* works */

    ```


