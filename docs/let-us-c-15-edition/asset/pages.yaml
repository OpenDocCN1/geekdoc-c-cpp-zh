    Figure D.1


    Another method is much simpler. Just look at Figure D.1. From it find the hex
    digits for the two four-bit sets (1100 and 0101). These happen to be C and 5.
    Therefore, the binary number''s equivalent is C5. You would agree this is an easier
    way to represent the binary number to find its decimal equivalent. In this method
    multiplication nor addition is needed. In fact, since there are only 16 hex digits,
    it''s fairly easy to memorize the binary equivalent of each one. Quick now, what''s
    1100 in hex? That''s right C. You are already getting the feel of it. With a little
    practice it is easy to translate long numbers into hex. Thus, 1100 0011 1010 binary
    is C53A hex.


    As it happens with many unfamiliar subjects, hexadecimal requires a little practice.
    Try your hand at converting some binary numbers and vice versa. Soon you will
    be talking hexadecimal if you had known it all your life.'
