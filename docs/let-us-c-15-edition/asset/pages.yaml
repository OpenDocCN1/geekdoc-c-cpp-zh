  md: '# Appendix H: Linux Installation


    +   (s) In the ‘Package group selection’ screen make sure that you select the
    following options—X window system, K desktop environment, Development tools, GNOME
    software development and then click on the ‘Next’ button.

    (t) Select ‘No’ option in the ‘Boot diskette creation’ screen

    (u) Click on the ‘Next’ button in the ‘Graphical Interface (x) configuration’
    screen.

    (v) Click on the ‘Next’ button in the ‘Monitor configuration’ screen.

    (w) In the ‘Graphical’ screen select the ‘Graphical’ option and then click on
    ‘Next’ button.

    (x) Once the system restarts configure the system to boot from Hard Disk.


    # Using Red Hat Linux


    For logging into the system enter the username and password and select the session
    as KDE (K Desktop Environment). Once you have logged in, start typing the program
    using the following menu options:


    KMenu | Run Command


    A dialog will now pop up. In this dialog in the command edit box type KWrite and
    then click on the Ok button. Now you can type the program and save it.


    To compile the program you need to go to the command prompt. This can be done
    using the following menu option.


    KMenu | System Tools | Terminal


    Once at the command prompt you can use the gcc compiler to compile and execute
    your programs. You can launch another instance of the command prompt by repeating
    the step mentioned above.'
