    \ inside of while loop.\n\n*   Two languages is c and c++, they use the different\
    \ inputMethod. three data types are: number and word(no space in middle), character(white),\
    \ and string(include space in middle)\n\n*   Two languages common used input method\n\
    \n    1.  Number and non-white character word  \n\n    2.  Character(including\
    \ white-character) string(line)\n\nC  scanf(\"%d %f %c %s\",&i, &f,&c); int a\
    \ = getchar(); fgets(stdin, char*p, n )\n\nC++ cin>>i>>f>>c>>w; cin.get(char &\
    \ c); Ch = cin.get(); cin.get( char *p, n); cin.getline(char *p, n);\n\ngetline(cin,\
    \ string);\n\n In scanf, you need to specify exact data type when you read."
