    ## 引言

    有很多不同的编程语言，而 `C++` 通常不会出现在我们在学习过程中可能遇到的“简单”编程语言名单上。我们可能会发现使用这种语言有许多优势，但它通常被认为比其他可用语言更难掌握。


    随着本本指南的不断进行，你将发现这是一门非常出色的语言。它将为我们提供一些所需的最佳技巧和技术，并演示如何在该语言中编写我们所需的一些不同代码。如果你正在寻找一种可以帮助开发
    Web 应用程序、游戏等许多领域的强大编程语言，并且想立即学习如何使用它，那么本手册就是为你准备的。


    在本书中，我们将学习使用 `C++` 语言编程所需的所有知识。我们将从使用该语言的一些基础知识开始，例如：这种语言的本质是什么、它与其他语言相比的某些优势，以及回顾一些与该语言相关的历史。


    一旦我们掌握了 `C++` 编程语言的基础，我们就可以转向一些更高级的话题。我们将详细地介绍该语言的语法和基础。它与许多其他编程语言略有不同，因此在开始编写脚本之前，我们必须首先学会如何实现这一切。我们还将查看一些流行的且与
    `C++` 语言良好配合的库，这些库可以用于扩展在该语言中看到的某些功能。


    现在我们已经了解了 `C++` 编程的一些基础，并对整门语言有了更好的理解。现在是时候深入研究如何编写我们所需要的代码细节了。我们可以关注许多不同类型的代码，并且在该语言内部可以处理的许多不同事情，我们将查看其中的一些特性。


    ## 什么是 C++？

    许多初学者将 `C++` 归类为复杂的语言。无论原因是什么，`C++` 并不是一种缺乏优秀功能的复杂语言。这是因为 `C++` 是一门在过去不断演变的编程语言。


    ## C++ 的历史

    在早期，`C++` 仅被用作 `C` 的一个分支，并在编译前被转换回 `C`。一个名为 `Cfront` 的编译器因执行这项工作而闻名。然而，几年后，使用
    `C++` 的人们发现，在没有实际编译器的语言中创建代码太困难了。因此，某些开发者开始开发编译器，最终由 Bjarne Stroustrup 完成了任务，并实现了一个可行的
    `C++` 编译器。


    在几年内实现了严格的语法结构后，`C++` 在 1998 年被 `ISO` 认可。第一个更新版本在同年发布，人们对 `C++` 开始提供的新增额外功能感到惊讶。它开始使用高级技术来缩短编译时间，并在第一个版本中引入了模板（templates）。所有这些强大的新功能都帮助
    `C++` 开发了复杂的软件。在几年内，`C++` 有了巨大的进步，并包含了许多可以创建通用应用程序的高级功能。


    非常感谢微软促使了 `C++` 作为一种编程语言的迅速崛起。微软开始使用 `C++` 开发其开发软件 `Visual C++`。许多为微软系统开发应用程序的程序员开始发现使用
    `C++` 工作是多么的可靠和舒适。到 2009 年，`C++` 标准库更新了各种复杂的系统、数学函数和时间函数。


    ## 为什么 C++ 会成功？

    `C++` 的成功主要归功于它的面向对象特性。在 20 世纪 80 年代，面向对象的编程范式席卷了技术世界。人们对它提供的适应性和简单性留深刻印象。当时许多内置的
    `C` 库可以很容易地转换为 `C++` 功能库。`C++` 是 `C` 的一个主要实例，增加了继承和多态等面向对象的原则。


