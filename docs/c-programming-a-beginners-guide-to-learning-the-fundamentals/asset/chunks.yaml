  trans: "\n我们还需要查看一下在处理 C++ 语言时会遇到的一些函数。函数非常简单，它是一组为了执行特定任务而设计的语句。你用 C++ 编写的每个程序都至少包含一个函数，这被称为\
    \ `main()` 函数，但你可能需要添加更多的函数，以便让代码按照我们想要的方式运行。\n\n你可以通过多种不同的方式来实现这一点。首先，我们可以选择根据我们希望代码运行的方式将代码拆分为几个函数。你如何决定拆分代码以及使用多少个函数取决于你个人，以及你试图在代码中编写的内容。但大多数程序员会以这种方式拆分代码：使每个函数独立负责其自己的任务。\n\
    \n函数声明会告诉编译器函数名称、随函数一起的参数以及我们将看到的返回类型。但请记住，我们看到的函数定义位于该函数的实际体中。\n\n我们在 C++ 库中看到的标准库能够为我们提供许多内置在程序中的函数，我们可以在任何需要的时候调用它们。例如，如果我们使用\
    \ `strcat()` 函数，它它可以帮助我们连接两个字符串。然后我们可以使用 `memcpy()` 来帮助我们将内存中的一个位置的内容复制到另一个位置。这些只是你可以使用的不同类型的函数，你会发现它们的工作方式都是相似的。\n\
    \n考虑到这一点，我们需要更进一步，实际查看我们如何在 C++ 中应用函数。你用于定义函数的代码包含：\n\n```\nReturn type function\
    \ name (parameter list) {\n\nBody of the function\n}\n```\n\n这些函数定义由函数头和函数体组成。函数的各个部分包括以下内容：\n\
    \n*   **返回类型**：你正在处理的函数可能会返回一个值，你将使用返回类型的值在这里返回内容。某些函数可以执行你想要的操作而无需向你返回值。使用我们上面使用的语法，你最终得到的答案将是\
    \ `void`。\n*   **函数名**：这是你给函数起的名称。当你加上函数名和参数时，你就得到了所谓的函数签名（function signature）。\n\
    *   **参数**：参数是一个占位符。当你调用函数时，你将一个值传递给参数。这个值被称为实际参数或参数（argument）。参数列表将引用函数的参数数量、顺序和类型。也可以编写一个完全没有参数的函数。\n\
    *   **函数体**：最后，函数体将包含一组语句，用于定义函数的功能。\n\n在很多时候，我们将使用函数来帮助完成代码的某些部分，并确保一切都准备就绪以进行处理。务必练习这些函数，看看它们如何满足我们的需求。\n\
    \n## 修饰符的类型\n\n每当你处理 C++ 中想要执行的某些代码时，你会发现可以使用 `char`、`double` 和 `int`，以便出现在它们之前的修饰符能够存在。我们在这里讨论的修饰符将用于帮助我们更改该基础类型的含义，使其能够适应我们试图创建的任何程序或情况。有不同类型的数据修饰符可以可以使用。这些包括\
    \ `signed`、`unsigned`、`long` 和 `short`。\n\n这四种修饰符适用于我们拥任何整数基础类型。例如，你可以取 `signed`\
    \ 和 `unsigned` 来处理 `char`，然后 `long` 可以用于 `double` 等。C++ 还会让我们更容易地使用简写表示法来处理这些整数。这意味着可以直接使用这些单词，而不需要添加\
    \ `int` 部分，因为这在编码中始终是隐含的。\n\n此外还有不同类型的限定符（qualifiers）来让你的 C++ 代码正常工作。你可以使用的用于为前前的变量提供额外信息的以下限定符类型包括：\n\
    \n*   **Const**：具有 `const` 的对象在程序执行期间将无法被程序更改。\n*   **Volatile**：易变性修饰符会告诉编译器你可以更改值，但这些更改可能不会由程序显式指定。\n\
    *   **Restrict**：被 `restrict` 限定的指针最初是访问其所指向的对象的唯一手段。\n\n# 第 2 章：基础设施\n\n## 数组\n\
    \n数组是一种保存了相同类型元素顺序集合的数据结构。\n\n![C:\\Users\\Talha\\Downloads\\sigmund-2qd9noyeuRE-unsplash\
    \ (1).jpg](img/image.000.jpg)\n\n例如，在以下代码中：\n\n```cpp\n#include <iostream>\n\n\
    int main(int argc, char* argv[]) {\n    int char_array[10] = {1, 5, 9, 4, 2, 7,\
    \ 6, 3, 8, 0};\n    int sum = 0;\n    int length = sizeof(char_array) / sizeof(char_array[0]);\n\
    \n    std::cout << \"Size of array: \" << length << std::endl;\n\n    for (int\
    \ i = 0; i < length; i++) {\n        sum = sum + char_array[i];\n    }\n    std::cout\
    \ << \"Sum of numbers: \" << sum << std::endl;\n\n    int *p = char_array;\n \
    \   std::cout << \"Address of the first element: \" << p << std::endl;\n    std::cout\
    \ << \"The value in the address: \" << *p << std::endl;\n\n    p++; //移动指针到下一个元素\n\
    \    std::cout << \"Address of the second element: \" << p << std::endl;\n   \
    \ std::cout << \"The value in the address: \" << *p << std::endl;\n\n    return\
    \ 0;\n}\n```\n\n`sizeof` 函数返回数组分配的字节数。由于 `char` 数据类型占用一个字节，`sizeof` 返回的字节数等于 `char`\
    \ 数组的元素数量。\n\n整数数据类型在内存中占用 4 字节，10 个整数数组存储在 40 字节中。\n\n要计算数组中存储了多少元素，我们可以将整个数组分配的字节数除以数组中一个元素分配的字节数：`length\
    \ = sizeof(numbers) / sizeof(numbers[0])`。\n\n"
- fmt: "\nTo access all elements of an array, we have to use `for` loop.\n\n```cpp\n\
    for(i=0; i<length; i++) cout<<char_array[i];\n```\n\nIf we declare a pointer and\
    \ assign the array to the pointer, the pointer will hold the address of the first\
    \ element of the array: `int *p =numbers; cout<<\"Address of the first element\
    \ is \"<<p<<endl;`\n\nThe output of that line of code is:\n\n`Address of the first\
    \ element is 0059F710`\n\nTo access the value stored in the address of the first\
    \ element of the array using the pointer, run the following line of code: `cout<<\"\
    The value in the address is \"<<*p<<endl;` The output of the code is:\n\nThe value\
    \ in the address is 1.\n\nTo move to the next element of the array, you have to\
    \ increase `p`. `p++;`\n\nNow it will point to the second element of the array:\
    \ `cout<<\"Address of the second element is \" <<p<<endl; cout<<\"The value in\
    \ the address is\"<<*p<<endl;` The output is:\n\nThe address of the second element\
    \ of the numbers array on my PC is 0059F714\n\nThe value in the address of the\
    \ second element is 5.\n\n![](image.004.jpeg)\n\nFigure The array program output.\n\
    \n# String\n\n## String functions\n\nI will show you how to use some of the string\
    \ functions. `strcpy_s()` - copies the content of a string to another.\n\n`strcat_s()`\
    \ - appends a copy of the source string to the destination string. `strlen()`\
    \ - returns the length of a string.\n\nOur application will read the string from\
    \ user input, copy it to another string, then copy the original string characters\
    \ in the reverse sequence to the temporary string and concatenate the copy and\
    \ the reversed copy in one string.\n\nFor example, if user enters string ‘Concatenation’\
    \ then the application will output\n\n‘ConcatenationnoitanetacnoC’\n\nThe following\
    \ header files must be included in the `main.cpp` file:\n\n```cpp\n#include \"\
    stdafx.h\"\n#include <stdio.h>\n#include <cctype>\n#include <iostream>\n#include\
    \ <cstring>\n```\n\nThe `<cstring>` header is needed for the string functions:\
    \ `strcpy_s()`, `strcat_s()` and `strlen()`. The `cctype` header file is needed\
    \ for the `toupper()` function.\n\nI want to explain how I copied characters from\
    \ the original string to a temporary string in reversed order.\n\nFirst, I got\
    \ the length of the original string, using the `strlen()` function. `length=strlen(aWord);`\n\
    \nThen in the loop, I copied the last character of the original string to the\
    \ first place of the temporary string and so on.\n\nLet us examine the code in\
    \ the loop.\n\n```cpp\nfor(i=0; i <length; i++) temp[i]=aWord[length-(i+1)];\n\
    ```\n\nIf an user enters the word ‘Concatenation’ then the word length will be\
    \ 13. The index of the first character in a string is 0, then the index of the\
    \ last character of the string will be 12. It means that the index of the last\
    \ character is `length -1`.\n\nA line of code that I placed in the loop is `temp[i]=aWord[length-(i+1)];`.\n\
    \nWhen `i =0`, `temp[i]` will refer to the first character of the `temp` string.\n\
    \nAt the same time (when `i =0`) the `aWord [length-(i+1)]` will refer to the\
    \ `aWord[13 – (0 + 1)]` character and it will be `aWord[12]` that is the last\
    \ character of the ‘Concatenation’ string.\n\nWhen `i=1`, the `temp [1]` will\
    \ refer to the second character of the `temp` string and `aWord [13-(1+1)]` will\
    \ refer to the second from the end character of the ‘Concatenation’ string.\n\n\
    That way, we can copy all characters in reversed order.\n\nWhen we have copied\
    \ all the characters from the original string to the `temp` string, we need to\
    \ add null to the end of the `temp` string, because a string in C++ must be terminated\
    \ with null.\n\nThe line of code `temp[length]='\\0';` will do the job.\n\nThe\
    \ whole code is included in [visual_studio_2017.zip.](http://learn-coding.today/cplusbook/visual_studio_2017.zip.)\n\
    \n```cpp\n#include \"stdafx.h\"\n#include <stdio.h>\n#include <cctype>\n#include\
    \ <cstring>\n#include <iostream>\nint main()\n{\n    char more = 'Y';\n    char\
    \ prompt1[] = \"\\nEnter a word not more than 20 characters and press enter.\\\
    n\";\n    char prompt3[] = \"\\nDo you want to continue? Y/N\\n\";\n    char aWord[20];\n\
    \    char aCopy[40];\n    int length = 0;\n    char temp[20];\n    int i;\n\n\
    \    while (toupper(more) == 'Y')\n    {\n        std::cout << prompt1;\n    \
    \    std::cin >> aWord;\n        std::cout << \"aWord=\" << aWord << std::endl;\n\
    \        strcpy_s(aCopy, aWord);\n        std::cout << \"aCopy=\" << aCopy <<\
    \ std::endl;\n        length = strlen(aWord);\n        std::cout << \"length=\"\
    \ << length << std::endl;\n\n        //fill temp[] array with the word characters\
    \ in opposite order.\n        for (i = 0; i <length; i++) temp[i] = aWord[length\
    \ - (i + 1)];\n        temp[length] = '\\0';\n        std::cout << \"Temp=\" <<\
    \ temp <<std::endl;\n        strcat_s(aCopy, temp);\n        std::cout << \"aCopy=\"\
    \ << aCopy << std::endl;\n        std::cout << prompt3;\n        std::cin >> more;\n\
    \    }\n    return 0;\n}\n```\n"
