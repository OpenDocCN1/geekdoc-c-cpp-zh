    \ \n  void Display()\n  {\n    cout<<\"Student ID \"<<studentID<<endl; cout<<\"\
    Student Name \"<<studentName;\n  }\n};\n\nint main () {\n  Student stud1;\n  //\
    \ 给类的属性赋值\n  stud1.studentID=1;\n  stud1.studentName=\"John\";\n  stud1.Display();\n\
    \  return 0;\n}\n```\n\n通过上述程序：\n* 我们有一个名为 `Student` 的类，它有 2 个成员，一个是 `studentID`，另一个是\
    \ `studentName`。\n* 然后我们定义了一个名为 `Display()` 的成员函数，它将 `studentID` 和 `studentName`\
    \ 输出到控制台。\n* 然后我们可以在主程序中的对象中调用该成员函数。\n\n通过此程序，输出如下：\nStudent ID 1\nStudent Name\
    \ John\n\n### 那么什么是继承？\n\n继承是一个概念，我们可以定义一个类来继承另一个类的属性和方法。这有助于避免再次定义该类或再次定义其属性和方法。\n\
    \n假设我们有一个名为 `Person` 的类，它有一个 `Name` 属性和一个 `Display` 方法。那么通过继承，我们可以定义一个名为 `Student`\
    \ 的类，它可以继承自 `Person` 类。\n\n`Student` 类将自动获得 ID 成员和 `Display` 函数。如果需要，`Student`\
    \ 类可以再定义自己的额外的成员。\n\n要定义一个被继承的类，我们使用以下语法：\n`派生类:基类`\n\n这里 `派生类` 是继承另一个类属性的类，而另一个类被称为\
    \ `基类`。\n\n所以，如果我们有一个如下所示的带有属性和函数的基类。\n\n```cpp\nBase class\n{\n  Public or protected:\n\
    \  Property1;\n}\n```\n\n那么当我们从基类定义派生类时，派生类将访问该属性。注意，属性和函数需要访问修饰符为 `public` 或\
    \ `protected`。\n\n我们将稍后详细讨论访问修饰符。\n\n`派生类:基类`\n\n```cpp\n派生类:基类\n{\n  // 无需定义\
    \ property1，它会自动继承这些。\n}\n```\n\n现在让我们看一个简单的示例。\n示例 2：下面的程序展示了如何使用继承类。\n\n```cpp\n\
    #include <iostream>\nusing namespace std; // 定义一个具有 Name 属性的简单 Person 类\n\nclass\
    \ Person\n{\npublic:\n  string Name;\n};\n\n// Student 类简单派生自 Person 基类\nclass\
    \ Student:public Person\n{\n};\n\nint main () {\n  // 由于派生类可以访问基类的属性和函数，这些属性可以通过\
    \ Student 对象访问\n  Student stud1;\n  stud1.Name=\"John\";\n  return 0;\n}\n```\n\
    \n现在我们看到了如何使用派生类和基类，这被称为继承。\n\n### 1.2 派生类中的函数\n\n```cpp\nBase class\n{\n  Public\
    \ or protected:\n  Property1;\n  Fucntion1;\n}\n```\n\n当我们从基类定义派生类时，派生类将访问该属性和函数。注意，属性和函数需要访问修饰符为\
    \ `public` 或 `protected`。\n\n现在让我们看一个可以在派生类中使用函数的示例。\n示例 3：下面的程序展示了如何使用带有函数的继承类。\n\
    \n```cpp\n#include <iostream>\nusing namespace std; // 定义一个具有 Name、ID 属性以及一个名为\
    \ Display 的函数的简单 Person 类。\n\nclass Person\n{\npublic:\n  string Name;\n  int\
    \ ID;\n  void Display()\n  {\n    cout<<\"ID \"<<ID<<endl; cout<<\"Name \"<<Name;\n\
    \  }\n};\n\n// Student 类简单派生自 Person 基类\nclass Student:public Person\n{\n};\n\n\
    int main () {\n  // 由于派生类可以访问基类的属性和函数，这些属性可以通过 Student 对象访问\n  Student stud1;\n\
    \  stud1.ID=1;\n  stud1.Name=\"John\";\n  stud1.Display();\n  return 0;\n}\n```\n\
    \n通过此程序，输出如下：\nID 1\nName John\n\n"
