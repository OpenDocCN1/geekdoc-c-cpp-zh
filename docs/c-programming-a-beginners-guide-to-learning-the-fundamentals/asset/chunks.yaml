    # Chapter 10: Memory and Resources


    ![C:\Users\Talha\Downloads\pexels-olha-ruskykh-7504824.jpg](image.022.jpeg)


    ## Memory Management


    When it comes to managing the memory used by an executing program, the C++ programming
    language gives users a variety of options. In this chapter, we''ll look at some
    of the most commonly utilized options. We would also introduce some cutting-edge
    strategies for addressing memory management issues that have plagued C++ projects
    in the past.


    ### Memory Available to C++ Programs


    Modern operating systems usually reserve a section of its memory for executing
    a program that allows the operating system to manage multiple program executions
    simultaneously. There are different operating systems which layout the memory
    of executing the program in different ways. However, the layout would include
    the following four sections.


    *   **Code**: The program''s compiled executable instructions are held in the
    code section memory. While the program executes, the contents of the code section
    should never change. Also, during the program''s executions, the code segment
    does not change as well.

    *   **Data**: Persistent variables and global variables are held in the data section
    of the memory as in static locals. Throughout the life span of the executing program
    is the variables of the data would exist. However, unless the data is a constant,
    the executing program may freely change their values. Although the values stored
    in the variables found in the data segment may change during the program''s execution,
    the size of the data segment wouldn''t change while the program is executing.
    It is so because the program''s source code precisely defines the numbers of global
    and static local variables. It is also possible for the compiler to compute the
    exact size of the data segment.

    *   **Heap**: The section where the executing program obtains dynamic memory is
    called the heap. Using the `new` operator gets the memory from the heap, and the
    `delete` operator returns the previously allocated memory back to the heap. The
    size of the heap shrinks and fries during the program''s execution as the program
    deallocates and allocates dynamic memory using the `delete` and `new`.

    *   **Stack**: Function parameters and local variables are always stored in the
    stack. Function parameters and local variables disappear when the function returns
    and appears when a function is called. The size of the stack also shrinks and
    grows during the program''s execution as various functions execute.


    Generally, operating systems limit the size of the stack. Deep recursion can consume
    a considerable amount of stack space. For example, let''s consider an improperly
    written recursive function of one that omits the base case and thus exhibits an
    "infinite" recursion that would consume all the space that is available on the
    stack. A situation such as this is known as a stack overflow. Modern operating
    systems terminate any process that consumes a lot of stack. However, on some embedded
    systems, this stack overflow may go undetected. Typically, heap space is plentiful,
    and operating systems can use virtual memory to provide more space than it''s
    available in real memory for the executing program.


    ## Manual Memory Management


    Frequent memory management issues with `delete` and `new` are the majorly difficult
    to find and fix the source of the logic error. Programmers have to adhere strictly
    to the following tenets: Everything you call `new`, it should always have an associated
    call to `delete` provided the allocated memory isn''t needed. It may sound simple,
    but it isn''t always clear when delete should be used, but the function below
    shows a memory leak:


    ```cpp

    void calc(int n) {

    // ...

    // Do some stuff

    int *x = new int[n];

    // ...

    // Do some stuff with x

    // ...

    // Exit function without deleting x''s memory

    }

    ```


    Provided a program calls on the `calc` function enough times, the program will
    eventually run out of memory. In the `calc` function, `x` is a local variable.
    In that light, `x` lives on the stack. So when a user uses a particular call to
    `calc` completes, the function’s clean up code automatically releases the space
    helped by the variable `x`. Because all functions automatically manage the memory
    for their local and parameter variables. The problem with `x` is assigned via
    `new` to point to memory allocated from the heap and not the stack.


    Then operator delete should never be used to free up memory that has not been
    allocated from its previous call to `new`. The code fragment below illustrates
    one such example:


    ```cpp

    int list[10], *x = list; // x points to list

    // ...

    // Do some stuff

    // ... delete [ ] x; // Logic error, attempt to deallocate x''s memory

    ```


    The space references by the pointer `x` were not allocated by the operator `new`,
    so the operator `delete` should not be used to attempt to free the memory. When
    you attempt to delete a memory that is not allocated with `new`, it results in
