  trans: "\n\n我们之前提到过这一点，全局变量是一个未定义在作用域内的变量，因此可以在任何地方使用。外部变量是指定义在另一个位置（如另一个文件）的变量，而\
    \ `extern` 关键字用于表示该变量在另一个文件中。你可以通过在文件顶部放置以下内容来引用另一个文件：\n\n```cpp\n#include \"\
    FileName.c\"\n```\n\n这是为了告诉程序也引用此文件。注意，文件需要位于同一个位置。\n\n### 程序 1 [File_2.c]\n\n\
    ```cpp\n#include <stdio.h> #include \"C_TUT.c\" int main() { extern int globalValue;\
    \ printf(\"The global variable is: %d\", globalValue); }\n```\n\n### 程序 2 [C_TUT.c]\n\
    ```cpp\n#include <stdio.h> int globalValue = 1032;\n```\n\n运行 File_2.c 的输出：\n\n\
    > global variable is: 1032\n\n这显示 `globalValue` 是从 `C_TUT.c` 中引用的，并通过 `extern`\
    \ 关键字在另一个文件中使用的。\n\n我们在教程的基础部分提到过递归，再次强调，递归是指函数任务对自身的定义。正如我所承诺的，下面还有几个关于递归的示例：\n\
    \n```cpp\nint factorial(int x) {\n    int r;\n    // 停止条件如果 (x == 1) {\n     \
    \   // 有结论，所以循环停止 return 1;\n    }\n    else {\n        // 递归定义 return r = x *\
    \ factorial(x - 1);\n    }\n}\nint main() {\n    puts(\"Please enter a number:\
    \ \");\n    // 读取用户输入 int a, b; scanf(\"%d\", &a); // 开始执行 b = factorial(a); printf(\"\
    The factorial is: %d\", b);\n}\n```\n\n这是一个世界著名的递归示例，用于计算数字的阶乘（3 的阶乘是 3x2x1）。它通过上面的递归返回语句工作；它通过一个不包含递归定义的返回语句来停止，即当\
    \ `x = 1` 时，函数直接返回 1；这意味着栈可以回溯并找到答案。下面是一个流程图：\n\n![](img/image.018.jpeg)\n\n##\
    \ 递归\n\n递归是一个困难的概念，在这里将简单提及，其在实际的应用和功能将在高级章节中解释。\n\n递归是涉及自身引用的函数命令定义，是的，这非常困惑，我明白，但我将用一些例子来解释。\n\
    \n```cpp\nconst int maxLoops = 5;\nvoid Sequence(int previous, int now, size_t\
    \ loopCount) {\n    // 计算下一个值 int next = previous + now;\n    // 打印新值 printf(\"\
    New value: %d\\n\", next);\n    // 计数 loopCount++;\n    // 停止条件以确保不会发生无限循环如果 (loopCount\
    \ < maxLoops) {\n        // 递归调用\n        Sequence(now, next, loopCount);\n  \
    \  }\n}\nint main() {\n    Sequence(1, 1, 0);\n}\n```\n\n输出：\n\n> New value: 2\n\
    > New value: 3\n> New value: 5\n> New value: 8\n> New value: 13\n\n有几点需要注意，缺乏迭代循环，递归在本质上导致了循环。第二个需要注意的是被标记为“停止条件”的\
    \ if 语句，如果递归设置没有停止循环的条件，它们将无限循环，因此这是有效使用递归的关键元素。\n\n## 第 6 章：STL 容器和迭代器\n\n![](img/image.019.jpeg)\n\
