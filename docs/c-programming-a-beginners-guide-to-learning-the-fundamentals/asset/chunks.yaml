    class Person\n{\npublic:\n    string Name;\n    int ID;\n    void Display()\n\
    \    {\n        cout<<\"ID \"<<ID<<endl;\n        cout<<\"Name \"<<Name;\n   \
    \ }\n};\n\nclass Student:public Person {\npublic:\n    // Here we are redefining\
    \ the Display function\n    void Display()\n    {\n        cout<<\"Student ID\
    \ \"<<ID<<endl;\n        cout<<\"Student Name \"<<Name;\n    }\n};\n\nint main\
    \ () {\n    Student stud1;\n    stud1.ID=1;\n    stud1.Name=\"John\";\n    stud1.Display();\n\
    \    return 0;\n}\n```\n\nWith this program, the output is as follows:\n\n```\n\
    Student ID 1\nStudent Name John\n```\n\n### 1.3 Multiple Inheritance\n\nWe can\
    \ also make the derived class inherit from multiple base classes. This helps in\
    \ getting more functionality out of multiple classes all at once.\n\n`Derived\
    \ class: base class1, base class2… base classN`\n\nHere you just need to separate\
    \ the base classes with a comma.\n\nSo if we had a base class with a property\
    \ and a function as shown below.\n\n```cpp\nBase class1\n{\nPublic or protected:\n\
    \    Property1;\n    Fuction1;\n}\n```\n\nAnd another base class as follows.\n\
    \n```cpp\nBase class2\n{\nPublic or protected:\n    Property2;\n    Fucntion2;\n\
    }\n```\n\nThen when we define the derived class from both of the base classes,\
    \ the derived class will have access to the property and the function of both\
    \ classes.\n\n```cpp\nDerived class: Base Class1, Base Class2\n{\n    // No need\
    \ to define property1, property2, and Function1, Fucntion2 it will automatically\
    \ inherit these.\n}\n```\n\nAgain note that the property and function need to\
    \ have the access modifier as either `public` or `protected`. Let’s look at an\
    \ example of multiple derived classes.\n\n### Example 5: The following program\
