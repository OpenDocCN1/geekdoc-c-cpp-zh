  trans: "\n要访问数组的所有元素，我们必须使用 `for` 循环。\n\n```cpp\nfor(i=0; i<length; i++) cout<<char_array[i];\n\
    ```\n\n如果我们声明一个指针并将数组赋值给该指针，该指针将持有数组第一个元素的地址：`int *p =numbers; cout<<\"Address\
    \ of the first element is \"<<p<<endl;`\n\n该行代码的输出是：\n\n`Address of the first\
    \ element is 0059F710`\n\n要使用指针访问数组第一个元素地址处存储的值，请运行以下行代码：`cout<<\"The value in\
    \ the address is \"<<*p<<endl;` 该代码的输出是：\n\nThe value in the address is 1.\n\n\
    要移动到数组的下一个元素，你必须增加 `p`。`p++;`\n\n现在它将指向数组的第二个元素：`cout<<\"Address of the second\
    \ element is \" <<p<<endl; cout<<\"The value in the address is\"<<*p<<endl;` 输出结果为：\n\
    \n在我电脑上，numbers 数组的第二个元素的地址是 0059F714\n\n第二个元素的地址处的值是 5。\n\n![](img/image.004.jpeg)\n\
    \n图 数组程序的输出。\n\n# 字符串\n\n## 字符串函数\n\n我将向你展示如何使用一些字符串函数。`strcpy_s()` 将字符串的内容复制到另一个字符串。\n\
    \n`strcat_s()` - 将源字符串的副本接到目标字符串。`strlen()` - 返回字符串的长度。\n\n我们的应用程序将从用户输入读取字符串，将其复制到另一个字符串，然后将原始字符串字符倒序复制到临时字符串，并将副本和倒序后的副本合并为一个字符串。\n\
    \n例如，如果用户输入字符串‘Concatenation’，则应用程序将输出\n\n‘ConcatenationnoitanetacnoC’\n\n`main.cpp`\
    \ 文件中必须包含以下头文件：\n\n```cpp\n#include \"stdafx.h\"\n#include <stdio.h>\n#include\
    \ <cctype>\n#include <iostream>\n#include <cstring>\n```\n\n`<cstring>` 头文件用于字符串函数：`strcpy_s()`、`strcat_s()`\
    \ 和 `strlen()`。`cctype` 头文件用于 `toupper()` 函数。\n\n我想解释一下我是如何按倒序将字符从原始字符串复制到临时字符串的。\n\
    \n首先，我使用 `strlen()` 函数获取原始字符串的长度。`length=strlen(aWord);`\n\n然后在循环中，我将原始字符串的最后一个字符复制到临时字符串的开头，依此类推。\n\
    \n让我们检查循环中的代码。\n\n```cpp\nfor(i=0; i <length; i++) temp[i]=aWord[length-(i+1)];\n\
    ```\n\n如果用户输入单词‘Concatenation’，则单词长度为 13。字符串中第一个字符的索引为 0，那么字符串最后一个字符的索引将是 12。这意味着最后一个字符的索引是\
    \ `length -1`。\n\n我放在循环中的行代码是 `temp[i]=aWord[length-(i+1)];`。\n\n当 `i =0` 时，`temp[i]`\
    \ 将引用 `temp` 字符串的第一个字符。\n\n同时（当 `i =0` 时），`aWord [length-(i+1)]` 将引用 `aWord[13\
    \ – (0 + 1)]` 字符，它将是 `aWord[12]`，即‘Concatenation’字符串的最后一个字符。\n\n当 `i=1` 时，`temp\
    \ [1]` 将引用 `temp` 字符串的第二个字符，而 `aWord [13-(1+1)]` 将引用‘Concatenation’字符串中倒数第二个字符。\n\
    \n通过这样，我们就可以倒序复制所有字符。\n\n当我们把所有字符从原始字符串复制到 `temp` 字符串后，我们需要在 `temp` 字符串末尾添加空字符，因为\
    \ C++ 中的字符串必须以空字符终止。\n\n`temp[length]='\\0';` 这一行代码将完成这项工作。\n\n整个代码包含在 [visual_studio_2017.zip.](http://learn-coding.today/cplusbook/visual_studio_2017.zip.)。\n\
    \n```cpp\n#include \"stdafx.h\"\n#include <stdio.h>\n#include <cctype>\n#include\
    \ <cstring>\n#include <iostream>\nint main()\n{\n    char more = 'Y';\n    char\
    \ prompt1[] = \"\\nEnter a word not more than 20 characters and press enter.\\\
    n\";\n    char prompt3[] = \"\\nDo you want to continue? Y/N\\n\";\n    char aWord[20];\n\
    \    char aCopy[40];\n    int length = 0;\n    char temp[20];\n    int i;\n\n\
    \    while (toupper(more) == 'Y')\n    {\n        std::cout << prompt1;\n    \
    \    std::cin >> aWord;\n        std::cout << \"aWord=\" << aWord << std::endl;\n\
    \        strcpy_s(aCopy, aWord);\n        std::cout << \"aCopy=\" << aCopy <<\
    \ std::endl;\n        length = strlen(aWord);\n        std::cout << \"length=\"\
    \ << length << std::endl;\n\n        //fill temp[] array with the word characters\
    \ in opposite order.\n        for (i = 0; i <length; i++) temp[i] = aWord[length\
    \ - (i + 1)];\n        temp[length] = '\\0';\n        std::cout << \"Temp=\" <<\
    \ temp <<std::endl;\n        strcat_s(aCopy, temp);\n        std::cout << \"aCopy=\"\
    \ << aCopy << std::endl;\n        std::cout << prompt3;\n        std::cin >> more;\n\
    \    }\n    return 0;\n}\n```\n"
- fmt: "\nBinary trees are by far the most fascinating and practical of all the basic\
    \ data structures. They are a prime example of how recursion and pointers may\
    \ be utilized to accomplish some extremely important tasks.\n\nThe linked list\
    \ is one of the greatest strategies for building lists of items, but finding an\
    \ element in the list can take some time. If you have a lot of unstructured data,\
    \ an array won't help you much either. You can try sorting the array, but inserting\
    \ things will still be tough. Inserting new elements into an array that you want\
    \ to stay sorted will require a lot of shuffling! And it's critical to try to\
    \ discover items in a list as rapidly as possible, especially in situations like\
    \ these:\n\n- You’re building an MMORPG game and players need to be able to sign\
    \ in quickly—that involves quickly looking players up\n- You’re building software\
    \ to process credit cards and millions of transactions need to be handled hourly—credit\
    \ card balances need to be found very quickly\n- You’re using a low-power device,\
    \ such as a tablet or smartphone, and showing your users an address book. You\
    \ don’t want your users to keep hanging because your data structure is slow.\n\
    \nThis section will discuss the tools needed to overcome these problems and more.\n\
    \nThe idea of the solution is to be able to store elements in a structure like\
    \ a linked list, using pointers to help structure the memory, but in an easier\
    \ way than the linked list. Doing this requires that the memory have more structure\
    \ than a simple list.\n\nSo what does structuring data mean? When we started this\
    \ journey, we only had arrays, but these never really gave us the ability to use\
    \ data structures other than sequential lists. Linked lists use pointers to grow\
    \ sequential lists incrementally but don’t use the flexibility of the pointer\
    \ to build more sophisticated structures.\n\nWhat are these more sophisticated\
    \ structures in memory? Structures that hold more than a single next node at any\
    \ given time are a good example. But why would you want this? Simple. If you have\
    \ two “next nodes,” one can be used to represent elements that are more than the\
    \ current element. This is called a binary tree.\n\nThese are named because there\
    \ are always one or two branches from every node. Each of the next nodes is a\
    \ child, and the node that links to the child is the parent node.\n\nThis is what\
    \ a binary tree might look like:\n\n```\n10\n6 14\n5 8 11 18\n```\n\nIn the tree,\
    \ the left child on each of the elements is smaller than the element, and the\
    \ right child is larger. `10` is the parent node for the whole tree, and the child\
    \ nodes of `6` and `14` are both parent nodes to their own small trees, called\
    \ subtrees.\n\nBinary trees have one very important property: each child is an\
    \ entire tree. Combine this with the rule of the left child being smaller and\
    \ the right child being larger, and you have an easy way of defining algorithms\
    \ that locate specific nodes in the tree.\n\nFirst, look at the current node value.\
    \ If it equals the search target, it’s done. If it’s more than the search target,\
    \ go left; otherwise, go right. This works because each node to the left of the\
    \ tree is less than the current mode value, and each on the right is more.\n\n\
    In an ideal world, your binary tree will be balanced with the exact same number\
    \ of nodes on both sides. In such cases, every child tree is roughly 50 percent\
    \ of the entire tree and, when you search the tree for a value, the search can\
    \ eliminate 50 percent of the results each time it gets to a child node. So, if\
    \ you had a tree of 1000 elements, 500 would be immediately eliminated. Search\
    \ that tree again (it only has 50 elements now), and you can cut it by about 50\
    \ percent again. That way it doesn’t take long to find the value you want.\n\n\
    So, how many times must a tree be subdivided before you get to one element? The\
    \ answer to that is `log2n` (`n` is the number of elements the tree has). This\
    \ is a small value, even if your tree is large—if your tree had, say, 32 billion\
    \ elements, the value would be 32; almost 100 million times faster than a search\
    \ of a linked list of four billion elements, where every single one has to be\
    \ assessed.\n\nIf the tree isn’t balanced, you won’t be able to eliminate roughly\
    \ half of the elements; worst case, each node only has one child and that makes\
    \ the tree nothing more than a linked list with a few extra pointers, thus requiring\
    \ you to search all elements.\n\nSo, when a tree is balanced approximately, it’s\
    \ much faster and easier to search for nodes than the same search on a linked\
    \ list. This is because you can structure the memory of how you want it.\n\n###\
    \ Implementing a Binary Tree\n\nTo implement a binary tree, begin by declaring\
    \ the node structure:\n\n```c\nStruct node {\n    int key_value;\n    node *p_left;\n\
    \    node *p_right;\n};\n```\n\nThe node can store values as a simple integer,\
    \ `key_value`, and has two child trees — `p_left`, and `p_right`.\n\nThere are\
    \ some common functions that you want on your binary tree: inserting, searching,\
    \ removing, and destroying:\n\n```c\nnode* insert (node* p_tree, int key);\nnode\
    \ *search (node* p_tree, int key);\nvoid destroyTree (node* p_tree);\nnode *remove\
    \ (node* p_tree, int key);\n```\n\n### Inserting\n\nWe’ll use a recursive algorithm\
    \ for inserting it into the tree. Recurs is fantastic for trees because there\
    \ are two small trees for each tree; that makes the entire tree recursive by nature.\
    \ The function takes a key and a tree that already exists (even an empty one)\
    \ and returns a new tree that has the inserted value.\n\n```c\nnode* insert (node\
    \ *p_tree, int key) {\n    if (p_tree == NULL) {\n        node* new_tree = new\
    \ node;\n        new_tree->key_value = key;\n        new_tree->p_left = NULL;\n\
    \        new_tree->p_right = NULL;\n        return new_tree;\n    }\n    if (key\
    \ < p_tree->key_value) {\n        p_tree->p_left = insert(p_tree->p_left, key);\n\
    \    } else {\n        p_tree->p_right = insert(p_tree->p_right, key);\n    }\n\
    \    return p_tree;\n}\n```\n\nThe basic logic here is this: if you have an empty\
    \ tree, you create a new one. If not, the value goes to the left subtree if it’s\
    \ less than the current node, and the left subtree is then replaced. Otherwise,\
    \ insert it into the right subtree.\n\nWhen it comes to seeing it in action, build\
    \ an empty tree into a tree with a couple of nodes. If the value `10` is inserted\
    \ in the empty tree immediately we will hit base case, and the result will be\
    \ a tree of:\n\n```\n10\n```\n\nAnd both of the child trees will point to `NULL`.\
    \ Then insert `5` into the tree and make the following call: `insert(p_tree, 5)`.\
    \ Because `5` is lower than `10`, the call onto the left-subtree is recursive:\
    \ `insert(NULL, 5)`. The call of `insert(NULL, 5)` creates and returns a new tree:\n\
    \n```\n5\n```\n\nWhen the returned tree is received, `insert(5)` links the trees.\
    \ In this example, `10`’s left child was `NULL` before. Therefore, the left child\
    \ of `10` is established a new tree:\n\n```\n10\n5\n```\n\nIf we now add `7`,\
    \ we get: `insert(NULL, 7)`, `insert(p_tree, 7)`, `insert(p_tree, 7)`. So, first\
    \ off, `insert(NULL, 7)` will return a new tree:\n\n```\n7\n```\n\nAnd then `insert(p_tree,\
    \ 7)` will link to the subtree of `7` in this way:\n\n```\n5\n7\n```\n\nLastly,\
    \ the tree gets returned to: `insert(p_tree, 7)`. And this will link it back:\n\
    \n```\n10\n5\n7\n```\n\nBecause there was already a pointer from `10` to the node\
    \ with `5`, it isn’t really necessary to relink `10`’s left child to the tree\
    \ with `5` as the parent, but it does eliminate one conditional check to see if\
    \ the subtree is empty.\n"
  raw: 'Binary trees are by far the most fascinating and practical of all the basic
    data structures. They are a prime example of how recursion and pointers may be
    utilized to accomplish some extremely important tasks.


    The linked list is one of the greatest strategies for building lists of items,
    but finding an element in the list can take some time. If you have a lot of unstructured
    data, an array won''t help you much either. You can try sorting the array, but
    inserting things will still be tough. Inserting new elements into an array that
    you want to stay sorted will require a lot of shuffling! And it''s critical to
    try to discover items in a list as rapidly as possible, especially in situations
    like these:


    *   You’re building an MMORPG game and players need to be able to sign in quickly—that
    involves quickly looking players up


    *   You’re building software to process credit cards and millions of transactions
    need to be handled hourly—credit card balances need to found very quickly


    *   You’re using a low-power device, such as a tablet or smartphone, and showing
    your users an address book. You don’t want your users to keep hanging because
    your data structure is slow.


    This section will discuss the tools needed to overcome these problems and more.


    The idea of the solution is to be able to store elements in a structure like a
    linked list, using pointers to help structure the memory, but in an easier way
    than the linked list. Doing this requires that the memory have more structure
    than a simple list.


    So what does structuring data mean? When we started this journey, we only had
    arrays, but these never really gave us the ability to use data structures other
    than sequential lists. Linked lists use pointers to grow sequential lists incrementally
    but don’t use the flexibility of the pointer to build more sophisticated structures.


    What are these more sophisticated structures in memory? Structures that hold more
    than a single next node at any given time are a good example. But why would you
    want this? Simple. If you have two “next nodes,” one can be used to represent
    elements that are more than the current element. This is called a binary tree.


    These are named because there are always one or two branches from every node.
    Each of the next nodes is a child, and the node that links to the child is the
    parent node.


    This is what a binary tree might look like:


    10


    6 14


    5 8 11 18


    In the tree, the left child on each of the elements is smaller than the element,
    and the right child is larger. 10 is the parent node for the whole tree, and the
    child nodes of 6 and 14 are both parent nodes to their own small trees, called
    subtrees.


    Binary trees have one very important property: each child is an entire tree. Combine
    this with the rule of the left child being smaller and the right child being larger,
    and you have an easy way of defining algorithms that locate specific nodes in
    the tree.


    First, look at the current node value. If it equals the search target, it’s done.
    If it’s more than the search target, go left; otherwise, go right. This works
    because each node to the left of the tree is less than the current mode value,
    and each on the right is more.


    In an ideal world, your binary tree will be balanced with the exact same number
    of nodes on both sides. In such cases, every child tree is roughly 50 percent
    of the entire tree and, when you search the tree for a value, the search can eliminate
    50 percent of the results each time it gets to a child node. So, if you had a
    tree of 1000 elements, 500 would be immediately eliminated. Search that tree again
    (it only has 50 elements now), and you can cut it by about 50 percent again. That
    way it doesn’t take long to find the value you want.


    So, how many times must a tree be subdivided before you get to one element? The
    answer to that is log2n (n is the number of elements the tree has). This is a
    small value, even if your tree is large—if your tree had, say, 32 billion elements,
    the value would be 32; almost 100 million times faster than a search of a linked
    list of four billion elements, where every single one has to be assessed.


    If the tree isn’t balanced, you won’t be able to eliminate roughly half of the
    elements; worst case, each node only has one child and that makes the tree nothing
    more than a linked list with a few extra pointers, thus requiring you to search
    all elements.


    So, when a tree is balanced approximately, it’s much faster and easier to search
    for nodes than the same search on a linked list. This is because you can structure
    the memory of how you want it.


    #### Implementing a Binary Tree


    To implement a binary tree, begin by declaring the node structure: Struct node


    {


    int key_value; node *p_left; node *p_right;


    };


    The node can store values as a simple integer, key_value, and has two child trees
    —p_left, and p_right.


    There are some common functions that you want on your binary tree: inserting,
    searching, removing, and destroying:


    node* insert (node* p_tree, int key); node *search (node* p_tree, int key); void
    destroyTree (node* p_tree); node *remove (node* p_tree, int key);


    #### Inserting


    We’ll use a recursive algorithm for inserting it into the tree. Recursion is fantastic
    for trees because there are two small trees for each tree; that makes the entire
    tree recursive by nature. The function takes a key and a tree that already exists
    (even an empty one) and returns a new tree that has the inserted value. node*
    insert (node *p_tree, int key)


    {


    // base case--we have got to an empty tree and our new node


    // needs to be inserted here if ( p_tree == NULL )


    {


    node* p_new_tree = new node; p_new_tree->p_left = NULL; p_new_tree->p_right =
    NULL; p_new_tree->key_value = key; return p_new_tree;


    }


    // decide – left subtree or right subtree for the insertion


    // depending on the what the node value is if( key < p_tree->key_value )


    {


    // build a new tree from p_tree->left, and add in the key


    // replace existing p_tree->left pointer with a pointer


    // to new tree. Set the p_tree->p_left pointer


    // in case p_tree->left is NULL. (If it isn’t NULL,, 


    // p_tree->p_left won''t change but it set it just


    // to make sure.) p_tree->p_left = insert( p_tree->p_left, key );


    }


    else


    {


    // Insertion into the right side is symmetric to the 


    // insertion in the left p_tree->p_right = insert( p_tree->p_right, key );


    }


    return p_tree;


    }


    The basic logic here is this: if you have an empty tree, you create a new one.
    If not, the value for insertion goes to the left subtree if it’s more than the
    current node, and the left subtree is then replaced with the new one. Otherwise,
    insert it into the right subtree and replace it.


    When it comes to seeing it in action, build an empty tree into a tree with a couple
    of nodes. If the value 10 is inserted in the empty tree (NULL), immediately we
    will hit base case, and the result will be a tree of:


    1


    And both of the child trees will point to NULL. Then insert 5 into the tree and
    make the following call: insert(a tree with a parent , 5)


    Because 5 is lower than 10, the call onto the left-subtree is recursive: insert(
    NULL, 5 ) insert(a tree with a parent , 5) The call of insert( NULL, 5 ) creates
    and returns a new tree


    5


    When the returned tree is received, insert(,5) links the trees. In this example,
    10’s left child was NULL before. Therefore, the left child of 10 is established
    a new tree:


    1


    5


    If we now add 7, we get:


    insert( NULL, 7 ) insert(a tree with a parent, 7 ) insert(a tree with a parent
    , 7) So, first off, insert( NULL, 7 ) will return a new tree:


    7


    And then


    insert(a tree with a parent, 7 ) will link to the subtree of 7 in this way:


    5


    7


    Lastly, the tree gets returned to: insert(a tree with a parent , 7) And this will
    link it back:


    10


    5


    7


    Because there was already a pointer from 10 to the node with 5, it isn’t really
    necessary to relink 10’s left child to the tree with 5 as the parent, but it does
    eliminate one conditional check to see if the subtree is empty.'
