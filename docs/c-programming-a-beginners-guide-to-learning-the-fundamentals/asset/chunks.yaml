    \ `%x` 是因为内存地址是以十六进制表示的。\n\n要创建一个指针，我们使用解引用运算符 `*`，这这将创建一个用于存储内存地址的指针变量。下面是一个程序，它创建了一个指针并使用引用操作符\
    \ `&` 将另一个普通变量的地址存储在新创建的指针中。解引用运算符 `*` 也用于访问或更改该内存位置中的实际数据。\n\n*   解引用运算符 `*`\
    \ 用于创建指针，在更改实际值时也会使用。\n*   引用操作符 `&` 在获取指针的内存地址时使用。\n\n```c\n//普通变量 int var =\
    \ 10; //指针 int* pointer;\n//将 var 的内存地址存储在指针 pointer = &var;\n//指针现在实际上是 'var'，所以\n\
    //可以发生此类操作\n*pointer = 20;\nprintf(\"Var's value is now: %d\", var);\n```\n\n\
    Output:\n>Var 的值现在是: 20\n\n## NULL 指针\n\n当你创建一个指针时，它最初没有被赋予任何要指向的内容，这是危险的，因为指针在创建时会引用随机内存，更改该内存位置中的数据可能会导致程序崩溃。为了防止这种情况，当我们创建一个指针时，我们像这样将其赋值为\
    \ `NULL`：\n\n![](img/image.016.jpeg)\n\n```c\nint* pointer = NULL;\n```\n这意味着\
    \ NULL 指针没有指向任何内容。\n\n## 使用指针\n\n创建一个指针时，指针是可以检查的地址。如果指针不是 `NULL`，它就是有效的。\n\n\
    指针可以作为参数传递。如果指针不是 `NULL`，意味着指针是有效的。示例如下所示：\n\n```c\nvoid ChangeValue(int* ptr)\n\
    {\n    //更改内存位置的值\n    *ptr = 20;\n}\n\nint main()\n{\n    int var = 10;\n   \
    \ int* ptr = &var;\n    //传递指针\n    printf(\"Var 的值现在是: %d\\n\", var);\n    ChangeValue(ptr);\n\
    \    printf(\"Var 的值现在是: %d\\n\", var);\n    return 0;\n}\n```\n\nOutput:\n>Var\
    \ 的值现在是: 10\n>Var 的值现在是: 20\n\n## 指针算术\n\n指针在某些情况下，移动指针到另一个内存位置是有用的；这就是指针算术的应用。指向数组第一个元素的指针的示例如下：\n\
    \n```c\nint arrayInt[] = { 10, 20, 30 };\nsize_t arrayInt_Size = 3;\nint* ptr\
    \ = arrayInt;\nfor (int i = 0; i < arrayInt_Size; i++)\n{\n    //获取内存位置中的值\n \
    \   printf(\"arrayInt[%d] = %d\\n\", i, *ptr);\n    ptr++;\n}\n```\n\nOutput:\n\
    >arrayInt[0] = 10\n>arrayInt[1] = 20\n>arrayInt[2] = 30\n\n这显示指向数组地址的指针可以递增（记住数组的每个值存储在相邻的内存位置）。你可以执行相反的操作并递减指针，即让指针的值减小。\n\
    \n还可以使用关系运算符如 `==`、`<` 和 `>` 来比较指针。常用的用途是检查两个指针是否指向同一个位置：\n\n```c\nint value;\n\
    //为 ptr1 和 ptr2 赋值相同的值\nint* ptr1 = &value;\nint* ptr2 = &value;\n//ptr3 被赋值为另一个值\n\
    int* ptr3 = NULL;\nif (ptr1 == ptr2)\n{\n    printf(\"ptr1 和 ptr2 相等!\\n\");\n\
    }\nif (ptr1 != ptr3)\n{\n    printf(\"ptr1 与 ptr3 不相等\\n\");\n}\n```\n\n这检查了各种指针是否相等。使用\
    \ `>` 和 `<` 也可以这样做。\n\n## 函数指针\n\n就像你可以对变量这样做的那样，你也可以对函数执行这样做；下面的代码片段展示了如何定义函数指针。关键部分将高亮显示：\n\
    \n```c\nvoid printAddition(int value1, int value2)\n{\n    int result = value1\
    \ + value2;\n    printf(\"结果是: %d\", result);\n}\n\nint main()\n{\n    //函数指针定义\n\
    \    //<返回类型>(*<名称)(<参数>)\n    void(*functionPtr)(int, int);\n    functionPtr\
    \ = &printAddition;\n    //调用指针函数 (*functionPtr)(100, 200);\n    functionPtr(100,\
    \ 200);\n    return 0;\n}\n```\n"
- fmt: "\nWe touched on this before, but a global variable is a variable not defined\
    \ in a scope and, therefore, can be used anywhere. An external variable Is a variable\
    \ defined in a separate location like another file, and the `extern` keyword is\
    \ used to signify that the variable is in another file. You would include another\
    \ file as a reference by placing this at the top of your file:\n\n```cpp\n#include\
    \ \"FileName.c\"\n```\n\nThis is to tell the program to reference this file as\
    \ well. Note the files need to be in the same location.\n\n### Program 1 [File_2.c]\n\
    \n```cpp\n#include <stdio.h> #include \"C_TUT.c\" int main() { extern int globalValue;\
    \ printf(\"The global variable is: %d\", globalValue); }\n```\n\n### Program 2\
    \ [C_TUT.c]\n```cpp\n#include <stdio.h> int globalValue = 1032;\n```\n\nThe Output\
    \ of running File_2.c:\n\n> global variable is: 1032\n\nThis shows that the `globalValue`\
    \ is referenced from `C_TUT.c` and used in another file by using the `extern`\
    \ keyword.\n\nWe touched on recursion in the basic section of the tutorial, and\
    \ again it’s the definition of a function´s tasks with definition to itself. As\
    \ promised, there are a few more examples of recursion explained below:\n\n```cpp\n\
    int factorial(int x) {\n    int r;\n    //Stopping condition if (x == 1) {\n \
    \       //Has a conclusion so looping stop return 1;\n    }\n    else {\n    \
    \    //Recursive definition return r = x * factorial(x - 1);\n    }\n}\nint main()\
    \ {\n    puts(\"Please enter a number: \");\n    //Reads in user input int a,\
    \ b; scanf(\"%d\", &a); //Starts the execution b = factorial(a); printf(\"The\
    \ factorial is: %d\", b);\n}\n```\n\nThis is the world-famous example of recursion\
    \ that is used to find a factorial of a number (3 factorial is 3x2x1). It works\
    \ by the recursive return statement above; it stops by having a return statement\
    \ without a recursive definition, i.e. when `x = 1`, the function just returns\
    \ 1; this means the stack can unwind and find an answer. There is a flow diagram\
    \ below:\n\n![](image.018.jpeg)\n\n## Recursion\n\nRecursion is a difficult concept\
    \ and will only be lightly touched on here, and its real-world uses and functionality\
    \ explained in the advanced section.\n\nRecursion is a definition of a functions\
    \ commands involving a reference to itself, yes very confusing, I know, but I\
    \ use some examples to explain.\n\n```cpp\nconst int maxLoops = 5;\nvoid Sequence(int\
    \ previous, int now, size_t loopCount) {\n    //Works out next value int next\
    \ = previous + now;\n    //Prints new value printf(\"New value: %d\\n\", next);\n\
    \    //Increments counts loopCount++;\n    //Stopping condition to make sure infinite\
    \ looping doesn't occur if (loopCount < maxLoops) {\n        //Recursive call\n\
    \        Sequence(now, next, loopCount);\n    }\n}\nint main() {\n    Sequence(1,\
    \ 1, 0);\n}\n```\n\nOutput:\n\n> New value: 2\n> New value: 3\n> New value: 5\n\
    > New value: 8\n> New value: 13\n\nThere’re a few things to note, the lack of\
    \ iteration loops, recursion in its essence causes looping. The second thing to\
    \ note if the if statement labelled ‘stopping condition,’ if recursive set-ups\
    \ don’t have conditions that stop them looping they will loop forever, so this\
    \ is a crucial element for using recursion effectively.\n\n## Chapter 6: STL Containers\
    \ and Iterators\n\n![](image.019.jpeg)\n\n### Containers\n\nContainers are the\
    \ primary contribution of the STL, and they are for holding and accessing a sequence\
    \ of objects. The STL provides different types of containers, such as `vector`,\
    \ `list`, `map`, and `hash tables`. However, based on the characteristics of data\
    \ arrangement, the STL containers are categorized into three major sections:\n\
    \n1. Sequence containers such as `vector`, `fixed‑ size array`, `list`, `forward_list`,\
    \ and `deque`;\n2. Associative containers:\n    a) Ordered (sorted) associative\
    \ containers such as `set`, `multiset`, `map`, and `multimap`;\n    b) Unordered\
    \ (unsorted) associative containers such as `unordered_set`, `unordered_multiset`,\
    \ `unordered_map` and `unordered_map`;\n3. Container adapters such as `stack`,\
    \ `queue`, and `priority_queue`.\n\nIn addition to these, C++ provides three qualified\
    \ containers: `string`, `built-in` and `valarray`.\n\nEach of the containers has\
    \ the default constructor, constructor from arguments, copy constructor, assignment\
    \ operator, and destructor. Apart from that, most of the containers define its\
    \ own iterator.\n\n### Container iterators\n\nFrom those sections, each container\
    \ provides own iterator. Among the five categories of iterators, each container\
    \ defines any one of:\n\n**Forward iterators:**\n* Can read;\n* Can write;\n*\
    \ Can be repeated at a single location;\n* Can move forward (`++`), but cannot\
    \ move backwards, thus named forward iterator; and\n* Is used in: unordered associative\
    \ containers and `forward_list`.\n\n**Bidirectional iterator:**\n* Is same as\
    \ the forward iterator, but it can also move backwards (`++` as well as `--`),\
    \ thus named bidirectional; and\n* Is used in containers: `list`, `set`, `map`,\
    \ `multiset`, and `multimap`.\n\n**Random access iterator:**\n* Is the same as\
    \ the bidirectional iterator, but it can jump (`+=N` or `-=N`, where `N` is a\
    \ whole number) instead of (`+=1` or `-1`, where `+=1` is `++` and `-1` is `--`),\
    \ thus named random access iterator (jump iterator); and\n* Is used in containers:\
    \ `vector`, `string`, `deque` and `array<T,N>`.\n\nApart from helping the operations\
    \ of STL algorithms in the containers, the iterators also help in executing internal\
    \ operations (member functions) of the containers. Some internal operations are\
    \ common to all the sequence and associative containers, and they are:\n\n**O(1):**\n\
    `begin()`, `end()`, `cbegin()`, `cend()`, `rbegin()`, `rend()`, `crbegin()`, `crend()`,\
    \ `empty()`, `swap()`, `size()`, `max_size()`, `shrink_to_fit()`, `emplace()`\
    \ and `emplace_back()`.\n\n**O(n):**\nAssignment operator `=`, Relational operators:\
    \ `!=`, `==`, `<`, `<=`, `>`, `>=`, and `clear()`.\n\n**O(variable):**\n* `Insert()`,\
    \ `erase()` and `emplace()` (they are fast in nodebased containers and slow in\
    \ (middle of) contiguous‑ memory containers);\n* Constructors (usually, the composition\
    \ of classes have constant complexity, but all other constructors and destructors\
    \ may have linear complexity).\n\n**Note:**\na) The `forward_list` and unordered\
    \ associative containers use forwarditerators so they do not have the reverse\
    \ iterator operations: `emplace_back()`, `rbegin()`, `rend()`, `crbegin()` and\
    \ `crend()`.\nb) The associative containers support reverse iterators, but they\
    \ do not support `emplace_back()`. This is so because the associative containers\
    \ keep their elements in a sorted order, so it does not accept the command `emplace_back()`,\
    \ which insist on placing the new element at the back of the container.\n\n†The\
    \ forward list:\n1. Does not support the operator `size()`;\n"
