    With this in mind, we need to take this a bit further and actually see how we\
    \ can apply the function in C++. The code that you will be able to use in order\
    \ to define the function will include:\n\n```\nReturn type function name (parameter\
    \ list) {\n\nBody of the function\n}\n```\n\nThese function definitions will consist\
    \ of a function header and a function body. The parts of the function will include\
    \ the following:\n\n*   **Return type**: The function that you are working on\
    \ may return a value, and you will use the value of return type in order to get\
    \ something to return here. Some functions will be able to do the operations that\
    \ you want without returning value to you. With the syntax that we used above,\
    \ you would end up with an answer to the `void`.\n*   **Function name**: This\
    \ is the name that you will give to the function. When you add in the name of\
    \ the function with the parameter, you will get what is called the function signature.\n\
    *   **Parameters**: The parameter is a placeholder. When you invoke the function,\
    \ you are passing a value over to the parameter. This value will be referred to\
    \ as the actual parameter or as the argument. The parameter list will then be\
    \ able to refer to the number, order, and type of the parameters of the function.\
    \ It is possible to work on a function that does not have any parameters at all.\n\
    *   **Function body**: And finally, the function body is going to contain a collection\
    \ of statements that are able to define what the function does.\n\nThere are a\
    \ lot of times when we are going to be able to use the functions to help us get\
    \ some parts of our code done and to ensure that we get it all set up and ready\
    \ to handle. Make sure to practice these functions to see how they are going to\
    \ work for our needs.\n\n## The Types of Modifiers\n\nAny time that you are working\
    \ with some of the codes that you want to do in C++, you will find that you will\
    \ be able to use `char`, `double`, and `int` in order to allow the modifier that\
    \ shows up before it to be there. The modifier that we are talking about here\
    \ is going to be used to help us alter up the meaning of that base type so that\
    \ it is going to fit into any program or situation that we are trying to create.\
    \ There are going to be different types of modifiers of the data that we are able\
    \ to work with. These include `signed`, `unsigned`, `long`, and `short`.\n\nThese\
    \ four modifiers are going to be applicable to any of the base types of integers\
    \ that we have. You are able to take the `signed` and `unsigned`, for example,\
    \ in order to work with a `char`, and then `long` can be used on a `double` for\
    \ example. C++ is also going to make it easier for us to work with shorthand notation\
    \ to help with these integers. This means that they are able to use those words\
    \ without needing to add in the `int` part since this is always implied in the\
    \ coding.\n\nThere are also different types of qualifiers in order to get things\
    \ to work on your C++ code. The following types of qualifiers that you will be\
    \ able to use in order to provide some additional information about the variables\
    \ the precede include:\n\n*   **Const**: Objects that have the `const` will not\
    \ have the ability to be changed by the program while you are executing it.\n\
    *   **Volatile**: The modifier of volatility will tell the compiler that you are\
    \ able to change the value but these changes may not be explicitly specified by\
    \ the program.\n*   **Restrict**: a pointer that has been qualified by `restrict`\
    \ is initially the only means by which an object it points to can be accessed.\n\
    \n# Chapter 2: Basic Facilities\n\n## Array\n\nArray is a data structure that\
    \ holds a sequential collection of elements of the same type.\n\n![C:\\Users\\\
    Talha\\Downloads\\sigmund-2qd9noyeuRE-unsplash (1).jpg](image.000.jpg)\n\nFor\
    \ example, in the code below:\n\n```cpp\n#include <iostream>\n\nint main(int argc,\
    \ char* argv[]) {\n    int char_array[10] = {1, 5, 9, 4, 2, 7, 6, 3, 8, 0};\n\
    \    int sum = 0;\n    int length = sizeof(char_array) / sizeof(char_array[0]);\n\
    \n    std::cout << \"Size of array: \" << length << std::endl;\n\n    for (int\
    \ i = 0; i < length; i++) {\n        sum = sum + char_array[i];\n    }\n    std::cout\
    \ << \"Sum of numbers: \" << sum << std::endl;\n\n    int *p = char_array;\n \
    \   std::cout << \"Address of the first element: \" << p << std::endl;\n    std::cout\
    \ << \"The value in the address: \" << *p << std::endl;\n\n    p++; //move pointer\
    \ to the next element\n    std::cout << \"Address of the second element: \" <<\
    \ p << std::endl;\n    std::cout << \"The value in the address: \" << *p << std::endl;\n\
    \n    return 0;\n}\n```\n\nThe `sizeof` function returns the number of bytes allocated\
    \ for the array. Since `char` data type occupies one byte, the number of bytes\
    \ returned by `sizeof` equals to the number of elements of the `char` array.\n\
    \nThe integer data type occupies 4 bytes in the memory, and an array of 10 integers\
    \ is stored in 40 bytes.\n\nTo calculate how many elements are stored in an array\
    \ we can divide the number of bytes allocated for the whole array by the number\
    \ of bytes allocated to one element of the array: `length = sizeof(numbers) /\
    \ sizeof(numbers[0])`.\n"
