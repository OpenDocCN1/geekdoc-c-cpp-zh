  trans: "\n\n## 2. 相比于 `insert()`、`erase()` 和 `emplace()`，它提供了 `insert_after()`、`erase_after()`\
    \ 和 `emplace_after()`。\n\n## 3. 在 `begin()`、`cbefore_begin()` 之前有特殊的迭代器，例如：\n\n\
    * 在正向列表中的操作：`my_fwd_list.insert_after` \n* `(my_fwd_list.before_begin(), inv_data.gold);`\
    \ 等同于列表中的以下操作：`my_list.insert`\n* `(my_list.begin(), inv_data.gold);`\n* **注意**：没有任何容器可以越界\
    \ `end()` 之后写入或读取，即：\n* `my_fwd_list.insert_after(my_fwd_list.end(), inv_data.gold);`\
    \ 是一个错误！\n\n‡ `shrink_to_fit()` 请求移除未使用的内存容量，它仅适用于 `vector`、`deque` 和 `string`。\n\
    \n†† 无序容器不支持关系运算符：`<`、`<=`、`>` 和 `>=`。\n\n![](img/image.020.jpeg)\n\n在上述运算符列表中，`O`\
    \ 代表复杂度。简而言，虽然复杂度意味着函数的时间和/或空间复杂度，但在容器中它是时间复杂度；\n\n* `O(1)` 代表常数时间复杂度；\n* `O(log\
    \ n)` 代表对数时间复杂度；\n* `O(n)` 代表线性时间复杂度；\n\n相比之下，`O(n) > O(log n) > O(1)`，这意味着 `O(1)`\
    \ 是最快的操作；注意：这些是预期或平均复杂度，而标准库文档对某些运算符引用了最坏情况复杂度。\n\n有少数容器不支持迭代器，它们是：容器适配器、`bitset`\
    \ 和 `valarray`。**注意**：C++11 为 `valarray` 定义了迭代器 `begin()` 和 `end()`。\n\n## STL\
    \ 迭代器\n\n迭代器、容器和算法是惠普罗派克公司的 Alexander Stepanov 等人在 20 世纪 90 年代初的标准模板库的组件，随后在标准库中进行了合并和改进。\n\
    \n迭代器是特殊指针的抽象，用于对给定容器（如 `vector`、`map` 和用户自定义容器类）的元素进行解引用。\n\n每个容器类都包含用于生成迭代器的成员函数，例如，成员\
    \ `begin()` 和 `end()` 分别返回指向第一个元素和最后一个元素之后元素的迭代器。\n\n下图描绘了迭代器 `*it` 与其容器 `vector<int>data\
    \ {1111, 1134, 1134, 1124, 1124, 1134, 1111, 1176, 1124, 1134, 1176}` 之间的关系。\n\
    \n然后，迭代器可以在算法操作（如 `sort`、`accumulate` 和自定义算法函数）中包含容器的元素。换句话说，迭代器将容器与算法关联起来。\n\n\
    最常用的迭代器来自 `begin()` 和 `end()`。如下所示：\n\n如图所示，`data[0]` 和 `data.begin()` 代表同一个元素，即\
    \ `elem 1`，但 `data[N]` 和 `data.end()` 代表一个“无人区”，访问它会导致运行时错误。然而，成员函数 `end()` 在迭代语句中构造条件时非常有用。\n\
    \n以下代码说明了迭代器的这一基本属性：\n\n```cpp\n// iterators.cpp\n\n#include \"..\\..\\my_essentials.hpp\"\
    \ \nvoid illustrate_iterators()\n{\nint arr[] = {1111, 1134, 1134, 1124, 1124,\
    \ 1134, 1111, 1176, 1124, 1134, 1176}; \nvector<int>data(arr, arr+ sizeof(arr)/sizeof(arr[0])\
    \ );\n\n// vector<int>data2{1111, 1134, 1134, 1124, 1124, 1134, 1111, 1176, 1124,\
    \ 1134, 1176}; \n// fine with gcc4.7.0 \ncout << \"\\n Illustration of iterators:\
    \ \\n\" << \"\\n Given vector: data =\\n\\t( \";\n\nfor(auto element: data) //\
    \ 'the range-based for' do not work with VC10.\n cout << element << \"; \"; cout\
    \ << \")\\n\\n Let us define an iterator, say *it for this vector.\\n\";\nvector<int>::iterator\
    \ it = data.begin();\n\n/*\nNote:\n在 STL 容器中，每个容器模板类定义了自己的迭代器成员类， \n所以 vector<int>::iterator\
    \ 与 list<int>::iterator 是不同的。\n*/ \ncout << \" Thus,\\t\\t*it = \" << *it << \"\
    \ that is data[0]\\n Iterators can be incremented, i.e, ++it;\\n\";\n\n++it; cout\
    \ << \" After ++\\t*it = \" << *it << \" that is data[1]\\n\";\n```\n\n上述程序演示了迭代器结合容器数据的用处。\n\
    \n正如我们看到的，迭代器可以用于打印容器的内容，因此我们在头文件 `my_essentials.hpp` 中编写与容器无关的代码。这对于单类型容器 `vector<T>`、`list<T>`、`set<T>`、`multiset<T>`、`deque<T>`\
    \ 以及固定大小的 `array<T,N>` 适用，但对于双类型容器 `map<T1,T2>` 和 `unordered_multimap<T1,T2>`\
    \ 则不适用。\n\n```cpp\n//-------------------------------\n// 容器无关的打印代码\n// 单类型 template<typename\
    \ container> void cout_container(const std::string& message, const container&\
    \ data)\n\n{ cout << message << \"{\"; if(data.empty()){cout << \"NULL}\"<<endl;\
    \ return; }\n\n auto start = data.begin(); auto end = data.end(); while(true)\n\
    \n { cout << *start;\n\n ++start; if(start != end) cout << \", \"; else{cout <<\
    \ '}' << endl; break; }\n\n }\n```\n\n"
- fmt: "\nLet us add this template in the `my_essentials.hpp` and test the template\
    \ with the following code.\n\nThen, let us test this template:\n\n```cpp\n// cout_containers.cpp\n\
    \n#include \"..\\..\\my_essentials.hpp\"\n#include <array>\n#include <vector>\n\
    #include <unordered_set>\n#include <forward_list> \n#include <set> \nint main()\n\
    {\n // Let us define, // a fixed-size array array<int,6> arr = {1,3,5,1,2,4};\
    \ cout_container(\"my array\\t = \", arr);\n // a vector vector<int> vec(arr.begin(),\
    \ arr.end()); cout_container(\"my vector\\t = \", vec);\n // a forward_list forward_list<int>\
    \ f_lis(arr.begin(), arr.end()); cout_container(\"my forward_list\\t = \",f_lis);\n\
    \ // an unordered_set unordered_set<int> u_set(arr.begin(), arr.end()); cout_container(\"\
    my unordered_set = \", u_set); // a set container set<int>se(arr.begin(), arr.end());\
    \ cout_container(\"my set\\t\\t = \", se); just_pause();\n}\n```\n\nThe output\
    \ is:\n`my array = {1, 3, 5, 1, 2, 4}`\n`my vector = {1, 3, 5, 1, 2, 4}`\n`my\
    \ forward_list = {1, 3, 5, 1, 2, 4}`\n`my unordered_set = {1, 3, 5, 2, 4}`\n`my\
    \ set = {1, 2, 3, 4, 5}`\n\nAs we experimented with some applications of iterators,\
    \ now we summarize their operations in the following table.\n\nIterators do not\
    \ have a single definition, so not all iterators can support every operation mentioned\
    \ above. Iterators are categorized into five kinds, viz.\n\nThus, with this primary\
    \ discussion, we found that pointers and their property of dereferencing over\
    \ different objects play a vital role to iterators and STL operations.\n\n# Chapter\
    \ 7: STL Algorithm\n\nThe STL algorithms are found in `<algorithms>` header file,\
    \ so we need to include it in our program. The algorithms can be classified as:\n\
    \n- Non-modifying algorithms: e.g. `for each`, `count`, `search` etc.\n- Modifying\
    \ algorithms: e.g `copy`, `transform`, etc.\n- Removing algorithms: `remove`,\
    \ `remove if`, etc.\n- Mutating algorithms: `reverse`, `rotate`, etc.\n- Sorting\
    \ algorithms: `sort`, `partial sort`, etc.\n- Sorted range algorithms: `binary\
    \ search`, `merge`, etc.\n- Numeric algorithms: `accumulate`, `partial sum`, `inner\
    \ product`, etc.\n\nThe following example shows how `sort()` function works on\
    \ arrays.\n\n## Program 13.11: sorting of array using sort algorithm\n\n```cpp\n\
    #include <iostream> \n#include <algorithm> \nusing namespace std; \nint main()\n\
    { \n    int a[ ] = {3,5,7,2,9}; \n    sort(a, a + 5); \n    cout << \"Sorted Array:\"\
    \ << endl; \n    for (int i = 0; i <5; i++) cout << a[i] << \" \";\n    return\
    \ 0;\n}\n```\n\nOutput:\n```\nSorted Array:\n2 3 5 7 9\n```\n\nIn the example\
    \ above, when we pass array name `a` as an argument, we are telling the function,\
    \ to sort at the beginning of the array. If we wanted it to start the sort at\
    \ the third element of the array, we can use `sort(a+3, a+5);`.\n\nWe have used\
    \ `a+5` for the second argument, which specifies that we want to sort to the last\
    \ element in the array.\n\nNow similar `sort()` function can work with `vector`\
    \ container as shown in following program. This shows that STL algorithms are\
    \ generic.\n\n## Program 13.12: Sorting of vector using sort algorithm\n\n```cpp\n\
    #include <iostream>\n#include <algorithm> \n#include <vector> \nusing namespace\
    \ std; \nint main()\n{ \n    int a[ ] = {5,3,7,6,2,9}; \n    vector<int> v(a,\
    \ a+6) ; \n    sort(v.begin(), v.end()); \n    for (int i = 0; i != v.size();\
    \ i++) cout << v[i] << \" \"; \n    cout << endl; \n    return 0;\n}\n```\n\n\
    Output:\n```\n2 3 5 6 7 9\n```\n\nAs you can see, the sorting function works almost\
    \ the same as on an array. The first parameter in `sort()` accepts an iterator\
    \ to the first element using `begin()` as it returns a iterator to the first element.\
    \ So it will start sorting at the first element in the vector. Same way `end()`\
    \ returns an iterator that points to 1 past the last element in the container.\
    \ Note that `sort` function sorts up to but not including what we pass as the\
    \ second parameter.\n\n### find() and count() algorithm\n\nThe `find()` algorithm\
    \ is helpful to find particular value from the container. `count()` is used to\
    \ count how many times a particular value appears in container.\n\n## Program\
    \ 13.13: Finding value from vector using find algorithm\n\n```cpp\n#include <iostream>\n\
