    \ list<T>, set<T>, multiset<T>, deque<T> and fixed ‑ size array<T,N>, but not\
    \ for containers with two type names such as map<T1,T2> and unordered_multimap<T1,T2>.\n\
    \n//-----------------------------------------------\n\n// Container independent\
    \ code for printing out\n\n// container with one typename template<typename container>\
    \ void cout_container(const std::string& message, const container& data)\n\n{\
    \ std::cout << message << \"{\"; if(data.empty()){ std::cout << \"NULL}\"<<std::endl;\
    \ return;\n\n }\n\n auto start = data.begin(); auto end = data.end(); while(true)\n\
    \n { std::cout << *start;\n\n ++start; if(start != end) std::cout << \", \"; else{\
    \ std::cout <<'}' << std::endl; break;\n\n }\n\n }\n\n}"
