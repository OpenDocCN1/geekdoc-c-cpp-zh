    for the function calculator, as you see from the highlight the function parameter
    is defined like it is above with the return type, name and parameters being defined,
    all that is passed into calculator is &add and &sub for the function pointers.
    The calculator function then goes on to invoke the pointer and passes in the values
    and returns the result.


    #### Storage Classifications


    In C each variable can be given a storage class that can define certain characteristics.


    The classes are:


    ![](image.017.png)Automatic variables


    Static variables


    Register variables External variables


    #### Automatic variables


    Every variable we have defined so far has been an automatic variable; they are
    created when a function is called and automatically destroyed when a function
    exits. These variables are also known as local variables.


    auto int value; Is the same as int value;


    #### Static variables


    Static is used when you want to keep the variable from being destroyed when it
    goes out of scope; this variable will persist until the program is complete. The
    static variable is created only once throughout the lifetime of the program. Below
    is an example of a static variable in use:


    void tick()


    {


    //This will run once static int count = 0; count++; printf("The count is now:
    %d\n", count);


    } int main()


    { tick(); tick(); tick();


    }


    Output:


    >The count is now: 1


    >The count is now: 2


    >The count is now: 3


    The area highlighted section is the static definition and will only run once.


    #### Register variables


    The register is used to define a variable that is to be store in register memory
    opposed to regular memory, the benefits register memory has is it is much much
    quicker to access; however, there is only space for a few variables.


    Defining a register variable is done like so:


    register int value;


