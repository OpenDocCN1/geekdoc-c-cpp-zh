  trans: "\n二叉树是目前所有基础数据结构中最迷人且实用的结构。它们是如何利用递归和指针来完成某些极其重要任务的典型示例。\n\n链表是构建项目列表的最伟大策略之一，但在列表中查找元素可能花费一些时间。如果你有大量的非结构化数据，数组对你也没有什么大帮助。你可以尝试对数组进行排序，但插入元素仍然很困难。在一个你想保持排序的数组中插入新元素将需要大量的移动！而且，在尽可能快速在列表中发现项，在中是至关重要的，尤其是在以下这些场景中：\n\
    \n- 你正在开发一款 MMORPG（大型多人在线角色扮演）游戏，玩家需要能够快速登录——这涉及到快速查找玩家。\n- 你正在构建一个处理信用卡的软件，每小时需要处理数百万笔交易——需要非常快地找到信用卡余额。\n\
    - 你正在使用低功耗设备（如平板电脑或智能手机）并向用户显示通讯录。你不希望用户因为你的数据结构太慢而一直卡顿。\n\n本节将讨论克服这些问题及更多所需的工具。\n\
    \n解决方案的思路是能够在像链表这样的结构中存储元素，利用指针来帮助构建内存，但方法比链表更简单。这要求内存具有比简单列表更多的结构。\n\n那么，数据结构化意味着什么？当我们开始这段旅程时，我们只有数组，但这些从未真正赋予我们使用顺序列表以外的数据结构的能力。链表使用指针增量地增长顺序列表，但没有利用指针的灵活性来构建更复杂的结构。\n\
    \n内存中这些更复杂的结构是什么？在任何给定时刻持有比单个“下一个节点”更多节点的结构就是一个很好的例子。但你为什么想要它呢？很简单。如果你有两个“下一个节点”，其中一个可以用来表示比当前元素更多的元素。这被称为二叉树。\n\
    \n它们之所以这样命名，是因为每个节点都始终有一个或两个分支。每个下一个节点都是子节点，而连接到子节点的节点就是父节点。\n\n二叉树看起来可能像：\n\n\
    ```\n10\n6 14\n5 8 11 18\n```\n\n在树中，每个元素的左孩子都小于该元素，而右孩子大于它。`10` 是整棵树的父节点，而 `6`\
    \ 和 `14` 的子节点都是它们各自小树（称为子树）的父节点。\n\n二叉树有一个非常重要的属性：每个孩子都是一整棵树。将左孩子小于、右孩子大于的规则结合起来，你就有了一种定义在树中定位特定节点的算法简单方法。\n\
    \n首先，查看当前节点的值。如果它等于搜索目标，就完成了。如果它大于搜索目标，向左走；否则向右走。这之所以有效，是因为树左侧的每个节点都小于当前节点值，右侧的每个节点都更大。\n\
    \n在理想的世界中，你的二叉树是平衡的，两侧节点数量完全相同。在这种情况下，每个子树大约占整棵树的 50%，当你在树中搜索一个值时，搜索每到达一个子节点，就可以排除\
    \ 50% 的结果。所以，如果你有一棵拥有 1000 个元素的树，500 个会立即被排除。再次搜索这棵树（现在它只有 50 个元素了），你可以再次削减大约\
    \ 50%。这样，找到你想要的值就不需要长时间。\n\n那么，树必须被细分多少次才能到达一个元素？答案是 `log2n`（`n` 是树拥有的元素数量）。即使你的树很大，这也是一个小值——如果你的树有，比如\
    \ 320 亿个元素，该值为 32；这比搜索一个拥有 40 亿元素的链表快了近 1 亿倍，而在链表中，每一个元素都必须经过评估。\n\n如果树不是平衡的，你就无法排除大约一半的元素；最坏的情况下，每个节点只有一个孩子，这使得这棵树无非带有几个额外指针的链表，因此需要你搜索所有元素。\n\
    \n所以，当树大致平衡时，搜索节点比在链表上进行相同的搜索快得多且容易得多。这是因为你可以按照你的方式来构建内存。\n\n### 实现二叉树\n\n要实现二叉树，从声明节点结构开始：\n\
    \n```c\nStruct node {\n    int key_value;\n    node *p_left;\n    node *p_right;\n\
    };\n```\n\n节点可以存储简单的整数 `key_value` 作为值，并有两个子树——`p_left` 和 `p_right`。\n\n你可能在二叉树上需要一些常用函数：插入、搜索、删除和销毁：\n\
    \n```c\nnode* insert (node* p_tree, int key);\nnode *search (node* p_tree, int\
    \ key);\nvoid destroyTree (node* p_tree);\nnode *remove (node* p_tree, int key);\n\
    ```\n\n### 插入\n\n我们将使用递归算法将其插入树中。递归对于树来说是极佳的，因为每个树都有两个小树；这使得整棵树在本质上是递归的。该函数接收一个键和一个已经存在的树（即使是空的），并返回一个新树。\n\
    \n```c\nnode* insert (node *p_tree, int key) {\n    if (p_tree == NULL) {\n  \
    \      node* new_tree = new node;\n        new_tree->key_value = key;\n      \
    \  new_tree->p_left = NULL;\n        new_tree->p_right = NULL;\n        return\
    \ new_tree;\n    }\n    if (key < p_tree->key_value) {\n        p_tree->p_left\
    \ = insert(p_tree->p_left, key);\n    } else {\n        p_tree->p_right = insert(p_tree->p_right,\
    \ key);\n    }\n    return p_tree;\n}\n```\n\n这里的基本逻辑是：如果你有一个空树，就创建一个新的。如果不是，如果值小于当前节点，则进入左子树；否则，进入右子树。\n\
    \n关于它的运行效果，将一个空树构建成带有节点的树。如果值 `10` 插入空树中，我们将立即命中基础情况，结果将是一棵：\n\n```\n10\n```\n\
    \n并且两个孩子树将指向 `NULL`。然后向树插入 `5` 并产生以下调用：`insert(p_tree, 5)`。因为 `5` 小于 `10`，对左树的调用是递归的：`insert(NULL,\
    \ 5)`。`insert(NULL, 5)` 创建并返回一个新树：\n\n```\n5\n```\n\n当接收返回的树时，`insert(5)` 连接树。在这个例子中，`10`\
    \ 的左孩子之前是 `NULL`。因此，`10` 的左孩子建立了一棵新树：\n\n```\n10\n5\n```\n\n如果我们现在添加 `7`，我们得到：`insert(NULL,\
    \ 7)`, `insert(p_tree, 7)`, `insert(p_tree, 7)`。所以，首先，`insert(NULL, 7)` 将返回一个新树：\n\
    \n```\n7\n```\n\n然后 `insert(p_tree, 7)` 以这种方式连接到 `7` 的子树：\n\n```\n5\n7\n```\n\n\
    最后，树返回到：`insert(p_tree, 7)`。这将将其连回：\n\n```\n10\n5\n7\n```\n\n由于已经存在一个从 `10` 指向\
    \ `5` 节点的指针，我们并不真正需要重新连接 `10` 的左孩子到以 `5` 为父节点的树，但这确实消除了一个检查子树是否为空的条件判断。\n"
- fmt: "\n### Destroying\n\nThis should also be a recursive function. Before deleting\
    \ the current node, the algorithm destroys both of the subtrees that are at the\
    \ current node.\n\n```cpp\nvoid destroy_tree (node *p_tree)\n{\n  if ( p_tree\
    \ != NULL )\n  {\n    destroy_tree( p_tree->p_left ); destroy_tree( p_tree->p_right\
    \ ); delete p_tree;\n  }\n}\n```\n\nAs a way of better understanding this, let’s\
    \ say that the value of the node was printed before the node was deleted:\n\n\
    ```cpp\nvoid destroy_tree (node *p_tree)\n{\n  if ( p_tree != NULL )\n  {\n  \
    \  destroy_tree( p_tree->p_left ); destroy_tree( p_tree->p_right ); cout << \"\
    Deleting node: \" << p_tree->key_value; delete p_tree;\n  }\n}\n```\n\nAs you\
    \ can see, the tree is deleted from the bottom up. Nodes 5 and 8 go first, then\
    \ 6, before moving to the other side and deleting 11 and 18, followed by 14. Lastly,\
    \ 10 will be deleted. The tree values aren’t important; what matters is where\
    \ the node is. In the following binary tree, rather than the node values, we use\
    \ the order of deletion:\n\n7\n3 6\n1 2 4 5\n\nIt can be helpful to walk through\
    \ the code manually on a few trees, so you can see it much clearer.\n\nDeleting\
    \ from trees is a great example of a recursive algorithm that’s not easy to do\
    \ as an iterative implementation. First, you need a loop that can deal with both\
    \ sides of the tree at the same time. You need to be able to delete a subtree\
    \ while simultaneously tracking the next one, and that needs to be done for every\
    \ level. With the stack, you can keep your place much more easily. The best way\
    \ of visualizing this is to say that each stack frame will store the tree branch\
    \ that has been deleted or destroyed already:\n\n`destroy_tree( )` `destroy_tree(\
    \ )`––know whether the subtree was the left or right Each of the stack frames\
    \ knows which bits of the tree have to be destroyed because it knows what point\
    \ in the function execution should continue. When the first call to destroy the\
    \ tree is made, the program is notified by the stack frame to continue executing\
    \ when the second call is made to `destroy_tree`. When that second call is made,\
    \ the program is told to continue with the `delete tree`. Because every function\
    \ has a stack frame of its own, it can track the entire state of the tree’s destruction\
    \ at the current time, one tree level at a time.\n\nTo implement this in a non-recursive\
    \ way would require having a data structure that retains the same amount and type\
    \ of information. You could, for example, write a function that holds a linked\
    \ list as a way of simulating the list. That linked list would have subtrees that\
    \ were being destroyed and trees left for destruction. Then a loopbased algorithm\
    \ could be written to add the subtrees to the list and remove them after they\
    \ were destroyed fully. Basically, recursion lets you use the stack data structure\
    \ built-in rather than needing to write your own.\n\n# Chapter 4: Inheritance\n\
    \n![C:\\Users\\Talha\\Downloads\\pexels-thisisengineering-3861964.jpg](image.012.jpeg)\n\
    \nExample: `#include <iostream>` `using namespace std;`\n\n```cpp\n// defining\
    \ a simple student class with 2 members\nclass Student\n{ \npublic:\n  int studentID;\
    \ string studentName;\n  // Function to display the members of the class \n  void\
    \ Display()\n  {\n    cout<<\"Student ID \"<<studentID<<endl; cout<<\"Student\
    \ Name \"<<studentName;\n  }\n};\n\nint main () {\n  Student stud1;\n  //Assigning\
    \ values to the properties of the class\n  stud1.studentID=1;\n  stud1.studentName=\"\
    John\";\n  stud1.Display();\n  return 0;\n}\n```\n\nWith the above program:\n\
    * We have a class called `Student` which has 2 members, one is `studentID` and\
    \ the other is called `studentName`.\n* We then define a member function called\
    \ `Display()` which outputs the `studentID` and `studentName` to the console.\n\
    * We can then call the member function from the object in the main program.\n\n\
    With this program, the output is as follows:\nStudent ID 1\nStudent Name John\n\
    \n### So Then What is Inheritance?\n\nInheritance is a concept wherein we can\
    \ define a class to inherit the properties and methods of another class. This\
    \ helps in not having the need to define the class again or having the properties\
    \ and methods defined again.\n\nLet’s say that we had a class called `Person`,\
    \ which had a property of `Name` and a method of `Display`. Then through inheritance,\
    \ we can define a class called `Student`, which could inherit the `Person` class.\n\
    \nThe `Student` class would automatically get the ID member and the `Display`\
    \ function. The `Student` class could then define its own additional members if\
    \ required.\n\nTo define an inherited class, we use the following syntax:\n`Derived\
    \ class:Base class`\n\nHere the `Derived class` is the class that will inherit\
    \ the properties of the other class, known as the `Base class`.\n\nSo if we had\
    \ a base class with a property and a function as shown below.\n\n```cpp\nBase\
    \ class\n{\n  Public or protected:\n  Property1;\n}\n```\n\nThen when we define\
    \ the derived class from the base class, the derived class will have access to\
    \ the property. Note that the property and function need to have the access modifier\
    \ as public or protected.\n\nWe will look at access modifiers in greater detail\
    \ later on.\n\n`Derived class: Base Class`\n\n```cpp\nDerived class: Base Class\n\
    {\n  // No need to define property1, it will automatically inherit these.\n}\n\
    ```\n\nNow let’s look at a simple example.\nExample 2: The following program is\
    \ used to showcase how to use inherited class. `#include <iostream>` `using namespace\
    \ std;` // Defining a simple Person class with a property of Name\n\n```cpp\n\
    class Person\n{ \n  public: \n  string Name;\n};\n\n// Here we have the derived\
    \ class. It defines another property of\nclass Student:public Person\n{\n  public:\n\
    \  int ID;\n  // Function to display both ID and Name. Since Name is available\
    \ from the base class\n  void Display()\n  {\n    cout<<\"Student ID \"<<ID<<endl;\
    \ cout<<\"Student Name \"<<Name;\n  }\n};\n\nint main () {\n  Student stud1;\n\
    \  stud1.ID=1;\n  stud1.Name=\"John\";\n  stud1.Display();\n  return 0;\n}\n```\n\
    \nWith the above program:\n* We are defining a class called `Person` that has\
    \ one member called `Name`.\n* We then use inheritance to define the `Student`\
    \ class.\n* Notice that we now define another property called `ID`.\n* In the\
    \ `Display` function, note that we can use the `Name` property without the need\
    \ for defining it in the `Student` class.\n\nNow we have seen how to use derived\
    \ and base classes, which is also known as inheritance.\n\n### 1.2 Functions in\
    \ Derived Classes\n\n```cpp\nBase class\n{\n  Public or protected:\n  Property1;\n\
    \  Fucntion1;\n}\n```\n\nWhen we define the derived class from the base class,\
    \ the derived class will have access to the property and the function as well.\
    \ Note that the property and function need to have the access modifier as public\
    \ or protected.\n\n`Derived class: Base Class`\n\n```cpp\nDerived class: Base\
    \ Class\n{\n  // No need to define property1 and Function1, it will automatically\
    \ inherit these.\n}\n```\n\nLet’s now look at an example where we can use functions\
    \ in derived classes.\nExample 3: The following program is used to showcase how\
    \ to use an inherited class with functions.\n\n```cpp\n#include <iostream>\nusing\
    \ namespace std; // Defining a simple Person class with a property of Name, ID,\
    \ and also a function called Display.\n\nclass Person\n{\npublic:\n  string Name;\n\
    \  int ID;\n  void Display()\n  {\n    cout<<\"ID \"<<ID<<endl; cout<<\"Name \"\
    <<Name;\n  }\n};\n\n// The Student class simply derives itself from the Person\
    \ base class\nclass Student:public Person\n{\n};\n\nint main () {\n  // Since\
    \ the derived class has access to the properties and functions of the base class\
    \ , these can be accessed via the Student object\n  Student stud1;\n  stud1.ID=1;\n\
    \  stud1.Name=\"John\";\n  stud1.Display();\n  return 0;\n}\n```\n\nWith this\
    \ program, the output is as follows:\nID 1\nName John\n"
