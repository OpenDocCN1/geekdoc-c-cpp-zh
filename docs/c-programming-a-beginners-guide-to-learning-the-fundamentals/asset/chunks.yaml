  trans: "\n让我们将此模板添加到 `my_essentials.hpp` 中，并使用以下代码测试该模板。\n\n然后，让我们测试这个模板：\n\n```cpp\n\
    // cout_containers.cpp\n\n#include \"..\\..\\my_essentials.hpp\"\n#include <array>\n\
    #include <vector>\n#include <unordered_set>\n#include <forward_list> \n#include\
    \ <set> \nint main()\n{\n // 让我们定义， // 一个固定大小的数组 array<int,6> arr = {1,3,5,1,2,4};\
    \ cout_container(\"my array\\t = \", arr);\n // 一个 vector vector<int> vec(arr.begin(),\
    \ arr.end()); cout_container(\"my vector\\t = \", vec);\n // 一个 forward_list forward_list<int>\
    \ f_lis(arr.begin(), arr.end()); cout_container(\"my forward_list\\t = \",f_lis);\n\
    \ // 一个 unordered_set unordered_set<int> u_set(arr.begin(), arr.end()); cout_container(\"\
    my unordered_set = \", u_set); // 一个 set 容器 set<int>se(arr.begin(), arr.end());\
    \ cout_container(\"my set\\t\\t = \", se); just_pause();\n}\n```\n\n输出结果：\n`my\
    \ array = {1, 3, 5, 1, 2, 4}`\n`my vector = {1, 3, 5, 1, 2, 4}`\n`my forward_list\
    \ = {1, 3, 5, 1, 2, 4}`\n`my unordered_set = {1, 3, 5, 2, 4}`\n`my set = {1, 2,\
    \ 3, 4, 5}`\n\n在我们实验了迭代器的一些应用后，现在我们在下表中总结了它们的操作。\n\n迭代器没有统一的定义，因此并不是所有的迭代器都能支持上述所有的操作。迭代器分为五类，即：\n\
    \n因此，通过这一主要讨论，我们发现指针及其对不同对象的解引用属性对迭代器和 STL 操作起着至关重要的作用。\n\n# 第 7 章：STL 算法\n\n\
    STL 算法位于 `<algorithms>` 头文件中，因此我们需要在程序中包含它。算法可以分类为：\n\n- 非修改性算法：例如 `for each`、`count`、`search`\
    \ 等。\n- 修改性算法：例如 `copy`、`transform` 等。\n- 删除算法：`remove`、`remove if` 等。\n- 变动算法：`reverse`、`rotate`\
    \ 等。\n- 排序算法：`sort`、`partial sort` 等。\n- 有序范围算法：`binary search`、`merge` 等。\n-\
    \ 数值算法：`accumulate`、`partial sum`、`inner product` 等。\n\n示例展示了 `sort()` 函数如何在数组上工作。\n\
    \n## 程序 13.11：使用 sort 算法对数组排序\n\n```cpp\n#include <iostream> \n#include <algorithm>\
    \ \nusing namespace std; \nint main()\n{ \n    int a[ ] = {3,5,7,2,9}; \n    sort(a,\
    \ a + 5); \n    cout << \"Sorted Array:\" << endl; \n    for (int i = 0; i <5;\
    \ i++) cout << a[i] << \" \";\n    return 0;\n}\n```\n\n输出：\n```\nSorted Array:\n\
    2 3 5 7 9\n```\n\n在上面的示例中，当我们把数组名 `a` 作为参数传递时，我们是在告诉函数从数组的开头开始排序。如果我们希望从数组的第三个元素开始排序，可以使用\
    \ `sort(a+3, a+5);`。\n\n我们使用 `a+5` 作为第二个参数，这指定我们想要排序到数组的最后一个元素。\n\n现在，类似的 `sort()`\
    \ 函数可以在 `vector` 容器上工作，如下面的程序所示。这说明 STL 算法是通用的。\n\n## 程序 13.12：使用 sort 算法对 vector\
    \ 排序\n\n```cpp\n#include <iostream>\n#include <algorithm> \n#include <vector>\
    \ \nusing namespace std; \nint main()\n{ \n    int a[ ] = {5,3,7,6,2,9}; \n  \
    \  vector<int> v(a, a+6) ; \n    sort(v.begin(), v.end()); \n    for (int i =\
    \ 0; i != v.size(); i++) cout << v[i] << \" \"; \n    cout << endl; \n    return\
    \ 0;\n}\n```\n\n输出：\n```\n2 3 5 6 7 9\n```\n\n你可以看到，排序函数的工作方式与对数组几乎相同。`sort()`\
    \ 中的第一个参数接受一个指向第一个元素的迭代器（使用 `begin()`），因为它返回一个指向第一个元素的迭代器。因此，它将从 vector 的第一个元素开始排序。同样，`end()`\
    \ 返回一个指向容器中最后一个元素之后位置的迭代器。注意，`sort` 函数排序到第二个参数所指定的位置，但不包含该位置。\n\n### find() 和\
    \ count() 算法\n\n`find()` 算法有助于从容器中查找特定值。`count()` 用于统计特定值在容器中出现的次数。\n\n## 程序 13.13：使用\
    \ find 算法从 vector 中查找值\n\n```cpp\n#include <iostream>\n#include <algorithm> \n\
    #include <vector> \nusing namespace std; \nint main()\n{\n    vector<int> v; \n\
    \    for(int i = 0; i < 10; i++) v.push_back(i); \n    int a = 5; \n    vector<int>::iterator\
    \ it; \n    it = find(v.begin(),v.end(),a); \n    if(it != v.end()) {\n      \
    \  cout << \"found \" << a<< endl;\n    } else {\n        int c = count(v.begin(),v.end(),a);\n\
    \        cout<<\"could not find \" << a;\n    } \n    return 0;\n}\n```\n"
- fmt: "\nThe `iostream` file is probably the most common and generic of all C++ library\
    \ files.\n\nMost C++ programs include this header file.\n\nThe `iostream` file\
    \ provides a large range of input/output functions and other I/O stream information.\n\
    \nFor example, this is where `cin` and `cout` data and functions are prototyped.\n\
    \n## Note\n\nC++ I/O occurs in streams of bytes, where a stream is simply a sequence\
    \ of bytes.\n\nThere are many variations of C++ libraries available to programmers.\
    \ And these libraries originate from a number of sources.\n\nFor example, some\
    \ libraries come with C++ application development software.\n\nC++ function libraries\
    \ may also be supplied by sources such as device driver manufacturers, and C++\
    \ programming web sites and bulletin boards.\n\nYour best source of reference\
    \ is usually the manuals and help files included with your C++ application development\
    \ software.\n\nThere are also a number of reference books available, some of which\
    \ cover specific compilers.\n\n## Use of library functions\n\nTo demonstrate the\
    \ use of standard library functions, let's consider a program that does the following:\n\
    \n- Gets the absolute value of the number -55:\n\n```cpp\n#include <iostream>\
    \ using namespace std; #include <cmath> void main(void)\n{\n cout <<\"The absolute\
    \ value of -55 is \"<<abs(-55)<< \"\\n\";\n}\n```\n\n- Calculates the square root\
    \ of 100:\n\n```cpp\ncout <<\"The square root of 100 is \"<<sqrt(100.0)<< \"\\\
    n\";\n```\n\n- Evaluates 10 to the power of 5:\n\n```cpp\ncout<<\"10 to the power\
    \ of 5 is\"<<pow(10, 5)<< \"\\n\";\n```\n\nThe result of each calculation is output\
    \ to the screen.\n\n## Note\n\nThis program uses no user-defined functions.\n\n\
    The standard math library contains functions to perform each of the three calculations\
    \ required.\n\nThese are:\n\n- `abs()`\n- `sqrt()`\n- `pow()`\n\n```cpp\n#include\
    \ <iostream> using namespace std; #include <cmath> void main(void)\n{\n cout <<\"\
    The absolute value of -55 is \"<<abs(-55)<< \"\\n\"; cout <<\"The square root\
    \ of 100 is \"<<sqrt(100.0)<< \"\\n\"; cout <<\"10 to the power of 5 is \"<<pow(10,5)<<\
    \ \"\\n\";\n}\n```\n\nThe first thing to decide when writing this program is which\
    \ header files to include.\n\nTo call `abs()`, `sqrt()`, and `pow()`, you need\
    \ to include the header file `cmath` in a preprocessor directive.\n\nYou also\
    \ need to include the header file `iostream` so that `cin` and `cout` statements\
    \ can be used.\n\n```cpp\n#include <iostream> using namespace std; #include <cmath>\
    \ void main(void)\n{\n cout <<\"The absolute value of -55 is \"<<abs(-55)<< \"\
    \\n\"; cout <<\"The square root of 100 is \"<<sqrt(100.0)<< \"\\n\"; cout <<\"\
    10 to the power of 5 is \"<<pow(10,5)<< \"\\n\";\n}\n```\n\n## Note\n\nThe function\
    \ `abs()` is also included in the `stdlib.h` header file.\n\nOnce you've completed\
    \ the preprocessor directives, you can begin coding `main()`.\n\n```cpp\n#include\
    \ <iostream> using namespace std; #include <cmath> void main(void)\n{\n cout <<\"\
    The absolute value of -55 is \"<<abs(-55)<< \"\\n\"; cout <<\"The square root\
    \ of 100 is \"<<sqrt(100.0)<< \"\\n\"; cout <<\"10 to the power of 5 is \"<<pow(10,5)<<\
    \ \"\\n\";\n}\n```\n\nThe return value of each of the three functions is displayed\
    \ directly on screen by three separate `cout` statements.\n\nYou can display a\
    \ combination of constants, data types, and expression values in a `cout` statement,\
    \ provided that each unique item is separated by the insertion operator (`<<`).\n\
    \n```cpp\n#include <iostream> using namespace std; #include <cmath> void main(void)\n\
    {\n cout <<\"The absolute value of -55 is \"<<abs(-55)<< \"\\n\"; cout <<\"The\
    \ square root of 100 is \"<<sqrt(100.0)<< \"\\n\"; cout <<\"10 to the power of\
    \ 5 is \"<<pow(10,5)<< \"\\n\";\n}\n```\n\nIn the first `cout` statement, the\
    \ first value displayed is a constant string.\n\nThen the return value of the\
    \ math library function `abs()` is displayed through a call to the function.\n\
    \n```cpp\n#include <iostream> using namespace std; #include <cmath> void main(void)\n\
    {\n cout <<\"The absolute value of -55 is \"<<abs(-55)<< \"\\n\"; cout <<\"The\
    \ square root of 100 is \"<<sqrt(100.0)<< \"\\n\"; cout <<\"10 to the power of\
    \ 5 is \"<<pow(10,5)<< \"\\n\";\n}\n```\n\nThe `abs()` function calculates the\
    \ absolute value of the integer passed as its function parameter. And the function\
    \ returns a value of type `int`.\n\nIn this example the argument is a constant,\
    \ instead of a variable of type `int`.\n\n```cpp\n#include <iostream> using namespace\
    \ std; #include <cmath> void main(void)\n{\n cout <<\"The absolute value of -55\
    \ is \"<<abs(-55)<< \"\\n\"; cout <<\"The square root of 100 is \"<<sqrt(100.0)<<\
    \ \"\\n\"; cout <<\"10 to the power of 5 is \"<<pow(10,5)<< \"\\n\";\n}\n```\n\
    \nWhen the `cout` statement is executed, the function is called, and the number\
    \ 55 is displayed on screen.\n\n```cpp\n#include <iostream> using namespace std;\
    \ #include <cmath> void main(void)\n{\n cout <<\"The absolute value of -55 is\
    \ \"<<abs(-55)<< \"\\n\"; cout <<\"The square root of 100 is \"<<sqrt(100.0)<<\
    \ \"\\n\"; cout <<\"10 to the power of 5 is \"<<pow(10,5)<< \"\\n\";\n}\n```\n\
    \nThe next two lines of code perform function calls in the same way as the first\
    \ line.\n\nThe function `sqrt()` accepts a single argument of type `double` and\
    \ returns a value of type `double`.\n\nIn this example, the number 10 is displayed\
    \ on screen.\n\n```cpp\n#include <iostream> using namespace std; #include <cmath>\
    \ void main(void)\n{\n cout <<\"The absolute value of -55 is \"<<abs(-55)<< \"\
    \\n\"; cout <<\"The square root of 100 is \"<<sqrt(100.0)<< \"\\n\"; cout <<\"\
    10 to the power of 5 is \"<<pow(10,5)<< \"\\n\";\n}\n```\n\n## Note\n\nA domain\
    \ error occurs if the argument is a negative number.\n\nThe library function `pow()`\
    \ accepts two arguments of type `double` and returns a value of type `double`.\n\
    \nWhen the `cout` statement executes, the number 100000 is displayed.\n\n```cpp\n\
    #include <iostream> using namespace std; #include <cmath> void main(void)\n{\n\
    \ cout <<\"The absolute value of -55 is \"<<abs(-55)<< \"\\n\"; cout <<\"The square\
    \ root of 100 is \"<<sqrt(100.0)<< \"\\n\"; cout <<\"10 to the power of 5 is \"\
    <<pow(10,5)<< \"\\n\";\n}\n```\n\n# Chapter 9: I/O\n\n## I/O basic\n\n### I/O\
    \ knowledge\n\n*   Neither C++ nor C has built input and output. They use functions(C)\
    \ or other I/O (C++)\n\n*   C++ I/O class and head file\n\n1.  `iostream` stand\
    \ for three head files `<iostream>` `<fstream>` and `<sstream>`. `<iostream>`\
    \ automatically. They are three main file you should include in your C++ application.\n\
    \n2.  `iostream(streambuf)`, `fstream(filebuf)`, `stringstream(stringbuf)` and\
    \ four pre-defined object: `cin`, `cout`, `clog` and `cerr`.\n\n3.  `clog` is\
    \ just like `cerr`, but it buffer its output.\n\n4.  C++ normally flushes the\
    \ input buffer when you press enter. For output to the display, C++ program flushes\
    \ the output buffer when you transmit a newline character, or reaches an input\
    \ statement.\n\n5.  `>>` And `<<` don’t need to format string, C++ will automatically\
    \ convert it, it’s better than `printf` and `scanf` in C language.\n\n6.  Through\
    \ inheritance, `fstream` and `cin(cout)` share the same usage. All the knowledge\
    \ can be used directly in `fstream`. I like the most.\n\n# Input\n\n## Input basic\n\
    \n### Input knowledge\n\n### I/O basic\n\n*   One basic idea: In order to make\
    \ continuously input, you need to use `while(inputMethod)`, When two things happens:\n\
    \    1.  User want to end input (`ctrl+D`) or read the end of File;\n    2.  Read\
    \ fail (for example, `cin>> int`, but input letter ’a’);\n\n`inputMethod` will\
    \ return false. Then you need to use some flag or status to tell the difference\
    \ between EOF and error inside of while loop.\n\n*   Two languages is c and c++,\
    \ they use the different `inputMethod`. three data types are: number and word(no\
    \ space in middle), character(white), and string(include space in middle)\n\n\
    *   Two languages common used input method\n    1. Number and non-white character\
    \ word\n    2. Character(including white-character) string(line)\n\nC: `scanf(\"\
    %d %f %c %s\",&i, &f,&c); int a = getchar(); fgets(stdin, char*p, n )`\n\nC++\
    \ `cin>>i>>f>>c>>w; cin.get(char & c); Ch = cin.get(); cin.get( char *p, n); cin.getline(char\
    \ *p, n);`\n\n`getline(cin, string);`\n\nIn `scanf`, you need to specify exact\
    \ data type when you read.\n"
