  trans: "\n`iostream` 文件可能是所有 C++ 库文件中最常见且通用的文件。\n\n大多数 C++ 程序都会包含这个头文件。\n\n`iostream`\
    \ 文件提供了大量的输入/输出函数以及其他的 I/O 流信息。\n\n例如，`cin` 和 `cout` 的数据和函数原型就在这里定义。\n\n## Note\n\
    \nC++ 的 I/O 是在字节流中进行的，其中流简单来说就是字节的序列。\n\n程序员可以使用许多变种的 C++ 库。而且，这些库源于多个来源。\n\n\
    例如，某些库是随 C++ 应用程序开发软件一起提供的。\n\nC++ 函数库也可能由如设备驱动程序制造商、C++ 编程网站和公告板等来源提供。\n\n你最好的参考来源通常是你的\
    \ C++ 应用程序开发软件附带的手手册和帮助文件。\n\n还有许多参考书籍供选择，其中一些涵盖了特定的编译器。\n\n## 库函数的使用\n\n为了演示标准库函数的使用，让我们考虑一个执行以下操作的程序：\n\
    \n- 获取数字 -55 的绝对值：\n\n```cpp\n#include <iostream> using namespace std; #include\
    \ <cmath> void main(void)\n{\n cout <<\"The absolute value of -55 is \"<<abs(-55)<<\
    \ \"\\n\";\n}\n```\n\n- 计算 100 的平方根：\n\n```cpp\ncout <<\"The square root of 100\
    \ is \"<<sqrt(100.0)<< \"\\n\";\n```\n\n- 计算 10 的 5 次方：\n\n```cpp\ncout<<\"10\
    \ to the power of 5 is\"<<pow(10, 5)<< \"\\n\";\n```\n\n每个计算结果都会输出到屏幕上。\n\n##\
    \ Note\n\n此程序没有使用任何自定义函数。\n\n标准数学库包含了执行这三个计算所需的每个函数。\n\n这些是：\n\n- `abs()`\n- `sqrt()`\n\
    - `pow()`\n\n```cpp\n#include <iostream> using namespace std; #include <cmath>\
    \ void main(void)\n{\n cout <<\"The absolute value of -55 is \"<<abs(-55)<< \"\
    \\n\"; cout <<\"The square root of 100 is \"<<sqrt(100.0)<< \"\\n\"; cout <<\"\
    10 to the power of 5 is \"<<pow(10,5)<< \"\\n\";\n}\n```\n\n编写此程序时首先要决定的是包含哪些头文件。\n\
    \n为了调用 `abs()`、`sqrt()` 和 `pow()`，你需要在预处理器指令中包含头文件 `cmath`。\n\n你还需要包含头文件 `iostream`，以便可以使用\
    \ `cin` 和 `cout` 语句。\n\n```cpp\n#include <iostream> using namespace std; #include\
    \ <cmath> void main(void)\n{\n cout <<\"The absolute value of -55 is \"<<abs(-55)<<\
    \ \"\\n\"; cout <<\"The square root of 100 is \"<<sqrt(100.0)<< \"\\n\"; cout\
    \ <<\"10 to the power of 5 is \"<<pow(10,5)<< \"\\n\";\n}\n```\n\n## Note\n\n\
    函数 `abs()` 也包含在 `stdlib.h` 头文件中。\n\n一旦你完成了预处理器指令，就可以开始编写 `main()` 代码了。\n\n```cpp\n\
    #include <iostream> using namespace std; #include <cmath> void main(void)\n{\n\
    \ cout <<\"The absolute value of -55 is \"<<abs(-55)<< \"\\n\"; cout <<\"The square\
    \ root of 100 is \"<<sqrt(100.0)<< \"\\n\"; cout <<\"10 to the power of 5 is \"\
    <<pow(10,5)<< \"\\n\";\n}\n```\n\n这三个函数中的每一个返回值通过三个独立的 `cout` 语句直接显示在屏幕上。\n\n\
    你可以在 `cout` 语句中显示常量、数据类型和表达式值的组合，只要每个唯一项目都通过插入运算符（`<<`）隔开。\n\n```cpp\n#include\
    \ <iostream> using namespace std; #include <cmath> void main(void)\n{\n cout <<\"\
    The absolute value of -55 is \"<<abs(-55)<< \"\\n\"; cout <<\"The square root\
    \ of 100 is \"<<sqrt(100.0)<< \"\\n\"; cout <<\"10 to the power of 5 is \"<<pow(10,5)<<\
    \ \"\\n\";\n}\n```\n\n在第一个 `cout` 语句中，显示的第一个值是一个常量字符串。\n\n然后，通过调用函数显示数学库函数 `abs()`\
    \ 的返回值。\n\n```cpp\n#include <iostream> using namespace std; #include <cmath> void\
    \ main(void)\n{\n cout <<\"The absolute value of -55 is \"<<abs(-55)<< \"\\n\"\
    ; cout <<\"The square root of 100 is \"<<sqrt(100.0)<< \"\\n\"; cout <<\"10 to\
    \ the power of 5 is \"<<pow(10,5)<< \"\\n\";\n}\n```\n\n`abs()` 函数计算作为其函数参数传递的整数的绝对值。该函数返回一个\
    \ `int` 类型的值。\n\n在例例中，参数是一个常量，而不是 `int` 类型的变量。\n\n```cpp\n#include <iostream>\
    \ using namespace std; #include <cmath> void main(void)\n{\n cout <<\"The absolute\
    \ value of -55 is \"<<abs(-55)<< \"\\n\"; cout <<\"The square root of 100 is \"\
    <<sqrt(100.0)<< \"\\n\"; cout <<\"10 to the power of 5 is \"<<pow(10,5)<< \"\\\
    n\";\n}\n```\n\n当 `cout` 语句执行时，通过函数调用显示 `55`。\n\n```cpp\n#include <iostream> using\
    \ namespace std; #include <cmath> void main(void)\n{\n cout <<\"The absolute value\
    \ of -55 is \"<<abs(-55)<< \"\\n\"; cout <<\"The square root of 100 is \"<<sqrt(100.0)<<\
    \ \"\\n\"; cout <<\"10 to the power of 5 is \"<<pow(10,5)<< \"\\n\";\n}\n```\n\
    \n## Note\n\n`abs()` 函数也包含在 `stdlib.h` 头文件中。\n\n一旦你完成了预处理器指令，就可以开始编写 `main()`\
    \ 代码。\n\n```cpp\n#include <iostream> using namespace std; #include <cmath> void\
    \ main(void)\n{\n cout <<\"The absolute value of -55 is \"<<abs(-55)<< \"\\n\"\
    ; cout <<\"The square root of 100 is \"<<sqrt(100.0)<< \"\\n\"; cout <<\"10 to\
    \ the power of 5 is \"<<pow(10,5)<< \"\\n\";\n}\n```\n\n## Note\n\n`abs()` 函数在参数为负数时。\n\
    \n当 `cout` 语句执行时，显示了 `55`。\n\n```cpp\n#include <iostream> using namespace std;\
    \ #include <cmath> void main(void)\n{\n cout <<\"The absolute value of -55 is\
    \ \"<<abs(-55)<< \"\\n\"; cout <<\"The square root of 100 is \"<<sqrt(100.0)<<\
    \ \"\\n\"; cout <<\"10 to the power of 5 is \"<<pow(10,5)<< \"\\n\";\n}\n```\n\
    \n## Note\n\n`abs()` 函数在参数为负数时。\n\n当 `cout` 语句执行时，显示了 `55`。\n\n```cpp\n#include\
    \ <iostream> using namespace std; #include <cmath> void main(void)\n{\n cout <<\"\
    The absolute value of -55 is \"<<abs(-55)<< \"\\n\"; cout <<\"The square root\
    \ of 100 is \"<<sqrt(100.0)<< \"\\n\"; cout <<\"10 to the power of 5 is \"<<pow(10,5)<<\
    \ \"\\n\";\n}\n```\n\n"
- fmt: "\n1. `H`: `short int` or `short unsigned`. Example: `%hd` or `%hu`.\n2. `I`:\
    \ a `long int` or `long unsigned`, or `double` (for `%f` conversions.) Example:\
    \ `%ld`, `%lu`, or `%lf`.\n3. `L`: The value to be parsed is a `long` for integer\
    \ types or `long double` for float types. Example: `%Ld`, `%Lu`, or `%Lf`.\n4.\
    \ `*`: Tells `scanf()` de do to the conversion specified, but not store it anywhere.\
    \ This is what you use if you want `scanf()` to eat some data, but you don’t want\
    \ to store it anywhere; you don’t give `scanf()` an argument for this conversion.\
    \ Example: `%*d`.\n\n`scanf(\"%c\" &c)` will read any character, including whitespace\
    \ character. If you want to `scanf` skip any whitespace, you can use space before\
    \ `%c`.\n\n```cpp\nwhile(true){\n    scanf(\"%c\",&c);\n    //scanf(\" %c\",&c);\n\
    \    printf(\"you ␣  input: ␣  %d\" c);\n}\n```\n\n**Output:**\nWhen you input\
    \ `a(enter)`, output will be like `you input: 97(a value)` `you input: 10(enter\
    \ value)`\n\n`cin>>c` will not read white character(tab, space , newline), If\
    \ you want to read them from input buffer, You should use `getchar()` or `cin.get()`;\
    \ If you want the user to input his or her name.\n\n```cpp\nwhile(true){\n   \
    \ cin>>c;\n    cout<<\"you ␣  input:\"<<c<<endl;\n}\n```\n**Output:**\nWhen you\
    \ input `\" a(enter)\"` output will be like:you input: a. then cursor wait for\
    \ here.\n\nUsing `cin>>` or `scanf` will terminate the string after it reads the\
    \ first space. The best way to handle this situation is to use the function to\
    \ read a line;\n\n### Read word and line:\n\n1. `scanf(%s,char_array)` //`c`\n\
    2. `cin>>char_array` or `;` //`c++`\n3. `cin>> str;`\n4. //`line`\n5. `Gets(char_array)`\
    \ //`c`\n6. `Fgets(char_array, n , FILE *)`\n7. `Cin.getline(char * ,int n)`\n\
    8. `Cin.get(char * ,int n)`\n9. `Std::getline(istream& is, string& str)`\n\nLine\
    \ 1: Read a word until reach white character.\nLine 7: Recommend to use this for\
    \ safety.\nLine 9: C++ read and discard newline\nLine 1: Not read newline\n\n\
    `Cin.read` function has the same interface with `cin.get`, but it doesn’t append\
    \ a null character to input, It’s not intend for keyboard input, but for binary\
    \ format of file.\n\nFor C++, three `get`, two `getline`, other use `>>`;\n\n\
    ### Difference between `cin.get(char)` and `int = cin.get()`:\n\n```cpp\nwhile(cin.get(c))\
    \ {\n    // use cin.get(char) in reading loop\n    cin.get() != ’\\n’\n    //use\
    \ cin.get() return character to test sth.\n    cin.get()!= EOF\n}\n```\nLine 7:\
    \ When used in `EOF`, you have to use `int`. because `EOF` may not be expressed\
    \ by `char` type.\n\n**Confused functions:** `cin.get` and `cin.getline` are almost\
    \ the same things.\n\n`Cin.get ( char* s, streamsize n, char delim );`\n`Cin.getline\
    \ (char* s, streamsize n, char delim );`\n`Istream& getline (istream& is, string&\
    \ str);`\n\n1. For each line, if you don’t know the max length, just use `getline(cin,\
    \ string)`. You don’t need to input any length (you can reserve length of `string`\
    \ if you want to avoid allocation of memory).\n2. `cin.get()` doesn’t discard\
    \ `delim` from input stream. However, `cin.getline()` will read and discard newline.\
    \ (It’s easy for you to remember, because, line is defined by newline character)\n\
    3. In `cin.getline(char* s, int n)` The `failbit` flag is set if the function\
    \ extracts no characters(newline is a character), Or if the `delim` character\
    \ is not found once (n-1) characters have already been written to `s`. Note that\
    \ if the character that follows those (n-1) characters in the input sequence is\
    \ precisely the `delim` character, it is also extracted and the `failbit` flag\
    \ is not set.\n4. In `.cin.get(char* s , int n)`. The `failbit` flag is set only\
    \ if the function extracts no characters.\n5. `cin.get(char* s, n)` is more flexible\
    \ than `cin.getline`. Because when it read to the array is full, It doesn’t set\
    \ `failbit`. At this time you can use `gcount()` or `peek()` to see if the next\
    \ character is a new line. It’s more customized than `cin.getline();`.\n\n###\
    \ Input Pattern\n\nIt is a bad idea to test the stream on the outside and then\
    \ read/write to it inside the body of the conditional/loop statement. This is\
    \ because the act of reading may make the stream bad. It is usually better to\
    \ do the read as part of the test.\n\n```cpp\nwhile(!cin.fail()){ // that is bad\
    \ programming style \n    cin>>i; //here may make stream fail().\n    ..... //then\
    \ i is not valid value\n}\n```\n\nIf you just want to input, you don’t want to\
    \ know `eof` or deal with `failbit`. You can use below:\n\n`while(!cin.fail())`\
    \ ... `scanf(\"%d\",&i) != EOF` ... `getline(cin, string)` ... `cin.get()` ...\
