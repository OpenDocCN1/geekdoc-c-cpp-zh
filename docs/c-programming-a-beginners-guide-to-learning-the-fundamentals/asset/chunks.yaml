    #### Pointer Arithmetic


    There are times when moving a pointer along to another memory location might be
    useful; this is where pointer arithmetic comes into use. If we were to execute
    say ptr++ and the ptr was an integer pointer it would now move 4bytes (Size of
    an int) along, and we were to run it again, another 4bytes etc. This can mean
    pointer (if pointing to valid array structures) can act much like an array can.
    An example is below:


    int arrayInt[] = { 10, 20, 30 }; size_t arrayInt_Size = 3; //Will point to the
    first array index int* ptr = &arrayInt; for (int i = 0; i < arrayInt_Size; i++)


    {


    //Remember, *ptr gets the value in the memory location printf("Value of arrayInt[%d]
    = %d\n", i, *ptr); ptr++;


