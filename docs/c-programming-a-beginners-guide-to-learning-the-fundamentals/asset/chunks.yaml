    # Library Functions\n\n Library functions and user-defined functions in C++\n\n\
    ![C:\\Users\\Talha\\Downloads\\pexels-sabrina-gelbart-249798.jpg](image.021.jpeg)\n\
    \n#### Learning objective\n\nAfter completing this topic, you should be able to\
    \ give a brief account of library functions and user-defined functions in C++.\n\
    \n1\\. Incorporation of library functions\n\nThe C++ programmer has access to\
    \ a large selection of library functions.\n\nYou can use any function in the library\
    \ by simply including the name of the header file that contains the appropriate\
    \ function prototype.\n\nGenerally, library functions are specified in a pair\
    \ of files.\n\nThe function definition is contained in a source file that usually\
    \ has a .c or .cpp file extension.\n\n#### Note\n\nUsually, you are not supplied\
    \ with the source code for library functions with a compiler.\n\nInstead, you\
    \ are supplied with precompiled object files that can be linked to your program.\n\
    \nThe function prototype is contained in a header file, which may be distinguished\
    \ by an .h, .hpp, or .hxx file extension.\n\n#### Note\n\nHeader files also contain\
    \ definitions of various data types and constants needed by those functions.\n\
    \nThough not mandatory, it's a good idea to organize your own functions in the\
    \ same way as supplied library functions.\n\nThis allows you to use the functions\
    \ in more than one program without having to respecify the code.\n\nIn order to\
    \ call library functions in a program, you must specify the header file that contains\
    \ the appropriate function prototype.\n\nThis is usually done at the beginning\
    \ of a source file.\n\nBut it must be done before the function is used by the\
    \ program.\n\nHeader files can be included in a program by using the #include\
    \ preprocessor directive.\n\nThis tells the preprocessor to open the named header\
    \ file and insert its contents where the #include statement appears.\n\n#include\
    \ <string>\n\n#include \"myfuncs.h\"\n\nYou can name files in an #include statement\
    \ in two ways, that is in double quotes or in angle brackets (<>).\n\nFilenames\
    \ in angle brackets tell the preprocessor to look through a search path specified\
    \ in the environment.\n\n#include <string>\n\n#include \"myfuncs.h\"\n\nFilenames\
    \ in double quotes tell the preprocessor to search the current directory first,\
    \ then the specified search path.\n\nAn error is reported if a file cannot be\
    \ found.\n\n#include <string>\n\n#include \"myfuncs.h\"\n\nThe linker always searches\
    \ for the compiled versions of any functions specified in an included header file.\n\
    \n#### Available files\n\nThe C standard library provides a collection of functions\
    \ for performing common tasks such as:\n\n*   String handling\n\n*   Character\
    \ and type conversion\n\n*   Mathematics\n\n*   Input and output\n\nA wide variety\
    \ of C++ library files are also available.\n\nThe ANSI standard for C++ libraries\
    \ was ratified in 1998."
