    \              \n\n*   Function body: And finally, the function body is going\
    \ to contain a collection of statements that are able to define what the function\
    \ does.\n\nThere are a lot of times when we are going to be able to use the functions\
    \ to help us get some parts of our code done and to ensure that we get it all\
    \ set up and ready to handle. Make sure to practice these functions to see how\
    \ they are going to work for our needs.\n\n#### The Types of Modifiers\n\nAny\
    \ time that you are working with some of the codes that you want to do in C++,\
    \ you will find that you will be able to use char, double, and int in order to\
    \ allow the modifier that shows up before it to be there. The modifier that we\
    \ are talking about here is going to be used to help us alter up the meaning of\
    \ that base type so that it is going to fit into any program or situation that\
    \ we are trying to create. There are going to be different types of modifiers\
    \ of the data that we are able to work with. These include signed, unsigned, long,\
    \ and short.\n\nThese four modifiers are going to be applicable to any of the\
    \ base types of integers that we have. You are able to take the signed and unsigned,\
    \ for example, in order to work with a char, and then long can be used on a double\
    \ for example. C++ is also going to make it easier for us to work with shorthand\
    \ notation to help with these integers. This means that they are able to use those\
    \ words without needing to add in the “int” part since this is always implied\
    \ in the coding.\n\nThere are also different types of qualifiers in order to get\
    \ things to work on your C++ code. The following types of qualifiers that you\
    \ will be able to use in order to provide some additional information about the\
    \ variables the precede include:\n\n*   Const: Objects that have the “const” will\
    \ not have the ability to be changed by the program while you are executing it.\n\
    \n*   Volatile: The modifier of volatility will tell the compiler that you are\
    \ able to change the value but these changes may not be explicitly specified by\
    \ the program.\n\nRestrict: a pointer that has been qualified by restricting is\
    \ initially the only means by which an object it points to can be accessed\n\n\
    # Chapter 2:\n\n# Basic Facilities Array\n\n# ![C:\\Users\\Talha\\Downloads\\\
    sigmund-2qd9noyeuRE-unsplash (1).jpg](image.003.jpeg)\n\nThe Array is a data structure\
    \ that holds a sequential collection of elements of the same data type.\n\nFor\
    \ example, in the code below I declared two arrays of different data type: an\
    \ array of characters and an array of integers.\n\n#include \"stdafx.h\"\n\n#include\
    \ <iostream> int main(int argc, char* argv[])\n\n{ int i; int length; int sum\
    \ = 0; char char_array[10] = { 'p', 's', 'y', 'c', 'h', 'o', 'l', 'o', 'g', 'y'\
    \ };\n\n // total number of bytes allocated for that array\n\n //one char is one\
    \ byte: the number of elements = number of bytes length = sizeof(char_array);\
    \ std::cout << \"Size of array of characters is \" << length << std::endl; for\
    \ (i = 0; i<length; i++) std::cout << char_array[i]; std::cout << '\\n';\n\n std::cout\
    \ << '\\n'; std::cout << '\\n'; int numbers[10] = { 1, 5, 9, 4, 2, 7, 6, 3, 8,\
    \ 0 }; //the total number of bytes allocated for that array. length = sizeof(numbers);\
    \ std::cout << \"Size of numbers array=\" << length << std::endl;\n\n //the total\
    \ number of bytes allocated for array/number of bytes allocated for one element\
    \ length = sizeof(numbers) / sizeof(numbers[0]); std::cout << \"Numbers of elements=\"\
    \ << length << std::endl; for (i = 0; i<length; i++)\n\n {\n\n sum = sum + numbers[i];\
    \ std::cout << \"Sum of numbers=\" << sum << std::endl;\n\n }\n\n int *p = numbers;\
    \ std::cout << \"Address of the first element is \" << p << std::endl; std::cout\
    \ << \"The value in the address is \" << *p << std::endl; p++; //move pointer\
    \ to the next element std::cout << \"Address of the second element is \" << p\
    \ << std::endl; std::cout << \"The value in the address is \" << *p << std::endl;\
    \ int hold = 1;\n\n std::cin >> hold; return 0;\n\n}\n\nThe function sizeof returns\
    \ the number of bytes allocated for the array. Since char data type occupies one\
    \ byte, the number of bytes returned by the sizeof function equals to the number\
    \ of elements of the char array.\n\nThe integer data type occupies 4 bytes in\
    \ the memory, and an array of 10 integers is stored in 40 bytes. As a result,\
    \ the sizeof the array function returns 40 bytes for the integer array of 10 elements.\n\
    \nTo calculate how many elements are stored in an array we can divide the number\
    \ of bytes allocated for the whole array by the number of bytes allocated to one\
    \ element of the array; length=sizeof(numbers) / sizeof(numbers[0]);\n\n40 / 4\
    \ = 10\n\nTo access the value of a single element, we have to use the array index.\
    \ The index of array in C++ starts from 0.\n\nThe index of the first element is\
    \ 0, the index of the second element is 1, and so on."
