    \ and is able to use the members from both classes.\n\nWith this program, the\
    \ output is as follows:\n\n```\nStudent ID 1\nStudent Name John\n15\n```\n\n###\
    \ 1.4 Access Control\n\nClass modifiers can be used to define the visibility of\
    \ properties and methods in a class. Below are the various modifiers available.\n\
    \n- `Private`– With `private`, the properties and methods are only available to\
    \ the class itself.\n- `Protected`– With `protected`, the properties and methods\
    \ are only available to the class itself and subclasses derived from that class.\n\
    - `Public`– With `public`, the properties and methods are available to all classes.\n\
    \nLet’s say we had the following structure for a class.\n\n```cpp\nClass classname\n\
    {\nPrivate:\n    Property1;\n    Fucntion1;\n}\n```\n\nBoth `property1` and `function1`\
    \ would not be accessible anywhere else except the class it is defined in. If\
    \ you try to access any of these properties or functions from the main program,\
    \ you will get a compile-time error.\n\nNow let’s define the class below, but\
    \ this time we’ll use the `protected` access modifier.\n\n```cpp\nClass classname1\n\
    {\nProtected:\n    Property1;\n    Fucntion1;\n}\n```\n\nNow `property1` and `function1`\
