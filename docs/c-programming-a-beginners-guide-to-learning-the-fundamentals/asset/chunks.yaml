    and >. The most common use for this is checking if two pointer point to the same
    location: int value;


    //Assigns ptr1 and prt2 the same value int* ptr1 = &value; int* ptr2 = &value;


    //ptr3 is assigned another value int* ptr3 = NULL; if (ptr1 == ptr2)


    { printf("ptr1 and ptr2 are equal!\n");


    } if (!ptr1 == ptr3)


    { printf("ptr1 is not equal to ptr3\n");


    }


    This checks if the various pointers are equal. The same can be done with > and
    <.


    #### Function pointers


    Much like you can do with variables, you can also do the same with functions;
    below is a snippet of code that shows a function pointer being defined. Key sections
    will be highlighted:


    void printAddition(int value1, int value2)


    {


    int result = value1 + value2; printf("The result is: %d", result);


    } int main()


    {


    //Function pointer definition


    //<retrunType>(*<Name>)(<Parameters>)


    void(*functionPtr)(int, int); functionPtr = &printAddition;


    //Invoking call to pointer function (*functionPtr)(100, 200); return 0;


    }


    The basic structure for defining a function pointer is like so


    <Return_Type> (*<Name>) (<Parameters>) Where in this case:


    <Return_Type> = void


    <Name> = functionPtr


    <Parameters> = int, int


    This function pointer can now be passed as a parameter and used in situations
    where you would want to change the behaviour of code but with almost the same
    code.


    An example could be dynamically choosing what operation a calculator should perform
    (Note: this is complex code and should be used a rough example, so don’t worry
    if you don’t fully understand) void calculator(int value1, int value2, int(*opp)(int,int))


    { int result = (*opp)(value1, value2); printf("The result from the operation:
    %d\n", result);


    }


    //Adds two values int add(int num1, int num2)


    {


    return num1 + num2;


    }


    //Subtracts two values int sub(int num1, int num2)


    {


    return num1 - num2;


    } int main() {


    calculator(10, 20, &add); calculator(10, 20, &sub); return 0;


    }


