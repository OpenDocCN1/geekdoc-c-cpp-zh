  trans: "\n我们也可以重新定义 `Student` 类中的 `Display` 函数。但如果你查看上面的示例，你会发现 `Person` 类中的 `Display`\
    \ 函数的显示文本为 `ID` 和 `Name`。但假设我们想在 `student` 类中将显示名称为 `Student ID` 和 `Student name`，我们可以重新定义\
    \ `Display` 函数。让我们来看一个相关的例子。\n\n### 示例 4：以下程序展示了如何使用带有重定义函数的继承类。\n\n```cpp\n#include\
    \ <iostream>\nusing namespace std;\nclass Person\n{\npublic:\n    string Name;\n\
    \    int ID;\n    void Display()\n    {\n        cout<<\"ID \"<<ID<<endl;\n  \
    \      cout<<\"Name \"<<Name;\n    }\n};\n\nclass Student:public Person {\npublic:\n\
    \    // 这里我们正在重定义 Display 函数\n    void Display()\n    {\n        cout<<\"Student\
    \ ID \"<<ID<<endl;\n        cout<<\"Student Name \"<<Name;\n    }\n};\n\nint main\
    \ () {\n    Student stud1;\n    stud1.ID=1;\n    stud1.Name=\"John\";\n    stud1.Display();\n\
    \    return 0;\n}\n```\n\n通过这个程序，输出如下：\n\n```\nStudent ID 1\nStudent Name John\n\
    ```\n\n### 1.3 多重继承\n\n我们还可以让派生类继承自多个基类。这有助于一次性从多个类中获得更多功能。\n\n`派生类: 基类 1, 基类\
    \ 2… 基类 N`\n\n在这里，你只需要用逗号将基类分隔开即可。\n\n所以，如果我们有一个如下所示的带有属性和函数的基类。\n\n```cpp\nBase\
    \ class1\n{\nPublic or protected:\n    Property1;\n    Fuction1;\n}\n```\n\n以及另一个如下的基类。\n\
    \n```cpp\nBase class2\n{\nPublic or protected:\n    Property2;\n    Fucntion2;\n\
    }\n```\n\n那么，当我们从这两个基类定义派生类时，该派生类将可以访问这两个类的属性和函数。\n\n```cpp\nDerived class: Base\
    \ Class1, Base Class2\n{\n    // 不需要定义 property1, property2 和 Function1, Fucntion2，它们会自动继承这些。\n\
    }\n```\n\n再次注意，属性和函数的访问修饰符需要为 `public` 或 `protected`。让我们来看一个多个派生类的示例。\n\n### 示例\
    \ 5：以下程序用于展示如何使用多个派生类。\n\n```cpp\n#include <iostream>\nusing namespace std;\n\n\
    // 定义 Person 类的第一个基类\nclass Person\n{\npublic:\n    string Name;\n    int ID;\n\
    \    void Display()\n    {\n        cout<<\"ID\"<<ID<<endl;\n        cout<<\"\
    Name\"<<Name;\n    }\n};\n\n// 定义 Marks 类的第二个基类\nclass Marks\n{\npublic:\n   \
    \ int marks1,marks2;\n    void Sum()\n    {\n        cout<<marks1+marks2;\n  \
    \  }\n};\n\n// 派生类同时继承 Person 和 Marks 两个基类。\nclass Student:public Person,public\
    \ Marks {\npublic:\n    void Display()\n    {\n        cout<<\"Student ID \"<<ID<<endl;\n\
    \        cout<<\"Student Name \"<<Name<<endl;\n    }\n};\n\nint main () {\n  \
    \  Student stud1;\n    stud1.ID=1;\n    stud1.Name=\"John\";\n    stud1.Display();\n\
    \    stud1.marks1=5;\n    stud1.marks2=10;\n    stud1.Sum();\n    return 0;\n\
    }\n```\n\n通过上面的程序：\n\n![](img/image.013.png) 我们定义了 2 个基类，一个称为‘Person’，另一个称为‘Marks’。(image.014.png)\
    \ 派生类‘Student’继承了这两个类，并可以使用这两个类的成员。\n\n通过这个程序，输出如下：\n\n```\nStudent ID 1\nStudent\
    \ Name John\n```5\n1.4 访问控制\n\n类修饰符用于定义类中属性和方法的可见性。以下是各种修饰符：\n\n- `Private` –\
    \ 使用 `private`，属性和方法对类本身可见。\n- `Protected` – 使用 `protected`，属性和方法仅对类本身及其子类可见。\n\
    - `Public` – 使用 `public`，属性和方法对所有类可见。\n\n假设我们有一个如下的类结构：\n\n```cpp\nClass classname\n\
    {\nPrivate:\n    Property1;\n    Fucntion1;\n}\n```\n\n`property1` 和 `function1`\
    \ 在定义它们的类之外的任何地方都是不可访问的。如果你在 main 程序中尝试访问这些属性或函数，将得到编译错误。\n\n现在让我们定义下面的类，这次我们将使用\
    \ `protected` 访问修饰符。\n\n```cpp\nClass classname1\n{\nProtected:\n    Property1;\n\
    \    Fucntion1;\n}\n```\n\n现在 `property1` 和 `function1` 在上述类以及任何继承自它的类中可见。但注意，我们不能在其他非派生类中使用这些属性。\n\
    \n```cpp\nClass derivedclassname: classname1\n}\n```\n\n让我们来看另一个访问修饰符的示例。\n\n\
    ### 示例 6：以下程序用于展示如何使用访问修饰符。\n\n```cpp\n#include <iostream>\nusing namespace std;\n\
    class Person\n{\npublic:\n    int ID;\nprotected:\n    // 注意我们将 Name 属性定义为 protected\n\
    \    string Name;\n    void Display()\n    {\n        cout<<\"ID \"<<ID<<endl;\
    \ \n        cout<<\"Name \"<<Name;\n    }\n    // 注意我们将 city 属性定义为 private\n \
    \   private:\n    string city;\n};\n\nclass Student:public Person { \npublic:\
    \ \n    void Display()\n    {\n        cout<<\"Student ID \"<<ID<<endl; \n   \
    \     cout<<\"Student Name \"<<Name<<endl;\n    }\n};\n\nint main () {\n    Student\
    \ stud1;\n    stud1.ID=1;\n    stud1.Name=\"John\";\n    stud1.Display();\n  \
    \  return 0;\n}\n```\n\n为什么我们会得到这个错误？`person` 类具有 `protected` 访问修饰符，这意味着它只能在派生类中访问。但我们尝试在\
    \ main 类中访问它，这是错误的。\n\n### 示例 7：以下程序展示了正确的方法。\n\n```cpp\n#include <iostream>\n\
    using namespace std;\nclass Person\n{\npublic:\n    int ID;\nprotected:\n    string\
    \ Name;\n    void Display()\n    {\n        cout<<\"ID \"<<ID<<endl; \n      \
    \  cout<<\"Name \"<<Name;\n    }\nprivate:\n    string city;\n};\n\nclass Student:public\
    \ Person { \npublic: \n    // 我们现在定义了一个可以设置 protected 属性值的函数\n    void InputName(string\
    \ pName)\n    {\n        Name=pName;\n    }\n    void Display()\n    {\n     \
    \   cout<<\"Student ID \"<<ID<<endl; \n        cout<<\"Student Name \"<<Name<<endl;\n\
    \    }\n};\n\nint main () {\n    Student stud1;\n    stud1.ID=1;\n    stud1.InputName(\"\
    John\");\n    stud1.Display();\n    return 0;\n}\n```\n\n在上面的程序中，我们现在 `Student`\
    \ 类中正确定义了方法 `InputName`，它可以访问受保护成员 `Name`。通过这个程序，输出如下：\n\n```\nStudent ID 1\n\
    Student Name John\n```\n\n### 示例 8：以下程序展示了错误使用访问修饰符的第二个示例。\n\n```cpp\n#include\
    \ <iostream>\nusing namespace std;\nclass Person\n{\npublic:\n    int ID;\nprotected:\n\
    \    string Name;\n    void Display()\n    {\n        cout<<\"ID \"<<ID<<endl;\
    \ \n        cout<<\"Name \"<<Name;\n    }\nprivate:\n    string city;\n};\n\n\
    class Student:public Person { \npublic: \n    void InputName(string pName)\n \
    \   {\n        Name=pName;\n    }\n    void Display()\n    {\n        cout<<\"\
    Student ID \"<<ID<<endl; \n        // 注意我们正在派生类中使用私有属性 city\n        cout<<\"\
    Student city \"<<city<<endl; \n        cout<<\"Student Name \"<<Name<<endl;\n\
    \    }\n};\n\nint main () {\n    Student stud1;\n    stud1.ID=1;\n    stud1.InputName(\"\
    John\");\n    stud1.Display();\n    return 0;\n}\n```\n\n通过这个程序，输出如下：\n\n```\n\
    error: 'std::__xx11::string Person::city' is private\n```\n\n由于 `City` 属性是私有的，即使在派生类中也无法使用。我们只能在\
    \ `Person` 类中操作此属性。\n"
- fmt: "\n```c\n{ int var; printf(\"The address is: %x\\n\", &var); return 0; }\n\
    ```\n\nOutput:\n> The address is: 10ffa2c\n\nNote: This will be different almost\
    \ every time you run.\n\nNote the highlighted statement, the `&` (Reference Operator)\
    \ is used to return the memory location of the variable and allows certain statements\
    \ to access the data in that location. The `%x` is used because a memory location\
    \ is in hexadecimal.\n\nTo create a pointer, we use the dereferencing operator\
    \ `*`, this will create a pointer variable that is designed to hold a memory locations\
    \ address. Below is a program that creates a pointer and uses reference operator\
    \ `&` to store another regular variable’s address in the newly created pointer.\
    \ The dereferencing operator `*` is also used to access or change the actual data\
    \ in that memory location.\n\n*   Dereferencing operator `*` is used to create\
    \ a pointer, it is also used when changing the actual value.\n*   Referencing\
    \ operator `&` is used when obtaining the memory location of a pointer.\n\n```c\n\
    //Regular variable int var = 10; //Pointer int* pointer;\n//Storing of var memory\
    \ location pointer = &var;\n//Pointer is now effectively 'var' so\n//things like\
    \ this can happen\n*pointer = 20;\nprintf(\"Var's value is now: %d\", var);\n\
    ```\n\nOutput:\n>Var's value is now: 20\n\n## NULL pointers\n\nWhen you create\
    \ a pointer, is it initially not given anything to point at, this is dangerous\
    \ because the pointer when created it references random memory, and changing this\
    \ data in the memory location can crash the program. To prevent this, when we\
    \ create a pointer we assign it to `NULL` like so:\n\n![](image.016.jpeg)\n\n\
    ```c\nint* pointer = NULL;\n```\nThis means the pointer has an address of ‘0’,\
    \ this is a reserved memory location to identify a null pointer. A null pointer\
    \ can be checked by an if statement: `if (pointer){}`.\n\nThis will succeed if\
    \ the pointer isn’t null.\n\n### Using pointers\n\nNow some real-world uses of\
    \ pointers are passing them as parameters and effectively passing them by reference.\
    \ The example below will show the effect:\n\n```c\nvoid Change_Value(int* reference)\n\
    {\n    //Changes the value in the memory location\n    *reference = 20;\n}\n\n\
    int main()\n{\n    //Creates pointer to variable int var = 10;\n    int* pointer\
    \ = &var;\n    printf(\"The value before call: %d\\n\", var);\n    //Method call\n\
    \    Change_Value(pointer); //Prints new value\n    printf(\"The value after call:\
    \ %d\\n\", var);\n    return 0;\n}\n```\n\nOutput:\n>The value before call: 10\n\
    >The value after call: 20\n\nThis passes the memory location, not the value of\
    \ the variable, meaning you have the location where you can make changes.\n\n\
    Note the parameter is `int*` this is the pointer type, so for an example of a\
    \ pointer to a char would be `char*`.\n\n### Pointer Arithmetic\n\nThere are times\
    \ when moving a pointer along to another memory location might be useful; this\
    \ is where pointer arithmetic comes into use. If we were to execute say `ptr++`\
    \ and the `ptr` was an integer pointer it would now move 4bytes (Size of an `int`)\
    \ along, and we were to run it again, another 4bytes etc. This can mean pointer\
    \ (if pointing to valid array structures) can act much like an array can. An example\
    \ is below:\n\n```c\nint arrayInt[] = { 10, 20, 30 };\nsize_t arrayInt_Size =\
    \ 3; //Will point to the first array index\nint* ptr = &arrayInt;\nfor (int i\
    \ = 0; i < arrayInt_Size; i++)\n{\n    //Remember, *ptr gets the value in the\
    \ memory location\n    printf(\"Value of arrayInt[%d] = %d\\n\", i, *ptr);\n \
    \   ptr++;\n}\n```\n\nOutput:\n>Value of arrayInt[0] = 10\n>Value of arrayInt[1]\
    \ = 20\n>Value of arrayInt[2] = 30\n\nThis shows that a pointer to the first address\
    \ of the array can be incremented along the addresses of the array (Remember each\
    \ value of an array is stored in neighbouring memory locations) You can do the\
    \ opposite and decrement a pointer i.e. make the pointers value decrease.\n\n\
    There is also way to compare pointers using relational operators such as `==`,\
    \ `<`, and `>`. The most common use for this is checking if two pointer point\
    \ to the same location:\n\n```c\nint value;\n//Assigns ptr1 and prt2 the same\
    \ value\nint* ptr1 = &value;\nint* ptr2 = &value;\n//ptr3 is assigned another\
    \ value\nint* ptr3 = NULL;\nif (ptr1 == ptr2)\n{\n    printf(\"ptr1 and ptr2 are\
    \ equal!\\n\");\n}\nif (!ptr1 == ptr3)\n{\n    printf(\"ptr1 is not equal to ptr3\\\
    n\");\n}\n```\n\nThis checks if the various pointers are equal. The same can be\
    \ done with `>` and `<`.\n\n### Function pointers\n\nMuch like you can do with\
    \ variables, you can also do the same with functions; below is a snippet of code\
    \ that shows a function pointer being defined. Key sections will be highlighted:\n\
    \n```c\nvoid printAddition(int value1, int value2)\n{\n    int result = value1\
    \ + value2;\n    printf(\"The result is: %d\", result);\n}\n\nint main()\n{\n\
    \    //Function pointer definition\n    //<retrunType>(*<Name>)(<Parameters>)\n\
    \    void(*functionPtr)(int, int);\n    functionPtr = &printAddition;\n    //Invoking\
    \ call to pointer function (*functionPtr)(100, 200);\n    return 0;\n}\n```\n"
