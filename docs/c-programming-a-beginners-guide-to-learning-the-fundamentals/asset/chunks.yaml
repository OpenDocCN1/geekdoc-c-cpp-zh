  trans: "\n\n```cpp\n// ...\n\n// 对 x 和/或 y 进行一些操作\n\n// ...\n\ndelete [] x; // 释放\
    \ x 的内存\n\n// ...\n\n// 执行其他操作\n\n// ... delete [] y; // 逻辑错误，y 的内存已经释放！\n```\n\
    \n由于指针 `x` 和指针 `y` 指向同一块内存，因此 `x` 和 `y` 是互为的别名。如果你释放了其中一个所引用的内存，那么另一块内存也会被释放，因为它们是同一块内存。\n\
    \n当使用 `delete` 释放之前的内存后，不应再次访问它们。当你尝试访问已删除的内存时，会导致未定义行为，这代表了一个逻辑错误。\n\n```cpp\n\
    int *list = new int[10]; // ... // 使用 list，然后\n\n// ... delete [] list;\n\n//\
    \ 释放 list 的内存\n\n// ... // 一段时间之后\n\n// ... int x = list[2]; // 逻辑错误，但有时有效！\n\
    ```\n\n上面的代码段说明了这种情况是如何产生的。出于效率考虑，`delete` 运算符会将堆空间标记为可用，而不会修改内存中的内容。\n\n## 资源管理\n\
    \n程序员在完成链表对象的操作后，调用 `clear` 是至关重要的。请看以下定义：\n\n```cpp\nvoid x() {\n    IntList1\
    \ my_list; // 在此处调用构造函数 // 向列表添加一些数字\n    my_list.insert(12);\n    my_list.insert(7);\n\
    \    my_list.insert(-14); // 打印列表\n    my_list.print();\n} // 哎！忘记调用 my list.clear!！\n\
    ```\n\n在上面的代码中，变量 `my_list` 是函数 `x` 的局部变量。当函数 `x` 执行结束时，变量 `my_list` 将离开作用域。在此阶段，栈上为名为\
    \ `my_list` 的局部 `IntList1` 变量分配的空间会被回收。虽然在堆分配的元素空间仍然存在，但程序访问内存的唯一方式是通过 `my_list.head`，而\
    \ `my_list` 已经不存在了。这是一个经典的内存泄漏示例。注意，在我们目前为止设计的类中，除了 `IntList1` 之外没有类存在这个问题。然而，C++\
    \ 为类设计者提供了一种方法，可以指定对象生命周期结束时必须执行的操作。在对象存在初期执行代码的函数被称为析构函数。析构函数是一种在对象消失之前立即执行的特殊方法。析构函数的名字可以与其类相同，并带有波浪号\
    \ `~` 前缀。此外，析构函数不接受参数。代码 9.2 显示如何在代码中添加析构函数，以及之前建议的长度和 `clear` 方法优化。\n\n```cpp\n\
    // 代码 9.2\nclass Code9.2 {\n    // 之前的嵌套私有 Node 类\n    struct Node {\n       \
    \ int data; // 列表的数据元素\n        Node *next; // 列表中紧随其后的节点\n        Node(int d);\
    \ // 构造函数\n    };\n\n    Node *head; // 指向列表的第一项\n    Node *tail; // 指向列表的项\n\
    \    int len; // 列表中元素的数量\npublic:\n    // 构造函数创建一个初始为空列表\n    IntList2();\n\n\
    \    // 回收列表内存的析构函数\n    ~Code9.2(); // 将 n 插入列表末尾。\n    void insert(int n);\n\
    \n    // 打印整数链表的内容。\n    void print() const;\n\n    // 返回链表的长度。\n    int length()\
    \ const;\n\n    // 移除链表中的所有元素。\n    void clear();\n};\n```\n\n## 结论\n\n在引导你学习了十个最重要的\
    \ C++ 主题后，现在该由你来精进技能了。和任何语言一样，无论是英语、法语还是计算机语言，熟能生巧。我们在书中传授给你的知识仅相当于学习字母表和几个基础英语单词。因此，我们建议你多加练习。将你的思考集中在我们为什么要使用某些句子；以及我们希望实现的结果上。\n\
    \n去网上下载所有你认为易用的实用应用程序，如果必须为它们付钱，就付钱吧。一旦你准备好了一切，就找一个项目并开始学习。你可以创建一个自己的小项目，也可以尝试模仿一个已经创建的项目。如果你遇到瓶颈，可以随时回去查看程序员是如何创建并继续该项目的。但在检查之前，始终务要尝试将自己推向极限，并进行真正的思考。\n\
    \n阅读其他优秀的书籍对你也将大有益益，这让你对 C++ 的某些部分获得多样化的视角，从而提高对它的理解。尽管我们可以告诉你，这本书的质量将带你走上 C++\
    \ 成功的正确道路，但我们敦促你也阅读关于该编程语言的其他书籍。\n\n除了 C++ 之外，你也可以考虑学习一种其他语言。学习新语言是深入理解 C++ 的有效技术。学习新语言会让你对通用编程语言有更全面的理解。它还能拓宽你的解决问题思维，挖掘出\
    \ C++ 语言的细微差别。即使你不使用这种新语言来编写 C++ 代码，它也会让你接触到可以应用于 C++ 的成熟概念。Haskell 是一种我们建议你与\
    \ C++ 一起学习的编程语言。你也可以学习 Java，因为它比 C++ 更接近日常英语，对你来说更容易理解。你也可以看看我们的 Java 书。\n\n"
