    \ >> more;\n\n }\n\nreturn 0;\n\n}\n\nOutput:\n\n![](image.005.jpeg)\n\nFigure\
    \ String manipulation.\n\n#### Lists\n\n![](image.006.jpeg)\n\nLet us imagine\
    \ a puzzle. You have a row of boxes. Each box contains a card with one letter.\
    \ You have to figure out the sequence of the letters, so that the letters compose\
    \ a word.\n\n#### Figure A linked list\n\nIn the table above, you can see that\
    \ each box has a number. You may guess that these numbers are the key to the puzzle.\
    \ The first box has a letter T inside and number 5 on the front side. Take a card\
    \ with the letter T and put it aside. The number 5 may point to the next letter.\
    \ Count boxes. The fifth box has the letter ‘E.’ Take the card with the ‘E’ letter\
    \ and place it next to T. You will get \"TE.\" The box with the letter ‘E’ has\
    \ number 2 on its side. So, take the card from the 2nd box and place it next to\
    \ \"TE.\" You will get \"TEC.\"\n\nThe box with the letter ‘C’ has the number\
    \ 10, so take the card from the 10th box. You will get \"TECH.\" The box with\
    \ the letter ‘H’ has number 4, so take the card from the 4th box. You got \"TECHN.\"\
    \ Continue following the numbers, and you will get the whole word:\n\nTECHNOLOGY.\n\
    \nThat is how a linked list works. It is made of nodes. Each node has at least\
    \ one variable that holds data (a text or number or object) and one variable (pointer)\
    \ that holds the address of the next node. This system walks through the node\
    \ list as you did in the puzzle. The pointer of the last node has null value,\
    \ or it may point to the first node. Then we have a closed linked list.\n\n####\
    \ ADD A NODE\n\nIf you want to add a new node to the end of the linked list, you\
    \ have to create a new node. Then point the pointer of the last node to the address\
    \ of the new node and assign null to the new node pointer.\n\n![](image.007.jpeg)\n\
    \nFigure Adding a node to the end of the linked list.\n\nIf you want to add a\
    \ new node to the beginning of the linked list, you have to create a new node.\
    \ Point the pointer of the new node to the first node, and that is it.\n\n![](image.008.jpeg)\n\
    \nFigure Adding a node to the head of the linked list.\n\nIf you need to add a\
    \ node in the middle of the linked list, you have to create a new node, and then\
    \ break the chain: redirect the node (previous to the break), to a new node and\
    \ point the pointer of the new node to the next node (the one after the break).\n\
    \n![](image.009.jpeg)\n\nFigure Adding a node in the middle of the linked list.\n\
    \n#### DELETE A NODE\n\nTo delete a node with a certain key, you walk along with\
    \ the list until you find the key. Then you assign the key node to the temp node.\
    \ Then you point the node previous to the key node to the node next to the key\
    \ node. See Figure 60\\. As a result, the temp key becomes isolated from the list.\
    \ Now you can delete the temp.\n\n![](image.010.jpeg)\n\nFigure Delete a node.\n\
    \nBelow is a code for Node class. For simplicity sake, I created a node that holds\
    \ an integer and node pointer to the next node. Both class member variables are\
    \ declared as private. It is good programming practice not to use global variables,\
    \ because private members cannot be seen from the outside of the class. We still\
    \ need to set and to read these private member variables. The public functions\
    \ set and will do the job.\n\n# Chapter 3:\n\n# Binary trees\n\n### ![C:\\Users\\\
    Talha\\Downloads\\uday-awal-UjJWhMerJx0-unsplash (1).jpg](image.011.jpeg)"
