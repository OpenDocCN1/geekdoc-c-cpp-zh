  在上面的程序中，我们现在 `Student` 类中正确定义了方法 `InputName`，它可以访问受保护成员 `Name`。通过这个程序，输出如下：\n\n\
  ```\nStudent ID 1\nStudent Name John\n```\n\n### 示例 8：以下程序展示了错误使用访问修饰符的第二个示例。\n\n\
  ```cpp\n#include <iostream>\nusing namespace std;\nclass Person\n{\npublic:\n  \
