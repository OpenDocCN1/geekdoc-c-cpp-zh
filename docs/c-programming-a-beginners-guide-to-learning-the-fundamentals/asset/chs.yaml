  n\"; cout <<\"10 to the power of 5 is \"<<pow(10,5)<< \"\\n\";\n}\n```\n\n## Note\n\
  \n`abs()` 函数也包含在 `stdlib.h` 头文件中。\n\n一旦你完成了预处理器指令，就可以开始编写 `main()` 代码。\n\n```cpp\n\
