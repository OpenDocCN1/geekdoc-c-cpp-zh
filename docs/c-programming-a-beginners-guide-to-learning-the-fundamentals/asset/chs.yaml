  \ \"\\n\"; cout <<\"10 to the power of 5 is \"<<pow(10,5)<< \"\\n\";\n}\n```\n\n\
  当 `cout` 语句执行时，通过函数调用显示 `55`。\n\n```cpp\n#include <iostream> using namespace std;\
  \ #include <cmath> void main(void)\n{\n cout <<\"The absolute value of -55 is \"\
