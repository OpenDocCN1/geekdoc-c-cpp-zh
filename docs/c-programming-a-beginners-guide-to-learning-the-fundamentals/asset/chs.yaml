- "# C++ 编程：多范式编程语言基础与数据管理入门初学者指南 (2022 速成课程)\n\n\n\n\n\n## 引言\n有很多不同的编程语言，而 `C++`\
  \ 通常不会出现在我们在学习过程中可能遇到的“简单”编程语言名单上。我们可能会发现使用这种语言有许多优势，但它通常被认为比其他可用语言更难掌握。\n\n随着本本指南的不断进行，你将发现这是一门非常出色的语言。它将为我们提供一些所需的最佳技巧和技术，并演示如何在该语言中编写我们所需的一些不同代码。如果你正在寻找一种可以帮助开发\
  \ Web 应用程序、游戏等许多领域的强大编程语言，并且想立即学习如何使用它，那么本手册就是为你准备的。\n\n在本书中，我们将学习使用 `C++` 语言编程所需的所有知识。我们将从使用该语言的一些基础知识开始，例如：这种语言的本质是什么、它与其他语言相比的某些优势，以及回顾一些与该语言相关的历史。\n\
  \n一旦我们掌握了 `C++` 编程语言的基础，我们就可以转向一些更高级的话题。我们将详细地介绍该语言的语法和基础。它与许多其他编程语言略有不同，因此在开始编写脚本之前，我们必须首先学会如何实现这一切。我们还将查看一些流行的且与\
  \ `C++` 语言良好配合的库，这些库可以用于扩展在该语言中看到的某些功能。\n\n现在我们已经了解了 `C++` 编程的一些基础，并对整门语言有了更好的理解。现在是时候深入研究如何编写我们所需要的代码细节了。我们可以关注许多不同类型的代码，并且在该语言内部可以处理的许多不同事情，我们将查看其中的一些特性。\n\
  \n## 什么是 C++？\n许多初学者将 `C++` 归类为复杂的语言。无论原因是什么，`C++` 并不是一种缺乏优秀功能的复杂语言。这是因为 `C++` 是一门在过去不断演变的编程语言。\n\
  \n## C++ 的历史\n在早期，`C++` 仅被用作 `C` 的一个分支，并在编译前被转换回 `C`。一个名为 `Cfront` 的编译器因执行这项工作而闻名。然而，几年后，使用\
  \ `C++` 的人们发现，在没有实际编译器的语言中创建代码太困难了。因此，某些开发者开始开发编译器，最终由 Bjarne Stroustrup 完成了任务，并实现了一个可行的\
  \ `C++` 编译器。\n\n在几年内实现了严格的语法结构后，`C++` 在 1998 年被 `ISO` 认可。第一个更新版本在同年发布，人们对 `C++`\
  \ 开始提供的新增额外功能感到惊讶。它开始使用高级技术来缩短编译时间，并在第一个版本中引入了模板（templates）。所有这些强大的新功能都帮助 `C++`\
  \ 开发了复杂的软件。在几年内，`C++` 有了巨大的进步，并包含了许多可以创建通用应用程序的高级功能。\n\n非常感谢微软促使了 `C++` 作为一种编程语言的迅速崛起。微软开始使用\
  \ `C++` 开发其开发软件 `Visual C++`。许多为微软系统开发应用程序的程序员开始发现使用 `C++` 工作是多么的可靠和舒适。到 2009 年，`C++`\
  \ 标准库更新了各种复杂的系统、数学函数和时间函数。\n\n## 为什么 C++ 会成功？\n`C++` 的成功主要归功于它的面向对象特性。在 20 世纪 80\
  \ 年代，面向对象的编程范式席卷了技术世界。人们对它提供的适应性和简单性留深刻印象。当时许多内置的 `C` 库可以很容易地转换为 `C++` 功能库。`C++`\
  \ 是 `C` 的一个主要实例，增加了继承和多态等面向对象的原则。\n\n## 为不同的操作系统设置 C++ 环境\n\n\n\n\n所有用于创建 C++ 软件的软件都由代码编辑器和一个用于显示可能错误的内置调试器组成。如果你是一个老派的人，你可以简单地使用文本编辑器并在命令行环境中运行程序。它仍然运行得非常完美。然而，在本节中，我们将讨论用于创建\
  \ C++ 程序的高级集成开发环境（IDE）软件。\n\n## IDE 是如何工作的？\n\nIDE 使用编辑程序、编译器链机制和调试的结合来创建高效的程序。\n\
  \n注意：\n\n记住，如果你尝试在命令行中执行程序，C++ 并不提供解释器。\n\nC++ 以其先进的功能和易于的语法在程序员中闻名。即使受到 Java 和\
  \ Python 等高级编程语言的影响，C++ 也没有失去它的魅力。这一章作为对 C++ 编程语言及其历史的全面介绍，将帮助你详细理解这一流行编程语言之一的重要性和起源。在书中，我们用通俗易懂的语言解释了各种复杂的编程主题。为了理解和欣赏许多信息，理解\
  \ C++ 作为一种编程语言的重要性至关重要。让我们现在详细学习 C++ 吧。\n\n## 新版 C++ 有什么特别之处？\n\n开发新版本的 C++ 是为了支持那些正尝试实现复杂现实世界项目的开发者。这里是\
  \ C++ 提供的一些显著的高级特性。\n\n### a) 高级数据结构实现\n\n树和链表等简单的数据结构可以通过基础 C++ 版本轻松地实现。然而，使用旧版本实现图和二叉树等高级数据结构是不可能的。另一方面，较新版本的\
  \ C++ 提供了标准库，帮助我们实现 `map` 和 `hash` 值，这些值可以进一步用于实现高级数据结构。\n\n### b) 加密功能\n\n新版本的\
  \ C++ 提供了专门的库，可用于 Web 和移动应用程序中实现复杂的加密功能。这些库还可以用于创建处理密码和隐写法的软件。\n\n### c) Lambda\
  \ 实现\n\nLambda 实现对于运行数据科学和机器学习应用程序至关重要。例如，现代深伪软件使用使用 lambda 表达式构建的 C++ 渲染库。\n\n\
  ### d) 高级面向对象特性\n\n我们都知道 C++ 是一种面向对象的语言。基础版本只支持单继承，而新版本可以为你的项目提供多重继承。通过新版本，我们能够使用多个运算符重载和复杂的多态功能。\n\
  \n# 第 1 章：\n\n# 如何编写你的第一个程序\n\n# ![C:\\Users\\Talha\\Downloads\\becomes-co-s_FHDDSVp1s-unsplash.jpg](img/image.002.jpeg)\n\
  \n一旦你下载了选择使用的 C++ 环境，我们将直接开始编写你的第一个代码。为了使之运行，你需要的代码如下：\n\n```cpp\n#include <iostream>\n\
  using namespace std;\nint main ()\n{\n    cout << “Use This One!”;\n    return 0;\n\
  }\n```\n\n在编写这些内容时，你有几个选项。你可以选择在你的编译器中编写它（它在你的环境中是可用的），或者你可以选择将其编写并保存到计算机中。第二种方案有时很好，因为这样你就保存了代码，可以在代码中需要的任何时候进行复制和粘贴。\n\
  \n无论哪种方式，你都应该仔细考虑你想要使用的文本编辑器类型。大多数编辑器都是针对特定设备的，因此你需要寻找与你的特定电脑匹配的一个。你可以选择的选项包括 Windows\
  \ 记事本、`vlm`、`vl`、Brief 和 EMACS。如果你想拥有一个兼容多个平台的编辑器，那么 `vlm` 和 `vl` 选项是最佳选择。\n\n当你编写自己的代码时，你应该先在文本编辑器中编写，以获得程序的草稿，稍后你可以将它们移动到编译器中。这让你更容易检查自己的工作，并避免在当前正在编写的代码中出现错误。\n\
  \n## C++ 编译器\n\n就像文本编辑器一样，有很多编译器供你使用。问题是，虽然你有很多选择，但其中许多编译器都非常贵。这是因为你遇到的大多数编译器都是为精英黑客设计的，他们已经精通了其他低级编译器中的内容，现在他们想确保自己能将其提升到下一个水平。\n\
  \n好消息是，有一些编译器可以免费获得。你只需要小心留心，确保你获得的是良好的且包含你寻找的所有功能的编译器。`GNU` 是一个与 C++ 配合良好且适合初学者使用的编译器。它在\
  \ Linux 系统上使用效果最好，你可能已经在系统中有了它。要检查你的系统中是否有 `GNU` 编译器可用，请使用以下代码：\n\n```bash\ng++\
  \ -v\n```\n\n## 基础语法\n\nC++ 语言可以定义为一种使用对象来帮助保持组织有序的程序，并允许代码通过各种方法进行通信并完成其他功能。C++\
  \ 语言带有四个重要部分，包括：\n\n- **类 (Classes)**：这些是你语言的组织工具。它们可以被看作存放或存储对象的盒子，并对相似的对象进行分类。你可以给你的类命名任何你喜欢的名称，但将相似特征的对象归类是良好的编码习惯。\n\
  - **对象 (Object)**：对象是代码中具有状态和行为的东西。这些可以是颜色、纹理等。你通常会将这些对象分类。因此，如果你有一个关于狗的类，你可以将不同的狗放在同一个类中。\n\
  - **方法 (Method)**：这是编码中用于行为的术语。你可以有任意数量的方法可以使用。这是你操作数据的方式，操作将根据你所使用的方法执行。如果不使用正确的方法，你的程序将不知道它应该做什么。\n\
  - **实例变量 (Instant variable)**：这些指的是你正在处理的单个对象。每个对象都通过一组唯一的变量来标识。你可以在创建对象时使用某些值为它分配正确的变量。\n\
  \n这就是编写 C++ 代码的基础。你应该花时间在你的编译器中编写上面的代码，以获得一些练习并理解你在这里应该做什么。我们稍后将查看这些代码可以做的一些事情，但这是一个很好的起点。\n\
  \n## C++ 数据类型\n\n就像你可能想要学习的一些其他编程语言一样，在 C++ 代码中也会出现许多数据点。你经常会使用变量，例如，变量只是在你的计算机内存中预留的空间，以确保代码的不同部分能够保持安全。在处理\
  \ C++ 语言时，我们有很多数据点可以关注，这些点包括：\n\n1. 布尔型 (Boolean)\n2. 双精度浮点型 (Double floating point)\n\
  3. 单精度浮点型 (Floating point)\n4. 整数型 (Integer)\n5. 字符型 (Character)\n6. 无值 (Valueless)\n\
  7. 宽字符型 (Wide character)\n\n## C++ 函数\n\n\n\n\n我们还需要查看一下在处理 C++ 语言时会遇到的一些函数。函数非常简单，它是一组为了执行特定任务而设计的语句。你用\
  \ C++ 编写的每个程序都至少包含一个函数，这被称为 `main()` 函数，但你可能需要添加更多的函数，以便让代码按照我们想要的方式运行。\n\n你可以通过多种不同的方式来实现这一点。首先，我们可以选择根据我们希望代码运行的方式将代码拆分为几个函数。你如何决定拆分代码以及使用多少个函数取决于你个人，以及你试图在代码中编写的内容。但大多数程序员会以这种方式拆分代码：使每个函数独立负责其自己的任务。\n\
  \n函数声明会告诉编译器函数名称、随函数一起的参数以及我们将看到的返回类型。但请记住，我们看到的函数定义位于该函数的实际体中。\n\n我们在 C++ 库中看到的标准库能够为我们提供许多内置在程序中的函数，我们可以在任何需要的时候调用它们。例如，如果我们使用\
  \ `strcat()` 函数，它它可以帮助我们连接两个字符串。然后我们可以使用 `memcpy()` 来帮助我们将内存中的一个位置的内容复制到另一个位置。这些只是你可以使用的不同类型的函数，你会发现它们的工作方式都是相似的。\n\
  \n考虑到这一点，我们需要更进一步，实际查看我们如何在 C++ 中应用函数。你用于定义函数的代码包含：\n\n```\nReturn type function\
  \ name (parameter list) {\n\nBody of the function\n}\n```\n\n这些函数定义由函数头和函数体组成。函数的各个部分包括以下内容：\n\
  \n*   **返回类型**：你正在处理的函数可能会返回一个值，你将使用返回类型的值在这里返回内容。某些函数可以执行你想要的操作而无需向你返回值。使用我们上面使用的语法，你最终得到的答案将是\
  \ `void`。\n*   **函数名**：这是你给函数起的名称。当你加上函数名和参数时，你就得到了所谓的函数签名（function signature）。\n\
  *   **参数**：参数是一个占位符。当你调用函数时，你将一个值传递给参数。这个值被称为实际参数或参数（argument）。参数列表将引用函数的参数数量、顺序和类型。也可以编写一个完全没有参数的函数。\n\
  *   **函数体**：最后，函数体将包含一组语句，用于定义函数的功能。\n\n在很多时候，我们将使用函数来帮助完成代码的某些部分，并确保一切都准备就绪以进行处理。务必练习这些函数，看看它们如何满足我们的需求。\n\
  \n## 修饰符的类型\n\n每当你处理 C++ 中想要执行的某些代码时，你会发现可以使用 `char`、`double` 和 `int`，以便出现在它们之前的修饰符能够存在。我们在这里讨论的修饰符将用于帮助我们更改该基础类型的含义，使其能够适应我们试图创建的任何程序或情况。有不同类型的数据修饰符可以可以使用。这些包括\
  \ `signed`、`unsigned`、`long` 和 `short`。\n\n这四种修饰符适用于我们拥任何整数基础类型。例如，你可以取 `signed`\
  \ 和 `unsigned` 来处理 `char`，然后 `long` 可以用于 `double` 等。C++ 还会让我们更容易地使用简写表示法来处理这些整数。这意味着可以直接使用这些单词，而不需要添加\
  \ `int` 部分，因为这在编码中始终是隐含的。\n\n此外还有不同类型的限定符（qualifiers）来让你的 C++ 代码正常工作。你可以使用的用于为前前的变量提供额外信息的以下限定符类型包括：\n\
  \n*   **Const**：具有 `const` 的对象在程序执行期间将无法被程序更改。\n*   **Volatile**：易变性修饰符会告诉编译器你可以更改值，但这些更改可能不会由程序显式指定。\n\
  *   **Restrict**：被 `restrict` 限定的指针最初是访问其所指向的对象的唯一手段。\n\n# 第 2 章：基础设施\n\n## 数组\n\
  \n数组是一种保存了相同类型元素顺序集合的数据结构。\n\n![C:\\Users\\Talha\\Downloads\\sigmund-2qd9noyeuRE-unsplash\
  \ (1).jpg](img/image.000.jpg)\n\n例如，在以下代码中：\n\n```cpp\n#include <iostream>\n\nint\
  \ main(int argc, char* argv[]) {\n    int char_array[10] = {1, 5, 9, 4, 2, 7, 6,\
  \ 3, 8, 0};\n    int sum = 0;\n    int length = sizeof(char_array) / sizeof(char_array[0]);\n\
  \n    std::cout << \"Size of array: \" << length << std::endl;\n\n    for (int i\
  \ = 0; i < length; i++) {\n        sum = sum + char_array[i];\n    }\n    std::cout\
  \ << \"Sum of numbers: \" << sum << std::endl;\n\n    int *p = char_array;\n   \
  \ std::cout << \"Address of the first element: \" << p << std::endl;\n    std::cout\
  \ << \"The value in the address: \" << *p << std::endl;\n\n    p++; //移动指针到下一个元素\n\
  \    std::cout << \"Address of the second element: \" << p << std::endl;\n    std::cout\
  \ << \"The value in the address: \" << *p << std::endl;\n\n    return 0;\n}\n```\n\
  \n`sizeof` 函数返回数组分配的字节数。由于 `char` 数据类型占用一个字节，`sizeof` 返回的字节数等于 `char` 数组的元素数量。\n\
  \n整数数据类型在内存中占用 4 字节，10 个整数数组存储在 40 字节中。\n\n要计算数组中存储了多少元素，我们可以将整个数组分配的字节数除以数组中一个元素分配的字节数：`length\
  \ = sizeof(numbers) / sizeof(numbers[0])`。\n\n\n\n\n要访问数组的所有元素，我们必须使用 `for` 循环。\n\
  \n```cpp\nfor(i=0; i<length; i++) cout<<char_array[i];\n```\n\n如果我们声明一个指针并将数组赋值给该指针，该指针将持有数组第一个元素的地址：`int\
  \ *p =numbers; cout<<\"Address of the first element is \"<<p<<endl;`\n\n该行代码的输出是：\n\
  \n`Address of the first element is 0059F710`\n\n要使用指针访问数组第一个元素地址处存储的值，请运行以下行代码：`cout<<\"\
  The value in the address is \"<<*p<<endl;` 该代码的输出是：\n\nThe value in the address\
  \ is 1.\n\n要移动到数组的下一个元素，你必须增加 `p`。`p++;`\n\n现在它将指向数组的第二个元素：`cout<<\"Address of the\
  \ second element is \" <<p<<endl; cout<<\"The value in the address is\"<<*p<<endl;`\
  \ 输出结果为：\n\n在我电脑上，numbers 数组的第二个元素的地址是 0059F714\n\n第二个元素的地址处的值是 5。\n\n![](img/image.004.jpeg)\n\
  \n图 数组程序的输出。\n\n## 字符串\n\n## 字符串函数\n\n我将向你展示如何使用一些字符串函数。`strcpy_s()` 将字符串的内容复制到另一个字符串。\n\
  \n`strcat_s()` - 将源字符串的副本接到目标字符串。`strlen()` - 返回字符串的长度。\n\n我们的应用程序将从用户输入读取字符串，将其复制到另一个字符串，然后将原始字符串字符倒序复制到临时字符串，并将副本和倒序后的副本合并为一个字符串。\n\
  \n例如，如果用户输入字符串‘Concatenation’，则应用程序将输出\n\n‘ConcatenationnoitanetacnoC’\n\n`main.cpp`\
  \ 文件中必须包含以下头文件：\n\n```cpp\n#include \"stdafx.h\"\n#include <stdio.h>\n#include <cctype>\n\
  #include <iostream>\n#include <cstring>\n```\n\n`<cstring>` 头文件用于字符串函数：`strcpy_s()`、`strcat_s()`\
  \ 和 `strlen()`。`cctype` 头文件用于 `toupper()` 函数。\n\n我想解释一下我是如何按倒序将字符从原始字符串复制到临时字符串的。\n\
  \n首先，我使用 `strlen()` 函数获取原始字符串的长度。`length=strlen(aWord);`\n\n然后在循环中，我将原始字符串的最后一个字符复制到临时字符串的开头，依此类推。\n\
  \n让我们检查循环中的代码。\n\n```cpp\nfor(i=0; i <length; i++) temp[i]=aWord[length-(i+1)];\n\
  ```\n\n如果用户输入单词‘Concatenation’，则单词长度为 13。字符串中第一个字符的索引为 0，那么字符串最后一个字符的索引将是 12。这意味着最后一个字符的索引是\
  \ `length -1`。\n\n我放在循环中的行代码是 `temp[i]=aWord[length-(i+1)];`。\n\n当 `i =0` 时，`temp[i]`\
  \ 将引用 `temp` 字符串的第一个字符。\n\n同时（当 `i =0` 时），`aWord [length-(i+1)]` 将引用 `aWord[13 –\
  \ (0 + 1)]` 字符，它将是 `aWord[12]`，即‘Concatenation’字符串的最后一个字符。\n\n当 `i=1` 时，`temp [1]`\
  \ 将引用 `temp` 字符串的第二个字符，而 `aWord [13-(1+1)]` 将引用‘Concatenation’字符串中倒数第二个字符。\n\n通过这样，我们就可以倒序复制所有字符。\n\
  \n当我们把所有字符从原始字符串复制到 `temp` 字符串后，我们需要在 `temp` 字符串末尾添加空字符，因为 C++ 中的字符串必须以空字符终止。\n\n\
  `temp[length]='\\0';` 这一行代码将完成这项工作。\n\n整个代码包含在 [visual_studio_2017.zip.](http://learn-coding.today/cplusbook/visual_studio_2017.zip.)。\n\
  \n```cpp\n#include \"stdafx.h\"\n#include <stdio.h>\n#include <cctype>\n#include\
  \ <cstring>\n#include <iostream>\nint main()\n{\n    char more = 'Y';\n    char\
  \ prompt1[] = \"\\nEnter a word not more than 20 characters and press enter.\\n\"\
  ;\n    char prompt3[] = \"\\nDo you want to continue? Y/N\\n\";\n    char aWord[20];\n\
  \    char aCopy[40];\n    int length = 0;\n    char temp[20];\n    int i;\n\n  \
  \  while (toupper(more) == 'Y')\n    {\n        std::cout << prompt1;\n        std::cin\
  \ >> aWord;\n        std::cout << \"aWord=\" << aWord << std::endl;\n        strcpy_s(aCopy,\
  \ aWord);\n        std::cout << \"aCopy=\" << aCopy << std::endl;\n        length\
  \ = strlen(aWord);\n        std::cout << \"length=\" << length << std::endl;\n\n\
  \        //fill temp[] array with the word characters in opposite order.\n     \
  \   for (i = 0; i <length; i++) temp[i] = aWord[length - (i + 1)];\n        temp[length]\
  \ = '\\0';\n        std::cout << \"Temp=\" << temp <<std::endl;\n        strcat_s(aCopy,\
  \ temp);\n        std::cout << \"aCopy=\" << aCopy << std::endl;\n        std::cout\
  \ << prompt3;\n        std::cin >> more;\n    }\n    return 0;\n}\n```\n\n\n\n二叉树是目前所有基础数据结构中最迷人且实用的结构。它们是如何利用递归和指针来完成某些极其重要任务的典型示例。\n\
  \n链表是构建项目列表的最伟大策略之一，但在列表中查找元素可能花费一些时间。如果你有大量的非结构化数据，数组对你也没有什么大帮助。你可以尝试对数组进行排序，但插入元素仍然很困难。在一个你想保持排序的数组中插入新元素将需要大量的移动！而且，在尽可能快速在列表中发现项，在中是至关重要的，尤其是在以下这些场景中：\n\
  \n- 你正在开发一款 MMORPG（大型多人在线角色扮演）游戏，玩家需要能够快速登录——这涉及到快速查找玩家。\n- 你正在构建一个处理信用卡的软件，每小时需要处理数百万笔交易——需要非常快地找到信用卡余额。\n\
  - 你正在使用低功耗设备（如平板电脑或智能手机）并向用户显示通讯录。你不希望用户因为你的数据结构太慢而一直卡顿。\n\n本节将讨论克服这些问题及更多所需的工具。\n\
  \n解决方案的思路是能够在像链表这样的结构中存储元素，利用指针来帮助构建内存，但方法比链表更简单。这要求内存具有比简单列表更多的结构。\n\n那么，数据结构化意味着什么？当我们开始这段旅程时，我们只有数组，但这些从未真正赋予我们使用顺序列表以外的数据结构的能力。链表使用指针增量地增长顺序列表，但没有利用指针的灵活性来构建更复杂的结构。\n\
  \n内存中这些更复杂的结构是什么？在任何给定时刻持有比单个“下一个节点”更多节点的结构就是一个很好的例子。但你为什么想要它呢？很简单。如果你有两个“下一个节点”，其中一个可以用来表示比当前元素更多的元素。这被称为二叉树。\n\
  \n它们之所以这样命名，是因为每个节点都始终有一个或两个分支。每个下一个节点都是子节点，而连接到子节点的节点就是父节点。\n\n二叉树看起来可能像：\n\n```\n\
  10\n6 14\n5 8 11 18\n```\n\n在树中，每个元素的左孩子都小于该元素，而右孩子大于它。`10` 是整棵树的父节点，而 `6` 和 `14`\
  \ 的子节点都是它们各自小树（称为子树）的父节点。\n\n二叉树有一个非常重要的属性：每个孩子都是一整棵树。将左孩子小于、右孩子大于的规则结合起来，你就有了一种定义在树中定位特定节点的算法简单方法。\n\
  \n首先，查看当前节点的值。如果它等于搜索目标，就完成了。如果它大于搜索目标，向左走；否则向右走。这之所以有效，是因为树左侧的每个节点都小于当前节点值，右侧的每个节点都更大。\n\
  \n在理想的世界中，你的二叉树是平衡的，两侧节点数量完全相同。在这种情况下，每个子树大约占整棵树的 50%，当你在树中搜索一个值时，搜索每到达一个子节点，就可以排除\
  \ 50% 的结果。所以，如果你有一棵拥有 1000 个元素的树，500 个会立即被排除。再次搜索这棵树（现在它只有 50 个元素了），你可以再次削减大约 50%。这样，找到你想要的值就不需要长时间。\n\
  \n那么，树必须被细分多少次才能到达一个元素？答案是 `log2n`（`n` 是树拥有的元素数量）。即使你的树很大，这也是一个小值——如果你的树有，比如 320\
  \ 亿个元素，该值为 32；这比搜索一个拥有 40 亿元素的链表快了近 1 亿倍，而在链表中，每一个元素都必须经过评估。\n\n如果树不是平衡的，你就无法排除大约一半的元素；最坏的情况下，每个节点只有一个孩子，这使得这棵树无非带有几个额外指针的链表，因此需要你搜索所有元素。\n\
  \n所以，当树大致平衡时，搜索节点比在链表上进行相同的搜索快得多且容易得多。这是因为你可以按照你的方式来构建内存。\n\n### 实现二叉树\n\n要实现二叉树，从声明节点结构开始：\n\
  \n```c\nStruct node {\n    int key_value;\n    node *p_left;\n    node *p_right;\n\
  };\n```\n\n节点可以存储简单的整数 `key_value` 作为值，并有两个子树——`p_left` 和 `p_right`。\n\n你可能在二叉树上需要一些常用函数：插入、搜索、删除和销毁：\n\
  \n```c\nnode* insert (node* p_tree, int key);\nnode *search (node* p_tree, int key);\n\
  void destroyTree (node* p_tree);\nnode *remove (node* p_tree, int key);\n```\n\n\
  ### 插入\n\n我们将使用递归算法将其插入树中。递归对于树来说是极佳的，因为每个树都有两个小树；这使得整棵树在本质上是递归的。该函数接收一个键和一个已经存在的树（即使是空的），并返回一个新树。\n\
  \n```c\nnode* insert (node *p_tree, int key) {\n    if (p_tree == NULL) {\n    \
  \    node* new_tree = new node;\n        new_tree->key_value = key;\n        new_tree->p_left\
  \ = NULL;\n        new_tree->p_right = NULL;\n        return new_tree;\n    }\n\
  \    if (key < p_tree->key_value) {\n        p_tree->p_left = insert(p_tree->p_left,\
  \ key);\n    } else {\n        p_tree->p_right = insert(p_tree->p_right, key);\n\
  \    }\n    return p_tree;\n}\n```\n\n这里的基本逻辑是：如果你有一个空树，就创建一个新的。如果不是，如果值小于当前节点，则进入左子树；否则，进入右子树。\n\
  \n关于它的运行效果，将一个空树构建成带有节点的树。如果值 `10` 插入空树中，我们将立即命中基础情况，结果将是一棵：\n\n```\n10\n```\n\n\
  并且两个孩子树将指向 `NULL`。然后向树插入 `5` 并产生以下调用：`insert(p_tree, 5)`。因为 `5` 小于 `10`，对左树的调用是递归的：`insert(NULL,\
  \ 5)`。`insert(NULL, 5)` 创建并返回一个新树：\n\n```\n5\n```\n\n当接收返回的树时，`insert(5)` 连接树。在这个例子中，`10`\
  \ 的左孩子之前是 `NULL`。因此，`10` 的左孩子建立了一棵新树：\n\n```\n10\n5\n```\n\n如果我们现在添加 `7`，我们得到：`insert(NULL,\
  \ 7)`, `insert(p_tree, 7)`, `insert(p_tree, 7)`。所以，首先，`insert(NULL, 7)` 将返回一个新树：\n\
  \n```\n7\n```\n\n然后 `insert(p_tree, 7)` 以这种方式连接到 `7` 的子树：\n\n```\n5\n7\n```\n\n\
  最后，树返回到：`insert(p_tree, 7)`。这将将其连回：\n\n```\n10\n5\n7\n```\n\n由于已经存在一个从 `10` 指向 `5`\
  \ 节点的指针，我们并不真正需要重新连接 `10` 的左孩子到以 `5` 为父节点的树，但这确实消除了一个检查子树是否为空的条件判断。\n\n\n\n\n###\
  \ 销毁\n\n这应该也是递归函数。在删除当前节点之前，算法会销毁当前节点下的两个子树。\n\n```cpp\nvoid destroy_tree (node\
  \ *p_tree)\n{\n  if ( p_tree != NULL )\n  {\n    destroy_tree( p_tree->p_left );\
  \ destroy_tree( p_tree->p_right ); delete p_tree;\n  }\n}\n```\n\n为了更好地理解这一点，让我们假设在删除节点之前打印了该节点的值：\n\
  \n```cpp\nvoid destroy_tree (node *p_tree)\n{\n  if ( p_tree != NULL )\n  {\n  \
  \  destroy_tree( p_tree->p_left ); destroy_tree( p_tree->p_right ); cout << \"Deleting\
  \ node: \" << p_tree->key_value; delete p_tree;\n  }\n}\n```\n\n如你所见，树是从底向上删除的。节点\
  \ 5 和 8 首先被删除，然后是 6，最后移动到另一侧删除 11 和 18，接着是 14。最后，10 将被删除。树的值并不重要；重要的是节点所在的位置。在下面的二叉树中，我们使用的不是节点值，而是删除顺序：\n\
  \n7\n3 6\n1 2 4 5\n\n手动在几棵树上运行一遍代码可能会有所帮助，这样你就能看得更清楚了。\n\n从树中删除元素是递归算法的一个极佳例子，这种算法很难用迭代实现。首先，你需要一个可以同时处理树的两个边的循环。你必须能够在删除一个子树的同时跟踪下一个子树，而且这在每一层都需要执行。使用栈，你可以更容易地记录位置。可视化这种点的最好方法是说，每个栈帧将存储已经删除或销毁的树分支：\n\
  \n`destroy_tree( )` `destroy_tree( )`––确定子树是左侧还是右侧。每个栈帧都知道树的哪些部分必须销毁，因为它们知道函数执行到哪一点应该继续。当进行第一次调用销毁树时，程序通过栈帧通知在第二次调用\
  \ `destroy_tree` 时继续执行。当进行第二次调用时，程序被告知继续执行 `delete tree`。由于每个函数都有自己的栈帧，它可以跟踪当前整个树销毁的状态，一次一个树层。\n\
  \n要用非递归的方式实现这一点，需要一个保留相同数量和类型信息的数据结构。例如，你可以编写一个函数，使用链表来模拟列表。该链表将包含正在销毁的子树和等待删除的树。然后可以编写一个基于循环的算法，将子树添加到列表中并在它们完全销毁后将其移除。基本上，递归允许你使用内置的栈数据结构，而不需要自己编写。\n\
  \n# 第 4 章：继承\n\n![C:\\Users\\Talha\\Downloads\\pexels-thisisengineering-3861964.jpg](img/image.012.jpeg)\n\
  \n示例：`#include <iostream>` `using namespace std;`\n\n```cpp\n// 定义一个具有 2 个成员的简单学生类\n\
  class Student\n{ \npublic:\n  int studentID; string studentName;\n  // 显示类成员的函数\
  \ \n  void Display()\n  {\n    cout<<\"Student ID \"<<studentID<<endl; cout<<\"\
  Student Name \"<<studentName;\n  }\n};\n\nint main () {\n  Student stud1;\n  //\
  \ 给类的属性赋值\n  stud1.studentID=1;\n  stud1.studentName=\"John\";\n  stud1.Display();\n\
  \  return 0;\n}\n```\n\n通过上述程序：\n* 我们有一个名为 `Student` 的类，它有 2 个成员，一个是 `studentID`，另一个是\
  \ `studentName`。\n* 然后我们定义了一个名为 `Display()` 的成员函数，它将 `studentID` 和 `studentName`\
  \ 输出到控制台。\n* 然后我们可以在主程序中的对象中调用该成员函数。\n\n通过此程序，输出如下：\nStudent ID 1\nStudent Name\
  \ John\n\n### 那么什么是继承？\n\n继承是一个概念，我们可以定义一个类来继承另一个类的属性和方法。这有助于避免再次定义该类或再次定义其属性和方法。\n\
  \n假设我们有一个名为 `Person` 的类，它有一个 `Name` 属性和一个 `Display` 方法。那么通过继承，我们可以定义一个名为 `Student`\
  \ 的类，它可以继承自 `Person` 类。\n\n`Student` 类将自动获得 ID 成员和 `Display` 函数。如果需要，`Student` 类可以再定义自己的额外的成员。\n\
  \n要定义一个被继承的类，我们使用以下语法：\n`派生类:基类`\n\n这里 `派生类` 是继承另一个类属性的类，而另一个类被称为 `基类`。\n\n所以，如果我们有一个如下所示的带有属性和函数的基类。\n\
  \n```cpp\nBase class\n{\n  Public or protected:\n  Property1;\n}\n```\n\n那么当我们从基类定义派生类时，派生类将访问该属性。注意，属性和函数需要访问修饰符为\
  \ `public` 或 `protected`。\n\n我们将稍后详细讨论访问修饰符。\n\n`派生类:基类`\n\n```cpp\n派生类:基类\n{\n\
  \  // 无需定义 property1，它会自动继承这些。\n}\n```\n\n现在让我们看一个简单的示例。\n示例 2：下面的程序展示了如何使用继承类。\n\
  \n```cpp\n#include <iostream>\nusing namespace std; // 定义一个具有 Name 属性的简单 Person\
  \ 类\n\nclass Person\n{\npublic:\n  string Name;\n};\n\n// Student 类简单派生自 Person\
  \ 基类\nclass Student:public Person\n{\n};\n\nint main () {\n  // 由于派生类可以访问基类的属性和函数，这些属性可以通过\
  \ Student 对象访问\n  Student stud1;\n  stud1.Name=\"John\";\n  return 0;\n}\n```\n\n\
  现在我们看到了如何使用派生类和基类，这被称为继承。\n\n### 1.2 派生类中的函数\n\n```cpp\nBase class\n{\n  Public\
  \ or protected:\n  Property1;\n  Fucntion1;\n}\n```\n\n当我们从基类定义派生类时，派生类将访问该属性和函数。注意，属性和函数需要访问修饰符为\
  \ `public` 或 `protected`。\n\n现在让我们看一个可以在派生类中使用函数的示例。\n示例 3：下面的程序展示了如何使用带有函数的继承类。\n\
  \n```cpp\n#include <iostream>\nusing namespace std; // 定义一个具有 Name、ID 属性以及一个名为 Display\
  \ 的函数的简单 Person 类。\n\nclass Person\n{\npublic:\n  string Name;\n  int ID;\n  void\
  \ Display()\n  {\n    cout<<\"ID \"<<ID<<endl; cout<<\"Name \"<<Name;\n  }\n};\n\
  \n// Student 类简单派生自 Person 基类\nclass Student:public Person\n{\n};\n\nint main ()\
  \ {\n  // 由于派生类可以访问基类的属性和函数，这些属性可以通过 Student 对象访问\n  Student stud1;\n  stud1.ID=1;\n\
  \  stud1.Name=\"John\";\n  stud1.Display();\n  return 0;\n}\n```\n\n通过此程序，输出如下：\n\
  ID 1\nName John\n\n\n\n\n我们也可以重新定义 `Student` 类中的 `Display` 函数。但如果你查看上面的示例，你会发现 `Person`\
  \ 类中的 `Display` 函数的显示文本为 `ID` 和 `Name`。但假设我们想在 `student` 类中将显示名称为 `Student ID` 和\
  \ `Student name`，我们可以重新定义 `Display` 函数。让我们来看一个相关的例子。\n\n### 示例 4：以下程序展示了如何使用带有重定义函数的继承类。\n\
  \n```cpp\n#include <iostream>\nusing namespace std;\nclass Person\n{\npublic:\n\
  \    string Name;\n    int ID;\n    void Display()\n    {\n        cout<<\"ID \"\
  <<ID<<endl;\n        cout<<\"Name \"<<Name;\n    }\n};\n\nclass Student:public Person\
  \ {\npublic:\n    // 这里我们正在重定义 Display 函数\n    void Display()\n    {\n        cout<<\"\
  Student ID \"<<ID<<endl;\n        cout<<\"Student Name \"<<Name;\n    }\n};\n\n\
  int main () {\n    Student stud1;\n    stud1.ID=1;\n    stud1.Name=\"John\";\n \
  \   stud1.Display();\n    return 0;\n}\n```\n\n通过这个程序，输出如下：\n\n```\nStudent ID 1\n\
  Student Name John\n```\n\n### 1.3 多重继承\n\n我们还可以让派生类继承自多个基类。这有助于一次性从多个类中获得更多功能。\n\
  \n`派生类: 基类 1, 基类 2… 基类 N`\n\n在这里，你只需要用逗号将基类分隔开即可。\n\n所以，如果我们有一个如下所示的带有属性和函数的基类。\n\
  \n```cpp\nBase class1\n{\nPublic or protected:\n    Property1;\n    Fuction1;\n\
  }\n```\n\n以及另一个如下的基类。\n\n```cpp\nBase class2\n{\nPublic or protected:\n    Property2;\n\
  \    Fucntion2;\n}\n```\n\n那么，当我们从这两个基类定义派生类时，该派生类将可以访问这两个类的属性和函数。\n\n```cpp\nDerived\
  \ class: Base Class1, Base Class2\n{\n    // 不需要定义 property1, property2 和 Function1,\
  \ Fucntion2，它们会自动继承这些。\n}\n```\n\n再次注意，属性和函数的访问修饰符需要为 `public` 或 `protected`。让我们来看一个多个派生类的示例。\n\
  \n### 示例 5：以下程序用于展示如何使用多个派生类。\n\n```cpp\n#include <iostream>\nusing namespace std;\n\
  \n// 定义 Person 类的第一个基类\nclass Person\n{\npublic:\n    string Name;\n    int ID;\n\
  \    void Display()\n    {\n        cout<<\"ID\"<<ID<<endl;\n        cout<<\"Name\"\
  <<Name;\n    }\n};\n\n// 定义 Marks 类的第二个基类\nclass Marks\n{\npublic:\n    int marks1,marks2;\n\
  \    void Sum()\n    {\n        cout<<marks1+marks2;\n    }\n};\n\n// 派生类同时继承 Person\
  \ 和 Marks 两个基类。\nclass Student:public Person,public Marks {\npublic:\n    void Display()\n\
  \    {\n        cout<<\"Student ID \"<<ID<<endl;\n        cout<<\"Student Name \"\
  <<Name<<endl;\n    }\n};\n\nint main () {\n    Student stud1;\n    stud1.ID=1;\n\
  \    stud1.Name=\"John\";\n    stud1.Display();\n    stud1.marks1=5;\n    stud1.marks2=10;\n\
  \    stud1.Sum();\n    return 0;\n}\n```\n\n通过上面的程序：\n\n![](img/image.013.png) 我们定义了\
  \ 2 个基类，一个称为‘Person’，另一个称为‘Marks’。(image.014.png) 派生类‘Student’继承了这两个类，并可以使用这两个类的成员。\n\
  \n通过这个程序，输出如下：\n\n```\nStudent ID 1\nStudent Name John\n```5\n1.4 访问控制\n\n类修饰符用于定义类中属性和方法的可见性。以下是各种修饰符：\n\
  \n- `Private` – 使用 `private`，属性和方法对类本身可见。\n- `Protected` – 使用 `protected`，属性和方法仅对类本身及其子类可见。\n\
  - `Public` – 使用 `public`，属性和方法对所有类可见。\n\n假设我们有一个如下的类结构：\n\n```cpp\nClass classname\n\
  {\nPrivate:\n    Property1;\n    Fucntion1;\n}\n```\n\n`property1` 和 `function1`\
  \ 在定义它们的类之外的任何地方都是不可访问的。如果你在 main 程序中尝试访问这些属性或函数，将得到编译错误。\n\n现在让我们定义下面的类，这次我们将使用\
  \ `protected` 访问修饰符。\n\n```cpp\nClass classname1\n{\nProtected:\n    Property1;\n\
  \    Fucntion1;\n}\n```\n\n现在 `property1` 和 `function1` 在上述类以及任何继承自它的类中可见。但注意，我们不能在其他非派生类中使用这些属性。\n\
  \n```cpp\nClass derivedclassname: classname1\n}\n```\n\n让我们来看另一个访问修饰符的示例。\n\n###\
  \ 示例 6：以下程序用于展示如何使用访问修饰符。\n\n```cpp\n#include <iostream>\nusing namespace std;\n\
  class Person\n{\npublic:\n    int ID;\nprotected:\n    // 注意我们将 Name 属性定义为 protected\n\
  \    string Name;\n    void Display()\n    {\n        cout<<\"ID \"<<ID<<endl; \n\
  \        cout<<\"Name \"<<Name;\n    }\n    // 注意我们将 city 属性定义为 private\n    private:\n\
  \    string city;\n};\n\nclass Student:public Person { \npublic: \n    void Display()\n\
  \    {\n        cout<<\"Student ID \"<<ID<<endl; \n        cout<<\"Student Name\
  \ \"<<Name<<endl;\n    }\n};\n\nint main () {\n    Student stud1;\n    stud1.ID=1;\n\
  \    stud1.Name=\"John\";\n    stud1.Display();\n    return 0;\n}\n```\n\n为什么我们会得到这个错误？`person`\
  \ 类具有 `protected` 访问修饰符，这意味着它只能在派生类中访问。但我们尝试在 main 类中访问它，这是错误的。\n\n### 示例 7：以下程序展示了正确的方法。\n\
  \n```cpp\n#include <iostream>\nusing namespace std;\nclass Person\n{\npublic:\n\
