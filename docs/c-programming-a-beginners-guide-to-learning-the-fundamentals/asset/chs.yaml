  \ `seekg()`，输出使用 `seekp()`（`p` 代表 put，`g` 代表 get）。它们用于移动指针。`tellp()` 和 `tellg()`\
  \ 函数用于告知指针的位置。\n\n## 缓冲区与字符串缓冲区\n\n*   `stringstream` 是一种方便的方法，可以像独立的 I/O 设备一样操作字符串。有时使用\
  \ `stringstream` 在字符串与其他数值类型之间进行转换非常方便。`stringstream` 的用法与 `iostream` 非常相似，因此学习起来没有负担。\n\
  *   你需要从字符串构建一个 `stringstream`，或者将 `stringstream` 转换回字符串。\n\n1. `stringstream outstr;`\n\
  2. `outstr<<\"salary ␣  value\"<<123333.00<<endl;`\n3. `string str = outstr.str()`\
  \ // 转换为 string\n4. `istringstream Instr(str);`\n5. `while(instr>>number)`\n6. `cout<<number<<endl`\n\
  7. `char sentence []=\"Yan ␣  is ␣  41 ␣  years ␣  old\";`\n8. `char str [20];`\n\
  9. `int i;`\n10. `sscanf (sentence,\"%s ␣  %*s ␣  %d\", str, &i);`\n11. `sprintf(...);`\n\
  \n第 1 到 3 行：将数字转换为文本。\n第 5 到 7 行：将文本转换为数字。\n第 9 行到结束：C 语言方法。在第 12 行，你可以看到 `\"*s\"\
  `，这意味着输入将被忽略。因此 `str = Yan`，`i = 41`。\n\n### 操作流\n\n1. `Peek` 返回输入流中的下一个字符，但不从输入流中提取它。例如，你想读取输入直到遇到第一个换行符或句号为止。\n\
  \n```cpp\nchar input[80]; int i = 0; while( (ch=cin.peek()) != ’.' && ch != ’\\\
  n’) cin.get(input[i++];) input[i] = ’\\0’;\n```\n\n2. `Gcount()` 方法返回上一次非格式提取方法读取的字符数。这意味着通过\
  \ `get()`、`getline()`、`ignore()` 或 `read()` 读取的字符，但不包括通过提取运算符读取的字符。\n3. `Putback()`\
  \ 函数将一个字符放回输入缓冲区。\n\n# 第 10 章：内存与资源\n\n![C:\\Users\\Talha\\Downloads\\pexels-olha-ruskykh-7504824.jpg](img/image.022.jpeg)\n\
  \n## 内存管理\n\n在管理执行程序使用的内存时，C++ 编程语言为用户提供了多种选项。在本章中，我们将介绍一些常用的选项。我们还将引入一些先进策略，以解决过去困扰\
  \ C++ 项目的内存管理问题。\n\n### C++ 程序可用的内存\n\n现代操作系统通常会为留留出一部分内存用于执行程序，这允许操作系统同时管理多个程序的运行。不同的操作系统以不同的方式布局执行程序的内存。然而，布局通常会包含以下四个部分：\n\
  \n*   **代码段 (Code)**：程序编译的可执行指令存储在代码段内存中。程序执行期间，代码段的内容永远不会改变。同样，在程序执行期间，代码段也不会改变。\n\
  *   **数据段 (Data)**：持久变量和全局变量存储在内存的数据段中（如静态局部变量）。在执行程序的寿命范围内，数据段的变量都存在。然而，除非数据是常量，否则执行程序可以自由更改它们的值。虽然数据段中变量的值在程序执行过程中可能会改变，但在程序执行时数据段的大小不会改变。这是因为程序的源代码精确定义了全局和静态局部变量的数量。编译器也可以计算出数据段的确切大小。\n\
  *   **堆 (Heap)**：执行程序获取动态内存的区域称为堆。使用 `new` 运算符从堆中获取内存，使用 `delete` 运算符将之前分配的内存返回堆。随着程序使用\
  \ `delete` 和 `new` 分配和释放动态内存，堆的大小在程序执行过程中收缩和扩张。\n*   **栈 (Stack)**：函数参数和局部变量始终存储在栈中。函数参数和局部变量在函数返回时消失，在函数调用时出现。随着各种函数的执行，栈的大小在程序执行过程中也会收缩和增长。\n\
  \n通常，操作系统限制栈的大小。深度递归会消耗大量的栈空间。例如，考虑一个编写不当的递归函数，它省略了基准情况，从而导致“无限”递归，消耗栈上所有的可用空间。这种情况被称为栈溢出（stack\
  \ overflow）。现代操作系统会终止任何消耗大量栈进程。但在某些嵌入式系统中，这种栈溢出可能无法检测到。通常堆空间是充足的，操作系统可以使用虚拟内存为执行程序提供比物理内存更多的空间。\n\
  \n## 手动内存管理\n\n使用 `delete` 和 `new` 时频繁的内存管理问题是逻辑错误中最难发现和修复的。程序员必须严格遵守以下准则：对于你调用\
  \ `new` 的地方，只要分配的内存不再需要，就应该始终有一个对应的 `delete` 调用。这听起来很简单，但并不总是清楚何时该使用 `delete`，下面的函数展示了内存泄漏：\n\
  \n```cpp\nvoid calc(int n) {\n// ...\n// 执行一些事情\nint *x = new int[n];\n// ...\n\
  // 对 x 执行一些事情\n// ...\n// 退出函数未删除 x 的内存\n}\n```\n\n如果程序多次调用 `calc` 函数，最终将耗尽内存。在\
  \ `calc` 函数中，`x` 是局部变量。从这个角度来看，`x` 位于栈上。因此，当某个特定的 `calc` 调用完成时，函数的清理代码会自动释放变量 `x`\
  \ 占据的空间。因为所有函数都会自动管理局部和参数变量的内存。`x` 的问题是通过 `new` 分配的，指向堆内存而非栈。\n\n那么，绝不能使用 `delete`\
  \ 来释放没有通过之前的 `new` 调用分配的内存。下面的代码片段说明了这样一个例子：\n\n```cpp\nint list[10], *x = list;\
  \ // x 指向 list\n// ...\n// 执行一些事情\n// ... delete [ ] x; // 逻辑错误，尝试释放 x 的内存\n```\n\
  \n指针 `x` 所引的空间不是由 `new` 分配的，因此不应使用 `delete` 来尝试释放内存。当你尝试删除未用 `new` 分配的内存时，会导致未定义行为，证明这是一个逻辑错误。\n\
  \n不能多次使用 `delete` 释放同一块内存。这种情况在两个指针指向同一块内存时很常见。这种指针被称为别名（aliases）。下面的代码片段更好地说明了这种情况：\n\
  \n```cpp\nint *p = new int[10], *y = x; // y 是 x 的别名\n```\n\n\n\n\n```cpp\n// ...\n\
  \n// 对 x 和/或 y 进行一些操作\n\n// ...\n\ndelete [] x; // 释放 x 的内存\n\n// ...\n\n// 执行其他操作\n\
  \n// ... delete [] y; // 逻辑错误，y 的内存已经释放！\n```\n\n由于指针 `x` 和指针 `y` 指向同一块内存，因此 `x`\
  \ 和 `y` 是互为的别名。如果你释放了其中一个所引用的内存，那么另一块内存也会被释放，因为它们是同一块内存。\n\n当使用 `delete` 释放之前的内存后，不应再次访问它们。当你尝试访问已删除的内存时，会导致未定义行为，这代表了一个逻辑错误。\n\
  \n```cpp\nint *list = new int[10]; // ... // 使用 list，然后\n\n// ... delete [] list;\n\
  \n// 释放 list 的内存\n\n// ... // 一段时间之后\n\n// ... int x = list[2]; // 逻辑错误，但有时有效！\n\
  ```\n\n上面的代码段说明了这种情况是如何产生的。出于效率考虑，`delete` 运算符会将堆空间标记为可用，而不会修改内存中的内容。\n\n## 资源管理\n\
  \n程序员在完成链表对象的操作后，调用 `clear` 是至关重要的。请看以下定义：\n\n```cpp\nvoid x() {\n    IntList1 my_list;\
  \ // 在此处调用构造函数 // 向列表添加一些数字\n    my_list.insert(12);\n    my_list.insert(7);\n \
  \   my_list.insert(-14); // 打印列表\n    my_list.print();\n} // 哎！忘记调用 my list.clear!！\n\
  ```\n\n在上面的代码中，变量 `my_list` 是函数 `x` 的局部变量。当函数 `x` 执行结束时，变量 `my_list` 将离开作用域。在此阶段，栈上为名为\
  \ `my_list` 的局部 `IntList1` 变量分配的空间会被回收。虽然在堆分配的元素空间仍然存在，但程序访问内存的唯一方式是通过 `my_list.head`，而\
  \ `my_list` 已经不存在了。这是一个经典的内存泄漏示例。注意，在我们目前为止设计的类中，除了 `IntList1` 之外没有类存在这个问题。然而，C++\
  \ 为类设计者提供了一种方法，可以指定对象生命周期结束时必须执行的操作。在对象存在初期执行代码的函数被称为析构函数。析构函数是一种在对象消失之前立即执行的特殊方法。析构函数的名字可以与其类相同，并带有波浪号\
  \ `~` 前缀。此外，析构函数不接受参数。代码 9.2 显示如何在代码中添加析构函数，以及之前建议的长度和 `clear` 方法优化。\n\n```cpp\n\
  // 代码 9.2\nclass Code9.2 {\n    // 之前的嵌套私有 Node 类\n    struct Node {\n        int\
  \ data; // 列表的数据元素\n        Node *next; // 列表中紧随其后的节点\n        Node(int d); // 构造函数\n\
  \    };\n\n    Node *head; // 指向列表的第一项\n    Node *tail; // 指向列表的项\n    int len;\
  \ // 列表中元素的数量\npublic:\n    // 构造函数创建一个初始为空列表\n    IntList2();\n\n    // 回收列表内存的析构函数\n\
  \    ~Code9.2(); // 将 n 插入列表末尾。\n    void insert(int n);\n\n    // 打印整数链表的内容。\n\
  \    void print() const;\n\n    // 返回链表的长度。\n    int length() const;\n\n    // 移除链表中的所有元素。\n\
  \    void clear();\n};\n```\n\n## 结论\n\n在引导你学习了十个最重要的 C++ 主题后，现在该由你来精进技能了。和任何语言一样，无论是英语、法语还是计算机语言，熟能生巧。我们在书中传授给你的知识仅相当于学习字母表和几个基础英语单词。因此，我们建议你多加练习。将你的思考集中在我们为什么要使用某些句子；以及我们希望实现的结果上。\n\
  \n去网上下载所有你认为易用的实用应用程序，如果必须为它们付钱，就付钱吧。一旦你准备好了一切，就找一个项目并开始学习。你可以创建一个自己的小项目，也可以尝试模仿一个已经创建的项目。如果你遇到瓶颈，可以随时回去查看程序员是如何创建并继续该项目的。但在检查之前，始终务要尝试将自己推向极限，并进行真正的思考。\n\
  \n阅读其他优秀的书籍对你也将大有益益，这让你对 C++ 的某些部分获得多样化的视角，从而提高对它的理解。尽管我们可以告诉你，这本书的质量将带你走上 C++ 成功的正确道路，但我们敦促你也阅读关于该编程语言的其他书籍。\n\
  \n除了 C++ 之外，你也可以考虑学习一种其他语言。学习新语言是深入理解 C++ 的有效技术。学习新语言会让你对通用编程语言有更全面的理解。它还能拓宽你的解决问题思维，挖掘出\
  \ C++ 语言的细微差别。即使你不使用这种新语言来编写 C++ 代码，它也会让你接触到可以应用于 C++ 的成熟概念。Haskell 是一种我们建议你与 C++\
  \ 一起学习的编程语言。你也可以学习 Java，因为它比 C++ 更接近日常英语，对你来说更容易理解。你也可以看看我们的 Java 书。\n\n"
