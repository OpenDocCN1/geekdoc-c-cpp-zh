  \ `%x` 是因为内存地址是以十六进制表示的。\n\n要创建一个指针，我们使用解引用运算符 `*`，这这将创建一个用于存储内存地址的指针变量。下面是一个程序，它创建了一个指针并使用引用操作符\
  \ `&` 将另一个普通变量的地址存储在新创建的指针中。解引用运算符 `*` 也用于访问或更改该内存位置中的实际数据。\n\n*   解引用运算符 `*` 用于创建指针，在更改实际值时也会使用。\n\
  *   引用操作符 `&` 在获取指针的内存地址时使用。\n\n```c\n//普通变量 int var = 10; //指针 int* pointer;\n\
  //将 var 的内存地址存储在指针 pointer = &var;\n//指针现在实际上是 'var'，所以\n//可以发生此类操作\n*pointer =\
  \ 20;\nprintf(\"Var's value is now: %d\", var);\n```\n\nOutput:\n>Var 的值现在是: 20\n\
  \n## NULL 指针\n\n当你创建一个指针时，它最初没有被赋予任何要指向的内容，这是危险的，因为指针在创建时会引用随机内存，更改该内存位置中的数据可能会导致程序崩溃。为了防止这种情况，当我们创建一个指针时，我们像这样将其赋值为\
  \ `NULL`：\n\n![](img/image.016.jpeg)\n\n```c\nint* pointer = NULL;\n```\n这意味着 NULL\
  \ 指针没有指向任何内容。\n\n## 使用指针\n\n创建一个指针时，指针是可以检查的地址。如果指针不是 `NULL`，它就是有效的。\n\n指针可以作为参数传递。如果指针不是\
  \ `NULL`，意味着指针是有效的。示例如下所示：\n\n```c\nvoid ChangeValue(int* ptr)\n{\n    //更改内存位置的值\n\
  \    *ptr = 20;\n}\n\nint main()\n{\n    int var = 10;\n    int* ptr = &var;\n \
  \   //传递指针\n    printf(\"Var 的值现在是: %d\\n\", var);\n    ChangeValue(ptr);\n    printf(\"\
  Var 的值现在是: %d\\n\", var);\n    return 0;\n}\n```\n\nOutput:\n>Var 的值现在是: 10\n>Var\
  \ 的值现在是: 20\n\n## 指针算术\n\n指针在某些情况下，移动指针到另一个内存位置是有用的；这就是指针算术的应用。指向数组第一个元素的指针的示例如下：\n\
  \n```c\nint arrayInt[] = { 10, 20, 30 };\nsize_t arrayInt_Size = 3;\nint* ptr =\
  \ arrayInt;\nfor (int i = 0; i < arrayInt_Size; i++)\n{\n    //获取内存位置中的值\n    printf(\"\
  arrayInt[%d] = %d\\n\", i, *ptr);\n    ptr++;\n}\n```\n\nOutput:\n>arrayInt[0] =\
  \ 10\n>arrayInt[1] = 20\n>arrayInt[2] = 30\n\n这显示指向数组地址的指针可以递增（记住数组的每个值存储在相邻的内存位置）。你可以执行相反的操作并递减指针，即让指针的值减小。\n\
  \n还可以使用关系运算符如 `==`、`<` 和 `>` 来比较指针。常用的用途是检查两个指针是否指向同一个位置：\n\n```c\nint value;\n\
  //为 ptr1 和 ptr2 赋值相同的值\nint* ptr1 = &value;\nint* ptr2 = &value;\n//ptr3 被赋值为另一个值\n\
  int* ptr3 = NULL;\nif (ptr1 == ptr2)\n{\n    printf(\"ptr1 和 ptr2 相等!\\n\");\n}\n\
  if (ptr1 != ptr3)\n{\n    printf(\"ptr1 与 ptr3 不相等\\n\");\n}\n```\n\n这检查了各种指针是否相等。使用\
  \ `>` 和 `<` 也可以这样做。\n\n## 函数指针\n\n就像你可以对变量这样做的那样，你也可以对函数执行这样做；下面的代码片段展示了如何定义函数指针。关键部分将高亮显示：\n\
  \n```c\nvoid printAddition(int value1, int value2)\n{\n    int result = value1 +\
  \ value2;\n    printf(\"结果是: %d\", result);\n}\n\nint main()\n{\n    //函数指针定义\n\
  \    //<返回类型>(*<名称)(<参数>)\n    void(*functionPtr)(int, int);\n    functionPtr =\
  \ &printAddition;\n    //调用指针函数 (*functionPtr)(100, 200);\n    functionPtr(100,\
  \ 200);\n    return 0;\n}\n```\n\n\n\n\n我们之前提到过这一点，全局变量是一个未定义在作用域内的变量，因此可以在任何地方使用。外部变量是指定义在另一个位置（如另一个文件）的变量，而\
  \ `extern` 关键字用于表示该变量在另一个文件中。你可以通过在文件顶部放置以下内容来引用另一个文件：\n\n```cpp\n#include \"FileName.c\"\
  \n```\n\n这是为了告诉程序也引用此文件。注意，文件需要位于同一个位置。\n\n### 程序 1 [File_2.c]\n\n```cpp\n#include\
  \ <stdio.h> #include \"C_TUT.c\" int main() { extern int globalValue; printf(\"\
  The global variable is: %d\", globalValue); }\n```\n\n### 程序 2 [C_TUT.c]\n```cpp\n\
  #include <stdio.h> int globalValue = 1032;\n```\n\n运行 File_2.c 的输出：\n\n> global\
  \ variable is: 1032\n\n这显示 `globalValue` 是从 `C_TUT.c` 中引用的，并通过 `extern` 关键字在另一个文件中使用的。\n\
  \n我们在教程的基础部分提到过递归，再次强调，递归是指函数任务对自身的定义。正如我所承诺的，下面还有几个关于递归的示例：\n\n```cpp\nint factorial(int\
  \ x) {\n    int r;\n    // 停止条件如果 (x == 1) {\n        // 有结论，所以循环停止 return 1;\n\
  \    }\n    else {\n        // 递归定义 return r = x * factorial(x - 1);\n    }\n}\n\
  int main() {\n    puts(\"Please enter a number: \");\n    // 读取用户输入 int a, b; scanf(\"\
  %d\", &a); // 开始执行 b = factorial(a); printf(\"The factorial is: %d\", b);\n}\n```\n\
  \n这是一个世界著名的递归示例，用于计算数字的阶乘（3 的阶乘是 3x2x1）。它通过上面的递归返回语句工作；它通过一个不包含递归定义的返回语句来停止，即当 `x\
  \ = 1` 时，函数直接返回 1；这意味着栈可以回溯并找到答案。下面是一个流程图：\n\n![](img/image.018.jpeg)\n\n## 递归\n\
  \n递归是一个困难的概念，在这里将简单提及，其在实际的应用和功能将在高级章节中解释。\n\n递归是涉及自身引用的函数命令定义，是的，这非常困惑，我明白，但我将用一些例子来解释。\n\
  \n```cpp\nconst int maxLoops = 5;\nvoid Sequence(int previous, int now, size_t loopCount)\
  \ {\n    // 计算下一个值 int next = previous + now;\n    // 打印新值 printf(\"New value: %d\\\
  n\", next);\n    // 计数 loopCount++;\n    // 停止条件以确保不会发生无限循环如果 (loopCount < maxLoops)\
  \ {\n        // 递归调用\n        Sequence(now, next, loopCount);\n    }\n}\nint main()\
  \ {\n    Sequence(1, 1, 0);\n}\n```\n\n输出：\n\n> New value: 2\n> New value: 3\n>\
  \ New value: 5\n> New value: 8\n> New value: 13\n\n有几点需要注意，缺乏迭代循环，递归在本质上导致了循环。第二个需要注意的是被标记为“停止条件”的\
  \ if 语句，如果递归设置没有停止循环的条件，它们将无限循环，因此这是有效使用递归的关键元素。\n\n# 第 6 章：STL 容器和迭代器\n\n![](img/image.019.jpeg)\n\
  \n### 容器\n\n容器是 STL 的主要贡献，用于存放和访问对象序列。STL 提供了不同类型的容器，例如 `vector`、`list`、`map` 和哈希表。然而，根据数据排列的特征，STL\
  \ 容器分为三个部分：\n\n1. 序列容器，如 `vector`、`固定大小数组`、`list`、`forward_list` 和 `deque`；\n2.\
  \ 关联容器：\n    a) 有序（排序）关联容器，如 `set`、`multiset`、`map` 和 `multimap`；\n    b) 无序（未排序）关联容器，如\
  \ `unordered_set`、`unordered_multiset`、`unordered_map` 和 `unordered_map`；\n3. 容器适配器，如\
  \ `stack`、`queue` 和 `priority_queue`。\n\n除了这些，C++ 还提供了三种特殊容器：`string`、`内置` 和 `valarray`。\n\
  \n每个容器都有默认构造函数、带参数的构造函数、拷贝构造函数、赋值运算符和析构函数。除此之外，大多数容器都定义了自己的迭代器。\n\n### 容器迭代器\n\n\
  在这些部分中，每个容器都提供自己的迭代器。在迭代器的五类分类中，每个容器定义了以下任意一种：\n\n**前向迭代器 (Forward iterators)：**\n\
  * 可以读；\n* 可以写；\n* 可以在单个位置重复；\n* 可以向前移动 (`++`)，但不能向后移动，因此名为前向迭代器；以及\n* 用于：无序关联容器和\
  \ `forward_list`。\n\n**双向迭代器 (Bidirectional iterator)：**\n* 与前向迭代器相同，但它也可以向后移动（`++`\
  \ 还有 `--`），因此名为双向；以及\n* 用于容器：`list`、`set`、`map`、`multiset` 和 `multimap`。\n\n**随机访问迭代器\
  \ (Random access iterator)：**\n* 与双向迭代器相同，但它可以跳转（`+=N` 或 `-=N`），而不是（`+=1` 或 `-1`，其中\
  \ `+=1` 是 `++`，`-1` 是 `--`），因此名为随机访问迭代器（跳转迭代器）；以及\n* 用于容器：`vector`、`string`、`deque`\
  \ 和 `array<T,N>`。\n\n除了帮助容器中的 STL 算法外，迭代器有助于执行容器的内部操作（成员函数）。某些内部操作适用于所有的序列关联容器，它们是：\n\
  \n**O(1)：**\n`begin()`、`end()`、`cbegin()`、`cend()`、`rbegin()`、`rend()`、`crbegin()`、`crend()`、`empty()`、`swap()`、`size()`、`max_size()`、`shrink_to_fit()`、`emplace()`\
  \ 和 `emplace_back()`。\n\n**O(n)：**\n赋值运算符 `=`，关系运算符：`!=`、`==`、`<`、`<=`、`>`、`>= 以及\
  \ `clear()`。\n\n**O(variable)：**\n* 插入、删除导入（在节点容器中很快，在连续内存容器中较慢）；\n* 构造函数（通常，类的组合具有常数复杂度，但所有其他构造函数和析构函数可能具有线性复杂度）。\n\
  \n**注意：**\na) `forward_list` 和无序关联容器使用前向迭代器，因此它们没有反向迭代器操作：`emplace_back()`、`rbegin()`、`rend()`、`crbegin()`\
  \ 和 `crend()`。\nb) 关联容器支持反向迭代器，但它们不支持 `emplace_back()`。这是因为关联容器按排序顺序保持元素，所以它们不接受\
  \ `emplace_back()` 命令，该命令坚持将新元素放在容器末尾。\n\n†前向列表：\n1. 不支持 `size()` 运算符；\n\n\n\n\n\
  \n### 2. 相比于 `insert()`、`erase()` 和 `emplace()`，它提供了 `insert_after()`、`erase_after()`\
  \ 和 `emplace_after()`。\n\n### 3. 在 `begin()`、`cbefore_begin()` 之前有特殊的迭代器，例如：\n\n\
  * 在正向列表中的操作：`my_fwd_list.insert_after` \n* `(my_fwd_list.before_begin(), inv_data.gold);`\
  \ 等同于列表中的以下操作：`my_list.insert`\n* `(my_list.begin(), inv_data.gold);`\n* **注意**：没有任何容器可以越界\
  \ `end()` 之后写入或读取，即：\n* `my_fwd_list.insert_after(my_fwd_list.end(), inv_data.gold);`\
  \ 是一个错误！\n\n‡ `shrink_to_fit()` 请求移除未使用的内存容量，它仅适用于 `vector`、`deque` 和 `string`。\n\
  \n†† 无序容器不支持关系运算符：`<`、`<=`、`>` 和 `>=`。\n\n![](img/image.020.jpeg)\n\n在上述运算符列表中，`O`\
  \ 代表复杂度。简而言，虽然复杂度意味着函数的时间和/或空间复杂度，但在容器中它是时间复杂度；\n\n* `O(1)` 代表常数时间复杂度；\n* `O(log\
  \ n)` 代表对数时间复杂度；\n* `O(n)` 代表线性时间复杂度；\n\n相比之下，`O(n) > O(log n) > O(1)`，这意味着 `O(1)`\
  \ 是最快的操作；注意：这些是预期或平均复杂度，而标准库文档对某些运算符引用了最坏情况复杂度。\n\n有少数容器不支持迭代器，它们是：容器适配器、`bitset`\
  \ 和 `valarray`。**注意**：C++11 为 `valarray` 定义了迭代器 `begin()` 和 `end()`。\n\n### STL\
  \ 迭代器\n\n迭代器、容器和算法是惠普罗派克公司的 Alexander Stepanov 等人在 20 世纪 90 年代初的标准模板库的组件，随后在标准库中进行了合并和改进。\n\
  \n迭代器是特殊指针的抽象，用于对给定容器（如 `vector`、`map` 和用户自定义容器类）的元素进行解引用。\n\n每个容器类都包含用于生成迭代器的成员函数，例如，成员\
  \ `begin()` 和 `end()` 分别返回指向第一个元素和最后一个元素之后元素的迭代器。\n\n下图描绘了迭代器 `*it` 与其容器 `vector<int>data\
  \ {1111, 1134, 1134, 1124, 1124, 1134, 1111, 1176, 1124, 1134, 1176}` 之间的关系。\n\n\
  然后，迭代器可以在算法操作（如 `sort`、`accumulate` 和自定义算法函数）中包含容器的元素。换句话说，迭代器将容器与算法关联起来。\n\n最常用的迭代器来自\
  \ `begin()` 和 `end()`。如下所示：\n\n如图所示，`data[0]` 和 `data.begin()` 代表同一个元素，即 `elem 1`，但\
  \ `data[N]` 和 `data.end()` 代表一个“无人区”，访问它会导致运行时错误。然而，成员函数 `end()` 在迭代语句中构造条件时非常有用。\n\
  \n以下代码说明了迭代器的这一基本属性：\n\n```cpp\n// iterators.cpp\n\n#include \"..\\..\\my_essentials.hpp\"\
  \ \nvoid illustrate_iterators()\n{\nint arr[] = {1111, 1134, 1134, 1124, 1124, 1134,\
  \ 1111, 1176, 1124, 1134, 1176}; \nvector<int>data(arr, arr+ sizeof(arr)/sizeof(arr[0])\
  \ );\n\n// vector<int>data2{1111, 1134, 1134, 1124, 1124, 1134, 1111, 1176, 1124,\
  \ 1134, 1176}; \n// fine with gcc4.7.0 \ncout << \"\\n Illustration of iterators:\
  \ \\n\" << \"\\n Given vector: data =\\n\\t( \";\n\nfor(auto element: data) // 'the\
  \ range-based for' do not work with VC10.\n cout << element << \"; \"; cout << \"\
  )\\n\\n Let us define an iterator, say *it for this vector.\\n\";\nvector<int>::iterator\
  \ it = data.begin();\n\n/*\nNote:\n在 STL 容器中，每个容器模板类定义了自己的迭代器成员类， \n所以 vector<int>::iterator\
  \ 与 list<int>::iterator 是不同的。\n*/ \ncout << \" Thus,\\t\\t*it = \" << *it << \"\
  \ that is data[0]\\n Iterators can be incremented, i.e, ++it;\\n\";\n\n++it; cout\
  \ << \" After ++\\t*it = \" << *it << \" that is data[1]\\n\";\n```\n\n上述程序演示了迭代器结合容器数据的用处。\n\
  \n正如我们看到的，迭代器可以用于打印容器的内容，因此我们在头文件 `my_essentials.hpp` 中编写与容器无关的代码。这对于单类型容器 `vector<T>`、`list<T>`、`set<T>`、`multiset<T>`、`deque<T>`\
  \ 以及固定大小的 `array<T,N>` 适用，但对于双类型容器 `map<T1,T2>` 和 `unordered_multimap<T1,T2>` 则不适用。\n\
  \n```cpp\n//-------------------------------\n// 容器无关的打印代码\n// 单类型 template<typename\
  \ container> void cout_container(const std::string& message, const container& data)\n\
  \n{ cout << message << \"{\"; if(data.empty()){cout << \"NULL}\"<<endl; return;\
  \ }\n\n auto start = data.begin(); auto end = data.end(); while(true)\n\n { cout\
  \ << *start;\n\n ++start; if(start != end) cout << \", \"; else{cout << '}' << endl;\
  \ break; }\n\n }\n```\n\n\n\n\n让我们将此模板添加到 `my_essentials.hpp` 中，并使用以下代码测试该模板。\n\n\
  然后，让我们测试这个模板：\n\n```cpp\n// cout_containers.cpp\n\n#include \"..\\..\\my_essentials.hpp\"\
  \n#include <array>\n#include <vector>\n#include <unordered_set>\n#include <forward_list>\
  \ \n#include <set> \nint main()\n{\n // 让我们定义， // 一个固定大小的数组 array<int,6> arr = {1,3,5,1,2,4};\
  \ cout_container(\"my array\\t = \", arr);\n // 一个 vector vector<int> vec(arr.begin(),\
  \ arr.end()); cout_container(\"my vector\\t = \", vec);\n // 一个 forward_list forward_list<int>\
  \ f_lis(arr.begin(), arr.end()); cout_container(\"my forward_list\\t = \",f_lis);\n\
  \ // 一个 unordered_set unordered_set<int> u_set(arr.begin(), arr.end()); cout_container(\"\
  my unordered_set = \", u_set); // 一个 set 容器 set<int>se(arr.begin(), arr.end());\
  \ cout_container(\"my set\\t\\t = \", se); just_pause();\n}\n```\n\n输出结果：\n`my array\
  \ = {1, 3, 5, 1, 2, 4}`\n`my vector = {1, 3, 5, 1, 2, 4}`\n`my forward_list = {1,\
  \ 3, 5, 1, 2, 4}`\n`my unordered_set = {1, 3, 5, 2, 4}`\n`my set = {1, 2, 3, 4,\
  \ 5}`\n\n在我们实验了迭代器的一些应用后，现在我们在下表中总结了它们的操作。\n\n迭代器没有统一的定义，因此并不是所有的迭代器都能支持上述所有的操作。迭代器分为五类，即：\n\
  \n因此，通过这一主要讨论，我们发现指针及其对不同对象的解引用属性对迭代器和 STL 操作起着至关重要的作用。\n\n# 第 7 章：STL 算法\n\nSTL\
  \ 算法位于 `<algorithms>` 头文件中，因此我们需要在程序中包含它。算法可以分类为：\n\n- 非修改性算法：例如 `for each`、`count`、`search`\
  \ 等。\n- 修改性算法：例如 `copy`、`transform` 等。\n- 删除算法：`remove`、`remove if` 等。\n- 变动算法：`reverse`、`rotate`\
  \ 等。\n- 排序算法：`sort`、`partial sort` 等。\n- 有序范围算法：`binary search`、`merge` 等。\n- 数值算法：`accumulate`、`partial\
  \ sum`、`inner product` 等。\n\n示例展示了 `sort()` 函数如何在数组上工作。\n\n## 程序 13.11：使用 sort 算法对数组排序\n\
  \n```cpp\n#include <iostream> \n#include <algorithm> \nusing namespace std; \nint\
  \ main()\n{ \n    int a[ ] = {3,5,7,2,9}; \n    sort(a, a + 5); \n    cout << \"\
  Sorted Array:\" << endl; \n    for (int i = 0; i <5; i++) cout << a[i] << \" \"\
  ;\n    return 0;\n}\n```\n\n输出：\n```\nSorted Array:\n2 3 5 7 9\n```\n\n在上面的示例中，当我们把数组名\
  \ `a` 作为参数传递时，我们是在告诉函数从数组的开头开始排序。如果我们希望从数组的第三个元素开始排序，可以使用 `sort(a+3, a+5);`。\n\n\
  我们使用 `a+5` 作为第二个参数，这指定我们想要排序到数组的最后一个元素。\n\n现在，类似的 `sort()` 函数可以在 `vector` 容器上工作，如下面的程序所示。这说明\
  \ STL 算法是通用的。\n\n## 程序 13.12：使用 sort 算法对 vector 排序\n\n```cpp\n#include <iostream>\n\
  #include <algorithm> \n#include <vector> \nusing namespace std; \nint main()\n{\
  \ \n    int a[ ] = {5,3,7,6,2,9}; \n    vector<int> v(a, a+6) ; \n    sort(v.begin(),\
  \ v.end()); \n    for (int i = 0; i != v.size(); i++) cout << v[i] << \" \"; \n\
  \    cout << endl; \n    return 0;\n}\n```\n\n输出：\n```\n2 3 5 6 7 9\n```\n\n你可以看到，排序函数的工作方式与对数组几乎相同。`sort()`\
  \ 中的第一个参数接受一个指向第一个元素的迭代器（使用 `begin()`），因为它返回一个指向第一个元素的迭代器。因此，它将从 vector 的第一个元素开始排序。同样，`end()`\
  \ 返回一个指向容器中最后一个元素之后位置的迭代器。注意，`sort` 函数排序到第二个参数所指定的位置，但不包含该位置。\n\n### find() 和 count()\
  \ 算法\n\n`find()` 算法有助于从容器中查找特定值。`count()` 用于统计特定值在容器中出现的次数。\n\n## 程序 13.13：使用 find\
  \ 算法从 vector 中查找值\n\n```cpp\n#include <iostream>\n#include <algorithm> \n#include\
  \ <vector> \nusing namespace std; \nint main()\n{\n    vector<int> v; \n    for(int\
  \ i = 0; i < 10; i++) v.push_back(i); \n    int a = 5; \n    vector<int>::iterator\
  \ it; \n    it = find(v.begin(),v.end(),a); \n    if(it != v.end()) {\n        cout\
  \ << \"found \" << a<< endl;\n    } else {\n        int c = count(v.begin(),v.end(),a);\n\
  \        cout<<\"could not find \" << a;\n    } \n    return 0;\n}\n```\n\n\n\n\
  `iostream` 文件可能是所有 C++ 库文件中最常见且通用的文件。\n\n大多数 C++ 程序都会包含这个头文件。\n\n`iostream` 文件提供了大量的输入/输出函数以及其他的\
  \ I/O 流信息。\n\n例如，`cin` 和 `cout` 的数据和函数原型就在这里定义。\n\n## Note\n\nC++ 的 I/O 是在字节流中进行的，其中流简单来说就是字节的序列。\n\
  \n程序员可以使用许多变种的 C++ 库。而且，这些库源于多个来源。\n\n例如，某些库是随 C++ 应用程序开发软件一起提供的。\n\nC++ 函数库也可能由如设备驱动程序制造商、C++\
  \ 编程网站和公告板等来源提供。\n\n你最好的参考来源通常是你的 C++ 应用程序开发软件附带的手手册和帮助文件。\n\n还有许多参考书籍供选择，其中一些涵盖了特定的编译器。\n\
  \n## 库函数的使用\n\n为了演示标准库函数的使用，让我们考虑一个执行以下操作的程序：\n\n- 获取数字 -55 的绝对值：\n\n```cpp\n#include\
  \ <iostream> using namespace std; #include <cmath> void main(void)\n{\n cout <<\"\
  The absolute value of -55 is \"<<abs(-55)<< \"\\n\";\n}\n```\n\n- 计算 100 的平方根：\n\
  \n```cpp\ncout <<\"The square root of 100 is \"<<sqrt(100.0)<< \"\\n\";\n```\n\n\
  - 计算 10 的 5 次方：\n\n```cpp\ncout<<\"10 to the power of 5 is\"<<pow(10, 5)<< \"\\\
  n\";\n```\n\n每个计算结果都会输出到屏幕上。\n\n## Note\n\n此程序没有使用任何自定义函数。\n\n标准数学库包含了执行这三个计算所需的每个函数。\n\
  \n这些是：\n\n- `abs()`\n- `sqrt()`\n- `pow()`\n\n```cpp\n#include <iostream> using\
  \ namespace std; #include <cmath> void main(void)\n{\n cout <<\"The absolute value\
  \ of -55 is \"<<abs(-55)<< \"\\n\"; cout <<\"The square root of 100 is \"<<sqrt(100.0)<<\
  \ \"\\n\"; cout <<\"10 to the power of 5 is \"<<pow(10,5)<< \"\\n\";\n}\n```\n\n\
  编写此程序时首先要决定的是包含哪些头文件。\n\n为了调用 `abs()`、`sqrt()` 和 `pow()`，你需要在预处理器指令中包含头文件 `cmath`。\n\
  \n你还需要包含头文件 `iostream`，以便可以使用 `cin` 和 `cout` 语句。\n\n```cpp\n#include <iostream>\
  \ using namespace std; #include <cmath> void main(void)\n{\n cout <<\"The absolute\
  \ value of -55 is \"<<abs(-55)<< \"\\n\"; cout <<\"The square root of 100 is \"\
  <<sqrt(100.0)<< \"\\n\"; cout <<\"10 to the power of 5 is \"<<pow(10,5)<< \"\\n\"\
  ;\n}\n```\n\n## Note\n\n函数 `abs()` 也包含在 `stdlib.h` 头文件中。\n\n一旦你完成了预处理器指令，就可以开始编写\
  \ `main()` 代码了。\n\n```cpp\n#include <iostream> using namespace std; #include <cmath>\
  \ void main(void)\n{\n cout <<\"The absolute value of -55 is \"<<abs(-55)<< \"\\\
  n\"; cout <<\"The square root of 100 is \"<<sqrt(100.0)<< \"\\n\"; cout <<\"10 to\
  \ the power of 5 is \"<<pow(10,5)<< \"\\n\";\n}\n```\n\n这三个函数中的每一个返回值通过三个独立的 `cout`\
  \ 语句直接显示在屏幕上。\n\n你可以在 `cout` 语句中显示常量、数据类型和表达式值的组合，只要每个唯一项目都通过插入运算符（`<<`）隔开。\n\n\
  ```cpp\n#include <iostream> using namespace std; #include <cmath> void main(void)\n\
  {\n cout <<\"The absolute value of -55 is \"<<abs(-55)<< \"\\n\"; cout <<\"The square\
  \ root of 100 is \"<<sqrt(100.0)<< \"\\n\"; cout <<\"10 to the power of 5 is \"\
  <<pow(10,5)<< \"\\n\";\n}\n```\n\n在第一个 `cout` 语句中，显示的第一个值是一个常量字符串。\n\n然后，通过调用函数显示数学库函数\
  \ `abs()` 的返回值。\n\n```cpp\n#include <iostream> using namespace std; #include <cmath>\
  \ void main(void)\n{\n cout <<\"The absolute value of -55 is \"<<abs(-55)<< \"\\\
  n\"; cout <<\"The square root of 100 is \"<<sqrt(100.0)<< \"\\n\"; cout <<\"10 to\
  \ the power of 5 is \"<<pow(10,5)<< \"\\n\";\n}\n```\n\n`abs()` 函数计算作为其函数参数传递的整数的绝对值。该函数返回一个\
  \ `int` 类型的值。\n\n在例例中，参数是一个常量，而不是 `int` 类型的变量。\n\n```cpp\n#include <iostream> using\
  \ namespace std; #include <cmath> void main(void)\n{\n cout <<\"The absolute value\
