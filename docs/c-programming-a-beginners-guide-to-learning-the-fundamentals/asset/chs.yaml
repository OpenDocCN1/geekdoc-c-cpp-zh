  ID \"<<ID<<endl; \n        cout<<\"Name \"<<Name;\n    }\nprivate:\n    string city;\n\
  };\n\nclass Student:public Person { \npublic: \n    // 我们现在定义了一个可以设置 protected 属性值的函数\n\
