  \ 或 `short unsigned`。示例：`%hd` 或 `%hu`。\n2. `I`: `long int` 或 `long unsigned`，或 `double`（用于\
  \ `%f` 转换）。示例：`%ld`, `%lu`, 或 `%lf`。\n3. `L`: 要解析的值对于整数类型为 `long`，浮点类型为 `long double`。示例：`%Ld`,\
  \ `%Lu`, 或 `%Lf`。\n4. `*`: 告诉 `scanf()` 执行转换但不存储在任何地方。如果你想让 `scanf()` 跳掉某些数据但不想存储在任何地方，就使用这个；你不需要为\
  \ `scanf()` 提供该转换的参数。示例：`%*d`。\n\n`scanf(\"%c\" &c)` 将读取任何字符，包括空白字符。如果你想让 `scanf`\
  \ 跳过任何空白字符，可以在 `%c` 前加一个空格。\n\n```cpp\nwhile(true){\n    scanf(\"%c\",&c);\n   \
  \ //scanf(\" % c\",&c);\n    printf(\"you ␣  input: ␣  %d\" c);\n}\n```\n\n**输出：**\n\
  当你输入 `a(enter)` 时，输出将类似于 `you input: 97(a value)` `you input: 10(enter value)`\n\
  \n`cin>>c` 不读取空白字符（制表符、空格、换行）。如果你想从输入缓冲区读取它们，应该使用 `getchar()` 或 `cin.get()`；如果你想让用户输入他们的名字。\n\
  \n```cpp\nwhile(true){\n    cin>>c;\n    cout<<\"you ␣  input:\"<<c<<endl;\n}\n\
  ```\n**输出：**\n当你输入 `\" a(enter)\"` 时，输出类似于：you input: a。然后光标在此等待。\n\n使用 `cin>>`\
  \ 或 `scanf` 会在读取第一个空格后终止字符串。处理这种情况的最好方法是使用函数读取一行；\n\n### 读取单词和行：\n\n1. `scanf(%s,char_array)`\
  \ //`c`\n2. `cin>>char_array` 或 `;` //`c++`\n3. `cin>> str;`\n4. //`line`\n5. `Gets(char_array)`\
  \ //`c`\n6. `Fgets(char_array, n , FILE *)`\n7. `Cin.getline(char * ,int n)`\n8.\
  \ `Cin.get(char * ,int n)`\n9. `Std::getline(istream& is, string& str)`\n\n行 1：读取单词直到遇到空白字符。\n\
  行 7：推荐使用此方法以安全性。\n行 9：C++ 读取并丢弃换行符\n行 1：不读取换行符\n\n`Cin.read` 函数与 `cin.get` 具有相同的接口，但它不会向输入中追加空字符，它不是为键盘输入设计的，而是用于文件的二进制格式。\n\
  \n对于 C++，三个 `get`，两个 `getline`，其他使用 `>>`；\n\n### `cin.get(char)` 和 `int = cin.get()`\
  \ 区别：\n\n```cpp\nwhile(cin.get(c)) {\n    // 在读取循环中使用 cin.get(char)\n    cin.get()\
  \ != ’\\n’\n    // 使用 cin.get() 返回字符进行测试\n    cin.get()!= EOF\n}\n```\n行 7：当用于 `EOF`\
  \ 时，你必须使用 `int`，因为 `EOF` 可能无法用 `char` 类型表示。\n\n**混淆函数：** `cin.get` 和 `cin.getline`\
  \ 几乎是同一的。\n\n`Cin.get ( char* s, streamsize n, char delim );`\n`Cin.getline (char*\
  \ s, streamsize n, char delim );`\n`Istream& getline (istream& is, string& str);`\n\
  \n1. 对于每一行，如果你不知道最大长度，直接使用 `getline(cin, string)`。你不需要输入任何长度（如果你想避免内存分配，可以预留 `string`\
  \ 的长度）。\n2. `cin.get()` 不从输入流中丢弃 `delim`。然而，`cin.getline()` 会读取并丢弃换行符。（很容易记住，因为行是由换行符定义的）\n\
  3. 在 `cin.getline(char* s, int n)` 中，如果函数没有提取任何字符（换行符是一个字符），或者在已写入 `s` (n-1) 个字符后未找到\
  \ `delim` 字符，则设置 `failbit` 标志。注意，如果输入序列中紧随这些 (n-1) 个字符之后的字符正好是 `delim` 字符，它会被提取且不会设置\
  \ `failbit` 标志。\n4. 在 `.cin.get(char* s , int n)` 中，只有当函数没有提取任何字符时才会设置 `failbit`\
  \ 标志。\n5. `cin.get(char* s, n)` 比 `cin.getline` 更灵活。因为当读取到数组满时，它不会设置 `failbit`。此时你可以使用\
