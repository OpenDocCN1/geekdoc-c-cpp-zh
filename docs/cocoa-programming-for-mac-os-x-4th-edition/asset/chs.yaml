  {\n  // 准备切换到行 \"rowIndex\"\n}\n```\n\n## 实现代理时的常见错误\n\n人们在实现代理时有两种非常常见的错误：\n\n\
  - **拼错方法名称**：该方法将不会被调用，且编译器不会报错。避免此问题的最佳方法是从文档中复制粘贴声明。\n- **忘记设置代理输出**：如果你犯了这种错误，编译器不会给出错误或警告。\n\
  \n## 许多对象拥有代理\n\n代理模式是 Cocoa 中常用的设计模式。以下是具有 `delegate` 的 AppKit 类：\n\n- `NSAlert`\n\
  - `NSAnimation`\n- `NSApplication`\n- `NSBrowser`\n- `NSDatePicker`\n- `NSDrawer`\n\
  - `NSFontManager`\n- `NSImage`\n- `NSLayoutManager`\n- `NSMatrix`\n- `NSMenu`\n\
  - `NSPathControl`\n- `NSRuleEditor`\n- `NSavePanel`\n- `NSound`\n- `NSpeechRecognizer`\n\
  - `NSSpeechSynthesizer`\n- `NSplitView`\n- `NSTableView`\n- `NSTableView`\n- `NSText`\n\
  - `NSTextField`\n- `NSTextStorage`\n- `NSTextView`\n- `NSTokenField`\n- `NSToolbar`\n\
  - `NSWindow`\n\n### 给好奇的读者：代理是如何运作的\n\n代理不需要实现所有方法，但如果对象实现了某个代理方法，它就会被调用。在许多语言中，这种事情是不可能的。在\
  \ Objective-C 中是如何实现的呢？\n\n`NSObject` 有以下方法：\n\n`(BOOL)respondsToSelector:(SEL)aSelector`\n\
  \n由于每个对象都直接或间接继承自 `NSObject`，因此每个对象都有这个方法。如果对象拥有名为 `aSelector` 的方法，它将返回 `YES`。\n\
  \n想象一下，你是编写 `NSTableView` 的工程师。你正在编写将选择从一行更改到另一行的代码。你想想：“我应该询问一下代理。”为了这样做，你添加了这样一段代码片段：\n\
  \n```\n// 准备切换到行 \"rowIndex\"\n// 设置默认行为\nBOOL ok = YES;\n```\n\n\n\n\n```objc\n\
  // Check whether the delegate implements the method\nif ([delegate respondsToSelector:@selector(tableView:shouldSelectRow:)])\
  \ {\n    // Execute the method\n    ok = [delegate tableView:self shouldSelectRow:rowIndex];\n\
  }\n\n// Use the return value\nif (ok) {\n    ...actually change the selection...\n\
  }\n```\n\n注意，只有当代理实现了该方法时，才会向其发送消息。如果代理没有实现该消息，则会发生默认行为。（在实际上，`respondsToSelector:`\
  \ 的结果通常会被带有 `delegate` outlet 的对象缓存。这使得性能比代码所暗示的要快得多。）\n\n在写完这个方法后，你应该在你的类文档中仔细地记录它的存在。\n\
  \n如果你想查看对代理方法存在的检查，可以在你的代理对象中重写 `respondsToSelector:`：\n\n```objc\n- (BOOL)respondsToSelector:(SEL)aSelector\n\
  {\n    NSString *methodName = NSStringFromSelector(aSelector);\n    NSLog(@\"respondsToSelector:%@\"\
  , methodName);\n    return [super respondsToSelector:aSelector];\n}\n```\n\n你现在可能想尝试将此方法添加到\
  \ `AppController.m` 中。\n\n### 挑战：制作一个代理\n\n创建一个只有一个窗口的新应用程序。创建一个作为该窗口代理的对象。当用户调整窗口大小时，确保窗口的高度始终是其宽度的两倍。\n\
  \n这里是你将实现的代理方法的签：：\n\n```objc\n- (NSSize)windowWillResize:(NSWindow *)sender\n \
  \           toSize:(NSSize)frameSize;\n```\n\n第一个参数是正在调整大小的窗口。第二个参数是一个包含用户请求尺寸的\
  \ C 结构体：\n\n```objc\ntypedef struct _NSSize {\n    float width;\n    float height;\n\
  } NSSize;\n```\n\n以下是创建一个宽 200 磅、高 100 磅 `NSSize` 的方法：\n\n```objc\nNSSize mySize\
  \ = NSMakeSize(200.0, 100.0);\nNSLog(@\"mySize is %f wide and %f tall\", mySize.width,\
  \ mySize.height);\n```\n\n你可以在 Interface Builder 的 Size Inspector 中设置窗口的初始大小。\n\n\
  ### 挑战：制作一个数据源\n\n制作一个待事项列表应用程序。用户将在文本字段中输入任务。当用户点击 Add 按钮时，你把字符串添加到可变数组中，新任务将出现在列表末尾。\n\
  \n**图 6.11.** 挑战框图\n\n![Image](img/00086.jpg)\n\n当新字符串被添加到数组时，你需要向表格视图发送 `reloadData`\
  \ 消息才能看到它。\n\n让表格视图变得可编辑可以让你获得额外分。（*提示：* `NSMutableArray` 有一个方法 `replaceObjectAtIndex:withObject:`）\n\
  \n## 第 7 章 键值编码与键值观察\n\n键值编码（或 KVC）是一种机制，允许你通过名称来设置和获取变量的值。该名称只是一个字符串，但我们将该名称称为*键*（key）。例如，假设你有一个名为\
  \ `Student` 的类，它有一个类型为 `NSString` 的名为 `firstName` 的实例变量：\n\n```objc\n@interface\
  \ Student : NSObject\n{\n    NSString *firstName;\n}\n@ends\n```\n\n如果你有一个 `Student`\
  \ 的实例，你可以这样设置它的 `firstName`：\n\n```objc\nStudent *s = [[Student alloc] init];\n\
  [s setValue:@\"Larry\" forKey:@\"firstName\"];\n```\n\n你可以这样读取它 `firstName` 的值：\n\
  \n```objc\nNSString *x = [s valueForKey:@\"firstName\"];\n```\n\n`setValue:forKey:`\
  \ 和 `valueForKey:` 方法定义在 `NSObject` 中。我们知道：这看起来不像什么深奥科技，但事实证明通过名称读取和设置变量的能力是非常强大的。本章的其余部分将通过一个简单的示例来展示这种力量。\n\
  \n### 键值编码\n\n在 Xcode 中，创建一个类型为 Cocoa Application 的新项目。将项目命名为 `KvcFun`。在 `KvcAppDelegate.h`\
  \ 中，为 `fido` 添加一个属性：\n\n```objc\n@interface KvcAppDelegate : NSObject <NSApplicationDelegate>\n\
  @property (assign, IBOutlet) NSWindow *window;\n@end\n```\n\n在 `KvcAppDelegate.m`\
  \ 中，你创建 `init` 方法：\n\n```objc\n- (id)init\n{\n    self = [super init];\n    if (self)\
  \ {\n        _fido = 0;\n    }\n    return self;\n}\n```\n\n如果你使用 `int`，键值编码机制将正常工作。在\
  \ `KvcAppDelegate.m` 中添加这些方法：\n\n```objc\n- (int)fido\n{\n    NSLog(@\"fido: %d\"\
  , _fido);\n    return _fido;\n}\n\n- (void)setFido:(int)x\n{\n    NSLog(@\"setFido:\
  \ %d\", x);\n    _fido = x;\n}\n```\n\n### 绑定（Bindings）\n\nCocoa 中的许多图形对象都有绑定。当你将一个键（例如\
  \ `fido`）绑定到对象的属性时，视图将自动保持它们同步。打开 `MainMenu.xib`，在窗口上拖入一个滑块，并将其值绑定到 `KvcAppDelegate`\
  \ 的 `fido` 键。\n\n### 键值观察（Key-Value Observing）\n\n如果 `fido` 被滑块以外的内容改变了什么？滑块如何知道它有了新值？\n\
  \n当滑块创建时，它告诉 `KvcAppDelegate` 它正在观察其 `fido` 键。每当通过访问方法或键值编码更改 `fido` 的值时，`KvcAppDelegate`\
  \ 都会向滑块发送消息，通知 `fido` 发生了变化。\n\n\n\n\n编译并运行应用。注意，当你移动滑动块时，会调用 `setFido:`。这会通知文本字段\
  \ `fido` 已经更改。文本字段使用 `valueForKey:` 来获取 `fido` 的新值。因此，你会看到 `fido` 方法被调用了。\n\n###\
  \ 使键可观察\n\n上一节提到，当你使用访问器方法或键值编码（KVC）来更改键的值时，观察者会自动收到通知。如果你直接修改变量会发生什么？\n\n打开 `KvcFunAppDelegate.h`\
  \ 并声明一个新的动作方法：\n\n> `incrementFido:sender`\n\n```objc\n- (IBAction)incrementFido:(id)sender;\n\
  ```\n\n在 `KvcFunAppDelegate.m` 中实现该方法：\n\n```objc\n- (IBAction)incrementFido:(id)sender\n\
  {\n    fido++;\n    NSLog(@\"fido is now %d\", fido);\n}\n```\n\n打开 `MainMenu.xib`。在窗口中添加一个按钮，将其标记为\
  \ Increment Fido，并从按钮 Control 拖拽到实例 `KvcFunAppDelegate`。该按钮应该触发 `incrementFido:`\
  \ 动作 (图 7.4)。\n\n**图 7.4.** 设置按钮的目标和动作\n\n![Image](img/00090.jpg)\n\n你可能希望点击按钮时，滑动块会移动且文本字段会自动更新。遗憾的是，这两者都没有发生。尝试编译并运行应用程序。\n\
  \n如果你打算直接更改变量，你需要显式地触发观察者的通知。更改 `incrementFido:` 方法：\n\n```objc\n- (IBAction)incrementFido:(id)sender\n\
  {\n    [self willChangeValueForKey:@\"fido\"];\n    fido++;\n    NSLog(@\"fido is\
  \ now %d\", fido);\n    [self didChangeValueForKey:@\"fido\"];\n}\n```\n\n现在编译并运行应用程序；Increment\
  \ Fido 按钮应该可以工作。\n\n还有两个可行的解决方案。首先，你可以使用键值编码：\n\n```objc\n- (IBAction)incrementFido:(id)sender\n\
  {\n    NSNumber *n = [self valueForKey:@\"fido\"];\n    NSNumber *npp = [NSNumber\
  \ numberWithInt:[n intValue] + 1];\n    [self setValue:npp forKey:@\"fido\"];\n\
  }\n```\n\n或者，你可以使用访问器方法来更改 `fido`：\n\n```objc\n- (IBAction)incrementFido:(id)sender\n\
  {\n    [self setFido:[self fido] + 1];\n}\n```\n\n输入这个版本。然后编译并运行它。\n\n图 7.5 是你所操作的对象图。注意，我们将使用半箭头来表示绑定。\n\
  \n**图 7.5.** 对象图\n\n![Image](img/00091.jpg)\n\n### 属性\n\n正如你所的，我们花费了大量时间调用访问器方法，以至于\
  \ Objective-C 为程序员提供了使用点符号表示（dot notation）来调用访问器的选项。如果你有一个指向具有 getter 方法 `rex` 的对象的指针\
  \ `rover`，你可以这样调用它：\n\n```objc\nNSLog(@\"Rover's rex is %@\", rover.rex);\n```\n\
  \n要调用 `setRex:`，你可以这样操作：\n\n```objc\nrover.rex = [NSDate date];\n```\n\nObjective-C\
  \ 程序员对于点符号表示是否是语言的一项良好改进持有不同意见。一些人认为它是语法糖，一种可以（危险地）掩盖消息发送（message sends）的特性，而消息发送的行为与在结构体中赋值并不相同。另一些人认为，它为语言带来的简洁性抵消了这些危险。为了清晰起见，我们在书中不会使用它。\n\
  \n那么编写访问器方法呢？如果你的对象有 12 个实例变量，你需要写 12 个 setter 和 12 个 getter 吗？\n\n属性提供了一种非常优雅的方法来消除大量代码。在\
  \ `KvcFunAppDelegate.h` 文件中，将 `fido` 和 `setFido:` 方法的声明替换为属性声明：\n\n```objc\n@interface\
  \ KvcFunAppDelegate : NSObject <NSApplicationDelegate> {\n    int fido;\n}\n@property\
  \ (assign) IBOutlet NSWindow *window;\n@property (readwrite, assign) int fido;\n\
  \n- (IBAction)incrementFido:(id)sender;\n\n@end\n```\n\n这一行等同于声明 `setFido:` 和 `fido`\
  \ 方法。\n\n在 `KvcFunAppDelegate.m` 中，你可以使用 `@synthesize` 来实现访问器方法。从 `KvcFunAppDelegate`\
  \ 中删除你的 `fido` 和 `setFido:` 方法。\n\n```objc\n@synthesize fido;\n```\n\n\n\n\n```objc\n\
  toObject:employeeController\nwithKeyPath:@\"arrangedObjects.@avg.expectedRaise\"\
  \noptions:nil];\n```\n\n当然，在 Interface Builder 中创建绑定通常更简单。\n\n使用 `unbind:` 方法移除绑定：\n\
  \n```objc\n[textField unbind:@\"value\"];\n```\n\n### 进阶更好奇的读者：键值观察（Key-Value Observing）\n\
  \n文本字段是如何成为 `KvcFunAppDelegate` 对象中 `fido` 键的观察者的？当它从 NIB 中唤醒时，它把自己添加为观察者。如果你想成为该键的观察者，你的代码可能像这样：\n\
  \n```objc\n[theAppDelegate addObserver:self\n                 forKeyPath:@\"fido\"\
  \n                   options:NSKeyValueChangeOldKey\n                   context:somePointer];\n\
  ```\n\n该方法定义在 `NSObject` 中。它是让你这样说：“嘿！每当 `fido` 变化时，请给我发消息。”options 和 context 决定了当\
  \ `fido` 变化时随消息一起发送的额外数据。被触发的方法看起来如下：\n\n```objc\n- (void)observeValueForKeyPath:(NSString\
  \ *)keyPath\n                     ofObject:(id)object\n                       change:(NSDictionary\
  \ *)change\n                       context:(void *)context\n{\n...\n}\n```\n\n在这种情况下，`keyPath`\
  \ 将为 `@\"fido\"`；`object` 将是 `KvcFunAppDelegate`；`context` 将是你成为观察者时作为上下文提供的指针 `somePointer`；`change`\
  \ 是字典（键值对集合），它可以保存 `fido` 的旧值和/或新值。\n\n## 第 8 章 NSArrayController\n\n在面向对象编程社区中，一种非常常见的设计模式是*模型-视图-控制器\
  \ (Model-View-Controller)*。这种设计模式认为，你写的每个类都应该恰好属于以下组别之一。\n\n1. **模型（Model）**类描述你的数据。例如，如果你在写银行系统，你可能会创建一个名为\
  \ `SavingsAccount` 的模型类，它有一个交易列表和一个当前余额。最好的模型类不包含任何关于用户界面的信息，并且可以在多个应用程序中使用。\n2.\
  \ **视图（View）**类是 GUI 的一部分。例如，`NSSlider` 就是一个视图类。最好的视图是通用类，可以在多个应用程序中使用。\n3. **控制器（Controller）**类通常是特定于应用程序的，负责控制应用的流。用户需要查看数据，因此控制器对象从文件或数据库读取模型，然后通过视图类显示模型。当用户做出更改时，视图对象会通知控制器，随后控制器更新模型对象。控制器还将数据保存到文件系统或数据库。\n\
  \n在 Mac OS X 10.3 之前，Cocoa 程序员在控制器对象中编写了大量代码，仅仅是将数据从模型对象移动到视图对象并反反之。为了让常见的控制器类更容易编写，Apple\
  \ 引入了 `NSController` 和绑定。\n\n`NSController` 是一个抽象类。`NSController` 的子类 `NSObjectController`\
  \ 显示对象的信息或内容。`NSArrayController` 是一个以数据对象数组作为内容的控制器。在练习中，我们将使用 `NSArrayController`。\n\
  \n**图 8.1.** 控制器类\n\n![Image](img/00093.jpg)\n\n### 启动 RaiseMan \n\n在接下来的章节中，你将创建一个功能完整的应用程序，用于跟踪员工以及每个人今年将获得的加薪。随着书籍的进展，你将添加文件保存、撤销、用户偏好和打印功能。在本章之后，该应用程序将像图\
  \ 8.2 所示。\n\n**图 8.2.** 完成的应用程序\n\n![Image](img/00094.jpg)\n\n（是的，丰富的 Cocoa 程序员可以使用\
  \ Core Data 创建这样的应用程序，但我们想看到如何手动完成。在 Xcode 中创建一个新项目。类型类型选择 Cocoa Application。将项目命名为\
  \ RaiseMan，将类前缀设置为 `RM`，并启用基于文档的应用程序（Document-Based Application）。将文档扩展设置为 `rman`，禁用\
  \ Core Data 并包含单元测试。）\n\n**图 8.3.** 新基于文档的项目\n\n![Image](img/00095.jpg)\n\n什么是*基于文档的\
  \ (document-based)*应用程序？它是可以打开多个文档的应用程序。例如，TextEdit 就是基于文档的应用程序。另一方面，系统设置（System\
  \ Preferences）并不是基于文档的应用程序。你将在第 10 章学习更多关于文档架构的知识。\n\n该应用程序的对象图如图 8.4 所示。列通过绑定而不是连接到\
  \ `NSArrayController`。这是一个基于单元的视图（cell-based view）；我们将在第 1 章讨论基于视图的视图（view-based\
  \ views）。\n\n**图 8.4.** 对象图\n\n![Image](img/00096.jpg)\n\n注意，类 `RMDocument` 已经为你创建好了。`RMDocument`\
  \ 是 `NSDocument` 的子类。文档对象负责读写。在练习中，我们将使用 `NSArrayController` 和绑定来构建我们的简单界面，所以我们暂时不会向\
  \ `RMDocument` 添加任何代码。\n\n要创建一个新的 `Person` 类，选择 `File -> New -> File...` 菜单项。出现选项时，选择\
  \ Objective-C class。将类命名为 `Person` 并将其设置为 `NSObject` 的子类，如图 8.5 所示。\n\n**图 8.5.**\
  \ 创建 Person 类\n\n![Image](img/00097.jpg)\n\n编辑 `Person.h` 文件声明两个属性：\n\n```objc\n\
  #import <Foundation/h>\n\n@interface Person : NSObject\n{\n    NSString *personName;\n\
  \    float expectedRaise;\n}\n@property (readwrite, copy) NSString *personName;\n\
  @property (readwrite) float expectedRaise;\n@end\n```\n\n现在编辑 `Person.m` 以合成这些属性并重写\
  \ `init`：\n\n```objc\n#import \"Person.h\"\n\n@implementation Person\n\n@synthesize\
  \ personName;\n@synthesize expectedRaise;\n\n- (id)init\n{\n    self = [super init];\n\
  \    if (self) {\n        expectedRaise = 0.05;\n        personName = @\"New Person\"\
  ;\n    }\n    return self;\n}\n\n@end\n```\n\n注意 `Person` 是一个模型类——它没有关于用户界面的信息。因此，该类不需要了解所有的\
  \ Cocoa 框架。因此，我们没有导入 `Cocoa/Cocoa.h`，而是导入了 `Foundation.h`。两种方法都可以，但导入较小的框架更有格。这表明该类可以在命令行工具或\
  \ iOS 应用程序中重用。\n\n在 `RMDocument.h` 中声明 `employees` 数组（它将包含 `Person` 类的实例）：\n\n```objc\n\
