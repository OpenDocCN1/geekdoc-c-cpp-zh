  \n构建并运行你的应用程序。点击列头对数据进行排序。再次点击查看反序数据。\n\n### 给更具好奇心的读者：不使用 NSArrayController 进行排序\n\
  \n在第 6 章中，你通过显式实现 `dataSource` 方法来填充表格视图（table view）。你当时可能好奇，如何在自己的应用程序中实现这种排序行为。\n\
  \n你添加到表格列中的信息被封装在一个 `NSSortDescriptor` 对象的数组中。一个排序描述符包含键（key）、选择器以及数据是否应按升序或降序排列的指示。如果你有一个包含对象的\
  \ `NSMutableArray`，你可以使用以下方法对其进行排序：\n\n```objc\n- (void)sortUsingDescriptors:(NSArray\
  \ *)sortDescriptors\n```\n\n当用户点击带有排序描述符的列头时，会触发一个可选的表格视图 `dataSource` 方法：\n\n```objc\n\
  - (void)tableView:(NSTableView *)tableView\n    sortDescriptorsDidChange:(NSArray\
  \ *)oldDescriptors\n```\n\n因此，如果你有一个持有表格视图信息的可变数组，你可以像这样实现该方法：\n\n```objc\n- (void)tableView:(NSTableView\
  \ *)tableView\n    sortDescriptorsDidChange:(NSArray *)oldDescriptors\n{\n    NSArray\
  \ *newDescriptors = [tableView sortDescriptors];\n    [myArray sortUsingDescriptors:newDescriptors];\n\
  \    [tableView reloadData];\n}\n```\n\n大搞定！你的应用程序中实现了排序。\n\n### 挑战 1\n\n让应用程序根据人名字中的字符数量对人员进行排序。你可以仅使用\
  \ Interface Builder 完成这个挑战——秘诀是使用键路径（key path）。（*提示*：字符串有一个 `length` 方法。）\n\n###\
  \ 挑战 2\n\n在本书的第一版版中，读者们在没有使用 `NSArrayController` 或绑定（bindings）机制的情况下创建了 RaiseMan\
  \ 应用程序。（这些功能是在 Mac OS X 10.3 中引入的。）为了做到这一点，读者使用了之前章节中的思想。那么，挑战在于在不使用 `NSArrayController`\
  \ 或绑定机制的情况下重写 RaiseMan 应用程序。绑定通常看起来很神奇，但了解如何在不诉诸魔法的情况下完成工作是很有用的。\n\n请务必从新项目重新开始——在下一章中，我们将基于你现有项目进行构建。\n\
  \n`Person` 类将保持不变。在 `RMDocument.xib` 中，你将每个列的标识符（identifier）设置为你想显示的变量名称（使用 Interface\
  \ Builder 中的 `Attributes Inspector`）。然后，`RMDocument` 类将成为表格视图的 `dataSource` 以及“创建新员工”和“删除”按钮的\
  \ `target`。`RMDocument` 将有一个用于显示的 `Person` 对象的数组。为了帮助你开始，这里是 `RMDocument.h`：\n\n\
  ```objc\n#import <Cocoa/Cocoa.h>\n@class Person;\n\n@interface RMDocument : NSDocument\n\
  {\n    NSMutableArray *employees;\n    IBOutlet NSTableView *tableView;\n}\n- (IBAction)createEmployee:(id)sender;\n\
  - (IBAction)deleteSelectedEmployees:(id)sender;\n@end\n```\n\n这里是 `RMDocument.m`\
  \ 中有趣的部分：\n\n```objc\n- (id)init\n{\n    self = [super init];\n    if (self) {\n\
  \        employees = [NSMutableArray array];\n    }\n    return self;\n}\n\n#pragma\
  \ mark Action methods\n\n- (IBAction)deleteSelectedEmployees:(id)sender\n{\n   \
  \ // 选中了哪行？\n    NSIndexSet *rows = [tableView selectedRowIndexes];\n\n    // 选择是否为空？\n\
  \    if ([rows count] == 0) {\n        NSBeep();\n        return;\n    }\n    [employees\
  \ removeObjectsAtIndex:rows];\n    [tableView reloadData];\n}\n\n- (IBAction)createEmployee:(id)sender\n\
  {\n    Person *newEmployee = [[Person alloc] init];\n    [employees addObject:newEmployee];\n\
  \    [tableView reloadData];\n}\n\n#pragma mark Table view methods\n\n- (NSInteger)numberOfRowsInTableView:(NSTableView\
  \ *)tableView\n{\n    return [employees count];\n}\n\n- (id)tableView:(NSTableView\
  \ *)tableView\n    objectValueForColumn:(NSTableColumn *)aTableColumn\n    row:(NSInteger)rowIndex\n\
  {\n    // 列的标识符是什么？\n    NSString *identifier = [aTableColumn identifier];\n\n \
  \   // 什么人？\n    Person *person = [employees objectAtIndex:rowIndex];\n\n    //\
  \ 属性的值是什么？\n    return [person valueForKey:identifier];\n}\n\n- (void)tableView:(NSTableView\
  \ *)tableView\n    setObjectValue:(id)anObject\n    forTableColumn:(NSTableColumn\
  \ *)aTableColumn\n    row:(NSInteger)rowIndex\n{\n    NSString *identifier = [aTableColumn\
  \ identifier];\n    Person *person = [employees objectAtIndex:rowIndex];\n\n   \
  \ // 为属性设置值\n    [person setValue:anObject forKey:identifier];\n}\n```\n\n一旦完成，确保添加排序！\n\
  \n## 第 9 章 NSUndoManager\n\n使用 `NSUndoManager`，你可以非常优雅地为应用程序添加撤销功能。当对象被添加、删除或编辑时，撤销管理器会跟踪撤销这些更改所需的消息。当你调用时，会跟踪重做这些更改所需的消息。这种机制通过利用两个\
  \ `NSInvocation` 栈来实现。\n\n在书早期介绍这个相当沉重的话题。（当我们考虑撤销时，头可能会开始晕。）然而，撤销与文档架构是有交互的。如果我们现在处理这项工作，你将在下一章中看到它是如何工作的。\n\
  \n### NSInvocation\n\n正如你所想象的，将消息（包括选择器、接收者和所有参数）封装成一个可以随时调用的对象是非常方便的。这样的对象是 `NSInvocation`\
  \ 的实例。\n\n调用的一个极其方便的用途是在消息转发中。当对象接收到它无法理解的消息时，在抛出异常之前，消息发送系统会检查对象是否实现了以下方法：\n\n\
  ```objc\n- (void)forwardInvocation:(NSInvocation *)x\n```\n\n如果对象有这样的方法，发送的消息将被封装为\
  \ `NSInvocation` 并调用 `forwardInvocation:`。\n\n### NSUndoManager 如何工作\n\n假设用户打开了一个新的\
  \ RaiseMan 文档并进行了三次编辑：\n\n1. 插入新记录\n2. 将名字从 `New Employee` 改为 `Rex Fido`\n3. 将工资从\
  \ 0 改为 20\n\n在执行每次编辑时，你的控制器会将一个撤销该编辑的调用添加到撤销栈中。为了简化表述，我们说：“编辑的*反向操作*被添加到撤销栈中。”\n\
  \n图 9.1 显示了在这些编辑后撤销栈看起来是什么样子。\n\n\n\n\n# 图 9.1. 撤销栈 (Undo Stack)\n\n![Image](img/00108.jpg)\n\
  \n如果用户现在选择“撤销”（Undo）菜单项，第一个调用将从栈中取出并执行。这将把该人的加薪恢复为零。如果用户再次选择“撤销”菜单项，该人的姓名将变回 `New\
  \ Employee`（新员工）。\n\n每当一个项目从撤销栈中弹出并执行时，必须将该撤销操作的反逆操作添加到重做（redo）栈中。因此，在撤销了上述两个操作后，撤销栈和重做栈应该如图\
  \ 9.2。\n\n## 图 9.2. 修改后的撤销栈\n\n![Image](img/00109.jpg)\n\n撤销管理器非常智能：当用户正在编辑时，撤销调用进入撤销栈。当用户正在撤销编辑时，撤销调用进入重做栈。当用户正在重做编辑时，撤销调用进入撤销栈。这些任务会自动为你处理；你唯一的工作就是给撤销管理器提供需要添加的反逆调用。\n\
  \n现在假设你正在编写一个名为 `makeItHotter`（变热）的方法，该方法的逆称为 `makeItColder`（变冷）。以下是启用撤销的方法：\n\n\
  ```objc\n- (void)makeItHotter\n{\n    temperature = temperature + 10;\n    [[undoManager\
  \ prepareWithInvocationTarget:self] makeItColder];\n    [self showTheChangesToTheTemperature];\n\
  }\n```\n\n正如你可能猜到的，`prepareWithInvocationTarget:` 方法记录 `target` 并返回撤销管理器本身。然后，撤销管理器巧妙地重写了\
  \ `forwardInvocation:`，将 `makeItColder:` 的调用添加到撤销栈中。\n\n为了完成示例，你需要实现 `makeItColder`：\n\
  \n```objc\n- (void)makeItColder\n{\n    temperature = temperature - 10;\n    [[undoManager\
  \ prepareWithInvocationTarget:self] makeItHotter];\n    [self showTheChangesToTheTemperature];\n\
  }\n```\n\n注意，我们再次向撤销管理器注册了逆操作。如果 `makeItColder` 是由于撤销而被调用的，那么这个逆操作将进入重做栈。\n\n两个栈上的调用是分组的。默认情况下，在单个事件期间添加到栈中的所有调用会被分在一起。因此，如果一个用户操作导致了多个对象的更改，只需点击一次“撤销”菜单项即可撤销所有更改。\n\
  \n撤销管理器还可以更改“撤销”和“重做”菜单项的标签。例如，“撤销插入”（Undo Insert）比简单的“撤销”更具描述性。要设置标签，使用以下代码：\n\n\
  ```objc\n[undoManager setActionName:@\"Insert\"];\n```\n\n如何获取撤销管理器？你可以显式地创建一个，但注意每个\
  \ `NSDocument` 实例都已拥有自己的撤销管理器。\n\n## 在 RaiseMan 中添加撤销\n\n让我们用户能够撤销点击“添加新员工”和“删除”按钮的影响，并能够撤销他们对表格中\
  \ `Person` 对象所做的更改。必要的代码将放入你的 `RMDocument` 类中。\n\n### 键值编码 (Key-Value Coding) 与一对多关系\n\
  \n在设计类时，将你的实例变量视为具有四种可能用途之一：\n\n1. **简单属性**。例如：每个学生都有名字。简单属性通常是数字或 `NSString`、`NSDate`\
  \ 或 `NSData` 的实例。\n2. **一对一关系 (To-one relationships)**。例如：每个学生都有一个学校。它像简单属性，但类型是一个复杂对象，而不是简单类型。一对一关系使用指针实现：`Student`\
  \ 实例拥有指向 `School` 实例的指针。\n3. **有序一对多关系 (Ordered to-many relationships)**。例如：每个播放列表都有一个歌曲列表。歌曲按照特定顺序排列。这通常使用\
  \ `NSMutableArray` 实现。\n4. **无序一对多关系 (Unordered to-many relationships)**。例如：每个部门有一群员工。你可以以特定顺序显示员工（例如按姓氏排序），但这种排序并不是该关系所固有的。这通常使用\
  \ `NSMutableSet` 实现。\n\n在此之前，我们讨论了如何使用键值编码设置简单属性和一对一关系。记住，在设置或获取 `fido` 的值时，如果存在访问器（accessors），KVC\
  \ 将使用它们。同样，我们可以为有序和无序一对多关系创建访问器。\n\n例如，假设 `Playlist` 实例拥有一个包含 `Song` 对象的 `NSMutableArray`。如果你想使用键值编码来操作该数组，你需要向播放列表请求它的\
  \ `mutableArrayValueForKey:`。你将得到一个代理对象。\n\n该代理对象知道它代表持有歌曲的数组。\n\n```objc\nid arrayProxy\
  \ = [playlist mutableArrayValueForKey:@\"songs\"];\n```\n\n在这个示例中，当被询问 `count` 时，代理对象会询问\
  \ `Playlist` 是否有一个 `countOfSongs` 方法。如果 `Playlist` 有，它就会返回结果。注意，将方法命名为 `countOfSongs`\
  \ 仅仅是一种约定；键值机制会寻找它。\n\n### 图 9.3. 有序关系的键值编码\n\n![Image](img/00110.jpg)\n\n有几种情况，这里是：\n\
  \n```objc\nid arrayProxy = [playlist mutableArrayValueForKey:@\"songs\"];\nint count\
  \ = [arrayProxy count];\n```\n\n### 图 9.4. 无序关系的键值编码\n\n![Image](img/00111.jpg)\n\
  \n```objc\nid setProxy = [teacher mutableSetValueForKey:@\"students\"];\nint count\
  \ = [setProxy count];\n```\n\n\n\n\n\n```objectivec\n// 将此操作的逆操作添加到撤销栈\nNSUndoManager\
  \ *undo = [self undoManager];\n[[undo prepareWithInvocationTarget:self]\nremoveObjectFromEmployeesAtIndex:index];\n\
  if (![undo isUndoing]) {\n    [undo setActionName:@\"Add Person\"];\n}\n\n// 将 Person\
  \ 添加到数组\n[employees insertObject:p atIndex:index];\n}\n\n- (void)removeObjectFromEmployeesAtIndex:(NSUInteger)index\n\
  {\n    Person *p = [employees objectAtIndex:index];\n    NSLog(@\"removing %@ from\
  \ %@\", p, employees);\n    // 将此操作的逆操作添加到撤销栈\n    NSUndoManager *undo = [self undoManager];\n\
  \    [[undo prepareWithInvocationTarget:self] insertObject:p\n    inEmployeesAtIndex:index];\n\
  \    if (![undo isUndoing]) {\n        [undo setActionName:@\"Remove Person\"];\n\
  \    }\n\n    [employees removeObjectAtIndex:index];\n}\n```\n\n当 `NSArrayController`\
  \ 想要插入或移除 `Person` 对象时，这些方法会被自动调用（例如，当“添加员工”和“删除”按钮向它发送 `insert:` 和 `remove:` 消息时）。\n\
  \n此时，你已经实现了撤销删除和插入。撤销编辑将稍微复杂一些。在处理此任务之前，请构建并运行你的应用程序。测试你目前拥有的撤销功能。注意，重做（redo）功能同样有效。\n\
  \n### 键值观察 (Key-Value Observing)\n\n在第 7 章中，我们讨论了键值编码。回顾一下，键值编码通过名称读取和更改值的方法*键值观察允许你在此类变化发生时获得通知。*\n\
  \n为了为编辑启用撤销功能，你需要让你的文档对象感知到所有 `Person` 对象中 `expectedRaise` 和 `personName` 键的变化。\n\
  \n`NSObject` 中的一个方法允许你注册以感知这些变化：\n\n```objectivec\n- (void)addObserver:(NSObject\
  \ *)observer\n             forKeyPath:(NSString *)keyPath\n             options:(NSKeyValueObservingOptions)options\n\
  \              context:(void *)context;\n```\n\n你提供应该被通知的对象作为 `observer`，以及你希望被通知发生变化的\
  \ `keyPath`。`options` 变量定义了你希望在收到变化通知时包含的内容。例如，你可以被告知旧值（更改之前）和新值（更改之后）。`context`\
  \ 变量是一个指向数据的指针，你希望与其余信息一起发送该数据。\n\n当变化发生时，观察者将接收到以下消息：\n\n```objectivec\n- (void)observeValueForKeyPath:(NSString\
  \ *)keyPath\n                     ofObject:(id)object\n                        change:(NSDictionary\
  \ *)change\n                      context:(void *)context;\n```\n\n观察者会被告知哪个对象中的哪个键路径发生了变化。这里，`change`\
  \ 是一个字典（取决于你注册为观察者时请求的选项），可能包含旧值和/或新值。当然，此方法会接收到注册为观察者时提供的 `context` 指针。\n\n####\
  \ 防御性地使用 Context 指针\n\n由于任何观察键值变化的对象都必须实现具有此特定选择器 `observeValueForKeyPath:ofObject:change:context:`\
  \ 的方法，因此可能会误拦截本属于另一个类的通知。\n\n考虑一个虚构类 `Maple`，它是虚构类 `Tree` 的子类。两个类都独立地观察键路径 `season`。除非开发者采取措施，否则\
  \ `Maple` 将接收到它的键值观察 (KVO) 消息*以及*那些目标给 `Tree` 的消息，因为 `Maple` 实际上重写了 KVO 方法。为了修复这个问题，`Maple`\
  \ 必须正确识别目标给自己的观察消息与目标给其父类的消息。如果消息不是目标给该特定类的，`Maple` 应该将消息传递给其父类。\n\n解决此问题的方法是使用类特定的指针值作为\
  \ `context` 参数。我们将在练习的后续步骤中使用这种方法，尽管在特定练习中并不是必须的。\n\n### 编辑的撤销\n\n第一步是注册你的文档对象以观察对\
  \ `Person` 对象的变化。在 `RMDocument.m` 顶部添加以下静态变量和方法：\n\n```objectivec\n// RMDocumentKVO\
  \ 允许此类区分\n// KVO 消息和目标给父类的消息。\nstatic void *RMDocumentKVOContext;\n\n- (void)startObservingPerson:(Person\
  \ *)person\n{\n    [person addObserver:self\n    forKeyPath:@\"personName\"\n  \
  \  options:NSKeyValueObservingOld\n    context:&RMDocumentKVOContext];\n\n    [person\
  \ addObserver:self\n    forKeyPath:@\"expectedRaise\"\n    options:NSKeyValueObservingOld\n\
  \    context:&RMDocumentKVOContext];\n}\n\n- (void)stopObservingPerson:(Person *)person\n\
  {\n    [person removeObserver:self\n    forKeyPath:@\"personName\"\n    context:&RMDocumentKVOContext];\n\
  \    [person removeObserver:self\n    forKeyPath:@\"expectedRaise\"\n    context:&RMDocumentKVOContext];\n\
  }\n```\n\n每当 `Person` 进入或离开文档时，调用这些方法：\n\n```objectivec\n- (void)insertObject:(Person\
  \ *)p inEmployeesAtIndex:(NSUInteger)index\n{\n    // 将此操作的逆操作添加到撤销栈\n    NSUndoManager\
  \ *undo = [self undoManager];\n    [[undo prepareWithInvocationTarget:self]\n  \
  \  removeObjectFromEmployeesAtIndex:index];\n    if (![undo isUndoing]) {\n    \
  \    [undo setActionName:@\"Add Person\"];\n    }\n\n    // 将 Person 添加到数组\n   \
  \ [self startObservingPerson:p];\n    [employees insertObject:p atIndex:index];\n\
  }\n\n- (void)removeObjectFromEmployeesAtIndex:(NSUInteger)index\n{\n    Person *p\
  \ = [employees objectAtIndex:index];\n    // 将此操作的逆操作添加到撤销栈\n    NSUndoManager *undo\
  \ = [self undoManager];\n    [[undo prepareWithInvocationTarget:self] insertObject:p\n\
  \    inEmployeesAtIndex:index];\n    if (![undo isUndoing]) {\n        [undo setActionName:@\"\
  Remove Person\"];\n    }\n    [self stopObservingPerson:p];\n    [employees removeObjectAtIndex:index];\n\
  }\n\n- (void)setEmployees:(NSMutableArray *)a\n{\n    for (Person *person in employees)\
  \ {\n        [self stopObservingPerson:person];\n    }\n\n    employees = a;\n\n\
  \    for (Person *person in employees) {\n        [self startObservingPerson:person];\n\
  \    }\n}\n```\n\n现在，实现执行编辑且自逆操作的方法：\n\n```objectivec\n- (void)changeKeyPath:(NSString\
  \ *)keyPath\n             ofObject:(id)obj\n             toValue:(id)newValue\n\
  {\n    // setValue:forKeyPath: 会导致键值观察方法\n    // 被调用，该方法处理撤销逻辑\n    [obj setValue:newValue\
  \ forKeyPath:keyPath];\n}\n```\n\n实现每当 `Person` 对象被用户或 `changeKeyPath:ofObject:toValue:`\
  \ 方法编辑时都会调用的方法。注意，此方法会将 `changeKeyPath:ofObject:toValue:` 的调用放入撤销栈，并带有被更改键的旧值：\n\
  \n```objectivec\n- (void)observeValueForKeyPath:(NSString *)keyPath\n          \
  \           ofObject:(id)object\n                        change:(NSDictionary *)change\n\
  \                      context:(void *)context\n{\n    if (context != &RMDocumentKVOContext)\
  \ {\n        // 如果上下文不匹配，此消息\n        // 必须目标给我们的父类。\n        [super observeValueForKeyPath:keyPath\n\
  \        ofObject:object\n        change:change\n        context:context];\n   \
  \     return;\n    }\n\n    NSUndoManager *undo = [self undoManager];\n    id oldValue\
  \ = [change objectForKey:NSKeyValueChangeOldKey];\n}\n```\n\n\n\n\n\n```objc\n//\
  \ NSNull objects are used to represent nil in a dictionary\nif (oldValue == [NSNull\
  \ null]) {\n    oldValue = nil;\n}\nNSLog(@\"oldValue = %@\", oldValue);\n[[undo\
  \ prepareWithInvocationTarget:self] changeKeyPath:keyPath\nofObject:object\ntoValue:oldValue];\n\
  [undo setActionName:@\"Edit\"];\n}\n```\n\n这样就完成了。一旦你编译并运行应用程序，撤销（undo）和重做（redo）应该就能完美工作。\n\
  \n在测试应用程序时，你可能会遇到错误：`The document could not be autosaved`。由于你正在操作撤销系统，AppKit 注意到你的文档有未保存的并尝试自动保存。你将在下一章节学习如何将文档保存到文件中。\n\
  \n### 在插入时开始编辑\n\n你的 App 进展顺利，但你的用户会抱怨：“为什么我在插入后必须双击才能开始编辑？显而易见我想立即更改新人的名字。你们不能在插入的同时就开始编辑吗？”\n\
  \n奇怪的是，这做起来有点复杂。所以，这里是你需要的代码片段。首先，`RMDocument.h` 需要一个 `action` 和两个实例变量：\n\n```objc\n\
  @interface RMDocument : NSDocument\n{\n    NSMutableArray *employees;\n    IBOutlet\
  \ NSTableView *tableView;\n    IBOutlet NSArrayController *employeeController;\n\
  }\n- (IBAction)createEmployee:(id)sender;\n```\n\n保存该文件。打开 `RMDocument.xib`，按住 Control\
  \ 键从 Add Employee 按钮拖到 File’s Owner（即 `RMDocument` 的实例）。将它的 `action` 设置为 `createEmployee:`。\n\
  \n按 Control 键点击 File’s Owner。拖动将 `tableView` outlet 连接到表格视图（table view），并将 `employeeController`\
  \ outlet 连接到数组控制器（array controller）。\n\n**图 9.5.** 设置 tableView Outlets\n\n![Image](img/00112.jpg)\n\
  \n现在，在 `RMDocument.m` 中，添加 `createEmployee:` 方法：\n\n```objc\n- (IBAction)createEmployee:(id)sender\n\
  {\n    NSWindow *w = [tableView window];\n\n    // 尝试结束任何正在进行的编辑\n    BOOL editingEnded\
  \ = [w makeFirstResponder:w];\n    if (!editingEnded) {\n        NSLog(@\"Unable\
  \ to end editing\");\n        return;\n    }\n    NSUndoManager *undo = [self undoManager];\n\
  \n    // 此事件中是否已经发生了编辑？\n    if ([undo groupingLevel] > 0) {\n        // 关闭上一个分组\n\
  \        [undo endUndoGrouping];\n        // 打开一个新分组\n        [undo beginUndoGrouping];\n\
  \    }\n    // 创建对象\n    Person *p = [employeeController newObject];\n\n    // 将其添加到\
  \ 'employeeController' 的内容数组\n    [employeeController addObject:p];\n\n    // 重新排序（以防用户排序了某列）\n\
  \    [employeeController rearrangeObjects];\n\n    // 获取排序后的数组\n    NSArray *a =\
  \ [employeeController arrangedObjects];\n\n    // 找到刚刚添加的对象\n    NSUInteger row\
  \ = [a indexOfObjectIdenticalTo:p];\n    NSLog(@\"starting edit of %@ in row %lu\"\
  , p, row);\n\n    // 在第一列开始编辑\n    [tableView editColumn:0\n    row:row\n    withEvent:nil\n\
  \    select:YES];\n}\n```\n\n我们并不指你现在就能理解这段代码的每一行，但可以浏览一下该方法并尝试掌握要意。编译并运行应用程序。\n\
  \n### 给更具好奇心的人：窗口与撤销管理器\n\n视图可以向撤销管理器添加编辑。例如，`NSTextView` 可以将人员对文本的每次编辑都放入撤销管理器。文本视图如何知道使用哪个撤销管理器呢？首先，它询问它的\
  \ `delegate`。`NSTextView` 代理可以实现此方法：\n\n```objc\n- (NSUndoManager *)undoManagerForTextView:(NSTextView\
  \ *)tv;\n```\n\n接下来，它询问它的窗口。`NSWindow` 有一个用于此目的的方法：\n\n```objc\n- (NSUndoManager\
  \ *)undoManager;\n```\n\n窗口的 `delegate`可以通过实现以下方法为窗口提供撤销管理器：\n\n```objc\n- (NSUndoManager\
  \ *)windowWillReturnUndoManager:(NSWindow *) window;\n```\n\n撤销/重做菜单项反映了主窗口（key\
  \ window）撤销器的的状态。（主窗口是大多数用户所谓的“活动窗口”。Cocoa 开发者称之为 *key* 窗口。）\n\n**图 9.6.** NSTextView\n\
  \n![Image](img/00113.jpg)\n\n\n\n\n`NSCoder` 是一个`abstract class`。你永远不会创建抽象类的实例。相反，抽象类具有一些意图让子类继承的功能。你将创建具体子类的实例。具体来说，你将使用\
  \ `NSKeyedUnarchiver` 从数据流中读取对象，并使用 `NSKeyedArchiver` 将对象写入数据流。\n\n### 编码 (Encoding)\n\
  \n`NSCoder` 许多许多方法，但大多数程序员发现自己只是反复使用其中少数几个。当你将数据编码到编码器（coder）时，以下是最常用的几个方法：\n\n\
  ```objc\n- (void)encodeObject:(id)anObject forKey:(NSString *)aKey\n```\n\n此方法将\
  \ `anObject` 写入编码器并将其与键 `aKey` 关联。这将导致 `anObject` 的 `encodeWithCoder:` 方法被调用（就像告诉了两个朋友，他们又告诉了两个朋友……）。\n\
  \n对于每种常见的 C 原始类型（例如 `int` 和 `float`），`NSCoder` 都有一个对应的编码方法：\n\n```objc\n- (void)encodeBool:(BOOL)boolv\
  \ forKey:(NSString *)key\n- (void)encodeDouble:(double)realv forKey:(NSString *)key\n\
  - (void)encodeFloat:(float)realv forKey:(NSString *)key\n- (void)encodeInt:(int)intv\
  \ forKey:(NSString *)key\n```\n\n要为你的 `Person` 类添加编码功能，请向 `Person.m` 添加以下方法：\n\n\
  ```objc\n- (void)encodeWithCoder:(NSCoder *)coder\n{\n    [coder encodeObject:personName\
  \ forKey:@\"personName\"];\n    [coder encodeFloat:expectedRaise forKey:@\"expectedRaise\"\
  ];\n}\n```\n\n如果你查看 `NSString` 的文档，你会发现它实现了 `NSCoding` 协议。因此，`personName` 知道如何编码自己。\n\
  \n所有常用的 AppKit 和 Foundation 类都实现了 `NSCoding` 协议，但 `NSObject` 是个例外。因为 `Person` 继承自\
  \ `NSObject`，所以它没有调用 `[super encodeWithCoder:coder]`。如果 `Person` 的父类实现了 `NSCoding`\
  \ 协议，该方法将看起来像这样：\n\n```objc\n- (void)encodeWithCoder:(NSCoder *)coder\n{\n    [super\
  \ encodeWithCoder:coder];\n    [coder encodeObject:personName forKey:@\"personName\"\
  ];\n    [coder encodeFloat:expectedRaise forKey:@\"expectedRaise\"];\n}\n```\n\n\
  对父类 `encodeWithCoder:` 方法的调用将让父类有机会将其变量写入编码器中。因此，层次结构中的每个类都只向编码器写入自己的实例变量（而不是其父类的实例变量）。\n\
  \n### 解码 (Decoding)\n\n当从编码器中解码数据时，你将使用类似的解码方法：\n\n```objc\n- (id)decodeObjectForKey:(NSString\
  \ *)aKey\n- (BOOL)decodeBoolForKey:(NSString *)key\n- (double)decodeDoubleForKey:(NSString\
  \ *)key\n- (float)decodeFloatForKey:(NSString *)key\n- (int)decodeIntForKey:(NSString\
  \ *)key\n```\n\n如果由于某种原因，流中不包含某个键的数据，你将得到零结果。例如，如果在第一次写入流时对象没有为键 `foo` 写入数据，那么以后被要求解码键\
  \ `foo` 的 `float` 时，编码器将返回 0.0。如果被要求解码键 `foo` 的对象，编码器将返回 `nil`。\n\n要为你的 `Person`\
  \ 类添加解码功能，请向你的 `Person.m` 文件添加以下方法：\n\n```objc\n- (id)initWithCoder:(NSCoder *)coder\n\
  {\n    self = [super init];\n    if (self) {\n        personName = [coder decodeObjectForKey:@\"\
  personName\"];\n        expectedRaise = [coder decodeFloatForKey:@\"expectedRaise\"\
  ];\n    }\n    return self;\n}\n```\n\n再次，你没有调用父类 `initWithCoder:` 的实现，因为 `NSObject`\
  \ 没有这个方法。如果 `Person` 的父类实现了 `NSCoding` 协议，该方法将看起来像这样：\n\n```objc\n- (id)initWithCoder:(NSCoder\
  \ *)coder\n{\n    self = [super initWithCoder:coder];\n    if (self) {\n       \
  \ personName = [coder decodeObjectForKey:@\"personName\"];\n        expectedRaise\
  \ = [coder decodeFloatForKey:@\"expectedRaise\"];\n    }\n    return self;\n}\n\
  ```\n\n细心的读者现在可能会说：“[第 3 章]说过指定初始化器完成了所有工作并调用了指定初始化器。但 `NSObject` 有 `init`，它是它的指定初始化器。你已经教了\
  \ `Person` `NSCoding` 协议。”为了声明你的 `Person` 类，你需要编辑 `Person.h`：\n\n```objc\n@interface\
  \ Person : <NSCoding>\n...\n@end\n```\n\n### 文档架构 (Document Architecture)\n\n处理多个文档的应用有很多共同点。Apple\
  \ 提供了三个类来处理大部分工作：`NSDocumentController`、`NSDocument` 和 `NSWindowController`。这三个类共同构成了文档架构。其目的与第\
  \ 8 章讨论的模型-视图-控制器（MVC）设计模式有关。在 Raise 中，你的 `NSDocument` 子类（在 `NSArray` 的帮助）充当控制器。它将有一个指向模型的指针，并负责：\n\
  \n- 将模型数据保存到文件\n- 从文件加载模型数据\n- 在视图中显示模型数据\n- 从视图接收用户输入并更新模型\n\n#### Info.plist 和\
  \ NSDController\n\n在构建应用程序时，`Xcode` 会包含一个名为 `Info.plist` 的文件。（在本章稍后的部分，你将更改 `Info.plist`。）当应用启动时，它会从\
  \ `Info.plist` 读取内容，这会告诉它要处理的文件类型。如果它发现自己是一个基于文档的应用，它会创建一个 `NSDocumentController`\
  \ 实例。你很少需要处理文档控制器；它在后台运行并为你处理这些细节。如果你需要向文档控制器发送消息，可以像这样获取它：\n\n```objc\nNSDocumentController\
  \ *dc;\ndc = [NSDocumentController sharedDocumentController];\n```\n\n#### NSDocument\n\
  \n文档对象是 `NSDocument` 子类的实例。例如，在你的 Raise 应用中，文档对象是 `RMDocument` 的实例。对于许多应用，你只需要扩展\
  \ `NSDocument` 来实现你的需求；你完全不需要担心 `NSDocumentController` 或 `NSWindowController`。\n\
  \n##### 保存 (Saving)\n\n菜单项“保存”（Save）、“另存为...”（Save As...、“全部保存”（Save All）和“关闭”（Close）都是不同的，但它们都处理同一个问题：将模型放入文件或文件封装（file\
  \ wrapper）中。（文件封装是对用户看来像文件的目录。）为了处理这些菜单项，你的 `NSDocument` 子类必须实现以下三个方法之一：\n\n\n\n\
  \n\n```objc\n- (NSData *)dataOfType:(NSString *)aType\n                 error:(NSError\
  \ **)e\n```\n\n你的文档对象提供了要以 `NSData` 对象格式写入文件的模型。`NSData` 本质上是一个字节缓冲区，是基于文档的应用程序中实现保存功能最简单且最流行的方法。如果你无法创建数据对象，请返回\
  \ `nil`，用户将收到一个提示表单（alert sheet），指示保存尝试失败。注意，你会接收到一个类型，这允许你以几种可能的格式之一来保存文档。例如，如果你编写了一个图形程序，你可能允许用户将图像保存为\
  \ gif 或 jpg 文件。当你创建数据对象时，`aType` 表示用户请求保存文档的格式。如果你只处理一种类型的数据，可以简单地忽略 `aType`。要指示你无法保存数据，请返回\
  \ `nil` 并创建一个描述错误原因的 `NSError` 对象。\n\n```objc\n- (NSFileWrapper *)fileWrapperOfType:(NSString\
  \ *)aType\n                                 error:(NSError **)e\n```\n\n你的文档对象以\
  \ `NSFileWrapper` 对象的形式返回模型。它将被写入到用户选择的文件系统位置。要指示你无法创建文件包装器，请返回 `nil` 并创建一个描述错误原因的\
  \ `NSError` 对象。\n\n```objc\n- (BOOL)writeToURL:(NSURL *)absoluteURL\n          \
  \     ofType:(NSString *)typeName\n              error:(NSError **)outError;\n```\n\
  \n你的文档对象接收 URL 和类型，并负责将数据存储到 URL 中。（URL 通常只是文件系统上的一个文件。）如果保存成功，返回 `YES`；如果保存失败，则返回\
  \ `NO`。返回 `NO` 表示你无法将数据写入 URL，并创建一个描述错误原因的 `NSError` 对象。\n\n`NSError` 可能会让人感到困惑。其核心是：如果方法由于某种原因无法执行其任务，该方法会创建一个\
  \ `NSError` 并该错误的指针存放在提供的地址中。例如，要从文件中读取 `NSData`，你会提供一个用于放置错误指针的地址：\n\n```objc\n\
  NSError *e;\nNSData *d = [NSData dataWithContentsOfFile:@\"/tmp/x.txt\"\n      \
  \                         options:0\n                                   error:&error];\n\
  // 读取是否失败？\nif (d == nil) {\n    NSLog(@\"Read failed: %@\", error localizedDescription);\n\
  }\n```\n\n因此，`NSData` 要么返回数据对象，要么创建一个错误对象。在这些保存和加载方法中，如果方法失败，你将负责创建一个 `NSError`。\n\
  \n## 加载\n\n“打开...”、“最近打开”和“恢复到保存版本”（Revert To Saved）菜单项虽然不同，但处理的都是同一个基本问题：从文件或文件包装器获取模型。为了处理这些菜单项，你的\
  \ `NSDocument` 子类必须实现三个方法之一：\n\n```objc\n- (BOOL)readFromData:(NSData *)data\n \
  \                ofType:(NSString *)typeName\n                error:(NSError **)outError\n\
  ```\n\n你的文档将接收一个 `NSData` 对象，其中包含用户尝试打开的文件内容。如果你成功从数据创建了模型，请返回 `YES`。如果你返回 `NO`，用户将收到一个警告面板（Alert\
  \ panel），该面板应该解释为何失败。\n\n```objc\n- (BOOL)readFromFileWrapper:(NSFileWrapper *)fileWrapper\n\
  \                ofType:(NSString *)typeName\n                 error:(NSError **)outError\n\
  ```\n\n```objc\n- (BOOL)readToURL:(NSURL *)absoluteURL\n               ofType:(NSString\
  \ *)typeName\n              error:(NSError **)outError\n```\n\n你的文档对象接收 URL 和类型，并负责将数据存储到\
  \ URL 中。（URL 通常只是文件系统上的一个文件。）如果保存成功，返回 `YES`；如果保存失败，则返回 `NO`。返回 `NO` 表示你无法将数据写入\
  \ URL，并创建一个描述错误原因的 `NSError` 对象。\n\n`NSError` 可能会让人感到困惑。其核心是：如果方法由于某种原因无法执行其任务，该方法会创建一个\
  \ `NSError` 并该错误的指针存放在提供的地址中。例如，要从文件中读取 `NSData`，你会提供一个用于放置错误指针的地址：\n\n```objc\n\
  NSError *e;\nNSData *d = [NSData dataWithContentsOfFile:@\"/tmp/x.txt\"\n      \
  \                         options:0\n                                   error:&error];\n\
  // 读取是否失败？\nif (d == nil) {\n    NSLog(@\"Read failed: %@\", error localizedDescription);\n\
  }\n```\n\n因此，`NSData` 要么返回数据对象，要么创建一个错误对象。在这些保存和加载方法中，如果方法失败，你将负责创建一个 `NSError`。\n\
  \n## 加载\n\n“打开...”、“最近打开”和“恢复到保存版本”菜单项虽然不同，但处理的都是同一个基本问题：从文件或文件包装器获取模型。为了处理这些菜单项，你的\
  \ `NSDocument` 子类必须实现三个方法之一：\n\n```objc\n- (BOOL)readFromData:(NSData *)data\n \
  \                ofType:(NSString *)typeName\n                error:(NSError **)outError\n\
  ```\n\n你的文档将接收一个 `NSData` 对象，其中包含用户尝试打开的文件内容。如果你成功从数据创建了模型，请返回 `YES`。如果你返回 `NO`，用户将收到一个警告面板，该面板应该解释为何失败。\n\
  \n```objc\n- (BOOL)readFromFileWrapper:(NSFileWrapper *)fileWrapper\n          \
  \      ofType:(NSString *)typeName\n                 error:(NSError **)outError\n\
  ```\n\n```objc\n- (BOOL)readToURL:(NSURL *)absoluteURL\n               ofType:(NSString\
  \ *)typeName\n              error:(NSError **)outError\n```\n\n你的文档对象接收 URL 和类型，并负责将数据存储到\
  \ URL 中。（URL 通常只是文件系统上的一个文件。）如果保存成功，返回 `YES`；如果保存失败，则返回 `NO`。返回 `NO` 表示你无法将数据写入\
  \ URL，并创建一个描述错误原因的 `NSError` 对象。\n\n\n\n\n现在你将为应用程序添加加载文件的功能。再次，`NSDocument` 已经为你处理了大部分的细节。\n\
  \n要进行反归档操作，你将使用 `NSKeyedUnarchiver`，它具有以下方便的方法：\n\n> `+ (id)unarchiveObjectWithData:(NSData\
  \ *)data`\n\n在 `RMDocument.m` 中，将你的 `readFromData:ofType:error:` 方法修改如下所示：\n\n```objc\n\
  - (BOOL)readFromData:(NSData *)data\n             ofType:(NSString *)typeName\n\
  \              error:(NSError **)outError\n{\n    NSLog(@\"About to read data of\
  \ type %@\", typeName);\n    NSMutableArray *newArray = nil;\n    @try {\n     \
  \   newArray = [NSKeyedUnarchiver unarchiveObjectWithData:data];\n    }\n    @catch\
  \ (NSException *e) {\n        NSLog(@\"exception = %@\", e);\n        if (outError)\
  \ {\n            NSDictionary *d = [NSDictionary dictionaryWithObject:@\"The data\
  \ is corrupted.\"\n                               forKey:NSLocalizedFailureReasonErrorKey];\n\
  \            *outError = [NSError errorWithDomain:NSOSStatusErrorDomain\n      \
  \                      code:unimpErr\n                            userInfo:d];\n\
  \        }\n        return NO;\n    }\n    [self setEmployees:newArray];\n    return\
  \ YES;\n}\n```\n\n你可以在 XIB 文件加载后更新用户界面，但 `NSArrayController` 会为你处理它：`windowControllerDidLoadNib:`\
  \ 方法不需要做任何操作。暂时保留在这里，因为你将在[第 13 章]中对其进行添加。\n\n```objc\n- (void)windowControllerDidLoadNib:(NSWindowController\
  \ *)aController\n{\n    [super windowControllerDidLoadNib:aController];\n}\n```\n\
  \n注意，当打开或创建文档时，系统会询问文档加载哪个 XIB 文件。此方法也不需要更改：\n\n```objc\n- (NSString *)windowNibName\n\
  {\n    return @\"RMDocument\";\n}\n```\n\n当你进行编辑时，窗口会自动标记为已编辑，因为你已经正确启用了撤销机制。当你向文档的撤销管理器注册更改时，它会自动将文档标记为已编辑。\n\
  \n此时，你的应用程序就可以读写文件了。编译你的应用程序并尝试一下。一切都应该正常工作，但你所有的文件都将显示为 `Document Type` 文件并带有通用的文档图标。让我们看看如何更完整地定义应用程序的文档类型。\n\
  \n### 为文件类型设置扩展名和图标\n\nRaiseMan 文件已经有了 `.rsmn` 扩展，这是我们在创建项目时配置的。但 `.rsmn` 文件需要一个图标。找到一个\
  \ `.icns` 文件并将其拷贝到项目中。你可以在 `/Developer/Examples/TextEdit/txt.icns` 找到一个很好的图标。将其从\
  \ Finder 拖到 Xcode 项目导航器视图中的 Supporting Files 组中。\n\n**图 10.3.** 将图标拖入项目\n\n![Image](img/00116.jpg)\n\
  \nXcode 会弹出一个工作单。确保你勾选了“Copy items into destination group’s folder”。这将图标文件拷贝到你的项目目录中。\n\
  \n**图 10.4.** 拷贝\n\n![Image](img/00117.jpg)\n\n要设置文档类型信息，请在项目导航器中选择 `RaiseMan` target。在\
  \ Info 标签页下，找到 Document Types 标题并展开现有的文档类型。将名称设置为 `RaiseMan Doc`，图标设置为 `txt`，标识符设置为\
  \ `com.bignerdranch.raisemandoc`。\n\n接下来，为 RaiseMan 文档配置导出的 UTI。UTI 描述了文件中包含的数据类型；我们将在本章稍后的部分详细介绍\
  \ UTI。\n\n导出的 UTIs 位于 `target` info 中 Document Types 标题的正下方。如果还没有空白的导出的 UTI，请使用\
  \ Add 按钮添加一个。将 Description（描述）、Identifier（标识符）、Icon（图标）和 Extensions（扩展名）设置为与你在 Document\
  \ Type 中进行的设置相同。对于 Conforms To（符合），输入 `public.data`。\n\n**图 10.5.** 配置类型和导出的 UTI\n\
  \n![Image](img/0018.jpg)\n\n\n\n\n类不需要重新声明它从超父类继承的任何方法，也不需要重新声明它所实现的协议中的任何方法。因此，在我们的示例中，类\
  \ `ZsaZsa` 的接口文件不需要列出 `Spooky`、`Foo` 或 `NSCoding` 中的任何方法。\n\n### 针对更具好奇心的读者：自动文档保存\n\
  \n在 Mac OS X Lion 中，Apple 为 Cocoa 引入了自动文档保存支持。有了自动文档保存，你的用户将不再需要担心手动保存文档。通过监控更改计数（后文将描述），Cocoa\
  \ 会在适当的时间提示你的文档进行归档。当用户手动保存文档时，会创建一个新版本。用户可以使用类似于 Time Machine 的界面浏览之前的版本。未命名的文档（用户未显式保存的文档）甚至会在应用程序运行之间被保留。\n\
  \n为了支持自动文档保存，你的 `NSDocument` 子类必须通过重写类方法 `autosavesInPlace` 返回 `YES` 来开启开启：\n\n\
  ```\n+ (BOOL)autosavesInPlace {\n    return YES;\n}\n```\n\n如果你的文档保存数据很快，选择开启可能是一个很容易的选择。否则，在本地自动保存可能不适用于你的应用程序，因为它会导致界面阻塞直到保存完成。请参考\
  \ Apple 的 *Mac OS X Application Programming Guide* 以获得更深入的讨论。\n\nXcode 中的 Cocoa\
  \ 应用程序模板启用了此功能；`NSDocument` 对该方法的实现返回 `NO`。\n\n### 针对更具好奇心的读者：不支持撤销的文档应用程序\n\n你应用程序的\
  \ `NSUndoManager` 知道何时发生了未保存的编辑。此外，窗口会自动被标记为已编辑。但如果你写了一个应用程序，并且没有向撤销管理器注册你的更改该怎么办？\n\
  \n`NSDocument` 会跟踪进行了多少次更改。它有一个为此此目的的方法：\n\n```\n- (void)updateChangeCount:(NSDocumentChangeType)change;\n\
  ```\n\n`NSDocumentChangeType` 可以是以下之一：`NSChangeDone`、`NSChangeUndone` 或 `NSChangeCleared`。`NSChangeDone`\
  \ 增加更改计数，`NSChangeUndone` 减少更改计数，而 `NSChangeCleared` 将更改计数置为 0。只要更改计数不为 0，窗口就会被标记为脏。\n\
  \n### 通用类型标识符\n\n与计算机交道时的一个长期问题体现在这个问题上：这些数据代表了什么？在 Mac 上，这个问题在几个地方被提出：当从 Finder\
  \ 打开文件时、当从剪贴板拷贝数据时、当 Spotlight 索引文件时，以及通过 Quicklook 查看文件时。到为止，已经几个答案：文件扩展名、创建者代码、MIME\
  \ 类型。\n\nApple 决定该问题的长期解决方案是通用类型标识符 (UTIs)。UTI 是一个标识数据类型的字符串。这些数据可能在文件中，也在内存缓冲区中。UTIs\
  \ 是层次化的。例如，UTI `public.image` 符合 `public.data`。\n\n你的应用程序通过设置其 `Info.plist` 中的值来告诉\
  \ Mac OS X 你的应用程序可以读写哪些 UTI，包括新的自定义 UTI。`Info.plist` 是一个包含键值对字典的 XML 文件。导出的 UTI\
  \ 存储在键 `UTExportedTypeDeclarations` 中。你之前遵循的添加导出 UTI 的步骤创建了这个键。我们将在 第 21 章 中提到的剪贴板使用\
  \ UTI 来识别数据类型。\n\n有一组系统定义的 UTI。你可以在 Apple 的文档中找到完整列表。\n\n## 第 11 章 基础 Core Data\n\
  \n此时，你已经实现了一个可以跟踪对象数组、处理撤销并处理从文件保存和加载的应用程序。正如你可以想象的，有许多像你刚刚编写的这样的应用程序。\n\nApple\
  \ 决定让这类应用程序的编写变得极其简单：\n\n- `NSArrayController` 将持有一个对象数组。\n- 绑定（Bindings）将消除为了保持模型对象与视图同步而所需的许多胶水代码。\n\
  - `NSManagedObjectContext` 将观察你的数据对象的实例变量，并为你处理撤销以及数据的加载和保存。\n\n所以，结论是：使用 Core Data\
  \ 和绑定，你编写的 RaiseMan 应用程序可以完全不需要代码就能创建。在这一节中，你将编写一个没有代码的简单 Core Data 应用程序（与 RaiseMan\
  \ ）。\n\n### NSManagedObjectModel\n\n为了知道如何保存和加载对象中的数据，系统需要了解关于这些数据的信息：你的对象属性的名称是什么？它们的类型是什么？为了提供这些信息，你将创建一个托管对象模型（managed\
  \ object model）。Xcode 有一个编辑器，可以方便你将在 `.xcdatamodeld` 文件中描述你的承载数据的对象。在运行时，该文件将被读取，并创建一个\
  \ `NSManagedObjectModel` 实例。\n\n模型使用的术语与我们习惯的稍有不同。模型不使用“类”，而是使用 `entity`（实体）。模型不使用“实例变量”，而是使用\
  \ `property`（属性）。\n\n模型中有两种属性：`attributes`（属性）和 `relationships`（关系）。我们将在 第 32 章\
  \ 中讨论关系。\n\nRaiseMan 使用了名为 `RMDocument` 的 `NSDocument` 子类。在这个应用程序中，你将有一个名为 `MyDocument`\
  \ 的 `NSPistentDocument` 子类。`NSPistentDocument` 是 `NSDocument` 的子类，会自动读取模型并创建一个 `NSManagedObjectContext`。\n\
  \n启动 Xcode 并创建一个类型为 Cocoa Application 的项目。将项目命名为 Car，将 Class 前缀设置为 `My`，将 Document\
  \ 后缀设置为 `carlot`。启用 Create Document-Based Application 和 Use Core Data。想象你拥有几家二手车行。这个应用程序将使你能够跟踪想要出售的汽车。当应用程序完成后，它看起来像\
  \ 图 11.1。\n\n**图 11.1.** 已完成的应用程序\n\n![Image](img/00120.jpg)\n\n在新项目中，打开 `MyDocument.xcdatamodeld`。点击编辑器左下角的\
  \ Add Entity 按钮来创建一个新实体。将实体命名为 Car。\n\n在仍选中 `Car` 实体的情况下，点击 Attributes 编辑器底部的按钮。添加六个属性并赋予它们以下名称和类型：\n\
  \n![Image](img/00121.jpg)\n\n图 11.2 显示了 `car` 在模型器中看起来的样子。我们可以在模型中放入许多其他东西，但对于这个练习来说足够了。\n\
  \n**图 11.2.** 已完成的模型\n\n![Image](img/00122.jpg)\n\n### 接口\n\n打开 `MyDocument.xib`。删除写着\
  \ Your document contents here 的文本字段。向 Interface Builder 停靠栏拖入一个数组控制器（array controller）。数组控制器将使用文档对象的\
  \ `NSManagedObjectContext` 来获取和存储数据。使用 Bindings 器将数组控制器的 `managedObjectContext`\
  \ 绑定到 File’s Owner 的 `managedObjectContext`（图 11.3）。\n\n**图 11.3.** 给数组控制器一个 Managed\
  \ Object Context\n\n![Image](img/00123.jpg)\n\n\n\n\n在数组控制器（array controller）仍被选中的，在属性检查器（Attributes\
  \ Inspector）的 Object Controller 区域下，将`Mode`设置为`Entity Name`，并将实体名称设置为`Car`。同时，开启`Prepares\
  \ Content`选项，以便数组控制器在创建后立即获取内容。\n\nInterface Builder 编辑器中的每个对象都可以有一个标签。在仍选中 `NSArrayController`\
  \ 的情况下，切换到身份检查器（Identity Inspector）并将其`Label` 设置为`Cars`。一旦你在 XIB 中有了多个数组控制器，这些标签将消除很多困惑（图\
  \ 11.4）。\n\n**图 11.4.** 检查 Cars Array 控制器的属性\n\n![Image](img/00124.jpg)\n\n## 基于视图的表格\
  \ (View-Based Table Views)\n\n在 Mac OS X 10.7 中，Apple 引入了基于视图的表格，它们与 iOS 的表格类似。在\
  \ 10.7 之前，Cocoa 开发者使用的是基于单元格（cell-based）的表格，它们非常快速且轻量级，但定制往往非常复杂。相比之下，基于视图的表格使得自定义表格单元格的外观变得非常简单：你可以利用\
  \ Xcode 的 Interface Builder 来实现此目的。\n\n拖出一个表格视图（从 Cocoa->Data Views）。在属性检查器中，将`Content\
  \ Mode`设置为`View Based`，并给它分配三列。将这些列命名为`Make/Model`、`Price` 和 `Special`。\n\n使用对象层次结构视图（展开的\
  \ dock 视图）选择第一列中的`Table Cell View`并将其删除——它是`Table Column`的子级。现在，从库中拖入一个 `Image &\
  \ Text Table Cell View`到第一列中。现在每列都应该包含一个表格单元格视图（`NSTableCellView`），并在其中包含静态文本（`NSTextField`）。第一列的单元格视图还包含一个图像视图（图\
  \ 11.5）。\n\n**图 11.5.** 拖入 Image & Text Table Cell View\n\n![Image](img/00125.jpg)\n\
  \n现在将一个数字格式化器（从 Cocoa->Controls）拖动到 Price 列中的`NSTextField`上（图 11.6）。在属性检查器中，使用 10.4+\
  \ 格式化器，并将样式设置为`Currency`。\n\n**图 11.6.** 配置格式化器\n\n![Image](img/00126.jpg)\n\n第三列将由复选框填充，因此选择第三列单元格视图中的`NSTextField`并将其删除。请确保你选中并删除的是`Static\
  \ Text - Table View Cell`，而不是`Table Cell View`本身。这需要直接在单元格上点击两次。\n\n现在，在第三列的文本框位置拖入一个\
  \ `Check Box`（从 Cocoa->Data Views），而不是`Check Box Cell`。选中复选框并清除它的标题（图 11.7）。\n\n\
  **图 11.7.** 拖入 Check Box\n\n![Image](img/00127.jpg)\n\n在表格视图下方，向窗口拖入一个`NSDatePicker`、两个按钮、一个`NSImageView`（在库中称为\
  \ Image Well）以及一个`NSLevelIndicator`。将按钮标记为`Add` 和 `Remove`。在日期选择器和级别指示器旁边放置标签字段。标签应该是`Date\
  \ Purchased` 和 `Condition`。使用属性检查器使`NSImageView`变为可编辑状态（图 11.8）。\n\n**图 11.8.**\
  \ NSLevelIndicator 的属性\n\n![Image](img/00128.jpg)\n\n在`NSLevelIndicator`的属性检查器中，将其`max`设置为\
  \ 5，`min`设置为 0。将其样式设置为`Rating`（以获得星级）。同时，让级别指示器变为可编辑（图 11.8）。\n\n选择日期选择器、图像视图、两个标签和级别指示器。使用`Editor\
  \ -> Embed -> Box`项将它们封装在一个框中（图 11.9）。\n\n**图 11.9.** 嵌入框中\n\n![Image](img/00129.jpg)\n\
  \n## 连接与绑定 (Connections and Bindings)\n\n现在你将进行大量的绑定。我们将引导你逐步完成（图 11.10 是你将在视图和数组控制器之间创建的绑定的图解）。\n\
  \n**图 11.10.** 绑定总结\n\n![Image](img/00130.jpg)\n\n如果你过去用过基于单元格的表格，你会发现基于视图的表格绑定要直观得多。对于基于视图的表格，你将把表格的内容绑定到数组控制器；然后你放置在单元格视图（而非表格列）中的控件的值，将绑定到该行对应的对象值上。提醒一下：在本书中，你永远不会绑定滚动视图或单元格。\n\
  \n从将表格视图的`Content`绑定绑定到 Cars 的`arrangedObjects`开始。将 Model Key Path 留空。记住，Cars 是`NSArrayController`。接下来，将`Selection-Indexes`绑定到\
  \ Cars 的`selectionIndexes`（图 11.11）。\n\n**图 11.11.** 表格视图绑定\n\n![Image](img/00131.jpg)\n\
  \n现在，对每列单元格视图控件的`value`进行绑定，如下表。\n\n![Image](img/00132.jpg)\n\n注意绑定中的模式。每个控件的值都绑定到单元格视图`objectValue`的特定属性。回想表格的内容绑定到`NSArrayController`的排列对象。这些对象中的每一个都是我们`Car`实体的一个实例。当表格视图的内容被绑定时，表格单元格视图（`NSTableCellView`）的`objectValue`属性将填充为该行的实体实例。一旦我们理解了这一点，就可以配置非常直观的绑定，例如表格中的这些绑定。\n\
  \n在继续之前，使用属性检查器将每个静态文本框的 Behavior（行为））设置为`Editable`。\n\n使`Add`按钮触发数组控制器的`add:`方法（图\
  \ 11.12）。\n\n**图 11.12.** 设置 Add 按钮的 Target 和 Action\n\n![Image](img/00133.jpg)\n\
  \n使`Remove`按钮触发数组控制器的`remove:`方法。\n\n如下所示将控件绑定到数组控制器的 selection：\n\n![Image](img/00134.jpg)\n\
  \n将`value`绑定到图像视图。选择控制器键`selection`和键路径`photo`。同时，勾选“Conditionally Editable”框（图\
  \ 11.13）。\n\n**图 11.13.** 图像视图绑定\n\n![Image](img/00135.jpg)\n\n选择框。在绑定检查器中，在 Title\
  \ With Pattern 下，将`Display Pattern1`绑定到 Cars（我们对数组控制器的自定义名称）。设置控制器键`selection`和键路径`makeModel`。设置\
  \ Display Pattern 为`%{title1}@`。将 No Selection Placeholder 设置为`<no selection>`。将\
  \ Null Placeholder 设置为`<no Make/Model>`（图 11.14）。\n\n**图 11.14.** 框绑定\n\n![Image](img/00136.jpg)\n\
  \n让我们在汽车处于特殊状态时在前两列的文本加粗显示。将前两列中静态文本（`NSTextField`）的 Font Bold 绑定到 Table Cell View。设置\
  \ Model Key Path 为`objectValue.onSpecial`（图 11.15）。\n\n**图 11.15.** 特殊项加粗\n\n![Image](img/00137.jpg)\n\
  \n#### Core Data 的工作原理\n\n尽管你没有编写任何代码，但将创建许多对象来完成这些工作。图 11.16 是其中一些对象的图解。\n\n你完成了。编译并运行应用程序。保存和加载应该可以工作。撤销也应该可以工作。神奇，不是吗？\n\
  \n\n\n\n![Image](img/00138.jpg)\n\n因此，`NSPersistentDocument` 读取你创建的模型，并使用它创建一个 `NSManagedObjectModel`\
  \ 实例。在我们的案例中，该托管对象模型包含一个 `NSEntityDescription`（描述我们的 `Car` 实体）。该实体描述有多个 `NSAttributeDescription`\
  \ 实例。\n\n一旦获取了模型，持久化文档就会创建一个 `NSPersistentStoreCoordinator` 实例和一个 `NSManagedObjectContext`\
  \ 实例。`NSManagedObjectContext` 从对象存储器中获取 `NSManagedObject` 实例。当这些托管对象存在内存中时，托管对象上下文会对其它们进行观察。每当托管对象内部的数据发生变化时，托管对象上下文就会向文档的\
  \ `NSUndoManager` 注册该次 `undo`（撤销）操作。托管对象上下文还知道哪些对象被更改并需要保存。\n\n因此，在 Core Data 框架的类中，你会发现自己与\
  \ `NSManagedObjectContext` 的交互最为频繁。要获取对象，你将使用 `NSManagedObjectContext`。要保存对象图的更改，你将使用\
  \ `NSManagedObjectContext`。\n\n考虑到我们可能会在购买汽车时将它们添加到系统中，如果 `datePurchased` 属性被设置为当前日期就太棒了。实现此点的一种良好方法是为\
  \ `NSArrayController` 子类并重写它的 `newObject` 方法。\n\n创建一个 Objective-C 类的新文件。它将是 `NSArrayController`\
  \ 的子类。将其命名为 `CarArrayController`。在 `CarArrayController.m` 中，移除生成的模板 `init` 和 `dealloc`\
  \ 方法，并重写 `newObject`：\n\n```objectivec\n- (id)newObject\n{\n    id newObj = [super\
  \ newObject];\n    NSDate *now = [NSDate date];\n    [newObj setValue:now forKey:@\"\
  datePurchased\"];\n    return newObj;\n}\n```\n\n在 Interface Builder 编辑器中打开 `MyDocument.xib`\
  \ 并选择数组控制器。在 Identity Inspector（身份检查器）中，将类设置为 `CarArrayController`。（确保你处于 Identity\
  \ Inspector 中，而不是 Attributes Inspector（属性检查器）；此数组控制器仍然持有一个 `Car` 实体的实例数组。）参见图 11.17。\n\
  \n**图 11.17.** 更改数组控制器的类\n\n![Image](img/00139.jpg)\n\n编译并运行应用程序。当添加新汽车时，它们的 `datePurchased`\
  \ 属性应该初始化为当前日期。\n\n### 给更有好奇的人：基于视图与基于单元的表格视图\n\n你现在已经同时使用了基于视图和基于单元的表格视图：本章使用了基于视图，SpeakLine\
  \ 练习中使用了基于单元。你可能在好奇为什么有两种类型，以及你应该选择哪一种。\n\n基于单元的表格视图自从 Cocoa 在 NeXT 起初就存在了。这类表格视图出于性能考虑使用单元，对于显示简单数据效果非常好。但自定义可能具有挑战性，而且在单元中加入动画或交互式控件（如按钮）极具挑战性。如果你的目标是\
  \ Mac OS X 10.6 或更早版本，基于单元的表格视图是你的唯一选择。\n\n基于视图的表格视图是在 Mac OS X 10.7 中引入的，提供了简单、方便的自定义，允许使用\
  \ Interface Builder 编辑器布局单元内容。动画和交互式控件可以被轻松使用，因为表格单元实际上是视图。\n\n基于单元的表格视图上的绑定（Bindings）并不那么明显，但更简单：仅绑定表格列。基于视图的表格视图上的绑定完全不同，但更符合逻辑：绑定表格视图的内容，然后将单元视图中的单个控件直接绑定到所需的属性上。这种方法的优点是允许创建相对简单的复合单元（包含多个控件的单元）。\n\
  \n### 挑战\n\n在学习了 RaiseMan 中 `createNewEmployee:` 的代码后，让 `CarArrayController` 在创建新记录时选择表格视图的“制造地/型号”（Make/Model）列。提示：你需要为\
  \ `CarArrayController` 添加一个出口（outlet）。\n\n## 第 12 章.NIB 文件与 NSWindowController\n\
  \n在 RaiseMan 中，你已经在使用两个 NIB 文件：`MainMenu.nib` 和 `RMDocument.nib`。（记住编译器在构建过程中会将我们的\
  \ XIB 文件转换为 NIB 文件。）`MainMenu.nib` 由 `NSApplication` 在应用程序首次启动时自动加载。`RMDocument.nib`\
  \ 在每次创建 `RMDocument` 实例时自动加载。在本章中，你将学习如何使用 `NSWindowController` 加载 NIB 文件。\n\n你为什么要加载\
  \ NIB 文件呢？最常见的是，你的应用程序会有几个窗口（例如查找面板和偏好面板），它们只偶尔被使用。通过延迟加载 NIB 直到需要窗口时，你的应用程序启动速度会更快。此外，如果用户永远不需要该窗口，你的程序将消耗更内存。\n\
  \n### NSPanel\n\n在本章中，你将创建一个偏好面板。该面板将是 `NSPanel` 的实例，它是 `NSWindow` 的子类。面板与普通窗口并没有太大区别，但因为面板旨在作为辅助，它的行为略有不同。\n\
  \n- 面板可以成为关键窗口（key window）而不成为主窗口（main window）。\n- `NSApplication` 有一个 `mainWindow`\
  \ 输出和一个 `keyWindow` 输出。除非涉及面板，否则这两个输出点都指向同一个窗口。\n- 如果它有 `close` 按钮，你可以按 Escape 键关闭面板。面板不会出现在窗口列表中。\n\
  \n所有窗口都有一个名为 `hidesOnactivate`（非活动时隐藏）的布尔值。如果设置为 `YES`，则窗口在应用程序未激活时会自动隐藏。大多数文档窗口此变量设置为\
  \ `NO`；大多数辅助面板设置为 `YES`。这种机制减少了屏幕杂乱。可以通过 Interface Inspector 设置 `hidesOnactivate`。\n\
  \n### 将面板添加到应用程序\n\n你现在要添加的偏好面板目前除了显示之外什么都不做。但在第 13 章中，你将学习用户默认（user defaults）并让偏好面板发挥作用。\n\
  \n偏好面板将位于自己的 NIB 文件中。你将创建一个名为 `PreferenceController` 的 `NSWindowController` 的子类。`PreferenceController`\
  \ 的实例将作为偏好面板的控制器。在创建辅助面板时，记住你可能想在下一个应用程序中重用它。创建一个仅作为控制器的类和一个仅包含面板的 NIB，有助于在另一个应用程序中重用该面板。时髦的程序员会说：“通过让应用程序更加模块化，我们可以最大化重用。”模块化也更容易在多个程序员之间分配任务。一个经理可以说：“Rex，你负责偏好面板。只有你可以编辑\
  \ NIB 文件和偏好控制器类。”\n\n偏好面板上的对象将连接到偏好控制器。特别是，偏好控制器将成为颜色选择器复选框的 `target`（目标）。当用户点击“偏好...”菜单项时，偏好面板将会出现。运行时，它看起来像图\
  \ 12.1。\n\n\n\n\n\n![Image](img/00140.jpg)\n\n图 12.2 展示了你将创建的对象以及它们所属的 NIB 文件的结构图。\n\
  \n**图 12.2.** 对象/NIB 结构\n\n![Image](img/00141.jpg)\n\n我们将从创建 `PreferenceController`\
  \ 开始；这将允许我们稍后利用 Xcode 的代码完成功能。打开 `RaiseMan` 项目，从 File 菜单选择 `New -> New File...`，并创建一个\
  \ `NSWindowController` 子类的新的 Objective-C 类文件。将该子类命名为 `PreferenceController`。编辑 `PreferenceController.h`\
  \ 如下所示：\n\n```objc\n#import <Cocoa/Cocoa.h>\n\n@interface PreferenceController :\
  \ NSWindowController {\n    IBOutlet NSColorWell *colorWell;\n    IBOutlet NSButton\
  \ *checkbox;\n}\n- (IBAction)changeBackgroundColor:(id)sender;\n- (IBAction)changeNewEmptyDoc:(id)sender;\n\
  @end\n```\n\n接下来，创建一个名为 `AppController` 的 `NSObject` 新子类。编辑 `AppController.h` 如下所示：\n\
  \n```objc\n#import <Foundation/Foundation.h>\n\n@class PreferenceController;\n\n\
  @interface AppController : NSObject {\n    PreferenceController *preferenceController;\n\
  }\n- (IBAction)showPreferencePanel:(id)sender;\n\n@end\n```\n\n注意 Objective-C 的语法：\n\
  \n`@class PreferenceController;`\n\n这告诉编译器存在一个名为 `PreferenceController` 的类。然后你可以在不导入\
  \ `PreferenceController` 头文件的情况下进行以下声明：\n\n```objc\nPreferenceController *preferenceController;\n\
  ```\n\n你可以将 `@class PreferenceController;` 替换为 `#import \"PreferenceController.h\"\
  `。该语句将导入头文件，编译器将得知 `PreferenceController` 是一个类。由于 `import` 命令需要编译器解析更多文件，使用 `@class`\
  \ 通常会导致更快的编译速度。\n\n请注意，你必须始终导入父类的头文件，因为编译器需要知道父类中声明了哪些实例变量。在这种情况下，`NSObject.h` 是由\
  \ `Foundation/Foundation.h` 导入的。\n\n### 设置菜单项\n\n打开 `MainMenu.xib`。从 Library（Objects\
  \ & Controllers 下方）拖入一个 `NSObject` 到停坞中。在 `Identity Inspector` 中，将其类设置为 `AppController`\
  \ ([图 12.3)）。\n\n**图 12.3.** 创建 AppController 实例 \n\n![Image](img/00142.jpg)\n\n\
  在 Interface Builder 编辑器中，点击应用程序菜单项 `RaiseMan`。从 `Preferences...` 菜单项控制并拖拽到 `AppController`。将其设置为\
  \ `target`，并将 `action` 设置为 `showPreferencePanel:` ([图 12.4)）。\n\n**图 12.4.** 设置菜单项的\
  \ Target \n\n![Image](img/00143.jpg)\n\n### AppController.m\n\n现在你需要编写 `AppController`\
  \ 的代码。使 `AppController.m` 的内容如下所示：\n\n```objc\n#import \"AppController.h\"\n#import\
  \ \"PreferenceController.h\"\n\n@implementation AppController\n\n- (IBAction)showPreferencePanel:(id)sender\n\
  {\n    // preferenceController 是否为 nil?\n    if (!preferenceController) {\n    \
  \    preferenceController = [[PreferenceController alloc] init];\n    }\n    NSLog(@\"\
  showing %@\", preferenceController);\n    [preferenceController showWindow:self];\n\
  }\n\n@end\n```\n\n注意，这段代码只会创建一次 `PreferenceController` 实例。如果 `preferenceController`\
  \ 变量非空，它将向现有实例发送 `showWindow:` 消息。\n\n同样注意，我们在使用它的 `.m` 文件导入了 `PreferenceController.h`。\n\
  \n### Preferences.xib\n\n在 Xcode 中，创建一个名为 `Preferences.xib` 的空 XIB 文件 ([图 12.5)。\n\
  \n**图 12.5.** 创建一个空 XIB 文件 \n\n![Image](img/00144.jpg)\n\n点击 `Preferences.xib` 在编辑器中打开它。调出\
  \ Identity Inspector，选择 File’s Owner，将其类设置为 `PreferenceController` ([图 12.6)])\n\
  \n**图 12.6.** 设置 File’s Owner \n\n![Image](img/00145.jpg)\n\n### File’s Owner\n\n\
  在 `Preferences.xib` 中，File’s Owner 代表 `PreferenceController` 实例。通过将类设置为 `PreferenceController`，你允许\
  \ XIB 连接在该类中定义的 outlet（输出口）和 action（动作）。\n\n从 Library 拖入一个 `NSObject` 到停坞中。在 `Identity\
  \ Inspector` 中，将其类设置为 `AppController` ([图 12.3)])这是处理偏好窗口高层逻辑的控制器。\n\n#### 布局界面\n\
  \n在 `Preferences.xib` 中，你需要添加 UI 元素。在视图中拖入一个 `NSColorWell` 用于颜色选择，拖入一个 `NSButton`\
  \ 作为复选框。将这些元素连接到 `PreferenceController.h` 中定义的 File’s Owner 的 `colorWell` 和 `checkbox`\
  \ outlet。\n\n\n\n\n注意你在 `init` 方法中设置了要加载的 NIB 文件的名称。该 NIB 文件会在需要时自动加载。`PreferenceController`\
  \ 的实例将替换 NIB 文件中的文件所有者（File’s Owner）。\n\n在 NIB 文件加载后，`PreferenceController` 将收到\
  \ `windowDidLoad` 消息。它为控制器对象提供了一个机会（类似于 `awakeFromNib` 或 `windowControllerDidLoadNib:`），用于初始化从\
  \ NIB 文件中读取的用户界面对象。\n\n当第一次发送 `showWindow:` 时，`NSWindowController` 会自动加载 NIB 文件并将窗口移动到屏幕上并置于顶。NIB\
  \ 文件只加载一次。当用户关闭偏好面板时，它会被移出屏幕但不会被释放。当用户下一次请求偏好面板时，它会被简单地移回屏幕上。\n\n`changeBackgroundColor:`\
  \ 和 `checkboxChanged:` 方法现在相当无聊——它们只是打印出一条消息。在下一章中，你将更改它们以更新用户的默认设置数据库。\n\n编译并运行应用程序。新面板应该出现，更改复选框或颜色选择器应该会在控制台中输出一条消息（图\
  \ 12.13）。\n\n**图 12.13.** 完成的应用程序\n\n![Image](img/00152.jpg)\n\n用户第一次遇到颜色选择器时，可能会感到困惑。如果你点击颜色选择器的边缘，边缘会变亮，颜色面板会弹出，且选择器将进入\
  \ `active` 模式。\n\n### 深入好奇者：NSBundle\n\n一个*包*（bundle）是应用程序可能使用的资源目录。资源包括图像、声音、编译后的代码和\
  \ NIB 文件。（用户通常使用“插件”一词而不是“包”）。`NSBundle` 类是处理“包”的一种非常优雅的方式。\n\n你的应用程序就是一个包。在 Finder\
  \ 中，应用程序对用户来说就像其他任何文件，但它实际上是一个填充了 NIB 文件、编译后的代码和其他资源的目录。我们称该目录为应用程序的*主包*（main bundle）。\n\
  \n包中的某些资源是可以进行本地化的。例如，你可以有两个版本的 `foo.nib`，一个给英语用户使用，一个给法语用户使用。该包将有两个子目录：`English.lproj`\
  \ 和 `French.lproj`。你会在每个目录下放入对应版本的 `foo.nib`。当你的应用程序请求包加载 `foo.nib` 时，如果用户将首选语言设置为法语，包将自动加载\
  \ `foo.nib` 的法语版本。我们将在第 16 章介绍本地化。\n\n要获取应用程序的主包，使用以下代码：\n\n```objc\nNSBundle *myBundle\
  \ = [NSBundle mainBundle];\n```\n\n这是最常用的包。但如果你需要访问另一个目录中的资源，可以请求特定路径下的包：\n\n```objc\n\
  NSBundle *goodBundle;\ngoodBundle = [NSBundle bundleWithPath:@\"~/Library/Application\
  \ Support/MyApp/Good.bundle\"];\n```\n\n一旦你有了一个 `NSBundle` 对象，就可以向它请求资源：\n\n```objc\n\
  // 扩展名是可选的\nNSString *path = [goodBundle pathForImageResource:@\"Mom\"];\nNSImage\
  \ *momPhoto = [[NSImage alloc] initWithContentsOfFile:path];\n```\n\n包可能包含一个代码库。通过从包中请求类，包将链接该库并按该名称搜索类：\n\
  \n```objc\nClass newClass = [goodBundle classNamed:@\"Rover\"];\nid newInstance\
  \ = [[newClass alloc] init];\n```\n\n如果你不知道包中任何类的名称，可以简单请求主类（principal class）：\n\
  \n```objc\nClass aClass = [goodBundle principalClass];\nid anInstance = [[aClass\
  \ alloc] init];\n```\n\n如你所见，`NSBundle` 在许多方面都非常方便。在本节中，`NSBundle` 负责（在后台）加载 NIB\
  \ 文件。如果你想在没有 `NSWindowController` 的情况下加载 NIB 文件，可以这样做：\n\n```objc\nBOOL successful\
  \ = [NSBundle loadNibNamed:@\"About\" owner:someObject];\n```\n\n注意，你需要提供将作为文件所有者的对象。\n\
  \n### 挑战\n\n创建一个带有自定义关于（About）面板的 XIB 文件。为 `AppController` 添加一个出口（outlet）以指向新窗口。还要添加一个\
  \ `showAboutPanel:` 方法。使用 `NSBundle` 加载 NIB，并使 `AppController` 文件所有者。\n\n## 第 13\
  \ 章. 用户默认\n\n许多应用程序都有偏好面板，允许用户选择首选的外观或行为。用户的选择会被保存在用户主目录下的用户默认数据库中。注意，只有与出厂设置不同的选项才会保存在用户默认数据库中。如果你进入\
  \ `~/Library/Preferences`，就可以看到你的用户默认数据库。\n\n`NSUserDefaults` 类允许你注册默认值、保存偏好并读取它们。`changeBackgroundColor:`\
  \ 和 `checkboxChanged:` 方法现在相当无聊——它们只是打印出一条消息。在下一章中，你将更改它们以更新用户的默认设置数据库。\n\n### NSDictionary\
  \ 和 NSMutableDictionary\n\n在对默认设置进行操作之前，我们需要讨论 `NSDictionary` 和 `NSMutableDictionary`\
  \ 类。字典是键值对的集合。键是字符串，值是对象。\n\n\n\n\n> 向字典添加一个条目，包含 `aKey` 其对应的值对象 `anObject`。值对象在被添加到字典之前会收到一个\
  \ `retain` 消息。如果接收者已存在该 `aKey`，则接收者该键之前的值对象将收到一个 `release` 消息，并由 `anObject` 取代其位置。\n\
  \n## NSUserDefaults\n\n每个应用程序都带有一组“出厂”默认设置。当用户编辑其默认设置时，只有用户意愿与出厂默认之间的差异会被存储在用户的默认数据库中。因此，每次应用程序启动时，你都需要提醒它出厂默认设置。此操作被称为\
  \ `registering defaults`（注册默认）。\n\n注册之后，你将使用用户默认对象来确定用户希望应用程序如何运行。这个过程被称为 `reading\
  \ and using the defaults`（读取和使用默认）。用户默认数据库的数据将自动从文件系统读取。\n\n在你的偏好设置面板中，你将允许用户设置默认值。对默认对象的更改将自动写入文件系统。此过程被称为\
  \ `setting the defaults`（设置默认）（图 13.3）。\n\n**图 13.3.** NSUserDefaults 与文件系统\n\n\
  ![Image](img/00155.jpg)\n\n以下是 `NSUserDefaults` 中实现的一些常用方法：\n\n> `+ (NSUserDefaults\
  \ *)standardUserDefaults`\n\n> 返回共享默认对象。\n\n> `- (void)registerDefaults:(NSDictionary\
  \ *)dictionary`\n\n> 为应用程序注册出厂默认设置。\n\n> `- (void)setBool:(BOOL)value forKey:(NSString\
  \ *)defaultName`\n\n> `- (void)setFloat:(float)value forKey:(NSString *)defaultName`\n\
  \n> `- (void)setInteger:(NSInteger)value forKey:(NSString *)defaultName`\n\n> `-\
  \ (void)setObject:(id)value forKey:(NSString *)defaultName`\n\n> 用于更改和保存用户意愿的方法。\n\
  \n> `- (BOOL)boolForKey:(NSString *)defaultName`\n\n> `- (float)floatForKey:(NSString\
  \ *)defaultName`\n\n> `- (NSInteger)integerForKey:(NSString *)defaultName`\n\n>\
  \ `- (id)objectForKey:(NSString *)defaultName`\n\n> 读取默认设置的方法。如果用户没有更改它们，则返回出厂默认设置。\n\
  \n> `- (void)removeObjectForKey:(NSString *)defaultName`\n\n> 移除用户的偏好设置，因此应用程序将恢复使用出厂默认设置。\n\
  \n### 默认类型的优先级\n\n到目前为止，我们讨论了两个级别的优先级：用户写入其默认数据库的内容会覆盖出厂默认设置。事实上，存在更多级别的优先级。这些默认设置级别被称为\
  \ `domains`（域）。以下是应用程序使用的域，优先级从高到低排序：\n\n> * *Arguments*: 通过命令行传递。大多数人通过双击图标启动程序，而不是通过命令行操作，因此此功能在生产应用中很少使用。\n\
  > * *Application*: 来自用户默认数据库的内容。\n> * *Global*: 用户为整个系统设置的内容。\n> * *Language*: 根据用户的偏好语言设置的内容。\n\
  > * *Registered defaults*: 应用程序的出厂默认设置。\n\n### 设置默认值\n\n#### 应用程序的标识符\n\n在 `~/Library/Preferences`\
  \ 中为此应用程序创建的 `plist` 文件是什么？默认情况下，它使用创建它的应用程序的标识符。你将在第 10 章 中将此标识符设置为 `com.bigneranch.RaiseMan.plist`。\n\
  \n#### 为名称创建键\n\n你将在应用程序的多个类中注册、读取和设置默认值。为了确保始终使用相同的名称，你应该在一个文件中声明这些字符串，然后在使用名称的地方导入该文件。有几种方法可以实现（例如使用\
  \ C 预处理器的 `#define`），但大多数情况下使用全局变量。在导入之后，向 `PreferenceController.h` 添加以下行：\n\n```objc\n\
  extern NSString *const BBgColorKey;\nextern NSString *const EmptyDocKey;\n```\n\n\
  现在在 `PreferenceController.m` 中定义这些变量。将它们放在导入行之后、@implementation` 之前：\n\n```objc\n\
  NSString *const BBgColorKey = @\"TableBackgroundColor\";\nNSString *const EmptyDocKey\
  \ = @\"TableDocumentFlag\";\n```\n\n为什么我们要声明只包含常量字符串的全局变量呢？毕竟，你只需要记住字符串并在需要时输入它即可。问题在于你可能会拼错字符串。如果字符串被引号包围，编译器会接受它。相比之下，如果你拼错了变量，编译器会捕获你的错误。为了防止变量与其他变量冲突，给它们加上前缀\
  \ `BNR`（代表 Nerd Ranch）。Cocoa 变量的前缀是 `NS`。这些前缀在使用第三方开发的框架时很重要（注意类名也是全局的）。\n\n###\
  \ 注册默认值\n\n每个类在任何其他操作之前都会收到 `initialize` 消息。为了确保你的默认值尽早注册，请在 `AuthController.m`\
  \ 中重写 `initialize`：\n\n```objc\n+ (void)initialize {\n    // 创建字典\n    NSMutableDictionary\
  \ *defaultValues = [NSMutableDictionary dictionary];\n\n    // 归档颜色对象\n    NSData\
  \ *colorAsData = [NSKeyedArchiverDataDataRootObject:[NSColor yellowColor]];\n\n\
  \    // 将默认值放入字典\n    [defaultValues setObject:colorAsData forKey:BBgColorKey];\
  \ own[defaultValues setObject:[NSNumber numberWithBool:YES] forKey:EmptyDocKey];\n\
  \n    // 注册默认值字典\n    [[NSUserDefaults standardUserDefaults] registerDefaults:defaultValues];\
  \ own    NSLog(@\"registered defaults: %@\", defaultValues);\n}\n```\n\n这是一个类方法；这就是为什么它的声明带有\
  \ `+` 前缀。注意，我们必须将颜色存储为数据对象。`NSColor` 对象并不知道如何将自己写入 XML，因此我们将其封装进可以执行此操作的数据对象中。有一组类知道如何将自己写入\
  \ XML，称为属性列表（property list）类：`NSString`、`NSArray`、`NSDictionary`、`NSDate`、`NSData`\
  \ 和 `NSNumber`。属性列表由这些类的任意组合组成。例如，包含日期数组的字典就是一个属性列表。\n\n### 让用户编辑默认值\n\n接下来，你将修改\
  \ `PreferenceController` 类以便面板能够更新默认数据库。在 `PreferenceController.h` 中声明以下方法：\n\n\
  ```objc\n+ (NSColor *)preferenceTableBgColor;\n+ (void)setPreferenceTableBgColor:(NSColor\
  \ *)color;\n+ (BOOL)preferenceEmptyDoc;\n+ (void)setPreferenceEmptyDoc:(BOOL)emptyDoc;\n\
  ```\n\n这些类方法将使我们更容易设置和获取当前默认值，并抽象掉存储偏好的细节。\n\n在 `PreferenceController.m` 中实现新的类方法：\n\
  \n```objc\n+ (NSColor *)preferenceTableBgColor {\n    NSUserDefaults *defaults =\
  \ [NSUserDefaults standardUserDefaults];\n    NSData *colorAsData = [defaults objectForKey:BBgColorKey];\n\
  \    return [NSKeyedUnarchiver unarchiveObjectWithData:colorAsData];\n}\n\n+ (void)setPreferenceTableBgColor:(NSColor\
  \ *)color {\n    NSData *colorAsData = [NSKeyedArchiver archivedDataWithRootObject:color];\n\
  }\n```\n\n\n\n\n\n```objc\n[[NSUserDefaults standardUserDefaults] setObject:colorAsData\
  \ forKey:BNRTableBgColorKey];\n}\n\n+ (BOOL)preferenceEmptyDoc\n{\n    NSUserDefaults\
  \ *defaults = [NSUserDefaults standardUserDefaults];\n    return [defaults boolForKey:BNREmptyDocKey];\n\
  }\n\n+ (void)setPreferenceEmptyDoc:(BOOL)emptyDoc\n{\n    [[NSUserDefaults standardUserDefaults]\
  \ setBool:emptyDoc forKey:BNREmptyDocKey];\n}\n```\n\n现在让我们修改 `windowDidLoad` 和动作方法来使用这些偏好：\n\
  \n```objc\n- (void)windowDidLoad\n{\n    [super windowDidLoad];\n    [colorWell\
  \ setColor:[PreferenceController preferenceTableBgColor]];\n    [checkbox setState:[PreferenceController\
  \ preferenceEmptyDoc]];\n}\n\n- (IBAction)changeBackgroundColor:(id)sender\n{\n\
  \    NSColor *color = [colorWell color];\n    [PreferenceController setPreferenceTableBgColor:color];\n\
  }\n\n- (IBAction)changeNewEmptyDoc:(id)sender\n{\n    NSInteger state = [checkbox\
  \ state];\n    [PreferenceController setPreferenceEmptyDoc:state];\n}\n```\n\n在\
  \ `windowDidLoad` 方法中，你正在读取默认值并让颜色选择器和复选框反映当前的设置。在 `changeBackgroundColor:` 和 `changeNewEmptyDoc:`\
  \ 中，你正在更新默认数据库。\n\n你现在应该可以编译并运行应用程序了。它将读取和写入默认数据库，因此设置面板将显示你上次选择的颜色，并指示复选框的开启状态。然而，你还没有对这些信息进行任何操作，因此无标题文档将继续出现，表格视图的背景将继续保持白色。\n\
  \n### 使用默认值\n\n现在你将使用默认值。首先，你将让 `AppController` 成为 `NSApplication` 对象的代理，并根据用户默认抑制创建无标题文档。然后，在\
  \ `RMDocument` 中，你将从用户默认设置表格视图的背景颜色。\n\n#### 抑制无标题文档的创建\n\n与之前一样，创建代理有两个步骤：实现代理方法并将\
  \ `delegate` outlet 指向该对象（图 13.4）。\n\n**图 13.4。** 代理抑制了无标题文档的创建\n\n![Image](img/00156.jpg)\n\
  \n在自动创建新的无标题文档之前，`NSApplication` 对象将向其代理发送 `applicationShouldOpenUntitledFile:`\
  \ 消息。在 `AppController.m` 中，添加以下方法：\n\n```objc\n- (BOOL)applicationShouldOpenUntitledFile:(NSApplication\
  \ *)sender\n{\n    NSLog(@\"applicationShouldOpenUntitledFile:\");\n    return [PreferenceController\
  \ preferenceEmptyDoc];\n}\n```\n\n要让你的 `AppController` 成为 `NSApplication` 对象的代理，打开\
  \ `MainMenu.xib` 文件，并 Control-点击 File Owner（代表 `NSApplication` 对象）以弹出连接窗口。从 `delegate`\
  \ 拖动到你的 `AppController`。\n\n#### 设置表格视图的背景颜色\n\n打开 `RMDocument.m` 并在顶部导入 `PreferenceController.h`。这将允许我们使用\
  \ `BNRTableBgColorKey` 常量。\n\n```objc\n#import \"PreferenceController.h\"\n```\n\
  \n在新文档窗口的 NIB 文件被成功反归化后，你的 `RMDocument` 对象将接收 `windowControllerDidLoadNib:` 消息。那时，你可以更新表格视图的背景颜色。\n\
  \n你已经在 `RMDocument.m` 中有了这个方法；只需将其修改为如下所示：\n\n```objc\n- (void)windowControllerDidLoadNib:(NSWindowController\
  \ *)aController\n{\n    [super windowControllerDidLoadNib:aController];\n    [tableView\
  \ setBackgroundColor:[PreferenceController preferenceTableBgColor]];\n}\n```\n\n\
  编译并运行你的应用程序。\n\n注意，Mac OS X Lion 的状态恢复功能可能会让观察新文档偏好变得困难。你可以通过编辑 Xcode 中的 `Run` scheme\
  \ 来禁用状态恢复。打开 Product 菜单并选择 Edit Scheme。选择 `Run RaiseMan.app` scheme，切换到 Options\
  \ 面板，并勾选 Disable state restoration（图 13.5）。\n\n**图 13.5。** 禁用状态恢复\n\n![Image](img/00157.jpg)\n\
  \n### 给更具好奇心的读者：NSUserDefaultsController\n\n有时，你想绑定来自 `NSUserDefaults` 对象的值。`NSUserDefaultsController`\
  \ 使这一切成为。例如，如果你想将复选框绑定到 `NSUserDefaultsController`（图 13.6）。\n\n**图 13.6。** 绑定到 NSUserDefaultsController\n\
  \n![Image](img/00158.jpg)\n\n### 给更具好奇心的读者：读取和写入默认值\n\n用户默认值位于 `~/Library/Preferences/`。要从命令行编辑它，你需要使用一个名为\
  \ `defaults` 的工具。要查看 Xcode 的默认设置，你可以打开终端并输入此。前几行如下：\n\n```\n{\n    DocViewerHasSetPrefs\
  \ = YES;\n    NavBrowserPreferedColumnWidth = 155;\n    NavLastCurrentDirectory\
  \ = \"~/RaiseMan\";\n    NavLastRootDirectory = \"~\";\n    NavPanelExpandedSize\
  \ = \"{518, 400}\";\n    NavPanelFileListMode = 1;\n}\n```\n\n你还可以写入默认值。要将 `NSOpenPanel`\
  \ 中的 Xcode 默认目录设置为 `/Users` 目录，你可以输入 `defaults write com.apple.Xcode NavLastRootDirectory\
  \ /Users`。尝试 `defaults read bigneranch.RaiseMan`。要查看全局默认值，输入 `defaults read NSDomain`。\n\
  \n### 挑战\n\n在设置面板添加一个按钮来移除所有用户设置。将按钮命名为 Reset Preferences。忘记更新设置窗口以反映新的默认值。\n\n\
  ## 第 14 章：使用通知\n\n当用户打开了多个 RaiseMan 文档时，他可能决定紫色背景太难以阅读。用户打开设置面板并更改背景颜色，但遗憾地发现现有窗口的颜色并没有变化。当用户就这个问题向你发送电子邮件时，你回复说：“默认值只在文档窗口创建时读取。只需保存文档、关闭并重新打开即可。”作为回应，用户给你发了一封刻薄的邮件。更好的做法是更新所有现有窗口。但有多少个呢？\n\
  \n### 什么是通知，什么不是\n\n每个运行的应用程序都对某些通知感兴趣（如果有人发现了丢失的狗，请写信给我）；我们将注册的对象称为*观察者*（observer）。其他对象可以发布通知（我发现了一只丢失的狗）。该通知随后会被转发给所有感兴趣的对象。我们将发布通知的对象称为*发布者*（poster）。\n\
  \n许多标准 Cocoa 类都会发布通知：窗口会发送大小已变化的通知。当表格视图的选择改变时，表格视图会发送通知。标准 Cocoa 对象发送的通知可以在在线文档中列出。\n\
  \n\n\n\n\n在我们的示例中，你将把所有的 `RMDocument` 对象注册为观察者。当用户选择新颜色时，你的偏好控制器（preference controller）将发送一个通知。收到通知后，`RMDocument`\
  \ 对象将更改背景颜色。\n\n在 `RMDocument` 对象被释放之前，你必须将其从通知中心的观察者列表中移除。通常，这是在 `dealloc` 方法中完成的。（如果你使用垃圾回收，`RMDocument`\
  \ 实例在被释放时将自动从通知中心移除。）\n\n### 通知“不是”什么\n\n通知中心允许应用程序中的对象向*同一应用程序内*的其他对象发送通知。当程序员第一次听到通知中心时，他们有时会认为它是进程间通信的一种形式。（“我将在一个应用程序中创建一个观察者，并从另一个应用程序中的对象发送通知。”）\n\
  \n通知不会在应用程序之间传递。（如果需要在不同应用程序之间传递通知，请查阅 `NSDistributedNotificationCenter`。）\n\n###\
  \ NSNotification\n\n通知对象非常简单。通知就像一个信封，发布者将在其中放入发送给观察者的信息。通知有两个重要的实例变量：`name` 和 `object`。几乎所有情况下，`object`\
  \ 都是发布通知的对象的指针。（它类似于回执。）\n\n因此，通知还有两个有趣的方法：\n\n```objc\n- (NSString *)name\n- (id)object\n\
  ```\n\n### NSNotificationCenter\n\n`NSNotificationCenter` 是操作的核心。它允许你执行三件事：注册观察者对象、发布通知和注销观察者。\n\
  \n以下是 `NSNotificationCenter` 实现的一些常用方法：\n\n```objc\n+ (NSNotificationCenter *)defaultCenter\n\
  ```\n返回通知中心。\n\n```objc\n- (void)addObserver:(id)anObserver\n              selector:(SEL)aSelector\n\
  \              name:(NSString *)notificationName\n              object:(id)anObject\n\
  ```\n注册 `anObserver` 以接收名为 `notificationName` 且包含 `anObject` 的通知（图 14.1）。当发布包含对象\
  \ `anObject` 的名为 `notificationName` 的通知时，`anObserver` 将收到一个以该通知为参数的 `aSelector`\
  \ 消息。\n\n**图 14.1.** 注册通知\n\n![Image](img/00159.jpg)\n\n> 如果 `notificationName`\
  \ 为 `nil`，通知中心向观察者发送所有对象匹配 `anObject` 的通知。\n\n> 如果 `anObject` 为 `nil`，通知中心向观察者发送所有名为\
  \ `notificationName` 的通知。\n\n> 观察者*不会*被通知中心保留。注意，该方法接收一个选择器（selector）。\n\n```objc\n\
  - (void)postNotification:(NSNotification *)notification\n```\n向通知中心发布通知（图 14.2）。\n\
  \n```objc\n- (void)postNotificationName:(NSString *)aName\n                    \
  \  object:(id)anObject\n```\n**图 14.2.** 发布通知\n\n![Image](img/00160.jpg)\n\n> 创建并发布一个通知。\n\
  \n```objc\n- (void)removeObserver:(id)observer\n```\n从观察者列表中移除 `observer`。\n\n###\
  \ 发布通知\n\n发布通知是最简单的一步，因此你将从这里开始。当接收到 `changeBackgroundColor:` 消息时，你的 `PreferenceController`\
  \ 对象将发布一个带有新颜色的通知。\n\n你将把通知命名为 `@\"BNRColorChanged\"`，但你会为该常量创建一个全局变量。（经验丰富的程序员会给通知加上前缀，以防它与应用程序中可能运行的其他通知发生冲突。）打开\
  \ `PreferenceController.h` 并与其他字符串常量一起添加该声明：\n\n```objc\nextern NSString * const\
  \ BNRColorChangedNotification;\n```\n\n在 `PreferenceController.m` 中，定义该常量：\n\n```objc\n\
  NSString * const BNRColorChangedNotification = @\"BNRColorChanged\";\n```\n\n使你在\
  \ `PreferenceController.m` 中的 `changeBackgroundColor:` 方法看起来如下所示：\n\n```objc\n-\
  \ (IBAction)changeBackgroundColor:(id)sender\n{\n    NSColor *color = [colorWell\
  \ color];\n    [PreferenceController setPreferenceTableBgColor:color];\n\n    NSNotificationCenter\
  \ *nc = [NSNotificationCenter defaultCenter];\n    NSLog(@\"Sending notification\"\
  );\n    [nc postNotificationName:BNRColorChangedNotification object:self];\n}\n\
  ```\n\n### 注册为观察者\n\n要注册为观察者，你必须提供观察者、感兴趣的通知名称以及发布该通知的对象。（记住该方法接收一个选择器，即当通知到达时你想要发送的消息。）\n\
  \n如下编辑你的 `RMDocument` 类的 `init` 方法：\n\n```objc\n- (id)init\n{\n    self = [super\
  \ init];\n    if (self) {\n        NSNotificationCenter *nc = [NSNotificationCenter\
  \ defaultCenter];\n        [nc addObserver:self\n                  selector:@selector(handleColorChange:)\n\
  \                      name:BNRColorChangedNotification\n                    object:nil];\n\
  \        NSLog(@\"Registered with notification center\");\n    }\n    return self;\n\
  }\n```\n\n然后实现 `dealloc` 以从通知中心移除 `RMDocument` 实例：\n\n```objc\n- (void)dealloc\n\
  {\n    [[NSNotificationCenter defaultCenter] removeObserver:self];\n}\n```\n\n###\
  \ 处理到达的通知\n\n当通知到达时，`handleColorChange:` 方法会被调用。现在，只需记录它的到达即可。在 `RMDocument.m` 文件中添加此方法：\n\
  \n```objc\n- (void)handleColorChange:(NSNotification *)note\n{\n    NSLog(@\"Received\
  \ notification: %@\", note);\n}\n```\n\n编译并运行应用程序。注意，当在偏好面板中编辑颜色时，会发送并接收通知。\n\n\
  ### 给更好奇的人：代理（Delegates）与通知\n\n\n\n\n一个让自己成为标准 Cocoa 对象的代理（delegate）的对象，可能也对接收该对象的通知感兴趣。例如，如果你为一个窗口实现了一个代理来处理窗口的\
  \ `windowShouldClose:` 代理方法，那么该对象很可能对来自同一个窗口的 `NSWindowDidResizeNotification` 也感兴趣。\n\
  \n如果一个标准 Cocoa 对象拥有代理并且会发布通知，那么该代理将自动注册为它所实现方法的观察者（observer）。如果你正在实现这样一个代理，你如何知道该调用哪个方法呢？\n\
  \n命名规范非常简单：从通知的名称开始。删除开头的 `NS`，并将首字母设为小写。删除末尾的 `Notification`。添加一个冒号。例如，为了在窗口发布\
  \ `NSWindowDidResizeNotification` 时接收到通知，代理句类应实现以下方法：\n\n```objc\n- (void)windowDidResize:(NSNotification\
  \ *)aNotification\n```\n\n该方法将在窗口调整大小后被自动调用。你也可以在 `NSWindow` 类的文档和头文件中找到此方法。\n\n\
  ### 挑战\n\n让你的应用程序在失去活动状态时发出蜂鸣声。`NSApplication` 会发布 `NSApplicationDidResignActiveNotification`\
  \ 通知。你的 `AppController` 是 `NSApplication` 的代理。`NSBeep()` 会导致系统蜂鸣。\n\n## 第 15 章.\
  \ 使用警报面板（Alert Panels）\n\n有时，你可能想通过警报面板向用户发出某种警告。警报面板很容易创建。虽然 Cocoa 中的大多数内容都是面向对象的，但显示模态警报面板通常是通过一个\
  \ C 函数完成的：`NSRunAlertPanel()`。以下是其声明：\n\n```objc\nNSInteger NSRunAlertPanel(NSString\
  \ *title,\n                          NSString *msg,\n                          NSString\
  \ *defaultButton,\n                          NSString *alternateButton,\n      \
  \                    NSString *otherButton, ...);\n```\n\n以下代码将产生如图 15.1 所示的警报面板：\n\
  \n```objc\nNSInteger choice = NSRunAlertPanel(@\"Title\", @\"Message\",\n      \
  \                           @\"Default\", @\"Alternate\", @\"Other\");\n```\n\n\
  **图 15.1.** 示例警报面板\n\n![Image](img/00161.jpg)\n\n注意，面板上的图标将是对应应用程序的图标。第二个和第三个按钮是可选的。要防止某个按钮出现，将其标签替换为\
  \ `nil`。\n\n`NSRunAlertPanel()` 函数返回一个 `int`，指示用户点击了哪个按钮。这些常量有全局变量：`NSAlertDefaultReturn`、`NSAlertAlternateReturn`\
  \ 和 `NSAlertOtherReturn`。\n\n注意 `NSRunAlertPanel()` 接受可变参数。第二个字符串可能包含类似 `printf`\
  \ 的标记。在 `otherButton` 标签之后提供的值将被替换。因此，以下代码将产生如图 15.2 所示的警报面板：\n\n```objc\nNSInteger\
  \ choice = NSRunAlertPanel(@\"Title\", @\"Message can have %@\",\n             \
  \                    @\"Default\", @\"Alternate\", nil,\n                      \
  \           @\"Format Specifiers\");\n```\n\n**图 15.2.** 另一个警报面板示例\n\n![Image](img/00162.jpg)\n\
  \n警报面板以模态方式运行；也就是说，应用程序中的其他窗口在——之前不会接收事件。\n\n### 让用户确认删除\n\n如果用户点击按钮，警报面板将以工作表（sheet）的形式出现（图\
  \ 15.3）。\n\n**图 15.3.** 完成\n\n![Image](img/00163.jpg)\n\n要启用此行为，打开 `RMDocument.xib`，选择视图（table\
  \ view），打开检查器（Inspector）。允许用户进行选择（图 15.4）。\n\n**图 15.4.** 表视图\n\n![Image](img/00164.jpg)\n\
  \n警报面板以模态方式运行；也就是说，应用程序中的其他窗口在——之前不会接收事件。\n\n警报也可以作为工作表运行。\n\n在 Xcode 中，按住 Control\
  \ 从删除按钮拖动到文件图标，使文件所有者（File’s Owner）成为目标。将 `action` 设置为 `removeEmployee:`（图 15.5）。\n\
  \n**图 15.5.** 更改删除按钮的目标和动作\n\n![Image](img/00165.jpg)\n\n如果你想让删除按钮向数组控制器（array controller）发送消息以删除删除记录：\n\
  \n在 Xcode 中，打开 `RMDocument.h` 并添加方法：\n\n```objc\n- (IBAction)removeEmployee:(id)sender;\n\
  ```\n\n在 `RMDocument.m` 中，实现 `removeEmployee`：\n\n```objc\n- (IBAction)removeEmployee:(id)sender\
  \ {\n    NSArray *selectedPeople = [employeeController selectedObjects];\n    NSLog(@\"\
  Starting alert\");\n    NSAlert *alert = [NSAlert alertWithMessageText:@\"Do you\
  \ want to remove these people?\"\n                                            informativeText:@\"\
  %d people will be removed.\",\n                                            defaultButton:@\"\
  Remove\"\n                                            alternateButton:@\"Cancel\"\
  \n                                            otherButton:nil];\n    [alert beginSheetModalFor:window\
  \ completionHandler:(NSInteger)choice {\n        NSLog(@\"Alert ended\");\n    \
  \    if (choice == NSAlertDefaultReturn) {\n            [employeeController remove:nil];\n\
  \        }\n    }];\n}\n```\n\n该方法将在窗口调整大小后被自动调用。你也可以在 `NSWindow` 类的文档和头文件中找到此方法。\n\
  \n### 挑战\n\n让你的应用程序在失去活动状态时发出蜂鸣声。`NSApplication` 会发布 `NSApplicationDidResignActiveNotification`。你的\
  \ `AppController` 是 `NSApplication` 的代理。`NSBeep()` 会导致系统蜂鸣。\n\n## 第 16 章. 本地化\n\n\
  如果你创建的应用程序，你想与全世界分享。不幸的是，我们并不说同一种语言。假设你想让你的 RaiseMan 应用对法语用户可用。我们会说，“你正为法语用户本地化\
  \ RaiseMan。”\n\n如果你正在为世界创建一个应用程序，你应该计划至少为以下语言进行本地化：英语、法语、西班牙语、德语、荷兰语、意大利语和日语。显然，你不想为每个语言重写整个程序。事实上，我们的目标是确保你不需要为每个语言重写任何\
  \ Objective-C 代码。这样，全世界的国家都可以和平地使用同一个执行文件。\n\n与其创建多个执行文件，不如对资源本地化并创建字符串表。在你的项目目录中，`en.lproj`\
  \ 目录持有所有英语用户的资源：XIB 文件、图像和声音。为了为法语用户本地化，你将添加一个 `fr.lproj` 目录。该目录中的 XIB、图像和声音适用于法语用户。在运行时，应用程序将自动使用符合用户语言偏好的资源版本。\n\
  \n那么应用程序中那些通过编程使用语言的地方呢？例如，在 `RMDocument.m` 中，你有如下的一行代码：\n\n```objc\nNSAlert *alert\
  \ = [NSAlert alertWithMessageText:`\n```\n\n\n\n\n```objc\n@\"Do you really want\
  \ to remove these people?\"\ndefaultButton:@\"Remove\"\nalternateButton:@\"Cancel\"\
  \notherButton:nil\ninformativeTextWithFormat:@\"%d people will be removed.\",\n\
  [selectedPeople count]]\n```\n\n这个 Alert 表单并不会带来世界和平。对于每种语言，你将有一个字符串表。你会要求 `NSBundle`\
  \ 查找字符串，而 `NSBundle` 会自动使用适用于用户语言偏好的版本（图 16.1)）。\n\n**图 16.1.** 已完成的应用程序\n\n![Image](img/00166.jpg)\n\
  \n### 本地化 NIB 文件\n\n在 Xcode 中，打开 `RMDocument.xib` 并打开文件检查器（File Inspector）。点击本地化（Localization）区域下的\
  \ `+` 按钮（图 16.2）。\n\n**图 16.2.** 创建 RMDocument.xib 的法语版本\n\n![Image](img/00167.jpg)\n\
  \n系统会提示你选择一个区域（locale）。选择法语。\n\n如果你在 Finder 中查看，你会发现 `fr.lproj` 中创建了 `en.lproj/RMDocument.xib`\
  \ 的副本。你将对这个副本进行法语化处理。在 Xcode 项目导航器（Project Navigator）中，你将有两个版本的 `RMDocument.xib`：英语和法语，如\
  \ 图 16.3 所示。点击法语版本在编辑器中打开它。\n\n**图 16.3.** MainMenu.xib 的两个版本\n\n![Image](img/00168.jpg)\n\
  \n让你的窗口看起来像 图 16.4。\n\n**图 16.4.** 已完成的界面\n\n![Image](img/00169.jpg)\n\n要输入带重音符号的字符，你需要使用\
  \ `Option` 键。例如，要输入 `é`，在按住 `Option` 键的同时输入 `e`，然后再次输入 `e`。在 Mac OS Lion 中，你还可以按住一个键一秒钟显示显示带有变调标记的弹出窗口（在系统设置的“国际”页面中，你可以将“键盘查看器”添加到输入法。如果你使用大量不寻常字符，键盘查看器可以帮助你学习哪些组合可以生成字符）。\n\
  \n到此时，你已经创建了一个本地化资源。请注意，如果你对程序做了很多更改，你可能需要同时更新两个 XIB 文件（法语版本和英语版本）。例如，发现按钮对于法语翻译来说太窄了，因此相应地调整了窗口大小。因此，在应用程序完成并测试之前对其进行本地化是一个好主意。\n\
  \n构建你的应用。在运行之前，打开系统设置中的“语言与文本”页面。将 `Français` 拖到列表顶端，将其设置为你的首选语言。现在运行你的应用程序。注意，NIB\
  \ 的法语版本会被自动使用。还要注意，文档已经为你处理了某些本地化工作。例如，如果你尝试关闭一个未保存的文档，系统会用法语询问你是否要保存更改。\n\n###\
  \ 字符串表\n\n对于每种语言，你可以创建多个字符串表。字符串表是一个扩展名为 `.strings` 的文件。例如，如果你有一个查找（Find）面板，你可能会为每种语言创建一个\
  \ `Find.strings` 文件。该文件将包含查找面板使用的短语，如“`None found.`（未找到任何内容）”。字符串表只是键值对的集合。键和值都是用引号括的字符串，键值对以分号结束：\n\
  \n```\n\"Key1\" = \"Value1\";\n\"Key2\" = \"Value2\";\n```\n\n要为给定的键查找值，你使用 `NSBundle`：\n\
  \n```objc\nNSBundle *main;\nNSString *aString;\nmain = [NSBundle mainBundle];\n\
  aString = [main localizedForKey:@\"Key1\" value:@\"DefaultValue1\"];\n```\n\n这将在\
  \ `Find.strings` 文件中查找 `\"Key1\"` 的值。如果在用户的首选语言中没有找到，将搜索第二种首选语言，依此类推。如果在用户的任何语言中都未找到该键，将返回\
  \ `\"DefaultValue1\"`。如果你不提供表名，将使用 `Localizable`。大多数简单的应用程序为每种语言都有一个字符串表：`Localizable.strings`。\n\
  \n#### 创建字符串表\n\n要为英语使用者创建一个 `Localizable.strings` 文件，请在 Xcode 中选择 `New -> New File...`\
  \ 菜单项。在 Mac OS X Resource 类别中，创建一个新的 Strings 文件，并将其命名为 `Localizable.strings`。将其保存到\
  \ `en.lproj` 目录中（图 16.5）。\n\n**图 16.5.** 创建英语字符串表\n\n![Image](img/00170.jpg)\n\n\
  编辑新文件以以下文本：\n\n```\n\"REMOVE_MSG\" = \"Do you really want to remove these people?\"\
  ;\n\"REMOVE_INF\" = \"%d people will be removed.\";\n\"REMOVE\" = \"Remove\";\n\"\
  CANCEL\" = \"Cancel\";\n```\n\n保存它。（不要忘记分号！）\n\n现在为该文件创建一个法语的本地化版本。在 Xcode 中选择 `Localizable.strings`\
  \ 文件（目前的英语版本），打开文件检查器，并创建一个本地化变体（图 16.6）。\n\n**图 16.6.** 创建法语字符串表\n\n![Image](img/00171.jpg)\n\
  \n编辑该文件如下：\n\n```\n\"REMOVE_MSG\" = \"Voulez-vous supprimer ces personnes?\";\n\"\
  REMOVE_INF\" = \"%d personnes seront supprimées.\";\n\"REMOVE\" = \"Supprimer\"\
  ;\n\"CANCEL\" = \"Annuler\";\n```\n\n（要创建带有重音符号的 `e`，在按住 `Option` 键的同时输入 `e`。）\n\
  \n当保存带有不寻常字符的文件时，你应该使用 Unicode (UTF-8) 文件编码。在 `fr.lproj/Localizable.strings` 的文件检查器中，确保文本编码设置为\
  \ `UTF-8`。（如果不是，并且出现了一个面板询问你是否要将文件转换为 `UTF-8`，请点击是。）\n\n#### 使用字符串表\n\n显然，当你开发和本地化许多应用程序时，你会开发出一套通用翻译。有一种自动化方法将翻译后的字符串放入\
  \ XIB 文件中将非常方便。这是 `ibtool` 的几种用途之一。\n\n幸运的是，`NSBundle.h` 中定义了一个宏用于此目的：\n\n```objc\n\
  #define NSLocalizedString(key, comment) \\\n[[NSBundle mainBundle] localizedForKey:(key)\
  \ value:@\"\"]\n```\n\n（注意，这个宏完全忽略注释。然而，它被一个名为 `genstrings` 的工具使用，该工具扫描代码中对 `NSLocalizedString`\
  \ 宏的调用并创建一个骨架字符串表。）\n\n在 `RMDocument.m` 中，找到运行 Alert 面板的地方。将该行替换为这一行：\n\n```objc\n\
  NSAlert *alert = [NSAlert\nalertWithMessageText:NSLocalizedString(@\"REMOVE_MSG\"\
  , @\"Remove\")\ndefaultButton:NSLocalizedString(@\"REMOVE\", @\"Remove\")\nalternateButton:NSLocalizedString(@\"\
  CANCEL\", @\"Cancel\")\notherButton:nil\ninformativeTextWithFormat:NSLocalizedString(@\"\
  REMOVE_INF\",\n@\"%d people will be removed.\"),\n[selectedPeople count]];\n```\n\
  \n\n\n\n\n`ibtool` 命令从终端中运行，它可以列出 XIB 中的类或对象，还可以将本地化字符串导出到 `plist` 中。以下是如何将 `en.lproj/RMDocument.xib`\
  \ 文件中的本地化字符串导出到名为 `Doc.strings` 的文件：\n\n```bash\ncd RaiseMan/en.lproj\nibtool --generate-stringsfile\
  \ Doc.strings RMDocument.xib\n```\n\n生成的 `Doc.strings` 文件将包含许多类似下方的条目：\n\n```\n\
  /* Class=\"NSTableColumn\";headerCell.title=\"Name\";ObjectID=\"100026\"; */\n\"\
  100026.headerCell.title\" = \"Name\";\n```\n\n要为此 XIB 文件创建一个西班牙语字典，你可以编辑该文件以包含西班牙语条目：\n\
  \n```bash/* Class=\"NSTableColumn\";headerCell.title=\"Name\";ObjectID=\"100026\"\
  ; */\n\"100026.headerCell.title\" = \"Nombre\";\n```\n\n要用此字典中的西班牙语等价替换 XIB 文件中的字符串，你可以这样创建一个新的\
  \ NIB 文件：\n\n```bash\nmkdir ../es.lproj\nibtool --strings-file Doc.strings --write\
  \ ../es.lproj/RMDocument.xib RMDocument.xib\n```\n\n要了解更多关于 `ibtool` 的信息，可以使用 Unix\
  \ 的 `man` 命令：\n\n```bash\nman ibtool\n```\n\n### 给好奇的读者：格式化字符串中令牌的显式排序\n\n当文本从一种语言转换为另一种语言时，单词及其顺序都会发生。例如，一种语言中的单词布局如下：“Ted\
  \ wants a scooter。”而在另一种语言中，顺序可能是“A scooter is what Ted wants.”假设你尝试本地化如下格式化字符串：\n\
  \n```objc\nNSString * theFormat = NSLocalizedString(@\"WANTS\", @\"%@ wants a %@\"\
  );\nx = [NSString stringWithFormat:theFormat, @\"Ted\", @\"Scooter\"];\n```\n\n\
  以下内容对于第一种语言运行正常：\n\n```\n\"WANTS\" = \"%@ wants a %@\";\n```\n\n对于第二种语言，你需要显式指定要插入的令牌索引。这是通过数字和美元符号\
  \ `$` 实现的：\n\n```\n\"WANTS =  A %2$@ is what %1$@ wants\".\n```\n\n## 第 17 章 自定义视图\n\
  \n应用程序中的所有可见对象要么是窗口或视图。在本章中，你将创建一个 `NSView` 的子类。每有时，你可能需要创建一个自定义视图来执行自定义绘图或事件处理。即使你不计划自定义绘图或事件处理，通过学习如何创建一个视图类，你也将学到关于\
  \ Cocoa 如何工作的知识。\n\n窗口是 `NSWindow` 类的实例。每个窗口都有一个视图集合，每个视图负责窗口的一个矩形区域。视图在该矩形内绘图并处理发生在该处的鼠标事件。视图也可以处理键盘事件。你已经处理过\
  \ `NSView` 的几个子类：`NSButton`、`NSTextField`、`NSTableView` 和 `NSColorWell` 都是视图。（注意，窗口不是\
  \ `NSView` 的子类。）\n\n### 视图层次结构\n\n视图按层级结构排列。窗口有一个完全填充其内部区域的内容视图。内容视图通常有几个子视图。每个子视图也可以有自己的子视图。每个视图都知道它的父视图、子视图以及它所属的窗口。\n\
  \n**图 17.1.** 视图层次结构\n\n![Image](img/00172.jpg)\n\n以下是 `NSView` 的相关方法：\n\n```\n\
  - (NSView *)superview;\n- (NSArray *)subviews;\n- (NSWindow *)window;\n```\n\n任何视图都可以有子视图，但大多数视图没有。以下五个视图通常具有子视图：\n\
  \n1. 窗口的内容视图。\n2. `NSBox`。箱体的内容是它的子视图。\n3. `NSScrollView`。出现在滚动视图中的视图是滚动视图的子视图。滚动条也是滚动视图的子视图。\n\
  4. `NSSplitView`。分割视图中的每个视图都是子视图。\n\n**图 17.2.** 分割视图中的滚动视图\n\n![Image](img/00173.jpg)\n\
  \n5. `NSTabView`。当用户选择不同的标签页时，不同的子视图会被换进换出。\n\n**图 17.3.** 视图\n\n### 获取用于自绘图的视图\n\
  \n在本节中，你将创建一个非常简单的视图，它将显示并绘制自己。你的 `StretchView` 是 `NSView` 的子类，并且是窗口内容视图的子视图。\n\n\
  ### 尺寸检查器\n\n你的 `StretchView` 对象是窗口的子视图。这引出了有趣的问题：当父视图调整大小时，视图会发生什么？尺寸检查器（Size Inspector）允许你指定这种行为。\n\
  \n### drawRect\n\n当视图需要绘制自己时，它会收到 `drawRect:` 消息，带有需要绘制或重绘的矩形。该方法是自动调用的——你不需要直接调用它。相反，如果你知道一个视图需要重绘，向视图发送\
  \ `setNeedsDisplay:` 消息：\n\n```objc\n[myView setNeedsDisplay:YES];\n```\n\n\n\n\n\
  在调用 `drawRect:` 之前，系统会对该视图进行**锁定锁定 (locks focus)**。每个视图都有自己的图形上下文，其中包含了视图的坐标系、当前颜色、当前字体以及裁剪矩形。当焦点锁定在某个视图上时，该视图的图形上下文处于激活状态。当焦点解锁时，该图形上下文将不再处于激活状态。每当你发布绘制命令时，这些命令将在当前的图形上下文中执行。\n\
  \n你可以使用 `NSBezierPath` 来绘制线条、圆、曲线和矩形。你可以使用 `NSImage` 在视图上创建复合图像。在这个示例中，你将用一个绿色矩形填充整个视图。\n\
  \n打开 `StretchView.m` 并向 `drawRect:` 方法添加以下代码：\n\n```objc\n- (void)drawRect:(NSRect)dirtyRect\n\
  {\n    NSRect bounds = [self bounds];\n    [[NSColor greenColor] set];\n    [NSBezierPath\
  \ fillRect:bounds];\n}\n```\n\n如图 17.10 所示，`NSRect` 是包含两个成员的结构体：`origin`（一个 `NSPoint`）和\
  \ `size`（一个 `NSSize`）。\n\n**图 17.10。** NSRect, NSSize, 和 NSPoint\n\n![Image](img/00181.jpg)\n\
  \n`NSSize` 是包含两个成员的结构体：`width` 和 `height`（均为 `float` 浮点数）。\n\n`NSPoint` 是包含两个成员的结构体：`x`\
  \ 和 `y`（均为 `float` 浮点数）。\n\n出于性能考虑，在某些地方使用了结构体而不是 Objective-C 类。为了完整起见，这里列出了你可能会使用的所有\
  \ Cocoa 结构体：`NSSize`、`NSPoint`、`NSRect`、`NSRange`、`NSDecimal` 和 `NSAffineTransformStruct`。`NSRange`\
  \ 用于定义子范围。`NSDecimal` 描述具有特定精度和舍入行为的数字。`NSAffineTransformStruct` 描述图形的线性变换。\n\n\
  注意，你的视图通过名为 `bounds` 的 `NSRect` 知道自己的尺寸。在此方法中，你获取了 `bounds` 矩形，将当前颜色设置为绿色，并用当前颜色填充了整个\
  \ `bounds` 矩形。\n\n作为参数传递给视图的 `NSRect` 是“脏”需要重绘的区域。它可能小于整个视图。如果你正在进行非常耗时的绘制，只重绘脏矩形可能会显著提高应用程序的速度。\n\
  \n注意，`setNeedsDisplay:` 会触发视图的所有可见区域重绘。如果你想更精确地指定视图的部分需要重绘，你应该使用 `setNeedsDisplayInRect:`：\n\
  \n```objc\nNSRect dirtyRect;\ndirtyRect = NSMakeRect(0, 0, 50, 50);\n[myView setNeedsDisplayInRect:dirtyRect];\n\
  ```\n\n编译并运行你的应用。尝试调整窗口大小。\n\n### 使用 NSBezierPath 绘制\n\n如果你想绘制线条、椭圆、曲线或多边形，可以使用\
  \ `NSBezierPath`。在本章中，你已经使用 `NSBezierPath` 的类方法 `fillRect:` 为你的视图着色。在本节中，你将使用 `NSBezierPath`\
  \ 绘制连接随机点的线条（图 17.11）。\n\n**图 17.11。** 完成的应用程序\n\n![Image](img/00182.jpg)\n\n你首先需要一个持有\
  \ `NSBezierPath` 实例的实例变量。你还将创建一个返回视图中随机点的实例方法。打开 `StretchView.h` 并使其看起来如下所示：\n\n\
  ```objc\n#import <Cocoa/Cocoa.h>\n\n@interface StretchView : NSView\n{\n    NSBezierPath\
  \ *path;\n}\n- (NSPoint)randomPoint;\n\n@end\n```\n\n在 `StretchView.m` 中，你将重写 `initWithFrame:`。作为\
  \ `NSView` 的指定初始化器，当你创建视图实例时，`initWithFrame:` 会被调用。在你的 `initWithFrame:` 版本中，你将创建路径对象并用连接到随机点的线条填充它。使\
  \ `StretchView.m` 看起来如下所示：\n\n```objc\n#import \"StretchView.h\"\n\n@implementation\
  \ StretchView\n\n- (id)initWithFrame:(NSRect)frame\n{\n    self = [super initWithFrame:frame];\n\
  \    if (self) {\n        // 初始化随机数生成器种子\n        srandom((unsigned)time(NULL));\n\
  \n        // 创建路径对象\n        path = [NSBezierPath bezierPath];\n        [path setLineWidth:3.0];\n\
  \        NSPoint p = [self randomPoint];\n        [path moveToPoint:p];\n      \
  \  int i;\n        for (i = 0; i < 15; i++) {\n            p = [self randomPoint];\n\
  \            [path lineToPoint:p];\n        }\n        [path closePath];\n    }\n\
  \    return self;\n}\n\n- (NSPoint)randomPoint\n{\n    NSRect r = [self bounds];\n\
  \    NSPoint result;\n    result.x = rand() % r.size.width;\n    result.y = rand()\
  \ % r.size.height;\n    return result;\n}\n\n- (void)drawRect:(NSRect)dirtyRect\n\
  {\n    NSRect bounds = [self bounds];\n    [[NSColor greenColor] set];\n    [NSBezierPath\
  \ fillRect:bounds];\n    [[NSColor whiteColor] set];\n    [path stroke];\n}\n\n\
  @end\n```\n\n\n\n\n`NSControl` 继承自 `NSView`。`NSView`（带有其图形上下文）是一个相对较大且创建代价昂的对象。当\
  \ `NSButton` 类被创建时，人们做的第一件事是创建一个包含十行十列按钮的计算器。由于有 100 个微小的视图，其性能低于预期。后来，有人想出了聪明的办法：将按钮的“大脑”移动到另一个对象（不是视图）中，并创建一个大视图（称为\
  \ `NSMatrix`），它作为所有 100 个按钮大脑的视图。按钮大脑的类被名为 `NSButtonCell`（图 17.16)）。\n\n**图 17.16.**\
  \ NSMatrix\n\n![Image](img/00187.jpg)\n\n最后，`NSButton` 变成了一个仅包含 `NSButtonCell` 的视图。单元格负责所有工作，而\
  \ `NSButton` 只需要在窗口中声明一个空间（图 17.17)）。\n\n**图 17.17.** NSButton 和 NSButtonCell\n\n\
  ![Image](img/00188.jpg)\n\n同样，`NSSlider` 是一个带有 `NSSliderCell` 的视图，而 `NSTextField`\
  \ 是一个带有 `NSTextFieldCell` 的视图。相比之下，`NSColorWell` 没有单元格。\n\n要在 Interface Builder\
  \ 编辑器中创建 `NSMatrix` 实例，将带有单元格的控件拖到窗口上，选择 Editor -> Embed In -> Matrix，然后按住 Option\
  \ 拖动大小手柄，直到矩阵具有正确的行列数（图 17.18)）。\n\n**图 17.18.** 按钮矩阵\n\n![Image](img/00189.jpg)\n\
  \n`NSMatrix` 拥有一个 `target` 和一个 `action`。单元格也可以有一个 target 和 action。如果单元格被激活，则使用单元格的\
  \ `target` 和 `action`。如果选定单元格的 `target` 和 `action` 未设置，则使用矩阵的 `target` 和 `action`。\n\
  \n在处理矩阵时，你经常会询问哪个单元格被激活了。单元格也可以赋予一个 tag：\n\n```\n- (IBAction)myAction:(id)sender\
  \ {\n    id theCell = [sender selectedCell];\n    int theTag = [theCell tag];\n\
  \    ...\n}\n```\n\n单元格的 tag 可以在 Interface Builder 中设置。\n\n单元格还用于其他几种类型的对象。例如，基于单元格的\
  \ `NSTableView` 中的数据是由单元格绘制的。\n\n### 给更有好奇心的人：isFlipped\n\nPDF 和 PostScript 都使用标准的笛卡尔坐标系，其中\
  \ `y` 随着页面向上而增加。Quartz 默认遵循此模型。原点通常位于视图的左下角。\n\n对于某些类型的绘制，如果左上角是原点且 `y` 随着页面向下而增加，数学计算会变得更容易。我们称这种视图为\
  \ `flipped`（翻转）。\n\n要翻转视图，你可以在视图类中重写 `isFlipped` 并返回 `YES`：\n\n```\n- (BOOL)isFlipped\n\
  {\n    return YES;\n}\n```\n\n在我们讨论坐标系时，注意 `x` 和 `y` 坐标是以 `points`（点）衡量的。一个点通常定义为“72.0\
  \ points = 1 英寸”。实际上，在你的屏幕上默认“1.0 point = 1 pixel”。但是你可以通过更改坐标系来改变点的大小：\n\n```objc\n\
  // 让视图中的所有内容放大一倍\nNSSize newScale;\nnewScale.width = 2.0;\nnewScale.height = 2.0;\n\
  [myView scaleUnitSquareToSize:newScale];\n[myView setNeedsDisplay:YES];\n```\n\n\
  ### 挑战\n\n`NSBezierPath` 也可以绘制贝塞尔曲线。将直线替换为随机的曲线。（*提示：*查看 `NSBezierPath` 的文档。）\n\n\
  ## 第 18 章 图像和鼠标事件\n\n在上一章中，你绘制了连接随机点的线。一个更有趣的项目应该是编写绘图应用程序。要编写这类应用程序，你需要能够获取并处理鼠标事件。\n\
  \n### NSResponder\n\n`NSView` 继承自 `NSResponder`。所有的事件处理方法都声明在 `NSResponder` 中。我们将在下一章讨论键盘事件。现在我们只对鼠标事件感兴趣。`NSResponder`\
  \ 声明了：\n\n```\n- (void)mouseDown:(NSEvent)event;\n- (void)rightMouseDown:(NSEvent)event;\n\
  - (void)otherMouseDown:(NSEvent)event;\n- (void)mouseUp:(NSEvent)event;\n- (void)rightMouseUp:(NSEvent)event;\n\
  - (void)otherMouseUp:(NSEvent)event;\n- (void)mouseDragged:(NSEvent)event;\n- (void)scrollWheel:(NSEvent)event;\n\
  - (void)rightDragged:(NSEvent)event;\n```\n\n### NSEvent\n\n事件对象包含了关于用户操作的所有信息。\n\
  \n- `locationInWindow`: 返回事件的位置。\n- `modifierFlags`: 告诉你用户按住了哪些键。\n- `timestamp`:\
  \ 给出机器启动到事件发生之间的时间秒间隔。\n- `clickCount`: 表明点击是单击、双击还是三击。\n- `pressure`: 如果用户使用输入设备（例如平板电脑），则返回压力值。该值在\
  \ 0 到 1 之间。\n- `deltaX`, `deltaY`: 提供鼠标或滚轮位置的变化。\n\n### 获取鼠标事件\n\n要获取鼠标事件，你需要在 `StretchView.m`\
  \ 中重写鼠标方法：\n\n```objc\npragma mark Events\n\n- (void)mouseDown:(NSEvent)event {\n\
  \    NSLog(@\"mouseDown: %ld\", [event clickCount]);\n}\n\n- (void)mouseDragged:(NSEvent)event\
  \ {\n    NSPoint p = [event locationInWindow];\n    NSLog(@\"mouseDragged:%@\",\
  \ NSStringFromPoint(p));\n}\n\n- (void)mouseUp:(NSEvent)event {\n    NSLog(@\"mouseUp:\"\
  );\n}\n```\n\n### 使用 NSOpenPanel\n\n将图像合成到视图上会很有趣，但首先你需要创建一个控制器对象来从文件中读取图像数据。这是一个学习如何使用\
  \ `NSOpenPanel` 的好机会。注意 RaiseMan 应用程序使用了 `NSOpenPanel`，但那是 `NSDocument` 类自动完成的。在这里你将显式地使用\
  \ `NSOpenPanel`。图 18.1 显示了一旦用户选择图像后你的应用程序的样子。窗口底部的滑块将控制图像的不透明度。\n\n\n\n\n\n图 18.2\
  \ 显示了对象图。\n\n**图 18.2.** 对象图\n\n![Image](img/00191.jpg)\n\n### 修改 XIB 文件\n\n从第 17\
  \ 章打开 `DrawingFun` 项目。在 `DrawingFunAppDelegate.h` 中，为 `StretchView` 添加一个输出（outlet）以及一个用于启动打开面板的动作（action）：\n\
  \n```objc\n#import <Cocoa/Cocoa.h>\n\n@class StretchView;\n\n@interface DrawingFunAppDelegate\
  \ : NSObject <NSApplicationDelegate> {\n    IBOutlet StretchView *stretchView;\n\
  }\n@property (strong) IBOutlet NSWindow *window;\n- (IBAction)showOpenPanel:(id)sender;\n\
  @end\n```\n\n打开 `MainMenu.xib` 并调出我们的绘制窗口。向窗口中拖入一个滑块（slider）。在检查器（Inspector）中，将其范围设置为\
  \ 0 到 1。此外，勾选“连续”（Continuous）复框。此滑块将控制图片的透明度（图 18.3）。\n\n**图 18.3.** 检查滑块\n\n![Image](img/00192.jpg)\n\
  \n切换到尺寸检查器（Size Inspector），配置滑块水平拉伸并保持左、右、下外边距（图 18.4）。这将使滑块随窗口相应调整大小。\n\n**图 18.4.**\
  \ 配置滑块的自动调整\n\n![Image](img/00193.jpg)\n\n将滑块的值绑定到 app delegate 的 `stretchView.opacity`\
  \ 键路径。\n\n**图 18.5.** 绑定滑块的值\n\n![Image](img/00194.jpg)\n\n按 Control 键（Control-click）`DrawingFunAppDelegate`。将\
  \ `stretchView` 输出连接到窗口上的 `StretchView`（图 18.6）。\n\n**图 18.6.** 连接 stretchView 输出\n\
  \n![Image](img/00195.jpg)\n\n查看你 XIB 中的主菜单。打开“文件”（File）菜单并删除除“打开”（Open）之外的所有菜单项。按\
  \ Control 拖动（Control-drag）将菜单项连接到 `DrawingFunAppDelegate` 的 `showOpenPanel:` 动作（图\
  \ 18.7）。保存文件。\n\n**图 18.7.** 连接菜单项\n\n![Image](img/00196.jpg)\n\n### 编辑代码\n\n编辑\
  \ `DrawingFunAppDelegate.m` 使如下内容所示。注意该方法中使用了一种新语法，称为“块”（block）。我们将在第 29 章中详细讨论块。注意，你可能会看到关于\
  \ `StretchView` 可能无法响应 `setImage:` 的警告；这目前没有关系。我们将在下一节中修复它。\n\n```objc\n#import\
  \ \"DrawingFunAppDelegate.h\"\n#import \"StretchView.h\"\n\n@implementation DrawingFunAppDelegate\n\
  \n@synthesize window;\n\n- (IBAction)showOpenPanel:(id)sender\n{\n    __block NSOpenPanel\
  \ *panel = [NSOpenPanel openPanel];\n    [panel setAllowedFileTypes:[NSImage imageFileTypes]];\n\
  \n    [panel beginSheetModalForWindow:[stretchView window]\n    completionHandler:^\
  \ (NSInteger result) {\n        if (result == NSOKButton) {\n            NSImage\
  \ *image = [[NSImage alloc]\n            initWithContentsOfURL:[panel URL]];\n \
  \           [stretchView setImage:image];\n        }\n        panel = nil; // 防止强引用循环\n\
  \    }];\n}\n\n@end\n```\n\n启动表的这一行是一个非常实用的方法：\n\n```objc\n- (void)beginSheetModalForWindow:(NSWindow\
  \ *)window\n             completionHandler:(void (^)(NSInteger result))handler\n\
  ```\n\n该方法将以表（sheet）的形式附加到 `window` 之上弹出一个打开面板。第二个参数 `handler` 是该块。块的语法需要一些适应，但块是一个非常强大的工具。当用户关闭打开面板时，块会运行，允许你的代码对用户的操作响应。\n\
  \n### 将图像复合到你的视图上\n\n你还需要需要修改 `StretchView` 以使用 `opacity` 和 `image`。首先，在你的 `StretchView.h`\
  \ 文件中声明变量和方法：\n\n```objc\n#import <Cocoa/Cocoa.h>\n\n@interface StretchView : NSView\n\
  {\n    NSBezierPath *path;\n    NSImage *image;\n    float opacity;\n}\n@property\
  \ (assign) float opacity;\n@property (strong) NSImage *image;\n- (NSPoint)randomPoint;\n\
  \n@end\n```\n\n现在在你的 `StretchView.m` 中实现这些方法：\n\n```objc\n#pragma mark Accessors\n\
  \n- (NSImage *)image\n{\n    return image;\n}\n\n- (void)setImage:(NSImage *)newImage\n\
  {\n    image = newImage;\n}\n\n- (float)opacity\n{\n    return opacity;\n}\n\n-\
  \ (void)setOpacity:(float)x\n{\n    opacity = x;\n}\n\n- (NSPoint)randomPoint\n\
  {\n    // 实现细节\n}\n```\n\n\n\n\n\n```objc\n- (void)mouseUp:(NSEvent *)event\n{\n\
  \    NSPoint p = [event locationInWindow];\n    currentPoint = [self convertPoint:p\
  \ fromView:nil];\n    [self setNeedsDisplay:YES];\n}\n```\n\n添加一个根据两个点计算矩形的方法：\n\
  \n```objc\n- (NSRect)currentRect\n{\n    float minX = MIN(downPoint.x, currentPoint.x);\n\
  \    float maxX = MAX(downPoint.x, currentPoint.x);\n    float minY = MIN(downPoint.y,\
  \ currentPoint.y);\n    float maxY = MAX(downPoint.y, currentPoint.y);\n    return\
  \ NSMakeRect(minX, minY, maxX-minX, maxY-minY);\n}\n```\n\n(由于某种原因，很多人会写错最后一个方法。在继续之前请再次检查你的代码。如果你写错了，结果将非常令人失望。)\n\
  \n在 `StretchView.h` 中声明 `currentRect` 方法。\n\n这样即使户没有没有拖动也能看到某些内容，在 `setImage:` 方法中初始化\
  \ `downPoint` 和 `currentPoint`：\n\n```objc\n- (void)setImage:(NSImage *)newImage\n\
  {\n    image = newImage;\n    NSSize imageSize = [newImage size];\n    downPoint\
  \ = NSZeroPoint;\n    currentPoint.x = downPoint.x + imageSize.width;\n    currentPoint.y\
  \ = downPoint.y + imageSize.height;\n    [self setNeedsDisplay:YES];\n}\n```\n\n\
  在 `drawRect:` 方法中，将图像复合到矩形内：\n\n```objc\n- (void)drawRect:(NSRect)rect\n{\n    NSRect\
  \ bounds = [self bounds];\n    [[NSColor greenColor] set];\n    [NSBezierPath fillRect:bounds];\n\
  \    [[NSColor whiteColor] set];\n    [path stroke];\n    if (image) {\n       \
  \ NSRect imageRect;\n        imageRect.origin = NSZeroPoint;\n        imageRect.size\
  \ = [image size];\n        NSRect drawingRect = [self currentRect];\n        [image\
  \ drawInRect:drawingRect\n                 fromRect:imageRect\n                \
  \ operation:NSCompositeSourceOver\n                   fraction:opacity];\n    }\n\
  }\n```\n\n编译并运行你的应用程序。注意，当你拖过边缘时视图不会滚动。如果滚动视图能够移动以允许用户看到他们拖到了哪里就太好了，这种技术被称为自动滚动（autoscrolling）。在下一节中，你将为你的应用程序添加自动滚动。\n\
  \n### 自动滚动\n\n要为你的应用程序添加自动滚动，你将在用户拖动时向裁剪视图发送 `autoscroll:` 消息。你会将事件作为参数包含。打开 `StretchView.m`\
  \ 并在 `mouseDragged:` 方法中添加以下行：\n\n```objc\n- (void)mouseDragged:(NSEvent *)event\n\
  {\n    NSPoint p = [event locationInWindow];\n    currentPoint = [self convertPoint:p\
  \ fromView:nil];\n    [self autoscroll:event];\n    [self setNeedsDisplay:YES];\n\
  }\n```\n\n编译并运行你的应用程序。\n\n注意自动滚动只在拖动时发生。为了实现更平滑的自动滚动，大多数开发者创建一个定时器，在用户拖动期间定期向视图发送\
  \ `autoscroll:` 方法。定时器在 第 24 章 中讨论。\n\n### 更有好奇心的人：NSImage\n\n在大多数情况下，读取图像、调整其大小并将其复合到视图上就足够，正如你在练习中所做的那样。\n\
