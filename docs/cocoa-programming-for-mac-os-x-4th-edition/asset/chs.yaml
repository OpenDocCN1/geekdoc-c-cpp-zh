  \ elapsedTime;\n    NSTimer *timer;\n}\n- (IBAction)stopGo:(id)sender;\n- (IBAction)showSpeedSheet:(id)sender;\n\
  - (IBAction)endSpeedSheet:(id)sender;\n\n- (void)updateElapsedTime;\n- (void)resetElapsedTime;\n\
  - (void)showAnotherLetter;\n\n@end\n```\n\n保存文件。\n\n#### 布局界面\n\n打开 `MainMenu.xib`。从库（Library，位于\
  \ Cocoa -> Windows & Menus 下）拖出一个菜单项，为你的应用程序添加到主菜单中（图 25.3）。\n\n**图 25.3.** 添加菜单项\n\
  \n![Image](img/00229.jpg)\n\n将菜单项的标题更改为 Adjust Speed.... 按 Control-drag 从该菜单项拖动到\
  \ `TutorController`。将动作设置为 `showSpeedSheet:`（图 25.4）。\n\n**图 25.4.** 连接菜单项\n\n![Image](img/00230.jpg)\n\
  \n通过从库（Library，位于 Cocoa -> Windows & Menus 下）拖出一个窗口创建一个新窗口（图 25.5）。禁用窗口的调整大小。取消勾选\
  \ Visible at launch。\n\n**图 25.5.** 检查新窗口\n\n![Image](img/00231.jpg)\n\n在新窗口上放置一个滑块。为了将滑块的左端标记为“1\
  \ second”，右端标记为“10 seconds”，请向窗口上丢入两个标签。在滑块上方添加第三个标签，内容为 `Time per letter:`。添加一个按钮并将其标题更改为\
  \ OK。检查滑块并将其范围设置为 1 到 10（图 25.6）。\n\n**图 25.6.** 检查滑块\n\n![Image](img/00232.jpg)\n\
  \n将滑块的 Value（值）绑定到 `TutorController` 的 `timeLimit`，如图 25.7 所示。\n\n**图 25.7.** 将滑块的值绑定到\
  \ timeLimit\n\n![Image](img/00233.jpg)\n\n当用户点击 OK 按钮时，应该向 `TutorController` 发送一条消息以结束表单（sheet）。从按钮\
  \ Control-drag 到 `TutorController` 并选择 `endSpeedSheet:` 作为动作（图 25.8）。\n\n**图 25.8.**\
  \ 设置目标的 Target\n\n![Image](img/00234.jpg)\n\n你的 `TutorController` 将控制滑块和窗口，因此你需要为它们添加输出。此外，当用户选择“Adjust\
  \ speed...”菜单项或点击 OK 按钮时，你的 `TutorController` 将收到一条消息，因此你需要为 `TutorController` 添加两个动作方法。\n\
  \n图 25.2 展示了对象图。\n\n**图 25.2.** 对象图\n\n![Image](img/00228.jpg)\n\n## 第 26 章 创建 NSFormatters\n\
  \n格式化器（formatter）获取字符串并生成另一个对象，通常是为了让用户输入不仅仅是字符串的内容。例如，`NSDateFormatter` 在接收到字符串\
  \ `August 17, 1967` 时，会将其转换为 `NSDate` 对象，代表 1967 年 8 月 17 日（图 26.1）。\n\n**图 26.1.**\
  \ NSDateFormatter\n\n![Image](img/00236.jpg)\n\n\n\n\n此外，格式化器（formatter）可以接收一个对象并创建一个供用户查看的字符串。例如，想象带有\
  \ `NSDateFormatter` 的文本字段。当向文本字段发送带有 `NSDate` 对象的 `setObjectValue:` 时，日期格式化器将创建一个表示该日期的字符串。用户就能看到该字符串。\n\
  \n所有的格式化器都是 `NSFormatter` 类的子类。其中 Cocoa 提供了两个子类：`NSDateFormatter` 和 `NSNumberFormatter`。你曾在第\
  \ 3 章 中使用 `NSDateFormatter` 来格式化彩票日期，并在第 8 章 中使用 `NSNumberFormatter` 将预期收益格式化为百分比。\n\
  \n最基本的格式化器将实现两个方法：\n\n```objc\n- (BOOL)getObjectValue:(id *)anObject\n         \
  \    forString:(NSString *)aString\n           errorDescription:(NSString **)errorPtr\n\
  ```\n\n当控件（如文本字段）需要将 `aString` 转换为对象时，它会向格式化器发送此消息；`aString` 是用户输入的字符串。格式化器可以返回\
  \ `YES` 并设置 `anObject` 指向新对象。返回 `NO` 表示字符串无法转换，并设置 `errorPtr` 以指示哪里发生了错误。注意，`errorPtr`\
  \ 是一个指向指针的指针，`anObject` 也是如此。也就是说，它是你可以在其中放置一个指向字符串指针的位置。\n\n```objc\n- (NSString\
  \ *)stringForObjectValue:(id)anObject\n```\n\n当控件需要将 `anObject` 转换为字符串时，它会向格式化器发送此消息。控件将显示返回的字符串给用户（图\
  \ 26.2）。\n\n**图 26.2.** NSFormatter\n\n![Image](img/00237.jpg)\n\n通常，从字符串创建的对象也是字符串。例如，你可能有一个\
  \ `TelephoneNumberFormatter`，它能正确地在电话号码中插入括号和横线。\n\n### 基础格式化器\n\n在本章中，你将编写自己的格式化器类。你将创建一个允许用户输入颜色名称的格式化器，格式化器反过来创建相应的\
  \ `NSColor` 对象。然后，你将用该颜色对象设置 `BigLetterView` 的背景。图 26.3 显示了你完成后应用程序的样式。\n\n**图 26.3.**\
  \ 完成的应用程序\n\n![Image](img/00238.jpg)\n\n#### 创建 ColorFormatter.h\n\n在 Xcode 中打开\
  \ `TypingTutor` 项目，并创建一个 `NSFormatter` 子类的新 Objective-C 类。将其命名为 `ColorFormatter`。\n\
  \n在 `ColorFormatter.h` 中，添加一个实例变量：\n\n```objc\n#import <Foundation/Foundation.h>\n\
  \n@interface ColorFormatter : NSFormatter {\n    NSColorList *colorList;\n}\n@end\n\
  ```\n\n保存该文件。\n\n#### 编辑 XIB 文件\n\n打开 `MainMenu.xib`。向窗口中拖入一个颜色选择器（color well）和一个文本字段（图\
  \ 26.4）。\n\n**图 26.4.** 添加颜色选择器和文本字段\n\n![Image](img/00239.jpg)\n\n将颜色选择器的 `value`\
  \ 绑定到 `TutorController` 的 `inLetterView.bgColor`（图 26.5）。\n\n**图 26.5.** 将颜色选择器的值绑定到\
  \ inLetterView 的 bgColor\n\n![Image](img/00240.jpg)\n\n将文本字段的值绑定到相同的键路径（图 26.6）。\n\
  \n**图 26.6.** 将文本字段的值绑定到 inLetterView 的 bgColor\n\n![Image](img/00241.jpg)\n\n在编辑器中拖入一个\
  \ `NSObject`。将其类设为 `ColorFormatter`（图 26.7）。\n\n**图 26.7.** 创建 ColorFormatter 实例\n\
  \n![Image](img/00242.jpg)\n\n按 Control 键点击文本字段以弹出其连接面板。将格式化器输出（formatter outlet）指向\
  \ `ColorFormatter` 对象（图 26.8）。\n\n**图 26.8.** 设置文本字段的格式化器输出\n\n![Image](img/00243.jpg)\n\
  \n\n\n\n```objc\n// 查找 'string' 颜色\nNSString *matchingKey = [self firstColorKeyForPartialString:string];\n\
  if (matchingKey) {\n    *obj = [colorList colorWithKey:matchingKey];\n    return\
  \ YES;\n} else {\n    // 有时 'errorString' 为 NULL\n    if (errorString != NULL) {\n\
  \        *errorString = [NSString stringWithFormat:\n        @\" 不是一种颜色\", string];\n\
  \    }\n    return NO;\n}\n}\n@end\n```\n\n编译并运行你的应用程序。你应该能够输入颜色名称并看到 `BigLetterView`\
  \ 的背景随之改变。此外，如果你正确使用颜色，你应该看到文本字段中的颜色名称发生变化。尝试输入一个不是颜色的字符串。\n\n### NSControl 类的 Delegate\n\
  \n注意，绑定（bindings）机制在格式化失败时会弹出一个漂亮的警报框（Alert sheet）。文本字段的 `delegate` 也可以被通知格式化失败。如果格式化器认为字符串无效，则\
  \ `delegate` 将收到以下错误消息：\n\n```objc\n- (BOOL)control:(NSControl *)control\n    didFailToFormatString:(NSString\
  \ *)string\n    errorDescription:(NSString *)error\n```\n\n`delegate` 可以覆盖格式化器的意见。如果它返回\
  \ `YES`，控件将原样显示字符串。如果它返回 `NO`，则 `delegate` 同意格式化器的判断：该字符串是无效的。\n\n在 `TutorController.m`\
  \ 中实现以下方法：\n\n```objc\n- (BOOL)control:(NSControl *)control\ndidFailToFormatString:(NSString\
  \ *)string\nerrorDescription:(NSString *)error\n{\n    NSLog(@\"TutorController\
  \ 通知 %@ 的格式化失败: %@\",\n    string, error);\n    return NO;\n}\n```\n\n现在打开 `MainMenu.xib`，将\
  \ `TutorController` 设置为文本字段的 `delegate`（图 26.9）。\n\n**图 26.9.** 连接文本字段的 delegate\
  \ Outlet\n\n![Image](img/00244.jpg)\n\n编译并运行你的应用程序。当验证失败时，你将在控制台上看到一条消息，指示该字符串是什么以及失败的原因。\n\
  \n### 检查部分字符串\n\n你可能想创建一个格式化器，防止用户输入不是颜色名称一部分的字母。为了让格式化器在每次按键后检查字符串，请实现以下方法：\n\n\
  ```objc\n- (BOOL)isPartialStringValid:(NSString *)partial\n    newEditingString:(NSString\
  \ **)newString\n    errorDescription:(NSString **)errorString\n```\n\n在这里，`partial`\
  \ 是包含最后一次按键的字符串。如果你的格式化器返回 `NO`，表示该部分字符串是不可接受的。此外，如果格式化器返回 `NO`，它可以提供 `newString`\
  \ 和 `errorString`。`newString` 将显示在控件中。`errorString` 应该让用户知道他们做错了。如果格式化器返回 `YES`，则\
  \ `newString` 和 `errorString` 被忽略。\n\n在 `ColorFormatter.m` 中添加以下方法：\n\n```objc\n\
  - (BOOL)isPartialStringValid:(NSString *)partial\nnewEditingString:(NSString **)newString\n\
  errorDescription:(NSString **)error\n{\n    // 长度为零的字符串是可以的\n    if ([partial length]\
  \ == 0){\n        return YES;\n    }\n    NSString *match = [self firstColorKeyForPartialString:partial];\n\
  \    if (match) {\n        return YES;\n    } else {\n        if (error) {\n   \
  \         *error = @\"没有这种颜色\";\n        }\n        return NO;\n    }\n}\n```\n\n\
  编译并运行你的应用程序。你将无法输入颜色名称以外的任何内容。\n\n注意这个应用的一个麻烦点：在离开字段之前，你无法看到将选择什么颜色。你想要的是具有自动补全功能的格式化器。要启用自动补全，你还需要控制选择范围。注释掉\
  \ `isPartialStringValid:newEditingString:errorDescription:` 方法，并替换为此方法：\n\n```objc\n\
  - (BOOL)isPartialStringValid:(NSString **)partial\n    proposedSelectedRange:(NSRange\
  \ *)selPtr\n    originalString:(NSString *)origString\n    originalSelectedRange:(NSRange)origSel\n\
  \    errorDescription:(NSString **)error\n{\n    // 长度为零的字符串是可以的\n    if ([*partial\
  \ length] == 0) {\n        return YES;\n    }\n    NSString *match = [self firstColorKeyForPartialString:partial];\n\
  \    if (match) {\n        return YES;\n    } else {\n        if (error) {\n   \
  \         *error = @\"输入...\";\n        }\n        return NO;\n    }\n}\n```\n*(注：由于原始文本存在严重乱码，此处已根据代码逻辑进行了修复。)*\n\
  \n### 返回属性字符串的格式化器\n\n有时，让格式化器不仅定义字符串还定义属性是很有用的。例如，如果是负数，可以将数字打印为红色。为了这个目的，请使用 `NSAttributedString`。你的格式化器可以实现：\n\
  \n```objc\n- (NSAttributedString)attributedStringForValue:(id)anObj\n    withDefaultAttributes:(NSDictionary\
  \ *)attributes\n{\n    NSString *match = [self stringForValue:anObj];\n    if (!match)\
  \ {\n        return nil;\n    }\n    NSMutableDictionary *attDict = [attributes\
  \ mutableCopy];\n    [attDict setObject:anObj forKey:NSForegroundColorName];\n \
  \   NSAttributedString *atString\n    = [[NSAttributedString alloc] initWithString:match\n\
  \    attributes:attDict];\n    return atString;\n}\n```\n\n## 第 27 章：打印\n\n编写打印的代码总是很难。有很多因素：分页、页边距和页面方向（横向或纵向）。与大多数操作系统相比，Mac\
  \ OS X 让编写打印程序变得简单得多。由于视图已经知道如何生成 PDF，Mac OS 知道如何打印。如果你有一个基于文档的应用并且知道如何绘制自己的视图，你只需要实现\
  \ `printOperationWithSettings:error:`。在这个方法中，你使用视图创建一个 `NSPrintOperation` 对象并返回它。\n\
  \n```objc\n- (NSPrintOperation *)printOperationWithSettings:(NSDictionary *)ps\n\
  ```\n\n\n\n\n\n```objc\nerror:(NSError **)e;\n{\n    NSPrintInfo *printInfo = [self\
  \ printInfo];\n    NSPrintOperation *printOp = [NSPrintOperation printOperationWithView:aView\
  \ printInfo:printInfo];\n    return printOp;\n}\n```\n\n### 处理分页\n\n多页的情况如何处理？毕竟，视图（view）只有一个页面。你如何让一个视图打印多页文档呢？在离屏状态下，你会创建一个巨大的视图，它可以同时显示文档的所有页面（图\
  \ 27.1) 打印打印系统会询问视图它显示了多少页，并询问视图每一页在视图中的具体位置。\n\n**图 27.1.** 每一页都是视图上的一个矩形\n\n![Image](img/00245.jpg)\n\
  \n因此，你的视图必须重写两个方法：\n\n```objc\n// 有多少页？\n- (BOOL)knowsPageRange:(NSRange *)rptr;\n\
  \n// 每一页在哪里？\n- (NSRect)rectForPage:(NSInteger)pageNum;\n```\n\n你不需要创建一个巨大的视图并为每一页返回不同的矩形，而是可以记录正在打印哪一页，并在\
  \ `rectForPage:` 中始终返回相同的矩形。这就是你将在练习中用到的技术。\n\n作为一个示例，你将为 RaiseMan 添加打印功能。你将打印姓名和预期的加薪，直到填满用户从打印面板选择的纸张尺寸的人员为止（图\
  \ 27.2）。\n\n**图 27.2.** 完成的应用程序\n\n![Image](img/00246.jpg)\n\n为了实现这一点，你将创建一个负责打印的视图。我们不需要把视图做得大到能同时显示所有人，只需记录系统正在打印哪一页，并在\
  \ `drawRect:` 中仅绘制该页上的姓名。\n\n创建一个名为 `PeopleView` 的类，它是 `NSView` 的子类。让 `PeopleView.h`\
  \ 看起来如下：\n\n```objc\n#import <Cocoa/Cocoa.h>\n\n@interface PeopleView : NSView {\n\
  \    NSArray *people;\n    NSMutableDictionary *attributes;\n    float lineHeight;\n\
  \    NSRect pageRect;\n    NSInteger linesPerPage;\n    NSInteger currentPage;\n\
  }\n- (id)initWithPeople:(NSArray *)array;\n@end\n```\n\n在 `PeopleView.m` 中，你将实现\
  \ `initWithPeople:` 方法。这个初始化器将调用 `NSView` 的 `initWithFrame:` 方法。\n\n```objc\n#import\
  \ \"PeopleView.h\"\n#import \"Person.h\"\n\n@implementation PeopleView\n\n- (id)initWithPeople:(NSArray\
  \ *)persons\n{\n    // 使用一些虚拟（dummy）框架调用父类的指定初始化器\n    self = [super initWithFrame:NSMakeRect(0,\
  \ 0, 700, 700)];\n    if (self) {\n        people = [persons copy];\n        //\
  \ 要打印文本的属性\n        attributes = [[NSMutableDictionary alloc] init];\n        NSFont\
  \ *font = [NSFont fontWithName:@\"Monaco\" size:12.0];\n        lineHeight = [font\
  \ lineHeight] * 1.7;\n        [attributes setObject:font forKey:NSFontAttributeName];\n\
  \    }\n    return self;\n}\n\n#pragma mark Pagination\n- (BOOL)knowsPageRange:(NSRange\
  \ *)range\n{\n    NSPrintOperation *po = [NSPrintOperation currentOperation];\n\
  \    NSPrintInfo *printInfo = [po printInfo];\n\n    // 我可以在哪里画？\n    pageRect =\
  \ [printInfo imageableBounds];\n    NSRect newFrame = NSZeroPoint;\n    newFrame.size\
  \ = [printInfo paperSize];\n    [self setFrame:newFrame];\n\n    // 每页有多少行？\n  \
  \  linesPerPage = pageRect.height / lineHeight;\n\n    // 页面从 1 开始计数\n    range.location\
  \ = 1;\n\n    // 需要多少页？\n    range.length = [people count] / linesPerPage;\n   \
  \ if ([people count] % linesPerPage) {\n        range.length = range.length + 1;\n\
  \    }\n    return YES;\n}\n\n- (NSRect)rectForPage:(NSInteger)i\n{\n    // 记录当前页\n\
  \    currentPage = i - 1;\n\n    // 返回相同的页矩形\n    return pageRect;\n}\n\n#pragma\
  \ mark Drawing\n// 视图的原点在左上角\n- (BOOL)isFlipped\n{\n    return YES;\n}\n\n- (void)drawRect:(NSRect)r\n\
  {\n    NSRect nameRect;\n    NSRect raiseRect;\n    raiseRect.size.height = nameRect.size\
  \ = lineHeight;\n    nameRect.origin.x = pageRect.origin.x;\n    nameRect.size.width\
  \ = 200.0;\n    raiseRect.origin.x = NSMaxX(nameRect);\n    raiseRect.size.width\
  \ = 100.0;\n    NSInteger i;\n    for (i=0; i<linesPerPage; i++) {\n        NSInteger\
  \ index = (currentPage * linesPerPage) + i;\n        if (index >= [people count])\
  \ {\n            break;\n        }\n        Person *p = [people objectAtIndex:index];\n\
  \n        // 绘制索引和姓名\n        nameRect.origin.y = pageRect.origin.y + (i * lineHeight);\n\
  \        NSString *nameString = [NSString stringWithFormat:@\"%2d %@\", index, [p\
  \ personName]];\n        [nameString drawInRect:nameRect withAttributes:attributes];\n\
  \n        raiseRect.origin.y = nameRect.origin.y;\n        NSString *raiseString=[NSString\
  \ stringWithFormat:@\"%4.1f%%\", [p expectedRaise]];\n        [raiseString drawInRect:raiseRect\
  \ withAttributes:attributes];\n    }\n}\n\n@end\n```\n\n`RMDocument.m` 中的代码非常简单。首先，在顶部导入\
  \ `PeopleView.h`：\n\n```objc\n#import PeopleView.h\n```\n\n然后实现 `printOperationWithSettings:error:`：\n\
  \n```objc\n- (NSPrintOperation *)printOperationWithSettings:(NSDictionary *)ps\n\
  error:(NSError **)e;\n{\n    PeopleView *view = [[PeopleView alloc] initWithPeople:];\n\
  \    NSPrintInfo *printInfo = [self printInfo];\n    NSPrintOperation *printOp =\
  \ [NSPrintOperation printOperationWithView:view printInfo:printInfo];\n    return\
  \ printOp;\n}\n```\n\n在 `MainMenu.xib` 文件中，注意打印菜单项是 `nil`，其动作是 `printDocument:`。\n\
  \n构建并运行应用程序。注意你可以更改纸张尺寸，每页会出现更多或更少的人。\n\n### 奇好奇：你是在屏幕上绘制吗？\n\n在应用程序中，你通常希望在屏幕上和打印时绘制不同的内容。例如，在图形程序中，你可以在\
  \ `drawRect:` 方法中询问当前的图形上下文是否正在向屏幕绘制：\n\n```objc\nif ([[NSGraphicsContext currentContext]\
  \ isDrawingToScreen]) {\n    ...绘制网格...\n}\n```\n\n### 挑战\n\n添加页码。\n\nWeb 服务备受推崇。但到底，Web\
  \ 服务只是 HTTP 请求和响应，其中可能携带 XML 数据（图 28.1)）。因此，在 Cocoa 中使用 Web 服务只需要发送 HTTP 请求并接收响应，它可能还需要生成和解析\
  \ XML。\n\nHTTP 请求和响应由 `NSURL`、`NSURLRequest` 和 `NSURLConnection` 处理（图 28.2)）。\n\n\
  **图 28.2.** 用于制作 HTTP 请求的类\n\n![Image](img/00248.jpg)\n\n生成和解析 XML 通常有两种方法。高级方法是使用\
  \ `NSXMLDocument` 和 `NSXMLNode`。如果你有一个包含以下 XML 的 `NSData`，`NSXMLDocument` 将将其解析为方便使用的树结构（图\
  \ 28.3)：\n\n```xml\n<?xml version=\"1.0\" encoding=\"UTF-8\"?>\n<person>\n    <first>Larry</first>\n\
  \    <last>Furg</last>\n</person>\n```\n\n**图 28.3.** 解析后的 XML 文档\n\n![Image](img/00249.jpg)\n\
  \n\n\n\n\n低级 XML 解析是通过 `NSXMLParser` 完成的。当它解析包含 XML 的 `NSData` 时，`NSXMLParser` 在遇到\
  \ XML 元素和其他结构时会调用其 `delegate`（代理）。在处理大型 XML 文档或内存资源有限（例如在 iOS 设备上）时，低级 XML 解析最为合适。\n\
  \n## RanchForecast 项目恰好 Big Nerd Ranch 网站有一个关于即将课程的 XML 馈。在本次练习中，你将编写一个应用程序，使用该\
  \ Web 服务在表格视图中显示 Big Nerd Ranch 的即将课程。该应用程序的外将所示图 28.4。\n\n**图 28.4.** 完成的应用程序\n\
  \n![Image](img/00250.jpg)\n\n创建一个类型为 Cocoa Application 的项目。禁用“创建基于文档的应用”（Create\
  \ Document-Based Application）、“使用 Core Data”（Uses Core Data）和“创建单元测试”（Create Unit\
  \ Tests）。将项目命名为 RanchForecast。同时将类前缀（Class Prefix）设置为 `RanchForecast`。\n\n我们将从模型向上构建此应用程序。创建一个名为\
  \ `ScheduledClass` 的新 Objective-C 类，继承自 `NSObject`。在 `ScheduledClass.h` 中添加四个属性：`name`、`location`、`href`\
  \ 和 `begin`：\n\n```objc\n#import <Foundation/Foundation.h>\n\n@interface ScheduledClass\
  \ : NSObject\n{\nNSString *name;\nNSString *location;\nNSString *href;\nNSDate *begin;\n\
  }\n@property (nonatomic, copy) NSString *name;\n@property (nonatomic, copy) NSString\
  \ *location;\n@property (nonatomic, copy) NSString *href;\n@property (nonatomic,\
  \ strong) NSDate *begin;\n@end\n```\n\n然后在 `ScheduledClass.m` 中合成属性：\n\n```objc\n\
  #import \"ScheduledClass.h\"\n\n@implementation ScheduleClass\n\n@synthesize name,\
  \ location, href, begin;\n\n@end\n```\n\n对于简单的模型，使用 `NSDictionary` 往往很有诱惑力。然而，从长期来看，花时间创建一个类会让未来的工作变得更容易，特别是当项目规模超过其初始范围时。\n\
  \n## NSURLConnection\n\n现在我们已经定义了模型，将转向从 Web 服务获取数据。在 Cocoa 中，这通常通过使用 `NSURLConnection`\
  \ 类来实现。为了创建一个连接，我们必须先创建一个 `NSURLRequest`，它描述了指向连接对象的请求。`NSURLRequest` 对于简单请求已经足够了。需要更多控制（例如特定的请求标头）的请求应使用\
  \ `NSMutableURLRequest`。\n\n`NSURLConnection` 可以同步或异步地使用。在同步连接中，当前线程会在请求完成之前被阻塞，因此不适合在主线程中使用，因为这将导致用户界面在请求完成期间无响应。\n\
  \n异步连接调度在运行循环（run loop）中进行，并指定一个代理来响应连接在生命周期内的各种事件。在本章中，为了简单起见，我们将使用同步连接。\n\n创建一个\
  \ `NSObject` 的新子类名为 `ScheduleFetcher`。该类将封装与 Web 服务通信以及将结果解析为模型对象的繁琐工作。通过抽象此功能，我们可以保持用户界面控制器类的简单整洁，并且可以在其他项目中轻松地使用该类。在\
  \ `ScheduleFetcher.h` 中定义接口：\n\n```objc\n#import <Foundation/Foundation.h>\n\n@interface\
  \ ScheduleFetcher : NSObject <NSXMLParserDelegate> {\nNSMutableArray *classes;\n\
  NSMutableString *currentString;\nNSMutableDictionary *currentFields;\nNSDateFormatter\
  \ *dateFormatter;\n}\n\n// 如果成功，返回 ScheduledClass 对象的 数组。\n// 如果失败，返回 nil。\n- (NSArray\
  \ *)fetchClassesWithError:(NSError **)outError;\n@end\n```\n\n在 `ScheduleFetcher.m`\
  \ 中定义 `init` 和 `fetchClassesWithError:`：\n\n```objc\n#import \"ScheduleFetcher.h\"\
  \n#import \"ScheduledClass.h\"\n\n@implementation ScheduleFetcher\n\n- (id)init\n\
  {\n  self = [super init];\n  if (self) {\n    classes = [[NSMutableArray alloc]\
  \ init];\n    dateFormatter = [[NSDateFormatter alloc] init];\n    [dateFormatter\
  \ setDateFormat:@\"yyyy-MM-dd HH:mm:ss zzzz\"];\n  }\n  return self;\n}\n\n- (NSArray\
  \ *)fetchClassesWithError:(NSError **)outError\n{\n  NSURL *xmlURL = [NSURL URLWithString:@\"\
  http://bignerdranch.com/xml/schedule\"];\n\n  NSURLRequest *req = [NSURLRequest\
  \ requestWithURL:xmlURL\n  cachePolicy:NSURLRequestReturnCacheDataElseLoad\n  timeoutInterval:30];\n\
  \  NSURLResponse *resp = nil;\n\n  NSData *data = [NSURLConnection sendSynchronousRequest:req\n\
  \  returningResponse:&resp\n  error:outError];\n  if (!data)\n    return nil;\n\n\
  \  NSLog(\"%ld bytes.\", [data length]);\n}\n}\n```\n\n我们将在稍后的过程中使用 `NSDateFormatter`。在进入解析之前，让我们测试我们的\
  \ `fetchClasses:` 方法。在 `RanchForecast.m` 中：\n\n```objc\n#import \"RanchForecast.h\"\
  \n#import \"ScheduleFetcher.h\"\n\n@implementation RanchForecast\n\n@synthesize\
  \ window;\n\n- (void)applicationDidFinishLaunching:(NSNotification *)a {\n  ScheduleFetcher\
  \ *fetcher = [[ScheduleFetcher alloc] init];\n  NSError *error = nil;\n  [fetcher\
  \ fetchClassesWithError:&error];\n}\n```\n\n编译并运行你的应用程序。你应该能看到一个指示已接收数据的消息。\n\n\
  ### XML 解析\n\n现在我们需要解析来自 Web 服务的 XML。我们通过使用 `NSXMLParser` 实例来实现。修改 `fetchClassesWithError:`\
  \ 以实例化并运行：\n\n```objc\n- (NSArray *)fetchClassesWithError:(NSError **)outError\n\
  {\n  NSURL *xmlURL = [NSURL URLWithString:@\"http://bignerdranch.com/xml/schedule\"\
  ];\n\n  NSURLRequest *req = [NSURLRequest requestWithURL:xmlURL\n  cachePolicy:NSURLRequestReturnCacheDataElseLoad\n\
  \  timeoutInterval:30];\n  NSURLResponse *resp = nil;\n\n  NSData *data = [NSURLConnection\
  \ sendSynchronousRequest:req\n  returningResponse:&resp\n  error:outError];\n  if\
  \ (!data)\n    return nil;\n\n  NSLog(\"%ld bytes.\", [data length]);\n\n  [classes\
  \ removeAllObjects];\n\n  NSXMLParser *parser;\n  parser = [[NSXMLParser alloc]\
  \ initWithData:data];\n  [parser setDelegate:self];\n\n  BOOL success = [parser\
  \ parse];\n  if (!success) {\n    *outError = [parser parserError];\n    return\
  \ nil;\n  }\n\n  NSArray *output = [classes copy];\n  return output;\n}\n```\n\n\
  注意解析器的 `delegate` 设置为了 `self`。由于 `NSXMLParserDelegate` 协议方法都是可选的，我们只需要添加我们感兴趣的方法。现在将它们添加到\
  \ `ScheduleFetcher.m` 中：\n\n```objc\n#pragma mark -\n#pragma mark NSXMLParserDelegate\
  \ Methods\n\n- (void)parser:(NSXMLParser *)parser\ndidStartElement:(NSString *)elementName\n\
  namespaceURI:(NSString *)namespaceURI\nqualifiedName:(NSString *)qName\nattributes:(NSDictionary\
  \ *)attributeDict\n{\n  if ([elementName isEqual:@\"class\"]) {\n    currentFields\
  \ = [[NSMutableDictionary alloc] init];\n  }\n  else if ([elementName isEqual:@\"\
  offering\"]) {\n    [currentFields setObject:[attributeDict objectForKey:@\"href\"\
  ]\n    forKey:@\"href\"];\n  }\n}\n\n- (void)parser:(NSXMLParser *)parser\ndidEndElement:(NSString\
  \ *)elementName\nnamespaceURI:(NSString *)namespaceURI\nqualifiedName:(NSString\
  \ *)qName\n{\n  if ([elementName isEqual:@\"class\"]) {\n    ScheduledClass *currentClass\
  \ = [[ScheduledClass alloc] init];\n```\n\n\n\n\n\n```objc\n[currentClass setName:[currentFields\n\
  objectForKey:@\"offering\"]];\n[currentClass setLocation:[currentFields\nobjectForKey:@\"\
  location\"]];\n[currentClass setHref:[currentFields\nobjectForKey:@\"href\"]];\n\
  \nNSString *beginString = [currentFields objectForKey:@\"begin\"];\nNSDate *beginDate\
  \ = [dateFormatter\ndateFromString:beginString];\n[currentClass setBegin:beginDate];\n\
  \n[classes addObject:currentClass];\ncurrentClass = nil;\n\ncurrentFields = nil;\n\
  }\nelse if (currentFields && currentString)\n{\n    NSString *trimmed;\n    trimmed\
  \ = [currentString stringByTrimmingCharactersInSet:\n    [NSCharacterSet whitespaceAndNewlineCharacterSet]];\n\
  \    [currentFields setObject:trimmed forKey:elementName];\n}\ncurrentString = nil;\n\
  }\n\n- (void)parser:(NSXMLParser *)parser\nfoundCharacters:(NSString *)string\n\
  {\n    if (!currentString) {\n        currentString = [[NSMutableString alloc] init];\n\
  \    }\n    [currentString appendString:string];\n}\n```\n\n正如章节开头提到的，当调用 `NSXMLParser`\
  \ 的 `parse` 方法时，它会扫描所提供的数据，并在遇到 XML 数据结构发生每次变化时调用其代理（delegate）。正如在本练习中的情况的那样，你通常只对元素的开始和结束，以及它们之间发生的字符数据感兴趣。\n\
  \n代理负责管理解析过程中的任何状态信息。`ScheduleFetcher` 使用它的 `currentString`、`currentFields` 和 `classes`\
  \ 实例变量来实现此目的。`currentString` 为当前元素累积的字符串数据会在元素结束后存储在 `currentFields` 中。一旦每个 `class`\
  \ 元素结束，就会创建一个 `ScheduledClass` 实例，并用 `currentFields` 中的值填充，然后为下一个类重新开始该过程。\n\n解析完成后，将创建\
  \ `classes` 数组的副本（使其变为不可变），并返回结果。\n\n再次运行应用程序并使用调试器在返回之前检查 `classes` 数组，以查看 XML\
  \ 正在解析。\n\n#### 布局界面\n\n在 `RanchForecastAppDelegate.h` 中，声明一个表格视图（table view）输出和一个类数组：\n\
  \n```objc\n#import <Cocoa/Cocoa.h>\n\n@interface RanchForecastAppDelegate : NSObject\
  \ <NSApplicationDelegate>\n{\n    IBOutlet NSTableView *tableView;\n    NSArray\
  \ *classes;\n}\n@property (strong) IBOutlet NSWindow *window;\n@end\n```\n\n打开 `MainMenu.xib`。将一个表格视图拖到窗口上。确保表格视图的内容模式（Content\
  \ Mode）设置为 `Cell Based`。将表格视图设置为三列：Date、Class 和 Location。将一个日期格式器拖到 Date 列单元格中，并将其日期样式（Date\
  \ Style）设置为 Medium（[图 28.5]）。\n\n**图 28.5。** 布局界面\n\n![Image](img/00251.jpg)\n\n\
  Control-点击 `RanchForecastAppDelegate` 以调出连接面板（Connection panel）并连接 `tableView` 输出。\n\
  \nControl-点击表格视图调出其连接面板。将 `RanchForecastAppDelegate` 设置为表格视图的数据源。（没有看到 `dataSource`\
  \ 输出？你是否选选了滚动视图而不是表格视图？）\n\n在第 7 章中，我们讨论过键值编码（key-value coding）有多强大。现在让我们利用它来简化编码端的工作，并将每个表格列的标识符（identifier）设置为我们要在该列中显示的\
  \ `ScheduledClass` 属性名称。使用表格视图每列的身份标识检查器（Identity Inspector）将 Date、Class 和 Location\
  \ 列的标识符分别设置为 `begin`、`name` 和 `location`（[图 28.6]）。如果你使用的是 4.2 之前的 Xcode 版本，标识符字段将显示在属性检查器（Attributes\
  \ Inspector）中。使用属性检查器使每列变为不可编辑（Not Editable）。\n\n**图 28.6.**** 为列设置标识符\n\n![Image](img/00252.jpg)\n\
  \n### 编写控制器代码\n\n更新 `RanchForecastAppDelegate.m` 以在表格视图中显示获取的类：\n\n```objc\n#import\
  \ \"RanchForecastAppDelegate.h\"\n#import \"ScheduleFetcher.h\"\n#import \"ScheduledClass.h\"\
  \n\n@implementation RanchForecastAppDelegate\n\n@synthesize window;\n\n- (void)applicationDidFinishLaunching:(NSNotification\
  \ *)aNotification\n{\n    ScheduleFetcher *fetcher = [[ScheduleFetcher alloc] init];\n\
  \    NSError *error;\n\n    classes = [fetcher fetchClassesWithError:&error];\n\
  \    [tableView reloadData];\n}\n```\n\n现在添加 `NSTableViewDataSource` 方法：\n\n```objc\n\
  #pragma mark -\n#pragma mark NSTableViewDataSource\n\n- (NSInteger)numberOfRowsInTableView:(NSTableView\
  \ *)theTableView\n{\n    return [classes count];\n}\n- (id)tableView:(NSTableView\
  \ *)theTableView\nobjectValueForTableColumn:(NSTableColumn *)tableColumn\nrow:(NSInteger)row\n\
  {\n    ScheduledClass *c = [classes objectAtIndex:row];\n    return [c valueForKey:[tableColumn\
  \ identifier]];\n}\n\n@end\n```\n\n编译并运行应用程序。你应该能看到一个即将进行的课程列表。\n\n### 打开 URL\n\n\
  最后一步是使用户双击某个类并在浏览器中打开它。在 `applicationDidFinishLaunching:` 中，设置表格视图的 `doubleAction`\
  \ 和 `target`：\n\n```objc\n- (void)applicationDidFinishLaunching:(NSNotification\
  \ *)aNotification\n{\n    [tableView setTarget:self];\n    [tableView setDoubleAction:@selector(openClass:)];\n\
  \n    ScheduleFetcher *fetcher = [[ScheduleFetcher alloc] init];\n    NSError *error;\n\
  \n    classes = [fetcher fetchClassesWithError:&error];\n    [tableView reloadData];\n\
  }\n```\n\n最后，实现 `openClass:`。在这里你使用了 `Workspace` 类。`Workspace` 代表 Finder。\n\n```objc\n\
  - (void)openClass:(id)sender\n{\n    ScheduledClass *c = [classes objectAtIndex:[tableView\
  \ selectedRow]];\n    NSURL *baseUrl = [NSURL URLWithString:@\"http://www.banch.com/\"\
  ];\n    NSURL *url = [NSURL URLWithString:[c href] relativeTo:baseUrl];\n    [[NSWorkspace\
  \ sharedWorkspace] openURL:url];\n}\n```\n\n编译并运行应用程序。双击标题即可打开所选课程的页面。\n\n### 挑战：添加\
  \ WebView\n\n目前，你正在使用另一个应用程序中打开网页。如果网页出现在现有应用程序的 sheet 中，用户可能会喜欢（[图 28.7]）。\n\n\
  **图 28.7.** 使用 WebView 显示详情\n\n![Image](img/00253.jpg)\n\n那么，挑战在于为应用程序添加一个带有 `WebView`\
  \ 的新窗口。以 sheet 的形式将窗口显示出来。\n\n你需要向项目添加 WebKit 框架。\n\n如果你有一个代表 URL 的字符串，可以通过向它发送以下消息让\
  \ `WebView` 加载该 URL：\n\n```objc\n- (void)setMainFrameURL:(NSString *)URLString;\n\
  ```\n\n这应该是你需要的全部。如果你想要进度指示器，你需要让你的控制器成为 `WebView` 的“帧加载代理”（frame load delegate）：\n\
  \n```objc\n[webView setFrameLoadDelegate:self];\n```\n\n然后你的控制器可以实现以下方法：\n\n```objc\n\
  - (void)webView:(WebView)wv\ndidStartProvisionalLoadForFrame:(WebFrame *)wf;\n\n\
  - (void)webView:(WebView)wv\ndidFinishLoadForFrame:(WebFrame *)wf;\n\n- (void)webView:(WebView)wv\n\
  didFailProvisionalLoadWithError:(NSError *)error forFrame:(WebFrame *)wf;\n```\n\
  \n\n\n\n让我们假设自己正在编写一个僵尸游戏。具体来说，我们正在编写僵尸的 AI 代码。我们希望在 `Zombie` 对象上有一个方法来寻找附近的大脑。所以我们从这里开始：\n\
  \n```objectivec\n@implementation Zombie\n\n- (NSArray *)brainsForFlags:(NSInteger)flags\n\
  {\n    return [[self game] allBrains];\n}\n\n@end\n```\n\n这是一个良好的开始，但如果返回的大脑按照距离僵尸的远近顺序排列，将会有用得多，也就是说，按照僵尸与大脑之间的距离进行排序。毕竟，僵尸是饿了。`NSArray`\
  \ 的 `sortedArrayUsingSelector:` 通常是排序的首选。它会顺序对数组中的对象调用给定的选择器，以便与其他相邻对象进行比较。例如，`NSString`\
  \ 提供了一个 `compare:` 方法。因此，我们可以用它对字符串数组进行排序：\n\n```objectivec\nNSArray *sortedStrings\
  \ = [theStrings sortedArrayUsingSelector:@selector(compare:)];\n```\n\n我们可能会考虑在\
  \ `Brain` 类中添加一个 `compareByDistanceToZombie:` 方法。但它如何知道自己正在与哪个僵尸比较距离呢？`sortedArrayUsingSelector:`\
  \ 方法并没有提供任何向排序过程传递上下文信息的方法。\n\n`NSArray` 的 `sortedArrayUsingFunction:context:` 似乎是一个更好的选择。我们可以编写一个\
  \ C 函数，并告诉 `sortedArrayUsingFunction:context:` 使用哪个函数来比较大脑。使用它的方法看起来所示：\n\n```objectivec\n\
  NSInteger CmpBrainsByZombieDist(id a, id b, void *context)\n{\n    Brain *brainA\
  \ = a;\n    Brain *brainB = b;\n    Zombie *zombie = (__bridge Zombie *)context;\n\
  \    float distA = [zombie distanceToBrain:brainA];\n    float distB = [zombie distanceToBrain:brainB];\n\
  \    if (distA == distB) return NSOrderedSame;\n    else if (distA < distB) return\
  \ NSOrderedAscending;\n    else return NSOrderedDescending;\n}\n\n- (NSArray *)brainsForFlags:(NSInteger)flags\n\
  {\n    NSArray *allBrains = [[self game] allBrains];\n    return [brains sortedArrayUsingFunction:CmpBrainsByZombieDist\n\
  \                               context:(__bridge void *)self];\n}\n```\n\nvoid\
  \ 指针 `context` 参数用于向比较函数提供额外数据；我们用它来传递 `Zombie` 实例（`self`）的指针。注意，`__bridge` 转换对于将对象引用转换为\
  \ ARC 控制之外类型是必要的。\n\n现在我们有了可行的解决方案。然而，在经过一些测试后，我们决定让僵尸拥有更多样化的选择。如果开启了 `frenzy` 模式，僵尸应该寻找无论在游戏世界中哪个位置、IQ\
  \ 值最高的大脑。现在我们需要为 `CmpBrainsByZombieDist` 提供多个参数，但所有这些参数都必须通过单个 void 指针参数传递。\n\n\
  可能你已经开始发现这种方法有许多缺点。为自定义排序维护 C 函数迫使我们的输入参数尴尬地汇聚通过一个 void 指针传递。使用 `NSDictionary` 或自定义\
  \ C 结构体可以完成工作，但它们增加了复杂性。此外，C 函数必须与调用它的代码分离，这使得高效地维护代码变得更具挑战性。\n\n然而，这个问题有一个优雅的解决方案：blocks（块）。你可以将\
  \ blocks 视为像对象一样可以传递的函数。考虑下面的解决方案。以下代码中的插入符号 (^) 是 block 的开始：\n\n```objectivec\n\
  - (NSArray *)brainsForFlags:(NSInteger)flags\n{\n    NSArray *allBrains = [[self\
  \ game] allBrains];\n    return [brains sortedArrayUsingComparator:^(id a, id b)\
  \ {\n        Brain *brainA = a;\n        Brain *brainB = b;\n        float criteriaA,\
  \ criteriaB;\n        if (flags & FrenzyMode)\n        {\n            criteriaA\
  \ = [brainA iq];\n            criteriaB = [brainB iq];\n        }\n        else\n\
  \        {\n            criteriaA = [self distanceToBrain:brainA];\n           \
  \ criteriaB = [self distanceToBrain:brainB];\n        }\n        if (criteriaA ==\
  \ criteriaB) return NSOrderedSame;\n        else if (criteriaA < criteriaB) return\
  \ NSOrderedAscending;\n        else return NSOrderedDescending;\n    }];\n}\n```\n\
  \n### Block 语法\n\nvoid 指针 context 参数用于向比较函数提供额外数据；我们用它来传递 `Zombie` 实例（`self`）的指针。注意，`__bridge`\
  \ 转换对于将对象引用转换为 ARC 控制之外类型是必要的。\n\n（注：提示中提供的文本在后半部分包含一些重复/重叠片段。我已按照要求，优先考虑了进入 Block\
  \ 语法部分的后续解释逻辑流。）\n\n\n\n然而，当变量被标记为 `__block` 时，编译器会将其本质上视为全局变量。在作用域内使用它创建的任何 block\
  \ 都可以更改它的值。由于 `__block` 会带来一些性能开销，因此它并不是默认选项。通常情况下，只捕获变量的值更有用。\n\n### Block 内部内存与对象\n\
  \n当 block 被定义时，它被创建在栈上。当定义它的方法或函数退出时，该 block 会连同所有其他局部栈变量一起从内存中移除。有时，这是没问题的；我们可能只需要在该特定方法调用的生命周期内使用\
  \ block，正如我们之前的脑排序示例那样。在方法返回后，block 不再被使用。\n\n然而在其他情况下，我们希望 block 在方法返回后继续存在。由于\
  \ block 是创建在栈上的，我们必须复制它，以确保它不会随着当前栈帧被释放。出于这个原因，我们建议在将 block 赋值给实例变量时进行拷贝：\n\n```\n\
  @property (nonatomic, copy) int (^arithmeticOperationBlock)(int);\n```\n\n就像我们可以在\
  \ block 中捕获标量值一样，我们也可以捕获对象的指针。当 Objective-C 对象的指针被 block 捕获时，它会被保留（形成一个强引用）。block\
  \ 保留的任何对象在 block 离开作用域或被释放时会被释放：\n\n```objc\nNSMutableArray *array;\narray = [NSMutableArray\
  \ array]; // 引用计数为 1，自动释放\n\nvoid (^simpleBlock)() = ^{\n    [array addObject:@\"\
  Q\"];     // 捕获了 array 指针并保留\n};\n\nsimpleBlock();\n\nreturn; // simpleBlock 从栈中弹出，释放\
  \ array\n```\n\n注意，带有 `__block` 修饰的变量不会被 block 保留。这在防止强引用循环时非常有用。注意，在 ARC 下情况依然如此；然而，ARC\
  \ 仍然将 `__block` 指针视为强引用并对其保留，除非你将变量标记为 `__weak`。\n\n考虑以下代码：\n\n```objc\ncontroller\
  \ = [[MyController alloc] init];\ncontroller.block = ^{\n    [controller doSomething];\n\
  };\n```\n\n这段代码创建了一个强引用循环。你看到了吗？\n\n`MyController` 持有对 `block` 的强引用。然而，block 持有对\
  \ `MyController` 实例的强引用！最简单的方法是使用一个临时弱引用变量，因为子对象（block）应该只对其父对象（controller）持有弱引用。\n\
  \n```objc\ncontroller = [[MyController alloc] init];\n__weak MyController *weakController\
  \ = controller;\ncontroller.block = ^{\n    [weakController doSomething];\n};\n\
  ```\n\n这解决了强引用循环。\n\n### Block 的可用性\n\nBlock 从 Mac OS X 10.6 和 iOS 4.0 开始可用，它们是\
  \ C 语言的扩展。因此，你不需要使用 Objective-C 也可以利用 block 的优势，但你确实需要一个理解 block 的编译器以及运行时支持。如果你针对的系统是\
  \ Mac OS X 10.5 或 iOS 2.2，来自 Plausible Labs 的 `PLBlocks` 提供了一个非常值得研究的解决方案。\n\n第一个使用\
  \ block 的高知名 API 是 Grand Central Dispatch（GCD），它是一个 Mac OS X 并发库。因此，许多人认为 block\
  \ 仅在多线程编程中有用。我们认为，block 在非常广泛的编程设置中都方便用。当你在自己的项目中解决问题时，你可能会发现 block 在某些意想不到的地方非常合适。\n\
  \n### RanchForecast：转向异步\n\n我们的 RanchForecast 应用在理想情况下运行良好。也就是说，拥有快速的互联网连接。然而，如果我们的网络连接很差怎么办？或者如果我们正在加载一个大多的\
  \ XML 文档，可能需要几秒钟（甚至久）来下载怎么办？\n\n我们的客户会抱怨，这也是合理的，应用程序在请求完成和表格更新之前看起来就像死了一样。原因是我们在主线程中运行同步请求，而主线程正是处理\
  \ UI 事件的线程。然而，如果我们以异步方式使用 `NSURLConnection`，就可以避免阻塞主线程，UI 将保持良好的响应能力。让我们更新 `ScheduleFetcher`\
  \ 类，以正确的方式来处理。\n\n记住，异步使用 `NSURLConnection` 意味着我们将创建连接并指定代理，使用 `initWithRequest:delegate:`。此调用将立即返回，并在连接的生命周期内调用代理方法来处理各种事件。`NSURLConnection`\
  \ 与运行循环配合以实现这一点。\n\n在我们的应用程序中，`ScheduleFetcher` 将充当连接的代理，并实现处理接收数据以及请求成功或失败完成所需的三个代理方法：\n\
  \n```objc\n- (void)connection:(NSURLConnection *)connection\n    didReceiveData:(NSData\
  \ *)data;\n\n- (void)connectionDidFinishLoading:(NSURLConnection *)connection;\n\
  \n- (void)connection:(NSURLConnection *)connection\n    didFailWithError:(NSError\
  \ *)error;\n```\n\n### 接收异步响应\n\n如果响应加载是异步进行的且 `ScheduleFetcher` 不会阻塞，那么 `RanchForecastAppDelegate`\
  \ 如何知道进度表已加载或发生了错误呢？\n\n我们可以通过几种方式实现这一点。最明显的方法是在 `ScheduleFetcher` 中为 `RanchForecastAppDelegate`\
  \ 添加一个指针。一旦获取了进度表，获取器就会调用 app delegate 上的方法（也许是 `updateWithClasses:`）。然而，这种方法的缺点是，我们刚刚让\
  \ `ScheduleFetcher` 依赖于 `RanchForecastAppDelegate`。如果我们以后想在另一个项目中使用 `ScheduleFetcher`，我们需要修改它的代码。\n\
  \n另一种方法是使用代理模式。它对 `NSURLConnection` 非常有效；`ScheduleFetcher` 也可以使用。我们会定义 `ScheduleFetcherDelegate`\
  \ 协议，`RanchForecastAppDelegate` 符合该协议并将其设置为代理。这种方法是非常合理的；它解耦了类，使 `ScheduleFetcher`\
  \ 可复用，但对于如此简单的服务响应来说，它显得有些过重。\n\n另一种方法是利用我们对 block 的知识应用回调块设计模式。在这种模式下，`ScheduleFetcher`\
  \ 上的 fetch 方法将一个 block 作为唯一参数。随后 `ScheduleFetcher` 在准备好交付结果或报告错误时调用该 block。回调块非常紧凑；不需要额外的方法，并且优点是允许我们将处理响应的代码保留在启动服务调用的位置。\n\
  \n让我们修改 `ScheduleFetcher` 以异步执行请求并使用回调块报告结果。\n\n在 `ScheduleFetcher.h` 中定义 `ScheduleFetchResultBlock`\
  \ 类型。由于 block 语法包含很多标点符号，因此对 block 类型进行 typedef 通常有助于在将来更优雅地使用它们。\n\n```objc\n#import\
  \ <Foundation/Foundation.h>\n\ntypedef void (^ScheduleFetchResultBlock)(NSArray\
  \ *classes,\nNSError *error);\n```\n\n\n\n\n```objc\nNSMutableData *responseData;\n\
  \nNSURLConnection *connection;\n\n}\n\n- (void)fetchClassesWithBlock:(ScheduleFetcherResultBlock)theBlock;\n\
  \n@end\n```\n\n现在，在 `ScheduleFetcher.m` 中，移除 `fetchClassesWithError:` 并实现 `fetchClassesWithBlock:`：\n\
  \n```objc\n- (void)fetchClassesWithBlock:(ScheduleFetcherResultBlock)theBlock\n\
  {\n    // 拷贝 block 以确保它不会保留在栈上：\n    resultBlock = [theBlock copy];\n    NSURL *xmlURL\
  \ = [NSURL URLWithString:\n                        @\"http://bignerdranch.com/xml/schedule\"\
  ];\n    NSURLRequest *req = [NSURLRequest requestWithURL:xmlURL\n              \
  \              cachePolicy:NSURLRequestReturnCacheDataElseLoad\n               \
  \         timeoutInterval:30];\n\n    connection = [[NSURLConnection alloc] initWithRequest:req\n\
  delegate:self];\n    if (connection)\n    {\n        responseData = [[NSMutableData\
  \ alloc] init];\n    }\n}\n```\n\n注意 `theBlock` 被复制了，生成的指针被存储在 `resultBlock` 中。我们拷贝\
  \ block 是因为它可能仍然位于调用方法的栈上。如果是这样，block 在该方法退出时就会被释放。由于我们启动了一个异步请求，且调用方法保证在请求完成之前返回，因此我们需要确保在带结果调用\
  \ block 之前，它的内存是有效的。如果 `theBlock` 仅在此方法内部使用而在返回后不再使用，那么拷贝它就是没有必要的。\n\n`resultBlock`、`connection`\
  \ 和 `responseData` 对象在启动获取时被创建。在请求完成后清理它们是一个好主意。为了减少重复代码，添加一个名为 `cleanup` 的新方法：\n\
  \n```objc\n- (void)cleanup\n{\n    responseData = nil;\n    connection = nil;\n\
  \    resultBlock = nil;\n}\n```\n\n在 `ScheduleFetcher.m` 中继续实现 `NSURLConnection`\
  \ 代理方法：\n\n```objc\n#pragma mark -\n#pragma mark NSURLConnection Delegate\n\n- (void)connection:(NSURLConnection\
  \ *)theConnection\ndidReceiveData:(NSData *)data\n{\n    [responseData appendData:data];\n\
  }\n\n- (void)connectionDidFinishLoading:(NSURLConnection *)theConnection\n{\n  \
  \  [classes removeAllObjects];\n\n    NSXMLParser *parser = [[NSXMLParser alloc]\n\
  \    initWithData:responseData];\n    [parser setDelegate:self];\n    BOOL success\
  \ = [parser parse];\n    if (!success)\n    {\n        resultBlock(nil, [parser\
  \ parserError]);\n    }\n    else\n    {\n        NSArray *output = [classes copy];\n\
  \        resultBlock(output, nil);\n    }\n\n    [self cleanup];\n}\n\n- (void)connection:(NSURLConnection\
  \ *)theConnection\ndidFailWithError:(NSError *)error\n{\n    resultBlock(nil, error);\n\
  \n    [self cleanup];\n}\n```\n\n响应数据在 `connection:didReceiveData:` 中收集，然后在 `connectionDidFinishLoading:`\
  \ 中进行解析。然后我们带结果或错误条件调用 `resultBlock`。\n\n现在是时候更新 `RanchForecastAppDelegate` 以适配\
  \ `ScheduleFetcher` 的新接口。在 `RanchForecastAppDelegate.m` 中，更新 `applicationDidFinishLaunching:`：\n\
  \n```objc\n- (void)applicationDidFinishLaunching:(NSNotification *)aNotification\n\
  {\n    [tableView setTarget:self];\n    [tableView setDoubleAction:@selector(openClass:)];\n\
  \n    ScheduleFetcher *fetcher = [[ScheduleFetcher alloc] init];\n\n    [fetcher\
  \ fetchClassesWithBlock:^(NSArray *theClasses,\nNSError *error)     {\n        if\
  \ (theClasses)\n        {\n            classes = theClasses;\n            [tableView\
  \ reloadData];\n        }\n        else\n        {\n            NSAlert *alert =\
  \ [[NSAlert alloc] init];\n            [alert setAlertStyle:NSCriticalAlertStyle];\n\
  \            [alert setMessageText:@\"Error loading schedule.\"];\n            [alert\
  \ setInformativeText:[error localizedDescription]];\n            [alert addButtonWithTitle:@\"\
  OK\"];\n            [alert beginSheetModalForWindow:self.window\n            modalDelegate:nil\n\
  \            didEndSelector:nil\n            contextInfo:nil];\n        }\n    }];\n\
  }\n```\n\n构建并运行应用程序。你会发现应用程序现在更快了，因为请求是异步执行的。\n\n### 挑战：设计一个代理（Delegate）\n\n在本章前面，我们讨论了如何使用代理设计模式将\
  \ Web 服务数据传回给感兴趣的方。创建一个该项目的副本并对其进行重构，使用这种模式代替 blocks。记住，代理属性应该是弱引用（weak references），以防止强引用循环。\n\
  \n## 第 30 章. 为 iOS 开发\n\niPhone 和 iPad 应用程序使用 Xcode 和 Cocoa Touch 框架编写。Cocoa Touch\
  \ 包含 Foundation、Core Graphics 和 UIKit。UIKit 类似于 AppKit，为 iPhone 程序员提供窗口、事件、视图、按钮等。然而，UIKit\
  \ 与 AppKit 并不相同。本章将带你开始在 iOS 上开发应用程序，重点介绍它们不同之处。\n\n特别是，你将没有垃圾回收机制，但可以在 iOS 上使用\
  \ ARC，或者根据你的选择使用手动引用计数（retain/release）进行内存管理。你将使用 ES 而不是普通的 OpenGL。\n\n### 将预报迁移到\
  \ iOS\n\n让 `RanchForecast` 运行的大部分内容（`NSXMLParser`、`NSURLConnection`）在 iOS 上也存在。从\
  \ Cocoa Touch 全部迁移让你感受到这两个平台之间的许多差异：导航控制器（navigation controller）和表格视图（table view）。iOS\
  \ 应用程序只有一个窗口。视图控制器（view controllers）广泛配合导航控制器使用，以创建多个屏幕的感觉。\n\n在 Xcode 中，使用 Empty\
  \ Application 模板创建一个 iOS 应用程序。某些版本的 Xcode 将称为基于窗口的应用程序。将项目命名为 `RanchTouch`，将类前缀设置为\
  \ `RanchTouch,`，并将设备族（Device Family）设置为 Universal（通用）。这会创建更多文件，但未来为 iPhone 和 iPad\
  \ 设备定制你的应用时会变得更容易。\n\n视图控制器正如其名所示：负责一个屏幕信息的控制类。我们将在下一章讨论视图控制器的作用。导航控制器管理视图控制器栈，并在它们进入离开屏幕时执行动画。顶部的导航栏（navigation\
  \ bar）为用户提供栈中的位置感，通常左侧有一个“返回”按钮，中间是标题，有时右侧有一个按钮。\n\n#### ScheduleFetcher\n\n你将使用在第\
  \ 29 章中编写的 `ScheduleFetcher` 类和 `ScheduledClass` 模型。将 `ScheduleFetcher.h`、`ScheduleFetcher.m`、`ScheduledClass.h`\
  \ 和 `ScheduledClass.m` 拖入此项目。确保勾选了“Copy items into destination group’s folder”复选框。\n\
  \n\n\n\n\n创建一个名为 `RootViewController` 的 `UIViewController` 子类。勾选带有 With XIB for\
  \ user interface 的选项框（图 30.5）。\n\n**图 30.5.** UIViewController 子类\n\n![Image](img/00259.jpg)\n\
  \n打开 `RootViewController.xib`。在视图的属性检查器（Attributes Inspector）中，将 Simulated Metrics（模拟指标）下方的\
  \ Top Bar 设置为 Navigation Bar（图 30.6）。这将视图的大小设置为适用于导航栏。\n\n**图 30.6.** 模拟导航栏\n\n\
  ![Image](img/00260.jpg)\n\n向视图上拖入一个按钮（button）和一个活动指示器（activity indicator）。将按钮的标题设置为\
  \ Fetch Classes，并将活动指示器设置为 Hides When Stopped（停止时隐藏）（图 30.7）。\n\n**图 30.7.** 将活动指示器设置为停止时隐藏\n\
  \n![Image](img/00261.jpg)\n\n现在启用助手编辑器（Assistant Editor）。这将简化我们所需的输出（outlets）和动作（actions）的创建。确保助手编辑器的跳转栏设置为\
  \ Automatic；这将在编辑器中显示 `RootViewController.h`。\n\n按住 Control 键并从按钮拖动到助手编辑器中的 `RootViewController`\
  \ 接口声明处，放并创建一个名为 `fetchButton` 的输出。参见 Storage to Weak（图 30.8）。\n\n**图 30.8.** 通过\
  \ Control-Drag 创建 fetchButton 输出\n\n对活动指示器重复此过程：创建一个名为 `activityIndicator` 的输出。然后按住\
  \ Control 键从按钮拖动到 `RootViewController` 的属性部分，创建一个名为 `fetchClasses:` 的动作。请注意，此过程的结果与手动输入输出和动作，然后在在连接面板（Connection\
  \ panels）与接口对象之间进行 Control-drag 是相同的。这在 Mac 和 iOS 项目中都可以同样操作。\n\n### 添加导航控制器\n\n\
  在我们应用程序目前的状况下，启动时将显示一个空白视图。我们希望应用启动时使用 `RootViewController`，它包含了我们刚刚连接好的 Fetch Classes\
  \ 按钮。此外，当用户点击 Fetch Classes 时，应用程序应该显示类列表。正如我们在本章早期提到的，iOS 的导航控制器（navigation controller）提供了一种管理视图控制器显示的简单方法。\n\
  \n打开 `RanchForecastTouchAppDelegate.h` 为导航控制器添加一个实例变量：\n\n```objc\n#import <UIKit/UIKit.h>\n\
  \n@interface RanchForecastTouchAppDelegate : NSObject <UIApplicationDelegate>\n\
  {\nUINavigationController *navController;\n}\n\n@property (nonatomic, strong) IBOutlet\
  \ UIWindow *window;\n\n@end\n```\n\n根视图控制器（root-view controller）是栈上最底部的视图控制器，通常是用户看到的第一个视图控制器。在\
  \ `RanchForecastTouchAppDelegate.m` 中，实例化导航控制器以及根视图控制器：\n\n```objc\n#import \"RanchForecastTouchAppDelegate.h\"\
  \n#import \"RootViewController.h\"\n\n@implementation RanchForecastTouchAppDelegate\n\
  \n@synthesize window=_window;\n\n- (BOOL)application:(UIApplication *)application\n\
  didFinishLaunchingWithOptions:(NSDictionary *)launchOptions\n{\nRootViewController\
  \ *rvc;\nrvc = [[RootViewController alloc] initWithNibName:nil bundle:nil];\nnavController\
  \ = [[UINavigationController alloc]\ninitWithRootViewController:rvc];\n\n    self.window\
  \ = [[UIWindow alloc]\n                initWithFrame:[[UIScreen mainScreen] bounds]];\n\
  [self.window addSubview:[navController view]];\n[self.window makeKeyAndVisible];\n\
  \n    return YES;\n}\n```\n\n请注意 iOS 有一个 `UIApplicationDelegate` 方法 `application:didFinishLaunchingWithOptions:`，它与\
  \ Cocoa 的 `applicationDidFinishLaunching:` 非常相似。\n\n编译并运行应用程序。它将在模拟器中启动，你应该能看到 Fetch\
  \ Classes 按钮。你可以使用 Xcode 工具栏上的 Scheme 弹出窗口，在 iPhone 模拟器或 iPad 模拟器之间选择启动应用程序。\n\n\
  ### ScheduleViewController\n\n第二个视图控制器 `ScheduleViewController` 将用于在获取完成后显示调度本身。创建一个新的\
  \ `UIViewController subclass`，但这次将其设置为 `UITableViewController` 的子类。取消勾选 With XIB\
  \ for user interface。将其命名为 `ScheduleViewController`。`UITableViewController` 本身是\
  \ `UIViewController` 的子类。\n\n打开 `ScheduleViewController.h` 添加两个实例变量和一个属性：\n\n```objc\n\
  #import <UIKit/UIKit.h>\n\n@interface ScheduleViewController : UITableViewController\n\
  {\nNSArray *classes;\nNSDateFormatter *dateFormatter;\n}\n@property (nonatomic,\
  \ strong) NSArray *classes;\n\n@end\n```\n\n在 `ScheduleViewController.m` 中导入 `ScheduledClass.h`，合成\
  \ `classes` 并对 `initWithStyle:` 和 `dealloc` 进行一些添加：\n\n```objc\n#import \"ScheduleViewController.h\"\
  \n#import \"ScheduledClass.h\"\n\n@implementation ScheduleViewController\n\n@synthesize\
  \ classes;\n\n- (id)initWithStyle:(UITableViewStyle)style\n{\n    self = [super\
  \ initWithStyle:style];\n    if (self)\n{\ndateFormatter = [[NSDateFormatter alloc]\
  \ init];\n[dateFormatter setDateStyle:NSDateFormatterLongStyle];\n[[self navigationItem]\
  \ setTitle:@\"Schedule\"];\n    }\n    return self;\n}\n```\n\n注意我们正在设置此视图控制器导航项（navigation\
  \ item）的标题。每个视图控制器都有导航项，当该视图控制器位于顶部时，它显示在导航栏中。当顶部视图控制器在其上方时，它用于提供返回按钮。可以在导航栏中配置特定于此视图控制器的按钮（称为\
  \ bar button items）。\n\n### TableViewController\n\n从 iPod 到 Stocks，几乎每个应用程序中的表格视图提供了一种高度自定义的有序信息显示方式。在处理一段时间表格视图后，你会发现喜爱的应用程序中大部分漂亮的界面都是表格视图。\n\
  \n`UITableViewController` 是 `UIViewController` 的子类，专门设计用于管理 `UITableView`。`UITableViewController`会自动创建它所管理的表格。它也是该表格的数据源（data\
  \ source）和代理（delegate），因此你的 `UITableViewController` 子类必须重写适当的方法来获取数据。与其他框架中的数据源和代理方法一致，你并不是随时都向表格视图提供数据。当准备好显示数据时，表格视图会向你请求所需的信息。\n\
  \n`UITableViewController` 子类的 Xcode 包含了必要的 `UITableViewDataSource` 方法。在 `ScheduleViewController.m`\
  \ 中填充这些方法：\n\n```objc\n#pragma mark - Table view data source\n\n- (NSInteger)numberOfSectionsInTableView:(UITableView\
  \ *)tableView\n{\nreturn 1;\n}\n\n- (NSInteger)tableView:(UITableView *)tableView\n\
  numberOfRowsInSection:(NSInteger)section\n{\n// 返回部分的行数\nreturn [classes count];\n\
  }\n\n- (UITableViewCell *)tableView:(UITableView *)tableView\n  cellForRowAtIndexPath:(NSIndexPath\
  \ *)indexPath\n{\nstatic NSString *CellIdentifier = @\"Cell\";\n\nUITableViewCell\
  \ *cell =\n[tableView dequeueReusableCellWithIdentifier:CellIdentifier];\nif (cell\
  \ == nil) {\ncell = [[UITableViewCell alloc]\ninitWithStyle:UITableViewCellStyleSubtitle\n\
  ```\n\n\n\n\n\n```objc\nreuseIdentifier:CellIdentifier];\n}\nScheduledClass *c =\
  \ [classes objectAtIndex:[indexPath row]];\nNSString *details = [NSString stringWithFormat:@\"\
  %@ - %@\",\n[dateFormatter stringFromDate:c.begin],\nc.location];\n[[cell textLabel]\
  \ setText:[c name]];\n[[cell detailTextLabel] setText:details];\nreturn cell;\n\
  }\n```\n\n`UITableView` 的工作原理与 Cocoa 中基于视图的表格视图非常相似。表格视图请求其数据源为每一行提供一个 `UITableViewCell`。数据源获取一个视图单元（我们稍后会讨论这一点），并用模型中的数据值填充其控件（在本例中为为标签\
  \ labels）。\n\n请注意，视图单元本身是通过两种方式之一获取的：通过调用 `dequeueReusableCellWithIdentifier:` 或直接创建一个。`UITableView`\
  \ 利用了大多数表格视图单元具有相同布局的这一事实。因此，当用户滚动表格导致某行不再可见时，该行的单元就会被释放出来供复用。通过这种方式，`UITableView`\
  \ 保持了低内存占用，并最大限度地减少了配置视图单元所花费的时间。表格视图使用标识符来查找特定类型的单元。因此，你仍然可以通过为不同的单元布局使用唯一的标识符，来利用单元复用的优势。\n\
  \n### 推送视图控制器\n\n`ScheduleViewController` 已经准备好在其表格中显示调度数据。我们需要修改 `RootViewController`\
  \ 来获取调度数据，然后提示 `ScheduleViewController` 显示它。\n\n在 `RootViewController.m` 中，导入 `ScheduleFetcher.h`\
  \ 和 `ScheduleViewController.h`，并设置导航项的标题：\n\n```objc\n#import \"RootViewController.h\"\
  \n#import \"ScheduleFetcher.h\"\n#import \"ScheduleViewController.h\"\n\n@implementation\
  \ RootViewController\n\n- (id)initWithNibName:(NSString *)nibNameOrNil\n       \
  \      bundle:(NSBundle *)nibBundleOrNil\n{\n    self = [super initWithNibName:nibNameOrNil\
  \ bundle:nibBundleOrNil];\n    if (self) {\n        [[self navigationItem] setTitle:@\"\
  Ranch Forecast\"];\n    }\n    return self;\n}\n```\n\n现在我们准备好填充 `fetchClasses:`\
  \ 动作的代码了。我们将使用 `ScheduleFetcher`（我们直接从该应用程序的 Cocoa 版本复制的）来获取结果。我们提供的 block 将在收到结果或发生错误时被调用。如果我们收到了调度，我们将创建一个\
  \ `ScheduleViewController` 的新实例并将其推送到导航控制器的栈上，从而向用户展示它。如果发生错误，我们将显示一个警报。\n\n填充 `fetchClasses:`\
  \ 的主体：\n\n```objc\n- (IBAction)fetchClasses:(id)sender\n{\n    [activityIndicator\
  \ startAnimating];\n    [fetchButton setEnabled:NO];\n\n    ScheduleFetcher *fetcher\
  \ = [[ScheduleFetcher alloc] init];\n\n    [fetcher fetchClassesWithBlock:\n   \
  \ ^(NSArray *classes, NSError *error) {\n\n        [fetchButton setEnabled:YES];\n\
  \        [activityIndicator stopAnimating];\n\n        if (classes) {\n        \
  \    ScheduleViewController *svc;\n            svc = [[ScheduleViewController alloc]\n\
  \            initWithStyle:UITableViewStylePlain];\n            [svc setClasses:classes];\n\
  \            [self.navigationController pushViewController:svc\n            animated:YES];\n\
  \        }\n        else\n        {\n            UIAlertView *alert;\n         \
  \   alert = [[UIAlertView alloc]\n            initWithTitle:@\"Error Fetching Classes\"\
  \n            message:[error localizedDescription]\n            delegate:nil\n \
  \           cancelButtonTitle:@\"Dismiss\"\n            otherButtonTitles:nil];\n\
  \            [alert show];\n        }\n    }];\n}\n```\n\n构建并运行应用程序。点击 Fetch Classes\
  \ 按钮。一旦收到结果，你将看到表格视图控制器推送到栈上，即将的课程表显示在表格视图中。\n\n### 挑战\n\n修改 `RanchForecastTouch`，使得当用户点击调度中的某门课程时，显示该课程的\
  \ Web view。使用表格视图代理方法 `tableView:didSelectRowAtIndexPath:` 来检测点击；然后推送一个包含 `UIWebView`\
  \ 的 `UIViewController`。\n\n## 第 31 章 视图切换\n\n通常情况下，你不需要弹出一个新窗口，只想切换一个视图并用另一个替换它。实现此点的简单方法是更改框（box）的内容视图。\n\
  \n将每个视图放在自己的 XIB 中会导致更具模块化的设计。在 Mac OS 10.5 中，Apple 在 Cocoa 中添加了 `NSViewController`\
  \ 类。我们将为每个想要切换的视图创建一个 `NSViewController` 的子类。\n\n通常情况下，你不需要弹出一个新窗口，只想切换一个视图并用另一个替换它。实现此点的简单方法是更改框（box）的内容视图。\n\
  \n将每个视图放在自己的 XIB 中会导致更具模块化的设计。在 Mac OS 10.5 中，Apple 在 Cocoa 中添加了 `NSViewController`\
  \ 类。我们将为每个想要切换的视图创建一个 `NSViewController` 的子类。\n\n### 入门\n\n在 Xcode 中，创建一个新的 Cocoa\
  \ Application。将其命名为 `My` 并启用基于文档的 Core Data 使用。将 Class 设置 `My`。打开 `MyDocument.xib`\
  \ 并向窗口添加一个框（来自 Library -> Layout）和一个弹出按钮（pop-up button）。设置框的标题和边界为 None。\n\n双击弹出按钮打开其菜单。从弹出按钮移除所有菜单项。你将通过代码创建它们。\n\
  \n在 `MyDocument.h` 中，添加两个 outlet、一个数组和一个 action：\n\n```objc\n#import <Cocoa/Cocoa.h>\n\
  \n@interface MyDocument : NSPersistentDocument {\n    IBOutlet NSBox *box;\n   \
  \ IBOutlet NSPUpButton *popUp;\n    NSMutableArray *viewControllers;\n}\n- (IBAction)changeViewController:(id)sender;\n\
  \n@end\n```\n\n回到 `MyDocument.xib`，在 File’s Owner 上控制点击以弹出连接面板，并设置两个 outlet。\n\n\
  现在从弹出按钮控制键拖动到 File’s Owner 以设置其目标。动作应该是 `changeViewController:`。\n\n### ManagedViewController\
  \ 类\n\n创建一个 `NSViewController` 的新 `Objective-C 类`，并命名为 `ManagingViewController`。使用项目导航器删除\
  \ Xcode 为我们创建的 `ManagingViewController.xib` 文件，我们将为 `ManagingViewController` 子类创建对应的\
  \ .h 和 .m 以及 XIB。编辑 `ManagingViewController.h`：\n\n```objc\n#import <Cocoa/Cocoa.h>\n\
  \n@interface ManagingViewController : NSViewController {\n    NSManagedObjectContext\
  \ *managedObjectContext;\n}\n@property (strong) NSManagedObjectContext *managedObjectContext;\n\
  \n@end\n```\n\n在 `ManagingViewController.m` 中，移除 Xcode 模板创建的初始化器 `synthesize managedObjectContext`：\n\
  \n```objc\n#import \"ManagingViewController.h\"\n\n@implementation ManagingViewController\n\
  @synthesize managedObjectContext;\n\n@end\n```\n\n#### 创建 ViewControllers 及其 XIB\
  \ 文件\n\n\n\n\n现在你将创建两个独立的视图，并将它们切换到你创建的框中。每个视图都有其自己的控制器：即 `ManagingViewController`\
  \ 的子类。因此，你将重复两次相同的步骤步骤：\n\n1. 创建 `ManagingViewController` 的子类作为文件所有者（File’s Owner）。\n\
  2. 为该视图创建一个 XIB 文件。\n\n其中一个视图用于查看公司的部门，另一个视图用于查看公司的员工。你将先处理 `Departments`（部门）视图。\n\
  \n在 Xcode 中，创建一个自 `ManagingViewController` 的 Objective-C 类，并将其命名为 `DepartmentViewController`。在\
  \ `DepartmentViewController.h` 中，导入 `ManagingViewController.h`。\n\n在 Xcode 中，创建一个新的视图\
  \ XIB（Mac OS X -> User Interface -> View）。将其命名为 `DepartmentView`。打开 `DepartmentView.xib`。在视图上放置几个文本字段和按钮。（我们不会使用这些控件；我们只是想让你在视图出现在框中时看到一些有趣的内容。）\n\
  \n在 `Identity Inspector`（身份检查器）中，将 File’s Owner 的类设置为 `DepartmentViewController`。按住\
  \ Control  own File’s Owner 并拖动到视图（标记为 Custom View）以设置 `view` outlet。（`view` outlet\
  \ 定义在 `NSViewController` 中。）保存 XIB 文件。\n\n**图 31.4。** 将视图控制器引入其视图中\n\n![Image](img/00266.jpg)\n\
  \n回到 `DepartmentViewController.m`，在 `init` 方法中为控制器提供一个 XIB 和一个标题：\n\n```objectivec\n\
  - (id)init\n{\n    self = [super initWithNibName:@\"DepartmentView\"\n    bundle:nil];\n\
  \    if (self) {\n        [self setTitle:@\"Departments\"];\n    }\n    return self;\n\
  }\n```\n\n可以吗？很好。对 `EmployeeViewController` 重复操作：\n\n- 创建名为 `EmployeeViewController`\
  \ 的类，并使其成为 `ManagingViewController` 的子类。\n- 创建一个带有视图的 XIB 文件（命名为 `EmployeeView.xib`）。\n\
  - 在视图上放置一个文本视图（或其他漂亮的内容）。\n- 将 File’s Owner 的类设置为 `EmployeeViewController`。\n- 将\
  \ File’s Owner 的 `view` outlet 指向该视图。\n- 为 `EmployeeViewController.m` 添加一个 `init`\
  \ 方法：\n\n```objectivec\n      - (id)init\n      {\n          self = [super initWithNibName:@\"\
  EmployeeView\"\n                                    bundle:nil];\n          if (self)\
  \ {\n              [self setTitle:@\"Employees\"];\n          }\n          return\
  \ self;\n      }\n```\n\n### 为 MyDocument 添加视图切换功能\n\n现在你需要在 `MyDocument` 中创建控制器的实例并将它们添加到\
  \ `viewControllers` 数组中。将以下代码添加到 `MyDocument.m`：\n\n```objectivec\n#import \"MyDocument.h\"\
  \n#import \"DepartmentViewController.h\"\n#import \"EmployeeViewController.h\"\n\
  \n@implementation MyDocument\n\n- (id)init\n{\nself = [super init];\nif (self) {\n\
  \    viewControllers = [[NSMutableArray alloc] init];\n\n    ManagingViewController\
  \ *vc;\n    vc = [[DepartmentViewController alloc] init];\n    [vc setManagedObjectContext:[self\
  \ managedObjectContext]];\n    [viewControllers addObject:vc];\n\n    vc = [[EmployeeViewController\
  \ alloc] init];\n    [vc setManagedObjectContext:[self managedObjectContext]];\n\
  \    [viewControllers addObject:vc];\n}\nreturn self;\n}\n```\n\n创建用于切换视图的方法：\n\n\
  ```objectivec\n- (void)displayViewController:(ManagingViewController *)vc\n{\n \
  \   // 尝试结束编辑\n    NSWindow *w = [box window];\n    BOOL ended = [w makeFirstResponder:w];\n\
  \    if (!ended) {\n        NSBeep();\n        return;\n    }\n    // 将视图放入框中\n\
  \    NSView *v = [vc view];\n    [box setContentView:v];\n}\n```\n\n在 `MyDocument.h`\
  \ 中声明该方法（同时也让编译器知道 `ManagingViewController` 类）：\n\n```objectivec\n@class ManagingViewController;\n\
  ...\n- (void)displayViewController:(ManagingViewController *)vc;\n...\n```\n\n弹出式按钮（pop-up\
  \ button）本质上是一个带有菜单的按钮。当 NIB 文件加载时，你需要加载包含每个控制器项的菜单。将此代码添加到 `MyDocument.m`：\n\n\
  ```objectivec\n- (void)windowControllerNib:(NSWindowController *)wc\n{\n    [super\
  \ windowControllerNib:wc];\n    NSMenu *menu = [popUp menu];\n    NSUInteger i,\
  \ itemCount;\n    itemCount = [viewControllers count];\n\n    for (i = 0; i < itemCount;\
  \ i++) {\n        ManagingViewController *vc = [viewControllers objectAtIndex:i];\n\
  \        NSMenuItem *mi = [[NSMenuItem alloc] initWithTitle:[vc title]\n       \
  \                                        action:@selector(changeViewController:)\n\
  \                                            keyEquivalent:@\"\"];\n        [mi\
  \ setTag:i];\n        [menu addItem:mi];\n    }\n    // 初始化显示第一个控制器\n    [self displayViewController:[viewControllers\
  \ objectAtIndex:0]];\n    [popUp selectItem:0];\n}\n```\n\n注意菜单项的 `tag` 被设置为该菜单项代表的控制器在\
  \ `viewControllers` 数组中的索引。我们可以在菜单项触发的动作中使用 tag：\n\n```objectivec\n- (IBAction)changeViewController:(id)sender\n\
  {\n    NSUInteger i = [sender tag];\n    ManagingViewController *vc = [viewControllers\
  \ objectAtIndex:i];\n    [self displayViewController:vc];\n}\n```\n\n编译并运行应用程序。弹出按钮允许你在两个视图之间跳转。\n\
  \n### 调整窗口大小\n\n如果两个视图完全不同会怎样？如果窗口能拉伸以完美适应框难道不是很棒吗？你现在将添加该功能。\n\n打开视图 XIB 并让两个视图不同。在\
  \ `MyDocument.xib` 中，选择框并使用 Size Inspector 使随窗口调整。\n\n**图 31.5。框的尺寸检查器**\n\n![Image](img/0267.jpg)\n\
  \n选择窗口。在 Attributes Inspector 中，防止用户调整大小。\n\n**图 31.6。禁用调整大小**\n\n![Image](img/0268.jpg)\n\
  \n在 `MyDocument.m` 中，将以下行添加到 `displayViewController:` 方法中：\n\n```objectivec\n- (void)displayViewController:(ManagingViewController\
  \ *)vc\n{\n    // 结束编辑\n    NSWindow *w = [box window];\n    BOOL ended = [w makeFirstResponder:w];\n\
  \    if (!ended) {\n        NSBeep();\n        return;\n    }\n    NSView *v = [vc\
  \ view];\n\n    // 计算新的窗口帧\n    NSSize currentSize = [[box contentView] frame].size;\n\
  \    NSSize newSize = [v frame].size;\n    float deltaWidth = newSize.width - currentSize.width;\n\
  \    float deltaHeight = newSize.height - currentSize.height;\n    NSRect windowFrame\
  \ = [w frame];\n    windowFrame.size.height += deltaHeight;\n    windowFrame.origin.y\
  \ -= deltaHeight;\n    windowFrame.size.width += deltaWidth;\n\n    // 清空框以调整大小\n\
  \    [box setContentView:nil];\n    [w setFrame:windowFrame display:YES animate:YES];\n\
  \n    [box setContentView:v];\n}\n```\n\n编译并运行程序。当你切换视图时，窗口将调整大小以适应新视图。\n\n## Core\
  \ Data 关系\n\n是时候深入研究 Core Data 了。在第 11 章中，你处理的是单个实体（`Car`）。在大多数应用程序中，会有多个实体以及它们之间的关系。Core\
  \ Data 支持一对一关系和一对多关系（有序或无序）。\n\n在这个练习中，将有两个实体：`Employee` 和 `Department`。一个员工属于一个部门。一个部门有一组员工；其中一个员工（从组中选择）是经理。因此，有三个关系。\n\
  \n**图 32.1。数据模型**\n\n![Image](img/00269.jpg)\n\n### 编辑模型\n\n\n\n\n\n在本节中，你将扩展在上一章节中开始的\
  \ `Departments` 项目。打开 `MyDocument.xcdatamodel`。添加两个实体：`Employee` 和 `Department`。\n\
  \n`Employee` 将拥有两个属性 `firstName` 和 `lastName`（均为字符串），以及一个与 `Department` 的 `department`\
  \ 一一对（to-one）关系。添加这些属性（图 32.2）。\n\n**图 32.2.** Employee 实体\n\n![Image](img/00270.jpg)\n\
  \n`Department` 将拥有一个字符串属性 `deptName`；一个与 `Employee` 的 `employees` 一一对多（to-many）关系；以及一个与\
  \ `Employee` 的 `manager` 一一对一（to-one）关系。添加这些属性（图 32.3）。\n\n**图 32.3.** Department\
  \ 实体\n\n![Image](img/00271.jpg)\n\n注意，`Employee` 的 `department` 关系和 `Department`\
  \ 的 `employees` 关系是反向的。确保这两个关系都设置了反向关系（如截图所示）。\n\n`manager` 关系将没有反向关系。编译时可能会收到关于此的警告：请忽略该警告。\n\
  \n### 创建自定义 NSManagedObject 类\n\n你需要显示员工的全名，因此你将创建一个自定义类来存储员工数据。该类将是 `NSManagedObject`\
  \ 的子类。\n\n部门只能由在该部门工作的员工进行管理。当作为经理的员工离开该部门时，你需要将 `manager` 设置为 `nil`。这将由 `Department`\
  \ 实体的自定义 `NSManagedObject` 子类来处理。\n\n确保你的 `MyDocument.xcdatamodel` 文件在编辑器中打开，并选择其中一个实体。在\
  \ Xcode 中，选择 `Editor -> Create NSManagedObject Subclass...` 菜单项。为 `Employee` 和 `Department`\
  \ 创建类（图 32.4）。\n\n**图 32.4.** 创建 NSManagedObject 子类\n\n![Image](img/00272.jpg)\n\
  \n#### Employee\n\n在 `Employee.h` 中，将 `firstName` 和 `lastName` 的类型从 `retain` 改为\
  \ `copy`，并声明只读属性 `fullName`：\n\n```objc\n#import <Foundation/Foundation.h>\n#import\
  \ <CoreData/CoreData.h>\n\n@class Department;\n@interface Employee : NSManagedObject\
  \ {\n@private\n}\n@property (nonatomic, copy) NSString *firstName;\n@property (nonatomic,\
  \ copy) NSString *lastName;\n@property (nonatomic, retain) Department *department;\n\
  @property (nonatomic, readonly) NSString *fullName;\n@end\n```\n\n在 `Employee.m`\
  \ 中，实现方法 `fullName:`：\n\n```objc\n- (NSString *)fullName\n{\n    NSString *first\
  \ = [self firstName];\n    NSString *last = [self lastName];\n    if (!first)\n\
  \        return last;\n    if (!last)\n        return first;\n\n    return [NSString\
  \ stringWithFormat:@\"%@ %@\", first, last];\n}\n```\n\n我们将表格的列绑定到 `fullName` 键。如果\
  \ `firstName` 或 `lastName` 发生变化，那么让 `fullName` 的观察者知道它也发生了变化是非常关重要的。你将重写一个类方法来指定哪些键会导致\
  \ `fullName` 的变化：\n\n```objc\n+ (NSSet *)keyPathsForValuesAffectingFullName\n{\n\
  \    return [NSSet setWithObjects:@\"firstName\", @\"lastName\", nil];\n}\n```\n\
  \n#### Department\n\n在我们的模型中，经理必须是部门的成员。因此，如果我们被要求移除一个该部门的经理员工，我们希望将 `manager` 设置为\
  \ `nil`。为了实现这一点，请在 `Department.m` 中实现这些方法：\n\n```objc\n#import \"Department.h\"\n\
  #import \"Employee.h\"\n\n@implementation Department\n\n@dynamic deptName;\n@dynamic\
  \ manager;\n@dynamic employees;\n\n- (void)addEmployeesObject:(Employee *)value\n\
  {\n    NSLog(@\"Dept %@ adding employee %@\", [self deptName], [value fullName]);\n\
  \    NSSet *s = [NSSet setWithObject:value];\n    [self willChangeValueForKey:@\"\
  employees\"\n          withSetMutation:NSKeyValueUnionSetMutation\n          usingObjects:s];\n\
  \    [[self primitiveValueForKey:@\"employees\"] addObject:value];\n    [self didChangeValueForKey:@\"\
  employees\"\n          withSetMutation:NSKeyValueUnionSetMutation];\n}\n\n- (void)removeEmployeesObject:(Employee\
  \ *)value\n{\n    NSLog(@\"Dept %@ removing employee %@\", [self deptName], [value\
  \ fullName]);\n    if (manager == value) {\n        manager = nil;\n    }\n    NSSet\
  \ *s = [NSSet setWithObject:value];\n    [self willChangeValueForKey:@\"employees\"\
  \n          withSetMutation:NSKeyValueUnionSetMutation\n          usingObjects:s];\n\
  \    [[self primitiveValueForKey:@\"employees\"] removeObject:value];\n    [self\
  \ didChangeValueForKey:@\"employees\"\n          withSetMutation:NSKeyValueUnionSetMutation];\n\
  }\n\n@end\n```\n\n\n\n\n\n在 `NSResponder` 中定义的事件方法（如 `mouseDown:` 和 `keyDown:`）通常只是将事件转发给\
  \ `nextResponder`。因此，未处理的事件会沿着响应链向上传递。\n\n例如，例如，当有人在表格视图中选择一行并按下 Delete 键时，该事件会一直沿着响应链向上传递，直到被处理为止。让我们为\
  \ `Departments` 项目中的 `EmployeeView` 处理这种情况。由于 `NSViewController` 是 `NSResponder`\
  \ 的子类，因此我们可以将其放入响应链中，并让它处理未处理的键盘事件。在 `MyDocument.m` 的 `displayViewController:` 方法末尾添加以下几行：\n\
  \n```objc\n[box setContentView:v];\n// 将视图控制器放入响应链\n[v setNextResponder:vc];\n[vc\
  \ setNextResponder:box];\n}\n```\n\n在 `EmployeeViewController.m` 中添加这两个方法：\n\n```objc\n\
  // 接收键事件\n- (void)keyDown:(NSEvent *)e\n{\n    [self interpretKeyEvents:[NSArray\
  \ arrayWithObject:e]];\n}\n\n// 处理退格键\n- (void)deleteBackward:(id)sender\n{\n  \
  \  [employeeController remove:nil];\n}\n```\n\n现在，如果它接收到 `keyDown:` 事件，视图控制器将请求解释该事件。如果键事件是按下\
  \ Delete 键，将调用 `deleteBackward:`，此时我们向数组控制器发送 `remove:` 消息。\n\n现在，你需要一个名为 `employeeController`\
  \ 的输出（outlet）。在 `EmployeeViewController.h` 中添加它：\n\n```objc\nIBOutlet NSArrayController\
  \ *employeeController;\n```\n\n打开 `EmployeeView.xib`。在 Interface Builder 节点中点击 File's\
  \ Owner。从 `employeeController` 输出拖动到 Employees 数组控制器上。\n\n构建并运行应用程序。选择一个员工并按下 Delete\
  \ 键。该员工应该消失。\n\n## 第 33 章 Core Animation\n\n随着 Mac OS X 的演进，它越来越多地使用 OpenGL 来利用现代图形处理器的能力。为了让所有程序员方便使用这些功能，Apple\
  \ 在 Mac OS X 10.5 中创建了 Core Animation。Core Animation 功能非常丰富，不仅可以用于 UI 组件动画，还可以作为从零创建自定义\
  \ UI 元素的工具。\n\nCore Animation 的核心类是 `CALayer`，你可以将其看作一个构建块。可以通过它的属性以多种方式配置其外观。其中包括位置、大小、图像内容、背景颜色、边框、阴影和圆角。还可以使用另一个层来遮罩层，或者应用\
  \ 3D 变换。大多数属性都可以通过简单设置新值来实现动画。\n\n层在某些方面与视图（views）相似。与视图一样，层按层级结构排列。一个视图可以被层覆盖，而该层可以有子层。你也可以向\
  \ `CALayer` 绘图，类似于自定义视图。然而，与视图不同，层不接收用户输入事件（鼠标、键盘），且不是响应链的一部分。\n\n操纵层的属性会使其产生动画，但我们有时需要更多的控制。`CAAnimation`\
  \ 及其子类允许我们精细调整动画。`CATransaction` 可用于分组和同步多个动画，还可以临时禁用动画。\n\n## 散点（Scattered）\n\n\
  让我们创建一个使用 Core Animation 驱动界面的应用程序。这个特定的应用程序将加载文件夹中找到的所有图像，并使用 `CALayer` 对象显示它们（图\
  \ 33.1）。在本次练习中，我们将使用点符号法来设置 Core Animation 对象上的属性。\n\n**图 33.1.** 完成的应用程序\n\n![Image](img/00278.jpg)\n\
  \n在 Xcode 中，创建一个名为 `Scattered` 的新项目，类前缀为 `Scattered`。将其设置为不基于文档（not to be document\
  \ based）。由于我们将使用 Core Animation，请添加 QuartzCore 框架。切换到项目导航器并选择 Scattered 项目项。在项目编辑器中，选择\
  \ Scattered target 并点击 Linked Frameworks and Libraries 下方的按钮。选择 `QuartzCore.framework`。\n\
  \n接下来，打开 `ScatteredAppDelegate.h`。导入 `QuartzCore.h` 并添加以下实例变量：\n\n```objc\n#import\
  \ <Cocoa/Cocoa.h>\n#import <QuartzCore/QuartzCore.h>\n\n@interface ScatteredAppDelegate\
  \ : NSObject <NSApplicationDelegate> {\n    IBOutlet NSView *view;\n    CATextLayer\
  \ *textLayer;\n}\n@property (assign) IBOutlet NSWindow *window;\n\n@end\n```\n\n\
  打开 `MainMenu.xib`。在 Interface Builder 节点中选择窗口以显示它，然后向其拖入一个自定义视图（Custom View）。将其调整大小以填充窗口。确保它足够大，至少为\
  \ 500 × 500。\n\n右键点击节点中的 Scattered App Delegate 以显示其连接面板。从 `view` 输出拖动连接到你创建的自定义视图上（图\
  \ 33.2）。\n\n**图 33.2.** 自定义视图\n\n![Image](img/0279.jpg)\n\n打开 `ScatteredAppDelegate.m`\
  \ 并执行以下操作：\n\n```objc\n#import \"ScatteredAppDelegate.h\"\n\n@interface ScatteredAppDelegate\
  \ ()\n- (void)addImagesFromURL:(NSURL *)url;\n- (void)presentImage:(NSImage *)image;\n\
  - (void)setText:(NSString *)text;\n@end\n\n@implementation ScatteredAppDelegate\n\
  \n@synthesize window;\n\n- (void)applicationDidFinishLaunching:(NSNotification *)a\n\
  {\n    srandom((unsigned)time(NULL));\n\n    // 设置视图为层托管（layer-hosting）：\n    view.layer\
  \ = [CALayer layer];\n    [view setWantsLayer:YES];\n\n    CALayer *textContainer\
  \ = [CALayer layer];\n    textContainer.anchorPoint = CGPointZero;\n    textContainer.position\
  \ = CGPointMake(10, 10);\n    textContainer.zPosition = 100;\n    textContainer.backgroundColor\
  \ = CGColorGetColor(kColorBlack);\n    textContainer.borderColor = CGColorGetColor(kColorWhite);\n\
  \    textContainer.borderWidth = 2;\n    textContainer.cornerRadius = 15;\n    textContainer.shadowOpacity\
  \ = 0.5;\n    [view.layer addlayer:textContainer];\n\n    textLayer = [CATextLayer\
  \ layer];\n    textLayer.anchorPoint = CGPointZero;\n    textLayer.position = CGPointMake(10,\
  \ 6);\n    textLayer.zPosition = 100;\n    textLayer.fontSize = 24;\n    textLayer.foregroundColor\
  \ = CGColorGetColor(kColorWhite);\n    [textContainer addlayer:textLayer];\n\n \
  \   // 依赖 setText: 来设置上述层\n    [self setText:@\"Loading...\"];\n\n    [self addImagesFromURL:[NSURL\
  \ fileURLWithPath:@\"/Library/Desktop Pictures\"]];\n}\n\n- (void)addImagesFromURL:(NSURL\
  \ *)url\n{\n    // 加载并显示图像的实现\n}\n\n- (void)presentImage:(NSImage *)image\n{\n \
  \   // 显示图像的实现\n}\n\n- (void)setText:(NSString *)text\n{\n    // 设置文本的实现\n}\n\n\
  @end\n```\n\n\n\n\n第一层 `textContainer` 被添加到视图的层中，而 `textLayer` 被添加到 `textContainer`\
  \ 中（图 33.3）。注意，每个层的 `anchorPoint` 被设置为 (0, 0)，这等于左下角。层的默认的 `anchorPoint` 为 (0.5,\
  \ 0.5)，即图层的中心。`anchorPoint` 决定了层相对于其 `position` 属性的位置。\n\n**图 33.3.** 完成的应用程序\n\n\
  ![Image](img/00280.jpg)\n\n接下来，调用 `setText:`，它会设置层的边界（bounds）。bounds 描述了层的大小；默认情况下，层的\
  \ bounds 为 (0, 0, 0, 0)。层像视图一样拥有 `frame` 属性，但更常见的做法是独立设置位置和边界。\n\n接下来，实现 `setText:`、`thumbImageFromImage:`\
  \ 和 `addImagesFromFolderURL:`。虽然你可能不熟悉正在使用的特定 API，但你应该对它们在做什么有一个大致的了解。\n\n```objc\n\
  - (void)setText:(NSString *)text\n{\n    NSFont *font = [NSFont systemFontOfSize:textLayer.fontSize];\n\
  \    NSDictionary *attrs = [NSDictionary dictionaryWithObjectsAndKeys:\n    font,\
  \ NSFontAttributeName, nil];\n    NSSize size = [text sizeWithAttributes:attrs];\n\
  \    // 确保大小是整数：\n    size.width = ceilf(size.width);\n    size.height = ceilf(size.height);\n\
  \    textLayer.bounds = CGRectMake(0, 0, size.width, size.height);\n    textLayer.superlayer.bounds\
  \ = CGRectMake(0, 0, size.width + 16,\n    size.height + 20);\n    textLayer.string\
  \ = text;\n}\n\n- (NSImage *)thumbImageFromImage:(NSImage *)image\n{\n    const\
  \ CGFloat targetHeight = 200.0f;\n    NSSize imageSize = [image size];\n    NSSize\
  \ smallerSize = NSMakeSize(targetHeight * imageSize.width /\n    imageSize.height,\n\
  \    targetHeight);\n\n    NSImage *smallerImage = [[NSImage alloc] initWithSize:smallerSize];\n\
  \n    [smallerImage lockFocus];\n    [image drawInRect:NSMakeRect(0, 0, smallerSize.width,\n\
  \    smallerSize.height)\n    fromRect:NSZeroRect\n    operation:NSCompositeCopy\n\
  \    fraction:1.0];\n    [smallerImage unlockFocus];\n\n    return smallerImage;\n\
  }\n\n- (void)addImagesFromFolderURL:(NSURL *)folderURL\n{\n    NSTimeInterval t0\
  \ = [NSDate timeIntervalSinceReferenceDate];\n\n    NSFileManager *fileManager =\
  \ [NSFileManager new];\n    NSDirectoryEnumerator *dirEnum =\n    [fileManager enumeratorAtURL:folderURL\n\
  \    includingPropertiesForKeys:nil\n    options:NSDirectoryEnumerationSkipsHiddenFiles\n\
  \    errorHandler:nil];\n\n    int allowedFiles = 10;\n\n    for (NSURL *url in\
  \ dirEnum)\n    {\n        // 跳过目录：\n        NSNumber *isDirectory = nil;\n    \
  \    [url getResourceValue:&isDirectory\n        forKey:NSURLIsDirectoryKey\n  \
  \      error:nil];\n        if ([isDirectory boolValue])\n        continue;\n\n\
  \        NSImage *image = [[NSImage alloc] initWithContentsOfURL:url];\n       \
  \ if (!image)\n        return;\n\n        allowedFiles--;\n        if (allowedFiles\
  \ < 0)\n        break;\n\n        NSImage *thumbImage = [self thumbImageFromImage:image];\n\
  \n        [self presentImage:thumbImage];\n        [self setText:[NSString stringWithFormat:@\"\
  %0.1fs\",\n        [NSDate timeIntervalSinceReferenceDate] - t0]];\n    }\n}\n```\n\
  \n最后，在 `ScatteredAppDelegate` 中实现 `presentImage:`，将提供的图像动画到视图上，从中间的一个微小点开始，并扩展到视图上随机位置的缩图版本：\n\
  \n```objc\n- (void)presentImage:(NSImage *)image\n{\n    CGRect superlayerBounds\
  \ = view.layer.bounds;\n    NSPoint center = NSMakePoint(CGRectGetMidX(superlayerBounds),\n\
  \    CGRectGetMidY(superlayerBounds));\n\n    NSRect imageBounds = NSMakeRect(0,\
  \ 0, image.size.width,\n    image.size.height);\n\n    CGPoint randomPoint = CGPointMake(\n\
  \    CGRectGetMidX(superlayerBounds),\n    CGRectGetMidY(superlayerBounds));\n\n\
  \    // ... 动画实现逻辑 ...\n}\n```\n\n### 隐式动画与动作\n\n在我们讨论如何开启之前，让我们先看看隐式动画是如何实现的。\n\
  \n\n\n\n\n## 关于 CALayer\n\n`CALayer` 允许你通过其属性控制大量的外观。但如果这还不够用呢：如果你想在 `CALayer` 中进行自定义绘制怎么办？`CALayerDelegate`\
  \ 的方法 `drawLayer:inContext:` 允许你使用 Core Graphics/Quartz 实现这一目标。\n\n然而，在很多时候，你只是想控制一些常见的属性：\n\
  \n> • 一张图片\n> • 背景颜色\n> • 角是否圆角，如果是，圆角程度是多少\n> • 用于处理层内容的图像过滤器\n\n`CALayer` 的子类让特定类型的绘制变得更容易。\n\
  \n> • 正如所见，如果层是 `CATextLayer` 的实例，在层上绘制文字会变得更容易。\n> • `CAShapeLayer` 让绘制描边和/或填充的路径变得简单。\n\
  > • `CAGradientLayer` 显示可配置的渐变。\n> • 如果层是 `CAOpenGLLayer` 的子类，将 OpenGL 调用到层中会变得更容易。\n\
  > • 视图的基础层是 `_NSViewBackingLayer` 的实例（这不是一个公共类！），它知道在自己身上绘制视图的内容。\n\n### 挑战 1\n\n\
  为每个图像层添加一个文本层，以显示该图片的文件。你需要为 `presentImage:` 提供一个额外的参数。尝试为这些层添加阴影和边框。\n\n### 挑战\
  \ 2\n\n在窗口中添加一个按钮和一个文本字段。点击按钮时，按钮应该重新定位所有图像层，但不要移动那个圆角的黑色文本容器层！使用来自文本字段的数值来设置此重新定位动画的持续时间。\n\
  \n## 第 34 章 并发\n\n到目前为止，我们在书中编写的所有应用程序都是单线程的。通俗地说，这意味着在任何给定时刻，应用程序中只发生一件事，例如响应按钮点击、更新显示或计算数组中对象的数量。\n\
  \n当然，在某些情况下，能够同时做很多事情是非常用的。在现代操作系统中，每个应用程序都运行在自己的进程中；这种划分为每个应用程序提供了各自的内存空间，但也允许任务调度器营造出许多应用程序同时运行的幻象。\n\
  \n# 多线程\n\n线程为单个进程赋予了同样的力量。进程中的每个线程都有自己的栈，这意味着每个线程都可以执行自己的代码路径并拥有自己的栈变量。然而，分配对象的堆是所有线程共享的，全局变量也是如此。每个进程启动时都有一个线程，称为主线程。可以随时创建额外的线程（称为后台线程），它们将被调度为与进程中的其他线程并发运行。这被称为多线程。\n\
  \n在 Cocoa 中，显示始终由主线程更新，主线程还负责处理来自窗口管理器的事件。因此，如果你的应用程序的主线程在用户尝试调整窗口大小时正忙于计算圆周率的 6\
  \ 万亿位，窗口将看起来忽略鼠标输入，直到主线程忙回来处理事件。计算圆周率是后台线程的绝佳用例。硬件 I/O 是一个更好的候选，因为硬盘由于众所周知的原因比处理器和内存慢得多。如果你的应用程序需要同步网络通信（异步是不行的），那么即使在网络出现波动时，后台线程也能让你的应用程序中的其他线程保持继续运行。通过多线程，你的应用程序在深思熟虑时仍保持对用户的响应。\n\
  \n过去几年中对多核心处理器的强调导致了 Mac OS X 的许多改进，即 `NSOperationQueue` 和大中央调度（Grand Central Dispatch），这些工具使得多线程对开发者来说变得更容易上手。在本章中，我们将查看\
  \ `NSOperationQueue` 以及其他创建后台线程的方法。\n\n### 你面前开启了一个巨大的深渊\n\n虽然多线程在某些应用程序中可能是必不可少的，但它也开启了一类全新的、且极难修复的\
  \ Bug：竞态条件。正因如此，我们建议你仔细权衡多线程的好处与巨大的代价。\n\n当代码在两个或多个线程中修改相同的数据时，就会发生竞态条件。考虑两个线程增加全局变量的经典案例（图\
  \ 34.1）。这里是全局整数变量：\n\n```\nint globalCount = 0;\n```\n\n图 34.1 经典的竞态条件\n\n![Image](img/00281.jpg)\n\
  \n现在想象两个线程并发执行这段代码：\n\n```\nfor (int i = 0; i < 1000; i++) {\n    globalCount =\
  \ globalCount + 1;\n}\n```\n\n看起来，程序员的预期是当两个线程完成后，`globalCount` 将等于 2000。然而，取决于线程如何调度，`globalCount`\
  \ 的最终值可能小得多。为什么会这样？原因是线程调度器可能会任何时间中断任何线程以运行另一个线程，或者它可能在多核心系统的内核上同时运行多个线程。因此，语句\n\
  \n```\nglobalCount = globalCount + 1;\n```\n\n实际上是几条指令：\n\ni. 将 `globalCount` 的值加载到寄存器中。\n\
  ii. 将此值加 1。\niii. 将结果存回 `globalCount`。\n\n考虑两个线程反复运行这些指令的影响。一个线程对 `globalCount`\
  \ 的增加值极有可能被另一个线程覆盖。更糟糕的是，此类代码在不同系统甚至同一系统上的运行结果是不一致的。这是一个竞态条件的相当级示例，但它说明了多线程的通用问题：你无法假设线程何时会被调度、它执行多久会被中断、哪些线程可能同时运行，以及数据访问的排他性。通常，竞态条件\
  \ Bug 的影响比一个未增加的整数大得多。\n\n幸运的是，Cocoa 提供了一些处理这些问题的工具。它们不会魔法般地解决，你需要谨慎地使用这些工具，因为它们会产生自己的一的问题，例如死锁。我们将在章末检查这些工具之一。\n\
  \n如果你计划在应用程序中使用多线程，请在早期花时间考虑你的数据结构将如何被使用，并尽量减少数据结构的共享。细致的设计将在将来需要调试时为你节省很多麻烦。\n\n\
  ### 简单的 Cocoa 后台线程\n\n现在你已经对多线程有了足够的警惕，让我们看看在 Cocoa 中创建后台线程的一种方法。`NSThread.h` 有一个非常实用的\
  \ `NSObject` 分类，包含以下方法：\n\n```\n- (void)performSelectorInBackground:(SEL)aSelector\
  \ withObject:(id)arg;\n```\n\n我们可以使用这个分类方法通过选择器创建一个后台线程：\n\n```\n- (void)buttonClicked:(id)sender\n\
  {\n    [self performSelectorInBackground:@selector(backgroundOperation:) withObject:nil];\n\
  }\n\n- (void)backgroundOperation:(id)unused\n{\n    // 执行后台工作 ...\n    // 线程会在方法返回后结束。\n\
  }\n```\n\n很简单，对吧？在背后，会创建一个 `NSThread` 实例，并在接收者对象（在本例中为 `self`）上运行该选择器。\n\n\n\n\n\
  通常情况下，在后台执行某些操作并不好玩。大多数时候，我们希望根据后台工作的结果来更新 UI。请记住，对 UI 的任何更新必须在主线程上进行；我们可以使用另一个\
  \ `NSObject` 类别方法 `performSelectorOnMainThread:withObject:waitUntilDone:` 来实现这一点。让我们进一步充实一下\
  \ `backgroundOperation:` 方法：\n\n```objectivec\n- (void)buttonClicked:(id)sender\n\
  {\n    [self performSelectorInBackground:@selector(backgroundOperation:)\n     \
  \                          withObject:nil];\n}\n\n- (void)backgroundOperation:(id)unused\n\
  {\n    @autoreleasepool {\n        NSArray *results = nil;\n        // 执行后台工作 ...\n\
  \        // 线程会在此方法返回后结束，\n        // 所以让我们来报告结果：\n        [self performSelectorOnMainThread:@selector(updateWithResults:)\n\
  \                                     withObject:results\n                     \
  \               waitUntilDone:NO];\n    }\n}\n\n- (void)updateWithResults:(NSArray\
  \ *)theResults\n{\n    [self setResults:theResults];\n    [tableView reloadData];\n\
  }\n```\n\n`performSelectorOnMainThread:withObject:waitUntilDone:` 方法在形式上与 `performSelectorInBackground:withObject:`\
  \ 非常相似，但它有一个有趣的额外参数：`waitUntilDone`。`waitUntilDone` 参数可选地让此方法一直阻塞，直到主线程上的选择器执行完毕。在这种情况下，不需要它；`withObject:`\
  \ 参数（`results`）会被该方法保留，直到选择器执行完毕后才会释放。\n\n注意，我们通过使用 `@autoreleasepool` 在线程体中添加了一个自动释放池。每当你创建一个后台线程时，都必须提供你自己的自动释放池。\n\
  \n### 改进 Scattered：在 Instruments 中进行时间分析（Time Profiling）\n\n打开上一章节中的 `Scattered`\
  \ 项目，并在 `ScatteredAppDelegate` 中找到 `addImagesFromFolderURL:`。找到 `allowedFiles` 变量，它用于将打开的文件数量限制为十个。移除所有\
  \ `allowedFiles` 的痕迹并运行应用程序。\n\n你应该能看到窗口有几秒钟无响应状态，随后图像出现并开始动画。看起来加载图像阻塞了主线程，这是一种糟糕的用户体验。我们已经很清楚地认为问题与加载图像有关，因为我们刚刚删除了限制，但让我们自己证明这一点。\n\
  \n#### 引入 Instruments\n\nInstruments 是一个用于分析运行程序的工具。该工具有许多不同的插件（称为 instruments），允许你查看运行应用程序的各个方面，通常与性能相关。\n\
  \n在 Xcode 中，打开 Product 菜单并选择 Profile。Xcode 将使用 Release 构建配置（在 Scheme Editor 中可配置）重新构建项目，然后启动\
  \ Instruments。在 Mac OS X 下，在模板选择器中选择 Time Profiler 并点击 Profile (图 34.2)）。Instruments\
  \ 将会运行 `Scattered`。一旦图像完成动画，点击 Instruments 中的红色 Stop 按钮停止分析。\n\n**图 34.2.** 在 Instruments\
  \ 中选择 Time Profiler\n\n![Image](img/00282.jpg)\n\nInstruments 界面分为几个部分。关键部分是左上角的\
  \ Instruments 列表；在当前情况下，只运行了一个 instrument，即 Time Profiler。右侧是跟踪轨道窗（track pane），它显示了与每个运行的\
  \ instrument 相关的随时间变化的图形数据。查看 Time Profiler 的图，我们可以看到有一段相当活跃的活动，可能与加载图像有关。轨道的下方是详情窗（detail\
  \ pane），它显示了与所选 instrument 相关的表格数据 (图 34.3)。\n\n**图 34.3.** 在 Time Profiler 下运行\
  \ Scattered\n\n![Image](img/00283.jpg)\n\nTime Profiler 的工作原理是在程序运行时反复对调用堆栈进行快照。这使我们能够判断应用程序将时间花在了什么地方，但它并没有告诉我们某个特定方法被调用了多少次，因为它只是在拍摄快照，并不知道方法何时进入和退出的。\n\
  \n在详情窗中，我们看到按耗时排序的符号。注意 Symbol Name 列中的展开三角形。尝试点击它们来导航堆栈，或者如果你更喜欢的话，使用键盘的箭头键来探索树形结构。请注意\
  \ Invert Call Tree（反转调用树）默认是勾选的；这意味着我们看到的是 CPU 花费大部分时间的深层函数。你可以关闭 Invert Call Tree\
  \ 以查看应用程序的各个入口点。有时这会让你更快地找到所需的信息。\n\n如果你挖掘得足够深，你会发现所有时间都花在了 `thumbImageFromImage:`\
  \ 中（快速找到此点的一种方法是启用 Hide System Libraries）。如果你显示扩展详情窗（使用工具栏中的 View 分隔段），你就可以看到堆栈的另一种视图；这通常很有用\
  \ (图 34.4)。\n\n**图 34.4.** 显示扩展窗\n\n![Image](img/00284.jpg)\n\n到此时，已经很清楚了，相当的时间花在了创建缩略图上。尝试双击\
  \ `thumbImageFrom:` 帧。详情窗将变为显示代码，并高亮显示每行代码花费的时间 (图 34.5)。使用详情窗上方的跳转栏返回调用栈。\n\n**图\
  \ 34.5.** 代码显示\n\n![Image](img/00285.jpg)\n\nInstruments 的另一个有用功能是限制范围（Range）。你可以使用工具栏设置范围，但更快的方法是按住\
  \ Option 键、并在时间线上拖动。详情窗中的信息将限于所选范围。这对于关注性能问题很有帮助。\n\n我们仅仅接触了 Instruments 的一角。正如我们所见，它可以作为时间分析器，但它还有许多处理内存问题的工具，包括跟踪使用情况以及检测强循环。当你改进应用程序性能时，你会想要阅读\
  \ Apple 关于 Instruments 的文档。WWDC 视频也是学习使用 Instruments 的良好资源。\n\n##### 分析\n\n现在我们确定知道问题在哪里：生成缩略图是非常耗时的；更糟糕的是，我们在\
  \ `applicationDidFinishLaunching:` 中执行这些工作，这在遍历目录树和创建每个缩略图时阻塞了主线程。\n\n这类阻塞问题通常分为两类：CPU\
  \ 密集型和 I/O 密集型。I/O 密集型问题围绕等待较慢的硬件完成工作并将控制权还给我们。在 CPU 密集型问题中，CPU 是瓶颈；压缩几十个 JPEG 图像高度依赖\
  \ CPU。正如我们在第 28 章 中看到的，I/O 密集型问题有时可以通过异步 I/O 解决，但在情况下这样做可能会复杂。\n\n在这种情况下，我们似乎面临这两种问题的混合：加载数兆字节的数据是磁盘密集型的，而解压缩和绘制缩放后的缩略图是\
  \ CPU 密集型的。\n\n\n\n我们可以通过 `performSelectorInBackground:withObject:` 来实现这一点，但这只有一个线程，所以我们无法利用多核机器的优势。以这种方式创建多个线程会很快变得复杂。我们需要一种更复杂的工具。\n\
  \n### NSOperationQueue\n\n通常情况下，多线程被用于在后台处理分块信息。在这种情况下，与相当非正式的 `performSelectorInBackground:withObject:`\
  \ 甚至于手动使用 `NSThread` 创建线程相比，Cocoa 的 `NSOperationQueue` 提供了一个更成熟的框架来组织处理过程。\n\n`NSOperationQueue`\
  \ 代表一组操作（由 `NSOperation` 封装），并并在一个或多个线程上管理这些操作的执行。每个应用程序都有一个代表主线程的主队列；可以通过 `[NSOperationQueue\
  \ mainQueue]` 访问。如果应用程序需要额外的队列，可以通过分配和初始化一个新的 `NSOperationQueue` 来轻松地创建并配置它们。\n\n\
  默认情况下，`NSOperationQueue` 对象被配置为并发运行多个操作；具体数量由系统自动决定。你可以通过 `setMaxConcurrentOperationCount:`\
  \ 来覆盖此配置。最大并发操作数设置为 1 则结果为串行队列。主队列始终是串行的。\n\n### 多线程分散\n\n让我们修改 `Scattered` 以使用\
  \ `NSOperationQueue` 并尝试改进它。\n\n打开 `ScatteredAppDelegate.h` 并为 `NSOperationQueue`\
  \ 添加一个实例变量：\n\n```objectivec\n#import <Cocoa/Cocoa.h>\n#import <QuartzCore/QuartzCore.h>\n\
  \n@interface ScatteredAppDelegate : NSObject <NSApplicationDelegate> {\n    IBOutlet\
  \ NSView *view;\n    CATextLayer *textLayer;\n\n    NSOperationQueue *processingQueue;\n\
  }\n\n@property (assign) IBOutlet NSWindow *window;\n\n@end\n```\n\n切换到 `ScatteredAppDelegate.m`。我们先从添加\
  \ `init` 方法开始：\n\n```objectivec\n- (id)init {\n    self = [super init];\n    if\
  \ (self) {\n        processingQueue = [[NSOperationQueue alloc] init];\n       \
  \ [processingQueue setMaxConcurrentOperationCount:4];\n    }\n    return self;\n\
  }\n```\n\n现在我们将在 `addImagesFromFolderURL:` 中利用 `NSOperationQueue`。添加六行代码。注意平衡块括号和消息发送的括号：\n\
  \n```objectivec\n- (void)addImagesFromFolderURL:(NSURL *)folderURL\n{\n    [processingQueue\
  \ addOperationWithBlock:^(void) {\n        NSTimeInterval t0 = [NSDate timeIntervalSinceReferenceDate];\n\
  \n        NSFileManager *fileManager = [[NSFileManager alloc] init];\n        NSDirectoryEnumerator\
  \ *dirEnum =\n        [fileManager enumeratorAtURL:folderURL\n        includingPropertiesForKeys:nil\n\
  \                               options:NSDirectoryEnumerationSkipsHiddenFiles\n\
  \                             errorHandler:nil];\n\n        for (NSURL *url in dirEnum)\n\
  \        {\n            // 跳过目录：\n            NSNumber *isDirectory = nil;\n   \
  \         [url getResourceValue:&isDirectory\n                              forKey:NSURLIsDirectoryKey\n\
  \                              error:nil];\n            if ([isDirectory boolValue])\n\
  \                continue;\n\n            [processingQueue addOperationWithBlock:^(void)\
  \ {\n                NSLog(@\"-- processing %@\", [url lastPathComponent]);\n  \
  \              NSImage *image = [[NSImage alloc]\n                initWithContentsOfURL:url];\n\
  \                if (!image)\n                    return;\n\n                NSImage\
  \ *thumbImage = [self thumbImageFrom:image];\n\n                [[NSOperationQueue\
  \ mainQueue]\n                addOperationWithBlock:^(void) {\n                \
  \    [self presentImage:thumbImage];\n                    [self setText:[NSString\
  \ stringWithFormat:@\"%0.1fs\", [NSDate timeIntervalSinceReferenceDate] - t0]];\n\
  \                }];\n```\n搞定！运行应用程序并惊叹于改进后的用户体验吧。根据你的硬件，你还应该注意到速度有了显著提升。\n\n我们没有显式地创建\
  \ `NSOperation` 对象，而是使用 `NSOperationQueue` 的 `addOperationWithBlock:`，它会为我们创建一个\
  \ `NSBlockOperation` 并将其添加到队列中。注意我们的修改是么微小；应用程序的总体流程几乎没有变化。在应用程序中添加多线程总是可以做到这么简洁，但你看到了更多关于块（blocks）如何通过允许你引用作用域内的变量来帮助避免大量的样板代码。\n\
  \n### 线程同步\n\n在练习中，我们似乎并没有担心竞态条件。这是因为应用程序的设计特意避免了从后台线程内部使用任何共享数据结构。后台线程的工作限于枚举文件夹、打开图像和创建缩略图。在这种情况下，唯一的共享数据（即\
  \ Core Animation 层）仅从主线程进行修改。当你可以完全避免竞态条件时，多线程是最容易的。\n\n然而，并不是所有的多线程问题都能通过这种方法解决。通常，你需要保护一段代码（或多段代码），使得一次只有一个线程可以运行它。这通常通过互斥锁（mutex\
  \ lock）来实现。Objective-C 提供了一种简单的方法——`@synchronized` 指令来使用互斥锁：\n\n```objectivec\n\
  - (void)addImage:(NSImage *)image\n{\n    @synchronized (images) {\n        [images\
  \ addObject:image];\n    }\n}\n```\n\n`@synchronized` 指令使用一个与传递给它的对象所有的互斥锁。在这种情况下，我们锁定的是\
  \ `images`，这是一个 `NSMutableArray`。由于 `NSMutableArray` 不是线程安全的（意味着它没有被编写成可从多个线程中进行修改），因此在多线程环境中修改它时，建议使用互斥锁。`@synchronized`\
  \ 指令保证了对于某个特定对象的 `@synchronized` 指令，一次只有一个线程能够执行该块。因此，如果两个线程同时调用 `addImage:`，第一个线程将获取锁并添加对象，而另一个将阻塞并等待锁释放。\n\
  \n你可能在奇怪为什么 `NSMutableArray` 不是线程安全的。一个原因是互斥锁与之相关的开销，线程安全性会使 `NSMutableArray` 变慢得多。另一个原因是，通常更有用且常见的是锁定一段代码而不是单个方法调用，例如当你将对象从一个数据结构移动到另一个时。\n\
  \nCocoa 提供了许多其他线程同步工具，例如 `NSLock` 和 `NSCondition`。这些工具、对 `NSOperationQueue` 的更深入探讨以及\
  \ Grand Central Dispatch（GCD）将在 *Advanced Mac OS X Programming* 中详细讨论。\n\n\n\nGrand\
  \ Central Dispatch (GCD) 是 `NSOperationQueue` 的基础，它最实用的功能之一是根据系统硬件（核心数）和当前系统负载来管理运行操作（线程）的数量。从高级别的术语来说，GCD\
  \ 会创建它认为系统能够处理的线程，以便尽可能快地处理队列中的操作。如果每个队列操作在所需资源方面是均匀的，那么这种机制的效果非常好。\n\n然而，考虑 `Scattered`\
  \ 的工作原理：每个操作都从从磁盘读取数据（图像）开始。磁盘 I/O 对 CPU 的需求很小，因此 GCD 看到 CPU 并没有被利用，便开始另一个操作，该操作也开始从磁盘读取数据，以此类推。也许你可以看到\
  \ GCD 如何非常快速地启动大量线程来处理队列中的操作。\n\n当第一个操作的图像数据完全读入后，图像会被解压并创建缩略图，这是一项相当消耗 CPU 的工作。在进行这项工作时，第二个线程完成了从磁盘读取并开始解压缩，以此此类推。突然之间，CPU\
  \ 被要求执行大量工作！\n\n在练习中，我们通过限制并发操作的数量来避免了这种堆积，但这种方法并不理想，因为我们在等待磁盘时经常在浪费 CPU 时间：回想一下\
  \ Instruments 中的 CPU 图表是多么起伏不平。解决这个问题的正确方案是使用两个队列：一个队列用于从磁盘加载图像数据，并限制其并发操作的数量（因为磁盘很慢），另一个队列用于执行创建缩略图的工作。然而，要正确实现这一点要复杂复杂得多。\n\
  \n### 挑战\n\n适配 `Scattered` 以使用上一节概述的正确方案。由于 `NSImage` 避免了在绝对必要之前进行磁盘 I/O，你需要手动读取数据，然后使用这些数据创建图像。使用\
  \ `NSData` 来读取图像数据。检查 `NSImage` 的文档或头文件，以找到从 `NSData` 对象创建图像的方法。\n\n## 第 35 章 Cocoa\
  \ 和 OpenGL\n\n本章的设计目的并不是为了教你 OpenGL。如果你想学习 OpenGL，请阅读《OpenGL 编程指南》。相反，本章旨在向你如何在使用\
  \ Cocoa 编写的应用程序中使用 OpenGL 进行绘图。像 Cocoa 中所有其他绘制一样，OpenGL 渲染将在视图中完成。到目前为止，所有的视图都使用\
  \ `NSGraphicsContext` 通过 Quartz（通过 `NSImage`、`NSBezierPath` 和 `NSAttributedString`）进行绘图。\n\
  \n`NSOpenGLView` 是 `NSView` 的子类，拥有一个 OpenGL 绘制上下文。就像你需要锁定焦点到视图才能使用 Quartz 进行绘图一样，任何\
  \ OpenGL 绘制命令必须在上下文激活时才能生效。\n\n以下是 `NSOpenGLView` 中的一些重要方法：\n\n- `- (id)initWithFrame:(NSRect)frameRect`\n\
  \  `pixelFormat:(NSOpenGLPixelFormat *)format`\n  指定的初始化器。\n- `- (NSOpenGLContext*)openGLContext`\n\
  \  返回 OpenGL 上下文。\n- `- (void)reshape`\n  当视图调整 own 时调用。调用此方法时，OpenGL 上下文处于激活状态。\n\
  - `- (void)drawRect:(NSRect)r`\n  当视图需要重绘时调用。调用此方法时，OpenGL 上下文处于激活状态。\n\n### 一个简单的\
  \ Cocoa/OpenGL 应用程序\n\n[图 35.1] 显示了将创建的应用程序。\n\n**图 35.1.** 完成的应用程序\n\n![Image](img/00286.jpg)\n\
  \n创建一个新的 Cocoa Application 项目并将其命名为 Gliss（“GL Bliss”的缩写）。将类前缀设置为 `Gliss`。这将不是基于文档的应用程序。在项目导航器中点击项目打开项目编辑器。使用\
  \ Linked Frameworks and Libraries 下方的 + 按钮向项目添加 `OpenGL.framework` 和 `GLUT.framework`\
  \ 框架。你将不会使用 GLUT 事件模型——只需要几个方便函数。\n\n创建一个子自 `NSOpenGLView` 的 Objective-C 类，并命名为\
  \ `GlissView`。在 `GlissView.h` 中声明一个 outlet 和一个 action：\n\n```objc\n#import <Cocoa/Cocoa.h>\n\
  \n@interface GlissView : NSOpenGLView {\nIBOutlet NSMatrix *sliderMatrix;\n}\n-\
  \ (IBAction)changeParameter:(id)sender;\n@end\n```\n\n#### 布局界面\n\n打开 `MainMenu.xib.`。\n\
  \n如[图 35.2]所示，将一个 `NSOpenGLView` 拖到窗口中。\n\n**图 35.2.** 将 NSOpenGLView 拖入窗口\n\n![Image](img/00287.jpg)\n\
  \n在身份标识检查器（Identity Inspector）中，将视图的类设置为 `GlissView`（[图 35.3]）。\n\n**图 35.3.** 设置类\n\
  \n![Image](img/00288.jpg)\n\n选择 `GlissView`。在身份标识检查器中，将视图的类设置为 `GlissView`。在属性检查器（Attributes\
  \ Inspector）中，勾选 `NSOpenGLView`。如[图 35.4]所示，将一个 `NSOpenGLView` 拖到窗口中。\n\n**图 35.4.**\
  \ 矩阵\n\n![Image](img/00289.jpg)\n\n在身份标识检查器中，将视图的类设置为 `GlissView`。在属性检查器中，勾选 `NSOpenGLView`。如[图\
  \ 35.5]所示，将一个 `NSOpenGLView` 拖到窗口中。\n\n**图 35.5.** 滑块\n\n![Image](img/00290.jpg)\n\
  \n在身份标识检查器中，将视图的类设置为 `GlissView`。在属性检查器中，勾选 `NSOpenGLView`。如[图 35.6]所示，将一个 `NSOpenGLView`\
  \ 拖到窗口中。\n\n**图 35.6.** 16 位缓冲区\n\n![Image](img/00291.jpg)\n\n在身份标识检查器中，将视图的类设置为\
  \ `GlissView`。在属性检查器中，勾选 `NSOpenGLView`。如[图 35.7]所示，将一个 `NSOpenGLView` 拖到窗口中。\n\n\
  **图 35.7.** 矩阵\n\n![Image](img/00292.jpg)\n\n#### 写代码\n\n编辑 `GlissView.h`：\n\n```objc\n\
  #import <Cocoa/Cocoa.h>\n\n@interface GlissView : NSOpenGLView {\nIBOutlet NSMatrix\
  \ *sliderMatrix;\nfloat lightX, theta, radius;\nint displayList;\n}\n- (IBAction)changeParameter:(id)sender;\n\
  @end\n```\n\n接下来，编辑 `GlissView.m`：\n\n```objc\n#import \"GlissView.h\"\n#import\
  \ <GLUT/glut.h>\n\n#define LIGHT_X_TAG 0\n#define THETA_TAG 1\n#define RADIUS_TAG\
  \ 2\n\n@implementation GlissView\n\n- (void)prepare\n{\n    NSLog(@\"prepare\");\n\
  \n    // GL 上下文必须激活这些函数才能生效\n    NSOpenGLContext *glcontext = [self openGLContext];\n\
  \    [glcontext makeCurrentContext];\n\n    // 配置视图\n    glShadeModel(GL_SMOOTH);\n\
  \    glEnable(GL_LIGHTING);\n    glEnable(GL_DEPTH_TEST);\n\n    // 添加一些环境光\n  \
  \  GLfloat ambient[] = {0.2, 0.2, 0.2, 1.0};\n    glLightModelfv(GL_LIGHT_MODEL_AMBIENT,\
  \ ambient);\n\n    // 初始化光\n}\n```\n\n\n\n\n```cpp\nGLfloat diffuse[] = {1.0, 1.0,\
  \ 1.0, 1.0};\nglLightfv(GL_LIGHT0, GL_DIFFUSE, diffuse);\n// 并开启它。\nglEnable(GL_LIGHT0);\n\
  \n// 设置材质在环境光下的反射属性\nGLfloat mat[] = {0.1, 0.1, 0.7, 1.0};\nglMaterialfv(GL_FRONT,\
  \ GL_AMBIENT, mat);\n\n// 设置材质在漫反射光下的反射属性\nglMaterialfv(GL_FRONT, GL_DIFFUSE, mat);\n\
  ```\n```objective-c\n- (id)initWithCoder:(NSCoder *)c\n{\n    self = [super initWithCoder:c];\n\
  \    if (self) {\n        [self prepare];\n    }\n    return self;\n}\n\n// 当视图缩放时调用\n\
  - (void)reshape\n{\n    NSLog(@\"reshaping\");\n    // 转换为窗口空间，以像素为单位。\n    NSRect\
  \ baseRect = [self convertRectToBase:[self bounds]];\n    // 现在结果与 glViewport()\
  \ 兼容。\n    glViewport(0, 0, baseRect.size.width, baseRect.size.height);\n    glMatrixMode(GL_PROJECTION);\n\
  \n    glLoadIdentity();\n    gluPerspective(60.0, baseRect.size.width/baseRect.size.height,\
  \ 0.2, 7);\n}\n\n- (void)awakeFromNib\n{\n    [self changeParameter:self];\n}\n\n\
  - (IBAction)changeParameter:(id)sender\n{\n    lightX = [[sliderMatrix cellWithTag:LIGHT_X_TAG]\
  \ floatValue];\n    theta = [[sliderMatrix cellWithTag:THETA_TAG] floatValue];\n\
  \    radius = [[sliderMatrix cellWithTag:RADIUS_TAG] floatValue];\n    [self setNeedsDisplay:YES];\n\
  }\n\n- (void)drawRect:(NSRect)r\n{\n    // 清除背景\n    glClearColor (0.2, 0.4, 0.1,\
  \ 0.0);\n    glClear(GL_COLOR_BUFFER_BIT | GL_DEPTH_BUFFER_BIT);\n\n    // 设置视点\n\
  \    glMatrixMode(GL_MODELVIEW);\n    glLoadIdentity();\n    gluLookAt(radius *\
  \ sin(theta), 0, radius * cos(theta), 0, 0, 0, 0, 1, 0);\n\n    // 将光置于位置\n    GLfloat\
  \ lightPosition[] = {lightX, 1, 3, 0.0};\n    glLightfv(GL_LIGHT0, GL_POSITION,\
  \ lightPosition);\n\n    if (!displayList)\n    {\n        displayList = glGenLists(1);\n\
  \        glNewList(displayList, GL_COMPILE_AND_EXECUTE);\n\n        // 绘制物体\n  \
  \      glTranslatef(0, 0, 0);\n        glutSolidTorus(0.3, 0.9, 35, 31);\n     \
  \   glTranslatef(0, 0, -1.2);\n        glutSolidCone(1, 1, 17, 17);\n        glTranslatef(0,\
  \ 0, 0.6);\n        glutSolidTorus(0.3, 1.8, 35, 31);\n\n        glEndList();\n\
  \    } else {\n        glCallList(displayList);\n    }\n\n    // 刷新到屏幕\n    glFinish();\n\
  }\n\n@end\n```\n\n注意，OpenGL 调用被分为三个部分：`prepare`，所有初始发送的调用；`reshape`，当视图缩放时发送的所有调用；以及\
  \ `drawRect`，每次视图需要重绘时发送的所有调用。编译并运行该程序。\n\n# 第 36 章. NSTask\n\n你创建的每个应用程序都是一个目录，在该目录的某个地方有一个可执行文件。在\
  \ Unix 机器（如你的 Mac）上运行可执行文件，会派生（fork）一个进程，新进程将执行该文件中的代码。许多可执行文件是命令行工具，有些非常实用。因此，本章将向你展示如何使用\
  \ `NSTask` 类从你的 Cocoa 应用程序运行命令行工具。\n\n`NSTask` 是 Unix 函数 `fork()` 和 `exec()` 的一个易用封装。你为\
  \ `NSTask` 提供一个可执行文件的路径并启动它。许多进程从标准输入读取数据并写入到标准输出。你的应用程序可以使用 `NSTask` 将管道连接到外部进程进出。管道由\
  \ `NSPipe` 类表示。\n\n### ZIPspector\n\n工具 `/usr/bin/zipinfo` 查看 zip 文件的内容。在你的机器上找到一个\
  \ zip 文件，尝试在终端中像这样运行 `zipinfo`（`-1` 是数字 1，不是横杠）：\n\n```bash\n/usr/bin/zipinfo -1\
  \ /Users/aron/myfile.zip\n```\n```bash``` ```\n\n你将创建一个使用 `zipinfo` 的应用程序。注意，它必须发送一些参数并从进程的标准输出读取内容。\n\
  \n图 36.1 完成的应用程序\n\n在 Xcode 中，创建一个名为 ZIPspector 的新 Cocoa Application，并启用“基于文档的应用程序”（Document-Based\
  \ Application）。将类设置为 `My`。此程序将只查看文件而不进行编辑。在目标的 Info 面板中，将 ZIPspector 设置为 UTI 为 `com.apple.archive`\
  \ 的文件的查看器（这是一个系统标识符）。\n\n图 36.2 设置 UTI\n\n在 `My.h` 中，创建 `NSTableView` 和用于存储文件的 `NSArray`：\n\
  \n```objective-c\n@interface MyDocument : NSDocument\n{\n    IBOutlet NSTableView\
  \ *tableView;\n    NSArray *filenames;\n}\n@end\n```\n\n打开 `MyDocument.xib`。为表格添加一个标题为\
  \ Filenames 的单元格。\n\n图 36.3 设置 dataSource\n\n点击 File Owner 以弹出窗口。将 `dataSource`\
  \ 指向 File Owner。\n\n图 36.4 设置 tableView Outlet\n\n在 `MyDocument.m` 中，重写 `readFromURL:ofType:`\
  \ 并创建一个执行 `zipinfo` 的 `NSTask`。此外，创建一个 `NSPipe` 并将其连接到 `NSTask` 的标准输出。\n\n图 36.5\
  \ 对象图\n\n这里是代码执行 `zipinfo` 的 `NSTask` 逻辑：\n\n*(注：此处原文未提供具体代码块，但根据上下文描述，此处应为实现代码。为了遵循翻译要求，此处仅翻译描述的逻辑部分。)*\n\
  \n现在你需要表格视图的数据源方法：\n\n```objective-c\n- (NSInteger)numberOfRowsInTableView:(NSTableView\
  \ *)v\n{\n    return [filenames count];\n}\n- (id)tableView:(NSTableView *)tv\n\
  objectValueForTableColumn:(NSTableColumn *)tc\nrow:(NSInteger)row\n{\n    return\
  \ [filenames objectAtIndex:row];\n}\n```\n\n\n\n\n你的应用程序不需要保存功能，因此如果你愿意，可以删除 `dataOfType:error:`\
  \ 方法。此外，你也可以打开 `MainMenu.xib` 文件并删除任何与保存相关的菜单项。\n\n编译并运行你的应用程序。你应该能够看到任何 zip 文件的内容。（不会出现\
  \ `Untitled` 文档（这是一个查看器），所以你必须打开一个现 `.zip` 文件。）\n\n### 异步读取\n\n正如第 24 章所述，运行循环（run\
  \ loop）是等待事件的对象，这些事件可能是键盘、鼠标或定时器事件。这些都是运行循环的数据源。你也可以让文件句柄（file handle）成为运行循环的数据源。\n\
  \n在本节中，我们将派叉出一个偶尔会产生数据的进程。我们将为 `standardOut` 附加一个管道（pipe），但不是尝试立即从文件句柄读取所有数据，而是让文件句柄在后台读取，并在数据准备绪时发送通知。\n\
  \n你可以使用 `/sbin/ping` 来检查是否可以与另一台机器建立 IP 连接。尝试在 Terminal 中运行：\n\n```bash\n$ /sbin/ping\
  \ -c10 www.bignerdranch.com\n```\n\n```bash\nPING www.bignerdranch.com (69.39.89.150):\
  \ 56 data bytes\n64 bytes from 69.39.89.150: icmp_seq=0 ttl=50 time=35.579 ms\n\
  64 bytes from 69.39.89.150: icmp_seq=1 ttl=50 time=35.099 ms\n64 bytes from 69.39.89.150:\
  \ icmp_seq=2 ttl=50 time=34.546 ms\n64 bytes from 69.39.89.150: icmp_seq=3 ttl=50\
  \ time=35.495 ms\n64 bytes from 69.39.89.150: icmp_seq=4 ttl=50 time=35.685 ms\n\
  64 bytes from 69.39.89.150: icmp_seq=5 ttl=50 time=35.667 ms\n64 bytes from 69.39.89.150:\
  \ icmp_seq=6 ttl=50 time=36.435 ms\n64 bytes from 69.39.89.150: icmp_seq=7 ttl=50\
  \ time=52.296 ms\n64 bytes from 69.39.89.150: icmp_seq=8 ttl=50 time=36.142 ms\n\
  64 bytes from 69.39.89.150: icmp_seq=9 ttl=50 time=36.188 ms\n--- www.bignerdranch.com\
  \ ping statistics ---\n10 packets transmitted, 10 packets received, 0% packet loss\n\
  round-trip min/avg/max/stddev = 34.546/37.313/52.296/5.021 ms\n```\n\n如果你想提前结束程序，按下\
  \ Control-C 向它发送一个 `sigint` 信号。这将导致它输出统计信息并终止。\n\n### iPing\n\n现在你将编写一个 Cocoa App，使用\
  \ `NSTask` 来运行 ping (图 36.6)。\n\n**图 36.6.** 完成的应用程序\n\n![Image](img/00298.jpg)\n\
  \n在 Xcode 中，创建一个类型为 Cocoa Application 的新项目 `iPing`。将 Class Prefix 设置为 `iPing`。取消勾选\
  \ `Create Document-Based Application`。在 `iPingAppDelegate` 中，添加两个 outlets（分别指向 `NSTask`\
  \ 和 `NSPipe` 的指针）以及一个 action：\n\n```objc\n@interface iPingAppDelegate : NSObject\
  \ <NSApplicationDelegate> {\n    IBOutlet NSTextView *outputView;\n    IBOutlet\
  \ NSTextField *hostField;\n    IBOutlet NSButton *startButton;\n    NSTask *task;\n\
  \    NSPipe *pipe;\n}\n@property (assign) IBOutlet NSWindow *window;\n- (IBAction)startStopPing:(id)sender;\n\
  @end\n```\n\n打开 `MainMenu.xib`，并将文本视图（text view）、一个文本字段（text field）和一个按钮拖到窗口上。按钮应设置为切换模式（Toggle\
  \ mode）。标题应为 Start Ping (图 36.7)，备用标题为 Stop Ping。将状态设置为 Off。\n\n**图 36.7.** 按钮属性\n\
  \n![Image](img/0299.jpg)\n\n将 `iPingAppDelegate` 设置为按钮的 `target`；其 `action` 应该为\
  \ `startStopPing:`。将 `outputView`、`hostField` 和 `startButton` outlets 分别指向文本视图、文本字段和按钮\
  \ (图 36.8)。\n\n**图 36.8.** 对象图\n\n![Image](img/0300.jpg)\n\n在 `iPingAppDelegate.m`\
  \ 中，实现 `startStopPing:`：\n\n```objc\n- (IBAction)startStopPing:(id)sender {\n  \
  \  // 任务正在运行吗？\n    if (task) {\n        [task interrupt];\n    } else {\n     \
  \   task = [[NSTask alloc] init];\n        [task setLaunchPath:@\"sbin/ping\"];\n\
  \        NSArray *args = [NSArray arrayWithObjects:@\"-c10\", [hostField stringValue],\
  \ nil];\n        [task setArguments:args];\n        // 创建新管道\n        pipe = [[NSPipe\
  \ alloc] init];\n        [task setStandardOutput:pipe];\n        NSFileHandle *fh\
  \ = [pipe fileHandleForReading];\n        NSNotificationCenter *nc;\n        nc\
  \ = [NSNotificationCenter defaultCenter];\n        [nc removeObserver:self];\n \
  \       [nc addObserver:self selector:@selector(dataReady:) name:NSFileReadCompletionNotification\
  \ object:fh];\n        [nc addObserver:self selector:@selector(taskTerminated:)\
  \ name:NSTaskDidTerminate object:task];\n        [task launch];\n        [outputView\
  \ setString:@\"\"];\n        [fh readInBackgroundNotify];\n    }\n}\n```\n\n在任务运行时，文件句柄会在数据准备绪时发送通知。实现将被调用的方法：\n\
  \n```objc\n- (void)appendData:(NSData *)d {\n    NSString *s = [[NSString alloc]\
  \ initWithData:d encoding:NSUTFStringEncoding];\n    NSTextStorage *ts = [outputView\
  \ textStorage];\n    [ts replaceCharactersInRange:NSMakeRange([ts length], 0) withString:s];\n\
  }\n\n- (void)dataReady:(NSNotification *)n {\n    NSData *d;\n    d = [[n userInfo]\
  \ valueForKey:NSFileHandleData];\n    NSLog(@\"dataReady:%ld bytes\", [d length]);\n\
  \    if ([d length]) {\n        [self appendData:d];\n    }\n    // 如果任务正在运行，开始开始读取\n\
  \    if (task)\n        [[pipe fileHandleForReading] readInBackgroundNotify];\n\
  }\n```\n\n当进程完成后，我们需要进行一些清理：\n\n```objc\n- (void)taskTerminated:(NSNotification\
  \ *)note {\n    NSLog(@\"taskTerminated:\");\n    task = nil;\n    [startButton\
  \ setState:0];\n}\n```\n\n编译并运行应用程序。\n\n### 挑战：.tar 和 .tgz 文件\n\nzip 文件的内容列表由 `zipinfo`\
  \ 提供。你可以通过命令行工具 `tar` 获取 `tar` 文件的类似列表：\n\n```bash\n# /usr/bin/tar tf MyFiles.tar\n\
  ```\n\n如果 `tar` 文件也是压缩的，只需在标志中添加一个 `z` 即可：\n\n```bash\n# /usr/bin/tar tzf MyFiles.tgz\n\
  ```\n\n扩展 ZIPspector 以也能处理 `.tar` 和 `.tgz` 文件。\n\n## 第 37 章 分发你的应用程序\n\n当你准备好让应用程序离开巢穴时就会到来。你已经修复了所有能找到的\
  \ bug，并在 Instruments 中测试了泄漏。现在是时候你的应用程序看看世界了！在本章中，我们将讨论如何使用 Xcode 为你的应用程序准备应对外部环境。\n\
  \n### 构建配置\n\n到目前为止，我们一直使用调试构建（debug builds）进行测试。调试构建包含额外信息，允许调试器显示详细的栈信息。调试构建通常禁用优化；如果你为多个架构（32\
  \ 位和 64 位）构建，则调试构建仅为开发系统的架构创建。\n\n这些设置对于开发来说是非常棒的。它们让调试器更有用，且生成速度更快，但与你发布给客户的构建所要求的相反：即发布构建（release\
  \ builds）。在发布构建中，会开启优化，移除调试符号（以减小体积并增加检查代码的难度），并构建所有架构。\n\n\n\n\nXcode 有多个可用操作：运行（run）、分析（profile）、分析（analyze）和归档（archive）。每个操作都关联着一个构建配置。你可以使用\
  \ `Scheme Editor` 配置此项，将构建配置与特定操作关联起来（图 37.1）。在构建该特定操作的目标时，将使用该构建配置。\n\n**图 37.1.**\
  \ 选中了运行（Run）的 Debug 构建配置的 Scheme Editor\n\n![Image](img/00301.jpg)\n\n## 预处理器宏和使用构建配置更改行为\n\
  \n构建配置的一种常见用途是在你的应用程序中硬编码行为设置的方法。这是通过预处理器宏实现的。\n\n在第 3 章中，我们看到了如何使用 `NS_BLOCK_ASSERTIONS`\
  \ 宏来禁用 `NSAssert`。打开项目并在项目浏览器中点击项目。选择目标，并在 `Build Settings` 下找到 `Preprocessor Macros`\
  \ 行（图 37.2）。\n\n**图 37.2.** 预处理器宏\n\n![Image](img/00302.jpg)\n\n请注意，预处理器宏可以展开以显示\
  \ Debug 和 Release。这允许你为调试和发布构建定义唯一的预处理器宏集。在这个示例中，在调试配置中定义的唯一宏是 `DEBUG=1`。这会将 `DEBUG`\
  \ 宏的值设为 1。要在代码中检查 `DEBUG` 的值，我们可以进行如下操作：\n\n```cpp\n#if DEBUG\n    [self printOutEverything];\n\
  #else\n    [self printOnlyWhatsNeeded];\n#endif\n```\n\n如果你不熟悉预处理器宏，这个概念相当简单：在你的源代码编译之前，它会通过预处理器，预处理器会逐行处理你的源代码。在我们的情况下，调试构建发送到编译器的代码是：\n\
  \n```cpp\n[self printOutEverything];\n```\n\n请注意，其他代码被完全省略了：当程序运行时，甚至没有需要评估的分支。但是，如果你愿意，也可以在分支中使用宏。例如：\n\
  \n```cpp\nif (DEBUG) {\n    NSLog(@\"Debug is %d\", DEBUG);\n}\n```\n\n关于预处理器宏的最后一点：它们可以做的事情比仅仅是定义函数要多得多。你可能只想在调试构建中只记录某些语句。我们的第一个想法可能是这样的：\n\
  \n```cpp\n#if DEBUG\n    NSLog(@\"This happened.\");\n#endif\n```\n\n但直接使用下面的代码会少那么许多干扰：\n\
  \n```cpp\n    DebugLog(\"This happened.\");\n```\n\n我们可以通过定义一个 `DebugLog` 函数来实现这一点。然而，预处理器宏允许我们完全删除日志代码。下面的宏给了我们一个\
  \ `DebugLog` 宏，它看起来就像一个函数，但当 `DEBUG` 为 0 时求值为空：\n\n```cpp\n#if DEBUG\n    #define\
  \ DebugLog(...) NSLog(__VA_ARGS__)\n#else\n    #define DebugLog(...) do { } while(0)\n\
  #endif\n```\n\n这种宏的绝佳位置是你的预编译头文件，通常命名为 `ProjectNamePrefix.pch` 并位于 `Supporting Files`\
  \ 组中。该文件本质上被项目中的每个文件包含。由于修改预编译头文件（或它包含的任何文件）会触发重新构建整个项目，我们通常只包含很少更改的文件，例如框架头文件。\n\
  \n## 创建发布构建\n\n现在你已经了解了构建配置——足够知道在你分发应用程序时，你会想要一个发布构建——如何创建它呢？在 Xcode 中实现此点的简单方法是归档（archive）你的目标。注意，在\
  \ `Scheme Editor` 中，`Archive` 操作选用了 Release 的构建配置。在 `Product` 菜单中选择 `Archive`。你的目标将重新构建。\n\
  \nXcode 的归档功能旨在帮助分类应用程序的各种发布构建，并维护其调试符号，以便以后用于你可能收集的任何崩溃日志。\n\n一旦你的目标被归档，它将出现在 `Organizer`\
  \ 的 `Archives` 标签页中（图 37.3）。\n\n**图 37.3.** Organizer 中的 Archives\n\n![Image](img/00303.jpg)\n\
  \n然后你可以通过 `Share` 按钮从归档中提取 app 包。系统会提示你以什么种格式共享。选择 `Application` 仅共享 app 包（图 37.4）。\n\
  \n**图 37.4.** 分享你的应用程序\n\n![Image](img/00304.jpg)\n\n一旦 Xcode 导出了 app 包，你可以将其压缩为\
  \ ZIP 归档并发布到网站，或发送给你的测试团队。\n\n## 关于安装程序的几句话\n\n如果你是 Mac 新手，可能会疑惑如何为你的应用程序创建一个安装程序。我们的建议是：不要。Mac\
  \ 的安装与其他平台不同，在大多数情况下安装程序增加了不必要的复杂性，并隐藏了操作。大多数应用程序的安装只需让用户将其从下载文件夹拖入 `/Applications`。这种方法的优点是卸载非常：将应用程序拖到垃圾桶。\n\
  \n打包应用程序有两种常用方法。许多 app 包只需压缩为 ZIP 归档。默认情况下，Safari 解压包含 app 包的 ZIP，让拖放变得变得简单。\n\n\
  另一种方法是创建一个 DMG（映像），打开（挂载）时会显示 Finder 窗口。这允许包含 app 包之外的其他文件，例如 `readme`、指向 `/Applications`\
  \ 的符号链接（以使拖放安装更加方便）以及可选背景。配置这样的 DMG 足够复杂，因此有第三方工具可以帮助。\n\n两种方法并不是没有缺陷。例如，用户有时忘记将应用程序拖到\
  \ `/Applications` 文件夹，将其留在下载文件夹中，甚至糟糕是从 DMG 运行。一些开发者实现的解决方案是在启动时检测 app 包的位置并提议移动它。\n\
  \n注意 Mac App Store 无法使用安装程序。\n\n## 沙箱\n\n在过去，应用程序拥有与运行它的用户相同的权限。如果你信任所有的应用程序，这听起来很好。然而，大多数用户并没有只运行信任的应用的运气，更重要的是，没有用户可以只运行没有\
  \ bug 的应用程序。遗憾的事实是，即使是信任的应用程序也可能存在无意的 bug，导致系统损坏或允许攻击者访问用户系统。沙箱是解决这一问题的一步。\n\n沙箱是一种限制应用程序与系统（文件系统、网络）交互的安全方法。iOS\
  \ 上的应用程序已经沙箱化多年。随着 Mac OS X Lion，Apple 将沙箱引入了 Mac，并进一步要求 Mac App Store 中的所有应用程序都必须沙箱。\n\
  \n### 权限\n\n沙箱对于开发者来说比简单的开启 `Enable Sandboxing` 标志需要更多的思考。开发者必须指定应用程序的权限（entitlements），即它被允许的操作列表。操作系统随后限制应用程序只执行这些操作。你可以将权限视为应用程序与操作系统之间的合同：应用程序承诺只执行列出的操作。\n\
  \n\n\n\n例如，考虑 `RanchForecast` 项目的需求。它需要创建出站网络连接，仅此而已。它不需要在磁盘上读写文件，不需要使用摄像头或麦克风，也不需要为传入连接打开端口。通过将\
  \ `RanchForecast` 的权限（entitlements）设置为仅创建出站网络连接，我们极大地限制了该应用程序进行恶意活动的机会。\n\n要指定应用程序的权限，可以编辑\
  \ `plist`，也可以使用 `Xcode` 的项目编辑器（图 37.5）。\n\n图 37.5 应用程序权限\n\n![Image](img/00305.jpg)\n\
  \n沙盒应用程序提供了一个容器：磁盘上的一个文件夹，它们可以在其中存储缓存、偏好文件和其他资源。Mac OS X 会更改通过 `AppKit` API 调用报告的主目录，以返回此容器文件夹，该文件夹位于用户的\
  \ Library（库）目录中。\n\n### 受中介的文件访问与 Powerbox\n\n受中介的读写访问是应用程序访问文件的首选方式。中介访问包括对临时文件的访问（例如应用程序容器中的文件），以及对用户使用\
  \ Mac OS X 文件打开对话框显式打开的文件或拖入应用程序的文件进行读取或读/写访问。也就是说，当用户通过 `NSOpenPanel` 或 `NSSavePanel`\
  \ 选择文件时，应用程序的沙盒会自动扩展，以包含所选的文件或目录。\n\n此功能由一个名为 `Powerbox` 的系统守护进程提供。当开发者使用 `NSOpenPanel`\
  \ 或 `NSSavePanel` 时，这些表单（sheets）由系统守护进程渲染，为文件选择提供了一种受信任的手段，且对开发者是透明的——无需更改代码。\n\n\
  如果一个具有中介读或读写权限的应用程序被终止并重启，当 `Lion` 通过重新打开这些文档来恢复应用程序之前的状态时，沙盒将再次扩展以包含之前打开的文档。标准的\
  \ `AppKit` “最近打开”（Open Recent）菜单也提供了类似的功能。\n\n有关应用程序可用权限的完整描述，请参阅 Mac OS X 开发者文档《Code\
  \ Signing and Application Sandboxing Guide》（代码签名与应用程序沙盒指南）。\n\n## Mac App Store\n\
  \n如果你正在编写商业应用，除了编写应用本身外，还有大量工作需要完成。Mac App Store 的优势在于它可以为你处理其中的许多方面：购买、安装/打包以及分发都由它为你处理。大部分的许可问题也得到了解决。如果你是一个独立开发者，处理此类任务可能会让你觉得夺夺了你改进产品的宝贵时间。\n\
  \n然而，Mac App Store 并不适用于所有应用程序。如果你的应用程序无法在沙环境中运行，或者不符合审核指南，你可能将需要使用更传统的分发方式。\n\n\
  Mac App Store 分发的大多数方面非常直观，并且与 iOS App Store 类似。你需要使用 `Xcode` 对你的应用程序二进制文件进行签名，提供应用程序的描述和截图，最后通过\
  \ `Xcode` 的 `Organizer`（组织机构）提交应用。\n\n#### 收据验证（Receipt Validation）\n\n然而，Mac App\
  \ Store 应用与 iOS 应用在一个关键方面有所不同：操作系统没有提供许可检查的支持。这意味着，在不需要你付出额外努力的情况下，没有防拷贝保护。如果防拷贝保护对你很重要，你就需要实现收据验证。\n\
  \n当从 Mac App Store 购买时，应用程序会被下载到用户的系统中。包含应用程序收据的文件将放置在应用程序包（application bundle）中。收据包含了应用程序的包标识符（bundle\
  \ identifier）、版本字符串以及计算机 `GUID` 的哈希值。收据由 Apple 经过加密签名。\n\n通过验证此收据中的信息，你的应用程序可以确定其是否有有权在该系统上运行。验证步骤如下：\n\
  \n1. 验证收据是否存在。\n2. 验证收据是否由 Apple 妥善签名。\n3. 验证收据中的包标识符是否匹配。\n4. 验证版本标识符是否匹配。\n5.\
  \ 验证收据包含的哈希值是否与此计算机的 `GUID` 哈希匹配。\n\n注意：虽然包和版本标识可以从 `Info.plist` 文件获取（分别为 `CFBundleIdentifier`\
  \ 和 `CFBundleShortVersionString` 键），但强烈建议将这些值作为常量在应用程序内部进行备份。原因是应用程序的 `Info.plist`\
  \ 很容易被用户修改；通过信任这些信息，应用程序可能会被欺骗，接受系统中另一个应用程序的有效收据。\n\n如果验证失败，应用程序应以状态码 173 退出：\n\n\
  ```c\nif (!validated) {\n    exit(173);\n}\n```\n\n这指示系统该应用程序的验证失败。\n\n坦率地说，执行此验证过程的代码对大多数开发者来说并不愉快。低级\
  \ `C` 程序员会感到自如在家，尽管处理加密 API 对大多数开发者来说可能是令人生畏的。你可能会问：“为什么 Apple 不提供参考实现？”\n\n原因是，如果\
  \ Apple 提供了参考实现，绝大多数开发者都会使用它，然后就可以使用破解工具解除所有使用该代码的应用程序的保护。通过要求开发者自己发明方法来验证这些信息，破解防拷贝保护的问题就会变得更加困难。\n\
  \nApple 已经提供了执行此过程某些部分的代码片段，以及一个用于测试的示例收据。这是构建配置（build configurations）的一种极用法：使用调试构建配置，或创建一个指向收据的新配置。\n\
  \n上述代码片段可以在 Mac OS X 开发者文章“Validating App Store”中找到。在收据验证方面保持创意，并在你的应用程序中使用不同的模式。\n\
  \n## 第 38 章 结\n\n当我们授课时，总是以“鼓励演讲”结束，它传递了以下信息：\n\n- 从这次经历中获得的知识绝非易。你学习了许多东西。为你感到自豪。\n\
  - 巩固所学知识的唯一方法是编写应用程序。越早开始越容易。\n- 还有很多需要学习的内容，但你已经过了学习曲线的波峰。从现在起事情会变得更容易。再次，进步的唯一途径是编写应用程序。\n\
  - 作为演讲者，Aaron 可以参加婚礼、派对、成人礼活动。我们在 Big Nerd Ranch 提供五天和七天的课程。课程表请查看 Big Nerd Ranch\
  \ 网站（[www.bignerdranch.com](http://www.bignerdranch.com/)）。或者使用 `RanchForecast`\
  \ 练习。\n\n“鼓励演讲”的最后部分是帮助问题的资源列表。与任何编程主题一样，你的答案可以在在线文档、网站和邮件列表中找到。\n\n- 如果你有关于 `Cocoa`\
  \ 的问题，首先应该检查参考文档。所有的类、协议、函数和常量都列在其中。\n- 如果你有关于 `Objective-C` 的问题，首先应该检查在线的 `Objective-C`\
  \ 参考文档。\n- 如果你有关于 `Xcode` 或 `Interface Builder` 的问题，首先应该检查开发者工具的参考文档。\n\n\n\n\n\n\
  - Mark Dalrymple 从开发者的视角写了一本关于 Mac OS X 底层架构的书。如果你的代码需要涉及操作系统的任何操作（例如多线程或网络），我们强烈建议你买一本\
  \ *Advanced Mac OS X Programming*。\n- 不要害怕实验——大多数问题可以通过创建一个小型应用程序来解决。创建这个应用程序可能只需要你不到\
  \ 15 分钟的时间。\n- 这本书的网站（[www.bignerdranch.com/books](http://www.bignerdranch.com/books））提供了许多问题的答案和几个有趣的示例。\n\
  - Stack Overflow ([www.stackoverflow.com/](http://www.stackoverflow.com/)) 是寻找问题答案的绝佳场所，在\
  \ Cocoa 和 iOS 领域非常活跃。很有可能有人遇到过你正面临的相同挑战。\n- CocoaDev Wiki ([www.cocoadev.com/](http://www.cocoadev.com/))\
  \ 是学习新技巧的好地方。\n- Apple 还有一个为 Cocoa 开发者提供的邮件列表。你可以在 Apple 的列表服务器（[`lists.apple.com/`](http://lists.apple.com/））加入\
  \ cocoa-dev 邮件列表。该列表存档于 [www.cocoabuilder.com/](http://www.cocoabuilder.com/)。\n\
  - 如果你已经尝试了所有其他方法，Apple 的开发者技术支持（Developer Technical Support）将付费回答你的问题。那里的人为我们解答过很多问题，我们他们一直专业且乐于助。\n\
  - 加入 Apple Developer Connection。它将让你获得最新的开发者工具和文档，以及往年的 WWDC 视频。ADC 网站是 [`developer.apple.com/`](http://developer.apple.com/)。\n\
  - 当你准备好学习更多 Cocoa 知识时，即将推出的 *More Cocoa Programming for Mac OS X* 将帮助你将 Mac 应用程序推向新的层次，重点介绍更高级的主题，例如自定义控件以及使用\
  \ AppleScript 使你的应用程序可脚本化。\n\n最后，请尽量保持友好。帮助初学者。分享实用的应用程序及其源代码。以友善的方式回答问题。这个社区很小，很少有善举永远没有回报的。\n\
