  \ *)a;\n@end\n```\n\n现在在 `RMDocument.m` 中，修改 `init` 以实例化 `employees` 数组。创建 `setEmployees:`\
  \ 方法。暂时保留模板中的其他方法。\n\n```objc\n- (id)init\n{\n    self = [super init];\n    if (self)\
  \ {\n        employees = [[NSMutableArray alloc] init];\n    }\n    return self;\n\
  }\n\n- (void)setEmployees:(NSMutableArray *)a\n{\n```\n\n\n\n\n\n```objc\n// This\
  \ is an unusual setter method. We are going to add a lot\n// of smarts to it in\
  \ the next chapter.\nif (a == employees) {\n    return;\n}\nemployees = a;\n}\n\
  ```\n\n#### RMDocument.xib\n\n点击 `RMDocument.xib` 在 Interface Builder 编辑器中打开它。\n\
