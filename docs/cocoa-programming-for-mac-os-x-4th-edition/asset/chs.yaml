  \         fromRect:imageRect\n         operation:NSCompositeSourceOver\n       \
  \    fraction:opacity];\n\n\n\n\n\n# 创建自定义视图的新项目\n\n创建一个类型为 `Cocoa Application`\
  \ 的新项目。将其命名为 `TypingTutor`，并将 `Class Prefix`（类前缀）设置为 `TypingTutor`。\n\n在 Xcode 中，创建一个\
  \ `NSView` 类的 Objective-C 类，并将其命名为 `BigLetterView`。\n\n#### 布局界面\n\n打开 `MainMenu.xib`\
  \ 并点击 Dock 上的 `TypingTutor` 窗口以打开它。通过拖出一个 `Custom View`（在 `Cocoa` -> `Layout Views`\
  \ 下）并将其拖到窗口上来创建类的实例（图 19.3）。\n\n**图 19.3.** 将视图拖入窗口\n\n![Image](img/00200.jpg)\n\
  \n在 `Identity Inspector`（身份检查器）中，将视图的类设置为 `BigLetterView`（图 19.4）。\n\n**图 19.4.**\
  \ 将视图的类设置为 BigLetterView\n\n![Image](img/00201.jpg)\n\n将两个文本字段（在 `Cocoa` -> `Controls`\
  \ 下）拖到窗口上（图 19.5）。\n\n**图 19.5.** 完成的界面\n\n![Image](img/00202.jpg)\n\n### 建立连接\n\
  \n现在，你需要为窗口创建按键视图的循环。也就是说，你正在设置用户通过 Tab 键从一个元素切换到下一个元素时视图选中的顺序。顺序将是：左侧文本字段、右侧文本字段、`BigLetterView`，然后回到左侧文本字段。\n\
  \n将左侧文本字段的 `nextKeyView` 设置为右侧文本字段（图 19.6）。\n\n**图 19.6.** 设置左侧文本字段的 nextKeyView\n\
  \n![Image](img/00203.jpg)\n\n将右侧文本字段的 `nextKeyView` 设置为 `BigLetterView`（图 19.7）。\n\
  \n**图 19.7.** 设置右侧文本字段的 nextKeyView\n\n![Image](img/00204.jpg)\n\n最后，将 `BigLetterView`\
  \ 的 `nextKeyView` 设置为左侧文本字段（图 19.8）。这将允许用户在三个视图之间通过 Tab 键切换。Shift-tab 将向相反方向移动选择。\n\
  \n**图 19.8.** 设置 BigLetterView 的 nextKeyView\n\n![Image](img/00205.jpg)\n\n那么，当窗口首次出现时，哪个视图应该是\
  \ `firstResponder`（响应者）？要让 `BigLetterView` 成为窗口的 `initialFirstResponder`（初始响应者），在编辑器中\
  \ Control-点击窗口标题栏以查看连接面板，然后从 `initialFirstResponder` 输出口拖到 `BigLetterView`（图 19.9）。你也可以使用\
  \ Dock 上的窗口图标来设置该出口。\n\n**图 19.9.** 设置窗口的 initialFirstResponder\n\n![Image](img/00206.jpg)\n\
  \n### 编写代码\n\n在本节，你将使你的 `BigLetterView` 响应按键事件并接受响应者状态。用户输入的字符将显示在控制台中。完成后的应用程序将如图\
  \ 19.10。\n\n**图 19.10.** 完成的应用程序\n\n![Image](img/00207.jpg)\n\n### 在 BigLetterView.h\
  \ 中\n\n你的 `BigLetterView` 将有两个实例变量以及针对这些变量的访问方法。`bgColor` 变量将标识视图的背景颜色，它是一个 `NSColor`\
  \ 对象。`string` 变量将保存用户最近输入的字母，它是一个 `NSString` 对象。\n\n```objc\n#import <Cocoa/Cocoa.h>\n\
  \n@interface BigLetterView : NSView {\n    NSColor *bgColor;\n    NSString *string;\n\
  }\n@property (strong) NSColor *bgColor;\n@property (copy) NSString *string;\n@end\n\
  ```\n\n### 在 BigLetterView.m 中\n\n视图的指定初始化器是 `initWithFrame:`。在该方法中，你需要调用父类的 `initWithFrame:`\
  \ 方法并初始化 `bgColor` 和 `string` 的默认值。将以下方法添加到 `BigLetterView.m`：\n\n```objc\n- (id)initWithFrame:(NSRect)frame\n\
  {\n    self = [super initWithFrame:frame];\n    if (self)\n    {\n        NSLog(@\"\
  initializing view\");\n        bgColor = [NSColor yellowColor];\n        string\
  \ = @\" \";\n    }\n    return self;\n}\n```\n\n为 `bgColor` 和 `string` 创建访问方法：\n\
  \n```objc\n#pragma mark Accessors\n\n- (void)setBgColor:(NSColor *)c\n{\n    bgColor\
  \ = c;\n    [self setNeedsDisplay];\n}\n\n- (NSColor *)bgColor\n{\n    return bgColor;\n\
  }\n\n- (void)setString:(NSString *)c\n{\n    string = c;\n    NSLog(@\"The string\
  \ is %@\", string);\n}\n\n- (NSString *)string\n{\n    return string;\n}\n\n- (void)drawRect:(NSRect)rect\n\
  {\n    NSRect bounds = self bounds;\n    [bgColor fill];\n    [NSBezierPath strokeRect:bounds];\n\
  \    if ([[self window] firstResponder] == self) {\n        [bgColor focusIndicator\
  \ set];\n        [NSBezierPath strokeRect:bounds];\n    }\n}\n\n- (void)keyDown:(NSEvent\
  \ *)event\n{\n    [self interpretKeyEvents:[NSArray arrayWithObject:event]];\n}\n\
  \n- (void)insertText:(NSString *)input\n{\n    // 将 string 设置为用户输入的\n    [self setString:input];\n\
  }\n\n- (void)insertTab:(id)sender\n{\n    [[self window] selectKeyViewFollowingView:self];\n\
  }\n\n// 注意这里的大小写，backtab 被视为一个单词\n- (void)insertBacktab:(id)sender\n{\n    [[self\
  \ window] selectKeyViewPrecedingView:self];\n}\n\n- (void)deleteBackward:(id)sender\n\
  {\n    [self setString:@\"\"];\n}\n```\n\n编译并运行你的程序。你应该发现你的视图变成了响应者。当它是响应者时，它应该获取键盘事件并将其记录到终端。此外，注意你可以通过\
  \ Tab 和 Shift-Tab 在视图之间切换（图 19.11）。\n\n**图 19.11.** 完成的应用程序\n\n![Image](img/00208.jpg)\n\
  \n（是的，`acceptsFirstResponder` 被调用的次数比你想象的要多（每次视图选中时)).\n\n### 给更好奇的人：悬停效果\n\n\n\n\
  \n\n在第 18 章中没有讨论三种鼠标事件：`mouseMoved:`、`mouseEntered:` 和 `mouseExited:`。\n\n```\n\
  - (void)mouseMoved:(NSEvent *)event\n```\n\n要接收 `mouseMoved:`，视图的窗口需要接受“mouse-moved”事件。如果是这样，`mouseMoved:`\
  \ 消息将发送给窗口的第一响应者（first responder）。要设置窗口接收鼠标移动事件，你需要向它发送 `setAcceptsMouseMovedEvents:`\
  \ 消息。\n\n```\n[[self window] setAcceptsMouseMovedEvents:YES];\n```\n\n此时，每当鼠标移动时，视图都会收到该消息。这是一个大量的事件。当人们向我们询问鼠标移动事件时，我们会问他们为什么需要它。他们通常会说：“呃，悬停效果（rollovers）。”\n\
  \n悬停效果在 Web 浏览器中非常流行。当你悬停在某个区域上时，它的外观会发生变化，让你清楚如果现在点击，该区域将接受该点击。例如，Safari 中的超链接在悬停在它们上时会高亮。\n\
  \n为了实现悬停效果，你通常不会使用 `mouseMoved:`。相反，你应该设置一个跟踪区域（tracking area）并重写 `mouseEntered:`\
  \ 和 `mouseExited:`。\n\n当视图被放入窗口时时，`viewDidMoveToWindow` 会被调用。这是一个创建跟踪区域的好地方。通过传递\
  \ `NSTrackingInVisibleRect`，跟踪区域将自动匹配所有者的可见 `rect`。\n\n```\n- (void)viewDidMoveToWindow\n\
  {\n    int options = NSTrackingMouseEnteredAndExited |\n                  NSTrackingActiveAlways\
  \ |\n                  NSTrackingInVisibleRect;\n    NSTrackingArea *ta;\n    ta\
  \ = [[NSTrackingArea alloc] initWithRect:NSZeroRect\n                          \
  \           options:options\n                                     owner:self\n \
  \                                 userInfo:nil];\n    [self addTrackingArea:ta];\n\
  }\n```\n\n然后，当调用 `mouseEntered:` 和 `mouseExited:` 时，改变视图的外观。假设你有一个类型为 `BOOL` 的名为\
  \ `isHighlighted` 的变量，代码如下：\n\n```\n- (void)mouseEntered:(NSEvent *)theEvent\n{\n\
  \    isHighlighted = YES;\n    [self setNeedsDisplay:YES];\n}\n\n- (void)mouseExited:(NSEvent\
  \ *)theEvent\n{\n    isHighlighted = NO;\n    [self setNeedsDisplay:YES];\n}\n```\n\
  \n然后你可以在 `drawRect:` 方法中检查 `isHighlighted` 并适性地绘制视图。\n\n### 模糊蓝框\n\n当你的 `BigLetterView`\
  \ 成为第一响应者（firstResponder）时，它的边缘会出现一个蓝色框。但请注意，这个框并不像文本字段周围的框那样漂亮且模糊。你想要模糊的蓝框吗？这需要一些工作。\n\
  \n查看 `BigLetterView.m` 中 `drawRect:` 里的绘制蓝框的地方。将其更改为如下所示：\n\n```\nif (([[self window]\
  \ firstResponder] == self) &&\n[NSGraphicsContext currentContextDrawingToScreen])\
  \ {\n    [NSGraphicsContext saveGraphicsState];\n    NSSetFocusRingStyle(NSFocusRingOnly);\n\
  \    [NSBezierPath fillRect:bounds];\n    [NSGraphicsContext restoreGraphicsState];\n\
  }\n```\n\n现在，当你失去第一响应者状态时，你需要重新绘制视图*以及占据它周围模糊蓝光光的区域*：\n\n```\n- (BOOL)resignFirstResponder\n\
  {\n    NSLog(@\"Resigning\");\n    [self setFocusRingNeedsDisplayInRect:[self bounds]];\n\
  \    return YES;\n}\n```\n\n编译并运行你的应用程序。\n\n## 第 20 章：使用属性绘图\n\n下一步是让字符串显示在我们的视图中。在本章结束时，你的应用程序将看起来像图\
  \ 20.1 所示。显示的字符将随着你的输入而改变。\n\n**图 20.1。** 完成的应用程序\n\n![Image](img/0209.jpg)\n\n\
  ### NSFont\n\n总体而言，`NSFont` 类只有两种类型的方法：\n1. 获取你所需字体的类方法\n2. 获取字体指标（如高度）的方法\n\n以下是\
  \ `NSFont` 中常用的方法：\n\n```\n+ (NSFont *)userFontOfSize:(float)fontSize\n+ (NSFont\
  \ *)FixedFontOfSize:(float)fontSize\n+ (NSFont *)messageFontOfSize:(float)fontSize\n\
  + (NSFont *)titleBarFontOfSize:(float)fontSize\n```\n返回一个用于对应字符串的用户默认字体的字体对象。如果你发送\
  \ `0.0` 的 `fontSize`，这些方法将使用默认大小。用户字体旨在用于代表用户输入的区域：例如文本字段。其他方法在实现自定义界面控件时非常有用用。\n\
  \n```\n+ (NSFont *)fontWithName:(NSString *)fontName size:(float)fontSize\n```\n\
  返回一个字体对象；`fontName` 是一个字体族名称，例如“Helvetica-lique”或“Times-Roman”。同样，`0.0` 的 `fontSize`\
  \ 使用默认大小。除非你的应用程序要求特定的字体，否则我们建议使用前面的一组方法代替此方法，以保持一致性。\n\n### NSAttributedString\n\
  \n有时，你想显示一个对某些范围具有属性的字符串。例如，你想显示字符串“Big Ranch”，并希望第 0 到 2 个字符下划线，第 0 到 7 个字符为绿色，第\
  \ 9 到 13 个字符为上标。\n\n当处理范围时，Cocoa 使用 `NSRange`。`NSRange` 有两个成员：`location` 和 `length`\
  \ 都是整数。`location` 是第一个元素的索引，`length` 是范围内的数量。你可以使用 `NSMakeRange()` 来创建 `NSRange`。\n\
  \n要创建带有属性的字符串，Cocoa 有 `NSAttributedString` 和 `NSMutableAttributedString`。以下是创建上述\
  \ `NSAttributedString` 的方法：\n\n```\nNSMutableAttributedString *s;\ns = [[NSMutableAttributedString\
  \ alloc] initWithString:@\"Big Nerd Ranch\"];\n[s addAttribute:NSAttributeName value:[NSFont\
  \ userFontOfSize:22] range:NSMakeRange(0,14)];\n[s addAttribute:NSUnderlineStyleAttributeName\
  \ value:[NSNumber numberWithInt:1] range:NSMakeRange(0,3)];\n[s addAttribute:NSForegroundColorAttributeName\
  \ value:[NSColor greenColor] range:NSMakeRange(0,8)];\n[s addAttribute:NSSerscriptAttributeName\
  \ value:[NSNumber numberWithInt:-1] range:NSMakeRange(9,5)];\n```\n\n一旦有了了字符串，你就可以对它进行很多操作。\n\
  \n```\n[s drawInRect:[self bounds]];\n// 放入文本字段\n[textField setAttributedStringValue:s];\n\
  // 放在按钮上\n[button setAttributedTitle:s];\n```\n\n图 20.2 显示了此代码执行的结果。\n\n**图 20.2。**\
  \ 使用属性字符串\n\n![Image](img/0210.jpg)\n\n是最常用的属性全局变量名称、它们对应的对象类型以及默认值：\n\n![Image](img/0211.jpg)\n\
  \n所有的属性名称都可以在 `NSAttributedString.h` 中找到。\n\n从文件创建属性字符串是最简单的方法。`NSAttributedString`\
  \ 可以读取和写入以下文件格式：\n\n* *字符串*：通常来自纯文本文件。\n* *RTF*：富文本格式是多字体和颜色的标准。在这种情况下，你将使用 `NSData`\
  \ 实例来读取和设置属性字符串的内容。\n* *RTFD*：这是带有附件的 RTF。除了 RTF 的多种字体和颜色外，你还可以图像。\n* *HTML*：属性字符串可以处理基本的\
  \ HTML 布局，但你可能希望使用 `WebView` 来获得最佳效果。\n* *Word*：属性字符串可以读取和写入简单的 `.doc` 文件。\n\n\n\
  \n\n\n> • OpenOffice\n\n当你读取一个文档时，你可能想了解关于它的一些信息，例如纸张尺寸。如果你提供一个可以存放该方法存放字典指针的地方，该字典将包含它能从数据中获取的所有额外信息。例如：\n\
  \n```objc\nNSDictionary *myDict;\nNSData *data = [NSData dataWithContentsOfFile:@\"\
  myfile.rtf\"];\nNSAttributedString *aString;\naString = [[NSAttributedString alloc]\
  \ initWithRTF:data documentAttributes:&myDict];\n```\n\n如果你不在乎文档属性，只需提供 `NULL`。\n\
  \n### 绘制字符串和富属性字符串\n\n`NSString` 和 `NSAttributedString` 都具有让它们绘制到视图上的方法。`NSAttributedString`\
  \ 具有以下方法：\n\n```objc\n- (void)drawAtPoint:(NSPoint)aPoint\n```\n绘制接收者。`aPoint` 是字符串的左下角。\n\
  \n```objc\n- (void)drawInRect:(NSRect)rect\n```\n绘制接收者；所有绘制都发生在 `rect` 内部。如果 `rect`\
  \ 太小无法容纳字符串，则绘制将被裁剪以适应 `rect`。\n\n```objc\n- (NSSize)size\n```\n返回接收者如果绘制将具有的大小。\n\
  \n`NSString` 具有类似的方法。对于 `NSString`，你需要提供一个属性字典以应用于整个字符串。\n\n```objc\n- (void)drawAtPoint:(NSPoint)aPoint\n\
  \    withAttributes:(NSDictionary *)attribs\n```\n使用 `attribs` 中的属性绘制接收者。\n\n```objc\n\
  - (void)drawInRect:(NSRect)aRect\n    withAttributes:(NSDictionary *)attribs\n```\n\
  使用 `attribs` 中的属性绘制接收者。\n\n```objc\n- (NSSize)sizeWithAttributes:(NSDictionary *)attribs\n\
  ```\n返回接收者如果使用 `atttibutes` 中的属性绘制时将具有的大小。\n\n### 让字母出现\n\n打开 `BigLetterView.h`。添加一个实例变量来保存属性字典，并声明\
  \ `prepareAttributes`。\n\n```objc\n#import <Cocoa/Cocoa.h>\n\n@interface BigLetterView\
  \ : NSView {\n    NSColor *bgColor;\n    NSString *string;\n    NSMutableDictionary\
  \ *attributes;\n}\n- (void)prepareAttributes;\n```\n\n打开 `BigLetterView.m`。创建一个带有字体和前景色色的\
  \ `attributes` 字典的方法：\n\n```objc\n- (void)prepareAttributes\n{\n    attributes =\
  \ [NSMutableDictionary dictionary];\n    [attributes setObject:[NSFont userFontOfSize:75]\
  \ forKey:NSFontAttributeName];\n    [attributes setObject:[NSColor redColor] forKey:NSForegroundColorAttributeName];\n\
  }\n```\n\n在 `initWithFrame:` 方法中，调用新方法：\n\n```objc\n- (id)initWithFrame:(NSRect)rect\n\
  {\n    self = [super initWithFrame:rect];\n    if (self) {\n        NSLog(@\"initializing\
  \ view\");\n        [self prepareAttributes];\n        bgColor = [NSColor yellowColor];\n\
  \        string = @\" \";\n    }\n    return self;\n}\n```\n\n在 `setString:` 方法中，告诉视图它需要重绘自己：\n\
  \n```objc\n- (void)setString:(NSString *)c\n{\n    string = c;\n    NSLog(@\"The\
  \ string: %@\", string);\n    [self setNeedsDisplay:YES];\n}\n```\n\n创建一个在矩形中间显示字符串的方法：\n\
  \n```objc\n- (void)drawStringCenteredIn:(NSRect)r\n{\n    NSSize strSize = [string\
  \ sizeWithAttributes:attributes];\n    NSPoint strOrigin;\n    strOrigin.x = r.origin.x\
  \ + (r.size.width - strSize.width)/2;\n    strOrigin.y = r.origin.y + (r.size.height\
  \ - strSize.height)/2;\n    [string drawAtPoint:strOrigin withAttributes:attributes];\n\
  }\n```\n\n在你的 `drawRect:` 方法内部调用该方法：\n\n```objc\n- (void)drawRect:(NSRect)rect\n\
  {\n    NSRect bounds = [self bounds];\n    [bgColor set];\n    [NSBezierPath fillRect:bounds];\n\
  \    [self drawStringCenteredIn:bounds];\n    if ([[self window] firstResponder]\
  \ == self) ...\n```\n\n编译并运行应用程序。注意，键盘事件会发送到你的视图，除非它们触发了菜单项。尝试按下 Command-W。它应该关闭窗口（即使你的视图是第一响应者）。\n\
  \n### 让你的视图生成 PDF\n\n所有的绘制命令都可以通过 `AppKit` 框架转换为 PDF。PDF 数据可以发送到打印机或文件。注意，PDF 在任何设备上看起来都将尽可能好，因为它是分辨率无关的。你已经创建了一个视图，该视图知道如何生成\
  \ PDF 数据来描述它应该的样式。将 PDF 数据存到文件中实际上非常简单。`NSView` 具有以下方法：\n\n```objc\n- (NSData *)dataWithInsideRect:(NSRect)aRect\n\
  ```\n此方法创建一个数据对象，然后调用 `drawRect:`。通常发送到屏幕的绘制命令现在进入数据对象中。一旦你有了这个数据对象，只需将其保存为文件。\n\
  \n打开 `BigLetterView.m` 并添加一个作为表单（sheet）创建保存面板的方法。我们将再次使用 block，就像我们在第 18 章中使用 `NSOpenPanel`\
  \ 来响应用户操作的那样。\n\n```objc\n- (IBAction)savePDF:(id)sender\n{\n    __block NSSavePanel\
  \ *panel = [NSSavePanel savePanel];\n    [panel setAllowedFileTypes:[NSArray arrayObject:@\"\
  pdf\"]];\n    [panel beginSheetWindow:[self window] completionHandler:^ (NSInteger\
  \ result) {\n        if (result == NSOKButton) {\n            NSRect r = [self bounds];\n\
  \            NSData *data = [self dataWithInsideRect:r];\n            NSError *error;\n\
  \            BOOL successful = [data writeToURL:[panel URL] options:0 error:&error];\n\
  \            if (!successful) {\n                NSAlert *a = [NSAlert alertWithError:error];\n\
  \                [a runModal];\n            }\n        }\n        panel = nil; //避免循环\n\
  \    }];\n}\n```\n\n同时，在 `BigLetterView.h` 中声明该动作：\n\n```objc\n- (IBAction)savePDF:(id)sender;\n\
  ```\n\n打开 `MainMenu.xib`。选择 File 菜单下的 Save As 项。如果没有，从库拖入一个新的菜单 Item。将其重命名为 Save\
  \ PDF....（如果你愿意，可以删除其他菜单项）。让 Save PDF... 项触发 `BigLetterView` 的 `savePDF:` 方法。\n\n\
  图 20.3. 连接菜单项 ![Image](img/0212.jpg)\n\n保存并编译应用程序。你应该能够生成 PDF 文件并在 Preview 中查看它。\n\
  \n图 20.4. 完成的应用程序 ![![](img/0213.jpg)\n\n你会注意到多字节字符（如 `é`）没有被你的 `BigLetterView`\
  \ 处理。要让这可行，你需要添加几个 `NSInputManager` 使用的方法。这个主题超出了本书范围（我们只是想展示如何获取键盘事件），但你可以在 Apple\
  \ 关于 `NSInputManager` 的讨论中学习它。\n\n### 给好奇者：NSFontManager\n\n有时，你有一个很好的字体，但如果它是加粗、斜体或压缩的就很完美了。`NSFontManager`\
  \ 可此类转换。你还可以使用字体管理器更改字体的大小。\n\n例如，假设你有一个字体，并想要类似的加粗字体。这里是代码：\n\n```objc\nfontManager\
  \ = [NSFontManager sharedFontManager];\nboldFont = [fontManager convertFont:aFont\
  \ toHaveTrait:NSBoldFontMask];\n```\n\n### 挑战 1\n\n给字母添加一个阴影。`NSShadow` 类具有以下方法：\n\
  \n```objc\n- (id)init;\n- (void)setShadowOffset:(NSSize)offset;\n- (void)setShadowBlurRadius:(float)val;\n\
  - (void)setShadowColor:(NSColor *)color;\n```\n\n### 挑战 2\n\n在你的 `BigLetterView`\
  \ 中添加布尔变量 `bold` 和 `italic`。添加复选框来切换这些变量。如果 `bold` 为 `YES`，让字母以加粗显示；如果 `italic`\
  \ 为 `YES`，让字母以斜体显示。\n\n\n\n\n\n## 第 21 章 剪贴板与无目标操作\n\n一个名为剪贴板服务器（`/usr/bin/pboard`）的进程在你的\
  \ Mac 上运行。应用程序使用 `NSPasteboard` 类向该进程写入数据，并从该进程读取数据。剪贴板服务器实现了应用程序之间的复制、剪切和粘贴等操作。\n\
  \n应用程序可以用多种格式将相同的数据复制到剪贴板上。例如，图像可以作为 PDF 文档和 PNG 图像复制到剪贴板。然后，读取数据的应用程序可以选择它最喜欢的格式。剪贴板使用\
  \ `UTIs` 来识别剪贴板上使用的各种类型。\n\n在 Mac OS X 10.6 之前，剪贴板 API 允许剪贴板上同时有一个项目（尽管该项目可以任意数量的表示或类型）。在\
  \ 10.6 中，Apple 更新了剪贴板 API，允许剪贴板上存在多个项目：例如从 Finder 复制的多个 URL。每个项目都可以关联多个类型，例如字符串和\
  \ URL 表示。\n\n在将数据放入剪贴板时，你的应用程序通常会先清空剪贴板，然后将一个或多个对象直接写入剪贴板。这些每个对象都构成剪贴板上的一个独立项目。这些对象必须符合剪贴板写入协议，该协议提供数据。在这种情况下，这些项目的数据会立即复制到剪贴板上。\n\
  \n接收端应用程序将向剪贴板请求一个对象数组。它在请求的同时提供一个类数组，这使得剪贴板能够为每个项目提供尽可能丰富的表示。在这种情况下，这些类必须符合剪贴板读取协议。\n\
  \n数据也可以通过剪贴板以懒性方式传递。要这样做，类需要声明它将要提供的数据，并承诺在将来通过代理方法在被请求时提供这些数据。我们将在章节末尾讨论懒性复制。\n\
  \nApple 还提供了按类型处理剪贴板的 API，如果你的应用程序需要对剪贴板进行非常精细的控制，这些 API 可能很有用。这些 API 与 10.6 之前的\
  \ API 非常相似。\n\n系统有多个剪贴板可用。有一个名为“通用剪贴板”（general pasteboard）的剪贴板，用于复制粘贴操作，另一个用于拖放任务。一个剪贴板存储用户搜索的最后一个字符串，另一个存储标尺，另一个存储字体。\n\
  \n### 在本章中，你将为 `BigLetterView` 添加剪切、复制和粘贴功能。首先，你将实现从剪贴板读取和写入的方法。然后我们将讨论这些方法是如何调用的。\n\
  \n### NSPasteboard\n\n如前所述，`NSPasteboard` 类充当指向剪贴板服务器的接口。以下是 `NSPasteboard` 的一些常用方法：\n\
  \n```objectivec\n+ (NSPasteboard *)generalPasteboard\n```\n\n返回通用 `NSPasteboard`。你将使用此剪贴板进行复制、剪切和粘贴。\n\
  \n```objectivec\n+ (NSPasteboard *)pasteboardWithName:(NSString *)name\n```\n\n\
  返回由 `name` 标识的剪贴板。以下包含标准剪贴板名称的全局变量：\n\n- `NSGeneralPboard`\n- `NSFontPboard`\n-\
  \ `NSRulerPboard`\n- `NSFindPboard`\n- `NSDragPboard`\n\n```objectivec\n- (NSInteger)clearContents\n\
  ```\n\n在向剪贴板写入对象之前清空剪贴板内容。返回此剪贴板的当前更改计数，这在大多数应用程序中并不需要。\n\n```objectivec\n- (BOOL)writeObjects:(NSArray\
  \ *)objects\n```\n\n向剪贴板写入符合 `NSPasteboardWriting` 协议的对象。符合条件的类包括 `NSString`、`NSAttributedString`、`NSURL`\
  \ 和 `NSImage`。每个对象代表一个独立的剪贴板项目。如果每个项目要写入多个类型，则该对象必须通过剪贴板写入协议写入这些类型。\n\n例如，如果将 `NSURL`\
  \ 对象数组写入剪贴板，将为每个 `NSURL` 创建一个剪贴板项目。每个此类剪贴板项目都将关联两个类型：`public.url` 和 `public.utf8-plain-text`。\n\
  \n```objectivec\n- (NSArray *)readObjectsForClasses:(NSArray *)classes\noptions:(NSDictionary\
  \ *)options\n```\n\n从剪贴板读取对象。每个剪贴板项目返回一个对象。必须传递一个类数组，用以描述所需类型的顺序，通常是尽可能丰富的表示在先。这些类必须符合\
  \ `NSPasteboardReading` 协议。\n\n接上之前的例子，如果 `classes` 数组仅包含 `[NSURL class]`，则将返回 `NSURL`\
  \ 实例数组。如果它仅包含 `[NSString class]`，则返回 `NSString` 实例。\n\n注意，上述任何方法都没有直接使用 `UTIs`。相反，它们是关注类类的。\n\
  \n`NSPasteboardItem` 本身符合 `NSPasteboardReading` 和 `NSPasteboardWriting`，允许你使用 `UTIs`\
  \ 与剪贴板进行更紧密的工作。为了懒性提供剪贴板数据，它声明 `provider` 将在请求时提供 `types`。以下是一些标准类型：\n\n- `NSPasteboardTypeColor`\n\
  - `NSPasteboardTypeFont`\n- `NSPasteboardTypePDF`\n- `NSPasteboardTypeRuler`\n-\
  \ `NSPasteboardTypeRTF`\n- `NSPasteboardTypeRTFD`\n- `NSPasteboardTypeHTML`\n- `NSPasteboardTypeString`\n\
  - `NSPasteboardTypeTabularText`\n- `NSPasteboardTypeTIFF`\n- `kUTTypeURL\n\n以下是\
  \ `NSPasteboardItem` 的一些常用方法：\n\n```objectivec\n- (BOOL)setData:(NSData *)aData\
  \ forType:(NSString *)dataType\n- (BOOL)setString:(NSString *)s forType:(NSString\
  \ *)dataType\n- (id)setPropertyList:(id)plist forType:(NSString *)dataType\n- (NSArray\
  \ *)types\n```\n\n返回一个包含可从剪贴板读取的数据类型的数组。返回 `types` 中找到的可读类型。\n\n### 为 BigLetterView\
  \ 添加剪切、复制和粘贴\n\n你将在 `BigLetterView` 类中创建名为 `cut:`、`copy:` 和 `paste:` 的方法。为了使这些方法更容易编写，你将首先创建写入剪贴板和从剪贴板读取的方法。将这些方法添加到\
  \ `BigLetterView.m` 中：\n\n```objectivec\n- (void)writeToPasteboard:(NSPasteboard\
  \ *)pb\n{\n    // 将数据复制剪贴板\n    [pb clearContents];\n    [pb writeObjects:[NSArray\
  \ arrayWithObject:string]];\n}\n\n- (BOOL)readFromPasteboard:(NSPasteboard *)pb\n\
  {\n    NSArray *classes = [NSArray arrayWithObject:[NSString class]];\n    NSArray\
  \ *objects = [pb readObjectsForClasses:classes options:nil];\n    if ([objects count]\
  \ > 0)\n    {\n        // 从剪贴板读取字符串\n        NSString *value = [objects objectAtIndex:0];\n\
  \n        // 我们的视图只能处理一个字母\n        if ([value length] == 1) {\n            [self\
  \ setString:value];\n            return YES;\n        }\n    }\n    return NO;\n\
  }\n```\n\n\n\n\n\n注意我们是如何实现 `write` 和 `read` 方法的。在写入剪贴板（pasteboard）时，我们清空它的内容，将对象写入其中。从剪贴板读取时，我们提供一个我们感兴趣的类数组，然后向剪贴板请求匹配的对象。通过实现\
  \ `NSPasteboardWriting` 和 `NSPasteboardReading` 协议，`NSString` 类让这项任务变得非常简单。\n\n\
  在 `BigLetterView.h` 中声明 `cut:`、`copy:` 和 `paste:` 方法：\n\n> `- (IBAction)cut:(id)sender;`\n\
  > `- (IBAction)copy:(id)sender;`\n> `- (IBAction)paste:(id)sender;`\n\n在 `BigLetterView.m`\
  \ 中实现这些方法：\n\n```objc\n- (IBAction)cut:(id)sender\n{\n    [self copy:sender];\n\
  \    [self setString:@\"\"];\n}\n\n- (IBAction)copy:(id)sender\n{\n    NSPasteboard\
  \ *pb = [NSPasteboard generalPasteboard];\n    [self writeToPasteboard:pb];\n}\n\
  \n- (IBAction)paste:(id)sender\n{\n    NSPasteboard *pb = [NSPasteboard generalPasteboard];\n\
  \    if(![self readFromPasteboard:pb]) {\n        NSBeep();\n    }\n}\n```\n\n编译并运行应用程序。注意，当\
  \ `BigLetterView` 被选中时，剪切、复制和粘贴菜单项现在可以工作了。键盘快捷键也有效。你可以将包含单个字符的字符串复制到 `BigLetterView`\
  \ 中。\n\n### 空目标动作（Nil-Targeted Actions）\n\n右侧视图是如何接收 `cut:`、`copy:` 或 `paste:` 消息的呢？毕竟，有许多许多个视图。如果你选择了一个文本字段，它应该获取该消息。当你选择另一个视图然后选择复制或粘贴菜单项时，消息应该发送给新选择的视图。为了解决这个问题，NeXT\
  \ 的天才工程师们提出了*空目标动作（nil-targeted actions）*。如果你将控件的 `target` 设置为 `nil`，应用程序将尝试将 `action`\
  \ 消息发送给多个对象，直到其中一个对象做出响应为止。应用程序首先尝试向主窗口（key window）的第一响应者（first responder）发送消息。这正是你剪切和粘贴时想要的行为。你可以多个窗口，每个窗口都可以有多个视图。活动窗口上的活动视图将接收剪切和粘贴消息。\n\
  \n目标动作的妙之处不仅于此。`NSView`、`NSApplication` 和 `NSWindow` 都继承自 `NSResponder`，后者包含一个名为\
  \ `nextResponder` 的实例变量。如果一个对象不对空目标动作做出响应，它的 `nextResponder` 就会获得机会。视图的 `nextResponder`\
  \ 通常是它的父视图。窗口内容视图的 `nextResponder` 是该窗口。因此，这些响应者通过我们所说的*响应者链链（responder chain）*被连接在一起。\n\
  \n请注意，`nextResponder` 与 `nextKeyView` 没有任何关系。\n\n例如，一个菜单项会关闭主窗口。它的 `target` 为 `nil`。动作是\
  \ `performClose:`。除了 `NSWindow` 之外，没有任何标准对象响应 `performClose:`。因此，例如选中的文本字段会拒绝响应\
  \ `performClose:`。然后文本字段的父视图拒绝，并沿着视图层级向上传递。最终，窗口（主窗口）接受了 `performClose:` 方法。因此，对用户来说，“活动”窗口被关闭了。\n\
  \n正如第 12 章 中提到的，面板（panel）可以成为主窗口但不是主要窗口（main window）。如果主窗口和主要窗口不同，那么两个窗口都有机会响应空目标动作。\n\
  \n你此时产生的问题应该是：在空目标动作被丢弃之前，对象将按什么顺序进行测试？\n\n1. `keyWindow` 的 `firstResponder` 及其响应者链。响应者链通常包括父视图，最后是主窗口。\n\
  2. 主窗口的 `delegate`。\n3. 如果是基于文档的应用程序，则是主窗口的 `NSWindowController` 然后是 `NSDocument`\
  \ 对象。\n4. 如果主要窗口与主窗口不同，它将对主要窗口执行相同的流程：主要窗口的 `firstResponder` 及其响应者链（包括主要窗口本身）、主要窗口的\
  \ `delegate`，以及主要窗口的 `NSWindowController` 然后是 `NSDocument` 对象。\n5. `NSApplication`\
  \ 的实例。\n6. `NSApplication` 的 `delegate`。\n7. `NSDocumentController`。\n\n这一系列对象代表了上述引入的响应者链。图\
  \ 21.1 提供了一个示例。数字表示了询问这些对象是否响应空目标动作的顺序。\n\n**图 21.1.** 响应者获得响应机会的顺序示例\n\n![Image](img/00214.jpg)\n\
  \n注意，在基于文档的应用程序（如 RaiseMan）中，`NSDocument` 对象有机会响应空目标动作。该对象接收来自以下菜单项的消息：保存、另存为...、恢复、打印、页面布局....\n\
  \n#### 查看 XIB 文件\n\n为了继续示例，打开 `MainMenu.xib`。注意剪切、复制和粘贴项连接到标记为 First Responder 的项目。First\
  \ Responder 代表了 `nil`（见图 21.2）。\n\n**图 21.2.** 菜单项\n\n![Image](img/0215.jpg)\n\n\
  ### 深入：哪个对象发送动作？\n\n剪切、复制和粘贴项的 `target` 是 `nil`。我们知道向 `nil` 发送消息不会执行操作。所有的目标动作消息都由\
  \ `NSApplication` 处理。它拥有以下方法：\n\n```objc\n- (BOOL)sendAction:(SEL)anAction to:(id)aTarget\
  \ from:(id)sender\n```\n\n当目标为 `nil` 时，`NSApplication` 知道尝试向响应者链发送消息。\n\n### 深入：UT\
  \ 与剪贴板\n\n在第 10 章 中，我们讨论了 Mac OS X 如何使用 UTI 来识别文件类型。剪贴板也为此目的使用 UTI。虽然我们在这个练习中没有直接使用\
  \ UTI，但 `NSString` 在从剪贴板读取和写入自身时使用 `NSPasteboardTypeString` 作为类型。如果你记录 `NSPasteboardTypeString`\
  \ 的值，你会发现它的值为 `public.utf8-plain-text`。\n\nUTI 的分级结构允许应用程序在请求剪贴板对象时使用宽泛（`public.image`）或具体的（`public.png`）。系统将根据其遵循的类型判断类型是否有效。\n\
  \n#### 自定义 UTI\n\n在某些情况下，你可能需要针对自定义数据使用剪贴板。在这种情况下，你可以使用自定义 UTI。自定义 UTI 应采用反向 DNS\
  \ 名称的形式，例如 `com.bignerdranch.raiseman.person`。你可能需要在自定义对象上实现 `NSPasteboardWriting`\
  \ 和 `NSPasteboardReading`，或者使用 `NSPasteboardItem` 作为抽象层。\n\n注意，除非供其他应用程序使用，否则自定义\
  \ UTI 不需要导出（使用 `Info.plist`）。如果导出了，它们必须符合 `public.data`。\n\n### 深入：懒拷贝\n\n\n\n\n\
  应用程序可以以懒加载（lazy）的方式将内容拷贝到剪贴板。例如，想象一个图形应用程序，将大图像以多种格式拷贝到剪贴板：PNG、TIFF、PDF 等。你可以想象，将所有这些格式都拷贝到剪贴板会对应用程序和剪贴板服务器造成很大负担。相反，这样的应用程序可能会执行懒加载拷贝。也就是说，应用程序会声明它可能放在剪贴板上的所有类型，但会将拷贝数据的操作推迟，直到另一个应用程序请求这些数据。\n\
  \n本质上，应用程序是在剪贴板上放置了一个“欠据”（IOU，而不是数据本身），并提供一个在需要时会提供数据的对象。当另一个应用程序实际请求数据时，剪贴板服务器会回调以获取数据。\n\
  \n你将使用一个 `NSPasteboardItem` 来创建这个 IO 欠据对象：\n\n```objc\nNSPasteboard *pboard = [NSPasteboard\
  \ generalPasteboard];\n[pboard clearContents];\nNSPasteboardItem *item = [[NSPasteboardItem\
  \ alloc] init];\n[item setDataProvider:self forTypes:...];\n[pboard writeObjects:[NSArray\
  \ arrayWithObject:item]];\n```\n\n然后实现 `pasteboard:item:provideDataForType:`：\n\n\
  ```objc\n- (void)pasteboard:(NSPasteboard *)pasteboard\n             item:(NSPasteboardItem\
  \ *)item\n   provideDataForType:(NSString *)type\n{\n    [item setData:... forType:type];\n\
  }\n```\n\n当另一个应用程序需要数据时，就会调用此方法。此时此时，应用程序必须将它承诺的数据拷贝到提供的剪贴板项目中。\n\n正如你所想象的，如果剪贴板服务器在应用程序终止后请求数据，就会出现问题。当应用程序正在终止时，如果它剪贴板上当前带有一个“欠据”，它将被要求在终止前提供所有承诺的数据。因此，在应用程序终止的过程中，向“欠据”数据提供者发送多次\
  \ `pasteboard:item:provideDataForType:` 并不罕见。\n\n懒加载拷贝最棘手的部分是，当用户将数据拷贝到剪贴板并在稍后粘贴到另一个应用程序时，他们并不想要数据的最新状态。相反，用户想要的是他们拷贝时的状态。在实现懒加载拷贝时，大多数开发者会在声明类型时对信息进行某种快照（snapshot）。在提供数据时，开发者会将快照（而不是当前状态）拷贝到剪贴板。\n\
  \n当然，当用户在其他地方执行拷贝操作时，你的对象将不再负责保留该快照。\n\n```objc\n- (void)pasteboardFinishedWithDataProvider:(NSPasteboard\
  \ *)sender;\n```\n\n如果你实现了这个方法，当你不再负责保留快照时，它就会被调用。\n\n### 挑战 1\n\n你正在将字符串放入剪贴板。为该视图创建一个\
  \ PDF 并将其也放入剪贴板。现在，你将能够将字母的图像拷贝到图形程序中。使用“预览”（Preview）的“从剪贴板新建”（New from Clipboard）菜单项进行测试。（不要破坏字符串的拷贝和粘贴：将字符串和\
  \ PDF 都放入剪贴板中。） 提示：你需要创建一个 `NSPasteboardItem`。\n\n### 挑战 2\n\n在 `RaiseMan` 项目中，添加一个菜单项，以触发\
  \ `RMDocument` 中的 `removeEmployee:` 方法。\n\n## 第 22 节 分类（Categories）\n\n尽管 Apple\
  \ 的工程师们非常明智，但有一天你会认为：“天哪，如果他们把那个方法放在那个类上，我的生活就会轻松多了。”当这种情况发生时，你就会想要创建一个分类（category）。分类简单来说就是你想要添加到现有类中的方法集合。分类的概念非常有用，令人惊讶的是，有如此少面向对象的语言包含了这个强大的想法。\n\
  \n创建分类比谈论它们要容易得多。在节一节中，你为你的 `BigLetterView` 添加了粘贴功能。然而，请注意，如果剪贴板上的字符串包含多个字母，则粘贴尝试将会失败，因为\
  \ `BigLetterView` 每次只能显示一个字母。让我们扩展一下示例，只取字符串的第一个字母而不是直接失败。\n\n### 为 NSString 添加方法\n\
  \n如果每个 `NSString` 对象都有一个返回其第一个字母的方法，那就太好了。但它并没有，所以你将使用分类来添加它。\n\n打开 `TypingTutor`\
  \ 项目并创建一个类型为 Objective-C category 的文件。在 Category 字段输入 `FirstLetter`，在 Category 处输入\
  \ `NSString`。将创建两个文件：`NSString+FirstLetter.m` 和 `NSString+FirstLetter.h`。编辑 `NSString+FirstLetter.h`\
  \ 如下：\n\n```objc\n#import <Foundation/Foundation.h>\n\n@interface NSString (FirstLetter)\n\
  \n- (NSString *)bnr_firstLetter;\n\n@end\n```\n\n你似乎在声明类 `NSString`，但你没有给它提供任何实例变量或父类。相反，你将分类命名为\
  \ `FirstLetter` 并声明了一个方法。分类不能为类添加实例变量，只能添加方法。\n\n现在在 `NSString+ FirstLetter.m` 文件中实现\
  \ `bnr_firstLetter` 方法。让文件像这样：\n\n```objc\n#import \"NSString+FirstLetter.h\"\n\n\
  @implementation NSString (FirstLetter)\n\n- (NSString *)bnr_firstLetter\n{\n   \
  \ if ([self length] < 2) {\n        return self;\n    }\n    NSRange r;\n    r.location\
  \ = 0;\n    r.length = 1;\n    return [self substringWithRange:r];\n}\n@end\n```\n\
  \n现在你可以像使用 `NSString` 的一部分一样使用这个方法。在 `BigLetterView.m` 中，将 `readFromPasteboard:`\
  \ 改为：\n\n```objc\n- (BOOL)readFromPasteboard:(NSPasteboard *)pb\n{\n    NSArray\
  \ *classes = [NSArray arrayObject:[NSString class]];\n    NSArray *objects = [pb\
  \ readObjectsForClasses:classes options:nil];\n    if ([objects count] > 0) {\n\
  \        NSString *value = [objects objectAtIndex:0];\n        [self setString:[value\
  \ bnr_firstLetter]];\n        return YES;\n    }\n    return NO;\n}\n```\n\n在 `BigLetterView.m`\
  \ 的开头导入头文件：\n\n```objc\n#import \"NSString+FirstLetter.h\"\n```\n\n构建并运行你的应用程序。你将能够将多个字母的字符串拷贝到\
  \ BigLetterView。只有第一个字母会被拷贝。\n\n在这个示例中，你添加了一个方法，但注意你可以根据意愿向类添加任意数量的方法。在这里你只使用了类的方法，但你也可以直接访问类的实例变量。\n\
  \n### 给更好奇的人：声明私有方法\n\n通常，你会在 `.m` 文件中定义一些你不想通过在 `.h` 文件中声明它们来公开的方法。这些被称为私有方法。\n\
  \n\n\n\n如果你在声明或定义私有方法之前调用它，将收到编译器的警告。防止这些警告的一种常用技术是在 `.m` 文件的开头的一个 category 中声明这些私有方法：\n\
  \n```objc\n#import \"Megatron.h\"\n\n// 声明私有方法\n@interface Megatron ()\n- (void)blowTheLidOff;\n\
  - (void)putTheLidBackOn;\n@end\n\n@implementation Megatron\n// ...实际实现所有的私有和公共方法...\n\
  @end\n```\n\n## 第 23 章 拖放\n\n拖放本质上仅仅是一个华丽的复制-粘贴操作。当拖动开始时，某些数据会被复制到拖动贴板（pasteboard）上。当发生释放操作时，数据会从拖动贴板中读取。让这种技术比复制-粘贴更复杂的点在于，用户需要反馈：一个在拖动时出现的图像，一个拖入时会高亮的视图，可能可能在释放图像时发出一声巨大的“吞咽”声。\n\
  \n当数据从一个应用程序拖动到另一个应用程序时，可能会发生几种情况：可能什么都不发生，可能会创建数据的副本，或者可能会创建一个指向现有数据的链接。常量表示了这些操作：\n\
  \n- `NSDragOperationNone`\n- `NSDragOperationCopy`\n- `NSDragOperationLink`\n\n\
  还有一些你你不常看到的其他操作：\n\n- `NSDragOperationGeneric`\n- `NSDragOperationPrivate`\n- `NSDragOperationMove`\n\
  - `NSDragOperationDelete`\n- `NSDragOperationEvery`\n\n源和目标都必须对用户释放图像时将发生的操作达成共识。\n\
  \n当你向视图添加拖放功能时，变化包含两个不同的部分：\n\n1. 使其成为拖动源。\n2. 使其成为拖动目标。\n\n让我们分开处理这些步骤。首先，你将使你的视图成为拖动源。当它工作正常后，你将将其变为拖动目标。\n\
  \n### 使 BigLetterView 拖动源\n\n完成本节后，你将能够从 `BigLetterView` 拖出一个字母并将其释放到任何文本编辑器中。它看起来会像图\
  \ 23.1。\n\n**图 23.1.** 完成的应用程序\n\n![Image](img/00216.jpg)\n\n要成为拖动源，你的视图必须实现 `draggingSourceOperationMaskForLocal:`。此方法声明了视图愿意作为源参与的操作类型。将以下方法添加到\
  \ `BigLetterView.m` 中：\n\n```objc\n- (NSDragOperation)draggingSourceOperationMaskForLocal:(BOOL)isLocal\n\
  {\n    return NSDragOperationCopy;\n}\n```\n\n此方法会被调用两次：一次时 `isLocal` 为 `YES`，这决定了它愿意为你应用程序内部的目标参与的操作；另一次时\
  \ `isLocal` 为 `NO`，这决定了它愿意为其他应用程序中的目标参与的操作。\n\n#### 开始拖动\n\n要启动拖动操作，你将使用 `NSView`\
  \ 上的一个方法：\n\n```objc\n- (void)dragImage:(NSImage *)anImage\n             at:(NSPoint)imageLoc\n\
  \         offset:(NSSize)mouseOffset\n         event:(NSEvent *)theEvent\n    pasteboard:(NSPasteboard\
  \ *)pboard\n      source:(id)sourceObject\n   slideBack:(BOOL)slideBack\n```\n\n\
  你将为该方法提供要拖动的图像以及你想要开始拖动的点。提供的事件应该是 `mouseDown` 事件。偏移量（offset）被完全忽略。贴板通常是标准的拖动贴板。如果没有发生释放操作，你可以选择图标是否应该滑回原来的地方。\n\
  \n在 `BigLetterView.h` 中添加一个实例变量来存储 `mouseDown` 事件：\n\n`NSEvent *mouseDownEvent;`\n\
  \n在 `BigLetterView.m` 中，定义 `mouseDown:`并将事件存入该实例变量：\n\n```objc\n- (void)mouseDown:(NSEvent\
  \ *)event\n{\n    mouseDownEvent = event;\n}\n```\n\n你还需要创建一个用于拖动的图像。你可以像在视图上绘图一样在图像上绘图。为了让绘图显示在图像上而不是屏幕上，你必须首先锁定图像的焦点。当绘制完成后，你必须解锁焦点。\n\
  \n以下是需要添加到 `BigLetterView.m` 中的完整方法：\n\n```objc\n- (void)mouseDragged:(NSEvent *)event\n\
  {\n    NSPoint down = [event locationInWindow];\n    NSPoint drag = [event locationInWindow];\n\
  \    float distance = hypot(down.x - drag.x, down.y - drag.y);\n    if (distance\
  \ < 3) {\n        return;\n    }\n    // 字符串是否为空？\n    if ([string length] == 0)\
  \ {\n        return;\n    }\n    // 获取尺寸\n    NSSize s = [string size];\n    //\
  \ 创建图像\n    NSImage *anImage = [[NSImage alloc] initWithSize:s];\n    // 获取贴板\n\
  \    NSPasteboard *pb = [NSPasteboard pasteboard:NSDragPasteboard];\n    // 将字符串写入贴板\n\
  \    [self writeToPasteboard:pb];\n    // 开始拖动\n    [self dragImage:anImage\n  \
  \               at:p\n             offset:NSZeroSize\n             event:mouseDownEvent\n\
  \        pasteboard:pb\n          source:self\n       slideBack:YES];\n}\n```\n\n\
  就是。编译并运行应用程序。你应该能够将字母从视图拖出并释放到任何文本编辑器中。\n\n#### 释放之后\n\n当发生释放操作时，如果你实现了以下方法，拖动源将收到通知：\n\
  \n```objc\n- (void)draggedImage:(NSImage *)image\n             endedAt:(NSPoint)screenPoint\n\
  \           operation:(NSDragOperation)operation;\n```\n\n为了通过将字母拖到 Dock 上的垃圾桶来清除\
  \ `BigLetterView`，在 `draggingSourceOperationMaskForLocal:` 中宣告你的意愿：\n\n```objc\n\
  - (NSDragOperation)draggingSourceOperationMaskForLocal:(BOOL)isLocal\n{\n    return\
  \ NSDragOperationCopy | NSDragOperationDelete;\n}\n```\n\n然后实现 `draggedImage:endedAt:operation:`：\n\
  \n```objc\n- (void)draggedImage:(NSImage *)image\n             endedAt:(NSPoint)screenPoint\n\
  \           operation:(NSDragOperation)operation\n{\n    if (operation == NSDragOperationDelete)\
  \ {\n        [self setString:@\"\"];\n    }\n}\n```\n\n### 使 BigLetterView 目标\n\n\
  成为目标有几个部分。首先，你需要声明你的视图是某些类型拖动的目标。`NSView` 有一个用于此目的的方法：\n\n`- (void)registerForDraggedTypes:(NSArray\
  \ *)pboardTypes`\n\n你通常在 `initWithFrame:` 方法中调用此方法。\n\n你需要实现六个方法。（是的，六个！）这六个方法都有相同的参数：一个遵循\
  \ `NSDraggingInfo` 协议的对象。该对象拥有拖动贴板。这六个方法的调用如下：\n\n1. 当图像拖入目标时，目标会收到 `draggingEntered:`\
  \ 消息。通常，目标视图会更新其外观。例如，它可以高亮自己。\n2. 当图像留在目标内时，会发送一系列 `draggingUpdated:` 消息。实现 `draggingUpdated:`\
  \ 是可选的。\n3. 如果图像被拖出目标，则会发送 `draggingExited:`。\n\n\n\n\n\n> **4.** 如果图像在目标位置释放，它要么滑回源位置（这会破坏序列），要么向目标位置发送\
  \ `prepareForDragOperation:` 消息，这取决于最近一次 `draggingEntered:`（如果视图实现了该方法，则为 `draggingUpdated:`）的返回值。\n\
  \n> **5.** 如果 `prepareForDragOperation:` 消息返回 `YES`，则发送 `performDragOperation:`\
  \ 消息。这通常是应用程序从剪贴板读取数据的地方。\n\n> **6.** 最后，如果 `performDragOperation:` 返回 `YES`，则会发送\
  \ `concludeDragOperation:`。外观可能会发生变化。在这里你可能会产生一个大大的“咕嘟”声声，以表示拖放成功。\n\n### registerForDraggedTypes:\n\
  \n在 `BigLetterView.m` 的 `initWithFrame:` 方法中添加对 `registerForDraggedTypes:` 的调用：\n\
  \n```objectivec\n- (id)initWithFrame:(NSRect)rect\n{\n    self = [super initWithFrame:rect];\n\
  \    if (self) {\n        NSLog(@\"initializing view\");\n        [self prepareAttributes];\n\
  \        bgColor = [NSColor yellowColor];\n        string = @\"\";\n        [self\
  \ registerForDraggedTypes:\n        [NSArray arrayWithObject:NSPasteboardTypeString]];\n\
  \    }\n    return self;\n}\n```\n\n### 添加高亮\n\n为了向用户指示释放操作是可以接受的，你的视图将高亮自己。在 `BigLetterView.h`\
  \ 中添加一个 `highlighted` 实例变量：\n\n```objectivec\n@interface BigLetterView : NSView\n\
  {\n    NSColor *bgColor;\n    NSString *string;\n    NSMutableDictionary *attributes;\n\
  \    NSEvent *mouseDownEvent;\n    BOOL highlighted;\n}\n```\n\n现在你要在 `drawRect:`\
  \ 中添加高亮。`NSGradient` 类使得绘制渐变变得简单。在这种情况下，你将绘制一个径向渐变：中心为白色并逐渐淡变为 `bgColor`。\n\n```objectivec\n\
  - (void)drawRect:(NSRect)rect\n{\n    NSRect bounds = [self bounds];\n    // 如果处于高亮状态，则绘制渐变背景\n\
  \    if (highlighted) {\n        NSGradient *gr;\n        gr = [[NSGradient alloc]\
  \ initWithStartingColor:[NSColor whiteColor]\n        endingColor:bgColor];\n  \
  \      [gr drawInRect:bounds relativeCenterPosition:NSZeroPoint];\n    } else {\n\
  \        [bgColor set];\n        [NSBezierPath fillRect:bounds];\n    }\n    [self\
  \ drawStringCenteredIn:bounds];\n}\n```\n\n### 实现拖放目标方法\n\n到为止，我们已经看到了两种声明对象指针的方法。如果指针可以引用任何类型的对象，我们可以像这样声明它：\n\
  \n```objectivec\nid foo;\n```\n\n如果指针应该引用特定类的实例，我们可以像这样声明：\n\n```objectivec\nMyClass\
  \ *foo;\n```\n\n还存在第三种可能性。如果我们有一个指针应该引用一个符合特定协议的对象，我们可以像这样声明：\n\n```objectivec\n\
  id <MyProtocol> foo;\n```\n\n`NSDraggingInfo` 是一个协议，而不是一个类。所有的拖放目标方法都期望一个符合 `NSDraggingInfo`\
  \ 协议的对象。\n\n在 `BigLetterView.m` 中添加以下方法：\n\n```objectivec\n#pragma mark Dragging\
  \ Destination\n\n- (NSDragOperation)draggingEntered:(id <NSDraggingInfo>)sender\n\
  {\n    NSLog(@\"draggingEntered:\");\n    if ([sender draggingSource] == self) {\n\
  \        return NSDragOperationNone;\n    }\n\n    highlighted = YES;\n    [self\
  \ setNeedsDisplay:YES];\n    return NSDragOperationCopy;\n}\n\n- (void)draggingExited:(id\
  \ <NSDraggingInfo>)sender\n{\n    NSLog(@\"draggingExited:\");\n    highlighted\
  \ = NO;\n    [self setNeedsDisplay:YES];\n}\n\n- (BOOL)prepareForDragOperation:(id\
  \ <NSDraggingInfo>)sender\n{\n    return YES;\n}\n\n- (BOOL)performDragOperation:(id\
  \ <NSDraggingInfo>)sender\n{\n    NSPasteboard *pb = [sender draggingPasteboard];\n\
  \    if(![self readFromPasteboard:pb]) {\n        NSLog(@\"Error: Could not read\
  \ from dragging pasteboard\");\n        return NO;\n    }\n    return YES;\n}\n\n\
  - (void)concludeDragOperation:(id <NSDraggingInfo>)sender\n{\n    NSLog(@\"concludeDragOperation:\"\
  );\n    highlighted = NO;\n    [self setNeedsDisplay:YES];\n}\n```\n\n### 添加第二个\
  \ BigLetterView\n\n回到你 Xcode 中的 `TypingTutor` 项目。创建一个名为 `TutorController` 的 Objective-C\
  \ 类。在 `TutorController.h` 中，为它提供两个 outlets 和一个 action。你还需要一个计时器、一个用于字母的数组、上一个显示的字母的索引，以及三个帮助跟踪当前字母可见时长的时间间隔：\n\
  \n```objectivec\n@interface TutorController : NSObject\n{\n```\n\n\n\n\n```objectivec\n\
  // Outputs\nIBOutlet BigLetterView *inLetterView;\nIBOutlet BigLetterView *outLetterView;\n\
  \n// Data\nNSArray *letters;\nint lastIndex;\n\n// Time\nNSTimeInterval startTime;\n\
  NSTimeInterval elapsedTime;\nNSTimeInterval timeLimit;\nNSTimer *timer;\n}\n- (IBAction)stopGo:(id)sender;\n\
  - (void)updateElapsedTime;\n- (void)resetElapsedTime;\n- (void)showAnotherLetter;\n\
  @end\n```\n\n#### 布局界面\n\n打开 `MainMenu.xib`。通过向编辑器中拖入一个对象（从 Cocoa -> Objects & Controllers\
  \ 下）来创建 `TutorController` 的实例。将类设置为 `TutorController`（参考图 24.4）。\n\n**图 24.4.**\
  \ 创建 TutorController 实例\n\n![Image](img/00221.jpg)\n\n添加两个标签（来自 Cocoa -> Controls），并将它们放置在每个\
  \ `BigLetterView` 实例上方。将左侧的标签设置为 Type Here，右侧的标签设置为 Match This。\n\n在窗口上拖入一个 `NSProgressIndicator`。使用检查器（Inspector）将其设置为非不确定模式（indeterminate）。将其范围设置为\
  \ 0 到 100（参考图 24.5）。\n\n**图 24.5.** 检查进度条\n\n![Image](img/00222.jpg)\n\n在窗口上放置一个圆角纹理按钮（Rounded\
  \ Textured Button）。使用属性检查器（Attributes Inspector），将其标题设置为 Go，备用标题（alternate title）设置为\
  \ Stop。将其类型设置为切换（Toggle），并将状态设置为关闭（Off）（参考图 24.6）。\n\n**图 24.6.** 检查按钮\n\n![Image](img/00223.jpg)\n\
  \n### 建立连接\n\n按住 Control 拖动按钮到 `TutorController` 对象。将动作（action）设置为 `stopGo:`（参考图\
  \ 24.7）。\n\n**图 24.7.** 将按钮连接到 TutorController\n\n![Image](img/00224.jpg)\n\n打开进度条的绑定检查器（Bindings\
  \ Inspector）（参考图 24.8）。将值（Value）绑定到 `TutorController` 的模型键 `elapsedTime`。将进度条上的最大值（Max\
  \ Value）也绑定到导师控制器的 `timeLimit`。\n\n**图 24.8.** NSProgressIndicator 绑定\n\n![Image](img/00225.jpg)\n\
  \nControl-点击 `TutorController` 以显示连接面板。从 `inLetterView` 拖到左侧的 `BigLetterView`。从\
  \ `outLetterView` 拖到右侧的 `BigLetterView`（参考图 24.9）。\n\n**图 24.9.** 连接 outLetterView\
  \ 属性\n\n![Image](img/00226.jpg)\n\n#### 为 TutorController 添加代码\n\n在 `TutorController.m`\
  \ 中实现以下方法：\n\n```objectivec\n#import \"TutorController.h\"\n#import \"BigLetterView.h\"\
  \n\n@implementation TutorController\n\n- (id)init\n{\n    self = [super init];\n\
  \    if (self) {\n        // 创建字母数组\n        letters = [NSArray arrayWithObjects:@\"\
  a\", @\"s\",\n        @\"d\",@\"f\", @\"j\", @\"k\", @\"l\", @\";\", nil];\n\n \
  \       // 初始化随机数生成器\n        srandom((unsigned)time(NULL));\n        timeLimit\
  \ = 5.0;\n    }\n    return self;\n}\n\n- (void)awakeFromNib\n{\n    [self showAnotherLetter];\n\
  }\n\n- (void)resetElapsedTime\n{\n    startTime = [NSDate timeIntervalSinceReferenceDate];\n\
  \    [self updateElapsedTime];\n}\n\n- (void)updateElapsedTime\n{\n    [self willChangeValueForKey:@\"\
  elapsedTime\"];\n    elapsedTime = [NSDate timeIntervalSinceReferenceDate] - startTime;\n\
  \    [self didChangeValueForKey:@\"elapsedTime\"];\n}\n\n- (void)showAnotherLetter\n\
  {\n    // 随机选择数字，直到获得与上一个\n    //不同的数字\n    int x = lastIndex;\n    while (x ==\
  \ lastIndex){\n        x = (int)(random() % [letters count]);\n    }\n    lastIndex\
  \ = x;\n    [outLetterView string:[letters objectAtIndex:x]];\n\n    // 开始计数\n \
  \   [self resetElapsedTime];\n}\n\n- (IBAction)stopGo:(id)sender\n{\n    [self resetElapsedTime];\n\
  \    if (timer == nil) {\n        NSLog(@\"Starting\");\n        // 创建计时器\n    \
  \    timer = [NSTimer scheduledTimerWithInterval:0.1\n        target:self\n    \
  \    selector:checkTime:)\n        userInfo:nil\n        repeats:YES];\n    } else\
  \ {\n        NSLog(@\"Stopping\");\n        // 失效计时器\n        timer = nil;\n   \
  \ }\n}\n\n- (void)checkTime:(NSTimer *)aTimer\n{\n    if ([inLetter string]) {\n\
  \        [self showAnotherLetter];\n    }\n    [self updateElapsedTime];\n    if\
  \ (elapsedTime >= timeLimit) {\n        NSBeep();\n        [self resetElapsedTime];\n\
  \    }\n}\n\n@end\n```\n\n\n\n\n\n你的 `TutorController` 将控制滑块和窗口，因此你需要为它们添加输出（outlets）。此外，当用户选择“Adjust\
  \ speed...”菜单项或点击 OK 按钮时，你的 `TutorController` 将收到一条消息，因此你需要为 `TutorController` 添加两个动作方法（action\
  \ methods）。\n\n图 25.2 展示了对象图。\n\n**图 25.2.** 对象图\n\n![Image](img/00228.jpg)\n\n\
  ### 添加输出和动作\n\n如下编辑 `TutorController.h`：\n\n```objc\n#import <Cocoa/Cocoa.h>\n\n\
  @class BigLetterView;\n\n@interface TutorController : NSObject\n{\n    // Outlets\n\
  \    IBOutlet BigLetterView *inLetterView;\n    IBOutlet BigLetterView *outLetterView;\n\
  \    IBOutlet NSWindow *speedSheet;\n\n    // Data\n    NSArray *letters;\n    int\
  \ lastIndex;\n\n    // Time\n    NSTimeInterval startTime;\n    NSTimeInterval timeLimit;\n\
  \    NSTimeInterval elapsedTime;\n    NSTimer *timer;\n}\n- (IBAction)stopGo:(id)sender;\n\
  - (IBAction)showSpeedSheet:(id)sender;\n- (IBAction)endSpeedSheet:(id)sender;\n\n\
  - (void)updateElapsedTime;\n- (void)resetElapsedTime;\n- (void)showAnotherLetter;\n\
  \n@end\n```\n\n保存文件。\n\n#### 布局界面\n\n打开 `MainMenu.xib`。从库（Library，位于 Cocoa -> Windows\
  \ & Menus 下）拖出一个菜单项，为你的应用程序添加到主菜单中（图 25.3）。\n\n**图 25.3.** 添加菜单项\n\n![Image](img/00229.jpg)\n\
  \n将菜单项的标题更改为 Adjust Speed.... 按 Control-drag 从该菜单项拖动到 `TutorController`。将动作设置为 `showSpeedSheet:`（图\
  \ 25.4）。\n\n**图 25.4.** 连接菜单项\n\n![Image](img/00230.jpg)\n\n通过从库（Library，位于 Cocoa\
  \ -> Windows & Menus 下）拖出一个窗口创建一个新窗口（图 25.5）。禁用窗口的调整大小。取消勾选 Visible at launch（启动时显示）。\n\
  \n**图 25.5.** 检查新窗口\n\n![Image](img/00231.jpg)\n\n在新窗口上放置一个滑块。为了将滑块的左端标记为“1 second”，右端标记为“10\
  \ seconds”，请向窗口上丢入两个标签。在滑块上方添加第三个标签，内容为 `Time per letter:`。添加一个按钮并将其标题更改为 OK。检查滑块并将其范围设置为\
  \ 1 到 10（图 25.6）。\n\n**图 25.6.** 检查滑块\n\n![Image](img/00232.jpg)\n\n将滑块的 Value（值）绑定到\
  \ `TutorController` 的 `timeLimit`，如图 25.7 所示。\n\n**图 25.7.** 将滑块的值绑定到 timeLimit\n\
  \n![Image](img/00233.jpg)\n\n当用户点击 OK 按钮时，应该向 `TutorController` 发送一条消息以结束表单（sheet）。从按钮\
  \ Control-drag 到 `TutorController` 并选择 `endSpeedSheet:` 作为动作（图 25.8）。\n\n**图 25.8.**\
  \ 设置目标的 Target\n\n![Image](img/00234.jpg)\n\n你的 `TutorController` 将控制滑块和窗口，因此你需要为它们添加输出。此外，当用户选择“Adjust\
  \ speed...”菜单项或点击 OK 按钮时，你的 `TutorController` 将收到一条消息，因此你需要为 `TutorController` 添加两个动作方法。\n\
  \n图 25.2 展示了对象图。\n\n**图 25.2.** 对象图\n\n![Image](img/00228.jpg)\n\n### 添加输出和动作\n\n\
  如下编辑 `TutorController.h`：\n\n```objc\n#import <Cocoa/Cocoa.h>\n\n@class BigLetterView;\n\
