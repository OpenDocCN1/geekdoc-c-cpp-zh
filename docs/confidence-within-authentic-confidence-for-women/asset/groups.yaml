    # Chapter 3 - You’re not the girl you think you are


    > *“Choose beliefs that serve your soul - choose beliefs that serve the grander
    dream of who you choose to be”.*


    Joy Page


    We humans are meaning makers. We can take any experience of our lives and create
    a meaning that either empowers us or holds us back. One woman’s nightmare is another
    woman’s dream. It really is a question of perspective and expectation, which then
    becomes a self-fulfilling prophecy as what you believe to be true of you becomes
    exactly so. You see we humans also need to be right, so we search for and accumulate
    evidence to prove our position.


    The other evening I was out with some friends for a little celebration. One of
    my single friends declared to have lost all interest in men, claiming only to
    attract losers, idiots and drunkards, whilst refuting all disagreements to the
    contrary. As we were leaving the bar a drunk man passed and shouted across, “Hello
    ya big darlin’!”


    > “See, see what I mean,” she retorted.


    Absolutely! You see that’s exactly what she expected and that’s what she attracted.
    Another friend is very confident in her attraction factor and is never without
    a dinner date. She expects the best and gets it and is often whisked off to some
    exotic resort with her current beau.'
