  mdcn: "\n\n![](img/7cf73384b5e10c5a70e940a706554730_0_0.png)\n\n## 内在自信\n\n### 女性真正的自信\n\
    \n安妮·麦吉\n\n女性能行教练\n\n![](img/7cf73384b5e10c5a70e940a706554730_1_0.png)\n\n由互联网档案馆于2022年数字化，资金来自卡勒/奥斯汀基金会\n\
    \n## 内在自信\n\n### 女性真正的自信\n\n安妮·麦吉  \n女性*能行*教练\n\n## 致谢\n\n我怀着爱与感激之情，向以下各位致谢\n\n\
    我的父母伊丽莎白和乔治·麦吉，他们对我的信任从未动摇；如果在灵魂层面我们确实会选择父母，那我选得很好——谢谢你们！\n\n我的兄弟姐妹弗朗西丝、桑德拉和乔治，感谢他们在艰难时期给予的鼓励和支持。\n\
    \n我的导师亚历山德拉·沃森，感谢她在本书写作期间给予的支持、指导和激励。\n\n安妮·玛丽·麦金托什，高管教练兼朋友，感谢她迅速阅读本书初稿，并给予鼓励而热情的反馈。\n\
    \n我的客户们，感谢你们有勇气缩小自信与能力之间的差距，挺身而出，进入个人和职业的最佳状态。你们激励着我！特别感谢那些愿意并允许我分享他们的经历、见解和所学的人。\n\
    \n## 目录\n\n- 引言 ........................................................................\
    \ 6\n- 关于作者——关于我和我的历程的一点介绍 .................... 8\n- 第1章——真正的自信 ...........................................\
    \ 11\n- 第2章——卸下过去的包袱 ...................... 30\n- 第3章——你并不是你以为的那个女孩 ........................\
    \ 50\n- 第4章——自我尊重的重要性 ................................. 60\n- 第5章——自我关怀 ..............................................................\
    \ 71\n- 第6章——建立你的自信资源工具包 ...........................................................................\
    \ 79\n- 第7章——你的话语就是你的魔杖，真是这样吗？ ............................... 92\n- 第8章——你能吗？——你能！\
    \ ............................................... 103\n\n## 引言\n\n自信有点像钟摆，从一个极端摆向另一个极端。相信我，对每个人来说，它都处于不断变化之中；我辅导过足够多的人，所以我知道这一点：没有人——我是说没有人——在所有时候、所有情境下都充满自信。\n\
    \n但在人生的任何阶段都可能出现这样的时刻：无论你表面上有多成功，或别人认为你有多成功，你内心就是感觉不到自信。你觉得自己像个骗子、冒名顶替者，害怕自己会被识破。你的自信落后于你的能力。\n\
    \n我经历过，也深有体会，非常清楚那种感觉会多么令人衰弱无力。我记得自己完全无法与镜中回望我的那个女性产生连接；她看上去不错，走路和说话都带着自信，但我内心感到空虚，害怕被识破，因为我不相信自己，也怀疑那些相信我的人所说的话。\n\
    \n我相信，认识我的人中会有人对了解到这一点感到惊讶，因为从外表看，我显得非常从容得体。看到别人以我渴望的方式取得成功，而我却被恐惧冻住，我不得不学习并制定在需要时有效的自信危机应对策略；但真正的自信只有在我学会接纳和重视自己，并与内在智慧连接时才出现。\n\
    \n本书融合了提升自信的诀窍和技巧，但其目的是带你踏上一段重新发现自我的旅程。我们将首先审视自信究竟是什么，它如何影响我们对自己、自身能力以及他人的看法。自信在各种情境中如何对我们有利、又如何对我们不利，以及自然自信的特质与吸引力。\n\
    \n我会为你提供一张路线图，通往那个真实之地：在那里你接纳并欣赏自己；从那里你可以培养内在自信，并学会走向成功。你将学会如何承认并处理自己的过去，从而放下包袱和限制性信念，并利用从中获得的见解和学识来指导自己，挺身走向你期望的未来。\n\
    \n我的目标是带你到那个地方：在那里你学会尊重自己，看到敢于梦想的力量，并允许自己去相信；你可以成为你想成为的人，得到你想从生活中得到的东西。你将学会认识自己的韧性，培养个人资源以获得终生受用的自信，最重要的是，信任你的内在智慧，以及内心那个轻柔细微、低语着“你一定能做到”的声音。\n\
    \n## 关于我和我的历程的一点介绍\n\n我的整个职业生涯都围绕着与人合作，帮助他们看到并发展自己的潜能。起初，我担任中学辅导员，与年轻人打交道，后来转向管理和实施面向公共和私营部门员工的专业与个人发展项目。\n\
    \n五年前，我从一家培训公司的合同经理职位上被裁员。虽然我很高兴离开那个职位，但我没有意识到自己的身份认同在多大程度上与它捆绑在一起，也没有意识到失业及其带来的挑战会如何影响我的自信。\n\
    \n我拥有良好的职业声誉，但缺乏方向。我感到迷茫，认为自己缺少选择，尽管事实并非真的如此。我得到了面试机会，却把面试搞砸了，但并不真正明白为什么。回想起来，我认为内心深处，我经营自己企业的愿望可能比我意识到的还要强烈。\n\
    \n我接受了专业教练培训，并创办了自己的教练与咨询业务，这也给我的自信带来了一大堆其他挑战：建立人脉、推销、投标和协商费用。这些技能对我来说都不陌生，但我缺乏信心去建立那种联系，也缺乏信心把自己擅长的技能迁移到新业务中。\n\
    \n说实话，我把任何形式的拒绝都当成针对我个人的。我缺乏自信，常常对那些相信我的人感到困惑，甚至震惊。我的自信与能力之间的差距如此之大，以至于我总是在寻找B计划，以防我的业务失败。我和另一位商界女性建立了一个商业网络，并成功运营了两年。我还接受了普拉提教练培训——相信我，这两件事都不容易！\n\
    \n然而，我仍然缺乏自尊，也不相信自己有能力实现抱负、把自己视为成功者。我总是向他人寻求关于我的价值和能力的认可、许可和肯定。当时我以为只有自己有这种感觉，后来我了解到，大多数女性在某个阶段都会有这种感受。\n\
    \n我读过大量关于个人、职业和精神发展的书。我聘请过教练，参加过数百门培训课程和网络研讨会，还是在线论坛和智囊团的成员，以帮助我缩小自信与能力之间的差距。但只有当我进行内在功课，重新连接我的女性智慧时，我才被引向一个信任、平和、平衡与身心安适的地方。我相信，我是谁以及我能提供的东西都是有价值的。\n\
    \n## 第1章——真正的自信\n\n> **自信**——*对自己能力有把握，或对他人、计划或未来抱有信任的品质。*\n> \n> ——《剑桥词典》\n\n\
    自信是复杂的；它像变色龙——会随着我们生活中发生的事情、我们所处的境况，甚至我们与谁在一起而变化。它是一种备受追捧、令人向往的品质，然而就其程度而言，它既可以是朋友也可以是敌人，而且常常是伪装大师。\n\
    \n### 令人向往\n\n自信令人着迷、超越年龄、富有诱惑力，并且具有某种性感。我们可能会发现自己被最意想不到的人吸引，仅仅因为他们安于自我、自在做自己。我记得很多年前，听到一位同事称演员杰克·尼科尔森“极其性感”，我觉得好笑，说实话也很困惑。他并非通常意义上的电影帅哥，但她觉得他的自信如此迷人。我记得不久前读过一篇文章，谈到女演员弗朗西斯卡·安妮斯，她在61岁时仍被形容为“依旧性感”，不是因为她容貌——尽管她仍是非常有魅力的女性——而更多是因为她的态度和自信。\n\
    \n### 朋友\n\n当我们感到自信时，我们往往会以心流状态处理眼前的情况或任务，常常几乎意识不到自己在做什么，甚至可能没有意识到自己是什么样的人。\n\n"
