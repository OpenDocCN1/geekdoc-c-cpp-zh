    \ live her dream and because she was unable to give herself permission to experiment\
    \ with her life, change career and start her own business she remained unfulfilled\
    \ in teaching.\n\nWhat these real life examples demonstrate is that while we may\
    \ know what we want to do and have in our lives, we often find ourselves drawn\
    \ to look outside ourselves for the permission to pursue it or the permission\
    \ that says that we are good enough. The problem with seeking permission from\
    \ others is that it robs you of your own personal power and your full potential.\n\
    \nGiving yourself permission is just a matter of making a decision. Go within\
    \ and listen to your inner wisdom, get a sense of what it’s telling you, check\
    \ in with your feelings. Be mindful of the language you use when you talk about\
    \ the decision to be made because these are clear indicators of whether you should\
    \ be making a decision in the moment or not.\n\nI have personally found it very\
    \ helpful to follow the advice of one of my mentors David Neagle, Success and\
    \ Wealth Consciousness Coach, who offers four questions for your reflection.\n\
    \n1. **Is this opportunity something that I want to be, do or have?**\n\n   A\
    \ simple yes or no answer is all that is required to this question. If you want\
    \ the opportunity then you move on to question two otherwise the decision is made\
    \ and you let the opportunity go.\n\n2. **Is being, doing or having this going\
    \ to take me closer to my goal / heart's desire / life's purpose?**\n\n   Again\
    \ a simple yes or no answer is all that's required; if the answer is no again\
    \ let it go.\n\n3. **Is being, doing or having this in harmony with the laws of\
    \ the universe?**\n\n   For an opportunity to be in harmony with the laws of the\
    \ universe it would have to add to your life without taking away from someone\
    \ else's which is further clarified by question 4.\n\n4. **Is being, doing or\
    \ having this going to violate the rights of others?**\n\n   By embracing the\
    \ opportunity, would you be taking away another person's ability to choose?\n\n\
    If you answered *yes* to the first three questions and *no* to the fourth question,\
    \ then the universe will support you in moving forward. Whatever it is that you\
    \ need in terms of resources, people or support will start to flow towards you,\
    \ but first you must make the decision and trust that the way and the 'how to'\
    \ will become clear.\n\nWhen I decided to set up my own business I knew that I\
    \ couldn't afford to retain the flat that I was living in so I made the decision\
    \ to sell it. It was October and I expected to be living there until the following\
    \ January at least. My flat sold within 2 days of being on the market. I was shocked\
    \ and scared because I had to be out within 6 weeks and if I'm honest, heartbroken\
    \ too because I loved that flat and thought I wouldn't get anything better in\
    \ my price range. My focus was on finding a rented property fast. I saw a few\
    \ dodgy dwellings but without too much effort I found a flat a little more expensive\
    \ than I'd planned for but well worth it as it was even better than the one I'd\
    \ left. It had a terrace, underground parking and concierge service. Shortly after\
    \ I settled into the flat, business began to flow.\n\nWhen you do not love yourself\
    \ and suffer from low self-esteem, it is almost impossible to ever reach the potential\
    \ that you suspect you have. Recognising you deserve to have what you want and\
    \ giving yourself permission to go after it, is an act of self-love. Learning\
    \ to love yourself starts with making a conscious decision, an intention to become\
    \ happy and lead a fulfilled life.\n\n### Self-love\n\nI want to clarify here\
    \ the difference between self-love and 'lovin' yourself' a phrase often used by\
    \ us Glaswegians to describe someone who is over confident or perhaps has narcissistic\
    \ tendencies. Social philosopher and Psychologist Erich Fromm proposed that loving\
    \ oneself is different from being arrogant, conceited or egocentric. He proposed\
    \ that loving oneself means caring about oneself, taking responsibility for oneself\
    \ and the outcomes we create. It's about self-respect and self-knowledge, and\
    \ being realistic and honest about one's strengths and weaknesses. He proposed,\
    \ further, that in order to be able to truly love another person, a person needs\
    \ first to love oneself in this way. It's not an easy process. I've been through\
    \ it but the inner peace and contentment it brings is pure gold.\n\nSelf-love\
    \ involves recognizing that you are constantly evolving to become more powerful\
    \ and more\n"
  mdcn: "\n## 第8章 你能吗？你一定能！\n\n> “成功来自‘能’，而不是‘不能’，”  \n>\n> — 佚名\n\n如果此刻我问你：“是什么阻碍了你成为、做到或拥有你在生活中最想要的东西？”你很可能给出一个“不能”式的回答，涉及时间、金钱、承诺和义务等外在因素。而我想说的是，真正阻碍你至今的一直是内在因素，比如配得感、许可或自爱；因为当你拥有了这些，你就会拥有内在的自信。\n\
    \n### 配得感\n\n配得感是个棘手的问题，因为我们从小就被教导要知足常乐，或退而求其次。我们还通过宗教的负罪感和内心深处因过往错误经历而埋藏的秘密羞愧，学到了配得感。它常常受到这样一种想法的影响：如果我们真的配得上自己所渴望的东西，那么它现在早就该发生了。但你能运用吸引力法则去显化生命中真正想要的东西，这其实是一项内在的功课。\n\
    \n宇宙会根据你自身的价值感和配得感来配送（或不配送）你的渴望。如果在你的内心深处，你并不觉得自己值得拥有所渴望的东西，这种信念就会阻碍这些事物进入你的生活。一旦你开始认识到成功是你与生俱来的权利，无论这在你个人意义上意味着什么，并且一旦你\n\
    \n- 你配拥有什么？你是否相信：“我值得拥有爱、喜悦和一切美好”？\n- 还是你在内心深处觉得自己什么都不配？你是否愿意放下关于配得感的限制性信念？\n\n\
    请记住，要开始这个过程，你只需要愿意放下关于配得感的限制性信念。你可能会发现，定期阅读下面这段文字很有帮助。\n\n### 配得感疗愈\n\n我值得拥有。我方方面面都值得拥有最好的。\
    \  \n我值得拥有健康。  \n我值得拥有最好的事业，从事一份我热爱且报酬优厚的工作。  \n我值得拥有最好的关系，一段充满爱与滋养、让我被倾听和被看见的关系。\
    \  \n我值得在各个层面得到爱。  \n我值得拥有自由，成为我所能成为的一切。  \n我超越所有限制性和负面的想法。  \n我放下父母带给我的局限。我爱他们，并超越他们。\
    \  \n我不是他们的负面意见或限制性信念。我不受我所在社会的任何恐惧或偏见的束缚。我不再认同任何形式的局限。  \n我只会吸引最好的事物到我身边。  \n\
    我现在就吸引我的最高善和最大喜悦。就是现在，不是明天或下周……现在！因为，我值得。  \n我接受这一点，并且我知道这是真的。\n\n### 许可\n\n从很小的时候起，我们就被教导在采取行动之前要先征求“许可”，比如在课堂上提问要获得许可，离开餐桌要获得许可，晚归或约会要获得许可。如果我们想要拥有或做的事情确实会显著影响周围的人，那么在行动之前征得他们的许可，是合情合理的。但很多时候，我们会有意或无意地寻求他人的许可，是因为我们不确定自己是否“可以”拥有或做想做的事，或者因为我们觉得自己不“配”得到想要的。\n\
    \n萨拉对鞋子情有独钟，买了一双 Jimmy Choo。她的社交生活丰富多彩，经常参加各种舞会和盛大活动，但她从不穿她的 Jimmy Choo 鞋。相反，她把鞋子放在衣橱里的盒子里，偶尔拿出来欣赏，或者穿着它们在家里铺着地毯的地板上走一圈。虽然萨拉允许自己购买昂贵漂亮的东西，但她并没有允许自己真正享受穿上这双鞋的乐趣，也不允许自己拿它们去冒险磨损，尽管她很可能买得起另一双。\n\
    \n艾莉森出身于一个教师家庭，但从十几岁起，她就梦想着经营自己的事业。可大学毕业后，她直接选择了教师培训，这是一条稳妥的就业之路。她很快步步高升，成为一所小学的校长。虽然她非常擅长自己的工作，而且这份工作也颇具回报，但她仍感不满足，内心怀揣着创业的梦想。艾莉森不敢迈出这大胆的一步，因为害怕离开舒适区、害怕失败。没有人告诉她应该去实现自己的梦想，而她又无法给自己许可去尝试不同的生活、转换职业、开创自己的事业，所以她一直留在教学岗位上，内心却始终得不到满足。\n\
    \n这些真实案例所揭示的是，尽管我们可能知道自己想做什么、想拥有什么，但我们常常不由自主地向外寻求许可，以允许自己去追求，或者寻求一个告诉我们“你足够好”的许可。向外寻求许可的问题在于，它会夺走你自身的力量和全部潜能。\n\
    \n给自己许可，其实只需做出一个决定。向内看，倾听你的内在智慧，感受它在告诉你什么，检视你的感受。在谈论要做的决定时，注意你使用的语言，因为这些措辞清楚地表明此刻你是否应该做出决定。\n\
    \n我个人觉得，按照我的一位导师戴维·尼格尔（David Neagle）的建议去做非常有帮助。他是成功与财富意识教练，他提供了四个问题供你反思。\n\n1.\
    \ **这个机会是我想要成为、做到或拥有的吗？**\n\n   这个问题只需要简单回答“是”或“否”。如果你想要这个机会，就进入第二个问题；否则，决定已经做出，你便放手让这个机会过去。\n\
    \n2. **成为、做到或拥有这件事，会让我更接近自己的目标/内心渴望/人生使命吗？**\n\n   同样，只需简单回答“是”或“否”；如果答案还是“否”，就再次放手。\n\
    \n3. **成为、做到或拥有这件事是否与宇宙法则和谐一致？**\n\n   一个机会要与宇宙法则和谐一致，就必须在不夺走他人什么东西的前提下为你的生活增添价值，这一点通过第4个问题会进一步明确。\n\
    \n4. **成为、做到或拥有这件事是否会侵犯他人的权利？**\n\n   抓住这个机会，是否会夺走他人选择的能力？\n\n如果你对前三个问题的回答是*是*，对第四个问题的回答是*否*，那么宇宙会支持你继续前进。无论你在资源、人脉或支持方面需要什么，都会开始流向你；但首先你必须做出决定，并相信方法和“怎么做”会逐渐清晰。\n\
    \n当我决定创立自己的公司时，我知道自己无法继续负担当时住的公寓，于是决定卖掉它。当时是十月，我原本预期至少会一直住到次年一月。结果我的公寓挂牌两天内就卖掉了。我又震惊又害怕，因为我必须在六周内搬出去；坦白说，我也是心碎的，因为我爱那套公寓，而且觉得在自己的预算范围内再也找不到更好的了。我的当务之急是尽快找到一套出租房。我看过几处不太可靠的住所，但没费太多功夫就找到了一套公寓，价格比我计划的稍贵一点，但非常值得，因为它比我离开的那套还要好。它带有一个露台、地下停车场和礼宾服务。我住进那套公寓后不久，业务就开始源源不断地来了。\n\
    \n当你不爱自己、自尊心低落时，几乎不可能实现你隐约怀疑自己拥有的潜能。认识到自己配得上想要的东西，并允许自己去追求它，是一种自爱的行为。学会爱自己始于做出一个有意识的决定，一个让自己变得快乐、过上充实生活的意愿。\n\
    \n### 自爱\n\n我想在此澄清“自爱”和我们格拉斯哥人常说的“爱自己”（'lovin' yourself'）之间的区别，后者常用来形容某个过度自信甚至可能自恋的人。社会哲学家、心理学家埃里希·弗洛姆提出，爱自己不同于傲慢、自负或自我中心。他认为，爱自己意味着关心自己，为自己和我们所创造的结果负责。这关乎自尊和自知，以及如实、诚实地看待自己的优缺点。他进一步提出，一个人若想真正爱另一个人，就必须先以这种方式爱自己。这不是一个容易的过程。我曾经走过这条路，但它带来的内心平静与满足是纯金般珍贵的。\n\
    \n自爱包括认识到你正在不断进化，变得更强大，并且更加\n"
