    # ## Summary


    +   - Self-Honour is at the heart of authentic confidence. It is about putting
    the right things in place so that self-care and self-confidence can flourish.


    +   - Tolerations often represent compromises you have been talked into or talked
    yourself into.


    +   - Self-sacrificing behaviour can be virtuous but can also have a destructive
    impact on your self-esteem.


    +   - Recognise that every toleration has a payoff for you.


    +   - Having healthy boundaries is important for your self-worth and self-respect.


    +   - Failure to set healthy boundaries can be tied up with a need to be needed,
    fear of offending, fear of failure or fear of success.


    +   - Clear boundaries build trust and respect in others and in yourself.


    +   - Your responsibility is to empower and strengthen others and encourage them
    to carry their own responsibilities, make their own decisions and their own way
    in life.'
  - '[PAGE 72]


    # Chapter 5 – Self Care


    > > *Love yourself first, and everything else falls in line. You really have to
    love yourself to get anything done in this world''*.

    > >

    > > Lucille Ball


    Self-love is expressed through self-care and self-care allows authentic confidence
    to show and flow with an ease that is transparent for all to see. Self-care demonstrates
    that a person respects themselves and knows what they need to do, be and have
    to enjoy a happy, fulfilling and balanced personal and professional life.


    Any change in confidence requires a change in attitude and behaviour, self-care
    requires you to be mindful of self-sabotaging beliefs and self-sacrificing behaviours,
    pausing to question them rather than allowing them to run on automatic pilot.
    You take time to ponder what your needs are and then focus on having them met.


    You give up on reeling with resentment and disappointment when others don’t meet
    your needs because you know they’re not mind readers and you must ask for what
    you want. If you need help or support with a project or a shoulder to cry on,
    you allow yourself to let go of any dysfunctional independent behaviour and ask
    for support and you are open to receiving it when it’s offered rather than play
    the martyr.


    You let go of any assumptions or judgments about people’s willingness to give
    because you recognise that one never knows what a person is capable of or willing
    to do until you ask them. Even if the first person you ask'
  - '[PAGE 73]


    says ‘No’ you learn not to interpret it as a personal rejection but accept that
    they just don’t have the support to give at the time and appreciate that they
    are in turn simply taking care of them self and so you are free to ask someone
    else.


    With self-care, you let go of the good girl role, people pleasing pantomimes and
    the guilt of saying, “No,” and, “Enough Already!” You know your boundaries and
    can stick to them or negotiate them depending on whether it might serve you or
    not. You become more aware of what I call the thieves and the big Ds in your life
    - the doubters and dimmers - people who doubt your ability, dim down your light,
    and steal your sparkle by playing down your success and making a big deal of small
    stuff that’s gone wrong.


    Then there are the dream stealers who try to talk you out of taking risks that
    they wouldn’t dream of taking themselves for fear of failure or fear of you succeeding
    and leaving them behind.


    Time thieves are people who for one reason or another take up more of your time
    and support than you have to give. To be fair, time thieves aren’t always people.
    It might be work, or a particular activity that’s becoming all consuming. Have
    you ever been on the web to check something out only to find that you’ve been
    sucked up in the surf and lost hours? Has it become a routine to stay late at
    the office to finish a task?


    Then there are the mood thieves. You bump into these people feeling great and
    leave them feeling down. But perhaps the most dangerous of the pack, and the ones
    requiring the most courage to challenge, are the'
  - '[PAGE 74]


    confidence thieves. Confidence thieves are often driven by envy and try to strip
    you of your self-esteem by their words or actions.


    Being aware of both time and energy draining people and activities in your circle
    of influence and learning to limit your exposure to them is essential for good
    self-care.


    Learning to nurture your-self, by spending time with people and activities that
    feed your soul builds energy and authentic confidence, and helps you to live a
    balanced and fulfilling life.


    I know from experience that not moving and working my body leaves me feeling uptight
    and out of balance so every morning I start my day with yogalates; a combination
    of yoga and pilates moves to set me up for the day ahead. I’m not saying I must
    feel like it, especially if I have an early appointment, but what I will say is
    that I feel the difference when I don’t do it. I’ve learned therefore to take
    a No Excuses approach to this daily self-care regime.


    My other self-care practices include ‘me time’ coffee breaks where I go out for
    a coffee on my own and appreciate the soothing feelings a latte provides me. I
    love going for walks in my local park and to have fresh flowers around the house
    especially in my office. Natural beauty inspires me.


    I’m not suggesting for a moment you live beyond your means. Self-care is about
    aiming to eliminate stress from your life and part of that is clearing any financial
    clouds that are looming over you. If you have done the'
  - '[PAGE 75]


    work in the previous chapters you''ve come to recognise your tolerations and developed
    some boundaries to help eliminate the stresses and strains that are undermining
    your confidence. Now I want you to consider how you might nurture yourself to
    authentic confidence. If you are thinking that such activities are selfish I invite
    you to consider another perspective.


    The Law of Responsibility will not allow you to take on great responsibility in
    life if you do not take care of your own needs. Your emotions and spirit need
    to be looked after, self-care is an investment in the health of your mind, body
    and spirit but more importantly your happiness. You''re not being selfish you
    are being ''self full'' and when you are ''self full'' it is much easier to give
    without feelings of resentment or sacrificing your own wellbeing. You deserve
    to be the best possible version of yourself and doing things that make you feel
