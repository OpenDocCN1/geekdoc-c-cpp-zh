    feed your soul builds energy and authentic confidence and helps you to live a
    balanced and fulfilling life.

    - The mind, body, spirit is one system learning to listen to your intuition, being
    aware of your energy and your feelings which is feedback from the body are all
    key to self-care.


    Grow Rich he points out that virtually all great people have had these qualities.
    They’ve been lifelong learners, patrons of the possibility virus and been persistent
    in the pursuit of their goals and in so doing built resilience and authentic confidence.


    Now I appreciate your mindset at the moment may be flawed with doubt and scepticism
    about what is possible for you, but your doubts are products of habitual thinking
    not accurate thinking. It may be that you have reached a plateau on the learning
    curve and rather than give in and up I urge and advise you to develop patience
    and persistence. Take it from me, doubt is what does the most damage.


    If you find yourself wondering, questioning, “Can I do this?” develop a Bob the
    Builder mentality and affirm to yourself, “Yes, YOU CAN!” Ditch the self-doubt
    because it feeds procrastination and delays action. If you are going to doubt
    something, doubt your limits. Decide to have a growth mindset, adopt a CAN DO
    attitude it’s the difference that will make the difference.


    ## Mindfulness


    Have you ever got in the car and arrived at your destination completely unaware
    of your journey? You are not alone. The mind tends to wander and can be captured
    by something that attracts its attention even when you are deliberately trying
    to focus on something. We can spend much of our life operating on automatic pilot
    reacting to people and situations without much thought or consideration.


    Mindfulness is a practice that nurtures a state of relaxed alertness, which helps
    you to relate directly to whatever is happening both internally and externally.
    It involves allowing yourself to be where you are and to become more familiar
    with your experience of thoughts and feelings moment-by-moment rather than getting
    caught up reliving memories or making forecasts about your future.


    So what’s all this got to do with confidence?


    With the practice of mindfulness you enjoy a feeling of being grounded; centred
    and having a sense of inner peace. Your powers of concentration and focus improve
    and you become more relaxed and trusting in your ability to handle things even
    when your confidence is wavering.


    Rather than allowing your emotions to run the show, you become more conscious
    of your thoughts and feelings. Instead of wandering mindlessly you wonder mindfully
    as you become curious about the signals your body is giving you in the form of
    thoughts and reactions to people and circumstances in which you find yourself.


    Mindfulness practice consists of different forms of meditation and movement. Since
    my early 20s I have found becoming mindful of my breathing to be most effective
    in helping me to feel more relaxed, focused and confident before exams, interviews
    and speaking engagements. Now 10 minutes of focused breath work throughout my
    day keeps me calm and confident.


    It’s best to do this exercise in a place where you are likely to be undisturbed
    and either lie down or sit upright in a chair. With practice, through time you
    will be able to take a martini approach to mindful breathing and do it any time,
    any place, anywhere.


    ## Exercise


    Once you are settled into position, take a slow deep breath in through the nose
    (say for a count of 3 - 5) then exhale through the mouth for a count slightly
    longer than the inhalation.


    Do at least ten rounds of this in the beginning and gradually increment in blocks
    of five until you reach about 20 minutes.


    If your mind wanders, that’s ok, just acknowledge your thoughts; you can say out
    loud or internally “thinking” and without judgment let them go and refocus on
    your breath.


    On occasions when I have been particularly anxious especially during the night
    I have found it helpful to say the following phrase:


    On inhalation, “All is well...” On exhalation, “...And all will be well.” Doing
    this has brought me to a place of deep relaxation and peace.


    There are various mindfulness meditations available in both book and digital format.
    I highly recommend anything by Jon Kabat-Zinn and offer details of his books and
    others for further reading in the resource section.


    ## ‘A’ right state or ‘the’ right state


    Having a growth mindset doesn’t stop you getting your knickers into a twist when
    you are faced with a situation that has the fear factor for you. It might be a
    speaking engagement, a date, an interview, a networking event or a party. Whatever
    the circumstances, your self-talk might be of a negative manner and you’re possibly
    picturing all sorts of disasters happening in your head.


    If a similar situation went wrong in the past then there is a good chance that
    you are still strongly associating with that situation and playing the fears forward.
    Now self-talk and mind movies are powerful skills but they become harmful if you
    are employing them unconsciously in a negative way to fuel fears that diminish
    your confidence. Think about what could happen if we started using these skills
    to work for you rather than against you.


    One of my clients was tormented by negative self-talk regarding a forthcoming
    sales pitch she was to make to a potential client. She spent many a restless night
    with that nagging, mocking voice ringing in her ears.


    > “Who do you think you are?”

    >

    > “You’re not experienced enough.”

    >

    > “They’ll laugh you out the door.”

    >

    > … blah, blah, blah, on and on it went.


    During our session, I asked Louise if she might tell me where the voice was located
    in her body. She replied it was at her right temple. I asked her to imagine a
    switch at the side of her head and asked her to turn the volume down. On doing
    so she said she felt a little better but the voice was still there. I then asked
    her to move the voice to the left temple and to soften the pitch and turn the
    volume way down low. She felt a lot better and when she moved the voice a foot
    way outside of her, Louise was able to critically assess the truth of these tormenting
    statements and realised they were nonsense. With this intervention, as well as
    some mindfulness exercises, she was able to make her pitch with ease and confidence
    and succeeded in making the sale.


    I worked with Louise to make changes to her auditory experience by changing the
    distance, tone and volume of the internal dialogue. You can do the same with negative
    images that you hold in your mind...


    - Put the movie on a big screen in your mind’s eye.

    - Run the movie in black and white.

    - Now turn it into sepia; that grey/brown colour like an old photograph.

    - Make it darker still and move it further away from you.

    - Take the movie out of focus slightly so that the images become unclear.

    - Now start to shrink the movie on the screen until it finally becomes a white
    dot.


    Doing this with your mind movie helps you to show yourself that the scenario is
    in the past and is not happening now and therefore will have less impact on your
    confidence.

