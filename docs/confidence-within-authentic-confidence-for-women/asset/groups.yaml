    # Exercise


    If you are carrying the burden of a belief ingrained in you from someone in your
    past – a parent, teacher, partner – it’s time to return the belief back to its
    source.


    The following exercise will help you do this. It works equally well for emotions
    and secrets without you having to disclose them.


    +   - Get very clear about what the belief is and the emotions related to it.

    +   - Mentally put the belief in a box and wrap it up.

    +   - Visualise the source of that belief – teacher, parent, sibling - standing
    in front of you.

    +   - Greet them and then say out loud, “This belief does not serve me or belong
    to me and I give it back to you, its source.”

    +   - See in your mind’s eye the person take the box.

    +   - Then say, “Bless you, now bless off,” and watch them and their belief box
    disappear.


    Limiting beliefs are the major culprits that prevent us from achieving our aspirations
    and living the life we desire. Buried deep in our subconscious, they are often
    tied into our self-image and our perceptions of the world. On the plus side, they
    are self-protective and survival oriented. On the negative side, they act as rules
    that keep us from attaining the possible, restraining us from what we are capable
    of and what we deserve.


    You see when a person states a limiting belief they are often focusing on what
    they don’t want (limitation), rather than what they do want (outcome). Limiting
    beliefs'
  - '[PAGE 56]


    can also sometimes confuse identity with behaviour. Unhelpful identity labels
    like ''I''m shy'' or ''I''m a slow learner'' imply that these are fixed qualities,
    rather than a combination of ideas, feelings and behaviours.


    A few years back sales was a dirty word to me. I hated it. Rather than focusing
