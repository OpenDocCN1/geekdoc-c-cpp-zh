  - '[PAGE 94]


    and understand spiritual law and appreciate it works indiscriminately, you become
    much more mindful of where you focus your attention, what you say and how you
    say it. It is this knowledge and understanding of the power of words that enables
    you to attract and affirm correctly.


    # So what exactly is an affirmation and why don’t they always work?


    Thought, word and deed are the three levels of creation. The Spiritual Law of
    Affirmation states that you bring about what you affirm, so if you think or say
    something enough times you will see it manifest in your physical reality. That’s
    because thoughts or words constantly repeated enter the unconscious mind and become
    part of your programming.


    Most people are not mindful of their thoughts and self-talk, without realising
    where their focus is they are constantly using the Laws of Attention and Affirmation
    to attract more of what they don’t want into their life.


    You see the unconscious mind is like a computer, and accepts all input without
    discrimination, it doesn’t compute negatives it simply ignores them. Now, I was
    reminded of this teaching recently, not being mindful of my language or thoughts
    I was affirming that, ‘I don’t want to live in this apartment anymore’, which
    was entering my unconscious mind without the ‘don’t’ as ‘I want to live in this
    apartment’. Months and months went by without a property of interest appearing
    on the market. When I became aware of what I was doing I changed my affirmation
    to, ‘I’m ready to move’, and started clearing'
  - '[PAGE 95]


    <!-- no content -->'
  - '[PAGE 96]


    Affirmations, which are rhyming or rhythmic, slip into your unconscious mind easily.
    The following example is an affirmation for instilling self-confidence and self-honour
    and is from Diana Cooper’s book, _A Time for Transformation_.


    > > **_‘Calm and centred, quiet and still. I love myself and always will’._**


    An affirmation is not based on what you know now it is something you grow into,
    so when you affirm you must believe that what you are saying is possible for you.
    Affirmations must not threaten any belief, which outright denies present experience.


    _For example_, if you are currently affirming ‘I’m a millionaire’ when you are
    in dire straits financially it’s too much of a leap for the mind to make and you’re
    likely to hear a little voice say, “Come on now, who you kidding? Get real!”


    What is needed is the kind of affirmation that will enable the mind to be intrigued
    and which doesn’t fly in the face of current reality. An example might be, ‘The
    Universe is the source of all my supply’, or, ‘I am the centre of abundance. I
    am a magnet of prosperity’. Rather than resistance, you are more likely to get
    a, ‘Mmm that’s interesting, let’s see what happens now’, response from the mind.
    After several repetitions you will begin to feel more at peace and trusting, as
    well as better able to focus on the new belief.'
  - '[PAGE 97]


    # **Ask and you shall receive**


    Noah St. John, Success Mentor and author of *The Great Little Book of Afformations*
    suggests rather than making a statement you don''t believe, ask yourself a question.
    By doing so your mind automatically begins to search for an answer without your
    conscious volition. The trick is to ask empowering questions rather than disempowering
    questions.


    Disempowering questions come from a place of fear, focus on what you lack and
    what''s wrong with you. They speak from your pain making you feel yucky and stuck
    because as the Law of Attraction states what you continually focus on will grow
    and bear fruit.


    Read the following questions out loud:


    +   - Why am I so unhappy?

    +   - Why don''t I have enough?

    +   - Why am I so lonely?''


    Feeling good? Didn''t think so!


    Now for the next few hours I want you to listen to what you say to yourself when
    you talk to yourself. Sit with this for a bit, you might even want to leave completing
    the following exercise for a day or two, during that time just be mindful of ''the
    voice'' what it''s saying and how it''s saying it. When you are ready answer the
    following question on the next page:


    When you talk to yourself what are three disempowering questions you ask?'
  - '[PAGE 98]


    Empowering questions on the other hand lead your mind to focus on what you have,
    what’s right about you and come from a place of power.


    Read these questions out loud:


    +   - Why am I so successful?

    +   - Why do I have enough?

    +   - Why am I loved so much?


    Did you notice the intriguing pause and how quickly the mind jumped from confusion
    to questioning to seeking clarity and confirmation? Did you notice the, ‘Mmm that’s
    interesting’, thought coming into play? Are you thinking more positively? Feeling
    good about yourself?


    Now reverse the negative questions you wrote above to positive ones.


    Remember to ask these questions of yourself on a regular basis, you may want to
    write them out on card and put them in places where you can regularly look at
    them.'
  - '[PAGE 99]


    Confident behaviour comes from hidden, unconscious assumptions about how life
    is going to treat you. When you think life is on your side you take action from
    a place of faith believing that things will work out for the best and the results
    will naturally follow. When you come from a place of fear or lack, your expectations
    are negative and the results you get will meet your expectations – it’s universal
    law.


    The point of this method is not to find the answer to your question but to change
    what your mind automatically focuses on and to take action based on your new assumptions
    about life. So mind your language both internally and externally, when you hear
    yourself make negative statements or questions turn them in to positive affirmations
    or empowering questions.


    Whilst, I do believe your word is your wand. I think it’s also important to remember
    thought, word and deed are the three levels of creation. I didn’t just affirm
    myself in to the role of Principal Teacher of Guidance. I spoke about my aspirations
    within my professional network and I got the necessary experience by taking on
    a pupil caseload. I attended training courses, engaged in professional reading
    and dialogue with colleagues and was mentored by an experienced Principal Teacher.


    However, I do believe that the constant repetition of the above phrase and talking
    with others about my aspirations, created opportunities for me and helped me believe
    it was only a matter of time before it happened.


    I still use affirmations today but I always back them up with appropriate action.'
  - '[PAGE 100]


