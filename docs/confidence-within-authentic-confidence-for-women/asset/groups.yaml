    The following exercise will help you to cut the cords and move on. You will need
    some notepaper, a pen, a white candle, some red ribbon, a safety pin, a pair of
    scissors and a photo of the person you wish to be released from.


    Read the instructions through a couple of times before you complete it. Set aside
    a couple of hours for this and again set yourself up in a quiet environment where
    you will not be disturbed.


    ## Exercise


    When you are ready light the candle and begin by writing down all the things that
    the other person did or said that hurt you. Now you will cry, you may get angry
    and punch a cushion or two, you may even throw in a little swearing, but that''s
    OK, better out than in, get it all down on paper. When you are feeling there''s
    nothing left to write, just pause, take a deep breath in, then start to think
    about the good things this person brought into your life, the times you laughed,
    the gifts they gave, all the good stuff, write it down and give thanks for it.


    When you''ve finished, place their photo in the paper, roll the paper up and tie
    it with the red ribbon. Make sure that there is enough ribbon hanging from the
    scroll for you to attach it to yourself with the pin.


    Holding the scroll in one hand and the scissors in the other, say the following:


    > *''Dear ...*

    >

    > *I forgive you for all the pain you have caused and ask that you forgive me
    too.*

    >

    > *I thank you for all gifts of insight and learning you gave me.*

    >

    > *I now release you with love.''*


    Cut the red ribbon tied between yourself and the scroll and burn the scroll wrapped
    in its ribbon. If you wish, you may keep the ribbon and pin attached to you as
    a keepsake of the purification and release of your relationship or just burn that
    too.


    All of the exercises I''ve shared in this chapter are cleansing and powerful,
    but you may find that some experiences are easy to let go of whilst others linger,
    so do these exercises regularly until you find your anger and resentment has dissolved.


    Now that you have unpacked the baggage from the past and hopefully cleared some
    of it, we are ready to move forward into the present and look at your belief system,
    but before we do, let''s summarise what''s been covered so far.


    ## Summary


    - Our past can’t be changed but it can be used to inform our future.

    - If we wish to grow in authentic confidence, we have to pause and reflect and
    uncover the recurring themes that keep popping up in our life and the underlying
    lessons to be learned from them. Once you recognise the theme and learn from it
    you can stop that pattern, create and learn a new, more helpful pattern.

    - Forgiveness isn’t about condoning what happened, it’s about acknowledging it,
    seeing past it, being willing to let go of the pain it caused and move on. The
    word forgive means to ‘give for’; you are giving for the purpose of being free.

    - Authentic Confidence requires for you to tell the truth to yourself about yourself.

    - If the negative energy from experiences and emotions are not expressed they
    stay within where they can do varying degrees of harm but they can be released
    through physical and spiritual exercises to allow one to return to a state of
    health and well-being.

    - Self-love is expressed in our self-worth, which shows a deep appreciation for
    our gifts, skills and talents and an expectation of the same level of respect
    for our blessings from others.


