    to look at our reaction to the situation or circumstances. Have we chosen to play
    the helpless victim and dwell in our despair or did we respond by taking appropriate
    action? By reflecting on and reviewing our patterns of response we can become
    aware of our personal accountability for employing a victim mindset and our responsibility
    also to find alternative responses that will serve us better in the future and
    allow us to step up and in to our power.


    Awareness is the first step in healing or changing, unpacking the baggage from
    our past so that we can understand it and make friends with it. Awareness will
    lighten its load and liberate us from the chains of pain so that it no longer
    affects but informs our future.


    The work you will do in this chapter will require strength. It will require you
    to dig deep in to the wounds within so that they can heal. It will also require
