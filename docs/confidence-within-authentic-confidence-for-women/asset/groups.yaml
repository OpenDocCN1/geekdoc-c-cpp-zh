    +   - I am now recreating myself, one positive belief at a time.

    +   - Every day I replace past limiting beliefs with new empowering ones.


    # ## Confidence


    +   - Absolute authentic confidence blesses every day of my life.

    +   - Every day I am become more and more self-assured.

    +   - Everything I do is right for me.


    # ## Commitment


    +   - Absolutely nothing can stop me from realizing my dreams.

    +   - All of my actions support my intentions.

    +   - I am always true to the commitments I make.

    +   - I am committed to becoming the best I can be.

    +   - I can do it, I am doing it!


    # ## Desirability


    +   - I love and approve of myself, I deserve the very best in life and I am open
    to receiving it.

    +   - Every day I appreciate myself more and more.


    # ## Love


    +   - I know that I deserve love and accept it now.

    +   - I give out love and it is returned to me multiplied.

    +   - I rejoice in the love I encounter everyday.'
  - '[PAGE 103]


    # ### Self Esteem


    +   - When I believe in myself, so do others.

    +   - I express my needs and feelings.

    +   - I am my own unique self - special, creative and wonderful.

    +   - By loving myself, I allow others to love me as well.


    # ### Trust


    +   - I release the past and now embrace a trusting attitude.

    +   - I trust myself and I trust in the process of life.

    +   - Life supplies all my needs in abundance, I trust in life.

    +   - I trust my vibes.


    # ### Uniqueness


    +   - I accept my uniqueness.

    +   - I am perfect exactly as I am, I celebrate and honour my uniqueness.

    +   - Freedom is mine when I express my individuality.'
