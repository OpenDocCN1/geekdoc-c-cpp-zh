    voice it will find it’s way to express itself in a torrent of rage at an inappropriate
    time or in the body through cuts and burns, burning sensations, boils and inflammation.
    Louise Hay’s *‘You Can Heal Your Life’* and Debbie Shapiro’s *‘Your Body Speaks
    Your Mind’* are excellent books for helping to understand how emotions link to
    illness or imbalances in the body.


