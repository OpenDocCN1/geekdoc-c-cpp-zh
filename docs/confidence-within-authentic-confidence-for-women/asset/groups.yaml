  mdcn: "\n我们的自信水平。我们很少质疑自己的信念，因为我们在存在的核心深处将它们视为真实。真正的自信让我们能够通过质疑并揭示我们对自己、他人和世界所持信念背后的真相，以及审视我们所作的概括和我们扭曲或删除的信息，来发现信念中的任何谎言。\n\
    \n当我们对自身可能做到什么、实现目标的能力，以及或许最令人担忧的——自己是否配得上它，持有无益的信念时，我们的自信就会受到挑战。这些信念常常来自他人告诉我们的内容或他们对我们的期望的影响，例如媒体、父母、老师、同事、老板和伴侣。\n\
    \n假设你有几段以糟糕方式结束的感情。你可能会逐渐相信自己在经营感情方面很糟糕（概括化）。事实上，可能还是前任伴侣这样告诉过你，而这只会强化这一信念。不过，我相信也曾有过你们双方都快乐、一切顺利、感情美好的时光（删减）。你还拥有与朋友、家人和同事之间令人满足的其他关系。\n\
    \n到现在，你正在了解自己的思维如何可能被扭曲。我想说的是，你目前还没有一套有效且成功的策略来经营恋爱关系。幸运的是，这一点可以被探索和发展，直到你能够享受一段令人满足的关系。对于任何你渴望、但目前认为遥不可及的事物，都是如此。除非你挑战限制性信念，把“做不到”的态度变成“能做到！”，否则你永远无法实现它。\n\
    \n## 练习\n\n如果你背负着过去某个人——父母、老师、伴侣——深深植入你内心的一种信念所带来的负担，那么是时候把这个信念归还给它的源头了。\n\n下面的练习将帮助你做到这一点。它同样适用于情绪和秘密，而且你无需将它们披露出来。\n\
    \n- 非常清楚地知道这个信念是什么，以及与之相关的情绪是什么。\n- 在脑海中把这个信念放进一个盒子里，并把它包起来。\n- 想象这个信念的源头——老师、父母、兄弟姐妹——站在你面前。\n\
    - 向他们问好，然后大声说：“这个信念对我不再有帮助，也不属于我，我把它归还给你——它的源头。”\n- 在心灵之眼中看着那个人接过盒子。\n- 然后说：“祝福你，现在祝福并送走吧。”看着他们和他们的信念盒子消失。\n\
    \n限制性信念是阻碍我们实现抱负、过上渴望生活的主要罪魁祸首。它们深埋于我们的潜意识中，常常与我们的自我形象和我们对世界的感知紧密相连。从积极的一面看，它们具有自我保护性，并以生存为导向。从消极的一面看，它们像规则一样起作用，阻止我们实现可能之事，限制我们发挥能力、获得应得之物。\n\
    \n你看，当一个人陈述一个限制性信念时，他们往往关注的是自己不想得到的东西（限制），而不是自己真正想要的东西（结果）。限制性信念有时还会把身份与行为混为一谈。像“我很害羞”或“我学东西很慢”这类无益的身份标签，暗示这些是固定不变的特质，而不是想法、感受和行为的组合。\n\
    \n几年前，销售对我来说是个忌讳词。我讨厌它。我没有把注意力放在自己达成的销售上，而是放在被拒绝上，这最终发展成“我不擅长销售”的限制性信念。当我和我的NLP训练伙伴本——一位出色的销售员——一起探索这个信念时，我经历了一个打破信念的顿悟时刻。\n\
    \n我向本解释说，我喜欢结识人们，喜欢和他们谈论我能如何帮助他们以及我如何工作，但我总是对自己眼中的“又到销售环节了”感到非常不舒服。\n\n本和我进一步探索，讨论“我不会销售”这个信念如何为我服务，以及它是否真实。看看事实——我拥有稳定的咨询和教练工作流，并有回头客。我的新闻简报和在线社群有一大批订阅者。我还有一个庞大的GROW订阅者数据库，GROW是我的社交网络业务，每次活动都有相当多的企业主参加。我开始看到这个信念并不真实，它是一个谎言——证据证明了这一点。这个信念只不过是一种保护机制，让我免于面对我害怕的拒绝。\n\
    \n如果你听到自己使用或听到“不能、应该、不应该、可以、不可以、会、应当或不应”这样的词，那很可能有一个限制性信念潜伏在周围。留意你的语言，因为一旦你意识到它，你就能对此采取行动。\n\
    \n确保用积极的方式表述新信念，并让你对自己感觉良好。\n\n例如：我擅长经营关系。我能够销售。我是一个成功的社交网络者。\n\n## 整合新信念\n\n\
    想象当你持有这个新信念时，事情会如何不同。你会做什么、说什么？你会有怎样的感受？\n\n你的信念改变能否成功，关键在于更加了解你的*影响圈*。你的影响圈是指过去和现在影响过并正在影响你信念体系的人。如果一个信念来自你的成长环境或教育背景，那么这就是你被教导去相信的东西，只是一种程序设定。关于这些信念，你要问自己的关键问题是：“它今天对我仍然成立吗？”\n\
    \n至于目前在你生活中的人，要留意他们如何对待你，仔细倾听他们如何与你交谈、如何谈论你，以及他们一般如何谈论这个世界。他们的信念如何影响你？他们对你的自信有积极影响吗？他们支持你吗？如果没有，请记住你有选择。你可以容忍，也可以清除那些消耗你自信的人：那些偷走你自尊和自我价值的小偷。你可以通过减少与他们相处的时间，或认定他们不再值得在你的生活中占有一席之地来做到这一点。不要惊讶，一旦你改变了自己的信念，他们似乎就从你的生活中消失了，因为在能量层面上，他们对你的力量和影响已经消失了。\n\
    \n## 总结\n\n- 我们可以从生活中的任何经历中创造一种意义，这种意义要么赋予我们力量，要么阻碍我们。\n- 我们的信念是经历的结果，但我们只关注经历的某些维度：为了防止感官超载，我们会删除和扭曲接收到的信息，也会作出并不总是有用的概括。\n\
    - 当我们对自身可能做到什么、实现目标的能力，以及或许最令人担忧的——自己是否配得上它，持有无益的信念时，我们的自信就会受到挑战。\n- 当一个人陈述一个限制性信念时，他们往往关注的是自己不想得到的东西（限制），而不是自己真正想要的东西（结果）。\n\
    - “不能、应该、不应该、可以、不可以、会、应当或不应”这样的词，往往表明有一个限制性信念潜伏在周围。\n\n## 第4章——自我珍视的重要性\n\n> “将我们从他人的期望中解放出来，把我们归还给我们自己——自尊的伟大而独特的力量就在于此。”\
    \  \n> ——琼·狄迪恩\n\n自我珍视是真正自信的核心，它意味着把正确的事情安排到位，让自我关怀和自信得以茁壮成长。自我珍视意味着触及你存在的本质，学会爱并尊重你作为女性本来的样子。它意味着放下那些制造“我不够好”感受的错误思维，并从你的生活中释放自我牺牲的模式，甚至释放那些消耗你的人，这样你才能摆脱阻碍你的容忍与剥削。\n\
    \n自我珍视让你从侍女般等待的例行模式中解脱出来，挺身而出，走进自己的力量，这样你就不再是环境的受害者，而是胜利地过上幸福而丰盛的生活。你在前几章中完成的工作，会揭示你生活中反复出现、削弱你自信和自尊的主题。你会已经意识到限制你的信念，或许还有行为模式。现在，是时候重新学习给予和接受的艺术了，这样你就能付出而不放弃自我，重新更好地看待自己的技能和才华，并学会信任自己的内在智慧，而不是寻求他人的认可或肯定。为了做到这一点，你必须意识到自己目前正在容忍什么。\n"
