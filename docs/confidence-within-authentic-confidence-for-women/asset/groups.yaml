  mdcn: "\n宽恕可以被用来占据道德高地——让自己比敌人或做错事的人更高尚。真正的宽恕是“宽恕并遗忘”，是消除对曾施加于你的过错的所有情感依恋，放下记忆和伤害，就好像它从未发生过一样。\n\
    \n“必须正确”的需要可能成为宽恕的巨大障碍。正确可以给人安全感，但“必须正确”的需要会破坏关系，并且常常掩盖不安全感。真正的宽恕是放下对正确或错误的需要——始终如此。\n\
    \n报复的需要，或把他人从我们的生活中切断、排除出去的欲望，在怨恨酝酿发酵之时，起初会更容易，但可能导致孤独和疾病，直到我们的伤痛或愤怒消退。与那些感受共处，接纳你所感受到的是可以的，因为它们是你的某项价值观遭到侵犯时的反应，这可能会更有帮助。正是这种接纳，促进了放下的过程。\n\
    \n在这里做什么以及它究竟是为了什么。与恐惧等负面情绪对话，能帮助我们培养健康的谨慎感；倾听我们的愤怒并加以处理，会化解挫败感，并培养一种对生活的热情——如果我们不曾寻找其中的教训，可能就会错过这种热情。当我们理解自己无益的想法和感受时，我们就不再抗拒，并准备好释放。\n\
    \n## 身体释放\n\n如果来自经历和情绪的负面能量没有得到表达，它们就会留在体内，造成不同程度的伤害。以愤怒这种情绪为例，它在情绪方面饱受诟病，已经有点成为一种禁忌。然而，愤怒本身没有错，它是一种完全自然且可接受的情绪；可能引起担忧的是它被表达的方式。如果愤怒没有得到安全的表达渠道，它就会找到自己的出口：在不恰当的时候以狂怒的洪流表达出来，或者在身体上通过割伤和烧伤、灼烧感、疖子和炎症表现出来。路易丝·海的*‘治愈你的生活’*和黛比·夏皮罗的*‘你的身体会说话’*是极好的书，能帮助理解情绪如何与疾病或身体失衡相关联。\n\
    \n我发现以下从身体上释放经历和情绪的方法真的很有帮助。\n\n允许自己去触碰你的痛苦，让眼泪流出来。我以前对此颇感困难，我想是因为我相信眼泪是软弱的标志，而且“大女孩不哭”——可她们会哭，也应该哭；我在理智上知道这一点，但在情感上，我需要另一个借口来流泪，所以我会去看电影*《继母》*，它讲述一位前妻和她两个孩子的故事，以及他们如何接受新妻子。朱莉娅·罗伯茨饰演继母，苏珊·萨兰登饰演两个孩子的生母；这位生母身患癌症，即将离世，并要接受把自己的孩子托付给一个她并不太喜欢的女人。我觉得看这部电影不可能不哭——它对我来说有点像水龙头，我可以打开它，让眼泪流出来。如果你很难让眼泪流出来，不妨试试这个练习；当然，电影不一定是*《继母》*，但必须是一部好的催泪片。\n\
    \n如果情绪是愤怒——当然，在车窗摇上的车里好好尖叫一场是很好的释放方式，朝枕头打拳也是；如果你喜欢健身房，有氧拳击课也很棒。就我个人而言，我发现跑步对我有效，但我认为任何能消耗血管中奔涌的多余肾上腺素的运动都会有益。\n\
    \n怨恨是持续很久、远远超过最初经历的愤怒。当我们心怀怨恨时，我们充满责备，不承担责任，而是把“我们正确、别人错误”的需要揽到自己身上。通过释放这种需要，我们收回促成改变的力量，而不是成为他人残忍的受害者。只要你对某种处境或某个人生气，那个人或那种处境就对你拥有权力。\n\
    \n宽恕过程中很好的第一步，是尝试洞察对方那样行事背后的动机。下面的练习是一种极其有效的方法。当你设身处地站在别人的立场上，你会觉得自己更了解他们。\n\n\
    ### 练习\n\n在地板上标出三个不同的位置，编号为1到3。每个位置都有不同的功能，并让你获得不同的视角。\n\n- 在第一个位置，你将通过自己的眼睛向外看。\n\
    - 在第二个位置，你将成为另一方，设身处地站在他们的立场上，想象对他们来说是什么感觉（如果同样可行，这可以是1个人或一个群体）。\n- 第三个位置涉及采取独立视角，你可以退后一步，更冷静地观察双方。\n\
    \n选择一段你想探索的关系。\n\n- 站在位置1，想象自己看着对方。问自己：“当我看着这个人时，我正在经历什么？我在想什么？感受什么？等等。”\n  -\
    \ 提出你可能想问那个被你放在位置2的人的任何问题\n  - 把这个位置甩掉！\n- 走到位置2，想象你就是那个人，回看处于位置1的你。然后再次问自己：“当我看着这个人时，我正在经历什么？我在想什么？感受什么？等等。”\n\
    \  - 回答任何向你提出的问题。\n  - 把这个位置甩掉！\n- 移动到第三个位置，观察情境中的两个人，并问自己：“我正在经历什么？我在想什么？感受什么？”当你看着位置1的那个人时，你看到了什么？\n\
    \n想一想你在三个位置上的想法和感受有何不同。\n\n- 回到并重新体验第二个位置。问自己：“现在有什么不同？什么改变了？”最后回到第一个位置，问自己：“现在这有什么不同？什么改变了？”\n\
    \n既然你已经洞察到对方为什么那样行事，你就更有能力宽恕和放下。那么现在：\n\n- 想象那个人坐在你面前。对那个人说：“我原谅你……”并想象好事发生在那个人身上。对那个人说：“愿生活最丰厚的祝福属于你。”\n\
    \n你可能会觉得这很难做到，但要坚持做，直到你释放了怨恨。\n\n现在把注意力转向自己，大声说：“我原谅自己……”并坚持做，直到你感觉更轻松。\n\n##\
    \ 能量释放\n\n你可以在生活中拥有任何你渴望的东西，但如果你的幸福和自我价值感**依赖**于拥有它，那么你就通过能量绳索与它相连。骄傲、嫉妒、需求和贪婪等负面能量，会向房屋、汽车、金钱和工作等事物和对象伸出巨大的绳索。\n\
    \n当我被裁员时，我在灵性依附法则上得到了相当深刻的教训。那时，我是个物质女孩，完全沉迷于自己的头衔、金钱能为我买什么，以及它能带我去哪里度假。我完全沉迷于所谓的“财富的外在装饰”。\n\
    \n如今，拥有金钱和好东西并没有错，但我发现，当我失去工作时，我不仅失去了财富的外在装饰，也失去了与之相关的身份认同感。对这些事物的依附在我失去它们时引发了我的信心危机，但当我意识到正是同一件事帮助我重新发现不依赖地位、财务或情感需求的真实自信时，这种失去变成了一种发现。\n\
    \n人与人之间如果存在未解决的问题，也会形成绳索。依附法则教导说，无论你依附的是谁或什么，他们或它都能控制和操纵你。每当你向某人发送愤怒、羡慕或嫉妒的想法或话语时，你就会显化一条线，附着在他们身上。你也可以通过对他们的爱或认可的需求，把自己依附于某人。偶尔的积极想法可能会化解它，但如果你持续发出\n"
