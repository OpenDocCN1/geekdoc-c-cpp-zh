    achieving. The right amount of confidence allows us to answer the door to opportunity
    when it knocks and knock on doors when they are closed. Even if the doors are
    shut in our face, confidence allows us to try another door or walk a completely
    different path.


    ## Foe


    There are times however, when we can be overconfident in ourselves and in our
    abilities and this can lead to arrogance, complacency and even recklessness. Considering
    yourself more intelligent, more skilled or more competent than a fellow team member
    is arrogant. Not preparing sufficiently for an interview you think is in the bag
    is reckless. Speaking to or treating your partner inappropriately, because you
    think he’ll never leave you, is complacent.


    ## Master of disguise


    A lack of confidence can also be acted out and interpreted as aloofness and even
    aggressiveness as we employ strategies to protect ourselves from showing our weaknesses
    and minimise our discomfort.


    It’s not uncommon for a shy person who runs an internal script of ‘why would they
    want to talk to me’ to be thought of as rude or anti-social. They come across
    as unapproachable. They avoid eye contact and are unable to engage in general
    chit-chat. Yet, inside they are dying with discomfort and desperately wanting
    to be something different; a confident conversationalist.


    Not everyone who lacks confidence is shy. Until recently I would have included
    myself in that group. I was able to stand in front of large audiences and give
    presentations, yet at the same time suffer from the Imposter Syndrome fearing
    I would get caught out because my confidence lagged behind my competence.


    The Imposter Syndrome is a widespread phenomenon identified more than 30 years
    ago by clinical psychologists Pauline Clance and Suzanne Imes. It defines and
    describes feelings of being inauthentic in your role, feeling unworthy of the
    recognition or compensation you receive; you feel like a fraud. The consequences
    of these feelings are many: not voicing your opinions or sharing your ideas, not
    asking for a raise or promoting yourself. These behaviours can fuel failure and
    frustration, emotionally strangling sufferers and derailing their career because
    they won’t give themselves the permission to discover and demonstrate the leader
    within.


    On the other end of the spectrum, instead of acting passively, some women adopt
    a more masculine approach and become overly aggressive. In the 2011 series of
    *The Apprentice*, one of the contestants, Melody Hossaini, in an interview at
    the end of the series commented that a key learning for her from participating
    in the programme was that when she felt vulnerable she became very aggressive;
    a self-protection mechanism to hide her lack of confidence. She now realises that
    becoming comfortable with her vulnerability and being able to show and express
    it would have worked more in her favour than her ‘kick-ass’ approach.


    When I ask women what confidence means to them, their responses are pretty similar
    and include:


    - ‘to be my authentic self’

    - ‘believe in myself and abilities’

    - ‘feeling good about myself’

    - ‘being able to do what I want’

    - ‘the ability to deal with anything that comes my way personally and professionally’

    - ‘to REALLY feel comfortable – not fake it’.


    Self-help gurus often advocate ‘faking it till you make it’ but I think that advice
    should come with a warning. Don’t get me wrong. Affirmations and modelling the
    behaviour of someone who has what you want can be effective in helping you acquire
    the mindset necessary to attract that skill or quality into your life, but only
    if you really believe what you are telling yourself is possible for you.


    We’ll do some work on beliefs and affirmations later in this book but right now
    just be aware that simply saying something doesn’t necessarily make it true or
    happen. Very often we have behavioural patterns that are so ingrained and powerful
    that at a very basic level contradict the words we are mouthing.


    Energetically speaking, you won’t feel comfortable or be congruent with your words
    and that will come across loud and clear, not only to others, but also more importantly
    to yourself. You’ll feel like a fraud as your fear of being found out feeds a
    spiral of self-doubt, which in turn reduces your self-esteem and locks you into
    a place where your confidence lags behind your competence. This gap is not just
    one of fear or even procrastination but one of self-destruction; lost to yourself
    and the life you are meant to live.


    ## As Within, So Without


    There is a saying ‘As Within, So Without’. This is a summary of the spiritual
    Law of Reflection, which states that our outside world is an exact reflection
    of our inner world. The Universe mirrors and reflects back to us all the good
    and bad, positives and negatives within ourselves and our lives.


    If you doubt your ability or don’t value your skills and talents, you will attract
    people who will steal your ideas, take credit for your work, play hardball and
    slash your fees. If you are self-critical and constantly beating yourself up with
    your thoughts, you will attract people who will reflect this by putting you down
    with verbal, psychological and possibly physical abuse. If you don’t love and
    respect yourself, how can you expect that from others?


    ## Authentic Confidence


    We know authentic confidence when we see it. There is something about the person
    that tells us they are very comfortable with who they are. They know, like and
    trust themselves. Their essence is one of ease and positive expectation, trusting
    that they can handle whatever life throws at them. They operate from a place of
    faith rather than fear, because they understand themselves and are open to understanding
    and appreciating the perspective of others without feeling threatened or the need
    to be right.


    In my mind, the foundations of authentic confidence are contained within what
    I call the 3 C’s of confidence – Clarity, Communication and Courage.


    ### Clarity


    When you are clear about who you are and what you value, what you want to give
    back to life or give life to; your purpose, a passion or a project, then attracting
    it into your life becomes so much easier. Clear thinking affords you the ability
    to be decisive, communicate your message accurately and enables others to respond
    accordingly.


    ### Communication


    When you are able to communicate clearly in a way that respects and honours you
    and others, when you have the courage to trust your innate wisdom, to follow your
    convictions and take action, which moves you from a feeling of being lost and
    stuck to one of freedom and fulfilment, that’s authentic confidence.


    ### Courage


    With authentic confidence, you no longer give your power away by pleasing and
    appeasing other people. Your value and self-worth isn’t wrapped up in others’
    opinions of you, so you no longer feel the need to sacrifice yourself or seek
    others’ approval or permission to be, do and have what you want. You may seek
    advice and guidance but you don’t act on it until you check within to ensure the
    advised action feels right with and for you.


    When you hear that inner wisdom, you will be ready to take the first small step
    forward. Authentic confidence doesn’t mean that you won’t feel fear about taking
    that step, but what it does mean is that you have enough trust in yourself to
    face any challenge that initial step may present, and remember it’s the doing,
    the action that builds competence.


    With authentic confidence, you are free to be you, happy with yourself and by
    yourself if you so desire. Your masculine and feminine aspects are in balance,
    so that you can be strong without being threatening or aggressive and vulnerable
    without being or appearing weak. And, because you are being your authentic self,
    your attraction factor increases and you draw to you all the resources, support
    and nurturing you need. Your inner integrity is matched by those around you. As
    you begin to feel safe, secure, loved and happy on the inside, you learn to trust
    yourself, and the universe reflects this by surrounding you with people who love
    and support you and are as honest and generous as you are. As within, so without.


    The 9 Elements of Authentic Confidence woven through the chapters of this book
    are:


    - Awareness

    - Understanding

    - Truth

    - Honour

    - Energy

    - Nurturing

    - Trust

    - Intuition

    - Commitment

