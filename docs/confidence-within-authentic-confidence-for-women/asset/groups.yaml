    confidence looking for the truth within our beliefs and uncovering any lies they
    may hold within them.


    # ### How the brain manages our experiences


    To prevent sensory overload we pay attention to certain dimensions of our experience
    and exclude others. What is deleted is out of our conscious awareness. Now this
    can be useful or not, depending on the application.


    *For example, when you are concentrating on a task* in a busy office you can delete
    the noise surrounding you and focus on the task in hand. That''s when deleting
    is useful. Sometimes it''s not useful when you hear only criticisms and none of
    the compliments.


    When Laura came to see me she was very down and stressed about her career in the
    Fire and Rescue service. She was concerned about feedback she had received about
    her performance and in particular her ability to work in a busy environment often
    being teased by her colleagues as ''zoning out''. When we looked over Laura''s
    CV and her annual appraisal documentation we discovered that things were not as
    bleak as she had come to believe. Firstly, she had failed to acknowledge to herself
    that she was on a learning curve for a new career and wouldn''t be expected to
    know it all. She had been in the fire service less than 2 years having previously
    spent 10 years in a library. When she recognised that the ''zoning'
