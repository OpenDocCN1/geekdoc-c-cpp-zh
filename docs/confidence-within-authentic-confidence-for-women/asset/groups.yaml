    - 我想要什么？

    - 在这种情况下，对我来说做什么才是正确的？

    - 我在牺牲什么？在这种情况下牺牲感觉可以吗？这样做合适吗？

    - 现在对我来说最重要的是什么？


    ## 采用以内心为中心的方法做决策


    在做决策时，不要只凭头脑思考，而要像歌里唱的那样，“倾听你的内心”。独自去一个安静的地方，通过深呼吸让自己安定下来。一旦你感受到深沉的平静，就可以问自己以下问题：


    - 在做这个决定之前，我需要知道什么？

    - 对我来说，处理这种情况的最佳方式是什么？

    - 我现在必须做什么？


    保持静止和耐心，相信答案会浮现。


    ## 委派他人


