    # Permission


    From a very early age we are taught to ask for ‘permission’ before we take action,
    for example permission to ask a question in class, permission to leave the table,
    permission to stay out late or go on a date. If what we want to have or do, will
    significantly affect others around us then it is reasonable for us to seek their
    permission before proceeding. But many times we consciously, or unconsciously,
    seek permission from others because we are not sure it is ‘OK’ for us to have
    or do what we want or because we feel we do not "deserve" what we want.


    Sarah has a passion for shoes and bought a pair of Jimmy Choo’s. She has a great
    social life and attends many balls and fancy functions but she never wears her
    Choo’s. Instead she keeps them in a box in her wardrobe and occasionally takes
    them out to admire them or for a walk around the carpeted floors of her home.
    Whilst Sarah has given herself permission to buy expensive and beautiful things
    she hasn’t given herself permission to actually enjoy wearing the shoes and risk
    damaging them even though she could she could probably afford to buy another pair.


    Alison came from a family of teachers but since her early teens she had dreamed
    of running her own business but had gone straight in to teacher training as a
    safe employment option after graduating from university. She swiftly worked her
    way up the ladder to headship of a primary school and whilst she was very good
    at her job and it was rewarding enough, she still felt unfulfilled and harboured
    dreams of entrepreneurship. Alison held herself back from taking the big leap
    for fear of leaving her'
  - "[PAGE 109]\n\ncomfort zone and failing. No one was telling her she ought to live\
    \ her dream and because she was unable to give herself permission to experiment\
    \ with her life, change career and start her own business she remained unfulfilled\
    \ in teaching.\n\nWhat these real life examples demonstrate is that while we may\
    \ know what we want to do and have in our lives, we often find ourselves drawn\
    \ to look outside ourselves for the permission to pursue it or the permission\
    \ that says that we are good enough. The problem with seeking permission from\
    \ others is that it robs you of your own personal power and your full potential.\n\
    \nGiving yourself permission is just a matter of making a decision. Go within\
    \ and listen to your inner wisdom, get a sense of what it’s telling you, check\
    \ in with your feelings. Be mindful of the language you use when you talk about\
    \ the decision to be made because these are clear indicators of whether you should\
    \ be making a decision in the moment or not.\n\nI have personally found it very\
    \ helpful to follow the advice of one of my mentors David Neagle, Success and\
    \ Wealth Consciousness Coach, who offers four questions for your reflection.\n\
    \n+   1. **Is this opportunity something that I want to be, do or have?**\n+ \
    \  \n+   A simple yes or no answer is all that is required to this question. If\
    \ you want the opportunity then you move on to question two otherwise the decision\
