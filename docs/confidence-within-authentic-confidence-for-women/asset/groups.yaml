  - "[PAGE 86]\n\n# The right state\n\nOur memories are stored as associations with\
    \ our senses. Have you noticed when you hear a certain piece of music you think\
    \ of a specific person or time in your life which can lead to a range of emotions\
    \ happy, sad to name a few. In Neuro Linguistic Programming, which is the study\
    \ of excellence, it is said that any external stimulus that triggers an internal\
    \ state or response is known as an anchor.\n\nAnchors are a great way to help\
    \ you build confidence because you can use all of your positive experiences and\
    \ memories to help you become more resourceful in the future.\n\nYou can do this\
    \ using the following steps:\n\n+   1. **Get really clear about the positive state\
    \ you want to be in and be clear and specific in the words you use to describe\
    \ it.**  \n+      E.g. your confident state maybe relaxed and alert or charming\
    \ and witty.\n+   \n+   2. **Recall a specific occasion from the past when you\
    \ have been in that state.**  \n+      The context can be different but the experience\
    \ comparable.\n+   \n+   3. **Engage fully with that past experience.**  \n+ \
    \     See what you saw, hear what you heard, feel what you felt; physical feelings\
    \ and internal sensations."
  - '[PAGE 87]


    Having followed the above steps you are in the highest possible state to set an
    anchor and you can do this by squeezing the thumb and first finger of either hand
    together.


    Now when you need to get back into a positive state, you simply fire the anchor
    for yourself by squeezing the thumb and first finger together.


    # ### Compile a Confidence Treasure Chest


    I, and many of my clients, have found it helpful to create a confidence treasure
    chest.


    Get a box and decorate it or buy one already decorated and start to put in mementoes
    of your success such as photos of times when you looked and felt great. My confidence
    treasure chest contains childhood certificates and medals from tap and Irish dancing
    competitions, my qualification certificates, photos of when I looked and felt
    at my best, and photos of when I perhaps didn''t look my best because I''d run
    a 10k but felt ''grrrrrreat''. copies of the first talk I gave which was well
    received, references and recommendations and of course my confidence resume.


    # ### A Confidence Resume


    There is nothing quite like taking an inventory of your success in all areas of
    your life to get a clearer perspective of yourself and self-worth. I''ve done
    this exercise on hundreds of occasions with clients, and in workshops, and it
    never fails to amaze me how people fail to see their achievements or their gifts.'
  - '[PAGE 88]


    In a recent workshop, a woman struggled to see her achievements or what her greatest
    contributions were. She was genuinely stuck and blind to herself. With a little
    digging we uncovered that she had abseiled down Glasgow University Tower to raise
    a considerable amount of money for charity. She had raised three children on her
    own, recently passed her driving test, was very successful in her role as a learning
    support assistant in a secondary school. Once we uncovered these she was on a
    roll and amazed herself and her colleagues who were dumbfounded by her achievements,
    but more so by her failure to recognise, share and celebrate them. Her attitude
    was one of ‘so what’ but through discussion she realised that not everyone could
    do what she did. Because it was easy for her, she failed to recognise and value
    her skills, talents and personal attributes; care, kindness and compassion for
    the pupils in her care and her colleagues.


    The chances are you too are overlooking your uniqueness and a lot of what comes
    easy to you. You have possibly forgotten all that you have achieved. Take this
    opportunity to see yourself with fresh eyes and complete your confidence resume.


    To construct your confidence resume I suggest you review your life and reflect
    on your achievements. You might find it useful to do this in 5-10 year periods
    and consider the following questions:


    +   - What where your confidence highs and lows during this time?

    +   - What significant events would you include?

    +   - What insights and learning can you take from those times?'
  - '[PAGE 89]


    +   - List at least five achievements that made you feel good about yourself.


    Now think about how your confidence has changed over time and how past events
    have shaped your life. If similar circumstances were to present themselves again
    how might you handle them now?


    Think about what you have going for you now.


    +   - What new opportunities are being presented to you?

    +   - How might your experience to date prepare you for these opportunities?


    When you have finished this exercise add it to your treasure chest, review it
    regularly, and remember to keep adding mementoes too.


    # ## Generosity and Gratitude


    You may be wondering what generosity and gratitude have got to do with confidence,
    but actually it has a lot and tells you a considerable amount about a person.
    When a person operates from a place of scarcity or lack they are subconsciously
    telling themselves there is not enough and that they may be incapable of creating
    more of what they want in life, whether it be money or love or anything else for
    that matter. From a Universal Law perspective that''s exactly what they attract.


    When one comes from a place of abundance, you trust that the Universe will provide
    for you and have confidence in your ability to survive and thrive. You have'
  - '[PAGE 90]


    an attitude of prosperity consciousness knowing that you have enough. This awareness
    makes it easier for you to give.


    I am not suggesting for one moment that you make a pauper of yourself in order
    to let others prosper. I’ve already pointed out the importance of giving to yourself
    first before giving to another. However knowing that in life and work you get
    what you give and that the Law of Reciprocity is always at work, even though it
    isn’t always instantaneous, builds confidence. Start with a smile and see how
    it comes back to you.


    An attitude of gratitude also helps to build confidence because you start to realise
    and truly appreciate your skills, gifts and talents. You recognise your own magnificence
    and that builds self-confidence and others confidence in you.


    Genuinely be grateful for and to the people who support and love you, see the
    gifts in your challenges. Now I understand that at the time these gifts are often
    difficult to see, but challenges do contain lessons that we can learn to appreciate.
    When we count our blessings we come to realise how prosperous we really are and
    as our appreciation grows so we attract more blessings to us and in turn authentic
    confidence develops.


    Keep a gratitude journal. Invest in a notebook; something colourful and rich and
    each evening record the gifts you’ve received each day and watch the number grow.'
  - '[PAGE 91]


    # **Create your own Confidence Council**


    Get yourself a courageous council. Identify a group of people who you know will
    love and support you through the good times and bad. You need to have a Number
    1 Fan, someone to cheer you when you’re down and doubting yourself. Someone who
    thinks you’re the bee’s knees and believes in you 100%, a critical friend who
    will challenge your thinking and assumptions to make sure you’ve considered all
    the pros and cons so that you can make informed decisions. Get yourself a mentor
    - someone who has been there and done what you want to achieve. Learn from their
    experience and model what they do. Learn about their beliefs and attitudes towards
    the area you want to succeed in. Your personal support team are vital to your
    confidence and success. No-one can do it alone. Even Jesus had 12 Apostles!'
  - '[PAGE 92]


    # Summary


    +   - Developing a growth mindset means you allow yourself to believe that your
    abilities can be developed through persistence, dedication and hard work.


    +   - Mindfulness is a practice that nurtures a state of relaxed alertness, which
    helps you to relate directly to whatever is happening both internally and externally,
    it allows you to live more presently rather than focusing on the past or the future.


    +   - You can get yourself in to ''a'' right state or ''the'' right state the
    choice is yours.


    +   - Taking an inventory of your success in all areas of your life gives you
    a clearer perspective of yourself and self-worth.


    +   - Identify a group of people who you know will love and support you through
    the good times and bad.


    +   - Attitudes of generosity and gratitude say a lot about a person''s confidence.'
