    \ easy to you. You have possibly forgotten all that you have achieved. Take this\
    \ opportunity to see yourself with fresh eyes and complete your confidence resume.\n\
    \nTo construct your confidence resume, I suggest you review your life and reflect\
    \ on your achievements. You might find it useful to do this in 5-10 year periods\
    \ and consider the following questions:\n\n- What were your confidence highs and\
    \ lows during this time?\n- What significant events would you include?\n- What\
    \ insights and learning can you take from those times?\n- List at least five achievements\
    \ that made you feel good about yourself.\n\nNow think about how your confidence\
    \ has changed over time and how past events have shaped your life. If similar\
    \ circumstances were to present themselves again, how might you handle them now?\n\
    \nThink about what you have going for you now.\n\n- What new opportunities are\
    \ being presented to you?\n- How might your experience to date prepare you for\
    \ these opportunities?\n\nWhen you have finished this exercise, add it to your\
    \ treasure chest, review it regularly, and remember to keep adding mementoes too.\n\
    \n### Generosity and Gratitude\n\nYou may be wondering what generosity and gratitude\
    \ have got to do with confidence, but actually it has a lot and tells you a considerable\
    \ amount about a person. When a person operates from a place of scarcity or lack,\
    \ they are subconsciously telling themselves there is not enough and that they\
    \ may be incapable of creating more of what they want in life, whether it be money\
    \ or love or anything else for that matter. From a Universal Law perspective,\
    \ that's exactly what they attract.\n\nWhen one comes from a place of abundance,\
    \ you trust that the Universe will provide for you and have confidence in your\
    \ ability to survive and thrive. You have an attitude of prosperity consciousness,\
    \ knowing that you have enough. This awareness makes it easier for you to give.\n\
    \nI am not suggesting for one moment that you make a pauper of yourself in order\
    \ to let others prosper. I’ve already pointed out the importance of giving to\
    \ yourself first before giving to another. However, knowing that in life and work\
    \ you get what you give and that the Law of Reciprocity is always at work, even\
    \ though it isn’t always instantaneous, builds confidence. Start with a smile\
    \ and see how it comes back to you.\n\nAn attitude of gratitude also helps to\
    \ build confidence because you start to realise and truly appreciate your skills,\
    \ gifts and talents. You recognise your own magnificence and that builds self-confidence\
    \ and others’ confidence in you.\n\nGenuinely be grateful for and to the people\
    \ who support and love you, and see the gifts in your challenges. Now I understand\
    \ that at the time these gifts are often difficult to see, but challenges do contain\
    \ lessons that we can learn to appreciate. When we count our blessings, we come\
    \ to realise how prosperous we really are, and as our appreciation grows, so we\
    \ attract more blessings to us and in turn authentic confidence develops.\n\n\
    Keep a gratitude journal. Invest in a notebook; something colourful and rich,\
    \ and each evening record the gifts you’ve received each day and watch the number\
    \ grow.\n\n### Create your own Confidence Council\n\nGet yourself a courageous\
    \ council. Identify a group of people who you know will love and support you through\
    \ the good times and bad. You need to have a Number 1 Fan, someone to cheer you\
    \ when you’re down and doubting yourself. Someone who thinks you’re the bee’s\
    \ knees and believes in you 100%, a critical friend who will challenge your thinking\
    \ and assumptions to make sure you’ve considered all the pros and cons so that\
    \ you can make informed decisions. Get yourself a mentor - someone who has been\
    \ there and done what you want to achieve. Learn from their experience and model\
    \ what they do. Learn about their beliefs and attitudes towards the area you want\
    \ to succeed in. Your personal support team are vital to your confidence and success.\
    \ No-one can do it alone. Even Jesus had 12 Apostles!\n\n## Summary\n\n- Developing\
    \ a growth mindset means you allow yourself to believe that your abilities can\
    \ be developed through persistence, dedication and hard work.\n- Mindfulness is\
    \ a practice that nurtures a state of relaxed alertness, which helps you to relate\
    \ directly to whatever is happening both internally and externally; it allows\
    \ you to live more presently rather than focusing on the past or the future.\n\
    - You can get yourself into ‘a’ right state or ‘the’ right state; the choice is\
    \ yours.\n- Taking an inventory of your success in all areas of your life gives\
    \ you a clearer perspective of yourself and self-worth.\n- Identify a group of\
    \ people who you know will love and support you through the good times and bad.\n\
    - Attitudes of generosity and gratitude say a lot about a person's confidence.\n"
  mdcn: "\n\n## 正确的状态\n\n我们的记忆是以与感官的联想形式储存的。你是否注意到，当你听到某段音乐时，会想起某个特定的人或生命中的某个时刻，这可能引发一系列情绪，仅举几例，如快乐、悲伤。在神经语言程序学（NLP）——一门研究卓越的学问——中，据说任何能触发内在状态或反应的外部刺激都被称为“心锚”。\n\
    \n心锚是帮助你建立自信的好方法，因为你可以利用所有积极经历和记忆，帮助自己在未来变得更有办法、更善于应对。\n\n你可以通过以下步骤做到：\n\n- **1.\
    \ 真正明确你想要处于的积极状态，并用清晰、具体的词语来描述它。**\n  例如，你的自信状态可能是放松而警觉，或迷人而机智。\n\n- **2. 回想过去某个你曾处于该状态的具体场合。**\n\
    \  情境可以不同，但体验可以相仿。\n\n- **3. 全身心投入那段过往经历。**\n  看你当时所看，听你当时所听，感受你当时所感；身体感觉和内在感受。\n\
    \n遵循上述步骤后，你便处于设置心锚的最佳可能状态，你可以通过将任意一只手的拇指和食指捏在一起来设置心锚。\n\n现在，当你需要重新进入积极状态时，只需将拇指和食指捏在一起，为自己触发心锚。\n\
    \n### 打造一个自信百宝箱\n\n我和我的许多客户都发现，创建一个自信百宝箱很有帮助。\n\n找一个盒子装饰它，或买一个已经装饰好的盒子，然后开始放入你成功经历的纪念物，比如你看起来和感觉极佳时的照片。我的自信百宝箱里有童年时期的证书和踢踏舞及爱尔兰舞蹈比赛的奖牌、我的资格证书、我看起来和感觉处于最佳状态时的照片，以及我可能看起来并非最佳——因为我刚跑完10公里却感觉“棒极了”——时的照片，我第一次演讲的讲稿副本（那次演讲反响很好）、推荐信和推荐语，当然还有我的自信简历。\n\
    \n### 自信简历\n\n盘点你在生活各个领域取得的成功，能让你更清晰地认识自己和自我价值，没有什么比这更有效。我在与客户合作和研讨会中做过数百次这个练习，人们看不到自己的成就或天赋，这总让我惊讶。\n\
    \n在最近一次研讨会上，一位女士难以看到自己的成就或她最大的贡献是什么。她真的卡住了，对自己视而不见。稍加挖掘，我们发现她曾沿格拉斯哥大学塔楼速降，为慈善事业筹集了相当一笔钱。她独自抚养了三个孩子，最近通过了驾照考试，在中学担任学习支持助理非常成功。一旦我们发现了这些，她便打开了话匣子，越说越起劲，并让自己和同事感到惊讶；同事们对她的成就目瞪口呆，但更惊讶于她竟然没有认识到、分享并庆祝这些成就。她的态度是“那又怎样”，但通过讨论，她意识到并不是每个人都能做到她所做的。因为这些对她来说很容易，她未能认识并重视自己的技能、才华和个人品质——对受托照护的学生和同事的关心、善意与同情。\n\
    \n很可能你也忽视了自己的独特之处，以及许多对你来说轻而易举的事。你可能已经忘记了自己取得的所有成就。借此机会以全新的眼光看待自己，完成你的自信简历。\n\n\
    要构建你的自信简历，我建议你回顾自己的人生，反思自己的成就。你可能会发现按5—10年为一个阶段来做很有用，并思考以下问题：\n\n- 在这段时间里，你的自信高峰和低谷分别是什么？\n\
    - 你会纳入哪些重要事件？\n- 你能从那些时期获得哪些洞见和学习？\n- 列出至少五项让你对自己感觉良好的成就。\n\n现在想一想，你的自信如何随时间变化，过去的事件如何塑造了你的人生。如果类似情形再次出现，你现在会如何处理？\n\
    \n想一想你现在拥有哪些有利条件。\n\n- 有哪些新机会正呈现在你面前？\n- 你迄今为止的经历可能如何让你为这些机会做好准备？\n\n完成这个练习后，把它放进你的百宝箱，定期回顾，并记得不断添加纪念物。\n\
    \n### 慷慨与感恩\n\n你或许想知道慷慨和感恩与自信有什么关系，但实际上关系很大，而且能让你对一个人有相当多的了解。当一个人从匮乏或短缺的立场出发行事时，他们潜意识里告诉自己“不够”，并告诉自己可能无力在生活中创造更多自己想要的东西——无论是金钱、爱还是其他任何东西。从宇宙法则的角度看，他们吸引的正是这些。\n\
    \n当一个人出自富足的心态，你会相信宇宙会供养你，并对自己的生存与兴旺能力充满信心。你拥有富足意识的态度，知道自己已经足够。这种觉察让你更容易给予。\n\n\
    我绝不是建议你让自己变成穷人，好让别人兴旺。我已经指出，在给予他人之前先给予自己的重要性。然而，知道在生活和工作中你付出什么就会得到什么，而且互惠法则始终在起作用——尽管并不总是立竿见影——会建立自信。从一个微笑开始，看看它如何回到你身上。\n\
    \n感恩的态度也有助于建立自信，因为你开始意识到并真正欣赏自己的技能、禀赋和才华。你认识到自己的卓越，这会建立自信，也会建立他人对你的信心。\n\n真诚地感激支持你、爱你的人，并看到你的挑战中的馈赠。我明白，在当时这些礼物往往难以看见，但挑战确实包含我们可以学会欣赏的教训。当我们细数自己的福分时，我们会意识到自己实际上多么富足；随着我们的感恩增长，我们也会吸引更多福分，进而培养出真正的自信。\n\
    \n坚持写感恩日记。投资一本笔记本；选色彩丰富、内容充实的那种，每晚记录你当天收到的礼物，看着这个数目增长。\n\n### 创建你自己的自信顾问团\n\n\
    给自己组建一个勇敢的顾问团。找出那些你知道会在顺境和逆境中爱你、支持你的人。你需要一个头号粉丝，一个在你情绪低落、怀疑自己时为你加油的人。一个认为你出类拔萃、百分之百相信你的人；一位诤友，会挑战你的想法和假设，确保你考虑了所有利弊，以便做出明智的决定。给自己找一位导师——一个经历过并做到过你想要实现之事的人。从他们的经验中学习，并模仿他们的做法。了解他们对你想取得成功的领域的信念和态度。你的个人支持团队对你的自信和成功至关重要。没有人能独自做到。连耶稣都有12位使徒！\n\
    \n## 总结\n\n- 培养成长型思维意味着你允许自己相信，你的能力可以通过坚持、投入和努力得到发展。\n- 正念是一种培养放松而警觉状态的练习，它帮助你直接面对内在和外在发生的一切；它让你更活在当下，而不是专注于过去或未来。\n\
    - 你可以让自己进入“一种”正确状态，或“那种”正确状态；选择权在你手中。\n- 盘点你在生活各个领域取得的成功，能让你更清晰地认识自己和自我价值。\n-\
    \ 找出那些你知道会在顺境和逆境中爱你、支持你的人。\n- 慷慨和感恩的态度能充分说明一个人的自信。\n\n"
