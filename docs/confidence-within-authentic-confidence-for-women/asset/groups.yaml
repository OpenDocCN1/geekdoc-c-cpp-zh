    our levels of self-confidence. Seldom do we question our beliefs because we hold
    them to be true at the core of our being. Authentic confidence allows us to uncover
    any lies within our beliefs by questioning and uncovering the truth behind what
    we believe about ourselves, others and the world, and examining the generalisations
    we make and the information we distort or delete.


    Our confidence is challenged when we hold unhelpful beliefs around what is possible
    for us, our ability to achieve it and, perhaps most worryingly, whether we are
    worthy of it. It is not uncommon for these beliefs to come from the influence
    of what others have told us or their expectations of us e.g. the media, parents,
    teachers, colleagues, bosses and partners.


    Let’s say you had a couple of relationships that ended badly. You may come to
    believe that you are no good at relationships (generalisation). In fact, you may
    have been told this from an ex-partner which only serves to reinforce that belief.
    I’m sure however there were times when you were both happy and things were going
    well and the relationship was good (deletions). You have other relationships with
    friends, family and colleagues that are fulfilling.


    By now you are getting the picture of how your thinking can be distorted. What
    I would suggest is that you don’t currently have an effective and successful strategy
    for nurturing romantic relationships. Fortunately, this can be explored and developed
    until you are able to enjoy a fulfilling relationship. This is true of anything
    that you desire, which you currently believe is out of your reach. You will never
    achieve it until you challenge the limiting belief and change the can’t do attitude
    to a CAN DO!'
