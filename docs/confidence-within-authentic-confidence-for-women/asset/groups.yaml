    +      Again a simple yes or no answer is all that''s required; if the answer
    is no again let it go.


    +   3. **Is being, doing or having this in harmony with the laws of the universe?**

    +      For an opportunity to be in harmony with the laws of the universe it would
    have to add to your life without taking away from someone else''s which is further
    clarified by question 4.


    +   4. **Is being, doing or having this going to violate the rights of others?**

    +      By embracing the opportunity, would you be taking away another person''s
    ability to choose?


    If you answered *yes* to the first three questions and *no* to the fourth question,
    then the universe will support you in moving forward. Whatever it is that you
    need in terms of resources, people or support will start to flow towards you,
    but first you must make the decision and trust that the way and the ''how to''
    will become clear.


    When I decided to set up my own business I knew that I couldn''t afford to retain
    the flat that I was living in so I made the decision to sell it. It was October
    and I expected to be living there until the following January at least. My flat
    sold within 2 days of being on the market. I was shocked and scared because I
    had to be out within 6 weeks and if I''m honest, heartbroken too because I loved
    that flat and thought I wouldn''t get anything better in my price range. My focus
    was on finding a rented property fast. I saw a few dodgy dwellings but without
    too much effort I found a flat a little more expensive than I''d'
  - '[PAGE 111]


    planned for but well worth it as it was even better than the one I''d left. It
    had a terrace, underground parking and concierge service. Shortly after I settled
    in to the flat business began to flow.


    When you do not love yourself and suffer from low self-esteem, it is almost impossible
    to ever reach the potential that you suspect you have. Recognising you deserve
    to have what you want and giving yourself permission to go after it, is an act
    of self-love. Learning to love yourself starts with making a conscious decision,
    an intention to become happy and lead a fulfilled life.


    # ### Self-love


    I want to clarify here the difference between self-love and ''lov''n yourself''
    a phrase often used by us Glaswegians to describe someone who is over confident
    or perhaps has narcissistic tendencies. Social philosopher and Psychologist Erich
    Fromm proposed that loving oneself is different from being arrogant, conceited
    or egocentric. He proposed that loving oneself means caring about oneself, taking
    responsibility for oneself and the outcomes we create. It''s about self-respect
    and self-knowledge, and being realistic and honest about one''s strengths and
    weaknesses. He proposed, further, that in order to be able to truly love another
    person, a person needs first to love oneself in this way. It''s not an easy process.
    I''ve been through it but the inner peace and contentment it brings is pure gold.


    Self-love involves recognizing that you are constantly evolving to become more
    powerful and more'
