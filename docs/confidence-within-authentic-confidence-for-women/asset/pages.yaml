- pgno: 70
  md: 'Another reason for failing to set boundaries is a fear of offending by saying
    NO. However, when you have clear boundaries it’s easier for you to assert yourself
    because when a line has been crossed you have a better understanding of the emotional,
    mental and physical impact that certain situations or behaviours from others is
    likely to have on you. You are more aware of the reasons why this boundary is
    in place and more able to explain to yourself and others why crossing this line
    is not acceptable. This knowledge allows you to recognise when someone or something
    is teetering on the line because your inner guidance signals warnings and as always
    it’s up to you to heed them. Remember also that not being able to tell someone
    something for fear of hurting them or making them jealous is taking responsibility
    for their feelings, which disempowers them, and a disempowered person is always
    an angry person.


    When you are clear about your boundaries your self-trust, self-respect and authentic
    self-confidence glows for others to see. You are well aware of what you will accept
    and what you won’t and that makes it easier for you to teach others how to treat
    you.


    People like to know who they are dealing with and where they stand in a relationship
    whether it’s personal or professional. We tend to live our lives by a set of rules
    and in a way that’s what boundaries are. They help to instil a sense of trust
    and confidence as people get to know what they can expect from you and what you
    will accept from them, and that speaks volumes as to how much you value yourself.
    It reminds me of my teaching days. Being firm and fair in the classroom is rewarded
    with respect, effort and a good ethos and well they do say relationships are the
    curriculum of the school of life.'
