    # ### Self-love


    I want to clarify here the difference between self-love and ''lov''n yourself''
    a phrase often used by us Glaswegians to describe someone who is over confident
    or perhaps has narcissistic tendencies. Social philosopher and Psychologist Erich
    Fromm proposed that loving oneself is different from being arrogant, conceited
    or egocentric. He proposed that loving oneself means caring about oneself, taking
    responsibility for oneself and the outcomes we create. It''s about self-respect
    and self-knowledge, and being realistic and honest about one''s strengths and
    weaknesses. He proposed, further, that in order to be able to truly love another
    person, a person needs first to love oneself in this way. It''s not an easy process.
    I''ve been through it but the inner peace and contentment it brings is pure gold.


