- pgno: 63
  md: 'There are other things that you might be tolerating that could be affecting
    your confidence, dampening your spirits and draining your energy. Perhaps a colleague
    doesn''t give you the respect you desire; keeps you waiting before a meeting or
    allows unnecessary and lengthy interruptions during meetings. Perhaps something
    in your home needs repair or a room needs redecorated so that it feels more comfortable.
    Perhaps you are tolerating being in debt or not charging/earning enough for the
    work that you do.


    When Celine came to see me, she was feeling very lost and confused. Stuck in a
    ‘dead-end job’ way beneath her skill level. Celine was earning a lot less than
    she was used to and incurring mounting debt accompanied by feelings of guilt and
    shame. She was mourning the woman she once was and the life she had, before moving
    from Quebec to Glasgow to be with her boyfriend.


    To help Celine move forward we identified that addressing her debt issues would
    make the biggest difference to her confidence. We reframed her view of debt so
    that she could see it as a tool that had helped her to keep everything in flow
    and allow her to live a decent lifestyle. That way rather than beating herself
    up about it she could see it had served its purpose - giving her the freedom and
    ability to enjoy life. We then developed an action plan to increase the inflow
    and decrease the outflow of cash. She sold items on eBay, at car boot sales, swapped
    credit cards to get better interest rates and devised a budget. Within weeks her
    activity had made quite an impact on her debt and her confidence.


    We worked on her CV, identifying her network and clarifying her personal brand.
    It was at this point'
  merge: -1
  img_proc: true
- pgno: 64
  md: 'Celine admitted to herself that it was her relationship that wasn’t working
    any more. She and her partner were no longer compatible, their values and aspirations
    were different, she was working hard to reduce debt while he was creating more.
    She wanted to move to a smaller house, he wanted to stay where he was. Celine
    recognised and reconciled with the fact that she had been tolerating the debt
    and the dead-end job as a way to avoid ending a relationship that deep down she
    knew wasn’t working.


    I bet that whatever you are tolerating doesn’t make you feel good but what you
    must recognise and accept is that on some level it’s working for you otherwise
    the toleration wouldn’t exist.


    *For example,* it may be helping you temporarily to avoid making a decision that
    will cause you some pain or unhappiness, or it may be a fear of what might happen
    if you assert yourself. Remember this: when you tolerate you become less attractive
    to yourself and to others and you have less impact, which in turn can often lead
    to you being crippled by feelings of helplessness and hopelessness.


    You may be reading this and think you are not tolerating anything. Well if that’s
    true good for you. However, if you are justifying why a certain area of your life
    is the way it is then the chances are you ARE tolerating something and I would
    invite you to reconsider.


    Try the following exercise to get clear on and clear of your tolerations. It’s
    important that you write these down so that you can actually see them rather than
    just thinking about them. Write down the tolerations that seem impossible to solve
    as it’s likely that smaller tolerations stem from these.'
  merge: -1
  img_proc: true
- pgno: 65
  md: '# Exercise - Getting Clear On and Clear of Tolerations


    +   - For each of the following categories write down a list of at least ten tolerations:

    +     - **Car.**

    +     - **Equipment.**

    +     - **Home.**

    +     - **Office.**

    +     - **Work.**

    +     - **Relationships** - family, friends, significant other, colleagues. Consider
    their behaviour, habits, attitude and communication style.

    +     - **You** - Your habits, behaviour, attitudes and communication style, health
    and well-being.


    +   - Beside the tolerations write down how these are serving you. What benefits
    are you perceiving from putting up with the situation?


    +   - What are these tolerations costing you? These can be measured in terms of
    time, resources and money or the opportunity cost, level of attraction e.g. respect,
    recognition. Remember these are likely to impact more on your confidence.


    +   - Commit to eliminating the tolerations from your list.'
  merge: -1
  img_proc: true
