- pgno: 59
  md: 'Make sure the new belief is stated in the positive and makes you feel good
    about yourself.


    E.g. I am good at relationships. I can sell, I am a successful networker.


    # **Integrate the new belief**


    Imagine how things will be different when you hold this new belief. What will
    you be doing and saying? How will you be feeling?


    The key to the success of your belief change is becoming more aware of your *circle
    of influence*. Your circle of influence is the people from the past and present
    who have and do influence your belief systems. If a belief comes from your upbringing
    or educational background then this is what you''ve been taught to believe and
    is simply programming. The key question to ask your-self about these beliefs is,
    ''Does this still hold true for me today''?


    As for the people presently in your life be mindful of how they treat you, listen
    carefully to how they talk to you and talk about you, as well as what they say
    about the world in general. How do their beliefs influence you? Do they have a
    positive impact on your self-confidence? Are they supportive? If not, remember
    you have a choice. You can tolerate or you can eliminate your confidence drainers:
    the thieves who steal your self-esteem and self-worth. You can do this by limiting
    your time with them or deciding they no longer deserve a place in your life. Don''t
    be surprised if once you change your beliefs they seem to disappear from your
    life because energetically their power and influence over you has gone.'
