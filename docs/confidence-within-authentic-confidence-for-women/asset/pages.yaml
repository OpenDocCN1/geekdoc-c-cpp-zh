  md: '# ## Chapter 2 - Unpacking the Baggage


    > > *''If you are willing to deal with the past you can make the moment you are
    in rich''.*

    > >

    > > Oprah Winfrey


    We are products of our past. It is part of who we are today because whether you
    recognise it yet or not we use the patterns of the past in our daily lives.


    *What do I mean by patterns?*


    Well, I am referring to those helpful and sometimes unhelpful, beliefs and behaviours
    that we employ sometimes consciously, sometimes unconsciously in response to the
    behaviour of others and situations in which we find ourselves.


    Our patterns are simply learnings from our past based on what we saw, heard and
    experienced from family, friends, teachers, colleagues, bosses, partners and anyone
    else who influenced us. It''s also behaviour that generally worked for us on some
    level in terms of getting us the results we wanted or protecting us from a result
    we didn''t want.


    The problem we face is that our patterns can become destructive when they don''t
    give us the results we want, since we employ them automatically. If we wish to
    grow in authentic confidence we have to pause, reflect and uncover the recurring
    themes that keep popping up in our life and the underlying lessons to be learned
    from them. Once you recognise a theme and get the learning behind it you can stop
    that pattern and create a new more helpful'
  merge: -1
  img_proc: true
- pgno: 32
  md: 'pattern, but for this to happen you have to become more self-aware, aware of
    how you give your power away through automatic reactions and self-sabotaging behaviour,
    which can often undermine your confidence.


    Our past can’t be changed but it can be used to inform our future and that’s why
    it’s important to spend some time with the pain from our past. Recognising and
    naming the patterns; the life/death/life cycles that run through our lives, exploring
    our feelings, examining guilt and being accountable for our role in the way events
    in our lives have played out is all part of the process.


    # *What do I mean by being accountable?*


    Well, when something happens in our life that affects our confidence it helps
    to look at our reaction to the situation or circumstances. Have we chosen to play
    the helpless victim and dwell in our despair or did we respond by taking appropriate
    action? By reflecting on and reviewing our patterns of response we can become
    aware of our personal accountability for employing a victim mindset and our responsibility
    also to find alternative responses that will serve us better in the future and
    allow us to step up and in to our power.


    Awareness is the first step in healing or changing, unpacking the baggage from
    our past so that we can understand it and make friends with it. Awareness will
    lighten its load and liberate us from the chains of pain so that it no longer
    affects but informs our future.


    The work you will do in this chapter will require strength. It will require you
    to dig deep in to the wounds within so that they can heal. It will also require
    you to step'
