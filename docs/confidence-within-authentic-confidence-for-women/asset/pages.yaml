- pgno: 44
  md: 'an ex-wife and her two children and their coming to terms with the new wife.
    Julia Roberts is the step mom and Susan Sarandon the natural mother of two children
    who is dying of cancer and coming to terms with bequeathing the care of her children
    to a women she doesn''t much care for. I think it''s impossible to watch this
    film and not cry - it acted like a bit of a tap for me, which I could turn on
    and let the tears flow. If you struggle with letting the tears flow give this
    exercise a go of course the film doesn''t need to be *Stepmom* but it does have
    to be a good tearjerker.


    If the emotion is anger – a good scream in the car with the windows rolled up
    of course is a great way to release, as is punching into some pillows or, if you
    like the gym, a boxercise class is great too. Personally, I find going for a run
    works for me but I think any exercise that expends the excess adrenaline coursing
    through the veins will be beneficial.


    Resentment is anger that is prolonged and continues well beyond the initial experience.
    When we are resentful, we are full of blame and we don''t take responsibility,
    we take on the need for us to be right and someone else to be wrong. By releasing
    this need we take back our power to effect change, rather than being the victim
    of others cruelty. As long as you are angry at a situation or a person, that person
    or situation has power over you.


    A good first step in the process of forgiveness is to try and gain some insight
