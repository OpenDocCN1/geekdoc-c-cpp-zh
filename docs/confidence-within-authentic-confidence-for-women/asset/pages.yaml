    # ### Compile a Confidence Treasure Chest


    I, and many of my clients, have found it helpful to create a confidence treasure
    chest.


    Get a box and decorate it or buy one already decorated and start to put in mementoes
    of your success such as photos of times when you looked and felt great. My confidence
    treasure chest contains childhood certificates and medals from tap and Irish dancing
    competitions, my qualification certificates, photos of when I looked and felt
    at my best, and photos of when I perhaps didn''t look my best because I''d run
    a 10k but felt ''grrrrrreat''. copies of the first talk I gave which was well
    received, references and recommendations and of course my confidence resume.


    # ### A Confidence Resume


    There is nothing quite like taking an inventory of your success in all areas of
    your life to get a clearer perspective of yourself and self-worth. I''ve done
    this exercise on hundreds of occasions with clients, and in workshops, and it
    never fails to amaze me how people fail to see their achievements or their gifts.'
