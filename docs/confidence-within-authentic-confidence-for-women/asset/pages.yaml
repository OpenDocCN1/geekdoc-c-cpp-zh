- pgno: 82
  md: 'Mindfulness is a practice that nurtures a state of relaxed alertness, which
    helps you to relate directly to whatever is happening both internally and externally.
    It involves allowing yourself to be where you are and to become more familiar
    with your experience of thoughts and feelings moment-by-moment rather than getting
    caught up reliving memories or making forecasts about your future.


    So what’s all this got to do with confidence?


    With the practice of mindfulness you enjoy a feeling of being grounded; centred
    and having a sense of inner peace. Your powers of concentration and focus improve
    and you become more relaxed and trusting in your ability to handle things even
    when your confidence is wavering.


    Rather than allowing your emotions to run the show, you become more conscious
    of your thoughts and feelings. Instead of wandering mindlessly you wonder mindfully
    as you become curious about the signals your body is giving you in the form of
    thoughts and reactions to people and circumstances in which you find yourself.


    Mindfulness practice consists of different forms of meditation and movement. Since
    my early 20s I have found becoming mindful of my breathing to be most effective
    in helping me to feel more relaxed, focused and confident before exams, interviews
    and speaking engagements. Now 10 minutes of focused breath work throughout my
    day keeps me calm and confident.


    It’s best to do this exercise in a place where you are likely to be undisturbed
    and either lie down or sit'
  merge: -1
  img_proc: true
- pgno: 83
  md: 'upright in a chair. With practice, through time you will be able to take a
    martini approach to mindful breathing and do it any time, any place. anywhere.


    # **Exercise**


    Once you are settled into position take a slow deep breath in through the nose
    (say for a count of 3 - 5) then exhale through the mouth for a count slightly
    longer than the inhalation.


    Do at least ten rounds of this in the beginning and gradually increment in blocks
    of five until you reach about 20 minutes.


    If your mind wanders that''s ok, just acknowledge your thoughts you can say out
    loud or internally ''thinking'' and without judgment let them go and refocus on
    your breath.


    On occasions when I have been particularly anxious especially during the night
    I have found it helpful to say the following phrase:


    On inhalation, "All is well..." On exhalation. "...And all will be well." Doing
    this has brought me to a place of deep relaxation and peace.


    There are various mindfulness meditations available in both book and digital format.
    I highly recommend anything by Jon Kabat-Zinn and offer details of his books and
    others for further reading in the resource section.'
  merge: -1
  img_proc: true
