- pgno: 86
  md: "# The right state\n\nOur memories are stored as associations with our senses.\
    \ Have you noticed when you hear a certain piece of music you think of a specific\
    \ person or time in your life which can lead to a range of emotions happy, sad\
    \ to name a few. In Neuro Linguistic Programming, which is the study of excellence,\
    \ it is said that any external stimulus that triggers an internal state or response\
    \ is known as an anchor.\n\nAnchors are a great way to help you build confidence\
    \ because you can use all of your positive experiences and memories to help you\
    \ become more resourceful in the future.\n\nYou can do this using the following\
    \ steps:\n\n+   1. **Get really clear about the positive state you want to be\
    \ in and be clear and specific in the words you use to describe it.**  \n+   \
    \   E.g. your confident state maybe relaxed and alert or charming and witty.\n\
    +   \n+   2. **Recall a specific occasion from the past when you have been in\
    \ that state.**  \n+      The context can be different but the experience comparable.\n\
