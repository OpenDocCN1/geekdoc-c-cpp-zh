    **Professional:** How confident do you feel at work?


    +   - Are you able to speak out and share your views?

    +   - Are you able to delegate or say ‘No’ when workload becomes overwhelming?

    +   - Does your work fulfil you?


    **Financial:** This section isn’t about how much money you have, because your
    financial worth will never be enough unless your sense of self-worth is sufficient.'
  merge: -1
  img_proc: true
- pgno: 24
  md: 'This section is more about your ability to manage your finances and provide
    for yourself and your family.


    +   - Consider things like debts and savings and your management of them.


    **Spiritual:** I’ve used the term spiritual here to refer to having a sense of
