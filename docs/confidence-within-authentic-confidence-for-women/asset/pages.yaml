- pgno: 67
  md: '+   - Say the person''s name.

    +   - Say what you want.

    +   - Say why you want it.

    +   - Say when you want it.

    +   - Say thank you rather than please as it assumes cooperation.


    Remember to avoid blame and unnecessary upset state how you are feeling rather
    than what the other person is doing wrong. E.g. I feel my input isn''t valued
    when arrangements are made without consulting me.


    # ### Remember you have a choice


    When you are asked to do something, remember you can say yes or you can say no.
    You don''t have to commit right away. Buy yourself some time and say, "Can I think
    about it and get back to you?" If you are pressurised for a response give a time
    and date, if necessary, as to when you will respond and during that time consider
    the following questions:


    +   - What are my options?

    +   - What do I want?

    +   - What feels like the right thing for me to do in this situation?

    +   - What am I sacrificing? Does it feel OK to sacrifice in this situation? Is
    it appropriate?

    +   - What''s most important to me right now?'
