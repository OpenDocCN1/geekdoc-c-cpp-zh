- pgno: 12
  md: "# Chapter 1 – Authentic Confidence\n\n> **Confidence** – *the quality of being\
    \ certain of your abilities or of having trust in people, plans, or the future.*\n\
    > \n> — The Cambridge Dictionary\n\nConfidence is complex; a chameleon - it changes\
    \ according to what’s going on in our life, the situations in which we find ourselves\
    \ and even who we are with. A sought after and desirable quality, yet according\
    \ to its measure it can be a friend or foe and is often a master of disguise.\n\
    \n# Desirable\n\nConfidence is spellbinding, ageless, seductive and a certain\
    \ kind of sexy. We can find ourselves attracted to the most unlikely folk, simply\
    \ because they are comfortable in their own skin. I remember many years ago being\
    \ amused and if I’m honest confused to hear a colleague of mine refer to the actor\
    \ Jack Nicholson as being ‘dead sexy’. Not your usual movie hunk but it was his\
    \ self-assurance she found so alluring. I recall reading an article a while back\
    \ about the actress Francesca Annis who at the age of 61 was being described as\
    \ ‘still sexy’ not because of her looks although still a very attractive woman,\
    \ but more because of her attitude and self-belief.\n\n# Friend\n\nWhen we feel\
    \ confident we tend to deal with a situation or the task in hand in a state of\
    \ flow often barely conscious of what we are doing and perhaps even what we are"
  merge: -1
  img_proc: true
- pgno: 13
  md: 'achieving. The right amount of confidence allows us to answer the door to opportunity
    when it knock''s and knock on doors when they are closed. Even if the doors are
    shut in our face confidence allows us to try another door or walk a completely
    different path.


    # **Foe**


    There are times however, when we can be over confident in ourselves and in our
    abilities and this can lead to arrogance, complacency and even recklessness. Considering
    yourself more intelligent, more skilled or more competent than a fellow team member
    is arrogant. Not preparing sufficiently for an interview you think is in the bag
    is reckless. Speaking to or treating your partner inappropriately, because you
    think he’ll never leave you, is complacent.


    # **Master of disguise**


    A lack of confidence can also be acted out and interpreted as aloofness and even
    aggressiveness as we employ strategies to protect ourselves from showing our weaknesses
    and minimise our discomfort.


    It’s not uncommon for a shy person who runs an internal script of ‘why would they
    want to talk to me’ to be thought of as rude or anti-social. They come across
    as unapproachable. They avoid eye contact and are unable to engage in general
    chit chat. Yet, inside they are dying with discomfort and desperately wanting
    to be something different; a confident conversationalist.'
  merge: -1
  img_proc: true
- pgno: 14
  md: 'Not everyone who lacks confidence is shy. Until recently I would have included
    myself in that group. I was able to stand in front of large audiences and give
    presentations, yet at the same time suffer from the Imposter Syndrome fearing
    I would get caught out because my confidence lagged behind my competence.


    The Imposter Syndrome is a widespread phenomenon identified more than 30 years
    ago by clinical psychologists Pauline Clance and Suzanne Imes. It defines and
    describes feelings of being inauthentic in your role, feeling unworthy of the
    recognition or compensation you receive you feel like a fraud. The consequences
    of these feelings are many, not voicing your opinions or sharing your ideas, not
    asking for a raise or promoting yourself. These behaviours can fuel failure and
    frustration, emotionally strangling suffers and derailing their career because
    they won’t give themselves the permission to discover and demonstrate the leader
    within.


    On the other end of the spectrum, instead of acting passively some women adopt
    a more masculine approach and become overly aggressive. In the 2011 series of
    *The Apprentice* one of the contestants, Melody Hossaini, in an interview at the
    end of the series commented that a key learning for her from participating in
    the programme was that when she felt vulnerable she became very aggressive; a
    self-protection mechanism to hide her lack of confidence. She now realises that
    becoming comfortable with her vulnerability and being able to show and express
    it would have worked more in her favour than her ‘kick ass’ approach.'
  merge: -1
  img_proc: true
- pgno: 15
  md: 'When I ask women what confidence means to

    them their responses are pretty similar and include:


    +   - ‘to be my authentic self’,

    +   - ‘believe in myself and abilities’,

    +   - ‘feeling good about myself’,

    +   - ‘being able to do what I want’,

    +   - ‘the ability to deal with anything that comes my way personally and professionally’,

    +   - ‘to REALLY feel comfortable – not fake it’.


    Self-help gurus often advocate ‘faking it to you make it’ but I think that advice
    should come with a warning. Don’t get me wrong. Affirmations and modelling the
    behaviour of someone who has what you want can be effective in helping you acquire
    the mindset necessary to attract that skill or quality into your life, but only
    if you really believe what you are telling yourself is possible for you.


    We’ll do some work on beliefs and affirmations later in this book but right now
    just be aware that simply saying something doesn’t necessarily make it true or
    happen. Very often we have behavioural patterns that are so ingrained and powerful
    that at a very basic level contradict the words we are mouthing.


    Energetically speaking you won’t feel comfortable or be congruent with your words
    and that will come across loud and clear, not only to others, but also more importantly
    to yourself. You’ll feel like a fraud as your fear of being found out feeds a
    spiral of self-doubt, which'
  merge: -1
  img_proc: true
- pgno: 16
  md: 'in turn reduces your self-esteem and locks you in to a place where your confidence
    lags behind your competence. This gap is not just one of fear or even procrastination
    but one of self-destruction; lost to yourself and the life you are meant to live.


    # As Within, So Without


    There is a saying ‘As Within, So Without’. This is a summary of the spiritual
    Law of Reflection, which states that our outside world is an exact reflection
    of our inner world. The Universe mirrors and reflects back to us all the good
    and bad, positives and negatives within ourselves and our lives.


    If you doubt your ability or don’t value your skills and talents, you will attract
    people who will steal your ideas, take credit for your work, play hardball and
    slash your fees. If you are self-critical and constantly beating yourself up with
    your thoughts, you will attract people who will reflect this by putting you down
    with verbal, psychological and possibly physical abuse. If you don’t love and
    respect yourself, how can you expect that from others?


    # Authentic Confidence


    We know authentic confidence when we see it. There is something about the person
    that tells us they are very comfortable with who they are. They know, like and
    trust themselves. Their essence is one of ease and positive expectation, trusting
    that they can handle whatever life throws at them. They operate from a place of
    faith rather than fear, because they understand themselves and are'
  merge: -1
  img_proc: true
- pgno: 17
  md: 'open to understanding and appreciating the perspective of others without feeling
    threatened or the need to be right.


    In my mind the foundations of authentic confidence are contained within what I
    call the 3 C’s of confidence – Clarity, Communication and Courage.


    # **Clarity**


    When you are clear about who you are and what you value, what you want to give
    back to life or give life to; your purpose, a passion or a project, then attracting
    it into your life becomes so much easier. Clear thinking affords you the ability
    to be decisive, communicate your message accurately and enables others to respond
    accordingly.


    # **Communication**


    When you are able to communicate clearly in a way that respects and honours you
    and others, when you have the courage to trust your innate wisdom, to follow your
    convictions and take action, which moves you from a feeling of being lost and
    stuck to one of freedom, and fulfilment, that''s authentic confidence.


    # **Courage**


    With authentic confidence you no longer give your power away by pleasing and appeasing
    other people. Your value and self-worth isn''t wrapped up in others opinions of
    you, so you no longer feel the need to sacrifice yourself or seek others approval
    or permission to be, do and have what you want. You may seek advice and guidance
    but you don''t act on it until you check within to ensure the advised action feels
    right with and for you.'
  merge: -1
  img_proc: true
- pgno: 18
  md: 'When you hear that inner wisdom you will be ready to take the first small step
    forward. Authentic confidence doesn''t mean that you won''t feel fear about taking
    that step but what it does mean is that you have enough trust in yourself to face
    any challenge that initial step may present and remember it''s the doing, the
    action that builds competence.


    With authentic confidence you are free to be you, happy with yourself and by yourself
    if you so desire. Your masculine and feminine aspects are in balance, so that
    you can be strong without being threatening or aggressive and vulnerable without
    being or appearing weak. And, because you are being your authentic self, your
    attraction factor increases and you draw to you all the resources, support and
    nurturing you need. Your inner integrity is matched by those around you. As you
    begin to feel safe, secure, loved and happy on the inside, you learn to trust
    yourself, and the universe reflects this by surrounding you with people who love
    and support you and are as honest and generous as you are. As within, so without.


    The 9 Elements of Authentic Confidence woven through the chapters of this book
    are:


    +   - Awareness

    +   - Understanding

    +   - Truth

    +   - Honour

    +   - Energy

    +   - Nurturing

    +   - Trust

    +   - Intuition

    +   - Commitment'
  merge: -1
  img_proc: true
- pgno: 19
  md: 'Authentic confidence requires self-awareness, to become conscious of the inner
    game that thoughts play and the impact they have on our emotions and performance.
    It also requires you to understand how the people and events in your past and
    present have shaped and influenced you and why you may have to let some of these
    go to allow you to have the future you want.


    You understand and appreciate it is ‘how’ you are being rather than ‘who’ you
    are being that will determine the quality of your life. Authentic confidence allows
    you to be true to yourself and honest with yourself about yourself, the good,
    the bad and the ugly and accepting that you are loveable and OK in spite of it.
    You honour yourself by living by your values and standing by your boundaries,
    being responsible and recognising how cause and effect plays out in your life.
    For every action there is a reaction or consequence.


    You notice, and come to know, that everything in life consists of energy and has
    a vibration. I first became aware of this when I was teaching. Whenever I was
    tired or stressed I found the pupils challenging and badly behaved. Whenever I
    was energetic and happy I had fun learning and teaching. Fear is a heavy vibration,
    a lack of self-worth comes from negative self-talk which emits a low vibration
    and as we now know this combination will attract situations, individuals and circumstances
    of a similarly low vibration. On the other hand, self-worth and confidence radiate
    a high vibration and attracts people, situations and opportunities that match
    it. Knowing how to nurture oneself and the importance of consistently doing it,
    is key to developing authentic confidence, especially in moments of crisis. Never
    forget that we teach people how to treat us and by respecting ourselves and by
    caring for'
  merge: -1
  img_proc: true
- pgno: 20
  md: 'our mind, body and spirit we teach others to treat us well too.


    Often called ‘intuition’, or the inner voice of feminine wisdom, call it what
    you will, but with authentic confidence you listen to it and in my experience
    it never fails to guide you to the correct path. And finally authentic confidence
    enables a commitment to self. It allows you to know that you deserve to have,
    to be and to do what you want and to be committed to doing whatever it takes to
    get there one small step at a time.


    Now that may sound scary and a lot of hard work is needed to get you to that authentic
    place. All you have to do right now is believe in my belief in you. I encourage
    you to stay committed to your development and remember that you reap what you
    sow. I’ve been where you are now and have been seduced by promises of instant
    confidence but it’s never lasted. What I will say is that you owe it to yourself
    to invest in yourself. You are worth the time and effort.


    Lance Armstrong the famous cyclist and seven times winner of the Tour de France
    said, “You can’t fake confidence, you have to earn it, you have to do the work.”


    You and I both know folk fake confidence all the time but what I do know is you
    can’t fake authentic confidence because it takes a depth of self-knowledge, self-acceptance
    and self-worth that can’t be faked and the great thing about authentic confidence
    is that it never feels like you’ve earned it but rather that you’ve rediscovered
    it because it’s been there, within, all the time.'
  merge: -1
  img_proc: true
- pgno: 21
  md: '# An Overview of the Confident You


    We don''t lack confidence in everything; we lack confidence in specific activities,
    within specific areas of life. The following exercise will provide an opportunity
    for you to consider the level of confidence you currently have in different areas
    of your life. It will provide you with the necessary focus and information for
    the rest of the activities in the book and provide an excellent opportunity for
    you to reflect on and review the current state of play in each area as well as
    how you would like each area to look in the future. You might also like to consider
    what kind of beliefs and thoughts you hold about you in those areas where your
    confidence is high and compare them to those you hold in areas where your confidence
    is low.


    # Exercise


    **The Wheel of Confidence** on the next page consists of sections representing
    the broad areas of your life. I invite you to look at each of the sections and
    rate your level of confidence in each area on a scale of 1 to 10.


    A rating of ''1'' represents low levels of confidence within this area of your
    life, it''s likely you are very unhappy with the way things are in this area too.


    A ''10'' represents a very high level of confidence and you are most likely to
    be totally content with this area of your life.'
  merge: -1
  img_proc: true
- pgno: 22
  md: '![](img/7cf73384b5e10c5a70e940a706554730_22_0.png)


    Before you begin to allocate a rating you might like to consider some of the questions
    I offer for your reflection for each area


    **Health & Wellbeing:** Things to consider in this area are your physical fitness:
    exercise regime, diet, energy and stress levels.


    +   * What kind of shape are you in both physically and mentally?

    +   * Are you strong and healthy or could you be looking after yourself better?


    **Relationships:** This section refers to your personal relationships with family,
    friends and significant others. I suggest you consider each separately as it will
    be a good source of information for future exercises.'
  merge: -1
  img_proc: true
- pgno: 23
  md: '+   - Do you feel comfortable enough to be yourself in this relationship? Do
    you feel loved and supported?

    +   - Are you able to ask for what you want and need without fear of rejection
    or a critical response?

    +   - Do you feel visible and heard?


    **Social:** Is your social life how you would like it to be?


    +   - Do you see friends often enough?

    +   - Do you participate in a range of social events or do you do the same thing
    most of the time because it’s comfortable?

    +   - Do you have the confidence to go out or do you tend to socialise at home?

    +   - Do you feel confident enough to meet new people and make new friends?

    +   - How do you feel about talking to strangers, do you strike up conversations
