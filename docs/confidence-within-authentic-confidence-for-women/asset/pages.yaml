- pgno: 7
  md: '# Introduction


    Confidence is a bit like a pendulum swinging from one extreme to another. It’s
    in a constant state of flux for everyone, believe me, I’ve coached enough people
    to know this, nobody and I mean nobody is confident all the time and in every
    situation.


    But there can come a time at any point in one’s life, no matter how outwardly
    successful you are or perceived to be, you just don’t feel it on the inside. You
    feel like a fraud, an imposter and you fear that you’re going to get found out.
    Your confidence lags behind your competence.


    Been there, done that, and I know only too well how horribly debilitating that
    can be. I remember feeling completely disconnected to the female staring back
    at me in the mirror, she looked good, she walked and talked with confidence but
    inside I felt empty and fearful of being found out, because I didn’t believe in
    me and doubted the words of others who did.


    I am sure there will be people who know me, who will be surprised to get that
    insight because outwardly I appeared very together. Seeing others achieve in a
    way I desired but being frozen by fear I had to learn and develop confidence crisis
    strategies that worked when required, but authentic confidence only came when
    I learned to accept and value myself and connect with my inner wisdom.


    The purpose of this book, whilst containing a fusion of confidence boosting tips
    and techniques, is to take you on a journey of self-re-discovery. We’ll start
    by'
  merge: -1
  img_proc: true
- pgno: 8
  md: 'examining what confidence really is, how it affects our perceptions; of ourselves,
    our capabilities and others. How confidence can work for us and against us in
    situations and the attributes and attraction of natural confidence.


    I’ll provide you with a road map to get to that authentic place, where you accept
    and appreciate yourself, a place from which you can develop confidence within
    and learn to prosper. You will learn how to acknowledge and process your past
    so that you can leave the baggage and the limiting beliefs behind and use the
    insights and learning gained from it to inform, step up and into your desired
    future.


    I aim to take you to that place where you learn to honour yourself, where you
    see the power of daring to dream and where you give yourself permission to believe;
    you can be who you want to be and get what you want out of life. You will learn
    to recognise your resilience and develop your personal resources for life lasting
    confidence and most importantly to trust your inner wisdom and that still, small
    voice within that whispers, “You CAN DO It.”'
  merge: -1
  img_proc: true
- pgno: 9
  md: '# A bit about me and my journey


    My entire career has revolved around working with people, helping them to see
    and develop their own potential. Firstly, I worked as a secondary school guidance
    teacher with young people and then moved into the management and delivery of professional
    and personal development programmes for staff in the public and private sector.


    Five years ago, I was made redundant from my post as contract manager with a training
    company. Whilst I was happy to move on from that position, I hadn’t realised how
    much of my identity was tied up in it or how being unemployed, and the challenges
    it brought, would affect my confidence.


    I had a good professional reputation, but I lacked direction. I felt lost and
    thought that I lacked options although that was not really true. I was getting
    interviews but I was sabotaging them, but not really understanding why. On reflection,
    I think deep down my desire to run my own business was probably stronger than
    even I was conscious of.


    I trained as a professional coach and set up my coaching and consultancy business
    which brought with it a whole load of other challenges to my confidence; networking,
    pitching, tendering and negotiating fees. None of these skills were new to me
    but I lacked the confidence to make that connection and to transfer the skills
    I was competent in to my new business.'
  merge: -1
  img_proc: true
- pgno: 10
  md: 'If I’m being honest, I took any form of rejection personally. I lacked self-belief
    and was often confused and even horrified by those who did believe in me. The
    gap between my confidence and my competence was so huge that I was always looking
    for a plan B just in case my business failed. With another business women I set
    up a business network, which I ran successfully for two years. I trained as a
    Pilates instructor – neither of which was easy, believe me!


    Yet I still lacked self-esteem and belief in my ability to achieve my ambitions
    and see myself as a success. I was always seeking approval, permission and validation
    from others about my worth and capabilities. At the time I thought I was alone
    in feeling this way, what I’ve learned is that most women feel this way at some
    point.


    I’ve read loads of books on personal, professional and spiritual development.
    I’ve employed coaches, attended hundreds of training courses, webinars as well
    as being a member of online forums and a mastermind group to help me in my quest
    to close the confidence-competence gap. But it was only when I did the inner work
    and reconnected to my feminine wisdom that I was led to a place of trust, peace,
    balance and wellbeing. Confident in who I am and what I have to offer is of value.'
  merge: -1
  img_proc: true
