- pgno: 45
  md: "# Exercise\n\nSet out three different spaces on the floor, numbered 1 to 3.\
    \ Each will have a different function and afford you a different perspective.\n\
    \n+   - In the first position, you will be looking out through your own eyes.\n\
    +   - In position two you will be the other party stepping into their shoes and\
    \ imagining what it is like for them (this can be 1 person or a group if it works\
    \ the same).\n+   - The third position involves taking an independent view, you\
    \ get to step back and have a look at the two parties more dispassionately.\n\n\
    Choose a relationship you would like to explore.\n\n+   - Stand in position 1\
    \ and imagine looking at the other person. Ask yourself, “What am I experiencing?\
    \ What am I thinking? Feeling? etc. as I look at this person?”\n+   \n+     Ask\
    \ any questions you might have for the person you’ve put in position 2\n+   \n\
    +     Shake that position off!\n+   \n+   - Go to position 2, imagine you are\
    \ that person looking back at you in the first position. And ask yourself again,\
    \ “What am I experiencing? What am I thinking? Feeling? etc. as I look at this\
    \ person?”"
  merge: -1
  img_proc: true
