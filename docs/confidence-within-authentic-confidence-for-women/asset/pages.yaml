- pgno: 88
  md: 'In a recent workshop, a woman struggled to see her achievements or what her
    greatest contributions were. She was genuinely stuck and blind to herself. With
    a little digging we uncovered that she had abseiled down Glasgow University Tower
    to raise a considerable amount of money for charity. She had raised three children
    on her own, recently passed her driving test, was very successful in her role
    as a learning support assistant in a secondary school. Once we uncovered these
    she was on a roll and amazed herself and her colleagues who were dumbfounded by
    her achievements, but more so by her failure to recognise, share and celebrate
    them. Her attitude was one of ‘so what’ but through discussion she realised that
    not everyone could do what she did. Because it was easy for her, she failed to
    recognise and value her skills, talents and personal attributes; care, kindness
    and compassion for the pupils in her care and her colleagues.


    The chances are you too are overlooking your uniqueness and a lot of what comes
    easy to you. You have possibly forgotten all that you have achieved. Take this
    opportunity to see yourself with fresh eyes and complete your confidence resume.


    To construct your confidence resume I suggest you review your life and reflect
    on your achievements. You might find it useful to do this in 5-10 year periods
    and consider the following questions:


    +   - What where your confidence highs and lows during this time?

    +   - What significant events would you include?

    +   - What insights and learning can you take from those times?'
