- pgno: 51
  md: '# Chapter 3 - You’re not the girl you think you are


    > *“Choose beliefs that serve your soul - choose beliefs that serve the grander
    dream of who you choose to be”.*


    Joy Page


    We humans are meaning makers. We can take any experience of our lives and create
    a meaning that either empowers us or holds us back. One woman’s nightmare is another
    woman’s dream. It really is a question of perspective and expectation, which then
    becomes a self-fulfilling prophecy as what you believe to be true of you becomes
    exactly so. You see we humans also need to be right, so we search for and accumulate
    evidence to prove our position.


    The other evening I was out with some friends for a little celebration. One of
    my single friends declared to have lost all interest in men, claiming only to
    attract losers, idiots and drunkards, whilst refuting all disagreements to the
    contrary. As we were leaving the bar a drunk man passed and shouted across, “Hello
    ya big darlin’!”


    > “See, see what I mean,” she retorted.


    Absolutely! You see that’s exactly what she expected and that’s what she attracted.
    Another friend is very confident in her attraction factor and is never without
    a dinner date. She expects the best and gets it and is often whisked off to some
    exotic resort with her current beau.'
  merge: -1
  img_proc: true
- pgno: 52
  md: 'We form our beliefs as a result of our experiences and experiences are the
    result of our beliefs. I think it''s important to be aware of how the brain manages
    our experiences because that awareness can help us consider whether the beliefs
    we hold help or hinder us. It is in this chapter we again consider the T of Authentic
    confidence looking for the truth within our beliefs and uncovering any lies they
    may hold within them.


    # ### How the brain manages our experiences


    To prevent sensory overload we pay attention to certain dimensions of our experience
    and exclude others. What is deleted is out of our conscious awareness. Now this
    can be useful or not, depending on the application.


    *For example, when you are concentrating on a task* in a busy office you can delete
    the noise surrounding you and focus on the task in hand. That''s when deleting
    is useful. Sometimes it''s not useful when you hear only criticisms and none of
    the compliments.


    When Laura came to see me she was very down and stressed about her career in the
    Fire and Rescue service. She was concerned about feedback she had received about
    her performance and in particular her ability to work in a busy environment often
    being teased by her colleagues as ''zoning out''. When we looked over Laura''s
    CV and her annual appraisal documentation we discovered that things were not as
    bleak as she had come to believe. Firstly, she had failed to acknowledge to herself
    that she was on a learning curve for a new career and wouldn''t be expected to
    know it all. She had been in the fire service less than 2 years having previously
    spent 10 years in a library. When she recognised that the ''zoning'
  merge: -1
  img_proc: true
- pgno: 53
  md: 'out’ was not day dreaming but pure concentration on getting paperwork completed
    in a noisy environment she was able to change her perception of this from a fault
    to a skill. When she focused on what had gone well during her working day she
    realised that her successes far outnumbered what she perceived as failure. Instead
    of interpreting the things that hadn’t gone so well as failure she began to see
    it as feedback which she used to propel her career forward.


    We also distort what we see, hear and feel. Distortion is all about the meaning
    we make of our experience. We create meaning that helps or hinders, but seldom
    do we question the meaning we are making.


    Have you ever caught someone looking at you and maybe smiling, and you start to
    get annoyed thinking, ‘What are they looking at?’ and thinking them really rude
    or laughing at you. Then when they pass you they give you a compliment like, “I
    love your shoes. Where did you get them?” Or have you ever heard someone say,
    “He never buys me flowers so he doesn’t love me.” but when challenged, that person
    could find a host of other examples which demonstrate how their partner loves
    them. For example, breakfast in bed, cleaning their car.


    We also make sweeping statements and generalise an experience by applying it to
    a multitude of other situations just like my friend who always attracts losers
    and fails to count the really nice guys she has dated or find her attractive.


    Beliefs are ideas that you hold on to and deeply trust. They can be positive and
    empowering or negative and disempowering and they have a profound effect on'
  merge: -1
  img_proc: true
- pgno: 54
  md: 'our levels of self-confidence. Seldom do we question our beliefs because we
    hold them to be true at the core of our being. Authentic confidence allows us
    to uncover any lies within our beliefs by questioning and uncovering the truth
    behind what we believe about ourselves, others and the world, and examining the
    generalisations we make and the information we distort or delete.


    Our confidence is challenged when we hold unhelpful beliefs around what is possible
    for us, our ability to achieve it and, perhaps most worryingly, whether we are
    worthy of it. It is not uncommon for these beliefs to come from the influence
    of what others have told us or their expectations of us e.g. the media, parents,
    teachers, colleagues, bosses and partners.


    Let’s say you had a couple of relationships that ended badly. You may come to
    believe that you are no good at relationships (generalisation). In fact, you may
    have been told this from an ex-partner which only serves to reinforce that belief.
    I’m sure however there were times when you were both happy and things were going
    well and the relationship was good (deletions). You have other relationships with
    friends, family and colleagues that are fulfilling.


    By now you are getting the picture of how your thinking can be distorted. What
    I would suggest is that you don’t currently have an effective and successful strategy
    for nurturing romantic relationships. Fortunately, this can be explored and developed
    until you are able to enjoy a fulfilling relationship. This is true of anything
    that you desire, which you currently believe is out of your reach. You will never
    achieve it until you challenge the limiting belief and change the can’t do attitude
    to a CAN DO!'
  merge: -1
  img_proc: true
- pgno: 55
  md: '# Exercise


    If you are carrying the burden of a belief ingrained in you from someone in your
    past – a parent, teacher, partner – it’s time to return the belief back to its
    source.


    The following exercise will help you do this. It works equally well for emotions
    and secrets without you having to disclose them.


    +   - Get very clear about what the belief is and the emotions related to it.

    +   - Mentally put the belief in a box and wrap it up.

    +   - Visualise the source of that belief – teacher, parent, sibling - standing
    in front of you.

    +   - Greet them and then say out loud, “This belief does not serve me or belong
    to me and I give it back to you, its source.”

    +   - See in your mind’s eye the person take the box.

    +   - Then say, “Bless you, now bless off,” and watch them and their belief box
    disappear.


    Limiting beliefs are the major culprits that prevent us from achieving our aspirations
    and living the life we desire. Buried deep in our subconscious, they are often
    tied into our self-image and our perceptions of the world. On the plus side, they
    are self-protective and survival oriented. On the negative side, they act as rules
    that keep us from attaining the possible, restraining us from what we are capable
    of and what we deserve.


    You see when a person states a limiting belief they are often focusing on what
    they don’t want (limitation), rather than what they do want (outcome). Limiting
    beliefs'
  merge: -1
  img_proc: true
- pgno: 56
  md: 'can also sometimes confuse identity with behaviour. Unhelpful identity labels
    like ''I''m shy'' or ''I''m a slow learner'' imply that these are fixed qualities,
    rather than a combination of ideas, feelings and behaviours.


    A few years back sales was a dirty word to me. I hated it. Rather than focusing
    on the sales I made my focus was on the rejections, which eventually developed
    into a limiting belief of ''I''m no good at sales''. When I explored this belief
    with my NLP training buddy Ben, a superb salesman, I had a belief busting moment.


    I explained to Ben that I enjoyed meeting people and talking to them about how
    I could help them and how I worked but I always got really uncomfortable with
    what I saw as the ''here comes the sales bit''.


    Ben and I explored things further, discussing how the belief ''I can''t sell''
    served me and if it were true. Looking at the facts - I had a regular flow of
    consultancy and coaching work with repeat clients. I had a large list of subscribers
    to my newsletter and online community. I had a substantial database of subscribers
    to GROW, my networking business, with a good number of business owners attending
    each event. I began to see that the belief wasn''t true, it was a lie - the evidence
    proved it. The belief was merely a protection racket, to save me from the rejection
    I feared.


    If you hear yourself using words or hearing words like ''can''t, should, shouldn''t,
    could, couldn''t, would, ought or ought not'' chances are there is a limiting
    belief lurking around. Be aware of your language, because once you are aware of
    it you can do something about it.'
  merge: -1
