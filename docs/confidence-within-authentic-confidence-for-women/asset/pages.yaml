- pgno: 41
  md: 'Forgiveness can be used to take the moral high ground - to be better than an
    enemy or wrongdoer. True forgiveness is that of ‘forgiving and forgetting’, it
    is to remove all emotional attachment to a wrong that has been done to you, to
    let go of the memory and the hurt as if it never occurred.


    The need to be right can be a huge obstacle to forgiveness. Being right can give
    one a sense of security, but the ‘need’ to be right is destructive to relationships
    and often masks feelings of insecurity. True forgiveness is about giving up the
    need to be right or wrong - all the time.


    The need for revenge or the desire to cut people off and out of our lives, whilst
    resentment brews and stews, is easier initially but can lead to loneliness and
    disease until our hurt or anger fades. It can be much more helpful to sit with
    those feelings accepting that it’s ok to feel what you feel, because they are
    a reaction to a violation of one of your values. It is this acceptance, which
    facilitates the letting go process.'
