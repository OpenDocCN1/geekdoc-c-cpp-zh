- pgno: 39
  md: '# Telling the Truth


    Now we come to the healing heart of the matter, the third element of authentic
    confidence **Truth**. This will require courage and integrity as I invite you
    to tell the truth about yourself to yourself, for in doing so you no longer remain
    a victim haunted by the memories or scars of the confidence slumps you have experienced
    in the past or even today. You will be empowered by the knowledge and acknowledgement
    of the role you played in attracting those situations and people to you. You will
    take ownership of your deep and true feelings about yourself rather than listen
    to and be held back by the opinions of others. For their thoughts of you, are
    only thoughts and only true of you if you believe them to be.


    On reviewing each of the events or circumstances that have had a negative impact
    on your confidence I invite you to reflect on how you were feeling about yourself
    at the time.


    +   - Did you consider yourself not good enough?

    +   - Perhaps you considered yourself less than, the people and the circumstances
    surrounding you?

    +   - Might your ego be responsible for attracting a challenge to your confidence?


    *I want you to identify how in each situation you might be responsible for the
    result.*


    It might be something you did, it might be something you failed to do, or the
    way you set yourself up for the result e.g. failing to see the warning signs or
    choosing not to believe what you were seeing or hearing.'
