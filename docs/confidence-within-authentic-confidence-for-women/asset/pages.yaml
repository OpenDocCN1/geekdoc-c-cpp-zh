    # Physical Releasing


    If the negative energy from experiences and emotions are not expressed they stay
    within where they can do varying degrees of harm. Take the emotion of anger it
    gets a lot of bad press in terms of emotions and has become a bit of a taboo.
    Yet there is nothing wrong with anger, it’s a perfectly natural and acceptable
    emotion it’s how it is expressed that can cause concern, if it’s not given a safe
    voice it will find it’s way to express itself in a torrent of rage at an inappropriate
    time or in the body through cuts and burns, burning sensations, boils and inflammation.
    Louise Hay’s *‘You Can Heal Your Life’* and Debbie Shapiro’s *‘Your Body Speaks
    Your Mind’* are excellent books for helping to understand how emotions link to
    illness or imbalances in the body.


    I have found the following ways to physically release experiences and emotions
    really helpful.


    Give yourself permission to get in touch with your pain and allow the tears to
    flow. I used to be quite challenged by this I guess because I believed tears were
    a sign of weakness and ‘big girls don’t cry’ – well they do and they should and
    I knew that intellectually, but emotionally, I needed another excuse for it so
    I’d watch the film *Stepmom*, which is about the relationship between'
