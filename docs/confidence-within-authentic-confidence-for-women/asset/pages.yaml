  md: '# Take a heart centered approach to decision making


    When it comes to decision making get out of your head and as the song says ‘Listen
    to your heart’. Go to a quiet place on your own and centre yourself by breathing
    deeply. Once you feel a deep sense of peace, you can ask yourself the following
    questions:


    +   - What do I need to know before I make this decision?

    +   - What’s the best way for me to deal with this situation?

    +   - What do I have to do now?


    Be still and patient and trust the answers will arise.


    # Delegate


    Do the tasks you enjoy and are good at and ditch those that don’t play to your
    strengths. You can delegate these to someone who is better at them and this will
    free up your time and energy.


