    # COMPUTER CODES


    Digital systems use signals with distinct values and their circuit elements have
    two stable states. Any discrete information can be represented with a binary code.
    The code must be in the binary form because computers can only read 1s and 0s.


    Instructions in English must be converted to the binary form. A group of 8 bits
    in a pattern is known as a byte. The bit pattern of a byte represents an alphanumeric
    or character controller.


    Characters used in computer include alphabetic characters (''A'' to ''Z'' and
    ''a'' to ''z''), numeric characters (0 to 9), special characters (+, ~, *, %,
    %, etc.), punctuation, spaces and many more characters available on the keyboard,
    also some control characters which performs certain action that are not visible.
    Also the signed and unsigned integers need to be represented. In particular, all
    these characters need to be represented in binary form. After, all computers store
    and manage 0s and 1s, these 0s and 1s are just abstractions. But, the implementation
    is as pulsing electronic signals. Unsigned and unsigned integers'' complement
    are used to represent unsigned and signed integers respectively. Many codes are
    available for character representation; BCD, ASCII and EBCDIC are some of the
    popularly followed codes. The most common character representation in microcomputer
    is ASCII, which stands for American Standard Code for Information Exchange. Extended
    Binary Coded Decimal Interchange Code (EBCDIC) is used mainly on IBM mainframe
    computers. Binary Coded Decimal (BCD) was used in decimal computers of earlier
    periods.


    # Binary Coded Decimal (BCD)


    In digital electronics, binary-coded decimal (BCD) is a set of binary coding of
    decimal numbers. Previously, Binary Coded Decimal (BCD) was used as memory codes;
    it is based on the concept of converting each digit of a decimal number into its
    binary equivalent rather than converting the entire decimal value into a binary
    form. Each decimal digit is represented by a group of 4 or 6 bits. Table 2.4 shows
    the BCD equivalent of the decimal digits, it uses 4 digits to represent each of
    the digits.'
