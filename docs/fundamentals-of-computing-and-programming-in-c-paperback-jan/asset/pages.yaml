  md: '# FC-132 Fundamentals of Computing


    Just as computer hardware has improved over the years, programming languages have
    also moved from machine languages (that use strings of binary 0s and 1s) to programming
    languages (that use common English terms).


    # STAGES OF DEVELOPMENT OF COMPUTER PROGRAMMING LANGUAGES


    The various stages of development and the generations of computer languages are
    discussed here.


    # First-generation Language (1940-50)


    The first-generation language is also called as Machine Language. In first-generation
    language, all instructions were given in the binary form and is referred to machine
    language or low-level language (LLL). It is very difficult to use or read instructions
    written in binary. For example the instruction in binary codes is given below


    ```

    0100 0011001    0101 00110011

    ```


    A typical machine language instruction consists of two parts as given below.


    | OPCODE | OPERAND |

    | (Operation code) | (Memory location) |


    +   (i) Operation code which specifies the operation to be performed.


    +   (ii) Memory location or memory address which identifies the storage location
    of the memory.


    # Advantages of machine language


    +   (a) Since no translation is required, the machine language instructions can
    be executed directly by the machine/computer.


    +   (b) Machine language instructions are fast in execution because the memory
    and registers are used efficiently by the instruction code.


    +   (c) Bitwise operation is possible to manipulate the data at binary digit level.


    # Disadvantages of machine language


    +   (a) Machine language instructions are machine/computer dependent and are not
    compatible to another type of machine/computer.


    +   (b) Very difficult to write machine language programs. It is a challenging
    job for the programmer to read and write the binary instructions.


    +   (c) More time is wasted as it takes considerable time to write the instruction
    code by remembering all opcodes and memory locations.


    +   (d) Trained programmers with high programming skills are required to write
    the instruction code or program.'
