    # Decision Structure or Selection Structure


    The decision or selection structure is used in the algorithm or pseudocode to
    make a choice of two alternatives by making a decision depending on a situation
    or condition. Pseudocode form of the decision structure is given below.


    ```

    If condition is TRUE then

    Do Statements Block-A

    else

    Do Statements Block-B

    endif

    ```


    In this example, the condition is evaluated, if the condition is true Statements
    Block-A is executed and if it is false, Statements Block-B is executed. Note that
    there are many occasions where a program is required to take alternative actions.
    In the following example, an IF statement with relational operators test the value
    of a condition for true or false as well as to execute Statements Block accordingly.


    ```

    If a > b then

    print "Biggest number is A"

    else

    print "Biggest number is B"

    endif

    ```


    It is optional to have the action block for the test condition for FALSE as given
    below.


    ```

    If b > Big then

    Big = b

    endif

    ```


    The relational operators used in the conditions are:


    +   > is greater than


    +   < is less than'
