  md: '# FC-30 Fundamentals of Computing


    # Hard Disk


    Hard disk is a reliable and permanent storage disk. It has a set of metal disks
    coated with magnetic material and are mounted on a central spindle which rotates
    at 7200 rpm (Figure 1.29). Unlike floppy disk, disk rotates continuously. The
    HDD has a set of read/write heads which are mounted on an arm. Latest hard disks
    are available with storage capacity up to 2 TB.


    ![](img/2e39d133c87ea945283efbb3d9eac1b7_59_0.png)


    (i) Hard disk drive (ii) Internal view of hard disk


    Figure 1.29 Hard disk


    A hard disk pack has a collection of several (6 or 7) hard disk platters stacked
    one above another to have high storage capacity. Remember that the disks have
    tracks. A collection of same tracks across all the disks is called cylinder. In
    order to read a specified file, the access mechanism with the head moves to the
    specified cylinder. Note that the file information is stored simultaneously in
    all the tracks in the cylinder and the mechanism will access data on one cylinder
    at a time.


    The advantages of a hard disk are high storage capacity, speed of operation, and
    reliable storage media mainly in personal computers. External physical disturbances
    to the drive may lead to the damage of disk surface or read/write head. This is
    a major disadvantage of hard disk.


    # Compact Disk


    Compact disk (CD) is an optical disk used to store data permanently. It is the
    most reliable storage media available today. Data stored on a compact disk cannot
    be erased. The CD drives commonly available are read only. Read/write CD drives
    are also available but are expensive. Storage capacity of a CD is 700 MB.


    In the optical disk technology, a high power beam is used to record data by burning
    pits in the surface of the hard plastic disk. To read the data, a low power laser
    beam is used to scan the disk surface (Figure 1.30). When the laser beam reflects
    from the smooth surface of the disk it is interpreted as a 1 bit, and when the
    beam enters the tiny pits it is interpreted as a 0 bit. Remember that the data
    are stored as binaries.'
