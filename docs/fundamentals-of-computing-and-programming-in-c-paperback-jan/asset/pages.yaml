    ```\n\nThis will also produce the same result.\n\n# 14.b Write a C program to\
    \ perform binary search to a set of N numbers using a function. Solution\n\nThe\
    \ binary search method is used to search a number in a set of N numbers when the\
    \ numbers are arranged in ascending order. This method is faster than the linear\
    \ search method.\n\nThe number to be searched is compared with the middle number\
    \ in the list. If the number is smaller, then the other numbers to the right of\
    \ the middle number will be neglected. Similarly, the middle number of the remaining\
    \ numbers is compared and any one half is neglected, and this process is repeated\
    \ until the list is obtained.\n\nConsider a list of 10 numbers as given below.\n\
    \nLet 19 be the number to be searched in that list.\n\nstart           middle\
    \          end\n↓               ↓               ↓\n\nSince the number to be searched\
    \ is smaller than the middle number, the numbers beyond the middle number are\
    \ neglected.\n\nstart  middle  end\n↓       ↓       ↓\n0      1       2   3  \
    \ 4\n-3     8       13  19  21\n\nAgain the number to be searched is compared\
    \ with the middle number of the remaining numbers and the smaller numbers to the\
    \ left are neglected.\n\nstart  middle  end\n↓       ↓       ↓\n2      3     \
    \  4\n13     19      21"
