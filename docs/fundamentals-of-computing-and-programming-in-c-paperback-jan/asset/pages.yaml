  md: '# FC-152 Fundamentals of Computing


    +   (i) It permits to use mnemonics in program which makes programming easier.

    (ii) It also permits the symbolic names/variables to represent data.

    (iii) It translates the mnemonic codes to machine code and allocates corresponding
    memory addresses for symbolic names.

    (iv) It verifies the source program and generates error messages for any error
    in the program.

    (v) It assists to print/display program output during program execution.


    # Compiler


    A compiler is a translator that translates the whole source program developed
    in a high-level language into a machine/computer readable object program. A compiler
    is also a set of computer program that transforms the source code of the programming
    language into object code in binary form. This is necessitated to transform source
    code to create an executable program. The executable program can be run by the
    user by supplying input data and the output results are obtained. If the compiled
    program can run on a computer whose CPU or operating system is different from
    the one on which the compiler runs, the compiler is known as a cross-compiler.
    Different compilers are available for different programming languages. The various
    stages in compilations of programs are shown in Figure 5.14.


    ![](img/2e39d133c87ea945283efbb3d9eac1b7_181_0.png)'
  merge: -1
  pgno: 181
- img_proc: true
  md: '# Introduction to Programming Languages FC-13


    When the translation process takes place, the compiler reads the source program
    and checks the syntax errors. Note that syntax (grammatical) error is any deviation
    from the accepted structure of the statements and functions in the program. Also
    note that logical error is an error in the program which leads to unaccepted or
    wrong results which cannot be detected by the compiler. If there is any syntax
    error, the compiler detects and displays the error message on the screen. The
    syntax error must be corrected and the program is compiled again to generate the
    object program. Compiler will not generate the object program until the syntax
    errors are rectified.


    After compilation, an executable program is generated from the object program
    by the computer and is saved on the disk, which can be run to produce the desired
    result. The executable program is generated, there is no need for the actual source
    program. But, it may be retained on disk for any future modification. The new
    source program can be recompiled to generate the new executable program.


    # Interpreter


    An interpreter is also a translator that translates a statement or line in the
    source program and executes the same immediately after the statement is typed
    by the user or before translating the next statement of the source program. If
    any syntax error is encountered in that statement, the execution of the program
    statement is terminated and an error message is displayed. The complete source
    program is typed line by line and the translation/interpretation and execution
    takes place by line.


    ![](img/2e39d133c87ea945283efbb3d9eac1b7_182_0.png)


    **Figure 5.15** Steps involved in interpreter'
  merge: -1
  pgno: 182
- img_proc: true
  md: '# FC-154 Fundamentals of Computing


    An interpreter is also a computer program that directly translates and executes
    the instruction written in the programming language. BASIC and LISP are popular
    programming languages that use interpreters.ters are easy to use and understand
    for beginners of computer programming. Interpreters are not proved to be useful
    for solving complex problems and are suitable only for procedural programming.
    Interpreter is unique to a language and is used to interpret the instruction of
    that programming language. The steps involved in interpreter is shown in Figure
    5.15.


    # Linker


    A linker links or combines all program subroutines and modules to generate the
    single program as executable or command program. The executable program is represented
    with the .EXE extension and the command program is represented with the COM extension.
    The computer program for specific application like train ticket reservation uses
    some subroutines or subprograms, storage devices, printing devices etc, available
    in the computer system. A linker is a program that links the devices like keyboard,
    monitor, printer, etc. It also links the built-in library functions and all the
    subprograms or small modules of the main program. The linking process takes place
    after the compilation of the developed program.


