    # Insertion in a list


    To insert a node at the beginning of an existing linked list, follow these steps:


    +   (i) Initialize, allocate memory and accept data into a node. Let us call this
    node new.

    (ii) Make new''s next point to the first node in the list. This can be done by


    ```

    new->next = start;

    ```


    +   (iii) Make start point to new (i.e., making the first node). This can be done
    by


    ```

    start=new;

    ```


    The above steps are illustrated in Fig 13.2


    ![](img/2e39d133c87ea945283efbb3d9eac1b7_491_0.png)


    Fig 13.2


    # Creation of a Singly Linked List


    Creating a singly linked list is nothing like inserting into an empty list. Follow
    the same set of steps under insertion with just an additional step - check the
    value of start is equal to NULL, which means the list is empty. This involves
    twosteps(Fig, 13.2)


    +   (i) Creating a new node (allocate memory for the node and accept data into
    it).

    (ii) Storing the address of the node created in start.


    ```

    start=new;

    ```


    # Deletion in a Singly Linked List


    Deletion in a singly linked list involves one of the following situations:


    +   (i) Deleting a node at the beginning of the list

    (ii) Deleting in the middle of the list.'
