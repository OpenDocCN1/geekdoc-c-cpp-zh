  md: '# UNIT-V


    # Dynamic Allocation and Command Line Arguments


    # Dynamic Memory Allocation


    +   19. Write a program for creating and displaying a linked list.


    Procedure

    A list refers to a sequential organization of items. Array allocates memory of
    size we determine in the beginning which can later be used for storing values.
    We may not know the required size initially. In such situations linked lists are
    used. In a linked list each item contains a link to the adjacent node. Each structure
    of a list consists of two parts, containing the data and the other containing
    the link to the adjacent node.


    A linked list is a chain of structures in memory. Each of these structures contains
    data as well as a pointer to the next logical structure in the list. Fig 15.1
    shows a list of employee codes


    ![](img/2e39d133c87ea945283efbb3d9eac1b7_567_0.png)


    Fig 15.1


    There are four nodes (each link is referred to as a node) consisting of two parts.
    They are data part and the address part. The data part consists of employees''
    codes. The address part contains the address of the next node in the list. The
    start node contains the address of the first node in the list. The address part
    of the last node contains an X, since there is no node to point to. Hence the
    value contained in the address part of the last node is a NULL.


    There are several types of lists, two of which are given:-


    +   (i) Singly Linked List in which each node contains the address of the next
    node in the list. The start node points to the first node in the list.


    +   (ii) Doubly Linked List in which each node contains the address of the next
    node as well as the previous node in the list. The start node points to the first
    node in the list and the end node points to the last node.


    # Singly Linked Lists


    The operations that can be performed on singly linked lists are as follows:'
