  md: '# Preface and Acknowledgements


    This book is a perfect blend of concepts of computers and programming in C language.
    All that is required of a beginner programmer is not experience in computing but
    interest in computing.


    This book is divided into three parts.


    Part I deals with the fundamentals of computers, number systems, computer hardware,
    planning a computer program, algorithm, flowchart, pseudocode, problem solving
    and programming, stages in software development cycle and computer programming
    languages.


    Part II deals with fundamentals of C programming. It provides exposure to write
    algorithm and flowcharting that help students write C programs effectively.


    Part III deals with suggested laboratory exercises in C programming.


    The programs illustrated in the book have been accumulated, experimented and tested
    by us during our teaching of this subject to thousands of students over many years.
    In addition, numerous problems are adapted from university question papers. Short
    questions and answers are an added feature. All these would build confidence of
    students in computer programming.


    I am highly indebted to the former Chairman Dr KCG Verghese and thanks to the
    Chancellor Dr. (Mrs.) Elizabeth Verghese; Pro Chancellor Dr. Anand Jok Verghese;
    Vice-Chancellor Dr. S. Ramakrishnan and Directors, Dr. Aby Sam, Mr. Ashok Verghese,
    and Mr K Abraham for their patience and encouragement in bringing out this book.


    I am grateful to Dr. M. Rajeswari, Head, Department of Computer Science and Engineering,
    and his faculty for their encouragement and support I thank Mr S Saranan, Mr Rajarman
    and Mr M Krishna for verifying the programs in the book. I acknowledge the continuous
    encouragement given by my brothers Mr T Vamsely, Mr T Ramakrishnan and Mr T Narayanamorthy.
    Finally, I acknowledge the patience and encouragement of my wife Sami, daughters
    Soni and Sherin, who made this time of writing pleasant and enjoyable.


    I hope this book will provide inspiration and help students developing a strong
    foundation in computer programming. Suggestions for further improvement of the
    book are welcome. For assistance and clarifications, contact me through jeyapoovan@gmail.com
    or www.facebook.com/jeyapoovan.


    T. JEYAPOOVAN'
