  md: '# Example 6


    Write a program to sort a set of n numbers in ascending order and explain the
    algorithm used.


    # Solution


    There are many methods available to sort (arrange) numbers in ascending/descending
    order. Selection-sorting algorithm is one of the simplest algorithm to sort to
    numbers.


    Consider a list of values:


    6 -2 8 3 13 10


    Compare the first number with the second, then with the third and so on till the
    smallest value moves to the second place.


    -2 6 8 3 13 10


    Compare the second number with the third, then with the fourth and so on till
    the second smallest value moves to the second place.


    -2 3 6 8 10 13


    The procedure is repeated to move the third smallest to the third place and so
    on. Finally the numbers are arranged as follows.


    -2 3 6 8 10 13


    The steps involve arranging the numbers in ascending order are given below.


    +   Step1: Read n


    +   Step2: Loop to read n values of the list


    +   Step3: Loop to arrange the numbers by comparison


    ```

    if (x_i > x_{i+1}) then

    exchange the values

    ```


    +   Step4: Loop to print the arranged list


    +   Step5: Stop'
