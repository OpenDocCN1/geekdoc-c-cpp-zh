  md: '# FORMATTED INPUT/OUTPUT FUNCTIONS


    scanf () Function


    scanf () function is used to read/input values of variables using the standard
    input device (keyboard). It has the following form.


    ```

    scanf("%format string", &V1, &V2...&V);

    ```


    where V1, V2... are variables whose values are to be read from the keyboard.


    "format string" is the control string which represents the format specification
    (refer Table 1).


    Example


    +   1. scanf("%d", &a); to read value of int variables a and b.

    2. scanf("%f", &x); to read float value of x and int value of n.

    3. scanf("%c", &c); to read char value for variable c.

    4. scanf("%s", name); to read string of char variable name.


    When these functions are executed, the computer will wait for the values of the
    variable listed in scanf which are to be entered using the keyboard.


    | Data Type | Format | Meaning |

    | --- | --- | --- |

    | | %d | Represents a decimal integer value |

    | int | %u | Represents an unsigned integer value |

    | | %o | Represents an unsigned octal value |

    | | %x | Represents an unsigned hexadecimal value |

    | float/double | %f | Represents a floating point value |

    | | %e | Represents a floating point value in decimal or exponential form |

    | char | %c | Represents a single character value |

    | | %s | Represents a string of value of characters |


    Note: %hd, %ld, %lf are used for short int, long int and double respectively.'
  merge: -1
