  md: '# C Programming


    +   * Creation of a file of a specific type

    * Reading/processing a file

    * Append/add information to a file

    * Modify/edit data in a file

    * Delete items in a file

    * Update the file


    # FILE DECLARATION


    A file is declared and the data is accessed using a file pointer. It has the following
    general form.


    ```

    FILE *fp;

    FILE refers to the type name for file declaration

    fp refers to file pointer

    ```


    where


    # Examples


    ```

    *fptr;

    *file, *tfile;

    ```


    Note that the type name FILE is always written in capital letters (upper case)
    and is defined with a typedef declaration. The file pointer develops a link between
    the storage device and the program.


    # fopen () Function


    fopen function is used to open a file and set the file pointer to the beginning/end
    of a file. It has the following form.


    ```

    fp = fopen("filename", "mode");

    ```


    where fp refers to file pointer


    +   * filename refers to the name of the file to be opened

    * mode refers to the operation mode used in data processing:


    +   * The following modes are used to open a file to write data/information.

    * "r" to open a file to read data/information from the beginning of a file.

    * "a" to open a file to add data/information at the end of an existing file.

    * "w" to open a file for writing. Data can be read after writing using the same
    mode.

    * "r+" to open a file for reading and writing data.

    * "a+" to open a file to write information at the end of a file. Data can be read
    after writing using the same mode.'
