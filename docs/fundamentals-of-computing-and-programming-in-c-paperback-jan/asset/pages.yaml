    # Multitasking


    It is the ability of the computer to handle several application programs concurrently.
    For example, printing a document, solving a set of equations and any other operation
    can be done simultaneously to reduce the idle time of the processor. The multitasking
    capability of the operating system will utilize the processor efficiently, thus
    reducing the user''s waiting time.


    The concept of multitasking is not different from the concept multiprogramming.
    Programs use both the terms synonymously. However, the difference is that multitasking
    is referred to single-user systems (DOS-based) and multiprogramming is referred
    to multi-user systems (UNIX-based).


    # Time-sharing


    It is the ability of the CPU to serve many users connected to it through a network.
    Since the CPU has high processing speed, it can process information of many users.
    The operating system will assign each user a slice of processor time in a round-robin
    pattern.


    The term time-sharing is used in the concept of multiprogramming, where users
    in the network environment can work simultaneously on the system. In a time-sharing
    system, the CPU scheduling algorithm allocates time to various users. The time
    allotted to each user is usually in order of 10 to 100 milliseconds.'
