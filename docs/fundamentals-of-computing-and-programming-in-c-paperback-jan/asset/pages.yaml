  md: '# CP-2 C Programming


    # Procedural Programming


    In procedural programming, for a given problem, variables are identified and instructions
    are written using the variables in the correct sequence to get the required result.
    Sometimes the program may require unconditional transfer of control from one part
    of the program to another using GOTO statements. This can be avoided by writing
    the statement sequence using many blocks; this is called a structured program.


    The procedural programming method is commonly used to solve scientific and engineering
    problems involving variables. Discrete results are expected as the output of the
    program.


    # Object Oriented Programming (OOP)


    In oriented programming, objects which have data related to a person or item are
    used. The program can be written using many functional blocks. The functional
    block contains instructions similar to procedural programming.


    Object oriented programming method is commonly used to develop software packages.
    C++ is one of the commonly used object oriented programming languages.


    # ALGORITHM AND FLOWCHART


    In order to write programs without any logical error, it is recommended programmers
    prepare a rough writing showing the steps involved in the program. This is called
    an algorithm.


    An algorithm presents step-by-step instructions required to solve any problem.
    These steps can be shown diagrammatically using a flowchart.


    Flowchart is a symbolic or diagrammatic representation of an algorithm. It uses
    several geometric figures to represent the operations, and arrows to show the
    direction of flow. Following are the commonly used symbols in flowcharts.


    | Symbol | Operation | Meaning |

    | --- | --- | --- |

    | | Start/Stop | Represents the beginning and the end of the flowchart. |

    | | Input/Output | Represents the values to be given by the user and the results
    to be displayed. |

    | | Processing | Represents the arithmetic operations to compute a value. |

    | | Checking/decision making | Represents the logical checking to decide the flow
    sequence. |'
  merge: -1
