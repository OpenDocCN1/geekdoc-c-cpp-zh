  md: '# FC-58 Fundamentals of Computing


    +   1. +7 is represented and stored in 8-bit allocation as 0000 0111.


    The sign is positive; hence no more action is required.


    +   2. -40 is represented and stored in 8-bit allocation as 0010 1000.


    The sign is negative; hence leave the rightmost 0''s and the first 1 (including
    1) unchanged and complement the rest.


    The result is 1101 1000.


    +   3. -40 is represented and stored in 16-bit allocation as 0000 0000 0010 1000.


    The sign is negative; hence leave the rightmost 0''s and the first 1 (including
    1) unchanged and complement the rest.


    The result is 1111 1111 1111 1000.


    # Interpretation of Two''s Complements


    +   1. If the leftmost bit is 0 (positive), convert the number from binary into
    decimal and put + sign in front of the number. For example, if 0000 1110 is a
    two’s complement decimal number, its original number is +12.


    +   2. If the leftmost bit is 1 (negative), follow these steps.


    +   i. Leave the rightmost bits up to the first 1 unchanged. Complement the rest
    of the bits.


    +   ii. Convert this binary to decimal.


    +   iii. Put negative sign (-) in front of the number.


    For example, 1111 0100 is a two’s complement decimal number. To obtain the original
    number, follow these steps.


    +   i. Since the leftmost bit is 1, the number is negative.


    +   ii. Leave 100 at the right and complement the rest to get 0000 1100.


    +   iii. The two’s complement number is 12. The original number is -12.


