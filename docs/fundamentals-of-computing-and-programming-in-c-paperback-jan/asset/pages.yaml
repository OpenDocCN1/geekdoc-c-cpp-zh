  md: '# CL-2 Computer Lab Programs


    Title bar: It displays the name of the currently active document.


    Menu bar: It shows the menu titles. Clicking on the menu title would display the
    commands in the menu.


    Tool bar: It contains buttons and drop down menus to execute commands.For example
    New, Save, Open, Cut, Copy, Paste, Print, etc.


    Formatting toolbar: It contains icons for changing the attribute of the text.
    For example Font size, text alignment, bold, italics, underlines etc.are used
    for changing the appearance.


    Scroll bar: It contains buttons to navigate the document up and down.You can also
    use the arrow keys, Page up, Page down, Home and End keys to move within the document.


    Status bar: It gives information about the page number, section number, line number,
    column number et. of the active document.


