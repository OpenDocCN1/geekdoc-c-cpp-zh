  md: "# CHAPTER\n4\nControl Statements in C\n\n# CHAPTER OBJECTIVES\n\n+   - if-else\
    \ Statement\n- Nested if Statement\n- switch Statement\n\nAll statements written\
    \ in a program are executed from top to bottom by one. Control statements are\
    \ used to execute/transfer the control from one part to another depending on a\
    \ condition. These statements are also called as conditional statements.\n\nThere\
    \ are two types of control/conditional statements used in C language.\n a. if-else\
    \ statement\n b. switch statement\n\nif-else STATEMENT\n\nif-else statement is\
    \ used to execute a statement block or a single statement depending on the value\
    \ of a condition. It has the following form."
  merge: -1
  pgno: 235
- img_proc: true
  md: "```\nif ( condition )\n{\n----------\n<true block>\n----------\n}\nelse\n{\n\
    ----------\n<false block>\n}\n```\n\nwhere<condition> is a logical expression\
    \ which will have the value true or false.\n\n# Example\n\n```\nif (bpay >= 3000\
    \ )\n  da = 0.32 * bpay;\n  hra = 0.15 * bpay;\n  cca = 325;\n/* bpay - basic\
    \ pay*/\n/* da - dearness allowance*/\n/* hra - house rent allowance*/\n/* cca\
    \ - city compensatory allowance*/\n```\n\nWhen this statement is executed, the\
    \ computer evaluates/checks the value of the condition. If the value of the condition\
    \ is true, then the statements in <true block> will be executed. Otherwise the\
    \ statements in the <false block> will be executed. The following points in relation\
    \ to the use of if-else statements are to be taken of.\n\n+   (1) <false block>\
    \ is optional; i.e., it can be omitted when there is no statement available in\
    \ that block.\n\n# Example\n\n```\nif (bpay >= 3500 )\n{\n  da = 0.82 * bpay;\n\
    \  hra = 0.15 * bpay;\n  cca = 325;\n```\n\n+   (2) The block marker {} may be\
    \ omitted when there is only one statement in a block."
