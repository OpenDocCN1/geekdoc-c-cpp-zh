  md: '# FC-74 Fundamentals of Computing


    # NEED FOR LOGICAL ANALYSIS AND THINKING


    To solve a problem using computer, a computer program is developed by a programmer.
    A program consists of various steps in the right sequence to produce the desired
    result. The problem to be solved is defined by the customer as their requirement
    which may be a mathematical, scientific, engineering or business problem. The
    programmer must understand the program clearly and analyze the problem logically
    to get the solution. The solution obtained is also tested and validated using
    sample input data by running the program.


    The programmer has to think on various input data for the variable. For example,
    input data for a DOB (Date of Birth) of a person may be given as 31-01-1964 (dd/mm/yyyy)
    or 31 JAN 1964. To process this kind of input data, the programmer should interact
    with the customer and fix a proper format for the input or accept the input in
    any possible format. The programmer should also develop the program to analyze
    the date and process it correctly. But, the program development may need more
    coding and cost.


    The programmer thinks and analyzes the given problem logically and he/she arrives
    at any logic to solve the problem. There may be more than one logical method to
    produce the correct result. Logic is the sequence of steps based on some reasons
    or decisions to get the desired result. Logic helps to organize the activities
    in the right order and display for defined conditions. Programmer should have
    a good logical thinking on any given problem and make a decision through logic.


    The programmer follows different type of strategy to solve a problem. They are:


    +   **i. Logical reasoning** produces a Boolean result on the logical decision
    (TRUE/FALSE)

    **ii. Mathematical reasoning** which uses an empirical relation to produce a numerical
    result.

    **iii. Lateral thinking** which could be applied on certain issues in any specific
    problem.


    Problem solving is easier if a problem solving framework is used. The outline
    of a problem solving framework is given below.


    # Understand the given problem


    Understanding a problem involves the interaction of the programmer with the customer.
    It includes understanding of all input data, various components of the problem,
    any ambiguity in the problem definition and its removal as well as other assumptions
    made in the program development.


    # Formulate a strategy to solve the problem


    The strategy used to solve a problem is decided by the programmer based on the
    understanding of the problem. A large or complex problem is solved by dividing
    the given problem into small subprograms for different computation or activity
    and is controlled by a main program.'
  merge: -1
  pgno: 103
- img_proc: true
  md: '# Planning a Computer Program FC-75


    used may solve the problem numerically or graphically. The data may be obtained
    from a table or using communication language. Some of the problem solving strategies
    may work backwards from the end, solving a simpler analogous, logical reasoning
    and planning for all possibilities of solution.


    # Strategy to get desired results


    The strategy followed may be mathematical or logical reasoning to find the solution.
    For example, the mathematical reasoning may be X = N/2 and logical reasoning may
    be IF (A > B) THEN BIG = A otherwise BIG = B. The strategy used is represented
    in simple representations like algorithm or pseudocode which will be discussed
    later.


    # Assess the result obtained


    The results obtained are accessed and it must be validated for correctness. It
    is difficult for solving complex problems and achieve the correct result in the
    first attempt. A few attempts may be required to get the right results. Sometimes
    results appears to be correct may be due to misunderstanding of a problem. If
    you misunderstood a problem, the program will not work as expected, so it needs
    modifications to get desired results.


    # Describe the process


    Describing the process followed is a good practice to understand the problem solving
    strategy and keep the record of problems faced/attempted, successes, failures,
    the approaches used, etc. for any future reference or modification. It also helps
    to recognize similarities in problems to be solved, identify and fix logical or
    implementation errors, solve problems faster and more effectively.


    # Documenting the result


    Documenting the result helps to generalize the strategy to other similar problems.
    It also prevents from forgetting the method followed to arrive at the results
    and make the program.


    # ALGORITHM


    An algorithm is a set of step-by-step instructions that perform a specific task
    or solve a problem. The steps represent the operations to be performed and arriving
    in correct order, error-free and effectively computable when executed to produce
    the desired result. Algorithm shows the steps written in simple or plain English
    to formulate the program outline. An algorithm should have a clear stopping point
    for the proposed logic of problem solving.


    The method of developing an algorithm and arriving at a correct sequence of steps
    to solve the given problem results from the logical thinking of the programmer.
    Various steps in the algorithm'
