    # PROBLEM ANALYSIS


    Problem analysis is the process of understanding the real problem and user''s
    requirements and proposing solutions to meet those requirements. The objective
    of problem analysis is to get a better understanding of the problem to be solved.
    When problem analysis is incorporated into the program development process, the
    program development starts with the problem analysis. Consider the following points
    on problem analysis:


    +   (i) Prepare the structure diagram of the problem defined.


    +   (ii) Collect a list of requirements to the problem structure, thus the all-in-one
    problem diagram is obtained.


    +   (iii) Decompose the all-in-one problem into simpler problems.


    +   (iv) Continue to decompose problems until each problem is enough to solve
    it.


    Now, the problem analysis and the problem decomposition are completed. The next
    step is to turn around and proceed to the desired software through a process of
    solution composition. Software development process involves the developers who
    would compose multiple sub-problems for a single all-in-one software solution
    that satisfies all the listed requirements.


