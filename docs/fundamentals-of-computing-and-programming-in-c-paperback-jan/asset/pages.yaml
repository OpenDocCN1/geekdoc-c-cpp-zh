    # Input Unit


    The input device is used to enter data and information into a computer. Keyboard,
    mouse and scanner are commonly used as input devices. A keyboard is used to enter
    alphanumeric characters and symbols. The mouse is used to pick or select a command
    from the monitor screen. A scanner is used to scan an image, read a barcode and
    so on.


    The functions of an input unit are:


    +   1. It accepts data from the user.

    2. It converts data into a form that is acceptable to computers.

    3. It supplies the converted data to the CPU for further processing.


    # Central Processing Unit


    Control unit, memory unit and arithmetic and logic unit constitute the central
    processing unit (CPU) of a computer. The central processing unit comprises a processor
    (e.g. Intel i7 Processor) which interprets the program instructions in memory,
    controls the data flow into and out of memory, and performs arithmetic and logical
    operations. The program instructions are processed one at a time from the memory
    along with the necessary data. The results are sent to memory and the next instruction
    is processed. This method is repeated until the complete program is executed.
    The constituent units of a CPU are control unit, memory unit and arithmetic and
    logic unit.


    # Control Unit


    The control unit controls the activities of the components of the computer. It
    will send commands and signals to controls the sequence of instructions to execute.
    A computer system follows a number of steps when a program is executed. The control
    unit issues orders to extract the contents from the memory and transfer them to
    ALU. Instruction like multiply or divide also goes to ALU. The control unit is
    responsible for directing and coordinating most of the system activities. It does
    not execute program instructions, but directs the other units to do so. It determines'
  merge: -1
  pgno: 49
- img_proc: true
  md: 'the movement of electronic signals between the main memory and the arithmetic
    and logic unit. also controls the signals between the CPU and input/output devices.
    The process of fetching the instruction and setting into appropriate memory registers
    is known as fetch cycle. The calculation of the result after performing the required
    arithmetic or logic operation is called execution cycle.


    # Memory Unit


    The memory unit is the place where all input data and results are stored. The
    CPU memory is also called Memory Register. Computer memory is also available in
    the form of Catch Memory, Random Access Memory (RAM) and Hard Disk Storage.


    # Arithmetic and Logic Unit(ALU)


    The arithmetic and logic unit consists of circuits and registers which perform
    arithmetic (+, -, x, <, >, >=, etc.) operations. After the process by ALU, the
    result is sent to the memory. The ALU controls the speed of calculations of a
    computer system. The circuitry to perform the arithmetic operations such as addition,
    subtraction, multiplication etc and performs comparisons on integer and real numbers.
    These comparisons are basically greater than, less than, equal to, greater than
    or equal to it. The purpose of most instructions is that comparisons are used
    to decide which instructions should be executed next. ALU contains registers that
    are used for temporary storage purpose during the processing of data. An accumulator
    is one such memory register, which is used to store intermediate results obtained
    during any computations. The final result is also obtained in an accumulator from
    where it can be transferred to memory.


    # Output Unit


    The output device is used to display or print results from a computer. Monitor,
    printer and plotter are the commonly used output devices. A monitor is used to
    display the results in the form of text and graphics. The printer is used to print
    the result. A plotter is used to plot or graphical results from a computer. Note
    that a result displayed in a monitor is temporary and disappears when the next
    result is displayed. But the output printed using a printer or a plotter is permanent
    and these prints can be used for any business correspondence or documentation.


    The functions of an output unit are:


    +   1. It accepts the results produced by the computer.

    2. It converts these results into a form that is understood by humans.

    3. It displays the results and results can be obtained in print forms.


    All units in a computer other than the central processing unit are Peripherals.


    # COMPUTER MEMORY AND ITS ORGANISATION


