  md: "# POINTERS AS FUNCTION ARGUMENTS\n\nA pointer can be used as an argument in\
    \ function declaration. When a function with a pointer argument is called, the\
    \ calling program will provide the address (not the value) of a variable to the\
    \ argument.\n\nIn C language, a function can be called by the calling program\
    \ in two ways.\n\n+   1. Call by value\n2. Call by reference\n\n# Call by Value\n\
    \nWhen a function is called by the calling program, the values in the arguments\
    \ are supplied by the calling program. Any alteration to the value is not accepted\
    \ in the calling program but the change is locally available in the function.\
    \ This method is referred as calling a function by value. Consider the following\
    \ example.\n\n```\n#include <stdio.h>\n#include <conio.h>\nmain()\n{ int a = 25,b\
    \ = 10;\n void add10(int x, int y);\n clscr();\n printf(\"\\n Before function\
