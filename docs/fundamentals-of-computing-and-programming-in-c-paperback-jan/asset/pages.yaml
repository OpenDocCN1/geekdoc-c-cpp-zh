    # Binary Subtraction


    Subtraction is the inverse operation of addition. Consider the following table.


    Binary Subtraction

    0 - 0 = 0

    1 - 0 = 1

    1 - 1 = 0

    0 - 1 = 1 (borrow of 1)


    Note that when 1 is subtracted from 0, it is necessary to borrow 1 from the left
    column to the left. Consider an example of subtracting 5 from 11.


    | Decimal | Binary |

    | 11 | 1011 |

    | 5 | 101 |

    | 6 | 110 |


    The result of 1011 + 101 is 11011.


    Binary subtraction can be obtained using the complement of the number to be subtracted.
    The algorithm may be given as follows.


    +   - Obtain the complement of the number to be subtracted.

    - Add it to the base number.

    - If there is a carry of 1 at the end, add it to get the result; if there is no
    carry, re-complement the binary and add a negative sign to get the result.


    Let us subtract 12 from 36.

    The binary of 36 is 0010 0100 and that of 12 is 0000 1100.


    +   - The complement of 12 is 1111 0011.

    - Add it to the base number.'
