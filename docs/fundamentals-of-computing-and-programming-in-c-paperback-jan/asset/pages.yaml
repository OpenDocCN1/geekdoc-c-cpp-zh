  md: "# CP-170 C Programming\n\nUser-defined functions are self-contained blocks\
    \ of statements which are written by the user to compute a value or to perform\
    \ a task. They can be called by the main program repeatedly as per the requirement.\n\
    \n![](img/2e39d133c87ea945283efbb3d9eac1b7_347_0.png)\n\n# Uses of Functions\n\
    \n+   (i) Functions are very useful when a block of statements has to be written/executed\
    \ again and again.\n(ii) Functions are useful when the program size is too large\
    \ or complex. Functions are called to perform each task sequentially from the\
    \ main program. It is like a top-down modular programming technique to solve a\
    \ problem. (Remember that in modular programming, statements are executed from\
    \ top to bottom in sequence to produce a result.)\n(iii) Functions are also used\
    \ to reduce the difficulties in debugging a program.\n\n# USER-DEFINED FUNCTIONS\n\
    \nIn C language, functions are declared to compute and return the value of a specific\
    \ data type to the calling program.\n\nFunctions can also be written to perform\
    \ a task. It may return many values indirectly to the calling program and these\
    \ are referred to as void functions.\n\n# FUNCTION DECLARATION\n\nThe general\
    \ form of a function declaration is given below.\n\n```\ntype name(type arg1,\
    \ type arg2,..., type arg n)\n{\n  <local declaration>\n  -\n  <statement block>\n\
    \  -\n  return(variable or expression);\n}\n```\n\nwhere type is the type of return\
    \ value by the function and arguments are expected. arg1, arg2,...,arg n are the\
    \ arguments which are variables that will receive the values from the calling\
    \ program.\n\nname is the name of the function by which the function is called\
    \ by the calling program."
