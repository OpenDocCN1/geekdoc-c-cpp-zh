  md: '# C Preprocessor and Command Line Arguments CP-305


    #include "SAMPLE.C"

    #include "EMPLOY.C"

    When the file name is given inside double quotes, the computer will search the
    file in the directory where the C programs are stored and in the specified list
    of other directories.


    # CONDITIONAL COMPILATION


    Conditional compilation can be used to include a file or macro depending on some
    conditions. This is useful to define parameters based on different platforms/hardware
    used in a computer. It has the following form.


    ```

    #ifdef SAMPLE

    <statement block 1>

    #else

    <statement block 2>

    #endif

    ```


    The statement block 1 between #ifdef and #else will be compiled only when the
    macro SAMPLE has been defined, otherwise the statement block 2 between #else and
    #endif will be compiled.


    Example


    ```

    #define MAXIMUM

    #ifdef MAXIMUM

    #define M 10

    #define N 10

    #else

    #define M 3

    #define N 3

    #endif

    ```


    When the MAXIMUM is defined, M and N are assigned the value 10, otherwise M and
    N are assigned the value 3.


    # COMMAND LINE ARGUMENTS


    In order to run a computer program, an executable program with the extension .EXE
    is generated. These programs can be executed by typing the primary name of the
    program at the command prompt C> or A> (in UNIX system).


    Consider a sample PROGRAMFILE.C to copy the contents of a text file. The program
    is compiled to generate a file COPY.EXE in hard disk which can be run from the
    command prompt.


    ```

    C>copyfile

    ```'
