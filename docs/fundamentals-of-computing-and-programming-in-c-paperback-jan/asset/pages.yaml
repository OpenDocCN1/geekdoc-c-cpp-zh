  md: 'Similarly any integer can be added or subtracted to move the pointer to any
    location in RAM. But the resultant address is dependant on the size of the data
    type of the pointer. The step in which the pointer is increased or reduced is
    called scale factor. Scale factor is nothing but the size of the data type used
    in a computer. We know that in a PC, the size of float is 4, char is 1, double
    is 8 and so on. Consider another example.


    ```

    float *xp;

    (assume its address is 63498)

    xp = xp + 5;

    ```


    will move the pointer to the address 63518 which is obtained as follows.


    ```

    = 63498 + 5 * sizeof(float)

    = 63498 + 5 * 4

    = 63518

    ```


    Note that any arithmetic operation such as addition or subtraction can be performed
    on a pointer. A great care is required to ensure the resultant memory address
    obtained in the operation.


    # POINTERS WITH ARRAYS


    Values in an array can be accessed efficiently using pointers. Normally the first
    element (for example, address of x[0]) of an array is assigned to the pointer.
    Then the pointer will be moved to other elements in the array using pointer address
    arithmetic. The first element address of the array is called **base address**.
    Consider the following example.


    ```

    float x[5] = (2.52, 4.38, 3.5, 4.25, 3.85);

    float *xptr;

    ```


    Assume that these values are stored in memory in the following addresses.


    | | 0 | 1 | 2 | 3 | 4 |

    |---|---|---|---|---|---||

    | array name -> x | 2.52 | 4.38 | 3.5 | 4.25 | 3.85 |

    | memory addresses -> | 6548 | 6552 | 6556 | 6560 | 6564 |


    first element address

    (base address)


    Note that each element occupies 4 bytes in float type and the first address of
    each memory location is considered.


    Assign the element address to the pointer as follows.


    ```

    xptr = x; or xptr = &x[0];

    ```


    Now the pointer refers to the address of the first element x[0] which is 6548.'
