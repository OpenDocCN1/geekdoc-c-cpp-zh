    move the cursor to any position on the monitor screen. The function keys are used
    to activate a particular feature of a software (e.g. spell check in MS Word),
    invoke the help system, select a menu or option or so on.


    ![](img/2e39d133c87ea945283efbb3d9eac1b7_55_1.png)


    Figure 1.23 Keyboard


    A separate numeric keypad is available to enter numeric data. When a key is pressed
    the electric circuitry under the key will change, which is detected by the microprocessor
    and the binary code'
