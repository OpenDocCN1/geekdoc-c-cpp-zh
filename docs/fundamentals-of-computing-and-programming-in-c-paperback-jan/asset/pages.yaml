  md: "# CP-194 C Programming\n\nprintf(\"\\n Value of m in function block is %d\"\
    , m);\n}\n\nNote that the variable m is declared in three blocks, and in the respective\
    \ blocks it is active. When the program is executed, the value of m in the respective\
    \ blocks are printed as shown below.\n\n+   - Value of m in inner block is 50\n\
    - Value of m in function block is 65\n- Value of m in outer block is 40\n\n# static\
    \ Storage Class\n\nVariables declared in this class are also stored in the RAM.\
    \ The keyword static is used to declare these variables. Similar to auto, the\
    \ static variables are also active in the block in which they are declared, and\
    \ they retain the latest value. The static variables are commonly used along with\
    \ functions. Consider the following example.\n\n```\nmain() {\n  void sample(void)\
    \ {\n    printf(\"\\n First function call\");\n    sample();\n    printf(\"\\\
    nSecond function call\");\n    sample();\n  }\n  void sample() {\n    static int\
    \ m = 5, n = 10;\n    m = m + 10;\n    n = n + 10;\n    printf(\"\\n Value of\
    \ m = %d and n = %d\", m, n);\n  }\n```\n\nWhen this program is executed, the\
    \ values of variables m and n are printed as shown below.\n\n+   - First function\
    \ call\n- Value of m = 15 and n = 20\n- Second function call\n- Value of m = 25\
    \ and n = 30\n\nNote that the static variables in a function are initialized only\
    \ once during the compilation. Thereafter the existing value of the variables\
    \ is active; further, if it is declared as an auto variable, its value will be\
    \ initialized in every function call during the runtime. As a result the same\
    \ values of m and n are printed in the function calls."
