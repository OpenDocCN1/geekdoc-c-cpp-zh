    using a call statement by its name. A subprogram can be written and tested independently.
    The subprogram can be invoked any number of times by the main program.


    # Advantages of the top-down design approach


    +   1. The approach of dividing the large problem into small and manageable subprograms
    for program design and development is very convenient.

    2. In top-down design, solution for large problems can be obtained by involving
    a team of programmers for the development of subprograms. Then all subprograms
    are added together to get the solution for the given problem.

    3. Reliability of the program is high as each subprogram can be tested separately
    for the intended result.

    4. Debugging or correcting mistakes of the program becomes easy for any kind of
    error.

    5. The subprograms developed for one application can be reused for another application
    too.

    6. Understanding the working of the program and subprograms are easy even for
    complex problems.


