    | 1 | S | H | E | R | I | N | | | | |

    | 2 | S | O | N | I | K | A | | | | |

    | 3 | A | R | U | N | | | | | | |


    Compare the name in the first row with the second, then with the third name and
    so on till the smallest name (and the name starting with letter ''A'') moves to
    the first place.


    | 0 | A | R | U | N |

