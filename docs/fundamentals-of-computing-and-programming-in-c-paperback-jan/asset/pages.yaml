  md: 'These values can also be accessed using the memory addresses after assigning
    them to a pointer

    as shown below.


    ```

    /* pointer declaration */

    int *mptr;

    float *xptr;

    /* assigning addresses of m and x to the pointers */

    mptr = &m;

    xptr = &x;

    printf("\n m = %d x = %0.2f", *mptr, *xptr);

    ```


    When this program is executed, the values are printed as shown below.


    ```

    m = 15 x = 2.54

    ```


    Note that the pointers are also allotted storage locations in memory where addresses
    of other variables will be stored. Consider the following illustration.


    # RAM


    | | 2644 |

    | :--- | :--- |

    | m = 15 | 2 bytes |

    | 3012 | |

    | | x = 2.54 | 4 bytes |

    | 3840 | |

    | mptr = 15 | |

    | 4224 | |

    | xptr = 3012 | 4 bytes |


    A great understanding of pointers and their use is required for writing an error-free
    program. Consider the following examples to access the addresses of the variables
    declared above.


    ```

    printf("\n Address of m = %u x = %u", &m, &x);

    printf("\n Address of mptr = %u xptr = %u", &mptr, &xptr);

    ```


    When these commands are executed, the addresses of the variables are printed as
    shown below. Remember that only the first cell of the address of the memory is
    considered.


    ```

    Address of m = 2464 x = 3012

    Address of mptr = 3840 xptr = 4224

    ```


    Consider the following examples to access the values stored in these addresses.


    ```

    printf("\n Value stored in m = %d x = %0.2f", m, x);

    ```'
