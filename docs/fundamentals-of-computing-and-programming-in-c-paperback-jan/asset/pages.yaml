  md: '# Accessing Values in an Array


    Values in an array are accessed using array name with subscripts in bracket [
    ].


    Normally, the list of values to the array is read using a for loop. Consider the
    following example:

    for(i = 0; i < 6; i++)

    scancf("%d", &x[i]);


    When this loop is executed, the value of i varies from 0 to 5 in steps of 1, and
    scanf () is executed every time to read a value of a one-dimensional array as
    follows.


    First time: i=0

    Read value for x[0].e.g. enter 3.1

    Second time: i=1

    Read value for x[1].e.g. enter 3.2

    Finally: i=5

    Read value for x[5].e.g. enter 3.5


    Thus the 6 values in the line are read and stored in RAM as illustrated below.


    | 0 | 1 | 2 | 3 | 4 | 5 |

    | 3.1 | 3.2 | 4.6 | 2.9 | 3.8 | 3.5 |


    ![](img/2e39d133c87ea945283efbb3d9eac1b7_298_0.png)


    RAM consists of many memory cells, each of size 1 byte. Each element is allotted
    2 bytes by the size of an integer is 2 bytes. The size of this array is 12 bytes
    (2 × 6 = 12).


    Note that for loops can also be used to print and process the values stored in
    the array.


    # Initializing Values in an Array


    Values of an array may be initialized while declaring them. Consider the following
    example:

    float x[6] = {3.1, 3.2, 4.6, 2.9, 3.8, 3.5)};

    float x[]] = {3.1, 3.2, 4.6, 2.9, 3.8, 3.5 };


    Note that the array size is ignored and is considered as x[6] automatically as
    per the number of values.


    The values assigned are stored as follows.


    | 0 | 1 | 2 | 3 | 4 | 5 |

    | 3.1 | 3.2 | 4.6 | 2.9 | 3.8 | 3.5 |


    x[0] = 3.1

    x[1] = 3.2'
