    # NESTED for STATEMENT or NESTED for LOOP


    The statement block of a for loop lies completely inside the block of another
    for loop. This is referred as nested for loop or nested statement. Any number
    of statements can be nested. Consider the following example (two loops).


    ```

    for(i=1; i=3; i++)

    {

    for(j=1; j<=5; j++)

    {

    -----------------

    outer loop inner loop

    -----------------

    <statement block>

    }

    }

    ```


    Note that the block markers {} can be omitted if there is only one statement in
    the statement block. When this statement is executed, the computer assigns i =
    1 and the inner loop is executed 5 times for j values from 1 to 5 in steps of
    1. Now i is incremented by 1 (i.e. i = 2) and the inner loop is executed 5 times
    for j values from 1 to 5. Then i becomes 3 and the inner loop is executed 5 times.
    Note that the statement block is executed and repeated 15 times (3 x 5 = 15).'
