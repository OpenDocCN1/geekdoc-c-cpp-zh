    A list refers to a sequential organization of items.Array allocates memory of
    size we determine in the beginning which can later be used for storing values.


    We may not know the required size initially. In such situations linked lists are
    used. In a linked list each item contains a link to the adjacent item.


    Each structure of a list is called a node.Each node consists of two parts, one
    containing the data and the other containing the link to the adjacent node.


    A linked list is a chain of structures in memory.Each of these structures contains
    data as well as a pointer to the next logical structure in the list. Fig

    13.1 shows a list of employee codes'
