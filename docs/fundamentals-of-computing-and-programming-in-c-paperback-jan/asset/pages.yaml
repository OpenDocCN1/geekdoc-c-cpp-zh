  md: 'Computer Lab Programs CL-59


    # Deletion in a Singly Linked List


    Deletion in a singly linked list lists one of the following situations:


    +   (i) Deleting a node at the beginning of the list

    (ii) Deleting in the middle of the list.

    (iii) Deleting at the end of the list.


    To delete a node at the beginning of start, follow these steps


    +   (i) Set ptr to start.

    (ii) Set start to point to what ptr''s next is pointing to

    (iii) Free the memory occupied by the node


    ```

    start=ptr->next;

    ```


    ```

    free(ptr);

    ```


    ![](img/2e39d133c87ea945283efbb3d9eac1b7_569_0.png)


    Fig 15.3


    To delete a node in the middle of the list, follow these steps


    +   (i) Traverse the list until you locate the node to be deleted. Let us call
    this pointer ptr.

    (ii) When you locate the item, delete it from the list by connecting the node
    before it with the node after it. To do this, maintain a pointer to the node before
    it isdeleted. This pointer will be referred to as prev.


    ```

    prev->next = ptr->next;

    ```


    (The node has been separated from the list, i.e., it has been logically deleted)


    +   (iii) Physically delete the node by freeing it.


    ```

    free(ptr);

    ```'
