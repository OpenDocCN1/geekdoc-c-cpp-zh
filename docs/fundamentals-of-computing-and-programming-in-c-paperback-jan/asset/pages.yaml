  md: '# Introduction to Programming Languages FC-151


    Assembler, Interpreter and Compiler are language processors. An assembler converts
    an assembly language program into machine language. An interpreter converts a
    high-level language program by line into a machine language. The machine language
    program is called object program. A compiler also converts an error-free high-level
    language program into an object program in one step.


    # Assembler


    Assembly language program is nothing but a symbolic representation of machine
    code which uses symbolic designation of memory locations. The assembly language
    program is converted into executable code by a utility program called an assembler.
    This conversion process is referred as assembling the code. The assembler creates
    object code by translating assembly instruction mnemonics into opcodes and gets
    address for symbolic names. The use of symbolic references is a key feature of
    assembler, reducing the tedious calculations and manual memory updates after the
    program modifications. Note that the translated assembly instructions consist
    of an opcode mnemonic followed by a list of data and parameters. These are translated
    by an assembler into machine language instructions that can be loaded into memory
    and executed. The various stages in assembling are shown in Figure 5.13.


    ![](img/2e39d133c87ea945283efbb3d9eac1b7_180_0.png)


    **Figure 5.13** Various stages in assembling


    The assembly language program is called as a source program and the translated
    machine program is called as an object program. If any error is present in the
    source program it must be corrected and resubmitted to generate the new object
    program. Following are the functions of an assembler.'
