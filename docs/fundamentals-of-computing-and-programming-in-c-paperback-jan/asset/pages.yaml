    # Structured programming


    A structured program uses a standardized technique for program development. The
    structured programming technique was developed to address the shortcomings of
    unstructured programming. Structured programming technique uses control structures
    like selection, selection and iteration or repetition in program coding. The structured
    programming technique does not use GO TO statements.


    In sequence, the program coding is written sequentially and is simply executed
    in the order in which they appear in the program coding. Simple programs are written
    in sequence structure.


    In selection, the set of program coding is selected and executed selectively using
    IF-THEN-ELSE statements are executed. It evaluates a condition, IF the value of
    the condition is TRUE, a set of statements are executed, ELSE another set of statements
    are executed. It is also optional to use the statements in the ELSE part. Consider
    an example to calculate the weekly wages for employees using the condition, if
    the number of hours worked is more than 40 hours, then wages is Rs.4000 + Rs.200
    for one excess hour otherwise wages is Rs.4000/- only. The program coding will
    appear as follows


    ```

    IF (HOURS > 40) THEN


    WAGES = 4000 + (HOURS - 40) × 200

    ```


    ```

    ELSE


    WAGES = 4000

    ```


    ENDIF


    In iteration or repetition or loop control structure, a set of program codes are
    executed and repeated to any number of times based on the value of a variable
    or a condition. Many programming languages, iteration or loop control structures
    like FOR loop, WHILE loop and repeat - UNTIL loop are available. For example,
    to generate and print numbers from 1 to 10, the pseudocode using WHILE loop is
    written as follows.


    ```

    I = 1


    WHILE (I <= 10)


    PRINT I


    I = I + 1


    ENDWHILE

    ```'
