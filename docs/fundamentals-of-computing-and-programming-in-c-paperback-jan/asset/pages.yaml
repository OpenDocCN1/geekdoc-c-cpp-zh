    +   5. In how many ways can the files be categorized?

    Files can be basically categorized into text files and data files.

    By considering the methods of accessing files, they are categorized into sequential
    files and random files.


    +   6. In what way is a file more flexible than a string in C?

    A file is stored permanently in a storage device. It is easy to access a file
    whenever required.

    On the other hand, a string is stored temporarily in RAM, and the contents of
    a string will be erased atomically when the power is switched off or when the
    program execution is terminated.


