  md: '# Advantages


    +   (i) Good quality printouts can be obtained for documentation and business
    applications.

    (ii) Printing is easy on single sheets of paper.

    (iii) Printing is faster.

    (iv) Easy handling and maintenance.


    # Disadvantages


    +   (i) High price.

    (ii) Higher print cost per page.


    # Inkjet Printer


    An inkjet printer is a non-impact printer. It sprays tiny drops of ink to form
    character and graphic images on paper. The text and graphics printed in an inkjet
    printer are technically similar to that of a dot matrix printer where the characters
    are generated by the pattern of dots. Inkjet printers can be used for colour printing.
    The black printer uses an ink cartridge with black ink. The color inkjet printer
    uses four cartridges: cyan (blue), magenta (red), yellow and black. These four
    colours are used in combination to generate any color in the visible spectrum.


    The process of inkjet printing (Figure 1.36) is explained through the following
    steps:


    +   (i) There are four removable ink cartridges loaded to the print heads with
    64 firing chambers and nozzles.

    (ii) The print heads moves across the page by the control of software and spray
    the dots of ink with the required combination of colours.

    (iii) As the instruction from the computer, the printer sends electrical pulses
    to resistors at the base of the firing chambers behind the nozzle.

    (iv) A thin layer of ink is heated by the resistor which in turn forms a vapour
    bubble and the expansion forces ink through the nozzle and onto the paper at a
    rate of about 6000 dots per second.

    (v) A matrix of dots produced text and graphics. Note that layering multiple colour
    dots in varying densities generates text and graphics with colours.


    ![](img/2e39d133c87ea945283efbb3d9eac1b7_64_0.png)'
