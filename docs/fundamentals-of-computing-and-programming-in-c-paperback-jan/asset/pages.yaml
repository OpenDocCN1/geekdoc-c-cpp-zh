  md: 'Mauchly and Eck, who were involved in ENIAC Project, constructed UNIVAC (Universal
    Automatic Computer) and UNIVAC I. The UNIVAC I was able to achieve greater speed
    through the use of crystal diodes instead of vacuum tubes. It also independently
    operating peripheral devices like UNITYPER and UNIPINTER and a magnetic tape storage
    system. The first UNIVAC was installed at the U.S. Census Bureau in 1951, and
    commercially installed at a General Electric plant in Louisville, Kentucky.


    International Business Machines Corporation (IBM) developed its first large-scale
    computer IBM 701 in 1953, but it was thought to be inferior to the earlier UNIVAC
    I. IBM 704 developed in 1956 was a successful large-scale scientific computer.


    In 1959, IBM released the 7090, a transistorized computer, which was considerably
    less expensive. In 1960''s, IBM introduced transistorized small computers 1620
    and 1400 series, which were widely used for data processing purposes. In 1961
    the powerful and less expensive 360 family of computers were introduced, with
    the objective of standardizing the IBM systems. These computers supported wide-range
    peripheral devices.


    The development of minicomputers began in 1960''s. Recently minicomputers are
    commonly used. The Digital Equipment Corporation manufactured the PDP minicomputers.
    The first PDP-1 computer was installed at MIT in 1961.


    In 1981, IBM PC (Personal Computer) was introduced, and thus the computers became
    very popular. The IBM Pentium series are commonly used in offices and at homes.


    # GENERATIONS OF COMPUTERS


    Computers were commercially available during the early 1950''s and many significant
    technological developments have taken place thereafter. The stages of development
    are referred as first, second, third, fourth and fifth generation computers.


    # First-generation Computers (1950–1959)


    The first-generation computers were characterized by the introduction of commercial
    computers. The computer was so big that it would occupy a full room, and only
    a limited number of professionals or specialists had access to it. Vacuum tubes
    (Figure 1.6) were used as electronic switches. At that period computers were affordable
    only to big organizations.


    The characteristics of first-generation computers are:


    +   - Vacuum tubes were used as principal electronic component which occupied
    large space and generated more heat.

    - Speed of computing was measured in milliseconds.

    - Limited storage capacity.

    - Punched cards were used for input/output operations.


    ![](img/2e39d133c87ea945283efbb3d9eac1b7_37_0.png)


    Figure 1.6 Vacuum tube'
  merge: -1
  pgno: 37
- img_proc: true
  md: '# Second-generation Computers (1959–1965)


    The second-generation computers used transistors (Figure 1.7) in place of vacuum
    tubes. The size of computers was reduced as well as they were made affordable
    to small and medium-size organizations. High-level programming languages like
    FORTRAN and COBOL were invented. Anyone could easily write a program in FORTRAN
    or COBOL without being involved in the electronic details of computer architecture.


    ![](img/2e39d133c87ea945283efbb3d9eac1b7_38_0.png)


    The characteristics of second-generation computers are:


    +   - Solid state electronic components such as transistor and diodes were the
    principal electronic components.

    - Speed of computing was measured in microseconds.

    - Considerable reduction in heat generation.

    - Remarkable improvement in reliability.

    - Increased storage capacity, magnetic tapes were also used for input/output operations.


    # Third-generation Computers (1965–1975)


    The invention of integrated circuits (ICs) reduced the cost and size of the computers
    (minicomputers). An integrated circuit (Figure 1.8) contains transistors, wiring
    and other components on a single silicon chip. A collection of programs called
    software packages became available for specific applications such as accounting
    or data processing. Software industries have been established over for developing
    various application software.


    ![](img/2e39d133c87ea945283efbb3d9eac1b7_38_1.png)


    The characteristics of third-generation computers are:


    +   - Use of Integrated Circuits (IC).

    - Speed of computing was measured in nanoseconds.

    - Occupied less space.

    - Improved input/output devices like visual display unit (monitor), line printers,
    magnetic tapes and so on were used.


    # Fourth-generation Computers (1975–1985)


    The fourth generation began with the invention of microcomputers (desktop computers).
    Developments and advancements in electronics allowed the whole computer subsystems
    to fit into a single circuit board. This generation also includes the introduction
    of computer networks.'
  merge: -1
  pgno: 38
