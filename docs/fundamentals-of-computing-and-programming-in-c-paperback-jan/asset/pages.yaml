    # Decimal to Binary Conversion


    The conversion of a decimal number to a binary is obtained by dividing the given
    decimal number repeatedly by 2 until the quotient is 0 or 1. This method of successive
    division by 2 is called double dabble.


    ```

    $35 / 2 = 17$ remainder 1

    $17 / 2 = 8$ remainder 1

    $8 / 2 = 4$ remainder 0

    $4 / 2 = 2$ remainder 0

    $2 / 2 = 1$ remainder 0

    ```


    The binary equivalent of 35$_{10}$ is 100011$_2$.'
