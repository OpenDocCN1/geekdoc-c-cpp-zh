    It is the name given to the interleaved execution of two or more programs in computer''s
    main memory and execute them concurrently. Multiprogramming refers to loading
    two or more programs in memory. We know that the working speed of the CPU is much
    more than the I/O devices. Hence the idle time of the computer to wait for input
    or output operations can be utilized to execute some other program.'
