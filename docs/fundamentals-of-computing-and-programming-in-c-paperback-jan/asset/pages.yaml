  md: 'CL-58 Computer Lab Programs


    +   (i) Creation of a list

    (ii) Insertion of nodes

    (iii) Traversal of the list

    (iv) Search of a specific node

    (v) Modification of a node

    (vi) Deletion of a node


    # Insertion in a list


    To insert a node at the beginning of an existing linked list, follow these steps:


    +   (i) Initialize, allocate memory and accept data into a node. Let us call this
    node **new**.

    (ii) Make **new''s next** point to the first node in the list. This can be done
    by


    ```

    new->next = start;

    ```


    +   (iii) Make **start** point to new (i.e., making it the first node). This can
    be done by


    ```

    start->new;

    ```


    The above steps are illustrated in Fig 15.2


    ![](img/2e39d133c87ea945283efbb3d9eac1b7_568_0.png)


    Fig 15.2


    # Creation of a Singly Linked List


    Creating a singly linked list is nothing but inserting into an empty list. Follow
    the same set of steps given under insertion with an additional step - check whether
    the value of **start** is equal to NULL, which means the list is empty. This involves
    two steps(Fig.15.2)


    +   (i) Creating a new node (allocate memory for the node and accept data into
    it).

    (ii) Storing the address of the node created in **start**.


    ```

    start->new;

    ```'
