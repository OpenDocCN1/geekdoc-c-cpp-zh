    To delete a node in the middle of the list, follow these steps


    +   (i) Traverse the list until you locate the item to be deleted. Let us call
    this pointer ptr.

    (ii) When you locate the item, delete it from the list by connecting the node
    before it with the node after it. To do this, maintain a pointer to the node before
    it isleted. This pointer will be referred to as prev.

    (iii) Physically delete the node by freeing it.


    ```

    prev->next = ptr->next;

    ```


    (The node has been separated from the list, i.e., it has been logically deleted)


    ```

    free(ptr);

    ```


