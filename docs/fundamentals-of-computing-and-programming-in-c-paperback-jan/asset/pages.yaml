    # PSEUDOCODES


    Pseudocode is a replica of the program code that cannot be executed on a computer,
    but it models the actual computer program. It uses the structural conventions
    of a programming language, but is intended for human reading rather than computer
    reading. Pseudocode is a tool used for planning a computer program logic or method.
    "Pseudo" means meaning, and "code" refer to instructions written in a computer
    language. The pseudocode instructions may be written in English, French, German
    or any vernacular language.


    Pseudocode is one of the methods that can be used to prepare the preliminary plan
    to develop a computer program. This is a general way of describing an algorithm
    without use of any particular programming language commands and statements. It
    resembles program code written roughly. It is also considered a program analysis
    tool that is used for planning of program logic. Pseudocode is prepared using
    the skeleton syntax of popular programming languages like C or FORTRAN and details
    about the program are written in natural language like English. Logic control
    words such as IF-THEN-ELSE as well as ENDIF are used to assist the programmer
    to develop the complete computer program. Proper indentation is used in IF-THEN-ELSE-ENDIF
    statement to indicate which instructions set to be executed if a condition is
    true and which are to be executed if the condition false.


    In pseudocode, various steps to solve the problem are given in right sequence,
    the style varies from person to person, there is usually an accompanying introduction
    explaining the syntax'
