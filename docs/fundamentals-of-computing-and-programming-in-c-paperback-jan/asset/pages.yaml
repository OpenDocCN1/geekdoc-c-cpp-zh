  md: '# CP-320 C Programming


    # STACKS


    A stack is a linear data structure in which insertions (push) and deletions (pop)
    are restricted to one end called Top. A good example for stacks in real life is
    a set of books piled up.


    ![](img/2e39d133c87ea945283efbb3d9eac1b7_497_0.png)


    Stack of Books


    As you know, you can insert or remove a book from a stack only from the top. Note
    that the book that is inserted last will be removed first. Stacks are also Last-In-First-Out
    (LIFO) lists because they come out in the reverse order as they go in. The basic
    operations on stacks are push and pop.


    The first book begins the stack of books. The next is placed on the top of the
    first, and the next on top of that, and so on. A book may be removed from the
    stack at any time, but only from the top. The order of pushing books on the stack
    of books or popping them from the top is arbitrary. There will always be a certain
    number of books on the stack. Pushing a book on the stack increases the number
    by one; popping a book decreases the number by one. Obviously you cannot pop a
    book off an empty stack. Nor can you push a book on a full stack. These two conditions
    are important.


    The linked list implementation of stacks allows us to have any number of data
    values as long as the primary memory has enough locations, whereas in an array
    the size of the array restricts the user from changing the size of the stack dynamically.
    The structure of a stack and the corresponding declaration are shown in figure.
    A stack is declared empty when the top becomes NULL, and a stack is declared full
    only when the malloc() function fails to return a free block of memory for creating
    a stack. The following operations are performed in a stack of finite sequence.


    +   i. Initialize the stack to be empty.

    ii. Check whether the stack is empty.

    iii. Check whether the stack is full.

    iv. If stack is not full, insert a new item at the top of the stack. This operation
    is called push.

    vv. If the stack is not empty, then retrieve the item at its top.

    vi. If the stack is not empty, then delete the item at its top. This operation
    is called pop.'
