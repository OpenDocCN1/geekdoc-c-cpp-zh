    # REPRESENTATION OF INTEGERS AND FRACTION


    A number that contains an integer and a fraction is called a floating-point number.
    A floating-point number has two parts: the integer part and fraction part. To
    convert a floating-point number to binary, we should convert the integer and fraction
    part into binary equivalents separately and finally join them with a decimal point.


    Let us convert 26.875 to its binary equivalent.


    Binary equivalent of 26:


    ```

    26 / 2 = 13 remainder 0

    13 / 2 = 6 remainder 1

    6 / 2 = 3 remainder 0

    3 / 2 = 1 remainder 1

    ```


    The binary equivalent of 26 is 11010.


    Binary equivalent of 0.875:


    Multiplying 0.875 by 2, we get 1.750. The integer part is 1.


    Multiplying 0.750 by 2, we get 1.50. The integer part is 1.


    Multiplying 0.50 by 2, we get 1.0. The integer part is 1.


    The binary equivalent of 0.875 is 111.


    Hence the binary equivalent of 26.875 is 11010.111.


    Note that the binary system groups the digits by the powers of 2 based on the
    position values as shown in Figure 2.1. Most Significant Digit (MSD) is the leftmost
    non-zero digit. It is the digit with the highest position value in a given number.
    Least Significant Digit (LSD) is the rightmost digit.


    | 2⁴ | 2³ | 2² | 2¹ | 2⁰ | 2⁻¹ | 2⁻² | 2⁻³ | 2⁻⁴ |

