  md: '# calloc() Function


    calloc() function is used to allocate memory in multiple blocks of same size during
    the program execution. The space allotted is used to store values of an array
    or structure. This function assigns the address of the first byte of the allotted
    space to a pointer. It also assigns 0 as the initial value for all bytes in the
    block of memory. It has the following form.


    ```

    ptr = (type *)calloc(n, m);

    ptr refers to pointer variable

    type refers to the data type to be stored in memory

    n refers to number of blocks to be allotted

    ```


    Consider the following example to allocate 50 blocks of 4 bytes. The total size
    of space allotted is 200 bytes.


    ```

    *xp;

    p = (float *)calloc(50, 4);

    xp = (float *)calloc(50, sizeof(float));

    ```


    The allotted space is used to store 50 float type values and are accessed by the
    pointer xp of the same type. Note that a NULL pointer is returned when there is
    insufficient space in memory.


    # realloc() Function


    realloc() function is used to modify or reallocate the memory space which is previously
    allotted. This facilitate to increase or reduce the allotted space at a later
    stage in a program. It is just a reallocation of memory and the first byte of
    the newly allotted space is assigned to the pointer. It has the following form.


    ```

    ptr = realloc(ptr, size);

    ptr refers to pointer of existing and new block.

    size refers to number of bytes to be newly allotted.

    ```


    Consider the following example to modify or reallocate the existing block of memory
    space.


    ```

    int *p;

    p = (int *)malloc(100);

    ...

    ...

    np = realloc(p, 400);

    ```


    The previously allotted space of 100 bytes to the pointer p is modified as 400
    bytes at a later stage of the program.'
