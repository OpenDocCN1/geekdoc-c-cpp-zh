  md: '# FC-32 Fundamentals of Computing


    # USB flash drive


    A USB flash drive (Pen drive) is a data storage device (Figure 1.31) that includes
    flash memory with an integrated Universal Serial Bus (USB) interface. It consists
    of a small printed circuit board with the circuit elements and a USB connector,
    insulated electrically and protected inside a plastic case which can be easily
    carried. USB flash drives draw power from the computer via the USB connection.
    USB flash drives are often used for storage, back-up and transfer of computer
    files. USB flash drives are removable and rewritable. They have more capacity,
    smaller in size, faster in read/write operations and are durable as well as reliable.
    USB flash drives of data storage up to one-terabyte (TB) are commonly available.


