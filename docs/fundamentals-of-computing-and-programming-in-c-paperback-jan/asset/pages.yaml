  md: "# CP-86 C Programming\n\n# Example\n\n```\ni = 1;\ndo{\n    s = s + i;\n  \
    \  p = p * i;\n}\nwhile (i <= 10);\n```\n\nWhen this statement is executed, the\
    \ computer will execute the statement block irrespective of the value of the condition.\
    \ At the end of statement block, the condition is evaluated. If the value of the\
    \ condition **true** the statement block is executed again and is repeated until\
    \ the condition is **false**.\n\nNote that the statement block is executed at\
    \ least once for any value (**true or false**) of the condition. It is necessary\
    \ to have a statement inside the block to change the value of the condition, otherwise\
    \ the loop is infinite.\n\n# COMPARISON OF THE LOOP CONTROL STRUCTURES\n\n| for\
    \ loop | while loop | do-while loop |\n| --- | --- | --- |\n| A for loop is used\
    \ to execute and repeat a statement blocking on a condition which is evaluated\
    \ at the beginning of the loop. | A while loop is used to execute and repeat a\
    \ statement blocking on a condition which is evaluated at the beginning of the\
    \ loop. | A do-while loop is used to execute and repeat a statement blocking on\
    \ a condition which is evaluated at the end of the loop. |\n| Example\n```for(i=1;\
    \ i<=10; i++) {\ns = s + i;\np = p * i;}\\``` | Example\n```while (i <= 10) {\n\
    s = s + i;\np = p * i;\n}``` | Example\n```i = 1;\ndo {\ns = s + i;\np = p * i;\n\
    }``` |\n| A variable value is initialized at the beginning of the loop and is\
    \ used in the condition. | A variable value is initialized at the beginning or\
    \ before the loop and is used in the condition. | A variable value is initialized\
    \ before the loop or assigned inside the loop and used in the condition. |\n|\
    \ A statement to change the value of the condition or to increment the value of\
    \ the variable is given at the beginning of the loop. | A statement to change\
    \ the value of the condition or to increment the value of the variable is given\
    \ inside the loop. | A statement to change the value of the condition or to increment\
    \ the value of the variable is given inside the loop."
