    # FLOWCHART


    Flowchart is a visual representation of flow of data in a computer program. It
    also indicates the operations carried out using data within the program and the
    sequence in which all these operations are carried out. Flowchart describes all
    processes and logical order in which the processes are carried out solve a given
    problem. Similar to the building plan prepared by an architect before the construction
    of any new building, the computer programmer prepares a flowchart before writing
    a computer program. Like the rules followed in the preparation of building drawing,
    flowchart is drawn using some standard flowchart symbols and simple guidelines.


    In a flowchart various symbols are used to indicate specific operations and it
    shows the representation of the sequence of operations to perform or solve a problem.
    Computer program for any given problem is generally formulated through flowcharts.
    Flowcharts help to interact with the users of the program and the team of programmers
    in the development of a program. The program logic of any complicated as well
    as length problem is simplified and explained through flowcharts. Thus it plays
    a very important role in developing a computer program for solving a given problem.
    The flowchart itself is a better documentation for any complex or length problem.
    After preparing the flowchart, the program code is written in any of the high
    language languages like C, C++, etc.


    # Flowchart Symbols


    Flowcharts are prepared using various symbols; each symbol indicates a specific
    operation to be carried out or processing the information. Some of the standard
    symbols which are frequently used for preparing flowchart are shown in Table 3.1.'
