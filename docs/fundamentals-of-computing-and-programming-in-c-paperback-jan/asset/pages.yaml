  md: 'Introduction to Programming Languages FC-133


    # Second-generation Language (1950–58)


    In second-generation language, instructions are written with mnemonics to simplify
    the program. The symbolic instruction is called Assembly Language. In order to
    execute these instructions, all mnemonics are converted into binaries with the
    help of a translator known as Assembler. The program written using mnemonics is
    called Source Program; the binary form of the source program is called Object
    Program.


    American Standard Code for Information Interchange (ASCII) is commonly used to
    translate the source program into object program. Refer Appendix for complete
    ASCII list and its binary equivalents). Consider the following example, which
    executes an assembly language.


    | Source Program | e.g. ADD R1, A, B

    MOV R1, S |

    |---||

    | Assembler | translated by assembler |

    | Object Program | 0101 00101010

    0100 00101111


    The mnemonic code in assembly language uses a three letter instruction for each
    operation to be performed. For example, the mnemonic ADD is used for addition,
    SUB is for subtraction and so on. Each instruction in the program is written on
    a separate line. Each line consists of four columns filled. Consider the following
    line written in assembly language to add two values, A, B and store the result
    in C similar to the arithmetic C = A + B,


    | Label | Opcode (mnemonic) | Operands | Comments |

    |---|---|---||

    | BEGIN | ADD | C, A, B | Add values of A and B and store result in C


    Assembly language programs are commonly used to write programs for electronic
    controls using microprocessors, e.g. computed copier machine, customer telephone
    billing and so on.


    C language is one of the programming languages used to access the assembly language
    as its subroutine for any low-level programming.


    # Advantages of assembly language


    +   (a) Assembly language instructions can be written easily than the machine
    language instruction. Programmers need not memorize the addresses of the data
    items in the memory.


    +   (b) Assembly language programs are less error-prone. The assembler (translator)
    can also detect the error in the machine language instructions.


    +   (c) Assembly language programs process quickly and use less memory. Size of
    the program is also smaller when compared to similar program in other languages.


    +   (d) Assembly language instructions have strong control over the electronic
    hardware of the machine/computer.'
