    # Extended Binary Decoded Decimal Code (EBDCIC)


    Extended Binary Decoded Decimal Code (EBDCIC) is an 8-bit character encoding used
    on IBM mainframe and IBM midrange computer operating systems. EBDCIC decoded from
    the code used with punched cards and the 6-bit binary-coded decimal (BCD) code
    used with most of IBM''s computer peripherals.


    The major drawback with the BCD code is that it allows only 64 characters to be
    represented. This is not sufficient to provide for lowercase letters and a large
    number of special characters. The BCD code was, however, extended from a 6-bit
    to an 8-bit code. The added 2 bits are used as additional zones, expanding the
    bits to 4. This resulting code is called the Extended Binary Decoded Decimal Code
    (EBDCIC). Using the EBDCIC it is possible to represent ²⁸ or 256 characters. This
    takes care of the character requirement along with a large quantity of printable
    and several non-printable control characters (like the movement of the cursor
    on the screen, virtual printing and so on).


    Since EBDCIC is an 8-bit code, it can be easily divided into two 4-bit groups.
    Each of these groups are represented by one hexadecimal digit. Thus, hexadecimal
    number is used as a notation for memory storage by computers that use EBDCIC for
    internal representation of characters. EBDCIC code is developed by IBM and used
    mostly in IBM models and many other computers. All mainframe and midrange peripherals
    and operating systems use EBDCIC as their inherent encoding, EBDCIC has no technical
    advantage compared to ASCII-based code except for the inclusion of the “” (cent)
    character.


