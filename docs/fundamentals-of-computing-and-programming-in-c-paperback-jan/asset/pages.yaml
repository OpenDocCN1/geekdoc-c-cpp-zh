  md: '13. What is a character constant?

    A character constant consists of a character enclosed in single quotes. For example,

    ''A'' ''?''


    14. How are strings manipulated in C?

    In language, strings are manipulated using string handling functions as strcpy(),
    strlen and so on. These functions are available in the header file ''string.h''.


    +   15. Name any four functions available in string.h.

    (i) strcat()

    (ii) strcpy()

    (iii) strcat()

    (iv) strlen()


    16. What is a string?

    A string of characters always delimited by double quotes. For example,

    "New Delhi - 110 008"


    17. How do you identify where a string ends?

    The end of a string is indicated by a null character ''\0''.


    18. What is the difference between ''a'' and "a" in C?

    In Language, ''a'' is a character constant and "a" is a string constant.


    19. With an example, explain how to access individual characters in a string.

    A string in C is declared as an array of characters. For example,

    char s[10] = "CALCULATE";nEach character in this string is accessed using the
    array name with subscript. For example,

    s[3] will access the character in 3rd position.

    s[i] will access the character in the position.


    20. What is ASCII character? How common is its use?

    The American Standard Code for Information Interchange (ASCII) is a simple transformation

    code used to access a character through an integer. For example, the character
    ''A'' is accessed

    65, ''B'' using 66 and so on.

    In language, integers are used to represent characters (and vice versa) using
    the data types

    int. char.


    21. What does the conversion specification %6s mean?

    The conversion specification %6s means a total of 6 characters to print a character
    string.

    For example, the character "NEW" is printed as shown below using this specification.


    | 0 1 2 3 4 5 |

    | | | | N E W | ← 6 places |


    Note that the characters are printed right justified in the allotted space width
    of 6 characters.'
