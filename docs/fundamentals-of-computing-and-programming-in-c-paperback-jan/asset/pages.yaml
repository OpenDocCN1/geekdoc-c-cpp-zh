    # DVD


    DVD stands for “digital video disc” or “digital versatile disc”. It is a digital
    disc storage device invented and developed by Philips/Sony/Toshiba/Panasonic in
    1995. These discs are recorded in DVD drives or played in DVD players. Size of
    a CD (120mm diameter) and DVD are same but a DVD offer higher storage capacity
    than a CD. A standard single-sided, single-layer DVD can store up to 4.7 GB of
    data. There are few other DVD formats available to store more than 4 GB of data.
    Double-layer DVDs also exist, but are not compatible with DVD-RW drives. Rewritable
    DVD discs (DVD-R and DVD+R) are used to record/write data using a DVD recorder
    and then used as a DVD-ROM. In a rewritable DVD disc, (DVD-RW, DVD+RW, and DVD-RAM),
    data can be recorded, erased and reused any number of times.


    # Blu-ray Disc (BD)


    Blu-ray disc is a digital optical disc storage format that is capable of storing
    high-definition video resolution. Note that High-definition (HD) provides a resolution
    that is substantially higher than that of standard-definition video resolution.
    The name Blu-ray refers to the blue laser used to read the disc, which allows
    information to be stored at a greater density than the red laser. Blu-ray disc
    is also a plastic disc of 120 mm in diameter and 1.2 mm thick, similar to a DVD
    and CD. Single layer Blu-ray disc can store 25 GB, dual layer disc can store 50
    GB, and triple layer disc can store 100 GB and quadruple layers with storage capacity
    of 128 GB are available for BD-XL re-writer drives. Blu-ray was introduced in
    Japan in the year 2003 by Sony/Hitachi/Phillips.'
