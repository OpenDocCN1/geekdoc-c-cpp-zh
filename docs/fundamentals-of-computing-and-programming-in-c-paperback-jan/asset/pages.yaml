    # Desktop Computers


    A desktop computer or personal computer (PC) is a microcomputer designed for use
    by one person at a time. In early days, computers were designed for larger companies
    who attached terminals, with a keyboard and monitor. For multiple users the resources
    were shared by all users from a single large computer. In late 1980s, technology
    developments made it possible to build small computers that an individual can
    use and are used as personal computers.


    The term “PC” has been conventionally used to describe an “IBM-compatible” personal
    computer in contradiction to an Macintosh computer. The “IBM-compatible” PC was
    the one with Intel microprocessor architecture and an operating system as DOS
    or Windows. The Apple Macintosh uses Motorola microprocessor architecture and
    a proprietary operating system. The “IBM-compatible” PC was related with business
    and personal use. But the “Mac”, known for its more sensitive user interface,
    was related with graphic design and desktop publishing. Although the distinctions
    have become less clear-cut in recent years, people categorize a personal computer
    as either a PC or a Mac. The personal computers (PCs) are commonly used in educational
    institutions and in small offices.


    # Workstations


    A workstation means a more powerful personal computer for special applications.
    Workstations are computers that are intended to serve one user and may contain
    special hardware enhancements that are not found on a personal computer (Figure
    1.16). A workstation is used for solving problems in advanced engineering, 3D
    industrial design, digital content creation, demanding technical and scientific
    computing and complex multi-tasking application environments.


