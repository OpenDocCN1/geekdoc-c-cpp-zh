    except that printf f () is used to write data to the disk. It has the following
    form:


    printf(fptr, "format string", v1, v2,...vn);


    where fp refers to file pointer

    v1, v2,...vn refers to variables whose values are written to the disk

    "format string" refers to the control string which represents the conversion specification'
