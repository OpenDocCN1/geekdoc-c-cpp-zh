    # Scanner


    Scanners are used to scan a printed page, a photograph or an illustration. These
    data are converted into bit patterns for processing, storage or output. When an
    image is scanned, it is converted into light and dark picture elements (pixels).
    The scanned images are used for word processing, desktop publishing and printing
    multiple copies. Scanners are also used to scan fingerprints. The scanned fingerprints
    can be compared with another fingerprint to find probable match in investigative
    services. Scanners are also used to read barcodes from products and sales tags.


    Scanners are available in different sizes. A handheld scanner is used to scan
