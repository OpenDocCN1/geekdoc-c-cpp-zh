  md: '# Number Systems FC-55


    The position value of each digit can be expressed in terms of 2 as given in 2²,
    2¹, 2⁰ and so on. The position weight of 2⁰ is 1, 2¹ is 2, 2² is 4, 2³ is 8 and
    so on. Similarly the weight of 2⁻¹ is 0.5, 2⁻² is 0.25, 2⁻³ is 0.125 and so on.
    These position weights are multiplied by their respective digits and are added
    to get the equivalent binary in decimal system.


    Consider the following example, decimal number equivalent of the binary 10101.011


    | Binary number | 1 | 0 | 1 | 0 | 1 | | 0 | 1 | 1 |

    |---|---|---|---|---|---|---|---|---||

    | Position value | 2⁴ | 2³ | 2² | 2¹ | 2⁰ | | 2⁻¹ | 2⁻² | 2⁻³ |

    | | 16 | 8 | 4 | 2 | 1 | | 0.5 | 0.25 | 0.125 |

    | Add position values | 16 | 0 | 4 | 0 | 1 | | 0.5 | 0.25 | 0.125 |

    | | | | | | | | Decimal value is 21 + 0.375 = 21.375 |


    The decimal number equivalent of the binary 10101.011 can also be obtained directly
    as given.


    ```

    10101.011 = 1×2⁴ + 0×2³ + 1×2² + 0×2¹ + 1×2⁰ + 0×2⁻¹ + 1×2⁻² + 1×2⁻³

    = 16 + 0 + 4 + 0 + 1 + 0 + 0.25 + 0.125

    = 21.375₁₀

    ```


    Hence the decimal equivalent of 10101.011 is 21.375.


    # Floating Point Representation of Numbers


    In the decimal system, the biggest and the smallest numbers are expressed in scientific
    notation like 4.69 × 10³⁸ and 1.691 × 10⁻¹⁹. Binary numbers can also be expressed
    in this notation by floating point representation. The floating point representation
    of a number consists of two parts. The first part represents a signed fixed point
    number called the mantissa. The second part designates the position of the decimal
    (or binary) point and is the exponent. The fixed point mantissa may be fraction
    or an integer. The number of bits required to express the exponent and mantissa
    are determined by the accuracy desired from the computing system as as its capability
    to handle such numbers.


    For example, the decimal number6132.789 can be represented in floating point as
    follows.


    ![](img/2e39d133c87ea945283efbb3d9eac1b7_84_0.png)'
