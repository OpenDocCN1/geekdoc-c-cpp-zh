    # FILE INCLUSION


    A file directive is commonly used to include the contents of standard header files
    in a C program. Any previously written program can be included in a new program.
    This enables the user to use the functions and macros defined in that program.
    Even bigger programs stored in different files can be included in a new program
    as a header file. It has the following form.


    ```

    #include <filename>

    or

    #include "file name"

    ```


    # Example


    ```

    #include <stdio.h>

    #include <string.h>

    ```


    When the file name is inside angle brackets, the computer will search the file
    only in the specified list of directories available in the storage device (hard
    disk).'
