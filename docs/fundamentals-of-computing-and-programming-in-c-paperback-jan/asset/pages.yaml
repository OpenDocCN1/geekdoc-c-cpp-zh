    PREPROCESSOR


    The preprocessor is a program which is executed before the compilation of a source
    program written by the user. A source program is processed by means of commands
    or preprocessor directives. The preprocessor directives begin with hash (#) followed
    by the command.


    Example


    ```

    #include

    It is a directive to include a file.

    ```'
