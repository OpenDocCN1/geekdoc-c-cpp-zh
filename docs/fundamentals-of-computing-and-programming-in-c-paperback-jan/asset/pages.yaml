  md: '# B.E./B.TECH. SYLLABUS OF KERALA UNIVERSITY, THIRUVANANTHAPURAM


    | Subject Code and Name: 13.109 FOUNDATIONS OF COMPUTING AND PROGRAMMING IN C
    |

    | S.No. | Content | Reference Chapters |

    | Module - I | Introduction to digital computer - von Newman concept - A simple
    model of computer with acquisition of data, storage of data, processing of data,
    output of processed data. Details of functional units of a computer. primary storage
    and secondary storage. Data representation - Number systems - Binary numbers -
    representation of integers - representation of fractions - octal and hexadecimal
    representations - conversion from one to another - representation of BCD numbers.
    Simple arithmetic operations (addition, subtraction, multiplication and division)
    on each representation. Floating point representation - normalization, arithmetic
    operations. Representation of characters in computer - ASCII, EBCDIC. | Part I:
    Chapters 1 and 2 |

    | Module - II | Introduction to programming languages: Types of programming languages
    - high level language, assembly language and machine language Software - Operating
    systems - objectives of operating systems, compiler, assembler and interpreter
    (concepts only). Solving strategies: Problem analysis - formal definition of problem
    - Solution - top down design - breaking a problem into sub problems- overview
    of the solution to the sub problems by writing step by step procedure (algorithm)
    - representation of procedure by flowchart- refinement of algorithm. Implementation
    of algorithms - use procedures to achieve modularity. Examples for algorithms
    and flow charts: At least 10 problems (starting with non numerical examples and
    numeric problems like factorial, largest among three numbers, largest among N,
    Fibonacci etc) must be discussed in detail. Programming: Selection of appropriate
    variable names for memory address, documentation of programs, debugging, different
    types of errors, program testing and verification (preliminary treatment only).
    | Part I: Chapters 3 to 5 Part II: Chapter 1 |'
