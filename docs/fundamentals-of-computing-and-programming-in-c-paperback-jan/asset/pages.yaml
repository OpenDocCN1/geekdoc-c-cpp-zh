  md: '# FC-34 Fundamentals of Computing


    # Printers


    A printer is an output device used to print text or graphics on paper or on any
    other hardly medium as microfilm. The output from the computer is produced using
    the printer. Printers follow two methods of printing namely impact method and
    non-impact method.


    Printers are categorised based on the physical contact of the printer head with
    the paper to produce a text or image. An impact printer is one in which the printer
    head will be in physical contact with the paper. In a non-impact printer, on the
    other hand, the printer head will have no physical contact with the paper.


    # Laser Printer


    Laser printer is a non-impact printer which produces high quality prints at high
    speeds. It operates like a copier machine. In a laser printer, the controlled
    beam of intense laser forms images on an electrically charged rotating drum. The
    drum is rotated near the fine black powder called toner. These charged images
    attract toner particles and produce images, which sticks to the paper due to pressure
    and heat. The toner is composed of oppositely charged ink particles which sticks
    to the drum in the places that have been charged by laser beams.


    ![](img/2e39d133c87ea945283efbb3d9eac1b7_63_0.png)


    Figure 1.35 Print using a laser printer


    The light beam strikes a multi-sided rotating mirror. As the mirrors rotate, the
    side sweeps the beam across the surface of the drum. As the beam sweeps across
    the drum, the light is modulated and a single line is drawn. After a line has
    been drawn, the next side of the drum is in place and a new line is drawn over
    the previous line (Figure 1.35). Note that now the drum has moved or rotated by
    one line.


    The quality of the printout is measured by the number of dots per inch (dpi).
    Since the dots are printed closely, the text or graphics appears very smooth and
    elegant. High quality text or graphics is printed with the dot density of 600
    to 800 dpi. The speed of pages printed per minute which varies between 12 and
    64.'
