  md: '# EVOLUTION OF COMPUTERS


    The evolution of computers over a period of time can be marked effectively by
    dividing this period into various generations. Each generation is described by
    a major technological development that basically changed the computers operated.
    Thus, today''s computers are cheaper, powerful, smaller, efficient and reliable
    computation and information processing devices. The generation of computers could
    be broadly classified into five stages and their development are discussed in
    detail as follows.

    The ENIAC (Electronic Numerical Integrator And Calculator) was built during 1943
    to 1946 under the guidance of John W. Mauly and J.Harper Eckert at the Moore School
    of Electronic Engineering, University of Pennsylvania. It comprised over 18,000
    vacuum tubes, 70,000 registers and 10,000 capacitors, and consumed over 150 kilowatts
    power. Input/output operations were on punched cards. Programs were constructed
    by changing the connections between the components. This required complete knowledge
    of the machine by the user.


    # von Neumann Concept


    John von Neumann who was involved in the ENIAC project proposed that the instructions
    could be stored in the computer along with the data. This was known as the von
    Neumann concept. This has increased the flexibility and versatility of computers
    in two ways. They are:


    +   (i) The instructions could be changed without changing connections between
    the components.

    (ii) The instructions could be stored as numbers, and the computer could process
    the instructions like data. Hence modification of instructions was made possible.


    In 1952, von Neumann, and H.H. Goldstone constructed a stored program computer
    called EDVAC (Electronic Discrete Variable Automatic Computer).


    The term von Neumann model or von architecture originates from a computer architecture
    description made by the mathematician and computer scientist John von Neumann
    and others. This describes the digital computer by subdivisions of a processing
    unit that consists of an arithmetic and logic unit, a control unit containing
    an instruction register, a memory to store data and instructions, external storage
    or main memory, and input and output devices. The term means a stored-program
    computer in which the fetching of instruction and data cannot occur at the same
    time because they share a common bus. This is referred to as the von Neumann bottleneck
    and limits of the computer.


    Characteristics of the von Neumann model includes the following points:


    +   (i) Program is stored in memory.

    (ii) Memory is shared between program and data.

    (iii) Program instructions are executed sequentially and thus make it a great
    model for designing algorithm to solve any problem.


    A stored-program digital computer is one that keeps its programmed instructions
    and data, in the read-write random-access memory (RAM). Stored-program computers
    are advanced ones over'
  merge: -1
  pgno: 35
- img_proc: true
  md: '# Introduction to Computers FC-7


    the program-controlled computers of the 1940s, such as the Colossus and the ENIAC,
    which were programmed by setting switches and inserting patch leads to route data
    and to control signals between functional units. The computer has hardware (Figure
    1.5) to do the following functions:


    +   (i) Read input data from an input device into memory.

    (ii) Perform arithmetic/logical operations on values stored in memory.

    (iii) Control the sequence in which the above actions are executed.

    (iv) Write the results (output) from memory to an output device (monitor, disk).


    ![](img/2e39d133c87ea945283efbb3d9eac1b7_36_0.png)


    Figure 1.5 Schematic diagram of a von Neumann architecture


    Consider an example to find an average of two values. The steps involved in this
    problem are given below.


    +   Step 1: Input values to computer

    Step 2: Compute average

    Step 3: Display average


    The control sequence can be used to transfer the control to any required step
    or to repeat the steps for any number of times. There may be some ambiguities
    about the data type of input value, maximum and minimum range of the value, etc.
    A program is normally developed for a general case rather than a specific type
    problem for particular input value.


    Many other stored program computers were developed thereafter the EDSAC (Electronic
    Delay Storage Automatic Calculator) at Cambridge University, the IASAC at Princeton
    University under the supervision of von Neumann, the ILLIAC at University of Illinois,
    the MANIAS at Los Alamos and the WHIRLWIND at Massachusetts Institute of Technology.'
  merge: -1
