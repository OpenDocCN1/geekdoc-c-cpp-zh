  md: '# CHAPTER


    # 1

    Introduction to Computers


    +   CHAPTER OBJECTIVES

    * What is a Computer? * Data Storage in Computers

    * Methodology of Usage * Functional Units of Computers

    * Steps in Information Processing * Input Devices

    * Characteristics of Computers * Storage Devices

    * Evolution of Computers * Output Devices

    * Generations of Computers * Softcopy

    * Classification of Computers * Hardcopy

    * Computer Organisation * Applications of Computers

    * Computer Memory and its Organization


    WHAT IS A COMPUTER?

    A computer is an electronic device capable of manipulating numbers and symbols
    under the control of a set of instructions known as a computer program. A computer
    program directs the computer to solve a particular problem and display results.
    Computer programs are written using programming languages such as BASIC, FORTRAN,
    COBOL, PASCAL, C, ALGOL, and so on.'
  merge: -1
  pgno: 30
- img_proc: true
  md: '# FC-2 Fundamentals of Computing


    A computer is a programmable computing machine which contains electronic components
    that are supported by electrical devices and mechanical systems. The basic parts
    of a computer are hardware and software. Hardware represents the physical parts
    of the computer which consists of the electronic circuits, integrated circuits,
    microprocessors etc. The electrical and mechanical components include power supply,
    CD or hard disk drives, small fan provided for air circulation, display monitor,
    keyboard etc. The computer hardware components are activated and controlled with
    the help of computer programs called software. Software is the collection of computer
    programs that instruct the hardware to do any specific task. The computer software
    is developed by a computer programmer using low-level languages as assembly language
    or high-level languages like C, C++, Java etc.


    # METHODOLOGY OF USING COMPUTERS


    To understand the usage of a computer, let us compare a calculator (Figure 1.1)
    with a computer (Figure 1.2). A computer is used to solve a problem (or perform
    a task), indirectly, by executing (running) a computer program. But, a calculator,
    commonly used by everyone, is used to perform a sequence of operations (using
    arithmetic) by pressing the keys. Let us see how a simple arithmetic operation
    (addition) is performed by a calculator and by a computer.


    ![](img/2e39d133c87ea945283efbb3d9eac1b7_31_0.png)


    Figure 1.1 Calculator


    ![](img/2e39d133c87ea945283efbb3d9eac1b7_31_1.png)


    Figure 1.2 Computer'
  merge: -1
  pgno: 31
- img_proc: true
  md: '# Introduction to Computers FC-3


    To perform any task using a computer, programs are needed. These programs are
    written using the mathematical methods and the logical sequences to get the desired
    results.


    Nowadays for most commercial and general engineering applications, programs (called
    software packages) are readily available. But, for specific applications we will
    have to write new programs, giving more space to software programmers.


    # SIMPLE MODEL OF A COMPUTER


    A simple model of a computer contains an input device (like Keyboard) to read
    data to the computer. A data is the data (information) fed to a computer which
    may be a number or string of characters related to a problem to be solved using
    computer. For example, the data of a student are name—“RAHUL"; age–18; marks–78%.
    These data will be processed by the central processing unit (e.g. Intel i7 Processor)
    as per the instructions of the program; the results obtained through the processing
    will be displayed in the output device (Monitor). The schematic diagram of a model
    computer is illustrated in Figure 1.3.


    ![](img/2e39d133c87ea945283efbb3d9eac1b7_32_0.png)


    Figure 1.3 Schematic diagram of a simple computer


    # STEPS IN INFORMATION PROCESSING


    The processing of any information starts with the acquisition of data using the
    keyboard, storing that data in the memory, processing the acquired data by CPU
    and finally displaying the results using the monitor screen. Various steps in
    data processing are shown in Figure 1.4


    Data provided by the user


    ![](img/2e39d133c87ea945283efbb3d9eac1b7_32_1.png)


    Figure 1.4 Steps involved in processing of data'
  merge: -1
  pgno: 32
- img_proc: true
  md: '# FC-4 Fundamentals of Computing


    Various steps involved in processing of data and display of results are discussed
    in detail.


    # Acquisition of data


    Acquisition of numeric data or text information is normally obtained by typing
    them using keyboard which is considered as the input to the computer. In the modern
    computers, data is also obtained using a mouse by selecting the appropriate value
    that appears in a window on the display screen.


    # Storage of data


    The acquired data is stored temporarily in the primary or main memory called RAM
    (Random Access Memory) for processing. The values stored in the RAM are active
    during the execution of the current program. These values will be cleared from
    the RAM by the computer when the user switches over to a different program.


    # Processing of data


    The data acquired are processed by the central processing unit based on the instructions
    given in the computer program. The desired result is obtained after the data given
    are processed by the CPU. Hence, the data supplied by the user must be appropriate.
    For example, the data for AGE of a person may vary between 1 and 100 in normal
    cases. But, entering the data as a negative number, zero, and bigger number or
    fractional number may lead to inappropriate results. This possibility of entering
    inappropriate value could also be controlled through computer programs.


    # Display output


    The result obtained from the processed data will be displayed on the monitor screen.
    In the modern computers, LCD monitors are used. The results can also be directly
    printed using a printer. The accuracy of the results depends on the appropriate
    input data and proper coding used in the computer program.


    # COMPUTER HARDWARE AND SOFTWARE


    A computer basically consists of electronic components which are supported by
    electrical devices and mechanical systems. All these electronic, electrical and
    mechanical components used in a computer are called computer hardware.


    Computer hardware components are activated and controlled with the help of computer
    programs called computer software. Computer software are classified into two categories:


    +   (i) Application software programs are used to solve specific problems (tasks)
    like railway reservation, banking operations, etc.


    +   (ii) System software are programs used to handle the computer hardware and
    to execute the application programs. Operating systems and language processors
    (compilers) are also system softwares (which shall be discussed later).'
  merge: -1
  pgno: 33
- img_proc: true
  md: '# CHARACTERISTICS OF COMPUTERS


    Computers are extremely useful of the following characteristics:


    +   1. **Speed**: A computer can process data faster than any other machine. It
    can perform a calculation many times faster than humans. A powerful computer is
    capable of performing billion (10⁹) operations in a second. The speed of a computer
    is expressed in fractions of milliseconds (10⁻³), microseconds (10⁻⁶), nanoseconds
    (10⁻⁹) and picoseconds (10⁻¹²).

    2. **Accuracy**: Computers have high accuracy in arithmetic calculations than
    human beings. A computer can do calculations up to an accuracy of 16 digits.

    3. **Diligence**: Computers can work continuously for months or years, and they
    do not get tired or feel monotony. They are consistent in all operations for any
    number of repetitions or iterations.

    4. **Automatic**: The operations of a computer are controlled by a set of instructions
    known as computer programs. This program is coded exactly as per the sequence
    of operations the computer should perform to complete a task. Any error in the
    program disrupts the execution of task.

    5. **Versatility**: Computers can perform any number of tasks either sequentially
    or simultaneously. At one moment you can prepare a salary bill of employees and
    next moment you may prepare and print a letter.

    6. **Memory and Storage**: A computer can store a lot of information (data) in
    Random Access Memory (RAM) temporarily. Storage devices like floppy disk, hard
    disk, compact disk or tape are used to store data permanently. You may retrieve
    data from a storage device after several years.

    7. **A rigid machine**: A computer does not have feelings or emotions like human
    beings. However computers have artificial intelligence.


    # FEATURES OF COMPUTERS


    The important features of a computer are:


    +   (i) A computer provides an exact solution using a set of instructions.

    (ii) Instructions to a computer are written with simple operations like add, subtract,
    read or display a character etc.

    (iii) A computer can execute millions of instructions per second.

    (iv) A computer executes the instructions exactly as given.

    (v) The execution of instructions may be terminated based on the required number
    of steps given.

    (vi) A computer uses generalized instructions for any problem. The result obtained
    from a computer may be verified for known input values.

    (vii) A computer can store and process large quantity of data.'
  merge: -1
