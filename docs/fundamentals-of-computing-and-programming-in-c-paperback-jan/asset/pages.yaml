    EOF (End of File)


    A text file contains information stored in the form of string of characters. The
    characters entered through the keyboard are stored continuously as illustrated
    below.


    A text file


    ```

    Computer is an electronic device or a multipurpose tool which can be used for
    data processing, numerical problem solving, graphical 2D or 3D picture generation,
    multimedia applications and so on.

    ```


    EOF (End of File)


    # Sequential and Random Files


    Depending on the method of accessing the data stored, files can be classified
    as (i) sequential files and (ii) random files.


    In a sequential file, information/data is stored sequentially by one. The data
    is read in the same order in which they are stored. But in a random file, information/data
    can be read randomly. Normally a key is used to identify the required record in
    random file accessing. For example, student roll number can be used as a key field
    in a student data file.


    # FILE PROCESSING


    Data/information stored in a storage device are accessed using a file pointer.
    The file processing involves the following operations.'
