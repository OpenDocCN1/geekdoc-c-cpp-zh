  md: '# CP-272 C Programming


    ![](img/2e39d133c87ea945283efbb3d9eac1b7_449_0.png)


    A file stored in a storage device is always identified using a file name (e.g.
    STUDENT.DAT TEXTINFO.TXT and so on). Note that a filename normally has a primary
    name and a secondary name which are separated by a dot ().


    # STUDENT.DAT Primary Separator Secondary


    The primary and secondary names are assigned by the programmer. Normally the secondary
    name is used to identify the nature of the file. Consider the following secondary
    names for files.


    +   * DAT is used to refer to a Data file.

    * TXT is used to refer to a Text file.


    Also note that the secondary names are optional.


    # TYPE OF FILES


    Files are classified based on the type of data/information stored in them. The
    two types of files are (i) data file and (ii) text file.


    A data file contains data in the form of records. A record is a collection of
    data related to a person or an item. For example, a student record may contain
    data like roll number, students name and marks obtained by him. Note that a record
    is called as a structure in C language. A file contains many such records/structures
    of data. Imagine that the records are arranged one by one as shown in the following
    illustration.'
  merge: -1
  pgno: 449
