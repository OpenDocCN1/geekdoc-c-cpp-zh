    # ASSIGNMENT STATEMENT


    An assignment statement is used to assign a value to a variable. It has the following
    form.


    Variable = Value or expression;


    # Example


    ```

    m = 25;

    y = x*x+4*x-6;

    s = s + x;

    ```


    # MULTIPLE ASSIGNMENT STATEMENT


    A multiple assignment statement is used to assign a value to more than one variable.
    It has the following form.


    ```

    V1 = V2 . . . Vn = Value or expression;

    where V1, V2 . . . are variables.

    ```


    # Example


    ```

    m = n = 3;

    np = nn = nz = 0;

    x = y = (a * a + b * b) / 2;

    ```


