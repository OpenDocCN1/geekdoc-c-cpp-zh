  md: '# FC-148 Fundamentals of Computing


    The three states in a time-sharing system are Ready, Running and Blocked.


    The jobs 1, 2 and 3 are in three states as Ready, Running and Blocked in cycle
    respectively (Figure 5.11). Job 3 is in a ready state for execution as soon as
    job 2 is executed and job 1 completes its output. In the time-sharing system,
    the CPU will never be idle as long as there is some job to be executed.


