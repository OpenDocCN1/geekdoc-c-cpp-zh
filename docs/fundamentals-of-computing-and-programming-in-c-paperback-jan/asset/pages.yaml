  md: '# C Preprocessor and Command Line Arguments CP-303


    Blanks or white spaces


    ```

    #define TITLE "ABC & Co"

    // no ; here

    ```


    Macro names with arguments can be written in the following form.


    ```

    #define identifier(a1, a2 ... an) string

    ```


    # Example


    ```

    #define SQR(x) x*x

    #define TRIAREA(a,b,c) sqrt(s-a)*(s-b)*(s-c)

    ```


    At the time of preprocessing, wherever SQR(x) and TRIAREA(a,b,c) appear, they
    are substituted by strings x*x and sqrt(s-a)*(s-b)*(s-c)) respectively.


    A C program having more macros or operators can be written in a more readable
    format using macros. The macros of this kind are given below:


    ```

    #define BEGIN {

    #define END }

    #define EQUALS ==

    #define AND &&

    #define BIG(a,b) ((a > b) ? a : b)

    ```


