    \ a = %d b = %d \" *a,b);\n getch();\n }\n void add10(int x, int y)\n{\n x = x\
    \ + 10;\n y = y + 10;\n printf(\"\\n\\n Inside the function a = %d b = %d \" *x,y);\n\
    \ }\n```\n\nWhen this program is executed, the values of the variables a and b\
    \ are printed before and after the function call and also inside the function\
