  md: '# MAIL MERGE


    Mail merge is a powerful feature in MS Word that helps you to create mailing labels.
    With mail merge, you can get rid of the usual practice of cutting and pasting
    labels in every copy of the letter.


    The body of the letter is typed and saved in a file called the main document.
    The addresses are typed and stored in another file data source. By doing a mail
    merge, you are linking the main document with the data source. Another advantage
    of using mail merge is that the next time you need to send a letter to the same
    set of recipients, you can use the same data source file.


