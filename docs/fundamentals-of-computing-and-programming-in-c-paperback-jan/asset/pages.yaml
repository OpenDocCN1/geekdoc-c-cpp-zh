  md: '# Digital Computers


    Digital computers are commonly used for data processing and problem solving purpose
    using programs. A digital computer operates by counting digits in the binary form.
    It processes data in discrete form. Digital computers have very large memory to
    store huge quantity of data.


    # Analog Computers


    Analog computers are generally used in industrial process controls to measure
    physical quantities such as pressure, temperature, etc. An analog computer does
    not operate on binary digits to compute. It works on continuous electrical signal
    and the output is displayed continuously. Its memory capacity is less and can
    perform only certain type of calculations. However, its operating speed is faster
    than the digital computer. The accuracy of result obtained from an analog computer
    is about 99%.


    # Hybrid Computers


    Hybrid computers are the combination of digital and analog computers. A hybrid
    computer uses the best features of digital and analog computers. It helps the
    user to process both continuous and discrete data. Hybrid computers are generally
    used for weather forecasting and industrial process control.


    # CLASSIFICATION OF DIGITAL COMPUTERS


    Digital computers are classified based on their speed of operation, memory capacity,
    hardware facilities and price. In many cases, there is a considerable amount of
    overlap among these groups. The classification of the digital computers based
    on the processing hardware used is given below.


    +   (i) Mainframe computers

    (ii) Minicomputers

    (iii) Microcomputers

    (iv) Supercomputers


