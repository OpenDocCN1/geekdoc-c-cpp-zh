  md: '# FC-86 Fundamentals of Computing


    # Guidelines to Prepare Flowchart


    The following guidelines are used to prepare the flowcharts.


    +   1. Understand the problem to be solved and formulate logic of the problem
    solving, then prepare the detailed flowchart. All details used to solve the problem
    should be available in the flowchart.

    2. A flowchart is prepared in a simple, clear and easy to understand form.

    3. Use common names for variables and statements in the flowchart symbols for
    easy understanding. Use a standard method and maintain consistency in providing
    details in the flowchart.

    4. Logical sequence of the steps to be followed in problem solving should be indicated
    clearly. Develop a good logical method to avoid unnecessary crossing of flow lines.

    5. Direction of flow in the flowchart needs to be indicated with appropriate arrows.
    But drawing downward direction arrow is optional. Follow the habit of drawing
    the flowchart to top to bottom and from left to right in constructing the flowchart.

