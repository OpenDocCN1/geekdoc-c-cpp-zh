    ory that is currently in use by the CPU. The total memory capacity of a computer
    can, therefore, be visualized as a hierarchy of components that consists storage
    devices from the slower and high-capacity auxiliary memory to a relatively faster
    main memory.


    Most of the CPUs have different independent caches, including instruction and
    data caches, where the data cache is usually organized as a hierarchy of more
    cache (L1, L2 etc.). When the CPU needs to read data from a location in main memory,
    it first checks if any copy of data is in the cache and it immediately fetches
    from the cache, which is much faster than reading from the main memory.


    Most of the personal computers have three independent caches: an instruction cache
    to speed up execution fetch, a data cache to speed up data fetching and storage,
    and a translation look aside buffer (TLB) which is used to speed up virtual-to-physical
    address translation for both executable instructions and data. The data cache
    is usually organized as a hierarchy of more caches (L1, L2, etc.) as shown in
    Figure 1.19


