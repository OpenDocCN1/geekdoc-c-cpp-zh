    called a word. Each individual data value is represented in one or more bytes
    size but at the lowest level. Data is stored on the primary or secondary storage
    as a large collection of bytes. The data storage capacity units are given in Table
    1.1


    # Table 1.1 Data measurement units in computer


    | Data Measurement | Data Size or length |

    |---|---|

    | Bit | Single Binary digit (i.e., 0 or 1) |

    | Nibble | 4 bits |

    | Byte | 8 bits |

    | Word | 4 Bytes |

    | Kilobytes (KB) | 1024 Bytes |

    | Megabyte (MB) | 1024 KB |

    | Gigabyte (GB) | 1024 MB |

    | Terabyte (TB) | 1024 TB |

    | Petabyte (PB) | 1024 GB |

    | Exabyte (EB) | 1024 PB |


    The number of bytes used to store an individual value depends on the storage format
    and the operating system. In many cases, a single letter or a character of text
    takes one byte for each character and an integer number 2 or 4 bytes. A real or
    floating point number takes 4 or 8 bytes.


    # FUNCTIONAL UNITS OF COMPUTERS


    Let us consider a personal computer to study the details of the functional units
    of a computer. Personal computers are microcomputers commonly used for commercial
    data processing, desktop publishing (DTP), engineering applications, and so on.'
