  md: '# SIGN REPRESENTATION


    One bit of the 8-bit binary allocation is used to represent the sign, 0 (positive)
    or 1 (negative). This means 7 bits are used to represent the absolute value of
    the integer data or number. In sign magnitude representation, the leftmost bit
    defines the sign of the number, 0 for positive number and 1 for negative number.
    For example, 0000 0111 is equivalent to -7 and 0000 0111 is equivalent to +7.


    # ONE''S COMPLEMENT


    The one''s complement is used to represent a negative number as a complement of
    a positive number. For example, we may represent +7 as an unsigned number -7 by
    changing all 0s to 1s and all 1s to 0s. We obtain a complement number which is
    the complement of +7.


    Example, +7 is represented and stored in 8-bit allocation 0000 0111 and -7 is
    represented as one''s complement of +7, i.e. 1111 1000.


    Note that 0s are added to the left of the number to make a total of 8 bits. If
    the sign is positive, no further action is needed. If the sign is negative, every
    bit is complemented (i.e., changed from 0 to 1 or from 1 to 0). One''s complementing
    means reversing all bits. If you do one''s complement of a positive number, you
    get the negative number. If you do one''s complement of a negative number, you
    get the positive number. If you do one''s complement twice, you get the original
    number.


    There are two 0s in one''s complement representation: positive and negative. In
    an 8-bit allocation, it is represented as follows.


    ![](img/2e39d133c87ea945283efbb3d9eac1b7_86_0.png)


    One''s complement representation is not used to store numbers in modern computers
    as there are two 0s in this representation. Hence two''s complement representation
    is used to overcome this problem.


    # TWO''S COMPLEMENT


    Two''s complement representation is the most widely used representation of integers
    today. To store a two''s complement representation, we should follow the steps
    given below.


    +   1. Convert the number into its binary form; the sign is ignored.

    2. Add 0s to the left of the number so that there is a total of 8 or 16 bits.

    3. If the sign is positive, no further action is needed. If the sign is negative,
    leave all the right 0s and the first 1 unchanged. Complement the rest of the bits.


    Consider the following examples to write two''s complements:'
