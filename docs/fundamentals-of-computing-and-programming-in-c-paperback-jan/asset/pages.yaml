  md: '# OUTPUT DEVICES


    # Monitor


    A monitor is a display device (Figure 1.33). The size of a commonly used color
    monitor is 15 inches. The electronic circuit board which is used to display text/picture
    smoothly on the screen is called as a monitor adapter card. SVGA (Super Video
    Graphic Adapter) or AGP (Advanced Graphic Port) adapter is commonly used in the
    latest personal computer to display text/picture in natural colours.


    ![](img/2e39d133c87ea945283efbb3d9eac1b7_62_0.png)


    Figure 1.33 Monitors


    A monitor comprises a cathode ray tube (CRT) which can display text and graphic
    images in monochrome or multicolor (Figure 1.33). Note that the cathode ray tube
    operates like the picture tube. A CRT consists of an electron gun, which emits
    electron beam. The electron beam is deflected to strike the flat phosphor-coated
    screen to generate a bright dot called a pixel. Many such pixels are generated
    to get the dots horizontally and vertically; this is called the resolution of
    the monitor. The color display will be obtained in a RGB color monitor which uses
    red, green and blue components in each pixel to get the color images. The smoothness
    of the image obtained depends on the resolution of the monitor.


    ![](img/2e39d133c87ea945283efbb3d9eac1b7_62_1.png)


    Figure 1.34 Connectivity diagram for monitor, SVGA adapter and motherboard


    The SVGA adapter will support the monitor resolution up to 1024 × 768 with about
    256 colors. Note that the monitor adapter contains a dedicated memory video VRAM
    and other circuitry necessary to send information to the monitor for display on
    the screen (Figure 1.34). Also note that the VRAM of about 16MB or more is required
    to display graphical images.'
