  md: '# MS EXCEL


    MS Excel is spreadsheet software used to create and manage data and also for analyzing
    the data for information. The usage of this software is similar to MS word and
    is a simple menu driven software.


    Excel consists of a grid of rows and columns. The intersection of a row and a
    column is called a cell. The rows are numbered 1,2,3...and so on, and columns
    are labeled alphabetically A, B, C...and so on. Each spreadsheet contains 16384
    rows and 256 columns that makes 4,194,304 cells. Each cell can store a piece of
    text, number or formula in it.


