  md: "Note that the number to be searched is neither greater nor less than the middle\
    \ number. We understand that the middle number is equal to the number to be searched.\n\
    \n```\n#include <stdio.h>\n#include <conio.h>\n#include <math.h>\nmain() {\n \
    \   int bi_search(int x[],int n, int s);\n    int x[20],i,n;\n    clrscr();\n\
    \    printf(\\\n How many numbers ? \");\n    /* loop to read all numbers */\n\
    \    printf(\\\nEnter all numbers in the list \\n\");\n    for (i=0; i<n; i++)\
    \ {\n        scanf(\"%d\",&x[i]);\n    }\n    printf(\\\nEnter the number to be\
    \ searched : \");\n    scanf(\"%d\",&s);\n    /* calling the function */\n   \
    \ if (bi_search(x,n,s))\n        printf(\\\nThe number %d is present in the list,\\\
    n\",s);\n    else\n        printf(\\\nThe number %d is not present in the list,\\\
    n\",s);\n    getch();\n}\n\n/* function to search the number */\nint bi_search(int\
    \ x[],int n, int s) {\n    int i,j,flag=0,start,mid,end;\n    start = 0;\n   \
    \ end = n;\n    while(start < end && flag == 0) {\n        mid = (start + end)\
    \ / 2;\n        if(x[mid] > s)\n            end = mid;\n        else\n       \
    \     if(x[mid] < s)\n                start = mid+1;\n            else\n     \
    \           flag = 1;\n    }\n    return(flag);\n}\n```\n\nWhen this program is\
    \ executed, the user has to enter all numbers in the given list in ascending order\
    \ and then search the number. The function is in the main program"
