  md: '# SHORT QUESTIONS AND ANSWERS


    +   1. What is an assembler?

    An assembler is a program used to translate an assembly language program into
    the binary form.


    +   2. What is a compiler?

    A compiler is a program used to translate a high-level language program into the
    binary form.


    +   3. What is a source program?

    The set of instructions written in any of the programming languages is called
    a source program.


    +   4. What is an object program?

    The binary form of a source program is called an object program.


    +   5. What is an executable program?

    A program generated from an object program by linking the input/output devices
    in order to execute the instructions given in a source program is called an executable
    program.


    +   6. What is a text editor?

    A text editor is a program used to type and edit a computer program or document.
    Some commonly used editors are Turbo, NE (Norton Editor), Vi editor (used in UNIX).


