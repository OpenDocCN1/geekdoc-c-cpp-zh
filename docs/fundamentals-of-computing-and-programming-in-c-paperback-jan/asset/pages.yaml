  md: '# STRING HANDLING FUNCTIONS IN C


    There are four important string handling functions in C language.


    +   (i) strlen() function

    (ii) strcpy() function

    (iii) strcat() function

    (iv) strcmp() function


    The header file #include <string.h> is used when these functions are called in
    a C program.


    # strlen() Function


    strlen() is used to find the length of a character string. Consider the following
    example.


    ```

    int n;

    char st[20] = "Bangalore";nnn = strlen(st);

    ```


    This will return the length of the string n which is assigned to an integer variable
    n.


    Note that the null character ''\0'' available at the end of a string is not counted.


    # strcpy() Function


    strcpy() is used to copy a character string to a character variable. Consider
    the following example.


    ```

    char city[15];

    strcpy(city, "BANGALORE ");

    ```


    This will assign the string "BANGALORE" to the character variable city.


    Note that character value like city = "BANGALORE"; cannot be assigned in C language.


    # strcat() Function


    strcat() is used to join character strings. When two character strings are joined,
    it is referred as concatenation of strings. Consider the following example.


    ```

    char city[20] = "BANGALORE";

    char pin[8] = "-560 001";

    strcat(city,pin);

    ```


    This will join the two strings and store the result in city as "BANGALORE-560
    001".


    Note that the resulting string is always stored in the left side variable.


    # strcmp() Function


    strcmp() is used to compare two character strings. It returns a 0 when two strings
    are identical; otherwise it returns a numerical value which is the difference
    in ASCII values of the mismatching characters of the strings being compared. Consider
    the following example.'
