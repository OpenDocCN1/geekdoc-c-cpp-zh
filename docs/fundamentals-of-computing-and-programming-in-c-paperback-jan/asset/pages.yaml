    # Keyboard


    A keyboard is used to enter data into a computer. The latest keyboard (Windows
    keyboard) is available with 104 keys. The keyboard contains function keys, numeric
    keys and toggle keys (Caps lock, Num lock, Scroll lock) and so on.


