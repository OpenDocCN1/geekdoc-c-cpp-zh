  md: '# CP-288 C Programming


    The size of this structure is equal to 24 bytes. This can be obtained using the
    s i zeof () function as follows:


    ```

    sizeof(srec)

    ```


    Consider a file “STUDENT.DAT” with a few records of the above structure.


    Byte number of file position


    | record | | |

    | --- | --- | --- |

    | 1 | | SEEK_SET |

    | 2 | 24 | |

    | 3 | 48 | |

    | 4 | 72 | SEEK_CUR |

    | 5 | 96 | |

    | 6 | | |

    | . | . | . |

    | n | | SEEK_END |


    Note that the random files are also declared and accessed using file pointers.


    # fseek () Function


    fseek() function is used to move the file pointer to any position in a file from
    a given reference position. It has the following form:


    ```

    fseek(fp, m, ref-pos);

    ```


    where fp refers to file pointer

    m refers to number of bytes to be skipped

    ref-pos refers to the reference position from which number of bytes are to be
    skipped


    Following are examples for reference positions.


    | Value | Symbol | Reference |

    | --- | --- | --- |

    | 0 | SEEK_SET | From the beginning of a file |

    | 1 | SEEK_CUR | From the current position of the file pointer |

    | 2 | SEEK_END | From the end of a file.


    Example


    +   (i) fseek(sptr, sizeof(srec), SEEK_SET);

    will first set the file pointer to the first record and then move the file pointer
    n of bytes forward.

    (ii) fseek(myfile, -n, SEEK_CUR);

    will move the file pointer n number of bytes backward. If n is equal to the size
    of the structure, then the file pointer is set to the previous record in the file.'
