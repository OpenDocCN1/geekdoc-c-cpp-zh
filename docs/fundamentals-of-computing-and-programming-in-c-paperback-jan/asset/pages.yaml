    # STEPWISE REFINEMENT


    Stepwise refinement is a top-down program design technique to develop a program
    from step-by-step instruction or algorithm. In this technique, the program is
    developed by refining the program coding at various levels in the procedural or
    sequential programming. In each step of the refinement, one or more instructions
    of the given program are decomposed into more detailed instructions. Decomposition
    or refinement of specifications is made successively and the refinement is terminated
    when all instructions are clearly expressed in terms of any computer programming
    language.


