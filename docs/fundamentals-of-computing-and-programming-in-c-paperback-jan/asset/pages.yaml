  md: '# CP-236 C Programming


    Depending on the size of the data type, the required number of bytes will be allotted
    to a variable. For example, an int variable will be allotted 2 bytes and a float
    variable will be allotted 4 bytes and so on. Consider the following declarations
    and illustrations of their storage in memory.


    int m = 15;

    float x = 2.54;


    # Random Access Memory


    ![](img/2e39d133c87ea945283efbb3d9eac1b7_413_0.png)


    > Note that m is stored in the address 2464 and x is stored in the address 3012.

    Also note that only the address of the first byte is considered for any reference.


    Usually, these values are accessed using the name of the variable. Consider the
    following example.

    printf("\n m = %d x =%0.2f", m, x);


    When this command is executed, the values are printed as shown below.

    m = 15  x = 2.54'
