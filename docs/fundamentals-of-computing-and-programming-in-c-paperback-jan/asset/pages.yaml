  md: "# STORAGE CLASSES IN C\n\nVariables used in a C program are stored in RAM or\
    \ CPU memory register. There are four storage classes into which the variables\
    \ are declared and stored.\n\n+   1. auto storage class\n2. static storage class\n\
    3. extern storage class\n4. register storage class\n\nDepending on the type of\
    \ the storage class, the scope and behaviour of the variables vary in a C program.\n\
    \n# auto or Automatic Storage Class\n\nVariables declared in this class are stored\
    \ in RAM. This is the default storage class and the keyword auto is used to declare\
    \ variables. Auto variables are active in a block in which they are declared.\
    \ Note that a block makes the statements inside the braces {}.\n\nWhen a block\
    \ in C program is executed, the variables inside the block are created automatically\
    \ and are found active. These variables are destroyed automatically and become\
    \ inactive when the execution is transferred to another block or function in the\
    \ same program. Note that the keyword auto to declare these variables is optional.\n\
    \n> auto storage class is commonly used in all C programs without the keyword\
    \ auto.\n\nConsider the following example to understand the use of auto storage\
    \ class variables.\n\n```\nmain()\n  void sample(void);\n  auto int m = 40;\n\
    \  /* consider an inner block */\n  {\n    auto int m = 50;\n    printf(\"nValue\
    \ of m in inner block is %d\\n\", m);\n  }\n  /* calling the function */\n  sample();\n\
    \  printf(\"nValue of m in outer block is %d\\n\", m);\n\nvoid sample(void);\n\
    {\n  auto int m = 65;\n```"
  merge: -1
  pgno: 370
