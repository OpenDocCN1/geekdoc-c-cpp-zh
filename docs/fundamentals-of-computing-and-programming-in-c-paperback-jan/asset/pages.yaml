  md: '# CP-246 C Programming


    # Comparison between Call by Value and Call by Reference


    | Call by Value | Call by Reference |

    | --- | --- |

    | 1. This is the usual method to call a function in which only the value of the
    variable is passed as an argument. | 1. In this method, the address of the variable
    is passed as an argument. |

    | 2. Any alteration in the value of the argument passed is local to the function
    and is not accepted in the calling program. | 2. Any alteration in the value of
    the argument passed is accepted in the calling program (since alteration is made
    indirectly in the memory location using the pointer). |

    | 3. Memory location occupied by formal and actual arguments is different. | 3.
    Memory location occupied by formal and actual arguments is same and there is a
    saving of memory location. |

    | 4. Since a new location is created, this method is slow. | 4. Since the existing
    memory location is used through its address, this method is fast. |

    | 5. There is no possibility of wrong data manipulation since the arguments are
    directly used in an expression. | 5. There is a possibility of wrong data manipulation
    since the addresses are used in an expression. A good skill of programming is
    required here. |


    # POINTER ARITHMETIC


    An integer operand be used with a pointer to move it to a point/refer to some
    other address in the memory. Consider an int: type pointer as follows.


    ```

    int *ptr; mptr = 65494;

    ```


    Assume that it is allotted the memory address 65494. Increment its value by 1
    as follows.

    mptr++; ++ptr;

    mptr = mptr + 1; or mptr += 1;


    ++ and -- operators are used to increment and decrement a pointer and commonly
    used to move the pointer next location.


    Now the pointer will refer to the next location in memory with the address 65496.
    C language automatically adds the size of the int type (2 bytes) to move the pointer
    to the next memory location as follows.


    ```

    mptr = mptr + 1;

    mptr = 65494 + 1 * sizeof(int)

    mptr = 65494 + 1 * 2

    mptr = 65496

    ```'
