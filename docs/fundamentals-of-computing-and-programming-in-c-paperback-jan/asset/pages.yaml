  md: "# Loop Control Structures in C CP-85\n\n# while STATEMENT OR while LOOP\n\n\
    A while loop is used to execute and repeat a block of statements depending on\
    \ a condition. It has the following form.\n\n```\nwhile(<condition>)\n{\n    <statement\
    \ block>\n}\n```\n\nwhere <condition> is a relational or logical expression which\
    \ will have the value true or false.\n\n# Example\n\n```\ni = 1;\nwhile(i <= 10)\n\
    {\n    s = s + i;\n    p = p * i;\n    i++;\n```\n\nWhen this statement is executed,\
    \ the computer evaluates the value of the condition. If the value is true, the\
    \ statement block is executed and repeated until the value of the condition is\
