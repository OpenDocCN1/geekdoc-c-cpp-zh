  md: '# Introduction to Computers FC-29


    ![](img/2e39d133c87ea945283efbb3d9eac1b7_58_0.png)


    # Figure 1.27 ROM


    The programs stored in ROM are etched into the memory circuits and are available
    in a chip. This permanent software in ROM is called as firmware. Note that the
    firmware programs in ROM are not loaded into memory from disk. System programs
    and language translators are stored in ROM chips.


    # Floppy Disk


    A floppy disk is used to store data permanently. It has a flexible disk coated
    with magnetic material and is enclosed in a plastic cover. Floppy disks of 3½
    inch diameter having a storage capacity of 1.44 MB were used previously. The FDD
    has a read/write head which reads/writes data on the disk. The disk rotates at
    360 rpm while reading or writing on to it.


    ![](img/2e39d133c87ea945283efbb3d9eac1b7_58_1.png)


    # (i) Floppy disk (ii) Tracks and sectors in a disk


    # Figure 1.28 Structure of floppy disk


    Data are stored in a floppy disk in concentric circles known as tracks. Tracks
    are divided into many storage locations called sectors (Figure 1.28). Since the
    tracks are circles, there is a sensing hole that identifies the physical beginning
    of a track. Tracks and sectors on a disk are identified by the disk drive through
    formatting. Note that formatting is a process by which the operating system controls
    the disk drives by removing the old data (if any) and sets up each track and sector.
    The root directory will be created in the disk during formatting and the users
    create other directories. Information is stored in disks in the form of files.
    Note that a file allocation table (FAT) is used by the operating system to identify
    the files stored in the disk.'
