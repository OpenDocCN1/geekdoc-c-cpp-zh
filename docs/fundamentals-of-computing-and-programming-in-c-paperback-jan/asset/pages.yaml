    # Batch Processing


    It is a process of executing programs one the other using a batch file program.
    A batch file contains instructions and names of the executable programs written
    sequentially in the order to be executed. When the execution of one program is
    complete, the system control is transferred automatically to the next program
    in the batch file. After all programs in the batch file are executed, the control
    is transferred to the operating system.


    Let us create a batch file "JP.BAT" to copy all .EXE, .COM, and .TXT files to
    the floppy drive in A.


    ```

    C:>COPY CON JP.BAT

    COPY *.EXE A:

    COPY *.COM A:

    COPY *.TXT A:

    ^Z

    C:\

    ```


    To execute JP.BAT, we use the command

    C:\>JP


