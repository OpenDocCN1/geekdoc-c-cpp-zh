  md: '# FC-22 Fundamentals of Computing


    and hard disk for permanent storage. The memory or storage is required for storage
    and subsequent retrieval of instructions and data while processing takes place
    in the CPU. The instructions and data being executed by the CPU would resides
    in secondary storage (like hard disks) and is loaded into the memory registers
    of the CPU as program execution proceeds. This leads to CPU being idle for most
    of the time since which the CPU processes data is much higher than the speed at
    which data being transferred from hard disks to memory registers. Every computer
    requires storage space near the CPU where instructions and data of a program can
    reside when the program (instructions) is being executed. This temporary storage
    is built inside the computer and is known as the primary storage or main memory.
    Devices that provide backup storage (like hard disks) are called secondary storage
    or auxiliary memory. Thus, the memory systems in a computer can be classified
    into four groups.


    # CPU memory register


    The CPU memory which consists of a small set of high-speed memory registers are
    internal in the CPU and used as temporary locations where the actual processing
    is carried out.


    # Primary Memory


    The primary memory, also called the main memory, is volatile. The primary storage
    is the Random Access Memory (RAM). The primary storage or main memory is a large
    memory, which is fast, but not as fast as CPU memory registers. The main memory
    is communicated directly with the CPU and mainly based on integrated circuits.
    The random access memory is the main memory of a computer system where all the
    program instructions, and the data are results. The data stored in RAM appears
    once the electric power supplied to the computer is switched off. The capacity
    of the primary memory is limited.


    # Secondary Storage


    The secondary storage is also called auxiliary storage. It is used as a supplement
    to the primary storage. Secondary storage or disk storage is a much larger size
    memory than the main memory but is slower in operation. It typically stores all
    the system and application software. The data stored in secondary storage stay
    for several years. The data stored in secondary storage are used for future processing
    applications. The common secondary storage are floppy disk, hard disk, compact
    disk and magnetic tape.


    # Cache Memory


    Another kind of memory that is increasingly being used in modern computers is
    called the cache memory. Cache memory holds the program and data which are frequently
    accessed by the CPU of a computer system. The cache is a smaller, faster memory
    which stores copies of the data from frequently used main memory locations. It
    is logically positioned between the processor memory registers and the main memory.
    It stores and caches some of the storage spaces of the main mem'
