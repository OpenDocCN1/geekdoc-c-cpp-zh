  md: "# Solution\n\nConsider the number of characters that can be printed in a line\
    \ is 80. Then the axis of the triangular form is in the 40th column. The Pascal\
    \ triangle is also printed using the for loops as explained in Example 19, except\
    \ that an equation is used here to generate digits.\n\n+   (i) for loop 1 is to\
    \ print n lines.\n(ii) for loop 2 is to generate initially 40 spaces, which are\
    \ then reduced using an equation 40 - 3 * i, where i is the index variable of\
    \ for loop 1.\n(iii) for loop 3 is to print digits in each line using equation\
    \ m = m*(1-j+1)/j, where m represents the number of digits to be printed on one\
    \ line and j represents the index variable of for loop 1.\n\nConsidering these\
    \ 3 loops, a C program is written to print digits in the Pascal triangle.\n\n\
    ```\n/* program to print PASCAL triangle */\n#include <stdio.h>\n#include <conio.h>\n\
    main(){\n    int i,j,m,n;\n    clrscr();\n    printf(\"How many rows ? \",\\n\
    \    scanf(\"%d\",&n);\n    m = 1;\n    printf(\"\\n\\t\\t\\t PASCAL TRIANGLE\
    \ \\n\");\n    for(l = 0; l < n; l++) /* loop 1 to print n lines */\n    {\n \
    \       for(i = 40 - 3*l; i > 0; i--) /* loop 2 to print spaces */\n         \
    \   printf(\"*\");\n        }\n        /* loop to generate and print digits */\n\
    \        for(j = 0; j <= l; j++){\n            if((j == 0) || (l == 0))\n    \
    \            m = 1;\n            else\n                m = (m*(1 - j + 1))/j;\n\
    \            printf(\"%6d\",m);\n        }\n        printf(\"\\n\");\n    }\n\n\
    \    getch();\n}\n```"
