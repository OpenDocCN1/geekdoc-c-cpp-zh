  md: "# Loop Control Structures in C CP-111\n\nNote that the binary digits obtained\
    \ should be reversed to get the correct binary conversion for the given decimal\
    \ number.\n\n```\n* program to convert a decimal number into binary */\n#include\
    \ <stdio.h>\n#include <conio.h>\n#include <math.h>\nmain() {\n    int n,q,r,i,bi,rbi,flag\
    \ = 0,k = 0;\n    clrscr();\n    printf(\"n Enter the decimal number : \");\n\
    \    scanf(\"%d\",&n);\n    q = n;\n    rbi = 0;\n    /* loop to get binary digits\
    \ which are in reverse order */\n    while(q > 0) {\n        r = q % 2;\n    \
    \    if(r == 0 && flag == 0)\n            k++;\n        else\n            flag\
    \ = 1;\n        rbi = rbi*10 + r;\n        q = q/2;\n    }\n    /* loop to get\
    \ the binary digits in the correct order */\n    q = rbi;\n    bi = 0;\n    while(q\
