  md: "where  <expression> refers any int or char expression or variable.\n\n<label\
    \ 1>, <label 2>...<label n> are values which will match with the value of the\
    \ expression.\nbreak is a statement which will transfer the control to the end\
    \ of switch statement.\n\n# Example\n\n```\nswitch (sex)\n{\n  case 'm':\n   \
    \ male++;\n    total++;\n    break;\n  case 'f':\n    female++;\n    total++;\n\
    \    break;\n  default:\n    printf(\"n Error in sex code\");\n    break;\n}\n\
    ```\n\nWhen this statement is executed, the computer checks the values of the\
    \ expression or variable. If this value matches any one of the labels given in\
