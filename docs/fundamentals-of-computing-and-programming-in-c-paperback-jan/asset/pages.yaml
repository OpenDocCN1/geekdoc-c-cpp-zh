  md: '# Example 7


    Write a C program to find the roots of a quadratic equation ax² + bx + c = 0 for
    all possible combinations of a, b and c.


    # Solution


    A quadratic equation will have two roots which are obtained using the following
    expression.


    ```

    x = \frac{-b \pm \sqrt{b^2 - 4ac}}{2}

    ```


    Note that b² - 4ac < 0 is called discriminant.


    b² - 4ac = 0, the roots are real and equal, i.e. x = \frac{-b}{2}


    b² - 4ac < 0, the roots are imaginary, i.e. x = \frac{-b \pm \sqrt{b^2 - 4ac}}{2a}


    Also note that the value of the coefficient ≠ 0.


    ![](img/2e39d133c87ea945283efbb3d9eac1b7_246_0.png)'
