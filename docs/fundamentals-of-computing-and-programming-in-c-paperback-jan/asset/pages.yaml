  md: "# FC-56 Fundamentals of Computing\n\nNote the mantissa has a 0 in the leftmost\
    \ position to represent the plus sign and is 1 for the minus sign. The mantissa\
    \ in this example is considered to be a fixed point fraction. Therefore the decimal\
    \ point is considered at the left of the Most Significant Bit (MSB). This decimal\
    \ part is not physically indicated in the computer memory register it is assumed\
    \ there. The exponent contains the decimal number +04, to accommodate the actual\
    \ position of the decimal point which is four decimal positions to the right of\
    \ the assumed decimal point. The mantissa is sometimes called the fraction part.\n\
    \nConsider the following decimal number 000456 to understand floating point representation.\
    \ The number 0.00456 can be written in floating point representation as 456 ×\
    \ 10⁻³. \n\n| Sign | Sign |\n|---|---|\n| 0 | 456 |\n| Mantissa | 05 |\n\nWhen\
    \ this is represented in a computer memory register in its binary coded form,\
    \ the actual value of the memory register is as follows.\n\n```\n0 0100 0101 0110\
    \  1 0000 0101\n```\n\n# Normalized and unnormalized floating point numbers\n\n\
    A floating point number is said to be normalized if the most significant position\
    \ of the mantissa contains a non-zero digit, for example, the mantissa 055 is\
    \ not normalized but 350 is normalized . When 350 is represented in BCD, it becomes\
    \ 0011 0101 0000 and although two '0's appear to present in the two most significant\
    \ positions, the mantissa is normalized. Since the bits represent a decimal, not\
    \ a binary number, and decimal numbers in BCD must be taken in groups of four,\
    \ the first digit is 3 and is non-zero.\n\nWhen the mantissa is normalized, it\
    \ has no leading zeros and contains the maximum number of significant digits.\
    \ For example, consider a mantissa 35.748 and the memory register that can accommodate\
    \ a mantissa of five decimal digits and a sign. The given number can be represented\
    \ as +0.35748×10⁵ normalized because the mantissa has a non-zero digit 3 in its\
    \ most significant position. This number can be represented in an unnormalized\
    \ form as +0.00357×10⁵=35.7 which contains two most significant zeros, and therefore,\
    \ the mantissa can accommodate only three significant digits. The two least significant\
    \ digits, 4 and 8, which were accommodated in the normalized form, do not appear\
    \ in the unnormalized form because the register can only accommodate five digits.\n\
    \nArithmetic operations with floating point numbers are more complicated than\
    \ arithmetic operations with fixed point numbers and their execution takes longer\
    \ duration and requires more complex hardware. However, floating point representation\
    \ is a must for scientific computations. Many computers and all electronic calculators\
    \ have built-in subroutines for performing floating point computations."
