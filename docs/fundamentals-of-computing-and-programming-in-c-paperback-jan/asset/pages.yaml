    # TWO-DIMENSIONAL ARRAY


    Consider a matrix of size 3 × 4:


    ```

    A = \begin{pmatrix} 2 & 4 & 3 & 0 \ 3 & 8 & -1 & 6 \ -2 & 0 & -5 & 6 \end{pmatrix}

    ```


    These values are referred in mathematics as follows.

    A$A_{00}$ $A_{02}$ and so on

    In language they are represented as follows.

    a[0][0] a[0][1] a[0][2] and so on

    It may be imagined that these values are stored in RAM as follows.


    | Array name → | 0 | 1 | 2 | 3 | ← Column subscripts |

    |---|---|---|---|---||

    | | 0 | 2 | 4 | 3 | 0 |

    | | 1 | 3 | 8 | -1 | 6 |

    | | 2 | -2 | 0 | -5 | 6 |


    # ARRAY DECLARATION


    Arrays are declared using type declaration statements with a maximum number of
    values accommodated in them. Consider the following example


    ```

    int x[50], a[3][4];

    ```


    This statement declares an one-dimensional array x having 50 elements and a two-dimensional
    array with 12 elements (3 rows × 4 columns = 12). An element means a storage location
    in an array.


    Note:


    +   1. Array size to store values is always an integer; int x[n]; is not permitted.

    2. Subscript value beyond the array size should not be used. It will not be detected
    by the compiler and it leads to error during program execution. For example, x[51]
    should not be used.'
