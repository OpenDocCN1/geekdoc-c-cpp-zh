  md: '# Command Line Arguments


    20. Write a C program to copy the content of a file into another. Run the program
    in the command prompt by giving the name of the existing file and the target file.


    Solution


    Write a program similar to Example 6 of Chapter 11. Use argc and argv[] in the
    main function.


    ```

    / File copying using command line arguments */

    #include <stdio.h>

    #include <conio.h>

    int main(int argc, char *argv[]) {

    char ch;

    FILE source_fptr,target_fptr;

    if (argc != 3) {

    printf("\n Number of arguments insufficient !!!\");

    printf("\n press any key to continue...\");

    getch();

    exit();

    }

    source_fptr = fopen(argv[1],"r");

    target_fptr = fopen(argv[2],"w");

    if(source_fptr == NULL) {

    printf("\n No content/source file !!!\");

    printf("\n press any key to continue...\");

    getch();

    exit();

    }

    printf("\n copying source file %s to target file %s\n",argv[1],argv[2]);

    printf("\n please wait.");

    delay(20000);printf(".\");

    delay(20000);printf(".\");

    delay(20000);printf(".\");

    delay(20000);printf(".\");

    delay(20000);printf(".\");

    /* loop to copy the text file **/

    while(feof(source_fptr)) {

    ch = getc(source_fptr);

    putc(ch,target_fptr);

    }

    if(target_fptr == NULL) {

    printf("\n No content/target file !!!\");

    printf("\n\n press any key to continue...\");

    getch();

    exit();

    }

    ```'
