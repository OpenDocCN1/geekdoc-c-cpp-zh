    Level one memory cache (called L1 Cache) is directly integrated into the processor.
    It can be accessed rapidly. Level two cache memory (called L2 Cache) is located
    along with the processor (CPU). The level two cache is an intermediary between
    the processor and the RAM. It can be accessed more rapidly than the RAM, but less
    rapidly than the level one cache.


