    }\n```\n\nwhere <initial value> is the assignment expression which initializes\
    \ the value of a variable. <condition> is a relational or logical expression which\
    \ will have the value true or false. <increment> is the increment value of the\
    \ variable which will be added every time.\n\nExample\n\n```\nfor(i = 1; i <=\
