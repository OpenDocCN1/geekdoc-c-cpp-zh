  md: '# FC-64 Fundamentals of Computing


    # Table 2.4 BCD equivalent of decimal digits


    | Decimal digit | Binary equivalent |

    |---|---|

    | 0 | 0000 |

    | 1 | 0001 |

    | 2 | 0010 |

    | 3 | 0011 |

    | 4 | 0100 |

    | 5 | 0101 |

    | 6 | 0110 |

    | 7 | 0111 |

    | 8 | 1000 |

    | 9 | 1001 |


    For example, the decimal number $42_{10}$ is represented in its 4-bit BCD equivalent
    as follows,


    | Decimal number | 4 2 |

    |---|---|

    | Binary equivalent | 0100 0010 |


    That is, the decimal number 42 is represented as 0100 0010 in 4-bit BCD.


    As seen 4-bit BCD code can be used only to represent decimal numbers. Since 4
    bits are sufficient to represent the other characters used by the computer, instead
    of 4-bits, computer designers use 6-bits to represent characters in BCD code.
    In this, the 4 BCD numeric place positions are retained but four additional zone
    positions are added. With 6 bits, it is possible to represent 2^6 different characters.
    This is sufficient to represent the 10 decimal digits (0 to 9), 26 alphabetic
    characters (upper case letters A to Z) and 28 special characters including arithmetic
    operators and other symbols. The 6-bit BCD code was the adaptation of the punched
    card to code in the computer programming.


    # American Standard Code for Information Interchange (ASCII)


    A computer code that is widely used for data exchange is the ''American Standard
    Code for Information Interchange'' or ASCII. Several computer manufacturers have
    adopted ASCII as their computer''s memory code. ASCII codes represent characters
    in communications, and other units or devices that use text. Most modern character-encoding
    schemes are based on ASCII, though they support many additional characters. ASCII
    uses 7 binary digits to represent 128 characters. ASCII includes definitions for
    128 characters in which 33 are non-printing control characters and the space.
    Now-a-days an advanced ASCII having 8-bit character representation code allowing
    for 256 different characters is being used. This representation is being widely
    used in microcomputers. Table 2.5 shows the combinations required for each character.'
