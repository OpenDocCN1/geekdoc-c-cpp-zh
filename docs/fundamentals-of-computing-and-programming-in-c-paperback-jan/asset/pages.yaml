    () the base address of the array x with the subscript i is used to refer and store
    the values in the array in different memory locations.


    To print the values in an array, a similar loop is used, and the indirection operator
    * is used to access the value in that memory location. Consider the following
    example.


    ```

    /* loop to print the values in the array */

    for(i = 0; i < 10; i++)

    printf("%6d", (x + i));

    ```


    When this loop is executed, all values are printed by moving the pointer to various
    locations. Note the format specifier %d is used to print a value with a width
    of 6 digits.


