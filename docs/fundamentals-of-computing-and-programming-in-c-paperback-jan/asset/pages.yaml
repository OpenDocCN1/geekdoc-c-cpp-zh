    # goto


    The goto statement is an unconditional transfer of control statement. It is used
    to transfer the control from one part of the program to another. The place to
    which the control is transferred is identified by a statement label. It has the
    following form:


    ```

    goto label;

    label is the statement label which is available anywhere in the program.

    ```


    Example


    ```

    -------

    goto display;

    -------

    display:

    -------

    ```


    When this statement is executed, the control is transferred to the statement label
    display which is followed by a colon. Note that the statements between goto and
    statement label display will be skipped because of the transfer.


    # break STATEMENT


    The break statement is used to transfer the control to the end of a statement
    block in a loop. It is an unavoidable statement to transfer the control to the
    end of a switch statement after executing any one statement block. It has the
    following form:


    ```

    break;

    ```


    Note that a program can be written without this statement other than in a switch
    statement. Consider the following example.'
