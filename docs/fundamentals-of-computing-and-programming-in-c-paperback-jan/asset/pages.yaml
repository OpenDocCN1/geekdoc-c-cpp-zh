  md: "# Functions in C CP-171\n\nNote that there is a local declaration of variables.\
    \ These variables, referred to as local variables, are used only inside the function.\
    \ Remember that the global declaration of variables is written outside the main()\
    \ and is referred to as global variables.\n\nThe statement block consists of a\
    \ set of statements and built-in functions which are executed when the function\
    \ is called.\n\nThe result is returned to the function call through a return statement\
