    that the omitted data members may not be considered as 0 or "".


    +   - variables are initialized while declaring them or the usual assignment operators
    can be used.


    # Dot (.) Operator


    Dot () or period operator is used to access a data member in a structure variable
    or an array element. It has the following:


    ```

    structure_variable.data_member

    ```


    It is to be noted that the dot operator separates the structure variable or array
    and the data member.


    # Example


    | x.roll_no | std[i].roll_no |

    | x.name | std[i].name |

    | x.total | std[i].total |


    | data members | storage in RAM | data members accessed |

    | roll_no | 20131 | x.roll_no |

    | name | ASHWIN | x.name |

    | total | 95 | x.total |


    It is to be noted that the values for data members in a structure variable or
    array can be read or assigning by referring the specific data member which in
    an input or assignment statement. Consider the following:


