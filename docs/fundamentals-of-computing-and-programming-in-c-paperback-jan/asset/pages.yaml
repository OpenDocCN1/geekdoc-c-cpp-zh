    \ 1. The braces {} may be omitted when there is only one statement available in\
    \ the statement block.\n2. The break statement is used to transfer the control\
    \ to the end of switch statement.\n3. The default block is executed when none\
    \ of the case matches with the value of the expression/variable.\n4. The default\
    \ block is optional; i.e., this may be omitted while writing a program.\nIt should\
