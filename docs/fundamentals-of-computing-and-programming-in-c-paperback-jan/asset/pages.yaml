  md: "# enum DATA TYPE\n\nenum represents the enumeration data type which is used\
    \ to instruct the compiler to associate with the specific list of values for a\
    \ variable. For example, days in a week may be declared as an enumerated data\
    \ type as follows.\n\n```\nenum days{SUN, MON, TUE, WED, THU, FRI, SAT};\nwhere\
    \ enum is the key for enumerated declaration.\n    days is the name of enumerated\
    \ data type.\n    SUN, MON . . . SAT are the values in the enumerated list.\n\
    ```\n\nUsing this data type variables are declared as follows.\n\nenum days holiday,\
    \ salary_day;\nThe variables declared may be assigned any one of the values given\
    \ in the enumerated list.\n\n```\nholiday = SUN;\nsalary_day = SAT;\n```\n\nIt\
    \ is to be noted that only the values which given in the enumerated list are accepted.\
    \ For example, the following assignments are not accepted.\n\n```\nholiday = SUNDAY;\n\
    holiday = \"SUNDAY\";nsalary_day = SATURDAY;\n```\n\nIt is also possible to assign\
    \ integer value to the variables in the enumerated list as given below.\nThe variables\
    \ of enumerated data type may be assigned as follows.\n\n```\nenum days{SUN=1,\
    \ MON=2, TUE=3, WED=4, THU=5, FRI=6, SAT=7};\nenum days = 1;\nsalary_day = 4;\n\
    ```\n\nIt is to be noted that C will consider the first data in enum list as 0,\
    \ second as 1, and so on, if it has not been assigned any value. The enum data\
    \ type is not commonly used in programming. It may not be supported by some compilers.\n\
    \n# BIT FIELD\n\nIn C language, the user can decide the number of bits in memory\
    \ (RAM) to be allotted to a variable. It overrides the prescribed number of bytes\
    \ allotted to a variable by the compilers.\n\nIn some of the cases, a variable\
    \ can have either 0 or 1 the variable f lag (discussed in some of the examples).\
    \ Strictly speaking, f lag uses only one bit to store 0 or 1, but it is declared\
    \ as int which occupies 16 bits in RAM. In order to overcome this 16 bit default\
    \ allocation and to allot just one bit, the bit field may be defined as a structure\
    \ of size 1 bit as shown below."
  merge: -1
  pgno: 406
- img_proc: true
  md: "# CP-230 C Programming\n\n```\nstruct one_bit\n{\n    unsigned int x:1; //\
    \ Number of bits to be allotted\n    int flag; // Name of data member\n};\n```\n\
    \nValue to the data member is assigned as follows.\n\nflag.x = 1;\n\nThe bit field\
    \ definition is very useful when a structure has more data members which normally\
    \ refer small values. Consider the following data members in a student structure.\n\
    \n```\nstruct student\n{\n    int roll_no;\n    char sname[20];\n    int sex;\n\
    \    struct date\n    {\n        int day;\n        int month;\n        int year;\n\
    \    }date;\n    int mark;\n};\n```\n\nThe size of this structure is 32 bytes,\
    \ which is equal to 256 bits, which may be reduced by considering the exact range\
    \ of values for the data members as given below.\n\ndata member sex may be declared\
    \ with 1 bit which is either 0 or 1\nday with 5 bits for the range 1 to 32\nmonth\
    \ with 4 bits for the range 1 to 12\nyear with 7 bits for the range 01 to 99\n\
    mark with 7 bits for the range 0 to 100\n\n```\nstruct student\n{\n    int roll_no;\n\
    \    char sname[20];\n    unsigned int sex : 1;\n    struct date\n    {\n    \
    \    int day : 5;\n        int month : 4;\n        int year : 7;\n    }date;\n\
    \    int mark : 7;\n};\n```"
  merge: -1
  pgno: 407
