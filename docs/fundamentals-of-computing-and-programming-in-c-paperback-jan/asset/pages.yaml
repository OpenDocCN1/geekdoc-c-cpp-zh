  md: "# CP-238 C Programming\n\n```\nprintf(\\\nValue stored in mptr = %u xptr =\
    \ %u2\", mptr, xptr);\nprintf(\\\nValue referred by mptr = %d xptr = %0.2f\",*mptr,\
    \ *xptr);\n```\n\nWhen these commands are executed, the values stored or referred\
    \ by the addresses are printed as shown below.\n\n```\nValue stored in m = 15\t\
    \ x = 2.54\nValue stored in mptr = 2464\t xptr = 3012\nValue referred by mptr\
    \ = 15\t xptr = 2.54\n```\n\n> The pointer address will be determined at runtime\
    \ and may be different each time the program is executed.\n\nNote that the values\
    \ stored in mptr and xptr are the addresses of some other variable. %u is a format\
    \ specifier for unsigned integer which refers to the memory address. Also note\
    \ that pointers are named mptr and xptr just to differentiate them from the usual\
    \ variables used in a program; generally pointers are named a, b, c and so on.\n\
    \n# POINTER DECLARATION\n\nA pointer is declared like a variable with appropriate\
