    # Binary Division


    The table for binary division is given below. The division by 0 is meaningless.

    Binary Division


    0 / 1 = 0

    1 / 1 = 1


    The algorithm for binary division is as follows:

    ni. Start division from the left of the binary.

    ii. The divisor is subtracted from the dividend and the process is repeated.

    iii. If subtraction is possible, add 1 to the quotient and subtract the divisor
    from the dividend.

    iv. If the subtraction is not possible, add 0 to the quotient and bring down the
    next digit.

    v. Repeat this procedure to complete the division.


    Consider the following example to divide 25 by 5.

    In Decimal In Binary


    | | 5 | 101 |

    |---|---||

    | +5 | 11001 |

    | 25 | 101 |

    | 0 | 101 |

    | | 101 |

    | | 0 | |


    The result of 11001 / 101 is 101.

    Note that when division is not possible 0 is added to the quotient.


    Consider dividing 55 by 6.

    The binary of 55 is 110110 and 6 is 110.'
