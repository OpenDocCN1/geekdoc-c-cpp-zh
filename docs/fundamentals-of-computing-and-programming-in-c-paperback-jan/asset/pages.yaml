    # SHORT QUESTIONS AND ANSWERS


    +   1. Define the term Computer.

    The term computer refers to an electronic device capable of manipulating numbers
    and symbols under the control of a set of instructions known as a computer program.


    +   2. What is a computer program?

    A set of instructions written in one of the programming languages to solve a specific
    problem or task is called computer program. The program directs the computer to
    solve the problem and display the results and is written using programming languages
    like BASIC, FORTRAN, COBOL, PASCAL, C, C++ and so on.


