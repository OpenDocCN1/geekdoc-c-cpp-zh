    # Characteristics of an Algorithm


    Following are some the characteristics of an algorithm.


    +   1. Steps are well-ordered and easy to understand. Inputs and outputs should
    be defined clearly using concise words and conditions. All input data required
    to solve the problem must be listed and the output results expected also be clearly
    defined.


    +   2. Steps required to manipulate the inputs to produce the desired outputs
    are described clearly. Various steps required to solve the problem are outlined
    and refined further to get the effective algorithm.


    +   3. Algorithm should be the most effective one among different possibilities
    available to solve a problem. The proposed operations in the steps are effectively
    computable in the computing environment to carry out the operation.


    +   4. Algorithm uses the steps that they are executed and repeated only a finite
    number of times.


    +   5. Algorithms can be used to check possible infinite loop in logic.


    +   6. Algorithm is precise and unambiguous for someone who reads it and the operations
    are easily understood by the programmer.


    +   7. Algorithm do not use any computer program code. The algorithm is developed
    in such a way that it helps to generate program code in any programming language.


    +   8. Algorithm is also tested using sample data sets and the working of the
    algorithm is verified.


