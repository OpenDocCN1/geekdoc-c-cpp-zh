- img_proc: true
  md: '# CP-302 C Programming


    Remember that the program written by the user is called a source program which
    is translated into a machine language program by the compiler and is called an
    object program. In the actual compilation process in C language, the preprocessor
    processes the source program and directions for compilation of a program are passed.
    Following are the preprocessor directives.


    +   (a) Macro substitution

    (b) File inclusion

    (c) Conditional compilation


    ![](img/2e39d133c87ea945283efbb3d9eac1b7_479_0.png)


    # MACRO SUBSTITUTION


    Constant values or expressions can be identified using symbolic names. At the
    time of preprocessing, all symbolic names are replaced by values/expressions.
    This process is referred to macro substitution. It is defined as follows.


    ```

    #define identifier value or string

    ```


    Example


    ```

    #define N 50

    #define Title "ABC & Co"

    ```


    The constant value 50 is identified by Nand "ABC & Co" is identified by Title
    which are actually considered as strings. At the time of preprocessing, the value
    50 and "ABC & Co" are substituted in the place of N and Title. The identifiers
    N and Title are considered as macros.


    Also note that there is no white space (blank) between # and define, but white
    spaces are used to separate the identifier and the value or string. No terminator
    is used at the end of a macro declaration line.'
