  md: '# FC-28 Fundamentals of Computing


    # STORAGE DEVICES


    # Random Access Memory (RAM)


    Random Access Memory is a temporary storage medium in a computer. All data to
    be processed by the computer are transferred from a storage device or keyboard
    to RAM during processing. Results obtained from executing any program are stored
    in RAM. All data stored in RAM will be erased when the computer is switched off.
    Latest computers use RAM with a memory of more than 32 MB. Provisions are also
    available to increase the RAM memory in any computer. Most software packages require
    higher RAM for quick processing.


    ![](img/2e39d133c87ea945283efbb3d9eac1b7_57_0.png)


    **Figure 1.26 RAM**


    Any software or program is executed by loading it into RAM from hard disk or other
    storage media (Figure 1.26). RAM consists of many storage cells of size 1 byte
    and is identified using a number called as address. The memory address is assigned
    by the computer, which varies from computer to computer and time to time. The
    data stored in a specific location in memory are identified using the memory address.
    Memory address is assigned to a variable at the time of reading the data.


    The internal processing speed of a computer is very fast compared to reading and
    writing During the time of reading from disk the CPU is idle. To reduce this waiting
    time and increase the processing speed, cache memory is used in the computer (Cache
    is pronounced as cash). Note that the cache memory is part of RAM that holds the
    data, which is needed next by the CPU. When data is read from disk, it is loaded
    with data from the disk into the cache memory that is used next by the processor.
    The size of cache memory is 512KB. The data retrieval time for cache is more than
    thousand times faster than disk, so the processing speed of a computer is improved.


    # Read Only Memory (ROM)


    Read Only Memory is a permanent storage medium which starts up programs (operating
    system programs). These programs are loaded to the computer when the computer
    is switched on (Figure 1.27). ROM stores essentially the BIOS (Basic Input Output
    System) programs which are recorded by the manufacturer of the computer system.
    ROM is a non-volatile memory.'
