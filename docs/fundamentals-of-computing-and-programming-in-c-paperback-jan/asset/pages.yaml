    # Solution


    ```

    #include <stdio.h>

    #include <conio.h>

    #define BEGIN {

    #define END }

    #define BIG(a,b) ((a > b) ? a : b)

    #define WAIT getch();

    #define WAITMS "\n Press any key to continue..."

    main(){

    BEGIN

    int x,y;

    clrscr();

    printf("\n Enter two integers : ");

    scanf("%d%d", &x,&y);

    printf("\n Biggest integer is %d", BIG(x,y));

    END}

    ```'
