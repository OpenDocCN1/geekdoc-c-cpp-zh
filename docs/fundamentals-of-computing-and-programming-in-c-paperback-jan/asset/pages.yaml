  md: '# CP-252 C Programming


    # free () Function


    free () function is used to release the memory space which is allotted using malloc()
    or calloc() or realloc() function. It has the following form.


    ```

    free(ptr);

    ```


    where ptr is the pointer which refers to the allotted space in memory.


    # Example


    ```

    free(ptr);

    free(xp);

    free(p);

    ```


    When these functions are executed, the allocated blocks of memory are released.
    It is recommended to release the memory just before the termination of the program
    execution.


    # DYNAMIC MEMORY ALLOCATION FOR AN ARRAY


    In usual declaration of an array, the maximum number of elements (size of the
    array) is entered and the required bytes of memory is automatically allotted by
    the compiler at the time of compilation. Normally all the allotted bytes will
    not be utilised to store values of the array. This unnecessary occupation of memory
    can be avoided by allotting a block of memory during the runtime of the program.


    # One Dimensional Array and Pointer


    Consider an array declaration to store 50 elements which is declared follows.:


    ```

    int x[50];

    ```


    This may be declared as follows in dynamic memory allocation.


    ```

    int *x;

    x = (int*)malloc(50 * sizeof(int));

    ```


    The function calloc () may be used for the same purpose which initializes all
    elements with an initial value 0.


    ```

    int *x;

    x = (int *)calloc(50,sizeof(int));

    ```


    ![](img/2e39d133c87ea945283efbb3d9eac1b7_429_0.png)


    Note that (x+2) is pointing to the element location; * (x+2) is accessing the
    value in that location.'
