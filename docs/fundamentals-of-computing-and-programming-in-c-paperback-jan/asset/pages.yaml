  md: 'CP-250 C Programming


    # DYNAMIC MEMORY ALLOCATION


    Dynamic memory allocation refers to the method of allocating a block of memory
    and releasing it when the memory is not required at the time of running the program.
    A block of memory can be used to store values of simple or subscribed variables,
    and a block of memory can be accessed using a pointer. Following are the functions
    used in dynamic memory allocation, and these functions are available in the header
    file <alloc.h>.


    # malloc() Function


    malloc() is used to allocate a single block of memory to store values of specific
    data type. It also assigns the address of the first byte of the allotted space
    to a pointer. It has the following form:


    ```

    ptr = (type *)malloc(size);

    where mptr refers to pointer variable

    type refers to the data type to be stored in memory

    size refers to number of bytes to be allotted

    ```


    Consider the following examples to allocate 100 bytes.


    ```

    int mptr;

    mptr = (int *)malloc(100);

    mptr = (int *)malloc(50 * sizeof(int));

    ```


    The allotted space can be used to store 50 int type values, and this block of
    memory can be accessed by the pointer mptr of the same type. It is illustrated
    as shown below.


    # RAM


    ![](img/2e39d133c87ea945283efbb3d9eac1b7_427_0.png)'
