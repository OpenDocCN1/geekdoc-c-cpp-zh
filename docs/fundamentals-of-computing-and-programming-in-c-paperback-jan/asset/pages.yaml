  md: "# Example 8\n\nWrite a C program to sort n given numbers using bubble sort\
    \ and also find the number of exchanges and passes.\n\n# Solution\n\nThe bubble\
    \ sort technique is used to arrange the given set of numbers in ascending order.\
    \ Consider a list of 'n' values.\n\nCompare the values in the first and second\
    \ position, second and third position, first and fourth position, and so on. Ifx[0]>x[1]\
    \ then exchange the values. This process is continued until the largest value\
    \ is moved to the last position of the array.\n\n| 6 | -2 | 8 | 3 |\n\nThe comparison\
    \ is continued up to (n-1) position and the values are exchanged (if necessary).\
    \ Note that the second element is moved to the last position of the array.\n\n\
    The comparison is repeated again up to (n-2) position and the values are exchanged\
    \ (if necessary). Now the third largest element is moved to the third position.\n\
    \n| -2 | 3 | 6 | 8 |\n\nThe following steps are written to sort the numbers.\n\
    \n+   Step 1: Read n\nStep 2: Loop to read n numbers\nStep 3: Loop to repeat the\
    \ procedure (n-1) times\nStep 4: Loop to print the sorted list\nStep 5: Stop\n\
    \n```\nbegin\n  loop to repeat the consecutive elements\n  if(x[j]>x[j+1]) then\n\
