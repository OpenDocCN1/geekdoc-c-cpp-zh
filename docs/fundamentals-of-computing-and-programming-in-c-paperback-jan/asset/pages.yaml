    # INTRODUCTION


    Programs control data retrieval, processing and storage within a computer system.
    People who understand the details of the problem must determine the exact requirements
    for the program. The process of program development depends on the knowledge of
    the person involved and the type of the program.


    Professional programmers create application programs such as a payroll package,
    inventory system, or database management system. Developing efficient, accurate,
    and user-friendly programs requires organized efforts by trained programmers.
    Application programmers should have in-depth knowledge of the principles of computer
    processing with proficiency in one or more programming languages.'
