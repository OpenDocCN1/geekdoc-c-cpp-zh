    organizations use mainframe computers. Such organizations have extensive processing
    needs. Mainframes are commonly used for complex problem solving or large-volume
    jobs. Banks, insurance companies and large research projects involving hefty processing
    demands and fast processing speeds use mainframe computers. The major characteristics
    of mainframe computers are:'
