    \    Months.July => \"Ruby\",\n    Months.August => \"Sardonyx and Peridot\",\n\
    \    Months.September => \"Sapphire\",\n    Months.October => \"Opal and The Tourmaline\"\
    ,\n    Months.November => \"Topaz\",\n    Months.December => \"Turquoise and Zircon\"\
    ,\n    _ => $\"Did not find a birth stone for {month}\" \n```\n\nWe should note\
    \ a few things here:\n\n- Because the GetBirthMethod just returns the value from\
    \ the switch, it can be changed to use an expression body.\n- In the switch expression,\
    \ the need for case and break keywords are removed.\n- The switch expression puts\
    \ the variable before the switch keyword.\n- The case and: have been replaced\
    \ with a single =>, (for anyway) looks much nicer.\n- The default case has been\
    \ replaced with the _ discard.\n\nThis expression body makes cleaner, better-looking,\
    \ and more readable code. To change a switch statement to a switch expression,\
    \ place your cursor on the switch keyword and press Ctrl+. Convert switch statement\
    \ to expression.\n\n## Readonly members\n\nYou can now add readonly modifiers\
    \ to struct members. This is helpful if you need to indicate that a member does\
    \ not modify state, and gives you a more fine-tuned approach to simply applying\
    \ the readonly to a struct declaration.\n\nConsider the mutable struct in Code\
    \ Listing 48.\n\n```csharp\nCode Listing 48: Struct to calculate days since a\
    \ given date\npublic struct DaysSince\n{\n    public DateTime GivenDate { get;\
    \ set; }\n    public double Number => Math.Round((DateTime.Now - GivenDate).TotalDays,\
    \ 0);\n\n    public override string ToString() => $\"Days since {GivenDate} =\
    \ {Number} days\";\n}\n```\n\nWe can see that the ToString method will not change\
    \ the state, and you can indicate this by adding the readonly modifier to the\
    \ ToString declaration. When you do this, however, you will receive a compiler\
    \ warning, as seen in Figure 4.\n\n```\nreferences | changes | authors, changes\
    \ => public readonly override string ToString() => \"$GivenDate since = (Number)\
    \ days\";\n```\n\n## Figure 4: Compiler warning\n\nThis happens because the Number\
    \ property is not marked as readonly, and the compiler will display this warning\
    \ when it needs to create a defensive copy. We know that the Number property will\
    \ not change the state, so we can safely add a readonly modifier to the declaration.\n\
    \n## Code List 49: Add readonly modifier to struct member\n\n```csharp\npublic\
    \ struct DaysSince {\n    public DateTime GivenDate { get; set; }\n    public\
    \ readonly double Number => Math.Round((DateTime.Now - GivenDate).TotalDays, 0);\n\
    \n    public readonly override string ToString() => $\"GivenDate since {Number}\
    \ days\";\n}\n```\n\nBe aware that the readonly modifier is only necessary on\
    \ read-only properties. The compiler will not assume that getter accessors modify\
    \ state, so you must specify that. The only exception is with auto-implemented\
    \ properties where all auto-implemented getters are regarded as readonly by default.\
    \ This is the reason that the GivenDate property didn't generate a compiler warning.\n\
    \n## Using declarations\n\nYou should be familiar with the using statement in\
    \ C#. It provides a way to ensure that your code adheres to the correct usage\
    \ of IDisposable objects; when the code execution moves past the using statement's\
    \ scope, the objects in that scope are properly disposed of.\n\nConsider the using\
    \ statement in Code List 50.\n\n## Code List 50: Using statement to read a file\n\
    \n```csharp\nprivate void ReadFile() {\n    using (var reader = new System.IO.StreamReader(\"\
    C:\\temp\\TextDocument.txt\")) {\n        var lines = reader.ReadToEnd();\n  \
    \  }\n}\n```\n\nWith C# 8.0, you can now make use of using declarations instead,\
    \ as illustrated in Code Listing 51.\n\n## Code Listing 51: Using declaration\
    \ to read a file\n\n```csharp\nprivate void ReadFile() {\n    using var reader\
    \ = new System.IO.StreamReader(\"C:\\temp\\Document.txt\");\n    var lines = reader.ReadToEnd();\n\
    }\n```\n\nWhat we notice about the using declaration is that the using keyword\
    \ precedes the var keyword. This tells the compiler that the variable called reader\
    \ is being declared must be disposed of at the end of the enclosing scope.\n\n\
    ## Static local functions\n\nLocal functions are another one of my favorite language\
    \ features. First appearing in C# 7, you can now add the static modifier to a\
    \ local function in C# 8.0. When we use a static local function, we know it does\
    \ not use any of the arguments contained in its outer scope. This means that the\
    \ compiler can optimize the code accordingly.\n\nConsider the following code.\n\
    \n## Code Listing 52: Static local functions\n\n```csharp\nprivate double TotalObjectVolume((Cylinder\
    \ c, Sphere s, Pyramid p) volumeShapes) {\n    var cylinderVol = CalculateVolume(volumeShapes.c);\n\
    \    var sphereVol = CalculateVolume(volumeShapes.s);\n    var pyramidVol = CalculateVolume(volumeShapes.p);\n\
    \n    return Math.Round(cylinderVol + sphereVol + pyramidVol, 2);\n\n    // static\
    \ local functions\n    static double CalculateVolume<T>(T volumeShape)\n    {\n\
    \        return volumeShape switch {\n            Sphere s when s.Radius == 0\
    \ => 0,\n            Cylinder c => Math.PI * Math.Pow(c.Radius, 2) * c.Length,\n\
    \            Pyramid p => (1.0/3.0) * Math.PI * Math.Pow(p.Base, 2) * p.Height,\n\
    \            _ => 0\n        };\n    }\n\n    double GetCylinderRadius() {\n \
    \       var cylinder = volumeShapes.c;\n        return cylinder.Radius;\n    }\n\
    }\n```\n*(Note: Due to the fragmented nature of the provided OCR text for pages\
    \ 43-44, I have reconstructed the logical flow based on the provided snippets\
    \ to ensure valid code structure and readability.)*\n"
