    \ 访问修饰符。\n- 条件表达式。\n\n你可以在此处阅读更多关于在 C# 中编写安全高效的代码。\n\n## C# 7.3 版本\n\nC# 7 的点版本让开发者能够更早地接触到新的语言特性。C#\
    \ 7.3 的发布包含了两个主要特性：一个允许安全代码执行出与高效代码相同的性能，另一个则对现有特性提供了额外的改进。\n\n从更高效代码的角度来看，我们看到了：\n\
    \n- 在不固定（pinning）的情况下访问字段。\n- 重新分配 ref 局部变量。\n- 在 stackalloc 数组上使用初始化器。\n- 对任何支持模式的类型使用\
    \ fixed 语句。\n- 额外的泛型约束（你将在本书后部分通过 unmanaged 约束看到它的实际应用）。\n\n从改进的角度来看，我们看到了：\n\n\
    - 可以使用 == 和 != 比较元组类型。\n- 在更多位置使用表达式变量。\n- 在自动实现属性的备份字段上附加属性（attributes）。\n- 当参数带有\
    \ in 时改进了方法解析。\n- 减少了重载解析中的歧义情况。\n\n我们还看到了新的编译器选项：-publicsign 用于启用程序集的开源软件签名，以及\
    \ -pathmap 为源目录提供映射。\n\n## C# 8.0 版本\n\nC# 8.0 专门针对 .NET Core。这正是一本书的核心所在，这也是我猜你正在阅读它的原因。\n\
    \nC# 8.0 添加了以下特性和增强：\n\n- 只读成员（Readonly members）。\n- 默认接口方法。\n- 模式匹配增强。\n- 使用\
    \ 声明（Using declarations）。\n- 静态局部函数。\n- 可释放的 ref 结构体。\n- 可空引用类型。\n- 异步流。\n- 索引（Indices）和范围（ranges）。\n\
    - 空合并赋值（Null-coalescing assignment）。\n- 非托管构造类型（Unmanaged constructed types）。\n\
    - 嵌套类型中的 stackalloc。\n- C# 插值原始字符串的改进。\n\n这里有很多内容要学习。如果你对 C# 经验较少，最好的起点是 C# 7。本书将在深入研究\
    \ C# 8.0 的新特性之前，先看一眼 C# 7。\n\n如果你已经熟悉 C# 7，那么直接跳到 C# 8.0 章节即可。准备好了吗？\n\n## 第 2\
    \ 章 C# 7 特性回顾\n\n为了体会 C# 8.0 为开发者提供的价值，回顾一下 C# 7 中提供的某些特性是非常重要的。C# 语言一直在不断演进，但近年来为语言带来新特性的\
    \ C# 增量发布频率正在增加。\n\n> 注意：书中的大多数代码示例以实例方法而非静态方法的形式呈现。如果你想尝试这些示例，可能需要为它们装饰 static\
    \ 修饰符，这样你就可以直接调用它们而无需实例化对象。\n\n请注意，某些代码示例中使用的公共 Demo 是一个名为 Demo 的类的构造函数。\n\n##\
    \ out 变量\n\nC# 允许开发者使用 out 变量。你可能以前用过它们，它们在某些情况下非常方便。但有一件事（在 C# 7 发布之前）一直困扰我，那就是需要创建一个变量。\n\
    \n代码列表 1：C# 7 中的 out 变量\n```csharp\npublic Demo() {\n    int numberOfCopies =\
    \ 0;\n    GetNumberOfCopies(out numberOfCopies);\n}\n\nprivate void GetNumberOfCopies(out\
    \ int numCopies) {\n    numberOfCopies = 20;\n}\n```\n\n这是为了利用 C# 中一个真正优雅的语言特性而需要的（在我看来）很丑的代码。随着\
    \ C# 7 的到来，out 变量语法得到了改进。让我们考虑相同的代码（在 Demo 类的构造函数中）并稍微重写它：\n\n代码列表 2：C# 7 中的 out\
    \ 变量\n```csharp\npublic Demo() {\n    GetNumberOfCopies(out int numberOfCopies);\n\
    }\nprivate void GetNumberOfCopies(out int numCopies) {\n    numCopies = 20;\n\
    }\n```\n\n你会注意到，C# 7 允许开发者省去不必要的声明 `numberOfCopies = 0;` 并在参数列表中声明 out 变量。这使得代码变得整洁得多，并且更易阅读。但\
    \ C# 7 允许开发者更进一步。如果你一直在 Visual Studio 中跟进操作，你会看到 GetNumberOfCopies 方法参数列表中的 int\
    \ 下方有一个绿色的波浪线。\n\n> 注意：如果你没有看到代码样式建议，你可能在 EditorConfig 文件或你的样式偏好中抑制了该样式规则。有关样式偏好的更多信息，请参阅[本文](https://docs.microsoft.com/en-us/visualstudio/howto/code-style-preferences)。\n\
    \n此波浪线建议你将 int 替换为 var，如代码 3 所示。\n\n代码列表 3：用 var 替换 int\n```csharp\npublic Demo()\
    \ {\n    GetNumberOfCopies(out var numberOfCopies);\n}\nprivate void GetNumberOfCopies(out\
    \ int numCopies) {\n    numCopies = 20;\n}\n```\n\n从逻辑上看，这完全合理。numberOfCopies\
    \ 的类型是从 GetNumberOfCopies 方法签名中推断出来的。这种语法适用于任何 out 变量，例如在 TryParse 中。\n\n代码列表\
    \ 4：TryParse 中的 out 变量\n```csharp\nif (int.TryParse(\"3\", out var factor))\n\
    ```\n\n代码列表 4 展示了 TryParse 中 out 变量的使用。使用改进后的 out 变量语法的好处是：\n\n- 通过在用处声明变量提高了代码的可读性。\n\
    - 因为声明在用处进行，所以你不需要分配初始值。\n\nC# 7 对 out 变量的语法改进是提高代码可读性的语言特性之一。\n\n## 丢弃（Discards）\n\
    \n在上一节中，我们查看了 out 变量。我们看到可以在需要的地方声明 out，而无需分配初始值。如果我们不在乎赋值给 out 变量的值呢？\n\nC# 现在支持丢弃，允许开发者表示他们不在乎该变量。丢弃是一个只写变量，用下划线\
    \ _ 表示。\n\n将丢弃视为一个未赋值的变量。它可以用于以下情况：\n\n- 作为 out 参数。\n- 在 is 和 switch 语句中。\n- 作为独立的标识符。\n\
    - 在元组（下一节将介绍更多元组）或自定义类型的解构期间。\n\n让我们回到代码 4。如果我们想检查该值是否解析为整数值，可以使用丢弃变量而不是声明变量 factor，如代码\
    \ 5 所示。\n\n代码列表 5：使用丢弃\n```csharp\nif (int.TryParse(\"3\", out var _))\n{\n}\n\
    ```\n\n我喜欢使用扩展方法。扩展方法的一个常用用途是检查字符串值是否为整数。诚实地说，扩展方法可以做的比代码 6 中的简单示例要多得多。但我希望你关注的是这里丢弃变量的使用。\n\
    \n"
