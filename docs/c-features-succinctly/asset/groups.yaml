    - 数字字面量语法改进。\n\n开发者现在可以编写更整洁的代码并提高效率。\n\n## C# 7.1 版本\n\n从 C# 7.0 开始，我们开始看到 C#\
    \ 的点版本发布（7.1 版本）。这标志着 C# 发布节奏的加快。此版本的新语言特性包括：\n\n- async Main 方法。\n- 默认字面量表达式。\n\
