- md: "\n```cs\nreturn p.BaseLength * p.BaseWidth * p.Height / 3;\ndefault:\n    throw\
    \ new ArgumentException(message: \"Unrecognized object\",\n    nameof(volumeShape));\n\
    ```\n\nTraditionally, the switch statement supported the constant pattern, allowing\
    \ you to compare a variable to any constant in the case statement. This was limited\
    \ to numeric and string types. In C# 7 these restrictions do not apply anymore,\
    \ and you can use type patterns in switch statements.\n\nFurthermore, you can\
    \ also use when in your case expressions. Consider the code in Code List 20.\n\
    \nCode List 20: Using when clauses in case expressions\n\n```cs\nprivate double\
    \ CalculateVolume<T>(T volumeShape)\n{\n    switch (volumeShape)\n    {\n    \
    \    case Sphere s when s.Radius == 0:\n            return 0;\n        case Cylinder\
    \ c:\n            return Math.PI * Math.Pow(c.Radius, 2) * c.Length;\n       \
    \ case Sphere s:\n            return 4 * Math.PI * Math.Pow(s.Radius, 3) / 3;\n\
    \        case Pyramid p:\n            return p.BaseLength * p.BaseWidth * p.Height\
    \ / 3;\n        default:\n            throw new ArgumentException(message: \"\
    Unrecognized object\",\n            nameof(volumeShape));\n    }\n}\n```\n\nThe\
    \ change is subtle, but syntactically important. The case Sphere s when s.Radius\
    \ == 0 tells the compiler important regarding the variable s. If the Radius of\
    \ the variable s is equal to 0, do not even attempt the volume calculation, because\
    \ it makes no difference. The result will always be 0.\n\n# Local functions\n\n\
    Local functions are by far one of my favorite features of C# 7. When the use of\
    \ a specific method makes sense in only a single place, then it can be made local\
    \ to only that specific enclosing method.\n\nSo if a method called CalculateVolume\
    \ is only used by a single method called TotalObjectVolume, then it can be made\
    \ local to TotalObjectVolume. Let's illustrate this by using some simplified code.\n\
    \n# Code Listing 21: Simplified code\n\n```cs\nprivate string MethodOne()\n{\n\
    \    var getText = MethodTwo();\n    return getText;\n}\n\nprivate string MethodTwo()\n\
    {\n    return \"I am a method two\";\n}\n```\n\nAs you would expect, calling MethodOne\
    \ with Console.WriteLine(MethodOne()); results in the text I am method two being\
    \ displayed.\n\nIntroducing a local function called MethodTwo inside the body\
    \ of MethodOne will now result in the text I am local function two being displayed.\n\
    \n# Code Listing 22: Introducing a local function\n\n```cs\nprivate string MethodOne()\n\
    {\n    string MethodTwo()\n    {\n        return \"I am a local function two\"\
    ;\n    }\n\n    var getText = MethodTwo();\n    return getText;\n}\n\nprivate\
    \ string MethodTwo()\n{\n    return \"I am a method two\";\n}\n```\n\nThis means\
    \ local functions take precedence when used by code inside the scope of the enclosing\
    \ method. If the use of MethodTwo only made sense within MethodOne, then it would\
    \ do fine as a local function.\n\nLet's swing back to the TotalObjectVolume method\
    \ that uses the CalculateVolume local function, illustrated in Code Listing 23.\n\
    \n# Code Listing 23: CalculateVolume local function\n\n```cs\nprivate double TotalObjectVolume((Cylinder\
    \ c, Sphere s, Pyramid p)\nvolumeShapes)\n{\n    var cylinderVol = CalculateVolume(volumeShapes);\n\
    \n    double CalculateVolume<T>(T volumeShape)\n    {\n        switch (volumeShape)\n\
    \        {\n            case Sphere s when s.Radius == 0:\n                return\
    \ 0;\n            case Cylinder c:\n                return Math.PI * Math.Pow(c.Radius,\
    \ 2) * c.Length;\n            case Sphere s:\n                return 4 * Math.PI\
    \ * Math.Pow(s.Radius, 3) / 3;\n            case Pyramid p:\n                return\
    \ p.BaseLength * p.BaseWidth * p.Height / 3;\n            default:\n         \
    \       throw new ArgumentException(\"Unrecognized object\", name:nameof(volumeShape));\n\
    \        }\n    }\n\n    var sphereVol = CalculateVolume(volumeShapes);\n    var\
    \ pyramidVol = CalculateVolume(volumeShapes);\n\n    return Math.Round(cylinderVol\
    \ + sphereVol + pyramidVol, 2);\n}\n```\n\nThe TotalObject method takes a tuple\
    \ called volumeShapes as a parameter and uses the local function CalculateVolume\
    \ to calculate the volume of the Cylinder, Sphere, and Pyramid types.\n\nIt also\
    \ allows us to call the local function anywhere inside the enclosing TotalObjectVolume\
    \ method. You can place the local function after the return statement, as seen\
    \ in Code Listing 24.\n\n# Code Listing 24: Local function after return\n\n```cs\n\
    private double TotalObjectVolume((Cylinder c, Sphere s, Pyramid p)\nvolumeShapes)\n\
    {\n    var cylinderVol = CalculateVolume(volumeShapes);\n    var sphereVol = CalculateVolume(volumeShapes);\n\
    \    var pyramidVol = CalculateVolume(volumeShapes);\n\n    return Math.Round(cylinderVol\
    \ + sphereVol + pyramidVol, 2);\n}\n```\n\n```cs\n// Local functions\ndouble CalculateVolume<T>(T\
    \ volumeShape)\n{\n    switch (volumeShape)\n    {\n        case Sphere s when\
    \ s.Radius == 0:\n            return 0;\n        case Cylinder c:\n          \
    \  return Math.PI * Math.Pow(c.Radius, 2) * c.Length;\n        case Sphere s:\n\
    \            return 4 * Math.PI * Math.Pow(s.Radius, 3) / 3;\n        case Pyramid\
    \ p:\n            return p.BaseLength * p.BaseWidth * p.Height / 3;\n        default:\n\
    \            throw new ArgumentException(\"Unrecognized object\", name:nameof(volumeShape));\n\
    \    }\n}\n```\n\nLocal functions are a fantastic addition to C# that allow specific\
    \ intent. The use of MethodTwo only made sense within MethodOne, then it would\
    \ do fine as a local function.\n\n# Expression-bodied members\n\nUsing expression-bodied\
    \ members, we can cut down on code and make it more readable. Consider the Circle\
    \ class in 25.\n\nCode Listing 25: The Circle\n\n```cs\npublic class Circle\n\
    {\n    public double Radius { get; }\n    public double RadiusSquared => Math.Pow(Radius,\
    \ 2);\n}\n```\n\nThe code is more readable and succinct.\n\n# Expression-bodied\
    \ members for constructors, destructors, properties, and indexers\n\nLet's briefly\
    \ discuss expression-bodied members.\n\n```cs\npublic class Circle\n{\n    public\
    \ double Radius { get; }\n    public double RadiusSquared => Math.Pow(Radius,\
    \ 2);\n\n    public Circle(double radius) => Radius = radius;\n\n    ~Circle()\
    \ => Console.WriteLine(\"Cleaning up\");\n\n    public double this[int index]\
    \ => index * index;\n}\n```\n\nThe expression-bodied members for constructors,\
    \ destructors, properties, and indexers allow for very concise code.\n\n# Generalized\
    \ return types\n\nEvery async method was required to return Task, Task<T>, or\
    \ void. Generally, void-returning methods should only be used with fire and forget.\
