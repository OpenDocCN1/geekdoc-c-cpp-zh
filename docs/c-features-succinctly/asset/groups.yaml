    Set time to live at 5 seconds\nReturn value\n47\n\nIt must be noted that the returned\
    \ type still needs to satisfy the async pattern. This means that the GetAwaiter\
    \ method must be accessible.\n\n## Chapter 3 C# 8.0 Features\n\nWith the release\
    \ of C# 8.0, developers have been given more features and enhancements to improve\
    \ their codebases with, such as pattern matching enhancements. This will become\
    \ evident when we look at switch expressions later on in this book.\n\nC# 8.0\
    \ is supported by .NET Core 3.x and .NET Standard 2.1.\n\n## Default interface\
    \ methods\n\nThis change to interfaces in C# 8.0 might be somewhat controversial\
    \ for some, depending on your views. The logic, however, behind the feature in\
    \ C# 8.0 is welcome. To understand the change, we need to explain a scenario.\n\
    \nAn application creates orders. For this scenario, an interface called IOrder\
    \ has been created, and is implemented by your application. This interface is\
    \ also used in an external codebase maintained by a different team of developers.\
    \ The interface and implementation look as illustrated in Code Listing 30.\n\n\
    > Code Listing 30: The IOrder Interface\n\n```csharp\npublic class SalesOrder\
    \ : IOrder{\n    public void CreateOrder(DateTime orderDate) { }\n}\n\npublic\
    \ interface IOrder{\n    void CreateOrder(DateTime orderDate);\n}\n```\n\nChanges\
    \ to logic in the program require developers to be able to default the order date.\
    \ The change, therefore, needs to be made in the interface to provide the ability\
    \ to create an order without specifying a date. This will simply default to the\
    \ current date.\n\nThe problem with this approach is that once interfaces are\
    \ released, they are considered immutable. Adding logic to the IOrder interface\
    \ is a breaking change, as seen in Figure 1.\n\n```diff\n- 0 references | 0 changes\
    \ | 0 authors\n-public class SalesOrder : IOrder\n- {\n-  1 reference | 0 changes\
    \ | 0 authors, 0 changes\n-  public void CreateOrder(DateTime orderDate) { }\n\
    -}\n- 1 reference | 0 changes | 0 authors, 0 changes\n-public interface IOrder\n\
    - {\n-  1 reference | 0 changes | 0 authors, 0 changes\n-  void CreateOrder(DateTime\
    \ orderDate);\n-  0 references | 0 changes | 0 authors, 0 changes\n-  void CreateOrder();\n\
    - }\n```\n\nFigure 1: Modifying the interface introduces a breaking change\n\n\
    This is because the addition of the CreateOrder() method requires implementation\
    \ in all classes that use the interface. In C# 8.0, we can provide a default implementation\
    \ when upgrading an interface.\n\nCode List 31: Default Interface method\n\n```csharp\n\
    public class SalesOrder : IOrder\n{\n  public void CreateOrder(DateTime orderDate)\
