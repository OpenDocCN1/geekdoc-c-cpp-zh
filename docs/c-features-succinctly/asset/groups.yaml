- md: "\n# Code Listing 6: Using a discard in an extension method\n\n```csharp\npublic\
    \ static bool ToInt(this string value)\n{\n    return int.TryParse(value, out\
    \ var _);\n}\n```\n\nI don't care about the value—I just want to check if it's\
    \ an integer—and the discard is a perfect candidate for this type of situation.\n\
    \nTip: You can further simplify the code in Code Listing 6 by using an expression\
    \ body.\n\n# Tuples\n\nSometimes developers need to pass structures containing\
    \ multiple data elements to methods. Tuples were added to C# to provide data structures\
    \ containing multiple fields (up to a maximum of eight items) representing the\
    \ data members.\n\nC# 7.0 also introduced language support for tuples that enabled\
    \ semantic names for the tuple fields using new tuple types. Code Listing 7 illustrates\
    \ a basic example of a tuple.\n\n# Code Listing 7: Field names specified in tuple\
    \ initialization\n\n```csharp\nvar fundedDates = (Microsoft: 1975, Apple: 1976,\
    \ Amazon: 1994);\nConsole.WriteLine($\"Microsoft founded in {fundedDates.Microsoft}\"\
    );\nConsole.WriteLine($\"Apple founded in {fundedDates.Apple}\");\nConsole.WriteLine($\"\
    Amazon founded in {fundedDates.Amazon}\");\n```\n\nHere in Code Listing 7, you\
    \ can see that the field names are explicitly specified in the initialization\
    \ expression. You can also specify the field names in the tuple type definition,\
    \ as seen in Code Listing 8.\n\n# Code Listing 8: Field names specified in the\
    \ type definition\n\n```csharp\n(int Microsoft, int Apple, int Amazon) fundedDates\
    \ = (1975, 1976, 1994);\nConsole.WriteLine($\"Microsoft founded in {fundedDates.Microsoft}\"\
    );\nConsole.WriteLine($\"Apple founded in {fundedDates.Apple}\");\nConsole.WriteLine($\"\
    Amazon founded in {fundedDates.Amazon}\");\n```\n\nC# will also allow you to infer\
    \ the field names from the variable names in the tuple initialization expression.\
    \ This is illustrated in Code Listing 9.\n\n# Code Listing 9: Tuple field names\
    \ inferred\n\n```csharp\nvar distanceToEarth = 384400;\nvar radius = 1737.1;\n\
    var moon = (distanceToEarth, radius);\n\nConsole.WriteLine($\"The moon is {moon.distanceToEarth}\
    \ km from Earth.\");\nConsole.WriteLine($\"The moon has a radius of {moon.radius}\"\
    );\n```\n\nThe field names are therefore inferred, so it's probably a good idea\
    \ to think about them arbitrarily naming variables. For example, if distanceToEarth\
    \ was simply named distance, then the tuple would read as moon.distance, which\
    \ somewhat obfuscates the intent.\n\n# Tuple equality\n\nTuple types also have\
    \ support for == and != operators. This means that in the code in Listing 10 will\
    \ equate to true.\n\n# Code Listing 10: Comparing tuples\n\n```csharp\nvar teamOne\
    \ = (JohnScore: 15, MikeScore: 27);\nvar teamTwo = (SallyScore: 15, MelissaScore:\
    \ 27);\n\nConsole.WriteLine(teamOne == teamTwo); // Equates to true\n```\n\nYou\
    \ can only compare tuples when:\n\n- Each tuple has the same number of elements.\
    \ TeamOne had an additional score, Visual Studio would tell you that the tuple\
    \ types must have matching cardinalities.\n- For every tuple position, the elements\
    \ from the left-hand and right-hand tuple operands are comparable with the ==\
    \ and != operators.\n\nThis means the following code would not be comparable.\n\
    \n# Code Listing 11: Non-comparable tuples\n\n```csharp\nvar teamOne = (JohnScore:\
    \ 15, MikeScore: \"27\");\nvar teamTwo = (SallyScore: 15, MelissaScore: 27);\n\
    \nConsole.WriteLine(teamOne == teamTwo); // Results in a compile-time error\n\
    ```\n\nThis is because == cannot be applied to operands of type string and int.\n\
    \n# Using a tuple as a method return type\n\nMethods can also return tuple types.\
    \ Consider the method illustrated in Code Listing 12.\n\n# Code Listing 12: Method\
    \ returning a tuple\n\n```csharp\nprivate (int Age, DateTime BirthDate, string\
    \ FullName) ReadPersonInfo()\n{\n    var personData = (age: 0, birthday: DateTime.MinValue,\
    \ fullName: \"\");\n    // Read data from somewhere\n    personData.FullName =\
    \ \"Joe Soap\";\n\n    var today = DateTime.Now;\n    personData.birthday = today.AddYears(-44);\n\
    \    personData.age = today.Year - personData.birthday.Year;\n\n    return personData;\n\
    }\n```\n\nThe simple method returns a tuple, which can then be used by the calling\
    \ code, as illustrated in Code Listing 13.\n\n# Code Listing 13: Calling with\
    \ tuple return type\n\n```csharp\nvar person = ReadPersonInfo();\nConsole.WriteLine($\"\
    {person.FullName} was born on {person.BirthDate:dd MMMM yyyy} and is {person.age}\
    \ years old.\");\n```\n\nIf you wanted to, you could reconstruct the tuple instance\
    \ into separate variables, as illustrated in Code Listing 14.\n\n# Code Listing\
    \ 14: Deconstruct tuple into explicit variables\n\n```csharp\n(int age, DateTime\
    \ DOB, string fullName) = ReadPersonInfo();\nConsole.WriteLine($\"{fullName} was\
    \ born on {DOB:dd MMMM yyyy} and is {age} years old.\");\n```\n\nThis allows me\
    \ to explicitly specify the variable types to deconstruct the tuple into. I can\
    \ also let the compiler do it for me by implicitly declaring the reconstructed\
    \ variables. For this, I can use the var keyword, as illustrated in Code Listing\
    \ 15.\n\n# Code Listing 15: Using var keyword for implicit deconstruction\n\n\
    ```csharp\nvar (age, DOB, fullName) = ReadPersonInfo();\nConsole.WriteLine($\"\
    {fullName} was born on {DOB:dd MMMM yyyy} and is {age} years old.\");\n```\n\n\
    This is great for when you are not sure of the return type.\n\n# Pattern matching\n\
    \nPatterns in C# allow to check what type a value is, and then perform a specific\
    \ action based on that type. This is illustrated in Code Listing 17.\n\n# Code\
    \ Listing 17: Using is pattern expression\n\n```csharp\nprivate double CalculateVolume<T>(T\
    \ volumeShape)\n{\n    if (volumeShape is Cylinder c)\n        return Math.PI\
    \ * Math.Pow(c.Radius, 2) * c.Length;\n    else if (volumeShape is Sphere s)\n\
    \        return 4 * Math.PI * Math.Pow(s.Radius, 3) / 3;\n    else if (volumeShape\
    \ is Pyramid p)\n        return p.BaseLength * p.BaseWidth * p.Height / 3;\n\n\
    \    throw new ArgumentException(message: \"Unrecognized object\", paramName:\
    \ nameof(volumeShape));\n}\n```\n\nUsing the is pattern expression, we can check\
    \ what type the volumeShape variable is, and then perform an action based on that\
    \ type. This is illustrated in Code Listing 16.\n\n# Code Listing 16: Classes\n\
    \n```csharp\npublic class Cylinder\n{\n    public double Length { get; set; }\n\
    \    public double Radius { get; set; }\n\n    public Cylinder(double length,\
    \ double radius)\n    {\n        Length = length;\n        Radius = radius;\n\
    \    }\n}\n\npublic class Sphere\n{\n    public double Radius { get; set; }\n\n\
    \    public Sphere(double radius)\n    {\n        Radius = radius;\n    }\n}\n\
    \npublic class Pyramid\n{\n    public double BaseLength { get; set; }\n    public\
    \ double BaseWidth { get; set; }\n    public double Height { get; set; }\n\n \
    \   public Pyramid(double baseLength, double baseWidth, double height)\n    {\n\
