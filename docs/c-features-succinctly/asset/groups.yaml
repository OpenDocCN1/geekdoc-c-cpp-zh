    ## Code analyzers


    Code analyzers ensure that your code is more readable, and they will give you
    suggestions as you go along. Consider Figure 27.


    ![](img/49b3596025ccb7ecebab509ce03bfac6_72_0.png)


    Figure 27: Lightbulb code suggestion


    The lightbulb will suggest improvements to your code as you write it. Some of
    these suggestions can, however, be missed. Consider Figure 28.


    ```

    var factorCount = intFactors.Count > 0 ? intFactors[intFactors.Count - 1] : 0;

    ```


    Figure 28: Code fix suggestion


    If you look carefully at intFactors.Count - 1, you will notice the ellipsis (three
    dots) below the "in" portion of the variable intFactors.


    If you click on the ellipsis, you will see the code fix suggestion (Figure 29).
    In this example, the suggestion is to use the index operator. Have a look at Code
    Listing 41 for more on the index operator.


    intactors[intFactors.Count - 1] : 0;


    ![](img/49b3596025ccb7ecebab509ce03bfac6_73_0.png)


    Figure 29: Use index operator suggestion


    You can also change the severity of this code fix suggestion by changing the severity
    from the same place you applied the code fix (Figure 30).


    intFactors[intFactors.Count - 1] : 0;


    ![](img/49b3596025ccb7ecebab509ce03bfac6_73_1.png)


    Figure 30: Configure severity


    Changing this code fix to a warning will give you a squiggly line under the code
    being analyzed, as seen in Figure 31.


    ```

    var factorCount = intFactors.Count > 0 ? intFactors[intFactors.Count..1] : 0;

    ```


    Figure 31: Severity promoted to warning


    Code analyzers are a fantastic feature of Visual Studio, and they help developers
    and teams maintain good coding practices.


    ## File header support in .editorconfig


    The .editorconfig file is a universal way to enforce a specific code style or
    code quality options across your team (Figure 32).


    ![](img/49b3596025ccb7ecebab509ce03bfac6_74_0.png)


    Figure 32: The .editorconfig file


    This can be checked into source control and can travel with your solution to new
    team members.


    If you open the .editorconfig file (Figure 33), you will notice the warning we
    added for the index operator in Figure 30. The .editorconfig includes file header
    support. I can now add file headers to files in my solutions using .editorconfig.
    To do this, add the text you want to the file_header_template as seen in Figure
    33, and save your .editorconfig.


    ![](img/49b3596025ccb7ecebab509ce03bfac6_75_0.png)


    Figure 33: Modifying the .editorconfig file


    In a code file, place your cursor at the very top before the first using statement,
    and click the lightbulb that is displayed (Figure 34).


    ![](img/49b3596025ccb7ecebab509ce03bfac6_75_1.png)


    Figure 34: Add file header


    You are now able to include this file header in your code file. You can also choose
    to add it to the document, project, or solution.


    ## C# language resources


    Microsoft has made many resources available to developers. There is a rich body
    of code online, as well as various communities that allow developers to find help
    if they need it. Here are a few resources you might find useful.


    ### C# language reference


    This [Introduction]() document is probably the one you will be reading the most.


    ### C# language proposals


    [Language proposals]() should be seen as living documents, and would be the place
    to see what the current thinking is surrounding a specific language feature.


    ### C# language design meetings


    The language design meetings (also known as LDM) is where the C# team investigates,
    designs, and decides on features being added to the C# language. You can read
    the [meeting notes here]().


    ### C# language design design


    This is the [official repo for the C# language]().

