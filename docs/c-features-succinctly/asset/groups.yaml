    \ throw new ArgumentException(message: $\"Unknown shape: {shape}\", paramName:\
    \ nameof(shape))\n    };\n\n    if (area < 3.0)\n        return AreaSize.small;\n\
    \    else if (area < 5.0)\n        return AreaSize.medium;\n    else if (area\
    \ < 7.0)\n        return AreaSize.large;\n    else\n        return AreaSize.huge;\n\
    }\n```\n[/content]\n``` (Wait, the prompt asks for ONLY the content inside [content].\
    \ I will provide just that now.)\n\n***\n\n[content]\n# Using Directory.Build.props\n\
    \nIf you want each project in your solution to target C# 8.0, or if you need to\
    \ add any custom property to all your projects, you can create a file called Directory.Build.props\
    \ in the root of your solution and add the <LangVersion> in there.\n\nThis is\
    \ illustrated in Code Listing 67.\n\nCode Listing 67: The Directory.Build.props\
    \ file\n\n```xml\n<Project>\n  <PropertyGroup>\n    <LangVersion>8.0</LangVersion>\n\
    \  </PropertyGroup>\n</Project>\n```\n\nI am not sure that I would necessarily\
    \ enable C# 8.0 on any .NET project. I would probably take the time to create\
    \ a .NET Core application from the get-go, but this solution isn't without its\
    \ merits. This could be useful in situations where you are dealing with an existing\
    \ .NET project that has had a lot of development effort invested, and that can't\
    \ be easily rewritten from scratch in .NET Core.\n\nIn this situation, jimmying\
    \ the .csproj file to enable C# 8.0 makes sense.\n\n# Chapter 4 The Future of\
    \ C# and C# 9\n\nThere are some nice features planned for C# 9. While all these\
    \ planned features might not make it into the final release—and some things that\
    \ do make it in might change between the writing of this book and then—they give\
    \ a nice overview of the direction the C# team is taking.\n\n# Top-level programs\n\
    \nCode List 68 illustrates the code that we have all seen, with a Program class\
    \ followed by the Main method.\n\nCode List 68: Classes implementing IShape interface\n\
    \n```csharp\nusing System.Console;\n\nclass Program\n{\n    static void Main(string[]\
    \ args)\n    {\n        var t = new Triangle\n        {\n            Base = 5.0,\n\
    \            Height = 10.5\n        };\n\n        DisplayArea(t);\n\n        //\
    \ static local functions\n        static void DisplayArea<T>(T shape) where T\
    \ : IShape\n        {\n            WriteLine(shape.Area());\n        }\n    }\n\
    }\nclass Triangle : IShape\n{\n    public double Height { get; set; }\n    public\
    \ double Base { get; set; }\n\n    public double Area() => Height * Base / 2;\n\
    }\nclass Rectangle : IShape\n{\n    public double Length { get; set; }\n    public\
    \ double Width { get; set; }\n\n    public double Area() => Length * Width;\n\
    }\n\npublic interface IShape\n{\n    double Area();\n}\n```\n\nIn C# 9, developers\
    \ will be allowed to simply omit the Program class and the Main method. The code\
    \ will be illustrated in Code Listing 69.\n\n# Code Listing 69: Omitting the static\
    \ void Main\n\n```csharp\nusing static System.Console;\n\nvar t = new Triangle\n\
    {\n  Base = 5.0,\n  Height = 10.5\n};\n\nDisplayArea(t);\nReadLine();\n\n// static\
    \ local functions\nstatic void DisplayArea<T>(T shape) where T : IShape\n{\n \
    \ WriteLine(shape.Area());\n}\n\nclass Triangle : IShape\n{\n  public double Height\
    \ { get; set; }\n  public double Base { get; set; }\n\n  public double Area()\
    \ => Height * Base / 2;\n}\n\nclass Rectangle : IShape\n{\n  public double Length\
    \ { get; set; }\n  public double Width { get; set; }\n}\n```\n\nThis means you\
    \ can just write top-level statements at the top of your file. The top-level statements\
    \ remain part of your Main method, and the DisplayArea local function remains\
    \ a local function; it's just called from the top-level statements.\n\nTop-level\
    \ statements must precede namespaces and type declarations, and can only appear\
    \ in one file.\n\nAnother great feature is that if you place the await statements\
    \ as top-level statements, then the Main becomes an async Task Main. At this point,\
    \ I bet you are wondering what will become of the args argument in Main method.\n\
    \nThis is not in any of the previews just yet, but there is a possibility that\
    \ args will become a magic keyword. This means the C# team will make a variable\
    \ available in the top-level statements called args. The magic variable makes\
    \ me think of value in a property setter.\n\n# Relational and logical patterns\n\
    \nC# 9.0 will introduce patterns that correspond to relational operators, such\
    \ as < and <=. You will also be able to combine patterns with logical operators\
    \ such as and, or not. Consider the code in Code Listing 70.\n\nCode Listing 70:\
    \ Method with switch expression\n\n```csharp\npublic AreaSize DoSomething<T>(T\
    \ shape, int numberOfShapes) where T : IShape {\n    var area = shape switch {\n\
    \        Square s => s.Area() * numberOfShapes,\n        Circle c => c.Area()\
    \ * numberOfShapes,\n        null => throw new ArgumentNullException(nameof(shape)),\n\
    \        _ => throw new ArgumentException(message: $\"Unknown shape: {shape}\"\
    , paramName: nameof(shape))\n    };\n\n    if (area < 3.0)\n        return AreaSize.small;\n\
    \    else if (area < 5.0)\n        return AreaSize.medium;\n    else if (area\
    \ < 7.0)\n        return AreaSize.large;\n    else\n        return AreaSize.huge;\n\
    }\n```\n"
  mdcn: "\n# 使用 Directory.Build.props\n\n如果你想让解决方案中的每个项目都目标 C# 8.0，或者如果你需要为所有项目添加任何自定义属性，可以在解决方案的根目录下创建一个名为\
    \ `Directory.Build.props` 的文件，并在其中添加 `<LangVersion>`。\n\n这在代码列表 67 中所示。\n\n代码列表\
    \ 67：Directory.Build.props 文件\n\n```xml\n<Project>\n  <PropertyGroup>\n    <LangVersion>8.0</LangVersion>\n\
    \  </PropertyGroup>\n</Project>\n```\n\n我不确定我是否一定会在任何 .NET 项目上启用 C# 8.0。我可能会花时间从一开始就创建一个\
    \ .NET Core 应用程序，但这个解决方案并非没有用处。当你正在处理一个投入了大量开发精力且无法轻易在 .NET Core 中从头重写的现有 .NET\
    \ 项目时，这非常有用。\n\n在这种情况下，通过修改 `.csproj` 文件来启用 C# 8.0 是有意义的。\n\n# 第 4 章 C# 的未来与 C#\
    \ 9\n\nC# 9 计划了一些非常棒的功能。虽然所有计划中的功能可能不会进入最终版本——而且一些确实进入的功能在本书编写与发布之间可能会发生变化——它们为\
    \ C# 团队正在采取的方向提供了一个很好的概述。\n\n# 顶层程序 (Top-level programs)\n\n代码列表 68 展示了我们见过的代码，包含一个\
    \ `Program` 类，后面跟着 `Main` 方法。\n\n代码列表 68：实现 IShape 接口的类\n\n```csharp\nusing System.Console;\n\
    \nclass Program\n{\n    static void Main(string[] args)\n    {\n        var t\
    \ = new Triangle\n        {\n            Base = 5.0,\n            Height = 10.5\n\
    \        };\n\n        DisplayArea(t);\n\n        // 静态局部函数\n        static void\
    \ DisplayArea<T>(T shape) where T : IShape\n        {\n            WriteLine(shape.Area());\n\
    \        }\n    }\n}\nclass Triangle : IShape\n{\n    public double Height { get;\
    \ set; }\n    public double Base { get; set; }\n\n    public double Area() =>\
    \ Height * Base / 2;\n}\nclass Rectangle : IShape\n```\n\n```csharp\n{\n    public\
    \ double Length { get; set; }\n    public double Width { get; set; }\n\n    public\
    \ double Area() => Length * Width;\n}\n\npublic interface IShape\n{\n    double\
    \ Area();\n}\n```\n\n在 C# 9 中，开发者将允许允许省略 `Program` 类和 `Main` 方法。代码将在代码列表 69 中展示。\n\
    \n# 代码列表 69：省略 static void Main\n\n```csharp\nusing static System.Console;\n\n\
    var t = new Triangle\n{\n  Base = 5.0,\n  Height = 10.5\n};\n\nDisplayArea(t);\n\
    ReadLine();\n\n// 静态局部函数\nstatic void DisplayArea<T>(T shape) where T : IShape\n\
    {\n  WriteLine(shape.Area());\n}\n\nclass Triangle : IShape\n{\n  public double\
    \ Height { get; set; }\n  public double Base { get; set; }\n\n  public double\
    \ Area() => Height * Base / 2;\n}\n\nclass Rectangle : IShape\n{\n  public double\
    \ Length { get; set; }\npublic double Width { get; set; }\n\npublic double Area()\
    \ => Length * Width;\n}\n\npublic interface IShape{\n    double Area();\n}\n```\n\
    \n这意味着你可以直接在文件顶部编写顶层语句（top-level statements）。顶层语句仍然是你的 `Main` 方法的一部分，`DisplayArea`\
    \ 局部函数仍然是一个局部函数；它只是从顶层语句调用的。\n\n顶层语句必须位于命名空间和类型声明之前，且只能出现在文件中。\n\n另一个很棒的功能是，如果你将\
    \ `await` 语句作为顶层语句，那么 `Main` 就会变成一个 `async Task Main`。此时，我打赌你正在想 `Main` 方法中的 `args`\
    \ 参数会变成什么样。\n\n这还没有出现在任何预览版中，但 `args` 有可能变成一个魔法关键字（magic keyword）。这意味着 C# 团队将在顶层语句中提供一个名为\
    \ `args` 的变量。这个魔法变量让我想起了属性设置器中的值。\n\n# 关系模式和逻辑模式\n\nC# 9.0 将引入对应于关系运算符（如 `<` 和\
    \ `<=`）的模式。你还将能够将模式与逻辑运算符（如 `and`、`or`、`not`）结合起来。考虑代码列表 70 中的代码。\n\n代码列表 70：带有\
    \ switch 表达式的方法\n\n```csharp\npublic AreaSize DoSomething<T>(T shape, int numberOfShapes)\
    \ where T : IShape {\n    var area = shape switch {\n        Square s => s.Area()\
    \ * numberOfShapes,\n        Circle c => c.Area() * numberOfShapes,\n        null\
    \ => throw new ArgumentNullException(nameof(shape)),\n        _ => throw new ArgumentException(message:\
    \ $\"Unknown shape: {shape}\", paramName: nameof(shape))\n    };\n\nif (area <\
    \ 3.0)\nreturn AreaSize.small;\nelse if (area < 5.0)\n  return AreaSize.medium;\n\
    else if (area < 7.0)\n  return AreaSize.large;\nelse\n  return AreaSize.huge;\n\
    }\n```\n\n我们在 `switch` 表达式中检查了 `null`。有趣的是，因为 C# 9.0 支持关系模式，我们可以修改 `if/else` 语句，如图\
    \ 10 所示。\n"
