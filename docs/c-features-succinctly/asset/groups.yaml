    # The Story Behind the Succinctly Series of Books


    Daniel Jebaraaj, Vice President

    Syncfusion, Inc.


    ## Staying on the cutting edge

    As many of you know, Syncfusion is a provider of software components for the Microsoft
    platform. This puts us in the exciting but challenging position of always being
    on the cutting edge.


    Whenever platforms or tools are shipping out of Microsoft, which seems to be about
    other week these days, we have to educate ourselves, quickly.


    ## Information is plentiful but harder to digest

    In reality, this translates to a lot of book orders, book searches, and Twitter
    scans.


    While more information is becoming available on the internet and more books are
    published, even on topics that are relatively new, one aspect that continues to
    inhibit us-is the inability to find concise technology overview books.


    We are usually faced with two options: read several 500+ page books or scour the
    web for relevant blog posts and other articles. Just as everyone who has a job
    to do and customers serve, we find this quite frustrating.


    ## The Succinctly series

    This frustration translated into a deep desire to produce a series of concise
    technical books that would be targeted at developers working on the Microsoft
    platform.


    We firmly believe, given the background knowledge which developers have, that
    most topics can be translated into books that are between 50 and 100 pages.


    This is exactly what we resolved to accomplish with the Succinctly series. Isn''t
    everything wonderful born out of a deep desire to change things for the better?


    ## The best authors, the best content

    Each author was carefully chosen from a pool of talented experts who shared our
    vision. The book you now hold in your hands, and the others available in this
    series, are a result of the authors'' tireless work. You will find original content
    that is guaranteed to get you up and running in about the time it takes to drink
    a few cups of coffee.


    ## Free forever

    Syncfusion will be working to produce books on several topics. The books will
    always be free. Any updates we publish will also be free.


    ## Free? What is the catch?

    There is no catch here. Syncfusion has a vested interest in this effort.


    As a component vendor, our unique claim has always been that we offer deeper and
    broader frameworks than anyone else on the market. Developer education greatly
    helps us market and sell against competing vendors who promise to "enable AJAX
    support with one click," or "turn the moon to cheese!"


    ## Let us know what you think

    If you have any topics of interest, thoughts, or feedback, please feel free to
    send them to us at succinctly-series@syncfusion.com.


    We sincerely hope you enjoy reading this book and that it helps you better understand
    the topic of study. Thank you for reading.


    Please follow us on Twitter and “Like” on us on Facebook to help us spread the
    word about the Succinctly series!


    ![](img/49b3596025ccb7ecebab509ce03bfac6_7_0.png)


    ![](img/49b3596025ccb7ecebab509ce03bfac6_7_1.png)


    ## About the Author

    Dirk Strauss is a software developer from South Africa with over 13 years of programming
    experience. He has extensive experience in SYSPRO customization, with a focus
    on C# and web development. He studied at Nelson Mandela University, where he wrote
    software part-time to gain a better understanding of the technology. He remains
    passionate about writing code and sharing what he learns with others.


    ## Chapter 1 The History of C#

    C# is continuing to evolve and improve with each major release of the language.
    As the C# team is innovating and adding features to C#, its members share their
    thought process around the design of C# with the community.


    If you head over the dotnet/Roslyn repository on GitHub, you will see detailed
    language feature statuses as well as features that the C# team is considering
    for upcoming releases. You can also view a history-of C# on the Microsoft Docs.
    As of this writing, in particular interest are the planned features surrounding
    C# 9. Later in this book, we will have a look at what is planned for C# 9.


    The C# build will default the language version to the latest major release. As
    of C# 7.0, however, developers started seeing more point releases in the form
    of versions C# 7.1, C# 7.2, and C# 7.3.


    ## C# language version

    When creating a new project in Visual Studio, the C# compiler figures out which
    version of C# to use based on the target framework of your project. This ensures
    you do not use a language version that requires runtime or behavior not available
    in the target framework of the project.


    It is worth mentioning that C# 8.0 and higher will only be supported on .NET Core
    3.x and later. Table 1 outlines the C# language defaults based on the target framework.


    Table 1: Language version default mapping


    | Target framework | Version | C# language default |

    | :--- | :--- | :--- |

    | .NET Core | 3.x | C# 8.0 |

    | .NET Core | 2.x | C# 7.3 |

    | .NET Standard | 2.1 | C# 8.0 |

    | .NET Standard | 2.0 | C# 7.3 |

    | .NET Standard | 1.x | C# 7.3 |

    | .NET Framework | All | C# 7.3 |


    As you will see later in this book, you can override the default language version.
    You can do this by:


    - Manually editing your .csproj file

    - Configuring multiple projects using a Directory.Build.props file

    - Configuring the lang version option.


    ## C# version 1.0

    The release of Visual Studio 2002 brought with it C# 1.0, a general-purpose, object-oriented
    language. It didn''t contain LINQ or generics, but it did offer:


    - Classes

    - Structs

    - Interfaces

    - Events

    - Properties

    - Delegates

    - Expressions


    Having a look at these features today, one would be spoiled with the features
    available in C# 8.0.


    ## C# version 2.0

    When Visual Studio 2005 was released in 2005, we saw some nice features, such
    as:


    - Generics

    - Partial classes

    - Anonymous methods

    - Nullable value types

    - Iterators

    - Covariance and contravariance


    Existing features were also improved, such as:


    - Getter/setter separate accessibility

    - Method group conversions (simply assigning the name of method to a delegate)

    - Static classes

    - Delegate inference


    ## C# version 3.0

    In the latter part of 2007, Visual Studio 2008 was released. The language features
    it provided came with the release of the .NET Framework 3.5. These were as follows:


    - Auto-implemented properties

    - Anonymous types

    - Query expressions (LINQ)

    - Lambda expressions

    - Expression trees

    - Extension methods

    - Implicitly typed local variables

    - Partial methods

    - Object and collection initializers


    LINQ was one of the killer features of C#. This allowed you to write SQL-style,
    declarative queries on collections, for example. Initially, I struggled with LINQ
    (and I''m not the only one). These days, it is just quicker and more concise to
    write. C# 3.0 was truly groundbreaking release.


    ## C# version 4.0

    Visual Studio 2010 brought C# 4.0. The features added in version 4.0 were:


    - Dynamic binding

    - Named/optional arguments

    - Generic covariant and contravariant

    - Embedded interop types


    For me, the introduction of optional parameters was a breath of fresh air, but
    it was the addition of the dynamic keyword in version 4.0 that stole the show.


    ## C# version 5.0

    C# 5.0 was released with Visual Studio 2012 and made another groundbreaking addition
    to the C# language—the introduction of async and await for asynchronous programming.
    C# 5.0 introduced:


    - Asynchronous members

