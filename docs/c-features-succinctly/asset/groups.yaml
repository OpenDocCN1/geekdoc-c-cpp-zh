  - "[PAGE 35]\n\nMethods return asynchronous streams have three properties:\n\n+\
    \   - They must be declared with the async modifier.\n- They return an IAsyncEnumerable<T>.\n\
    - They contain yield return statements to return successive elements in the asynchronous\
    \ stream.\n\nIt is worth noting that the stream elements are processed in the\
    \ captured context. To disable this, you need to use the TaskAsyncEnumerableExtensions.ConfigureAwait\
    \ extension method.\n\nFor more on this, see Microsoft Docs.\n\nTo illustrate\
    \ IAsyncEnumerable<T>, let us assume that you need to return some data from a\
    \ data store. It's great if you can get all data in a single call. You can perform\
    \ asynchronous calls to get the data, and return it to the calling code.\n\nThe\
    \ challenge, however, exists when you can't get all data at once. Sometimes the\
    \ data needs to be returned in pages as it becomes available.\n\nIt is here that\
    \ asynchronous streams shine. You can now send the data back to the calling code\
    \ as soon as data is available. To appreciate IAsyncEnumerable<T>, let's illustrate\
    \ the problem we are faced with by creating an asynchronous method that mimics\
    \ the behavior of getting data that is paged.\n\nConsider the following.\n\n>\
    \ Code Listing 37: Read a stream of data asynchronously\n\n```\nstatic async Task<IAsyncEnumerable<int>>\
    \ GetSomethingAsync()\n{\n    var iValues = new List<int>();\n    for (var i =\
    \ 0; i <= 10; i++)\n    {\n        await Task.Delay(1000);\n        iValues.Add(i);\n\
    \    }\n    return iValues;\n}\n```\n\nWhen you call this method, as shown in\
    \ Code Listing 38, the application will wait 10 seconds and display all the numbers\
    \ at once in the console window.\n\n> Code Listing 38: Iterate asynchronously\n\
    \n```\nforeach (var item in await GetSomethingAsync())\n{\n    Console.WriteLine(item);\n\
    }\n```"
  - "[PAGE 36]\n\nTo display the numbers on by one as they are generated, let's modify\
    \ the GetSomethingAsync method by changing the Task<IIEnumerable<int>> to IAsyncEnumerable<int>\
    \ and adding yield, as seen in Code List 39.\n\n# Code List 39: Using IAsyncEnumerable<T>\n\
    \n```\nstatic async IAsyncEnumerable<int> GetSomethingAsync()\n{\n    for (var\
    \ i = 0; i <= 10; i++)\n    {\n        yield return i;\n        await Task.Delay(1000);\n\
    \    }\n}\n```\n\nThe yield keyword performs a stateful iteration and returns\
    \ the values of a collection by one. To consume the asynchronous stream, the await\
    \ keyword before the foreach so that your code looks as illustrated in Code List\
    \ 40.\n\n# Code List 40: Consuming the asynchronous stream\n\n```\nawait foreach\
    \ (var item in GetSomethingAsync())\n{\n    Console.WriteLine(item);\n}\n```\n\
    \nRunning this code will display the numbers in the console window one by one,\
    \ as they are available.\n\n# Asynchronous disposable\n\nIf you have a .NET class\
    \ that uses unmanaged resources, then you should see the IDisposable interface\
    \ implemented in that class. This is to allow for the release of unmanaged resources\
    \ synchronously.\n\nIn C# 8.0 you can now do this asynchronously by using IAsyncDisposable.\
    \ This gives you a mechanism for performing resource-intensive dispose operations\
    \ without blocking the main UI thread.\n\nHaving a look at the IAsyncDisposable.DisposeAsync\
    \ method, see that it returns a ValueTask representing the asynchronous dispose\
    \ operation. You can see more on here.\n\nWhen you implement IAsyncDisposable\
    \ on an object in your application, you should call DisposeAsync when you are\
    \ finished using that object. A good practice is to put the code implementing\
    \ IAsyncDisposable in a using statement. This ensures that the code releasing\
    \ the resources will still do so in the event of an exception being thrown."
  - "[PAGE 37]\n\n# Indices and ranges\n\nIndices and ranges provide a better and\
    \ concise way, using bracket notation, to look at a single element from the start\
    \ or end of an array. They can also be used to look at a range inside of an array.\n\
    \n> Note: I use an array as an example here, but it can refer to any sequence\
    \ of elements.\n\nConsider the code illustrated in Code Listing 41. (Notice that\
    \ I am using static System.Console.)\n\nCode Listing 41: Reading months using\
    \ indices\n\n```\nstring[] months = {\n    \"January\"  // From Start   ^12\n\
    \    \"February\" // 0           ^11\n    \"March\"    // 2           ^10\n  \
    \  \"April\"    // 3           ^9\n    \"May\"      // 4           ^8\n    \"\
    June\"     // 5           ^7\n    \"July\"     // 6           ^6\n    \"August\"\
    \   // 7           ^5\n    \"September\" // 8          ^4\n    \"October\"  //\
    \ 9           ^3\n    \"November\" // 10          ^2\n    \"December\" // 11 \
    \         ^1\n}\n\nWriteLine(months[3]); // From array start\nWriteLine(months[^12]);\
    \ // From array end\n```\n\nWe know that C# is zero-based, meaning that the first\
    \ item in the array starts at 0. Have a look at the ^ operator (call it hat operator).\
    \ Quite controversially, this starts at ^1. The reason for this is that ^0 denotes\
    \ the length of the array. Consider the code illustrated in Code Listing 42.\n\
    \nCode Listing 42: Get items to the end of the array\n\n```\nvar slice = months[^4..^];\n\
    foreach (var s in slice) WriteLine(s);\n```\n\nIt reads as follows: the months,\
    \ starting from the fourth element from the end (^4) for the length (^0) of the\
    \ array. Therefore, ^0 is one past the end, and points to the very end of the\
    \ array.\n\nWe also see that the code in Code Listing 43 output the same element\
    \ in the array."
  - "[PAGE 38]\n\n# Code Listing 43: Using Length - 1 and ^1\n\n```\nWriteLine(months[months.Length\
    \ - 1]);\nWriteLine(months[^1]);\n```\n\nYou can also pull out a range of values,\
    \ as illustrated in Code Listing 44.\n\n# Code Listing 44: Find a range of values\n\
    \n```\nvar year = months[..];\nforeach (var s in year) WriteLine(s); // January\
    \ to December\n\nvar quarter = months[..3];\nforeach(var s in quarter) WriteLine(s);\
    \ // Quarter 1 - January to March\n\nvar restOfYear = months[3..];\nforeach(var\
    \ s in restOfYear) WriteLine(s); // April to December\n```\n\nLet's recap some\
    \ rules for indices:\n\n+   * Index 0 = months[0]\n* Index ^0 = months.Length\n\
    * Typing [n] is the same as months[months.Length - n] where n is any number.\n\
    * A range specifies the start and end of a range with the start of the range inclusive,\
    \ and the end of the range exclusive: Therefore:\n    * The range[..3] excludes\
    \ April.\n    * The range[3..] includes April.\n    * The range[0..^] represents\
    \ January to December.\n\nYou can assign variables, as illustrated in Code Listing\
    \ 45.\n\n# Code Listing 45: Assign variables to index and range\n\n```\nvar july\
    \ = ^6;\nWriteLine(months[july]); // July\n\nvar firstSemester = 0..6;\nvar semester\
    \ = months[firstSemester];\nforeach (var s in semester) WriteLine(s); // January\
    \ to June\n```\n\nAs noted earlier, ranges and indices work with any sequence\
    \ of elements. You can use them with string<T>, or ReadOnlySpan<T>."
  - "[PAGE 39]\n\n# Switch expressions\n\nI have always disliked using switch statements.\
