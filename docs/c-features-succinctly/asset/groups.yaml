    # # C# version 1.0


    The release of Visual Studio .NET 2002 brought with it C# 1.0, a Java-looking,
    general-purpose, object-oriented language. It didn''t contain LINQ or generics,
    but what did it offer developers a viable alternative to Java, on a Windows platform.


    C# 1.0 introduced the following:


    +   * Classes

    * Structs

    * Interfaces

    * Events

    * Properties

    * Delegates

    * Expressions

    * Statements

    * Attributes


    Having a look at these features today, one would be excused for feeling a little
    spoiled with the features available in C# 8.0.


    # # C# version 1.2


    Visual Studio .NET 2003 shipped with C# 1.2 and only contained a few small enhancements.
    It is here that code generated in **foreach** loops would call **Dispose** on
    an **IEnumerator** if it implemented **IDisposable**.


    # # C# version 2.0


    When Visual Studio 2005 was released in 2005, we saw some nice features, such
    as:


    +   * Generics

    * Partial classes

    * Anonymous methods

    * Nullable value types

    * Iterators

    * Covariance and contravariance


    Existing features were also improved, such as:


    +   * Getter/setter separate accessibility.'
  - '[PAGE 11]


    +   * Method group conversions (simply assigning the name of method to a delegate
    without using a new operator).

    * Static classes.

    * Delegate inference.


    In many respects, C# 2.0 was a turning point in the language, especially with
    the introduction of generics and iterators.


    # # C# version 3.0


    In the latter part of 2007, Visual Studio 2008 was released. The language features
    it provided came with the release of the .NET Framework 3.5. These were as follows:


    +   * Auto-implemented properties.

    * Anonymous types.

    * Query expressions (LINQ).

    * Lambda expressions.

    * Expression trees.

    * Extension methods.

    * Implicitly typed local variables.

    * Partial methods.

    * Object and collection initializers.


    LINQ was one of the killer features of C#. This allowed you to write SQL-style,
    declarative queries on collections, for example. Initially, I struggled with LINQ
    (and I''m not the only one). These days, it is just quicker and more concise to
    write. C# 3.0 was truly groundbreaking release.


    # # C# version 4.0


    Visual Studio 2010 brought C# 4.0. The features added in version 4.0 were:


    +   * Dynamic binding.

    * Named/optional arguments.

    * Generic covariant and contravariant.

    * Embedded interop types.


    For me, the introduction of optional parameters was a breath of fresh air, but
    it was the addition of the **dynamic** keyword in version 4.0 that stole the show.


    # # C# version 5.0


    C# version 5.0 was released with Visual Studio 2012 and made another groundbreaking
    addition to the C# language—the introduction of `async` and `await` for asynchronous
    programming. C# 5.0 introduced:


    +   * Asynchronous members'
- md: "\n- Caller info attributes\n\nAsynchrony was now baked into C# as a first-class\
    \ citizen.\n\n## C# version 6.0\n\nVisual Studio 2015 brought C# version 6.0,\
    \ and it is here that we started seeing smaller features that made developers\
    \ more productive. These included:\n\n- using static (no Console.this and Console.that).\n\
    - Read-only auto-properties.\n- Auto-property initializers.\n- Expression-bodied\
    \ function members.\n- Null-conditional operators.\n- String interpolation.\n\
    - Exception filters.\n- The nameof of expression.\n- await in Catch and Finally\
    \ blocks.\n\nI remember Mads Torgensen saying that C# 6.0 added a lot of syntactic\
    \ sugar to the language. I agree with him 100 percent.\n\n## C# version 7.0\n\n\
    Visual Studio 2017 saw C# version 7.0 released to the developer community. It\
    \ introduced the following language features:\n\n- out variables.\n- Tuples.\n\
    - Discards.\n- Pattern matching.\n- ref locals and returns.\n- Local functions.\n\
    - More expression-bodied members.\n- throw expressions.\n- Generalized async return\
    \ types.\n- Numeric literal syntax improvements.\n\nDevelopers could now write\
    \ cleaner code and be more productive.\n\n## C# version 7.1\n\nWith C# 7.0, we\
    \ started seeing point releases on C#, starting with version 7.1. This marked\
    \ an increased release cadence for C#. New language features for this release\
    \ were:\n\n- async Main method.\n- default literal expressions.\n- Inferred tuple\
    \ element names.\n- Pattern matching on generic type parameters.\n\nC# 7.1 also\
    \ added the language version selection configuration element, as well as new compiler\
    \ behavior.\n\n## C# version 7.2\n\nC# 7.2 added a few more smaller language features\
    \ to C#. These were:\n\n- The addition of code enhancements allowing developers\
    \ to write safe, efficient code:\n  - The in modifier on parameters.\n  - The\
    \ ref readonly on method returns.\n  - The readonly struct declaration.\n  - The\
    \ ref struct declaration.\n- Non-trailing arguments.\n- Leading underscores in\
    \ numeric literals.\n- private protected access modifier.\n- Conditional expressions.\n\
    \nYou can read more on writing safe and efficient code in C# here.\n\n## C# version\
    \ 7.3\n\nThe point releases of C# 7 allowed developers to get their hands onto\
    \ new language features sooner than later. It was the release of C# 7.3 that had\
    \ two main features. One allowed safe code to perform as performant code, and\
    \ the other provided additional improvements to existing features.\n\nFrom a better\
    \ performant code perspective, we saw:\n\n- The accessing of fields without pinning.\n\
    - Reassigning ref local variables.\n- The use of initializers on stackalloc arrays.\n\
    - Using fixed statements with any type that supports a pattern.\n- Additional\
    \ generic constraints (you will see this in action with the unmanaged constraint\
    \ later on in this book).\n\nFrom an enhancement perspective, we saw:\n\n- Being\
    \ able to compare tuple types with == and !=.\n- The use of expression variables\
    \ in more locations.\n- Attaching attributes to the backing field of auto-implemented\
    \ properties.\n- Improved method resolution when arguments by in.\n- Fewer ambiguous\
    \ cases for overload resolution.\n\nWe also saw new compiler options: -publicsign\
    \ to enable open-source software signing of assemblies, and -pathmap to provide\
    \ a mapping for source directories.\n\n## C# version 8.0\n\nC# 8.0 specifically\
    \ targets .NET Core. This is what this book is all about, and why I would imagine\
    \ you are reading it.\n\nThe following features and enhancements were added to\
    \ C# 8.0:\n\n- Readonly members.\n- Default interface methods.\n- Pattern matching\
    \ enhancements.\n- Using declarations.\n- Static local functions.\n- Disposable\
    \ ref structs.\n- Nullable reference types.\n- Asynchronous streams.\n- Indices\
    \ and ranges.\n- Null-coalescing assignment.\n- Unmanaged constructed types.\n\
    - Stackalloc in nested types.\n- Enhancements to interpolated verbatim strings\
    \ with C#\n\nThere is a lot to consume here. If you have little experience with\
    \ C#, the best place to start is C# 7. This book will take a look at C# 7 before\
    \ delving into the new features of C# 8.0.\n\nIf you are already comfortable with\
    \ C# 7, then dive straight into the chapter on C# 8.0. Are you ready?\n\n## Chapter\
    \ 2 C# 7 Features Recap\n\nTo appreciate what C# 8.0 has to offer developers,\
    \ it is important that we revisit some of the features available in C# 7. The\
    \ C# language has been evolving, but the incremental releases of C#, which bring\
    \ new features to the language, have been increasing in recent years.\n\n> Note:\
    \ Most of the code examples in this book are presented as instance methods rather\
    \ than static methods. If you wish to experiment with the examples, you may want\
    \ to decorate them with the static modifier so you can call them directly without\
    \ instantiating an object.\n\nPlease note that the public Demo used in some of\
    \ the code examples is the constructor for a class called Demo.\n\n## out variables\n\
    \nC# allows developers to use out variables. You might have used them before,\
    \ and they are quite handy in certain circumstances. One thing has always bothered\
    \ me, though (before C# 7 was released), was the need for creating a variable.\n\
    \nCode Listing 1: The out variable C# 7\n```csharp\npublic Demo() {\n    int numberOfCopies\
    \ = 0;\n    GetNumberOfCopies(out numberOfCopies);\n}\n\nprivate void GetNumberOfCopies(out\
    \ int numCopies) {\n    numberOfCopies = 20;\n}\n```\n\nHere is this (in my opinion)\
    \ ugly-looking code required to make use of a truly neat language feature in C#.\
    \ Along with C# 7 comes an improved syntax for out variables. Let's consider the\
    \ same code (in the constructor of the Demo class) and rewrite it slightly:\n\n\
    Code Listing 2: The out variable in C# 7\n```csharp\npublic Demo() {\n    GetNumberOfCopies(out\
    \ int numberOfCopies);\n}\nprivate void GetNumberOfCopies(out int numCopies) {\n\
    \    numCopies = 20;\n}\n```\n\nYou will notice that C# 7 allowed developers to\
    \ get rid of the unnecessary declaration `numberOfCopies = 0;` and declare the\
    \ out variable in the argument list. This results in much cleaner code and makes\
    \ the code easier to read. But C# 7 allows developers to go one step further.\
    \ If you have been following along in Visual Studio, you will see a green squiggly\
    \ line under the int in your argument list of the GetNumberOfCopies method.\n\n\
    > Note: If you do not see a code style suggestion, you may have suppressed this\
    \ style rule in an EditorConfig file or your style preferences. For more information\
    \ on style preferences, [this article](https://docs.microsoft.com/en-us/visualstudio/howto/csharp/code-style-preferences)\
    \ in Microsoft Docs.\n\nThis squiggly line is suggesting that you replace the\
    \ int with the var keyword, as seen in Code Listing 3.\n\nCode Listing 3: Replacing\
    \ the int with var\n```csharp\npublic Demo() {\n    GetNumberOfCopies(out var\
    \ numberOfCopies);\n}\nprivate void GetNumberOfCopies(out int numCopies) {\n \
    \   numCopies = 20;\n}\n```\n\nIf you think about it, this is perfectly logical.\
    \ The type of numberOfCopies is inferred from the type in the method signature\
    \ of the GetNumberOfCopies method. This syntax can be used for any out variable,\
    \ such as in TryParse.\n\nCode Listing 4: The out variable in TryParse\n```csharp\n\
    if (int.TryParse(\"3\", out var factor))\n```\n\nCode Listing 4 illustrates the\
    \ use of the out variable in TryParse. The benefit of using the improved syntax\
    \ for out variables is:\n\n- It improves code readability by declaring the out\
    \ variable only where you use it.\n- Because the declaration happens where you\
    \ use it, you do not need to assign an initial value.\n\nThe syntax change to\
    \ the out variable in C# 7 is one of the improved language features aimed at making\
    \ your code more readable and concise.\n\n## Discards\n\nIn the previous section,\
    \ we had a look at out variables. We saw that we can declare the out right where\
    \ we need it without having to assign an initial value. What if we don't care\
    \ about the value assigned to the out variable?\n\nC# now supports discards to\
    \ allow developers to indicate that they don't care for the variable. The discard\
    \ is a write-only variable, and is denoted by underscore _ in your assignment.\n\
    \nThink of the discard as an unassigned variable. It can be used in the following\
    \ situations:\n\n- When used as out parameters.\n- With the is and switch statements.\n\
    - As a standalone identifier.\n- During the deconstruction of tuples (more tuples\
    \ in the next section) or user-defined types.\n\nLet's have a look back at Code\
    \ Listing 4. If we want to check if the value parses to an integer value, we can\
    \ use a discard variable instead of declaring the variable factor, as shown in\
    \ Code Listing 5.\n\nCode Listing 5: Using a discard\n```csharp\nif (int.TryParse(\"\
    3\", out var _))\n{\n}\n```\n\nI like using extension methods. A favorite use\
    \ for extension methods is to check if a string value is an integer. Admittedly,\
    \ the extension method can do so much more than the simple example in Code Listing\
    \ 6. What I want to focus your attention on, however, is the use of the discard\
    \ variable here.\n"
