- md: "\n```csharp\nref struct StudentScores {\n    interface System.IDisposable\n\
    \      Provides a mechanism for releasing unmanaged resources.\n    'StudentScores':\
    \ ref structs cannot implement interfaces\n}\n```\n\nFigure 6: Compiler error\
    \ on ref struct\n\nThis leaves us in a bit of a predicament. What if we need to\
    \ perform some cleanup for our struct? In C# 8.0 we can now do that by adding\
    \ a publicly accessible void Dispose method, as seen in Code Listing 56.\n\nCode\
    \ Listing 56: A ref struct with a Dispose method\n\n```csharp\nref struct StudentScores\
    \ {\n    public void Dispose() {\n        // perform clean up\n    }\n}\n```\n\
    \nWe can use it in our code in a using declaration, as illustrated in Code Listing\
    \ 57.\n\nCode Listing 57: Using declaration for struct\n\n```csharp\nusing var\
    \ scores = new StudentScores();\n```\n\nYou can also use disposable ref structs\
    \ with readonly ref struct declarations.\n\n# Null-coalescing assignment\n\nC#\
    \ 8.0 also introduced the null-coalescing assignment operator: ??=. This operator\
    \ can now be used to assign the value of its right-hand operand to its left-hand\
    \ operand only in the event of the left-hand operand evaluating to null.\n\nHow\
    \ often have you seen code like the following?\n\nCode Listing 58: Checking for\
    \ null and assigning\n\n```csharp\nprivate void AddUpdateScores(List<int> lstScores)\
    \ {\n    if (lstScores == null) {\n        lstScores = new List<int>();\n    }\n\
    }\n// Add/Update scores\n}\n```\n\nIn C# 8.0 the null-coalescing assignment operator\
    \ makes this check almost negligible, as seen in Code Listing 59.\n\nCode Listing\
    \ 59: Checking for null using null-coalescing assignment\n\n```csharp\nprivate\
    \ void AddUpdateScores(List<int> lstScores)\n{\n    lstScores ?? new List<int>();\n\
    \    // Add/Update scores\n}\n```\n\nIf you read through the code too fast, you\
    \ might miss it. It's a small change, but it has a big impact. It is also important\
    \ to note that if the lstScores variable is not null; the assignment is simply\
    \ skipped.\n\n# Unmanaged constructed types\n\nUnmanaged types are not types defined\
    \ in unmanaged code. It is a type that is not a reference type, and does not contain\
    \ reference type fields at any level of nesting. Therefore, with C# 8.0, a constructed\
    \ value type is unmanaged if it contains fields of unmanaged types only.\n\nConsider\
    \ the code in Code Listing 60.\n\nCode Listing 60: A generic struct\n\n```csharp\n\
    public struct MyStruct<T>\n{\n    public T One;\n    public T Two;\n}\n```\n\n\
    In Code Listing 61, we have an extension method with the unmanaged constraint\
    \ on T.\n\nCode Listing 61: A generic extension method with an unmanaged constraint\n\
    \n```csharp\npublic unsafe static PropertyInfo[] GetProps<T>(this T obj) where\
    \ T : unmanaged\n{\n    var t = obj.GetType();\n    return t.GetProperties();\n\
    }\n```\n\nThis means that if we create our struct as illustrated in Code Listing\
    \ 62, we can call the extension method on the instance of that struct because\
    \ it is an unmanaged constructed type.\n\n# Code Listing 62: Calling the extension\
    \ method\n\n```csharp\nvar mystruct = new MyStruct<int> { One = 1, Two = 2 };\n\
    var props = mystruct.GetProps();\n```\n\nThis is because int is an unmanaged type.\
    \ If we had to use string, then we would no longer have an unmanaged constructed\
    \ type, because string is not an unmanaged type, and mystruct2 would violate the\
    \ unmanaged constraint on the extension method.\n\n```csharp\nvar mystruct2 =\
    \ new MyStruct<string> { One = \"One\", Two = \"Two\" };\nmystruct2;\n```\n\n\
    ![](img/49b3596025ccb7ecebab509ce03bfac6_47_0.png)\n\nFigure 7: Not-unmanaged\
    \ constructed type\n\nThe following types are unmanaged types:\n\n- sbyte, byte,\
    \ short, ushort, int, uint, long, char, float, double, decimal, or bool.\n- Any\
    \ enum type.\n- Any pointer type.\n- Any user-defined struct containing only unmanaged\
    \ type fields and is not a constructed type pre-C#7.3.\n\nC# 7.3 introduced the\
    \ unmanaged constraint, as seen in the extension method in Code Listing 61. This\
    \ means we can use the unmanaged constraint directly in the definition of the\
    \ generic struct, as seen in Code Listing 63.\n\n# Code Listing 63: The unmanaged\
    \ constraint on the generic struct\n\n```csharp\npublic struct MyStruct<T> where\
    \ T : unmanaged\n{\n    public T One;\n    public T Two;\n}\n```\n\nThis would\
    \ generate a compiler error, as seen in Figure 8, because the creation of mystruct2\
    \ violates the unmanaged constraint on the generic struct definition.\n\n```csharp\n\
    var mystruct = new MyStruct<int> { One = 1, Two = 2 };\nvar props = mystruct.GetProps();\n\
    var mystruct2 = new MyStruct<string> { One = \"One\", Two = \"Two\" };\n```\n\n\
    Figure 8: The MyStruct<string> violates the constraint\n\nWe can see that a generic\
    \ struct can be the source of both unmanaged and unwanted constructed types. Where\
    \ to place the constraint is up to you and what you need to achieve.\n\n# Enhancement\
    \ of interpolated strings\n\nIn C# 8.0 the $ and @ tokens used with interpolated\
    \ strings can be either $\"\" or $@ \"\". both are now valid interpolated strings.\
    \ Before C# 8.0, the $ token had to appear before the @ token. This means var\
    \ msg = $@\"{studentName}\"; will produce the exact same output as var msg = $\"\
    {studentName}\"; in the console window.\n\n# Enabling C# 8 in any .NET project\n\
    \nIt is possible to enable C# 8.0 in any .NET project. There are a few templates,\
    \ but I will get to those in a minute. To see this in action, create a .NET console\
    \ application using the .NET Framework, as seen in Figure 9.\n\n![](img/49b3596025ccb7ecebab509ce03bfac6_49_0.png)\n\
    \nWhen this project is created, the shape classes in Code Listing 64 are the same\
    \ classes we used earlier in the book, but I'm presenting them here for convenience.\n\
    \nCode Listing 64: Shape classes\n\n```csharp\npublic class Cylinder {\n    public\
    \ double Length { get; }\n    public double Radius { get; }\n\n    public Cylinder(double\
    \ length, double radius) {\n        Length = length;\n        Radius = radius;\n\
    \    }\n}\n\npublic class Sphere {\n    public double Radius { get; }\n\n    public\
    \ Sphere(double radius) {\n        Radius = radius;\n    }\n}\n\npublic class\
    \ Pyramid {\n    public double BaseLength { get; }\n    public double BaseWidth\
    \ { get; }\n    public double Height { get; }\n\n    public Pyramid(double baseLength,\
    \ double baseWidth, double height) {\n        BaseLength = baseLength;\n     \
    \   BaseWidth = baseWidth;\n        Height = height;\n    }\n}\n```\n\nLet's add\
    \ our TotalObjectVolume method to our project that uses a static local function,\
    \ also uses a switch expression. The code is illustrated in Listing 65.\n\nCode\
    \ Listing 65: A static local function using a switch expression\n\n```csharp\n\
    private double TotalObjectVolume((Cylinder c, Sphere s, Pyramid p) volumeShapes)\n\
    {\n    var cylinderVol = CalculateVolume(c);\n    var sphereVol = CalculateVolume(s);\n\
    \    var pyramidVol = CalculateVolume(p);\n\n    return Math.Round(cylinderVol\
    \ + sphereVol + pyramidVol, 2);\n\n    // static local functions\n    static double\
    \ CalculateVolume<T>(T volumeShape)\n    {\n        return volumeShape switch\n\
    \        {\n            Sphere s when s.Radius == 0 => 0,\n            Cylinder\
    \ c => Math.PI * Math.Pow(c.Radius, 2) * c.Length,\n            Sphere s => 4\
    \ * Math.PI * Math.Pow(s.Radius, 3) / 3,\n            Pyramid p => p.BaseLength\
    \ * p.BaseWidth * p.Height / 3,\n            _ => throw new ArgumentException(\"\
    Unrecognized object\", nameof(volumeShape)),\n        };\n    }\n}\n```\n\nAt\
    \ this point, you will see a bunch of compiler errors in your static local function.\
    \ The compiler errors will likely tell you that you are trying to use C# 8.0 language\
    \ features in an earlier version of C# (probably C# 7.3, depending on the .NET\
    \ Framework you are using).\n\nTo use C# 8.0 in your console application using\
    \ the .NET Framework (.NET Core—remember, we created a console app using the .NET\
    \ Framework), you may need to modify your .csproj file as seen in own 66.\n\n\
    Change the <LangVersion> to 8.0 in your .csproj file. If there isn't a <LangVersion>,\
    \ just add one.\n\nCode Listing 66: Add LangVersion to .csproj\n```xml\n<PropertyGroup>\n\
    \  <Configuration Condition=\"$(Configuration)=='Debug'\">\n  <Platform Condition=\"\
    $(Platform)=='Any CPU'\">AnyCPU</Platform>\n  <ProjectGuid>E16C86C3-D5C2-4D68-B34E-B1D06277DB9</ProjectGuid>\n\
    \  <OutputType>Exe</OutputType>\n  <RootNamespace>NetFxConsole</RootNamespace>\n\
    \  <AssemblyName>NetFxConsoleApp</AssemblyName>\n  <TargetFrameworkVersion>v4.7.2</TargetFrameworkVersion>\n\
    \  <LangVersion>8.0</LangVersion>\n  <FileAlignment>512</FileAlignment>\n  <AutoGenerateBindingRedirects>true</AutoGenerateBindingRedirects>\n\
    \  <Deterministic>true</Deterministic>\n</PropertyGroup>\n```\n\nSave your .csproj\
    \ file and reload your project if needed. That's all there is to it. There are\
    \ some provisos to this, though.\n\n# Not all types are included\n\nSome types,\
    \ like IEnumerable, are not included. There is a workaround, though—you can install\
    \ the Microsoft.Bcl.AsyncInterfaces and Microsoft.Bcl.HashCode NuGet packages.\n\
    \n# Indexes and ranges\n\nBy using C# 8.0 in-.NET Core 3 or non-.NET Standard\
    \ 2.1 projects, you will not be able to use indexes and ranges because these are\
    \ runtime features, and your code will simply not compile.\n"
