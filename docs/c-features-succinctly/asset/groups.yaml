    Taking logical patterns further, we can now get rid of unwieldy double parentheses
    for **if conditions**. Consider the code in Code Listing 75.


    # Code Listing 75: Standard if not condition


    ```

    if (!shape is Circle)) { }

    ```


    We can now replace this with the code in Code Listing 76.


    # Code Listing 76: New if not condition using a logical pattern


    ```

    if (shape is not Circle) { }

    ```


    If a shape can be a **Circle** or a **Square**, we can do the following:


    # Code Listing 77: Logical or pattern


    ```

    if (shape is Circle or Square) { }

    ```


    This will give developers a fantastic way to express the intent of their code
    clearly and succinctly.


    # Target-typed new expressions


    In C# 9.0, whenever you wrote a **new** expression in C#, you were required to
    specify the type. The only exception was implicitly typed arrays, where you would
    create the following array:


    # Code Listing 78: Implicitly typed array


    ```

    var planets = new[] { "Mars", "Saturn", "Jupiter" };

    ```


    In C# 9.0, you will be allowed to omit the type when it''s clear what the expression
    is being assigned to. Consider the following code.


    # Code Listing 79: The new expression for creating a Circle


    ```

    Circle c = new Circle(5);

    ```


    In C# 9.0, this code can simply be written as follows.'
- md: "\n# Code Listing 80: The target-typed new expression\n\n```sharp\nCircle c\
    \ = new (5);\n```\n\nThis code looks nearer and conveys exactly what it should.\
    \ I do, however, think that those of us using var will probably not use target-typed\
    \ new expressions too often.\n\n# Init-only properties\n\nC# allows developers\
    \ to use object initialization, which is a very convenient and flexible way of\
    \ creating a new object. Consider the SalesOrder class in Code Listing 81. It\
    \ currently uses auto-property for OrderNumber.\n\n# Code Listing 81: The SalesOrder\
    \ class\n\n```csharp\npublic class SalesOrder\n{\n    public string OrderNumber\
    \ { get; set; }\n}\n```\n\nOne limitation is that the properties have to be mutable\
    \ object initializers to work. The object's default, parameterless constructor\
    \ is called, and then the property is assigned. But you can set the property to\
    \ a different value after initialization because it is mutable, as seen in Code\
    \ Listing 82.\n\n# Code Listing 82: Initializing the SalesOrder class\n\n```csharp\n\
    var salesOrder = new SalesOrder\n{\n    OrderNumber = \"123\"\n}\nsalesOrder.OrderNumber\
    \ = \"345\";\n```\n\nWith init-only properties, this mutability is fixed. The\
    \ init accessor is a variant of the set accessor, which can only be called during\
    \ object initialization. If you modify your property to use init, as seen in Code\
    \ Listing 83, then any subsequent assignments to the OrderNumber property will\
    \ result in a compile-time error.\n\n# Code Listing 83: Setting init-only property\
    \ on SalesOrder class\n\n```csharp\npublic class SalesOrder\n{\n    public string\
    \ OrderNumber { get; init; }\n}\n```\n\nVisual Studio will tell you that your\
    \ assignment after object initialization is not allowed.\n\n```csharp\nvar salesOrder\
    \ = new SalesOrder\n{\n    OrderNumber = \"123\"\n}\nsalesOrder.OrderNumber =\
    \ \"345\";\n```\n\nFigure 11: Subsequent assignment results in a compile-time\
    \ error\n\nThis is because the OrderNumber property is not mutable.\n\n# Init\
    \ accessors and readonly fields\n\nConsider the same SalesOrder we had a look\
    \ at earlier. Modifying it as illustrated in Code Listing 84, you will notice\
    \ the following.\n\n```csharp\npublic class SalesOrder\n{\n    private readonly\
    \ string orderNumber;\n    public string OrderNumber\n    {\n        get => orderNumber;\n\
    \        init => orderNumber = (value ?? throw new ArgumentNullException(nameof(OrderNumber)));\n\
    \    }\n}\n```\n\nThis is possible because init accessors can only be called during\
    \ initialization. This means that they can mutate readonly fields in the enclosing\
    \ class.\n\n# Records\n\nIn the previous code listings, we saw that we can make\
    \ individual properties immutable by using the init accessor. As seen in Code\
    \ Listing 85, we can make the whole SalesOrder class become immutable and behave\
    \ like a value by adding the data keyword.\n\nCode Listing 85: Creating a record\n\
    \n```csharp\npublic data class SalesOrder\n{\n    public string OrderNumber {\
    \ get; init; }\n}\n```\n\nAdding the data keyword to the class declaration marks\
    \ the class as a record. This means records are seen more as values, and less\
    \ as objects—they don't have a mutable encapsulated state. To represent any change\
    \ over time, you must create a new record that represents the new state, meaning\
    \ they are defined by their contents.\n\n# More C# 9.0 goodies\n\nThese are only\
    \ some of the planned features for C# 9.0. While I know a lot could change its\
    \ release, the code illustrated in the previous examples gives us a nice glimpse\
    \ of where the C# team is headed. If you want to keep up to date on what is happening\
    \ around C# 9.0, swing over to the Language Feature Status page on GitHub. This\
    \ allows you to see planned C# 9.0 features and their current states.\n\n# Chapter\
    \ 5 .NET Productivity Features in Visual Studio\n\nThere are a variety of nice\
    \ productivity features in Visual Studio that can enhance your workflow and make\
    \ your day-to-day tasks easier. Currently, I am using Visual Studio 2019 version\
    \ 16.7 preview 5.0, but some of these features are also available in the current\
    \ release of Visual Studio 2019.\n\n## Developer PowerShell inside Visual Studio\n\
    \nIn Visual Studio, if you press Ctrl+`, you will open the Visual Studio terminal.\n\
    \n> Tip: The ` backtick is located on the same key as ~. It is also the same keystroke\
    \ used in Visual Studio Code. This makes Ctrl+` very convenient, one-handed keystroke\
    \ used to open the terminal inside Visual Studio.\n\nLaunching the terminal opens\
