    # Chapter 1 The History of C#


    C# is continuing to evolve and improve with each major release of the language.
    As the C# team is innovating and adding features to C#, its members share their
    thought process around the design of C# with the community.


    If you head over the dotnet/Roslyn repository on GitHub, you will see detailed
    language feature statuses as well as features that the C# team is considering
    for upcoming releases. You can also view a history C# on the Microsoft Docs. As
    of this writing, in particular interest are the planned features surrounding C#
    9. Later in this book, we will have a look at what is planned for C# 9.


    The C# build will default the language version to the latest major release. As
    of C# 7.0, however, developers started seeing more point releases in the form
    of versions C# 7.1, C# 7.2, and C# 7.3.


    # C# language version


    When creating a new project in Visual Studio, the C# compiler figures out which
    version of C# to use based on the target framework of your project. This ensures
    you do not use a language version that requires runtime or behavior not available
    in the target framework of the project.


    It is worth mentioning that C# 8.0 and higher will only be supported on .NET Core
    3.x and later. Table 1 outlines the C# language defaults based on the target framework.


    Table 1: Language version default mapping


    | Target framework | Version | C# language default |

    | .NET Core | 3.x | C# 8.0 |

    | .NET Core | 2.x | C# 7.3 |

    | .NET Standard | 2.1 | C# 8.0 |

    | .NET Standard | 2.0 | C# 7.3 |

    | .NET Standard | 1.x | C# 7.3 |

    | .NET Framework | All | C# 7.3 |


    As you will see later in this book, you can override the default language version.
    You can do this by:


    +   - Manually editing your .csproj file (explained later).'
