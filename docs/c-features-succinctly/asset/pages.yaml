- img_proc: true
  md: "# Code Listing 2: The out variable in C#7\n\n```\npublic Demo()\n{\n    GetNumberOfCopies(out\
    \ int numberOfCopies);\n}\nprivate void GetNumberOfOfCopies(out int numCopies)\n\
    {\n    numCopies = 20;\n}\n```\n\nYou will notice that C# 7 allowed developers\
    \ to get rid of the unnecessary declaration int numberOfCopies = 0; and declare\
    \ the out variable in the argument list of the GetNumberOfOfCopies method.\n\n\
    This results in much cleaner code and makes the code easier to read. But C# 7\
    \ allows developers to go one step further. If you have been following along in\
    \ Visual Studio, you will see a green squiggly line under the int in your argument\
    \ list of the GetNumberOfOfCopies method\n\n> Note: If you do not see a code style\
    \ suggestion, you may have suppressed this code style rule in an EditorConfig\
    \ file or your style preferences. For more information on code style preferences,\
    \ [this article](https://docs.microsoft.com/en-us/visualstudio/howto/csharp/code-style-preferences)\
    \ in Microsoft Docs.\n\nThis squiggly line is suggesting that you replace the\
    \ int with the var keyword, as seen in Code Listing 3.\n\n# Code Listing 3: Replacing\
    \ the int with var\n\n```\npublic Demo()\n{\n    GetNumberOfCopies(out var numberOfCopies);\n\
    }\nprivate void GetNumberOfOfCopies(out int numCopies)\n{\n    numCopies = 20;\n\
    }\n```\n\nIf you think about it, this is perfectly logical. The type of numberOfCopies\
    \ is inferred from the type in the method signature of the GetNumberOfOfCopies\
    \ method. This syntax can be used for any out variable, such as in a TryParse.\n\
    \n# Code Listing 4: The out variable in a TryParse\n\n```\nif (int.TryParse(\"\
    3\", out var factor))\n```"
