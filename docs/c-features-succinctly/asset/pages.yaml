- img_proc: true
  md: '# Code Listing 9: Tuple field names inferred


    ```

    var distanceToEarth = 384400;

    var radius = 1737.1;

    var moon = (distanceToEarth, radius);


    Console.WriteLine($"The moon is {moon.distanceToEarth} km from Earth.");

    Console.WriteLine($"The moon has a radius of {moon.radius}\");"

    ```


    The field names are therefore inferred, so it''s probably a good idea to think
    about them arbitrarily naming variables. For example, if distanceToEarth was simply
    named distance, then the tuple would read as moon.distance, which somewhat obfuscates
    the intent.


    # Tuple equality


    Tuple types also have support for == and != operators. This means that in the
    code in Listing 10 will equate to true.


    # Code Listing 10: Comparing tuples


    ```

    var teamOne = (JohnScore: 15, MikeScore: 27);

    var teamTwo = (SallyScore: 15, MelissaScore: 27);


    Console.WriteLine(teamOne == teamTwo); // Equates to true

    ```


    You can only compare tuples when:


    +   - Each tuple has the same number of elements. TeamOne had an additional score,
    Visual Studio would tell you that the tuple types must have matching cardinalities.

    - For every tuple position, the elements from the left-hand and right-hand tuple
