  md: '# The Story Behind the Succinctly Series of Books


    Daniel Jebaraaj, Vice President

    Syncfusion, Inc.


    Staying on the cutting edge

    As many of you know, Syncfusion is a provider of software components for the

    Microsoft platform. This puts us in the exciting but challenging position of always

    being on the cutting edge.


    Whenever platforms or tools are shipping out of Microsoft, which seems to be about

    eother week these days, we have to educate ourselves, quickly.


    # Information is plentiful but harder to digest


    In reality, this translates to a lot of book orders, book searches, and Twitter
    scans.


    While more information is becoming available on the internet and more more books
    are

    published, even on topics that are relatively new, one aspect that continues to
    inhibit us

    the inability to find concise technology overview books.


    We are usually faced with two options: read several 500+ page books or scour the
    web for

    relevant blog posts and other articles. Just as everyone who has a job to do and
    customers

    serve, we find this quite frustrating.


    # The Succinctly series


    This frustration translated into a deep desire to produce a series of concise
    technical books that

    would be targeted at developers working on the Microsoft platform.


    We firmly believe, given the background knowledge which developers have, that
    most topics can

    be translated into books that are between 50 and 100 pages.


    This is exactly what we resolved to accomplish with the Succinctly series. Isn''t
    everything

    wonderful born out of a deep desire to change things for the better?


    # The best authors, the best content


    Each author was carefully chosen from a pool of talented experts who shared our
    vision.

    Thebook you now hold in your hands, and the others available in this series, are
    a result of the

    authors'' tireless work. You will find original content that is guaranteed to
    get you up and running

    in about the time it takes to drink a few cups of coffee.'
