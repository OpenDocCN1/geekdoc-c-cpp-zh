  md: "+   - Inferred tuple element names.\n- Pattern matching on generic type parameters.\n\
    \nC# 7.1 also added the language version selection configuration element, as well\
    \ as new compiler behavior.\n\n# C# version 7.2\n\nC# 7.2 added a few more smaller\
    \ language features to C#. These were:\n\n+   - The addition of code enhancements\
    \ allowing developers to write safe, efficient code:\n  - The in modifier on parameters.\n\
    \  - The ref readonly on method returns.\n  - The readonly struct declaration.\n\
    \  - The ref struct declaration.\n- Non-trailing arguments.\n- Leading underscores\
    \ in numeric literals.\n- private protected access modifier.\n- Conditional expressions.\n\
    \nYou can read more on writing safe and efficient code in C# here.\n\n# C# version\
    \ 7.3\n\nThe point releases of C# 7 allowed developers to get their hands onto\
    \ new language features sooner rather than later. It was the release of C# 7.3\
    \ that had two main features. One allowed safe code to perform as performant code,\
    \ and the other provided additional improvements to existing features.\n\nFrom\
    \ a better performant code perspective, we saw:\n\n+   - The accessing of fields\
    \ without pinning.\n- Reassigning ref local variables.\n- The use of initializers\
    \ on stackalloc arrays.\n- Using fixed statements with any type that supports\
    \ a pattern.\n- Additional generic constraints (you will see this in action with\
    \ the unmanaged constraint later on in this book).\n\nFrom an enhancement perspective,\
    \ we saw:\n\n+   - Being able to compare tuple types with == and !=.\n- The use\
    \ of expression variables in more locations.\n- Attaching attributes to the backing\
    \ field of auto-implemented properties.\n- Improved method resolution when arguments\
    \ by in.\n- Fewer ambiguous cases for overload resolution.\n\nWe also saw new\
    \ compiler options: -publicsign to enable open-source software signing of assemblies,\
    \ and -pathmap to provide a mapping for source directories."
