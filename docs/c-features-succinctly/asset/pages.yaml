  md: "# Chapter 2 C# 7 Features Recap\n\nTo appreciate what C# 8.0 has to offer developers,\
    \ it is important that we revisit some of the features available in C# 7. The\
    \ C# language has been evolving, but it feels like the incremental releases of\
    \ C#, which bring new features to the language, have been increasing in recent\
    \ years.\n\n> Note: Most of the code examples in this ebook are presented as instance\
    \ methods rather than static methods. If you wish to experiment with the example\
    \ methods, you may want to decorate the examples with the static modifier so you\
    \ can call them directly as placing them inside a class definition, instantiating\
    \ an object instance, and then calling the method.\n\nPlease note that the public\
    \ Demo used in some of the code examples is the constructor for a class called\
    \ Demo. I encourage you to download the code for this book from GitHub.\n\n# out\
    \ variables\n\nC# allows developers to use out variables. You might have used\
    \ them before, and they are quite handy in certain circumstances. One thing that\
    \ has always bugged me, though (before C# 7 was released), was the need for creating\
    \ a 'loose-hanging' variable. Consider Code Listing 1. The declaration of the\
    \ numberOfOfCopies variable in the constructor of the Demo class was necessary\
    \ in order to use out variables in C#.\n\nCode Listing 1: The out variable C#\
    \ 7\n\n```\npublic Demo() {\n    int numberOfOfCopies = 0;\n    GetNumberOfCopies(out\
    \ numberOfOfCopies);\n}\n\nprivate void GetNumberOfCopies(out int numCopies) {\n\
    \    numCopies = 20;\n}\n```\n\nHere is this (in my opinion) ugly-looking code\
    \ required to make use of a truly neat language feature in C#. Along comes C#\
    \ 7, and shakes up a little with an improved syntax for out variables. Let's consider\
    \ the same code (in the constructor of the Demo class) from Code Listing 1, and\
    \ rewrite it slightly:"
  merge: -1
