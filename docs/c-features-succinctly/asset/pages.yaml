    # Enhancement of interpolated verbatim strings


    In C# 8.0 the $ and @ tokens used with interpolated strings can be either $@@"$
    or $@@".\.", and both are now valid interpolated verbatim strings. Before C# 8.0,
    the $ token had to appear before the @ token.


    This means var msg = = $@"The \t student is {studentName}"; will produce the exact
    same output as var msg = $@"The \t student is {studentName}";; in the console
    window.


