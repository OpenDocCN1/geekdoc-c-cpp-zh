    \ data store. It's great if you can get all data in a single call. You can perform\
    \ asynchronous calls to get the data, and return it to the calling code.\n\nThe\
    \ challenge, however, exists when you can't get all data at once. Sometimes the\
    \ data needs to be returned in pages as it becomes available.\n\nIt is here that\
    \ asynchronous streams shine. You can now send the data back to the calling code\
    \ as soon as data is available. To appreciate IAsyncEnumerable<T>, let's illustrate\
    \ the problem we are faced with by creating an asynchronous method that mimics\
    \ the behavior of getting data that is paged.\n\nConsider the following.\n\n>\
    \ Code Listing 37: Read a stream of data asynchronously\n\n```\nstatic async Task<IAsyncEnumerable<int>>\
    \ GetSomethingAsync()\n{\n    var iValues = new List<int>();\n    for (var i =\
    \ 0; i <= 10; i++)\n    {\n        await Task.Delay(1000);\n        iValues.Add(i);\n\
    \    }\n    return iValues;\n}\n```\n\nWhen you call this method, as shown in\
    \ Code Listing 38, the application will wait 10 seconds and display all the numbers\
    \ at once in the console window.\n\n> Code Listing 38: Iterate asynchronously\n\
    \n```\nforeach (var item in await GetSomethingAsync())\n{\n    Console.WriteLine(item);\n\
    }\n```"
