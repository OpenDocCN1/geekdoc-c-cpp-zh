  md: 'Code Listing 4 illustrates the use of the out variable in a TryParse. The benefit
    of using the improved syntax for out variables is:


    +   - It improves code readability by declaring the out variable only where you
    use it.

    - Because the declaration happens where you use it, you do not need to assign
    an initial value.


    The syntax change to the out variable in C# 7 is one of the improved language
    features aimed at making your code more readable and concise.


    # Discards


    In the previous section, we had a look at out variables. We saw that we can declare
    the out right where we need it, without having to assign an initial value. What
    if we don''t care about the value assigned to the out variable?


    C# now supports discards to allow developers to indicate that they don''t care
    for the variable. The discard is a write-only variable, and is denoted by underscore
    _ in your assignment.


    Think of the discard as an unassigned variable. It can be used in the following
    situations:


    +   - When used as out parameters.

    - With the is and switch statements.

    - As a standalone identifier.

    - During the deconstruction of tuples (more tuples in the next section) or user-defined
    types.


    Let''s have a look back at Code Listing 4. All if we want to check if the value
    parses to an integer value, we can use a discard variable instead of declaring
    the variable factor, as shown in Code Listing 5.


    > Code Listing 5: Using a discard


    ```

    if (int.TryParse("3", out var _))

    {

    }


    ```


    I like using extension methods. A favorite use for extension methods is to check
    if a string value is an integer. Admittedly, the extension method can do so much
    more than the simple example in Code Listing 6. What I want to focus your attention
    on, however, is the use of the discard variable here.'
  merge: -1
