  md: "# Using Directory.Build.props\n\nIf you want each project in your solution\
    \ to target C# 8.0, or if you need to add any custom property to all your projects,\
    \ you can create a file called Directory.Build.props in the root of your solution\
    \ and add the <LangVersion> in there.\n\nThis is illustrated in Code Listing 67.\n\
    \nCode Listing 67: The Directory.Build.props file\n\n```\n<Project>\n  <PropertyGroup>\n\
    \    <LangVersion>8.0</LangVersion>\n  </PropertyGroup>\n</Project>\n```\n\nI\
    \ am not sure that I would necessarily enable C# 8.0 on any .NET project. I would\
    \ probably take the time to create a .NET Core application from the get-go, but\
    \ this solution isn't without its merits. This could be useful in situations where\
    \ you are dealing with an existing .NET project that has had a lot of development\
    \ effort invested, and that can't be easily rewritten from scratch in .NET Core.\n\
    \nIn this situation, jimmying the .csproj file to enable C# 8.0 makes sense."
