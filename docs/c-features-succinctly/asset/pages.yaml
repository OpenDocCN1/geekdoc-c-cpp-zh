  md: '# C# version 8.0


    C# 8.0 specifically targets .NET Core. This is what this book is all about, and
    why I would imagine you are reading it.


    The following features and enhancements were added to C# 8.0:


    +   - Readonly members.

    - Default interface methods.

    - Pattern matching enhancements.

    - Using declarations.

    - Static local functions.

    - Disposable ref structs.

    - Nullable reference types.

    - Asynchronous streams.

    - Indices and ranges.

    - Null-coalescing assignment.

    - Unmanaged constructed types.

    - Stackalloc in nested types.

    - Enhancements to interpolated verbatim strings with C#


    There is a lot to consume here. If you have little experience with C#, the best
    place to start is C# 7. This book will take a look at C# 7 before delving into
    the new features of C# 8.0.


    If you are already comfortable with C# 7, then dive straight into the chapter
    on C# 8.0. Are you ready? Let''s go.'
