  md: "# Code Listing 43: Using Length - 1 and ^1\n\n```\nWriteLine(months[months.Length\
    \ - 1]);\nWriteLine(months[^1]);\n```\n\nYou can also pull out a range of values,\
    \ as illustrated in Code Listing 44.\n\n# Code Listing 44: Find a range of values\n\
    \n```\nvar year = months[..];\nforeach (var s in year) WriteLine(s); // January\
    \ to December\n\nvar quarter = months[..3];\nforeach(var s in quarter) WriteLine(s);\
    \ // Quarter 1 - January to March\n\nvar restOfYear = months[3..];\nforeach(var\
    \ s in restOfYear) WriteLine(s); // April to December\n```\n\nLet's recap some\
    \ rules for indices:\n\n+   * Index 0 = months[0]\n* Index ^0 = months.Length\n\
    * Typing [n] is the same as months[months.Length - n] where n is any number.\n\
    * A range specifies the start and end of a range with the start of the range inclusive,\
    \ and the end of the range exclusive: Therefore:\n    * The range[..3] excludes\
    \ April.\n    * The range[3..] includes April.\n    * The range[0..^] represents\
    \ January to December.\n\nYou can assign variables, as illustrated in Code Listing\
    \ 45.\n\n# Code Listing 45: Assign variables to index and range\n\n```\nvar july\
    \ = ^6;\nWriteLine(months[july]); // July\n\nvar firstSemester = 0..6;\nvar semester\
    \ = months[firstSemester];\nforeach (var s in semester) WriteLine(s); // January\
    \ to June\n```\n\nAs noted earlier, ranges and indices work with any sequence\
    \ of elements. You can use them with string<T>, or ReadOnlySpan<T>."
