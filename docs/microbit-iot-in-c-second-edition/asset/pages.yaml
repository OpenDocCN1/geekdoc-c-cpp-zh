- pgno: 182
  md: 'Notice that USBTX and USBRX give the GPIO pins to use to connect to the USB
    port in the case of the V1 and MICROBIT_PIN_UART_TX MICROBIT_PIN_UART_RX in the
    case of the V2.


    For the rest of this chapter we will use the uBit serial property because this
    is by far the most common way of working. The constructor for the MicroBitSerial
    object takes the pins to be used. Tx and Rx, as the parameters tx and rx:


    ```

    MicroBitSerial(PinName tx, PinName rx);

    ```


    The default MicroBitSerial object created by the uBit object is set up by the
    constructor with USB pins. There is also a version of the constructor that lets
    you set the size:


    ```

    MicroBitSerial( PinName tx, PinName rx, uint8_t rxBufferSize)

    ```


    and also one to set the size of the Tx and Rx buffers separately:


    ```

    MicroBitSerial( PinName tx, rx,

    uint8_t rxBufferSize,

    uint8_t txBufferSize)

    ```


    You can mostly ignore the buffer size, for the moment at least, and simply use
    the default.


    Once you have a MicroBitSerial object you can set its baud rate using:

    aud( int baudrate)


    for V1:

    setBaudrate( int baudrate)


    for V2

    This is currently the only setting you can change using the high-level micro:bit
    framework. Currently there is no easy way of changing the configuration of the
    V2 serial port, but you can use a method inherited from deep down in the mbed
    framework to modify the V1 serial configuration:

    void SerialBase::format(int bits, Parity parity, int stop_bits)


    where Parity is one:


    ```

    enum Parity {

    None = 0,

    Odd,

    Even,

    Forced1,

    Forced0

    };

    ```'
  merge: -1
  img_proc: true
- pgno: 183
  md: 'For example, to set two stop bits you might use (V1 only):


    ```

    uBit.init();

    uBit.serial.format(8,mbed::RawSerial::None,2);

    uBit.serial.baud(115200);

    uBit.serial.send("A\r\n");

    ```


    The only problem with format is that there is no guarantee that it will not interact
    with the rest of the framework in some unexpected way, although it doesn''t seem
    to.


    The final configuration function is very important if you want to communicate
    with anything other than the USB connection by MicroBit object:


    ```

    int redirect(PinName tx, PinName rx)

    ```


    This changes the Tx and Rx pins to whatever you specify.


    The rest of the configuration seems to transfer to the new pins as well. So, for
    example, to send something on physical Pin 1 on the edge connector and receive
    on Pin 2, you would use on the V1:


    ```

    #include "MicroBit.h"

    MicroBit uBit;


    int main() {

    {

    nuBit.init();

    uBit.serial.format(8,mbed::RawSerial::None,2);

    uBit.serial.baud(115200);

    uBit.serial.redirect(MICROBIT_PIN_P1, MICROBIT_PIN_P2);

    uBit.serial.send("A\r\n");

    }

    ```


    and on the V2:


    ```

    #include "MicroBit.h"

    MicroBit uBit;


    int main() {

    {

    uBit.init();

    uBit.serial.setBaudrate(115200);

    uBit.serial.redirect(uBit.io.P1 , uBit.io.P2);

    uBit.serial.send("A\r\n");

    }

    ```


    If you connect a logic analyzer to P1 you will see the serial data for a letter
    A followed by a carriage return and line feed.'
  merge: -1
  img_proc: true
- pgno: 184
  md: '# Sending Data


    We have already used the send function without really discussing it, but sending
    data isn''t the difficult part of using serial. There are set of send functions
    which differ in what they allow you to send:


    +   - int sendChar(char c)

    - int send(ManagedString s)

    - int send(ManagedString s,MicroBitSerialMode)

    - int send(uint8_t *buffer, int bufferLen)

    - int send(uint8_t *buffer, bufferLen,MicroBitSerialMode mode)


    You can see that you can send a single character, a ManagedString or a buffer
    of bytes and this is usually more than enough to work with. In addition, there
    is also put which let you send a character, but isnt really needed because you
    have sendChar. You also not need puts, which sends an unmanaged string, because
    send will convert a standard C string into a managed string automatically.


    The only inherited method that seems useful is:

    send_break()


    which sends a low for longer than a character time. Only available on the V1,
    this caters for devices that need a break signal to reset or do something special
    and which cannot be sent as a character code.


    Finally there is a printf function with the serial driver. It is modeled on the
    standard C printf function but only supports a limited number of data types. You
    can use %c,%d, %s, %x and %X.


    The mode parameter is more important when you are receiving data, but still has
    an effect when you send data.


    There are three modes:


    +   - ASY - the characters are sent to the buffer and the function returns once.

    - SYNC_SPINWAIT - the characters are sent to the buffer and your program (i.e.
    the calling fiber) will wait until they are all sent.

    - SYNC_SLEEP - the characters are sent to the buffer and your program sleeps another
    fiber to run.


    The default is SYNC_SLEEP, but notice that if you have a single fiber program
    there''t a lot of difference between the two versions of SYNC. Notice that ASYNC
    allows your fiber to get on with things while the characters are being sent and
    this is often the most useful option.'
  merge: -1
  img_proc: true
- pgno: 185
  md: '# Reading Data


    When programming a serial connection it reading data that usually causes the most
    difficulty. Sending data is easy - you just send it, but receiving data requires
    you to know that there is some data to receive. In short, the problem is finding
    out when the other device has sent something to process. Basically there are only
    two ways of doing this. You can poll the receive buffer to detect when there is
    some data to read or set up an interrupt and have it call a function when there
    is something to read. While the interrupt approach seems to have a lot going for
    it, the simpler polling approach is often the better choice:


    ```

    int read()

    int read(MicroBitSerialMode)

    ManagedString read(int size)

    ManagedString read(int size,MicroBitSerialMode)

    int read(uint8_t *buffer, bufferLen)

    int read(uint8_t *buffer, bufferLen,MicroBitSerialMode)

    ```


    The simple read command with or without mode specified a single character. It
    is often used in a loop to read characters until there are no more, if you are
    going to do this you need to set the correct mode.


    The ManagedString function is as long as you know how many characters you are
    expecting. The read into a buffer has the same problem, i.e. you need to specify
    the number of bytes to read.


    As well as these standard functions, there''s a pair of readUntil functions:

    ManagedString readUntil(ManagedString delimiters)

    ManagedString readUntil(ManagedString delimiters,MicroBitSerialMode)


    These will read the receive buffer until one of the delimiters included in the
    nManagedString is encountered. For example:


    ```

    s = readUntil("\n");

    ```


    will read characters from the receive buffer until it finds a new line code. Notice
    that the string matching is on a per character basis so:


    ```

    s = readUntil("\n\r");

    ```


    will stop on encountering a new line or a carriage return not a new line followed
    by a carriage return.'
  merge: -1
  img_proc: true
- pgno: 186
  md: "The modes work in the same way as sent, but if you select ASYNC then the function\
    \ returns immediately if there is nothing in the receive buffer and returns a\
    \ null of some sort.\n\n+   - The read a character function returns MICROBIT_NO_DATA.\n\
    - The read ManagedString functions return as many characters as available or a\
    \ null string if there are none.\n- The readUntil will return a null if the delimiter\
    \ is not in the buffer.\n\nThe other modes hang your program until the request\
    \ can be met. This is for sending data, but when you are receiving data you cannot\
    \ be sure that the other device will give you anything out of the spinwait or\
    \ the sleep.\n\nTo see how all this might work let's write a simple polling loop\
    \ that reads characters from the serial Rx and sends them to the serial Tx. If\
    \ you use this with the terminal will see characters echoed you type an x.\n\n\
    ```\nuBit.init();\nint c;\ndo {\n    uBit.serial.read(ASYNC);\n    if((char)!=MICROBIT_NO_DATA)uBit.serial.send((char)c);\n\
    } while((char)c!='x');\n```\n\nThis works, but you might be thinking what waste\
    \ of processor power. This is true, but you can put whatever processing you want\
    \ to perform in the do loop and check the receiver buffer when the loop repeats.\n\
    \nYou can use the same trick to send characters from the USB serial port to another\
    \ pin:\n\n```\nuBit.init();\nint c;\ndo {\n    uBit.serial.read(ASYNC);\n    if(c)!=MICROBIT_NO_DATA){\n\
    \        uBit.serial.redirect(MICROBIT_PIN_P1, MICROBIT_PIN_P2);\n        uBit.serial.send((char)c);\n\
    \        uBit.serial.redirect(USBTX, USBRX);\n    }\n} while((char)c!='x');\n\
    ```\n\nFor V2 change redirect to:\nuBit.serial.redirect(uBit.io.P1 , uBit.io.P2);\n\
    \nThis works, but there is a problem. Each time the redirect occurs a spurious\
    \ character is transmitted; a poorly framed character should be rejected by the\
    \ other device as an error. This spurious character is a real problem because\
    \ it stops you from writing a program that takes data from one serial port and\
    \ sends it to another. If you have to rapidly switch between connections the spurious\
    \ extra characters swap the connection."
  merge: -1
  img_proc: true
- pgno: 187
  md: 'Notice that the read returns immediately in ASYNC mode. If you select any of
    the other modes then it only returns when a character is received. In this case
    you don''t need the if statement to test for a result. However, if the device
    you are connecting to never sends a character, the loop hangs forever.


    # Using Events


    There is a tendency among IoT programmers to use interrupts too often. They are
    useful when you need to deal with a low-priority event that occurs very rarely.
    For something that is important and very, you usually need to use a polling loop
    to keep up. You still need to know how to use events to work with the serial port
    and there are some tricky things you have to get right.


    There are two event sources that you can control:


    +   * int eventAfter(int len)

    * int eventAfter(int len,MicroBitSerialMode)


    which trigger an event if there are the specified number of characters in the
    receive buffer, in addition there are another two:


    +   * int eventOn(ManagedString delimiters)

    * int eventOn(ManagedString delimiters,MicroBitSerialMode)


    which trigger an event if any of the specified delimiters are present in the receive
    buffer.


    There are two things to notice when using these events. The first is that, at
    the moment, the framework does not allocate buffers until you have actually used
    the serial device. What this means is that you can set up a program that looks
    reasonable but never fires an event because the receive buffer is never created.
    The second problem is that these events only fire once.


    Both events have an ID of:


    ```

    MICROBIT_ID_SERIAL

    ```


    and respective values:


    ```

    MICROBIT_SERIAL_EVT_HEAD_MATCH

    MICROBIT_SERIAL_EVT_DELIM_MATCH

    ```


    Notice that you can the usual modes but SPINWAIT will return an error and SLEEP
    will pause the fiber and wait for the event.'
  merge: -1
  img_proc: true
- pgno: 188
  md: 'As an example of using serial events let''s write a program that simply copies
    characters to the LED display. The event handler is just:


    ```

    ```

    void onChar(MicroBitEvent e) {

    ManagedString s = uBit.serial.read(1);

    uBit.serial.clearRxBuffer();

    uBit.display.scroll(s);

    uBit.serial.eventAfter(1);

    }


    ```

    ```


    The main program is:


    ```

    ```

    #include "MicroBit.h"

    //define baud setBaudrate //uncomment for V2

    MicroBit uBit;

    int main() {

    uBit.init();

    uBit.serial(20);

    uBit.messageBus.listen(MICROBIT_ID_SERIAL, MICROBIT_SERIAL_EVT_HEAD_MATCH, onChar);

    uBit.serial.eventAfter(1);

    while (1)uBit.sleep(1000)

    release_fiber();

    }

    ```

    ```


    Notice that we use a setRxBufferSize size to make the framework actually create
    a buffer. The eventAfter function sets the event ready to happen and the while(1)
    sleep(1000) keeps the fiber running while waiting for the event. Alternatively
    you could simply release the fiber and let the scheduler call the event handler.


    The event handler is simple enough, but notice that we have to reset the event
    to happen a second time. These features of the framework might change well in
    future versions.


    # # Problems With Serial


    The biggest problem with using micro:bit serial is that, even though you can connect
    to it to GPIO lines, there is only one serial hardware device, i.e. one UART.
    A standard problem when trying to multiplex between different lines is that, when
    the switch happens, the Rx and Tx buffers are swapped to the new pins. For example,
    suppose you are connected to a device on pins 0 and 1 and suddenly switch the
    UART to USB. If there was data coming in on pin 1 switching pins will cause all
    sorts of problems as it alters the transfer and can crash the microbit V1.


    In general, you have to make sure that all data traffic has stopped before you
    switch pins. You might think this is an easy task, but it can be very difficult
    because of the use of ASYNC and SLEEP, which can allow your fiber to do things
    while data is being received or transmitted.'
  merge: -1
  img_proc: true
- pgno: 189
  md: '# Summary


    +   The serial port is one of the oldest ways of connecting devices together,
    but it is still very much in use.


    +   The serial protocol is asynchronous, but simple. A start bit gives the timing
    for the entire exchange.


    +   There are many control lines, once used with telephone equipment, that are
    mostly ignored in computer use. Similarly, the original ±12V signaling has been
    mostly replaced by 5V, and even 3.3V.


    +   The standard hardware that implements a serial connection is usually called
    a UART. The microbit has a single UART.


    +   You can create a MicroBitSerial object or just the one provided by the uBit
    connected to the USB port.


    +   To change the uBit to another port you need to use redirect.


    +   You can use event handling to deal with serial port input.'
  merge: -1
  img_proc: true
- pgno: 190
  md: '# Chapter 13

    Getting On WiFi


    The micro:bit has a radio that has two modes, Bluetooth LE and ad-hoc point-to-point
    ad-hoc but it lacks WiFi connectivity. One solution is to use the low cost ESP8266
    to make the connection via the micro-bit''s serial port. As we will make a lot
    of use of the micro:bit''s serial port it is assumed that you know roughly how
    it works. In particular, it is assumed that you are familiar with the material
    in the previous chapter. Before we get on to the details of using the ESP8266
    need to find out what makes it special.


    # The Amazing ESP8266


    The ESP8266 is a very odd and amazing device. It is remarkably low cost, $5 or
    less, it is a full microprocessor with GPIOS inline, RAM and built in WiFi. It
    is built by a Chinese company Espressif Systems but there are a number of copies
    on the market. The proliferation of devices and software revisions makes it difficult
    to work with, but it is well worth the effort.


    The module used in this chapter is the ESP8266 ESP-01 which is widely available
    from many different sources but they all look alike:


    ![](img/23976341c9281123e7b181beea6e9dbd_190_0.png)


    Another version, the ESP-07, which comes with a screened RF stage and other advantages,
    should also work.'
  merge: -1
  img_proc: true
- pgno: 191
  md: 'While you can set up a development system yourself and program the ESP8266
    to do almost anything, it comes with built-in software that allows it to be used
    as a WiFi module for other processors. This is how we are going to give the micro:bit
    a WiFi capability. The ESP8266 connects to the micro:bit using the serial port.
    The micro:bit controls it and transfers data using a system of AT commands. These
    were commonly used to control modems and other communication equipment and they
    are still used in mobile phone modems.


    A bigger problem is that there are new versions of the firmware and some of these
    might not work in exactly the same way. However, it should be easy to make the
    changes necessary.


    # Connecting the ESP8266 ESP-01


    There a number of minor problems in using the device. The first is that it comes
    with an 8-pin male connector which is not prototype board-friendly. The best solution
    to this is to use some female-to-male jumper cables to connect it to the prototype
    board, or use female-to-female cables to connect directly to the micro:bit breakout
    board. A second problem is caused by the fact that the device is powered from
    a 3.3V supply. This might tempt you to try to power it from the micro:bit''s 3.3V
    supply. **This will not work.** The ESP8266 takes a lot of current, 300mA or so,
    when transmitting. The micro:bit cannot supply this much current. You need to
    use a separate 3.3V power supply. Of course, you can use this to power both the
    ESP8266 and the micro:bit and in some situations this would be an advantage. You
    can use one of the many low-cost prototyping board power supplies with no problems:


    ![](img/23976341c9281123e7b181beea6e9dbd_191_0.png)'
  merge: -1
  img_proc: true
- pgno: 192
  md: 'The pinout of the ESP-01 is usually shown from the component side, but in fact
    the pins that you want to connect are on the other side. To make things easier
    the two views are given in the diagram:


    ![](img/23976341c9281123e7b181beea6e9dbd_192_0.png)


    The pin functions are:


    +   1 Ground connect to ground

    2 TXO serial Tx pin

    3 GPIO2 ignore

    4 CHPD chip enable, connect to 3.3V

    5 GPIO ignore

    6 RST reset leave unconnected

    7 RXI serial pin

    8 VDD supply voltage, connect to 3.3V


    From the pinouts you should be able to work out how the ESP8266 has to be connected
    to the microbit. If we use P0 as Tx from the micro-bit and P1 as Rx to the micro-bit
    we have to connect ESP-01 pin 7 to P0, pin 2 to P1 and ESP-01 pins 8 and 4 to
    the external power supply. To make it all work we also have to connect ESP-01
    pin 1 to the ground of the external power supply ground and to the ground of the
    microbit, as shown:


    ![](img/23976341c9281123e7b181beea6e9dbd_192_1.png)'
  merge: -1
  img_proc: true
- pgno: 193
  md: '# AT Commands


    The key idea in using the ESP8266 is that the micro:bit has to send an AT command,
    literally the characters AT, followed by other command strings. The command has
    to end with \r\n for the ESP8266 to take notice of it.


    You can find a full list of commands at the Espressif website, but the most important
    are:


    +   - AT: Attention

    - AT+RST: Reset the board

    - AT+GMR: Firmware version

    - AT+CWMODE=: Operating Mode

    - AT+CWJAP=: 1-Client 2-Access Point 3-Client and Access Point

    - AT+CWLAP: Join network View available networks

    - AT+CWQAP: Disconnect from network

    - AT+CIPSTATUS: Show current status as socket client or server

    - AT+CIPSTART=: Connect to socket server

    - AT+CIPCLOSE: Close socket connection

    - AT+CIFSR: Show assigned IP address connected to network

    - AT+CIPMUX=: Set connection

    - AT+CIPSERVER=: 0-Single Connection 1-Multi-Channel Connection Open the Socket
    Server

    - AT+CIPMODE=: Set transparent mode

    - AT+CIPST0=: Set auto socket disconnect timeout from 1-28800

    - +IPD: Data


    This is just a very general overview and omits the commands that allow the device
    to work as an access point. It is assumed that client mode is the more common
    application, but it isn''t difficult to extend this example to access point operation.'
  merge: -1
  img_proc: true
- pgno: 194
  md: "# Setup\n\nWe need a function to set up the hardware ready to communicate with\
    \ the device:\n\nV1\n\n```\nvoid initWiFi() {\n  uBit.serial.redirect(Tx, Rx);\n\
    \  uBit.serial.baud(115200);\n  uBit.serial.setRxBufferSize((uint8_t)+5000);\n\
    }\n```\n\nV2\n\n```\nvoid initWiFi() {\n  uBit.serial.redirect(uBit.io.P1 , uBit.io.P2);\n\
    \  uBit.serial.setBaudrate(115200);\n  uBit.serial.setRxBufferSize((uint8_t)+5000);\n\
    }\n```\n\nThe pins that we are using are P0 and P1, to allow for other choices\
    \ Tx and Rx are defined as constants at the start of the program:\n\nV1\n\n```\n\
    #define Tx MICROBIT_PIN_P0\n#define Rx MICROBIT_PIN_P1\n```\n\nV2\n\n```\n#define\
    \ Tx uBit.io.P0\n#define Rx uBit.io.P1\n```\n\nThe model of ESP8266 works at 115200\
    \ by default. Newer models and up-dated firmware is reported to work at 9600 baud.\
    \ If this is the case, you need to modify the data rate and/or change the ESP8266's\
    \ baud.\n\n# Attention!\n\nTo start with the easiest, but possibly least useful,\
    \ command let's implement some functions that test that we have a connection to\
    \ the device, always a good thing to start with.\n\nIn this section we develop\
    \ the first of a functions that send a command to the device and get back a response.\
    \ To do this we need a few functions to help and are reused in other AT functions.\
    \ Once you have one AT function the rest are very similar, so it is worth spending\
    \ time following how this simple AT function works.\n\nIf you send the string\
    \ AT\\r\\n then the ESP8266 replies with a single \"OK\". This proves that the\
    \ serial interface is working and there isn't much point in moving on until you\
    \ have tested it works."
  merge: -1
  img_proc: true
- pgno: 195
  md: "The AT function is simply:\n\n```\nint ATWiFi() {\n  uBit.serial.send(\"AT\\\
    r\\n\", SYNC_SPINWAIT);\n  return 1;\n}\n```\n\nYou have to use SPINWAIT because\
    \ things go wrong when you let the fiber continue to process while the data is\
    \ being transmitted.\n\nThis is the most basic form of function that we will do\
    \ the job, but it isn't really practical. We need to check that it works and we\
    \ need to get some feedback. We could read what is sent back and then display\
    \ it on the LED display. This would work, but reading the LED display is very\
    \ slow for a human. A better idea is to send the data to the USB serial console\
    \ when in a \"debug\" mode. The problem with this is every time you spin the serial\
    \ device generates spurious characters. If we switch after receiving the entire\
    \ message rather than each character we can minimize the spurious characters,\
    \ which the ESP8266 seems to ignore.\n\nA function to swap to from the USB pins\
    \ and send the data is easy:\n\n```\nvoid debug(ManagedString s) {\n  uBit.serial.redirect(USBTX,\
    \ USBRX);\n  uBit.serial.send(s, SYNC_SPINWAIT);\n  uBit.serial.redirect(Tx, Rx);\n\
    }\n```\n\nFor V2 you also need:\n\n```\n#define USBTX uBit.io.usbTx\n#define USBRX\
    \ uBit.io.usbRx\n```\n\nNow all we need to do is read the data sent back from\
    \ the device. The simplest way of doing this is to wait for a period of time that\
    \ means the device has to wait for the data or something is wrong. As 11520 baud\
    \ allows for more than 100 characters in 10ms and 9600 baud takes just over 100ms,\
    \ you can estimate the time you need to wait for any packet of characters to be\
    \ delivered. As the response to the AT request only sends a few characters, waiting\
    \ 150ms is more enough at any baud rate. We can then read the entire buffer:\n\
    \n```\nuBit.sleep(150);\nManagedString s = uBit.serial.read(500, ASYNC);\n```\n\
    \nReading in ASYNC mode means that the function will return as many characters\
    \ in the buffer as a managed string."
  merge: -1
  img_proc: true
- pgno: 196
  md: "If the AT command has been successful, it returns a string containing \"OK\"\
    .\nOne of the problems of working with AT commands is that they don't have an\n\
    syntax and there is no formal \"end of message\" signal.\nBy observation, any\
    \ successful command does end with OK and if you can't\find OK in the response\
    \ then you either haven't read it or there has been an\nerror. Clearly we need\
    \ a way to test if a string contains OK:\n\n```\nint find(ManagedString c, ManagedString\
    \ s) {\n  int i;\n  for (i = 0; i < (s.length() - c.length()); i++) {\n    if\
    \ (c == s.substring(i, c.length())) break;\n  }\n  if (i == (s.length() - c.length()))\
    \ return 0;\n  return 1;\n}\n```\n\nThis is the simplest string scanning function\
    \ that will do the job. It only\nchecks that the string c is in once and it will\
    \ find c if it is embedded in\nanother word. So it will find \"OK\" in \"NotOK\"\
    , for example.\nWith all this we can now finish the ATWiFi function:\n\n```\n\
    int ATWiFi() {\n  uBit.serial.send(\"AT\\r\\n\", SYNC_SPINWAIT);\n  uBit.sleep(150);\n\
