    # Greyscale


    One of the features of the framework''s support for the LED display that isn''t
    so obvious that you can use it as a greyscale display. The reason it isn''t obvious
    is that there isn''t a setvalue function for a single LED. The framework doesn''t
    have any functions that work with a single LED at all. However, the display object
    uses a buffer which is a MicroBitImage object. The basic idea is that you can
    create MicroBitImage objects and print them to the display or you work directly
    with the buffer MicroBitImage object to display "live" graphics.


    The key method is:

    setPixelValue(int16_t x,int16_t y,uint8_t value)

    where value can be anything from 0 to 255.


    The brightness is created by simply turning the LED on and off in the correct
    ratio as in PWM, although PWM isn''t used in the display. It is a simple consequence
    of the repeated rendering of the display and the percentage of time a pixel is
    set to on.'
  merge: -1
  img_proc: true
- pgno: 225
  md: "For example, you can slowly increase the brightness of the center LED:\nuBit.init();\n\
    uuBit.display.setDisplayMode(DISPLAY_MODE_GRESCALE);\nint i;\nfor(i;{\nfor(i=0;i<256;i++){\n\
    \  uBit.display.image.setPixelValue(2,2,i);\n  uBit.sleep(50);\n}\n\nNotice that\
    \ you have to set the greyscale mode because this is more complex\nand not the\
    \ default. You can explore the possibilities of using\nMicroBitImage object to\
    \ perform animation and other graphical techniques.\nThe real problem, however,\
    \ is that no matter how clever your software you\nonly have a 5x5 display.\n\n\
    # Using Aliasing to Increase Resolution\n\nAs an example of how you can use the\
    \ grey-level resolution of the display to\nincrease its effective spatial resolution,\
    \ let's implement a traditional BBC\nMicro game - Command Jump. This is a very\
    \ simple game where a figure's\nheight above the baseline is controlled by how\
    \ fast the user clicks a button.\nOnly showing five positions makes it a little\
    \ crude.\n\nAs an alternative to moving the command by one LED for every 10\n\
    button clicks, we can move the brightness from one to another gradually.\ncan\
    \ think of this as locating the commando in the gaps between the LED, but\nit\
    \ is also the standard anti-aliasing technique from higher resolution graphics.\n\
    \nA function to move the command by fractional amounts is:\n\n```\nvoid flashMan(int\
    \ x, int y, int p, int vx, int vy) {\nuuBit.display.image.setPixelValue(x, y,\
    \ 0);\nuuBit.display.image.setPixelValue(x + vx, y + vy, 0);\nuuBit.sleep(100);\n\
    uuBit.display.image.setPixelValue(x, y, 25 * (10 - p));\nuuBit.display.image.setPixelValue(x\
    \ + vx, y + vy, 25 * p);\nuuBit.sleep(100);\n}\n```\n\nThe command is at x, y\
    \ and p is used to indicate how close it is to being at\nx+vx and y+vy. For example,\
    \ suppose p is 0 then the first LED is set to 10*25,\nni.e. 250, and the second\
    \ to 0. If p is 3 then the first is set to 7*25 and the\nsecond to 3*25. Finally,\
    \ if p is 10 the first is set to 0 and the second to 10*25."
  merge: -1
  img_proc: true
- pgno: 226
  md: "As p varies from 0 to 10, the position of the brightness moves from the first\
    \ to the second LED.\n\nWe also need something to record how many times the button\
    \ has been clicked. This can be done using an event handler that counts clicks\
    \ using a global variable. There is no doubt that this would be better implemented\
    \ as an object using C++ with methods such as getValue and reset, but in C we\
    \ use:\n\n```\nvoid setUpButton() {\n    uBit.buttonB.eventConfiguration(MICROBIT_BUTTON_ALL_EVENTS);\n\
    \    uBit.messageBus.listen(MICROBIT_ID_BUTTON_B, MICROBIT_BUTTON_EVT_CLICK, buttonClickCount);\n\
    }\n```\n\nNow buttonClickCount is called each time the user clicks buttonB:\n\n\
    ```\nvoid buttonClickCount(MicroBitEvent e) {\n    clickCount++;\n}\n```\n\nNow\
    \ we have all of the elements needed to implement the game."
  merge: -1
  img_proc: true
