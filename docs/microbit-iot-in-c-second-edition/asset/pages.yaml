- pgno: 101
  md: "The comments give you a general idea of what each register is for. For example,\
    \ the AM register has address 0x07, is read only and has default value 0x0C. This\
    \ is a good register for trying out the I2C commands because we know what the\
    \ result should be.\n\nThe address of the device is 0xE and so the address shifted\
    \ by one is 0x1C. The register's address is 0x7. The datasheet also says that\
    \ the device needs a repeated START bit for a register read, i.e. a STOP bit only\
    \ at the end of the transaction:\n\n```\n#include \"MicroBit.h\"\nMicroBit uBit;\n\
    ```\n\n```\nint main() {\n  uBit.init();\n  char buf[]={0x07};\n  uBit.i2c.write(0x1C,buf,1,true);\n\
    \  uBit.i2c.read(0x1C,buf,1);\n  printf(\"Id X%%X\\r\\n\", (int)buf[0]);\n  release_fiber();\n\
    \  return 0;\n}\n```\n\nIf you connect a logic analyzer to Pin 19 and Pin 20 you\
    \ can see the transaction in action. You will also see some other transactions\
    \ as the framework initializes the two built-in devices:\n\n![](img/23976341c9281123e7b181beea6e9dbd_101_0.png)\n\
    \nYou can see that there is no STOP bit in the middle of the transaction, only\
    \ at the end. While this is the way that the transaction should be done, you will\
    \ discover that if you take out the \"true\" in the write you will find little\
    \ difference. The same data is provided by the slave and the noticeable difference\
    \ is slightly longer pauses between write and read transactions."
  merge: -1
  img_proc: true
- pgno: 102
  md: "Now that we can read the ID of the device it is interesting to read some real\
    \ data. First, however, we can make use of the framework's compass functions to\
    \ get data from the device so we know what results to expect.\n\nThe first part\
    \ of the program gets the magnetic field in the x, y and z directions and prints\
    \ them to the serial port:\n\n```\nuBit.init();\nuBit.compass.updateSample();\n\
    int x = uBit.compass.getX();\nprintf(\"%d \\r\\n\", x);\nint y = uBit.compass.getY();\n\
    printf(\"%d \\r\\n\", y);\nint z = uBit.compass.getZ();\nprintf(\"%d \\r\\n\"\
    , z);\n```\n\nWe can repeat the readings, this time using I2C functions to talk\
    \ directly to the device.\n\nIf you consult the datasheet you will discover that\
    \ the x, y and z data is stored in single byte-registers with addresses starting\
    \ at 0x01. You can read values at a time, but the device also supports multibyte\
    \ mode that will transfer all bytes in one operation. All you have to do is read\
    \ six bytes from register 0x01 and you get the x, y and z data:\n\n```\nchar buf[]\
    \ = {0x01};\nchar buf2[7];\nuBit.i2c.write(0x1C, buf, 1, true);\nuBit.i2c.read(0x1C,\
    \ buf2, 6);\nint i;\nfor (i = 0; i < 6; i++) {\n    printf(\"%d %X \\r\\n\", i,\
    \ (int) buf2[i]);\n}\n```\n\nThe program reads the raw data to the serial port.\
    \ We convert the raw bytes to 16-bit signed values by packing them into suitable\
    \ integers:\n\n```\nint16_t X = buf2[0] << 8 | buf2[1];\nprintf(\"%d \\r\\n\"\
    , X);\nint16_t Y = buf2[2] << 8 | buf2[3];\nprintf(\"%d \\r\\n\", Y);\nint16_t\
    \ Z = buf2[4] << 8 | buf2[5];\nprintf(\"%d \\r\\n\", Z);\n```\n\nIf you try this\
    \ program you will discover that the framework gives slightly different results\
    \ because it uses a different set of coordinates - all values are multiplied by\
    \ 100 and the x and y data are multiplied by -1."
  merge: -1
  img_proc: true
- pgno: 103
  md: "# micro:bit V1.5 and V2\n\nThere are two possible combined accelerometers in\
    \ use in the micro:bit v1,5 and V2. To find out which is actually in use you have\
    \ to read and test the WHO_AM register. Unfortunately this is in a different location\
    \ in each case.\nLooking the values up in the datasheets allows us to write a\
    \ program that tests for each device:\n\n```\n#include \"MicroBit.h\"\n\n#define\
    \ LSM303 ADDR 0x32\n#define LSM303 WHO 0x0F\n#define LSM303_VAL 0x33\n\n#define\
    \ FX058700 ADDR 0x3C\n#define FX058700 WHO 0x0D\n#define FX058700_VAL 0xC7\nMicroBit\
    \ uBit;\n\nint main({\n  uBit.init();\n  uint8_t data[1];\n  int status = 0;\n\
    \n  status = uBit._i2c.readRegister(LSM303_ADDR, LSM303_WHO, data, 1);\n  if (data[0]\
    \ == LSM303 VAL)\n    uBit.serial.printf(\"LSM303 \\n\\r\");\n\n  status=uBit._i2c.readRegister(FX058700_ADDR,FX058700_WHO,data,1);\n\
    \  if (data[0] == FX058700 VAL)\n    uBit.serial.printf(\"FX058700 \\n\\r\");\n\
    \  return 0;\n}\n```\n\nThis works for the micro:bit V2 and uses the _i2c object\
    \ to use the dedicated bus. To make it work on the V1.5 you simply change _i2c\
    \ to i2c.\n a final example let's read the data from the LSM303 magnetometer.\
    \ This consists of magnetic field strengths in the x, y and z directions. Each\
    \ value is a 16-bit value and this is represented as pairs of registers. The datasheet\
    \ gives these register addresses as 0x68 to 0x6D."
  merge: -1
  img_proc: true
