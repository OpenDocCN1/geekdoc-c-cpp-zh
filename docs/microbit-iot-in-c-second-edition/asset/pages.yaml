- pgno: 124
  md: '# Chapter 8


    # Creating A Custom Protocol


    In this chapter we make use of all the ideas introduced in earlier chapters to
    create a raw interface with the low cost DHT11/22 temperature and humidity sensor
    as an exercise in implementing a custom protocol directly in C.


    # The DHT22


    The DHT22 is a more accurate version of the DHT11 and is used in this project,
    but the hardware and software will work with both versions and with the AM2302,
    which is similar to the DHT22.


    ![](img/23976341c9281123e7b181beea6e9dbd_124_0.png)


    Model AM2302/DHT22

    Power supply 3.3-5.5V DC

    Output signal digital signal via 1-wire bus

    Sensing element Polymer humidity capacitor

    Operating range


    +   - humidity 0-100%RH;

    tperature -40~80Celsius


    Accuracy

    humidity +-2%RH(Max +-5%RH)

    tperature +-0.5Celsius

    Resolution or sensitivity


    +   - humidity 0.1%RH;

    tperature 0.1Celsius


    Repeatability

    humidity +-1%RH;

    tperature +-0.2Celsius


    The device will work at 3.3V and makes use of a 1-wire, open collector-style bus,
    which makes it very easy to make the physical connection to the micro:bit. The
    1-wire bus used isn''t standard and is only used by this family of devices, so
    we have little choice but to implement the protocol in C.'
  merge: -1
  img_proc: true
- pgno: 125
  md: '![](img/23976341c9281123e7b181beea6e9dbd_125_0.png)


    The pinouts are:


    +   1. VDD

    2. SDA serial data

    3. not used

    4. GND


    and the standard way of connecting the device is:


    ![](img/23976341c9281123e7b181beea6e9dbd_125_1.png)


    Although the recommended pull-up resistor is 1k, a higher value works better with
    the micro:bit - typically 4.7k, but larger will work.

    The serial protocol is fairly simple. The host pulls the line low for between
    0.8 and 29 ms, usually 1ms. It releases the bus, which is pulled high.

    After 20µs to 200µs, usually 30µs, the device starts to send data by pulling the
    line down for around 80µs and then lets it float high for another 80µs. Next 40
    bits of data are sent using a 70µs high for a 1 and a 26µs high for a 0 with the
    high pulses separated by around 50µs low periods.'
  merge: -1
  img_proc: true
- pgno: 126
  md: '| Host pulls up | Sensor pulls up | Sensor output | Sensor output 1 bit data
    of "1" | Transmission |

    |---|---|---|---|--|

    | VCC | and wait for sensor''s response | get ready to output signal | 1 bit data
    of "0" | Transmission ended, RL pulls up |

    | GND | Host send start signal | Sensor send out response | Sensor output alternative
    data of "0" or "1" based upon real value | Sensor pulls low |


    ![](img/23976341c9281123e7b181beea6e9dbd_126_0.png)


    So what we have to do is pull the line for 1ms or so to start the device sending
    data and this is very easy. Then we have to wait for the line down and let it
    pull up again for about 160µs and then read the time that the line is high 40
    times.


    A 1 corresponds to 70µs and a 0 corresponds to 26µs. This is within the range
    of pulse measurement that can be achieved using standard library function. There
    is also a 50µs period between each data bit and this can be used to some limited
    processing. Notice that we are only interested in the time that the line is held
    high.


    # # The Electronics


    Exactly how you build the circuit is a matter of preference. The basic layout
    can be seen below:


    ![](img/23976341c9281123e7b181beea6e9dbd_126_1.png)


    If you have an edge connector breakout board for the micro:bit then it is fairly
    easy to connect the device to the micro:bit using female jumper wires. You can
    also put the resistor close to the DHT22 to make a sensor package connected to
    the micro:bit using three cables.'
  merge: -1
  img_proc: true
- pgno: 127
  md: "# The Software\n\nWith the hardware shown above connected to the micro:bit,\
    \ the first thing we need to do is establish that the system is working. The simplest\
    \ way to do this is to pull the line down for 1ms and see if the device responds\
    \ with a stream of pulses. These can be seen on a logic analyzer or an oscilloscope\
    \ - both are indispensable tools. If you don't have access to either then you\
    \ will just have to skip to the next stage and see if you can read in some data.\
    \ The simplest program that will do your job is:\n\n```\n#include \"MicroBit.h\"\
    \nMicroBit uBit;\nMicroBitPin P0 = uBit.io.P0;\n\nint main() {\n\tint n = 1200;\n\
    \t//n = 4400; // Uncomment for V2\n\tvolatile int i;\n\tuBit.init();\n\tnP0.setDigitalValue(1);\n\
    \nP0.setDigitalValue(0);\n\tfor (i = 0; i < n; i++) {\n\t\nP0.setDigitalValue(1);\n\
    \t\tint b = P0.getDigitalValue();\n}\n}\n```\n\nSetting the line initially high,\
    \ to ensure that it is configured as an output, then set it low, wait for around\
    \ 1000µs and then change its direction to input by reading the data. Notice the\
    \ need for the different value of n for the V2. There's no need to set the line's\
    \ pull-up mode because it is the only device driving the line until it releases\
    \ the line by changing direction to input. When a line is in input mode, it is\
    \ high impedance and this is why we need an external pull-up resistor in the circuit.\
    \ As long as the circuit has been correctly assembled and you have a working device,\
    \ you should see something like:\n\n![](img/23976341c9281123e7b181beea6e9dbd_127_0.png)"
  merge: -1
  img_proc: true
- pgno: 128
  md: "# Reading the Data\n\nWith preliminary checks complete, it is time to read\
    \ the 40-bit data stream.\nThe first thing to do is wait for the low that the\
    \ device sends before the START bit:\n\n```\nfor (i = 1; i < 200; i++) {\n   \
    \ if (P0.getDigitalValue() == 0)break;\n}\n```\n\nNext we can start to read in\
    \ the bitstream. When doing this there are two things to keep in mind. The first\
    \ is that it is only the time line is high that matters and you need to measure\
    \ this accurately. You don't care so much about how long the line is for. The\
    \ second is that it is usually better to collect the bits and only process them\
    \ and extract the data. To this end it is usually good idea to save the data in\
    \ a buffer:\n\n```\nint buf[41];\\int j;\nfor(j=0;j<41;j++) {\n    for(i=1;i<200;i++)\
    \ {\n        if(P0.getDigitalValue()==1)break;\n    }\n    for(i=1;i<200;i++)\
    \ {\n        if(P0.getDigitalValue()==0) break;\n    }\n    buf[j]=i;\n}\n```\n\
    \nYou should be able to see how this works. The outer loop, indexed on j, repeats\
    \ to read in all 40 data bits and the initial START bit. The first inner loop\
    \ waits for the line to go high and i gives the time that the line has been low.\
    \ There is no interest because the device keeps the line low for the same length\
    \ of time for a zero or a one. The second for loop waits for the line to go low.\
    \ The count in i is now proportional to the time the line was high and is stored\
    \ in the buffer.\n\nIf you add:\n\n```\nfor(j=0;j<=40;j++){\n    UBit.serial.printf(\"\
    %d %d \\n\",buf[j]);\n}\n```\n\nto the end of the program you will be able to\
    \ see the counts and you should quickly be able to work out the value halfway\
    \ between the long, one pulses and the short, zero pulses."
  merge: -1
  img_proc: true
- pgno: 129
  md: "Examining the data reveals that for the micro:bit V1, short pulses returned\
    \ 6\n long returned 16, both plus or minus 1. Thus the threshold is\napproximately\
    \ 11. For the micro:bit V2 the values are around 20 for a short\npulse and 60\
    \ for a long, giving 40 as a reasonable choice of threshold.\n\nWith a threshold\
    \ set we can classify the pulses into short and long and store\nzeros and ones\
    \ in the buffer:\n\n```\nint threshold=11;\n//threshold=40;// uncomment for V2\n\
    int buf[41];\nint j;\nfor (int i = 0; j < 41; j++) {\n  for (i = 1; i < 200; i++)\
    \ {\n    if (P0.getDigitalValue() == 1)break;\n  }\n  for (i = 1; i < 200; i++)\
    \ {\n    if (P0.getDigitalValue() == 0) break;\n  }\n  buf[j] = 0;\n  if (i >\
    \ threshold)buf[j] = 1;\n}\n```\n\nYou can afford to include this extra processing\
    \ in the data collection loop\nbecause it happens while the line is low and we\
    \ aren't interested in\nmeasuring this time accurately.\n\n**If you try this you\
    \ will discover that it doesn't work.** Not only does it\ndrop bits, it seems\
    \ to drop the same bits each time you run the program. This\nis a particular problem\
    \ for the microbit V2, which never manages to\ncomplete a reading correctly. This\
    \ suggests that it is a systematic effect and\nthe result of random noise.\n\n\
    The cause of the problem is, in fact, the system timer interrupt. The entire\n\
    transaction takes about one interrupt interval and, as the timer is\nstarted when\
    \ the program starts, the interrupt occurs at the same point\ntime you run the\
    \ program - hence the regularity. The solution is to turn off\ninterrupts for\
    \ the duration of the regularity. Turning off interrupts for any length\ntime\
    \ is not a good idea, but for the short time that the reading is being\nit causes\
    \ no serious problems."
  merge: -1
  img_proc: true
- pgno: 130
  md: "All you have to do surround the bit reading loop with __disable_irq() and\n\
    __enable_irq();\nint threshold=11;\n//threshold=40// uncomment for V2\nint buf[41];\n\
    int j;\ndisable_irq();nfor (j = 0; j < 41; j++) {\n  for (i = 1; i < 200; i++)\
    \ {\n    if (P0.getDigitalValue() == 1)break;\n  }\n  for (i = 1; i < 200; i++)\
    \ {\n    if (P0.getDigitalValue() == 0) break;\n  }\n  buf[j] = 0;\n  if (i >\
    \ threshold)buf[j] = 1;\n}\n__enable_irq();\n\nWith this change it all works.\n\
    \n# Extracting the Data\n\nNow we have the data in the buffer as zeros and ones.\
    \ All that remains is\ndecode it into temperature and humidity readings. But first\
    \ we will convert\nbits into five bytes of data. The simplest way of doing this\
    \ is to write a\nfunction that will pack eight bits into an uint32_t:\n\n```\n\
    uint32_t getByte(int b, int buf[])\n{\n  int i;\n  uint32_t result = 0;\n  b =\
    \ (b - 1) * 8 + 1;\n  for (i = b; i <= b + 7; i++) {\n    result = result << 1;\n\
    \    result = result | buf[i];\n  }\n  return result;\n}\n```\n\nThe b can be\
    \ the byte that you want to extract from the array. For\nexample, if b = 2 then\
    \ the loop runs from i = 9 to i = 16, i.e. the second\nbyte stored in the array.\
    \ Notice that we skip the first bit because this just\nssignals the start of the\
    \ data. The bit manipulation in the for loop is a fairly\nstandard shift left\
    \ and OR the least significant bit into the result."
  merge: -1
  img_proc: true
- pgno: 131
  md: 'Using function t getting the five bytes is trivial:


    ```

    uint32_t byte1 = getByte(1, buf);

    uint32_t byte2 = getByte(2, buf);

    uint32_t byte3 = getByte(3, buf);

    uint32_t byte4 = getByte(4, buf);

    uint32_t byte5 = getByte(5, buf);

    ```


    The first two bytes are the humidity measurement, the second two the

    tperature and the final byte is the checksum. The checksum is just the sum

    of the first bytes reduced to 8 bits and we can test it using:

    UBit.serial.printf("Checksum %%%%\n\r", byte5,

    (byte1 + byte2 + byte3 + byte4) & 0xFF);


    If the two values are different, then there is a transmission error.

    In this case the simplest thing to do is get another reading from the device.

    However, you shouldn''t read the device more than once every 2 seconds.


    The humidity and temperature are also easy to reconstruct as they are

    transmitted high byte first and then the actual value. The only problem is

    the microbit byte doesn''t have floating point support and so it is

    eier to keep the values as humidity*10 and temperature*10. The humidity

    data is easy:


    ```

    int16_t humidity = (byte << 8) | byte2;

    ```


    The temperature data is slightly more difficult in that the topmost bit is used

    to indicate a negative temperature. This isn''t two''s complement or any other

    standard format. The most significant bit is used as a negative sign for

    the value stored as a positive binary value in the lower-order bits.


    This means we have to test for the most significant bit and flip the sign of the

    tem if it is set:


    ```

    int16_t temperature = (byte3 << 8) | byte4;

    if(temperature & 0x8000)temperature=(temperature & 0x7FFF);

    ```


    This completes the data processing. All that is left is showing the data to the

    user. For testing it is good to send the data to the serial port so that it can
    be

    checked:


    ```

    UBit.serial.printf("Humidity %d%%\n\r",

    humidity / 10, abs(humidity % 10));

    UBit.serial.printf("Temperature %dC\n\r",

    tem / 10, abs(temperature % 10));

    ```


    Note the use of %% to display a percentage sign.'
  merge: -1
  img_proc: true
- pgno: 132
  md: "As the micro:bit also has a 5x5 LED display, we will use it to show the\nhumidity\
