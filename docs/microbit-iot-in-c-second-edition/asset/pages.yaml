    \ / 10, abs(humidity % 10));\nuuBit.display.scroll(buff, 200);\nsprintf(buff,\
    \ \"%d.%d%%\", temperature / 10, abs(temperature % 10));\nuuBit.display.scroll(buff,\
    \ 200);\n```\n\nTo use sprintf you also need to add:\n\n```\n#include <stdio>\n\
    ```\n\nNow if you run the program you will see the humidity and temperature scroll\n\
    past. If you put the whole reading section into a loop then you can add a\nuuBit.sleep(2500)\
    \ to produce something that shows the data every 2.5\nseconds.\n\n# Complete Listing\n\
    \nThat's all we need to do and the final program, complete with some minor\ntidying\
    \ up, can be seen below:\n\n```\n#include \"MicroBit.h\"\n#include <stdio>\n```\n\
    \n```\nMicroBit uBit;\nMicroBitPin P0 = uBit.io.PO;\n```\n\n```\nuint32_t getByte(int\
    \ b, int buf[])\n{\n  int i;\n  uint32_t result = 0;\n  b = (b - 1) * 8 + 1;\n\
    \  for (int i = b; i <= b + 7; i++)\n  {\n    result = result << 1;\n    result\
    \ = result | buf[i];\n  }\n  return result;\n}\n```"
