- pgno: 10
  md: '# # Chapter 1


    # ## The Micro-bit Family


    The micro:bit is an interesting and low-cost device. It was originally launched,
    under the auspices of the BBC, in 2015 when plans were announced to distribute
    around one million devices, free of charge, to school pupils in the UK with the
    aim of extending the digital technology and coding skills. The first commercial
    version hit the market in 2016, by which time the Micro:bit Educational Foundation
    had taken over from the BBC, although the device continued to use the BBC name.
    The micro:bit V2 made its debut at the end of 2020 and, as well as being more
    powerful and having more features, was based on a different microprocessor.

    The micro:bit is supported by a number of high-level languages which are primarily
    used for educational apps and for classroom. However, the underlying device is
    programmed in a mix of C and C++, Working at this level is generally not something
    that many take on and it isn''t as easy as say, programming in Python. Although
    it is more difficult to get started with C/C++ than other languages, the effort
    is worth it and if you want to use the micro:bit in IoT or embedded applications
    then C is by far the best choice. Programming the micro:bit in C is the subject
    of the rest of this book, but first let''s take a look at the micro:bit itself
    and find out what makes it attractive and what the problems are.


    # ## Meet the Micro:bits


    To date there are three versions of the micro:bit - V1.3, V1.5 and V2. The differences
    between V1.3 and V1.5 are small and relate to the addresses for some of the peripherals.
    You can program the 1.3 and 1.5 using the same tools and software mostly you can
    regard them as the same device, collectively referred to as micro:bit V1 in this
    book. The V2 is comparatively recent and not only has additional and different
    hardware, also uses different software and this is something of a problem.'
  merge: -1
  img_proc: true
