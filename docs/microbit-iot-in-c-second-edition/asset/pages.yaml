- pgno: 108
  md: '# Chapter 7

    I2C Measuring Temperature And Humidity


    Using I2C devices is fairly easy once once you have successfully used one and
    hence know what information you need and what to look for in a working system.
    In this chapter we use the HTU21D temperature and humidity sensor, and the more
    robust Si7021 which has replaced it, as a case study of I2C in action. It also
    happens to be a useful sensor.


    Using an I2C device has two problems - the physical connection between master
    and slave and figuring out what the software has to do to make it work. Here we
    will follow the principle outlined in the previous chapter and add information
    from the HTU21D/Si7021 datasheet to make a working humidity sensor using the framework
    I2C functions.


    # The HTU21D/Si7021


    The hardware. The HTU21D/Si7021 temperature and humidity sensor is one of the
    easiest of I2C devices to use. Its only problem is that it is only available in
    a surface-mount package. To overcome this you could solder some wires onto the
    pads or buy a general breakout board. However, it is much simpler to buy the HTU21D/Si7021
    breakout board with its easy connections and built-in pull-up resistors that mean
    you don''t need to add any components to this circuit working. You just make four
    connections.


    ![](img/23976341c9281123e7b181beea6e9dbd_108_0.png)


    If you decide to work with some other I2C software you can still follow the steps
    in this account, but you will have to modify what you do to be correct for the
    the device you are using. In particular if you select a device that works at 5V
    you might need a level converter.'
  merge: -1
  img_proc: true
- pgno: 109
  md: '# Wiring the HTU21D


    In the first instance we''ll use Pin 19 and Pin 20, which in the micro:bit V1
    are the same I2C bus that the accelerometer and magnetometer are connected to.
    The micro:bit V2 has no such problems.


    | Physical Pin | Function |

    |---|---|

    | Pin 20 | SDA |

    | Pin 19 | SCL |


    Given that the HTU21D has pull-up resistors we really should disable them when
    used on the internal I2C bus which already has pull-ups. In practice the additional
    pull-downs seem to make much difference to the waveforms and you can leave them
    in place while testing. Later when we try the same device on a separate bus the
    pull ups will be required.


    ![](img/23976341c9281123e7b181beea6e9dbd_109_0.png)


    You can use a prototype board to make the connections and this makes it easier
    to connect other instruments such as a logic analyzer.


    # A First Program


    After wiring up any I2C device, the first question that needs to be answered is,
    does it work? Unfortunately for most complex devices finding out if it works is
    a multi-step process. Our first program will aim to read some data back from the
    HTU21D - any data will do.'
  merge: -1
  img_proc: true
- pgno: 110
  md: "If you look at the datasheet you will find that the device address is 0x40\
    \ and it supports the following commands:\n\n| Command | Code | Comment |\n|---|---|--|\n\
    | Trigger Temperature Measurement | 0xE3 | Hold master |\n| Trigger Humidity Measurement\
    \ | 0xE5 | Hold master |\n| Trigger Temperature Measurement | 0xF3 | No master\
    \ |\n| Trigger Humidity Measurement | 0xF5 | No master |\n| Write user register\
    \ | 0xE6 | |\n| Read user register | 0xE7 | |\n| Soft Reset | 0xFE | |\n\nThe\
    \ easiest of these to get started is with the User register command. The user\
    \ register gives the current setup of the device and can be used to set the resolution\
    \ of the measurement.\n\nNotice that the codes that you send to the device can\
    \ often be considered addresses or commands. In this case you can think of sending\
    \ 0xE7 as a command to read the register or the read address of the register -\
    \ it makes no difference. In many cases the term command is used when sending\
    \ the code makes the device do something and the term address is used when it\
    \ simply makes the device read or write specific data.\n\nTo read the user register\
    \ we have to write a byte containing 0xE7 and then read the device sends back.\
    \ This involves sending an address frame, a data frame and then another address\
    \ frame and reading a data frame. The device seems to be happy if you send a STOP\
    \ bit between each transaction or just a new START bit.\n\nA program to read the\
    \ user register is fairly easy to put together. The address of the device is 0x40\
    \ so its write address is 0x80 and its read address is 0x81. As the framework\
    \ I2C function add the lower bit on read, we simply use 0x80 as the device's address:\n\
    \n```\n#include \"MicroBit.h\"\nMicroBit uBit;\nint main() {\n\tuBit.init();\n\
    \tuint_t buf[] = {0xE7};\n\tuBit.i2c.write(0x80, buf, 1);\n\tuBit.i2c.read(0x80,\
    \ buf, 1);\n\tuBit.serial.printf(\"User Register %X \\r\\n\", buf[0]);\n\treturn\
    \ 0;\n}\n```\n\nThis sends the address frame for 0x80 and then the byte 0xE7 to\
    \ select the user register. Next it sends an address frame for 0x81 to read the\
    \ data."
  merge: -1
  img_proc: true
- pgno: 111
  md: "If you run the program you will see:\nRegister = 02\n\nThis is the default\
    \ value of the register and it corresponds to a resolution of 12 and 14 bits for\
    \ the humidity and temperature respectively and a supply voltage greater than\
    \ 2.25V.\n\nThe same program can be written more compactly and more correctly\
    \ using readRegister:\n\n```\n#include \"MicroBit.h\"\nMicroBit uBit;\nint main()\
    \ {\n  uBit.init();\n  uint8_t buf[] = {0};\n  uBit.i2c.readRegister(0x80, 0xE7,\
    \ buf, 1);\n  uBit.serial.printf(\"User Register = %X \\r\\n\", buf[0]);\n  return\
    \ 0;\n}\n```\n\n# The I2C Protocol In Action\n\nIf you have a logic analyzer that\
    \ can interpret the I2C protocol connected, what you will see is:\n\n![](img/23976341c9281123e7b181beea6e9dbd_111_0.png)\n\
    \nYou can see that the write byte function sends an address packet set to the\
    \ device's 7-bit address 0x40 as the high-order bits and the low-order bit set\
    \ to zero to indicate a write. After this you get a data packet containing the\
    \ address of the register, 0xE7. After a few microseconds, it sends the address\
    \ frame again, only this time with the low-order bit set to 1 to indicate a read\
    \ and it then receives back a single byte of data from the device, 0x02."
  merge: -1
  img_proc: true
- pgno: 112
  md: 'If you use the readRegister command you will see the same general exchange
    but now there is no stop bit in the middle:


    ![](img/23976341c9281123e7b181beea6e9dbd_112_0.png)


    This all demonstrates that the external device is working properly and we can
    move on to getting some data of interest.


    # Reading Raw Temperature Data


    Now we come to reading one of the quantities that the device measures, temperature.
    If you look back at the command table you will see that there are two possible
    commands for reading the temperature:


    | Command | Comment |

    | --- | --- |

    | Trigger Temperature Measurement | 0xE3 | Hold master |

    | Trigger Temperature Measurement | 0xF3 | No Hold master |


    What is the difference between Hold master and No Hold master?

    This was discussed in the previous chapter in a general context. The device cannot
    read the temperature instantaneously and the master can either opt to be held
    for the data, i.e. hold master, or released to do something else and poll for
    the data until it is ready.


    The hold master option works by allowing the device to stretch the clock pulse
    by holding the line low after the master has released it. In this mode the master
    will wait until the device releases the line. Not all masters support this mode,
    but the micro:bit does and makes this the simplest option.'
  merge: -1
  img_proc: true
- pgno: 113
  md: "To read the temperature using the Hold master mode you simply send 0xE3\nand\
    \ read three bytes:\n\n```\n#include \"MicroBit.h\"\nMicroBit uBit;\n\nint main()\
    \ {\n    uBit.init();\n    uint8_t buf[3] = {0};\n    uBit.i2c.readRegister(0x80,\
    \ 0xE3, buf, 3);\n    uint8_t msb=buf[0];\n    uint8_t lsb=buf[1];\n    uint8_t\
    \ check=check=buf[2];\n    uBit.serial.printf(\"msb %d\\n lsb %d\\n n checksum\
    \ %d\\n\\r\",\n    msb,lsb,check);\n\n    return 0;\n}\n```\n\nThe buffer is unpacked\
    \ into three variables with more meaningful names:\nmsb - most significant byte;\
    \ lsb - least significant byte; check - checksum.\n\nYou should see something\
    \ like:\n\n+   msb 97\nlsb 232\nchecksum 217\n\nwith the temperature around 20°C.\n\
    \nThe logic analyzer reveals what is happening. First we send the usual address\
    \ frame and write the 0xE3. Then after a short pulse the read address frame frame\
    \ is sent and the clock line is held low by the device (lower trace):\n\n![](img/23976341c9281123e7b181beea6e9dbd_113_0.png)"
  merge: -1
  img_proc: true
- pgno: 114
  md: 'The clock line is held low by the device for over 42ms while it gets the data
    ready. It is released and the three data frames are sent:


    | +500us | | +600us | | +700us | | +800us |

    |---|---|---|---|---||

    | | 0x62 + ACK | | 0x7C + ACK | | 0x09 + NAK | |


    This response is a long way down the logic analyzer''s trace so keep scrolling
    until you find it.


    While clock stretching is the most simple, it sometimes doesn''t work with some
    slave and master combinations.


    Finally we have to find out how to use the No Hold mode or polling method of reading
    the data. It is sometimes useful, although not in the case of the micro:bit. In
    this case we can''t use the read bytes data command because the data will not
    be ready to read and the master will not be forced to wait for it. We have to
    use the two-step, send the command and read the data approach:


    ```

    char buf[4] = {0xF3};

    uBit.i2c.write(0x80, buf, 1);

    while (uBit.i2c.read(0x80, buf, 3) == MICROBIT_I2C_ERROR){};

    ```


    In theory, this polls repeatedly until the data is returned. In practice, it doesn''t
    work. The reason is that there is a fault in the hardware resetting the I2C bus
    and retrying whenever it detects a NAK. The framework tries to compensate for
    this by resetting the I2C bus and retrying. The result is that the data is lost.


    In short, you can''t use polling on with the micro:bit.'
  merge: -1
  img_proc: true
- pgno: 115
  md: "# Processing the Data\n\nOur next task isn't really directly related to the\
    \ problem of using the I2C bus, but it is a very typical next step. The device\
    \ returns the data in three bytes, but the way that this data relates to the temperature\
    \ isn't simple.\n\nIf you read the datasheet you will discover that the temperature\
    \ data is the 14-bit value currently by putting together the most and least significant\
    \ byte and zeroing the bottom two bits. The bottom two bits are used as status\
    \ bits - bit zero currently isn't used and one is a 0 if the data is a temperature\
    \ measurement and a 1 if it is a humidity measurement.\n\nTo put the two bytes\
    \ we use:\n\n```\nunsigned int data6=((unsigned int) msb << 8) | \n(unsigned int)\
    \ (lsb & 0FC);\n```\n\nThis zeros the bottom two bits, shifts the msb up eight\
    \ bits and ORs the two together. The result is a 16-bit temperature value with\
    \ the bottom two bits zeroes.\n\nNow we have raw temperature value, but we have\
    \ still have to convert it to standard units. The datasheet gives the formula\
    \ for temperature in degrees Celsius (°C) as:\n\n-46.85 + 175.72 * data16 / 2^16\n\
    \nThe only problem in implementing this is working out 2^16. You can work out\
    \ 2^s with the expression 1<<x, i.e. shift 1 x to the left.\n\nThis gives:\n\n\
    ```\nfloat temp = (float)(-46.8 + (175.72 *data16/(float)(1<<16)));\n```\n\nAs\
    \ 2^s is a constant that works out to 65536, it is more efficient to write:\n\
    float temp = (float)(-46.8 +(175.72 *data16/(float)65536));\n\nNote the use of\
    \ floating point arithmetic. The microbits's processor doesn't have hardware floating\
    \ point, the framework comes with a software implementation. Floating arithmetic\
    \ is slow and it is usual to convert it into suitably scaled integer arithmetic.\n\
    \nIn this case using floating point is convenient, but there is a snag. The printf\
    \ function doesn't support floating point format. There is another \"full\" version\
