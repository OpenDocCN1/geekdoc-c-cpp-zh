- pgno: 92
  md: '# # Chapter 6


    # # I2C Bus


    The I2C bus, standing for Inter-Integrated Circuit and pronounced I-squaredC,
    is one of the most useful ways of connecting moderately sophisticated sensors
    and peripherals to any processor. The only problem is that it can seem like a
    nightmare confusion of hardware, low-level interaction and high-level software.
    There are few general introductions to the subject because at every I2C bus is
    different, but here we present one.


    I2C is a serial bus that can be used to connect multiple devices to a controller.
    It is a simple bus that uses two active wires, one for data and one for a clock.
    Despite there being lots of problems in using it standardized and devices can
    conflict and generally do things in their own way, it is still commonly used and
    too useful to ignore.


    The big problem in getting started with the I2C bus is that you will find it described
    at many levels of detail - the physical bus characteristics, the protocol, the
    details of individual devices. It can be difficult to relate all of this together
    to achieve whatever that works.


    In fact, you only need to know the general workings of the I2C bus, some general
    features of the protocol and the addresses and commands used by any particular
    device. To explain and illustrate this idea we really have to work with a particular
    device to make things concrete. However the basic stages of getting things to
    work, testing and verification are more or less the same irrespective of the device.
    It is worth mentioning that the micro:bit has two devices already connected to
    its I2C bus, the accelerometer and the magnetometer and we need to look at how
    these work as a separate topic.'
  merge: -1
  img_proc: true
- pgno: 93
  md: '# I2C Hardware Basics


    The I2C bus is very simple. It consists of just two signal lines SDA and SCL,
    the data and clock lines respectively. Each signal line is pulled up by a suitable
    resistor to the supply line at whatever voltage the devices are working at - 3.3V
    and 5V are common choices, The size of the pull-up resistors isn''t critical,
    but 4.7K is typical.


    You simply connect the SDA and SCL pins of each of the devices to the pull-up
    resistors. Or course if any of the devices have built-in pull-up resistors you
    can omit the external resistors. More of a problem is if multiple devices have
    pull-ups. In this case you need to disable all one set.


    ![](img/23976341c9281123e7b181beea6e9dbd_93_0.png)


    The I2C bus is an open collector bus. This means that it is actively pulled down
    by a transistor set to on. When the transistor is off, however, the bus returns
    to the high voltage state via the pull-up resistor. The advantage of this approach
    is that multiple devices can pull the bus low at the same time. That is, an open
    collector bus is low when one or more devices pull it low and high when none of
    the devices is active.


    The SCL line provides a clock which is used to set the speed of data transfer
    - one data bit is presented on the SDA line for each pulse on the SCL line. In
    all cases, the master drives the clock line to control how fast bits are transferred.
    The slave can, however, hold the clock line low if it needs to slow down the data
    transfer.


    In most cases, the I2C bus has a single master device - the micro:bit in our case
    - which drives the clock and invites the slaves to receive or transmit data. Multiple
    masters are possible, but this is advanced and not often necessary.'
  merge: -1
  img_proc: true
- pgno: 94
  md: 'At this point we could go into the details of how all of this works in terms
    of bits. However, the framework handles these details for us. All you really need
    to know is that all communication occurs in 8-bit packets.


    The master sends a packet, an address frame, which contains the address of the
    slave it wants to interact with. Every slave has to have a unique address, usually
    7 bits. On other devices it can be 11 bits, the microbit does not support this.


    One of the problems using the I2C bus is that manufacturers often use the same
    address, or same set of selectable addresses, and this can make particular combinations
    of devices on the same bus difficult or impossible.


    The 7-bit address is set as the high-order 7 bits in the byte and this can be
    confusing as an address that is set to 0x4a in the datasheet The low-bit of the
    address signals a write or read operation depending on whether it is a zero or
    one respectively.


    After sending an address frame, the master sends or receives data back from the
    slave, There are also special signals used to mark the start and end of an exchange
    of packets, but the framework takes care of these.


    This is all you need to know about I2C in general to get started, but it is worth
    finding out more of the details as you need them. You almost will need them as
    you debug I2C programs.


    # Micro:bit I2C


    The micro:bit''s processor has built-in I2C masters. Each one can be connected
    to any of the GPIO pins - that is any two GPIO pins can be used as SCL and SDA.
    For example, However the V1 micro:bit:accelerometer and magnetometer make of GPIO
    P0_0 and P20_8, which are brought out edge connector pins P19 SCL and P20 SDA.
    These pins are configured in mode S00, i.e. they are open collector and pull-up
    resistors are provided on the board. You can use one of the I2C masters to work
    with the accelerometer and magnetometer and the other can be used externally.


    The microbit V2 has an internal I2C bus which is used for the accelerometer and
    magnetometer and hence you can use the bus on P19 and P20 without disturbing them.
    The hardware can work at 100kHz or 400kHz and supports clock stretching, see later.
    It isn''t possible for another master to be on the bus the micro:bit.'
  merge: -1
  img_proc: true
- pgno: 95
  md: '# The I2C Functions


    You can either use the supplied uBit.i2c object or you can create your own using
    the constructor. As always, in most cases you create your own make sure it is
    a global object and don''t create or initialize the uBit:


    MicroBitI2C(`PinName sda, PinName scl)


    For the standard I2C pins on the edge connector use:


    MicroBitI2C(i2C_SDA0, i2C_SCL0)

    For the micro:bit V1, in most cases it is better to use the standard pins if you
    want to avoid problems with the accelerometer and magnetometer.


    Each device on the I2C bus has to have a unique 7-bit address. You can look up
    the address that each device responds to in its datasheet.


    The uBit object has an i2c that you can use without creating your own which accesses
    the external bus. In the case of the micro:bit V2 there is also an _i2c object
    which works with the internal I2C bus.


    Don''t worry about any of the low-level descriptions of how the least significant
    bit is used to determine if a read or write is in operation—and is often reported
    in datasheets as an address for write or one for read. You also need to keep in
    mind that the 7-bit address is sent as the high-order bits in the byte. For example,
    a device might report an address of 0x40 on the bus this would translate to an
    address of 0x80 for write and a read address of 0x81. That is, to write device
    0x40 you use 0x80 and to write it to use 0x81 on the bus. The micro:bit software
    always uses the write address and automatically adds the 1 reading.


    # Write


    There are two functions:


    ```

    int write(int address, const char * data, int length)

    int write(int address, const char * data, int length, bool repeated)

    ```


    What happens when you use one of these is that first an address frame is transmitted.
    The address frame is a byte containing the address of the device you specified.
    Notice that the 7-bit address has to be shifted into the top-most bits and the
    first bit has to be zeroed. So, to write to a device with an address of 0x40,
    you would use 0x80, or equivalently 0x40<<1.


    After the address frame as many data frames are sent as you specified in data
    and length. Notice that a multibyte write involves sending a single address frame.
    This means there is a difference between trying to send a block of data one byte
    at a time, which repeats the address frame, and sending it in one.'
  merge: -1
  img_proc: true
- pgno: 96
  md: 'If you know about the I2C protocol, it is worth saying that the framework deals
    with the start sequence and the address frame, it checks the NAK/ACK bit from
    the slave, sends the data bits, checks the NAK/ACK bit from the slave and sends
    the stop sequence. That is, in normal use, the write transaction sending n bytes
    is:


    ```

    START| ADDR |ACK|DATA0|ACK|DATA1|ACK|...|DataN|ACK|STOP

    ```


    Notice that it is the slave that sends the ACK bit and if the data is not received
    correctly it can send ACK instead.


    A multibyte transfer is quite different from sending n bytes one at a time.


    ```

    START| ADDR |ACK|DATA0|ACK|STOP

    START| ADDR |ACK|DATA1|ACK|STOP

    ```


    You can opt not to send a STOP bit at the end of the write by setting the repeat
    parameter to true. That is, you can arrange to send START bits, address frames
    and as long as the entire sequence finishes with one STOP bit, which releases
    the bus. For multiple writes there is very little point in doing apart from keep
    control of the bus in multi-master setups. However, when you reads and writes
    things a little more complicated, see the next section.


    A standard interaction between master and slave is writing data to a register.
    Many devices have internal storage, indeed some I2C devices are nothing but internal
    storage, e.g. I2C EPROMs. In this case a standard transaction is:


    +   1. Send address frame

    2. Send a data frame with the command to select the register

    3. Send a data frame containing the byte or word to be written to the register


    So, for example, you might use:


    ```

    char buf[]={register,data};

    write(address,buf,2);

    ```


    There is also a command that will write the address and the data in one go:


    ```

    int writeRegister(uint8_t address, uint8_t reg, uint8_t value)

    ```


    Notice the command that has to be sent depends on the device and you have to look
    it up in its datasheet.


    Next we have to look at how to read data from the device. Notice that in many
    transactions a read has to be preceded by a write that tells the device what you
    want.'
  merge: -1
  img_proc: true
- pgno: 97
  md: '# Read


    There are two read functions and they broadly copy the write functions:

    int read (int address,char * data, int length)

    int read (int address,char * data, int length, bool repeated)


    They send an address frame and then read as many bytes from the slave specified.
    In this case the address has to be shifted up one bit and the lower-order bit
    is automatically set to 1 by the function. That is, you use the write address
    in a read function.


    As with the write function, the framework takes care of all the protocol necessary
    to send and receive the packets, including adding 1 to the end of the address.
    The read transaction is:

    START| ADDR|DATA|ACK|DATA|ACK|...|DATAN|NAK|STOP


    The master sends the address and the slave sends the ACK after the address to
    acknowledge it has been received and is ready to send data. Then the slave sends
    bytes one at a time and the master sends ACK in response to each byte. Finally,
    the master sends a NAK to indicate that the last byte has been read and then a
    STOP bit. That is the master controls how many bytes are transferred. In the case
    of the read functions, a block transfer of n bytes is different from transferring
    n bytes at a time.


    A very standard transaction is to read a register. As in the case of writing a
    register, this involves sending the address and a command to select the register,
    but then you need to read the returned data. This requires the address frame to
    be sent again.


    That is, to read a register you need a complete write and a complete read operation.
    So, for example, to read a register, with address reg, you would use something
    like:


    ```

    char buf[]={reg};

    write(address,buf,1);

    read(address,buf,1);

    ```


    If the register sends multiple bytes then you can sometimes read one after another
    without sending an address frame each time as a block transfer. In this case the
    transaction is:


    ```

    START| ADDR|ACK|register|ACK|STOP|START|ADDR|ACK|data|NAK|STOP

    ```'
  merge: -1
  img_proc: true
- pgno: 98
  md: 'Notice that there a STOP followed by START in the middle of the transaction.
    In principle, a STOP frees the bus and another master could take over or the current
    master start talking to a device before issuing the next START to read the register.


    In theory, and mostly in practice, a multiple interaction with a slave can work
    with a STOP-START separating each transaction or just repeated START bits and
    a STOP only at the very end of the transaction. However, you will find that some
    devices state that they need repeated START and no STOP bits in continued transactions.
    In this case you need to be careful what you send and receive data. For example,
    to read a register from a device that requires repeated START bits but no STOP
    bit you would use:


    ```

    char buf[]={reg};

    write(address,buf,1,true);

    read(address,buf,1);

    ```


    This would send an address frame, the register address, and then a START bit without
    a STOP, read the data from the slave and finally send a NAK a STOP.

    START| ADDR|ACK|register|ACK|START|ADDR|ACK|data|NAK|STOP


    In practice, it doesn''t make any difference if you send a STOP in the middle
    of a write/read transaction, but you need to know about it in case.


    There is also a combined readRegister:

    int readRegister(uint8_t address, uint8_t reg)


    This returns a single-byte result. For a multi-byte reply you can use:

    int readRegister(uint8_t address, uint8_t reg, uint8_t* buffer, int length


    This fills the buffer with the number of characters specified by the length parameter.


    # Slow Read


    This raises for the first time the question of how we cope with the speed at which
    a slave can respond to a request for data. There are two broad approaches to waiting
    for data on the I2C bus. The first is simply to request the data and then perform
    reads in a polling loop. If the device isn''t ready with the data it sends a data
    frame with a NAK bit. The read functions return a MICROBIT_I2C_ERROR if it fails
    or MICROBIT_OK if it works.

    Of course, the polling loop doesn''t have to be "tight". The response time is
    often long enough to do other things and you can use the I2C bus to work with
    other slave devices while the one you activated gets on trying to get the data
    you requested. All you have to do is remember to read its data at some later time.'
  merge: -1
  img_proc: true
- pgno: 99
  md: 'The second way is to allow the slave to hold the clock line low after the master
    has released it. In most cases the master will simply wait moving on to the next
    frame while the clock is held low. The microbit I2C bus implements this clock
    stretching protocol and it will wait until the slave releases the clock before
    proceeding.


    This is very simple and it means you don''t have to implement a polling loop,
    but also notice that your program is frozen until the slave releases the clock
    line. Many devices implement both types of slow read protocol and you can use
    whichever suits your application.


    There is also the small speed of the I2C clock. Most slave devices don''t have
    a strict clock rate as they are designed as static devices synced to whatever
    SCL clock rate the master cares to. If it turns out to be too fast most will use
    clock stretching. In extreme cases it may be necessary to slow down the slave
    device, or even speed up the master''s clock.


    By default the I2C clock runs at 100K you can use the V1 function:


    ```

    or the similar V2 function:

    setFrequency(int hz);

    ```


    Notice that hz can only be one of 100000, 250000 or 400000. If you use anything
    else, the nearest standard value is used.


    # Using The Built-in Devices


    As already mentioned, there are two built-in I2C devices, the accelerometer and
    the magnetometer. The framework provides special functions that work with both
    of these devices and they are the ones to work with either device. The way they
    work is fairly straightforward and you can find out more from the documentation.


    If you do want to work directly with the internal devices then there is a complication.
    The different versions of the microbit use different accelerometer and magnetometer
    chips and even the same version can use one of two types.


    This makes programming more difficult and the framework provides a unified way
    of accessing them all.'
  merge: -1
  img_proc: true
- pgno: 100
  md: '| Accelerometer | magnetometer (compass) |

    |---|---||

    | micro-bit V1.3 (MMA8653+MAG3110) | 0x1D (0x3A/03B) | 0x0E (0x1C/01D) |

    | micro-bit V1.5 variant 1 (LSM303AGR) | 0x19 (0x32/033) | 0x1E (0x3C/03D) |

    | micro-bit V1.5 variant 2 (FXOS8700CQ) | 0x1F (0x3E/03F) | 0x1F (0x3E/03F) |

    | micro-bit V2.0 (LSM303AGR) | 0x19 (0x32/033) | 0x1E (0x3C/03D) |

    | micro-bit V2.0 (FXOS8700CQ) | 0x1F (0x3E/03F) | 0x1F (0x3E/03F) |


    The values in brackets are the shifted addresses for write/read.


    # ## micro-bit V1.3


    The accelerometer is a MMA8653 and you can find out how it works from its datasheet.
    It has I2C address 0xD. The magnetometer is a NXP MAG3110 and its datasheet reveals
    that it is I2C address 0xE0.


    Of the two devices, the magnetometer is the simpler and so it provides a better
    introductory example. If you examine its datasheet you will find a table of registers:


    | Name | Type | Address | Default | Comment |

    |---|---|---|---|---|

    | DR_STATUS | R | 0x00 | 0000 000 | Data status per axis |

    | OUT X_MSB | R | 0x01 | (0x03) | Bits [15:8] of X measurement |

    | OUT X_LSB | R | 0x02 | | Bits [7:0] of X measurement |

    | OUT Y_MSB | R | 0x03 | (0x05) | Bits [15:8] of Y measurement |

    | OUT Y_LSB | R | 0x04 | | Bits [7:0] of Y measurement |

    | OUT Z_MSB | R | 0x05 | (0x07) | Bits [15:8] of Z measurement |

    | OUT Z_LSB | R | 0x06 | | Bits [7:0] of Z measurement |

    | WHO AM_I | R | 0x07 | 0xC4 | Device ID Number |

    | SYSMOD | R | 0x08 | data | Current System |

    | OFF X_MSB | R/W | 0x09 | 0000 000 | Bits [14:7] of user offset |

    | OFF X_LSB | R/W | 0x0A | 0000 000 | Bits [6:0] of user X offset |

    | OFF Y_MSB | R/W | 0x0B | 0000 000 | Bits [14:7] of user Y offset |

    | OFF Y_LSB | R/W | 0x0C | 0000 000 | Bits [6:0] of user Y offset |

    | OFF Z_MSB | R/W | 0x0D | 0000 000 | Bits [14:7] of user Z offset |

    | OFF Z_LSB | R/W | 0x0E | 0000 000 | Bits [6:0] of user Z offset |

    | DIE_TEMP | R | 0x0F | data | Temperature, signed 8 bits in C |

    | CTRL_REG1 | R/W | 0x10 | 0000 0000 | Operation modes |

    | CTRL_REG2 | R/W | 0x11 | 0000 0000 | Operation modes |'
  merge: -1
