- pgno: 13
  md: '# Why Choose a Micro:bit?


    There are many different choices you can make for a small, low-cost programmable
    device - Raspberry Pi, Raspberry Pi Pico, Arduino and so on. The micro:bit is
    a self-contained device in the sense that it has a simple display, input buttons,
    accelerometer, temperature sensor and magnetometer. It also has a radio, although
    it lacks full WiFi capabilities and relies on Bluetooth or ad-hoc communication.
    From the hardware point of view it is more capable than a Raspberry Pi or basic
    Arduino for many applications. It isn''t powerful enough to run Linux and this
    can be considered an advantage or a disadvantage based on the use.


    The micro:bit''s being a ready-built community of users is both a plus and a minus.
    It means that there have a very skewed set of interests. And easy-to-use languages
    such as Python and Scratch are the most important and powerful languages as C/C++
    are a minority interest. There is also the problem of closed communities. If you
    are a teacher then there is no problem at all, but for the general programmer
    and there are communities that you cannot join. Even if you can much of the conversation
    around teaching issues, and while it is inspiring to see what pupils do, it can
    become repetitive. In addition, the interests of the not-for-profit Micro:bit
    Educational Foundation tend to be market-oriented. What all this means is for
    the general user the support provided for the micro:bit isn''t as good as you
    might expect given the number of devices and users that are claimed.


    # The Software


    If you choose to program the micro:bit in one of the officially supported environments,
    MakeCode or MicroPython, then you have few problems. The environment makes coding
    easy and covers up any differences between V1 and V2 devices. If you choose to
    code in C/C++, which is a good idea if you want to do anything out of the ordinary,
    then you face some challenges.


    The first thing to explain is that the micro:bit is an mbed device. Mbed is a
    project started by Arm to promote the 32-bit ARM Cortex-M as an IoT device. The
    mbed operating system is designed to make a range of ARM-based devices work in
    the same way. It is a low-level operating system that provides uniform access
    to various pieces of hardware. The V1 micro:bit uses mbed version 2, which has
    now been deprecated. It also has to be said that the micro:bit never really seemed
    a good fit with the more professional devices it was sharing the mbed website
    with. Today support for the micro:bit'
  merge: -1
  img_proc: true
- pgno: 14
  md: 'still exists, but it hasn''t been upgraded and isn''t likely to be. The newer
    mbed tools, such as the offline development tool, Mbed Studio, don''t support
    the micro:bit and even finding the micro:bit page, if you don''t know where it
    is, is difficult. The problem is exacerbated by the fact that the C/C++ system
    makes use of a build tool called Yotta, which was developed specifically for mbed.
    While the Yotta project is still alive, there is very little activity on its GitHub
    site and facilities like the Yotta registry have been deprecated.


    The software used by the V1 micro:isn''t simpel. The mbed operating system sits
    on top of a lower-level library that works with the hardware, the NRF5 SDK, and
    on top of it is CODAL (Component Oriented Device Abstraction Layer), a library
    created by Lancaster University to provide a higher level access to the devices.


    ![](img/23976341c9281123e7b181beea6e9dbd_14_0.png)


    The latest V2 micro:bit is no longer an mbed device and the CODAL software has
    grown to replace mbed:


    ![](img/23976341c9281123e7b181beea6e9dbd_14_1.png)


    15'
  merge: -1
  img_proc: true
- pgno: 15
  md: 'This means that you can no longer use the mbed online compiler, or any of the
    mbed tools, for the V2 micro:bit. Instead you have to use the GCC cross compiler,
    or similar, and the libraries provided by Lancaster University.


    This software split between the two versions of the micro:bit also causes a problem
    in distributing software. Although it is claimed that the two versions are compatible,
    this is not quite true. A new combined hex format has been defined that can accommodate
    V1 and V2 code. It is up to you to build your programs for each device and create
    a single new hex file that can be downloaded both versions of the micro:bit. If
    you only want to support one of the versions this is not an issue.


    At the time of writing only the V2 device is on, but there are far more V1 devices
    in use. In an ideal world we would concentrate on the V2 as software isn''t deprecated,
    but this isnt likely to be reasonable for some time, if ever. Chapter 2 explains
    how to set up development environments for both versions and differences are indicated
    in subsequent chapters as we create programs. In theory it would be possible to
    create a single development environment for both versions of the micro:bit but
    the amount of work involved that this is unlikely to happen. Indeed it is unlikely
    that will be any significant improvements to the micro:bit V1 software at all.


    # Why C/C++?


    Before you spend time finding out how to program in C/C++ there is the good question
    of why bother? After all, the micro:bit''s own website offers the choice of Touch
    Develop, JavaScript and MicroPython to program it and they are all fairly easy
    to use.


    The answer to the question of why C/C++ is that it gets closest to the hardware.
    Not from the higher-level languages. For example, at the moment, you can get full
    access to the micro:bit''s radius. Using C/C++ and the microbit Bluetooth radio
    as a simple point-to-point radius connection between microbits. This makes it
    possible to build radio control robots and similar gadgets, something much harder
    if all of the connections have to go through the Bluetooth stack. Another example
    is the LED control. In MicroPython you have nine brightness levels, in the micro:bit''s
    other supplied languages the LEDs are either on or off. In C/C++ you can set any
    of 255 levels.'
  merge: -1
  img_proc: true
- pgno: 16
  md: 'Going beyond standard hardware you can also implement missing hardware facilities.
    For example, there is no SPI bus available under any of the supplied languages,
    only an I2C bus. Using C++ you can access a standard SPI driver and work with
    SPI peripherals. You can even use your own code to implement protocols that are
    not supported, such as the 1-Wire bus and the DHT11/22 temperature sensor.


    The reason you can implement these additional protocols is that C++ is as fast
    as you can get on any machine. You might not be able to get some more speed out
    of an assembly language version of the program, but it would only be a few percent.
    Using C++ lets your programs run tens of times faster. For example, the Blinky
    program given in the next chapter runs about 20 times faster than the equivalent
    MicroPython program. When you are writing an embedded program speed really does
    matter. You might not be able to write it in MicroPython and have to move to C++.
    If you can''t write it in C++ then there is a good chance it can''t be done using
    the hardware you have.


    C++ isn''t significantly harder to work with other languages. C is particularly
    simple and easy to use. The micro:bit library is written in C++, but for most
    of the time you can make use of it in a dialect of C which is quite enough for
    the task.


    The only downside of using C++ is the difficulty and time involved in setting
    up a development environment. To overcome this hurdle, this book provides ready-made
    templates, introduced in Chapter 2, which enable you to quickly get on with writing
    C/C++ code. If you want to know how to do the same job from scratch see the Appendices.


    The system software is written in C++ and is object-oriented. This doesn''t mean
    that you have to write your own programs in C++. In most cases you can restrict
    your attention to C, the much simpler subset of C++, and still take advantage
    of the objects the system provides. All of the examples in this book restrict
    themselves to C for simplicity.'
  merge: -1
  img_proc: true
- pgno: 17
  md: '# Summary


    +   - The micro:bit is a largely education-oriented device, but it has many good
    properties that make it suitable for other projects.


    +   - The emphasis on education is an advantage if you are working in education,
    otherwise it can be a problem as you cannot gain access to private educational
    communities.


    +   - The original micro:bit exists in two versions, V1.3 and V1.5, which are
    largely compatible mbed devices and can be programmed using the same development
    environment.


    +   - The micro:bit V2 is faster and more capable and is no longer an mbed device.
    It needs a different development environment.


    +   - To support both V1 and V2 devices you need to compile a version of your
    program for each and produce a targeted hex file for each.


    +   - A new combined hex file format allows the packaging of V1 and V2 versions
    of a program in a single hex installation file.


    +   - Although the system software for bothV1 and V2 is written in C++, the application
    programs we''ll write in C for simplicity.'
  merge: -1
  img_proc: true
- pgno: 18
  md: '# Chapter 2


    # Getting Started With C


    Anyone who wants to use the BBC micro-bit to its full potential as an IoT device
    needs to look outside the coding environments provided by its own website and
    for this you need a development environment and a toolchain.


    As already explained, the original micro:bit is an mbed device and as such you
    can use some of the tools provided the mbed organization. In particular, you can
    use the online compiler as an easy way to create your C programs as outlined in
    Appendix I. However, this only works for micro:bit V1 and as is based on deprecated
    software, it isn''t a good long-term choice. The complete solution to V1 development
    is to install and use Yotta, the mbed build system, which is complicated and best
    avoided if possible. However, you should need Yotta you can find full details
    in Appendix II.


    To make it easy to get started, you''ll find a complete template for a V1 C program
    on the I Programmer GitHub repository: https://github.com/I-Programmer-info


    which you can simply customize and use. All of the programs in this book will
    run using the template without modification and this is the recommended way of
    getting starting. While this has the advantage of a quick start, any out of the
    ordinary configuration that you make independently might involve refactoring the
    template''s Cmake build files.


    The microbit V2 isn''t an mbed device, and so the option of using the online compiler
    isn''t available, but it retains backward compatibility with Yotta. This means
    you can use Yotta to build a project, but in most cases it is much simpler to
    download the appropriate template from the I Programmer GitHub repository and
    customize it. As in the case of V1, this is the quickest way to get started and
    all of the programs in this book without having to modify the template.'
  merge: -1
  img_proc: true
- pgno: 19
  md: '# Prerequisites


    It doesn''t matter whether the micro:bit you are using is a V1 or V2, the prerequisites
    for getting started are the same. To develop C/C++ programs for the micro:bit
    using the templates you need the GCC ARM compiler together with Cmake and Ninja
    (or make on non-Windows systems). To compile the code you also need first the
    arm-none-gcc compiler. This can be downloaded from a number places: https://developer.arm.com/tools-and-software/open-source-software/developer-tools/gnu-toolchain/gnu-rm/downloads


    Run the installer and follow the instructions. Make sure to tick Add path to environment
    variable at the end of the installation:


    ![](img/23976341c9281123e7b181beea6e9dbd_19_0.png)


    The compiler is installed in:

    :\Program Files (x86)\GNU Arm Embedded Toolchain


    You can check that it is installed and on the path using: arm-none-eabi-gcc -v\
    which will display a lot of information about the version and configuration.


    Next you need to install Cmake:

    https://cmake.org/download/'
