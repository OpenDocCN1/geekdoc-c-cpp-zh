- pgno: 2
  md: '# Preface


    The BBC micro:bit is a remarkable device capable of taking on a variety of roles.
    When it was originally launched in 2015 it was the preserve of school children,
    with one million given away free secondary schools in the UK and the emphasis
    was on introducing this audience to programming and digital technology. By the
    time the first edition of this book was written it had gone on public sale and
    the fact that it is an ideal vehicle for IoT could come to the fore.


    Writing this new edition was prompted by the advent of the micro:bit V2, an enhanced
    version based on a different, more powerful microprocessor. Whereas the original
    version is an mbed device, the V2 has broken free, giving it new capabilities
    but also presenting problems by not being fully backward compatible with its predecessor.


    Tempting as it might be to disregard the earlier version, the fact that there
    are many of them, more than four million "in the world" and that many people have
    already invested time and effort in working projects, rules out this option, so
    this book caters for both versions and points out the differences that might trip
    up the unwary developer.


    This book isn''t an introduction to the micro:bit. For you you recommended to
    visit its own website, https://www.microbit.co.uk/ where you will find activities
    with step-by-step guidance for beginners. Instead this book assumes you have taken
    your first steps with programming, with an interest in electronics and want to
    use the micro:bit for Internet of Things projects, that is in any situation in
    which you want to interact with real worlds.


    While much of the introductory material for the micro:bit uses MicroPython, this
    book uses C in order to realize its full potential as an IoT device. The main
    reason for choosing C is speed is crucial when you are writing programs to communicate
    with the outside world.


    Whereas the first edition used NetBeans and Yotta this book uses Visual Studio
    Code as its development environment. The only problem with this is setting it
    up and to make this easier there are two templates, for the V1 and one for the
    V2 available for download from the I GitHub repository. You don''t need to use
    these however if you are feeling up to tackling Gotta and Cmake from scratch.
    How to do this is described in the appendices at the end of the book.


    After setting everything up and compiling and running a sample program we move
    on to a "Binky" C program. Now we are ready to discover how to control the microbit''s
    I/O lines, exploring the basis of using the GPIO. For speed, however, we need
    to work directly with the raw hardware and also master memory mapping, pulse width
    modulation and other more sophisticated types.'
  merge: -1
  img_proc: true
- pgno: 3
  md: 'From here we can start connecting sensors using first the I2C bus, then by
    implementing a custom protocol for a 1-Wire bus, and eventually adding eight channels
    of 12-bit A-to-D with the SPI bus, which involves some subtle difficulties. We
    then look at serial connections, one of the oldest ways of connecting devices
    but still very useful. The micro:bit lacks WiFi connectivity, but using a low-cost
    device we enable a connection to the Internet via its serial port which allows
    it to become a server.


    Next we look at the micro:bit''s LED display. This may only be 5x5, but it is
    very versatile, especially when you use pulse width modulation to vary the brightness
    level, something we demonstrate in a classic game, written of course in C. Finally
    we look at how to use the radio and the new sound capabilities of the micro:bit
    V2 and finish with an example of a two-way Morse code link.


    Thanks as ever to my painstaking editors Sue Gee and Kay Ewbank for their input
    to this edition. For updates, errata, links to resources and the source code for
    the programs in this book visit its dedicated page on the IO Press website: www.iopress.info.


    Harry Fairhead

    February, 2021'
  merge: -1
  img_proc: true
