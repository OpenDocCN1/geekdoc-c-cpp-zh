- pgno: 32
  md: '# Chapter 3


    # First Steps With The GPIO


    The most basic task when working with the micro:bit is controlling the I/O lines.
    This isn''t difficult if you use the framework provided, but there some subtle
    points to watch out for.


    The microbit has at least 32 General Purpose I/O (GPIO) lines, although not all
    of them are available for use. Finding out how to use them is an important first
    step and you have to master both the hardware and the software aspects.


    Warning: Despite the ease of making connections to the micro:bit using hoc cables
    and clips, the GPIO lines are very low power and sensitive to voltages and currents
    outside their normal range. Do not connect anything to the micro:bit, especially
    for output, without considering the voltage and current applied to the GPIO line.
    The voltage should be 3.3V or less and the current should be 0.5mA or less.


    # Pinouts


    The big irritation of working with any electronic device that has GPIO lines is
    what you call them. The manufacturer will give them names like GPIO 01, GPIO 02
    and so on, but when the processor is used in a finished product like the microbit
    these lines are brought out to physical pins, connections, on the printed circuit
    board. These are often called Pin01, Pin02 and so on and there is no need for
    Pin01 to correspond to GPIO 0. Indeed, in most cases pin numbers and GPIO numbers
    are fairly independent. Why does this matter? The main reason is the low-level
    documentation provided by the chip manufacturer generally uses GPIO numbers and
    the documentation provided by the device manufacturer generally uses pin numbers.
    You can see the potential for confusion and mistakes.


    The microbit uses a strange system of pin names, connector numbers, PCB connector
    and what are printed on the edge connector and these correspond to different GPIO
    numbers. They are also extended to include the GPIO lines used to control on-board
    peripherals. For example, P0 is the first “pad” on all micro:bits, but it corresponds
    to GPIO line 3 in the V1 and line 2 in the V2. It is also pin 18 on the physical
    edge connector. On the schematic diagram, the same pin is labeled PAD1 just to
    increase the confusion.'
  merge: -1
  img_proc: true
- pgno: 33
  md: 'The definition of the constants can be found in the header files. The pin names
    are what you use within programs that make use of the framework and the GPIO numbers
    are what the framework maps to in the hardware:


    | Pin Name | GPIO V1 | GPIO V2 |

    |---|---|--|

    | MICROBIT_PIN_P0 | P_03 | P_02 |

    | MICROBIT_PIN_P1 | P_02 | P_03 |

    | MICROBIT_PIN_P2 | P_01 | P_04 |

    | MICROBIT_PIN_P3 | P_04 | P_31 |

    | MICROBIT_PIN_P4 | P_05 | P_28 |

    | MICROBIT_PIN_P5 | P_17 | P_14 |

    | MICROBIT_PIN_P6 | P_12 | P_05 |

    | MICROBIT_PIN_P7 | P_11 | P_11 |

    | MICROBIT_PIN_P8 | P_18 | P_10 |

    | MICROBIT_PIN_P9 | P_10 | P_09 |

    | MICROBIT_PIN_P10 | P_06 | P_30 |

    | MICROBIT_PIN_P11 | P_26 | P_23 |

    | MICROBIT_PIN_P12 | P_20 | P_12 |

    | MICROBIT_PIN_P13 | P_23 | P_17 |

    | MICROBIT_PIN_P14 | P_22 | P_01 |

    | MICROBIT_PIN_P15 | P_21 | P_13 |

    | MICROBIT_PIN_P16 | P_16 | P_02 |

    | MICROBIT_PIN_P19 | P_00 | P_26 |

    | MICROBIT_PIN_P20 | P_30 | P_00 |


    There are some differences between the V1 and V2 GPIO assignments. The micro:bit
    V1 has a single bank of 32 GPIO lines, P_00 to P_31. The micro:bit V2 has an additional
    set of ten GPIO lines, P_00 to P_09– most of which are used internally. You can
    see that, for example, MICROBIT_PIN_P20 is mapped to P_30 on the V1 and to P_00
    on the V2, i.e. the first GPIO line in the second GPIO bank. There are also a
    set of definitions for p0 to p47, notice the use of lower case, which includes
    both banks of GPIO lines without distinguishing between them but with P1_0 mapped
    to P32 and so on.

    Only use the GPIO line numbers if you can''t avoid it as the pin names work on
    both versions of the micro:bit. For example if you use MICROBIT_PIN_P20 it will
    evaluate to either P_30 or P1_00 depending on which version you are compiling
    for.

    There are also other pin intended for use with events.'
  merge: -1
  img_proc: true
- pgno: 34
  md: 'The pinout diagrams for both V1 and V2 can be seen below:


    As you can see in the standard pinout diagrams, most of the GPIO lines already
    have jobs. If you want to use them for your own purposes then whatever they are
    doing for the micro:bit has be turned off. For example, if you use any of the
    GPIO lines that are assigned to the LED display then you cannot use the LED display
    and if you do this this will take over the GPIO lines that you are using.


    ![](img/23976341c9281123e7b181beea6e9dbd_34_0.png)


    The only GPIO lines that are completely free to use are without blocking access
    to other features are:


    +   Free GPIO Pins

    MICROBIT_PIN_P0

    MICROBIT_PIN_P1

    MICROBIT_PIN_P2

    MICROBIT_PIN_P8

    MICROBIT_PIN_P9 - V2 only

    MICROBIT_PIN_P16


    If you are prepared not to use the LED display then you can add to this list:


    +   LED Display Pins

    MICROBIT_PIN_P3

    MICROBIT_PIN_P4

    MICROBIT_PIN_P6

    MICROBIT_PIN_P7

    MICROBIT_PIN_P9

    MICROBIT_PIN_P10'
  merge: -1
  img_proc: true
- pgno: 35
  md: 'If you are prepared not to use Button A and Button B you can add:


    # Button Pins

    MICROBIT_PIN_P5

    MICROBIT_PIN_P11


    In most cases you probably won''t want to make use of the SPI bus so you can

    to the list:


    # SPI Bus Pins

    MICROBIT_PIN_P13

    MICROBIT_PIN_P14

    MICROBIT_PIN_P15


    Finally we have two pins dedicated to the I2C bus which you can use, but

    yneed to know that in the microbit V1 these are connected to the

    accelerometer and magnetometer which you cannot use if you take them out.

    Notice that you can use them for your devices on the I2C bus without

    disabling the on-board devices:


    # I2C Bus Pins

    MICROBIT_PIN_P19

    MICROBIT_PIN_P20


    There are also some GPIO used internally and not brought out onto the

    edge connector. For example, as well as six pins on the edge connector, the

    LED display may use of:


    | LED MATRIX COLS | V2 |

    | COL1 = p0_4 | P0_28 |

    | COL2 = p0_5 | P0_11 |

    | COL3 = p0_6 | P0_31 |

    | COL4 = p0_7 | P1_05 |

    | COL5 = p0_8 | P0_30 |

    | COL6 = p0_9 | |

    | COL7 = p0_10 | |

    | COL8 = p0_11 | |

    | COL9 = p0_12 | |


    | V1 | V2 |

    | ROW1 = p0_13 | P0_21 |

    | ROW2 = p0_14 | P0_22 |

    | ROW3 = p0_15 | P0_15 |

    | ROW4 = | P0_24 |

    | ROW5 = | P0_19 |'
  merge: -1
  img_proc: true
- pgno: 36
  md: 'The USB serial interface uses:


    | RX AND TX PINS |

    | V1 | V2 |

    | USBTX = p25 | UART_TX = p6 |

    | USBRX = p24 | UART_RX = p8 |


    Finally three GPIO pins are used as interrupt lines from the accelerometer and
    magnetometer:


    +   - ACCEL INTERRUPT PINS (MMA8653FC)

    - ACCEL INT2 = p27

    - ACCEL INT1 = p28

    - MAGNETOM INTERRUPT PIN (MAG3110)

    - MAG_INT1 = p29


    Notice that while you can''t use any of these internal GPIO lines for your own
    devices, knowing what they control can still be useful.


    # GPIO Capabilities


    Another complication is that GPIO lines can be assigned to other internal devices
    within the processor that are not used by default. For example, the serial hardware
    (UART) can make use of any two GPIO lines for its RX and TX pins and not just
    the default pins connected to the USB port.


    There is a single A-to-D (analog to digital) converter device and this can be
    connected to any of a subset of GPIO lines that act as analog inputs. To create
    analog outputs, the pulse width modulation (PWM) capabilities of some of the GPIO
    lines is used, see Chapter 5. By pairing the A to D with the D to A some of the
    pins are designated as analog-capable i.e. capable of both input and output.


    Analog GPIO Pins


    +   - MICROBIT_PIN_P0

    - MICROBIT_PIN_P1

    - MICROBIT_PIN_P2

    - MICROBIT_PIN_P3

    - MICROBIT_PIN_P4

    - MICROBIT_PIN_P10


    Notice that MICROBIT_PIN_P1, P3, MICROBIT_PIN_P4 and MICROBIT_PIN_P10 are involved
    in driving the LED display and this allows for some interesting possibilities,
    such as using the array as a light sensor.


    In the case of the microbit there is also a GPIO mode that allows you to use the
    pin as debounced high impedance input on pins MICROBIT_PIN_P0, MICROBIT_PIN_P1
    and MICROBIT_PIN_P2. This makes it easy to use things like bananas, apples and
    other objects as creative input devices. The basic idea is that, as a high impedance
    input, only a small amount of current is needed to change the input state from
    zero to one and this can be provided by everyday objects which represent high
    resistance paths to earth.'
  merge: -1
  img_proc: true
- pgno: 37
  md: "# Digital GPIO\n\nWith all of these possibilities, using the GPIO lines can\
    \ seem quite complicated. For simplicity, and because it is the most common way\
    \ they are used, we will concentrate on their use as simple digital I/O lines,\
    \ and for the moment, ignore analog, PWM and touch inputs and their use using\
    \ I2C and SPI buses, all of which are covered in later chapters.\n\nThe basic\
    \ interface to the GPIO lines is the MicroBitPin object. You can create and use\
    \ MicroBitPin objects as needed or you can use the MicroBitPin objects created\
    \ on the uBit object. If you create your own MicroBitPin objects create them as\
    \ global objects and do not create a uBit object.\n\nFor example, to access P0\
    \ you can use:\n\n```\n#include \"MicroBit.h\"\nMicroBit uBit;\nint main() {\n\
    \  uBit.init();\n  uBit.io.P0.setDigitalValue(1);\n}\n```\n\nor\n\nDon't worry\
    \ about the MicroBitPin constructor or the setDigitalValue function. All that\
    \ matters at the moment is that you see the two ways of getting a GPIO line.\n\
    \nIf you are not troubled by resource shortages the uBit object approach because\
    \ it frees you from having to instantiate a MicroBitPin object for each pin. If\
    \ you are having resource problems instantiating only the objects you are going\
    \ to use is a better strategy.\n\nNotice that when you use the uBit object the\
    \ GPIO lines are just referred to as P0, P1 and so on. Notice that these aren't\
    \ just numbers but complete objects that provide access to the GPIO lines. Compare\
    \ the difference between uBit.io.P0 and MICROBIT_PIN_ The first is an object with\
    \ methods and properties and the second is just a number that indicates which\
    \ GPIO line to use. Low-level functions that work with GPIO lines tend to need\
    \ the number of the GPIO, but higher-level functions need a MicroBitPin object."
  merge: -1
  img_proc: true
- pgno: 38
  md: 'If you want to create MicroPin objects then the constructor allows you to specify
    an event id, pin name and pin capability, i.e. what you are going to use the pin.


    ```

    MicroBitPin(int id, PinName name, PinCapability capability)

    ```


    In most cases you use the message bus id provided for you. PinCapability is one
    of:


    +   - PIN CAPABILITY DIGITAL

    - PIN CAPABILITY ANALOG

    - PIN CAPABILITY AD

    - PIN CAPABILITY ALL


    Compared to other GPIO libraries the strangest thing about the micro:bit framework
    is it doesn''t have functions that set the direction of a GPIO line. Instead the
    direction is set the first time you try to read or write a line. To write a 0
    or a 1 to the line you would use:


    ```

    int setDigitalValue(int value)

    ```


    and to read a line:


    ```

    int getDigitalValue()

    ```


    This approach has the advantage of not needing much in the way of initialization,
    but if the line isn''t already set up correctly for reading or writing then it
    takes extra time to configure it. What this means that the first time you read
    or write a line it can take longer than the second and subsequent time. As a result
    it is sometimes necessary to do an extra read or write to the line before you
    start using it as a way of setting things up.


    Apart from these two main functions, there are a few useful utilities. You can
    test to see if a GPIO line is currently a digital line and if it is an input or
    an output:


    ```

    int isDigital()

    int isInput()

    int isOutput()

    ```


    # Drive Type


    The GPIO output can be configured into one of a number of modes but the most important
    is pull-up/down. Before we get to the code to do the job it is worth spending
    a moment explaining the three basic output modes, push-pull, pull-up and pull-down.'
  merge: -1
  img_proc: true
- pgno: 39
  md: '# Push-pull Mode


    In push-pull mode, which is the standard configuration for a GPIO output, two
    transistors of opposite polarity are used:


    ![](img/23976341c9281123e7b181beea6e9dbd_39_0.png)


    The circuit behaves like the two-switch equivalent shown on the right. Only one
    of the transistors, or switches, is "closed" at any time.


    If the input is high then Q1 is saturated and the output is connected to ground
    - exactly as if S1 was closed. If the input is low then Q2 is saturated and it
    is as if S2 was closed and the output connected to +V. You can see that this pushes
    the output line high with the same "force" as it pulls it low.


    # Pull-up Mode


    In pull-up mode one of the transistors is replaced by a resistor. It is used,
    for example, in a serial bus configuration like the I2C bus. In this case the
    circuit is equivalent to having a single switch. When the switch is closed the
    output line is connected to ground and hence driven low. When the switch is open
    the output line is pulled high by the resistor.


    ![](img/23976341c9281123e7b181beea6e9dbd_39_1.png)'
  merge: -1
  img_proc: true
- pgno: 40
  md: 'You can see that in this case the degree of pull-down is greater than the pull-up,
    where the current is limited by the resistor. The advantage of this mode is that
    it can be used in an AND configuration. If multiple GPIO or other lines are connected
    to the output, any one of them being low will pull the output line low. Only when
    all of them are off the resistor succeed in pulling the line high.


    # Pull-down Mode


    Finally pull-down mode is exactly the same as the pull-up only now the resistor
    is used to pull the output line low. In the case of the pull-down mode the line
    is held high by the transistor but pulled low by the resistor only when all the
    switches are open. Putting this the other way round, the line is high if any one
    switch is closed.


    ![](img/23976341c9281123e7b181beea6e9dbd_40_0.png)


    To set the mode for a GPIO line the function to use:

    int setPull (PinMode pull)

    where pull is any of:


    +   - V1 Pullup Pulldown PullNone

    - V2 PullMode::Up PullMode::Down PullMode::None


    PullNone is the default and the value of the pull-up/down resistor is in the range
    10 to 16K. What this means is that in most cases you will probably have to add
    an external pull-up/down resistor to bring the resistance down.'
  merge: -1
  img_proc: true
- pgno: 41
  md: '# GPIO Drive Characteristics


    There is an important question to be answered - what can be safely connected to
    a GPIO line?


    There is no problem connecting things to GPIO lines to input, which is the default.
    The only thing you have to check is that the input doesn''t go above 3.3V. If
    it does you could damage the GPIO line and the micro:bit.


    When it comes to output you have to be much cautious to avoid damage to the micro:bit.
    It is all a matter of how current the line can source or sink. Obviously, the
    output voltage between 0V and 3.3V, is the working voltage of the micro:bit. So
    you can only connect devices which can operate at 3.3V, but there is also the
    issue of how much current the device needs to operate.


    One of the most difficult specifications to find is how much current the GPIO
    lines will provide. The reason is partly that the situation is complicated. There
    are a number of ways that the GPIO line can be set up and there is a limit on
    the total current in all of the lines and as a per-line limit.


    What is very clear, however, that the current-handling ability of the micro:bit
    is very low. This is a problem of the way that the GPIO lines are made very easy
    to access. Using clips and plugs makes it all too easy to connect a device directly
    to the line without thinking about the possibilities of damaging it. For example,
    you cannot safely connect an LED to the micro:bit - the current is simply too
    much.


    In normal operation the GPIO lines are all configured into standard drive mode,
    which limits the current to 0.5mA. This is a very small current. By comparison,
    the Raspberry Pi can work with 3mA on each GPIO line and a single line can work
    up to 16mA.


    There are high drive modes which can be selected, as discussed in the next chapter.
    With high drive on, a GPIO line can work with a maximum of 5mA. The total current
    on all the GPIO pins cannot exceed 15mA. So you could have three GPIO lines drawing
    5mA each or two drawing 5mA and five more drawing 1mA. Notice also that you can
    set high drive on a per-line basis. That is, one line can be high drive and the
    next standard. Each line is subject to a 5mA or a 0.5mA maximum current, according
    to its mode.'
  merge: -1
  img_proc: true
- pgno: 42
  md: 'This is complicated, so a summary will help:


    +   - In input mode you only have to keep the voltage on a GPIO line between 0
    and 3.3V. The GPIO line in input mode is high impedance and draws current from
    whatever is connected to it.


    +   - In input mode with the default standard drive the voltage is between 0 and
    3.3V and the current has to be less than 0.5mA


    +   - In input mode with a GPIO line with high drive turned on the current has
    to be less than 5mA.


    +   - The total current in all of the GPIO lines has to be less than 15mA.


    You cannot set high drive mode on using the framework. In addition to access the
    hardware directly, as detailed in the next chapter. In addition to setting the
    drive strength, you can also opt for open collector or open emitter.


    The bottom line is that in nearly all cases if you want to drive something from
    a GPIO line you will need to use a transistor or a field-effect transistor (FET)
    to increase the current and perhaps change the voltage. If you have used an LED
    or other device from a GPIO line without a transistor or FET as a buffer and it
    worked, either you have been lucky or the drive specifications are pessimistic.
    However, some users have destroyed their micro:bits doing this.


    # An FET Buffer


    Constructing a buffer is very easy and cheap. You can use a bipolar junction transistor
    (BJT) if you want to, but in this case the simplest solution is to use an FET.
    The reason is that an FET hardly draws any current from the GPIO line. Not only
    does the FET increase the current in the load, it also allows you to change the
    drive voltage. Although in this circuit is shown as 3.3V, it can be 5V or anything
    needed to drive the load. The FET isolates the micro:bit from the higher voltage.


    ![](img/23976341c9281123e7b181beea6e9dbd_42_0.png)'
  merge: -1
  img_proc: true
- pgno: 43
  md: "The 100kΩ resistor is there to ensure that the FET, and the load, is off when\
    \ the micro:bit first powers up and the GPIO line defaults to an input. Without\
    \ it, the FET would pick up noise and switch on and off randomly.\n\nThe FET shown,\
    \ 2N7000, is cheap and can work with voltages up to 60V and currents up to 100mA.\
    \ If you need a higher voltage or a larger current, you will need to use a different\
    \ FET. Power FETs are cheap, and can handle currents of tens of amps.\n\n# GPIO\
    \ Output\n\nWhen you are generating GPIO output signals, the key questions are\
    \ often when the signal go high and when does it go low? In some applications\
    \ this is a non-time-critical event. As long as the line goes high or low in response\
    \ to something, all is well. In other situations, the response has to be after\
    \ a given amount of time. If that interval is longer than 100µs then there is\
    \ no problem. If the interval is less than 100µs then you have to work out the\
    \ best way to ensure the delay taking account of how accurate it has to be. Here\
    \ we take a look at how fast GPIO lines can be changed and what sort of accuracy\
    \ is possible.\n\n# How Fast?\n\nA fundamental question that you have to answer\
    \ for any processor intended for use in embedded or IoT projects is how fast the\
    \ GPIO lines work?\n\nSometimes the answer isn't of much concern because what\
    \ you want to do only works relatively slowly. Any application that is happy with\
    \ response times in the tens of millisecond region will generally work with almost\
    \ any processor. However, if you want to implement custom protocols, or anything\
    \ that needs microsecond responses, the question is more important.\n\nIt is fairly\
    \ easy to find out how fast a single GPIO line can be used if you use a logic\
    \ analyzer or oscilloscope. All you have to do is the program that changes the\
    \ state of a GPIO line as fast as possible:\n\n```\n#include \"MicroBit.h\"\n\
    MicroBit uBit;\nint main() {\n  uBit.init();\n  while(1) {\n    uBit.io.P0.setDigitalValue(1);\n\
    \    uBit.io.P0.setDigitalValue(0);\n  }\n}\n```"
  merge: -1
  img_proc: true
- pgno: 44
  md: "The result is a pulse train with pulses ranging, on a V1 device, from 3.5 to\
    \ 3.8µs and a 0.1µs pause every 6µs due to the system timer interrupting. There\
    \ isn't anything that can be done about this 6µs interrupt apart from switching\
    \ the system timer. A V2 device generates pulses at around 0.9µs with occasional\
    \ pauses:\n\n| +40us | +50us | +60us | +70us | Measurements |\n|---|---|---|---||\n\
    | | | | | Width: 950ns |\n| | | | | Period: 1.80us |\n| | | | | DutyCycle: 51.351514%\
    \ |\n| | | | | Frequency: 540.540541KHz |\n\nYou can reduce the irregularities\
    \ by turning off interrupts if you do this for very long the normal working of\
    \ the system will be disrupted. You can turn interrupts off using _disable_irq()\
    \ and _enable_irq(). You can see an example of turning interrupts off for short\
    \ periods of time in Chapters 8 and 9.\n\n# Delay Using Sleep\n\nTo generate pulses\
    \ of a known duration we need to pause the program between state changes. The\
    \ simplest way of sleeping a fiber is to use the sleep command. This delays for\
    \ a specified number of milliseconds. Unfortunately this uses the system timer\
    \ and only works in 6ms.\n\nTo try this, include a call to sleep(9) to delay the\
    \ pulse:\n\n```\n#include \"MicroBit.h\"\nMicroBit uBit;\nint main() {\n    uBit.init();\n\
    \    while (1) {\n        uBit.io.P0.setDigitalValue(1);\n        uBit.sleep(9);\n\
    \        uBit.io.P0.setDigitalValue(0);\n        uBit.sleep(9);\n    }\n}\n```\n\
    \nYou will discover that you get 12ms pulses. This is only useful if you want\
    \ pulses that are multiples of 6ms or so long that a 6ms error doesn't matter.\n\
    \nThere is a microsecond delay function wait_us() which is part of the mbed software\
    \ that the framework is built on and we can call it from a micro:bit program."
  merge: -1
  img_proc: true
- pgno: 45
  md: where n is set to a value that depends on the delay you want to generate.
  merge: -1
  img_proc: true
- pgno: 46
  md: "The relationship between n and t, the time delay, is linear:\n\n```\nV1 n =\
    \ 1.333t - 5.83\nV2 n = 6.387t - 7.09\n```\n\nand it means you can't generate\
    \ pulses less than about 6µs.\nFor example, if you want pulses of 10ms for V2,\
    \ n = 57 results in:\n\n![](img/23976341c9281123e7b181beea6e9dbd_46_0.png)\n\n\
    We will revisit the busy wait option and using timers in the next chapter.\n\n\
    # Phased Pulses\n\nAs an example of using the output functions, let's try to write\
    \ a short program that pulses two lines - one high and one low and then one low\
    \ and one high, i.e. two pulse trains out of phase by 180 degrees. The simplest\
    \ program to do this job is:\n\n#include \"MicroBit.h\"\n\n```\nMicroBit uBit;\n\
    int main()\n{\n  int i;\n  uBit.init();\n  while (1) {\n    uBit.io.P0.setDigitalValue(1);\n\
    \    uBit.io.P1.setDigitalValue(0);\n    uBit.io.P0.setDigitalValue(0);\n    uBit.io.P1.setDigitalValue(1);\n\
    \  }\n}\n```\n\nNotice that there is no delay in the loop, so the pulses are produced\
    \ at the fastest possible speed."
  merge: -1
  img_proc: true
- pgno: 47
  md: 'Using logic analyzer reveals that, on a V2, the result isn''t what you might
    expect:


    ![](img/23976341c9281123e7b181beea6e9dbd_47_0.png)


    You can also see that the pulse trains are not 180 degrees out of phase. The top
    train switches on and the bottom train takes about half a pulse before it switches
    off, whereas the intent is for both actions to occur at the same time. You should
    also notice that now the pulse is about 1.9µs, which is about double the time
    for a pulse train on a single GPIO line. The point is that it does take quite
    a long time to access and change the state of an output line. The same is true
    for a V1 device but the timings are slightly longer.


    Of course if we include a delay to increase the pulse width then the delay caused
    by accessing the GPIO lines in two separate actions isn''t so obvious:


    ![](img/23976341c9281123e7b181beea6e9dbd_47_1.png)


    48'
  merge: -1
  img_proc: true
- pgno: 48
  md: "In this case the loop now has n = 100:\n\n```\n#include \"MicroBit.h\"\n\n\
    MicroBit uBit;\nint main() {\n    int i;\n    uBit.init(1);\n    while (1)\n \
    \   {\n        for (i = 0; i < 100; i++)\n        {\n            uBit.P0.setDigitalValue(1);\n\
    \            uBit.P1.setDigitalValue(0);\n            for (i = 0; i < 100; i++)\n\
    \            {\n                uBit.P0.setDigitalValue(0);\n                uBit.P1.setDigitalValue(1);\n\
    \            }\n        }\n    }\n}\n```\n\nYou will notice that the pulses are\
    \ now roughly 17µ wide on a V2 and they are changing at what looks like nearer\
    \ to the same time, though, of course, aren't. There is still a lag, but in many\
    \ applications it might not be important. In other applications, it could be crucial.\n\
    \nFor example, if two pulse trains were driving different halves of a motor controller\
    \ bridge there would be a significant time when both were high - so shorting the\
    \ power supply. It might only be for 10µ over time it could well damage the power\
    \ supply. Of course, any sensible, cautious, engineer wouldn't find a motor control\
    \ bridge from two independently generated pulse trains unless they were guaranteed\
    \ not to switch both sides of the bridge on the same time.\n\nA better way to\
    \ generate multiple pulses is to write directly to the hardware, which is what\
    \ we do in the next chapter.\n\n# Summary of creating accurate pulses\n\n+   -\
    \ For greater than 6µ to an accuracy of 6µ use sleep().\n- For delays from around\
    \ 12µ use wait_us which is accurate to around 1µ.\n- For delays greater than 7µ\
    \ use a busy wait which is accurate to around 1µ.\n- Switching GPIO lines takes\
    \ time and achieving synchronized switching better than 1µ to 10µ is not possible\
    \ using the framework."
  merge: -1
  img_proc: true
- pgno: 49
  md: '# GPIO Input


    GPIO input can be a much more difficult problem than output. At least for output
    you can see the change in the signal on a logic analyzer and know the exact time
    that it occurred. This makes it possible to track down timing problems and fine-tune
    things with good accuracy.


    Input on the other hand is "silent" and unobservable. When did you read the status
    of the line? Usually the timing of the line is with respect to some other action
    that the microbit has taken. For example, input line 20 is read a given number
    of microseconds after setting the output high. The usual rule of thumb is to assume
    that it takes as long to read a GPIO line as it does set it. This means we can
    use the delay mechanisms that we looked at with output in mind for input. In some
    applications the times are long and/or unimportant, but in some they are critical.


    # A Basic Input Circuit - The Switch


    One of the most common input circuits is the switch or button the microbit already
    has two built-in buttons, A and B. If you want another, external, you can use
    any GPIO line and the following circuit:


    The 10k switch isnt critical in value. It simply pulls the GPIO line high when
    it is pressed, a current of a little more than 0.3mA in the resistor. If this
    is too much, increase the resistance to 100K or even more, but notice that the
    higher the resistor value, the noisier the input to the GPIO and the more it is
    susceptible to RF interference.


    ![](img/23976341c9281123e7b181beea6e9dbd_49_0.png)


    If you want a switch that pulls the line high instead of low, just swap the positions
    of the resistor and the switch in the diagram.'
  merge: -1
  img_proc: true
- pgno: 50
  md: 'Although the switch is the simplest input device, it is also very difficult
    to get right. When a user clicks a switch of any sort the action isn''t clean
    - the switch bounces. What this means is that the logic level on the GPIO line
    goes high then lows and bounces between the two until it settles down.


    There are electronic ways of debouncing switches, but software does the job much
    better. All you have to do is put a delay of a millisecond or so after detecting
    a switch and read the line again. If it is still low then record a switch press.
    Similarly when the switch is released read the state twice with a delay. You can
    vary the delay to modify the perceived characteristics of the switch.


    # The Potential Divider


    If you have an input that is outside the range of 0 to 3.3V, you can reduce it
    using a simple potential divider. V is the input from the external logic and Vout
    it the connection to the GPIO input:


    ![](img/23976341c9281123e7b181beea6e9dbd_50_0.png)


    You can spend a lot of time on working out good values of R1 and R2. For loads
    that take a lot of current you need R1 plus R2 to be small and divided in the
    same ratio as the voltages. For example, for a 5V device R1=18kΩ and R2=33k work
    well to drop the voltage to 3.3V.


    The problem with a resistive divider is that it can round off fast pulses due
    small capacitive effects. This usually isn''t a problem, but if it is then the
    solution is to use an FET buffer.


    ![](img/23976341c9281123e7b181beea6e9dbd_50_1.png)'
  merge: -1
  img_proc: true
- pgno: 51
  md: "Notice that this is an inverting buffer, but you can usually ignore this and\n\
    simple correct by inverting in software, i.e. read a 1 as low and a 0 as a high\\\
    state. The role of R1 is to make sure the 5V signal is\nabsent and R2 limits the\
    \ current in the FET to about 0.3mA. In most cases,\nyou should try the simple\
    \ voltage divider and only move to an active buffer if\nit doesn't work.\n\n#\
    \ How Fast Can We Measure?\n\nThe simplest way to find out how quickly we can\
    \ take a measurement using\nmicro-bit is to perform a pulse width measurement\
    \ using a busy wait.\nApplying a square wave to P0 we can measure the time that\
    \ the pulse is high:\n#include \"MicroBit.h\"\n\n```\nMicroBit uBit;\nint main()\n\
    {\n  int i;\n  uBit.init();\n  while (1)\n  {\n    while (i == 1) uBit.io.P0.getDigitalValue();\n\
    \    while (i == 0) uBit.io.P0.getDigitalValue();\n      for (i = 0; i < 1000;\
    \ i++))\n        if (i == 0) uBit.io.P0.getDigitalValue())\n          break;\n\
    \      uBit.serial.printf(\"%d\\n\\r\", i);\n  }\n}\n```\n\nThis might look a\
    \ little strange at first. The inner while loops are responsible\ngetting us to\
    \ the right point in the waveform. We first loop until the line\ngo low, then\
    \ we loop until it goes high again, and finally we measure how\nlong before it\
    \ goes low. You might think that we simply have to wait for it\ngo high and then\
    \ measure how long it goes low, but this misses the\nibility that the signal might\
    \ be part way through a high period when we\nfirst measure it.\n\nThe second new\
    \ aspect of the program is that we use printf to get\nthe information. This is\
    \ a print function associated with the serial driver. It is\nmodeled on the standard\
    \ C printf function, but it only supports a limited\nnumber of data types. You\
    \ can only use %c,%d, %s, %x and %X."
  merge: -1
  img_proc: true
- pgno: 52
  md: 'In this case we are using the default USB serial interface to get information
    out of the micro:bit. This is also useful for debugging. To see the data you need
    to connect a serial terminal – PuTTY for example. The default configuration is:

    Baud rate = 115200

    Data = 8 bits

    Parity = none

    Stop = 1 bit


    The only problem you have is finding the correct serial port to connect to and
    it is usually the only USB COM port listed. If you can''t find a COM serial port
    then you might have to install the mbed serial driver:

    h://os.mbed.com/docs/mbed-os/v5.14/tutorials/windows-serial-driver.html


    The web page says that it shouldn''t be used with Windows 10, but in practice
    it has proved necessary for the V1 microbit and once installed it works with the
    V2 micro:bit.


    If you run this program with different pulse widths the result are very regular:
    In the chart loop count is on the y-axis, pulse time on the x-axis.

    The equation relating time t in microseconds and loop count n is:


    ![](img/23976341c9281123e7b181beea6e9dbd_52_0.png)


    V1 t = 4.88 n + 3.38

    V2 t = 0.85*n + 3.69


    This works down to about 10µs or slightly less.'
  merge: -1
  img_proc: true
- pgno: 53
  md: "```\nIf you want to record the time directly in microseconds, rather than using\
    \ a\nloop count you could use:\n#include \"MicroBit.h\"\n```\n\n```\nMicroBit\
    \ uBit;\nint main()\n{\n    uBit.init();\n    uint64_t t;\n\n    volatile int\
    \ i;\n\n    while (1)\n    {\n        while (1 == uBit.P0.getDigitalValue());\n\
    \        while (0 == uBit.P0.getDigitalValue());\n        t = system_timer_current_time_us();\n\
    \        for (i = 0; i < 1000; i++) {\n            if (0 == uBit.P0.getDigitalValue())\n\
    \                break;\n        }\n        t = system_timer_current_time_us()\
    \ - t;\n        uBit.serial.printf(\"%d,%d\\n\\r\", i, (int)t);\n    }\n}\n```\n\
    \nThis is accurate to around 10µs.\nin either case, if you try measuring pulse\
    \ widths shorter than the lower limit that works, you will get results that look\
    \ if longer pulses are being applied. The reason is simple that the micro:bit\
    \ will miss the first transition to zero but will detect a second or third or\
    \ later transition. This is the digital equivalent of the aliasing effect found\
    \ in the Fourier transform or general signal processing.\n\n# Interrupts\n\nThere\
    \ is a general feeling that real-time programming and interrupts go together and\
    \ if you are not using an interrupt you are probably doing something wrong. In\
    \ fact, if you are using an interrupt you probably are doing something wrong.\
    \ Some organizations agree with the general idea that interrupts are dangerous\
    \ to the extent they ban them altogether, and this includes real-time software."
  merge: -1
  img_proc: true
- pgno: 54
  md: 'In the case of the microbit we have a system of events that stand in a software
    wrapping of the raw system interrupts that are available if you dig just a little
    deeper.

    As far as GPIO lines are concerned you can determine how events occur using one
    of four settings. The most useful is the on-edge setting, which fires an event
    if a GPIO line transitions from high to low or low to high.


    ```

    int eventOn(int eventType)

    ```


    where eventType is one of:


    | MICROBIT_PIN_EVENT_ON | Fire on rising or falling edge as specified when event
    registered |

    | MICROBIT_PIN_ON_PULSE | Fire if pin is high or low as set when event registered
    |

    | MICROBIT_PIN_EVENT_TOUCH | Fire if pin touched |

    | MICROBIT_PIN_EVENT_NONE | Disable events for this pin |


    As well as the eventOn setting you also have to register the event with the messagebus.
    You have to supply the ID of the pin generating the event, the event type, the
    function to be called when the event happens and how the event be handled. For
    example:


    ```

    bus.listen(MICROBIT_ID_P0, MICROBIT_PIN_PULSE_HI, MESSAGE_BUS_LISTENER_IMMEDIATE)

    ```


    will call onPulse when the PULSE_HI occurs on pin P0 and it will call the event
    handler at once. The event types that you can specify are:


    ```

    MICROBIT_PIN_EVT_RISE

    MICROBIT_PIN_EVT_FALL

    MICROBIT_PIN_EVT_PULSE_HI

    MICROBIT_PIN_EVT_PULSE_LO

    ```


    The event handler has the signature:

    voidHandler(MicroBitEvent evt)


    and one of the most useful properties of the evt object is the timestamp of the
    event.


    Events are only useful when you have a low frequency condition that needs to deal
    with on a low priority basis. Their use can simplify the logic of your program,
    but rarely using an event speed up things because the overhead involved in event,
    or interrupt, handling is quite high. For example, suppose you want to react to
    a doorbell push button. You could write a polling loop that simply checks the
    button status repeatedly and forever, or you could write an event to respond to
    the doorbell. How good a design depends on how much the doorbell event has to
    interact with the rest of the program.'
  merge: -1
  img_proc: true
- pgno: 55
  md: "Finally, before you dismiss the idea of having a micro-bit do nothing but ask\
    \ repeatedly \"is the doorbell pressed\", consider what it has to do. If it is\
    \ \"not much\" then a polling loop will be your simplest option.\n\nLet's find\
    \ out how much overhead is inherent in using events by repeating the pulse width\
    \ measurement. This time we can't simply print the results as this would stop\
    \ the event handling. As a compromise we save 20 readings in an array and then\
    \ print them after repeating a second - all the input pulse have to occurred before\
    \ this. It is also important to keep the event handling routines short. If the\
    \ event handling takes longer than the pulse width then we will get an incorrect\
    \ reading due to the missed pulse.\n\n```\n#include \"MicroBit.h\"\nMicroBit uBit;\n\
    uint64_t t[20];\nuint64_t temp=0;\nint i=0;\nvoid onPulseEdge(MicroBitEvent evt)\
    \ {\n  t[i] = evt.timestamp;\n  i++;\n  temp = evt.timestamp;\n  if(i<20)return;\n\
    \  uBit.io.P0.event(MICROBIT_PIN_EVENT_NONE);\n}\n```\n\n```\nint main() {\n \
    \ uBit.init();\n  uBit.messageBus.listen(MICROBIT_ID_IO_P0,\n    MICROBIT_PIN_EVT_RISE,\n\
    \    onPulseEdge,\n    MESSAGE_BUS_LISTENER_IMMEDIATE);\n  uBit.messageBus.listen(MICROBIT_ID_IO_P0,\n\
    \    MICROBIT_PIN_EVT_FALL,\n    onPulseEdge,\n    MESSAGE_BUS_LISTENER_IMMEDIATE);\n\
    \  uBit.io.P0.event(MICROBIT_PIN_EVENT_ON_EDGE);\n  uBit.sleep(1000);\n  for(i=1;i<20;i++){\n\
    \    printf(\"%d\\n\\r\", (int)t[i]);\n  }\n}\n```\n\nNotice we have the event\
    \ handler called when there is a rising edge and a falling edge."
  merge: -1
  img_proc: true
- pgno: 56
  md: 'At the time of writing this program returns zero for all timings on a V2 due
    to the timestamp of the event object not being set. This bug will probably be
    resolved some time in the future, a fix is to edit:


    libraries/codal-nrf52/source/NRF52Pin.cpp.


    Find the NRF52Pin:rise() and NRF52Pin::fall() methods and in both cases change
    the line:


    ```

    Event(id, DEVICE_PIN_EVT_RISE, 0)

    ```


    to read:


    ```

    Event(id, DEVICE_PIN_EVT_RISE, system_timer_current_us());

    ```


    The program records accurate times for pulses longer than 250µs but starts to
    miss pulses as the pulse width shortens to 100µs, when it misses about one pulse
    in ten. If the event handlers take longer to perform their tasks then the limit
    would be even larger.


    Events are great for handling things that happen on the scale of 100s of microseconds
    and preferably in terms of milliseconds.


    Also notice that the documentation says the shortest pulse that can be reliably
    detected, i.e. will fire a MICROBIT_PIN_EVENT_ON_PULSE event, is 85µs.


    Events are only useful if the time that the event handler takes, plus the overheads
    of servicing an event, is less than the average repetition rate of the event.'
  merge: -1
  img_proc: true
- pgno: 57
  md: '# Summary


    +   - Specifying which of the 32 GPIO lines you want to use can be a problem as
    the definitions have changed between V1 and V2.


    +   - Some GPIO lines have dedicated functions and should be avoided. Others have
    alternative uses and again should be avoided.


    +   - The most basic use of any GPIO line is to set it to a digital value, i.e.
    or 1.


    +   - You can set the drive type of any GPIO line to up, down or none.


    +   - A micro:bit V1 can generate 4µs pulses and a V2 can manage 1µs. In both
    cases, the need to service interrupts causes disruption to the pulse generation.


    +   - You can sleep to suspend a program for a specified time in milliseconds.
    You can use wait_us on a V1 or system_timer_wait_us on a V2 to pause for microseconds.


    +   - A busy wait is the best way of generating fast accurate pulses.


    +   - When switching GPIO lines together, you need to be aware that there is a
    delay between each operation. By default GPIO lines do not change state at the
    same time.


    +   - GPIO input is harder than output because you don''t know when it is going
    to happen.


    +   - You can service input using event handlers. This is not always the best
    way of doing the job, however, and simple polling usually provide a faster response
    time.'
  merge: -1
  img_proc: true
- pgno: 58
  md: '# # Chapter 4

    Fast Memory-Mapped GPIO


    The framework makes working with the GPIO and other devices as easy as it can
    be, but there are many layers of software to go through before you get to the
    hardware. Writing directly to the hardware can make things up to ten times faster
    and give you access to things that the framework doesn''t. It is also an educational
    experience to deal with the raw hardware directly. However, this is an advanced
    topic and you may want to skip it and return when you have a need to go beyond
    the framework.

    All of the peripherals that are directly connected to the processor are memory-mapped.
    What this means is that there is a set of addresses that correspond to ''registers''
    that control the devices and give their status. Using these is just a matter of
    knowing which addresses to use and the format of the registers.

    This is easy to say, but can be difficult to get right, at initially. After you
    have got it right you forget what all the fuss was. The best way to understand
    how all of this works is to find out about a particular peripheral, the GPIO.


    # ## GPIO Registers


    If you look at the manual for the RF51 processor in the case of the microbit V1
    or the RF52 you will find a long section on the registers that are connected to
    the GPIO lines. There are no major differences between the two processors as the
    first 32 GPIO lines are concerned. The micro:bit V1 and V2 have an identical bank
    of 32 GPIO lines usually indicated as P0_n where n goes from 0 to 31. The micro:bit
    V2 has a second bank of ten GPIO lines, usually indicated as P1_n where n goes
    from 0 to 9.

    Each GPIO line follows the same pattern as far memory registers are concerned.
    For each GPIO line there is a single configuration register, i.e. 32 registers,
    one for each line in the P0 bank.

    There is also a 32-bit OUT register that is used to set each output line to high
    or low with each bit corresponding to the state of one line; and a single 32-bit
    IN register used to read the state of all 32 GPIO lines with one bit per.

    In theory these are the only registers you need to know about use the GPIO lines,
    but five more are provided to make things easier.'
  merge: -1
  img_proc: true
- pgno: 59
  md: 'The OUTSET and OUTCLR registers can be used to set or clear any GPIO

    lines without changing the state of the others. If you write to either register

    then the lines that correspond to one bits are set or cleared according

    which register you write to. For example, suppose you want to set GPIO P0_0

    a to 1 you can write 0x01 to the OUT register. However, this sets all of

    the 31 pins to 0. If you write 0x01 to the OUTSET register then you set

    P0_0 high and leave all of the others in their current state. Similarly, writing

    0x01 to OUTCLR sets P0_0 and leaves the other in their current state.


    There is a 32-bit DIR register which can be used to set any combination

    pins to input or output depending on whether you write a 0 or a 1 to the

    corresponding bit location.


    The DIR and DIRCLR registers set the GPIO line to output or input

    when you write a 1 to the corresponding bit location and make it easier for

    to set lines to input or output without altering the remaining lines

    set. Writing 0x01 to DIR sets P0_0 to output but all of the remaining

    31 pins to input. Writing 0x01 to DIRSET will set only P0_0 to output and

    writing it to DIRCLR will set only P0_0 to input.


    To summarize, the registers controlling the bank of GPIO lines:


    +   * 32 PIN[n] configuration registers, for each GPIO line

    * OUT sets any combination of GPIO lines high or low

    * OUTSET sets any combination of GPIO lines high

    * OUTCLR sets any combination of GPIO lines low

    * IN reads the state of all GPIO lines

    * DIR sets the I/O direction of any combination of GPIO lines

    * DIRSET sets any combination of GPIO lines to output

    * DIRCLR sets any combination of GPIO lines to input


    Of course, need to know which bits in the configuration register controls

    what aspect of the GPIO line.


    | Bits | DIR |

    |---|---|

    | 0 | DIR 0 = input, 1 = output |

    | 1 | INPUT 0 = disconnect input, 1 = connect |

    | 3,2 | PULL 00 = No Pull, 01 = Pull-Down, 11 = Pull-Up |

    | 10,9,8 | DRIVE 000 S01, 001 H0S1, 010 S0H1, 011 H0H1, 100 D0S1, 101 D0H1, 110
    S0D1, 111 H0D1 |

    | 17,16 | SENSE 00 = disabled, 01 = High, 11 = Low |'
  merge: -1
  img_proc: true
- pgno: 60
  md: 'We already know about DIR and PULL from the previous chapter and to understand
    DRIVE all you really need to know is that there are two possibilities for the
    push-pull transistor arrangement.

    The two transistors can either be Standard Drive, i.e. 0.5mA, or High Drive,


    ![](img/23976341c9281123e7b181beea6e9dbd_60_0.png)


    i.e. 5mA. The bottom transistor pulls the output low to give a 0 and the top transistor
    pulls the output high to give a 1. Hence a DRIVE, or S0H1, has a high drive for
    the top transistor and a standard drive for the bottom transistor. That is, the
    GPIO line can sink 0.5mA and supply 5mA to a load.


    The D in the specification means Disconnected, i.e. there is no transistor in
    that position. So H0D1 has the pull-up transistor missing, giving an open collector
    driver.


    In most cases you want S0S1 or H0H1 - the others are for situations.


    The INPUT bits control when the pin will contribute to generating a DETECT signal.
    This is used to bring the processor out of power-saving mode and in more complex
    ways to automatically trigger other actions. You can ignore this for the moment.


    The only question we have to answer now is, where are the registers?

    P0_ GPIO registers occupy a block of memory starting at 0x50000000, microbit V2
    has a second bank of registers, P1_, starting at 0x50000300. The register addresses
    are specified as offsets from these starting point in two blocks:


    ```

    OUT 0x504

    OUTSET 0x508

    OUTCLR 0x50C

    IN 0x510

    DIR 0x514

    DIRSET 0x518

    DIRCLR 0x51C

    PIN_CNF[n] 0x700 +4*n

    ```'
  merge: -1
  img_proc: true
- pgno: 61
  md: '# A Fast Pulse


    Putting all this together, we now only have the problem of how to implement it
    in a C program. We can usually leave the GPIO line we want to use in its default
    configuration and simply set its direction and state. Notice that you have to
    be careful not to modify the direction or state of any GPIO lines that are used
    internally by the micro:bit:


    To set and clear a single line we just need access to three registers DIR, OUTSET
    and OUTCLR. We need to store the addresses of these registers in pointers. For
    the P0_block of GPIO lines we have:


    ```

    volatile unsigned int *"dirsets(unsigned int*) (0x50000000UL+0x518);

    volatile unsigned int *"outsets(unsigned int*) (0x50000000UL+0x508);

    volatile unsigned int *"outclr(unsigned int*) (0x50000000UL+0x50C);

    ```


    The pointers need to be unsigned 32-bit integers as the registers are 32 bits
    in size and they are marked as volatile to make sure the compiler doesn''t optimize
    away repeated use of them.


    Next we need to create a mask that picks out the bit corresponding to the pin
    we want to toggle. You need to keep in mind that the bit at position b corresponds
    to the internal GPIO line numbering and not the physical pins on the micro:bit.
    For example, if you want to pulse P0 on the micro:bit you need to pulse P0_3 on
    V1 or P0_2 on V2. You use the table in the previous chapter P0_3 to look up edge
    connector pin names and find which GPIO line is driving them.


    GPIO P0_3 corresponds to bit 3 and GPIO P0_2 to bit 2 in the register and, in
    general, we need to construct a bit "mask" that sets the bits corresponding to
    the GPIO lines we want to control. The easiest way to do this is to left shift
    a 0x1 that is, if you want to work with GPIO line Pin b you would create a mask
    using:


    ```

    unsigned int b=0x01<b;

    ```


    So, if we want to work with GPIO P0_3, we need a mask:


    ```

    unsigned int mask = 1 << 3;

    ```


    You can construct masks for multiple pins by ORing together masks for multiple
    pins or simply working out the hex value needed. Our case for GPIO P0_3 the hex
    value is:


    ```

    unsigned int mask = 0x08;

    ```'
  merge: -1
  img_proc: true
- pgno: 62
  md: "We now need to set P0_3 to output, making sure not to change any of\nthe other\
    \ pins:\n\n*dirset = mask;\n\nWe can now write a loop to toggle GPIO P0_3 as fast\
    \ as possible:\n\n```\nfor (;;) {\n    *outset = mask;\n    *outclr = mask;\n\
    }\n```\n\nThe complete program is:\n\n```\nint main() {\n    int GPIO=2; //Uncomment\
    \ for V2\n    volatile unsigned int *dirset=(unsigned int*) (0x50000000UL+0x518);\n\
    \    volatile unsigned int *outset=(unsigned int*) (0x50000000UL+0x508);\n   \
    \ volatile unsigned int *outclr=(unsigned int*) (0x50000000UL+0x50C);\n```\n\n\
    Notice that you don't have to include the microbit library to make this work.\n\
    \nIf you run the program and measure the pulse widths you will find it is much\n\
    faster. The pulse width of a V1 is 0.25µs compared to the 3.5µs pulses we can\n\
    generate using the framework, i.e. more than ten faster.\n\n![](img/23976341c9281123e7b181beea6e9dbd_62_0.png)\n\
    \nThis only leaves the question as to why the low time, 0.5µs, is much longer\n\
    than the high time?\n\nThe answer might surprise you. The extra time is how long\
    \ it takes the for\nloop to perform its loop-end test and return to the start\
    \ of the loop. The\nmemory-mapping instructions are now performing at the speed\
    \ of the\nprocessor and the pulse train produced is influenced by the way the\n\
    processor executes other instructions. You can't get rid of the time needed to\n\
    t control to another part of the program to form a loop - a goto\ngenerates the\
    \ same delay."
  merge: -1
  img_proc: true
- pgno: 63
  md: 'If you look more closely at the analyzer trace you will find that every now
    and again there is a pulse only 0.125µs wide - presumably an artifact of the cache
    in use.

    In the case of microbit V2 the situation is more complicated:


    ![](img/23976341c9281123e7b181beea6e9dbd_63_0.png)


    You can see that the minimum pulse width is 0.1µs, which is better than times
    faster than the framework can generate, but the pulse train varies a lot.

    Rather than trying to work out exactly what is going on, on the moral of the story
    is that when you are working at speeds that are close to the execution time of
    a single instruction, you cannot expect it to be reproducible in a complex modern
    processor.


    If you add busy wait to slow down then the variations due to the processor become
    less important and the high time is equal to the low time:


    ```

    int main() {

    int GPIO = 3;

    //GPIO = 2; Uncomment for V2

    volatile unsigned int *dirset=(unsigned int*) (0x50000000UL+0x518);

    volatile unsigned int *outset=(unsigned int*) (0x50000000UL+0x508);

    volatile unsigned int *outclr=(unsigned int*) (0x50000000UL+0x50C);

    unsigned int mask = 1 << GPIO;


    *dirset = mask;

    volatile int i;

    int n = 200;

    for (; ) {

    for (i = 0; i < n; i++) {

    *outset = mask;

    for (i = 0; i < n; i++) {

    *outclr = mask;

    }

    }

    }

    ```


    You can estimate the value of n using:

    V1 = n = 0.74*t + 0.88

    V2 = n = 4.21*t + 1.85

    where t is in microseconds.'
  merge: -1
  img_proc: true
- pgno: 64
  md: "# Phased Pulses\n\nThere is an almost important reason, other than, speed for\
    \ using direct access to the hardware. It allows you to set multiple GPIO lines\
    \ at the same time, eliminating much of the synchronization problem encountered\
    \ in the previous chapter. For example, to switch P0 and P1 in phase you would:\n\
    \n```\nint main() {\n    volatile unsigned int *dirset=(unsigned int*)0x50000000UL+0x518);\n\
    \    volatile unsigned int *outset=(unsigned int*)0x50000000UL+0x508);\n    volatile\
    \ unsigned int *outclr=(unsigned int*)0x50000000UL+0x50C);\n\n    volatile int\
    \ i;\n    int n = 200;\n    unsigned int mask = 1 << 2 | 1 << 3;\n    *dirset\
    \ = mask;\n    for (;;) {\n        *outset = mask;\n        for (i = 0; i < n;\
    \ i++){}\n        *outclr = mask;\n        for (i = 0; i < n; i++){}\n    }\n\
    }\n```\n\nFor V1 P0 and P1 on the edge connector is GPIO P0_3 and P0_2 and for\
    \ V2 they are GPIO P0_2 and P0_3, hence the mask setting bits 3 and 2 works for\
    \ both. If you try this out you will find that the two GPIO lines change at the\
    \ same time:\n\n| 117.8ms | 70us +80us +90us | +10us +20us +30us +40us +50us +60us\
    \ +70us +80us +90us | Measurements |\n|---|---|---|---|---|---|---|---|---|---||\n\
    | | | | | | | | | Width:47us Period:94.85us DutyCycle:49.9736426% Frequency:10.54429626KHz\
    \ |\n| | | | | | | | | Pulse Counters |\n| | | | | | | | | Timing Marker Pairs\
    \ |\n| | | | | | | | | Analyzers |\n| | | | | | | | | | Decoded Results |\n| |\
    \ | | | | | | | | Search |"
  merge: -1
  img_proc: true
- pgno: 65
  md: "The next part, setting the lines in anti-phase, isn't so simple. The obvious\
    \ approach is:\n\n```\nint main() {\n    volatile unsigned int *dirset=(unsigned\
    \ int*)(0x500000000UL+0x518);\n    volatile unsigned int *outset=(unsigned int*)(0x500000000UL+0x508);\n\
    \    volatile unsigned int *outclr=(unsigned int*)(0x500000000UL+0x50C);\n\n \
    \   volatile int i;\n    int n = 200;\n    unsigned int mask = 1 << 3 | 1 << 2;\n\
    \    unsigned int mask1 = 1 << 3;\n    unsigned int mask2 = 1 << 2;\n    *dirset\
    \ = mask;\n    for (;;) {\n        *outset = mask1;\n        *outclr = mask2;\n\
    \        for (i = 0; i < n; i++) {\n            *outclr = mask1;\n           \
    \ *outset = mask2;\n            for (i = 0; i < n; i++) {\n            }\n   \
    \     }\n    }\n}}\n```\n\nIn this case we set P0 and P1 in separate operations\
    \ so they are switched at slightly different times.\n\nIf you look at a logic\
    \ analyzer you will discover that there is a 0.25 µs V1 or 50 ns V2 overlap:\n\
    \n| +300ns overlap | A1 | A2 | 00ns |\n|---|---|---|---|n| Measurements | | |\
    \ |\n| Width: 47.45us | | | |\n| Period: 94.95us DutyCycle: 50.0263296% Frequency:\
    \ 10.5318589KHz |\n| Pulse Counters | | | |\n| Timing Marker Places | | | |\n\
    | A1 - A2 | =50ns A1 @ 117.76735ms A2 @ 117.7764ms | | |\n| Analyzers | | | |"
  merge: -1
  img_proc: true
- pgno: 66
  md: "Better, but not perfect. Perfection is slightly more complicated. To switch\
    \ the two lines at the same time we need to work with the OUT register.\n\nAs\
    \ a demonstration, set all lines to input apart from lines P0 and P1 and then\
    \ set these to high and low and then low and high repeatedly:\n\n```\nint main()\
    \ {\n    volatile unsigned int *dirset=(unsigned int*) (0x50000000UL+0x518);\n\
    \    volatile unsigned int *out=(unsigned int*) (0x50000000UL+0x504);\n    volatile\
    \ int i;\n    int n = 200;\n    unsigned int mask1 = 1 << 2;\n    unsigned int\
    \ mask2 = 1 << 3;\n    *dirset=(1 << 2) | (1<<3);\n    {\n        *out = mask1;\n\
    \        for (i = 0; i < n; i++);\n        *out = mask2;\n        for (i = 0;\
    \ i < n; i++);\n    }\n```\n\nNotice to access the OUT register we need a new\
    \ pointer. We still need mask1 and mask2 to set the two lines, one to high and\
    \ one to low, before we start the loop. For a general program, we should read\
    \ the OUT register and modify just the two bits we are interested in. Now the\
    \ two lines switch in anti-phase together:\n\n![](img/23976341c9281123e7b181beea6e9dbd_66_0.png)\n\
    \nThis is typical the sort of thing you have to do if it is important that GPIO\
    \ lines change state at the same time."
  merge: -1
  img_proc: true
- pgno: 67
  md: "# How Fast Can Input Be?\n\nThe final question is how fast we can read the\
    \ state of a line using memorymapped access? The answer can be found by repeating\
    \ the program given in the previous chapter, but using direct memory access rather\
    \ than the framework.\n\nIn both cases we use the serial port to get the results\
    \ and this means that we have to include the framework and instantiate at least\
    \ a serial object. This causes a slight problem in that we now have to initialize\
    \ the GPIO line we want to use more fully than just setting it to output as the\
    \ previous section.\n\nLet's discover how fast pulse interval can be measured:\n\
    \n```\n#include \"MicroBit.h\"\nMicroBit uBit;\nint main() {\n  uBit.init();\n\
    \  int GPIO = 3;\n  GPIO = 2; // Unsigned unsigned int for V2\n  volatile unsigned\
    \ int *pinDir=(unsigned int*)(0x50000000UL+0x510);\n  volatile unsigned int *pinDir=\
    \ (unsigned int*)(0x500000000UL+0x700+GPIO*4);\n  unsigned int mask = 1 << GPIO;\n\
    \  *pinDir = 0x0;\n  volatile int i;\n  uBit.serial.printf(\"Ready\\n\\r\");\n\
    \  while (1) {\n    while (mask == ((*in) & mask));\n    while (mask != ((*in)\
    \ & mask)) {\n      for (i = 0; i < 5000; i++) {\n        if (mask != ((*in) &\
    \ mask))\n          break;\n      }\n      uBit.serial.printf(\"%d\\n\\r\", i);\n\
    \    }\n    return 0;\n}\n```\n\nThis program is the same as the one in the previous\
    \ chapter, but now P0 is being read using (*in)&mask which is equal to 0 if the\
    \ pin is at one level and equal to 0 otherwise. The line *pinDir=0x0 sets the\
    \ configuration of the pins to input."
  merge: -1
  img_proc: true
- pgno: 68
  md: 'If you run the program you will find that the relationship in microseconds
    between the loop counter n and pulse width t is given by:


    ```

    V1 t = 1.12 n + 0.32

    V2 t = 0.42 n + 108

    ```


    If you compare this to the result using the framework, you will find that you
    can read data out times faster. The formula works down to 2µs or slightly less.
    However, unless you need the additional speed, it is better to use the framework.
    The techniques introduced in this chapter can be used to access other devices
    in the processor as well as the GPIO, but again in most cases it is safer to stay
    with the framework.


    You might be tempted to write functions for the direct access of GPIO pins - don''t,
    you will simply reinvent the framework. If you are using direct memory access
    then you will need the speed and using a function slows down. The best option
    is to write C macros which place the same code inline in your program, making
    things look nearer but no slower. In practice, writing good macros is difficult.


    There is another way to make GPIO lines work even faster. The micro:bit''s processor
    has internal hardware - GPIOTE and PPI - that make it possible to control the
    GPIO lines from events that occur in other peripherals without the processor being
    involved. Using this hardware you can toggle a GPIO line at up to 8MHz, but the
    problem is controlling what it does other than generate a uniform pulse train.
    Using the GPIOTE and PPI for custom tasks is beyond the scope of this book, but
    we do meet them in the next chapter where they are used to implement Pulse Width
    Modulation, PWM.'
  merge: -1
  img_proc: true
- pgno: 69
  md: '# Summary


    +   - Accessing the GPIO lines directly can be ten times faster than using the
    framework.

    - The GPIO lines, in fact all of the peripherals, are accessed via memory-mapped
    registers.

    - Each of the two possible banks of GPIO lines has a set of registers which allow
    you to configure and control the line.

    - Although register access to the GPIO lines is faster, it is also subject to
    the variations imposed by the workings of the processor. This makes producing
    regular pulse trains difficult.

    - Slower pulses are much less effected by the speed of operation of the processor.

    - Using direct register access you can switch multiple lines on and off at the
    same time, i.e. without a lag.

    - Direct register access can also be used for input and it too is ten times faster
    than using the framework.'
  merge: -1
  img_proc: true
- pgno: 70
  md: '# # Chapter 5


    # ## Pulse Width Modulation, Servos and More


    One way around the problem of getting a fast response from a microcontroller is
    to move the problem away from the processor. In the case of micro:bit’s processor
    there are some built-in devices that can use GPIO lines to implement protocols
    without the CPU being involved. In this chapter we take a close look at pulse
    modulation (PWM) including sound generation, driving LEDs and servos.


    At their most basic output function, the GPIO lines can be set high or low by
    the processor. How fast can they be set high or low on the speed of the processor.
    Using the GPIO line in its Pulse Width Modulation (PWM) mode you can generate
    pulse trains up to 9.6MHz, i.e. pulses as short as just a little more than 0.1µs.


    The reason for increase in speed is that the GPIO controls a pulse generator,
    and also to generate pulses of a specific type, the pulse generator gets just
    on it without needing any intervention from the GPIO line or the processor. In
    fact, the pulse output can continue after your program has ended if you forget
    to reset it.


    Of course, even though the PWM line can generate pulses as short as 0.1µs, it
    can only change the pulses it produces each time the processor can modify it.
    For example, you can''t use PWM to produce a single 0.1µs pulse because you can''t
    disable the PWM generator in just 0.1µs.


    # ## Some Basic Micro:bit PWM Facts


    There are some facts worth getting clear from the start, although some of their
    meanings will only become clear as we progress. First what is PWM? The simple
    answer is that a Pulse Width Modulated signal has pulses that repeat at a fixed
    rate, say one pulse every millisecond, but the width of the pulse can be changed.


    There are two basic things to specify the pulse train that is generated, its repetition
    and the width of each pulse. Usually the repetition rate is set as a simple repeat
    period and the width of each pulse is specified as a percentage of the repeat
    period the duty cycle. For example, a 1ms repeat and a 50% duty cycle specifies
    a 1ms period which is high for 50% of the time, i.e. a pulse width of 0.5µs.'
  merge: -1
  img_proc: true
- pgno: 71
  md: 'The two extremes are 100% duty cycle, i.e. the line is always high; and 0%
    duty cycle, i.e. the line is always low. What this means is that generally you
    select a repeat rate and stick to it and what you change as the program runs is
    the duty cycle.


    In many cases PWM is implemented using special PWM generation hardware that is
    built into the processor chip or provided by an external chip. The processor simply
    sets the repeat rate by writing to a register and changes the duty cycle by writing
    to another register. This generally provides the best sort of PWM with no load
    on the processor and generally glitch-free operation. You can easily use add-on
    boards that will provide additional channels of PWM without adding to the load
    on the processor.


    The alternative to dedicated PWM hardware is to implement in software. You can
    quite easily work out how to do this. All you need a timing loop to set the line
    at the repetition rate and then set it according to the duty cycle. You can implement
    this using either interrupts or a polling loop.


    In the case of microbit, the PWM lines are not implemented using special PWM hardware.
    Instead two general purpose facilities - the GPIOTE and the PPI – are used to
    allow the GPIO lines to trigger events and respond to tasks. The software sets
    up so that the system timer automatically toggles the specified GPIO line at the
    selected repetition rate and duty cycle. This saves the processor''s time, but
    it is sophisticated and, at times, a little difficult to use.


    You can use the “main” GPIO lines, P0, P1 and P2, for PWM. You can also use other
    GPIO lines, but these have other uses as well as PWM. For the moment we will concentrate
    on using P0, P1 and P2. As a single timer is used, the repetition rate is shared
    between all of the GPIO lines being used as PWM outputs. That is, all PWM lines
    operate at the same frequency - i.e. the last set frequency.


    You, however, set different duty cycles for each of the PWM lines by setting the
    repetition rate in multiples of 4µs, i.e. the timer tick is 4µs. The fastest repetition
    rate you can specify is 1µs, but this actually gives a 27-microsecond repeat rate.
    The slowest is 0.262 seconds which means you can''t use a PWM line to flash an
    LED every second.


    As you can guess, there are no PWM inputs, just six outputs. If for some reason
    you need to decide or respond to a PWM input then you need to program it using
    the GPIO input lines and the pulse measuring techniques introduced in the previous
    chapters. If you are really ambitious you could use the GPIOTE and PPI facilities
    to automatically analyze the incoming PWM signal. Again, you would use the timer
    to record the repetition rate and duty cycle.'
  merge: -1
  img_proc: true
- pgno: 72
  md: '# PWM Functions


    The micro:bit framework attempts to provide PWM in easy-to-use forms. It provides
    functions which target the two main uses of PWM – D-to-A conversion and controlling
    servo motors. More about both topics later in the chapter.


    Instead of letting you specify a repeat rate and duty cycle, the framework provides
    two sets of functions, one for working with an analog output and one for working
    with a servo. Of the two, the analog output functions are simpler and more direct.
    The more complex servo functions are described later in connection with implementing
    a servo driver.


    You can set the repeat period using either:


    ```

    int setAnalogPeriod(int period)

    int setAnalogUs(int period)

    ```


    The first sets the period in milliseconds and the second works in microseconds.
    The next function sets the duty cycle, but not in an obvious way:


    ```

    int setAnalogValue(int value)

    ```


    The value can be anything between 0, corresponding to a duty cycle of 0%, and
    1023, corresponding to 100%.


    There is one small detail that you have to aware of. The setAnalogValue function
    also sets up the pin for analog output, if it isn''t already set. What this means
    is that you have to set an analog value before you set an analog period.


    There are also two utility functions that you read the current set period:


    ```

    getAnalogPeriod(int period)

    getAnalogPeriodUs(int period)

    ```


    Although you can set the repeat rate to 1µs, the PWM mechanism in micro:bit V1
    has a smallest time of around 27µs and the timer tick is 4µs, making this the
    maximum achievable. The micro:bit V2 is fairly accurate (to 0.1µs).


    | Set | V1 Actual (microseconds) |

    |---|--|

    | 1 | 27 |

    | 10 | 27 |

    | 30 | 35 |

    | 100 | 107 |

    | 500 | 507 |

    | 1000 | 1007 |'
  merge: -1
  img_proc: true
- pgno: 73
  md: "The longest time you can set is around 262 milliseconds, corresponding to the\
    \ longest time a 32-bit timer running at 4μs per tick can count.\nYou could get\
    \ different maximum and minimum rates by programming the timer yourself, but this\
    \ is a difficult problem.\n\n# Using PWM\n\nNow you know how to use some of the\
    \ PWM lines. All you have to do is set the value and the period.\nThe simplest\
    \ PWM program you can write:\n\n```\n#include \"MicroBit.h\"\nMicroBit uBit;\n\
    int main() {\n  uBit.init();\n  uBit.io.P0.setAnalogValue(511);\n  uBit.io.P0.setAnalogPeriod(1);\n\
    \  release fiber();\n  return 0;\n}\n```\n\nThis produces a pulse train consisting\
    \ of a millisecond wide pulse with a 50% duty cycle, i.e. high for 500ms.\n\n\
    | +8ms | +9ms | | +1ms | Measurements |\n|---|---|---|---||\n| | | Width: 502.95us\
    \ |\n| | | Period: 1.0079ms |\n| | | DutyCycle: 49.007838% |\n| | | Frequency:\
    \ 992.161921Hz |\n| | | Pulse Counters |\n\nYou have to set the value first and\
    \ then set the period, otherwise the PWM line isn't set up properly. You also\
    \ have to set the period for each pin you are using, even if it sets the same\
    \ period. Notice that there is no need to put the program into an infinite loop.\
    \ Once the PWM line has been set up and enabled it just gets on with generating\
    \ the pulse train, no matter what the microbit does. In this case the pulse generation\
    \ continues long after the program has ended."
  merge: -1
  img_proc: true
- pgno: 74
  md: "Just to demonstrate that multiple PWM lines can be used independently of one\
    \ another, here is a program that sets each one of the three main GPIO lines,\
    \ P0, P1 and P2, to a different duty cycle:\n\n```\n#include \"MicroBit.h\"\n\
    MicroBit uBit;\n\nint main() {\n    uBit.init();\n    uBit.io.P0.setAnalogValue(200);\n\
    \    uBit.io.P1.setAnalogValue(511);\n    uBit.io.P2.setAnalogValue(800);\n\n\
    \    uBit.io.P0.setAnalogPeriod(1);\n    uBit.io.P1.setAnalogPeriod(1);\n    uBit.io.P2.setAnalogPeriod(1);\n\
    \n    release fiber();\n    return 0;\n}\n```\n\nNotice that you have to set the\
    \ value and then period for each pin you are using. You can see the result in\
    \ the following logic analyzer display:\n\n![](img/23976341c9281123e7b181beea6e9dbd_74_0.png)\n\
    \n# How Fast Can You Modulate?\n\nIn most cases the whole point is to vary the\
    \ duty cycle or the period of the pulse train, for reasons that will be discussed\
    \ later. This means the next question is how fast can you change the characteristic\
    \ of a PWM line? In other words, how fast can you change the duty cycle?\n\nThere\
    \ is no easy way to give an exact answer and in most applications an exact answer\
    \ isn't much value. The reason is that for a PWM signal to convey it generally\
    \ has to deliver a number of complete cycles with a given duty cycle because the\
    \ wave pulses are often averaged in applications."
  merge: -1
  img_proc: true
- pgno: 75
  md: "We also have another problem - synchronization. There is no way to swap from\
    \ one duty cycle to another exactly when a complete duty cycle has just finished.\
    \ This means that there is going to be a glitch when you switch from one duty\
    \ cycle to another. Of course, this glitch becomes less important as you slow\
    \ the rate of duty cycle change and exactly what is usable depends on the application.\
    \ For example if you change the duty cycle about every 100ms and the pulse width\
    \ is 50ms then you are going to see roughly two to three pulses per duty cycle:\n\
    \n```\n#include \"MicroBit.h\"\nMicroBit uBit;\n{\n    volatile int i;\n    uBit.init();\n\
    \n    uBit.io.P0.setAnalogValue(200);\n    uBit.io.P0.setAnalogPeriodUs(50);\n\
    \n    for (i = 1; i < 100; i++){\n        uBit.io.P0.setAnalogValue(200);\n  \
    \      for (i = 1; i < 100; i++){\n            uBit.io.P0.setAnalogValue(800);\n\
    \        }\n    }\n}\n```\n\nThis results in a fairly irregular pulse pattern:\n\
    \n![](img/23976341c9281123e7b181beea6e9dbd_75_0.png)\n\nThe timing of the change\
    \ and the time it takes to make the change the glitches between duty cycles.\n\
    If you change the busy waits to n=1000 and generate duty cycle changes every millisecond\
    \ or so the pattern looks a lot better because you are going to see 19 to 20 pulses\
    \ before each change, and the glitches are still there:\n\n![](img/23976341c9281123e7b181beea6e9dbd_75_1.png)"
  merge: -1
  img_proc: true
- pgno: 76
  md: 'Is there anything that can be done about the glitching? Yes and no. You can''t
    do anything about the 40ms or so it takes to change from one duty cycle to another,
    but you can synchronize when it happens to the timer using the wait_us function.
    If you swap the waits for the 100µs delays to:


    ```

    wait_us(100);

    ```


    with the help of:


    ```

    #define wait_us system_timer_wait_wait

    ```


    for the V2, you will find that you consistently get three pulses of each duty
    cycle, separated by a longer pulse.


    What all this is is really about trying to lower your expectation of how sophisticated
    you can be in using PWM on the micro:bit. The fastest PWM repetition rate that
    you can use with the V1 is about 30ms and minimize the glitches you need to leave
    the duty cycle stable from 10 to 20 pulses, i.e. about 200-600ms. In many applications
    this is very acceptable, but don''t expect to use PWM to send coded data and using
    it for waveform synthesis as a D to A converter is limited to around 4kHz.


    # Uses of PWM – Digital to Analog


    What sorts of things do you use PWM for? There are lots of clever uses for it.
    However there are two cases which account for most PWM applications - voltage
    or power modulation and signaling to servos.


    The amount of power delivered to a device by a pulse train is proportional to
    the duty cycle. A pulse train that has a 50% duty cycle is delivering current
    to the load only 50% of the time and this is irrespective of the pulse repetition
    rate.


    So duty cycle controls the power, but the still matters in situations you want
    to avoid any flashing or other effects - a higher frequency smooths out the power
    flow at any duty cycle.


    If you add a low-pass filter to the output of a PWM signal then what you get is
    a voltage is proportional to the duty cycle. This can be looked at in many ways,
    but again it is the result of the amount of power delivered by a PWM signal. You
    can also think of it as using the filter to remove the high frequency components
    of the signal, leaving only the slower components due to the modulation of the
    duty cycle.


    The framework''s PWM functions are designed to allow you to use this as a Digital
    to Analog (D-to-A) converter and this is why the function is setValue and notDuty
    cycle. It mimics the workings of an eight-bit D-to-A converter. You set the duty
    cycle using a value in the range 0 to 1023 and you get a voltage output that is:


    3.3*value/1023 V'
  merge: -1
  img_proc: true
- pgno: 77
  md: "The only problem is that if your aim is to get a clean wave form you have a\
    \ lot of work to do. The fastest pulse rate is around 50ms on a V1 and the usual\
    \ rule of thumb is that you need ten pulses to occur per conversion, i.e. the\
    \ maximum frequency you can produce is:\npulse rate/10\n\nThis means the fastest\
    \ signal you can create using the micro:bit is 1/500MHz or 2kHz, which isn't fast\
    \ enough for a great many applications. In particular, you can't use it for complex\
    \ sound synthesis.\n\nYou also have 1024 voltage levels you can use. At 3.3v each\
    \ step corresponds to about 300µV. This is unrealistic for many applications and\
    \ setting the voltage to the nearest 300mV or more sensible.\n\nTo demonstrate\
    \ the sort of approach that you can use for D-to-A conversion, the following program\
    \ creates a triangle or ramp waveform:\n\n```\n#include \"MicroBit.h\"\n\n//define\
    \ wait_us system_timer_wait_us // uncomment for V2\nMicroBit uBit;\n\nint main()\
    \ {\n  int i;\n  uBit.init();\n  uBit.P0.setAnalogValue(200);\n  uBit.P0.setAnalogPeriodUs(50);\n\
    \  for(i=0;i<1024;i+=10) {\n    uBit.io.P0.setAnalogValue(i);\n    wait_us(100);\n\
    \  }\n  release_fiber();\n  return 0;\n}\n```\n\nThe inner loop for sets values\
    \ of 0 to 1024 in steps of 10, i.e. 300mV per step and the delay of 100ms produces\
    \ a total loop time of over 180ms. This means that around three pulses of each\
    \ duty cycle should be produced - which is far too few, but it is interesting\
    \ to see what happens. The waveform repeats around 18ms, which makes the frequency\
    \ around 66Hz. Using an oscilloscope, the measured repeat time is more like 20ms\
    \ or 50Hz."
  merge: -1
  img_proc: true
- pgno: 78
  md: 'To see the analog wave form, we need to put the digital output into a low-pass
    filter. A simple resistor and capacitor work reasonably well - the cut-off frequency
    for the filter is shown is 200Hz.


    ![](img/23976341c9281123e7b181beea6e9dbd_78_0.png)


    The filter''s cut-off is a little on the low side as can be seen by the slow fall
    to ground the end of each waveform. However, if you increase the cut-off then
    even more irregularities will show in the ramp. The reason for these irregularities
    is the short time each duty cycle is presented and the glitches occur when changing
    duty cycle.


    ![](img/23976341c9281123e7b181beea6e9dbd_78_1.png)


    If you change the wait to 200 so that six or so duty cycles are presented the
    result looks smoother and with fewer glitches:


    ![](img/23976341c9281123e7b181beea6e9dbd_78_2.png)'
  merge: -1
  img_proc: true
- pgno: 79
  md: 'If you reduce the number of steps to 100 you get the same frequency and a reasonably
    acceptable waveform:


    ![](img/23976341c9281123e7b181beea6e9dbd_79_0.png)


    You can create a sine wave, or any other waveform you need, using the same techniques,
    but 100Hz is a practical upper limit on what you can manage.


    # Music


    So how can the micro:bit generate musical notes? The simplest solution is to try
    to generate anything other than a square wave. That is, use the pulse period rather
    than duty cycle.


    As the frequency of middle C is 261.6Hz, the period needed is roughly 3823µs and
    to generate middle C you could use:


    ```

    uBit.io.P0..setAnalogValue(511);

    uBit.io.P0..setAnalogPeriodUs(3823);

    ```


    The resulting output is a square wave, which isn''t particularly nice to listen
    to. You can improve it by feeding it through a simple low-pass filter like the
    one used for waveform synthesis. The correct values of R and C are a matter of
    taste, but 1µF to 0.1 and 1k work reasonably well.


    The period t need for any frequency f is:

    t = 1/f


    and you can look up the frequencies for other notes and use a table to generate
    them.


    The micro:bit V2 is fast enough to do a much better job of creating complex sounds
    – so much so that it has a complete synthesizer in software. For more information,
    see Chapter 15.'
  merge: -1
  img_proc: true
- pgno: 80
  md: '# Controlling An LED


    You can use PWM supply to control the brightness of an LED for example, or the
    rotation rate of a DC motor. The only differences in applications such as these
    are to do with the voltage and current you need and the way the duty cycle relates
    to whatever the physical effect is. In other words if you want to change some
    device by 50% how much do you need to change the duty cycle? For example how we
    "dim an LED? By changing the duty cycle of the PWM pulse train you can set the
    amount of power delivered to an LED, or any other device, and hence change its
    brightness.


    For example, an LED we might use a 3.3V supply and a current of a few tens of
    milliamperes. In the case of an LED connection between duty cycle and brightness
    is a complicated matter, but the simplest approach uses the fact that the perceived
    brightness is roughly proportional to the cube of the input power. The exact relationship
    is more complicated, but this is good enough for most applications.


    As the power supplied to the LED is proportional to the duty cycle, we have: b
    = kd


    b is the perceived brightness and d is the duty cycle.


    Notice that as the LED when powered by a PWM signal is either on or full off,
    there is no effect of the change in LED light output with current - the LED is
    always run at the same current.


    What all of this means is if you want an LED to fade in a linear fashion you need
    to change the duty cycle in a non-linear fashion. Intuitively it means that changes
    when the duty cycle is small produce bigger changes in brightness when the duty
    cycle is large. For a simple example we need to connect a standard LED to the
    PWM line.


    Given that all of the microbit''s GPIO lines work at 3.3V and ideally only supply
    0.5mA, we need a transistor to drive the LED which typically draws 20mA. You could
    use a FET of some sort, but for this application of old-fashioned Bipolar Junction
    Transistor works very well and is cheap and available in a through-hole mount,
    i.e. it comes with wires.


    Almost any general purpose npn transistor will work, the 2N2222 is very common:


    ![](img/23976341c9281123e7b181beea6e9dbd_80_0.png)'
  merge: -1
  img_proc: true
- pgno: 81
  md: "R1 restricts the current to 0.48mA, which is below the target 0.5mA, and assuming\
    \ that the transistor has a minimum current gain (listed as hfe or beta) of 50\
    \ provides 24mA to power it. R2 limits the current to 20mA. Notice that these\
    \ values are for a red LED with forward voltage drop of 1.8V and typical current\
    \ 20mA. LEDs of different color have different voltage drops and currents.\n\n\
    If you are using the 2N2222A pins are:\n\n![](img/23976341c9281123e7b181beea6e9dbd_81_0.png)\n\
    \nAs always, the positive terminal on the LED is the long pin.\nAssuming that\
    \ you have this circuit constructed, then a simple PWM program to modify its brightness\
    \ from low to high and back to low in a loop;\n\n```\n#include \"MicroBit.h\"\n\
    //define wait_us system_timer_wait_us // uncomment for V2\nMicroBit uBit;\n```\n\
    \n```\nint main() {\n  uBit.init();\n  uBit.io.P0.setAnalogValue(511);\n  uBit.io.P0.setAnalogPeriodUs(1000);\n\
    \  int w=1;\n  int inc=1;\n  for (;;) {\n    uBit.io.P0.setAnalogValue(w);\n \
    \   w+=inc;\n    if(w>1024 || w<=0)inc=-inc;\n    wait_us(5000);\n  }\n  release\
    \ fiber();\n  return 0;\n}\n```\n\nThe basic idea is to set up a pulse train with\
    \ a period of 1ms. In the for the duty cycle is set to 0% to 100% and back down\
    \ to 0%. Notice that the way that the loop counts up and down is use inc which\
    \ is either 1 or -1 and using the age old trick of flipping between 1 and -1 and\
    \ back again by multiplying by -1."
  merge: -1
  img_proc: true
- pgno: 82
  md: "If you watch the flashing you will see that it changes brightness very quickly,\
    \ and then seems to spend a long time \"stuck\" at almost full brightness, and\
    \ then suddenly starts to dim rapidly. This is a consequence of the way the human\
    \ eye perceives light output as a function of input power.\n\n# Changing the LED\
    \ brightness\n\nWhat about a linear change in brightness?\n\nTo achieve this reasonably\
    \ accurately isn't difficult all we need to do is increase the power or equivalently\
    \ the duty cycle in steps that are cubic. If we use just 0 to 10 we get a pulse\
    \ width of 0 to 1000, which is ideal for 1ms pulse used in the previous example,\
    \ i.e. 0 to close to 100% duty cycle.\n\nIf you need the ultimate speed you could\
    \ pre-compute the powers, but for simplicity we will use integer multiplication:\n\
    \n```\n#include \"MicroBit.h\"\n//define wait_us system_timer_wait_us // uncomment\
    \ for V2\nMicroBit uBit;\n\nint main() {\n  uBit.init();\n  uBit.io.P0.setAnalogValue(511);\n\
    \  uBit.io.P0.setAnalogPeriodUs(1000);\n\n  int w=0;\n  int inc=1;\n  for (;;)\
    \ {\n    uBit.io.P0.setAnalogValue(w*w*w);\n    w=w+inc;\n    if(w>10 || w<=0)\
    \ inc=-inc;\n    wait_us(50000);\n  }\n  release_fiber();\n  return 0;\n}\n```\n\
    \nAs this produces 10 cubic steps, a wait_us of 50000 makes each step last 5µs\
    \ and it takes 50ms to go from low to high.\n\nIf you try the program you should\
    \ find that you see the LED increase steadily towards a maximum and then decrease\
    \ steadily to a minimum.\n\nIf you replace the delay with a value of 100,000 you\
    \ will get a 1-second cycle which, using only ten steps, to start like a little\
    \ \"flashy\"."
  merge: -1
  img_proc: true
- pgno: 83
  md: "You can increase the number of steps by simply dividing by a suitable factor.\
    \ If you cube 1 to 20 you get 1 to 8000 and dividing by 8 gives 0 to 1000. Dividing\
    \ by 8 is just a matter of three right shifts and so while not very accurate does\
    \ allow fast computation with integer arithmetic:\n\n```\nint w=0;\nint inc=1;\n\
    for(;;) {\n uBit::io.P0.setAnalogValue((w*w*w)>>3);\n w+=inc;\nif(w>20 || w<=0)\
    \ inc=-inc;\n wait_us(50000);\n}\n```\n\nNotice that there are now twice as many\
    \ steps we only need each one to last half the time, i.e. 50,000µs.\n\nIn most\
    \ cases, exactly how linear the response of the LED is irrelevant - a rough approximation\
    \ looks as smooth as the human eye. The only exception is when you are trying\
    \ to drive LEDs to create a gray level or color display when color calibration\
    \ is another level of accuracy.\n\n# Controlling a Servo\n\nHobby servos, the\
    \ sort used in radio PWM models, are very cheap and easy to use and the micro-bit\
    \ has enough PWM lines to control three of them without much in the way of extras\
    \ and losing any other facilities. You can of course control more if you are prepared\
    \ to sacrifice using the LED display.\n\nA basic servo has just three connections\
    \ - usually ground, a power line and a signal line. The colors used vary, but\
    \ the power is usually red and the ground line is usually black or brown. The\
    \ signal line is white, yellow or orange.\n\n![](img/23976341c9281123e7b181beea6e9dbd_83_0.png)"
  merge: -1
  img_proc: true
- pgno: 84
  md: 'The power wire has to be connected to a 5V supply capable of providing enough
    current to run the motor - anything up to 500mA or more depending on the servo.
    The micro:bit only has a 3V supply, you will need an additional power source.
    The good news is that the signal line generally needs very little current, although
    it does need to be switched between 0 and 5V using a PWM signal.


    You can assume that the signal line needs to be driven as a voltage load and so
    the appropriate way to drive the servo is:


    ![](img/23976341c9281123e7b181beea6e9dbd_84_0.png)


    The resistor R1 can be a lot larger than 10K for most servos - 47K often works.
    The 5.6K resistor limits the base current to slightly less than 0.5mA. Pin 1 can
    be connected to the micro:bit''s 5V supply or to a separate supply if you need
    more current.


    This is the correct way to drive a servo but in nearly all cases you can connect
    the servo to 5V and the pulse line directly to the 3.3V GPIO line. In other words,
    in most cases you don''t need a transistor driver and the circuit shown below
    will work:


    ![](img/23976341c9281123e7b181beea6e9dbd_84_1.png)'
  merge: -1
  img_proc: true
- pgno: 85
  md: "Now all we have to do is set the PWM line to produce 20ms pulses with widths\
    \ ranging from 0.5 to 2.5 ms. You can do this using the PWM functions we have\
    \ been using but the framework has a set of functions that are specifically for\
    \ servo control:\n\n+   * int setServoValue(int value)\n* int setServoValue(int\
    \ value, int range)\n* int setServoValue(int value, int range, int center)\n\n\
    These set the duty cycle using a default pulse rate of 20ms. If for any reason\
    \ you need a different pulse rate you can set it using:\n\n```\nint setServoPulse(int\
    \ pulseWidth)\n```\n\nThe three forms of ServoValue function cater for different\
    \ degrees of customization that the servo needs.\n\nThe first, setServoValue simply\
    \ produces pulses with widths ranging from 500µs to 2.5 milliseconds, which is\
    \ what most servos work with, specified as a value from 0 to 180 corresponding\
    \ to the normal 180 degree rotation of a servo.\n\nThe other two functions allow\
    \ you to set the range and center value. If you specify a range and center then\
    \ the angle selects a value in the range: center - range/2 and center + range/2\n\
    \nIf you only specify a range of ten the default center of 1.5ms is used.\n\n\
    So the simplest servo program you can write is something like:\n#include \"MicroBit.h\"\
    \nMicroBit uBit;\n\n```\nint main() {\n  uBit.init();\n  for (;;) {\n    uBit.io.P0.setServoValue(0);\n\
    \    uBit.sleep(1000);\n    uBit.io.P0.setServoValue(90);\n    uBit.sleep(1000);\n\
    \    uBit.io.P0.setServoValue(180);\n    uBit.sleep(1000);\n  }\n  release fiber();\n\
    \  return 0;\n}\n```\n\nThis moves the servo to three positions and pauses. If\
    \ you run the program using the circuit with the transistor driver given earlier,\
    \ you will discover that the servo does nothing at all – apart, perhaps, from\
    \ vibrating."
  merge: -1
  img_proc: true
- pgno: 86
  md: "The reason is that the transistor voltage driver is an inverter. When the PWM\
    \ line is high, the transistor is fully on and the servo's pulse line is effectively\
    \ grounded. When the PWM line is low, the transistor is fully off and the servo's\
    \ pulse line is pulled high by the resistor.\n\nA common solution to this problem\
    \ is to drive the servo using an emitter-follower configuration, but in this case\
    \ it's not possible because the maximum voltage generated by an emitter-follower\
    \ configuration is:\n\n# 3.3 — 0.6 = 2.7V\n\nwhich is too low to drive most servos.\n\
    \nThe standard solution in this case is to use two transistors to generate a non-inverted\
    \ pulse, but it is possible to use a single transistor in a non-inverting configuration.\n\
    \nThe simplest solution of all is to ignore the problem in hardware and solve\
    \ it in software. Instead of generating 20ms pulses with widths 0.5ms to 2.5ms,\
    \ we can generate an inverted pulse with 20ms pulses with widths in the range\
    \ 17ms to 19ms. To do this we have to go back using the non-servo PWM functions.\
    \ The principle is that if the servo needs a 10% duty cycle we supply it with\
    \ a 90% duty cycle the inverter converts back to a 10% duty cycle. The range of\
    \ duty cycles we need from 17.5 to 19.5ms, which in percentages is 87.5% to 97.5%\
    \ or as 895 to 997.\n\nSimple math can convert an angle T to a value as values\
    \ 895 to 997:\nvalue = (997-895)/180*T + 895\n= 138*T/180 + 895\n\nTo make this\
    \ works with all servos it is a good idea to restrict the range to 1ms to 2ms,\
    \ or inverted 18ms to 19ms, and hence values from 920 to 972:\nvalue = 52*T/180+920\n\
    \nSo we can write the same testing as:\n\n```\n#include \"MicroBit.h\"\nMicroBit\
    \ uBit;\nint main() {\n  uBit.init();\n  uBit.io.P0.setAnalogValue(0);\n  uBit.io.P0.setPeriod(20);\n\
    \  for (;;) {\n    uBit.io.P0.setAnalogValue(52 * 0 / 180 + 920);\n    uBit.sleep(1000);\n\
    \    uBit.io.P0.setAnalogValue(52 * 90 / 180 + 920);\n    uBit.sleep(1000);\n\
    \    uBit.io.P0.setAnalogValue(52 * 180 / 180 + 920);\n    uBit.sleep(1000);\n\
    \  }\n  release fiber();\n  return 0;\n}\n```"
  merge: -1
  img_proc: true
- pgno: 87
  md: 'If you run this program you should find that the servo moves as promised. However,
    it might not reach its limits of movement. Servos differ in how they respond to
    the input signal and you might need to calibrate the pulse widths. Many robot
    implementations, for example, calibrate servos to find their maximum movement
    using either mechanical switches to detect when the servo is at the end of its
    range or a vision sensor.


    You can see from the logic analyzer plot that the PWM pulse train at the GPIO
    pin is “inverted” as desired:


    ![](img/23976341c9281123e7b181beea6e9dbd_87_0.png)


    You can also see that the values used for the period and for the pulse width could
    do with some adjustment to bring them closer to the target values. In practice,
    however, servo calibration is the better answer.


    # Non-Inverting Drivers


    The software solution to driving a servo via a simple inverting buffer is elegant,
    slightly messy when it comes to computing the duty cycle needed. The traditional
    solution is to use two transistors to create a non-inverting buffer:


    ![](img/23976341c9281123e7b181beea6e9dbd_87_1.png)'
  merge: -1
  img_proc: true
- pgno: 88
  md: 'There is a way to use a single transistor as a non-inverting buffer using a
    common base configuration:


    ![](img/23976341c9281123e7b181beea6e9dbd_88_0.png)


    In this variation on a common base mode the transistor''s base is connected to
    the 3.3V line and its collector to the 5V supply. Note that the two power supplies
    have share a common earth.


    If the GPIO output is low then R6 sets the base emitter voltage to 0.6V and the
    transistor is hard on, pulling the output to the servo low.


    If the GPIO output is high the base emitter voltage is zero and the transistor
    is cut off, making the output to the servo high.


    You can see that this is non-inverting, but the current that flows through R7
    is also the emitter current, which is the current GPIO line has to sink. What
    this means is that the current in R7 is limited to around 1mA and this circuit
    provides no amplification. Of course, you could add another transistor to provide
    current amplification, but in this case you would be better off going back to
    the standard two-transistor arrangement.


    This circuit does, however, work with most servos so in this role it is useful.
    The current in the GPIO line is 1mA and should be driven in strong mode, but it
    does work in standard mode if you just want to test things out.'
  merge: -1
  img_proc: true
- pgno: 89
  md: "Here is a \"non-inverted\" version of the test program given earlier. The range\
    \ of duty cycle is limited to 1ms to 2ms to make sure it works with all servos.\
    \ Change the range or center value to make it work with your servo:\n\n```\n#include\
    \ \"MicroBit.h\"\nMicroBit uBit;\n\nint main() {\n  uBit.init();\n  for(;;) {\n\
    \    uBit.io.P0.setServoValue(0,1000);\n    uBit.sleep(1000);\n    uBit.io.P0.setServoValue(90,1000);\n\
    \    uBit.sleep(1000);\n    uBit.io.P0.setServoValue(180,1000);\n    uBit.sleep(1000);\n\
    \  }\n  release_fiber();\n  return 0;\n}\n```\n\n# What Else Can You Use PWM For?\n\
    \nPWM lines are incredibly versatile and it is always worth asking the question\
    \ \"could I use PWM?\" when you are considering almost any problem.\n\nThe LED\
    \ example shows how you can use PWM as a power controller. You can extend this\
    \ idea to a computer controlled switch-mode power supply. All you need is a capacitor\
    \ to smooth out the voltage and perhaps a transformer to change the voltage.\n\
    \nYou can also use PWM to control the speed of a DC motor and if you add a simple\
    \ bridge circuit you control its direction and speed.\n\nFinally, you can use\
    \ a PWM signal as a modulated carrier for data communications. For example, most\
    \ infrared controllers make use of a 38kHz carrier, which is roughly 26µs. This\
    \ is switched on and off for 1ms and this is well within the range that the PWM\
    \ can manage. So all you have to do is replace the red LED in the previous circuit\
    \ with an infrared LED and you have the start of a remote control, or data transmission,\
    \ link."
  merge: -1
  img_proc: true
- pgno: 90
  md: '# Summary


    +   * PWM, Pulse Width Modulation, has a fixed repetition rate but a variable
    duty cycle, i.e. the amount of time the signal is high or low changes.


    +   * PWM can be generated by software simply by changing the state of a GPIO
    line correctly, but it can also be generated in hardware so relieving the processor
    of some work.


    +   * As well as being a way of signaling, PWM can also be used to vary the amount
    of power or voltage transferred. The higher the duty cycle, the more power/voltage.


    +   * Hardware PWM can generate high speed pulses, but how quickly can change
    the duty cycle is still software-limited.


    +   * PWM can be used to implement a D to A converter simply by varying the duty
    cycle.


    +   * By varying the output of the D to A you can create music.


    +   * In the same way, by varying the duty cycle, you can dim an LED. As the brightness
    of an LED is not linear with applied voltage, you have to modify the output using
    a cubic law to get linear changes in brightness.


    +   * Servo motors set their position in response to the duty cycle of a PWM signal.'
  merge: -1
  img_proc: true
