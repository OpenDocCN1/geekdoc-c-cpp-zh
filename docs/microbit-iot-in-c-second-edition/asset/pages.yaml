- pgno: 30
  md: '# Summary


    +   - The split between the V1 and V2 versions of the micro:bit is problematic.
    The V1 is a deprecated mbed device and the V2 has abandoned the use of the mbed
    software.


    +   - The microbit V1 build system is based on Yotta, a program created for the
    mbed project. While it is still supported, it is better to base as little as possible
    on its use.


    +   - Both V1 and V2 projects can be treated as Cmake projects and this makes
    the minimal prerequisites very similar for both. You need the ARM cross compiler
    together with Cmake and Ninja or in some cases.


    +   - You can use any Cmake-supporting IDE to work with projects, but VS Code
    is well suited and recommended.


    +   - For a V1 project you can download and install Yotta and create the files
    and folders needed. A simpler way to get started is to download the template provided
    at the I Programmer GitHub repository.


    +   - Although V2 projects are what simpler the quickest way to get started is
    to download the V2 template from the I Programmer GitHub repository.


    +   - The result of compiling a V1 or a V2 project is a hex file created by srecord
    which can be copied to the micro:bit via the USB connection.


    +   - Each hex file only works the type of micro:bit it is created for. A new
    universal hex file can be created which combines both types of hex file into one.'
  merge: -1
  img_proc: true
