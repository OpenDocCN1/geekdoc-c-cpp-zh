- pgno: 198
  md: "```\nvoid debug(ManagedString s) {\n    uBit.serial.redirect(USBTX, USBRX);\n\
    \    uBit.serial.send(s, SYNC_SPINWAIT);\n    uBit.serial.redirect(Tx, Rx);\n\
    }\n```\n\n```\nint find(ManagedString c, ManagedString s) {\n    int i;\n\n  \
    \  for (i = 0; i < (s.length() - c.length()); i++) {\n        if (c == s.substring(i,\
    \ c.length())) break;\n    }\n\n    if (i == (s.length() - c.length())) return\
    \ 0;\n    return 1;\n}\n```\n\nWhen you run this program then you should see:\n\
    \n```\nAT\nOK\n```\n\nprinted on the serial console.\nIf you dont there are five\
    \ possible reasons:\n\n+   1. You have connected the wrong pins - check you\n\
    2. The power supply you are using is inadequate - check/replace\n3. The serial\
    \ console is not working - check you can see any message\n4. The baud rate is\
    \ wrong - try 9600\n5. The ESP8266 is broken - try another\n\n# Some Utility Functions\n\
    \nBefore we get into the details of connecting to a network and transferring data,\
    \ it is worth constructing some useful functions.\nThe need to wait for an OK\
    \ or similar response is so common that it is worth having a function to do the:\n\
    \n```\nint waitWifi(ManagedString target, int retry, int pause) {\n    ManagedString\
    \ s;\n    do {\n        uBit.sleep(pause);\n        if(s.length()>500) s==\";\n\
    \        s = s + uBit.serial.read(500, ASYNC);\n        retry--;\n    } while\
    \ (find(target, s) == 0 && retry != 0);\n    if (DEBUG)debug(\"\\n\\r\" + s +\
    \ \"\\n\\r\");\n    return retry;\n```"
  merge: -1
  img_proc: true
- pgno: 199
  md: "Notice that now we specify the target, a pause in milliseconds between polling\
    \ attempts, and a timeout in terms of how many retries before the function gives\
    \ up. Notice that the function returns 0 if there was a failure and the retry\
    \ loop timed out and the number of retries remaining otherwise.\n\nUsing this\
    \ utility function ATWiFi function can be written:\n\n```\nint ATWiFi() {\n  \
    \  uBit.serial.send(\"AT\\n\", SYNC_SPINWAIT);\n    return waitForWiFi(\"OK\"\
    ,150,10);\n}\n```\n\nThis is a shorter and easier to understand.\n\nAssuming you\
    \ have managed to make the AT command work, it is time to move on to other AT\
    \ commands. The first useful command is to find the version number of the firmware.\
    \ This is more or less the same as the AT function, but the command is ATGMR and\
    \ we get back data - hence the longer wait time:\n\n```\nint getVersionWiFi()\
    \ {\n    uBit.serial.send(\"ATGMR\\n\", SYNC_SPINWAIT);\n    return waitForWiFi(\"\
    OK\",200,10);\n}\n```\n\nThe device in use is returned:\n\nAT+GMR\nAT version:0.60.0.0(Jan\
    \ 29 2016 15:10:17)\nSDK version:1.5.2(7eee54f)\nAi-Thinker Technology Co. Ltd.\n\
    May 5 2016 17:30:30\nOK\n\nThe manual says that it should return AT, SDK and the\
    \ time it was compiled, so we get a little extra with this third-party device.\n\
    \nAnother useful function initiates a reset. The device often gets stuck and a\
    \ reset is all that you can try. This is a software reset; another option is to\
    \ use a GPIO line to connect reset pin 6. By controlling this line you can force\
    \ the device to reset. The soft reset command is AT+RST and all you get back in\
    \ theory is OK, but in practice the device sends a few hundred bytes of configuration\
    \ data:\n\n```\nint resetWiFi() {\n    uBit.serial.send(\"AT+RST\\r\\n\", SYNC_SPINWAIT);\n\
    \    return waitForWiFi(\"OK\", 1000,10);\n}\n```"
  merge: -1
  img_proc: true
- pgno: 200
  md: "The final utility function is to set the serial connection parameters to 115200\
    \ baud, 8 bits, 1 stop bit, no parity, no flow control:\n\n```\nint setWiFi()\
    \ {\n  uBit.serial.send(\"AT+UART CUR=115200,8,1,0\\r\\n\",SYNC_SPINWAIT\\);\n\
    \  return waitForWiFi(\"OK\", 200, 10);\n}\n```\n\nIf you change the baud rate\
    \ to something other than what is in you will, of course, lose communication with\
    \ the device until you reconfigure micro:bit's serial connection.\n\n# Configuring\
    \ WiFi\n\nThe first thing we need to configure is the operating mode. The ESP8622\
    \ can operate as an access point, i.e. it can allow other devices to connect to\
    \ it. However, in most cases you will want it to work in client, connecting to\
    \ your existing WiFi.\n\n# Mode\n\nA function to set its operating mode is:\n\n\
    ```\nint modeWiFi(int mode) {\n  ManagedString cmd=\"AT+CWMODE CUR=\"+String(mode)+\"\
    \\r\\n\";n  uBit.serial.send(cmd, SYNC_SPINWAIT);\n  return waitForWiFi(\"OK\"\
    , 200, 10);\n}\n```\n\nNotice now that we are constructing the command to send\
    \ to the device in a separate step. If you try and do this on the fly in the function\
    \ call, the rate of transmission of the serial data varies and the device can\
    \ time out. In practice, construct all commands to send to the device first and\
    \ then send them.\n\nIn this case the command is:\n\n```\nAT+CWMODE_n\n```\n\n\
    where n is 1 for client, 2 for access point and 3 for both. If you want to make\
    \ the change permanent change CUR to DEF and the setting is stored in Flash. Older\
    \ devices do not support CWMODE_CUR. Simply change it to CWMODE, which is deprecated.\n\
    \nTo set WiFi you would call:\nmodeWiFi(1);\n\nand see OK sent back."
  merge: -1
  img_proc: true
- pgno: 201
  md: "# Scan\n\nThe scan function is that everyone wants to try out, but in practice\
    \ it isn't very useful. Why would you want a list of WiFi networks? There are\
    \ some applications for this function, but not as many as you might think. In\
    \ most cases, you simply want to connect to a known WiFi network, which is what\
    \ we do in the next section.\n\nThe scan command is easy - just send AT+CWLAP\
    \ and the device sends you a complete list of WiFi networks. The problem is that\
    \ scanning takes long time and often hangs. This is one case where we really need\
    \ to specify a long time until timeout:\n\n```\nint scanWiFi() {\n  uBit.serial(\"\
    AT+CWLAP\\r\\n\", SYNC_SPINWAIT);\n  return waitForWiFi(\"OK\", 200, 20);\n}\n\
    ```\n\nSometimes the loop completes with a full list, sometimes it doesn't. It\
    \ depends on the WiFi networks that are available and how they reply to requests.\n\
    \n# Connecting to WiFi\n\nOur final and most useful functions connect the device\
    \ to a known WiFi network. All you have to do is supply the SSID and password.\
    \ There are other versions of the command that allow you to specify the connection\
    \ more precisely, but this general form is the most useful.\n\nConnection to a\
    \ network takes a while and there is quite a lot of data sent back\n\nIf you have\
    \ an older device you might need to change CWAP_CUR to the deprecated CWJAP command.\
    \ There is also a CWAP_DEF command that will save the connection in the Flash\
    \ memory. The connection is made using: connectWiFi(\"myWiFi\",\"myPassword\"\
    );"
  merge: -1
  img_proc: true
- pgno: 202
  md: "After a few seconds you should see:\n\n```\nAT+CWJAP CUR=\"myWiFi\",\"myPassword\"\
    \nWIFI DISCONNECT\nWIFI CONNECTED\nWIFI GOT IP\n```\n\nOK\n\nOnce you are connected\
    \ and the \"WIFI GOT IP\" message has been received\nyou can ask what the IP address\
    \ is:\n\n```\nint getIPWiFi() {\n    uBit.serial.send(\"AT+CIFSR\\r\\n\", SYNC_SPINWAIT);\n\
    \    return waitForWiFi(\\(\"OK\", 200, 10);\n}\n```\n\nOf course, if you really\
    \ need to know the IP address in a program younneed to extract it from the string.\
    \ The device replies with:\n\nIP address:\nAT+CIFSR\n+CIFSR:STAIP,\"192.168.253.4\"\
    \n+CIFSR:STAMAC,\"5c:cf:7f:16:97:ab\"\n\nOK\n\nwhich makes very easy to get the\
    \ IP address even without the help of\nregular expression.\n\n# Getting a Web\
    \ Page\n\nNow that we have many functions we can tackle the two standard tasks\
    \ in\\using the TCP stack - sending data as a client and as a server.\nFirst,\
    \ we tackle the problem of acting as a client. This isn't as common as\nrequirement\
    \ as you might expect because most of the time devices like the\nmicrobit are\
    \ used to supply data to other servers, not the other way.\nHowever, it is worth\
    \ seeing how it is. It doesn't matter whether you are\nimplementing a client or\
    \ a server, you make use of sockets which represent\nthe basic TCP connection.\
    \ What you do with this connection is up to you. For\nine you send HTTP headers\
    \ on an appropriate port then you can fetch\nor deliver a web page, i.e. HTTP\
    \ over TCP. However, what data you actually\nsend and receive over a socket connection\
    \ is up to you and/or the protocol\nyou are trying to.\n\nHence the first thing\
    \ we have to set up a socket connection between the\nclient, i.e. the microbit,\
    \ and the server.\n\n```\nint getPageViewWiFi(ManagedString URL,ManagedString\
    \ page) {\n    ManagedString cmd = \"AT+CIPSTART:\\\"\",\\\"\" + URL + \"\\\"\
    ,80\\r\\n\";\n    uBit.serial.send(cmd, SYNC_SPINWAIT);\n    if (waitForWiFi(\\\
    (\"OK\", 100, 20)) == 0) return 0;\n}\n```"
  merge: -1
  img_proc: true
- pgno: 203
  md: 'You pass the URL to the function as an IP address or as a full URL, but the
    device looks up domain names using a fixed set of DNS servers. It is recommended
    that you use an IP address, especially when testing. The CIPSTART command opens
    a socket to the specified IP address and port. You can also specify a TCP or UDP
    connection:


    ```

    AT+CIPSTART=type, IP, port

    ```


    In this case use port 80 on the specified IP address. If it works you will get
    back a message like this:


    ```

    Connect

    AT+CIPSTART="TCP", "192.168.253.23", 80

    CONNECT

    ```


    OK


    Now we have a socket open we can send data to the server and wait for some data
    to be back to us. This is the most difficult part of using the microbit on the
    web. If you request a web page then it is fairly likely that the data you get
    back is of too much to hold in memory. Either you have to load a very small web
    page - a few hundred bytes - process it on the fly as the data comes in. For this
    example the web page is served by a small sensor that returns a JSON temperature
    and humidity reading. The sensor is another micro:bit and the web server is described
    in the next section.


    To send data over a socket use CIPEND, which will send any data you specify to
    the server. As already made clear, what you send is a matter for whatever protocol
    you use over the socket. In this case it is HTTP and we are going to send headers
    corresponding to a GET request for index.html:ManagedString http = "GET /index.html
    HTTP/1.0\r\nHost:192.168.253.23\r\n\r\n"


    There are two headers:


    ```

    GET /index.html HTTP/1.0

    Host:192.168.253.23

    ```


    Note that an HTTP request always ends with a blank line.

    To send this use the CIPEND command which specifies the number of characters that
    are to follow:


    ```

    cmd = "AT+CIPSEND=" + ManagedString(http.length()) + "\r\n"

    uBit.serial.send(cmd, SYNC_SPINWAIT);

    ```'
  merge: -1
  img_proc: true
- pgno: 204
  md: "Now we have to send the number of bytes/ characters that we specified in the\
    \ CIPSEND but first we wait for a \">\" to indicate that the device is ready to\
    \ receive the data:\n\nWhat happens next depends on the server. As a result of\
    \ the HTTP GET the server will now send data over the WiFi link and the device\
    \ will send this over the connection as soon as it gets it. We can't use the waitFor\
    \ function because it might swap the serial lines and cause a spurious character\
    \ to be transmitted. Notice that this data is not a direct response to a command\
    \ and so the device prefixes it with:\n\n+IPD, len:\n\nThe +IPD makes it clear\
    \ to the client that it is a packet of data sent from the server. The len value\
    \ gives the number of characters after the colon. In principle, what your program\
    \ should do is not sit in a polling loop looking for +IPD. It should read the\
    \ digits between the comma and the colon and convert this to an integer. Finally,\
    \ it should read exactly that number of characters from the serial port.\n\nThis\
    \ can be done, but for a demonstration we simply read any data that is presented\
    \ on the serial port for a reasonable amount of time in an attempt to capture\
    \ all of the data. Notice that this is a fine balance between avoiding a buffer\
    \ overrun because you don't read it enough and not waiting long enough for all\
    \ of the data.\n\nThere is also the problem that you can run out of memory on\
    \ the V1 - about 700 bytes seems to be the limit for the program as presented:\n\
    \n```\nretry = 100;\ndo {\n  uBit.sleep(100);\n  s = s + uBit.serial.read(500,\
    \ ASYNC);\n  retry--;\n} while (s.length() < 500 && retry != 0);\n```\n\n```\n\
    if (DEBUG)debug(\"\\n\\rPage\\n\\r\" + s + \"\\n\\r\");\n  return 1;\n```\n\n}"
  merge: -1
  img_proc: true
- pgno: 205
  md: 'The test website sends a very small amount of data and the result is: +IPD,17:HTTP/1.0
    200 OK


    ```

    +IPD,99:Server: BaseHTTP/0.6 Python/3.2.3

    Date: Thu, 14 Jul 2016 16:42:37 GMT

    Content-type: text/html

    ```


    ```

    +IPD,127:<html><head><title>Temperature</title></head><body><p>Temperature:31.43</p><br>="humidity":0,"airtemperature":0}</p></html>CLOSED

    ```


    You can see that there are "packets" of data - 17 characters, and finally 127
    characters. In principle, you could process the +IPD characters as they come in
    and work out how many characters to read. However, you wouldn''t know how many
    packets to expect.


    Reading data from the web, or any other protocol, is limited to only small amounts
    of data - the example above is typical.


    # A Web Server


    The common use for an internet connection on a small device like the microbit
    is to allow another device to request data. It is fairly easy to create a web
    server running on the ESP8266, but not easily create Apache or anything advanced.
    You can reasonably do accept a connection and send a web page or two back to the
    client.


    The key differences between client and server mode is that in server mode the
    device constantly "listening" for clients to make TCP connections on the port.
    When the device receives a connection it reads all of the data the client has
    sent and passes it on via the serial port to the microbit. This means that in
    server mode the microbit has to be constantly on the lookout for new data from
    the ESP8266. You can do this using an interrupt, but for simplicity this example
    uses a loop.


    There is another difference between client mode and server mode - there can be
    multiple TCP connections from all the clients that try to connect. The solution
    to this problem is that the ESP8266 assigns each TCP connection an id number and
    this is what you need to use to make sure you send the data to the right place.
    Let''s see how it works.


    Assuming we are already connected with WiFi and have an IP address, we can set
    up a server quite easily. First we need to use the CIPMUX=1 to set the device
    into multiple connection mode. You cannot start a server if CIPMUX=0, the'
  merge: -1
  img_proc: true
- pgno: 206
  md: "default, single-connection. mode. Once multiple connections are allowed you\
    \ can create server using CIPSERVER=1,port.\n\nIn this example we are using port\
    \ 80, the standard HTTP port, but you can change this to anything you want:\n\n\
    ```\nint startWiFi() {\n  uBit.serial.send(\"AT+CIPMUX=1\\r\\n\", SYNC_SPINWAIT);\n\
    \  if (waitForWiFi(\"OK\", 100, 20) == 0) return 0;\n\n  uBit.serial.send(\"AT+CIPSERVER=1,80\\\
    r\\n\", SYNC_SPINWAIT);\n  if (waitForWiFi(\"OK\", 100, 20) == 0) return 0;\n\
    ```\n\nIf you run this part of the program you will see the response:\n+CIPMUX=1\n\
    \nOK\nAT+CIPSERVER=1,80\nno change\n\nOK\nNow we just have to wait for a client\
    \ to make a connection and send some data. This is done by reading the serial\
    \ input and checking for \"+IPD\":\n\n```\nfor (;) {\n  s=\"\"\n  do {\n    uBit.sleep(100)\n\
    \    if(s>500) s=\"\"\n    s = uBit.serial.read(500, ASYNC);\n  } while (find(\"\
    +IPD\", s) == 0);\nif (DEBUG) debug(\"\\n\\rClient Connected\\n\\r\" + s + \"\\\
    n\\r\");\n```\n\nNotice the start of the outer infinite loop. What are we going\
    \ to do is check for a connection, service and then go back to checking for another\
    \ connection - hence the outer infinite loop, the server loop.\n\nOnce we have\
    \ a connection it will be formatted so that the id is just after \"+IPD\". In\
    \ multi-connection mode the received data has the format:\n+IPD,id, rest of data"
  merge: -1
  img_proc: true
- pgno: 207
  md: 'We now need to extract the id so we can use it to communicate with the client.
    This is just some standard string handling, but it is still messy:


    ```

    int b = find("+IPD", s);

    s = s.substring(b + 1, s.length());

    b = find("'',", s);

    s = s.substring(b + 1, s.length());

    b = find("'',", s);

    Managed id = s.substring(0, b);

    if (DEBUG)debug("\n\rTCP id:" + id + "\n\r");

    ```


    The algorithm is:


    +   1. Find "+IPD" and trim the string so that it is the start.

    2. Find the first comma and trim the string so that it is the start.

    3. Find the next comma and extract the characters from the start of the string
    to the next.


    Now we have the id we can communicate with the client, but we first need something
    to send. There are a lot of possible headers we could send and then send, a reasonable
    minimum that works with most browsers is:


    ```

    ManagedString headers = "HTTP/1.0 200 OK\r\n";nheaders = headers + "Server: micro:bit\r\n";nheaders
    = headers + "Content-type: text/html\r\n\r\n";

    ```


    You can include timestamps and offsets of other useful information, but this is
    simple and it works. Notice the blank line at the end of the headers - this is
    vital. The browser will ignore everything sent to it if you don''t have a blank
    line at the end of the headers.


    The html data is a simple JSON-style data object giving humidity and temperature:


    ```

    ManagedString html="<html><head><title>Temperature</title></head><body>{"humidity":81,\"temperature":23.5C}</p></body></html>\r\n";

    ManagedString data=headers+html;

    ```


    Of course, in a real sensor you would add data into the HTML in place of the 81%
    and 23.5C. It would be easier to combine the headers and the data into a single
    data string. The only reason for defining them as two separate strings is to make
    it easier to see what they contain.


    Now we want to send the data to the client. This is just a matter of using the
    CIPSEND command again, this time with id specified as the first parameter:

    IPSEND=id,data length


    and wait for the response """ before sending the data.'
  merge: -1
  img_proc: true
- pgno: 208
  md: "Notice that we don't have to open a TCP socket as we did in the case of acting\
    \ as a client. The TCP socket has already been opened by the client connecting\
    \ to the server and when the transaction is complete we can close it:\n\n```\n\
    ManagedString cmd = \"AT+IPSEND=\"+id + \"\",*\"\nManagedString(data.length())\
    \ + \"\\r\\n\"\nuBit.serial.send(cmd, SYNC_SPINWAIT);\ns = 40;\nint retry = 0;\n\
    dn {\n\tuBit.sleep(100);\n\ts = s + uBit.serial.read(500, ASYNC);\n\tretry--;\n\
    } while (debug(\"\", s) == 0 && retry != 0);\n```\n\nNow, at last, we can send\
    \ the data to the client:\nuBit.serial.send(data, SYNC_SPINWAIT);\nif (waitWiFi(\"\
    OK\", 100, 100) == 0) return 0;\nif (DEBUG)debug(\"\\n\\rData Sent\\n\\r\");\n\
    \nAnd wait for it to complete.\nFinally we close the connection and complete the\
    \ loop to wait for another connection:\n\n```\ncmd = \"AT+CIPCLOSE=\" + id + \"\
    \\n\"\nuBit.serial.send(cmd, SYNC_SPINWAIT);\nif (waitForWiFi(\"OK\", 100, 100)\
    \ == 0) return 0;\n};\n```\n\nTry it out with a main program something like:\n\
    int main() {\n\tuBit.init();\ninitWiFi();\nmodeWiFi(1);\ntconnectWiFi(\"ssid\"\
    ,\"pass\");\ngetIPWiFi();\nstartServerWiFi();\n}\n\nYou should now be able to\
    \ connect to the IP address that is displayed and retrieve the web page that displays:\n\
    {\"humidity\":81%\",\"air temperature\":23.5C\"}\n\n# Where Next?\n\nThere are\
    \ a lot of WiFi commands that haven't been covered in this chapter, but now that\
    \ you have seen examples of most of the basic types and encountered the typical\
    \ problems that occur you should be able to implement any that you need."
  merge: -1
  img_proc: true
- pgno: 209
  md: 'The biggest problem in working with the microbit in serial mode it the limited
    amount of memory. If your program seems to have a tendency to simply "go quiet"
    on you then suspect that you are creating a ManagedString that is just too large.
    This is not a big problem when it comes to a server, but it is for a client trying
    to process a lot of data.


    There may also be better ways to handle the serial interaction between the two
    devices, but the method presented does seem to work reasonably well. If thing
    get in a mess then the retry limits usually reset the entire transaction if you
    wait long enough.


    There is still going to be the occasional unexplained crash and in this case the
    best solution is to use the soft reset command. It is also worth mentioning that
    the server program as presented does not actually handle multiple connections.
    It has to finish dealing with one connection before it can deal with the next.'
  merge: -1
  img_proc: true
