    ```


    There is another requirement in the form of a utility called srecord, but this
    is included with the project template and you don''t need to download it unless
    you are going to work without the template. In this case you can obtain srecord
    from Sourceforge as a source file that you can build yourself.

    , and more simply, you can download a binary for Windows from:


    https://sourceforge.net/srecord/files/srecord-win32/


    Simply unzip srecord_cat.exe into a directory that is on the path - thenCMake/bin
    directory is an easy choice.


    # VS Code


    Both V1 and V2 templates use CMake for build configuration and this means you
    can use any IDE that has CMake support. In the first edition of this book the
    IDE of choice was NetBeans and this still works, but Visual Studio Code, VS Code,
    is now a better choice. It has good CMake support and its popularity means it
