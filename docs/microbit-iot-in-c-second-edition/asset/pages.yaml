- pgno: 21
  md: 'Install VS Code, from https://code.visualstudio.com/, and install the Microsoft
    C/C++ extension and the Cmake extension.


    ![](img/23976341c9281123e7b181beea6e9dbd_21_0.png)


    You can also activate GitHub as your source control manager, but if you don''t
    already know GitHub it is simpler not to. Resources for learning about are included
    in this book''s webpage at www.iopress.info.


    # Hello World For Micro:bit V1


    Assuming that you have set up the prerequisites explained in the previous section,
    you can quickly move on to creating your first micro:bit V1 application.


    First go to:


    https://github.com/I-Programmer-info/MicroBitV1 and download a zip (if use GitHub
    you can also clone the repository. Once you have the file you can unzip and extract
    the folder MicroBitV1Template to the folder that you can use to store projects:


    | Name | Type |

    |---|---|

    | MicroBitV1Template | File folder |

    | .gitattributes | Text Document |

    | .gitignore | Text Document |

    | LICENSE | File |

    | README.md | MD File |'
