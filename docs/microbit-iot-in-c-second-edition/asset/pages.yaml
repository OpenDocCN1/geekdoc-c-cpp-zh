- pgno: 164
  md: "If you run the program and don't get the data received correctly message, the\
    \ most likely reason is that you have connected the wrong two pins or not connected\
    \ them at all.\n\n# The V2 CS Problem\n\nIf you connect a logic analyzer to the\
    \ four pins involved, 13, 14, 15 and 16, you will see the data transfer and there\
    \ is a difference between V1 and V2.\n\nIn the case of V2 the CS line is returned\
    \ to high before the SPI interaction is complete. The transfer function is supposed\
    \ to be blocking, but clearly it isn't:\n\n```\nCS.setDigitalValue(0);\nsppi.transfer(buf,\
    \ 1, buf, 1);\nCS.setDigitalValue(1);\n```\n\n![](img/23976341c9281123e7b181beea6e9dbd_164_0.png)\n\
    \nYou can put a wait after the call to transfer, but it is difficult to get the\
    \ timing correct. A more sophisticated solution is to use the startTransfer method,\
    \ which is asynchronous and accepts a callback function which is executed when\
    \ the SPI transfer is complete. To use this we need a callback function:\n\n```\n\
    void doneHandler(void *arg)\n{\n    CS.setDigitalValue(1);\n};\n```"
  merge: -1
  img_proc: true
- pgno: 165
  md: 'This simply sets the CS line back to a 1. You can write more complicated callbacks
    but the best advice is to keep it simple. With this function we can now use startTransfer:


    ```

    CS.setDigitalValue(0);

    sppi.startTransfer(buf, 1, buf,1, doneHandler, (void*)buf);

    ```


    Now the main program doesn''t have to reset the CS line – the callback does it:


    ![](img/23976341c9281123e7b181beea6e9dbd_165_0.png)


    If you want the program to wait until the SPI transfer is complete simply test
    the state of the CS line and wait until it is a 1.


    # Chip Select micro:bit V1


    The micro:bit V1 implements a fully blocking call and hence the manual control
    of the CS lines as you would expect. If you look carefully, you will see the CS0
    line go low before the master places the first data bit on the MOSI, and hence
    on the MISO, line. Typically the CS line is held for at least three core clock
    cycles before transfer starts to allow the slave to get ready and held for at
    least one clock cycle when the transfer is complete. Notice that the clock rises
    in the middle of each data bit making this a 0 transfer.'
  merge: -1
  img_proc: true
- pgno: 166
  md: 'You can also see that the clock is measured to be 1MHz as promised.


    | | | | | | |

    |---|---|---|---|---||

    | 00 Channel 0 SPI-MOSI | | 170° (CKAA) | | |

    | 01 Channel 1 SPI-MISO | | 170° (CKAA) | | |

    | 02 Channel 2 SPI-CLOCK | | | | | |

    | 03 Channel 3 SPI-ENABLE | | | | |


    If you want to transfer multiple bytes as a single operation then you can manually
    leave the CS low until all of the transfers are complete. However, how you need
    to proceed depends on the slave device and you you need to read the datasheet.


    # # Problems


    The SPI bus is often a real headache because of the lack of a definitive standard,
    but in most cases you can make it. The first problem is discovering the characteristics
    of the slave device you want to work with. In general this is solved by a careful
    reading of the datasheet or perhaps by some trial and error, see the next chapter
    for an example.


    If you are working with a single slave generally things work once you have the
    SPI bus configuration correctly. Where things are more difficult if you have multiple
    devices on the same bus. Typically you will find SPI devices that dont switch
    off properly when they are not being addressed. In principle all SPI devices should
    present high impedance outputs, i.e. act as tri-state buffers, when not being
    addressed, but some dont. If you encounter a problem you need to check that the
    selected slave is able to control the MISO line properly.


    If you need more CS lines then you can allocate more GPIO lines to the job, but
    these are in short supply. A better solution is to multiplex the GPIO lines to
    create additional chip selects. For example, you can use standard GPIO lines as
    chip selects and connect four SPI slaves using a 2-to-4 decoder.'
  merge: -1
  img_proc: true
- pgno: 167
  md: '# Summary


    +   - The SPI bus is often problematic because there is no SPI standard


    +   - Unlike other serial buses it makes use of unidirectional connections.


    +   - The data lines are MOSI (master output slave input) and MISO

    (master input slave output).


    +   - In addition there is a clock line, which is output from the master, and

    an un unspecified number of select lines.


    +   - Data is transferred from the master to the slave and from the slave to the

    master on each clock pulse arranged as a circular buffer.


    +   - The library provides the basic functions you need to work with the

    SPI bus and you can test the SPI bus using a simple loopback

    connection.


    +   - Controlling the CS line in the case of the micro:bit V2 is a problem

    the transfer function isn''t blocking. The solution is to use an event

    handler.


    +   - Working with a single slave is usually fairly easy, working with

    multiple slaves can be more of a problem.'
  merge: -1
  img_proc: true
- pgno: 168
  md: '# Chapter 11


    # A-to-D With The SPI Bus


    The SPI bus can be difficult to make work at first, but once you know how the
    slave works it gets easier. To demonstrate how it is done let''s add eight channels
    of 12-bit A-to-D using the MCP3008.


    The microbit has a single analog to digital converter which can be connected to
    any of the GPIO lines designated as analog pins. Sometimes, however, this isn''t
    enough. The MCP3000 family of A-to-D converters provides a simple low-cost solution.
    Although the MCP3008 with 8 A-to-D inputs and the MCP3004 with 4 A-to-D inputs
    at 10-bit precision are the best known, there are others in the family including
    12- and 13-bit precision devices with differential inputs at the same sort of
    cost - $1 to $2.


    In this chapter, the MCP3008 is used because it is readily available and provides
    a good performance, but the other devices in the family work in the same way and
    could easily be substituted.


    # The MCP3008


    The MCP3008 is available in a number of different packages, but the standard 16-pin
    PDIP is the easiest to work with using prototyping board. You can buy it from
    the usual sources, see Resources on this book''s webpage at www.iopress.info.
    Its pinouts are fairly explanatory:


    | CH0 | 16 | VDD |

    | CH1 | 15 | VREF |

    | CH2 | 14 | AGND |

    | CH3 | 13 | CLK |

    | CH4 | 12 | DOUT |

    | CH5 | 11 | DIN |

    | CH6 | 10 | CS/SHND |

    | CH7 | 9 | DGND |


    As you can see, the analog inputs are on the left and power and SPI connections
    on the right. The conversion accuracy is claimed to be 10 bits, but how many of
    these bits correspond to reality and how many are noise depend on how you design
    the layout of the circuit.'
  merge: -1
  img_proc: true
- pgno: 169
  md: 'You need to take great care if you need high accuracy. For example, you will
    notice there are two voltage inputs $V_{DD}$ and $V_{REF}$. $V_{DD}$ is the supply
    voltage that runs the chip and $V_{REF}$ is the reference voltage that is used
    to compare the input voltage.


    Obviously if you want accuracy $V_{REF}$, which has to be lower than or to $V_{DD}$,
    should be set by an accurate low voltage source. However, in most applications
    $V_{REF}$ and $V_{DD}$ are simply connected together and the usual, low-quality,
    supply voltage is used as the reference. If this isn''t good enough then you can
    use a Zener diode to a precision voltage reference chip such as the TL431. At
    the very least, you should add a 1uF capacitor between the $V_{DD}$ pin and the
    $V_{REF}$ pin to ground.


    The MC3000 family implements a type of A-to-D based on a technique successive
    approximation. You don''t need to know how to use the MC3000, but it isn''t difficult.
    The idea is that first a voltage is generated equal to $V_{REF}/2$ and the input
    voltage is compared to this. If it is lower, the most significant bit is a zero;
    if it is more or equal, then it is a one. At the next step the voltage generated
    is $V_{REF}/2+V_{REF}/4$ and the comparison is repeated to generate the next bit.


    ![](img/23976341c9281123e7b181beea6e9dbd_169_0.png)


    You can see that successive approximation fits in well as each bit can be obtained
    in the time needed to transmit the previous bit. However, the conversion is relatively
    slow and a sample-and-hold circuit has to be used to keep the input to the converter
    stage fixed.'
  merge: -1
  img_proc: true
- pgno: 170
  md: 'The sample-and-hold takes the form of a 20pF capacitor and a switch. The only
    reason you need to know about this is that the conversion has to be complete in
    a time that is short compared to the discharge time of the capacitor. So, for
    accuracy there is a minimum SPI clock rate as well as a maximum.


    Also, to charge the capacitor quickly enough for it to follow a changing voltage,
    it needs to be connected to a low impedance source. In most cases this isn''t
    a problem, but if it is you need to include an op amp.


    If you are using an op amp then you might well implement an anti-aliasing filter
    to remove frequencies from the signal that are too fast for the A-to-D to respond.
    How all this takes us into the realm of analog electronics and signal processing
    and out of the scope of this book.


    You can also use the A-to-D channels in i.e. in differential mode, to measure
    the voltage difference them. For example, in differential mode you can measure
    the difference between CH0 and CH1, i.e. what you measure is CH1-CH0. In most
    cases you want to use all channels in single-ended mode. In principle you can
    take 200 samples per second, but only at the upper limit of the supply voltage
    ($V_{DD}$=5V), falling to 75 samples per second at its lower limit ($V_{DD}$=2.7V).


    The SPI clock limits are a maximum of 3.6MHz at 5V and 1.35MHz at 2.7V. The clock
    can go slower, but because of the problem with the sample and hold mentioned earlier
    it shouldn''t go below 10kHz. How fast we can take samples is discussed later
    in this chapter.


    ![](img/23976341c9281123e7b181beea6e9dbd_170_0.png)


    The connection from the MCP3008 to the micro:bit''s SPI bus is very simple and
    can be seen in the diagram below.


    The only additional component that is recommended is a 1µF capacitor connected
    between pins 15 and 16 to ground, mounted as close to the chip as possible. As
    discussed in the previous section, you might want a voltage reference for pin
    15 rather than using the 3.3V supply.'
  merge: -1
  img_proc: true
- pgno: 171
  md: '# Basic Configuration


    Now we to the configuration of the SPI bus. Taking into account the maximum clock
    frequencies for the device of 3.6MHz at 5V and 1.35MHz at 2.7V and the need to
    maintain a minimum clock rate of 10kHz, using the default clock rate of 1MHz seems
    a reasonable starting point.


    From the datasheet the CS to be active low and, by default, the data is sent most
    significant bit first for both the master and the slave. The puzzle is what mode
    to use? This is listed in the datasheet if you look really carefully and it can
    be mode 0 with clock active high or mode 3 with clock active. For simplicity we
    use mode 0. We now have enough information to initialize the slave:


    ```

    spi.format(8, 0);

    spi.frequency(1000000);

    ```


    # The Protocol


    Now we have the SPI initialized and ready to transfer data, but what data do we
    transfer?


    The bus doesn''t have any standard commands or addressing structure. Each device
    responds to data sent in different ways and sends data back in different ways.
    You simply have to read the datasheet to find out what the commands and responses
    are.


    Reading the datasheet might be initially confusing because it says what you have
    to do is send five bits to the slave - a start bit, a bit that selects its operating
    mode, and a 3-bit channel number. The operating mode is 1 for single ended and
    0 for differential. Differential mode uses the channels in pairs to measure the
    voltage difference between them. In most cases you want to use single ended. So
    to read Channel 3, i.e. 011, in single-ended mode you would send the slave:


    ```

    1101xxx

    ```


    where x can take either value.


    The response from the slave is that it holds its output in a high impedance state
    until the sixth clock pulse it sends a zero bit on the seventh followed by bit
    9 of the data on the eighth clock pulse.


    That is, the slave sends back:


    +   * x x x x x x ø b9'
  merge: -1
  img_proc: true
- pgno: 172
  md: 'where x means indeterminate and b9 is 0 or 1 according to the value of the
    ninth bit of the data. The remaining 9-bits are sent back in response to the next
    nine clock pulses, you have to transfer three bytes to get all ten bits of data.
    This all makes reading the data in eight-bit chunks confusing.


    The datasheet suggests a different way of doing the job that delivers the data
    neatly packed into three bytes. What it suggests is to send a single byte:


    00000001


    The slave transfers random data at the same time which is ignored. The final 1
    is treated as the start bit. If you now transfer a second byte with most significant
    bit indicating single or differential mode, then a three-bit address and the remaining
    bits set to zero the slave will respond with the null and the top two bits of
    the conversion. Now all you have to do is get the final eight bits of data to
    read:


    | MCU Transmitted Data | | | | | | | | | | | | | | | |

    |---|---|---|---|---|---|---|---|---|---|---|---|---|---|---|n| (Aligned with
    falling edge of clock) | 0 | 0 | 0 | 0 | 0 | 0 | 0 | 0 | | | | | | | |

    | MCU Received Data (Aligned with rising edge of clock) | ? | ? | ? | ? | ? |
    ? | ? | ? | D2 | D1 | D0 | X | X | X | X |

    | X = "Don''t Care" | | | | | | | | | 87 | 86 | 85 | 84 | 83 | 82 | 81


    ![](img/23976341c9281123e7b181beea6e9dbd_172_0.png)


    You can do it first way that the datasheet describes, but this way you get two
    bytes containing the data with all the low-order bits in their correct positions.


    Using this information we can write some instructions that read a given channel.
    For example, to read Channel 0 we first send a byte set to 0x01 as the start bit
    and ignore the slave transfers. We send 0x80 to select single-ended and Channel
    0 keep what the slave sends back as the high-order two bits. Finally, we send
    a zero byte so that we get the low-order bits from the slave. For the microbit
    V1, using the SPITransfer function given earlier, is:


    ```

    uint8_t buf[] = {0x01, 0x00, 0x00};

    uint8_t readBuf[3];

    CS.setDigitalValue(0);

    SPITransfer(buf, 3, readBuf, 3);

    CS.setDigitalValue(1);

    ```


    Notice that the CS line is held low for the entire transaction.


    For the microbit V2 the call to SPITransfer has been changed to:

    pi.transfer(buf, 3, readBuf, 3);

    uBit.sleep(1);


    The sleep is a crude way of keeping the CS line for long enough. A better solution
    is to use a callback – see the previous'
  merge: -1
  img_proc: true
- pgno: 173
  md: 'To get the data out of readBuf we need to do some bit manipulation:

    data=((int)readBuf[1])<<8|(int)readBuf[2];


    The first part of the expression extracts the low three bits from the first byte

    t slave sent, and as these are the most significant bits, they are shifted up

    eight places. The rest of the bits are then ORed with them to give the full

    10-bit result. Assuming that V_REF is 3.3V, to convert to volts:

    int volts=data*330/1023;


    Notice that we avoid floating point arithmetic by working with volts*100.


    In a real application you would also need to convert the voltage to some other

    quantity, like temperature or light level.


    The complete program is:


    ```

    #include "MicroBit.h"


    MicroBit uBit;


    SPI spi(MOSI, MISO, SCK);


    MicroBitPin CS(MICROBIT_ID_IO0_P16, MICROBIT PIN P16, PIN CAPABILITY_DIGITAL);

    //SPITransfer function is only needed for V1

    int SPITransfer(uint8_t *txBuffer, uint32_t txSize, uint8_t *rxBuffer, uint32_t
    rxSize)

    {

    CS.setDigitalValue(0);

    uint32_t i;

    for (i = 0; i < txSize; i++)

    {

    if (i < rxSize)

    {

    rxBuffer[i] = spi.write(txBuffer[i]);

    } else

    {

    spi.write(txBuffer[i]);

    }

    }

    CS.setDigitalValue(1);

    return 0;

    }

    ```'
  merge: -1
  img_proc: true
