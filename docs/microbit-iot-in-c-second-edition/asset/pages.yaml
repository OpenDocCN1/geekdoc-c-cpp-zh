- pgno: 218
  md: '# Chapter 14


    # The LED Display


    The micro:bit''s LED display may only be 5x5 but it is very versatile. If you
    want to make use of it directly then you are going to have to master some lower-level
    functions.


    Mostly the functions provided by the framework are all you need to work with the
    LED display. They are also fairly self-explanatory and easy to use so there is
    no point in going over them. You can look them up in the documentation and use
    them in programs without too much trouble. In this chapter, we cover the structure
    of the LED display and some interesting ways of using it in the hope that you
    might find creative ways to use the display.


    # Driving the LEDs


    The basic structure of the LED array is fairly simple and obvious if you have
    ever done anything similar. The LEDs are arranged in a grid of three rows and
    five columns. Each row has a GPIO line to drive it and a GPIO line determines
    whether the LED should be on or off and acts when activated.


    Unfortunately, the layout for the LED displays is different for the two versions
    of the micro:bit. The arrangement of LEDs and GPIO lines for the V1 is:


    ![](img/23976341c9281123e7b181beea6e9dbd_218_0.png)'
  merge: -1
  img_proc: true
- pgno: 219
  md: 'As you can see, two LEDs are missing from the grid. If we had the full set
    of 3x9 LEDs, we would have 27 while a 5x5 array only needs 25. The micro:bit V2
    makes use of the additional GPIO lines to create a simpler 5x5 layout:


    ![](img/23976341c9281123e7b181beea6e9dbd_219_0.png)


    The GPIO assignments are:


    # LED MATRIX COLS


    V1

    COL1 = p0_4

    COL2 = p0_5

    COL3 = p0_6

    COL4 = p0_7

    COL5 = p0_8

    COL6 = p0_9

    COL7 = p0_10

    COL8 = p0_11

    COL9 = p0_12


    V2

    P0_28

    P0_11

    P0_31

    P1_05

    P0_30'
  merge: -1
  img_proc: true
- pgno: 220
  md: '# LED MATRIX ROWS


    | V1 | V2 |

    | ROW1 = p0 13 | P0 21 |

    | ROW2 = p0_14 | P0 22 |

    | ROW3 = p0_15 | P0 15 |

    | ROW4 = | P0 24 |

    | ROW5 = | P0_19 |


    # micro:bit V1 LEDs


    The LEDs in the micro:bit V1 do not have a neat row, column numbering. Instead
    they are arranged in an order that makes the PCB layout easier:


    | 1.1 | 2.4 | 1.2 | 2.5 | 1.3 |

    | 3.4 | 3.5 | 3.6 | 3.7 | 3.8 |

    | 2.2 | 1.9 | 2.3 | 3.9 | 2.1 |

    | 1.8 | 1.7 | 1.6 | 1.5 | 1.4 |

    | 3.3 | 2.7 | 3.1 | 2.6 | 3.2 |


    To illuminate the LED at position row,column, all we have to do is set the row
    high and the column low - this picks out just one LED to be on. For example, to
    set the center LED 2,3 you would need to set GPIO line p0_14 high and line p0_6
    low. The problem is that the framework provides objects for GPIO lines that are
    brought out to the edge connector and none of the row lines and some of the column
    lines are.


    The solution is to make use of the mbed functions with which the framework is
    built. The disadvantage of this is that you don''t get any of the event handling
    facilities. There are mbed functions for most of the hardware facilities that
    we have encountered and you can use them if you want to. They are slightly faster
    than the framework functions because in general the framework functions call the
    mbed functions to get the work done.'
  merge: -1
  img_proc: true
- pgno: 221
  md: "For example, to flash the middle LED we need a DigitalOut object from the mbed\
    \ library.\n\n| Function | Description |\n| DigitalOut (PinName pin) | Create\
    \ a DigitalOut connected to the specified pin |\n| DigitalOut (PinName pin, value)\
    \ | Create a DigitalOut connected to the specified pin with given initial value\
    \ |\n\nvoid write (int value) Set the output setting, specified as 0 or 1 (int)\n\
    int read ( ) Return the output setting, represented as 0 or 1 (int)\nint is_connected\
    \ () Return the output setting, represented as 0 or 1 (int)\nDigitalOut & operator=\
    \ (int value) A shorthand for write/)\noperator int () A shorthand for read()\n\
    \nAll you need to make use of this is that there is also a complete set of pin\
    \ names like P0_n for GPIO n. Using this you can access any GPIO line. In addition\
    \ there are also predefined pin names for each of the columns and rows.\n\nSo\
    \ to flash the center LED you would use:\n#include \"MicroBit.h\"\nMicroBit uBit;\n\
    int main() {\n    uBit.init();\n    uBit.display.disable();\n\nDigitalOut col3(P0_6);\n\
    DigitalOut row2(P0_14);\nwhile(1) {\n    row2 = 1;\n    wait(0.2);\n    row2 =\
    \ 0;\n    wait(0.2);\n}\n\nrelease_fiber();\nreturn 0;\n}\n\nNotice that to take\
    \ control of the GPIO lines that work with the display you call its disable method.\
    \ After this the program simply sets col3 to zero and toggles row2 to flash the\
    \ LED. To specify the locations, we could equally well used:\nDigitalOut col3(COL3,0);\n\
    DigitalOut row2(ROW2);"
  merge: -1
  img_proc: true
- pgno: 222
  md: "If you think about the hardware for a moment, it should be obvious that we\
    \ can turn on any LED in a single row by setting its row on and multiple columns\
    \ to off. However, notice that if we turn on an entire row or column, we are not\
    \ free to turn on any other LED we like. For example, if you turn another column\
    \ then the LED in the same row comes on, even if you don't want it to.\n\nHow\
    \ then can we create a display where LEDs in different rows are on at the same\
    \ time? The answer is that we turn off soft so that the human eye can see the\
    \ flashing. For example, to turn the LEDs in column 3 and rows 1, 2 and 3 you\
    \ could:\n\n```\nDigitalOut col3(COL3,0);\nDigitalOut row1(ROW1);\nDigitalOut\
    \ row2(ROW2);\nDigitalOut row3(ROW3);\nwhile(1) {\n  wait(0.2);\n  row1 = 0;\n\
    \  row2 = 1;\n  wait(0.2);\n  row2 = 0;\n  row3 = 1;\n  wait(0.2);\n  row3 = 0;\n\
    }\n```\n\nIf you run this program you will see the LEDs on the diagonal flash\
    \ after another. Now take out the wait function calls - you will see the three\
    \ LEDs on the diagonal all apparently at the same time. This is what the framework\
    \ display object does for you automatically. It scans the three rows turning on\
    \ and off LEDs in the framework's event handler. If you want to do this sort of\
    \ job at a reasonable speed you need to set and unset all of the LEDs in a single\
    \ row in one operation, as explained in Chapter 3. The mbed library has functions\
    \ that you can use to do this or you can write yours.\n\n# micro:bit V2 LEDs\n\
    \nThe micro:bit V2 doesn't have an mbed layer between it and the GPIO pins. The\
    \ setDigitalValue method sets the GPIO line directly:\n\n```\nif(value) {\n  PORT->OUTSET\
    \ = 1 << PIN;\n} else {\n  PORT->OUTCLR = 1 << PIN;\n}\n```"
  merge: -1
  img_proc: true
- pgno: 223
  md: "In this case we can set the GPIO lines connected to the LED display using the\
    \ standard setDigitalValue method:\n\n```\n#include \"MicroBit.h\"\nMicroBit uBit;\n\
    int main()\n{\n    uBit.init();\n    uBit.display.disable();\n    uBit.io.row3.setDigitalValue(1);\n\
    \n    while (1) {\n        uBit.io.col3.setDigitalValue(1);\n        uBit.sleep(100);\n\
    \        uBit.io.col3.setDigitalValue(0);\n        uBit.sleep(100);\n    }\n\n\
    \    release_fiber();\n    return 0;\n}\n```\n\nThis allows us to turn a single\
    \ LED at a given row and column. As in the case of the micro:bit V1, once we switch\
    \ a single LED on we are not free to turn any other LED on. If a particular row\
    \ and column is activated then setting another column turns the LED in the original\
    \ row on, even if the LED we want to turn on. The solution is to ever turn a single\
    \ LED at a time and to do this quickly enough for the user to see multiple LEDs\
    \ on.\n\n```\n#include \"MicroBit.h\"\nMicroBit uBit;\nint main()\n{\n    uBit.init();\n\
    \    uBit.display.disable();\n\n    while (1) {\n        uBit.io.coll1.setDigitalValue(0);\n\
    \        uBit.io.row1.setDigitalValue(1);\n        uBit.sleep(500);\n        uBit.io.coll1.setDigitalValue(1);\n\
    \        uBit.io.row1.setDigitalValue(0);\n        uBit.io.col2.setDigitalValue(0);\n\
    \        uBit.io.row2.setDigitalValue(1);\n        uBit.sleep(500);\n    }\n```"
  merge: -1
  img_proc: true
