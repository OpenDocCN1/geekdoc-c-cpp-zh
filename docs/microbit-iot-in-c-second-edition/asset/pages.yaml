- pgno: 250
  md: '# Appendix II


    # Yotta And Offline Development


    If you outgrowth the development template then you might well need to create your
    own project using Yotta. Getting micro:bit V1 development setup on the desktop
    isn''t exactly the same as getting for general mbed development, but it very nearly
    is. The only real difference is the library used to support the hardware. To work
    locally we need to install the mbed build system which is called lotta, a suitable
    compiler tool set, and something to use as an editor.


    # Build Systems


    The biggest problem facing the embedded programmer is the apparent complexity
    of the build system. Back in simpler times an embedded C program might grow to
    a few hundred lines, perhaps with a simple single support library. Today libraries
    as mbed or the micro:bit library are complex and need other software components
    to complete them. You could manage these manually, which is what we did in the
    past. Each time you included a header you would have to find and resolve references
    to other headers and then find the object files corresponding to all of these
    libraries and link them to the final program. When the total amount of code was
    small this was entirely possible, as already mentioned, this is no longer the
    case.


    The solution to the problem is a build system which can do the job for you automatically.
    You may already know build tools such as make that run scripts without the compiler
    and linker on all of the necessary files. A build system goes beyond this that
    it will also deduce dependencies, perhaps even get the files needed, and incorporate
    them into the build. An example of such system is cmake which generates files
    for you.


    For the mbed project new build system lotta was invented. While it is still in
    use, it doesn''t seem to be as well supported as it was. Offline development without
    yotta is possible, but it would require you to manually organize all of the files
    needed to build the project and create the commands for the compiler and linker
    to perform the build; lotta can do this for you.'
  merge: -1
  img_proc: true
- pgno: 251
  md: 'Yotta generates CMake files which are then used to build the system using make
    or Ninja, which is the build engine. The micro:bit V2 also makes use of Cmake
    and it has yotta files which allow yotta to be used. However, it is properly better
    to focus on Cmake.


    There are some problems with getting to grips with yotta. The first is that it
    is a complicated system and if things go wrong you can be left wondering what
    to do. The second is that this something new to learn. There are enough problems
    in embedded programming without adding another layer of complexity and, of course,
    the need to learn something new feeds back into the difficulties of working out
    what is going wrong. However, in practice, yotta turns out to be easy to use and
    mostly reliable.


    # How Yotta Works


    You don''t need to know how yotta works under the covers to use, but a little
    knowledge is helpful.


    Yotta works with modules, which roughly speaking consist of code and header files
    that do something. A yotta module includes a json format file which provides metadata
    such as its name, license, author and any modules that it makes use of, i.e. its
    dependencies. You don''t have to create the json file manually, yotta has commands
    that do it for you.


    Yotta also supports the same system for an executable and when you tell yotta
    to build the executable it reads the json file, gets the modules which are needed
    and then creates cmake files to build modules for a specified platform - the target.
    Finally cmake generates files that are actually used to build the entire project
    using Ninja or one of other make systems that it supports.


    This is complicated because yotta feeds cmake, which feeds Ninja, which does the
    final job of compiling and linking the code. If you are feeling confused it will
    make a lot more sense after you have seen yotta in action. Notice that as well
    as automating the build of your program, you can also use yotta to create and
    publish modules that can then be used by other people.'
  merge: -1
  img_proc: true
- pgno: 252
  md: '# Installing Yotta


    Detailed instructions for installing yotta are provided on the mbed website:

    https://docs.yottbuild.org/


    First you need to check that you have an up-to-date copy of Python installed:

    https://www.python.org/downloads/


    If you use Python for other things you might want to set up a virtual environment,
    Yotta doesn''t require any additional configuration. Make sure that you can run
    Python from the command line:

    python --version


    If not add the Python directory to the current path. You also need the latest
    version of pip:

    python.exe -m pip install --upgrade pip


    Next you need to install CMake:

    https://cmake.org/download/


    Select the correct installer for your machine and follow the prompts. Make sure
    that you add CMake to the Path option otherwise you will have to it yourself.

    C:\Program Files\CMake\


    Make sure it works using:

    cmake -version


    If not check that it is on the path.


    CMake uses Ninja under Windows to actually perform the build. Download this from:

    https://ninja-build.org/


    Download the ninja file for Windows and extract the ninja.exe file into a suitable
    folder that is on the path. A simple solution is to copy it to the CMake\bin directory.


    The compiled binary is converted to a hex format file for flashing the microbit''s
    memory. This needs a utility called srecord. You can get from Sourceforge as a
    source file that you can build yourself. Alternatively, and more simply, you can
    download a binary for Windows from:

    https://sourceforge.net/projects/srecord/files/srecord-win32/


    Simply unzip src_cat into a directory that is on the path – the CMake/bin directory
    is an easy choice.


    You also need a cross compiler and the most commonly used is GCC ARM.'
  merge: -1
  img_proc: true
- pgno: 253
  md: 'The installer just gets on the job and when it finishes you should be able

    to yotta which is stored in:


    C:\Users\username\AppData\Local\Programs\Python\Python38-32\Scripts.

    to compile the code you need first install the arm-none-eabi-gcc

    compiler. This can be downloaded from a number of places including:

    https://developer.arm.com/tools-and-software/open-source-software/

    developer-tools/gnu-arm/tools/downloads


    At the time of writing the current version of the installer was:

    gcc-arm-none-eabi-10-2020-q4-major-win32

    Run the installer and follow the instructions. Make sure to tick Add path to

    environment variable at the end of the installation:


    ![](img/23976341c9281123e7b181beea6e9dbd_253_0.png)


    The compiler is installed in:

    C:\Program Files (x86)\U GNU Arm Embedded Toolchain

    Now, finally we can install Yotta:


    pip install -U yotta


    The requirements for other operating systems are much the same. For OSX

    You can simply download and drag the yotta app 05 X yotta.app into the

    applications folder. When you run it a terminal will open.


    Under Linux there is no installer, but it is easy to set things up using the

    package manager. You need to install the latest Python, which is usually

    installed by default. You also need the latest Python setup tools, cmake, Ninja'
  merge: -1
  img_proc: true
- pgno: 254
  md: 'and pip. You can use pip to install yotta. You also need to install the GCC
    ARM cross compiler gcc-arm-none-eabi. On Ubuntu you need gcc-arm-embedded instead.


    To summarize, make sure you have installed:


    +   1. Python

    2. pip

    3. CMake

    4. Ninja

    5. GNU Arm Embedded Toolchain

    6. srec_cat.exe

    7. yotta


    All of these have to be on the path and hence executable from the command line.
    Apart from Python and pip, which are needed to install yotta, these can be installed
    in any order.


    # Creating a Micro:bit Project


    You don''t need to know all of the yotta commands to create and work with a micro:bit
    project. To create a new project you first create a new project directory and
    while in the directory use the command:

    yotta init


    If yotta cannot be found then you need to check that it is on the path.

    For example, under Windows:


    ```

    mkdir pulse

    cd pulse

    yotta init

    ```


    At this point you will be asked a set of questions:


    +   1. Name of module - defaults to name of directory

    2. Initial version - defaults to 0.0.0

    3. Is this an executable? - Yes in this case, defaults to No

    4. short description - whatever you want to put

    5. Author - whatever you want to put

    6. License - your preferred license, defaults to Apache 2.0'
  merge: -1
  img_proc: true
- pgno: 255
  md: 'Yotta creates a set of folders complete with a json file describing the project:


    | Name |

    | - source |

    | test |

    | module.json |


    At this point the source and test folders are empty. These are where you are supposed
    to put your code files for the project and any tests you want to implement.


    # Adding a Dependency on the Micro:bit Library


    You could start populating the source folder with whatever program you wanted
    to write, a micro:bit program has a dependency on the micro:bit library which
    needs to be added. How this done is slightly different from installing a standard
    mbed dependency.


    At the moment the micro:bit library is not hosted by mbed and so you have to download
    it from its GitHub repository. However, before we can add any dependencies, we
    have to set the target for the project. In principle, you only have to do once
    for any yotta session, but in practice you might find that it gets forgotten or
    overwritten. For the micro:bit you set the target using:

    yotta target bbc-microbit-classic-gcc


    You will see:


    +   - info: get versions for bbc-microbit-classic-gcc

    - info: download bbc-microbit-classic-gcc@0.2.3 from the public module registry

    - info: get versions for mbed-gcc

    - info: download mbed-gcc@0.1.3 from the public module registry


    This adds a yotta_targets directory with some files that are needed for the target:


    | source |

    | test |

    | yotta_targets |

    | yotta.json |

    | module.json |'
  merge: -1
  img_proc: true
- pgno: 256
  md: 'After this you can add the dependency on the micro:bit library: yotta install
    lancaster-university/microbit


    You should see:


    +   - info: microbit, lancaster-university/microbit

    - info: get versions for microbit

    - info: download microbit@v2.2.0-rc6 from GitHub lancaster-university/microbit

    - info: dependency microbit: lancaster-university/microbit written to module.json

    - info: get versions for microbit-dal

    - info: download microbit-dal@v2.2.0-rc6 from GitHub lancaster-university/microbit-dal

    - info: get versions for mbed-classic

    - info: download mbed-classic@microbit_hfclk+mb6 from GitHub lancaster-university/microbit-classic

    - info: get versions for ble

    - info: download ble@v2.5.0+mb3 from GitHub lancaster-university/BLE-API

    - info: get versions for ble-nrf51822

    - info: download ble-nrf51822@v2.5.0+mb7 from GitHub lancaster-university/nRF51822

    - info: get versions for nrf51-sdk

    - info: download nrf51-sdk@v2.2.0+mb4 from GitHub lancaster-university/nRF51-sdk


    This might take a few minutes because the library is downloaded from GitHub.


    After it is complete, you will see a folder has been added to the project.


    ![](img/23976341c9281123e7b181beea6e9dbd_256_0.png)'
  merge: -1
  img_proc: true
- pgno: 257
  md: 'This folder contains code for the libraries you will want to use in your empty
    programs:


    ![](img/23976341c9281123e7b181beea6e9dbd_257_0.png)


    At this point you can build the project. If you plan to stay with yotta and use
    a simple editor to create your/C+ files then you will build your application each
    time. If you plan to move to an IDE such as VS Code then the IDE will make use
    of the Ninja files created to build your program in the future.


    So we need to use yotta to build the project. The problem is that there are no
    files in the source or test folders and yotta will simply ignore any empty folders
    in the build. Give the system something to add a .cpp file to the source folder.


    Use your editor to add something trivial like:


    ```

    #include "MicroBit.h"

    MicroBit uBit; int main() {

    uBit.init();

    uBitBitdisplay.scroll("NEW PROGRAM");

    release_fiber();

    }

    ```


    and store the result as main.cpp or any name you care to use.


    Now we can build and test the program using:

    yotta build


    If you watch what happens you will see the program build and report that the build
    files have been written to build/bbc-microbit-classic-gcc directory in the project.
    You will also see lots of warnings about deprecated code and style problems –
    you can ignore these. The important part is that you will find the hex file in
    the directory:


    pulse\build\bbc-microbit-classic-gcc\Source


    The file that you need to download to the microbit: pulse-combined.hex and not
    the pulse.hex file. If you can''t find a .hex file then check the messages produced
    by yotta and you will probably find that srec_cat.exe is mentioned as missing.
    See the instructions given earlier about obtaining and installing record.'
  merge: -1
  img_proc: true
- pgno: 258
  md: "If everything has worked you should see the \"NEW PROGRAM\" message scroll\
    \ past.\n\nThis is all you need to do. You can now edit and add .cpp files to\
    \ the source directory. If you need to add other dependencies then you the install\
    \ command. Each time you use the build command new Cake and Ninja files are generated\
    \ so you can keep things up-to-date, and also note that there is no point in editing\
    \ any of the Cmake or Ninja files as they are recreated by Yotta.\n\n# Summary\
    \ of Project Creation\n\n+   1. Create a new folder and make it the current directory.\n\
    2. To create the project folders and basic files use:\n   yotta init\n3. To target\
    \ a project for the micro:bit use:\n   yotta target bbc-microbit-classic-gcc\n\
    4. To install the essential dependencies to run your new project use:\n   yotta\
    \ install lancaster-university/microbit\n5. To install any other dependencies\
    \ use the same command, but change the name of the module or GitHub project you\
    \ want to include.\n6. Add at least one .cpp file to the source folder and to\
    \ the test folder you want to construct tests.\n7. To build the project use:\n\
    \   yotta build\n8. The hex file you need to download will be found in:\n   project\
    \ folder\\build\\bbc-microbit-classic-gcc\\Source\nand will be called\n   project-folder-combined.hex\n\
    \nIf you want to work with the project in an IDE that supports Cmake such as VS\
    \ Code, see Chapter 2, then all you need to know is that CMakeLists.txt is stored\
    \ in project folder\\build\\bbc-microbit-classic-gcc."
  merge: -1
  img_proc: true
