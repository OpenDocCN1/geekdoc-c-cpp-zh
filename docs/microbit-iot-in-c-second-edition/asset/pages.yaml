- pgno: 106
  md: '# Summary


    +   - The I2C bus is simple and yet flexible and is one of the most commonly encountered
    ways of connecting devices.

    - The I2C bus uses two wires – a data line and a clock.

    - The micro:bit has two I2C interfaces, but one is used internally.

    - The easiest interface to use is the one that is available on the edge connector.

    - The I2C protocol isn’t standardized and you have to take account of variations
    in the way devices implement it.

    - There are single byte transfer operations and multibyte transfers which differ
    in when a stop bit is sent.

    - The low-level protocol can be made slightly more high-level by thinking of it
    as a single write or read a register operation.

    - Sometimes a device cannot respond immediately and the master waiting for data.
    There are two ways to do this, polling and clock stretching.'
  merge: -1
  img_proc: true
