  md: 'Of course this is just the start. Once you have the device working and supplying
    data, it is time to write your code in the form of functions that return the temperature
    and the humidity and generally make the whole thing more useful and easier to
    maintain.


    This is often how this sort of programming goes. At first you write a lot of inline
    code so that it works as fast as it can, then you move blocks of code to functions
    to make the program more elegant and easy to maintain, checking at each refactoring
    that the programming still works.


    Not all devices use standard bus protocols. Next we looks at a custom serial protocol
    that we have to implement for ourselves.'
