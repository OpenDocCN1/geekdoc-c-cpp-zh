- pgno: 177
  md: '# Summary


    +   Making SPI work with any particular device has four steps:

    1. Discover how to connect the device to the SPI pins. This is a matter of identifying
    pinouts and mostly what chip selects are supported.

    2. Find out how to configure the SPI bus to work with the device. This is mostly
    a matter of clock speed and mode.

    3. Identify the commands that you need to send to the device to get it to do something
    and what data it sends back as a response.

    4. Find, or work out, the relationship between the raw reading, the voltage and
    the quantity the voltage represents.


    +   The MCP3000 range of A-to-D converters is very easy to use via SPI.


    +   You can read data at rates as fast as 20kHz, which is fast enough for some
    audio applications.'
  merge: -1
  img_proc: true
- pgno: 178
  md: '# Chapter 12


    # Serial Connections


    The serial port is one of oldest of ways of connecting devices together, but it
    is still very useful. The micro:bit has a single serial interface, but it can
    be directed to use any of the GPIO pins as Rx and Tx. The software that powers
    the micro:bit does a lot to make the single-tasking environment that it is based
    on more like a multi-tasking operating system. The facilities it provides for
    working with the serial interface are extensive and is important to know how it
    all works because it goes well beyond the raw serial facilities on which it is
    based.


    # Serial Protocol


    The serial protocol is very simple - it has to be because it was invented in the
    days when it was generated using electromechanical components, motors and the
    like. it was designed to make early teletype machines work and hence you will
    often find abbreviations such as TTY in connection with. As the electronic device
    used to work with serial is called a Universal Asynchronous Receiver/Transmitter,
    the term UART is often used.


    The earliest standards are V24 and RS232. However, notice that early communications
    worked between ±24 and later ±12V. Today serial communications works at logic,
    or TTL, levels 0 to 5V or 0 to 3.3V. Voltage difference is a problem we will return
    to. What matters is, irrespective of the voltage, the protocol is always the same.


    For the moment let on the protocol, as already mentioned is simple. The line rests
    high and represents a zero. When the device starts to transmit, it pulls the line
    to generate a start bit. The width of this bit starts the transmission speed -
    all bits are the same width as the start bit. After the start there are a variable
    number, usually seven or eight, data bits, an optional single parity bit and finally
    one or two stop bits.


    Originally the purpose of the start bit was to allow the motors to get started
    and allowing the receiving end to perform any timing corrections – the start bit
    determined the width of all subsequent bits. The stop bits were similarly there
    to give time for the motors to come back to their rest positions. In the early
    days the protocol was used at very slow speeds - 300 baud, i.e. roughly 300 bits
    per second, was considered fast enough.'
  merge: -1
  img_proc: true
- pgno: 179
  md: 'Today the protocol is much the same, but there is little need for multiple
    stop bits and communication is often so reliable parity bits are dispensed with.
    Transmission speeds are also higher - typically 9600 or 115200.


    To specify what exact protocol is in use, you will often encounter a short form
    notation - e.g. 9600 baud, 8 data bits, no parity, one stop bit would be written
    as 9600 8n1.


    You can see the letter A, 01111101, transmitted using 8n1 in the logic analyzer
    trace:


    ![](img/23976341c9281123e7b181beea6e9dbd_179_0.png)


    The first low is the start bit, then the even dots show the ideal sampling positions
    for the receiver. The basic decoding algorithm for receiving serial data is to
    detect the start bit and then sample the line at the center of each time. Notice
    the final high on the right is the stop bit.


    For a serial connection to work, it is essential that the transmitter and the
    receiver are set to the same speed, data bits and parity. Serial interfaces often
    fail because they are not working with the same settings. A logic analyzer with
    a serial decoder is an essential piece of equipment if you are going to anything
    complicated with serial interlacing.


    What is a baud? Baud rate refers to the basic bit time. That is, 300 baud has
    a start bit that is 1/300s baud. For 9600 baud a 1/9600, or roughly 104µs. At
    115200 baud a 1/115200 or roughly 8.6µs. Notice baud rate doesn''t equate to speed
    of sending data because there is an overhead in stop, start, and perhaps parity
    bits to include in the calculation.


    # Hardware


    A simple serial interface has a transmit pin Tx and a receive pin Rx. That is,
    a serial interface has as few as two wires for two-way communications. Typically
    you connect the Tx pin on one device to the Rx pin on the other and vice versa.
    The only problem is that some manufacturers label the pins by what they should
    be connected to, not they are, and you have to connect Rx to Rx and Tx to Tx,
    which is not really helpful. You generally need to check with a scope, logic probe
    or meter which is if you in any doubt.'
  merge: -1
  img_proc: true
- pgno: 180
  md: 'In addition to the Tx and Rx pins, a few serial interface also has a lot of
    control lines. Most of these were designed to help with old fashioned teleprinters
    they are not often used. For example RTS (Request To Send) is a line that is used
    to ask permission to send data from the device at the other end of the connection,
    CTS (Clear To Send) is a line that indicates that it is okay to send data and
    so. For many connections between modern devices you can ignore these additional
    lines and just send and receive data. If you need to interface with something
    that implements a complex interface you are going to have to look up the details
    and hand-craft a program to interact with it. For the rest of this chapter we
    are going to work with Tx and Rx and ignore additional status and signaling lines.


    The UART in the microbit''s CPU can work independently of the rest of the hardware.
    That, it will receive and transmit data while the CPU is getting on other things.
    Normally it is connected to pins that are part of the USB port. This means that,
    by default, sending and receiving serial data works over the USB port, and if
    it is connected to a serial port driver, you automatically have serial connection
    that works, assuming you have the correct speed. The fact that the serial device
    can be connected to any GPIO lines that you can make of it to talk to other devices
    directly and without need to involve the USB port. You can even talk to a device
    connected to GPIO lines and echo what is going on the USB port.


    The microbit implements serial communications at 0V to 3.3V and that PC-based
    serial ports usually use +13V to -13V and all RS232-compliant ports use a + to
    - voltage swing, which is completely incompatible with the microbit and most other
    microprocessors. If you are using the default configuration with the serial device
    connected via the USB port this isn''t a worry. However, if you want to use a
    GPIO line then you need to do something about level conversions.


    Connect to the microbit you need a USB-TTL level serial interface that works between
    0V and 3.3V. There are lots on the market. All you have to do plug the USB port
    into the PC or device, install a driver and start to transmit data. If you want
    to work with the USB serial port then you will need a serial terminal on your
    desktop machine to connect to the microbit. For Windows, simply download PuTTY.


    The default for the USB serial connection is 115200 baud, 8 bits, no parity, and
    1 stop bit. If you are using a PC and PuTTY you simply need to set PuTTY to 115200
    and it should work.'
  merge: -1
  img_proc: true
- pgno: 181
  md: "# Basic Serial Commands\n\nThere seem to be a lot of commands relating to the\
    \ serial port. However, they fall into just three groups - initialization, writing\
    \ and reading. Unfortunately there are many minor changes in the microbit V2 implementation\
    \ of the serial object.\n\nThe initialization commands control how the port works.\
    \ They all create or work with an instance of MicroBitSerial, but if you want\
    \ to create an instance of your own dont create an instance of uBit. This simply\
    \ causes a conflict with two instances of MicroBitSerial trying to control the\
    \ hardware. If you want to use the other features provide by uBit, the simplest\
    \ thing to do is create a global uBit and initialize it in the usual way. Then\
    \ use its property to access the MicroBitSerial object that has been created:\n\
    \n```\n#include \"MicroBit.h\"\n//define setBaudrate // Uncomment for V2\nMicroBit\
    \ uBit;\nint main() {\n{\n\tuBit.init();\n\tuBit.serial.baud(115200);\n\tuBit.serial.send(\"\
    A\\r\\n\");\nn}\n```\n\nBy default this connects to the USB serial so you should\
    \ see an A printed on the serial console connected to the port. Notice that for\
    \ V2 the baud is called setBaudrate.\n\nIf you don't want to use uBit you need\
    \ to create MicroBitSerial as a global object. To create the equivalent of the\
    \ previous program you would use:\n\n```\n#include \"MicroBit.h\"\n/* Uncomment\
    \ for V2\n#define setBaudrate\n#define USBTX MICROBIT PIN UART TX\n#define USBRX\
    \ MICROBIT_PIN UART_RX\n*/\nMicroBitSerial serial(USBTX, USBRX);\n\nint main()\
    \ {\n{\n\tserial.baud(115200);\n\tserial.send(\"A\\r\\n\");\n\trelease_fiber();\n\
    n}\n```"
