- pgno: 26
  md: '# Hello World Micro:bit V2


    Getting started with the V2 C/C++ environment is simpler than the V1 as, despite
    Yotta compatibility built-in, it Cmake-based. All you have to do is navigate to:


    https://github.com/lancaster-university/microbit-v2-samples


    This is a demo project and it doesn''t contain all of the libraries needed to
    build it. However, if you download the project as a zip file and unzip it to a
    suitable directory you can load into VS Code. In this case the CMake file in the
    root the project should configure itself correctly. You will, however, be asked
    to select a ''kit''. Essentially a kit is a compiler collection that can be used
    to build the project. If you have installed GCC you will see it in the list –
    if you don''t see it then use the Scan for kits option. If you still don''t see,
    check that it is installed and on the path:


    ![](img/23976341c9281123e7b181beea6e9dbd_26_0.png)


    The project configuration runs the CMakeLists.txt file in the root and this uses
    Git to download the missing libraries. For this work, you have to have Git – not
    GitHub – installed. If you don''t you can download and copy the libraries manually.
    You need to download:


    https://github.com/lancaster-university/codal-microbit-v2

    https://github.com/lancaster-university/codal-core

    https://github.com/lancaster-university/codal-nrf52

    https://github.com/microbit-foundation/codal-microbit-nrf52sdk


    All of these need to be copied into a new folder libraries:


    ![](img/23976341c9281123e7b181beea6e9dbd_26_1.png)'
  merge: -1
  img_proc: true
- pgno: 27
  md: 'As an alternative you can download a zip of:

    https://github.com/I-Programmer-info/MicroBitV2


    This is a slightly modified complete template that doesn''t need to install Git.
    All you have to do is download it and unzip MicroBitV2Template to a project folder
    of your choice. You can rename the file or copy it and rename it. In this simple
    case copy and rename to HelloWorld. When you load it into VS Code, the project
    will be configured, you have to specify a kit, and you can do a full clean build
    of all projects.


    No matter which you download, the result should be a .hex file stored in the root.
    This can be downloaded to the micro:bit V2 when you will see HelloWorld scroll
    across the screen.


    To summarize:


    +   1. Download a zip of either

    https://github.com/lancaster-university/microbit-v2-samples

    https://github.com/I-Programmer-info/MicroBitV2

    2. If you download microbit-v2-samples you either to have Git installed or you
    have to manually download the missing libraries. If you download MicroBitV2 the
    libraries are included.

    3. Once you have downloaded the zip files, you can extract the project to a suitable
    folder and rename it to whatever you want to call it.

    4. When you load the project into VS Code, you will be asked to select a kit and
    then the project will be configured.

    5. You need to perform a clean rebuild of all projects to make sure that everything
    is up-to-date. You will see a lot of warnings scroll past.

    6. When the compile is complete you can copy MICROBIT.hex to the microbit and
    watch "Hello World" scroll past.


    If anything doesn''t work you try re configure followed by a clean rebuild. In
    the case of the microbit-v2-samples project, if it doesn''t work the chances you
    don''t have Git installed and the libraries are not being downloaded.


    If you want to explore the code in the sample directory do so and then delete
    the directory and do a clean configure followed by a clean rebuild. It is possible
    for the sample programs to interact with the program you are developing so it
    is better to get rid of them when you longer need them.'
  merge: -1
  img_proc: true
- pgno: 28
  md: "# Your First Program - Blinky\n\nThe time comes to run your first program and\
    \ deal with some details of using VS Code.\n\nYou can use either the V1 or V2\
    \ development environment and hence target either version of the micro:bit. It\
    \ is assumed that you have set up a project called BlinkyV1 or BlinkyV2 following\
    \ the instructions given earlier. Load the project into VS Code and do a clean\
    \ configure and a clean rebuild. Next, delete all of the source files in the source\
    \ directory, which is in the project root for both versions. Create a new file\
    \ called main.cpp, or simply copy the code into the existing file, containing\
    \ the following code:\n\n```\n#include \"MicroBit.h\"\nMicroBit ubit;\nint main()\n\
    {\n  ubit.init();\n  ubit.display.setDisplayMode(DISPLAY_MODE_GRESCALE);\n  for\
    \ (;;) {\n    ubit.display.setPixelValue(2, 2, 255);\n    ubit.sleep(1000);\n\
    \    ubit.display.setPixelValue(2, 2, 0);\n    ubit.sleep(1000);\n  }\n}\n```\n\
    \nExactly the same code will work with the V1 or the V2 micro:bit. Do a clean\
    \ reconfigure and a clean rebuild of the project. As usual you will see a lot\
    \ of warnings scroll past for the V1 compile, but the build should finish without\
    \ errors.\n\nYou will find the generated hex files in ~/BlinkyV1/build/source\
    \ for the V1 program and the file you want to download is BlinkyV1-combined.hex.\n\
    \nFor the V2 program you will find the hex in the project root and it is called\
    \ MICROBIT.hex.\n\nIf you have set the templates correctly, you should see the\
    \ middle LED in the display flash at 1 second intervals. Notice that if you simply\
    \ change the main program, or make minor changes to any program in the project,\
    \ you should only need to do a build and not a clean build.\n\nEverything should\
    \ work as advertised, including IntelliSense, auto-complete and error flagging.\
    \ If not sure that the .vscode/c_properties.json file contains the line:\n\n```\n\
    \"compileCommands\": \"${workspaceFolder}/build/compile_commands.json\",\n```"
  merge: -1
  img_proc: true
