- pgno: 176
  md: "Increasing the clock rate to 2MHz pushes the sampling rate to 36kHz, which\
    \ is just fast enough to digitize audio as long as you don't waste too much time\
    \ in the loop with processing. Changing the clock rate to 2MHz, pushes the sampling\
    \ up to 18kHz, which is just fast enough for most audio.\n\nThe fastest rate achieved\
    \ with the chips to hand was 21kHz with a clock rate of 4MHz. However, the readings\
    \ became increasingly unreliable in the low-order bits.\n\nThe microbit V2 only\
    \ matches this sampling rate if the callback method setting the CS line is used\
    \ - otherwise the 1ms sleep slows everything down. Changing the control of the\
    \ CS to direct memory mapping increased the sampling rate to 24kHz at a clock\
    \ rate of 4MHz. Unrolling the loop increased this to speed of the transfer, but\
    \ there was an 8ms pause between each byte, limiting the speed of the transfer.\
    \ The modified V2 transferBytes function including the optimization to send three\
    \ bytes is:\n\n```\nvolatile unsigned int *outset=(unsigned int *)(0x50000000UL+0x508);\n\
    volatile unsigned int *outclr=(unsigned int *)(0x50000000UL+0x50C);\nunsigned\
    \ int mask = 1 << 16;\n\nvoid transferBytes(int*buf,int*readBuf,int len) {\n \
    \ *outclr = mask;\n  readBuf[0] = spi.write(buf[0]);\n  readBuf[1] = spi.write(buf[1]);\n\
    \  readBuf[2] = spi.write(buf[2]);\n  *outset = mask;\n}\n```\n\nThe delay in\
    \ reading the SPI bus comes down to the 8us between transferring each byte irrespective\
    \ of the SPI clock frequency. The only way to do better than this is to directly\
    \ access the SPI hardware. This is quite possible, but we are approaching the\
    \ maximum sampling rate of the device."
  merge: -1
