- pgno: 22
  md: 'It doesn''t matter where you store the folder, but there are advantages to
    keeping the path directory as will become clear. For example, I copied it to a
    CProjects directory in my home directory::


    C:\Users\harry.fairhead\Documents\CProjects\


    Once you have copied the template you can change the name of the folder to something
    more appropriate for the project or copy it and rename it. In this case the name
    of the folder "MicroBitVTemplate" to "HelloWorld".


    The next problem is that we have to change all of the absolute paths used in the
    CMake files. The obvious solution would be to convert all the paths to relative
    paths, which turns out to be very difficult to do as there are more than 10,000
    occurrences of the absolute path in several different types of files. While it
    would be possible to modify the Cmake configuration using relative paths, or indeed
    to create a completely new CMake configuration that works more appropriately,
    this is a poor investment of time. A quicker solution, although it is undoubtedly
    a "hack", is to use a file replace option to edit the incorrect absolute paths
    to correct absolute paths. And, that is task to change:


    ```

    c:/MicroBitVTemplate

    ```


    into whatever the new path is. In my case C:\Users\harry.fairhead\Documents\CProjects\HelloWorld


    There are various ways to make a batch of files. VS Code will do the job, but
    not entirely reliable. Notepad++ is much more accurate and if you haven''t installed
    Notepad++ + it is generally useful. If you don''t want to use Notepad++ + you
    can use any text processor/editor that can make a set of files without changing
    their encoding.


    If you use Notepad++ the command is Search, Find in Files and you should fill
    the dialog box in something like:


    ![](img/23976341c9281123e7b181beea6e9dbd_22_0.png)


    Replace in Files: 10859 occurrences were replaced.'
  merge: -1
  img_proc: true
- pgno: 23
  md: 'Notice the orientation of the path separators. Cmake works best with Unix/Linux
    path separators but Windows works best with Windows separators. You can see from
    the dialog box 10,859 absolute paths are replaced, but this might change as files/folders
    are modified in the repo.


    If you want to change the project name, which modifies the names of the compiled
    files including the hello files, then:

    bbuild\bbc-microsoft-classic-gcv\CMakeLists.txt


    and change line 74 to:

    project(HelloWorld)


    Now you can load the project into VS Code or any IDE that can work with Cmake.
    Open a new VS Code window and load the HelloWorld folder. It should be recognized
    as a C/C++ CMake program.


    If VS Code offers to configure the project then the best answer is to select Not
    now. If it does the project you may have to do a clean reconfigure and clean build
    to get things working.


    ![](img/23976341c9281123e7b181beea6e9dbd_23_0.png)


    No matter what happens, your next manual task is to select the Cmake extension
    and then select Clean Reconfigure All Projects


    ![](img/23976341c9281123e7b181beea6e9dbd_23_1.png)'
