- pgno: 245
  md: '# Summary


    +   * Working with radio, or any communications channel, is more difficult because
    you have two applications to debug and finding out which is causing the problem
    can be difficult.


    +   * The best approach is to start from a simple working connection and change
    small things at each end until you have a finished working project.


    +   * The micro:bit radio can be used to set up groups of communicating devices
    by specifying a working frequency and a group number.


    +   * You can receive data by polling or using events.


    +   * You can also opt to transfer events that occur on one micro:bit to another
    micro:bit via the radio link.


    +   * The micro:bit V1 isn''t powerful enough to create complex sounds, but it
    can create a beep at a specified frequency using PWM.


    +   * The micro:bit V2 is powerful enough to generate complex sounds and has a
    software synthesizer that is based on PWM. Creating sounds with the synthesizer
    is a matter of defining sound effects using a complex numerical specification.


    +   * You can use the sound and radio to create a simple two-way Morse code communications
    device.'
  merge: -1
  img_proc: true
