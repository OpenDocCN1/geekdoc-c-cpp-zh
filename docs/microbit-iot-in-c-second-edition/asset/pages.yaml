- pgno: 117
  md: 'Putting all together and reusing some variables from the previous program,
    we have:

    uubit.i2c.readRegister(0x80, 0xE5, buf, 3);

    msb = buf[0];

    lsb = buf[1];

    check = buf[2];

    uBit.serial.printf("n\rmsb %d \n\rlsb %d \nrchecksum %d \n\r", msb, lsb, check);

    data16 = ((unsigned int)msb << 8) | (unsigned int) (lsb & 0xFC);

    hint hum = -600 + (12500 * data16) >> 16;

    uBit.serial.printf("Humidity %d %% %d \\n", hum / 100, hum % 100);


    The only unusual part of the program is using %%% to print a single character
    - necessary because %%% already means something in printf.


    # Checksum Calculation


    Although computing a checksum or cyclic redundancy check (CRC), which is used
    to detect accidental changes to raw data not specific to I2C, it is another common
    task. The datasheet explains that the polynomial used for the CRC is:


    X^8+X^3+X^4+X+1


    Once you have this information you can work out the divisor by writing a binary
    number with a one in each location corresponding to a power of X in the polynomial,
    i.e the 8th, 5th, 4th and 1st bit. Hence the divisor is 0x031.


    What you do next is roughly the same for all CRCs. First you put the data that
    was used to compute the checksum together with the checksum value as the lower-order
    bits:


    ```

    uint32_t data32 = ((uint32_t)msb << 16) | |

    (uint32_t) lsb << 8) | (uint32_t) check;

    ```


    Now you have three bytes, ie 24 bits, in a 32-bit variable.


    Next adjust the divisor so that its most significant non-zero bit aligns with
    the most significant bit of the three bytes. As this divisor has one at bit it
    needs to be shifted 15 places to move it to the 24th bit:


    ```

    uint32_t divisor = ((uint32_t) 0x0131) <<15;

    ```


    Now that you have both the data and the divisor aligned, you step through the
    top-most 16 bits, i.e. you don''t process the low-order eight bits which is the
    received checksum.'
  merge: -1
  img_proc: true
- pgno: 118
  md: "For each bit you check if it is a one - if you replace the data with the data\
    \ XOR. In either case you shift the divisor one place to the right:\n\n```\nfor\
    \ (int i = 0; i < 16; i++){\n    if(data32 & (uint32_t)1<<(23 -i))data32 =data32\
    \ ^ divisor;\n    divisor >>= 1;\n}\n```\n\nWhen the loop ends, if there was no\
    \ error, the data32 should be zeroed and the received checksum is correct and\
    \ as computed on the data received.\n\nA complete function to compute the checksum\
    \ with some optimizations:\n\n```\nuint8_t crcCheck(uint8_t msb, uint8_t lsb,\
    \ uint8_t check){\n    uint32_t data32=((uint32_t)msb << 16) |\n    ((uint32_t)lsb\
    \ << 8)|((uint32_t) check);\n    uint32_t divisor = 0x988B000;\n    for (int i\
    \ = 0; i < 16; i++){\n        if(data32 & (uint32_t)1<<(23 - i ))data32 ^= divisor;\n\
    \        divisor >>= 1;\n    }\n    return (uint32_t)data32;\n}\n```\n\nIt is\
    \ rare to get a CRC error on an I2C bus unless it is overloaded or subject to\
    \ a lot of noise.\n\n# Another Bus\n\nIf you don't want to use the internal I2C\
    \ bus then you have to give over two additional GPIO lines to the task of implementing\
    \ a second one. If you need to do this, the good news is that it is fairly easy\
    \ because the framework takes care of everything, configuring the GPIO lines to\
    \ be open collector.\n\nAll you have to do instantiate your own I2C object - remembering\
    \ not to instantiate or use a uBit object - making sure all the objects you create\
    \ are global.\n\nIf you want to convert the program that we have developed so\
    \ far, you also need a serial object to make printf send results to the serial\
    \ port. For the microbit V1 this\n\n```\nMicroBitI2C i2c(MICROBIT_PIN_P1, MICROBIT_PIN_P2);\n\
    MicroBitSerial(USBTX, USBRX);\n```\n\nThe MicroBit V2 uses:\n\n```\nMicroBitSerial(USB_UART_TX,\
    \ USB_UART_RX);\n```\n\nIn this case the I2C lines have been allocated to the\
    \ first two pads, i.e. P0 and P1 on the connector. If you do this then you have\
    \ to make sure that you don't configure or attempt to use these GPIO lines for\
    \ any other purpose."
  merge: -1
