- pgno: 135
  md: '# Summary


    +   - The DHT22 is a low-cost temperature and humidity sensor.

    - It uses a custom single wire bus which is not compatible with the standard 1-Wire
    bus.

    - Its asynchronous protocol is easy to implement the timing required.

    - The timing may be easy, but unless interrupts are turned off it is unlikely
    to complete a single reading without error.

    - A very simple checksum is used to detect errors.'
  merge: -1
  img_proc: true
- pgno: 136
  md: '# # Chapter 9

    # DS18B20 1-Wire Temperature Sensor


    The 1-Wire bus is a proprietary bus that is very easy to use and has a lot of
    useful devices you can connect to it. Probably the most popular of all 1-wire
    devices is the DS18B20 temperature sensor - it is small, very cheap and very easy
    to use if the processor supports the 1-Wire bus protocol, the micro:bit doesn''t.
    However, the protocol is easy enough to program in C and the micro:bit is fast
    enough to work with it without needing anything extra. We have to use C for this;
    Python, for example, just isn''t fast enough.


    The microbit has an onboard temperature sensor, but this measures the temperature
    of the CPU and only gives you the air temperature very approximately. The DS18B20
    gives you an accurate temperature and you have multiple sensors.


    # # The Hardware


    The DS18B20 is available in a number of formats but the most common makes it look
    just like a standard BJT - which can sometimes be a problem when you are trying
    to find one. You can also get the DS18B20 made up into a waterproof sensor complete
    with cable. No matter how packaged, it will work at 3.3V or 5V.


    ![](img/23976341c9281123e7b181beea6e9dbd_136_0.png)'
  merge: -1
  img_proc: true
- pgno: 137
  md: 'The basic specification of the DS18B20 is:


    +   - Measures temperatures from -55°C to +125°C (-67°F to +257°F)

    - ±0.5°C accuracy from -10°C to +85°C

    - Thermometer resolution is user-selectable from 9 to 12 Bits

    - Converts to 12-bit digital word in 750ms (max)


    It can also be powered from the data line, making the bus physically only two
    wires - data and ground - however this "parasitic power" mode is difficult to
    make work reliably and best avoided in an initial design. In normal powered mode
    there are three connections:


    ![](img/23976341c9281123e7b181beea6e9dbd_137_0.png)


    Ground needs to be connected to the system ground, $V_{DD}$ to 3.3V and DQ to
    the pull-up resistor of an open collector bus.


    ![](img/23976341c9281123e7b181beea6e9dbd_137_1.png)


    There can be multiple devices on the bus and each one has a unique 64-bit laser
    ROM code, which can be used as an address to select the active devices. For simplicity,
    it is better to start off with a single device and avoid the problem of enumerating
    the devices on the bus, although once you know how everything works this isn''t
    difficult to implement.'
  merge: -1
  img_proc: true
- pgno: 138
  md: 'There is a problem we have to solve, however, the need for fast switching between
    input and output. Without intervention, changing between output and input mode
    is done using the system and is comparatively slow, approximately 80µs. In some
    cases this does matter because the protocol requires data from the master and
    receives data from the slave. For example, the DHT22 temperature and humidity
    sensor asks the processor to write to it a measurement and then sends data back
    without the processor writing anything, which permits the use of a single GPIO
    line, send the data, switch to input and read the data.


    In the case of the 1-Wire buses are very different. The master has to send a fast
    pulse on the line for every bit received and it has to be able to read the output
    to input in time to read the data, although it could be done by writing with all
    1-wire devices to the registers. A secure and simple solution that should work
    is to use two GPIO lines - one set to output and one to input. If you can''t afford
    to use two GPIO lines then there is a way to do the job with, but only by resorting
    to directly accessing the GPIO line and not using the library functions, the end
    of this chapter for more details.


    You can use any pair of GPIO lines, but for simplicity this example uses P0 and
    P1. The DS18B20 can be directly connected to the micro:bit''s pads. The only complication
    is that you need the pull-up resistor. The internal pullup resistor is around
    10-15k and is just too large to work. You need to put a 4.7k resistor in parallel
    with it to decrease the resistance.


    The circuit is:


    ![](img/23976341c9281123e7b181beea6e9dbd_138_0.png)


    Notice that only the wires from P0 and P1 are joined.


    You can build it in a variety of ways. You could solder the resistor to the temperature
    sensor and then use longer wires with clips to connect to the micro:bit. You could
    also solder directly to the micro:bit or use a prototyping board.'
  merge: -1
  img_proc: true
- pgno: 139
  md: "# # Initialization\n\nEvery transaction with a 1-wire device starts with an\
    \ initialization handshake.\nFirst, we have to get the GPIO lines set up correctly:\n\
    \n```\nMicroBit uBit:\nMicroBitPin P0 = uBit.io.P0;\nMicroBitPin P1 = uBit.io.P1;\n\
    ```\n\n```\nint main() {\n  uBit.init();\n  P0.setDigitalValue(1);\n  P0.setPull(Pull-up);\n\
    \  P1.getDigitalValue();\n```\n\nWe have the usual initialization of the MicroBit\
    \ object and for simplicity we define P0 and P1 shorts to the pins we are using.\
    \ P0 is initialized by setting it to output a 1 and P1 is read, just to set it\
    \ input. This gets both pins ready so that the first read/write doesn't waste\
    \ time configuring I/O direction.\n\nThe only out-of-the-ordinary part of the\
    \ initialization is the use of setPull,which differs from the V1 and V2, configuring\
    \ the output pin to be one:\n\n+   - V1 PullNone V2 PullMode:None - standard push-pull\
    \ output\n\"- V1 Pull-down V2 PullMode:Down - pull-down\n\"- V1 Pull-up V2 PullMode:up\
    \ - pull-up\n\nNow we have to send the initialization pulse. This is simply a\
    \ low pulse that lasts at least 48µs, a pulse lasting 15µs to 60µs follows and\
    \ then any devices on the bus line for 60µs to 240µs.\n\n![](img/23976341c9281123e7b181beea6e9dbd_139_0.png)\n\
    \n140"
  merge: -1
  img_proc: true
- pgno: 140
  md: "This is fairly easy to implement as a function including the initialization\
    \ of the GPIO lines:\ninit()\n\n```\n{\n    int reset = 700;\n    //reset = 2250;\
    \ // uncomment V2\n    int gap = 60;\n    //gap = 200; // uncomment V2\n\n   \
    \ volatile int i;\n\n    P0.setDigitalValue(1);\n    P0.setPull(PullMode::);\n\
    \    P1.getDigitalValue();\n    P0.setDigitalValue(0);\n\n    disable irq();\n\
    \    for (i = 0; i < reset; i++)\n    P0.setDigitalValue(1);\n\n    for (i = 0;\
    \ i < gap; i++)\n\n    int b = P1.getDigitalValue();\n\n    for (i = 0; i < reset\
    \ - gap; i++)\n    __enable_irq();\n\n    return b;\n}\n```\n\nNotice that the\
    \ index of the for loop has been declared volatile to stop the compiler from optimizing\
    \ the loop by removing the null loop completely. The size of the loop can be varied\
    \ according to whether the program is run on a V1 or V2. Also notice that we turn\
    \ off interrupts during the time-critical portion of the program.\n\nWe pull the\
    \ line low for 500µs and then let it be pulled up. After a 30µs wait, which is\
    \ right at the start of the guaranteed period when the line should be low, if\
    \ there is an active device on the bus we read the input line and then wait another\
    \ 500µs to complete the data slot. The timings in this case are not critical as\
    \ long as the P1 line is read while it is held by the slaves - is never less than\
    \ 60µs and is typically as much as 100µs. The actual pulse timings with the values\
    \ given are around 530-660µs reset, 30µs pause and a 450µs final part of the data\
    \ slot."
  merge: -1
  img_proc: true
- pgno: 141
  md: "If there is a device the function should return 0 and if there are no devices\
    \ it should return 1:\n\n```\nint main()\n{\n    uBit.init();\n    if (init()\
    \ == 1) {\n        uBit.serial.printf(\"No device \\n\\r\");\n    } else {\n \
    \       uBit.serial.printf(\"Device detected \\n\\r\");\n    }\n}\n```\n\nIf you\
    \ try this partial program using a logic analyzer with a 1-wire protocol analyzer\
    \ you will see something like:\n\n![](img/23976341c9281123e7b181beea6e9dbd_141_0.png)\n\
    \nSeeing a presence pulse is the simplest and quickest way to be sure that your\
    \ hardware is working.\n\n# Writing Bits\n\nOur next task is to implement the\
    \ sending of some data bits to the device. The 1-Wire bus has a very simple data\
    \ protocol. All bits are sent using a minimum of 60µs for each slot. Each slot\
    \ must be separated from the next by a minimum of 1µs. The good news is that timing\
    \ is only critical within each slot. You can send the first bit in a time slot\
    \ and then take your time before you send the next bit, the device will wait for\
    \ you. This means you only have to worry about timing within the functions that\
    \ read and write individual bits."
  merge: -1
  img_proc: true
- pgno: 142
  md: "The exact timings can be seen below:\n\n![](img/23976341c9281123e7b181beea6e9dbd_142_0.png)\n\
    \nIt seems reasonable to use the typical timings shown in design. For a 0 we hold\
    \ the line for 60µ then let it go high for the remainder of the slot. We send\
    \ a 1 we hold the line for a bit more than 1µ then let it go high for the remainder\
    \ of the slot. Notice that keeping the low period closer to 1µ than 15µ is a good\
    \ idea because the master could read the line after as little 15µ.\n\nThe sendZero\
    \ function is:\n\n```\nvoid sendZero() {\n  int zero = 75;\n  zero = 240; // uncomment\
    \ for V2\n  int slot = 30;\n  slot = 300; // uncomment for V2\n  volatile int\
    \ i;\n  P0.digitalValue(0);\n  for (int i = 1; i < zero; i++);\n  P0.digitalValue(1);\n\
    \  for (int i = 1; i < slot - zero; i++);\n}\n```\n\nThe sendOne function is:\n\
    \n```\nvoid sendOne() {\n  int one = 1;\n  one = 8; // uncomment for V2\n  int\
    \ slot = 30;\n  slot = 300; // uncomment for V2\n  volatile int i;\n  P0.digitalValue(0);\n\
    \  for (int i = 1; i < one; i++);\n  P0.digitalValue(1);\n  for (int i = 1; i\
    \ < slot - one; i++);\n}\n```\n\nNotice that the functions keep control after\
    \ letting the line go high again. In principle they could return and let the main\
    \ program do some processing, but"
  merge: -1
  img_proc: true
- pgno: 143
  md: "this would mean the main program had to hold off sending another bit until\
    \ the 60µs was up. This approach isn't efficient, but it is simple. Also notice\
    \ that, the time periods are short and have to be fairly repeatable, a busy wait\
    \ is the best option for the delay.\n\nWith these constants the measured widths\
    \ are:\n\nFor a θ line is held low for just around 60µs with a pulse of about\
    \ 10µs making the slot roughly 70µs.\n\nFor a 1 line is held low for 3-4µs and\
    \ the slot is 70µs in total.\n\nAs the only critical operations are the actual\
    \ setting of the line low and then back to high, there is no need to worry much\
    \ about speed of operation of the entire function so we might well combine into\
    \ a single writeBit function:\n\n```\nvoid writeBit(int b)\n{\n    int zero =\
    \ 75;\n    int zero = 240; //uncomment for V2\n    int one = 8; //uncomment for\
    \ V2\n    int slot = 30;\n    //slot = 300; //uncomment for V2\n\n    volatile\
    \ int i;\n    int delay1, delay2;\n\n    if (b == 1)\n    {\n        delay1 =\
    \ one;\n    }\n    else\n    {\n        delay1 = zero;\n        delay2 = slot\
    \ - delay1;\n        disable_irq();\n        P0.setDigitalValue(0);\n        for\
    \ (i = 1; i < delay1; i++){\n            P0.setDigitalValue(1);\n        }\n \
    \       for (i = 1; i < delay2; i++){\n            enable_irq();\n        }\n\
    \    }\n}\n```"
  merge: -1
  img_proc: true
- pgno: 144
  md: "The code at the start of the function simply increases the time between slots\
    \ slightly. Notice that use of __disable_irq() and __enable_irq() to make sure\
    \ that the slot isn't interrupted.\n\nYou can see a 1 followed by a 0 in the following\
    \ logic analyzer trace:\n\n![](img/23976341c9281123e7b181beea6e9dbd_144_0.png)\n\
    \n# A First Command\n\nAfter discovering that there is at least one device connected\
    \ to the bus, the master has to issue a ROM command. In many cases the ROM command\
    \ used first will be the Search ROM command which enumerates the 64-bit codes\
    \ of all of the devices on the bus. After collecting all of these codes the master\
    \ can use Match commands with a specific 64-bit code to select the device it wants\
    \ to talk to.\n\nWhile it is perfectly possible to implement the Search ROM procedure,\
    \ it is simpler to work with the single device using commands which ignores the\
    \ 64-bit code and address all of the devices on the bus at the same time. Of course,\
    \ this only works as long as there is only one device on the bus.\n\nIf there\
    \ is only one device then we can use the Skip ROM command, 0xCC, to tell all the\
    \ devices on the bus to be active. As we have a writeBit function\n\n```\nvoid\
    \ skipBit() {\n  writeBit(0);\n  writeBit(0);\n  writeBit(1);\n  writeBit(1);\n\
    \  writeBit(0);\n  writeBit(1);\n  writeBit(1);\n}\n```\n\nNote that 0xCC is 1100\
    \ 1100 in binary and the 1-Wire bus sends the least significant bit first. If\
    \ you try this you should find out it works, but the device doesn't respond because\
    \ it is waiting for another command.\n\nAgain, as the time between writing bits\
    \ isn't critical, we can take this first implementation of the function and write\
    \ something more general, if slightly"
  merge: -1
  img_proc: true
- pgno: 145
  md: "slower. The writeByte function will write the low 8 bits of an int to the device:\n\
    \n```\nvoid writeByte(int byte){\n  int i;\n  for(i=0;i<8;i++){\n    if(byte &\
    \ 1){\n      writeBit(1);\n    else{\n      writeBit(0);\n    }\n    byte=byte>>1;\n\
    \  }\n}\n```\n\nUsing this we can send a Skip ROM command using:\nwriteByte(0xCC);\n\
    You can see the pattern of bits sent on a logic analyzer:\n\n![](img/23976341c9281123e7b181beea6e9dbd_145_0.png)\n\
    \n# Reading Bits\n\nWe already know how the master sends a 1 and a 0. The protocol\
    \ for the slave device is exactly the same except that the master still provides\
    \ the slot's starting pulse. That is, the master starts roughly 60µs slot by pulling\
    \ the bus down for a bit more than 1µs. Then the slave device either holds the\
    \ line down for a further 15µs minimum or it simply allows the line to float high.\
    \ See below for the exact timings:\n\n![](img/23976341c9281123e7b181beea6e9dbd_145_1.png)"
  merge: -1
  img_proc: true
- pgno: 146
  md: "So all we have to do read bits to pull the line down for just a bit more\n\
    than 1µs and then sample the bus at the end of a 15µs pause:\n\n```\nint readBit()\
    \ {\n    volatile int i;\n    int sample = 20;\nsample = 55; // uncomment for\
    \ V2\nint pulse = 1;\npulse = 8; // uncomment for V2\nint slot = 30;\nslot = 300;\
    \ // uncomment for V2\ndisable irq();\n    P0.digitalValue(0);\n    for (i = 1;\
    \ i < pulse; i++){\n    P0.digitalValue(1);\n    for (i = 1; i < sample; i++){\n\
    \    int b = P1.getDigitalValue();\n    enable irq();\n    for (i = 1; i < slot\
    \ - sample - pulse; i++){\n    {\n    }\n    return b;\n    }\n```\n\nreadBit\
    \ function pulls the line low for about 4µs and measures the line\nstate at around\
    \ 15µs. The total slot time is around 70µs. Again, it is better to\nuse busy waits\
    \ as the time periods are short and need to be repeatable. Also\nnotice that interrupts\
    \ are turned off during the measurement period.\nA logic analyzer shows the typical\
    \ pattern of bits from the device:\n\n![](img/23976341c9281123e7b181beea6e9dbd_146_0.png)\n\
    \n# Initiating A Temperature Conversion\n\nOur next task is to send a Convert\
    \ command, 0x44. This starts the DS18B20\nmaking a temperature measurement. Depending\
    \ on the resolution selected,\nthis can take as long as 750ms. How the device\
    \ tells the master that the\nmeasurement has completed depends on the mode it\
    \ is operating in, but\nusing an external power line, i.e. not using parasitic\
    \ mode, the device sends a\n0 bit in response to a bit read until it is completed\
    \ when it sends a 1. You"
  merge: -1
  img_proc: true
- pgno: 147
  md: "write a polling loop that reads the bus until it gets a 1, but it is much easier\
    \ to simply wait for more than 750ms before reading.\n\nAs we already have a readBit\
    \ function this is easy - we send the command and then wait long enough for it\
    \ to complete:\n\n```\nvoid convert() {\n  writeByte(0x44);\n  uBit.sleep(900);\n\
    }\n```\n\nWhen the function returns, the new temperature measurement is stored\
    \ in the device's scratchpad memory and now all we have to do is read this.\n\n\
    # Reading the Scratchpad\n\nThe scratchpad memory has nine bytes of storage in\
    \ total and does things control the accuracy of conversion and provide status\
    \ information. However, in our simple example the only two bytes of great interest\
    \ are the first two, which hold the result of a temperature conversion.\n\nBefore\
    \ we move to read the scratchpad we need a function that will read a byte. As\
    \ in the case of writing a byte, there is no time criticality in the time between\
    \ reading bits we don't need to take extra special care in constructing the function:\n\
    \n```\nint readByte(){\n  int byte=0;\n  int i;\n  for(i=0;i<8; i++){\n    byte=readBit()<<\
    \ i;\n  }\n  return byte;\n}\n```\n\nThe only difficult part is to remember that\
    \ the 1-Wire bus sends the least significant bit and first so this has to be shifted\
    \ into the result from the right. Now we have a readByte function, getting the\
    \ data is simple. We have to issue a Read scratchpad 0xBE command and then read\
    \ the nine bytes that the device returns. However, to send the new command we\
    \ have to issue a new initialization pulse and a Skip ROM 0xCC command followed\
    \ by a Read scratchpad pulse 0xBE:\n\n```\ninit();\nwriteByte(0xCC);\nwriteByte(0xBE);\n\
    ```"
  merge: -1
  img_proc: true
- pgno: 148
  md: 'Now the data is ready to read and we can read all nine bytes of it or just
    the first two. The device will keep track of where the read is, so if you come
    back later and read bytes the first one will not be read again. If you issue an
    initialization pulse then the device aborts the data transmission.


    We only need the first two bytes, which are the least and most significant bytes
    of 11-bit temperature reading as a 16-bit, two''s complement integer.


    ```

    int b1 = readByte();

    int b2 = readByte();

    ```


    # Getting the Temperature


    All we now have to do is to put the two bytes together as a 16-bit integer. As
    the microbit:supports a 16-bit int, we can do this very easily:


    ```

    int16_t temp = (b2<<8 | b1);

    ```


    Finally we need to convert this to a floating point value. As already discussed,
    the microbit:doesn''t support this in hardware. As we all really want to give
    digits to the tens and two digits to get the fractional part, it is easier to
    work in integer arithmetic using temperature multiplied by 100:


    ```

    temp = temp * 100 / 16;

    ```


    This gives an integer value that represents the temperature in hundreds of a degree
    centigrade, e.g. 25.45°C is represented as 2545. Notice that this only works because
    int16_t really is a 16-bit integer. If you were to use a 32-bit int:


    ```

    int temp = (b2<<8 | b1);

    ```


    then temp would be correct for positive temperatures, but it would give the wrong
    answer for negative values because the sign isn''t propagated into the 10 bits.
    If using a 32-bit integer, propagate the sign bit manually:


    ```

    if(b2 & 0x80) temp = temp | 0xFFFF0000;

    ```


    Assuming we have the temperature in 100ths of a degree C in temp, we can show
    it on the microbit:s LED matrix. First we need to convert it into a string:


    ```

    char buff[10];

    sprintf(buff, "%d.%d", temp / 100, abs(temp % 100));

    ```


    Now we can display the string:


    ```

    uBit.display.scroll(buff, 200);

    ```


    That finalizes a basic program to read the temperature and create some useful
    1-wire functions. The next task would be to create a function that reads the temperature
    to refactor of code to demand.'
  merge: -1
  img_proc: true
- pgno: 149
  md: "# Complete Listing\n\n```\n#include \"MicroBit.h\"\n#include <cdio>\n```\n\n\
    MicroBit uBit;\nMicroBitPin P0 = uBit.io.P0;\nMicroBitPin P1 = uBit.io.P1;\n\n\
    ```\nint init(){\n    int reset = 700;\n    //reset = 2250; // uncomment V2\n\
    \    int gap = 60;\n    //gap = 200; // uncomment V2\n    volatile int i;\n}\n\
