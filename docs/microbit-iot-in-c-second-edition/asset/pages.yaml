- pgno: 265
  md: '# Fundamental C: Getting Closer To The Machine ISBN: 9781817192604


    At an introductory level, this book explores C from the point of view of low-level
    programming and keeps close to the hardware. It covers addresses, pointers, and
    how things are represented using binary and emphasizes the important idea that
    everything is a pattern. For ግን, the book covers installing an IDE and GCC before
    writing a Hello World program and then presents the fundamental building blocks
    of program - variables, assignment and expressions, flow of control using conditionals
    and loops.


    ![](img/23976341c9281123e7b181beea6e9dbd_265_0.png)


    When programming in C you need to think about the way data is represented, and
    this book emphasizes the idea of modifying how a pattern is treated using type
    punning and unions the topic of undefined behavior, which is ignored in many books
    on C. A particular feature of the book is the way C code is illustrated by the
    assembly language it generates. This helps you understand why C is the way it
    is. And the way it was always intended to be written - close to the metal.


    # Raspberry Pi IoT in Python With GPIO Zero ISBN:97818171962666


    Python is an excellent language to learn about the IoT or physical computing.
    It might not be as fast as C, but it is much easier to use for complex data processing.
    The GPIO Zero library is the official way to use Python with GPIO and other devices.
    This book looks at how to use it to interface to devices and how it works so you
    can extend it to custom devices. Studying GPIO Zero is also a great way to improve
    your Python.


    ![](img/23976341c9281123e7b181beea6e9dbd_265_1.png)'
