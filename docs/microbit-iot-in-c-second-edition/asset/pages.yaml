- pgno: 155
  md: '# Summary


    +   - The 1-Wire bus is a proprietary, but widely used, bus. It is simple and
    very capable.

    - As its name suggests, it makes use of a single data wire and usually a power
    supply and ground.

    - It is possible to dispense with the power line and the connected device will
    draw power from the data line.

    - Implementing the 1-wire bus protocol is mostly a matter of getting the timing
    right.

    - There are three types of interaction: presence pulse, read and write.

    - The 1-wire bus protocol is easier to implement than you might think because
    each bit is sent as a "slot" and, while timing is critical within the slot, how
    fast slots are sent is not.

    - As you can''t switch a line from output to input fast enough, you have to use
    two GPIO lines to implement the 1-Wire bus, unless you are prepared to work directly
    with the hardware.

    - The DS18B20 temperature sensor is one of the most commonly encountered 1-Wire
    bus devices. It is small, low-cost and you can use multiple devices on a single
    bus.

    - After a convert command is sent to the device, it can take 750ms before a reading
    is ready. When the data is ready you can read the scratchpad memory where the
    data is stored.

    - If you program the hardware directly you can use a singe GPIO line to implement
    the 1-Wire bus protocol.'
  merge: -1
  img_proc: true
- pgno: 156
  md: '# Chapter 10


    # SPI Bus


    The SPI bus can be something of a problem because it doesn''t have a well-

    defined standard that every device conforms to. Even so, if you only want to

    work with one specific device, it is usually easy to find a configuration that

    works - as long as you understand the possibilities are.


    The microbit has two SPI bus devices built into its processor, a bus master\and
    a bus slave. If you want to connect the microbit to SPI devices then it is

    bus master that is of interest. If you want to use the microbit as a device

    connected to some other controller then you need to have it acting as a slave.

    This second scenario is as common and in this chapter we concentrate on

    using the microbit


    # SPI Bus Basics


    The SPI bus is very strange, but commonly encountered as it is used to

    connect all sorts of devices from LCD displays, through real time clocks and

    A-to-D converters. It is strange because there is no standard for it and

    different companies have implemented it in different ways. As a result you

    have to work harder to implement it in any particular case. However,

    usually works, which is a surprise for a bus with no standard or clear

    specification.


    The reason it can be made to work is that you can specify any of different

    operating modes, frequencies and polarities. This makes the bus slightly

    complicated to use, but generally it is a matter of looking up how the device

    yare trying to work with implements the SPI bus and then getting the

    microbit to work in the same way.


    The bus is odd in another way - it does not make bidirectional serial

    connections. There is a line for the data to go from the master to the

    slave and a separate data line from the slave back to the master. That is,

    instead of a single data line that changes its transfer direction, there is one
    for

    data out and not for data in.


    It is also worth knowing that the drive on the SPI bus is push-pull and not

    open collector/drain. This provides higher speed and more noise protection as

    the bus is driven in both directions. Also you don''t need pull-up resistors.'
  merge: -1
  img_proc: true
- pgno: 157
  md: 'There is a bidirectional mode where a single wire is used for the data, but
    the microbit doesn''t support this.


    The standard signal lines are:


    +   - MOSI Master Output Slave Input, i.e. data to the slave

    - MISO Master Input Slave Output, i.e. data to the master

    - SCLK Serial Clock which is always generated by the master


    There can also be any Number of SS (Slave Select) or CS (Chip Select) lines, which
    are usually set low to select which slave is being addressed. Notice that unlike
    other buses, I2C for example, there are no SPI commands or addresses, only bytes
    of data. However, slave devices do interpret some of the data as commands to do
    something or send some particular data.


    The microbit has two SPI Masters, but only one is exposed on the GPIO connector.
    There are no standard CE (Chip Enable) lines, although it is easy and logical
    to assign P16 to this task. This means that, in principle, you can connect only
    one SPI device to the microbit, although this restriction is easy to overcome
    by using additional GPIO lines for extra chip selects.


    The second SPI Master can be used just as easily as the first, but you will have
    to allocate four GPIO lines to it and this is certain to mean loss of other functions.


    ![](img/23976341c9281123e7b181beea6e9dbd_157_0.png)


    In addition, the SPI bus hardware can be connected to any four GPIO lines, the
    pins that are normally used are:


    | SPI | GPIO V1 | GPIO V2 |

    |---|---|---|

    | P13 SCLK | P0 23 | P0 17 |

    | P14 MISO | P0 22 | P0 01 |

    | P15 MOSI | P0 21 | P0 13 |

    | P16 CE | P0 16 | P1_02 |


    Notice that the use of P16 isn''t mandatory and it isn''t part of the usual pin
    allocation lists or diagrams.


    158'
  merge: -1
  img_proc: true
- pgno: 158
  md: 'The data transfer on the SPI bus is also slightly odd. What happens is that
    the master pulls one of the chip selects low, which activates a slave. Then the
    master toggles the SCLK and both the master and the slave send a single bit on
    their respective data lines. After clock pulls a byte has been transferred from
    the master to the slave and from the slave to the master. You can think of this
    as being implemented as a circular buffer.


    # Master


    # Slave


    ![](img/23976341c9281123e7b181beea6e9dbd_158_0.png)


    This full duplex transfer is often hidden by the software and the protocol used.
    For example there is a single write function that also reads data from the slave
    - it should be called a read-write function. The transfer is typically in groups
    of eight bits and usually most significant first but this it''s always the case.
    In general, as long as the master supplies clock pulses, data is transferred.


    Notice this circular buffer arrangement for slaves to be daisy-chained with the
    output of one going to the input of the next. This makes the entire chain one
    big circular shift register. This makes it possible to have multiple devices with
    only a single chip select, but it also means any commands sent to the slaves are
    received by each one in turn. For example, you could send a convert command to
    each A-to-D converter in turn and receive back results from each one.


    The final odd thing about the SPI bus is that there are four modes which define
    the relationship between the data timing and the clock pulse. The clock can be
    either active high or low, which is referred to as clock polarity (CPOL) and data
    can be sampled on the rising or falling edge of the clock, which is clock phase
    CPHA.


    All combinations of these two possibilities gives the four modes:


    | SPI Mode* | Clock Polarity CPOL | Clock Edge CPHA | Characteristics |

    |---|---|---|---||

    | 0 | 0 | 0 | Clock active high data output on falling edge and sampled on rising
    |

    | 1 | 0 | 1 | Clock active high data output on rising edge and sampled on falling
    |

    | 2 | 1 | 0 | Clock active low data output on falling edge and sampled on rising
    |

    | 3 | 1 | 1 | Clock active low data output on rising edge and sampled on falling
    |


    *The way the modes are numbered is common but not universal'
  merge: -1
  img_proc: true
- pgno: 159
  md: 'There is often a problem trying to work out what mode slave device uses. The
    clock polarity is usually easy and the clock phase can sometimes be worked out
    from the data transfer timing diagrams, bearing in mind that:


    +   * First clock transition in the middle of a data bit means CPHA=0

    * First clock transition at the start of a data bit means CPHA=1


    To configure the SPI bus to work with a particular slave device you have to select
    the clock frequency, anything from 125kHz to 8MHz, and set the clock mode to 0,
    1,2 or 3.


    Now we have to find out how to do all of this using the functions supplied.


    # The SPI Functions


    # Initialization


    Before you can use the SPI bus you have to create an instance of the SPI class
    and specify the pins you are going to use. The constructor is:


    ```

    SPI(PinName mosi, PinName miso, PinName sck, PinName ssel=NC);

    ```


    You can specify any of the pins as NC (not connected) and if you don''t specify
    a CE line then it is not connected by default. A standard SPI object using the
    standard pins is:


    ```

    SPI spi(MOSI, MISO, SCK);

    ```


    If you need a CE line then use:


    ```

    SPI spi(MOSI, MISO, SCK, MICROBIT_ID_IO_P16);

    ```


    Notice that all the constructor is to set the CE pin up correctly. When you use
    the write function it doesn''t automatically toggle the CE line, you have to do
    this job manually. As the initialization of the CE line by the constructor seems
    to interfere with the framework''s initialization, your choices are to either
    control the CE line directly or not include it in the constructor and control
    it via the framework.'
  merge: -1
  img_proc: true
- pgno: 160
  md: '# Configuration


    There are two functions that set the format of operation.

    The first sets the mode and the number of bits:

    void format(int bits, int mode = 0);


    where mode is set according to the table listed earlier and bits sets the number
    of bits between 4 and 16 to be transferred in a read/write operation.

    The second simply sets the frequency of operation, i.e. the clock frequency:

    void frequency(int hz = 1000000);


    The allowed frequencies are:


    +   125 kHz

    250 kHz

    500 kHz

    1 MHz

    2 MHz

    4 MHz

    8 MHz


    If you don''t select one of these the software selects the next highest.


    # Data Transfer Function


    Because of the SPI bus uses a full duplex transfer, you only need a single data
    transfer function, but this differs according to the micro:bit version you are
    using.


    The micro:bit V1 has only:

    int write(int value);


    This sends a block of data to the slave while receiving a single block sent back.
    The number of bits sent and received is set by the configuration to anything from
    4 to 16. In practice, this is a read/write function, but you can always throw
    away the data from the slave or send meaningless data to the slave to create something
    that looks like a read/write pair.


    In the case of the micro:bit V2, the write function only sends the data and returns
    a zero or an error code. That is, it isn''t bidirectional and hence not particularly
    useful. The bidirectional data transfer function:

    transfer(*txBuffer,Size, *rxBuffer, rxSize);


    This sends the data in the txBuffer and stores returned data in the rxBuffer.

    It is slightly complicated to use but it is more useful.'
  merge: -1
  img_proc: true
- pgno: 161
  md: "It is easy to provide the V1 with a transfer function polyfil using the write\
    \ function:\n\n```\nint SPItransfer(uint8_t *txBuffer, uint32_t txSize, uint8_t\
    \ *rxBuffer, uint32_t rxSize);\nCS.setDigitalValue(0);\nuint32_t i;\nfor (i =\
    \ 0; i < txSize; i++) {\n    if (i < rxSize)\n    {\n        rxBuffer[i] = spi.write(txBuffer[i]);\n\
    \    } else {\n        spi.write(txBuffer[i]);\n    }\n}\nCS.setDigitalValue(1);\n\
    return 0;\n```\n\nIt is assumed that txSize >= rxSize.\n\nIt is important to realize\
    \ the write function does not control any CE line you may have defined. You have\
    \ to set the CE line high when the SPI bus is being initialized and then lower\
    \ it just before you write data to the slave. Thou return the CE line high after\
    \ the data transfer is complete.\n\nNow we come to a subtle point. What is the\
    \ difference between transferring multiple bytes and repeated single bytes? The\
    \ answer is ten bytes, one byte at a time and the CE line has to be toggled. If\
    \ you want to transfer ten bytes, one byte at a time, you have to perform ten\
    \ calls to write, lowering the CE line before each and calling again before the\
    \ next one. If you want to transfer ten bytes as a block then keep the CE line\
    \ low until the tenth byte has been transferred. Sometimes this is not important\
    \ and you can transfer three bytes activating the CE for each one or transfer\
    \ three bytes keeping the CE line low until the transfer is over. However, some\
    \ slaves will abort the current multibyte operation if the chip select line is\
    \ deactivated in the middle of a multibyte transfer.\n\nIt is important to realize\
    \ that the nature of the transfer is that the first byte is sent at the same time\
    \ that the first byte is received. That is, unlike protocols where you send some\
    \ data and then get back some data, the whole transfer works a byte at a time,\
    \ the first byte is sent while the first byte is being received, then the second\
    \ byte is sent at the same time the second byte is being received and so on."
  merge: -1
  img_proc: true
- pgno: 162
  md: '# A Loopback Example


    Because of the way that data is transferred on the SPI bus, it is very easy to
    test that everything is working without having to any components. All you have
    to do connect MOSI to MISO so that anything sent to it is also received in a loopback
    mode.


    First connect pin 14 to pin 15 using a jumper wire. As this is a loopback test
    we really don''t need to configure the bus but for completeness:


    ```

    spi.format(8,0);

    spi.frequency(10000000);

    ```


    Next we can send some data and receive it right back:


    ```

    uint8_t buf[1] = {0xAA};\SPITransfer(buf, 1, buf, 1);

    ```


    V2:


    ```

    uint8_t buf[1] = {0xAA};

    spi.transfer(buf, 1, buf, 1);

    ```


    Notice that the V1 code makes use of the SPITransfer function in the previous
    section.


    The hex value AA is useful in testing because it generates the bit sequence 10101010,
    which is easy to see on a logic analyzer. We can check that the received data
    matches the sent data in a variety of ways:


    ```

    if(read_data == 0xAA) printf("data received correctly");

    ```


    We can also create and use a CE line using GPIO 16:


    ```

    MicroBitPin CS(MICROBIT_ID_IO_P16,

    MICROBIT_PIN_P16,

    PIN_CAPABILITY_DIGITAL );

    ```


    To make the SPI bus work properly when connected to a real slave device, rather
    than just in loopback mode, we need to set the CE line high when we initialize
    the bus and then set it low before sending data.'
  merge: -1
  img_proc: true
