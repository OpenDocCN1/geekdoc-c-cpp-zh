- pgno: 20
  md: 'Select the correct installer for your machine and follow the prompts. Make
    sure that you select the option to add CMake to the path, otherwise you will have
    to add it yourself. CMake is installed to:


    C:\Program Files\CMake\


    Check it works using:


    ```

    cmake --version

    ```


    If not check that it is on the path.

    CMake uses Ninja under Windows to actually perform the build. Download this from:


    https://ninja-build.org/


    Download the ZIP file for Windows and extract the ninja.exe file into a suitable
    folder that is on the path. A simple solution is to copy it to the CMake\bin directory.


    To check that Ninja is on the path and working use:


    ```

