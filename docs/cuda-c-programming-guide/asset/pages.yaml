- pgno: 22
  md: "# Chapter 2.\nPROGRAMMING MODEL\n\nThis chapter introduces the main concepts\
    \ behind the CUDA programming model by outlining how they are exposed in C++.\
    \ An extensive description of CUDA C++ is given in Programming Interface.\n\n\
    Full code for the vector addition example used in this chapter and the next can\
    \ be found in the vectorAdd CUDA sample.\n\n# 2.1. Kernels\n\nCUDA C++ extends\
    \ C++ by allowing the programmer to define C++ functions, called kernels, that,\
    \ when called, are executed N times in parallel by N different CUDA threads, as\
    \ opposed to only once like regular C++ functions.\n\nA kernel is defined using\
    \ the __global__ declaration specifier and the number of CUDA threads that execute\
    \ that kernel for a given kernel call is specified using a new <<< >>> execution\
    \ configuration syntax (see C++ Language Extensions). Each thread that executes\
    \ the kernel is given a unique thread ID that is accessible within the kernel\
    \ through built-in variables.\n\nAs an illustration, the following sample code,\
    \ using the built-in variable threadIdx, adds two vectors A and B of size N and\
    \ stores the result into vector C:\n\n```\n// Kernel definition\n__global__ void\
    \ VecAdd(float* A, float* B, float* C)\n{\n    int i = threadIdx.x;\n    C[i]\
    \ = A[i] + B[i];\n}\n\nint main()\n{\n    ...\n    // Kernel invocation with N\
    \ threads\n    VecAdd<<<1, N>>>(A, B, C);\n    ...\n}\n```\n\nHere, each of the\
    \ N threads that execute VecAdd() performs one pair-wise addition."
  merge: -1
  img_proc: true
- pgno: 23
  md: "# 2.2. Thread Hierarchy\n\nFor convenience, **threadIdx** is a 3-component\
    \ vector, so that threads can be identified using a one-dimensional, two-dimensional,\
    \ or three-dimensional **thread index**, forming a one-dimensional, two-dimensional,\
    \ or three-dimensional **thread block** of threads, called a **thread block**.\
    \ This provides a natural way to invoke computation across the elements in a domain\
    \ such as a vector, matrix, or volume.\n\nThe index of a thread and its thread\
    \ ID relate to each other in a straightforward way: For a one-dimensional block,\
    \ they are the same; for a two-dimensional block of size \\( (D_x, D_y) \\), the\
    \ thread ID of a thread \\( (x, y) \\) is \\( (x + y \\cdot D_x) \\); for a three-dimensional\
    \ block of size \\( (D_x, D_y, D_z) \\), the thread ID of a thread \\( (x, y,\
    \ z) \\) is \\( (x + y \\cdot D_x + z \\cdot D_x \\cdot D_y) \\).\n\nAs an example,\
    \ the following code adds two matrices A and B of size NxN and stores the result\
    \ into matrix C:\n\n```\n// Kernel definition\n__global__ void MatAdd(float A[N][N],\
    \ float B[N][N], float C[N][N])\n{\n    int i = threadIdx.x;\n    int j = threadIdx.y;\n\
    \    C[i][j] = A[i][j] + B[i][j];\n}\n\nint main()\n{\n    // Kernel invocation\
    \ with one block of N * N * 1 threads\n    int numBlocks = 1;\n    dim3 threadsPerBlock(N,\
    \ N);\n    MatAdd<<<numBlocks, threadsPerBlock>>>(A, B, C);\n    ...\n}\n```\n\
    \nThere is a limit to the number of threads per block, since all threads of a\
    \ block are expected to reside on the same processor core and must share the limited\
    \ memory resources of that core. On current GPUs, a thread block may contain up\
    \ to 1024 threads.\n\nHowever, a kernel can be executed by multiple equally-shaped\
    \ thread blocks, so that the total number of threads is equal to the number of\
    \ threads per block times the number of blocks.\n\nBlocks are organized into a\
    \ one-dimensional, two-dimensional, or three-dimensional **grid** of thread blocks\
    \ as illustrated by Figure 6. The number of thread blocks in a grid is usually\
    \ dictated by the size of the data being processed, which typically exceeds the\
    \ number of processors in the system."
  merge: -1
  img_proc: true
- pgno: 24
  md: '![](img/c13b0ff67eed8f2c7b32afa2a587a8d6_24_0.png)


    # Figure 6 Grid of Thread Blocks


    The number of threads per block and the number of blocks per grid specified in
    the <<< ... >>> syntax can be of type int or dim3. Two-dimensional blocks or grids
    can be specified as in the example above.


    Each block within the grid can be identified by a one-dimensional, two-dimensional,
    or three-dimensional unique index accessible within the kernel through the built-in
    blockIdx variable. The dimension of the thread block is accessible within the
    kernel through the built-in blockDim variable.'
  merge: -1
  img_proc: true
- pgno: 25
  md: "Extending the previous `MatAdd()` example to handle multiple blocks, the code\
    \ becomes as follows.\n\n```\n// Kernel definition\n__global__ void MatAdd(float\
    \ A[N][N], float B[N][N],\n                       float C[N][N])\n{\n    int i\
    \ = blockIdx.x * blockDim.x + threadIdx.x;\n    int j = blockIdx.y * blockDim.y\
    \ + threadIdx.y;\n    if (i < N && j < N)\n        C[i][j] = A[i][j] + B[i][j];\n\
    }\n\nint main()\n{\n    ...\n    // Kernel invocation\n    dim3 threadsPerBlock(16,\
    \ 16);\n    dim3 numBlocks(N / threadsPerBlock.x, N / threadsPerBlock.y);\n  \
    \  MatAdd<<<numBlocks, threadsPerBlock>>>(A, B, C);\n    ...\n}\n```\n\nA thread\
    \ block size of 16x16 (256 threads), although arbitrary in this case, is a common\
    \ choice. The grid is created with enough blocks to have one thread per matrix\
    \ element as before. For simplicity, this example assumes that the number of threads\
    \ per grid in each dimension is evenly divisible by the number of threads per\
    \ block in that dimension, although that need not be the case.\n\nThread blocks\
    \ are required to execute independently: It must be possible to execute them in\
    \ any order, in parallel or in series. This independence requirement allows thread\
    \ blocks to be scheduled in any order across any number of cores as illustrated\
    \ by Figure 5, enabling programmers to write code that scales with the number\
    \ of cores.\n\nThreads within a block can cooperate by sharing data through some\
    \ shared memory and by synchronizing their execution to coordinate memory accesses.\
    \ More precisely, one can specify synchronization points in the kernel by calling\
    \ the `__syncthreads()` intrinsic function; `__syncthreads()` acts as a barrier\
    \ at which all threads in the block must wait before any is allowed to proceed.\
    \ Shared Memory gives an example of using shared memory. In addition to `__syncthreads()`,\
    \ the Cooperative Groups API provides a rich set of thread-synchronization primitives.\n\
    \nFor efficient cooperation, the shared memory is expected to be a low-latency\
    \ memory near each processor core (much like an L1 cache) and `__syncthreads()`\
    \ is expected to be lightweight.\n\n# 2.3. Memory Hierarchy\n\nCUDA threads may\
    \ access data from multiple memory spaces during their execution as illustrated\
    \ by Figure 7. Each thread has private local memory. Each thread block has shared\
    \ memory visible to all threads of the block and with the same lifetime as the\
    \ block. All threads have access to the same global memory.\n\nThere are also\
    \ two additional read-only memory spaces accessible by all threads: the constant\
    \ and texture memory spaces. The global, constant, and texture memory spaces are\
    \ optimized for different memory usages (see Device Memory Accesses). Texture"
  merge: -1
  img_proc: true
- pgno: 26
  md: 'memory also offers different addressing modes, as well as data filtering, for
    some specific data formats (see Texture and Surface Memory).


    The global, constant, and texture memory spaces are persistent across kernel launches
    by the same application.


    ![](img/c13b0ff67eed8f2c7b32afa2a587a8d6_26_0.png)


    # Figure 7 Memory Hierarchy'
  merge: -1
  img_proc: true
- pgno: 27
  md: '# 2.4. Heterogeneous Programming


    As illustrated by Figure 8, the CUDA programming model assumes that the CUDA threads
    execute on a physically separate device that operates as a coprocessor to the
    host running the C++ program. This is the case, for example, when the kernels
    execute on a GPU and the rest of the C++ program executes on a CPU.


    The CUDA programming model also assumes that both the host and the device maintain
    their own separate memory spaces in DRAM, referred to as host memory and device
    memory, respectively. Therefore, a program manages the global, constant, and texture
    memory spaces visible to kernels through calls to the CUDA runtime (described
    in Programming Interface). This includes device memory allocation and deallocation
    as well as data transfer between host and device memory.


    Unified Memory provides managed memory to bridge the host and device memory spaces.
    Managed memory is accessible from all CPUs and GPUs in the system as a single,
    coherent memory image with a common address space. This capability enables oversubscription
    of device memory and can greatly simplify the task of porting applications by
    eliminating the need to explicitly mirror data on host and device. See Unified
    Memory Programming for an introduction to Unified Memory.'
  merge: -1
  img_proc: true
