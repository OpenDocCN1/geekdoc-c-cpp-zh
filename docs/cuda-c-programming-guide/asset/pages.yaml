    \ base classes B of T are empty and the type of the first field F of T uses B\
    \ in its definition, such that B is laid out at offset 0 in the definition of\
    \ F.\n\nLet C denote T or a class type that has T as a field type or as a base\
    \ class type. The CUDA compiler may compute the class layout and size differently\
    \ than the Microsoft host compiler for the type C.\n\nAs long as the type C is\
    \ used exclusively in host or device code, the program should work correctly.\n\
