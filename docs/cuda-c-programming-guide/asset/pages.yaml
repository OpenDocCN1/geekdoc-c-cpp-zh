  md: "+   Init-capture is not supported for __host__ __device__ extended lambdas.\
    \ Init-capture is supported for __device__ extended lambdas, except when the init-capture\
    \ is of array type or of type std::initializer_list.\n\n+   The function call\
    \ operator for an extended lambda is not constexpr. The closure type for an extended\
    \ lambda is not a literal type. The constexpr specifier cannot be used in the\
    \ declaration of an extended lambda.\n\n# Example\n\n```\nvoid foo(void) {\n \
    \   // OK: an init-capture is allowed for an\n    // extended __device__ lambda.\n\
    \    auto lam1 = [x = 1] __device__ () { return x; };\n\n    // Error: an init-capture\
    \ is not allowed for\n    // an extended host __device__ lambda.\n    auto lam2\
    \ = [x = 1] __host__ __device__ () { return x; };\n\n    int a = 1;\n    // Error:\
    \ an extended __device__ lambda cannot capture\n    // variables by reference.\n\
    \    auto lam3 = [&a] __device__ () { return a; };\n\n    // Error: by-reference\
    \ capture is not allowed\n    // for an extended __device__ lambda.\n    auto\
    \ lam4 = [&x = a] __device__ () { return x; };\n\n    struct S1_t { };\n    S1_t\
    \ s1;\n    // Error: a type local to a function cannot be used in the type\n \
    \   // of a captured variable.\n    auto lam6 = [s1] __device__ () { };\n\n  \
    \  // Error: an init-capture cannot be of type std::initializer_list.\n    auto\
    \ lam7 = [x = {11}] __device__ () { };\n\n    std::initializer_list<int> b = {11,\
    \ 22, 33};\n    // Error: an init-capture cannot be of type std::initializer_list.\n\
    \    auto lam8 = [x = b] __device__ () { };\n}\n```\n\n+   11. When parsing a\
    \ function, the CUDA compiler assigns a counter value to each extended lambda\
    \ within that function. This counter value is used in the substituted named type\
    \ passed to the host compiler. Hence, whether or not an extended lambda is defined\
    \ within a function should not depend on a particular value of __CUDA_ARCH__,\
    \ or on __CUDA_ARCH__ being undefined."
