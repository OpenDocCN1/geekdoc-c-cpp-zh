  md: "# F.3.13. Const-qualified variables\n\nLet 'V' denote a namespace scope variable\
    \ or a class static member variable that has const qualified type and does not\
    \ have execution space annotations (e.g., __device__, __constant__, __shared__).\
    \ V is considered to be a host code variable.\n\nThe value of V may be directly\
    \ used in device code, if\n\n+   - V has been initialized with a constant expression\
    \ before the point of use,\n+   - the type of V is not volatile-qualified, and\n\
    +   - it has one of the following types:\n+       - builtin floating point type\
    \ except when the Microsoft compiler is used as the host compiler,\n+       -\
    \ builtin integral type.\n\nDevice source code cannot contain a reference to V\
    \ or take the address of V.\n\n# Example:\n\n```\nconst int xxx = 10;\nstruct\
    \ S1_t { static const int yyy = 20; };\n\nextern const int zzz;\nextern float\
    \ www = 5.0;\n__device__ void foo(void) {\n    int local1(xxx); // OK\n    int\
    \ local2(S1_t::yyy); // OK\n\n    int val1 = xxx; // OK\n\n    int val2 = S1_t::yyy;\
    \ // OK\n\n    int val3 = zzz; // error: zzz not initialized with constant\n \
    \                   // expression at the point of use.\n\n    const int &val3\
    \ = xxx; // error: reference to host variable\n    const int *val4 = &xxx; //\
    \ error: address of host variable\n    const float val5 = www; // OK except when\
    \ the Microsoft compiler is used as\n                            // the host compiler.\n\
    }\nconst int zzz = 20;\n```\n\n# F.3.14. Long Double\n\nThe use of long double\
    \ type is not supported in device code.\n\n# F.3.15. Deprecation Annotation\n\n\
    nvcc supports the use of deprecated attribute when using gcc, clang, xlc, icc\
    \ or pgcc host compilers, and the use of deprecated declspec when using the cl.exe\
    \ host compiler. It also supports the [[deprecated]] standard attribute when the\
    \ C++14 dialect has been enabled. The CUDA frontend compiler will generate a deprecation\
    \ diagnostic for a reference to a deprecated entity from within the body of a\
    \ __device__, __global__ or __host__ __device__ function when CUDA_ARCH is defined\
    \ (i.e., during device compilation phase). Other references to deprecated entities\
    \ will be handled by the host compiler, e.g., a reference from within a __host__\
    \ function."
