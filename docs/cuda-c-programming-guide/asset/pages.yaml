  md: '# Appendix K.

    UNIFIED MEMORY PROGRAMMING


    # K.1. Unified Memory Introduction


    Unified Memory is a component of the CUDA programming model, first introduced
    in CUDA 6.0, that defines a managed memory space in which all processors see a
    single coherent memory image with a common address space.


    > A processor refers to any independent execution unit with a dedicated MMU. This
    includes both CPUs and GPUs of any type and architecture.


    The underlying system manages data access and locality within a CUDA program without
    need for explicit memory copy calls. This benefits GPU programming in two primary
    ways:


    +   - GPU programming is simplified by unifying memory spaces coherently across
    all GPUs and CPUs in the system and by providing tighter and more straightforward
    language integration for CUDA programmers.

    +   - Data access speed is maximized by transparently migrating data towards the
    processor using it.


    In simple terms, Unified Memory eliminates the need for explicit data movement
    via the cudaMemcpy* () routines without the performance penalty incurred by placing
    all data into zero-copy memory. Data movement, of course, still takes place, so
    a program''s run time typically does not decrease; Unified Memory instead enables
    the writing of simpler and more maintainable code.


    Unified Memory offers a “single-pointer-to-data” model that is conceptually similar
    to CUDA’s zero-copy memory. One key difference between the two is that with zero-copy
    allocations the physical location of memory is pinned in CPU system memory such
    that a program may have fast or slow access to it depending on where it is being
    accessed from. Unified Memory, on the other hand, decouples memory and execution
    spaces so that all data accesses are fast.


    The term Unified Memory describes a system that provides memory management services
    to a wide range of programs, from those targeting the Runtime API down to'
  merge: -1
  img_proc: true
- pgno: 324
  md: 'those using the Virtual ISA (PTX). Part of this system defines the managed
    memory space that opts in to Unified Memory services.


    Managed memory is interoperable and interchangeable with device-specific allocations,
    such as those created using the `cudaMalloc()` routine. All CUDA operations that
    are valid on device memory are also valid on managed memory; the primary difference
    is that the host portion of a program is able to reference and access the memory
    as well.


    > Unified memory is not supported on discrete GPUs attached to Tegra.


    # K.1.1. System Requirements


    Unified Memory has two basic requirements:


    +   - a GPU with SM architecture 3.0 or higher (Kepler class or newer)

    +   - a 64-bit host application and non-embedded operating system (Linux, Windows,
    macOS)


    GPUs with SM architecture 6.x or higher (Pascal class or newer) provide additional
    Unified Memory features such as on-demand page migration and GPU memory oversubscription
    that are outlined throughout this document. Note that currently these features
    are _only_ supported on Linux operating systems. Applications running on Windows
    (whether in TCC or WDDM mode) or macOS will use the basic Unified Memory model
    as on pre-6.x architectures even when they are running on hardware with compute
    capability 6.x or higher. See Data Migration and Coherency for details.


    # K.1.2. Simplifying GPU Programming


    Unification of memory spaces means that there is no longer any need for explicit
    memory transfers between host and device. Any allocation created in the managed
    memory space is automatically migrated to where it is needed.


    A program allocates managed memory in one of two ways: via the `cudaMallocManaged()`
    routine, which is semantically similar to `cudaMalloc()`; or by defining a global
    `__managed__` variable, which is semantically similar to a `__device__` variable.
    Precise definitions of these are found later in this document.


    > On supporting platforms with devices of compute capability 6.x and higher, Unified
    Memory will enable applications to allocate and share data using the default system
    allocator. This allows the GPU to access the entire system virtual memory without
    using a special allocator. See System Allocator for more detail.'
