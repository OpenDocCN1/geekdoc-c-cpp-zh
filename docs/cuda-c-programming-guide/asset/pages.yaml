  md: '+   - The address or value of a managed variable shall not be used when the
    CUDA runtime may not be in a valid state, including the following cases:

    +     - In static/dynamic initialization or destruction of an object with static
    or thread local storage duration.

    +     - In code that executes after exit() has been called (e.g., a function marked
    with gcc''s "__attribute__((destructor))").

    +     - In code that executes when CUDA runtime may not be initialized (e.g.,
    a function marked with gcc''s "__attribute__((constructor))").

    +   - A managed variable cannot be used as an unparenthesized id-expression argument
    to a decltype() expression.

    +   - Managed variables have the same coherence and consistency behavior as specified
    for dynamically allocated managed memory.

    +   - When a CUDA program containing managed variables is run on an execution
    platform with multiple GPUs, the variables are allocated only once, and not per
    GPU.

    +   - A managed variable declaration without the extern linkage is not allowed
    within a function that executes on the host.

    +   - A managed variable declaration without the extern or static linkage is not
    allowed within a function that executes on the device.'
