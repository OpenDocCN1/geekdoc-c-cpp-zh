    \ physical device should not be part of a device group that contains more than\
    \ one Vulkan physical device. The device group as returned by `vkEnumeratePhysicalDeviceGroups`\
    \ that contains the given Vulkan physical device must have a physical device count\
    \ of 1.\n\n```\nint getCudaDeviceForVulkanPhysicalDevice(VkPhysicalDevice vkPhysicalDevice)\
    \ {\n    vkGetPhysicalDeviceIDPropertiesKHR vkPhysicalDeviceIDProperties = {};\n\
    \    vkPhysicalDeviceIDProperties.sType =\n        VK_STRUCTURE_TYPE_PHYSICAL_DEVICE_ID_PROPERTIES;\n\
    \    vkPhysicalDeviceIDProperties.pNext = NULL;\n\n    VkPhysicalDeviceProperties2\
    \ vkPhysicalDeviceProperties2 = {};\n    vkPhysicalDeviceProperties2.sType =\n\
    \        VK_STRUCTURE_TYPE_PHYSICAL_DEVICE_PROPERTIES_2;\n    vkPhysicalDeviceProperties2.pNext\
