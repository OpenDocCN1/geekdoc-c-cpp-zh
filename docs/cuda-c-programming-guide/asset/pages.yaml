- pgno: 139
  md: 'To obtain best performance in cases where the control flow depends on the thread
    ID, the controlling condition should be written so as to minimize the number of
    divergent warps. This is possible because the distribution of the warps across
    the block is deterministic as mentioned in SIMT Architecture. A trivial example
    is when the controlling condition only depends on `(threadIdx / warpSize)` where
    `warpSize` is the warp size. In this case, no warp diverges since the controlling
    condition is perfectly aligned with the warps.


    Sometimes, the compiler may unroll loops or it may optimize out short `if` or
    `switch` blocks by using branch predication instead, as detailed below. In these
    cases, no warp can ever diverge. The programmer can also control loop unrolling
    using the `#pragma unroll` directive (see #pragma unroll).


    When using branch predication none of the instructions whose execution depends
    on the controlling condition gets skipped. Instead, each of them is associated
    with a per-thread condition code or predicate that is set to true or false based
    on the controlling condition and although each of these instructions gets scheduled
    for execution, only the instructions with a true predicate are actually executed.
    Instructions with a false predicate do not write results, and also do not evaluate
    addresses or read operands.


    # 5.4.3. Synchronization Instruction


    Throughput for `__syncthreads()` is 128 operations per clock cycle for devices
    of compute capability 3.x, 32 operations per clock cycle for devices of compute
    capability 6.0, 16 operations per clock cycle for devices of compute capability
    7.x and 64 operations per clock cycle for devices of compute capability 5.x, 6.1
    and 6.2.


    Note that `__syncthreads()` can impact performance by forcing the multiprocessor
    to idle as detailed in Device Memory Accesses.'
