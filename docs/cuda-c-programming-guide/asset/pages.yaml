    \nFor code that is compiled using the --default-stream per-thread compilation\
    \ flag (or that defines the CUDA_API_PER_THREAD_DEFAULT_STREAM macro before including\
    \ CUDA headers (cuda.h and cuda_runtime.h)), the default stream is a regular stream\
    \ and each host thread has its own default stream.\n\n> #define CUDA_API_PER_THREAD_DEFAULT_STREAM\
