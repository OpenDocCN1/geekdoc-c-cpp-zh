  md: '# Appendix F.

    C++ LANGUAGE SUPPORT


    As described in Compilation with NVCC, CUDA source files compiled with **nvcc**
    can include a mix of host code and device code. The CUDA frontend compiler aims
    to emulate the host compiler behavior with respect to C++ code. The input source
    code is processed according to the C++ ISO/IEC 14882:2003, C++ ISO/IEC 14882:2011
    or C++11 ISO/IEC 14882:2014 specifications, and the CUDA frontend compiler aims
    to emulate any host compiler divergences from the ISO specification. In addition,
    the supported language is extended with CUDA-specific constructs described in
    this document 10, and is subject to the restrictions described below.


    C++11 Language Features and C++14 Language Features provide support matrices for
    the C++11 and C++14 features, respectively. Restrictions lists the language restrictions.
    Polymorphic Function Wrappers and Extended Lambdas describe additional features.
    Code Samples gives code samples.


    # F.1. C++11 Language Features


    The following table lists new language features that have been accepted into the
    C++11 standard. The “Proposal” column provides a link to the ISO C++ committee
    proposal that describes the feature, while the “Available in nvcc (device code)”
    column indicates the first version of nvcc that contains an implementation of
    this feature (if it has been implemented) for device code.


    # Table 12 C++11 Language Features


