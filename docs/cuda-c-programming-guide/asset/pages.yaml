  md: "# Example\n\n```\n__device__ int result;\ntemplate <typename T>\n__global__\
    \ void kernel(T in) { result = in(); }\nvoid foo(void) {\n    int lam = 1;\n \
    \   auto lam_d = [=] __host__ __device__ {\n        #ifdef __CUDA_ARCH__\n   \
    \     // \"x\" is only captured when __CUDA_ARCH__ is defined.\n        return\
    \ x[1];\n        #else\n        return lam + 1;\n        #endif\n        return\
    \ 10;\n    }\n    kernel<<<1,1>>>(lam);\n}\n```\n\n14. As described previously,\
    \ the CUDA compiler replaces an extended `__device__` lambda expression with an\
    \ instance of a placeholder type in the code sent to the host compiler. This placeholder\
    \ type does not define a pointer-to-function conversion operator in host code,\
    \ however the conversion operator is provided in device code. Note that this restriction\
    \ does not apply to `__host__ __device__` extended lambdas.\n\n# Example\n\n```\n\
    template <typename T>\n__global__ void kern(T in)\n{\n    int (*fp)(double) =\
    \ in;\n    // OK: conversion in device code is supported\n    fp(0);\n    auto\
    \ lam1 = [] (double) { return 1; };\n    // OK: conversion in device code is supported\n\
    \    fp(lam1);\n}\nvoid foo(void)\n{\n    auto lam_d = [] __device__ (double)\
    \ { return 1; };\n    auto lam_hd = [] __host__ __device__ (double) { return 1;\
    \ };\n    kern<<<1,1>>>(lam_d);\n    kern<<<1,1>>>(lam_hd);\n    // OK : conversion\
    \ for __host__ __device__ lambda is supported\n    // in host code\n    int (*fp)(double)\
    \ = lam_hd;\n    // Error: conversion for __device__ lambda is not supported in\n\
    \    // host code.\n    int (*fp2)(double) = lam_d;\n}\n```\n\nThe CUDA compiler\
    \ will generate compiler diagnostics for a subset of cases described in 1-11;\
    \ no diagnostic will be generated for cases 12-15, but the host compiler may fail\
    \ to compile the generated code."
