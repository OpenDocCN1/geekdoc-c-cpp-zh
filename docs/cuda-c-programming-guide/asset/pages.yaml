  md: 'launched, the runtime guarantees an implicit synchronization between the parent
    and child.


    ![](img/c13b0ff67eed8f2c7b32afa2a587a8d6_211_0.png)


    # Figure 14 Parent-Child Launch Nesting


    # D.2.1.2. Scope of CUDA Primitives


    On both host and device, the CUDA runtime offers an API for launching kernels,
    for waiting for launched work to complete, and for tracking dependencies between
    launches via streams and events. On the host system, the state of launches and
    the CUDA primitives referencing streams and events are shared by all threads within
    a process; however processes execute independently and may not share CUDA objects.


    A similar hierarchy exists on the device: launched kernels and CUDA objects are
    visible to all threads in a thread block, but are independent between thread blocks.
    This means for example that a stream may be created by one thread and used by
    any other thread in the same thread block, but may not be shared with threads
    in any other thread block.


    # D.2.1.3. Synchronization


    CUDA runtime operations from any thread, including kernel launches, are visible
    across a thread block. This means that an invoking thread in the parent grid may
    perform synchronization on the grids launched by that thread, by other threads
    in the thread block, or on streams created within the same thread block. Execution
    of a thread block is not considered complete until all launches by all threads
    in the block have completed. If all threads in a block exit before all child launches
    have completed, a synchronization operation will be automatically triggered.


    # D.2.1.4. Streams and Events


    CUDA Streams and Events allow control over dependencies between grid launches:
    grids launched into the same stream execute in-order, and events may be used to
    create dependencies between streams. Streams and events created on the device
    serve this exact same purpose.'
