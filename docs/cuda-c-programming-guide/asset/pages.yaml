- pgno: 209
  md: '# D.1. Introduction


    # D.1.1. Overview


    Dynamic Parallelism is an extension to the CUDA programming model enabling a CUDA
    kernel to create and synchronize with new work directly on the GPU. The creation
    of parallelism dynamically at whichever point in a program that it is needed offers
    exciting new capabilities.


    The ability to create work directly from the GPU can reduce the need to transfer
    execution control and data between host and device, as launch configuration decisions
    can now be made at runtime by threads executing on the device. Additionally, data-dependent
    parallel work can be generated inline within a kernel at run-time, taking advantage
    of the GPU''s hardware schedulers and load balancers dynamically and adapting
    in response to data-driven decisions or workloads. Algorithms and programming
    patterns that had previously required modifications to eliminate recursion, irregular
    loop structure, or other constructs that do not fit a flat, single-level of parallelism
    may more transparently be expressed.


    This document describes the extended capabilities of CUDA which enable Dynamic
    Parallelism, including the modifications and additions to the CUDA programming
    model necessary to take advantage of these, as well as guidelines and best practices
    for exploiting this added capacity.


    Dynamic Parallelism is only supported by devices of compute capability 3.5 and
    higher.


    # D.1.2. Glossary


    Definitions for terms used in this guide.


    **Grid**


    A Grid is a collection of Threads. Threads in a Grid execute a Kernel Function
    and are divided into Thread Blocks.'
  merge: -1
  img_proc: true
- pgno: 210
  md: '**Thread Block**

    A Thread Block is a group of threads which execute on the same multiprocessor
    (SM). Threads within a Thread Block have access to shared memory and can be explicitly
    synchronized.


    **Kernel Function**

    A Kernel Function is an implicitly parallel subroutine that executes under the
    CUDA execution and memory model for every Thread in a Grid.


    **Host**

    The Host refers to the execution environment that initially invoked CUDA. Typically
    the thread running on a system''s CPU processor.


    **Parent**

    A *Parent Thread*, Thread Block, or Grid is one that has launched new grid(s),
    the *Child* Grid(s). The Parent is not considered completed until all of its launched
    Child Grids have also completed.


    **Child**

    A Child thread, block, or grid is one that has been launched by a Parent grid.
    A Child grid must complete before the Parent Thread, Thread Block, or Grid are
    considered complete.


    **Thread Block Scope**

    Objects with Thread Block Scope have the lifetime of a single Thread Block. They
    only have defined behavior when operated on by Threads in the Thread Block that
    created the object and are destroyed when the Thread Block that created them is
    complete.


    **Device Runtime**

    The Device Runtime refers to the runtime system and APIs available to enable Kernel
    Functions to use Dynamic Parallelism.


    # D.2. Execution Environment and Memory Model


    # D.2.1. Execution Environment


    The CUDA execution model is based on primitives of threads, thread blocks, and
    grids, with kernel functions defining the program executed by individual threads
    within a thread block and grid. When a kernel function is invoked the grid''s
    properties are described by an execution configuration, which has a special syntax
    in CUDA. Support for dynamic parallelism in CUDA extends the ability to configure,
    launch, and synchronize upon new grids to threads that are running on the device.


    # D.2.1.1. Parent and Child Grids


    A device thread that configures and launches a new grid belongs to the parent
    grid, and the grid created by the invocation is a child grid.


    The invocation and completion of child grids is properly nested, meaning that
    the parent grid is not considered complete until all child grids created by its
    threads have completed. Even if the invoking threads do not explicitly synchronize
    on the child grids'
  merge: -1
  img_proc: true
