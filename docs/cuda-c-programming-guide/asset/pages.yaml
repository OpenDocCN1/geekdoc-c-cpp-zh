- pgno: 212
  md: 'Streams and events created within a grid exist within thread block scope but
    have undefined behavior when used outside of the thread block where they were
    created. As described above, all work launched by a thread block is implicitly
    synchronized when the block exits; work launched into streams is included in this,
    with all dependencies resolved appropriately. The behavior of operations on a
    stream that has been modified outside of thread block scope is undefined.


    Streams and events created on the host have undefined behavior when used within
    any kernel, just as streams and events created by a parent grid have undefined
    behavior if used within a child grid.


    # ## D.2.1.5. Ordering and Concurrency


    The ordering of kernel launches from the device runtime follows CUDA Stream ordering
    semantics. Within a thread block, all kernel launches into the same stream are
    executed in-order. With multiple threads in the same thread block launching into
    the same stream, the ordering within the stream is dependent on the thread scheduling
    within the block, which may be controlled with synchronization primitives such
    as `__syncthreads()`.


    Note that because streams are shared by all threads within a thread block, the
    implicit `NULL` stream is also shared. If multiple threads in a thread block launch
    into the implicit stream, then these launches will be executed in-order. If concurrency
    is desired, explicit named streams should be used.


    Dynamic Parallelism enables concurrency to be expressed more easily within a program;
    however, the device runtime introduces no new concurrency guarantees within the
    CUDA execution model. There is no guarantee of concurrent execution between any
    number of different thread blocks on a device.


    The lack of concurrency guarantee extends to parent thread blocks and their child
    grids. When a parent thread block launches a child grid, the child is not guaranteed
    to begin execution until the parent thread block reaches an explicit synchronization
    point (e.g. `cudaDeviceSynchronize()`).


    While concurrency will often easily be achieved, it may vary as a function of
    device configuration, application workload, and runtime scheduling. It is therefore
    unsafe to depend upon any concurrency between different thread blocks.


    # ## D.2.1.6. Device Management


    There is no multi-GPU support from the device runtime; the device runtime is only
    capable of operating on the device upon which it is currently executing. It is
    permitted, however, to query properties for any CUDA capable device in the system.


    # ## D.2.2. Memory Model


    Parent and child grids share the same global and constant memory storage, but
    have distinct local and shared memory.'
