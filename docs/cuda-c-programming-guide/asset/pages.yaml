  md: "Here's the above example modified to use \"this\" capture mode:\n\n```\n#include\
    \ <cstdio>\n\ntemplate <typename T>\n__global__ void foo(T in) { printf(\"\\n\
    \ value = %d\", in()); }\n\nstruct S1_t {\n    int xxx;\n    __host__ __device__\
    \ S1_t(void) : xxx(10) { };\n\n    void doit(void) {\n        // note the \"*this\"\
    \ capture specification\n        auto lam1 = [=, *this] __device__ (\n       \
    \     // reference to \"xxx\" causes\n            // the object denoted by '*this'\
    \ to be captured by\n            // value, and the GPU code will access copy_of_star_this->xxx\n\
    \            return xxx + 1;\n        );\n\n        // Kernel launch succeeds\n\
    \        foo<<<1,1>>>(lam1);\n        cudaDeviceSynchronize();\n    }\n};\n\n\
    int main(void) {\n    S1_t sl;\n    sl.doit();\n}\n```"
