  md: '# B.6. Synchronization Functions


    ```

    void __syncthreads();

    ```


    waits until all threads in the thread block have reached this point and all global
    and shared memory accesses made by these threads prior to __syncthreads() are
    visible to all threads in the block.


    __syncthreads() is used to coordinate communication between the threads of the
    same block. When some threads within a block access the same addresses in shared
    or global memory, there are potential read-after-write, write-after-read, or write-after-write
    hazards for some of these memory accesses. These data hazards can be avoided by
    synchronizing threads in-between these accesses.


    __syncthreads() is allowed in conditional code but only if the conditional evaluates
    identically across the entire thread block, otherwise the code execution is likely
    to hang or produce unintended side effects.


    Devices of compute capability 2.x and higher support three variations of __syncthread()
    described below.


    ```

    int __syncthreads_count(int predicate);

    ```


    is identical to __syncthreads() with the additional feature that it evaluates
    predicate for all threads of the block and returns the number of threads for which
    predicate evaluates to non-zero.


    ```

    int __syncthreads_and(int predicate);

    ```


    is identical to __syncthreads() with the additional feature that it evaluates
    predicate for all threads of the block and returns non-zero if and only if predicate
    evaluates to non-zero for all of them.


    ```

    int __syncthreads_or(int predicate);

    ```


    is identical to __syncthreads() with the additional feature that it evaluates
    predicate for all threads of the block and returns non-zero if and only if predicate
    evaluates to non-zero for any of them.


    ```

    void __syncwarp(unsigned mask=0xFFFFFFFF);

    ```


    will cause the executing thread to wait until all warp lanes named in mask have
    executed a __syncwarp() (with the same mask) before resuming execution. All non-executed
    threads named in mask must execute a corresponding __syncwarp() with the same
    mask, or the result is undefined.


    Executing __syncwarp() guarantees memory ordering among threads participating
    in the barrier. Thus, threads within a warp that wish to communicate via memory
    can store'
