    # 3.3.5.2. Mapping buffers onto imported memory objects


    A device pointer can be mapped onto an imported memory object as shown below:

    The offset and size of the mapping can be filled as per the attributes of the
    allocated

    NvSciBufObj. All mapped device pointers must be freed using cudaFree().


    ```

    void * mapBufferOntoExternalMemory(cudaExternalMemory_t extMem, unsigned long

    long offset, unsigned long size) {

    void *ptr = NULL;

    cudaExternalMemoryBufferDesc desc = ();

    memset(&desc, 0, sizeof(desc));

    desc.offset = offset;

    desc.size = size;

    cudaExternalMemoryGetMappedBuffer(&ptr, extMem, &desc);

    // Note: ''ptr'' must eventually be freed using cudaFree()

    return ptr;

    }

    ```


