- pgno: 283
  md: "\"this\" capture mode is not allowed for unannotated lambdas defined in host\
    \ code, or for extended __host__ __device__ lambdas. Examples of supported and\
    \ unsupported usage:\n\n```\nstruct S1_t {\n    int xxx;\n    __host__ __device__\
    \ S1_t(void) : xxx(10) { };\n};\n\nvoid host_func(void) {\n    // OK: use in an\
    \ extended __device__ lambda\n    auto lam1 = [=, *this] __device__ { return xxx;\
    \ };\n\n    // Error: use in an extended __host__ __device__ lambda\n    auto\
    \ lam2 = [=, *this] __host__ __device__ { return xxx; };\n\n    // Error: use\
    \ in an unannotated lambda in a host function\n    auto lam3 = [=, *this] { return\
    \ xxx; };\n}\n\n__device__ void device_func(void) {\n    // OK: use in a lambda\
    \ defined in a __device__ function\n    auto lam1 = [=, *this] __device__ { return\
    \ xxx; };\n\n    // OK: use in a lambda defined in a __device__ function\n   \
    \ auto lam2 = [=, *this] __host__ __device__ { return xxx; };\n\n    // OK: use\
    \ in a lambda defined in a __device__ function\n    auto lam3 = [=, *this] { return\
    \ xxx; };\n}\n\n__host__ __device__ void host_device_func(void) {\n    // OK:\
    \ use in an extended __device__ lambda\n    auto lam1 = [=, *this] __device__\
    \ { return xxx; };\n\n    // Error: use in an extended __host__ __device__ lambda\n\
    \    auto lam2 = [=, *this] __host__ __device__ { return xxx; };\n\n    // Error:\
    \ use in an unannotated lambda in a __host__ __device__ function\n    auto lam3\
    \ = [=, *this] { return xxx; };\n};\n```\n\n# F.5.5. Additional Notes\n\n1. **ADL\
    \ Lookup:** As described earlier, the CUDA compiler will replace an extended lambda\
    \ expression with an instance of a placeholder type, before invoking the host\
    \ compiler. One template argument of the placeholder type uses the address of\
    \ the function enclosing the original lambda expression. This may cause additional\
    \ namespaces to participate in argument dependent lookup (ADL), for any host function\
    \ call whose argument types involve the closure type of the extended lambda expression.\
    \ This may cause an incorrect function to be selected by the host compiler."
  merge: -1
  img_proc: true
- pgno: 284
  md: "# Example:\n\n```\n```cpp\nnamespace N1 {\n  struct S1_t {\n    template <typename\
    \ T> void foo(T);\n  };\n}\n\nnamespace N2 {\n  template <typename T> int foo(T);\n\
    \n  template <typename T> void doit(T in) { foo(in); }\n}\n\nvoid bar(N1::S1_t\
    \ in)\n{\n  /* extended __device__ lambda. In the code sent to the host compiler,\n\
    \     this is replaced with the placeholder type instantiation expression\n  \
    \   '__nv_dl_wrapper_t< __nv_dl_tag<void (*)(N1::S1_t in), (lbar).1> > ()'\n \
    \ */\n\n  // As a result, the namespace 'N1' participates in ADL lookup of the\n\
    \  /* call to \"foo\" in the body of N2::doit, causing ambiguity.\n  */\n  auto\
    \ lam1 = [] __device__ () {};\n  N2::doit(lam1);\n}\n```\n```\n\nIn the example\
    \ above, the CUDA compiler replaced the extended lambda with a placeholder type\
    \ that involves the N1 namespace. As a result, the namespace N1 participates in\
    \ the ADL lookup for foo(in) in the body of N2::doit, and host compilation fails\
    \ because multiple overload candidates N1::foo and N2::foo are found."
