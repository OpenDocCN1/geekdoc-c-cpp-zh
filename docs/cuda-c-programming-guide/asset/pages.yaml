    \ streams overlap in this example depending on the capability of the device. Note\
    \ that hostPtr must point to page-locked host memory for any overlap to occur.\n\
    \nStreams are released by calling cudaStreamDestroy().\n\n```\nfor (int i = 0;\
    \ i < 2; ++i)\n    cudaStreamDestroy(stream[i]);\n```\n\nIn case the device is\
    \ still doing work in the stream when cudaStreamDestroy() is called, the function\
    \ will return immediately and the resources associated with the stream will be\
    \ released automatically once the device has completed all work in the stream.\n\
    \n# 3.2.5.5.2. Default Stream\n\nKernel launches and host <-> device memory copies\
    \ that do not specify any stream parameter, or equally that set the stream parameter\
