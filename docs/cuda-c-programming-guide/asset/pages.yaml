    \ no explicit execution space annotations\n    auto lam1 = [] {};\n\n    // extended\
    \ __device__ lambda\n    auto lam2 = [] __device__ {};\n\n    // extended __host__\
    \ __device__ lambda\n    auto lam3 = [] __host__ __device__ {};\n\n    // not\
    \ an extended lambda: explicitly annotated with only '__host__'\n    auto lam4\
    \ = [] __host__ {};\n}\n\nhost__device__ void foo__host_device(void)\n{\n    //\
    \ not an extended lambda: no explicit execution space annotations\n    auto lam1\
    \ = [] {};\n\n    // extended __device__ lambda\n    auto lam2 = [] __device__\
    \ {};\n\n    // extended __host__ __device__ lambda\n    auto lam3 = [] __host__\
    \ __device__ {};\n\n    // not an extended lambda: explicitly annotated with only\
    \ '__host__'\n    auto lam4 = [] __host__ {};\n}\n\ndevice__ void foo__device(void)\n\
    {\n    // none of the lambdas within this function are extended lambdas,\n   \
    \ // because the enclosing function is not a __host__ or __host__ __device__\n\
    \    // function.\n    auto lam1 = [] {};\n    auto lam2 = [] __device__ {};\n\
    \    auto lam3 = [] __host__ __device__ {};\n    auto lam4 = [] __host__ {};\n\
    }\n\n// lam1 and lam2 are not extended lambdas because they are not defined\n\
    // within a host__ or __host__ __device__ function.\nauto lam1 = [] {};\nauto\
    \ lam2 = [] __host__ __device__ {};\n```\n\n# F.5.1. Extended Lambda Type Traits\n\
    \nThe compiler provides type traits to detect closure types for extended lambdas\
    \ at compile time:\n\n__nv_is_extended_device_lambda_closure_type(type): If 'type'\
    \ is the closure class created for an extended __device__ lambda, then the trait\
    \ is true, otherwise it is false.\n\n__nv_is_extended_host_device_lambda_closure_type(type):\
    \ If 'type' is the closure class created for an extended __host__ __device__ lambda,\
    \ then the trait is true, otherwise it is false."
