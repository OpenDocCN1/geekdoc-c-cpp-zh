    The portions of the CUDA Runtime API supported in the device runtime are detailed
    here. Host and device runtime APIs have identical syntax; semantics are the same
    except where indicated. The table below provides an overview of the API relative
    to the version available from the host.


    # Table 6 Supported API Functions


    | Runtime API Functions | Details |

    | :--- | :--- |

    | cudaDeviceSynchronize | Synchronizes on work launched from thread''s own block
    only |

    | cudaDeviceGetCacheConfig | |

    | cudaDeviceGetLimit | |

    | cudaGetLastError | Last error is per-thread state, not per-block state |'
