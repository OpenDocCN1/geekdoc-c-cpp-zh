    \ or the CUDA_API_PER_THREAD_DEFAULT_STREAM macro needs to be defined with the\
    \ -DCUDA_API_PER_THREAD_DEFAULT_STREAM=1 compiler flag\n\nFor code that is compiled\
    \ using the --default-stream legacy compilation flag, the default stream is a\
    \ special stream called the NULL stream and each device has a single NULL stream\
