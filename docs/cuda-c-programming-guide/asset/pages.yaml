- pgno: 133
  md: '# Shared Memory


    Because it is on-chip, shared memory has much higher bandwidth and much lower
    latency than local or global memory.


    To achieve high bandwidth, shared memory is divided into equally-sized memory
    modules, called banks, which can be accessed simultaneously. Any memory read or
    write request made of n addresses that fall in n distinct memory banks can therefore
    be serviced simultaneously, yielding an overall bandwidth that is n times as high
    as the bandwidth of a single module.


    However, if two addresses of a memory request fall in the same memory bank, there
    is a bank conflict and the access has to be serialized. The hardware splits a
    memory request with bank conflicts into as many separate conflict-free requests
    as necessary, decreasing throughput by a factor equal to the number of separate
    memory requests. If the number of separate memory requests is n, the initial memory
    request is said to cause n-way bank conflicts.


    To get maximum performance, it is therefore important to understand how memory
    addresses map to memory banks in order to schedule the memory requests so as to
    minimize bank conflicts. This is described in Compute Capability 3.x, Compute
    Capability 5.x, Compute Capability 6.x, and Compute Capability 7.x for devices
    of compute capability 3.x, 5.x, 6.x and 7.x, respectively.


    # Constant Memory


    The constant memory space resides in device memory and is cached in the constant
    cache.


    A request is then split into as many separate requests as there are different
    memory addresses in the initial request, decreasing throughput by a factor equal
    to the number of separate requests.


    The resulting requests are then serviced at the throughput of the constant cache
    in case of a cache hit, or at the throughput of device memory otherwise.


    # Texture and Surface Memory


    The texture and surface memory spaces reside in device memory and are cached in
    texture cache, so a texture fetch or surface read costs one memory read from device
    memory only on a cache miss, otherwise it just costs one read from texture cache.
    The texture cache is optimized for 2D spatial locality, so threads of the same
    warp that read texture or surface addresses that are close together in 2D will
    achieve best performance. Also, it is designed for streaming fetches with a constant
    latency; a cache hit reduces DRAM bandwidth demand but not fetch latency.'
  merge: -1
  img_proc: true
- pgno: 134
  md: 'Reading device memory through texture or surface fetching present some benefits
    that can make it an advantageous alternative to reading device memory from global
    or constant memory:


    +   - If the memory reads do not follow the access patterns that global or constant
    memory reads must follow to get good performance, higher bandwidth can be achieved
    providing that there is locality in the texture fetches or surface reads;

    +   - Addressing calculations are performed outside the kernel by dedicated units;

    +   - Packed data may be broadcast to separate variables in a single operation;

    +   - 8-bit and 16-bit integer input data may be optionally converted to 32 bit
    floating-point values in the range [0.0, 1.0] or [-1.0, 1.0] (see Texture Memory).


    # 5.4. Maximize Instruction Throughput


    To maximize instruction throughput the application should:


    +   - Minimize the use of arithmetic instructions with low throughput; this includes
    trading precision for speed when it does not affect the end result, such as using
    intrinsic instead of regular functions (intrinsic functions are listed in Intrinsic
    Functions), single-precision instead of double-precision, or flushing denormalized
    numbers to zero;

    +   - Minimize divergent warps caused by control flow instructions as detailed
    in Control Flow Instructions

    +   - Reduce the number of instructions, for example, by optimizing out synchronization
    points whenever possible as described in Synchronization Instruction or by using
    restricted pointers as described in __restrict__.


    In this section, throughputs are given in number of operations per clock cycle
    per multiprocessor. For a warp size of 32, one instruction corresponds to 32 operations,
    so if N is the number of operations per clock cycle, the instruction throughput
    is N/32 instructions per clock cycle.


    All throughputs are for one multiprocessor. They must be multiplied by the number
    of multiprocessors in the device to get throughput for the whole device.


    # 5.4.1. Arithmetic Instructions


    Table 3 gives the throughputs of the arithmetic instructions that are natively
    supported in hardware for devices of various compute capabilities.


    # Table 3 Throughput of Native Arithmetic Instructions


    (Number of Results per Clock Cycle per Multiprocessor)'
