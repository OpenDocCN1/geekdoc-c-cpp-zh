  md: "# Example:\n\n```\nvoid foo(void) {\n    // enclosing function for lam1 is\
    \ \"foo\"\n    auto lam1 = [] __device__ ();\n\n    auto lam2 = [] {\n       \
    \ auto lam3 = [] {\n            // enclosing function for lam4 is \"foo\"\n  \
    \          auto lam4 = [] __host__ __device__ ();\n        };\n    };\n}\n\nauto\
    \ lam6 = [] {\n    // enclosing function for lam7 does not exist\n    auto lam7\
    \ = [] __host__ __device__ ();\n};\n```\n\nHere are the restrictions on extended\
    \ lambdas:\n\n+   1. An extended lambda cannot be defined inside another extended\
    \ lambda expression.\n\n# Example:\n\n```\nvoid foo(void) {\n    auto lam1 = []\
    \ __host__ __device__ {\n        // error: extended lambda defined within another\
    \ extended lambda\n        auto lam2 = [] __host__ __device__ ();\n    };\n}\n\
    ```\n\n+   2. An extended lambda cannot be defined inside a generic lambda expression.\n\
    \n# Example:\n\n```\nvoid foo(void) {\n    auto lam1 = [] (auto) {\n        //\
    \ error: extended lambda defined within a generic lambda\n        auto lam2 =\
    \ [] __host__ __device__ ();\n    };\n}\n```\n\n+   3. If an extended lambda is\
    \ defined within the immediate or nested block scope of one or more nested lambda\
    \ expression, the outermost such lambda expression must be defined inside the\
    \ immediate or nested block scope of a function.\n\n# Example:\n\n```\nauto lam1\
    \ = [] {\n    // error: outer enclosing lambda is not defined within a\n    //\
    \ non-lambda-operator() function.\n    auto lam2 = [] __host__ __device__ ();\n\
    };\n```\n\n+   4. The enclosing function for the extended lambda must be named\
    \ and its address can be taken. If the enclosing function is a class member, then\
    \ the following conditions must be satisfied:\n\n+   ▸ All classes enclosing the\
    \ member function must have a name.\n\n+   ▸ The member function must not have\
    \ private or protected access within its parent class.\n\n+   ▸ All enclosing\
    \ classes must not have private or protected access within their respective parent\
    \ classes."
