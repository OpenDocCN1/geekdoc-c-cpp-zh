  md: '# D.3.1.6.1. Device and Constant Memory


    Memory declared at file scope with `__device__` or `__constant__` memory space
    specifiers behaves identically when using the device runtime. All kernels may
    read or write device variables, whether the kernel was initially launched by the
    host or device runtime. Equivalently, all kernels will have the same view of `__constant__`s
    as declared at the module scope.


    # D.3.1.6.2. Textures & Surfaces


    CUDA supports dynamically created texture and surface objects¹, where a texture
    reference may be created on the host, passed to a kernel, used by that kernel,
    and then destroyed from the host. The device runtime does not allow creation or
    destruction of texture or surface objects from within device code, but texture
    and surface objects created from the host may be used and passed around freely
    on the device. Regardless of where they are created, dynamically created texture
    objects are always valid and may be passed to child kernels from a parent.


    > The device runtime does not support legacy module-scope (i.e., Fermi-style)
    textures and surfaces within a kernel launched from the device. Module-scope (legacy)
    textures may be created from the host and used in device code as for any kernel,
    but may only be used by a top-level kernel (i.e., the one which is launched from
    the host).


    # D.3.1.6.3. Shared Memory Variable Declarations


    In CUDA C++ shared memory can be declared either as a statically sized file-scope
    or function-scoped variable, or as an `extern` variable with the size determined
    at runtime by the kernel’s caller via a launch configuration argument. Both types
    of declarations are valid under the device runtime.


    ¹ Dynamically created texture and surface objects are an addition to the CUDA
    memory model introduced with CUDA 5.0. Please see the CUDA Programming Guide for
    details.'
