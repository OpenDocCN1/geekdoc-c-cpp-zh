    # ## 3.2. CUDA Runtime


    The runtime is implemented in the **cudart** library, which is linked to the application,
    either statically via **cudart.lib** or **libcudart.a**, or dynamically via **cudart.dll**
    or **libcudart.so**. Applications that require **cudart.dll** and/or **cudart.so**
    for dynamic linking typically include them as part of the application installation
    package. It is only safe to pass the address of CUDA runtime symbols between components
    that link to the same instance of the CUDA runtime.


    All its entry points are prefixed with **cuda**.


    As mentioned in Heterogeneous Programming, the CUDA programming model assumes
    a system composed of a host and a device, each with their own separate memory.
    Device Memory gives an overview of the runtime functions used to manage device
    memory.


    Shared Memory illustrates the use of shared memory, introduced in Thread Hierarchy,
    to maximize performance.


    Page-Locked Host Memory introduces page-locked host memory that is required to
    overlap kernel execution with data transfers between host and device memory.


    Asynchronous Concurrent Execution describes the concepts and API used to enable
    asynchronous concurrent execution at various levels in the system.


    Multi-Device System shows how the programming model extends to a system with multiple
    devices attached to the same host.


    Error Checking describes how to properly check the errors generated by the runtime.


    Call Stack mentions the runtime functions used to manage the CUDA C++ call stack.


    Texture and Surface Memory presents the texture and surface memory spaces that
    provide another way to access device memory; they also expose a subset of the
    GPU texturing hardware.


    Graphics Interoperability introduces the various functions the runtime provides
    to interoperate with the two main graphics APIs, OpenGL and Direct3D.


