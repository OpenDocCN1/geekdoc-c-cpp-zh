    # D.4.3.1.5. Memory Allocation and Lifetime


    cudaMalloc() and cudaFree() have distinct semantics environments. When invoked
    from the host, cudaMalloc() allocates a new region from unused device memory.
    When invoked from the device runtime these functions map to device-side malloc()
    and free(). This implies that within the device environment the total allocatable
    memory is limited to the device malloc() heap size, which may be smaller than
    the available unused device memory. Also, it is an error to invoke cudaFree()
    from the host program on a pointer which was allocated by cudaMalloc() on the
    device or vice-versa.


    | | cudaMalloc() on Host | cudaMalloc() on Device |

    |---|---|---|

    | cudaFree() on Host | Supported | Not Supported |

    | cudaFree() on Device | Not Supported | Supported |

    | Allocation limit | Free device memory | cudaLimitMallocHeapSize |


    # D.4.3.1.6. SM Id and Warp Id


    Note that in PTX %smid and %warpid are defined as volatile values. The device
    runtime may reschedule thread blocks onto different SMs in order to more efficiently
    manage resources. As such, it is unsafe to rely upon %smid or %warpid remaining
    unchanged across the lifetime of a thread or thread block.


    # D.4.3.1.7. ECC Errors


    No notification of ECC errors is available to code within a CUDA kernel. ECC errors
    are reported at the host side once the entire launch tree has completed. Any ECC
    errors which arise during execution of a nested program will either generate an
    exception or continue execution (depending upon error and configuration).'
