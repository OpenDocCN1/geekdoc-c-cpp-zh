  md: '# Appendix C. COOPERATIVE GROUPS


    # C.1. Introduction


    Cooperative Groups is an extension to the CUDA programming model, introduced in
    CUDA 9, for organizing groups of communicating threads. Cooperative Groups allows
    developers to express the granularity at which threads are communicating, helping
    them to express richer, more efficient parallel decompositions.


    Historically, the CUDA programming model has provided a single, simple construct
    for synchronizing cooperating threads: a barrier across all threads of a thread
    block, as implemented with the `__syncthreads ()` intrinsic function. However,
    programmers would like to define and synchronize groups of threads at other granularities
    to enable greater performance, design flexibility, and software reuse in the form
    of "collective" group-wide function interfaces. In an effort to express broader
    patterns of parallel interaction, many performance-oriented programmers have resorted
    to writing their own ad hoc and unsafe primitives for synchronizing threads within
    a single warp, or across sets of thread blocks running on a single GPU. Whilst
    the performance improvements achieved have often been valuable, this has resulted
    in an ever-growing collection of brittle code that is expensive to write, tune,
    and maintain over time and across GPU generations. Cooperative Groups addresses
    this by providing a safe and future-proof mechanism to enable performant code.


    The Cooperative Groups programming model extension describes synchronization patterns
    both within and across CUDA thread blocks. It provides both the means for applications
    to define their own groups of threads, and the interfaces to synchronize them.
    It also provides new launch APIs that enforce certain restrictions and therefore
    can guarantee the synchronization will work. These primitives enable new patterns
    of cooperative parallelism within CUDA, including producer-consumer parallelism,
    opportunistic parallelism, and global synchronization across the entire Grid.


    The execution of groups as first-class program objects improves software composition,
    since collective functions can receive an explicit object representing the group
    of participating threads. This object also makes programmer intent explicit, which
    eliminates unsound architectural assumptions that result in brittle code, undesirable'
  merge: -1
  img_proc: true
- pgno: 201
  md: 'restrictions upon compiler optimizations, and better compatibility with new
    GPU generations.


    The Cooperative Groups programming model consists of the following elements:


    +   - data types for representing groups of cooperating threads;

    +   - operations to obtain intrinsic groups defined by the CUDA launch API (e.g.,
    thread blocks);

    +   - operations for partitioning existing groups into new groups;

    +   - a barrier operation to synchronize a given group;

    +   - and operations to inspect the group properties as well as group-specific
    collectives.


    # ## C.2. Intra-block Groups


    In this section we describe the functionality available to create groups of threads
    within a thread block that can synchronize and collaborate. Note that the use
    of Cooperative Groups for synchronization across thread blocks or devices requires
    some additional considerations, as described later.


    Cooperative Groups requires CUDA 9.0 or later. To use Cooperative Groups, include
    the header file:


    ```

    #include <cooperative_groups.h>

    ```


    and use the Cooperative Groups namespace:


    ```

    using namespace cooperative_groups;

    ```


    Then code containing any intra-block Cooperative Groups functionality can be compiled
    in the normal way using nvcc.


    # ## C.2.1. Thread Groups and Thread Blocks


    Any CUDA programmer is already familiar with a certain group of threads: the thread
    block. The Cooperative Groups extension introduces a new datatype, `thread_block`,
    to explicitly represent this concept within the kernel. The group can be initialized
    as follows:


    ```

    thread_block g = this_thread_block();

    ```


    The `thread_block` datatype is derived from the more generic `thread_group` datatype,
    which can be used to represent a wider class of groups. `thread_group` provides
    the following functionality:


    ```

    void sync(); // Synchronize the threads in the group

    unsigned size(); // Total number of threads in the group

    unsigned thread_rank(); // Rank of the calling thread within [0, size)

    bool is_valid(); // Whether the group violated any API constraints

    ```


    whereas `thread_block` provides the following additional block-specific functionality:


    ```

