  md: 'Threads may only read data from another thread which is actively participating
    in the `__shfl_sync()` command. If the target thread is inactive, the retrieved
    value is undefined.


    All of the `__shfl_sync()` intrinsics take an optional `width` parameter which
    alters the behavior of the intrinsic. `width` must have a value which is a power
    of 2; results are undefined if `width` is not a power of 2, or is a number greater
    than `warpSize`.


    `__shfl_sync()` returns the value of `var` held by the thread whose ID is given
    by `srcLane`. If `width` is less than `warpSize` then each subsection of the warp
    behaves as a separate entity with a starting logical lane ID of 0. If `srcLane`
    is outside the range `[0:width-1]`, the value returned corresponds to the value
    of `var` held by the `srcLane` modulo `width` (i.e. within the same subsection).


    `__shfl_up_sync()` calculates a source lane ID by subtracting `delta` from the
    caller''s lane ID. The value of `var` held by the resulting lane ID is returned:
    in effect, `var` is shifted up the warp by `delta` lanes. If `width` is less than
    `warpSize` then each subsection of the warp behaves as a separate entity with
    a starting logical lane ID of 0. The source lane index will not wrap around the
    value of `width`, so effectively the lower `delta` lanes will be unchanged.


    `__shfl_down_sync()` calculates a source lane ID by adding `delta` to the caller''s
    lane ID. The value of `var` held by the resulting lane ID is returned: this has
    the effect of shifting `var` down the warp by `delta` lanes. If `width` is less
    than `warpSize` then each subsection of the warp behaves as a separate entity
    with a starting logical lane ID of 0. As for `__shfl_up_sync()`, the ID number
    of the source lane will not wrap around the value of `width` and so the upper
    `delta` lanes will remain unchanged.


    `__shfl_xor_sync()` calculates a source lane ID by performing a bitwise XOR of
    the caller''s lane ID with `laneMask`: the value of `var` held by the resulting
    lane ID is returned. If `width` is less than `warpSize` then each group of `width`
    consecutive threads are able to access elements from earlier groups of threads,
    however if they attempt to access elements from later groups of threads their
    own value of `var` will be returned. This mode implements a butterfly addressing
    pattern such as is used in tree reduction and broadcast.


    The new `*_sync` shfl intrinsics take in a mask indicating the threads participating
    in the call. A bit, representing the thread''s lane id, must be set for each participating
    thread to ensure they are properly converged before the intrinsic is executed
    by the hardware. All non-exited threads named in mask must execute the same intrinsic
    with the same mask, or the result is undefined.


    # B.16.3. Notes


    Threads may only read data from another thread which is actively participating
    in the `__shfl_sync()` command. If the target thread is inactive, the retrieved
    value is undefined.'
