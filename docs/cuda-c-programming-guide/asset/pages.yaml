  md: "# K.2.1.2. Global-Scope Managed Variables Using __managed__\n\nFile-scope and\
    \ global-scope CUDA __device__ variables may also opt-in to Unified Memory management\
    \ by adding a new __managed__ annotation to the declaration. These may then be\
    \ referenced directly from either host or device code, as follows:\n\n```\n__device__\
    \ __managed__ int x[2];\n__device__ __managed__ int y;\n__global__ void kernel()\
    \ {\n    x[1] = x[0] + y;\n}\nint main() {\n    x[0] = 3;\n    y = 5;\n    kernel<<<1,\
    \ 1 >>>();\n    cudaDeviceSynchronize();\n    printf(\"result = %d\\n\", x[1]);\n\
    \    return 0;\n}\n```\n\nAll semantics of the original __device__ memory space,\
    \ along with some additional unified-memory-specific constraints, are inherited\
    \ by the managed variable (see Compilation with NVCC).\n\nNote that variables\
    \ marked __constant__ may not also be marked as __managed__; this annotation is\
    \ reserved for __device__ variables only. Constant memory must be set either statically\
    \ at compile time or by using cudaMemcpyToSymbol() as usual in CUDA.\n\n# K.2.2.\
    \ Coherency and Concurrency\n\nSimultaneous access to managed memory on devices\
    \ of compute capability lower than 6.x is not possible, because coherence could\
    \ not be guaranteed if the CPU accessed a Unified Memory allocation while a GPU\
    \ kernel was active. However, devices of compute capability 6.x on supporting\
    \ operating systems allow the CPUs and GPUs to access Unified Memory allocations\
    \ simultaneously via the new page faulting mechanism. A program can query whether\
    \ a device supports concurrent access to managed memory by checking a new concurrentManagedAccess\
    \ property. Note, as with any parallel application, developers need to ensure\
    \ correct synchronization to avoid data hazards between processors.\n\n# K.2.2.1.\
    \ GPU Exclusive Access To Managed Memory\n\nTo ensure coherency on pre-6.x GPU\
    \ architectures, the Unified Memory programming model puts constraints on data\
    \ accesses while both the CPU and GPU are executing concurrently. In effect, the\
    \ GPU has exclusive access to all managed data while any kernel operation is executing,\
    \ regardless of whether the specific kernel is actively using the data. When managed\
    \ data is used with cudaMemcpy*() or cudaMemset*(), the system may choose to access\
    \ the source or destination from the host or the device, which will put constraints\
    \ on concurrent CPU access to that data while the cudaMemcpy*() or cudaMemset*()\
    \ is executing. See Memcpy()/Memset() Behavior With Managed Memory for further\
    \ details.\n\nIt is not permitted for the CPU to access any managed allocations\
    \ or variables while the GPU is active for devices with concurrentManagedAccess\
    \ property set to 0. On these"
