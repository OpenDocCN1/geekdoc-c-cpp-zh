    # K.1.8. Access Counters


    Devices of compute capability 7.0 introduce a new Access Counter feature that
    keeps track of the frequency of access that a GPU makes to memory located on other
    processors. Access Counters help ensure memory pages are moved to the physical
    memory of the processor that is accessing the pages most frequently. The Access
    Counters feature can guide migrations between CPU and GPU, and between peer GPUs.


    For `cudaMallocManaged`, Access Counters migration can be opt-in by using `cudaMemAdviseSetAccessedBy`
    hint with the corresponding device id. The driver may also use Access Counters
    for more efficient thrashing mitigation or memory oversubscription scenarios.


    > Access Counters are currently enabled only on IBM Power9 systems and only for
    the `cudaMallocManaged` allocator.


    # K.2. Programming Model


    # K.2.1. Managed Memory Opt In


    Most platforms require a program to opt in to automatic data management by either
    annotating a `__device__` variable with the `__managed__` keyword (see the Language
    Integration section) or by using a new `cudaMallocManaged()` call to allocate
    data.


    Devices of compute capability lower than 6.x must always allocate managed memory
    on the heap, either with an allocator or by declaring global storage. It is not
    possible either to associate previously allocated memory with Unified Memory,
    or to have the Unified Memory system manage a CPU or a GPU stack pointer.


    Starting with CUDA 8.0 and on supporting systems with devices of compute capability
    6.x, memory allocated with the default OS allocator (e.g. `malloc` or `new`) can
    be accessed from both GPU code and CPU code using the same pointer. On these systems,
    Unified Memory is the default: there is no need to use a special allocator or
    the creation of a specially managed memory pool.'
