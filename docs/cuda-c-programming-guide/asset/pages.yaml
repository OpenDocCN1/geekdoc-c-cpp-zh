    \ the one specified. The corresponding wait that waits on this signal must be\
    \ issued in Direct3D 12. Additionally, the wait that waits on this signal must\
    \ be issued after this signal has been issued.\n\n```\n```cpp\nvoid signalExternalSemaphore(cudaExternalSemaphore_t\
    \ extSem, unsigned long long value, cudaStream_t stream) {\n cudaExternalSemaphoreSignalParams\
    \ params = {};\n memset(&params, 0, sizeof(params));\n params.params.fence.value\
    \ = value;\n cudaSignalExternalSemaphoresAsync(&extSem, &params, 1, stream);\n\
    }\n```\n```\n\nAn imported Direct3D 12 fence object can be waited on as shown\
    \ below. Waiting on such a fence object waits until its value becomes greater\
    \ than or equal to the specified value."
