- pgno: 49
  md: '# 3.2.5.5.5.3. Explicit Synchronization


    There are various ways to explicitly synchronize streams with each other.


    **cudaDeviceSynchronize()** waits until all preceding commands in all streams
    of all host threads have completed.


    **cudaStreamSynchronize()** takes a stream as a parameter and waits until all
    preceding commands in the given stream have completed. It can be used to synchronize
    the host with a specific stream, allowing other streams to continue executing
    on the device.


    **cudaStreamWaitEvent()** takes a stream and an event as parameters (see Events
    for a description of events) and makes all the commands added to the given stream
    after the call to **cudaStreamWaitEvent()** delay their execution until the given
    event has completed.


    **cudaStreamQuery()** provides applications with a way to know if all preceding
    commands in a stream have completed.


    # 3.2.5.5.5.4. Implicit Synchronization


    Two commands from different streams cannot run concurrently if any one of the
    following operations is issued in-between them by the host thread:


    +   - a page-locked host memory allocation,

    +   - a device memory allocation,

    +   - a device memory set,

    +   - a memory copy between two addresses to the same device memory,

    +   - any CUDA command to the NULL stream,

    +   - a switch between the L1/shared memory configurations described in Compute
    Capability 3.x and Compute Capability 7.x.


    For devices that support concurrent kernel execution and are of compute capability
    3.0 or lower, any operation that requires a dependency check to see if a streamed
    kernel launch is complete:


    +   - Can start executing only when all thread blocks of all prior kernel launches
    from any stream in the CUDA context have started executing;

    +   - Blocks all later kernel launches from any stream in the CUDA context until
    the kernel launch being checked is complete.


    Operations that require a dependency check include any other commands within the
    same stream as the launch being checked and any call to **cudaStreamQuery()**
    on that stream. Therefore, applications should follow these guidelines to improve
    their potential for concurrent kernel execution:


    +   - All independent operations should be issued before dependent operations,

    +   - Synchronization of any kind should be delayed as long as possible.'
