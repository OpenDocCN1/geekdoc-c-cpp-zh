    # F.3. Restrictions


    # F.3.1. Host Compiler Extensions


    Host compiler specific language extensions are not supported in device code.


    __int128 and __Complex types are only supported in host code.


    __float128 type is only supported in host code on 64-bit x86 Linux platforms.
    A constant expression of __float128 type may be processed by the compiler in a
    floating point representation with lower precision.'
