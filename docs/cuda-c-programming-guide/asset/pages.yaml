  md: "# Example:\n\n```\n#include <cstdio>\n\ntemplate <typenameame T>\n__global__\
    \ void foo(T in) { printf(\"\\n value = %d\", in()); }\n\nstruct S1_t {\n    int\
    \ xxx;\n    __host__ __device__ S1_t(void) : xxx(10) {};\n\n    void doit(void)\
    \ {\n        auto lam1 = [=] device {\n        // reference to \"xxx\" causes\n\
    \        // the \"this\" pointer (S1_t*) to be captured by value\n        return\
    \ xxx + 1;\n        };\n\n        // Kernel launch fails at run time because 'this->xxx'\n\
    \        // is not accessible from the GPU\n        foo<<<1,1>>>(lam1);\n    \
    \    cudaDeviceSynchronize();\n    };\n};\n\nint main(void) {\n    S1_t s1;\n\
    \    s1.doit();\n}\n```\n\nC++17 solves this problem by adding a new \"this\"\
    \ capture mode. In this mode, the compiler makes a copy of the object denoted\
    \ by \"this\" instead of capturing the pointer this by value. The \"this\" capture\
    \ mode is described in more detail here: http://www.open-std.org/jtc1/sc22/wg21/docs/papers/2016/p0018r3.html\
    \ .\n\nThe CUDA compiler supports the \"this\" capture mode for lambdas defined\
    \ within __device__ and __global__ functions and for extended __device__ lambdas\
    \ defined in host code, when the --extended-lambda nvcc flag is used."
