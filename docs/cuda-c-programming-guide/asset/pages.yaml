  md: '# 3.2.5.5.5. Overlapping Behavior


    The amount of execution overlap between two streams depends on the order in which
    the commands are issued to each stream and whether or not the device supports
    overlap of data transfer and kernel execution (see Overlap of Data Transfer and
    Kernel Execution), concurrent kernel execution (see Concurrent Kernel Execution),
    and/or concurrent data transfers (see Concurrent Data Transfers).


    For example, on devices that do not support concurrent data transfers, the two
    streams of the code sample of Creation and Destruction do not overlap at all because
    the memory copy from host to device is issued to stream[1] after the memory copy
    from device to host is issued to stream[0], so it can only start once the memory
    copy from device to host issued to stream[0] has completed. If the code is rewritten
    the following way (and assuming the device supports overlap of data transfer and
    kernel execution)


    ```

    for (int i = 0; i < 2; ++i)

    cudaMemcpyAsync(inputDevPtr + i * size, hostPtr + i * size,

    size, cudaMemcpyHostToDevice, stream[i]);

    for (int i = 0; i < 2; ++i)

    MyKernel<<<100, 512, 0, stream[i]>>>

    (outputDevPtr + i * size, size);

    for (int i = 0; i < 2; ++i)

    cudaMemcpyAsync(hostPtr + i * size, outputDevPtr + i * size,

    size, cudaMemcpyDeviceToHost, stream[i]);

    ```


    then the memory copy from host to device issued to stream[1] overlaps with the
    kernel launch issued to stream[0].


    On devices that do support concurrent data transfers, the two streams of the code
    sample of Creation and Destruction do overlap: The memory copy from host to device
    issued to stream[1] overlaps with the memory copy from device to host issued to
    stream[0] and even with the kernel launch issued to stream[0] (assuming the device
    supports overlap of data transfer and kernel execution). However, for devices
    of compute capability 3.0 or lower, the kernel executions cannot possibly overlap
    because the second kernel launch is issued to stream[1] after the memory copy
    from device to host is issued to stream[0], so it is blocked until the first kernel
    launch issued to stream[0] is complete as per Implicit Synchronization. If the
    code is rewritten as above, the kernel executions overlap (assuming the device
    supports concurrent kernel execution since the second kernel launch is issued
    to stream[1] before the memory copy from device to host is issued to stream[0].
    In that case however, the memory copy from device to host issued to stream[0]
    only overlaps with the last thread blocks of the kernel launch issued to stream[1]
    as per Implicit Synchronization, which can represent only a small portion of the
    total execution time of the kernel.


    # 3.2.5.5.6. Host Functions (Callbacks)


    The runtime provides a way to insert a CPU function call at any point into a stream
    via cudaLaunchHostFunc(). The provided function is executed on the host once all
    commands issued to the stream before the callback have completed.


    The following code sample adds the host function MyCallback to each of two streams
    after issuing a host-to-device memory copy, a kernel launch and a device-to-host'
