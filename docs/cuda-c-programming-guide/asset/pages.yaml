  md: '# Appendix E.

    MATHEMATICAL FUNCTIONS


    The reference manual lists, along with their description, all the functions of
    the C/C++ standard library mathematical functions that are supported in device
    code, as well as all intrinsic functions (that are only supported in device code).


    This appendix provides accuracy information for some of these functions when applicable.


    # E.1. Standard Functions


    The functions from this section can be used in both host and device code.


    This section specifies the error bounds of each function when executed on the
    device and also when executed on the host in the case where the host does not
    supply the function.


    The error bounds are generated from extensive but not exhaustive tests, so they
    are not guaranteed bounds.


    # Single-Precision Floating-Point Functions


    Addition and multiplication are IEEE-compliant, so have a maximum error of 0.5
    ulp.


    The recommended way to round a single-precision floating-point operand to an integer,
    with the result being a single-precision floating-point number is `rintf()`, not
    `roundf()`. The reason is that `roundf()` maps to a 4-instruction sequence on
    the device, whereas `rintf()` maps to a single instruction. `truncf()`, `ceilf()`,
    and `floorf()` each map to a single instruction as well.


    # Table 7 Single-Precision Mathematical Standard Library Functions with Maximum
    ULP Error


    The maximum error is stated as the absolute value of the difference in ulps between
    a correctly rounded single-precision result and the result returned by the CUDA
    library function.'
