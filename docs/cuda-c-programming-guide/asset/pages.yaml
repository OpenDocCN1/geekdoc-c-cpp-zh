    # C.2.2. Tiled Partitions


    The tiled_partition() function can be used to decompose the thread block into
    multiple smaller groups of cooperative threads. For example, if we first create
    a group containing all the threads in the block:


    ```

    thread_block wholeBlock = this_thread_block();

    ```


    then we can partition this into smaller groups, each of size 32 threads:


    ```

    thread_group tile32 = tiled_partition(wholeBlock, 32);

    ```


    and, furthermore, we can partition each of these groups into even smaller groups,
    each of size 4 threads:


    ```

    thread_group tile4 = tiled_partition(tile32, 4);

    ```


    If, for instance, if we were to then include the following line of code:


    ```

    if (tile4.thread_rank()==0) printf("Hello from tile4 rank 0\n");

    ```


    then the statement would be printed by every fourth thread in the block: the threads
    of rank 0 in each tile4 group, which correspond to those threads with ranks 0,4,8,12...
    in the wholeBlock group.


    Note that, currently, only supported are tile sizes which are a power of 2 and
    no larger than 32.


    # C.2.3. Thread Block Tiles


    An alternative templated version of the tiled_partition function is available,
    where a template parameter is used to specify the size of the tile: with this
    known at compile time there is the potential for more optimal execution. Analogous
    to that in the previous section, the following code will create two sets of tiled
    groups, of size 32 and 4 respectively:


    ```

    thread_block_tile<32> tile32 = tiled_partition<32>(this_thread_block());

    thread_block_tile<4> tile4 = tiled_partition<4>(this_thread_block());

    ```


    Note that the thread_block_tile templated data structure is being used here, and
    that the size of the group is passed to the tiled_partition call as a template
    parameter rather than an argument.'
