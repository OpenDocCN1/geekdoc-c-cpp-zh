  img_proc: true
- pgno: 299
  md: 'If the size of the words accessed by each thread is more than 4 bytes, a memory
    request by a warp is first split into separate 128-byte memory requests that are
    issued independently:


    +   - Two memory requests, one for each half-warp, if the size is 8 bytes,

    +   - Four memory requests, one for each quarter-warp, if the size is 16 bytes.


    Each memory request is then broken down into cache line requests that are issued
    independently. A cache line request is serviced at the throughput of L1 or L2
    cache in case of a cache hit, or at the throughput of device memory, otherwise.


    Note that threads can access any words in any order, including the same words.


    If a non-atomic instruction executed by a warp writes to the same location in
    global memory for more than one of the threads of the warp, only one thread performs
    a write and which thread does it is undefined.


    Data that is read-only for the entire lifetime of the kernel can also be cached
    in the read-only data cache described in the previous section by reading it using
    the `__ldg()` function (see Read-Only Data Cache Load Function). When the compiler
    detects that the read-only condition is satisfied for some data, it will use `__ldg()`
    to read it. The compiler might not always be able to detect that the read-only
    condition is satisfied for some data. Marking pointers used for loading such data
    with both the `const` and `__restrict__` qualifiers increases the likelihood that
    the compiler will detect the read-only condition.


    Figure 18 shows some examples of global memory accesses and corresponding memory
    transactions.'
  merge: -1
  img_proc: true
