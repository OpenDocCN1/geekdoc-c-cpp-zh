  md: "Before a kernel can use a texture reference to read from texture memory, the\
    \ texture reference must be bound to a texture using cudaBindTexture() or cudaBindTexture2D()\
    \ for linear memory, or cudaBindTextureToArray() for CUDA arrays. cudaUnbindTexture()\
    \ is used to unbind a texture reference. Once a texture reference has been unbound,\
    \ it can be safely rebound to another array, even if kernels that use the previously\
    \ bound texture have not completed. It is recommended to allocate two-dimensional\
    \ textures in linear memory using cudaMallocPitch() and use the pitch returned\
    \ by cudaMallocPitch() as input parameter to cudaBindTexture2D().\n\nThe following\
    \ code samples bind a 2D texture reference to linear memory pointed to by devPtr:\n\
    \n+   Using the low-level API:\n\n```\ntexture<float, cudaTextureType2D,\n   \
    \      cudaReadModeElementType> texRef;\ntextureReference* texRefPtr;\ncudaGetTextureReference(&texRefPtr,\
    \ &texRef);\ncudaChannelFormatDesc channelDesc =\n    cudaCreateChannelDesc<float>();\n\
    size_t offset;\ncudaBindTexture2D(&offset, texRefPtr, devPtr, &channelDesc,\n\
    \                  width, height, pitch);\n```\n\n+   Using the high-level API:\n\
    \n```\ntexture<float, cudaTextureType2D,\n         cudaReadModeElementType> texRef;\n\
    cudaChannelFormatDesc channelDesc =\n    cudaCreateChannelDesc<float>();\nsize_t\
    \ offset;\ncudaBindTexture2D(&offset, texRef, devPtr, channelDesc,\n         \
    \         width, height, pitch);\n```\n\nThe following code samples bind a 2D\
    \ texture reference to a CUDA array cuArray:\n\n+   Using the low-level API:\n\
    \n```\ntexture<float, cudaTextureType2D,\n         cudaReadModeElementType> texRef;\n\
    textureReference* texRefPtr;\ncudaGetTextureReference(&texRefPtr, &texRef);\n\
    cudaChannelFormatDesc channelDesc;\ncudaGetChannelDesc(&channelDesc, cuArray);\n\
    cudaBindTextureToArray(texRef, cuArray, &channelDesc);\n```\n\n+   Using the high-level\
    \ API:\n\n```\ntexture<float, cudaTextureType2D,\n         cudaReadModeElementType>\
    \ texRef;\ncudaBindTextureToArray(texRef, cuArray);\n```\n\nThe format specified\
    \ when binding a texture to a texture reference must match the parameters specified\
    \ when declaring the texture reference; otherwise, the results of texture fetches\
    \ are undefined.\n\nThere is a limit to the number of textures that can be bound\
    \ to a kernel as specified in Table 15."
