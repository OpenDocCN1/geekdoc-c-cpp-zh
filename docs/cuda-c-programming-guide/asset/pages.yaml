  md: "# D.2.2.2.1. Coherence and Consistency\n\n# D.2.2.2.1.1. Global Memory\n\n\
    Parent and child grids have coherent access to global memory, with weak consistency\
    \ guarantees between child and parent. There are two points in the execution of\
    \ a child grid when its view of memory is fully consistent with the parent thread:\
    \ when the child grid is invoked by the parent, and when the child grid completes\
    \ as signaled by a synchronization API invocation in the parent thread.\n\nAll\
    \ global memory operations in the parent thread prior to the child grid’s invocation\
    \ are visible to the child grid. All memory operations of the child grid are visible\
    \ to the parent after the parent has synchronized on the child grid’s completion.\n\
    \nIn the following example, the child grid executing child_launch is only guaranteed\
    \ to see the modifications to data made before the child grid was launched. Since\
    \ thread 0 of the parent is performing the launch, the child will be consistent\
    \ with the memory seen by thread 0 of the parent. Due to the first __syncthreads()\
    \ call, the child will see data[0]=0, data[1]=1, ..., data[255]=255 (without the\
    \ __syncthreads() call, only data[0] would be guaranteed to be seen by the child).\
    \ When the child grid returns, thread 0 is guaranteed to see modifications made\
    \ by the threads in its child grid. Those modifications become available to the\
    \ other threads of the parent grid only after the second __syncthreads() call:\n\
    \n```\n__global__ void child_launch(int *data) {\n    data[threadIdx.x] = data[threadIdx.x]+1;\n\
    }\n__global__ void parent_launch(int *data) {\n    data[threadIdx.x] = threadIdx.x;\n\
    \    __syncthreads();\n    if (threadIdx.x == 0) {\n        child_launch<<< 1,\
    \ 256 >>>(data);\n        cudaDeviceSynchronize();\n    }\n    __syncthreads();\n\
    }\nvoid host_launch(int *data) {\n    parent_launch<<< 1, 256 >>>(data);\n}\n\
    ```\n\n# D.2.2.1.2. Zero Copy Memory\n\nZero-copy system memory has identical\
    \ coherence and consistency guarantees to global memory, and follows the semantics\
    \ detailed above. A kernel may not allocate or free zero-copy memory, but may\
    \ use pointers to zero-copy passed in from the host program.\n\n# D.2.2.2.1.3.\
    \ Constant Memory\n\nConstants are immutable and may not be modified from the\
    \ device, even between parent and child launches. That is to say, the value of\
    \ all __constant__ variables must"
