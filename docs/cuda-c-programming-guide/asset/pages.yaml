  md: "# K.2.1.1. Explicit Allocation Using cudaMallocManaged()\n\nUnified memory\
    \ is most commonly created using an allocation function that is semantically and\
    \ syntactically similar to the standard CUDA allocator, cudaMalloc(). The function\
    \ description is as follows:\n\n```\ncudaError_t cudaMallocManaged(void **devPtr,\n\
    \ size_t size,\n unsigned int flags=0);\n```\n\nThe cudaMallocManaged() function\
    \ reserves size bytes of managed memory and returns a pointer in devPtr. Note\
    \ the difference in cudaMallocManaged() behavior between various GPU architectures.\
    \ By default, the devices of compute capability lower than 6.x allocate managed\
    \ memory directly on the GPU. However, the devices of compute capability 6.x and\
    \ greater do not allocate physical memory when calling cudaMallocManaged(): in\
    \ this case physical memory is populated on first touch and may be resident on\
    \ the CPU or the GPU. The managed pointer is valid on all GPUs and the CPU in\
    \ the system, although program accesses to this pointer must obey the concurrency\
    \ rules of the Unified Memory programming model (see Coherency and Concurrency.\
    \ Below is a simple example, showing the use of cudaMallocManaged():\n\n```\n\
    __global__ void printme(char *str) {\n    printf(\"%s\");\n}\n\nint main() {\n\
    \    // Allocate 100 bytes of memory, accessible to both Host and Device code\n\
    \    char *s;\n    cudaMallocManaged(&s, 100);\n    // Note direct Host-code use\
    \ of \"s\"\n    strncpy(s, \"Hello Unified Memory\\n\", 99);\n    // Here we pass\
    \ \"s\" to a kernel without explicitly copying\n    printme<<<1, 1 >>>(s);\n \
    \   cudaDeviceSynchronize();\n    // Free as for normal CUDA allocations\n   \
    \ cudaFree(s);\n    return 0;\n}\n```\n\nA program's behavior is functionally\
    \ unchanged when cudaMalloc() is replaced with cudaMallocManaged(); however, the\
    \ program should go on to eliminate explicit memory copies and take advantage\
    \ of automatic migration. Additionally, dual pointers (one to host and one to\
    \ device memory) can be eliminated.\n\nDevice code is not able to call cudaMallocManaged().\
    \ All managed memory must be allocated from the host or at global scope (see the\
    \ next section). Allocations on the device heap using malloc() in a kernel will\
    \ not be created in the managed memory space, and so will not be accessible to\
    \ CPU code."
