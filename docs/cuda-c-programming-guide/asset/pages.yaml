    \       if (!memcmp(&deviceProp.uuid, vkPhysicalDeviceIDProperties.deviceUUID,\n\
    \                    VK_UUID_SIZE)) {\n            return cudaDevice;\n      \
    \  }\n    }\n\n    return cudaInvalidDeviceId;\n}\n```\n\n# 3.3.1.2. Importing\
