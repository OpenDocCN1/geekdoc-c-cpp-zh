- pgno: 312
  md: '# # Appendix I. DRIVER API


    This appendix assumes knowledge of the concepts described in CUDA Runtime.


    The driver API is implemented in the **cuda** dynamic library (**cuda.dll** or
    **cuda.so**) which is copied on the system during the installation of the device
    driver. All its entry points are prefixed with cu.


    It is a handle-based, imperative API: Most objects are referenced by opaque handles
    that may be specified to functions to manipulate the objects.


    The objects available in the driver API are summarized in Table 16.


    # Table 16 Objects Available in the CUDA Driver API


    | Object | Handle | Description |

    | :--- | :--- | :--- |

    | Device | CUdevice | CUDA-enabled device |

    | Context | CUcontext | Roughly equivalent to a CPU process |

    | Module | CUmodule | Roughly equivalent to a dynamic library |

    | Function | CUfunction | Kernel |

    | Heap memory | CUdeviceptr | Pointer to device memory |

    | CUDA array | CUarray | Opaque container for one-dimensional or two-dimensional
    data on the device, readable via texture or surface references |

    | Texture reference | CUtexref | Object that describes how to interpret texture
    memory data |

    | Surface reference | CUsurfref | Object that describes how to read or write CUDA
    arrays |

    | Stream | CUstream | Object that describes a CUDA stream |

    | Event | CUevent | Object that describes a CUDA event |


    The driver API must be initialized with **cuInit()** before any function from
    the driver API is called. A CUDA context must then be created that is attached
    to a specific device and made current to the calling host thread as detailed in
    Context.'
