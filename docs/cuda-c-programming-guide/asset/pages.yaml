    There is no explicit initialization function for the runtime; it initializes the
    first time a runtime function is called (more specifically any function other
    than functions from the error handling and version management sections of the
    reference manual). One needs to keep this in mind when timing runtime function
    calls and when interpreting the error code from the first call into the runtime.


    During initialization, the runtime creates a CUDA context for each device in the
    system (see Context for more details on CUDA contexts). This context is the **primary
    context** for this device and it is shared among all the host threads of the application.
