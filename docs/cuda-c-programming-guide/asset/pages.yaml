    # B.2.1. __device__


    The __device__ memory space specifier declares a variable that resides on the
    device.


    At most one of the other memory space specifiers defined in the next three sections
    may be used together with __device__ to further denote which memory space the
    variable belongs to. If none of them is present, the variable:


    +   - Resides in global memory space,

    +   - Has the lifetime of the CUDA context in which it is created,

    +   - Has a distinct object per device,

    +   - Is accessible from all the threads within the grid and from the host through
    the runtime library (cudaGetSymbolAddress() / cudaGetSymbolSize() / cudaMemcpyToSymbol()
    / cudaMemcpyFromSymbol() ).


    # B.2.2. __constant__


    The __constant__ memory space specifier, optionally used together with __device__,
    declares a variable that:


    +   - Resides in constant memory space,

    +   - Has the lifetime of the CUDA context in which it is created,

    +   - Has a distinct object per device,

    +   - Is accessible from all the threads within the grid and from the host through
    the runtime library (cudaGetSymbolAddress() / cudaGetSymbolSize() / cudaMemcpyToSymbol()
    / cudaMemcpyFromSymbol() ).


    # B.2.3. __shared__


    The __shared__ memory space specifier, optionally used together with __device__,
    declares a variable that:


    +   - Resides in the shared memory space of a thread block,

    +   - Has the lifetime of the block,

    +   - Has a distinct object per block,

    +   - Is only accessible from all the threads within the block,

    +   - Does not have a constant address.


