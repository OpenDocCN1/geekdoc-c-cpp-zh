- pgno: 306
  md: '# H.5. Compute Capability 6.x


    # H.5.1. Architecture


    A multiprocessor consists of:


    +   64 (compute capability 6.0) or 128 (6.1 and 6.2) CUDA cores for arithmetic
    operations,


    +   16 (6.0) or 32 (6.1 and 6.2) special function units for single-precision floating-point
    transcendental functions,


    +   2 (6.0) or 4 (6.1 and 6.2) warp schedulers.


    When a multiprocessor is given warps to execute, it first distributes them among
    its schedulers. Then, at every instruction issue time, each scheduler issues one
    instruction for one of its assigned warps that is ready to execute, if any.


    A multiprocessor has:


    +   a read-only constant cache that is shared by all functional units and speeds
    up reads from the constant memory space, which resides in device memory,


    +   a unified L1/texture cache for reads from global memory of size 24 KB (6.0
    and 6.2) or 48 KB (6.1),


    +   a shared memory of size 64 KB (6.0 and 6.2) or 96 KB (6.1).


    The unified L1/texture cache is also used by the texture unit that implements
    the various addressing modes and data filtering mentioned in Texture and Surface
    Memory.


    There is also an L2 cache shared by all multiprocessors that is used to cache
    accesses to local or global memory, including temporary register spills. Applications
    may query the L2 cache size by checking the l2CacheSize device property (see Device
    Enumeration).


    The cache behavior (e.g., whether reads are cached in both the unified L1/texture
    cache and L2 or in L2 only) can be partially configured on a per-access basis
    using modifiers to the load instruction.


    # H.5.2. Global Memory


    Global memory behaves the same way as devices of compute capability 5.x (See Global
    Memory).


    # H.5.3. Shared Memory


    Shared memory behaves the same way as devices of compute capability 5.x (See Shared
    Memory).'
  merge: -1
  img_proc: true
- pgno: 307
  md: '# H.6. Compute Capability 7.x


    # H.6.1. Architecture


    A multiprocessor consists of:


    +   - 64 FP32 cores for single-precision arithmetic operations,

    +   - 32 FP64 cores for double-precision arithmetic operations, 26

    +   - 64 INT32 cores for integer math,

    +   - 8 mixed-precision Tensor Cores for deep learning matrix arithmetic

    +   - 16 special function units for single-precision floating-point transcendental
    functions,

    +   - 4 warp schedulers.


    A multiprocessor statically distributes its warps among its schedulers. Then,
    at every instruction issue time, each scheduler issues one instruction for one
    of its assigned warps that is ready to execute, if any.


    A multiprocessor has:


    +   - a read-only constant cache that is shared by all functional units and speeds
    up reads from the constant memory space, which resides in device memory,

    +   - a unified data cache and shared memory with a total size of 128 KB (_Volta_)
    or 96 KB (_Turing_).


    Shared memory is partitioned out of unified data cache, and can be configured
    to various sizes (See Shared Memory.) The remaining data cache serves as an L1
    cache and is also used by the texture unit that implements the various addressing
    and data filtering modes mentioned in Texture and Surface Memory.


    # H.6.2. Independent Thread Scheduling


    The _Volta_ architecture introduces Independent Thread Scheduling among threads
    in a warp, enabling intra-warp synchronization patterns previously unavailable
    and simplifying code changes when porting CPU code. However, this can lead to
    a rather different set of threads participating in the executed code than intended
    if the developer made assumptions about warp-synchronicity of previous hardware
    architectures.


    Below are code patterns of concern and suggested corrective actions for Volta-safe
    code.


    +   1. For applications using warp intrinsics (`__shfl*`, `__any`, `__all`, `__ballot`),
    it is necessary that developers port their code to the new, safe, synchronizing
    counterpart, with the `*_sync` suffix. The new warp intrinsics take in a mask
    of threads that explicitly define which lanes (threads of a warp) must participate
    in the warp intrinsic. See Warp Vote Functions and Warp Shuffle Functions for
    details.'
  merge: -1
  img_proc: true
- pgno: 308
  md: "Since the intrinsics are available with CUDA 9.0+, (if necessary) code can\
    \ be executed conditionally with the following preprocessor macro:\n\n```\n#if\
    \ defined(CUDART_VERSION) && CUDART_VERSION >= 9000\n// * __sync Intrinsics\n\
    #endif\n```\n\nThese intrinsics are available on all architectures, not just Volta\
    \ or Turing, and in most cases a single code-base will suffice for all architectures.\
    \ Note, however, that for Pascal and earlier architectures, all threads in mask\
    \ must execute the same warp intrinsic instruction in convergence, and the union\
    \ of all values in mask must be equal to the warp's active mask. The following\
    \ code pattern is valid on Volta, but not on Pascal or earlier architectures.\n\
    \n```\nif (tid % warpSize < 16) {\n    ...\n    float swapped = __shfl_xor_sync(0xffffffff,\
    \ val, 16);\n} else {\n    ...\n    float swapped = __shfl_xor_sync(0xffffffff,\
    \ val, 16);\n}\n```\n\nThe replacement for `__ballot(1)` is `__activemask()`.\
    \ Note that threads within a warp can diverge even within a single code path.\
    \ As a result, `__activemask()` and `__ballot(1)` may return only a subset of\
    \ the threads on the current code path. The following invalid code example sets\
    \ bit `i` of `output` to 1 when `data[i]` is greater than `threshold`. `__activemask()`\
    \ is used in an attempt to enable cases where `datalen` is not a multiple of 32.\n\
    \n```\n// Sets bit in output[] to 1 if the correspond element in data[i]\n// is\
    \ greater than 'threshold', using 32 threads in a warp.\nfor(int i=warplane; i<datalen;\
    \ i+=warpSize) {\n    unsigned active = __activemask();\n    unsigned bitPack\
    \ = __ballot_sync(active, data[i] > threshold);\n    if (warplane == 0)\n    \
    \    output[i/32] = bitPack;\n}\n```\n\nThis code is invalid because CUDA does\
    \ not guarantee that the warp will diverge ONLY at the loop condition. When divergence\
    \ happens for other reasons, conflicting results will be computed for the same\
    \ 32-bit output element by different subsets of threads in the warp. A correct\
    \ code might use a non-divergent loop condition together with `__ballot_sync()`\
    \ to safely enumerate the set of threads in the warp participating in the threshold\
    \ calculation as follows.\n\n```\nfor(int i=warplane; i<datalen; i+=warpSize)\
    \ {\n    unsigned active = __ballot_sync(0xFFFFFFFF, i < datalen);\n    if (i\
    \ < datalen) {\n        unsigned bitPack = __ballot_sync(active, data[i] > threshold);\n\
    \        if (warplane == 0)\n            output[i/32] = bitPack;\n    }\n}\n```\n\
    \nDiscovery Pattern demonstrates a valid usecase for `__activemask()`."
  merge: -1
  img_proc: true
- pgno: 309
  md: "+   2. If applications have warp-synchronous codes, they will need to insert\
    \ the new `__syncwarp()` warp-wide barrier synchronization instruction between\
    \ any steps where data is exchanged between threads via global or shared memory.\
    \ Assumptions that code is executed in lockstep or that reads/writes from separate\
    \ threads are visible across a warp without synchronization are invalid.\n\n```\n\
    float s_buf[tid] = val;\n__syncthreads();\n\n// Inter-warp reduction\nfor (int\
    \ i=BID/2; i>0; i/=2) {\n    s_buf[tid] += s_buf[tid+i];\n    __syncthreads();\n\
    }\n\n// Intra-warp reduction\n// Butterfly reduction simplifies syncwarp mask\n\
    if (tid < 32) {\n    float temp;\n    s_buf[tid] += temp; __syncwarp();\n    s_buf[tid]\
    \ += temp; __syncwarp();\n    temp = s_buf[tid^8]; __syncwarp();\n    s_buf[tid]\
    \ += temp; __syncwarp();\n    temp = s_buf[tid^4]; __syncwarp();\n    s_buf[tid]\
    \ += temp; __syncwarp();\n    temp = s_buf[tid^2]; __syncwarp();\n    s_buf[tid]\
    \ += temp; __syncwarp();\n}\n\nif (tid == 0) {\n    *output = s_buf[0] + s_buf[1];\n\
    }\n__syncthreads();\n```\n\n+   3. Although `__syncthreads()` has been consistently\
    \ documented as synchronizing all threads in the thread block, Pascal and prior\
    \ architectures could only enforce synchronization at the warp level. In certain\
    \ cases, this allowed a barrier to succeed without being executed by every thread\
    \ as long as at least some thread in every warp reached the barrier. Starting\
    \ with Volta, the CUDA built-in `__syncthreads()` and PTX instruction `bar.sync`\
    \ (and their derivatives) are enforced per thread and thus will not succeed until\
    \ reached by all non-exited threads in the block. Code exploiting the previous\
    \ behavior will likely deadlock and must be modified to ensure that all non-exited\
    \ threads reach the barrier.\n\nThe racecheck and synccheck tools provided by\
    \ cuda-memcheck can aid in locating violations of points 2 and 3.\n\nTo aid migration\
    \ while implementing the above-mentioned corrective actions, developers can opt-in\
    \ to the Pascal scheduling model that does not support independent thread scheduling.\
    \ See Application Compatibility for details.\n\n# H.6.3. Global Memory\n\nGlobal\
    \ memory behaves the same way as devices of compute capability 5.x (See Global\
    \ Memory)."
  merge: -1
  img_proc: true
- pgno: 310
  md: "# H.6.4. Shared Memory\n\nSimilar to the Kepler architecture, the amount of\
    \ the unified data cache reserved for shared memory is configurable on a per kernel\
    \ basis. For the Volta architecture (compute capability 7.0), the unified data\
    \ cache has a size of 128 KB, and the shared memory capacity can be set to 0,\
    \ 8, 16, 32, 64 or 96 KB. For the Turing architecture (compute capability 7.5),\
    \ the unified data cache has a size of 96 KB, and the shared memory capacity can\
    \ be set to either 32 KB or 64 KB. Unlike Kepler, the driver automatically configures\
    \ the shared memory capacity for each kernel to avoid shared memory occupancy\
    \ bottlenecks while also allowing concurrent execution with already launched kernels\
    \ where possible. In most cases, the driver’s default behavior should provide\
    \ optimal performance.\n\nBecause the driver is not always aware of the full workload,\
    \ it is sometimes useful for applications to provide additional hints regarding\
    \ the desired shared memory configuration. For example, a kernel with little or\
    \ no shared memory use may request a larger carvedout in order to encourage concurrent\
    \ execution with later kernels that require more shared memory. The new cudaFuncSetAttribute()\
    \ API allows applications to set a preferred shared memory capacity, or carveout,\
    \ as a percentage of the maximum supported shared memory capacity (96 KB for Volta,\
    \ and 64 KB for Turing).\n\ncudaFuncSetAttribute() relaxes enforcement of the\
    \ preferred shared capacity compared to the legacy cudaFuncSetCacheConfig() API\
    \ introduced with Kepler. The legacy API treated shared memory capacities as hard\
    \ requirements for kernel launch. As a result, interleaving kernels with different\
    \ shared memory configurations would needlessly serialize launches behind shared\
    \ memory reconfigurations. With the new API, the carveout is treated as a hint.\
    \ The driver may choose a different configuration if required to execute the function\
    \ or to avoid thrashing.\n\n```\n// Device code\n__global__ void MyKernel(...)\n\
    {\n    __shared__ float buffer[BLOCK_DIM];\n    ...\n}\n\n// Host code\nint carveout\
    \ = 50; // prefer shared memory capacity 50% of maximum\n// Named Carveout Values:\n\
    // carveout = cudaSharedmemCarveoutDefault; // (-1)\n// carveout = cudaSharedmemCarveoutMaxL1;\
    \ // (0)\n// carveout = cudaSharedmemCarveoutMaxShared; // (100)\n// cudaFuncSetAttribute(MyKernel,\
    \ cudaFuncAttributePreferredSharedMemoryCarveout,\ncarveout);\nMyKernel<<<gridDim,\
    \ BLOCK_DIM>>>(...);\n```\n\nIn addition to an integer percentage, several convenience\
    \ enums are provided as listed in the code comments above. Where a chosen integer\
    \ percentage does not map exactly to a supported capacity (SM 7.0 devices support\
    \ shared capacities of 0, 8, 16, 32, 64, or 96 KB), the next larger capacity is\
    \ used. For instance, in the example above, 50% of the 96 KB maximum is 48 KB,\
    \ which is not a supported shared memory capacity. Thus, the preference is rounded\
    \ up to 64 KB."
  merge: -1
  img_proc: true
- pgno: 311
  md: "Compute capability 7.x devices allow a single thread block to address the full\
    \ capacity of shared memory: 96 KB on Volta, 64 KB on Turing. Kernels relying\
    \ on shared memory allocations over 48 KB per block are architecture-specific,\
    \ as such they must use dynamic shared memory (rather than statically sized arrays)\
    \ and require an explicit opt-in using cudaFuncSetAttribute() as follows.\n\n\
    ```\n// device code\n__global__ void MyKernel(...)\n{\n    ...\n}\n\n// Host code\n\
    int maxbytes = 98304; // 96 KB\ncudaFuncSetAttribute(MyKernel, cudaFuncAttributeMaxDynamicSharedMemorySize,\n\
    \                     maxbytes);\nMyKernel <<<gridDim, blockDim>>>(...);\n```\n\
    \nOtherwise, shared memory behaves the same way as devices of compute capability\
    \ 5.x (See Shared Memory)."
  merge: -1
