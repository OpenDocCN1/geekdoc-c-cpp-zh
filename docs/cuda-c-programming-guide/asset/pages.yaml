    \ prevents the CPU from doing so.\n\n# K.2.2.5. Stream Attach With Multithreaded\
    \ Host Programs\n\nThe primary use for **cudaStreamAttachMemAsync()** is to enable\
    \ independent task parallelism using CPU threads. Typically in such a program,\
    \ a CPU thread creates its own stream for all work that it generates because using\
    \ CUDA’s NULL stream would cause dependencies between threads.\n\nThe default\
    \ global visibility of managed data to any GPU stream can make it difficult to\
    \ avoid interactions between CPU threads in a multi-threaded program. Function\
    \ **cudaStreamAttachMemAsync()** is therefore used to associate a thread’s managed\
    \ allocations with that thread’s own stream, and the association is typically\
    \ not changed for the life of the thread."
  merge: -1
  img_proc: true
- pgno: 336
  md: "Such a program would simply add a single call to cudaStreamAttachMemAsync()\
    \ to use unified memory for its data accesses:\n\n```\n// This function performs\
    \ some task, in its own private stream.\nvoid run_task(int *in, int *out, int\
    \ length) {\n  // Create a stream for us to use.\n  cudaStream_t stream;\n  cudaStreamCreate(&stream);\n\
    \  // Allocate some managed data and associate with our stream.\n  // Note the\
    \ use of the host-attach flag to cudaMallocManaged();\n  // we then associate\
    \ the allocation with our stream so that\n  // our GPU kernel launches can access\
    \ it.\n  int *data;\n  cudaMallocManaged((void **)&data, length, cudaMemAttachHost);\n\
    \  cudaStreamAttachMemAsync(stream, data);\n  cudaStreamSynchronize(stream);\n\
    \  // Iterate on the data in some way, using both Host & Device.\n  for(int i=0;\
    \ i<N; i++) {\n    transform<<<100, 256, 0, stream>>>(in, data, length);\n   \
    \ cudaStreamSynchronize(stream);\n    host_access(data, length);\n    convert<<<100,\
    \ 256, 0, stream>>>(out, data, length);\n  }\n  cudaStreamSynchronize(stream);\n\
    \  cudaStreamDestroy(stream);\n  cudaFree(data);\n}\n```\n\nIn this example, the\
    \ allocation-stream association is established just once, and then data is used\
    \ repeatedly by both the host and device. The result is much simpler code than\
    \ occurs with explicitly copying data between host and device, although the result\
    \ is the same.\n\n# K.2.2.6. Advanced Topic: Modular Programs and Data Access\
    \ Constraints\n\nIn the previous example cudaMallocManaged() specifies the cudaMemAttachHost\
    \ flag, which creates an allocation that is initially invisible to device-side\
    \ execution. (The default allocation would be visible to all GPU kernels on all\
    \ streams.) This ensures that there is no accidental interaction with another\
    \ thread's execution in the interval between the data allocation and when the\
    \ data is acquired for a specific stream.\n\nWithout this flag, a new allocation\
    \ would be considered in-use on the GPU if a kernel launched by another thread\
    \ happens to be running. This might impact the thread's ability to access the\
    \ newly allocated data from the CPU (for example, within a base-class constructor)\
    \ before it is able to explicitly attach it to a private stream. To enable safe\
    \ independence between threads, therefore, allocations should be made specifying\
    \ this flag.\n\n> An alternative would be to place a process-wide barrier across\
    \ all threads after the allocation has been attached to the stream. This would\
    \ ensure that all threads complete their data/stream associations before any kernels\
    \ are launched, avoiding the hazard. A second barrier would be needed before the\
    \ stream is destroyed because stream destruction causes allocations to revert\
    \ to their default visibility. The cudaMemAttachHost flag exists both to simplify\
    \ this process, and because it is not always possible to insert global barriers\
    \ where required."
  merge: -1
  img_proc: true
- pgno: 337
  md: '# K.2.2.7. Memcpy()/Memset() Behavior With Managed Memory


    Since managed memory can be accessed from either the host or the device, cudaMemcpy*()
    relies on the type of transfer, specified using cudaMemcpyKind, to determine whether
    the data should be accessed as a host pointer or a device pointer.


    If cudaMemcpyHostTo* is specified and the source data is managed, then it will
    be accessed from the host if it is coherently accessible from the host in the
    copy stream (1); otherwise it will be accessed from the device. Similar rules
    apply to the destination when cudaMemcpy*ToHost is specified and the destination
    is managed memory.


    If cudaMemcpyDeviceTo* is specified and the source data is managed, then it will
    be accessed from the device. The source must be coherently accessible from the
    device in the copy stream (2); otherwise, an error is returned. Similar rules
    apply to the destination when cudaMemcpy*ToDevice is specified and the destination
    is managed memory.


    If cudaMemcpyDefault is specified, then managed data will be accessed from the
    host either if it cannot be coherently accessed from the device in the copy stream
    (2) or if the preferred location for the data is cudaCpuDeviceId and it can be
    coherently accessed from the host in the copy stream (1); otherwise, it will be
    accessed from the device.


    When using cudaMemset*() with managed memory, the data is always accessed from
    the device. The data must be coherently accessible from the device in the stream
    being used for the cudaMemset() operation (2); otherwise, an error is returned.


    When data is accessed from the device either by cudaMemcpy* or cudaMemset*, the
    stream of operation is considered to be active on the GPU. During this time, any
    CPU access of data that is associated with that stream or data that has global
    visibility will result in a segmentation fault if the GPU has a zero value for
    the device attribute concurrentManagedAccess. The program must synchronize appropriately
    to ensure the operation has completed before accessing any associated data from
    the CPU.


    (1) For managed memory to be coherently accessible from the host in a given stream,
    at least one of the following conditions must be satisfied:


    +   The given stream is associated with a device that has a non-zero value for
    the device attribute concurrentManagedAccess.


    +   The memory neither has global visibility nor is it associated with the given
    stream.


    (2) For managed memory to be coherently accessible from the device in a given
    stream, at least one of the following conditions must be satisfied:


    +   The device has a non-zero value for the device attribute concurrentManagedAccess.


    +   The memory either has global visibility or is associated with the given stream.


    # K.2.3. Language Integration


    Users of the CUDA Runtime API who compile their host code using nvcc have access
    to additional language integration features, such as shared symbol names and inline
    kernel launch via the <<<...>>> operator. Unified Memory adds one additional element
    to'
  merge: -1
  img_proc: true
- pgno: 338
  md: "CUDA's language integration: variables annotated with the `__managed__` keyword\
    \ can be referenced directly from both host and device code.\n\nThe following\
    \ example, seen earlier in Simplifying GPU Programming, illustrates a simple use\
    \ of `__managed__` global declarations:\n\n```\n// Managed variable declaration\
    \ is an extra annotation with __device__\n__device__ __managed__ int x;\n\nglobal\
    \ void kernel() {\n    // Reference x directly - it's a normal variable on the\
    \ GPU.\n    printf(\"GPU sees x = %d\\n\", x);\n}\n\nint main() {\n    // Set\
    \ \"x\" from Host code. Note it's just a normal variable on the CPU.\n    x =\
    \ 1234;\n\n    // Launch a kernel which uses \"x\" from the GPU.\n    kernel<<<1,\
    \ 1, 1 >>>();\n    cudaDeviceSynchronize();\n    return 0;\n}\n```\n\nThe capability\
    \ available with `__managed__` variables is that the symbol is available in both\
    \ device code and in host code without the need to dereference a pointer, and\
    \ the data is shared by all. This makes it particularly easy to exchange data\
    \ between host and device programs without the need for explicit allocations or\
    \ copying.\n\nSemantically, the behavior of `__managed__` variables is identical\
    \ to that of storage allocated via `cudaMallocManaged()`. See Explicit Allocation\
    \ Using `cudaMallocManaged()` for detailed explanation. Stream visibility defaults\
    \ to `cudaMemAttachGlobal`, but may be constrained using `cudaStreamAttachMemAsync()`.\n\
    \nA valid CUDA context is necessary for the correct operation of `__managed__`\
    \ variables. Accessing `__managed__` variables can trigger CUDA context creation\
    \ if a context for the current device hasn't already been created. In the example\
    \ above, accessing `x` before the kernel launch triggers context creation on device\
    \ 0. In the absence of that access, the kernel launch would have triggered context\
    \ creation.\n\nC++ objects declared as `__managed__` are subject to certain specific\
    \ constraints, particularly where static initializers are concerned. Please refer\
    \ to C++ Language Support in the CUDA C++ Programming Guide for a list of these\
    \ constraints.\n\n# K.2.3.1. Host Program Errors with `__managed__` Variables\n\
    \nThe use of `__managed__` variables depends upon the underlying Unified Memory\
    \ system functioning correctly. Incorrect functioning can occur if, for example,\
    \ the CUDA installation failed or if the CUDA context creation was unsuccessful.\n\
    \nWhen CUDA-specific operations fail, typically an error is returned that indicates\
    \ the source of the failure. Using `__managed__` variables introduces a new failure\
    \ mode whereby a non-CUDA operation (for example, CPU access to what should be\
    \ a valid host memory address) can fail if the Unified Memory system is not operating\
    \ correctly. Such invalid memory accesses cannot easily be attributed to the underlying\
    \ CUDA subsystem, although a debugger such as `cuda-gdb` will indicate that a\
    \ managed memory address is the source of the failure."
  merge: -1
  img_proc: true
- pgno: 339
  md: '# K.2.4. Querying Unified Memory Support


    # K.2.4.1. Device Properties


    Unified Memory is supported only on devices with compute capability 3.0 or higher.
    A program may query whether a GPU device supports managed memory by using `cudaGetDeviceProperties()`
    and checking the new `managedMemory` property. The capability can also be determined
    using the individual attribute query function `cudaDeviceGetAttribute()` with
    the attribute `cudaDevAttrManagedMemory`.


    Either property will be set to 1 if managed memory allocations are permitted on
    the GPU and under the current operating system. Note that Unified Memory is not
    supported for 32-bit applications (unless on Android), even if a GPU is of sufficient
    capability.


    Devices of compute capability 6.x on supporting platforms can access pageable
    memory without calling cudaHostRegister on it. An application can query whether
    the device supports coherently accessing pageable memory by checking the new `pageableMemoryAccess`
    property.


    With the new page fault mechanism, global data coherency is guaranteed with Unified
    Memory. This means that the CPUs and GPUs can access Unified Memory allocations
    simultaneously. This was illegal on devices of compute capability lower than 6.x,
    because coherence could not be guaranteed if the CPU accessed a Unified Memory
    allocation while a GPU kernel was active. A program can query concurrent access
    support by checking `concurrentManagedAccess` property. See Coherency and Concurrency
    for details.


    # K.2.4.2. Pointer Attributes


    To determine if a given pointer refers to managed memory, a program can call `cudaPointerGetAttributes()`
    and check the value of the `isManaged` attribute. This attribute is set to 1 if
    the pointer refers to managed memory and to 0 if not.


    # K.2.5. Advanced Topics


    # K.2.5.1. Managed Memory with Multi-GPU Programs on pre-6.x Architectures


    On systems with devices of compute capabilities lower than 6.x managed allocations
    are automatically visible to all GPUs in a system via the peer-to-peer capabilities
    of the GPUs.


    On Linux the managed memory is allocated in GPU memory as long as all GPUs that
    are actively being used by a program have the peer-to-peer support. If at any
    time the application starts using a GPU that doesn''t have peer-to-peer support
    with any of the other GPUs that have managed allocations on them, then the driver
    will migrate all managed allocations to system memory.'
  merge: -1
  img_proc: true
- pgno: 340
  md: 'On Windows if peer mappings are not available (for example, between GPUs of
    different architectures), then the system will automatically fall back to using
    zero-copy memory, regardless of whether both GPUs are actually used by a program.
    If only one GPU is actually going to be used, it is necessary to set the CUDA_VISIBLE_DEVICES
    environment variable before launching the program. This constrains which GPUs
    are visible and allows managed memory to be allocated in GPU memory.


    Alternatively, on Windows users can also set CUDA_MANAGED_FORCE_DEVICE_ALLOC to
    a non-zero value to force the driver to always use device memory for physical
    storage. When this environment variable is set to a non-zero value, all devices
    used in that process that support managed memory have to be peer-to-peer compatible
    with each other. The error ::cudaErrorInvalidDevice will be returned if a device
    that supports managed memory is used and it is not peer-to-peer compatible with
    any of the other managed memory supporting devices that were previously used in
    that process, even if ::cudaDeviceReset has been called on those devices. These
    environment variables are described in Appendix CUDA Environment Variables. Note
    that starting from CUDA 8.0 CUDA_MANAGED_FORCE_DEVICE_ALLOC has no effect on Linux
    operating systems.


    # K.2.5.2. Using fork() with Managed Memory


    The Unified Memory system does not allow sharing of managed memory pointers between
    processes. It will not correctly manage memory handles that have been duplicated
    via a fork() operation. Results will be undefined if either the child or parent
    accesses managed data following a fork().


    It is safe, however, to fork() a child process that then immediately exits via
    an exec() call, because the child drops the memory handles and the parent becomes
    the sole owner once again. It is not safe for the parent to exit and leave the
    child to access the handles.


    # K.3. Performance Tuning


    In order to achieve good performance with Unified Memory, the following objectives
    must be met:


    +   Faults should be avoided: While replayable faults are fundamental to enabling
    a simpler programming model, they can be severely detrimental to application performance.
    Fault handling can take tens of microseconds because it may involve TLB invalidates,
    data migrations and page table updates. All the while, execution in certain portions
    of the application will be halted, thereby potentially impacting overall performance.


    +   Data should be local to the accessing processor: As mentioned before, memory
    access latencies and bandwidth are significantly better when the data is placed
    local to the processor accessing it. Therefore, data should be suitably migrated
    to take advantage of lower latencies and higher bandwidth.


    +   Memory thrashing should be prevented: If data is frequently accessed by multiple
    processors and has to be constantly migrated around to achieve data locality,
    then the overhead of migration may exceed the benefits of locality. Memory thrashing
    should be prevented to the extent possible. If it cannot be prevented, it must
    be detected and resolved appropriately.'
  merge: -1
  img_proc: true
- pgno: 341
  md: "To achieve the same level of performance as what's possible without using Unified\
    \ Memory, the application has to guide the Unified Memory driver subsystem into\
    \ avoiding the aforementioned pitfalls. It is worthy to note that the Unified\
    \ Memory driver subsystem can detect common data access patterns and achieve some\
    \ of these objectives automatically without application participation. But when\
    \ the data access patterns are non-obvious, explicit guidance from the application\
    \ is crucial. CUDA 8.0 introduces useful APIs for providing the runtime with memory\
    \ usage hints (`cudaMemAdvise()`) and for explicit prefetching (`cudaMemPrefetchAsync()`).\
    \ These tools allow the same capabilities as explicit memory copy and pinning\
    \ APIs without reverting to the limitations of explicit GPU memory allocation.\n\
    \n> cudaMemPrefetchAsync() is not supported on Tegra devices.\n\n# K.3.1. Data\
    \ Prefetching\n\nData prefetching means migrating data to a processor's memory\
    \ and mapping it in that processor's page tables before the processor begins accessing\
    \ that data. The intent of data prefetching is to avoid faults while also establishing\
    \ data locality. This is most valuable for applications that access data primarily\
    \ from a single processor at any given time. As the accessing processor changes\
    \ during the lifetime of the application, the data can be prefetched accordingly\
    \ to follow the execution flow of the application. Since work is launched in streams\
    \ in CUDA, it is expected of data prefetching to also be a streamed operation\
    \ as shown in the following API:\n\n```\ncudaError_t cudaMemPrefetchAsync(\n \
    \   const void *devPtr,\n    size_t count,\n    int dstDevice,\n    cudaStream_t\
    \ stream);\n```\n\nwhere the memory region specified by **devPtr** pointer and\
    \ **count** number of bytes, with **ptr** rounded down to the nearest page boundary\
    \ and **count** rounded up to the nearest page boundary, is migrated to the **dstDevice**\
    \ by enqueueing a migration operation in **stream**. Passing in **cudaCpuDeviceId**\
    \ for **dstDevice** will cause data to be migrated to CPU memory.\n\nConsider\
    \ a simple code example below:\n\n```\nvoid foo(cudaStream_t s) {\n    char *data;\n\
    \    cudaMallocManaged(&data, N);\n    init_data(data, N);\n    cudaMemPrefetchAsync(data,\
    \ N, myGpuId, s); // prefetch to GPU\n    mykernel<<<..., s>>>(data, N, 1, compare);\
    \ // execute on GPU\n    cudaMemPrefetchAsync(data, N, cudaCpuDeviceId, s); //\
    \ prefetch to CPU\n    cudaStreamSynchronize(s);\n    use_data(data, N);\n   \
    \ cudaFree(data);\n}\n```\n\nWithout performance hints the kernel **mykernel**\
    \ will fault on first access to **data** which creates additional overhead of\
    \ the fault processing and generally slows down the application. By prefetching\
    \ **data** in advance it is possible to avoid page faults and achieve better performance."
  merge: -1
  img_proc: true
- pgno: 342
  md: "This API follows stream ordering semantics, i.e. the migration does not begin\
    \ until all prior operations in the stream have completed, and any subsequent\
    \ operation in the stream does not begin until the migration has completed.\n\n\
    # K.3.2. Data Usage Hints\n\nData prefetching alone is insufficient when multiple\
    \ processors need to simultaneously access the same data. In such scenarios, it's\
    \ useful for the application to provide hints on how the data will actually be\
    \ used. The following advisory API can be used to specify data usage:\n\n```\n\
    cudaError_t cudaMemAdvise(const void *devPtr,\n size_t count,\n enum cudaMemoryAdvise\
    \ advice,\n int device);\n```\n\nwhere **advice**, specified for data contained\
    \ in region starting from **devPtr** address and with the length of **count**\
    \ bytes, rounded to the nearest page boundary, can take the following values:\n\
    \n+   **cudaMemAdviseSetReadMostly:** This implies that the data is mostly going\
    \ to be read from and only occasionally written to. This allows the driver to\
    \ create read-only copies of the data in a processor's memory when that processor\
    \ accesses it. Similarly, if **cudaMemPrefetchAsync** is called on this region,\
    \ it will create a read-only copy of the data on the destination processor. When\
    \ a processor writes to this data, all copies of the corresponding page are invalidated\
    \ except for the one where the write occurred. The **device** argument is ignored\
    \ for this advice. This advice allows multiple processors to simultaneously access\
    \ the same data at maximal bandwidth as illustrated in the following code snippet:\n\
    \n```\nchar *dataPtr;\nsize_t dataSize = 4096;\n// Allocate memory using malloc\
    \ or cudaMallocManaged\ndata = (char *)malloc(dataSize);\n// Set advice on the\
    \ memory region\ncudaMemAdvise(dataPtr, dataSize, cudaMemAdviseSetReadMostly,\
    \ 0);\nint outerLoopIter = 0;\nwhile (outerLoopIter < maxOuterLoopIter) {\n //\
    \ The data is written to in the outer loop on the CPU\n initializeData(dataPtr,\
    \ dataSize);\n // Prefetching here makes available to all GPUs by prefetching.\n\
    \ // Prefetch here causes read duplication of data instead\n // of data migration\n\
    \ for (int device = 0; device < maxDevices; device++) {\n cudaMemPrefetchAsync(dataPtr,\
    \ dataSize, device, stream);\n }\n // The kernel only reads this data in the inner\
    \ loop\n int innerLoopIter = 0;\n while (innerLoopIter < maxInnerLoopIter) {\n\
    \ kernel<<<32, 32>>>((const char *)dataPtr);\n innerLoopIter++;\n }\n outerLoopIter++;\n\
    }\n```\n\n+   **cudaMemAdviseSetPreferredLocation:** This advice sets the preferred\
    \ location for the data to be the memory belonging to **device**. Passing in a\
    \ value of **cudaCpuDeviceId** for **device** sets the preferred location as CPU\
    \ memory. Setting the preferred location does not cause data to migrate to that\
    \ location immediately."
  merge: -1
  img_proc: true
- pgno: 343
  md: "Instead, it guides the migration policy when a fault occurs on that memory\
    \ region. If the data is already in its preferred location and the faulting processor\
    \ can establish a mapping without requiring the data to be migrated, then the\
    \ migration will be avoided. On the other hand, if the data is not in its preferred\
    \ location or if a direct mapping cannot be established, then it will be migrated\
    \ to the processor accessing it. It is important to note that setting the preferred\
    \ location does not prevent data prefetching done using cudaMemPrefetchAsync.\n\
    \n+   cudaMemAdviseSetAccessedBy: This advice implies that the data will be accessed\
    \ by device. This does not cause data migration and has no impact on the location\
    \ of the data per se. Instead, it causes the data to always be mapped in the specified\
    \ processor's page tables, as long as the location of the data permits a mapping\
    \ to be established. If the data gets migrated for any reason, the mappings are\
    \ updated accordingly. This advice is useful in scenarios where data locality\
    \ is not important, but avoiding faults is. Consider for example a system containing\
    \ multiple GPUs with peer-to-peer access enabled, where the data located on one\
    \ GPU is occasionally accessed by other GPUs. In such scenarios, migrating data\
    \ over to the other GPU is not as important because the accesses are infrequent\
    \ and the overhead of migration may be too high. But preventing faults can still\
    \ help improve performance, and so having a mapping set up in advance is useful.\
    \ Note that on CPU access of this data, the data may be migrated to CPU memory\
    \ because the CPU cannot access GPU memory directly. Any GPU that had the cudaMemAdviseSetAccessedBy\
    \ flag set for this data will now have its mapping updated to point to the page\
    \ in CPU memory.\n\nEach advice can be also unset by using one of the following\
    \ values: cudaMemAdviseUnsetReadMostly, cudaMemAdviseUnsetPreferredLocation and\
    \ cudaMemAdviseUnsetAccessedBy.\n\n# K.3.3. Querying Usage Attributes\n\nA program\
    \ can query memory range attributes assigned through cudaMemAdvise or cudaMemPrefetchAsync\
    \ by using the following API:\n\n```\ncudaMemRangeGetAttribute(void *data,\n size_t\
    \ dataSize,\n enum cudaMemRangeAttribute attribute,\n const void *devPtr,\n size_t\
    \ count);\n```\n\nThis function queries an attribute of the memory range starting\
    \ at devPtr with a size of count bytes. The memory range must refer to managed\
    \ memory allocated via cudaMallocManaged or declared via __managed__ variables.\
    \ It is possible to query the following attributes:\n\n+   cudaMemRangeAttributeReadMostly:\
    \ the result returned will be 1 if all pages in the given memory range have read-duplication\
    \ enabled, or 0 otherwise.\n\n+   cudaMemRangeAttributePreferredLocation: the\
    \ result returned will be a GPU device id or cudaCpuDeviceId if all pages in the\
    \ memory range have the corresponding processor as their preferred location, otherwise\
    \ cudaInvalidDeviceId will be returned. An application can use this query API\
    \ to make decision about staging data through CPU or GPU depending on the preferred"
  merge: -1
  img_proc: true
- pgno: 344
  md: 'location attribute of the managed pointer. Note that the actual location of
    the pages in the memory range at the time of the query may be different from the
    preferred location.


    +   cudaMemRangeAttributeAccessedBy: will return the list of devices that have
    that advise set for that memory range.


    +   cudaMemRangeAttributeLastPrefetchLocation: will return the last location to
    which all pages in the memory range were prefetched explicitly using cudaMemPrefetchAsync.
    Note that this simply returns the last location that the application requested
    to prefetch the memory range to. It gives no indication as to whether the prefetch
    operation to that location has completed or even begun.


    Additionally, multiple attributes can be queried by using corresponding cudaMemRangeGetAttributes
    function.'
