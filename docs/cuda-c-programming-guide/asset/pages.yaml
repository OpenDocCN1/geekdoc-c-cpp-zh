  md: "# Example:\n\n```\ntemplate <typename T>\n__global__ void Kern(T in) { in();\
    \ }\n\ntemplate <typename T>\nvoid bar4(void)\n{\n  auto lam1 = [] __device__\
    \ { return 10; };\n  kern<<<1,1>>>(lam1);\n}\n\nstruct C1_t { struct S1_t { };\
    \ friend int main(void); };\nint main()\n{\n  struct S1_t { };\n  // Error: enclosing\
    \ function for device lambda in bar4\n  // is instantiated with a type local to\
    \ main.\n  bar4<S1_t>();\n\n  // Error: enclosing function for device lambda in\
    \ bar4\n  // is instantiated with a type that is a private member\n  // of a class.\n\
    \  bar4<C1_t::S1_t>();\n}\n```\n\n9. With Visual Studio 2013 and later Visual\
    \ Studio host compilers, the enclosing function must have external linkage. The\
    \ restriction is present because this host compiler does not support using the\
    \ address of non-extern linkage functions as template arguments, which is needed\
    \ by the CUDA compiler transformations to support extended lambdas.\n\n10. An\
    \ extended lambda has the following restrictions on captured variables:\n\n+ \
    \  * In the code sent to the host compiler, the variable may be passed by value\
    \ to a sequence of helper functions before being used to direct-initialize the\
    \ field of the class type used to represent the closure type for the extended\
    \ lambda²³.\n+   * A variable can only be captured by value.\n+   * A variable\
    \ of array type cannot be captured if the number of array dimensions is greater\
    \ than 7.\n+   * For a variable of array type, in the code sent to the host compiler,\
    \ the closure type's array field is first default-initialized, and then each element\
    \ of the array field is copy-assigned from the corresponding element of the captured\
    \ array variable. Therefore, the array element type must be default-constructible\
    \ and copy-assignable in host code.\n+   * A function parameter that is an element\
    \ of a variadic argument pack cannot be captured.\n+   * The type of the captured\
    \ variable cannot involve types that are either local to a function (except for\
    \ closure types of extended lambdas), or are private or protected class members.\n\
    +   * For a `__host__ __device__` extended lambda, the types used in the return\
    \ or parameter types of the lambda expression's `operator()` cannot involve types\
    \ that are either local to a function (except for closure types of extended lambdas),\
    \ or are private or protected class members.\n\n23 In contrast, the C++ standard\
    \ specifies that the captured variable is used to direct-initialize the field\
    \ of the closure type."
