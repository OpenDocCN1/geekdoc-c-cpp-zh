    # Notes


    For __all_sync, __any_sync, and __ballot_sync, a mask must be passed that specifies
    the threads participating in the call. A bit, representing the thread''s lane
    ID, must be set for each participating thread to ensure they are properly converged
    before the intrinsic is executed by the hardware. All active threads named in
    mask must execute the same intrinsic with the same mask, or the result is undefined.


    # B.15. Warp Match Functions


    __match_any_sync and __match_all_sync perform a broadcast-and-compare operation
    of a variable between threads within a warp.


    Supported by devices of compute capability 7.x or higher.


    # B.15.1. Synopsys


    ```

    unsigned int __match_any_sync(unsigned mask, T value);

    unsigned int __match_all_sync(unsigned mask, T value, int

    *pred);

    ```


    T can be int, unsigned int, long, unsigned long, long long, unsigned long long,
    float or double.


    # B.15.2. Description


    The __match_sync() intrinsics permit a broadcast-and-compare of a value value
    across threads in a warp after synchronizing threads named in mask.


    __match_any_sync

    Returns mask of threads that have same value of value in mask


    __match_all_sync

    Returns mask if all threads in mask have the same value for value; otherwise 0
    is returned. Predicate pred is set to true if all threads in mask have the same
    value of value; otherwise the predicate is set to false.


    The new *_sync match intrinsics take in a mask indicating the threads participating
    in the call. A bit, representing the thread''s lane id, must be set for each participating
    thread to ensure they are properly converged before the intrinsic is executed
    by the hardware. All non-exited threads named in mask must execute the same intrinsic
    with the same mask, or the result is undefined.'
