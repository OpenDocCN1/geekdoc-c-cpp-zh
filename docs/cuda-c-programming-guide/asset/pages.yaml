  md: '# B.17.2. Sub-byte Operations


    Sub-byte WMMA operations provide a way to access the low-precision capabilities
    of Tensor Cores. They are considered a preview feature i.e. the data structures
    and APIs for them are subject to change and may not be compatible with future
    releases. This functionality is available via the `nvcuda::wmma::experimental`
    namespace:


    ```

    namespace experimental {

    namespace precision {

    // 4-bit

    struct u4; // 4-bit unsigned

    struct s4; // 4-bit signed

    struct b1; // 1-bit

    }

    enum bmmaBitOp { bmmaBitOpXOR = 1, };

    enum bmmaAccumulateOps { bmmaAccumulateOpPOPC = 1 };

    }

    ```


    For 4 bit precision, the APIs available remain the same, but you must specify
    `experimental::precision::u4` or `experimental::precision::s4` as the fragment
    data type. Since the elements of the fragment are packed together, num_storage_elements
    will be smaller than num_elements for that fragment. This is true for single bit
    precision as well, in which case, the mapping from `element_type<T>` to `storage_element_type<T>`
    is as follows:


    ```

    experimental::precision::u4 -> unsigned (6 elements in 1 storage element)

    experimental::precision::s4 -> int (8 elements in 1 storage element)

    experimental::precision::b1 -> unsigned (32 elements in 1 storage element)

    all other types T -> T

    ```


    The allowed layouts for sub-byte fragments is always `row_major` for `matrix_a`
    and `col_major` for `matrix_b`.


    **bma_sync**


    Waits until all warp lanes have executed bma_sync, and then performs the warp-synchronous
    bit matrix multiply-accumulate operation D = (A op B) + C, where op consists of
    a logical operation `bmmaBitOp` followed by the accumulation defined by `bmmaAccumulateOp`.
    The only available op is a `bmmaBitOpXOR`, a 128-bit XOR of a row in `matrix_a`
    with the 128-bit column of `matrix_b`, followed by a `bmmaAccumulateOpPOPC` which
    counts the number of set bits.


    # B.17.3. Restrictions


    The special format required by tensor cores may be different for each major and
    minor device architecture. This is further complicated by threads holding only
    a fragment (opaque architecture-specific ABI data structure) of the overall matrix,
    with the developer not allowed to make assumptions on how the individual parameters
    are mapped to the registers participating in the matrix multiply-accumulate.


    Since fragments are architecture-specific, it is unsafe to pass them from function
    A to function B if the functions have been compiled for different link-compatible
    architectures and linked together into the same device executable. In this case,
    the size'
