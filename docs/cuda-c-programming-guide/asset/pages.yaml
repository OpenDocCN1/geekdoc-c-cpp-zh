  md: '# D.3.3.2. Compiling and Linking


    CUDA programs are automatically linked with the host runtime library when compiled
    with _nvcc_, but the device runtime is shipped as a static library which must
    explicitly be linked with a program which wishes to use it.


    The device runtime is offered as a static library (**cudadevrt.lib** on Windows,
    **libcudadevrt.a** under Linux and MacOS), against which a GPU application that
    uses the device runtime must be linked. Linking of device libraries can be accomplished
    through _nvcc_ and/or _nvlink_. Two simple examples are shown below.


    A device runtime program may be compiled and linked in a single step, if all required
    source files can be specified from the command line:


    ```

    $ nvcc -arch=sm_35 -rdc=true hello_world.cu -o hello -lcudadevrt

    ```


    It is also possible to compile CUDA .cu source files first to object files, and
    then link these together in a two-stage process:


    ```

    $ nvcc -arch=sm_35 -dc hello_world.cu -o hello_world.o

    $ nvcc -arch=sm_35 -rdc=true hello_world.o -o hello -lcudadevrt

    ```


    Please see the Using Separate Compilation section of _The CUDA Driver Compiler
    NVCC_ guide for more details.


    # D.4. Programming Guidelines


    # D.4.1. Basics


    The device runtime is a functional subset of the host runtime. API level device
    management, kernel launching, device memcpy, stream management, and event management
    are exposed from the device runtime.


    Programming for the device runtime should be familiar to someone who already has
    experience with CUDA. Device runtime syntax and semantics are largely the same
    as that of the host API, with any exceptions detailed earlier in this document.'
