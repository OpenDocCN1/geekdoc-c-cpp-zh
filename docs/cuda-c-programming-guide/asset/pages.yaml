  md: '# B.22. Execution Configuration


    Any call to a `__global__` function must specify the _execution configuration_
    for that call. The execution configuration defines the dimension of the grid and
    blocks that will be used to execute the function on the device, as well as the
    associated stream (see CUDA Runtime for a description of streams).


    The execution configuration is specified by inserting an expression of the form
    `<<< Dg, Db, Ns, S >>>` between the function name and the parenthesized argument
    list, where:


    +   Dg is of type dim3 (see dim3) and specifies the dimension and size of the
    grid, such that Dg.x * Dg.y * Dg.z equals the number of blocks being launched;


    +   Db is of type dim3 (see dim3) and specifies the dimension and size of each
    block, such that Db.x * Db.y * Db.z equals the number of threads per block;


    +   Ns is of type size_t and specifies the number of bytes in shared memory that
    is dynamically allocated per block for this call in addition to the statically
    allocated memory; this dynamically allocated memory is used by any of the variables
    declared as an external array as mentioned in `__shared__` Ns is an optional argument
    which defaults to 0;


    +   S is of type cudaStream_t and specifies the associated stream; S is an optional
    argument which defaults to 0.


    As an example, a function declared as


    ```

    __global__ void Func(Float* parameter);

    ```


    must be called like this:


    ```

    Func<<< Dg, Db, Ns >>>(parameter);

    ```


    The arguments to the execution configuration are evaluated before the actual function
    arguments.


    The function call will fail if Dg or Db are greater than the maximum sizes allowed
    for the device as specified in Compute Capabilities, or if Ns is greater than
    the maximum amount of shared memory available on the device, minus the amount
    of shared memory required for static allocation.


    # B.23. Launch Bounds


    As discussed in detail in Multiprocessor Level, the fewer registers a kernel uses,
    the more threads and thread blocks are likely to reside on a multiprocessor, which
    can improve performance.


    Therefore, the compiler uses heuristics to minimize register usage while keeping
    register spilling (see Device Memory Accesses) and instruction count to a minimum.'
  merge: -1
  img_proc: true
- pgno: 196
  md: "An application can optionally aid these heuristics by providing additional\
    \ information to the compiler in the form of launch bounds that are specified\
    \ using the `__launch_bounds__()` qualifier in the definition of a `__global__`\
    \ function:\n\n```\n__global__ void\nlaunch_bounds__(maxThreadsPerBlock, minBlocksPerMultiprocessor)\n\
    MyKernel(...) {\n    ...\n}\n```\n\n+   maxThreadsPerBlock specifies the maximum\
    \ number of threads per block with which the application will ever launch MyKernel();\
    \ it compiles to the .maxtntid PTX directive;\n\n+   minBlocksPerMultiprocessor\
    \ is optional and specifies the desired minimum number of resident blocks per\
    \ multiprocessor; it compiles to the .minnctapersm PTX directive.\n\nIf launch\
    \ bounds are specified, the compiler first derives from them the upper limit L\
    \ on the number of registers the kernel should use to ensure that minBlocksPerMultiprocessor\
    \ blocks (or a single block if minBlocksPerMultiprocessor is not specified) of\
    \ maxThreadsPerBlock threads can reside on the multiprocessor (see Hardware Multithreading\
    \ for the relationship between the number of registers used by a kernel and the\
    \ number of registers allocated per block). The compiler then optimizes register\
    \ usage in the following ways:\n\n+   If the initial register usage is higher\
    \ than L, the compiler reduces it further until it becomes less or equal to L,\
    \ usually at the expense of more local memory usage and/or higher number of instructions;\n\
    \n+   If the initial register usage is lower than L\n\n+   If maxThreadsPerBlock\
    \ is specified and minBlocksPerMultiprocessor is not, the compiler uses maxThreadsPerBlock\
    \ to determine the register usage thresholds for the transitions between n and\
    \ n+1 resident blocks (i.e., when using one less register makes room for an additional\
    \ resident block as in the example of Multiprocessor Level) and then applies similar\
    \ heuristics as when no launch bounds are specified;\n\n+   If both minBlocksPerMultiprocessor\
    \ and maxThreadsPerBlock are specified, the compiler may increase register usage\
    \ as high as L to reduce the number of instructions and better hide single thread\
    \ instruction latency.\n\nA kernel will fail to launch if it is executed with\
    \ more threads per block than its launch bound maxThreadsPerBlock."
  merge: -1
  img_proc: true
- pgno: 197
  md: "Optimal launch bounds for a given kernel will usually differ across major architecture\
    \ revisions. The sample code shows how this is typically handled in device code\
    \ using the `__CUDA_ARCH__` macro introduced in Application Compatibility\n\n\
    ```\n```cpp\n#define THREADS_PER_BLOCK 256\n#if CUDA_ARCH >= 200\n#define MY_KERNEL_MAX_THREADS\
    \ (2 * THREADS_PER_BLOCK)\n#define MY_KERNEL_MIN_BLOCKS 3\n#else\n#define MY_KERNEL_MAX_THREADS\
    \ THREADS_PER_BLOCK\n#define MY_KERNEL_MIN_BLOCKS 2\n#endif\n\n// Device code\n\
    global void\n__launch_bounds__(MY_KERNEL_MAX_THREADS, MY_KERNEL_MIN_BLOCKS)\n\
    MyKernel(...)\n{\n    ...\n}\n```\n```\n\nIn the common case where `MyKernel`\
    \ is invoked with the maximum number of threads per block (specified as the first\
    \ parameter of `__launch_bounds__()`), it is tempting to use `MY_KERNEL_MAX_THREADS`\
    \ as the number of threads per block in the execution configuration:\n\n```\n\
    ```cpp\n// Host code\nMyKernel<<<blocksPerGrid, MY_KERNEL_MAX_THREADS>>>(...);\n\
    ```\n```\n\nThis will not work however since `__CUDA_ARCH__` is undefined in host\
    \ code as mentioned in Application Compatibility, so `MyKernel` will launch with\
    \ 256 threads per block even when `__CUDA_ARCH__` is greater or equal to 200.\
    \ Instead the number of threads per block should be determined:\n\n+   - Either\
    \ at compile time using a macro that does not depend on `__CUDA_ARCH__`, for example\n\
    \n```\n```cpp\n// Host code\nMyKernel<<<blocksPerGrid, THREADS_PER_BLOCK>>>(...);\n\
    ```\n```\n\n+   - Or at runtime based on the compute capability\n\n```\n```cpp\n\
    // Host code\ncudaGetDeviceProperties(&deviceProp, device);\nint threadsPerBlock\
    \ =\n    (deviceProp.major >= 2 ? THREADS_PER_BLOCK : THREADS_PER_BLOCK);\nMyKernel<<<blocksPerGrid,\
    \ threadsPerBlock>>>(...);\n```\n```\n\nRegister usage is reported by the **--ptxas\
    \ options=-v** compiler option. The number of resident blocks can be derived from\
    \ the occupancy reported by the CUDA profiler (see Device Memory Accesses for\
    \ a definition of occupancy).\n\nRegister usage can also be controlled for all\
    \ `__global__` functions in a file using the **maxrregcount** compiler option.\
    \ The value of **maxrregcount** is ignored for functions with launch bounds."
