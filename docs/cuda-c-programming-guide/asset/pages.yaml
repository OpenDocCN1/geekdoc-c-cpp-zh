    \ when using the Microsoft host compiler.\n\n# F.3.10.5. Anonymous Unions\n\n\
    Member variables of a namespace scope anonymous union cannot be referenced in\
    \ a __global__ or __device__ function.\n\n# F.3.10.6. Windows-Specific\n\nThe\
    \ CUDA compiler follows the IA64 ABI for class layout, while the Microsoft host\
    \ compiler does not. Let T denote a pointer to member type, or a class type that\
