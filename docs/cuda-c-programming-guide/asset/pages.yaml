  md: "be set from the host prior to launch. Constant memory is inherited automatically\
    \ by all child kernels from their respective parents.\n\nTaking the address of\
    \ a constant memory object from within a kernel thread has the same semantics\
    \ as for all CUDA programs, and passing that pointer from parent to child or from\
    \ a child to parent is naturally supported.\n\n# D.2.2.1.4. Shared and Local Memory\n\
    \nShared and Local memory is private to a thread block or thread, respectively,\
    \ and is not visible or coherent between parent and child. Behavior is undefined\
    \ when an object in one of these locations is referenced outside of the scope\
    \ within which it belongs, and may cause an error.\n\nThe NVIDIA compiler will\
    \ attempt to warn if it can detect that a pointer to local or shared memory is\
    \ being passed as an argument to a kernel launch. At runtime, the programmer may\
    \ use the `__isGlobal()` intrinsic to determine whether a pointer references global\
    \ memory and so may safely be passed to a child launch.\n\nNote that calls to\
    \ `cudaMemcpy*Async()` ( or `cudaMemset*Async()` ) may invoke new child kernels\
    \ on the device in order to preserve stream semantics. As such, passing shared\
    \ or local memory pointers to these APIs is illegal and will return an error.\n\
    \n# D.2.2.2.1.5. Local Memory\n\nLocal memory is private storage for an executing\
    \ thread, and is not visible outside of that thread. It is illegal to pass a pointer\
    \ to local memory as a launch argument when launching a child kernel. The result\
    \ of dereferencing such a local memory pointer from a child will be undefined.\n\
    \nFor example the following is illegal, with undefined behavior if `x_array` is\
    \ accessed by `child_launch`:\n\n```\nint x_array[10];    // Creates x_array in\
    \ parent's local memory\nchild_launch<<< 1, 1 >>>(x_array);\n```\n\nIt is sometimes\
    \ difficult for a programmer to be aware of when a variable is placed into local\
    \ memory by the compiler. As a general rule, all storage passed to a child kernel\
    \ should be allocated explicitly from the global-memory heap, either with `cudaMalloc()`,\
    \ `new()` or by declaring `__device__` storage at global scope. For example:\n\
    \n```\n// Correct - \"value\" is global storage\n__device__ int value;\n__device__\
