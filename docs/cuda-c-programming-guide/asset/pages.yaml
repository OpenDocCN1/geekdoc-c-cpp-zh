    When a host thread calls cudaDeviceReset(), this destroys the primary context
    of the device the host thread currently operates on (i.e., the current device
    as defined in Device Selection). The next runtime function call made by any host
    thread that has this device as current will create a new primary context for this
    device.


    The CUDA interfaces use global state that is initialized during host program initiation
    and destroyed during host program termination. The CUDA runtime and driver cannot
    detect if this state is invalid, so using any of these interfaces (implicitly
    or explicitly) during program initiation or termination after main) will result
    in undefined behavior.


    # 3.2.2. Device Memory


    As mentioned in Heterogeneous Programming, the CUDA programming model assumes
    a system composed of a host and a device, each with their own separate memory.
    Kernels operate out of device memory, so the runtime provides functions to allocate,
    deallocate, and copy device memory, as well as transfer data between host memory
    and device memory.


    Device memory can be allocated either as linear memory or as CUDA arrays.


    CUDA arrays are opaque memory layouts optimized for texture fetching. They are
    described in Texture and Surface Memory.


    Linear memory is allocated in a single unified address space, which means that
    separately allocated entities can reference one another via pointers, for example,
    in a binary tree or linked list. The size of the address space depends on the
    host system (CPU) and the compute capability of the used GPU:


    # Table 1 Linear Memory Address Space


    | | x86_64 (AMD64) | POWER (ppc64le) | ARM64 |

    |---|---|---|---|

    | up to compute capability 5.3 (Maxwell) | 40bit | 40bit | 40bit |

    | compute capability 6.0 (Pascal) or newer | up to 47bit | up to 49bit | up to
    48bit |


    On devices of compute capability 5.3 (Maxwell) and earlier, the CUDA driver creates
    an uncommited 40bit virtual address reservation to ensure that memory allocations
    (pointers) fall into the supported range. This reservation appears as reserved
    virtual memory, but does not occupy any physical memory until the program actually
    allocates memory.


    Linear memory is typically allocated using cudaMalloc() and freed using cudaFree()
    and data transfer between host memory and device memory are typically done using'
