    \ / __constant__ / __shared__ variables\n\n__device__, __constant__ and __shared__\
    \ variables cannot be marked with the keyword constexpr.\n\n# F.3.16.10. Defaulted\
    \ functions\n\nExecution space specifiers on a function that is explicitly-defaulted\
    \ on its first declaration are ignored by the CUDA compiler. Instead, the CUDA\
    \ compiler will infer the execution space specifiers as described in Implicitly-declared\
    \ and explicitly-defaulted functions.\n\nExecution space specifiers are not ignored\
    \ if the function is explicitly-defaulted, but not on its first declaration.\n\
    \n# Example:\n\n```\nstruct S1 {\n    // warning: __host__ annotation is ignored\
