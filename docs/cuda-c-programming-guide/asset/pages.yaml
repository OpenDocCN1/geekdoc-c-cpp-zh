    # Single-Precision Floating-Point Division


    `__fdividef(x, y)` (see Intrinsic Functions) provides faster single-precision
    floating-point division than the division operator.


    # Single-Precision Floating-Point Reciprocal Square Root


    To preserve IEEE-754 semantics the compiler can optimize `1.0/sqrtf()` into `rsqrtf()`
    only when both reciprocal and square root are approximate, (i.e., with `-prec-div=false`
    and `-prec-sqrt=false`). It is therefore recommended to invoke `rsqrtf()` directly
    where desired.


    # Single-Precision Floating-Point Square Root


    Single-precision floating-point square root is implemented as a reciprocal square
    root followed by a reciprocal instead of a reciprocal square root followed by
    a multiplication so that it gives correct results for 0 and infinity.


    # Sine and Cosine


    `sinf(x)`, `cosf(x)`, `tanf(x)`, `sincosf(x)`, and corresponding double-precision
    instructions are much more expensive and even more so if the argument x is large
    in magnitude.


    More precisely, the argument reduction code (see Mathematical Functions for implementation)
    comprises two code paths referred to as the fast path and the slow path, respectively.


    The fast path is used for arguments sufficiently small in magnitude and essentially
    consists of a few multiply-add operations. The slow path is used for arguments
    large in magnitude and consists of lengthy computations required to achieve correct
    results over the entire argument range.


    At present, the argument reduction code for the trigonometric functions selects
    the fast path for arguments whose magnitude is less than 105615.0f for the single-precision
    functions, and less than 2147483648.0 for the double-precision functions.


    As the slow path requires more registers than the fast path, an attempt has been
    made to reduce register pressure in the slow path by storing some intermediate
    variables in local memory, which may affect performance because of local memory
    high latency and bandwidth (see Device Memory Accesses). At present, 28 bytes
    of local memory are used by single-precision functions, and 44 bytes are used
    by double-precision functions. However, the exact amount is subject to change.'
