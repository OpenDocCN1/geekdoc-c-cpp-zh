  md: "As an alternative to using **nvcc** to compile CUDA C++ device code, NVRTC\
    \ can be used to compile CUDA C++ device code to PTX at runtime. NVRTC is a runtime\
    \ compilation library for CUDA C++; more information can be found in the NVRTC\
    \ User guide.\n\n# ## 3.1.2. Binary Compatibility\n\nBinary code is architecture-specific.\
    \ A *cubin* object is generated using the compiler option `-code` that specifies\
    \ the targeted architecture: For example, compiling with `-code=sm_35` produces\
    \ binary code for devices of compute capability 3.5. Binary compatibility is guaranteed\
    \ from one minor revision to the next one, but not from one minor revision to\
    \ the previous one or across major revisions. In other words, a *cubin* object\
    \ generated for compute capability X.y will only execute on devices of compute\
    \ capability X.z where z≥y.\n\n> Binary compatibility is supported only for the\
    \ desktop. It is not supported for Tegra. Also, the binary compatibility between\
    \ desktop and Tegra is not supported.\n\n# ## 3.1.3. PTX Compatibility\n\nSome\
    \ *PTX* instructions are only supported on devices of higher compute capabilities.\
    \ For example, Warp Shuffle Functions are only supported on devices of compute\
    \ capability 3.0 and above. The `-arch` compiler option specifies the compute\
    \ capability that is assumed when compiling C++ to PTX code. So, code that contains\
    \ warp shuffle, for example, must be compiled with `-arch=compute_30` (or higher).\n\
    \nPTX code produced for some specific compute capability can always be compiled\
    \ to binary code of greater or equal compute capability. Note that a binary compiled\
    \ from an earlier PTX version may not make use of some hardware features. For\
    \ example, a binary targeting devices of compute capability 7.0 (Volta) compiled\
    \ from PTX generated for compute capability 6.0 (Pascal) will not make use of\
    \ Tensor Core instructions, since these were not available on Pascal. As a result,\
    \ the final binary may perform worse than would be possible if the binary were\
    \ generated using the latest version of PTX.\n\n# ## 3.1.4. Application Compatibility\n\
    \nTo execute code on devices of specific compute capability, an application must\
    \ load binary or PTX code that is compatible with this compute capability as described\
    \ in Binary Compatibility and PTX Compatibility. In particular, to be able to\
    \ execute code on future architectures with higher compute capability (for which\
    \ no binary code can be generated yet), an application must load PTX code that\
    \ will be just-in-time compiled for these devices (see Just-In-Time Compilation).\n\
    \nWhich PTX and binary code gets embedded in a CUDA C++ application is controlled\
    \ by the `-arch` and `-code` compiler options or the `-gencode` compiler option\
    \ as detailed in the **nvcc** user manual. For example,\n\n```\n```\nnvcc x.cu\
    \ \\\n    -gencode arch=compute_35,code=sm_35 \\\n    -gencode arch=compute_50,code=sm_50\
    \ \\\n    -gencode arch=compute_60,code=\\'compute_60,sm_60\\'\n```\n```"
