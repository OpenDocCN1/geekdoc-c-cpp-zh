    \n```\ntemplate<class DataType>\nType tex1Dfetch(\n    texture<DataType, cudaTextureTypeID,\n\
    \    cudaReadModeElementType> texRef,\n    int x);\n\nfloat tex1Dfetch(\n    texture<unsigned\
