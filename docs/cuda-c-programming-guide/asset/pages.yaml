    As cudaEventElapsedTime() is not supported, cudaEvents must be created via cudaEventCreateWithFlags(),
    passing the cudaEventDisableTiming flag.


    As for all device runtime objects, event objects may be shared between all threads
    within the thread-block which created them but are local to that block and may
    not be passed to other kernels, or between blocks within the same kernel. Event
    handles are not guaranteed to be unique between blocks, so using an event handle
    within a block that did not create it will result in undefined behavior.


    # D.3.1.4. Synchronization


    The cudaDeviceSynchronize() function will synchronize on all work launched by
    any thread in the thread-block up to the point where cudaDeviceSynchronize() was
    called. Note that cudaDeviceSynchronize() may be called from within divergent
    code (see Block Wide Synchronization).


    It is up to the program to perform sufficient additional inter-thread synchronization,
    for example via a call to __syncthreads(), if the calling thread is intended to
    synchronize with child grids invoked from other threads.


    # D.3.1.4.1. Block Wide Synchronization


    The cudaDeviceSynchronize() function does not imply intra-block synchronization.
    In particular, without explicit synchronization via a __syncthreads() directive
    the calling thread can make no assumptions about what work has been launched by
    any thread other than itself. For example if multiple threads within a block are
    each launching work and synchronization is desired for all this work at once (perhaps
    because of event-based dependencies), it is up to the program to guarantee that
    this work is submitted by all threads before calling cudaDeviceSynchronize().


    Because the implementation is permitted to synchronize on launches from any thread
    in the block, it is quite possible that simultaneous calls to cudaDeviceSynchronize()
    by multiple threads will drain all work in the first call and then have no effect
    for the later calls.


    # D.3.1.5. Device Management


    Only the device on which a kernel is running will be controllable from that kernel.
    This means that device APIs such as cudaSetDevice() are not supported by the device
    runtime. The active device as seen from the GPU (returned from cudaGetDevice())
    will have the same device number as seen from the host system. The cudaDeviceGetAttribute()
    call may request information about another device as this API allows specification
    of a device ID as a parameter of the call. Note that the catch-all cudaGetDeviceProperties()
    API is not offered by the device runtime - properties must be queried individually.


