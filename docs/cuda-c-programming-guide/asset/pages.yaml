  md: '# D.4.2.2. Dynamic-parallelism-enabled Kernel Overhead


    System software which is active when controlling dynamic launches may impose an
    overhead on any kernel which is running at the time, whether or not it invokes
    kernel launches of its own. This overhead arises from the device runtime''s execution
    tracking and management software and may result in decreased performance for e.g.,
    library calls when made from the device compared to from the host side. This overhead
    is, in general, incurred for applications that link against the device runtime
    library.


    # D.4.3. Implementation Restrictions and Limitations


    Dynamic Parallelism guarantees all semantics described in this document, however,
    certain hardware and software resources are implementation-dependent and limit
    the scale, performance and other properties of a program which uses the device
    runtime.


    # D.4.3.1. Runtime


    # D.4.3.1.1. Memory Footprint


    The device runtime system software reserves memory for various management purposes,
    in particular one reservation which is used for saving parent-grid state during
    synchronization, and a second reservation for tracking pending grid launches.
    Configuration controls are available to reduce the size of these reservations
    in exchange for certain launch limitations. See Configuration Options, below,
    for details.


    The majority of reserved memory is allocated as backing-store for parent kernel
    state, for use when synchronizing on a child launch. Conservatively, this memory
    must support storing of state for the maximum number of live threads possible
    on the device. This means that each parent generation at which cudaDeviceSynchronize()
    is callable may require up to 860MB of device memory, depending on the device
    configuration, which will be unavailable for program use even if it is not all
    consumed.


    # D.4.3.1.2. Nesting and Synchronization Depth


    Using the device runtime, one kernel may launch another kernel, and that kernel
    may launch another, and so on. Each subordinate launch is considered a new nesting
    level, and the total number of levels is the nesting depth of the program. The
    synchronization depth is defined as the deepest level at which the program will
    explicitly synchronize on a child launch. Typically this is one less than the
    nesting depth of the program, but if the program does not need to call cudaDeviceSynchronize()
    at all levels then the synchronization depth might be substantially different
    to the nesting depth.


