  md: '# # Appendix B. C++ LANGUAGE EXTENSIONS


    # ## B.1. Function Execution Space Specifiers


    Function execution space specifiers denote whether a function executes on the
    host or on the device and whether it is callable from the host or from the device.


    # ### B.1.1. __global__


    The __global__ execution space specifier declares a function as being a kernel.
    Such a function is:


    +   - Executed on the device,

    +   - Callable from the host,

    +   - Callable from the device for devices of compute capability 3.2 or higher
    (see CUDA Dynamic Parallelism for more details).


    A __global__ function must have void return type, and cannot be a member of a
    class.


    Any call to a __global__ function must specify its execution configuration as
    described in Execution Configuration.


    A call to a __global__ function is asynchronous, meaning it returns before the
    device has completed its execution.


    # ### B.1.2. __device__


    The __device__ execution space specifier declares a function that is:


    +   - Executed on the device,

    +   - Callable from the device only.


    The __global__ and __device__ execution space specifiers cannot be used together.'
  merge: -1
  img_proc: true
- pgno: 142
  md: '# B.1.3. __host__


    The __host__ execution space specifier declares a function that is:


    +   > Executed on the host,


    +   > Callable from the host only.


    It is equivalent to declare a function with only the __host__ execution space
    specifier or to declare it without any of the __host__, __device__, or __global__
    execution space specifier; in either case the function is compiled for the host
    only.


    The __global__ and __host__ execution space specifiers cannot be used together.


    The __device__ and __host__ execution space specifiers can be used together, however,
    in which case the function is compiled for both the host and the device.


    The __CUDA_ARCH__ macro introduced in Application Compatibility can be used to
    differentiate code paths between host and device:


    ```

    #ifndef __CUDA_ARCH__

    #if CUDA_ARCH >= 700

    // Device code path for compute capability 7.x

    #elif CUDA_ARCH >= 600

    // Device code path for compute capability 6.x

    #elif CUDA_ARCH >= 500

    // Device code path for compute capability 5.x

    #elif CUDA_ARCH >= 300

    // Device code path for compute capability 3.x

    #elif !defined(__CUDA_ARCH__)

    // Host code path

    #endif

    ```


    # B.1.4. __noinline__ and __forceinline__


