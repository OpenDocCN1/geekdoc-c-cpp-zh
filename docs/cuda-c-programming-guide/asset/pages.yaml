- pgno: 187
  md: 'Unlike the C-standard `printf()`, which returns the number of characters printed,
    CUDA''s `printf()` returns the number of arguments parsed. If no arguments follow
    the format string, 0 is returned. If the format string is NULL, -1 is returned.
    If an internal error occurs, -2 is returned.


    # B.20.1. Format Specifiers


    As for standard `printf()`, format specifiers take the form: `% [flags] [width]
    [.precision] [size] type`


    The following fields are supported (see widely-available documentation for a complete
    description of all behaviors):


    +   > Flags: ''#'' '' '' ''0'' ''+'' ''-'' ''''

    +   > Width: ''*'' ''0''-''9''

    +   > Precision: ''0''-''9''

    +   > Size: ''h'' ''l'' ''ll''

    +   > Type: "%diousXxEeFgGaAs"


    Note that CUDA''s `printf()` will accept any combination of flag, width, precision,
    size and type, whether or not overall they form a valid format specifier. In other
    words, "%hd" will be accepted and printf will expect a double-precision variable
    in the corresponding location in the argument list.


    # B.20.2. Limitations


    Final formatting of the `printf()` output takes place on the host system. This
    means that the format string must be understood by the host-system''s compiler
    and C library. Every effort has been made to ensure that the format specifiers
    supported by CUDA''s printf function form a universal subset from the most common
    host compilers, but exact behavior will be host-OS-dependent.


    As described in Format Specifiers, `printf()` will accept *all* combinations of
    valid flags and types. This is because it cannot determine what will and will
    not be valid on the host system where the final output is formatted. The effect
    of this is that output may be undefined if the program emits a format string which
    contains invalid combinations.


    The `printf()` command can accept at most 32 arguments in addition to the format
    string. Additional arguments beyond this will be ignored, and the format specifier
    output as-is.


    Owing to the differing size of the `long` type on 64-bit Windows platforms (four
    bytes on 64-bit Windows platforms, eight bytes on other 64-bit platforms), a kernel
    which is compiled on a non-Windows 64-bit machine but then run on a win64 machine
    will see corrupted output for all format strings which include "%ld". It is recommended
    that the compilation platform matches the execution platform to ensure safety.'
