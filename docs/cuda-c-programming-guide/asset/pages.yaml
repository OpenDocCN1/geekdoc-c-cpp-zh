  md: "spent executing thread instructions. The former number is greater than the\
    \ latter since threads are time sliced.\n\n# B.12. Atomic Functions\n\nAn atomic\
    \ function performs a read-modify-write atomic operation on one 32-bit or 64-bit\
    \ word residing in global or shared memory. For example, `atomicAdd()` reads a\
    \ word at some address in global or shared memory, adds a number to it, and writes\
    \ the result back to the same address. The operation is atomic in the sense that\
    \ it is guaranteed to be performed without interference from other threads. In\
    \ other words, no other thread can access this address until the operation is\
    \ complete. Atomic functions do not act as memory fences and do not imply synchronization\
    \ or ordering constraints for memory operations (see Memory Fence Functions for\
    \ more details on memory fences). Atomic functions can only be used in device\
    \ functions.\n\nOn GPU architectures with compute capability lower than 6.x, atomics\
    \ operations done from the GPU are atomic only with respect to that GPU. If the\
    \ GPU attempts an atomic operation to a peer GPU's memory, the operation appears\
    \ as a regular read followed by a write to the peer GPU, and the two operations\
    \ are not done as one single atomic operation. Similarly, atomic operations from\
    \ the GPU to CPU memory will not be atomic with respect to CPU initiated atomic\
    \ operations.\n\nCompute capability 6.x introduces new type of atomics which allows\
    \ developers to widen or narrow the scope of an atomic operation. For example,\
    \ `atomicAdd_system` guarantees that the instruction is atomic with respect to\
    \ other CPUs and GPUs in the system. `atomicAdd_block` implies that the instruction\
    \ is atomic only with respect to atomics from other threads in the same thread\
    \ block. In the following example both CPU and GPU can atomically update integer\
    \ value at address `addr`:\n\n```\n__global__ void mykernel(int *addr) {\n   \
    \ atomicAdd_system(addr, 10); // only available on devices with compute\n    capability\
    \ 6.x\n}\n\nvoid foo() {\n    int *addr;\n    cudaMallocManaged(&addr, 4);\n \
    \   *addr = 0;\n\n    mykernel<<<..., >>>(addr);\n    __sync_fetch_and_add(addr,\
    \ 10); // CPU atomic operation\n}\n```\n\n> System wide atomics are not supported\
    \ on Tegra devices with compute capability less than 7.2.\n\nThe new scoped versions\
    \ of atomics are available for all atomics listed below only for compute capabilities\
    \ 6.x and later."
  merge: -1
  img_proc: true
- pgno: 170
  md: "Note that any atomic operation can be implemented based on **atomicCAS()**\
    \ ( Compare And Swap). For example, **atomicAdd()** for double-precision floating-point\
    \ numbers is not available on devices with compute capability lower than 6.0 but\
    \ it can be implemented as follows:\n\n```\n#if __CUDA_ARCH__ < 600\n__device__\
    \ double atomicAdd(double* address, double val)\n{\n    unsigned long long int*\
    \ address_as_ull =\n                              (unsigned long long int*)address;\n\
    \    unsigned long long int old = *address_as_ull, assumed;\n    do {\n      \
    \  assumed = old;\n        old = atomicCAS(address_as_ull, assumed,\n        \
    \                __double_as_longlong(val +\n                        __longlong_as_double(assumed)));\n\
    \    } // Note: uses integer comparison to avoid hang in case of NaN (since NaN\
    \ != NaN)\n    while (assumed != old);\n    return __longlong_as_double(old);\n\
    }\n#endif\n```\n\n# B.12.1. Arithmetic Functions\n\n# B.12.1.1. atomicAdd()\n\n\
    ```\nint atomicAdd(int* address, int val);\nunsigned int atomicAdd(unsigned int*\
    \ address,\n                       unsigned int val);\nunsigned long long int\
    \ atomicAdd(unsigned long long int* address,\n                               \
    \  unsigned long long int val);\nfloat atomicAdd(float* address, float val);\n\
    double atomicAdd(double* address, double val);\n__half2 atomicAdd(__half2* address,\
    \ __half2 val);\n__half atomicAdd(__half* address, __half val);\n```\n\nreads\
    \ the 16-bit, 32-bit or 64-bit word old located at the address **address** in\
    \ global or shared memory, computes (**old + val**), and stores the result back\
    \ to memory at the same address. These three operations are performed in one atomic\
    \ transaction. The function returns old.\n\nThe 32-bit floating-point version\
    \ of **atomicAdd()** is only supported by devices of compute capability 2.x and\
    \ higher.\n\nThe 64-bit floating-point version of **atomicAdd()** is only supported\
    \ by devices of compute capability 6.x and higher.\n\nThe 32-bit __half2 floating-point\
    \ version of **atomicAdd()** is only supported by devices of compute capability\
    \ 6.x and higher. The atomicity of the __half2 add operation is guaranteed separately\
    \ for each of the two __half elements; the entire __half2 is not guaranteed to\
    \ be atomic as a single 32-bit access.\n\nThe 16-bit __half floating-point version\
    \ of **atomicAdd()** is only supported by devices of compute capability 7.x and\
    \ higher."
