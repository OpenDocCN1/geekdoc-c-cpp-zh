  md: 'L2 cache available on devices of compute capability 2.x and higher, texture
    cache and constant cache available on all devices).


    Shared memory is equivalent to a user-managed cache: The application explicitly
    allocates and accesses it. As illustrated in CUDA Runtime, a typical programming
    pattern is to stage data coming from device memory into shared memory; in other
    words, to have each thread of a block:


    +   - Load data from device memory to shared memory,

    +   - Synchronize with all the other threads of the block so that each thread
    can safely read shared memory locations that were populated by different threads,

    +   - Process the data in shared memory,

    +   - Synchronize again if necessary to make sure that shared memory has been
    updated with the results,

    +   - Write the results back to device memory.


    For some applications (e.g., for which global memory access patterns are data-dependent),
    a traditional hardware-managed cache is more appropriate to exploit data locality.
    As mentioned in Compute Capability 3.x and Compute Capability 7.x, for devices
    of compute capability 3.x and 7.x, the same on-chip memory is used for both L1
    and shared memory, and how much of it is dedicated to L1 versus shared memory
    is configurable for each kernel call.


    The throughput of memory accesses by a kernel can vary by an order of magnitude
    depending on access pattern for each type of memory. The next step in maximizing
    memory throughput is therefore to organize memory accesses as optimally as possible
    based on the optimal memory access patterns described in Device Memory Accesses.
    This optimization is especially important for global memory accesses as global
    memory bandwidth is low compared to available on-chip bandwidths and arithmetic
    instruction throughput, so non-optimal global memory accesses generally have a
    high impact on performance.


    # 5.3.1. Data Transfer between Host and Device


    Applications should strive to minimize data transfer between the host and the
    device. One way to accomplish this is to move more code from the host to the device,
    even if that means running kernels that do not expose enough parallelism to execute
    on the device with full efficiency. Intermediate data structures may be created
    in device memory, operated on by the device, and destroyed without ever being
    mapped by the host or copied to host memory.


    Also, because of the overhead associated with each transfer, batching many small
    transfers into a single large transfer always performs better than making each
    transfer separately.


    On systems with a front-side bus, higher performance for data transfers between
    host and device is achieved by using page-locked host memory as described in Page-Locked
    Host Memory.


    In addition, when using mapped page-locked memory (Mapped Memory), there is no
    need to allocate any device memory and explicitly copy data between device and
    host memory. Data transfers are implicitly performed each time the kernel accesses
    the'
