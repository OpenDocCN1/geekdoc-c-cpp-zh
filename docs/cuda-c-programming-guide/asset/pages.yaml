    \ in host code.\n\nAccessing an object of type C or any subobject in host code,\
    \ or invoking a member function in host code, has undefined behavior if the object\
    \ is created in device code 13.\n\n# F.3.11. Templates\n\nA type or template cannot\
    \ be used in the type, non-type or template template argument of a `__global__`\
    \ function template instantiation or a `__device__`/`__constant__` variable instantiation\
    \ if either:\n\n+   - The type or template is defined within a `__host__` or `__host__\
    \ __device__`.\n+   - The type or template is a class member with `private` or\
    \ `protected` access and its parent class is not defined within a `__device__`\
    \ or `__global__` function.\n+   - The type is unnamed.\n+   - The type is compounded\
    \ from any of the types above.\n\n# Example:\n\n```\ntemplate <typename T>\n__global__\
    \ void myKernel(void) {}\n\nclass myClass {\nprivate:\n    struct inner_t {};\n\
    public:\n    static void launch(void)\n    {\n        // error: inner_t is used\
    \ in template argument\n        // but it is private\n        myKernel<inner_t><<<1,1>>>(\
    \ );\n    }\n};\n\n// C++14 only\ntemplate <typename T> __device__ T d1;\ntemplate\
    \ <typename T1, typename T2> __device__ T1 d2;\n\nvoid fn() {\n    struct S1_t\
    \ {};\n    // error (C++14 only): S1_t is local to the function fn\n    d1<S1_t>\
    \ = {};\n\n    auto lam1 = [] {};\n    // error (C++14 only): a closure type cannot\
    \ be used for\n    // instantiating a variable template\n    d2<int, decltype(lam1)>\
    \ = 10;\n}\n```\n\n# F.3.12. Trigraphs and Digraphs\n\nTrigraphs are not supported\
    \ on any platform. Digraphs are not supported on Windows.\n\n13 One way to debug\
    \ suspected layout mismatch of a type C is to use `printf` to output the values\
    \ of `sizeof(C)` and `offsetof(C, field)` in host and device code."
