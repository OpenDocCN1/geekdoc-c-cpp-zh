    \ texRef,\n    int x);\n\nfloat tex1Dfetch(\n    texture<unsigned short, cudaTextureTypeID,\n\
    \    cudaReadModeNormalizedFloat> texRef,\n    int x);\n\nfloat tex1Dfetch(\n\
    \    texture<signed short, cudaTextureTypeID,\n    cudaReadModeNormalizedFloat>\
    \ texRef,\n    int x);\n```\n\nfetches from the region of linear memory bound\
    \ to the one-dimensional texture reference `texRef` using integer texture coordinate\
    \ `x`. `tex1Dfetch()` only works with non-normalized coordinates, so only the\
    \ border and clamp addressing modes are supported. It does not perform any texture\
    \ filtering. For integer types, it may optionally promote the integer to single-precision\
    \ floating point.\n\nBesides the functions shown above, 2-, and 4-tuples are supported;\
    \ for example:\n\n```\nfloat4 tex1Dfetch(\n    texture<uchar4, cudaTextureTypeID,\n\
    \    cudaReadModeNormalizedFloat> texRef,\n    int x);\n```\n\nfetches from the\
    \ region of linear memory bound to texture reference `texRef` using texture coordinate\
    \ `x`.\n\n# ### B.8.2.2. tex1D()\n\n```\ntemplate<class DataType, enum cudaTextureReadMode\
    \ readMode>\nType tex1D(texture<DataType, cudaTextureTypeID, readMode> texRef,\n\
    \           float x);\n```\n\nfetches from the CUDA array bound to the one-dimensional\
