    \    __host__ S1() = default;\n};\n\ndevice__ void foo1() {\n    // note: __device__\
    \ execution space is derived for S1::S1\n    //        Based on implicit call\
    \ from within __device__ function\n    //        foo1\n    S1 s1;\n}\n\nstruct\
    \ S2 {\n    __host__ S2();\n};\n\n// note: S2::S2 is not defaulted on its first\
