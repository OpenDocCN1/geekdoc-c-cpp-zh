    # ## D.3. Programming Interface


    # ## D.3.1. CUDA C++ Reference


    This section describes changes and additions to the CUDA C++ language extensions
    for supporting Dynamic Parallelism.


    The language interface and API available to CUDA kernels using CUDA C++ for Dynamic
    Parallelism, referred to as the Device Runtime, is substantially like that of
    the CUDA Runtime API available on the host. Where possible the syntax and semantics
    of the CUDA Runtime API have been retained in order to facilitate ease of code
    reuse for routines that may run in either the host or device environments.


    As with all code in CUDA C++, the APIs and code outlined here is per-thread code.
    This enables each thread to make unique, dynamic decisions regarding what kernel
    or operation to execute next. There are no synchronization requirements between
    threads within a block to execute any of the provided device runtime APIs, which
    enables the device runtime API functions to be called in arbitrarily divergent
    kernel code without deadlock.


    # ## D.3.1.1. Device-Side Kernel Launch


    Kernels may be launched from the device using the standard CUDA <<< >>> syntax:


    ```

    kernel_name<<< Dg, Db, Ns, S >>>(kernel arguments);

    ```


    +   - Dg is of type dim3 and specifies the dimensions and size of the grid

    +   - Db is of type dim3 and specifies the dimensions and size of each thread
    block

    +   - Ns is of type size_t and specifies the number of bytes of shared memory
    that is dynamically allocated per thread block for this call and addition to statically
    allocated memory. Ns is an optional argument that defaults to 0.

    +   - S is of type cudaStream_t and specifies the stream associated with this
    call. The stream must have been allocated in the same thread block where the call
    is being made. S is an optional argument that defaults to 0.


    # ## D.3.1.1.1. Launches are Asynchronous


    Identical to host-side launches, all device-side kernel launches are asynchronous
    with respect to the launching thread. That is to say, the <<<<< launch command
    will return immediately and the launching thread will continue to execute until
    it hits an explicit launch-synchronization point such as cudaDeviceSynchronize().
    The grid launch is posted to the device and will execute independently of the
    parent thread. The child grid'
