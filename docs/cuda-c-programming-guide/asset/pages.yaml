    A call to `cudaStreamBeginCapture()` places a stream in capture mode. When a stream
    is being captured, work launched into the stream is not enqueued for execution.
    It is instead appended to an internal graph that is progressively being built
    up. This graph is then returned by calling `cudaStreamEndCapture()`, which also
    ends capture mode for the stream. A graph which is actively being constructed
    by stream capture is referred to as a *capture graph*.


    Stream capture can be used on any CUDA stream except `cudaStreamLegacy` (the "NULL
    stream"). Note that it *can* be used on `cudaStreamPerThread`. If a program is
    using the legacy stream, it may be possible to redefine stream 0 to be the per-thread
    stream with no functional change. See Default Stream.


    Whether a stream is being captured can be queried with `cudaStreamIsCapturing()`.


    # 3.2.5.6.3.1. Cross-stream Dependencies and Events


    Stream capture can handle cross-stream dependencies expressed with `cudaEventRecord()`
    and `cudaStreamWaitEvent()`, provided the event being waited upon was recorded
    into the same capture graph.


    When an event is recorded in a stream that is in capture mode, it results in a
    *captured event*. A captured event represents a set of nodes in a capture graph.


    When a captured event is waited on by a stream, it places the stream in capture
    mode if it is not already, and the next item in the stream will have additional
    dependencies on the nodes in the captured event. The two streams are then being
    captured to the same capture graph.


    When cross-stream dependencies are present in stream capture, `cudaStreamEndCapture()`
    must still be called in the same stream where `cudaStreamBeginCapture()` was called;
    this is the *origin stream*. Any other streams which are being captured to the
