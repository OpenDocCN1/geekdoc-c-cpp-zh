  md: '# 3.2.11.2.2. Surface Reference API


    A surface reference is declared at file scope as a variable of type surface:


    ```

    surface<void, Type> surfRef;

    ```


    where `Type` specifies the type of the surface reference and is equal to `cudaSurfaceType1D`,
    `cudaSurfaceType2D`, `cudaSurfaceType3D`, `cudaSurfaceTypeCubemap`, `cudaSurfaceType1DLayered`,
    `cudaSurfaceType2DLayered`, or `cudaSurfaceTypeCubemapLayered`; `Type` is an optional
    argument which defaults to `cudaSurfaceType1D`. A surface reference can only be
    declared as a static global variable and cannot be passed as an argument to a
    function.


    Before a kernel can use a surface reference to access a CUDA array, the surface
    reference must be bound to the CUDA array using `cudaBindSurfaceToArray()`.


    The following code samples bind a surface reference to a CUDA array `cuArray`:


    +   Using the low-level API:


    ```

    surface<void, cudaSurfaceType2D> surfRef;

    surfaceReference* surfRefPtr;

    cudaGetSurfaceReference(&surfRefPtr, "surfRef");

    cudaChannelFormatDesc channelDesc;

    cudaGetChannelDesc(&channelDesc, cuArray);

    cudaBindSurfaceToArray(surfRef, cuArray, channelDesc);

    ```


    +   Using the high-level API:


    ```

    surface<void, cudaSurfaceType2D> surfRef;

    cudaBindSurfaceToArray(surfRef, cuArray);

    ```


    A CUDA array must be read and written using surface functions of matching dimensionality
    and type and via a surface reference of matching dimensionality; otherwise, the
    results of reading and writing the CUDA array are undefined.


    Unlike texture memory, surface memory uses byte addressing. This means that the
    x-coordinate used to access a texture element via texture functions needs to be
    multiplied by the byte size of the element to access the same element via a surface
    function. For example, the element at texture coordinate x of a one-dimensional
    floating-point CUDA array bound to a texture reference `texRef` and a surface
    reference `surfRef` is read using `tex1D(texRef, x)` via `texRef`, but `surf1Dread(surfRef,
    4*x)` via `surfRef`. Similarly, the element at texture coordinate x and y of a
    two-dimensional floating-point CUDA array bound to a texture reference `texRef`
    and a surface reference `surfRef` is accessed using `tex2D(texRef, x, y)` via
    `texRef`, but `surf2Dread(surfRef, 4*x, y)` via `surfRef` (the byte offset of
    the y-coordinate is internally calculated from the underlying line pitch of the
    CUDA array).'
