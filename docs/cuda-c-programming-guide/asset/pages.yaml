  md: "# Example\n\n```\ntemplate <typename T>\n__global__ void Kernel(T in) { in();\
    \ }\n\n__host__ __device__ void foo(void)\n{\n    // Error: the number and relative\
    \ declaration\n    // order of extended lambdas depends on\n    // __CUDA_ARCH__\n\
    \n#if defined(__CUDA_ARCH__)\n    auto lam1 = [] __device__ { return 0; };\n \
    \   auto lamb = [] __host__ __device__ { return 10; };\n#endif\n    auto lam2\
    \ = [] __device__ { return 4; };\n    kernel<<<1,1>>>(lam2);\n}\n```\n\n12. As\
    \ described above, the CUDA compiler replaces a `__device__` extended lambda defined\
    \ in a host function with a placeholder type defined in namespace scope. This\
    \ placeholder type does not define an `operator()` function equivalent to the\
    \ original lambda declaration. An attempt to determine the return type or parameter\
    \ types of the `operator()` function may therefore work incorrectly in host code,\
    \ as the code processed by the host compiler will be semantically different than\
    \ the input code processed by the CUDA compiler. However, it is ok to introspect\
    \ the return type or parameter types of the `operator()` function within device\
    \ code. Note that this restriction does not apply to `__host__ __device__` extended\
    \ lambdas.\n\n# Example\n\n```\n#include <type_traits>\n\nvoid foo(void)\n{\n\
    \    auto lam1 = [] __device__ { return 10; };\n    // Error: attempt to extract\
    \ the return type\n    // of a __device__ lambda in host code\n    std::result_of<decltype(lam1)()>::type\
    \ xx1 = 1;\n\n    auto lam2 = [] __host__ __device__ { return 10; };\n    // OK\
    \ : lam2 represents a __host__ __device__ extended lambda\n    std::result_of<decltype(lam2)()>::type\
    \ xx2 = 1;\n}\n```\n\n13. If the functor object represented by an extended lambda\
    \ is passed from host to device code (e.g., as the argument of a `__global__`\
    \ function), then any expression in the body of the lambda expression that captures\
    \ variables must be remain unchanged irrespective of whether the `__CUDA_ARCH__`\
    \ macro is defined, and whether the macro has a particular value. This restriction\
    \ arises because the lambda's closure class layout depends on the order in which\
    \ captured variables are encountered when the compiler processes the lambda expression;\
    \ the program may execute incorrectly if the closure class layout differs in device\
    \ and host compilation."
