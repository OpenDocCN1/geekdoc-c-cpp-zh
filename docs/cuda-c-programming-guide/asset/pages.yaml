  md: 'and layout of the fragment will be specific to one architecture and using WMMA
    APIs in the other will lead to incorrect results or potentially, corruption.


    An example of two link-compatible architectures, where the layout of the fragment
    differs, is sm_70 and sm_75.


    ```

    fragA.cu: void foo() { wmma::fragment<...> mat_a; bar(smat_a); }

    fragB.cu: void bar(wmma::fragment<...> *mat_a) { // operates on mat_a }

    ```


    ```

    // sm_70 fragment layout

    $> nvcc -dc -arch=compute_70 -code=sm_70 fragA.cu -o fragA.o

    $> sm_75 fragment layout

    $> nvcc -dc -arch=compute_75 -code=sm_75 fragB.cu -o fragB.o

    // Linking the two together

    $> nvcc -dlink -arch=sm_75 fragA.o fragB.o -o frag.o

    ```


    This undefined behavior might also be undetectable at compilation time and by
    tools at runtime, so extra care is needed to make sure the layout of the fragments
    is consistent. This linking hazard is most likely to appear when linking with
    a legacy library that is both built for a different link-compatible architecture
    and expecting to be passed a WMMA fragment.


    Note that in the case of weak linkages (for example, a CUDA C++ inline function),
    the linker may choose any available function definition which may result in implicit
    passes between compilation units.


    To avoid these sorts of problems, the matrix should always be stored out to memory
    for transit through external interfaces (e.g. `wmma::store_matrix_sync(dst, ...)`)
    and then it can be safely passed to `bar()` as a pointer type [e.g. `float *dst`].


    Note that since sm_70 can run on sm_75, the above example sm_75 code can be changed
    to sm_70 and correctly work on sm_75. However, it is recommended to have sm_75
    native code in your application when linking with other sm_75 separately compiled
    binaries.


    # B.17.4. Element Types & Matrix Sizes


    Tensor Cores support a variety of element types and matrix sizes. The following
    table presents the various combinations of `matrix_a`, `matrix_b` and `accumulator`
    matrix supported:


    | Matrix A | Matrix B | Accumulator | Matrix Size (m-n-k) |

    |---|---|---|---|

    | __half | __half | float | 16x16x16 |

    | __half | __half | float | 32x8x16 |

    | __half | __half | float | 8x32x16 |

    | __half | __half | __half | 16x16x16 |'
