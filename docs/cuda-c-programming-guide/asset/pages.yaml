- pgno: 288
  md: '# Appendix G. TEXTURE FETCHING


    This appendix gives the formula used to compute the value returned by the texture
    functions of Texture Functions depending on the various attributes of the texture
    reference (see Texture and Surface Memory).


    The texture bound to the texture reference is represented as an array T of


    +   - N texels for a one-dimensional texture,

    +   - N x M texels for a two-dimensional texture,

    +   - N x M x L texels for a three-dimensional texture.


    It is fetched using non-normalized texture coordinates x, y, and z, or the normalized
    texture coordinates x/N, y/M, and z/L as described in Texture Memory. In this
    appendix, the coordinates are assumed to be in the valid range. Texture Memory
    explained how out-of-range coordinates are remapped to the valid range based on
    the addressing mode.


    # G.1. Nearest-Point Sampling


    In this filtering mode, the value returned by the texture fetch is


    +   - tex(x)=T[i] for a one-dimensional texture,

    +   - tex(x,y)=T[i,j] for a two-dimensional texture,

    +   - tex(x,y,z)=T[i,j,k] for a three-dimensional texture,


    where i=floor(x), j=floor(y), and k=floor(z).


    Figure 15 illustrates nearest-point sampling for a one-dimensional texture with
    N=4.


    For integer textures, the value returned by the texture fetch can be optionally
    remapped to [0.0, 1.0] (see Texture Memory).'
  merge: -1
  img_proc: true
- pgno: 289
  md: '![](img/c13b0ff67eed8f2c7b32afa2a587a8d6_289_0.png)


    Figure 15 Nearest-Point Sampling Filtering Mode

    Nearest-point sampling of a one-dimensional texture of four texels.


    # G.2. Linear Filtering


    In this filtering mode, which is only available for floating-point textures, the
    value returned by the texture fetch is


    +   tex(x)=(1-α)T[i]+αT[i+1] for a one-dimensional texture,


    +   tex(x,y)=(1-α)(1-β)T[i,j]+(1-α)βT[i+1,j]+(1-α)βT[i,j+1]+αβT[i+1,j+1] for a
    two-dimensional texture,


    +   tex(x,y,z) =

    +   (1-α)(1-β)(1-γ)T[i,j,k]+α(1-β)(1-γ)T[i+1,j,k]+

    +   (1-α)β(1-γ)T[i,j+1,k]+αβ(1-γ)T[i+1,j+1,k]+

    +   (1-α)(1-β)γT[i,j,k+1]+α(1-β)γT[i+1,j,k+1]+

    +   (1-α)βγT[i,j+1,k+1]+αβγT[i+1,j+1,k+1]

    +   for a three-dimensional texture,


    where:


    +   i=floor(xp), α=frac(xp), xp=x-0.5,


    +   j=floor(yp), β=frac(yp), yp=y-0.5,


    +   k=floor(zp), γ=frac(zp), zp=z-0.5,


    α, β, and γ are stored in 9-bit fixed point format with 8 bits of fractional value
    (so 1.0 is exactly represented).


    Figure 16 illustrates linear filtering of a one-dimensional texture with N=4.'
  merge: -1
  img_proc: true
