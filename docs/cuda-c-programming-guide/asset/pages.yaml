    \ the functionality of the code.\n\n# ## B.20. Formatted Output\n\nFormatted output\
    \ is only supported by devices of compute capability 2.x and higher.\n\n```\n\
    int printf(const char *format, arg, ...);\n```\n\nprints formatted output from\
    \ a kernel to a host-side output stream.\n\nThe in-kernel **printf()** function\
    \ behaves in a similar way to the standard C-library printf() function, and the\
    \ user is referred to the host system’s manual pages for a complete description\
    \ of **printf()** behavior. In essence, the string passed as `format` is output\
    \ to a stream on the host, with substitutions made from the argument list wherever\
    \ a format specifier is encountered. Supported format specifiers are listed below.\n\
    \nThe **printf()** command is executed as any other device-side function: per-thread,\
    \ and in the context of the calling thread. From a multi-threaded kernel, this\
    \ means that a straightforward call to **printf()** will be executed by every\
    \ thread, using that thread’s data as specified. Multiple versions of the output\
    \ string will then appear at the host stream, once for each thread which encountered\
    \ the **printf()** .\n\nIt is up to the programmer to limit the output to a single\
    \ thread if only a single output string is desired (see Examples for an illustrative\
    \ example)."
