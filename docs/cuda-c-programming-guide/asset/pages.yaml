    ```

    cudaExternalSemaphore_t importD3D11KeyedMutexFromNamedNTHandle(LPCWSTR name) {

    cudaExternalSemaphore_t extSem = NULL;

    cudaExternalSemaphoreHandleDesc desc = {};

    memset(&desc, 0, sizeof(desc));

    desc.type = cudaExternalSemaphoreHandleTypeKeyedMutex;

    desc.handle.win32.name = (void *)name;

    cudaImportExternalSemaphore(&extSem, &desc);

    return extSem;

    }

    ```


    A shareable Direct3D 11 keyed mutex object can be imported into CUDA using the
    globally shared D3DKMT handle associated with that object as shown below. Since
    a globally shared D3DKMT handle does not hold a reference to the underlying memory
    it is automatically destroyed when all other references to the resource are destroyed.


    ```

    cudaExternalSemaphore_t importD3D11FenceFromKMTHandle(HANDLE handle) {

    cudaExternalSemaphore_t extSem = NULL;

    cudaExternalSemaphoreHandleDesc desc = {};

    memset(&desc, 0, sizeof(desc));

    desc.type = cudaExternalSemaphoreHandleTypeKeyedMutexKmt;

    desc.handle.win32.handle = handle;

    cudaImportExternalSemaphore(&extSem, &desc);

    // Input parameter ''handle'' should be closed if it''s not needed anymore

    CloseHandle(handle);

    return extSem;

    }

    ```


    # 3.3.4.6. Signaling/waiting on imported synchronization objects


    An imported Direct3D 11 fence object can be signaled as shown below. Signaling
    such a fence object sets its value to the one specified. The corresponding wait
    that waits on this signal must be issued in Direct3D 11. Additionally, the wait
    that waits on this signal must be issued after this signal has been issued.


    ```

    void signalExternalSemaphores(cudaExternalSemaphore_t extSem, unsigned long long
    value, cudaStream_t stream) {

    cudaExternalSemaphoreSignalParams params = {};

    memset(&params, 0, sizeof(params));

    params.params.fence.value = value;

    cudaSignalExternalSemaphoresAsync(&extSem, &params, 1, stream);

    }

    ```


    An imported Direct3D 11 fence object can be waited on as shown below. Waiting
    on such a fence object waits until its value becomes greater than or equal to
    the specified value.'
