- pgno: 264
  md: "# F.3.17. C++14 Features\n\nC++14 features enabled by default by the host compiler\
    \ are also supported by nvcc. Passing nvcc -std=c++14 flag turns on all C++14\
    \ features and also invokes the host preprocessor, compiler and linker with the\
    \ corresponding C++14 dialect option 20. This section describes the restrictions\
    \ on the supported C++14 features.\n\n# F.3.17.1. Functions with deduced return\
    \ type\n\nA __global__ function cannot have a deduced return type.\n\nIf a __device__\
    \ function has deduced return type, the CUDA frontend compiler will change the\
    \ function declaration to have a void return type, before invoking the host compiler.\
    \ This may cause issues for introspecting the deduced return type of the __device__\
    \ function in host code. Thus, the CUDA compiler will issue compile-time errors\
    \ for referencing such deduced return type outside device function bodies, except\
    \ if the reference is absent when __CUDA_ARCH__ is undefined.\n\n# Examples:\n\
    \n```\n__device__ auto fn1(int x) {\n    return x;\n}\n\n__device__ decltype(auto)\
    \ fn2(int x) {\n    return x;\n}\n\n__device__ void device_fn1() {\n    // OK\n\
    \    int (*pl)(int) = fn1;\n}\n\n// error: referenced outside device function\
    \ bodies\ndecltype(fn1(10)) g1;\n\nvoid host_fn1() {\n    // error: referenced\
    \ outside device function bodies\n    int (*pl)(int) = fn1;\n}\n\nstruct S_local_t\
    \ {\n    // error: referenced outside device function bodies\n    decltype(fn2(10))\
    \ m1;\n    S_local_t() : m1(10) { }\n};\n\n// error: referenced outside device\
    \ function bodies\ntemplate <typename T = decltype(fn2)>\nvoid host_fn2() { }\n\
    \ntemplate<typename T> struct S1_t { };\n\n// error: referenced outside device\
    \ function bodies\nstruct S1_derived_t : S1_t<decltype(fn1)> { };\n```\n\n20 At\
    \ present, the -std=c++14 flag is supported only for the following host compilers\
    \ : gcc version >= 5.1, clang version >= 3.7 and icc version >= 17"
  merge: -1
  img_proc: true
- pgno: 265
  md: "# F.3.17.2. Variable templates\n\nA __device__ / __constant__ variable template\
    \ cannot have a const qualified type when using the Microsoft host compiler.\n\
    \n# Examples:\n\n```\n// error: a __device__ variable template cannot\n// have\
    \ a const qualified type on Windows\ntemplate <typename T>\n__device__ const T\
    \ d1(2);\n\nint *const x = nullptr;\n// error: a __device__ variable template\
    \ cannot\n// have a const qualified type on Windows\ntemplate <typename T>\n__device__\
    \ T const d2(x);\n\n// OK\ntemplate <typename T>\n__device__ const T *d3();\n\n\
    __device__ void f() {\n    int t1 = d1<int>();\n\n    int *const t2 = d2<int>();\n\
    \n    const int *t3 = d3<int>();\n}\n```\n\n# F.4. Polymorphic Function Wrappers\n\
    \nA polymorphic function wrapper class template nvstd::function is provided in\
    \ the nvfunctional header. Instances of this class template can be used to store,\
    \ copy and invoke any callable target, e.g., lambda expressions. nvstd::function\
    \ can be used in both host and device code."
  merge: -1
  img_proc: true
- pgno: 266
  md: "# Example:\n\n```\n#include <nvfunctional>\n\ndevice __int foo_d() { return\
    \ 1; }\nhost__device__ int foo_hd() { return 2; }\nhost__ int foo_h() { return\
    \ 3; }\n\nglobal void kernel() {\n    nvstd::function<int()> fn1 = foo_d;\n  \
    \  nvstd::function<int()> fn2 = foo_hd;\n    nvstd::function<int()> fn3 = []()\
    \ { return 10; };\n    *result = fn1() + fn2() + fn3();\n}\n\nhost__device__ void\
