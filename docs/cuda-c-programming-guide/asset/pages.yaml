    # K.1.3. Data Migration and Coherency


    Unified Memory attempts to optimize memory performance by migrating data towards
    the device where it is being accessed (that is, moving data to host memory if
    the CPU is accessing it and to device memory if the GPU will access it). Data
    migration is fundamental to Unified Memory, but is transparent to a program. The
    system will try to place data in the location where it can most efficiently be
    accessed without violating coherency.


    The physical location of data is invisible to a program and may be changed at
    any time, but accesses to the data''s virtual address will remain valid and coherent
    from any processor regardless of locality. Note that maintaining coherence is
    the primary requirement, ahead of performance; within the constraints of the host
    operating system, the system is permitted to either fail accesses or move data
    in order to maintain global coherence between processors.


    GPU architectures of compute capability lower than 6.x do not support fine-grained
    movement of the managed data to GPU on-demand. Whenever a GPU kernel is launched
    all managed memory generally has to be transfered to GPU memory to avoid faulting
    on memory access. With compute capability 6.x a new GPU page faulting mechanism
    is introduced that provides more seamless Unified Memory functionality. Combined
    with the system-wide virtual address space, page faulting provides several benefits.
    First, page faulting means that the CUDA system software doesn''t need to synchronize
    all managed memory allocations to the GPU before each kernel launch. If a kernel
    running on the GPU accesses a page that is not resident in its kernel, it faults,
    allowing the page to be automatically migrated to the GPU memory on-demand. Alternatively,
    the page may be mapped into the GPU address space for access over the PCIe or
    NVLink interconnects (mapping on access can sometimes be faster than migration).
    Note that Unified Memory is system-wide: GPUs (and CPUs) can fault on and migrate
    memory pages either from CPU memory or from the memory of other GPUs in the system.


    # K.1.4. GPU Memory Oversubscription


    Devices of compute capability lower than 6.x cannot allocate more managed memory
    than the physical size of GPU memory.


