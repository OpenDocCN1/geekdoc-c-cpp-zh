    ```

    cudaGraph_t graph;

    cudaStreamBeginCapture(stream);

    kernelA<<< ..., stream >>>(...);

    kernelB<<< ..., stream >>>(...);

    libraryCall(stream);

    kernelC<<< ..., stream >>>(...);

    cudaStreamEndCapture(stream, &graph);

