    # ## C.4. Multi-Device Synchronization


    In order to enable synchronization across multiple devices with Cooperative Groups,
    use of the `cuLaunchCooperativeKernelMultiDevice` CUDA API is required. This,
    a significant departure from existing CUDA APIs, will allow a single host thread
    to launch a kernel across multiple devices. In addition to the constraints and
    guarantees made by `cuLaunchCooperativeKernel`, this API has the additional semantics:


    +   - This API will ensure that a launch is atomic, i.e. if the API call succeeds,
    then the provided number of thread blocks will launch on all specified devices.


    +   - The functions launched via this API must be identical. No explicit checks
    are done by the driver in this regard because it is largely not feasible. It is
    up to the application to ensure this.


    +   - No two entries in the provided `launchParamsList` may map to the same device.


    +   - All devices being targeted by this launch must be of the same compute capability
    - major and minor versions.


    +   - The block size, grid size and amount of shared memory per grid must be the
    same across all devices. Note that this means the maximum number of blocks that
    can be launched per device will be limited by the device with the least number
    of SMs.


    +   - Any user defined `__device__`, `__constant__` or `__managed__` device global
    variables present in the module that owns the CUfunction being launched are independently
    instantiated on every device. The user is responsible for initializing such device
    global variables appropriately.'
