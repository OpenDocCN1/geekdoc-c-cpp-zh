  md: '# B.21. Dynamic Global Memory Allocation and Operations


    Dynamic global memory allocation and operations are only supported by devices
    of compute capability 2.x and higher.


    ```

    __host__ __device__ void* malloc(size_t size);

    __device__ void* __nv_aligned_device_malloc(size_t size, size_t align);

    __host__ __device__ void free(void* ptr);

    ```


    allocate and free memory dynamically from a fixed-size heap in global memory.


    ```

    __host__ __device__ void* memcpy(void* dest, const void* src, size_t size);

    ```


    copy size bytes from the memory location pointed by src to the memory location
    pointed by dest.


    ```

    __host__ __device__ void* memset(void* ptr, int value, size_t size);

    ```


    set size bytes of memory block pointed by ptr to value (interpreted as an unsigned
    char).


    The CUDA in-kernel malloc() function allocates at least size bytes from the device
    heap and returns a pointer to the allocated memory or NULL if insufficient memory
    exists to fulfill the request. The returned pointer is guaranteed to be aligned
    to a 16-byte boundary.


    The CUDA in-kernel __nv_aligned_device_malloc() function allocates at least size
    bytes from the device heap and returns a pointer to the allocated memory or NULL
    if insufficient memory exists to fulfill the requested size or alignment. The
    address of the allocated memory will be a multiple of align. align must be a non-zero
    power of 2.


    The CUDA in-kernel free() function deallocates the memory pointed to by ptr, which
    must have been returned by a previous call to malloc() or __nv_aligned_device_malloc().
    If ptr is NULL, the call to free() is ignored. Repeated calls to free() with the
    same ptr has undefined behavior.


    The memory allocated by a given CUDA thread via malloc() or __nv_aligned_device_malloc()
    remains allocated for the lifetime of the CUDA context, or until it is explicitly
    released by a call to free(). It can be used by any other CUDA threads even from
    subsequent kernel launches. Any CUDA thread may free memory allocated by another
    thread, but care should be taken to ensure that the same pointer is not freed
    more than once.


    # B.21.1. Heap Memory Allocation


    The device memory heap has a fixed size that must be specified before any program
    using malloc(), __nv_aligned_device_malloc() or free() is loaded into the'
