- pgno: 257
  md: 'The CUDA frontend compiler does not support the `#pragma gcc diagnostic` or
    `#pragma warning` mechanisms supported by various host compilers. Therefore, deprecation
    diagnostics generated by the CUDA frontend compiler are not affected by these
    pragmas, but diagnostics generated by the host compiler will be affected. The
    `-nvcc` flag `-Wno-deprecated-declarations` can be used to suppress all deprecation
    warnings, and the flag `-Werror=deprecated-declarations` can be used to turn deprecation
    warnings into errors.


    # F.3.16. C++11 Features


    C++11 features that are enabled by default by the host compiler are also supported
    by nvcc, subject to the restrictions described in this document. In addition,
    invoking nvcc with `-std=c++11` flag turns on all C++11 features and also invokes
    the host preprocessor, compiler and linker with the corresponding C++11 dialect
    option 14.


    # F.3.16.1. Lambda Expressions


    The execution space specifiers for all member functions 15 of the closure class
    associated with a lambda expression are derived by the compiler as follows. As
    described in the C++11 standard, the compiler creates a closure type in the smallest
    block scope, class scope or namespace scope that contains the lambda expression.
    The innermost function scope enclosing the closure type is computed, and the corresponding
    function''s execution space specifiers are assigned to the closure class member
    functions. If there is no enclosing function scope, the execution space specifier
    is `__host__`.'
  merge: -1
  img_proc: true
- pgno: 258
  md: "Examples of lambda expressions and computed execution space specifiers are\
    \ shown below (in comments).\n\n```\nauto globalVar = [] { return 0; }; // __host__\n\
    void f1(void) {\n    auto l1 = [] { return 1; }; // __host__\n}\n__device__ void\
    \ f2(void) {\n    auto l2 = [] { return 2; }; // __device__\n}\nhost__ device__\
    \ void f3(void) (\n    auto l3 = [] { return 3; }; // __host__ __device__\n}\n\
    __device__ void f4(int (*fp) () = [] { return 4; } /* __host__ */) (\n}\n__global__\
    \ void f5(void) {\n    auto l5 = [] { return 5; }; // __device__\n}\ndevice__\
    \ void f6(void) {\n    struct S1_t {\n        static Void helper(int (*fp) ()\
    \ = [] { return 6; } /* __device__ */) {\n        }\n    };\n}\n```\n\nThe closure\
    \ type of a lambda expression cannot be used in the type or non-type argument\
    \ of a __global__ function template instantiation, unless the lambda is defined\
    \ within a __device__ or __global__ function.\n\n# Example:\n\n```\ntemplate <typename\
    \ T>\n__global__ void foo(T in) ();\ntemplate <typename T>\nstruct S1_t {\n};\n\
    void bar(void) {\n    auto templ = [] {\n    };\n    foo<<<1,1>>>(templ); // error:\
    \ lambda closure type used in\n    // template type argument\n    foo<<<1,1>>>(S1_t<decltype(templ)>());\
    \ // error: lambda closure type used in\n    // template type argument\n}\n```\n\
    \n# F.3.16.2. std::initializer_list\n\nBy default, the CUDA compiler will implicitly\
    \ consider the member functions of std::initializer_list to have __host__ __device__\
    \ execution space specifiers, and therefore they can be invoked directly from\
    \ device code. The nvcc flag --no-host-device-initializer-list will disable this\
    \ behavior; member functions of std::initializer_list will then be considered\
    \ as __host__ functions and will not be directly invokable from device code."
  merge: -1
  img_proc: true
- pgno: 259
  md: "# Example:\n\n```\n#include <initializer_list>\n__device__ int foo(std::initializer_list<int>\
    \ in);\n__device__ void bar(void)\n{\n    foo({4,5,6}); // (a) initializer list\
    \ containing only\n    // constant expressions.\n    int i = 4;\n    foo({i,5,6});\
    \ // (b) initializer list with at least one\n    // non-constant element.\n  \
    \  // This form may have better performance than (a).\n}\n```\n\n# F.3.16.3. Rvalue\
    \ references\n\nBy default, the CUDA compiler will implicitly consider `std::move`\
    \ and `std::forward` function templates to have `__host__ __device__` execution\
    \ space specifiers, and therefore they can be invoked directly from device code.\
    \ The nvcc flag `--no-host-device-move-forward` will disable this behavior; `std::move`\
    \ and `std::forward` will then be considered as `__host__` functions and will\
    \ not be directly invokable from device code.\n\n# F.3.16.4. Constexpr functions\
    \ and function templates\n\nBy default, a constexpr function cannot be called\
    \ from a function with incompatible execution space 16. The experimental nvcc\
    \ flag `--expt-relaxed-constexpr` removes this restriction 17. When this flag\
    \ is specified, host code can invoke a `__device__` constexpr function and device\
    \ code can invoke a `__host__ constexpr function`. nvcc will define the macro\
    \ `__CUDACC_RELAXED_CONSTEXPR__` when `--expt-relaxed-constexpr` has been specified.\
    \ Note that a function template instantiation may not be a constexpr function\
    \ even if the corresponding template is marked with the keyword `constexpr` (C++11\
    \ Standard Section [dcl.constexpr p6]).\n\n# F.3.16.5. Constexpr variables\n\n\
    Let ‘V’ denote a namespace scope variable or a class static member variable that\
    \ has been marked constexpr and that does not have execution space annotations\
    \ (e.g., `__device__`, `__constant__`, `__shared__`). V is considered to be a\
    \ host code variable.\n\nIf V is of scalar type 18 other than `long double` and\
    \ the type is not volatile-qualified, the value of V can be directly used in device\
    \ code. In addition, if V is of a non-scalar type then scalar elements of V can\
    \ be used inside a constexpr `__device__` or `__host__ __device__` function, if\
    \ the call to the function is a constant expression 19. Device source code cannot\
    \ contain a reference to V or take the address of V.\n\n16 The restrictions are\
    \ the same as with a non-constexpr callee function.\n17 Note that the behavior\
    \ of experimental flags may change in future compiler releases.\n18 C++ Standard\
    \ Section [basic.types]\n19 C++ Standard Section [expr.const]"
