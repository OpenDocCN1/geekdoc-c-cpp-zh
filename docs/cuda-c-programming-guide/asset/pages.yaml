- pgno: 297
  md: 'The conversion of a floating-point value to an integer value in the case where
    the floating-point value falls outside the range of the integer format is left
    undefined by IEEE-754. For compute devices, the behavior is to clamp to the end
    of the supported range. This is unlike the x86 architecture behavior.


    The behavior of integer division by zero and integer overflow is left undefined
    by IEEE-754. For compute devices, there is no mechanism for detecting that such
    integer operation exceptions have occurred. Integer division by zero yields an
    unspecified, machine-specific value.


    http://developer.nvidia.com/content/precision-performance-floating-point-and-ieee-754-compliance-nvidia-gpus
    includes more information on the floating point accuracy and compliance of NVIDIA
    GPUs.


    # ## H.3. Compute Capability 3.x


    # ## H.3.1. Architecture


    A multiprocessor consists of:


    +   - 192 CUDA cores for arithmetic operations (see Arithmetic Instructions for
    throughputs of arithmetic operations),


    +   - 32 special function units for single-precision floating-point transcendental
    functions,


    +   - 4 warp schedulers.


    When a multiprocessor is given warps to execute, it first distributes them among
    the four schedulers. Then, at every instruction issue time, each scheduler issues
    two independent instructions for one of its assigned warps that is ready to execute,
    if any.


    A multiprocessor has a read-only constant cache that is shared by all functional
    units and speeds up reads from the constant memory space, which resides in device
    memory.


    There is an L1 cache for each multiprocessor and an L2 cache shared by all multiprocessors.
    The L1 cache is used to cache accesses to local memory, including temporary register
    spills. The L2 cache is used to cache accesses to local and global memory. The
    cache behavior (e.g., whether reads are cached in both L1 and L2 or in L2 only)
    can be partially configured on a per-access basis using modifiers to the load
    or store instruction. Some devices of compute capability 3.5 and devices of compute
    capability 3.7 allow opt-in to caching of global memory in both L1 and L2 via
    compiler options.


    The same on-chip memory is used for both L1 and shared memory: It can be configured
