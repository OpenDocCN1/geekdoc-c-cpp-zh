    \n# ## B.5. Memory Fence Functions\n\nThe CUDA programming model assumes a device\
    \ with a weakly-ordered memory model, that is the order in which a CUDA thread\
    \ writes data to shared memory, global memory, page-locked host memory, or the\
    \ memory of a peer device is not necessarily the order in which the data is observed\
    \ being written by another CUDA or host thread.\n\nFor example, if thread 1 executes\
    \ `writeXY()` and thread 2 executes `readXY()` as defined in the following code\
    \ sample\n\n```\n__device__ volatile int X = 1, Y = 2;\n\n__device__ void writeXY()\n\
    {\n    X = 10;\n    Y = 20;\n}\n\n__device__ void readXY()\n{\n    int A = X;\n\
    \    int B = Y;\n}\n```\n\nit is possible that **B** ends up equal to 20 and **A**\
    \ equal to 1 for thread 2. In a strongly-ordered memory model, the only possibilities\
    \ would be:\n\n+   * A equal to 1 and B equal to 2,\n+   * A equal to 10 and B\
    \ equal to 2,\n+   * A equal to 10 and B equal to 20,\n\nMemory fence functions\
    \ can be used to enforce some ordering on memory accesses. The memory fence functions\
    \ differ in the scope in which the orderings are enforced but they are independent\
    \ of the accessed memory space (shared memory, global memory, page-locked host\
    \ memory, and the memory of a peer device).\n\n```\nvoid __threadfence_block ();\n\
    ```\n\nensures that:"
