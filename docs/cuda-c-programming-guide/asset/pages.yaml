- pgno: 145
  md: "Here is an example subject to the aliasing issue, where use of restricted pointer\
    \ can help the compiler to reduce the number of instructions:\n\n```\nvoid foo(const\
    \ float* a,\n             const float* b,\n             float* c)\n{\n    c[0]\
    \ = a[0] * b[0];\n    c[1] = a[0] * b[0];\n    c[2] = a[0] * b[0] * a[1];\n  \
    \  c[3] = a[0] * a[1];\n    c[4] = a[0] * b[0];\n    c[5] = b[0];\n    ...\n}\n\
    ```\n\nIn C-type languages, the pointers a, b, and c may be aliased, so any write\
    \ through c could modify elements of a or b. This means that to guarantee functional\
    \ correctness, the compiler cannot load a[0] and b[0] into registers, multiply\
    \ them, and store the result to both c[0] and c[1], because the results would\
    \ differ from the abstract execution model if, say, a[0] is really the same location\
    \ as c[0]. So the compiler cannot take advantage of the common sub-expression.\
    \ Likewise, the compiler cannot just reorder the computation of c[4] into the\
    \ proximity of the computation of c[0] and c[1] because the preceding write to\
    \ c[3] could change the inputs to the computation of c[4].\n\nBy making a, b,\
    \ and c restricted pointers, the programmer asserts to the compiler that the pointers\
    \ are in fact not aliased, which in this case means writes through c would never\
    \ overwrite elements of a or b. This changes the function prototype as follows:\n\
    \n```\nvoid foo(const float* __restrict__ a,\n             const float* __restrict__\
    \ b,\n             float* __restrict__ c);\n```\n\nNote that all pointer arguments\
    \ need to be made restricted for the compiler optimizer to derive any benefit.\
    \ With the __restrict__ keywords added, the compiler can now reorder and do common\
    \ sub-expression elimination at will, while retaining functionality identical\
    \ with the abstract execution model:\n\n```\nvoid foo(const float* __restrict__\
    \ a,\n             const float* __restrict__ b,\n             float* __restrict__\
    \ c)\n{\n    float t0 = a[0];\n    float t1 = b[0];\n    float t2 = t0 * t2;\n\
    \    c[2] = t2;\n    c[0] = t2;\n    c[1] = t2;\n    c[3] = t0 * t1;\n    c[4]\
    \ = t2;\n    c[2] = t2 * t3;\n    c[3] = t2;\n    c[5] = t1;\n    ...\n}\n```\n\
    \nThe effects here are a reduced number of memory accesses and reduced number\
    \ of computations. This is balanced by an increase in register pressure due to\
    \ \"cached\" loads and common sub-expressions."
  merge: -1
