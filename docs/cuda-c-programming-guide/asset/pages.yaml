    addressing. This is large enough to cover the 48-bit virtual address spaces of
    modern CPUs, as well as the GPU''s own memory. The large virtual address space
    and page faulting capability enable applications to access the entire system virtual
    memory, not limited by the physical memory size of any one processor. This means
    that applications can oversubscribe the memory system: in other words they can
