- pgno: 44
  md: '+   - cudaHostRegister() page-locks a range of memory allocated by `malloc()`
    (see reference manual for limitations).


    Using page-locked host memory has several benefits:


    +   - Copies between page-locked host memory and device memory can be performed
    concurrently with kernel execution for some devices as mentioned in Asynchronous
    Concurrent Execution.


    +   - On some devices, page-locked host memory can be mapped into the address
    space of the device, eliminating the need to copy it to or from device memory
    as detailed in Mapped Memory.


    +   - On systems with a front-side bus, bandwidth between host memory and device
    memory is higher if host memory is allocated as page-locked and even higher if
    in addition it is allocated as write-combining as described in Write-Combining
    Memory.


    Page-locked host memory is a scarce resource however, so allocations in page-locked
    memory will start failing long before allocations in pageable memory. In addition,
    by reducing the amount of physical memory available to the operating system for
    paging, consuming too much page-locked memory reduces overall system performance.


    > > Page-locked host memory is not cached on non I/O coherent Tegra devices. Also,
    cudaHostRegister() is not supported on non I/O coherent Tegra devices.


    The simple zero-copy CUDA sample comes with a detailed document on the page-locked
    memory APIs.


    # ## 3.2.4.1. Portable Memory


    A block of page-locked memory can be used in conjunction with any device in the
    system (see Multi-Device System for more details on multi-device systems), but
    by default, the benefits of using page-locked memory described above are only
    available in conjunction with the device that was current when the block was allocated
    (and with all devices sharing the same unified address space, if any, as described
    in Unified Virtual Address Space). To make these advantages available to all devices,
    the block needs to be allocated by passing the flag cudaHostAllocPortable to cudaHostAlloc()
    or page-locked by passing the flag cudaHostRegisterPortable to cudaHostRegister().


    # ## 3.2.4.2. Write-Combining Memory


    By default page-locked host memory is allocated as cacheable. It can optionally
    be allocated as write-combining instead by passing flag cudaHostAllocWriteCombined
    to cudaHostAlloc(). Write-combining memory frees up the host''s L1 and L2 cache
    resources, making more cache available to the rest of the application. In addition,
    write-combining memory is not snooped during transfers across the PCI Express
    bus, which can improve transfer performance by up to 40%.


    Reading from write-combining memory from the host is prohibitively slow, so write-combining
    memory should in general be used for memory that the host only writes to.'
  merge: -1
  img_proc: true
- pgno: 45
  md: '# ### 3.2.4.3. Mapped Memory


    A block of page-locked host memory can also be mapped into the address space of
    the device by passing flag cudaHostAllocMapped to cudaHostAlloc() or by passing
    flag cudaHostRegisterMapped to cudaHostRegister(). Such a block has therefore
    in general two addresses: one in host memory that is returned by cudaHostAlloc()
    or malloc(), and one in device memory that can be retrieved using cudaHostGetDevicePointer()
    and then used to access the block from within a kernel. The only exception is
    for pointers allocated with cudaHostAlloc() and when a unified address space is
    used for the host and the device as mentioned in Unified Virtual Address Space.


    Accessing host memory directly from within a kernel does not provide the same
    bandwidth as device memory, but does have some advantages:


    +   - There is no need to allocate a block in device memory and copy data between
    this block and the block in host memory; data transfers are implicitly performed
    as needed by the kernel;


    +   - There is no need to use streams (see Concurrent Data Transfers) to overlap
    data transfers with kernel execution; the kernel-originated data transfers automatically
    overlap with kernel execution.


    Since mapped page-locked memory is shared between host and device however, the
    application must synchronize memory accesses using streams or events (see Asynchronous
    Concurrent Execution) to avoid any potential read-after-write, write-after-read,
    or write-after-write hazards).


    To be able to retrieve the device pointer to any mapped page-locked memory, page-locked
    memory mapping must be enabled by calling cudaSetDeviceFlags() with the cudaDeviceMapHost
    flag before any other CUDA call is performed. Otherwise, cudaHostGetDevicePointer()
    will return an error.


    cudaHostGetDevicePointer() also returns an error if the device does not support
    mapped page-locked host memory. Applications may query this capability by checking
    the canMapHostMemory device property (see Device Enumeration), which is equal
    to 1 for devices that support mapped page-locked host memory.


    Note that atomic functions (see Atomic Functions) operating on mapped page-locked
    memory are not atomic from the point of view of the host or other devices.


    Also note that CUDA runtime requires that 1-byte, 2-byte, 4-byte, and 8-byte naturally
    aligned loads and stores to host memory initiated by the device are preserved
    as single accesses from the point of view of the host and other devices. On some
    platforms, atomics to memory may be loaded by the hardware into separate load
    and store operations. These component load and store operations have the same
    requirements on preservation of naturally aligned accesses. As an example, the
    CUDA runtime does not support a PCI Express bus topology where a PCI Express bridge
    splits 8-byte naturally aligned writes into two 4-byte writes between the device
    and the host.'
  merge: -1
  img_proc: true
- pgno: 46
  md: '# 3.2.5. Asynchronous Concurrent Execution


    CUDA exposes the following operations as independent tasks that can operate concurrently
    with one another:


    +   - Computation on the host;

    +   - Computation on the device;

    +   - Memory transfers from the host to the device;

    +   - Memory transfers from the device to the host;

    +   - Memory transfers within the memory of a given device;

    +   - Memory transfers among devices.


    The level of concurrency achieved between these operations will depend on the
    feature set and compute capability of the device as described below.


    # 3.2.5.1. Concurrent Execution between Host and Device


    Concurrent host execution is facilitated through asynchronous library functions
    that return control to the host thread before the device completes the requested
    task. Using asynchronous calls, many device operations can be queued up together
    to be executed by the CUDA driver when appropriate device resources are available.
    This relieves the host thread of much of the responsibility to manage the device,
    leaving it free for other tasks. The following device operations are asynchronous
    with respect to the host:


    +   - Kernel launches;

    +   - Memory copies within a single device’s memory;

    +   - Memory copies from host to device of a memory block of 64 KB or less;

    +   - Memory copies performed by functions that are suffixed with Async;

    +   - Memory set function calls.


    Programmers can globally disable asynchronicity of kernel launches for all CUDA
    applications running on a system by setting the CUDA_LAUNCH_BLOCKING environment
    variable to 1. This feature is provided for debugging purposes only and should
    not be used as a way to make production software run reliably.


    Kernel launches are synchronous if hardware counters are collected via a profiler
    (Nsight, Visual Profiler) unless concurrent kernel profiling is enabled. Async
    memory copies will also be synchronous if they involve host memory that is not
    page-locked.


    # 3.2.5.2. Concurrent Kernel Execution


    Some devices of compute capability 2.x and higher can execute multiple kernels
    concurrently. Applications may query this capability by checking the concurrentKernels
    device property (see Device Enumeration), which is equal to 1 for devices that
    support it.


    The maximum number of kernel launches that a device can execute concurrently depends
    on its compute capability and is listed in Table 15.


    A kernel from one CUDA context cannot execute concurrently with a kernel from
    another CUDA context.'
