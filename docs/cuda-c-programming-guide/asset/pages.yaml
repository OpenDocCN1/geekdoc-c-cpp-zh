  md: '![](img/c13b0ff67eed8f2c7b32afa2a587a8d6_40_0.png)


    # Figure 9 Matrix Multiplication without Shared Memory


    The following code sample is an implementation of matrix multiplication that does
    take advantage of shared memory. In this implementation, each thread block is
    responsible for computing one square sub-matrix Csub of C and each thread within
    the block is responsible for computing one element of Csub. As illustrated in
    Figure 10, Csub is equal to the product of two rectangular matrices: the sub-matrix
    of A of dimension (A.width, block-size) that has the same row indices as Csub,
    and the sub-matrix of B of dimension (block-size, A.width) that has the same column
    indices as Csub. In order to fit into the device’s resources, these two rectangular
    matrices are divided into as many square matrices of dimension block_size as necessary
    and Csub is computed as the sum of the products of these square matrices. Each
    of these products is performed by first loading the two corresponding square matrices
    from global memory to shared memory with one thread loading one element of each
    matrix, and then by having each thread compute one element of the product. Each
    thread accumulates the result of each of these products into a register and once
    done writes the result to global memory.'
  merge: -1
  img_proc: true
- pgno: 41
  md: "By blocking the computation this way, we take advantage of fast shared memory\
    \ and save a lot of global memory bandwidth since A is only read (B.width / block_size)\
    \ times from global memory and B is read (A.height / block_size) times.\n\nThe\
    \ Matrix type from the previous code sample is augmented with a stride field,\
    \ so that sub-matrices can be efficiently represented with the same type. __device__\
    \ functions are used to get and set elements and build any sub-matrix from a matrix.\n\
    \n```\n// Matrices are stored in row-major order:\n// M(row, col) = *(M.elements\
    \ + row * M.stride + col)\ntypedef struct {\n    int width;\n    int height;\n\
    \    int stride;\n    float* elements;\n} Matrix;\n\n// Get a matrix element\n\
    __device__ float GetElement(const Matrix A, int row, int col)\n{\n    return A.elements[row\
    \ * A.stride + col];\n}\n\n// Set a matrix element\n__device__ void SetElement(Matrix\
    \ A, int row, int col,\n                           float value)\n{\n    A.elements[row\
    \ * A.stride + col] = value;\n}\n\n// Get the BLOCK_SIZE x BLOCK_SIZE sub-matrix\
    \ Asub of A that is\n// located col sub-matrices to the right of col sub-matrices\
    \ and\n// row sub-matrices down from the upper-left corner of A\n__device__ Matrix\
    \ GetSubMatrix(Matrix A, int row, int col)\n{\n    Matrix Asub;\n    Asub.width\
    \    = BLOCK_SIZE;\n    Asub.height   = BLOCK_SIZE;\n    Asub.stride   = A.stride;\n\
    \    Asub.elements = &A.elements[A.stride * BLOCK_SIZE * row\n               \
    \               + BLOCK_SIZE * col];\n    return Asub;\n}\n\n// Thread block size\n\
    #define BLOCK_SIZE 16\n\n// Forward declaration of the matrix multiplication kernel\n\
    __global__ void MatMulKernel(const Matrix, const Matrix, Matrix);\n\n// Matrix\
    \ multiplication - Host code\n// Matrix dimensions are assumed to be multiples\
    \ of BLOCK_SIZE\nvoid MatMul(const Matrix A, const Matrix B, Matrix C)\n{\n  \
    \  // Load A and B to device memory\n    Matrix d_A;\n    d_A.width = d_A.width\
    \ = A.width; d_A.height = A.height;\n    size_t size = A.width * A.height * sizeof(float);\n\
    \    cudaMalloc(&d_A.elements, size);\n    cudaMemcpy(d_A.elements, A.elements,\
    \ size,\n               cudaMemcpyHostToDevice);\n    Matrix d_B;\n    d_B.width\
    \ = d_B.width = B.width; d_B.height = B.height;\n    size = B.width * B.height\
    \ * sizeof(float);\n```"
