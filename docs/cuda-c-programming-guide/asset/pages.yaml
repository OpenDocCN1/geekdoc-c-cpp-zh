  md: 'The output buffer for `printf()` is set to a fixed size before kernel launch
    (see Associated Host-Side API). It is circular and if more output is produced
    during kernel execution than can fit in the buffer, older output is overwritten.
    It is flushed only when one of these actions is performed:


    +   > Kernel launch via `<<<>>>` or `cuLaunchKernel()` (at the start of the launch,
    and if the CUDA_LAUNCH_BLOCKING environment variable is set to 1, at the end of
    the launch as well),

    +   > Synchronization via `cudaDeviceSynchronize()`, `cuCtxSynchronize()`, `cudaStreamSynchronize()`,
    `cuStreamSynchronize()`, `cudaEventSynchronize()`, or `cuEventSynchronize()`,

    +   > Memory copies via any blocking version of `cudaMemcpy*()` or `cuMemcpy*()`,

    +   > Module loading/unloading via `cuModuleLoad()` or `cuModuleUnload()`,

    +   > Context destruction via `cudaDeviceReset()` or `cuCtxDestroy()`.

    +   > Prior to executing a stream callback added by `cudaStreamAddCallback` or
    `cuStreamAddCallback`.


    Note that the buffer is not flushed automatically when the program exits. The
    user must call `cudaDeviceReset()` or `cuCtxDestroy()` explicitly, as shown in
    the examples below.


    Internally `printf()` uses a shared data structure and so it is possible that
    calling `printf()` might change the order of execution of threads. In particular,
    a thread which calls `printf()` might take a longer execution path than one which
    does not call `printf()`, and that path length is dependent upon the parameters
    of the `printf()`. Note, however, that CUDA makes no guarantees of thread execution
    order except at explicit `__syncthreads()` barriers, so it is impossible to tell
    whether execution order has been modified by `printf()` or by other scheduling
    behaviour in the hardware.


    # B.20.3. Associated Host-Side API


    The following API functions get and set the size of the buffer used to transfer
    the `printf()` arguments and internal metadata to the host (default is 1 megabyte):


    +   > `cudaDeviceGetLimit(size_t* size, cudaLimitPrintfFifoSize)`

    +   > `cudaDeviceSetLimit(cudaLimitPrintfFifoSize, size_t size)`'
