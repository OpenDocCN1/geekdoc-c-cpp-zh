    acts as __threadfence_block() for all threads in the block of the calling thread
    and also ensures that no writes to all memory made by the calling thread after
    the call to __threadfence() are observed by any thread in the device as occurring
    before any write to all memory made by the calling thread before the call to __threadfence().
    Note that for this ordering guarantee to be true, the observing threads must truly
    observe the memory and not cached versions of it; this is ensured by using the
    volatile keyword as detailed in Volatile Qualifier.


    ```

    void __threadfence_system();

    ```


    acts as __threadfence_block() for all threads in the block of the calling thread
    and also ensures that all writes to all memory made by the calling thread before
    the call to __threadfence_system() are observed by all threads in the device,
    host threads, and all threads in peer devices as occurring before all writes to
    all memory made by the calling thread after the call to __threadfence_system().


    __threadfence_system() is only supported by devices of compute capability 2.x
    and higher.


    In the previous code sample, inserting a fence function call between X = 10; and
    Y = 20; and between int A = X; and int B = Y; would ensure that for thread 2,
