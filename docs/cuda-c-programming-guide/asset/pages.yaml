  md: '# fragment


    An overloaded class containing a section of a matrix distributed across all threads
    in the warp. The mapping of matrix elements into `fragment` internal storage is
    unspecified and subject to change in future architectures.


    Only certain combinations of template arguments are allowed. The first template
    parameter specifies how the fragment will participate in the matrix operation.
    Acceptable values for `Use` are:


    +   - `matrix_a` when the fragment is used as the first multiplicand, `A`,

    +   - `matrix_b` when the fragment is used as the second multiplicand, `B`, or

    +   - `accumulator` when the fragment is used as the source or destination accumulators
    (`C` or `D`, respectively).


    The `m`, `n` and `k` sizes describe the shape of the warp-wide matrix tiles participating
    in the multiply-accumulate operation. The dimension of each tile depends on its
    role. For `matrix_a` the tile takes dimension `m x k`; for `matrix_b` the dimension
    is `k x n`, and `accumulator` tiles are `m x n`.


    The data type, `T`, may be `__half`, `char`, or `unsigned char` for multiplicands
    and `__half`, `float`, or `int` for accumulators. As documented in Element Types
    & Matrix Sizes, limited combinations of accumulator and multiplicand types are
    supported. The layout parameter must be specified for `matrix_a` and `matrix_b`
    fragments. `row_major` or `col_major` indicate that elements within a matrix row
    or column are contiguous in memory, respectively. The `Layout` parameter for an
    `accumulator` matrix should retain the default value of `void`. A row or column
    layout is specified only when the accumulator is loaded or stored as described
    below.


    # load_matrix_sync


    Waits until all warp lanes have arrived at `load_matrix_sync` and then loads the
    matrix fragment `a` from memory. `mptr` must be a 256-bit aligned pointer pointing
    to the first element of the matrix in memory. `ldm` describes the stride in elements
    between consecutive rows (for row major layout) or columns (for column major layout)
    and must be a multiple of 16 bytes (i.e., 8 `__half` elements or 4 `float` elements).
    If the fragment is an `accumulator`, the `layout` argument must be specified as
    either `mem_row_major` or `mem_col_major`. For `matrix_a` and `matrix_b` fragments,
    the layout is inferred from the fragment''s `layout` parameter. The values of
    `mptr`, `ldm`, `layout` and all template parameters for `a` must be the same for
    all threads in the warp. This function must be called by all threads in the warp,
    or the result is undefined.


    # store_matrix_sync


    Waits until all warp lanes have arrived at `store_matrix_sync` and then stores
    the matrix fragment `a` to memory. `mptr` must be a 256-bit aligned pointer pointing
    to the first element of the matrix in memory. `ldm` describes the stride in elements
    between consecutive rows (for row major layout) or columns (for column major layout)
    and'
