    to `cudaSuccess` and is overwritten by the error code every time an error occurs
    (be it a parameter validation error or an asynchronous error). `cudaPeekAtLastError
    ()` returns this variable and `cudaGetLastError ()` returns this variable and
    resets it to `cudaSuccess`.


