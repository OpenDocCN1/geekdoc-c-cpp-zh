  md: 'context. A default heap of eight megabytes is allocated if any program uses
    `malloc()` or `__nv_aligned_device_malloc()` without explicitly specifying the
    heap size.


    The following API functions get and set the heap size:


    +   - `cudaDeviceGetLimit(size_t* size, cudaLimitMallocHeapSize)`

    +   - `cudaDeviceSetLimit(cudaLimitMallocHeapSize, size_t size)`


    The heap size granted will be at least `size` bytes. `cuCtxGetLimit()` and `cudaDeviceGetLimit()`
    return the currently requested heap size.


    The actual memory allocation for the heap occurs when a module is loaded into
    the context, either explicitly via the CUDA driver API (see Module), or implicitly
    via the CUDA runtime API (see CUDA Runtime). If the memory allocation fails, the
    module load will generate a `CUDA_ERROR_SHARED_OBJECT_INIT_FAILED` error.


    Heap size cannot be changed once a module load has occurred and it does not resize
    dynamically according to need.


    Memory reserved for the device heap is in addition to memory allocated through
    host-side CUDA API calls such as `cudaMalloc()`.


    # B.21.2. Interoperability with Host Memory API


    Memory allocated via device `malloc()` or `__nv_aligned_device_malloc()` cannot
    be freed using the runtime (i.e., by calling any of the free memory functions
    from Device Memory).


    Similarly, memory allocated via the runtime (i.e., by calling any of the memory
    allocation functions from Device Memory) cannot be freed via `free()`.


    In addition, memory allocated by a call to `malloc()` or `__nv_aligned_device_malloc()`
    in device code cannot be used in any runtime or driver API calls (i.e. cudaMemcpy,
    cudaMemset, etc).


    # B.21.3. Examples'
