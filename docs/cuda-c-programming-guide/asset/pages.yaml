    A memory copy will succeed even if it is issued to a stream that is not associated
    to the current device.


    **cudaEventRecord()** will fail if the input event and input stream are associated
    to different devices.


    **cudaEventElapsedTime()** will fail if the two input events are associated to
    different devices.


    **cudaEventSynchronize()** and **cudaEventQuery()** will succeed even if the input
    event is associated to a device that is different from the current device.


    **cudaStreamWaitEvent()** will succeed even if the input stream and input event
    are associated to different devices. **cudaStreamWaitEvent()** can therefore be
    used to synchronize multiple devices with each other.


    Each device has its own default stream (see Default Stream), so commands issued
    to the default stream of a device may execute out of order or concurrently with
    respect to commands issued to the default stream of any other device.


