  md: 'A Vulkan memory object exported using VK_EXTERNAL_MEMORY_HANDLE_TYPE_OPAQUE_WIN32_BIT
    can also be imported using a named handle if one exists as shown below.


    ```

    cudaExternalMemory_t importVulkanMemoryObjectFromNamedNTHandle(LPCWSTR name,

    unsigned long long size, bool isDedicated) {

    cudaExternalMemoryHandleDesc extMemDesc = NULL;

    cudaExternalMemoryHandleDesc desc = {};

    memset(&desc, 0, sizeof(desc));

    desc.type = cudaExternalMemoryHandleTypeOpaqueWin32;

    desc.handle.win32.name = (void *)name;

    desc.size = size;

    if (isDedicated) {

    desc.flags |= cudaExternalMemoryDedicated;

    }

    cudaImportExternalMemory(&extMem, &desc);

    return extMem;

    }

    ```


    A Vulkan memory object exported using VK_EXTERNAL_MEMORY_HANDLE_TYPE_OPAQUE_WIN32_KMT_BIT
    can be imported into CUDA using the globally shared D3DKMT handle associated with
    that object as shown below. Since a globally shared D3DKMT handle does not hold
    a reference to the underlying memory it is automatically destroyed when all other
    references to the resource are destroyed.


    ```

    cudaExternalMemory_t importVulkanMemoryObjectFromKMTHandle(HANDLE handle,

    unsigned long long size, bool isDedicated) {

    cudaExternalMemoryHandleDesc extMemDesc = NULL;

    cudaExternalMemoryHandleDesc desc = {};

    memset(&desc, 0, sizeof(desc));

    desc.type = cudaExternalMemoryHandleTypeOpaqueWin32Kmt;

    desc.handle.win32.handle = (void *)handle;

    desc.size = size;

    if (isDedicated) {

    desc.flags |= cudaExternalMemoryDedicated;

    }

    cudaImportExternalMemory(&extMem, &desc);

    return extMem;

    }

    ```


