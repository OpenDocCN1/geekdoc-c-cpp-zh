    # H.3.3. Shared Memory


    Shared memory has 32 banks with two addressing modes that are described below.


    The addressing mode can be queried using cudaDeviceGetSharedMemConfig() and set
    using cudaDeviceSetSharedMemConfig() (see reference manual for more details).
    Each bank has a bandwidth of 64 bits per clock cycle.


    Figure 19 shows some examples of strided access.


    Figure 20 shows some examples of memory read accesses that involve the broadcast
    mechanism.


    # 64-Bit Mode


    Successive 64-bit words map to successive banks.'
