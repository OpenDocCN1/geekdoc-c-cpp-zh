  md: "# F.3.2. Preprocessor Symbols\n\n# F.3.2.1. __CUDA_ARCH__\n\n1. The type signature\
    \ of the following entities shall not depend on whether __CUDA_ARCH__ is defined\
    \ or not, or on a particular value of __CUDA_ARCH__ :\n\n+   __global__ functions\
    \ and function templates\n\n+   __device__ and __constant__ variables\n\n+   textures\
    \ and surfaces\n\nExample:\n\n```\n#if !defined(__CUDA_ARCH__)\ntypedef int mytype;\n\
    #else\ntypedef double mytype;\n#endif\n\ndevice mytype xxx;    // error: xxx's\
    \ type depends on __CUDA_ARCH__\n__global__ void foo(mytype in, // error: foo's\
    \ type depends on __CUDA_ARCH__\n                    mytype *ptr)\n{\n    *ptr\
    \ = in;\n}\n```\n\n2. If a __global__ function template is instantiated and launched\
    \ from the host, then the function template must be instantiated with the same\
    \ template arguments irrespective of whether __CUDA_ARCH__ is defined and regardless\
    \ of the value of __CUDA_ARCH__ .\n\nExample:\n\n```\ndevice int result;\ntemplate\
    \ <typename T>\n__global__ void kern(T in)\n{\n    result = in;\n}\n\n__host__\
    \ __device__ void foo(void)\n{\n#if !defined(__CUDA_ARCH__)\n    kern<<<1, 1>>>(1);\
    \    // error: \"kern<int>\" instantiation only\n#endif                    //\
    \ when __CUDA_ARCH__ is undefined!\n}\n\nint main(void)\n{\n    foo();\n    cudaDeviceSynchronize();\n\
    \    return 0;\n}\n```"
