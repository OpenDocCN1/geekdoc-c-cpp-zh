  md: '# B.24. #pragma unroll


    By default, the compiler unrolls small loops with a known trip count. The `#pragma
    unroll` directive however can be used to control unrolling of any given loop.
    It must be placed immediately before the loop and only applies to that loop. It
    is optionally followed by an integral constant expression (ICE). If the ICE is
    absent, the loop will be completely unrolled if its trip count is constant. If
    the ICE evaluates to 1, the compiler will not unroll the loop. The pragma will
    be ignored if the ICE evaluates to a non-positive integer or to an integer greater
    than the maximum value representable by the `int` data type.


    # Examples:


    ```

    ```cpp

    struct S1 { static const int value = 4; };

    template <int X, typename T2>

    __device__ void foo(int *p1, int *p2) {

    // no argument specified, loop will be completely unrolled

    #pragma unroll

    for (int i = 0; i < 12; ++i)

    p1[i] += p2[i]*2;


    // unroll value = 8

    #pragma unroll 8

    for (int i = 0; i < 12; ++i)

    p1[i] += p2[i]*4;


    // unroll value = 1, loop unrolling disabled

    #pragma unroll 1

    for (int i = 0; i < 12; ++i)

    p1[i] += p2[i]*8;


    // unroll value = 4

    #pragma unroll (T2::value)

    for (int i = 0; i < 12; ++i)

    p1[i] += p2[i]*16;

    }


    __global__ void bar(int *p1, int *p2) {

    Foo<7, SI_T<x>(p1, p2);

    }

    ```

    ```


    # B.25. SIMD Video Instructions


