- pgno: 16
  md: '# Chapter 1.

    INTRODUCTION


    # 1.1. From Graphics Processing to General Purpose Parallel Computing


    Driven by the insatiable market demand for realtime, high-definition 3D graphics,
    the programmable Graphic Processor Unit or GPU has evolved into a highly parallel,
    multithreaded, manycore processor with tremendous computational horsepower and
    very high memory bandwidth, as illustrated by Figure 1 and Figure 2.


    ![](img/c13b0ff67eed8f2c7b32afa2a587a8d6_16_0.png)


    Figure 1 Floating-Point Operations per Second for the CPU and GPU'
  merge: -1
  img_proc: true
- pgno: 17
  md: '![](img/c13b0ff67eed8f2c7b32afa2a587a8d6_17_0.png)


    # Figure 2 Memory Bandwidth for the CPU and GPU


    The reason behind the discrepancy in floating-point capability between the CPU
    and the GPU is that the GPU is specialized for highly parallel computation - exactly
    what graphics rendering is about - and therefore designed such that more transistors
    are devoted to data processing rather than data caching and flow control, as schematically
    illustrated by Figure 3.


    ![](img/c13b0ff67eed8f2c7b32afa2a587a8d6_17_1.png)


    # Figure 3 The GPU Devotes More Transistors to Data Processing


    This conceptually works for highly parallel computations because the GPU can hide
    memory access latencies with computation instead of avoiding memory access latencies
    through large data caches and flow control.


    Data-parallel processing maps data elements to parallel processing threads. Many
    applications that process large data sets can use a data-parallel programming
    model to speed up the computations. In 3D rendering, large sets of pixels and
    vertices are mapped to parallel threads. Similarly, image and media processing
    applications such as post-processing of rendered images, video encoding and decoding,
    image scaling, stereo vision, and pattern recognition can map image blocks and
    pixels to parallel processing threads. In fact, many algorithms outside the field
    of image rendering and processing are accelerated by data-parallel processing,
    from general signal processing or physics simulation to computational finance
    or computational biology.'
  merge: -1
  img_proc: true
- pgno: 18
  md: '# 1.2. CUDA®: A General-Purpose Parallel Computing Platform and Programming
    Model


    In November 2006, NVIDIA introduced CUDA®, a general purpose parallel computing
    platform and programming model that leverages the parallel compute engine in NVIDIA
    GPUs to solve many complex computational problems in a more efficient way than
    on a CPU.


    CUDA comes with a software environment that allows developers to use C++ as a
    high-level programming language. As illustrated by Figure 4, other languages,
    application programming interfaces, or directives-based approaches are supported,
    such as FORTRAN, DirectCompute, OpenACC.


    | GPU Computing Applications |

    | :--- |

    | Libraries and Middleware |

    | cuDNN TensorRT | cuFFT, cuBLAS, cuRAND, cuSPARSE | CULA MAGMA | Thrust NPP |
    NVPL, SVM, OpenCurrent | PhysX, OptiX, iRay | MATLAB Mathematica |

    | Programming Languages |

    | C | C++ | Fortran | Java, Python, Wrappers | DirectCompute | Directives (e.g.,
    OpenACC) |

    | CUDA-enabled NVIDIA GPUs |

    | Turing Architecture (Compute capabilities 7.x) | DRIVE/JETSON AGX Xavier | GeForce
    2000 Series | Quadro RTX Series | Tesla T Series |

    | Volta Architecture (Compute capabilities 7.x) | DRIVE/JETSON AGX Xavier | |
    | Tesla V Series |

    | Pascal Architecture (Compute capabilities 6.x) | Tegra X2 | GeForce 1000 Series
    | Quadro P Series | Tesla P Series |

    | Maxwell Architecture (Compute capabilities 5.x) | Tegra X1 | GeForce 900 Series
    | Quadro M Series | Tesla M Series |

    | Kepler Architecture (Compute capabilities 3.x) | Tegra K1 | GeForce 700 Series
    GeForce 600 Series | Quadro K Series | Tesla K Series |

    | | EMBEDDED | CONSUMER DESKTOP, LAPTOP | PROFESSIONAL WORKSTATION | DATA CENTER
    |


    Figure 4 GPU Computing Applications CUDA is designed to support various languages
    and application programming interfaces.


    # 1.3. A Scalable Programming Model


    The advent of multicore CPUs and manycore GPUs means that mainstream processor
    chips are now parallel systems. The challenge is to develop application software
    that transparently scales its parallelism to leverage the increasing number of
    processor cores, much as 3D graphics applications transparently scale their parallelism
    to manycore GPUs with widely varying numbers of cores.


    The CUDA parallel programming model is designed to overcome this challenge while
    maintaining a low learning curve for programmers familiar with standard programming
    languages such as C.'
  merge: -1
  img_proc: true
- pgno: 19
  md: 'At its core are three key abstractions - a hierarchy of thread groups, shared
    memories, and barrier synchronization - that are simply exposed to the programmer
    as a minimal set of language extensions.


    These abstractions provide fine-grained data parallelism and thread parallelism,
    nested within coarse-grained data parallelism and task parallelism. They guide
    the programmer to partition the problem into coarse sub-problems that can be solved
    independently in parallel by blocks of threads, and each sub-problem into finer
    pieces that can be solved cooperatively in parallel by all threads within the
    block.


    This decomposition preserves language expressivity by allowing threads to cooperate
    when solving each sub-problem, and at the same time enables automatic scalability.
    Indeed, each block of threads can be scheduled on any of the available multiprocessors
    within a GPU, in any order, concurrently or sequentially, so that a compiled CUDA
    program can execute on any number of multiprocessors as illustrated by Figure
    5, and only the runtime system needs to know the physical multiprocessor count.


    This scalable programming model allows the GPU architecture to span a wide market
    range by simply scaling the number of multiprocessors and memory partitions: from
    the high-performance enthusiast GeForce GPUs and professional Quadro and Tesla
    computing products to a variety of inexpensive, mainstream GeForce GPUs (see CUDA-Enabled
    GPUs for a list of all CUDA-enabled GPUs).'
  merge: -1
  img_proc: true
- pgno: 20
  md: '![](img/c13b0ff67eed8f2c7b32afa2a587a8d6_20_0.png)


    A GPU is built around an array of Streaming Multiprocessors (SMs) (see Hardware
    Implementation for more details). A multithreaded program is partitioned into
    blocks of threads that execute independently from each other, so that a GPU with
    more multiprocessors will automatically execute the program in less time than
    a GPU with fewer multiprocessors.


    # Figure 5 Automatic Scalability


    # 1.4. Document Structure


    This document is organized into the following chapters:


    +   - Chapter Introduction is a general introduction to CUDA.

    +   - Chapter Programming Model outlines the CUDA programming model.

    +   - Chapter Programming Interface describes the programming interface.

    +   - Chapter Hardware Implementation describes the hardware implementation.

    +   - Chapter Performance Guidelines gives some guidance on how to achieve maximum
    performance.

    +   - Appendix CUDA-Enabled GPUs lists all CUDA-enabled devices.

    +   - Appendix C++ Language Extensions is a detailed description of all extensions
    to the C++ language.'
  merge: -1
  img_proc: true
