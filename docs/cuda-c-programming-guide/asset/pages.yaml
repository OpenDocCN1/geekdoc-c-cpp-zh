    # D.4.3.1.3. Pending Kernel Launches


    When a kernel is launched, all associated configuration and parameter data is
    tracked

    until the kernel completes. This data is stored within a system-managed launch
    pool.


    The launch pool is divided into a fixed-size pool and a virtualized pool with
    lower

    performance. The device runtime system software will try to track launch data
    in the

    fixed-size pool first. The virtualized pool will be used to track new launches
    when the

    fixed-size pool is full.


    The size of the fixed-size launch pool is configurable by

    calling cudaDeviceSetLimit() from the host and specifying

    cudaLimitDevRuntimePendingLaunchCount.


    # D.4.3.1.4. Configuration Options


    Resource allocation for the device runtime system software is controlled via the

    cudaDeviceSetLimit() API from the host program. Limits must be set before

    any kernel is launched, and may not be changed while the GPU is actively running

    programs.


    The following named limits may be set:


    | Limit | Behavior |

    |---|---|

    | cudaLimitDevRuntimeSyncDepth | Sets the maximum depth at which cudaDeviceSynchronize()
    may be called. Launches may be performed deeper than this, but explicit synchronization
    deeper than this limit will return the cudaErrorLaunchMaxDepthExceeded. The default
    maximum sync depth is 2. |

    | cudaLimitDevRuntimePendingLaunchCount | Controls the amount of memory set aside
    for buffering kernel launches which have not yet begun to execute, due either
    to unresolved dependencies or lack of execution resources. When the buffer is
    full, the device runtime system software will attempt to track new pending launches
    in a lower performance virtualized buffer, if the virtualized buffer is also full,
    i.e. when all available heap space is consumed, launches will not occur. |'
