  md: 'mapped memory. For maximum performance, these memory accesses must be coalesced
    as with accesses to global memory (see Device Memory Accesses). Assuming that
    they are and that the mapped memory is read or written only once, using mapped
    page-locked memory instead of explicit copies between device and host memory can
    be a win for performance.


    On integrated systems where device memory and host memory are physically the same,
    any copy between host and device is superfluous and mapped page-locked memory
    should be used instead. Applications may query a device is integrated by checking
    that the integrated device property (see Device Enumeration) is equal to 1.


    # 5.3.2. Device Memory Accesses


    An instruction that accesses addressable memory (i.e., global, local, shared,
    constant, or texture memory) might need to be re-issued multiple times depending
    on the distribution of the memory addresses across the threads within the warp.
    How the distribution affects the instruction throughput this way is specific to
    each type of memory and described in the following sections. For example, for
    global memory, as a general rule, the more scattered the addresses are, the more
    reduced the throughput is.


    # Global Memory


    Global memory resides in device memory and device memory is accessed via 32-,
    64-, or 128-byte memory transactions. These memory transactions must be naturally
    aligned: Only the 32-, 64-, or 128-byte segments of device memory that are aligned
    to their size (i.e., whose first address is a multiple of their size) can be read
    or written by memory transactions.


    When a warp executes an instruction that accesses global memory, it coalesces
    the memory accesses of the threads within the warp into one or more of these memory
    transactions depending on the size of the word accessed by each thread and the
    distribution of the memory addresses across the threads. In general, the more
    transactions are necessary, the more unused words are transferred in addition
    to the words accessed by the threads, reducing the instruction throughput accordingly.
    For example, if a 32-byte memory transaction is generated for each thread''s 4-byte
    access, throughput is divided by 8.


    How many transactions are necessary and how much throughput is ultimately affected
    varies with the compute capability of the device. Compute Capability 3.x, Compute
    Capability 5.x, Compute Capability 6.x and Compute Capability 7.x give more details
    on how global memory accesses are handled for various compute capabilities.


    To maximize global memory throughput, it is therefore important to maximize coalescing
    by:


    +   - Following the most optimal access patterns based on Compute Capability 3.x,
    Compute Capability 5.x, Compute Capability 6.x and Compute Capability 7.x,


    +   - Using data types that meet the size and alignment requirement detailed in
    the section Size and Alignment Requirement below,'
