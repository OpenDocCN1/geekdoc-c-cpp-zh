    # 3.2.5.6.3.2. Prohibited and Unhandled Operations


    It is invalid to synchronize or query the execution status of a stream which is
    being captured or a captured event, because they do not represent items scheduled
    for execution. It is also invalid to query the execution status of or synchronize
    a broader handle which encompasses an active stream capture, such as a device
    or context handle when any associated stream is in capture mode.


    When any stream in the same context is being captured, and it was not created
    with cudaStreamNonBlocking, any attempted use of the legacy stream is invalid.
    This is because the legacy stream handle at all times encompasses these other
    streams; enqueueing to the legacy stream would create a dependency on the streams
    being captured, and querying it or synchronizing it would query or synchronize
    the streams being captured.


    It is therefore also invalid to call synchronous APIs in this case. Synchronous
    APIs, such as cudaMemcpy(), enqueue work to the legacy stream and synchronize
    it before returning.


    ![](img/c13b0ff67eed8f2c7b32afa2a587a8d6_56_1.png)'
