    Work submission using graphs is separated into three distinct stages: definition,
    instantiation, and execution.


    +   - During the definition phase, a program creates a description of the operations
    in the graph along with the dependencies between them.


    +   - Instantiation takes a snapshot of the graph template, validates it, and
    performs much of the setup and initialization of work with the aim of minimizing
    what needs to be done at launch. The resulting instance is known as an executable
    graph.


    +   - An executable graph may be launched into a stream, similar to any other
    CUDA work. It may be launched any number of times without repeating the instantiation.


    # 3.2.5.6.1. Graph Structure


    An operation forms a node in a graph. The dependencies between the operations
    are the edges. These dependencies constrain the execution sequence of the operations.


    An operation may be scheduled at any time once the nodes on which it depends are
    complete. Scheduling is left up to the CUDA system.


    # 3.2.5.6.1.1. Node Types


    A graph node can be one of:


    +   - kernel


    +   - CPU function call


    +   - memory copy


    +   - memset


    +   - empty node


