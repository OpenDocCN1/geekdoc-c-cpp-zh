    \ that support the `concurrentKernels` device property) and/or with copies to\
    \ or from the device (for devices that support the `asyncEngineCount` property).\
    \ Intra-device copies are initiated using the standard memory copy functions with\
    \ destination and source addresses residing on the same device.\n\n# 3.2.5.4.\
    \ Concurrent Data Transfers\n\nSome devices of compute capability 2.x and higher\
    \ can overlap copies to and from the device. Applications may query this capability\
    \ by checking the `asyncEngineCount` device property (see Device Enumeration),\
    \ which is equal to 2 for devices that support it. In order to be overlapped,\
    \ any host memory involved in the transfers must be page-locked.\n\n# 3.2.5.5.\
    \ Streams\n\nApplications manage the concurrent operations described above through\
    \ *streams*. A stream is a sequence of commands (possibly issued by different\
    \ host threads) that execute in order. Different streams, on the other hand, may\
    \ execute their commands out of order with respect to one another or concurrently;\
    \ this behavior is not guaranteed and should therefore not be relied upon for\
    \ correctness (e.g., inter-kernel communication is undefined). The commands issued\
    \ on a stream may execute when all the dependencies of the command are met. The\
    \ dependencies could be previously launched commands on same stream or dependencies\
    \ from other streams. The successful completion of synchronize call guarantees\
    \ that all the commands launched are completed.\n\n# 3.2.5.5.1. Creation and Destruction\n\
    \nA stream is defined by creating a stream object and specifying it as the stream\
    \ parameter to a sequence of kernel launches and host <-> device memory copies.\
    \ The following code sample creates two streams and allocates an array `hostPtr`\
    \ of `float` in page-locked memory.\n\n```\ncudaStream_t stream[2];\nfor (int\
    \ i = 0; i < 2; ++i)\n    cudaStreamCreate(&stream[i]);\nfloat* hostPtr;\ncudaMallocHost(&hostPtr,\
    \ 2 * size);\n```"
