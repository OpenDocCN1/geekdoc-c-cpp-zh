  md: '# ## F.5.3. Notes on __host__ __device__ lambdas


    Unlike __device__ lambdas, __host__ __device__ lambdas can be called from host
    code. As described earlier, the CUDA compiler replaces an extended lambda expression
    defined in host code with an instance of a named placeholder type. The placeholder
    type for an extended __host__ __device__ lambda invokes the original lambda''s
    operator() with an indirect function call 24.


    The presence of the indirect function call may cause an extended __host__ __device__
    lambda to be less optimized by the host compiler than lambdas that are implicitly
    or explicitly __host__ only. In the latter case, the host compiler can easily
    inline the body of the lambda into the calling context. But in case of an extended
    __host__ __device__ lambda, the host compiler encounters the indirect function
    call and may not be able to easily inline the original __host__ __device__ lambda
    body.


    # ## F.5.4. *this Capture By Value


    When a lambda is defined within a non-static class member function, and the body
    of the lambda refers to a class member variable, C++11/C++14 rules require that
    the this pointer of the class is captured by value, instead of the referenced
    member variable. If the lambda is an extended __device__ or __host__ __device__
    lambda defined in a host function, and the lambda is executed on the GPU, accessing
    the referenced member variable on the GPU will cause a run time error if the this
    pointer points to host memory.


    24 The closure object is stored in a type-elided container similar to std::function.'
