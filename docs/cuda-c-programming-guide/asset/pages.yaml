    # Integer Arithmetic


    Integer division and modulo operation are costly as they compile to up to 20 instructions.
    They can be replaced with bitwise operations in some cases: If n is a power of
    2, (i/n) is equivalent to (i>>log2(n)) and (i&n) is equivalent to (i&(n-1)); the
    compiler will perform these conversions if n is literal.


    __brev and __popc map to a single instruction and __brevll and __popcll to a few
    instructions.


    __[u]mul24 are legacy intrinsic functions that no longer have any reason to be
    used.


    # Half Precision Arithmetic


    In order to achieve good half precision floating-point add, multiply or multiply-add
    throughput it is recommended that the half2 datatype is used. Vector intrinsics
    (eg. __hadd2, __hsub2, __hmul2, __hfma2) can then be used to do two operations
    in a single instruction. Using half2 in place of two calls using half may also
    help performance of other intrinsics, such as warp shuffles.


    The intrinsic __halves2half2 is provided to convert two half precision values
    to the half2 datatype.


    # Type Conversion


    Sometimes, the compiler must insert conversion instructions, introducing additional
    execution cycles. This is the case for:


    +   Functions operating on variables of type char or short whose operands generally
    need to be converted to int,


    +   Double-precision floating-point constants (i.e., those constants defined without
    any type suffix) used as input to single-precision floating-point computations
    (as mandated by C/C++ standards).


    This last case can be avoided by using single-precision floating-point constants,
    defined with an f suffix such as 3.141592653589793f, 1.0f, 0.5f.


    # 5.4.2. Control Flow Instructions


    Any flow control instruction (if, switch, do, for, while) can significantly impact
    the effective instruction throughput by causing threads of the same warp to diverge
    (i.e., to follow different execution paths). If this happens, the different executions
    paths have to be serialized, increasing the total number of instructions executed
    for this warp.'
