    \ and `y` and the `comp` parameter as described in Texture Gather. `Type` is a\
    \ 4-component vector type. It is based on the base type of `DataType` except when\
    \ `readMode` is equal to `cudaReadModeNormalizedFloat` (see Texture Reference\
    \ API), in which case it is always `float4`.\n\n# B.9. Surface Functions\n\nSurface\
    \ functions are only supported by devices of compute capability 2.0 and higher.\n\
    \nSurface objects are described in described in Surface Object API\n\nSurface\
    \ references are described in Surface Reference API.\n\nIn the sections below,\
    \ `boundaryMode` specifies the boundary mode, that is how out-of-range surface\
    \ coordinates are handled; it is equal to either `cudaBoundaryModeClamp`, in which\
    \ case out-of-range coordinates are clamped to the valid range, or `cudaBoundaryModeZero`,\
    \ in which case out-of-range reads return zero and out-of-range writes are ignored,\
    \ or `cudaBoundaryModeTrap`, in which case out-of-range accesses cause the kernel\
    \ execution to fail.\n\n# B.9.1. Surface Object API\n\n# B.9.1.1. surf1Dread()\n\
    \n```\ntemplate<class T>\nT surf1Dread(cudaSurfaceObject_t surfObj, int x,\n \
