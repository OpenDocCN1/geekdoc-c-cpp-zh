  md: "These traits can be used in all compilation modes, irrespective of whether\
    \ lambdas or extended lambdas are enabled²².\n\n# Example:\n\n```\n```cpp\n#define\
    \ IS_D_LAMBDA(X) _rv_is_extended_device_lambda_closure_type(X)\n#define IS_HD_LAMBDA(X)\
    \ __rv_is_extended_host_device_lambda_closure_type(X)\n\nauto lam0 = [] { host__device__\
    \ {} };\nvoid foo(void) {\n auto lam1 = [] {} ;\n auto lam2 = [] __device__ {}\
    \ ;\n auto lam3 = [] __host__ __device__ {} ;\n // lam0 is not an extended lambda\
    \ (since defined outside function scope)\n static_assert(!IS_D_LAMBDA(decltype(lam1)),\
    \ \"\");\n static_assert(!IS_HD_LAMBDA(decltype(lam1)), \"\");\n // lam1 is not\
    \ an extended lambda (since no execution space annotations)\n static_assert(!IS_D_LAMBDA(decltype(lam1)),\
    \ \"\");\n static_assert(!IS_HD_LAMBDA(decltype(lam1)), \"\");\n // lam2 is an\
    \ extended device lambda\n static_assert(IS_D_LAMBDA(decltype(lam2)), \"\");\n\
    \ static_assert(!IS_HD_LAMBDA(decltype(lam2)), \"\");\n // lam3 is an extended\
    \ host__device__ lambda\n static_assert(IS_D_LAMBDA(decltype(lam3)), \"\");\n\
    \ static_assert(IS_HD_LAMBDA(decltype(lam3)), \"\";\n}\n```\n```\n\n# F.5.2. Extended\
    \ Lambda Restrictions\n\nThe CUDA compiler will replace an extended lambda expression\
    \ with an instance of a placeholder type defined in namespace scope, before invoking\
    \ the host compiler. The template argument of the placeholder type requires taking\
    \ the address of a function enclosing the original extended lambda expression.\
    \ This is required for the correct execution of any __global__ function template\
    \ whose template argument involves the closure type of an extended lambda. The\
    \ enclosing template is computed as follows.\n\nBy definition, the extended lambda\
    \ is present within the immediate or nested block scope of a __host__ or __host__\
    \ __device__ function. If this function is not the operator () of a lambda expression,\
    \ then it is considered the enclosing function for the extended lambda. Otherwise,\
    \ the extended lambda is defined within the immediate or nested block scope of\
    \ the operator () of one or more enclosing lambda expressions. If the outermost\
    \ such lambda expression is defined in the immediate or nested block scope of\
    \ a function F, then F is the computed enclosing function, else the enclosing\
    \ function does not exist.\n\n22 The traits will always return false if extended\
    \ lambda mode is not active."
