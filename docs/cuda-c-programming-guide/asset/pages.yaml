    # 3.2.5.6.3.3. Invalidation


    When an invalid operation is attempted during stream capture, any associated capture
    graphs are invalidated. When a capture graph is invalidated, further use of any
    streams which are being captured or captured events associated with the graph
    is invalid and will return an error, until stream capture is ended with cudaStreamEndCapture().
    This call will take the associated streams out of capture mode, but will also
    return an error value and a NULL graph.


    # 3.2.5.6.4. Using Graph APIs


    cudaGraph_t objects are not thread-safe. It is the responsibility of the user
    to ensure that multiple threads do not concurrently access the same cudaGraph_t.


    A cudaGraphExec_t cannot run concurrently with itself. A launch of a cudaGraphExec_t
    will be ordered after previous launches of the same executable graph.


    Graph execution is done in streams for ordering with other asynchronous work.
    However, the stream is for ordering only; it does not constrain the internal parallelism
    of the graph, nor does it affect where graph nodes execute.


    See Graph API.


    # 3.2.5.7. Events


    The runtime also provides a way to closely monitor the device''s progress, as
