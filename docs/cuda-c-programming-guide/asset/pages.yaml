- pgno: 29
  md: '# 2.5. Compute Capability


    The compute capability of a device is represented by a version number, also sometimes
    called its "SM version". This version number identifies the features supported
    by the GPU hardware and is used by applications at runtime to determine which
    hardware features and/or instructions are available on the present GPU.


    The compute capability comprises a major revision number X and a minor revision
    number Y and is denoted by X.Y.


    Devices with the same major revision number are of the same core architecture.
    The major revision number is 7 for devices based on the Volta architecture, 6
    for devices based on the Pascal architecture, 5 for devices based on the Maxwell
    architecture, 3 for devices based on the Kepler architecture, 2 for devices based
    on the Fermi architecture, and 1 for devices based on the Tesla architecture.


    The minor revision number corresponds to an incremental improvement to the core
    architecture, possibly including new features.


    Turing is the architecture for devices of compute capability 7.5, and is an incremental
    update based on the Volta architecture.


    CUDA-Enabled GPUs lists of all CUDA-enabled devices along with their compute capability.
    Compute Capabilities gives the technical specifications of each compute capability.


    > The compute capability version of a particular GPU should not be confused with
    the CUDA version (e.g., CUDA 7.5, CUDA 8, CUDA 9), which is the version of the
    CUDA software platform. The CUDA platform is used by application developers to
    create applications that run on many generations of GPU architectures, including
    future GPU architectures yet to be invented. While new versions of the CUDA platform
    often add native support for a new GPU architecture by supporting the compute
    capability version of that architecture, new versions of the CUDA platform typically
    also include software features that are independent of hardware generation.


    The Tesla and Fermi architectures are no longer supported starting with CUDA 7.0
    and CUDA 9.0, respectively.'
