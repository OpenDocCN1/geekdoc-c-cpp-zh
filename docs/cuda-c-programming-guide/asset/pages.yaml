    # G.3. Table Lookup


    A table lookup TL(x) where x spans the interval [0,R] can be implemented as TL(x)=tex((N-1)R/x+0.5)
    in order to ensure that TL(0)=T[0] and TL(R)=T[N-1].


    Figure 17 illustrates the use of texture filtering to implement a table lookup
    with R=4 or R=1 from a one-dimensional texture with N=4.'
