    As mentioned above, only supported are tile sizes which are a power of 2 and no
    larger than 32.


    # C.2.2.4. Coalesced Groups


    In CUDA''s SIMT architecture, at the hardware level the multiprocessor executes
    threads in groups of 32 called warps. If there exists a data-dependent conditional
    branch in the application code such that threads within a warp diverge, then the
    warp serially executes each branch disabling threads not on that path. The threads
    that remain active on the path are referred to as coalesced. Cooperative Groups
    has functionality to discover, and create, a group containing all coalesced threads
    as follows:


    ```

    coalesced_group active = coalesced_threads();

    ```


    For example, consider a situation whereby there is a branch in the code in which
    only the 2nd, 4th and 8th threads in each warp are active. The above call, placed
    in that branch, will create (for each warp) a group, **active**, that has three
    threads (with ranks 0-2 inclusive).


