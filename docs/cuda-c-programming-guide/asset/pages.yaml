    # 3.2.9. Error Checking


    All runtime functions return an error code, but for an asynchronous function (see
    Asynchronous Concurrent Execution), this error code cannot possibly report any
    of the asynchronous errors that could occur on the device since the function returns
    before the device has completed the task; the error code only reports errors that
    occur on the host prior to executing the task, typically related to parameter
    validation; if an asynchronous error occurs, it will be reported by some subsequent
    unrelated runtime function call.


    The only way to check for asynchronous errors just after some asynchronous function
    call is therefore to synchronize just after the call by calling `cudaDeviceSynchronize
    ()` (or by using any other synchronization mechanisms described in Asynchronous
    Concurrent Execution) and checking the error code returned by `cudaDeviceSynchronize
    ()`.


