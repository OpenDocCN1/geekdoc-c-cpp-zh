  md: "Alignment requirements in device code for the built-in vector types are listed\
    \ in Table 4. For all other basic types, the alignment requirement in device code\
    \ matches the alignment requirement in host code and can therefore be obtained\
    \ using __alignof().\n\nThe only exception is when the host compiler aligns double\
    \ and long long (and long on a 64-bit system) on a one-word boundary instead of\
    \ a two-word boundary (for example, using gcc's compilation flag -mno-align-double)\
    \ since in device code these types are always aligned on a two-word boundary.\n\
    \nCUdeviceptr is an integer, but represents a pointer, so its alignment requirement\
    \ is __alignof(void*).\n\nThe following code sample uses a macro (ALIGN_UP())\
    \ to adjust the offset of each parameter to meet its alignment requirement and\
    \ another macro (ADD_TO_PARAM_BUFFER()) to add each parameter to the parameter\
    \ buffer passed to the CU_LAUNCH_PARAM_BUFFER_POINTER option.\n\n```\n#define\
    \ ALIGN_UP(offset, alignment) \\\n    (offset) = ((offset) + (alignment) - 1)\
    \ & ~((alignment) - 1)\nchar paramBuffer[1024];\nsize_t paramBufferSize = 0;\n\
    #define ADD_TO_PARAM_BUFFER(value, alignment) \\\n    do { \\\n        paramBufferSize\
    \ = ALIGN_UP(paramBufferSize, alignment); \\\n        memcpy(paramBuffer + paramBufferSize,\
    \ \\\n               &(value), sizeof(value)); \\\n        paramBufferSize +=\
    \ sizeof(value); \\\n    } while (0)\nint i;\nADD_TO_PARAM_BUFFER(i, __alignof(i));\n\
    float4 f4;\nADD_TO_PARAM_BUFFER(f4, 16); // float4's alignment is 16\nchar c;\n\
    ADD_TO_PARAM_BUFFER(c, __alignof(c));\nfloat f;\nADD_TO_PARAM_BUFFER(f, __alignof(f));\n\
    CUdevptr devPtr;\nADD_TO_PARAM_BUFFER(devPtr, __alignof(devPtr));\nfloat2 f2;\n\
    ADD_TO_PARAM_BUFFER(f2, 8); // float2's alignment is 8\nvoid* extra[] = {\n  \
    \  CU_LAUNCH_PARAM_BUFFER_POINTER, paramBuffer,\n    CU_LAUNCH_PARAM_BUFFER_SIZE,\
    \ &paramBufferSize,\n    CU_LAUNCH_PARAM_END\n};\ncuLaunchKernel(cuFunction,\n\
    \               blockWidth, blockHeight, blockDepth,\n               gridWidth,\
    \ gridHeight, gridDepth,\n               0, 0, 0, extra);\n```\n\nThe alignment\
    \ requirement of a structure is equal to the maximum of the alignment requirements\
    \ of its fields. The alignment requirement of a structure that contains built-in\
    \ vector types, CUdeviceptr, or non-aligned double and long long might therefore\
    \ differ between device code and host code. Such a structure might also be padded\
    \ differently. The following structure, for example, is not padded at all in host\
    \ code, but it"
