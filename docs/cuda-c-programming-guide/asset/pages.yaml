  md: "# 3.3.1. Vulkan Interoperability\n\n# 3.3.1.1. Matching device UUIDs\n\nWhen\
    \ importing memory and synchronization objects exported by Vulkan, they must be\
    \ imported and mapped on the same device as they were created on. The CUDA device\
