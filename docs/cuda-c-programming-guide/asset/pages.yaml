  md: '# E.2. Intrinsic Functions


    The functions from this section can only be used in device code.


    Among these functions are the less accurate, but faster versions of some of the
    functions of Standard Functions. They have the same name prefixed with __ (such
    as __sinf(x)). They are faster as they map to fewer native instructions. The compiler
    has an option (-use_fast_math) that forces each function in Table 9 to compile
    to its intrinsic counterpart. In addition to reducing the accuracy of the affected
    functions, it may also cause some differences in special case handling. A more
    robust approach is to selectively replace mathematical function calls by calls
    to intrinsic functions only where it is merited by the performance gains and where
    changed properties such as reduced accuracy and different special case handling
    can be tolerated.


    # Table 9 Functions Affected by -use_fast_math


    | Operator/Function | Device Function |

    |---|---|

    | x/y | __fdividef(x, y) |

    | sinf(x) | __sinf(x) |

    | cosf(x) | __cosf(x) |

    | tanf(x) | __tanf(x) |

    | sincosf(x, sptr, cptr) | __sincosf(x, sptr, cptr) |

    | logf(x) | __logf(x) |

    | log2f(x) | __log2f(x) |

    | log10f(x) | __log10f(x) |

    | expf(x) | __expf(x) |

    | exp10f(x) | __exp10f(x) |

    | powf(x, y) | __powf(x, y) |


    # Single-Precision Floating-Point Functions


    __fadd_[rn, rz, ru, rd]() and __fmul_[rn, rz, ru, rd]() map to addition and multiplication
    operations that the compiler never merges into FMADs. By contrast, additions and
    multiplications generated from the ''*'' and ''+'' operators will frequently be
    combined into FMADs.


    Functions suffixed with _rn operate using the round to nearest even rounding mode.


    Functions suffixed with _rz operate using the round towards zero rounding mode.


    Functions suffixed with _ru operate using the round up (to positive infinity)
    rounding mode.'
