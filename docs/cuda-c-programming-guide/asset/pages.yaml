    which operate on pairs of 16-bit values and quads of 8-bit values. These are available
    on devices of compute capability 3.0.


    The SIMD video instructions are:


    +   - vadd2, vadd4

    +   - vsub2, vsub4


    9 See the C++ Standard for definition of integral constant expression.'
