  md: "while a kernel is active. Here we present a system for finer-grained control\
    \ of managed memory designed to work on all devices supporting managed memory,\
    \ including older architectures with concurrentManagedAccess equal to 0.\n\nThe\
    \ CUDA programming model provides streams as a mechanism for programs to indicate\
    \ dependence and independence among kernel launches. Kernels launched into the\
    \ same stream are guaranteed to execute consecutively, while kernels launched\
    \ into different streams are permitted to execute concurrently. Streams describe\
    \ independence between work items and hence allow potentially greater efficiency\
    \ through concurrency.\n\nUnified Memory builds upon the stream-independence model\
    \ by allowing a CUDA program to explicitly associate managed allocations with\
    \ a CUDA stream. In this way, the programmer indicates the use of data by kernels\
    \ based on whether they are launched into a specified stream or not. This enables\
    \ opportunities for concurrency based on program-specific data access patterns.\
    \ The function to control this behaviour is:\n\n```\ncudaError_t cudaStreamAttachMemAsync(cudaStream_t\
    \ stream,\n void *ptr,\n size_t length=0,\n unsigned int flags=0);\n```\n\nThe\
    \ cudaStreamAttachMemAsync() function assigns length bytes of memory starting\
    \ from ptr with the specified stream. (Currently, length must always be 0 to indicate\
    \ that the entire region should be attached.) Because of this association, the\
    \ Unified Memory system allows CPU access to this memory region so long as all\
    \ operations in stream have completed, regardless of whether other streams are\
    \ active. In effect, this constrains exclusive ownership of the managed memory\
    \ region by an active GPU to per-stream activity instead of whole-GPU activity.\n\
