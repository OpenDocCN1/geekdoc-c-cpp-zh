- pgno: 77
  md: '# 3.2.11.2.4. Cubemap Layered Surfaces


    Cubemap layered surfaces are accessed using `surfCubemapLayeredread()` and `surfCubemapLayeredwrite()`
    (surfCubemapLayeredread() and surfCubemapLayeredwrite()) as a two-dimensional
    layered surface, i.e., using an integer index denoting a face of one of the cubemaps
    and two floating-point texture coordinates addressing a texel within the layer
    corresponding to this face. Faces are ordered as indicated in Table 2, so index
    ((2 * 6) + 3), for example, accesses the fourth face of the third cubemap.


    # 3.2.11.13. CUDA Arrays


    CUDA arrays are opaque memory layouts optimized for texture fetching. They are
    one dimensional, two dimensional, or three-dimensional and composed of elements,
    each of which has 1, 2 or 4 components that may be signed or unsigned 8-, 16-,
    or 32-bit integers, 16-bit floats, or 32-bit floats. CUDA arrays are only accessible
    by kernels through texture fetching as described in Texture Memory or surface
    reading and writing as described in Surface Memory.


    # 3.2.11.14. Read/Write Coherency


    The texture and surface memory is cached (see Device Memory Accesses) and within
    the same kernel call, the cache is not kept coherent with respect to global memory
    writes and surface memory writes, so any texture fetch or surface read to an address
    that has been written to via a global write or a surface write in the same kernel
    call returns undefined data. In other words, a thread can safely read some texture
    or surface memory location only if this memory location has been updated by a
    previous kernel call or memory copy, but not if it has been previously updated
    by the same thread or another thread from the same kernel call.


    # 3.2.12. Graphics Interoperability


    Some resources from OpenGL and Direct3D may be mapped into the address space of
    CUDA, either to enable CUDA to read data written by OpenGL or Direct3D, or to
    enable CUDA to write data for consumption by OpenGL or Direct3D.


    A resource must be registered to CUDA before it can be mapped using the functions
    mentioned in OpenGL Interoperability and Direct3D Interoperability. These functions
    return a pointer to a CUDA graphics resource of type `struct cudaGraphicsResource`.
    Registering a resource is potentially high-overhead and therefore typically called
    only once per resource. A CUDA graphics resource is unregistered using `cudaGraphicsUnregisterResource()`.
    Each CUDA context which intends to use the resource is required to register it
    separately.


    Once a resource is registered to CUDA, it can be mapped and unmapped as many times
    as necessary using `cudaGraphicsMapResources()` and `cudaGraphicsUnmapResources()`.
    `cudaGraphicsResourceSetMapFlags()` can be called to specify usage hints (write-only,
    read-only) that the CUDA driver can use to optimize resource management.'
