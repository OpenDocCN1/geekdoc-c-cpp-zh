- pgno: 260
  md: "# Example:\n\n```\nconstexpr int xxx = 10;\nconstexpr int yyy = xxx + 4;\n\
    struct S1_t { static constexpr int qqq = 100; };\n\nconstexpr int host_arr[] =\
    \ { 1, 2, 3 };\nconstexpr __device__ int get(int idx) { return host_arr[idx];\
    \ }\n\ndevice int foo(int idx) {\n  int v1 = xxx + yyy + S1_t::qqg;   // OK\n\
    \  const int &v2 = xxx;              // error: reference to host constexpr variable\n\
    \  const int *v3 = &xxx;             // error: address of host constexpr variable\n\
    \  const int &v4 = S1_t::qqg;        // error: reference to host constexpr variable\n\
    \  const int *v5 = &S1_t::qqg;       // error: address of host constexpr variable\n\
    \n  v1 += get(2);                     // OK: 'get(2)' is a constant expression\n\
    \  v1 += get(idx);                   // error: 'get(idx)' is not a constant expression\n\
    \  v1 += host_arr[2];                // error: 'host_arr' does not have scalar\
    \ type.\n\n  return v1;\n}\n```\n\n# F.3.16.6. Inline namespaces\n\nFor an input\
    \ CUDA translation unit, the CUDA compiler may invoke the host compiler for compiling\
    \ the host code within the translation unit. In the code passed to the host compiler,\
    \ the CUDA compiler will inject additional compiler generated code, if the input\
    \ CUDA translation unit contained a definition of any of the following entities:\n\
    \n+   * `__global__` function or function template instantiation\n+   * `__device____constant__`\n\
    +   * variables with surface or texture type\n\nThe compiler generated code contains\
    \ a reference to the defined entity. If the entity is defined within an inline\
    \ namespace and another entity of the same name and type signature is defined\
    \ in an enclosing namespace, this reference may be considered ambiguous by the\
    \ host compiler and host compilation will fail.\n\nThis limitation can be avoided\
    \ by using unique names for such entities defined within an inline namespace.\n\
    \n# Example:\n\n```\n__device__ int Gvar;\ninline namespace N1 {\n  __device__\
    \ int Gvar;\n}\n\n// <-- CUDA compiler inserts a reference to \"Gvar\" at this\
    \ point in the\n// translation unit. This reference will be considered ambiguous\
    \ by the\n// host compiler and compilation will fail.\n```"
