    \ Declaration of cudaGetParameterBuffer()\nextern \"C\" __device__\nvoid *cudaGetParameterBuffer(size_t\
    \ alignment, size_t size);\n```\n\nThe first parameter specifies the alignment\
    \ requirement of the parameter buffer and the second parameter the size requirement\
    \ in bytes. In the current implementation, the parameter buffer returned by cudaGetParameterBuffer()\
    \ is always guaranteed to be 64- byte aligned, and the alignment requirement parameter\
    \ is ignored. However, it is recommended to pass the correct alignment requirement\
    \ value - which is the largest alignment of any parameter to be placed in the\
    \ parameter buffer - to cudaGetParameterBuffer() to ensure portability in the\
    \ future.\n\n# D.3.2.2. Parameter Buffer Layout\n\nParameter reordering in the\
    \ parameter buffer is prohibited, and each individual parameter placed in the\
    \ parameter buffer is required to be aligned. That is, each parameter must be\
    \ placed at the nth byte in the parameter buffer, where n is the smallest multiple\
    \ of the parameter size that is greater than the offset of the last byte taken\
    \ by the preceding parameter. The maximum size of the parameter buffer is 4KB.\n\
    \nFor a more detailed description of PTX code generated by the CUDA compiler,\
    \ please refer to the PTX-3.5 specification.\n\n# D.3.3. Toolkit Support for Dynamic\
