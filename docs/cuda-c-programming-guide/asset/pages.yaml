    \ it is visible to all running kernels regardless of their stream. This is the\
    \ default visibility for a cudaMallocManaged() allocation or a __managed__ variable;\
    \ hence, the simple-case rule that the CPU may not touch the data while any kernel\
    \ is running.\n\nBy associating an allocation with a specific stream, the program\
    \ makes a guarantee that only kernels launched into that stream will touch that\
    \ data. No error checking is performed by the Unified Memory system: it is the\
    \ programmer's responsibility to ensure that guarantee is honored.\n\nIn addition\
    \ to allowing greater concurrency, the use of cudaStreamAttachMemAsync() can (and\
    \ typically does) enable data transfer optimizations within the Unified Memory\
    \ system that may affect latencies and other overhead.\n\n# K.2.2.4. Stream Association\
    \ Examples\n\nAssociating data with a stream allows fine-grained control over\
    \ CPU + GPU concurrency, but what data is visible to which streams must be kept\
