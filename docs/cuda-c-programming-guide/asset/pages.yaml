  md: 'A shareable Direct3D 12 committed resource can also be imported using a named
    handle if one exists as shown below.


    ```

    cudaExternalMemory_t importD3D12CommittedResourceFromNamedNTHandle(LPCWSTR name,

    unsigned long long size) {

    cudaExternalMemory_t extMem = NULL;

    cudaExternalMemoryHandleDesc desc = {};

    memset(&desc, 0, sizeof(desc));

    desc.type = cudaExternalMemoryHandleTypeD3D12Resource;

    desc.handle.win32.name = (void *)+name;

    desc.size = size;

    desc.flags = cudaExternalMemoryDedicated;

    cudaImportExternalMemory(&extMem, &desc);

    return extMem;

    }

    ```


    # 3.3.3.3. Mapping buffers onto imported memory objects


    A device pointer can be mapped onto an imported memory object as shown below.
    The offset and size of the mapping must match that specified when creating the
    mapping using the corresponding Direct3D 12 API. All mapped device pointers must
    be freed using cudaFree().


    ```

    void * mapBufferOntoExternalMemory(cudaExternalMemory_t extMem, unsigned long

    long offset, unsigned long long size) {

    void *ptr = NULL;

    cudaExternalMemoryBufferDesc desc = {};

    memset(&desc, 0, sizeof(desc));

    desc.offset = offset;

    desc.size = size;

    cudaExternalMemoryGetMappedBuffer(&ptr, extMem, &desc);

    // Note: ''ptr'' must eventually be freed using cudaFree()

    return ptr;

    }

    ```


    # 3.3.3.4. Mapping mipmapped arrays onto imported memory objects


