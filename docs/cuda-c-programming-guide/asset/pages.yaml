- pgno: 301
  md: 'A shared memory request for a warp does not generate a bank conflict between
    two threads that access any sub-word within the same 64-bit word (even though
    the addresses of the two sub-words fall in the same bank): In that case, for read
    accesses, the 64-bit word is broadcast to the requesting threads and for write
    accesses, each sub-word is written by only one of the threads (which thread performs
    the write is undefined).


    # 32-Bit Mode


    Successive 32-bit words map to successive banks.


    A shared memory request for a warp does not generate a bank conflict between two
    threads that access any sub-word within the same 32-bit word or within two 32-bit
    words whose indices i and j are in the same 64-word aligned segment (i.e., a segment
    whose first index is a multiple of 64) such that j=i+32 (even though the addresses
    of the two sub-words fall in the same bank): In that case, for read accesses,
    the 32-bit words are broadcast to the requesting threads and for write accesses,
    each sub-word is written by only one of the threads (which thread performs the
    write is undefined).


    # H.4. Compute Capability 5.x


    # H.4.1. Architecture


    A multiprocessor consists of:


    +   - 128 CUDA cores for arithmetic operations (see Arithmetic Instructions for
    throughputs of arithmetic operations),

    +   - 32 special function units for single-precision floating-point transcendental
    functions,

    +   - 4 warp schedulers.


    When a multiprocessor is given warps to execute, it first distributes them among
    the four schedulers. Then, at every instruction issue time, each scheduler issues
    one instruction for one of its assigned warps that is ready to execute, if any.


    A multiprocessor has:


    +   - a read-only constant cache that is shared by all functional units and speeds
    up reads from the constant memory space, which resides in device memory,

    +   - a unified L1/texture cache of 24 KB used to cache reads from global memory,

    +   - 64 KB of shared memory for devices of compute capability 5.0 or 96 KB of
    shared memory for devices of compute capability 5.2.


    The unified L1/texture cache is also used by the texture unit that implements
    the various addressing modes and data filtering mentioned in Texture and Surface
    Memory.


    There is also an L2 cache shared by all multiprocessors that is used to cache
    accesses to local or global memory, including temporary register spills. Applications
    may query the L2 cache size by checking the l2CacheSize device property (see Device
    Enumeration).'
  merge: -1
  img_proc: true
- pgno: 302
  md: 'The cache behavior (e.g., whether reads are cached in both the unified L1/texture
    cache and L2 or in L2 only) can be partially configured on a per-access basis
    using modifiers to the load instruction.


    # H.4.2. Global Memory


    Global memory accesses are always cached in L2 and caching in L2 behaves in the
    same way as for devices of compute capability 3.x (see Global Memory).


    Data that is read-only for the entire lifetime of the kernel can also be cached
    in the unified L1/texture cache described in the previous section by reading it
    using the __ldg() function (see Read-Only Data Cache Load Function). When the
    compiler detects that the read-only condition is satisfied for some data, it will
    use __ldg() to read it. The compiler might not always be able to detect that the
    read-only condition is satisfied for some data. Marking pointers used for loading
    such data with both the const and __restrict__ qualifiers increases the likelihood
    that the compiler will detect the read-only condition.


    Data that is not read-only for the entire lifetime of the kernel cannot be cached
    in the unified L1/texture cache for devices of compute capability 5.0. For devices
    of compute capability 5.2, it is, by default, not cached in the unified L1/texture
    cache, but caching may be enabled using the following mechanisms:


    +   - Perform the read using inline assembly with the appropriate modifier as
    described in the PTX reference manual;


    +   - Compile with the -Xptxas -dlcm=ca compilation flag, in which case all reads
    are cached, except reads that are performed using inline assembly with a modifier
    that disables caching;


    +   - Compile with the -Xptxas -fscm=ca compilation flag, in which case all reads
    are cached, including reads that are performed using inline assembly regardless
    of the modifier used.


    When caching is enabled using one of the three mechanisms listed above, devices
    of compute capability 5.2 will cache global memory reads in the unified L1/texture
    cache for all kernel launches except for the kernel launches for which thread
    blocks consume too much of the multiprocessor’s register file. These exceptions
    are reported by the profiler.


    # H.4.3. Shared Memory


    Shared memory has 32 banks that are organized such that successive 32-bit words
    map to successive banks. Each bank has a bandwidth of 32 bits per clock cycle.


    A shared memory request for a warp does not generate a bank conflict between two
    threads that access any address within the same 32-bit word (even though the two
    addresses fall in the same bank): In that case, for read accesses, the word is
    broadcast to the requesting threads and for write accesses, each address is written
    by only one of the threads (which thread performs the write is undefined).


    Figure 19 shows some examples of strided access.'
