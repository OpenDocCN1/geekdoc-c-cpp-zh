  md: "# B.12.1.6. atomicInc()\n\n```\nunsigned int atomicInc(unsigned int* address,\n\
    \                               unsigned int val);\n```\n\nreads the 32-bit word\
    \ **old** located at the address **address** in global or shared memory, computes\
    \ ((**old** >= **val**) ? 0 : (**old**+1)), and stores the result back to memory\
    \ at the same address. These three operations are performed in one atomic transaction.\
    \ The function returns **old**.\n\n# B.12.1.7. atomicDec()\n\n```\nunsigned int\
    \ atomicDec(unsigned int* address,\n                               unsigned int\
    \ val);\n```\n\nreads the 32-bit word **old** located at the address **address**\
    \ in global or shared memory, computes (((**old** == 0) || (**old** > **val**))\
    \ ? **val** : (**old**-1) ), and stores the result back to memory at the same\
    \ address. These three operations are performed in one atomic transaction. The\
    \ function returns **old**.\n\n# B.12.1.8. atomicCAS()\n\n```\nint atomicCAS(int*\
    \ address, int compare, int val);\nunsigned int atomicCAS(unsigned int* address,\n\
    \                       unsigned int compare,\n                       unsigned\
    \ int val);\nunsigned long long int atomicCAS(unsigned long long int* address,\n\
    \                                 unsigned long long int compare,\n          \
    \                       unsigned long long int val);\nunsigned short int atomicCAS(unsigned\
    \ short int* address,\n                             unsigned short int compare,\n\
    \                             unsigned short int val);\n```\n\nreads the 16-bit,\
    \ 32-bit or 64-bit word **old** located at the address **address** in global or\
    \ shared memory, computes (**old** == **compare** ? **val** : **old** ), and stores\
    \ the result back to memory at the same address. These three operations are performed\
    \ in one atomic transaction. The function returns **old** (Compare And Swap).\n\
    \n# B.12.2. Bitwise Functions\n\n# B.12.2.1. atomicAnd()\n\n```\nint atomicAnd(int*\
    \ address, int val);\nunsigned int atomicAnd(unsigned int* address,\n        \
    \               unsigned int val);\nunsigned long long int atomicAnd(unsigned\
    \ long long int* address,\n                                 unsigned long long\
    \ int val);\n```\n\nreads the 32-bit or 64-bit word **old** located at the address\
    \ **address** in global or shared memory, computes (**old & val**), and stores\
    \ the result back to memory at the same address. These three operations are performed\
    \ in one atomic transaction. The function returns **old**."
