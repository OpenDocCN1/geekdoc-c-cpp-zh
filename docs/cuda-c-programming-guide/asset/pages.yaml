- pgno: 78
  md: 'A mapped resource can be read from or written to by kernels using the device
    memory address returned by cudaGraphicsResourceGetMappedPointer() for buffers
    and cudaGraphicsSubResourceGetMappedArray() for CUDA arrays.


    Accessing a resource through OpenGL, Direct3D, or another CUDA context while it
    is mapped produces undefined results. OpenGL Interoperability and Direct3D Interoperability
    give specifics for each graphics API and some code samples. SLI Interoperability
    gives specifics for when the system is in SLI mode.


    # 3.2.12.1. OpenGL Interoperability


    The OpenGL resources that may be mapped into the address space of CUDA are OpenGL
    buffer, texture, and renderbuffer objects.


    A buffer object is registered using cudaGraphicsGLRegisterBuffer(). In CUDA, it
    appears as a device pointer and can therefore be read and written by kernels or
    via cudaMemcpy() calls.


    A texture or renderbuffer object is registered using cudaGraphicsGLRegisterImage().
    In CUDA, it appears as a CUDA array. Kernels can read from the array by binding
    it to a texture or surface reference. They can also write to it via the surface
    write functions if the resource has been registered with the cudaGraphicsRegisterFlagsSurfaceLoadStore
    flag. The array can also be read and written via cudaMemcpy2D() calls. cudaGraphicsGLRegisterImage()
    supports all texture formats with 1, 2, or 4 components and an internal type of
    float (e.g., GL_RGBA_FLOAT32), normalized integer (e.g., GL_RGBA8, GL_INTENSITY16),
    and unnormalized integer (e.g., GL_RGBA8UI) (please note that since unnormalized
    integer formats require OpenGL 3.0, they can only be written by shaders, not the
    fixed function pipeline).


    The OpenGL context whose resources are being shared has to be current to the host
    thread making any OpenGL interoperability API calls.


    Please note: When an OpenGL texture is made bindless (say for example by requesting
    an image or texture handle using the glGetTextureHandle*/glGetImageHandle* APIs)
    it cannot be registered with CUDA. The application needs to register the texture
    for interop before requesting an image or texture handle.'
