- pgno: 298
  md: "and 48 KB of L1 cache or as 32 KB of shared memory and 32 KB of L1 cache, using\
    \ cudaFuncSetCacheConfig() / cuFuncSetCacheConfig() :\n\n```\n// Device code\n\
    __global__ void MyKernel()\n{\n    ...\n}\n\n// Host code\n\n// Runtime API\n\
    // cudaFuncCachePreferShared: shared memory is 48 KB\n// cudaFuncCachePreferEqual:\
    \ shared memory is 32 KB\n// cudaFuncCachePreferL1: shared memory is 16 KB\n//\
    \ cudaFuncCachePreferNone: no preference\ncudaFuncSetCacheConfig(MyKernel, cudaFuncCachePreferShared)\n\
    ```\n\nThe default cache configuration is \"prefer none,\" meaning \"no preference.\"\
    \ If a kernel is configured to have no preference, then it will default to the\
    \ preference of the current thread/context, which is set using cudaDeviceSetCacheConfig()\
    \ / cuCtxSetCacheConfig() (see the reference manual for details). If the current\
    \ thread/context also has no preference (which is again the default setting),\
    \ then whichever cache configuration was most recently used for any kernel will\
    \ be the one that is used, unless a different cache configuration is required\
    \ to launch the kernel (e.g., due to shared memory requirements). The initial\
    \ configuration is 48 KB of shared memory and 16 KB of L1 cache.\n\n> Devices\
    \ of compute capability 3.7 add an additional 64 KB of shared memory to each of\
    \ the above configurations, yielding 112 KB, 96 KB, and 80 KB shared memory per\
    \ multiprocessor, respectively. However, the maximum shared memory per thread\
    \ block remains 48 KB.\n\nApplications may query the L2 cache size by checking\
    \ the l2CacheSize device property (see Device Enumeration). The maximum L2 cache\
    \ size is 1.5 MB.\n\nEach multiprocessor has a read-only data cache for 48 KB\
    \ to speed up reads from device memory. It accesses this cache either directly\
    \ (for devices of compute capability 3.5 or 3.7), or via a texture unit that implements\
    \ the various addressing modes and data filtering mentioned in Texture and Surface\
    \ Memory. When accessed via the texture unit, the read-only data cache is also\
    \ referred to as texture cache.\n\n# H.3.2. Global Memory\n\nGlobal memory accesses\
    \ for devices of compute capability 3.x are cached in L2 and for devices of compute\
    \ capability 3.5 or 3.7, may also be cached in the read-only data cache described\
    \ in the previous section; they are normally not cached in L1. Some devices of\
    \ compute capability 3.5 and devices of compute capability 3.7 allow opt-in to\
    \ caching of global memory accesses in L1 via the -Xptxas -dlcm=ca option to nvcc.\n\
    \nA cache line is 128 bytes and maps to a 128 byte aligned segment in device memory.\
    \ Memory accesses that are cached in both L1 and L2 are serviced with 128-byte\
    \ memory transactions whereas memory accesses that are cached in L2 only are serviced\
    \ with 32-byte memory transactions. Caching in L2 only can therefore reduce over-fetch,\
    \ for example, in the case of scattered memory accesses."
