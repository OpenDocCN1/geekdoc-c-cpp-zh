  md: "The following code examples illustrate how the use of managed memory can change\
    \ the way in which host code is written. First, a simple program written without\
    \ the benefit of Unified Memory:\n\n```\n```cpp\n__global__ void AplusB(int *ret,\
    \ int a, int b) {\n    ret[threadIdx.x] = a + b + threadIdx.x;\n}\n\nint main()\
    \ {\n    int *ret;\n    cudaMalloc((ret, 1000 * sizeof(int));\n    AplusB<<< 1,\
    \ 1000 >>>(ret, 10, 100);\n    int *host_ret = (int *)malloc(1000 * sizeof(int));\n\
    \    cudaMemcpy(host_ret, ret, 1000 * sizeof(int), cudaMemcpyDefault);\n    for(int\
    \ i = 0; i < 1000; i++)\n        printf(\"%d: A+B = %d\\n\", i, host_ret[i]);\n\
    \    free(host_ret);\n    cudaFree(ret);\n    return 0;\n}\n```\n```\n\nThis first\
    \ example combines two numbers together on the GPU with a per-thread ID and returns\
    \ the values in an array. Without managed memory, both host- and device-side storage\
    \ for the return values is required (host_ret and ret in the example), as is an\
    \ explicit copy between the two using cudaMemcpy().\n\nCompare this with the Unified\
    \ Memory version of the program, which allows direct access of GPU data from the\
    \ host. Notice the cudaMallocManaged() routine, which returns a pointer valid\
    \ from both host and device code. This allows ret to be used without a separate\
    \ host_ret copy, greatly simplifying and reducing the size of the program.\n\n\
    ```\n```cpp\n__global__ void AplusB(int *ret, int a, int b) {\n    ret[threadIdx.x]\
    \ = a + b + threadIdx.x;\n}\n\nint main() {\n    int *ret;\n    cudaMallocManaged((ret,\
    \ 1000 * sizeof(int));\n    AplusB<<< 1, 1000 >>>(ret, 10, 100);\n    cudaDeviceSynchronize();\n\
    \    for(int i = 0; i < 1000; i++)\n        printf(\"%d: A+B = %d\\n\", i, ret[i]);\n\
    \    cudaFree(ret);\n    return 0;\n}\n```\n```\n\nFinally, language integration\
    \ allows direct reference of a GPU-declared __managed__ variable and simplifies\
