  md: "The following code sample applies some simple transformation kernel to a texture.\n\
    \n```\n```cpp\n// Simple transformation kernel\n__global__ void transformKernel(float*\
    \ output,\n    cudaTextureObject_t texObj,\n    int width, int height,\n    float\
    \ theta)\n{\n    // Calculate normalized texture coordinates\n    unsigned int\
    \ x = blockIdx.x * blockDim.x + threadIdx.x;\n    unsigned int y = blockIdx.y\
    \ * blockDim.y + threadIdx.y;\n\n    float u = x / (float)width;\n    float v\
    \ = y / (float)height;\n\n    // Transform coordinates\n    u -= 0.5f;\n    v\
    \ -= 0.5f;\n    float tu = u * cosf(theta) - v * sinf(theta) + 0.5f;\n    float\
    \ tv = v * cosf(theta) + u * sinf(theta) + 0.5f;\n\n    // Read from texture and\
    \ write to global memory\n    output[y * width + x] = tex2D<float>(texObj, tu,\
    \ tv);\n}\n```\n```"
