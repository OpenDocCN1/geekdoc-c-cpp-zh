  md: '# B.16. Warp Shuffle Functions


    __shfl_sync, __shfl_up_sync, __shfl_down_sync, and __shfl_xor_sync exchange a
    variable between threads within a warp.


    Supported by devices of compute capability 3.x or higher.


    Deprecation Notice: __shfl, __shfl_up, __shfl_down, and __shfl_xor have been deprecated
    in CUDA 9.0 for all devices.


    Removal Notice: When targeting devices with compute capability 7.x or higher,
    __shfl, __shfl_up, __shfl_down, and __shfl_xor are no longer available and their
    sync variants should be used instead.


    # B.16.1. Synopsis


    ```

    T __shfl_sync(unsigned mask, T var, int srcLane, int width=warpSize);

    T __shfl_up_sync(unsigned mask, T var, unsigned int delta, int width=warpSize);

    T __shfl_down_sync(unsigned mask, T var, unsigned int delta, int

    width=warpSize);

    T __shfl_xor_sync(unsigned mask, T var, int laneMask, int width=warpSize);

    ```


    T can be int, unsigned int, long, unsigned long, long long, unsigned long long,
    float or double. With the cuda_fp16.h header included, T can also be __half or
    __half2.


    # B.16.2. Description


    The __shfl_sync() intrinsics permit exchanging of a variable between threads within
    a warp without use of shared memory. The exchange occurs simultaneously for all
    active threads within the warp (and named in mask), moving 4 or 8 bytes of data
    per thread depending on the type.


    Threads within a warp are referred to as lanes, and may have an index between
    0 and warpSize-1 (inclusive). Four source-lane addressing modes are supported:


    +   __shfl_sync()

    +   Direct copy from indexed lane


    +   __shfl_up_sync()

    +   Copy from a lane with lower ID relative to caller


    +   __shfl_down_sync()

