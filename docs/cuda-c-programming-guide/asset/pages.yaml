  md: '# B.18. Profiler Counter Function


    Each multiprocessor has a set of sixteen hardware counters that an application
    can increment with a single instruction by calling the __prof_trigger() function.


    ```

    void __prof_trigger(int counter);

    ```


    increments by one per warp the per-multiprocessor hardware counter of index counter.
    Counters 8 to 15 are reserved and should not be used by applications.


    The value of counters 0, 1, ..., 7 can be obtained via nvprof by nvprof --events
    prof_trigger_0x where x is 0, 1, ..., 7. All counters are reset before each kernel
    launch (note that when collecting counters, kernel launches are synchronous as
    mentioned in Concurrent Execution between Host and Device).


    # B.19. Assertion


    Assertion is only supported by devices of compute capability 2.x and higher. It
    is not supported on MacOS, regardless of the device, and loading a module that
    references the assert function on Mac OS will fail.


    ```

    void assert(int expression);

    ```


    stops the kernel execution if expression is equal to zero. If the program is run
    within a debugger, this triggers a breakpoint and the debugger can be used to
    inspect the current state of the device. Otherwise, each thread for which expression
    is equal to zero prints a message to stderr after synchronization with the host
    via cudaDeviceSynchronize(), cudaStreamSynchronize(), or cudaEventSynchronize().
    The format of this message is as follows:


    ```

    <filename>:<line number>:<function>: block: [blockIdx.x,blockIdx.y,blockIdx.z],
    thread: [threadIdx.x,threadIdx.y,threadIdx.z] Assertion <expression> failed.

    ```


    Any subsequent host-side synchronization calls made for the same device will return
    cudaErrorAssert. No more commands can be sent to this device until cudaDeviceReset()
    is called to reinitialize the device.


    If expression is different from zero, the kernel execution is unaffected.'
