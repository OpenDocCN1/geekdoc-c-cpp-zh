    # D.3.1.1.2. Launch Environment Configuration


    All global device configuration settings (e.g., shared memory and L1 cache size
    as returned by cudaDeviceGetCacheConfig()), and device limits returned from cudaDeviceGetLimit()
    will be inherited from the parent. Likewise, device limits such as stack size
    will remain as-configured.


    For host-launched kernels, per-kernel configurations set from the host will take
    precedence over the global setting. These configurations will be used when the
    kernel is launched from the device as well. It is not possible to reconfigure
    a kernel''s environment from the device.


    # D.3.1.2. Streams


    Both named and unnamed (NULL) streams are available from the device runtime. Named
    streams may be used by any thread within a thread-block, but stream handles may
    not be passed to other blocks or child/parent kernels. In other words, a stream
    should be treated as private to the block in which it is created. Stream handles
    are not guaranteed to be unique between blocks, so using a stream handle within
    a block that did not allocate it will result in undefined behavior.


    Similar to host-side launch, work launched into separate streams may run concurrently,
    but actual concurrency is not guaranteed. Programs that depend upon concurrency
    between child kernels are not supported by the CUDA programming model and will
    have undefined behavior.


    The host-side NULL stream''s cross-stream barrier semantic is not supported on
    the device (see below for details). In order to retain semantic compatibility
    with the host runtime, all device streams must be created using the cudaStreamCreateWithFlags()
    API, passing the cudaStreamNonBlocking flag. The cudaStreamCreate() call is a
    host-runtime- only API and will fail to compile for the device.


    As cudaStreamSynchronize() and cudaStreamQuery() are unsupported by the device
    runtime, cudaDeviceSynchronize() should be used instead when the application needs
    to know that stream-launched child kernels have completed.


    # D.3.1.2.1. The Implicit (NULL) Stream


    Within a host program, the unnamed (NULL) stream has additional barrier synchronization
    semantics with other streams (see Default Stream for details). The device runtime
    offers a single implicit, unnamed stream shared between all threads in a block,
    but as all named streams must be created with the cudaStreamNonBlocking flag,
    work launched into the NULL stream will not insert an implicit dependency on pending
    work in any other streams (including NULL streams of other thread blocks).


