    \   nvstd::function<int()> fn2 = []() { return 10; };\n    *result = fn1() + fn2();\n\
    }\n\nhost__ void host_func(int *result) {\n    nvstd::function<int()> fn1 = foo_h;\n\
    \    nvstd::function<int()> fn2 = foo_hd;\n    nvstd::function<int()> fn3 = []()\
    \ { return 10; };\n    *result = fn1() + fn2() + fn3();\n}\n```\n\nInstances of\
    \ nvstd::function in host code cannot be initialized with the address of a __device__\
    \ function or with a functor whose operator() is a __device__ function. Instances\
    \ of nvstd::function in device code cannot be initialized with the address of\
    \ a __host__ function or with a functor whose operator() is a __host__ function.\n\
    \nnvstd::function instances cannot be passed from host code to device code (and\
    \ vice versa) at run time. nvstd::function cannot be used in the parameter type\
    \ of a __global__ function, if the __global__ function is launched from host code."
