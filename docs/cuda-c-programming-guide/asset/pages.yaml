  md: '# Table 2 Cubemap Fetch


    | | face | m | s | t |

    |---|---|---|---|---|

    | |x| > \|y\| and \|x\| > \|z\| | x >= 0 | 0 | x | -z | -y |

    | | x < 0 | 1 | -x | z | -y |

    | |y| > \|x\| and \|y\| > \|z\| | y >= 0 | 2 | y | x | z |

    | | y < 0 | 3 | -y | x | -z |

    | |z| > \|x\| and \|z\| > \|y\| | z >= 0 | 4 | z | x | -y |

    | | z < 0 | 5 | -z | -x | -y |


    A layered texture can only be a CUDA array by calling cudaMalloc3DArray() with
    the cudaArrayCubemap flag.


    Cubemap textures are fetched using the device function described in texCubemap()
    and texCubemap().


    Cubemap textures are only supported on devices of compute capability 2.0 and higher.


    # 3.2.11.1.6. Cubemap Layered Textures


    A cubemap layered texture is a layered texture whose layers are cubemaps of same
    dimension.


    A cubemap layered texture is addressed using an integer index and three floating-point
    texture coordinates; the index denotes a cubemap within the sequence and the coordinates
    address a texel within that cubemap.


    A layered texture can only be a CUDA array by calling cudaMalloc3DArray() with
    the cudaArrayLayered and cudaArrayCubemap flags.


    Cubemap layered textures are fetched using the device function described in texCubemapLayered()
    and texCubemapLayered(). Texture filtering (see Texture Fetching) is done only
    within a layer, not across layers.


    Cubemap layered textures are only supported on devices of compute capability 2.0
    and higher.


    # 3.2.11.1.7. Texture Gather


    Texture gather is a special texture fetch that is available for two-dimensional
    textures only. It is performed by the tex2DGather() function, which has the same
    parameters as tex2D(), plus an additional comp parameter equal to 0, 1, 2, or
    3 (see tex2DGather() and tex2DGather()). It returns four 32-bit numbers that correspond
    to the value of the component comp of each of the four texels that would have
    been used for bilinear filtering during a regular texture fetch. For example,
    if these texels are of values (253, 20, 31, 255), (250, 25, 29, 254), (249, 16,
    37, 253), (251, 22, 30, 250), and comp is 2, tex2DGather() returns (31, 29, 37,
    30).


    Note that texture coordinates are computed with only 8 bits of fractional precision.
    tex2DGather() may therefore return unexpected results for cases where tex2D()
    would use 1.0 for one of its weights (α or β, see Linear Filtering). For example,
    with an'
