  md: '# F.5. Extended Lambdas


    The nvcc flag ''--extended-lambda'' allows explicit execution space annotations
    in a lambda expression 21 . The execution space annotations should be present
    after the ''lambda-introducer'' and before the optional ''lambda-declarator''.
    nvcc will define the macro __CUDACC_EXTENDED_LAMBDA__ when the ''--extended-lambda''
    flag has been specified.


    An ''__extended__device__'' lambda is a lambda expression that is annotated explicitly
    with ''__device__'', and is defined within the immediate or nested block scope
    of a __host__ or __host____device__ function.


    An ''__extended__host__'' device__'' lambda is a lambda expression that is annotated
    explicitly with both ''__host__'' and ''__device__'', and is defined within the
    immediate or nested block scope of a __host__ or __host____device__ function.


    An ''__extended__lambda'' denotes either an extended __device__ lambda or an extended
    __host__ device__ lambda. Extended lambdas can be used in the type arguments of
    __global__ function template instantiation.


    If the execution space annotations are not explicitly specified, they are computed
    based on the scopes enclosing the closure class associated with the lambda, as
    described in the section on C++11 support. The execution space annotations are
    applied to all methods of the closure class associated with the lambda.


    21 When using the icc host compiler, this flag is only supported for icc >= 1800.'
