    # # A Case for Polar Coordinates


    *January 2007, updated February 2013*


    In a typical CNC program, the absolute coordinates XY indicate a point location
    measured from a common point known as part zero or program zero. This is the basis
    of the rectangular coordinate system, where the X point location is measured along
    the X-axis, and the Y point location is measured along the Y-axis (in G17 plane).
    Although this system is quite suitable for most CNC programs, there are times
    when it can become tedious and unproductive, because trigonometric calculations
    take time. Any programmer who ever used rectangular coordinates to calculate bolt
    holes location will agree. Bolt hole patterns or any arrangement of holes along
    an arc benefit from another type of point definition, the polar coordinate method.


    Using polar coordinates on non-Fanuc controls is very common, for the simple reason
    that they are always available. Unfortunately, Fanuc controls offer this feature
    as an option only, and even that is not available on many old controls. Granted,
    if the feature can be added to the control, it is not very expensive, but can
    be a hassle anyway.


    # ## Defining Polar Coordinates


    For the purposes of CNC programming, polar coordinates can be described as the
    endpoint of a line (often called a radius) that starts from another point (often
    called a pole) with a given length and angle. A polar angle is measured counter-clockwise
    from zero degrees (East direction or 3 o’clock position) as positive. Active plane
    selection does influence the use of polar coordinates, but the standard XY plane
    (G17) is the most common.


    The major benefit of polar coordinates in CNC programming is that they virtually
    eliminate all calculations associated with the rectangular coordinate method.'
  merge: -1
  img_proc: true
