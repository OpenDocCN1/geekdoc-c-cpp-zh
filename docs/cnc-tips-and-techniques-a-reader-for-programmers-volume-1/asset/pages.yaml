  merge: -1
  img_proc: true
- pgno: 52
  md: 'systems offer a file transfer option. For a more complex dedicated DNC transfer,
    separate software is usually a better choice. Display is also very important —
    looking extensively at a computer screen can be tiring at best and may cause physical
    problems over time. Large viewing size and high resolution monitors are critical
    for comfortable work. Many graphics cards are made for gaming and may not be suitable
    for serious CAM work. Other features such as hard drive size are no longer a problem,
    as long as they are reliable and well maintained.


    # PROGRAMMING ENVIRONMENT


    A typical working environment within CAM software can be easily summed up in three
    steps:


    +   1. Toolpath Geometry

    +   2. Toolpath Application

    +   3. Program Generation


    Depending on the software, many intermediate (or additional) steps may be available,
    but the three basic steps will always apply.


    # *Toolpath Geometry*


    Toolpath geometry is a visual representation of the toolpath itself. It is always
    generated graphically, using points, lines, arcs, and other entities. True toolpath
    geometry is called an *associated geometry* — that means a change in either the
    toolpath or the operation will change all related data automatically.


    Even the lowest priced (i.e. featured) CAM software offers the most common 2D
    toolpaths — drilling operations, contouring, and pocketing. More sophisticated
    software will also include special toolpaths and operations, such as helical interpolation,
    splines as part of the geometry, special cycles, subprograms, 3D machining, surfaces,
    and solids. When selecting CAM software, think also of future needs, such as the
    type of future work, as well as machine and control features.'
  merge: -1
  img_proc: true
