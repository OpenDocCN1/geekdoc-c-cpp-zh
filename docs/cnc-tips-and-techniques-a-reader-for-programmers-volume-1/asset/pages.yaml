- pgno: 102
  md: 'motion (G02 to G03 and vice versa).


    Considered separately, neither change causes any machining problems. That is not
    true about the third change. Changing direction of an axis also changes the cutter
    radius offset from G41 to G42, which means from climb milling to conventional
    milling, when right-hand tools are used. This last fact is the one to consider
    seriously before using mirror images.


    For example, in a standard layout of X and Y axes, Quadrant I is the upper right
    part of the grid, Quadrant II is at the upper left, lower left is Quadrant III
    and lower right is Quadrant IV. If the original toolpath is developed in Quadrant
    I with G41 (climb milling) in effect, the climb milling mode will be maintained
    in Quadrant III, but will be changed to G42 (conventional milling) in Quadrants
    II and IV. Depending on the job requirements, this may present tool life and part
    quality problems.


    # Types of Mirror Images


    The main benefit of mirror image is in time saved during program development.
    From a technical viewpoint, there are two types of mirror image available:


    +   - By *setting* — the mirror image is set at the machine control

    +   - By *program* — the mirror image is programmed with miscellaneous functions


    In both cases, the program has to be written in such a way that allows the use
    of mirror images. Keep in mind that once the function is activated, all XY motions
    will be mirrored, including all rapid motions (the Z-axis is not mirrored). The
    only exception is machine zero return, which is not affected by any mirror setting.
    It is important to start and end a toolpath at the same point, in order to make
    mirroring successful. Program features not related to axis motion are not affected,
    for example, spindle rotation.'
  merge: -1
  img_proc: true
- pgno: 103
  md: '# By Setting


    Setting at the machine is usually done through the SETTING screen, and has options
    for each axis (X and Y) to be 0:OFF or 1:ON. The CNC operator sets the required
    mode before repeating the part program in different quadrants.


    # By Program


    A programmable mirror image is far more common, as it provides better control
    of the program flow. Typically, the machine tool manufacturer provides three (sometimes
    only two) miscellaneous functions (M-functions) to cover all setting possibilities
    (check your manual). For example, a particular machine uses M21 to activate the
    X-axis mirror, M22 to activate the Y-axis mirror, and M23 to cancel the mirror
    image in either axis. Programmable mirror images are commonly used with a subprogram,
    and turned ON or OFF before the subprogram is called. Here is a small example
    of a 45-degree motion between two points. The slot is programmed in Quadrant I
    and mirrored to Quadrant II, Quadrant III and Quadrant IV. The common start/end
    point to all four quadrants in this case is X0Y0:


    ```

    ```

    O8001 (SLOT SUBPROGRAM)

    N101 G00 X70.0 Y50.0

    N102 G01 Z-5.0 F125.0

    N103 X170.0 Y150.0

    N104 G00 Z2.0

    N105 X0 Y0

    N106 M99

    %

    ```

    ```


    ```

    ```

    O1001 (MAIN PROGRAM)

    N1 G21

    N2 G17 G40 G80

    N3 M23        (MIRROR MODE OFF)

    N4 G90 G54 G00 X0 Y0 S1200 M03

    N5 G43 Z2.0 H01 M08

    ```

    ```'
  merge: -1
  img_proc: true
