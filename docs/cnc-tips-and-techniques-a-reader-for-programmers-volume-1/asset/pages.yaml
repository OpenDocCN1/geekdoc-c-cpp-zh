    # ## Defining the Plane


    Only in these three cases do the CNC programmers have to watch for the currently
    active plane. A plane is always defined by two primary axes. Circular motion is
    the most suitable for understanding the concept; the principles apply to cutter
    radius offset and fixed cycles equally. Planes in CNC applications follow the
    standard mathematical definitions. The easiest way to understand mathematical
    definitions is to write the letters XYZ twice in succession then split the six
    letters into three pairs:


    XYZXYZ   ...   XY ZX YZ, which define


    G17 as XY plane, G18 as ZX plane, and G19 as YZ plane


    To illustrate the concept of planes, consider the following program segment for
    a simple 180-degree arc:


    ```

    ```

    G01 X20.0 Y35.0 F200.0

    G02 X56.0 R18.0 (ONLY ONE AXIS SPECIFIED)

    G01 X75.0

    ```

    ```


    There is only a single axis specified with the 18 mm radius. How does the control
    interpret this block? An arc always requires two axes. Is the missing axis Y or
    is it Z? The plane selection in the program command provides the answer. If G17
    is active, the missing axis is Y; if G18 is active, the missing axis is Z. G19
    is not applicable because it does not involve the X-axis.'
