- pgno: 49
  md: '# CNC Tips and Techniques


    does finally start production, there is always the necessity of changing parts,
    replacing dull inserts, modifying offset values, etc. Adding more idle time because
    the programmer has to prepare the program can be very costly; over a period of
    time it can cost more than having two skilled workers taking on individual responsibilities.


    Thus far, this overview has applied to a single CNC machine. What if there are
    two, three, or even more machines in the shop?


    Three other disadvantages of the combined position should also be considered very
    seriously. The first is quite simple. If the programmer stays home sick, so does
    the operator (and vice versa). The second disadvantage is related. What if the
    programmer/operator quits? Of course a suitable backup is an ideal solution, but
    the reality is that there will be a gap in the production somewhere; even if the
    gap is temporary, it still represents time lost. The third disadvantage relates
    more to certain traits in human nature and does not apply to everybody. Some programmers
    who also run the machine may have the tendency to cover up their mistakes, spending
    additional time to make fixes at the machine, even a new program, without anybody''s
    knowledge. Some programmers/operators may feel self-satisfied or even complacent;
    they stop learning new methods and techniques. Others may have exaggerated demands
    in terms of wages, benefits, time off, and so on.


    One item that needs consideration is the method by which the part program is generated.
    It is still common in many shops to write the program manually rather than using
    a CAD/CAM programming system. Although it is important for the programmer to understand
    manual programming, it is equally important for the shop manager to understand
    the benefits of a CAD/CAM (also known as CAM) programming system. For the combined
    position of one person programming and operating, a CAM system installed in the
    vicinity of the CNC machine may bring many benefits, in spite of its initial cost.'
