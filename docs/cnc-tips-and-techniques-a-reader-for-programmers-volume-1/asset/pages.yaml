  md: 'that threading is an operation that uses the weakest tool with the heaviest
    feedrates applied. Having problems in threading is almost to be expected, because
    they are rather hard to predict.


    # The G32 Command


    It is always desirable that any problem encountered in production is resolved
    as soon as possible. On the machine side, if threading does not work as it should,
    the CNC operator’s options are somewhat limited. The method of programming makes
    a big difference. This view is certainly true with the so-called *long-hand* threading
    method, where each threading motion is written as a separate program block. A
    typical example of this method is the threading method that uses the G32 command
    (or G33 on some machines). In this case, the operator cannot do anything significant
    during machining to improve the threading passes because all motions are fully
    embedded in the part program. In order to improve the thread quality, the design
    of the program itself has to be changed, virtually from the ground up. This process
    is time consuming and does not guarantee a better thread.


    Although the G32 method of thread programming can be used in special situations
    where the programmer needs absolute control over the threading process, the vast
    majority of threading on CNC lathes today is done by using a very powerful *multiple
    repetitive cycle*, using a threading specific cycle G76. Comparing this cycle
    with another popular cycle, G71/G72 for turning and boring, G76 has many more
    parametric settings that can be adjusted at the machine, during production, if
    necessary. This flexibility is what makes the cycle not only popular, but also
    very effective for lead time.


    # The G76 Cycle


    The first thing you should understand is that there are *two* formats of the G76
    cycle. The original one is a single block program entry; it applies to older controls
    such as Fanuc 10 and 11,'
