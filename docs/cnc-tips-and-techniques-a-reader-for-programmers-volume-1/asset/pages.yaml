    # Feedrate Adjustment on Arcs


    *August 2009, updated February 2013*


    In general, for CNC work, the cutting feedrate is determined by the CNC programmers
    and is based on established machining practices. This decision typically includes
    the part material and its machinability, tool type and diameter, and depth and
    width of cut, as well as overall setup rigidity and other factors. More often
    than not, the other factors do not include special attention to feedrates along
    arcs. For the majority of jobs, the cutting feedrate for circular interpolation
    is identical to the feedrate for linear interpolation and causes no problems.


    When a cutter makes a linear toolpath, the cutter center is offset by the cutter
    radius. The linear path generated by the cutter center is either longer or shorter
    than the actual part edge and is always parallel to it. In this case, there is
    no need to consider feedrate adjustment at all. When the same cutter makes a motion
    along an arc, the circular path of the cutter center is also parallel to the part
    edge, in the form of a concentric arc. In most cases, the surface finish quality
    of the linear path and the circular path are the same and nothing needs to be
    done.


    A decrease in surface finish quality may occur in some cases, where the cutter
    radius is large in relation to a small arc of the part. A solution to this problem
    may be as simple as adjusting the cutting feedrate either up or down from the
    calculated normal feedrate. An adjusted arc feedrate is not required in every
    program. If the cutter center toolpath is close to the part drawing contour, no
    adjustment is needed. On the other hand, when a large diameter cutter is used
    to contour a small outside radius, a problem that affects the surface finish may
    occur. In this case, the tool center path generates a much longer arc than the'
  merge: -1
  img_proc: true
- pgno: 223
  md: 'one in the drawing. In a similar situation, if a large cutter diameter is used
    for an inside arc, the equidistant path will be much shorter than the original
    arc.


    +   - An outside arc of a toolpath is longer than the arc in the drawing.

    +   - An inside arc of a toolpath is shorter than the arc in the drawing.


    # The Fundamental Rule of Feedrate Adjustments for Arcs


    Based on these two definitions, the fundamental rule of feedrate adjustment for
    arcs is that the programmed linear feedrate is increased for outside arcs and
    decreased for inside arcs.


    Suppose a cutting feedrate of 18.0 inches per minute (F18.0) gives excellent results
    for linear motions, but noticeably poorer results on small arcs. The cutter diameter
    used is 1.5 inch, the small outside arc in question has a radius of 0.4 inches.
    In this case, the cutting feedrate for the outside arc has to be increased, using
    the following formula:


    FO = F * (R + r) / R


    where FO is the adjusted feedrate for outside arcs, F is the linear feedrate,
    R is the drawing arc radius, and r is the cutter radius. Using the formula above,
    the change in feedrate from F18.0 will result in a heavier feedrate of F27.6 (ipm)
    along the outside arc.


    A similar example for an inside arc will require reduction of the linear feedrate.
    Suppose linear feedrate is 15 inches per minute (F15.0), the inside arc has a
    radius of 0.75 inches, and the cutter diameter is 0.5 inches. In this case, the
    cutting feedrate for the inside arc has to be decreased, using the following formula:


    FI = F * (R - r) / R


    where FI is the adjusted feedrate for inside arcs, F is the linear feedrate, R
    is the drawing arc radius, and r is the cutter radius.'
  merge: -1
  img_proc: true
- pgno: 224
  md: 'Using the above formula, the change in feedrate from F15.0 will result in a
    much lighter feedrate of F10.0 (ipm) along the inside arc.


    The two formulas provide the means to find the adjusted feedrate along an arc,
    which is mathematically equivalent to the linear feedrate. Both formulas are recommended
    for external or internal contouring only, not for rough machining in solid material.


    In lathe programming, there is no reason to distinguish between feedrates for
    linear and circular tool motions, regardless of the radius size. Tool nose radius
    is usually small, averaging 0.0313 inches (or 0.8 mm) and the equidistant toolpath
    is very close to the programmed toolpath.


    Keep in mind that the formulas provided here (like many other formulas) should
    serve as guidelines only and should be used as such. Common sense combined with
    practical experience should always prevail.


    ![](img/0023bd5cc50494e6d7799ab76d437c8d_224_0.png)


    # Knurling on CNC Lathes


    *September 2009, updated February 2013*


    As an operation, knurling is as old as manual lathe machining. Its main purpose
    is to make formed indentations in the material that suit various purposes. When
    it comes to programming a knurling operation on CNC lathes there are four basic
    motions:


    +   - Rapid to a start position

    +   - Feed in for the length of knurl

    +   - Retract from part diameter

    +   - Return to the start point or a tool change position


    This essay looks at several issues important for successful knurling on CNC lathes.'
  merge: -1
  img_proc: true
- pgno: 225
  md: '# CNC Tips and Techniques


    # Knurling Patterns


    The knurled indentations in the material surface are caused by a rolling action
    of the knurling tool while it is moving along the horizontal machine axis. Depending
    on the knurling tool, these indentations can have either a straight, angular,
    or diamond (cross) pattern. An angular pattern can be left hand or right hand
    with different angles. Knurling is generally not a metal cutting action, but a
    metal forming action caused by force—not all lathes are suited for knurling.


    Knurling tools especially developed for CNC lathe machining are the tools recommended.
    Some designs are suitable for knurling to a square shoulder with minimum clearance.
    Pay special attention to the knurling wheel itself and to its diameter and pitch.
    A typical drawing will specify the type of knurl used on the machined surface
    as one of three patterns:


    +   - Straight knurl — parallel to work

    +   - Angular knurl — typically at 30° or 45°

    +   - Diamond knurl — also 30° or 45° (known as diagonal, cross, or checkered
    pattern)


    Each of these types has a specific purpose in practice. The straight knurl is
    used mainly for joining two cylindrical objects, for example, a pin and a hole.
    The diagonal type is to facilitate easier handling, such as better hand grip on
    rotary knobs or handles.


    Knurling tools have one or two wheels. Using one left hand and one right hand
    wheel in the same holder and opposite to each other, a diamond pattern can be
    cut. Knurling tools designed for CNC lathes have floating (self-centering) positioning
    built-in, to provide an accurate alignment with the part. A common designation
    of the pitch size is TPI (teeth per inch). The pitch of a knurl is also important
    in feedrate selection. There are three groups of knurl pitch: coarse, medium,
    and fine.


    Knurling is a final or finishing machining operation, usually on an external part
    diameter, although internal knurling is'
  merge: -1
  img_proc: true
- pgno: 226
  md: 'also possible. That means all other machining operations have to be completed
    beforehand. Because knurling is a lathe type of machining, the part has to be
    turned to the specified diameter before the knurling operation can be applied.


    # Knurling Tool Motions


    Tools for knurling have to be selected carefully, as they can only be used within
    a certain range of work diameters. CNC programmers are responsible for programming
    the tool motions, selecting the spindle speed and the cutting feedrate. For small
    threads, an additional support may be required, such as a tailstock.


    The first of the four motions is to the start point; this point should be above
    the knurl, and about 0.100″ (2.5 mm) into the part (Z-0.1 or Z-2.5 if the front
    face is Z0). The second motion is a feedrate motion, and the knurl will move to
    the cutting depth. Once the tool has reached the cutting diameter, it continues
    in the feedrate mode towards the end of the knurl — this is the third motion.
    Once the operation is completed, the tool leaves the part at rapid rate along
    the X-axis — this is the fourth motion. Having a generous supply of coolant, and
    teeth free of any slivers or burrs of metal are both critical. If the knurling
    length is smaller than the knurling wheel width, the tool can just plunge in and
    leave the diameter immediately. CNC operators can use various offset settings
    to fine tune the knurled depth. The knurling depth can also be calculated based
    on the circular pitch in terms of teeth per inch (TPI) but this is a bit more
    involved subject for a short essay.


    It is not unusual to do some experimentation at the machine. Spindle speed is
    normally calculated for the material being machined. The plunging feedrate should
    be fairly aggressive, and when knurling is completed, the tool should be retracted
    right away. A very small angular tilt of the knurling tool often helps to relieve
    back pressure.'
  merge: -1
  img_proc: true
- pgno: 227
  md: '# Imperfections


    If the knurl is not perfect, the chances are that either it is too deep or too
    shallow. A knurl too deep produces burrs and nicks on the part surface. A knurl
    too shallow produces noticeable flats on the part surface. A short summary may
    provide some clues as to the likely causes:


    +   - Slivers, burrs and nicks — Probable excessive cutting depth

    +   - Lower than expected tool life — Lubrication problems, hard material cutting

    +   - Insufficient depth — Wrong knurl or program data


    Knurling can be an easy operation or a tough one. If you have never knurled, run
    a few tests first to prevent scrapping the part that matters.


    ![](img/0023bd5cc50494e6d7799ab76d437c8d_227_0.png)


    # **Programming a Full Circle**


    *October 2009, updated February 2013*


    When you program arcs, it is not unusual to see part programs using the R-radius
    instead of the traditional I and J vectors. For example, **G02 X.. Y.. R..** has
    largely replaced **G02 X.. Y.. I.. J..**


    There is no doubt that the radius designation simplifies programming because no
    calculations for the radius are necessary. I/J vectors, on the other hand, have
    to be calculated as individual distances from the arc start point to the arc center,
    measured along each axis. What many programmers may not realize is that the direct
    R-radius has some limitations. Up to and including 180° arc sweep angle, the radius
    is programmed as a positive value. A radius that has a sweep angle of more than
    180° but less than 360° is programmed with the radius having a negative value.
    That leaves an arc with a sweep angle of 360° degrees: a full circle.


    Programming a full circle means programming a toolpath'
  merge: -1
  img_proc: true
- pgno: 228
  md: 'that will machine a 360° arc. There are various methods of achieving this objective:


    +   - Using the *quadrant* method (four blocks required)

    +   - Using the *semicircle* method (two blocks required)

    +   - Using the *one block* method (one block required)


    In the standard XY plane G17, both I/J vectors and direct radius R can be used
    for the quadrant and semi-circle methods, but only I/J vectors can be used for
    the one-block method. Many CNC programmers use I/J vectors exclusively for their
    compatibility with many control systems. The start point for the circular motion
    is usually a quadrant point, and 0° (three o’clock) is commonly used. Another
    common position is at 12 o’clock (90°). A CW or CCW cutting direction is selected
    by the type of milling. Climb milling is often the preferred method for CNC machining.


    For the following examples, X0Y0 is at the circle center; the cutting motion will
    start at 0° as P1, in CW direction (G02), with the radius of 20 mm. Only basic
    concepts are shown.


    # Quadrant Method


    The method of dividing a circle into four quadrants is the original way of programming.
    Practically, it offers no advantage in modern programming and is included for
    comparison with the other two methods. Using this method, a full circle is programmed
    in four blocks — one block for each quadrant (90° arc sweep). A block for each
    arc must never cross the axis at 0°, 90°, 180°, or 270°. Either the I/J vector
    or the R method can be used.


    ```

    N10 G90 G00 X20.0 Y0 (P1) (== USING I AND J VECTORS ==)

    ...

    G02 X0 Y-20.0 I-20.0 J0 (P2)

    X-20.0 Y0 I0 J20.0 (P3)

    X0 Y20.0 I20.0 J0 (P4)

    X20.0 Y0 I0 J-20.0 (P1)

    G00 ...

    ```'
  merge: -1
  img_proc: true
- pgno: 229
  md: '```

    ```text

    N20 G90 G00 X20.0 Y0 (P1) (== USING DIRECT RADIUS R ==)

    ...

    G02 X0 Y-20.0 R20.0 (P2)

    X-20.0 Y0 R20.0 (P3)

    X0 Y20.0 R20.0 (P4)

    X20.0 Y0 R20.0 (P1)

    G00 ...

    ```

    ```


    # Semicircle Method


    A semicircle is one half of a circle or 180° arc sweep. For a full circle programming
    using this particular method, two half arcs are necessary.


    ```

    ```text

    N30 G90 G00 X20.0 Y0 (P1) (== USING I AND J VECTORS ==)

    ...

    G02 X-20.0 Y0 I-20.0 J0 (P2)

    X20.0 Y0 I20.0 J0 (P1)

    G00 ...

    ```

    ```


    ```

    ```text

    N40 G90 G00 X20.0 Y0 (P1) (== USING DIRECT RADIUS R ==)

    ...

    G02 X-20.0 Y0 R20.0      (P2)

    X20.0 Y0 R20.0 (P1)

    G00 ...

    ```

    ```


    What is interesting about the semicircle method is that it is often used as the
    default for CAM-generated part programs. The main reason is that in order to output
    R-radius, the four-block method is not necessary and the one-block method cannot
    use R-radius at all. Of course, the output can be changed by the user through
    post-processor customization.'
  merge: -1
  img_proc: true
- pgno: 230
  md: '# One-Block Method


    The one-block method is the shortest method of programming a full circle. In order
    to program a 360° arc sweep, the direct radius R method cannot be used.


    ```

    N50 G90 G00 X20.0 Y0 (P1) (== USING I AND J VECTORS ==)

    ...

    G02 I-20.0 J0 (P1)

    G00 ...


    N60 G90 G00 X20.0 Y0 (P1) (== USING DIRECT RADIUS R ==)

    ...

    (=== RADIUS R CANNOT BE USED ===)

    ...

    G00 ...

    ```


    Ignoring the quadrant method, which of the remaining two should you use? If you
    insist on using the R-radius, you have to use the semi-circle method, but the
    surface finish may have small marks in two places. The one-block method should
    produce a better surface finish, as there is only one-place contact. My personal
    preference is to use I/J vectors for their compatibility with virtually all controls.


    ![](img/0023bd5cc50494e6d7799ab76d437c8d_230_0.png)


    # Peck Drilling — Watch the Q


    *November 2009, updated February 2013*


    As the name of the title operation suggests, peck drilling is a method of drilling
    with interruptions. Rather than one single drilling motion, peck drilling describes
    a drilling operation where the drill does not reach the programmed Z-depth in
    one cut, but in a series of cuts. This method is very useful for deep holes, so
    the coolant can reach the drill point with ease, cooling'
  merge: -1
  img_proc: true
- pgno: 231
  md: 'the cutting edges while also allowing the chips to be flushed out, at least
    as much as possible.


    Virtually all CNC machining centers support two programming commands (fixed cycles)
    for peck drilling:


    +   - G83 = Deep hole drilling

    +   - G73 = High speed deep hole drilling


    Take these descriptions as guidance only — a hole drilled in a tough material
    can be shallow and still benefit from this method of machining. High-speed peck
    drilling is a bit of an exaggeration, and some manuals actually call this G73
    cycle *chip breaking cycle*, which is more descriptive. The *high speed* refers
    to the retract motion of G73 when compared to G83.


    # **Programming Format**


    Both G83 and G73 are common fixed cycles. Except the cycle number, their format
    is identical:


    +   - G98/G99 G83 X.. Y.. R.. Z.. Q.. F..

    +   - G98/G99 G73 X.. Y.. R.. Z.. Q.. F..


    In both cases, the amount of Q is the *depth of each peck*. The difference between
    the two cycles is in the actual cutting, particularly in the retract motion after
    each peck:


    *In the G83 cycle, the tool will retract to the R-level after each peck. In the
    G73 cycle, the tool will retract only by a certain minimum (~0.5 mm or 0.02\")
    after each peck.*


    In both cases, the retract motion from the final depth will be either to the initial
    level (in G98 mode) or to the R-level (in G99 mode).


    # **Application Notes**


    The G83 cycle can be used for peck drilling of most holes, whereas the G73 cycle
    is better suited for holes that need chip'
  merge: -1
  img_proc: true
- pgno: 232
  md: 'breaking, regardless of their depth. CNC operators often find that the Q-depth
    programmed is either too small or too large. Although the actual change of Q-depth
    at the machine is a simple edit, some knowledge about how the cycle works is helpful.
    Peck drilling always start from the R-level (R-address = feed plane) and ends
    at the specified Z-depth (Z-address). This observation is an important one for
    those times when the desired number of pecks is to be programmed and the Q-depth
    has to be calculated.


    Note that the Q-depth will be equal for each peck, with the possible exception
    of the last peck, because the tool (drill) will never exceed the programmed drilling
    depth (Z-depth). For example:


    ```

    G99 G83 X300.0 Y250.0 R2.0 Z-26.5 Q8.0 F250.0

    ```


    +   Number of pecks =

    +   Total travel between R and Z / Q (always rounded up)

    +   Total travel = (2 + 26.5) / 8 = 28.5 / 8 = 3.5625

    +   Number of pecks = 4 pecks


    Most controls do not allow programming the actual number of pecks desired. In
    such cases, when you know that so many pecks will do the job efficiently, you
    still have to calculate the Q-depth. Here is a very interesting example I will
    use to illustrate the point. A drawing is not necessary, the numbers speak for
    themselves. The objective is to calculate the Q-depth as the *minimum* depth that
    guarantees *three pecks* with a 4.75-mm diameter drill. Here is the G83 cycle;
    calculate the Q-depth:


    ```

    G99 G83 X175.0 Y200.0 R3.0 Z-24.925 Q.. F200.0

    ```


    Normally, part of the calculation would also include the Z-depth, including the
    drill point length, but our concern is the Q-depth only.'
  merge: -1
  img_proc: true
- pgno: 233
  md: '# # CNC Tips and Techniques


    Because the Z-axis start position is at Z3.0 (programmed as R3.0 in the fixed
    cycle), the total travel length of the tool will be 27.925. The number of required
    pecks is three, *always* calculated over the total distance to travel, in our
    case, 27.925 mm.


    The result of 27.925/3 is 9.308333 as the minimum Q-depth amount. Because rounding
    to three decimal places is required for metric units, the Q-depth must be rounded
    up and must be programmed as **Q9.309** (or higher) in the fixed cycle. Because
    the requirement is for the *minimum* Q-depth, Q9.309 must be used in the cycle.
    Take care in rounding! Correct mathematical rounding of 9.308333 to three decimal
    places is 9.308, but that does not meet the requirement of always rounding *upwards*
    for peck drilling. The minimum correct Q-amount will be Q9.309 and used in the
    cycle.


    If you did use the minimum Q-depth as Q9.308, you would get 9.308 x 3 pecks =
    27.924 depth, one micron (!) short — that is, 0.00003937 inches. I have intentionally
    used a metric example, taking advantage of a micron as the smallest unit a CNC
    machining center can accept. The result will be three pecks of 9.308 and the fourth
    peck of exactly one micron! By changing the Q-depth to 9.309, there will be two
    pecks of 9.309 and one peck of 9.307. So, the final answer is that the minimum
    Q-depth is 9.309 mm. As you see, even one micron does make a difference in CNC
    work.'
  merge: -1
  img_proc: true
