- pgno: 32
  md: '# A Reader for Programmers


    Consider the realities. Your customer faxes you a drawing, asking for a quote.
    Your quote wins and you get the work. Often that faxed drawing is the only drawing
    you have from which to make the part. In a better scenario, the customer sends
    you a clean paper drawing. Or better yet, the customer sends you the drawing in
    the form of a disk file. Now, that is the best scenario, but — yes there are “buts”
    here.


    As most work in the job shops is two dimensional (2D), the design is often done
    in CAD software such as Autocad by the customer. Shops that have CAM capabilities
    use a tool path development software such as Mastercam, EdgeCam, or GibbsCam.
    The question is how to get the drawing file into the CAM software. The ideal method
    is that the software reads the file in its native format. For example, the popular
    Mastercam can read and write Autocad DWG files directly, without a translator.
    If the software cannot read the native format of the original, it has to have
    a reliable translator.


    Virtually all systems support DXF (drawing exchange file) and/or IGES (Initial
    Graphics Exchange Specification). DXF is quite simple and suitable only for two
    dimensional drawings that are composed of lines, arcs, circles, and points. IGES
    is more powerful and used for translation of complex three-dimensional drawings.


    So what is the best approach for a small shop to take?


    # Consult with Your Customer


    Consulting with your customer is probably the most important step. Your customer
    likes to know about your capabilities. In turn, you should know what the customer
    can offer to your shop, particularly when it comes to a drawing supplied on a
    disk or by email. Ask for a file format that your CAM software supports, preferably
    in the native format.


    # Understand CAD/CAM Translators


    If the translator has to be used, make sure you understand'
  merge: -1
  img_proc: true
- pgno: 33
  md: 'its capabilities and its limitations. Poor translators may not convert the
    original geometry, especially when it contains complex geometry such as splines.


    # Train your CNC Programmer


    Good CNC or CAD/CAM programmers can detect drawing flaws and mistakes, and often
    solve any problems quickly. They will also be able to eliminate geometry that
    is part of the drawing but not necessary to create the tool path. This skill might
    be one of the programmer’s most important skills.


    # Educate Your Customer


    Do not be afraid to tell the customers what you expect from them. They will understand
    that your requests are made in the spirit of producing their part within specifications
    as well as efficiently.


    Yes, it seems that for many reasons true CAD/CAM convergence is not a part of
    small job shops. At the same time, there is nothing wrong with CAD and CAM working
    together well in this unique environment.


    ![](img/0023bd5cc50494e6d7799ab76d437c8d_33_0.png)


    # Part Program Upgrading and Updating


    *June 2004, updated February 2013*


    Regardless of the methods used, developing a CNC part program does take time.
    Whether written manually or generated with the aid of a CAD/CAM system, a part
    program should not be considered as completed until it is used to run a few parts
    and optimized. Even the best part programmers cannot always predict every condition
    during actual machining. It is not unusual — in fact, it is very common — to see
    CNC operators make changes to the program at the control. If the program is perfect,
    no changes would be necessary, a situation that rarely happens.'
  merge: -1
  img_proc: true
- pgno: 34
  md: 'Optimizing a part program means improving it, mainly for more efficient performance,
    but also for other reasons, such as change in setup, use of a different tool,
    or even improved safety. Optimizing a program can take place at the control (usually
    by the CNC operator) or away from the control (usually by the CNC programmer).
    Two terms are often associated with a program change — *program upgrading and
    program updating*.


    # ## Program Upgrading


    *Program upgrading* means strengthening the program, enriching it, and making
    it more cost effective without compromising quality of the part or safety of machining.
    When running several thousand parts in a batch or a job that repeats from time
    to time, upgrading part programs will have a profound effect on the overall cost
    of doing business. Shortening the cycle time by a few seconds can mean hours in
    overall savings. Here are some ideas that programmers and/or CNC operators can
    consider when upgrading an existing part program.


    Programmed spindle speeds and cutting feedrates are the first items to evaluate;
    they require a very small intervention with virtually immediate improvement. It
    is a well-known fact that programmers take a rather conservative approach in this
    area. Another area of interest should be the clearances applied in the program
    — “cutting air” is never productive and should be minimized. Changing a grade
    of the cutting insert and increasing the feedrates also offer benefits without
    making major changes to the program. If the program contains various machining
    cycles, operators can make even more significant changes, depending on the cycle
    type.


    One of the overall cycle time killers is excessive dwell time. The minimum dwell
    time is the amount of time required to complete one spindle revolution. In practice,
    this amount is often doubled to allow full revolution dwell at 50% of programmed
    spindle speed. For example, a programmed dwell time of one second for 1200 rpm
    spindle speed is excessive, yet often pro-'
  merge: -1
  img_proc: true
- pgno: 35
  md: <!-- no content -->
  merge: -1
  img_proc: true
- pgno: 36
  md: 'Good training combined with experience will reward every shop owner in a relatively
    short time. As a shop owner, try to provide your employees with quality training
    — it will pay off in no time.


    ![](img/0023bd5cc50494e6d7799ab76d437c8d_36_0.png)


    # Lathe Cycles — To Use or Not to Use?


    *July 2004, updated February 2013*


    If we have to name a single major benefit that modern CNC technology has offered
    over the initial NC technology, it would have to be the various forms of machining
    cycles. Yes, those small routines save much of programmers’ time and calculations.
    CNC machining centers have had their ubiquitous G81, G82, G83, etc., for drilling,
    boring, tapping, and other operations related to hole machining for a long time.
    This group of special cycles makes perfect sense for the part programmer because
    even companies specializing in complex 3D can use them efficiently, albeit occasionally.
    Virtually every CAM software program supports these *fixed cycles* or *canned
    cycles*, as they are commonly called, through the post processor output. The story
    is somewhat different when it comes to CNC lathes and turning centers.


    # Multiple Repetitive Cycles


    In the early 1980s, Japanese company Fanuc adopted a concept long known to part
    programmers from the 1970s, who were using various programming languages, such
    the venerable Compact II, to develop roughing and finishing tool paths. The mathematical
    concept behind this development was quite simple — define the stock boundary,
    define the boundary of the finished contour, and the control will remove all the
    material contained within these two boundaries. The result of this adaptation
    of an early technology into a modern CNC turning system is now known under the
    collective umbrella of several *multiple*'
  merge: -1
  img_proc: true
- pgno: 37
  md: '*repetitive cycles.*


    Without a doubt, three of these cycles have become the staple of manual programming
    for CNC lathes since day one: the G71 cycle for roughing, the G70 cycle for finishing,
    and the G76 cycle for threading. Their ease of use (the user calculates only the
    finish contour points) and the possibility of operator changing the cutting parameters
    at the machine control have made them instant winners. The strongest feature of
    these cycles, brevity (only one or two blocks of program are required for roughing),
    also became their small disadvantage.


    CNC lathe manufacturers and vendors have realized that they can offer a better
    price on their machines if they make the available memory smaller (CNC memory
    is very expensive even today). There are still many CNC lathes that have a very
    small memory storage capacity for the part programs, although that is changing
    rapidly.


    Yet, even if the issue of capacity is becoming a non-issue, there is always the
    benefit of being able to change various cutting parameters at the control (depth
    of cut, for example). The developers of CAM software have realized this need and
    generally support the output of multiple repetitive cycles in the final program.
    What many developers also offer is the option of not choosing the cycles as the
    program output. Selection of this option will, of course, require a more robust
    memory capacity. It will also bring up an important question regarding *when not
    to use these cycles.*


    # ## Cycle Programming


    Cycles are nothing more than pre-programmed routines. They will define the tool
    motions strictly based on the criteria included in these internal routines. To
    be blunt (and somewhat unfair), the programmer is at the mercy of the software
    engineers who developed the control unit. Make no mistake about it. The control
    software was developed for most — but not all — turning, boring, or threading
    applications; it does the job extremely'
  merge: -1
  img_proc: true
- pgno: 38
  md: 'well in such situations. Logically, the software *could not* be developed for
    special applications.


    Yet, programming is somewhat like sculpting. There is technology involved, there
    is skill involved, and there is strong individualism involved (called art in sculpting).
    In order to control every single tool motion exactly as planned, the programmer
    may find a particular cycle to be ineffective.


    Take, for example, the G71 roughing cycle. It starts at the beginning of the cut
    and continues towards the end, with the change of direction allowed along the
    X-axis only. If your program requires frequent changes of cutting direction, the
    longer method (block-by-block) will be the choice. Single point threading cycle
    G76 is no different. It is great for a single start standard thread, but loses
    its appeal somewhat for multi start threads (although it can be still be used).
    It becomes virtually useless for special threads such as those with special forms,
    particularly when the threading bit is smaller than the thread itself or the thread
    shape has to be interpolated rather than formed.


    Without a doubt, these multiple repetitive cycles have made the programming and
    machining jobs much easier for all of us. At the same time, we have to understand
    their limitations and the alternatives for situations when these cycles are not
    preferable or are even impossible to use efficiently. Apart from programming every
    tool motion manually (which is always an alternative), make sure your CAM system
    can handle the type of tool motions required by the work you do and your programmer
    can generate the critical tool path. Also make sure you have enough memory available
    in the control system to store these programs — they can be quite long. A DNC
    (direct numerical control) solution may help as well.'
  merge: -1
  img_proc: true
- pgno: 39
  md: '# # Short Suggestions for Long Programs


    *August 2004, updated February 2013*


    Once in a while, your machine shop will face the need to run a CNC part program
    that exceeds the built-in control memory capacity. This method is commonly called
    DNC (direct numerical control) and uses the TAPE or EXternal mode of the control
    panel rather than the more common MEMORY mode. Not much is required for this method
    to work with your CNC machine — a suitable software, a desktop or a laptop computer,
    a connecting cable and some configurations. If all goes well, you are up and running
    in no time; if not, read on for some suggestions.


    For the purpose of this column, I define the term *long program* as a part program
    that cannot be executed from the control memory. The most common source of such
    programs is a CAD/CAM system processing complex machining operations. Although
    the majority of long programs involve some 3D machining (for example, mold work
    and multi-axis toolpaths), there is a growing need for more control of 2D toolpaths,
    for example, in pocketing or at high speeds. High quality CAD/CAM software offers
    a multitude of toolpaths and pocketing styles. When combined with control of the
    cutting width and depth, size of the part, cleanup of corners, ramping, etc.,
    it is not unusual to end up with a long program. The main difficulty when running
    such a program is when the CNC operator has to *restart* the cut somewhere in
    the middle of the program, after a substantial tool path had been completed with
    a particular tool. Often, the main reason is a tool breakage.


    Most CNC machines do not have *program restart* or *sequence return* features
    which address this problem. Yet, there are a number of ways the CAD/CAM programmers
    can minimize the downtime associated with interruption of the long program. Let’s
    look at some possibilities to consider:'
  merge: -1
  img_proc: true
- pgno: 40
  md: '# ## Computer Location


    Locate the computer that sends the long program as close as possible to the CNC
    machine that receives it. As a rule, the computer that receives the data (CNC)
    must be ready *before* the computer that sends the data (desktop or laptop). That
    means a bit of running between the two that can be eliminated.


    # ## Program Sections


    This topics is a very important consideration. Each tool used in the program is
    automatically a separate section. However, sections for a single tool, especially
    a tool that does a lot of work, should be carefully defined as well. One technique
    that can be used is homing the machine (machine zero return) after each section
    has been completed, particularly along the Z-axis, then starting at the next section
    with the same tool. As these extra motions add to the cycle time, they should
    be preceded with a slash (block skip function). An addition of program stop (M00)
    or optional program stop (M01) to this method may offer additional benefits.


    # ## Program Editor


    Use a dedicated CNC editor (designed for CNC files) or a text editor that can
    highlight individual addresses in the program — for example, all Z-axis motions
    in red. Colors help to identify individual sections, and the editor can also be
    used to create a temporary copy of a shortened program.


    # ## Block or Sequence Numbers


    They do help a lot. Although blocks or sequence numbers add to the overall length
    of the program, this length is irrelevant in DNC operations. If a tool breaks,
    the sequence number at the time of interruption offers some information that can
    be used for restart. Instead of using block numbers for each block, consider using
    only a few block numbers in strategic places within the'
  merge: -1
  img_proc: true
- pgno: 41
  md: 'program. A good place for selective block numbers is at the beginning of every
    new section that uses the same tool, or at home position.


    # Descriptive Comments


    Identify individual operations or sections of the program. For example, if the
    same tool is used for roughing five pockets, place a comment at the beginning
    of each pocket tool path with a unique description.


    # Feed and Retract Planes


    Be consistent in selecting the Z-axis positions for the start of cut and retract
    when the cut is completed. Text editors can be used to search and / or replace
    common data.


    # Cutting Feedrates


    If you make the plunging feedrate different from the cutting feedrate, you will
    more easily find the beginning of a section from which the change can be done,
    just by searching for the feedrate. Also, you will not accidentally forget a feedrate
    or use the wrong one.


    What else is there to watch for? The above suggestions can be applied individually,
    or combined. The most important is to make sure that any change implemented is
    a safe change. Watch for XY tool locations, missing spindle speeds and feedrates,
    the status of switches on the control panel, offset settings, and other related
    subjects.


    Running a long program from an external computer in DNC mode can be very simple
    and uneventful. On the other hand, if problems do arise, be prepared to deal with
    them via good planning in order to minimize the undesired downtime.'
  merge: -1
  img_proc: true
- pgno: 42
  md: '![](img/0023bd5cc50494e6d7799ab76d437c8d_42_0.png)


    # Keep Records — Document Your Programs


    September 2004, updated February 2013


    There are many reasons to keep track of work done during both common and not-very-common
    manufacturing processes and activities. The most important reason to keep track
    of the multitude of activities is to create some reasonable documentation for
    the work in progress. The method and its purpose are quite basic — to be able
    to register and retrace or retrieve individual development steps or stages in
    case of future need. Whether used for emergency purposes or general reference,
    good documentation is imperative for any serious work in a machine shop environment.
    At the corporate level, documentation is often developed for internal purposes
    only. Documentation can also become a major part of the ISO 9000+ certification
    process, in which case it takes its own form. At the level of CNC or CAD/CAM part
    programming, the needs in this field are much more relaxed and flexible, but equally
    important. This essay looks at program documentation relating to CNC programming,
    regardless of its method of development. Good documentation is as important for
    manual programming as it is for CAD/CAM tool path development.


    Most part programs reach the CNC operator in one of two forms, as a printed hardcopy
    or as a disc file. In both cases, the program format is the same, only the method
    of distribution varies. All CNC systems offer a method of inserting comments and
    messages into the body of the part program. If used properly, these comments and
    messages are located at strategic locations within the program, as comments intended
    for the CNC operator. The most common way to include comments and messages in
    a CNC program is the use of matched parentheses (). This (COMMENT) method is typical
    for Fanuc and related controls. For example, the following message instructs the
    CNC'
  merge: -1
  img_proc: true
- pgno: 43
  md: 'operator to check the width of the part:


    **(WIDTH MUST BE BETWEEN 26.7 AND 27 MM)**


    Other methods use the dollar sign ($) or the semicolon (;) and similar methods
    with the same purpose. In all cases, the control system is designed to ignore
    the message, or comment, during program execution.


    Having too many or too few comments in the part program can be counterproductive.
    Having no comments at all in the program can potentially lead to wrong assumptions,
    unless some other way of information is provided. The main goal of CNC program
    comments and messages is to provide an information link between the CNC programmer
    and the CNC operator. Thorough and informative program documentation is so important
    that every shop owner or manager should insist upon it and every programmer should
    provide it as a standard program feature.


    # Good Program Documentation


    What are the main characteristics of good program documentation? The first rule
    is to make any comment in the program short and to the point. The second rule
    is to include only those comments that are relevant to the project on hand. In
    terms of contents or subject matter, here are some suggestions that many CNC programmers
    have used successfully in various program comments:


    # *Date and Time*


    The current program version is critical; it must match the part drawing. The latest
    date and time are assumed to be the latest version.


    # *Programmer''s Name*


    The programmer''s name is important to the CNC operator in case questions or clarifications
    are necessary.'
  merge: -1
  img_proc: true
- pgno: 44
  md: '# # A Reader for Programmers


    # ### Drawing Number and/or Revision


    Include the latest drawing version used during the pro-gramming process.


    # ### Machine Type


    A well-developed part program can be used on CNC machines that are similar. A
    program comment should list which machine/control combinations will accept the
    given program.


    # ### Setup Data


    Specify the part zero in all axes. Include the setup method and all related information,
    such as part orientation, depths, and clearances.


    # ### Tooling Data


    List all tools at the program beginning and repeat the tool description for each
    tool in the program.


    # ### Special Instructions


    If the program contains M00 (program stop), describe the reason for its existence.
    For example, instruct the CNC operator that the part is to be reversed, or special
    lubrication has to be applied for tapping, or that the tool has to be checked.
    Many similar examples fall into this category.


    There are many different applications that benefit from comments and messages
    inserted in the part program. Depending on the control system, the comments may
    not load into the control memory, but they can always be available in printed
    form or in the program file. CNC programs developed by CAD/CAM software should
    include the same comments and messages as programs developed manually. All high
    level CAD/CAM software offers the insertion of comments into the program.


    A well-documented program is easier to interpret by the CNC operator and even
    by its own author (the programmer). Documentation should be provided as a standard
    feature of each program.'
  merge: -1
  img_proc: true
- pgno: 45
  md: '![](img/0023bd5cc50494e6d7799ab76d437c8d_45_0.png)


    # # Focus on Numbers


    *October 2004, updated February 2013*


    There is a good chance that the drawing from which you get to make a part has
    originated in CAD software. Nothing fancy, just a standard, everyday-type 2D drawing
    — two, three views, dimensions, and some text — that''s all. However, just because
    the drawing has been prepared in CAD does not mean it is without flaws and even
    errors. Let''s look at this fictional drawing and focus on a few details relating
    to numbers (dimensions, actually).


    # ## Focus 1 — Metric or Inch?


    What units are used in the drawing? If you have no clue, don''t assume — make
    sure! More drawings are now prepared in metric units than before, but they are
    not always prepared properly. The magic word METRIC somewhere in the corner of
    the drawing may just not be there to tell you. Here are some ways to tell (but
    verify it later, anyway).


    The first clue is the drawing scale and the second clue is the dimensions, their
    nominal values. If your specialty is producing small parts and you see the part
    length as 50, chances are you have a metric drawing. If you are used to seeing
    dimensions such as 1.625 or 0.75 (inches), and there are no dimensions that small,
    chances are you have a metric drawing. If the scale is correct, it solves another
    piece of the puzzle. Another clue is the number of decimals used in dimensions.
    If the drawing follows proper standards, a metric drawing should have whole numbers
    without the decimal point. So, our length of 50 mm will be shown as 50 between
    the dimension arrows, not 50.0. This is how it should be, but not always how it
    is.


    Which brings us to yet another clue, and that is how decimal numbers are expressed.
    Because the metric system uses 1/1000th of a millimeter as the smallest unit,
    you should never see more than three decimal places in a metric drawing — and
    even those are rather rare. Sometimes you have to convert'
  merge: -1
  img_proc: true
- pgno: 46
  md: 'dimensions if most of them are in one unit, but another (a thread or tap size,
    for example) is in the opposite unit. It can be messy out there, but that’s the
    price we pay for being behind the rest of the world in adopting the metric system.


    # Focus 2 – Tolerances


    A related item that could cause trouble — tolerances — is also directly related
    to a CAD system. Let’s stay with inches for this example. The drawing you have
    just received is basically a rectangular part, with overall dimensions shown as
    5.0000 x 3.0000 x 0.5000. What is this? A few decades ago we would have been taught
    that the number of decimals places indicates the precision of tolerance. For example,
    x.xxx would be ±0.001 (or whatever the internal company standards were then).
    So now we have a part that has four decimal places on all three overall dimensions!
    That’s not all — there is also a surface finish of 125–250 required on the length
    and width. Because this dimension makes no sense, we have to look at the real
    culprit behind this.


    First, throw out the old notion of this tolerance being implied by the number
    of decimal places. Yes, it is still done and, yes, it is still wrong. Separate
    from the fact that the notation breaks all ANSI or ISO standards, it is wrong
    because it is not reliable. It is not reliable for at least one reason (there
    are several more) — because a CAD software defaults to four decimal places for
    inch drawings, and to three decimal places for metric drawings. This can develop
    some bad habits in the CAD/CAM community. Of course, the software does allow for
    changes to any number of decimal places, but it is the role of the CAD operator
    to choose the proper settings.


    # Focus 3 – Why Is Metric Better than Inch?


    Note the question again. It does not ask if metric system is better, it assumes
    that it is better, and asks why it is better. Before I get too many e-mails challenging
    my question, let me state for the record that I am specifically referring to CNC
    machines, not'
  merge: -1
  img_proc: true
- pgno: 47
  md: <!-- no content -->
  merge: -1
  img_proc: true
- pgno: 48
  md: '# A Reader for Programmers


    # Advantages of CNC Programmer/Operators


    First, let’s look at the advantages. Involving one person in the larger process
    of making a part provides better understanding of that process. If problems do
    occur, solutions are often easier to find. Programmers who also run the CNC machine
    are more motivated to do a better job using their own program. It is a common
    requirement for part programmers to know how to machine a part, but it is not
    normally required of CNC operators to know all details about how to develop the
    program. Good CNC operators do not always understand the programming part and
    cannot always offer program-related solutions.


    In a combined position, this lack of understanding is eliminated. Programmers
    also frequently interact with engineers and customers; operators usually do not.
    Good programmers also interact with machine operators and seek their ideas. Again,
    the combined position may offer solutions to design or manufacturing process that
    only skilled machine operators could think of.


    # Disadvantages of CNC Programmer/Operators


    There are also disadvantages to this programmer/operator concept. The initial
    appeal of saving money on remuneration may be offset in the loss of production
    time. It is virtually impossible to make a program and at the same time operate
    a machine. To do both equally well takes not only a skilled and dedicated person,
    it also requires a suitable job. If a part has to be changed on the machine every
    two minutes or so, the programmer cannot sufficiently concentrate on the work
    of developing the next program. A part that takes twenty minutes to machine offers
    a little more flexibility.


    Every shop manager knows the term *machine utilization* — that the road to profitable
    business is running CNC machines as much as possible, producing quality parts.
    There are always some delays involved when using CNC machines. First, it is the
