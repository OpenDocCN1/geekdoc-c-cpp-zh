    12 TPI, the depth is 0.613/12 = 0.0511, so the final thread diameter is 3.0−2*0.0511=2.8978.
    For internal threads, the X-address is the nominal thread size, but the bore size
    has to be calculated from a similar formula using *0.541/TPI* or *0.541*Pitch*.
    The Z-address indicates the Z-position of the tool when it retracts from the thread.
    The R-address is the difference between the *end of thread* and the *start of
    thread*, measured per side. For straight threads, the difference is zero, programmed
    as R0 and can be omitted. For typical tapered threads, the R-amount will be *negative
    for external threads* and *positive for internal threads*. The P-address in the
    second block is the *height of the thread*, as calculated above — 0.0511, programmed
    as P0511. The Q-address is the amount of the *first thread depth* measured per
    side. Q0120 sets the depth to 0.0120 inches. The threading feedrate is always
    the thread lead, never the pitch. For single start threads, the lead is the same
    as pitch. In imperial units, the threading feedrate can be up to six decimal places.
    For metric threads, there is no practical use for extended number of decimal places.


    Typically, the CNC operator can control the thread quality by considering changes
    to all data in the first block, and the Q-amount in the second block. Changes
    to other data are much less frequent.


    # Additional Points


    In closing, keep in mind a few additional points. For staggered threading (changing
    sides of the thread during cutting), you have to use Fanuc 15 threading mode that
    incorporates a single block entry with four options specified by the address P.
    Generally, the feedhold button is ineffective during threading, but some controls
    allow it by forcing the thread to withdraw gradually. The XZ start point of the
    thread is also important, as it determines the position of the tool after each
    threading pass.


    Threading with the G76 cycle is very efficient and can be used for majority of
    threads. On the other hand, always keep in'
