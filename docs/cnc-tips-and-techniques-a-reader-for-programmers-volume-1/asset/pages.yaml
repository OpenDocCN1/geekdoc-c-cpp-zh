    # Create Your Own G-Code


    *August 2008, updated February 2013*


    Custom macros are a very common method of enhancing the concept of subprograms
    by adding variable data and many data manipulation features. One of the less frequently
    used macro features involves the development of customized G-codes. Typically,
    a custom G-code for machining will be some kind of a cycle and will appear as
    such in the program. G65 statement can also be used, but it does not provide the
    same transparency. The macro example used in this essay will recreate the G13
    command used on some controls other than Fanuc. As the actual control model is
    very important, the macro will be developed for Fanuc 16 /18 /21 systems.


    # The G13 Command


    Preparatory command G13 is commonly used to machine a circular pocket, such as
    a counter bore or a spot face, in climb milling mode. The macro will be stored
    as a cycle using only three major tool motions:


    +   - Motion 1: Lead-in arc —180 degrees from the circular pocket center

    +   - Motion 2: Full circle machining

    +   - Motion 3: Lead-out arc —180 degs. back to the circular pocket center


    As cutter radius commands G40 / G41 / G42 cannot be applied on an arc, they will
    not be used. Yet, the macro will still allow the CNC operator to fine tune the
    pocket dimensions at the machine, following established procedures as with a cutter
    radius offset. Development will start the same way as for any G65 macro call.
    Three variable arguments will be required:


    +   - Circular pocket diameter — argument C (#3 in macro)

    +   - Tool offset number to store the cutter radius — argument D (#7 in macro)

    +   - Cutting feedrate — argument F (#9 in macro)'
  merge: -1
  img_proc: true
- pgno: 185
  md: 'In the first step, develop a standard macro, for example O8600:


    ```

    ```

    O8600 (G13 CIRCULAR MILLING CYCLE — CLIMB MILLING)

    #31 = ABS[#3]/2 Radius of the circular pocket — guaranteed positive

    #11 = #4001 Stores current G-code of Group 01 (motion commands)

    #13 = #4003 Stores current G-code of Group 03 (absolute/incremental)

    #32 = #31-#[2000+#7] True radius of the pocket to cut; see explanation

    below !!!

    IF [#32 LE 0] GOTO998 Error if radius offset value is too large

    #33 = #32/2 Calculated lead-in/lead-out radius

    G91 G03 X#32 I#33 J0 F[#9/2] Motion 1 — lead-in arc toolpath

    I-#32 F#9 Motion 2 — full circular pocket toolpath

    X-#32 I-#33 J0 F[#9/2] Motion 3 — lead-out arc toolpath

    G#11 G#13 Restore original G-codes of groups 1 and 3

    GOTO999 Bypass error message

    N998 #3000 = 13 (OFFSET TOO LARGE) Alarm refers to actual offset

    setting

    N999 M99 Macro end

    %

    ```

    ```


    Once available, the macro can be called along with all three arguments:


    ```

    ```

    G65 P8600 C60.0 D51 F200.0 (metric units)

    ```

    ```


    *Be sure to enter the D argument as an offset number, not the cutter size!*


    # ## Converting Macro Call G65


    The next step is to convert the macro call G65 to a new G-code (G13). This choice
    is suitable because this type of macro is a true machining cycle. To make it appear
    as a cycle in the program, a G-code that has not been assigned must be selected.
    To make the macro a true cycle, two changes are required. The first change must
    be selection of a special macro number from the allowed range of ten possibilities:
    O9010 to O9019. That means'
  merge: -1
  img_proc: true
- pgno: 186
  md: 'changing the macro number from O8600 to O9013, for example. Any number within
    the range can be selected, but calling the macro O9013 makes some logical sense.
    The second step is to register the new G-code (13) as a system parameter.


    Offset number 13 has to be registered in the parameter that corresponds to the
    calling program, which is O9013. Depending on the control model used, the range
    of system parameters will be different (consult your control manual). This example
    uses Fanuc 16/18/21, where the parameter range is between 6050 and 6059 (relative
    to macros 9010 to 9019). Parameter 6053 corresponds to macro O9013 and will contain
    the new G-code number 13. Once the new G-code number is registered, the macro
    body does not change, only its number. Now, a circular pocket can be called by
    the new G-code in any part program that requires it:


    ```

    G13 C60.0 D51 F200.0

    ```


    # Types of Macros


    The example used Fanuc system model 16/18/21, but it also used offset memory Type
    A. This is reflected in variable #32. Macro variable #32 is absolutely critical
    and requires explanation. All active offsets are stored as system parameters.
    Fanuc offers three types of memory offset registers (Type A — one register is
    shared by tool length and radius offsets; Type B — also a shared register, but
    geometry and wear offsets are separate; Type C — separate registers for tool length
    and radius offsets, each with geometry and wear settings). For 200 offsets or
    less, Type A macro uses system variables #2001 to #2200, Type B uses system variables
    #2001 to #2200 for the geometry offset, and #2201 to #2400 for the wear offset.
    Finally, Type C uses system variables #2401 to #2600 for the radius geometry offset,
    and system variables #2601 to #2800 for the radius wear offset. Variable #32 must
    always reflect the offset memory type used. There are no tool length system variables
    for types A and B, and those for Type C are not required. Various error trapping
    features can be added'
  merge: -1
  img_proc: true
- pgno: 187
  md: 'to the macro, which can also be modified to conventional type of machining.


    The macro listing for the example with an accompanying figure appears in Appendix
    3 at the end of this book.


    ![](img/0023bd5cc50494e6d7799ab76d437c8d_187_0.png)


    # ## Scaling Option


    *September 2008, updated February 13*


    One function on many control systems is called scaling. Often offered as an optional
    control feature, scaling allows an existing program to machine a part smaller
    or larger. Before you jump to conclusions, keep in mind that scaling is not meant
    to be the means of part correction due to poor programming methods or bad setup.
    Scaling is often used in casting or plastic injection mold work to allow adjustments
    due to shrinkage during the molding process, but can be used in 2D work as well.
    From a CNC programmer’s perspective (rather than engineering perspective), scaling
    is quite easy to program, but there are a number of some special considerations.


    # ### Changing the Toolpath


    Scaling will physically change the current toolpath proportionally, based on the
    location of the scaling center and the scaling factor provided. A control-dependent
    system parameter can be set to make scaling effective or ineffective for each
    of the three main axes, but not for any additional axis. Also, scaling does not
    affect various offset modes, namely work offsets G54–G59, tool length offset G43,
    and cutter radius offset mode G41–G42. If a fixed cycle in the G81–G89 series;
    or G73, G74, or G76; is used while scaling mode is active, the shift amount in
    G76 and G87 cycles (the peck drill depth and relief amount in G73 and G83 cycles)
    will *not* be affected.'
  merge: -1
  img_proc: true
- pgno: 188
  md: 'The *machine zero return* commands are another consideration. Preparatory commands
    related to the machine zero return, particularly G28 and G30, but also G27 and
    G29 (rarely used anymore), should always be programmed with scaling mode OFF in
    effect. On older controls that still use the G92 command for position register,
    make sure the scaling mode OFF is also in effect. Cutter radius offsets G41 and
    G42 should always be canceled by G40 before the scaling function is activated.
    As mentioned already, other commands and functions can be active, including all
    work offset commands G54 through G59 and the additional ones, if they are available.


    # G50 and G51 Codes


    Fanuc programming format uses two G-codes: G50 and G51 commands, where G50 cancels
    the scaling mode and G51 makes the scaling mode active. The programming format
    for G51 is:


    ```

    G51 I.. J.. K.. P..

    ```


    IJK addresses refer to their respective XYZ coordinates of the scaling center,
    while the P-address is the scaling factor. Scaling center is defined in absolute
    coordinates of the current units of measurement, and scaling factor can be in
    0.001 or 0.00001 increments, depending on the control setting. In order to prevent
    any conflict, both G50 and G51 should be programmed as separate blocks, with no
    other significant data included.


    The scaling center determines the *location* of the scaled tool path and the scaling
    factor determines its size. For scaling factors greater than one, the machining
    tool path will be *expanded*. For scaling factors smaller than one, the machining
    tool path will be *reduced*. The scaled part will always expand away from or reduce
    towards the scaling point equally along all specified axes.


    The basic programming format is illustrated in the following example:'
  merge: -1
  img_proc: true
- pgno: 189
  md: '```

    ~~~gcode

    N1 G20

    N2 G17 G40 G80

    N3 G50 (SCALING OFF AT TOOL START)

    N4 G90 G00 G54 X-1.25 Y-1.25 S800 M03

    N5 G43 Z1.0 H01 M08

    N6 G51 I0 J0 P1.050 (SCALING CENTER AT X0Y0 - 1.05X expand)

    N7 G01 Z-0.7 F50.0

    N8 G41 X-0.75 D51 F25.0

    N9 Y1.75 F15.0

    N10 X1.5

    N11 G02 X2.5 Y0.75 I0 J-1.0

    N12 G01 Y-0.75

    N13 X-1.25

    N14 G40 Y-1.25 M09

    N15 G50 (SCALING OFF AT TOOL END)

    N16 G00 Z1.0

    N17 G28 Z1.0

    N18 M30

    %

    ~~~

    ```


    # ## Rounding Errors


    One very important consideration in scaling is a possible rounding error. To illustrate,
    consider a conversion between metric and inch units. A dimension of 1.0 inch will
    become 25.4 mm, which is an exact conversion. On the other hand, 25.4 mm converted
    to inches will use a factor of 0.039370079. If the scaling factor is set to a
    three decimal accuracy, the 25.4 mm will become only 0.991 inches (25.4 x 0.039
    = 0.9906) — a rather large error of about 0.009. With scaling factor set to five
    decimal places, the error will still be there but it will be practically negligible.


    The scaling factor is a *multiplying factor*, not a percentage. If a certain scaling
    percentage is required — for example, 5% shrinkage — it has to be converted. The
    scaling factors of P1.05 (expansion) or P0.95 (reduction) are well within the
    expected accuracy of the final part precision.


    For a complete example with illustration, using the scaling function, see Appendix
    4 at the back of this book.'
  merge: -1
  img_proc: true
