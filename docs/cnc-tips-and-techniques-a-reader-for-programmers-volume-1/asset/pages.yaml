  md: 'grammed G54 work offset is used by the CNC operator to set the program zero,
    G52 is used to *shift* this zero to a different location, usually on a temporary
    basis. The real benefit is that the actual setting of G52 is controlled by the
    part program (the actual setting of the G54 offset is entered at the machine control,
    during setup). Using G52 does not need much effort, but three conditions are important
    for its successful use:


    +   - G52 always works within the current work offset, such as G54

    +   - G52 does not cause an axis motion — it only adjusts the current work offset

    +   - The amount of zero shift used for the G52 must be known at the time of programming


    The first condition explains the meaning of the G52 definition — *the local coordinate
    system is subservient to another coordinate system*. Programming G52 requires
    only the amount of difference between the program zero as determined by the work
    offset (G54) and the new location. For example, the **G52 X2.0 Y1.0** block in
    the program will shift the program zero two and one inches respectively in X and
    Y, into the positive direction from the *current* program zero (as set by G54).
    While the G52 is in effect, this new position is the program zero for all calculation
    purposes. To cancel the zero shift, just program a block containing zero values
    — G52 X0 Y0 — and the original program zero (as set by the G54 work offset) will
    return to normal.


    Keep in mind that no axis motion will take place when the G52 shift is executed.
    All that happens at the control unit is the temporary updating of the internal
    work offset setting by the amount specified in the G52 block. Also keep in mind
    that because G52 is a programmable command, the amount of shift *must be known*
    at the time of programming. The primary usage of G52 is *within* a single part.
    It can also be used to shift zero between different parts located on the machine
    table, providing their exact locations are known. If the locations of other parts
    are random, use a different work offset, for example G54 for the first'
  merge: -1
  img_proc: true
- pgno: 68
  md: 'part, G55 for the second part, and so on.


    The local coordinate system command G52 can be used on both machining centers
    and lathes. Its main benefit is that it allows CNC operators to set program zero
    in a more convenient or accessible location, and at the same time also offers
    CNC programmers a method of easier calculations of tool path coordinates. The
    result on both sides of the production process is minimizing possible errors,
    whether it is a programming error or an error that can happen during setup.


    Shifting program zero by G52 command is not the only available method. Another
    command that can be used is G10 — *data setting command*. That will be subject
    of another essay.


    ![](img/0023bd5cc50494e6d7799ab76d437c8d_68_0.png)


    # ## Shifting Program Zero — Part 2


    *August 2005, updated February 2013*


    A different essay described the G52 method of shifting program zero (part zero)
    in the CNC program. Now we look at another very powerful method, using the data
    setting command G10. The G52 command does not change the actual settings of offsets
    stored in the control system and can be used only when a work offset is in effect.
    In this respect, G52 is a true part zero shift command.


    # ### G10 – The Data Setting Command


    Although G10 is also used to shift program zero, it can be used for changing *any
    offset*, not just the active work offset. In that sense, G10 offers many more
    possibilities and places more responsibility into programmer’s hands. Regardless
    of its actual application, G10 will always change the current settings of the
    selected offset, with no means to undo, no means to go back to the previous settings
    automatically. This fact alone is a good reason to understand the data setting
    command well. All three offset groups can be changed by G10 — the work offset,
    the tool'
  merge: -1
  img_proc: true
