- pgno: 74
  md: "and have look at this situation in more detail.\n\n# ## G73 and G83 Cycles\n\
    \nSpecial drills do exist that allow drilling deep holes to the full depth without\
    \ peck drilling on CNC machining centers. In the absence of such drills, the common\
    \ practice is to program a fixed cycle — the standard G73 or G83 cycle — that\
    \ is designed for such purpose. The G73 cycle is more suitable for breaking the\
    \ chips because it does not retract above the part after each peck, only when\
    \ the drill reaches the final depth. If you need to flush chips or get some more\
    \ coolant into the hole, the G83 cycle may be a better choice.\n\nOn Fanuc and\
    \ similar controls, either cycle requires the Z-axis start position (programmed\
    \ as R), the final hole depth (Z), and the depth of each peck (Q). Although these\
    \ cycles work well in most cases, they lack one feature. They are not able to\
    \ decrease the pecking amount as the drill goes deeper into the hole. Optional\
    \ Fanuc Macro B is an excellent method of programming for this purpose because\
    \ it allows the user the exact control required by developing a flexible custom\
    \ cycle.\n\nWhat about those machine shops that do not have the macro option installed?\
    \ Although there is no direct solution, there is a workaround of sorts. Just use\
    \ the cycle two or three times at the same location, and decrease the Q amount\
    \ for each run. A program may look something like this:\n\n```\n    (G43 Z1.0\
    \ H01 M08)\n    G99 G73 X.. Y.. R0.1 Z-2.6 Q0.75 F10.0\n    R-2.5 Z-4.0 Q0.5\n\
    \    G98 R-3.9 Z-5.85 Q0.25\n    G99 X.. Y.. R0.1 Z-2.6 Q0.75 (ETC.)\n```\n\n\
    There is a certain loss of time that can be significant when hundreds or even\
    \ thousands of holes are machined with the same program, but it does the job without\
    \ macros. Another pos-"
