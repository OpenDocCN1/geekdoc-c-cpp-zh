- pgno: 108
  md: '# Block Skip Adds Flexibility


    _September 2006, updated February 2013_


    ![](img/0023bd5cc50494e6d7799ab76d437c8d_108_0.png)


    From all the programming commands and functions, two are closely related to the
    settings at the operation panel of the CNC machine. One is the _Optional Stop_,
    using the M01 miscellaneous function. The other one is the _Block Skip_ function
    (sometimes identified as Block Delete). The _Optional Stop_ is quite straightforward:
    active (ON) or inactive (OFF). The _Block Skip_ function is more complex and requires
    special care in the hands of both CNC programmer and CNC operator.


    # Block Delete


    First, let’s demystify the _Block Delete_ description: no blocks will ever be
    deleted from the program. The term _delete_ is misleading in this case. Blocks
    preceded by a forward slash will only be _skipped (bypassed)_ if the operator
    chooses. In order to activate or deactivate this feature, the programmer must
    include at least one block in the program using the forward slash symbol and the
    operator must turn on or off the _Block Skip_ switch on the machine operation
    panel. One without the other will not work. Because most programs do not require
    any block skip functions, the machine switch should be turned off as a general
    rule.


    # Block Skip


    What is the purpose of the _Block Skip_ function? Why would a block or blocks
    be programmed in the first place and then skipped on demand? There are several
    common uses (and many uncommon ones) for this feature. One of the most common
    applications is to optionally return one or more axes to machine zero, either
    at the beginning or at the end of a program. For example:'
  merge: -1
  img_proc: true
- pgno: 109
  md: <!-- no content -->
  merge: -1
  img_proc: true
- pgno: 110
  md: 'program must work in both cases to your satisfaction.


    # Example: Two Face Cuts


    There are other applications of a block skip, such as programming a test cut for
    precise offset settings or programming two or more face cuts for a part with variable
    stock height or length. The next example shows two face cuts — the first one may
    be skipped if there is no need for it:


    ```

    ...

    N78 G90 G00 X-3.0 Y2.65

    /N79 Z0.1 M08

    /N80 G01 X8.5 F15.0

    /N81 G00 Z0.2

    /N82 X-3.0

    N83 Z0 M08

    N84 G01 X8.5 F12.0

    N85 G00 Z1.0

    ...

    ```


    Although the M08 function could have been programmed earlier than in block N79,
    the program segment as shown serves as an example of necessary repetition in block
    N83.


    # Using the Forward Slash


    Several general rules apply to using the forward slash in the program. Normally,
    the slash symbol must always be the first character in the block. Some controls
    allow block skip in the middle of a block, a feature that offers additional possibilities.
    This is not a standard feature, so check it first. Another rule is aimed at the
    CNC operators. Be sure to activate the switch *before* the first slash in the
    program is processed, and deactivate the switch only *after* the last block with
    the slash had been processed. Following these simple rules will make the Block
    Skip command a valuable addition to the current programming methods by adding
    flexibility at the machine.'
  merge: -1
  img_proc: true
- pgno: 111
  md: '![](img/0023bd5cc50494e6d7799ab76d437c8d_111_0.png)


    # ## Simulating the Toolpath


    *October 2006, updated February 2013*


    Any skilled CNC programmer and operator should be able to interpret and check
    the part program in its written form. Although time and experience will make such
    interpretation faster and more accurate, scrolling through a rather dry program
    code cannot beat a real visual simulation of the toolpath on a computer screen.


    # ### Types of Toolpath Simulation


    Currently, there are several types of toolpath simulation available. One is built
    right into the control system, by the manufacturer, typically as an option at
    an added cost. Another type is an integral part of CNC oriented software, such
    as Mastercam, Edgecam, and most others.


    For those machine shops that have only standard controls and no programming software,
    there is an attractive *stand-alone* alternative — toolpath simulation software
    that runs on a desktop or a laptop computer. Two common types of this group are
    1) a wireframe simulation and 2) a simulation using a shaded model. Current software
    market offers a number of choices that vary greatly in features (and prices).
    Virtually all software vendors offer a time-limited trial period, which lets interested
    users test several software packages before purchasing the right one for their
    needs. Although the initial cost of the software is always important, its actual
    features and capabilities are much more critical, particularly in the long term.


    All simulation software available today is expected to support the common tool
    motions, fixed cycles for machining holes, and several other common control features.
    Most have a built-in text editor that can be used to write and edit the part program.
    Unfortunately, a lot of software programs of this type lack many control system
    features and attention to detail. When selecting CNC simulation software, ask
    questions important to you and to'
  merge: -1
  img_proc: true
- pgno: 112
  md: 'your common work, before committing to a purchase. Does the software support
    milling and turning operations in one package? Does it support special functions
    of the control system? For example, you may have *Coordinate Rotation* or *Programmable
    Mirror Image* functions that you use frequently, but cannot simulate them because
    the software does not provide the necessary support. Fanuc control support is
    generally standard for most simulation software, but does the software provide
    its variations, such as for Haas or Mitsubishi controls? What about *User Macros*?
    *Vertical lathes*? DNC? The list of these and similar questions can be quite long
    and it would take more than a short essay to cover all details. To offer at least
    some insight in the search of the perfect simulator, I will use my own experience
    as an example.


    # What I Want in a Simulator


    My quest has been for a CNC toolpath simulator that I would want to include in
    one of my books (on a CD). I have evaluated over a dozen CNC simulation software
    packages. My goal was to find one that is user friendly, features rich, and affordable—a
    combination rather rare these days. Simulators using a shaded model were visually
    attractive, but the additional requirement of stock and tool definitions did not
    suit my needs for general use. Furthermore, I often did not find support of the
    software for many of the special functions that my in-depth CNC books cover, features
    I wanted to be simulated on the screen. I wanted simplicity, accuracy, and features—a
    lot of features.


    Eventually, my long quest ended when I found (www.ncplot.com) a Michigan-based
    company offering software called *NCPlot*. Its version 2.0 was a relative newcomer
    to the market; the newest version is *NCPlot v2*.


    What I like about *NCPlot* is what I also believe many machine shops will find
    very useful as well. The complete list can be quite long, so I will mention some
    of the main features that can be used as a general guide for selection of any
    CNC simulation software currently on the market. In NCPlot, once you'
  merge: -1
  img_proc: true
