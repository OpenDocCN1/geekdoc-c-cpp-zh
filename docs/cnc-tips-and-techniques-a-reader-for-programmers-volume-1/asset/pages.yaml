    # # Special Tapping Macro


    *November 2008, updated February 2013*


    A while back I trained a customer in programming and operation of his new CNC
    machining center with a Fanuc control. His product was quite simple, but included
    a lot of tapped holes in aluminum. These holes were very small (the largest was
    #3-48), cutting through material no thicker than 1/8 of an inch (often much less).
    I might add that the customer was very experienced in manual machining. Yet, what
    looked like a short training session turned out to be a two-day job. The problem
    was not uncommon to tapping with very fine pitch: *thread stripping*.


    # ## Thread Stripping


    We tried everything that our collective experience has ever taught us and more.
    We had the machine checked by the factory technician, used different type of floating
    tap holders (no rigid tapping was available), and tried taps with different geometry,
    flutes, and coating. We tried different spindle speeds, coolants, and tap drill
    sizes — all to no avail. Giving up was not an option, so I consulted a tooling
    expert. To all questions “Did you try this?” I answered with “Yes,” except for
    one question. “Did you try to feed in at 80% and out at 120%?” I answered I did
    not because the G84 tapping cycle does not allow change of feed rate. We did try
    underfeeding, but not different feed rates. After a short lecture on the benefits
    of this rather unusual method, I wrote a test program and tried it at 100% spindle
    speed and feedrate setting. To everyone’s surprise, it worked. Changing the test
    program to a macro was the next step:


    ```

    ~~~

    (# 3-48 TAP)

    ...

    S800 M03

    G65 P8500 R0.15 Z-0.14 F16.6 (MACRO APPLIED WITH ARGUMENTS)

    ...

    ~~~

    ```'
  merge: -1
  img_proc: true
- pgno: 194
  md: <!-- no content -->
  merge: -1
  img_proc: true
- pgno: 195
  md: '```

    ```gcode

    M03

    # 3003 = 0  (SINGLE BLOCK MODE ENABLED)

    GOTO 999  (BYPASS ERROR MESSAGES)

    N991 # 3000 = 991 (FEEDPLANE R NOT DEFINED)

    N992 # 3000 = 992 (Z-DEPTH Z NOT DEFINED)

    N993 # 3000 = 993 (FEED RATE F NOT DEFINED)

    N999 M99

    %

    ```

    ```


    The macro shows not only the use of several 3000-series system variables, but
    also how a relatively simple but pesky little problem can be solved. Further improvements
    to the macro can be made; for example, the feed rate can be calculated internally,
    based on the spindle speed and threads per inch or pitch.


    There is also another point to this story — take advantage of the knowledge many
    tooling specialists have.


    ![](img/0023bd5cc50494e6d7799ab76d437c8d_195_0.png)


    # Setting Up a New Part


    *December 2008, updated February 2013*


    CNC machine operators usually start a new job by studying the documentation included
    with the program, using the engineering drawing as the main source of information.
    Additional data are often covered in a setup sheet or a tooling list, along with
    a graphic representation of the setup. This month we look at general setup procedures
    that can be used for various types of CNC machines.


    # *Step 1: Set the cutting tools.*


    This first step uses tooling information from the part program. CNC operators
    set the cutting tools into their holders and respective tool stations and register
    all tool numbers into the control memory, if necessary. Make sure the tools are
    sharp and mounted properly in the holders.'
  merge: -1
  img_proc: true
- pgno: 196
  md: '# *Step 2: Set the fixture.*


    A fixture that holds or supports the part is mounted on the machine, squared,
    and adjusted, if necessary, but the part itself is not mounted at this point.
    The setup sheet serves as the documentation, particularly for complex setups.
    A fixture drawing may often be required as well.


    # *Step 3: Set the part.*


    Locate the part into the fixture and make sure it is secured. Check for possible
    interferences and obstacles in the setup. Obstacles generally include undesired
    contact of the tool with the part, machine, or fixture. Watch for clearances during
    the tool change.


    # *Step 4: Set the tool offsets.*


    Depending on the type of machine, this step takes care of setting the tool geometry
    and wear offsets, tool length offset, and cutter radius offset, if applicable.
    One of the most important parts of this step is the setting of work coordinate
    system (work offsets G54 to G59) or the tool position registers (G92 or G50) for
    old controls, but not both, even if they are available. Work offset setting (geometry
    offset for lathes) is by far the best and most convenient selection of modern
    CNC machine tool setup.


    # *Step 5: Check the program.*


    This step is the first evaluation of the part program itself. The part to be machined
    may be temporarily removed from the fixture. Because all the offsets are already
    set in the control system, the program is checked accurately, with all usual considerations.
    Program override switches on the operation panel may be used, if required. Watch
    for tool motions in general and be sure to watch for tool indexes specifically.
    Repeat this step, if not absolutely sure about any aspect of the programmed toolpath.'
  merge: -1
  img_proc: true
- pgno: 197
  md: '# Step 6: Reset the part.


    If the part was removed in the previous step, now is the time to mount it in the
    fixture again. Successful completion of all previous steps allows you to continue
    proving the first part. At this point, check the tooling once more; also check
    the oil and air pressure, clamps, offsets, switch settings, chucks, and any other
    important machine feature, just to be sure.


    # Step 7: Make a trial cut.


    Sometimes an actual trial cut may be required in order to establish whether or
    not the programmed speeds and feeds are reasonable and whether the various offsets
    are set properly. The trial cut is a temporary or an occasional cut that is designed
    to identify minor deviations in actual offset settings and allows their change.
    Make sure the trial cut leaves enough material for actual machining. Trial cuts
    also help to establish tool offsets to keep dimensional tolerances within limits.


    # Step 8: Adjust the setup.


    At this point, any necessary adjustments are finalized in order to fine tune the
    program before actual production begins. This step includes final offset adjustment
    (usually a wear offset). It is also a good time to adjust spindle speeds and cut
    feedrates, if necessary.


    # Step 9: Start the production batch.


    A full batch production can start now. A quick second double check may again prove
    to be worth the time. The ideal way to run a new program is to run it first through
    the control graphic display, if available. It is fast and accurate, and offers
    a lot of confidence before actual machining. This test can be run with a variety
    of override modes in effect, for example, Machine Lock or Single Block. Do not
    underestimate features such as Zero Axis Neglect and Dry Run, when testing a new
    program. Do not expect'
  merge: -1
  img_proc: true
- pgno: 198
  md: '100% accurate graphical display of any toolpath. No display can show every
    single detail and no simulation will show flying chips.


    Although the numbering of individual steps described suggests a certain fixed
    order, there is a great amount of flexibility in the process. Just use common
    sense — past experience also helps.'
  merge: -1
  img_proc: true
