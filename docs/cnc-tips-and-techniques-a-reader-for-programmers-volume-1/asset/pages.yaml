- pgno: 105
  md: 'radius commands. As you guessed, the other one is the G28 command. In another
    essay (Cutter Radius Office — Basic Concepts), I touched upon the basics of G41
    / G42. Now is the time to demystify the other, often troublesome command: the
    mysterious G28.


    # Defining the G28 Command


    In my view, the main cause of the difficulties lies in the much too common textbook-style
    definition (manuals, books). Understandably, command definitions have to be brief
    and often do not (or cannot) present the whole meaning of the command. Such is
    the situation with G28. If there were no limit to the definition of the G28 command,
    what would the definition be? Let me try this one:


    > **G28 = Motion to machine zero applied to the specified axis (axes) and passing
    through an intermediate point**


    Although lengthier, this definition is quite a bit more specific, and it is the
    true definition of the G28 command. Keep in mind that G28, when used in the program,
    cannot be used on its own. It is just a non-modal preparatory command — a command
    that sets the stage, so to speak. G28 must always be associated with one or more
    of the available machine axes. Its purpose in the CNC program is to send the specified
    axis (or axes) to machine zero position, commonly known as the home position.
    On its own, the G28 is useless. It cannot be used without additional data, without
    at least one axis specified together with the G28.


    # Additional Axis Data


    The block containing the G28 command must also include some other axis data; the
    letter X, Y, or Z without an assigned value is not good enough (at least on Fanuc
    and similar controls). So what should the value of the selected axis be? This
    was a'
  merge: -1
  img_proc: true
- pgno: 106
  md: 'tough nut to crack during the initial software design, but the Fanuc engineers
    came up with a brilliant solution. They decided that the axis value (the axis
    data) associated with G28 will represent the intermediate tool location on the
    way to machine zero. Practically speaking, it means the CNC programmer can say,
    *“Yes, I want to move the tool to the home position, but I want to move it through
    a special point on the way.”*


    That point is called the *intermediate point*. It is a point to go through before
    the actual motion to machine zero is activated. One client of mine has compared
    this intermediate point with a stop at the Post Office on the way home from work.
    That is exactly what the intermediate point is all about — a position, a location,
    to go through on the way to machine zero.


    # ## Dimensioning


    In a typical CNC program, the G28 command (with associated data) may be programmed
    in two modes of dimensioning; in the G90 absolute mode or in the G91 incremental
    mode. A typical program entry may look like this (Z-axis only shown):


    ```

    ```

    G21 G90

    ...

    G00 Z2.0

    G28 Z2.0

    M01

    ```

    ```


    The same program segment in the incremental mode (G91) will be only a slightly
    different:


    ```

    ```

    G21 G90

    ...

    G00 Z2.0

    G91 G28 Z0

    M01

    ```

    ```


    Both versions represent the same machining situation as'
  merge: -1
  img_proc: true
