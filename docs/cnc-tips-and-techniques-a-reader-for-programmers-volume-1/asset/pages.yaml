- pgno: 71
  md: '# # Threading Methods Compared


    ![](img/0023bd5cc50494e6d7799ab76d437c8d_71_0.png)


    *September 2005, updated February 2013*


    When it comes to single point threading on CNC lathes, part programmers have several
    choices — three, in fact. The oldest programming method was, and still is, a method
    that is also very time consuming. This is the original block-by-block threading,
    using preparatory command G32 (also known as G33 on some controls). Because of
    the many calculations required to prepare even a few simple threading passes,
    it did not take long for the control developers to make the programming process
    a little shorter, and the first threading cycle was born. This cycle is still
    known today by its preparatory command G92. Although a significant improvement
    for its time, the G92 cycle has not met the high expectations of part programmers
    and machine operators. Finally, Fanuc has come up with a true gem — the G76 multiple
    repetitive threading cycle. A bit of a mouthful for a description, G76 has quickly
    become the king of single point threading. How does that position the other threading
    methods, using the G32 and G92 commands? Is there still room for them?


    # ## The G32 Method


    The G32 method of thread cutting is also known as the “long hand” method — and
    long it can be. The most fundamental understanding of G32 is that it is not a
    cycle of any kind. It is a plain programming of each and every step in the threading
    process. Take a typical single pass of a thread; it has four parts. From the start
    position, the tool will rapid to the diameter to be threaded, then the threading
    itself will take place. Next, the tool has to retract away from the thread and,
    finally, it must return back to the start position.


    These four parts represent four blocks of the program. With seven passes, for
    example, the threading motions will only take twenty eight blocks of the program.
    For the best results, each'
  merge: -1
  img_proc: true
- pgno: 72
  md: 'threading diameter has to be calculated individually, so the metal removal
    rate will remain fairly consistent. In addition, most threads benefit from a flank
    infeed, also known as angular of compound infeed. Thus, each start position will
    have to change its Z-coordinate, which has to be calculated trigonometrically,
    based on the depth of pass and the infeed angle desired. This could be quite a
    programming workout.


    Although the G92 threading cycle made some progress towards a program that is
    shorter, it did not address any of the tedious calculations. G92 only removes
    the repetitive data from being written over and over again—that means you still
    have to calculate each threading pass diameter. In addition, G92 cycle is only
    suitable for straight or plunge infeed, not an angular infeed.


    # The G76 Threading Cycle


    Introduction of the G76 threading cycle has changed the thread programming forever.
    In a very short program segment resides a lot of power—no more calculations of
    the number of passes or individual diameters, no more trigonometry to find the
    next Z-coordinate, plus a great control over cutting depth and infeed. All this
    and much more is squeezed into a one or two block segment of the program, for
    any number of passes. G76 cycle comes in two flavors: an older one that requires
    a single block of programming and a newer one that requires two blocks of programming.
    A lathe control system supports only one method or the other, but not both. Either
    method offers substantial flexibility at the machine, so the CNC operator can
    fine-tune the cutting conditions. Either method provides parametric specifications
    (meaning data can be changed externally rather than through the control settings).
    The two-block method offers more options relating to the finishing passes. Without
    a doubt, G76 is the cycle to use for most single point threading applications,
    perhaps even all threading applications.


    Note the emphasis of the word most in the last sentence. G76 can do straight threads,
    tapered threads, multi-start threads;'
  merge: -1
  img_proc: true
- pgno: 73
  md: 'it can do all external or internal threads. Yet, even G76 cannot be used —
    and is not meant to be used — for every thread type all the time. Extra deep threads,
    face or scroll threads, and certain special form threads cannot be programmed
    with G76 at all, or at least not to their full completion. G76 is mainly software
    driven. The human input is relatively minimal; the software takes most of the
    control. This is all great and works very well in the majority of threading jobs.
    What about the rest? If G76 cannot do a particular threading job in a satisfactory
    way, what is the alternative? Is there one?


    There is only one answer to these questions: Yes, there is an excellent alternative
    and its name is G32. The simple cycle G92 just does not bring any significant
    benefits to be even considered. G32 on the other hand offers the absolute control
    over any thread the system software can handle. G32 is the ultimate solution,
    but there is a price to pay in terms of efficiency. Program using G32 must be
    right from the beginning. There is no fine-tuning possible at the machine; the
    program could be very long, and mistakes can squeeze themselves in very easily.
    In spite of all that, count on G76 as your everyday best choice for single point
    threading, but keep the door open for G32 — it may just save the day.


    ![](img/0023bd5cc50494e6d7799ab76d437c8d_73_0.png)


    # ## When 1 Thou Equals 65 Dollars


    *October 2005, updated February 2013*


    One of my clients considers himself a master hole-maker and is proud of it, and
    quite rightly. He is at the top in all the latest drill technology, skills, and
    equipment. Making holes is his business in a very competitive field, and being
    number two in the area is not an option. Recently he was working on a part similar
