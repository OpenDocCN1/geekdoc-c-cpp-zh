    # Limitations in Threading


    *April 2009, updated February 2013*


    Programming a single point thread is very simple, considering that virtually all
    threading operations use a special multiple repetitive cycle G76. This is a parametric
    type of a cycle that occupies only two blocks of the CNC program (older controls
    use a one-block format). This cycle was described in the essay *G76: Two Formats,
    One Cycle*. This essay focuses on problems that may occur because of certain limitations
    in threading, regardless of what programming method is used (long hand or cycle).


    Threading problems in this category belong to two limitations:


    +   - Limitation of spindle speed (rpm)

    +   - Limitation of cutting feedrate


    When evaluating a threading problem, pull out the machine manual and check what
    is the actual maximum programmable range of spindle speed and cutting feedrate.
    For the purpose of this essay, let’s use these ranges as illustrative examples:


    +   - Minimum spindle speed 125 *rpm*, maximum spindle speed 3000 *rpm*

    +   - Minimum cutting feedrate 250 *ipm* in X-axis and 500 *ipm* in Z-axis


    # Pitch vs. Lead


    One very important distinction in threading is the difference between the pitch
    and the lead of a thread. Much too often, the word *pitch* is used where lead
    is the correct term. *Lead* is defined as the distance the tool will advance along
    an axis in one spindle revolution, whereas *Pitch* is defined as the distance
    between corresponding points of two adjacent threads. *Lead* equals *Pitch* only
    for single start threads. Cutting feedrate for threading is always equivalent
    to the thread lead. For any thread, the feedrate is equivalent to:'
  merge: -1
  img_proc: true
