    # # Getting Rid of Chatter


    *January 2009, updated February 2013*


    Every machinist has experienced the sound — sharp, squeaky, a bit eerie, but definitely
    spelling trouble. This is the sound of chatter that leaves nothing to imagination.
    Every machinist (CNC or conventional) will know that something is not right with
    the cutting tool performance. Even if the sound itself were tolerable, its results
    are not. Chatter leaves a poor surface finish on the part, mostly unacceptable,
    and negatively influences dimensional tolerances. Chatter also shortens the tool
    life, often quite dramatically. On a positive note, chatter can be generally controlled
    to the point of total elimination. Chatter during machining is a type of undesired
