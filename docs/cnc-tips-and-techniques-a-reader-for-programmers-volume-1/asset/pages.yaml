    # # Default Settings in Macros


    *July 2008, updated February 2013*


    In spite of the great advancement of CAM software, user macros (custom macros)
    continue their special place in CNC programming and their use is on the rise.
    They are used in addition to — *not as a replacement of* — manual, conversational,
    and computer assisted CNC programming. Macros are used to provide special solutions
    to special requirements. In simple terms, a macro is a type of subprogram with
    many added features, particularly its ability to manipulate variable data. Several
    control manufacturers, such as Fanuc, Okuma, Fadal, and others, offer macros either
    as a standard or an optional feature.


    Overall, Fanuc macros, called *Custom Macro B*, are the most widely used. The
    typical application in a program is to call a macro by its program number with
    preparatory command G65, followed by one or more arguments. An *argument* is a
    specific definition that is passed to the macro body. Different data in the arguments
    force the macro to behave differently, while fully under the programmer’s control.


    # ## Bolt Hole Circle Macro


    One of the classic examples of a macro is a *bolt hole circle* macro. There are
    many variations of this macro, but generally they share a minimum of two variable
    data: *bolt circle diameter* and the *number of holes*. This is the most basic
    requirement, but it does not make the macro very flexible. For example, the bolt
    circle has to be located at a certain XY coordinate position; the angular orientation
    of the bolt pattern may be specified in the drawing. If the additional data are
    not specified, the macro can only be used at one fixed XY position, for example
    X0Y0. Also, such a macro will have angular orientation fixed as well, usually
    at zero degrees. For many bolt holes, the two basic definitions may be sufficient.
    However, a well-developed macro should'
  merge: -1
  img_proc: true
- pgno: 182
  md: 'have flexible XY location as well as a flexible angular orientation built-in.


    As an example, take the following bolt pattern macro call (can be used for both
    metric and imperial dimensions):


    ```

    G65 P8500 X0 Y0 D49.0 H6 A0 S1

    ```


    The X and Y arguments (#24 and #25) are locations of the bolt circle center. Argument
    D (#7) is the bolt hole circle diameter, H (#11) is the number of equally spaced
    holes, A (#1) is the orientation angle measured from zero degrees. Adding the
    S (#19) argument, starting hole number can be changed and one or more initial
    holes skipped. In the parentheses are fixed variable numbers associated with each
    argument — they are part of the macro body. The G65 example shows a typical entry
    for most bolt holes. The slight disadvantage is that once the XY, A and S arguments
    become part of the macro, they have to be defined in the G65 statement. They have
    to be repeated from one macro call to another, even if they are always the same.
    *Unless...*


    … *unless they are defined as defaults.* Default in a macro program is a condition
    that will assume a certain value or amount without actually specifying it. In
    our case, we want to set X and Y arguments to zero (X0Y0), angular orientation
    at zero degrees (A0), and starting at the first hole of the pattern (S1). This
    can be achieved by a simple conditional test, using the **IF** function checked
    against existence of an argument. For example, if the X argument is missing, assume
    it is zero, and so on. Fanuc macros offer a special *null variable* identified
    as #0; this variable has no value, it is empty. A series of statements can be
    placed in the macro body that will check for existence of a particular variable,
    and if that variable if not defined in the argument list, macro will set it to
    the desired value. In order to allow other settings, a **GOTO** statement is used
    to bypass the default definitions. Here is a set of the four defaults:'
  merge: -1
  img_proc: true
- pgno: 183
  md: '```

    IF[# 24 NE # 0] GOTO10

    # 24 = 0 (if X is not defined, set X to X0)

    N10 IF[# 25 NE # 0] GOTO20

    # 25 = 0 (if Y is not defined, set Y to Y0)

    N20 IF[# 1 NE # 0] GOTO30

    # 1 = 0 (if A is not defined, set A to A0)

    N30 IF[# 19 NE # 0] GOTO40

    # 19 = 1 (if S is not defined, set S to S1)

    N40 ... (macro continues)

    ```


    If your control system supports the IF-THEN statement, the above blocks can be
    replaced with a shortened conditional testing:


    ```

    IF[# 24 NE # 0] THEN # 24 = 0 (if X is not defined, set X to X0)

    IF[# 25 NE # 0] THEN # 25 = 0 (if Y is not defined, set Y to Y0)

    IF[# 1 NE # 0] THEN # 1 = 0 (if A is not defined, set A to A0)

    IF[# 19 NE # 0] THEN # 19 = 1 (if S is not defined, set S to S1)

    ```


    In the following example, the XY center location is defined at a location other
    than zero and will override the macro default. On the other hand, A and S arguments
    are missing (null), and their respective defaults will be used:


    ```

    G65 P8500 X50.0 Y37.5 D49.0 H6

    ```


    For many bolt circle patterns, where the XY is a zero location as well, the macro
    call can be simplified further to:


    ```

    G65 P8500 D49.0 H6

    ```


    This method shows the power of using defaults in custom macros. See Appendix 2
    at the back of this book for a complete working macro listing and accompanying
    figure (Figure A2-1).'
  merge: -1
  img_proc: true
