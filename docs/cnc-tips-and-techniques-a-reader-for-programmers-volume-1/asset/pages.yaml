- pgno: 54
  md: '# Other Features


    Combining part geometry with the tools used creates an operation. Operations are
    treated as units — within a unit, an individual change will update the whole operation,
    for example, changing a tool diameter, spindle speed, or a cutting feedrate. There
    could be a number of special features included in CAM software. One that is very
    important is the support for various cycles for drilling, milling, turning, grooving,
    and threading. Such cycles make manual programming a lot simpler and less tedious;
    having support for them in the CAM software makes it easier at the machine to
    make small machining changes. Some CAM software offers an open architecture model.
    In plain words, it means that anybody with the required skills can write special
    utilities that can be accessed by the CAM software. The ability to add external
    features greatly adds to the power of the CAM software.


    # *Multi-Machine Support*


    Some machine tool manufacturers provide their own CAM software dedicated only
    to the CNC machines they make. Typical examples in this area are fabricating machines
    and some EDM machines. The software usually performs very well for the machine
    type supported, but it lacks flexibility to support other machines. It is quite
    suitable for a specialized shop, but not very practical for a shop that needs
    programming flexibility.


    Most CAM software is integrated software, which allows the part programmer to
    use it for several types of machine tools, typically mills, machining centers,
    and lathes. The major advantage of integrated CAM software is its flexibility.
    Additional benefits may be more practical but also important, for example, a similar
    interface for milling and turning shortens the programming time.'
  merge: -1
  img_proc: true
- pgno: 55
  md: '# # CNC Tips and Techniques


    # ## Text Editor


    In many respects (and professional opinions), the text editor that is supplied
    with most CAM software should be only a viewer — it should not be able to make
    changes to the program. Of course, such changes are made every day because it
    is an expedient way to fix a problem, usually a minor one. The program generated
    by CAM software should not need editing; that is the whole purpose of purchasing
    it in the first place. Yet, many part programmers choose to make small changes
    manually. In principle, it is a wrong approach. The problem may have been fixed,
    but the program database, the part model, has not changed at all. It still contains
    the error. In an environment when several users work with the program, this approach
    can cause major difficulties.


    At the same time, a text editor does have its own legitimate uses. For example,
    the editor can create and edit setup and tooling sheets, post processor templates,
    even configuration files. None of these applications will cause damage to the
    toolpath database. A text editor can also be used to print the program if hard
    copy is required.


    # ## CAD Connection


    A stand-alone CAM programming system does not require separate CAD software to
    define toolpath geometry. If a part drawing already exists (for example, if the
    customer delivers an Autocad drawing as a file), it is counterproductive to redraw
    the geometry. The CAM software should contain several built-in CAD conversion
    features. Autocad is still the leader in 2D drafting, and opens DWG drawings directly.
    DXF format is also available, but only suitable to translate basic entities. For
    3D design, quality CAM software should convert the most popular CAD systems, such
    as Solidworks, Inventor, Catia, and SolidEdge. Others are added frequently.'
  merge: -1
