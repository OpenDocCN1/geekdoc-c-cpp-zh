    # Mastering M-Functions


    *February 2006, updated February 2013*


    Every CNC program has them. They appear in the program at various places and they
    have a lot of potential and they certainly have a lot of power in the program.
    They are called *M-functions* — special program words beginning with the letter
    M. For many programmers, they are at the same level of importance as the venerable
    G-codes (preparatory commands). Yet, there is a difference in their applications.
    Whereas many preparatory commands are pretty much the same for the majority of
    control systems, the M-functions do not share this distinction as readily.


    # Defining M-functions


    M-functions are typically defined as *machine functions* or, more accurately,
    as *miscellaneous functions*. Their purpose in the program is two-fold. In one
    group, they control certain flow of the program, for example, functions such as
    M00 (program stop), M01 (optional program stop), and M30 (program end), as well
    as the subprogram related functions M98 and M99. The other group is much richer.
    It contains the true machine functions; they relate to the operation of various
    machine tool features and accessories. Their list can be quite long, depending
    on the machine type and design. Typical common functions of this group are those
    controlling coolant activity (M08, M09), spindle rotation (M03, M04, M05), tool
    change (M06), and many other standard machine-related functions. Virtually all
    CNC machining centers require these features and that makes these functions pretty
    consistent between controls.


    Also related to machine design are M-functions that are *unique* to a particular
    manufacturer, even if they serve the same purpose. For example, table clamp/unclamp
    functions for one horizontal machining center may be different from table clamp/unclamp
    functions of another horizontal machining center. Depending on the number of special
    features, some complex'
  merge: -1
  img_proc: true
- pgno: 88
  md: 'machining centers may have dozens or even hundreds of M-functions available;
    some even use three digits rather than the common two digits. Most of them are
    the ON/OFF type — active or inactive state. For these machines, the CNC programmer
    has only one resource, and that is the manufacturer’s documentation.


    # ### Programming Perspective


    From the programming perspective, miscellaneous functions are pretty flexible
    to work with. Two areas of focus are those M-functions that should be programmed
    in a separate block, with no other data, and the behavior of the function when
    programmed together with an axis motion. Some controls require program end functions
    (M02, M30, M99) to be in a block of their own. Even if such a rule does not apply,
    many programmers follow this format anyway because it makes the program easier
    to interpret. The same approach applies to M00 and M01 program stop functions.
    When it comes to functions that are machine oriented rather than program oriented,
    some significant differences should be expected. A typical example is the M06
    automatic tool change function. This function is often programmed together with
    the tool number, for example, T05 M06. Some controls accept the two commands together
    in the same block (regardless of their order). Others require the tool command
    in one block, followed by the tool change command in the next block.


    # ### Number of M-functions


    Another important feature is the number of M-functions in one block. Not many
    control systems allow more than a single M-function in one block. Others offer
    up to three such functions in a block, providing they are not in conflict with
    each other. The best strategy is to program only one M-function per block, to
    prevent possible syntax error at the machine. Such a strategy also makes the program
    more portable.'
  merge: -1
  img_proc: true
