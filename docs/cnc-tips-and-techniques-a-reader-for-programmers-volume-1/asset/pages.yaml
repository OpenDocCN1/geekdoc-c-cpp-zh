    # Threading with G76 Cycle — Basics


    *June 2009, updated February 2013*


    Threading on CNC lathes generally falls into two categories: it either works well,
    or it brings many problems. Of course these are extremes, but there is a general
    reasoning that if threading problems do happen, they are not always easy to resolve.
    This causes a production delay to be avoided altogether, or at least minimized.
    The actual cause of the problem has to be found first, before a possible treatment
    can be applied. Ideally, the threading program itself should anticipate such difficulties
    and should be perfect. Although the intent is good, the reality is'
  merge: -1
  img_proc: true
