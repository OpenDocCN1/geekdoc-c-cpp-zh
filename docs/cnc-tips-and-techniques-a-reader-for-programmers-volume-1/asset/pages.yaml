  img_proc: true
- pgno: 165
  md: 'be in effect before the tool reaches the material.


    Once you understand the differences between G96 and G97 commands, fine-tuning
    any lathe program with G50 or pre-calculated spindle speed should present no difficulties.


    ![](img/0023bd5cc50494e6d7799ab76d437c8d_165_0.png)


    # # Live Tooling on CNC Lathes


    *February 2008, updated February 2013*


    In the early days of numerical control, two-axis lathes and three-axis machining
    centers were the main production machines of many shops. Quite a lot has changed
    since then and the CNC lathes today are much different than ever before.


    # ## Advances in Machining Technology


    True, the standard two-axis lathe is still around for traditional work, and for
    general round and conical machining. This original concept has been maintained,
    but new features have been added to it. In the late 1980s, several machine tool
    manufacturers added a simple milling and drilling capability to their lathes,
    allowing a completion of simple parts in one setup. These additional tools had
    to work under their own power — they had to be power driven or live when the lathe
    main spindle was stationary. The term live tooling was born and collectively describes
    all non-turning tools. Machines using this technology are often called turn-mill
    machines.


    Over the last 25 years, machining technology has advanced dramatically. It became
    possible to design CNC lathes capable of many very complex machining processes.
    Live tooling is the first step towards multi-process machining — combinations
    of various turning and milling applications, multiple turrets and chucks, sub-spindles,
    automated part reversal and transfer plus many other features.'
  merge: -1
  img_proc: true
- pgno: 166
  md: 'For CNC programmers, knowledge of the various designs is very important, as
    programming will somewhat vary. Most common live tools used are tools to machine
    holes and end mills for milling operations. On slant bed type lathes, the live
    tools can be mounted parallel with, or perpendicular to, the machine centerline.
    That means machining can be completed on the part face or its circumference. The
    standard XZ motion is supplemented by a third motion: the C-axis. The C-axis controls
    spindle rotation in degrees when live tools are used. Normal spindle rotation
    in revolutions per minute is used for standard turning, boring, and related operations.
    The main purpose of the C-axis is to rotate the main spindle in direct relationship
    with the motions of live tools.


    A number of miscellaneous functions (M-functions) are used with the C-axis and
    they are not always consistent between manufacturers. M-functions control rotation
    of the main spindle as well as rotation of the driven tool. A pair of M-functions
    controls whether the main spindle is ON or OFF. Although some machines may lock
    the C-axis automatically, others require another pair of M-functions. These functions
    and others are machine specific and manufacturers list them in their machine documentation.


    # A Major Restriction


    Working with XZ+C axes has one major restriction. Drilling, reaming, tapping,
    simple slot machining, etc. can be completed successfully; however, the location
    of the holes or slots must be on the plane that intersects the machine centerline.
    Using slotting as an example, only a slot corresponding to the width of the end
    mill can be machined. When the C-axis is supplemented with another axis (the Y-axis),
    drilling and milling operations can be completed off machine centerline, greatly
    enhancing machining flexibility. Y-axis is factory installed in addition to the
    XZ+C axes. Its motion, which is perpendicular to both X and Z axes, is similar
    to a typical CNC vertical machining center.'
  merge: -1
  img_proc: true
- pgno: 167
  md: <!-- no content -->
  merge: -1
  img_proc: true
- pgno: 168
  md: 'be confused with Polar Coordinate Interpolation.


    In cylindrical interpolation, the C-axis can also be used together with the Z-axis
    to program a continuous contour tool-path. This method provides synchronized motion
    of the linear Z-axis with C-axis part rotation. The most common application for
    this type of machining is cylindrical grooving.


    This brief overview touched upon only some of the manual programming methods that
    can be used with C and Y axes. For more complex parts (especially contours), using
    a suitable CAM software is much more efficient.


    ![](img/0023bd5cc50494e6d7799ab76d437c8d_168_0.png)


    # ## Trial Cut for Measuring


    *March 2008, updated February 2013*


    Precision CNC machining is always a cooperative effort between CNC programmers
    and CNC machine operators. Programmers can employ certain program features that
    will enable the machine operators to perform functions that would otherwise be
    difficult or even impossible. One such method is programming a trial cut for measuring.


    There are many factors in machining that influence the final size of a part, such
    as heat, tool deflection, tool wear, and even lubrication to some extent. For
    those parts that require very tight tolerances, the negative effect of these factors
    may result in an out of tolerance size and even a possible scrap. Another problem
    that is quite common is machining certain hard-to-measure shapes, such as a cone
    on CNC lathes. By using a simple programming method known as the trial cut, CNC
    programmers can greatly influence the final size of a part.


    # ### Measuring Cones


    Take the already mentioned cone as an example. Without a suitable custom gauge,
    a cone is a difficult shape to measure at the machine, as there is no flat spot
    for the micrometer to use.'
  merge: -1
  img_proc: true
- pgno: 169
  md: 'Even if such a special gauge is available, it will be too late to find out
    that the cone is out of tolerance. The method of using a trial cut is to provide
    a special flat area (diameter) that can be easily measured, before the final cone
    is machined, following a few simple rules.


    Normally, a cone machined from round stock, such as the 5.0 inch diameter used
    in the following example, will include G71 roughing cycle and G70 finishing cycle
    in the part program:


    ```

    N1 G20 T0100 (ROUGHING TOOL)

    N2 G96 S300 M03 (CUTTING SPEED)

    N3 G42 G00 X5.2 Z0.1 T0101 M08 (START POINT FOR CYCLE)

    N4 G71 U0.15 R0.025

    N5 G71 P6 Q8 U0.07 W0.02 F0.015

    N6 G00 X2.8 (CONE START)

    N7 G01 X4.6 Z-3.5 F0.008 (CONE END)

    N8 U0.2 (RETRACT FROM PART)

    N9 G40 G00 X10.0 Z4.0 T0100 (CLEAR POSITION)

    N10 M01


    N11 T0300 (FINISHING TOOL)

    N12 G96 S500 M03 (CUTTING SPEED)

    N13 G42 G00 X5.2 Z0.1 T0303 M08 (START POINT FOR CYCLE)

    N14 G70 P6 Q8

    N15 G40 G00 X10.0 Z4.0 T0300 (CLEAR POSITION)

    N16 M30

    %

    ```


    Although correct, the program above does not offer any means to measure the conical
    part efficiently. By adding several blocks of trial cut in the program and using
    the finishing tool (T03), a suitable straight cut can be machined first.


    When measured, various offsets can be adjusted as necessary — all this is done
    before any roughing cuts take place.'
  merge: -1
  img_proc: true
- pgno: 170
  md: '```

    ```text

    / N1 G20 T0300 (FINISHING TOOL)

    / N2 G96 S500 M03 (CUTTING SPEED)

    / N3 G42 G00 X5.2 Z0.1 T0303 M08 (INITIAL POSITION)

    / N4 X4.925 (DIAMETER TO BE MEASURED)

    / N5 G01 Z-0.35 F0.008 (LENGTH OF CUT FOR MEASURING)

    / N6 U0.2 (RETRACT)

    / N7 G40 G00 X10.0 Z4.0 T0300 (CLEAR POSITION)

    / N8 M00 (MEASURE DIAMETER - MUST BE 4.925)


    N9 G20 T0100 (ROUGHING TOOL)

    N10 G96 S300 M03 (CUTTING SPEED)

    N11 G42 G00 X5.2 Z0.1 T0101 M08 (START POINT FOR CYCLE)

    N12 G71 U0.15 R0.025

    N13 G71 P14 Q16 U0.07 W0.02 F0.015

    N14 G00 X2.8 (CONE START)

    N15 G01 X4.6 Z-3.5 F0.008 (CONE END)

    N16 U0.2 (RETRACT FROM PART)

    N17 G40 G00 X10.0 Z4.0 T0100 (CLEAR POSITION)

    N18 M01


    N19 T0300 (FINISHING TOOL)

    N20 G96 S500 M03

    N21 G42 G00 X5.2 Z0.1 T0303 M08 (START POINT FOR CYCLE)

    N22 G70 P14 Q16

    N23 G40 G00 X10.0 Z4.0 T0300 (CLEAR POSITION)

    N24 M30

    %

    ```

    ```


    The first eight blocks are shown with a block skip function, represented by the
    / symbol. It is more likely that the actual measuring will not be required for
    each part. This approach to part programming is more efficient because it eliminates
    a re-cut and greatly enhances accuracy. Setting the block skip mode OFF, CNC operator
    checks the trial dimension (note the message attached to M00 program stop function),
    adjusts the suitable offset if necessary, and continues machining with block skip
    set ON. Note that the trial cut was made with the same tool that will be used
    for finishing.'
  merge: -1
  img_proc: true
- pgno: 171
  md: 'When selecting trial cut diameter, make sure the tool removes about the same
    amount of material that is removed in the finishing cut. In the example, the trial
    cut diameter is 4.925, resulting in the actual depth of cut (5.0 – 4.925) / 2
    = 0.0375 per side, which is almost equivalent to the amount of stock left for
    finishing: 0.07 / 2 = 0.035 per side. The length of such a cut should be sufficient
    for micrometer (0.35 in the example). Also, the machining speed and cutting feed
    rate should be the same for best results.


    The trial cut is a special cut performed on demand only. Although a lathe example
    has been presented here, trial cuts have many applications in milling operations
    as well. The main key is to identify the need first; then, provide a suitable
    program.


    ![](img/0023bd5cc50494e6d7799ab76d437c8d_171_0.png)


    # ## Easing Up on Calculations


    *April 2008, updated February 2013*


    In life, there are some inevitable facts we have to live with. In manual CNC programming,
    there are many as well, but one stands above them all — one that is often dreaded
    by new programmers and cursed by those more experienced — and that is math. A
    surprising number of students who attend various CNC courses are not aware that
    math (or to be more precise, mathematical calculations) is an integral part of
    being a CNC programmer who does not have an access to CAM-based software. This
    fear of math, or at least this apprehension of math, stands on a rather shaky
    ground. True, manual CNC programming does require calculations. Math is, of course,
    at the center of such calculations. As a scientific subject, the field of mathematics
    is colossal. Yet, in virtually every field, there is no need to know all math
    offers. In fact, math applications are always limited to a particular field, and
    it is up to the user to learn them and use them correctly.'
  merge: -1
  img_proc: true
- pgno: 172
  md: '# Arithmetic and Algebra


    CNC programming is no different. The inherent trepidation that somehow affects
    new programmers can be easily dissolved by better understanding of what part of
    the huge subject of mathematics is actually needed for every day work. To categorize
    math subjects as they relate to CNC programming is not difficult, as there not
    that many of them. First and foremost are actually two subjects, equally important:
    arithmetic and algebra. The word arithmetic sounds special, but there is nothing
    special about its meaning. Arithmetic is simply the part of mathematics that deals
    with the four basic functions of addition, subtraction, multiplication, and division.
    We all use these daily, without even thinking twice about them.


    Algebra is positioned a step higher, but it’s also very common in everyday life.
    Algebra involves working with some known values to find unknown values. This work
    is often expressed in formulas, where an unknown value can be calculated from
    some known values. A typical example of a simple algebraic function is the common
    conversion between inches and millimeters. If one inch = 25.4 mm, then two inches
    will be 2 x 25.4 = 50.8 mm. The formula is mm = inches x 25.4. This formula demonstrates
    algebra at its basic level.


    # Basic Formulas, Geometry, and Trigonometry


    In CNC programming, you frequently work with only one or two dozen basic formulas.
    They relate to calculations of spindle speeds, feed rates, cutting time, threading
    data, etc. They also relate to some geometry calculations, for example, calculations
    of tapers. Special situations require special formulas, but not necessarily more
    difficult formulas.


    Not all geometry calculations can be made with algebraic functions, and that is
    where the third level of math comes in: geometric calculations. This area of math
    is huge by itself, but in CNC programming, only a very small part is required.
    This part includes the basic trigonometry needed to solve right angle tri-'
  merge: -1
  img_proc: true
- pgno: 173
  md: 'angles. Add to it related subjects such as the Pythagorean Theorem and the
    Law of Similar Triangles, and you have just covered virtually all calculations
    needed for programming standard mills, machining centers, and lathes.


    Not that long ago, a scientific pocket calculator was about the only aid available
    to CNC programmers. Although the need for a calculator has not changed in many
    cases, it is far from being the only aid. In fact, there are many other resources
    that assist with solving math related problems, even without a pocket calculator.
    A computer-based calculator is simple, but is accessible to anybody with a personal
    computer. Most major cutting tool companies provide on-line or downloadable software
    for calculating various cutting conditions, even complete solutions, for example,
    a thread milling software — and that software is usually free of charge. Of course,
    such software is geared towards a particular tooling brand, but in many cases
    it can be used for any brand.


    On a commercial level, if you have spreadsheet software such as Microsoft Excel,
    you can use it in many areas of CNC programming, including automation of tasks
    such as bolt hole circle calculations. Yes, it requires some development effort,
    but the time may be well spent. Several companies offer CNC specific software
    in the form of practical utilities, from editors to graphic back plotters. One
    software program that offers a ton of CNC utilities is the excellent, inexpensive,
    and very popular Machinist Toolbox by Tim Markoski. It not only removes any need
    for a pocket calculator but also provides a friendly graphical interface for hundreds
    of calculations and instant solutions in the area of CNC programming and machining.


    Not every small shop can afford CAM software and not every small shop may even
    need it. Manual programming may have its many disadvantages, but with computer-based
    software and many available utilities, the venerable pocket calculator does not
    have to do all the work it once did so gracefully.'
  merge: -1
  img_proc: true
- pgno: 174
  md: '# # Preventing Scrap with Offsets


    *May 2008, updated February 2013*


    ![](img/0023bd5cc50494e6d7799ab76d437c8d_174_0.png)


    The major goal of a CNC operator should always be to make any part to drawing
    specifications. At the same time, the operator should also make an effort to prevent
    making a scrap. It is not uncommon to scrap a few small pieces made of a long
    bar before making the perfect part. This leisurely approach often leads to complacency
    and may prove costly when the number of blank parts is fixed.


    # ## Methods for Preventing Scrap


    There are only a few reasons for scrap to happen in the first place. On the human
    side, it is either negligence or incompetence. On the machine side, it is a hardware
    or software failure. Needless to say, the human errors happen more often. There
    are several ways CNC programmers and operators can prevent a scrap. Some procedures
    have to be included in the program; others can be done at the machine directly.
    Programmers often include extra features in their programs that help to eliminate
    scrap. Typical methods are:


    +   - Providing a trial cut, using block skip function or some other method

    +   - Including *Program Stop/Optional Stop* functions M00/M01

    +   - Including messages or comments

    +   - Making a setup sheet with a sketch

    +   - Splitting a tool motion for single block operation

    +   - Programming sufficient clearances


    These are just some of the methods that can be built into the program to make
    it easier for the operators. CNC operators also have several ways to prevent a
    scrap created from any cause. They must identify a potential problem before it
    becomes a real problem. The first goal is to be able to interpret the program
    and know what it does. Mistakes made during tool or fixture setup are a common
    cause of scrap. Errors also happen during data'
  merge: -1
  img_proc: true
- pgno: 175
  md: 'entry into the control system. Placing the right settings into a wrong offset
    register is a quite common cause. Also common are errors related to decimal point
    entries, either as a missing decimal point or a decimal point in the wrong place.
    Even after a few parts have been machined successfully, scrap can happen when
    changing offsets or tools or inserts, and so on.


    # Measured Part Dimensions


    Even a verified program is no reason to decrease the operator’s attention. When
    working with offsets, there are ways to let them work for you. The following evaluations
    show how a measured part dimension influences the whole part and can be used for
    external or internal contours:


    For both external and internal contours, if the measured dimension is within tolerance,
    no action is necessary. An undersize external contour is a scrap; an oversize
    contour can be re-machined. An undersize internal contour can be re-machined;
    an oversize dimension is scrap.


    Considering these facts, the operator can take precautions by intentionally manipulating
    cutter radius offset. The following program does nothing more than makes an external
    contour to machine a small rectangle 75 x 50 mm with a 10 mm end mill:


    ```

    ~~~gcode

    N1 G21

    N2 T01 M06 (10 MM END MILL)

    N3 G90 G54 G00 X-7.0 Y-7.0 S1000 M03

    N4 G43 Z2.0 H01 M08

    N5 G01 Z-5.0 F500.0

    N6 G41 X0 D51

    N7 Y50.0 F150.0

    N8 X75.0

    N9 Y0

    N10 X-7.0

    N11 G40 G00 Y-7.0 M09

    N12 G91 G28 Z0 M05

    ~~~

    ```'
  merge: -1
  img_proc: true
- pgno: 176
  md: 'N13 M30

    %


    Assume tolerance on the 75 mm width to be tight, zero to 30 microns plus. Even
    with a brand new cutter, the width will be right on or slightly under. The width
    may be larger, too. Rather than taking a chance, use the following procedure:


    +   1. Identify the normal offset value for D51.

    +   2. Estimate the amount of possible error.

    +   3. Temporarily increase the offset.

    +   4. Cut, then measure and adjust offset.


    Here are the details. For *Item 1*, the answer is 5.000 mm for a 10 mm end mill.
    *Item 2* needs special attention so the estimate is good. Tool quality is important
    — a new cutter should be within 10–15 microns. Consider this for *Item 3*: changing
    the offset, so the part will be wider than 15 microns. If stock size allows, you
    may go with 200 microns on the width. What will the temporary offset setting be?


    From the original evaluation, a larger external width can be re-cut to final size.
    It means adding stock to the tool path by increasing offset from 5.000, but to
    what? Achieving the goal of width that is 200 microns larger means only 100 microns
    per side! The offset has to be set to 5.100, not 5.200! Upon completion of *Item
    3*, D51 setting will contain a temporary 5.100 mm offset.


    Next is *Item 4*. When the cutting is completed, measure the 75 mm width. It can
    be exactly 75.2 mm, or it can be larger or smaller. Even if the width is undersize,
    it still should be greater than the 75.03 maximum. If it is not, you made a mistake
    in *Item 2* — estimating the error amount. Let’s look at the outcomes and offset
    adjustments, but first you have to decide what the final width should be, for
    example, the middle 75.015 width. Measured sizes are only examples found on the
    next page:'
  merge: -1
  img_proc: true
- pgno: 177
  md: '**ON SIZE** result = 75.200 = (75.015 − 75.200) / 2 = −0.0925.


    Use 0.093 to match three decimal places. Subtract 0.093 from the current setting
    of the offset 51: 5.100 − 0.093 = 5.007 as the final D51 setting.


    **OVERSIZE** result = 75.243 = (75.015 − 75.243) / 2 = −0.114, and 5.100 − 0.114
    = 4.986 as the final D51 setting.


    **UNDERSIZE** result = 75.185 = (75.015 − 75.185) / 2 = −0.085, and 5.100 − 0.085
    = 5.015 as the final D51 setting.


    One lesson can be learned. Establishing the final offset amount is the same, regardless
    of the actual size of the test measurement. The ultimate goal should be to eliminate
    scrap, not to minimize it.


    ![](img/0023bd5cc50494e6d7799ab76d437c8d_177_0.png)


    # Interpreting a CNC Program


    *June 2008, updated February 2013*


    The ability of CNC operators to interpret a part program is one of their most
    important skills. Unfortunately, it also happens that not every program reaching
    the floor is flawless. Programming errors do happen, and it is often up to the
    operator to find them and even debug them. Being able to interpret the program
    *(even without a drawing)* is the first step of being able to fix the errors,
    if necessary. Take a look at this example, which has no errors:


    ```

    O1001 (ELEVATION PLATE)

    N1 G21

    N2 G17 G40 G80 T07 (T7 = 12.7 MM DIA SPOT DRILL)

    N3 M06

    N4 G90 G54 G00 X20.0 Y60.0 S900 M03 T10

    ```'
  merge: -1
  img_proc: true
- pgno: 178
  md: '```

    ```

    N5 G43 Z25.0 H07 M08

    N6 G99 G82 R2.0 Z-2.6 P200 F200.0 (0.35x45 CHAMFER)

    N7 X30.0 Y100.0

    N8 X100.0

    N9 Y60.0

    N10 G80 Z25.0 M09

    N11 G28 Z25.0 M05

    N12 M01

    ```

    ```


    When evaluating a part program, some information is included in the comments,
    for example, the part name. Less obvious is the size of the tool used for this
    operation — here, it is a half-inch spot drill, converted to millimeters. This
    method is a common one in many machine shops, where a metric part uses imperial
    tools. What else can be gathered from the program?


    # ## Units


    For any job, it is always important to know the dimensional units. In a shop that
    works with both metric and imperial units, there are two methods to find out which
    one is active. One is by the program codes G20 (inch) or G21 (metric). Another
    method is to find out at the control, usually under Settings. With G21 in block
    N1, this example is in metric units.


    # ## Type of Operation


    CNC operator should be able to find out what *type of operation* is taking place
    from the program itself. Prevailing use of G01, G02, and G03 commands suggests
    a contour or a pocket machining. Using *XYZ* axes in G01 mode for most of the
    tool suggests 3D machining. For holes, various fixed cycles are used, such as
    the G82 cycle in the example for spot drilling. Also associated with fixed cycles
    are retract commands G98 and G99. Spot drilling can be further identified by a
    rather shallow cutting depth, dwell (P), and the existence of a *drill* as the
    next tool in the program.'
  merge: -1
  img_proc: true
- pgno: 179
  md: '# ## Speeds and Feeds


    For a safe machining operation, identifying the spindle speeds and cutting feedrates
    in the program helps to make intelligent decisions when using spindle and feedrate
    overrides, particularly for the initial part. As an operator, keep in mind that
    even the most experienced programmer may not always be exact with speeds and feeds.
    In fact, optimizing speeds and feeds at the machine is often one of the most important
    functions of a CNC operator.


    This example uses one spindle speed of 900 rpm (S900) and one feedrate of 200
    mm/min (about 8 ipm). Some milling jobs may have two or more feedrates applied
    to the same tool.


    Spindle rotation is also important. When interpreting a part program, three M-functions
    relate to spindle rotation: M03 (CW), M04 (CCW), and M05 (spindle stop). M03 is
    the standard rotation for right hand tools whereas M04 is used for left hand tools.


    # ## Tool Numbers


    Many errors at the machine happen because of wrong tool selection. In the example,
    the tool number is identified by the address T. Its meaning is determined by the
    type of automatic tool changer (ATC). For the fixed type ATC, each tool returns
    to the same magazine pocket it came from; the address T indicates both the pocket
    number and the tool number. In case of the more common random type ATC, the address
    T identifies the tool to be used next.


    There are two T addresses in the ex.: one in block N2 (T07) and the other in block
    N4 (T10). Note that the block N3 contains ATC function M06. Once the tool change
    has been completed, the control searches for T10 to be ready in the magazine.
    To interpret these three blocks, T07 means get tool number 7 ready for tool change,
    M06 means get T07 to the spindle, and T10 means get the next tool T10 ready. Having
    the next tool ready is one of the greatest advantages of the random type automatic
    tool changer.'
  merge: -1
  img_proc: true
- pgno: 180
  md: '# ## Dwell Time


    Once a dwell is identified in the program — *P250 in block N6* — make sure you
    understand the reason for the dwell. Generally, pay special attention to dwells
    longer than one half of a second. Longer dwells are not necessarily a waste of
    time, if used properly. A long dwell is often programmed to make sure a certain
    mechanical function of the CNC machine is fully completed before program processing
    continues. For example, activities such as clamping and unclamping, automatic
    door closing, delay due to acceleration, tailstock application, and others, benefit
    from longer dwells. In these cases, you should *never* change the dwell time.
    For machining, the dwell time change (usually a reduction) is quite often justified.


    Start with minimum dwell calculation (60 / rpm). Minimum dwell is the time required
    to complete one spindle revolution. In the example, 60 / 900 = 0.067 seconds,
    67 ms (milliseconds), is the minimum dwell. Programmers often double or triple
    the minimum dwell to allow for the possibility that spindle speed override is
    set to 50% (minimum override). P200 in block N6 allows fewer than three revolutions
    while the dwell is in effect.


    Other discoveries can be made by careful interpretation of the program.


    Now, a challenge question: Can you tell the *diameter* of the drill that follows
    the spot drill? No other tools will be used. See the answer and explanation in
    Appendix 1 at the end of this book.'
