  md: '![](img/0023bd5cc50494e6d7799ab76d437c8d_20_0.png)


    # CNC Turning —

    Why Are There So Many Errors?


    *January 2004, updated February 2013*


    Even in this era of CAD/CAM, many of the part programs that are available for
    two-axis CNC lathes are still developed manually. There is a good reason why.
    Purchasing a CAD/CAM system just for a lathe may not be the primary choice of
    many managers. Modern CNC lathes offer many time-saving features. For example,
    all centerline operations — such as drilling, reaming, and tapping — are simple
    point-to-point motions. Lengthy turning and boring cuts can be dramatically shortened
    by the use of very powerful machining cycles. Special cycles are also available
    for external and internal threading operations, even for machining castings and
    for simple grooving.


    Yet, with all these programming tools at our disposal, many lathe programs suffer
    from a number of errors. It is not unusual to see frustrated CNC operators frantically
    changing programs at the machine, at a great cost to productivity. Why do so many
    lathe programs suffer this fate?


    When I talk to programmers and operators, I get many opinions but seldom real
    answers. All it takes is a careful look at many of their lathe programs to see
    that the same type of error appears over and over again. Let’s look at them in
    groups, with some views on what can be done to prevent them:


    # Calculation Errors


    For all their power and simplicity, no lathe cycle will provide calculations of
    the contour points. When an error is evaluated, typically the programmer either
    “guessed” or miscalculated. Brushing up on trigonometry is the first step toward
    improvement in this area. Of all the math subjects, trigonometry is relatively
    the highest knowledge programmer should possess. I know a few programmers who
    avoid this obstacle by asking their engineers to give them the contour points
    from Autocad or some other program.'
  merge: -1
  img_proc: true
- pgno: 21
  md: 'Other types of calculation errors are accumulated ones caused by incorrect
    rounding. To avoid this problem, round only the final result — not the intermediate
    calculations. Many calculations can be confirmed by selecting a different mathematical
    approach.


    # Syntax Errors


    Syntax errors often occur when the pesky letters O is used instead of the digit
    0. These Os are the illegal characters that somehow find their way into the program.
    For example, the letter Y is not available on a two-axis CNC lathe. Fortunately,
    the control system will identify these errors.


    # Logical errors


    Watch very carefully for logical errors because the control system has no means
    to discover them. For example, a missing decimal point or a negative sign will
    give a totally new meaning to the programmed dimension. X1 is not the same as
    X1.0, and Z1.0 is not the same as Z-1.0.


    # Program Errors


    Program errors that are fairly frequent are often those that can cause severe
    collisions. Making a tool change inside of a hole is one such error. Others include
    wrong tool or offset selection, excessive spindle speed or feedrate, selection
    of tool change position, and many others.


    # Offset errors


    This area is a fertile ground for many frustrations. In my experience, errors
    relating to the tool nose radius are at the top of this group. If a tool nose
    radius error is detected by the control system, the cause of this error is always
    the same — the programmed radius cannot fit into the area provided. This group
    also represents errors that may be the hardest to identify. Always'
  merge: -1
  img_proc: true
- pgno: 22
  md: 'check the offset settings. If the settings are correct, the program itself
    is at fault. This error often occurs when the tool nose radius is larger than
    an inside arc of the contour. It also occurs because of insufficient clearances.
    Because the most common tool nose radii are 1/64 (0.4 mm), 1/32 (0.8 mm) and 3/64
    (1.2 mm), always provide a clearance that is at least twice the largest radius.
    Typically, 0.100 inches or 2.5 mm is sufficient as the minimum clearance. Keep
    in mind that this is per side, not on diameter.


    # Setup Errors


    Setup errors are strictly the domain of the CNC lathe operator. Check all tools
    by running the program while the chuck is empty. Are there sufficient clearances?
    Can the tools index safely? Is the tailstock out of the way? Provide a sufficient
    grip of the workpiece in the chuck, then watch for the boring bar to exit from
    a hole safely. Running the first part in a dry run and single block modes may
    save the day.


    # Correcting Errors


    This area deserves special mention. Many operators fail to identify the actual
    cause of an error. For example, if a drill does not provide the expected depth,
    is the programmed depth correct? Is the offset set correctly? Is it even possible
    that the drill was pushed slightly into the holder? Identifying the real cause
    of a problem is the first step towards its elimination.


    I hope by reviewing some of the common errors found in many programs for CNC lathes
    that you can look at your own programs and see them in a much different light.'
  merge: -1
  img_proc: true
- pgno: 23
  md: '![](img/0023bd5cc50494e6d7799ab76d437c8d_23_0.png)


    # # Why Should I Know Manual Programming?


    *February 2004, updated February 2013*


    In older days, most CNC programs were developed manually, using simple common
    and everyday aids — pocket calculator, pencil, paper, and the proverbial five-pound
    eraser. Combine this human effort with punched tapes and some extra hardware,
    and you have what seems today a history long past. The tape is gone today, and
    even though many programmers still sharpen their pencils and purchase new erasers,
    the times have clearly changed in favor of computer-based programming, or CAM
    programming. True, CNC programming using personal computers started in the mid-1980s,
    but initial costs, the state of computer technology, long learning curves, and
    a lack of features prevented their wide usage for some time.


    Using CNC software to make part programs is not a novelty. Feature rich software
    from a number of vendors offer the whole gamut of options — from entry level 2D
    to sophisticated 3D, solids, multi-axis machining, and multi-tasking — all available
    for desktop and laptop computers. Public and private institutions offer many training
    programs in this area, often in addition to standard CNC programming courses.


    This brings up the ever more important question that many students ask: “*Why
    should I know manual programming, when I am learning Mastercam?*” Of course, there
    is software available other than Mastercam, but the question raises a good point.
    I wish I had a dollar for every time this question pops up in conversation or
    during a training session. So what gives?


    Every CNC programmer has to possess certain skills. One skill I consider the most
    important is the *ability to machine a part*. Deciding on the best setup, selecting
    the most suitable tools, and creating safe and efficient machining operations
    is the *core skill* of any successful CNC programmer. The actual method of programming
    has nothing to do with it. Computers cannot make intelligent decisions.'
  merge: -1
  img_proc: true
- pgno: 24
  md: <!-- no content -->
  merge: -1
  img_proc: true
- pgno: 25
  md: '# Reason 4 – Do You MDI?


    Any operator who sets up a CNC machine has to perform many pre-machining activities,
    for example, make tool changes, set tools, activate the spindle, orient it, move
    the table by a certain distance, check a position, and so on. Even with many switches
    on the panel, one of the best methods is to use the *Manual Data Input* feature
    of the control — the MDI. This feature allows you to input and execute data at
    the control on a temporary basis. The data is always provided in the program format
    of that control. You cannot use the *MDI* feature if you do not understand at
    least the basics of manual programming.


    # Reason 5 – Learning from others


    A part program printed on paper does not teach programming or machining methods,
    yet there is so much to learn from programs that have already been verified. How
    many of us started our careers by adapting existing programs to our own? A part
    program that works well offers tremendous opportunity for study and learning.
    Of course, one has to be able to read such programs — *to interpret them* — and
    that means being able to understand the G-codes and M-functions, the program format
    and structure, offsets, modes, and the many addresses and their subtle meanings.


    Of course, one has to be *willing* to learn. When you just look at a part program,
    without understanding it, without being able to interpret it, do you care? Does
    it bother you? Do you feel you want to know more? If the answer is “yes”, you
    are on the way of becoming a better programmer or operator — a true professional.
    But that is reason number six, and I only promised five.'
  merge: -1
  img_proc: true
