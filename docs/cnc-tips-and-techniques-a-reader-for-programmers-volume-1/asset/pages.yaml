    # ## The “Other” Work Offset


    *February 2007, updated February 2013*


    A great majority of CNC programmers and machine operators are familiar with the
    work offset G54 (or the whole set of six work offsets G54 to G59 and beyond).
    Work offset in the program is used for one purpose only — to establish the location
    of part zero (program zero), which provides easier programming and operation.
    The programming side is easy. All you have to do is to include at least one work
    offset in the program (usually G54), then program all coordinates from the selected
    program zero. It is the CNC operators who have to prepare all the actual settings
    at the machine, particularly during setup. Operators may also adjust offsets during
    the production run, if necessary.


    # ### Basics of Work Offset


    Let’s look briefly at some basics. Work offset is the distance along each axis,
    typically along the X and Y axes only, measured from machine zero to part zero.
    Although the Z-axis can be included as well, in most applications it is set to
    zero, and handled by another type of offset (the tool length offset, G43 H). The
    reason is that each tool has a different length. Tool length offsets work exactly
    like work offsets, but for the Z-axis only. A part program may also include the
    cutter radius offset, using the G41/G42 command with a D-offset. For our purposes
    here, any reference to G41/G42 will be brief. Instead, the emphasis will be on
    the work and tool length offsets only because they are more'
  merge: -1
  img_proc: true
- pgno: 128
  md: 'directly related. In order to understand these two offset groups, it is important
    to understand how they are stored in the control.


    # ### Tool Length Offset


    Work offset has its own data entry screen, and so does a tool length offset. On
    most control systems, the tool length offset registry is shared with the cutter
    radius offset. That means the program cannot use the same offset number for the
    H-address as it does for the D-address. Programmers typically add an arbitrary
    number to the D-offset, based on the tool number. For example, tool T06 may use
    G43 H06 or G41 D56. Higher level controls may have geometry and wear offsets separate
    from each other.


    Regardless of which type of offset memory the control system has, the end results
    will always be the same. In a typical application, each tool will have one length
    offset that controls the Z-axis (cutting depth). If the depth for a particular
    tool needs adjustment or fine tuning, the operator changes the tool length offset
    for that tool only.


    # ### Changing Length Offsets


    Now, let’s look at a fairly common situation where all length offsets have to
    be changed by the same amount. This can happen, for instance, when supporting
    parallels in a vise are changed after the initial setup. The least efficient method
    is to adjust each tool length offset individually. A better way is to adjust them
    all at the same time by changing the Z-setting in the work offset, which is normally
    Z0.000. For example, if each offset needs adjustment by 0.5 mm in positive direction,
    the Z-setting will be Z0.500. The question is which Z-setting?


    # ### The G54 Command


    Work offset using the G54 command is the most common for the simple reason that
    it is first on the screen, and also a default in many cases. If a particular program
    uses G54 only, the Z0.500 should be set in the G54 screen. What about the other'
  merge: -1
  img_proc: true
- pgno: 129
  md: 'work offsets? If there is also work offset G55 to G59 in the program and the
    0.5 mm change applies to all offsets used, then the Z-setting of all work offsets
    used in the program has to be changed to Z0.500. Of course, the same applies to
    any additional work offset in the range of G54 P1 to G54 P48. Theoretically, up
    to 54 work offsets (6 standard + 48 additional) may require the Z-setting change.
    Although it is extremely unlikely you would ever face such a situation, changing
    more than one offset is not necessary, providing the change is uniform for all
    offsets programmed. The question of which Z-setting to change must be answered
    again.


    # Common or External Offset


    Fanuc and similar controls offer another offset. This one does not have any number;
    in fact, it is not even programmable, at least not through normal methods. This
    other offset is called the common or external offset. It is usually located to
    the left of the G54 offset screen and is identified either as COM (common) or
    EXT (external). Older controls used the COM identification, which was later changed
    to EXT, to avoid misunderstanding with COM, meaning communication. If the operator
    enters Z0.500 in the external work offset, it will affect all tools and all work
    offsets with a single common setting.


    Using this external offset feature does not replace any adjustment of individual
    offsets, whether related to work coordinate system (work offsets) or tool length
    offsets. Also, this other offset has no influence at all on cutter radius offset.
    If you have to make a global change for all offsets, the other offset could well
    be the one to use.'
  merge: -1
