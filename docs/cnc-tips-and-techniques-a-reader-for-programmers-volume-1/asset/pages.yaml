  img_proc: true
- pgno: 75
  md: 'sible problem encountered in machining a large number of deep holes has to
    do with assignment of the Q-amount. Generally, we do not think in small increments,
    and the Q is more often than not just a reasonable number, generally based on
    experience. Consider the following reasonable G83 cycle used for 5/8 drill with
    0.87 peck depth, 4-7/8 part thickness, 0.06 breakthrough and 0.1875 drill point
    length (0.625 × 0.3). The programmed depth is 4.875 + 0.06 + 0.1875 = 5.1225:


    ```

    G99 G83 X.. Y.. R0.1 Z-5.1225 Q0.87 F10.0

    ```


    # Drilling Thousands of Holes


    The G83 cycle is necessary in this case to clean most of the chips out of the
    hole. This seems innocent enough; program data are definitely reasonable and,
    for a few holes, the program works well. Yet, it can be a costly piece of program
    code when, for example, 5000 holes are drilled. Let me do some math here.


    To calculate the number of pecks, the control system divides the programmed pecking
    depth of Q0.87 into the total travel between R0.1 and Z-5.1225, a distance of
    5.2225. This distance, when divided by 0.87, calculates 6.003 pecks, which in
    reality means seven pecks, as the control does not allow exceeding the Q-amount.
    That means six pecks will be done at 0.87 each, resulting in only 5.22 total distance
    traveled. The remaining 0.0025 will be the actual depth of the last peck. Because
    cycle G83 is in effect, the drill has to travel up by 5.22 and back by almost
    the same amount, it makes about 10.4 inches of travel in the air per hole, just
    to cut 0.0025. In addition, this 0.0025 is below the part anyway and more air
    will be cut.


    Now, the costs. Take the 10.4 inches of extra non-cutting travel, multiply it
    by 5000 holes, and divide the result by the rapid travel of common 900 in/min
    rapid rate. The result is 57.8 minutes wasted, almost a full hour.


    The solution is very simple. Just change the Q0.87 to Q0.871 (or even a little
    higher), which will eliminate the last peck. This'
  merge: -1
  img_proc: true
- pgno: 76
  md: 'adjustment saves an hour of air cutting for every five thousand holes. Our
    master hole-maker would be pleased.


    # ## Alternate CNC Machine Selection


    *November 2005, updated February 2013*


    There was a time when having a single CNC machine on the floor gave a machine
    shop a somewhat privileged status amongst its peers, even among customers and
    competitors — a pleasurable mixture of awe and envy. Being the first one to be
    in a possession of the greatest and newest technological marvel is still considered
    hip and cool today, even if CNC technology as such is not that new anymore. It
    is quite common to find even small machine shops with several CNC machines, typically
    purchased over the period of several years.


    Of course, over several years, CNC technology has evolved in both the machine
    tool design and the control features. Having older and newer CNC machines working
    side by side presents several challenges. Apart from the standard scheduling challenges
    that apply to all machine tools in the shop, the CNC programmers and operators
    face challenges of their own.


    # ### Comparing CNC Machines


    This essay looks at techniques that can be adapted in the part program and/or
    at the machine control. For example, let’s use two similar CNC machining centers,
    *Machine A* and *Machine B*. They are both of similar capacity and features, so
    a certain job can be loaded on either machine. From a programming perspective,
    the major machine design considerations are the likely differences in the maximum
    spindle speeds and feedrates, capacity of the tool magazines, the tool change
    type, and spindle output ratings. Each directly influences the actual program
    development. Other possible differences, such as rapid travel rates, do not directly
    influence the programming method.'
  merge: -1
  img_proc: true
- pgno: 77
  md: 'On the other hand, the control features may be a lot more significant, particularly
    if *Machine A* has a different control make than *Machine B*. For example, Fanuc,
    Yasnac, and Haas controls are programmed in a similar way, but they also have
    their own differences. The programmer has to know *all* features of both controls
    and consider *all* control options available.


    Normally, a program is developed for a particular combination of machine and control.
    Being able to switch the job from *Machine A* to *Machine B* or vice versa for
    scheduling reasons, or if one machine is down, often means changing the program.
    Yet, for controls that belong to the same group (such as Fanuc, Yasnac, Haas,
    and many others), a program can be written in such a way that it reflects the
    common denominator of the machines and controls. It may not always be possible
    to switch machines without any program changes, but minimizing such changes goes
    a long way towards improvement in productivity.


    # ### Addressing Machine Differences


    To address the machine design differences in the program, some ideas may be worth
    considering. When assigning tool numbers and their corresponding offset numbers
    for commonly used tools, assign those numbers that are common to both machines,
    typically in the low numbers. If the top spindle speed is required, consider programming
    the top speed of the machine that has the *lower* maximum. The same will apply
    for feedrates, although maximum feedrate is not commonly programmed and should
    not be an issue. Random type and fixed type of automatic tool change can be resolved
    in program structure (see below). Special features unique to one machine only
    cannot be compromised.


    In programming structure, the first change may be right at the program beginning.
    When programming a startup block, its typical contents may be N1 G20 G17 G40 G18
    G49 or similar. Some controls require that the unit selection command G20 (or'
  merge: -1
  img_proc: true
- pgno: 78
  md: 'G21) is in a separate block. Placing the G20 or G21 in a block by itself will
    work for all types of controls.


    Similar structural change may reflect the tool change. Although it is customary
    to program **T02 M06**, for example, in the same block, some controls require
    that each command is in its own block. Again, using the two block method will
    always work. When using M-functions, most older controls only accept one in a
    block, newer controls may accept up to three. This convenience may work against
    the ability to select an alternate machine, so using a single M-function in a
    block provides a better program structure for that purpose.


    There are other programming tools, some not always available. The most typical
    of them are the block skip function (slash) common to all controls, and the macro
    feature that is optional on most controls. Using a block skip method can be very
    powerful, particularly if the control allows the slash code in the middle of the
    block. In that case, for example, programming **S5000 M03 / S6000** in the same
    block will rotate the spindle at 5000 rpm if block skip is *ON*, and 6000 rpm
    if the switch is *OFF*. Note that both controls must have this special feature.
    Also note the inclusion of M03 *in front* of the slash.


    Manipulating the program structure to achieve a certain result can be very useful.
    Ideally, programming for a single machine/control combination is preferred. Selecting
    an alternate machine because of an emergency will generally justify the changes
    required in the program. Selecting an alternate machine for scheduling reasons
    requires a certain compromise in programming and even machine setup. Understanding
    the possibilities will result in better decisions.'
  merge: -1
