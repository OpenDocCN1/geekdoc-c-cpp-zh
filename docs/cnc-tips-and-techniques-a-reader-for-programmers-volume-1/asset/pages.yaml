    # # Automatic Tool Change — ATC


    *June 2007, updated February 2013*


    When it comes to tool selection for a particular job, the main focus of many CNC
    programmers is to select the most suitable diameter for the job. At the same time,
    the type of tool material, such as HSS or carbide, is also given serious consideration,
    as well as the number of flutes or cutting inserts. There are other issues, equally
    important, that should be considered when selecting cutting tools. They relate
    to the tool maximum diameter, maximum length, and maximum weight, as specified
    by the machine builder. Our consideration here is the type of ATC (Automatic Tool
    Changer) a particular CNC mill or machining center supports.


    # ## Fixed-Access ATC


    Manufacturers of CNC mills and machining centers provide two types of ATC: fixed-access
    type and random-access type. In the fixed-access type, the tool number used in
    the program must match the pocket number of the tool magazine. At the machine,
    it means the tool returns to the magazine pocket it came from, before the magazine
    is ready for the next programmed tool. This method is slow and quite inefficient,
    particularly in a high-volume production environment, although it provides a lower
    cost alternative in a non-production shop. Programmers are aware of this design
    feature and try to improve cycle times by arranging the order of tools more efficiently
    in the magazine. In spite of even the best efforts, the non-productive tool change
    can still be quite long.


    # ## Random-Access ATC


    Most CNC machining centers offer much more advanced random-access tool changers
    as a standard feature. Their purpose is to minimize the tool change time, as it
    is impossible to eliminate it entirely. In this case, CNC programmers assign num-'
  merge: -1
  img_proc: true
- pgno: 140
  md: 'bers to all tools without thinking how they will be distributed in the magazine.
    Tool numbers in the program do not have to match the magazine pocket numbers.
    One major difference in the program relates to the tool address T. While the letter
    T identifies the address as a tool number, it should really identify it as the
    ready tool number. The difference is subtle, but important. When the T-address
    is processed by the control, it will position that tool to a special standby or
    ready position of the tool magazine. This position is physically aligned with
    the automatic tool changer. Let’s look at an example of a typical program start
    for the tool T01:


    ```

    N1 G20

    N2 G17 G40 G80 T01 (GET T01 READY)

    N3 M06 (ACTUAL TOOL CHANGE)

    N4 G90 G54 G00 X.. Y.. S.. M03 T02 (GET T02 READY)

    N5 G43 Z.. H.. M08

    ... <MACHINING WITH T01>

    N35 M01 (END OF T01)

    ```


    Block N2 calls T01. At that command, the tool magazine starts rotating until T01
    is located at the ready position. The tool change function M06 in block N3 will
    force the actual tool change between the current tool in the spindle (even if
    there is no physical tool) and the tool that is ready (waiting). This simple activity
    requires one very important step during tool setup. Because the CNC operator can
    place any tool to any magazine pocket (within reason), this additional setup step
    requires that each tool is registered in the control system memory. For example,
    T01 may be placed in magazine pocket number six and registered as such during
    initial setup; the control system will take care of the rest for as many parts
    as required. Even a non-existent tool in the spindle must be registered, usually
    as T99, for continuity. From this point on, no tool should be handled manually.
    Use the manual data input (MDI), if necessary, and pay attention'
  merge: -1
  img_proc: true
- pgno: 141
  md: 'to the empty tool.


    Some programmers prefer to combine the tool number with the tool change function
    in one block, for example, T01 M06. This is usually a matter of personal choice.
    There will be no difference in the actual tool change process or overall cycle
    time. My own preference is shown in the example. I prefer to split the tool number
    call (T01) and the tool change function call (M06) into two blocks. In automatic
    operation, there will not be any noticeable difference. During setup, when the
    operator often uses single block mode, this method provides time to check the
    tool in the magazine, before actual tool change.


    Now to the example block N4. This block represents a typical first motion of any
    tool. It sets the control system to absolute mode, selects work offset, and provides
    a rapid motion to the first part location. It is also a block where spindle speed
    and spindle rotation can be programmed. Adding the next tool call in the same
    block makes sense. It takes place after the tool change, so the tool is ready
    for the next tool change, even if the cycle time of the current tool is short.


    One other possible improvement in the area of tool programming is to repeat the
    next tool in the first block of the next tool, for example, the block N35 above
    will be followed by:


    ```

    ```

    ...

    N35 M01 (END OF T01)


    N36 T02 (GET T02 READY – IF NECESSARY)

    N37 M06 (ACTUAL TOOL CHANGE)

    N38 G90 G00 G54 ... T03 (GET T03 READY)

    ...

    ... <MACHINING WITH T02>

    ```

    ```


    This method has one benefit — any tool programmed can be called at any time, generally
    when a problem is encountered that requires a tool repetition. Some programmers
    use other methods, for example, special block numbers.'
  merge: -1
  img_proc: true
- pgno: 142
  md: <!-- no content -->
  merge: -1
  img_proc: true
- pgno: 143
  md: 'system as well, during the tool registration process. Programmers should always
    know the maximum tool diameter allowed, as well as the extended maximum diameter
    with empty adjacent pockets. Using an oversized tool diameter is mainly an issue
    confined to the part setup at the machine.


    # Maximum Tool Length


    By definition, machine manufacturers define maximum tool length as the actual
    tool extension from spindle face (gage line) to the tool tip. Such a distance
    is based on the actual machine dimensions and does not take into consideration
    any height of part or fixture located on the machine table. Again, for the reasons
    of safety and smooth operation, this distance should be known to the programmers,
    as well as the approximate height of the part setup. If the tool exceeds the maximum
    length only slightly, the programmers may decide to make the tool change in a
    particular safe position of the machine table, free of the part setup. Of course,
    the operator should be aware of this change from the normal, in order to keep
    this area clear. Additional test measurement at the machine is also recommended.
    Beyond the steps mentioned, there is not much programmers can do. As with an oversized
    tool diameter, it is mainly the operator’s responsibility to provide safe machining
    conditions.


    # Maximum Tool Weight


    Another machine specification provided by the manufacturer relates to the weight
    of the cutting tool. This weight relates to the automatic tool change, so it must
    always cover the combined weight of the tool holder, the pull-stud, the cutting
    tool itself, and any inserts and small hardware. Unlike with the maximum tool
    length, the program has no allowance for using a tool that exceeds this maximum
    weight only slightly. In fact, machine specifications do not include any heavier
    tool options at all. Well, perhaps there is one option to consider. Keep in mind
    that the maximum weight is specified for ATC only.'
  merge: -1
  img_proc: true
- pgno: 144
  md: 'In spite of the availability of automatic tool change, programmers can choose
    to program the tool change conventionally — yes, changing it manually. The subject
    is too complex to squeeze into a short column. However, the actual programming
    process is not overly difficult, but requires some programming experience and
    a good attention to detail. It also requires good judgment because a heavier tool
    in the spindle will influence maximum spindle speed.


    Changing the tool manually means the absence of both tool function T and ATC function
    M06 in the program. Instead, program end function M00 is used, with a suitable
    comment attached. CNC operators will place such a slightly heavier tool into the
    spindle manually, removing the current tool. The heavier tool will do all its
    work, and the program stops again. Now, the operators will reverse the process
    by removing the heavier tool and replacing it with the original tool. The program
    will continue normally from this point on.


    Assuming the part program is itself structured properly, it is important to realize
    that working with oversized tools is not recommended as a standard practice, but
    as an exception only. When oversize tools are used, they should be treated very
    carefully, by increased vigilance during programming and especially during setup.
    In one way or another, they do add precious seconds or even minutes to the cycle
    time and have safety related implications.


    ![](img/0023bd5cc50494e6d7799ab76d437c8d_144_0.png)


    # Control Features — Optional or Standard?


    *August 2007, updated February 2013*


    All CNC machines are made of two major parts: the machine proper and its control
    system (CNC unit). Although several machine builders offer their own controls
    (Okuma and Fadal come to mind), most manufacturers opt for a control independently
    made by Fanuc, Mitsubishi, Yasnac, or Siemens, to'
  merge: -1
  img_proc: true
- pgno: 145
  md: 'name just a few. In all cases, the control system is designed to support as
    many machines and machine features as possible. A well-designed, generic-type
    control system can be easily modified to support certain unique machine-related
    features and accessories, such as part catchers, pallets, rotary axes, rigid tapping,
    and special thread cutting. Control support is necessary for these accessories
    to function properly; proper control support is always included as a standard
    feature. On the other hand, what about features that are related to operations
    rather than the machine?


    # Helical Interpolation


    A good example is the helical interpolation feature. Its main application may
    be thread milling in many machine shops, but it can also be used for helical plunging
    into tough material (usually in pocketing) and for a variety of other purposes.
    Unfortunately, helical interpolation is not always a standard feature of the control
    system. A valid argument is, “Why should I pay for something I never use?”, Whether
    this feature should or should not be standard on all controls is for debate.


    # Polar Coordinates


    The whole picture is much clearer for another control feature (also a common special
    option on many controls) — polar coordinates. In my opinion, this very handy feature
    should be available on all controls, regardless of make, as a standard feature,
    never as an option. Polar coordinates beat rectangular system more often than
    not and are useful not just for machining bolt circles, but also for any holes
    located on an arc, even linear patterns of holes at a given angle. The best part
    is the holes do not even have to be equally spaced and no special fixed cycles
    are required. Although polar coordinates are very useful for machining holes,
    what about rotating a complete toolpath itself? It is relatively easy to program
    a rectangular pocket in orthogonal orientation, but try to program the same pocket
    at an angle,'
  merge: -1
  img_proc: true
- pgno: 146
  md: 'even at different angles. Such a process can be time consuming and prone to
    errors.


    # Coordinate Rotation


    Yet, the goal can be very easily achieved with, yes, another control option —
    coordinate rotation. A toolpath of virtually any shape can be stored as a subprogram.
    Then the subprogram can be rotated around a point by specified angle as many times
    as required using the coordinate rotation feature.


    This trio of control features — helical interpolation, polar coordinates, and
    coordinate rotation — does not require any custom macros (which is another option).
    Each can be purchased individually. They are relatively inexpensive, which raises
    the question of why they cannot be part of the standard features lineup. Although
    it would be desirable to have all features available on every control, it would
    also increase the overall costs of CNC machine, and in many cases, unnecessarily.
    There are options that should remain options; if you need them, have the vendor
    turn them on for a nominal cost. Let’s have a look at another trio, this time
    options that probably should remain options.


    # Other Options


    The first of the three is a scaling function. It allows an existing toolpath to
    be machined larger or smaller by a specified scaling factor. One common application
    is the so called built-in shrinkage factor, either in flat machining or 3D machining.
    Another common control system option is direct drawing dimension programming.
    Although available for quite some time, it has really never reached its potential
    among users; being an option has to do a lot with it. The concept is quite straightforward
    — to simplify manual programming by minimizing calculations done by hand. Angles,
    chamfers, radiuses, etc., can be input as direct parametric values; then the control
    system calculates the required contour endpoints. This option may be worth looking
    into, particularly if you still do a lot of manual programming.'
  merge: -1
  img_proc: true
- pgno: 147
  md: 'ming. Last but not least is the already mentioned custom macro. In rather basic
    terms, a macro is a subprogram that uses variable input data, rather than fixed
    data. Although this feature offers tremendous opportunities and possibilities
    in programming, its utilization requires additional programming skills and the
    right type of machining to harvest its many benefits.


    There are many other optional features that various control manufacturers offer
    to their customers. Take a look at them and see which ones you would like to become
    standard features. Is it reasonable to expect control manufacturers and vendors
    to include every current option as a standard feature? Not necessarily, but I
    strongly believe that at least the three options mentioned above should be provided
    as standard. After all, cutter radius offset used to be an optional feature as
    well at one time. Today, it’s hard to imagine a control that would not include
    this feature in the overall price. Strangely enough, it is still listed as an
    option in many promotional brochures.


    ![](img/0023bd5cc50494e6d7799ab76d437c8d_147_0.png)


    # Fixed Cycles Repetition


    *September 2007, updated February 2013*


    Using fixed cycles for many holes is one of the oldest programming shortcuts available.
    Cycles G81–G89, as well as G73, G74, and G76 are main staples of everyday programming.
    Every CNC programmer knows that common data can be programmed only once and only
    new data has to be entered for each hole — one hole equals one block of the program.


    # Spot Drilling


    Here is a sample program to spot drill a pattern of six holes:


    ```

    N1 G20 G17 G40 G80 T01 M06

    N2 G90 G00 G54 X1.0 Y1.25 S900 M03 T02

    N3 G43 H01 Z1.0 M08

    ```'
  merge: -1
  img_proc: true
- pgno: 148
  md: '```

    N4 G99 G82 R0.1 Z-0.14 P200 F5.0 (H1)

    N5 X2.0 (H2)

    N6 X3.0 (H3)

    N7 Y2.5 (H4)

    N8 X2.0 (H5)

    N9 X1.0 (H6)

    N9 G80 G28 Z1.0 M05

    N10 M01

    ```


    Spot drilling does not normally complete a hole, and there will be another tool
    or two applied to the same hole pattern. A classic application is spot drill,
    drill, and tap — three tools used for the same six holes. Although six holes do
    not present a problem, what about sixty or even six hundred holes? Is there a
    way to make further reductions in program length?


    # Reducing Program length


    In fact, there are two possible reductions available. Let’s look at the first
    one. This method may not always be usable, as it depends on the actual hole pattern
    itself. Is there any equal spacing between the holes? If the answer is yes, this
    shortcut can save a few — or a lot — of blocks. In the example, there is a spacing
    of 1 inch between holes along the X-axis. Using the repetitive function K (or
    L on some controls), the program can be changed to incremental mode and shortened:


    ```

    N1 G20 G17 G40 G80 T01 M06

    N2 G90 G00 G54 X1.0 Y1.25 S900 M03 T02

    N3 G43 H01 Z1.0 M08

    N4 G99 G82 R0.1 Z-0.14 P200 F5.0 (H1)

    N5 G91 X1.0 K2 (H2 - H3)

    N6 Y1.25 (H4)

    N7 X-1.0 K2 (H5 - H6)

    N8 G90 G80 G28 Z1.0 M05

    N9 M01

    ```'
  merge: -1
  img_proc: true
- pgno: 149
  md: 'Six holes do not show the true picture, just the general idea. Although only
    one tool is used, the other two tools would be virtually identical in structure
    — just a different cycle, speeds, and feeds.


    The second method is always available, regardless of the hole pattern. It can
    be combined with the first method, for an even shorter program. It involves writing
    a subprogram. A good programming approach is to include all six holes in the subprogram,
    not just the remaining five:


    ```

    O7000

    N101 G90 X1.0 Y1.25 (H1)

    N102 G91 X1.0 K2 (H2 - H3)

    N103 Y1.25 (H4)

    N104 X-1.0 K2 (H5 - H6)

    N105 M99

    ```


    How does this method change the structure of the main program? Block N4 will machine
    the first hole, regardless of which cycle is used. Because the first hole is included
    in the subprogram, it will be machined twice. This is not acceptable and some
    change in the program must be made. Fanuc and similar controls provide a very
    useful function for exactly this kind of situation: K0 or L0. Normally, the control
    system defaults to K1 or L1 — use it just once. Of course, K1 and L1 are not written
    in the program; they are assumed. What K0 or L0 does is quite simple. They will
    store the cycle data into the system memory, but they will not cut the hole at
    that location. The final version of the program (one tool only) is shown next:


    ```

    N1 G20 G17 G40 G80 T01 M06

    N2 G90 G00 G54 X1.0 Y1.25 S900 M03 T02

    N3 G43 H01 Z1.0 M08

    N4 M99 G82 R0.1 Z-0.14 P200 F5.0 K0 (NO HOLE)

    N5 M98 P7000 (H1 - H6)

    ```'
  merge: -1
  img_proc: true
- pgno: 150
  md: '```

    ```

    N6 G90 G80 G28 Z1.0 M05

    N7 M01

    ```

    ```


    Remember to switch to incremental mode. Otherwise, all repetitions will take place
    at the same location. Depending on the number of holes, these two methods can
    save literally hundreds of program blocks, making the final program easier to
    interpret, change, and store. If used properly, K0 (L0) can be a very powerful
    tool.


    ![](img/0023bd5cc50494e6d7799ab76d437c8d_150_0.png)


    # ## Programming Process —

    ## When Is It Completed?


    *October 2007, updated February 2013*


    Regardless of which type of CNC programming is used in a machine shop — manual
    or computer assisted — the basic programming process is generally the same. Start
    with the drawing; evaluate material; choose tools and setup, cutting conditions,
    and toolpath; and write the program. When a CNC program is fully completed and
    released to the machine shop for production, it seems that the programming process
    is over and the part programmers usually move on to another project. After all,
    calculations have been done, decisions have been made, the program has been written,
    it is well documented, and the program file is on the way to the CNC machine.
    Is the programmers’ job for such a part really finished? Is there some possibility
    that could bring the program back for some reason, perhaps with an operator’s
    comments, suggestions, or even some constructive criticism?


    # ### The Programmer’s Role


    Of course, if the part program works perfectly, without any changes, the programmers
    will usually not hear a word from any direction. On the other hand, the programmers
    will hear nega-'
  merge: -1
  img_proc: true
- pgno: 151
  md: 'tive comments and criticism from all directions. So, the question is: When
    is the programmer’s responsibility for a particular part really over? At what
    point in the manufacturing process can the programming results be evaluated? At
    what point can the program qualify as a very good (or even perfect) program?


    The most likely answer, and probably the fairest and most reasonable answer, would
    be whenever the part has been machined under the most optimized working conditions.
    This means that the programming responsibility does not end with the initial program
    and documentation delivery to the shop. The part program at this stage is still
    very much in the development process; it is unproven. It still has to be loaded
    to the CNC system. The machine has to be set up, cutting tools mounted and measured,
    and a variety of small jobs completed before the first part can be started. Then,
    the program has to be proven, possibly optimized. True, all these tasks are the
    sole responsibility of the CNC operators, so there is no need for the programmers
    to care what happens during machining, right? Not really.


    # Working with Operators


    CNC operators can only work with a program as provided; they can be expected to
    make only minor optimization changes, if necessary. All CNC programmers should
    make an effort to be in constant touch with the actual production team. A good
    comparison is with the field of complex business software development. In this
    environment, it is necessary to have a team of specialists working on a certain
    large programming project, where all individual parts have to fit together flawlessly.
    After all, most programming ideas are the result of talking to colleagues and
    the actual users of the program or particular software.


    The same is true for CNC programs used in machine shops. The actual users of part
    programs are typically CNC machine operators. They are directly involved in the
    actual production, and they provide a very deep gold mine of constructive ideas,
    improvements, and suggestions. Talk to them, ask questions,'
  merge: -1
  img_proc: true
- pgno: 152
  md: '# A Reader for Programmers


    provide suggestions, and — most important — listen to what they have to say. Programmers
    who never put their foot in the machine shop or who go there reluctantly are on
    the wrong track. The same is true for programmers who go to the machine shop with
    their eyes closed and their ears plugged, and programmers who take the attitude
    that they are always right.


    Exchanging ideas with CNC machine operators, asking questions, and seeking answers
    is the only way to be fully informed about what is actually going on in the machine
    shop. It is in the programmers'' own interest to know how the CNC operators feel
    about their programs, the programming style, and their approach to CNC programming
    overall. Exchange thoughts and communicate with each other — that is the best
    way to become a better CNC programmer (as well as CNC operator). Most machine
    shops offer tremendous resources, take advantage of them.


    These days, more than ever, CNC technology is an instrument to improve productivity
    with a minimal human involvement, measured at least by the physical level. As
    with any other technology, it must be understood and managed intelligently, by
    qualified people with experience. Without a firm grip and good control, without
    good management, and without the right attitudes, the technology will not yield
    the expected results; in fact, it will become counterproductive.


    In order to develop high quality programs, CNC programmers must have certain qualities
    of their own. The quality of actual parts produced is measurable. Is the quality
    of CNC programming also measurable? We look at this subject in the essay *Quality
    in CNC Programming*.'
  merge: -1
  img_proc: true
