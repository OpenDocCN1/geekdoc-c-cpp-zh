- pgno: 156
  md: 'impact. This is the subject of this article, in the form of a few short statements
    and a short explanation.


    # Work Offset G54 is NOT Always an Automatic Default on Most Controls


    All six work offsets that most Fanuc and similar controls offer are seldom needed
    in a single program. That leaves only one that is needed, G54 (being the first
    in line). Many programmers do not use it at all, and have no problems. The reason
    is that they count on the default control settings. Some controls will use G54
    settings, even if G54 does not appear in the program. Controls that do not have
    G54 set as a default may cause erroneous motions, including a possible over-travel.
    It is always a good practice to include work offset in the program and not count
    on default settings.


    # G92 and G54 are Quite Different


    Now mostly obsolete, the old G92 position register command is always measured
    from part zero to the current tool position. The modern work offsets in the range
    of G54 to G59 are measured from machine zero to the part zero. Conventional wisdom
    says that these two groups should never been used in the same program together.
    I have seen a few successful exceptions, but the wisdom is still correct — use
    one or the other if you have a choice, but not both.


    # Selecting Offset Numbers H and D


    There is a fairly common practice among programmers to match the tool length offset
    number (address H) to the tool number (address T). For example, programming T03
    along with H03 makes sense, as only one tool length offset is normally required
    per tool. When it comes to the cutter radius offset, the D offset number can also
    be the same, providing the control has a separate register for each offset group.
    This feature is only available'
  merge: -1
  img_proc: true
- pgno: 157
  md: 'on higher level controls or as a special option. Most controls have a shared
    offset register — both tool length and radius offsets are in the same memory storage
    area. In this case, the D-offset number should be different (not the H-offset)
    because it is not required for each tool. A typical approach is to change the
    D-offset number arbitrarily by a certain amount, usually by 20, 30, 40, or 50,
    depending on the actual number of tools available. If tool three requires both
    offsets, the program will use T03, H03, and D53, for example. Don’t forget H..
    is programmed with G43, and D.. is programmed with G41/G42.


    # ### Dimensional Units – Imperial and Metric


    Common program selection for imperial or metric units is from two G-codes: G20
    (imperial) and G21 (metric). In most cases, they replaced the old G70/G71 commands,
    common on early control systems. Although many programmers bundle either of the
    two G-codes with other G-codes in a single block at the beginning of a program,
    this may prove to be a poor practice. The reason is that some machines require
    having G20/G21 on a separate block. The reason is that some older controls do
    not convert offset settings from inches to millimeters or from millimeters to
    inches; they only shift the decimal place by one position. In this case, the G-codes
    can be bundled together. Newer controls do actually convert offset and other settings
    from one unit system to the other. To do that without any conflict, G20 or G21
    should — or even must — be programmed by itself in a block. This approach will
    never cause harm on any control and makes such program more portable.


    # ### M-Functions Together with a Motion


    Several miscellaneous functions should be programmed in a block without any other
    data. These include M00, M01, and M30. Others are programmed logically and tied
    to other functions, for example, spindle speed and tool rotation (S1000 M03).
    What about M-functions programmed together with a motion?'
  merge: -1
  img_proc: true
- pgno: 158
  md: 'Take two examples: G01 X10.0 F15.0 M03 will cause the spindle rotation simultaneously
    with the motion, whereas G01 X10.0 F15.0 M05 will complete the motion first, and
    then turn the spindle off. In this respect, the control behaves quite logically.


    # ... And Finally, Some General Observations


    Alarm lights on the operation panel can burn out and fail to warn the CNC operator.
    Check them frequently.


    The miscellaneous function M19 (or M20 on some controls) can be used to orient
    spindle through the program. Spindle can also be oriented at the machine or control
    using the MDI method or a physical button.


    G91 G28 X0 Y0 Z0 (milling) or G28 U0 W0 (turning) are the fastest ways to send
    machine axes to their respective zero positions from any tool position, providing
    it is safe!'
  merge: -1
  img_proc: true
