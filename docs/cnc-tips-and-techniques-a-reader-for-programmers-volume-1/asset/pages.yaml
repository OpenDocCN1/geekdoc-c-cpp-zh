    # ## Automatic Corner Breaking


    *November 2006, updated February 2013*


    In a typical lathe work, there are many situations where the cut from shoulder
    to diameter — or from diameter to shoulder — requires a corner break. Breaking
    a sharp corner is a very common practice for eliminating burrs, providing clearances,
    and offering easier handling and assembly. It also improves appearance of the
    part.


    # ### Size of Corner Breaks


    Engineering drawings often specify that all sharp corners are to be broken, but
    do not always provide their size. It is up to the CNC programmer to make the selection,
    which may vary from 0.005 to 0.020 inches (0.125 to 0.500 mm) or even more for
    special applications. The required corner break is either a chamfer at 45 degree
    angle, or a blend radius (fillet). Many corner breaks apply to cuts between a
    shoulder and the adjacent diameter, where the cut takes a 90-degree turn in one
    axis at a time. Although the calculations of start and end points are not difficult,
    they can be time consuming if many corners are involved (shaft work with many
    diameters, for example).


    # ### Programming Corner Breaks


    Fanuc and similar controls provide a feature that greatly simplifies programming
    of such corners — it is called *Automatic Corner Breaking*. To better understand
    the difference in programming approach, compare the following examples. The first
    one shows a single chamfer of 0.1 between shoulder and diameter, calculated for
    each endpoint (blocks N5 and N6 make the chamfer):'
  merge: -1
  img_proc: true
- pgno: 115
  md: '```

    ```

    N1 T0100 (0.1 X 45 CHFR - MANUAL CHAMFER)

    N2 G96 S300 M03

    N3 G00 G42 X4.0 Z0.1 T0101 M08

    N4 G01 Z-2.0 F0.01

    N5 X5.8

    N6 X6.0 Z-2.1

    N7 Z-3.0

    ...

    ```

    ```


    The second example shows the same program modified for

    automatic chamfering (block N5 makes the chamfer):


    ```

    ```

    N1 T0100 (0.1 X 45 CHFR - AUTOMATIC CHAMFER)

    N2 G96 S300 M03

    N3 G00 G42 X4.0 Z0.1 T0101 M08

    N4 G01 Z-2.0 F0.01

    N5 X6.0 C-0.1 (SHARP CORNER)

    N6 Z-3.0 (CONTINUES IN Z-NEGATIVE DIRECTION)

    ...

    ```

    ```


    The C-command in block N5 is the *chamfering vector* indicat-

    ing the actual chamfer size. Note that the X6.0 indicates the

    diameter to reach (sharp point), as per drawing — no start/end

    points are required. When the control encounters a block con-

    taining the chamfering vector, it will automatically shorten the

    toolpath length by the C-vector amount. The vector sign is

    important. A positive C-vector means the chamfer is cut into the

    positive direction; a negative C-vector means the chamfer is cut

    into the negative direction (applies to both X and Z axes).


    Even more effective is using the automatic chamfering for a

    blend radius. A blend radius between shoulder and diameter (or

    vice versa) is programmed in a very similar way as the chamfer

    vector, using the R-vector. Although the R-vector is a radius, *it is

    used in the G01 mode!* As with the C-vector for chamfering, the R-'
