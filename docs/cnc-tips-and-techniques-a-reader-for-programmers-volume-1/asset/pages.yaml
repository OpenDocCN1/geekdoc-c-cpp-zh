- pgno: 97
  md: 'seldom, if ever, used in a typical part program. Command G27 is a machine zero
    position check. It is programmed with one or more axes and checks whether the
    position specified corresponds to machine zero position. If not, the program processing
    stops and alarm is raised by the control. Its practical application has ceased
    with the demise of G92 (G50) programming (*position register*). There is no need
    for this command in a program that uses work offsets (G54 to G59 or higher). G29
    is the opposite of G28/G30. Whereas G28/G30 represents a motion to machine zero
    via an intermediate point, G29 is a *motion from machine zero to a specified position
    via an intermediate point*. This command is virtually useless in typical programs.


    # Additional Codes


    Another virtually useless command is G44 (*tool length offset negative*). It may
    have its adherents, but there is nothing that the ubiquitous G43 command (*tool
    length offset positive*) cannot achieve.


    A command that may be somewhat of a puzzle is G31, defined simply as the *Skip
    command*. This command is indeed a very special one because it is exclusively
    used with probing on CNC machines (in-process gauging). Its purpose is to move
    the probe from a clear position, at a feedrate (just like G01), to a position
    to be probed. Once the probe detects a contact with the material, the motion stops
    and the remainder of the motion is not completed; it is *skipped*, hence the command
    name.


    # G6x Codes


    Finally, there are several G-codes in the G6x range, namely G60 (*Single direction
    positioning*), G61 (*Exact stop check mode*), G62 (*Automatic corner override
    mode*), G63 (*Tapping mode*), and G64 (*Normal cutting mode*). The default is
    G64, normal cutting mode.


    G61 is the modal version of G09, and can be useful for increased precision when
    a tool has to move around a sharp corner at a high feedrate, particularly if the
    corner forms a narrow'
  merge: -1
  img_proc: true
- pgno: 98
  md: 'angle. **G62** may improve the surface finish when used to cut sharp inner
    corners in cutter radius offset mode. Its function is to automatically adjust
    the cutting feedrate. A tapping mode programmed with **G63** disables the feedrate
    override and the feed-hold button, and **G64** returns the cutting motions to
    their original programmed mode. Each mode selected replaces any other mode.


    **G60** stands separately. Its purpose is to force a unidirectional tool positioning,
    regardless of which direction the tool comes from. It can be used to compensate
    for some minor backlash, but it does *not* remove it. Backlash problems require
    qualified service technicians.


    There may be other G-codes not commonly used, but the ones mentioned in this column
    should provide some understanding of the more common special purpose G-codes.


    ![](img/0023bd5cc50494e6d7799ab76d437c8d_98_0.png)


    # ## Well-Structured Program Structure


    *June 2006, updated February 2013*


    A fairly experienced CNC user asked me recently, “*Are there any rules as to how
    actually write the program?*” His interest was in the format of the program, not
    its actual contents. He was interested if there are any preferable ways to structure
    a part program to gain certain advantages. Indeed, what is a good structure? In
    fact, what is a program structure in the first place?


    A typical CNC program will contain several tools, arranged in the order of machining.
    Each tool will be programmed in three unique sections: 1) a few blocks at the
    *beginning* to move the tool to a cutting position, 2) the actual *machining*
    section, and 3) another few blocks to move the tool away from the work to make
    room for the next tool. No doubt, the machining section — the actual toolpath
    associated with cutting — is the most important one and is generally immune to
    any particular format. The beginning and the end of each tool are the areas where
    many'
  merge: -1
  img_proc: true
- pgno: 99
  md: 'structural improvements can be made, mainly in the beginning section.


    # A Sample Milling Program


    Consider a typical start of a CNC program for milling:


    ```

    ```text

    N1 G21 G17 G40 G80 G90 G54

    N2 T01 M06

    N3 G00 X... Y... S... M03 T02

    N4 G43 Z... H01 M08

    <... machining with tool T01 ...>

    ```

    ```


    The program looks all right, containing all data required at *the start*. Yet,
    a few changes in the data order — in the structure — will make a significant difference
    in case a problem does occur. First, the G21 (or G20) command should be in a block
    of its own. Even if the control allows the units selection combined with other
    G-codes, programming this command in a separate block will make the program more
    portable between machines with similar controls.


    The same applies to the tool change. There is nothing wrong with T01 M06 in one
    block, but splitting this format into two blocks makes the program more flexible.
    The first block is often called the *safety block*. The idea behind the expression
    is to store all required settings and/or cancellations first, so the program starts
    safely, without any defaults or leftover settings from previous programs.


    # Further Improvements


    Including such a block at the top of the program is recommended; however, the
    structure as presented is far from the best. Consider this unwanted, but common,
    possibility. During machining, the program switches to G91 incremental mode and,
    shortly after, the control system generates an alarm for some reason. When the
    alarm is cleared, the operator returns to the block'
  merge: -1
  img_proc: true
- pgno: 100
  md: 'after the tool change and repeats the toolpath, this time in incremental mode.
    The reason? Command G90 was programmed too early, *before the search block*. Exactly
    the same problem may happen if G54 was changed to G55, and the program for a particular
    tool had to be repeated. These are not programming errors per se, but actual situations
    that can cause an error during machining. All it takes to make the program better
    is to *change its structure*. It will also be easier for the CNC operator to work
    with such a program:


    ```

    N1 G21

    N2 T01

    N3 M06

    N4 G17 G40 G80

    N5 G90 G54 G00 X.. Y.. S.. M03 T02

    N6 G43 Z.. H01 M08

    <... machining with tool T01 ...>

    N15 G00 Z2.0 M09

    N16 G28 Z2.0 M05

    N17 M01

    ```


    Selecting the units mode in the first block is normal, as units should never be
    changed within the same program.


    Another common problem CNC operators often encounter is when a certain tool has
    to be repeated *after* another tool is already in the spindle. In such cases,
    all it takes to eliminate a manual tool change at the machine is to repeat the
    current tool number at *the beginning* of each tool:


    ```

    N18 T02  (TOOL CALLED IN N5 IS REPEATED)

    N19 M06

    N20 G90 G54 G00 X.. Y.. S.. M03 T03

    N21 G43 Z.. H02 M08

    <... machining with tool T02 ...>

    N35 G00 Z2.0 M09

    ```'
  merge: -1
  img_proc: true
