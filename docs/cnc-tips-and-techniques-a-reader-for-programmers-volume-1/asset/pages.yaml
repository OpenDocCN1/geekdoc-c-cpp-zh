    # G76: Two Formats, One Cycle


    *April 2007, updated February 2013*


    Fanuc offers several multiple repetitive cycles for CNC lathe controls, in the
    range of G70 to G76. Without a doubt, for rough turning and boring, the G71 is
    the most commonly used cycle, along with G70 for finishing. G72 does the same
    job if the machining is more vertical than horizontal. Other cycles are used less
    frequently, mainly for special applications, with the exception of G76. This venerable
    cycle is the king of threading. It shines in every way you look, although that
    was not always the case. Somewhere between Fanuc 10/11/15 and the newest control
    models, Fanuc has changed the way this cycle is programmed. This change has affected
    the other cycles as well, but not in the same profound way as it affected G76.


    # The Original G76


    Let’s go back to the original cycle—the one written as a single block in the program.
    Its format was a bit lengthy, but you could feel the power that was contained
    in that one block of program:


    ```

    G76 X.. Z.. I.. K.. D.. A.. F..

    (with a P.. option for some controls)

    ```'
  merge: -1
  img_proc: true
- pgno: 134
  md: 'The individual addresses are pretty straightforward — X is the thread final
    diameter, Z is the final position for the thread length, I is equal to zero, unless
    you’re cutting a tapered thread, K is the actual thread depth, D is the first
    depth of the thread, A is the thread angle, and F is the thread lead as feedrate.
    The P option is not available on all controls; its purpose is to control the actual
    cutting motions of the tool. As good as this cycle was, and still is, it lacks
    certain features that could make the life of a CNC operator a bit easier. Consider
    the quick changes that can be done at the machine, in a rush to improve a thread
    on the fly, so to speak. There are only two: 1) changing the D to control the
    number of passes and 2) changing the A to control the infeed angle. That’s it.
    All other minor adjustments were not readily possible, unless you got into the
    system parameters, and that is a territory forbidden to many.


    # Improving G76


    Fanuc realized the need to improve this very powerful cycle, and made it even
    more powerful by adding certain features that can now be set right at the machine
    control, rather than through various system parameters. The result was a two-block
    G76 — yes, two blocks! — applicable to controls such as Fanuc 0,16,18,21, and
    a number of others. This format offers much more than the two features that can
    be changed at the machine. Is there a price to pay for this added convenience?
    Yes, but a rather small one. The G76 has to be repeated in both blocks. In addition,
    the programmers have to understand the meaning of each data entry within the cycle.
    Here is the format for a two-block G76 threading cycle:


    ```

    G76 P.. Q.. R..

    G76 X.. Z.. R.. P.. Q.. F..

    ```


    Note the repetition of P/Q/R in both blocks — they are the reason for having two
    blocks in the first place. Needless to say,'
  merge: -1
  img_proc: true
- pgno: 135
  md: '# CNC Tips and Techniques


    each of these three letters has a different meaning, depending on the block. The
    explanation of each address will be a bit longer, because that is where the additional
    (and real) power is hidden.


    In the first block, the most misunderstood is the P-address. It uses six (!) digits,
    in three pairs. Pair 1 is the number of finishing passes, which can be programmed
    in the range of 01 to 99. Pair 2 is the number of thread leads for a gradual pullout
    from the thread. This is a very useful feature when programming a thread that
    ends in a solid material rather than in a recess. In the case of Pair 2, the range
    is from 0.1 to 9.9, written without the decimal points. Finally, Pair 3 is the
    old A-address — the thread angle. Keep in mind that for both types of G76 input,
    this entry is limited to only six entries: 00, 29, 30, 55, 60, and 80. That takes
    care of the rather long P-address.


    Addresses Q and R are quite easy. Q is the minimum cutting depth per side (without
    a decimal point). R is the amount left as finishing allowance (yes, this time,
    a decimal point is allowed). Both Q and R are very handy to fine tune the cutting
    conditions for a best thread possible.


    Now to the second block. Most of the original settings are here: X and Z have
    the same meaning as in the one-block G76 cycle; R has replaced the original I
    for a tapered thread (R0 for a straight thread can be omitted); P has replaced
    the original K for the actual thread depth (no decimal point this time); Q has
    replaced the D as the first thread depth; but at least the F for feed-rate (always
    the thread lead) has remained the same.


    Without a question, the two-block G76 threading cycle is a real gem, but it can
    only be used on controls that support it. Watch whether a decimal point can be
    used or not; there are some possibly unexpected changes. This cycle is a winner
    over all. It cannot handle absolutely every thread there is (that’s why we still
    have G32), but if you’re in the special threading business, you have methods of
    your own already.'
  merge: -1
