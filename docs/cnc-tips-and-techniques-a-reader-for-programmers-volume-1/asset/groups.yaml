    ## 程序员读本


    ### CNC 程序员/操作员的优势


    首先，让我们看看优势。让一个人参与零件制造的整体流程，有助于更好地理解该流程。一旦出现问题，通常也更容易找到解决办法。同时操作 CNC 机床的程序员更有动力用自己的程序把工作做得更好。零件编程员通常需要懂得如何加工零件，但
    CNC 操作员通常不被要求了解开发程序的所有细节。优秀的 CNC 操作员并不一定了解编程部分，也不总能提供与程序相关的解决方案。


    在合并岗位中，这种理解上的欠缺就不存在了。程序员还经常与工程师和客户交流；操作员通常不会。优秀的程序员也会与机床操作员交流并征求他们的意见。同样，合并岗位可能为设计或制造工艺提供只有熟练机床操作员才能想到的解决方案。


    ### CNC 程序员/操作员的劣势


    这种程序员/操作员合一的概念也有缺点。最初因节省薪酬而具有的吸引力，可能会被生产时间的损失所抵消。一边编制程序一边操作机床几乎是不可能的。要把两者同样做好，不仅需要一个技术熟练、尽职尽责的人，还需要合适的工作任务。如果机床上大约每两分钟就要更换一个零件，程序员就无法充分集中精力开发下一个程序。加工一个零件需要二十分钟，则能提供稍多一些灵活性。


    每位车间经理都熟悉*机床利用率*这一术语——盈利之道就是尽可能多地运行 CNC 机床，生产高质量零件。使用 CNC 机床时总会有一些延误。首先是装调时间，包括夹具、刀具和控制设置。接着，必须对首件进行验证。然后，当机床最终开始生产时，总需要更换零件、更换磨损的刀片、修改偏置值等。由于程序员必须准备程序而增加更多停机时间，代价可能非常高；经过一段时间，其成本可能高于让两名熟练工人分别承担各自职责。


    到目前为止，这一概述针对的是一台 CNC 机床。如果车间里有两台、三台甚至更多机床，又会怎样？


    这种合并岗位还有另外三个缺点也应认真考虑。第一个很简单。如果程序员因病在家，操作员也如此（反之亦然）。第二个缺点与之相关。如果程序员/操作员辞职了怎么办？当然，有合适的后备人员是理想方案，但现实是生产中总会在某处出现缺口；即使缺口是暂时的，也仍意味着时间损失。第三个缺点更多涉及人性的某些特点，并不适用于所有人。一些同时操作机床的程序员可能倾向于掩盖自己的错误，在无人知晓的情况下花额外时间在机床上进行修正，甚至编写新程序。一些程序员/操作员可能自满甚至自得；他们不再学习新方法和新技术。另一些人可能在工资、福利、休假等方面提出过高要求。


    需要考虑的一点是零件程序的生成方法。在许多车间，仍然普遍采用手工编写程序，而不是使用 CAD/CAM 编程系统。尽管程序员理解手工编程很重要，但车间经理理解
    CAD/CAM（也称为 CAM）编程系统的优势也同样重要。对于由一人编程并操作的合并岗位，在 CNC 机床附近安装 CAM 系统尽管有初始成本，但可能带来许多好处。


    许多机加工车间经理偏爱 CNC 程序员/操作员岗位，并且很清楚其缺点。如果在合适的环境中设立并妥善管理，车间里拥有一名多技能工人带来的好处应多于问题。大多数同时操作
    CNC 机床的 CNC 程序员都诚实敬业；他们尽最大努力做好工作。他们认为自己是真正的专业人士，而且理应如此。在管理方面，谨慎的业主或经理在设立 CNC 程序员/操作员岗位之前，必须权衡所有利弊。


    ![](img/0023bd5cc50494e6d7799ab76d437c8d_50_0.png)


    ## 在小车间中使用 CAM 软件


    *2004 年 11 月，2013 年 2 月更新*


    多年来，手工编程为 CNC 程序员带来了许多好处。它提供对刀具路径的绝对控制，并培养组织性和纪律性。此外，它确实有一些负面副作用；它非常耗时、容易发生人为错误，并且难以修改程序。消除——或至少尽量减少——与手工编程相关问题的需求，促成了使用计算机进行
    CNC 编程的发展，即*CAM 编程*。


    ### CAM 软件


    现代 CNC 软件——通常被称为 CAM 软件，因为许多商品名以 CAM 这三个字母结尾，例如流行的 Mastercam——提供许多功能，使最初的手工编程方法自动化。计算机生成大多数
    CNC 程序比手工编程更快、更准确。正确应用 CAM 软件将生成反映程序员加工零件方式的零件程序。


    无论是手工开发还是由软件生成，系统都提供文件传输选项。对于更复杂的专用 DNC 传输，单独的软件通常是更好的选择。显示也很重要——长时间盯着电脑屏幕充其量会让人疲劳，随着时间推移还可能导致身体问题。大尺寸和高分辨率显示器对于舒适工作至关重要。许多显卡是为游戏而制造的，可能不适合严肃的
    CAM 工作。其他特性如硬盘容量已不再是问题，只要它们可靠且维护良好。


    ### 编程环境


    CAM 软件中的典型工作环境可以简单概括为三个步骤：


    - 1. 刀具路径几何

    - 2. 刀具路径应用

    - 3. 程序生成


    根据软件不同，可能会有许多中间（或附加）步骤，但这三个基本步骤始终适用。


    *刀具路径几何*


    刀具路径几何是刀具路径本身的可视化表示。它始终以图形方式生成，使用点、线、圆弧和其他图元。真正的刀具路径几何称为*关联几何*——这意味着更改刀具路径或操作中的任一项都会自动更改所有相关数据。


    即使价格最低（即功能较少）的 CAM 软件也提供最常见的 2D 刀具路径——钻孔操作、轮廓加工和型腔加工。更复杂的软件还会包括特殊刀具路径和操作，例如螺旋插补、作为几何一部分的样条曲线、特殊循环、子程序、3D
    加工、曲面和实体。选择 CAM 软件时，还要考虑未来需求，例如未来工作类型，以及机床和控制功能。


    ### 其他功能


    将零件几何与所用刀具结合即可创建操作。操作被视为单元——在一个单元内，单项更改将更新整个操作，例如更改刀具直径、主轴转速或切削进给率。CAM 软件中可能包含许多特殊功能。其中非常重要的一项是对钻孔、铣削、车削、切槽和螺纹加工等各种循环的支持。此类循环使手工编程简单得多且不那么繁琐；在
    CAM 软件中支持它们，可以更容易地在机床上进行小的加工更改。一些 CAM 软件提供开放式架构模型。简而言之，这意味着任何具备所需技能的人都可以编写可由 CAM
    软件访问的特殊实用程序。添加外部功能的能力大大增强了 CAM 软件的能力。


    *多机床支持*


    一些机床制造商提供自己的 CAM 软件，仅专用于他们制造的 CNC 机床。这一领域的典型例子是钣金加工机床和某些 EDM 机床。该软件通常对所支持的机床类型表现很好，但缺乏支持其他机床的灵活性。它非常适合专业化车间，但对于需要编程灵活性的车间则不太实用。


    大多数 CAM 软件是集成软件，允许零件程序员将其用于多种类型的机床，通常是铣床、加工中心和车床。集成 CAM 软件的主要优势是其灵活性。额外好处可能更实际但也同样重要，例如，铣削和车削使用相似的界面可缩短编程时间。


    '
