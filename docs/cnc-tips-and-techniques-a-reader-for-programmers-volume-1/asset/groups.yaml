    # ## Using CAM Software in Small Shops


    *November 2004, updated February 2013*


    Over the years, manual programming has offered many benefits to CNC programmers.
    It offers absolute control over the toolpath and it teaches lessons in organization
    and discipline. Also, it does have some negative side effects; it is very time
    consuming, prone to human errors, and hard to make changes in the program. The
    need to eliminate — or at least minimize — the problems associated with manual
    programming led to the development of CNC programming using computers, known as
    *CAM programming*.


    # ### CAM SOFTWARE


    Modern CNC software — typically called CAM software because of the many trade
    names ending with the three letters CAM, such as the popular Mastercam — offers
    many features that automate the original manual method of programming. Computers
    produce most CNC programs more quickly and more accurately than manual programming
    ever did. A proper application of CAM software will produce a part program that
    reflects the programmer’s way of machining a part.


    Whether developed manually or generated by software, the'
  - '[PAGE 51]


    <!-- no content -->'
  - '[PAGE 52]


    systems offer a file transfer option. For a more complex dedicated DNC transfer,
    separate software is usually a better choice. Display is also very important —
    looking extensively at a computer screen can be tiring at best and may cause physical
    problems over time. Large viewing size and high resolution monitors are critical
    for comfortable work. Many graphics cards are made for gaming and may not be suitable
    for serious CAM work. Other features such as hard drive size are no longer a problem,
    as long as they are reliable and well maintained.


    # PROGRAMMING ENVIRONMENT


    A typical working environment within CAM software can be easily summed up in three
    steps:


    +   1. Toolpath Geometry

    +   2. Toolpath Application

    +   3. Program Generation


    Depending on the software, many intermediate (or additional) steps may be available,
    but the three basic steps will always apply.


    # *Toolpath Geometry*


    Toolpath geometry is a visual representation of the toolpath itself. It is always
    generated graphically, using points, lines, arcs, and other entities. True toolpath
    geometry is called an *associated geometry* — that means a change in either the
    toolpath or the operation will change all related data automatically.


    Even the lowest priced (i.e. featured) CAM software offers the most common 2D
    toolpaths — drilling operations, contouring, and pocketing. More sophisticated
    software will also include special toolpaths and operations, such as helical interpolation,
    splines as part of the geometry, special cycles, subprograms, 3D machining, surfaces,
    and solids. When selecting CAM software, think also of future needs, such as the
    type of future work, as well as machine and control features.'
  - '[PAGE 53]


    <!-- no content -->'
  - '[PAGE 54]


    # Other Features


    Combining part geometry with the tools used creates an operation. Operations are
    treated as units — within a unit, an individual change will update the whole operation,
    for example, changing a tool diameter, spindle speed, or a cutting feedrate. There
    could be a number of special features included in CAM software. One that is very
    important is the support for various cycles for drilling, milling, turning, grooving,
    and threading. Such cycles make manual programming a lot simpler and less tedious;
    having support for them in the CAM software makes it easier at the machine to
    make small machining changes. Some CAM software offers an open architecture model.
    In plain words, it means that anybody with the required skills can write special
    utilities that can be accessed by the CAM software. The ability to add external
    features greatly adds to the power of the CAM software.


    # *Multi-Machine Support*


    Some machine tool manufacturers provide their own CAM software dedicated only
    to the CNC machines they make. Typical examples in this area are fabricating machines
    and some EDM machines. The software usually performs very well for the machine
    type supported, but it lacks flexibility to support other machines. It is quite
    suitable for a specialized shop, but not very practical for a shop that needs
    programming flexibility.


    Most CAM software is integrated software, which allows the part programmer to
    use it for several types of machine tools, typically mills, machining centers,
    and lathes. The major advantage of integrated CAM software is its flexibility.
    Additional benefits may be more practical but also important, for example, a similar
    interface for milling and turning shortens the programming time.'
