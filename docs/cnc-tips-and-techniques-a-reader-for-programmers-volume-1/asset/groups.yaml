  - '[PAGE 259]


    During the past decade, Peter Smid wrote dozens of columns for *Shop Talk* magazine
    that addressed the full gamut of CNC topics, such as tapping, threading, and knurling;
    program length and memory needs; G-codes, M-functions, cycles, macros ... and
    more. Ever since *Shop Talk* ceased publication, these columns have been unavailable.
    Now, in *CNC Tips and Techniques*, we are delighted to bring them back—over 60
    of the best of Peter’s columns—all under one cover, so that you can have full
    and easy access to the advice Peter has been sharing during the past decade.


    Each column has been thoroughly reviewed since its initial publication and updated
    as needed to reflect ongoing changes in the field. They are presented here in
    chronological order of when they first appeared. An alternative table of contents,
    organized by topic, has also been included. Besides, you’ll find several useful
    appendices and an extensive index.


    *CNC Tips and Techniques* is a treasure trove of Peter Smid’s “lost work” that
    is certain to be an invaluable addition to your CNC toolkit. We hope the advice
    and instructions contained in these readings will help you do your job more efficiently
    and more effectively—and that you find them a good read besides.


    **Peter Smid** has been a professional consultant, educator, trainer, author of
    best-selling books, and speaker in the field of CNC. He has many years of practical,
    hands-on experience with CNC and CAD/CAM applications at all levels. Much sought
    after, he has advised both manufacturing companies and educational institutions
    on the practical use of CNC technology, part programming, training and development,
    CAD/CAM, various advanced machining methods, tooling, setup, and other related
    fields. Hundreds of organizations have used his services and benefited from his
    wide-ranging industrial and educational experience. His other books available
    from Industrial Press are: *CNC Programming Handbook, 3rd Edition*; *CNC Control
    Setup for Milling and Turning*; *FANUC CNC Custom Macros*; and *CNC Programming
    Techniques*.


