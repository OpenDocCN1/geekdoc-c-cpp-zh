    # Reason 4 – Do You MDI?


    Any operator who sets up a CNC machine has to perform many pre-machining activities,
    for example, make tool changes, set tools, activate the spindle, orient it, move
    the table by a certain distance, check a position, and so on. Even with many switches
    on the panel, one of the best methods is to use the *Manual Data Input* feature
    of the control — the MDI. This feature allows you to input and execute data at
    the control on a temporary basis. The data is always provided in the program format
    of that control. You cannot use the *MDI* feature if you do not understand at
    least the basics of manual programming.


    # Reason 5 – Learning from others


    A part program printed on paper does not teach programming or machining methods,
    yet there is so much to learn from programs that have already been verified. How
    many of us started our careers by adapting existing programs to our own? A part
    program that works well offers tremendous opportunity for study and learning.
    Of course, one has to be able to read such programs — *to interpret them* — and
    that means being able to understand the G-codes and M-functions, the program format
    and structure, offsets, modes, and the many addresses and their subtle meanings.


    Of course, one has to be *willing* to learn. When you just look at a part program,
    without understanding it, without being able to interpret it, do you care? Does
    it bother you? Do you feel you want to know more? If the answer is “yes”, you
    are on the way of becoming a better programmer or operator — a true professional.
    But that is reason number six, and I only promised five.'
