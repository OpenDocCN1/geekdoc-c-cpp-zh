    \ active. The programming format for G51 is:\n\n```gcode\nG51 I.. J.. K.. P..\n\
    ```\n\nIJK addresses refer to their respective XYZ coordinates of the scaling\
    \ center, while the P-address is the scaling factor. Scaling center is defined\
    \ in absolute coordinates of the current units of measurement, and scaling factor\
    \ can be in 0.001 or 0.00001 increments, depending on the control setting. In\
    \ order to prevent any conflict, both G50 and G51 should be programmed as separate\
    \ blocks, with no other significant data included.\n\nThe scaling center determines\
    \ the *location* of the scaled tool path and the scaling factor determines its\
    \ size. For scaling factors greater than one, the machining tool path will be\
    \ *expanded*. For scaling factors smaller than one, the machining tool path will\
    \ be *reduced*. The scaled part will always expand away from or reduce towards\
    \ the scaling point equally along all specified axes.\n\nThe basic programming\
    \ format is illustrated in the following example:\n\n```gcode\nN1 G20\nN2 G17\
    \ G40 G80\nN3 G50 (SCALING OFF AT TOOL START)\nN4 G90 G00 G54 X-1.25 Y-1.25 S800\
    \ M03\nN5 G43 Z1.0 H01 M08\nN6 G51 I0 J0 P1.050 (SCALING CENTER AT X0Y0 - 1.05X\
    \ expand)\nN7 G01 Z-0.7 F50.0\nN8 G41 X-0.75 D51 F25.0\nN9 Y1.75 F15.0\nN10 X1.5\n\
    N11 G02 X2.5 Y0.75 I0 J-1.0\nN12 G01 Y-0.75\nN13 X-1.25\nN14 G40 Y-1.25 M09\n\
    N15 G50 (SCALING OFF AT TOOL END)\nN16 G00 Z1.0\nN17 G28 Z1.0\nN18 M30\n%\n```\n\
    \n## Rounding Errors\n\nOne very important consideration in scaling is a possible\
    \ rounding error. To illustrate, consider a conversion between metric and inch\
    \ units. A dimension of 1.0 inch will become 25.4 mm, which is an exact conversion.\
    \ On the other hand, 25.4 mm converted to inches will use a factor of 0.039370079.\
    \ If the scaling factor is set to a three decimal accuracy, the 25.4 mm will become\
    \ only 0.991 inches (25.4 x 0.039 = 0.9906) — a rather large error of about 0.009.\
    \ With scaling factor set to five decimal places, the error will still be there\
    \ but it will be practically negligible.\n\nThe scaling factor is a *multiplying\
    \ factor*, not a percentage. If a certain scaling percentage is required — for\
    \ example, 5% shrinkage — it has to be converted. The scaling factors of P1.05\
    \ (expansion) or P0.95 (reduction) are well within the expected accuracy of the\
    \ final part precision.\n\nFor a complete example with illustration, using the\
    \ scaling function, see Appendix 4 at the back of this book.\n\n![](img/0023bd5cc50494e6d7799ab76d437c8d_190_0.png)\n\
    \n## Safety and CNC Programming\n*October 2008, updated February 2013*\n\nWhen\
    \ it comes to safety in machine shops, the great majority adheres to the occupational\
    \ safety laws and regulations of the jurisdiction in which they are located, often\
    \ exceeding the official ones. Common rules are generally well known. They include\
    \ wearing protective clothing, safety boots, safety glasses with protective side\
    \ shield, keeping the environment clean, removing any hazards, and many others.\
    \ Machining safety is paramount to the successful operation of any machinery,\
    \ CNC equipment included. Many safety issues are associated with the actual equipment\
    \ operation and machining of a part. Very few companies have standards relating\
    \ to safety issues in CNC programming, whether manual or computer generated. CNC\
    \ programmers may work from an office environment, yet they have a great responsibility\
    \ to build safety features into every CNC program.\n\nA fairly long list can be\
    \ assembled to identify what such features should be. A lot depends on the product\
    \ manufactured, the equipment used, and company standards and culture. Certain\
    \ general approach to safety in CNC programming can be identified, regardless\
    \ of local conditions or method of programming. A short list focused on CNC vertical\
    \ machining centers can be adapted to CNC lathes and other machines, and may include\
    \ the following items:\n\n- **Approach program development with safety in mind\
    \ for all work.**\n  \n  This underlying philosophy should be constant for any\
    \ part, any program, and any machine.\n\n- **Program your approach towards a part\
    \ in the XY axes first; then move the Z-axis.**\n  \n  When the tool moves above\
    \ the part first, it is less likely to come into collision with the part itself\
    \ or the fixture. In terms of efficiency, it takes longer than three-axis simultaneous\
    \ motion, but this XYZ split motion can always be changed after a safe setup had\
    \ been established.\n\n- **Program a retraction from a part in the Z axis first,\
    \ then move the XY axes.**\n  \n  Tool retraction from a part may include only\
    \ the Z-axis, but for XYZ motion, the split is safer than three-axis motion. This\
    \ is the opposite of the previous item.\n\n- **Start every program with an initial\
    \ setting and cancellations (so-called status block or a safety block).**\n  \n\
    \  It is usual to include various settings and cancellations at the beginning\
    \ of a program. Settings may include dimensional units selection, plane selection,\
    \ and absolute mode whereas cancellations typically include fixed cycles, cutter\
    \ radius and length offset, and initial status of certain options (for example,\
    \ scaling off or polar coordinates off).\n\n- **Provide sufficient clearances\
    \ (above part, below part, lead-ins, and lead-outs, etc.).**\n  \n  Insufficient\
    \ clearances are often the cause of dangerous tool-machine collisions. Rapid motion\
    \ to a certain depth may be safer if programmed as two motions: above the part\
    \ first, then to the required depth. This method helps during setup and does not\
    \ increase cycle time during automatic operation.\n\n- **Program reasonable speeds,\
    \ feeds, depth of cuts, width of cuts, etc.**\n  \n  Every CNC machine has override\
    \ switches — establishing speeds and feeds on the conservative side may be safer,\
    \ although less efficient. Efficiency can be achieved by optimizing the program\
    \ at the machine during setup, using the overrides. This approach may be particularly\
    \ useful when working with less experienced operators.\n"
  mdcn: "\n对于宏程序，也可以将其修改为常规加工方式。\n\n示例的宏程序清单及附图见本书末尾的附录3。\n\n![](img/0023bd5cc50494e6d7799ab76d437c8d_187_0.png)\n\
    \n## 缩放选项\n*2008年9月，更新于2月13日*\n\n许多控制系统上的一项功能称为缩放。缩放通常作为可选的控制功能，允许使用现有程序加工更小或更大的零件。在下结论之前，请记住，缩放并不意味着用于纠正因编程方法不当或装夹不良而造成的零件误差。缩放常用于铸造或注塑模具工作，用于补偿成型过程中的收缩，但也可用于二维加工。从CNC程序员的角度（而非工程角度）来看，缩放编程非常容易，但有许多特殊注意事项。\n\
    \n### 更改刀具路径\n\n缩放会根据缩放中心的位置和提供的缩放系数，按比例实际改变当前刀具路径。可以设置一个取决于控制系统的系统参数，使缩放对三个主轴的每一个生效或失效，但不适用于任何附加轴。此外，缩放不影响各种偏置模式，即工件偏置G54–G59、刀具长度偏置G43和刀具半径补偿模式G41–G42。如果在缩放模式激活期间使用G81–G89系列或G73、G74、G76中的固定循环，则G76和G87循环中的偏移量（G73和G83循环中的啄钻深度和让刀量）将*不*受影响。\n\
    \n*机床回零*命令是另一个考虑因素。与机床回零相关的准备功能命令，特别是G28和G30，以及G27和G29（已很少使用），应在缩放模式关闭状态下编程。在仍使用G92命令进行位置寄存器的旧式控制器上，请确保缩放模式也已关闭。在激活缩放功能之前，应始终通过G40取消刀具半径补偿G41和G42。如前所述，其他命令和功能可以处于激活状态，包括所有工件偏置命令G54至G59，以及可用的附加命令。\n\
    \n### G50 和 G51 代码\n\nFanuc编程格式使用两个G代码：G50和G51指令，其中G50取消缩放模式，G51激活缩放模式。G51的编程格式为：\n\
    \n```gcode\nG51 I.. J.. K.. P..\n```\n\nIJK地址分别对应缩放中心的XYZ坐标，而P地址为缩放系数。缩放中心以当前测量单位的绝对坐标定义，缩放系数可以按0.001或0.00001的增量设置，具体取决于控制器设置。为避免任何冲突，G50和G51都应作为独立程序段编程，且不包含其他重要数据。\n\
    \n缩放中心决定缩放后刀具路径的*位置*，缩放系数决定其大小。当缩放系数大于1时，加工刀具路径将被*放大*。当缩放系数小于1时，加工刀具路径将被*缩小*。缩放后的零件总是沿着所有指定轴从缩放点均匀放大或向缩放点均匀缩小。\n\
    \n基本编程格式如下例所示：\n\n```gcode\nN1 G20\nN2 G17 G40 G80\nN3 G50 (SCALING OFF AT TOOL\
    \ START)\nN4 G90 G00 G54 X-1.25 Y-1.25 S800 M03\nN5 G43 Z1.0 H01 M08\nN6 G51 I0\
    \ J0 P1.050 (SCALING CENTER AT X0Y0 - 1.05X expand)\nN7 G01 Z-0.7 F50.0\nN8 G41\
    \ X-0.75 D51 F25.0\nN9 Y1.75 F15.0\nN10 X1.5\nN11 G02 X2.5 Y0.75 I0 J-1.0\nN12\
    \ G01 Y-0.75\nN13 X-1.25\nN14 G40 Y-1.25 M09\nN15 G50 (SCALING OFF AT TOOL END)\n\
    N16 G00 Z1.0\nN17 G28 Z1.0\nN18 M30\n%\n```\n\n### 舍入误差\n\n缩放中一个非常重要的考虑因素是可能出现的舍入误差。举例说明，考虑公制与英制单位之间的换算。1.0英寸的尺寸将变为25.4毫米，这是一个精确的换算。另一方面，将25.4毫米转换为英寸将使用系数0.039370079。如果缩放系数设置为三位小数精度，25.4毫米将仅变为0.991英寸（25.4\
    \ x 0.039 = 0.9906）——误差约为0.009，相当大。如果将缩放系数设置为五位小数，误差仍然存在，但几乎可以忽略不计。\n\n缩放系数是一个*倍乘因子*，而不是百分比。如果需要某个缩放百分比——例如5%收缩率——则必须进行转换。缩放系数P1.05（放大）或P0.95（缩小）完全可以满足最终零件精度的预期误差要求。\n\
    \n有关使用缩放功能的完整示例和插图，请参见本书末尾的附录4。\n\n![](img/0023bd5cc50494e6d7799ab76d437c8d_190_0.png)\n\
    \n## 安全与CNC编程\n*2008年10月，2013年2月更新*\n\n谈到机加工车间的安全，绝大多数企业都遵守其所在司法辖区的职业安全法律法规，而且往往超出官方要求。常见规则众所周知，包括穿戴防护服、安全鞋、带护罩的安全眼镜，保持环境清洁，消除任何危险源，以及其他许多措施。机加工安全对于任何机械设备（包括CNC设备）的成功运行都至关重要。许多安全问题与实际设备操作和零件加工相关。很少有公司针对CNC编程中的安全问题制定标准，无论是手工编程还是计算机生成程序。CNC程序员可能在办公室环境中工作，但他们有重大责任在每个CNC程序中内置安全特性。\n\
    \n可以列出一个相当长的清单来指明这些特性应该是什么。这在很大程度上取决于所制造的产品、所使用的设备以及公司的标准和文化。无论当地条件或编程方法如何，都可以确定一些通用的CNC编程安全方法。以下针对CNC立式加工中心的简短清单也可适用于CNC车床和其他机床，可能包括以下项目：\n\
    \n- **所有编程工作都要以安全为核心。**\n  \n  这一基本理念应始终贯穿于任何零件、任何程序和任何机床。\n\n- **在XY轴方向上先规划趋近零件的路径，然后再移动Z轴。**\n\
    \  \n  当刀具先移动到零件上方时，不太可能与零件本身或夹具发生碰撞。就效率而言，这比三轴同时运动耗时更长，但在建立安全设置后，这种XYZ分离运动方式总是可以更改的。\n\
    \n- **编程退刀时先沿Z轴远离零件，然后再移动XY轴。**\n  \n  从零件上的退刀可以仅包括Z轴，但对于XYZ运动，分离运动比三轴运动更安全。这与前一项相反。\n\
    \n- **每个程序都以初始设置和取消指令开始（即所谓的状态块或安全块）。**\n  \n  通常在程序开头包含各种设置和取消指令。设置可包括尺寸单位选择、平面选择和绝对模式，而取消通常包括固定循环、刀具半径和长度补偿，以及某些选项的初始状态（例如，关闭缩放或关闭极坐标）。\n\
    \n- **提供足够的间隙（零件上方、零件下方、引入和引出等）。**\n  \n  间隙不足通常是危险的刀具-机床碰撞的原因。快速移动到某个深度时，如果编程为两段运动可能会更安全：先移动到零件上方，然后再移动到所需深度。这种方法在设置时很有帮助，并且在自动操作期间不会增加循环时间。\n\
    \n- **编程合理的速度、进给量、切深、切宽等。**\n  \n  每台CNC机床都有倍率开关——将速度和进给设置在保守一侧可能更安全，尽管效率较低。在设置期间，可以通过使用倍率开关在机床上优化程序来实现效率。当与经验不足的操作员合作时，这种方法可能特别有用。\n\
    \n"
