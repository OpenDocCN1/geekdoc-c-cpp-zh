    # ## Problems in Rough Cutting


    Two common problems in rough cutting relate to the first and last cut. As mentioned
    above, there is a solution for both problems. Sometimes the first rough cut in
    G71 cycle is too shallow or too deep. It is possible to control the actual size
    of the first cut by changing the X-position of the start point. These three motions
