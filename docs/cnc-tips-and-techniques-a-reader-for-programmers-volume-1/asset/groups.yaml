    # # Safety and CNC Programming


    *October 2008, updated February 2013*


    When it comes to safety in machine shops, the great majority adheres to the occupational
    safety laws and regulations of the jurisdiction in which they are located, often
    exceeding the official ones. Common rules are generally well known. They include
    wearing protective clothing, safety boots, safety glasses with protective side
    shield, keeping the environment clean, removing any hazards, and many others.
    Machining safety is paramount to the successful operation of any machinery, CNC
    equipment included. Many safety issues are associated with the actual equipment
    operation and machining of a part. Very few companies have standards relating
    to safety issues in CNC programming, whether manual or computer generated. CNC
    programmers may work from an office environment, yet they have a great responsibility
    to build safety features into every CNC program.


    A fairly long list can be assembled to identify what such features should be.
    A lot depends on the product manufactured, the equipment used, and company standards
    and culture. Certain general approach to safety in CNC programming can be identified,
    regardless of local conditions or method of programming. A short list focused
    on CNC vertical machining centers can be adapted to CNC lathes and other machines,
    and may include the following items:


    ***Approach program development with safety in mind for all work.***


    This underlying philosophy should be constant for any part, any program, and any
    machine.


    ***Program your approach towards a part in the XY axes first; then move the Z-axis.***


    When the tool moves above the part first, it is less likely to come into collision
    with the part itself or the fixture. In terms of'
  - '[PAGE 191]


    efficiency, it takes longer than three-axis simultaneous motion, but this XYZ
    split motion can always be changed after a safe setup had been established.


    # **Program a retraction from a part in the Z axis first, then move the XY axes.**


    Tool retraction from a part may include only the Z-axis, but for XYZ motion, the
    split is safer than three-axis motion. This is the opposite of the previous item.


    # **Start every program with an initial setting and cancellations (so-called status
    block or a safety block).**


    It is usual to include various settings and cancellations at the beginning of
    a program. Settings may include dimensional units selection, plane selection,
    and absolute mode whereas cancellations typically include fixed cycles, cutter
    radius and length offset, and initial status of certain options (for example,
    scaling off or polar coordinates off).


    # **Provide sufficient clearances (above part, below part, lead-ins, and lead-outs,
    etc.).**


    Insufficient clearances are often the cause of dangerous tool-machine collisions.
    Rapid motion to a certain depth may be safer if programmed as two motions: above
    the part first, then to the required depth. This method helps during setup and
    does not increase cycle time during automatic operation.


    # **Program reasonable speeds, feeds, depth of cuts, width of cuts, etc.**


    Every CNC machine has override switches — establishing speeds and feeds on the
    conservative side may my safer, although less efficient. Efficiency can be achieved
    by optimizing program at the machine during setup, using the overrides. This approach
    may be particularly useful when working with less experienced operators.'
