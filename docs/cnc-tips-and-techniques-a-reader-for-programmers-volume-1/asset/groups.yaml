    ## 特殊攻丝宏程序


    *2008年11月，2013年2月更新*


    不久前，我培训一位客户如何编程和操作他配备 Fanuc 控制系统的新 CNC 加工中心。他的产品相当简单，但包含大量铝制螺纹孔。这些孔非常小（最大的是 #3-48），穿透的材料厚度不超过
    1/8 英寸（通常要薄得多）。我还要补充一点，这位客户在手动加工方面非常有经验。然而，原本看似简短的培训课程却变成了为期两天的工作。这个问题在极细牙距攻丝中并不少见：*螺纹滑牙*。


    ### 螺纹滑牙


    我们尝试了我们共同经验所教给我们的一切，甚至更多。我们让工厂技术员检查了机床，使用了不同类型的浮动丝锥夹头（当时没有刚性攻丝功能），并尝试了不同几何形状、槽型和涂层的丝锥。我们尝试了不同的主轴转速、冷却液和底孔钻头尺寸——全都无济于事。放弃不是一个选项，所以我咨询了一位刀具专家。对于所有“你试过这个吗？”的问题，我都回答“试过”，只有一个问题除外。“你有没有试过以
    80% 进给、以 120% 退回？”我回答说没有，因为 G84 攻丝循环不允许改变进给率。我们确实尝试过降低进给，但没有尝试不同的进给率。在简短听取了这种相当不寻常方法的优点之后，我编写了一个测试程序，并在
    100% 主轴转速和进给率设置下进行了尝试。出乎所有人意料的是，它奏效了。下一步是将测试程序改为宏程序：


    ```gcode

    (#3-48 TAP)

    ...

    S800 M03

    G65 P8500 R0.15 Z-0.14 F16.6 (MACRO APPLIED WITH ARGUMENTS)

    ...

    ```


    ```gcode

    M03

    #3003 = 0  (SINGLE BLOCK MODE ENABLED)

    GOTO 999  (BYPASS ERROR MESSAGES)

    N991 #3000 = 991 (FEEDPLANE R NOT DEFINED)

    N992 #3000 = 992 (Z-DEPTH Z NOT DEFINED)

    N993 #3000 = 993 (FEED RATE F NOT DEFINED)

    N999 M99

    %

    ```


    该宏不仅展示了若干 3000 系列系统变量的用法，还展示了如何解决一个相对简单但恼人的小问题。还可以对该宏做进一步改进；例如，可以根据主轴转速和每英寸牙数或牙距在内部计算进给率。


    这件事还有另一个要点——利用许多刀具专家的知识。


    ![](img/0023bd5cc50494e6d7799ab76d437c8d_195_0.png)


    ## 设置新零件


    *2008年12月，2013年2月更新*


    CNC 机床操作员通常通过研究程序附带的文档来开始一项新工作，并以工程图纸作为主要信息来源。附加数据通常包含在设置单或刀具清单中，并附有设置的图形表示。本月我们来看看可用于各种类型
    CNC 机床的通用设置程序。


    ### 步骤 1：设置切削刀具。


    第一步使用零件程序中的刀具信息。CNC 操作员将切削刀具装入刀柄和相应的刀位，必要时将所有刀具号登记到控制存储器中。确保刀具锋利并正确安装在刀柄中。


    ### 步骤 2：设置夹具。


    用于夹持或支撑零件的夹具安装在机床上，找正并在必要时调整，但此时不安装零件本身。设置单作为文档使用，尤其是对于复杂设置。通常可能还需要夹具图纸。


    ### 步骤 3：设置零件。


    将零件定位到夹具中并确保其固定。检查设置中可能的干涉和障碍。障碍通常包括刀具与零件、机床或夹具的不期望接触。注意换刀期间的间隙。


    ### 步骤 4：设置刀具偏置。


    根据机床类型，此步骤负责设置刀具几何偏置和磨损偏置、刀具长度偏置以及刀具半径偏置（如适用）。此步骤最重要的部分之一是设置工件坐标系（工件偏置 G54 至 G59），或对于旧控制器设置刀具位置寄存器（G92
    或 G50），但不要两者都设置，即使两者都可用。工件偏置设置（车床的几何偏置）是迄今为止现代 CNC 机床设置中最好、最方便的选择。


    ### 步骤 5：检查程序。


    此步骤是对零件程序本身的第一次评估。待加工零件可以暂时从夹具中移出。由于所有偏置已在控制系统中设置好，可以按照所有常规注意事项准确检查程序。如有需要，可以使用操作面板上的程序倍率开关。通常要注意刀具运动，尤其要特别注意刀具索引/换刀动作。如果对编程刀具路径的任何方面不是绝对确定，请重复此步骤。


    ### 步骤 6：重新设置零件。


    如果上一步中移除了零件，现在应将其重新安装到夹具中。成功完成所有前面的步骤后，就可以继续试切第一个零件。此时，再检查一次刀具；还要检查油压和气压、夹钳、偏置、开关设置、卡盘以及任何其他重要的机床特征，以确保无误。


    ### 步骤 7：进行试切。


    有时可能需要进行实际试切，以确定编程的转速和进给是否合理，以及各种偏置是否设置正确。试切是一种临时或偶尔进行的切削，旨在识别实际偏置设置中的微小偏差，并允许对其进行更改。确保试切留下足够的材料用于实际加工。试切还有助于确定刀具偏置，使尺寸公差保持在限制范围内。


    ### 步骤 8：调整设置。


    此时，要最终完成任何必要的调整，以便在实际生产开始前对程序进行微调。此步骤包括最终偏置调整（通常是磨损偏置）。如有必要，这也是调整主轴转速和切削进给率的好时机。


    ### 步骤 9：开始生产批次。


    现在可以开始整批生产了。快速进行第二次双重检查可能再次证明值得花时间。运行新程序的理想方式（如果有的话）是先通过控制器图形显示运行它。它快速且准确，并在实际加工前提供很大的信心。此测试可以在各种有效倍率模式下运行，例如机床锁住或单段。在测试新程序时，不要低估零轴忽略和空运行等功能。不要期望任何刀具路径的图形显示
    100% 准确。没有显示能展示每一个细节，也没有仿真能显示飞溅的切屑。


    尽管所述各个步骤的编号暗示某种固定顺序，但该过程具有很大的灵活性。只需运用常识——过去的经验也有帮助。


