    The bar — this is not always a feasible solution, due to the part design and the
    necessity of a long boring bar. Choosing a carbide bar, rather than a steel bar,
    often helps.


    Another alternative is to purchase a special boring bar designed to dampen the
    vibration. Some homemade dampening bars can be made from steel bars with a drilled
    cavity filled with large size bearing balls (or carbide balls). This can also
    be an inexpensive option for some jobs. Otherwise, a change of setup, increasing
    the number of operations and/or tools may be the last resort. If the boring bar
    overhang is not the culprit, the problem may be overhang of the part itself.


    The part extended from the chuck also has its own limitations. Fortunately, an
    extended part can be supported by means of tailstock and/or steady rest or follow
    rest. Boring operations are not possible with supporting tailstock, and the alternative
    of a steady rest or follow rest attachment can provide the solution. Always make
    sure the boring bar is properly set in relationship of the tool tip and the part
    center line.


    Other common causes of chatter can be traced to a weak setup. Small depth of grip,
    insufficient support in the holding device, and wrong chip breakers should also
    be looked into as possible causes. In some less common cases, the machine tool
    itself can be the cause, particularly if it is poorly installed.


    ### Eliminating Chatter


    Separate from these ideas already presented, chatter can also be eliminated by
    the way machining operations are selected prior to boring. For example, if an
    external tool removes the bulk of material by roughing, it may also leave a thin
    stock left for boring. Thin stock should always be of concern, as it is another
    cause of chatter. Rearranging the order of operations (bore first, then turn)
    may eliminate the chatter. Cutting depth has also been known to cause chatter,
    and reducing it may help to eliminate chatter. Keep in mind that cutting depth
    works together with spindle speeds and feedrates, so they both have to be considered.


