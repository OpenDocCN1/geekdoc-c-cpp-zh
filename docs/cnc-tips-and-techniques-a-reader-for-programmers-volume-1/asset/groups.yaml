    \ hands of CNC programmers.\n\n## Threading Methods Compared\n\n![](img/0023bd5cc50494e6d7799ab76d437c8d_71_0.png)\n\
    \n*September 2005, updated February 2013*\n\nWhen it comes to single point threading\
    \ on CNC lathes, part programmers have several choices — three, in fact. The oldest\
    \ programming method was, and still is, a method that is also very time consuming.\
    \ This is the original block-by-block threading, using preparatory command G32\
    \ (also known as G33 on some controls). Because of the many calculations required\
    \ to prepare even a few simple threading passes, it did not take long for the\
    \ control developers to make the programming process a little shorter, and the\
    \ first threading cycle was born. This cycle is still known today by its preparatory\
    \ command G92. Although a significant improvement for its time, the G92 cycle\
    \ has not met the high expectations of part programmers and machine operators.\
    \ Finally, Fanuc has come up with a true gem — the G76 multiple repetitive threading\
    \ cycle. A bit of a mouthful for a description, G76 has quickly become the king\
    \ of single point threading. How does that position the other threading methods,\
    \ using the G32 and G92 commands? Is there still room for them?\n\n### The G32\
    \ Method\n\nThe G32 method of thread cutting is also known as the “long hand”\
    \ method — and long it can be. The most fundamental understanding of G32 is that\
    \ it is not a cycle of any kind. It is a plain programming of each and every step\
    \ in the threading process. Take a typical single pass of a thread; it has four\
    \ parts. From the start position, the tool will rapid to the diameter to be threaded,\
    \ then the threading itself will take place. Next, the tool has to retract away\
    \ from the thread and, finally, it must return back to the start position.\n\n\
    These four parts represent four blocks of the program. With seven passes, for\
    \ example, the threading motions will only take twenty-eight blocks of the program.\
    \ For the best results, each\n"
  mdcn: "\n编程的 G54 工件偏置由 CNC 操作员用来设定程序零点，G52 用于将这个零点*偏移*到其他位置，通常是临时性的。真正的优势在于，G52\
    \ 的实际设定由零件程序控制（而 G54 偏置的实际设定是在设置过程中通过机床控制面板输入的）。使用 G52 不需要费太多力，但要成功使用它，有三个条件很重要：\n\
    \n-   G52 始终在当前工件偏置（例如 G54）内起作用\n-   G52 不会引起轴运动——它只调整当前工件偏置\n-   编程时必须知道 G52\
    \ 所用的零点偏移量\n\n第一个条件解释了 G52 定义的含义——*局部坐标系从属于另一个坐标系*。编程 G52 只需要给出由工件偏置（G54）确定的程序零点与新位置之间的差值量。例如，程序中的\
    \ **G52 X2.0 Y1.0** 程序段会将程序零点分别在 X 和 Y 方向偏移 2 英寸和 1 英寸，从*当前*程序零点（由 G54 设定）向正方向偏移。在\
    \ G52 生效期间，这个新位置就是用于所有计算目的的程序零点。要取消零点偏移，只需编程一个包含零值的程序段——G52 X0 Y0——原来的程序零点（由 G54\
    \ 工件偏置设定）就会恢复正常。\n\n请记住，执行 G52 偏移时不会发生轴运动。在控制单元中发生的全部事情，就是按 G52 程序段中指定的量临时更新内部工件偏置设定。还要记住，由于\
    \ G52 是可编程指令，编程时*必须知道*偏移量。G52 的主要用途是在单个零件*内部*使用。它也可以用于在位于机床工作台上的不同零件之间偏移零点，前提是这些零件的精确位置已知。如果其他零件的位置是随机的，就使用不同的工件偏置，例如第一个零件用\
    \ G54，第二个零件用 G55，依此类推。\n\n局部坐标系指令 G52 既可用于加工中心，也可用于车床。其主要优势是，它允许 CNC 操作员将程序零点设定在更方便或更易到达的位置，同时也为\
    \ CNC 编程人员提供了一种更轻松计算刀具路径坐标的方法。对生产过程双方而言，其结果都是最大限度地减少可能的错误，无论是编程错误还是设置过程中可能发生的错误。\n\
    \n通过 G52 指令偏移程序零点并不是唯一可用的方法。另一个可以使用的指令是 G10——*数据设定指令*。这将是另一篇文章的主题。\n\n![](img/0023bd5cc50494e6d7799ab76d437c8d_68_0.png)\n\
    \n## 偏移程序零点——第 2 部分\n\n*2005 年 8 月，2013 年 2 月更新*\n\n另一篇文章介绍了在 CNC 程序中用 G52 方法偏移程序零点（零件零点）。现在我们来看另一种非常强大的方法，即使用数据设定指令\
    \ G10。G52 指令不会改变控制系统中存储的偏置实际设定，并且只能在一个工件偏置生效时使用。从这个意义上说，G52 是真正的零件零点偏移指令。\n\n\
    ### G10——数据设定指令\n\n尽管 G10 也用于偏移程序零点，但它可用于更改*任何偏置*，而不仅仅是当前生效的工件偏置。从这个意义上说，G10 提供了更多可能性，也将更多责任交到编程人员手中。无论其实际应用如何，G10\
    \ 始终会更改所选偏置的当前设定，无法撤销，也无法自动恢复到之前的设定。仅这一点就足以成为深入理解数据设定指令的充分理由。三组偏置都可以由 G10 更改——工件偏置、刀具长度偏置和刀具半径偏置。如果使用绝对编程模式（G90），受\
    \ G10 影响的偏置将被*替换*；如果使用增量编程模式（G91），受 G10 影响的偏置将被*更新*。\n\nG10 指令本身不区分这三组偏置——它需要附加参数。例如，要选择工件偏置，编程输入格式为\
    \ **G10 L2 P.. X.. Y.. Z..**。这里，L2 表示任意工件偏置组号，*P* 地址选择六个标准工件偏置中的哪一个将受到影响。*P1*\
    \ 是 G54，*P2* 是 G55，依此类推。*X.. Y.. Z..* 参数包含替换（在 G90 模式下）或更新（在 G91 模式下）所选工件偏置的量。对于刀具长度偏置，情况类似。例如，程序中的\
    \ **G10 L10 P.. R..** 将更改由 *P..* 地址指定的刀具长度偏置的几何偏置设定。*R..* 指定实际更改量——同样是替换或更新。要对刀具长度磨损偏置进行类似更改，*L10*\
    \ 将替换为 *L11*。要更改存储的半径偏置，将使用 *L12* 或 *L13*，后跟调整量。根据具体控制型号，有几种替代方式。\n\n如你所见，G10\
    \ 对新用户来说可能有点令人生畏，并且常被视为高级指令。为了至少说明一个示例，让我们回到 G54 中的零点偏移。编程人员通常不知道工件偏置，因此 G10 将反映*从当前设定开始*、按指定距离和方向进行的偏移（公制单位）：\n\
    \n```\nCurrent G54 setting (unknown to the programmers):\nX-400.000 Y-350.000\
    \ Z0.000\n\nA programmed block G91 G10 L2 X15.0 Y12.0 will change\nthe current\
    \ setting of G54 to a new setting:\n\nG54 setting after G10 is processed:\nX-385.000\
    \ Y-338.000 Z0.000\n```\n\n## 编程人员读本\n\n尽管编程人员不知道控制系统中的实际设定，但他们知道原始程序零点已分别沿 X\
    \ 轴和 Y 轴偏移了 15 mm 和 12 mm。为了使 G54 恢复到原始设定，G10 将包含相反的量：\n\n将 G54 设定恢复为原始程序零点： \
    \ \n**G91 G10 L2 X-15.0 Y-12.0**\n\n偏移程序零点并不是 G10 的唯一目的——通过程序更改半径偏置也是一个非常强大的应用。以典型的粗加工和精加工轮廓刀具路径为例。通常，会使用两个偏置号，CNC\
    \ 操作员负责在控制系统中完成这两项设定。使用 G10，精加工刀具路径可以包含余量，从而实际上使其成为粗加工刀具路径。例如，半径偏置 D51 的当前设定为\
    \ 0.5000（英制单位）。\n\n程序段 **G91 G10 L13 P51 R0.03** 会将 D51 的当前半径量设定更改为 0.5300，为精加工刀具留出\
    \ 0.03 的余量。在精加工刀具生效之前，程序段 **G91 G10 L13 P51 R-0.03** 将恢复原始设定。\n\n无论是由 G10 指令更改工件偏置、刀具长度偏置还是刀具半径偏置，它为富有想象力的\
    \ CNC 编程人员提供的机会都是巨大的。这两篇文章的目的是鼓励 CNC 编程人员超越更传统的编程方法。G52 和 G10 都提供了一个很大的好处——它们通过取消传统上由\
    \ CNC 操作员完成的偏置设定，并将其交到 CNC 编程人员手中，从而增强了对加工过程的控制。\n\n## 车螺纹方法比较\n\n![](img/0023bd5cc50494e6d7799ab76d437c8d_71_0.png)\n\
    \n*2005 年 9 月，2013 年 2 月更新*\n\n在 CNC 车床上进行单点车螺纹时，零件编程人员有几种选择——事实上是三种。最古老的编程方法过去是、现在仍然是一种非常耗时的方法。这就是最初逐段编程的车螺纹方法，使用准备指令\
    \ G32（在某些控制系统中也称为 G33）。由于即使准备几个简单的车螺纹行程也需要大量计算，控制系统开发者很快就设法缩短了编程过程，于是第一个车螺纹循环诞生了。这个循环今天仍以其准备指令\
    \ G92 而闻名。尽管 G92 循环在当时是一个重大改进，但它并未达到零件编程人员和机床操作人员的高期望。最后，Fanuc 推出了一颗真正的明珠——G76\
    \ 多重重复车螺纹循环。G76 的描述有点拗口，但它迅速成为单点车螺纹之王。那么，使用 G32 和 G92 指令的其他车螺纹方法处于什么位置呢？它们还有存在的空间吗？\n\
    \n### G32 方法\n\nG32 车螺纹方法也称为“长写法”——而且确实可能很长。对 G32 最基本的理解是：它根本不是任何循环。它是对车螺纹过程中每一步的普通编程。以典型的一次螺纹走刀为例，它包含四个部分。从起始位置开始，刀具快速移动到要车螺纹的直径处，然后进行车螺纹本身。接下来，刀具必须从螺纹处退刀，最后必须返回起始位置。\n\
    \n这四个部分代表程序中的四个程序段。例如，七次走刀时，车螺纹运动将只占用程序中的二十八个程序段。为了获得最佳结果，每一\n"
