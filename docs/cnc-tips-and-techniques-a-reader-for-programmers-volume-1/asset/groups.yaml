    ## Programming Process — When Is It Completed?


    *October 2007, updated February 2013*


    Regardless of which type of CNC programming is used in a machine shop — manual
    or computer assisted — the basic programming process is generally the same. Start
    with the drawing; evaluate material; choose tools and setup, cutting conditions,
    and toolpath; and write the program. When a CNC program is fully completed and
    released to the machine shop for production, it seems that the programming process
    is over and the part programmers usually move on to another project. After all,
    calculations have been done, decisions have been made, the program has been written,
    it is well documented, and the program file is on the way to the CNC machine.
    Is the programmers’ job for such a part really finished? Is there some possibility
    that could bring the program back for some reason, perhaps with an operator’s
    comments, suggestions, or even some constructive criticism?


    ### The Programmer’s Role


    Of course, if the part program works perfectly, without any changes, the programmers
    will usually not hear a word from any direction. On the other hand, the programmers
    will hear negative comments and criticism from all directions. So, the question
    is: When is the programmer’s responsibility for a particular part really over?
    At what point in the manufacturing process can the programming results be evaluated?
    At what point can the program qualify as a very good (or even perfect) program?


    The most likely answer, and probably the fairest and most reasonable answer, would
    be whenever the part has been machined under the most optimized working conditions.
    This means that the programming responsibility does not end with the initial program
    and documentation delivery to the shop. The part program at this stage is still
    very much in the development process; it is unproven. It still has to be loaded
    to the CNC system. The machine has to be set up, cutting tools mounted and measured,
    and a variety of small jobs completed before the first part can be started. Then,
    the program has to be proven, possibly optimized. True, all these tasks are the
    sole responsibility of the CNC operators, so there is no need for the programmers
    to care what happens during machining, right? Not really.


    ### Working with Operators


    CNC operators can only work with a program as provided; they can be expected to
    make only minor optimization changes, if necessary. All CNC programmers should
    make an effort to be in constant touch with the actual production team. A good
    comparison is with the field of complex business software development. In this
    environment, it is necessary to have a team of specialists working on a certain
    large programming project, where all individual parts have to fit together flawlessly.
    After all, most programming ideas are the result of talking to colleagues and
    the actual users of the program or particular software.


    The same is true for CNC programs used in machine shops. The actual users of part
    programs are typically CNC machine operators. They are directly involved in the
    actual production, and they provide a very deep gold mine of constructive ideas,
    improvements, and suggestions. Talk to them, ask questions, provide suggestions,
    and — most important — listen to what they have to say. Programmers who never
    put their foot in the machine shop or who go there reluctantly are on the wrong
    track. The same is true for programmers who go to the machine shop with their
    eyes closed and their ears plugged, and programmers who take the attitude that
    they are always right.


    Exchanging ideas with CNC machine operators, asking questions, and seeking answers
    is the only way to be fully informed about what is actually going on in the machine
    shop. It is in the programmers'' own interest to know how the CNC operators feel
    about their programs, the programming style, and their approach to CNC programming
    overall. Exchange thoughts and communicate with each other — that is the best
    way to become a better CNC programmer (as well as CNC operator). Most machine
    shops offer tremendous resources, take advantage of them.


    These days, more than ever, CNC technology is an instrument to improve productivity
    with a minimal human involvement, measured at least by the physical level. As
    with any other technology, it must be understood and managed intelligently, by
    qualified people with experience. Without a firm grip and good control, without
    good management, and without the right attitudes, the technology will not yield
    the expected results; in fact, it will become counterproductive.


    In order to develop high quality programs, CNC programmers must have certain qualities
    of their own. The quality of actual parts produced is measurable. Is the quality
    of CNC programming also measurable? We look at this subject in the essay *Quality
    in CNC Programming*.

