    ## 标准攻丝与刚性攻丝——第 1 部分


    *2005 年 12 月，2013 年 2 月更新*


    在这篇分为两部分的文章中，我们探讨在 CNC 加工中心上加工螺纹孔的两种常用方法。第一部分重点介绍使用浮动丝锥夹头进行攻丝，第二部分则讨论刚性攻丝这一主题。


    在传统铣床、车床和 CNC 机床上进行攻丝，一直是加工孔的基本操作之一。时至今日，尽管存在种种缺点，最常见的攻丝方法之一仍是使用特殊的攻丝头，即所谓的*拉伸-压缩*式攻丝头。这类工具的另一个名称是*浮动丝锥夹头*。


    ### 标准攻丝方法


    在典型的拉伸-压缩式丝锥夹头中，丝锥被牢固夹持，因此不会掉落，但又足够松动，以便在进入钻孔时提供轴向柔性。孔中的螺纹由丝锥的尺寸和形状形成。浮动丝锥夹头虽然仍非常流行，但存在一个主要问题——难以保持精确的螺纹深度，尤其是在盲孔中。


    ### 基本原理


    标准攻丝的主要原理是主轴转速与攻丝进给率的同步。这是通过将主轴转速（r/min）乘以丝锥导程（螺距）来实现的，从而得到每分钟进给率。在切削开始时，丝锥必须从零进给率加速到相当大的进给率。达到编程进给率所需的时间称为*加速*。为了在与材料接触之前达到编程进给率，丝锥必须从离孔更远的位置开始——这就是固定循环中的
    R 平面。当丝锥进入孔时，会遇到阻力，丝锥被稍微推入夹头（利用其压缩能力）。当丝锥到达孔底且主轴停止时，主轴减速会迫使丝锥稍微从刀夹中拉出（利用夹头的拉伸作用）。


    程序员读本


    标准攻丝几乎总是使用两种攻丝循环之一来编程：G84（右旋攻丝）和 G74（左旋攻丝）。正如您将在本文第二部分中看到的，许多控制系统以原样提供或稍作修改的方式支持刚性攻丝的相同格式。主要差异与其说在编程技术上，不如说在机床设计和合适的刀具上。


    ### 为何要欠进给？


    大多数有经验的 CNC 程序员在职业生涯中都遇到过各种攻丝问题。浮动丝锥夹头至少可以说是一种不完美的工具。它是一种机械装置，因此会受到一些变量的影响，包括主轴波动。如果攻丝操作第一次不成功（假设程序原则上正确），程序员通常会使用一种简单的技巧来快速修正：降低攻丝进给率。这种降低被称为欠进给，因为它低于正常的攻丝进给率，而正常值始终是
    r/min × 螺距。以下是这种技巧常常奏效的原因。


    大多数主轴可能出现高达 ±10 r/min 的波动，尤其是在高速时。由于攻丝进给始终是主轴转速与丝锥螺距之间的直接关系，任何主轴波动都会使这种关系失衡。当浮动夹头中的丝锥进入孔时，在丝锥有机会“咬入”材料之前，它会被稍微推入夹头。这是攻丝的压缩部分。当丝锥到达
    Z 深度时，主轴会停止，但并非立即停止；它必须先减速。为了防止丝锥折断，在 Z 轴运动停止后，浮动夹头允许丝锥靠自身的作用力稍微从夹头中拉出。这部分称为拉伸。压缩意味着推；拉伸意味着拉。现在回到主轴波动的问题。


    CNC 技巧与技术


    拿一个浮动丝锥夹头，试着推一下、再拉一下夹持丝锥的部件。将其拉出比推入要容易得多。用技术术语来说，这意味着拉伸即使有问题，也更少。为了消除丝锥进入或退出时的螺纹损伤，可以将进给率降低
    2% 至 5%，即在名义攻丝进给率的 98% 至 95% 之间。在这种情况下，丝锥从丝锥夹头中受到拉力，并补偿主轴转速差异。


    请记住，使用浮动丝锥夹头时轻微欠进给并不总是改善攻丝的解决方案，但在某些情况下，它可能是最快的解决方案。


    浮动丝锥夹头正逐渐被淘汰。尽管它们已为行业服务多年，但一项较新的技术已成为标准。自 20 世纪 90 年代初引入刚性攻丝以来，攻丝方法和技术已发生巨大变化。本专栏将讨论刚性攻丝这一主题。

