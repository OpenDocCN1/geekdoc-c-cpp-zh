    # Program Comments and Listing


    The center of scaling is the part middle point at X37.5 Y37.5. The key to a successful
    solution is to place the common toolpath into a subprogram, with one important
    feature - the tool must return to the original start point, after the scaling
    has been turned off - see block N115. It appears that the tool is at that position
    already - see X95.0 in block N112 and Y37.5 in block N113. That is not the case
    when scaling is in effect.


    Look at both the program and the subprogram carefully - their structure is very
    important.


