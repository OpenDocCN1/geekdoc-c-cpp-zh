  - '[PAGE 97]


    seldom, if ever, used in a typical part program. Command G27 is a machine zero
    position check. It is programmed with one or more axes and checks whether the
    position specified corresponds to machine zero position. If not, the program processing
    stops and alarm is raised by the control. Its practical application has ceased
    with the demise of G92 (G50) programming (*position register*). There is no need
    for this command in a program that uses work offsets (G54 to G59 or higher). G29
    is the opposite of G28/G30. Whereas G28/G30 represents a motion to machine zero
    via an intermediate point, G29 is a *motion from machine zero to a specified position
    via an intermediate point*. This command is virtually useless in typical programs.


    # Additional Codes


    Another virtually useless command is G44 (*tool length offset negative*). It may
    have its adherents, but there is nothing that the ubiquitous G43 command (*tool
    length offset positive*) cannot achieve.


    A command that may be somewhat of a puzzle is G31, defined simply as the *Skip
    command*. This command is indeed a very special one because it is exclusively
    used with probing on CNC machines (in-process gauging). Its purpose is to move
    the probe from a clear position, at a feedrate (just like G01), to a position
    to be probed. Once the probe detects a contact with the material, the motion stops
    and the remainder of the motion is not completed; it is *skipped*, hence the command
    name.


    # G6x Codes


    Finally, there are several G-codes in the G6x range, namely G60 (*Single direction
    positioning*), G61 (*Exact stop check mode*), G62 (*Automatic corner override
    mode*), G63 (*Tapping mode*), and G64 (*Normal cutting mode*). The default is
    G64, normal cutting mode.


    G61 is the modal version of G09, and can be useful for increased precision when
    a tool has to move around a sharp corner at a high feedrate, particularly if the
    corner forms a narrow'
  - '[PAGE 98]


    angle. **G62** may improve the surface finish when used to cut sharp inner corners
    in cutter radius offset mode. Its function is to automatically adjust the cutting
    feedrate. A tapping mode programmed with **G63** disables the feedrate override
    and the feed-hold button, and **G64** returns the cutting motions to their original
    programmed mode. Each mode selected replaces any other mode.


    **G60** stands separately. Its purpose is to force a unidirectional tool positioning,
    regardless of which direction the tool comes from. It can be used to compensate
    for some minor backlash, but it does *not* remove it. Backlash problems require
    qualified service technicians.


    There may be other G-codes not commonly used, but the ones mentioned in this column
