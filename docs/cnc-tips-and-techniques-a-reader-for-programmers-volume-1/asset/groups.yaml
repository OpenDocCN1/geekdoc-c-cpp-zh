    # Readings From 2005


    ![](img/0023bd5cc50494e6d7799ab76d437c8d_60_0.png)


    # Minimizing Program Length


    *May 2005, updated February 2013*


    In the past, the topic of handling long programs has focused on running such programs
    efficiently at the machine, during the actual part production with DNC support.
    Long programs are often the result of a CAM output, but they are also developed
    manually in many cases. Keep in mind that the word *long* is quite often relative
    to the amount of work involved and the available control memory capacity. CNC
    lathes, for example, have much smaller memory capacity than CNC machining centers.
    In either case, CNC programmers have several methods at their disposal that will
    make long programs shorter. Using the methods suggested in this column, it may
    often be possible to fit a long program into the control memory, without using
    the DNC method. Various methods are available to reach this goal and they can
    be adopted before the program is developed or after the program has been developed.


    In CAM programming, the main key to quality program output is a quality post processor.
    The purpose of a post processor in CAM software is to provide a customizable platform
    for the desired program output. The same thoughts and efforts that go into post
    processor customization will also be considered in manual programming. There is
    no magic here — if you want to shorten the program, you must do it *without losing
    its integrity and purpose*. Removing an operation from a program will certainly
    make the program shorter, but the price may be too high to pay. When developing
    the CNC program, look at various features that offer shorter output right from
    the box, so to speak. They include various fixed cycles, multiple repetitive cycles,
    subprograms, macros, counters, and automatic corners. Starting with a program
    that is already as short as possible, it makes any subsequent effort that much
    more effective. Let’s look at some options available.


    ## Eliminating Characters


    Once all possible methods have been used to make the program shorter from the
    beginning, there is only one more method left — *to eliminate all unnecessary
    characters* from the program. Yes, eliminating one character at a time will often
    work miracles on the final program length. You will need a good text editor, preferably
    one designed for editing of CNC files. Text editors offer a feature called *mass
    substitution* (commonly known as the *find and replace feature*). Always work
    on a copy of the program, in case something goes wrong. Also, never make changes
    to the program that would negatively affect machining safety. Initial planning
    is important and the knowledge of program formatting is imperative. Here are the
    main areas that should be considered as methods suitable for reaching the goal
    of a shorter program:


    - Elimination or optimization of block numbers (sequence numbers)

    - Removing program comments

    - Removing unnecessary zeros

    - Joining single-axis motions into multi-axis motions (if safety allows)


    ### Block Numbers


    *Block numbers* are almost always used for convenience, except in some special
    applications, such as multiple repetitive cycles or macro statements. Eliminating
    block numbers will make the most significant reduction in any program size. If
    you don’t feel comfortable about eliminating all block numbers, use only one block
    number per tool, perhaps for the purpose of searching. Using block numbers in
    increments of one is more economical than common increments of five or ten, as
    fewer characters are stored.


    # Conversion of Lathe Cycles


    *June 2005, updated February 2013*


    Most CNC lathe programmers would agree that the most useful features of a CNC
    lathe control system are the *multiple repetitive cycles*. Multiple repetitive
    cycles for CNC lathes have been an important part of control systems since the
    mid 1980s. Still, to this day, they present the most innovative approach of material
    removal, particularly in the areas of turning, boring, and threading. Over the
    thirty years of their existence, multiple repetitive cycles have gone through
    only two major changes. Earlier controls require these cycles to be programmed
    in a single block, later controls require two blocks of program input. This difference
    in programming method often presents a situation when one type has to be converted
    to another type — usually from a single block format to the double block format.


    ## Converting Formats


    To start, let’s look at the word *convert*. Changing from one format to another
    is not a true conversion or — at least, it is not a complete conversion. The reason
    is that a double block format offers more features than a single block format.
    Also, keep in mind that you have no choice here; the control system determines
    the programming method. Typically, FANUC control models 10/11/15 use a single
    block format, other control models (0/16/18/20/21...) use the double block format.
    What cycles are affected? All multiple repetitive cycles from G71 to G76 can be
    programmed in one or the other format, depending on the control. The finishing
    cycle G70 always uses a single block format.


    ### Single Block Format


    The single block format is the older of the two, and relies heavily on the settings
    of system parameters, generally inaccessible to the machine operator. I will use
    the most commonly used G71 and G76 cycles as examples in this column; other cycles
    follow. The following data:


    ```

    G76 X.. Z.. I.. K.. D.. A.. F..

    ```


    In this case, X specifies the final thread diameter, Z is the position of the
    thread end, I specifies the amount of taper (if used), K is the thread depth,
    D is the depth of the first pass, A is the thread angle, and F is the thread lead
    (feedrate). The two-block version packs in a few more programmable features:


    ```

    G76 P.. Q.. R..

    G76 X.. Z.. R.. P.. Q.. F..

    ```


    The *P* address in the first block includes the number of finishing passes, the
    length of the lead for pullout at the thread end, and the thread angle all in
    one. The *Q* address specifies the minimum cutting depth, and R is the finish
    allowance. In the second block, X and Z are the same as before, R specifies the
    amount of taper (if used), *P* is the thread depth, *Q* is the depth of the first
    pass, and F is the thread lead (feedrate). Neither *P* nor *Q* in the second block
    accept a decimal point.


    As you see from the two examples, the main difference between the two cycle formats
    is the additional programmable parameters, which make the cycles much more flexible
    than using internal parameter settings. In either double block cycle, do not confuse
    the addresses in the first block with the same addresses in the second block.
    As you see, the *conversion* from a single block format to a double block adds
    certain features that are now programmable, offering more flexibility to the CNC
    programmer.

    '
