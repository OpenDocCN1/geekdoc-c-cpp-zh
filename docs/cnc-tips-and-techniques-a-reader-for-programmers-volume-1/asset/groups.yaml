    There is a fairly common practice among programmers to match the tool length offset
    number (address H) to the tool number (address T). For example, programming T03
    along with H03 makes sense, as only one tool length offset is normally required
    per tool. When it comes to the cutter radius offset, the D offset number can also
    be the same, providing the control has a separate register for each offset group.
