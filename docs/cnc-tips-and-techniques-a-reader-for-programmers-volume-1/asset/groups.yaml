    The next step is to convert the macro call G65 to a new G-code (G13). This choice
    is suitable because this type of macro is a true machining cycle. To make it appear
    as a cycle in the program, a G-code that has not been assigned must be selected.
    To make the macro a true cycle, two changes are required. The first change must
    be selection of a special macro number from the allowed range of ten possibilities:
    O9010 to O9019. That means'
