    ```

    N1 T0100 (0.1 X 45 CHFR - MANUAL CHAMFER)

    N2 G96 S300 M03

    N3 G00 G42 X4.0 Z0.1 T0101 M08

    N4 G01 Z-2.0 F0.01

    N5 X5.8

    N6 X6.0 Z-2.1

    N7 Z-3.0

    ...

    ```


    The second example shows the same program modified for automatic chamfering (block
    N5 makes the chamfer):


    ```

    N1 T0100 (0.1 X 45 CHFR - AUTOMATIC CHAMFER)

    N2 G96 S300 M03

    N3 G00 G42 X4.0 Z0.1 T0101 M08

    N4 G01 Z-2.0 F0.01

    N5 X6.0 C-0.1 (SHARP CORNER)

    N6 Z-3.0 (CONTINUES IN Z-NEGATIVE DIRECTION)

    ...

    ```


    The C-command in block N5 is the *chamfering vector* indicating the actual chamfer
    size. Note that the X6.0 indicates the diameter to reach (sharp point), as per
    drawing — no start/end points are required. When the control encounters a block
    containing the chamfering vector, it will automatically shorten the toolpath length
    by the C-vector amount. The vector sign is important. A positive C-vector means
    the chamfer is cut into the positive direction; a negative C-vector means the
    chamfer is cut into the negative direction (applies to both X and Z axes).


    Even more effective is using the automatic chamfering for a blend radius. A blend
    radius between shoulder and diameter (or vice versa) is programmed in a very similar
    way as the chamfer vector, using the R-vector. Although the R-vector is a radius,
    *it is used in the G01 mode!* As with the C-vector for chamfering, the R-vector
    also requires a positive or negative direction. The example below shows the previous
    example modified to cut an R0.1 blend radius:


    ```

    N1 T0100 (R0.1 FILLET - MANUAL RADIUS)

    N2 G96 S300 M03

    N3 G00 G42 X4.0 Z0.1 T0101 M08

    N4 G01 Z-2.0 F0.01

    N5 X5.8

    N6 G03 X6.0 Z-2.1 R0.1

    N7 G01 Z-3.0

    ...

    ```


    Using the automatic corner radius, the program is much easier to write:


    ```

    N1 T0100 (R0.1 FILLET - AUTOMATIC RADIUS)

    N2 G96 S300 M03

    N3 G00 G42 X4.0 Z0.1 T0101 M08

    N4 G01 Z-2.0 F0.01

    N5 X6.0 R-0.1 (SHARP CORNER)

    N6 Z-3.0 (CONTINUES IN Z-NEGATIVE DIRECTION)

    ...

    ```


    Both methods are based on the same principles and use the same rules:


    - The chamfer must have a 45-degree angle and the radius must have a 90-degree
    sweep angle, in a single quadrant.

    - The programmed amounts of corner vectors are always *per side*, not diameter.

    - The cutting direction *before* a corner break must be perpendicular to the cutting
    direction *after* the corner break.

    - The cutting direction following the corner break must continue along a single
    axis only. It must be at least as long as the corner amount — it cannot reverse.


    Plane selection is not relevant in rapid and linear motions. (Motion will take
    place as specified.) The situation is much different for programming that involves
    the following three machining modes:


    - Circular motion G02 or G03

    - Cutter radius offset G41 or G42

    - Fixed cycles using the G81-G89 plus G73, G74, and G76 commands


    ### Defining the Plane


    Only in these three cases do the CNC programmers have to watch for the currently
    active plane. A plane is always defined by two primary axes. Circular motion is
    the most suitable for understanding the concept; the principles apply to cutter
    radius offset and fixed cycles equally. Planes in CNC applications follow the
    standard mathematical definitions. The easiest way to understand mathematical
    definitions is to write the letters XYZ twice in succession then split the six
    letters into three pairs:


    XYZXYZ ... XY ZX YZ, which define G17 as XY plane, G18 as ZX plane, and G19 as
    YZ plane.


    To illustrate the concept of planes, consider the following program segment for
    a simple 180-degree arc:


    ```

    G01 X20.0 Y35.0 F200.0

    G02 X56.0 R18.0 (ONLY ONE AXIS SPECIFIED)

    G01 X75.0

    ```


    There is only a single axis specified with the 18 mm radius. How does the control
    interpret this block? An arc always requires two axes. Is the missing axis Y or
    is it Z? The plane selection in the program command provides the answer. If G17
    is active, the missing axis is Y; if G18 is active, the missing axis is Z. G19
    is not applicable because it does not involve the X-axis.


    ## A Reader for Programmers


    In summary, keep in mind that G00 and G01 modes are independent of plane selection,
    and G17 and G19 match the machine planes. The only plane to pay special attention
    to is G18. Also keep in mind that any plane has to be viewed in such a way that
    the first letter of the mathematical plane indicates the horizontal axis positive
    direction.


