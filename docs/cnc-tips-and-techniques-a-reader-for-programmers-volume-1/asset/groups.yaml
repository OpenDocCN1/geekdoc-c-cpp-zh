    ```

    N1 T0100 (0.1 X 45 CHFR - MANUAL CHAMFER)

    N2 G96 S300 M03

    N3 G00 G42 X4.0 Z0.1 T0101 M08

    N4 G01 Z-2.0 F0.01

    N5 X5.8

    N6 X6.0 Z-2.1

    N7 Z-3.0

    ...

    ```


    第二个示例展示了同一程序为自动倒角而修改后的版本（程序段 N5 执行倒角）：


    ```

    N1 T0100 (0.1 X 45 CHFR - AUTOMATIC CHAMFER)

    N2 G96 S300 M03

    N3 G00 G42 X4.0 Z0.1 T0101 M08

    N4 G01 Z-2.0 F0.01

    N5 X6.0 C-0.1 (SHARP CORNER)

    N6 Z-3.0 (CONTINUES IN Z-NEGATIVE DIRECTION)

    ...

    ```


    程序段 N5 中的 C 指令是*倒角矢量*，表示实际倒角尺寸。注意，按照图纸，X6.0 表示要达到的直径（尖点）——不需要起点/终点。当控制系统遇到包含倒角矢量的程序段时，它会自动将刀具路径长度缩短
    C 矢量所表示的量。矢量的符号很重要。正 C 矢量表示倒角切入正方向；负 C 矢量表示倒角切入负方向（适用于 X 轴和 Z 轴）。


    更有效的是使用自动倒角来实现过渡半径。台肩与直径之间（或反之）的过渡半径，使用 R 矢量以与倒角矢量非常相似的方式编程。尽管 R 矢量是一个半径，*但它是在
    G01 模式下使用的！* 与用于倒角的 C 矢量一样，R 矢量也需要正方向或负方向。下面的示例展示了将前一个示例修改为切削 R0.1 过渡半径：


    ```

    N1 T0100 (R0.1 FILLET - MANUAL RADIUS)

    N2 G96 S300 M03

    N3 G00 G42 X4.0 Z0.1 T0101 M08

    N4 G01 Z-2.0 F0.01

    N5 X5.8

    N6 G03 X6.0 Z-2.1 R0.1

    N7 G01 Z-3.0

    ...

    ```


    使用自动转角半径，程序编写起来容易得多：


    ```

    N1 T0100 (R0.1 FILLET - AUTOMATIC RADIUS)

    N2 G96 S300 M03

    N3 G00 G42 X4.0 Z0.1 T0101 M08

    N4 G01 Z-2.0 F0.01

    N5 X6.0 R-0.1 (SHARP CORNER)

    N6 Z-3.0 (CONTINUES IN Z-NEGATIVE DIRECTION)

    ...

    ```


    这两种方法基于相同原理并使用相同规则：


    - 倒角必须为 45 度角，半径必须为 90 度扫掠角，且位于单一象限内。

    - 转角矢量的编程量始终是*每边*，而不是直径。

    - 转角断开*之前*的切削方向必须垂直于转角断开*之后*的切削方向。

    - 转角断开之后的切削方向必须仅沿单一轴继续。它必须至少与转角量一样长——不能反向。


    平面选择在快速运动和直线运动中不相关。（运动将按指定进行。）对于涉及以下三种加工模式的编程，情况则大不相同：


    - 圆弧运动 G02 或 G03

    - 刀具半径补偿 G41 或 G42

    - 使用 G81-G89 以及 G73、G74 和 G76 指令的固定循环


    ### 定义平面


    只有在这三种情况下，CNC 程序员才必须注意当前有效的平面。平面总是由两个主轴定义。圆弧运动最适合理解这个概念；这些原理同样适用于刀具半径补偿和固定循环。CNC
    应用中的平面遵循标准数学定义。理解数学定义最简单的方法是将字母 XYZ 连续写两遍，然后将这六个字母分成三对：


    XYZXYZ ... XY ZX YZ，它们定义 G17 为 XY 平面、G18 为 ZX 平面、G19 为 YZ 平面。


    为了说明平面的概念，考虑下面这个简单 180 度圆弧的程序段：


    ```

    G01 X20.0 Y35.0 F200.0

    G02 X56.0 R18.0 (ONLY ONE AXIS SPECIFIED)

    G01 X75.0

    ```


    在 18 mm 半径中只指定了一个轴。控制系统如何解释这个程序段？圆弧总是需要两个轴。缺失的轴是 Y 还是 Z？程序指令中的平面选择提供了答案。如果 G17
    有效，缺失的轴是 Y；如果 G18 有效，缺失的轴是 Z。G19 不适用，因为它不涉及 X 轴。


    ## 程序员读者来信


    总之，请记住 G00 和 G01 模式与平面选择无关，并且 G17 和 G19 与机床平面一致。唯一需要特别注意的平面是 G18。还要记住，观察任何平面时，都必须使数学平面的第一个字母表示水平轴的正方向。


