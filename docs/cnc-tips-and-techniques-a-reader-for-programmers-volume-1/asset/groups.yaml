    # ## When 1 Thou Equals 65 Dollars


    *October 2005, updated February 2013*


    One of my clients considers himself a master hole-maker and is proud of it, and
    quite rightly. He is at the top in all the latest drill technology, skills, and
    equipment. Making holes is his business in a very competitive field, and being
    number two in the area is not an option. Recently he was working on a part similar
    to tube sheet plates for heat exchangers — thousands of holes, quite deep. Watching
    the process was quite an experience and reminded me how other companies handle
    programs for such a large number of holes. Let''s leave our master hole-maker'
  - "[PAGE 74]\n\nand have look at this situation in more detail.\n\n# ## G73 and\
    \ G83 Cycles\n\nSpecial drills do exist that allow drilling deep holes to the\
    \ full depth without peck drilling on CNC machining centers. In the absence of\
    \ such drills, the common practice is to program a fixed cycle — the standard\
    \ G73 or G83 cycle — that is designed for such purpose. The G73 cycle is more\
    \ suitable for breaking the chips because it does not retract above the part after\
    \ each peck, only when the drill reaches the final depth. If you need to flush\
    \ chips or get some more coolant into the hole, the G83 cycle may be a better\
    \ choice.\n\nOn Fanuc and similar controls, either cycle requires the Z-axis start\
    \ position (programmed as R), the final hole depth (Z), and the depth of each\
    \ peck (Q). Although these cycles work well in most cases, they lack one feature.\
    \ They are not able to decrease the pecking amount as the drill goes deeper into\
    \ the hole. Optional Fanuc Macro B is an excellent method of programming for this\
    \ purpose because it allows the user the exact control required by developing\
    \ a flexible custom cycle.\n\nWhat about those machine shops that do not have\
    \ the macro option installed? Although there is no direct solution, there is a\
    \ workaround of sorts. Just use the cycle two or three times at the same location,\
    \ and decrease the Q amount for each run. A program may look something like this:\n\
    \n```\n    (G43 Z1.0 H01 M08)\n    G99 G73 X.. Y.. R0.1 Z-2.6 Q0.75 F10.0\n  \
    \  R-2.5 Z-4.0 Q0.5\n    G98 R-3.9 Z-5.85 Q0.25\n    G99 X.. Y.. R0.1 Z-2.6 Q0.75\
    \ (ETC.)\n```\n\nThere is a certain loss of time that can be significant when\
    \ hundreds or even thousands of holes are machined with the same program, but\
    \ it does the job without macros. Another pos-"
  - '[PAGE 75]


    sible problem encountered in machining a large number of deep holes has to do
    with assignment of the Q-amount. Generally, we do not think in small increments,
    and the Q is more often than not just a reasonable number, generally based on
    experience. Consider the following reasonable G83 cycle used for 5/8 drill with
    0.87 peck depth, 4-7/8 part thickness, 0.06 breakthrough and 0.1875 drill point
    length (0.625 × 0.3). The programmed depth is 4.875 + 0.06 + 0.1875 = 5.1225:


    ```

    G99 G83 X.. Y.. R0.1 Z-5.1225 Q0.87 F10.0

    ```


    # Drilling Thousands of Holes


    The G83 cycle is necessary in this case to clean most of the chips out of the
    hole. This seems innocent enough; program data are definitely reasonable and,
    for a few holes, the program works well. Yet, it can be a costly piece of program
    code when, for example, 5000 holes are drilled. Let me do some math here.


    To calculate the number of pecks, the control system divides the programmed pecking
    depth of Q0.87 into the total travel between R0.1 and Z-5.1225, a distance of
    5.2225. This distance, when divided by 0.87, calculates 6.003 pecks, which in
    reality means seven pecks, as the control does not allow exceeding the Q-amount.
    That means six pecks will be done at 0.87 each, resulting in only 5.22 total distance
    traveled. The remaining 0.0025 will be the actual depth of the last peck. Because
    cycle G83 is in effect, the drill has to travel up by 5.22 and back by almost
    the same amount, it makes about 10.4 inches of travel in the air per hole, just
    to cut 0.0025. In addition, this 0.0025 is below the part anyway and more air
    will be cut.


    Now, the costs. Take the 10.4 inches of extra non-cutting travel, multiply it
    by 5000 holes, and divide the result by the rapid travel of common 900 in/min
    rapid rate. The result is 57.8 minutes wasted, almost a full hour.


    The solution is very simple. Just change the Q0.87 to Q0.871 (or even a little
    higher), which will eliminate the last peck. This'
  - '[PAGE 76]


    adjustment saves an hour of air cutting for every five thousand holes. Our master
    hole-maker would be pleased.


    # ## Alternate CNC Machine Selection


    *November 2005, updated February 2013*


    There was a time when having a single CNC machine on the floor gave a machine
    shop a somewhat privileged status amongst its peers, even among customers and
    competitors — a pleasurable mixture of awe and envy. Being the first one to be
    in a possession of the greatest and newest technological marvel is still considered
    hip and cool today, even if CNC technology as such is not that new anymore. It
    is quite common to find even small machine shops with several CNC machines, typically
    purchased over the period of several years.


    Of course, over several years, CNC technology has evolved in both the machine
    tool design and the control features. Having older and newer CNC machines working
    side by side presents several challenges. Apart from the standard scheduling challenges
    that apply to all machine tools in the shop, the CNC programmers and operators
    face challenges of their own.


    # ### Comparing CNC Machines


    This essay looks at techniques that can be adapted in the part program and/or
    at the machine control. For example, let’s use two similar CNC machining centers,
    *Machine A* and *Machine B*. They are both of similar capacity and features, so
    a certain job can be loaded on either machine. From a programming perspective,
    the major machine design considerations are the likely differences in the maximum
    spindle speeds and feedrates, capacity of the tool magazines, the tool change
    type, and spindle output ratings. Each directly influences the actual program
    development. Other possible differences, such as rapid travel rates, do not directly
    influence the programming method.'
