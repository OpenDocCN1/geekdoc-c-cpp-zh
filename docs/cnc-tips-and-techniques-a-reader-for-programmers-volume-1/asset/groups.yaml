    \n![](img/0023bd5cc50494e6d7799ab76d437c8d_139_0.png)\n\n## 自动换刀 — ATC\n\n*2007年6月，2013年2月更新*\n\
    \n在为特定加工任务选择刀具时，许多 CNC 程序员的主要关注点是为该工件选择最合适的直径。同时，刀具材料类型（如 HSS 或硬质合金）以及刃数或刀片数也会被认真考虑。在选择切削刀具时，还应考虑其他同样重要的问题。这些问题涉及机床制造商规定的刀具最大直径、最大长度和最大重量。这里我们要考虑的是特定\
    \ CNC 铣床或加工中心所支持的 ATC（自动换刀装置）类型。\n\n### 固定地址式 ATC\n\nCNC 铣床和加工中心制造商提供两种类型的 ATC：固定地址式和随机地址式。在固定地址式\
    \ ATC 中，程序中使用的刀具号必须与刀库的刀位号相匹配。在机床上，这意味着刀具会先返回到它原来所在的刀库刀位，然后刀库才准备下一个程序指定的刀具。这种方法速度慢且效率相当低，尤其是在大批量生产环境中，不过它在非生产型车间中提供了一种成本较低的替代方案。程序员了解这一设计特点，并试图通过在刀库中更有效地安排刀具顺序来缩短循环时间。即使尽最大努力，非生产性换刀时间仍可能相当长。\n\
    \n### 随机地址式 ATC\n\n大多数 CNC 加工中心将更先进的随机地址式换刀装置作为标准配置提供。其目的是尽可能缩短换刀时间，因为完全消除换刀时间是不可能的。在这种情况下，CNC\
    \ 程序员为所有刀具分配编号，而不必考虑它们将如何分布在刀库中。程序中的刀具号不必与刀库刀位号相匹配。程序中的一个主要差异与刀具地址 T 有关。虽然字母 T\
    \ 将该地址标识为刀具号，但实际上应将其标识为待命刀具号。这一差异很细微，但很重要。当控制系统处理 T 地址时，它会将该刀具定位到刀库中特殊的待命或准备位置。该位置在物理上与自动换刀装置对齐。我们来看一个刀具\
    \ T01 的典型程序开头示例：\n\n```\nN1 G20\nN2 G17 G40 G80 T01 (GET T01 READY)\nN3 M06 (ACTUAL\
    \ TOOL CHANGE)\nN4 G90 G54 G00 X.. Y.. S.. M03 T02 (GET T02 READY)\nN5 G43 Z..\
    \ H.. M08\n... <MACHINING WITH T01>\nN35 M01 (END OF T01)\n```\n\nN2 程序段调用 T01。执行该指令时，刀库开始旋转，直到\
    \ T01 位于待命位置。N3 程序段中的换刀功能 M06 将强制在主轴当前刀具（即使没有实际刀具）与已准备好的（等待中的）刀具之间执行实际换刀。这一简单操作在刀具设置期间需要一个非常重要的步骤。由于\
    \ CNC 操作员可以将任意刀具放入任意刀库刀位（在合理范围内），这一额外设置步骤要求每把刀具都在控制系统存储器中注册。例如，T01 可能被放入 6 号刀库刀位，并在初始设置时按此注册；无论需要加工多少零件，其余工作都由控制系统完成。为了保持连续性，即使主轴中没有实际刀具，也必须注册一个不存在的刀具，通常注册为\
    \ T99。从这时起，不应手动处理任何刀具。如有必要，使用手动数据输入（MDI），并注意空刀具。\n\n有些程序员喜欢将刀具号与换刀功能合并在一个程序段中，例如\
    \ T01 M06。这通常是个人选择问题。实际换刀过程或总循环时间不会有差异。我自己的偏好如示例所示。我倾向于将刀具号调用（T01）和换刀功能调用（M06）拆分为两个程序段。在自动运行中，不会有任何明显差异。在设置期间，操作员经常使用单段模式，这种方法可在实际换刀前留出时间检查刀库中的刀具。\n\
    \n现在看示例中的 N4 程序段。该程序段代表任何刀具典型的第一段运动。它将控制系统设置为绝对模式，选择工件坐标系偏移，并快速移动到第一个零件位置。这也是一个可编程主轴转速和主轴旋转的程序段。在同一程序段中加入下一把刀具调用是合理的。该调用在换刀之后执行，因此即使当前刀具的循环时间很短，刀具也已为下一次换刀做好准备。\n\
    \n刀具编程方面另一项可能的改进是：在下一把刀具的第一个程序段中重复调用再下一把刀具，例如上述 N35 程序段之后会接：\n\n```\n...\nN35\
    \ M01 (END OF T01)\n\nN36 T02 (GET T02 READY – IF NECESSARY)\nN37 M06 (ACTUAL\
    \ TOOL CHANGE)\nN38 G90 G00 G54 ... T03 (GET T03 READY)\n...\n... <MACHINING WITH\
    \ T02>\n```\n\n这种方法有一个好处——任何已编程的刀具都可以随时调用，通常是在遇到需要重复使用刀具的问题时。有些程序员使用其他方法，例如特殊程序段号。\n"
