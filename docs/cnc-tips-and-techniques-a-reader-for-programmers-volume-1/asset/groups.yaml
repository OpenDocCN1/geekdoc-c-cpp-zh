    ## Readings From 2006


    ![](img/0023bd5cc50494e6d7799ab76d437c8d_82_0.png)


    result. This is not an issue with rigid tapping. In fact, the horsepower (or kilowatt)
    rating of the machine tool is the only limiting factor.


    There are other benefits as well. The rigid tapping method is more suitable for
    making threads in tough and hardened materials, as well as in deep holes. Some
    space age and other exotic materials may even be tapped using the pecking method,
    common to drilling deep holes. In this case, a special part program will have
    to be developed, but that is not a difficult task. Re-tapping is also possible,
    as long as the starting point and depth never change. This is a benefit for holes
    that require a certain tolerance on the tapped depth. Overall, a significant reduction
    of cost per hole can be achieved with rigid tapping over tapping with floating
    holders.


    ## Setup


    As solid holders are used, it is very important to make sure the tool deviation
    from the spindle centerline is at absolute minimum, and does not exceed 0.005
    mm (5 microns or about 0.0002 inches) of total indicator reading (TIR). Equally
    important is using high quality taps, which are less likely to run-out. They may
    cost more than standard taps, but are more economical overall. Large run-out will
    cause an oversized thread and may even break the tap, particularly for small hole
    sizes.


    ## Possible Problems


    Although rigid tapping is supported by the majority of modern machining centers,
    there are some differences in design. It would be a mistake to assume that synchronization
    of every machine spindle is perfect and that a solid tap holder solves all tapping
    problems. Various physical factors contribute greatly to the quality of the thread
    tool life, particularly in volume production. No significant difficulties are
    generally encountered in small batches, but tap wear over many holes has to be
    considered as a serious potential problem because the quality of tapped


    ![](img/0023bd5cc50494e6d7799ab76d437c8d_87_0.png)


    ## Mastering M-Functions


    *February 2006, updated February 2013*


    Every CNC program has them. They appear in the program at various places and they
    have a lot of potential and they certainly have a lot of power in the program.
    They are called *M-functions* — special program words beginning with the letter
    M. For many programmers, they are at the same level of importance as the venerable
    G-codes (preparatory commands). Yet, there is a difference in their applications.
    Whereas many preparatory commands are pretty much the same for the majority of
    control systems, the M-functions do not share this distinction as readily.


    ## Defining M-functions


    M-functions are typically defined as *machine functions* or, more accurately,
    as *miscellaneous functions*. Their purpose in the program is two-fold. In one
    group, they control certain flow of the program, for example, functions such as
    M00 (program stop), M01 (optional program stop), and M30 (program end), as well
    as the subprogram related functions M98 and M99. The other group is much richer.
    It contains the true machine functions; they relate to the operation of various
    machine tool features and accessories. Their list can be quite long, depending
    on the machine type and design. Typical common functions of this group are those
    controlling coolant activity (M08, M09), spindle rotation (M03, M04, M05), tool
    change (M06), and many other standard machine-related functions. Virtually all
    CNC machining centers require these features and that makes these functions pretty
    consistent between controls.


    Also related to machine design are M-functions that are *unique* to a particular
    manufacturer, even if they serve the same purpose. For example, table clamp/unclamp
    functions for one horizontal machining center may be different from table clamp/unclamp
    functions of another horizontal machining center. Depending on the number of special
    features, some complex machining centers may have dozens or even hundreds of M-functions
    available; some even use three digits rather than the common two digits. Most
    of them are the ON/OFF type — active or inactive state. For these machines, the
    CNC programmer has only one resource, and that is the manufacturer’s documentation.


    ### Programming Perspective


    From the programming perspective, miscellaneous functions are pretty flexible
    to work with. Two areas of focus are those M-functions that should be programmed
    in a separate block, with no other data, and the behavior of the function when
    programmed together with an axis motion. Some controls require program end functions
    (M02, M30, M99) to be in a block of their own. Even if such a rule does not apply,
    many programmers follow this format anyway because it makes the program easier
    to interpret. The same approach applies to M00 and M01 program stop functions.
    When it comes to functions that are machine oriented rather than program oriented,
    some significant differences should be expected. A typical example is the M06
    automatic tool change function. This function is often programmed together with
    the tool number, for example, T05 M06. Some controls accept the two commands together
    in the same block (regardless of their order). Others require the tool command
    in one block, followed by the tool change command in the next block.


    ### Number of M-functions


    Another important feature is the number of M-functions in one block. Not many
    control systems allow more than a single M-function in one block. Others offer
    up to three such functions in a block, providing they are not in conflict with
    each other. The best strategy is to program only one M-function per block, to
    prevent possible syntax error at the machine. Such a strategy also makes the program
    more portable.


    ![](img/0023bd5cc50494e6d7799ab76d437c8d_90_0.png)


    ## Tool Length Setup — Three Methods


    *March 2006, updated February 2013*


    For a typical setup of a vertical CNC machining center, it is necessary to provide
    the control system with the exact location of the part zero, measured from the
    fixed machine zero position (home). Although this procedure is fairly straightforward
    for the X and Y axes, setting the Z-axis measurements is a bit more involved (unless
    your machine supports automatic tool length setup). For the XY axes, a simple
    edge finder or a corner finder is used during setup and typically remains the
    same for all tools. The measured dimensions are stored as work offset (G54–G59).
    In order to set the Z-axis, the length of each tool has to be known and registered
    as tool length offset. As an example, for a single tool, the Z-axis in the work
    setting can also be used and called by the G54 command. As most CNC programs use
    more than one tool, this method is not possible, and the tool length offset (G43)
    must be used instead. Registry settings allow entry of each tool length separately,
    and they can be called by their number, using the address H in the program. For
    example, G43 H03 will retrieve tool length offset number three.


    At the machine, the CNC operator may use one of three common methods to set the
    tool length offset:


    - Preset Method

    - Touch-Off Method

    - Longest Tool Method


    ### Preset Method


    This is the oldest and still commonly used method of pre-setting the tool away
    from the machine. It requires an external tool pre-setter and a person who sets
    the tool length for each tool in the program. Once the tools are set, they are
    assigned to the CNC machine and loaded into magazine. Because their dimensions
    are known, all the operator has to do is to enter them into the offset registers;
    even that can be done automatically, with data stored on special chips, built
    into the tool holder. The preset dimensions are actual tool lengths, measured
    from the tool tip to the spindle gage line, and are typically stored as positive
    values. Overall Z-axis distance of the machine tool must also be known.


    The obvious advantage of this method is very little time loss during the actual
    setup. A less visible benefit is that presetting tools off-machine provides a
    better environment for tool management. The main disadvantage is its cost, not
    only in the initial equipment, but also in its operation. Although any shop can
    use the tool presetting as a method of choice, it remains the domain of larger
    companies or companies that run large batches of the same part.


    ### Touch-Off Method


    Many small machine shops, and even more job shops, use a method of touching the
    tip of each tool at the surface that represents the Z0 in the program. The measured
    dimensions are not the actual tool lengths, but individual distances from the
    tool tip to the part Z0, measured from the Z-axis home position. These settings
    are typically entered as negative values and require no other measurements or
    settings.


    Although the main advantage of this setup method is in its simplicity, the main
    disadvantage is that it often creates a long gap between two jobs, resulting in
    unproductive time. It might be justified in a non-production oriented environment,
    such as tool and die shops, prototype work, etc.


    ### Longest Tool Method


    The last available method is one that also uses the touch-off procedure, but with
    a twist. Rather than setting the length offset for each tool relative to the Z0,
    only one tool will be set to Z0. All other tools will be set relative to the tool
    point of this master tool. From a practical point of view, the master tool should
    be the longest tool, mainly for reasons of adding safety into the setup.

