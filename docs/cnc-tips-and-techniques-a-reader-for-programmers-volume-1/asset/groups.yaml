    during the programming process.


    - **Machine Type**: A well-developed part program can be used on CNC machines
    that are similar. A program comment should list which machine/control combinations
    will accept the given program.


    - **Setup Data**: Specify the part zero in all axes. Include the setup method
    and all related information, such as part orientation, depths, and clearances.


    - **Tooling Data**: List all tools at the program beginning and repeat the tool
    description for each tool in the program.


    - **Special Instructions**: If the program contains M00 (program stop), describe
    the reason for its existence. For example, instruct the CNC operator that the
    part is to be reversed, or special lubrication has to be applied for tapping,
    or that the tool has to be checked. Many similar examples fall into this category.


