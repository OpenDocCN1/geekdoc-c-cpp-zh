    ## 文本编辑器


    在许多方面（以及专业观点中），大多数 CAM 软件附带的文本编辑器应当只是一个查看器——它不应能够修改程序。当然，这类更改每天都在发生，因为这是修复问题的一种权宜之计，通常是修复小问题。由
    CAM 软件生成的程序应当不需要编辑；这正是一开始购买它的全部目的。然而，许多零件编程员选择手动进行小改动。原则上，这是一种错误的方法。问题可能已经修复，但程序数据库（即零件模型）根本没有改变。它仍然包含该错误。在多个用户共同使用该程序的环境中，这种方法可能导致重大困难。


    与此同时，文本编辑器确实有其正当用途。例如，编辑器可以创建和编辑装夹单和刀具单、后处理器模板，甚至配置文件。这些应用都不会损坏刀路数据库。如果需要打印稿，也可以使用文本编辑器打印程序。


    ## CAD 连接


    独立式 CAM 编程系统无需单独的 CAD 软件来定义刀路几何。如果零件图已经存在（例如，客户以文件形式提供 AutoCAD 图纸），重新绘制几何图形则适得其反。CAM
    软件应包含若干内置的 CAD 转换功能。AutoCAD 仍是二维制图领域的领先者，并可直接打开 DWG 图纸。DXF 格式也可用，但仅适合转换基本图元。对于三维设计，优质
    CAM 软件应能转换最流行的 CAD 系统，例如 SolidWorks、Inventor、CATIA 和 Solid Edge。其他系统也在不断加入支持范围。


    # 2005 年文章选读


    ![](img/0023bd5cc50494e6d7799ab76d437c8d_60_0.png)


    # 最小化程序长度


    *2005 年 5 月，2013 年 2 月更新*


    过去，处理长程序这一话题主要关注在实际零件生产过程中，借助 DNC 支持在机床上高效运行此类程序。长程序通常是 CAM 输出的结果，但在许多情况下也由人工编写。请记住，*长*这个词通常相对于所涉及的工作量和可用控制内存容量而言。例如，数控车床的内存容量比数控加工中心小得多。无论哪种情况，CNC
    编程员都有几种可支配的方法来缩短长程序。使用本专栏建议的方法，通常可能无需使用 DNC 方法就能将长程序装入控制内存。有多种方法可实现这一目标，既可在程序开发之前采用，也可在程序开发之后采用。


    在 CAM 编程中，获得高质量程序输出的关键是优质后处理器。CAM 软件中后处理器的目的是为所需的程序输出提供一个可定制平台。后处理器定制中所投入的思路和努力，在手工编程中同样需要考虑。这里没有魔法——如果你想缩短程序，就必须*在不损失其完整性和目的的前提下*完成。从程序中删除一道工序确实会缩短程序，但代价可能太高，难以承受。在开发
    CNC 程序时，应关注那些可以说开箱即能提供更短输出的各种功能。它们包括各种固定循环、多重重复循环、子程序、宏、计数器和自动拐角。从已经尽可能短的程序开始，会使后续的任何努力都更加有效。让我们看看一些可用的选项。


    ## 消除字符


    一旦从一开始就用尽所有可能的方法来缩短程序，就只剩下一种方法——*消除程序中所有不必要的字符*。是的，每次消除一个字符往往能对最终程序长度产生奇效。你需要一个好的文本编辑器，最好是为编辑
    CNC 文件而设计的文本编辑器。文本编辑器提供一种称为*批量替换*的功能（通常称为*查找和替换功能*）。务必在程序的副本上操作，以防出现问题。另外，绝不要对程序进行可能对加工安全产生负面影响的更改。初始规划很重要，了解程序格式也必不可少。以下是应考虑作为实现缩短程序目标的主要方面：


    - 消除或优化程序段号（顺序号）

    - 删除程序注释

    - 删除不必要的零

    - 将单轴运动合并为多轴运动（如果安全允许）


    ### 程序段号


    *程序段号*几乎总是为了便利而使用，但某些特殊应用除外，例如多重重复循环或宏语句。消除程序段号将最大程度地减小任何程序的体积。如果你不放心消除所有程序段号，可以每把刀具只使用一个程序段号，也许是为了搜索。以
    1 为增量使用程序段号比常见的以 5 或 10 为增量更经济，因为存储的字符更少。


    # 车削循环的转换


    *2005 年 6 月，2013 年 2 月更新*


    大多数数控车床编程员会同意，数控车床控制系统最有用的功能是*多重重复循环*。自 20 世纪 80 年代中期以来，数控车床的多重重复循环一直是控制系统的重要组成部分。时至今日，它们仍是材料去除方面最具创新性的方法，尤其是在车削、镗削和螺纹加工领域。在其三十年的存在期间，多重重复循环只经历了两次重大变化。早期控制系统要求这些循环用单程序段编程，后来的控制系统则要求输入两个程序段。这种编程方法的差异常常导致一种类型必须转换为另一种类型——通常是从单程序段格式转换为双程序段格式。


    ## 转换格式


    首先，让我们看看*转换*这个词。从一种格式更改为另一种格式并不是真正的转换，或者——至少不是完整的转换。原因是双程序段格式比单程序段格式提供更多功能。另外，请记住，此处你没有选择；控制系统决定编程方法。通常，FANUC
    10/11/15 型控制系统使用单程序段格式，其他控制型号（0/16/18/20/21……）使用双程序段格式。哪些循环会受影响？从 G71 到 G76 的所有多重重复循环都可以根据控制系统采用其中一种格式编程。精加工循环
    G70 始终使用单程序段格式。


    ### 单程序段格式


    单程序段格式是两者中较旧的一种，严重依赖系统参数设置，而机床操作员通常无法访问这些设置。本专栏将以最常用的 G71 和 G76 循环为例；其他循环同理。以下数据：


    ```

    G76 X.. Z.. I.. K.. D.. A.. F..

    ```


    在这种情况下，X 指定最终螺纹直径，Z 是螺纹终点位置，I 指定锥度量（如果使用），K 是螺纹深度，D 是第一刀深度，A 是螺纹角度，F 是螺纹导程（进给率）。双程序段版本则加入了更多可编程功能：


    ```

    G76 P.. Q.. R..

    G76 X.. Z.. R.. P.. Q.. F..

    ```


    第一个程序段中的 *P* 地址一并包含精加工次数、螺纹终点退刀的前导长度和螺纹角度。*Q* 地址指定最小切削深度，R 是精加工余量。在第二个程序段中，X 和
    Z 与前面相同，R 指定锥度量（如果使用），*P* 是螺纹深度，*Q* 是第一刀深度，F 是螺纹导程（进给率）。第二个程序段中的 *P* 和 *Q* 都不接受小数点。


    从这两个示例可以看出，两种循环格式的主要区别在于附加的可编程参数，这些参数使循环比使用内部参数设置灵活得多。在任一双程序段循环中，不要将第一个程序段中的地址与第二个程序段中的相同地址混淆。如你所见，从单程序段格式到双程序段格式的*转换*增加了一些现在可编程的特定功能，为
    CNC 编程员提供了更大的灵活性。

