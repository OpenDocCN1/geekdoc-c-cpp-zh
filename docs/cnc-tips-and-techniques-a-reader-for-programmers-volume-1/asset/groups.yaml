    ## 自动拐角断开


    *2006年11月，2013年2月更新*


    在典型的车床加工中，有许多情况需要从台肩到直径——或从直径到台肩——的切削进行拐角断开。断开尖角是一种非常常见的做法，用于消除毛刺、提供间隙，并使搬运和装配更容易。它还能改善零件外观。


    ### 拐角断开的尺寸


    工程图纸通常规定所有尖角都要断开，但并不总是给出其尺寸。这由 CNC 编程员来选择，尺寸可能从 0.005 到 0.020 英寸（0.125 到 0.500
    毫米），特殊应用甚至更大。所需的拐角断开要么是 45 度角的倒角，要么是过渡半径（圆角）。许多拐角断开适用于台肩与相邻直径之间的切削，此时切削每次在一个轴上转
    90 度。尽管起点和终点的计算并不困难，但如果涉及许多拐角（例如具有许多直径的轴类加工），则可能很耗时。


