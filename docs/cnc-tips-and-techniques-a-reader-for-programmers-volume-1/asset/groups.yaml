    # # Why Should I Know Manual Programming?


    *February 2004, updated February 2013*


    In older days, most CNC programs were developed manually, using simple common
    and everyday aids — pocket calculator, pencil, paper, and the proverbial five-pound
    eraser. Combine this human effort with punched tapes and some extra hardware,
    and you have what seems today a history long past. The tape is gone today, and
    even though many programmers still sharpen their pencils and purchase new erasers,
    the times have clearly changed in favor of computer-based programming, or CAM
    programming. True, CNC programming using personal computers started in the mid-1980s,
    but initial costs, the state of computer technology, long learning curves, and
    a lack of features prevented their wide usage for some time.


    Using CNC software to make part programs is not a novelty. Feature rich software
    from a number of vendors offer the whole gamut of options — from entry level 2D
    to sophisticated 3D, solids, multi-axis machining, and multi-tasking — all available
    for desktop and laptop computers. Public and private institutions offer many training
    programs in this area, often in addition to standard CNC programming courses.


    This brings up the ever more important question that many students ask: “*Why
    should I know manual programming, when I am learning Mastercam?*” Of course, there
    is software available other than Mastercam, but the question raises a good point.
    I wish I had a dollar for every time this question pops up in conversation or
    during a training session. So what gives?


    Every CNC programmer has to possess certain skills. One skill I consider the most
    important is the *ability to machine a part*. Deciding on the best setup, selecting
    the most suitable tools, and creating safe and efficient machining operations
    is the *core skill* of any successful CNC programmer. The actual method of programming
    has nothing to do with it. Computers cannot make intelligent decisions.'
