    ## 保留记录——为程序编写文档


    2004年9月，2013年2月更新


    无论是常见还是不太常见的制造过程和活动，记录所做的工作都有很多理由。跟踪大量活动的最重要原因，是为进行中的工作创建一些合理的文档。其方法及目的相当基本——能够记录并追溯或检索各个开发步骤或阶段，以备将来需要。无论是用于应急目的还是一般参考，良好的文档对于机加工车间环境中的任何严肃工作都是必不可少的。在企业层面，文档通常仅为内部目的而编制。文档也可能成为
    ISO 9000+ 认证流程的重要组成部分，在这种情况下，它会采取自己的形式。在 CNC 或 CAD/CAM 零件编程层面，该领域的需求要宽松和灵活得多，但同样重要。本文探讨与
    CNC 编程有关的程序文档，无论其开发方法如何。良好的文档对于手动编程和 CAD/CAM 刀具路径开发同样重要。


    大多数零件程序以两种形式之一到达 CNC 操作员手中：打印的硬拷贝或磁盘文件。在这两种情况下，程序格式相同，只是分发方法不同。所有 CNC 系统都提供一种将注释和消息插入零件程序正文的方法。如果使用得当，这些注释和消息位于程序内的关键位置，作为面向
    CNC 操作员的注释。在 CNC 程序中包含注释和消息的最常见方式是使用成对圆括号 ()。这种 (COMMENT) 方法是 Fanuc 及相关控制系统的典型做法。例如，以下消息指示
    CNC 操作员检查零件宽度：


    **(宽度必须在 26.7 到 27 MM 之间)**


    其他方法使用美元符号 ($) 或分号 (;)，以及类似方法，目的相同。在所有情况下，控制系统都被设计为在程序执行期间忽略该消息或注释。


    零件程序中注释过多或过少都可能适得其反。程序中完全没有注释可能导致错误假设，除非提供了某种其他信息方式。CNC 程序注释和消息的主要目标是在 CNC 程序员和
    CNC 操作员之间提供信息链接。详尽且信息丰富的程序文档如此重要，以至于每个车间所有者或管理者都应坚持要求它，每位程序员都应将其作为标准程序特性提供。


    ### 良好的程序文档


    良好的程序文档有哪些主要特征？第一条规则是使程序中的任何注释简短且切中要点。第二条规则是只包含与当前项目相关的注释。就内容或主题而言，以下是一些许多 CNC
    程序员已在各种程序注释中成功使用的建议：


    - **日期和时间**：当前程序版本至关重要；它必须与零件图纸匹配。最新日期和时间被假定为最新版本。


    - **程序员姓名**：程序员姓名对 CNC 操作员很重要，以备需要提问或澄清。


    *程序员读本*


    - **图纸编号和/或版本**：包括编程过程中使用的最新图纸版本。


    - **机床类型**：开发良好的零件程序可用于类似的 CNC 机床。程序注释应列出哪些机床/控制组合将接受给定程序。


    - **设置数据**：指定所有轴上的零件零点。包括设置方法及所有相关信息，例如零件方向、深度和间隙。


    - **刀具数据**：在程序开头列出所有刀具，并在程序中为每把刀具重复刀具描述。


    - **特殊说明**：如果程序包含 M00（程序停止），请描述其存在的原因。例如，指示 CNC 操作员需要翻转零件，或攻丝必须使用特殊润滑剂，或必须检查刀具。许多类似示例都属于此类。


    有许多不同的应用受益于插入零件程序中的注释和消息。取决于控制系统，注释可能不会加载到控制存储器中，但它们始终可以以打印形式或程序文件形式提供。由 CAD/CAM
    软件开发的 CNC 程序应包含与手动开发的程序相同的注释和消息。所有高级 CAD/CAM 软件都提供将注释插入程序的功能。


    文档齐全的程序更容易被 CNC 操作员甚至其作者（程序员）解读。文档应作为每个程序的标准特性提供。


    ![](img/0023bd5cc50494e6d7799ab76d437c8d_45_0.png)


    ## 关注数字


    *2004年10月，2013年2月更新*


    你用来加工零件的图纸很可能源自 CAD 软件。没什么花哨的，只是一张标准、日常类型的二维图纸——两三个视图、尺寸和一些文字——仅此而已。然而，仅仅因为图纸是在
    CAD 中准备的，并不意味着它没有缺陷甚至错误。让我们看看这张虚构的图纸，并关注与数字（实际上是尺寸）有关的几个细节。


    ### 关注点 1——公制还是英制？


    图纸中使用什么单位？如果你毫无头绪，不要假设——要确认！现在用公制单位准备的图纸比以前多，但并不总是准备得当。图纸角落里的“METRIC”这个关键字可能偏偏没有出现，无法提示你。以下是一些判断方法（但无论如何，之后要核实）。


    第一条线索是图纸比例，第二条线索是尺寸及其公称值。如果你专长于生产小零件，而看到零件长度为 50，那么这很可能是一张公制图纸。如果你习惯看到诸如 1.625
    或 0.75（英寸）这样的尺寸，而图中没有这么小的尺寸，那么这很可能是一张公制图纸。如果比例正确，它就解决了谜题的另一部分。另一个线索是尺寸中使用的小数位数。如果图纸遵循适当标准，公制图纸应使用不带小数点的整数。因此，我们的
    50 mm 长度在尺寸箭头之间将显示为 50，而不是 50.0。本应如此，但实际情况并不总是如此。


    这引出了另一个线索，即小数如何表示。由于公制系统使用 1/1000 毫米作为最小单位，你在公制图纸中绝不应看到超过三位小数——即使三位小数也相当罕见。有时如果大多数尺寸使用一种单位，而另一个尺寸（例如螺纹或丝锥尺寸）使用相反单位，你就必须进行换算。现实情况可能很混乱，但这就是我们在采用公制系统方面落后于世界其他地方所付出的代价。


    ### 关注点 2——公差


    一个可能引起麻烦的相关事项——公差——也与 CAD 系统直接相关。本示例我们继续使用英寸。你刚收到的图纸基本上是一个矩形零件，总体尺寸显示为 5.0000
    x 3.0000 x 0.5000。这是什么？几十年前，我们会被教导说，小数位数表示公差的精度。例如，x.xxx 会表示 ±0.001（或当时公司内部标准规定的任何值）。所以现在我们的零件三个总体尺寸都有四位小数！这还没完——长度和宽度上还要求
    125–250 的表面粗糙度。因为这个尺寸毫无意义，我们必须找出这背后的真正罪魁祸首。


    首先，抛弃公差由小数位数暗示的旧观念。是的，这种做法仍然存在；是的，它仍然是错误的。除了这种表示法违反所有 ANSI 或 ISO 标准之外，它还是错误的，因为它不可靠。至少有一个原因（还有几个其他原因）使它不可靠——因为
    CAD 软件默认英制图纸保留四位小数，公制图纸保留三位小数。这可能在 CAD/CAM 界养成一些坏习惯。当然，软件确实允许更改为任意小数位数，但选择适当设置是
    CAD 操作员的职责。


    ### 关注点 3——为什么公制比英制更好？


    再注意一下这个问题。它并没有问公制系统是否更好，而是假定它更好，并问为什么更好。在我收到太多质疑我这个问题的电子邮件之前，让我郑重声明，我特指 CNC 机床，而不是

