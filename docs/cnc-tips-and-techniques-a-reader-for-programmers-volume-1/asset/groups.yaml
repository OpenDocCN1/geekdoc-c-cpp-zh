    The macro shows not only the use of several 3000-series system variables, but
    also how a relatively simple but pesky little problem can be solved. Further improvements
    to the macro can be made; for example, the feed rate can be calculated internally,
    based on the spindle speed and threads per inch or pitch.


    There is also another point to this story — take advantage of the knowledge many
    tooling specialists have.


