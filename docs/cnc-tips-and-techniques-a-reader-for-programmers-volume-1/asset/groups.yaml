    In the following example, the XY center location is defined at a location other
    than zero and will override the macro default. On the other hand, A and S arguments
    are missing (null), and their respective defaults will be used:


    ```

    G65 P8500 X50.0 Y37.5 D49.0 H6

    ```


    For many bolt circle patterns, where the XY is a zero location as well, the macro
    call can be simplified further to:


    ```

    G65 P8500 D49.0 H6

    ```


    This method shows the power of using defaults in custom macros. See Appendix 2
    at the back of this book for a complete working macro listing and accompanying
    figure (Figure A2-1).


    ![](img/0023bd5cc50494e6d7799ab76d437c8d_184_0.png)


    ## Create Your Own G-Code


    *August 2008, updated February 2013*


    Custom macros are a very common method of enhancing the concept of subprograms
    by adding variable data and many data manipulation features. One of the less frequently
    used macro features involves the development of customized G-codes. Typically,
    a custom G-code for machining will be some kind of a cycle and will appear as
    such in the program. The G65 statement can also be used, but it does not provide
    the same transparency. The macro example used in this essay will recreate the
    G13 command used on some controls other than Fanuc. As the actual control model
    is very important, the macro will be developed for Fanuc 16/18/21 systems.


    ### The G13 Command


    Preparatory command G13 is commonly used to machine a circular pocket, such as
    a counterbore or a spot face, in climb milling mode. The macro will be stored
    as a cycle using only three major tool motions:


    - Motion 1: Lead-in arc — 180 degrees from the circular pocket center

    - Motion 2: Full circle machining

    - Motion 3: Lead-out arc — 180 degs. back to the circular pocket center


    As cutter radius commands G40/G41/G42 cannot be applied on an arc, they will not
    be used. Yet, the macro will still allow the CNC operator to fine-tune the pocket
    dimensions at the machine, following established procedures as with a cutter radius
    offset. Development will start the same way as for any G65 macro call. Three variable
    arguments will be required:


    - Circular pocket diameter — argument C (#3 in macro)

    - Tool offset number to store the cutter radius — argument D (#7 in macro)

    - Cutting feedrate — argument F (#9 in macro)


    In the first step, develop a standard macro, for example O8600:


    ```

    O8600 (G13 CIRCULAR MILLING CYCLE — CLIMB MILLING)

    #31 = ABS[#3]/2 Radius of the circular pocket — guaranteed positive

    #11 = #4001 Stores current G-code of Group 01 (motion commands)

    #13 = #4003 Stores current G-code of Group 03 (absolute/incremental)

    #32 = #31-#[2000+#7] True radius of the pocket to cut; see explanation below !!!

    IF [#32 LE 0] GOTO998 Error if radius offset value is too large

    #33 = #32/2 Calculated lead-in/lead-out radius

    G91 G03 X#32 I#33 J0 F[#9/2] Motion 1 — lead-in arc toolpath

    I-#32 F#9 Motion 2 — full circular pocket toolpath

    X-#32 I-#33 J0 F[#9/2] Motion 3 — lead-out arc toolpath

    G#11 G#13 Restore original G-codes of groups 1 and 3

    GOTO999 Bypass error message

    N998 #3000 = 13 (OFFSET TOO LARGE) Alarm refers to actual offset setting

    N999 M99 Macro end

    %

    ```


    Once available, the macro can be called along with all three arguments:


    ```

    G65 P8600 C60.0 D51 F200.0 (metric units)

    ```


    *Be sure to enter the D argument as an offset number, not the cutter size!*


    ### Converting Macro Call G65


    The next step is to convert the macro call G65 to a new G-code (G13). This choice
    is suitable because this type of macro is a true machining cycle. To make it appear
    as a cycle in the program, a G-code that has not been assigned must be selected.
    To make the macro a true cycle, two changes are required. The first change must
    be selection of a special macro number from the allowed range of ten possibilities:
    O9010 to O9019. That means changing the macro number from O8600 to O9013, for
    example. Any number within the range can be selected, but calling the macro O9013
    makes some logical sense. The second step is to register the new G-code (13) as
    a system parameter.


    G-code number 13 has to be registered in the parameter that corresponds to the
    calling program, which is O9013. Depending on the control model used, the range
    of system parameters will be different (consult your control manual). This example
    uses Fanuc 16/18/21, where the parameter range is between 6050 and 6059 (relative
    to macros 9010 to 9019). Parameter 6053 corresponds to macro O9013 and will contain
    the new G-code number 13. Once the new G-code number is registered, the macro
    body does not change, only its number. Now, a circular pocket can be called by
    the new G-code in any part program that requires it:


    ```

    G13 C60.0 D51 F200.0

    ```


    ### Types of Macros


    The example used Fanuc system model 16/18/21, but it also used offset memory Type
    A. This is reflected in variable #32. Macro variable #32 is absolutely critical
    and requires explanation. All active offsets are stored as system parameters.
    Fanuc offers three types of memory offset registers (Type A — one register is
    shared by tool length and radius offsets; Type B — also a shared register, but
    geometry and wear offsets are separate; Type C — separate registers for tool length
    and radius offsets, each with geometry and wear settings). For 200 offsets or
    less, Type A macro uses system variables #2001 to #2200, Type B uses system variables
    #2001 to #2200 for the geometry offset, and #2201 to #2400 for the wear offset.
    Finally, Type C uses system variables #2401 to #2600 for the radius geometry offset,
    and system variables #2601 to #2800 for the radius wear offset. Variable #32 must
    always reflect the offset memory type used. There are no tool length system variables
    for types A and B, and those for Type C are not required. Various error trapping
    features can be added

    '
  mdcn: '

    内置了灵活的XY位置以及灵活的角度方向。


    例如，以下螺栓孔阵列宏调用（可用于公制和英制尺寸）：


    ```

    G65 P8500 X0 Y0 D49.0 H6 A0 S1

    ```


    X和Y参数（#24和#25）是螺栓圆中心的位置。D参数（#7）是螺栓孔圆直径，H（#11）是等间距孔的数量，A（#1）是从零度起测量的方向角。添加S（#19）参数后，可以更改起始孔编号，并跳过一个或多个初始孔。括号内是与每个参数相关联的固定变量编号——它们是宏体的一部分。G65示例展示了大多数螺栓孔的典型输入。轻微缺点是，一旦XY、A和S参数成为宏的一部分，就必须在G65语句中定义它们。即使它们始终相同，也必须在每次宏调用之间重复。*除非……*


    ……*除非它们被定义为默认值。* 宏程序中的默认值是一种无需实际指定就会假定为某个值或数值的条件。在我们的情形中，我们希望将X和Y参数设置为零（X0Y0），角度方向设置为零度（A0），并从阵列的第一个孔开始（S1）。这可以通过简单的条件测试实现，使用**IF**函数检查参数是否存在。例如，如果缺少X参数，就假定它为零，依此类推。Fanuc宏提供一种特殊的*空变量*，标识为#0；该变量没有值，它是空的。可以在宏体中放置一系列语句，检查特定变量是否存在，如果该变量未在参数列表中定义，宏就将其设置为所需值。为了允许其他设置，使用**GOTO**语句绕过默认定义。以下是一组四个默认值：


    ```

    IF[#24 NE #0] GOTO10

    #24 = 0 (if X is not defined, set X to X0)

    N10 IF[#25 NE #0] GOTO20

    #25 = 0 (if Y is not defined, set Y to Y0)

    N20 IF[#1 NE #0] GOTO30

    #1 = 0 (if A is not defined, set A to A0)

    N30 IF[#19 NE #0] GOTO40

    #19 = 1 (if S is not defined, set S to S1)

    N40 ... (macro continues)

    ```


    如果你的控制系统支持IF-THEN语句，上述程序块可以用缩短的条件测试替代：


    ```

    IF[#24 NE #0] THEN #24 = 0 (if X is not defined, set X to X0)

    IF[#25 NE #0] THEN #25 = 0 (if Y is not defined, set Y to Y0)

    IF[#1 NE #0] THEN #1 = 0 (if A is not defined, set A to A0)

    IF[#19 NE #0] THEN #19 = 1 (if S is not defined, set S to S1)

    ```


    在以下示例中，XY中心位置定义在非零位置，并将覆盖宏默认值。另一方面，A和S参数缺失（为空），将使用它们各自的默认值：


    ```

    G65 P8500 X50.0 Y37.5 D49.0 H6

    ```


    对于许多螺栓圆阵列，如果XY也是零位置，宏调用可以进一步简化为：


    ```

    G65 P8500 D49.0 H6

    ```


    这种方法展示了在自定义宏中使用默认值的强大之处。请参阅本书后面的附录2，以获取完整可用的宏清单及随附图（图A2-1）。


    ![](img/0023bd5cc50494e6d7799ab76d437c8d_184_0.png)


    ## 创建自己的G代码


    *2008年8月，2013年2月更新*


    自定义宏是一种非常常见的方法，通过添加变量数据和许多数据处理功能来增强子程序的概念。较少使用的宏功能之一涉及自定义G代码的开发。通常，用于加工的自定义G代码会是某种循环，并在程序中以这种方式出现。也可以使用G65语句，但它不能提供同样的透明度。本文使用的宏示例将重建某些非Fanuc控制器上使用的G13命令。由于实际控制型号非常重要，该宏将针对Fanuc
    16/18/21系统开发。


    ### G13命令


    准备命令G13通常用于以顺铣模式加工圆形凹槽，例如沉孔或锪平面。该宏将存储为一个循环，仅使用三个主要刀具运动：


    - 运动1：引入圆弧——从圆腔中心起180度

    - 运动2：完整圆周加工

    - 运动3：引出圆弧——返回圆腔中心180度


    由于刀具半径命令G40/G41/G42不能应用于圆弧，因此不会使用它们。然而，该宏仍允许CNC操作员在机床上微调凹槽尺寸，遵循与刀具半径偏置相同的既定程序。开发将像任何G65宏调用一样开始。将需要三个变量参数：


    - 圆腔直径——参数C（宏中的#3）

    - 用于存储刀具半径的刀具偏置号——参数D（宏中的#7）

    - 切削进给率——参数F（宏中的#9）


    第一步，开发一个标准宏，例如O8600：


    ```

    O8600 (G13 CIRCULAR MILLING CYCLE — CLIMB MILLING)

    #31 = ABS[#3]/2 Radius of the circular pocket — guaranteed positive

    #11 = #4001 Stores current G-code of Group 01 (motion commands)

    #13 = #4003 Stores current G-code of Group 03 (absolute/incremental)

    #32 = #31-#[2000+#7] True radius of the pocket to cut; see explanation below !!!

    IF [#32 LE 0] GOTO998 Error if radius offset value is too large

    #33 = #32/2 Calculated lead-in/lead-out radius

    G91 G03 X#32 I#33 J0 F[#9/2] Motion 1 — lead-in arc toolpath

    I-#32 F#9 Motion 2 — full circular pocket toolpath

    X-#32 I-#33 J0 F[#9/2] Motion 3 — lead-out arc toolpath

    G#11 G#13 Restore original G-codes of groups 1 and 3

    GOTO999 Bypass error message

    N998 #3000 = 13 (OFFSET TOO LARGE) Alarm refers to actual offset setting

    N999 M99 Macro end

    %

    ```


    一旦可用，就可以连同所有三个参数一起调用该宏：


    ```

    G65 P8600 C60.0 D51 F200.0 (metric units)

    ```


    *请务必输入D参数作为偏置号，而不是刀具尺寸！*


    ### 转换宏调用G65


    下一步是将宏调用G65转换为新的G代码（G13）。这种选择是合适的，因为此类宏是真正的加工循环。为了使其在程序中以循环形式出现，必须选择一个尚未分配的G代码。要使该宏成为真正的循环，需要做两处更改。第一处更改必须从十个可能范围的允许宏编号中选择一个特殊宏编号：O9010到O9019。这意味着，例如将宏编号从O8600更改为O9013。可以选择该范围内的任何编号，但将宏称为O9013在逻辑上更合理。第二步是将新的G代码（13）注册为系统参数。


    G代码编号13必须注册在对应于调用程序的参数中，即O9013。取决于所使用的控制型号，系统参数的范围会有所不同（请查阅控制手册）。此示例使用Fanuc 16/18/21，其中参数范围在6050到6059之间（相对于宏9010到9019）。参数6053对应于宏O9013，并将包含新的G代码编号13。一旦新的G代码编号注册完成，宏体不会改变，只是其编号改变。现在，任何需要它的零件程序都可以通过新的G代码调用圆形凹槽：


    ```

    G13 C60.0 D51 F200.0

    ```


    ### 宏的类型


    该示例使用了Fanuc系统型号16/18/21，但也使用了偏置存储器A型。这反映在变量#32中。宏变量#32绝对关键，需要解释。所有活动偏置都存储为系统参数。Fanuc提供三种类型的存储器偏置寄存器（A型——一个寄存器由刀具长度和半径偏置共享；B型——也是共享寄存器，但几何偏置和磨损偏置是分开的；C型——刀具长度和半径偏置使用独立寄存器，每个都有几何和磨损设置）。对于200个或更少的偏置，A型宏使用系统变量#2001到#2200，B型使用系统变量#2001到#2200作为几何偏置，并使用#2201到#2400作为磨损偏置。最后，C型使用系统变量#2401到#2600作为半径几何偏置，并使用系统变量#2601到#2800作为半径磨损偏置。变量#32必须始终反映所使用的偏置存储器类型。A型和B型没有刀具长度系统变量，而C型的那些变量则不需要。可以添加各种错误捕获功能

