    # Focus 2 – Tolerances


    A related item that could cause trouble — tolerances — is also directly related
    to a CAD system. Let’s stay with inches for this example. The drawing you have
    just received is basically a rectangular part, with overall dimensions shown as
    5.0000 x 3.0000 x 0.5000. What is this? A few decades ago we would have been taught
