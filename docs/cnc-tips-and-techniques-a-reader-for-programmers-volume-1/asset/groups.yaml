    螺纹加工是一种使用最弱刀具并施加最大进给率的操作。螺纹加工出现问题几乎是意料之中的，因为这些问题很难预测。


    ## G32 指令


    生产中遇到的任何问题最好都能尽快解决。在机床方面，如果螺纹加工不能正常工作，CNC 操作员的选择有些有限。编程方法影响很大。对于所谓的*长程序*螺纹加工方法来说，这种观点当然成立，其中每个螺纹运动都写成一个单独的程序段。这种方法的典型示例是使用
    G32 指令（某些机床上为 G33）的螺纹加工方法。在这种情况下，操作员在加工过程中无法做任何有意义的操作来改善螺纹走刀，因为所有运动都完全嵌入零件程序中。为了提高螺纹质量，必须几乎从头重新设计程序本身。这个过程耗时，而且不能保证获得更好的螺纹。


    尽管 G32 螺纹编程方法可用于程序员需要对螺纹加工过程进行绝对控制的特殊场合，但如今 CNC 车床上的绝大多数螺纹加工都是通过使用非常强大的*多重重复循环*来完成的，即使用螺纹专用循环
    G76。将此循环与另一个常用循环——用于车削和镗孔的 G71/G72——进行比较，G76 有更多的参数设置，必要时可在生产过程中于机床上进行调整。这种灵活性使该循环不仅受欢迎，而且对缩短交付周期非常有效。


    ## G76 循环


    首先你应该了解的是，G76 循环有*两*种格式。原始格式是单程序段程序输入；它适用于较旧的控制系统，如 Fanuc 10 和 11 以及其他少数系统。现代控制系统使用双程序段格式，在单独设置方面提供了更大的灵活性。该循环在程序开发期间为
    CNC 程序员带来很大好处，但它对 CNC 操作员的好处更大，因为它提供了许多可在很短时间内于 CNC 机床上更改的功能。


    在当前的双程序段 G76 格式中，有些循环参数需要仔细审查。让我们从 G76 循环本身的结构开始：


    ```

    G76 P.. Q.. R..

    G76 X.. Z.. R.. P.. Q.. F..

    ```


    Fanuc 实施双程序段格式的主要原因是在机床上包含更多设置选项。由于可用于程序开发的各种字母（地址）分配，有些字母必须使用两次，且用途完全不同。因此，P-Q-R
    在第一程序段中的含义与相同字母 P-Q-R 在第二程序段中的含义不同。注意 G76 *不是*模态指令，必须在两个程序段中重复。


    现在来看循环格式本身。与其解释各个循环条目代表什么（稍后介绍），不如看看 CNC 操作员在机床上实际车螺纹时可能需要什么。如果螺纹加工过程运行良好，则无需更改。如果确实出现问题，主要分为两类：通常是*刀具过早磨损*和*螺纹表面质量差*。这些问题没有单一的通用解决办法，因为其原因取决于太多难以列举的因素。双程序段
    G76 循环的主要优点是 CNC 操作员可以在机床上即时进行多项更改，从而将对生产过程的干扰降到最低。这些更改不只是对单个设置的更改，而常常是同时影响多个设置的更改，以实现获得优质螺纹的主要目标。试验
    G76 设置通常是解决任何螺纹问题的最佳方法——有时是唯一方法。


    尽管各个循环条目的一般说明可从众多来源获得，但细节往往晦涩，且不包含对实际应用有用的细节。


    了解可能的螺纹问题的基本背景对于解决这些问题至关重要。在另一篇文章中，我们将从 CNC 操作员的角度审视 G76 循环结构，并更详细地评估各个循环参数。请关注文章*使用
    G76 循环车螺纹——详细说明*中的后续讨论，其中将讨论 G76 螺纹循环的许多格式细节。


    ![](img/0023bd5cc50494e6d7799ab76d437c8d_219_0.png)


    ## 使用 G76 循环车螺纹——详细说明


    *2009 年 7 月*


    文章*使用 G76 循环车螺纹——基础*涵盖了在 CNC 车床上使用 G76 多重重复循环进行螺纹加工的基础知识。当包含 G76 循环的程序到达 CNC 操作员手中时，所有螺纹加工数据都包含在两个程序段中。较旧的控制系统只使用一个程序段，但双程序段格式要流行得多，这里将更详细地介绍。


    ### 双程序段格式


    例如，将在三英寸直径上制作每英寸 12 牙（12 TPI）的标准外螺纹。其长度为 2.5 英寸。程序员将提供以下数据：


    ```

    G76 P010060 Q0040 R0.002

    G76 X2.8978 Z-2.5 R0 P0511 Q0120 F0.083333

    ```


    在第一个程序段中，*P010060* 是一个六位数条目，分为三对，格式为 *Pxxyyzz*，其中 **P01yyzz** 是 01 到 99 范围内的*精加工走刀次数*。在本例中，只需要一次精加工走刀。实际上，这是弹簧走刀的次数。可以随意使用两次或三次，尤其是对较硬材料。第二对
    **Pxx00zz** 是逐渐退刀的*导程数*，有时被错误地称为倒角。通常，如果螺纹终止于退刀槽、凹槽或类似开放空间，这对数字将为 00。对于终止于实体材料的螺纹，该设置应为
    10（=1.0）或更大，这将提供更平滑的螺纹角度退刀。注意范围为 0.1 到 9.9——在没有小数点的情况下，1.0 导程编程为 10。还要注意，导程量会缩短全长螺纹，可能需要在第二程序段中延长
    Z 值。最后，第三对 **Pxxyy60** 通常用于 60 度 V 形螺纹——英制或公制。*该刀尖角度*只能使用六个值：00、29、30、55、60 和
    80。此设置控制刀具的进刀角度。因此，例如，如果将 60 改为 55，进刀角度会改变，而螺纹仍保持其 60 度形状，因为那是刀片的物理角度。


    在两个程序段中都有地址 P 和 Q。它们不带小数点，必须按正确格式输入，例如 0.02” 将写成 0200，0.15 mm 将写成 150。第一个程序段中的
    Q 地址是*最小螺纹切削深度*。在示例中，Q0040 表示 0.040 英寸。随着螺纹刀具切得更深，循环会自动减小深度，以保持相同的切屑去除量。如果计算出的最小深度低于
    Q 设置，Q 值将接管，深度不再进一步减小。注意 P 和 Q 在第一程序段和第二程序段中的含义不同！


    第一程序段的最后一个地址是 R，它是*精加工余量*的固定值。在示例中，精加工余量为 0.002 英寸。这是最后一次螺纹走刀的深度，通常小于同一程序段中的 P
    值。


    在第二程序段中，X 地址是螺纹的*最终直径*，由常用公式 *0.613/TPI* 或 *0.613\*Pitch* 计算得出。对于 12 TPI，深度为 0.613/12
    = 0.0511，因此最终螺纹直径为 3.0−2*0.0511=2.8978。对于内螺纹，X 地址是公称螺纹尺寸，但孔径必须使用类似公式 *0.541/TPI*
    或 *0.541\*Pitch* 计算。Z 地址表示刀具从螺纹中退出时的 Z 位置。R 地址是*螺纹终点*与*螺纹起点*之间的差值，按单边测量。对于直螺纹，差值为零，编程为
    R0，可以省略。对于典型的锥螺纹，R 值*对外螺纹为负*，*对内螺纹为正*。第二程序段中的 P 地址是*螺纹高度*，如上计算——0.0511，编程为 P0511。Q
    地址是按单边测量的*第一次螺纹切削深度*值。Q0120 将深度设为 0.0120 英寸。螺纹加工进给率始终是螺纹导程，绝不是螺距。对于单头螺纹，导程与螺距相同。在英制单位中，螺纹加工进给率最多可到六位小数。对于公制螺纹，扩展小数位数没有实际用途。


    通常，CNC 操作员可以通过考虑更改第一程序段中的所有数据以及第二程序段中的 Q 值来控制螺纹质量。对其他数据的更改则少得多。


    ### 补充要点


    最后，请记住几个补充要点。对于交错螺纹加工（切削过程中改变螺纹侧面），必须使用 Fanuc 15 螺纹加工模式，该模式包含单程序段输入，并由地址 P 指定四个选项。通常，进给保持按钮在螺纹加工期间无效，但某些控制系统通过强制螺纹逐渐退出来允许其生效。螺纹的
    XZ 起点也很重要，因为它决定了每次螺纹走刀后刀具的位置。


    使用 G76 循环车螺纹非常高效，可用于大多数螺纹。另一方面，始终牢记

