    # # CNC AND SAFETY


    # ## OVERVIEW


    Machining safety is paramount to the successful operation of any machinery, CNC
    equipment included. Most companies adhere to - and in many cases exceed - the
    occupational safety laws and regulations of the jurisdiction in which they are
    located. A recent poster campaign has identified the basic rule of safety:


    **Always observe all safety rules**


    This short advertising statement is catchy, clever - and very true. Safety is
    often associated with the actual machining of a part, in machine shop environment.
    Although that is true, a CNC programmer has a great responsibility to built safety
    features into every CNC program.


    # ## SAFETY IN PROGRAMMING


    Here is a list of some most common safety rules the CNC programmer should consider
    for CNC machining centers (also adaptable to the majority of CNC lathes):


    +   - Approach program development with safety in mind for all work

    +   - Program approach towards a part in XY axes first, then move the Z-axis

    +   - Program retract from a part in Z axis first, then move the XY axes

    +   - Start every program with cancellations (so called status block or a safety
    block)

    +   - Provide sufficient clearances (above part, below part, lead-in and lead-outs,
    etc.)

    +   - Program reasonable speeds, feeds, depth of cuts, width of cuts, etc.

    +   - Select safe tool change or part change position

    +   - Select suitable tools for the job

    +   - Program tool motions towards a solid support, such as the fixed jaw of a
    vise

    +   - Be consistent in programming approach from one job to another

    +   - If program fails, correct the REAL cause of a problem, not a perceived one


    # ## SAFETY IN MACHINING - GENERAL


    Because of the nature of work, the CNC operator has a lot more safety related
    issues to consider. Here is a list of some most common safety rules the person
    operating the CNC machine must follow:


    +   - Wear approved safety boots

    +   - Wear approved safety glasses with protective side shields and approved safety
    helmet, if required

    +   - Wear suitable clothing (tucked-in shirt, buttoned-up sleeves, no ties)

    +   - Keep long hair under a net or tied up

    +   - Remove watches, rings, bracelets, and similar jewelry before machine operation

    +   - Keep floors clean and free of oil or other hazards

    +   - Do not remove guards and protective devices

    +   - Do not use rags or gloves around moving or rotating objects

    +   - Do not leave objects on top of machines

    +   - Mount every part in a secure way'
