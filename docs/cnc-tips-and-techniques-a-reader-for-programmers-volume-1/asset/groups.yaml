    following data:


    ```

    G76 X.. Z.. I.. K.. D.. A.. F..

    ```


    In this case, X specifies the final thread diameter, Z is the position of the
    thread end, I specifies the amount of taper (if used), K is the thread depth,
    D is the depth of the first pass, A is the thread angle, and F is the thread lead
