  - "[PAGE 4]\n\n# About the Book\n\nSince 2000, Industrial Press has been fortunate\
    \ to include Peter Smid among its family of authors. Both a popular and prolific\
    \ author, Peter has anchored the CNC portion of our list, headed by the worldwide\
    \ bestseller, _CNC Programming Handbook_, now in its third edition.\n\n_CNC Tips\
    \ and Techniques: A Reader for Programmers_ is Peter’s fifth book with Industrial\
    \ Press. During the past decade, in addition to all of his responsibilities as\
    \ book author, consultant, and educator, Peter wrote a regular column for _Shop\
    \ Talk_, a monthly magazine that offered “metalworking solutions for the manufacturing\
    \ and machining industry.”\n\nPeter wrote dozens of columns for _Shop Talk_, and\
    \ his columns addressed the full gamut of CNC topics. They addressed tapping and\
    \ threading and knurling. They addressed program length and memory needs. They\
    \ addressed personnel issues, for example, the advantages and disadvantages of\
    \ having programmers and operators as separate positions or merged. A variety\
    \ of columns focused on G-codes, M-functions, cycles, and macros. And there were\
    \ still more.\n\nEver since _Shop Talk_ ceased publication, these columns have\
    \ been unavailable. Now, in _CNC Tips and Techniques_, Industrial Press is delighted\
    \ to bring them back to you—over 60 of the best of Peter’s columns—under one cover,\
    \ so that you can have full and easy access to the advice Peter has been sharing\
    \ over the past decade.\n\nEach of these essays has been thoroughly reviewed since\
    \ its initial publication and updated as needed to reflect ongoing changes in\
    \ the field. They are presented here in chronological order of when they first\
    \ appeared. An alternative table of contents, organized by topic, has been included,\
    \ and at the back of the book you’ll also find several useful appendices and an\
    \ extensive index.\n\nWe hope you’ll find _CNC Tips and Techniques_ a valuable\
    \ addition to your CNC library, and that Peter’s advice will make your work more\
    \ efficient, more effective, and more rewarding.\n\nPeter joins us in welcoming\
    \ your feedback and questions. Simply write to us at info@industrialpress.com,\
    \ and we’ll be sure to share your messages with him.\n\n_Industrial Press_  \n\
    _April 2013_"
