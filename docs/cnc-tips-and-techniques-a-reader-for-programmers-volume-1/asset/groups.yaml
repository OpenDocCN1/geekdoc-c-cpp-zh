    A number of machine shop managers prefer the CNC Programmer/Operator position
    and are well aware of its drawbacks. If established in a suitable environment
    and managed properly, having a multi-skilled worker in the shop should bring in
    more benefits than problems. The majority of CNC programmers who also operate
    the CNC machine are honest and dedicated; they do their best to do the job well.
    They consider themselves true professionals, and rightly so. On the management
    side, a prudent owner or manager has to consider all pluses and minuses before
    creating the position of a CNC Programmer/Operator.


