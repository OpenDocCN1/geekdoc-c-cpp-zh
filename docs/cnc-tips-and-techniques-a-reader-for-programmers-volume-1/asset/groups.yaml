    # # Getting Rid of Chatter


    *January 2009, updated February 2013*


    Every machinist has experienced the sound — sharp, squeaky, a bit eerie, but definitely
    spelling trouble. This is the sound of chatter that leaves nothing to imagination.
    Every machinist (CNC or conventional) will know that something is not right with
    the cutting tool performance. Even if the sound itself were tolerable, its results
    are not. Chatter leaves a poor surface finish on the part, mostly unacceptable,
    and negatively influences dimensional tolerances. Chatter also shortens the tool
    life, often quite dramatically. On a positive note, chatter can be generally controlled
    to the point of total elimination. Chatter during machining is a type of undesired
    vibration, caused by the cutting tool or the part working against each other,
    rather than with each other. The actual cause of such vibration is not always
    easy to identify quickly, at least not without some special equipment. It is not
    unusual to find that the actual remedy may take a few trials to succeed. However,
    there are quite a few options the CNC programmers or the machine operators can
    explore and apply to eliminate chatter in most cases.


    # ## Factors Behind Chatter


    Chatter is more often present on CNC lathes than on machining centers, particularly
    during deep-hole boring operations. A boring bar can work very well if the ratio
    of its overhang length to its diameter is within reasonable limits. Normally,
    the ratio is about 3:1 for steel shank boring bars, and 5:1 (or more) for carbide
    bars. In practice, it means that a 25-mm steel shank bar (1.0 inch) can be extended
    about 75 mm (3 inches), or 125 mm (5 inches) for a carbide bar.


    Actual cutting conditions, such as the material type, depth of cut, cutting speeds
    and particularly feedrates also play a large role. Long bar overhang is one of
    the most common reasons for chatter to occur. Although the solution is simple
    — just shorten'
