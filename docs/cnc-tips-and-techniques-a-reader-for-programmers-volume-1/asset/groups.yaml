  - "[PAGE 6]\n\n# # About the Author\n\n**Peter Smid** has been a professional consultant,\
    \ educator, and speaker, with many years of practical, hands-on experience in\
    \ industry and education, including CNC and CAD/CAM applications on all levels.\
    \ His consulting has focused on the practical use of CNC technology, part programming,\
    \ Autocad®, Mastercam® and other CAD/CAM software, as well as advanced machining,\
    \ tooling, setup, and many related fields. As a consultant he has successfully\
    \ assisted several hundred companies with his wide-ranging knowledge.\n\nOver\
    \ the years, Peter has developed and delivered hundreds of customized educational\
    \ programs to thousands of instructors and students at colleges and universities\
    \ across United States, Canada and Europe, as well as to many manufacturing companies\
    \ and private sector organizations. He has actively participated in many industrial\
    \ trade shows, conferences, workshops and seminars.\n\nPeter has also written\
    \ many articles and in-house publications on the subject of CNC and CAD/CAM and\
    \ for six years he wrote a monthly column in the *Shop Talk* magazine.\n\nPeter\
    \ Smid is the author of four other best-selling CNC books published by Industrial\
    \ Press, Inc. and all books are also available as e-books. For more information,\
    \ go to *www.industrialpress.com*.\n\n+   - **CNC PROGRAMMING HANDBOOK**  \n+\
    \     A Comprehensive Guide to Practical CNC Programming  \n+     *Third Edition\
    \ – ISBN 978-0-8311-3347-4*\n+   \n+   - **CNC CONTROL SETUP for MILLING AND TURNING**\
