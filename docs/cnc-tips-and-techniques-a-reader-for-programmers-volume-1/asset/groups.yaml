    另一方面，控制功能可能重要得多，尤其是当*机床 A* 的控制系统品牌与*机床 B* 不同时。例如，Fanuc、Yasnac 和 Haas 控制系统的编程方式相似，但它们也各有差异。程序员必须了解两种控制系统的*所有*功能，并考虑*所有*可用的控制选项。


    通常，程序是针对特定的机床与控制系统组合开发的。出于排程原因，或当某台机床故障时，能够将加工任务从*机床 A* 切换到*机床 B*，反之亦然，往往意味着要更改程序。然而，对于属于同一类别的控制系统（如
    Fanuc、Yasnac、Haas 以及许多其他系统），可以按照体现机床和控制系统共同点的方式来编写程序。要在完全不更改程序的情况下切换机床，并不总是可行，但尽量减少此类更改对提高生产率大有帮助。


    ### 处理机床差异


    为了在程序中处理机床设计上的差异，有些思路值得考虑。为常用刀具分配刀具号及其对应的偏置号时，应分配两台机床共有的编号，通常采用较小的编号。如果需要最高主轴转速，应考虑按最大转速*较低*的那台机床的最高速度来编程。进给率也同理，不过最高进给率通常不会编程，因此不应成为问题。自动换刀的随机式和固定式可以在程序结构中解决（见下文）。仅某台机床独有的特殊功能不能牺牲。


    在程序结构方面，第一处更改可能就在程序开头。编写启动程序段时，其典型内容可能是 N1 G20 G17 G40 G18 G49 或类似内容。有些控制系统要求单位选择指令
    G20（或 G21）放在单独的程序段中。将 G20 或 G21 单独放在一个程序段中，对所有类型的控制系统都适用。


    类似的结构更改也可能体现在换刀上。例如，虽然习惯上将 **T02 M06** 编在同一程序段中，但有些控制系统要求每条指令都放在各自的程序段中。同样，采用两段式方法总是可行的。使用
    M 功能时，大多数较老的控制系统在一个程序段中只接受一个 M 功能，较新的控制系统可能最多接受三个。这种便利性可能会妨碍选择备用机床的能力，因此在一个程序段中只使用单个
    M 功能，可为该目的提供更好的程序结构。


    还有其他编程工具，其中一些并不总是可用。最典型的是所有控制系统都常见的程序段跳过功能（斜杠），以及大多数控制系统上可选配的宏功能。使用程序段跳过方法可能非常强大，特别是当控制系统允许斜杠代码出现在程序段中间时。在这种情况下，例如在同一程序段中编写
    **S5000 M03 / S6000**，如果程序段跳过为*开启*，主轴将以 5000 rpm 旋转；如果开关为*关闭*，则以 6000 rpm 旋转。请注意，两种控制系统都必须具备此特殊功能。另请注意，M03
    包含在斜杠*之前*。


    调整程序结构以实现某种结果可能非常有用。理想情况下，最好针对单一的机床/控制系统组合进行编程。因紧急情况而选择备用机床，通常足以证明程序中所需更改是合理的。因排程原因选择备用机床，则需要在编程甚至机床设置上做出一定妥协。了解各种可能性将有助于做出更好的决策。


