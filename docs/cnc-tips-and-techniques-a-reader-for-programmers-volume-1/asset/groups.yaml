    The second block is identical for both cycles. The addresses P and Q always go
    together. The *address P* identifies the block number representing the tool position
    at the contour start, and the *address Q* identifies the block number representing
    tool position at the *contour end*. Both block numbers must be unique (not duplicated
    in the program).


    Addresses U and W also work together; they represent the stock allowance left
    for subsequent finishing. The *U-address* is the amount of stock left on *diameter*,
    and the *W-address* is the amount of stock left of *faces*. For simultaneous XZ
    motions, the U and W stock allowances will be compounded by the control system.
    Note that U is a dimension on diameter — a 0.03" physical stock will be programmed
    as U0.06. A positive amount of U or W leaves stock on the positive side of the
    contour; a negative amount leaves the stock on the negative side of the contour,
    determined by the cutting direction. For the majority of work, the U-address will
    be positive for turning, and negative for boring. A W-address is typically positive
    for both types of operations, but it could be negative, for example, in some back-boring
    operations.


    The *F-address* is the cutting feedrate and the *S-address* is the cutting speed,
    normally in G96 mode (constant cutting speed), programmed in *feet per minute*
    or *meters per minute*. If the speed has been programmed at the program beginning,
    it is not necessary to include it in the cycle call.


    ### The G70 Cycle


    Finishing cycle G70 is always programmed as a one-block command, with the mandatory
    P and Q, and optional F and S data:


    ```

    G70 P.. Q.. F.. S..

    ```


    Addresses P and Q are more often than not the same as those used for the roughing
    cycle.


    ### Roughing and Finishing a Simple Part


    Here is an example of one tool that will both rough and finish a simple part,
    using G71 and G70 cycles in imperial units:


    ```

    N1 G20 T0100

    N2 G96 S400 M03

    N3 G00 G42 X6.2 Z0.1 T0101 M08 (START POSITION FOR THE CYCLE)

    N4 G71 U0.15 R0.025 (ROUGH CYCLE - FIRST BLOCK)

    N5 G71 P6 Q13 U0.06 W0.005 F0.02 (ROUGH CYCLE - SECOND BLOCK)

    N6 G00 X3.2 (CONTOUR START POSITION)

    N7 G01 X3.5 Z-0.05 F0.007

    N8 Z-1.5 F0.012

    N9 X4.0 Z-2.5

    N10 Z-3.5 R0.375 (AUTO CORNER ROUNDING)

    N11 X5.9

    N12 U0.2 W-0.1 F0.007

    N13 G00 U0.2 (CONTOUR END POSITION)

    N14 G70 P6 Q13 S500 (FINISHING CYCLE)

    N15 G40 G00 X5.0 Z3.0 T0100

    N16 M30

    %

    ```


