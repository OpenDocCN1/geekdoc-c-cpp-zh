    ## CNC 技巧与技术


    因为 Z 轴起始位置为 Z3.0（在固定循环中编程为 R3.0），刀具的总行程长度将为 27.925。所需啄钻次数为三次，*始终*按总行程距离计算，在我们的例子中为
    27.925 mm。


    27.925/3 的结果是 9.308333，作为最小 Q 深度值。由于公制单位要求四舍五入到三位小数，Q 深度必须向上取整，并且必须在固定循环中编程为 **Q9.309**（或更大）。因为要求的是*最小*
    Q 深度，所以循环中必须使用 Q9.309。注意舍入！将 9.308333 按数学方法正确舍入到三位小数是 9.308，但这不满足啄钻中*向上*取整的要求。正确的最小
    Q 值将是 Q9.309，并在循环中使用。


    如果你确实将最小 Q 深度用作 Q9.308，你将得到 9.308 x 3 次啄钻 = 27.924 深度，差一微米（！）——也就是 0.00003937
    英寸。我故意使用了一个公制示例，利用微米作为 CNC 加工中心所能接受的最小单位。结果将是三次 9.308 的啄钻，以及第四次恰好一微米的啄钻！通过将 Q
    深度改为 9.309，将会有两次 9.309 的啄钻和一次 9.307 的啄钻。因此，最终答案是：最小 Q 深度为 9.309 mm。如你所见，即使一微米也会在
    CNC 工作中产生差异。


