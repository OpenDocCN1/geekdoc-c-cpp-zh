    # ## Scaling Option


    *September 2008, updated February 13*


    One function on many control systems is called scaling. Often offered as an optional
    control feature, scaling allows an existing program to machine a part smaller
    or larger. Before you jump to conclusions, keep in mind that scaling is not meant
    to be the means of part correction due to poor programming methods or bad setup.
    Scaling is often used in casting or plastic injection mold work to allow adjustments
    due to shrinkage during the molding process, but can be used in 2D work as well.
    From a CNC programmer’s perspective (rather than engineering perspective), scaling
    is quite easy to program, but there are a number of some special considerations.


    # ### Changing the Toolpath


    Scaling will physically change the current toolpath proportionally, based on the
    location of the scaling center and the scaling factor provided. A control-dependent
    system parameter can be set to make scaling effective or ineffective for each
    of the three main axes, but not for any additional axis. Also, scaling does not
    affect various offset modes, namely work offsets G54–G59, tool length offset G43,
    and cutter radius offset mode G41–G42. If a fixed cycle in the G81–G89 series;
    or G73, G74, or G76; is used while scaling mode is active, the shift amount in
    G76 and G87 cycles (the peck drill depth and relief amount in G73 and G83 cycles)
    will *not* be affected.'
  - '[PAGE 188]


    The *machine zero return* commands are another consideration. Preparatory commands
    related to the machine zero return, particularly G28 and G30, but also G27 and
    G29 (rarely used anymore), should always be programmed with scaling mode OFF in
    effect. On older controls that still use the G92 command for position register,
    make sure the scaling mode OFF is also in effect. Cutter radius offsets G41 and
    G42 should always be canceled by G40 before the scaling function is activated.
    As mentioned already, other commands and functions can be active, including all
    work offset commands G54 through G59 and the additional ones, if they are available.


    # G50 and G51 Codes


    Fanuc programming format uses two G-codes: G50 and G51 commands, where G50 cancels
    the scaling mode and G51 makes the scaling mode active. The programming format
    for G51 is:


    ```

    G51 I.. J.. K.. P..

    ```


    IJK addresses refer to their respective XYZ coordinates of the scaling center,
    while the P-address is the scaling factor. Scaling center is defined in absolute
    coordinates of the current units of measurement, and scaling factor can be in
    0.001 or 0.00001 increments, depending on the control setting. In order to prevent
    any conflict, both G50 and G51 should be programmed as separate blocks, with no
    other significant data included.


    The scaling center determines the *location* of the scaled tool path and the scaling
    factor determines its size. For scaling factors greater than one, the machining
    tool path will be *expanded*. For scaling factors smaller than one, the machining
    tool path will be *reduced*. The scaled part will always expand away from or reduce
    towards the scaling point equally along all specified axes.


    The basic programming format is illustrated in the following example:'
  - '[PAGE 189]


    ```

    ~~~gcode

    N1 G20

    N2 G17 G40 G80

    N3 G50 (SCALING OFF AT TOOL START)

    N4 G90 G00 G54 X-1.25 Y-1.25 S800 M03

    N5 G43 Z1.0 H01 M08

    N6 G51 I0 J0 P1.050 (SCALING CENTER AT X0Y0 - 1.05X expand)

    N7 G01 Z-0.7 F50.0

    N8 G41 X-0.75 D51 F25.0

    N9 Y1.75 F15.0

    N10 X1.5

    N11 G02 X2.5 Y0.75 I0 J-1.0

    N12 G01 Y-0.75

    N13 X-1.25

    N14 G40 Y-1.25 M09

    N15 G50 (SCALING OFF AT TOOL END)

    N16 G00 Z1.0

    N17 G28 Z1.0

    N18 M30

    %

    ~~~

    ```


    # ## Rounding Errors


    One very important consideration in scaling is a possible rounding error. To illustrate,
    consider a conversion between metric and inch units. A dimension of 1.0 inch will
    become 25.4 mm, which is an exact conversion. On the other hand, 25.4 mm converted
    to inches will use a factor of 0.039370079. If the scaling factor is set to a
    three decimal accuracy, the 25.4 mm will become only 0.991 inches (25.4 x 0.039
    = 0.9906) — a rather large error of about 0.009. With scaling factor set to five
    decimal places, the error will still be there but it will be practically negligible.


    The scaling factor is a *multiplying factor*, not a percentage. If a certain scaling
    percentage is required — for example, 5% shrinkage — it has to be converted. The
    scaling factors of P1.05 (expansion) or P0.95 (reduction) are well within the
    expected accuracy of the final part precision.


    For a complete example with illustration, using the scaling function, see Appendix
    4 at the back of this book.'
