    *July 2004, updated February 2013*


    If we have to name a single major benefit that modern CNC technology has offered
    over the initial NC technology, it would have to be the various forms of machining
    cycles. Yes, those small routines save much of programmers’ time and calculations.
    CNC machining centers have had their ubiquitous G81, G82, G83, etc., for drilling,
    boring, tapping, and other operations related to hole machining for a long time.
    This group of special cycles makes perfect sense for the part programmer because
    even companies specializing in complex 3D can use them efficiently, albeit occasionally.
    Virtually every CAM software program supports these *fixed cycles* or *canned
    cycles*, as they are commonly called, through the post processor output. The story
    is somewhat different when it comes to CNC lathes and turning centers.


