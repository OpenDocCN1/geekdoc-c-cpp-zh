    ## 定义 G28 命令


    在我看来，困难的主要原因在于过于常见的教科书式定义（手册、书籍）。可以理解，命令定义必须简短，而且通常没有（或无法）呈现命令的全部含义。G28 的情况就是如此。如果对
    G28 命令的定义没有限制，那么定义会是什么？让我试试这个：


    > **G28 = 施加到指定轴（或多轴）并经过中间点的机床回零运动**


    尽管更长，但这个定义要具体得多，而且它是 G28 命令的真实定义。请记住，G28 在程序中使用时不能单独使用。它只是一个非模态准备命令——可以说，是一个设置阶段的命令。G28
