    # Minimizing Program Length


    *May 2005, updated February 2013*


    In the past, the topic of handling long programs has focused on running such programs
    efficiently at the machine, during the actual part production with DNC support.
    Long programs are often the result of a CAM output, but they are also developed
    manually in many cases. Keep in mind that the word *long* is quite often relative
    to the amount of work involved and the available control memory capacity. CNC
    lathes, for example, have much smaller memory capacity than CNC machining centers.
    In either case, CNC programmers have several methods at their disposal that will
    make long programs shorter. Using the methods suggested in this column, it may
    often be possible to fit a long program into the control memory, without using
    the DNC method. Various methods are available to reach this goal and they can
    be adopted before the program is developed or after the program has been developed.


    In CAM programming, the main key to quality program output is a quality post processor.
    The purpose of a post processor in CAM software is to provide a customizable platform
    for the desired program output. The same thoughts and efforts that go into post
    processor customization will also be considered in manual programming. There is
    no magic here — if you want to shorten the program, you must do it *without losing
    its integrity and purpose*. Removing an operation from a program will certainly
    make the program shorter, but the price may be too high to pay. When developing
    the CNC program, look at various features that offer shorter output right from
    the box, so to speak. They include various fixed cycles, multiple repetitive cycles,
    subprograms, macros, counters, and automatic corners. Starting with a program
    that is already as short as possible, it makes any subsequent effort that much
    more effective. Let’s look at some options available.'
