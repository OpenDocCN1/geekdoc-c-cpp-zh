    # *Verified part programs*


    These are part programs accepted for production and verified at some earlier date.
    Keep in mind that only the programs have been verified, not the setups or tools.
    Setups and tools are subjects to frequent changes; they must be verified every
    time. Another important consideration is the CNC machine tool being used. Even
    verified programs have to be checked if they are used on a different machine than
    the previous time.


    # **Decreasing Costs**


    Decreasing the cost of the first part — and, therefore, the whole batch — has
    to be considered at four levels, all interrelated:


    # *Planning*


    Process planners or supervisors have to evaluate many aspects of the production.
    One of their key considerations is the number of parts produced in a single batch.
    The more batches per period of time, the more expensive each batch will be, mainly
    because of the repeated setups. Assuming that more parts produced in a batch will
    have no negative side effects (for example, on inventory), fewer batches per period
    of time might provide part of the solution.


    # *Programming*


    CNC programmers can literally do wonders to decrease the cost of the first part
    through the program. Here are only some ideas. Using consistent tool numbers for
    commonly used tools saves time during setup, as tool registration and many related
    offsets will not change. Another very effective programming method is to include
    one or more trial cuts with the block skip function in the program. These cuts
    will only be used for the first'
  - '[PAGE 28]


    part testing, but turned off for a full run (except the occasional inspection).
    Don’t forget to provide sufficient comments in the program, so the operator knows
    the purpose of these special cuts. Another consideration, especially for programs
    developed manually, is to invest in reliable CNC simulation software. Although
    no software can simulate every detail of CNC machining, it can be an excellent
    tool to find errors and areas of improvement.


    # Setup


    At the machine, the CNC operator is normally responsible for setting up tools
    and fixtures, registering tool numbers and various offsets, troubleshooting the
    program, and monitoring the operation. Speeding up the non-productive time required
    for setup is the most significant single saving available. Modular fixturing,
    common tooling, general setup consistency, and the operator’s skill all add up
    to make the transition between setup and operation faster and smoother.


    # Machining


    During machining, the CNC operator relies heavily on the program itself. During
    the first part run, it should not be enough for the CNC operator to look just
    for errors or monitor the program flow. Operators can and should do much more
    at the same time. For example, they can think about optimizing the program for
    better performance. Speeds and feeds are the most common areas to focus on, but
    many more “little things” also influence the cost of manufacturing (including
    the first part).


    Lowering the cost of the first part should be a team effort. CNC programmers may
    be the key people in such efforts. However, mutual cooperation of everybody involved
    will offer many benefits and have a positive effect on the proverbial bottom line.'
