    # Work Offset G54 is NOT Always an Automatic Default on Most Controls


    All six work offsets that most Fanuc and similar controls offer are seldom needed
    in a single program. That leaves only one that is needed, G54 (being the first
    in line). Many programmers do not use it at all, and have no problems. The reason
    is that they count on the default control settings. Some controls will use G54
    settings, even if G54 does not appear in the program. Controls that do not have
    G54 set as a default may cause erroneous motions, including a possible over-travel.
    It is always a good practice to include work offset in the program and not count
    on default settings.


    # G92 and G54 are Quite Different


    Now mostly obsolete, the old G92 position register command is always measured
    from part zero to the current tool position. The modern work offsets in the range
    of G54 to G59 are measured from machine zero to the part zero. Conventional wisdom
    says that these two groups should never been used in the same program together.
    I have seen a few successful exceptions, but the wisdom is still correct — use
    one or the other if you have a choice, but not both.


