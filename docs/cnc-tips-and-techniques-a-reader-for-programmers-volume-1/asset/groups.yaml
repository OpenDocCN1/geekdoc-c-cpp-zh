    ```


    # Types of Macros


    The example used Fanuc system model 16/18/21, but it also used offset memory Type
    A. This is reflected in variable #32. Macro variable #32 is absolutely critical
    and requires explanation. All active offsets are stored as system parameters.
    Fanuc offers three types of memory offset registers (Type A — one register is
    shared by tool length and radius offsets; Type B — also a shared register, but
    geometry and wear offsets are separate; Type C — separate registers for tool length
    and radius offsets, each with geometry and wear settings). For 200 offsets or
    less, Type A macro uses system variables #2001 to #2200, Type B uses system variables
    #2001 to #2200 for the geometry offset, and #2201 to #2400 for the wear offset.
    Finally, Type C uses system variables #2401 to #2600 for the radius geometry offset,
    and system variables #2601 to #2800 for the radius wear offset. Variable #32 must
    always reflect the offset memory type used. There are no tool length system variables
    for types A and B, and those for Type C are not required. Various error trapping
    features can be added'
