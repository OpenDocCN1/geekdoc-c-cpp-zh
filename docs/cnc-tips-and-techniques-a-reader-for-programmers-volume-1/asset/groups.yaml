    stock height or length. The next example shows two face cuts — the first one may
    be skipped if there is no need for it:


    ```

    ...

    N78 G90 G00 X-3.0 Y2.65

    /N79 Z0.1 M08

    /N80 G01 X8.5 F15.0

    /N81 G00 Z0.2

    /N82 X-3.0

