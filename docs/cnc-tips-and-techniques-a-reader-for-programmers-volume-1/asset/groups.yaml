    ```

    G76 P.. Q.. R..

    G76 X.. Z.. R.. P.. Q.. F..

    ```


    The *P* address in the first block includes the number of finishing passes, the
    length of the lead for pullout at the thread end, and the thread angle all in
    one. The *Q* address specifies the minimum cutting depth, and R is the finish
    allowance. In the second block, X and Z are the same as before, R specifies the
    amount of taper (if used), *P* is the thread depth, *Q* is the depth of the first
    pass, and F is the thread lead (feedrate). Neither *P* nor *Q* in the second block
    accept a decimal point.


    As you see from the two examples, the main difference between the two cycle formats
    is the additional programmable parameters, which make the cycles much more flexible
    than using internal parameter settings. In either double block cycle, do not confuse
    the addresses in the first block with the same addresses in the second block.
    As you see, the *conversion* from a single block format to a double block adds
    certain features that are now programmable, offering more flexibility to the CNC
    programmer.'
