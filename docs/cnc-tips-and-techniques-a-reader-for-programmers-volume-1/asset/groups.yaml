    (or G33 on some machines). In this case, the operator cannot do anything significant
    during machining to improve the threading passes because all motions are fully
    embedded in the part program. In order to improve the thread quality, the design
    of the program itself has to be changed, virtually from the ground up. This process
    is time consuming and does not guarantee a better thread.


