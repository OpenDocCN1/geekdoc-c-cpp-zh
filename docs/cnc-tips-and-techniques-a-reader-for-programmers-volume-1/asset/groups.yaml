    # # Spindle Speed Control on CNC Lathes


    *January 2008, updated February 2013*


    ![](img/0023bd5cc50494e6d7799ab76d437c8d_162_0.png)


    Programming spindle speed on a CNC machining center requires nothing more than
    specification of the number of revolutions per minute and rotational direction.
    For example, 1500 r/min at normal spindle rotation will be entered as S1500 M03.
    Because the cutting tool diameter does not change, neither does the spindle speed.
    Although the principles are the same, programming spindle speed for CNC lathes
    has to consider several additional factors.


    First, for turning and boring, it is the part that rotates, not the tool. Therefore,
    the part diameter changes frequently, sometimes quite dramatically, during machining.
    With every change in diameter, a corresponding spindle speed is required. Second,
    some machining operations take place at the spindle centerline, such as drilling,
    reaming, and tapping. Then, there is single point threading.


    # ## G96 and G97


    Fanuc and similar controls provide two programming modes: cutting speed and spindle
    speed. Cutting speed is programmed in feet or meters per minute; spindle speed
    is programmed in revolutions per minute. To select one or the other, two G-codes
    are available: G96 selects cutting speed and G97 selects spindle speed. Cutting
    speed is known under several other descriptions, such as constant surface speed
    or peripheral speed. Abbreviations such as SFM or SFPM (surface feet per minute)
    are also used for imperial units. In both cases, either the G96 or G97 command
    is followed by the S-address. A bit of care is necessary here to avoid making
    an error. For example, in imperial units, the program blocks may be:


    ```

    ```

    G96 S400 M03    ... selects 400 feet per minute

    G97 S400 M03    ... selects 400 revolutions per minute

    ```

    ```'
  - '[PAGE 163]


    A single digit error can have serious consequences. When do we use one mode over
    the other?


    Rather than listing when G96 is used, it is easier to remember when G97 is used.
    Spindle speed mode G97 is used for all operations that take place at the machine
    centerline. The already mentioned drilling G97 mode is also used for any threading
    operations, regardless of cutting diameter. That’s it. All other operations will
    use G96, the cutting speed mode. Cutting speed will automatically calculate the
    actual spindle speed, at any diameter. The result is constantly changing spindle
    speed, as the tool moves from one diameter to another.


    Just a couple of issues that belong to the caveat emptor category should also
    be addressed. One issue is what will happen if G96 is used in drilling, for example?
    Because the cutting diameter at machine centerline is zero, the common spindle
    speed formula fails. In this case, the spindle will rotate at the maximum speed
    of the selected gear range, which can be extremely high. A related issue is a
    facing operation that moves the cutting tool to the centerline or just slightly
    below. G96 mode is desired, but the proximity to a zero diameter at the end of
    cut may increase the spindle speed too high and even present a safety risk. In
    this case, there is a simple remedy. Command G50 can be used to limit the maximum
    spindle speed in G96 mode. Programming — for example, G50 S2500 — will gradually
    increase the spindle speed as diameter is decreasing, until the control reaches
    2500 r/min. At that point, this pre-selected spindle speed will be clamped and
    remain that way until the end of the cut. There may be some increased tool pressure,
    which can be minimized by a slower cutting feedrate.


