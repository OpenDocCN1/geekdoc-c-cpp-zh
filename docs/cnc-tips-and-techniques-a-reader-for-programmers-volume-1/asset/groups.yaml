    ## 特殊用途 G 代码


    *2006 年 5 月，2013 年 2 月更新*


    任何与 CNC 工作哪怕只有一点关联的人，可能都熟悉 G 代码，至少知道它们的存在。*准备指令*，这是它们的正式名称，只有一个目的——为零件程序中的其他指令赋予特定含义。例如，编程指令
    X10.0 可以解释为 10 mm、10 英寸，甚至 10 秒。如果该指令表示尺寸类程序输入，则它可以是绝对位置，也可以是增量距离和方向，并处于快速定位或进给率模式下。确切含义由一个或多个
    G 代码定义。例如，10 mm 的增量进给运动要求 G21（公制模式）、G91（增量运动）和 G01（直线插补）指令生效，并具有适当的进给率。


    许多准备指令为 CNC 程序员和操作员所熟知，因为它们几乎用于每个


    在典型零件程序中却很少——如果有的话——使用。指令 G27 是机床零点位置检查。它用一个或多个轴编程，并检查指定位置是否对应机床零点位置。如果不是，程序处理停止，控制系统发出报警。随着
    G92（G50）编程（*位置寄存器*）的淘汰，它的实际应用已经停止。在使用工件坐标系偏移（G54 至 G59 或更高）的程序中，不需要该指令。G29 与 G28/G30
    相反。G28/G30 表示经由中间点移动到机床零点，而 G29 是*从机床零点经由中间点移动到指定位置*。该指令在典型程序中几乎无用。


    ### 其他代码


    另一个几乎无用的指令是 G44（*刀具长度负补偿*）。它可能有其拥护者，但普遍使用的 G43 指令（*刀具长度正补偿*）能够实现所有功能。


    可能有点令人费解的一条指令是 G31，它被简单地定义为*跳过指令*。该指令确实非常特殊，因为它专门用于 CNC 机床上的测头测量（在机测量）。其目的是将测头从安全位置以进给速度（就像
    G01 一样）移动到待测位置。一旦测头检测到与材料接触，运动停止，剩余运动不会完成；它被*跳过*，该指令名称由此而来。


    ### G6x 代码


    最后，G6x 范围内还有几条 G 代码，即 G60（*单向定位*）、G61（*精确停止检查模式*）、G62（*自动拐角倍率模式*）、G63（*攻丝模式*）和
    G64（*正常切削模式*）。默认是 G64，即正常切削模式。


    G61 是 G09 的模态版本，当刀具必须以高进给率绕过尖角时，特别是当拐角形成窄角时，它可用于提高精度。在刀具半径补偿模式下切削尖锐内角时，**G62**
    可以改善表面质量。其功能是自动调整切削进给率。用 **G63** 编程的攻丝模式会禁用进给倍率和进给保持按钮，而 **G64** 使切削运动返回到其原始编程模式。所选的每种模式都会替换任何其他模式。


    **G60** 则单独存在。其目的是强制刀具单向定位，无论刀具来自哪个方向。它可用于补偿一些轻微的反向间隙，但并*不*能消除反向间隙。反向间隙问题需要合格的服务技术人员处理。


    可能还有其他不常用的 G 代码，但本专栏提到的这些应能让您对更常见的特殊用途 G 代码有所了解。


