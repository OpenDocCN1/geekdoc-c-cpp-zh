    ### Programming a Long Thread


    *May 2009, updated February 2013*


    In the essay *Limitations in Threading*, the main focus was on limitations in
    single point threading caused by spindle speed that is either too high or too
    low. In this essay, we look at the effect of threading feedrate, particularly
    how it applies to long threads.


    #### Long Threads


    What exactly is a long thread may be a subject for some discussion. For the purposes
    of this article, a long thread is a thread with a ratio of rather small diameter
    to long threading length. In most everyday threading operations, you will work
    with threads that have a length relatively short respective to their diameter.
    These threads, which do not require any physical support at the machine, generally
    do not present any problems in programming or machining. Machining long threads
    does have a few challenges, however. Long threads often require suitable support
    devices, at least a tailstock for basic support, but often a follower rest or
    a steady rest as well, in order to prevent deflection of the part.


    Many CNC machine tool builders provide lathes specially designed for machining
    long parts, such as shafts and tubular stock. These lathes (often of the flat
    bed type) are also capable of threading over their entire Z-axis travel. From
    the CNC programmer’s perspective, a possible problem lies with the feedrate for
    certain *imperial* threads. Feedrate for threading is always the thread lead,
    and no rounding is necessary for metric threads. Some imperial threads have to
    use rounding for feedrate calculation, when the threads per inch (TPI) are converted
    to the thread lead (cutting feedrate).


    #### Sample Program


    As an example of a possible problem of feedrate rounding, consider a single start,
    standard form 60 degree thread 6.0-12, over the threading length of 70 inches
    (actual use of the thread is not important for the illustration):


    - Thread diameter = 6.0 inches

    - Thread per inch (TPI) = 12

    - Length of thread = 70 inches


    Assuming a suitable tooling and part setup, the thread cutting program is easy:


    ```

    N51 T0500

    N52 G97 S550 M03 (SPINDLE SPEED 550 RPM)

    N53 G00 X6.25 Z0.4 T0505 M08 (START POINT CLEARANCE)

    N54 G76 P011060 Q005 R0.002 (G76 - BLOCK 1)

    N55 G76 X5.8978 Z-70.0 R0 P0511 Q0120 F0.0833 (G76 - BLOCK 2 - 0.0833 IPR)

    N56 G00 X12.0 Z5.0 T0500 (TOOL CHANGE CLEARANCE)

    N57 M01

    ```


