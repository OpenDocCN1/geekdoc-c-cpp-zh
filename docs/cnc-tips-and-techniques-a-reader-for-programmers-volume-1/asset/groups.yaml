    of this powerful method.


    The grid should be easy to visualize. It is made of 10,000 rows of 10,000 holes
    each, a total of 100,000,000 holes, arranged in a square pattern. The spacing
    between holes will be 4 mm along the X-axis and 4 mm along the Y-axis. Depth of
    cut will be 1.5 mm, starting 1 mm above the part (the R-level), for the total
    cutting motion of 2.5 mm. The lower left hole is located at X10.0 Y10.0 and will
