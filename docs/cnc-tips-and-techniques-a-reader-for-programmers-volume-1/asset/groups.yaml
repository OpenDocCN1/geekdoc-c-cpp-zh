    \ quite rightly. He is at the top in all the latest drill technology, skills,\
    \ and equipment. Making holes is his business in a very competitive field, and\
    \ being number two in the area is not an option. Recently he was working on a\
    \ part similar to tube sheet plates for heat exchangers — thousands of holes,\
    \ quite deep. Watching the process was quite an experience and reminded me how\
    \ other companies handle programs for such a large number of holes. Let's leave\
    \ our master hole-maker and have a look at this situation in more detail.\n\n\
    ### G73 and G83 Cycles\n\nSpecial drills do exist that allow drilling deep holes\
    \ to the full depth without peck drilling on CNC machining centers. In the absence\
    \ of such drills, the common practice is to program a fixed cycle — the standard\
    \ G73 or G83 cycle — that is designed for such purpose. The G73 cycle is more\
    \ suitable for breaking the chips because it does not retract above the part after\
    \ each peck, only when the drill reaches the final depth. If you need to flush\
    \ chips or get some more coolant into the hole, the G83 cycle may be a better\
    \ choice.\n\nOn Fanuc and similar controls, either cycle requires the Z-axis start\
    \ position (programmed as R), the final hole depth (Z), and the depth of each\
    \ peck (Q). Although these cycles work well in most cases, they lack one feature.\
    \ They are not able to decrease the pecking amount as the drill goes deeper into\
    \ the hole. Optional Fanuc Macro B is an excellent method of programming for this\
    \ purpose because it allows the user the exact control required by developing\
    \ a flexible custom cycle.\n\nWhat about those machine shops that do not have\
    \ the macro option installed? Although there is no direct solution, there is a\
    \ workaround of sorts. Just use the cycle two or three times at the same location,\
    \ and decrease the Q amount for each run. A program may look something like this:\n\
    \n```\n    (G43 Z1.0 H01 M08)\n    G99 G73 X.. Y.. R0.1 Z-2.6 Q0.75 F10.0\n  \
    \  R-2.5 Z-4.0 Q0.5\n    G98 R-3.9 Z-5.85 Q0.25\n    G99 X.. Y.. R0.1 Z-2.6 Q0.75\
    \ (ETC.)\n```\n\nThere is a certain loss of time that can be significant when\
    \ hundreds or even thousands of holes are machined with the same program, but\
    \ it does the job without macros. Another possible problem encountered in machining\
    \ a large number of deep holes has to do with assignment of the Q-amount. Generally,\
    \ we do not think in small increments, and the Q is more often than not just a\
    \ reasonable number, generally based on experience. Consider the following reasonable\
    \ G83 cycle used for 5/8 drill with 0.87 peck depth, 4-7/8 part thickness, 0.06\
    \ breakthrough and 0.1875 drill point length (0.625 × 0.3). The programmed depth\
    \ is 4.875 + 0.06 + 0.1875 = 5.1225:\n\n```\nG99 G83 X.. Y.. R0.1 Z-5.1225 Q0.87\
    \ F10.0\n```\n\n### Drilling Thousands of Holes\n\nThe G83 cycle is necessary\
    \ in this case to clean most of the chips out of the hole. This seems innocent\
    \ enough; program data are definitely reasonable and, for a few holes, the program\
    \ works well. Yet, it can be a costly piece of program code when, for example,\
    \ 5000 holes are drilled. Let me do some math here.\n\nTo calculate the number\
    \ of pecks, the control system divides the programmed pecking depth of Q0.87 into\
    \ the total travel between R0.1 and Z-5.1225, a distance of 5.2225. This distance,\
    \ when divided by 0.87, calculates 6.003 pecks, which in reality means seven pecks,\
    \ as the control does not allow exceeding the Q-amount. That means six pecks will\
    \ be done at 0.87 each, resulting in only 5.22 total distance traveled. The remaining\
    \ 0.0025 will be the actual depth of the last peck. Because cycle G83 is in effect,\
    \ the drill has to travel up by 5.22 and back by almost the same amount, it makes\
    \ about 10.4 inches of travel in the air per hole, just to cut 0.0025. In addition,\
    \ this 0.0025 is below the part anyway and more air will be cut.\n\nNow, the costs.\
    \ Take the 10.4 inches of extra non-cutting travel, multiply it by 5000 holes,\
    \ and divide the result by the rapid travel of common 900 in/min rapid rate. The\
    \ result is 57.8 minutes wasted, almost a full hour.\n\nThe solution is very simple.\
    \ Just change the Q0.87 to Q0.871 (or even a little higher), which will eliminate\
    \ the last peck. This adjustment saves an hour of air cutting for every five thousand\
    \ holes. Our master hole-maker would be pleased.\n\n## Alternate CNC Machine Selection\n\
    \n*November 2005, updated February 2013*\n\nThere was a time when having a single\
    \ CNC machine on the floor gave a machine shop a somewhat privileged status amongst\
    \ its peers, even among customers and competitors — a pleasurable mixture of awe\
    \ and envy. Being the first one to be in possession of the greatest and newest\
    \ technological marvel is still considered hip and cool today, even if CNC technology\
    \ as such is not that new anymore. It is quite common to find even small machine\
    \ shops with several CNC machines, typically purchased over the period of several\
    \ years.\n\nOf course, over several years, CNC technology has evolved in both\
    \ the machine tool design and the control features. Having older and newer CNC\
    \ machines working side by side presents several challenges. Apart from the standard\
    \ scheduling challenges that apply to all machine tools in the shop, the CNC programmers\
    \ and operators face challenges of their own.\n\n### Comparing CNC Machines\n\n\
    This essay looks at techniques that can be adapted in the part program and/or\
    \ at the machine control. For example, let’s use two similar CNC machining centers,\
    \ *Machine A* and *Machine B*. They are both of similar capacity and features,\
    \ so a certain job can be loaded on either machine. From a programming perspective,\
    \ the major machine design considerations are the likely differences in the maximum\
    \ spindle speeds and feedrates, capacity of the tool magazines, the tool change\
    \ type, and spindle output ratings. Each directly influences the actual program\
    \ development. Other possible differences, such as rapid travel rates, do not\
    \ directly influence the programming method.\n"
  mdcn: "\n螺纹直径必须单独计算，以使金属去除率保持相当一致。此外，大多数螺纹都受益于侧向进给，也称为角度进给或复合进给。因此，每个起始位置都必须更改其\
    \ Z 坐标，而该坐标必须根据走刀深度和所需的进给角度通过三角学计算得出。这可能是一项相当繁重的编程工作。\n\n尽管 G92 螺纹循环在缩短程序方面取得了一些进展，但它并未解决任何繁琐的计算问题。G92\
    \ 只是免除了重复数据的反复编写——这意味着你仍然需要计算每次螺纹走刀的直径。此外，G92 循环仅适用于直进给或切入式进给，不适用于角度进给。\n\n##\
    \ G76 螺纹循环\n\nG76 螺纹循环的引入彻底改变了螺纹编程。在非常短的程序段中蕴含着强大的功能——不再需要计算走刀次数或每次走刀的直径，不再需要通过三角学来求下一个\
    \ Z 坐标，而且还能对切削深度和进给进行出色控制。所有这些以及更多功能都被压缩到程序的一两个程序段中，适用于任意次数的走刀。G76 循环有两种版本：一种较旧，只需一个程序段；另一种较新，需要两个程序段。车床控制系统只支持其中一种方法，而不是两种都支持。两种方法都在机床上提供了相当大的灵活性，因此\
    \ CNC 操作员可以微调切削条件。两种方法都提供参数化设定（意味着数据可以在外部更改，而不是通过控制设置更改）。两段式方法提供了更多与精加工走刀相关的选项。毫无疑问，对于大多数单点螺纹加工应用，甚至所有螺纹加工应用，G76\
    \ 都是应使用的循环。\n\n请注意上一句中“大多数”一词的强调。G76 可以加工直螺纹、锥螺纹、多线螺纹；可以加工所有外螺纹或内螺纹。然而，即使是 G76\
    \ 也不能——而且也不打算——始终用于所有螺纹类型。超深螺纹、端面螺纹或平面螺纹，以及某些特殊形状的螺纹，根本无法用 G76 编程，或者至少无法完整地完成。G76\
    \ 主要是软件驱动的。人工输入相对较少；软件掌控大部分操作。这一切都很棒，并且在大多数螺纹加工任务中运行良好。那其余的呢？如果 G76 无法以令人满意的方式完成某项特定的螺纹加工任务，替代方案是什么？有吗？\n\
    \n对于这些问题只有一个答案：是的，有一个极好的替代方案，它的名字叫 G32。简单的 G92 循环并不能带来任何值得考虑的重大好处。另一方面，G32 对系统软件能够处理的任何螺纹都提供了绝对的控制。G32\
    \ 是终极解决方案，但在效率方面需要付出代价。使用 G32 编写的程序必须从一开始就是正确的。在机床上无法进行微调；程序可能非常长，而且错误很容易混入其中。尽管如此，对于单点螺纹加工，请将\
    \ G76 作为日常最佳选择，但也要为 G32 留一扇门——它也许能救急。\n\n![](img/0023bd5cc50494e6d7799ab76d437c8d_73_0.png)\n\
    \n## 当 1 英丝等于 65 美元\n\n*2005 年 10 月，2013 年 2 月更新*\n\n我的一个客户自认为是钻孔大师，并为此感到自豪，这完全有道理。他在所有最新的钻头技术、技能和设备方面都处于顶级水平。钻孔是他所在的一个竞争非常激烈领域的业务，在该地区做第二名是不可接受的。最近，他在加工一个类似于换热器管板零件的工件——数千个孔，而且相当深。观看这个过程是一次相当难忘的经历，也让我想起其他公司如何处理如此大量孔的编程。让我们暂且离开我们的钻孔大师，更详细地看看这种情况。\n\
    \n### G73 和 G83 循环\n\n确实存在一些特殊钻头，可以在 CNC 加工中心上无需啄钻即可将深孔钻至全深。在没有此类钻头的情况下，常见做法是编写一个固定循环——标准的\
    \ G73 或 G83 循环——专门用于此目的。G73 循环更适合断屑，因为它每次啄钻后不会退回到工件上方，而是在钻头达到最终深度时才退回。如果需要冲洗切屑或向孔内注入更多冷却液，G83\
    \ 循环可能是更好的选择。\n\n在 Fanuc 及类似控制系统中，这两种循环都需要 Z 轴起始位置（编程为 R）、最终孔深（Z）以及每次啄钻的深度（Q）。虽然这些循环在大多数情况下运行良好，但它们缺少一个功能：随着钻头深入孔中，它们无法减少啄钻量。可选的\
    \ Fanuc 宏程序 B 是实现此目的的绝佳编程方法，因为它允许用户通过开发灵活的自定义循环来获得所需的精确控制。\n\n那些没有安装宏选项的机械加工车间该怎么办？虽然没有直接的解决方案，但有一种变通方法。只需在同一位置使用该循环两到三次，并每次运行减少\
    \ Q 值。程序可能如下所示：\n\n```\n    (G43 Z1.0 H01 M08)\n    G99 G73 X.. Y.. R0.1 Z-2.6\
    \ Q0.75 F10.0\n    R-2.5 Z-4.0 Q0.5\n    G98 R-3.9 Z-5.85 Q0.25\n    G99 X.. Y..\
    \ R0.1 Z-2.6 Q0.75 (ETC.)\n```\n\n当用同一个程序加工数百甚至数千个孔时，会损失一定的时间，这可能相当可观，但该方法在没有宏的情况下完成了任务。在加工大量深孔时遇到的另一个可能问题与\
    \ Q 值的分配有关。通常，我们不会以很小的增量来思考，Q 值往往只是一个合理的数字，通常基于经验。考虑下面这个合理的 G83 循环，用于 5/8 英寸钻头，啄钻深度为\
    \ 0.87，工件厚度为 4-7/8 英寸，穿透量为 0.06，钻尖长度为 0.1875（0.625 × 0.3）。编程深度为 4.875 + 0.06 +\
    \ 0.1875 = 5.1225：\n\n```\nG99 G83 X.. Y.. R0.1 Z-5.1225 Q0.87 F10.0\n```\n\n\
    ### 钻削数千个孔\n\n在这种情况下，G83 循环是必要的，以清除孔内大部分切屑。这似乎没什么问题；程序数据绝对合理，而且对于少量孔来说，程序运行良好。然而，当例如钻削\
    \ 5000 个孔时，它可能是一段代价高昂的程序代码。让我在这里做一些数学计算。\n\n为了计算啄钻次数，控制系统将编程啄钻深度 Q0.87 除以 R0.1\
    \ 与 Z-5.1225 之间的总行程，距离为 5.2225。该距离除以 0.87 后，计算出 6.003 次啄钻，实际上意味着 7 次啄钻，因为控制系统不允许超过\
    \ Q 值。这意味着将以每次 0.87 进行 6 次啄钻，总行程仅为 5.22。剩余的 0.0025 将是最后一次啄钻的实际深度。由于处于 G83 循环中，钻头需要向上移动\
    \ 5.22，然后再返回几乎相同的距离，每个孔大约有 10.4 英寸的空行程，只是为了切削 0.0025。此外，这 0.0025 本来就在工件下方，因此将切削更多的空气。\n\
    \n现在，计算一下成本。将 10.4 英寸的额外非切削行程乘以 5000 个孔，再除以常见的 900 英寸/分钟的快速移动速率。结果是浪费 57.8 分钟，几乎整整一个小时。\n\
    \n解决方案非常简单。只需将 Q0.87 改为 Q0.871（甚至稍高一点），即可消除最后一次啄钻。这一调整将每五千个孔节省一小时的空气切削时间。我们的钻孔大师会很高兴。\n\
    \n## 替代 CNC 机床的选择\n\n*2005 年 11 月，2013 年 2 月更新*\n\n曾几何时，车间里哪怕只有一台 CNC 机床，就能让机械加工车间在同行中享有某种特权地位，甚至在客户和竞争对手中也是如此——一种令人愉悦的敬畏与嫉妒的混合体。即使到了今天，作为第一个拥有最伟大、最新技术奇迹的人仍被认为是时髦和酷的，即使\
    \ CNC 技术本身已经不那么新了。即使是小型机械加工车间，拥有多台 CNC 机床也是很常见的，通常是在几年的时间里陆续购买的。\n\n当然，在几年的时间里，CNC\
    \ 技术在机床设计和控制功能方面都得到了发展。让新旧 CNC 机床并肩工作会带来几个挑战。除了适用于车间所有机床的标准调度挑战之外，CNC 程序员和操作员还面临着他们自己的挑战。\n\
    \n### 比较 CNC 机床\n\n本文探讨了可在零件程序和/或机床控制中采用的技术。例如，我们使用两台相似的 CNC 加工中心，*机床 A* 和 *机床\
    \ B*。它们具有相似的容量和功能，因此某项工作可以在任一台机床上进行。从编程角度来看，主要的机床设计考虑因素可能是最大主轴转速和进给速率、刀库容量、换刀类型以及主轴输出额定值的潜在差异。每一项都直接影响实际程序的开发。其他可能的差异，如快速移动速率，并不直接影响编程方法。\n"
