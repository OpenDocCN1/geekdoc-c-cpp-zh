    在过去的十年里，彼得·斯米德为 *车间漫谈* 杂志撰写了数十篇专栏文章，涵盖了 CNC 的各个方面，例如攻丝、螺纹加工和滚花；程序长度和内存需求；G 代码、M
    功能、循环、宏……等等。自从 *车间漫谈* 停刊以来，这些专栏文章就一直无法获得。现在，在 *CNC 技巧与技术* 中，我们很高兴将它们重新汇集——超过 60
    篇彼得的最佳专栏文章——全部收录在一本书中，以便您能够完整而便捷地获取彼得在过去十年中分享的建议。


    自首次发表以来，每篇专栏文章都经过了全面审阅，并根据需要进行了更新，以反映该领域持续发生的变化。此处按它们最初发表的时间顺序呈现。还包含一个按主题组织的备选目录。此外，您还会找到几个有用的附录和一份详尽的索引。


    *CNC 技巧与技术* 是彼得·斯米德“遗失作品”的宝库，必将成为您 CNC 工具包中宝贵的补充。我们希望这些文章中的建议和说明能帮助您更高效、更有效地完成工作，并且希望您读得愉快。


    **彼得·斯米德** 是 CNC 领域的专业顾问、教育家、培训师、畅销书作者和演讲者。他在各级 CNC 和 CAD/CAM 应用方面拥有多年的实践动手经验。他非常受欢迎，曾就
    CNC 技术的实际使用、零件编程、培训与开发、CAD/CAM、各种先进加工方法、刀具、装夹及其他相关领域，为制造公司和教育机构提供咨询。数百家组织使用过他的服务，并从他广泛的工业和教育经验中受益。他由
    Industrial Press 出版的其他书籍包括：*CNC 编程手册，第 3 版*；*铣削与车削的 CNC 控制设置*；*FANUC CNC 自定义宏*；以及
    *CNC 编程技术*。


