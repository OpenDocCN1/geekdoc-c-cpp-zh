    *March 2009, updated February 2013*


    In this second essay of two, we look at the roughing and finishing cycles for
    turning and boring in more detail. When programming the G71/G72 lathe cycles,
    some general comments can be useful. Following the suggestions presented here
    may prevent some common programming difficulties:


    ### Preventing Programming Difficulties


    - In the two-block format, both blocks have to contain the G71 or G72 command
    — neither is a modal command.

    - The P-address is always the block number where the contour starts (first point).

    - The Q-address is always the block number where the contour ends (last point).

    - Watch the P and Q numbers as they relate to existing block numbers. Change of
    block numbers, such as re-sequencing, could influence the P and Q numbers. I know
    of only one CNC-oriented editing software (NCPlot™ from www.ncplot.com) that will
    automatically renumber P and Q references, if the block numbers have been changed.
    Also, make sure that no block number is duplicated in the program.

    - Feedrates programmed between the P and Q blocks are for finishing cycle G70
    only.

    - The start position for the cycle is defined as the last XZ coordinate before
    the G71/G72 is called.

    - For safety reasons, use the same start point for roughing with G71/G72 and finishing
    with G70, unless a special application is necessary.

    - The cycle starts and ends at the initial start point, and the return to this
    point is automatic (do not return to the start point within the P-Q block range).

    - The start point in the X-axis determines the actual depth of the first roughing
    pass in G71. For external cutting, increasing the start point diameter will decrease
    the actual depth of the first cut; decreasing the start point diameter will increase
    the actual depth of the first cut.

    - A G41/G42 tool nose radius offset must be entered before G71/G72 is called,
    and must be cancelled after the G71/G72 cycle is completed. Do not use G41/G42
    within the P-Q range. A tool nose radius offset is ineffective for G71/G72 roughing
    cycles.

    - For the two-block entry, the depth of cut is measured per side with a decimal
    point. For example, 0.1" depth will be written as U0.1 for G71 cycle and W0.1
    for G72 cycle.

    - For the one block entry, the depth of cut is measured per side in the units
    of the smallest increment, without a decimal point. For example, 0.1" depth will
    be written as D1000.

    - Changing the cutting depth also influences the last diameter depth, for example,
    to eliminate an extremely small last cut.

    - The U-amount is the amount of stock left on diameter for finishing. Positive
    or negative value indicates on which side of the diameter the stock is to be left.
    Typically, positive stock is left on all external diameters whereas negative stock
    is left on internal diameters.

    - The W-amount is the stock left on faces and shoulders. Most tools do not have
    a very large lead angle, and leaving a large W-amount may cause problems. Leave
    only 0.075–0.125 mm (0.003"–0.005") on vertical faces or shoulders.

    - The main cutting direction for G71 cycle is horizontal (usually towards the
    chuck), for G72 cycle it is vertical (usually towards the center line). Both cycles
    share all basic principles listed.


