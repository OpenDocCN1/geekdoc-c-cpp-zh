  mdcn: "\n\nACPL 项目已弃置\n\nS1\n\n## CNC 技巧与技术\n\nPeter Smid\n\n![](img/0023bd5cc50494e6d7799ab76d437c8d_0_0.png)\n\
    \n## CNC 技巧与技术\n\n### 程序员读本\n\nPeter Smid\n\nIndustrial Press Inc.  \n纽约\n\n本书的完整编目记录将可从美国国会图书馆获取。\n\
    \nISBN: 978-0-8311-3472-3\n\nIndustrial Press, Inc.  \n美洲大道 989 号  \n纽约州纽约市，邮编\
    \ 10018\n\n- 组稿编辑：John Carleo\n- 开发编辑：Robert Weinstein\n- 内文与封面设计：Janet Romano\n\
    - 封面照片提供：James A. Harvey\n\n版权所有 © 2013，Industrial Press。在美国印刷。保留所有权利。未经出版者许可，不得以任何形式复制、存储于检索系统或传播本书或其任何部分。\n\
    \n## 关于本书\n\n自 2000 年以来，Industrial Press 有幸将 Peter Smid 纳入其作者大家庭。作为一位既受欢迎又高产的作者，Peter\
    \ 一直支撑着我们书单中的 CNC 部分，其中的领头之作是全球畅销书 *CNC 编程手册*，现已出版第三版。\n\n*CNC 技巧与技术：程序员读本* 是\
    \ Peter 与 Industrial Press 合作的第五本书。在过去十年中，除了作为图书作者、顾问和教育者的所有职责之外，Peter 还为 *Shop\
    \ Talk* 撰写定期专栏，这是一本提供“制造业与机械加工行业的金属加工解决方案”的月刊。\n\nPeter 为 *Shop Talk* 撰写了数十篇专栏，他的专栏涵盖了\
    \ CNC 的全部主题。这些专栏涉及攻丝、螺纹加工和滚花。涉及程序长度和内存需求。涉及人员配置问题，例如将程序员和操作员设为独立岗位或合并岗位的优缺点。多种专栏聚焦于\
    \ G 代码、M 功能、循环和宏。此外还有更多内容。\n\n自从 *Shop Talk* 停刊以来，这些专栏一直无法获得。现在，在 *CNC 技巧与技术*\
    \ 中，Industrial Press 很高兴将它们重新呈现给您——Peter 最优秀的 60 多篇专栏——汇成一册，让您能够全面、便捷地获取 Peter\
    \ 在过去十年中分享的建议。\n\n这些文章自首次发表以来都经过了彻底审阅，并按需更新，以反映该领域持续发生的变化。这里按它们首次发表的时间顺序呈现。书中还包含一个按主题组织的备选目录，书末还附有几个实用附录和详尽索引。\n\
    \n我们希望您会发现 *CNC 技巧与技术* 是您 CNC 藏书中的宝贵补充，并希望 Peter 的建议能让您的工作更高效、更有效、更有价值。\n\nPeter\
    \ 与我们一同欢迎您的反馈和问题。只需写信至 info@industrialpress.com，我们一定会将您的信息转达给他。\n\n*Industrial\
    \ Press*  \n*2013 年 4 月*\n\n![](img/0023bd5cc50494e6d7799ab76d437c8d_5_0.png)\n\
    \n由 Internet Archive 于 2018 年数字化，资助来自 Kahle/Austin Foundation\n\n## 关于作者\n\n**Peter\
    \ Smid** 是一位专业顾问、教育工作者和演讲者，在工业和教学领域拥有多年实际动手经验，包括各层级的 CNC 与 CAD/CAM 应用。他的咨询工作聚焦于\
    \ CNC 技术的实际应用、零件编程、AutoCAD®、Mastercam® 及其他 CAD/CAM 软件，以及高级加工、刀具、设置和许多相关领域。作为顾问，他凭借广泛的知识成功协助了数百家公司。\n\
    \n多年来，Peter 为美国、加拿大和欧洲各地学院和大学的数千名教师和学生，以及许多制造公司和私营部门组织，开发并交付了数百个定制教育项目。他积极参与了许多行业展会、会议、工作坊和研讨会。\n\
