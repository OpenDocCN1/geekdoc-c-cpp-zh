    repetitive cycle*, using a threading specific cycle G76. Comparing this cycle
    with another popular cycle, G71/G72 for turning and boring, G76 has many more
    parametric settings that can be adjusted at the machine, during production, if
    necessary. This flexibility is what makes the cycle not only popular, but also
    very effective for lead time.


