    *螺距* 定义为相邻两牙对应点之间的距离。仅对于单线螺纹，*导程* 才等于 *螺距*。螺纹加工的切削进给率始终等于螺纹导程。对于任何螺纹，进给率等于：


    进给率 = 导程 = 螺距 × 线数


