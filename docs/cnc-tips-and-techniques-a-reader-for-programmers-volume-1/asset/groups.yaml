    The second step is to register the new G-code (13) as a system parameter.


    Offset number 13 has to be registered in the parameter that corresponds to the
    calling program, which is O9013. Depending on the control model used, the range
    of system parameters will be different (consult your control manual). This example
    uses Fanuc 16/18/21, where the parameter range is between 6050 and 6059 (relative
    to macros 9010 to 9019). Parameter 6053 corresponds to macro O9013 and will contain
    the new G-code number 13. Once the new G-code number is registered, the macro
