    # A Reader for Programmers


    # Advantages of CNC Programmer/Operators


    First, let’s look at the advantages. Involving one person in the larger process
    of making a part provides better understanding of that process. If problems do
    occur, solutions are often easier to find. Programmers who also run the CNC machine
    are more motivated to do a better job using their own program. It is a common
    requirement for part programmers to know how to machine a part, but it is not
    normally required of CNC operators to know all details about how to develop the
    program. Good CNC operators do not always understand the programming part and
    cannot always offer program-related solutions.


    In a combined position, this lack of understanding is eliminated. Programmers
    also frequently interact with engineers and customers; operators usually do not.
    Good programmers also interact with machine operators and seek their ideas. Again,
    the combined position may offer solutions to design or manufacturing process that
    only skilled machine operators could think of.


    # Disadvantages of CNC Programmer/Operators


    There are also disadvantages to this programmer/operator concept. The initial
    appeal of saving money on remuneration may be offset in the loss of production
    time. It is virtually impossible to make a program and at the same time operate
    a machine. To do both equally well takes not only a skilled and dedicated person,
    it also requires a suitable job. If a part has to be changed on the machine every
    two minutes or so, the programmer cannot sufficiently concentrate on the work
    of developing the next program. A part that takes twenty minutes to machine offers
    a little more flexibility.


    Every shop manager knows the term *machine utilization* — that the road to profitable
    business is running CNC machines as much as possible, producing quality parts.
    There are always some delays involved when using CNC machines. First, it is the
    setup time, including the fixture, tooling, and control settings. Next, the first
    part has to be verified. Then when the machine'
  - '[PAGE 49]


    # CNC Tips and Techniques


    does finally start production, there is always the necessity of changing parts,
    replacing dull inserts, modifying offset values, etc. Adding more idle time because
    the programmer has to prepare the program can be very costly; over a period of
    time it can cost more than having two skilled workers taking on individual responsibilities.


    Thus far, this overview has applied to a single CNC machine. What if there are
    two, three, or even more machines in the shop?


    Three other disadvantages of the combined position should also be considered very
    seriously. The first is quite simple. If the programmer stays home sick, so does
    the operator (and vice versa). The second disadvantage is related. What if the
    programmer/operator quits? Of course a suitable backup is an ideal solution, but
    the reality is that there will be a gap in the production somewhere; even if the
    gap is temporary, it still represents time lost. The third disadvantage relates
    more to certain traits in human nature and does not apply to everybody. Some programmers
    who also run the machine may have the tendency to cover up their mistakes, spending
    additional time to make fixes at the machine, even a new program, without anybody''s
    knowledge. Some programmers/operators may feel self-satisfied or even complacent;
    they stop learning new methods and techniques. Others may have exaggerated demands
    in terms of wages, benefits, time off, and so on.


    One item that needs consideration is the method by which the part program is generated.
    It is still common in many shops to write the program manually rather than using
    a CAD/CAM programming system. Although it is important for the programmer to understand
    manual programming, it is equally important for the shop manager to understand
    the benefits of a CAD/CAM (also known as CAM) programming system. For the combined
    position of one person programming and operating, a CAM system installed in the
    vicinity of the CNC machine may bring many benefits, in spite of its initial cost.'
