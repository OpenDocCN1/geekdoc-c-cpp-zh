    ![](img/0023bd5cc50494e6d7799ab76d437c8d_87_0.png)


    ## 精通 M 功能


    *2006 年 2 月，2013 年 2 月更新*


    每个 CNC 程序都有它们。它们出现在程序中的各个位置，具有很大潜力，并且在程序中确实拥有很强的作用。它们被称为 *M 功能*——以字母 M 开头的特殊程序字。对许多程序员来说，它们与经典的
    G 代码（准备命令）具有同等重要性。然而，它们的应用存在差异。尽管许多准备命令在大多数控制系统中基本相同，但 M 功能却并非如此一致。


    ## 定义 M 功能


    M 功能通常被定义为 *机床功能*，或更准确地说，*杂项功能*。它们在程序中的作用有两个方面。一类功能控制程序的某些流程，例如 M00（程序停止）、M01（可选程序停止）、M30（程序结束）以及子程序相关功能
    M98 和 M99。另一类则丰富得多。它包含真正的机床功能；这些功能涉及各种机床特性和附件的操作。其列表可能相当长，具体取决于机床类型和设计。这一类中典型的常见功能包括控制冷却液活动（M08、M09）、主轴旋转（M03、M04、M05）、换刀（M06）以及许多其他与机床相关的标准功能。几乎所有
    CNC 加工中心都需要这些特性，这使得这些功能在各类控制系统之间相当一致。


    同样与机床设计相关的是特定制造商*独有*的 M 功能，即使它们用途相同。例如，一台卧式加工中心的工作台夹紧/松开功能可能与另一台卧式加工中心的工作台夹紧/松开功能不同。根据特殊特性的数量，一些复杂加工中心可能拥有数十甚至数百个可用
    M 功能；有些甚至使用三位数字，而不是常见的两位数字。它们大多数是 ON/OFF 型——激活或未激活状态。对于这些机床，CNC 程序员只有一个资源，那就是制造商的文档。


    ### 编程视角


    从编程角度看，杂项功能使用起来相当灵活。需要重点关注两个方面：一是应单独编程在一个程序段中、不包含其他数据的 M 功能；二是与轴运动一起编程时该功能的行为。有些控制系统要求程序结束功能（M02、M30、M99）单独占一个程序段。即使不适用这样的规则，许多程序员仍遵循这种格式，因为这使程序更易于理解。同样的方法适用于
    M00 和 M01 程序停止功能。至于面向机床而非面向程序的功能，则应当预期会有一些显著差异。一个典型例子是 M06 自动换刀功能。该功能通常与刀具号一起编程，例如
    T05 M06。有些控制系统接受两条命令在同一程序段中一起出现（无论其顺序如何）。另一些则要求刀具命令在一个程序段中，随后在下一个程序段中给出换刀命令。


    ### M 功能的数量


    另一个重要特性是一个程序段中 M 功能的数量。允许一个程序段中出现多个 M 功能的控制系统并不多。另一些系统允许一个程序段中最多有三个此类功能，前提是它们彼此不冲突。最佳策略是每个程序段只编程一个
    M 功能，以防止机床上出现可能的语法错误。这种策略还能使程序更具可移植性。


    ![](img/0023bd5cc50494e6d7799ab76d437c8d_90_0.png)


    ## 刀具长度设置——三种方法


    *2006 年 3 月，2013 年 2 月更新*


    对于立式 CNC 加工中心的典型设置，必须向控制系统提供工件零点的精确位置，该位置从固定的机床零点位置（原点）测量。尽管该过程对于 X 轴和 Y 轴相当简单，但设置
    Z 轴测量值则稍显复杂（除非您的机床支持自动刀具长度设置）。对于 XY 轴，在设置过程中使用简单的寻边器或找角器，并且通常对所有刀具都保持不变。测量得到的尺寸存储为工件坐标系偏置（G54–G59）。为了设置
    Z 轴，必须知道每把刀具的长度，并将其登记为刀具长度偏置。例如，对于单把刀具，也可以使用工件设置中的 Z 轴，并通过 G54 命令调用。由于大多数 CNC
    程序使用不止一把刀具，因此不能采用这种方法，而必须改用刀具长度偏置（G43）。寄存器设置允许分别输入每把刀具的长度，并可在程序中使用地址 H 按其编号调用。例如，G43
    H03 将调用第三号刀具长度偏置。


    在机床上，CNC 操作员可以使用以下三种常用方法之一来设置刀具长度偏置：


    - 预调法

    - 接触法

    - 最长刀具法


    ### 预调法


    这是最古老且仍常用的在机床外预调刀具的方法。它需要外部刀具预调仪，并需要有人为程序中的每把刀具设置刀具长度。刀具设置完成后，将其分配给 CNC 机床并装入刀库。由于尺寸已知，操作员只需将它们输入偏置寄存器；甚至这一操作也可以自动完成，数据存储在内置于刀柄中的特殊芯片上。预调尺寸是实际刀具长度，从刀尖测量到主轴基准线，通常存储为正值。机床的整体
    Z 轴距离也必须已知。


    这种方法的明显优点是实际设置过程中几乎不损失时间。一个不太明显的好处是，在机床外预调刀具为刀具管理提供了更好的环境。主要缺点是其成本，不仅包括初始设备成本，还包括运行成本。尽管任何车间都可以选择使用刀具预调，但它仍然是大公司或大批量加工同一零件的公司的领域。


    ### 接触法


    许多小型机加工车间，乃至更多的零活加工车间，使用这样一种方法：让每把刀具的刀尖接触代表程序中 Z0 的表面。测量得到的尺寸不是实际刀具长度，而是从 Z 轴原点位置测量的、每把刀具刀尖到工件
    Z0 的各自距离。这些设置通常以负值输入，并且不需要其他测量或设置。


    尽管这种设置方法的主要优点在于简单，但主要缺点是它常常在两件工作之间造成较长的间隔，导致非生产时间。在非生产导向的环境中，例如工装模具车间、原型制作等，这种方法可能是合理的。


    ### 最长刀具法


    最后一种可用方法同样使用接触对刀流程，但略有变化。不是为每把刀具设置相对于 Z0 的长度偏置，而是只将一把刀具设置为 Z0。所有其他刀具都将相对于这把基准刀具的刀尖进行设置。从实际角度看，基准刀具应当是最长刀具，主要是为了在设置中增加安全性。

