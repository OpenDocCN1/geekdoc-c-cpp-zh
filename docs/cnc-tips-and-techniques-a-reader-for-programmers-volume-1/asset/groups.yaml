    _September 2006, updated February 2013_


    ![](img/0023bd5cc50494e6d7799ab76d437c8d_108_0.png)


    From all the programming commands and functions, two are closely related to the
    settings at the operation panel of the CNC machine. One is the _Optional Stop_,
    using the M01 miscellaneous function. The other one is the _Block Skip_ function
    (sometimes identified as Block Delete). The _Optional Stop_ is quite straightforward:
    active (ON) or inactive (OFF). The _Block Skip_ function is more complex and requires
    special care in the hands of both CNC programmer and CNC operator.


    # Block Delete


    First, let’s demystify the _Block Delete_ description: no blocks will ever be
    deleted from the program. The term _delete_ is misleading in this case. Blocks
    preceded by a forward slash will only be _skipped (bypassed)_ if the operator
    chooses. In order to activate or deactivate this feature, the programmer must
    include at least one block in the program using the forward slash symbol and the
    operator must turn on or off the _Block Skip_ switch on the machine operation
    panel. One without the other will not work. Because most programs do not require
    any block skip functions, the machine switch should be turned off as a general
    rule.


    # Block Skip


    What is the purpose of the _Block Skip_ function? Why would a block or blocks
    be programmed in the first place and then skipped on demand? There are several
    common uses (and many uncommon ones) for this feature. One of the most common
    applications is to optionally return one or more axes to machine zero, either
    at the beginning or at the end of a program. For example:'
