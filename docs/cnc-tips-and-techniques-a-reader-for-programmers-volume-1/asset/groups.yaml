    ## 数控车床的主轴转速控制


    *2008 年 1 月，2013 年 2 月更新*


    ![](img/0023bd5cc50494e6d7799ab76d437c8d_162_0.png)


    在 CNC 加工中心上编程主轴转速，只需指定每分钟转数和旋转方向即可。例如，主轴正常旋转时 1500 r/min 将输入为 S1500 M03。由于切削刀具直径不变，主轴转速也不变。尽管原理相同，但为
    CNC 车床编程主轴转速时必须考虑若干额外因素。


    首先，对于车削和镗削，旋转的是工件，而不是刀具。因此，在加工过程中工件直径会频繁变化，有时变化相当剧烈。直径每变化一次，就需要相应的主轴转速。其次，一些加工操作发生在主轴中心线上，例如钻孔、铰孔和攻丝。然后，还有单点螺纹车削。


    ### G96 和 G97


    发那科及类似控制器提供两种编程模式：切削速度和主轴转速。切削速度以英尺/分钟或米/分钟编程；主轴转速以转/分钟编程。要选择其中之一，可使用两个 G 代码：G96
    选择切削速度，G97 选择主轴转速。切削速度还有其他几种叫法，例如恒表面速度或圆周速度。英制单位中还使用 SFM 或 SFPM（表面英尺/分钟）等缩写。在两种情况下，G96
    或 G97 指令后都跟 S 地址。这里需要稍加注意以避免出错。例如，在英制单位下，程序段可能是：


    ```

    G96 S400 M03    ... selects 400 feet per minute

    G97 S400 M03    ... selects 400 revolutions per minute

    ```


    一位数字的错误可能造成严重后果。我们什么时候使用一种模式而不是另一种？


    与其列出何时使用 G96，不如记住何时使用 G97 更容易。主轴转速模式 G97 用于所有在机床中心线上进行的操作。前面提到的钻孔 G97 模式也用于任何螺纹加工操作，无论切削直径如何。就是这样。所有其他操作都将使用
    G96，即切削速度模式。切削速度会在任何直径下自动计算实际主轴转速。结果是，随着刀具从一个直径移动到另一个直径，主轴转速不断变化。


    还有几个属于“买方自行当心”类别的问题也应予以说明。一个问题是，例如在钻孔中使用 G96 会发生什么？由于机床中心线处的切削直径为零，常用的主轴转速公式失效。在这种情况下，主轴将以所选齿轮范围内的最高速度旋转，该速度可能极高。一个相关问题是将切削刀具移动到中心线或略低于中心线的端面加工操作。希望使用
    G96 模式，但在切削结束时接近零直径可能会使主轴转速升高过高，甚至带来安全风险。在这种情况下，有一个简单的补救办法。G50 指令可用于限制 G96 模式下的最高主轴转速。编程——例如
    G50 S2500——会随着直径减小而逐渐提高主轴转速，直到控制器达到 2500 r/min。此时，这个预选的主轴转速将被钳制，并一直保持到切削结束。可能会有一些刀具压力增加，这可以通过较慢的切削进给率来最小化。


    ### 切削速度的潜在问题


    在某些机床上，尤其是较旧的机床上，切削速度可能存在一个虽小但可能很重要的问题，而这个问题常被忽视。考虑以下示例，它代表典型车削或镗削操作的前几个程序段：

