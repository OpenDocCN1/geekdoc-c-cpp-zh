    # 基于 SERM 的定义和处理支持数据一致性与完整性验证的规则框架


    Magdalena Krakowiak a, Pawel Ziemba b,*


    > *“a波兰 Paradis大学，Tratralna 23, 64-600 Gorzów Wielkopolski

    ᵇ波兰 什切青大学管理学院，Aleja Papieza Jawa II 22, 70-453 Szczecin


    # 摘要


    SERM（结构化实体关系数据）模型是经典 ER（实体关系）模型的分层扩展。SERM 图的分层结构意味着任何闭环关系都可能导致不性和缺乏数据完整性。这些问题的发生是不确定的，应当进行系统的研究。迫切需要开发一种支持定义控制实体的规则的方法。本文旨在介绍一种支持关系型数据库智能设计的框架。其主要方面包括基于
    SERM 模型的逻辑规则的识别和语义对齐。该方法的一个重要优势是它不仅局限于构建语义数据库，还利用它设计数据库编程对象（如存储过程、函数和触发器），以维护一致性。


