    # 4.1 Identification and analysis of closed relationship circuits


    In the diagram shown in Figure 2, we can distinguish seven closed relationship
    circuits. Table 1 presents in the names and degrees of inheritance hierarchy of
    objects included in the circuit. For each circuit, the potential condition tables
    and the sensitive tables are marked in bold. According to the developed approach,
    only tables that are the extreme right of the circuit, i.e. those belonging to
    the highest level of inheritance hierarchy, can be sensitive. Determination of
    potential condition tables depends on the circuit layout. In the case of extraction
    one leftmost element in the circuit, which in the case of circuits 3, 4 and 5,
    the condition tables can be all independent on it. In the analysed diagram, circuits
    3, 4 and 5 are a special case, where the object that can be a condition table
    is a potentially sensitive table due to the lack of other circuit elements (only
    three tables are included in the circuit). When the connection of objects on the
    left is clearly visible in a closed circuit, this connection is sensitive.


    Potential condition tables and sensitive tables selected in individual circuits
    are the bases for the analysis of the relationships between them in order to define
    possible logical rules. In the presented example, as a result of this analysis,
    only two dependencies were shown. The first one concerns circuit 1 and is related
    to the control of the'
