    ## 3. 规则识别与处理框架


    本文介绍了一个支持逻辑规则识别并通过在 MS SQL Server 中创建对象模板对其进行半自动处理的框架 [11][17]。规则以逻辑 if-else 语句的形式编码。所提出的框架基于透明的分层
