    \ II 22, 70-453 Szczecin, Poland\n\n# Abstract\n\nThe SERM (Structured Entity\
    \ Relationship Data) model is a hierarchical extension of the classic ER (Entity\
    \ Relationship) model. The hierarchical structure of the SERM diagram means that\
    \ any closed relationship can cause inconsistency and lack of data integrity.\
    \ The occurrence of these problems is uncertain and should be systematically investigated.\
