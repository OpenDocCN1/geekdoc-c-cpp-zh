    \  INSERT INTO [sensitive table] SELECT * FROM inserted\nelse\n    RAISERROR ('The\
    \ data do not satisfy the conditions of the rule', 16,10)\nEND\n```\n\n- 控制敏感数据的编辑\n\
    \n```sql\nCREATE TRIGGER [db][Blocking_edition_of_sensitive_data]\nON [db][sensitive\
    \ table]\nINSTEAD OF UPDATE\nAS\nBEGIN\nSET NOCOUNT ON;\nDECLARE @sensitive_data_1\
    \ [data_type]\nDECLARE @sensitive_data_2 [data_type]\nDECLARE @id_sensitive_table\
    \ [data_type]\nif update(@sensitive_data_1) OR update(@sensitive_data_2)\nBEGIN\n\
    SELECT @sensitive_data_1 = sensitive_data_1, @sensitive_data_2 = sensitive_data_2\
    \ FROM inserted\nSELECT @id_sensitive_table = id_sensitive_table FROM deleted\n\
    if dbo.rule_function(@sensitive_data_1 , @sensitive_data_2)=1\n    UPDATE [sensitive\
    \ table] SET sensitive_data_1=@sensitive_data_1, sensitive_data_2=@sensitive_data_2\n\
    \    WHERE id_sensitive_table=@id_sensitive_table\nelse\n    RAISERROR ('The data\
    \ do not satisfy the conditions of the rule', 16,10)\nEND\n```\n\n# 案例研究 – 患者服务系统模型\n\
    \n患者服务系统 (PSS) 涵盖了一个专家中心网络，这些中心提供医疗咨询和简单治疗等医疗服务。患者是客户的员工，即签署了此类服务提供合同的公司。各种专业的医疗人员按照每周入院计划工作，计划上记录了患者的访问情况。在第一次就诊期间，会进行访谈，包括病史、用药和患者过敏史。每次就诊注册都会添加诊所网络提供的服务，其价值等于开具的发票金额，加上就诊期间额外执行的服务。除了访谈数据外，患者卡还载有就诊记录，包括检查结果、处方、转诊单、假条、医生建议以及诊断结果。上述系统的语义模型如图\
    \ SERM 图（图 2）所示，这将是所提框架实现的基础。\n\n## 4.1 闭合关系电路的识别与分析\n\n在图 2 所示图中，我们可以区分出七个闭合关系电路。表\
    \ 1 展示了包含在电路对象的名称和继承层次结构。对于每个电路，潜在的条件表和敏感表用**粗体**标记。根据开发的方法，只有位于电路最右侧的表（即属于继承层次最高层级的表）可能是敏感的。潜在条件表的确定取决于电路的布局。在提取电路中最左侧的元素的情况下（在电路\
    \ 3,4 和 5 的情况下），条件表可能完全独立依赖于该元素。在分析的图中，电路 3、4 和 5 是一个特殊情况，其中可以作为条件表的对象是一个潜在的敏感表，因为缺少其他电路元素（电路中仅包含三个表）。当闭合电路中左侧对象的连接清晰可见时，这种连接是敏感的。\n\
    \n在各个电路中选定的潜在条件表和敏感表是分析它们之间关系的基础，以便定义可能的逻辑规则。在给出的示例中，作为分析结果显示了两个依赖关系。第一个涉及电路 1，与控制医疗人员的权利有关。患者为他有权享受的特定服务向某员工预约。第二个依赖情况在电路\
    \ 4 中检测到，确保了对额外服务的控制。提供的额外服务不能与已预约的就诊相同。\n\n表 1. 患者服务系统 SERM 图中的闭合关系电路（自绘）。\n\n\
    | 电路编号 | I | II | III | IV | V | VII |\n| :--- | :--- | :--- | :--- | :--- | :---\
    \ | :--- |\n| 1 | service | medical worker | worker's service | appointment schedule\
    \ | appointment | |\n| 2 | | medication | patient | appointment | prescription\
    \ | prescribed medication |\n| 3 | city | customer | patient | | | |\n| 4 | service\
    \ | | | | service provided | |\n| 5 | | | | patient | appointment | referral |\n\
    | 6 | illness | | | pass illness | appointment | diagnosis |\n| 7 | | clinic |\
    \ surgery patient | appointment schedule | appointment | |\n\n## 4.2 分析得出的规则函数\n\
    \n基于所提框架（图 1），为了定义规则函数，必须确定某些条件和敏感数据。根据在电路 1 中检测到的依赖关系，条件数据必须是员工标识符 (`id_worker`)\
    \ 以及来自员工服务表的其有权享受的服务标识符 (`id_service`)。这些数据构成了 if-else 规则体。另一方面，敏感数据是预约表中的员工计划标识符\
    \ (`id_schedule`) 和其有权享受的服务标识符 (`id_service`)。这些数据是支持防止未经授权访问规则函数的参数。在这种情况下，该函数旨在保护患者免受向未经授权的员工预约服务。\n\
    \n"
