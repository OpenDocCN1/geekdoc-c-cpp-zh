    \ Sensitive data, on the other hand, is the employee's schedule identifier (id_schedule)\
    \ and the identifier of the service to which it is entitled (id_service) from\
    \ the appointment table. These data are the parameters of the function that supports\
    \ the rule to protect against unwanted access. In this case, the function is to\
    \ protect the patient against registration for the service to an unauthorized\
    \ employee. It returns 0 if the id_worker (derived from the id_schedule parameter)\
    \ and id_service (direct appointment data) pair does not match the condition data.\
    \ The code for the Transact-SQL permission control function is as follows:\n\n\
    ```\nCREATE FUNCTION control_of_rights (\n  @id_service smallint,\n  @id_schedule\
    \ smallint\n)\n\nRETURNS bit\nAS\nBEGIN\n  DECLARE @met bit\n  SELECT @id_worker\
    \ = id_worker FROM [appointment schedule]\n  WHERE id = @id_schedule\n  IF EXISTS\
    \ (SELECT * FROM [worker's service] WHERE id_worker=@id_worker AND id_service=@id_service)\n\
    \    SET @met=1\n  ELSE\n    SET @met=0\n  RETURN @met\nEND\n```"
