  md: "# Magdalena Krakiak et al. / Procedia Computer Science 207 (2022) 4227–4236\n\
    \ninheritance, is interpreted directly (from left to right), therefore the objects\
    \ taking part in it belong to different neighbouring degrees of inheritance [8][14][15].\
    \ It follows from the rules in the diagram:\n\n+   - the parent object is located\
    \ on the left of the child object (in the first column to the left of the child's\
    \ column)\n- there are no vertical connections (within the same degree of inheritance)\n\
    - there are no direct connections between entities, because the E object can only\
    \ be a parent and is only on the first level of the inheritance hierarchy (leftmost\
    \ column of the diagram)\n- there are no direct connections between the relations,\
    \ because the R object appears as a child of the E or ER object\n- an ER can be\
    \ associated with any type of object and as a child of an E ER object, also as\
    \ a parent of an ER or object\n- an ER object and an R object can take a position\
    \ according to the inheritance hierarchy in any column except the first (reserved\
    \ for E objects according to the directional key inheritance hierarchy).\n\n#\
    \ ## 3. Framework for rules identification and processing\n\n# ### 3.1 Framework\
    \ flowchart\n\nThe hierarchical arrangement of the SERM diagram allows the conclusion\
    \ that any closed relationship circuits may threaten the integrity and consistency\
    \ of the data entered. This assumption was the basis for the development of the\
    \ original framework [10] supporting the definition and handling of rules that\
    \ would take control over it. The algorithm of operation is shown in Figure 1.\n\
    \nThe first step is to identify specific circuits. For each case, the rightmost\
    \ table (or tables) should be marked. Its data potentially threaten the integrity\
    \ of the database or be redundant [5]. In the framework, they are called sensitive\
    \ tables, unlike condition, which depend on the leftmost object or a combination\
    \ of objects. The next step is to find for relationships between data selected\
    \ tables. (The approach assumes that the analysed SERM model is correct, but it\
    \ is worth noting that at this stage errors by modelling indirect relations can\
    \ be detected.) When relationships between data are discovered, it is imperative\
    \ to analyse them in order to determine their conditions [13]. As a result, we\
    \ will obtain data constituting the body of the rule (condition data for which\
    \ the condition must be met (sensitive data)). Their identification is necessary\
    \ to generate the rule function.\n\nThe rule defined in the framework represents\
    \ the condition of data consistency in the form of logical sentence. It can have\
    \ a simple or complex form constructed with a conjunction or disjunction with\
    \ the option of negation. According to the theory of classical propositional calculus\
    \ [16], it can be assigned one of two values: true or false. The following is\
    \ an example of the rule for:\n\n```\nif (table.name_attribute.name = value AND\
    \ table.name_attribute_name2 = value)\nelse\n  SET met = 0\n```\n\nOf course,\
    \ depending on the complexity of the rule, other operators may occur in a single\
    \ condition, and aggregate functions may operate on attributes.\n\nWhen analysing\
    \ the SERM diagram, one should determine the table and data of the condition that\
    \ occur in the body of the rule. Their fulfilment is required by the data specified\
    \ in the rule or their combinations, which correspond to sensitive data. This\
    \ is due to the directional interpretation of the relationship in the diagram\
    \ – the dependent object (child) is on the right side of the parent object. Thus,\
    \ the data of tables linked to the leftmost circuit object has a significant impact\
    \ on the values of the rightmost element."
