  md: "# Magdalena Krakowik et al. / Procedia Computer Science 307 (2022) 427-4236\n\
    \nThe function is used in releases operating tables selected on the analysed circuit.\
    \ For a sensitive table, instructions for adding and modifying sensitive data\
    \ are blocked before checking that the rule are met. Only when the appropriate\
    \ rule returns the value 1 (TRUE), the above operations of adding new records\
    \ and changing existing ones are allowed for execution. In the case of sensitive\
    \ data, the state can be deleted after the operation and modification of the given\
    \ condition are performed, if any operations are possible. Note that these tables\
    \ are from the first steps of the inheritance hierarchy (left side of the diagram)\
    \ and are cleared by default restrictions [11][12][17] when dependent objects\
    \ exist. Such control would then consist of defining a function value for the\
    \ sensitive table. When the function returns the value 0 (FALSE), it means that\
    \ the previously entered data now threatens the consistency of the database, because\
    \ it no longer meets the condition of the rule. The record should then be deleted,\
    \ but this is not possible due to other condition relations. For this reason,\
    \ triggers on condition tables are optionally generated, but in most cases their\
    \ use is unfounded.\n\nUnlike condition table triggers, triggers on sensitive\
    \ tables are mandatory programming objects. The templates of these procedures\
    \ developed in the framework were written in the Transact-SQL language [11][17]\
    \ and include the rule function.\n\nTwo patterns of auto-generated triggers are\
    \ shown below:\n\n+   - controlling the editing of records to sensitive data\n\
    \n```\nCREATE TRIGGER [db].[Blocking_addition_of_sensitive_data]\nON [db][sensitive\
    \ table]\nINSTEAD OF INSERT\nAS\nBEGIN\nSET NOCOUNT ON;\nDECLARE @sensitive_data_1\
    \ [data_type]\nDECLARE @sensitive_data_2 [data_type]\nSELECT @sensitive_data_1\
    \ = ., @sensitive_data_2 = FROM inserted\nif dbo.rule_function(@sensitive_data_1\
    \ , @sensitive_data_2)=1\n    INSERT INTO [sensitive table] SELECT * FROM inserted\n\
    else\n    RAISERROR ('The data do not satisfy the conditions of the rule', 16.10)\n\
    ```\n\n+   - controlling the editing of sensitive data\n\n```\nCREATE TRIGGER\
    \ [db][Blocking_edition_of_sensitive_data]\nON [db][sensitive table]\nINSTEAD\
    \ OF UPDATE\nAS\nBEGIN\nSET NOCOUNT ON;\nDECLARE @sensitive_data_1 [data_type]\n\
    DECLARE @sensitive_data_2 [data_type]\nDECLARE @id_sensitive_table [data_type]\n\
    if update(@sensitive_data_1) OR update(@sensitive_data_2)\nBEGIN\nSELECT @sensitive_data_1\
    \ = ., @sensitive_data_2 = . FROM inserted\nSELECT @id_sensitive_table = . FROM\
    \ deleted\nif dbo.rule_function(@sensitive_data_1 , @sensitive_data_2)=1\n   \
    \ UPDATE [sensitive table] SET sensitive_data_1=@sensitive_data_1, sensitive_data_2=@sensitive_data_2\n\
    \    WHERE id_sensitive_table=@id_sensitive_table\nelse\n    RAISERROR ('The data\
    \ do not satisfy the conditions of the rule', 16.10)\nEND\n```"
