    \n## 3.2 编程对象模板\n\n对于每个定义的规则，二值函数应返回逻辑语句（规则的头部）的值，即确认满足或未满足条件。由于 Transact-SQL\
    \ 中没有逻辑数据类型 [11][17]，该模板使用了位（bit）类型。以下是基于 SERM 图的关系系统所开发出的规则模式形式：\n\n```sql\n\
    CREATE FUNCTION rule, rule_function(\n  @sensitive_data_1 [data_type],\n  @sensitive_data_2\
    \ [data_type]\n)\nRETURNS bit\nAS\nDECLARE @met bit\nif (condition)\n  SET @met=1\n\
    else\n  SET @met=0\nRETURN @met\n```\n\n图 1. 基于 SERM 模型的识别和处理逻辑规则的框架。\n\n该函数用于在分析电路上选定的发布操作表中。对于敏感表，在检查是否满足规则之前，会阻止添加和修改敏感数据的指令。只有当相应的规则返回值\
    \ 1（TRUE）时，才允许执行上述添加新记录和更改现有记录的操作。对于敏感数据，如果有任何操作，在执行给定条件的操作和修改后可以删除状态。请注意，这些表来自继承层次的第一步（图的左侧），当存在依赖对象时，会通过默认限制\
    \ [11][12][17] 清除。这种控制通过为敏感表定义函数值来实现。当函数返回值 0（FALSE）时，意味着之前输入的数据现在威胁到数据库一致性，因为它们不再符合规则条件。此时应该删除该记录，但由于其他条件关系这是不可行的。因此，可以选择性生成条件表的触发器，但在大多数情况下使用它们并没有根据。\n\
    \n与条件表触发器不同，敏感表触发器是强制性的编程对象。在该框架开发的这些过程模板使用 Transact-SQL 语言 [11][17] 编写，并包含规则函数。\n\
    \n下面展示了两种自动生成的触发器模式：\n\n- 控制敏感数据的记录编辑\n\n```sql\nCREATE TRIGGER [db].[Blocking_addition_of_sensitive_data]\n\
    ON [db][sensitive table]\nINSTEAD OF INSERT\nAS\nBEGIN\nSET NOCOUNT ON;\nDECLARE\
    \ @sensitive_data_1 [data_type]\nDECLARE @sensitive_data_2 [data_type]\nSELECT\
