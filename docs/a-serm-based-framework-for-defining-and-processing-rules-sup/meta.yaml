    \ for a specific medical service to which he or she be entitled. The second case\
    \ of dependency was detected in circuit 4 and ensures the control of additional\
    \ services. The additional service provided cannot be the same for the visit which\
    \ was booked.\n\nTable 1. Closed relationship circuits in the SERM diagram of\
