    #  5. Summary


    The framework presented in the article is a proprietary solution aimed at supporting
    the widely understood intelligent design of relational databases. The solution
    described does not support the designer at the stage of user requirements analysis
    or in creating the conceptual design. This is due to the input data of the framework
    which is based on the semantic SERM data model. The main aspect of the help focuses
    on identifying logical rules based on the layout of relationship. In addition,
    an important task is to take over their functional support (rule functions and
    triggers), which has long been the scope of utility applications. Centralizing
    business logic on the database server significantly enhances the efficiency of
    database systems and increases security. Furthermore, designing database object
    groups should be treated as very important stage of database design. In view of
    the above, the scope of the approach will be extended to include support for the
    implementation and support on the server of rules resulting from user requirements.


