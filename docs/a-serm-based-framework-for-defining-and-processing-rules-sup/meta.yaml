    关键词：SERM 语义数据模型；逻辑规则；数据库编程对象；规则函数


    # 1. 引言


    关系数据库随 20 世纪代关系模型的出现而诞生。随后的技术发展促进了新数据模型的引入 [2][4][6]，但与趋势对应的模型已成功应用于许多现代商业系统中。应用的高数量和多样性证实了关系数据库的实用性
    [9]，领先的 IT 制造商以关系数据库管理系统的形式支持并开发其产品。首先应该提到 Oracle（Oracle 数据库的创建者）[12] 或 Microsoft（SQLServer
    的创建者）[11][17]。


    * 通讯作者。电话：+48-91-444-1942。

    邮箱：pawel.ziemba@usz.edu.pl


    1877-0029 © 作者。由 Elsevier B.V. 出版

    这是一篇基于 CC BY-NC-ND 许可的开放文章（https://creativecommons.org/licenses/by-nc-nd/4.0）。同行评审由第
    26 届知识型智能信息与工程系统国际会议 (KES 2022) 科学委员会负责

    10.1016/j.procs.2022.09.086


    关系模型的广泛使用导致特定的现实可以在实体以及它们之间的关系中非常自然地表示 [6]。语义数据模型以 ER（实体关系图）的形式呈现了建模的片段 [1][2][3]。自
    1989 年以来，它是概念设计的唯一实现方式。然而，数据库完整性和复杂性的增加显示了其局限性，从而促成了 SERM（结构化实体）模型形式的 ER（实体关系）模型的开发
    [14]。应特别关注其图的结构，该结构基于继承层次结构和确定关系复杂度的方法——记法 (min, max)。SERM 模型的上述属性使设计人员和数据库分析师能够执行语义验证和数据分析
    [15][19]。关系数据库的最佳结构不能完全保护其不受数据不一致性的影响 [21]。对于数据之间存在强依赖关系的模型尤其如此。因此，识别所有对数据完整性的威胁并反它们非常重要。逻辑规则在这里起着重要作用，因为它们定义了数据输入并存储在数据库后的一致条件。处理这些规则对于实现完整性至关重要。这涉及数据库中映射关系数据的语义一致性方面。


    本文介绍了一个支持逻辑规则识别并通过在 MS SQL Server 中创建对象模板对其进行半自动处理的框架 [11][17]。规则以逻辑 if-else 语句的形式编码。所提出的框架基于透明的分层
    SERM 系统图，但并未将数据库设计局限于创建其关系结构。Transact-SQL 半自动函数和触发器的引入使得该解决方案变成了一种支持数据库数据一致性和完整性验证的某种智能系统。这很重要，因为数据一致性和完整性问题是不确定的——它们可能发生也可能不发生。所提的方法允许检测
    SERM 模型中的潜在敏感数据和关系环。该框架通过识别不一致性支持与数据库相关的决策。本文分为五部分。第 2 部分介绍了背景以及 SERM 与 ER 模型之间的差异。第
    3 部分介绍了框架。第 4 部分是其实用示例。文章以结论和后续工作结束。


    ## 2. SERM 与 ER 模型的比较


    SERM 模型是 ER 模型的扩展 [8]。与经典 ER 模型不同，SERM 模型通过其层次性质允许更复杂的结构。SERM 图的分层结构意味着任何闭环关系都可能导致不性和缺乏数据完整性。这些问题的发生是不确定的，应当进行系统的研究。迫切需要开发一种支持定义控制实体的规则的方法。本文旨在介绍一种支持关系型数据库智能设计的框架。其主要方面包括基于
    SERM 模型的逻辑规则的识别和语义对齐。该方法的一个重要优势是它不仅局限于构建语义数据库，还利用它设计数据库编程对象（如存储过程、函数和触发器），以维护一致性。


    语义数据模型以 ER（实体关系图）的形式呈现了建模的片段 [1][2][3]。自 1989 年以来，它是概念设计的唯一实现方式。然而，数据库完整性和复杂性的增加显示了其局限性，从而促成了
    SERM（结构化实体）模型形式的 ER（实体关系）模型的开发 [14]。应特别关注其图的结构，该结构基于继承层次结构和确定关系复杂度的方法——记法 (min,
    max)。SERM 模型的上述属性使设计人员和数据库分析师能够执行语义验证和数据分析 [15][19]。关系数据库的最佳结构不能完全保护其不受数据不一致性的影响
    [21]。对于数据之间存在强依赖关系的模型尤其如此。因此，识别所有对数据完整性的威胁并反它们非常重要。逻辑规则在这里起着重要作用，因为它们定义了数据输入并存储在数据库后的一致条件。处理这些规则对于实现完整性至关重要。这涉及数据库中映射关系数据的语义一致性。


    关系模型的广泛使用导致特定的现实可以在实体以及它们之间的关系中非常自然地表示 [6]。语义数据模型以 ER（实体关系图）的形式呈现了建模的片段 [1][2][3]。自
    1989 年以来，它是概念设计的唯一实现方式。然而，数据库完整性和复杂性的增加显示了其局限性，从而促成了 SERM（结构化实体）模型形式的 ER（实体关系）模型的开发
    [14]。应特别关注其图的结构，该结构基于继承层次结构和确定关系复杂度的方法——记法 (min, max)。SERM 模型的上述属性使设计人员和数据库分析师能够执行语义验证和数据分析
