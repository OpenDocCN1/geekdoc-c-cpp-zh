    rule functions


    # 1. Introduction


    Relational databases were created in the 1970s with the emergence of the relational
    model. Later technological development contributed to the introduction of new
    data models [2][4][6], but the one corresponding to the trends is successfully
    used in many modern commercial systems. The high number and variety of applications
    confirm the usefulness of relational databases [9], and the leading IT manufacturers
    of support and develop their products in the form of relational database management
    systems. First of all, such giants should be mentioned as Oracle (creator of Oracle
    Database) [12] or Microsoft (creator of the SQLServer) [11][17].


