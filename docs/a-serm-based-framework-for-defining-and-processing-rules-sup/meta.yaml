  md: "Magdalena Krakowiak et al. / Procedia Computer Science 207 (2022) 4227–4236\n\
    \n![](img/87125e6b6a6b0a342ed962217596f951_3_0.png)\n\n# 3.2 Programming object\
    \ templates\n\nFor each defined rule, a binary function should return the value\
    \ of the logical sentence (head of the rule), i.e. confirmation or failure to\
    \ meet the condition. Since the logical data type is not available in Transact-SQL\
    \ [11][17], the template uses the bit type. Below is the form of the developed\
    \ patterns of the rule resulting from the relationship system based on the SERM\
    \ diagram:\n\n```\nCREATE FUNCTION rule, rule_function(\n  @sensitive_data_1 [data_type],\n\
    \  @sensitive_data_2 [data_type]\n)\nRETURNS bit\nAS\nDECLARE @met bit\nif (condition)\n\
    \  SET @met=1\nelse\n  SET @met=0\nRETURN @met\n```\n\nFig. 1. Framework for identifying\
    \ and handling logical rules based on the SERM model."
