  md: 'products in the form of relational database management systems. First of all,
    such giants should be mentioned as Oracle (creator of Oracle Database) [12] or
    Microsoft (creator of the SQLServer) [11][17].


    The widespread use of the relational model results in the fact that a specific
    reality is represented quite naturally in the entities and the relations between
    them [6]. The semantic data model presents a fragment of the modelled in the form
    of ER (Entity Relationship Diagram) [1][2][3]. Since 1989, it was the only implementation
    of the conceptual design. However, the increase in the integrity and complexity
    of databases showed its limitations, which resulted in the development of an ER
    (Entity Relationship) model in the form of the SERM (Structured Entity Relationship)
    model [14]. Particular attention should be paid to the structure of its diagram,
    based on the degrees of the inheritance hierarchy and the method of determining
    the complexity of the relation - the notation (min, max). The above properties
    of the SERM model enable the designer and database analyst to perform semantic
    verification, and analysis of the data [15][19]. An optimally structure of a relational
    database does not completely protect it against data inconsistency [21]. This
    is especially true for models with strong dependencies between data. Therefore,
    it is very important to identify all threats to data integrity and counteract
    them. Logic rules play an important role here, as they define the conditions of
    consistency after data entered and stored in the database. The handling of these
    rules is essential in the implementation of integrity. This concerns the aspect
    of semantic consistency of the data in the database with mapped relation.


    The article presents the framework supporting the identification of logic rules
    and semi-automatic handling of them by creating templates of objects in the MS
    SQL server. [11][17]. The rules are encoded in the form of a logical if-else sentence.
    The proposed framework is based on a transparent, hierarchical SERM system diagram,
    but does not limit the design of the database to the creation of its relational
    structure. The introduction of Transact-SQL semi-automatic functions and triggers
    makes the problem solution kind of intelligent system supporting the verification
    of consistency and integrity of data in the database. This is important to the
    fact that problems with data consistency and integrity are uncertain - they may
    or may not occur. The proposed approach allows the detection of potentially sensitive
    data and relationship circuits of the SERM model. The framework supports decisions
    related to database management by identifying inconsistencies and problems related
    to structures. The framework was presented on the example of a semantic model
    for the Patient Service System linked to the network of private clinics. The paper
    is divided into five sections. Section 2 presents the background information and
    differences between the SERM and ER models. Section 3 presents the framework and
    the templates of the projecting objects. Section 4 is an example of the practical
    application of the developed framework in a semantic model of a patient service
    system. The article ends with conclusions and an indication of further directions
    of work.


    # 2. Comparison of SERM and ER models


    The SERM model is an enhancement (extension) of the semantic data model ER [8][14][15].
    It was first presented in 1989 by prof. Elmar J. Mainz from University of Bamberg.
    Like any new model or version, SERM was created to remove the limitations and
    shortcomings of its predecessor. The complexity of the objects mapped to the real
    world increases, the ER model becomes less and readable. This significantly helps
    its analysis and possible development. The disadvantages of the ER model also
    include the multitude of variants with different graphic symbols [6][9]. The variety
    of standards that means data created in various tools are not readable for everyone
    [18]. The original form of presentation, still used, is the notation, the distinguishing
    features of which are the relations presented in the form of diamonds, and the
    attributes of the relations in the oval form. Apart from it, the most frequently
    used and supported by the largest number of tools is the Crow''s foot convention,
    where relations are presented in the form of lines with different endings multiplicity
    [11][6]. The structure of the diagram representing the SERM model is strictly
    defined, and all types of objects and cases of relationship complexity have one
    graphic standard [14][15]. This makes diagrams created in various tools understandable
    to any designer of the SERM semantic data model.


    Unlike the ER model, where the diagram layout is arbitrary, an object in a SERM
    has a strictly defined place in one of the columns that show the degrees of the
    inheritance hierarchy. Each relation, i. key'
