    \n第二个独立依赖关系与额外服务的注册以及保护患者免受已注册服务的重复付费有关。条件是预约表中的服务标识符 (`id_service`)，敏感数据是访问标识符\
    \ (`id_appointment`) 和由服务表提供的额外服务标识符 (`id_service`)。控制额外服务的规则函数在 `id_service`\
    \ 参数的值等于对应于 `id_appointment` 的给定条件（对应于 `id_appointment` 参数）时，返回 0。额外服务控制函数采用以下结构（对应一种模式）：\n\
    \n```\nCREATE FUNCTION control_of_additional_services\n@id_service smallint,\n\
    @id_appointment smallint\nRETURNS bit\nAS\nBEGIN\nDECLARE @met bit\nif not exists\
    \ (SELECT * FROM appointment WHERE id_appointment=@id_appointment AND id_service=@id_service)\n\
    \    SET @met=1\nelse\n    SET @met=0\nRETURN @met\nEND\n```\n\n## 4.3 使用规则函数的触发器\n\
    \n规则函数主要定义用于确保输入数据一致性的触发器。因此，它们基于敏感表并控制 `Insert` 和 `Update` 语句。每个电路规则中包含的依赖由一个函数处理。对于每个函数，都根据\
    \ 3.2 节中提出的开发的模板生成两个存储过程。下面的触发器仅在规则函数返回值 1 时允许添加新记录。\n\n```\nCREATE TRIGGER [dbo][Control_add_visit]\n\
    ON [dbm][appointment]\nINSTEAD OF INSERT\nAS\nBEGIN\nSET NOCOUNT ON;\nDECLARE\
    \ @id_service smallint\nDECLARE @id_schedule smallint\nSELECT @id_schedule=id_schedule,@id_service=id_service\
    \ FROM inserted\nif dbo.control_of_rights(@id_schedule,@id_service)\n    INSERT\
    \ INTO inserted Select * FROM inserted\nelse\n    RAISERROR ('The worker has no\
    \ right to perform this service!', 16,10)\nEND\n```\n\n```\nCREATE TRIGGER [dbo][Control_add_service]\n\
    ON [dbm][service provided]\nINSTEAD OF INSERT\nAS\nBEGIN\nSET NOCOUNT ON;\nDECLARE\
    \ @id_appointment smallint\nDECLARE @id_service smallint\nSELECT @id_appointment=id_appointment,@id_service=id_service\
    \ FROM inserted\nif dbo.control_of_additional_services(@id_service,@id_appointment)=1\n\
    \    INSERT INTO [service provided] Select * FROM inserted\nelse\n    RAISERROR\
    \ ('This is recorded service for this visit!', 16,10)\nEND\n```\n\nMagdal Krakowska\
    \ et al. / Procedia Computer Science 207 (2022) 4227–4236\n\n第二类触发器是那些仅在规则函数返回值时允许更改敏感数据的触发器。每个电路的两个存储过程使用\
    \ `[dbo]`：\n\n```\nCREATE TRIGGER [dbo][Control_edit_visit]\n [dbo][appointment]\n\
    INSTEAD OF UPDATE\nAS\nBEGIN\n    SET NOCOUNT ON;\n    DECLARE @id_service smallint\n\
    \    DECLARE @id smallint\n    IF update(appointment) OR update(service)\n   \
    \ BEGIN\n        SELECT @id_schedule schedule, @id_service service FROM inserted\n\
    \        SELECT @id_appointment appointment, @id service FROM deleted\n      \
    \  IF (dbo.check_of_right(@id_service, @id)=1)\n            UPDATE schedule SET\
    \ schedule=@id_schedule, service=@id_service\n            WHERE @id_appointment\
    \ = @id_appointment                ELSE\n            RAISERROR ('The worker has\
    \ no right to perform this service!', 16, 10)\n    END\nEND\n```\n\n```\nCREATE\
    \ TRIGGER [dbo][Control_edit_service]\n [dbo][service]\nINSTEAD OF UPDATE\nAS\n\
    BEGIN\n    SET NOCOUNT ON;\n    DECLARE @id_service smallint\n    DECLARE @id\
    \ smallint\n    DECLARE @id_service smallint\n    DECLARE @id_old smallint\n \
    \   IF update(appointment) OR update(service)\n    BEGIN\n        SELECT @id_appointment\
    \ appointment, @id_service service FROM inserted\n        SELECT @id_appointment\
    \ appointment, @id_service service FROM deleted\n        IF (dbo.check_of_additional(@id_service,\
    \ @id)=1)\n            UPDATE appointment SET appointment=@id_appointment, id=@id_id,\
    \ service=@id_service\n            WHERE @id_appointment=@id_appointment AND @id_old=@id_old\n\
    \        ELSE\n            RAISERROR ('This service is reserved for this service!',\
    \ 16, 10)\n    END\nEND\n```\n\n表触发器是一组生成的存储过程。这用于控制在删除记录或更改条件数据后的数据一致性。由于编辑（尤其是删除）数据，这是框架的一个可选阶段。这是为了分析用户需求并强制执行外键的值（NOT\
    \ NULL）。在最左侧元素唯一的闭合电路的情况下，条件表充当特定角色，并且通常受到取消限制。在给出的示例中，分析的两个电路中有一个系统，其分析证实了这一点。在电路\
    \ 4 中，条件表是预约表。一旦安排了预约并记录了额外服务，它就不能被删除，因此在更改后没有需要进行状态检查。在这种情况下，如果已注册服务的标识符发生变化，这在注册额外服务之前是可能的。因此，它是允许。\n\
