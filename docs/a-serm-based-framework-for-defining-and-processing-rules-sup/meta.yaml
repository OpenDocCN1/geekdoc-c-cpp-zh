    # SERM based framework for defining and processing rules supporting the verification
    of data consistency and integrity


    Magdalena Krakowiak a, Pawel Ziemba b,*


    > *“The Jacob of Paradis University, Tratralna 23, 64-600 Gorzów Wielkopolski,
    Poland

    ᵇInstitute of Management, University of Szczecin, Aleja Papieza Jawa II 22, 70-453
    Szczecin, Poland


    # Abstract


    The SERM (Structured Entity Relationship Data) model is a hierarchical extension
    of the classic ER (Entity Relationship) model. The hierarchical structure of the
    SERM diagram means that any closed relationship can cause inconsistency and lack
    of data integrity. The occurrence of these problems is uncertain and should be
    systematically investigated. there is a clear need to develop an approach supporting
    the definition of rules that could control entities. The aim of the article is
    to present the framework supporting the intelligent design of relational databases.
    Its main aspects include identification and semantic-alignment of logic rules
    based on the SERM model. An important advantage of the approach is that it does
    not limit itself to building a semantic database, but also uses it to design database
    programming objects such as procedures, functions and triggers that guard the
    consistency.


