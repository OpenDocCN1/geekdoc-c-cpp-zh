    \ 4227–4236\n\ninheritance, is interpreted directly (from left to right), therefore\
    \ the objects taking part in it belong to different neighbouring degrees of inheritance\
    \ [8][14][15]. It follows from the rules in the diagram:\n\n+   - the parent object\
    \ is located on the left of the child object (in the first column to the left\
    \ of the child's column)\n- there are no vertical connections (within the same\
    \ degree of inheritance)\n- there are no direct connections between entities,\
    \ because the E object can only be a parent and is only on the first level of\
    \ the inheritance hierarchy (leftmost column of the diagram)\n- there are no direct\
    \ connections between the relations, because the R object appears as a child of\
    \ the E or ER object\n- an ER can be associated with any type of object and as\
    \ a child of an E ER object, also as a parent of an ER or object\n- an ER object\
    \ and an R object can take a position according to the inheritance hierarchy in\
    \ any column except the first (reserved for E objects according to the directional\
    \ key inheritance hierarchy).\n\n# ## 3. Framework for rules identification and\
    \ processing\n\n# ### 3.1 Framework flowchart\n\nThe hierarchical arrangement\
    \ of the SERM diagram allows the conclusion that any closed relationship circuits\
    \ may threaten the integrity and consistency of the data entered. This assumption\
    \ was the basis for the development of the original framework [10] supporting\
    \ the definition and handling of rules that would take control over it. The algorithm\
    \ of operation is shown in Figure 1.\n\nThe first step is to identify specific\
    \ circuits. For each case, the rightmost table (or tables) should be marked. Its\
    \ data potentially threaten the integrity of the database or be redundant [5].\
    \ In the framework, they are called sensitive tables, unlike condition, which\
    \ depend on the leftmost object or a combination of objects. The next step is\
    \ to find for relationships between data selected tables. (The approach assumes\
    \ that the analysed SERM model is correct, but it is worth noting that at this\
    \ stage errors by modelling indirect relations can be detected.) When relationships\
    \ between data are discovered, it is imperative to analyse them in order to determine\
    \ their conditions [13]. As a result, we will obtain data constituting the body\
    \ of the rule (condition data for which the condition must be met (sensitive data)).\
    \ Their identification is necessary to generate the rule function.\n\nThe rule\
    \ defined in the framework represents the condition of data consistency in the\
    \ form of logical sentence. It can have a simple or complex form constructed with\
    \ a conjunction or disjunction with the option of negation. According to the theory\
    \ of classical propositional calculus [16], it can be assigned one of two values:\
    \ true or false. The following is an example of the rule for:\n\n```\nif (table.name_attribute.name\
    \ = value AND table.name_attribute_name2 = value)\nelse\n  SET met = 0\n```\n\n\
    Of course, depending on the complexity of the rule, other operators may occur\
    \ in a single condition, and aggregate functions may operate on attributes.\n\n\
    When analysing the SERM diagram, one should determine the table and data of the\
    \ condition that occur in the body of the rule. Their fulfilment is required by\
    \ the data specified in the rule or their combinations, which correspond to sensitive\
    \ data. This is due to the directional interpretation of the relationship in the\
    \ diagram – the dependent object (child) is on the right side of the parent object.\
    \ Thus, the data of tables linked to the leftmost circuit object has a significant\
    \ impact on the values of the rightmost element."
- md: "\nMagdalena Krakowiak et al. / Procedia Computer Science 207 (2022) 4227–4236\n\
    \n## 3.2 Programming object templates\n\nFor each defined rule, a binary function\
    \ should return the value of the logical sentence (head of the rule), i.e. confirmation\
    \ or failure to meet the condition. Since the logical data type is not available\
    \ in Transact-SQL [11][17], the template uses the bit type. Below is the form\
    \ of the developed patterns of the rule resulting from the relationship system\
    \ based on the SERM diagram:\n\n```sql\nCREATE FUNCTION rule, rule_function(\n\
    \  @sensitive_data_1 [data_type],\n  @sensitive_data_2 [data_type]\n)\nRETURNS\
    \ bit\nAS\nDECLARE @met bit\nif (condition)\n  SET @met=1\nelse\n  SET @met=0\n\
    RETURN @met\n```\n\nFig. 1. Framework for identifying and handling logical rules\
    \ based on the SERM model.\n\nThe function is used in releases operating tables\
    \ selected on the analysed circuit. For a sensitive table, instructions for adding\
    \ and modifying sensitive data are blocked before checking that the rule are met.\
    \ Only when the appropriate rule returns the value 1 (TRUE), the above operations\
    \ of adding new records and changing existing ones are allowed for execution.\
    \ In the case of sensitive data, the state can be deleted after the operation\
    \ and modification of the given condition are performed, if any operations are\
    \ possible. Note that these tables are from the first steps of the inheritance\
    \ hierarchy (left side of the diagram) and are cleared by default restrictions\
    \ [11][12][17] when dependent objects exist. Such control would then consist of\
    \ defining a function value for the sensitive table. When the function returns\
    \ the value 0 (FALSE), it means that the previously entered data now threatens\
    \ the consistency of the database, because it no longer meets the condition of\
    \ the rule. The record should then be deleted, but this is not possible due to\
    \ other condition relations. For this reason, triggers on condition tables are\
    \ optionally generated, but in most cases their use is unfounded.\n\nUnlike condition\
    \ table triggers, triggers on sensitive tables are mandatory programming objects.\
    \ The templates of these procedures developed in the framework were written in\
    \ the Transact-SQL language [11][17] and include the rule function.\n\nTwo patterns\
    \ of auto-generated triggers are shown below:\n\n- controlling the editing of\
    \ records to sensitive data\n\n```sql\nCREATE TRIGGER [db].[Blocking_addition_of_sensitive_data]\n\
    ON [db][sensitive table]\nINSTEAD OF INSERT\nAS\nBEGIN\nSET NOCOUNT ON;\nDECLARE\
    \ @sensitive_data_1 [data_type]\nDECLARE @sensitive_data_2 [data_type]\nSELECT\
    \ @sensitive_data_1 = sensitive_data_1, @sensitive_data_2 = sensitive_data_2 FROM\
    \ inserted\nif dbo.rule_function(@sensitive_data_1 , @sensitive_data_2)=1\n  \
    \  INSERT INTO [sensitive table] SELECT * FROM inserted\nelse\n    RAISERROR ('The\
    \ data do not satisfy the conditions of the rule', 16,10)\nEND\n```\n\n- controlling\
    \ the editing of sensitive data\n\n```sql\nCREATE TRIGGER [db][Blocking_edition_of_sensitive_data]\n\
    ON [db][sensitive table]\nINSTEAD OF UPDATE\nAS\nBEGIN\nSET NOCOUNT ON;\nDECLARE\
    \ @sensitive_data_1 [data_type]\nDECLARE @sensitive_data_2 [data_type]\nDECLARE\
    \ @id_sensitive_table [data_type]\nif update(@sensitive_data_1) OR update(@sensitive_data_2)\n\
    BEGIN\nSELECT @sensitive_data_1 = sensitive_data_1, @sensitive_data_2 = sensitive_data_2\
    \ FROM inserted\nSELECT @id_sensitive_table = id_sensitive_table FROM deleted\n\
    if dbo.rule_function(@sensitive_data_1 , @sensitive_data_2)=1\n    UPDATE [sensitive\
    \ table] SET sensitive_data_1=@sensitive_data_1, sensitive_data_2=@sensitive_data_2\n\
    \    WHERE id_sensitive_table=@id_sensitive_table\nelse\n    RAISERROR ('The data\
    \ do not satisfy the conditions of the rule', 16,10)\nEND\n```\n\n# Case study\
    \ – model of the Patient Service System\n\nThe Patient Service System (PSS) covers\
    \ a network of specialist centres that provide medical services such as medical\
    \ consultations, and simple treatments. Patients are employees of clients, i.e.\
    \ companies that have signed a contract for the provision of this type of service.\
    \ Medical workers of various specialties work to a weekly schedule of admissions,\
    \ on which patient visits are recorded. During the first visit, an interview is\
    \ carried out including medical history, medications taken and the patient's allergies.\
    \ Each visit registration is added service from the offer of the network of clinics,\
    \ of which value is as much of the invoice issued, plus other services additionally\
    \ performed during the visit. Apart from the interview data, the patient's card\
    \ carries a history of visits with the results of the tests and prescriptions\
    \ issued, referrals, sick leaves and doctors' recommendations as well as diagnoses.\
    \ The semantic model of the system described above is presented in the SERM diagram\
    \ (Figure 2), which will be the basis for the implementation of the presented\
    \ framework.\n\n## 4.1 Identification and analysis of closed relationship circuits\n\
    \nIn the diagram shown in Figure 2, we can distinguish seven closed relationship\
    \ circuits. Table 1 presents in the names and degrees of inheritance hierarchy\
    \ of objects included in the circuit. For each circuit, the potential condition\
    \ tables and the sensitive tables are marked in bold. According to the developed\
    \ approach, only tables that are the extreme right of the circuit, i.e. those\
    \ belonging to the highest level of inheritance hierarchy, can be sensitive. Determination\
    \ of potential condition tables depends on the circuit layout. In the case of\
    \ extraction one leftmost element in the circuit, which in the case of circuits\
    \ 3, 4 and 5, the condition tables can be all independent on it. In the analysed\
    \ diagram, circuits 3, 4 and 5 are a special case, where the object that can be\
    \ a condition table is a potentially sensitive table due to the lack of other\
    \ circuit elements (only three tables are included in the circuit). When the connection\
    \ of objects on the left is clearly visible in a closed circuit, this connection\
    \ is sensitive.\n\nPotential condition tables and sensitive tables selected in\
    \ individual circuits are the bases for the analysis of the relationships between\
    \ them in order to define possible logical rules. In the presented example, as\
    \ a result of this analysis, only two dependencies were shown. The first one concerns\
    \ circuit 1 and is related to the control of the medical employee's rights. The\
    \ patient books an appointment with an employee for a specific service to which\
    \ he or is entitled. The second case of dependency was detected in circuit 4 and\
    \ ensures the control of additional services. The additional service provided\
    \ cannot be the same for the visit which was booked.\n\nTable 1. Closed relationship\
    \ circuits in the SERM diagram of the Patient Service System (own elaboration).\n\
    \n| Number of circuit | I | II | III | IV | V | VII |\n| :--- | :--- | :--- |\
    \ :--- | :--- | :--- | :--- |\n| 1 | service | medical worker | worker's service\
    \ | appointment schedule | appointment | |\n| 2 | | medication | patient | appointment\
    \ | prescription | prescribed medication |\n| 3 | city | customer | patient |\
    \ | | |\n| 4 | service | | | | service provided | |\n| 5 | | | | patient | appointment\
    \ | referral |\n| 6 | illness | | | pass illness | appointment | diagnosis |\n\
    | 7 | | clinic | surgery patient | appointment schedule | appointment | |\n\n\
    ## 4.2 The functions of the rules resulting from the analysis\n\nBased on the\
    \ presented framework (Figure 1), in order to define the rule function, it is\
    \ necessary to determine certain conditions and sensitive data. Based on the dependency\
    \ detected in circuit 1, the condition data must be the employee identifier (id_worker)\
    \ and the identifier of the service to which it is entitled (id_service) from\
    \ the worker's service table. These data constitute the body of if-else rule.\
    \ Sensitive data, on the other hand, is the employee's schedule identifier (id_schedule)\
    \ and the identifier of the service to which it is entitled (id_service) from\
    \ the appointment table. These data are the parameters of the function that supports\
    \ the rule to protect against unwanted access. In this case, the function is to\
    \ protect the patient against registration for the service to an unauthorized\
    \ employee.\n"
