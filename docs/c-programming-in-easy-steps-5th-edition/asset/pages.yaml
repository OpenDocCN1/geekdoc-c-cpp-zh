    \ trgl ;\n    return 0 ;\n}\n```\n```\n\n+   6. Insert calls to the method inherited\
    \ from the Polygon base class – to initialize the inherited variables\n\n```\n\
    ```cpp\nrect.setValues( 4, 5 );\ntrgl.setValues( 4, 5 );\n```\n```\n\n+   7. Output\
    \ the value returned by the unique method of each derived class\n\n```\n```cpp\n\
    cout << “Rectangle area : “ << rect.area() << endl ;\ncout << “Triangle area :\
    \ “ << trgl.area() << endl ;\n```\n```\n\n+   8. Save, compile, and run the program\
    \ to see the output\n\n![](img/bf8dbdfb89042fadbaa73b4160c74bac_126_0.png)\n\n\
    ![](img/bf8dbdfb89042fadbaa73b4160c74bac_126_1.png)\n\nDon’t confuse class instances\
    \ and derived classes – an instance is a copy of a class, whereas a derived class\
    \ is a new class that inherits properties of the base class from which it is derived.\n\
    \n![](img/bf8dbdfb89042fadbaa73b4160c74bac_126_2.png)\n\nA class declaration can\
    \ derive from more than one class. For example, **class Box : public A, public\
    \ B, public C { };**"
