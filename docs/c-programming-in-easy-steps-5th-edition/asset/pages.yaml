  md: "# Building strings\n\nThe preprocessor # operator is known as the “stringizing”\
    \ operator, as it converts a series of characters passed as a macro argument into\
    \ a string – adding double quotes to enclose the string.\n\nAll whitespace before\
    \ or after the series of characters passed as a macro argument to the stringizing\
    \ operator is ignored, and multiple spaces between characters is reduced to just\
    \ one space.\n\nThe stringizing operator is useful to pass string values to a\
    \ preprocessor #define directive without needing to surround each string with\
    \ double quotes.\n\nA macro definition can combine two terms into a single term\
    \ using the ## merging operator. Where the combined term is a variable name, its\
    \ value is not expanded by the macro – it simply allows the variable name to be\
    \ substituted by the macro.\n\n![](img/bf8dbdfb89042fadbaa73b4160c74bac_163_0.png)\n\
    \nstrung.cpp\n\n+   1. Start a new program by defining a macro to create a string\
    \ from a series of characters passed as its argument, to substitute in an output\
    \ statement\n+   \n+   ```cpp\n+   #define LINEOUT( str ) cout << #str << endl\n\
    +   ```\n\n+   2. Define a second macro to combine two terms passed as its arguments\
    \ into a variable name, to substitute in an output statement\n+   \n+   ```cpp\n\
    +   #define GLUEOUT( a, b ) cout << a##b << endl\n+   ```\n\n+   3. After the\
    \ macro definitions, specify the library classes to include, and a namespace prefix\
    \ to use\n+   \n+   ```cpp\n+   #include <string>\n+   #include <iostream>\n+\
    \   using namespace std ;\n+   ```\n\n+   4. Add a main function containing a\
    \ final return statement\n+   \n+   ```cpp\n+   int main()\n+   {\n+       //\
    \ Program code goes here.\n+       return 0 ;\n+   }\n+   ```\n\n+   5. At the\
    \ start of the main function block, declare and initialize a string variable,\
    \ then append a further string\n+   \n+   ```cpp\n+   string longerline = “They\
    \ carried a net ” ;\n+   longerline += “and their hearts were set” ;\n+   ```\n\
    \n+   6. Now, add statements to output text using the macros\n+   \n+   ```cpp\n\
    +   LINEOUT(In a bowl to sea went wise men three) ;\n+   LINEOUT(On a brilliant\
    \ night in June) ;\n+   GLUEOUT( longer, line ) ;\n+   LINEOUT(On fishing up the\
    \ moon.) ;\n+   ```\n\n+   7. Save the file, then compile the program, saying\
    \ the temporary files and run the program\n+   \n+   ```text\n+   c++ strung.cpp\
    \ -save-temps -o strung.exe\n+   ```\n\n![](img/bf8dbdfb89042fadbaa73b4160c74bac_163_1.png)\n\
    \n+   8. Open the temporary “.ii” file in a plain text editor, like Notepad, to\
    \ see that the string"
