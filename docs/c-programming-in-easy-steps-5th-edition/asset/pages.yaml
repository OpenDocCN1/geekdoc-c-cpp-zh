  md: "# Appending to a file\n\nWhen a filestream object is created, the parentheses\
    \ following its chosen name can optionally contain additional arguments, specifying\
    \ a range of file “modes” to control the behavior of that filestream object. These\
    \ file modes are part of the **ios** namespace, so must be explicitly addressed\
    \ using that prefix. Each file mode is listed in the table below, together with\
    \ a behavior description:\n\n| Mode | Behavior |\n|---|---|\n| **ios::out** |\
    \ Open a file to write output |\n| **ios::in** | Open a file to read input |\n\
    | **ios::app** | Open a file to append output at the end of any existing content\
    \ |\n| **ios::trunc** | Truncate the existing file (default behavior) |\n| **ios::ate**\
    \ | Open a file without truncating and allow data to be written anywhere in the\
    \ file |\n| **ios::binary** | Treat the file as binary format rather than text\
    \ so the data may be stored in non-text format |\n\n![](img/bf8dbdfb89042fadbaa73b4160c74bac_81_0.png)\n\
    \nThe preprocessor directive **using namespace std;** allows the **std** namespace\
    \ prefix to be omitted -- so **cout** refers to the **std::cout** function. The\
    \ **ios** namespace exists within the **std** namespace -- so the file modes can\
    \ be explicitly addressed using both namespace prefixes, for example **std::ios::out**.\n\
    \nMultiple modes may be specified if they are separated by a “|” pipe character.\
    \ For example, the syntax of a statement to open a file for binary output looks\
    \ like this:\n\n```\nofstream object-name ( “file-name” , ios::out|ios::binary\
    \ );\n```\n\nThe default behavior when no modes are explicitly specified regards\
    \ the file as a text file that will be truncated after writing.\n\nThe most commonly\
    \ specified mode is **ios::app**, which ensures existing content will be appended,\
    \ rather than overwritten, when new output is written to the nominated file.\n\
    \nThe program described below appends data to the text file created in the previous\
    \ example.\n\n![](img/bf8dbdfb89042fadbaa73b4160c74bac_81_1.png)\n\nappend.cpp\n\
    \n+   1. Start a new program by specifying the C++ library classes to include,\
