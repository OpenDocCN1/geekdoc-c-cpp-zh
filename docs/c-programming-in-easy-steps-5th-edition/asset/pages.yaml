  md: "# # Overloading functions\n\nFunction “overloading” allows functions of the\
    \ same name to happily co-exist in the same program, providing their arguments\
    \ differ in number, data type, or both number and data type. The compiler matches\
    \ a function call to the correct version of the function by recognizing its argument\
    \ number and data types – a process known as “function resolution”.\n\nIt is useful\
    \ to create overloaded functions when the tasks they are to perform are similar,\
    \ yet subtly different.\n\n![](img/bf8dbdfb89042fadbaa73b4160c74bac_55_0.png)\n\
    \noverload.cpp\n\n+   1. Start a new program by specifying the C++ library classes\
    \ to include, and a namespace prefix to use.\n+   \n+   ```cpp\n+   #include <iostream>\n\
    +   using namespace std;\n+   ```\n\n+   2. Below the preprocessor instructions,\
    \ declare a function prototype that returns a float value and has one argument.\n\
    +   \n+   ```cpp\n+   float computeArea ( float );\n+   ```\n\n+   3. Now, declare\
    \ two overloaded function prototypes – having different arguments to the first\
    \ prototype.\n+   \n+   ```cpp\n+   float computeArea ( float, float );\n+   float\
    \ computeArea ( char, float, float );\n+   ```\n\n+   4. Below the prototype declarations,\
    \ add a main function containing a final **return** statement.\n+   \n+   ```cpp\n\
    +   int main()\n+   {\n+       // Program code goes here.\n+       return 0;\n\
    +   }\n+   ```\n\n+   5. After the main function, define the first function that\
    \ receives just one argument.\n+   \n+   ```cpp\n+   float computeArea( float\
    \ diameter )\n+   {\n+       float radius = ( diameter / 2 );\n+       return\
    \ ( 3.141593 * ( radius * radius ) );\n+   }\n+   ```\n\n![](img/bf8dbdfb89042fadbaa73b4160c74bac_55_1.png)\n\
    \nFunctions that only differ by their return data type cannot be overloaded –\
    \ it’s the arguments that must differ. Function resolution does not take the return\
    \ data types into consideration.\n\n+   6. Below the first function definition,\
    \ define the overloaded functions that receive different arguments.\n+   \n+ \
    \  ```cpp\n+   float computeArea( float width, float height )\n+   {\n+      \
    \ return ( width * height );\n+   }\n+   float computeArea( char letter, float\
    \ width, float height )\n+   {\n+       return ( ( width / 2 ) * height );\n+\
    \   }\n+   ```\n\n+   7. In the main function, insert statements to declare two\
    \ variables, and initialize one with"
  merge: -1
