  md: '# # Preface


    The creation of this book has provided me, Mike McGrath, a welcome opportunity
    to update my previous books on C++ programming with the latest techniques. All
    examples I have given in this book demonstrate C++ features supported by current
    compilers on both Windows and Linux operating systems, and in the Microsoft Visual
    Studio development suite, and the book’s screenshots illustrate the actual results
    produced by compiling and executing the listed code.


    # ### Conventions in this book


    In order to clarify the code listed in the steps given in each example, I have
    adopted certain colorization conventions. Components of the C++ language itself
    are colored blue, numeric and string values are red, programmer-specified names
    are black, and comments are green, like this:


    ```

    ```cpp

    // Store then output a text string value.

    string myMessage = "Hello from C++!" ;

    cout << myMessage ;

    ```

    ```


    Additionally, in order to identify each source code file described in the steps,
    a colored icon and file name appears in the margin alongside the steps:


    ![](img/bf8dbdfb89042fadbaa73b4160c74bac_5_0.png)


    ![](img/bf8dbdfb89042fadbaa73b4160c74bac_5_1.png)


    # ### Grabbing the source code


    For convenience I have placed source code files from the examples featured in
    this book into a single ZIP archive, providing versions for Windows and Linux
    platforms plus the Microsoft Visual Studio IDE. You can obtain the complete archive
    by following these easy steps:


    +   1. Browse to www.ineasysteps.com then navigate to Free Resources and choose
    the Downloads section

    +   2. Find C++ Programming in easy steps, 5th Edition in the list then click
    on the hyperlink entitled All Code Examples to download the archive

    +   3. Now, extract the archive contents to any convenient location on your computer


    I sincerely hope you enjoy discovering the powerful, expressive possibilities
    of C++ Programming and have as much fun with it as I did in writing this book.'
