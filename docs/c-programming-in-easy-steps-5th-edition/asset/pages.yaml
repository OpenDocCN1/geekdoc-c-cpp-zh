  md: "# # Declaring constants\n\nData that will not change during the execution of\
    \ a program should be stored in a constant container, rather than in a variable.\
    \ This better enables the compiler to check the code for errors – if the program\
    \ attempts to change the value stored in a constant, the compiler will report\
    \ an error and the compilation will fail.\n\nA constant can be created for any\
    \ data type by prefixing a variable declaration with the **const** keyword, followed\
    \ by a space. Typically, constant names appear in uppercase to distinguish them\
    \ from (lowercase) variable names. Unlike variables, constants must always be\
    \ initialized in the declaration. For example, the declaration of a constant for\
    \ the math pi value looks like this:\n\n```\n```cpp\nconst double PI = 3.1415926536\
    \ ;\n```\n```\n\nThe **enum** keyword provides a handy way to create a sequence\
    \ of integer constants in a concise manner. Optionally, the declaration can include\
    \ a name for the sequence after the **enum** keyword. The constant names follow\
    \ as a comma-separated list within braces. For example, this declaration creates\
    \ a sequence of constants:\n\n```\n```cpp\nenum suit { CLUBS , DIAMONDS , HEARTS\
    \ , SPADES } ;\n```\n```\n\nEach of the constants will, by default, have a value\
    \ one greater than the preceding constant in the list. Unless specified, the first\
    \ constant will have a value of zero, the next a value of one, and so on. A constant\
    \ can be assigned any integer value, but the next constant in the list will always\
    \ increment it by one.\n\nIt is occasionally convenient to define a list of enumerated\
    \ constants as a \"custom data type\" – by using the **typedef** keyword. This\
    \ can begin the **enum** declaration, and a chosen type name can be added at the\
    \ end of the declaration. For example, this **typedef** statement creates a custom\
    \ data type named \"charge\":\n\n```\n```cpp\ntypedef enum { NEGATIVE , POSITIVE\
    \ } charge ;\n```\n```\n\nVariables can then be created of the custom data type\
    \ in the usual way, which may legally be assigned any of the listed constants.\
    \ Essentially, these variables act just like an **int** variable – as they store\
    \ the numerical integer value the assigned constant represents. For example, with\
    \ the example above, assigning a **POSITIVE** constant to a **charge** variable\
    \ actually assigns an integer of one.\n\n![](img/bf8dbdfb89042fadbaa73b4160c74bac_21_0.png)\n\
    \n> > The **typedef** keyword simply creates a nickname for a structure.\n\n![](img/bf8dbdfb89042fadbaa73b4160c74bac_21_1.png)\n\
    \nconstant.cpp\n\n+   1. Start a new program by specifying the C++ library classes\
    \ to include, and a namespace prefix to use\n+   \n+      ```cpp\n+      #include\
    \ <iostream>\n+      using namespace std ;\n+      ```\n\n+   2. Add a main function\
    \ containing a final return statement\n+   \n+      ```cpp\n+      int main()\n\
    +      {\n+          // Program code goes here.\n+          return 0 ;\n+    \
    \  }\n+      ```"
