  md: "# Discovering string features\n\nThe C++ `<string>` library provides a number\
    \ of functions that make it easy to work with strings. To use them, simply add\
    \ the function name after the **string** variable name and a dot. For example,\
    \ with a **stringstream** variable named “msg” you can call upon the **size()**\
    \ function, to return its character length, with **msg.size()**.\n\nA **string**\
    \ variable can be emptied of all characters by assigning it an empty string with\
    \ two double quotes without spacing – as “”, or alternatively by calling the `<string>`\
    \ library’s **clear()** function.\n\nUnlike a **char** array, a **string** variable\
    \ will dynamically enlarge to accommodate the number of characters assigned to\
    \ it, and its current memory size can be revealed with the `<string>` library’s\
    \ **capacity()** function. Once enlarged, the allocated memory size remains, even\
    \ when a smaller **string** gets assigned to the variable.\n\n![](img/bf8dbdfb89042fadbaa73b4160c74bac_67_0.png)\n\
    \nThe **length()** function can be used in place of the **size()** function to\
    \ reveal the size of a string value.\n\nThe `<string>` library’s **empty()** function\
    \ returns a Boolean **true (1)** or **false (0)** response to reveal whether the\
    \ string is empty or not.\n\n![](img/bf8dbdfb89042fadbaa73b4160c74bac_67_1.png)\n\
    \nfeatures.cpp\n\n+   1. Start a new program by specifying the C++ library classes\
    \ to include, and a namespace prefix to use.\n\n```\n```cpp\n#include <string>\
    \       // Include string support.\n#include <iostream>\nusing namespace std;\n\
    ```\n```\n\n+   2. Below the preprocessor directives, declare a function prototype\
    \ with a single string data type argument.\n\n```\n```cpp\nvoid computeFeatures(\
    \ string );\n```\n```\n\n+   3. Add a main function containing a final **return**\
    \ statement and declaring an initialized **string** variable.\n\n```\n```cpp\n\
    int main()\n{\n    string text = “C++ is fun”;\n    // Add more statements here.\n\
    \    return 0;\n}\n```\n```\n\n+   4. After the main function, define the declared\
    \ function to display the **string** variable value when called.\n\n```\n```cpp\n\
    void computeFeatures( string text )\n{\n    cout << endl << “String: ” << text\
    \ << endl ;\n}\n```\n```\n\n+   5. In the function definition, add statements\
    \ to output features of the **string** variable.\n\n```\n```cpp\ncout << “Size:\
    \ ” << text.size() ;\ncout << “Capacity: ” << text.capacity() ;\ncout << “Empty?:\
    \ ” << text.empty() << endl ;\n```\n```"
