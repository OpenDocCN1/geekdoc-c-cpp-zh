  md: "# Calling base constructors\n\nAlthough derived classes inherit the members\
    \ of their parent base class, they do not inherit its constructor and destructor.\
    \ However, it should be noted that the default constructor of the base class is\
    \ always called when a new object of a derived class is created – and the base\
    \ class destructor is called when the object gets destroyed. These calls are made\
    \ in addition to those made to the constructor and destructor methods of the derived\
    \ class.\n\nThe default constructor of the base class has no arguments – but that\
    \ class may also have overloaded constructors which do. If you prefer to call\
    \ an overloaded constructor of the base class when a new object of a derived class\
    \ is created, you can create a matching overloaded constructor in the derived\
    \ class – having the same number and type of arguments.\n\n![](img/bf8dbdfb89042fadbaa73b4160c74bac_127_0.png)\n\
    \n+   1. Start a new program by specifying the C++ library classes to include,\
    \ and a namespace prefix to use.\n+   \n+   ```cpp\n+   #include <iostream>\n\
    +   using namespace std ;\n+   ```\n\n+   2. Declare a class named “Parent”, which\
    \ will be a base class.\n+   \n+   ```cpp\n+   class Parent\n+   {\n+       //\
    \ Class members go here.\n+   } ;\n+   ```\n\n+   3. Between the braces of the\
    \ Parent class declaration, insert a public access specifier and add a default\
    \ constructor to output text – identifying when it has been called.\n+   \n+ \
    \  ```cpp\n+   public:\n+       Parent()\n+       { cout << “Default Parent constructor\
    \ called.”; }\n+   ```\n\n+   4. Add an overloaded constructor, which takes a\
    \ single integer argument, and also outputs identifying text.\n+   \n+   ```cpp\n\
    +       Parent ( int a )\n+       { cout << endl <<\n+           “Overloaded Parent\
    \ constructor called.”; }\n+   ```\n\n+   5. After the Parent class, declare a\
    \ derived “Daughter” class.\n+   \n+   ```cpp\n+   class Daughter : public Parent\n\
    +   {\n+   \n+   };\n+   ```\n\n![](img/bf8dbdfb89042fadbaa73b4160c74bac_127_1.png)\n\
    \n+   6. In the Daughter class declaration, insert a public access specifier and\
    \ add a default constructor to output text – identifying when it has been called.\n\
    +   \n+   ```cpp\n+   public:\n+       Daughter ()\n+       { cout << endl <<\n\
    +           “Derived Daughter class default constructor called.”; }\n+   ```\n\
    \n+   7. After the Daughter class, declare a derived “Son” class."
