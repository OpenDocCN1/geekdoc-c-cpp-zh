  md: "# Declaring functions\n\nFunctions enclose a section of code that provides\
    \ specific functionality to the program. When a function is called from the main\
    \ program, its statements are executed and, optionally, a value can be returned\
    \ to the main program upon completion. There are three main benefits to using\
    \ functions:\n\n+   - Functions make program code easier to understand and maintain.\n\
    +   - Tried and tested functions can be re-used by other programs.\n+   - Several\
    \ programmers can divide the workload in large projects by working on different\
    \ functions of the program.\n\n![](img/bf8dbdfb89042fadbaa73b4160c74bac_51_0.png)\n\
    \n# Declaring functions\n\nEach function is declared early in the program code\
    \ as a “prototype”, comprising a data type for the value it will return and the\
    \ function name followed by parentheses, which may optionally contain a list of\
    \ “argument” data types of passed values it may use. The syntax of a function\
    \ prototype declaration looks like this:\n\n```\nreturn-data-type function-name\
    \ ( arguments-data-type-list ) ;\n```\n\n![](img/bf8dbdfb89042fadbaa73b4160c74bac_51_1.png)\n\
    \nStrictly speaking, the arguments in a function prototype are known as its “formal\
    \ parameters”.\n\nFor example, a function named “computeArea” that returns a float\
    \ value and is passed two float arguments is declared as:\n\n```\nfloat computeArea(\
    \ float, float ) ;\n```\n\n# Defining functions\n\nThe function’s definition appears\
    \ later in the program code and comprises a repeat of the prototype, plus the\
    \ actual function body. The function body is the statements to be executed whenever\
    \ the function is called, contained within a pair of braces.\n\n![](img/bf8dbdfb89042fadbaa73b4160c74bac_51_2.png)\n\
    \nUse the void keyword if the function will return no value to the caller.\n\n\
    It is important to recognize that the compiler checks the function definition\
    \ against the prototype, so the actual returned data type must match that specified\
    \ in the prototype, and any supplied arguments must match in both number and data\
    \ type. Compilation fails if the definition does not match the prototype. A simple\
    \ computeArea definition might look like this:\n\n```\nfloat computeArea( float\
    \ width, float height )\n{\n    return ( width * height ) ;\n}\n```\n\n# Variable\
    \ scope"
  merge: -1
  img_proc: true
