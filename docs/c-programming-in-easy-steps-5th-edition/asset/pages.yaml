  md: "# # Optimizing functions\n\nFunctions can call themselves recursively, to repeatedly\
    \ execute the statements contained in their function body – much like a loop.\
    \ As with loops, a recursive function must contain an incrementer and a conditional\
    \ test to call itself again, or stop repeating when a condition is met. The syntax\
    \ of a recursive function looks like this:\n\n```\n```text\nreturn-data-type function-name\
    \ ( argument-list )\n{\n    statements-to-be-executed ;\n    incrementer ;\n \
    \   conditional-test-to-recall-or-exit ;\n}\n```\n```\n\nThe incrementer will\
    \ change the value of a passed argument – so subsequent calls will pass the adjusted\
    \ value back to the function.\n\n![](img/bf8dbdfb89042fadbaa73b4160c74bac_57_0.png)\n\
    \noptimize.cpp\n\n+   1. Start a new program by specifying the C++ library classes\
    \ to include, and a namespace prefix to use.\n+   \n+   ```cpp\n+   #include <iostream>\n\
    +   using namespace std ;\n+   ```\n\n+   2. Below the preprocessor instructions,\
    \ declare two function prototypes that will both be recursive functions.\n+  \
    \ \n+   ```cpp\n+   int computeFactorials ( int, int ) ;\n+   int factorial (\
    \ int ) ;\n+   ```\n\n+   3. Below the prototype declarations, add a main function\
    \ containing a final **return** statement.\n+   \n+   ```cpp\n+   int main()\n\
    +   {\n+       // Program code goes here.\n+       return 0 ;\n+   }\n+   ```\n\
    \n+   4. After the main function, add the definition for the first function prototype\
    \ – a recursive function.\n+   \n+   ```cpp\n+   int computeFactorials ( int num,\
