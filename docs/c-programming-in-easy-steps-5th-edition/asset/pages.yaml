  md: "# Overloading methods\n\nJust as C++ allows functions to be overloaded, class\
    \ methods can be overloaded too – including constructor methods. An overloaded\
    \ constructor method is useful to assign default values to member variables when\
    \ an object is created without passing values to the constructor.\n\n![](img/bf8dbdfb89042fadbaa73b4160c74bac_123_0.png)\n\
    \noverloaded.cpp\n\n+   1. Rename a copy of the previous example “constructor.cpp”\
    \ as a new program “overloaded.cpp”\n\n+   2. In the public section of the Dog\
    \ class declaration, add inline an overloaded bark method – to output a passed\
    \ string argument when called\n\n```\n```cpp\nvoid bark ( string noise ) { cout\
    \ << noise << endl; }\n```\n```\n\n+   3. Now, declare a constructor method prototype\
    \ that takes no arguments (a default constructor method) and an overloaded constructor\
    \ method prototype that takes two arguments\n\n```\n```cpp\nDog();\nDog( int,\
    \ int );\n```\n```\n\n+   4. After the Dog class declaration, add a definition\
    \ for the default constructor method – assigning default values to class variables\
    \ when an object is created without passing any arguments\n\n```\n```cpp\nDog::Dog()\n\
    {\n    age = 1;\n    weight = 2;\n    color = “black”;\n}\n```\n```\n\n+   5.\
    \ Now, add a definition for the overloaded constructor method – assigning default\
    \ values to class variables when an object is created passing two arguments\n\n\
    ```\n```cpp\nDog::Dog ( int age, int weight )\n{\n    this -> age = age ;\n  \
    \  this -> weight = weight ;\n    color = “white” ;\n}\n```\n```\n\n![](img/bf8dbdfb89042fadbaa73b4160c74bac_123_1.png)\n\
    \nThe this -> pointer is used to explicitly identify class members when arguments\
    \ have the same name as members.\n\n+   6. In the main method, insert a statement\
    \ to create a Dog object without passing any arguments – calling the default constructor\n\
    \n```\n```cpp\nDog rex ;\n```\n```\n\n+   7. Add statements calling each getter\
    \ method to retrieve the default values – set by the default constructor method\n\
    \n```\n```cpp\ncout << “Rex is a ” << rex.getAge() ;\ncout << “ year old ” <<\
    \ rex.getColor();\ncout << “ dog who weighs ” << rex.getWeight();\ncout << “ pounds.”\
    \ ;\n```\n```"
