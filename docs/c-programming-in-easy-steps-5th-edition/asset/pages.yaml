  md: "# # Creating an object\n\nIn order to assign and retrieve data from private\
    \ members of a class, special public accessor methods must be added to the class.\
    \ These are “setter” methods, to assign data, and “getter” methods, to retrieve\
    \ data. Accessor methods are often named as the variable they address, with the\
    \ first letter made uppercase, and prefixed by “set” or “get” respectively. For\
    \ example, accessor methods to address an age variable may be named setAge() and\
    \ getAge().\n\n![](img/bf8dbdfb89042fadbaa73b4160c74bac_117_0.png)\n\nobject.cpp\n\
    \n+   1. Start a new program by specifying the C++ library classes to include,\
    \ and a namespace prefix to use.\n+   \n+   ```cpp\n+   #include <string>\n+ \
    \  #include <iostream>\n+   using namespace std ;\n+   ```\n\n+   2. Declare a\
    \ class named “Dog”.\n+   \n+   ```cpp\n+   class Dog\n+   {\n+   };\n+   ```\n\
    \n+   3. Between the braces of the Dog class declaration, declare three **private**\
    \ variable members.\n+   \n+   ```cpp\n+   int age, weight ;\n+   string color\
    \ ;\n+   ```\n\n+   4. After the **private** variables, add a **public** access\
    \ specifier.\n+   \n+   ```cpp\n+   public:\n+   ```\n\n+   5. Begin the public\
    \ members list by adding a method to output a **string** when called.\n+   \n\
    +   ```cpp\n+   void bark() { cout << \"WOOF!\" << endl ; }\n+   ```\n\n+   6.\
    \ Add **public setter methods** – to assign individual values to each of the **private**\
    \ variables.\n+   \n+   ```cpp\n+   void setAge ( int yrs ) { age = yrs ; }\n\
    +   void setWeight ( int lbs ) { weight = lbs ; }\n+   void setColor ( string\
    \ hue ) { color = hue ; }\n+   ```\n\n+   7. Add **public getter methods** – to\
    \ retrieve individual values from each of the **private** variables.\n+   \n+\
    \   ```cpp\n+   int getAge()   { return age ; }\n+   int getWeight() { return\
    \ weight ; }\n+   string getColor() { return color ; }\n+   ```\n\n![](img/bf8dbdfb89042fadbaa73b4160c74bac_117_1.png)\n\
    \nMembers declared before an access specifier are **private** by default, and\
    \ remember to add a final semicolon after each class declaration.\n\n![](img/bf8dbdfb89042fadbaa73b4160c74bac_117_2.png)\n\
    \nIn the class declaration, notice that all methods are declared **public** and\
    \ all variables are declared **private**. This notion of “public interface, private\
    \ data” is a key concept when creating classes."
