  md: "# Directing method calls\n\nThe great advantage of polymorphism with multiple\
    \ derived class objects is that calls to methods of the same name are directed\
    \ to the appropriate overriding method.\n\nA base class may contain only virtual\
    \ methods which each derived class may override with their own methods, but base\
    \ class methods can still be called explicitly using the :: scope resolution operator.\
    \ This can allow inconsistencies, however – this example would seem to imply that\
    \ chickens can fly!\n\n![](img/bf8dbdfb89042fadbaa73b4160c74bac_137_0.png)\n\n\
    birds.cpp\n\n+   1. Start a new program by specifying the C++ library classes\
    \ to include, and a namespace prefix to use\n+   \n+   ```cpp\n+   #include <iostream>\n\
    +   using namespace std ;\n+   ```\n\n+   2. Declare a base class named “Bird”,\
    \ containing two virtual method declarations\n+   \n+   ```cpp\n+   class Bird\n\
    +   {\n+   public :\n+       virtual void Talk() const\n+       { cout << \"A\
    \ bird talks...\" << endl ; }\n+   \n+       virtual void Fly() const\n+     \
    \  { cout << \"A bird flies...\" << endl ; }\n+   };\n+   ```\n\n+   3. Declare\
    \ a derived class named “Pigeon”, containing two methods to override those in\
    \ the base class\n+   \n+   ```cpp\n+   class Pigeon : public Bird\n+   {\n+ \
    \  public :\n+       void Talk() const\n+       { cout << \"Cool! Cool!\" << endl\
    \ ; }\n+   \n+       void Fly() const\n+       { cout << \"A pigeon flies away...\"\
    \ << endl ; }\n+   };\n+   ```\n\n![](img/bf8dbdfb89042fadbaa73b4160c74bac_137_1.png)\n\
    \nOverriding methods in derived class may, optionally, include the virtual prefix\
    \ – as a reminder it is overriding a base class method.\n\n+   4. Declare a derived\
    \ class named “Chicken”, containing two methods to override those in the base\
    \ class\n+   \n+   ```cpp\n+   class Chicken : public Bird\n+   {\n+   public\
    \ :\n+       void Talk() const\n+       { cout << \"Cluck! Cluck!\" << endl ;\
    \ }\n+   \n+       void Fly() const\n+       { cout << \"I'm just a chicken –\
    \ I can't fly!\" << endl ; }\n+   };\n+   ```"
