- pgno: 189
  md: '# # Summary


    +   - The **Universal Windows Platform** (UWP) enables a single app to run on
    any modern Windows-based device.

    +   - The e**X**tensible **A**pplication **M**arkup **L**anguage (XAML) is used
    to specify components and layout on UWP apps.

    +   - The **Universal Windows App Development Tools** are needed in order to develop
    UWP apps.

    +   - The **Blank App (Universal Windows)** template can be used to create a new
    UWP project.

    +   - Visual Studio provides a graphical **Design** view and a text code **XAML**
    view for the **MainPage.xaml** file.

    +   - Component elements can be placed within XAML **<StackPanel>** elements to
    arrange their orientation.

    +   - Image files can be added to the **Assets** folder and assigned to XAML **<Image>**
    elements for display on the interface.

    +   - Space can be added around a component by adding a **Margin** attribute and
    assigned value within its element tag.

    +   - Functional C++ programming code can be added to the **MainPage.xaml.cpp**
    code-behind page.

    +   - The **Developer Mode** setting must be enabled in the Windows 10 options
    in order to develop and test UWP apps.

    +   - A UWP app can be tested in **Debug** mode on the **Local Machine**, a **Mobile
    Emulator**, and a connected **Device**.

    +   - The interface of a UWP app can adapt to different screen sizes by changing
    the orientation of **<StackPanel>** elements.

    +   - Image files can be added to the **Assets** folder for assignment as logos
    in the **Package.appmanifest** window.

    +   - The **Release** version can be deployed by selecting the target configuration,
    then using the **Build**, **Deploy Solution** menu.'
  merge: -1
  img_proc: true
- pgno: 190
  md: '# C++ Programming Essentials


    **Keywords:**


    |  |  |  |  |  |  |

    |---|---|---|---|---|---|

    | `auto` | `break` | `case` | `catch` | `default` | `delete` |

    | `char` | `class` | `const` | `continue` | `default` | `delete` |

    | `do` | `double` | `else` | `enum` | `extern` | `float` |

    | `for` | `friend` | `goto` | `if` | `int` | `long` |

    | `mutable` | `new` | `operator` | `private` | `protected` | `public` |

    | `register` | `return` | `short` | `signed` | `sizeof` | `static` |

    | `struct` | `switch` | `template` | `this` | `throw` | `typedef` |

    | `union` | `unsigned` | `virtual` | `void` | `volatile` | `while` |


    ![](img/bf8dbdfb89042fadbaa73b4160c74bac_190_0.png)


    **Data Types:**


    | Type | Description |

    |---|---|

    | `char` | A single character |

    | `int` | An integer whole number |

    | `float` | A floating-point number, correct to six decimal places |

    | `double` | A floating-point number, correct to ten decimal places |

    | `bool` | A Boolean value of TRUE (1) or FALSE (0) |

    | `string` | A string of characters |


    ![](img/bf8dbdfb89042fadbaa73b4160c74bac_190_1.png)


    **Library Classes:**


    | Class | Description |

    |---|---|

    | `<iostream>` | Reads and Writes to the console |

    | `<fstream>` | Reads and Writes to a file |

    | `<string>` | Stores and manipulates text strings |

    | `<sstream>` | Converts strings to other data types |

    | `<vector>` | Stores and manipulates data in vector array elements |

    | `<stdexcept>` | Reports logic errors and runtime errors |

    | `<ctime>` | Reports the date and time |


    ![](img/bf8dbdfb89042fadbaa73b4160c74bac_190_2.png)'
