  md: "# Making abstract data types\n\nAn Abstract Data Type (ADT) represents a concept,\
    \ rather than a tangible object, and is always the base to other classes. A base\
    \ class can be made into an ADT by initializing one or more of its methods with\
    \ zero. These are known as “pure virtual methods” and must always be overridden\
    \ in derived classes.\n\n![](img/bf8dbdfb89042fadbaa73b4160c74bac_141_0.png)\n\
    \nadt.cpp\n\n+   1. Start a new program by specifying the C++ library classes\
    \ to include, and a namespace prefix to use\n+   \n+   ```cpp\n+   #include <iostream>\n\
    +   using namespace std ;\n+   ```\n\n+   2. Declare a base ADT class named “Shape”,\
    \ containing three pure virtual methods\n+   \n+   ```cpp\n+   class Shape\n+\
    \   {\n+       public:\n+           virtual int getArea() = 0 ;\n+           virtual\
    \ int getEdge() = 0 ;\n+           virtual void Draw() = 0 ;\n+   };\n+   ```\n\
    \n+   3. Declare a derived class named “Rect”, containing two private variables\n\
