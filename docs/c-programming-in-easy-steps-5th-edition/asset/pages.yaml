- pgno: 177
  md: "# Designing the layout\n\nTo complete the app’s layout, design attributes can\
    \ be added to the XAML element tags to specify what they will display and precisely\
    \ where in the interface they will appear:\n\n![](img/bf8dbdfb89042fadbaa73b4160c74bac_177_0.png)\n\
    \nUniversal\n\n+   1. Open **MainPage.xaml**, then add two attributes to the outer\
    \ **<StackPanel>** element to fix its position **HorizontalAlignment = ”Left”\
    \ VerticalAlignment = ”Top”**\n+   \n+   2. Next, edit the **<Image>** element\
    \ by modifying the initial assigned value of 200 – to increase its width\n+  \
    \    **Width = ”300”**\n+   \n+   3. Now, add an attribute to the nested **<StackPanel>**\
    \ element to fix its position\n+      **VerticalAlignment = ”Center”**\n+   \n\
    +   4. Then, edit all six **<TextBlock>** elements alike, to specify their initial\
    \ content, width, and margin on all four sides\n+      **Text = ”…” Width = ”20”\
    \ Margin = ”15”**\n+      **Text = ”…” Width = ”20” Margin = ”15”**\n+      **Text\
    \ = ”…” Width = ”20” Margin = ”15”**\n+      **Text = ”…” Width = ”20” Margin\
    \ = ”15”**\n+      **Text = ”…” Width = ”20” Margin = ”15”**\n+      **Text =\
    \ ”…” Width = ”20” Margin = ”15”**\n+   \n+   5. Edit the first **<Button>** element\
    \ to rename it, specify its button label content and margin on all four sides\n\
    +      **x:Name = “BtnPick” Content = “Get My Lucky Numbers”**\n+      **Margin\
    \ = “15”**\n+   \n+   6. Edit the second **<Button>** element to rename it and\
    \ specify its button label content\n+      **x:Name = “BtnReset” Content = “Reset”**\n\
    +   \n+   7. Finally, add an attribute to each respective **<Button>** element\
    \ to specify their initial state\n+      **IsEnabled = “True”**\n+      **IsEnabled\
    \ = “False”**\n\n![](img/bf8dbdfb89042fadbaa73b4160c74bac_177_1.png)\n\nA single\
    \ **Margin** value sets all four margins around that component. You can specify\
    \ two values to set left & right, top & bottom margins, e.g. **Margin = “10,30”**.\
    \ Alternatively, you can specify four values to set left, top, right, bottom margins\
    \ individually, e.g. **Margin = “10,30,10,50”**.\n\nThe order in which the attributes\
    \ appear in each element is unimportant, but the elements within the **MainPage.xaml**\
    \ file should now look similar to the screenshot below:"
  merge: -1
  img_proc: true
