  md: "# # Looping while\n\nAn alternative to the **for** loop, introduced above,\
    \ uses the **while** keyword, followed by an expression to be evaluated. When\
    \ the expression is **true**, statements contained within braces following the\
    \ test expression will be executed. The expression will then be evaluated again,\
    \ and the **while** loop will continue until the expression is found to be **false**.\n\
    \nThe loop’s statement block **must** contain code that will affect the tested\
    \ expression in order to change the evaluation result to **false**, otherwise\
    \ an infinite loop is created that will lock the system! When the tested expression\
    \ is found to be **false** upon its first evaluation, the **while** loop’s statement\
    \ block will never be executed.\n\n![](img/bf8dbdfb89042fadbaa73b4160c74bac_49_0.png)\n\
    \nIf you accidentally start running an infinite loop, press the **Ctrl + C** keys\
    \ to terminate the process.\n\nA subtle variation of the **while** loop places\
    \ the **do** keyword before the loop’s statement block and a **while** test after\
    \ it, with this syntax:\n\n```\ndo { statements-to-be-executed } while ( test-expression\
    \ ) ;\n```\n\nIn a **do-while** loop, the statement block will always be executed\
    \ at least once -- because the expression is not evaluated until after the first\
    \ iteration of the loop.\n\nA **break** statement can be included in any kind\
    \ of loop to immediately terminate the loop when a test condition is met. The\
    \ **break** ensures no further iterations of that loop will be executed.\n\nSimilarly,\
    \ a **continue** statement can be included in any kind of loop to immediately\
    \ terminate that particular iteration of the loop when a test condition is met.\
    \ The **continue** statement allows the loop to proceed to the next iteration.\n\
    \n![](img/bf8dbdfb89042fadbaa73b4160c74bac_49_1.png)\n\nwhile.cpp\n\n+   1. Start\
    \ a new program by specifying the C++ library classes to include, and a namespace\
    \ prefix to use\n\n```\n```cpp\n#include <vector>              // Include vector\
    \ support.\n#include <iostream>\nusing namespace std ;\n```\n```\n\n+   2. Add\
    \ a main function containing a final **return** statement\n\n```\n```cpp\nint\
    \ main()\n{\n    // Program code goes here.\n    return 0 ;\n}\n```\n```\n\n+\
    \   3. In the main function, insert statements to declare an integer vector and\
    \ an integer variable loop counter\n\n```\n```cpp\nvector <int> vec( 10 );\nint\
    \ i = 0 ;\n```\n```\n\n+   4. Next, insert a **while** loop to assign a counter\
    \ value to an element of the vector on each iteration\n\n```\n```cpp\nwhile (\
    \ i < vec.size() )\n{\n    i++ ;                     // Increment the counter.\n\
    ```\n```"
