  md: '# Inserting page components


    Visual Studio provides a two-part window to insert interface components into a
    UWP app. This comprises a **Design** view of the components and a **XAML** view
    for the XAML code:


    ![](img/bf8dbdfb89042fadbaa73b4160c74bac_172_0.png)


    +   1. Open **Solution Explorer** then double-click on **MainPage.xaml** – to
    launch the two-part window


    ![](img/bf8dbdfb89042fadbaa73b4160c74bac_172_1.png)


    +   2. See that by default, the **Design** view displays a blank canvas in **Portrait**
    mode


    ![](img/bf8dbdfb89042fadbaa73b4160c74bac_172_2.png)


    ![](img/bf8dbdfb89042fadbaa73b4160c74bac_172_3.png)


    Explore these buttons to change the magnification and grid characteristics.


    +   3. Click the adjacent button in **Design** view to change the blank canvas
    to **Landscape** mode


    ![](img/bf8dbdfb89042fadbaa73b4160c74bac_172_4.png)


    ![](img/bf8dbdfb89042fadbaa73b4160c74bac_172_5.png)


    XAML is pronounced “zammel”.'
  merge: -1
  img_proc: true
- pgno: 173
  md: '![](img/bf8dbdfb89042fadbaa73b4160c74bac_173_0.png)


    There is a **Toolbox** that lets you add components onto the canvas, but you will
    need to edit them in the XAML code later. In this example, the components are
    created in XAML code from the very start.


    +   4. Now, see that by default, the **XAML** view reveals there are `<Grid></Grid>`
    tags – this is the root element of the canvas in which you can add component elements


    Component elements are best nested within a **<StackPanel>** element, as this
    can be given an **x:Name** for reference in functional code and an **Orientation**
    attribute to specify the direction in which the nested elements should appear.
    Common component elements include **<Image>**, **<TextBox>**, **<TextBlock>**
    (label), and **<Button>**. Several **<StackPanel>** elements can be nested within
    each other to determine the **Horizontal** and **Vertical** layout of components:


    +   5. Insert elements between the root `<Grid></Grid>` tags so the XAML view
    code looks precisely like this:


    ![](img/bf8dbdfb89042fadbaa73b4160c74bac_173_1.png)


    +   6. As you add the component elements in **XAML** view, they appear in the
    **Design** view until it looks like this:


    ![](img/bf8dbdfb89042fadbaa73b4160c74bac_173_2.png)


    ![](img/bf8dbdfb89042fadbaa73b4160c74bac_173_3.png)


    The x: prefix before the **Name** attribute refers to the XAML schema used by
    UWP apps.


    ![](img/bf8dbdfb89042fadbaa73b4160c74bac_173_4.png)


    The outer **<StackPanel>** is a horizontal layout containing an **<Image>** and
    a nested **<StackPanel>**. The nested **<StackPanel>** is a vertical layout containing
    two further **<StackPanel>** elements that each display their components horizontally.'
  merge: -1
  img_proc: true
