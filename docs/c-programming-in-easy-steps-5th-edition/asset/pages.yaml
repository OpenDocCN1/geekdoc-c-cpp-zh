  md: '# Installing a compiler


    C++ programs are initially created as plain text files, saved with the file extension
    of “.cpp”. These can be written in any text editor, such as Windows’ Notepad application
    or the Vi editor on Linux.


    In order to execute a C++ program, it must first be “compiled” into byte code
    that can be understood by the computer. A C++ compiler reads the text version
    of the program and translates it into a second file – in machine-readable, executable
    format.


    Should the text program contain any syntax errors, these will be reported by the
    compiler and the executable file will not be built.


    If you are using the Windows platform and have a C++ Integrated Development Environment
    (IDE) installed, then you will already have a C++ compiler available, as the compiler
    is an integral part of the Visual IDE. The excellent, free Microsoft Visual C++
    Express IDE provides an editor window, where the program code can be written,
    and buttons to compile and execute the program. Visual IDEs can, however, seem
    unwieldy when starting out with C++ because they always create a large number
    of “project” files that are used by advanced programs.


    The popular GNU C++ Compiler is available free under the terms of the General
    Public License (GPL). It is included with most distributions of the Linux operating
    system. The GNU C++ Compiler is also available for Windows platforms and is used
    to compile examples throughout this book.


    To discover if you already have the GNU C++ Compiler on your system, type **c++
    -v** at a command prompt with her Return. If it’s available, the compiler will
    respond with version information. If you are using the Linux platform and the
    GNU C++ Compiler is not available on your computer, install it from the distribution
    disc, download it from the GNU website, or ask your system administrator to install
    it.


    The GNU (pronounced “guh-new”) Project was launched back in 1984 to develop a
    complete free Unix-like operating system. Part of GNU is “Minimalist GNU for Windows”
    (MinGW). MinGW includes the GNU C++ Compiler that can be used on Windows systems
    to create executable C++ programs. Windows users can download and install the
    GNU C++ Compiler by following the instructions below.


    ![](img/bf8dbdfb89042fadbaa73b4160c74bac_9_0.png)


    The terms and conditions of the General Public License can be found online at
    [gnu.org/copyleft/gpl.html](gnu.org/copyleft/gpl.html)


    +   1. With an internet connection open, launch a web browser then navigate to
    [sourceforge.net/projects/mingw](sourceforge.net/projects/mingw) and click the
    **Download** button to get the MinGW installer.


    ![](img/bf8dbdfb89042fadbaa73b4160c74bac_9_1.png)


    +   2. Launch the installer and accept the suggested location of **C:\MinGW**
    in the “Installation Manager” dialog.


    +   3. Choose the base and C++ compiler items, then click Installation, Apply
    Changes to complete the installation.'
