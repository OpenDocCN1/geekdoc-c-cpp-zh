  md: "# Predicting problems\n\nDespite the best efforts of the programmer, C++ programs\
    \ may unfortunately contain one, or more, of these three types of bugs:\n\n+ \
    \  - **Syntax errors** – the code contains incorrect use of the C++ language.\
    \ For example, an opening brace does not have a matching closing brace.\n+   -\
    \ **Logic errors** – the code is syntactically correct, but attempts to perform\
    \ an operation that is illegal. For example, the program may attempt to divide\
    \ a number by zero, causing an error.\n+   - **Exception errors** – the program\
    \ runs as expected until an exceptional condition is encountered that crashes\
    \ the program. For example, the program may request a number, which the user enters\
    \ in word form rather than in numeric form.\n\n![](img/bf8dbdfb89042fadbaa73b4160c74bac_89_0.png)\n\
    \nThe C++ standards allow the compiler to spot “compile-time” errors involving\
    \ syntax and logic, but the possibility of exceptional errors is more difficult\
    \ to locate as they only occur at “run-time”. This means that the programmer must\
    \ try to predict problems that may arise and prepare to handle those exceptional\
    \ errors.\n\nThe first step is to identify which part of the program code that\
    \ may, under certain conditions, cause an exception error. This can then be surrounded\
    \ by a “try” block, which uses the **try** keyword and encloses the suspect code\
    \ within a pair of braces.\n\n![](img/bf8dbdfb89042fadbaa73b4160c74bac_89_1.png)\n\
    \nAlways consider that the user will perform the unexpected – then ensure your\
    \ programs can handle those actions.\n\nWhen an exception error occurs, the **try**\
    \ block then “throws” the exception out to a “catch” block, which immediately\
    \ follows the **try** block. This uses the **catch** keyword and encloses statements\
    \ to handle the exception error within a pair of braces.\n\nThe program described\
    \ below has a **try** block containing a loop that increments an integer. When\
    \ the integer reaches five, a **throw()** function manually throws an exception\
    \ to the **catch** block exception handler, passing the integer argument.\n\n\
    ![](img/bf8dbdfb89042fadbaa73b4160c74bac_89_2.png)\n\n+   1. Start a new program\
    \ by specifying the C++ library classes to include, and a namespace prefix to\
    \ use.\n+   \n+      ```cpp\n+      #include <iostream>\n+      using namespace\
    \ std;\n+      ```\n+   \n+   2. Add a main function containing a final **return**\
    \ statement and declaring an integer variable for increment by a loop.\n+   \n\
    +      ```cpp\n+      int main()\n+      {\n+          int number;\n+        \
    \  // Add more statements here.\n+          return 0;\n+      }\n+      ```"
