- pgno: 159
  md: "# # Guarding inclusions\n\nTypically, a C++ program will have many **.h** header\
    \ files and a single **.cpp** implementation file containing the main program.\
    \ Header files may often contain one or more **#include** directives to make other\
    \ classes or functions available from other header files, and can cause duplication\
    \ where definitions appear in two files. For example, where a header file includes\
    \ another header file containing a function definition, the compiler will consider\
    \ that definition to appear in each file -- so compilation will fail.\n\nThe popular\
    \ solution to this problem of re-definition employs preprocessor directives to\
    \ ensure the compiler will only be exposed to a single definition. These are known\
    \ as “inclusion guards” and create a unique macro name for each header file. Traditionally,\
    \ the name is an uppercase version of the file name, with the dot changed to an\
    \ underscore. For example, **RUM_H** for a file **rum.h**.\n\n![](img/bf8dbdfb89042fadbaa73b4160c74bac_159_0.png)\n\
    \nInclusion guards are also known as “macro guards” or simply as “include guards”.\n\
    \nIn creating a macro to guard against duplication, an **#ifndef** directive first\
    \ tests to see if the definition has already been made by another header file\
    \ included in the same program. If the definition already exists, the compiler\
    \ ignores the duplicate definition, otherwise a **#define** directive will permit\
    \ the compiler to use the definition in that header file:\n\n![](img/bf8dbdfb89042fadbaa73b4160c74bac_159_1.png)\n\
    \nadd.h\n\n![](img/bf8dbdfb89042fadbaa73b4160c74bac_159_2.png)\n\ntriple.h\n\n\
    ![](img/bf8dbdfb89042fadbaa73b4160c74bac_159_3.png)\n\nguard.cpp\n\n+   1. Create\
    \ a header file named “add.h” containing the inline declaration of an “add” function\n\
    +   \n+      ```cpp\n+      inline int add ( int x, int y ) { return ( x + y )\
    \ ; }\n+      ```\n+   \n+   2. Now, create a header file named “triple.h” containing\
    \ a processor directive to make the add function available for use in the inline\
    \ declaration of a “triple” function\n+   \n+      ```cpp\n+      #include “add.h”\n\
    +   \n+      inline int triple ( x ) { return add( x, add( x, x ) ) ; }\n+   \
    \   ```\n+   \n+   3. Start a new program with preprocessor directives to make\
    \ both the add and triple functions available\n+   \n+      ```cpp\n+      #include\
    \ “add.h”\n+      #include “triple.h”\n+      ```\n+   \n+   4. Specify the library\
    \ classes to include and the namespace\n+   \n+      ```cpp\n+      #include <iostream>\n\
    +      using namespace std ;\n+      ```"
  merge: -1
  img_proc: true
- pgno: 160
  md: "+   5. Add a main function containing statements that call both the **add()**\
    \ and **triple()** functions from the included headers\n\n```\n```cpp\nint main()\n\
    {\n    cout << \"9 + 3 = \" << add(9, 3) << endl ;\n    cout << \"9 x 3 = \" <<\
    \ triple(9) << endl ;\n    return 0 ;\n}\n```\n```\n\n+   6. Save the files, then\
    \ attempt to compile the program to see compilation fail because the add function\
    \ appears to be defined twice – in “add.h” and by inclusion in “triple.h”\n\n\
    ![](img/bf8dbdfb89042fadbaa73b4160c74bac_160_0.png)\n\n+   7. Edit the header\
    \ file “add.h” to enclose the inline function declaration within a preprocessor\
    \ inclusion guard\n\n```\n```cpp\n#ifndef ADD_H\n#define ADD_H\n\ninline int add\
    \ ( int x, int y ) { return ( x + y ) ; }\n\n#endif\n```\n```\n\n+   8. Save the\
    \ modified file, then compile and run the program – compilation now succeeds because\
    \ the inclusion guard prevents the apparent re-definition of the add function\n\
    \n![](img/bf8dbdfb89042fadbaa73b4160c74bac_160_1.png)\n\n![](img/bf8dbdfb89042fadbaa73b4160c74bac_160_2.png)\n\
    \nUse the conventional naming scheme, where the macro name resembles the file\
    \ name, to avoid conflicts.\n\n![](img/bf8dbdfb89042fadbaa73b4160c74bac_160_3.png)\n\
    \nAll header files should contain header guards – add a **TRIPLE_H** macro to\
    \ the triple.h file."
