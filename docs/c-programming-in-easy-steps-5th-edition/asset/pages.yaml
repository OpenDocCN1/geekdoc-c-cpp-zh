  md: '# Creating variables


    A “variable” is like a container in a C++ program in which a data value can be
    stored inside the computer’s memory. The stored value can be referenced using
    the variable’s name.


    ![](img/bf8dbdfb89042fadbaa73b4160c74bac_15_0.png)


    The programmer can choose any name for a variable, providing it adheres to the
    C++ naming conventions – a chosen name may only contain letters, digits, and the
    underscore character, but cannot begin with a digit. Also, the C++ keywords, listed
    on the inside cover of this book must be avoided. It’s good practice to choose
    meaningful names to make the code more comprehensible.


    To create a new variable in a program it must be “declared”, specifying the type
    of data it may contain and its chosen name. A variable declaration has this syntax:


    ```

    **data-type variable-name** ;

    ```


    ![](img/bf8dbdfb89042fadbaa73b4160c74bac_15_1.png)


    Names are case-sensitive in C++ – so variables named VAR, Var, and var are treated
    as three individual variables. Traditionally, C++ variable names are lowercase
    and seldom begin with an underscore, as some C++ libraries use that convention.


    Multiple variables of the same data type can be created in a single declaration
    as a comma-separated list with this syntax:


    ```

    **data-type variable-name1 , variable-name2 , variable-name3** ;

    ```


    The five basic C++ data types are listed in the table below, together with a brief
    description and example content:


    | Data Type: | Description: | Example: |

    |---|---|---|

    | char | A single byte, capable of holding one character | ‘A’ |

    | int | An integer whole number | 100 |

    | float | A floating-point number, correct to six decimal places | 0.123456 |

    | double | A floating-point number, correct to 10 decimal places | 0.0123456789
    |

    | bool | A Boolean value of true or false, or numerically zero is false and any
    non-zero is true | false or 0; true or 1 |


    ![](img/bf8dbdfb89042fadbaa73b4160c74bac_15_2.png)


    Character values of the char data type must always be enclosed between single
    quotes – not double quotes.


    Variable declarations must appear before executable statements – so they will
    be available for'
