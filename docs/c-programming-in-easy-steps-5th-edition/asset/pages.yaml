  md: "# Passing pointers to functions\n\nPointers can access the data stored in the\
    \ variable to which they point using the * dereference operator. This can also\
    \ be used to change the stored data by assigning a new value of the appropriate\
    \ data type.\n\nAdditionally, pointers can be passed to functions as arguments\
    \ – with a subtly different effect to passing variables as arguments:\n\n+   -\
    \ When variables are passed to functions, their data is passed “by value” to a\
    \ local variable inside the function – so that the function operates on a copy\
    \ of the original value.\n+   - When pointers are passed to functions, their data\
    \ is passed “by reference” – so that the function operates on the **original**\
    \ value.\n\nThe benefit of passing by reference allows functions to directly manipulate\
    \ variable values declared within the calling function.\n\n![](img/bf8dbdfb89042fadbaa73b4160c74bac_103_0.png)\n\
    \nfnptr.cpp\n\n+   1. Start a new program by specifying the C++ library classes\
    \ to include, and a namespace prefix to use.\n+   \n+   ```cpp\n+   #include <iostream>\n\
    +   using namespace std ;\n+   ```\n\n+   2. After the preprocessor instructions,\
    \ declare two function prototypes to each accept a single pointer argument.\n\
    +   \n+   ```cpp\n+   void writeOutput( int* );\n+   void computeTriple( int*\
    \ );\n+   ```\n\n+   3. Add a main function containing a final **return** statement\
    \ and declaring an initialized regular integer variable.\n+   \n+   ```cpp\n+\
    \   int main()\n+   {\n+       int num = 5 ;\n+       // Add more statements here.\n\
    +       return 0 ;\n+   }\n+   ```\n\n+   4. In the main function, insert a second\
    \ variable declaration that initializes a pointer with the address of the regular\
    \ integer variable.\n+   \n+   ```cpp\n+   int* ptr = &num ;\n+   ```\n\n+   5.\
    \ After the main function block, define a function to output the current value\
    \ of a variable to which a pointer points.\n+   \n+   ```cpp\n+   void writeOutput(\
    \ int* value )\n+   {\n+       cout << \"Current value: \" << *value << endl ;\n\
    +   }\n+   ```\n\n+   6. Define another function to multiply the current value\
    \ of a variable to which a pointer points.\n+   \n+   ```cpp\n+   void computeTriple(\
    \ int* value )\n+   {\n+       *value *= 3 ;   // Multiply and assign dereferenced\
    \ value.\n+   }\n+   ```\n\n+   7. In the main function, pass a pointer argument\
    \ to a function to output the variable value to which it points.\n+   \n+   ```cpp\n\
    +   writeOutput( ptr );\n+   ```"
