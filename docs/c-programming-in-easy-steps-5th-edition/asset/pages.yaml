  md: '# # Recognizing exceptions


    When a program exception occurs within a **try** block, an "exception" object
    is automatically thrown. A reference to the exception can be passed to the associated
    **catch** block in the parentheses after the **catch** keyword. This specifies
    the argument to be an **exception** type, and a chosen exception name prefixed
    by the & reference operator. For example, **exception &error**.


    ![](img/bf8dbdfb89042fadbaa73b4160c74bac_91_0.png)


    More on references in the next chapter.


    Once an exception reference is passed to a **catch** block, an error description
    can be retrieved by the exception''s **what()** function:


    ![](img/bf8dbdfb89042fadbaa73b4160c74bac_91_1.png)


    +   1. Start a new program by specifying the C++ library classes to include, and
    a namespace prefix to use

    +       ```cpp

    +       #include <string>    // Include string support.

    +       #include <iostream>

    +       using namespace std;

    +       ```

    +   2. Add a main function containing a final **return** statement and declaring
    an initialized **string** variable

    +       ```cpp

    +       int main()

    +       {

    +           string lang = "C++";

    +           // Add more statements here.

    +           return 0;

    +       }

    +       ```

    +   3. In the main function, insert a **try** block containing a statement attempting
    to erase part of the **string** variable

    +       ```cpp

    +       try { lang.erase( 4, 6 ); }

    +       ```

    +   4. Next, insert a **catch** block containing a statement to send a description
    to standard error output by the **cerr** function

    +       ```cpp

    +       catch ( exception &error )

    +       { cerr << "Exception: " << error.what() << endl ; }

    +       ```

    +   5. Save, compile, and run the program to see the error description of the
    caught exception

    +       ![Command Prompt screenshot](image_3)


    ![](img/bf8dbdfb89042fadbaa73b4160c74bac_91_3.png)


    The error description will vary for different compilers – the Visual C++ compiler
    describes the exception error in this example as an "invalid string position".


    The C++ **<stdexcept>** library defines a number of exception classes. Its base
    class is named'
