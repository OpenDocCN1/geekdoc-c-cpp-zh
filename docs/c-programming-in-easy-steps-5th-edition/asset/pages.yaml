  md: "# Initializing class members\n\nClass variable members can be initialized by\
    \ a special “constructor” method that is called whenever an instance of the class\
    \ is created. The constructor method is always named exactly as the class name,\
    \ and requires arguments to set the initial value of class variables.\n\nWhen\
    \ a constructor method is declared, an associated “destructor” method should also\
    \ be declared – that is called whenever an instance of the class is destroyed.\
    \ The destructor method is always named as the class name, prefixed by a ~ tilde\
    \ character.\n\nConstructor and destructor methods have no return value, and are\
    \ called automatically – they cannot be called explicitly.\n\nValues to initialize\
    \ class variables are passed to the constructor method in the statement creating\
    \ an object, in parentheses following the object name.\n\n![](img/bf8dbdfb89042fadbaa73b4160c74bac_121_0.png)\n\
    \n+   1. Rename a copy of the previous example “multiple.cpp” as a new program\
    \ “constructor.cpp”\n+   2. In the public section of the Dog class declaration,\
    \ replace the setValues method prototype with this constructor prototype\n+  \
    \    ```cpp\n+      Dog( int, int, string );\n+      ```\n+   3. Now, add an associated\
    \ destructor prototype\n+      ```cpp\n+      ~Dog();\n+      ```\n+   4. After\
    \ the Dog class declaration, replace the setValues definition block with a constructor\
    \ definition block\n+      ```cpp\n+      Dog::Dog( int age, int weight, string\
    \ color )\n+      {\n+   \n+      }\n+      ```\n+   5. In the constructor definition\
    \ block, insert three statements to assign values from passed arguments to class\
    \ variables\n+      ```cpp\n+      this -> age = age ;\n+      this -> weight\
    \ = weight ;\n+      this -> color = color ;\n+      ```\n\n![](img/bf8dbdfb89042fadbaa73b4160c74bac_121_1.png)\n\
    \nThe definition of a class method is also known as the method “implementation”.\n\
    \n+   6. After the constructor definition, add a destructor definition block\n\
    +      ```cpp\n+      Dog::~Dog()\n+      {\n+   \n+      }\n+      ```\n+   7.\
    \ In the destructor definition, insert a statement to output a confirmation whenever\
    \ an instance object gets destroyed\n+      ```cpp\n+      cout << “Object destroyed.”\
    \ << endl ;\n+      ```\n+   8. In the main method, edit the statement creating\
    \ the “fido” object – to pass values to its constructor method\n+      ```cpp\n\
    +      Dog fido( 3, 15, “brown” ) ;\n+      ```"
