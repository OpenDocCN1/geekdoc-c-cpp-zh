  md: "# Joining & comparing strings\n\nWhen the **+** operator is used to concatenate\
    \ strings in an assignment, the combined strings get stored in the **string**\
    \ variable. But when it is used with the **cout** function, the strings are only\
    \ combined in the output – the variable values are unchanged.\n\nThe **<string>**\
    \ library’s **append()** function can also be used to concatenate strings, specifying\
    \ the **string** value to append as an argument within its parentheses. When this\
    \ is used with the **cout** function, the strings are combined in the variable,\
    \ then its value written as output – in this case, the variable value does change.\n\
    \nString comparisons can be made, in the same way as numeric comparisons, with\
    \ the **==** equality operator. This returns **true** (1) when both strings precisely\
    \ match, otherwise it returns **false** (0).\n\nAlternatively, the **<string>**\
    \ library’s **compare()** function can be used to compare a **string** value specified\
    \ as its argument. Unlike the **==** equality comparison, the **compare()** function\
    \ returns zero when the strings are identical, by examining the **string** value’s\
    \ combined ASCII code values. When the **string** argument totals more than the\
    \ first string, it returns -1, otherwise it returns 1.\n\n![](img/bf8dbdfb89042fadbaa73b4160c74bac_69_0.png)\n\
    \n+   1. Start a new program by specifying the C++ library classes to include,\
    \ and a namespace prefix to use\n+   \n+   ```cpp\n+   #include <string>     \
    \  // Include string support.\n+   #include <iostream>\n+   using namespace std;\n\
    +   ```\n\n+   2. Add a main function containing a final **return** statement\
    \ and declaring three initialized string variables\n+   \n+   ```cpp\n+   int\
    \ main()\n+   {\n+       string lang = \"C++\";\n+       string term = \"Programming\"\
    ;\n+       string text = \"C++ Programming\";\n+       // Add more statements\
    \ here.\n+       return 0;\n+   }\n+   ```\n\n+   3. In the main function, insert\
    \ statements to output two **string** values combined with the **+** concatenate\
    \ operator and the (unchanged) value of the first variable\n+   \n+   ```cpp\n\
    +   cout << \"Concatenated: \" << (lang + term) << endl;\n+   cout << \"Original:\
    \ \" << lang << endl;\n+   ```\n\n+   4. Next, insert statements to output two\
    \ **string** values combined with the **append()** function and the (changed)\
    \ value of the first variable\n+   \n+   ```cpp\n+   cout << \"Appended: \" <<\
    \ lang.append(term) << endl;\n+   cout << \"Original: \" << lang << endl;\n+ \
    \  ```\n\n+   5. Use the **==** equality operator to compare two **string** values\
    \ that differ, then two **string** values that match\n+   \n+   ```cpp\n+   cout\
    \ << \"Differ: \" << (lang == term) << endl;\n+   cout << \"Match: \" << (lang\
    \ == text) << endl << endl;\n+   ```\n\n+   6. Now, use the **compare()** function\
    \ to compare three **string** values, examining their ASCII code total values\n\
    +   \n+   ```cpp\n+   cout << \"Match: \" << lang.compare(text) << endl;\n+  \
    \ cout << \"Differ: \" << lang.compare(term) << endl;\n+   cout << \"Lower ASCII:\
    \ \" << lang.compare(\"zzzz\") << endl;\n+   ```"
