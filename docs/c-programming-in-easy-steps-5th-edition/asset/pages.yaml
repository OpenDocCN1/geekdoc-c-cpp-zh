  md: "# Making arrays of pointers\n\nA variable of the regular **char** data type\
    \ can be assigned a single character value, but a pointer to a constant **char**\
    \ array can usefully be assigned a string of characters. The string is actually\
    \ stored as an array of characters, with one character per element, but referencing\
    \ the **char** pointer will automatically retrieve the entire string.\n\nThis\
    \ ability to retrieve a string value from a **char** pointer using just its variable\
    \ name resembles the way that a string can be retrieved from a regular **char**\
    \ array using its variable name.\n\nMultiple strings can be stored in a constant\
    \ **char** pointer array, with one string per element. You can even store multiple\
    \ **char** pointer arrays in a “master” **char** pointer array -- one array per\
    \ element.\n\n![](img/bf8dbdfb89042fadbaa73b4160c74bac_105_0.png)\n\n+   1. Start\
    \ a new program by specifying the C++ library classes to include, and a namespace\
    \ prefix to use.\n+   \n+   ```cpp\n+   #include <iostream>\n+   using namespace\
    \ std;\n+   ```\n\n+   2. Add a main function containing a final **return** statement\
    \ and declaring two initialized variables -- a regular character array, and a\
    \ character pointer with identical **string** values.\n+   \n+   ```cpp\n+   int\
    \ main()\n+   {\n+       char letters[8] = {'C', '+', '+', ' ', 'F', 'u', 'n',\
    \ '\\0'};\n+       const char* text = \"C++ Fun\";\n+       // Add more statements\
    \ here.\n+       return 0;\n+   }\n+   ```\n\n+   3. In the main function, insert\
    \ statements to declare, and initialize two further character pointer variables,\
    \ with unique **string** values.\n+   \n+   ```cpp\n+   const char* term = \"\
    Element\";\n+   const char* lang = \"C++\";\n+   ```\n\n+   4. Next, insert a\
    \ statement to declare a character pointer array, initialized with three **string**\
    \ values.\n+   \n+   ```cpp\n+   const char* ap1[3] = {\"Great\", \"Program\"\
    , \"Code\"};\n+   ```\n\n![](img/bf8dbdfb89042fadbaa73b4160c74bac_105_1.png)\n\
    \nCharacter values must be enclosed in single quotes, but string values must be\
    \ enclosed in double quotes -- even when they are being assigned to a **char**\
    \ pointer.\n\n+   5. Now, insert a statement to declare a second character pointer\
    \ array, initialized with three string values -- making one of the pointer variables\
    \ its first element value.\n+   \n+   ```cpp\n+   const char* ap2[3] = {lang,\
    \ \"is\", \"Fun\"};\n+   ```\n\n+   6. Declare two “master” character pointer\
    \ arrays, each initialized with three elements of the **char** pointer arrays.\n\
    +   \n+   ```cpp\n+   const char* ap3[3] = {ap2[0], ap2[1], ap1[0]};\n+   const\
    \ char* ap4[3] = {ap1[2], ap2[1], ap2[2]};\n+   ```\n\n+   7. After the declarations,\
    \ insert statements to output the identical **string** values of the first two\
    \ variables."
