  md: "# Solving the string problem\n\nA problem arises with **string** variables\
    \ when you need to convert them to a different data type, perhaps to perform arithmetical\
    \ operations with those values. As the **string** object is not a native C++ data\
    \ type a **string** variable value cannot be converted to an **int** or any other\
    \ regular data type by casting.\n\nThe solution is provided by the C++ **<sstream>**\
    \ library that allows a **stringstream** object to act as an intermediary, through\
    \ which **string** values can be converted to a numeric data type, and numeric\
    \ values can be converted to a **string** data type. To make this ability available\
    \ to a program, the library must be added with an **#include <sstream>** directive\
    \ at the start of the program.\n\nValues can be loaded into a **stringstream**\
    \ object with the familiar output stream **<<** operator that is used with **cout**\
    \ statements. Contents can then be extracted from a **stringstream** object with\
    \ the **>>** input stream operator that is used with **cin** statements.\n\nIn\
    \ order to re-use a **stringstream** object, it must first be returned to its\
    \ original state. This requires its contents to be set as an empty **string**\
    \ and its bit flags to be cleared.\n\n![](img/bf8dbdfb89042fadbaa73b4160c74bac_65_0.png)\n\
    \n+   1. Start a new program by specifying the C++ library classes to include,\
    \ and a namespace prefix to use\n\n```\n```cpp\n#include <string>      // Include\
    \ string support.\n#include <sstream>      // Include stringstream support.\n\
    #include <iostream>\nusing namespace std;\n```\n```\n\n+   2. Add a main function\
    \ containing a final **return** statement and declaring two initialized variables\
    \ to be converted\n\n```\n```cpp\nint main()\n{\n    string term = \"100\";\n\
    \    int number = 100;\n    // Add more statements here.\n    return 0;\n}\n```\n\
    ```\n\n+   3. In the main function, insert statements to declare an integer variable,\
    \ **string** variable, and a **stringstream** object\n\n```\n```cpp\nint num;\
    \              // To store a converted string.\nstring text;          // To store\
    \ a converted integer.\nstringstream stream;  // To perform conversions.\n```\n\
    ```\n\n+   4. Next, use the stream output operator to load the initialized **string**\
    \ value into the **stringstream** object\n\n```\n```cpp\nstream << term;     \
    \ // Load the string.\n```\n```\n\n+   5. Use the stream input operator to extract\
    \ content from the **stringstream** object into the uninitialized integer variable\n\
    \n```\n```cpp\nstream >> num;       // Extract the integer.\n```\n```\n\n+   6.\
    \ Perform arithmetic on the integer and output the result\n\n```\n```cpp\nnum\
    \ /= 4;\ncout << \"Integer value: \" << num << endl;\n```\n```\n\n+   7. Reset\
    \ the **stringstream** object ready for re-use\n\n```\n```cpp\nstream.str(\"\"\
    );      // Empty the contents.\nstream.clear();       // Empty the bit flags.\n\
    ```\n```"
