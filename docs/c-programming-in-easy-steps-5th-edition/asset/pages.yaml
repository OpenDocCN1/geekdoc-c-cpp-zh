  md: "# Why choose this book?\n\n**It's written in plain English**  \nPut off by\
    \ the jargon? Don't worry, we keep things straightforward.\n\n**It's easy to follow**\
    \  \nClear, step-by-step instructions make learning simple.\n\n**It's fully illustrated**\
    \  \nWe don't just tell you how to do it, we also show you how.\n\n**It's in full\
    \ color**  \nThis book's printed in color to make it simple to use and easier\
    \ on the eye.\n\n**And it's fantastic value**  \nDo we need to say any more?\n\
    \nC++ Programming in easy steps, now in its 5th edition, will appeal to anyone\
    \ getting started with C++. It begins by showing you how to install a free C++\
    \ compiler, and then gives complete examples that illustrate each aspect of C++\
    \ with colorized source code. Download this code and start creating your C++ programs\
    \ straight away in easy steps:\n\n+   - Master C++ basics, including creating\
    \ and employing variables, declaring constants, doing arithmetic, making conditional\
    \ statements, using text strings, and storing and retrieving data.\n+   - Grasp\
    \ the key principles of Object Oriented Programming (OOP).\n+   - Bring it all\
    \ together, and build a complete C++ application in a visual programming environment.\n\
    \nLearn C++ Programming efficiently, effectively and economically—that's smart\
    \ learning!\n\n![](img/bf8dbdfb89042fadbaa73b4160c74bac_193_0.png)"
