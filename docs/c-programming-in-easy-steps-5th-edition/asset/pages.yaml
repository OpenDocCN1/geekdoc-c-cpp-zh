  md: "# # Reading characters & lines\n\nThe **ifstream** filestream object has a\
    \ **get()** function that can be used in a loop to read a file and assign each\
    \ character in turn to the **char** variable specified as its argument:\n\n![](img/bf8dbdfb89042fadbaa73b4160c74bac_83_0.png)\n\
    \n+   1. Start a new program by specifying the C++ library classes to include,\
    \ and a namespace prefix to use\n\n```\n~~~cpp\n#include <fstream>     // Include\
    \ filestream support.\n#include <iostream>\nusing namespace std ;\n~~~\n```\n\n\
    +   2. Add a main function containing a final **return** statement and two variable\
    \ declarations – one variable to store a character and another to count loop iterations\n\
    \n```\n~~~cpp\nint main()\n{\n  char letter ;\n  int i ;\n  // Add more statements\
    \ here.\n  return 0 ;\n}\n~~~\n```\n\n+   3. In the main function, create an input\
    \ filestream object to read the text file from the previous example\n\n```\n~~~cpp\n\
    ifstream reader( \"poem.txt\" ) ;\n~~~\n```\n\n+   4. Insert statements to exit\
    \ unless the filestream object exists\n\n```\n~~~cpp\nif ( ! reader )\n{\n  cout\
    \ << \"Error opening input file\" << endl ;\n  return -1 ;    // Signal an error\
    \ then exit the program.\n}\n~~~\n```\n\n+   5. Next, insert a loop to read the\
    \ text file, assigning each character in turn to the variable and outputting its\
    \ value\n\n```\n~~~cpp\nelse\nfor ( i = 0 ; ! reader.eof() ; i++ )\n{\n  reader.get(\
    \ letter ) ;\n  cout << letter ;\n}\n~~~\n```\n\n+   6. Finally, insert statements\
    \ to close the filestream and output the total number of loop iterations\n\n```\n\
    ~~~cpp\nreader.close() ;\ncout << \"Iterations: \" << i << endl ;\n~~~\n```\n\n\
    ![](img/bf8dbdfb89042fadbaa73b4160c74bac_83_1.png)\n\nNotice how the ifstream\
    \ eof() function is used to check if the “end of file” has been reached.\n\n+\
