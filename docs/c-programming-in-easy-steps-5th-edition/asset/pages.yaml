  md: "# Comparing values\n\nThe operators that are commonly used in C++ programming\
    \ to compare two numerical values are listed in the table below:\n\n| Operator:\
    \ | Comparative test: |\n|---|---|\n| `==` | Equality |\n| `!=` | Inequality |\n\
    | `>` | Greater than |\n| `<` | Less than |\n| `>=` | Greater than or equal to\
    \ |\n| `<=` | Less than or equal to |\n\nThe **==** equality operator compares\
    \ two operands and will return **true (1)** if both are equal in value, otherwise\
    \ it will return a **false (0)** value. If both are the same number, they are\
    \ equal, or if both are characters, their ASCII code values are compared numerically.\
    \ Conversely, the **!=** inequality operator returns **true (1)** if two operands\
    \ are not equal, using the same rules as the **==** equality operator, otherwise\
    \ it returns **false (0)**. Equality and inequality operators are useful in testing\
    \ the state of two variables to perform conditional branching in a program.\n\n\
    ![](img/bf8dbdfb89042fadbaa73b4160c74bac_29_0.png)\n\nA-Z uppercase characters\
    \ have ASCII code values 65-90 and a-z lowercase characters have ASCII code values\
    \ 97-122.\n\nThe **>** “greater than” operator compares two operands and will\
    \ return **true (1)** if the first is greater in value than the second, or it\
    \ will return **false (0)** if it is equal or less in value. The **<** “less than”\
    \ operator makes the same comparison but returns **true (1)** if the first operand\
    \ is less in value than the second, otherwise it returns **false (0)**. A “greater\
    \ than” or “less than” operator is often used to test the value of an iteration\
    \ counter in a loop.\n\nAdding the **=** operator after a **>** “greater than”\
    \ or **<** “less than” operator makes it also return **true (1)** if the two operands\
    \ are exactly equal in value.\n\nEach comparison operation is demonstrated in\
    \ the program below.\n\n```\ncomparison.cpp\n```\n\n+   1. Start a new program\
    \ by specifying the C++ library classes to include and a namespace prefix to use\n\
    +   \n+      ```cpp\n+      #include <iostream>\n+      using namespace std;\n\
    +      ```\n+   \n+   2. Add a main function containing a final **return** statement\n\
    +   \n+      ```cpp\n+      int main()\n+      {\n+          // Program code goes\
    \ here.\n+          return 0;\n+      }\n+      ```"
