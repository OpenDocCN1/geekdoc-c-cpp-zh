  md: "# Overriding base methods\n\nA method can be declared in a derived class to\
    \ override a matching method in the base class – if both method declarations have\
    \ the same name, arguments, and return type. This effectively hides the base class\
    \ method as it becomes inaccessible unless it is called explicitly, using the\
    \ :: scope resolution operator for precise identification.\n\nThe technique of\
    \ overriding base class methods must be used with care, however, to avoid unintentionally\
    \ hiding overloaded methods – a single overriding method in a derived class will\
    \ hide all overloaded methods of that name in the base class!\n\n![](img/bf8dbdfb89042fadbaa73b4160c74bac_129_0.png)\n\
    \noverride.cpp\n\n+   1. Start a new program by specifying the C++ library classes\
    \ to include, and a namespace prefix to use.\n+   \n+   ```cpp\n+   #include <string>\n\
    +   #include <iostream>\n+   using namespace std ;\n+   ```\n\n+   2. Declare\
    \ a class named “Man”, which will be a base class.\n+   \n+   ```cpp\n+   class\
    \ Man\n+   {\n+       // Class members go here.\n+   };\n+   ```\n\n+   3. Between\
    \ the braces of the Man class declaration, insert a public access specifier and\
    \ an inline output method.\n+   \n+   ```cpp\n+   public:\n+       void speak()\
    \ { cout << “Hello! ” << endl ; }\n+   ```\n\n+   4. Now, insert an overloaded\
    \ inline output method.\n+   \n+   ```cpp\n+   void speak( string msg )\n+   \
    \    { cout << “ ” << msg << endl ; }\n+   ```\n\n+   5. After the Man class declaration,\
    \ declare a class named “Hombre” that is derived from the Man class.\n+   \n+\
    \   ```cpp\n+   class Hombre : public Man\n+   {\n+       // Class members go\
    \ here.\n+   };\n+   ```\n\n![](img/bf8dbdfb89042fadbaa73b4160c74bac_129_1.png)\n\
    \nThe method declaration in the derived class must exactly match that in the base\
    \ class to override it – including the const keyword if it is used.\n\n+   6.\
    \ Between the braces of the Hombre class declaration, insert an access specifier\
    \ and a method that overrides the overloaded base class method – without a tab\
    \ output.\n+   \n+   ```cpp\n+   public:\n+       void speak( string msg ) { cout\
    \ << msg << endl ; }\n+   ```\n\n+   7. After the Hombre class declaration, add\
    \ a main method containing a final **return** statement and creating two objects\
    \ – an instance of the base class and an instance of the derived class.\n+   \n\
    +   ```cpp\n+   int main()\n+   {\n+   ```"
