  md: "# Finding substrings\n\nA string value can be searched to see if it contains\
    \ a specified “substring” using the **find()** function of the **<string>** library.\
    \ Its parentheses should specify the substring to seek as its first argument,\
    \ and the index number of the character at which to start searching as its second\
    \ argument.\n\nWhen a search successfully locates the specified substring, the\
    \ **find()** function returns the index number of the first occurrence of the\
    \ substring’s first character within the searched string. When the search fails,\
    \ **find()** returns a value of -1 to indicate failure.\n\nThere are several other\
    \ functions in the **<string>** library that are related to the **find()** function.\
    \ Two of these are the **find_first_of()** function and the **find_first_not_of()**\
    \ function. Instead of seeking the first occurrence of a complete **string**,\
    \ as **find()** does, the **find_first_of()** function seeks the first occurrence\
    \ of any of the characters in a specified **string**, and **find_first_not_of()**\
    \ seeks the first occurrence of a character that is not in the specified **string**.\n\
    \nThe **find_last_of()** and **find_last_not_of()** functions work in a similar\
    \ manner -- but begin searching at the end of the **string** then move forwards.\n\
    \n![](img/bf8dbdfb89042fadbaa73b4160c74bac_73_0.png)\n\n+   1. Start a new program\
    \ by specifying the C++ library classes to include, and a namespace prefix to\
    \ use\n+   \n+   ```cpp\n+   #include <string>       // Include string support.\n\
    +   #include <iostream>\n+   using namespace std ;\n+   ```\n\n+   2. Add a main\
    \ function containing a final return statement, an initialized string variable\
    \ declaration, and declaring an integer variable to store search results\n+  \
    \ \n+   ```cpp\n+   int main()\n+   {\n+       string text = \"I can resist anything\
    \ but temptation.\";\n+       int num ;\n+       // Add more statements here.\n\
    +       return 0 ;\n+   }\n+   ```\n\n+   3. In the main function, insert statements\
    \ to output the start position of a substring within the entire **string** variable\n\
    +   \n+   ```cpp\n+   num = text.find(\"resist\", 0) ;\n+   cout << \"Position:\
    \ \" << num << endl ;\n+   ```\n\n+   4. Next, insert a statement to seek a non-existent\
    \ substring within the entire **string** variable and output the result\n+   \n\
    +   ```cpp\n+   num = text.find(\"nonsuch\", 0) ;\n+   cout << \"Result: \" <<\
    \ num << endl ;\n+   ```\n\n+   5. Now, insert a statement to output the start\
    \ position of the first occurrence any characters of an “If ” substring found\
    \ within the entire **string** variable\n+   \n+   ```cpp\n+   num = text.find_first_of(\"\
    If\") ;\n+   cout << \"First :\" << num << endl ;\n+   ```\n\n+   6. Insert a\
    \ statement to report the string position of the first character not within the\
    \ “If ” substring\n+   \n+   ```cpp\n+   num = text.find_first_not_of(\"If\")\
    \ ;\n+   cout << \"First not :\" << num << endl ;\n+   ```\n\n+   7. Next, insert\
    \ a statement to seek the last occurrence of the letter “t” within the **string**\
    \ variable and output its position"
