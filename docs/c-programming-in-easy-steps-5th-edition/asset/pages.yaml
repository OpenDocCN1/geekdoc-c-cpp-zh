    \ pointer to output the sum of the variable values\n\n```\n```cpp\nptr = &sum\
    \ ;\ncout << \"Pointer now: \" << *ptr << endl ;\nfn(rNum, ptr) ;\n```\n```\n\n\
    +   6. Save, compile, and run the program to see the output\n\n![](img/bf8dbdfb89042fadbaa73b4160c74bac_112_0.png)\n\
    \n![](img/bf8dbdfb89042fadbaa73b4160c74bac_112_1.png)\n\nC programmers tend to\
    \ put the & and * characters before the variable names, but in C++ it is usual\
    \ to put them after the data type -- as the feature is a property of the data\
    \ type, not the name."
