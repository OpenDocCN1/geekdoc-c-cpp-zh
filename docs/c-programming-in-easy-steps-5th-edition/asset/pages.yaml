  md: "# Defining conditions\n\nThe preprocessor can make intelligent insertions to\
    \ program source code by using macro functions to perform conditional tests. An\
    \ **#ifdef** directive performs the most common preprocessor function by testing\
    \ to see if a specified macro has been defined. When the macro has been defined,\
    \ so the test returns true, the preprocessor will insert all directives, or statements,\
    \ on subsequent lines up to a corresponding **#endif** directive.\n\nConversely,\
    \ an **#ifndef** directive tests to see if a specified macro has not been defined.\
    \ When that test returns true, it will insert all directives, or statements, on\
    \ subsequent lines up to a corresponding **#endif** directive.\n\nTo satisfy either\
    \ conditional test, it should be noted that a **#define** directive need only\
    \ specify the macro name to define the identifier – it need not specify a value\
    \ to substitute.\n\nAny previously defined macro can be removed later using the\
    \ **#undef** directive – so that subsequent **#ifdef** conditional tests fail.\
    \ The macro can then be redefined by a further **#define** directive.\n\n![](img/bf8dbdfb89042fadbaa73b4160c74bac_155_0.png)\n\
    \n+   1. Start a new program with a conditional test to insert a directive when\
    \ a macro is not already defined\n+   \n+      ```cpp\n+      #ifndef BOOK\n+\
    \          #define BOOK \"C++ Programming in easy steps\"\n+      #endif\n+  \
    \    ```\n+   \n+   2. Specify the library classes to include, and the namespace\n\
    +   \n+      ```cpp\n+      #include <iostream>\n+      using namespace std ;\n\
    +      ```\n+   \n+   3. Add a main function containing a final **return** statement\n\
    +   \n+      ```cpp\n+      int main()\n+      {\n+          // Program code goes\
    \ here.\n+          return 0 ;\n+      }\n+      ```\n+   \n+   4. In the main\
    \ function, add a conditional preprocessor test to insert an output statement\
    \ when the test succeeds\n+   \n+      ```cpp\n+      #ifdef BOOK\n+         \
    \ cout << BOOK ;\n+      #endif\n+      ```\n+   \n+   5. Add another conditional\
    \ preprocessor test to both define a new macro and insert an output statement\
    \ when the test succeeds\n+   \n+      ```cpp\n+      #ifndef AUTHOR\n+      \
    \    #define AUTHOR \"Mike McGrath\"\n+          cout << \" by \" << AUTHOR <<\
    \ endl ;\n+      #endif\n+      ```\n+   \n+   6. Next, add a conditional test\
    \ to undefine a macro if it has already been defined\n+   \n+      ```cpp\n+ \
    \     #ifdef BOOK\n+          #undef BOOK\n+      #endif\n+      ```\n+   \n+\
    \   7. Now, add a conditional test to redefine a macro if it is no longer defined,\
    \ and to insert an output statement\n+   \n+      ```cpp\n+      #ifndef BOOK\n\
    +          #define BOOK \"Linux in easy steps\"\n+      ```"
