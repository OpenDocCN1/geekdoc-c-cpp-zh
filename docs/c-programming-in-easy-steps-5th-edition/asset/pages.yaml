  md: '# # Passing arguments


    Function calls frequently supply argument values to a function. These can be of
    any quantity and data type, but they must agree with those specified in the function
    prototype declaration.


    Note that arguments passed to a function only supply a copy of the original value,
    in a procedure known as “passing by value”.


    The values passed to arguments can be “static” values, specified in the program
    code, or “dynamic” values that are input by the user. At a command prompt, the
    C++ **cin** function can be used with the >> input stream operator to direct a
    value from standard input to a variable, like this:


    ```

    ```cpp

    float num ;

    cout << "Please enter a number: " ;

    cin >> num ;

    ```

    ```


    ![](img/bf8dbdfb89042fadbaa73b4160c74bac_53_0.png)


    Function prototypes must be declared before they can be defined. Typically, the
    prototypes appear before the main function and their definitions appear after
    the main function.


    Input can then be passed to a function as an argument in a function call, such
    as **workWith( num )**.


    Optionally, a function prototype can assign default values to arguments, which
    will be used when a call does not pass an argument value. Multiple arguments can
    be assigned default values in the prototype but these must always appear at the
    end of the argument list, after any other arguments.


    In the same way that functions can be called from the main function, functions
    may call other functions and pass arguments.


    ![](img/bf8dbdfb89042fadbaa73b4160c74bac_53_1.png)


    args.cpp


    +   1. Start a new program by specifying the C++ library classes to include, and
    a namespace prefix to use

    +      ```cpp

    +      #include <iostream>

    +      using namespace std ;

    +      ```

    +   2. Next, declare a function prototype that returns a float value and specifies
    a single float argument, to which a default value is assigned

    +      ```cpp

    +      float fToC ( float degreesF = 32.0 ) ;

    +      ```

    +   3. Add a main function containing a final return statement

    +      ```cpp

    +      int main()

    +      {

    +        // Program code goes here.

    +        return 0 ;

    +      }

    +      ```

    +   4. After the main function, define the “fToC” function with statements that
    will return a converted value

    +      ```cpp

    +      float fToC( float degreesF )

    +      {

    +        float degreesC = ( ( 5.0 / 9.0 ) * ( degreesF - 32.0 ) ) ;

    +        return degreesC ;

    +      }

    +      ```'
