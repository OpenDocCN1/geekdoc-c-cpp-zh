  md: "# # Providing capability classes\n\nClasses whose sole purpose is to allow\
    \ other classes to be derived from them are known as “capability classes” – they\
    \ provide capabilities to the derived classes.\n\nCapability classes generally\
    \ contain no data, but merely declare a number of virtual methods that can be\
    \ overridden in their derived classes.\n\nThe following example builds upon the\
    \ previous example to demonstrate how the “Bird” class can be better written as\
    \ a capability class. Its methods no longer contain output statements, but return\
    \ a -1 (error) value if they are called explicitly.\n\nIt is necessary to change\
    \ the return type of those methods from void to int and these changes must also\
    \ be reflected in each overriding method in the derived classes.\n\n![](img/bf8dbdfb89042fadbaa73b4160c74bac_139_0.png)\n\
    \ncapability.cpp\n\n+   1. Start a new program by specifying the C++ library classes\
    \ to include, and a namespace prefix to use\n\n```\n```cpp\n#include <iostream>\n\
    using namespace std ;\n```\n```\n\n+   2. Declare a base capability class named\
    \ “Bird”, containing two virtual method declarations that will signal an error\
    \ if called explicitly\n\n```\n```cpp\nclass Bird\n{\n  public :\n    virtual\
    \ int Talk() const { return -1 ; }\n    virtual int Fly() const { return -1 ;\
    \ }\n} ;\n```\n```\n\n+   3. Declare a derived class named “Pigeon”, containing\
    \ two methods to override those in the base class\n\n```\n```cpp\nclass Pigeon\
    \ : public Bird\n{\n  public :\n    int Talk() const\n    { cout << “Coo! Coo!”\
    \ << endl ; return 0 ; }\n\n    int Fly() const\n    { cout << “A pigeon flies\
    \ away...” << endl ; return 0 ; }\n} ;\n```\n```\n\n![](img/bf8dbdfb89042fadbaa73b4160c74bac_139_1.png)\n\
    \nThe return value of overriding methods in derived classes must match those declared\
    \ in the base class.\n\n+   4. Declare a derived class named “Chicken” containing\
    \ two methods to override those in the base class\n\n```\n```cpp\nclass Chicken\
    \ : public Bird\n{\n  public :\n    int Talk() const\n    { cout << “Cluck! Cluck!”\
    \ << endl ; return 0 ; }\n\n    int Fly() const\n```\n```"
