  md: '![](img/bf8dbdfb89042fadbaa73b4160c74bac_170_0.png)


    Depending upon your choices when you installed Visual Studio, you may see the
    options checked when the installer launches, to indicate you already have the
    Universal Windows App Development Tools.


    +   4. Next, select **File**, **New**, **Project** and create a new **Blank App
    (Universal Windows)** project called “Universal”


    ![](img/bf8dbdfb89042fadbaa73b4160c74bac_170_1.png)


    +   5. When asked to select the target and minimal platform versions, simply click
    **OK** to accept the default options


    +   6. After Visual Studio creates the new project, select **View**, **Solution
