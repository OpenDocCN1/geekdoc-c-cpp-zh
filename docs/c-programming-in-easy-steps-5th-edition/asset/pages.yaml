  md: "# Copying & swapping strings\n\nString values can be assigned to a **string**\
    \ variable by the **=** assignment operator, or by the **<string>** library’s\
    \ **assign()** function. This function specifies the **string** value to be copied\
    \ to the variable as an argument within its parentheses.\n\nOptionally, the **assign()**\
    \ function can copy just a part of the specified **string** value by stating the\
    \ position of the starting character as a second argument, and the number of characters\
    \ to copy as a third argument.\n\nThe contents of a **string** variable can be\
    \ exchanged for that of another **string** variable by the **<string>** library’s\
    \ **swap()** function. In this case, the contents of the first variable receives\
    \ those of the second variable, which in turn receives those of the first variable.\n\
    \n![](img/bf8dbdfb89042fadbaa73b4160c74bac_71_0.png)\n\nswap.cpp\n\n+   1. Start\
    \ a new program by specifying the C++ library classes to include, and a namespace\
    \ prefix to use.\n+   \n+   ```cpp\n+   #include <string>       // Include string\
    \ support.\n+   #include <iostream>\n+   using namespace std ;\n+   ```\n\n+ \
    \  2. Add a main function containing a final **return** statement and declaring\
    \ three **string** variables – with one initialized.\n+   \n+   ```cpp\n+   int\
    \ main()\n+   {\n+       string front ;\n+       string back ;\n+       string\
    \ text =\n+       “Always laugh when you can. It’s cheap medicine.” ;\n+     \
    \  // Add more statements here.\n+       return 0 ;\n+   }\n+   ```\n\n+   3.\
    \ In the main function, insert a statement to assign the entire value of the initialized\
    \ **string** variable to the first uninitialized **string** variable.\n+   \n\
    +   ```cpp\n+   front.assign( text ) ;\n+   ```\n\n+   4. Next, insert a statement\
    \ to output the newly assigned **string** value.\n+   \n+   ```cpp\n+   cout <<\
    \ endl << “Front: ” << front << endl ;\n+   ```\n\n+   5. Now, insert a statement\
    \ to assign only the first 27 characters of the initialized variable to the first\
    \ variable.\n+   \n+   ```cpp\n+   front.assign( text, 0, 27 ) ;\n+   ```\n\n\
    +   6. Output the newly assigned **string** value.\n+   \n+   ```cpp\n+   cout\
    \ << endl << “Front: ” << front << endl ;\n+   ```\n\n+   7. Next, assign only\
    \ the last part of the initialized **string** variable to the second uninitialized\
    \ variable, starting at character (element) 27.\n+   \n+   ```cpp\n+   back.assign(\
    \ text, 27, text.size() ) ;\n+   ```\n\n+   8. Now, output this newly assigned\
    \ **string** value.\n+   \n+   ```cpp\n+   cout << “Back: ” << back << endl ;\n\
    +   ```\n\n+   9. Finally, exchange the assigned **string** values contained in\
    \ the first and second **string** variables, then output the exchanged values.\n\
    +   \n+   ```cpp\n+   back.swap( front ) ;\n+   cout << endl << “Front: ” << front\
    \ << endl ;\n+   cout << “Back: ” << back << endl ;\n+   ```"
