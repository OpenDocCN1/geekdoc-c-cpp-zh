  md: "# Getting string input\n\nThe C++ **cin** function, which was introduced in\
    \ the last chapter to input numeric values, can also assign text input to **string**\
    \ variables. This has a limitation, as it can only be used to input a single word\
    \ at a time – the **cin** function stops reading the input when it encounters\
    \ a space, leaving any other text in the “input buffer”.\n\nWhen you want to allow\
    \ the user to input a string with spaces, such as a sentence, the **getline()**\
    \ function can be used. This function requires two arguments to specify the source\
    \ and destination of the string. For example, where the **cin** function is the\
    \ source, and a string variable named “str” is the destination:\n\n```\ngetline(\
    \ cin , str ) ;\n```\n\nThe **getline()** function reads from an input “stream”\
    \ until it encounters a **\\n** newline character at the end of the line – created\
    \ when you hit Return.\n\nCare must be taken when mixing **cin** and **getline()**\
    \ functions, as the **getline()** function will automatically read anything left\
    \ on the input buffer – giving the impression that the program is skipping an\
    \ instruction. The **cin.ignore()** function can be used to overcome this problem\
    \ by ignoring content left in the input buffer.\n\n![](img/bf8dbdfb89042fadbaa73b4160c74bac_63_0.png)\n\
    \n+   1. Start a new program by specifying the C++ library classes to include,\
    \ and a namespace prefix to use\n+   \n+   ```cpp\n+   #include <string>     \
    \  // Include string support.\n+   #include <iostream>\n+   using namespace std\
    \ ;\n+   ```\n\n+   2. Add a main function containing one string variable declaration\
    \ and a final **return** statement\n+   \n+   ```cpp\n+   int main()\n+   {\n\
    +       string name ;\n+       // Add more statements here.\n+       return 0\
    \ ;\n+   }\n+   ```\n\n+   3. In the main function, insert statements assigning\
    \ the user name input to a string variable, then outputting its value\n+   \n\
    +   ```cpp\n+   cout << \"Please enter your full name: \" ;\n+   cin >> name ;\n\
    +   cout << \"Welcome \" << name << endl ;\n+   ```\n\n+   4. Next, insert a statement\
    \ requesting the user name again, but this time assigning the input to the **string**\
    \ variable with the **getline** function before outputting its value\n+   \n+\
    \   ```cpp\n+   cout << \"Please re-enter your full name: \" ;\n+   getline( cin\
    \ , name ) ;\n+   cout << \"Thanks,\" << name << endl ;\n+   ```\n\n+   5. Save,\
    \ compile, and run the program and enter your full name when requested"
