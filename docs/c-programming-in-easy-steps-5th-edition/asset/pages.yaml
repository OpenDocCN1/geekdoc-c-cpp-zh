  md: "# # Encapsulating data\n\nA class is a data structure that can contain both\
    \ variables and functions in a single entity. These are collectively known as\
    \ its “members”, and the functions are known as its “methods”.\n\nAccess to class\
    \ members from outside the class is controlled by “access specifiers” in the class\
    \ declaration. Typically, these will deny access to the variable members, but\
    \ allow access to methods that can store and retrieve data from those variable\
    \ members. This technique of “data hiding” ensures that stored data is safely\
    \ encapsulated within the class variable members, and is the first principle of\
    \ Object Oriented Programming (OOP).\n\n![](img/bf8dbdfb89042fadbaa73b4160c74bac_115_0.png)\n\
    \nA class declaration begins with the **class** keyword, followed by a space,\
    \ then a programmer-specified name -- adhering to the usual C++ naming conventions,\
    \ but beginning in uppercase. Next, come the access specifiers and class members,\
    \ contained within a pair of braces. Every class declaration must end with a semicolon\
    \ after the closing brace -- so the class declaration syntax looks like this:\n\
    \n```\n```cpp\nclass ClassName\n{\n    access specifier :\n        member1 ;\n\
    \        member2 ;\n    access specifier :\n        member3 ;\n        member4\
    \ ;\n};\n```\n```\n\nAn access specifier may be any one of the keywords **public**,\
    \ **private**, or **protected** to specify access rights for its listed members:\n\
    \n+   - Public members are accessible from any place where the class is visible\n\
    +   - Private members are accessible only to other members of the same class\n\
    +   - Protected members are accessible only to other members of the same class\
    \ and to members of classes derived from that class\n\nBy default, all class members\
    \ have private access -- so any members that appear in the class declaration without\
    \ an access specifier will have private access.\n\n![](img/bf8dbdfb89042fadbaa73b4160c74bac_115_1.png)\n\
    \nDerived classes, which use the **protected** access specifier, are introduced\
    \ later in this chapter.\n\nAny real-world object can be defined by its attributes\
    \ and by its actions. For example, a dog has attributes such as age, weight, and\
    \ color, and actions it can perform such as bark. The class mechanism in C++ provides\
    \ a way to create a virtual dog object within a program, where the variable members\
    \ of a class can represent its attributes, and the methods represent its actions:\n\
    \n```\n```cpp\nclass Dog\n{\n    private: // The default access level.\n     \
    \   int age, weight ;\n```\n```"
  merge: -1
  img_proc: true
- pgno: 116
  md: "```\n```cpp\nstring color ;\npublic :\n    void bark() ;\n};\n// ... Plus methods\
    \ to store/retrieve data.\n```\n```\n\n![](img/bf8dbdfb89042fadbaa73b4160c74bac_116_0.png)\n\
    \nWhile a program class cannot perfectly emulate a real-word object, the aim is\
    \ to encapsulate all relevant attributes and actions.\n\nIt is important to recognize\
    \ that a class declaration only defines a data structure – in order to create\
    \ an object you must declare an “instance” of that data structure. This is achieved\
    \ in just the same way that instances are declared of regular C++ data types:\n\
    \n```\n```cpp\nint num ;        // Creates an instance named “num”.\n        \
    \         // of the regular C++ int data type.\n\nDog fido ;       // Creates\
    \ an instance named “fido”\n                 // of a programmer-defined Dog data\
    \ structure.\n```\n```\n\nAlternatively, an instance object can be created by\
    \ specifying its name between the class declaration’s closing brace and its final\
    \ semicolon. Multiple instances can be created this way, by specifying a comma-separated\
    \ list of object names. For example, the class declaration listed below creates\
    \ four instance objects of the Dog class named “fido”, “pooch”, “rex”, and “sammy”.\n\
    \n```\n```cpp\nclass Dog\n{\n    int age, weight ;\n    string color ;\npublic:\n\
    \    void bark() ;\n    // ... Plus methods to store/retrieve data.\n} fido, pooch,\
    \ rex, sammy ;\n```\n```\n\nThe principle of encapsulation in C++ programming\
    \ describes the grouping together of data and functionality in class members –\
    \ age, weight, color attributes and bark action in the Dog class.\n\n![](img/bf8dbdfb89042fadbaa73b4160c74bac_116_1.png)\n\
    \nIt is conventional to begin class names with an uppercase character and object\
    \ names with lowercase."
