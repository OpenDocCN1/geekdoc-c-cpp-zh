  md: "# Referencing data\n\nA C++ “reference” is an alias for a variable or an object\
    \ in a program. A reference must be initialized within its declaration, by assigning\
    \ it the name of the variable or object to which it refers. From then on, the\
    \ reference acts as an alternative name for the item to which it refers – anything\
    \ that happens to the reference is really implemented on the variable or object\
    \ to which it refers.\n\nA reference declaration first states its data type, matching\
    \ that of the item to which it will refer, suffixed by an & character denoting\
    \ that variable will be a reference, and a chosen name. Finally, the declaration\
    \ uses the = operator to associate a variable or object.\n\n![](img/bf8dbdfb89042fadbaa73b4160c74bac_107_0.png)\n\
    \n> Once a reference has been created, it will always refer to the item to which\
    \ it was initialized – a different item cannot be assigned to that reference.\n\
    \nTraditionally, a reference is named with the name of the associated variable\
    \ or object, but with an uppercase first letter and the whole name prefixed by\
    \ an “r”. For example, a declaration to create a reference to an integer variable\
    \ named “num” looks like this:\n\n```\nint& rNum = num ;\n```\n\nNote that the\
    \ purpose of the & reference operator is context-sensitive so that it declares\
    \ a reference when used as an L-value, on the left side of the = operator, otherwise\
    \ it returns a memory address when used as an R-value.\n\nA reference is such\
    \ a true alias to its associated item, that querying its memory address returns\
    \ the address of its associated item – there is no way to discover the address\
    \ of the reference itself.\n\n![](img/bf8dbdfb89042fadbaa73b4160c74bac_107_1.png)\n\
    \n+   1. Start a new program by specifying the C++ library classes to include,\
    \ and a namespace prefix to use.\n+   \n+   ```cpp\n+   #include <iostream>\n\
    +   using namespace std ;\n+   ```\n\n+   2. Add a main function containing a\
    \ final **return** statement and declaring two variables – a regular integer variable\
    \ and a reference to that variable.\n+   \n+   ```cpp\n+   int main()\n+   {\n\
    +       int num ;\n+       int& rNum = num ;\n+       // Add more statements here.\n\
    +       return 0 ;\n+   }\n+   ```\n\n+   3. In the main function, insert a statement\
    \ assigning an initial value to the integer variable via its reference.\n+   \n\
    +   ```cpp\n+   rNum = 400 ;\n+   ```\n\n+   4. Next, insert statements to output\
    \ the stored value, both directly and via its reference.\n+   \n+   ```cpp\n+\
    \   cout << “Value direct.” << num << endl ;\n+   cout << “Value via reference.”\
    \ << rNum << endl ;\n+   ```\n\n+   5. Now, insert statements to output the memory\
    \ address, both directly and via its reference.\n+   \n+   ```cpp\n+   cout <<\
    \ “Address direct:” << &num << endl ;\n+   ```"
