- pgno: 165
  md: "# # Debugging assertions\n\nIt is sometimes helpful to use preprocessor directives\
    \ to assist with debugging program code – by defining an **ASSERT** macro function\
    \ to evaluate a specified condition for a Boolean value.\n\nThe condition to be\
    \ evaluated will be passed from the caller as the **ASSERT** function argument.\
    \ The function can then execute appropriate statements according to the result\
    \ of the evaluation. Multiple statements can be included in the macro function\
    \ definition by adding a backslash `\\` at the end of each line, allowing the\
    \ definition to continue on the next line.\n\n![](img/bf8dbdfb89042fadbaa73b4160c74bac_165_0.png)\n\
    \nYou can comment-out sections of code when debugging using C-style `/* */` comment\
    \ operators.\n\nNumerous statements calling the **ASSERT** function can be added\
    \ to the program code to monitor a condition as the program proceeds. For example,\
    \ to check the value of a variable as it changes.\n\nUsefully, an **ASSERT** function\
    \ can be controlled by a **DEBUG** macro. This allows debugging to be easily turned\
    \ on and off simply by changing the value of the **DEBUG** control macro:\n\n\
    ![](img/bf8dbdfb89042fadbaa73b4160c74bac_165_1.png)\n\n+   1. Start a new program\
    \ by defining a **DEBUG** macro with an “on” value of one – to control an **ASSERT**\
    \ function\n\n```\n```cpp\n#define DEBUG 1\n```\n```\n\n+   2. Next, add a macro\
    \ if-elif statement block to define the **ASSERT** function according to the control\
    \ value\n\n```\n```cpp\n#if( DEBUG == 1 )\n        // Definition for “on” goes\
    \ here.\n#elif( DEBUG == 0 )\n        // Definition for “off” goes here.\n#endif\n\
    ```\n```\n\n+   3. In the top part of the **ASSERT** function statement block\
    \ insert a definition for when the debugging control is set to “on” – to output\
    \ failure details from predefined macros\n\n```\n```cpp\n#define ASSERT( expr\
    \ ) \\\ncout << #expr << \"...\" << num ; \\\nif ( expr != true ) \\\n{ \\\n \
    \   cout << \" Fails in file:\" << __FILE__ ; \\\n    cout << \" at line:\" <<\
    \ __LINE__ << endl ; \\\n} \\\nelse cout << \" Succeeds\" << endl ;\n```\n```\n\
    \n![](img/bf8dbdfb89042fadbaa73b4160c74bac_165_2.png)\n\nDo not place a backslash\
    \ continuation character on the last line of the definition, and remember to use\
    \ the `#` stringizing operator to output the expression as a string.\n\n+   4.\
    \ In the bottom part of the **ASSERT** function statement block, insert a definition\
    \ for when the debugging control is set to “off” – to simply output the current\
    \ variable value\n\n```\n```cpp\n#define ASSERT( result ) \\\n```\n```"
  merge: -1
  img_proc: true
