  md: '![](img/bf8dbdfb89042fadbaa73b4160c74bac_176_0.png)


    +   6. In the **Properties** window, expand the **Common** category, then click
    the **Source** item’s arrow button and select the added image from the drop-down
    list.


    +   7. The image now appears in the **Design** view, and its path gets added to
    the **XAML** view code and **Source** property.


    ![](img/bf8dbdfb89042fadbaa73b4160c74bac_176_1.png)


