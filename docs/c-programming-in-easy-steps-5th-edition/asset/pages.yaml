  md: "# # Understanding data storage\n\nIn order to understand C++ pointers it is\
    \ helpful to understand how data is stored on your computer. Envision the computer’s\
    \ memory as a very long row of sequentially numbered slots, which can each contain\
    \ one byte of data. When a variable is declared in a program, the machine reserves\
    \ a number of slots at which to store data assigned to that variable. The number\
    \ of slots it reserves depends upon the variable’s data type. When the program\
    \ uses the variable name to retrieve stored data, it actually addresses the number\
    \ of the variable’s first reserved slot.\n\nComparison can be drawn to a long\
    \ row of sequentially-numbered houses that can each accommodate a different family.\
    \ Any family can be explicitly referenced by addressing their house number.\n\n\
    The slot (house) numbers in computer memory are expressed in hexadecimal format\
    \ and can be revealed by the & reference operator.\n\n![](img/bf8dbdfb89042fadbaa73b4160c74bac_97_0.png)\n\
    \naddress.cpp\n\n+   1. Start a new program by specifying the C++ library classes\
    \ to include, and a namespace prefix to use.\n\n```\n```cpp\n#include <string>\n\
    #include <iostream>\nusing namespace std;\n```\n```\n\n+   2. Add a main function\
    \ containing a final **return** statement and declaring three initialized variables.\n\
    \n```\n```cpp\nint main()\n{\n    int num = 100;\n    double sum = 0.0123456789;\n\
    \    string text = \"C++ Fun\";\n    // Add more statements here.\n    return\
    \ 0;\n}\n```\n```\n\n+   3. In the main function, insert statements to output\
    \ the memory address of the first slot of each variable.\n\n```\n```cpp\ncout\
    \ << \"Integer variable starts at: \" << &num << endl;\ncout << \"Double variable\
    \ starts at: \" << &sum << endl;\ncout << \"String variable starts at: \" << &text\
    \ << endl;\n```\n```\n\n+   4. Save, compile, and run the program to see the three\
    \ memory addresses.\n\n![](img/bf8dbdfb89042fadbaa73b4160c74bac_97_1.png)\n\n\
    Once memory space has been reserved by a variable declaration, a value of the\
    \ appropriate data type can be stored there using the **=** assignment operator.\
    \ For example, **num = 100** takes the value on its right (**100**) and puts it\
    \ in the memory referenced by the named variable on its left (**num**)."
