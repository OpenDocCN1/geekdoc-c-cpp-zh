  md: "# Inheriting class properties\n\nA C++ class can be created as a brand new\
    \ class, like those in previous examples, or can be “derived” from an existing\
    \ class. Importantly, a derived class inherits members of the parent (base) class\
    \ from which it is derived – in addition to its own members.\n\nThe ability to\
    \ inherit members from a base class allows derived classes to be created that\
    \ share certain common properties, which have been defined in the base class.\
    \ For example, a “Polygon” base class may define width and height properties that\
    \ are common to all polygons. Classes of “Rectangle” and “Triangle” could be derived\
    \ from the Polygon class – inheriting width and height properties, in addition\
    \ to their own members defining their unique features.\n\n![](img/bf8dbdfb89042fadbaa73b4160c74bac_125_0.png)\n\
    \n![](img/bf8dbdfb89042fadbaa73b4160c74bac_125_1.png)\n\nThe virtue of inheritance\
    \ is extremely powerful and is the second principle of Object Oriented Programming\
    \ (OOP).\n\nA derived class declaration adds a colon : after its class name, followed\
    \ by an access specifier and the class from which it derives.\n\n![](img/bf8dbdfb89042fadbaa73b4160c74bac_125_2.png)\n\
    \nderived.cpp\n\n+   1. Start a new program by specifying the C++ library classes\
    \ to include, and a namespace prefix to use\n+   \n+   ```cpp\n+   #include <iostream>\n\
    +   using namespace std ;\n+   ```\n\n+   2. Declare a class named “Polygon” containing\
    \ two protected variables, accessible only to members of this class and classes\
    \ derived from this class, along with a public method to assign values to those\
    \ variables\n+   \n+   ```cpp\n+   class Polygon\n+   {\n+       protected:\n\
    +           int width, height ;\n+       public:\n+           void setValues(\
    \ int w, int h ) { width = w; height = h ; }\n+   };\n+   ```\n\n+   3. After\
    \ the Polygon class, declare a Rectangle class that derives from the Polygon class\
    \ and adds a unique method\n+   \n+   ```cpp\n+   class Rectangle : public Polygon\n\
    +   {\n+       public:\n+           int area() { return ( width * height ) ; }\n\
    +   };\n+   ```\n\n+   4. After the Rectangle class, declare a Triangle class\
    \ that derives from the Polygon class and adds a unique method"
