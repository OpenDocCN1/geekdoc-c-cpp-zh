  md: "# Looping for\n\nA loop is a piece of code in a program that automatically\
    \ repeats. One complete execution of all statements contained within the loop\
    \ block is known as an “iteration” or “pass”.\n\n![](img/bf8dbdfb89042fadbaa73b4160c74bac_47_0.png)\n\
    \nThe number of iterations made by a loop is controlled by a conditional test\
    \ made within the loop. While the tested expression remains **true**, the loop\
    \ will continue — until the tested expression becomes **false**, at which time\
    \ the loop ends.\n\nThe three types of loop structures in C++ programming are\
    \ **for** loops, **while** loops, and **do-while** loops. Perhaps the most commonly\
    \ used loop is the **for** loop, which has this syntax:\n\n```\nfor ( initializer\
    \ ; test-expression ; incrementer ) { statements }\n```\n\nThe initializer sets\
    \ the starting value for a counter of the number of iterations made by the loop.\
    \ An integer variable is used for this purpose and is traditionally named “i”.\n\
    \nUpon each iteration of the loop, the test expression is evaluated, and that\
    \ iteration will only continue while this expression is **true**. When the tested\
    \ expression becomes **false**, the loop ends immediately without executing the\
    \ statements again. On each iteration the counter is incremented then the statements\
    \ executed.\n\nLoops may be nested within other loops — so that the inner loop\
    \ will fully execute its iterations on each iteration of the outer loop.\n\n![](img/bf8dbdfb89042fadbaa73b4160c74bac_47_1.png)\n\
    \n+   1. Start a new program by specifying the C++ library classes to include,\
    \ and a namespace prefix to use\n+   \n+      ```cpp\n+      #include <iostream>\n\
    +      using namespace std ;\n+      ```\n+   \n+   2. Add a main function containing\
    \ a final **return** statement\n+   \n+      ```cpp\n+      int main()\n+    \
    \  {\n+          // Program code goes here.\n+          return 0 ;\n+      }\n\
    +      ```\n+   \n+   3. In the main function, insert a statement to declare an\
    \ integer variable to be used as a loop iteration counter\n+   \n+      ```cpp\n\
    +      int i ;\n+      ```\n+   \n+   4. Next, insert a **for** loop to output\
    \ the counter value on each of three iterations\n+   \n+      ```cpp\n+      for\
    \ ( i = 1 ; i < 4 ; i++ )\n+      {\n+          cout << “Loop iteration: ” <<\
    \ i << endl ;\n+      }\n+      ```\n+   \n+   5. Save, compile, and run the program\
    \ to see the output"
  merge: -1
  img_proc: true
