  md: "# Comparing pointers & references\n\nPointers and references can both be used\
    \ to refer to variable values and to pass them to functions by reference rather\
    \ than by value. Technically, passing by reference is more efficient than passing\
    \ by value, so the use of pointers and references is to be encouraged.\n\nThe\
    \ decision whether to use a pointer or a reference is determined by the program\
    \ requirements. C++ programmers generally prefer to use references wherever possible,\
    \ as they are easier to use and easier to understand than pointers. References\
    \ must, however, obey certain rules which can make the use of pointers necessary:\n\
    \n| Rule | References: | Pointers: |\n|---|---|---|\n| Can be declared without\
    \ initialization | No | Yes |\n| Can be reassigned | No | Yes |\n| Can contain\
    \ a 0 (null) value | No | Yes |\n| Easiest to use | Yes | No |\n\nAs a general\
    \ rule, the choice between using a reference or a pointer can be determined by\
    \ following these guidelines:\n\n+   - If you don’t want to initialize in the\
    \ declaration, use a pointer\n+   \n+   **or**\n+   \n+   - If you want to be\
    \ able to reassign another variable, use a pointer\n+   \n+   **otherwise**\n\
    +   \n+   - Always use a reference\n\n![](img/bf8dbdfb89042fadbaa73b4160c74bac_111_0.png)\n\
    \nA reference must be initialized in the declaration to refer to a variable or\
    \ object – then always refers to that item.\n\nPointers are more flexible than\
    \ references, however, and can even point to functions. In this case, the pointer\
    \ declaration must precisely match the return data type and arguments to those\
    \ of the function to which it points. Additionally, the pointer name must be enclosed\
    \ within parentheses in the declaration to avoid compiler errors. The function\
    \ pointer can then be assigned a function by name, so that function can be called\
    \ via the pointer.\n\n![](img/bf8dbdfb89042fadbaa73b4160c74bac_111_1.png)\n\n\
    pref.cpp\n\n+   1. Start a new program by specifying the C++ library classes to\
    \ include, and a namespace prefix to use.\n+   \n+   ```cpp\n+   #include <iostream>\n\
    +   using namespace std ;\n+   ```\n\n+   2. After the preprocessor instructions,\
    \ define an inline function to output the total of two passed arguments.\n+  \
    \ \n+   ```cpp\n+   inline void add ( int& a, int* b )\n+   { cout << \"Total:\
    \ \" << (a + *b) << endl; }\n+   ```\n\n+   3. Add a main function containing\
    \ a final **return** statement and declarations creating two"
