  md: "# # Replacing substrings\n\nThe **<string>** library contains a number of useful\
    \ functions to manipulate substrings. A **string** can be inserted into another\
    \ **string** using the **insert()** function. This requires the index position\
    \ at which the **string** should be inserted as its first argument, and the **string**\
    \ value to be inserted as its second argument.\n\nConversely, a substring can\
    \ be removed from a **string** using the **erase()** function. This requires the\
    \ index position at which it should begin erasing as its first argument, and the\
    \ number of characters to be erased as its second argument.\n\nThe **replace()**\
    \ function neatly combines the **erase()** and **insert()** functions to both\
    \ remove a substring and insert a replacement. It requires three arguments specifying\
    \ the position at which it should begin erasing, the number of characters to be\
    \ erased, and the replacement **string** to be inserted at that position.\n\n\
    A substring can be copied from a **string** using the **substr()** function, stating\
    \ the index position at which it should begin copying as its first argument, and\
    \ the number of characters to be copied as its second argument.\n\nThe character\
    \ at any specified position within a **string** can be copied using the **at()**\
    \ function, which requires the index position as its argument. The final character\
    \ in a **string** always has an element index number one less than the length\
    \ of the **string** – because index numbering starts at zero, not one.\n\n![](img/bf8dbdfb89042fadbaa73b4160c74bac_75_0.png)\n\
    \n+   1. Start a new program by specifying the C++ library classes to include,\
    \ and a namespace prefix to use\n+   \n+   ```cpp\n+   #include <string>     \
    \         // Include string support.\n+   #include <iostream>\n+   using namespace\
    \ std ;\n+   ```\n\n+   2. Add a main function containing a final **return** statement,\
    \ an initialized **string** variable declaration, and a statement outputting the\
    \ **string** variable value\n+   \n+   ```cpp\n+   int main()\n+   {\n+      \
    \ string text = \"I do like the seaside\" ;\n+       cout << \"Original: \" <<\
    \ text << endl ;\n+       // Add more statements here.\n+       return 0 ;\n+\
    \   }\n+   ```\n\n+   3. In the main function, insert statements to insert a substring\
    \ into the variable value at index position 10, and to output the modified **string**\n\
    +   \n+   ```cpp\n+   text.insert(10, \"to be beside\") ;\n+   cout << \"Inserted:\
    \ \" << text << endl ;\n+   ```\n\n+   4. Next, insert statements to erase two\
    \ characters from the modified **string** value starting at index position three,\
    \ and to output the revised **string**\n+   \n+   ```cpp\n+   text.erase(2, 3)\
    \ ;\n+   cout << \"Erased: \" << text << endl ;\n+   ```\n\n+   5. Now, insert\
    \ statements to remove 25 characters at index position seven, insert a replacement\
    \ substring, then output the revised **string** again\n+   \n+   ```cpp\n+   text.replace(7,\
    \ 25, \"strolling by the sea\") ;\n+   cout << \"Replaced: \" << text << endl\
    \ ;\n+   ```\n\n+   6. Finally, insert statements to output nine copied characters\
    \ at index position seven, and to output the final character in the string"
