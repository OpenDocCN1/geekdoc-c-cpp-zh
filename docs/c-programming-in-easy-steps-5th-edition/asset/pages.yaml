  md: "# # Defining substitutes\n\nJust as the preprocessor substitutes library code\
    \ for **#include** directives, other preprocessor directives can be used to substitute\
    \ text or numeric values before assembly and compilation.\n\nThe **#define** directive\
    \ specifies a macro, comprising an identifier name and a string or numeric value,\
    \ to be substituted by the preprocessor for each occurrence of that macro in the\
    \ source code.\n\nLike **#include** preprocessor directives, **#define** directives\
    \ can appear at the start of the source code. As with constant variable names,\
    \ the macro name traditionally uses uppercase, and defined string values should\
    \ be enclosed within double quotes. For numeric substitutions in expressions the\
    \ macro name should be enclosed in parentheses to ensure correct precedence.\n\
    \n![](img/bf8dbdfb89042fadbaa73b4160c74bac_153_0.png)\n\n+   1. Start a new program\
    \ by declaring three **define** directives\n+   \n+       ```c\n+       #define\
    \ BOOK \"C++ Programming in easy steps\"\n+       #define NUM 200\n+       #define\
    \ RULE \"******************************\"\n+       ```\n\n+   2. Specify the library\
    \ classes to include, and the namespace\n+   \n+       ```cpp\n+       #include\
    \ <iostream>\n+       using namespace std ;\n+       ```\n\n+   3. Add a main\
    \ function containing a final **return** statement and three statements to output\
    \ substituted values\n+   \n+       ```cpp\n+       int main()\n+       {\n+ \
    \        cout << RULE << endl << BOOK << endl << RULE ;\n+         cout << endl\
    \ << \"NUM is: \" << NUM << endl ;\n+         cout << \"Double NUM: \" << ( (\
    \ NUM ) * 2 ) << endl ;\n+         return 0 ;\n+       }\n+       ```\n\n+   4.\
    \ Save, compile, and run the program to see the output\n\n![](img/bf8dbdfb89042fadbaa73b4160c74bac_153_1.png)\n\
    \n![](img/bf8dbdfb89042fadbaa73b4160c74bac_153_2.png)\n\nNumeric constants are\
    \ often best declared as const variables – because values substituted by the preprocessor\
    \ are not subject to type-checking.\n\n+   5. Recompile the program saving the\
    \ temporary files **c++ define.cpp -save-temps -o define.exe**\n\n+   6. Open\
    \ the temporary “define.ii” file in a plain text editor and scroll to the end\
    \ of the file to see the substitutions"
