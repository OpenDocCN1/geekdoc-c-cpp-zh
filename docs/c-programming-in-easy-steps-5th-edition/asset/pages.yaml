- pgno: 33
  md: "# # Examining conditions\n\nPossibly the C++ programmer’s most favorite test\
    \ operator is the `?:` “ternary” operator. This operator first evaluates an expression\
    \ for a **true** or **false** condition, then returns one of two specified values\
    \ depending on the result of the evaluation. For this reason it is also known\
    \ as the “conditional” operator.\n\nThe `?:` ternary operator has this syntax:\n\
    \n```\n```\n( test-expression ) ? if-true-return-this : if-false-return-this ;\n\
    ```\n```\n\nAlthough the ternary operator can initially appear a little confusing,\
    \ it is well worth becoming familiar with this operator as it can execute powerful\
    \ program branching with minimal code. For example, to branch when a variable\
    \ is not a value of one:\n\n```\n```\n( var != 1 ) ? if-true-do-this : if-false-do-this\
    \ ;\n```\n```\n\nThe ternary operator is commonly used in C++ programming to assign\
    \ the maximum or minimum value of two variables to a third variable. For example,\
    \ to assign a minimum like this:\n\n```\n```\nc = ( a < b ) ? a : b ;\n```\n```\n\
    \nThe expression in parentheses returns **true** when the value of variable **a**\
    \ is less than that of variable **b** – so in this case, the lesser value of variable\
    \ **a** gets assigned to variable **c**.\n\nSimilarly, replacing the `<` less\
    \ than operator in the test expression with the `>` greater operator would assign\
    \ the greater value of variable **b** to variable **c**.\n\nAnother common use\
    \ of the ternary operator incorporates the `%` modulus operator in the test expression\
    \ to determine whether the value of a variable is an odd number or an even number:\n\
    \n```\n```\n( var % 2 != 0 ) ? if-true(odd)-do-this : if-false(even)-do-this ;\n\
    ```\n```\n\n![](img/bf8dbdfb89042fadbaa73b4160c74bac_33_0.png)\n\nThe ternary\
    \ operator has three operands – the one before the `?`, and those before and after\
    \ the `:`.\n\nWhere the result of dividing the variable value by two does leave\
    \ a remainder, the number is odd – where there is no remainder, the number is\
    \ even. The test expression `( var % 2 == 1 )` would have the same effect but\
    \ it is preferable to test for inequality – it’s easier to spot when something\
    \ is different than when it’s identical.\n\nThe ternary operator is demonstrated\
    \ in the program below.\n\n![](img/bf8dbdfb89042fadbaa73b4160c74bac_33_1.png)\n\
    \nternary.cpp\n\n+   1. Start a new program by specifying the C++ library classes\
    \ to include, and a namespace prefix to use\n+   \n+      ```cpp\n+      #include\
    \ <iostream>\n+      using namespace std ;\n+      ```\n+   \n+   2. Add a main\
    \ function containing a final **return** statement\n+   \n+      ```cpp\n+   \
    \   int main()\n+      {\n+          // Program code goes here.\n+          return\
    \ 0 ;\n+      }\n+      ```"
