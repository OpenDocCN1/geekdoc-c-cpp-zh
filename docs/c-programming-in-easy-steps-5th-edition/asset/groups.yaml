  - "[PAGE 184]\n\n# Adjusting the interface\n\nThe app test for mobile devices above\
    \ failed to satisfactorily present the controls, as the interface is too wide\
    \ for small screen devices. Happily, the interface can be made to adapt to different\
    \ screen sizes so it can also look good on mobile devices. The adaptation relies\
    \ upon recognizing the screen size and changing the orientation of a **<StackPanel>**\
    \ element in **XAML** for narrow screen devices:\n\n![](img/bf8dbdfb89042fadbaa73b4160c74bac_184_0.png)\n\
    \n+   1. Open **MainPage.xaml**, then in XAML view add these elements immediately\
    \ below the opening **<Grid>** element and before the component elements.\n\n\
    ```\n```xml\n<VisualStateManager.VisualStateGroups>\n    <VisualStateGroup>\n\
    \        <!-- Elements to be inserted here (Steps 2-3) -->\n    </VisualStateGroup>\n\
    </VisualStateManager.VisualStateGroups>\n```\n```\n\n+   2. Next, insert elements\
    \ to recognize wide screens.\n\n```\n```xml\n<VisualState x:Name = “wideState”\
    \ >\n    <VisualState.StateTriggers>\n        <AdaptiveTrigger MinWindowWidth\
    \ = “641” />\n    </VisualState.StateTriggers>\n</VisualState>\n```\n```\n\n+\
    \   3. Now, insert elements to recognize narrow screens and to change the **Orientation**\
    \ of the outer **<StackPanel>**.\n\n```\n```xml\n<VisualState x:Name = “narrowState”\
    \ >\n    <VisualState.StateTriggers>\n        <AdaptiveTrigger MinWindowWidth\
    \ = “0” />\n    </VisualState.StateTriggers>\n\n    <VisualState.Setters>\n  \
    \      <Setter\n            Target = “MainStack.Orientation” Value = “Vertical”\
    \ />\n    </VisualState.Setters>\n</VisualState>\n```\n```\n\nThe beginning of\
    \ the **MainPage.xaml** file should now look similar to the screenshot below:\n\
    \n![](img/bf8dbdfb89042fadbaa73b4160c74bac_184_1.png)\n\nXAML code recognizes\
    \ the same `<!-- -->` comment tags that are used in HTML code.\n\n![](img/bf8dbdfb89042fadbaa73b4160c74bac_184_2.png)\n\
