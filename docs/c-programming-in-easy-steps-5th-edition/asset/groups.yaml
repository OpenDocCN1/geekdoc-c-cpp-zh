    ![](img/bf8dbdfb89042fadbaa73b4160c74bac_88_3.png)\n\nManipulators affect all\
    \ input or output on that stream. For example, the **boolalpha** manipulator will\
    \ display all Boolean values on that stream in written form.\n\n## Predicting\
