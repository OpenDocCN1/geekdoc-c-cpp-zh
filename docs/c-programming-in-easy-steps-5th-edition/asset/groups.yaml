  - "[PAGE 93]\n\n# Handling errors\n\nException type information can be provided\
    \ by including the C++ standard `<typeinfo>` library. Its `typeid()` function\
    \ accepts an exception argument so its `name()` function can return the type name:\n\
    \n![](img/bf8dbdfb89042fadbaa73b4160c74bac_93_0.png)\n\n+   1. Start a new program\
    \ by specifying the C++ library classes to include, and a namespace prefix to\
    \ use\n\n```\n~~~cpp\n#include <stdexcept> // Support standard exceptions.\n#include\
    \ <typeinfo> // Support type information.\n#include <fstream>\n#include <string>\n\
    #include <iostream>\nusing namespace std ;\n~~~\n```\n\n+   2. Add a main function\
    \ containing a final return statement, two initialized variable declarations,\
    \ and a statement outputting a text message\n\n```\n~~~cpp\nint main()\n{\n  \
    \ string lang = \"C++\" ;\n   int num = 1000000000 ; // One billion.\n   // Try-catch\
    \ block goes here.\n   cout << \"Program continues...\" << endl ;\n   return 0\
    \ ;\n}\n~~~\n```\n\n+   3. In the main function, insert a try block containing\
    \ a statement attempting to replace part of the string value\n\n```\n~~~cpp\n\
    try { lang.replace( 100, 1 , \"C\" ) ; }\n~~~\n```\n\n+   4. After the try block,\
    \ add a catch block to handle a range exception then save, compile, and run the\
    \ program\n\n```\n~~~cpp\ncatch( out_of_range &e )\n{\n   cerr << \"Range Exception:\
