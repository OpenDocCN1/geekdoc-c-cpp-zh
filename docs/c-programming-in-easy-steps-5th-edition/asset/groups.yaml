  - "[PAGE 155]\n\n# Defining conditions\n\nThe preprocessor can make intelligent\
    \ insertions to program source code by using macro functions to perform conditional\
    \ tests. An **#ifdef** directive performs the most common preprocessor function\
    \ by testing to see if a specified macro has been defined. When the macro has\
    \ been defined, so the test returns true, the preprocessor will insert all directives,\
    \ or statements, on subsequent lines up to a corresponding **#endif** directive.\n\
    \nConversely, an **#ifndef** directive tests to see if a specified macro has not\
    \ been defined. When that test returns true, it will insert all directives, or\
    \ statements, on subsequent lines up to a corresponding **#endif** directive.\n\
    \nTo satisfy either conditional test, it should be noted that a **#define** directive\
    \ need only specify the macro name to define the identifier – it need not specify\
    \ a value to substitute.\n\nAny previously defined macro can be removed later\
    \ using the **#undef** directive – so that subsequent **#ifdef** conditional tests\
    \ fail. The macro can then be redefined by a further **#define** directive.\n\n\
    ![](img/bf8dbdfb89042fadbaa73b4160c74bac_155_0.png)\n\n+   1. Start a new program\
    \ with a conditional test to insert a directive when a macro is not already defined\n\
    +   \n+      ```cpp\n+      #ifndef BOOK\n+          #define BOOK \"C++ Programming\
