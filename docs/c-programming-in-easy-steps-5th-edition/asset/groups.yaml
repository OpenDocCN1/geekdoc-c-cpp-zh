    \    ```cpp\n    vector <int> vec( 10 );\n    int i = 0 ;\n    ```\n\n- 4. 接下来，插入一个\
    \ **while** 循环，在每次迭代中将计数器值赋给向量的一个元素\n\n    ```cpp\n    while ( i < vec.size()\
    \ )\n    {\n        i++ ;                     // Increment the counter.\n    \
    \    vec[ i-1 ] = i ;                  // Assign count to element.\n        cout\
