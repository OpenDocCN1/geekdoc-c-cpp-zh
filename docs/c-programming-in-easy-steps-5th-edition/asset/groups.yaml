  - "[PAGE 157]\n\n# # Providing alternatives\n\nThe conditional test performed by\
    \ `#ifdef` and `#ifndef` can be extended to provide an alternative by adding an\
    \ `#else` directive. For example:\n\n```\n    #ifdef WEATHER\n        cout <<\
    \ WEATHER ;\n    #else\n        #define WEATHER “Sunny”\n    #endif\n```\n\nSimilarly,\
    \ `#if`, `#else`, and `#elif` macros can perform multiple conditional tests, much\
    \ like the regular C++ `if` and `else` keywords.\n\nFor testing multiple definitions,\
    \ the `#ifdef` macro can be expressed as `#if defined`, and further tests made\
    \ by `#elif defined` macros.\n\n![](img/bf8dbdfb89042fadbaa73b4160c74bac_157_0.png)\n\
    \nThe `#elif` macro simply combines else and if to offer an alternative test.\n\
    \nWhile most macros are defined in the source file with a `#define` directive,\
    \ or on the command line with the `-D` option, some macros are automatically predefined\
    \ by the compiler. Typically, these have names beginning with a double underscore\
    \ to avoid accidental confusion with chosen names. The compiler’s predefined macros\
    \ are platform-specific, so a program can employ a multiple definition test to\
    \ identify the host platform:\n\n![](img/bf8dbdfb89042fadbaa73b4160c74bac_157_1.png)\n\
    \n+   1. Launch a plain text editor and save a new file (without any content)\
    \ as “empty.txt” in your program’s directory\n+   2. To see a list of the compiler’s\
    \ predefined macros, issue a command calling the cpp preprocessor directly with\
    \ a “-dM” option on the empty file\n+      `cpp -dM empty.txt`\n+   3. Scroll\
    \ through the list to find the “_WIN32” macro on Windows or the “_linux” macro\
    \ on Linux systems\n\n![](img/bf8dbdfb89042fadbaa73b4160c74bac_157_2.png)\n\n\
    ![](img/bf8dbdfb89042fadbaa73b4160c74bac_157_3.png)\n\nUse the `cpp` command to\
    \ call the preprocessor directly (not the `c++` command) and ensure the `-dM`\
    \ option is capitalized correctly."
