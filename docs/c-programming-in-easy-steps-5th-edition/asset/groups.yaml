    \n## Manipulating input & output\n\nThe behavior of input and output streams can\
    \ be modified using \"insertion operators\" with the **cout** and **cin** functions.\
    \ Specifying an integer argument to their **width()** function sets the stream\
    \ character width. Where the content does not fill the entire stream width, a\
