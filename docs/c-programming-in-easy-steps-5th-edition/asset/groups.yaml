    \nMore on references in the next chapter.\n\nOnce an exception reference is passed\
    \ to a **catch** block, an error description can be retrieved by the exception's\
    \ **what()** function:\n\n![](img/bf8dbdfb89042fadbaa73b4160c74bac_91_1.png)\n\
    \n- **1.** Start a new program by specifying the C++ library classes to include,\
    \ and a namespace prefix to use.\n\n```cpp\n#include <string>    // Include string\
    \ support.\n#include <iostream>\nusing namespace std;\n```\n\n- **2.** Add a main\
    \ function containing a final **return** statement and declaring an initialized\
    \ **string** variable.\n\n```cpp\nint main()\n{\n    string lang = \"C++\";\n\
    \    // Add more statements here.\n    return 0;\n}\n```\n\n- **3.** In the main\
    \ function, insert a **try** block containing a statement attempting to erase\
    \ part of the **string** variable.\n\n```cpp\ntry { lang.erase(4, 6); }\n```\n\
    \n- **4.** Next, insert a **catch** block containing a statement to send a description\
    \ to standard error output by the **cerr** function.\n\n```cpp\ncatch (exception\
    \ &error)\n{ cerr << \"Exception: \" << error.what() << endl; }\n```\n\n- **5.**\
    \ Save, compile, and run the program to see the error description of the caught\
    \ exception.\n\n![Command Prompt screenshot](image_3)\n\n![](img/bf8dbdfb89042fadbaa73b4160c74bac_91_3.png)\n\
    \nThe error description will vary for different compilers – the Visual C++ compiler\
