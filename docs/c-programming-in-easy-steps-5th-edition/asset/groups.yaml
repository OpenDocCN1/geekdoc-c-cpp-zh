    | / | Division |\n| % | Modulus |\n| ++ | Increment |\n| -- | Decrement |\n\n\
    The operators for addition, subtraction, multiplication, and division act as you\
    \ would expect. Care must be taken, however, to bracket expressions where more\
    \ than one operator is used to clarify the expression – operations within innermost\
    \ parentheses are performed first:\n\n```cpp\na = b * c - d % e / f;        //\
    \ This is unclear.\na = ( b * c ) - ( ( d % e ) / f );   // This is clearer.\n\
    ```\n\nThe % modulus operator will divide the first given number by the second\
    \ given number and return the remainder of the operation. This is useful to determine\
    \ if a number has an odd or even value.\n\n![](img/bf8dbdfb89042fadbaa73b4160c74bac_25_0.png)\n\
    \nValues used with operators to form expressions are called “operands” – in the\
    \ expression 2 + 3 the numerical values 2 and 3 are the operands.\n\nThe ++ increment\
    \ operator and -- decrement operator alter the given number by one and return\
    \ the resulting value. These are most commonly used to count iterations in a loop.\
    \ Counting up, the ++ operator increases the value by one, while counting down,\
    \ the -- decrement operator decreases the value by one.\n\nThe increment and decrement\
    \ operators can be placed before or after a value to different effect. If placed\
    \ before the operand (prefix), its value is immediately changed; if placed after\
    \ the operand (postfix), its value is noted first, then the value is changed.\n\
    \n![](img/bf8dbdfb89042fadbaa73b4160c74bac_25_1.png)\n\narithmetic.cpp\n\n- 1.\
    \ Start a new program by specifying the C++ library classes to include, and a\
    \ namespace prefix to use\n\n    ```cpp\n    #include <iostream>\n    using namespace\
    \ std;\n    ```\n\n- 2. Add a main function containing a final **return** statement\n\
    \n    ```cpp\n    int main()\n    {\n        // Program code goes here.\n    \
