  - "[PAGE 111]\n\n# Comparing pointers & references\n\nPointers and references can\
    \ both be used to refer to variable values and to pass them to functions by reference\
    \ rather than by value. Technically, passing by reference is more efficient than\
    \ passing by value, so the use of pointers and references is to be encouraged.\n\
    \nThe decision whether to use a pointer or a reference is determined by the program\
    \ requirements. C++ programmers generally prefer to use references wherever possible,\
    \ as they are easier to use and easier to understand than pointers. References\
    \ must, however, obey certain rules which can make the use of pointers necessary:\n\
