  - "[PAGE 99]\n\n# # Getting values with pointers\n\nPointers are a useful part of\
    \ efficient C++ programming – they are simply variables that store the memory\
    \ address of other variables.\n\nPointer variables are declared in the same way\
    \ that other variables are declared, but the data type is suffixed by a “*” character.\
    \ This denotes, in a declaration, that the variable will be a pointer. Always\
    \ remember that the pointer’s data type must match that of the variable to which\
    \ it points.\n\nA pointer variable is initialized by assigning it the memory address\
    \ of another variable, using the & reference operator. The assignment can be made\
    \ either in the declaration statement, or in a separate statement after the declaration.\
    \ Referencing a pointer variable by its name alone will simply reveal the memory\
    \ address that it contains.\n\nAfter a pointer variable has been initialized,\
    \ either in the declaration or by a subsequent assignment, it “points” to the\
    \ variable at the address which it contains. Usefully, this means that the value\
    \ of the variable to which it points can be referenced by prefixing the pointer\
    \ name with the * dereference operator.\n\n![](img/bf8dbdfb89042fadbaa73b4160c74bac_99_0.png)\n\
    \nderef.cpp\n\n+   1. Start a new program by specifying the C++ library classes\
