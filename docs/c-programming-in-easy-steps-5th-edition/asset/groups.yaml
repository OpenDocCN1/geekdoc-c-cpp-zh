    \n| 变量名 | 路径 |\n| --- | --- |\n| 变量值 | `C:\\MinGW\\bin` |\n\n## 编写你的第一个程序\n\n\
    按照以下步骤操作，并完全照列出的代码复制，创建一个将输出传统第一个程序问候语的简单 C++ 程序：\n\n![](img/bf8dbdfb89042fadbaa73b4160c74bac_11_0.png)\n\
    \nhello.cpp\n\n- 1. 打开一个纯文本编辑器，例如 Windows 的记事本，然后键入以下“预处理器指令”\n\n  ```cpp\n  #include\
