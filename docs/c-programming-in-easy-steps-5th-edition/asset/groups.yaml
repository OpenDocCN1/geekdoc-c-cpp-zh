    \nDo not click the X button on the emulator window to stop the running program,\
    \ as that will also close the emulator.\n\n## Adjusting the interface\n\nThe app\
    \ test for mobile devices above failed to satisfactorily present the controls,\
    \ as the interface is too wide for small screen devices. Happily, the interface\
    \ can be made to adapt to different screen sizes so it can also look good on mobile\
    \ devices. The adaptation relies upon recognizing the screen size and changing\
    \ the orientation of a **<StackPanel>** element in **XAML** for narrow screen\
    \ devices:\n\n![](img/bf8dbdfb89042fadbaa73b4160c74bac_184_0.png)\n\n- 1. Open\
    \ **MainPage.xaml**, then in XAML view add these elements immediately below the\
    \ opening **<Grid>** element and before the component elements.\n\n```xml\n<VisualStateManager.VisualStateGroups>\n\
    \    <VisualStateGroup>\n        <!-- Elements to be inserted here (Steps 2-3)\
