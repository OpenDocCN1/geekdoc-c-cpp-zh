    \ | Decrement | `++` | Increment | RTL |\n| `+` | Positive sign | `-` | Negative\
    \ sign | RTL |\n| `sizeof` | Size of | `&` | Address of | RTL |\n| `*` | Multiply\
    \ | `/` | Divide | LTR |\n| `%` | Modulus |  |  | LTR |\n| `+` | Add | `-` | Subtract\
    \ | LTR |\n| `<=` | Less or equal | `<` | Less than | LTR |\n| `>=` | Greater\
    \ or equal | `>` | Greater than | LTR |\n| `==` | Equality | `!=` | Inequality\
    \ | LTR |\n| `&&` | Logical AND |  |  | LTR |\n| `\\|\\|` | Logical OR |  |  |\
    \ LTR |\n| `?:` | Ternary |  |  | RTL |\n| `+= -= *= /= %=` | Assignments |  |\
    \  | RTL |\n| `,` | Comma |  |  | LTR |\n\n![](img/bf8dbdfb89042fadbaa73b4160c74bac_37_1.png)\n\
    \n> The -> class pointer and the . class member operators are introduced later\
    \ in this book – but they are included here for completeness.\n\nIn addition to\
