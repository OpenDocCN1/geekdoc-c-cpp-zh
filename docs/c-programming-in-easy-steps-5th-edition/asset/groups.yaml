    # # Manipulating input & output


    The behavior of input and output streams can be modified using “insertion operators”
    with the **cout** and **cin** functions. Specifying an integer argument to their
    **width()** function sets the stream character width. Where the content does not
    fill the entire stream width, a fill character may be specified as the argument
    to their **fill()** function to indicate the empty portion. Similarly, the default
    precision of six decimal places for floating point numbers can be changed by specifying
    an integer to their **precision()** function. Statements using insertion operators
    to modify a stream should be made before those using the `<<` or `>>` operators.


    ![](img/bf8dbdfb89042fadbaa73b4160c74bac_87_0.png)


    Insertion operators modify just one stream object – subsequent stream objects
    use the defaults, unless they too get modified first by insertion operators.


    The `<iostream>` library provides the “manipulators” listed in the table below,
    which modify a stream using the `<<` or `>>` operators.


    | Manipulator: | Display: |

    |---|---|

    | noboolalpha* | Boolean values as 1 or 0 |

    | boolalpha | Boolean values as “true” or “false” |

    | dec* | Integers as base 10 (decimal) |

    | hex | Integers as base 16 (hexadecimal) |

    | oct | Integers as base 8 (octal) |

    | right* | Text right-justified in the output width |

    | left | Text left-justified in the output width |

    | internal | Sign left-justified, number right-justified |

    | noshowbase* | No prefix indicating numeric base |

    | showbase | Prefix indicating numeric base |

    | noshowpoint* | Whole number only when a fraction is zero |

    | showpoint | Decimal point for all floating point numbers |

    | noshowpos* | No + prefix before positive numbers |

    | showpos | Prefix positive numbers with a + sign |

    | noskipws* | Do not skip whitespace for >> input |

    | skipws | Skip whitespace for >> input |

    | fixed* | Floating point numbers to six decimal places |

    | scientific | Floating point numbers in scientific notation |

    | nouppercase* | Scientific as e and hexadecimal number as ff |

    | uppercase | Scientific as E and hexadecimal number as FF |'
