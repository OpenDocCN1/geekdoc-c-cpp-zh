  mdcn: "\n## 探索字符串特性\n\nC++ `<string>` 库提供了许多函数，使处理字符串变得轻松。要使用它们，只需在 **string** 变量名后加上函数名和一个点。例如，对于名为“msg”的\
    \ **string** 变量，可以调用 **size()** 函数，通过 **msg.size()** 返回其字符长度。\n\n通过将一个由两个双引号且中间没有空格组成的空字符串（即\
    \ \"\"）赋给 **string** 变量，可以清空其中的所有字符；或者也可以调用 `<string>` 库的 **clear()** 函数来清空。\n\
    \n与 **char** 数组不同，**string** 变量会动态扩大，以容纳分配给它的字符数量；其当前内存大小可以通过 `<string>` 库的 **capacity()**\
    \ 函数获知。一旦扩大，即使给该变量分配一个更小的 **string**，已分配的内存大小仍会保留。\n\n![](img/bf8dbdfb89042fadbaa73b4160c74bac_67_0.png)\n\
    \n**length()** 函数可以代替 **size()** 函数来显示字符串值的大小。\n\n`<string>` 库的 **empty()** 函数返回布尔值\
    \ **true (1)** 或 **false (0)**，以显示字符串是否为空。\n\n![](img/bf8dbdfb89042fadbaa73b4160c74bac_67_1.png)\n\
    \nfeatures.cpp\n\n- 1. 通过指定要包含的 C++ 库类和要使用的命名空间前缀，开始一个新程序。\n\n  ```cpp\n  #include\
    \ <string>       // Include string support.\n  #include <iostream>\n  using namespace\
    \ std;\n  ```\n\n- 2. 在预处理器指令下方，声明一个带单个 string 数据类型参数的函数原型。\n\n  ```cpp\n  void\
    \ computeFeatures( string );\n  ```\n\n- 3. 添加一个 main 函数，其中包含最后的 **return** 语句，并声明一个已初始化的\
    \ **string** 变量。\n\n  ```cpp\n  int main()\n  {\n      string text = \"C++ is\
    \ fun\";\n      // Add more statements here.\n      return 0;\n  }\n  ```\n\n\
    - 4. 在 main 函数之后，定义已声明的函数，使其在被调用时显示该 **string** 变量的值。\n\n  ```cpp\n  void computeFeatures(\
    \ string text )\n  {\n      cout << endl << \"String: \" << text << endl ;\n \
    \ }\n  ```\n\n- 5. 在函数定义中，添加语句以输出该 **string** 变量的特性。\n\n  ```cpp\n  cout << \"\
    Size: \" << text.size() ;\n  cout << \"Capacity: \" << text.capacity() ;\n  cout\
    \ << \"Empty?: \" << text.empty() << endl ;\n  ```\n\n- 6. 在 main 函数中，插入对已定义函数的调用\n\
    \n  ```cpp\n  computeFeatures( text );\n  ```\n\n- 7. 接下来，在 main 函数中插入一条语句以扩大该\
    \ **string** 值，并调用该函数查看其特性\n\n  ```cpp\n  text += \" for everyone\";\n  computeFeatures(\
    \ text );\n  ```\n\n- 8. 现在，插入一条语句以缩小该 **string** 值\n\n  ```cpp\n  text = \"C++\
    \ Fun\";\n  computeFeatures( text );\n  ```\n\n- 9. 最后，插入一条语句以清空该 **string** 变量\n\
    \n  ```cpp\n  text.clear();\n  computeFeatures( text );\n  ```\n\n- 10. 保存、编译并运行程序以查看输出\n\
    \n![](img/bf8dbdfb89042fadbaa73b4160c74bac_68_0.png)\n\n![](img/bf8dbdfb89042fadbaa73b4160c74bac_68_1.png)\n\
    \n**empty()** 函数可用于检查用户是否已输入所请求的输入。\n\n![](img/bf8dbdfb89042fadbaa73b4160c74bac_68_2.png)\n\
    \n空格占用一个内存元素——就像字符一样。\n\n## 连接与比较字符串\n\n当在赋值中使用 **+** 运算符连接字符串时，合并后的字符串会存储到 **string**\
    \ 变量中。但是当它与 **cout** 函数一起使用时，字符串只在输出中合并——变量值不变。\n\n**<string>** 库的 **append()**\
    \ 函数也可以用于连接字符串，将要追加的 **string** 值指定为其括号内的参数。当它与 **cout** 函数一起使用时，字符串会在变量中合并，然后其值作为输出写出——在这种情况下，变量值确实会改变。\n\
    \n可以使用 **==** 相等运算符进行字符串比较，方式与数值比较相同。当两个字符串完全匹配时，它返回 **true** (1)，否则返回 **false**\
    \ (0)。\n\n或者，可以使用 **<string>** 库的 **compare()** 函数来比较指定为其参数的 **string** 值。与 **==**\
    \ 相等比较不同，**compare()** 函数在字符串相同时返回零，这是通过检查 **string** 值的组合 ASCII 码值来实现的。当 **string**\
    \ 参数的总值大于第一个字符串时，它返回 -1，否则返回 1。\n\n![](img/bf8dbdfb89042fadbaa73b4160c74bac_69_0.png)\n\
    \n- 1. 通过指定要包含的 C++ 库类和要使用的命名空间前缀，开始一个新程序。\n\n  ```cpp\n  #include <string>  \
    \     // Include string support.\n  #include <iostream>\n  using namespace std;\n\
    \  ```\n\n- 2. 添加一个 main 函数，其中包含最后的 **return** 语句，并声明三个已初始化的 string 变量。\n\n  ```cpp\n\
    \  int main()\n  {\n      string lang = \"C++\";\n      string term = \"Programming\"\
    ;\n      string text = \"C++ Programming\";\n      // Add more statements here.\n\
    \      return 0;\n  }\n  ```\n\n- 3. 在 main 函数中，插入语句以输出用 **+** 连接运算符合并的两个 **string**\
    \ 值，以及第一个变量的（未改变的）值。\n\n  ```cpp\n  cout << \"Concatenated: \" << (lang + term)\
    \ << endl;\n  cout << \"Original: \" << lang << endl;\n  ```\n\n- 4. 接下来，插入语句以输出用\
    \ **append()** 函数合并的两个 **string** 值，以及第一个变量的（已改变的）值。\n\n  ```cpp\n  cout << \"\
    Appended: \" << lang.append(term) << endl;\n  cout << \"Original: \" << lang <<\
    \ endl;\n  ```\n\n- 5. 使用 **==** 相等运算符比较两个不同的 **string** 值，然后比较两个匹配的 **string**\
    \ 值。\n\n  ```cpp\n  cout << \"Differ: \" << (lang == term) << endl;\n  cout <<\
    \ \"Match: \" << (lang == text) << endl << endl;\n  ```\n\n- 6. 现在，使用 **compare()**\
    \ 函数比较三个 **string** 值，检查它们的 ASCII 码总值。\n\n  ```cpp\n  cout << \"Match: \" << lang.compare(text)\
    \ << endl;\n  cout << \"Differ: \" << lang.compare(term) << endl;\n  cout << \"\
    Lower ASCII: \" << lang.compare(\"zzzz\") << endl;\n  ```\n\n- 7. 保存、编译并运行程序以查看输出。\n\
    \n```\n    C:\\MyPrograms>c++ compare.cpp -o compare.exe\n    C:\\MyPrograms>compare\n\
    \    Concatenated: C++ Programming\n    Original: C++ Programming\n    Appended:\
    \ C++ Programming\n    Original: C++ Programming\n    Differ: 0\n    Match: 1\n\
    \    Match: 0\n    Differ: 1\n    Lower ASCII: -1\n    C:\\MyPrograms>\n```\n\n\
    ![](img/bf8dbdfb89042fadbaa73b4160c74bac_70_0.png)\n\n+= 赋值运算符也可以用于追加字符串。\n\n\
    ![](img/bf8dbdfb89042fadbaa73b4160c74bac_70_1.png)\n\n在比较中会考虑字符顺序——因此将“za”与“az”比较可以看出，“za”的总值更大。就\
    \ ASCII 值而言，'a' 是 97，'z' 是 122。\n\n## 复制与交换字符串\n\n可以通过 **=** 赋值运算符，或通过 **<string>**\
    \ 库的 **assign()** 函数，将字符串值赋给 **string** 变量。该函数将要复制到变量中的 **string** 值指定为其括号内的参数。\n\
    \n可选地，**assign()** 函数可以通过将起始字符的位置指定为第二个参数、将要复制的字符数指定为第三个参数，只复制指定 **string** 值的一部分。\n\
    \n可以通过 **<string>** 库的 **swap()** 函数，将一个 **string** 变量的内容与另一个 **string** 变量的内容交换。在这种情况下，第一个变量接收第二个变量的内容，而第二个变量反过来接收第一个变量的内容。\n\
    \n![](img/bf8dbdfb89042fadbaa73b4160c74bac_71_0.png)\n\nswap.cpp\n\n- 1. 通过指定要包含的\
    \ C++ 库类和要使用的命名空间前缀，开始一个新程序。\n\n  ```cpp\n  #include <string>       // Include\
    \ string support.\n  #include <iostream>\n  using namespace std ;\n  ```\n\n-\
    \ 2. 添加一个 main 函数，其中包含最后的 **return** 语句，并声明三个 **string** 变量——其中一个已初始化。\n\n  ```cpp\n\
    \  int main()\n  {\n      string front ;\n      string back ;\n      string text\
    \ =\n      \"Always laugh when you can. It's cheap medicine.\" ;\n      // Add\
    \ more statements here.\n      return 0 ;\n  }\n  ```\n\n- 3. 在 main 函数中，插入一条语句，将已初始化的\
    \ **string** 变量的整个值赋给第一个未初始化的 **string** 变量。\n\n  ```cpp\n  front.assign( text\
    \ ) ;\n  ```\n\n- 4. 接下来，插入一条语句以输出新赋值的 **string** 值。\n\n  ```cpp\n  cout << endl\
    \ << \"Front: \" << front << endl ;\n  ```\n\n- 5. 现在，插入一条语句，仅将已初始化变量的前 27 个字符赋给第一个变量。\n\
    \n  ```cpp\n  front.assign( text, 0, 27 ) ;\n  ```\n\n- 6. 输出新赋值的 **string** 值。\n\
    \n  ```cpp\n  cout << endl << \"Front: \" << front << endl ;\n  ```\n\n- 7. 接下来，仅将已初始化的\
    \ **string** 变量的最后一部分赋给第二个未初始化的变量，从字符（元素）27 开始。\n\n  ```cpp\n  back.assign( text,\
    \ 27, text.size() ) ;\n  ```\n\n- 8. 现在，输出这个新赋值的 **string** 值。\n\n  ```cpp\n \
    \ cout << \"Back: \" << back << endl ;\n  ```\n\n- 9. 最后，交换第一个和第二个 **string**\
    \ 变量中包含的已赋值 **string** 值，然后输出交换后的值。\n\n  ```cpp\n  back.swap( front ) ;\n  cout\
    \ << endl << \"Front: \" << front << endl ;\n  cout << \"Back: \" << back << endl\
    \ ;\n  ```\n\n"
