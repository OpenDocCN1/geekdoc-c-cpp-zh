  md: "\n## Calling a virtual method\n\nA base class pointer that is bound to a specific\
    \ derived class can be used to call derived class methods that have been inherited\
    \ from the base class. Methods that are unique to the derived class must, however,\
    \ be called via an instance object.\n\nA base class pointer that is bound to a\
    \ specific derived class can also be used to explicitly call a method in the base\
    \ class using the :: scope resolution operator.\n\nMost usefully, an inherited\
    \ method in a derived class can override that in the base class when the base\
    \ method has been declared as a “virtual” method. This is just a regular method\
    \ declaration in the base class preceded by the **virtual** keyword. The declaration\
    \ of a virtual method indicates that the class will be used as a base class from\
    \ which another class will be derived, which may contain a method to override\
    \ the virtual base method.\n\n![](img/bf8dbdfb89042fadbaa73b4160c74bac_135_0.png)\n\
    \n### virtual.cpp\n\n- 1. Start a new program by specifying the C++ library classes\
    \ to include, and a namespace prefix to use.\n\n```cpp\n#include <iostream>\n\
    using namespace std;\n```\n\n- 2. Declare a base class named “Parent”, containing\
    \ a regular method declaration and a virtual method declaration.\n\n```cpp\nclass\
    \ Parent\n{\n    public:\n        void Common() const\n        { cout << \"I am\
    \ part of this family, \"; }\n\n        virtual void Identify() const\n      \
    \  { cout << \"I am the parent\" << endl; }\n};\n```\n\n- 3. Declare a derived\
    \ class named “Child”, containing a method to override the virtual base method.\n\
    \n```cpp\nclass Child : public Parent\n{\n    public:\n        void Identify()\
    \ const\n        { cout << \"I am the child\" << endl; }\n};\n```\n\n![](img/bf8dbdfb89042fadbaa73b4160c74bac_135_1.png)\n\
    \nPointers to a base class cannot be used to call non-inherited methods in a derived\
    \ class.\n\n- 4. Declare a “Grandchild” class, derived from the “Child” class,\
    \ containing a method to override the virtual base method and a regular method\
    \ declaration.\n\n```cpp\nclass Grandchild : public Child\n{\n    public:\n  \
    \      void Identify() const\n        { cout << \"I am the grandchild\" << endl;\
    \ }\n\n        void Relate() const\n        { cout << \"Grandchild has parent\
    \ and grandparent\"; }\n};\n```\n\n## Directing method calls\n\nThe great advantage\
    \ of polymorphism with multiple derived class objects is that calls to methods\
    \ of the same name are directed to the appropriate overriding method.\n\nA base\
    \ class may contain only virtual methods which each derived class may override\
    \ with their own methods, but base class methods can still be called explicitly\
    \ using the :: scope resolution operator. This can allow inconsistencies, however\
    \ – this example would seem to imply that chickens can fly!\n\n![](img/bf8dbdfb89042fadbaa73b4160c74bac_137_0.png)\n\
    \n### birds.cpp\n\n- 1. Start a new program by specifying the C++ library classes\
    \ to include, and a namespace prefix to use\n\n```cpp\n#include <iostream>\nusing\
    \ namespace std;\n```\n\n- 2. Declare a base class named “Bird”, containing two\
    \ virtual method declarations\n\n```cpp\nclass Bird\n{\npublic:\n    virtual void\
    \ Talk() const\n    { cout << \"A bird talks...\" << endl; }\n\n    virtual void\
    \ Fly() const\n    { cout << \"A bird flies...\" << endl; }\n};\n```\n\n- 3. Declare\
    \ a derived class named “Pigeon”, containing two methods to override those in\
    \ the base class\n\n```cpp\nclass Pigeon : public Bird\n{\npublic:\n    void Talk()\
    \ const\n    { cout << \"Cool! Cool!\" << endl; }\n\n    void Fly() const\n  \
    \  { cout << \"A pigeon flies away...\" << endl; }\n};\n```\n\n![](img/bf8dbdfb89042fadbaa73b4160c74bac_137_1.png)\n\
    \nOverriding methods in derived class may, optionally, include the virtual prefix\
    \ – as a reminder it is overriding a base class method.\n\n- 4. Declare a derived\
    \ class named “Chicken”, containing two methods to override those in the base\
    \ class\n\n```cpp\nclass Chicken : public Bird\n{\npublic:\n    void Talk() const\n\
    \    { cout << \"Cluck! Cluck!\" << endl; }\n\n    void Fly() const\n    { cout\
    \ << \"I\\'m just a chicken – I can\\'t fly!\" << endl; }\n};\n```\n\n- 5. Declare\
    \ a main method containing a final **return** statement and creating base class\
    \ pointers binding derived classes\n\n```cpp\nint main()\n{\n    Bird* pPigeon\
    \ = new Pigeon;\n    Bird* pChicken = new Chicken;\n    // Add more statements\
    \ here.\n    return 0;\n}\n```\n\n![](img/bf8dbdfb89042fadbaa73b4160c74bac_138_0.png)\n\
    \n- 6. In the main method, insert calls to each method\n\n```cpp\npPigeon->Talk();\n\
    pPigeon->Fly();\npChicken->Talk();\npChicken->Fly();\npPigeon->Bird::Talk();\n\
    pChicken->Bird::Fly();    // Inappropriate call.\n```\n\n- 7. Save, compile, and\
    \ run the program to see the output\n\n![](img/bf8dbdfb89042fadbaa73b4160c74bac_138_1.png)\n\
    \n![](img/bf8dbdfb89042fadbaa73b4160c74bac_138_2.png)\n\nThe backslash \\ character\
    \ is required to escape the apostrophe in strings.\n\n## Providing capability\
    \ classes\n\nClasses whose sole purpose is to allow other classes to be derived\
    \ from them are known as “capability classes” – they provide capabilities to the\
    \ derived classes.\n\nCapability classes generally contain no data, but merely\
    \ declare a number of virtual methods that can be overridden in their derived\
    \ classes.\n\nThe following example builds upon the previous example to demonstrate\
    \ how the “Bird” class can be better written as a capability class. Its methods\
    \ no longer contain output statements, but return a -1 (error) value if they are\
    \ called explicitly.\n\nIt is necessary to change the return type of those methods\
    \ from void to int and these changes must also be reflected in each overriding\
    \ method in the derived classes.\n\n![](img/bf8dbdfb89042fadbaa73b4160c74bac_139_0.png)\n\
    \n### capability.cpp\n\n- 1. Start a new program by specifying the C++ library\
    \ classes to include, and a namespace prefix to use\n\n```cpp\n#include <iostream>\n\
    using namespace std;\n```\n\n- 2. Declare a base capability class named “Bird”,\
    \ containing two virtual method declarations that will signal an error if called\
    \ explicitly\n\n```cpp\nclass Bird\n{\n  public:\n    virtual int Talk() const\
    \ { return -1; }\n    virtual int Fly() const { return -1; }\n};\n```\n\n- 3.\
    \ Declare a derived class named “Pigeon”, containing two methods to override those\
    \ in the base class\n\n```cpp\nclass Pigeon : public Bird\n{\n  public:\n    int\
    \ Talk() const\n    { cout << \"Coo! Coo!\" << endl; return 0; }\n\n    int Fly()\
    \ const\n    { cout << \"A pigeon flies away...\" << endl; return 0; }\n};\n```\n\
    \n![](img/bf8dbdfb89042fadbaa73b4160c74bac_139_1.png)\n\nThe return value of overriding\
    \ methods in derived classes must match those declared in the base class.\n\n\
    - 4. Declare a derived class named “Chicken” containing two methods to override\
    \ those in the base class\n\n```cpp\nclass Chicken : public Bird\n{\n  public:\n\
    \    int Talk() const\n    { cout << \"Cluck! Cluck!\" << endl; return 0; }\n\n\
    \    int Fly() const\n    { cout << \"I\\'m just a chicken – I can\\'t fly!\"\
    \ << endl; return 0; }\n};\n```\n\n- 5. Declare a main method creating base class\
    \ pointers binding the derived classes\n\n```cpp\nint main()\n{\n    Bird* pPigeon\
    \ = new Pigeon;\n    Bird* pChicken = new Chicken;\n```\n\n- 6. In the main method,\
    \ insert method calls and a statement to terminate the program when an error is\
    \ met by explicitly calling a base class method\n\n```cpp\npPigeon->Talk();\n\
    pChicken->Talk();\n\npPigeon->Bird::Talk();\nif (-1) { cout << \"Error! - Program\
    \ ended.\"\n                         << endl; return 0; }\n\npPigeon->Fly(); \
    \      // Call will not be made.\npChicken->Fly();      // Call will not be made.\n\
    return 0;              // Statement will not be executed\n}\n```\n\n- 7. Save,\
    \ compile, and run the program to see the output\n\n![](img/bf8dbdfb89042fadbaa73b4160c74bac_140_0.png)\n\
    \n![](img/bf8dbdfb89042fadbaa73b4160c74bac_140_1.png)\n\nCapability class methods\
    \ are intended to be overridden in derived classes — they should not be called\
    \ explicitly.\n\n![](img/bf8dbdfb89042fadbaa73b4160c74bac_140_2.png)\n\nRefer\
    \ back to here for more details on error handling.\n"
  mdcn: "\n## 调用虚方法\n\n绑定到特定派生类的基类指针可用于调用派生类中继承自基类的方法。然而，派生类特有的方法必须通过实例对象调用。\n\n绑定到特定派生类的基类指针也可用于通过\
    \ :: 作用域解析运算符显式调用基类中的方法。\n\n最有用的情形是，当基方法被声明为“虚”方法时，派生类中的继承方法可以覆盖基类中的该方法。这只是在基类中一个常规方法声明前加上\
    \ **virtual** 关键字。虚方法的声明表明该类将用作基类，另一个类将从它派生，而派生类可能包含一个覆盖该虚基方法的方法。\n\n![](img/bf8dbdfb89042fadbaa73b4160c74bac_135_0.png)\n\
    \n### virtual.cpp\n\n- 1. 通过指定要包含的 C++ 库类和要使用的命名空间前缀，启动一个新程序。\n\n```cpp\n#include\
    \ <iostream>\nusing namespace std;\n```\n\n- 2. 声明一个名为“Parent”的基类，其中包含一个常规方法声明和一个虚方法声明。\n\
    \n```cpp\nclass Parent\n{\n    public:\n        void Common() const\n        {\
    \ cout << \"I am part of this family, \"; }\n\n        virtual void Identify()\
    \ const\n        { cout << \"I am the parent\" << endl; }\n};\n```\n\n- 3. 声明一个名为“Child”的派生类，其中包含一个用于覆盖虚基方法的方法。\n\
    \n```cpp\nclass Child : public Parent\n{\n    public:\n        void Identify()\
    \ const\n        { cout << \"I am the child\" << endl; }\n};\n```\n\n![](img/bf8dbdfb89042fadbaa73b4160c74bac_135_1.png)\n\
    \n基类指针不能用于调用派生类中非继承的方法。\n\n- 4. 声明一个“Grandchild”类，它派生自“Child”类，包含一个用于覆盖虚基方法的方法和一个常规方法声明。\n\
    \n```cpp\nclass Grandchild : public Child\n{\n    public:\n        void Identify()\
    \ const\n        { cout << \"I am the grandchild\" << endl; }\n\n        void\
    \ Relate() const\n        { cout << \"Grandchild has parent and grandparent\"\
    ; }\n};\n```\n\n## 定向方法调用\n\n使用多个派生类对象的多态性的最大优点是，对同名方法的调用会被定向到适当的覆盖方法。\n\n基类可以只包含虚方法，每个派生类可以用自己的方法覆盖它们，但基类方法仍可通过\
    \ :: 作用域解析运算符显式调用。然而，这可能导致不一致——这个示例似乎暗示鸡能飞！\n\n![](img/bf8dbdfb89042fadbaa73b4160c74bac_137_0.png)\n\
    \n### birds.cpp\n\n- 1. 通过指定要包含的 C++ 库类和要使用的命名空间前缀，启动一个新程序\n\n```cpp\n#include\
    \ <iostream>\nusing namespace std;\n```\n\n- 2. 声明一个名为“Bird”的基类，其中包含两个虚方法声明\n\n\
    ```cpp\nclass Bird\n{\npublic:\n    virtual void Talk() const\n    { cout << \"\
    A bird talks...\" << endl; }\n\n    virtual void Fly() const\n    { cout << \"\
    A bird flies...\" << endl; }\n};\n```\n\n- 3. 声明一个名为“Pigeon”的派生类，其中包含两个用于覆盖基类中方法的方法\n\
    \n```cpp\nclass Pigeon : public Bird\n{\npublic:\n    void Talk() const\n    {\
    \ cout << \"Cool! Cool!\" << endl; }\n\n    void Fly() const\n    { cout << \"\
    A pigeon flies away...\" << endl; }\n};\n```\n\n![](img/bf8dbdfb89042fadbaa73b4160c74bac_137_1.png)\n\
    \n派生类中的覆盖方法可以选择性地包含 virtual 前缀——以提醒它正在覆盖基类方法。\n\n- 4. 声明一个名为“Chicken”的派生类，其中包含两个用于覆盖基类中方法的方法\n\
    \n```cpp\nclass Chicken : public Bird\n{\npublic:\n    void Talk() const\n   \
    \ { cout << \"Cluck! Cluck!\" << endl; }\n\n    void Fly() const\n    { cout <<\
    \ \"I\\'m just a chicken – I can\\'t fly!\" << endl; }\n};\n```\n\n- 5. 声明一个 main\
    \ 方法，其中包含最后的 **return** 语句，并创建绑定派生类的基类指针\n\n```cpp\nint main()\n{\n    Bird* pPigeon\
    \ = new Pigeon;\n    Bird* pChicken = new Chicken;\n    // Add more statements\
    \ here.\n    return 0;\n}\n```\n\n![](img/bf8dbdfb89042fadbaa73b4160c74bac_138_0.png)\n\
    \n- 6. 在 main 方法中，插入对每个方法的调用\n\n```cpp\npPigeon->Talk();\npPigeon->Fly();\npChicken->Talk();\n\
    pChicken->Fly();\npPigeon->Bird::Talk();\npChicken->Bird::Fly();    // Inappropriate\
    \ call.\n```\n\n- 7. 保存、编译并运行程序以查看输出\n\n![](img/bf8dbdfb89042fadbaa73b4160c74bac_138_1.png)\n\
    \n![](img/bf8dbdfb89042fadbaa73b4160c74bac_138_2.png)\n\n反斜杠 \\ 字符用于在字符串中转义撇号。\n\
    \n## 提供能力类\n\n其唯一目的是允许其他类从它们派生的类称为“能力类”——它们为派生类提供能力。\n\n能力类通常不包含数据，而只是声明一些可在其派生类中覆盖的虚方法。\n\
    \n以下示例基于前一个示例，演示如何将“Bird”类更好地编写为能力类。它的方法不再包含输出语句，但如果被显式调用，则返回 -1（错误）值。\n\n有必要将这些方法的返回类型从\
    \ void 改为 int，并且这些更改也必须反映在派生类中的每个覆盖方法中。\n\n![](img/bf8dbdfb89042fadbaa73b4160c74bac_139_0.png)\n\
    \n### capability.cpp\n\n- 1. 通过指定要包含的 C++ 库类和要使用的命名空间前缀，启动一个新程序\n\n```cpp\n#include\
    \ <iostream>\nusing namespace std;\n```\n\n- 2. 声明一个名为“Bird”的基能力类，其中包含两个虚方法声明，如果被显式调用将发出错误信号\n\
    \n```cpp\nclass Bird\n{\n  public:\n    virtual int Talk() const { return -1;\
    \ }\n    virtual int Fly() const { return -1; }\n};\n```\n\n- 3. 声明一个名为“Pigeon”的派生类，其中包含两个用于覆盖基类中方法的方法\n\
    \n```cpp\nclass Pigeon : public Bird\n{\n  public:\n    int Talk() const\n   \
    \ { cout << \"Coo! Coo!\" << endl; return 0; }\n\n    int Fly() const\n    { cout\
    \ << \"A pigeon flies away...\" << endl; return 0; }\n};\n```\n\n![](img/bf8dbdfb89042fadbaa73b4160c74bac_139_1.png)\n\
    \n派生类中覆盖方法的返回值必须与基类中声明的返回值匹配。\n\n- 4. 声明一个名为“Chicken”的派生类，其中包含两个用于覆盖基类中方法的方法\n\
    \n```cpp\nclass Chicken : public Bird\n{\n  public:\n    int Talk() const\n  \
    \  { cout << \"Cluck! Cluck!\" << endl; return 0; }\n\n    int Fly() const\n \
    \   { cout << \"I\\'m just a chicken – I can\\'t fly!\" << endl; return 0; }\n\
    };\n```\n\n- 5. 声明一个 main 方法，创建绑定这些派生类的基类指针\n\n```cpp\nint main()\n{\n    Bird*\
    \ pPigeon = new Pigeon;\n    Bird* pChicken = new Chicken;\n```\n\n- 6. 在 main\
    \ 方法中，插入方法调用，以及一条当通过显式调用基类方法遇到错误时终止程序的语句\n\n```cpp\npPigeon->Talk();\npChicken->Talk();\n\
    \npPigeon->Bird::Talk();\nif (-1) { cout << \"Error! - Program ended.\"\n    \
    \                     << endl; return 0; }\n\npPigeon->Fly();       // Call will\
    \ not be made.\npChicken->Fly();      // Call will not be made.\nreturn 0;   \
    \           // Statement will not be executed\n}\n```\n\n- 7. 保存、编译并运行程序以查看输出\n\
    \n![](img/bf8dbdfb89042fadbaa73b4160c74bac_140_0.png)\n\n![](img/bf8dbdfb89042fadbaa73b4160c74bac_140_1.png)\n\
    \n能力类方法旨在在派生类中被覆盖——不应显式调用它们。\n\n![](img/bf8dbdfb89042fadbaa73b4160c74bac_140_2.png)\n\
    \n有关错误处理的更多详细信息，请回看这里。\n"
