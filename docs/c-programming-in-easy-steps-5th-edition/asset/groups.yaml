    \n![](img/bf8dbdfb89042fadbaa73b4160c74bac_66_2.png)\n\nA non-empty **stringstream**\
    \ object has bit flags indicating its status as good, bad, eof, or fail – these\
    \ should be cleared before re-use by the **stringstream** object's `clear()` function,\
    \ as demonstrated here.\n"
