    \ninline int add ( int x, int y ) { return ( x + y ) ; }\n\n#endif\n```\n```\n\
    \n+   8. Save the modified file, then compile and run the program – compilation\
    \ now succeeds because the inclusion guard prevents the apparent re-definition\
    \ of the add function\n\n![](img/bf8dbdfb89042fadbaa73b4160c74bac_160_1.png)\n\
    \n![](img/bf8dbdfb89042fadbaa73b4160c74bac_160_2.png)\n\nUse the conventional\
    \ naming scheme, where the macro name resembles the file name, to avoid conflicts.\n\
    \n![](img/bf8dbdfb89042fadbaa73b4160c74bac_160_3.png)\n\nAll header files should\
    \ contain header guards – add a **TRIPLE_H** macro to the triple.h file."
  - "[PAGE 161]\n\n# Using macro functions\n\nThe **#define** directive can be used\
    \ to create macro functions that will be substituted in the source code before\
    \ compilation.\n\nA preprocessor function declaration comprises a macro name,\
    \ immediately followed by parentheses containing the function’s arguments – it\
    \ is important not to leave any space between the name and the parentheses. The\
    \ declaration is then followed by the function definition within another set of\
    \ parentheses. For example, a preprocessor macro function to half an argument\
    \ looks like this:\n\n```\n#define HALF(n) (n / 2)\n```\n\nCare should be taken\
    \ when using macro functions, because unlike regular C++ functions, they do not\
    \ perform any kind of type checking – so it’s quite easy to create a macro that\
    \ causes errors. For this reason, inline functions are usually preferable to macro\
    \ functions, but because macros directly substitute their code, they avoid the\
    \ overhead of a function call – so the program runs faster. The resulting difference\
    \ can be seen in the first temporary file created during the compilation process:\n\
    \n![](img/bf8dbdfb89042fadbaa73b4160c74bac_161_0.png)\n\n+   1. Start a new program\
    \ by defining two macro functions to manipulate a single argument\n+   \n+   ```cpp\n\
    +   #define SQUARE(n) (n * n)\n+   #define CUBE(n) (n * n * n)\n+   ```\n\n+ \
    \  2. After the macro function definitions, specify the library classes to include,\
    \ and a namespace prefix to use\n+   \n+   ```cpp\n+   #include <iostream>\n+\
    \   using namespace std;\n+   ```\n\n+   3. Next, declare two inline functions\
    \ to manipulate a single argument – just like the macro functions defined above\n\
    +   \n+   ```cpp\n+   inline int square(int n) { return (n * n); }\n+   inline\
    \ int cube(int n) { return (n * n * n); }\n+   ```\n\n+   4. Add a main function\
    \ containing a final return statement\n+   \n+   ```cpp\n+   int main()\n+   {\n\
    +       // Program code goes here.\n+       return 0;\n+   }\n+   ```\n\n+   5.\
    \ At the start of the main function block, declare and initialize an integer variable\n\
    +   \n+   ```cpp\n+   int num = 5;\n+   ```\n\n+   6. Now, insert statements to\
    \ call each macro function and each comparable inline function\n+   \n+   ```cpp\n\
    +   cout << \"Macro SQUARE: \" << SQUARE(num) << endl;\n+   cout << \"Inline square:\
    \ \" << square(num) << endl;\n+   cout << \"Macro CUBE: \" << CUBE(num) << endl;\n\
    +   cout << \"Inline cube: \" << cube(num) << endl;\n+   ```\n\n+   7. Save the\
    \ file, then compile the program, saving the temporary files and run the program\n\
    +   \n+   ```bash\n+   c++ macro.cpp -save-temps -o macro.exe\n+   ```"
