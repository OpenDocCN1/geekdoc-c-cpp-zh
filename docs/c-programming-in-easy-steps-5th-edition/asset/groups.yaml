    \n在键入 main 方法的最后一个右花括号 } 后，务必按回车键添加换行符——你的编译器可能坚持要求源文件以换行符结尾。\n\n可以单独查看程序代码[此处](here)的各个部分，以更清楚地理解每一部分：\n\
