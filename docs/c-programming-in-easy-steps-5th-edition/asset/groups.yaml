    ![](img/bf8dbdfb89042fadbaa73b4160c74bac_130_2.png)\n\nThe overriding method declared\
    \ in the derived class hides both overloaded methods in the base class. Try calling\
    \ **enrique.speak()** – the compiler will complain there is no matching method\
    \ for that call.\n\n## 8 Harnessing polymorphism\n\nThis chapter demonstrates\
    \ how to separate programs into modular components and introduces the topic of\
    \ polymorphism – the third principle of C++ Object Oriented Programming.\n\n-\
