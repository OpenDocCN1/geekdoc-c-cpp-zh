    \ iteration: \" << j << endl;\n    }\n    ```\n\n- 8. Save, compile, and run the\
    \ program again to see the inner loop fully execute on each iteration of the outer\
    \ loop.\n\n![](img/bf8dbdfb89042fadbaa73b4160c74bac_48_1.png)\n\n![](img/bf8dbdfb89042fadbaa73b4160c74bac_48_2.png)\n\
    \nAlternatively, a **for** loop counter can count down counter value on each iteration\
