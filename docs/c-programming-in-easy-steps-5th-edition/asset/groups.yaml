    \ condition is encountered that crashes the program. For example, the program\
    \ may request a number, which the user enters in word form rather than in numeric\
    \ form.\n\n![](img/bf8dbdfb89042fadbaa73b4160c74bac_89_0.png)\n\nThe C++ standards\
    \ allow the compiler to spot “compile-time” errors involving syntax and logic,\
