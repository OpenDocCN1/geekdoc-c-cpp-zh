    \ the counter value on each of three iterations\n\n    ```cpp\n    for ( i = 1\
    \ ; i < 4 ; i++ )\n    {\n        cout << \"Loop iteration: \" << i << endl ;\n\
    \    }\n    ```\n\n- 5. Save, compile, and run the program to see the output\n\
    \n![](img/bf8dbdfb89042fadbaa73b4160c74bac_48_0.png)\n\n- 6. Now, edit the variable\
