    # # Pointing to classes


    The three cornerstones of Object Oriented Programming (OOP) are encapsulation,
    inheritance, and polymorphism. Examples in the previous chapter have demonstrated
    how data can be encapsulated within a C++ class, and how derived classes inherit
    the properties of their base class. This chapter introduces the final cornerstone
    principle of polymorphism.


    ![](img/bf8dbdfb89042fadbaa73b4160c74bac_133_0.png)


    The term “polymorphism” (from Greek, meaning “many forms”) describes the ability
    to assign a different meaning, or purpose, to an entity according to its context.


    In C++, overloaded operators can be described as polymorphic. For example, the
    * character can represent either the multiply operator or the dereference operator,
    according to its context. Similarly, the + character can represent either the
    add operator or the concatenate operator, according to its context.


    More importantly, C++ class methods can also be polymorphic. The key to understanding
    polymorphism with classes is to recognize that a base class pointer can be created
    that is also bound to a particular derived class by association.


    A pointer to a base class can be assigned the memory address of a derived class
    to provide a “context” – to uniquely identify that derived class. For example,
    with a Base base class and a derived Sub class, a pointer can be created like
    this:


    ```

    ~~~cpp

    Sub inst ;

    Base* pSub = &inst ;

    ~~~

    ```


    or more simply using the new keyword, like this:


    ```

    ~~~cpp

    Base* pSub = new Sub ;

    ~~~

    ```


    ![](img/bf8dbdfb89042fadbaa73b4160c74bac_133_1.png)


    Turn back to Chapter Six for more on pointers.


    Where there are multiple derived classes, base class pointers can be created binding
    each derived class by its unique memory address – which can be revealed using
    the addressof & operator.


    ![](img/bf8dbdfb89042fadbaa73b4160c74bac_133_2.png)


    +   1. Start a new program by specifying the C++ library classes to include, and
