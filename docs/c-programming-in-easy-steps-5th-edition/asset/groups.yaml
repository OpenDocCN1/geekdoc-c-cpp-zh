    \    ```cpp\n    cout << \"Assign values: \";\n    cout << \"a = \" << (a = 8)\
    \ << \" ; \";\n    cout << \"b = \" << (b = 4);\n    ```\n\n- 5. Now, insert statements\
    \ to output combined assigned values\n\n    ```cpp\n    cout << endl << \"Add\
    \ & assign: \";\n    cout << \"a += b (8 += 4) a = \" << (a += b);\n    cout <<\
    \ endl << \"Subtract & assign: \";\n    cout << \"a -= b (12 -= 4) a = \" << (a\
    \ -= b);\n    cout << endl << \"Multiply & assign: \";\n    cout << \"a *= b (8\
    \ *= 4) a = \" << (a *= b);\n    cout << endl << \"Divide & assign: \";\n    cout\
    \ << \"a /= b (32 /= 4) a = \" << (a /= b);\n    cout << endl << \"Modulus & assign:\
    \ \";\n    cout << \"a %= b (8 %= 4) a = \" << (a %= b);\n    ```\n\n- 6. Save,\
    \ compile, and run the program to see the output\n\n![](img/bf8dbdfb89042fadbaa73b4160c74bac_28_0.png)\n\
