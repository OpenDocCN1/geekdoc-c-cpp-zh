    ```cpp\nint main()\n{\n    cout << \"9 + 3 = \" << add(9, 3) << endl ;\n    cout\
    \ << \"9 x 3 = \" << triple(9) << endl ;\n    return 0 ;\n}\n```\n```\n\n+   6.\
    \ Save the files, then attempt to compile the program to see compilation fail\
