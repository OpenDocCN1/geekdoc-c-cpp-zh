    \ text, 27, text.size() ) ;\n  ```\n\n- 8. Now, output this newly assigned **string**\
    \ value.\n\n  ```cpp\n  cout << \"Back: \" << back << endl ;\n  ```\n\n- 9. Finally,\
    \ exchange the assigned **string** values contained in the first and second **string**\
