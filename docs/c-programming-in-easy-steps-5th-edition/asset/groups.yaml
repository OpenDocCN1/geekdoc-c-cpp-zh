    \n**cin.ignore()** 函数的参数指定它应丢弃最多 256 个字符，并在遇到换行符时停止。\n\n## 解决字符串问题\n\n当你需要将**字符串**变量转换为其他数据类型时（例如要用这些值执行算术运算），就会出现问题。由于\
