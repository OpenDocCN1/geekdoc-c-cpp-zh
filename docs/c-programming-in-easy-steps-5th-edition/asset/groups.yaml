    \ `<=` | 小于或等于 |\n\n**==** 相等运算符比较两个操作数，如果两者的值相等则返回 **真 (1)**，否则返回 **假 (0)** 值。如果两者是相同的数字，则它们相等；或者如果两者是字符，则按数值比较它们的\
    \ ASCII 码值。相反，**!=** 不等运算符在两个操作数不相等时返回 **真 (1)**，使用与 **==** 相等运算符相同的规则，否则返回 **假\
    \ (0)**。相等和不等运算符可用于测试两个变量的状态，以便在程序中执行条件分支。\n\n![](img/bf8dbdfb89042fadbaa73b4160c74bac_29_0.png)\n\
    \nA-Z 大写字符的 ASCII 码值为 65-90，a-z 小写字符的 ASCII 码值为 97-122。\n\n**>** “大于”运算符比较两个操作数，如果第一个的值大于第二个则返回\
    \ **真 (1)**，如果相等或较小则返回 **假 (0)**。**<** “小于”运算符进行相同的比较，但如果第一个操作数的值小于第二个则返回 **真\
    \ (1)**，否则返回 **假 (0)**。“大于”或“小于”运算符常用于测试循环中迭代计数器的值。\n\n在 **>** “大于”或 **<** “小于”运算符后添加\
    \ **=** 运算符，使其在两个操作数的值完全相等时也返回 **真 (1)**。\n\n下面的程序演示了每种比较运算。\n\n```cpp\ncomparison.cpp\n\
    ```\n\n- 1. 通过指定要包含的 C++ 库类和要使用的命名空间前缀来启动新程序\n\n    ```cpp\n    #include <iostream>\n\
    \    using namespace std;\n    ```\n\n- 2. 添加一个包含最后 **return** 语句的 main 函数\n\n\
