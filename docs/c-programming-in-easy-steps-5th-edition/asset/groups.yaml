    \ << endl;\n    ```\n\n- 5. Now, insert statements to output the result of both\
    \ postfix and prefix increment operations\n\n    ```cpp\n    cout << \"Postfix\
    \ increment: \" << a++ << endl;\n    cout << \"Postfix result: \" << a << endl;\n\
    \    cout << \"Prefix increment: \" << ++b << endl;\n    cout << \"Prefix result:\
    \ \" << b << endl;\n    ```\n\n- 6. Save, compile, and run the program to see\
    \ the output.\n\n![](img/bf8dbdfb89042fadbaa73b4160c74bac_26_0.png)\n\n![](img/bf8dbdfb89042fadbaa73b4160c74bac_26_1.png)\n\
    \nRemember that a prefix operator changes the variable value immediately – a postfix\
    \ operator changes the value subsequently.\n\n### Assigning values\n\nThe operators\
    \ that are used in C++ programming to assign values are listed in the table below.\
    \ All except the simple = assignment operator are a shorthand form of a longer\
    \ expression so each equivalent is given for clarity:\n\n| Operator: | Example:\
    \ | Equivalent: |\n|---|---|---|\n| = | a = b | a = b |\n| += | a += b | a = (a\
    \ + b) |\n| -= | a -= b | a = (a - b) |\n| *= | a *= b | a = (a * b) |\n| /= |\
    \ a /= b | a = (a / b) |\n| %= | a %= b | a = (a % b) |\n\nIn the example above,\
    \ the variable named “a” is assigned the value that is contained in the variable\
    \ named “b” – so that becomes the new value stored in the **a** variable.\n\n\
    The **+=** operator is useful to add a value onto an existing value that is stored\
    \ in the **a** variable.\n\nIn the table example, the **+=** operator first adds\
    \ the value contained in variable **a** to the value contained in variable **b**.\
    \ It then assigns the result to become the new value stored in variable **a**.\n\
    \n![](img/bf8dbdfb89042fadbaa73b4160c74bac_27_0.png)\n\nIt is important to regard\
    \ the **=** operator to mean “assign” rather than “equals” to avoid confusion\
