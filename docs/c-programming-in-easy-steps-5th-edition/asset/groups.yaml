    \ code.\n\n![](img/bf8dbdfb89042fadbaa73b4160c74bac_184_2.png)\n\nRemember that\
    \ the outer **<StackPanel>** in this app contains an **<Image>** and a nested\
    \ **<StackPanel>** displayed horizontally, side-by-side. If displayed vertically,\
    \ they should appear one above the other.\n\n![](img/bf8dbdfb89042fadbaa73b4160c74bac_185_0.png)\n\
    \n- 4. Select **x64** and **Local Machine** to run the app for a PC device once\
