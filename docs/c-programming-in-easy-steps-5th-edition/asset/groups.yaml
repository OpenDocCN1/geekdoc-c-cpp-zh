  - '[PAGE 12]


    `<>` angled brackets. The next line is the “using directive” that allows functions
    in the specified namespace to be used without their namespace prefix. Functions
    of the **iostream** library are within the **std** namespace – so this **using**
    directive allows functions such as **std::cout** and **std::endl** to be simply
    written as **cout** and **endl**.


    +   - **Comments** – these should be used to make the code more easily understood
    by others, and by yourself when revisiting the code later. In C++ programming,
    everything on a single line after a `//` double-slash is ignored by the compiler.


    +   - **Main function** – this is the mandatory entry point of every C++ program.
    Programs may contain many functions, but they must always contain one named **main**,
    otherwise the compiler will not compile the program. Optionally, the parentheses
    after the function name may specify a comma-separated list of “argument” values
    to be used by that function. Following execution, the function must return a value
    to the operating system of the data type specified in its declaration – in this
    case, an **int** (integer) value.


    +   - **Statements** – these are the actions that the program will execute when
    it runs. Each statement must be terminated by a semi-colon, in the same way that
    English language sentences must be terminated by a period (full stop). Here, the
    first statement calls upon the **cout** library function to output text and an
    **endl** carriage return. These are directed to standard output by the `<<` output
    stream operator. Notice that text strings in C++ must always be enclosed within
    double quotes. The final statement employs the C++ **return** keyword to return
    a zero integer value to the operating system – as required by the main function
    declaration. Traditionally, returning a zero value indicates that the program
    executed successfully.


    ![](img/bf8dbdfb89042fadbaa73b4160c74bac_12_0.png)


    The C++ compiler also supports multiple-line C-style comments between `/*` and
    `*/` but these should only ever be used in C++ programming to “comment-out” sections
    of code when debugging.


    ![](img/bf8dbdfb89042fadbaa73b4160c74bac_12_1.png)


    Notice how the program code is formatted using spacing and indentation (collectively
    known as whitespace) to improve readability. All whitespace is ignored by the
    C++ compiler.'
