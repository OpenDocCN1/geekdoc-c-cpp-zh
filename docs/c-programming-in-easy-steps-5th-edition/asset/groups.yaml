    \n直接操作调用函数中变量的函数不需要**return**语句。\n\n## 比较指针和引用\n\n指针和引用都可用于引用变量值，并按引用而不是按值将它们传递给函数。从技术上讲，按引用传递比按值传递更高效，因此应鼓励使用指针和引用。\n\
    \n决定使用指针还是引用，取决于程序需求。C++程序员通常尽可能使用引用，因为引用比指针更容易使用和理解。然而，引用必须遵守某些规则，这些规则可能使指针的使用成为必要：\n\
