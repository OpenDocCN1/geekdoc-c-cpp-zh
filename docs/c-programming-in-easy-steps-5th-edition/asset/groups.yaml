    \ from C++!\";\ncout << myMessage;\n```\n\n另外，为了标识步骤中描述的每个源代码文件，步骤旁边的页边空白处会出现一个彩色图标和文件名：\n\
    \n![](img/bf8dbdfb89042fadbaa73b4160c74bac_5_0.png)\n\n![](img/bf8dbdfb89042fadbaa73b4160c74bac_5_1.png)\n\
    \n### 获取源代码\n\n为方便起见，我已将本书中示例的源代码文件整合到一个 ZIP 压缩包中，提供 Windows 和 Linux 平台版本，以及 Microsoft\
    \ Visual Studio IDE 版本。您可以按照以下简单步骤获取完整压缩包：\n\n- 1. 浏览 www.ineasysteps.com，然后进入\
    \ Free Resources（免费资源）并选择 Downloads（下载）部分\n- 2. 在列表中找到《C++ 编程入门（第5版）》，然后点击标题为“所有代码示例”的超链接以下载压缩包\n\
    - 3. 然后，将压缩包内容解压到计算机上的任意方便位置\n\n我衷心希望您能发现 C++ 编程强大且富有表现力的可能性，并像我撰写本书时一样乐在其中。\n\
    \n## 1 开始入门\n\n欢迎来到激动人心的 C++ 编程世界。本章演示如何创建简单的 C++ 程序，以及如何在程序中存储数据。\n\n- C++ 简介\n\
    - 安装编译器\n- 编写第一个程序\n- 编译与运行程序\n- 创建变量\n- 使用变量数组\n- 使用向量数组\n- 声明常量\n- 本章小结\n\n\
    ### C++ 简介\n\nC++ 是 C 编程语言的扩展，C 语言最早由丹尼斯·里奇于 1972 年在 UNIX 操作系统上实现。C 是一种灵活且至今仍广受欢迎的编程语言，广泛应用于从微控制器到最先进科学系统的众多平台。\n\
    \n![](img/bf8dbdfb89042fadbaa73b4160c74bac_7_0.png)\n\n一种强大的编程语言（读作“see plus plus”），旨在让您表达想法。\n\
    \nC++ 由比雅尼·斯特劳斯特鲁普博士于 1983 年至 1985 年间在新泽西州的 AT&T 贝尔实验室工作时开发。他在原始 C 语言的基础上添加了功能，创造了他称之为“带类的\
    \ C”的语言。这些类定义了具有特定功能的编程对象，将 C 的过程式特性转变为 C++ 的面向对象编程语言。\n\nC 编程语言之所以命名为 C，是因为它继承了早期于\
    \ 1970 年左右推出的名为“B”的编程语言。名称“C++”体现了程序员的一些幽默，因为编程中的 ++ 自增运算符表示 C++ 是 C 语言的扩展。\n\n\
    与 C 一样，C++ 不依赖于平台，因此可以在任何操作系统上创建程序。本书中的大多数插图都显示 Windows 操作系统上的输出，纯粹是因为它是最广泛使用的桌面平台。这些示例也可以在\
    \ Linux 或 macOS 等其他平台上创建。\n\n### 为什么要学习 C++ 编程？\n\nC++ 语言深受许多专业程序员的青睐，因为它允许他们创建快速、紧凑、健壮且可移植的程序。\n\
    \n使用现代的 C++ 集成开发环境（IDE），例如 Microsoft 的 Visual Studio Community Edition，程序员可以快速创建复杂的应用程序。但要最大程度地发挥这些工具的作用，程序员必须首先深入了解\
    \ C++ 语言本身。\n\n本书是 C++ 编程入门，通过程序代码示例及其输出，展示这一强大语言的基础知识。\n\n![](img/bf8dbdfb89042fadbaa73b4160c74bac_7_1.png)\n\
    \n本书使用 Microsoft 免费的 Visual Studio Community Edition IDE 来演示可视化编程。\n\n### 我应该先学习\
    \ C 吗？\n\n对于在继续学习 C++ 之前先熟悉 C 编程是否更有优势，意见不一。先学习原始语言似乎是合乎逻辑的，以便更容易理解更庞大的扩展语言。然而，C++\
    \ 并不仅仅是 C 的更大版本，因为 C++ 的面向对象编程方法与 C 的过程式本质截然不同。因此，可以说在没有 C 知识的情况下学习 C++ 更好，以避免混淆。\n\
    \n本书不假设读者具有任何编程语言的先前知识，因此适合 C++ 编程初学者，无论他们是否了解 C。\n\n如果您确实觉得在继续学习 C++ 之前先学习 C\
    \ 编程会有所裨益，我们建议您先尝试《C 编程入门》（C Programming in easy steps）中的示例，然后再阅读本书。\n\n"
