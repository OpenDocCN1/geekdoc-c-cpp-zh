    \ more statements here.\n      return 0 ;\n  }\n  ```\n\n- 3. In the main function,\
    \ insert a statement to assign the entire value of the initialized **string**\
    \ variable to the first uninitialized **string** variable.\n\n  ```cpp\n  front.assign(\
    \ text ) ;\n  ```\n\n- 4. Next, insert a statement to output the newly assigned\
    \ **string** value.\n\n  ```cpp\n  cout << endl << \"Front: \" << front << endl\
    \ ;\n  ```\n\n- 5. Now, insert a statement to assign only the first 27 characters\
    \ of the initialized variable to the first variable.\n\n  ```cpp\n  front.assign(\
    \ text, 0, 27 ) ;\n  ```\n\n- 6. Output the newly assigned **string** value.\n\
    \n  ```cpp\n  cout << endl << \"Front: \" << front << endl ;\n  ```\n\n- 7. Next,\
