    \ = \"15\"\n    Text = \"…\" Width = \"20\" Margin = \"15\"\n    Text = \"…\"\
    \ Width = \"20\" Margin = \"15\"\n    Text = \"…\" Width = \"20\" Margin = \"\
    15\"\n    ```\n\n- 5. Edit the first **<Button>** element to rename it, specify\
    \ its button label content and margin on all four sides\n\n    ```\n    x:Name\
    \ = \"BtnPick\" Content = \"Get My Lucky Numbers\"\n    Margin = \"15\"\n    ```\n\
    \n- 6. Edit the second **<Button>** element to rename it and specify its button\
    \ label content\n\n    ```\n    x:Name = \"BtnReset\" Content = \"Reset\"\n  \
    \  ```\n\n- 7. Finally, add an attribute to each respective **<Button>** element\
    \ to specify their initial state\n\n    ```\n    IsEnabled = \"True\"\n    IsEnabled\
    \ = \"False\"\n    ```\n\n![](img/bf8dbdfb89042fadbaa73b4160c74bac_177_1.png)\n\
    \nA single **Margin** value sets all four margins around that component. You can\
    \ specify two values to set left & right, top & bottom margins, e.g. **Margin\
    \ = \"10,30\"**. Alternatively, you can specify four values to set left, top,\
    \ right, bottom margins individually, e.g. **Margin = \"10,30,10,50\"**.\n\nThe\
    \ order in which the attributes appear in each element is unimportant, but the\
    \ elements within the **MainPage.xaml** file should now look similar to the screenshot\
    \ below:\n\n![](img/bf8dbdfb89042fadbaa73b4160c74bac_178_0.png)\n\n![](img/bf8dbdfb89042fadbaa73b4160c74bac_178_1.png)\n\
    \nYou can optionally add Margin = \"0\" attributes to explicitly require elements\
    \ to have no margin within the stack panel.\n\nAs you make changes to the **XAML**\
    \ view code, the component layout gets changed accordingly in the **Design** view\
    \ and should now look like this:\n\n![](img/bf8dbdfb89042fadbaa73b4160c74bac_178_2.png)\n\
    \n![](img/bf8dbdfb89042fadbaa73b4160c74bac_178_3.png)\n\nThe **Design** view shows\
    \ the components’ initial state – the Reset button appears grayed out, as it is\
    \ not enabled.\n\n## Adding runtime function\n\nHaving completed the application\
    \ component layout with XAML elements above, you are now ready to add functionality\
    \ with C++ programming code:\n\n![](img/bf8dbdfb89042fadbaa73b4160c74bac_179_0.png)\n\
    \n- 1. In **Design** view, double-click on the **BtnPick** button\n\n- 2. The\
    \ **MainPage.xaml.cpp** code-behind page opens in the **Code Editor** at a generated\
    \ **BtnPick_Click** event-handler\n\n- 3. In the **BtnPick_Click** event-handler\
    \ block, insert these statements to create a randomized array of integers between\
    \ 1 and 59\n\n    ```cpp\n    int i, j, k, seq[ 60 ];\n    srand( ( int )time(\
    \ 0 ) );\n\n    for ( i = 1 ; i < 60 ; i++ ) seq[ i ] = i ;\n    for ( i = 1 ;\
    \ i < 60 ; i++ )\n\n    {\n        j = ( ( int )rand( ) % 59 ) + 1 ;\n       \
    \ k = seq[ i ] ; seq[ i ] = seq[ j ] ; seq[ j ] = k ;\n    }\n    // Statements\
    \ to be inserted here (Steps 4-5).\n    ```\n\n- 4. Next, insert statements to\
    \ assign six array element values to the <TextBlock> components\n\n    ```cpp\n\
    \    textBlock1->Text = seq[ 1 ].ToString( );\n    textBlock2->Text = seq[ 2 ].ToString(\
    \ );\n    textBlock3->Text = seq[ 3 ].ToString( );\n    textBlock4->Text = seq[\
    \ 4 ].ToString( );\n    textBlock5->Text = seq[ 5 ].ToString( );\n    textBlock6->Text\
    \ = seq[ 6 ].ToString( );\n    ```\n\n- 5. Next, insert statements to set the\
    \ <Button> states\n\n    ```cpp\n    BtnPick->IsEnabled = false ;\n    BtnReset->IsEnabled\
    \ = true ;\n    ```\n\n- 6. Return to **MainPage.xaml**, then in **Design** view,\
    \ double-click on the **BtnReset** button\n\n- 7. The **MainPage.xaml.cpp** code-behind\
    \ page opens in the **Code Editor** at a generated **BtnReset_Click** event-handler\n\
    \n![](img/bf8dbdfb89042fadbaa73b4160c74bac_179_1.png)\n\nThe srand() function\
    \ seeds a random number generator with the current system time, so subsequent\
    \ calls to the rand() function return different pseudo random numbers.\n\n![](img/bf8dbdfb89042fadbaa73b4160c74bac_179_2.png)\n\
    \nThere is no Label component in UWP apps; it is called a TextBlock instead.\n"
  mdcn: "\n## 插入页面组件\n\nVisual Studio 提供了一个由两部分组成的窗口，用于将界面组件插入 UWP 应用。该窗口包含组件的 **设计**\
    \ 视图和用于 XAML 代码的 **XAML** 视图：\n\n![](img/bf8dbdfb89042fadbaa73b4160c74bac_172_0.png)\n\
    \n- 1. 打开 **解决方案资源管理器**，然后双击 **MainPage.xaml**——以启动该两部分窗口\n\n![](img/bf8dbdfb89042fadbaa73b4160c74bac_172_1.png)\n\
    \n- 2. 可以看到，默认情况下，**设计** 视图在 **纵向** 模式下显示一个空白画布\n\n![](img/bf8dbdfb89042fadbaa73b4160c74bac_172_2.png)\n\
    \n![](img/bf8dbdfb89042fadbaa73b4160c74bac_172_3.png)\n\n浏览这些按钮以更改缩放比例和网格特性。\n\
    \n- 3. 在 **设计** 视图中单击相邻按钮，将空白画布更改为 **横向** 模式\n\n![](img/bf8dbdfb89042fadbaa73b4160c74bac_172_4.png)\n\
    \n![](img/bf8dbdfb89042fadbaa73b4160c74bac_172_5.png)\n\nXAML 读作“zammel”。\n\n\
    ![](img/bf8dbdfb89042fadbaa73b4160c74bac_173_0.png)\n\n有一个 **工具箱**，可让你将组件添加到画布上，但稍后你需要在\
    \ XAML 代码中编辑它们。在本示例中，组件从一开始就在 XAML 代码中创建。\n\n- 4. 现在可以看到，默认情况下，**XAML** 视图显示有\
    \ `<Grid></Grid>` 标记——这是画布的根元素，你可以在其中添加组件元素\n\n组件元素最好嵌套在 **<StackPanel>** 元素内，因为可以为其指定\
    \ **x:Name** 以便在功能代码中引用，并指定 **Orientation** 属性以规定嵌套元素应出现的方向。常见组件元素包括 **<Image>**、**<TextBox>**、**<TextBlock>**（标签）和\
    \ **<Button>**。多个 **<StackPanel>** 元素可以相互嵌套，以确定组件的 **水平** 和 **垂直** 布局：\n\n- 5.\
    \ 在根 `<Grid></Grid>` 标记之间插入元素，使 XAML 视图代码完全如下所示：\n\n![](img/bf8dbdfb89042fadbaa73b4160c74bac_173_1.png)\n\
    \n- 6. 当你在 **XAML** 视图中添加组件元素时，它们会显示在 **设计** 视图中，直到看起来如下所示：\n\n![](img/bf8dbdfb89042fadbaa73b4160c74bac_173_2.png)\n\
    \n![](img/bf8dbdfb89042fadbaa73b4160c74bac_173_3.png)\n\n**Name** 属性前的 x: 前缀指的是\
    \ UWP 应用使用的 XAML 架构。\n\n![](img/bf8dbdfb89042fadbaa73b4160c74bac_173_4.png)\n\n\
    外层 **<StackPanel>** 是水平布局，包含一个 **<Image>** 和一个嵌套的 **<StackPanel>**。嵌套的 **<StackPanel>**\
    \ 是垂直布局，包含另外两个 **<StackPanel>** 元素，它们各自水平显示其组件。\n\n## 导入程序资产\n\n为了让 XAML **<Image>**\
    \ 组件显示图形，首先需要将图像文件添加到项目的 **Assets** 文件夹。然后可以将其分配给 **<Image>** 标记的 **Source** 属性：\n\
    \n![](img/bf8dbdfb89042fadbaa73b4160c74bac_175_0.png)\n\n通用\n\n- 1. 打开 **解决方案资源管理器**，然后右键单击\
    \ **Assets** 文件夹，并从上下文菜单中选择 **添加**。\n\n- 2. 现在，从下一个上下文菜单中选择 **现有项**——以打开 **添加现有项**\
    \ 对话框。\n\n![](img/bf8dbdfb89042fadbaa73b4160c74bac_175_1.png)\n\n- 3. 在 **添加现有项**\
    \ 对话框中，浏览到图像所在位置，然后选择该文件并单击 **添加** 按钮。\n\n![](img/bf8dbdfb89042fadbaa73b4160c74bac_175_2.png)\n\
    \n![](img/bf8dbdfb89042fadbaa73b4160c74bac_175_3.png)\n\n用于显示的图像可以是任何常见文件格式——例如\
    \ **.bmp**、**.gif**、**.jpg**、**.png** 或 **.tif**。\n\n- 4. 在 **解决方案资源管理器** 中，选定的图像文件现在会出现在项目的\
    \ **Assets** 文件夹中。\n\n- 5. 在 **设计** 视图中选择 Image 组件，然后单击 **视图**、**属性** 以显示其属性。\n\
    \n![](img/bf8dbdfb89042fadbaa73b4160c74bac_176_0.png)\n\n- 6. 在 **属性** 窗口中，展开\
    \ **常规** 类别，然后单击 **Source** 项的箭头按钮，并从下拉列表中选择已添加的图像。\n\n- 7. 图像现在会显示在 **设计** 视图中，其路径会被添加到\
    \ **XAML** 视图代码和 **Source** 属性中。\n\n![](img/bf8dbdfb89042fadbaa73b4160c74bac_176_1.png)\n\
    \n![](img/bf8dbdfb89042fadbaa73b4160c74bac_176_2.png)\n\n浏览图像 **属性** 窗口中的 **外观**\
    \ 和 **变换** 选项，了解如何修改其显示方式。\n\n## 设计布局\n\n要完成应用的布局，可以将设计属性添加到 XAML 元素标记中，以指定它们将显示的内容以及在界面中出现的精确位置：\n\
    \n![](img/bf8dbdfb89042fadbaa73b4160c74bac_177_0.png)\n\n通用\n\n- 1. 打开 **MainPage.xaml**，然后向外层\
    \ **<StackPanel>** 元素添加两个属性以固定其位置：**HorizontalAlignment = \"Left\" VerticalAlignment\
    \ = \"Top\"**\n\n- 2. 接下来，编辑 **<Image>** 元素，修改最初分配的 200 值——以增加其宽度：**Width = \"\
    300\"**\n\n- 3. 现在，向嵌套的 **<StackPanel>** 元素添加一个属性以固定其位置：**VerticalAlignment =\
    \ \"Center\"**\n\n- 4. 然后，以同样方式编辑所有六个 **<TextBlock>** 元素，以指定它们的初始内容、宽度和四边边距\n\n\
    \    ```\n    Text = \"…\" Width = \"20\" Margin = \"15\"\n    Text = \"…\" Width\
    \ = \"20\" Margin = \"15\"\n    Text = \"…\" Width = \"20\" Margin = \"15\"\n\
    \    Text = \"…\" Width = \"20\" Margin = \"15\"\n    Text = \"…\" Width = \"\
    20\" Margin = \"15\"\n    Text = \"…\" Width = \"20\" Margin = \"15\"\n    ```\n\
    \n- 5. 编辑第一个 **<Button>** 元素以重命名它，并指定其按钮标签内容和四边边距\n\n    ```\n    x:Name = \"\
    BtnPick\" Content = \"Get My Lucky Numbers\"\n    Margin = \"15\"\n    ```\n\n\
    - 6. 编辑第二个 **<Button>** 元素以重命名它，并指定其按钮标签内容\n\n    ```\n    x:Name = \"BtnReset\"\
    \ Content = \"Reset\"\n    ```\n\n- 7. 最后，向每个相应的 **<Button>** 元素添加一个属性以指定其初始状态\n\
    \n    ```\n    IsEnabled = \"True\"\n    IsEnabled = \"False\"\n    ```\n\n![](img/bf8dbdfb89042fadbaa73b4160c74bac_177_1.png)\n\
    \n单个 **Margin** 值会设置该组件四周的所有边距。你可以指定两个值来设置左、右边距和上、下边距，例如 **Margin = \"10,30\"\
    **。或者，你可以指定四个值来分别设置左、上、右、下边距，例如 **Margin = \"10,30,10,50\"**。\n\n属性在每个元素中出现的顺序并不重要，但\
    \ **MainPage.xaml** 文件中的元素现在应类似于下面的屏幕截图：\n\n![](img/bf8dbdfb89042fadbaa73b4160c74bac_178_0.png)\n\
    \n![](img/bf8dbdfb89042fadbaa73b4160c74bac_178_1.png)\n\n你还可以选择添加 Margin = \"\
    0\" 属性，以明确要求元素在堆叠面板内没有边距。\n\n当你更改 **XAML** 视图代码时，组件布局会在 **设计** 视图中相应改变，现在应如下所示：\n\
    \n![](img/bf8dbdfb89042fadbaa73b4160c74bac_178_2.png)\n\n![](img/bf8dbdfb89042fadbaa73b4160c74bac_178_3.png)\n\
    \n**设计** 视图显示组件的初始状态——Reset 按钮显示为灰色，因为它未启用。\n\n## 添加运行时功能\n\n完成上述使用 XAML 元素的应用组件布局后，你现在可以使用\
    \ C++ 编程代码添加功能：\n\n![](img/bf8dbdfb89042fadbaa73b4160c74bac_179_0.png)\n\n- 1.\
    \ 在 **设计** 视图中，双击 **BtnPick** 按钮\n\n- 2. **MainPage.xaml.cpp** 代码隐藏页会在 **代码编辑器**\
    \ 中打开，并定位到生成的 **BtnPick_Click** 事件处理程序\n\n- 3. 在 **BtnPick_Click** 事件处理程序块中，插入以下语句以创建由\
    \ 1 到 59 之间的整数组成的随机数组\n\n    ```cpp\n    int i, j, k, seq[ 60 ];\n    srand( (\
    \ int )time( 0 ) );\n\n    for ( i = 1 ; i < 60 ; i++ ) seq[ i ] = i ;\n    for\
    \ ( i = 1 ; i < 60 ; i++ )\n\n    {\n        j = ( ( int )rand( ) % 59 ) + 1 ;\n\
    \        k = seq[ i ] ; seq[ i ] = seq[ j ] ; seq[ j ] = k ;\n    }\n    // Statements\
    \ to be inserted here (Steps 4-5).\n    ```\n\n- 4. 接下来，插入语句以将六个数组元素值分配给 <TextBlock>\
    \ 组件\n\n    ```cpp\n    textBlock1->Text = seq[ 1 ].ToString( );\n    textBlock2->Text\
    \ = seq[ 2 ].ToString( );\n    textBlock3->Text = seq[ 3 ].ToString( );\n    textBlock4->Text\
    \ = seq[ 4 ].ToString( );\n    textBlock5->Text = seq[ 5 ].ToString( );\n    textBlock6->Text\
    \ = seq[ 6 ].ToString( );\n    ```\n\n- 5. 接下来，插入语句以设置 <Button> 状态\n\n    ```cpp\n\
    \    BtnPick->IsEnabled = false ;\n    BtnReset->IsEnabled = true ;\n    ```\n\
    \n- 6. 返回 **MainPage.xaml**，然后在 **设计** 视图中双击 **BtnReset** 按钮\n\n- 7. **MainPage.xaml.cpp**\
    \ 代码隐藏页会在 **代码编辑器** 中打开，并定位到生成的 **BtnReset_Click** 事件处理程序\n\n![](img/bf8dbdfb89042fadbaa73b4160c74bac_179_1.png)\n\
    \nsrand() 函数使用当前系统时间为随机数生成器设置种子，因此随后对 rand() 函数的调用会返回不同的伪随机数。\n\n![](img/bf8dbdfb89042fadbaa73b4160c74bac_179_2.png)\n\
    \nUWP 应用中没有 Label 组件；它被称为 TextBlock。\n\n"
