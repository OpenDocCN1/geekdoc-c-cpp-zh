    \ way by making the arithmetical operation between the two values first, then\
    \ assigning the result of that operation to the first variable – to become its\
    \ new stored value.\n\nWith the **%=** operator, the first operand **a** is divided\
    \ by the second operand **b**, then the remainder of that operation is assigned\
    \ to the **a** variable.\n\nEach assignment operation is demonstrated in the program\
    \ below.\n\n![](img/bf8dbdfb89042fadbaa73b4160c74bac_27_1.png)\n\nassign.cpp\n\
    \n- 1. Start a new program by specifying the C++ library classes to include, and\
    \ a namespace prefix to use.\n\n    ```cpp\n    #include <iostream>\n    using\
    \ namespace std;\n    ```\n\n- 2. Add a main function containing a final **return**\
    \ statement.\n\n    ```cpp\n    int main()\n    {\n        // Program code goes\
    \ here.\n        return 0;\n    }\n    ```\n\n- 3. In the main function, insert\
    \ a statement declaring two integer variables.\n\n    ```cpp\n    int a, b;\n\
