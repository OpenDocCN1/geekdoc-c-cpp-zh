    \ |\n| │  ├─ length_error | – 容器的无效长度 |\n| │  └─ out_of_range | – 无效的元素范围 |\n\
    | └─ runtime_error | 运行时异常 |\n|    ├─ range_error | – 无效的范围请求 |\n|    └─ overflow_error\
    \ | – 无效的算术请求 |\n\n![](img/bf8dbdfb89042fadbaa73b4160c74bac_92_0.png)\n\n`cout`\
    \ 函数将数据发送到标准输出，而 `cerr` 函数将错误数据发送到标准错误输出。它们只是两个不同的数据流。\n\n当通过添加 `#include <stdexcept>`\
    \ 预处理器指令使 `<stdexcept>` 库可供程序使用时，异常类可用于识别抛给 `catch` 块的异常类型。\n\n特定的异常类名可以出现在 `catch`\
    \ 块的括号内，以替代通用的 `exception` 类型。\n\n![](img/bf8dbdfb89042fadbaa73b4160c74bac_92_1.png)\n\
    \n这里描述的示例演示了*标准异常*的用法。\n\n可以连续使用多个 `catch` 块，就像 `switch` 块中的 `case` 语句一样，来处理多种类型的异常。\n\
    \n此外，可以使用 `throw` 关键字手动产生异常。这可用于创建上表中的任何 `logic_error` 和 `runtime_error` 异常。可选地，可以为手动异常指定自定义错误消息，并可通过其\
    \ `what()` 函数获取。\n\n"
