  - "[PAGE 179]\n\n# # Adding runtime function\n\nHaving completed the application\
    \ component layout with XAML elements above, you are now ready to add functionality\
    \ with C++ programming code:\n\n![](img/bf8dbdfb89042fadbaa73b4160c74bac_179_0.png)\n\
    \n+   1. In **Design** view, double-click on the **BtnPick** button\n\n+   2.\
    \ The **MainPage.xaml.cpp** code-behind page opens in the **Code Editor** at a\
    \ generated **BtnPick_Click** event-handler\n\n+   3. In the **BtnPick_Click**\
    \ event-handler block, insert these statements to create a randomized array of\
    \ integers between 1 and 59\n\n```\n```cpp\nint i, j, k, seq[ 60 ];\nsrand( (\
    \ int )time( 0 ) );\n\nfor ( i = 1 ; i < 60 ; i++ ) seq[ i ] = i ;\nfor ( i =\
    \ 1 ; i < 60 ; i++ )\n\n{\n    j = ( ( int )rand( ) % 59 ) + 1 ;\n    k = seq[\
    \ i ] ; seq[ i ] = seq[ j ] ; seq[ j ] = k ;\n}\n// Statements to be inserted\
    \ here (Steps 4-5).\n```\n```\n\n+   4. Next, insert statements to assign six\
    \ array element values to the <TextBlock> components\n\n```\n```cpp\ntextBlock1->Text\
    \ = seq[ 1 ].ToString( );\ntextBlock2->Text = seq[ 2 ].ToString( );\ntextBlock3->Text\
    \ = seq[ 3 ].ToString( );\ntextBlock4->Text = seq[ 4 ].ToString( );\ntextBlock5->Text\
    \ = seq[ 5 ].ToString( );\ntextBlock6->Text = seq[ 6 ].ToString( );\n```\n```\n\
    \n+   5. Next, insert statements to set the <Button> states\n\n```\n```cpp\nBtnPick->IsEnabled\
    \ = false ;\nBtnReset->IsEnabled = true ;\n```\n```\n\n+   6. Return to **MainPage.xaml**,\
    \ then in **Design** view, double-click on the **BtnReset** button\n\n+   7. The\
    \ **MainPage.xaml.cpp** code-behind page opens in the **Code Editor** at a generated\
    \ **BtnReset_Click** event-handler\n\n![](img/bf8dbdfb89042fadbaa73b4160c74bac_179_1.png)\n\
    \nThe srand() function seeds a random number generator with the current system\
    \ time, so subsequent calls to the rand() function return different pseudo random\
    \ numbers.\n\n![](img/bf8dbdfb89042fadbaa73b4160c74bac_179_2.png)\n\nThere is\
    \ no Label component in UWP apps; it is called a TextBlock instead."
