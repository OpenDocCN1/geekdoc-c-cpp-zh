    \ 包含 GNU C++ 编译器，可在 Windows 系统上使用它来创建可执行的 C++ 程序。Windows 用户可按照以下说明下载并安装 GNU C++\
    \ 编译器。\n\n![](img/bf8dbdfb89042fadbaa73b4160c74bac_9_0.png)\n\n通用公共许可证的条款和条件可在网上查阅：[gnu.org/copyleft/gpl.html](gnu.org/copyleft/gpl.html)\n\
    \n- 1. 在互联网连接打开的情况下，启动 Web 浏览器，然后导航到 [sourceforge.net/projects/mingw](sourceforge.net/projects/mingw)，并单击\
