    \ to declare a second pointer, then initialize it with the address of the second\
    \ integer variable\n+   \n+   ```cpp\n+   int* bPtr;           // bPtr declared.\n\
    +   bPtr = &b;           // bPtr assigned address of b.\n+   ```\n\n+   5. Next,\
    \ insert statements to output the actual memory address of each pointer\n+   \n\
    +   ```cpp\n+   cout << “Addresses of pointers...” << endl;\n+   cout << “aPtr:\
    \ ” << &aPtr << endl;\n+   cout << “bPtr: ” << &bPtr << endl;\n+   ```\n\n+  \
    \ 6. Now, insert statements to output the memory address stored inside each pointer\n\
