    \ pair of braces.\n\n![](img/bf8dbdfb89042fadbaa73b4160c74bac_89_1.png)\n\nAlways\
    \ consider that the user will perform the unexpected – then ensure your programs\
    \ can handle those actions.\n\nWhen an exception error occurs, the **try** block\
