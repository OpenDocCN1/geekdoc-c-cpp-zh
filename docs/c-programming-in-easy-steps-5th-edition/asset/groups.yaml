  - "[PAGE 29]\n\n# Comparing values\n\nThe operators that are commonly used in C++\
    \ programming to compare two numerical values are listed in the table below:\n\
    \n| Operator: | Comparative test: |\n|---|---|\n| `==` | Equality |\n| `!=` |\
    \ Inequality |\n| `>` | Greater than |\n| `<` | Less than |\n| `>=` | Greater\
    \ than or equal to |\n| `<=` | Less than or equal to |\n\nThe **==** equality\
    \ operator compares two operands and will return **true (1)** if both are equal\
    \ in value, otherwise it will return a **false (0)** value. If both are the same\
    \ number, they are equal, or if both are characters, their ASCII code values are\
