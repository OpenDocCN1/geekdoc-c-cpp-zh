    # # Starting a Universal project


    Windows 10 introduced the **Universal Windows Platform (UWP)** that enables you
    to create a single application that will run on any modern Windows-based device
    – phone, tablet, or PC.


    The interface layout of a UWP application uses the **eXtensible Application Markup
    Language (XAML)** to specify components.


    ![](img/bf8dbdfb89042fadbaa73b4160c74bac_169_0.png)


    The example in this chapter is for Visual Studio 2015 on Windows 10 – it won''t
    work with earlier versions.


    In order to develop apps for the UWP, you should be running the latest version
    of Windows 10, and your Visual Studio IDE must include the **Universal Windows
    App Development Tools**:


    ![](img/bf8dbdfb89042fadbaa73b4160c74bac_169_1.png)


    Universal


    +   1. Open **Control Panel, Programs and Features**, then right-click on the
    Visual Studio item and select **Change** – to launch the Visual Studio installer


    ![](img/bf8dbdfb89042fadbaa73b4160c74bac_169_2.png)


    +   2. Select all options in the **Universal Windows App Development Tools** category,
    then click the **Next** button – to download and install the tools


    ![](img/bf8dbdfb89042fadbaa73b4160c74bac_169_3.png)


    +   3. After installation of the tools, open the Visual Studio IDE


    ![](img/bf8dbdfb89042fadbaa73b4160c74bac_169_4.png)


    A UWP application is also known as a “UWA” – Universal Windows Application.'
