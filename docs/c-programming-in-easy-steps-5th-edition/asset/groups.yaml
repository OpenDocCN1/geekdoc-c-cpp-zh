    ![](img/bf8dbdfb89042fadbaa73b4160c74bac_48_3.png)\n\nOn the third iteration of\
    \ these loops, the incrementer increases the counter value to four — so when it\
    \ is next evaluated, the test returns false and the loop ends.\n\n## Looping while\n\
    \nAn alternative to the **for** loop, introduced above, uses the **while** keyword,\
