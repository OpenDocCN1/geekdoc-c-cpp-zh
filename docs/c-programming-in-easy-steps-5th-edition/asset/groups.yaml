  - '[PAGE 145]


    # Isolating class structures


    The source code for each example program in this book is generally contained in
    a single **.cpp** file to save space, but in reality OOP programs are often contained
    in three separate files:


    +   - **Header .h file** – contains only class declarations.

    +   - **Implementation .cpp file** – contains class definitions to implement the
    methods declared in the header file, which is referenced by an **#include** directive.

    +   - **Client .cpp file** – contains a **main** method that employs the class
    members declared in the header file, which is also referenced by an **#include**
    directive.


    ![](img/bf8dbdfb89042fadbaa73b4160c74bac_145_0.png)


    The client file is sometimes referred to as a “driver” file.


    For example, a sum calculator program might comprise three files named **ops.h**
    (a header file declaring operation classes), **ops.cpp** (an implementation file
    defining the operation methods), and **sum.cpp** (a client file calling the various
    operations).


    When compiling **sum.cpp**, the compiler incorporates the included header file
    and implementation file into the program. It first translates the header file
    and implementation file into a binary object file (**ops.o**), then it translates
    the header file and client file into a second binary object file (**sum.o**).
    Finally, the Linker combines both object files into a single executable file (**sum.exe**).


    ![](img/bf8dbdfb89042fadbaa73b4160c74bac_145_1.png)


    ![](img/bf8dbdfb89042fadbaa73b4160c74bac_145_2.png)


    Using an **#include** directive to reference a header file works in a similar
    manner to using an **#include** directive to reference a standard C++ library.


    Isolating class structures in separate “modular” files has the advantage of improving
    portability, and makes code maintenance easier by clearly identifying the purpose
    of each file.


    To have the compiler combine all three source code files into a single, executable
    file it is only necessary to explicitly specify the **.cpp** files in the compiler
    command – an **#include** directive ensures the header file will also be recognized.


    For example, with the statement **#include "ops.h"** in both **ops.cpp** and **sum.cpp**
    the command to compile the example described below need not specify the **ops.h**
    header in the compiler command, but is just **c++ ops.cpp sum.cpp -o sum.exe**.'
  md: "\n## Making abstract data types\n\nAn Abstract Data Type (ADT) represents a\
    \ concept, rather than a tangible object, and is always the base class for other\
    \ classes. A base class can be made into an ADT by initializing one or more of\
    \ its methods with zero. These are known as “pure virtual methods” and must always\
    \ be overridden in derived classes.\n\n![](img/bf8dbdfb89042fadbaa73b4160c74bac_141_0.png)\n\
    \n**adt.cpp**\n\n1. Start a new program by specifying the C++ library classes\
    \ to include, and a namespace prefix to use.\n\n```cpp\n#include <iostream>\n\
    using namespace std;\n```\n\n2. Declare a base ADT class named `Shape`, containing\
    \ three pure virtual methods.\n\n```cpp\nclass Shape\n{\n    public:\n       \
    \ virtual int getArea() = 0;\n        virtual int getEdge() = 0;\n        virtual\
    \ void Draw() = 0;\n};\n```\n\n3. Declare a derived class named `Rect`, containing\
    \ two private variables.\n\n```cpp\nclass Rect : public Shape\n{\n    private:\n\
    \        int height, width;\n};\n```\n\n4. In the derived class declaration, insert\
    \ a public constructor and destructor.\n\n```cpp\npublic:\n    Rect(int initWidth,\
    \ int initHeight)\n    {\n        height = initHeight;\n        width = initWidth;\n\
    \    }\n\n    ~Rect();\n```\n\n![](img/bf8dbdfb89042fadbaa73b4160c74bac_141_1.png)\n\
    \nIt is illegal to create an instance object of an ADT—attempting to do so will\
    \ simply create a compiler error.\n\n5. In the derived `Rect` class declaration,\
    \ declare three public methods to override the pure virtual methods declared in\
    \ the `Shape` base class.\n\n```cpp\nint getArea() { return height * width; }\n\
    int getEdge() { return (2 * height) + (2 * width); }\n\nvoid Draw()\n{\n    for\
    \ (int i = 0; i < height; i++) {\n        for (int j = 0; j < width; j++) {\n\
    \            cout << \"x\";\n        }\n        cout << endl;\n    }\n}\n```\n\
    \n6. Declare a `main` method containing a final **return** statement and creating\
    \ two instances of the derived `Rect` class—to represent a Square and a Quadrilateral\
    \ shape.\n\n```cpp\nint main()\n{\n    Shape* pQuad = new Rect(3, 7);\n    Shape*\
    \ pSquare = new Rect(5, 5);\n    // Add more statements here.\n    return 0;\n\
    }\n```\n\n![](img/bf8dbdfb89042fadbaa73b4160c74bac_142_0.png)\n\n![](img/bf8dbdfb89042fadbaa73b4160c74bac_142_1.png)\n\
    \n7. In the `main` method, insert calls to each method, then save, compile, and\
    \ run the program to see the output.\n\n```cpp\npQuad->Draw();\ncout << \"Area\
    \ is \" << pQuad->getArea() << endl;\ncout << \"Perimeter is \" << pQuad->getEdge()\
    \ << endl;\n\npSquare->Draw();\ncout << \"Area is \" << pSquare->getArea() <<\
    \ endl;\ncout << \"Perimeter is \" << pSquare->getEdge() << endl;\n```\n\n![](img/bf8dbdfb89042fadbaa73b4160c74bac_142_2.png)\n\
    \n![](img/bf8dbdfb89042fadbaa73b4160c74bac_142_3.png)\n\nA base class need only\
    \ contain one pure virtual method to create an Abstract Data Type.\n\n## Building\
    \ complex hierarchies\n\nIt is sometimes desirable to derive an ADT from another\
    \ ADT to construct a complex hierarchy of classes. This provides great flexibility\
    \ and is perfectly acceptable, provided each pure method is defined at some point\
    \ in a derived class.\n\n![](img/bf8dbdfb89042fadbaa73b4160c74bac_143_0.png)\n\
    \n**hierarchy.cpp**\n\n1. Start a new program by specifying the C++ library classes\
