    \n```cpp\nint& rNum = num ;\n```\n\n请注意，&引用运算符的用途是上下文相关的，因此当它作为左值（即=运算符左侧）使用时声明一个引用，否则当它作为右值使用时返回一个内存地址。\n\
    \n引用是其关联项的真正别名，以至于查询其内存地址会返回其关联项的地址——无法找到引用本身的地址。\n\n![](img/bf8dbdfb89042fadbaa73b4160c74bac_107_1.png)\n\
