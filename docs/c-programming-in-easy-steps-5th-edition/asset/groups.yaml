    \ will move the pointer along to the next or previous address for that data type\
    \ – the larger the data type, the bigger the jump.\n\nEven larger jumps can be\
    \ achieved using the += and -= operators.\n\nPointer arithmetic is especially\
    \ useful with arrays, because the elements in an array occupy consecutive memory\
    \ addresses. Assigning just the name of an array to a pointer automatically assigns\
    \ it the address of the first element. Incrementing the pointer by one moves the\
