    \ directive. For example:\n\n```cpp\n#ifdef WEATHER\n    cout << WEATHER;\n#else\n\
    \    #define WEATHER \"Sunny\"\n#endif\n```\n\nSimilarly, `#if`, `#else`, and\
    \ `#elif` macros can perform multiple conditional tests, much like the regular\
    \ C++ `if` and `else` keywords.\n\nFor testing multiple definitions, the `#ifdef`\
    \ macro can be expressed as `#if defined`, and further tests made by `#elif defined`\
    \ macros.\n\n![](img/bf8dbdfb89042fadbaa73b4160c74bac_157_0.png)\n\nThe `#elif`\
    \ macro simply combines else and if to offer an alternative test.\n\nWhile most\
    \ macros are defined in the source file with a `#define` directive, or on the\
    \ command line with the `-D` option, some macros are automatically predefined\
    \ by the compiler. Typically, these have names beginning with a double underscore\
    \ to avoid accidental confusion with chosen names. The compiler’s predefined macros\
    \ are platform-specific, so a program can employ a multiple definition test to\
    \ identify the host platform:\n\n![](img/bf8dbdfb89042fadbaa73b4160c74bac_157_1.png)\n\
    \n- 1. Launch a plain text editor and save a new file (without any content) as\
    \ “empty.txt” in your program’s directory\n\n- 2. To see a list of the compiler’s\
    \ predefined macros, issue a command calling the cpp preprocessor directly with\
    \ a “-dM” option on the empty file\n\n  `cpp -dM empty.txt`\n\n- 3. Scroll through\
    \ the list to find the “_WIN32” macro on Windows or the “_linux” macro on Linux\
    \ systems\n\n![](img/bf8dbdfb89042fadbaa73b4160c74bac_157_2.png)\n\n![](img/bf8dbdfb89042fadbaa73b4160c74bac_157_3.png)\n\
    \nUse the `cpp` command to call the preprocessor directly (not the `c++` command)\
    \ and ensure the `-dM` option is capitalized correctly.\n"
  mdcn: "\n## 定义替代项\n\n正如预处理器会为 **#include** 指令替换库代码一样，其他预处理指令也可用于在汇编和编译之前替换文本或数值。\n\
    \n**#define** 指令用于指定一个宏，它由标识符名称和字符串或数值组成，预处理器会在源代码中每次出现该宏时将其替换。\n\n与 **#include**\
    \ 预处理指令一样，**#define** 指令可以出现在源代码的开头。与常量变量名一样，宏名传统上使用大写，并且定义的字符串值应括在双引号内。对于表达式中的数值替换，宏名应括在圆括号中，以确保正确的优先级。\n\
    \n![](img/bf8dbdfb89042fadbaa73b4160c74bac_153_0.png)\n\n- 1. 通过声明三个 **define**\
    \ 指令开始一个新程序\n\n  ```c\n  #define BOOK \"C++ Programming in easy steps\"\n  #define\
    \ NUM 200\n  #define RULE \"******************************\"\n  ```\n\n- 2. 指定要包含的库类和命名空间\n\
    \n  ```cpp\n  #include <iostream>\n  using namespace std;\n  ```\n\n- 3. 添加一个\
    \ main 函数，其中包含最后的 **return** 语句和三个用于输出替换值的语句\n\n  ```cpp\n  int main()\n  {\n\
    \    cout << RULE << endl << BOOK << endl << RULE;\n    cout << endl << \"NUM\
    \ is: \" << NUM << endl;\n    cout << \"Double NUM: \" << ( ( NUM ) * 2 ) << endl;\n\
    \    return 0;\n  }\n  ```\n\n- 4. 保存、编译并运行程序以查看输出\n\n![](img/bf8dbdfb89042fadbaa73b4160c74bac_153_1.png)\n\
    \n![](img/bf8dbdfb89042fadbaa73b4160c74bac_153_2.png)\n\n数值常量通常最好声明为 const 变量——因为由预处理器替换的值不受类型检查。\n\
    \n- 5. 重新编译程序，保存临时文件 **c++ define.cpp -save-temps -o define.exe**\n\n- 6. 在纯文本编辑器中打开临时文件“define.ii”，滚动到文件末尾以查看替换结果\n\
    \n```cpp\nusing namespace std;\n\nint main()\n{\n    cout << \"****************************\"\
    \ << endl;\n    cout << \"C++ Programming in easy steps\" << endl;\n    cout <<\
    \ \"****************************\" << endl;\n\n    cout << endl << \"NUM is: \"\
    \ << 200 << endl;\n    cout << \"Double NUM: \" << (200 * 2) << endl;\n    return\
    \ 0;\n}\n```\n\n![](img/bf8dbdfb89042fadbaa73b4160c74bac_154_0.png)\n\nLinux 用户可以在命令中使用转义双引号\
    \ \"string\" 或普通单引号 'string' 来括住带引号的字符串。\n\n也可以从命令行使用 **-Dname** 选项进行替换，用指定的值替换宏。请注意，双引号内的字符串值在命令中也必须用转义引号括起来——这样替换结果才会包含双引号字符。\n\
    \n- 7. 删除或注释掉 **BOOK** 和 **NUM** 两个标识符的 **define** 指令——然后保存程序文件以应用更改\n\n- 8. 重新编译程序，指定替换宏值，然后再次运行程序\n\
    \n  `c++ -DNUM=50 -DBOOK=\"XML in easy steps\" define.cpp -o define.exe`\n\n```text\n\
    C:\\MyPrograms>c++ -DNUM=50 -DBOOK=\"XML in easy steps\"\ndefine.cpp -o define.exe\n\
    \nC:\\MyPrograms>define\n************************\nXML in easy steps\n************************\n\
    NUM is: 50\nDouble NUM: 100\n```\n\n![](img/bf8dbdfb89042fadbaa73b4160c74bac_154_1.png)\n\
    \n尝试编译一个其中标识符未定义的程序，会产生“not declared in this scope”错误。\n\n## 定义条件\n\n预处理器可以通过使用宏函数执行条件测试，向程序源代码中智能插入内容。**#ifdef**\
    \ 指令通过测试指定宏是否已定义来执行最常见的预处理器功能。当宏已定义，即测试返回真时，预处理器会插入后续行中直到对应 **#endif** 指令之前的所有指令或语句。\n\
    \n相反，**#ifndef** 指令测试指定宏是否尚未定义。当该测试返回真时，它会插入后续行中直到对应 **#endif** 指令之前的所有指令或语句。\n\
    \n要满足任一条件测试，应注意 **#define** 指令只需指定宏名即可定义标识符——无需指定要替换的值。\n\n任何先前定义的宏之后都可以使用 **#undef**\
    \ 指令移除——这样后续 **#ifdef** 条件测试就会失败。然后可以通过另一个 **#define** 指令重新定义该宏。\n\n![](img/bf8dbdfb89042fadbaa73b4160c74bac_155_0.png)\n\
    \n- 1. 通过条件测试开始一个新程序：当宏尚未定义时插入一条指令\n\n  ```cpp\n  #ifndef BOOK\n      #define\
    \ BOOK \"C++ Programming in easy steps\"\n  #endif\n  ```\n\n- 2. 指定要包含的库类和命名空间\n\
    \n  ```cpp\n  #include <iostream>\n  using namespace std;\n  ```\n\n- 3. 添加一个\
    \ main 函数，其中包含最后的 **return** 语句\n\n  ```cpp\n  int main()\n  {\n      // Program\
    \ code goes here.\n      return 0;\n  }\n  ```\n\n- 4. 在 main 函数中，添加一个条件预处理器测试，以便在测试成功时插入一条输出语句\n\
    \n  ```cpp\n  #ifdef BOOK\n      cout << BOOK;\n  #endif\n  ```\n\n- 5. 添加另一个条件预处理器测试，以便在测试成功时既定义新宏又插入输出语句\n\
    \n  ```cpp\n  #ifndef AUTHOR\n      #define AUTHOR \"Mike McGrath\"\n      cout\
    \ << \" by \" << AUTHOR << endl;\n  #endif\n  ```\n\n- 6. 接下来，添加一个条件测试，如果宏已经定义，则取消定义该宏\n\
    \n  ```cpp\n  #ifdef BOOK\n      #undef BOOK\n  #endif\n  ```\n\n- 7. 现在，添加一个条件测试，如果宏不再定义，则重新定义该宏，并插入一条输出语句\n\
    \n  ```cpp\n  #ifndef BOOK\n      #define BOOK \"Linux in easy steps\"\n     \
    \ cout << BOOK << \" by \" << AUTHOR << endl;\n  #endif\n  ```\n\n- 8. 保存、编译并运行程序以查看插入内容\n\
    \n![](img/bf8dbdfb89042fadbaa73b4160c74bac_156_0.png)\n\n- 9. 重新编译程序，这次在命令中定义\
    \ **BOOK** 宏，然后再次运行程序，以查看指定值出现在输出的第一行 `c++ -DBOOK=\"Java in easy steps\" ifdef.cpp\
    \ -o ifdef.exe`\n\n![](img/bf8dbdfb89042fadbaa73b4160c74bac_156_1.png)\n\n![](img/bf8dbdfb89042fadbaa73b4160c74bac_156_2.png)\n\
    \n每条预处理指令必须单独占一行——不能将多条指令放在同一行。\n\n![](img/bf8dbdfb89042fadbaa73b4160c74bac_156_3.png)\n\
    \n在 Windows 系统上，命令中指定的字符串宏值必须用转义双引号括起来。\n\n## 提供替代方案\n\n由 `#ifdef` 和 `#ifndef`\
    \ 执行的条件测试可以通过添加 `#else` 指令来扩展，以提供替代方案。例如：\n\n```cpp\n#ifdef WEATHER\n    cout\
    \ << WEATHER;\n#else\n    #define WEATHER \"Sunny\"\n#endif\n```\n\n同样，`#if`、`#else`\
    \ 和 `#elif` 宏可以执行多个条件测试，很像常规 C++ 的 `if` 和 `else` 关键字。\n\n要测试多个定义，`#ifdef` 宏可以表示为\
    \ `#if defined`，并通过 `#elif defined` 宏进行进一步测试。\n\n![](img/bf8dbdfb89042fadbaa73b4160c74bac_157_0.png)\n\
    \n`#elif` 宏只是将 else 和 if 组合起来，提供另一种测试。\n\n虽然大多数宏是在源文件中用 `#define` 指令定义，或在命令行上用\
    \ `-D` 选项定义，但有些宏是由编译器自动预定义的。通常，这些名称以双下划线开头，以避免与所选名称发生意外混淆。编译器的预定义宏是平台特定的，因此程序可以使用多定义测试来识别宿主平台：\n\
    \n![](img/bf8dbdfb89042fadbaa73b4160c74bac_157_1.png)\n\n- 1. 启动纯文本编辑器，在程序目录中将一个新文件（不含任何内容）保存为“empty.txt”\n\
    \n- 2. 要查看编译器预定义宏的列表，请发出一个命令，直接在空文件上使用“-dM”选项调用 cpp 预处理器\n\n  `cpp -dM empty.txt`\n\
    \n- 3. 浏览列表，在 Windows 上找到“_WIN32”宏，或在 Linux 系统上找到“_linux”宏\n\n![](img/bf8dbdfb89042fadbaa73b4160c74bac_157_2.png)\n\
    \n![](img/bf8dbdfb89042fadbaa73b4160c74bac_157_3.png)\n\n使用 `cpp` 命令直接调用预处理器（而不是\
    \ `c++` 命令），并确保 `-dM` 选项的大小写正确。\n\n"
