    \n### Pointing to classes\n\nThe three cornerstones of Object Oriented Programming\
    \ (OOP) are encapsulation, inheritance, and polymorphism. Examples in the previous\
    \ chapter have demonstrated how data can be encapsulated within a C++ class, and\
    \ how derived classes inherit the properties of their base class. This chapter\
    \ introduces the final cornerstone principle of polymorphism.\n\n![](img/bf8dbdfb89042fadbaa73b4160c74bac_133_0.png)\n\
    \nThe term “polymorphism” (from Greek, meaning “many forms”) describes the ability\
    \ to assign a different meaning, or purpose, to an entity according to its context.\n\
    \nIn C++, overloaded operators can be described as polymorphic. For example, the\
    \ * character can represent either the multiply operator or the dereference operator,\
    \ according to its context. Similarly, the + character can represent either the\
    \ add operator or the concatenate operator, according to its context.\n\nMore\
    \ importantly, C++ class methods can also be polymorphic. The key to understanding\
    \ polymorphism with classes is to recognize that a base class pointer can be created\
    \ that is also bound to a particular derived class by association.\n\nA pointer\
    \ to a base class can be assigned the memory address of a derived class to provide\
    \ a “context” – to uniquely identify that derived class. For example, with a Base\
    \ base class and a derived Sub class, a pointer can be created like this:\n\n\
    ```cpp\nSub inst;\nBase* pSub = &inst;\n```\n\nor more simply using the new keyword,\
    \ like this:\n\n```cpp\nBase* pSub = new Sub;\n```\n\n![](img/bf8dbdfb89042fadbaa73b4160c74bac_133_1.png)\n\
    \nTurn back to Chapter Six for more on pointers.\n\nWhere there are multiple derived\
    \ classes, base class pointers can be created binding each derived class by its\
    \ unique memory address – which can be revealed using the address-of & operator.\n\
    \n![](img/bf8dbdfb89042fadbaa73b4160c74bac_133_2.png)\n\n- 1. Start a new program\
    \ by specifying the C++ library classes to include, and a namespace prefix to\
    \ use\n\n```cpp\n#include <iostream>\nusing namespace std;\n```\n\n- 2. Declare\
    \ a Base class containing a method to output a passed integer value in hexadecimal\
    \ format\n\n```cpp\nclass Base\n{\n    public:\n        void Identify(int adr)\
    \ const\n        {\n            cout << \"Base class called by 0x\" << hex <<\
    \ adr << endl;\n        }\n};\n```\n\n- 3. Declare two empty derived classes,\
    \ **SubA** and **SubB**.\n\n```cpp\nclass SubA : public Base { };\nclass SubB\
    \ : public Base { };\n```\n\n- 4. Declare a main method containing a final `return`\
    \ statement.\n\n```cpp\nint main()\n{\n    // Program code goes here.\n    return\
    \ 0;\n}\n```\n\n- 5. In the main method, insert statements to create two base\
    \ class pointers — each binding to a specific derived class.\n\n```cpp\nBase*\
    \ ptrA = new SubA;\nBase* ptrB = new SubB;\n```\n\n- 6. Now, insert statements\
    \ that use the pointers to call the base class method, passing the memory address\
    \ of each for output.\n\n```cpp\nptrA->Identify((int) &ptrA);\nptrB->Identify((int)\
    \ &ptrB);\n```\n\n- 7. Save, compile, and run the program to see the addresses.\n\
    \n![](img/bf8dbdfb89042fadbaa73b4160c74bac_134_0.png)\n\n![](img/bf8dbdfb89042fadbaa73b4160c74bac_134_1.png)\n\
    \nThe -> class pointer operator is used here to call class methods.\n\n![](img/bf8dbdfb89042fadbaa73b4160c74bac_134_2.png)\n\
    \nThe hexadecimal address is passed as an int data type, then displayed in hexadecimal\
    \ format by the hex output manipulator. The addresses will be different each time\
    \ the program executes — they are assigned dynamically.\n"
