  - '[PAGE 37]


    # # Setting precedence


    Operator precedence determines the order in which C++ evaluates expressions. For
    example, in the expression **a = 6 + 8 * 3**, the order of precedence determines
    that multiplication is completed first.


    The table below lists operator precedence in descending order – those on the top
    row have highest precedence, those on lower rows have successively lower precedence.
    The order in which C++ evaluates expressions containing multiple operators of
    equal precedence is determined by “operator associativity” – grouping operands
    with the one on the left (LTR) or on the right (RTL).


    ![](img/bf8dbdfb89042fadbaa73b4160c74bac_37_0.png)


    The * multiply operator is on a higher row than the + addition operator – so in
    the expression a=6+8*3, multiplication is completed first, before the addition.


    | Operator | Description | Operator | Description | Direction |

    |---|---|---|---|---|

    | `()` | Function call | `[]` | Array index | LTR |

    | `->` | Class pointer | `.` | Class member | LTR |

    | `!` | Logical NOT | `*` | Pointer | RTL |

    | `--` | Decrement | `++` | Increment | RTL |

    | `+` | Positive sign | `-` | Negative sign | RTL |

    | `sizeof` | Size of | `&` | Address of | RTL |

    | `*` | Multiply | `/` | Divide | LTR |

    | `%` | Modulus |  |  | LTR |

    | `+` | Add | `-` | Subtract | LTR |

    | `<=` | Less or equal | `<` | Less than | LTR |

    | `>=` | Greater or equal | `>` | Greater than | LTR |

    | `==` | Equality | `!=` | Inequality | LTR |

    | `&&` | Logical AND |  |  | LTR |

    | `||` | Logical OR |  |  | LTR |

    | `?:` | Ternary |  |  | RTL |

    | `+= -= *= /= %=` | Assignments |  |  | RTL |

    | `,` | Comma |  |  | LTR |


    ![](img/bf8dbdfb89042fadbaa73b4160c74bac_37_1.png)


    The -> class pointer and the . class member operators are introduced later in
    this book – but they are included here for completeness.'
