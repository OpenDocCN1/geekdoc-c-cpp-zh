    ```\n```cpp\nclass Parent\n{\n    public :\n        void Common() const\n    \
    \    { cout << “I am part of this family, “ ; }\n\n        virtual void Identify()\
    \ const\n        { cout << “I am the parent” << endl ; }\n} ;\n```\n```\n\n+ \
    \  3. Declare a derived class named “Child”, containing a method to override the\
