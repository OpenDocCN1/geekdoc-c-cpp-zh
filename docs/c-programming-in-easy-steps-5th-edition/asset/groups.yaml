    \ object ready for re-use\n  \n  ```cpp\n  stream.str(\"\");      // Empty the\
    \ contents.\n  stream.clear();       // Empty the bit flags.\n  ```\n\n- 8. Now,\
    \ use the stream output operator to load the initialized integer value into the\
    \ **stringstream** object\n  \n  ```cpp\n  stream << number ;    // Load the integer.\n\
    \  ```\n\n- 9. Use the stream input operator to extract content from the **stringstream**\
    \ object into the uninitialized **string** variable\n  \n  ```cpp\n  stream >>\
    \ text ;    // Extract the string.\n  ```\n\n- 10. Perform concatenation on the\
    \ **string** and output the result\n  \n  ```cpp\n  text += \" Per Cent\" ;\n\
    \  cout << \"String value: \" << text << endl ;\n  ```\n\n- 11. Save, compile,\
    \ and run the program to see the converted output values\n\n![](img/bf8dbdfb89042fadbaa73b4160c74bac_66_0.png)\n\
    \n![](img/bf8dbdfb89042fadbaa73b4160c74bac_66_1.png)\n\nNotice how the **stringstream**\
