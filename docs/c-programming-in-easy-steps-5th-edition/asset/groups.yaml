    \n使用 `+=` 和 `-=` 运算符可以实现更大的跳转。\n\n指针运算对数组特别有用，因为数组中的元素占用连续的内存地址。仅将数组名赋给指针，就会自动将其赋值为第一个元素的地址。将指针递增一，就会将指针移动到下一个元素。\n\
