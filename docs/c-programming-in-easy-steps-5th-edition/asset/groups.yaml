  - "[PAGE 71]\n\n# Copying & swapping strings\n\nString values can be assigned to\
    \ a **string** variable by the **=** assignment operator, or by the **<string>**\
    \ library’s **assign()** function. This function specifies the **string** value\
    \ to be copied to the variable as an argument within its parentheses.\n\nOptionally,\
    \ the **assign()** function can copy just a part of the specified **string** value\
    \ by stating the position of the starting character as a second argument, and\
    \ the number of characters to copy as a third argument.\n\nThe contents of a **string**\
    \ variable can be exchanged for that of another **string** variable by the **<string>**\
    \ library’s **swap()** function. In this case, the contents of the first variable\
    \ receives those of the second variable, which in turn receives those of the first\
    \ variable.\n\n![](img/bf8dbdfb89042fadbaa73b4160c74bac_71_0.png)\n\nswap.cpp\n\
    \n+   1. Start a new program by specifying the C++ library classes to include,\
    \ and a namespace prefix to use.\n+   \n+   ```cpp\n+   #include <string>    \
    \   // Include string support.\n+   #include <iostream>\n+   using namespace std\
    \ ;\n+   ```\n\n+   2. Add a main function containing a final **return** statement\
    \ and declaring three **string** variables – with one initialized.\n+   \n+  \
    \ ```cpp\n+   int main()\n+   {\n+       string front ;\n+       string back ;\n\
    +       string text =\n+       “Always laugh when you can. It’s cheap medicine.”\
    \ ;\n+       // Add more statements here.\n+       return 0 ;\n+   }\n+   ```\n\
    \n+   3. In the main function, insert a statement to assign the entire value of\
    \ the initialized **string** variable to the first uninitialized **string** variable.\n\
    +   \n+   ```cpp\n+   front.assign( text ) ;\n+   ```\n\n+   4. Next, insert a\
    \ statement to output the newly assigned **string** value.\n+   \n+   ```cpp\n\
    +   cout << endl << “Front: ” << front << endl ;\n+   ```\n\n+   5. Now, insert\
    \ a statement to assign only the first 27 characters of the initialized variable\
    \ to the first variable.\n+   \n+   ```cpp\n+   front.assign( text, 0, 27 ) ;\n\
    +   ```\n\n+   6. Output the newly assigned **string** value.\n+   \n+   ```cpp\n\
    +   cout << endl << “Front: ” << front << endl ;\n+   ```\n\n+   7. Next, assign\
    \ only the last part of the initialized **string** variable to the second uninitialized\
    \ variable, starting at character (element) 27.\n+   \n+   ```cpp\n+   back.assign(\
    \ text, 27, text.size() ) ;\n+   ```\n\n+   8. Now, output this newly assigned\
    \ **string** value.\n+   \n+   ```cpp\n+   cout << “Back: ” << back << endl ;\n\
    +   ```\n\n+   9. Finally, exchange the assigned **string** values contained in\
    \ the first and second **string** variables, then output the exchanged values.\n\
    +   \n+   ```cpp\n+   back.swap( front ) ;\n+   cout << endl << “Front: ” << front\
    \ << endl ;\n+   cout << “Back: ” << back << endl ;\n+   ```"
  md: "\n## Discovering string features\n\nThe C++ `<string>` library provides a number\
    \ of functions that make it easy to work with strings. To use them, simply add\
    \ the function name after the **string** variable name and a dot. For example,\
    \ with a **string** variable named “msg” you can call upon the **size()** function,\
    \ to return its character length, with **msg.size()**.\n\nA **string** variable\
    \ can be emptied of all characters by assigning it an empty string with two double\
    \ quotes without spacing – as \"\", or alternatively by calling the `<string>`\
    \ library’s **clear()** function.\n\nUnlike a **char** array, a **string** variable\
    \ will dynamically enlarge to accommodate the number of characters assigned to\
    \ it, and its current memory size can be revealed with the `<string>` library’s\
    \ **capacity()** function. Once enlarged, the allocated memory size remains, even\
    \ when a smaller **string** gets assigned to the variable.\n\n![](img/bf8dbdfb89042fadbaa73b4160c74bac_67_0.png)\n\
    \nThe **length()** function can be used in place of the **size()** function to\
    \ reveal the size of a string value.\n\nThe `<string>` library’s **empty()** function\
    \ returns a Boolean **true (1)** or **false (0)** response to reveal whether the\
    \ string is empty or not.\n\n![](img/bf8dbdfb89042fadbaa73b4160c74bac_67_1.png)\n\
    \nfeatures.cpp\n\n- 1. Start a new program by specifying the C++ library classes\
    \ to include, and a namespace prefix to use.\n\n  ```cpp\n  #include <string>\
    \       // Include string support.\n  #include <iostream>\n  using namespace std;\n\
    \  ```\n\n- 2. Below the preprocessor directives, declare a function prototype\
    \ with a single string data type argument.\n\n  ```cpp\n  void computeFeatures(\
    \ string );\n  ```\n\n- 3. Add a main function containing a final **return** statement\
    \ and declaring an initialized **string** variable.\n\n  ```cpp\n  int main()\n\
    \  {\n      string text = \"C++ is fun\";\n      // Add more statements here.\n\
    \      return 0;\n  }\n  ```\n\n- 4. After the main function, define the declared\
    \ function to display the **string** variable value when called.\n\n  ```cpp\n\
    \  void computeFeatures( string text )\n  {\n      cout << endl << \"String: \"\
    \ << text << endl ;\n  }\n  ```\n\n- 5. In the function definition, add statements\
    \ to output features of the **string** variable.\n\n  ```cpp\n  cout << \"Size:\
    \ \" << text.size() ;\n  cout << \"Capacity: \" << text.capacity() ;\n  cout <<\
    \ \"Empty?: \" << text.empty() << endl ;\n  ```\n\n- 6. In the main function,\
    \ insert a call to the defined function\n\n  ```cpp\n  computeFeatures( text );\n\
    \  ```\n\n- 7. Next, in the main function, insert a statement to enlarge the **string**\
    \ value and call the function to see its features\n\n  ```cpp\n  text += \" for\
    \ everyone\";\n  computeFeatures( text );\n  ```\n\n- 8. Now, insert a statement\
    \ to reduce the **string** value\n\n  ```cpp\n  text = \"C++ Fun\";\n  computeFeatures(\
    \ text );\n  ```\n\n- 9. Finally, insert a statement to empty the **string** variable\n\
    \n  ```cpp\n  text.clear();\n  computeFeatures( text );\n  ```\n\n- 10. Save,\
    \ compile, and run the program to see the output\n\n![](img/bf8dbdfb89042fadbaa73b4160c74bac_68_0.png)\n\
    \n![](img/bf8dbdfb89042fadbaa73b4160c74bac_68_1.png)\n\nThe **empty()** function\
    \ is useful to check if the user has entered requested input.\n\n![](img/bf8dbdfb89042fadbaa73b4160c74bac_68_2.png)\n\
    \nA space occupies one memory element -- just like a character does.\n\n## Joining\
    \ & comparing strings\n\nWhen the **+** operator is used to concatenate strings\
    \ in an assignment, the combined strings get stored in the **string** variable.\
    \ But when it is used with the **cout** function, the strings are only combined\
    \ in the output – the variable values are unchanged.\n\nThe **<string>** library’s\
    \ **append()** function can also be used to concatenate strings, specifying the\
    \ **string** value to append as an argument within its parentheses. When this\
    \ is used with the **cout** function, the strings are combined in the variable,\
    \ then its value written as output – in this case, the variable value does change.\n\
    \nString comparisons can be made, in the same way as numeric comparisons, with\
    \ the **==** equality operator. This returns **true** (1) when both strings precisely\
    \ match, otherwise it returns **false** (0).\n\nAlternatively, the **<string>**\
    \ library’s **compare()** function can be used to compare a **string** value specified\
    \ as its argument. Unlike the **==** equality comparison, the **compare()** function\
    \ returns zero when the strings are identical, by examining the **string** value’s\
    \ combined ASCII code values. When the **string** argument totals more than the\
    \ first string, it returns -1, otherwise it returns 1.\n\n![](img/bf8dbdfb89042fadbaa73b4160c74bac_69_0.png)\n\
    \n- 1. Start a new program by specifying the C++ library classes to include, and\
    \ a namespace prefix to use.\n\n  ```cpp\n  #include <string>       // Include\
    \ string support.\n  #include <iostream>\n  using namespace std;\n  ```\n\n- 2.\
    \ Add a main function containing a final **return** statement and declaring three\
    \ initialized string variables.\n\n  ```cpp\n  int main()\n  {\n      string lang\
    \ = \"C++\";\n      string term = \"Programming\";\n      string text = \"C++\
    \ Programming\";\n      // Add more statements here.\n      return 0;\n  }\n \
    \ ```\n\n- 3. In the main function, insert statements to output two **string**\
    \ values combined with the **+** concatenate operator and the (unchanged) value\
    \ of the first variable.\n\n  ```cpp\n  cout << \"Concatenated: \" << (lang +\
    \ term) << endl;\n  cout << \"Original: \" << lang << endl;\n  ```\n\n- 4. Next,\
    \ insert statements to output two **string** values combined with the **append()**\
    \ function and the (changed) value of the first variable.\n\n  ```cpp\n  cout\
    \ << \"Appended: \" << lang.append(term) << endl;\n  cout << \"Original: \" <<\
    \ lang << endl;\n  ```\n\n- 5. Use the **==** equality operator to compare two\
    \ **string** values that differ, then two **string** values that match.\n\n  ```cpp\n\
    \  cout << \"Differ: \" << (lang == term) << endl;\n  cout << \"Match: \" << (lang\
    \ == text) << endl << endl;\n  ```\n\n- 6. Now, use the **compare()** function\
    \ to compare three **string** values, examining their ASCII code total values.\n\
    \n  ```cpp\n  cout << \"Match: \" << lang.compare(text) << endl;\n  cout << \"\
    Differ: \" << lang.compare(term) << endl;\n  cout << \"Lower ASCII: \" << lang.compare(\"\
    zzzz\") << endl;\n  ```\n\n- 7. Save, compile, and run the program to see the\
    \ output.\n\n```\n    C:\\MyPrograms>c++ compare.cpp -o compare.exe\n    C:\\\
    MyPrograms>compare\n    Concatenated: C++ Programming\n    Original: C++ Programming\n\
    \    Appended: C++ Programming\n    Original: C++ Programming\n    Differ: 0\n\
    \    Match: 1\n    Match: 0\n    Differ: 1\n    Lower ASCII: -1\n    C:\\MyPrograms>\n\
    ```\n\n![](img/bf8dbdfb89042fadbaa73b4160c74bac_70_0.png)\n\nThe += assignment\
    \ operator can also be used to append a string.\n\n![](img/bf8dbdfb89042fadbaa73b4160c74bac_70_1.png)\n\
    \nIn comparisons, character order is taken into account — so comparing “za” to\
    \ “az” reveals that “za” has a greater total. In terms of ASCII values, 'a' is\
    \ 97, and 'z' is 122.\n\n## Copying & swapping strings\n\nString values can be\
    \ assigned to a **string** variable by the **=** assignment operator, or by the\
    \ **<string>** library’s **assign()** function. This function specifies the **string**\
    \ value to be copied to the variable as an argument within its parentheses.\n\n\
    Optionally, the **assign()** function can copy just a part of the specified **string**\
    \ value by stating the position of the starting character as a second argument,\
    \ and the number of characters to copy as a third argument.\n\nThe contents of\
    \ a **string** variable can be exchanged for that of another **string** variable\
    \ by the **<string>** library’s **swap()** function. In this case, the contents\
    \ of the first variable receives those of the second variable, which in turn receives\
    \ those of the first variable.\n\n![](img/bf8dbdfb89042fadbaa73b4160c74bac_71_0.png)\n\
    \nswap.cpp\n\n- 1. Start a new program by specifying the C++ library classes to\
    \ include, and a namespace prefix to use.\n\n  ```cpp\n  #include <string>   \
