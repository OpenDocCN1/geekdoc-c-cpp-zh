    \n![](img/bf8dbdfb89042fadbaa73b4160c74bac_64_2.png)\n\nUse the **cin** function\
    \ for numeric input or single word input, but use the **getline()** function for\
    \ string input.\n\n![](img/bf8dbdfb89042fadbaa73b4160c74bac_64_3.png)\n\nThe arguments\
    \ to the **cin.ignore()** function specify it should discard up to 256 characters\
    \ and stop when it encounters a newline character.\n\n## Solving the string problem\n\
    \nA problem arises with **string** variables when you need to convert them to\
    \ a different data type, perhaps to perform arithmetical operations with those\
    \ values. As the **string** object is not a native C++ data type a **string**\
    \ variable value cannot be converted to an **int** or any other regular data type\
    \ by casting.\n\nThe solution is provided by the C++ **<sstream>** library that\
    \ allows a **stringstream** object to act as an intermediary, through which **string**\
    \ values can be converted to a numeric data type, and numeric values can be converted\
    \ to a **string** data type. To make this ability available to a program, the\
    \ library must be added with an **#include <sstream>** directive at the start\
    \ of the program.\n\nValues can be loaded into a **stringstream** object with\
    \ the familiar output stream **<<** operator that is used with **cout** statements.\
    \ Contents can then be extracted from a **stringstream** object with the **>>**\
    \ input stream operator that is used with **cin** statements.\n\nIn order to re-use\
    \ a **stringstream** object, it must first be returned to its original state.\
    \ This requires its contents to be set as an empty **string** and its bit flags\
    \ to be cleared.\n\n![](img/bf8dbdfb89042fadbaa73b4160c74bac_65_0.png)\n\n- 1.\
