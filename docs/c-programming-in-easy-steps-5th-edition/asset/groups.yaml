    \ the left (LTR) or on the right (RTL).\n\n![](img/bf8dbdfb89042fadbaa73b4160c74bac_37_0.png)\n\
    \nThe * multiply operator is on a higher row than the + addition operator – so\
    \ in the expression a=6+8*3, multiplication is completed first, before the addition.\n\
