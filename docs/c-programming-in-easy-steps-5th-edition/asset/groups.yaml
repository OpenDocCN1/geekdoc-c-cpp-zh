    # Compiling & running programs


    The C++ source code files for the examples in this book are stored in a directory
    created expressly for that purpose. The directory is named “MyPrograms” – its
    absolute address on a Windows system is **C:\MyPrograms** and on Linux it’s **/home/user/MyPrograms**.
    You can recreate this directory to store programs awaiting compilation:


    +   1. Move the “hello.cpp” program source code file, created [here](here), to
    the “MyPrograms” directory on your system.

    +   2. At a command prompt, use the “cd” command to navigate to the “MyPrograms”
    directory.

    +   3. Enter a command to attempt to compile the program **c++ hello.cpp**.


    ![](img/bf8dbdfb89042fadbaa73b4160c74bac_13_0.png)


    You can see the compiler version number with the command **c++ --version** and
    display all its options with **c++ --help**.


    When the attempt succeeds, the compiler creates an executable file alongside the
    original source code file. By default, the executable file is named **a.exe**
    on Windows systems and **a.out** on Linux. Compiling a different source code file
    in the same directory would now overwrite the first executable file without warning.
    This is obviously undesirable, so a custom name for the executable file should
    be specified when compiling programs, using the compiler’s **-o** option in the
    compile command.


    ![](img/bf8dbdfb89042fadbaa73b4160c74bac_13_1.png)


    The command **c++** is an alias for the GNU C++ Compiler – the command **g++**
    can also be used.


    +   4. Enter a command to compile the program, creating an executable file named
    “hello.exe” alongside the source file **c++ hello.cpp -o hello.exe**.


    ![](img/bf8dbdfb89042fadbaa73b4160c74bac_13_2.png)'
