    \ ```cpp\n    int nil = 0, num = 0, max = 1; char cap = 'A', low = 'a';\n    ```\n\
    \n- 4. 接下来，插入语句以输出整数和字符的相等比较结果\n\n    ```cpp\n    cout << \"Equality comparisons:\
    \ \";\n    cout << \"(0 == 0) \" << (nil == num) << \"(true)\";\n    cout << \"\
    (A == a) \" << (cap == low) << \"(false)\";\n    ```\n\n- 5. 现在，插入语句以输出所有其他比较结果\n\
    \n    ```cpp\n    cout << endl << \"Inequality comparison: \";\n    cout << \"\
    (0 != 1) \" << (nil != max) << \"(true)\";\n    cout << endl << \"Greater comparison:\
    \ \";\n    cout << \"(0 > 1) \" << (nil > max) << \"(false)\";\n    cout << endl\
    \ << \"Lesser comparison: \";\n    cout << \"(0 < 1) \" << (nil < max) << \"(true)\"\
    ;\n    cout << endl << \"Greater or equal comparison: \";\n    cout << \"(0 >=\
    \ 0) \" << (nil >= num) << \"(true)\";\n    cout << endl << \"Lesser or equal\
    \ comparison: \";\n    cout << \"(1 <= 0) \" << (max <= num) << \"(false)\";\n\
    \    ```\n\n- 6. 保存、编译并运行程序以查看输出\n\n![](img/bf8dbdfb89042fadbaa73b4160c74bac_30_0.png)\n\
    \n![](img/bf8dbdfb89042fadbaa73b4160c74bac_30_1.png)\n\n大写“A”的 ASCII 码值是 65，而小写“a”的是\
    \ 97——因此它们在这里的比较返回假 (0)。\n\n## 评估逻辑\n\nC++ 编程中最常用的逻辑运算符列于下表：\n\n| 运算符： | 运算： |\n\
    |---|---|\n| && | 逻辑与 |\n| \\|\\| | 逻辑或 |\n| ! | 逻辑非 |\n\n逻辑运算符与具有 **真** 或 **假**\
    \ 布尔值的操作数一起使用，或者与可转换为 **真** 或 **假** 的值一起使用。\n\n逻辑 **&&** 与运算符将评估两个操作数，仅当两个操作数本身都为\
    \ **真** 时才返回 **真**。否则，**&&** 运算符将返回 **假**。这用于条件分支，其中程序的方向由测试两个条件决定——如果两个条件都满足，程序将朝某个方向执行，否则将朝另一个方向执行。\n\
    \n![](img/bf8dbdfb89042fadbaa73b4160c74bac_31_0.png)\n\n当有多个操作数时，每个表达式必须用括号括起来。\n\
    \n与需要两个操作数都为 **真** 的 **&&** 与运算符不同，**||** 或运算符将评估其两个操作数，如果其中一个操作数本身返回 **真**，则返回\
    \ **真**。如果两个操作数都不返回 **真**，则 **||** 或运算符将返回 **假**。这在 C++ 编程中很有用，可在两个测试条件中任一条件满足时执行某个操作。\n\
    \n第三个逻辑 **!** 非运算符是一元运算符，用于单个操作数之前。它返回给定操作数的相反值，因此如果变量 **a** 的值为 **真**，那么 **!a**\
    \ 的值将为 **假**。**!** 非运算符在 C++ 程序中很有用，可在连续的循环迭代中使用类似 **a = !a** 的语句切换变量的值。这确保每次传递时值都会改变，就像打开和关闭电灯开关一样。\n\
    \n![](img/bf8dbdfb89042fadbaa73b4160c74bac_31_1.png)\n\n“布尔”一词指的是英国数学家乔治·布尔（1815-1864）发展的一种逻辑思维体系。\n\
    \n在 C++ 程序中，零表示布尔 **假** 值，任何非零值（例如 1）表示布尔 **真** 值。\n\n下面的程序演示了每种逻辑运算。\n\n![](img/bf8dbdfb89042fadbaa73b4160c74bac_31_2.png)\n\
    \nlogic.cpp\n\n- 1. 通过指定要包含的 C++ 库类和要使用的命名空间前缀来启动新程序。\n\n    ```cpp\n    #include\
    \ <iostream>\n    using namespace std;\n    ```\n\n- 2. 添加一个包含最后 **return** 语句的\
    \ main 函数。\n\n    ```cpp\n    int main()\n    {\n        // Program code goes\
    \ here.\n        return 0;\n    }\n    ```\n\n- 3. 在 main 函数中，声明并初始化两个整型变量——其值可以表示布尔值。\n\
    \n    ```cpp\n    int a = 1, b = 0;\n    ```\n\n- 4. 插入语句以输出与运算的评估结果。\n\n    ```cpp\n\
    \    cout << \"AND logic:\" << endl;\n    cout << \"(a && a) \" << (a && a) <<\
    \ \"(true) \";\n    cout << \"(a && b) \" << (a && b) << \"(false) \";\n    cout\
    \ << \"(b && b) \" << (b && b) << \"(false)\" << endl;\n    ```\n\n- 5. 插入语句以输出或运算的评估结果。\n\
    \n    ```cpp\n    cout << endl << \"OR logic:\" << endl;\n    cout << \"(a ||\
    \ a) \" << (a || a) << \"(true) \";\n    cout << \"(a || b) \" << (a || b) <<\
    \ \"(true) \";\n    cout << \"(b || b) \" << (b || b) << \"(false)\" << endl;\n\
    \    ```\n\n- 6. 插入语句以输出非运算的评估结果。\n\n    ```cpp\n    cout << endl << \"NOT logic:\"\
    \ << endl;\n    cout << \"a = \" << a << \" !a = \" << !a << \" \";\n    cout\
    \ << \"b = \" << b << \" !b = \" << !b << endl;\n    ```\n\n- 7. 保存、编译并运行程序以查看输出。\n\
    \n![](img/bf8dbdfb89042fadbaa73b4160c74bac_32_0.png)\n\n![](img/bf8dbdfb89042fadbaa73b4160c74bac_32_1.png)\n\
    \n请注意，0 && 0 返回 0，而不是 1——这证明了格言“两个错误不能构成一个正确”。\n\n## 检查条件\n\nC++ 程序员可能最喜欢的测试运算符是\
    \ `?:` “三元”运算符。该运算符首先评估表达式以判断 **真** 或 **假** 条件，然后根据评估结果返回两个指定值之一。因此，它也被称为“条件”运算符。\n\
    \n`?:` 三元运算符具有以下语法：\n\n```cpp\n( test-expression ) ? if-true-return-this : if-false-return-this\
    \ ;\n```\n\n尽管三元运算符最初可能看起来有点令人困惑，但它非常值得熟悉，因为它可以用最少的代码执行强大的程序分支。例如，当变量的值不为 1 时进行分支：\n\
    \n```cpp\n( var != 1 ) ? if-true-do-this : if-false-do-this ;\n```\n\n三元运算符在 C++\
    \ 编程中常用于将两个变量的最大值或最小值赋给第三个变量。例如，像这样赋最小值：\n\n```cpp\nc = ( a < b ) ? a : b ;\n\
    ```\n\n当变量 **a** 的值小于变量 **b** 的值时，括号中的表达式返回 **真**——因此在这种情况下，变量 **a** 的较小值会被赋给变量\
    \ **c**。\n\n类似地，将测试表达式中的 `<` 小于运算符替换为 `>` 大于运算符，会将变量 **b** 的较大值赋给变量 **c**。\n\n\
    三元运算符的另一个常见用法是在测试表达式中结合 `%` 取模运算符，以确定变量的值是奇数还是偶数：\n\n```cpp\n( var % 2 != 0 )\
    \ ? if-true(odd)-do-this : if-false(even)-do-this ;\n```\n\n![](img/bf8dbdfb89042fadbaa73b4160c74bac_33_0.png)\n\
    \n三元运算符有三个操作数——`?` 之前的一个，以及 `:` 之前和之后的操作数。\n\n如果变量值除以二的结果有余数，则该数字为奇数——如果没有余数，则该数字为偶数。测试表达式\
    \ `( var % 2 == 1 )` 会产生相同的效果，但最好测试不等性——发现不同之处比发现相同之处更容易。\n\n下面的程序演示了三元运算符。\n\n\
    ![](img/bf8dbdfb89042fadbaa73b4160c74bac_33_1.png)\n\nternary.cpp\n\n- 1. 通过指定要包含的\
    \ C++ 库类和要使用的命名空间前缀来启动新程序\n\n    ```cpp\n    #include <iostream>\n    using namespace\
    \ std;\n    ```\n\n- 2. 添加一个包含最后 **return** 语句的 main 函数\n\n    ```cpp\n    int\
    \ main()\n    {\n        // Program code goes here.\n        return 0;\n    }\n\
    \    ```\n\n"
