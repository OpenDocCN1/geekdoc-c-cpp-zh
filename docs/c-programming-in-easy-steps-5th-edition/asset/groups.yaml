  - "[PAGE 43]\n\n# Branching with if\n\nThe C++ **if** keyword performs the basic\
    \ conditional test that evaluates a given expression for a Boolean value of **true**\
    \ or **false** — and its syntax looks like this:\n\n```\nif (test-expression)\
    \ { statements-to-execute-when-true }\n```\n\n![](img/bf8dbdfb89042fadbaa73b4160c74bac_43_0.png)\n\
    \nThe braces following the test may contain one or more statements, each terminated\
    \ by a semicolon, but these will only be executed when the expression is found\
    \ to be **true**. When the test is found to be **false**, the program proceeds\
    \ to its next task.\n\nOptionally, an **if** statement can offer alternative statements\
    \ to execute when the test fails by appending an **else** statement block after\
    \ the **if** statement block, like this:\n\n```\nif (test-expression) { statements-to-execute-when-true\
    \ }\nelse { statements-to-execute-when-false }\n```\n\n![](img/bf8dbdfb89042fadbaa73b4160c74bac_43_1.png)\n\
    \nWhere there is only one statement to execute when the test succeeds, the braces\
    \ may be omitted -- but retaining them aids code clarity.\n\nTo test two conditions,\
    \ the test expression may use the **&&** operator. For example, **if ( ( num >\
    \ 5 ) && ( letter == ‘A’ ) )**. Alternatively, an **if** statement can be “nested”\
    \ within another **if** statement, so those statements in the inner statement\
    \ block will only be executed when both tests succeed -- but statements in the\
    \ outer statement block will be executed if the outer test succeeds.\n\n![](img/bf8dbdfb89042fadbaa73b4160c74bac_43_2.png)\n\
    \nifelse.cpp\n\n+   1. Start a new program by specifying the C++ library classes\
