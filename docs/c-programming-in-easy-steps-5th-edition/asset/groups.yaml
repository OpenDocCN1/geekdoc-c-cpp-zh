  md: "\n### Casting data types\n\nAny data stored in a variable can be forced (coerced)\
    \ into a variable of a different data type by a process known as \"casting\".\
    \ The cast statement simply states the data type to which the value should be\
    \ cast in parentheses preceding the name of the variable containing the data to\
    \ be cast. So casting syntax looks like this:\n\n```cpp\nvariable-name = ( data-type\
    \ ) variable-name ;\n```\n\nThis is the traditional form of casting that is also\
    \ found in the C programming language. A newer alternative available in C++ uses\
    \ angled brackets with the **static_cast** keyword like this:\n\n```cpp\nvariable-name\
    \ = static_cast < data-type > variable-name ;\n```\n\nThe newer version allows\
    \ casts to be more easily identified in source code by avoiding the use of parentheses,\
    \ which can easily be confused with parentheses in expressions. The newer form\
    \ of casting is preferred, but the older form is still widely found.\n\nCasting\
    \ is often necessary to accurately store the result of an arithmetic operation,\
    \ because dividing one integer by another integer will always produce an integer\
    \ result. For example, the integer division *7/2* produces the truncated integer\
    \ result of **3**.\n\nTo store the accurate floating-point result would require\
    \ the result be cast into a suitable data type, such as a **float**, like this:\n\
    \n```cpp\nfloat result = ( float ) 7 / 2 ;\n```\n\nOr alternatively using the\
    \ newer form of cast:\n\n```cpp\nfloat result = static_cast < float > 7 / 2 ;\n\
    ```\n\n![](img/bf8dbdfb89042fadbaa73b4160c74bac_39_0.png)\n\nThe result of dividing\
    \ an integer by another integer is truncated, not rounded – so a result of 9.9\
    \ would become 9.\n\nIn either case, it should be noted that operator precedence\
    \ casts the first operand into the specified data type before implementing the\
    \ arithmetic operation, so the statement can best be written as:\n\n```cpp\nfloat\
    \ result = static_cast < float > ( 7 ) / 2 ;\n```\n\nBracketing the expression\
    \ as *( 7 / 2 )* would perform the arithmetic first on integers, so the integer\
    \ result would be truncated before being cast into the **float** variable – not\
    \ the desired effect!\n\nCasting with both the older C-style form and the newer\
    \ C++ form is demonstrated in the program below.\n\n![](img/bf8dbdfb89042fadbaa73b4160c74bac_39_1.png)\n\
    \ncast.cpp\n\n- 1. Start a new program by specifying the C++ library classes to\
    \ include, and a namespace prefix to use\n\n```cpp\n#include <iostream>\nusing\
    \ namespace std ;\n```\n\n- 2. Add a main function containing a final **return**\
    \ statement\n\n```cpp\nint main()\n{\n    // Program code goes here.\n    return\
    \ 0;\n}\n```\n\n- 3. In the main function, insert statements to declare and initialize\
    \ integer, character, and floating-point variables\n\n```cpp\nint num = 7, factor\
    \ = 2 ;\nchar letter = 'A' ; float result = 0.0 ;\n```\n\n- 4. Output the result\
    \ of a plain integer division\n\n```cpp\ncout << \"Integer division: \" << ( num\
    \ / factor ) << endl ;\n```\n\n- 5. Now, cast the same division into a floating-point\
    \ variable and output that result\n\n```cpp\nresult = (float) ( num ) / factor\
    \ ;\ncout << \"Cast division float: \" << result << endl ;\n```\n\n- 6. Next,\
    \ cast a character variable into an integer variable and output that value\n\n\
    ```cpp\nnum = static_cast <int> ( letter ) ;\ncout << \"Cast character int: \"\
    \ << num << endl ;\n```\n\n- 7. Cast an integer into a character variable and\
    \ output it\n\n```cpp\nletter = static_cast <char> ( 70 ) ;\ncout << \"Cast integer\
    \ char: \" << letter << endl ;\n```\n\n- 8. Save, compile and run the program\
    \ to see the output\n\n![](img/bf8dbdfb89042fadbaa73b4160c74bac_40_0.png)\n\n\
    ![](img/bf8dbdfb89042fadbaa73b4160c74bac_40_1.png)\n\nASCII (pronounced \"askee\"\
    ) is the American Standard Code for Information Interchange, which is the accepted\
    \ standard for plain text. In ASCII, characters are represented numerically within\
    \ the range 0-127. Uppercase 'A' is 65, so that integer value gets cast into an\
    \ int variable.\n\n## Summary\n\n- Arithmetical operators can form expressions\
    \ with two operands for addition **+**, subtraction **-**, multiplication `*`,\
    \ division **/**, or modulus **%**.\n- Increment **++** and decrement **--** operators\
    \ modify a single operand by a value of one.\n- The assignment **=** operator\
    \ can be combined with an arithmetical operator to perform an arithmetical calculation,\
    \ then assign its result.\n- Comparison operators can form expressions comparing\
    \ two operands for equality **==**, inequality **!=**, greater **>**, lesser **<**,\
    \ greater or equal **>=**, and lesser or equal **<=** values.\n- Logical **&&**\
    \ and **||** operators form expressions evaluating two operands to return a Boolean\
    \ value of true or false.\n- The logical **!** operator returns the inverse Boolean\
    \ value of a single operand.\n- A ternary **?:** operator evaluates a given Boolean\
    \ expression, then returns one of two operands depending on its result.\n- The\
    \ **sizeof** operator returns the memory byte size of a variable.\n- An **int**\
    \ variable may be qualified as a **short** type for smaller numbers, or as a **long**\
    \ type for large numbers.\n- When an **int** variable will only store positive\
    \ numbers, it may be qualified as **unsigned** to extend its numeric range.\n\
    - It is important to explicitly set operator precedence in complex expressions\
    \ by adding parentheses **()**.\n- Data stored in a variable can be forced into\
    \ a variable of a different data type by the casting process.\n- C++ supports\
    \ traditional C-style casts and the newer form of casts that use the **static_cast**\
    \ keyword.\n\n## 3 Making statements\n\n*This chapter demonstrates C++ conditional\
    \ statements, which allow programs to branch in different directions, and introduces\
    \ C++ function structures.*\n\n- Branching with if\n- Switching branches\n- Looping\
    \ for\n- Looping while\n- Declaring functions\n- Passing arguments\n- Overloading\
    \ functions\n- Optimizing functions\n- Summary\n\n### Branching with if\n\nThe\
    \ C++ **if** keyword performs the basic conditional test that evaluates a given\
    \ expression for a Boolean value of **true** or **false** — and its syntax looks\
    \ like this:\n\n```cpp\nif (test-expression) { statements-to-execute-when-true\
    \ }\n```\n\n![](img/bf8dbdfb89042fadbaa73b4160c74bac_43_0.png)\n\nThe braces following\
    \ the test may contain one or more statements, each terminated by a semicolon,\
    \ but these will only be executed when the expression is found to be **true**.\
    \ When the test is found to be **false**, the program proceeds to its next task.\n\
    \nOptionally, an **if** statement can offer alternative statements to execute\
    \ when the test fails by appending an **else** statement block after the **if**\
    \ statement block, like this:\n\n```cpp\nif (test-expression) { statements-to-execute-when-true\
    \ }\nelse { statements-to-execute-when-false }\n```\n\n![](img/bf8dbdfb89042fadbaa73b4160c74bac_43_1.png)\n\
    \nWhere there is only one statement to execute when the test succeeds, the braces\
    \ may be omitted -- but retaining them aids code clarity.\n\nTo test two conditions,\
    \ the test expression may use the **&&** operator. For example, **if ( ( num >\
    \ 5 ) && ( letter == 'A' ) )**. Alternatively, an **if** statement can be \"nested\"\
    \ within another **if** statement, so those statements in the inner statement\
    \ block will only be executed when both tests succeed -- but statements in the\
    \ outer statement block will be executed if the outer test succeeds.\n\n![](img/bf8dbdfb89042fadbaa73b4160c74bac_43_2.png)\n\
    \nifelse.cpp\n\n- 1. Start a new program by specifying the C++ library classes\
    \ to include, and a namespace prefix to use\n\n```cpp\n#include <iostream>\nusing\
    \ namespace std ;\n```\n\n- 2. Add a main function containing a final **return**\
    \ statement\n\n```cpp\nint main()\n{\n    // Program code goes here.\n    return\
    \ 0 ;\n}\n```\n\n- 3. In the main function, insert statements to declare and initialize\
    \ two variables\n\n```cpp\nint num = 8 ;\nchar letter = 'A' ;\n```\n\n- 4. Next,\
    \ insert an **if-else** statement that tests the integer variable value and outputs\
    \ an appropriate response\n\n```cpp\nif ( num > 5 )\n{ cout << \"Number exceeds\
    \ five\" << endl ; }\n```\n"
  mdcn: "\n### 数据类型转换\n\n存储在变量中的任何数据都可以通过称为“类型转换”的过程被强制（coerce）转换为不同数据类型的变量。转换语句只需在包含待转换数据的变量名之前用括号指出值应转换成的数据类型。因此类型转换语法如下所示：\n\
    \n```cpp\nvariable-name = ( data-type ) variable-name ;\n```\n\n这是传统的转换形式，在 C\
    \ 编程语言中也能找到。C++ 中提供的一种较新的替代方案使用尖括号和 **static_cast** 关键字，如下所示：\n\n```cpp\nvariable-name\
    \ = static_cast < data-type > variable-name ;\n```\n\n较新的版本避免使用括号，从而更容易在源代码中识别类型转换，因为括号很容易与表达式中的括号混淆。较新的转换形式更受青睐，但旧形式仍然广泛存在。\n\
    \n为了准确存储算术运算的结果，类型转换通常是必要的，因为一个整数除以另一个整数总是产生整数结果。例如，整数除法 *7/2* 会产生截断后的整数结果 **3**。\n\
    \n要存储准确的浮点结果，需要将结果转换为合适的数据类型，例如 **float**，如下所示：\n\n```cpp\nfloat result = ( float\
    \ ) 7 / 2 ;\n```\n\n或者使用较新的转换形式：\n\n```cpp\nfloat result = static_cast < float\
    \ > 7 / 2 ;\n```\n\n![](img/bf8dbdfb89042fadbaa73b4160c74bac_39_0.png)\n\n一个整数除以另一个整数的结果会被截断，而不是四舍五入——因此\
    \ 9.9 的结果会变成 9。\n\n无论哪种情况，都应注意运算符优先级会先将第一个操作数转换为指定的数据类型，然后再执行算术运算，因此该语句最好写成：\n\
    \n```cpp\nfloat result = static_cast < float > ( 7 ) / 2 ;\n```\n\n将表达式括为 *( 7\
    \ / 2 )* 会先对整数执行算术运算，因此整数结果会在转换为 **float** 变量之前被截断——这不是想要的效果！\n\n下面的程序演示了使用旧式\
    \ C 风格形式和新式 C++ 形式进行类型转换。\n\n![](img/bf8dbdfb89042fadbaa73b4160c74bac_39_1.png)\n\
    \ncast.cpp\n\n- 1. 通过指定要包含的 C++ 库类和要使用的命名空间前缀，开始一个新程序\n\n```cpp\n#include <iostream>\n\
    using namespace std ;\n```\n\n- 2. 添加一个包含最终 **return** 语句的 main 函数\n\n```cpp\n\
    int main()\n{\n    // Program code goes here.\n    return 0;\n}\n```\n\n- 3. 在\
    \ main 函数中，插入语句以声明并初始化整数、字符和浮点变量\n\n```cpp\nint num = 7, factor = 2 ;\nchar letter\
    \ = 'A' ; float result = 0.0 ;\n```\n\n- 4. 输出普通整数除法的结果\n\n```cpp\ncout << \"\
    Integer division: \" << ( num / factor ) << endl ;\n```\n\n- 5. 现在，将相同的除法转换为浮点变量并输出该结果\n\
    \n```cpp\nresult = (float) ( num ) / factor ;\ncout << \"Cast division float:\
    \ \" << result << endl ;\n```\n\n- 6. 接下来，将字符变量转换为整数变量并输出该值\n\n```cpp\nnum = static_cast\
    \ <int> ( letter ) ;\ncout << \"Cast character int: \" << num << endl ;\n```\n\
    \n- 7. 将整数转换为字符变量并输出\n\n```cpp\nletter = static_cast <char> ( 70 ) ;\ncout <<\
    \ \"Cast integer char: \" << letter << endl ;\n```\n\n- 8. 保存、编译并运行程序以查看输出\n\n\
    ![](img/bf8dbdfb89042fadbaa73b4160c74bac_40_0.png)\n\n![](img/bf8dbdfb89042fadbaa73b4160c74bac_40_1.png)\n\
    \nASCII（读作“askee”）是美国信息交换标准代码，是纯文本的公认标准。在 ASCII 中，字符以 0-127 范围内的数值表示。大写字母 'A'\
    \ 是 65，因此该整数值会被转换为 int 变量。\n\n## 总结\n\n- 算术运算符可以构成包含两个操作数的表达式，用于加法 **+**、减法 **-**、乘法\
    \ `*`、除法 **/** 或取模 **%**。\n- 递增 **++** 和递减 **--** 运算符将单个操作数的值修改一。\n- 赋值 **=**\
    \ 运算符可以与算术运算符组合，执行算术计算，然后赋值其结果。\n- 比较运算符可以构成表达式，用于比较两个操作数的值：相等 **==**、不等 **!=**、大于\
    \ **>**、小于 **<**、大于或等于 **>=** 以及小于或等于 **<=**。\n- 逻辑 **&&** 和 **||** 运算符构成表达式，对两个操作数求值以返回\
    \ true 或 false 的布尔值。\n- 逻辑 **!** 运算符返回单个操作数的反向布尔值。\n- 三元 **?:** 运算符对给定的布尔表达式求值，然后根据其结果返回两个操作数之一。\n\
    - **sizeof** 运算符返回变量的内存字节大小。\n- **int** 变量可以限定为 **short** 类型以表示较小的数字，或限定为 **long**\
    \ 类型以表示较大的数字。\n- 当 **int** 变量只存储正数时，可以将其限定为 **unsigned** 以扩展其数值范围。\n- 在复杂表达式中，通过添加括号\
    \ **()** 显式设置运算符优先级很重要。\n- 存储在变量中的数据可以通过类型转换过程强制转换为不同数据类型的变量。\n- C++ 支持传统的 C 风格类型转换以及使用\
    \ **static_cast** 关键字的较新转换形式。\n\n## 3 编写语句\n\n*本章演示 C++ 条件语句，这些语句允许程序向不同方向分支，并介绍\
    \ C++ 函数结构。*\n\n- 使用 if 分支\n- 切换分支\n- for 循环\n- while 循环\n- 声明函数\n- 传递参数\n- 重载函数\n\
    - 优化函数\n- 总结\n\n### 使用 if 分支\n\nC++ **if** 关键字执行基本条件测试，对给定表达式求值以得到 **true** 或\
    \ **false** 的布尔值——其语法如下：\n\n```cpp\nif (test-expression) { statements-to-execute-when-true\
    \ }\n```\n\n![](img/bf8dbdfb89042fadbaa73b4160c74bac_43_0.png)\n\n测试后的花括号可以包含一条或多条语句，每条语句以分号结尾，但只有在表达式为\
    \ **true** 时才会执行这些语句。当测试结果为 **false** 时，程序继续执行下一个任务。\n\n可选地，**if** 语句可以通过在 **if**\
    \ 语句块之后附加 **else** 语句块，提供测试失败时要执行的替代语句，如下所示：\n\n```cpp\nif (test-expression) {\
    \ statements-to-execute-when-true }\nelse { statements-to-execute-when-false }\n\
    ```\n\n![](img/bf8dbdfb89042fadbaa73b4160c74bac_43_1.png)\n\n当测试成功时只有一条语句要执行，可以省略花括号——但保留它们有助于代码清晰。\n\
    \n要测试两个条件，测试表达式可以使用 **&&** 运算符。例如，**if ( ( num > 5 ) && ( letter == 'A' ) )**。或者，一个\
    \ **if** 语句可以“嵌套”在另一个 **if** 语句中，因此内层语句块中的那些语句只有在两个测试都成功时才会执行——但如果外层测试成功，外层语句块中的语句将会执行。\n\
    \n![](img/bf8dbdfb89042fadbaa73b4160c74bac_43_2.png)\n\nifelse.cpp\n\n- 1. 通过指定要包含的\
    \ C++ 库类和要使用的命名空间前缀，开始一个新程序\n\n```cpp\n#include <iostream>\nusing namespace std\
    \ ;\n```\n\n- 2. 添加一个包含最终 **return** 语句的 main 函数\n\n```cpp\nint main()\n{\n  \
    \  // Program code goes here.\n    return 0 ;\n}\n```\n\n- 3. 在 main 函数中，插入语句以声明并初始化两个变量\n\
    \n```cpp\nint num = 8 ;\nchar letter = 'A' ;\n```\n\n- 4. 接下来，插入一个 **if-else**\
    \ 语句，测试整数变量的值并输出适当的响应\n\n```cpp\nif ( num > 5 )\n{ cout << \"Number exceeds five\"\
    \ << endl ; }\n```\n"
