    using namespace std;\n```\n\n2. Declare a base ADT class named `Boat`, containing\
    \ a variable and accessor method together with one pure virtual method.\n\n```cpp\n\
    class Boat\n{\n    protected:\n        int length;\n    public:\n        int getLength()\
    \ { return length; }\n        virtual void Model() = 0;\n};\n```\n\n3. Declare\
    \ an ADT class (derived from the `Boat` class) named `Sailboat`—also containing\
    \ a variable and accessor method together with one pure virtual method.\n\n```cpp\n\
    class Sailboat : public Boat\n{\n    protected:\n        int mast;\n    public:\n\
