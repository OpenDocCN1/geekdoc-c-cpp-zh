  md: "\n- 4. Start a new program with a conditional test to seek the `_WIN32` and\
    \ `__linux` macros – to identify the platform\n\n  ```cpp\n  #ifdef _WIN32\n \
    \     #define PLATFORM \"Windows\"\n  #elif defined __linux\n      #define PLATFORM\
    \ \"Linux\"\n  #endif\n  ```\n\n- 5. Specify the library classes to include, and\
    \ the namespace\n\n  ```cpp\n  #include <iostream>\n  using namespace std ;\n\
    \  ```\n\n- 6. Now, add a main function containing a final `return` statement\
    \ and a statement to identify the host platform\n\n  ```cpp\n  int main()\n  {\n\
    \      cout << PLATFORM << \" System\" << endl ;\n      return 0 ;\n  }\n  ```\n\
    \n- 7. In the main function, insert statements to execute for specific platforms\n\
    \n  ```cpp\n  if ( PLATFORM == \"Windows\" )\n      cout << \"Performing Windows-only\
    \ tasks...\" << endl ;\n  if ( PLATFORM == \"Linux\" )\n      cout << \"Performing\
    \ Linux-only tasks...\" << endl ;\n  ```\n\n- 8. Save, compile, and run the program\
    \ to see platform-specific output\n\n![](img/bf8dbdfb89042fadbaa73b4160c74bac_158_0.png)\n\
    \n![](img/bf8dbdfb89042fadbaa73b4160c74bac_158_1.png)\n\n![](img/bf8dbdfb89042fadbaa73b4160c74bac_158_2.png)\n\
    \nThe predefined `_WIN32` macro has one underscore but the `__linux` macro has\
    \ two underscore characters.\n\n![](img/bf8dbdfb89042fadbaa73b4160c74bac_158_3.png)\n\
    \nThe conditional test of predefined macros could be extended to seek those of\
    \ other operating systems, and a final `#else` directive added to specify an \"\
    Unknown\" default.\n\n## Guarding inclusions\n\nTypically, a C++ program will\
    \ have many **.h** header files and a single **.cpp** implementation file containing\
    \ the main program. Header files may often contain one or more **#include** directives\
    \ to make other classes or functions available from other header files, and can\
    \ cause duplication where definitions appear in two files. For example, where\
    \ a header file includes another header file containing a function definition,\
    \ the compiler will consider that definition to appear in each file -- so compilation\
    \ will fail.\n\nThe popular solution to this problem of re-definition employs\
    \ preprocessor directives to ensure the compiler will only be exposed to a single\
    \ definition. These are known as \"inclusion guards\" and create a unique macro\
    \ name for each header file. Traditionally, the name is an uppercase version of\
    \ the file name, with the dot changed to an underscore. For example, **RUM_H**\
    \ for a file **rum.h**.\n\n![](img/bf8dbdfb89042fadbaa73b4160c74bac_159_0.png)\n\
    \nInclusion guards are also known as \"macro guards\" or simply as \"include guards\"\
    .\n\nIn creating a macro to guard against duplication, an **#ifndef** directive\
    \ first tests to see if the definition has already been made by another header\
    \ file included in the same program. If the definition already exists, the compiler\
    \ ignores the duplicate definition, otherwise a **#define** directive will permit\
    \ the compiler to use the definition in that header file:\n\n![](img/bf8dbdfb89042fadbaa73b4160c74bac_159_1.png)\n\
    \nadd.h\n\n![](img/bf8dbdfb89042fadbaa73b4160c74bac_159_2.png)\n\ntriple.h\n\n\
    ![](img/bf8dbdfb89042fadbaa73b4160c74bac_159_3.png)\n\nguard.cpp\n\n- 1. Create\
    \ a header file named \"add.h\" containing the inline declaration of an \"add\"\
    \ function\n\n  ```cpp\n  inline int add ( int x, int y ) { return ( x + y ) ;\
    \ }\n  ```\n\n- 2. Now, create a header file named \"triple.h\" containing a preprocessor\
    \ directive to make the add function available for use in the inline declaration\
    \ of a \"triple\" function\n\n  ```cpp\n  #include \"add.h\"\n\n  inline int triple\
    \ ( int x ) { return add( x, add( x, x ) ) ; }\n  ```\n\n- 3. Start a new program\
    \ with preprocessor directives to make both the add and triple functions available\n\
    \n  ```cpp\n  #include \"add.h\"\n  #include \"triple.h\"\n  ```\n\n- 4. Specify\
    \ the library classes to include and the namespace\n\n  ```cpp\n  #include <iostream>\n\
    \  using namespace std ;\n  ```\n\n- 5. Add a main function containing statements\
    \ that call both the **add()** and **triple()** functions from the included headers\n\
    \n  ```cpp\n  int main()\n  {\n      cout << \"9 + 3 = \" << add(9, 3) << endl\
    \ ;\n      cout << \"9 x 3 = \" << triple(9) << endl ;\n      return 0 ;\n  }\n\
    \  ```\n\n- 6. Save the files, then attempt to compile the program to see compilation\
    \ fail because the add function appears to be defined twice – in \"add.h\" and\
    \ by inclusion in \"triple.h\"\n\n![](img/bf8dbdfb89042fadbaa73b4160c74bac_160_0.png)\n\
    \n- 7. Edit the header file \"add.h\" to enclose the inline function declaration\
    \ within a preprocessor inclusion guard\n\n  ```cpp\n  #ifndef ADD_H\n  #define\
    \ ADD_H\n\n  inline int add ( int x, int y ) { return ( x + y ) ; }\n\n  #endif\n\
    \  ```\n\n- 8. Save the modified file, then compile and run the program – compilation\
    \ now succeeds because the inclusion guard prevents the apparent re-definition\
    \ of the add function\n\n![](img/bf8dbdfb89042fadbaa73b4160c74bac_160_1.png)\n\
    \n![](img/bf8dbdfb89042fadbaa73b4160c74bac_160_2.png)\n\nUse the conventional\
    \ naming scheme, where the macro name resembles the file name, to avoid conflicts.\n\
    \n![](img/bf8dbdfb89042fadbaa73b4160c74bac_160_3.png)\n\nAll header files should\
    \ contain header guards – add a **TRIPLE_H** macro to the triple.h file.\n\n##\
    \ Using macro functions\n\nThe **#define** directive can be used to create macro\
    \ functions that will be substituted in the source code before compilation.\n\n\
    A preprocessor function declaration comprises a macro name, immediately followed\
    \ by parentheses containing the function's arguments – it is important not to\
    \ leave any space between the name and the parentheses. The declaration is then\
    \ followed by the function definition within another set of parentheses. For example,\
    \ a preprocessor macro function to half an argument looks like this:\n\n```cpp\n\
    #define HALF(n) (n / 2)\n```\n\nCare should be taken when using macro functions,\
    \ because unlike regular C++ functions, they do not perform any kind of type checking\
    \ – so it's quite easy to create a macro that causes errors. For this reason,\
    \ inline functions are usually preferable to macro functions, but because macros\
    \ directly substitute their code, they avoid the overhead of a function call –\
    \ so the program runs faster. The resulting difference can be seen in the first\
    \ temporary file created during the compilation process:\n\n![](img/bf8dbdfb89042fadbaa73b4160c74bac_161_0.png)\n\
    \n- 1. Start a new program by defining two macro functions to manipulate a single\
    \ argument\n\n  ```cpp\n  #define SQUARE(n) (n * n)\n  #define CUBE(n) (n * n\
    \ * n)\n  ```\n\n- 2. After the macro function definitions, specify the library\
    \ classes to include, and a namespace prefix to use\n\n  ```cpp\n  #include <iostream>\n\
    \  using namespace std;\n  ```\n\n- 3. Next, declare two inline functions to manipulate\
    \ a single argument – just like the macro functions defined above\n\n  ```cpp\n\
    \  inline int square(int n) { return (n * n); }\n  inline int cube(int n) { return\
    \ (n * n * n); }\n  ```\n\n- 4. Add a main function containing a final return\
    \ statement\n\n  ```cpp\n  int main()\n  {\n      // Program code goes here.\n\
    \      return 0;\n  }\n  ```\n\n- 5. At the start of the main function block,\
    \ declare and initialize an integer variable\n\n  ```cpp\n  int num = 5;\n  ```\n\
    \n- 6. Now, insert statements to call each macro function and each comparable\
    \ inline function\n\n  ```cpp\n  cout << \"Macro SQUARE: \" << SQUARE(num) <<\
    \ endl;\n  cout << \"Inline square: \" << square(num) << endl;\n  cout << \"Macro\
    \ CUBE: \" << CUBE(num) << endl;\n  cout << \"Inline cube: \" << cube(num) <<\
    \ endl;\n  ```\n\n- 7. Save the file, then compile the program, saving the temporary\
    \ files and run the program\n\n  ```bash\n  c++ macro.cpp -save-temps -o macro.exe\n\
    \  ```\n\n## Building strings\n\nThe preprocessor # operator is known as the \"\
    stringizing\" operator, as it converts a series of characters passed as a macro\
    \ argument into a string – adding double quotes to enclose the string.\n\nAll\
    \ whitespace before or after the series of characters passed as a macro argument\
    \ to the stringizing operator is ignored, and multiple spaces between characters\
    \ is reduced to just one space.\n\nThe stringizing operator is useful to pass\
    \ string values to a preprocessor #define directive without needing to surround\
    \ each string with double quotes.\n\nA macro definition can combine two terms\
    \ into a single term using the ## merging operator. Where the combined term is\
    \ a variable name, its value is not expanded by the macro – it simply allows the\
    \ variable name to be substituted by the macro.\n\n![](img/bf8dbdfb89042fadbaa73b4160c74bac_163_0.png)\n\
    \nstrung.cpp\n\n- 1. Start a new program by defining a macro to create a string\
    \ from a series of characters passed as its argument, to substitute in an output\
    \ statement\n\n  ```cpp\n  #define LINEOUT( str ) cout << #str << endl\n  ```\n\
    \n- 2. Define a second macro to combine two terms passed as its arguments into\
    \ a variable name, to substitute in an output statement\n\n  ```cpp\n  #define\
    \ GLUEOUT( a, b ) cout << a##b << endl\n  ```\n\n- 3. After the macro definitions,\
    \ specify the library classes to include, and a namespace prefix to use\n\n  ```cpp\n\
    \  #include <string>\n  #include <iostream>\n  using namespace std ;\n  ```\n\n\
    - 4. Add a main function containing a final return statement\n\n  ```cpp\n  int\
    \ main()\n  {\n      // Program code goes here.\n      return 0 ;\n  }\n  ```\n\
    \n- 5. At the start of the main function block, declare and initialize a string\
    \ variable, then append a further string\n\n  ```cpp\n  string longerline = \"\
    They carried a net \" ;\n  longerline += \"and their hearts were set\" ;\n  ```\n\
    \n- 6. Now, add statements to output text using the macros\n\n  ```cpp\n  LINEOUT(In\
    \ a bowl to sea went wise men three) ;\n  LINEOUT(On a brilliant night in June)\
    \ ;\n  GLUEOUT( longer, line ) ;\n  LINEOUT(On fishing up the moon.) ;\n  ```\n\
    \n- 7. Save the file, then compile the program, saving the temporary files and\
    \ run the program\n\n  ```bash\n  c++ strung.cpp -save-temps -o strung.exe\n \
    \ ```\n\n![](img/bf8dbdfb89042fadbaa73b4160c74bac_163_1.png)\n\n- 8. Open the\
    \ temporary \".ii\" file in a plain text editor, like Notepad, to see that the\
    \ string\n"
  mdcn: "\n- 4. 新建一个程序，使用条件测试查找 `_WIN32` 和 `__linux` 宏，以识别平台\n\n  ```cpp\n  #ifdef\
    \ _WIN32\n      #define PLATFORM \"Windows\"\n  #elif defined __linux\n      #define\
    \ PLATFORM \"Linux\"\n  #endif\n  ```\n\n- 5. 指定要包含的库类和命名空间\n\n  ```cpp\n  #include\
    \ <iostream>\n  using namespace std ;\n  ```\n\n- 6. 现在，添加一个 main 函数，其中包含最后的 `return`\
    \ 语句和一条识别主机平台的语句\n\n  ```cpp\n  int main()\n  {\n      cout << PLATFORM << \"\
    \ System\" << endl ;\n      return 0 ;\n  }\n  ```\n\n- 7. 在 main 函数中，插入针对特定平台执行的语句\n\
    \n  ```cpp\n  if ( PLATFORM == \"Windows\" )\n      cout << \"Performing Windows-only\
    \ tasks...\" << endl ;\n  if ( PLATFORM == \"Linux\" )\n      cout << \"Performing\
    \ Linux-only tasks...\" << endl ;\n  ```\n\n- 8. 保存、编译并运行程序，查看特定于平台的输出\n\n![](img/bf8dbdfb89042fadbaa73b4160c74bac_158_0.png)\n\
    \n![](img/bf8dbdfb89042fadbaa73b4160c74bac_158_1.png)\n\n![](img/bf8dbdfb89042fadbaa73b4160c74bac_158_2.png)\n\
    \n预定义的 `_WIN32` 宏有一个下划线，而 `__linux` 宏有两个下划线字符。\n\n![](img/bf8dbdfb89042fadbaa73b4160c74bac_158_3.png)\n\
    \n对预定义宏的条件测试可以扩展为查找其他操作系统的宏，并添加最后的 `#else` 指令来指定 \"Unknown\" 默认值。\n\n## 包含保护\n\
    \n通常，一个 C++ 程序会有许多 **.h** 头文件和一个包含主程序的 **.cpp** 实现文件。头文件通常可能包含一个或多个 **#include**\
    \ 指令，以使其他头文件中的其他类或函数可用，并且当定义出现在两个文件中时可能导致重复。例如，当头文件包含另一个含有函数定义的头文件时，编译器会认为该定义出现在每个文件中——因此编译将失败。\n\
    \n解决这种重定义问题的常用方案是使用预处理指令，确保编译器只接触到一个定义。这些被称为“包含保护”，并为每个头文件创建一个唯一的宏名。传统上，名称是文件名的大写版本，并将点改为下划线。例如，文件\
    \ **rum.h** 的宏名为 **RUM_H**。\n\n![](img/bf8dbdfb89042fadbaa73b4160c74bac_159_0.png)\n\
    \n包含保护也称为“宏保护”，或简称为“包含守卫”。\n\n在创建用于防止重复的宏时，**#ifndef** 指令首先检查该定义是否已由同一程序中包含的另一个头文件创建。如果定义已存在，编译器会忽略重复定义；否则，**#define**\
    \ 指令将允许编译器使用该头文件中的定义：\n\n![](img/bf8dbdfb89042fadbaa73b4160c74bac_159_1.png)\n\
    \nadd.h\n\n![](img/bf8dbdfb89042fadbaa73b4160c74bac_159_2.png)\n\ntriple.h\n\n\
    ![](img/bf8dbdfb89042fadbaa73b4160c74bac_159_3.png)\n\nguard.cpp\n\n- 1. 创建一个名为\
    \ \"add.h\" 的头文件，其中包含 \"add\" 函数的内联声明\n\n  ```cpp\n  inline int add ( int x, int\
    \ y ) { return ( x + y ) ; }\n  ```\n\n- 2. 现在，创建一个名为 \"triple.h\" 的头文件，其中包含一条预处理指令，使\
    \ add 函数可用于 \"triple\" 函数的内联声明\n\n  ```cpp\n  #include \"add.h\"\n\n  inline int\
    \ triple ( int x ) { return add( x, add( x, x ) ) ; }\n  ```\n\n- 3. 新建一个程序，使用预处理指令使\
    \ add 和 triple 函数都可用\n\n  ```cpp\n  #include \"add.h\"\n  #include \"triple.h\"\
    \n  ```\n\n- 4. 指定要包含的库类和命名空间\n\n  ```cpp\n  #include <iostream>\n  using namespace\
    \ std ;\n  ```\n\n- 5. 添加一个 main 函数，其中包含调用所包含头文件中 **add()** 和 **triple()** 函数的语句\n\
    \n  ```cpp\n  int main()\n  {\n      cout << \"9 + 3 = \" << add(9, 3) << endl\
    \ ;\n      cout << \"9 x 3 = \" << triple(9) << endl ;\n      return 0 ;\n  }\n\
    \  ```\n\n- 6. 保存文件，然后尝试编译程序，会看到编译失败，因为 add 函数似乎被定义了两次——一次在 \"add.h\" 中，一次通过 \"\
    triple.h\" 的包含引入\n\n![](img/bf8dbdfb89042fadbaa73b4160c74bac_160_0.png)\n\n- 7.\
    \ 编辑头文件 \"add.h\"，将内联函数声明包含在预处理包含保护中\n\n  ```cpp\n  #ifndef ADD_H\n  #define ADD_H\n\
    \n  inline int add ( int x, int y ) { return ( x + y ) ; }\n\n  #endif\n  ```\n\
    \n- 8. 保存修改后的文件，然后编译并运行程序——现在编译成功，因为包含保护防止了 add 函数看似重定义\n\n![](img/bf8dbdfb89042fadbaa73b4160c74bac_160_1.png)\n\
    \n![](img/bf8dbdfb89042fadbaa73b4160c74bac_160_2.png)\n\n使用常规命名方案，使宏名类似于文件名，以避免冲突。\n\
    \n![](img/bf8dbdfb89042fadbaa73b4160c74bac_160_3.png)\n\n所有头文件都应包含头文件保护——向 triple.h\
    \ 文件添加 **TRIPLE_H** 宏。\n\n## 使用宏函数\n\n**#define** 指令可用于创建宏函数，这些宏函数将在编译前在源代码中被替换。\n\
    \n预处理函数声明由宏名组成，宏名后紧跟包含函数参数的括号——重要的是不要在名称和括号之间留任何空格。声明之后是另一组括号中的函数定义。例如，一个将参数减半的预处理宏函数如下所示：\n\
    \n```cpp\n#define HALF(n) (n / 2)\n```\n\n使用宏函数时应小心，因为与常规 C++ 函数不同，它们不执行任何类型的类型检查——因此很容易创建导致错误的宏。因此，内联函数通常比宏函数更可取，但由于宏直接替换其代码，它们避免了函数调用的开销——因此程序运行得更快。由此产生的差异可以在编译过程中创建的第一个临时文件中看到：\n\
    \n![](img/bf8dbdfb89042fadbaa73b4160c74bac_161_0.png)\n\n- 1. 通过定义两个宏函数来操作单个参数，开始一个新程序\n\
    \n  ```cpp\n  #define SQUARE(n) (n * n)\n  #define CUBE(n) (n * n * n)\n  ```\n\
    \n- 2. 在宏函数定义之后，指定要包含的库类和要使用的命名空间前缀\n\n  ```cpp\n  #include <iostream>\n  using\
    \ namespace std;\n  ```\n\n- 3. 接下来，声明两个内联函数来操作单个参数——就像上面定义的宏函数一样\n\n  ```cpp\n\
    \  inline int square(int n) { return (n * n); }\n  inline int cube(int n) { return\
    \ (n * n * n); }\n  ```\n\n- 4. 添加一个包含最后 return 语句的 main 函数\n\n  ```cpp\n  int\
    \ main()\n  {\n      // Program code goes here.\n      return 0;\n  }\n  ```\n\
    \n- 5. 在 main 函数块的开头，声明并初始化一个整数变量\n\n  ```cpp\n  int num = 5;\n  ```\n\n- 6. 现在，插入语句以调用每个宏函数和每个可比较的内联函数\n\
    \n  ```cpp\n  cout << \"Macro SQUARE: \" << SQUARE(num) << endl;\n  cout << \"\
    Inline square: \" << square(num) << endl;\n  cout << \"Macro CUBE: \" << CUBE(num)\
    \ << endl;\n  cout << \"Inline cube: \" << cube(num) << endl;\n  ```\n\n- 7. 保存文件，然后编译程序并保存临时文件，再运行程序\n\
    \n  ```bash\n  c++ macro.cpp -save-temps -o macro.exe\n  ```\n\n## 构建字符串\n\n预处理器的\
    \ # 运算符被称为“字符串化”运算符，因为它将作为宏参数传入的一系列字符转换为字符串——并添加双引号将字符串括起来。\n\n作为宏参数传递给字符串化运算符的字符序列前后的所有空白都会被忽略，字符之间的多个空格会缩减为仅一个空格。\n\
    \n字符串化运算符可用于将字符串值传递给预处理器 #define 指令，而无需用双引号括住每个字符串。\n\n宏定义可以使用 ## 合并运算符将两个项合并为一个项。当合并后的项是变量名时，其值不会被宏展开——它只是允许该变量名被宏替换。\n\
    \n![](img/bf8dbdfb89042fadbaa73b4160c74bac_163_0.png)\n\nstrung.cpp\n\n- 1. 通过定义一个宏来开始一个新程序，该宏从作为其参数传入的一系列字符创建字符串，以替换到输出语句中\n\
    \n  ```cpp\n  #define LINEOUT( str ) cout << #str << endl\n  ```\n\n- 2. 定义第二个宏，将作为其参数传入的两个项合并为变量名，以替换到输出语句中\n\
    \n  ```cpp\n  #define GLUEOUT( a, b ) cout << a##b << endl\n  ```\n\n- 3. 在宏定义之后，指定要包含的库类和要使用的命名空间前缀\n\
    \n  ```cpp\n  #include <string>\n  #include <iostream>\n  using namespace std\
    \ ;\n  ```\n\n- 4. 添加一个包含最后 return 语句的 main 函数\n\n  ```cpp\n  int main()\n  {\n\
    \      // Program code goes here.\n      return 0 ;\n  }\n  ```\n\n- 5. 在 main\
    \ 函数块的开头，声明并初始化一个字符串变量，然后追加另一个字符串\n\n  ```cpp\n  string longerline = \"They carried\
    \ a net \" ;\n  longerline += \"and their hearts were set\" ;\n  ```\n\n- 6. 现在，添加使用宏输出文本的语句\n\
    \n  ```cpp\n  LINEOUT(In a bowl to sea went wise men three) ;\n  LINEOUT(On a\
