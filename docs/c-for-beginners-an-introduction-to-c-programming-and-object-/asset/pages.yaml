  md: "specified condition is checked again and if it evaluates to a non-zero number,\
    \ the block is executed again. This process goes on until the specified condition\
    \ evaluates to *0 or a negative number*. Each instance of a loop block execution\
    \ is known as an *iteration*.\n\nHere is a snippet to display numbers from 1 to\
    \ 10 on the screen using a while loop:\n\n```\n```cpp\n//Initialize an integer\
    \ variable to 1\nint number = 1;\nwhile ( number <= 10 )\n{\n    //Display number\n\
