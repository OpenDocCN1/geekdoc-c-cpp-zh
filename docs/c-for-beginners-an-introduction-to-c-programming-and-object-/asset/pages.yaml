  md: "In order to better understand this concept, let us write a C++\nprogram with\
    \ two functions two swap two input values. One\nusing the pass by value method\
    \ and the other with pass by\nreference method:\n\n```\n```cpp\n#include <iostream>\n\
    \nusing namespace std;\n\nvoid swap_by_value (int, int);\nvoid swap_by_reference\
    \ (int &, int &);\n\nvoid swap_by_value (int x, int y)\n{\n    int temp = x;\n\
    \    x = y;\n    y = temp;\n    //Display x and y\n    cout << endl << endl <<\
    \ \"Inside swap_by_value\" << endl\n         << endl\n         << \"x: \" << x\
    \ << \"    y: \" << y << endl;\n}\nvoid swap_by_reference (int &x, int &y)\n{\n\
