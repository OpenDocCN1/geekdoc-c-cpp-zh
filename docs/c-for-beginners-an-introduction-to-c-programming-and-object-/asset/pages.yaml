  md: "# 15. Inheritance\n\nInheritance is a concept in Object Oriented Programming\
    \ which allows us to derive a new class by inheriting the properties of an existing\
    \ class. Properties can include data members and also member functions. The existing\
    \ class is called *base class* and the new class is called *derived class*. This\
    \ process allows facilitates code reusability. Instead of writing a new class\
    \ all over again, we can use the properties of an existing class and write only\
    \ the additional properties that are required.\n\nConsider a class called *Person*\
    \ with public data members – *FirstName, LastName and City*. The declaration would\
    \ of this class is as follows:\n\n```\nclass Person\n{\n    public:\n        char\
    \ FirstName[20], LastName[20], City[20];\n};\n```\n\nIt would look like this:\n\
    \n![](img/cda5b023e23ffd0b87fc37b1da33973d_147_0.png)"
  merge: -1
  img_proc: true
