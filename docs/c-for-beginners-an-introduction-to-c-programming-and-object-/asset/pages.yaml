    # ### 3.3 Pre-processor directives


    Pre-processor directives are statements that begin with a hash (#) symbol. Unlike
    normal statements, these do not end with a semi colon and hence each pre processor
    directive must be written on a new line. Pre-processor directives are processed
    before the compilation process begins. In a way, these provide meta information
    to the compiler. Here are some examples of pre-processor directives:


    ```

    ```

    #include <iostream>

    #define PI 3.14

    #pragma startup myfunction

    ```

    ```


    Pre-processor directives other than #include and #define are for advanced programmers,
    this book covers only the ones required.


    # ### 3.4 Comments


    Comments are ignored by the compiler and will not have any effect on the outcome
    of the compilation process. Usually, comments are explanatory statements but you
    can use them for any annotation purpose. C++ offers single-line and multi-line
    comments. Single line comments start with double-slash ( // ) and must terminate
    on the same line. Multi line comments are'
  merge: -1
  img_proc: true
