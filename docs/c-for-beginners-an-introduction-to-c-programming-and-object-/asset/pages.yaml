    **#include <iostream>** Statements instructs the compiler to include the *iostream*
    header which provides an **Input/Output Stream** used to read data from the user
    and display data on the screen. If you want to write a standalone C++ program
    that interacts with the user either by accepting inputs or displaying something
    on the screen, you have to place **#include <iostream>** in your program, usually
    on the first few lines.


    There are many such built in headers provided by different compilers. For example,
    *fstream* header is used for File Input/Output, *iomanip* is used for formatting
    output to be displayed on the screen, *cmath* provides definitions to carry out
    mathematical functions and so on. C++ is also backward compatible with most of
