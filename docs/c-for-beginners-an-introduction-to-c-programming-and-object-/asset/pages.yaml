  md: "# 12.2 Passing Pointer to a Function\n\nIn Section 9, we learned two methods\
    \ to send values to a function – *pass by value* and *pass by reference*. In this\
    \ section, we’ll learn the third method – *pass by pointer*.\n\nPass by pointer\
    \ method works like pass by reference method where in the changes made to the\
    \ variables in the function definition will be reflected back in the calling function.\
    \ The difference however is, instead of passing the reference to a variable, the\
    \ actual memory address of the variable is passed. In order to pass the address\
    \ of a variable, *ampersand sign (&)* will have to be prefixed to the variable\
    \ name while calling the function and in the function definition, this address\
    \ needs to be received in a pointer variable of the same data type. Here is a\
    \ code snippet which demonstrates the pass by pointer method:\n\n```\nvoid swap\
    \ ( int *a, int *b )\n{\n    int temp = *a ;\n    *a = *b ;\n    *b = temp ;\n\
    }\n//Function call:\nint x = 10 , y = 30 ;\nswap ( &x , &y );\n```\n\nThere is\
    \ a swap function which accepts two *integer pointers* as parameters. In the function\
    \ definition, the value at the addresses of these two variables are swapped using\
    \ a temporary"
