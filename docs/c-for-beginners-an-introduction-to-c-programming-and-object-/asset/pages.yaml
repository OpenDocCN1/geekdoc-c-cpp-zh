    |---|---|---|---|

    | + | Addition | a + b | Performs arithmetic addition, returns sum of the operands.
    |

    | - | Subtraction | a - b | Performs arithmetic subtraction, returns difference
    of the operands. |

    | * | Multiplication | a * b | Multiplies operands and returns the arithmetic
    product. |

    | / | Division | a / b | Performs division and returns the arithmetic quotient.
    |

    | % | Modulus | a % b | Performs division and returns the remainder. Usage is
    restricted to integer type operands only. |

    | ++ | Increment | a ++ | Increments the value of an operand by 1. Two variations:
    Post increment (a ++) and Pre increment (++ a). This operator works only on integer
    variables. |

    | -- | Decrement | a -- | Decrements the value of an operand by 1. Two variations:
    Post increment (a --) and Pre increment (-- a). This operator works only on integer
    variables. |'
