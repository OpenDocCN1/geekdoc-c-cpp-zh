- pgno: 149
  md: "have to only declare two data members inside the *Student class* – *School\
    \ and Grade*. The general syntax for inheritance is:\n\n```\n    class <Derived\
    \ Class Name> : <Access Type> <Base\n    Class Name>\n    {\n        //Class Definition\n\
    \    };\n```\n\nOnly public and protected class members of a class can be inherited\
    \ into another class; private class members cannot be inherited.\n\n*Access Type*\
    \ can be *public, private or protected*. If Access Type is:\n\n+   - *public:*\n\
    +     - public class members of the base class are inherited and made public in\
    \ the derived class.\n+     - Protected class members of the base class are inherited\
    \ and made protected in the derived class.\n+   - *protected:*\n+     - public\
    \ and protected class members of the base are inherited and made protected in\
    \ the derived class.\n+       - *private:*\n+     - public and protected class\
    \ members of the base class are inherited and made private in the derived class"
  merge: -1
