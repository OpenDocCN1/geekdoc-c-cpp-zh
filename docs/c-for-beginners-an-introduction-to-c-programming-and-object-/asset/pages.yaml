  md: "The class definition will look like this:\n\n```\n```\nclass Test\n{\n    int\
    \ x, y;\n    public:\n    void setData (int , int);\n    void displayData ();\n\
    };\n```\n```\n\nDefinitions of *setData* and *displayData* are straightforward\
    \ and hence will not be covered separately.\n\nLet us overload the *addition operator\
    \ ( + )* to add the contents of two Test objects. That is, if *t1* and *t2* were\
    \ two objects of *Test class*, then *t1 + t2* would perform *t1.x + t2.x* and\
    \ *t1.y + t2.y* and return the resulting object.\n\nThe general syntax for operator\
    \ overloading is:\n\n```\n```\n<Return      Type/Class>      operator<operator>\
    \      (\n<parameters> )\n{\n    //Definition\n    return <Object>;\n}\n```\n\
    ```\n\nThis has to be present inside the class under public member's section.\n\
    \nOperator overloading boils down to defining this function. Let us see how we\
    \ need to define this function for achieving our goal:"
  merge: -1
  img_proc: true
- pgno: 161
  md: "+   1. We know that *t1 + t2* will return another object of *Test* type hence\
    \ the return type will be *Test*.\n+   2. Left operand's (*t1*'s) *x* and *y*\
    \ will be directly accessible. Right operand will be passed as a parameter to\
    \ this operator's function. Hence we will have to include a parameter of *Test*\
    \ type. Let us declare that parameter as *Test Right*.\n+   3. We will need an\
    \ object of *Test* class to store the result of this addition. We will declare\
    \ this object as *Test Result*.\n+   4. Left operand's *x* needs to be added to\
    \ *Right*'s *x* and stored in *Result*'s *x*; Left operand's *y* needs to be added\
    \ to *Right*'s *y* and stored in *Result*'s *y*; This is done as follows:\n+ \
    \      \n+       ```\n+       Result.x = x + Right.x ;\n+       Result.y = y +\
    \ Right.y ;\n+       ```\n+   5. Finally, the *Result* object should be returned.\n\
    \nPutting all these points together, we have the following operator definition:\n\
    \n```\n```\nTest operator+(Test Right)\n{\n    Test Result;\n    Result.x = x\
    \ + Right.x;\n    Result.y = y + Right.y;\n    return Result;\n}\n```\n```\n\n\
    Here is the complete C++ program:\n\n```\n```\n#include <iostream>\n```\n```"
  merge: -1
