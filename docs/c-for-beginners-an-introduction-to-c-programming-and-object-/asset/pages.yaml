    # ### 5.2.2 #define Pre-processor directive


    All pre-processor directives are read and interpreted before the compilation process
    begins. #define directive is used to define custom identifiers and set their values.
    Since this process happens before the actual compilation, these custom identifiers
    are not treated as traditional variable. These statements do not terminate with
    a semicolon. General Syntax:


    ```

    ```cpp

    #define <identifier> <value>


    #define number 123

    #define name "Chad"

    #define PI 3.14

    ```

    ```


    As seen, there is no need to specify a data type and you can define all sorts
    of constant identifiers with the #define directive. The way this method works
    is slightly different. When the compiler encounters a #define directive, the subsequent
    identifier and its corresponding value is fetched. The compiler then directly
    substitutes this identifier with its fetched value wherever that particular identifiers
    appears in the code. This is a part of the pre-processing step and is transparent
    to the user; meaning, the user does not see this happening.


    This method will get clearer with an example. Let us consider there are two identifiers
    called – shape and PI having values of “Circle” and 3.14 respectively. Here is
