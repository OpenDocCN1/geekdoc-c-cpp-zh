  md: "# 3. Syntax\n\nC++ is a case sensitive language. This means, “ebook” and “eBook”\
    \ are treated differently. In this section, we will discuss the basic syntax of\
    \ C++ and also learn to write a basic program.\n\n# 3.1 Statements\n\nA statement\
    \ in a programming language carries out some computational function. Statements\
    \ in C++ end with a semi-colon ( ; ). Although it is possible to have as many\
    \ statements as desired on one line with each statement being separated with a\
    \ semi-colon, it is not really recommended as the code will look messy and the\
    \ code-readability will reduce. It is best practice to have one statement on one\
    \ line. Some examples of statements are:\n\n```\n```cpp\nc = 50;\ncout << \"Hello\
    \ World\";\nint a = c * 2;\n```\n```\n\n# 3.2 Blocks\n\nA block is a group of\
    \ statements enclosed within curly brackets ( { } ). Here is an example:\n\n```\n\
    ```cpp\n{\n    int a, b, c;\n    cout << \"This is a block\";\n}\n```\n```"
  merge: -1
  img_proc: true
