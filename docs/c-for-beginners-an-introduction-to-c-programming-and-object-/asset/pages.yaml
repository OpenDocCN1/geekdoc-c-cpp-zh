    Now, let us learn to write a simple C++ program which displays a message on the
    screen. The *iostream* header provides an object called *cout* which is used to
    display data on the *standard character output* device, which in most cases is
    the computer screen. There is a way to redirect output to a different device using
    *I/O streams* and not the default computer screen, which is fairly an advanced
    topic and beyond the scope of this book. You will invariably use *cout* to display
    data only on the screen throughout the course of this book. *cout* belongs to
    the *std* namespace of the *iostream* header and hence `std ::` needs to be prefixed
    to *cout*.


    The general syntax of using *cout* is:


    ```

    ```

    std :: cout << {data};

    ```

