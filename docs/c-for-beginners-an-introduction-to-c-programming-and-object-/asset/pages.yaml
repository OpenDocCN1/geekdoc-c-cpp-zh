  md: "Let us take an example of function overloading that shows the real beauty of\
    \ this concept. A function called *area* will be overloaded 3 times, where each\
    \ definition will compute the area of circle, rectangle and a triangle with the\
    \ appropriate area formulae. We know that to compute the area of a circle, only\
    \ 1 parameter is needed - radius. To calculate the areas of rectangle and triangle,\
    \ two arguments are needed - length & width and base & height respectively. The\
    \ area function of a circle can be uniquely identified from the other two functions\
    \ based on the number of arguments. To uniquely identify area functions of rectangle\
    \ and triangle, we will change the data type of the input parameters.\n\nHere\
    \ is the C++ code that accomplishes whatever we have just discussed:\n\n```\n\
    ```cpp\n#include <iostream>\n\nusing namespace std;\n\nfloat area ( int radius\
    \ )\n{\n    return ( 3.14 * radius * radius );\n}\n\nfloat area ( float base,\
    \ float height )\n{\n    // Return (1/2) x base x height\n    return ( (1 / 2)\
    \ * base * height );\n}\n\nint area ( int length, int width )\n{\n    return (\
    \ length * width );\n}\n```\n```"
