  md: "# ## 17.5 String Palindrome\n\nA string is said to be a palindrome if the string\
    \ and its reverse are the same. Consider a string - \"madam\". If you reverse\
    \ the word \"madam\", you will still get \"madam\". This is a palindrome. Let\
    \ us write a C++ program to take a string as an input from the user. We shall\
    \ then reverse the string using a *for loop* and check if the original string\
    \ and its reverse are the same using *strcmp* function (from *cstring* header).\
    \ The strcmp function will return 0 if both strings are equal. Here is the C++\
    \ program:\n\n```\n```cpp\n#include <iostream>\n#include <cstring>\n\nusing namespace\
    \ std;\n\nint main ()\n{\n    char str[ ], reverse[ ];\n    int length, j;\n \
    \   // Temporary variable for swapping purpose\n    int temp;\n    //Ask the user\
    \ to enter a string\n    cout << endl << endl << \"Enter a string: \";\n    //Wait\
    \ for user to enter\n    cin.getline (str, sizeof (str) );\n    length = strlen\
    \ (str);\n    // for reverse\n    strcpy (reverse , str);\n    //Reverse the string,\
    \ store in reverse\n    for ( int i = (length - 1); i > ((length - 1) / 2) ; i--\
    \ )\n    {\n        temp = reverse [i];\n```\n```"
