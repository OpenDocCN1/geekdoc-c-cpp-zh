    # 7.2 Logical Operators


    Logical operators are used to carry out logical AND, OR and NOT. These return
    0 or 1. 0 (and negative numbers) is regarded as false, and 1 (and all positive
    numbers) is regarded as true.


    | Operator | Description | Sample Usage | Explanation |

    |---|---|---|---|

    | && | Logical AND | a && b | Compares operands and returns 1 if all the values
    are non-zero, returns 0 otherwise. |

    | \|\| | Logical OR | a \|\| b | Compares operands and returns 1 if any one of
    the values is non-zero, returns 0 otherwise. |

    | ! | Logical NOT | !a | Returns inverted value of the operand. If the operand
    has a true value (non-zero), 0 will be returned and if the operand has false value
    (0 or negative), 1 will be returned. |'
