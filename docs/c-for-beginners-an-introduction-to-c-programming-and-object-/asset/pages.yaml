- pgno: 94
  md: "function, the value of *number* will be unaltered in the calling function.\n\
    \n# 9.2.2 Pass by Reference\n\nIn this method, when a value is passed to a function,\
    \ it is received in the function using a reference variable. A reference variable\
    \ in a function definition is denoted by a prefixed *ampersand symbol (&).* Any\
    \ changes made to those variables will be reflected back in the calling function.\
    \ Rest of the procedures remains the same including the function call. Let us\
    \ slightly modify the *multiply_by_10* function from the previous section:\n\n\
    ```\n```cpp\nvoid multiply_by_10 ( float &num )\n{\n    num = num * 10;\n}\n```\n\
    ```\n\nAny changes that are made to *num* will be reflected back in the calling\
    \ function, hence there is no need to return a value.\n\nFunction call:\n\n```\n\
    ```cpp\nfloat number = 1.2 ;\nmultiply_by_10 ( number );\n```\n```\n\nWhile making\
    \ the function call, the value of the variable *number* is not passed, instead\
    \ a *reference to that variable* is passed. The function definition increases\
    \ the value of the parameter by a factor 10. Since pass by reference method is\
    \ used, the local variable *number* will now hold a value of 12."
