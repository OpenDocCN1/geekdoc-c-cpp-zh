    memory is allocated. C++ offers built in data types as well as user-defined ones.
    User defined data types are formed using classes and objects. If you are familiar
    with programming, you must have already heard of data types such as *int* (for
    integer values), *float* (for floating point/decimal values), *char* (for character
    values), etc. Here''s a list of built in data types:


    | Type | Size | Range |

    |---|---|---|

    | char | 1 byte | -127 to 127 or 0 to 255 |

    | unsigned char | 1 byte | 0 to 255 |

    | signed char | 1 byte | -127 to 127 |

    | int | 4 bytes | -2147483648 to 2147483647 |

    | unsigned int | 4 bytes | 0 to 4294967295 |

    | signed int | 4 bytes | -2147483648 to 2147483647 |

    | short int | 2 bytes | -32768 to 32767 |

    | unsigned short int | 2 bytes | 0 to 65,535 |

    | signed short int | 2 bytes | -32768 to 32767 |

    | long int | 4 bytes | -2,147,483,648 to 2,147,483,647 |

    | signed long int | 4 bytes | -2,147,483,648 to 2,147,483,647 |

    | unsigned long int | 4 bytes | 0 to 4,294,967,295 |

    | float | 4 bytes | -1.17549e-38 to -3.40282e+38 |

    | double | 8 bytes | -2.22507e-308 to -1.79769e+308 |'
