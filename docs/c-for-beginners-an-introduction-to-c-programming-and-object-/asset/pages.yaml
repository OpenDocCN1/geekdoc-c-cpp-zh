    \ expression returns 1, the statements inside the *if-block* are executed. A 0\
    \ value will skip the execution of the *if-block*. A block is enclosed within\
    \ curly brackets ({ }). The *if-block* can be followed by an optional *else-block*\
    \ as follows:"
