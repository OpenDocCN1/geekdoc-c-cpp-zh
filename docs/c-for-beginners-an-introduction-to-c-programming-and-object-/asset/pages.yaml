  md: 'Prefixing `std::` to `cout`, `endl` and other members of the `std` namespace
    may be cumbersome. There is a way to avoid this by telling the compiler in the
    beginning that you will be using the `std namespace`. This is done with the help
    of the `using` keyword; the following statement should be inserted after the include
    statement:


    ```

    ```cpp

    using namespace std;

    ```

    ```


    If you have included this statement in your code, `std::cout` becomes `cout`,
    `std::endl` becomes `endl` and all the other members of the `std namespace` can
    be used without `std::`.


    Instead of `endl`, the escape sequence `\n` can be used within a string to insert
    a new line. Another useful escape sequence is `\t` which is used to insert a tab-space.


    Let us write another C++ program by including the `using namespace std` statement
    in order to get rid of the `std::` prefix. The program shall also demonstrate
    the usage `\n` and `\t` escape sequences:


    ```

    ```cpp

    // get rid of std:: prefix

    using namespace std;


    // ... main method

    int main ()

    {

    ```

    ```'
