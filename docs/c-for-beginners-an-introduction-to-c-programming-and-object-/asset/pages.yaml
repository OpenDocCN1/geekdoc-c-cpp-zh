    # 14.2 Constructor Overloading


    Constructor Overloading works just like function overloading; i.e. A class can
    have multiple constructors with different definitions. Constructors can be overloaded
    on the basis of the number of parameters and the type of parameters. Function
    Overloading has been covered comprehensively in _Section 9.4_ hence there is no
    need to cover Constructor Overloading separately. However, we will take a look
    at an example wherein we will recall the _Car class_ and have 3 different constructor
    definitions for it. Three different definitions will be for facilitating no parameters,
    1 parameter and 3 parameters. The one with no parameters is a _default constructor_,
    does nothing significant in this case; the one with one parameter sets only _Displacement_
    and the one with 3 parameters sets _Manufacturer, Model and Displacement_.


