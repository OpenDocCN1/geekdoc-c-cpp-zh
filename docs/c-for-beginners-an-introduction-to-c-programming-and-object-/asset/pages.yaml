  md: '# 5. Variables and Constants


    # 5.1 Variables


    A variable is a name given to a memory location which holds data. When a variable
    is declared, some space needs to be reserved in the system memory. This is done
    by the operating system. The memory allocation is usually random in nature and
    hence variable names come in handy as aliases to memory locations. In the previous
    section, we have learned about the available built-in data types in C++. A data
    type must be specified while declaring a variable. General Syntax:


    ```

    ```text

    <data type> <variable name>;

    eg:

    int a;

    float b;

    char c;

    string name;

    ```

    ```


    Variables of the same data type can be declared on the same line by separating
    them using a comma:


    ```

    ```text

    <data type> <variable 1>, <variable 2>;

    eg:

    int a, b, c;

    float x, y;

    long double m, n;

    ```

    ```


    It is also possible to initialize variables by assigning them a value using the
    assignment operator (=). There is a chapter in this book which explains operators
    in depth. As of now, you only have to understand how the assignment operator works.
    The job'
