    An operator in a programming language is a symbol that performs a specific task.
    Operators in C++ are used to perform mathematical, logical or comparison operations.
    The following types of operators are available:


    +   1. Arithmetic Operators

    +   2. Logical Operators

    +   3. Bitwise Operators

    +   4. Relational Operators

    +   5. Assignment Operators


    # 7.1 Arithmetic Operators


    Arithmetic operators are used to perform arithmetic/mathematical operations such
    as addition, subtraction, division, etc.'
