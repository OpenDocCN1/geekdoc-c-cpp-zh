    \n# 9.2.1 Pass by Value\n\nWith this method, the value of the variable is passed\
    \ to the function. In the function definition, the passed values are accepted\
    \ in different variables. Hence, any changes made to the received variable in\
    \ the function definition do not reflect back to the calling function. The examples\
    \ explained so far were using pass by value method.\n\nHere is an example which\
    \ accepts a float value, multiplies itself by 10 and returns the new value:\n\n\
    ```\n```cpp\nfloat multiply_by_10 ( float num )\n{\n    num = num * 10;\n    return\
    \ num;\n}\nFunction call:\nfloat number = 1.2 ;\nfloat x = multiply_by_10 ( number\
    \ );\n```\n```\n\nIn the function call, a float variable called *number* having\
    \ a value of *1.2* is passed to the function *multiply_by_10*. Inside the function,\
    \ there is a parameter called *num* which receives this value, in the body of\
    \ the function, the value of this variable is increased by a factor of 10 and\
    \ returned back to the calling function. Because pass by value method is used\
    \ to call the"
  merge: -1
