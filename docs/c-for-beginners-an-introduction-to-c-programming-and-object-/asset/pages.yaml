    \ loop, a *continue* statement will take the execution control to the beginning\
    \ of the loop thereby incrementing/decrementing the loop variable. Consider you\
    \ want to print only even values from 1 to 10. Here is how you can do it with\
    \ a *continue* statement.\n\n```\n    for ( int x = 1 ; x <= 10 ; x ++ )\n```"
