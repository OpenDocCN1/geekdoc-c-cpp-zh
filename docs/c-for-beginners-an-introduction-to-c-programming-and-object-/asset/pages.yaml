    or the denominator. The expression 5 / 2 will now become 5 * 1.0 / 2 or 5 / 2
    * 1.0. You can even use brackets just as you would in mathematics for convenience
    or when you want to carry out an operation first among an expression - 5 / (2
    * 1.0).


