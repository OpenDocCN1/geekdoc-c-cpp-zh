    # ## 17.4 Reverse of a number


    Let us write a function which takes one integer variable as a parameter and returns
    the reverse of that number; for example, if the given number is 12345, 54321 should
    be returned. To do this, the digit at one''s place needs to be progressively extracted
    first and then discarded. This can be done by performing *number % 10* to extract
    the digit at one''s place and then *number = number / 10* to discard the digit
    at one''s place. When the digit from the one''s place is extracted, *reverse =
    (reverse * 10) + (number % 10)* needs to be performed during each iteration. Here
    is the full C++ program:


