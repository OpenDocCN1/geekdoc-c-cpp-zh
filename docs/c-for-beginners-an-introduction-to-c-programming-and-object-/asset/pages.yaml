  md: '# 12. Pointers


    Pointers are special kind of variables that are used to store addresses of other
    variables. When a variable is declared, the system allots it some space in the
    memory according to its data type in order to store the contents of the variable.
    This memory region has an address with which it is identified and accessed. Pointers
    are used to store such addresses. Because it would normally be difficult to remember
    the address of each memory location, we have the concept of variables in the first
    place. Pointers is a fairly advanced subject and hence we will only cover the
    basics. Developers dealing with low level system applications such as memory management,
    kernel module development, device driver development, etc. should know pointers
    extremely well.


    A pointer variable is declared just like any other variable with *asterisk symbol
    ( * )* either prefixed to the variable name or suffixed to the data type. General
    Syntax:


    ```

    ```text

    <data type> *<variable name>;

    OR

    <data type>* <variable name>;

    eg:

    //Integer pointers

    int *p;

    int* x;

    //Float pointers

    float *f, *g, *h;

    //Character pointer

    char *c;

    ```

    ```'
  merge: -1
  img_proc: true
- pgno: 116
  md: 'A pointer will store the address of the *same data type*. For example, an integer
    pointer will store the address of an integer variable, a float pointer will store
    the address of a float variable and so on. A float pointer cannot store the address
    of an integer variable.


    In order to fetch the address of a variable, *ampersand symbol ( & )* is prefixed
    to the variable name. Consider the following code snippet:


    ```

    int x = 500 ;

    int *ptr = &x;

    ```


    We have an integer variable *x* which is initialized to a value of *500*. An integer
    pointer variable called *ptr* is declared which is going to hold the address of
    the variable *x* and **not the value of x (500)**. In programmatic terms, it is
    said *ptr* is pointing to *x*.


    When *x* is declared and initialized, the system will allot some memory to store
    its contents (which is *500* in this case). Let us assume that this memory location
    has an address of *12345*. The following diagram will explain what is happening
    with this code:


    ![](img/cda5b023e23ffd0b87fc37b1da33973d_116_0.png)'
