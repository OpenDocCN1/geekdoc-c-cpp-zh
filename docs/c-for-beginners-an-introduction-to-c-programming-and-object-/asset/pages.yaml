  md: "You can set certain parameters of a function to have default values. While\
    \ calling a function, if the parameter which has been set as default is not passed,\
    \ it’s default value will be used. There are a few rules to be followed while\
    \ setting default arguments:\n\n+   1. Only the last parameter(s) can be set as\
    \ default.\n+   2. If a parameter has been set as default, all the following parameters\
    \ must be set as default.\n\nGeneral syntax for setting default arguments is:\n\
    \n```\n```cpp\n<return type> <function name> (<parameter 1>, ...\n<parameter n>\
    \ = <value>)\n{\n    //Function Body\n}\n```\n```\n\nExample:\n\nLet us define\
    \ a function which accepts 3 parameters, returns their product. Out of the 3 parameters,\
    \ the last one will be the default argument:\n\n```\n```cpp\nint multiply ( int\
    \ a , int b , int c = 10 )\n{\n    return ( a * b * c );\n}\n```\n```\n\nThis\
    \ function can be called by passing 2 or 3 arguments. Since the third parameter\
