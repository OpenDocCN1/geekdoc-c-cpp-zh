    ```\n\n# ## 8.2.2 do-while Loop\n\nSyntax for using do-while loop is as follows:\n\
    \n```\n```cpp\ndo\n{\n    //Statements...\n} while (<condition>);\n```\n```\n\n\
    The *do-while* loop works just like the *while* loop with one major difference.\
    \ Instead of checking the specified condition at the beginning of the loop, it\
    \ is checked at the end. That is, when the program encounters a do-while block,\
    \ the statements inside it are immediately executed and then the condition is\
    \ checked. This means, the statements under a *do-while* loop are *guaranteed\
    \ to*"
