    # 8.3.4 Control Statements


    (Control) statements are used to exercise control over the execution of a loop.
    Normally, a loop would go on executing until the specified condition is met. Control
    statements allow you to control the execution of a loop beyond the specified condition.
    C++ offers two control statement – *break* and *continue*. We have already seen
    the usage of a *break* statement in Section **8.2.1** to bring the control out
    of a *switch-case* block.


    # 8.3.4.1 break Statement


    A *break* statement is used to halt the execution of a loop. When a *break* statement
    is encountered, the execution control comes out of the loop block even if the
    specified condition evaluates to a non-zero number. Let us take an example. Consider
    you want to write a *while* loop to display integers from'
