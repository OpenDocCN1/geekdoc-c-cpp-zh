    \n## 15. 继承\n\n继承是面向对象编程中的一个概念，它允许我们通过继承现有类的属性来派生一个新类。属性可以包括数据成员和成员函数。现有类称为*基类*，新类称为*派生类*。这个过程促进了代码的可重用性。我们无需重新编写一个新类，可以使用现有类的属性，只编写需要的额外属性。\n\
    \n考虑一个名为 *Person* 的类，具有公有数据成员 – *FirstName、LastName 和 City*。该类的声明如下：\n\n```cpp\n\
