    \ *Person 类* 派生 *Student 类*，其中 *Student 类* 将获得 *Person 类* 中存在的自己的数据成员集 – *FirstName、LastName、City*，而我们只需在\
    \ *Student 类* 中声明两个数据成员 – *School 和 Grade*。继承的一般语法是：\n\n```\nclass <派生类名> : <访问类型>\
    \ <基类名>\n{\n    //类定义\n};\n```\n\n只有类的公有和受保护成员可以被继承到另一个类中；私有成员不能被继承。\n\n*访问类型*可以是\
