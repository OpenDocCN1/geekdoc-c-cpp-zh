  mdcn: "\n\n## 12. 指针\n\n指针是一种特殊的变量，用于存储其他变量的地址。声明变量时，系统会根据其数据类型在内存中为其分配一些空间，以存储变量的内容。该内存区域有一个用于标识和访问的地址。指针用于存储此类地址。因为通常很难记住每个内存位置的地址，所以我们首先有了变量的概念。指针是一个相当高级的主题，因此我们只介绍基础知识。从事内存管理、内核模块开发、设备驱动开发等底层系统应用开发的开发人员应该非常熟悉指针。\n\
    \n指针变量的声明方式与任何其他变量一样，将*星号( * )*前缀到变量名，或后缀到数据类型。通用语法：\n\n```text\n<data type> *<variable\
    \ name>;\nOR\n<data type>* <variable name>;\neg:\n//Integer pointers\nint *p;\n\
    int* x;\n//Float pointers\nfloat *f, *g, *h;\n//Character pointer\nchar *c;\n\
    ```\n\n指针将存储*相同数据类型*的地址。例如，整型指针将存储整型变量的地址，浮点指针将存储浮点变量的地址，依此类推。浮点指针不能存储整型变量的地址。\n\
    \n要获取变量的地址，需要在变量名前面加上*与号( & )*。请看下面的代码片段：\n\n```cpp\nint x = 500;\nint *ptr =\
    \ &x;\n```\n\n我们有一个整型变量 *x*，其初始化值为 *500*。声明了一个名为 *ptr* 的整型指针变量，它将保存变量 *x* 的地址，**而不是\
    \ x 的值(500)**。用程序术语来说，就是 *ptr* 指向 *x*。\n\n当 *x* 被声明并初始化时，系统会分配一些内存来存储其内容（本例中为\
    \ *500*）。假设该内存位置的地址为 *12345*。下图将解释这段代码发生了什么：\n\n![](img/cda5b023e23ffd0b87fc37b1da33973d_116_0.png)\n\
    \n如你所见，变量 x 保存的值为 500，位于内存地址 12345，指针 ptr 保存的是 x 的地址 12345，而不是 x 的值 500。你可以通过在变量名前加上星号(\
    \ * )来访问指针所指向的内存地址处的值。例如：*ptr 将给出 500，ptr 将给出 12345。星号( * )用于解析内存地址处的值。这个概念既简单又令人困惑。这是基本概念，如果你能很好地理解它，就能很容易地理解整个指针概念。让我们来看一个编程示例，其中我们将声明一些变量和指针，并尝试访问它们的值：\n\
    \n```cpp\n#include <iostream>\nusing namespace std;\n\nint main()\n{\n    int\
    \ a = 10, b = 20;\n\n    float x = 50.5, y = 150.75;\n\n    int *ptr1, *ptr2;\n\
    \n    float *fptr;\n\n    ptr1 = &a;\n    ptr2 = &b;\n    cout << endl << endl\n\
    \         << \"a: \" << a << \" --- Address of a (i.e. ptr1) : \" << ptr1\n  \
    \       << endl << endl\n         << \"b: \" << b << \" --- Address of b (i.e.\
    \ ptr2) : \" << ptr2\n         << endl << endl\n         << \"Value at ptr1 (\"\
    \ << ptr1 << \") : \" << *ptr1\n         << endl << endl\n         << \"Value\
    \ at ptr2 (\" << ptr2 << \") : \" << *ptr2\n         << endl << endl;\n\n    //\
    \ Assign address of x to fptr\n    fptr = &x;\n\n    // Display whatever that\
    \ has been done\n    cout << endl\n         << \"x: \" << x << \" --- Address\
    \ of x (i.e. fptr) : \" << fptr\n         << endl << endl\n         << \"Value\
    \ at ptr (\" << fptr << \") : \" << *fptr;\n\n    // Assign address of y to fptr\n\
    \    cout << endl << endl;\n    fptr = &y;\n\n    // Display whatever ...\n  \
    \  cout << endl << endl\n         << \"y: \" << y << \" --- Address of y (i.e.\
    \ fptr) : \" << fptr\n         << endl << endl\n         << \"Value at ptr (\"\
    \ << fptr << \") : \" << *fptr;\n\n    cout << endl << endl;\n    *fptr = 675.123;\n\
    \n    // Display recent changes\n    cout << endl << endl\n         << \"y: \"\
    \ << y << \" --- Address of y (i.e. fptr) : \" << fptr\n         << endl << endl\n\
    \         << \"Value at ptr (\" << fptr << \") : \" << *fptr;\n\n    cout << endl\
    \ << endl;\n    return 0;\n}\n```\n\n输出：\n\n```text\nC:\\>Program Files\\...>pointers.exe\n\
    At 10 -- Address of a (i.e. ptr1) : 0x28fe80\nAt 20 -- Address of b (i.e. ptr2)\
    \ : 0x28fe8c\nValue at ptr1 ( 0x28fe80 ) : 10\nValue at ptr2 ( 0x28fe8c ) : 20\n\
    \nAt 50.5 -- Address of x (i.e. fptr) : 0x28fe40\nAt 150.75 -- Address of y (i.e.\
    \ fptr) : 0x28fe4c\nValue at fptr ( 0x28fe40 ) : 50.5\nAssigning address of y\
    \ to fptr\nAt 150.75 -- Address of y (i.e. fptr) : 0x28fe4c\nValue at fptr ( 0x28fe4c\
    \ ) : 150.75\nChanging the value of y using fptr\nAt 675.123 -- Address of y (i.e.\
    \ fptr) : 0x28fe4c\nValue at fptr ( 0x28fe4c ) : 675.123\nPress any key to continue...\n\
    ```\n\n这里显示的地址是十六进制值。\n\n### 关于指针的要点：\n\n- 1. 不可能对两个或多个指针进行加、减、除、乘或任何其他算术运算。\n\
    - 2. 可以对指针进行递增或递减，但其值增加或减少的不是 1，而是给定数据类型的大小。例如，整数占用 4 个字节——递增或递减整型指针时，其值会增加或减少\
    \ 4。也就是说，指针将指向下一个内存区域（递增时向前 4 个字节）或上一个内存区域（递减时向后 4 个字节）。\n\n剩余的元素。下面是数组在内存中的存储方式：\n\
    \n**numbers**\n\n| 索引 --> | 0 | 1 | 2 | 3 | 4 |\n| --- | --- | --- | --- | ---\
    \ | --- |\n|  | 10 | 57 | 82 | 600 | 425 |\n| 内存 --> | 2000 | 2004 | 2008 | 2012\
    \ | 2016 |\n\n数组变量 `numbers` 将保存第一个元素的地址，即 `2000`。（`numbers + 1`）将得到第二个元素的地址，即\
    \ `2004`，依此类推。我们已经见过很多使用访问运算符（ `[ ]` ）访问数组元素的示例。现在，我们来看看如何使用指针访问数组元素。如果数组变量 `numbers`\
    \ 保存的是第一个元素的地址，那么使用地址处值的方法，`*numbers` 应返回位置 `2000` 处的值，即 `10`；`*( numbers + 1\
    \ )` 应返回 `57`，依此类推。使用语句 `numbers [ n ]` 访问数组元素与使用 `*( numbers + n )` 相同。\n\n下面是一个\
    \ C++ 程序，演示了使用指针访问数组的方法：\n\n```cpp\n#include <iostream>\nusing namespace std;\n\
    \nint main()\n{\n    int x[] = { 10, 20, 30, 40, 50 };\n    int i;\n    cout <<\
    \ endl << endl << endl << endl;\n\n    for (i = 0; i < 5; i++)\n        cout <<\
    \ endl << \"x[\" << i << \"] = \" << x[i];\n    cout << endl << endl << endl <<\
    \ endl;\n\n    for (i = 0; i < 5; i++)\n        cout << endl << \"*(x + \" <<\
    \ i << \") = \" << *(x + i);\n    cout << endl << endl;\n\n    return 0;\n}\n\
    ```\n\n输出：\n\n![](img/cda5b023e23ffd0b87fc37b1da33973d_122_0.png)\n\n### 12.2\
    \ 向函数传递指针\n\n在第 9 节中，我们学习了向函数传递值的两种方法——*按值传递*和*按引用传递*。在本节中，我们将学习第三种方法——*按指针传递*。\n\
    \n按指针传递方法与按引用传递方法类似，函数定义中对变量所做的更改将反映回调用函数中。但不同的是，传递的不是变量的引用，而是变量的实际内存地址。为了传递变量的地址，在调用函数时，变量名前面需要加上*与号(\
    \ & )*，并且在函数定义中，这个地址需要由相同数据类型的指针变量接收。下面是一个演示按指针传递方法的代码片段：\n\n```cpp\nvoid swap(int\
    \ *a, int *b)\n{\n    int temp = *a;\n    *a = *b;\n    *b = temp;\n}\n\n// Function\
    \ call:\nint x = 10, y = 30;\nswap(&x, &y);\n```\n\n有一个 swap 函数，它接受两个*整型指针*作为参数。在函数定义中，这两个变量地址处的值使用一个临时变量进行交换。\n\
    \n"
