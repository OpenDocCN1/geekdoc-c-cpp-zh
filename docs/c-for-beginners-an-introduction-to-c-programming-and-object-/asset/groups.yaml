    \n### 8.3.3 for Loop\n\nSyntax for using for loop is as follows:\n\n```cpp\nfor\
    \ ( <loop variable initialization> ; <condition> ;\n<expression> )\n{\n    statement;\n\
    }\n```\n\nThe *for loop* has more features than the *while* and the *do while*\
    \ loops. It allows you to use a special loop variable for iterating purpose. Until\
    \ the specified *<condition>* evaluates to a non zero number, the loop will go\
    \ on executing. The *<expression>* can contain any mathematical expression, this\
    \ field is usually used to increment or decrement the loop variable.\n\nHere is\
    \ a snippet to display numbers from 1 to 10 on the screen using a *for loop*:\n\
    \n```cpp\n//Declare an integer variable\nint number;\nfor ( number = 1 ; number\
    \ <= 10 ; number ++)\n{\n    //Display number\n    cout << number << \" \";\n\
    }\n```\n\nIt is also possible to nest loops. Let us write a C++ program to draw\
    \ the following pattern using nested loops:\n\n```text\n*\n\n***\n\n*****\n\n\
    *******\n\n*********\n\n***********\n\n*************\n\n***************\n\n*****************\n\
    \n*******************\n```\n\nAs seen, there are 10 lines in the pattern. Each\
    \ line has odd number of stars (asterisks). The expression: *(( 2 x Line Number\
    \ ) - 1 )* will give us the number of stars to be printed on each line.\n\nWe\
    \ will need a total of 3 loops – one outer loop to keep track of the lines, two\
    \ inner loops to keep track of the number of spaces to be left and the number\
    \ of stars to be printed. Here is the code:\n\n```cpp\n#include <iostream>\nusing\
    \ namespace std;\nint main ()\n{\n    int i, j, k, space = 5, star = 1 ;\n   \
    \ cout << endl << endl;\n\n    // loop for no. of lines\n    for (i = 1 ; i <=\
    \ 5 ; i ++)\n    {\n        space -- ;\n        star = ( 2 * i) - 1 ;\n      \
    \  j = 1 ;\n\n        while ( j ++ < space )\n        {\n            // leave\
    \ spaces \"space\" number of times\n            cout << ' ' ;\n        }\n   \
    \     k = 1 ;\n\n        while ( k ++ < star )\n        {\n            // print\
    \ star \"star\" number of times\n            cout << '*' ;\n        }\n      \
    \  cout << endl ;\n    }\n    cout << endl << endl ;\n    return 0 ;\n}\n```\n\
    \nOutput:\n\n![](img/cda5b023e23ffd0b87fc37b1da33973d_81_0.png)\n\n### 8.3.4 Control\
    \ Statements\n\n(Control) statements are used to exercise control over the execution\
    \ of a loop. Normally, a loop would go on executing until the specified condition\
    \ is met. Control statements allow you to control the execution of a loop beyond\
    \ the specified condition. C++ offers two control statement – *break* and *continue*.\
    \ We have already seen the usage of a *break* statement in Section **8.2.1** to\
    \ bring the control out of a *switch-case* block.\n\n### 8.3.4.1 break Statement\n\
    \nA *break* statement is used to halt the execution of a loop. When a *break*\
    \ statement is encountered, the execution control comes out of the loop block\
    \ even if the specified condition evaluates to a non-zero number. Let us take\
    \ an example. Consider you want to write a *while* loop to display integers from\
    \ 1 to 10, but want to come out of the loop when the value reaches 7. Here is\
    \ how that is done using break statement:\n\n```cpp\n//Initialize a variable x\
    \ to 1\nint x = 1;\n//Check if x is less than or equal to 10.\n//As long as this\
    \ condition is met, keep executing the loop.\nwhile ( x <= 10 )\n{\n    //When\
    \ x becomes 7, break out of the loop.\n    if ( x == 7 )\n    break;\n    //Write\
    \ the value of x on the screen.\n    cout << x << \" \";\n    //Increment x by\
    \ 1.\n    x++;\n}\n```\n\n### 8.3.4.2 continue Statement\n\nA *continue* statement\
    \ is used to take the control to the starting of a loop. When a *continue* statement\
    \ is encountered, the remaining statements in the loop block are ignored and the\
    \ loop moves to the next iteration. In case of *while* and *do-while* loops, the\
    \ control jumps back to the *while (<condition>)* and *do* statements respectively.\
    \ In a *for* loop, a *continue* statement will take the execution control to the\
    \ beginning of the loop thereby incrementing/decrementing the loop variable. Consider\
    \ you want to print only even values from 1 to 10. Here is how you can do it with\
    \ a *continue* statement.\n\n```cpp\nfor ( int x = 1 ; x <= 10 ; x ++ )\n{\n \
    \   //If x is not divisible by 2, it means x is odd.\n    //In such a case, you\
    \ want to skip all the remaining statements.\n    if ( x % 2 == 1 )\n        continue;\n\
    \    cout << x << \" \" ;\n}\n```\n\n*Note:* If there is only one statement inside\
    \ a loop block, no need to put it inside curly brackets.\n\nLet us demonstrate\
    \ the usage of control statements with the help of a programming tutorial. Here\
    \ is a C++ program that accepts an integer from the user and checks if it is a\
    \ prime or a composite number.\n\n```cpp\n#include <iostream>\n\nusing namespace\
    \ std;\n\nmain ()\n{\n    // declare an integer to accept and store user input\n\
    \    // and also loop variable\n    int i, number;\n    //Ask the user to enter\
    \ a number\n    cout << endl << endl\n         << \"Enter a number: \";\n    //Wait\
    \ for user input, accept it into number variable\n    cin >> number;\n    //Loop\
    \ from 1 to number\n    for ( i = 1; i <= number ; i ++)\n    {\n        // if\
    \ divisible by i\n        if ( i == 1 )\n            continue;\n\n        if (\
    \ number % i == 0 )\n        break;\n    }\n    if ( i == number )\n        cout\
    \ << endl << endl\n            << \"Number: \" << number << \" is not prime.\"\
    \ << endl ;\n    else\n        cout << endl << endl\n            << \"Number:\
    \ \" << number << \" is prime.\" << endl ;\n    return ;\n}\n```\n\nOutput:\n\n\
