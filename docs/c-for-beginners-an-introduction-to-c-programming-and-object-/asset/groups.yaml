    A pointer will store the address of the *same data type*. For example, an integer
    pointer will store the address of an integer variable, a float pointer will store
    the address of a float variable and so on. A float pointer cannot store the address
    of an integer variable.


    In order to fetch the address of a variable, *ampersand symbol ( & )* is prefixed
    to the variable name. Consider the following code snippet:


    ```

    int x = 500 ;

    int *ptr = &x;

    ```


    We have an integer variable *x* which is initialized to a value of *500*. An integer
    pointer variable called *ptr* is declared which is going to hold the address of
    the variable *x* and **not the value of x (500)**. In programmatic terms, it is
    said *ptr* is pointing to *x*.


    When *x* is declared and initialized, the system will allot some memory to store
    its contents (which is *500* in this case). Let us assume that this memory location
    has an address of *12345*. The following diagram will explain what is happening
    with this code:


    ![](img/cda5b023e23ffd0b87fc37b1da33973d_116_0.png)'
