  mdcn: "\n## 9. 函数\n\n整数版本会以整数形式返回和。另一个函数则必须返回浮点值，否则求和会丢失精度。关键在于，这两个函数之所以可以重载，是因为它们接受不同类型的参数，而不是因为它们具有不同的返回类型。\n\
    \n让我们为我们刚刚讨论的内容编写一小段 C++ 代码：\n\n```cpp\n//Two integers\nint sum ( int a , int\
    \ b )\n{\n    return ( a + b );\n}\n//Two floats\nfloat sum ( float a , float\
    \ b )\n{\n    return ( a + b );\n}\n```\n\n对每个函数的调用如下所示：\n\n```cpp\nint sum_int;\n\
    float sum_float;\n//Call the function that accepts two integers\nsum_int = sum\
    \ ( 5, 60 );\n//Call the function that accepts two floats\nsum_float = sum ( 50.78,\
    \ 60.1 );\n```\n\n接受两个浮点值并返回浮点值的第二个函数定义本可以返回整数值，并且仍然可以毫无问题地重载，但这在逻辑上是不正确的，因为两个浮点值之和极有可能仍是浮点值。\n\
    \n让我们举一个函数重载的示例，以展示这一概念的真正美妙之处。一个名为 *area* 的函数将被重载 3 次，其中每个定义将使用相应的面积公式计算圆、矩形和三角形的面积。我们知道，计算圆的面积只需要\
    \ 1 个参数——半径。要计算矩形和三角形的面积，需要两个参数——分别是长度和宽度，以及底和高。圆的面积函数可以根据参数个数与其他两个函数唯一区分。为了唯一区分矩形和三角形的面积函数，我们将更改输入参数的数据类型。\n\
    \n以下是实现我们刚刚讨论内容的 C++ 代码：\n\n```cpp\n#include <iostream>\n\nusing namespace std;\n\
    \nfloat area ( int radius )\n{\n    return ( 3.14 * radius * radius );\n}\n\n\
    float area ( float base, float height )\n{\n    // Return (1/2) x base x height\n\
    \    return ( (1.0 / 2) * base * height );\n}\n\nint area ( int length, int width\
