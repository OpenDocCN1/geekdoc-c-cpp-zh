    Bitwise operators are used to perform bit-by-bit logical operation. That is, operations
    are carried out on each bit of the operands.


    | Operator | Description | Sample Usage | Explanation |

    |---|---|---|---|

    | `&` | Bitwise Logical AND | `a & b` | Performs logical AND on each of the operands
    on a bit-by-bit basis. |

    | `|` | Bitwise Logical OR | `a | b` | Performs logical OR on each of the operands
    on a bit-by-bit basis. |

    | `~` | Bitwise Logical Inverter | `~a` | Inverts each bit of the operand. |

    | `^` | Bitwise Logical XOR | `a ^ b` | Performs logical XOR on each of the operands
    on a bit-by-bit basis. |

    | `<<` | Left Shift | `a << b` | Left shifts bits of the operand on the left by
    a number specified by the right operand. From *Sample Usage*, `a << b` will result
    in a’s bits left shifted b times. |

    | `>>` | Right Shift | `a >> b` | Right shifts bits of the operand on the left
    by a number specified by the right operand. From *Sample Usage*, `a >> b` will
    result in a’s bits right shifted b times. |'
