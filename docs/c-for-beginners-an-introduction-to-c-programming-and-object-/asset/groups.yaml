    \n### 17.4 Reverse of a number\n\nLet us write a function which takes one integer\
    \ variable as a parameter and returns the reverse of that number; for example,\
    \ if the given number is 12345, 54321 should be returned. To do this, the digit\
    \ at one's place needs to be progressively extracted first and then discarded.\
    \ This can be done by performing *number % 10* to extract the digit at one's place\
    \ and then *number = number / 10* to discard the digit at one's place. When the\
    \ digit from the one's place is extracted, *reverse = (reverse * 10) + (number\
    \ % 10)* needs to be performed during each iteration. Here is the full C++ program:\n\
    \n```cpp\n#include <iostream>\nusing namespace std;\n\nint reverse(int number)\n\
    {\n    int rev = 0;\n    while (number)\n    {\n        rev = (rev * 10) + (number\
    \ % 10);\n        number = number / 10;\n    }\n    return rev;\n}\n\nmain()\n\
    {\n    int number;\n    cout << endl << endl << \"Enter a number: \";\n    cin\
    \ >> number;\n    cout << endl << endl << \"Reverse of \" << number\n        \
    \ << \" is \" << reverse(number);\n    cout << endl << endl;\n    return;\n}\n\
    ```\n\nOutput:\n\n![](img/cda5b023e23ffd0b87fc37b1da33973d_170_0.png)\n\n### 17.5\
    \ String Palindrome\n\nA string is said to be a palindrome if the string and its\
    \ reverse are the same. Consider a string - \"madam\". If you reverse the word\
    \ \"madam\", you will still get \"madam\". This is a palindrome. Let us write\
    \ a C++ program to take a string as an input from the user. We shall then reverse\
    \ the string using a *for loop* and check if the original string and its reverse\
    \ are the same using *strcmp* function (from *cstring* header). The strcmp function\
    \ will return 0 if both strings are equal. Here is the C++ program:\n\n```cpp\n\
    #include <iostream>\n#include <cstring>\n\nusing namespace std;\n\nint main()\n\
    {\n    char str[100], reverse[100];\n    int length, j = 0;\n    // Temporary\
    \ variable for swapping purpose\n    int temp;\n    // Ask the user to enter a\
    \ string\n    cout << endl << endl << \"Enter a string: \";\n    // Wait for user\
    \ to enter\n    cin.getline(str, sizeof(str));\n    length = strlen(str);\n  \
    \  // for reverse\n    strcpy(reverse, str);\n    // Reverse the string, store\
    \ in reverse\n    for (int i = (length - 1); i > ((length - 1) / 2); i--)\n  \
    \  {\n        temp = reverse[i];\n        reverse[i] = reverse[j];\n        reverse[j]\
    \ = temp;\n        j++;\n    }\n\n    cout << endl << endl\n         << \"Original\
    \ : \" << str << endl\n         << \"Reverse : \" << reverse << endl;\n\n    if\
    \ (strcmp(str, reverse) == 0)\n        cout << \"Palindrome\" << endl;\n    else\n\
    \        cout << \"Not palindrome\" << endl;\n\n    cout << endl << endl;\n  \
    \  return 0;\n}\n```\n\nOutput:\n\n![](img/cda5b023e23ffd0b87fc37b1da33973d_172_0.png)\n\
