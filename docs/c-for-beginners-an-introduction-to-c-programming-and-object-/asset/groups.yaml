    \n在将值作为参数传递给函数时，有三种方法——传值、传引用和传指针。本章我们将了解传值和传引用，传指针将在 *指针* 章节中解释。\n\n### 9.2.1\
    \ 传值\n\n使用这种方法时，变量的值被传递给函数。在函数定义中，传递的值由不同的变量接收。因此，在函数定义中对接收变量所做的任何更改都不会反映回调用函数。到目前为止解释的示例都使用的是传值方法。\n\
    \n这里有一个示例，它接受一个 float 值，将其自身乘以 10，并返回新值：\n\n```cpp\nfloat multiply_by_10(float\
    \ num)\n{\n    num = num * 10;\n    return num;\n}\n```\n\n函数调用：\n\n```cpp\nfloat\
    \ number = 1.2;\nfloat x = multiply_by_10(number);\n```\n\n在函数调用中，一个名为 *number*、值为\
    \ *1.2* 的 float 变量被传递给 *multiply_by_10* 函数。在函数内部，有一个名为 *num* 的参数接收这个值，在函数体中，该变量的值被乘以\
    \ 10，并返回给调用函数。由于调用函数使用的是传值方法，*number* 的值在调用函数中将保持不变。\n\n### 9.2.2 传引用\n\n在这种方法中，当值传递给函数时，它在函数中使用引用变量接收。函数定义中的引用变量由前缀\
    \ *& 符号（&）* 表示。对这些变量所做的任何更改都将反映回调用函数。其余过程保持不变，包括函数调用。让我们稍微修改上一节中的 *multiply_by_10*\
    \ 函数：\n\n```cpp\nvoid multiply_by_10(float &num)\n{\n    num = num * 10;\n}\n\
    ```\n\n对 *num* 所做的任何更改都将反映回调用函数，因此不需要返回值。\n\n函数调用：\n\n```cpp\nfloat number = 1.2;\n\
    multiply_by_10(number);\n```\n\n在进行函数调用时，变量 *number* 的值不会被传递，而是传递 *对该变量的引用*。函数定义将参数的值乘以\
    \ 10。由于使用的是传引用方法，局部变量 *number* 现在将保存值 12。\n\n为了更好地理解这个概念，让我们编写一个包含两个函数的 C++ 程序来交换两个输入值。一个使用传值方法，另一个使用传引用方法：\n\
    \n```cpp\n#include <iostream>\n\nusing namespace std;\n\nvoid swap_by_value(int,\
    \ int);\nvoid swap_by_reference(int &, int &);\n\nvoid swap_by_value(int x, int\
    \ y)\n{\n    int temp = x;\n    x = y;\n    y = temp;\n    // Display x and y\n\
    \    cout << endl << endl << \"Inside swap_by_value\" << endl\n         << endl\n\
    \         << \"x: \" << x << \"    y: \" << y << endl;\n}\n\nvoid swap_by_reference(int\
    \ &x, int &y)\n{\n    // Swap x and y\n    int temp = x;\n    x = y;\n    y =\
