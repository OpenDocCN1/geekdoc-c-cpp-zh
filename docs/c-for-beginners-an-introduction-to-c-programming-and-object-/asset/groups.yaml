    # Important points regarding pointers:


    +   1. It is not possible to add, subtract, divide, multiply or perform any other
    arithmetic operation on two or more pointers.

    +   2. It is possible to increment or decrement pointers but the value will be
    increased or decreased not by one but by the size of the given data type. For
    example, an integer occupies 4 bytes — incrementing or decrementing an integer
    pointer will have its value increased or decreased by 4. That is, the pointer
    will now point either to the next memory region (4 bytes forward in case of increment)
    or to the previous memory region (4 bytes backward in case of decrement).'
