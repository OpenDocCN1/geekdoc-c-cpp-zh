    ## 面向初学者的 C++


    C++ 编程与面向对象编程入门：教程与动手示例


    由 Internet Archive 于 2022 年数字化，资助来自 Kahle/Austin Foundation


    ## 面向初学者的 C++


    C++ 编程与面向对象编程入门：教程与动手示例


    ## 目录


    - 1. 引言 ..... 1

    - 2. 入门 ..... 3

    - 3. 语法 ..... 17

    - 4. 数据类型 ..... 29

    - 5. 变量与常量 ..... 33

    - 6. 用户交互 ..... 39

    - 7. 运算符 ..... 45

    - 8. 控制结构 ..... 55

    - 9. 函数 ..... 73

    - 10. 数组 ..... 91

    - 11. 字符串 ..... 95

    - 12. 指针 ..... 101

    - 13. 面向对象编程简介 ..... 111

    - 14. 构造函数与析构函数 ..... 121

    - 15. 继承 ..... 133

    - 16. 多态 ..... 143

    - 17. 编程示例 ..... 149

    - 18. 结语 ..... 157


    多年来，C++ 的最初实现已有大量改进。*国际标准化组织（ISO）* 负责对 C++ 进行标准化。第一个标准 *ISO/IEC 14882:1998（C++98）*
    于 1998 年获批。在撰写本书时，最新标准是 *ISO/IEC 14882:2017（C++17）*，它于 2017 年获批。每个新标准都提供新特性和/或对先前标准的改进。本书遵循广泛使用的
    *ISO/IEC 14882:2011（C++11）* 标准，该标准于 2011 年获批。除非你是一名专业核心 C++ 开发者，职业生涯围绕着用 C++ 开发性能关键型应用，否则不必担心不断演进的
    C++ 标准。


    通过本书，你将学习 C++ 的基础知识。本书涵盖了过程式编程和面向对象编程的概念。具备一些编程知识，尤其是了解 C 编程语言，会有帮助，但并非必需。不过，你应能熟练使用自己的
    PC/Mac。还需要一些使用 Linux/Mac 终端和 Windows 命令提示符的经验。


    编译 C 程序；g++ 是用于编译 C++ 程序的命令行实用程序。


    任何文本编辑器（包括记事本）都可用来编写 C++ 程序。我推荐一款名为 *Notepad++* 的文本编辑器（https://notepad-plus-plus.org/）。


    ### 2.1.1 Windows 上的 GCC 安装


    *MinGW*（http://www.mingw.org/）和 *Cygwin*（https://sourceware.org/cygwin/）项目提供了
    GCC 的官方 Windows 移植版。我们将使用 MinGW。MinGW 是“Minimalist GNU for Windows”的缩写，是一个用于 Windows
    应用程序的极简开发环境。要下载 MinGW，请访问：https://sourceforge.net/projects/mingw/files/ 并下载最新的安装文件。下载完成后，执行该安装文件。此文件将安装
    MinGW Installation Manager Setup Tool，而不是直接安装 MinGW。


    执行安装文件后，应会启动以下窗口：


    ![](img/cda5b023e23ffd0b87fc37b1da33973d_12_0.png)


    单击 *安装*，你将进入下一个窗口：


    ![](img/cda5b023e23ffd0b87fc37b1da33973d_12_1.png)


    确保安装目录易于访问，不要更改任何其他选项；单击 *继续*。


    安装程序现在将下载所有必需文件；这可能需要几分钟。所有文件获取完成后，安装窗口将如下所示：


    ![](img/cda5b023e23ffd0b87fc37b1da33973d_13_0.png)


    单击 *继续*，*MinGW Installation Manager* 应会启动。你将在这里安装 *GCC* 编译器。


    ![](img/cda5b023e23ffd0b87fc37b1da33973d_13_1.png)


    单击 *mingw32-gcc-g++* 旁边的复选框，单击“标记为安装”。从菜单栏单击 *安装 -> 应用更改*。*GCC*（*g++*）编译器的安装过程现在将开始，可能需要几分钟才能完成。


    打开 *文件资源管理器*（或“我的电脑/此电脑”），转到 *MinGW 安装目录*（如果你在安装期间未更改任何选项，则该目录为 `C:\MinGW`），打开
    *bin* 文件夹，并确认存在名为 `g++ (g++.exe)` 的文件；如果存在，则安装成功。需要将此 bin 文件夹的路径（例如 `C:\MinGW\bin`）添加到
    *Path 环境变量* 中，以便 g++ 可在全局访问。为此，请打开 *系统属性*（打开控制面板，在搜索框中搜索 *高级系统设置*，然后单击 *查看高级系统设置*）。转到
    *高级* 选项卡，单击 *环境变量*。在 *系统变量* 下，找到变量 *Path*，单击 *编辑*。将弹出以下对话框：


    ### 环境变量


    ![](img/cda5b023e23ffd0b87fc37b1da33973d_15_0.png)


    ### 系统属性


    计算机名 · 硬件 · 高级 · 系统保护 · 远程


    ### 编辑系统变量


    变量名: Path

    变量值: [模糊]


    确定 · 取消


    ### 系统变量


    | 变量 | 值 |

    |---|---|

    | Path |  |

    | PATHEXT | .COM; .EXE; .BAT; .CMD; .VBS; .VBE; .JS; … |

    | Platform | MCD |

    | Platformmode | KV |


    新建… · 编辑… · 删除


    确定 · 取消


    *变量值* 字段中会有一些值。如果文本末尾没有分号（;），请添加一个分号，并将完整的 `MinGW\bin` 路径（例如 `C:\MinGW\bin`）追加到其后，如上图所示。逐个单击
    *确定* 关闭所有对话框。


    打开 *命令提示符*，输入 `g++` 并按 Enter。如果你看到如下错误——“''g++'' 不是内部或外部命令，也不是可运行的程序或批处理文件。”，则说明安装或
    *Path* 变量有问题。在这种情况下，请仔细遵循本节（*第 2.1.1 节*）中提到的每一步。安装成功且 *Path* 变量设置正确后，`g++` 命令应返回以下错误——“g++:
    致命错误：没有输入文件，编译终止。”。


    如果安装成功且 *Path* 变量已正确设置，*命令提示符* 将如下所示：


    ![](img/cda5b023e23ffd0b87fc37b1da33973d_16_0.png)


    ### 2.1.2 Linux 上的 GCC/Clang 安装


    大多数 Linux 操作系统内置 GCC 和/或 Clang。要检查你的 Linux 操作系统是否具有 GCC 和/或 Clang，请打开终端/Shell，并分别输入
    `g++` 和 `clang++`。


    如果存在 GCC，输入 `g++` 命令后，终端/Shell 将如下所示：


    ![](img/cda5b023e23ffd0b87fc37b1da33973d_17_0.png)


