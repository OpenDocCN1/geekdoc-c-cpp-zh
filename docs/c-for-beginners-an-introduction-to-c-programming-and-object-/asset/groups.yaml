    \n## 15. Inheritance\n\nInheritance is a concept in Object Oriented Programming\
    \ which allows us to derive a new class by inheriting the properties of an existing\
    \ class. Properties can include data members and also member functions. The existing\
    \ class is called *base class* and the new class is called *derived class*. This\
    \ process facilitates code reusability. Instead of writing a new class all over\
    \ again, we can use the properties of an existing class and write only the additional\
    \ properties that are required.\n\nConsider a class called *Person* with public\
    \ data members – *FirstName, LastName and City*. The declaration of this class\
    \ would be as follows:\n\n```cpp\nclass Person\n{\n    public:\n        char FirstName[20],\
    \ LastName[20], City[20];\n};\n```\n\nIt would look like this:\n\n![](img/cda5b023e23ffd0b87fc37b1da33973d_147_0.png)\n\
    \nLet’s say we want to declare another class called Student having the data members\
    \ – *FirstName, LastName, City, School and Grade.*\n\nThe declaration of this\
    \ class would be as follows:\n\n```cpp\nclass Student\n{\n    public:\n    char\
    \ FirstName[20], LastName[20], City[20], School[20];\n    int Grade;\n};\n```\n\
    \nThe Student Class would look like this:\n\n![](img/cda5b023e23ffd0b87fc37b1da33973d_148_0.png)\n\
    \nAs seen from the diagrams and the code snippets, the data members *FirstName,\
    \ LastName and City* are common in *Person class* as well as *Student class.*\
    \ Using inheritance, we can derive the *Student class* from the *Person class*\
    \ wherein the *Student class* will get its own set of data members present in\
    \ the *Person Class – FirstName, LastName, City* and we would have to only declare\
    \ two data members inside the *Student class* – *School and Grade*. The general\
    \ syntax for inheritance is:\n\n```\nclass <Derived Class Name> : <Access Type>\
    \ <Base Class Name>\n{\n    //Class Definition\n};\n```\n\nOnly public and protected\
    \ class members of a class can be inherited into another class; private class\
    \ members cannot be inherited.\n\n*Access Type* can be *public, private or protected*.\
    \ If Access Type is:\n\n- *public:*\n  - public class members of the base class\
    \ are inherited and made public in the derived class.\n  - Protected class members\
    \ of the base class are inherited and made protected in the derived class.\n-\
    \ *protected:*\n  - public and protected class members of the base are inherited\
    \ and made protected in the derived class.\n- *private:*\n  - public and protected\
    \ class members of the base class are inherited and made private in the derived\
    \ class\n\nLet us derive the Student Class from the Person Class:\n\n```cpp\n\
    class Student : public Person\n{\n    public:\n\n    char School [20];\n\n   \
    \ int Grade;\n};\n```\n\nAs seen from the above code snippet, *public* inheritance\
