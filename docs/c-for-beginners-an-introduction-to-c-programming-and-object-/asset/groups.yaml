    # ## 5.2 Constants


    Constants are read-only values which cannot be changed in the program later. In
    *Section 3.7.1*, we have learned to write basic C++ programs where we used cout
    to display messages on the screen. The message was essentially a *constant string
    expression*. We will learn more about strings in the *Strings* chapter of this
    book.


    There are two ways to define constants. The first one involves using the *const*
    keyword and the second one using the *#define* pre-processor directive.


    # ### 5.2.1 const Keyword


    A variable can be defined as a constant by prefixing the *const* keyword at the
    time of declaration. Because you cannot change the value of a constant, it is
    important to initialize the variable at the time of declaration. The general syntax
    is as follows:


    ```

    const <data type> <variable name> = <value>;

    eg:

    const int num = 100;

    const float x = 1.25;

    //All variables will become constants:

    const char first = ''c'', last = ''b'';

    ```'
