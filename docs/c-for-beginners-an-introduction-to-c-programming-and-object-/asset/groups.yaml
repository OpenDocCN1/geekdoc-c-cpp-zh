    ```


    如果源文件中没有错误且编译成功，则将按照编译命令中 **-o** 选项的指定生成可执行输出文件。在 Windows 上，可执行文件将自动带有 .exe 扩展名。如果未设置
    **-o** 选项，即未指定输出文件，则编译成功后，在 Linux/Mac 上将生成名为 *a.out* 的可执行文件，在 Windows 上将生成 *a.exe*。


    为了执行编译后的程序，请使用以下命令：


    **在 Linux/Mac 上：**


    ```

    ./<executable output file>

    eg:

    ./hello

    ```


    **在 Windows 上：**


    ```

    <executable output file>

    eg:

    hello.exe

    ```


