    Over the years, there have been a lot of improvements to the initial implementation
    of C++. *International Organization for Standardization (ISO)* standardizes C++.
    The first standard *ISO/IEC 14882:1998 (C++98)* was approved in 1998. The latest
    standard at the time of writing this book is *ISO/IEC 14882:2017 (C++17)* which
    was approved in 2017. Each new standard offers new features and/or improvements
    to the previous ones. This book follows the widely used *ISO/IEC 14882:2011 (C++11)*
    standard which was approved in 2011. Unless you are a professional core C++ developer
    whose life revolves around developing performance critical applications in C++,
    you should not be worried about the ever evolving C++ standards.


    With this book, you will learn the basics of C++. The concepts of procedural programming
    as well as object oriented programming have been covered. Having some knowledge
    of programming, especially knowing C programming language will help although not
    necessary. However, you should be comfortable with using your PC/MAC. Some experience
    with the usage of Terminal of Linux/MAC and Command Prompt on Windows is needed.'
