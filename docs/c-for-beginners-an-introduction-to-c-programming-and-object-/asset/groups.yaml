    \ 预处理指令\n\n预处理指令是以井号（#）开头的语句。与普通语句不同，它们不以分号结尾，因此每条预处理指令必须写在新的一行。预处理指令在编译过程开始之前处理。在某种程度上，它们向编译器提供元信息。以下是一些预处理指令示例：\n\
    \n```cpp\n#include <iostream>\n#define PI 3.14\n#pragma startup myfunction\n```\n\
    \n除 #include 和 #define 之外的预处理指令面向高级程序员，本书只涵盖所需的部分。\n\n### 3.4 注释\n\n注释会被编译器忽略，不会对编译过程的结果产生任何影响。通常，注释是解释性语句，但你可以将它们用于任何注释目的。C++\
    \ 提供单行注释和多行注释。单行注释以双斜杠（//）开头，并且必须在同一行结束。多行注释就像注释块，括在以下字符序列中——斜杠星号（/*）和星号斜杠（*/）。\n\
    \n#### 单行注释示例：\n\n```cpp\n//This is a comment\n//This is another comment\n```\n\
    \n如所见，新行上的每条注释都必须以双斜杠开头。\n\n#### 多行注释示例：\n\n```cpp\n/*\nComment block begins here.\n\
    As many lines can be added within the block.\nNo need for double slash ( // )\n\
    */\n```\n\n### 3.5 标识符\n\n标识符用于标识变量、函数、类和对象等。标识符名称可以包含字母（a-z、A-Z）、数字（0-9）和下划线（_），但不能以数字开头，也不能包含任何其他特殊字符。\n\
    \n### 3.6 关键字\n\nC++ 中的关键字是保留字，不能用作标识符名称。关键字具有特定含义，用于告诉编译器要做什么。以下是按字母顺序排列的关键字列表：\n\
    \n| | | | |\n| --- | --- | --- | --- |\n| asm | else | new | this |\n| auto |\
    \ enum | operator | throw |\n| bool | explicit | private | true |\n| break | export\
    \ | protected | try |\n| case | extern | public | typedef |\n| catch | false |\
    \ register | typeid |\n| char | float | reinterpret_cast | typename |\n| class\
    \ | for | return | union |\n| const | friend | short | unsigned |\n| const_cast\
    \ | goto | signed | using |\n| continue | if | sizeof | virtual |\n| default |\
    \ inline | static | void |\n| delete | int | static_cast | volatile |\n| do |\
    \ long | struct | wchar_t |\n| double | mutable | switch | while |\n| dynamic_cast\
    \ | namespace | template | |\n\n### 3.7 基本 C++ 程序结构\n\n一个非常基本的独立 C++ 程序必须包含以下组成部分：\n\
    \n- 1. `#include <iostream>` 语句：\n\n  如*第 3.3 节*所述，所有以井号（#）开头的语句都是预处理指令。**#include**\
    \ 指令指示编译器要包含哪个*头文件*。*头文件*包含变量、函数以及类和对象的定义，可用于各种目的。包含头文件的一般语法如下：\n\n```cpp\n#include\
    \ <header here>\nEg:\n#include <iostream>\n#include <fstream>\n```\n\n**#include**\
    \ 语句也可用于包含头文件，这些头文件可以是编译器提供的，也可以是用户定义的本地头文件（放在与程序相同的目录中）。要包含本地头文件，文件名必须放在双引号内，而不是尖括号内，如下所示：\n\
    \n```cpp\n#include \"my_header_file.h\"\n```\n\n**`#include <iostream>`** 语句指示编译器包含\
    \ *iostream* 头文件，该头文件提供**输入/输出流**，用于从用户读取数据并在屏幕上显示数据。如果你想编写一个与用户交互的独立 C++ 程序——无论是接受输入还是在屏幕上显示内容——你必须在程序中放置\
    \ **`#include <iostream>`**，通常放在前几行。\n\n不同的编译器提供了许多这样的内置头文件。例如，*fstream* 头文件用于文件输入/输出，*iomanip*\
    \ 用于格式化要在屏幕上显示的输出，*cmath* 提供执行数学函数的定义，等等。C++ 还向后兼容大多数传统 C 头文件（以 .h 结尾的文件），例如——*stdlib.h、stdio.h、math.h*。\n\
    \n"
