    ```


    Assignment operator, assigns the value of the operand on the right to the operand
    on the left. Operand on the left side of the assignment operator has to be a variable.
    Operand on the right side of the assignment operator can be a constant, variable
    or an expression. In case of an expression, it will be evaluated first and then
    the value will be assigned except when a post-increment operator is used as demonstrated
    in the code snippet below:


    ```

    ```cpp

    int a, b, c = 100 ;

    a = c * 100 ;

    b = c++;

    ```

    ```


    Before assigning a value to variable *a*, the expression *c * 100* will be evaluated
    first. Hence the variable *a* will now hold a value of *10000*. Whereas, the value
    of *c* will be assigned to variable *b* first and then *c* will be incremented.
    Hence variable *b* will now hold *100* and variable *c* will now hold *100*. If
    you want to increment first and then assign, pre-increment operator needs to be
    used: *b = ++c*.


    # 7.5.1 Compound Assignment Operators


    Compound Assignment Operators are used to perform mathematical operations on operands
    first and then assign.'
