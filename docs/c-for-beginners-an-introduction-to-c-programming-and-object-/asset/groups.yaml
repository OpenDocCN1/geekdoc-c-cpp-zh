    \n## 9. 函数\n\n函数是执行特定任务的代码块。函数（同义词为方法）用于需要重复使用某段代码的场景。C++ 标准库提供了内置函数，我们也可以定义自己的函数。处理用户自定义函数时需要了解两件事——函数定义和函数调用。\n\
    \n### 9.1 函数定义\n\n函数应在 main 方法之外定义。一般语法如下：\n\n```cpp\n<return data type> <function\
    \ name> ( <parameters> )\n{\n    //Function Body\n    //Statements...\n    return\
    \ <value>; //Only if the function returns a value.\n}\n```\n\n函数定义的重要部分包括：返回数据类型、函数名、参数、函数体。\n\
    \n### 返回数据类型\n\n该字段指定函数返回的数据类型。例如，如果你有一个函数返回两个整数的和，那么该函数的返回类型应为 **int**。如果函数不返回任何数据，则返回类型应为\
    \ **void**。如果函数返回一个值，则必须在函数体末尾有一条必需的 return 语句。\n\n### 函数名\n\n函数名是为函数赋予的名称，用于标识。该名称用于调用函数。\n\
    \n### 参数\n\n参数是函数接受的一组变量。这些变量在调用函数时被发送给函数。每个参数之间用逗号分隔。\n\n### 函数体\n\n这是函数定义的核心部分，函数的实际工作从这里开始。计算语句就放在这里。如果函数返回一个值，则必须在函数体末尾有一条必需的\
    \ return 语句。函数只能返回一个值。\n\n以下是几个函数定义的示例：\n\n一个不返回任何数据、不接受任何参数、仅在屏幕上显示消息的函数：\n\n\
    ```cpp\nvoid display_message ( )\n{\n    cout << endl << \"Hello! We are inside\
    \ a function block! \" << endl;\n}\n```\n\n一个接受 3 个参数并显示它们的和、但不返回任何数据的函数：\n\n\
    ```cpp\nvoid display_sum (int x , int y , int z )\n```\n\n"
