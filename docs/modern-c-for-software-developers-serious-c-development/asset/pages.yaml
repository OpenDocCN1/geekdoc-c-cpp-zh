  md: "# Modern C++: lvalues And rvalue References (C++11)\n\n# Understanding lvalues\
    \ and rvalues\n\nIn C++, a lvalue (left value) is a variable or constant that\
    \ has a specific addressable memory location. In contrast, a rvalue (right value)\
    \ doesn't have an addressable memory location. In general, rvalues are ephemeral\
    \ and may exist only for the duration of one statement. In contrast lvalues live\
    \ a longer life since they exist as variables or constants with addressable memory.\
    \ Consider this example:\n\n```\nint x = 966;\n```\n\nx is a lvalue since it has\
    \ an addressable location in memory (&x). However, 966 is a rvalue since it does\
    \ not have an addressable memory location. For example, 966 may be in some CPU\
    \ register or unknown memory location for an indeterminate period of time. For\
    \ the previous statement, the rvalue exists only for the duration of the statement.\
    \ As soon as the statement is executed, the rvalue ceases to exist. C++ requires\
    \ the left-hand side of an assignment statement to be a lvalue.\n\nConsider:\n\
    \n```\nint square(const int x) {\n    return x**2;\n}\n\nint main() {\n    auto\
    \ y = square(10);\n}\n```\n\nIn the assignment statement, the value returned by\
    \ the function on the right hand side is a rvalue. This value exists on the stack\
    \ and will disappear as soon as the statement is executed. In order to use the\
    \ rvalue, it must be stored in the variable y, which is a lvalue."
