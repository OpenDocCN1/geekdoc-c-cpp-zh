  md: "# # Modern C++: Override And Final (C++11)\n\n# ## The override Attribute\n\
    \nEvery time we define a method in a derived class that overrides a virtual method\
    \ in its base class, we should give the function the override attribute. This\
    \ is a safety feature.\n\n```\nclass Base\npublic:\n    virtual void f() {\n \
    \   std::cout << \"Base class f \\n\"\n}\nclass Foo : public Base\npublic:\n \
    \   void f() override {\n    std::cout << \"Derived class f \\n\"\n};\n```\n\n\
    If we tag a virtual member function with the override keyword, the compiler will\
    \ ensure that the virtual member function exists in the base class, and it will\
    \ prevent the program from compiling if this is not the case.\n\n# ## Using override\
    \ Can Prevent A Dangerous Bug\n\nWhen a function is marked with the override attribute,\
    \ it must exist in the base class as a virtual function. Thus if the base class\
    \ declares a function as virtual void func(int) but then the derived class mistakenly\
    \ declares a function: void func(float) override, then the compiler will catch\
    \ the error since the derived class should have an int type parameter. Of course,\
    \ we can declare func in the derived class as virtual func(float) (without the\
    \ override keyword), and then we will have a new virtual function that has a"
