    # Importing Namespaces: The using Directive


    If our program includes frequent references to identifiers in a namespace, having
    to specify the namespace and the scope resolution operator each time we refer
    to such identifiers quickly becomes tedious. The using statement alleviates this
    problem. The using statement has these two general forms:


    ```

    using namespace foo;

    using foo::bar;

    ```


    In the first form, foo specifies the name of the namespace we want to access.
    All of the members defined within the foo namespace are brought into scope (they
    become part of the current namespace) and may be used without a scope resolution
    operator (for example, vector instead of std::vector). In the second form, only
    a specific member bar of the foo namespace is brought into scope.


    Given counter_namespace as shown above, the following using statement and assignment
    is valid:


    ```

    // only lowerbound is visible

