  md: '# Maps (std::map)


    The map class implements the associative containers. An associative container
    maps keys to values. A map can be visualized as a set of (key, value) pairs. Two
    different keys cannot map to the same value. We retrieve a value from a map by
    using its associated key. We can look up a value in a map if we have it''s key.


    A map can only hold unique keys. Duplicate keys are not allowed.


    Maps maintain their keys in sorted order.


    The standard library also implements the multimap template, this allows us to
    construct maps where more than one key maps to the same value.


    The syntax for a map template declaration is:


    ```

    template <class TKey, class TValue, class Comp = less<Key>, class Allocator =
    allocator<T>>

    class map;

    ```


    Tkey is the data type of the keys in the map. Tvalue is the data type of the values
    in the map. Comp is a function that compares two keys. Comp defaults to the less
    function object. Allocator is the memory allocator (this defaults to allocator).


    The following map constructor constructs an empty map. The function cmpfn, if
    present, determines the ordering of the map.


    ```

    explicit map(class TKey, class TValue, const Comp &cmpfn = Comp(), const Allocator
    &a = Allocator());

    ```'
