    # Mutexes


    A race condition occurs when two or more threads try to access a shared resource
    simultaneously. The purpose of a mutex is to prevent race conditions from occurring
    by locking shared resources so that only one thread can access the resource at
    any time. A mutex accomplishes this by locking the portion of the code that accesses
    a shared resource.


    A critical section is a sequence of program statements that will be executed in
    their entirety by one thread at a time. Typically a critical section consists
    of program statements that access variables (resources) that are shared by multiple
    threads. Critical sections have the following type of symbolic syntax:


    ```

    lock the mutex

    execute critical section

    unlock the mutex

    ```


    Notice that the mutex object has to be shared by all of the threads that want
    to execute the statements in the critical section. Therefore the mutex is defined
    as a global variable.


    # Locking Multiple Mutexes With std::lock()


    std::lock() attempts to lock multiple mutexes in a deadlock-free manner. It''s
    syntax is:


    ```

    std::mutex m1;

    std::lock(m1);

    ```'
