  md: 'std::async are the arguments of the factorial function.


    The factorial function will be launched in a new thread and the main thread will
    continue processing.


    When the main thread encounters the statement `f.get()`, it will wait for the
    factorial function to return.


    The `f.get()` function will return the value computed by the factorial function.
    This value will be wrapped in the object of type `std::future<size_t>`.


    **Note:** The parent thread can call `f.get()` only once (since it gets it''s
    value only when the factorial function returns). Calling it more than once will
    result in an exception.


    # std::async Launch Types


    `std::async` supports different launch types:


    +   std::launch::async Starts the target function in a new child thread.


    +   std::launch::deferred Defers the relaunching of the target function until
    `f.get()` is encountered by the parent thread. It executes the target function
    in the parent thread.


    +   std::launch::async | std::launch::deferred Defers the relaunching of the target
    function until `f.get()` is encountered by the parent thread. The target function
    may be executed in the main thread or a new thread depending upon the compiler''s
    implementation.


    The default value of the first parameter is `std::launch::deferred | std::launch::async`
    . The first parameter can be omitted if we are using the default value.


