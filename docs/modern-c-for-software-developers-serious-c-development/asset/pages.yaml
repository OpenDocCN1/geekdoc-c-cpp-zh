  md: '# Modern C++: Type Includes The Exception Spec (C++17)


    Since C++17, exception handling specifications have become part of a function.
    That is, the following two function declarations are now two different types:


    ```

    void foo(int);

    void foo(int) noexcept; // different type, see below

    ```


    Prior to C++17, both functions would have been the same type.


    The compiler will enforce correct exception semantics for function pointers:


    ```

    // Note: we cannot define f1 and f2 together in the same namespace

    // f1 and f2 have the same signatures even though they are

    // different types

    void f1();

    void f2() noexcept;


    // define a pointer to a function that doesn''t throw an exception

    void (*funcptr)() noexcept fp;


    // this assignment is OK, since the pointer does not violate exception

    // semantics

    fp = f2;


    // Error C++17, the pointer is trying to point to

    // a different type of function

    fp = f1;

    ```


    We cannot overload a function name with the same signature and different exception
    semantics in the same scope:


    ```

    void f3(int x);

    void f3() noexcept; // Compiler Error

    ```'
