    int x = 5;

    or

    int x;    // x holds some unknown value

    ```


    For primitive C and C++ types such as int, long, float and double, a declaration
    is also a definition. This however is not the case for more complex types that
    we will encounter later.


    A definition of a function tells the compiler how the function works. It shows
    the instructions that are executed by a function:


    ```

    // declaration of function foo (also called a fuction prototype)

    int foo();

    // definition of function foo

    int foo () {

    int x = 5;

    return x;

