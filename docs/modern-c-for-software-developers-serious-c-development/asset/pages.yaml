  md: "# C Language: setjmp And longjmp\n\nThe functions setjmp() and longjmp() can\
    \ be used to save the execution context of a running program and restore it at\
    \ some later point in time. By execution context, we mean the state of the CPU\
    \ registers, the stack and the allocated memory. setjmp() saves the execution\
    \ context of the program and longjmp() restores it.\n\nsetjmp() and longjmp()\
    \ can be used to jump to different parts of a program. Practical uses include\
    \ jumping out of deeply nested loops, invoking error handling routines and jumping\
    \ to named labels in the code. All of this is explained with a simple example:\n\
    \n```\n#include <setjmp.h>\n#include <stdio.h>\n\nvoid jumper(jmp_buf env) {\n\
    \    printf(\"inside jumper\\n\");\n    longjmp(env, 1);\n    printf(\"after longjmp\\\
    n\");\n}\n\nint main() {\n    jmp_buf env;\n    int ret = setjmp(env);\n    if\
    \ (ret == 0) {\n        printf(\"setjmp executed\\n\");\n    } else {\n      \
    \  printf(\"returned from longjmp\\n\");\n        return 1;\n    }\n    jumper(env);\n\
    \    return 0;\n}\n\noutput\nsetjmp executed\ninside jumper function\n```"
