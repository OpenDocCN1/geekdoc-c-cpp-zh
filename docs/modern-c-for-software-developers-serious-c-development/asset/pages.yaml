  md: "# C++ Copy Constructors\n\nBy default, C++ performs a bitwise copy during an\
    \ object assignment such as Foo = Bar. That is, an identical copy of the object\
    \ is made. Although this is perfectly adequate for many cases and exactly what\
    \ we want to happen, there are situations in which a bitwise copy must not be\
    \ used. One of the most common cases is when an object allocates memory when it\
    \ is created. For example, assume we have a class MyClass that allocates memory\
    \ whenever an instance is created. Let A be an instance of this class and suppose\
    \ that we have the following assignment:\n\n```\nMyClass B = A;\n```\n\nIf a bitwise\
    \ copy is performed, then B will be an exact copy of A. This means that B will\
    \ be using the same piece of allocated memory that A is using, instead of allocating\
    \ its own memory. Clearly, this is dangerous. For example, if MyClass includes\
    \ a destructor that frees allocated memory, then the same piece of memory will\
    \ be freed twice when A and B are destroyed.\n\nC++ solves this problem with copy\
    \ constructors. A copy constructor initializes an object using another object.\n\
    \nThe syntax for a copy constructor is:\n\n```\nClassName(const ClassName& obj)\
    \ {\n  // body of constructor\n}\n```\n\nobj is a reference to an object of type\
    \ ClassName. It is permissible for a copy constructor to have additional parameters.\
    \ However, in all cases, the first parameter"
