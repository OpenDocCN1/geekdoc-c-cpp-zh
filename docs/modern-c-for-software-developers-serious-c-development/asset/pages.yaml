- pgno: 109
  md: "An object's constructor is called when the object comes into existence, and\
    \ an object's destructor is automatically called when the object is destroyed.\n\
    \nGlobal objects have their constructor functions execute before main begins execution.\
    \ Global constructors are executed in the order of their declaration, within the\
    \ same file. The order of execution of global constructors is unknown when they\
    \ are spread among several files. Global destructors execute in reverse order\
    \ after main has terminated.\n\nA local object's constructor function is executed\
    \ when the object's definition is encountered. The destructor functions for local\
    \ objects are executed in the reverse order of the constructor functions.\n\n\
    # Private Destructors\n\nConsider the following example:\n\n```\n#include <iostream>\n\
    class Foo {\nprivate:\n    ~Foo();\n};\nint main() {\n    Foo foo;\n}\n\n// output\n\
    error: 'Foo::~Foo()' is private within this context\n```\n\nThis program will\
    \ not compile. The reason is that foo is created on the stack and once foo leaves\
    \ its scope, the destructor cannot be called since it is private. Making a class\
    \ destructor private ensures that only the class object can destroy itself. For\
    \ example, a reference counting object can destroy itself when it's count reaches\
    \ zero."
