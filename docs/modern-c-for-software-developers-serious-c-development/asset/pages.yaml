- pgno: 32
  md: '# C Language: C Style Casts


    A variable value is stored as a sequence of bits. The data type of a variable
    tells the compiler how to translate these bits into meaningful values. Different
    data types may represent the "same" number differently. For example, the integer
    value 3 and the float value 3.0 are stored as completely different bit patterns.


    In C we can convert a variable or a literal from one type to another by preceding
    the variable or literal with the target type in round brackets:


    ```

    float y = (float) 6/4;

    ```


    This is an example of type conversion. The compiler will convert the integer number
    6 to a float and then divide it by 4 to get 1.25. Note that if the float type
    conversion is not present on the right hand side, then the right hand side will
    evaluate to 1 and 1.0 will be assigned to y. Since y is a float type the compiler
    performs an implicit type conversion of the integer 1 to a float type.


    # Function-Style Casts


    C also implements function-style casts:


    ```

    T(expression)

    ```


    where T is some type.


    ```

    int x = int(3.14)          // 3.14 is cast to an int type.

    ```


    # Implicit Type Conversion'
  merge: -1
  img_proc: true
- pgno: 33
  md: 'The type conversions that we have shown in the examples above are explicit
    type conversions. However the compiler will automatically attempt an implicit
    type conversion when the target type is a type different from the subject type.
    An implicit type conversion or automatic type conversion will occur in three cases:


    # During Initialization:


    ```

    float y = 5; // int type 5 converted to float

    ```


    # When Setting Function Parameters:


    ```

    int myFunc(float p); // myFunc is called with an int argument. For example, myFunc(3)

    ```


    # Function Return Values:


    A function''s return value is changed to a different type.


    ```

    float y = myFunc(5); // myFunc returns an integer type

    ```


    Automatic type conversion occurs whenever a value from one fundamental data type
    is converted into a value of a larger fundamental data type from the same family
    (this is called widening). For example, an int can be widened into a long, and
    a float promoted into a double.


    Shortening will occur when a type conversion converts a value to a type which
    has a shorter length. For example, this occurs when a variable of an int is converted
    to a char type or a long type variable (64 bit length) is converted to a variable
    of int type (32 bits). These types of conversions are called shortening conversions.
    They are dangerous because they can result in a loss of value.'
