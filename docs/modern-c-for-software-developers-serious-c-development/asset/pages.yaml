  md: "# C++ Linkage Specification\n\nIn C++ we can specify how a function is linked\
    \ into our program. By default, functions are linked as C++ functions. However,\
    \ by using a linkage specification, you can cause the object code for a function\
    \ written in a different language to be linked into a C++ program. The general\
    \ form of a linkage specifier is:\n\n```\nextern \"language\" function declaration;\n\
    ```\n\nLanguage denotes the language of the function that is to be linked. All\
    \ C++ compilers support both C and C++ linkage. Some will well allow linkage to\
    \ Fortran and Pascal language functions.\n\nEvery language has's its own conventions\
    \ about function parameters and the function return value have to be loaded on\
    \ the stack, and how CPU registers are to be saved when program code calls a function.\
    \ The extern keyword informs the compiler about this convention.\n\nThe following\
    \ program causes the function myCFunc() to be linked as a C function:\n\n```\n\
    #include <iostream>\nusing namespace std;\n\nextern \"C\" void myCFunc(int);\n\
    \nint main() {\n    myCFunc(5);\n    return 0;\n}\n\n// Because of the extern\
    \ statement,\n// the following function will be linked as a C function.\nvoid\
    \ myCFunc(int val) {\n    cout << \"This links as a C function with value: \"\
    );\";\n    cout << val << endl;\n}\n```"
