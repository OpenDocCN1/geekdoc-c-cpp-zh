- pgno: 444
  md: '# Instantiating A Coroutine


    When a coroutine is called the compiler executes the following sequence of events:


    +   1. Allocates memory for the coroutine using the *new* operator (this memory
    is called the activation frame of the coroutine).

    2. Copies any function arguments passed by the calling function into the activation
    frame.

    3. The C++ run-time then calls the constructor for the *promise_type* struct.

    4. After the *promise_type* object has been constructed, the run-time calls the
    *get_return_object* method. This method constructs an object of type ReturnObject.

    5. The method *initial_suspend* is then called before the first line of code in
    the body of the coroutine is executed. If the return value of *initial_suspend*
    is *std::suspend_never*, the coroutine starts execution of the code in the body
    of the function. If the return value is *std::suspend_always*, the coroutine goes
    into a suspended state without executing any code in the body of the coroutine.

    6. The method *final_suspend* is executed when the coroutine is about to exit.
    This function also returns an *awaiter* object.


    Note that an object of type *ReturnObject* will be returned to the caller when
    the coroutine suspends itself or the coroutine exits through a *co_return* or
    the closing brace of the function. The calling function uses *ReturnObject* to
    resume a suspended coroutine, destroy a coroutine or obtain information about
    it’state.'
