    }\n```\n\nThe constructor of a duration object takes a value in ticks.\n\nDuration\
    \ objects have a member function count(). count returns a constant number of type\
    \ Type. This number is the duration of the object in ticks or the number of ticks\
    \ since the clock's epoch. Suppose that our count function returns 1000. This\
    \ is the duration as the number of ticks. This value is interpreted in terms of\
    \ the period of the duration. Suppose that the period is the ratio<1,1000>. This\
    \ means there are a thousand ticks in a second. So count is interpreted as returning\
    \ a duration of one second. If the period is ratio<1,10> then there are 10 ticks\
    \ in a second. So count is interpreted as returning a duration of 100 seconds.\n\
