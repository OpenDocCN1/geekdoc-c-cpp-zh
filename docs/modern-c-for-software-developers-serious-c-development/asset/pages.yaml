- pgno: 174
  md: '# C++ Virtual Functions And Polymorphism


    C++ implements compile-time and run-time polymorphism. Compile-time polymorphism
    is achieved by overloading functions and operators. Run-time polymorphism is accomplished
    by using inheritance and virtual functions.


    # Virtual Functions


    A virtual function is a member function that is declared in a base class and (possibly)
    redefined in a derived class. Redefining the function, we mean changing the body
    of the function but not the function signature. To create a virtual function,
    precede the function''s declaration in the base class with the keyword virtual.
    When a class containing a virtual function is inherited, the derived class can
    redefine the virtual function to fit its own needs.


    In essence, virtual functions implement the "one interface, multiple methods"
    philosophy that underlies polymorphism. The virtual function in the base class
    is part of the interface to the class. Each redefinition of the virtual function
    in a derived class implements the interface so that specifically relates to the
    derived class.


    When accessed "normally", virtual functions behave just like any other class member
    function. However, what makes virtual functions important and capable of supporting
    run-time polymorphism is how they behave when accessed through a pointer. A base
    class pointer can be used to point to an object of a class that is derived from
    the base class. When a base class pointer points to a derived object that inherits
    a virtual function, C++ determines which version of that function to call based
    upon the type of object pointed to by the pointer. This determination is made
    at run-time. Thus, when different objects are pointed to, different versions of
    the virtual function are executed.'
