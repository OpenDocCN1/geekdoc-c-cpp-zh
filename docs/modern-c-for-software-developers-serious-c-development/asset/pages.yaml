    likely take than one debugging session to locate the bug. In such a situation
    it is completely frustrating as well as time consuming to have up the breakpoints
    whenever you start a new session. GDB provides a way to avoid this problem.


    Firstly set up your breakpoints in the normal manner. Then save your breakpoints
    to a file:


