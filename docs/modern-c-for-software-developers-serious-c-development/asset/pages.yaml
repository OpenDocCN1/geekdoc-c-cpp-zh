  md: '# C++ Standard Template Library


    The C++ Standard Template Library provides solutions to a variety of common programming
    problems. The library is composed of three foundational components: containers,
    iterators and algorithms.


    # Containers


    Containers are objects that hold other objects. There are several different types
    of containers. For example, the vector class (container) defines a dynamic array,
    the deque container implements a double-ended queue, and the list container provides
    a linear list. These containers are called sequence containers. The STL also implements
    associative containers, which map keys to values and these enable the retrieval
    of values from keys.


    Each container class defines a set of member functions that may be applied to
    objects in the container.


    # Algorithms


    Algorithms act on containers. They provide the means by which we can manipulate
    the contents of containers. Algorithms can initialize, sort, search and transform
    the contents of containers.


    # Iterators


    Iterators are objects that behave like pointers. They give us the ability to traverse
    through the items in a container in much the same way that we can use a pointer
    to traverse through an array. There are five types of iterators:


    +   - **Random Access Iterators**: Store and retrieves values. Elements are accessed
    randomly.'
  merge: -1
  img_proc: true
- pgno: 238
  md: 'Bidirectional Iterators Store and retrieve values. These iterators move forward
    and backwards sequentially.


    Forward Iterators Store and retrieve values. This type of iterator is forward
    moving only.


    Input Iterators Store but does not retrieve values. Forward moving only.


    Output Iterators Retrieves but does not store values. Forward moving only.


    Iterators are handled just like pointers. We can increment and decrement them.
    We can apply the * dereferencing operator to them to get the value pointed to.


    The STL also supports reverse iterators. Reverse iterators move through a sequence
    the reverse direction. Thus, if a reverse iterator points to the end of a sequence,
    incrementing that iterator will cause it to point to one element before the end.


    # Other STL Elements


    In addition to containers, algorithms, and iterators, the STL also implements
    several other components such as allocators, predicates, comparison functions,
    and function objects (functors).


    Each container has at least one allocator defined for it. Allocators manage memory
    allocation for a container. The default allocator is an object of class allocator.
    We can define our own allocators if needed.


    Some of the algorithms and containers use a special type of function called a
    predicate function. A predicate function returns true or false.


    The templates in the header file <functional> help us construct function objects
    (functors). Function objects can be used in place of function pointers in many
    places.'
