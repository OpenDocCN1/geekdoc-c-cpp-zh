  md: "# C++ Exception Handling\n\nAn exception is a catastrophic error which will\
    \ abort program execution unless it is handled. Exception handling allows us to\
    \ manage serious run-time errors in a deterministic manner. With exception handling,\
    \ our program can automatically invoke an error-handling routine when an exception\
    \ occurs. The main advantage of exception handling is that it automates much of\
    \ the error-handling code that previously had to be coded \"by hand\" in any large\
    \ C++ program.\n\nC++ exception handling is built upon three keywords: *try*,\
    \ *catch*, and *throw*. Program statements that you want to monitor for exceptions\
    \ are contained in a try block. If an exception occurs within a try block, the\
    \ system throws the error. The exception can then be caught in a *catch* block\
    \ and processed.\n\nCode that you want to monitor for exceptions must execute\
    \ from within a try block. Functions called within a try block may also throw\
    \ exceptions. Exceptions thrown by monitored code can be caught in an optional\
    \ catch block, which immediately follows the try block in which the exception\
    \ was thrown. The syntax for try and catch blocks is:\n\n```\ntry {\n  // try\
    \ block\n  statements\n}\ncatch (type1& arg) {\n  // catch statements\n}\ncatch\
    \ (type2& arg) {\n  // catch block\n}\ncatch (type3& arg) {\n  // catch block\n\
    }\n```"
