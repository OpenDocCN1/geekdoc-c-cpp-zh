    # Levels Of Exception Safety


    A function can implement and guarantee four levels of exception safety:


    +   - No Exception Safety The function may throw an exception that is not handled.
    No function should ever offer this level of exception safety.

    - Basic Exception Safety If an exception is thrown, it will be handled. Memory
    is guaranteed not to leak. There will be no corruption of data or memory afterwards,
    and all objects will be in a healthy and consistent state. However, it is not
    guaranteed that the data content will be the same as before the function or method
    was called.

    - Strong Exception Safety Strong exception-safety guarantees everything that is
    guaranteed by the basic exception safety level. In addition, the content of the
    data will be recovered to exactly the same state as before the exception'
