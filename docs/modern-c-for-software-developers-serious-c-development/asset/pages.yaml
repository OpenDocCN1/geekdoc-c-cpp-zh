    # Copy Elision


    Copy Elision (sometimes called return value optimization) is an optimization technique
    where, in certain specific circumstances, a compiler is permitted to avoid a copy
    or avoid moving a variable even though the C++ standard says that this must happen.


    Consider the following function:


    ```

    std::string get_string()

    {

    return std::string("I am a string.");

    }

    ```


    According to the strict wording of the C++ standard, this function will create
    and initialize a temporary std::string object on the stack and then copy the object
    onto the stack when the return statement is executed, and finally destroy the
    temporary object. The standard is very clear that this is how the code is implemented.


    Copy elision is a rule that permits a C++ compiler to ignore the creation of the
    temporary object and it''s subsequent copy and destruction. That is, the compiler
    can take the initializing expression for the temporary object and directly place
    it on the stack. Copy Elision is permitted because it improves performance.


    # Toolchain


    A sequence of programs that converts source code into an executable program.


    The canonical C and C++ toolchain is:


    +   - Preprocessor Processes the preprocessor symbols in a source file.'
  merge: -1
  img_proc: true
- pgno: 565
  md: '+   - Compiler Generates assembly language code from a preprocessed source
    file.


    +   - Assembler Converts an assembly language file into machine code (an object
    or .obj file).


    +   - Linker Joins object files to create an executable file.


    Machine code is simply a sequence of machine language instructions that a CPU
    can understand without any further translation. In other words a machine language
    instruction is a sequence of zeros and ones.


    # Translation Unit


    In C and C++, a translation unit is the final input into a C or C++ compiler.
    The compiler processes a translation unit and generates an object file from it.


    A translation unit consists of a source file after it has been processed by the
    C or C++ preprocessor, meaning that the header files listed in the #include directives
    have been literally included, sections of code within #ifdef sections have been
    included, and macros have been expanded. A single translation unit is compiled
    by the compiler into a single object file.'
