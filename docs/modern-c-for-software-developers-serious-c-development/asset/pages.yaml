  md: '# C Language: Enumerations


    An enumeration is a user defined type those values are confined to a set of named
    integer constants. A variable of such a type can only have a value that is equal
    to one of the named integer constants that are specified by this type.


    The syntax for enumerations is:


    ```

    enum enum_name { enumeration list } variable_list;

    ```


    Both the enum name and the variable list are optional. Here is an example:


    ```

