  md: '# Memory Layout Of C And C++ Programs


    A typical C/C++ program in memory consists of following sections:


    +   - Text Segment or Code Segment

    - Data Segment

    - BSS Segment (Block Started by Symbol)

    - Heap Segment

    - Stack Segment


    ![](img/dbc91000ed9a70eff69309bb93f194ab_532_0.png)


    **The Text Segment:** also known as the Code Segment contains the machine language
    program code that will be executed. Typically this segment is shareable and read-only.


    **The Data Segment:** also called the initialized data segment contains the global
    variables and static variables that have been initialized by the program. It may
    be further sub-divided into a read-only section for program constants and a read-write
    section for


    -510-'
