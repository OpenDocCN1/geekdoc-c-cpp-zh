    # Virtual Functions Are Hierarchical


    When a function is declared as virtual in a base class, it may be overridden in
    a derived class. However, the function does not have to be overridden. When a
    derived class does not override a virtual function, then when an instance of the
    derived class accesses the virtual function, the function defined in the base
    class will be used.


    In general, when a derived class does not override a virtual function, the first
    redefinition found in the reverse order of derivation is used.


    # Pure Virtual Functions


    When a virtual function is not redefined in a derived class, the version defined
    in the base class will be used. However, in many situations there can be no meaningful
    definition of a virtual function in a base class. For example, a base class may
    not be able to define an object sufficiently to allow a base class virtual function
    to be used. Furthermore, in some situations we will want to ensure that all derived
    classes override a virtual function in the base class. To handle these two cases,
    C++ supports pure virtual functions.


    A pure virtual function is a virtual function that is declared but not defined
    in the base class. We use the following syntax to declare a pure virtual function:


    ```

    virtual return-type func-name(parameter list) = ;

    ```


    When a virtual function is pure, a derived class must provide its own definition.
    If the derived class fails to override the pure virtual function, a compile-time
    error will result.


    # Abstract Classes'
