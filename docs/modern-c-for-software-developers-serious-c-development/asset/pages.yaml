  md: "# C++ Standard Library: std::function\n\nThe class template std::function is\
    \ a polymorphic function wrapper. If we have a free function, lambda expression,\
    \ function pointer, functor, member function or data member, then std::function\
    \ can be used to wrap this target into a callable class (functor). This functor\
    \ has a copy constructor and is copy assignable. Furthermore this functor can\
    \ be stored and passed as an argument to some other function.\n\nThe declaration\
    \ is:\n\n```\n#include <functional>\ntemplate <class R, class... Args>\nclass\
    \ function(Args)>\n```\n\n$R is the data type of the function return value. $Args\
    \ is a comma separated list of argument types of the function. function is the\
    \ function wrapper class.\n\n**Note:** This declaration creates a family of std::function\
    \ types.\n\nWe construct a function object for a free function as follows:\n\n\
    ```\n#include <iostream>\n#include <functional>\n\n// we will create a function\
    \ object for adder\ndouble adder(int x, double y) {\n    double z = x + y;\n \
    \   std::cout << \"inside adder\" << std::endl;\n    return z;\n}\n\nint main()\
    \ {\n    // declare the functor and initialize it\n    std::function<double(int,\
    \ double)> fun = adder;\n\n    // invoke the callable target in the fun object\n\
    \    auto result = fun(3, 3.12);\n```"
