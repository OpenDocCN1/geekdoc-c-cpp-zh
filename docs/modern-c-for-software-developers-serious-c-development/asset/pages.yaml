  md: '# The void Type


    The data type void represents no value. Functions should always be declared as
    void if they do not take any parameters.


    Consider the following two prototypes:


    ```

    void foo(void);

    void foo();

    ```


    The C compiler interprets the first prototype as not taking any parameters and
    not returning any value. The second declaration is interpreted by the C compiler
    as not knowing whether foo takes any parameters and returning no value (the C++
    compiler behaves differently).'
