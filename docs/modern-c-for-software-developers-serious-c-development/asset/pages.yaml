    # Recursive Mutex


    A recursive mutex keeps a count of the number of times that it has been locked.
    In order for the shared resource to be unlocked, the mutex must be unlocked the
    exact number of times that it has been locked.


    The semantics are as follows. A thread acquires a lock with lock() or try_lock().
    After acquiring a lock, the thread can then lock the resource multiple number
    of times by calls to lock() or try_lock(). The lock prevents other threads from
    accessing the shared resource. The shared resource becomes accessible by another
    thread after it is unlocked the exact number of times that it has been locked.


    std::recursive_mutex object is typically used in recursive functions and loops
    where a particular resource is locked a multiple number of times.


    The declaration syntax for a recursive mutex is:


    ```

    std::recursive_mutex mu;

    ```'
