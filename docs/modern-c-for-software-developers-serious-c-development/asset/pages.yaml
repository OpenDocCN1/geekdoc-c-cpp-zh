  md: "# Modern C++: [[no_unique_address]] (C++20)\n\nThe attribute [[no_unique_address]]\
    \ states that a data member of a class need not have a unique address. Note that\
    \ in unions, the data members of a union ordinarily share a memory address.\n\n\
    This attribute is applied to a potentially empty data member so that the compiler\
    \ can optimize it to occupy no memory. A data member with the [[no_unique_address]]\
    \ attribute may share the address of another member. The syntax is as follows:\n\
    \n```\n[[no_unique_address]] int x {};\n```\n\nHere is a complete example:\n\n\
    ```\nstruct Empty {}; // empty strut\nstruct X {\n    int i;\n    Empty e;\n};\n\
    struct Y {\n    int i;\n    [[no_unique_address]] Empty e;\n};\nint main() {\n\
    \    // the size of any object of empty class type is at least 1\n    static_assert(sizeof(Empty)\
    \ >= 1);\n\n    // at least one byte is needed to give e a unique address\n  \
    \  static_assert(sizeof(X) >= sizeof(int) + 1);\n\n    // empty member optimized\
    \ out\n    static_assert(sizeof(Y) == sizeof(int));\n    return 0;\n}\n```\n\n\
    Output: 0"
