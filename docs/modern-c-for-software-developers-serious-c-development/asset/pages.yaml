- pgno: 64
  md: '# C Language: size_t And sizeof


    size_t is an unsigned integer data type. It is defined in <stdio.h>, <stdlib.h>
    and various other headers.


    size_t is used to represent the size of objects in bytes. It is the return type
    of the sizeof operator. size_t is guaranteed to be big enough in size to hold
    the largest integer that the host system can handle. The maximum permissible size
    is dependent on the compiler and hardware architecture. If the compiler is a 32
    bit compiler then size_t is simply a typedef for unsigned int and if the compiler
    is 64 bit then size_t is a typedef for unsigned long long. The size_t data type
    is never negative.


    # The Compile Time Operator sizeof


    sizeof is a unary compile-operator that returns the length in bytes of the variable
    or parenthesized type that it precedes


    ```

    double f;


    printf("%d", sizeof(f));

    printf("%d", sizeof(int));

    printf("%d", sizeof(double));

    printf("%d", sizeof(struct Employee));

    ```


    The operand of the sizeof operator is a native C or C++ data type then must be
    enclosed in parentheses.


    sizeof primarily helps to generate portable code that depends upon the size of
    the built-in data types.


    Structures and unions can be used to create variables of different sizes. The
    actual size of these variables may change from machine to machine. The sizeof
    operator computes the size of any variable or type and can help eliminate machine-dependent
    code from our programs. This operator is especially useful where structures or
    unions are concerned.'
  merge: -1
  img_proc: true
