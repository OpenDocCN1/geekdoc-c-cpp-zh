  md: '# Summarizing the Differences Between C and C++


    For the most part, Standard C++ is a superset of Standard C, and virtually all
    C programs are also C++ programs. However, a few differences do exist.


    In C++, local variables can be declared anywhere within a block. In C, they must
    be declared at the start of a block, before any "action" statements occur.


    In C, a function declared as follows:


    ```

    int f();

    ```


    says nothing about the parameters of the function. In C, when there is nothing
    specified between the parentheses following the function''s name, this means that
    nothing is being stated, one or the other, about any parameters of the function.
    It might have parameters, or it might not. However, in C++, a function declaration
    like this means that the function does not have any parameters. In C++, the following
    two declarations are equivalent:


    ```

    int f();

    int f(void);

    ```


    In C++, all functions must have declarations which are typically in header files.


    A small but potentially important difference between C and C++ is that in C, a
    character constant such as ''c'' is automatically elevated to an integer. In C++
    it is not.


    In C, although it is unusual, you can call main from within your program. This
    is not allowed in C++.


    In C, it is not an error to declare a global variable several times, even though
    this is bad'
