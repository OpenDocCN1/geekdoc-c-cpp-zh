    ```


    # Statement Termination


    In C and C++ statements are not terminated by a new line (''/n''). They are terminated
    by a semi-colon. Thus C and C++ statements can freely extend over more than one.


    # Literals


    Literals are constants. C has four types of literals: integer literals such as
    45, floating point literals such as 3.12, string literals such as “hello world”;
    and character literals such as ‘c''.


    A literal is a program element that directly represents a value. For example,
    509 is an integer literal or constant.'
