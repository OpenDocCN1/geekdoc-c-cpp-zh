  md: '# C++ Standard Library: std::bind


    Note: also see std::function.


    The std::bind template implements a function adaptor. It converts a function into
    an object. Some of the function parameters can be optionally bound to fixed values.


    The declaration of the std::bind class template is:


    ```

    #include <functional>

    template class T, class ... args> bind;

    ```


    std::bind takes a function pointer as its first parameter T and the function parameters
    as a parameter pack. For example:


    ```

    auto Adder = std::bind(add, std::placeholders::_1, std::placeholders::_2);

    ```


    Here the function pointer is add, it takes two parameters. std::placeholders::_1
    and std::placeholders::_2 are two variables that symbolically represent the corresponding
    parameters of add.


    If we want the second parameter of add to be fixed to 15, we declare our Adder
    object as:


    ```

    auto Adder = std::bind(add, std::placeholders::_1, 15);

    ```


    Now we can call the function add with it''s second parameter fixed to 15, as follows:


    ```

    Adder(5);

    ```'
