  md: '# C++ Operators


    Operators are symbols that denote operations on variables called operands. Familiar
    operators include: +, /, *, %. These are the arithmetic operators. We also have
    relational operators such as <, >, <=, >= and !=. All of these operators are binary
    operators since they require two operands. We also have unary operators such as
    ++, -- and so on. Unary operators need only one operand.


    Operators work with native types such as int and float, for example. In C++ the
    semantics of operators are extended to apply to user-defined data types (classes).
    This is accomplished by operator overloading.


    Operator overloading is closely related to function overloading. In C++, we can
    overload most operators so that they perform special relative to the class in
    which they are defined. For example, a class that maintains a stack might overload
    the ''+'' operator to perform a push operation and ''-'' to perform a pop. Ideally,
    when an operator is overloaded, none of its original meaning is lost. Instead,
    the type of objects to which it applies is expanded.


    The ability to overload operators is one of C++’s most powerful features. It allows
    the full integration of new class types into the programming environment. After
    overloading the appropriate operators, we can use objects in expressions in the
    same way that we use these operators with the C++ built-in (native) data types.


    We overload operators by creating class member operator functions. A member operator
    function defines the operation that the overloaded operator will perform relative
    to the class that it is member off.


    An operator function is created by using the keyword operator. Operator functions
    can be either member functions of a class or free functions. Typically, free operator'
