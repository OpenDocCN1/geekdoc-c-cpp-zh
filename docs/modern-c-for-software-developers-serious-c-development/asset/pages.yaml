    # Vector Containers


    A vector is a dynamic array. This is an array that can automatically grow or shrink
    as needed. In C++, the size of an array is fixed at compile time. While this is
    by far the most efficient way to implement arrays, it is also the most restrictive
    because the size of the array cannot be varied at run-time to accommodate changing
    program conditions. A vector container solves this problem by automatically allocating
    memory for the array, as needed.


    The template declaration for a vector is:


    ```

    template <class T, class Allocator = allocator<T>>nclass vector {};

    ```


    T is the type of data to be stored in the vector. *Allocator* specifies the memory
    allocator, this defaults to the standard allocator.


    A vector container has the following constructors:


    ```

    explicit vector(const Allocator &a = Allocator() );

    ```


    This constructor creates an empty vector.


    The **explicit** keyword prevents any implicit type conversions from occurring.
    The = sign indicates a default template parameter value.'
