  md: '# C++ Standard Library: std::chrono


    The C++ standard library class template std::chrono provides implementations for
    time objects. std::chrono consists three components: clocks, durations and time
    points.


    # Clocks


    A clock consists of a starting time called an epoch and a tick rate. The tick
    rate is the smallest discrete time unit of the clock.


    There are three types of clocks:


    +   - std::chrono::system_clock

    - std::chrono::steady_clock

    - std::chrono::high_resolution_clock


    std::chrono::system_clock is a wrapper for the real-time clock provided by the
    operating system. std::chrono::steady_clock is a monotone increasing clock that
    cannot be adjusted once it has been started. A high_resolution_clock is a user
    defined clock. It is frequently cast to a system_clock or a steady_clock.


    Clocks have the following member functions:


    | now() | gets the current time_point since the start of the clock''s epoch |

    | to_time_t | converts a system clock time to a std::time_t structure |

    | from_time_t | Converts std::time_t to a std::chrono::system_clock |


    All of these member functions are static.'
