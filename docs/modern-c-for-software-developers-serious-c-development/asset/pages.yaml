  md: "# C++ Inline Functions\n\nIn C++, we can create short functions that are not\
    \ actually called; rather, their code is expanded inline at the point of declaration.\
    \ This results in faster code since the stack is not used to load parameters.\
    \ We can cause a function to be expanded inline rather than being called, by preceding\
    \ its declaration with the inline keyword.\n\n```\n#include <iostream>\ninline\
    \ int max(int a, int b)\n{\n    return a > b ? a : b;\n}\nint main()\n{\n    std::cout\
    \ << max(10, 20) << std::endl;\n    std::cout << max(99, 88) << std::endl;\n \
    \   return 0;\n}\n```\n\nThe reason that inline functions are an important addition\
    \ to C++ is that they allow us to create very efficient code. Since classes typically\
    \ require several frequently executed interface functions (which provide access\
    \ to private data), the efficiency of these functions is of critical concern.\
    \ Each time a function is called, a significant amount of overhead is generated\
    \ by the calling and return mechanism. Typically, arguments are pushed onto the\
    \ stack and various registers are saved when a function is called, and then these\
    \ registers are restored when the function returns. The problem is that these\
    \ instructions are time-consuming. However, when a function is expanded inline,\
    \ none of"
