    # std::unique_ptr


    The semantics of the std::unique_ptr class is that it is the sole owner of the
    memory that

    it wraps. A std::unique_ptr object holds a raw pointer and deletes it in it''s
    destructor.


    Consider a makeASandwich() function:


    ```

    #include <memory>


    Sandwich* ptr = makeASandwich()

    std::unique_ptr<Sandwich> sp(makeASandwich());

    ```


    makeASandwich allocates memory for a Sandwich and returns a pointer to the

    allocated memory. sp is a smart pointer object, it wraps a std::unique_ptr object
    called

    sp around the raw Sandwich pointer. We own ownership of the smart pointer and
    no one no one

    can delete or use this object except us. We have ownership of the smart pointer
    and can

    safely modify the Sandwich object that is pointed to without worrying that someone
    might

    have the pointer or altered the object.


    std::unique_ptr pointer is polymorphic and can point to derived objects.


    There are two types of unique_ptr objects. One for scalars and the other for arrays:


    +   - unique_ptr<Foo> wraps a pointer to an object of type Foo.

    - unique_ptr<Foo[]> wraps a pointer to an array of Foo objects.


    The following examples show how to create std::unique_ptr objects. In these

    examples sp1, sp2 and sp3 are smart pointer objects:'
