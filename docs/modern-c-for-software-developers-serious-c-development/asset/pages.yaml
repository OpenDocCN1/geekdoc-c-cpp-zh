  md: '# Modern C++: Variable Initialization (C++11)


    Variable initialization involves declaring a variable and giving it a value. C++11
    introduces a standard syntax for variable initialization.


    Traditionally in C++ initialization can happen with parentheses, braces, or assignment
    operators. This has caused confusion about how to initialize a variable or an
    object. C+11 introduces uniform initialization, which means that we can use a
    standard syntax for initialization.


    # Copy Assignment


    Copy assignment is the traditional way to put a value into a variable. After a
    variable has been declared, we can give it a value by using the assignment = operator.
    This type of initialization is called copy assignment (or just assignment) for
    short.


    ```

    int width               // declare an integer variable named width

    width = 5;              // copy assignment of value 5 into the variable

    ```


    Copy assignment is named as such because it copies the value on the right-hand
    side of the = operator to the variable on the left-hand side of the operator.
    The = operator is called the assignment operator.


    The problem with copy assignment is that it uses two statements (a declaration
    and assignment) and thus consumes more CPU cycles.


    We can combine the declaration and initialization of a variable into one step
    in order to conserve a few CPU cycles:


    ```

    int width = 5;

    ```'
