    handling process. These functions are supplied by the Standard C++ library. Their
    declarations are:


    ```

    void terminate();

    void unexpected();

    ```


    Both functions require the <exception> header.


    The terminate function is called whenever the exception handling subsystem fails
    to find a matching catch handler for an exception. The terminate function is also
    called under various other, more obscure circumstances. For example, such a circumstance
    could occur when, in the process of unwinding the stack because of an exception,
    a destructor for an object being destroyed throws an unhandled exception.


    In general, terminate is the handler of last resort when no other handlers for
    an exception are available. By default, terminate abort which aborts a program.


