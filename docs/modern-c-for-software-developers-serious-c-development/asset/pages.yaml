  md: '# Modern C++: Concepts (C++20)


    There are two approaches to compile-time polymorphism. Firstly, we can explicitly
    code all of the overloaded functions that we need. Alternatively, we can define
    generic function templates and generic class templates. Both of these approaches
    are problematic. The first approach is tedious and error-prone. The second approach
    is too expensive because we may want to prohibit some template specializations.


    C++20 introduces concepts to handle the previous issues. Concepts are predicate
    expressions that constrain the template parameters of a class or function template.
    These expressions are evaluated at compile time to determine whether template
    parameters satisfy the given constraints. Only template specializations that meet
    the constraints imposed by a concept are permissible.


    **Definition (concept):** A concept is a named compile-time constraint on template
    types such as its supported operations and semantics.


    There are many of syntactic constructs available to implement concepts; the following
    syntax is one of the ways to specify a concept:


    ```

    template<typename T, typename X, ...>

    concept concept_name = <constraint>

    rest of the template declaration;

    ```


    Concepts have the following advantages:


    +   - The requirements imposed on template parameters are part of the declaration.

    This means that concepts are self-describing.

    - We can use predefined concepts or define our own concepts

    - If a function declaration uses a concept, it automatically becomes a function
    template.'
  merge: -1
  img_proc: true
- pgno: 419
  md: "# The Four Ways To Specify A Concept\n\nThere are four ways to implement concepts.\
    \ These are discussed below.\n\n# Preface A Typename With A Concept\n\nIn the\
    \ template declaration, we prefix a typename with a concept:\n\n```\n#include\
    \ <concepts>\n#include <iostream>\n\ntemplate<std::integral T>\nT add(T a, T b)\
    \ {\n  return (a + b);\n}\n```\n\nHere the constraint on the template parameter\
    \ T is part of the type declaration itself.\nThis makes the declaration of the\
    \ concept in the add function template self-documenting.\n\nNote: std::integral\
    \ is a predefined type trait that is true only if T is an integer type.\n\n# Implement\
    \ Concepts With A Requires Clause\n\n```\n#include <concepts>\n#include <iostream>\n\
    \ntemplate<typename T>\nrequires std::integral<T>\nT add(T a, T b) {\n  return\
    \ (a + b);\n}\n```\n\nThis syntax uses the requires keyword in conjunction with\
    \ a pre-defined concept.\nThe syntax for custom user-defined concepts is different."
  merge: -1
  img_proc: true
- pgno: 420
  md: "# Implement Concepts With A Trailing Requires Clause\n\nA concept can be specified\
    \ in a trailing requires clause:\n\n```\n#include <concepts>\n#include <iostream>\n\
    \ntemplate<typename T>\nT add(T a, T b) requires std::integral<T> {\n    return\
    \ (a + b);\n}\n```\n\nThe concept is specified as an attribute of the generic\
    \ function.\n\n# Implement Concepts With Abbreviated Function Templates\n\n```\n\
    #include <concepts>\n#include <iostream>\n\nauto add(std::integral auto a, std::integral\
    \ auto b) {\n    return (a + b);\n}\n```\n\nNotice that the template<typename\
    \ T> portion of the declaration is missing. add is automatically a function template\
    \ because the concept constraints are attached to the parameters of the add function.\n\
    \n# The Requires Clause\n\nThe keyword requires introduces a clause which specifies\
    \ constraints on template parameters. requires must be followed by a concept name\
    \ and then a constraint:\n\n```\nconcept concept_name = <constraint>\n```"
