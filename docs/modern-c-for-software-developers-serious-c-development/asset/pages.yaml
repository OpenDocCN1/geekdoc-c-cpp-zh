  md: '# C Language Review


    # Declarations And Definitions


    In C and C++ an identifier is a name that is assigned by a user to a program element
    such as a variable, type, template, class, function or namespace.


    A variable holds a value. In C and C++, variables must be declared before they
    can be used. A declaration specifies the type of the variable and the name of
    the variable. A declaration implicitly specifies the amount of memory that the
    variable needs to hold a value. For example:


    ```

    int x;

    ```


    declares that x is a variable of type int and this type of variable needs 32 bits
    of memory.


    A declaration of a function consists of a function return type, the function name
    and the types of the function parameters. For example:


    ```

    int foo(int x, int y);

    ```


    A variable definition creates a variable and may set (assign) a value to the variable:


    ```

    int x               // declaration of a variable x

    x = 5;             // definition of variable x

    ```


    This definition places the value 5 inside the memory that has been allocated to
    the variable x.


    Declarations and definitions can be combined into one statement. For example:'
  merge: -1
  img_proc: true
