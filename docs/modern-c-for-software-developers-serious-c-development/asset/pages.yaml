  md: "# C++ Standard Library: std::format\n\nstd::format is a variadic function template\
    \ that implements a modern formatting facility based upon printf. std::format\
    \ also implements easy string interpolation. It is declared as follows:\n\n```\n\
    template<class... Args>\nstring format(\"fmt\", Args&... args);\n```\n\nThe function\
    \ argument is a string consisting of text and placeholders. This is followed by\
    \ a variable number of function arguments. The format function returns a string.\n\
    \nAside from any placeholders, the text in the fmt argument is copied to the output\
    \ string verbatim. The placeholders in fmt are designated by braces {}. These\
    \ designated braces are substituted by the function arguments corresponding to\
    \ the brace positions. For example:\n\n```\n#include <iostream>\n#include <string>\n\
    #include <format>\n```\n\n```\nint main() {\n    string str = std::format(\"this\
    \ is an example of {} and {}\", \"dogs\", \"cats\");\n    cout << str;\n```\n\n\
    ```\n#output\n\"this is an example of dogs and cats\"\n```\n\nA placeholder can\
    \ contain an integer index which specifies that the argument at the index position\
    \ is used to be in the substitution. For example:\n\n```\nstring str = std::format(\"\
    \ {2} and {1}\", \"dogs\", \"cats\");\nproduces the output:\n```"
