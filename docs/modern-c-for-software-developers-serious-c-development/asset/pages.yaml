    ```

    char* str = "hello world";

    char str[12] = "hello world";

    char str[] = "hello world";

    ```


    If we use an array declaration (instead of a string literal) then the string is
    mutable:


    ```

    char* str[] = "hello world";

    str[0] = ''z''; // OK

    ```


