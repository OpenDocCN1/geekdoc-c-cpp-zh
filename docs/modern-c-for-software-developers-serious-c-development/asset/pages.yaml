  md: '# C++ Memory Allocation


    C++ supports the C memory allocation functions, malloc, calloc,alloc and free.
    In addition, C++ provides two more memory operators: new and delete. These operators
    are used to allocate and free memory at run-time.


    The new operator allocates memory on the heap and returns a pointer to the start
    of this memory. The delete operator frees memory previously allocated by new.
    The general forms of new and delete are:


    ```

    #include <new>

    type_t* ptrMem = new type_t;

    delete ptrMem;

    ```


    Here, ptrMem is a pointer variable that receives a pointer to memory that is large
    enough to hold an item of type_t.


    Since the heap is finite, it can be exhausted. If there is insufficient memory
    available to fill an allocation request, new will fail with a bad_alloc error.
    This error is actually an exception that we will discuss in a later chapter. bad_alloc
    is defined in the header file <new>. The program should handle this error and
    take appropriate action if a failure occurs. The program will be aborted if this
    error is not handled by our program


    The following program allocates memory from the heap to hold an integer:


    ```

    #include <iostream>

    #include <new>

    using namespace std;

    int main()

    {

    ```'
