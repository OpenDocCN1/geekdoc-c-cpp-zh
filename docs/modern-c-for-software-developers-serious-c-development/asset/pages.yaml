  md: "# Modern C++: Fold Expressions (C++17)\n\nA fold expression applies a binary\
    \ operator to all of the elements of a parameter pack. Consequently, we can perform\
    \ binary operations on the elements of a parameter pack without having to resort\
    \ to recursion.\n\nWe can use all of the binary operators with fold expressions\
    \ except for: ~, ->, and [].\n\nIn the following example, the function foldSum\
    \ receives a parameter pack argument and returns the sum of all of it's arguments:\n\
    \n```\n#include <iostream>\n#include <string>\ntntemplate<class Ttype>\nauto sum(Ttype\
    \ ... args) {\n    auto sum = (... + args);\n    std::cout << \"sum = \" << sum\
    \ << std::endl;\n    return sum;\n}\n\nint main() {\n    sum(1, 5, 11, 18, 9);\n\
    }\n\n// output\nsum = 44\n```\n\n(... args) is called a fold expression, it applies\
    \ the + operator to all of the parameter pack arguments starting from the left.\n\
    \nThe parentheses around the fold expression is mandatory.\n\n# Using Fold Expressions\n\
    \nLet operator be some binary operator, then:"
