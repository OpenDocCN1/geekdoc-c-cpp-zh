    We can use qualifiers such as const and reference in a structured binding. For
    example, if we declare the following structured binding:


    ```

    auto& [bar1, bar2, bar3] = foo;

    ```


    then any change to foo will effect the variables bar1, bar2 and bar3 and vice
    versa.


    # Structured Bindings


    Structured bindings can be used with the public data members of classes, structs,
    raw-style arrays, and tuple objects:


    +   - In structs and classes each non-static public data member must be bound
    to exactly one unique variable.

    - For arrays, we must bind each array element to a unique variable.


    In all cases, the number of elements or non-static public data members must equal
    the number of scalar variables in the declaration of the structured binding. It
    is not permissible to skip a data member or use a scalar variable twice.


    ```

    int s[3] {1,2,3}

    auto [a, b, c] = s; // OK

    auto [x, y] = s; // Error: not enough scalar variables

    auto [x, y, x] = s; // Error: variable x is used twice

    ```'
