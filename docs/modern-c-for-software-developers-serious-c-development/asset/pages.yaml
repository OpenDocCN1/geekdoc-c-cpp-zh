    \ For this reason, it is best to use the inline attribute only for very small\
    \ functions. Furthermore, it is also a good idea to inline only those functions\
    \ that will have a significant impact on the performance of our program (they\
    \ are called frequently).\n\ninline is actually just a request and not a command\
    \ to the compiler. The compiler can choose to ignore it.\n\n# Defining Inline\
    \ Functions Within a Class\n\nClass member function can be declared implicitly\
    \ or explicitly as follows:\n\n```\n#include <iostream>\nclass Foo\n{\n    int\
