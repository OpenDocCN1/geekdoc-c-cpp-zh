  md: '# Modern C++: [[maybe_unused]] Attribute (C++17)


    Consider the function declaration: int ret = foo(int x, int y); where the parameter
    y never receives an argument value. Though this declaration is syntactically correct,
    the declaration is bad practise since it introduces ambiguity into the meaning
    of the function and the reason why y is included as a parameter in the declaration.


    However there may be cases where we expect y to receive a value only infrequently
    or in edge cases. For example y may receive a value in certain template specializations,
    in some conditional compilation cases, or due to the nature of the application
    domain.


    The attribute [[maybe_unused]] informs the compiler and the programmer that y
    will receive a value in certain infrequent cases.


    [[maybe_unused]] can be used to annotate the foo function as follows:


    ```

    ret = foo(int x, [[maybe_unused]] int y);

    ```'
