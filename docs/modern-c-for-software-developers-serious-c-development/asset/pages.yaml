    # General Theory Of Operation


    Firstly, we must decide on the type of container that we want to use. Each container
    type offers certain benefits and trade-offs. For example, a vector is a very good
    choice when a random-access, array-like object is required and not too many insertions
    or deletions will occur. A list has low-cost insertions and deletions but slower
    access speed than a vector.


    Once we have chosen a container, we can use it''s member functions to add elements
    to the container, access and modify elements, and delete elements.


    Except for the bitset container, a container will automatically grow as needed
    when elements are added to it and shrink when elements are removed.


    A common way to access elements within a container is through an iterator. The
    sequence and associative containers implement the member functions begin and end,
    which return iterators to the start and end of a container. These iterators are
    very useful for accessing the contents of a container. For example, in order to
    cycle through the elements of a container, we obtain an iterator to its beginning
    using the begin() function'
