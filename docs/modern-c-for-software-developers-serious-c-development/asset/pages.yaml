- pgno: 432
  md: '# Linkage


    Prior to C++20, C++ supported two types of linkage:


    +   - **Internal Linkage**: names with internal linkage are not accessible outside
    the translation unit.

    - **External Linkage**: Names with external linkage are accessible outside the
    translation unit.


    C++20 also implements **module linkage**. Names with module linkage are only accessible
    inside a module.


    # Header Units


    Header units are a technique to smoothly transition from headers to modules. We
    just have to replace the `#include` directive with the new `import` directive:


    ```

    #include <vector> -> import <vector>;

    #include "Header.h" -> import "myHeader.h";

    ```


    The compiler generates an import module from the header file.'
