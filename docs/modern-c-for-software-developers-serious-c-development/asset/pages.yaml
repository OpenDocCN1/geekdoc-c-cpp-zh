- pgno: 9
  md: 'exemplifies the raw power of C++.


    The overall development experience was very pleasant. The Drogon source code is
    easy to digest; it''s written by a master of Modern C++.


    TrueLawDocs including Cassandra is running on a seven dollar month VPS rented
    from a company In Sharjah.


    # Lessons Learned


    During my tenure contracting on Rails applications I rarely met developers who
    had broad experience with other programming languages. They typically only knew
    their framework. In a decade of contracting, I never met a Rails programmer who
    was reasonably proficient in C++.


    One of the reasons that dynamically typed web languages are popular is they are
    easy to learn. You can master Rails in less than three months. In contrast one
    cannot gain reasonable proficiency in C++ unless one has programmed in the language
    for about two years. The Modern C++ learning curve is very steep. Unfortunately,
    It''s unavoidable.


    Another factor is economics. Web applications built in dynamically typed languages
    rely on cheap labour. Fortune 500 companies use large inputs of foreign contractors
    and software quality testers to develop and maintain their applications. To my
    mind, this is a statement on the inadequacy of dynamically typed languages for
    web development. If these cheap resources were not available, the development
    model would shift to conserving expensive, high quality'
  merge: -1
  img_proc: true
- pgno: 10
  md: 'manpower.


    In terms of the debugging effort that was expended developing TrueLawDocs, I estimate
    that 75% of the effort involved debugging the Vue and Javascript front-end. C++
    provides superb debugging tools so debugging the back-end was a snap. Insofar
    as the back-end debugging infrastructure was concerned, I relied on the extensive
    use of Debug macros, ASAN (to detect memory errors), UBSAN and the GDB debugger.
    Sonlint was used check syntax.


    The development environment was Linux Mint (classic GNOME interface with 24 open
    virtual windows). The IDE was VisualCode. The compiler suite was GCC. Compiling
    and debugging was done in a terminal. A python script executed the compile-link-run-debug
    cycle. A terminal was always open to tail the debug output. The application generates
    a huge quantity of debug messages. Special attention was devoted to generating
    high quality debug output. This made tracing errors exceptionally easy. User acceptance
    testing was effected with Selenium.


    As you have surmised I walked away from Rails. It was a good decision. I have
    been playing around in the back of my mind with developing a C++ YouTube clone.
    Like Rails, I finally got sick of google’s censorship. Anyways, that’s the power
    of C++ for you.


    Thank you for your kind consideration.


    Karan Singh'
