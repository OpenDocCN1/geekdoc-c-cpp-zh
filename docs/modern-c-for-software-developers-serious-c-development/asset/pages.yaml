  md: "# Modern C++: [[nodiscard]] Attribute (C++17)\n\nAttributes allow us to express\
    \ additional constraints, give the compiler additional optimization possibilities\
    \ or give the developer additional information. We can use attributes on types,\
    \ variables, classes, functions, identifiers and lambdas.\n\nAn attribute is specified\
    \ by enclosing a keyword in a pair of brackets: [[ keyword ]]\n\nMultiple attributes\
    \ can be specified in any of the following ways:\n\n```\n[[attribute1]] [[attribute2]]\
    \ [[attribute3]]\nint func1();\n```\n\nor:\n\n```\n[[attribute1, attribute2, attribute3]]\n\
    int func2();\n```\n\n# The [[nodiscard attribute]]\n\nThe [[nodiscard]] attribute\
    \ informs the compiler that the return value of a function might not be ignored.\
    \ The compiler will issue a warning if the return value is not used subsequently.\n\
    \nHere is an example showing how [[nodiscard]] is used with a function implementation:\n\
    \n```\n[[nodiscard(\"return value of sqlAppend cannot be discarded\")]]\nsqlAppend()\
    \ {\n    return ret;\n}\n```\n\n**Note:** the custom error string is only supported\
    \ in C++20."
