  md: "# Modern C++: string_view (C++17)\n\nThe C++17 Standard Library implements\
    \ a new string class called std::string_view.\nThis class allows us to interact\
    \ with character sequences and strings without allocating memory for them. A string_view\
    \ object provides a view of some other character sequence or string. In particular\
    \ std::string_view object refers to a character sequence or string without owning\
    \ it.\n\nIn contrast to std::string, std::string_view objects have the following\
    \ properties:\n\n+   - The underlying character sequence or string is read-only.\n\
    - Character sequences are not guaranteed to be null terminated. That is, a string_view\
    \ of a character sequence may not be null terminated.\n- A string_view can be\
    \ a nullptr. nullptr returns by the data() member function when a string_view\
    \ is created with the default constructor.\n\nBecause there the possibility that\
    \ a string_view object does not have a null terminator, we must always use size()\
    \ before accessing characters through the [] operator or the data() member function.\
    \ The member function data() returns a pointer to the underlying string_view array.\n\
    \nHere is an example:\n\n```\n#include <iostream>\n#include <string>\n#include\
    \ <string_view>\n\nint main() {\n    std::string str(\"hello world\");\n    std::string_view\
    \ sv(str);\n\n    std::cout << sv << std::endl;\n    std::cout << sv[6] << std::endl;\n\
    }\n```"
