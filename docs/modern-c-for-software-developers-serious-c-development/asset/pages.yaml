  md: '# Modern C++: Deleted And Default Functions (C++11)


    # Compiler Generated Special Functions


    C++ classes have six types of special member functions:


    +   * Constructors

    * Copy constructors

    * Copy assignment operators

    * Move constructors

    * Move assignment operators

    * Destructors


    These special member functions are used to create, destroy, assign, copy and move
    class objects.


    The compiler will generate these special functions if they are needed and have
    not been already declared. These functions are declared as public and inline.


    # default Keyword


    C++ will automatically create default versions of these special functions if they
    are needed and have not been already defined.


    In C++11, the default and delete keywords give us explicit control over whether
    these special member functions are to be automatically created by the compiler
    or deleted.


    We can explicitly direct the compiler to create a default implementation for any
    one of these special functions. This can be more efficient than manually coding
    the function implementation by ourselves.'
