  md: '# C++ Sanitizers


    In this section we look at two sanitizers that are supported by GCC, the Address
    Sanitizer and the Undefined Behavior Sanitizer. The Address Sanitizer (Asan) detects
    memory errors while the Undefined Behavior Sanitizer (UBSan) detects some undefined
    behavior errors. Both sanitizers require the source code to be instrumented and
    the appropriate sanitizer library to be linked in. These sanitizers detect errors
    at run-time.


    **Note**: the chapter on smart pointers provides an extensive discussion of the
    types of memory errors that can occur.


    # The Address Sanitizer (Asan)


    The address sanitizer detects the following types of memory errors:


    +   - Failure to free a memory allocation (memory leak)

    - Using a pointer after it''s has been freed (dangling pointer)

    - Writing to a memory location not allocated to a pointer (memory corruption)

    - Deleting a pointer to memory more than once (double free)

    - using free twice to deallocate memory that has been allocated with new.


    Asan works by using shadow memory. Shadow memory is memory that tracks memory
    allocated or freed by a program.


    In order to use Asan, the source code must be instrumented for the sanitizer.
    That is, the appropriate compiler flag must be used and the address sanitizer
    library linked in.


    For GCC and CMAKE, the CMakeLists.txt file will have the following syntax:'
  merge: -1
  img_proc: true
- pgno: 557
  md: "```\ntarget_compile_options(${PROJECT_NAME}) PRIVATE -fno-omit-frame-pointer\n\
    -fsanitize=address\n-g3 )\n```\n\n```\ntarget_link_libraries(${PROJECT_NAME})\n\
    -fsanitize=address\n )\n```\n\nThe compiler flag g3 sets the amount of debugging\
    \ information (symbols) that the compiler will insert in the object file(s). g,\
    \ g1, g2 and g3 are permissible flag values. g3 produces the maximum amount of\
    \ debugging information.\n\n# Undefined Behavior Sanitizer (UBSan)\n\nThe Undefined\
    \ Behavior Sanitizer (UBSan) is a run-time sanitizer that tests whether an operation\
    \ has unknown semantics. Some examples of such operations are: divide by zero,\
    \ out of bounds access of an array, using a null pointer, integer overflow and\
    \ dangerous narrowing casts. The result of such an operation may cause a segmentation\
    \ error, return some garbage value or return a seemingly correct value. This type\
    \ of bug is hard to detect since it may cause a program to crash only sporadically.\n\
    \nUBSan uses a catalogue of predefined undefined error types that it uses to check\
    \ program expressions.\n\nFor GCC and CMake, we enable UBSan with the following\
    \ syntax in the CMakeLists.txt file:\n\n```\ntarget_compile_options(${PROJECT_NAME})\
    \ PRIVATE -fno-omit-frame-pointer\n-fsanitize=undefined\n-g3 )\n```\n\n```\ntarget_link_libraries(${PROJECT_NAME})\n\
    -fsanitize=undefined\n )\n```"
