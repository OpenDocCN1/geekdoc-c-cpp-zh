- pgno: 179
  md: 'A class that contains at least one pure virtual function is said to be an abstract
    class. Because an abstract class contains one or more functions for which there
    is no definition (that is, pure virtual functions), no objects of an abstract
    class can be instantiated.


    Although we cannot create objects of an abstract class, we can create pointers
    and references to an abstract class. This allows abstract classes to support run-time
    polymorphism, which relies upon base class pointers and references to select the
    proper virtual function.


    # Using Virtual Functions


    One of the fundamental principles of object-oriented programming is the principle
    of "one interface, multiple methods." This means that we can define an abstract
    class with pure virtual functions. This is the interface. Each derived class defines
    its own operations by implementing the interface.


    One of the most powerful and flexible ways to implement the "one interface, multiple
    methods" technique is to use virtual functions, abstract classes, and run-time
    polymorphism. Using these features, we can create a class hierarchy that moves
    from general to specific (base to derived). We define all the common features
    and the interface in the base class. In cases where certain actions can be only
    implemented by a derived class, we use pure virtual functions in the base class.
    We declare everything that relates to the general case in a base class. The derived
    classes fills in the specific details.


    # Implementing Class Interfaces in C++


    An interface is a collection of virtual member functions in a base class. A derived
    class must provide implementations of all the pure virtual functions in it''s
    base class.'
