  md: '# Modern C++: Modules (C++20)


    # Frailities In The Traditional Compilation Process


    An implementation file typically needs one or more header files before compilation
    can proceed. These header files contain the declaration of the functions used
    in the implementation file. The compiler pre-processes the implementation file
    by first including the header files specified in the implementation file (for
    example, #include <iostream>). After this, the compiler performs any macro substitutions
    specified directly or indirectly in the implementation file. This is a translation
    unit. This translation unit is then compiled by the compiler into an object file.


    There are a number of problems with this build process. Firstly, a header file
    can be included a multiple number of times since it can be included in more than
    one translation unit. Consider for example the header file iostream which contains
    over half million lines of code. It is redundant to include it in several translation
    units.


    Secondly problems may arise because of the one definition rule. This rule states
    that a variable or a function can be defined only once. If a variable or a function
    is defined differently in two header files, the inclusion of these header files
    during the compilation process is going to cause a compiler error.


    The third potential problem with header files is that two header files may define
    a macro differently. Macro substitutions are simply text substitutions that are
    performed at compile-time. The compiler will silently perform a macro substitution
    whenever it encounters a macro. The problem here is that if we have different
    definitions of a macro in two different translation units then this error will
    be masked by the macro substitutions that are performed. This is a difficult to
    trace error.


    Modules are designed to solve these problems. In particular, modules enable:'
  merge: -1
  img_proc: true
- pgno: 426
  md: "+   - faster compilation times by preventing repeated inclusion of include\
    \ files\n\n+   - isolation from preprocessor macros\n\n+   - prevention of violations\
    \ of the one definition rule.\n\nModules are imported only once and the order\
    \ in which they are imported does not\nmatter.\n\n# The Structure Of A Module\
    \ File\n\nA module file has the following canonical structure:\n\n```\nmodule;\
    \ // declare a global module fragment\n// header files required by the module\n\
    #include <numeric>\n#include <vector>\n\nexport module math; // module declaration\n\
    // import <other modules>\n\n// non-exported declarations:\n// names that are\
    \ only visible inside the module\n\n// exported functions\nexport int add(int\
    \ first, int second) {\n    return first + second;\n}\n\nexport int multiply(int\
    \ first, int second) {\n    return first*second;\n}\n```\n\nThe global module\
    \ fragment starting with the keyword module is optional. Header files\nshould\
    \ be included between it and the module declaration."
