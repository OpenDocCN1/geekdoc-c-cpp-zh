  md: "# Modern C++: Designated Initialization (C++20)\n\nAggregate objects do not\
    \ have constructors. This means that the initialization of an aggregate object\
    \ must be effected by other means.\n\nDesignated initialization is a special case\
    \ of aggregate initialization. Designated initialization implements the initialization\
    \ of the data members of an aggregate using their names. Here is an example:\n\
    \n```\n#include <iostream>\nstruct Point2D\n{\n    int x;\n    int y;\n}\nint\
