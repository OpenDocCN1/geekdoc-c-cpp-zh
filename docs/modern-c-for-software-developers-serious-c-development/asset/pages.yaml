  md: "# C++ Standard Library: std::thread\n\nC++11 implements a threading library\
    \ through #include <thread>. When a program begins execution, the operating system\
    \ executes the program in the program's own process space. The basic idea behind\
    \ threads is to sub-divide a process into a number of independently executing\
    \ threads. The purpose is to improve the performance of the program by executing\
    \ multiple threads concurrently.\n\nBy default when a C++ program begins execution,\
    \ it starts in a default thread main. If the program does not create any threads\
    \ then it runs entirely in the main thread. The program is said to be a single\
    \ threaded application.\n\n# Basic Thread Creation\n\nThe following program uses\
    \ two threads to compute the number of odd and even numbers in a range:\n\n```\n\
    #include <iostream>\n#include <thread>\n\nsize_t oddsum = 0;\nsize_t evensum =\
    \ 0;\n\nvoid even_sum(int start, int stop) {\n    for (int i = start; i < stop;\
    \ i++)\n        if (i%2 == 0 ) evensum += i;\n}\nvoid odd_sum(int start, int stop)\
    \ {\n    for (int i = start; i < stop; i++)\n        if (i%2 != 0 ) oddsum +=\
    \ i;\n}\n\nint main() {\n    size_t start = 1000;\n    size_t stop = 90678124;\n\
    \n    // create thread objects t1 and t2\n    std::thread t1(even_sum, start,\
    \ stop);\n    std::thread t2(odd_sum, start, stop);\n```"
