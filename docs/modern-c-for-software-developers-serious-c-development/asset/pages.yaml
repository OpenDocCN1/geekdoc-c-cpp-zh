  md: "# Returning From A Coroutine\n\nco_return statements have two forms. A co_return\
    \ statement can return value or it can return a value of some arbitrary type.\
    \ In both cases the co_return statement is specified as:\n\n```\nco_return;\n\
    ```\n\nHowever a corresponding special function has to be defined to handle each\
    \ co_return case. For the case where the co_return statement does not return a\
    \ value, this special function is declared in the promise_type struct as:\n\n\
    ```\nvoid return_void();\n```\n\nThe body of this function can be empty or implement\
    \ some clean-up code.\n\nIn the example below, we implement a co_routine that\
    \ simply prints hello world and then exits:\n\n```\n#include <coroutine>\n#include\
    \ <iostream>\n\nstruct ReturnObject {\n    struct promise_type = default;\n  \
    \  ReturnObject get_return_object() { return {}; }; };\n    std::suspend_never\
    \ initial_suspend() { return {}; };\n    std::suspend_never final_suspend() noexcept\
    \ { return {}; };\n    void unhandled_exception() { };\n\n    void return_void()\
    \ {}\n}\n```\n\n```\n// declaration of coroutine foo\nstruct ReturnObject foo()\
    \ {\n    std::cout << \"hello world\" << std::endl;\n    co_return;\n```"
