    # Setting A Breakpoint


    The command break [function name] pauses a running program during execution it
    reaches the named function. The following syntactical forms are available for
    the break command:


    +   * gdb b

    * gdb> break [function name]

    * gdb break [file name]:[line number]

    * gdb break [line number]

    * gdb break *[address]

    * gdb> break **any of the above arguments*** if [condition]


    For example, if square(int x) is a function, we can do:


    ```

    $ gdb break square if x == 5

    ```'
