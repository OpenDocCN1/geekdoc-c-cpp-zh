  md: '# C Language: Memory Allocation


    C uses the malloc() function to allocate memory. malloc() takes the number of
    bytes to allocate as it''s only parameter, and returns a void pointer to a contiguous
    block of newly allocated memory. The pointer to a void type can be cast to any
    other type. malloc() returns NULL if memory cannot be allocated. malloc does not
    initialize the newly allocated memory.


    After we have finished using the memory, we de-allocate the memory with free().
    Here is an example:


    ```

    #include <stdlib.h>

    //implicit type conversion from void* to int*

    int *p = malloc(sizeof(int));

    *p = 12;


    printf("\d\n", *p);

    free(p);

    ```


    calloc() is similar to malloc(). It takes the size of one element and the number
    of elements to allocate. calloc() initializes the allocated memory to ascii null
    bytes ("\0").


    ```

    #include <stdlib.h>

    int *p = calloc(sizeof(int), 10);

    ...

    free(p);

    ```


    realloc() function can be used to shrink or grow already allocated memory. realloc
    takes a pointer to already allocated memory and the size of the new memory allocation.
    It then grows or shrinks memory, and returns a void pointer to it.'
