    # Creating Initialized And Uninitialized Arrays


    A special case occurs if we want to create both initialized and uninitialized
    arrays of objects. Consider the following class.


    ```

    class Foo

    {

    int i;

    public:

    Foo(int j) { i=j }

    int get() { return i; }

    };

    ```


    The array declaration for Foo: Foo ar[9]; will fail because each object in the
    array must be instantiated by invoking the constructor and Foo does not have an
    appropriate constructor. Compilation will succeed only if Foo also has a constructor
    with no parameters.


    We can specify any array that handles initialized and uninitialized objects by
    overloading the Foo constructor:


    ```

    class Foo

    {

    int i;

    public:

    // constructor for non-initialized arrays

    Foo() { i = 0; }


    // constructor for initialized arrays

    Foo(int j) { i = j; }

    int get_i() { return i; }

    ```'
