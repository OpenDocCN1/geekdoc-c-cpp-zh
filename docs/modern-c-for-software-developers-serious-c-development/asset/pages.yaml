- pgno: 35
  md: '# C Language: Pointers


    A pointer is a variable that stores the address of some other variable. The syntax
    for a pointer variable declaration is:


    ```

    int *ptr;

    ```


    This states that *ptr* is a pointer variable and it''s value is the address of
    a variable of *int* type. Note that this is a declaration only and *ptr* has not
    been initialized (so *ptr* will contain some garbage value). Suppose that we have:


    ```

    int x = 5;

    ```


    Then the address of *x* (the memory address where the value of *x* is stored)
    is:


    ```

    &x

    ```


    The **address operator &** gets the address of the variable *x*.


    We can initialize *ptr* (point *ptr* to *x*) as follows:


    ```

    ptr = &x;

    ```


    Now *ptr* contains the address of *x*. We can obtain the value at the address
    pointed to by *ptr* as follows:


    ```

    int value = *ptr;

    ```


    This is referred to dereferencing the pointer. * is the **dereferencing operator**
    gets the value at the location *ptr* points to.'
  merge: -1
  img_proc: true
- pgno: 36
  md: '# Pointer Arithmetic


    Pointer variables can be incremented and decremented. An increment sets the value
    of

    pointer variable to a location that is size of (the data type pointed to) bytes
    ahead of

    the current value of the pointer.


    In our example, pointer is pointing to an int type which is 4 bytes long, so ++ptr
    points

    to the location four bytes ahead of the current location pointed to. Similarly
    with the

    decrement operator. Ordinary addition and subtraction work similarly.


    # Multiple Indirection With Pointers: Pointer To Pointer (**ptr)


    A pointer to a pointer is a form of multiple indirection. A pointer contains the
    address of

    a variable. When we define a variable that is a pointer to a pointer, the variable
    points to

    an address that contains the address of a pointer variable. The second pointer
    points to

    the location that contains the actual value. This can be shown as:


    | Pointer | Pointer | Variable |

    |---|---|---|

    | Address | Address | Value |


    A variable that is a pointer to a pointer must be declared as such. This is done
    by placing

    an additional asterisk in front of the name of the double pointer:


    ```

    int x **ptr;

    ```


