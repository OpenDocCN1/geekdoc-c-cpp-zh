  md: '# Modern C++: Template Type Deduction (C++17)


    # Template Argument Type Deduction For Functions


    Template argument type deduction refers to the compiler''s ability to deduce the
    types of the arguments of a function template specialization.


    In C++ argument type deduction for template functions is implemented as follows.
    Consider the following function template declaration:


    ```

    template<typename T>

    void foo(const T& data) { statements };

    ```


    We can create specializations from this template function as follows:


    ```

    // The first specialization defines a foo function that

    // takes an integer argument and then invokes the function

    foo<int> foo(5) { statements }

    foo<std::string> foo("a string") { ... }

    ```


    The value in the angle brackets instantiates a particular type of foo function.


    However sometimes the compiler can deduce the types of the arguments in a particular
    function template specialization from the arguments received by the function.
    In this case we simply declare the two foo function specializations above as follows:


    ```

    Foo(5) { ... }

    foo("a string") { ... }

    ```


    This works as long as the compiler can deduce the types used by a specialization.'
