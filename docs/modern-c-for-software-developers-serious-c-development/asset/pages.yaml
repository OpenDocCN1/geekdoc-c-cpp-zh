  md: '# C Language: const


    const is a storage specifier that signifies a variable cannot be modified. Here
    is an example:


    ```

    const int x = 9;

    ```


    x is an integer type variable those value cannot be changed. It is a read-only
    variable. Consider the following statement:


    ```

    const int* p;

    ```


    This means that p is a pointer to an integer and the integer value cannot be changed.
    Thus if *p = 5, then incrementing the pointer, ++p, is valid the statement: *p
    = 11; will not compile.


    Consider the following statement:


    ```

    int x* const p;

    ```


    This states that the pointer p is a constant those value (the location it points
    to) cannot be changed. Thus the statement ++p will not compile.


    Consider:


    ```

    const int* const p;

    ```


    Here the pointer p is a const and thus it cannot be incremented or decremented.
    Furthermore the value pointed to cannot be changed.'
