  md: '# Modern C++ Template Constants (C++14)


    As we have seen, C++ allows template declarations for functions and classes. C++14
    also allows template declarations for constants.


    We can declare a template constant as follows:


    ```

    template<class T>

    T(constant)

    ```


    The expression T(...) has the same syntax and semantics as a C function-style
    cast (see function-style casts).


    Here is an example:


    ```

    template<class T>

    T pi = T(3.1415926535897932385);

    ```


    pi is a template constant.


    A particular template value of pi is defined as: pi<int>, pi<float>, pi<double>
    and so forth.


    If T is an integer then the value of pi is 3. If T is a float then the value of
    pi is 3.141592 and T is a double, then it''s value is: 3.14159265358979. The type
    T is used to perform a type cast on a constant.


    ```

    #include <iostream>

    template<class T>

    T pi = T(3.1415926535897932385);


    int main() {

    std::cout << pi<int> << std::endl;

    std::cout << pi<float> << std::endl;

    std::cout << pi<double> << std::endl;

    }

    ```'
