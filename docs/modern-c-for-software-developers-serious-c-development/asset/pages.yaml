    # Memory Semantics


    The problem with freeing memory is that objects can have ambiguous memory management
    semantics. Consider:


    ```

    Sandwich* ptrSandwich = makeASandwich();

    ```


    The function makeASandwich returns a pointer to a Sandwich object allocated on
    the heap. If ptrSandwich is passed to some other function, then who should be
    responsible for deleting ptrSandwich, the caller or the called function? If the
    caller neglects to delete the pointer and no other caller deletes the pointer
    then there is a memory leak. If the caller deletes ptrSandwich and some other
    function deletes the pointer, then the program has undefined behaviour. If ptrSandwich
    is deleted and subsequently some function uses this pointer, then the program
    will also have undefined behavior.


    # RAII


    Smart pointers are a solution to dangling pointers and UAF errors.


    RAII means Resource Allocation Is Initialization. The principle of RAII is simple:
    we wrap an object around a resource allocated on the heap and the resource in
    the object''s destructor. The object exists on the stack and is thus deleted automatically
    when the object goes out of scope. C++ guarantees that an object''s destructor
    will be called when an object on the stack is destroyed. This is exactly how smart
    pointers work.


    Lets consider specifying a smart pointer class that wraps a raw pointer of type
    T. A smart pointer class for T can be defined as follows:


    ```

