    # Constrain auto With Concepts


    We have already seen an example of this previously. We constrain an auto type
    by prefacing the auto declaration with the name of the concept. For example:


    ```

    std::unsigned_integral auto foo {1};

    ```


    This syntax can be used anywhere where auto can be used, including lambdas.


    In the example above the type of foo is constrained to an unsigned integral type.
    Since foo is initialized to 1, which by default is a signed int, the compiler
    will throw an error for this declaration.'
