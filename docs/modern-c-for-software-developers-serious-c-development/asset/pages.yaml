  md: "# Module Partitions\n\nA large module can be partitioned. Each partition consists\
    \ of a module interface unit (the partition interface file) and zero or more module\
    \ implementation units. The following example shows how module partitioning is\
    \ implemented:\n\n```\n// mathPartition.ixx - primary interface module\nexport\
    \ module math;      // module declaration\nexport import :math1;\nexport import\
    \ :math2;\n```\n\nThe math module imports symbols from math1 and math2 and re-exports\
    \ these symbols as it's own symbols (notice the colons).\n\nThe implementation\
    \ files are:\n\n```\n// mathPartition1.ixx\nexport module math:math1;\nexport\
    \ int add(int first, int seconds) {\n    return first + seconds;\n}\n```\n\nThe\
    \ statement export module math:math1 exports the symbols of the math1 partition\
    \ to the math module. For the second partition, we have:\n\n```\n// mathPartition2.ixx\n\
    export module math:math2;\nexport {\n    int multiply(int hour, int seconds) {\n\
    \        return hour * 3600 + seconds;\n    }\n}\n```"
