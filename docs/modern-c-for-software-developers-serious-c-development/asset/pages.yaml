  md: '# C++ Classes


    Encapsulation binds data to the program code that manipulates it. Encapsulation
    controls access to both the data and the code that manipulates it. This prevents
    the misuse of the data as well as the code. In an object-oriented language such
    as C++, code and data are combined to create a self-contained "black box". This
    black box is a C++ class.


    In C++ encapsulation is implemented through classes.


    In C++, classes behave like types and are in fact user defined abstract types.
    And just like the built-in C++ types such as int and float, objects can be created
    from abstract data types.


    Classes are created using the keyword class. A class declaration declares a new
    type that encapsulates code and data. A class is a logical abstraction. A physical
    representation of a class is called an object or an instance of a class. The act
    of creating an object from a class is called instantiating the class.


    A class has the following syntax:


    ```

