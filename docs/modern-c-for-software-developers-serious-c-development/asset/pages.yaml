  md: "# C++ Function Overloading\n\nFunction overloading is an example of compile-time\
    \ polymorphism. Function overloading is the process of using the same function\
    \ name for two or more functions. In function overloading, each redefinition of\
    \ a function uses different types of function parameters or a different number\
    \ of parameters. These differences enables the compiler to know which function\
    \ to call in any given situation.\n\nHere is an example:\n\n```\n#include <iostream>\n\
    using namespace std;\n\n// forward declarations\n// these functions differ in\
    \ the types of the parameters\nint myfunc(int i);\ndouble myfunc(double i);\n\n\
    int main() {\n    cout << myfunc(int i) << \" \"; // calls myfunc(int i)\n   \
    \ cout << myfunc(5.4); // calls myfunc(double i)\n    return 0;\n}\n\ndouble myfunc(double\
    \ i) {\n    return i;\n}\n\nint myfunc(int i) {\n    return i;\n}\n\n// output\n\
    10 5.4\n```\n\nTwo functions that differ only in their return types cannot be\
    \ overloaded."
