- pgno: 423
  md: '# Constrain A Template Parameter Type To Types With Certain Properties


    A requirements expression can be used to verify that a type has a required property.
    For example:


    ```

    template <typename T>

    concept is_vectorizable = requires { typename std::vector<T>; };

    ```


    This concept only permits specializations where type T is a vector type:


    Here is a complete function template specification using the vectorizable concept:


    ```

    Template <typename T>

    concept is_vectorizable = requires { typename std::vector<T>; }

    std::vector vector_add(is_vectorizable a, is_vectorizable b) { };

    ```


    # Constrain Template Parameters To Boolean Expressions That Evaluate To True


    It is possible to evaluate boolean expressions inside a requires clause. The following
    syntax is used for evaluating logical expressions:


    ```

    requires { boolean_expression };

    ```


    As an example, consider a concept that checks if the size of the template parameter
    T is equal to 4 bytes. The syntax for this is:


    ```

    template <typename T>

    concept C1 = requires {sizeof(T) == 4; };

    ```


    or we can also write:


    ```

    template <typename T>

    concept C1 = ( sizeof(T) == 4 );

    ```'
