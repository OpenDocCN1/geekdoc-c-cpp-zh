    # Char Literals


    A char literal is a single character enclosed by single quotes. An error will
    be thrown if there is more than one character enclosed by single quotes.


    A char literal has type char:


    ```

    char chr = ''G'';

    wchar_t chr = L''A''; // wchar_t (wide)

    ```


    # String Literals


    A string literal is a sequence of characters enclosed in double quotation marks.


    ```

    char* s0 = "hello world"; // char*

    char* s1 = u8"hello world"; // char*, encoded as UTF-8

    char_t* s2 = L"hello world"; // char*, encoded as wchar_t

    ```


    # Literal Prefixes And Suffixes


    In C, a literal如图 have a prefix and a suffix. A prefix to an integral literal
    indicates the base of the number. The suffix indicates the type of the integer.
    For example, in 0xDEAD, 0x implies that DEAD is a hexadecimal integer (base 16).'
