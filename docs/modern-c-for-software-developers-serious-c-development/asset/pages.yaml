    Now changes made to the `trunk.h` file do not effect `elephant.h`.


    Therefore to prevent triggering lengthy recompilation of implementation files,
    we should favor forward declarations.


    # Include Guards


    A global variable can only be defined once. Because of this, including the same
    header file in a translation unit more than once will generate a compiler error
    when a global variable is defined more than once.


    A common way to prevent multiple include errors is to use an include guard is
    created by enclosing the whole header file in an #ifndef section that checks for
    the existence of a macro that is specific to the header file only. If the macro
    is not defined in the translation unit, the header file is included in the translation
    unit. If the macro has already been defined in the translation unit, it is not
    included. This ensures that a header file is included only once in a translation
    unit.


    Here is an example of the use of an include guard in a header file:


    ```

    // store.h

    #ifndef __STORAGE_HEADER__

    ```'
