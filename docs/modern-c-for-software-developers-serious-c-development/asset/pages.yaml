    \ is a std::ratio type. The tick period specifies the number of ticks in a second.\
    \ The default period is ratio<1,1> one tick per second (represented as ratio<1>).\
    \ A period such as ratio<1,1000> means that there are thousand ticks in a second\
    \ so one tick is a millisecond. A period of ratio<1,1000000> means that there\
    \ are a million ticks in a second, so one tick is a microsecond. A period of ratio<3600,1>\
