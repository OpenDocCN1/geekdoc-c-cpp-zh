  md: '# Modern C++: Type Alias (C++11)


    # Typedef


    A C or C++ typedef declaration introduces a name that, within its scope, becomes
    a synonym for an existing type. The syntax is:


    ```

    typedef [existing-type] [our-alias];

    ```


    And here is an example:


    ```

    // Declare UL as a synonym for the unsigned long type.

    typef unsigned long UL;

    UL x = 5;

    ```


    # Type Alias Declarations With The using Keyword (using =)


    We have previously seen that we can bring a namespace into scope with the using
    keyword:


    ```

    using namespace std;

    ```


    In C++11, we can also utilize the using keyword to declare that a name is an alias
    for a previously declared type. The syntax is:


    ```

    using new_type_name = some_declared_type;

    ```


    The new type name is a synonym for the existing type within the new type''s scope.'
