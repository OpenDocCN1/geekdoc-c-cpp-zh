    causes storage to be allocated for the variable. In most cases, variable declarations
    and definitions are combined together (e.g. int x = 5). However when we precede
    a variable declaration with the *extern* specifier, we inform the compiler that
    the variable is declared in some other file.


    One prominent use of *extern* is to declare all of the global variables in one
    file and use *extern* declarations in other files to access these variables.


    Example:


    File 1


    File 2'
