- pgno: 441
  md: '# Modern C++: Coroutines (C++20)


    # Introduction


    Coroutines are a major language feature in C++20. They are very useful in the
    implementation of applications that process asynchronous events. A coroutine is
    a function that can be suspended and optionally resumed at some later point in
    time. This can be done a multiple number of times.


    An ordinary function cannot suspend it''s operation and be resumed at some later
    point in time. Once an ordinary function starts execution, it will continue execution
    until a return statement or the closing brace of the function is encountered.


    The C++ standard requires that a coroutine function must use at least one of the
    following:


    +   - co_await operator,

    - co_yield keyword,

    - co_return keyword


    The main additional restriction is that a coroutine function cannot use the return
    statement but instead use a co_return statement to return from the function. A
    function that abides by these restrictions will be automatically compiled as a
    coroutine by the C++ compiler. Note that a coroutine is not required to have a
    co_return statement. There are some additional restrictions which we will discuss
    later.


    For more information see: https://en.cppreference.com/w/cpp/language/coroutines'
  merge: -1
  img_proc: true
- pgno: 442
  md: "# Why Is co_return Used Instead Of Return?\n\nThe stack is not used in a call\
    \ or return from a coroutine function. Instead the state of the function is stored\
    \ on the heap.\n\nConsiderable simplification is obtained when coroutines do not\
    \ maintain their state on the stack. Consider the scenario where a number of coroutines\
    \ suspend themselves in sequence. These suspended coroutines can resume in any\
    \ order and not necessarily in the order of their suspension. Since coroutines\
    \ do not pass parameters on the stack, the complexities of maintaining the stack\
    \ when these coroutines resume in any order are entirely avoided. Thus coroutines\
    \ can be described as stackless functions.\n\n# Coroutine Return Objects\n\nA\
    \ coroutine must return an object that has a specific well-defined structure and\
    \ semantics. Consider the following declaration of the simplest object that a\
    \ coroutine can return:\n\n```\nstruct ReturnObject {\n    struct promise_type\
    \ {\n        promise_type() = default;\n        ReturnObject get_return_object()\
    \ { return {}; };\n        std::suspend_never initial_suspend() { return {}; };\n\
    \        std::suspend_always final_suspend() noexcept { return {}; };\n      \
    \  void unhandled_exception() { };\n        void return_void(void) { };\n    };\n\
    };\n```\n\nReturnObject can be a class or a struct. Similarly promise_type can\
    \ be a class or struct. The name promise_type must be spelled exactly as indicated.\
    \ promise_type is not related to std::async, std::future or std::promise. A promise_type\
    \ object is simply an object that controls the behavior of the coroutine."
  merge: -1
  img_proc: true
- pgno: 443
  md: 'The name ReturnObject is not special, it is simply the name of the class or
    struct that has the special syntax and semantics described above. It could be
    named Task or Job, for example.


    The promise_type struct (or class) must have a constructor. In the declaration
    above, we are using the default constructor.


    The promise_type object declares and defines the get_return_object method. The
    compiler automatically calls this method after the promise_type struct has been
    instantiated. This method instantiates and returns an object of type ReturnObject
    that contains the promise_type object. In our example, this instantiates ReturnObject
    using the default constructor (because of return {});


    Then there is a method initial_suspend that returns an awaiter object and a method
    called final_suspend that also returns an awaiter object. Both of these objects
    are instantiated using their default constructors. final_suspend cannot throw
    an exception and thus must be declared with the noexcept attribute.


    The C++ Standard Library provides us with two ready to use awaiter objects:


    +   * std::suspend_always: instructs the C++ runtime to suspend the coroutine

    * std::suspend_never: instructs the C++ runtime to not suspend the coroutine


    We will examine the method return_void(void) shortly.


    The final method in promise_type is the function unhandled_exception. It specifies
    the code that is to be executed if the coroutine throws an exception. The body
    of this function will be empty if we do not want to handle exceptions.'
