    # Algorithms


    Algorithms act upon containers. Although each container provides support for its
    own basic operations, the standard algorithms implement complex actions. They
    also allow us to work with two different types of containers simultaneously. To
    use STL algorithms, we must include the header file algorithm in the program.


    All of the algorithms are function templates. They can be applied to any type
    of container.


    There are a large number of STL algorithms, a few interesting ones are:


    | binary_search | Performs a binary search on an ordered sequence. |

    | count_if | Returns the number of elements that satisfy a predicate. |

    | find | Searches a range for a value and returns an iterator to the first occurrence
    of the element. |

    | find_if | Searches a range for an element which for a user-defined unary predicate
    returns true. |

    | make_heap | Constructs a heap from a sequence. |'
