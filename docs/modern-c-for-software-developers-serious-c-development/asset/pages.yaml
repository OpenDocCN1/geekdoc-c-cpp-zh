- pgno: 66
  md: '# The #define Directive


    The #define directive specifies an identifier and a character sequence (i.e.,
    a set of characters). The character sequence will be substituted for the identifier
    each time the identifier is encountered in a source file. A #define statement
    is called a macro.


    The identifier is called a macro name and the replacement characters are called
    the macro replacement. The general form of this directive is:


    ```

    #define macro-name char-sequence

    ```


    Notice that there is no semicolon at the end of this statement. There may be any
    number of spaces between the macro name and the character sequence, but once the
    character sequence begins, it is terminated only by a newline.


    If we wish to use the value 0 for the word LEFT and the value 1 for the word RIGHT,
    we can declare these two #define directives:


    ```

    #define LEFT 0

    #define RIGHT 1

    ```


    This causes the preprocessor to substitute a 0 or a 1 each time LEFT or RIGHT
    macro name is encountered in the source file.


    Once a macro name has been defined, it may be used in the definition of other
    macro names. For example:


    ```

    #define ONE 1

    #define TWO ONE + ONE

    ```'
