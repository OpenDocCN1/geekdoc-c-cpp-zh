    \ foo(5);\n}\n\n// output\npositive number received: 5\n```\n\nIn this example,\
    \ the variables a and s are stored on the stack. The fundamental rule of stack\
    \ variables is: objects allocated on the stack are automatically destroyed when\
    \ they go out of scope.\n\nIn C++, a scope is defined by a pair of brackets {\
    \ and } provided that these brackets are not used for variable initialization.\
    \ Thus:\n\n```\nstd::vector<int> v = {1, 2, 3}; // this is not a scope\n```"
