- pgno: 458
  md: '# Header Management And Include Guards


    # Why Does C And C++ Require Header Files


    In C and C++, identifiers in a program such as variables, function names, class
    names, and so on must be declared before they can be used.


    For example, we can''t just write foo = 42 without first declaring foo:


    ```

    int foo;

    ```


    This declaration tells the compiler whether the element is an int, double, a function,
    a class or some other thing. Besides providing a name for the identifier, the
    declaration informs the compiler about the amount of memory that the identifier
    requires.


    Every identifier used in an implementation file must be declared (directly or
    indirectly) in a header file. When we compile a program, every implementation
    file is compiled independently after a translation unit is generated from the
    file. The compiler has no knowledge about what identifiers have been declared
    in other translation units. This means that if we use a class or function or global
    variable, we must provide a declaration of that thing in each .cpp file that it
    uses. Each declaration of an identifier will be exactly the same in all of these
    files. A slight inconsistency in these declarations of an identifier will cause
    errors, or unintended behaviour, when the linker attempts to merge all of the
    object files into a single executable program.


    To minimize the potential for such declaration errors, C and C++ have adopted
    the convention of using header files to contain declarations. We make declarations
    in a header file, and then use the #include directive in every implementation
    file (.cpp file) or other header file that requires the declaration. The #include
    directive inserts a copy of the header file directly into the .cpp file (or other
    header file) prior to compilation.'
  merge: -1
  img_proc: true
- pgno: 459
  md: 'C and C++ also use forward declarations. A forward declaration tells the compiler
    that a variable, function, struct or class is in some other header file.


    # Effective Header Management


    The problem with the C++ compilation model is as follows. We make tiny, innocuous
    change in a header file and then 200 implementation files that include this header
    file have to be recompiled. This consumes a lot of time. In addition, we can have
    circular dependencies in header files. Header A includes header B, which includes
    header C. Header C includes header A.


    How can we effectively manage header files and header dependencies in order to
    make our build times quicker?


    The first rule is that an implementation file should only include the header files
    that it actually needs.


    # Forward Declarations


    The second rule is to use forward declarations in preference to including header
    files whenever possible.


    Forward declarations introduce an identifier to the compiler. In certain cases,
    an identifier is all that is required, we do not need to include the header file
    containing the declaration of the identifier. The compiler only needs to know
    that a specific identifier is declared in some other header file. Details about
    the how much memory it requires or what methods it has, are generally not relevant
    to the identifier is actually used in an implementation.


    A forward declaration to an identifier will be sufficient when the include implementation
    file only uses a pointer to the identifier and this file does not need to'
