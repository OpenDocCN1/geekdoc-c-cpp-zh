  md: '# Creating Static And Shared Libraries


    # Static And Shared Libraries


    A library is a collection of pre-compiled object files that can be linked into
    a program by a linker.


    There are two types of libraries: *static libraries* and *shared libraries.*


    A static library has the file extension ".a" (archive file) in Unix. When a program
    is linked against a static library, the machine code of the library functions
    that are used by the program is copied into the executable program.


    A shared library has the file extension ".so" (shared object) in Unix. When a
    program is linked against a shared library, only a small table is created in the
    executable. Before the executable starts running, the operating system loads the
    machine code of the external library functions that are used by the program. This
    process is known as dynamic linking. Dynamic linking makes executable files smaller
    and saves disk space, because only one copy of a library is shared by multiple
    programs. Furthermore, most operating systems allow only one copy of a shared
    library in memory to be used by all running programs, thus, conserving memory.
    The shared library can be upgraded without the need to recompile the main program.


    One major advantage of static libraries is speed. There is no dynamic querying
    of symbols in static libraries.


    # Header File And Library Location


    While compiling a program, the compiler needs the header files to compile the
    source code.'
