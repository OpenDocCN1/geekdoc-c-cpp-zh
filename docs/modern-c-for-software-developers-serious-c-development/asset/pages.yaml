    of the class. Since a friend function is not a member of the class, it does not
    have this pointer. Due to this, an overloaded friend operator has to be passed
    it''s operands explicitly. This means that a friend function overloads a binary
    operator must have two parameters, and a friend function that overloads a unary
    operator must have one parameter.


