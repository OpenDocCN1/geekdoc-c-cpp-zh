    ```


    C++11 introduced a general syntax for initialization with initializer lists, often
    referred to braced list initialization. There are two types of braced list initialization:


    +   - direct list initialization: T object {arg1, arg2, ...}

    - copy list initialization: T object = {arg1, arg2, ...}


    Under C++17, type deduction for brace-initialized auto variables follow the rules
    for type deduction:


    +   - for direct list initialization, the compiler will deduce a type T for the
    auto type variable if the initialization list has a single element of type T.
    It will be illformed if there is more than one element in the initialization list.

    - for copy list initialization, the compiler will deduce the type of the auto
    variable'
