    * we cannot change the number of operands that an operator takes.

    * except for the function call operator (), operator functions cannot have default
    arguments.


    # Operator Inheritance


    Except for the assignment operator =, operator functions can be inherited by derived
    classes. A derived class can overload an inherited operator.


    # Operator Overloading Using a Friend Function


