    \ directives. At the outset of the compilation process, the C/C++ preprocessor\
    \ processes directives in the source files. These directives guide the compiler\
    \ during the compilation process.\n\nThe C++ preprocessor is virtually identical\
    \ to the one defined by C. The main difference between C and C++ in this regard\
    \ is the degree to which each relies upon the preprocessor. In C, each preprocessor\
    \ directive is necessary. In C++, some directives have been rendered redundant\
    \ by newer and better C++ language constructs. In fact, one of the long-term design\
    \ goals of C++ is the elimination of the preprocessor altogether.\n\nThe preprocessor\
    \ recognizes the following directives:\n\n| #if | #elif | #else | #endif |\n|\
    \ #error | #define | #ifdef | #ifndef |\n| #include | #line | #pragma | #undef\
    \ |\n\n# Preprocessor Syntax\n\nAll preprocessor directives begin with a # sign.\
    \ In addition, each preprocessor directive must be on its own line. If a directive\
    \ is to continue onto the next line then the directive must terminate each line\
