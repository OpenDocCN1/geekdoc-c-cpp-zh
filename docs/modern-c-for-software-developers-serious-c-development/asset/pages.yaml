  md: '# GCC Environment Variables


    +   - PATH: search paths for executables and run-time shared libraries (.so).


    +   - CPATH: search paths for include files. It is searched after paths specified
    in -I<dir> options.


    C_INCLUDE_PATH and CPLUS_INCLUDE_PATH can be used to specify search paths for
    header files in the C or C++ languages.


    +   - LIBRARY_PATH: search paths for libraries. It is searched after paths specified
    in -L<dir> options.


    # Finding A Shared Library


    On Unix systems, GCC first searches for libraries in /usr/local/lib, then in /usr/lib.
    Following that, it searches for libraries in the directories specified by the
    -L parameter, in the order specified on the command line. The GCC loader (ld)
    also looks for shared library files in these standard locations.


    If we install a shared library in a standard location, make sure that the file
    permissions are correct. For example:


    ```

    $ chmod 0755 /usr/lib/libfoo.so

    ```


    # Setting The Shared Library Location With rpath


    rpath, or the run path, is a way of embedding the location of shared libraries
    in the executable itself, instead of relying on default locations or environment
    variables. We do this during the linking stage.


    ```

    gcc -Lhome/username/foo -Wl,-rpath=/home/username/foo -Wall -o test main.c -lfoo

    ```'
