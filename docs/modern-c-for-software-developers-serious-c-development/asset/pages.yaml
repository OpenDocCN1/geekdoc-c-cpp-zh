  md: '# Modern C++ Variadic Templates (C++11)


    Before C++11, templates were required to have a fixed number of parameters. C++11
    permits templates to have a variable number of parameters. These types of templates
    are called variadic templates.


    In order to implement a variable number of parameters in a template, we define
    a parameter pack in the template definition, and expand the parameter pack when
    a template is specialized.


    A parameter pack is defined with an ellipsis (...) after the class or typename
    keyword in a template declaration. There can be spaces before and after the ellipsis:


    ```

    template <typename... Args>

    void foo(Args... args) {

    };

    ```


    This declares a variadic function template foo that has an arbitrary number of
    parameters. The parameters need not have the same type.


    There are three kinds of template parameters, and we can define a parameter pack
