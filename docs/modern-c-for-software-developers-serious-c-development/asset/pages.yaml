    C++11 introduces direct initialization:


    ```

    // direct initialization of the variable width with the value 5

    int width(5); // equivalent to int width (5);

    ```


    For native data types (like integers), copy assignment and direct initialization
    are essentially the same. But for some complex types, direct initialization can
    perform better than copy initialization.


    Next consider:


    ```

    Foo foo(obj)

    ```


    For this direct initialization of the object foo to work, Foo must have a copy
    constructor or a constructor that accepts obj as a call by value. This statement
    will not compile otherwise.


