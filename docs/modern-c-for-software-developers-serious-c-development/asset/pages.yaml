    Run-time type identification (RTTI for short) provides enhanced support for run-time
    polymorphism. The typeid operator allows us to identify the type of an object
    during the execution of a program. We can also use typeid to determine whether
    two objects belong to the same class.


    C++ implements run-time polymorphism through the use of class inheritance, virtual
    functions, and base-class pointers. Since base-class pointers can be used to point
    to an object of a base class or any object derived from the base class, it is
    not possible to know in advance what type of object will be pointed to by a base
    class pointer at any moment in time. This determination can be made at run time,
    using run-time type identification.


