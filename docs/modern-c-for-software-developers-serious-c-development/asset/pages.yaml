  md: '# C++ GDB Debugger


    # Basic Debugging


    In order to debug a program, the program must be compiled with debugging symbols.
    Debugging symbols map program identifiers to memory addresses and line numbers
    in the source code. These debugging symbols are present in the object files generated
    by the compiler. The -g compiler option instructs g++ to generate debugging symbols:


    ```

    $ g++ -g -std=c++20 -o hello hello.cpp

    ```


    Once a program has been compiled with debugging symbols, we can start the GDB
    debugger:


    ```

    $ gdb hello

    ```


    The debugger will read the debugging symbols and stop at a debugger prompt.


    gdb> is the debugger prompt.


    Typical usage of gdb is as follows: After starting gdb, we set breakpoints. Breakpoints
    are locations in the source code where we want execution to pause. Each time gdb
    encounters a breakpoint, it suspends execution of the program at that point, giving
    us an opportunity to check the values of various variables. When we reach a breakpoint,
    we can single step forward from the breakpoint, which means that gdb will execute
    one line of the source code at a time and then pause.


    The run command causes gdb to execute the program to the next breakpoint:


    ```

    gdb> run (or gdb> r)

    ```'
  merge: -1
  img_proc: true
