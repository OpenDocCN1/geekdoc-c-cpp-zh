  md: "# C Language: Comma Operator\n\nThe comma operator causes a sequence of expressions\
    \ to be evaluated from left to right.\nThe value of a comma-separated sequence\
    \ of expressions is the value of the right-most expression. For example:\n\n```\n\
    int j = 10\nint val = j+10, j + 5, j + 1;\n```\n\nIn this example, the first expression\
    \ j+10 is evaluated. Then the expression j+5. Finally the expression j+1 is evaluated.\
    \ The result of the last expression (26) is assigned to val.\n\nComma separated\
    \ expressions are frequently found in loops:\n\n```\nfor (int i = 0, int y = 10;\
    \ i < 5; i++, y--) {\n  ...\n```\n\nNote: the comma operator has a lower precedence\
    \ than the assignment operator."
