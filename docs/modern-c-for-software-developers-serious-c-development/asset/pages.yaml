  md: "# C++ Glossary\n\n# Application Binary Interface (ABI)\n\nThis refers to the\
    \ manner in which program data is laid out in memory:\n\n+   - the layout of function\
    \ parameters\n- the layout of data\n- the layout of classes and structs\n- the\
    \ layout of virtual functions\n- the return type\n\nConsider the following example\
    \ which breaks the ABI of a library. We have a struct in the library:\n\n```\n\
    struct {\n    int a;\n    int f;\n}\n```\n\nOur binary executable links in the\
    \ library and the application accesses the data member a. The binary executable\
    \ gets the 4 bytes at offset 0 from the beginning of the struct.\n\nNow suppose\
    \ that we change the struct as follows:\n\n```\nstruct {\n    int f;\n    int\
    \ a;\n}\n```\n\nAnd link the new library (the binary library code) into our executable.\
    \ Now our executable will access f instead of a. Actually we need to access the\
    \ 4 bytes beginning at an offset of 4 bytes from the start of the struct. The\
    \ new library has broken it' ABI. The solution is to recompile the library; but\
    \ this requires access to the source code. If we do not have access to the source\
    \ code, we cannot change the order of the data members f and a if we want to preserve\
    \ the application binary interface. There is a way"
  merge: -1
