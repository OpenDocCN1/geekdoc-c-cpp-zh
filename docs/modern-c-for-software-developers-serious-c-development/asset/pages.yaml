    \ we can define our own units of measurement. This is accomplished by specifying\
    \ a literal value and attaching a custom suffix to this value. The suffix converts\
    \ the value into suffix units. For example:\n\n```\n#include <iostream>\nusing\
    \ namespace std;\n\nfloat operator \"\"_sections(long double x) { return x / 640;\
    \ }\nint main() {\n    float result = 1055.44__sections;\n    cout << result <<\
    \ endl;\n}\n// 1.64912\n```\n\nThis example converts acres into sections. A section\
    \ is 640 acres. An integer literal with a custom suffix such as sections is called\
    \ a user defined literal. The declaration syntax for user defined literals uses\
    \ operator functions as follows:\n\n```\nlong double operator \"\"_cm(long double\
    \ x) { return x * 10; }\nlong double operator \"\"_ms(long double x) { return\
    \ x * 1000; }\nlong double operator \"\"_mi(long double x) { return x * 100000;\
    \ }\n```\n\noperator \"\" signifies that we are declaring a user defined literal.\
    \ _cm, _ms and _mi are custom suffixes. These operators have a long double parameter.\
    \ The parameter is multiplied by 10, 1000 or 100000 and this value is returned.\
    \ The return value can be any integer or floating point type. Permissible parameter\
    \ types for user defined literals"
