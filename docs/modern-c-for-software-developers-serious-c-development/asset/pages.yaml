  md: "# Variable Scope In C And C++\n\nVariable scope refers to the region of a program\
    \ where a variable exists and can be accessed.\n\nIn C there are three places\
    \ where a variable can be declared:\n\n+   - inside a brace delimited block {\
    \ ... } (local variables)\n- in the parameter list of a function\n- outside all\
    \ functions (global variables)\n\nPair of braces {} defines a block and variables\
    \ declared inside a block have their scope restricted to the block. In C, the\
    \ scope of a variable begins at the point of it's declaration.\n\nC and C++ implement\
    \ **lexical scope**. This means the scope of any variable can be determined at\
    \ compile-time by examining the source code.\n\n**Lexical scope** can be explained\
    \ as follows. Suppose the compiler encounters a variable name in a block of code\
    \ and wants to know whether the name exists and it's value. The compiler first\
    \ examines the current block for the declaration of the name and if not found;\
    \ it examines any outer enclosing block(s) and finally the global scope for the\
    \ variable name.\n\nThe following C++ program shows C/C++ lexical scoping:\n\n\
    ```\n#include <iostream>\nint value = 999;\n\nvoid f()\n{\n    int value = 1;\n\
    \    std::cout << \"value in f - \" << value << std::endl;\n}\n```"
