  md: '# The .gdbinit File


    Whenever the GDB debugger is started, it searches for the file .gdbinit, first
    in the user''s home directory and next in the current working directory. If the
    file is found then the commands listed in the file will be executed. Place one
    command per line in the file.


    For example, if we want the debugger to always stop at main(), we can insert the
    following GDB command into .gdbinit:


    ```

    gdb> b main.cpp

    ```


    # Tracing Program Execution


    Suppose we encounter a critical error during program execution that crashes the
    program. We can locate the program statement at which this error occurred with
    the backtrace command. At the debugger prompt, enter:


    ```

    gdb> bt

    ```


    bt traces the function calls leading to the critical error.


    # Debugging Core Dumps


    Serious errors such as a segmentation fault will abort program execution and result
    in the debugger outputting a core dump. The core dump file contains all of the
    information necessary to create the state of the program at the point where the
    program aborted. We can use gdb to access the information in the core dump by
    passing the core dump file as the second parameter to gdb:'
