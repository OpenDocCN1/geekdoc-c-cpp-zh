- pgno: 422
  md: '```

    requires (optional_parameter_list) { requirements; ...;}

    ```


    The optional_parameter_list is a comma-separated list of template parameters.
    The variables specified in this list are used to specify compile-time constraints
    on the parameters. They don''t have any lifetime, initialization, storage, and
    so forth. If no variables are required, the parentheses can be omitted.


    Example:


    ```

    template<typename T>

    concept addable = requires (T a, T b) { a + b; };

    ```


    This concept requires we must be able to add the template parameters.


    # Validate That A Template Specialization Can Compile


    To verify that type parameters can be used as intended by a class or function
    template specialization, we introduce variables in the optional parameter list
    and write the intended usage as a requirements expression. This is exactly what
    the previous addable concept does.


    Once we have declared the concept addable, we can complete our template declaration
    for the add function in follows:


    ```

    template<addable T>

    T add(T a, T b);

    ```


    Note: the a + b in the requirements expression is not executed; the compiler only
    verifies if it can be compiled successfully.'
