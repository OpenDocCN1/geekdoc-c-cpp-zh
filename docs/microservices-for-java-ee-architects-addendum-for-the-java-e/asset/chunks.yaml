    # 拥抱 DevOps 文化


    微服务架构部署物的数量呈指数级增长，有时是传统 Web 应用的 20 倍。要通过完全手动流程来建立新环境和管理部署是不可能的。拥抱 DevOps 文化，即通过程序化方式创建和管理环境，并减少每个环境的人工工作量，对于管理大量的部署物是至关重要的。


    快速创建和保护新环境的能力至关重要。随着新服务的识别和新资源的请求，你所使用的虚拟机数量将会增加。通过利用 Apache [Mesos](http://mesos.apache.org/)
    或其他类型的资源管理软件，可以减少虚拟机的增长。这本身需要工作和额外投入。采用微服务架构在技术上并不要求集成云服务，但许多用户确实选择集成，以便他们能够在短时间内指数级地增加其支持的虚拟机数量。


    对数据库管理人员的需求将会增加。大多数人考虑到对运营人员的额外需求。由于微服务架构也增加了数据库的数量以及部署物的数量，对新模式/数据库创建及增强的需求也会之增加。这意味着对数据库管理员的需求也会增加。有些组织将这些工作交给了微服务团队本身，但无论如何组织，这些工作都不会消失。虽然不经常讨论，但数据库管理员也需要拥抱
    DevOps 文化，并将他们做的更多工作自动化。


    ## 服务合约管理


    关于微服务团队如何获取功能增强任务的描述还并不多。微服务其本质提供了用户请求的能力的核心部分，但并非以那些用户可能理解的语境呈现出来。用户更有可能向为他们提供
    Web 应用或用户界面的团队提出功能请求。当团队意识到自己没有能力交付该功能请求时，他们需要将请求的非 GUI 部分传递给一个或多个微服务团队来实现。例如，假设一个
    UI 团队接收到了存储某特定课程教授教学大纲的请求，而目前没有可用服务能够记住这些信息。需要有人来引导该请求，弄清楚它属于哪个服务，确保功能请求包含足够的可操作信息，并对其进行适当路由。这里有很多工作需要以某种方式完成并安置。大多数组织利用某种类型的任务管理软件（例如
    [Jira](https://www.atlassian.com/software/jira)）来管理和跟踪此类功能请求。


    服务组合管理将是关重要的。是的，你可以让开发者作为一种基层努力来设计和发布服务合约。换句话说，让他们随心所欲，而你不予关注。最初，这是最简单的管理方法。然而，随着部署服务的数量增加，开发者将无法“见木不见森林”。你会遇到大量的重复，并且创建和部署的服务中将出现大量的不一致性。最终，这些缺陷将随着服务列表的增加而增加，并侵蚀你从微服务架构中获得的一些收益。


    我永远不会建议你在所有服务合约部署和使用之前实施一个正式流程来审查并批准它们。那会阻碍开发速度，而这是微服务架构的预期收益之一。然而，应该有人跟在开发团队后面，以包括管理层在内的所有人可用的标准格式对已发布的服务进行目录编制。这样他们就可以记录服务不一致之处，向服务团队发送变更建议，并帮助开发者采用现有服务——而不是发明现有服务的新版本。如果存在任何风险，他们还可以向管理层指出潜在的风险区域。


    管理合约变更是至关重要的。在微服务世界中，合约的质量将极大影响你从采用微服务架构中获得的收益。定义不当的合约会导致混乱和意外，并对新功能的开发速度产生负面影响。有些组织谨慎地限制任何时间的变更量，以保持高质量并防止对开发速度产生负面影响。


    功能增强任务对于微服务团队成员来说应该是明确且清晰的。记住，更高的开发速度来自于开发者的专注能力，并且免于通信开销。给他们不明确的功能分配意味着他们将需要向请求功能的用户那里获取清晰度。需要建立一套用于梳理和跟踪功能增强请求的流程。


    ## 服务测试与部署自动化


    对自动化测试的投资是至关重要的。随着开发速度的提高，生产部署率呈指数级增长。如果没有自动化测试，缺陷将迅速摧毁你的生产环境。自动化合约测试对于缓解这些影响至关重要，因为在这个世界中通常没有时间进行手动测试。这种自动化不是免费的；它需要的人力来设置，还需要维护和管理。它还需要强制执行。


    自动化部署是至关重要的。随着部署速度的增加，每次部署都进行人工干预不再像以前那样可行。也可以认为，部署中的手动步骤实际上增加了风险，因为它们增加了错误的机会。是的，这个陈述假设了一个编写良好、测试良好的部署流程，这种流程通常没有失败记录。不言而明，只有通过绿色测试套件的产品才被允许进入生产环境。


    数据库更改也应该是自动化的。数据库更改通常伴随着新功能的服务部署。如今，这些更改也可以是自动化的。像 [FlyWayDb](http://flywaydb.org/)
    这样的产品有助于管理此类更改。是的，回滚或失败部署仍然需要一定的人工干预，但希望失败部署仅占总数的一小部分。


    考虑提供一种基于消费者的测试流程。基于消费者的测试需要是自动化的，并作为针对服务的测试套件的一部分。你可以将其视为必须为绿色状态才能进行生产部署的测试添加。这里的唯一区别是消费者团队提供并维护这些测试。我会将此视为消费其他服务的服务团队的“选项”，而不是要求。在过去，我不得不依赖被证明不可靠的服务，导致许多测试失败。对于不可靠的服务，在开始时知道依赖的服务已挂掉且测试失败是在预期之中的是非常好的。这节省了调查时间。


    ## 团队管理


    管理团队的交付物，而不是团队内部的管理。微服务架构的好处之一是消除通信开销。通过交付物管理而不是微观管理团队，有助于消除这种开销。只要你以接受的速度和质量获得功能增强，团队选择如何组织可以留给他们。


    '
- fmt: '

    Developers should be working on one service at a time. This helps guard against
    making assumptions about business processes using services in a specific order
    or context. I say this because you won’t have a developer working on a service
    and its consuming service at the same time. This also helps them focus without
    distractions and keeps their velocity high. In this world, anything that drags
    down developer velocity sacrifices the benefit you get from microservices architecture.


    Developers who publish a service should be made to support it. This incents intelligent
    development product decisions and writing high-quality code that is supportable.
    In other words, developers ‘eat their own dog food.’ Most developers want a good
    family life; this paradigm supports that. As long as they produce high-quality
    services that have a low defect rate, then the time they spend on support is minimized.


    ## Service Health Monitoring


    An automated response to defects is essential. With higher development velocity
    comes an exponentially higher production deployment rate. Health monitoring is
    essential to discovering outages and defects quickly. Some of my clients use `Splunk`
    or `LogStash` to automatically create a defect ticket in a ticketing system when
    errors are encountered in production. Deciding which service team should be notified
    when an error is encountered deserves some thought and planning. For instance,
    a service call that errors on erroneous input should go to the consuming team,
    not the team producing the service. Certainly, any type of unplanned runtime exception
    should go to the team producing the service.


    Dealing with error repeats also deserves consideration. One defect could get thousands
    of reports, depending on volume. Getting thousands of tickets for the one defect
    is hardly helpful. Suppressing the repeats is dangerous as detecting what’s a
    repeat of a previous issue and what truly has a different cause can be problematic.


    ## Management Benefits for Microservices Architecture Adoption


    Much of the literature concentrates on describing the technical benefits that
    microservices architecture provides. There are business/management benefits too.
    This section will detail some of those.


    ### Resource Staffing Flexibility and Insulation


    Microservice development teams are small and focused. Developers `only` work on
    one service at a time. That service is supposed to have a firm contract that those
    developers are coding to, preferably with containerized deliverables (i.e., `Docker`).
    The point is that they’re all about heads-down development. They shouldn’t be
    burdened (or have to be burdened) with communication overhead; only with other
    developers working on that service.


    They are working as an independent team, completely asynchronously from all other
    service teams. Combined with the fact that they have low communication overhead
    and defined deliverables, they can be anyplace in the world in any time zone.
    It doesn’t matter whether they are in-sourced in a corporate office somewhere
    or off-shore.


    Given that the work of the team is confined to the focused requirements for the
    service, worries about code quality, etc. are at least contained to the small
    service source code base. In other words, there’s a limit to how much code that
    team can mess up and thus create maintenance issues.


    This means that development for microservices services can be more easily outsourced.


    This also means that you’re better insulated from rogue developers. We’ve all
    managed developers who produce unmaintainable code. As rogue developers are confined
    to one small and focused code base, there’s a limit to how much damage they can
    do to that code base. Furthermore, that code base is small, focused, and well-defined;
    it’s more replaceable if need be. You’re not letting rogue developers loose in
    a 500K line monolithic application to cause havoc on a wider scale.


    ### Increased Development Velocity


    Assuming that contracts for needed services are fully defined, along with the
    dependencies between those services, it’s easier to bring larger number of development
    teams on for ongoing efforts. The concern about bringing on additional developers
    is that this typically means more communication overhead. As a result of that
    increased overhead, developer productivity has diminishing returns. You get less
    and less productivity out of each additional developer.


    While individual developer productivity does increase in microservice teams because
    they don’t have as much communication overhead, there is a limit to how much productivity
    increase you’ll get with any individual developer. Your velocity increase really
    comes from the ease with which new teams can be added. Developers never see or
    are impacted by the size of the overall effort as they are doing heads-down development
    in a small, focused team. Consequently, it’s easier for management to scale development
    to larger numbers of developers. Note that in addition to having all service contracts
    fully defined, you also have to have identified any dependencies between contracts;
    some services might require that other services be completed before work on a
    particular service can finish. Note that any development team can stub dependent
    services and start work before dependent services are finished.


    What really happens here is that the constraint to scaling development shifts
    to management and enterprise architects responsible for identifying individual
    services and specifying the service contracts. With larger efforts will come more
    coordination points. As some services call other services, those dependent services
    need to be built first. The order in which work flows down to development teams
    needs to be coordinated.


    ### Technical Stack Freedom


    In a microservices world, services are containerized. That is, the deployment
    artifact has an operating system and other software that it needs (e.g., `Java
    JVM`, `PHP`, `Python`, `GoLang`, etc.). Each service can easily operate at different
    levels of these technologies. The corollary is that new technologies can be more
    easily introduced or upgraded. That makes it easier for you to capitalize on newer
    technologies much more quickly than you can with traditional monolithic web applications.


    With traditional web applications, the code base is much larger. Therefore, the
    impact of upgrades will be much larger and require more extensive regression testing.
    Moreover, switching development languages is much more difficult with the larger
    code base.


    This is a technical benefit, but I believe it to be a management benefit as well.
    Managers are always looking for new ways to deliver software faster. One of the
    avenues for increased developer productivity is technology advances with the available
    toolsets. Your ability to utilize newly developed toolsets and bring about productivity
    increases that the business wants is better with microservices architecture than
    with traditional web deployments.


    ## Further Reading


    If you’re interested in microservices architecture, there are several additional
    resources I can point you to.


    My interest in microservices began when I viewed this `presentation` by Fred George.
    I ran into it quite by accident, but I was fascinated by the ramifications of
    microservices architecture that he articulates. In essence, he instigated this
    book, although he probably has no knowledge of this. Specifically, I was intrigued
    by the notion of services being ‘disposable.’

