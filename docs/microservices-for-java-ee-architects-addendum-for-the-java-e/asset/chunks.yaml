    teams tend to be smaller and more focused. This is a byproduct of microservices
    architecture as the code base is typically much smaller than with traditional
    web applications. We’re going to discover that a smaller code base isn’t a goal
    of microservices architecture directly, but rather it is a byproduct of having
    such a targeted business focus.


    Furthermore, the single functional purpose of a microservice should be self-contained
    and autonomous. It represents a complete unit of work that can be executed in
    any context as long as its inputs are correct and its resources available. My
    use of the phrase ‘unit of work’ should not be taken to imply a single database
    transaction. We will learn that a functional unit of work can in fact consist
