    \ Having a library of searchable requests/responses will save developers time\
    \ when investigating support issues.\n\n## Service Security\n\nSecurity is implemented\
    \ in layers. Each layer represents a ‘hurdle’ for an attacker. The more sensitive\
    \ the secured resource is, the more layers of security are placed around it; making\
    \ unauthorized access to the secured resource more difficult. This is a basic\
    \ security concept that we utilize everywhere. As a simple example of a security\
    \ layer, organizations use firewalls to place a security level around internal\
    \ resources; and you must have at least internal access per the firewall to access\
    \ internal web applications and resources. Organizations don’t stop with this\
    \ layer; they normally add another layer using access groups (e.g., LDAP groups)\
    \ to differentiate which users can access which resources – but you get the idea.\
