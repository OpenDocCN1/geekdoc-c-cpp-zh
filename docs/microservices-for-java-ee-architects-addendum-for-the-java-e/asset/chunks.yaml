    \ CURRENT_DATE AS today, CURRENT_TIME AS now FROM (VALUES(0))\n```\n\n在高并发部署中，通常需要配置底层容器设置，例如容器工作线程的最小、最大和超时设置。在高并发部署中还有你需要关注的设置但在这里我想说明如何使用\
    \ `Spring Boot` 实现这一点。这可以通过重写应用程序类中的 `servletContainer` 方法来实现。如何这样做的示例可以在我的[示例](https://github.com/Derek-Ashmore/moneta/blob/master/moneta-springboot/src/main/java/org/moneta/config/springboot/MonetaSpringBootApplication.java)以及列表\
    \ 3.6 中找到。\n\n### 列表 3.6：Spring Boot 容器配置示例\n\n```java\n@Bean\npublic EmbeddedServletContainerFactory\
