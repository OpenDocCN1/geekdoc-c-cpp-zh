    Chapter 1: Microservices Defined


    The microservices architecture doesn’t have a concrete definition. Microservices
    architecture organizes applications as a suite of discrete, independent services.
    Usually, these web services adopt a [RESTful](https://en.wikipedia.org/wiki/Representational_state_transfer)
    style. Any coupling between services is restricted to the service layer, with
    no coupling at a code or database level. The approach does have some similarities
    to the Service Oriented Architecture (SOA) approach, which will be discussed later.
    We define it as a series of common traits that ‘microservices’ have.


    Microservices have a single functional purpose. That is, they have a single business
    purpose. They do one thing and do it well. To level set, the term ‘functional’
    is borrowed from the term ‘functional requirement.’ Functional requirements are
    typically business requirements; they support doing business directly in some
    way. In essence, the terms ‘functional’ and ‘business’ can be used interchangeably.


    As a byproduct of having a single functional purpose, most business changes affect
    a small number of services (preferably only one service). In fact, we’re going
    to see that it’s a warning sign that your microservices are not well defined if
    single feature change requires a large number of service deployments.


    As a byproduct of microservices having a single functional purpose, microservice
    teams tend to be smaller and more focused. This is a byproduct of microservices
    architecture as the code base is typically much smaller than with traditional
    web applications. We’re going to discover that a smaller code base isn’t a goal
    of microservices architecture directly, but rather it is a byproduct of having
    such a targeted business focus.


    Furthermore, the single functional purpose of a microservice should be self-contained
    and autonomous. It represents a complete unit of work that can be executed in
    any context as long as its inputs are correct and its resources available. My
    use of the phrase ‘unit of work’ should not be taken to imply a single database
    transaction. We will learn that a functional unit of work can in fact consist
    of several service calls, each of which has separate database transactions. Said
    another way, it doesn’t make any assumptions about what services have been called
    before it and what’s to be called after it.


    All microservices have non-functional cross-cutting concerns, such as providing
    health checks, exception handling/logging, and performance metrics. These concerns
    are separate from the functional purpose of the service. Also, these items should
    be provided by the application architecture and re-used from service to service
    organization wide. I’ll show you how for services written using Java.


    Microservices have a standard technology-agnostic interface. Most use RESTful
    web services, but other standard interfaces work as long as they are technology
    agnostic (i.e., it doesn’t matter if the service was written in Java, .Net, or
    anything else). SOAP services are technology-agnostic and fit this requirement.


    Technology agnostic interfaces are needed to preserve the tech stack independence
    benefit for using microservices. It should not matter if a particular microservice
    is written using Java, .Net, Go, Php, Python, or anything else. We’re going to
    learn that technology agnosticism makes it easier to migrate to newer technologies
    or new versions of existing technologies, and that it means much less lock-in
    for your technical stack.


    The implications are that Java EJB or RMI services don’t qualify as a microservice
    interface as they are Java-specific. Remember that one of the objectives of microservices
    architecture is freedom to switch technical stacks. Yes, that means potentially
    writing microservices with development platforms other than Java.'
