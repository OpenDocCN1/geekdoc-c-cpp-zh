- fmt: '

    I do recommend [AMQP](https://www.amqp.org/) for messaging as opposed to native
    JMS. JMS is platform-specific (java only), which defeats the technical stack independence
    benefit for microservices architecture. For tooling support, most consider the
    [JMS api](https://docs.oracle.com/javaee/6/tutorial/doc/bncdr.html) easy enough
    to use directly. Spring batch provides a [`JMSTemplate`](http://docs.spring.io/spring/docs/current/javadoc-api/org/springframework/jms/core/JmsTemplate.html)
    and [`RabbitTemplate`](http://docs.spring.io/spring-amqp/api/org/springframework/amqp/rabbit/core/RabbitTemplate.html)
    to assist with message production.


    ## Service Call Mediator


    Services should be resilient enough to operate partially when outages occur. The
    root idea is that providing degraded service is preferred to providing no service.
    In other words, we’re designing to provide partial availability in the event of
    an outage. One example is a business that sells WiFi service on airplanes. Customers
    pay a small fee by credit card and receive service. If the credit card payment
    processing functionality is unavailable, it might make business sense to provide
    the WiFi service to that customer anyway rather than irritate them by denying
    service. The mediator pattern is one of the ‘gang-of-four’ behavior patterns defined
    in the book [Design Patterns](https://en.wikipedia.org/wiki/Design_Patterns).
    An example implementation of the service call mediator pattern can be found in
    my GitHub project [TaskMediator](https://github.com/Derek-Ashmore/TaskMediator),
    which is open source.


    Figure 2.6: Service Call Mediator Pattern


    ![figure-2-6-Service-Call-Mdiator-Pattern-Algorithm.jpg](images/00012.jpeg)


    Since the initiating service receives a default/normal response, it processes
    as usual. The amount of code in the initiating service that is needed in order
    to provide partial functionality is minimized. From the perspective of the initiating
    service, no error occurred. However, the service call mediator logged the error
    and initiated any support alerts needed.


    For those wanting a more code-level example, Listing 2.3 provides an example of
    the service call mediator pattern using `TaskMediator`.


    Listing 2.3: Service Call Mediator algorithm example using `TaskMediator`


    ```

    TaskMediator<String> taskMediator = new TaskMediator<String>(DEFAULT_RESPONSE);


    MyCallable callable = new MyCallable();


    String callResult = taskMediator.invoke(callable);

    ```


    Note that it is possible to combine the service mediator pattern with the circuit
    breaker pattern. In this way, you get the benefits of failing earlier and with
    fewer resources, and also the benefit of providing partial functionality. An example
    of how to accomplish this using [CircuitBreaker](https://github.com/Derek-Ashmore/CircuitBreaker)
    can be found in Listing 2.4.


    Listing 2.4: Example combining Service Call Mediator with CircuitBreaker


    ```

    DefaultCircuitBreakerAlgorithm algorithm = new DefaultCircuitBreakerAlgorithm(10L,
    2L);


    Circuit<String> circuit = new Circuit<String>(algorithm);


    MyCallable myCallable = new MyCallable();


    CallableCircuit<String> circuitCallable = new CallableCircuit<String>(circuit,

    myCallable);


    TaskMediator<String> taskMediator = new TaskMediator<String>(DEFAULT_RESPONSE);


    String callResult = taskMediator.invoke(circuitCallable);

    ```


    ## Designing for Performance


    In a microservices architecture, there’s a lot more network traffic. This increased
    network traffic can cause architects to be concerned regarding performance. After
    all, service calls are dreadfully expensive when compared to a local method call.
    Also, since architects may ‘assume’ that microservices architecture uses services
    that are fine-grained, this can also contribute to their concern. But this assumption
    is false. All that you learned with SOA about services being coarse-grained still
    applies; but even with coarse-grained service calls, network traffic increases
    with microservices architecture. Fortunately there are design tactics we can use
    to mitigate the performance impact of increased service call traffic.


    ### Coding Patterns for Performance


    There are several coding patterns that help to mitigate the performance impact
    of service call traffic. I’ll take you through them.


    One of these patterns, dispatch via messaging, is also a failure design pattern
    discussed in a previous section and won’t be described again here. It’s also a
    performance pattern in that by taking work offline, it provides users with a perceived
    performance gain as the portion of the work they see is shorter.


    ### Back-ends to Front-ends (API Gateway)


    The back-ends to front-ends pattern improves performance by ensuring that microservice
    traffic is on your local network and not on the open internet. This pattern uses
    gateway services that consolidate microservice calls for web applications / user
    interface products. The idea is that the browser portion of the application will
    make one or two calls to its application service provider. That provider will
    make the numerous microservice calls (either directly or indirectly) that are
    needed to accomplish the work requested by a user in the web application.


    I’m using the term ‘application service provider’ to describe that gateway service
    that consolidates user interface calls and responses.


    Another name for this pattern is ‘API Gateway.’ However, I do not use that term
    as there is generally confusion between the API Gateway pattern and API Gateway
    products, such as [WSO2](http://wso2.com/). API gateway products are about routing
    and governance and not about any kind of call consolidation activity. I’m talking
    exclusively about the pattern.


    Application service providers consolidate service calls. That is, a call to them
    might mean calls to multiple services in your microservice library. Any data from
    those microservice calls are consolidated and returned to the caller. All the
    chatty microservice traffic is on your local network, and that can be properly
    tuned by your network engineers. That local network can be properly scaled to
    provide service for the extra network traffic that microservices architecture
    requires.


    Figure 2.7: Back-ends to Front-ends Pattern


    ![](images/00013.jpeg)


    Yes, this does mean that the consolidating call will likely return a larger amount
    of data. Let’s work that through a bit. The cost of the network portion of a service
    call can be thought of in two parts: the cost of establishing a connection with
    the service host, and then the data transfer of the request/response. By consolidating
    service calls, back-ends for front-ends drastically reduces the connection establishment
    portion of the traffic. Transfer cost might also be reduced in that the gateway
    service sorts through all microservice output and streamlines the result to include
    only that specific web application needs to function. For example, it is not unusual
    for core services to provide information about a business topic that the caller
    doesn’t need. That ‘extra’ information is weeded out by the application gateway
    manager and not sent to the browser. In this way, the data transfer portion of
    the cost is optimized.


    Do not expose microservice traffic directly to the browser. This is a bad idea
    and anti-pattern. Use the back-ends to front-ends pattern instead of directly
    exposing your microservice library to the browser. You don’t control the network
    between the browser and your service library for external web sites. Users will
    get varying performance experiences depending upon how they are connected to the
    internet. You’ll not be in any position to really help them. For this reason and
    this alone, all browser service calls should be consolidated.

