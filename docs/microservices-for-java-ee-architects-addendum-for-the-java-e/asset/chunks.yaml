- fmt: '

    Microservice implementations are more complex. Yes, each individual microservice
    is easier for developers to work with as it is small and focused. However, in
    a microservices world, there are many more moving parts. This makes delivering
    business functionality, which may involve multiple microservices, much more difficult
    to design and manage. Moreover, that complexity makes defects more difficult to
    diagnose and performance problems more difficult to investigate.


    Microservice implementations will cause complete chaos if contracts aren’t designed
    well. I’ll present some advice on designing microservice contracts later in the
    book. With badly designed contracts, developers spend much more time consuming
    services and with support activities. This time erodes your development velocity
    and negatively impacts the benefits of adopting microservices to begin with. From
    a management perspective, consider contract management specialized labor. Some
    architects are better at it than others.


    It’s worth noting that moving to a microservice architecture requires that your
    organization have DevOps capabilities among other things. I provide an overview
    of these prerequisites in Chapter Five in the section entitled “Prerequisites
    for Microservice Architecture Adoption.”


    ## Microservices Architecture Compared to SOA


    Many ask: “Isn’t microservices architecture simply a re-branded SOA?” The answer
    is ‘“yes” for the most part. Keep in mind that SOA suffers from the same definitional
    malady that microservices do, in that SOA doesn’t have a concrete definition.
    SOA means different things to different people.


    They are similar in many ways except for the complexity of queues/pipes. SOA often
    has very complicated plumbing for moving data around in queues. Often `Mule` or
    `Camel` flows are used to transform, copy, or re-order data in transit and to
    accommodate for any formatting differences as that data is moved from service
    to service.


    In a microservices world, process services (which we’ll learn are complex services
    that rely on other services to function) effectively coordinate delivering complex
    business functionality. The role of orchestration is delegated to process services
    and not `Mule` or `Camel` flows.


    Microservices architecture uses dumb pipes and smart endpoints. Microservices
    use queues too, but without any transformations you might find in a Service Oriented
    Architecture (SOA) world. Generally, there are no complex flows (e.g. `[Mule](https://developer.mulesoft.com/)`
    or `[Camel](http://camel.apache.org/)`) with formatting, filtering, or sequencing
    changes to message data in being transmitted from service to service. Think of
    the electrical supply of your stereo system as an example of such a pipe. Electricity
    is either on or off, with nothing in between. A ‘pipe’ doesn’t get much simpler
    than that, with absolutely no intelligence in the pipe itself.


    ## Refactoring into a Microservices Architecture


    Typically, applications don’t start out with a microservices architecture. In
    most cases, they are refactored into a microservices architecture. Having read
    numerous case studies, I haven’t yet seen an example of a microservices application
    that didn’t start as a traditional web application that got too large to effectively
    manage and maintain. That isn’t to say it’s not possible, but it’s definitely
    not common.


    Exempt the user interface from following a microservices architecture. There are
    significant benefits to cohesive user interfaces; they provide consistency to
    the user experience. Web presentation frameworks are notorious for not playing
    well with other frameworks. Take, for example, `JSF` and `Spring-MVC`. Both are
    very viable frameworks that will work for most user requirement sets, but if you
    try to use them together in the same user interface, you’ll quickly find that
    you’re swimming against the stream. Bottom line: consider user interfaces exempt
    from a microservices architecture. I’ll get into more about their role and how
    to incorporate them later.


    As it’s harder to refactor databases (more on that later), let’s leave the database
    alone for the first stages of microservice refactoring as well. What gets separated
    into individual microservices is business logic. An illustration of this can be
    found in Figure 1.4. Note that I’m using a simple example where identified domains
    are bounded contexts. That can happen, but it’s more likely that the domain `Students`
    would be broken down into multiple bounded contexts and multiple microservices.


    ### Figure 1.4: First Stage Refactoring Example


    ![](images/00005.jpeg)


    We can’t leave the database out of the refactoring altogether. Having multiple
    services use the same database/schema is in fact ‘coupling,’ which a microservices
    architecture tries to avoid. It’s not coupling in the sense we usually think of
    it (that is, code coupling). However, any data structure change after a first-stage
    refactoring will affect multiple services. For this reason, microservices architecture
    really incents you to separate databases.


    Each microservice ‘owns’ its own database. Look at it in the same way that you
    look at instance-level fields in a `Java` class. An illustration of our higher
    education example with each service having its own database can be found in Figure
    1.5.


    ### Figure 1.5: Microservice Example


    ![](images/00006.jpeg)


    This gives us loose coupling, but also a couple of problems. What do we do with
    common business data? All organizations have data that are common throughout the
    enterprise; that is, data that multiple services will need.


    Consider a higher-ed example. Universities have ‘campuses.’ Indiana University,
    which I attended, has campuses in Bloomington, South Bend, Indianapolis, and many
    other locations. Multiple services with a microservices architecture will need
    this information. If each service has its own database, that means they are not
    using a central data store somewhere. The only two choices are service call or
    copy. That is, define a service that ‘owns’ campus information and make all other
    microservices call to get that information. The other option is to to ‘copy’ that
    data to all services that need it.


    Personally, I prefer using the service method. (Don’t worry; I’ll present ways
    to mitigate the performance impact for the additional service calls.) I prefer
    not to copy data from one service to another because it usually creates a maintenance
    headache; there is additional coding and testing in performing the copy, and that
    copy can have issues. All too often, defects arise because the copies of the same
    data aren’t in sync. I elect to avoid the problem altogether by having only one
    source for each item of information and making extra service calls to get it when
    needed.


    If you opt for a copy strategy, I’d recommend publish/subscribe. That is, the
    service that ‘owns’ the business data publishes the fact that a piece of information
    changes on a persistent queue. Any service interested in those changes subscribes
    to that queue and records the necessary events in its own database.


    In corporate America, we’ve really been into recording a fact once and only once.
    Consequently, it’s not uncommon to find sites that have multiple applications,
    sometimes dozens, maintaining the same database data. For those organizations,
    refactoring to the point where each microservice has its own database is a tall
    order. There is a compromise available.


    If you can’t give each microservice its own database, at least refactor to the
    point that one and only one service updates, inserts, deletes each data item.
    That reduces the haystack you need to look through to solve data corruption bugs.

