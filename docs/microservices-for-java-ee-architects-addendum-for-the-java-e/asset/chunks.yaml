    任何删除可能注册过课程或可能产生过费用的学生的尝试都会导致错误。在传统的 Web 应用程序中，我们可能依赖关系型数据库的引用完整性规则。然而，在微服务架构中，这些信息存储在单独的数据存储中，没有引用完整性规则来防止其他服务的数据在本质上处于被孤立状态。因此，这需要在应用层面强制执行。另一种可能性是进行级联删除（向依赖服务发布相应的删除操作），这在本质上是危险的。


    让我们注意图 2.1 中 `Students` 服务的其他特征。


    严格遵守 HTTP 方法的严格定义。关于可用方法的简要总结可以在[此处](http://restful-api-design.readthedocs.org/en/latest/methods.html)查看。`GET`
    请求检索信息；`GET` 请求永远不会更改任何业务数据（记录 `GET` 请求和响应是一种非功能性的、交叉关注的支持性问题，不被视为更改数据）。这简化了你向实现契约的服务开发者必须提供的通信内容。


    严格遵守 HTTP 方法错误代码的严格定义。这些错误代码是标准的。关于这些错误代码的简要总结可以在[此处](https://developer.yahoo.com/social/rest_api_guide/http-response-codes.html)查看。类似于遵循
    HTTP 方法定义，这简化了你向实现契约的服务开发者必须提供的通信内容。


    在所有微服务中标准化你的操作指令。对于 `Students` 服务，我定义了几个常用的操作指令：`sort`、`fields`、`maxEntries` 等。提供一种允许请求者按照其指定的顺序接收请求数据的功能是常见的。不要允许某些微服务使用
    `sort` 指令而另一些服务使用 `order`。这种非标准化会给消费者带来困惑，并阻碍提高开发者效率的目标。


    ## 处理服务 (Process Services)


    过程服务管理复杂的业务任务。它们通常代表特定的业务操作或程序。通常，过程服务依赖其他服务提供处理所需的大部分数据。有时，过程服务需要持久化数据，但并非总是如此。


    你通常可以将一个过程服务的“使命”表述为“负责 ______ 的服务”。例如，`StudentClasses` 服务负责学生课程注册并对现有的学生课程注册进行报告。与核心服务示例类似，在图
    2.2 中可以找到 `StudentClasses` 服务契约的类似说明。


    ### 图 2.2：过程服务定义示例


    ![figure-2-2-Student-Classes Service-Example-Hierarchy.jpeg](img/00008.jpeg)


    该定义的格式与图 2.1 中的核心服务示例相似。让我们来看一些差异。首先，`StudentClasses` 服务对写操作强制执行以下业务规则和约束：


    *   学生必须满足所有课程先决条件

    *   学生目前不能在同一时间被安排其他课程

    *   如果学生欠有过往费用费用，则无法注册课程


    这些约束纯粹是业务层面的，需要在服务层面强制执行。


    此外，并非所有呈现的属性都是更新的。图 2.2 区分了由 `StudentClasses` 服务维护的“属性”与为了方便消费者而呈现的“只读属性”，后者实际上是在其他服务中维护的。例如，如果消费者想要更改安排课程的
    `Professor` 姓名，他们应该通过 `ScheduledClasses` 服务来产生该更改。是的，为了方便而呈现这些信息确实需要调用服务，这可能会对性能产生负面影响。我们将在书的后部分讨论缓解这种性能影响的方法。


    请注意，`StudentClasses` 服务有依赖服务，与图 2.1 中的 `Students` 服务不同。如果这些服务不可用，`StudentClasses`
    服务可能无法正常运行。我们将讨论减少依赖服务可能造成的漏洞的方法。目前，我正专注于有效地定义服务边界和契约。


    接受微服务架构会比传统的应用程序架构增加服务流量。过程服务依赖其他服务来完成工作。图 2.2 中的 `StudentClasses` 服务就是其中之一。过程服务可能有数据库资源，但并非总是如此。


    ## 分区是一门艺术 (Partitioning Is an Art)


    决定服务边界或确定微服务的使命声明具有欺骗性的困难。此外，我无法给出一个客观的公式来确定服务的使命声明。如果你让服务做的事情太多或将其使命定义得太泛，你最终将得到几个“婴儿级单体”，而不是微服务库。如果你让服务操作过于细粒，将会导致过度的网络交互，性能将会损害。


    ## 微服务与领域驱动设计 (Microservices and Domain Driven Design)


    Evans 的领域驱动设计 (DDD) 概念在确定服务边界方面起着作用。DDD 将世界划分为“领域 (Domains)”和“子领域 (Sub-domains)”。领域是企业知识的范围。它们总是用业务术语表示，并且是纯分析的构造。它们代表企业中通常大到无法用微服务表示的区域。子领域是领域的任意划分，它们也总是用业务术语表示。子领域也是一种分析构造，并不一定与部署的服务一一对应。在子领域内部，划分了限界上下文
    (bounded contexts)。


    DDD 中的限界上下文是一个具有统一领域模型的任意边界。通常，一个限界上下文位于且仅位于一个子领域中。限界上下文是一个物理构造，并且通常具有服务部署表示。边界上下文之间的关系被显式定义。通常，意图是在代码中反映这种上下文，使代码更接近企业实际运作的方式。核心微服务管理一个且仅一个边界上下文的数据。它们从不跨越边界。


    过程服务管理复杂的流程。这些可能涉及一个或多个边界上下文。本质上，过程服务可以描述边界上下文之间的关系。边界上下文之间的关系是由独立的服务管理的。


    ## 服务使命检查 (Service Mission Checks)


    由于分区的艺术性，很难提供一个确定服务使命声明的客观算法。然而，我可以提供详细的警示信号，可能表明服务定义需要改进。


    ### 边界使命合理性检查


    你应该能够用业务术语用一句话表述服务的业务功能。如果你不能，这说明服务没有定义得良好。


    业务功能的示例包括：


    *   `Student` 服务是 `Professor` 信息的记录系统

    *   `Registration` 服务负责学生课程注册

    *   `Discipline` 服务负责停学学生

    *   `Student Payment` 服务记录学生付款

    *   `Transcript` 服务生成官方成绩单


    这些示例的共同点是什么？它们都是用业务术语编写的。除了服务标题中固有的术语外，其中没有任何技术术语。


    让我们与定义不当的服务示例进行对比。以下是不你不应该遵循的“反模式”示例，随后我将讨论它们的问题。


    反模式示例


    '
- fmt: '

    1. The `Customer Relationship Management (CRM)` service maintains people who will
    be marketed to. These people include high school students, students attending
    other colleges, and parents of these student types.


    2. The `Donation` service updates the donation database with people who have been,
    or should be, solicited for donations, as well as donations received. This includes
    alumni, parents of alumni, corporate benefactors and anyone else who might be
    solicited.


    ## Mission Statements


    Mission statements should not contain technical terms. Use of the term `CRM` in
    the first example refers to a specific class of software product. It is a technical
    term and shouldn’t be part of a microservice mission statement. The second example
    refers to a ‘database,’ which really micromanages how information is to be stored.
    Technical implementation details for microservices should be hidden. Storage mechanisms
    and specific product sets should be private and subject to change without notice
    to service consumers.


    Microservices should not attempt to maintain information for multiple business
    concepts. The `Donation` service (second anti-pattern example) does too much inside
    one service. Microservices are meant do one job and do it well. This service tracks
    candidates who may be solicited for donations and also the amounts given. I would
    separate the business of tracking solicitation prospects from the business of
    recording solicitation events and donations received. Services to handle donations
    and record interactions to elicit donations received may very well use the service
    that tracks solicitation prospects in some way.


    It’s worth noting that while microservices have one business purpose, they can
    often be used in multiple business contexts. For example, the `Donation` service
    we’re discussing might be used by a service to identify marketing targets or by
    a service implementing marketing campaigns of different types. In other words,
    having a single business purpose doesn’t keep the service from having multiple
    consumers.


    I would rewrite the “CRM service” mission statement as follows:


    - The `Marketing Prospect` service is the system of record for information about
    people who will be marketed to.


    In addition to being more than one sentence, the `CRM` service mission statement
    contains the term `CRM`, which is a technical term. `CRM` applications not only
    track customers and customer representatives for marketing campaigns, but are
    also used to manage sales force effectiveness and marketing campaigns of different
    types. It is not necessary to wrap all `CRM` functions with technology agnostic
    microservices. It is not unusual to only use a portion of the features offered
    by a software product. Only portions of `CRM` functionality that will need to
    be utilized by other services and applications need to be created. The mission
    statement seems concerned with the portion of `CRM` functionality that manages
    marketing campaign prospects – a ‘prospect’ being a potential customer or customer
    representative that will potentially be the subject of some type of marketing
    campaign or customer interaction.


    I would rewrite the ‘Donation service’ mission statement and separate it into
    multiple services:


    - The `Donation prospect` service is the system of record for people who may potentially
    be solicited for donations.

    - The `Solicitation` service tracks attempts to solicit donations from donation
    prospects.

    - The `Donation Receipt` service tracks pledges from donation prospects as well
    as actual donation receipts.


    In addition to being more than one sentence, the reference to ‘the donation database,’
    is a technical construct and not a business term. In addition, the title `Donation
    service` is in danger of doing too much. Microservices do one job and do it well.
    This service tracks candidates who may be solicited for donations and also the
    amounts given. I would separate the business of tracking solicitation prospects
    from the business of recording solicitation events and donations received. Services
    to handle donations and record interactions to elicit donations received could
    use the service that tracks solicitation prospects in some way.


    ## Context Independence Check


    When other teams show up and want to call your service, are you nervous? Do you
    start asking questions like:


    - What are you calling before us and after us?

    - Why are you calling us?

    - Exactly what business process are we going to be a part of, and what do you
    expect us to do?


    These are all red-flags that your service isn’t truly context independent. It
    makes assumptions about the business conditions under which it’s being called.
    A well-defined service should be agnostic as to when/how it’s called. If it has
    its inputs and resources, and the inputs are valid, it does its job; that’s it.
    The reaction you should have when other teams show up and want to call your service
    should be: “Here’s the doc. Please let us know if you have questions. Bye….”


    More detailed questions to ask along these lines:


    - Does your service have multiple consumers? Could it without ill effects?

    - Does your service care if it’s executed in batch instead of indirectly initiated
    by a user web application?

    - Do you spend time analyzing the call flow between services? The only developers
    doing that should be those working on process services, which often consume other
    services to complete their work.


    The answers to these questions may very well indicate that your service is not
    as context independent as it should be. If you agonize over which service should
    perform a given activity, maybe that activity needs its own service.


    ## Microservices are not about size


    The prefix ‘micro’ in microservices is unfortunate. It has everybody concerned
    with the size of the code base rather than how well-defined the service mission
    is.


    Microservices architecture is more about a service having a single functional
    purpose. It just so happens that with a single purpose, the code base is usually
    smaller. Put another way, a small code base is a byproduct of microservices architecture,
    not an end-goal in and of itself.


    What is a line? Choose any service as an example. Write it in `Java`, and you’ll
    get a certain number of lines. Write the same service with the same features in
    `C`, and you’ll likely get a larger number of lines as it’s a more verbose platform.
    Write the same service in `assembly` (not that you would choose to do that) and
    you’ll get a boat-load more lines. Does the technical platform/language choice
    make the `C` or `assembly` versions any less of a microservice? Definitely not.


    ## Designing to accommodate failure


    With traditional architectures, most calls are local. If the application is up
    to make the call, resources are generally available to service it. With microservices
    architecture, it’s common for services to rely on other services as resources.
    We need to design for the possibility that a dependent service is down.


    Designing for failure happens in layers. The first line of defense against failure
    is horizontal scaling/clustering. That is, running several copies of your services
    on different virtual machines, thus increasing the probability that at least one
    copy of a service is available for consumers. The likelihood that the entire cluster
    is down is less if there are multiple copies of that service running. We do this
    with traditional applications as well.


    There are legitimate reasons for a cluster to be down. It might be down for maintenance,
    or a resource it depends on may be down in its entirety. Bottom line: horizontal
    scaling isn’t enough of a defense against outages in a microservices world.


    Fail sooner than later. Have you ever surfed to an unavailable site? Typically,
    after 60 or 90 seconds, your browser tells you that the service isn’t available.
    The same thing happens with web service calls, such as those that microservices
    make.

