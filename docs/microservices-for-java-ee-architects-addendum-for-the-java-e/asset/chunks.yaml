    Spring Boot has an add-on called [Actuator](https://spring.io/guides/gs/actuator-service/).
    This add-on provides preconfigured health checks, performance metrics, and diagnostics.
    If you’re using Spring Boot, you should use Actuator. Note that if your application
    has custom health checks, it’s relatively easy to write an adapter so that these
    custom health checks will work with Actuator. All that’s required is to implement
    the HealthIndicator interface, which requires one method. You can find an example
    [here](https://github.com/Derek-Ashmore/moneta/blob/master/moneta-springboot/src/main/java/org/moneta/config/springboot/ActuatorHealthIndicator.java).


    Dropwizard


    [Dropwizard](http://www.dropwizard.io/) packages Java web applications into a
    single executable jar file that can be executed via a single command:


    java –jar myApp.jar server myAppConfig.yaml


    That deployable jar contains an embedded Jetty container and contains every dependency
    class needed to run your application. Note that Dropwizard also requires additional
    arguments. The server argument specifies that the application is to be run as
    an HTTP server. The yaml file input is your configuration. While not strictly
    required, it’s where container configuration items are listed.


    Like Spring Boot, Dropwizard requires an application configuration class with
    a main()that loads an application configuration, installs health checks, and activates
    performance metrics collection and [JMX](https://docs.oracle.com/javase/tutorial/jmx/overview/).
    You can find an example Dropwizard application class [here](https://github.com/Derek-Ashmore/moneta/blob/master/moneta-dropwizard/src/main/java/org/moneta/config/dropwizard/MonetaDropwizardApplication.java).


    The application class also defines any servlets or filters needed by the application.
    In this world, servlets and filters are not defined in the web.xml configuration
    file. An example servlet configuration can be found in listing 3.7\. An example
    filter configuration can be found in listing 3.8.


    Listing 3.7: Dropwizard Servlet Configuration example


    ServletHolder topicHolder = new ServletHolder(Source.EMBEDDED);


    topicHolder.setHeldClass(MonetaServlet.class);


    topicHolder.setInitOrder(0);


    topicHolder.setInitParameter(


                MonetaServlet.CONFIG_IGNORED_CONTEXT_PATH_NODES, "moneta,topic");


    environment.getApplicationContext()


    .getServletHandler()


    .addServletWithMapping(topicHolder, "/moneta/topic/*");


