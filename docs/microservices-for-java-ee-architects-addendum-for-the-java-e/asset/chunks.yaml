    我建议在消息传递中使用 [AMQP](https://www.amqp.org/) 而不是原生 JMS。JMS 是特定平台的（仅限 Java），这违背了微服务架构对技术栈无关性的优势。在工具支持方面，大多数人认为
    [JMS api](https://docs.oracle.com/javaee/6/tutorial/doc/bncdr.html) 足够简单可以直接使用。Spring
    batch 提供了 [`JMSTemplate`](http://docs.spring.io/spring/docs/current/javadoc-api/org/springframework/jms/core/JmsTemplate.html)
    和 [`RabbitTemplate`](http://docs.spring.io/spring-amqp/api/org/springframework/amqp/rabbit/core/RabbitTemplate.html)
    来辅助消息生产。


    ## 服务调用中者 (Service Call Mediator)


    服务应该具有足够的韧性，以便在发生故障时部分运行。核心思想是提供降级服务优于不提供服务。换句话说，我们的设计是在发生故障时提供部分可用性。一个例子是在飞机上销售
    WiFi 服务的业务。客户通过信用卡支付小额费用并接收服务。如果信用卡支付处理功能不可用，那么为该客户提供 WiFi 服务可能在业务上是合理的，而不是通过拒绝服务来激怒他们。中者模式是[设计模式
    (Design Patterns)](https://en.wikipedia.org/wiki/Design_Patterns) 一书中定义的“四人帮”行为模式之一。服务调用中者模式的一个示例实现可以在我的
    GitHub 项目 [TaskMediator](https://github.com/Derek-Ashmore/TaskMediator) 中找到，它是开源的。


    图 2.6：服务调用中者模式


    ![figure-2-6-Service-Call-Mdiator-Pattern-Algorithm.jpg](img/00012.jpeg)


    由于启动服务接收到默认/正常响应，它会照常处理。启动服务中提供部分功能所需代码量被降最低。从启动服务的角度来看，并没有发生错误。然而，服务调用中者记录了错误并启动了任何所需的支持告报。


    对于想要更多代码级示例的人，列表 2.3 提供了一个使用 `TaskMediator` 的服务调用中者模式的示例。


    列表 2.3：使用 `TaskMediator` 的服务调用中者算法示例


    ```

    TaskMediator<String> taskMediator = new TaskMediator<String>(DEFAULT_RESPONSE);


    MyCallable callable = new MyCallable();


    String callResult = taskMediator.invoke(callable);

    ```


    注意，可以将服务中者模式与断路器模式结合。通过这种方式，你获得了更早失败且消耗资源更少的处，以及提供部分功能的优势。如何使用 [CircuitBreaker](https://github.com/Derek-Ashmore/CircuitBreaker)
    完成此点的示例可以在列表 2.4 中找到。


    列表 2.4：结合服务调用中者与 CircuitBreaker 的示例


    ```

    DefaultCircuitBreakerAlgorithm algorithm = new DefaultCircuitBreakerAlgorithm(10L,
    2L);


    Circuit<String> circuit = new Circuit<String>(algorithm);


    MyCallable myCallable = new MyCallable();


    CallableCircuit<String> circuitCallable = new CallableCircuit<String>(circuit,

    myCallable);


    TaskMediator<String> taskMediator = new TaskMediator<String>(DEFAULT_RESPONSE);


    String callResult = taskMediator.invoke(circuitCallable);

    ```


    ## 为性能而设计


    在微服务架构中，有大量的网络流量。这种增加的网络流量会导致架构师对性能产生担忧。毕竟，与本地方法调用相比，服务调用的代价是非常昂贵的。此外，由于架构师可能会“假设”微服务架构使用的是细粒服务，这也会加剧他们的担忧。但这种假设是错误的。你在
    SOA 中中学到的所有关于服务是粗粒度的知识仍然适用；但即使是粗粒度的服务调用，网络流量也会随着微服务架构而增加。幸运的是，我们通可以使用一些设计策略来缓解服务调用流量增加对性能的影响。


    ### 针对性能的编码模式


    有几种编码模式可以帮助缓解服务调用流量对性能的影响。我将带你了解它们。


    这些模式中的一种——通过消息分发，在前一节中讨论过的一种故障设计模式，在这里不再重复描述。它也是一种性能模式，因为它通过将工作离线化，为用户提供了感知性能提升，因为他们看到的工作部分变短了。


    ### 后端到前端 (API 网关)


    “后端到前端”模式通过确保微服务流量位于你的局域网而不是公网中来提高性能。该模式使用网关服务来合并 Web 应用程序/用户界面产品的微服务调用。其理念是应用程序的浏览器部分将对其应用服务提供者发起一次或两次调用。该提供者将执行完成
    Web 应用程序用户请求的任务所需的众多微服务调用（直接或间接地）。


    我使用“应用服务提供者”这一术语来描述那个合并用户界面调用和响应的网关服务。


    这种模式的另一个名称是“API Gateway”。然而，我不使用那个术语，因为 API 网关模式与 API 网关产品（例如 [WSO2](http://wso2.com/)）之间通常存在混淆。API
    网关产品关于路由和治理，而不是关于任何种调用合并活动。我专门指的是模式本身。


    应用服务提供者合并服务调用。也就是说，对它们的调用可能意味着对你微服务库中多个服务的调用。来自这些微服务调用的任何数据都会被合并并返回给调用者。所有频繁的微服务流量都在你的局域网内，这可以由你的网络工程师进行适当调优。该局域网可以进行扩展，以为微服务架构所需的额外流量提供服务。


    图 2.7：后端到前端模式


    ![](img/00013.jpeg)


    是的，这意味着合并后的调用可能会返回较量的数据。让我们详细分析一下。服务调用的网络部分成本可以分为两部分：与服务主机建立连接的成本，然后是请求/响应的数据传输。通过合并服务调用，后端到前端极大地减少了流量中的连接建立部分。传输成本也可能降低，因为网关服务会筛选所有微服务的输出并精简结果，仅包含特定
    Web 应用程序运行所需的内容。例如，核心服务提供调用者不需要的业务主题信息并不罕见。这些“额外”信息会由应用网关管理器过滤掉，不会发送到浏览器。通过这种方式，成本的数据传输部分得到了优化。


    不要将微服务流量直接暴露给浏览器。这是一个糟糕的主意和反模式。请改用“后端到前端”模式，而不是直接将你的微服务库暴露给浏览器。你无法控制外部网站浏览器与你的服务库之间的网络。用户将根据他们连接互联网的方式获得不同的性能体验。你将处于无法无法帮助他们的位置。仅就此这一点，所有的浏览器服务调用都应该进行合并。


