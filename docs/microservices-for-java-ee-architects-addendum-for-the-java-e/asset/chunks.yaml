  trans: "\n在 Oracle JVM 中，可以通过 `HeapDumpOnOutOfMemoryError` 启动选项在生成 `OutOfMemoryError`\
    \ 时触发内存转储。这种方式相当局限，因为该事件只会发生一次。如果 JVM 从内存短缺中恢复，后续发生的情况将不再生成堆转储。\n\n监控已部署服务的并发负载。这些信息对于容量规划非常重要。并发负载的增加会增加所需的内存，并通常会增加平均事务时间。在过去的几年里，我曾使用\
    \ [Admin4J](http://admin4j.net/doc/unexpectedLoad.html) 在 JVM 内部监控并发负载。如今，随着云厂商提供扩展能力，从\
    \ JVM 外部监控负载可能更有意义。\n\n资源消耗问题的警报通常通过日志管理软件处理。也就是说，这些“警报”被记录在 `ERROR` 级别的日志中，然后由日志管理软件启动某种类型的警报（例如发送电子邮件或创建工作工单）给管理员。\n\
    \n# 日志与错误处理\n\n在微服务架构中，能够轻松搜索所有服务的日志至关重要。在那个世界里，部署单元的数量呈指数级增长，支持人员手动搜索这些部署单元的单个日志文件是不现实的。在微服务架构中，使用某种日志管理系统已从“有则更好”变为“绝对要求”。\n\
    \n日志管理软件（如 [LogStash](https://www.elastic.co/products/logstash) 或 Splunk）会收集单个日志条目并进行集中存储。此外，这些工具为支持人员提供了搜索日志和配置自动警报的集中方法。日志管理软件检测到的错误生成某种类型的支持工单进行调查，或者向中央支持邮箱账户发送电子邮件，这在现实中并并不少见。\n\
    \n## 在你抛出的异常中捆绑所需的信息\n\n记录日志的主要原因之一是提供解决由异常引起的 Bug 所需的信息。这些额外的日志代码增加了额外风险，因为异常代码通常没有经过充分的测试。因此，在格式化异常消息期间，发生异常（例如来自\
    \ `NullPointerException` 引起）的概率通常比非异常代码更高。\n\nApache Commons Lang 从 `V3.0` 开始提供了上下文异常能力（contexted\
    \ exception ability），通过这种简单且低风险的方式在异常本身中包含额外信息，从而降低了这种风险（参见 Commons Lang 中的 `ContextedException`\
    \ 和 `ContexedRuntimeException` 类）。当记录此类异常时，这些额外信息将会存在。请考虑列表 3.1 中的示例。\n\n### 列表\
    \ 3.1：上下文异常示例\n\n```\nthrow new ContextedRuntimeException(“Error creating application”,\
    \ exception)\n  .addContextValue(“application id”, applicationId)\n  .addContextValue(“customer\
    \ id”, customerId);\n```\n\n当记录列表 3.1 中的异常时，上下文标签和值将自动出现在日志中，连同错误消息和堆栈跟踪。请注意，应用程序代码通过添加条件日志逻辑或格式化逻辑并不会增加派生异常的风险。如果没有上下文异常能力，开发者将不得不添加日志代码来提供解决\
    \ Bug 所需的信息。\n\n## 仅记录一次事务异常\n\n多次记录异常会极大地膨胀你的日志并并与报告缺陷相关的特定异常变得难以查找。你可以通过仅在入口处记录异常来避免重复日志消息的问题。例如，可以很容易实现一个\
    \ servlet 过滤器，它可以记录任何网络事务的异常。这确保了异常只被记录一次。此建议假设你已经像本章前面提到的，将解决错误所需的任何额外信息捆绑到了异常本身中。列表\
    \ 3.2 展示了此类 servlet 过滤器。\n\n### 列表 3.2：日志 Servlet 过滤器示例\n\n```\npublic void doFilter(ServletRequest\
    \ request, ServletResponse response, FilterChain chain) throws IOException, ServletException\
    \ {\n    try {\n        chain.doFilter(request, response);\n    }\n    catch (Throwable\
    \ t) {\n        logger.error(\"Web Transaction Error\", t);\n        ServletUtils.reThrowServletFilterException(t);\n\
    \    }\n}\n```\n\n来源：Admin4J 中的类 `net.admin4j.ui.filters.ErrorLoggingFilter` (http://www.admin4J.net)\n\
    \n这种技术减少了应用程序代码并增加了生成的异常被记录的机会。此外，如果你利用具有错误处理过滤器的 Admin4J 产品，你将获得异常时的请求 URL 以及任何请求和会话属性的导出。换句话说，你可以利用开源产品来实现这一点，而不是为了这个目的创建自己的\
    \ servlet 过滤器。\n\n顺便提到，你还需要为批作业类、EJB 类和消息驱动豆（Message-Driven beans）提供类似的架构支持。将异常日志交给应用程序代码会增加异常未能被正确记录的概率。\n\
    \n## 不要将事务日志与普通应用程序日志混杂\n\n事务日志（例如，用户 Fred 更改了客户 Acme 的地址）有不同的目的。通常，普通业务流程需要事务日志，它们并不是针对产品支持的。大多数日志产品都允许你为此目的将事务日志重定向到单独的输出。\n\
    \n注意，日志保留和存储问题是一个完全独立的话题。大多数日志产品支持以多种格式存储日志，包括文件或数据库格式。应用程序代码应该只关注发布日志消息，而不应关注它们如何存储的细节，或它们被保留多久。\n\
    \n## 提供一个可以在部署时被覆盖的默认日志配置\n\n这纯粹是为了开发者的便利，他们可能需要运行构建但可能没有花精力配置本地部署。此外，开发者无法预测特定部署的日志需求。因此，让管理员能够在部署时轻松配置日志是非常重要的。\n\
    \n# 发布变更事件\n\n由于每个微服务都有自己的数据库，对于多个服务都需要的通用业务数据，有两种处理方案。（我之前强调过这个问题。）第一种方案（我更倾向的方案）是不重复该通用数据，而是在需要时调用维护该数据的服务。第二种方案是将通用业务数据“复制”到所有需要的服务中。对于那些选择在服务之间“复制”通用业务数据而不是嵌套调用服务的方案，复制通常通过发布/订阅消息来实现。\n\
    \n维护通用业务数据的微服务会在一致的格式下，在建立的主题发布任何变更（例如添加、更改或删除）。例如，大学中负责维护校园信息的微服务（例如一个 `Campus`\
    \ 微服务）可能会在 `CampusEvent` 主题下发布新校区的添加或现有校区状态变更。\n\n任何感兴趣的服务都会监听该主题并处理任何发布的变更。通常，监听这些变更的服务需要发布一个监听器来监控该主题。\n"
- fmt: "\nDevelop a way to refresh all copied data from its source. Copy processes\
    \ can have defects too. When that happens, a ‘copy’ of data will become out of\
    \ sync. In our example, the `Course` service copy of campus information won’t\
    \ match what the `Campus` service has if an event is somehow missed or the recording\
    \ of a change errors out in the `Course` service. As all code has defects, this\
    \ issue will happen if you copy data between services. For that reason, support\
    \ developers need a way to refresh a data copy if it gets corrupted.\n\n# Packaging\
    \ Options for Microservices\n\nIn years past, with traditional web application\
    \ deployments, it was common in some organizations to deploy multiple web applications\
    \ per container. Often this was a result of licensing costs for commercial containers\
    \ which incent reducing the number of containers as much as possible. That combination\
    \ strategy doesn’t happen in a microservice world. Microservices are deployed\
    \ as independent processes, and that means separate JVMs.\n\nThere are multiple\
    \ products that facilitate deploying java services as a single process. The two\
    \ most popular products at the time of this writing appear to be `Spring Boot`\
    \ and `DropWizard`. Yes, there are others and they work just fine, but I’m concentrating\
    \ on the two products that are most popular at the time of this writing.\n\nIn\
    \ addition to those two products, I’ll also discuss a virtualization product useful\
    \ for microservices; it’s called `Docker`. `Docker` standardizes processes and\
    \ provides supporting tools to support mass deployments of services. We’re going\
    \ to see that `Docker` goes a long way toward decoupling developers from operations.\n\
    \n# Spring Boot\n\n[`Spring Boot`](http://projects.spring.io/spring-boot/) packages\
    \ java web applications into a single executable jar file that can be executed\
    \ via a single command: `java –jar myApp.jar`.\n\nThat deployable jar contains\
    \ an embedded container (either `Tomcat` or `Jetty`) and contains every dependency\
    \ class needed to run your application.\n\nBesides your service, `Spring Boot`\
    \ requires you to create an `Application` class implementing `main()` so that\
    \ it can be run from a command prompt. That application class handles most configuration\
    \ items (connection pools, number of worker threads, etc.). In addition, you can\
    \ add configuration properties specific to your application. If you do so, make\
    \ sure you steer clear of name conflicts for property names that `Spring Boot`\
    \ already honors (list [here](http://docs.spring.io/spring-boot/docs/current/reference/html/common-application-properties.html)).\
    \ To make sure, I’ve adopted the habit of using my application name as the first\
    \ node in the property (e.g., `moneta.server.max.threads`). An example of `application.properties`\
    \ can be found [here](https://github.com/Derek-Ashmore/moneta/blob/master/moneta-springboot/src/main/resources/config/application.properties).\n\
    \n`Spring Boot` does automatically consume an `application.properties` file in\
    \ the class path. These properties are mainly application-specific. This mechanism\
    \ allows you to configure at least application specifics from outside. Everything\
    \ else is coded in the application class. Let’s consider an example of a spring\
    \ boot application class that I’ve open-sourced and published [here](https://github.com/Derek-Ashmore/moneta/blob/master/moneta-springboot/src/main/java/org/moneta/config/springboot/MonetaSpringBootApplication.java).\
    \ You can find an example servlet definition with listing 3.3 and a filter definition\
    \ example in listing 3.4.\n\n### Listing 3.3: Spring Boot Servlet Configuration\
    \ example\n\n```\n@Bean\npublic ServletRegistrationBean monetaServlet() {\n  \
    \  ServletRegistrationBean registration =\n        new ServletRegistrationBean(new\
    \ MonetaServlet(),\n            \"/moneta/topic/*\");\n    registration.addInitParameter(\n\
    \            MonetaServlet.CONFIG_IGNORED_CONTEXT_PATH_NODES, \"moneta,topic\"\
    );\n    return registration;\n}\n```\nSource: Class `org.moneta.config.springboot.MonetaSpringBootApplication`\
    \ from Moneta (https://github.com/Derek-Ashmore/moneta)\n\n### Listing 3.4: Spring\
    \ Boot Filter Configuration example\n\n```java\n@Bean\npublic FilterRegistrationBean\
    \ monetaPerformanceFilter() {\n    FilterRegistrationBean registration =\n   \
    \     new FilterRegistrationBean(new MonetaPerformanceFilter(),\n            monetaServlet(),\
    \ monetaTopicListServlet());\n    return registration;\n}\n```\nSource: Class\
    \ `org.moneta.config.springboot.MonetaSpringBootApplication` from Moneta(https://github.com/Derek-Ashmore/moneta)\n\
    \nAs you might expect, this class has a `main` that loads an application configuration,\
    \ installs health checks, and activates performance metrics collection and [`JMX`](https://docs.oracle.com/javase/tutorial/jmx/overview/).\
    \ In addition, this class defines several servlets and servlet filters. With traditional\
    \ web applications, these are defined in the `web.xml` configuration file; but\
    \ `Spring Boot` configuration is different.\n\n`Spring Boot` uses `Logback` logging\
    \ by default. At this level, a logging configuration is likely for developer convenience.\
    \ When the service is deployed, a production logging configuration will likely\
    \ override what’s placed in. If you use a abstraction like `Slf4j`, then providing\
    \ a default logging is as easy as including a [`logback.xml`](https://github.com/Derek-Ashmore/moneta/blob/master/moneta-springboot/src/main/resources/logback.xml)\
    \ file in the spring boot.\n\n`Spring Boot` has a way to configure database pools\
    \ using the `application.properties`. The [reference](http://docs.spring.io/spring-boot/docs/current/reference/html/common-application-properties.html)\
    \ has a complete list, but I’ve included a sample in 3.5.\n\n### Listing 3.5:\
    \ Spring Boot Connection application.properties\n\n```properties\n# Connection\
    \ pool definition\nspring.datasource.driver-class-name=org.hsqldb.jdbc.JDBCDriver\n\
    spring.datasource.name=test\nspring.datasource.url=jdbc:hsqldb:mem:sample\nspring.datasource.username=SA\n\
    spring.datasource.password=\nspring.datasource.continue-on-error=true\n# Pooling\
    \ properties\nspring.datasource.max-active=5\nspring.datasource.min-idle=1\nspring.datasource.test-on-borrow=true\n\
    spring.datasource.test-on-return=false\nspring.datasource.test-while-idle=false\n\
    spring.datasource.time-between-eviction-runs= 1\nspring.datasource.validation-query=SELECT\
    \ CURRENT_DATE AS today, CURRENT_TIME AS now FROM (VALUES(0))\n```\n\nIn high-volume\
    \ deployments, it’s often necessary to configure lower level container settings,\
    \ such as minimum, maximum, and idle timeout settings for container worker threads.\
    \ There are other settings that you need to be concerned with in high-volume deployments,\
    \ but here I want to illustrate how you might do that using `Spring Boot`. This\
    \ can be accomplished by overriding the `servletContainer` method in the application\
    \ class. An example of how to do this can be found in my [sample](https://github.com/Derek-Ashmore/moneta/blob/master/moneta-springboot/src/main/java/org/moneta/config/springboot/MonetaSpringBootApplication.java)\
    \ and in listing 3.6.\n\n### Listing 3.6: Spring Boot Container Configuration\
    \ example\n\n```java\n@Bean\npublic EmbeddedServletContainerFactory servletContainer()\
    \ {\n    JettyEmbeddedServletContainerFactory factory = new JettyEmbeddedServletContainerFactory();\n\
    \    factory.addServerCustomizers(new JettyServerCustomizer() {\n        public\
    \ void customize(final Server server) {\n            // Tweak the connection pool\
    \ used by Jetty to handle incoming\n            // HTTP connections\n        \
    \    Integer localServerMaxThreads = deriveValue(serverMaxThreads,\n```\n"
  raw: 'Develop a way to refresh all copied data from its source. Copy processes can
    have defects too. When that happens, a ‘copy’ of data will become out of sync.
    In our example, the Course service copy of campus information won’t match what
    the Campus service has if an event is somehow missed or the recording of a change
    errors out in the Course service. As all code has defects, this issue will happen
    if you copy data between services. For that reason, support developers need a
    way to refresh a data copy if it gets corrupted.


    Packaging Options for Microservices


    In years past, with traditional web application deployments, it was common in
    some organizations to deploy multiple web applications per container. Often this
    was a result of licensing costs for commercial containers which incent reducing
    the number of containers as much as possible. That combination strategy doesn’t
    happen in a microservice world. Microservices are deployed as independent processes,
    and that means separate JVMs.


    There are multiple products that facilitate deploying java services as a single
    process. The two most popular products at the time of this writing appear to be
    Spring Boot and DropWizard. Yes, there are others and they work just fine, but
    I’m concentrating on the two products that are most popular at the time of this
    writing.


    In addition to those two products, I’ll also discuss a virtualization product
    useful for microservices; it’s called Docker. Docker standardizes processes and
    provides supporting tools to support mass deployments of services. We’re going
    to see that Docker goes a long way toward decoupling developers from operations.


    Spring Boot


    [Spring Boot](http://projects.spring.io/spring-boot/) packages java web applications
    into a single executable jar file that can be executed via a single command: java
    –jar myApp.jar


    That deployable jar contains an embedded container (either Tomcat or Jetty) and
    contains every dependency class needed to run your application.


    Besides your service, Spring Boot requires you to create an Application class
    implementing main() so that it can be run from a command prompt. That application
    class handles most configuration items (connection pools, number of worker threads,
    etc.). In addition, you can add configuration properties specific to your application.
    If you do so, make sure you steer clear of name conflicts for property names that
    Spring Boot already honors (list [here](http://docs.spring.io/spring-boot/docs/current/reference/html/common-application-properties.html)).
    To make sure, I’ve adopted the habit of using my application name as the first
    node in the property (e.g., moneta.server.max.threads). An example of application.properties
    can be found [here](https://github.com/Derek-Ashmore/moneta/blob/master/moneta-springboot/src/main/resources/config/application.properties).


    Spring Boot does automatically consume an application.properties file in the class
    path. These properties are mainly application-specific. This mechanism allows
    you to configure at least application specifics from outside. Everything else
    is coded in the application class. Let’s consider an example of a spring boot
    application class that I’ve open-sourced and published [here](https://github.com/Derek-Ashmore/moneta/blob/master/moneta-springboot/src/main/java/org/moneta/config/springboot/MonetaSpringBootApplication.java).
    You can find an example servlet definition with listing 3.3 and a filter definition
    example in listing 3.4.


    Listing 3.3: Spring Boot Servlet Configuration example


    @Bean


    public ServletRegistrationBean monetaServlet() {


          ServletRegistrationBean registration =


               new ServletRegistrationBean(new MonetaServlet(),


                      "/moneta/topic/*");


          registration.addInitParameter(


                MonetaServlet.CONFIG_IGNORED_CONTEXT_PATH_NODES, "moneta,topic");


           return registration;


    }


    Source: Class org.moneta.config.springboot.MonetaSpringBootApplication from Moneta
    (https://github.com/Derek-Ashmore/moneta)


    Listing 3.4: Spring Boot Filter Configuration example


    @Bean


    public FilterRegistrationBean monetaPerformanceFilter() {


         FilterRegistrationBean registration =


               new FilterRegistrationBean(new MonetaPerformanceFilter(),


                   monetaServlet(), monetaTopicListServlet());


          return registration;


    }


    Source: Class org.moneta.config.springboot.MonetaSpringBootApplication from Moneta(https://github.com/Derek-Ashmore/moneta)


    As you might expect, this class has a main that loads an application configuration,
    installs health checks, and activates performance metrics collection and [JMX](https://docs.oracle.com/javase/tutorial/jmx/overview/).
    In addition, this class defines several servlets and servlet filters. With traditional
    web applications, these are defined in the web.xml configuration file; but Spring
    Boot configuration is different.


    Spring Boot uses Logback logging by default. At this level, a logging configuration
    is likely for developer convenience. When the service is deployed, a production
    logging configuration will likely override what’s placed in the spring boot deployable.
    Look at the logging configuration at this level as a ‘default,’ but nothing more.


    If you use a logging abstraction like Slf4j, then providing a default logging
    configuration is as easy as including a [logback.xml](https://github.com/Derek-Ashmore/moneta/blob/master/moneta-springboot/src/main/resources/logback.xml)
    file in the Spring Boot jar. Spring Boot will already list Logback as a dependency
