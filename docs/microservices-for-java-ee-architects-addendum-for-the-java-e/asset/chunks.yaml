  trans: "\n开发一种从源头刷新所有拷贝数据的方法。拷贝过程也存在缺陷。当这种情况发生时，数据的“副本”将会不同步。在我们的示例中，如果由于某种原因丢失了事件，或者\
    \ `Course` 服务中的更改记录出错，那么 `Course` 服务的校园信息副本将与 `Campus` 服务所拥有的不匹配。由于所有代码都存在缺陷，如果你在服务之间拷贝数据，这个问题就会发生。因此，支持性开发人员需要一种方法，在数据副本损坏时对其进行刷新。\n\
    \n# 微服务的打包选项\n\n在过去的几年里，采用传统的 Web 应用部署方式，在某些组织中，每个容器内部署多个 Web 应用是常见现象。这通常是由于商业容器的许可成本导致的，促使人们尽可能减少容器的数量。这种组合策略在微服务世界中是不存在的。微服务作为独立的进程进行部署，这意味着会有独立的\
    \ JVM。\n\n有多个产品可以方便将 Java 服务部署为单个进程。在本文写作期间，最流行的两个产品似乎是 `Spring Boot` 和 `DropWizard`。是的，还有其他产品，且它们运行良好，但我专注于写作此时最流行的这两个产品。\n\
    \n除了这两个产品外，我还将讨论一种对微服务非常有用的虚拟化产品；它被称为 `Docker`。`Docker` 标准了进程并提供了辅助工具来支持服务的大规模部署。我们将看到\
    \ `Docker` 在很大程度上实现了开发人员与运维的解耦。\n\n# Spring Boot\n\n[`Spring Boot`](http://projects.spring.io/spring-boot/)\
    \ 将 Java Web 应用打包成一个可执行的单一 jar 文件，可以通过单个命令执行：`java –jar myApp.jar`。\n\n该可部署的 jar\
    \ 包含一个嵌入式容器（`Tomcat` 或 `Jetty`），并包含了运行你的应用程序所需的每一个依赖类。\n\n除了你的服务之外，`Spring Boot`\
    \ 还要求你创建一个实现 `main()` 方法的 `Application` 类，以便能够从命令行提示符运行。该应用程序类处理了大部分配置项（连接池、工作线程数等）。此外，你还可以添加特定于你应用程序的属性。如果这样做，请确保避开与\
    \ `Spring Boot` 已经遵循的属性名称发生冲突（列表见[此处](http://docs.spring.io/spring-boot/docs/current/reference/html/common-application-properties.html)）。为了确保万无一失，我养成了使用应用程序名称作为属性中第一个节点的习惯（例如，`moneta.server.max.threads`）。`application.properties`\
    \ 的示例可以在[此处](https://github.com/Derek-Ashmore/moneta/blob/master/moneta-springboot/src/main/resources/config/application.properties)找到。\n\
    \n`Spring Boot` 会自动消耗类路径下的 `application.properties` 文件。这些属性主要是应用程序特定的。这种机制允许你从外部配置至少应用程序特定的内容。所有其他内容都写在应用程序类中。让我们考虑一个我已开源并发布在[此处](https://github.com/Derek-Ashmore/moneta/blob/master/moneta-springboot/src/main/java/org/moneta/config/springboot/MonetaSpringBootApplication.java)的\
    \ Spring Boot 类示例。你可以在列表 3.3 中找到一个 servlet 定义示例，在列表 3.4 中找到一个过滤器定义示例。\n\n### 列表\
    \ 3.3：Spring Boot Servlet 配置示例\n\n```\n@Bean\npublic ServletRegistrationBean monetaServlet()\
