    微服务库通常根据业务能力组织。也就是说，它们是根据业务中重要的主题进行组织的。[领域驱动设计](https://en.wikipedia.org/wiki/Domain-driven_design)
    (DDD) 将这些主题称为领域。领域是一个分析性构造，本质上代表一个独立模型。如果需要，DDD 会将领域进一步拆分为子域，然后划分为边界上下文（bounded
    contexts）。子域只是更详细、更具体的领域。边界上下文代表了构成领域或子域的物理构件。你可以将微服务视为边界上下文的一个示例。例如，一个学院或大学的领域划分可能如图
    1.3 所示。


    ### 图 1.3：领域示例


    ![Domain-Oriented Architecture Sketch.jpg](img/00004.jpeg)


    另一个适用于微服务架构的理论构架是[康威法则](https://en.wikipedia.org/wiki/Conway%27s_law)。康威法则（1968
    年）基本上指出，企业构建的应用程序遵循其内部的通信结构。微服务架构也不例外。换句话说，微服务遵循组织架构图。


    微服务通过将大型业务问题拆分为许多较小的业务问题来发挥作用。通过与你已经熟悉的传统的 Web 应用架构进行比较，更容易理解微服务架构的样貌。


    ## 使用微服务架构的益处


    微服务减少/消除了技术栈锁死。我们中有多少人见过进行一次 `JDK` 版本升级简直像需要天降神迹？在传统世界中，这需要系统管理员（通常还有其他开发团队）的协调，而且非常困难。在微服务世界中，让不同的服务运行不同版本的
    `JDK` 是很容易的；服务可以独立地进行升级。


    技术锁定的点远不止于版本升级。在这个世界里，服务可以选择不同的数据库平台，因为它们实际上“拥有”这些平台。某人可能使用像 `Cassandra` 这样的 NoSQL
    数据库，而另一个人可能坚持使用关系型数据库。


    尽管如此，组织在可选数据库选择上确实可以获得规模效应。数据库需要备份和调优，有时还需要执行恢复。这需要技术专长，大多数组织出于经济考虑会将这些工作集中管理。仅仅因为做出不同选择的障碍之一被移除，并不意味着你应该疯狂地拥有
    50 个不同的数据库平台。从管理的角度来看，对技术选择设定边界或准则非常重要，以确保创建的内容是可以支持的。


    微服务架构加速了交付市场。也就是说，使用微服务架构后，整体开发生产率将提高。例如，根据最近的报告，Amazon 的部署率达到每天 23,000 次。Netflix
    的部署率报告为每天 5,500 次。公平地说，大多数大规模实施微服务的组织也实施了持续交付和 DevOps。可以合理预期，Amazon 和 Netflix
    的 DevOps 和持续交付的实现也为他们高部署率做了贡献。


    额外的生产力取决于开发者通信开销的减少。也就是说，开发者能够在开发模式下更多地“埋头苦干（heads down）”，而不需要与他人频繁协调工作。


    为了实现这种通信开销的减少，你必须精通合约管理（contract management）。也就是说，你需要擅长详细地描述将要实现的合约以及这些服务操作将实现的行为。开发者不应该就接口问题与其他团队沟通；他们应该能够专注于工作。


    每个团队都能独立工作，而不会受到其他团队的强制交互影响。也就是说，他们有自己的开发/部署计划。


    作为架构师，你的大部分时间将花在合约管理上；即详细描述合约规范，详细到开发者可以实现。你从开发者那里收回的问题是对架构师的反馈。如果问题的数量和范围很小，说明合约规范得得充分。如果开发者感到困惑，说明合约规范需要改进。


    你必须精通合约管理。合约管理为你的开发团队提供了独立性，并将他们从通信开销中解放出来。那份合约规范也可以作为消费者的服务文档，减轻生产者和消费者的通信开销。正是通信开销的减少提供了开发速度的提升。


    开发者每次应该只分配到一个且仅一个服务。这减少了开发者的上下文切换时间并增加了速度。


    微服务提供了人员配置的灵活性。微服务开发团队规模小且目标聚焦。开发者每次*只*负责一个服务的工作。该服务应该有一个坚定的合约，开发者据此编写代码，并且最好带有容器化的交付物（即
    `Docker`）。要点在于，他们主要在进行埋头开发。除了与工作该服务的其他开发者外，他们不应该承担（或不必承担）通信开销。


    他们作为一个独立的团队工作，与所有其他服务团队完全是异步的。结合他们具有低通信开销和定义明确的交付物这一事实，他们可以在世界上任何地方、任何时区工作。无论他们是在附近的公司办公室内外包，还是在海外，并不重要。


    鉴于团队的工作局限于服务的特定需求，对代码质量等的担忧至少被限制在较小的服务源码库中。换句话说，该团队能搞乱的代码量以及由此产生的维护问题是有限的。


    注意：微服务的开发可以更容易地外包！


    这也意味着你更好地免受不听话开发者（rogue developers）的侵害。我们都管理过产生不可维护代码的开发者；但通过微服务，不听话的开发者被限制在一个小而聚焦的代码库中，因此他们能造成的破坏是有限的。此外，如果该代码库很小、聚焦且定义良好，在需要时更容易被替换。你不会让不听话的开发者在
    50 万行的单体应用中肆虐，造成更大范围的影响。


    微服务提供了更好的可用性和恢复能力（如果实施良好的话）。微服务的依赖关系迫使开发者构建容错能力，并在设计和开发中将失败视为一等公民。故障和停机根据定义是局限在可识别的组件中的。我们将学习到，水平扩展单个服务的能力允许你缩短完全停机的时间。


    ## 使用微服务架构的劣势


    如果设计不当，微服务可能会更难管理。我们将看到，企业架构和合约管理是至关重要的。如果没有这些，采用微服务的益处将被大幅削减。我们将看到，采用 DevOps
    文化是规模实施微服务的前提。通常，采用微服务的组织也同样纳了持续交付。底线：实施微服务对于管理层以及开发者和架构师来说都是一次范式转移。


