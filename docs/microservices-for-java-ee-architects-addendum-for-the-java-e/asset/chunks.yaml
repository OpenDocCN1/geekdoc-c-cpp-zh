- fmt: '

    Microservices run in an independent process. In a Java- world, that means they
    run as an independent `JVM`. With traditional applications, it’s not uncommon
    to deploy several web applications into the same container; but that doesn’t happen
    for microservices. They need to be independent so they can scale to their individual
    needs. For example, one service might only need a three-node cluster to satisfy
    consumer demand while another service might need more nodes in its cluster. One
    service might need more memory per node in the cluster and need to be hosted differently
    than other services.


    Microservices also run in an independent process so they can be independently
    deployed or replaced without affecting other services. Your stereo system is a
    good analogy, even though it’s more hardware than software. When I replaced my
    speakers, none of the other components (e.g., receiver, monitor, Blu-ray player,
    etc.) were affected in any way. As long as their inputs and resources were correct,
    they did their job. The same was true when I replaced my receiver. Microservices
    should have the same level of independence and self-sufficiency.


    Another analogy that people use to describe microservices is the Linux operating
    system and its extremely componentized utilities. Yes, Linux uses standard input/output
    instead of web services, but it’s still a standardized interface. A good example
    is the `ls` utility. It lists directory entries. Yes, it has many options, such
    as filtering or the format of its output, but it has one and only one job.


    Microservices are often combined to provide full functionality needed by applications.
    As microservices have such a narrow focus, no single microservice can provide
    all the functionality needed for most applications. In fact, we’re going to see
    that it’s common for microservices to rely on other microservices to fulfill their
    service contract. Figure 1.1 graphically describes how microservices are leveraged
    to provide full application functionality. The arrows in the diagram represent
    call usage patterns.


    ### Figure 1.1: Microservice Architecture


    ![](images/00002.jpeg)


    We’re going to see that each microservice has its own data store or database.
    This eliminates coupling at the database level and ensures that database structure
    changes don’t impact more than one service. We’re going to see that the autonomous
    nature of microservices allow technology choices.


    For an excellent article on the definition of microservices architecture, consult
    [Microservices](http://martinfowler.com/articles/microservices.html) by Fowler
    and Lewis.


    ## Contrast with traditional application architectures


    Let’s contrast this with traditional application architectures, such as what was
    discussed in the Java EE Architect’s Handbook. Traditional application architecture
    is like a layer cake, as illustrated in Figure 1.2. Typically it has layers to
    provide a user interface, data access, and business logic; and depending on its
    feature set, it might have other additional layers. Another way to express this
    idea is that coupling is high.


    ### Figure 1.2: Traditional Web Application Architecture


    ![Traditional-Architecture-Macro.jpg](images/00003.jpeg)


    These layers are meant to be deployed and tested as a cohesive unit (typically
    as a `war` or `ear` file). While it may be possible to use portions of the code
    base outside of the application, that’s more the exception than the rule.


    The application scales as a unit. It’s not unusual for applications to have features
    with different audiences. For example, it’s not uncommon to have administrative
    features that only a few people use vs. more mainstream features that may be used
    by hundreds or thousands of users. Traditional architectures must scale the administrative
    function along with other more popular features as they are in the same deployable.
    For those not familiar with the term, a deployable is a runnable version of an
    application (e.g., a `war` or `ear` file).


    As a corollary to this idea, defects tend to spill over into unrelated features.
    For example, if one feature has a defect that monopolizes your database connection
    pool and makes the container inoperative, all other unrelated features in that
    application are also inoperative, even though they are unrelated from a business
    point of view.


    Typically, the entire codebase shares database resources. This means that changes
    to that database potentially impact the entire application code base. Yes, we
    try to insulate the application from these changes by separating out a data access
    layer, as discussed in the Java EE Architect’s Handbook, but that tactic isn’t
    always 100% effective. It’s not uncommon for database changes to require `Entity`
    class changes that potentially have effects on other layers.


    ## What is a Monolith?


    Typically, there are limits to how large and complex a code base can be before
    it starts to become unmaintainable. Applications that approach that point are
    called monoliths.


    Monoliths typically have long quality assurance / testing cycles for deployment.
    With monoliths, the feature set is so large that executing a full regression test
    takes users a large amount of time. Yes, automated testing sequences shorten up
    the process for development staff, but user QA testing often has a large manual
    component.


    With every change, monoliths often experience issues with unintended consequences.
    That is, you fix one issue and accidentally create new bugs as a result of that
    change. In this sense, fixing bugs in a monolith is like playing ‘whack-a-mole.’
    Yes, your automated unit tests and integration tests help to mitigate this issue,
    but that test harness is not 100% effective.


    Monoliths are typically married to their technical stack. That is, it’s much more
    difficult to upgrade or swap out a dependency in a monolith. For example, if the
    monolith uses the `Hibernate` ORM product for data access, it would be difficult
    to swap in a replacement ORM product (such as `iBatis`). Not only would partial
    use of `iBatis` make code for the application internally inconsistent; the testing
    effort would be fairly large for something that really doesn’t directly add business
    value.


    Burn-in time for new developers is much longer on monoliths as there is so much
    to learn. The code base is usually very large and interconnected. The sheer size
    of it introduces a learning curve for new developers, regardless of the technical
    libraries and frameworks involved.


    As a corollary to this point, developers cannot be transferred easily from one
    application to another. That learning curve is specific to each monolith. This
    facet of monoliths creates management constraints to allocating resources and
    shifting priorities to meet any changes in business priorities.


    Diagnosing memory and performance issues is often more difficult on monoliths
    as the haystack (size of the code base) is typically much larger. Finding memory
    leaks can be one of the most frustrating and time-consuming activities developers
    go through. Furthermore, the tooling often doesn’t directly reveal the code causing
    the leak, so manual analysis is involved. With microservices architecture, at
    least the size of the code base that could be the culprit is much less, leading
    to quicker diagnosis for memory leaks and a quicker resolution.


    QA test cycles for microservices, because they have a single functional purpose,
    are much shorter and more manageable. Microservices are typically focused enough
    that components of their technical stack can easily be upgraded or swapped out
    without affecting consumers of the service. As the code base is typically much
    smaller, it is often easier to diagnose memory issues and performance issues localized
    to one service.

