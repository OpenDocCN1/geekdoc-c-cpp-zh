- fmt: "\nYou do not need separate physical database servers/licenses for each microservice.\
    \ The goal is to remove coupling at the database level. Using separate database\
    \ schemas is enough to achieve this level of decoupling. Of course, it’s important\
    \ not to create any referential integrity rules (e.g., foreign key constraints)\
    \ between tables used by two different microservices as this is unwanted coupling.\n\
    \n# Chapter 2: Design Considerations for Microservices Architecture\n\nThis chapter\
    \ details important design considerations for microservices architecture. As with\
    \ any technology paradigm, it’s possible to write overly complicated and difficult-to-support\
    \ software using microservices architecture. This chapter will help you avoid\
    \ that.\n\nMost people implementing microservices do so using REST-style web services.\
    \ Hence, all examples I present will assume a RESTful web service interface. It\
    \ should be noted that REST isn’t a requirement for implementing microservices\
    \ architecture; any standardized interface will do. Most use REST for microservices\
    \ architecture because its reliance on resources (a.k.a. nouns) naturally lends\
    \ itself to microservice boundaries.\n\n## Service Boundaries\n\nThe most important\
    \ design consideration for a microservice is defining its mission. That is, defining\
    \ the single business purpose it has to fulfill. There are a couple of ways to\
    \ approach this topic. One is to identify service boundaries the same way you\
    \ identify REST service resources. Another is to identify service boundaries from\
    \ a domain-driven design perspective and refine your domain model into sub-domains\
    \ specific enough to fit when using them to define microservices. Between the\
    \ two, I usually think in terms of REST resources. It’s a natural fit anyway as\
    \ most users tend to implement microservices as RESTful web services.\n\n## Defining\
    \ a Microservice\n\nA microservice definition contains the following:\n\n*   Meaningful\
    \ name\n*   Business function of the service written in business terms\n*   RESTful\
    \ web service resource or resource hierarchy supporting the business function\n\
    *   Operation details such as:\n    *   request parameters\n    *   input post\
    \ data format\n    *   output data format\n*   Attributes retained about the resource\
    \ hierarchy\n*   Scope details\n    *   Explicit detail as to what business functions\
    \ are and are not managed by this service.\n\nLet’s work through an example. Take\
    \ the business concept of “Student” for a college or university. Those institutions\
    \ commonly have a need to record specifics about students (i.e., student name,\
    \ assigned student identifier, birth date, sex, addresses, email address, phone\
    \ numbers, etc.). There are more complicated business processes involving students\
    \ (e.g., registering them for classes, maintaining their transcript, processing\
    \ their payments, etc.), but for this example, let’s confine ourselves to merely\
    \ maintaining student personal information. This example service is visually depicted\
    \ in Figure 2.1.\n\n### Figure 2.1: Core Service Definition Example\n\n![D:\\\
    BusinessFiles\\Projects\\Microservices-Handbook-Addendum-eBook\\graphics\\needsGimpToMake600dpi\\\
    figure-2-1-Student-Service-Example-Hierarchy.jpg](images/00007.jpeg)\n\nThe service\
    \ name, `Students`, is in the center. To the left, there is a one-sentence description\
    \ of the service in business terms. All operations are detailed in terms of the\
    \ HTTP methods that support them (e.g., `PUT`, `POST`, `GET`, etc.). All supported\
    \ qualifications are listed on `GET` requests, such as `sort` and `maxEntries`.\
    \ All supported representation formats are listed, as well as supported HATEOAS\
    \ (short for Hypertext as the Engine of Application State) reference link. To\
    \ the right, service attributes about students are listed, as well as any supporting\
    \ services. An explanation of the different HTTP methods and their implications\
    \ are presented in table 2.1.\n\n### Table 2.1: HTTP Method Usage\n\n| HTTP Method\
    \ | Usage Notes |\n| :--- | :--- |\n| `GET` | Used for information retrieval only.\
    \ It is assumed that `GET` operations do not change data in any way. |\n| `POST`\
    \ | Used to create a resource only. It is assumed that the resource doesn’t already\
    \ exist and is being newly created. |\n| `PUT` | Used to update a resource. It\
    \ is assumed that all information on a resource is being updated. |\n| `PATCH`\
    \ | Used for partial resource updates (e.g., a selected number of resource attributes).\
    \ |\n| `DELETE` | Used to delete a resource. |\n\nBy itself, the diagram in Figure\
    \ 2.1 might not be complete enough for a team to develop from it. However, at\
    \ the planning stage, it certainly suffices and definitely provides developers\
    \ with a starting point from which they can ask intelligent questions. As an aside,\
    \ I used the open source product [Freemind](http://freemind.sourceforge.net/wiki/index.php/Main_Page)\
    \ to produce the diagram in Figure 2.1. I usually use Freemind for the initial\
    \ planning of RESTful web services like this.\n\nOf course, there may be multiple\
    \ operations to support cross-cutting concerns, such as health checks, performance\
    \ metrics, runtime diagnostics, etc. Those operations are important, but they\
    \ exist for support purposes and don’t have anything to do with the service’s\
    \ reason for existing. I divide the world up into two categories of services:\
    \ core services and process services.\n\n## Core Services\n\nCore services store\
    \ business facts about the enterprise. They are responsible for maintaining business\
    \ data for a specific area of the enterprise. Core services provide mainly CRUD-like\
    \ features and usually don’t rely on other services. No matter how we modularize\
    \ software, at some point, something needs to record business facts in some type\
    \ of database. Core services fill this role in a microservices architecture. Figure\
    \ 2.1 is an example of such a core service.\n\nCore services are usually named\
    \ after nouns, as that’s what most business facts are. The same mental discipline\
    \ you use to identify RESTful web service resources can be used to identify core\
    \ services. You can usually express a core service ‘mission’ as being the ‘service\
    \ of record for a ___’. Fill in the blank on the noun. The format of the mission\
    \ statement can usually be expressed in the following format:\n\nThe <service\
    \ title> is the system of record for a <business term>.\n\nAs an example, consider\
    \ the Student service defined in Figure 2.1:\n\nThe Student service is the system\
    \ of record for personal information about students, such as their name, address,\
    \ age, emergency contact and other information.\n\nLet’s delve a little deeper\
    \ into the example illustrated in Figure 2.1. You might question how I decided\
    \ to break out `StudentAccounts`, `StudentClasses`, `StudentForms`, and `StudentTranscripts`\
    \ (which are all [HATEOAS](https://en.wikipedia.org/wiki/HATEOAS) reference links)\
    \ into separate services and why I didn’t include them in the `Students` service\
    \ directly. The answer is that there is business logic in each of these service\
    \ references that is specific to that portion of the business. For example, regarding\
    \ `StudentClasses`, registering a student for a class is more than just a [CRUD](https://en.wikipedia.org/wiki/Create,_read,_update_and_delete)\
    \ entry in a database somewhere. Does the student meet the course prerequisites?\
    \ Does this class conflict with other classes that the student has chosen? Both\
    \ of these are business process questions that are best separated out and lumped\
    \ together with unrelated aspects of student personal information.\n\nLet’s contrast\
    \ this with student addresses or phone numbers, which are maintained by the Students\
    \ service. In this fictional university, there is no business process surrounding\
    \ recording a student address or phone number. A student provides notification\
    \ of the change and we record it. This is merely a CRUD-like feature. Consequently,\
    \ the motivation for breaking this out into a separate service is almost non-existent.\n"
