    Like Spring Boot, Dropwizard uses Logback logging by default. At this level, a
    logging configuration is likely for developer convenience. When the service is
    deployed, a production logging configuration will likely override what’s placed
    in the spring boot deployable. Look at the logging configuration at this level
    as a ‘default,’ nothing more.


    Logging configuration for Dropwizard is configured in the yaml file you supply
    when the container starts (example [here](https://github.com/Derek-Ashmore/moneta/blob/master/moneta-dropwizard/src/main/resources/moneta-config.yaml)).
    I prefer to supply a default configuration, including logging, for developer convenience.
    Dropwizard, by default, accepts only a file reference for configuration with no
    option to load it from the classpath. Fortunately, that is easy to change. The
    application configuration is controlled by a class that implements the ConfigurationSourceProvider
    interface. I’ve developed an enhancement that will look for the configuration
    on the classpath as well ([here](https://github.com/Derek-Ashmore/moneta/blob/master/moneta-dropwizard/src/main/java/org/moneta/config/dropwizard/MonetaConfigurationSourceProvider.java)).
    You must also add the new configuration provider to the application bootstrap
    in the application class. To accomplish this, you just need to override the application
    initialization process. An example can be found in listing 3.9.


    Listing 3.9: Example for Enhancing Application Configuration


    @Override


    public void initialize(Bootstrap<MonetaDropwizardConfiguration> bootstrap) {


      bootstrap.setConfigurationSourceProvider(new MonetaConfigurationSourceProvider());


      super.initialize(bootstrap);


    }


