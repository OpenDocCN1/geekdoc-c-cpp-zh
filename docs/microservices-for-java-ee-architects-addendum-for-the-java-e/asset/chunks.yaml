    ## Chapter 1: Microservices Defined


    The microservices architecture doesn’t have a concrete definition. Microservices
    architecture organizes applications as a suite of discrete, independent services.
    Usually, these web services adopt a [RESTful](https://en.wikipedia.org/wiki/Representational_state_transfer)
    style. Any coupling between services is restricted to the service layer, with
    no coupling at a code or database level. The approach does have some similarities
    to the Service Oriented Architecture (SOA) approach, which will be discussed later.
    We define it as a series of common traits that ‘microservices’ have.


    Microservices have a single functional purpose. That is, they have a single business
    purpose. They do one thing and do it well. To level set, the term ‘functional’
    is borrowed from the term ‘functional requirement.’ Functional requirements are
    typically business requirements; they support doing business directly in some
    way. In essence, the terms ‘functional’ and ‘business’ can be used interchangeably.


    As a byproduct of having a single functional purpose, most business changes affect
    a small number of services (preferably only one service). In fact, we’re going
