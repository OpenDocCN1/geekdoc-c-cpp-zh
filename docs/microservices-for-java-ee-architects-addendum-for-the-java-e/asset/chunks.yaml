    开发人员应该一次只专注于一个服务。这有助于避免在特定顺序或语境下对服务使用的业务流程做出假设。我之所以这样做，是因为你不会让某位开发人员同时负责一个服务及其调用方服务。这也有助于他们专注于工作，不受干扰，并保持高开发速度。在这样一个世界里，任何拖慢开发速度的因素都会牺牲你从微服务架构中获得的收益。


    发布服务的开发人员应该对其提供支持。这能促进智能化的开发产品决策，并编写可维护的高质量代码。换句话说，开发者要“自食其”（eat their own dog
    food）。大多数开发人员都想要良好的家庭生活；这种范式支持了这一点。只要他们产出的服务缺陷率低，那么他们在支持工作上花费的时间就会降到最低。


    ## 服务健康监控


    对缺陷进行自动化响应是非常关重要的。随着开发速度的提高，生产环境的部署频率呈指数级增长。健康监控对于快速发现故障和缺陷至关重要。我的一些客户使用 `Splunk`
    或 `LogStash` 在生产环境中遇到错误时，自动在工单系统中创建缺陷工单。决定遇到错误时应该通知哪个服务团队值得一些深思和规划。例如，一个因错误输入而出错的服务调用应该发送给调用方，而不是生产服务的团队。当然，任何类型的未计划运行时异常都应该发送给生产服务的团队。


    处理重复错误也值得考虑。根据数量大小，一个缺陷可能会产生数千份报告。为同一个缺陷获取数千个工单几乎并无益处。抑制重复是危险的，因为检测哪些是之前问题的重复、哪些是具有不同原因的问题可能会问题。


    ## 采用微服务架构的管理优势


    许多文献集中在描述微服务架构提供的技术优势上。它也有业务/管理优势。本节将详细介绍其中一些。


    ### 资源人员配置的灵活性与隔离


    微服务开发团队规模小且专注。开发人员每次`only`专注于一个服务。该服务应该有一个开发人员据此编写代码的固化合约，最好带有容器化的交付物（即 `Docker`）。关键在于，他们完全专注于深度开发。他们不应该被承担（或不必承担）通信开销的负担；只需与负责该服务的其他开发人员沟通。


    他们作为一个独立的团队工作，与其他所有服务团队完全异步。结合他们具有低通信开销和定义交付物的事实，他们可以在世界上任何地方、任何时区工作。无论是在公司办公室内还是在海外外包，这并不重要。


    鉴于团队的工作被限于对服务的专注需求，对代码质量等的担忧至少被限制在较小的服务源码库中。换句话说，该团队能搞乱代码并从而产生维护问题的程度是有限的。


    这意味着微服务的开发可以更容易地进行外包。


    这也意味着你能够更好地免受不受控的开发人员（rogue developers）的干扰。我们都管理过产生不可维护性代码的开发人员。由于不受控的开发人员被限制在一个较小且专注的代码库中，他们对该代码库造成的破坏是有限的。此外，该代码库很小、专注且定义良好；如果需要，它更容易被替换。你不会让不受控的开发人员在一个
    50 万行的单体应用中肆意破坏，造成更大范围的混乱。


    ### 提高开发速度


    假设所需服务的合约以及这些服务之间的依赖关系已完全定义，那么引入更多开发团队进行持续工作就会更容易。对于引入额外开发人员的担心在于，这通常意味着更多的通信开销。由于这种增加的开销，开发人员的生产力收益是递减。每增加一个开发人员，你获得的生产力就越少。


    虽然微服务团队中个人开发人员的生产力确实提高了，因为他们没有那么多通信开销，但任何开发人员生产力的提升是有极限的。你的速度增长实际上来自于添加新团队的便利性。开发人员在小型、专注的团队中进行深度开发，他们看不到或不受整体工作规模的影响。因此，管理层更容易将开发扩展到更大数量的开发人员。请注意，除了完全定义所有服务合约外，你还必须识别合约之间的任何依赖关系；某些服务可能要求在完成特定服务的工作之前，先完成其他服务。请注意，任何开发团队都可以对依赖服务进行存根（stub），并在依赖服务完成之前开始工作。


    在这里实际发生的情况是，扩展开发的限制转移到了负责识别单个服务和指定服务合约的管理层和企业架构师。更大规模的工作将带来更多的协调点。由于某些服务会调用其他服务，那些依赖服务需要先构建。工作流向开发团队的顺序需要进行协调。


    ### 技术栈自由


    在微服务世界中，服务是容器化的。这意味着部署产物拥有它所需的操作系统和其他软件（例如 `Java JVM`、`PHP`、`Python`、`GoLang`
    等）。每个服务都可以轻松地在这些技术的不同层次上运行。推论是，新技术可以更容易地引入或升级。这让你能够比在传统的单体 Web 应用程序中快地利用新技术。


    对于传统的 Web 应用程序，代码库要大得多。因此，升级的影响会大得多，并且需要更广泛的回归测试。此外，在较大的代码库中，切换开发语言要困难得多。


    这是一项技术优势，但我认为它也是一项管理优势。经理们一直在寻找更快交付软件的新方法。提高开发人员生产力的途径之一是可用工具集的技术进步。与传统的 Web 部署相比，微服务架构让你利用新开发的工具集并带来业务所要求的生产力增长的能力更好。


    '
- fmt: '

    The definitive guide on what microservices architecture is, and on defining the
    paradigm, is [Microservices](http://martinfowler.com/articles/microservices.html)
    by Fowler and Lewis. You may recall that I defined microservices as a list of
    characteristics that most microservices have. I wish I could claim that as original
    thought, but I can’t. The Fowler/Lewis article is the definitive standard for
    a list of traits that microservices have. I chose what I deemed to be the most
    important traits to highlight.


    Fowler has also done valuable work on prerequisites for microservices architecture
    ([here](http://martinfowler.com/bliki/MicroservicePrerequisites.html)); that is,
    capabilities you should have in place before attempting microservices architecture
    on a large scale.


    Another thought leader on microservices is Adrian Cockroft. A sample of his work
    can be found on this [video](http://www.infoq.com/presentations/migration-cloud-native).
    I follow his [twitter](https://twitter.com/adrianco?ref_src=twsrc%5Egoogle%7Ctwcamp%5Eserp%7Ctwgr%5Eauthor)
    feed.


    I closely follow two open source projects in this space. The first is the [Netflix](https://github.com/Netflix)
    product suite. They have to support an incredible amount of throughput and have
    been generous enough to open source the tooling they built to support it. The
    second is Apache [Mesos](http://mesos.apache.org/), which essentially makes computing
    resources ubiquitous. That is, it allows you to look at computing resources generically
    and not be concerned with where those resources are hosted. With the large number
    of deployables that microservices architecture produces, this is very promising
    for reducing deployment management issues.


    Thank you for taking the time to read this book. Feel free to contact me at [derek.ashmore@dvtconsulting.com](mailto:derek.ashmore@dvtconsulting.com)
    or via [LinkedIn](http://www.linkedin.com/in/derekashmore) if you have comments
    or questions. I’m always interested in feedback.

