  raw: 'Microservice teams are responsible for ensuring that their services meet all
    non-functional requirements. Effectively, this means that choosing a technical
    stack ‘new’ to the organization is inherently ‘taxed’ as it also needs to supply
    the capability for meeting non-functional requirements. For new technical stacks,
    strategies to address non-functional requirements may not exist within the enterprise
    and need to be identified and possibly developed. Ideally, the microservice team
    adopting a technology new to the enterprise will develop this capability in a
    way that other teams can reuse it for other services. For example, if an enterprise
    adopts the [JRuby](http://jruby.org/) framework and decides to write microservices
    using it, capabilities to incorporate health checks and performance metrics, and
    to address other non-functional requirements, may need to be identified and established.


    Health Checks


    A health check is typically a URL that provides some type of indication that the
    service is responsive and able to fulfill its function. That URL is invoked by
    some type of monitoring tool (e.g., [Nagios](https://www.nagios.org/)) that is
    capable of alerting an administrator if the health check fails. The simplest alert
    is that the microservice JVM is unresponsive. The question then becomes: what
    is your definition of ‘responsive’? Often just able to respond with an HTTP 200
    isn’t sufficient.


    In addition to verifying that the service itself is able to respond to a URL without
    error, I like to check access to external resources and dependencies. For example,
    I like to check database connection pool health. Yes, databases and other external
    resources should also be monitored with separate health checks, but checking the
    health of the connection pool used for database access also verifies that the
    pool is sized properly for the transaction volume that the service is currently
    handling. This kind of check can only be performed within the microservice process
    itself and cannot effectively be monitored from the outside. That kind of condition
    can also happen with traditional web applications and isn’t really new with microservices.


    Health checks, regardless of the technical stack used for the microservices you
    are writing, should be part of the application architecture provided by the enterprise.
    There is no reason why each service producer should need to build their own. I
    usually utilize the Dropwizard [metrics](https://dropwizard.github.io/metrics/3.1.0/manual/healthchecks/)
    library to code health checks.


    Those looking for a code-level example of such a health check can find one [here](https://github.com/Derek-Ashmore/moneta/blob/master/moneta-core/src/main/java/org/moneta/healthcheck/DbcpConnectionPoolHealthCheck.java).
    This example checks the connection pool to validate that the number of transactions
    waiting for a database connection is less than a configurable number (it defaults
    to three). That is, if too many transactions are waiting for database connections,
    then the service isn’t healthy because consumers are suffering performance issues.
    In this case, the connection pool might need to be resized for the load that the
    service is handling. In addition, I validate a connection from the pool to make
    sure not only that the database is available, but also that network connectivity
    between the service and database is available.


    Performance Metrics and Alerts


    Performance metrics aid support developers in investigating performance problems.
    I track performance metrics, such as performance for each page in the application,
    for traditional web applications as well. In receiving vague reports of slow performance,
    it’s useful to know exactly where performance currently is when compared to performance
    history, if you have it. More importantly, it also speeds up performance investigations.


    With microservices architecture, user actions can involve multiple services. Localizing
    a performance problem (i.e., determining which service(s) are contributing to
    that performance problem) becomes a time-consuming issue. Having that performance
    data for all services in hand greatly saves the support developer’s time.


    Traditional web application performance is easier to measure. Typically, performance
    metrics are gathered at a URL / web page level. Tools to gather performance metrics
    for individual pages/URLs for a traditional web application are plentiful. I use
    [Admin4J](http://admin4j.net/doc/performance.html), but there are other product
    options.


    With RESTful web services, performance measurement is a bit more difficult because
    URLs contain identifiers, and behavior differs by operation (GET, POST, DELETE,
    etc.). To elaborate, measuring by strict URL doesn’t make sense for RESTful web
    services as URLs contain data identifiers. For example, it’s not meaningful to
    measure GET operations for URLs /students/1 and students/2 separately. They are
    both identical lookups, just on different students. It would be better to have
    consolidated measurement for the entire mask /students/*. This gets even more
    difficult if your services have options for returning related data items. For
    example, if the service supports /students/1/classes, the behavior for a class
    search result would be different than for the student search result and it might
    be useful to differentiate. [Admin4J](http://admin4j.net/doc/performance.html)
    will consolidate performance metrics for RESTful web service calls; at the time
    of this writing I haven’t found any other product that will.


    At the very least, measure the average call time and the total number of calls
    for each service. With the large number of deployables that most microservices
    architecture projects have, knowing the number of calls allows you to concentrate
    effort on tuning the most frequently used services. Having the average call time
    helps you localize performance issues where user actions can involve multiple
    services. While I’m used to also having the minimum, maximum, and standard deviations
    of call times, along with the average and total number, that information is less
    useful and can be looked at as optional.


    Place automatic alerts for service call times beyond a configurable threshold.
    This allows support developers to start proactively diagnosing and fixing performance
    problems before end users report them. Determining a sensible threshold for each
    service will involve some amount of trial and error. Having a threshold that’s
    too low will produce false alerts, or alerts that turn out not to be indications
    of material performance problems.


    Resource Consumption Alerts and Responses


    There are some resource consumption issues within a JVM process that are effectively
    service health issues, should they occur.


    Monitor memory usage for deployed services. When you look at the way that the
    JVM allocates memory, however, it’s not the aggregate memory usage at the process
    level that’s most relevant, because that measurement includes native memory allocated
    by the JVM whether or not it’s actually used by Java code running within. What’s
    most relevant is consumed and available heap memory within the JVM. Available
    heap memory is available to Java classes and can actually be consumed. I use [Admin4J](http://admin4j.net/doc/memory.html)
    to monitor memory usage and issue alerts for shortages, but there are other tools
    available.


    In diagnosing memory shortages, the first question is whether the memory usage
    spike detected was caused by a memory leak of some type or not. If the cause was
    a memory leak, then allocating additional memory will not help you. If the cause
    was normal usage, it’s possible that there’s a capacity planning issue, and that
    either more memory needs to be allocated or additional occurrences of the service
    need to be defined within the cluster.'
