- fmt: "\nThe expiring cache pattern, sometimes known as ‘Cache Aside,’ exploits the\
    \ fact that some data in every organization is static and doesn’t require a fresh\
    \ read every time it’s needed. The concept is that static data is read and then\
    \ cached for a configurable period of time. During that period of time, the cached\
    \ version of that data is used and not freshly read from a database.\n\nExpiring\
    \ cache pattern trades memory for speed. The pattern consumes memory for the cache,\
    \ but average retrieval time is extremely quick.\n\nLet’s take an example. Indiana\
    \ University, my alma mater, has several campuses: Bloomington, Indianapolis,\
    \ South Bend, and others. The specifics of each of those campuses are relatively\
    \ static; that is, very seldom does the university establish a new campus or decommission\
    \ an old one. There is no reason to re-read campus information every time it’s\
    \ needed and therefore it is a logical candidate for the expiring cache pattern;\
    \ especially in a microservices architecture where that ‘read’ would likely be\
    \ a service call to a core service.\n\n### Figure 2.8: Expiring Cache Pattern\n\
    \n![figure-2-8-Expiring-Cache-Pattern-Algorithm.jpg](images/00014.jpeg)\n\nTypically,\
    \ expiring caches have the configurable expiration timeframe. It might be safe\
    \ to cache some information for long periods of time, even a day, while other\
    \ types of information require refreshes in shorter intervals.\n\nUtilize the\
    \ expiring cache service in consuming services and don’t centralize that logic\
    \ in the target service for several reasons. Performance enhancement comes not\
    \ only from avoiding the database read, but also from the service call to a core\
    \ service. Secondly, the consumer knows more about context and understands how\
    \ current the cached information needs to be. It might be that some services need\
    \ data more current than others and will want a shorter expiration time.\n\nI\
    \ use the Google [Guava](https://github.com/google/guava) product for expiring\
    \ cache. A reference on how Guava caching works can be found [here](https://github.com/google/guava/wiki/CachesExplained).\
    \ That said, EHCache and other products provide this functionality as well. At\
    \ this point, there’s really no need to roll your own. Implementing an expiring\
    \ cache using Guava has two parts: extending `CacheLoader` and defining the cache\
    \ itself.\n\nThe `CacheLoader` will look up a value if given a `key`. Most classes\
    \ that extend `CacheLoader` only need to implement the `load(key)` method that\
    \ will perform a lookup and return the value for a given `key`. The second part\
    \ is defining the cache itself. An example can be found in listing 2.5. While,\
    \ by default, cached values are expired after 100 milliseconds, you can choose\
    \ any time interval you deem appropriate.\n\n### Listing 2.5: Guava Cache Definition\
    \ Example\n\n```java\nLoadingCache<Integer, String> sampleCache = CacheBuilder.newBuilder()\n\
    \        .expireAfterWrite(100, TimeUnit.MILLISECONDS)\n        .build(loader);\n\
    ```\n\nIt is possible that different nodes of a cluster might have different answers\
    \ because they’ll be on different caching schedules. This is usually okay, because\
    \ to use microservices architecture, you need to accept the idea of ‘eventual\
    \ consistency’ anyway. We’ll get more into this point later. Should you need to\
    \ force a reload of a Guava cache, executing `invalidateAll()` on the cache will\
    \ effectively force a reload.\n\n## Designing for Integrity\n\nIn traditional\
    \ web applications, we have the safety of the database transaction. If an error\
    \ occurs, it’s common to execute a database rollback, which leaves the database\
    \ in a consistent state. In a microservice world where a user action may utilize\
    \ multiple services, this safety net doesn’t exist because those transactions\
    \ are taking place in several databases initiated by different services. Yes,\
    \ core services typically have a database transaction safety net, as their focus\
    \ is largely CRUD related, but process services, which utilize other services,\
    \ do not.\n\n## Custom Rollback\n\nBasically, this pattern consists of issuing\
    \ reversing transactions in your exception handling logic. This pattern is also\
    \ known by the title of ‘Compensating Transaction.’ Essentially, when an error\
    \ occurs, reversing transactions are issued for any changes that might have succeeded.\
    \ For example: say a process service call results in three service calls to other\
    \ microservices. Say the first transaction succeeds, but the second fails. In\
    \ the exception handling logic for the process service, it issues a reversing\
    \ service call for the transaction that succeeded, leaving data in a consistent\
    \ state.\n\n### Figure 2.9: Custom Rollback Pattern\n\n![figure-2-9-Custom-Rollback-Pattern.jpg](images/00015.jpeg)\n\
    \nThis strategy isn’t perfect. It’s possible that the reversing transaction will\
    \ error out too or that the process service will tank before the reversing transaction\
    \ can be issued. Either way, stored data will be left in an inconsistent state,\
    \ thus requiring some type of fix. Usually, this fix is a manual one.\n\nWriting\
    \ custom rollback transactions takes labor, so you don’t want to use this pattern\
    \ on everything. Basically, you have two choices: to code custom rollbacks to\
    \ reduce the need for manual intervention, or to manually make data consistent\
    \ when errors happen. Usually, organizations start with manual intervention and\
    \ then use code custom rollbacks to address areas with the highest frequency of\
    \ failure.\n\nThis pattern is incredibly hard to generalize and provide product\
    \ support for. The specific logic needed for a reversing transaction needs to\
    \ be custom coded.\n\n## Managing Service Versions\n\nManaging versions of services\
    \ is hard enough with traditional web applications. In a microservice world, the\
    \ problem exponentiates as the number of services exponentiates. There are two\
    \ popular versioning strategies in use. The first literally places a version number\
    \ in the URL for the service. The second allows the client to request a service\
    \ version in the header. Should they not request a version, they default to the\
    \ most current version. I’ll go through both versioning methods. But first, let’s\
    \ discuss different types of changes and your civic duty as a producer or consumer\
    \ of a service.\n\n### Breaking vs. non-breaking changes\n\nA breaking change\
    \ is one that causes existing service calls to error out. Breaking changes force\
    \ consumers to change code to avoid errors. Yes, you can mitigate the effect of\
    \ this by adopting a deprecation strategy (which I’ll discuss later), but still,\
    \ you force change. By definition, that forced change is going to get prioritized\
    \ above most other tasks for the consuming application team and will likely usurp\
    \ other feature enhancements that team is supposed to work on. From the consuming\
    \ team’s perspective, that change comes out of the blue and isn’t as easily manageable\
    \ as scheduling feature enhancements.\n\nNot all changes are breaking changes.\
    \ If a service call requesting information about a topic suddenly returns a few\
    \ additional items of information, this should be a non-breaking change. It’s\
    \ non-breaking because consumers shouldn’t pay any attention to the additional\
    \ information provided since they don’t currently have the logic to process it.\
    \ Should they make a decision to process those additional information items, they\
    \ can enhance their service on their own schedule. In fact, they might not need\
    \ the additional items of information to enhance their service at all.\n"
  raw: 'The expiring cache pattern, sometimes known as ‘Cache Aside,’ exploits the
    fact that some data in every organization is static and doesn’t require a fresh
    read every time it’s needed. The concept is that static data is read and then
    cached for a configurable period of time. During that period of time, the cached
    version of that data is used and not freshly read from a database.


    Expiring cache pattern trades memory for speed. The pattern consumes memory for
    the cache, but average retrieval time is extremely quick.


    Let’s take an example. Indiana University, my alma mater, has several campuses:
    Bloomington, Indianapolis, South Bend, and others. The specifics of each of those
    campuses are relatively static; that is, very seldom does the university establish
    a new campus or decommission an old one. There is no reason to re-read campus
    information every time it’s needed and therefore it is a logical candidate for
    the expiring cache pattern; especially in a microservices architecture where that
    ‘read’ would likely be a service call to a core service.


    Figure 2.8: Expiring Cache Pattern


    ![figure-2-8-Expiring-Cache-Pattern-Algorithm.jpg](images/00014.jpeg)


    Typically, expiring caches have the configurable expiration timeframe. It might
    be safe to cache some information for long periods of time, even a day, while
    other types of information require refreshes in shorter intervals.


    Utilize the expiring cache service in consuming services and don’t centralize
    that logic in the target service for several reasons. Performance enhancement
    comes not only from avoiding the database read, but also from the service call
    to a core service. Secondly, the consumer knows more about context and understands
    how current the cached information needs to be. It might be that some services
    need data more current than others and will want a shorter expiration time.


    I use the Google [Guava](https://github.com/google/guava)  product for expiring
    cache. A reference on how Guava caching works can be found [here](https://github.com/google/guava/wiki/CachesExplained).
    That said, EHCache and other products provide this functionality as well. At this
    point, there’s really no need to roll your own. Implementing an expiring cache
    using Guava has two parts: extending CacheLoader and defining the cache itself.


    The CacheLoader will look up a value if given a key. Most classes that extend
    CacheLoader only need to implement the load(key) method that will perform a lookup
    and return the value for a given key. The second part is defining the cache itself.
    An example can be found in listing 2.5\. While, by default, cached values are
    expired after 100 milliseconds, you can choose any time interval you deem appropriate.


    Listing 2.5: Guava Cache Definition Example


    LoadingCache<Integer, String> sampleCache = CacheBuilder.newBuilder()


           .expireAfterWrite(100, TimeUnit.MILLISECONDS)


           .build(loader);


    It is possible that different nodes of a cluster might have different answers
    because they’ll be on different caching schedules. This is usually okay, because
    to use microservices architecture, you need to accept the idea of ‘eventual consistency’
    anyway. We’ll get more into this point later. Should you need to force a reload
    of a Guava cache, executing invalidateAll() on the cache will effectively force
    a reload.


    Designing for Integrity


    In traditional web applications, we have the safety of the database transaction.
    If an error occurs, it’s common to execute a database rollback, which leaves the
    database in a consistent state. In a microservice world where a user action may
    utilize multiple services, this safety net doesn’t exist because those transactions
    are taking place in several databases initiated by different services. Yes, core
    services typically have a database transaction safety net, as their focus is largely
    CRUD related, but process services, which utilize other services, do not.


    Custom Rollback


    Basically, this pattern consists of issuing reversing transactions in your exception
    handling logic. This pattern is also known by the title of ‘Compensating Transaction.’
    Essentially, when an error occurs, reversing transactions are issued for any changes
    that might have succeeded. For example: say a process service call results in
    three service calls to other microservices. Say the first transaction succeeds,
    but the second fails. In the exception handling logic for the process service,
    it issues a reversing service call for the transaction that succeeded, leaving
    data in a consistent state.


    Figure 2.9: Custom Rollback Pattern


    ![figure-2-9-Custom-Rollback-Pattern.jpg](images/00015.jpeg)


    This strategy isn’t perfect. It’s possible that the reversing transaction will
    error out too or that the process service will tank before the reversing transaction
    can be issued. Either way, stored data will be left in an inconsistent state,
    thus requiring some type of fix. Usually, this fix is a manual one.


    Writing custom rollback transactions takes labor, so you don’t want to use this
    pattern on everything. Basically, you have two choices: to code custom rollbacks
    to reduce the need for manual intervention, or to manually make data consistent
    when errors happen. Usually, organizations start with manual intervention and
    then use code custom rollbacks to address areas with the highest frequency of
    failure.


    This pattern is incredibly hard to generalize and provide product support for.
    The specific logic needed for a reversing transaction needs to be custom coded.


    Managing Service Versions


    Managing versions of services is hard enough with traditional web applications.
    In a microservice world, the problem exponentiates as the number of services exponentiates.
    There are two popular versioning strategies in use. The first literally places
    a version number in the URL for the service. The second allows the client to request
    a service version in the header. Should they not request a version, they default
    to the most current version. I’ll go through both versioning methods. But first,
    let’s discuss different types of changes and your civic duty as a producer or
    consumer of a service.


    Breaking vs. non-breaking changes


    A breaking change is one that causes existing service calls to error out. Breaking
    changes force consumers to change code to avoid errors. Yes, you can mitigate
    the effect of this by adopting a deprecation strategy (which I’ll discuss later),
    but still, you force change. By definition, that forced change is going to get
    prioritized above most other tasks for the consuming application team and will
    likely usurp other feature enhancements that team is supposed to work on. From
    the consuming team’s perspective, that change comes out of the blue and isn’t
    as easily manageable as scheduling feature enhancements.


    Not all changes are breaking changes. If a service call requesting information
    about a topic suddenly returns a few additional items of information, this should
    be a non-breaking change. It’s non-breaking because consumers shouldn’t pay any
    attention to the additional information provided since they don’t currently have
    the logic to process it. Should they make a decision to process those additional
    information items, they can enhance their service on their own schedule. In fact,
    they might not need the additional items of information to enhance their service
    at all.'
