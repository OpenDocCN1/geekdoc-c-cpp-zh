  trans: "\n\n你不需要为每个微服务准备独立的物理数据库服务器/许可证。目标是消除数据库层面的耦合。使用独立的数据库模式（schemas）就足以达到这种程度的解耦。当然，不要在两个不同微服务使用的表之间创建任何引用完整性规则（例如外键约束）是非常重要的，因为这属于不必要的耦合。\n\
    \n# 第 2 章：微服务架构的设计考虑\n\n本章详细介绍了微服务架构中重要的设计考虑因素。与任何技术范式一样，使用微服务架构也可能编写出过于复杂且难以维护的软件。本章将帮助你避免这种情况。\n\
    \n大多数实现微服务的人都使用 REST 风格的 Web 服务。因此，我提出的所有示例都将假设使用 RESTful Web 服务接口。需要注意的是，REST\
    \ 并非实现微服务架构的必要条件；任何标准化的接口都可以。大多数人在微服务架构中使用 REST，是因为它它对资源（即名词）的依赖自然地契合了微服务的边界。\n\
    \n## 服务边界\n\n微服务最重要的设计考虑因素是定义它的使命。也就是说，定义它必须履行的单一业务目的。处理这个问题有几种方法：一种是以识别 REST\
    \ 服务资源相同的方式来识别服务边界；另一种是从领域驱动设计（DDD）的角度识别服务边界，并将你的领域模型精炼为足够特定的子领域，以便在定义微服务时使用它们。在这两者之间，我通常按\
    \ REST 资源来思考。反正这很契合，因为大多数用户倾向于将微服务实现为 RESTful Web 服务。\n\n## 定义微服务\n\n一个微服务的定义包含以下内容：\n\
    \n*   有意义的\n*   用业务术语编写的服务业务功能\n*   支持该业务功能的 RESTful Web 服务资源或资源层级\n*   操作细节，例如：\n\
    \    *   请求参数\n    *   输入 POST 数据格式\n    *   输出数据格式\n*   保留的资源层级属性\n*   范围细节\n\
    \    *   关于该服务管理和不管理哪些业务功能的详细说明\n\n让我们来看一个例子。以学院或大学的“学生”业务概念为例。这些机构通常有记录学生特定信息的需求（例如学生姓名、分配的学生标识符、出生日期、性别、地址、电子邮件、电话号码等）。还有涉及学生的更复杂的业务流程（例如为他们注册课程、维护成绩单、处理付款等），但对于本例，让我们仅限于维护学生的个人信息。该示例服务如图\
    \ 2.1 所示。\n\n### 图 2.1：核心服务定义示例\n\n![D:\\BusinessFiles\\Projects\\Microservices-Handbook-Addendum-eBook\\\
    graphics\\needsGimpToMake600dpi\\figure-2-1-Student-Service-Example-Hierarchy.jpg](img/00007.jpeg)\n\
    \n服务名称 `Students` 位于中心。左侧是用业务术语对服务的一句描述。所有操作都根据支持它们的 HTTP 方法进行了详细说明（例如 `PUT`、`POST`、`GET`\
    \ 等）。`GET` 请求中列出了所有支持的查询条件，如 `sort` 和 `maxEntries`。列出了所有支持的表示格式，以及支持的 HATEOAS（应用程序状态引擎的超文本，缩写）引用链接。右侧列出了关于学生的服务属性，以及任何支持的服务。表\
    \ 2.1 展示了不同 HTTP 方法及其含义。\n\n### 表 2.1：HTTP 方法用法\n\n| HTTP 方法 | 使用备注 |\n| :---\
    \ | :--- |\n| `GET` | 仅用于信息检索。假设 `GET` 操作不会以任何方式更改数据。 |\n| `POST` | 仅用于创建资源。假设资源不存在且正在新创建。\
    \ |\n| `PUT` | 用于更新资源。假设资源上的所有信息都在被更新。 |\n| `PATCH` | 用于部分资源更新（例如选定的数量资源属性）。 |\n\
    | `DELETE` | 用于删除资源。 |\n\n单看图 2.1 中的图表可能不足以让团队据此进行开发。然而，在规划阶段，它绝对足够了，并为开发者提供了一个起点，让他们可以从这里提出明智的问题。顺便提一下，我使用了开源产品\
    \ [Freemind](http://freemind.sourceforge.net/wiki/index.php/Main_Page) 制作了图 2.1\
    \ 中的图。我通常使用 Freemind 对此类 RESTful Web 服务进行初始规划。\n\n当然，可能有多个操作来支持交叉关注点，例如健康检查、性能指标、运行时诊断等。这些操作虽然很重要，但它们是为了支持而存在的，与服务的生存理由无关。我将世界分为两类服务：核心服务和过程服务。\n\
    \n## 核心服务\n\n核心服务存储关于企业的业务事实。它们负责维护企业特定区域的业务数据。核心服务主要提供类似 CRUD 的功能，通常不依赖于其他服务。无论我们如何模块化软件，在某个时刻，某些东西需要在某种数据库中记录业务事实。核心服务在微服务架构中充当这一角色。图\
    \ 2.1 是这样一个核心服务的示例。\n\n核心服务通常用名词命名，因为大多数业务事实都是名词。你识别 RESTful Web 服务的思维纪律也可以用于识别核心服务。你通常可以将一个核心服务的“使命”表达为“___\
    \ 的记录服务”。在空格处填入名词。使命声明的格式通常可以按以下格式表示：\n\n<服务标题> 是 <业务术语> 的记录系统。\n\n例如，考虑图 2.1\
    \ 中定义的 Student 服务：\n\nStudent 服务是学生个人信息的记录系统，例如他们的姓名、地址、年龄、紧急联系人和其他信息。\n\n让我们深入研究图\
    \ 2.1 所示的示例。你可能会问我如何决定将 `StudentAccounts`、`StudentClasses`、`StudentForms` 和 `StudentTranscripts`（这些都是\
    \ [HATEOAS](https://en.wikipedia.org/wiki/HATEOAS) 引用链接）拆分为独立的服务，以及为什么我没有直接将它们包含在\
    \ `Students` 服务中。答案是，这些服务引用中的每一个都有特定于该部分的业务逻辑。例如，对于 `StudentClasses`，为学生注册课程不仅仅是某处数据库中的一个\
    \ [CRUD](https://en.wikipedia.org/wiki/Create,_read,_update_and_delete) 条目。学生是否符合课程先决条件？这门课程是否与学生选择的其他课程冲突？这两者都是业务流程问题，最好分开处理，而不是与学生个人信息的无关的方面放在一起。\n\
    \n让我们将其与由 Students 服务维护的学生地址或电话号码进行对比。在这所虚构的大学中，没有围绕记录学生地址或电话号码的业务流程。学生提供变更通知，我们记录即可。这仅仅是一个类似\
    \ CRUD 的功能。因此，将其拆分为独立服务的动力几乎不存在。\n\n"
