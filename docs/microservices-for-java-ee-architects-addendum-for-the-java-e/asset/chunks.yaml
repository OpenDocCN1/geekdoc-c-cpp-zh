  trans: "\n从 Java 的角度来看，该算法至少包含三个部分。通常，会有一个 servlet 过滤器（filter）来确保每个事务都有一个关联 ID（correlation\
    \ id）。如果没有，则生成并分配一个。此外，该过滤器会将关联 ID 注册到所使用的日志框架中，以便自动将其包含在日志条目中。\n\n其次，日志格式需要在所有日志条目中包含关联\
    \ ID。所有主要的框架都支持这一概念。有一个使用 `Slf4J` 作为日志框架的 servlet 过滤器示例，可以在[此处](https://github.com/Derek-Ashmore/RequestCorrelationSlf4J)。\n\
    \n第三，所有向外的服务调用都需要在头部（header）中包含关联 ID。遗憾的是，所有实现都是特定于产品的。这取决于所使用的 Web 服务框架。对于 `Apache\
    \ HttpClient` 产品，你应该将关联 ID 添加到头部中。\n\n该技术的意图是涵盖 REST 以及 SOAP。你不应该使用 SOAP 头部；而应该使用\
    \ HTTP 头部。\n\n## 远程调用的异常处理\n\n在微服务架构中，定位问题往往最耗费大量支持时间。你可以采取一些简单的步骤来减少定位问题上花费的精力。\n\
    \n### 利用上下文异常（Contexted Exceptions）\n\n`Apache Commons Lang V3` 及更高版本的上下文异常提供了\
    \ [ContextedException](https://commons.apache.org/proper/commons-lang/apidocs/org/apache/commons/lang3/exception/ContextedException.html)\
    \ 和 [ContextedRuntimeException](https://commons.apache.org/proper/commons-lang/javadocs/api-3.1/org/apache/commons/lang3/exception/ContextedRuntimeException.html)。这些异常使得在异常中包含信息变得非常，从而让支持人员更容易诊断根源。列表\
    \ 3.14a 提供了如何使用 `ContextedRuntimeException` 的示例。日志中报告异常时的示例输出见列表 3.14b。如你所见，在日志中提供额外信息是很容易的，而且不会带来风险（例如，防止空指针异常）或格式化异常消息的费力工作。\n\
    \n#### 列表 3.14a：ContextedRuntimeException 使用示例\n\n```java\nthrow new ContextedRuntimeException(“Error\
    \ adding customer”, rEx)\n    .addContextValue(“accountId”, accountId)\n    .addContextValue(“accountType”,\
    \ accountType)\n    .addContextValue(“customerName”, customerName);\n```\n\n####\
    \ 列表 3.14b：ContextedRuntimeException 日志输出示例\n\n```text\norg.apache.commons.lang3.exception.ContextedRuntimeException:\
    \ Error adding customer\n\nException Context:\n\n      [1:accountId=12345]\n \
    \     [2:accountType=PERSONAL]\n      [3:customerName=null]\n---------------------------------\n\
    \      at examples.commons.lang.context.ContextedExceptionTest.test(ContextedExceptionTest.java:18)\n\
    \      at sun.reflect.NativeMethodAccessorImpl.invoke0(Native Method)\n      at\
    \ sun.reflect.NativeMethodAccessorImpl.invoke(NativeAccessorImpl.java:7)\n   \
    \   at sun.reflect.DelegatingMethodAccessorImpl.invoke(DelegatingMethodAccessorImpl.java:43)\n\
    \      at java.lang.reflect.Method.invoke(Method.java:606)\n      at org.junit.runners.model.FrameworkMethod$1.runReflectiveCall(FrameworkMethod.java:50)\n\
    ------------ Output omitted for brevity\n```\n\n记录失败的远程调用的请求和响应。包含与调用相关的请求和响应，这样如果需要与被调用的服务进行通信，你已经拥有了小组诊断问题所需的所有信息。为了说明这种做法有多用：在与过去一个客户合作时，我们对所有远程服务调用实施了这种做法，结果我们能够\
    \ 100% 地定位问题并识别出哪个服务出了问题。此外，开发者节省了时间，因为他们有一个现成的测试用例可以执行和调试。使用 `Apache HttpClient`\
    \ 产品实现此点的示例可以在列表 315 中找到。\n\n#### 列表 3.15：HttpClient 异常示例\n\n```java\npublic static\
    \ CloseableHttpResponse executeGet(String requestUrl, Map<String,String> headerMap)\
    \ {\n    Validate.notEmpty(requestUrl, \"Null or blank requestUrl not allowed.\"\
    );\n    HttpGetRequest uriRequest = new HttpGet(requestUrl);\n    for (String\
    \ header : headerMap.keySet()) {\n        uriRequest.addHeader(header, headerMap.get(header));\n\
    \    }\n    CloseableHttpClient httpclient = HttpClients.createDefault();\n  \
    \  CloseableHttpResponse response = null;\n    try {\n        response = httpclient.execute(uriRequest);\n\
    \        logger.info(\"Sevice Request Execution. requestUrl={} \\nheaders={} \\\
    nresponse={}\", uriRequest, headerMap, response);\n    } catch (Exception e) {\n\
    \        throw new ContextedRuntimeException(\"error making RESTful web service\
    \ call\", e)\n            .addContextValue(\"requestUrl\", requestUrl)\n     \
    \       .addContextValue(\"headers\", headerMap);\n    }\n    return response;\n\
    }\n```\n\n有些人会更进一步，建议在可配置的时间范围内捕所有请求和响应。这有助于调试未产生异常的问题，即导致行为错误但没有抛出异常的问题。拥有一个可搜索的请求/响应库将为开发者在调查支持问题时节省时间。\n\
    \n## 服务安全\n\n安全是分层实现的。每一层都代表了攻击者的一道“障碍”。受保护的资源越敏感，周围设置的安全层就越多；这使得未经授权的访问受保护资源变得更加困难。这是一个我们随处使用的基础安全概念。作为安全层的一个简单示例，组织使用防火墙在内部资源周围设置安全层；你必须拥有防火墙的内部访问权限才能访问内部\
    \ Web 和资源。组织不会止于这一层；它们通常还会使用访问组（例如 LDAP 组）来区分哪些用户可以访问哪些资源——但你明白这个意思。每一层都为攻击者提供了障碍，从而使资源更难被破解。微服务安全也不例外，并且很好地符合这一范式。\n\
    \n限制对生产微服务库的访问访问。第一道防线是网络。将整个服务器端网络架构（包括你的微服务库）放在防火墙后面，并限制访问它的虚拟机（VM）并不罕见。也就是说，防火墙允许微服务库的消费者进入，但不允许其他流量。如果你实现了\
    \ API 网关模式，你的 Web 应用（包括内部和外部）就是微服务库的唯一消费者，也是真正需要访问的虚拟机。支持人员可以通过具有网络访问权限的某些环境提供远程访问。组织中的大多数人不需要直接访问微服务库，并可以轻松通过防火墙限制其使用。该概念的图表可以在图\
    \ 3.2 中找到。\n\n图 3.2：微服务库的网络访问\n\n![](img/00019.jpeg)\n\n"
- fmt: '

    The advantages to using network access security for your microservice library
    are several: It’s easy and comprehensive. There’s absolutely no impact on the
    microservices themselves or the packaging of them when you implement the security
    layer; and this layer can be enhanced and changed without affecting individually
    deployed microservices in the slightest. Network access security takes no planning
    on the developer side; however, there are some services that are more sensitive
    than others. Examples I can think of are human resources (e.g., salaries and sensitive
    personal information about employees) or medical records. Some services and data
    are going to need an additional level of security.


    Establish service level accounts for services that need additional security. This
    is very similar to how database data is usually secured. End user security credentials
    aren’t used for database connections; service accounts are established so we can
    utilize connection pooling. Services are no different. Most secure microservices
    use [OAUTH](https://en.wikipedia.org/wiki/OAuth) as they typically provide a RESTful
    web service interface. Furthermore, make the service accounts and passwords configurable
    as we do with database credentials. The mechanics of securing RESTful web services
    using `OAUTH` are no different for microservices than for other types of RESTful
    web services and won’t be directly addressed in this book.


    Don’t provision microservice access directly to end users. End user security for
    your web applications shouldn’t be any different now that they are relying on
    a microservice library. End user credentials are often needed to allow/restrict
    individual users from specific features of the web application. Using a microservices
    architecture doesn’t alter this need in the slightest. However, do not pass end
    user credentials onto your service library. That would add an extreme level of
    complexity to managing security and wouldn’t provide any additional benefits.


    ## Contract Testing Procedures and Requirements


    Scheduled and automated contract testing procedures for microservice libraries
    are critical for several reasons. This section will discuss these concerns.


    Continuous integration for microservices is essential. Microservices architecture
    facilitates higher development throughput. That means a higher frequency of production
    deployments and less opportunity for manual integration testing. The implication
    here is that automated contract testing for microservice libraries is essential.
    Without the safeguard of continuous integration and the automated contract testing
    that comes with it, you’ll find defects migrated to production. Continuous integration
    is the main safeguard against deploying defects to production. Unit testing for
    code within microservices, while useful, isn’t as effective as a safeguard in
    a microservices architecture. Some even advocate abandoning unit testing altogether
    in favor of contract testing, but I’m not quite willing to go that far.


    Continuous integration compensates for developer myopia. In a world where developers
    work on one service at a time and increasingly rely on service calls, they don’t
    have the complete context for any change. They don’t understand exactly what might
    break from a business perspective should they deploy a defect. You might see this
    as a negative, but it’s purposely part of the paradigm to make developers more
    focused and productive. My point is that developer myopia needs mitigation, and
    continuous integration and automated testing is that mitigation.


    Continuous integration allows individual microservices to be truly disposable.
    In a world where services approach being ‘disposable’ – that is, it’s relatively
    easy to scrap one version of a service and completely rewrite it – a new version
    of a service needs to do exactly what the old one did. With a healthy automated
    test library, developers can rewrite and refactor services more safely and with
    less fear of causing production issues.


    Continuous integration prevents developer mistakes from proceeding to production.
    From a management perspective, contract testing is your bulkhead against rogue
    developers. We’ve all had to manage developers that don’t seem to take direction
    and want to do their own thing, sometimes not for the good of the organization.
    Microservices architecture gives you an opportunity to put a container around
    rogue developers, particularly if you have rigorous contract testing in place.


    ## Consumer-based Contract Testing


    There’s a comparatively recent development with contract testing that’s worth
    considering. Most of us are used to writing contract tests for services we publish.
    In a world where services are more reliant on other services, some organizations
    are having consumers test the functionality of services they depend on. That is,
    you consume a service, and you contribute automated tests for features in that
    service that you rely on. That service can’t deploy until it passes all of its
    consumer-provided tests as well as those provided by the service publisher.


    For process services – that is, those that rely on other services – you can argue
    that this is merely a semantic change. Contract tests for process services, by
    definition, test services they rely on. In this way, everyone implementing microservices
    will, in effect, be implementing consumer-based testing at some level. However,
    with most process service tests, there won’t be a direct correlation between that
    test failure and the effective failure of one of the services it relies on. That
    is, without some type of investigation, it won’t be obvious that a service contract
    change is the cause of a process service test failure.


    While this creates more work for service publishers, it adds safety. You could
    also look at it as optimizing support resources. Is it more efficient to react
    when a defect goes into production or is it easier to prevent it? Many organizations
    have come to the conclusion that it’s cheaper and easier to prevent it; hence
    consumer-based testing.


    Consumer-based testing guards against unannounced contract changes in the services
    you consume. If a service can’t proceed to production without passing all consumer-based
    contract tests, developers for that service will be much less likely to introduce
    contract-breaking changes. It will (properly) be put as a last resort for them.


    ## Tooling Support for Contract Testing


    Fortunately, as RESTful web services and SOA architectures have been around for
    a long time, the tooling needed to support contract testing for microservices
    is plentiful. Some products to consider are the following:


    *   Apache [HttpClient](http://hc.apache.org/httpcomponents-client-4.4.x/index.html)
    for RESTful web service contract testing

    *   [SoapUI](http://www.soapui.org/) for either Soap or RESTful web service contract
    testing

    *   [ActiveMQ](http://activemq.apache.org/how-to-unit-test-jms-code.html) for
    JMS or AQMP testing. They have an effective embedded broker that works for testing

    *   [Jenkins](https://jenkins-ci.org/) for automated and scheduled builds.


    ## Chapter 4: Microservice Usage Guidelines


    This chapter provides advice on when to use microservices architecture. Hint:
    it’s not all the time. When new paradigms arrive, they tend to be over-used. Microservice
    usage is no exception. This chapter will provide guidance on when microservices
    architecture can provide benefit, and it will attempt to separate the wheat from
    the chaff. That is, it will tell you where the marketing fluff is – hint: there
    is some!


    ### When to Use Microservices Architecture


    Microservices architecture isn’t appropriate for all applications. Any distributed
    application paradigm, such as microservices, is by definition more complex and
    takes more resources to maintain. This section will detail when microservices
    architecture should be considered.

