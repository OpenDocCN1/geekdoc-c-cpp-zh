  raw: 'The advantages to using network access security for your microservice library
    are several: It’s easy and comprehensive. There’s absolutely no impact on the
    microservices themselves or the packaging of them when you implement the security
    layer; and this layer can be enhanced and changed without affecting individually
    deployed microservices in the slightest. Network access security takes no planning
    on the developer side; however, there are some services that are more sensitive
    than others. Examples I can think of are human resources (e.g., salaries and sensitive
    personal information about employees) or medical records. Some services and data
    are going to need an additional level of security.


    Establish service level accounts for services that need additional security. This
    is very similar to how database data is usually secured. End user security credentials
    aren’t used for database connections; service accounts are established so we can
    utilize connection pooling. Services are no different. Most secure microservices
    use [OAUTH](https://en.wikipedia.org/wiki/OAuth) as they typically provide a RESTful
    web service interface. Furthermore, make the service accounts and passwords configurable
    as we do with database credentials. The mechanics of securing RESTful web services
    using OAUTH are no different for microservices than for other types of RESTful
    web services and won’t be directly addressed in this book.


    Don’t provision microservice access directly to end users. End user security for
    your web applications shouldn’t be any different now that they are relying on
    a microservice library. End user credentials are often needed to allow/restrict
    individual users from specific features of the web application. Using a microservices
    architecture doesn’t alter this need in the slightest. However, do not pass end
    user credentials onto your service library. That would add an extreme level of
    complexity to managing security and wouldn’t provide any additional benefits.


    Contract Testing Procedures and Requirements


    Scheduled and automated contract testing procedures for microservice libraries
    are critical for several reasons. This section will discuss these concerns.


    Continuous integration for microservices is essential. Microservices architecture
    facilitates higher development throughput. That means a higher frequency of production
    deployments and less opportunity for manual integration testing. The implication
    here is that automated contract testing for microservice libraries is essential.
    Without the safeguard of continuous integration and the automated contract testing
    that comes with it, you’ll find defects migrated to production. Continuous integration
    is the main safeguard against deploying defects to production. Unit testing for
    code within microservices, while useful, isn’t as effective as a safeguard in
    a microservices architecture. Some even advocate abandoning unit testing altogether
    in favor of contract testing, but I’m not quite willing to go that far.


    Continuous integration compensates for developer myopia. In a world where developers
    work on one service at a time and increasingly rely on service calls, they don’t
    have the complete context for any change. They don’t understand exactly what might
    break from a business perspective should they deploy a defect. You might see this
    as a negative, but it’s purposely part of the paradigm to make developers more
    focused and productive. My point is that developer myopia needs mitigation, and
    continuous integration and automated testing is that mitigation.


    Continuous integration allows individual microservices to be truly disposable.
