    );\n    return registration;\n}\n```\n源：来自 Moneta 的类 `org.moneta.config.springboot.MonetaSpringBootApplication`\
    \ (https://github.com/Derek-Ashmore/moneta)\n\n### 列表 3.4：Spring Boot 过滤器配置示例\n\
    \n```java\n@Bean\npublic FilterRegistrationBean monetaPerformanceFilter() {\n\
    \    FilterRegistrationBean registration =\n        new FilterRegistrationBean(new\
    \ MonetaPerformanceFilter(),\n            monetaServlet(), monetaTopicListServlet());\n\
    \    return registration;\n}\n```\n源：来自 Moneta 的类 `org.moneta.config.springboot.MonetaSpringBootApplication`\
    \ (https://github.com/Derek-Ashmore/moneta)\n\n正如你预期的那样，该类有一个 `main` 方法，用于加载应用程序配置、安装健康检查，并激活性能指标收集以及\
    \ [`JMX`](https://docs.oracle.com/javase/tutorial/jmx/overview/)。此外，该类定义了几个 servlet\
    \ 和 servlet 过滤器。在传统的 Web 应用中，这些定义在 `web.xml` 配置文件中；但 `Spring Boot` 的配置则不同。\n\n\
    `Spring Boot` 默认使用 `Logback` 日志。在这个层级，日志配置可能是为了开发人员的方便。当服务部署时，生产环境的日志配置可能会覆盖写入的内容。如果你使用如\
