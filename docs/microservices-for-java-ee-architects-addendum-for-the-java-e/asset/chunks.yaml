    关于微服务架构定义以及该范式定义的权威指南，是 Fowler 和 Lewis 写的[微服务](http://martinfowler.com/articles/microservices.html)。你可能还记得我将微服务定义为大多数微服务都具备的一系列特征。我曾希望能声称这是我的原创思想，但我做不到。Fowler/Lewis
    的文章是关于微服务特征列表的权威标准。我选择了我认为最重要的特征进行重点强调。


    Fowler 在微服务架构的前决条件方面也做出了非常有价值的工作（可见[此处](http://martinfowler.com/bliki/MicroservicePrerequisites.html））；也就是说，在大规模尝试微服务架构之前，你应该具备的能力。


    微服务领域的另一位思想领袖是 Adrian Cockroft。你可以在这个[视频](http://www.infoq.com/presentations/migration-cloud-native)中看到他的作品。我关注他的[Twitter](https://twitter.com/adrianco?ref_src=twsrc%5Egoogle%7Ctwcamp%5Eserp%7Ctwgr%5Eauthor)动态。


    我密切关注该领域的两个开源项目。第一个是 [Netflix](https://github.com/Netflix) 产品套。他们必须支持惊人的吞吐量，并且慷慨地开源了他们为了支持这些而构建的工具。第二个是
    Apache [Mesos](http://mesos.apache.org/)，它本质上让计算资源无处不在。也就是说，它允许你通用地看待计算资源，而不必担心这些资源在哪里。由于微服务架构产生了大量的部署物，这对于减少部署管理问题非常有前景。


    感谢你花时间本书。如果你有任何意见或问题，欢迎通过 derek.ashmore@dvtconsulting.com 或 [LinkedIn](http://www.linkedin.com/in/derekashmore)
    与我联系。我总是对反馈感兴趣。


