  trans: '


    DevOps 自动化使得支持更多的部署单元成为可能。在 `SOA` 流行时期，支持指数级增长的部署单元对于运维人员来说是一个严峻的问题。在过去，设置是手动的，而且往往是重复性的。在
    DevOps 世界中，得益于 `Docker`、`Chef` 和 `Puppet` 等工具，新环境可以进行配置并以自动化的方式进行部署；因此不再需要大量的人工操作。


    硬件和网络基础设施比以往任何时候都廉价。在过去，调整资源消耗至关重要，因为设备极其昂贵。现在，微服务架构所需的额外内存和进程开销已不再是主要问题。


    # 模块化的未来方向


    微服务架构并不是 Java EE 应用模块化的唯一范式。本节将简要描述其他 Java EE 模块化的尝试，并将其与微服务架构进行对比。


    ## Java 9 与 Jigsaw


    `Jigsaw` 正式向 Java 平台引入了模块化。目前已有早期发布版本，尽管预计直到 2016 年才会发布正式版本。基本上，该功能附带了一个新的部署单元（模块库或
    `jmod`），它在进程内工作，但保证拥有自己的微型运行时环境。关于 `Jigsaw` 的更多细节可以参考[此处](http://openjdk.java.net/projects/jigsaw/doc/quickstart.html)。


    将 `Jigsaw` 与微服务架构相比有几处不同。`Jigsaw` 具有以下优势：


    *   内存消耗更低，因为它在进程内运行。

    *   编译器强制合约（而非运行时）。


    然而，微服务架构相比 `Jigsaw` 仍具有若干优势：


    *   服务可以独立扩展。

    *   服务与技术栈无关；不受限于 `java`。

    *   服务的部署可以独立管理；不会被编译到运行时产物中。


    正如我们讨论过的硬件成本降低，优化内存已不再像以前那样重要了。总的来说，微服务架构比 `Jigsaw` 为企业提供了更多的自由和灵活性。


    ## OSGi


    `OSGi` 是 Java 平台的一种模块化解决方案，是在平台正式支持模块化之前发明的。与微服务架构相比，它的优缺点列表与 `Jigsaw` 完全相同。事实上，你可以将
    `Jigsaw` 看作是实现了与 `OSGi` 相同的目标。


    将 `OSGi` 与微服务架构相比有几处不同。`OSGi` 具有以下优势：


    *   内存消耗更低，因为它在进程内运行。

    *   编译器强制合约（而非运行时）。


    微服务架构相比 `OSGi` 仍具有若干优势：


    *   服务可以独立扩展。

    *   服务与技术栈无关；不受限于 `java`。

    *   服务的部署可以独立管理；不会被编译到运行时产物中。


    顺便一下，`OSGi` 的普及率非常低。如果你查看 `indeed.com` 或 `Google Trends` 的统计数据，`OSGi` 的职位需求一直增长到
    2011 年，之后一直在同样的低水平波动。


    ## 开源采用


    我看到发布在 `GitHub` 和其他开源托管平台上的、旨在作微服务的开源产品正在不断增长。我预计这一趋势将持续下去。例如，2015 年 6 月在 `GitHub`
    上搜索“microservice”一词，结果略超过 1,100 个仓库。到 2016 年 1 月，这个数字略超过 3,200 个。虽然并非所有仓库都包含设计为微服务部署的产品，这确实如此，但其中某些比例是，而且可以怀疑这个数字在过去的几个月里已经增长了。


    # 第 5 章：管理微服务开发


    微服务架构对开发者和架构师的影响是巨大的。对管理的影响同样巨大。大多数关于微服务架构主题的作者和演讲者集中在微服务的更技术层面上。作为架构师，我们应该交付业务价值。这些价值的一部分是就采用微服务架构的影响建议管理层，以及他们扮演的角色。


    ## 采用微服务架构的先决条件


    在大规模采用微服务之前，需要准备并运行相应的基础设施要求。本节将尝试为建议管理层的架构师以及经理本身提供指导。


    ### 治理的变化


    你无疑拥有管理开发从测试、用户验收到生产环境周期的流程和程序。可能需要在生产迁移之前填写表格获得批准。这些程序的意图通常是降低部署风险并防止缺陷迁移到生产环境。我确定，在没有引入微服务架构的情况下，这些流程对于你目前处理的部署量运行得良好。


    目标是为微服务架构提供治理和基础设施支持，但做法不能拖慢一切。记住，益处之一本应该是更高的开发速度。治理与速度是背道而驰的。


    大多数治理程序无法实现指数级扩展。微服务架构将指数级增加你管理的部署数量。组织建立的大多数流程并非旨在处理你当前量的 10 倍或 20 倍。你将开发移至生产环境的官僚程序可能无法生存那种增长。更有可能的是，你的治理程序需要改变和适应，以处理微服务架构带来的指数级增长。


    自动化生产部署过程，包括测试和审批。微服务架构的优势之一是，微服务拥有“虚拟”用户。因此，它们没有需要通过视觉检查来验证美学等特征的用户界面。微服务的测试可以完全自动化。Web
    应用程序用户界面可能需要手动检查，以确保它们拥有的更主观的是正确的，但微服务不需要。是的，自动化整个过程需要投入，但如果你大量投入微服务是为了获得该范式提供的收益，那么自动化在某个时间点会产生回报的。


    自动化缺陷检测和回滚启动。自动化测试将对缺陷部署提供某种保护。可以考虑的额外保护措施是建立一种机制，检测部署后失败率的变化，并在失败率增加超过可配置阈值时自动启动回滚。任何不习惯于完全依赖自动化部署过程的人，都可以通过在产生错误时增加自动回滚来增加安全感。


    '
- fmt: '

    # Embrace a DevOps culture


    The number of deployables with microservices architecture grows exponentially,
    sometimes as many as 20 times what you have with traditional web applications.
    It is not possible to have completely manual processes for establishing new environments
    and managing deployments. Embracing a DevOps culture where environments are created
    and managed programmatically, and reducing the amount of manual labor per environment,
    is absolutely essential for managing a large number of deployables.


    The ability to create and secure new environments quickly is essential. The number
    of virtual machines you use will increase as new services are identified and new
    resources requested. The growth in virtual machines can be reduced by utilizing
    the Apache [Mesos](http://mesos.apache.org/) product or some other type of resource
    management software. That in itself requires work and additional investment. Cloud
    integration isn’t technically required to adopt microservices architecture, but
    many users do choose to integrate so they have the flexibility to exponentially
    grow the number of virtual machines they support in a short period of time.


    Demands on Database Administration Staff will increase. Most people think of additional
    demands on operations staff. As a microservices architecture also increases the
    number of databases as well as the number of deployables, demands for new schema/database
    creations and enhancements will also increase. This means that demands on database
    administrators will also increase. Some organizations migrate that onto the microservice
    teams themselves, but the work doesn’t go away no matter how it’s organized. It’s
    not often discussed, but database administrators will also need to adopt a DevOps
    culture and automate more of what they do.


    ## Service Contract Management


    Not a lot has been written about how microservice teams get their feature enhancement
    assignments. Microservices, by their very nature, provide the guts of the capabilities
    users request, but not in a context that those users are likely to understand.
    It’s more likely that users will make a feature request of the team providing
    them a web application or user interface. Upon realizing that they don’t have
    the capability to deliver on the feature request, the team will need to pass the
    non-GUI portions of the request onto one or more microservice teams to implement.
    For instance, suppose a UI team receives a request to store a professor’s syllabus
    for a specific class and there’s no service currently available that has the ability
    to remember that information. Somebody needs to shepherd that request, figure
    out which service it belongs in, ensure that the feature request contains enough
    information to be actionable, and route it appropriately. There’s a body of work
    here that needs to be accomplished and accommodated somehow. Most organizations
    utilize some type of task management software (e.g., [Jira](https://www.atlassian.com/software/jira))
    to manage and track feature requests such as this.


    Service portfolio management will be essential. Yes, you can let developers design
    and publish service contracts as a grassroots effort. In other words, let them
    do what they want and pay no attention. Initially, this is the easiest way to
    manage. However, as the number of deployed services grows, the developers won’t
    be able to see the forest for the trees. You’ll get lots of duplication, and you’ll
    get lots of inconsistency in the services that are created and deployed. Eventually,
    these defects will grow as the list of services increases and will erode some
    of the benefits you get from microservices architecture.


    I would never suggest that you impose a formal process to review and bless all
    service contracts before they are deployed and used. That would hinder developer
    velocity, which is one of the intended benefits of microservices architecture.
    However, somebody should trail behind the development teams and catalog published
    services in a standard format available to everyone, including management. They
    would then be in a position to document service inconsistencies, send change recommendations
    to service teams, and help facilitate developers adopting existing services –
    as opposed to inventing new versions of existing services. They would also be
    able to point out potential risk areas to management, should there be any.


    Managing contract change will be essential. In a microservices world, the quality
    of the contracts will greatly impact the amount of benefit you receive from adopting
    microservices architecture. Poorly defined contracts will lead to confusion and
    chaos and negatively impact development velocity for new features. Some organizations
    are careful to limit the amount of change at any one time to keep quality high
    and guard against negatively impacting developer velocity.


    Feature enhancement assignments need to be unambiguous and clear to microservice
    team members. Remember that higher developer velocity is coming from the developer’s
    ability to be focused, and free from communication overhead. Giving them unclear
    feature assignments means that they will need to go and gather clarity from the
    users requesting them. Some process for grooming and tracking feature enhancement
    requests needs to be in place.


    ## Service Testing and Deployment Automation


    Investment in automated testing is essential. With higher development velocity
    comes an exponentially higher production deployment rate. Without testing automation,
    defects will quickly wreak havoc on your production environment. Automated contract
    testing is essential for mitigating these effects, as in this world there often
    isn’t time for manual testing. This automation isn’t free; it requires labor to
    set up as well as care and feeding. It also requires enforcement.


    Automated deployments are essential. With increased deployment velocity, manual
    intervention with each deployment isn’t as possible as it used to be. An argument
    can also be made that manual steps in deployments actually add risk because they
    add a chance of error. Yes, this statement assumes a well-written, well-tested
    deployment process that typically doesn’t have a failure history. It goes without
    saying that only products with green test suites should be allowed into production.


    Database changes should be automated too. Often database changes accompany service
    deployments of new features. These days, it’s possible for those changes to also
    be automated. Products like [FlyWayDb](http://flywaydb.org/) are good for managing
    changes like this. Yes, back outs or failed deployments will still require a certain
    amount of manual intervention, but hopefully, failed deployments will be a small
    percentage of the total.


    Consider providing a process for consumer-based testing. Consumer-based tests
    need to be automated and to be part of the test suite run against services. You
    can treat this as a test addition that must be green in order for a production
    deployment to proceed. The only difference here is that the consuming team is
    providing and maintaining them. I would treat this as an ‘option’ for service
    teams consuming other services rather than a requirement. In the past, I’ve had
    to rely on services that proved to be less reliable, resulting in many failing
    tests. For unreliable services, it’s nice to know at the outset that dependent
    services are down and the test failures you’re getting are expected. It saves
    investigation time.


    ## Team Management


    Manage the contract deliverables for teams, not the internal management of the
    teams themselves. One of the benefits of microservices architecture is the elimination
    of communication overhead. Managing by deliverable, and not micromanaging teams,
    helps eliminate that overhead. As long as you’re getting feature enhancements
    at an acceptable rate and quality, the way the team chooses to organize can be
    left to them.

    '
