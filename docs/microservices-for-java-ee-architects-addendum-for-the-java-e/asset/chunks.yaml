    Database connection pooling can be configured with Dropwizard. I wish the documentation
    for it were more centrally located, however. All options are in the database category
    and described in the product’s javadoc documentation [here](http://www.dropwizard.io/0.7.1/dropwizard-db/apidocs/io/dropwizard/db/DataSourceFactory.html).
    All the features we commonly use, such as configuring maximum and minimum pool
    size, validation behavior, and idle timeout behavior, are all here. An example
    of this section of the configuration can be found in listing 3.10.


    Listing 3.10: Example Dropwizard Connection Pool Settings


    # Connection Pool settings


    database:


      driverClass: org.hsqldb.jdbc.JDBCDriver


      url: jdbc:hsqldb:mem:my-sample


      user: SA


      password:


      autoCommentsEnabled: false


    # Sizing options


      initialSize: 1


      minSize: 1


      maxSize: 10


      maxWaitForConnection: 30 seconds


      evictionInterval: 5 seconds


    # Validation behavior


      validationQuery: SELECT CURRENT_DATE AS today, CURRENT_TIME AS now FROM (VALUES(0))


      checkConnectionWhileIdle: true


      checkConnectionOnBorrow: false


      checkConnectionOnConnect: false


      checkConnectionOnReturn: false


      validationInterval: 30 seconds


    As an aside, it’s interesting how Dropwizard configuration permits specifying
    the unit of time in question instead of assuming the often inconvenient “milliseconds.”
    In addition to milliseconds, seconds, minutes, hours, days, and others are supported.
    This information was gleaned from Dropwizard source (class Duration from dropwizard-util);
    it’s not documented anywhere that I could find.'
