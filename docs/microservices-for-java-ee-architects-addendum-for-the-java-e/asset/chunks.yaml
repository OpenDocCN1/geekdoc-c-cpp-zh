    微服务运行在独立的进程中。在 Java 世界中，这意味着它们作为独立的 `JVM` 运行。对于传统应用程序来说，将多个 Web 应用部署到同一个容器中并不罕见；但微服务并不会发生这种情况。它们需要保持独立，以便能够根据各自的需求进行扩展。例如，一个服务可能只需要一个三节点集群来满足消费者的需求，而另一个服务可能在它的集群中需要更多节点。某个服务可能需要集群中每个节点更多的内存，并且其托管方式与其他服务不同。


    微服务也运行在独立的进程中，因此它们可以独立地部署或替换，而不会影响其他服务。你的立体音系统就是一个很好的类比，尽管它更多是硬件而非软件。当我更换扬声器时，其他任何组件（例如接收机、监视器、蓝光播放器等）都没有受到任何影响。只要它们的输入和资源正确，它们就能完成自己的工作。当我更换接收机时情况也是如此。微服务应该具有相同水平的独立性和自给自足性。


    人们用来描述微服务的另一个类比是 Linux 操作系统及其高度组件化的实用程序。是的，Linux 使用标准输入/输出而不是 Web 服务，但它仍然是一个标准化的接口。一个很好的例子是
    `ls` 实用。它列出目录项。是的，它有许多选项，例如过滤或输出格式，但它有且仅有一个任务。


    微服务通常组合在一起，以提供应用程序所需的完整功能。由于微服务的关注点如此窄，没有一个微服务可以提供大多数应用程序所需的所有功能。事实上，我们将看到，微服务依赖其他微服务来履行其服务契约是很常的。图
    1.1 形象地描述了如何利用微服务来提供完整的应用程序功能。图中的箭头代表调用使用模式。


    ### 图 1.1：微服务架构


    ![](img/00002.jpeg)


    我们将看到，每个微服务都有自己的数据存储器或数据库。这消除了数据库层面的耦合，并确保数据库结构的变化不会影响一个以上的服务。我们将看到，微服务的自治性允许技术选择的灵活。


    关于微服务架构定义的一极优秀文章，请参阅 Fowler 和 Lewis 编写的 [Microservices](http://martinfowler.com/articles/microservices.html)。


    ## 与传统应用程序架构的对比


    让我们将其与传统的应用程序架构进行对比，例如在《Java EE Architect’s Handbook》中讨论的内容。传统应用程序架构就像分层蛋糕，如图
    1.2 所示。通常它有分层来提供用户界面、数据访问和业务逻辑；取决于其功能 set，它可能还有其他额外的层。表达这种想法的另一种方式是耦合性很高。


    ### 图 1.2：传统 Web 应用程序架构


    ![Traditional-Architecture-Macro.jpg](img/00003.jpeg)


    这些层旨在作为一个凝聚单元进行部署和测试（通常作为 `war` 或 `ear` 文件）。虽然可能在应用程序之外使用代码库的一部分，但这更多是例外而非常态。


    应用程序作为一个单元进行扩展。应用程序具有针对不同受众的功能并不罕见。例如，拥有只有少数人使用的管理功能，与可能被成百上千名用户使用的更主流的功能相比，这并不常见。传统架构必须连同其他更流行的功能一起扩展扩展管理功能，因为它们在同一个部署包中。对于不熟悉该术语的人来说，部署包（deployable）是应用程序的可运行版本（例如
    `war` 或 `ear` 文件）。


    作为这一想法的推论，缺陷往往会溢出到不相关的功能中。例如，如果一个功能存在缺陷占用了你的数据库连接池并导致容器无法运行，该应用程序中所有其他不相关的功能也无法运行，尽管它们从业务角度来看是互无关的。


    通常，整个代码库共享数据库资源。这意味着对数据库更改可能会影响整个应用程序代码库。是的，我们尝试通过像《Java EE Architect’s Handbook》中讨论的那样分离出数据访问层来使应用程序免受这些影响，但这种策略并不总是
    100% 有效。数据库更改需要 `Entity` 类更改并可能对其他层产生影响并不罕见。


    ## 什么是单体（Monolith）？


    通常，代码库在变得不可维护之前，其规模和复杂性是有限的。接近该点的应用程序被称为单体（monoliths）。


    单体的部署通常有很长的质量保证/测试周期。对于单体，由于功能集非常大，执行一次完整的回归测试需要用户花费大量时间。是的，自动化测试序列缩短了开发人员进程，但用户
    QA 测试通常包含大量的手动操作。


    随着每次更改，单体经常会遇到意料之外的问题。也就是说，你修复了一个问题，结果因为该更改意外创建了新的 bug。从这种意义上说，在单体中修复 bug 就像打地鼠。是的，你的自动化单元测试和集成测试有助于缓解这个问题，但该测试用具并不是
    100% 有效的。


    单体通常与其技术栈紧密结合。也就是说，在单体中升级或更换依赖要困难得多。例如，如果单体使用 `Hibernate` ORM 产品进行数据访问，那么要更换为替代的
    ORM 产品（如 `iBatis`）将非常困难。部分使用 `iBatis` 不仅会导致应用程序代码内部不一致；对于这种实际上没有直接增加业务价值的东西来说，测试工作将相当巨大。


    新开发者在单体上的上手时间（burn-in time）要长得多，因为有太多要学。代码库通常非常大且相互关联。无论涉及的技术库和框架如何，其巨大的规模都为新开发者引入了学习曲线。


    作为这一点的推论，开发者无法从一个应用程序轻松转移到另一个。这种学习曲线是针对每个单体的。单体的这一方面为管理在分配资源和调整优先级以应对任何业务优先级的变化方面带来了限制。


    在单体中诊断内存和性能问题通常更困难，因为“草堆”（代码库的大小）通常大得多。寻找内存泄漏可能是开发者经历的最令人沮丧和最耗时的活动之一。此外，工具通常无法直接揭示导致泄漏的代码，因此涉及手动分析。在微服务架构中，至少可能是罪祸首首的代码规模要小得多，从而导致更快的内存泄漏诊断和更快的解决。

