  trans: "\n\n当需要配置较低层级的容器设置时，Dropwizard 提供了一种通过输入 yaml 配置文件来实现的方法。可以在此处找到提供的设置列表。如何实现此点的示例可以参考我的[示例](https://github.com/Derek-Ashmore/moneta/blob/master/moneta-dropwizard/src/main/resources/moneta-config.yaml)\
    \ 以及列表 3.11。\n\n### 列表 3.11：Dropwizard 容器设置示例\n\n```yaml\nserver:\n  type: default\n\
    \  maxThreads: 150\n  minThreads: 20\n  maxQueuedRequests: 20\n```\n\n## Docker\n\
    \n`Spring Boot` 和 `DropWizard` 等产品依赖操作系统和 Java 安装来运行。在大多数组织中，该 Java 安装是多个应用程序共享的。对该\
    \ Java 安装的任何升级都存在对多个应用程序产生不利影响并导致意外后果的风险。换句话说，这种安装是微服务世界中并不真正需要的耦合。[Docker](https://www.docker.com/)\
    \ 消除了这种耦合，同时也消除了该 Java 所依赖的任何依赖原生代码的耦合。\n\nDocker 部署可以被认为是一个微型虚拟机。它带有完整的操作系统（Linux\
    \ 内核）以及产品运行所需的所有原生软件。Docker 部署可以包含为该部署服务的 Java JDK 安装，并且可以升级该 Java JDK，而不必担心会对多个服务产生不利影响。从本质上，它提供了升级保障。我们这些在大型企业环境中工作过的人已经看到，升级\
    \ Java 版本是一项非常巨大的工程，因为这种升级具有固有的测试工作。将 Java 安装与你的部署绑定在一起在很大程度上缓解了这些担忧。\n\nDocker\
    \ 已经迅速成为一种受欢的部署格式。对于那些未使用过 Docker 的人来说，它是“一次打包，到处运行”。Docker 对软件起的作用就像集装箱对实体货物起的作用。它对磁盘和网络具有标准的连接机制。此外，它很容易将\
    \ Docker“容器”连接在一起（例如，将数据库 Docker 容器与你的应用程序连接）。\n\n这对于系统管理员来说是一个胜利，因为它使得部署管理更加容易且更容易自动化；对于\
    \ Java 开发人员和架构师来说也是胜利。由于应用程序环境是可移植的并与应用程序打包在一起，特定于环境的问题和缺陷大大减少。在生产环境中运行的内容与你测试的内容更加相似。此外，由于你的应用程序运行在自己的\
    \ Java 版本和操作系统上，你可以升级 JDK 和你依赖的任何原生代码，而较少担心影响其他应用程序，甚至不需要让系统管理员来执行原生软件更改。\n\n\
    抛开热度之后，使用 Docker 也有成本和缺点。在 Linux 上运行 Docker 及其相关工具要容易得多；Windows 的支持有限。这一事实在大多数通常在\
    \ Windows 上进行开发的企业环境中造成了不便。在添加 Maven 功能以生成 Docker 镜像时，平台差异也带来了问题；Maven 构建本应该是平台无关的。此外，Docker\
    \ 确实有一个学习曲线。\n\n有些人可能担心额外的虚拟化层会导致性能问题。然而，IBM 进行了一项良好的[研究](http://domino.research.ibm.com/library/cyberdig.nsf/papers/0929052195DD819C85257D2300681E7B/$File/rc25482.pdf)，显示性能影响可以忽略不计。总而言之，使用\
    \ Docker 的优点大于成本。\n\n对于 Maven 用户，有几个 Maven 插件可以生成 Docker 镜像作为产物。在写本文时，我最喜欢的是 Spotify\
    \ 的 [docker-maven-plugin](https://github.com/spotify/docker-maven-plugin)。它非常容易使用和安装。使用示例可以在我\
    \ GitHub 上带有 Moneta 微服务示例的这个 [pom](https://github.com/Derek-Ashmore/moneta/blob/master/moneta-springboot/pom.xml)\
    \ 中找到。\n\n## 事务跟踪\n\n在传统的 Web 应用中，更容易跟踪事务贯穿整个给定的业务流程。异常的堆栈跟踪更有意义，因为特定事务的代码库通常是完整的。\n\
    \n在微服务世界中，情况并非如此。在一个业务事务可能利用多个服务的世界里，跟踪所有事务的历史变成了一个必要项。跨服务调用跟踪事务的常用方法是通过关联 ID（correlation\
    \ id）。\n\n在事务开始时，会分配一个唯一的事务 ID（或关联 ID）。该关联 ID 会随事务记录在所有日志中。该事务产生的任何服务调用都应该在头中包含该关联\
    \ ID，以便将其记录在任何活动中，包括对依赖服务的调用。\n\n### 图 3.1：关联 ID 示例\n\n![figure-3-1-Correlation-Id-Example.jpg](img/00018.jpeg)\n\
    \n其理念是确保事务的任何日志消息都存在关联 ID，这样日志就可以合并，以提供特定用户操作发生情况的完整视图。日志产品将此称为映射诊断上下文（MDC）。将\
    \ MDC 视为事务的线程本地上下文。当事务开始时，你通过编程方式在 MDC 中记录关联 ID。这通常通过使用 Servlet 过滤器或 Spring 拦截器来实现。你还可以在日志配置的模式布局中指定\
    \ MDC 信息，以便该 ID 能被报告。一个确保设置关联 ID 并使用 Slf4j 产品用 MDC 记录该 ID 的 Servlet 过滤器示例可以在[此处的](https://github.com/Derek-Ashmore/RequestCorrelationSlf4J/blob/master/src/main/java/org/force66/correlate/RequestCorrelationFilter.java)\
    \ 找到。一个确保事务具有关联 ID 并使用 Slf4j 产品用 MDC 记录它的代码示例可以在列表 3.12 中。\n\n### 列表 3.12：Servlet\
    \ 过滤器关联 ID MDC 示例\n\n```java\npublic void doFilter(ServletRequest request, ServletResponse\
    \ response,\n             FilterChain chain) throws IOException, ServletException\
    \ {\n    HttpServletRequest httpServletRequest = (HttpServletRequest) request;\n\
    \    // 确保分配了关联 ID。\n    String correlationId = httpServletRequest.getHeader(correlationHeaderName);\n\
    \    if (StringUtils.isEmpty(correlationId)) {\n        correlationId = UUID.randomUUID().toString();\n\
    \    }\n    // 将关联 ID 放入 MDC\n    MDC.put(loggerMdcName, correlationId);\n   \
    \ try {\n        chain.doFilter(httpServletRequest, response);\n    } finally\
    \ {\n        // 从 MDC 中移除关联 ID\n        MDC.remove(loggerMdcName);\n    }\n}\n\
    ```\n\n例如，假设关联 ID 记录在 MDC 的标签 `requestId` 下。该 `requestId` 可以在日志配置的模式布局中指定。允许随日志事件输出关联\
    \ ID 的 logback 配置可以在列表 3.13 中找到。\n\n### 列表 3.13：Logback MDC 模式示例\n\n```xml\n<appender\
    \ name=\"STDOUT\" class=\"ch.qos.logback.core.ConsoleAppender\">\n    <!-- 编码器默认被分配类型\
    \ ch.qos.logback.classic.encoder.PatternLayoutEncoder -->\n    <encoder>\n   \
    \     <pattern>%d{HH:mm:ss.SSS} [${HOSTNAME}] [%thread] %-5level\n           \
    \      %logger{36} REQUEST_ID=%X{requestId} - %msg%n</pattern>\n    </encoder>\n\
    </appender>\n```\n\n关于 MDC 的 Slf4j 实现的信息可以在此处找到。Logback 和 Log4j 支持 MDC 功能。\n\n"
- fmt: "\nFrom the Java perspective, there are at least three parts to this algorithm.\
    \ Typically, there will be a servlet filter to ensure that each transaction has\
    \ a correlation id. If it doesn’t, one is generated and assigned. Also, that filter\
    \ registers the correlation id with the logging framework used so that the information\
    \ is included in log entries automatically.\n\nSecondly, the log format needs\
    \ to include the correlation id with all log entries. All the major frameworks\
    \ support this concept. There’s an example of a servlet filter such as this that\
    \ utilizes `Slf4J` as a logging framework [here](https://github.com/Derek-Ashmore/RequestCorrelationSlf4J).\n\
    \nThirdly, all outgoing service calls need to have the correlation id in the header.\
    \ Unfortunately, all implementations for this are product specific. It depends\
    \ on the web service framework used. For the `Apache HttpClient` product, you\
    \ should add the correlation id to the header.\n\nThe intent for this technique\
    \ is to cover REST as well as SOAP. You shouldn’t use the SOAP headers; use the\
    \ http headers.\n\n## Exception Handling for Remote Calls\n\nWith microservices\
    \ architecture, localizing problems is often where large amounts of support time\
    \ is spent. There are some easy steps you can take to reduce effort spent localizing\
    \ problems.\n\n### Utilize Contexted Exceptions\n\nContexted exceptions from `Apache\
    \ Commons Lang V3` and later have [ContextedException](https://commons.apache.org/proper/commons-lang/apidocs/org/apache/commons/lang3/exception/ContextedException.html)\
    \ and [ContextedRuntimeException](https://commons.apache.org/proper/commons-lang/javadocs/api-3.1/org/apache/commons/lang3/exception/ContextedRuntimeException.html).\
    \ These exceptions make it very easy to include information with the exception\
    \ that makes it easier for support developers to diagnose the root cause. An example\
    \ of how to use the `ContextedRuntimeException` is provided in listing 3.14a.\
    \ Example output when the exception is reported in the log is presented in listing\
    \ 3.14b. As you can see, it’s easy to provide additional information in the log\
    \ without incurring the risk (e.g., guarding against null pointer exceptions)\
    \ or labor for formatting the exception message.\n\n#### Listing 3.14a: ContextedRuntimeException\
    \ Usage Example\n\n```java\nthrow new ContextedRuntimeException(“Error adding\
    \ customer”, rEx)\n    .addContextValue(“accountId”, accountId)\n    .addContextValue(“accountType”,\
    \ accountType)\n    .addContextValue(“customerName”, customerName);\n```\n\n####\
    \ Listing 3.14b: ContextedRuntimeException Log Output Example\n\n```text\norg.apache.commons.lang3.exception.ContextedRuntimeException:\
    \ Error adding customer\n\nException Context:\n\n      [1:accountId=12345]\n \
    \     [2:accountType=PERSONAL]\n      [3:customerName=null]\n---------------------------------\n\
    \      at examples.commons.lang.context.ContextedExceptionTest.test(ContextedExceptionTest.java:18)\n\
    \      at sun.reflect.NativeMethodAccessorImpl.invoke0(Native Method)\n      at\
