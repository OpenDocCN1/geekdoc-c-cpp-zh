- fmt: "\nIt is possible, with the Oracle JVM, to trigger a memory dump when an `OutOfMemoryError`\
    \ is generated through the `HeapDumpOnOutOfMemoryError` startup option. This is\
    \ rather limiting as this event can only happen once. Should the JVM recover from\
    \ the memory shortage, additional occurrences will not generate heap dumps.\n\n\
    Monitor concurrent load for deployed services. This information is needed for\
    \ capacity planning. Increases in concurrent load will increase required memory\
    \ and often increase average transaction time. In years past, I’ve monitored concurrent\
    \ load from within the JVM using [Admin4J](http://admin4j.net/doc/unexpectedLoad.html).\
    \ These days, with cloud vendors providing scaling capabilities, it might make\
    \ more sense to monitor load from outside the JVM.\n\nAlerts for resource consumption\
    \ issues are usually handled via log management software. That is, those ‘alerts’\
    \ are recorded in the log at an `ERROR` level, and log management software initiates\
    \ some type of alert (e.g., initiate email or work ticket) to an administrator.\n\
    \n# Logging and Error Handling\n\nWith microservices architecture, the ability\
    \ to easily search all logs from all services is essential. In that world, the\
    \ number of deployables exponentially increases, and it’s not practical for support\
    \ personnel to manually search individual log files from those deployables. With\
    \ microservices architecture, using some type of log management system transitions\
    \ from being a ‘nice to have’ to being an absolute requirement.\n\nLog management\
    \ software, such as [LogStash](https://www.elastic.co/products/logstash) or Splunk,\
    \ gathers individual log entries and centrally stores them. Furthermore, these\
    \ tools provide a central way for support personnel to search them and configure\
    \ automatic alerts. It’s not uncommon for errors detected by your log management\
    \ software to either generate some type of support ticket to be investigated or\
    \ initiate an email to a central support email account.\n\n## Bundle needed information\
    \ with exceptions that you throw\n\nOne of the main reasons for logging is to\
    \ provide information needed to resolve a bug resulting in an exception. This\
    \ additional logging code adds additional risk since exception code isn’t typically\
    \ tested as thoroughly. Hence, there’s usually a larger chance of excepting (e.g.,\
    \ from a `NullPointerException`) during exception message formatting than with\
    \ non-exception code.\n\nApache Commons Lang, starting with `V3.0`, provides a\
    \ contexted exception ability that reduces this risk by making it easy and less\
    \ risky to include additional information with the exception itself (see classes\
    \ `ContextedException` and `ContexedRuntimeException` from Commons Lang). This\
    \ additional information will be present when this exception is logged. Consider\
    \ the example in Listing 3.1.\n\n### Listing 3.1: Sample Contexted Exception\n\
    \n```\nthrow new ContextedRuntimeException(“Error creating application”, exception)\n\
    \  .addContextValue(“application id”, applicationId)\n  .addContextValue(“customer\
    \ id”, customerId);\n```\n\nWhen the exception in Listing 3.1 is logged, the context\
    \ labels and values will automatically appear in the log, along with the error\
    \ message and stack trace. Note that application code doesn’t increase the risk\
    \ of a derivative exception by adding conditional logging logic or formatting\
    \ logic. If it weren’t for the contexted exception ability, developers would have\
    \ to add logging code to supply the information needed to resolve the bug.\n\n\
    ## Log transaction exceptions only once\n\nLogging exceptions multiple times will\
    \ greatly inflate your logs and make a specific exception pertaining to a reported\
    \ defect much harder to find. You can avoid the problem of repeating log messages\
    \ by logging exceptions at the entry points only. For example, it’s easy to implement\
    \ a servlet filter that will log exceptions for any web transactions. This ensures\
    \ that exceptions are logged only once. This advice assumes that you’ve bundled\
    \ any additional information needed to resolve the error with the exception itself,\
    \ as described earlier in this chapter. Listing 3.2 illustrates a servlet filter\
    \ of this type.\n\n### Listing 3.2: Logging Servlet Filter example\n\n```\npublic\
    \ void doFilter(ServletRequest request, ServletResponse response, FilterChain\
    \ chain) throws IOException, ServletException {\n    try {\n        chain.doFilter(request,\
    \ response);\n    }\n    catch (Throwable t) {\n        logger.error(\"Web Transaction\
    \ Error\", t);\n        ServletUtils.reThrowServletFilterException(t);\n    }\n\
    }\n```\n\nSource: Class `net.admin4j.ui.filters.ErrorLoggingFilter` from Admin4J\
    \ (http://www.admin4J.net)\n\nThis technique reduces application code and increases\
    \ the chance that generated exceptions are logged. Furthermore, if you leverage\
    \ the Admin4J product, which has an error handling filter, you’ll get the request\
    \ URL and a dump of any request and session attributes at the time of the exception.\
    \ In other words, you can leverage an open source product to accomplish this,\
    \ rather than creating your own servlet filter for this purpose.\n\nIncidentally,\
    \ you’ll need to provide similar architectural support for batch job classes,\
    \ EJB classes, and Message-Driven beans. Leaving exception logging to application\
    \ code increases the probability that an exception doesn’t get properly logged.\n\
    \n## Do not commingle transaction logs with normal application logging\n\nTransaction\
    \ logs (e.g., user Fred changed the address of customer Acme) have a different\
    \ purpose. Often, transaction logs are needed by normal business processes and\
    \ really aren’t directed at product support. Most logging products will allow\
    \ you to direct transaction logs to a separate output for this purpose.\n\nNote\
    \ that log retention and storage concerns are a completely separate topic. Most\
    \ logging products support storing logs in a variety of formats, including file\
    \ or database formats. Application code should only be concerned with issuing\
    \ log messages, not with the specifics of how they are stored or for how long\
    \ they are retained.\n\n## Provide a default logging configuration that can be\
    \ overridden at deployment\n\nThis is purely a convenience for developers that\
    \ may need to run a build but might not have taken the trouble to configure their\
    \ local deployment. Furthermore, it’s not possible for developers to anticipate\
    \ logging needs for specific deployments. Consequently, it’s important that administrators\
    \ be able to easily configure logging at deployment time.\n\n# Posting Change\
    \ Events\n\nGiven that each microservice has its own database, there are two options\
    \ for accommodating common business data that is needed by several services. (I\
    \ highlighted this issue earlier.) The first option, which I prefer, is not to\
    \ duplicate that common data but rather to call the service responsible for maintaining\
    \ that data when it’s needed. The second option is to ‘copy’ common business data\
    \ to all services that need it. For those that opt to ‘copy’ common business data\
    \ between services instead of nesting service calls, copies are generally accomplished\
    \ using publish/subscribe messaging.\n\nThe microservice responsible for maintaining\
    \ common business data would publish any change (e.g., add, change, or delete)\
    \ under an established topic in a consistent format. For example, a service responsible\
    \ for maintaining campus information (e.g., a `Campus` microservice) at a university\
    \ might publish the addition of a new campus or a change in status for an existing\
    \ campus under the topic `CampusEvent`.\n\nAny interested services would listen\
    \ on that topic and process any published changes. Typically, services listening\
    \ for those changes would need to publish a listener to monitor that topic. For\
    \ example, a `Course` microservice might listen to the `CampusEvent` topic and\
    \ process any changes received. The `Course` microservice would record any campus\
    \ changes received in its own database.\n"
