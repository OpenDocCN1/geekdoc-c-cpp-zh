    \n## Dropwizard\n\n[Dropwizard](http://www.dropwizard.io/) 将 Java Web 应用打包成单个可执行的\
    \ jar 文件，可以通过单个命令执行：\n\n```\njava –jar myApp.jar server myAppConfig.yaml\n```\n\
    \n该可部署的 jar 包包含一个嵌入的 Jetty 容器，包含了运行你的应用程序所需的每个依赖类。请注意，Dropwizard 还需要额外的参数。`server`\
    \ 参数指定应用程序将作为 HTTP 服务器运行。`yaml` 文件输入是你的配置。虽然不是严格要求的，但它是列出容器配置项的地方。\n\n与 Spring\
    \ Boot 类似，Dropwizard 需要一个带有 `main()` 方法的应用程序配置类，该方法用于加载应用程序配置、安装健康检查并激活性能指标收集和\
    \ [JMX](https://docs.oracle.com/javase/tutorial/jmx/overview/)。你可以在[此处](https://github.com/Derek-Ashmore/moneta/blob/master/moneta-dropwizard/src/main/java/org/moneta/config/dropwizard/MonetaDropwizardApplication.java)找到\
    \ Dropwizard 应用程序类的示例。\n\n应用程序类还定义了应用程序所需的任何 servlet 或过滤器（filter）。在这个世界中，servlet\
    \ 和过滤器并不是定义在 `web.xml` 配置文件中。你可以在列表 3.7 中找到一个 servlet 配置示例。可以在列表 3.8 中找到一个过滤器配置示例。\n\
    \n### 列表 3.7：Dropwizard Servlet 配置示例\n\n```java\nServletHolder topicHolder = new\
    \ ServletHolder(Source.EMBEDDED);\n\ntopicHolder.setHeldClass(MonetaServlet.class);\n\
    \ntopicHolder.setInitOrder(0);\n\ntopicHolder.setInitParameter(\n    MonetaServlet.CONFIG_IGNORED_CONTEXT_PATH_NODES,\
    \ \"moneta,topic\");\n\nenvironment.getApplicationContext()\n.getServletHandler()\n\
    .addServletWithMapping(topicHolder, \"/moneta/topic/*\");\n```\n\n来源：类 `org.moneta.config.dropwizard.MonetaDropwizardApplication`，来自\
    \ `Moneta(`https://github.com/Derek-Ashmore/moneta)\n\n### 列表 3.8：Dropwizard 过滤器配置\n\
    \n```java\nFilterHolder topicHolder = new FilterHolder(Source.EMBEDDED);\n\ntopicHolder.setHeldClass(MonetaServlet.class);\n\
    \ntopicHolder.setInitOrder(0);\n\ntopicHolder.setInitParameter(\n    MonetaServlet.CONFIG_IGNORED_CONTEXT_PATH_NODES,\
    \ \"moneta,topic\", \"3000\");\n\nenvironment.getApplicationContext()\n.getServletHandler()\n\
    .addFilter(topicHolder, null);\n```\n\n### 列表 3.9：增强应用程序配置示例\n\n```java\n@Override\n\
    public void initialize(Bootstrap<MonetaSpringBootConfiguration> bootstrap) {\n\
    \    bootstrap.setConfigurationSource(new MonetaConfigurationSource());\n    super.initialize(bootstrap);\n\
    }\n```\n\n### 列表 3.10：Dropwizard 连接池设置示例\n\n```yaml\n# 连接池设置\ndatabase:\n  driverClass:\
    \ org.hsqldb.jdbc.JDBCDriver\n  url: jdbc:hsqldb:mem:my-sample\n  user: SA\n \
    \ password:\n  autoCommentsEnabled: false\n\n# 尺寸控制选项\n  initialSize: 1\n  minSize:\
    \ 1\n  maxSize: 10\n  maxWaitForConnection: 30 seconds\n  evictionInterval: 5\
    \ seconds\n\n# 验证行为\n  validationQuery: SELECT CURRENT_DATE AS today, CURRENT_TIME\
    \ AS now FROM (VALUES(0))\n  checkConnectionWhileIdle: true\n  checkConnectionOnBorrow:\
    \ false\n  checkConnectionOnConnect: false\n  checkConnectionOnReturn: false\n\
    \  validationInterval: 30 seconds\n```\n\n"
- fmt: "\nWhen it’s necessary to configure lower level container settings, Dropwizard\
    \ provides a way to accomplish this using the input yaml configuration file. A\
    \ list of the settings offered can be found here. An example of how this can be\
    \ accomplished can be found in my [sample](https://github.com/Derek-Ashmore/moneta/blob/master/moneta-dropwizard/src/main/resources/moneta-config.yaml)\
    \ and in listing 3.11.\n\n### Listing 3.11: Example Dropwizard Container Settings\n\
    \n```yaml\nserver:\n  type: default\n  maxThreads: 150\n  minThreads: 20\n  maxQueuedRequests:\
    \ 20\n```\n\n## Docker\n\nProducts such as `Spring Boot` and `DropWizard` are\
    \ reliant on an operating system and java installation to run. In most organizations,\
    \ that java installation is shared across multiple applications. Any upgrade to\
    \ that java installation runs a risk of adversely affecting multiple applications\
    \ and having unintended consequences. In other words, this installation is a type\
    \ of coupling that’s not really wanted in a microservices world. [Docker](https://www.docker.com/)\
    \ eliminates this coupling as well as any coupling for any dependent native code\
    \ on which that java application relies.\n\nA Docker deployment can be thought\
    \ of as a mini-virtual machine. It comes complete with operating system (a linux\
    \ kernel) and all the native software a product needs to run. Docker deployments\
    \ can contain java JDK installs that service that deployment, and that java JDK\
    \ can be upgraded without fear of adversely affecting multiple services. In essence,\
    \ it provides upgrade insurance. Those of us who have worked in large corporate\
    \ environments have seen that upgrading the version of Java is a very large endeavor\
    \ due to the testing effort inherent in such an upgrade. Bundling the java installation\
    \ with your deployment alleviates these concerns to a large extent.\n\nDocker\
    \ has fast become a favorite deployment format. For those of you who haven’t used\
    \ Docker, it is ‘package once, run anywhere.’ Docker does for software what shipping\
    \ containers do for tangible goods. It has standard connection mechanisms for\
    \ disk and networking. Additionally, it’s easy to link Docker ‘containers’ together\
    \ (e.g., link database Docker container with your application).\n\nNot only is\
    \ it a win for system administrators as it makes deployment management easier\
    \ and more easily automated; it’s also a win for Java developers and architects.\
    \ As the applications environment is portable and is packaged with your application,\
    \ environment-specific problems and defects are greatly reduced. What runs in\
    \ production is more like what you test with. In addition, since your application\
    \ runs with its own version of Java and the operating system, you can upgrade\
    \ your JDK and any native code you rely on with less fear of impacting other applications\
    \ or even involving system administrators to make the native software change.\n\
    \nGetting past the hype, there are costs and disadvantages of using Docker. Running\
    \ Docker and its associated tools is much easier on Linux; Windows has limited\
    \ support. This fact creates inconveniences in most corporate environments where\
    \ development typically occurs on Windows. Platform differences also present issues\
    \ when adding maven functionality to produce Docker images; maven builds are supposed\
    \ to be platform independent. Additionally, Docker does have a learning curve.\n\
    \nSome may fear performance issues with an additional virtualization layer. However,\
    \ IBM did a good [study](http://domino.research.ibm.com/library/cyberdig.nsf/papers/0929052195DD819C85257D2300681E7B/$File/rc25482.pdf)\
    \ showing the performance impact to be negligible. All in all, the advantages\
    \ of using Docker outweigh the costs.\n\nFor Maven users, there are a few Maven\
    \ plugins that will produce Docker images as artifacts. My favorite among them\
    \ at the time of this writing is the Spotify [docker-maven-plugin](https://github.com/spotify/docker-maven-plugin).\
    \ It’s very easy to use and install. A usage example can be found in this [pom](https://github.com/Derek-Ashmore/moneta/blob/master/moneta-springboot/pom.xml)\
    \ with the Moneta microservice example on my GitHub.\n\n## Transaction Tracking\n\
    \nWith a traditional web application, it’s easier to track transactions all the\
    \ way through a given business process. Stack traces from exceptions are more\
    \ meaningful as the code base for a given transaction is often complete.\n\nIn\
    \ a microservices world, this isn’t the case. In a world where a business transaction\
    \ could utilize multiple services, tracking a history for all transactions becomes\
    \ a necessary item. A common way to track transactions across service calls is\
    \ through correlation id’s.\n\nAt the beginning of a transaction, a unique transaction\
    \ id (or correlation id) is assigned. That correlation id is then logged with\
    \ the transaction for all log entries. Any resulting service calls for that transaction\
    \ should contain that correlation id in the header so that it can be logged with\
    \ any activity, including calls to dependent services.\n\n### Figure 3.1: Correlation\
    \ Id Example\n\n![figure-3-1-Correlation-Id-Example.jpg](images/00018.jpeg)\n\n\
    The idea is to ensure that the correlation id is present with any log messages\
    \ for the transaction, so logs can be combined to provide a complete picture of\
    \ what happened for a particular user action. Logging products call this a mapped\
    \ diagnostic context or MDC. Think of MDC as a thread local context for a transaction.\
    \ You programmatically record the correlation id with the MDC when the transaction\
    \ starts. This is commonly achieved using a servlet filter or Spring interceptor.\
    \ You also specify that MDC information as part of the pattern layout in your\
    \ logging configuration so that the id is reported. An example of a servlet filter\
    \ that ensures that a correlation id is set, and records that id with the MDC\
    \ using the Slf4j product, can be found [here](https://github.com/Derek-Ashmore/RequestCorrelationSlf4J/blob/master/src/main/java/org/force66/correlate/RequestCorrelationFilter.java).\
    \ Example code ensuring a correlation id exists for a transaction, and recording\
    \ it with the MDC using the Slf4j logging product, can be found in listing 3.12.\n\
    \n### Listing 3.12: Servlet Filter Correlation Id MDC Example\n\n```java\npublic\
    \ void doFilter(ServletRequest request, ServletResponse response,\n          \
    \   FilterChain chain) throws IOException, ServletException {\n    HttpServletRequest\
    \ httpServletRequest = (HttpServletRequest) request;\n    // Ensure that a correlation\
    \ id is assigned.\n    String correlationId = httpServletRequest.getHeader(correlationHeaderName);\n\
    \    if (StringUtils.isEmpty(correlationId)) {\n        correlationId = UUID.randomUUID().toString();\n\
    \    }\n    // Record the correlation id with the MDC\n    MDC.put(loggerMdcName,\
    \ correlationId);\n    try {\n        chain.doFilter(httpServletRequest, response);\n\
    \    } finally {\n        // Remove the correlation id from the MDC\n        MDC.remove(loggerMdcName);\n\
    \    }\n}\n```\n\nAs an example, let’s say the correlation id is recorded with\
    \ the MDC under the label `requestId`. That `requestId` can be specified in the\
    \ pattern layout in your logging configuration. An example logback configuration\
    \ that allows the correlation id to be output with any log events can be found\
    \ in listing 3.13.\n\n### Listing 3.13: Logback MDC Pattern Example\n\n```xml\n\
    <appender name=\"STDOUT\" class=\"ch.qos.logback.core.ConsoleAppender\">\n   \
    \ <!-- encoders are assigned the type ch.qos.logback.classic.encoder.PatternLayoutEncoder\n\
    \         by default -->\n    <encoder>\n        <pattern>%d{HH:mm:ss.SSS} [${HOSTNAME}]\
    \ [%thread] %-5level\n                 %logger{36} REQUEST_ID=%X{requestId} -\
    \ %msg%n</pattern>\n    </encoder>\n</appender>\n```\n\nInformation on the Slf4j\
    \ implementation for MDC can be found here. Logback and Log4j support MDC functionality.\n"
  raw: 'When it’s necessary to configure lower level container settings, Dropwizard
    provides a way to accomplish this using the input yaml configuration file. A list
    of the settings offered can be found here. An example of how this can be accomplished
    can be found in my [sample](https://github.com/Derek-Ashmore/moneta/blob/master/moneta-dropwizard/src/main/resources/moneta-config.yaml)
    and in listing 3.11.


    Listing 3.11: Example Dropwizard Container Settings


    # Container settings


    server:


      type: default


      maxThreads: 150


      minThreads: 20


      maxQueuedRequests: 20


    Docker


    Products such as Spring Boot and DropWizard are reliant on an operating system
    and java installation to run. In most organizations, that java installation is
    shared across multiple applications. Any upgrade to that java installation runs
    a risk of adversely affecting multiple applications and having unintended consequences.
    In other words, this installation is a type of coupling that’s not really wanted
    in a microservices world. [Docker](https://www.docker.com/) eliminates this coupling
    as well as any coupling for any dependent native code on which that java application
    relies.


    A Docker deployment can be thought of as a mini-virtual machine. It comes complete
    with operating system (a linux kernel) and all the native software a product needs
    to run. Docker deployments can contain java JDK installs that service that deployment,
    and that java JDK can be upgraded without fear of adversely affecting multiple
    services. In essence, it provides upgrade insurance. Those of us who have worked
    in large corporate environments have seen that upgrading the version of Java is
    a very large endeavor due to the testing effort inherent in such an upgrade. Bundling
    the java installation with your deployment alleviates these concerns to a large
    extent.


    Docker has fast become a favorite deployment format. For those of you who haven’t
    used Docker, it is ‘package once, run anywhere.’ Docker does for software what
    shipping containers do for tangible goods. It has standard connection mechanisms
    for disk and networking. Additionally, it’s easy to link Docker ‘containers’ together
    (e.g., link database Docker container with your application).


    Not only is it a win for system administrators as it makes deployment management
    easier and more easily automated; it’s also a win for Java developers and architects.
    As the applications environment is portable and is packaged with your application,
    environment-specific problems and defects are greatly reduced. What runs in production
    is more like what you test with. In addition, since your application runs with
    its own version of Java and the operating system, you can upgrade your JDK and
    any native code you rely on with less fear of impacting other applications or
    even involving system administrators to make the native software change.


    Getting past the hype, there are costs and disadvantages to using Docker. Running
    Docker and its associated tools is much easier on Linux; Windows has limited support.
    This fact creates inconveniences in most corporate environments where development
    typically occurs on Windows. Platform differences also present issues when adding
    maven functionality to produce Docker images; maven builds are supposed to be
    platform independent. Additionally, Docker does have a learning curve.


    Some may fear performance issues with an additional virtualization layer. However,
    IBM did a good [study](http://domino.research.ibm.com/library/cyberdig.nsf/papers/0929052195DD819C85257D2300681E7B/$File/rc25482.pdf)
    showing the performance impact to be negligible. All in all, the advantages of
    using Docker outweigh the costs.


    For Maven users, there are a few Maven plugins that will produce Docker images
    as artifacts. My favorite among them at the time of this writing is the Spotify
    [docker-maven-plugin](https://github.com/spotify/docker-maven-plugin). It’s very
    easy to use and install. A usage example can be found in this [pom](https://github.com/Derek-Ashmore/moneta/blob/master/moneta-springboot/pom.xml)
    with the Moneta microservice example on my GitHub.


    Transaction Tracking


    With a traditional web application, it’s easier to track transactions all the
    way through a given business process. Stack traces from exceptions are more meaningful
    as the code base for a given transaction is often complete.


    In a microservices world, this isn’t the case. In a world where a business transaction
    could utilize multiple services, tracking a history for all transactions becomes
    a necessary item. A common way to track transactions across service calls is through
    correlation id’s.


    At the beginning of a transaction, a unique transaction id (or correlation id)
    is assigned. That correlation id is then logged with the transaction for all log
    entries. Any resulting service calls for that transaction should contain that
    correlation id in the header so that it can be logged with any activity, including
    calls to dependent services.


    Figure 3.1: Correlation Id Example


    ![figure-3-1-Correlation-Id-Example.jpg](images/00018.jpeg)


    The idea is to ensure that the correlation id is present with any log messages
    for the transaction, so logs can be combined to provide a complete picture of
    what happened for a particular user action. Logging products call this a mapped
    diagnostic context or MDC. Think of MDC as a thread local context for a transaction.
    You programmatically record the correlation id with the MDC when the transaction
    starts. This is commonly achieved using a servlet filter or Spring interceptor.
    You also specify that MDC information as part of the pattern layout in your logging
    configuration so that the id is reported. An example of a servlet filter that
    ensures that a correlation id is set, and records that id with the MDC using the
    Slf4j product, can be found [here](https://github.com/Derek-Ashmore/RequestCorrelationSlf4J/blob/master/src/main/java/org/force66/correlate/RequestCorrelationFilter.java).
    Example code ensuring a correlation id exists for a transaction, and recording
    it with the MDC using the Slf4j logging product, can be found in listing 3.12.


    Listing 3.12: Servlet Filter Correlation Id MDC Example


    public void doFilter(ServletRequest request, ServletResponse response,


                FilterChain chain) throws IOException, ServletException {


          HttpServletRequest httpServletRequest = (HttpServletRequest) request;


          // Ensure that a correlation id is assigned.


          String correlationId = httpServletRequest.getHeader(correlationHeaderName);


          if (StringUtils.isEmpty(correlationId)) {


                correlationId = UUID.randomUUID().toString();


          }


          // Record the correlation id with the MDC


          MDC.put(loggerMdcName, correlationId);


          try {chain.doFilter(httpServletRequest, response);}


          finally {


                // Remove the correlation id from the MDC


                MDC.remove(loggerMdcName);


          }


    }


    As an example, let’s say the correlation id is recorded with the MDC under the
    label requestId. That requestId can be specified in the pattern layout in your
    logging configuration. An example logback configuration that allows the correlation
    id to be output with any log events can be found in listing 3.13.


    Listing 3.13: Logback MDC Pattern Example


    <appender name="STDOUT" class="ch.qos.logback.core.ConsoleAppender">


          <!-- encoders are assigned the type ch.qos.logback.classic.encoder.PatternLayoutEncoder


                by default -->


          <encoder>


                <pattern>%d{HH:mm:ss.SSS} [${HOSTNAME}] [%thread] %-5level


                      %logger{36} REQUEST_ID=%X{requestId} - %msg%n</pattern>


          </encoder>


    </appender>


    Information on the Slf4j implementation for MDC can be found here. Logback and
    Log4j support MDC functionality.'
