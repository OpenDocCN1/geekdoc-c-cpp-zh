    type of log management system transitions from being a ‘nice to have’ to being
    an absolute requirement.


    Log management software, such as [LogStash](https://www.elastic.co/products/logstash)
    or Splunk, gathers individual log entries and centrally stores them. Furthermore,
    these tools provide a central way for support personnel to search them and configure
    automatic alerts. It’s not uncommon for errors detected by your log management
    software to either generate some type of support ticket to be investigated or
    initiate an email to a central support email account.


    Bundle needed information with exceptions that you throw. One of the main reasons
    for logging is to provide information needed to resolve a bug resulting in an
    exception. This additional logging code adds additional risk since exception code
    isn’t typically tested as thoroughly. Hence, there’s usually a larger chance of
    excepting (e.g., from a NullPointerException) during exception message formatting
    than with non-exception code.


    Apache Commons Lang, starting with V3.0, provides a contexted exception ability
    that reduces this risk by making it easy and less risky to include additional
    information with the exception itself (see classes ContextedException and ContexedRuntimeException
    from Commons Lang). This additional information will be present when this exception
    is logged. Consider the example in Listing 3.1.


    Listing 3.1: Sample Contexted Exception


    throw new ContextedRuntimeException(“Error creating application”, exception)


      .addContextValue(“application id”, applicationId)


      .addContextValue(“customer id”, customerId);


    When the exception in Listing 3.1 is logged, the context labels and values will
    automatically appear in the log, along with the error message and stack trace.
    Note that application code doesn’t increase the risk of a derivative exception
    by adding conditional logging logic or formatting logic. If it weren’t for the
    contexted exception ability, developers would have to add logging code to supply
    the information needed to resolve the bug.


    Log transaction exceptions only once. Logging exceptions multiple times will greatly
    inflate your logs and make a specific exception pertaining to a reported defect
    much harder to find. You can avoid the problem of repeating log messages by logging
    exceptions at the entry points only. For example, it’s easy to implement a servlet
    filter that will log exceptions for any web transactions. This ensures that exceptions
    are logged only once. This advice assumes that you’ve bundled any additional information
    needed to resolve the error with the exception itself, as described earlier in
    this chapter. Listing 3.2 illustrates a servlet filter of this type.


    Listing 3.2: Logging Servlet Filter example


    public void doFilter(ServletRequest request, ServletResponse response, FilterChain
    chain) throws IOException, ServletException {


           try {chain.doFilter(request, response);}


           catch (Throwable t) {


                logger.error("Web Transaction Error", t);


                ServletUtils.reThrowServletFilterException(t);


           }


    }


    Source: Class net.admin4j.ui.filters.ErrorLoggingFilter from Admin4J (http://www.admin4J.net)


    This technique reduces application code and increases the chance that generated
    exceptions are logged. Furthermore, if you leverage the Admin4J product, which
    has an error handling filter, you’ll get the request URL and a dump of any request
    and session attributes at the time of the exception. In other words, you can leverage
    an open source product to accomplish this, rather than creating your own servlet
    filter for this purpose.


    Incidentally, you’ll need to provide similar architectural support for batch job
    classes, EJB classes, and Message-Driven beans. Leaving exception logging to application
    code increases the probability that an exception doesn’t get properly logged.


    Do not commingle transaction logs with normal application logging. Transaction
    logs (e.g., user Fred changed the address of customer Acme) have a different purpose.
    Often, transaction logs are needed by normal business processes and really aren’t
    directed at product support. Most logging products will allow you to direct transaction
    logs to a separate output for this purpose.


    Note that log retention and storage concerns are a completely separate topic.
    Most logging products support storing logs in a variety of formats, including
    file or database formats. Application code should only be concerned with issuing
    log messages, not with the specifics of how they are stored or for how long they
    are retained.


    Provide a default logging configuration that can be overridden at deployment.
    This is purely a convenience for developers that may need to run a build but might
    not have taken the trouble to configure their local deployment. Furthermore, it’s
    not possible for developers to anticipate logging needs for specific deployments.
    Consequently, it’s important that administrators be able to easily configure logging
    at deployment time.


    Posting Change Events


    Given that each microservice has its own database, there are two options for accommodating
    common business data that is needed by several services. (I highlighted this issue
    earlier.) The first option, which I prefer, is not to duplicate that common data
    but rather to call the service responsible for maintaining that data when it’s
    needed. The second option is to ‘copy’ common business data to all services that
    need it. For those that opt to ‘copy’ common business data between services instead
    of nesting service calls, copies are generally accomplished using publish/subscribe
    messaging.


    The microservice responsible for maintaining common business data would publish
    any change (e.g., add, change, or delete) under an established topic in a consistent
    format. For example, a service responsible for maintaining campus information
    (e.g., a Campus microservice) at a university might publish the addition of a
    new campus or a change in status for an existing campus under the topic CampusEvent.


    Any interested services would listen on that topic and process any published changes.
    Typically, services listening for those changes would need to publish a listener
    to monitor that topic. For example, a Course microservice might listen to the
    CampusEvent topic and process any changes received. The Course microservice would
    record any campus changes received in its own database.'
