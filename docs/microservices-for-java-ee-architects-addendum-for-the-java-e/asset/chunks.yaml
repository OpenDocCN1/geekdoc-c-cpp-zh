    With traditional web application deployments, it is not uncommon to use adapters
    for interfacing third party products (SalesForce, Microsoft Dynamics, Great Plains,
    etc.). These adapters translate between your service’s internal domain model and
    that used by the third party product.


    In a microservices world, we do the same thing. The only difference is that the
    adapter is an entire service, not just a class. If we left the adapter as a set
    of classes, changes to that third party service, such as product switches or upgrades,
    would affect multiple services. That’s not what’s wanted in this world.


    It is imperative that the adapter service be product-generic. Any part of the
    product domain model used by your service contract represents an unwanted coupling.
    The benefit to the adapter is that product switches or upgrades should `only`
    affect the adapter; nothing else.


    Log all requests and responses to third party products/services. This is needed
    for support reasons. Should you need to call a provider for support, you don’t
    want to confuse the issue by talking about your code internally. Figure out what
    you need to correct with your service request text and work backwards to what
    you need to change in your code.


    Design adapters to handle failure for third party products or services. You don’t
    directly control the availability or performance of third party products or services.
    Because of this, it’s not uncommon for adapter services to implement circuit breakers
    or call mediators to more gracefully operate during outages of third parties.


    # Common Enterprise Code for Microservices


    A question I’m frequently asked is if there can be common code between services.
    The answer is a qualified ‘yes.’ The bottom line is that you version common code
    and treat it the same way as you treat third-party products like `Hibernate` or
    `Apache Commons Lang`. Individual services decide when/if to upgrade.


    Changes or enhancements to common code cannot force deployments of multiple services.
    This would create a high degree of coupling between services and thus defeat the
    benefits of using microservices architecture. Consequently, it’s rare that business
    logic is in common code. We don’t want changes to the business to affect multiple
    services.


    Common code should be versioned just like any third-party library you use. Individual
    services utilizing the common code base should be completely free to decide when
    they upgrade to newer versions. Version upgrades for common code products should
    never be forced upon them.


    # Chapter 3: Cross-cutting Concerns for Microservices


    This chapter deals with numerous cross-cutting non-functional concerns that all
    microservices must address, regardless of which technical stack they employ. These
    cross-cutting concerns include being able to effectively monitor services, detect
    failure, and diagnose and fix reported defects. Satisfying non-functional requirements
    make it possible for operations staff to support microservices architecture once
    it is deployed to production. Some of these requirements exist for traditional
    web applications, but become more imperative with microservices as the number
    of deployments increases exponentially.


    There are non-functional requirements that all microservices should meet, regardless
    of which technical platform or language they employ. Typically, these non-functional
    requirements are also cross-cutting concerns. That is, they are not specific to
    the business functionality being provided; they exist to make deployed services
    more supportable. As architects, we should establish re-usable and easily implementable
    ways of satisfying non-functional requirements. This chapter will detail what
    those requirements are and provide options for easily satisfying them. Microservices
    should have the following to make them easier to support:


    *   health checks (typically by URL)

    *   performance metrics and alerts

    *   resource consumption alerts

    *   logging and error handling

    *   deployment formats (e.g., `Docker` image).


    All of these non-functional requirements should be a part of the application architecture.
    Individual service teams should not have to ‘develop’ tooling to satisfy any of
    these requirements. Install and configure, yes. Develop, no.


    One of the advantages of writing microservices using `Java`, or at least one of
    the interpreted languages running on the `Java Virtual Machine`, is the ease with
    which functionality to address non-functional requirements needed by all microservices
    can be written and merely consumed by those services. This architecture is all
    about allowing developers to concentrate on the functionality they are providing
    instead of getting bogged down by technology and infrastructure support concerns.


    As application architects, ensuring that development teams have ready-made solutions
    to satisfy non-functional requirements is where we add value. This streamlines
    the productivity of development teams, which in turn increases the development
    velocity of those teams. It also streamlines the support effort and cost for that
    development once it is released into production. This “streamlining” is imperative.


    Microservices architecture greatly increases the number of deployments, sometimes
    exponentially. Consequently, support for these deployments must be much less manual
    and time-consuming than it typically is today. Put another way, the business processes
    we use to provide support for less than a dozen deployables won’t work for the
    hundreds of deployables that microservices architecture grows into.


    Ways to address all common non-functional requirements should be already developed
    and present in the application architecture. This architecture should be utilized
    by all microservices written in `Java`. It should be versioned so that individual
    microservices can, in most cases, upgrade on their own schedule. This concept
    was discussed in much more detail in the section on common code.


    Consider making the maintenance of this application architecture the goal of a
    separate team. It helps to rotate team members into other teams creating and supporting
    microservices. This utilizes the ‘eat your own dog food’ type mentality. They’ll
    get feedback as to how well they are providing effective application architecture
    support.


    Health Checks are imperative. Our methodology and options for doing health checks
    become much more important as the number of deployments increase, as they do with
    microservices architecture. It becomes important to standardize these health checks
    to the point where they are merely included and configured with microservices;
    development time spent on these should be nominal. More detailed treatment of
    this topic is coming up later in the chapter.


    Logging Consolidation is imperative. Logging consolidation tools such as [Splunk](http://www.splunk.com/)
    and [LogStash](https://www.elastic.co/products/logstash) have become common for
    good reason. With a larger number of deployments, logging consolidation isn’t
    an option; it’s a necessity when implementing microservices. With large numbers
    of deployments, reviewing or searching logs individually to diagnose defects can
    take large amounts of time. Log consolidation toolsets greatly reduce that time
    and make support teams more productive. As implementing microservices exponentially
    increases the number of deployables, it also greatly increases the number of logs
    and the amount of log data.


    Develop and document non-functional requirements for microservices and enforce
    them enterprise-wide. Regardless of the languages and tooling chosen for a given
    microservice, the enterprise as a whole needs to be able to utilize the service.
    That means being able to deploy and monitor its health and resource consumption.

