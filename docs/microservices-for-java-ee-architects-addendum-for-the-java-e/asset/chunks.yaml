    \ rather well.\n\nRestrict network access to your production microservice library.\
    \ The first line of defense is networking. It’s not uncommon to put your entire\
    \ server-side network architecture, including your microservice library, behind\
    \ a firewall and restrict virtual machines (VMs) that have access to it. That\
    \ is, the firewall allows consumers for your microservice library in, but nothing\
    \ else. If you implement the API Gateway pattern, your web applications (both\
    \ internal and external) are the only consumers of your microservice library and\
    \ are VMs that truly need access. Support personnel can be provided remote access\
    \ via some support environment that has network access. Most people in the organization\
    \ do not need direct access to the microservice library and can easily be restricted\
    \ from using it via firewall. A diagram of this concept can be found in Figure\
    \ 3.2. Developers will need access to a non-production implementation of your\
    \ microservice library for development, as well as non-production versions of\
    \ any required databases and other resources.\n\nFigure 3.2: Network Access for\
    \ Microservice Libraries\n\n![](images/00019.jpeg)\n"
