- fmt: '

    Dev Ops Automation makes it possible to support larger numbers of deployables.
    When `SOA` was popular, supporting an exponentially larger number of deployables
    was a real issue for operations staff. Back in those days, set-ups were manual
    and often re-invented. In a dev ops world, new environments can be configured
    and deployment happens in an automated fashion, thanks to tools like `Docker`,
    `Chef`, and `Puppet`; so not nearly as much manual effort is needed.


    Hardware and network infrastructure is cheaper than it’s ever been. In the old
    days, tuning resource consumption was more imperative, as equipment was extremely
    expensive. Now the extra memory and process overhead required by microservices
    architecture isn’t nearly as much of a concern.


    # Future Directions for Modularity


    Microservices architecture isn’t the only paradigm for modularizing Java EE applications.
    This section will briefly describe other attempts to modularize Java EE and contrast
    them with microservices architecture.


    ## Java 9 with Jigsaw


    `Jigsaw` formally introduces modularity to the Java platform. An early release
    is available, although a production release isn’t expected until 2016. Essentially,
    this feature comes with a new deployable (the module library or `jmod`) that does
    work in-process but is guaranteed its own mini-runtime environment. More detail
    about `Jigsaw` can be found [here](http://openjdk.java.net/projects/jigsaw/doc/quickstart.html).


    There are several differences when comparing `Jigsaw` to microservices architecture.
    `Jigsaw` has a couple of advantages:


    * Lower memory consumption as it’s in process

    * Compiler-enforcement of contract (as opposed to runtime).


    However, microservices architecture retains several advantages over `Jigsaw`:


    * Services are independently scalable.

    * Services are technology stack independent; not restricted to `java`.

    * Service deployments are independently manageable; not compiled into the runtime
    artifact.


    As we’ve discussed with the lower cost of hardware, optimizing memory isn’t as
    important as it once was. Overall, microservices architecture offers the enterprise
    more freedom and flexibility than `Jigsaw`.


    ## OSGi


    `OSGi` is a modularity solution for the Java platform, invented before modularity
    was formally supported by the platform. It has the exact same list of advantages
    and disadvantages – compared to microservices architecture – that `Jigsaw` does.
    In fact, you can look at `Jigsaw` as filling the same goals as `OSGi`.


    There are several differences when comparing `OSGi` to microservices architecture.
    `OSGi` has a couple of advantages:


    * Lower memory consumption as it’s in process

    * Compiler-enforcement of contract (as opposed to runtime).


    Microservices architecture retains several advantages over `OSGi`:


    * Services are independently scalable.

    * Services are technology stack independent; not restricted to `java`.

    * Service deployments are independently manageable; not compiled into the runtime
    artifact.


    By the way, `OSGi` has had very low adoption rates. If you look at statistics
    from `indeed.com` or `Google Trends`, jobs for `OSGi` rose steadily until 2011
    and have oscillated at the same low level ever since.


    ## Open Source Adoption


    I’m seeing an ever larger growth of open source products meant to be used as microservices
    being released on `GitHub` and other open source forges. I expect this trend to
    continue. As an example, searching `GitHub` for the term ‘microservice’ in June
    2015 resulted in slightly over 1,100 repositories. In January 2016, that number
    was slightly over 3,200. While it’s certainly true that not all of those repositories
    contain products designed to be deployed as microservices, some percentage of
    them will be, and it’s fair to suspect that the number has grown over the past
    few months.


    # Chapter 5: Managing Microservice Development


    The implications of microservices architecture for developers and architects are
    large. The implications for management are just as large. Most authors and presenters
    for microservices architecture topics concentrate on the more technical aspects
    of microservices. As architects, we’re supposed to deliver business value. Part
    of that value is advising management about what the ramifications of adopting
    microservices architecture are, and that they have a role to play.


    ## Prerequisites for Microservices Architecture Adoption


    Microservices architecture has infrastructure requirements that need to be in
    place and working before adoption of microservices is feasible on a large scale.
    This section will try to provide guidance to architects advising management and
    to managers themselves.


    ### Changes in Governance


    You no doubt have processes and procedures that govern the lifecycle for moving
    development through testing and user acceptance to production. Perhaps there are
    forms that need to be filled out and approvals that need to be acquired before
    production migrations happen. Perhaps there are prerequisites that developers
    need to meet before those approvals are granted and production migrations happen.
    The intent of these procedures is often to mitigate deployment risk and prevent
    defects from being migrated to production. I’m sure that those processes work
    quite well for the volume of deployments you currently deal with, without having
    microservices architecture in place.


    The goal is to provide governance and infrastructure support for microservices
    architecture, but to do so in a way that doesn’t slow everything down. Remember
    that one of the benefits is supposed to be higher development velocity. Governance
    and velocity are diametrically opposed.


    Most governance procedures won’t scale exponentially. Microservices architecture
    will exponentially increase the number of deployments you manage. Most processes
    that organizations put in place aren’t designed to grow to handle 10 or 20 times
    your current volume. It’s likely that your bureaucratic process for moving development
    to production won’t survive that type of growth either. It’s more likely that
    your governance procedures will need to change and adapt to be able to handle
    the exponential growth that microservices architecture will present.


    Automate the production deployment process, including testing and approvals. One
    of the benefits of microservices architecture is that microservices have ‘virtual’
    users. As such, there are no user interfaces for them that need visual inspection
    to verify aesthetics, etc. It’s possible to entirely automate tests for microservices.
    Web application user interfaces would still need to be manually inspected to make
    sure that the more subjective qualities that they have are correct, but microservices
    don’t need that. Yes, it takes investment to automate the entire process, but
    if you invest heavily in microservices with the intention of reaping the benefits
    this paradigm provides, the automation will pay for itself at some point.


    Automate defect detection and backout initiation. Automated testing will provide
    some level of protection against defective deployments. An additional level of
    protection to consider is putting a mechanism in place to detect changes in failure
    rates after deployment and automatically initiate a rollback if the increase in
    failure rate exceeds a configurable threshold. Anyone who is not comfortable with
    relying on an entirely automated deployment process might increase their comfort
    level by adding an automatic rollback, should a deployment produce errors.


    ## Investment in Operations Automation

