    \      at java.lang.reflect.Method.invoke(Method.java:606)\n      at org.junit.runners.model.FrameworkMethod$1.runReflectiveCall(FrameworkMethod.java:50)\n\
    ------------ Output omitted for brevity\n```\n\nRecord request and response for\
    \ failed remote calls. Include the request and response associated with the call\
    \ so that if communication with the called service becomes necessary, you’ll already\
    \ have all the information that group needs to diagnose the issue. To provide\
    \ some context on how useful this can be: with a past client, we implemented this\
    \ practice for all remote service calls, and as a result we could localize the\
    \ problem and identify which service had the issue 100% of the time. Additionally,\
    \ developers saved time because they had a ready-made test case they could execute\
    \ and debug. An example of how to accomplish this using the `Apache HttpClient`\
    \ product can be found in listing 315.\n\n#### Listing 3.15: Example HttpClient\
    \ Exception\n\n```java\npublic static CloseableHttpResponse executeGet(String\
    \ requestUrl, Map<String,String> headerMap) {\n    Validate.notEmpty(requestUrl,\
    \ \"Null or blank requestUrl not allowed.\");\n    HttpGetRequest uriRequest =\
    \ new HttpGet(requestUrl);\n    for (String header : headerMap.keySet()) {\n \
