    Any attempt to delete a student who may have been registered for classes or may
    have incurred charges will result in an error. With a traditional web application,
    we might be able to rely on relational database referential integrity rules. However,
    in a microservices architecture, that information is in separate data stores and
    there are no referential integrity rules preventing data from other services being
    essentially stranded. Consequently, this needs to be enforced at an application
    level. Another possibility would be to cascade the delete (issue a corresponding
    delete with dependent services), which is inherently dangerous.


    Let’s note some more characteristics from the `Students` service in Figure 2.1.


    Adhere to the strict definitions for HTTP methods. There’s a brief summary of
    available methods [here](http://restful-api-design.readthedocs.org/en/latest/methods.html).
    `GET` requests retrieve information; `GET` requests never change any business
    data (logging the `GET` request and response is a non-functional, cross-cutting
    support concern and doesn’t count as changing data). This abbreviates communication
    you must provide to service developers who implement the contract.


    Adhere to the strict definition for HTTP method error codes. Those error codes
    are standardized. There is a brief summary of those error codes [here](https://developer.yahoo.com/social/rest_api_guide/http-response-codes.html).
    Like following HTTP method definitions, this abbreviates communication you must
    provide to service developers who implement the contract.


    Standardize your operation instructions across all microservices. With the `Students`
    service, I’ve defined several commonly defined operation instructions: `sort`,
    `fields`, `maxEntries`, etc. It’s common to provide a feature that allows the
    requester to receive requested data in an order they specify. Don’t allow some
    microservices to use the instruction `sort` and others to use `order`. This non-standardization
    creates confusion for consumers and impedes the goal of increasing developer velocity.


    ## Process Services


    Process services manage complex business tasks. They usually represent a business-specific
    action or procedure. Normally, process services rely on other services for much
    of the data needed to process. Sometimes, there is persisted data needed by process
    services, but not always.


    You can usually express a process service ‘mission’ as being the ‘service responsible
    for processing ______.’ As an example, the `StudentClasses` service is responsible
    for registering students for classes and reporting on existing student class registrations.
    Like the core service example, a similar illustration for the `StudentClasses`
    service contract can be found in Figure 2.2.


    ### Figure 2.2: Process Service Definition Example


    ![figure-2-2-Student-Classes Service-Example-Hierarchy.jpeg](images/00008.jpeg)


    This definition has a similar format to the core service example in Figure 2.1.
    Let’s look at some of the differences. For starters, the `StudentClasses` service
    enforces business rules and constraints on write operations such as the following:


    *   Students must meet all course prerequisites

    *   Students cannot be currently scheduled for other classes at the same time

    *   Students cannot register for classes if they owe money for past charges.


    These constraints are purely business level and need to be enforced at a service
    level.


    In addition, not all attributes presented are updatable. Figure 2.2 distinguishes
    between ‘Attributes’ that are maintained by the `StudentClasses` service and those
    ‘Read-only attributes’ that are presented for convenience to consumers, but are
    really maintained in other services. Should consumers want to change the `Professor`
    name of the scheduled class, for example, they should affect that change via the
    `ScheduledClasses` service. Yes, presenting this information for convenience does
    require a service call, which can have a negative impact on performance. We’ll
    discuss ways to mitigate the performance impact of this later in the book.


    Note that the `StudentClasses` service has dependent services, unlike the `Students`
    service in Figure 2.1. If these services are unavailable, the `StudentClasses`
    service might not function properly. We’ll discuss ways to mitigate the amount
    of vulnerability dependent services can cause. For now, I’m concentrating on effectively
    defining service boundaries and contracts.


    Accept that microservices architecture increases service traffic over traditional
    application architectures. Process services rely on other services to complete
    their work. The `StudentClasses` service in Figure 2.2 is one of these. Process
    services may have a database resource, but not always.


    ## Partitioning Is an Art


    Deciding on a service boundary or determining microservice mission statements
    is deceptively difficult. Moreover, there is no objective formula I can give you
    for determining a services mission statement. If you have services do too much
    or define their mission too broadly, you’ll end up with several baby monoliths
    instead of a microservice library. If you make service operations too fine-grained,
    you’ll get excessive network chattiness and performance will suffer.


    ## Microservices and Domain Driven Design


    Evans’ Domain Driven Design (DDD) concept has a part to play in determining service
    boundaries. DDD divides the world into “Domains” and “Sub-domains.” Domains are
    a sphere of enterprise knowledge. They are always expressed in business terms
    and are a purely analytical construct. They represent an area of the enterprise
    that is typically too large to represent as a microservice. Sub-domains are arbitrary
    divisions of a domain and they too are always expressed in business terms. Sub-domains
    are also an analytical construct and don’t necessarily correspond one-to-one to
    deployed services. Within sub-domains, bounded contexts are drawn.


    A bounded context in DDD is an arbitrary boundary that has a unified domain model.
    Typically, a bounded context resides in one and only one sub-domain. The bounded
    context is a physical construct and very often has a service deployment representation.
    Relationships between bounded contexts are explicitly defined. Usually, the intention
    is to reflect this context in code so that the code more closely resembles the
    way the enterprise actually works. Core microservices manage data for one and
    only one bounded context. They never span bounded contexts.


    Process services manage complex processes. These can involve one or more bounded
    contexts. In essence, process services can describe the relationships between
    bounded contexts. Relationships between bounded contexts are processes managed
    by separate services.


    ## Service Mission Checks


    Given the artful nature of partitioning, it’s hard to provide an objective algorithm
    for determining the mission statement for a service. I can, however, provide detailed
    warning signs that may indicate that a service definition needs refinement.


    ### Boundary Mission Sanity Check


    You should be able to express the business function of a service in one sentence
    in business terms. If you can’t, it’s a red-flag that the service isn’t well defined.


    Examples of business functions are:


    *   The `Student` service is the system of record for `Professor` information

    *   The `Registration` service registers students for classes

    *   The `Discipline` service suspends students

    *   The `Student Payment` service records student payments

    *   The `Transcript` service produces official transcripts


    What’s common about all of these examples? They are all written in business terms.
    Besides the term inherent in the service titles, there isn’t a technical term
    in the lot.


    Let’s contrast this with examples of poorly defined services. Below are ‘anti-pattern’
    examples that you should not follow, and I then discuss what’s wrong with them.


    Anti-Pattern Examples

