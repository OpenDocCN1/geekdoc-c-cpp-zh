    Evolve into a microservices architecture. As a general rule, applications should
    be initially created as traditional applications and then evolve into hybrid or
    microservices architecture as their complexity grows. Traditional web applications
    are easier to initially build and support. `YAGNI` (You Aren’t Going to Need It)
    applies. Many applications won’t grow to be complex enough to warrant using microservices
    architecture. Don’t go to the trouble and expense before it’s warranted.


    Microservices architecture isn’t all or nothing. It’s possible for a traditional
    application to rely on a handful of microservices; it’s not necessary for the
    entire application to evolve into a microservices architecture. In fact, as a
    traditional web application evolves into a microservices architecture, the transition
    usually involves deployments where a traditional web application relies on a small
    microservice library for some portion of the work that it does.


    Initial attempts developing microservices should be small and targeted. As with
    most paradigms, a measured migration to microservices architecture is warranted.
    You need the experience utilizing microservices, along with DevOps procedures
    needed to support a greatly increased number of deployables, before you will be
    effective at maintaining a large microservices library. Good initial proof of
    concept microservices should be important enough to be noticed, but contained
    enough so that business risk can be managed.


    Multiple applications need the same functionality. With traditional web applications,
    you can share a common library of some sort, or publish services in one application
    that are consumed by another. This becomes complex when external resources, such
    as database resources, are needed by this shared functionality. This shared functionality
    is a prime candidate for separation into a separate, independent deployable with
    its own database.


    Parts of an application have different scaling requirements. Separating out functionality
    into microservices allows that functionality to scale differently. For example,
    one microservice might only need three nodes in a cluster while another might
    need dozens due to its larger transaction volume.


    Parts of an application may have higher availability requirements. Separating
    out functionality into microservices not only allows increased transaction throughput
    but makes the service less likely to be completely down. In other words, the increased
    scale also lessens the chance that all nodes of a service cluster would be down,
    making the service unavailable.


    ## Warning signs that your traditional application is too large:


    Given that most applications evolved into using microservices architectures and
    didn’t start there, how do you know when your application(s) has reached a point
    where microservices architecture should be considered? There’s no objective rule
    to use, but I can provide some guidelines.


    Changes come with unintended consequences. When applications get large and complex,
    deployments contain more risk. It becomes harder and harder to make isolated and
    targeted changes without unintended consequences. With these applications, when
    you fix one problem, other problems appear unintentionally. It’s like playing
    the whack-a-mole game where you hit one mole only to see another appear. This
    is a sign that an application has become too complex to manage as a single unit
    and can benefit from breaking the application into smaller pieces with paradigms
    such as microservices architecture.


    Release testing / QA cycles become unreasonably large. This is a sign that an
    application has become too large and complex to be effectively managed as a unit.
    In these cases, breaking up the large problem into more manageable smaller problems
    can reduce support costs. Microservices architecture can be useful in situations
    like this.


    Development teams for a single application become too large to manage effectively.
    I go with the Jeff Bezos quote: ‘If you can’t feed the team on two large pizzas,
    then the team is too large.’ Microservices architecture can make it easier to
    manage large development efforts as work units are broken into independent, more
    manageable teams.


    ## Where’s the Marketing Fluff?


    With any new paradigm, there’s a certain amount of hype and marketing that comes
    along with it. Microservices is no exception. This section will attempt to separate
    the wheat from the chaff and let you know where those marketing fluff items are.


    ### Are Microservices easier to manage?


    One of the selling points is that yes, they are. But you’ll need to observe the
    requirements in fine print before microservices architecture will be easier to
    manage.


    You must be very good at contract management. Your management efficiency comes
    from reduction in the need for communication. That reduction comes from organizing
    teams into much smaller, more focused work groups. With microservices architecture,
    much of that communication comes from interaction with other teams to design features
    in your service contract. How effective you are at service contract management
    directly impacts how much communication is needed between teams.


    You must be very good at specifying the mission and features of each service.
    A close corollary to this is documenting that service for your consumers. To see
    how this affects your ability to manage microservices architecture, look at what
    happens when services aren’t effectively documented. To consume a poorly documented
    service, you need to enlist the assistance of the providing team to learn how
    to effectively use it. This greatly increases communication overhead and requires
    coordinating multiple people. It also leads to a larger number of technical questions
    and issues during development to correct code consuming the service. In other
    words, providing good documentation along with usage examples is a win-win. Service
    providers don’t spend as much on support, and consuming teams are able to develop
    much more rapidly.


    Services must be truly context independent and self-sufficient. Services should
    not place restrictions on the context in which they are invoked. For instance,
    services should be as easily usable in a user interface as in a batch process.
    All services and service calls should be stateless. For instance, there should
    be no context (e.g., session variable content) that travels from call to call.
    If the service uses a database, all service calls are complete units of work.
    No open transactions are left when a service call completes.


    ### Are Microservices easier for developers to understand?


    One of the selling points for microservices architecture is that it makes problems
    small enough to fit into the developers’ heads, but in reality, the answer is
    ‘no.’ It is easier for a developer to understand one particular service in isolation.
    No argument with this. It’s a smaller code base. Smaller feature set. Just smaller
    and more focused.


    Where this selling point is misleading is that, in a microservices world, it can
    take dozens of services working in concert to provide a given piece of business
    functionality. Yes, if you’ve drawn boundaries effectively, developers can look
    at services as ‘black boxes’ and not delve into the underlying mechanics of exactly
    how that service does what it does. But the large number of them means that the
    entire service set is like a complex API that developers need to understand to
    process services effectively. Essentially, the complexity here is no different
    than understanding a large number of packages in a traditional application.


    Do Microservices increase development throughput?

    '
