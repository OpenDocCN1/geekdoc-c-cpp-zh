  trans: "\n\n过期缓存模式（Expiring cache pattern），有时被称为“旁路缓存”（Cache Aside），它利用了每个组织中的某些数据是静态的、不需要在每次需要时都进行新鲜读取这一事实。该概念是：静态数据被读取后缓存一段配置的时间。在此期间，将使用该数据的缓存版本，而不是从数据库中重新读取。\n\
    \n过期缓存模式是用内存换取速度。该模式消耗内存用于缓存，但平均检索时间极快。\n\n让我们来看一个例子。我的母校印第安纳大学有几个校区：布鲁明明顿、印第安纳波利斯、南本等。这些每个校区的具体细节是相对静态的；也就是说，大学极少建立新校区或废除旧校区。没有理由在每次需要时都重新读取校区信息，因此它是过期缓存模式的逻辑候选者；特别是在微服务架构中，这种“读取”操作很可能是对核心服务的服务调用。\n\
    \n### 图 2.8: 过期缓存模式\n\n![figure-2-8-Expiring-Cache-Pattern-Algorithm.jpg](img/00014.jpeg)\n\
    \n通常，过期缓存具有可配置的过期时间范围。将某些信息缓存很长时间（甚至是一天）可能是安全的，而其他类型的信息则需要在更短的间隔内刷新。\n\n在消费方服务中使用过期缓存服务，而不是将该逻辑集中在目标服务中，原因有几点。性能的提升不仅源于避免数据库读取，还源于对核心服务的服务调用。其次，消费者更了解上下文，并理解缓存信息需要多新。某些服务对数据的需求可能比其他服务更具实时性，并希望有更短的过期时间。\n\
    \n我使用 Google 的 [Guava](https://github.com/google/guava) 产品来实现过期缓存。关于 Guava 缓存如何工作的参考资料可以在[这里](https://github.com/google/guava/wiki/CachesExplained)\
    \ 找到。尽管如此，EHCache 和其他产品也提供此功能。在目前，真的没有必要自己实现。使用 Guava 实现过期缓存包含两个部分：扩展 `CacheLoader`\
    \ 和定义缓存本身。\n\n`CacheLoader` 在给定一个 `key` 时会查找一个值。大多数扩展 `CacheLoader` 的类只需要实现 `load(key)`\
    \ 方法，该方法将执行查找并返回给定 `key` 的值。第二部分是定义缓存本身。示例可以在列表 2.5 中找到。虽然默认情况下缓存值在 100 毫秒后过期，但你可以选择任何认为合适的时间间隔。\n\
    \n### 列表 2.5: Guava 缓存定义示例\n\n```java\nLoadingCache<Integer, String> sampleCache\
    \ = CacheBuilder.newBuilder()\n        .expireAfterWrite(100, TimeUnit.MILLISECONDS)\n\
    \        .build(loader);\n```\n\n集群的不同节点可能会有不同的答案，因为它们处于不同的缓存计划。这通常是可以接受的，因为要使用微服务架构，你必须接受“最终一致性”的概念。我们稍后会详细讨论。如果你需要强制重新加载\
    \ Guava 缓存，在缓存上执行 `invalidateAll()` 将有效地强制重新加载。\n\n## 针对完整性的设计\n\n在传统的 Web 应用中，我们拥有数据库事务的安全保障。如果发生错误，执行数据库回滚是常见的，这使得数据库处于一致状态。在用户操作可能利用多个服务的微服务世界中，这种安全网并不存在，因为这些事务发生在不同服务发起的多个数据库中。是的，核心服务通常具有数据库事务安全网，因为它们的重点很大程度上与\
    \ CRUD 相关，但利用其他服务的流程性服务则没有。\n\n## 自定义回滚\n\n基本上，这种模式包含在异常处理逻辑中发布反向事务。这种模式也被称为“补偿事务”（Compensating\
    \ Transaction）。本质上，当发生错误时，会对任何可能成功的更改发布反向事务。例如：假设一个流程服务的调用导致了对其他微服务的三个服务调用。假设第一个事务成功，但第二个失败了。在流程服务的异常处理逻辑中，它会对执行成功的事务发布反向服务调用，使数据处于一致状态。\n\
    \n### 图 2.9: 自定义回滚模式\n\n![figure-2-9-Custom-Rollback-Pattern.jpg](img/00015.jpeg)\n\
    \n这种策略并不是完美的。反向事务也可能报错，或者流程服务在发布反向事务之前就崩溃了。无论何种情况，存储的数据都将处于不一致状态，因此需要某种类型的修复。通常，这种修复是手动的。\n\
    \n编写自定义回滚事务需要耗力，所以你不想在所有场景中都使用这种模式。基本上，你有两个选择：编写自定义回滚以减少对人工干预的需求，或者在错误发生时手动统一数据。通常，组织从手动干预开始，然后使用代码自定义回滚来处理失败频率最高的区域。\n\
    \n这种模式极其难以泛化并提供产品支持。反向事务所需的特定逻辑需要自定义代码。\n\n## 管理服务版本\n\n在传统的 Web 应用中，管理服务的版本已经足够困难了。在微服务世界，随着服务数量的指数级增长，问题也呈指数级增长。有两种流行的版本控制策略。第一种是直接将版本号放在服务的\
    \ URL 中。第二种允许客户端在请求头（header）中请求服务版本。如果他们没有请求版本，则默认使用最新版本。我将介绍这两种版本方法。但在之前，让我们讨论不同类型的更改以及你作为服务生产者或消费者的责任。\n\
    \n### 破坏性变更与非破坏性变更\n\n破坏性变更（Breaking changes）是指会导致现有服务调用报错的变更。破坏性变更强制消费者修改代码以避免错误。是的，你可以通过弃用策略（我稍后会讨论）来缓解这种影响，但它仍然强制了改变。根据定义，这种强制改变的优先级将高于消费应用程序团队的大多数任务，并可能会抢占该团队本应负责的其他功能增强。从消费团队的角度来看，这种变更是突如其来的，不像调度功能增强那样容易管理。\n\
    \n并不是所有的变更都是破坏性变更。如果请求某个主题信息的服务调用突然返回了几个额外信息，这应该是一个非破坏性变更。它是非破坏性的，因为消费者不应该关注提供的额外信息，因为他们目前没有处理这些信息的逻辑。如果他们决定处理这些额外信息项，他们可以按照自己的计划来增强服务。事实上，他们可能根本不需要额外信息项来增强服务。\n\
    \n"
- fmt: "\nAs a service publisher, your civic duty is to introduce a breaking change\
    \ only as a last resort. Only introduce breaking changes if absolutely nothing\
    \ else is possible. This can happen despite the best of intentions. It could be\
    \ that a dependent service introduced a breaking change, thus forcing a reaction.\
    \ It could be that a feature that was supported can no longer be supported because\
    \ the required functionality from dependent services is no longer there. It could\
    \ be that the organization has decided to deprecate a business process, and as\
    \ a result, you need to introduce a breaking change to accommodate that business\
    \ decision. Note that this probably isn’t a complete list of what could force\
    \ a breaking change.\n\nAs a consumer, your civic duty is to ignore any piece\
    \ of information returned in a service call that you don’t need. The reason is\
    \ that this makes your consuming service more resilient and less impacted by changes\
    \ in services you call. You won’t be affected by additions to your result set\
    \ or the removal of attributes you don’t really need. This decreases the chance\
    \ that changes to the services you call will affect the consuming service.\n\n\
    As a service provider, you need to establish a deprecation strategy. That is,\
    \ you can’t just introduce a breaking change and make consumers scramble to adjust.\
    \ For a period of time, you need to support the old *and* the new service. You\
    \ also need a communication mechanism that allows you to announce version changes\
    \ and also to announce the point where support for specific versions will no longer\
    \ be provided.\n\nVersioning is *only* needed for breaking changes. Non-breaking\
    \ changes can be published under the same version; providers shouldn’t have to\
    \ maintain separate versions if changes are non-breaking. This incents consumers\
    \ to ignore returned data they don’t use as it minimizes the impact of change\
    \ they experience as the services they call are enhanced.\n\nThat leaves several\
    \ questions. If clients, in effect, manage their own migration schedule from version\
    \ a to version b of a service, there needs to be a way for clients to specify\
    \ which version of the service they would like. On the provider side, architects\
    \ need a sensible strategy for supporting both versions of a service for a period\
    \ of time. I say ‘both’ because ideally, at any one time, you should have one\
    \ version in deprecation and one current version.\n\n## Versioning by URL\n\n\
    One popular way to version is to version by URL. That is, encode the version number\
    \ somewhere in the URL and make consumers change their request URL when they move\
    \ from version a to version b. Examples of URL versioning can be found in Listing\
    \ 2.6.\n\n### Listing 2.6: URL Versioning Examples\n\n```\nhttps://university.edu/services/Students-1.0/12345\n\
    https://university.edu/services/Courses-2.1/PY101\n```\n\nVersioning by URL is\
    \ initially appealing as it is easily supported by web server software. You can\
    \ have multiple versions of a service deployed and web server software can route\
    \ clients to the correct version. For instance, web server software can easily\
    \ distinguish between `Students-1.0` and `Students-1.1` and route clients automatically\
    \ to the version they request. When a version is deprecated, clients attempting\
    \ to use it can either receive a `426` (HTTP status code for ‘upgrade required’)\
    \ or be automatically forwarded to a new version.\n\nThis becomes problematic\
    \ if you provide references via [HATEOAS](http://restcookbook.com/Basics/hateoas/)\
    \ because it requires services providing HATEOAS link content to be aware of version\
    \ changes in those referred services. For example, if the `Students-1.0` services\
    \ provide a HATEOAS reference to `StudentClasses-1.1`, that service needs to change\
    \ when new versions of the `StudentClasses` service are introduced. This makes\
    \ providing HATEOAS references more complicated and problematic.\n\nAdditionally,\
    \ you have no control over when clients who have been provided with those urls\
    \ will actually use them. Encoding versions in the urls provided can be problematic\
    \ in that the versions encoded in them could actually be deprecated between the\
    \ time they are provided and when they are used. This is another reason I prefer\
    \ versioning by header (described below).\n\n## Versioning by header\n\nOne way\
    \ to version is to allow the client to request a specific version in the header\
    \ of the service request. There are no standard header names that address this.\
    \ Some have suggested using the `ACCEPT` header to specify both the version and\
    \ the data format expected. To me, using the `ACCEPT` header is a leakage of concerns\
    \ issue. `ACCEPT` is really only about the format expected. Version specification\
    \ implies possible behavior differences in operations besides GET. Listings 2.7a\
    \ and 2.7b are examples of versioning by header.\n\n### Listing 2.7a: Header Versioning\
    \ Example\n\n```\nURL: https://university.edu/services/Students/12345\nACCEPT-VERSION:\
    \ 1.0\nACCEPT: application/json\n```\n\n### Listing 2.7b: Header Versioning Example\
    \ using ACCEPT header for versioning\n\n```\nURL: https://university.edu/services/Students/12345\n\
    ACCEPT: application/vnd.students.v1.0+json\n```\n\nI prefer to introduce a custom\
    \ header, as with listing 2.7a, since none of the standard header names really\
    \ apply. This also leaves `ACCEPT` free to specify format in case your service\
    \ supports multiple presentations. For example, a client might specify an `ACCEPT-VERSION=1.0`\
    \ request header in a call to the `Students` service. If that version is honored,\
    \ then it is provided by the service publisher. If that version has been deprecated,\
    \ then the oldest supported version attempts to satisfy the request. Maybe it\
    \ works, maybe not. After all, if a consumer isn’t going to listen to your deprecation\
    \ announcements, they get what they get. If a consumer doesn’t specify a version\
    \ at all, they get the most current version available. Similarly, the return data\
    \ format can default. If you separate out the version specification into a separate\
    \ header, then it’s easier for consumers to let the version default and specify\
    \ the format or vice versa.Versioning by header does require some type of router\
    \ that interrogates the header value and redirects requests to the appropriate\
    \ version. I’m not aware of product support for header versioning, but it would\
    \ be easy enough to genericize it and provide it.\n\nFigure 2.10: Header Versioning\
    \ Example\n\n![figure-2-10-Header-Versioning-Example](images/00016.jpg)\n\nAlways\
    \ provide a response header that indicates the version of the service being provided\
    \ (e.g., `VERSION=1.1`). As there isn’t a standard response header for versioning,\
    \ one would need to be introduced. This information could potentially be useful\
    \ to consumers diagnosing support issues.\n\n Supporting Multiple Version Deployments\n\
    \nDeploy all versions as separate applications. Do not attempt to commingle multiple\
    \ versions in the same service. There’s too great a risk that unintended changes\
    \ get made to previous versions. In addition, it makes the service code much more\
    \ complex.\n\nHorizontally scale versions separately. It is conceivable that consumer\
    \ load isn’t identical across versions. For example, it’s possible that load for\
    \ version 1.0 of your service is less than version 1.1 or 1.2. Consequently, version\
    \ clusters might be configured differently. If your clustering is supported by\
    \ DNS round-robin, use subdomains to distinguish different versions (e.g., `students_1_1.university.edu`).\n\
    \nAll versions of the service should use the same database. It’s possible that\
    \ feature enhancements introduced in newer versions require a database refactoring\
    \ that can make support of older versions of a service problematic. The book [Refactoring\
    \ Databases](http://databaserefactoring.com/) provides numerous patterns that\
    \ can assist with resolving these problems.\n\nAn illustration of these concepts\
    \ can be found in Figure 2.11.\n\nFigure 2.11: Version Deployment Example\n\n\
    ![figure-2-11-Version-Deployment-Example](images/00017.jpg)\n\nAdapter Services\
    \ for Third Party Products\n"
  raw: 'As a service publisher, your civic duty is to introduce a breaking change
    only as a last resort. Only introduce breaking changes if absolutely nothing else
    is possible. This can happen despite the best of intentions. It could be that
    a dependent service introduced a breaking change, thus forcing a reaction. It
    could be that a feature that was supported can no longer be supported because
    the required functionality from dependent services is no longer there. It could
    be that the organization has decided to deprecate a business process, and as a
    result, you need to introduce a breaking change to accommodate that business decision.
    Note that this probably isn’t a complete list of what could force a breaking change.


    As a consumer, your civic duty is to ignore any piece of information returned
    in a service call that you don’t need. The reason is that this makes your consuming
    service more resilient and less impacted by changes in services you call. You
    won’t be affected by additions to your result set or the removal of attributes
    you don’t really need. This decreases the chance that changes to the services
    you call will affect the consuming service.


    As a service provider, you need to establish a deprecation strategy. That is,
    you can’t just introduce a breaking change and make consumers scramble to adjust.
    For a period of time, you need to support the old *and* the new service. You also
    need a communication mechanism that allows you to announce version changes and
    also to announce the point where support for specific versions will no longer
    be provided.


    Versioning is *only* needed for breaking changes. Non-breaking changes can be
    published under the same version; providers shouldn’t have to maintain separate
    versions if changes are non-breaking. This incents consumers to ignore returned
    data they don’t use as it minimizes the impact of change they experience as the
    services they call are enhanced.


    That leaves several questions. If clients, in effect, manage their own migration
    schedule from version a to version b of a service, there needs to be a way for
    clients to specify which version of the service they would like. On the provider
    side, architects need a sensible strategy for supporting both versions of a service
    for a period of time. I say ‘both’ because ideally, at any one time, you should
    have one version in deprecation and one current version.


    Versioning by URL


    One popular way to version is to version by URL. That is, encode the version number
    somewhere in the URL and make consumers change their request URL when they move
    from version a to version b. Examples of URL versioning can be found in Listing
    2.6.


    Listing 2.6: URL Versioning Examples


    https://university.edu/services/Students-1.0/12345


    https://university.edu/services/Courses-2.1/PY101


    Versioning by URL is initially appealing as it is easily supported by web server
    software. You can have multiple versions of a service deployed and web server
    software can route clients to the correct version. For instance, web server software
    can easily distinguish between Students-1.0 and Students-1.1 and route clients
    automatically to the version they request. When a version is deprecated, clients
    attempting to use it can either receive a 426 (HTTP status code for ‘upgrade required’)
    or be automatically forwarded to a new version.


    This becomes problematic if you provide references via [HATEOAS](http://restcookbook.com/Basics/hateoas/)
    because it requires services providing HATEOAS link content to be aware of version
    changes in those referred services. For example, if the Students-1.0 services
    provide a HATEOAS reference to StudentClasses-1.1, that service needs to change
    when new versions of the StudentClasses service are introduced. This makes providing
    HATEOAS references more complicated and problematic.


    Additionally, you have no control over when clients who have been provided with
    those urls will actually use them. Encoding versions in the urls provided can
    be problematic in that the versions encoded in them could actually be deprecated
    between the time they are provided and when they are used. This is another reason
    I prefer versioning by header (described below).


    Versioning by header


    One way to version is to allow the client to request a specific version in the
    header of the service request. There are no standard header names that address
    this. Some have suggested using the ACCEPT header to specify both the version
    and the data format expected. To me, using the ACCEPT header is a leakage of concerns
    issue. ACCEPT is really only about the format expected. Version specification
    implies possible behavior differences in operations besides GET. Listings 2.7a
    and 2.7b are examples of versioning by header.


    Listing 2.7a: Header Versioning Example


    URL:  https://university.edu/services/Students/12345


    ACCEPT-VERSION: 1.0


    ACCEPT: application/json


    Listing 2.7b: Header Versioning Example using ACCEPT header for versioning


    URL:   https://university.edu/services/Students/12345


    ACCEPT: application/vnd.students.v1.0+json


    I prefer to introduce a custom header, as with listing 2.7a, since none of the
    standard header names really apply. This also leaves ACCEPT free to specify format
    in case your service supports multiple presentations. For example, a client might
    specify an ACCEPT-VERSION=1.0 request header in a call to the Students service.
    If that version is honored, then it is provided by the service publisher. If that
    version has been deprecated, then the oldest supported version attempts to satisfy
    the request. Maybe it works, maybe not. After all, if a consumer isn’t going to
    listen to your deprecation announcements, they get what they get. If a consumer
    doesn’t specify a version at all, they get the most current version available.
    Similarly, the return data format can default. If you separate out the version
    specification into a separate header, then it’s easier for consumers to let the
    version default and specify the format or vice versa.


    Versioning by header does require some type of router that interrogates the header
    value and redirects requests to the appropriate version. I’m not aware of product
    support for header versioning, but it would be easy enough to genericize it and
    provide it.


    Figure 2.10: Header Versioning Example


    ![figure-2-10-Header-Versioning-Example.jpg](images/00016.jpeg)


    Always provide a response header that indicates the version of the service being
    provided (e.g., VERSION=1.1). As there isn’t a standard response header for versioning,
    one would need to be introduced. This information could potentially be useful
    to consumers diagnosing support issues.


    Supporting Multiple Version Deployments


    Deploy all versions as separate applications. Do not attempt to commingle multiple
    versions in the same service. There’s too great a risk that unintended changes
    inadvertently get made to previous versions. In addition, it makes the service
    code much more complex.


    Horizontally scale versions separately. It is conceivable that consumer load isn’t
    identical across versions. For example, it’s possible that load for version 1.0
    of your service is less than version 1.1 or 1.2\. Consequently, version clusters
    might be configured differently. If your clustering is supported by DNS round-robin,
    use subdomains to distinguish different versions (e.g., students_1_1.university.edu).


    All versions of the service should use the same database. It’s possible that feature
    enhancements introduced in newer versions require a database refactoring that
    can make support of older versions of a service problematic. The book [Refactoring
    Databases](http://databaserefactoring.com/) provides numerous patterns that can
    assist with resolving these problems.


    An illustration of these concepts can be found in Figure 2.11.


    Figure 2.11: Version Deployment Example


    ![figure-2-11-Version-Deployment-Example.jpg](images/00017.jpeg)


    Adapter Services for Third Party Products'
