    Microservice libraries are typically organized by business competency. That is,
    they organize by topics important to the business. [Domain Driven Design](https://en.wikipedia.org/wiki/Domain-driven_design)
    (DDD) calls these topics domains. Domains are an analytical construct that essentially
    represents an independent model. DDD further breaks down domains into sub-domains,
    if needed, and then bounded contexts. Sub-domains are just a more detailed and
    specific domain. Bounded contexts represent physical constructs that make up a
    domain or sub-domain. You can think of a microservice as an example of a bounded
    context. For example, a domain breakdown for a college or university might look
    like Figure 1.3.


    ### Figure 1.3: Domain Example


    ![Domain-Oriented Architecture Sketch.jpg](images/00004.jpeg)


    The other theoretical construct applicable to microservices architecture is [Conway’s
    Law](https://en.wikipedia.org/wiki/Conway%27s_law). Conway’s Law (1968) basically
    states that corporations build applications that follow their internal communication
    structure. Microservices architecture is no exception. To paraphrase this concept,
    microservices follow the org chart.


    Microservices function by breaking large business problems into many smaller business
    problems. It’s easier to get an understanding of what a microservices architecture
    looks like by comparing it to traditional web application architecture, which
    you already know.


    ## The Benefits of Using Microservices Architecture


    Microservices reduce/eliminate technical stack lock-in. How many of us have seen
    it take an act of God to do a `JDK` version upgrade? As in a traditional world,
    it takes coordination from system administrators, and often other development
    teams, and it’s difficult. In a microservices world, it’s easy to have different
    services at different versions of the `JDK`; the service can get upgraded in isolation.


    The technical lock-in point goes further than just version upgrades. In this world,
    services can choose different database platforms as they effectively ‘own’ them.
    One might use a nosql database like `Cassandra`, while another might stick to
    a relational db.


    That said, organizations do get economies of scale with their available database
    choices. Databases need to be backed up and tuned, and sometimes recoveries need
    to be performed. This takes technical expertise that most organizations centralize
    for economic reasons. Just because one of the barriers to making different choices
    has been removed, doesn’t mean that you should go crazy and have 50 different
    database platforms. From a management perspective, it’s important to place boundaries
    or guidelines on technology choices so that what’s created can be supported.


    Microservices architecture speeds delivery to market. That is, overall development
    production rates will increase using a microservices architecture. For example,
    at last report, Amazon’s deployment rate has been reported at 23,000 per day.
    Netflix’s deployment rate has been reported at 5,500 per day. To be fair, most
    organizations implementing microservices on a large scale also implement continuous
    delivery and DevOps. It’s reasonable to expect that DevOps and continuous delivery
    implementations at Amazon and Netflix also contributed to their high deployment
    rates.


    The additional productivity depends on reduction in communication overhead for
    developers. That is, developers are able to be more ‘heads down’ in development
    mode and don’t need to coordinate their effort as much with others.


    In order to achieve that reduction in communication overhead, you must get good
    at contract management. That is, you need to be good at explicitly detailing the
    contract that will be implemented and the behavior that those service operations
    will implement. Developers shouldn’t have to communicate with other teams regarding
    the interface; they should be able to be heads down.


    Each team is able to work independently without forced interaction from other
    teams. That is, they have their own development/deployment schedule.


    As an architect, most of your time will be spent in contract management; that
    is, detailing the contract specification in enough detail that developers can
    implement. The questions you get back from developers are feedback to the architect.
    If the number and scope of questions are minimal, the contract was adequately
    specified. If developers are confused, the contract specification needs work.


    You must be good at contract management. Contract management gives your development
    team independence and frees them from communication overhead. That contract specification
    can also be re-used as documentation of the service for consumers, which alleviates
    communication overhead for both producers and consumers. It’s reduction in communication
    overhead that provides the development velocity increase.


    Developers should only be assigned to one and only one service at a time. This
    reduces context switching time for developers and increases velocity.


    Microservices provide resource staffing flexibility. Microservices development
    teams are small and focused. Developers *only* work on one service at a time.
    That service is supposed to have a firm contract that those developers are coding
    to, preferably with containerized deliverables (i.e., `Docker`). The point is
    that they’re mainly doing heads-down development. They shouldn’t be burdened (or
    have to be burdened) with communication overhead except with other developers
    working on that service.


    They are working as an independent team, completely asynchronously from all other
    service teams. Combined with the fact that they have low communication overhead
    and defined deliverables, they can be anyplace in the world in any time zone.
    It doesn’t matter whether they are in-sourced in some corporate office nearby
    or somewhere off-shore.


    Given that the work of the team is confined to the focused requirements for the
    service, worries about code quality, etc. are at least contained to the small
    service source code base. In other words, there’s a limit to how much code that
    team can mess up and thus create maintenance issues.


    Note: Development for microservices can more easily be outsourced!


    This also means that you’re better insulated from rogue developers. We’ve all
    managed developers who produce unmaintainable code; but with microservices, rogue
    developers are confined to one small and focused code base, so there’s a limit
    to how much damage they can do. Furthermore, if that code base is small, focused,
    and well-defined, it’s more replaceable if need be. You’re not letting rogue developers
    loose in a 500K line monolithic application to cause havoc on a wider scale.


    Microservices provide better availability and resiliency (if implemented well).
    Microservice dependencies force developers to build in fault tolerance and make
    failure a first class citizen in design and development. Faults and outages are,
    by definition, localized to identifiable components. We’re going to learn that
    the ability to horizontally scale individual services allows you to decrease complete
    outage time.


    ## The Disadvantages of Using Microservices Architecture


    Microservices can be harder to manage if not designed well. We’re going to see
    that enterprise architecture and contract management is critical. Without that,
    the benefits of adopting microservices will be eroded significantly. We’re going
    to see that adopting a DevOps culture is a prerequisite for implementing microservices
    on a large scale. Often, organizations that adopt microservices also have adopted
    continuous delivery. Bottom line: implementing microservices is a paradigm shift
    for management as well as developers and architects.

