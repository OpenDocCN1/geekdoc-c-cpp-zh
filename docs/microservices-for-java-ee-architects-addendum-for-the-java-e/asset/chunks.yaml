  trans: '

    作为一个服务的发布者，你的公民义务是仅在万万不得已的情况下才引入破坏性变更（breaking change）。只有在绝对没有其他办法时，才引入破坏性变更。尽管主观意良好，这种情况仍可能发生。这可能是因为某个依赖服务引入了破坏性变更，从而迫使你做出反应。也可能是某个支持的功能无法再支持，因为依赖服务所需的某些功能已不再存在。又可能是因为组织决定弃用某个业务流程，结果导致你需要引入破坏性变更来迎合该业务决策。请注意，这可能不是导致破坏性变更的因素的完整列表。


    作为一个消费者，你的公民义务是忽略服务调用返回的任何你不需要的信息。原因在于，这可以使你的消费服务更具韧性，并且受你所调的服务变化的影响更小。你不会受到结果集中新增内容或你并不需要的属性被移除的影。这降低了你所调的服务变更影响到消费服务的概率。


    作为一个服务提供者，你需要建立一个弃用策略（deprecation strategy）。也就是说，你不能仅仅引入破坏性变更并让消费者手忙脚措地调整。在一段时间内，你需要同时支持旧*和*新的服务。你还需要一种通信机制，允许你发布版本变更，并宣布特定版本将不再提供支持的时间点。


    版本控制*仅*用于破坏性变更。非破坏性变更可以在相同版本下发布；如果变更是非破坏性的，提供者就不必维护单独的版本。这促使消费者去忽略他们不使用的返回数据，因为当他们所调用的服务进行增强时，这可以将他们所经历的变更影响降到最低。


    这就留下了几个问题。如果客户端实际上在管理自己从服务版本 A 到版本 B 的迁移计划，那么需要一种方法让客户端能够指定他们想要的服务版本。在提供者端，架构师需要一个合理的策略来在一段时间内同时支持服务的两个版本。我之所以说“两个”，是因为理想情况下，在任何时刻，你都应该有一个处于弃用中的版本和一个当前版本。


    ## 通过 URL 进行版本控制


    一种流行的版本控制方法是通过 URL 进行版本控制。也就是说，将版本号编码在 URL 的某个地方，并让消费者从版本 A 移动到版本 B 时更改他们的请求 URL。URL
    版本控制的示例可见列表 2.6。


    ### 列表 2.6：URL 版本控制示例


    ```

    https://university.edu/services/Students-1.0/12345

    https://university.edu/services/Courses-2.1/PY101

    ```


    通过 URL 进行版本控制最初看起来很有吸引力，因为 Web 服务器软件可以很容易支持。你可以部署多个版本的服务，Web 服务器软件可以将客户端路由到正确的版本。例如，Web
    服务器软件可以很容易地区分 `Students-1.0` 和 `Students-1.1`，并自动将客户端路由到他们请求的版本。当某个版本被弃用时，尝试使用它的客户端可能会接收到
    `426`（需要升级”的 HTTP 状态码）或被自动重定向到新版本。


    如果你通过 [HATEOAS](http://restcookbook.com/Basics/hateoas/) 提供引用，这就会变得有问题，因为这要求提供
    HATEOAS 链接内容的服务需要感知那些被引用服务的版本变更。例如，如果 `Students-1.0` 服务提供了指向 `StudentClasses-1.1`
    的 HATEOAS 引用，那么当 `StudentClasses` 服务引入新版本时，该服务也需要更改。这使得提供 HATEOAS 引用变得更加复杂且容易出现问题。


    此外，你无法控制那些提供了这些 URL 的客户端何时才会真正使用它们。在提供的 URL 中编码版本可能会有问题，因为其中编码的版本可能在提供和使用之间的时间范围内实际上已经被弃用了。这是我更倾向于通过
    Header 进行版本控制（下文描述）的另一个原因。


    ## 通过 Header 进行版本控制


    一种版本控制的方法是允许客户端在服务请求的 Header 中请求特定版本。目前没有标准的 Header 名称来处理这个问题。有人建议使用 `ACCEPT`
    Header 来同时指定预期的版本和数据格式。对我来说，使用 `ACCEPT` Header 是一种关注点泄漏（leakage of concerns）。`ACCEPT`
    实际上只关于预期的格式。版本规范意味着除了 GET 之外的操作可能存在行为差异。列表 2.7a 和 2.7b 是通过 Header 进行版本控制的示例。


    ### 列表 2.7a：Header 版本控制示例


    ```

    URL: https://university.edu/services/Students/12345

    ACCEPT-VERSION: 1.0

    ACCEPT: application/json

    ```


    ### 列表 2.7b：使用 ACCEPT Header 进行版本控制的 Header 版本控制示例


    ```

    URL: https://university.edu/services/Students/12345

    ACCEPT: application/vnd.students.v1.0+json

    ```


    我更倾向于引入自定义 Header，如列表 2.7a 所示，因为没有任何标准的 Header 名称真正适用。这也留下了 `ACCEPT` 来指定格式，以防你的服务支持多种表现形式。例如，客户端在调用
    `Students` 服务时可能会指定一个 `ACCEPT-VERSION=1.0` 请求 Header。如果该版本被遵循，则由服务发布者提供。如果该版本已被弃用，则由最旧的支持版本尝试满足请求。也许有效，也许无效。毕竟，如果一个消费者不打算听取你的弃用公告，那么他们得到什么就是什么吧。如果消费者完全没有指定版本，他们将获得可用的最新版本。同样，返回数据格式可以是默认。如果你将版本规范分离到单独的
    Header 中，那么让消费者使用默认并指定格式会更容易。通过 Header 进行版本控制需要某种类型的路由器来查询 Header 值并将请求重定向到相应的版本。我不知道产品对
    Header 版本控制的支持，但很容易将其通用化并提供。


    图 2.10：Header 版本控制示例


    ![figure-2-10-Header-Versioning-Example](img/00016.jpg)


    始终提供一个指示所提供服务的响应 Header（例如 `VERSION=1.1`）。由于没有标准的版本控制响应 Header，需要引入一个。这些信息可能对消费者诊断支持问题很有帮助。


    ## 支持多个版本部署


    将所有版本作为独立的应用程序部署。不要尝试在同一个服务中混用多个版本。这样对旧版本进行意外更改的风险太大。此外，这使得服务代码变得复杂得多。


    独立水平扩展版本。可能不同版本之间的消费者负载并不相同。例如，你的服务版本 1.0 的负载可能小于 1.1 或 1.2。因此，版本集群的配置可能不同。如果你的集群由
    DNS 轮询支持，使用子域名来区分不同的版本（例如 `students_1_1.university.edu`）。


    服务的所有版本都应该使用同一个数据库。可能新版本中引入的功能增强需要数据库重构，这使得对服务的旧版本的支持变得困难。[Refactoring Databases](http://databaserefactactoring.com/)
    一书提供了许多可以帮助解决这些问题的模式。


    这些概念的插图见图 2.11。


    图 2.11：版本部署示例


    ![figure-2-11-Version-Deployment-Example](img/00017.jpg)


