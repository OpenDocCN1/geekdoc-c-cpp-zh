    微服务团队负责确保其服务满足所有非功能性需求。实际上，这意味着选择一个对组织而言“新”的技术栈天生就带有某种“税收”负担，因为它还需要提供满足非功能性需求的能力。对于新的技术栈，企业内部可能不存在处理非功能性需求的策略，这需要进行识别并可能需要开发。理想情况下，采用企业新技术的微服务团队应该以一种方式开发这种能力，以便其他团队可以在其他服务中复用它。例如，如果一个企业采用了
    [JRuby](http://jruby.org/) 框架并决定使用它编写微服务，则可能需要识别并建立整合健康检查、性能指标以及处理其他非功能性需求的能力。


    ## 健康检查 (Health Checks)


    健康检查通常是一个 URL，用于提供服务正在响应并能够履行其功能的某种指示。该 URL 由某种类型的监控工具（例如 [Nagios](https://www.nagios.org/））调用，该工具能够在健康检查失败时向管理员发出警报。简单的警报是微服务的
    `JVM` 未响应。问题随变为：你对“响应”的定义是什么？通常，仅仅能够响应 `HTTP 200` 是不够的。


    除了验证服务本身能够无错误地响应 URL 外，我还喜欢检查对外部资源和依赖的访问。例如，我喜欢检查数据库连接池的状况。是的，数据库和其他外部资源也应该通过独立的健康检查进行监控，但检查用于数据库访问的连接池的状况，也可以验证该池的大小对于服务当前处理的事务量是否合理。这种检查只能在微服务进程内部执行，无法从外部进行有效监控。这种情况也会出现在传统的
    Web 应用中，对于微服务来说并不新奇。


    无论你所编写的微服务使用什么种技术栈，健康检查都应该是企业提供的应用程序架构的一部分。没有理由让每个服务生产者都必须构建自己的一套。我通常利用 Dropwizard
    的 [metrics](https://dropwizard.github.io/metrics/3.1.0/manual/healthchecks/) 库来编写健康检查。


    寻找此类健康检查代码级示例的读者可以在[此处](https://github.com/Derek-Ashmore/moneta/blob/master/moneta-core/src/main/java/org/moneta/healthcheck/DbcpConnectionPoolHealthCheck.java)
    找到。该示例检查连接池，以验证等待数据库连接的事务数少于可配置的数字（默认值为三）。也就是说，如果有太多事务等待数据库连接，那么服务就是不健康的，因为消费者正遭受性能问题。在这种情况下，可能需要根据服务正在处理的负载重新调整连接池的大小。此外，我会验证从池中的一个连接，以确保不仅数据库可用，而且服务与数据库之间的网络连通性也是可用的。


    ## 性能指标与告警 (Performance Metrics and Alerts)


    性能指标有助于支持开发人员调查性能问题。我也会对传统的 Web 应用跟踪性能指标，例如应用程序中每个页面的性能。在接收到性能缓慢的模糊报告时，如果你有历史数据，那么确切知道当前性能与历史性能的对比将是非常用的。更重要的是，它还能加快性能调查的进度。


    在微服务架构中，用户操作可能涉及多个服务。定位性能问题（即确定是哪些服务导致了该性能问题）会变成一个耗时的问题。掌握所有服务的性能数据可以极大节省支持开发人员的时间。


    传统 Web 应用的性能更容易衡量。通常，性能指标是在 `/web` 页面级别收集的。用于为传统 Web 应用的页面/URL 收集性能指标的工具非常多。我使用
    [Admin4J](http://admin4j.net/doc/performance.html)，但也有其他产品可选。


    对于 RESTful Web 服务，性能测量稍微困难，因为 URL 包含标识符，且行为随操作（`GET`、`POST`、`DELETE` 等）而异。详细来说，通过严格的
    URL 来衡量 RESTful 服务没有意义，因为 URL 包含数据标识符。例如，分别测量 URL `/students/1` 和 `students/2`
    的 `GET` 操作是没有意义的。它们都是相同的查询，只是针对不同的学生。对整个掩码 `/students/*` 进行合并测量会更好。如果你的服务返回相关数据的选项，情况会变得更加。例如，如果服务支持
    `/students/1/classes`，那么课程搜索结果的行为将与学生搜索结果不同，进行区分可能是有用的。[Admin4J](http://admin4j.net/doc/performance.html)
    会合并 RESTful Web 服务调用的性能指标；在写本文时，我还没有发现其他可以做到的产品。


    至少，要衡量每个服务的平均调用时间和总调用次数。由于大多数微服务架构项目都有大量的部署单元，了解调用次数允许你集中精力优化使用最频繁的服务。拥有平均调用时间有助于在用户操作涉及多个服务时定位性能问题。虽然我习惯于同时也拥有调用时间的最小值、最大值和标准差，以及平均值和总数，但这些信息的用性较小，可以视为可选的。


    为超过可配置阈值的服务调用时间设置自动告警。这允许支持开发人员在终端用户报告之前开始主动诊断并修复性能问题。为每个服务确定合理的阈值将涉及某种程度的尝试。阈值过低会产生误报，或者产生并非指示实质性性能问题的告警。


    ## 资源消耗告警与响应 (Resource Consumption Alerts and Responses)


    在 `JVM` 进程内部，某些资源消耗问题一旦发生，实际上就是服务健康问题。


    监控已部署服务的内存使用情况。然而，当你观察 `JVM` 分配内存的方式时，最相关的不是进程级别的聚合内存使用，因为该测量包含了 `JVM` 分配的原生内存，无论
    Java 代码是否实际使用它。最相关的是 `JVM` 内部已消耗和可用的堆内存。可用的堆内存供 Java 类使用，并且实际上可以被消耗。我使用 [Admin4J](http://admin4j.net/doc/memory.html)
    监控内存使用并针对短发布告警，但也有其他可用工具。


    在诊断内存不足时，第一个问题是检测到的内存使用激增是否是由某种内存泄漏引起的。如果原因是内存泄漏，那么分配额外的内存对你没有帮助。如果原因是正常使用，则可能存在容量规划问题，需要分配更多内存，或者需要在集群中定义更多的服务实例。


