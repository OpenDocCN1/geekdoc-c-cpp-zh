    Retry Pattern


    The retry pattern simply retries the requested work until it eventually succeeds.
    This reminds me of the old saying that insanity is the act of doing the same thing
    over and over and eventually obtaining a different result. This algorithm is illustrated
    in Figure 2.3.


    Figure 2.3: Retry Pattern


    ![figure-2-3-Retry-Pattern-Algorithm.jpg](images/00009.jpeg)


    There are usually a couple of configurable options on the retry. An example implementation
    of the Retry pattern can be found on my GitHub in the [Insanity](https://github.com/Derek-Ashmore/Insanity)
    project, which is open source.


    *   The maximum number of retries before the operation is given up


    *   The time interval between each retry.


    For people who want developer level detail, Insanity’s default algorithm provides
    the interval and max retry configuration options. Listing 2.1 provides a usage
    example using a 10,000 millisecond retry interval and 2 maximum retries. Insanity
    requires you to embed the code to be retried in a class implementing the [Callable](http://docs.oracle.com/javase/7/docs/api/java/util/concurrent/Callable.html)
    interface from the JDK. Yes, if you want to, Insanity allows you to code your
    own retry algorithm that accepts different configuration options.


    Listing 2.1: Retry algorithm example using Insanity


    DefaultRetryAlgorithm algorithm = new DefaultRetryAlgorithm(2, 10L);


    RetryManager<String> retryManager = new RetryManager<String>(algorithm);


    MyCallable callable = new MyCallable();


    String callResult = retryManager.invoke(callable);


    The retry pattern operates on the assumption that an outage is temporary – that
    somebody will eventually restore service and the requested operation will complete.
    The retry pattern works best in cases where the work is asynchronous, so use it
    with care. In a microservice world, we’re not supposed to care about execution
    context.


    There is product support for this pattern. It is provided by the Apache Httpclient
    product (and thus CXF also has support because it relies on Httpclient). Spring
    batch provides a RetryTemplate that implements this pattern.


    Circuit Breaker Pattern


    This pattern is a software version of the circuit junction box in your house or
    apartment. Circuits are either closed or open. If they are closed, then everything
    on the circuit has power and can operate. When something bad happens, the circuit
    trips and opens. With an open circuit, nothing on that circuit has power or can
    operate. When you reset the circuit in the junction box, the power is restored
    to every device on that circuit.


    The circuit breaker pattern works the same way. Upon meeting an error threshold,
    it trips and errors out immediately. Any subsequent calls for a configurable period
    of time are also errored out immediately. An example implementation of the circuit
    breaker pattern can be found on my GitHub project [CircuitBreaker](https://github.com/Derek-Ashmore/CircuitBreaker),
    which is open source.


    Figure 2.4: Circuit Breaker Pattern


    ![figure-2-4-Circuit-Breaker-Pattern-Algorithm.jpg](images/00010.jpeg)


    After a configurable interval, a service request operation is let through as a
    ‘test.’ If the test succeeds, then the circuit is automatically closed and all
    service calls are allowed through. Put another way, service is restored automatically
    without human intervention.


    The software version of a circuit breaker usually has these configuration options:


    *   The number of consecutive errors required to trip the circuit and shut down
    service.


    *   The time interval between shut down and allowing a ‘test’ service call to
    proceed.


    For people who want developer level detail, CircuitBreaker’s default algorithm
    provides configuration options for the time interval and the number of consecutive
    errors. Listing 2.2 provides a usage example with a configuration using a 10,000
    millisecond time interval and a two consecutive errors threshold. Insanity requires
    you to embed the code to be retried in a class implementing the [Callable](http://docs.oracle.com/javase/7/docs/api/java/util/concurrent/Callable.html)
    interface from the JDK. Yes, if you want to, CircuitBreaker allows you to code
    your own algorithm that accepts different configuration options.


    Listing 2.2: Circuit Breaker algorithm example using CircuitBreaker


    DefaultCircuitBreakerAlgorithm algorithm = new DefaultCircuitBreakerAlgorithm(10L,
    2L);


    Circuit<String> circuit = new Circuit<String>(algorithm);


    MyCallable callable = new MyCallable();


    String callResult = circuit.invoke(callable);


    As the Circuit class retains state (e.g., tracks the number of consecutive errors
    and knows when a test execution should be allowed through), that variable declaration
    should actually be at an instance level at least.


    There is product support for this pattern buried in the Hysterix product suite.
    If you’re using the Hysterix suite for other reasons, you should definitely take
    advantage of their implementation. If you’re not, that product has a heavy footprint.
    In that case, I’d use a narrower implementation, like the one in my sample.


    Use of the circuit breaker is best placed in client delegates or adapters. That
    way, when it trips, you avoid the network interaction of the call.


    Dispatch via Messaging


    We use this for traditional web applications. The idea is that you encode a service
    call instruction as a message and place it on a persistent queue. That is a queue
    that records the instruction and guarantees delivery at some point. The service
    reads its instructions off the queue and executes them. If the target service
    is down, the work backs up in the queue. When service is restored, the instructions
    in the queue are processed as they should be.


    Figure 2.5: Dispatch Via Messaging Pattern


    ![figure-2-5-Dispatch-via-messaging-Pattern-Algorithm.jpg](images/00011.jpeg)


    Note that this is also a performance pattern. While it doesn’t really do work
    faster, it provides users the ‘illusion’ of a speed improvement by making work
    asynchronous. That is, users perceive a speed improvement because they aren’t
    waiting for the work to complete.'
