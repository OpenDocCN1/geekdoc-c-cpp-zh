    Secondly, the log format needs to include the correlation id with all log entries.
    All the major frameworks support this concept. There’s an example of a servlet
    filter such as this that utilizes Slf4J as a logging framework [here](https://github.com/Derek-Ashmore/RequestCorrelationSlf4J).


    Thirdly, all outgoing service calls need to have the correlation id in the header.
    Unfortunately, all implementations for this are product specific. It depends on
    the web service framework used. For the Apache HttpClient product, you should
    add the correlation id to the header.


    The intent for this technique is to cover REST as well as SOAP. You shouldn’t
    use the SOAP headers; use the http headers.


    Exception Handling for Remote Calls


    With microservices architecture, localizing problems is often where large amounts
    of support time is spent. There are some easy steps you can take to reduce effort
    spent localizing problems.


    Utilize Contexted Exceptions


    Contexted exceptions from Apache Commons Lang V3 and later have [ContextedException](https://commons.apache.org/proper/commons-lang/apidocs/org/apache/commons/lang3/exception/ContextedException.html)
    and [ContextedRuntimeException](https://commons.apache.org/proper/commons-lang/javadocs/api-3.1/org/apache/commons/lang3/exception/ContextedRuntimeException.html).
    These exceptions make it very easy to include information with the exception that
    makes it easier for support developers to diagnose the root cause. An example
    of how to use the ContextedRuntimeException is provided in listing 3.14a. Example
    output when the exception is reported in the log is presented in listing 3.14b.
    As you can see, it’s easy to provide additional information in the log without
    incurring the risk (e.g., guarding against null pointer exceptions) or labor for
    formatting the exception message.


    Listing 3.14a: ContextedRuntimeException Usage Example


    throw new ContextedRuntimeException(“Error adding customer”, rEx)


       .addContextValue(“accountId”, accountId)


       .addContextValue(“accountType”, accountType)


       .addContextValue(“customerName”, customerName);


    Listing 3.14b: ContextedRuntimeException Log Output Example


    org.apache.commons.lang3.exception.ContextedRuntimeException: Error adding customer


    Exception Context:


          [1:accountId=12345]


          [2:accountType=PERSONAL]


          [3:customerName=null]


    ---------------------------------


          at examples.commons.lang.context.ContextedExceptionTest.test(ContextedExceptionTest.java:18)


          at sun.reflect.NativeMethodAccessorImpl.invoke0(Native Method)


          at sun.reflect.NativeMethodAccessorImpl.invoke(NativeMethodAccessorImpl.java:57)


          at sun.reflect.DelegatingMethodAccessorImpl.invoke(DelegatingMethodAccessorImpl.java:43)


          at java.lang.reflect.Method.invoke(Method.java:606)


          at org.junit.runners.model.FrameworkMethod$1.runReflectiveCall(FrameworkMethod.java:50)


    ------------ Output omitted for brevity


    Record request and response for failed remote calls. Include the request and response
    associated with the call so that if communication with the group supporting the
    called service becomes necessary, you’ll already have all the information that
    group needs to diagnose the issue. To provide some context on how useful this
    can be: with a past client, we implemented this practice for all remote service
    calls, and as a result we could localize the problem and identify which service
    had the issue 100% of the time. Additionally, developers saved time because they
    had a ready-made test case they could execute locally and debug. An example of
    how to accomplish this using the Apache HttpClient product can be found in listing
    3.15.


    Listing 3.15: Example HttpClient Exception


    public static CloseableHttpResponse executeGet(String requestUrl, Map<String,String>
    headerMap) {


          Validate.notEmpty(requestUrl, "Null or blank requestUrl not allowed.");


