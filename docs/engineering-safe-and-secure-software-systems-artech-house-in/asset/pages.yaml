  md: 'Yet, while those processes may meet the high capability standards that certification
    requires, the quality of software produced can still be deficient. For example,
    the software might not function properly (i.e., it does not meet all stated functional
    requirements) and may not satisfy nonfunctional requirements for security, resiliency,
    scalability, and so on.


    What happens if we drill down one level to the security and safety aspects of
    software systems? Safety-critical software systems are generally more robust built;
    that is, they are more reliable and resilient than security-critical software
    systems. It is understandable because human life is often at stake. However, even
    safety-critical systems do not always achieve the highest standards, particularly
    with respect to their security attributes. Quite a large body of work has been
    developed over the past 15 years or so relating to building security into software,
    yet the acceptance of security requirements as part and parcel of a software system
    is low in comparison to the acceptance of security requirements. That is not to
    say that there aren''t any forward-thinking organizations that excel with respect
    to their security practices. There are some of them had their achievements broadly
    publicized, such as in the Building Security In Maturity Model (BSIMM) report,
    which documents the security posture of firms that participated in the survey
    based on a series of attributes [4].


    As illustrated in Figure 2.1, we see that in general, certain aspects of the engineering
    of secure and safe software systems such as interoperability and portability diminish
    in the amount of attention paid to as we enter into these areas of limited scope.


    What we are seeing is essentially a top-down process, with the message becoming
    more garbled and less intelligible as we approach more specialized and detailed
    areas. From reading a broad range of publications and attending a number of conferences
    and seminars on systems engineering, software engineering, and related fields,
    we see that, in general, systems engineers pay little attention to systems engineering;
    software engineers appear to ignore both guidance that can be gleaned from systems
    engineering on the one hand, and the nonfunctional aspects of software systems,
    such as security, safety, and resiliency on the other hand. With such a top-down
    hierarchy, there is little change of significant improvement in the overall security,
    safety, and resiliency of software systems. Indeed, it appears that we may be
    heading in the opposite direction.


    Despite some excellent software engineering programs being offered by major universities,
    such as Carnegie Mellon University’s Software Engineering Institute and the Stevens
    Institute of Technology, the field is still underserved. For example, a Master
    of Software Assurance Curriculum [5] illustrates some significant advances that
    are being made in the academic area. Unfortunately, the size and scope of these
    academic initiatives only begins to address the huge deficiencies in knowledge
    and training in this field.'
