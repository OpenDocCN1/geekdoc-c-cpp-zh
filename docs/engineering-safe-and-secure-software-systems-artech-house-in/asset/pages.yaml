  md: '# Preface


    > The best laid plans o'' Mice an'' Men, Gang oft agley ...n—Robert Burns, To
    a Mouse


    The initial concept for this book arose some 3 to 4 years ago. However, it was
    quite different from how the book turned out. I had spent much of the previous
    decade working on application security, particularly software assurance. Several
    years ago, I had the good fortune of being the technical lead on a software assurance
    initiative for the banking and finance sector, supported by the Financial Services
    Technology Consortium. The first phase of the project provided insights from thought
    leaders from independent software vendors (ISVs), information security tools and
    services vendors, industry and professional associations, academia, and a number
    of leading financial institutions. A collection of state-of-the-art practices
    was assembled, with the intention of using the “best” for assuring the quality
    of software through industry-sponsored testing. This work provided a substantial
    amount of research that was behind the BITS publication Software Assurance Framework
    [1].


    The ultimate goal of the software assurance initiative was to establish a state-of-the-art
    testing facility for the financial industry using methods, tools, and services
    chosen from the initial research. Unfortunately, the financial meltdown of 2008
    intercepted. Various mergers and restructurings took place, so that attention
    was turned to other more pressing matters.


    The financial services industry and other critical infrastructure sectors continue
    to be in dire need of such laboratories to ensure that commonly used software
    meets agreed-upon security standards. Others, such as Joel Brenner [2], also espouse
    such a concept as some form of Consumers-like autonomous testing service. But
    who would support and fund such an effort?'
  merge: -1
  pgno: 17
- img_proc: true
  md: 'Perhaps an interesting indicator as to how such testing laboratories might
    be the example of Huawei, the Chinese telecommunications giant, which built the
    Cyber Security Evaluation Centre in England. The Centre''s purpose is to assure
    potential British customers of Huawei products and services that the company''s
    technology can be trusted not only to customers who want them to (and nothing
    more) but also that Huawei''s products cannot be successfully attacked by cyber
    criminals, terrorists or foreign spies, as reported in The Economist [3].


    My initial concept was to cover software assurance with particular emphasis on
    requirements, context, and the like, with some, but relatively little mention
    of the differences between developing security-critical and safety-critical software
    systems, and how to bring these diverse fields together. When what caused me to
    put so much emphasis on the engineering of the security and safety of software
    systems? It was a realization that professionals in the software security and
    safety fields have minimal interaction and are generally not familiar with the
    other engineers'' knowledge base and standard. This argument is supported from
    personal experience as well as the observation that the majority of books and
    articles covering one area have little if any mention of the other field. I first
    became aware of the difference in culture and approach when I did work with a
    small government contractor that built safety-critical software systems. Their
    approach was so different from what I had used to throughout an IT career in financial
    services. The ratio of programming to testing appeared to be reversed for each
    type of system, with security-critical information systems receiving much less
    testing relative to the extensive verification and validation processes to which
    safety-critical control systems are subjected.


    A number of other factors began pointing to the need for developing a book that
    would help security software engineers understand safety and versa. However, the
    most influential event was a serendipitous conversation at the 2010 IEEE International
    Conference on Homeland Security Technology in Waltham, Massachusetts with Peter
    Gutgards and Aaron Termin were presenting on their topic “Security-Critical versus
    Safety-Critical Software.” Peter Gutgards and I discussed the subject and what
    I gained from the conversation was the realization that so little attention was
    being paid to combined safety and security aspects of critical software systems.
    These systems, which include so-called cyber-physical systems, are rapidly becoming
    crucial to the future of modern economics. Before our eyes, software systems are
    being developed that merge sophisticated web applications with traditional industrial
    control systems. Such cyber-physical systems offer the best—and the worst—of both
    worlds. For example, the ability to monitor and control electricity remotely creates
    many new features, as determining and'
  merge: -1
  pgno: 18
- img_proc: true
  md: '# Preface xix


    reporting unusual activities or cessation of service, but they also expose the
    elec-tricity to hackers to malevolent and destructive intentions.


    Today, the security of the smart grid and analogous systems for water and natural
    gas distribution and the like being discussed and are a clear concern of both
    government and the private sector. Yet, beyond the talk, what is actu-ally being
    done is woefully inadequate. This is a case of the road to hell paved with good
    intentions? It seems that there is agreement in principle as to the need, the
    lack of subject-matter expertise and processes for coordination and collaboration
    are thwarting attempts to make it all. We have not built the bridges between security
    professionals and safety engineers to fully coordinated efforts. The cultural
    differences and the goals of the security and safety silos are such that they
    do not interact and do not under-stand the needs of the other group.


    Seeing the lack of interaction, in the field and in the literature, I Deter-mined
    that the software engineering field needs to initiate conversations that will
    reduce and eliminate the lack of communication between information-security professionals
    and software safety engineers.


    Brenner [2] describes how, to their credit, the U.S. military found a way to ensure
    that the efforts of diverse experts would be coordinated and consistent across
    Defense Departments by creating the Chiefs of Staff. As Brenner puts it:


    > Joint organization has paid extraordinary dividends but it was a struggle to
    make it work. Overcoming service-level loyalties took time... The [1986 Goldwater-Nichols
    Act] is one of the most important organizational reforms in the history of the
    United States government...


    If the military do it, so perhaps the rest of government and the private sector
    when it comes to coordinating the efforts to ensure that critical software systems
    are both secure and safe. The is there for solutions that will overcome the security,
    safety, and other deficiencies in the software develop-ment processes and the
    software systems they produce.


    The original direction of improving the software assurance processes and building
    testing continues to be extremely important and needs to be addressed vigorously
    in short order. However I chose to focus on this book on reducing the huge gap
    that exists between the software security and security engineering fields. No
    doubts others revisit my original software-assurance topics at a later date. Now
    I will focus on what I see to be one of the most pressing needs of today''s software
    engineering world—the collaboration be-tween security and safety engineers in
    the creation of complex systems of systems, particularly cyber-physical systems.


    While I have covered many concepts in the software systems safety-se-curity space,
    this work should not be considered an end in itself. It provides a starting point
    from which you can examine the further complex topics'
  merge: -1
  pgno: 19
- img_proc: true
  md: 'that have been discussed in this book. Efforts on your part to expand upon
    that which you read here may be challenging—but they will also be exciting. You
    will be rewarded with the knowledge that you are learning more about what is surely
    one of the most critical areas of software engineering. Good luck with your endeavors.


