  md: '# Software System Security and Safety Metrics


    > Not everything that can be counted counts, and not everything that counts can
    be counted.

    —Attributed to Albert Einstein (Originated by William Bruce Cameron [1])


    > If you cannot measure it, you cannot improve it.

    —Lord Kelvin [2]


    > What you measure affects what you do ... if you don''t measure the right thing.\n—Joseph
    E. Stiglitz, Nobel Laureate (as quoted in [3])


    > There is no accepted agreement on software safety measures and metrics.

    —Andrew J Kornecki, Embry Riddle Aeronautical University, [4]


    # Introduction


    The above quotations are clearly contradictory. Lord Kelvin and modern day thought-leaders
    such as Gary McGraw, Dan Geer, and Andrew Jaquinho (to name a few), believe that
    one cannot improve that one is not able to measure. However, Albert Einstein and
    William Bruce Cameron, together with Gary Hinson and others, support the view
    that there are system attributes, which may not be measurable in numeric terms
    but which nevertheless can be used to significant advantage in assessing risks.
    Joseph Stiglitz, quoted above, extends the argument beyond how one might measure
    to what one should indeed measure.'
  merge: -1
  pgno: 153
- img_proc: true
  md: '# Engineering Safe and Secure Software Systems


    Hinson [5], Hubbard [6], and Axelrod [7] believe one can use characteristics that
    are not simple to measure or may not be considered measurable in the traditional
    sense for decision-making purposes.


    If one can come up with a preferred method for risk identification, assessment,
    and management (which is no easy task), further questions arise being reasonably
    confident that the resulting risk analyses are based on realistic and meaningful
    metrics. Here is a list of some of these questions:


    +   * What information must be obtained in order to calculate risk using a selected
    method?

    * To what extent is historical and real-time data useful, relatively speaking?

    * How quickly must data collection, analysis, and reporting be done in order to
    ensure that these decisions can lead to timely actions?

    * How accurate does the data have to be for one to be reasonably sure of making
    the right decisions?

    * Is required data readily available for effective decision-making—if not, what
    has to done to obtain it?

    * What level of effort is needed to generate, collect, analyze, and respond to
    specific data?

    * Is the additional effort required to obtain the data worth the incremental value
    of such data?

    * To what extent are risk metrics constrained by the availability and suitability
    of data?


    The valuable security-related and safety-related data about software-intensive
    systems may be more difficult and expensive to collect, maintain, and analyze
    than run-of-the-mill, readily-available data. Furthermore, easily-available data
    may be less useful for calculating software security and safety risks and for
    making useful decisions than that is more difficult and costly to come by. Of
    course, it is difficult to prove these assertions other than recognizing that
    there are deficiencies in current metrics. One would expect that the state of
    software-system security and safety would be much better if security and safety
    metrics were more accurate and complete.


    It is important to define careful measurements and metrics and note the differences
    between them. This includes pointing out the differences between data and metrics,
    measurements and metrics, and so on.'
