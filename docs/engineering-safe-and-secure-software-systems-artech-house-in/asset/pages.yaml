  md: 'However, it is clear from the OWASP and CWE/SANS lists that, while many of
    the items clearly exclude exclusively web applications, others can be readily
    related to safety software. Examples of those risks and errors that can be applied
    to safety-intensive software systems include those relating to authentication,
    authorization, and encryption, for example. Strong safety-critical software systems
    have such attributes as encryption and authentication if they are only intended
    to operate in physical and logical isolation. Besides being a good practice in
    and of itself, this approach puts safety-critical systems in good stead for when
    they might be incorporated into cyber-physical systems.


    Examples of the guidelines that are relevant to safety software (but not safety-intensive
    software systems) can be found in the blog, Emergency Management Magazine [4].
    According to the blog article, the top five mistakes made in the selection of
    “public safety software” are:


    +   1. Poorly defined goals and operational outcomes;

    2. Trying to solve the wrong problem;

    3. Poor requirements and request-for-proposal documents;

    4. Lack of coordination, cooperation, and communication;

    5. Not getting peer reviews.


    This list is interesting in that it essentially focuses on the need for highquality
    risk analyses and requirements definitions, and highlights the importance of collaboration
    and communication. These are all factors that are emphasized throughout this book.


    # Enumeration and Classification


    We now turn our attention to the various classification and evaluation methods,
    some of which are shown in Figure A.1, on the right side of the diagram. We will
    add several related approaches.


    Different from the “top so many” lists, these approaches (shown in Table A.3)
    are usually exhaustive lists of vulnerabilities and weaknesses for legitimate
    and malicious software. They are mostly published online by The MITRE Group in
    the form of dedicated websites for each enumeration category. In Table A.3, we
    also include the focus of each method and the purpose of each approach.


    The difference between a vulnerability and a weakness is given in the definitions
    below, where a vulnerability is the occurrence of a weakness, much as an exploit
    or attack is the occurrence of the threat.'
