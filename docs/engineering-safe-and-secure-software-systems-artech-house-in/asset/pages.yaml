  md: '# About the Author


    C. Warren Axelrod is a leading authority on information technology, security,
    and privacy for the financial services industry. He has held executive positions
    at such institutions as SIAC, HSBC Securities and Pershing. Most recently, he
    was the chief privacy officer and business information security officer for the
    U.S. Trust.


    He focuses on cyber security, risk management, and critical infrastructure protection,
    predominantly in the financial services industry, as well as at the national level.
    His recent consulting work has involved him with safety-critical control systems.
    He represented the banking and finance sector at the Y2K command center in Washington,
    D.C. (December 1999–January 2000). He testified at a congressional hearing on
    cyber security (November 2001) and is active in the Cloud Security Alliance.


    In 2009, he received the Michael P. Cangemi Best Book/Best Award presented by
    ISACA for “Accounting for Value and Uncertainty in Security Metrics,” published
    in the ISACA Journal, in 2008. He was honored by the prestigious Information Security
    Executive (ISE) Luminary Leadership in 2007. He received a Computerworld Premier
    100 IT Leaders Award and Best in Class in 2003.


    Dr. Axelrod has written several books, including Outsourcing Security (Artech
    House, 2004). He was coordinating editor of Enterprise Information Security and
    Privacy (Artech House, 2009). He holds a Ph.D. in managerial economics from Cornell
    University and a B.Sc. in electrical engineering and an M.A. in economics and
    statistics from Glasgow University.


    He is certified as a CISSP and CISM.'
