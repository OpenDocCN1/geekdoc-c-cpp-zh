    # Threats from Safety-Critical Systems


    When it comes to safety-critical software systems, which are frequently industrial
    or military control systems, threats are from, rather than to, software systems
    as we have discussed. Now that control systems are increasingly being attached
    to networks, particularly public networks like the Internet, control systems are
    becoming subject to many of the same security threats that plague security-critical
    information systems.


    Safety-critical software-intensive systems also have to tackle their own set of
    threats and exploits. Even if the networks supporting control systems are physically
    and logically isolated, it is still possible to enter the network via other vectors,
    such as USB drives, which are used for the Stuxnet worm. Had the victim of Stuxnet,
    a uranium-processing system in Iran, been completely closed, the particular method
    used to infiltrate the system would not have been viable. Furthermore, if the
    Stuxnet virus had not "escaped" it would not have replicated over the Internet;
    it might have remained a secret. It is claimed that the virus got out into the
    world because of a programming error [16].


    The consequences of malfunctions or failure are to determine the level of safety
    that must be achieved for particular certification. In Tables 6.2 and 6.3, we
    show the various levels attributable to control systems and information systems
    in aircraft (i.e., avionics) and in automotive vehicles, respectively [17].


    It should be noted that, for the most, control system malfunctions and failures
    are considered to be much more damaging than failures of information systems because
    the former could result in physical injury or loss of life, whereas the latter
    usually cause inconvenience, annoyance, and possibly loss of money and other assets
    (i.e., intellectual property). Nevertheless, secondary and tertiary effects of
    an information-system failure could impact the physical world. For example, the
    compromise of a financial system might result in major financial losses, which
    could lead to damage to one''s lifestyle or work. For example, the month-long
    computer system outage of Ulster Bank in Northern Ireland, which lasted from mid-June
    to mid-July 2012, caused a great deal of hardship to customers, even though all
    of the customers will be compensated for any resulting monetary losses.


    Of course, malfunctions and failures can be internal to safety-critical systems,
    as would result from programming errors, or they can be induced by unauthorized
    access to those systems and consequent attacks upon them.'
