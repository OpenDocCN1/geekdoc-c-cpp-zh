    # Combined Safety and Security Requirements


    The main thesis of this book is that safety and security engineering for software
    systems, while deriving from the same evolutionary tree, have become separate
    branches, even though the trend is for safety-critical and security-critical software
    systems to be functionally combined into systems with both safety and security
    attributes.


    One of the few references to address combined safety-critical and security-software
    systems certification is SafSec. In this regard, Lautier [10] makes the following
    statement:


    > Many systems, particularly in the military domain, must be certified or accredited
    by both safety and security authorities. Current practices argue safety and security
    quite separately. A project called SafSec has been investigating a combined approach
    to safety and security argumentation, and has shown that there can be practical
    benefits in performing a combined analysis and documenting a combined argument
    for both safety and security.'
