  md: '# Appendix C

    Security-Related Tasks in the Secure SSDLC


    In this appendix, we list task areas for each of eight phases of the secure software
    system development life cycle (Secure SSDLC) in Tables C.1 through C.8, respectively.
    In Tables C.9 through C.16, we identify who should be responsible for each task
    within each of the eight phases, and to what degree or level each area within
    an organization should be involved. Table C.17 provides a summary of responsibility
    levels for all eight phases and an aggregated level for the entire lifecycle.


    While these tasks contain substantial detail, they should still be used for guidance
    purposes only. Organizations can have very different organizational structures
    and risk profiles. Therefore the emphasis on which task areas to focus is likely
    to vary significantly from one organization to the next. That being said, there
    are usually commonalities than differences when building security into software
    systems. Consequently, it would be helpful for those involved in creating and
    supporting security-critical software systems to have at hand what is essentially
    a checklist. This checklist should prove even more valuable to those who are less
    involved with security and are more focused on safety-critical systems; such individuals
    are less likely to be familiar with what is commonly required to make critical
    software-intensive systems secure.


    It should be noted that we do not include any rules for safety software engineers
    in the Secure SSDLC. This is fairly typical for information systems that are not
    directly subject to safety hazards. However, going forward, it is likely that
    more information systems will have safety-critical components or will be interfacing
    with safety-critical systems. When security-critical'
  merge: -1
  pgno: 279
- img_proc: true
  md: 'information systems are combined with safety-critical control systems to form
    cyber-physical systems do the creators, maintainers, and operators of the systems
    have to account for safety issues. Of course, a physical event, such as a power
    blackout or a telecommunications network failure, can drastically impact information
    systems, but usually from performance, resiliency, and availability perspectives
    and not much with respect to security.


    As will be argued in Appendix D, the reverse is not necessarily true. Those designing,
    operating, and supporting safety-critical software-intensive control systems often
    need to consider security aspects of their systems, even if the systems themselves
    are designed to be physically and logically isolated. There is always the possibility
    of intentional insider attacks by authorized employees or contractors, or unintended
    insider assistance to an attacker, as in the case of the Stuxnet worm that attacked
    the industrial control systems operating the centrifuges in uranium-processing
    facilities in Iran.


    # Task Areas for SSDLC Phases


    In Tables C.1 to C.8, we provide descriptions and suggest purposes for each of
    the tasks throughout the following eight phases of the Secure SSDLC:


    +   1. Risk analysis;

    2. Security requirements;

    3. Security architecture and design;

    4. Development (building/configuration/integration);

    5. Functional and nonfunctional security testing;

    6. Deployment;

    7. Operations, maintenance and support;

    8. Decommissioning and secure disposal.


    Tables C.1 through C.8 below give those tasked with ensuring that security is
    built into software systems a fuller understanding of what is involved within
    each step (or task area) and why individual steps are needed.


    The initial phase comprises the analysis of risk and its management. As shown
    in Table C.1, it is first necessary to determine potential risk factors, such
    as threats and weaknesses that enlace into exploits and vulnerabilities that have
    some probability of allowing successful attacks. These latter attacks cause losses,
    which can be reduced or mitigated using prevention, avoidance and/or deterrence
    methods.


    The results of the risk analyses not only point towards the need to mitigate the
    identified risks, but also provide input to the requirements phase, as'
