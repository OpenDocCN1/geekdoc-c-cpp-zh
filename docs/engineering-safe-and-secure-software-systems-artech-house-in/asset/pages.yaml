  md: '# Appendix C


    (Table C.17) are normative. That is to say, many of the teams or groups might
    not exist in typical small and medium-sized businesses or in large entities. Also,
    it is the exception, rather than the rule, for groups designated to the level
    of involvement shown. While some surveys, such as those conducted and reported
    as part of the Building Security Maturity Model (BSIMM) effort [1], show relatively
    high levels of involvement by team members, the companies participating in the
    BSIMM exercise are largely self-selecting. The general picture in both public
    and private sectors are not nearly as encouraging.


    In Table C.9, we show the degree of involvement of various areas in the risk analysis
    and control phase. For the most part, risk analysis focuses on the business perspective,
    preferably with considerable support from the information security department
    and risk area and oversight by internal and external auditors. The results from
    the risk analysis become a major source for the subsequent requirements phase.
    This approach is far from ideal if the software development and operations teams
    were to be more involved than usual, they would better understand the concerns
    of the business and account for such concerns in the design, development, and
    implementation of software-intensive systems. This disconnect leads to developers
    not assuming ensuring that their software addresses business management risk concerns—this
    transfer of responsibility is described in greater detail in the section on *technical
    debt* in Chapter 11. In Table C.9, and in the subsequent tables, we indicate ideal
    levels of involvement. It should also be noted that the entries in the following
    tables are highly subjective based on personal experience and judgment, and that
    other situations may call for different levels of involvement.


    It is usual for the development team and the infrastructure team to be heavily
    involved in the requirements phase, as shown in Table C.10 preferably with a high
    level of involvement by the business units for the software system is being created.
    Often, the security requirements are given short shift, as evidenced by the apparent
    lack of security and privacy capabilities of many web applications, in particular,
    but also of production systems. There should be heavy involvement of the security
    team and auditors to ensure that the requirements are adequate with respect to
    security.


    The security-related tasks in the design and architecture phase, shown in Table
    C.11, should depend heavily on the security team, as well as on the application
    development and infrastructure teams, and to the extent possible, the auditors.
    Business units, where the end-users generally reside, are somewhat less involved
    because most of the work in this phase is technical.


    As Table C.12 indicates, the development or coding phase is mostly dependent on
    the technical teams, with strong oversight by auditors. The business side is less
    involved. Similar involvement carries through to the testing phase, depicted in
    Table C.13, for the same reasons.'
