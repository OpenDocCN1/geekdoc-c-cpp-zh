  md: '# # 4

    Engineering Secure and Safe Systems, Part I


    > > Security engineering is about building systems to remain dependable in the
    face of malice, error, or mischance.

    —Ross J. Anderson, Cambridge University


    # ## Introduction


    When it comes to building, operating, and decommissioning safe and secure systems—particularly
    computer-based software-intensive systems—practitioners often often borrow methods
    and practices derived from the discipline of systems engineering, as well as from
    safety and security engineering. In this chapter, we take the more general systems
    view of engineering secure and safe systems. This is somewhat more difficult than
    one might think because so much of what has been published recently, while having
    a software orientation, it does not adequately treat specific security and safety
    attributes of the systems under discussion.


    This assertion about the predominance of software considerations is reasonable
    practically all modern systems of any complexity whatsoever incorporate software
    components to some degree. However, for the sake of clarity, we defer consideration
    of the engineering of safe and secure software-intensive systems until later.
    In this chapter, we will focus on safety and security considerations for general
    systems before making everything that much more specific and complicated by adding
    the software dimension.'
