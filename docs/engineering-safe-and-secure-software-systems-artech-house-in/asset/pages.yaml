    receives a great deal of attention. However, the amount of attention has not been
    enough to avoid many projects being late and over-budget. Furthermore, the resulting
    products and services do not meet the requirements and expectations of stakeholders.


    Much of the benefit from invoking world-class processes is lost if the resulting
    products and services are poor because the processes are badly managed. Furthermore,
    if the best processes do not go through an effective quality-assurance phase,
