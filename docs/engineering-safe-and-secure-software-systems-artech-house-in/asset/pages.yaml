  md: 'The OWASP report helps readers determine whether specific applications are
    vulnerable to each of the various threat agents, and how to prevent the threat
    from exposing the particular application to compromise. Examples of attack scenarios
    are given. Merkow [7] provides very good explanations of the 2010 OWASP Top 10.


    # CWE/SANS Most Dangerous Software Errors


    The CWE effort is described as a “community-developed dictionary of software weakness
    types,” [2]. The CWE effort is also in the category of approaches that enumerate
    lists of weaknesses, vulnerabilities, threats, errors, and so on, and is included
    on the right side of Figure A.1. The top 25 most dangerous software errors for
    2011 are available on the CWE website [8].


    As Version 2.2, there are 909 CWE errors. Included among these CWE errors as well
    as the CWE/SANS Top Twenty-Five by following the links provided to each of the
    OWASP Top Ten, one can see which CWE errors relate to each item. For the top 25
    CWE errors are shown in the right-most column of Table A.2. Note that some of
    the CWE/SANS Top 25 do not have OWASP equivalents, and some have.


    Table A.2 shows the ranking not only of the highest-ranked 25 software errors
    but also of the next-ranked 16 errors. The CWE website [9] splits the top 25 into
    three categories, depicted in the table as columns A, B, and C, as follows:


    +   * Column A: Insecure interaction between components (insecure way in which
    data are sent and received between components, modules, programs, threads, or
    systems)


    +   * Column B: Risky resource management (software does not manage properly the
    creation, use, or destruction of important system resources).


    +   * Column C: Porous defenses (defensive techniques that are often misused,
    abused or ignored).


    # Top-Ranking Safety Issues


    There do not appear to be any safety equivalents to the lists of leading risks,
    threats, errors, and the like that exist for software security. This is probably
    due to there not being the same need for such lists in the safety area because
    there are many highly-detailed safety standards against which software systems
    must be certified, many of which are described by Herrmann [10].'
