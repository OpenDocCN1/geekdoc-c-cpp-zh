    # # Conclusions


    Having journey through the evolution and requirements for security-critical and
    safety-critical software systems, one is impressed with the tremendous amount
    of good material that is already available in this space, whether it is in the
    form research papers, commercial tools, scholarly and practically oriented books,
    and government and industry standards and certifications. Yet, for a variety of
    organizational, cultural, and technical reasons, the strengths in various aspects
    and zones of software systems engineering never seem to find their way to other
    areas. There will be considerable potential benefits to the highassurance software
    world through the transference of existing knowledge about software security and
    safety processes, methods, tools, and the like across the entire field. Today’s
    gaps between software security and safety engineering are exacerbated by the fissures
    between government and the private sector, the private sector and academia and
    research institutions. Bridging these gaps will be no easy task. Prior attempts
    at public-private information-sharing and collaboration have met with limited
    success, and there is no indication that the present situation will improve in
    the foreseeable future unless effective legislation and regulation were to come
    into, which itself is not particularly likely. There is still a need to express
    the risks of attack, malfunction, and system failure in a way that is understood
    by lawmakers, regulators, law enforcement, the military, and the public. Also
    these groups need to internalize and understand what it will take to mitigate
    them. Such educa-'
