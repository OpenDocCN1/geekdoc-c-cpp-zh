- img_proc: true
  md: '# Costs and Risk Mitigation


    One can invoke incentives, such as the linking of a person''s compensation to
    how well they implement corporate goals in areas such as security, safety, and
    resiliency. The latter goals might not normally be factors for participants as
    developers and testers.


    The behavior of some can be influenced by opportunity costs and costs of opportunity.
    The former, which are those costs incurred in doing one thing than another, imply
    that a decision-maker might be in a position to choose one of risk mitigation
    over another. An example would be the incorporating of security during the SDLC
    or installing firewalls and other tools once the software system has been deployed.
    In another example, a company might choose to invest in ruggedizing a data center
    by providing onsite backup for its systems, redundant power supplies (e.g., battery
    backup, diesel generators), several telecommunications vendors, and so on, rather
    than spending the money on a fully functional data center. With some of the money
    saved, the company might contract with a third party to provide disaster recovery
    services on demand. The latter influence—namely, the cost of opportunity—refers
    to the willingness of some to make decisions that reduce costs but might have
    an adverse impact at some future time. This is deemed risk acceptance, for example
    the decision-maker is willing to take a chance as to whether a cyber attack will
    happen.


    # Management Mandate


    An effective means of encouraging the desired behavior is to make company policy
    and put in place credible enforcement procedures. If senior management is convincing
    and has a track record indicating that they mean what they say, then this approach
    can be extremely effective. A very good example of this is the previously mentioned
    case of Bill Gates, founder of Microsoft Corporation, who made a announcement
    that trustworthiness would be a key ingredient in their products going forward.
    In the decade since that statement, Microsoft has greatly increased its reputation
    for building secure software.


    By establishing a goal and publishing a related policy, senior management is directing
    lower-level managers to meet or beat the goal but is leaving the details of implementation
    to the judgment of the managers. Usually this means that reasonable budget requests
    for introducing security, safety, and other capabilities will be met with approval.'
