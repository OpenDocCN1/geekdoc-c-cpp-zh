    Secure SSDLC Projects in Greater Detail


    A comprehensive, systematic approach to implementing security from the very start
    of applications development is essential.

    n—Patrick McBride and Edward P. Moser, [1]


    In an era riddled with asymmetric cyber attacks, claims about system reliability,
    integrity and safety must also include provisions for built-in security of the
    enabling software [emphasis added].

    —The Data and Analysis Center for Software (DACS), Department of Defense [2]


    Dependability specifications are analogous to safety and security requirements...

    n—Praxis High Integrity Systems, [3]


    # Introduction


    As we have already discussed, there are numerous acronyms for security-critical
    and safety-critical software-intensive system-development life cycles. Many of
    these acronyms, though seemingly different, apply to very much the same types
    of systems and processes, whereas others are clearly or subtly different, often
    ambiguous. All attempts to define the development process and life cycle components
    are intended to bring structure, formality, completeness, and repeatability to
    processes and procedures, which are often ad hoc in practice. Many processes address
    only the account broader aspects of software-intensive systems by including platforms,
    infrastructures, and possibly hardware. Yet other approaches specialize in one
    attribute of software such as security, safety, reliability, integrity, availability,
    performance, resiliency, and the like, but pay little attention to the other'
  merge: -1
  pgno: 199
- img_proc: true
  md: 'characteristics of software systems. Thus books about software security seldom
    mention safety and those covering the topic of software safety little or no attention
    to security.


    The purpose of this chapter is to examine the phases and detailed tasks and subtasks
    that are most crucial to developing, operating and decommissioning secure software
    systems. In Chapter 10, we shall look into the same processes as they apply to
    safety-critical software systems. We shall then look at the particular issues
    that relate to creating software systems that are both security-critical and safety
    critical.


    # Different Terms, Same or Different Meanings


    The simple acronym SDLC is itself ambiguous. In some instances, SDLC refers to
    the system development life cycle, or system design life cycle, whereas in others
    cases it has the meaning software development life cycle. Going back some years,
    the IBM Corporation came up with the abbreviation SDLC for Synchronous Data Link,
    referring to a network communications protocol. To further complicate matters,
    Microsoft Corporation has adopted the SDL to stand for the “security development
    life cycle” [4], when the authors mean “secure software development life cycle.”


    In this book, we will use the acronym SSDLC to mean software system development
    lifecycle. It should be noted that this abbreviation is neither unique; it has
    been used to mean secure software development life cycle in a number of cases
    [5]. Others used SSDLC to mean “security development life cycle,” which has the
    same problem of confusing secure systems with security systems, as discussed previously
    [6]


    We depict particular flavors of the SSDLC using the terms secure SSDLC, safe SSDLC,
    resilient SSDLC, and this. Because this is the term software system emphasizes
    the fact that software is not developed in isolation, nor can it run without other
    software, framework, and hardware components. Software is always part of a broader
    system that includes platforms (i.e., operating systems, system utilities) and
    infrastructures (i.e., equipment and networks), and must generally be designed
    and developed with specific platforms and infrastructures in mind.


    In order to accommodate security and safety, we use terms such as secure software
    system development lifecycle (secure SSDLC) and safe software system development
    lifecycle (safe SSDLC). When we consider building systems that have both explicit
    security and safety requirements, we use the cumbersome term safe and secure software
    system development life cycle (S’DLC), favoring precision over brevity.'
