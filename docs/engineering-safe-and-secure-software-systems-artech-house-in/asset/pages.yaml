    # Technical Debt


    The concept behind technical debt is, that software systems are designed, developed,
    implemented, operated, and replaced, those involved in the development cycle and
    the subsequent operational environment are taking on, knowingly or not, technical
    debt that can be either borne or reduced, consciously or otherwise.


    Allman [1] states that “... technical debt is acquired when engineers take shortcuts
    that fall short of best practices.” Of course, called “best practices” might also
    fall short of ideal practices, which imply that they are in fact two or layers
    of technical debt in common practices often exclude essential elements, depending
    upon the authority and vision of the sources of these practices.


    Allman gives a number of examples where technical debt might be taken on due to
    competition between best practices and other factors. The following are some of
    his examples:


    +   * Setting too-tight deadlines;

    * Not anticipating the costs of tools and using them inappropriately;

    * Assigning engineers with inadequate or inappropriate skills to projects;

    * Skipping documentation requirements or writing inadequate documentation;

    * Skimping on good security practices;'
