  md: '# The Responsibility for Safety and Security by Individuals and Groups


    We now consider how the safety and security of software systems, in particular,
    are viewed by a wider-ranging constituency and the extent to which safety and
    security attributes are really considered to be the responsibility of various
    groups. In a sense, this approach is similar to technical debt in that the cost
    of neglecting safety and security is accrued throughout the software system development
    life cycle. We look at the economic consequences of security lapses and safety
    failures on a border population comprising those directly and indirectly involved
    in the creation, deployment, and operation of software systems.


    # Basic Idea


    The fundamental concept behind the proposed risk-based value approach is that
    stakeholders have a personal view of including or excluding particular safety
    and security features will directly affect them as individuals. While there may
    be other motivations, an individual will still view the impact of safety and security
    features and capabilities from his or her perspective. Individual motivations
    will likely only coincide with organizational goals if personal results benefit
    from a healthy and prosperous organization. This might appear somewhat cynical,
    but it is not meant as a criticism and does not deny that people will act altruistically
    for the benefit of a group, organization, or country. The point is that one''s
    assessment and response to risk is generally highly subjective and intensely personal.


    As an example, if a group of developers is responsible for completing an application
    by a certain deadline and within a predetermined budget, and achieving these goals
    is the basis for team members being rewarded, then any time delays and additional
    costs or resource requirements that might threaten the official deadline will
    be avoided as possible. It is only if criteria for rewards and benefits are included
    in safe and secure software design, architecture, development, and testing that
    the proper amount of attention will be given to these areas. However, the decision
    to tailor compensation and other rewards to how well particular safety and security
    requirements are met has to come from high-level management within an organization.


    By recognizing the motivators for security-related decisions and incorporating
    them into an economic model of how individuals respond to motivators, one understands
    why certain decisions are made for incorporating security and safety into software
    development, operation, and decommissioning of software-intensive systems. To
    quote from Axelrod [5]:


    > One cannot develop economic models for information security and privacy without
    having a good understanding of the motivations, disincentives, and other influencing
    factors affecting the behavior of'
  merge: -1
  pgno: 240
- img_proc: true
  md: '# The Economics of Software Systems'' Safety and Security 219


    criminals, victims, defenders, product and service providers, lawmakers, law enforcement,
    and other interested parties Predicting stakeholders'' actions and reactions will
    be more effective if one has a realistic representation of how each of the various
    parties will respond to internal motivators and external stimuli.


    As we have seen, safety engineering is very formal in certain critical industries,
    such as aerospace, avionics, and vehicular power plant safety, requiring that
    systems be evaluated based on their potential for doing harm, which then points
    to a level of certification needed by the industry.


    # Extending the Model


    The model in [5] discusses the motivations by various stakeholders to attack and
    defend security-critical software systems. Here, we extend the model to cover
    safety-critical software systems and focus the impact of stakeholder motivations
    on the SSDLC.


    We examine each of the phases of the life cycle and how stakeholders are currently
    involved or influence each stage. We recommend how we might change the list of
    players involved at each stage and their roles and responsibilities in order to
    achieve a more acceptable level of safety and security. We also suggest both motivators
    and deterrents, which might be used to influence the outcomes of each step so
    that the final product or service meets an organization''s safety and security
    requirements. The intent is to come with a list of actions that will move decision
    makers and stakeholders towards security and safety postures that best meet the
    needs of society as a whole. While many of the suggestions are normative, and
    will be unlikely to be put into effect by factors such as high costs, limited
    resources, and lack of authority, the model very points to areas that need attention,
    and to some extent suggests new and different ways to improve the situation as
    it stands today.


    # Concept and Requirements Phase


    When requirements for a system are being determined, those making decisions as
    to the functional and nonfunctional requirements of the proposed system might
    be unlikely to consider a full range of security and privacy issues. The likelihood
    that safety issues will be included is usually much higher, in large part because
    safety-related software malfunctions and failures might result in injury or loss
    of life. Insurance companies have formulas for determining the value of an injury
    or death in monetary terms for their purposes, but often the indirect impact is
    much greater in terms of confidence in'
