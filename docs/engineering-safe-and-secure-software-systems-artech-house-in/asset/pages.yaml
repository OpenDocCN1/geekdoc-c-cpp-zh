  md: '# The Economics of Software Systems'' Safety and Security 213


    In the 1960s, typical business-oriented computer systems would fail on a daily
    basis. A common remark at that time was that airplanes were unreliable as computers,
    nobody would be willing to fix. Since then, reliability of hardware components
    of computers has improved by orders of magnitude. It might therefore be constructed
    that software components are all much more reliable. However, the complexity and
    diversity of software systems and their aggregation into so much complicated systems
    of systems has worked against software developers in their attempts to eliminate
    security vulnerabilities and keep occurrences of malfunction and failure as low
    as possible. This is why architects have heretofore pushed to isolate safety-critical
    systems from public communications networks where visibility is the only approach
    to use protection and prevention are not viable. However, requirements for increased
    functionality on the one hand, and reduced costs on the other hand, have pushed
    engineers into realms that are uncomfortable, unsafe, and not secure.


    The fundamental question is whether there is any real motivation to make software
    systems safer and more secure or the diminishing returns of increasing safety
    and security mean that, as time progresses, stakeholders are less inclined to
    embark on the necessary activities to improve the safety and security attributes
    of software-intensive systems. As supported by the Gifford study mentioned above,
    human nature is such that people will only respond to disasters, particularly
    with respect to cybersecurity, and it will take the occurrence of a major cyber
    or cyber-physical attack before government and the private sector will respond
    to previously ignored warnings. For example, Vice Admiral Michael Connelly (USN,
    Ret.), in his February 23, 2010 testimony before the U.S. Senate Committee on
    Commerce, Science, and Transportation, said that risks from cyber attacks will
    not be mitigated until there is more active government involvement and such involvement
    will not be forthcoming until a “catastrophic event” actually happens [3].


    As just the public willingness to accept airplane crashes has led to much more
    stringent standards and certifications in the airline industry, such as DO-178B,
    disastrous or catastrophic cyber events may be the only real impetus for improving
    security.


    However, there is another view; namely, a greater understanding of the forces
    behind motivations of various participants might result in actions that, assigning
    safety and security as personal risks to various players, actions will result
    that will mitigate these risks. In order to accomplish this, it is first necessary
    to identify, understand, and quantify how particular risks affect individuals
    and the degree to which various players can indeed effect change.


    In this chapter we will look at the following:


    +   - Technical debt in regard to the development of software systems;'
