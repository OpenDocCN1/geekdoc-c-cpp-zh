    how one’s terms are defined. Therefore, in this chapter, we examine definitions
    of software and software engineering—or, more precisely, software systems engineering.
    It will be shown that the broad range of usage of these definitions has itself
    produced large gaps between what is really needed to achieve an optimal balance
    among all contending attributes and what exists today.


    Subsequently'
