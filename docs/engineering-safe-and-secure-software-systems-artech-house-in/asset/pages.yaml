  md: '# Software System Security and Safety Metrics


    # Obtaining Meaningful Data


    In the 1970s, IBM used the phrase “Not just data, reality” in their advertising.
    This slogan is especially insightful when it comes to gathering and analyzing
    software security and safety data. It is not useful to collect extraneous or irrelevant
    data, even when collecting such costs virtually nothing (there will likely still
    be substantial data management and storage costs to absorb), nor is it beneficial
    to collect particularly pertinent data if there is no way to implement any decisions
    that might result from it. There is usually a trade-off to consider when determining
    what to spend on obtaining specific data because there may be diminishing returns
    of such data collection, particularly over time. For example, it is much less
    to learn that your systems are vulnerable to a particular exploit after they have
    been successfully attacked to obtain such information sufficiently in advance
    to be able to apply a patch to negate the impact of an attack. Furthermore, one
    must allow for the cost and time required to convert data into the “reality” of
    metrics; it is often not enough to collect information quickly—it must be converted
    into useful actionable information on a timely basis.


    # Defining Metrics


    There are many definitions of the word *metrics*. Here are a few of them:


    +   * “Metrics are tools designed to facilitate decision making and improve performance
    and accountability through collection, analysis and reporting of relevant ...
    data” [8].n* “Metrics report how well policies, processes and controls are functioning,
    and whether or not desired performance outcomes are being achieved...” [9]

    * “A metric is a quantitative measure of the degree to which a system, component
    or process possesses a given attribute” [10].


    A common theme throughout these definitions is that the purpose of metrics is
    to decide about how to enforce policies and manage processes and procedures. It
    is not sufficient that a metric be intellectually interesting. Nor should metrics
    and analytical results be taken at face value without some thought as to their
    meaning, particularly with respect to cause and effect. There appears to have
    been a recent proliferation of analyses, particularly in the health and nutrition
    fields, that discover relationships that do not necessarily have the underpinning
    of cause and effect. In many of these cases, researchers'
  merge: -1
  pgno: 155
- img_proc: true
  md: 'commonly include a disclaimer that the results do not imply a causal relation-ship.
    This raises the question as to what the value of the analysis really is in the
    first place, as the researchers seem to be suggesting that the public should not
    respond to the results. This begs the question as to why researchers published
    the findings at all. Furthermore, it is quite possible in circumstances that the
    analytical results will lead to wrong and potentially damaging decisions and actions
    on the part of decision-makers. A similar situation exists in the system security
    and safety space in which many metrics are published but they cannot be used to
    protect against attacks, prevent a system from doing damage, and the like.


    Unfortunately many reported metrics relating to information security are not very
    useful. For example, it is interesting to learn how viruses and other malware
    are growing exponentially in volume and effectiveness. However, a decision-maker
    needs to know whether these same viruses, say, will have any impact over the domain
    for whom he or she is responsible. If there is no impact, then metrics are not
    actionable and therefore useful. In fact, they may be detrimental because of the
    cost of gathering, reporting, and discussing them.


    Andrew Jaquith [11] defines a metric as “a consistent standard for mea-sure.”
    He states that a good metric should be:


    +   - Consistently measured;

    - Cheap to gather;

    - Expressed as a cardinal number or percentage;

    -ed using at least one unit of measure.


    It was argued earlier that “cheap to gather” is not necessarily a good cri-ter
    for metrics, so this requirement is questionable. Also, the use of cardinal and
    percentage metrics is misleading because they often contain too little information
    for useful decision-making. In particular, a numeric metric out of context, such
    as: “We applied 200 patches last month,” provides no sense as to what level of
    patching is adequate. A percentage metric, such as: “We patched 90 percent of
    our servers last month,” does not indicate how critical the servers, particularly
    those that were not patched, might be. Frequently, some explana-tory is needed
    to make these metrics more meaningful, as “The 10 percent of servers that were
    not patched are considered the least critical to secure operations.


    As a real-world example of misleading metrics, consider an actual case in full-disk
    encryption has been applied to 95 percent of a company’s laptop computers, with
    a goal of encrypting the remaining machines when employees bring them in for service.
    However, one of the remaining 5 per-cent, on which the disks were not encrypted,
    was stolen. This particular laptop'
  merge: -1
  pgno: 156
- img_proc: true
  md: 'computer held personal information of hundreds of thousands of customers.

    The out-of-pocket costs to the company of this possibly exceeded one million dollars,
    with indirect and less tangible costs possibly doubling that amount.

    The metric of 95 percent completion might have been considered good in many situations—but
    not in this one.


    # Differentiating Between Metrics and Measures


    The difference between a measure and a metric is expressed and illustrated in
    a number of places. For instance, in “Risk Measure and Risk Metric,” we read the
    following [12]:


    +   * A measure is an operation for assigning a number to something.

    * A metric is our interpretation of the assigned number.


    As an example, if someone stands on a scale, the process of noting the number
    of pounds (or kilograms) on the dial is a measure, whereas the interpretation
    of that number to determine that a person is overweight turns into a metric that
    can be used for decision-making, such as deciding to go on a diet.


    This is somewhat in line with the differentiation proposed above; the more obtaining
    of a measure is not a metric—only when a metric can be used for decision-making
    and then decisions can lead to actions. This concept is illustrated in Figure
    7.1.


    The diagram shows, by narrowing arrows, that there are losses as the process progresses.
    That is, decision-makers are likely to use a subset of metrics to make their decisions;
    action-makers might only respond to certain decisions and not to others. For example,
    one might have access to weather forecasts for virtually anywhere on Earth. However,
    temperature alone is not useful until it can be attributed to a particular geographic
    area in which the decision-maker happens to be or where he or she is planning
    to travel (although, of course, others will be interested in forecast for other
    regions). The decision-maker might determine that it is appropriate to wear and
    pack particular sets of clothing and take the actions necessary to find and do
    that clothing and/ include suitable clothing in his or her luggage. The decision-maker
    and action-taker may be the same person, as in the weather example. However, in
    many organizations, those making decisions and taking are often different individuals
    or groups, with managers making the decisions and workers implementing those decisions.


    Another source that differentiates between measures and metrics is the National
    Institute of Standards and Technology Software Assurance Metrics'
