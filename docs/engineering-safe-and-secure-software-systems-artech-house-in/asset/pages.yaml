  md: '# Engineering Safe and Secure Software Systems


    +   * Functional requirements (or behavioral requirements) specify services the
    application must provide.

    * Nonfunctional requirements include all requirements not considered to be in
    the class of functional requirements.


    Of course, many have pointed out that the latter term be interpreted to mean “requirements
    that do not function,” but that is not how it is commonly met in systems engineering.
    The usual categorization of attributes, such as safety and security, as nonfunctional
    requirements results in the lack of attention in any but the most mission-critical
    of systems.


    A major part of this book, which is often given short shift in other texts, is
    that many-called nonfunctional requirements also have their functional counterparts.
    The separation of knowledge and duties is such that those with expertise and responsibility
    in the functionality of software systems are generally not knowledgeable about,
    or even interested in, the nonfunctional attributes of those systems. Many experts
    in the nonfunctional aspects of software systems, many of whom do not know or
    care about the detailed functionality of systems. This state of affairs of software
    systems would be acceptable if not for the fact that functional requirements have
    considerable impact on nonfunctional requirements and vice versa.


    Table 7.5 describes the nonfunctional attributes, as mentioned in Braun [19],
    and some that are MISRA [20]. In particular, the omission of safety and interoperability
    as significant attributes is typical of books, papers, and presentations that
    focus on general software engineering, as de Braun [19] and security engineering,
    as Anderson [21]. Safety, in particular, is usually only included in those publications
    specializing in that attribute, and these publications are likely to omit consideration
    of security, as in Herrmann [22].


    Similarly, there is usually little reference to relationships between software
    functionality and nonfunctional requirements in security-oriented publications,
    whereas safety attributes are considered to be tightly interrelated with software
    functionality. In Table 7.6, we show some of the most significant nonfunctional
    requirements that impact the security and safety of various software functions.


    Sometimes certain nonfunctional attributes, such as security-related authorization
    or encryption, are written into the functionality of the applications. While commonly
    done, a practice is suboptimal and can lead to errors and inappropriate use, as
    opposed to when nonfunctional services are isolated from functional applications.


