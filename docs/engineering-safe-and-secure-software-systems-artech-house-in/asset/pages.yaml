    # Vulnerabilities


    Figure 6.1 shows that some percentage of exploits is released into the wild or
    directed against specific targets or set of targets. However, successful attacks
    depend on vulnerabilities existing and being accessible or exploitable by the
    attacker. McGraw [13] defines a vulnerability as "an error that an attacker can
    exploit." McGraw goes on to state that vulnerabilities arise from defects, which
    are called bugs at the implementation level and flaws at the design level. However,
    should be noted that software may contain few, if any, defects, yet still be subject
    to compromise. For example, Professor El Felton and his team discovered by cooling
    down memory chips, data was retained beyond when the power to the chip was cut
    off, enabling researchers to pull information off the chip before it disappeared
    [24]. This example underlines the importance of context. It is not sufficient
    to build application products that are demonstrably free from defects; the software
    system needs to be immune from attacks against operating systems, and the logical
    and physical platforms which it might reside.


    Of course, known vulnerabilities can be fixed in many cases, usually by installing
