    A major contributing factor to deficiencies in software systems engineering appears
    to be the unwillingness or inability of specialists in one specific area (such
    as system engineers, software engineers, and hardware engineers) to communicate
    adequately. There is a particular need to improve communications between security
    and safety software systems engineers, as discussed in [8].


    This lack of communication causes subject-matter experts and decision-makers in
    each narrow area of specialization to be at risk of missing important information
    regarding system requirements and other factors from those with necessary expertise.
    This is particularly apparent during the critical requirements, validation and
    verification stages of the software, and hardware development life cycles. Such
    omissions—can—lead to many inferior decisions.


    Systems engineers dealing with entire systems seem to pay little attention to
    software considerations, as shown by the short treatment of software topics in
    many systems engineering books, publications, and presentations. Conversely, with
    their concentration on the development, operation, and maintenance of applications
    and system software, software engineers tend to pay insufficient attention to
    many of the broader considerations, including platforms and infrastructures upon
    which applications and software operate as well as the human-system interactions.
    As a result, software products often not exhibit the levels of confidentiality,
    integrity, availability, safety, interoperability, portability, scalability, resiliency,
    and recovery that should be incorporated into any critical system. This is mainly
    due to nonfunctional characteristics of applications, systems software, firmware,
    and hardware not having been adequately accounted for in the design and development,
    and particularly, the integration of these systems.


