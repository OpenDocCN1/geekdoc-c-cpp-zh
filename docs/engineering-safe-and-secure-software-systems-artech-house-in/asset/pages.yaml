    In a couple of articles, Jeff Lowder questions a traditional approach [10] that
    is commonly based on the equation:


    Risk = Threats × Vulnerabilities × Impact


    where the term *consequences* (or loss) is often substituted for the term *impact*.


    Lowder claims that such a formula is mathematically nonsensical and that should
    be discarded. He believes that the formula should be expressed as:


    Risk (Expected Loss) = Function (Threats, Vulnerabilities, Consequences)


    That is to say, the expected loss from an adverse security or safety event is
    a function of exploits, rather than specific mathematical relationship with the
    attacks. Threats, in Lowder''s presentation, are actual instances in which a threat
    has been realized as opposed to the possibility of an attack. The expected loss
    is further related to vulnerabilities that have not been mitigated and consequences
    in the event that an attack is successful. As Lowder correctly claims, the mathematical
    relationship is not multiplication, or is it simple addition. However, giving
    those who support this formula the benefit of the doubt, one might assume the
    use of addition and multiplication of the independent variables are not meant
    to be interpreted literally, but that they should only be used to show risk being
    dependent, in some fashion or other, on a series of specific independent variables.
    However, granting this assumption does not avoid the problem of the units of measure
    being inconsistent. Be that as it may, it makes much more sense and is also less
    confusing to be specific and rigorous in the use of terms, the expressing of relationships
    among variables, and the use of mathematical symbols.


    As a further example of the imprecise multiplicative approach to the risk calculation,
    Borg [9] defines risk as:


    Risk = Threat × Consequence × Vulnerability


    where the independent variables are defined as follows (emphasis added):


    +   * *Threat*: an estimate of the likelihood of a given type of security event
    in a time period.

    * *Consequence*: an estimate of the losses that could arise from the above security
    event.'
