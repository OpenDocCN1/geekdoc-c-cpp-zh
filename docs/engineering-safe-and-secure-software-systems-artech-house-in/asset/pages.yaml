  md: '# Engineering Software Systems 35


    In the first place, when we refer to software engineering, we likely mean the
    design, development, manufacture, and operation of products that are more extensive
    than mere standalone computer programs. We should use the term software systems
    engineering, because software programs, whether end-user applications, utilities,
    or systems software, do not and operate in isolation. Software programs exist
    within broader systems and are frequently able to run on specific platforms and
    within particular infrastructures. Software is only one component of an overall
    system comprising hardware, communications networks, people, and processes; but
    even the straightforward term software systems engineering remains somewhat ambiguous.
    When do we mean the engineering of software systems or systems engineering methods
    applied to software development, or should we be more explicit by expanding the
    expression to software engineering methods applied to software-intensive systems?


    While the reader might consider such a distinction to be overly specific and too
    exacting, it will show that many of today''s software issues, as they relate to
    ensuring software systems are safe, secure, resilient, interoperable, and the
    like, actually emanate from lack of rigor in defining terms. Defining all of the
    many characteristics of software is not an easy process, nor does the exercise
    guarantee that all outstanding issues will be resolved. However, we will demonstrate
    that some definitions in this area are often in conflict, and that conflicts result
    in researchers and practitioners frequently missing the point. We will, therefore,
    try to shed light on the murkiest areas by defining our terms as explicitly as
    possible.


    # What Is Software?


    Before we discuss the meaning of software engineering, we need to work on defining
    “software.” In simple terms, software consists of computer program code, usually
    written in high-level computer languages, such as C, C++, and Java. The resulting
    source code, of which software is comprised, is converted into code that is understood
    by computers by interpretation or compilation. Interpreters convert the source
    code into machine-readable code each time the software is run, whereas compilers
    produce machine-readable object code that is installed only once and is only recompiled
    if there is a change in the source code. Compiled programs tend to be more efficient,
    especially when there are few changes being made to the software relative to the
    frequency of operation. When efficiency is paramount, developers might write code
    directly in machine language and optimize the software''s run-time demands on
    system resources.'
