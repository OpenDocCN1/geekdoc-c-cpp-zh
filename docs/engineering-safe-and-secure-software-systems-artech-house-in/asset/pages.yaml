    # Summary and Conclusions


    We have considered a broad range of approaches to risk assessment and risk management,
    pointing out the deficiencies of some and expressing support for others. In general,
    the more simplistic approaches, which are based on point estimates (e.g., high,
    medium, low), or cardinal (e.g., 1 through10) measures, tend to be generally representative
    rather than precise measures; followers of these approaches are often encouraged
    to take the results as more accurate than the approach warrants. Risks should
    be determined using probability distributions estimates of the likelihood of occurrence
    and the magnitude of losses. If this is done, the calculation of risk is not simplistic,
    but requires the use of simulation techniques to obtain random samples from probability
    distributions of the independent variables (such as the likelihood of occurrence
    and magnitude of outcome) in order to arrive at the probability distribution of
    the dependent variable (i.e., risk). It should be noted, however, that the use
    of these techniques, the quality of the inputs, and the interpretation of the
    results all require a level of sophistication higher than that needed for the
    more simple methods.


    Not only must the analyst take a mathematical approach that is more complicated,
    but he or she must also account for the dynamics of the situation. When it comes
    to security and safety, the threats, exploits, and vulnerabilities are in a continual
    state of flux. Some factors are the result of changing technologies and technical
    environments that facilitate access to software systems over public networks,
    and enable those with a technical bent, who are not trained in security and safety
    and are not answerable to any corporate policies and standards, to develop heavily-used
    apps. Technology advances allow systems with different security and safety criteria
    to be combined into systems of systems and cyber-physical systems. Other influences
    include changing laws and regulations, particularly as they apply to personal
    data protection and the'
