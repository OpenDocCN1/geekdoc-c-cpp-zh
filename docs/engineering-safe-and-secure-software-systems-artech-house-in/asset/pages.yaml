  md: '# # 1


    # ## Introduction


    A paradigm shift is underway, and a number of recent threads point towards a fusion
    of security with software engineering, or at the very least to an influx of software
    engineering ideas.

    —Ross J. Anderson, Cambridge University, Why Cryptosystems Fail, 1993 [1]


    While the general concept of safety and reliability is understood by most parties,—Debra
    S. Hermann, Software Safety and Reliability [2]


    # ## Preamble


    Despite heroic efforts by security and safety software engineers, information
    and physical security professionals, and those involved with creating and deploying
    safe and secure software, software systems still succumb to willful and accidental
    attacks and are unable to avoid completely malicious or unintended damage to human
    life and the environment.


    One reason might be the shortage of subject-matter experts in in-depth knowledge
    and broad experience in application security, software system safety, software
    assurance, and related subjects. Even so, we must question why we aren’t doing
    a better job of building, operating, and maintaining safe and secure software-intensive
    systems. After all, there is a considerable body of knowledge, much of which will
    be discussed in this book, about building, deploying, operating, and maintaining
    safety-critical and security-critical software-intensive systems.


    These problems do not lie with lack of knowledge or ability on the part of experts;
    rather, they have to do with the omission of critical elements—not the'
  merge: -1
  pgno: 23
- img_proc: true
  md: 'least of which is communication among diverse stakeholders—which is needed
    for securing software systems and making them safe. Recommendations by researchers,
    particularly as they relate to information security and system safety, are often
    tentative and normative in nature and useless in the real world. In some cases,
    this is due to the lack of authority and power of those asserting the need for
    action to improve the safety and security of software systems. In other instances,
    researchers are unrealistic about the application of certain techniques, recommending
    activities that may be too difficult or expensive for the average development
    shop to implement.


    There is also a mind-numbing, and often misleading vocabulary that results from
    the art of creating safe and secure software systems sitting at the intersection
    of so many fields with stakeholders who do not communicate properly with one another.
    As a result, conversations and interactions among safety and security experts
    are frequently obscured and missed, and mutual agreement about the relative importance
    of security and safety for specific critical systems is seldom reached. This can
    produce systems where weaknesses of one segment are detrimental to otherwise high-integrity,
    high-assurance systems. This failure to communicate leads to critical systems
    that are vulnerable to attack and where successful attacks can result in considerable
    loss of assets or harm life and the environment.


    In this book, we shall look beyond the standard texts, although they will be referenced
    and studied extensively. Rather, we shall base our inquiries on the simple question:
    "What will it take to ensure that the software systems, upon our economic and
    physical lives depend, are trustworthy, dependable, and sustainable?


    Part of the answer will come from a rigorous examination of the terms and definitions
    that we use. For example, the words “security” and “safety” are commonly used
    interchangeably, but if examined more closely, their differences are the key to
    understanding how to create, safe, and dependable software-intensive systems.
    We have the lack of rigorous testing, needed to ensure that systems do not misbehave
    or allow manipulation that could lead to disastrous outcomes.


    It should be noted that even today there is little communication between security
    and safety silos involved in building complex security-critical and safety-critical
    intensive systems. This isolation leads to application software without reference
    to the platforms and infrastructures upon which it operates.


    Context is a key aspect of achieving security, safety, reliability, availability,
    integrity, resiliency, and like. A system has a very different set of demands
    if it is exposed to public communications networks such as the Internet, but if
    it is isolated from external networks; however, there are ways to bridge such
    an “air gap,” as demonstrated by the Stuxnet attack on the Iranian uranium processing
    plants.'
  merge: -1
  pgno: 24
