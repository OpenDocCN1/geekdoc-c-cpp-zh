  md: 'The Economics of Software Systems'' Safety and Security 229


    # Legislation


    Lawmakers have become highly sensitized to the threat of data breaches leading
    to identity theft because of the alarming number of breaches reported and the
    fact that many of their constituents have victims of identity theft and account
    takeover. In the United States, most of the states have enacted data privacy laws
    as of this writing, several Federal bills have been crafted in the U.S. Congress
    but none have actually passed into law.


    Laws can be a very effective means of motivation or deterrence in many slower-moving
    areas. However, the challenges of cybersecurity and system safety are so dynamic
    that it is difficult for even tech-savvy individuals to keep up with such rapid
    change, let alone members of Congress, many of whom do not have a good understanding
    of information technology and especially the security-related and safety-related
    consequences


    # Regulation


    Regulators translate laws into actionable directives and then ensure that the
    resulting regulations are being followed through various oversight, monitoring,
    and auditing methods. In the U.S. financial services industry, banks are regulated
    by a number of agencies, including the Federal Reserve Board and the Office of
    the Comptroller of the Currency (OCC), and securities firms and all public companies
    in the United States are regulated by the Securities and Exchange Commission.
    Some agencies have issued very detailed guidance in regard to application security,
    such as OCC Bulletin 2008-16, which includes many suggestions on how to achieve
    acceptable levels of application security [6].


    Many other industries, of which some are involved in developing and using both
    security-critical and safety-critical software systems, are regulated, such as
    the telecommunication industry that is regulated by the Federal Telecommunications
    Commission and the airline industry by the Federal Aviation Administration. These
    regulators often provide standards that must be met by aircraft manufacturers,
    vehicle manufacturers, nuclear power plant builders, and so on.


    # Standards and Certifications


    Not only must industry members comply with laws and regulations, they might need
    to achieve a predefined certification level in order to operate within that industry.
    Certifications are common when it comes to safety-critical software systems, which
    are usually in the form of industrial control systems that could cause loss of
    life or injury if they malfunction or fail. Obtaining certifications are a very
    strong motivator.'
