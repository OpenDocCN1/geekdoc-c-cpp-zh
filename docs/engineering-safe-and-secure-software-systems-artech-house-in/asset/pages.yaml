    # What Is Systems Engineering?


    At this point, we will tackle the seemingly task of defining systems engineering.
    There are many definitions of this term, each of which differs some from the other,
    sometimes minimally; in other cases, the differences are substantial.


    One widely-quoted definition of systems engineering is the one in the DoD text
    [11], namely:


    > ... an interdisciplinary engineering management process that evolves and verifies
    an integrated, life-cycle balanced set of systems that satisfy customer needs.


    An important aspect of this definition is that systems engineering is a process
    involving a variety of professional disciplines. The sole objective of the process
    is to create systems that meet users'' needs. The author does not argue with this
    definition, but will raise questions respect to the real-world implementation
    of the process. For example, are all necessary disciplines included at appropriate
    stages of the process? It will be asserted that they are not. Have the needs of
    customers or nonhuman users adequately identified? Will be claimed that users
    likely only express the functional requirements of which they are personally aware
    or that directly affect them, and that they omit a host of requirements that they
