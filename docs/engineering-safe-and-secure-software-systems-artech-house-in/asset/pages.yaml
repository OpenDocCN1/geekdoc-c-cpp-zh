- img_proc: true
  md: 'While common in industries operating safety-critical systems, certifications
    are few and far between when it comes to security-critical systems. The Payment
    Card Industry-Data Security Standard (PCI-DSS) provides application security guidance,
    but its jurisdiction is limited to issuers and processors of payment card information,
    such as data relating to credit, debit, and cash cards [7].


    It is to the detriment of many security-critical software systems standards and
    certifications, equivalent to those that apply to safety-critical systems, are
    not available to those developing, operating, and maintaining such security-critical
    systems.


    # Going Forward


    In order to deal with the shortfall in safety and security in software systems,
    it is necessary not only to implement the recommendations contained in this book
    but also to look to promising developments, some of which are in the research
    phase and those that have been implemented commercially. This is not to endorse
    any of these approaches but that, in addition to the synergies of transferring
    good practices between the software safety and security engineering disciplines,
    we need to look beyond what is currently done as there is clear room for improvement
    given many breaches, malfunctions, and failures that occur with regularity.


    Confirmation that there is a need for breakthrough approaches and technologies
    is readily apparent from the previously mentioned Broad Agency announcement (BAA)
    [8] issued in February 2012 by Defense Advanced Research Projects Agency (DARPA)
    with the title “High-Assurance Cyber Military Systems (HACMS).” It is noteworthy
    from the quotation below, which was taken directly from the BAA, that the definition
    of high-assurance cyber-physical systems includes requirements to satisfy satisfactorily
    “... safety and security properties” in addition to their being “functionally
    correct.


    The goal of the High-Assurance Cyber Military Systems (HACMS) program is to create
    technology for the construction of high-assurance, cyber-physical systems, where
    high assurance is defined to mean functionally correct and satisfying appropriate
    safety and security properties. Achieving this goal requires a fundamentally different
    approach from what the software community has taken to date. Consequently, HACMS
    will adopt a clean, formal methods-based approach that enables semi-automated
    code synthesis from executable, formal specifications. In addition to generating
    code, such a synthesizer will produce a machine-checkable proof that the generated
    code satisfies the functional specification as well as security and safety policies.'
