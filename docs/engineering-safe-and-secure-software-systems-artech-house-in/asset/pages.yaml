  md: '# Software System Security and Safety Metrics


    way from the metrics above. In fact, this definition does not require that metrics
    are input for decision-making and that the decisions should be actionable. If
    not actionable, then a “property becomes a measure, not a metric. On the other
    hand, all metrics are not actionable according to the common view, although it
    would be preferable if they did lead to positive action.


    Cruickshank [16] draws the following conclusions, which includes support for nonnumeric
    metrics with respect to software metrics:


    Software metrics are quantitative measurements of ... product (system or component),
    process, or event ... indicating the quality of a desired attribute. However,
    software metrics can be concerned with more than just quantitative measurements.
    Since we are measuring quality of product, process, and qualitative aspects must
    be considered. Metrics can also be qualitative in nature [emphasis added].


    On the other hand, McGraw [18] fares numerical representations of measures and
    metrics, “[m]e are numeric values assigned to a given artifact, software product,
    or process” and ... “[a] metric is a combination of two or more measures that
    together provide some business relevant meaning.” McGraw provides an example of
    a metric, namely, “the number of breaches per lines of code,” which represents
    a “security defect density.” as opposed to “the number of breaches,” which he
    defines as a measure. McGraw [18] echoes Cruickshank’s assertion [16] that metrics
    can be obtained for project, process, and product, and adds a fourth area—namely,
    organization. He also points out that processes and controls must be put in early
    in the development life cycle in order, although we will address the approach
    in terms of the application (or product) generating metrics rather than looking
    to the processes and controls.


    It is worth noting the tendency of security and safety professionals to have a
    very specific view of their areas of responsibility, combined with an underlying
    need to quantify metrics. These characteristics make for a strong bias towards
    quantitative measures, that is the numeric values of concrete, objective measures.
    The problem is that software-intensive systems are much less amenable to the application
    of precise measures. This means that the exercise to convert software measures
    to metrics for decision-making and action is often lacking. As a result, the wrong
    decisions are often made and inappropriate actions taken based on insufficient
    and misleading metrics. Because this focus on quantitative measurement and very
    specific decisions is part of the culture of an engineering background, it will
    likely take considerable time before researchers and practitioners evolve a broader
    view of software systems and define a full range of requirement to be met.'
