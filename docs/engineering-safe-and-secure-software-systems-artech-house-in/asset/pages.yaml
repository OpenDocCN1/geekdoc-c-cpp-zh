    # A Brief Note on Patterns


    The predominant issue, which comes from examining what is needed to build software
    systems that are both safe and secure, the need to communicate among the various
    stakeholders and interested parties across silos in order to have the desired
    attributes and characteristics added to systems during the early stages of the
    SDLC. While it might be helpful at some level to pronounce a normative approach,
    such as including all relevant stakeholders in meetings to discuss all the required
    and security attributes, that really does not address the question of which mechanisms
    are available and should be used to facilitate the transfer of information.


    In an attempt to address this issue researchers have developed the concept of
    "patterns" that can be used to convey to designers and developers the experience
    of those who addressed the same particular issues in the past. According to Schumacher
    [9], the interest in the use of patterns was created by Gamma [10] in 1995. The
    Schumacher book specifically addresses "security patterns," which are highly relevant
    to this book, and it is easy to see how this approach can be readily extended
    to cover other nonfunctional features such as safety, resilience, and the like.


    According to Schumacher, patterns have the following properties:


    +   - A pattern describes both a process and a thing—where the "thing" is a high-level
    design outline or detail of programming code, and the "process" is a set of instructions
    for creating the defined configuration effectively.

    - A pattern is a solution that is both proven and of high quality and resolves
    a given problem optimally.

    - A pattern supports both the understanding of a problem and its solution.

    - A pattern is generic—it does not describe a specific solution or arrangement
    of components.'
