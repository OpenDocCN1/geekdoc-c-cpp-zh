  md: '# Appendix D


    # 303


    According to the JSSC report [2], the requirements are based up experience of
    errors or omissions that resulted in mishaps or potential mishaps.


    When the above tasks have been completed, the project team should have a complete
    set of approved safety requirements for the proposed software system, along with
    formal approvals of the requirements, funding, and resourcelevels for the implementation
    of these requirements. The requirements are then used in the subsequent software
    system architecture and design phase, which is described in Table D.3.


    Once the safety architecture and design tasks have been accomplished, the results
    need to be incorporated into the application development process as indicated
    in Table D.4. As noted in Table D.3, it is important to secure the phases of the
    development life cycle for safety-critical software systems and to ensure appropriate
    security services, such as strong authentication, restrictive authorization, and
    strong encryption, are incorporated into safety-critical systems and that the
    monitoring, reporting of events, and incident response are built into safety-critical
    software systems even though they are not expected to be exposed to external attacks.


    Verification tasks are generally performed at each phase throughout the Safe SDLC,
    with validation conducted when the software has been developed, and certification
    applied for when the fully-integrated software system is finalized. These tasks
    are shown in Table D.5.


    It would appear that little attention is being paid to the deployment phase in
    many projects, yet this subjects the organization to potential risks, particularly
    if the deployment involves integration with other software systems that are not
    under the direct control of the deploying entity. A case in point is the faulty
    deployment of a mission-critical trading system on August 1, 2012 by the Knight
    Capital Group. The launch of the updated system resulted in a catastrophic malfunctioning
    and an immediate financial loss of $440 million [4]. While this example does not
    have direct implications, it is indicative of the type of disaster that can occur
    during the deployment phase, and it provides strong evidence that supports paying
    full attention during this critical phase.


    There are two types of safety risk during deployment. One is that the deployment
    process might be deficient in it does not adequately check that all the modules
    are being installed and that no superfluous modules remain in the software system.
    The other relates to intrinsic problems within the software itself due to causes
    which are inadequate requirements, specifications, and testing in the context
    into which the software is released.


    The task areas relating to the deployment of safety-critical software systems
    are described in Table D.6.'
