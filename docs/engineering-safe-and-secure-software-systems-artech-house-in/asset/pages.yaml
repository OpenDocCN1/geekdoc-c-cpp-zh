  md: '# Engineering Safe and Secure Software Systems


    failures have a much greater impact than previously on our personal lives and
    the health of the economy.


    The gap certainly appears to be growing between the complexity of and dependency
    on software-intensive systems, and our ability to ensure that such systems are
    safe and secure enough to prevent humans from being harmed and to protect information
    assets from unauthorized access and from misuse. This situation does not bode
    well for a future where the gap continues to widen, happens exponentially. Until
    and unless software professionals in particular and society in general make enormous
    progress narrowing that gap and eventually eliminating it, we will not have sufficient
    systems to stop catastrophic failures.


    One of the most dramatic examples to date the failure of a computerized system
    occurred on June 19, 2012, when the Ulster Bank''s automated processing system,
    which usually handles 20 million transactions per day, suffered a catastrophic
    failure. The outage prevented access to and destroyed the integrity of the bank
    accounts of more than 100,000 customers. A month later, many of the problems that
    resulted from the initial system failure remained unresolved. The ultimate direct
    cost of this incident will likely be in the tens of millions of Euros (if not
    greater), if the consequential costs of loss of trust in the dependency of the
    computer systems and the impact on the banks reputation are included [4].


    The main goal of this book is to raise awareness of the dangers that we are currently
    experiencing and that lie ahead. These dangers may result from inadequate experiencing
    systems engineering, particularly as it relates to safety and security. Such threats
    will have much greater impact if we are not both willing and to make rapid and
    significant improvements in the processes and procedures used for building security,
    safety, and other nonfunctional attributes (such as resiliency) into software-intensive
    systems. For the effort to be effective, we need to see major increases in the
    number of subject-matter experts who take over the responsibility of ensuring
    the safety and security of critical software-intensive systems.


    Another goal of this book is to guide those who recognize the vastness and importance
    of the problem towards meaningful ways of achieving greater assurance that systems
    will not cause physical harm (safety) and will protect the information that we
    value (security).


    In this chapter, we trace the history of today''s safety crisis in perspectives,
    to explain why we find ourselves in the dilemma of recognizing what it will take
    to establish acceptable levels of security, and having to accept, albeit very
    reluctantly, the limits of safety and our ability to make decision-makers to make
    available the required resources to achieve such levels.'
