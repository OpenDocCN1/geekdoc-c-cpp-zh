    # Purposes


    To determine activities that might impact the security of systems so that appropriate
    controls can be put in place

    To address significant vulnerabilities by eliminating them or bypassing them,
    or by implementing protective controls

    To design the proposed system to be as extensible as needed to incorporate historical
    data from legacy systems, such as required for future requirements

    To ensure that the new system will operate in the expected context and that it
    will meet operational requirements.

    To understand deficiencies in the current security program in order to address
    them separately or via a system-level security architecture.


    To generate a full set of requirements in order to confirm that the scope and
    design of the system meets the security requirements, and if not, to develop mitigation
    strategies.

    To ensure that the older and new systems are interconnected.'
