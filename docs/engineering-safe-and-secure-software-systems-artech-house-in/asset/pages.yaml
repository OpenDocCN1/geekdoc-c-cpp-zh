    # Introduction


    One aspect that is common to the majority of published approaches to software
    system development is which need to be incorporated into the basic set of process
    areas common to software development frameworks. This deficiency appears to be
    virtually universal and is made well apparent by creating safety and security
    extensions to the basic processes.


