  md: '# Appendix D


    Once the software system has been deployed, there are ongoing operational, maintenance,
    and support functions that are required to keep the system running in a safe manner,
    as described in Table D.7.


    As long as there are few changes to the system and its environment, it can be
    expected that the system will remain relatively stable over long periods of time.
    Any changes can adversely affect safety, and so it is appropriate to conduct periodic
    safety reviews that will consider the safety impact of any changes. However, in
    many cases, the significant period begins when there is an impetus to close down
    the system, whether such pressure to change systems is internally or externally
    initiated. For example, at some point, safety-critical systems will become obsolete
    and need to be replaced in the relatively near future, 18 months to two years.
    This will result in the need to continue the current system and dispose of any
    traces of the applications. For safety-critical systems, it is very important
    that the disposal of the system being replaced is done in a safe and secure way.
    The tasks relating to this decommissioning and disposal phase are described in
    Table D.8.


    # Levels of Involvement


    In Table D.9, we show the overall involvement of the various groups and teams
    in the safety aspects of the life cycle. The entries in this table are normative.
    As expected, the main participants are the safety, security and audit team members,
    with the other areas generally moderately involved. This differs from Table C.17
    in Appendix C, mainly with respect to Table D.9 showing relatively lower involvement
    of the application development and infrastructure teams and business managers
    for safety-critical systems. This is attributable to safety being more oriented
    towards the physical world, resulting in somewhat less involvement by the more
    technical teams.


    # A Note on Sources


    The tables in this appendix were developed in large part from the JSSC report
    [2]. The structure and many of the entries in the tables were derived from McBride
    [5], as was the case for Appendix C. However, as in Appendix C, the phases relating
    to risk analysis and control, decommissioning, and disposal were added.'
  merge: -1
