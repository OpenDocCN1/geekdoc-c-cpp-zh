- img_proc: true
  md: '198 Engineering Safe and Secure Software Systems


    A similar, though not devastating, situation, which was not reported but came
    from a reliable source, arose in a building during a Y2K test of the building
    entry system. A high-security building had an extremely effective system that
    locked down crash-proof doors and windows. During the test, the system failed
    and doors and windows closed, preventing anyone from entering or exiting the facility.
    Engineers were unable to reset the system and open the doors and windows, which
    were so hardened that rescuers had to bulldoze a hole in a wall in order to gain
    entry and helped the trapped workers to get out of the building. The trade-off
    here was protecting the building against intruders and allowing those within the
    building to escape. It might have been the case that, under normal operating conditions,
    the system would have allowed the workers to get out of the building, as in the
    case of a fire, but that in its failed state it was not able to release the doors
    and windows. Clearly, the failure that occurred during Y2K testing had not been
    anticipated.


    The above is summarized in Table 10.1, which is similar to Table 9.1, except that
    the entries of the table are from the subjective perspective of a system safety
    engineer rather than a system security engineer.

    Table 10.1 shows some awareness by software safety engineers of the need for security,
    but not as great a commitment to secure attributes as a software security engineer
    might have. When it comes to combined securitycriticality and safety-criticality,
    software safety engineers will undoubtedly show a bias in favor of safety aspects.


    # Hazard Analysis


    The fundamental characteristic of safe software systems, as we have discussed,
    is that such systems should not do harm to humans or the environment as a result
    of their specified functioning, malfunctioning, or failure. As a result, it is
    wise to perform a risk analysis of the impact of various hazards to which a safetycritical
    system might be vulnerable.


    An excellent overview of the common approaches to hazard analysis is given in
    the report from the Joint Software System Safety Committee [6].


    Table 10.1

    Safety and Security Attributes vs. Safety and Security Functions


    | Attributes | Safety | Security | Combined Safety and Security |

    | Secure | Medium | Medium to high | Medium |

    | Safe | Very high | Medium to low | Very high |

    | Safe and Secure | Very high | Medium to high | Very high |'
