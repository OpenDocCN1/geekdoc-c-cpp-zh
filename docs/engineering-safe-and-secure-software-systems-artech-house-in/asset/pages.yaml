  md: 'the manufacturer of a defective system, additional burdensome regulatory and
    audit requirements, and loss of business.


    One needs to include a full range of representatives of key areas after a concept
    is originated and became a result of ideas from internal business and technical
    staff, or senior management and/or marketing may become aware of new technologies
    and competitors'' systems, legal and regulatory requirements, obsolescence of
