  md: '# 6


    # Software Systems Security and Safety Risk


    > If you don''t attack the risks, they will actively attack you. The real professional
    is one who knows the risks, their degree, their causes, and the action necessary
    to counter them, and shares this knowledge with his colleagues and clients.

    —Thomas Gilb, Principles of Software Engineering Management [1]


    # Introduction


    The word “risk” likely means something different to each and every one of us,
    judging from the many debates that arise when the topic is raised. Some well-respected
    researchers look to adopt simplified methods for assessing and managing risks,
    some think that the determination of risk is complex and requires advanced probability
    theory, and yet others believe that the whole effort should be discounted because
    it is impossible to come up with accurate estimates of losses and probabilities
    of those losses occurring.


    What many researchers and writers on the topic of risk appear to miss is that
    the assessment of risk can be a very personal process. Risk mitigation may be
    done largely to reduce negative outcomes that affect individuals directly, even
    if someone is supposedly assessing risks that may be assignable to someone else
    or to other groups or organizations. There is a question as to the degree to which
    someone can be objective enough to assess another person’s (or another entity’s)
    risks. Clearly, actuaries are tasked with doing that job for their insurance company
    employers, but even then, they might be motivated, likely unconsciously, to bias
    estimates to favor their own careers. For,'
  merge: -1
  pgno: 121
- img_proc: true
  md: 'if actuaries are conservative, payouts for losses will be less relative to
    premiums, but relatively high premiums will deter customers; if they are overly
    optimistic about catastrophic events not happening, the company could see large
    reductions in profits.


    In this chapter, we examine the risk assessment and management processes, taking
    into account the many definitions and models that are offered. We also look at
    the motivations of risk assessors and how those motivations might affect the resulting
    analysis, and further how they influence risk management more broadly. It will
    be shown that many assertions about risk miss the point entirely, which serves
    to explain the increasing number of inappropriate risk assessments and poor decisions
    which we have seen play out in recent years.


    # Understanding Risk


    One might think from the seemingly knowledgeable manner in which self-appointed
    authorities discuss risk, that they thoroughly understand the concept and how
    to apply it. Results suggest otherwise, particularly when you consider the recent
    man-made catastrophes in the financial and nuclear-power worlds.


    Risk determination and analysis have taken a number of negative hits of late,
    particularly with respect to forecasting the global financial meltdown in 2008,
    or predicting that a tsunami hitting northeastern Japan would not exceed a certain
    height, as it did on March 11, 2011, or anticipate that the Arab Spring would
    take place and spread in the manner that it has. The common thread of these events,
    and many other similar incidents, is that forcasts with respect to the likelihood
    of specific events, particularly catastrophic events, are often wildly off the
    mark. This is not meant so much as a criticism of our ability to predict the unpredictable
    as it is of recognizing that infrequent catastrophic events is virtually impossible.
    For catastrophes, the best approach might be to implement some broad-based monitoring,
    protective, and response measures that cover an extensive range of potential events,
    in the hope that the preparation will somewhat soften the blow and provide timelier
    and more effective responses.


    # Risks of Determining Risk


    Risk is associated with taking chances; we take chances when outcomes of decisions
    or actions are not known in advance with certainty. This is the situation in which
    we find ourselves most of the time. Often the downside of decisions, which prove
    to be wrong or less than satisfactory, is not particularly damaging. For example,
    you may select a menu item in a restaurant and then notice that'
  merge: -1
  pgno: 122
- img_proc: true
  md: '# Software Systems Security and Safety Risk


    someone else has ordered a dish that you would have preferred. In this case, you
    can usually return to the restaurant at a later date and order the coveted dish
    for yourself. However, on other occasions, a bad decision can be disastrous and
    there may be no opportunity to recover losses, unless the risk was transferred
    through insurance or other means. An example of this might be an explicit decision
    to build a house in a flood plain and take out flood insurance (assuming insurance
    coverage is available for the contemplated location).


    While there are opportunities to insure against attacks in cyberspace, insurance
    can be difficult to come because the applicant must demonstrate a strong security
    posture in advance for the writer to be comfortable enough with the level of risks
    to issue a policy and determine a reasonable premium to charge. One consideration
    when evaluating a company for cybersecurity insurance is how the company builds
    and/ acquires safety-critical and security-critical software systems. It should
    be noted, that purveyors of software products generally assume no liability for
    vulnerabilities that might reside within the software. Most, acquirers of third-party
    software are contractually responsible for installing and operating the software
    correctly and assuming any losses that might occur through the use or misuse of
    the particular software product. Independent software vendors (ISVs) will typically
    only offer to refund the cost of the software product and will not assume any
    liabilities.


    # Software-Related Risks


    The quest to manage certain software-related risks was actively pursued in the
    1980s. Dr. Barry W. Boehm, who is well-known for his definitive work on the software
    engineering process and famous for the spiral model [2], edited a pioneering collection
    of papers on software risk management [3]. At that time, researchers such as who
    wrote in Boehm [3] did not agonize over the precision of risk—their risk focused
    on the software systems design and development processes and their associated
    uncertainties. The challenge then was to minimize uncertainties related to software
    development processes, rather than to protect against potential attacks on, or
    damage from, software systems after they have been developed and deployed. Did
    not examine, at that time, the risk of malicious developers, who might introduce
    destructive code into the software. Interestingly, even today the prospect of
    such threats is generally not considered, despite there very significant risks
    associated with such activities.


    During the computer program remediation effort to correct the Year 2000 problem
    of misinterpreting the year in date fields, large quantities of program source
    code were shipped to outsourcers, many of them offshore and in'
  merge: -1
  pgno: 123
- img_proc: true
  md: 'Asia, Eastern Europe, and Ireland. There was considerable apprehension among
    information security professionals that such third-party contractors would introduce
    "back doors" that is, computer-program code that would allow them to get into
    the software system at a later date and compromise the system in some manner or
    other for personal gain. There is little evidence that this type of crime has
    been frequently peppered, although the likelihood of such an approach was thought
    to be enough to voice concern publicly [4].


    In the ensuing decades, the role of software-intensive systems has become increasingly
    critical as such systems are being deployed into practically every area of human
    endeavor. Furthermore, the orientation of software-based systems has also become,
    fueled by rapidly falling costs of electronics, leading to much cheaper systems
    and networks. There is also a burgeoning population of geographically dispersed
    developers, particularly in Asia, Eastern European, and South American countries,
    as well as in Russia.


    The ubiquity of software products (apps), which are being created by hundreds
    of developers for Apple, Google, Facebook, and other platforms, has deserved security,
    privacy, and safety issues throughout. In previous chapters, we made a clear distinction
    between safety and security as the terms might be applied to software systems.
    To make matters even more complicated, the term privacy is also frequently subject
    to varying interpretations. Privacy involves the legal and social rights of individuals,
    with the implementation of security measures being one of the ways to implement
    privacy directives. Major security and privacy issues arise from applications
    software that is built by contractors for mobile devices, such as smartphones
    [5]. As smartphones and similar mobile devices are increasingly used to control
    physical systems, such as monitoring our home, we are seeing safety issues coming
    to the fore [6].


    These changes in the way in which commonly-used applications are developed, distributed,
    and used has meant that oversight and controls regarding such development have
    become more difficult to enforce, if it is possible. Software-intensive systems
    produced in this environment are much more likely to contain vulnerabilities and
    hence are easier to compromise. Consequently, while the pioneering work of the
    1980s provides a good basis for mitigating risks stemming from the software system
    design and development processes themselves, they do not account for the large
    number of exploits that the Internet, mobile computing, and other innovations
    have brought. Did the early researchers anticipate the immense proliferation across
    the world of the development of software applications by individuals or small
    groups not subject to the discipline, oversight, and controls that can be expected
    from large software manufacturers. While some platform providers, such as Apple
    Inc., have in place some level of screening apps before they are made available
    to the public; such screening is mostly'
  merge: -1
  pgno: 124
- img_proc: true
  md: '# Software Systems Security and Safety Risk 103


    done to ensure that apps function correctly and do not contain malicious code
    or malware. This form of screening is less thorough than it comes to consideration,
    privacy, and safety consequences that might result from the large-scale deployment
    of these apps, which are typically used (and abused) by huge online populations
    that generate millions of users per day.


    # Motivations for Risk Mitigation


    A strong motivator for incorporating safety and security requirements into software
    systems is the identification, assessment, and mitigation of risks. In virtually
    all, a trade-off must be made between the quality of software (where quality comprises
    security, safety, integrity, resiliency and the like) and the time and effort
    that might be needed to get the software systems out the door within acceptable
    timeframes. The trade-off is more apparent for critical systems than it is for
    safety-critical systems; this is in large part due to the far greater consequences
    of a failure in safety-critical systems (such as control systems for avionics,
    transportation, electricity grids, rails, space shuttles, and nuclear power plants),
    and a failure of information systems operated by banks, stock exchanges, payment
    card processors, and the like. It is perhaps due to this conflict in risks and
    goals that defective software systems created, delivered, and operated, and many
    software development projects are abandoned even before going into production.
    Of course, the press tends to report mostly data breaches and project failures.
    Understandably, the media do not report that software systems have been operating
    well and without incident and that they have met their expected performance requirements
    since this is not considered newsw, although given the complexities and challenges
    involved, it is a major achievement. Similarly, bringing in software development
    projects on time, budget, and meeting all requirements where these projects include
    the needs for security, safety, dependability, performance, availability, integrity,
    and resiliency are not commonly reported, although they do appear in publications
    from time to time.


    Even though they are considered noteworthy, only a very small percentage of data
