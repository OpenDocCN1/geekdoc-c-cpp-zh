    # Game-Changing and Clean-Slate Approaches


    In many situations, there is a need to develop software assurance methods to enable
    the state of the art to accelerate at a rate that is much faster than the speed
    of functional innovation. That is to say, the rise in software complexity and
    criticality far exceeds our ability to test the software effectively, especially
    when diverse components are bound together to form systems of systems or cyber-physical
    systems.


    The common response to this problem is to look for opportunities to build security
    and safety measures into systems throughout their development life cycles, especially
    during the earlier phases. While such an approach has a good chance of improving
    the quality of future systems in terms of security and safety, it does little
    or nothing to enhance existing systems. This is because of the much greater effort
    required for testing so-called legacy software and the orders of magnitude higher
    costs of retrofitting fixes (or patches) and reprogramming and retesting in-place
    production systems.


