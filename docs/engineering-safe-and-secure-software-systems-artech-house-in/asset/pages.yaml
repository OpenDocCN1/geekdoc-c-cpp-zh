    be viewed as necessary to follow, but they are not sufficient for ensuring a high-level
    of security or safety. Who is to say that the eleventh and twelfth ranking vulnerabilities
    are not extremely important though they didn''t make the top 10 or 25? To their
    credit, CWE/ANS publication (wherein their lists are described in detail) guides
    readers to an “Cusp” page, which gives an additional sixteen weaknesses that did
    not fall into the top 25. On the other hand OWASP continues to limit its list
    to 10 items, although they do warn not to limit themselves to the 10 risks listed
    but to read various OWASP online documents to learn the hundreds of issues that
    affect overall security.


    # The OWASP Top Security Risks


    OWASP began publishing “top 10” lists in 2003. In the early versions, the list
    consisted of attacks, vulnerabilities, and countermeasures. In 2007, the focus
    was entirely on vulnerabilities, and in 2010, the list contained security risks
    Figure A.2 shows how the 10 examples in the list changed from 2003 to 2010. Five
    items, representing half of the total, were dropped during the 2003-2010 period.
    For many of the remaining items, their rankings changed between one version and
    the next. Sometimes these changes were quite significant; for example, the category
    “broken authentication and session managment” jumped from seventh position in
    2007 to third position in 2010.


    Judging from past trends, a new version of the OWASP Top Ten might be expected
    to appear in the 2013 timeframe, although such timing has not been announced by
    OWASP.


    The OWASP Top 10 has received a great deal of attention from information security
    professionals, even to the extent that regulators and oversight entities have
    suggested that the OWASP Top 10 should be a requirement for compliance [5].


    In Table A.1, we list the 2010 Top 10 web application risks. In the table, the
    occurrence of the item is explained and the potential impact is for each of the
    security risks. OWASP published a report with the title OWASP Top Ten—2010: The
    Ten Most Critical Web Application Security Risks, which is available online [6].
    The report describes each of the ten security risks in detail.


    For each item, the OWASP report lists the following:


    +   * Threat agents;'
