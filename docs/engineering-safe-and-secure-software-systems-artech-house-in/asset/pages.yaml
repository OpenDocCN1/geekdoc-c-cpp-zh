    # Ranking Errors, Vulnerabilities, and Risks


    There are two schools of thought when it comes to publishing the riskiest violations
    and the most dangerous programming errors relating to information security. One
    group claims that by knowing where the greatest vulnerabilities lie, software-system
    designers and architects will account for them in their designs, and developers
    will avoid writing programming code that would expose their applications to these
    weaknesses. In addition, testers and auditors have checklists against which they
    can ascertain that the programs do not violate the most egregious risk attributes.


