    # Introduction


    We have discussed previously how the practice of software engineering appears
    to be inadequate in the face of increasing security, safety, and other so-called
    nonfunctional requirements, such as dependability, performance, and resilien-cy.
    It is indeed disconcerting to read frequent articles by Zelkowitz [1] and Par-nas
    [2, 3], who have been working in the field of software engineering for four five
    decades, in which these pioneers in the field complain about the lack of progress
    that has been made in the software engineering space. The shortfall is particularly
    noticeable as it relates to safe and secure systems. It is these latter systems
    that are the focus of this chapter.


    The situation is more disturbing when one considers that software-intensive systems
    are becoming more complicated and difficult to manage, espe-cially with diverse
    systems increasingly being combined into systems of systems and cyber-physical
    systems. This software-system revolution is making much greater demands than before
    on engineers, as they are required to broaden the scope of their knowledge and
    professional efforts if they are to stand a chance of addressing the complexity
    and diversity of new systems. Furthermore, society is becoming so much more dependent
    on software systems, and as relate, system'
