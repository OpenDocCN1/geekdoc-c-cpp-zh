    # Deconstructing Systems Engineering


    The field of engineering has clearly had, and continues to enjoy, a very long
    and auspicious history that goes back over millennia. There is no question that
    the building of the Egyptian pyramids, the English Stonehenge, the Easter Island
    statues, the Mayan pyramids at Itchenza, Mexico, and other marvelous ancient constructions
    were amazing feats of engineering. Did projects follow what we would now consider
    to be a systems engineering approach? The builders of these monuments must have
    adopted some organizational structure and management processes in order to accomplish
    what they did. Archeologists have discovered highly sophisticated mathematical,
    architectural, and construction methods in documents used by engineers of these
    ancient monuments. However, the processes would not have followed the specific
    precepts of what we now call systems engineering in a formal manner, although
    many of the components must have been utilized in order to accomplish these great
    works.


    In modern times, the specific terminology for the discipline of systems engineering
    has only been in common use for a relatively short 70 years or so, although various
    documents attribute the creation of the term to different parties and at different
    times. Christensen and Thayer [10] quote Alberts [14], who asserted that the term
    was originated by a certain H. C. Hitch at Penn State University in 1956 [15].


    The INCOSE website claims that systems engineering was coined by researchers at
    Bell Telephone Laboratories in the 1940s [16]. The INCOSE document [7] provides
    a timeline going back to the development of the Rocket'
  merge: -1
  pgno: 38
- img_proc: true
  md: '# Engineering Systems 17


    locomotive by Robert Stephenson and Company in the 1820s, and includes a British
    team that analyzed the United Kingdom''s air defense system in 1937. The INCOSE
    timeline also includes Bell Labs during 1939–1945, which agrees with the above
    claim. INCOSE attributes the invention of systems analysis to the RAND Corporation
    in 1956, which appears to differ from the Christensen and Thayer claim (with respect
    to whom it originated). However, both agree that the team originated in 1956.
    It is sufficiently accurate for our purposes—given the discrepancies in the literature—to
    state that systems engineering and systems analysis as we know now originated
    in the mid-twentieth century and evolved through the latter half of century.


    A broad consensus has that the discipline of systems engineering was driven in
    the 1940s and 1950s by the need to manage large, complex projects involving systems
    of systems, in which the properties of the sum of the parts were often greater
    than the properties of the individual parts [17]. Much of the motivation for the
    developing of systems engineering came from the requirements of the U.S. Department
    of Defense [11] and the National Aeronautics and Space Administration (NASA) [9].
    We will, therefore, lean heavily on the works of these and other U.S. government
    agencies, as well as the publications of professional associations, such as the
    IEEE (Institute of Electrical and Electronics Engineers) [9] and INCOSE (International
    Council on Systems Engineering) [7], in our discussion of the attributes of systems
    engineering.


    Today, there are many researchers and practitioners who are proud to number themselves
    among the ranks of systems engineers. Professional organizations, such as INCOSE
    and IEEE, which are highly regarded and which produce impressive lists of publications
    and other valuable resources, have sprung up and prospered in response to the
    evolution of the field.


    However, as discussed above, there appears to be a substantial gap between how
    software engineers view themselves with respect to systems engineering and how
    systems engineers integrate systems engineering into their practices more extensively.
    This will be discussed in the following chapters. It is not that software developers
    do follow structured practices equivalent to systems engineering guidelines—for
    the most part they do—particularly in the U.S. Department of Defense, where precise
    and detailed software development practices have evolved, as described in [11].
    It is not that adoption of the formal processes of systems engineering is not
    generally accepted in what are considered related, but distinct, relating to software,
    safety, and security. For example, the system development life cycle (SDLC) has
    indeed been enthusiastically adopted by many modern software development shops,
    but is not usually embraced by smaller, less mature organizations because so introduces
    considerable overhead.'
