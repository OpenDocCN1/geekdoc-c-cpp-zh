  md: 'some has broken in. The recipient may have some claim on the sender or issuer
    of the product, but that is about the limit.


    In other cases, the owner of a package or a piece of luggage, say, may have to
    allow some known authority, such as the Transportation Security Administration
    (TSA), but only that authority, to access the contents. Special paddocks have
    been designed to permit access by TSA representatives and show whether the package
    has been opened by someone with a TSA standard key.


    # Tamper Resistance


    Tamper resistance is a different concept. In the physical world, these funny little
    screw heads, come to mind. They allow someone to turn the screw in a clockwise
    direction with a regular screwdriver but will not allow counterclockwise unscrewing
    to mind. There are quite a few approaches in the physical world. Comparable systems
    for software might also exist, if they do, they are not wellknown. In any event,
    with effort that is likely to be destructive, such as drilling out the screws,
    the protective method can be bypassed. This is good for some interested in getting
    at the innards of the device and not worried about whether such intrusion can
    be detected by intended users.


    Tamper resistance works to deter or discourage the amateur thief but can be broken
    by professionals with the appropriate skills and tools. Depending on the value
    of the assets being protected, such tamper resistance might be well adequate,
    but many not meet requirements for protecting highly sensitive data or classified
    equipment.


    # Tamperproofing


    Tamperproofing is different from the other methods. Here, attackers are usually
    not hampered in their attempts to gain access to a working version of the hardware
    or software being protected but the hardware or software may self-destruct. There
    are two flavors of tamperproofing. In the physical world in particular, attempts
    to break the item will result in the immediate destruction of whatever is contained
    within the tamperproof container. The destruction might be through shorting and
    burning out of circuitry and wiping out of any software and firmware contained
    therein, or the destruction can be more aggressive, and the unit can be made to
    explode—but in such a situation the risk of collateral damage and injury to bystanders
    needs to be considered.


    From a software perspective, there are methods and products that can prevent anyone
    from accessing and modifying software. Since it is readily apparent that few,
    if any, software systems can be fully protected from attack and that deterrence
    is seldom effective, we''re left with avoidance. Avoidance is not about making
    the assets available to a potential attacker. This is acceptable in'
