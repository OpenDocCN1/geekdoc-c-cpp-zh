    # Risk Metrics


    There is surprisingly little agreement as to which metrics should be used. It
    is particularly true of risk-related metrics for security-critical and safety-critical
    systems. It should be noted that there does not seem to be anywhere the same level
    of confusion and debate when it comes to metrics relating to the operation of
    safety-critical systems, probably because the latter are more ingrained in the
    physical world, where metrics are often easier to come by and interpret for the
    more abstract world of software. Crucialshank [16] points out that metrics relating
    to the development process for safety-critical software systems are also lacking,
    particularly with respect to the validation process. These differences are shown
