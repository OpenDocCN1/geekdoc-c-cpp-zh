    behavior of stakeholders, as we do in later this chapter. Also, the combination
    or aggregation of different types of risk (or the same risk assessed by different
    individuals or groups) is not straightforward, particularly when one includes
    probability distributions that are usually more appropriate, though more difficult
    to collect, than single point values.


    Many approaches to risk assessment require only point estimates of the loss due
    to incident. However, such factors are more accurately expressed as probability
    distributions. For example, the loss might follow a normal or lognormal probability
    distribution with mean μ and standard deviation σ. While it is difficult enough
    for assessors to come up with point values, it is considerably more demanding
    for those doing the estimating to come with distributions for particular variables.
    Furthermore, while estimates of point values for variables will vary among individuals,
    requests for probability distributions of these values will add significantly
    to the data-collection process, and the results from such requests are much more
    difficult to reconcile, analyze, and aggregate.


    Typically, we have to consider trade-offs among more realistic models, the cost
    of collecting and analyzing the more complex data, and the impact that more detailed
    models will have on. If decisions are not improved by adding this layer of complexity,
    then requiring the probability distributions may not be worthwhile. However, if
    there is expected to be a significant improvement in decision-making, and if it
    is likely that the more complex approach will lead to better decisions, where
    better means reducing risk significantly, then it might make sense to put in the
    extra effort.


