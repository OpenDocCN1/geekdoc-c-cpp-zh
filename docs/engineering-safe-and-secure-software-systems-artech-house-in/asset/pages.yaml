  md: 'SafSec Methodology: Standard [11] and the SafSec Methodology: Guidance Material
    [12] are available for download from the Altran Praxis website. SafSec Methodology:
    Standard [11] includes a good set of definitions of terms used. It is apparent
    from the SafSec methodology that security and safety are considered to be contributors
    to a system''s dependability.


    This definition of dependability as having security and safety components is used
    by Firesmith [13]. While such a definition is reasonable, the concept of dependability
    is considered too broad for detailed examination, which is why we treat safety
    and security as separate, specific attributes of software systems. Indeed, dependability
    includes other important attributes relating to reliability, resiliency and survivability,
    but these represent areas of study that require dedicated research and exposition.
    Consequently, we shall leave these latter issues for others to follow up on.


    # Summary and Conclusions


    We have seen in this chapter that those who design and develop software systems
    have a very different perspective in regard to the various phases of the SSDLC.


    Software engineers focus on the risks of their systems doing harm if they were
    to fail or malfunction and are less concerned about someone stealing information
    or gaining control of the system. However, as we see increasing numbers of complex
    cyber-physical systems, it is clear that these same software engineers need to
    be aware of the dangers of attacks from outside or within, since it is not just
    a matter of protecting information, but also covers concerns about an attacker
    gaining control of safety-critical systems and forcing it to malfunction, fail,
    or behave in undesirable and dangerous ways.


    The viewpoints of software engineers and safety engineers towards the design and
    development of software systems are so divergent that one might question whether
    individuals, upon whom our lives and livelihoods depend so much, will even collaborate
    to the degree necessary to ensure that modern systems of systems meet prudent
    and safety requirements. Even those who are promoting collaboration between software
    safety and security engineers, such as the proponents of SafSec, are not hopeful
    that such partnerships will ever come together. However, commonality of purpose
    is inevitable, except that it is likely to take many years to come to fruition.


    It is only through continuously driving home the point that safety and security
    are different animals but that will have to live together in'
