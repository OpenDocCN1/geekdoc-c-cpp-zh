  md: '# Software System Security and Safety Metrics


    arrange to create, collect, and analyze the data needed to produce meaningful
    metrics. The resulting risk analyses can be used to determine what actions needs
    to be taken in preparation for and in the wake of an attack or data breach.


    This is not a trivial effort, as the most useful metrics for risk identification,
    assessment, and management are often more difficult to collect and interpret metrics
    of lesser value. Post-processing the metrics in order to arrive at aggregated
    values is also a challenge. Often, respondents need to be trained on how to answer
    surveys, and analysts need to understand the consequences of threats, exploits,
    and vulnerabilities and be able to produce results and recommendations in sufficient
    time to mitigate actions.


    It also seems that metrics appropriate for security-critical software systems
    are not particularly useful for safety-critical software systems, and vice versa.
    Yet there is a need to exchange methods and procedures between security and safety
    silos, particularly as the trend is to combine security-critical and safety-critical
    systems into complex systems of systems and cyber-physical systems, which must
    demonstrate the ability to maintain a strong security posture and, at the same
    time, exhibit safety characteristics.


    The basic recommendation here is to understand the strengths and weaknesses of
    various types of measurements and metrics so that one can determine the best data
    to collect in order to perform risk analyses that will lead to appropriate mitigation.


