  md: '# Engineering Systems


    The answer to the question of what needs to be done is fairly obvious: we need
    to ensure that the supporters of nonfunctional capabilities, such as security
    professionals, are involved at the beginning of the decision process and throughout
    the development life cycle of software-intensive systems. The challenge is not
    to determine what should be done—that has already been established—but how to
    get it. With all the forces of time to manage, cost savings, competitive advantage,
    budget constraints, complex functionality, and the like, working against the goal
    of safer and more secure software systems, it is unlikely that needed changes
    will happen of their own accord. There need to be incentives for those making
    a radical change in approach, or disincentives for those not adhering to a mandate
    to change the approach to engineering safe and secure software-intensive systems.


    # Deficient Definitions


    A significant detract to solving the problem of attaining the needed level of
    proficiency in systems engineering, particularly with regard to software systems
    engineering, lies in the ambiguity of language used and the relative looseness
    of definitions of terms like systems engineering and software engineering, security
    engineering, and safety engineering. In [6], Allman describes, with considerable
    insight, the reasons for such ambiguity, as follows:


    > Our normal human language is often ambiguous; but in real life we handle these
    ambiguities without difficulty ... but in the technical world we can cause problems.
    Extremely precise language, however, is so unnatural to us that it can be hard
    to appreciate the subtleties. Standards often use formal grammar, mathematical
    equations, and finite-state machines in order to convey precise information ...
    but these do not stand on their own ...


    In its definitive guide, the International Council on Systems Engineering (INCOSE)
    [7] expresses this same concept with a specific focus on systems engineering (SE),
    as follows:


    +   One of the Systems Engineers'' first jobs on a project is to establish nomenclature
    and terminology that support clear, unambiguous communication and definition of
    the system and its functions, elements, operations, and associated processes ...
    It is essential to the advancement of the field of SE that common definitions
    and understandings are established regarding general methods and terminology that
    in turn support common processes. As more Systems Engineers accept and use a common
    terminology, we will experience improvements in communications, understanding,
    and ultimately, productivity.'
