    # Deployment, Operations, Maintenance, and Technical Support


    There is quite a range of ways in which software can be deployed ranging from
    downloading a Web site to custom installation. The former method also involves
    some form of online or telephone support, typically by a call center or help desk,
    with more difficult situations referred to technical support. Depending on the
    nature, size, cost, and complexity of the software system, the vendor might have
    their service organization manage the installation, or the customer''s technical
    support engineers might have the ability to do the installation in the field,
    particularly if it is an upgrade rather than a new installation. Ongoing operations
    usually be managed by the organization running the software system using their
    internal staff or a third party, and scheduled maintenance and repair services
    will generally be done by the vendor''s field service engineers or a third-party
    original equipment manufacturer (OEM).


    Generally, information security and safety software engineers, either from the
    vendor or customer organization, will not be involved in the operational phase
    unless there is a security breach or a safety-related incident. However, there
    are strong indications that there should be security and safety oversight of the
    maintenance and repair functions since, for example, there are a number of recorded
    cases of counterfeit parts being substituted, some of which contain malware. In
    Table 11.2, we see these participant requirements along others that might be called
    in to perform forensics and track the perpetrators in the event of a breach or
    the discovery of malicious software or hardware.


    The operations phase is probably the one that receives the least relative attention
    from security and safety proponents. The operations and technical staff generally
    do not have the expertise to deal with security incidents, yet the majority of
    security-related attacks are on software systems that are in production. For safety-critical
    systems, operational staffs are generally trained in how to handle day-to-day
    hardware malfunctions and failures, but are generally much less equipped to detect
    and deal with software and data breaches, as the Stuxnet attack in Iranian uranium-processing
    facilities demonstrated.'
