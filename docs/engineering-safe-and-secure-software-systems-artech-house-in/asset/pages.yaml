    # The Great Debate


    There are a number of individuals, such as John Pescatore and David Large Pearson
    (quoted above), who believe that the field of software systems engineering has
    generally failed to absorb the rigorous practices and disciplined processes and
    procedures of systems engineering. This view is reinforced by frequent reports
    in the press of successful attacks against software systems and the inability
    of many defenders to protect systems against such attacks effectively. It is much
    a matter of trying to systematize software systems engineering. To the contrary,
    a huge amount of research and practical effort has been expended in this attempt.
    As will be shown in this book, it is in large part due to differences in knowledge,
    background, experience, capabilities, and goals of those who are doing the work.
    Software remains as much as science, and free practitioners developing today''s,
    complex software systems have the particular breadth or the interest in reaching
    the particular needs of their jobs. On the other hand, the majority of those with
    security, safety, privacy, dependability, performance, and resiliency backgrounds
    do not have a good grasp of applications software and the software development
    process; they even seem incapable of explaining their requirements to developers
    and especially to the users, managers, and customers for whom the software systems
    are meant.


    Nevertheless, despite the apparent flagrant disregard among many creators of software
    systems of formal approaches of systems engineering and other engineering disciplines,
    there appears to be increasing recognition of the need to build into software
    systems such attributes as security (i.e., confidentiality, integrity, and availability),
    safety, survivability, interoperability, portability, sustainability, and resiliency.
    The rationale for this growing appreciation for nonfunctional requirements is
    apparent; the earlier in the development life cycle that factors are considered
    (and errors or omissions found), the less expensive it will to include their requirements.
    Attempts to ensure that the desired levels of these nonfunctional factors are
    incorporated into software systems seem not to have gained sufficient traction
    to overcome the recent surge in reported attacks, particularly if one believes
    there is a relationship between more formal methods and improvements in the quality
