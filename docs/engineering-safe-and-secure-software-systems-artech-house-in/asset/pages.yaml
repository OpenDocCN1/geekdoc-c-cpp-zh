    # Verification


    The goal of those verifying the system is to ensure that it is being constructed
    according to detailed customer and user specifications in terms of accurately
    depicting these requirements and ensuring that all requirements have been included.
    This means that individuals not directly involved in creating the programs must
    go through each and every requirement and be shown how each has been implemented.
    They also must determine that the proposed methods of testing the programs against
    requirements and specifications meet the needs. The tests themselves are done
    in the validation phase.


    Part of this phase should also be the determination that the set of requirements
    are complete and correct. If there needs to be a process whereby the results of
    the verification are fed back to the appropriate groups involved in the requirements
    phase. If any requirements are changed as a result of this, then specifications
    must be updated and changes made to the program to incorporate the corrected set
    of requirements. It can easily be seen how change emanating from later phases
    in the life cycle is so much more costly in money and time to implement, and how
    it is so less burdensome to get it right early in the life cycle.


    Thus developers are participants, but not the decision-makers with respect to
    verification, as shown in Table 11.2. In some sense, the reviewers are encouraged
    to find errors and omissions and to ensure that the errors are corrected. Again,
    there is some contention involved because having to rework the programs. This
    can delay completion and increase resource use. However, overall there is enormous
    benefit from the verification phase since errors and omissions caught at this
    phase are orders of magnitude easier and less expensive to fix than the errors
    are caught later in the life cycle. Any costs or delays caused by verification
    should be set against the much greater costs and delays that would be incurred
    as a result of missing the errors.


    # Validation


    In this phase, the correct working of the software system is proven by running
    a series of prespecified tests and observing the results. If errors are detected,
    they are fed back to the developers for reworking of the computer programs. In
    turn the revised programs need to be retested until the errors are resolved.'
