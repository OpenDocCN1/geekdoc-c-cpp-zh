  md: '# Software System Development Processes


    ..., the documents differ in many respects. We have already established that the
    +SAFE extension does not specifically address the process management process area,
    and neither +SAFE nor +SECURE includes any support process area. However, there
    are many differences that show up in the specific goal and practice levels, as
    illustrated in Table 8.8.


    Table 8.8 is very revealing. First of all, it shows that the +SECURE specific
    goals and practices cover many more areas than the specific goals of the +SAFE
    extension and the +SECURE specific goals appear to be much more oriented to the
    software development process than the safety goals and practices. The safety approach
    appears to be less formal than the security approach. For example, in the design
    category, the +SAFE requirement is to apply safety principles, whereas +SECURE
    calls for using security standards.


    # Summary and Conclusions


    In many ways, this venture into the world of processes was highly informative
    for the author, and, it is hoped, for the reader, too. The overall impression
    matches Russwaard''s representation of software development process models as
    a quagmire [1], which was unfortunately not so accurate. One who is interested
    in implementing one of the many process frameworks is sure to be confronted with
    a myriad of approaches. These approaches are difficult to compare and each requires
    substantial effort to understand and implement.


    Attempts to extend process models from the general software development framework
    to safety and security are highly variable in their rigor and usefulness. There
    also appears to reinvent the wheel to the extent that references to prior work
    and parent documents are often incomplete.


    Nevertheless, for all their problems, process improvement methods are much needed,
    as those that relate specifically to safety and security. It is crucial to ensure
    safety and security in process models, if they are not included, there is little
    hope for advancing the art of security and safe softwares systems engineering.
    That being said, the process models are not yet good enough to assure IT professionals
    the complex systems that they build and operate will meet the security and safety
    requirements of diverse stakeholders.


    Whereas world-class processes do not guarantee top-quality products and services,
    the lack of adequate processes practically ensures that many critical considerations
    relating to safety and security will not be included in the overall processes
    and projects that underlie the creation of all software-intensive products and
    software-based services.'
