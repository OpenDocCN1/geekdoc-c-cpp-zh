    # The Dynamics of Risk


    Risks related to software-intensive systems are not static and they do not change
    according to any prescribed schedule. Different risk characteristics change in
    response to both external and internal factors. It is important, therefore, to
    account for such changes, as often as they occur or are discovered, preferably
    in anticipation of new exploits, the introduction of new features and new releases
    of software products, or changes in business volumes and mix.


    With respect to the introduction of new features, there is always a risk that
    a new feature will have unintended consequences or, in combination with other
    applications and software-intensive and data-intensive systems, a feature or features
    will provide unexpected capabilities that may contain undesirable aspects. A current
    example of this is the proliferation of apps that facilitate many activities but
    also collect substantial amounts of personal data. This data, especially when
    combined with data from other sources, can reveal more information about individuals
    than they would have agreed to if they had understood the potential for compromising
    their privacy. A good analysis of the risks of big data is provided in Angwin
    [30]. Axelrod [31] predicts that there be a major shift in emphasis from issues
    relating to the security of data and software systems to privacy issues, and it
    appears from the increased press and rising concerns expressed in professional
    publications that this is happening. However, it is also common to see new, as
    well as longstanding-features, being exploited by hackers to gain access to systems
