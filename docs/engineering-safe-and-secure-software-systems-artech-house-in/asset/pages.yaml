    # Defining Risk


    The analysis of risk depends first and foremost upon one''s definition of the
    term risk, which is not as obvious as it may seem. In this chapter, we shall examine
    a number of ways in which risk is defined and calculated. Once the approach to
    risk management has been determined, the implementation of the agreed-upon risk
    measurement methods then depends upon having certain in-'
