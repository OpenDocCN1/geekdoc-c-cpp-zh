  md: 'when safety is the main criterion, the emphasis is on the harm that could be
    inflicted on others rather than the financial, reputation, and other losses of
    the entity running the system, even though the latter could be very substantial.
    However, we include in Table D.1 the determination and assessment of threats,
    exploits, weaknesses, and vulnerabilities, as were incorporated into the Secure
    SDLC in Appendix C. Here, we distinguish between hazards, which are those activities
    that could potentially be done by the system, and threats, which are those actions
    that could be done to the system. Up until recently, the latter were largely ignored
    by safety engineers, although that changing with the advent of more cyber-physical
    systems. Ironically, even safety-critical systems have always been compromised
    by malevolent insiders and by unwitting accomplices, as in the case of the Stuxnet
    worm. Open, physical controls have been implemented for highly-dangerous control
    systems (as with the need for two separate and independent operators to activate
    a nuclear missile launch) but such methods are increasingly being replaced by
    computer systems.


    When considering risks relating to safety-critical software systems, it is important
    to include both safety and security factors, especially as a security breach can
    lead to unsafe functioning of safety-critical systems. In the main text, safety
    and security software attributes are frequently dealt with separately in the literature,
    with little crossover between silos. A relatively small number of publications
    address both safety and security together. Task areas for security-critical software
    systems for the remainder of the SDLC described in Appendix C Many of the task
    areas described below are in similar categories to those of the Secure SDLC, except
    for the safety orientation of each task area. Certain terms, such as *verification
    and validation*, are more common for safety-critical systems, with testing being
    the most often used for security-critical systems; the overall concepts are similar.
    Many of the concepts used are from the JSSC report [2], which in turn leans heavily
    on United States standards. The JSSC report presents an excellent example of a
    Plan of Action and Milestones (POA&M) schedule for developing safe software systems,
    which also includes considerations of hardware.


    In Table D.2, we describe the task areas needed for coming up with generic safety
    requirements for the software system. It is stated in [2]:


    Generic SRS [safety requirements] are those design features, design constraints,
    development processes, "best practices," coding standards and techniques, and
    other general requirements that are levied on a system containing safety-critical
    software, regardless of the functionality of the application. The requirements
    themselves are not ... tied to a specific system hazard ...'
