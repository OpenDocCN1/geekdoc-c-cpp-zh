  md: '# Risks of Security-Oriented Versus Safety-Oriented Software Systems


    The distinction between security-oriented systems and safety-oriented systems
    has to do with which risks are emphasized in each. For the most part, as discussed
    previously, security is about protecting valuable and sensitive assets from outside,
    and inside, attacks, whereas safety relates to preventing the system from doing
    damage or causing injury to those using the system or otherwise affected by it.
    The degree to which the software running within the system is responsible for
    either secure or safe operation of the overall system depends upon the specific
    functions that the software supports. Sometimes system security and safety are
    not dependent on software, but on physical isolation and the like.


    It is also possible for a safety-oriented system to depend only on hardware to
    protect customers or others from harm. Such physical interlocks are common for
    electromechanical devices. However, it is also feasible to design a system where
    software is given the responsibility for avoiding injury and the equipment is
    totally controlled by software.


    Similarly, a security-oriented system can depend on physical methods for protecting
    assets, or alternatively, the protection can be via software. For example, electromagnetic
    media can have a physical switch or similar mechanism that prevents anyone from
    writing over existing content. On the other hand, the prevention of overwriting
    might be solely a matter of software controls.


    For assuring some level of software security, information security professionals
    use methods such as threat modeling, penetration testing, and the like, to try
    to establish that outsiders or, to some extent, internal users cannot damage the
    system, misuse or steal data, and so on. While those responsible for software
    security pay attention to secure coding, functional testing and nonfunctional
    security testing, functional security testing (testing that the software system
    does not do what it is not supposed to) is mostly ignored as it is considered
    too difficult and costly. Unit testing, integration testing, and acceptance testing
    are done from the user perspective and focus on functional requirements. The amount
    of nonfunctional testing performed is often affected by whether the basic system
    functionality works as specified, resources available for testing and time to
    market.


    For software safety, emphasis is more on validation and verification, as described
    above, to ensure that a system does not malfunction or fail in a manner that will
    endanger human life or harm the environment. Those tasked with software safety
    pay much more attention to unit testing and integration testing than is done for
    software systems not having safety requirements. Generally,'
  merge: -1
  pgno: 116
- img_proc: true
  md: '# Engineering Secure and Safe Systems, Part 2


    much more time and effort are allotted to ensure a high level of system safety
    is expended on other forms of testing, such as security-related testing.


    In many ways, the role of the security professional is a far more difficult than
    that of the safety engineer. The former has to defend against all potential attacks,
    whereas the safety engineer has to ensure that a finite population of malfunctions
    and failures of critical systems does not cause harm or loss of life to persons
    or other beings. That is to say, software security engineers often have an infinite
    number of possible attacks and vulnerabilities to deal with, whereas software
    safety engineers have a relatively limited number of possible scenarios, although
    that number could be very large.


    # Expertise Needed at Various Stages


    Security expertise should be front-end weighted in the life cycle to ensure that
    safety requirements are included and reviewed. The system design and coding practices
    need to be instilled from the beginning. They require expertise on secure architecture
    and development practices. Security and functional expertise is needed in the
    testing and implementation phases. Details of levels of involvement for safety-critical
    systems are included in Appendix C.


    Safety expertise is also needed early to ensure safety design, and to ensure that
    safety requirements have been considered and included as appropriate. However,
    safe coding practices may not be as great a part if safety-oriented languages
    are used. Additional expert input is needed in the verification and validation
    stages. Details of levels of involvement for safety-critical systems are included
    in Appendix D.


    # Summary and Conclusions


    It would appear that software safety engineers are better equipped to ensure that
    safety-critical systems meet industry and government requirements and standards
    in order to minimize the risk to human and other life, and the environment, of
    a failure of the systems.


    Software security engineers have neither stringent requirements nor the luxury
    of allocated time and resources to test for security, as do their safety counterparts.


    As a consequence, while the development life cycles are similar in form for both
    security-critical and safety-critical systems, the emphasis on different phases
    is be very different, as described in Appendix C and D, respectively difficult
    time convincing their management that security risks are real and should be minimized.
    Another aspect is that protecting security-critical systems often requires'
  merge: -1
  pgno: 117
- img_proc: true
  md: 'considerable effort, resources and funding, given and the perceived risks and
    responsibilities for breaches, even minimal funding is often not forthcoming.
    Because of this huge gap, those interested in achieving high degrees of security
    for critical software are either presenting normative approaches that are unlikely
    to gain traction, or hoping for magical clean-slate breakthroughs that will somehow
    change the game. The greater the problem, the more it is apparent that the huge
    amount of effort—potentially costing in the trillions of dollars—is needed to
    produce secure systems going forward, replacing deficient systems where possible,
    and retrospectively fixing legacy systems that are unlikely to be replaced within
    years or decades.


    It is possible that, safety-critical and security-critical systems are integrated
    into systems of systems and cyber-physical systems, stringent safety requirements
    will impact security requirements because breaches can readily lead to intentional
    or accidental malfunction or failure of safety-critical systems. The hope is that
    the impetus from safety requirements and standards will elevate security requirements
    and standards, rather than software practices dragging down the safety-critical
    requirements and standards. It would seem to be a fair guess and a fervent hope
    that safety will become a major driver for improved software quality.


