  md: 'provides a substantial measure of assurance that customers and end users (if
    they are different from customers) will ultimately receive completed systems that
    meet their specific requirements and have been tested to ensure that they work
    as required and specified.


    One might reasonably assume that customers and end users are able to determine
    whether or not a particular system satisfies their functional requirements (e.g.,
    a bridge spans from point A to point B and has the capacity to handle given traffic
    volumes). However, typical customers (in the case of a bridge, the customer might
    be a municipality representing looking to use the bridge) cannot be expected to
    have the expertise to ensure that the system meets nonfunctional requirements
    (e.g., for a bridge, such requirements might include the maximum weight of traffic
    and the stability of the bridge in response to crosswinds of different velocities).
    For software-intensive systems, it is similarly not to be expected that customers
    or end users can rely upon having specified appropriate safety and security requirements
    with autocomplete. When someone purchases an automobile, for example, he or she
    will look at factors such as safety, comfort, fuel consumption, braking distance,
    and the like, in making a purchase decision; however, safety features are assumed
    to be given, although consumer ratings will report issues of the National Highway
    Safety Administration (NHTSA) impact tests. Similarly, customers and end users
    of software-intensive systems cannot be expected to define safety requirements.
    Furthermore, when it comes to the security of on-board vehicle control systems,
    there are not yet standards against which to measure the security level, official
    tests are not conducted, and the purchaser is left to his or her own devices when
    it comes to determining and assuming the risk that the systems will be compromised
    by attackers.


    For software-intensive systems, in general, the functional needs of customers
    and end-users do not usually include safety and security nonfunctional requirements,
    and customers and end-users are not usually qualified to test systems for safety
    and security deficiencies. Some as Brenner [28], have suggested setting an independent
    testing organization (equivalent to Consumers Union) to test and rate commercially
    available software. In other cases, specific industries, such as the U.S. financial
    services sector, have looked into setting up an industry software assurance laboratory.
    Among many issues with establishing such a testing capability are agreeing to
    who would fund the effort, what software systems would be selected for testing,
    which set of criteria would be used for testing, and how the results would be
    distributed.


    It is therefore important to include subject-matter experts who are knowledgeable
    in both functional and nonfunctional areas on the systems development project
    team. However, in many cases, particularly for secure software'
  merge: -1
  pgno: 112
- img_proc: true
  md: '# Engineering Secure and Safe Systems, Part 2


    manufacture, the appropriate experts are often not called in during the life cycle
    and are forced to bolt security and safety measures after the software system
    has already gone through development and testing. At this point there has to be
    considerable compromise, particularly the costs of such belated efforts are many
    times what would have been if the same security and safety features had been built
    during earlier phases. In general, the problem is less for safe software systems
    than for secure software systems because the former are more often governed by
    specific standards and certification requirements.


    At this point, we will take a more detailed look at systems engineering processes
    and related responsibilities of those managing and working on the systems. We
    draw heavily on guidelines developed by the space and military agencies as were
    prominent in developing the field.


    In Christensen and Thayer [24], the functions of systems engineering are defined
    to include the following:


    +   - Problem definition;

    - Solution analysis;

    - Process planning;

    - Process control;

    - Product evaluation.


    According to the Parnas [3], the systems engineering process comprises the following
    functions:


    +   - Requirements analysis;

    - Functional analysis and allocation;

    - Design synthesis;

    - Verification;

    - Systems engineering process outputs.


    From the definitions of verification and validation by Braude and Bernstein [21],
    mentioned earlier, we see in the above process by Parnas that there is a phase
    in which systems are checked to see that they were built correctly (i.e., verification),
    but not that the systems necessarily address their specifications. This can result
    in very well-built systems that do not do what they were intended to do, and what
    is even more problematic, they might do what they are not supposed to do.'
  merge: -1
  pgno: 113
- img_proc: true
  md: 'As indicated above, very similar structures and phasing have been applied to
    software engineering, as well as to safety and security engineering. The main
    differences relate to the processes within each phase and the degree of emphasis
    placed on each. Just because a phase is recognized as part of the life cycle,
    it does not mean that it will be addressed adequately unless the requirements
    and the processes are clearly and completely specified from the start.


    There are generally substantial differences in the application of particular effort
    and expertise as we move from general systems engineering to more specialized
    software engineering and then to the engineering of safe and secure software.
    Deficiencies in the specific areas of software security and safety result from
    processes that are inadequately addressed, rather than inappropriate life cycle
    structures. Key areas are often given insufficient attention and resources, suggesting
    that additional subject-matter experts, skilled in areas such as application security
    and system safety may have been excluded from critical stages in the life cycle.
    Their skills and experience need to be brought bear during critical phases of
    the life cycle if deficiencies in these areas are to be addressed and resolved.


    # Governance Structure for Systems Engineering Projects


    Researchers are usually quite specific about what should be done, but often pay
    insufficient attention to how success in each phase might be achieved. Here the
    devil is in the details, and many of the shortcomings that we see in the safety
    and security of systems are due to researchers neither including or not even aware
    of the range of skills and backgrounds needed to create a successful safety-critical
    or security-critical software system. Again, this disparity is becoming particularly
    common as complex systems of systems and cyber-physical systems comprising both
    safety-critical and security-critical components are evolving.


    In Table 5.4, we show the differences between the disciplines of general software
    engineering, software safety engineering, and software security engineering. As
    seen from the table, it took several decades from software engineering was created
    as a separate, independent area to formalize the inclusion of software safety,
    and several decades for software engineering to become recognized as its own domain.
    The relative maturity of each of these disciplines is reflected in the status
    of formal standards, establishment of professional associations, availability
    of expertise, and so on. The maturity is also reflected in the respective quality
    of software systems being produced, with software security engineering being somewhat
    weak in certain areas, such as the establishment of generally-accepted stringent
    standards, relative to software safety engineering.'
