    # Resiliency and Availability


    A feature of software that frequently does not receive the attention that it requires
    is of resiliency. There are likely many reasons for this lack of attention, but
    one reason is surely because there are many ways in which to provide resiliency
    and many are outside the usual pursuit of the average software engineer. Cross-discipline
    and cross-cultural factors play a large part in many aspects of engineering safe
    and secure software systems, but perhaps none more than so in the resiliency area.
    There is a need to optimize across software, platforms, infrastructure, and facilities,
    and few individuals who have the knowledge and experience to deal with every aspect.
    Therefore, it becomes necessary to establish collaborative teams made up of a
    range of disciplines in order to get the level of coverage needed.


    The main issue with respect to resiliency is that it is multifaceted. Some in
    which resiliency can be achieved are inherent in the design of software, others
    relate to the platforms on which the software runs and the infrastructures that
    support the platforms. Others have to do with physical redundancy on-site and
    off-site.


    Again, the issues resolve around whether resiliency was included as a requirement
    and incorporated into the software specifications. If not, it is likely that the
    costs of providing redundancy would be significantly greater than they would have
    been if the system is ignored until after the system has been developed, tested,
    and deployed. This can also be represented by the graphs in Figure 3.5, although
    the underlying justification is considerably different. In the case of resiliency,
    there are many choices (software, firmware, hardware,'
  merge: -1
  pgno: 77
- img_proc: true
  md: '# Engineering Safe and Secure Software Systems


    platform, infrastructure) to achieve adequate resiliency, some of which relate
    to the application software, but many of which can be handled externally to the
    software. This is not the case with respect to data creation.


    # Decommissioning


    Few approaches to the software system development life cycle process address the
    discontinuation and decommissioning of the software. Despite the availability
    of regular updates for commercial software


    However, at some point it is inevitable that obsolete software products have to
    be replaced for such reasons as lack of functionality, lack of support, to interface
    with newer software and services, and so on. The question arises as to how to
    deal with the obsolete software and its attendant data. The issue seems to have
    been given more attention lately because of privacy and piracy issues, for concern
    as sensitive data were being disposed of. In some cases, the data became integrated
    with applications and it was not feasible to separate them out for destruction
    and disposal. The decommissioning and disposal of software systems needs to be
    accounted for early in the life cycle in order to ensure that these activities
    are considered at all.


    # Summary and Conclusions


    In this chapter, we considered what constitutes software systems engineering,
    which is considered by some to be a major source of deficiencies in modern information-technology
    and automated control systems. This proved to be a nontrivial exercise. As demonstrated,
    much of the criticism surrounding software engineering is justified and can be
    attributed to deficiencies in the definition of terms and the confusion surrounding
    scope and completeness. By offering more specific definitions and formal structures,
    we have attempted to clarify the meaning and scope of the field of software systems
    engineering.


    Another major area to be considered relates to gaps in the traditional software
    development life cycle, particularly as they relate to scope, testing, resiliency,
    decommissioning, disposal, and the like. These gaps can be blamed, to a significant
    degree, for vulnerabilities and other weaknesses in software. Many of the ideas
    developed in this chapter will be expanded in subsequent chapters.'
