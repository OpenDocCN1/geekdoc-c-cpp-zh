  md: '# Software Systems Security and Safety Risk 105


    formation, often in the form of security-related and safety-related metrics, available
    to the analyst who is making the risk determinations. The results are then typically
    presented to decision-makers who are supposed to be in a position to make requisite
    trade-offs.


    Furthermore, this chapter expands upon standard methods of calculating the return
    on security and safety investments in several ways. First, we take into account
    the dynamic nature of threats, vulnerabilities, and defenses. Next, we take a
    holistic view of security and safety investments.


    The protection of information assets can be viewed in two ways. One is the hierarchical
    view of security and safety measures, such as avoidance, deterrence, and prevention.
    The other is defense in depth, where various security tools and processes such
    as firewalls, identity and access management, intrusion detection and prevention
    products are combined for greater overall protection and many levels of fail-safe
    procedures are introduced to prevent harm from harming people or environments.
    The reader will gain a deeper understanding of the factors that affect risks and
    returns from investments in security and safety measures, tools, and processes,
    and will find that a portfolio approach can lead to more cost-effective security
    and safety.


    # Assessing and Calculating Risk


    There is an ongoing, frequently everputative, and particularly confusing debate
    about what risk is, how it is calculated, who the appropriate decision-makers
    might be, how they should make decisions, and how those decisions could be implemented
    [7] Two thought-leaders in this area, namely, Don Parker [8] and Scott Borg [9],
    have voiced very different opinions on risk assessment and the use of risk measures
    for determining one’s information security program, in particular. Both Parker
    and Borg have concerns with risk assessment and management practices, their issues
    differ. Parker has criticized the common approach to risk assessment, uses estimates
    of damaging events and their likelihood; Parker claims that neither factor can
    be measured or estimated with any degree of accuracy, and so the entire approach
    should be jetted. He suggests that, in its place, the best of practices used by
    peer organizations need to be established and adopted


    Borg, on the other hand, supports the view of traditional risk assessment methods,
    but emphasizes that “[e]comics drives security,” and the focus should be on “loss
    of value.” He contends that the common fixation on assets is a mistake because
    the consequences of compromising a low-value asset, such as a cheap pressure gauge
    that gives false readings due to a cyber attack, can have huge consequences, as
    the release of a toxic gas. This example emphasizes'
