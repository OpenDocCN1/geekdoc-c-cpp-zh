  md: '# Summary and Conclusions


    The goal of this chapter is to create a model of safety-critical and security-critical
    systems in the mind of the reader. While many researchers use the safety and security
    interchangeably, we choose to make a clear distinction between the two, with security
    measures used to protect sensitive data and intellectual property within applications
    and databases, and safety measures used to ensure that malfunctioning or failure
    of the system does not harm humans or the environment. There are many parallels
    between the two in terms of concepts relating to attacks, defenses, and the like,
    there are many cultural and technical norms among the engineers who design and
    operate each type of system.


    The intention of presenting such clear-cut differences is to emphasize to those
    involved in each type of system that, especially, when security-critical and safety-critical
    systems are combined into systems of systems or cyber-physical systems, there
    is a need to share information and approaches to collaborate across the whole
    security-safety spectrum. If this is not, then the resulting systems will be deficient
    in their security and safety attributes—or even, in the worst cases, both sets
    of attributes.


