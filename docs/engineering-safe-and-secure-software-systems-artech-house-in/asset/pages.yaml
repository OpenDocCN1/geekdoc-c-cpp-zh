  md: '# # 10


    # # Safe SSDLC Projects in Greater Detail


    [System safety is] the application of engineering and management principles, and
    techniques to optimize all aspects of safety within the constraints of operational
    effectiveness, time and cost throughout all phases of the system life cycle.


    > —Joint Software System Safety Committee, Software System Safety Handbook [1]


    A secured system ensures that there is no security bug so that security threats
    are eliminated, whereas for a safety-critical system, any bug could be devastating.


    > —Asoke K. Talukder and Manish Chaitanya, Architecting Secure Software Systems
    [2]


    # ## Introduction


    One might assume that all needs be done to generate the tasks, subtasks, purposes,
    and levels of involvement for safety-critical systems is to duplicate the many
    tables in Appendix C and substitute the words safe and safety for the words secure
    and security. One that it were simple. While, in many instances, it does make
    sense to perform such a substitution, there are many cases where such parallels
    fall short.


    Both the secure and safe software system development life cycle models have similar,
    if not the same, heritages. They both derive from systems and software engineering
    which are described in Chapters 2 and 3. However, as described in Chapters 5,
    there are significant differences between the approaches of those involved in
    developing secure software systems and those focused on'
  merge: -1
  pgno: 217
- img_proc: true
  md: 'safe software systems—namely, software security engineers and software safety
    engineers, respectively.


    The main differences are ones of emphasis on specific phases and tasks rather
    than structural differences. In particular, development life cycles for safety-critical
    systems pay significantly more attention to the requirements, testing, and certification
    phases, than do the development life cycles of security-critical systems. This
    is not to support or encourage this difference—in fact, developers of security-critical
    systems can learn a great deal from their safety engineering counterparts, as
    described in [3].


    # Definitions and Terms


    As we did in Chapter 9 for security-intensive software systems, we must clarify
    the differences among safe software systems, safety software systems, and safe
    safety software systems. With respect to safe software systems, safety is a quality
    attribute of the software systems, whereas safety software systems, safety is
    the predominant function of the software systems. As with the term secure software
    system the term safety is not redundant, as it might seem to be. This is because
    the latter term refers to software systems for which the main function is to provide
    safety services. However, these software systems need to be built so that the
    safety systems themselves exhibit strong attributes. While difficult to come up
    with specific examples, one suggestion is to consider a system that locks a door
    in order to prevent radiation from leaking a nuclear plant in dust. It is important
    that a door control system does not fail in a closed default status, since that
    would result in workers trapped in the radioactive space. This actually happened
    at the Fukushima nuclear power station, which was knocked out by an earthquake
    followed by a tsunami on March 11, 2011. Workers were unable to escape from a
    highly radioactive space because the doors locked automatically and an operator
    was unwilling to manually override the system because of fear that the trapped
    workers would contaminate others [4].


    Somewhat difficult is trying to come up with examples of safe and secure software
    systems that exhibit both attributes but functions other than the provision of
    safety and security services. Likewise, safety and security systems are systems
    with predominant functions in the safety and security spaces. However, must the
    latter be both safe and secure? Not necessarily. Both are protective of internally-processed
    information assets and are designed not to harm humans and the environment. Examples
    of such software systems are increasing quite rapidly as engineers are combining
    safety-critical and security-critical software systems (as with the smart grid
    [5] and a host of other'
  merge: -1
  pgno: 218
- img_proc: true
  md: 'industrial control systems, such as water treatment plants, nuclear power plants,
    etc). The danger to these control systems was considered to be minimal because
    they were not connected to any public networks. However, other means of injecting
    malware, such as portable USB thumb drives, further negates that argument. The
    approach to making these systems of or cyber-physical systems both safe and secure
    is usually based on securing the control systems by ensuring that means of access,
    of introducing malware, and of effecting denying-of-service attacks, which might
    be opened in creating these combined systems, meet high security standards. These
    standards will be greater than the range and magnitude of the risks faced by systems
    and cyber-physical systems are raised to higher levels. This is because the information
    systems must not only protect data but also that access to the control systems
    is restricted so as to prevent those with evil intent from gaining control of
    the authorized access to safety-critical control systems.


    Finally, if we talk about safety and security software systems, which are both
    safe and secure, we mean software systems that function to preserve the safety
    of humans and security of assets that also meet safety and security requirements.
    There are likely not that many examples of such systems, although of those that
    do exist shown particularly bad judgment on the part of decision makers when it
    came to the inevitable trade-off between safety and security considerations.


    Perhaps the primary examples are those software systems controlling ingress and
    egress from a physical plant. The previously mentioned Fukushima incident shows
    that, in the event of radiation being leaked into a room, no one would be able
    to open the door from the outside without using an interlocking system. From one
    point of view, this is a safety requirement, but it can also be thought of as
    a security requirement, where the asset (in a negative sense) being secured is
    radiation. The trade-off, if it was ever considered as such, without allowing
    radiation to escape risking workers trapped in the plant. In general, safety trumps
    security when safety-critical systems malfunction or fail, there is the potential
    for injury, loss of life, and damage to the environment. However, it often depends
    on who is making the decisions. Based on the outcome, one might presume that the
    senior management at TEPCO (the company responsible for operating the Fukushima
    plant) appears to have financial returns above the safety of their employees and
    contractors in their decisions about the level of physical protection. This was
    somewhat reflected in the heights of walls protecting against tsunamis, although
    the risk of a tsunami of the size and strength of which knocked out the plant
    on March 11, 2011 could have fairly been been assumed to be extremely low. Only
    after the fact did appear as if TEPCO management had been remiss.'
