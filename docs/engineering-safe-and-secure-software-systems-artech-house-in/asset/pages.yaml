  md: '# Safe SSDLC Projects in Greater Detail


    According to Military Standard 882D [6], the purpose of which is to establish
    a System Safety Program (SSP), there are a number of tasks as follows:


    +   * Software requirements hazard analysis;

    * Top-level design hazard analysis;

    * Detailed design hazard analysis;

    * Code-level software hazard analysis;

    * Software safety testing;

    * Software/user interface analysis;

    * Software change hazard analysis.


    To this list, we might add: software system decommissioning and disposal hazard
    analysis.

    The Standard [6] is directed at contractors and applies to both system and software
    requirements, so that it might be more accurate to replace *software system*,
    based on previous discussions.

    The relationship between the various types of hazard analysis and the development
    lifecycle is illustrated in Figure 10.1.


    # Software Requirements Hazard Analysis


    Examples of software system safety requirements include unsafe modes, such as:


    +   * Out-of-sequence;

    * Inappropriate magnitude;

    * Inadvertent command;

    * Adverse environment;

    * Wrong deadlocking;

    * Failure to command.


    Some of these modes, as out-of-sequence and wrong deadlocking, are inherently
    within the software systems themselves; others relate to out-of-range data or
    calculation results that might arise from a combination of software and data entry
