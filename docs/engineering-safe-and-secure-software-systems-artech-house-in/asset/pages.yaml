  md: '# Appendix D


    ### Table D.6 Safety-Related Tasks for the Deployment Phase


    | Task Areas | Descriptions |

    | :--- | :--- |

    | **Pilot deployment** | Identification of any remaining issues related to areas
    of software system planning, design, architecture, development, testing, implementation.
    |

    | **Transition from final testing to operations** | Ensuring that the final system,
    prior to deployment, addresses adequate levels of integrity and appropriate change
    management decisions and decisions. Also ensuring that all required processes
    have been reviewed and tested. |

    | **Comparison of system files** | In the case of a replacement system, making
    sure data files of the system that is to be launched are compatible with the original
    system and that they match, assuring the authenticity of the files. |

    | **Comparison of data files** | In the case of a replacement system, making sure
    that data files of the system that is to be launched are compatible with the original
    data files and that they match, assuring the authenticity of the data. |

    | **Training and awareness** | Ensuring that all appropriate stakeholders (e.g.,
    users, administrative personnel, technical support, and staff) are trained and
    aware of the safety functions and attributes of the system. |

    | **Full-scale deployment** | Making sure that the existing infrastructure meets
    safety requirements prior to installation. Checking that all procedures have been
    followed throughout the deployment phase. |

    | **Independent safety-oriented review of deployment** | Engaging third parties
    to perform safety assessments during the deployment, predeployment, and post-deployment.
