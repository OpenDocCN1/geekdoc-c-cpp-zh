  md: '# Summary and Conclusions


    It is apparent from the above descriptions that there is a divide between the
    security and safety approaches to making practitioners more aware of common risks,
    threats, attacks, weaknesses, and vulnerabilities. In the security domain, we
    use the lists of leading issues and exhaustive lists of weaknesses, vulnerabilities,
    attacks, and so on. And yet these are guidelines with which software engineers
    may or may not comply. There is little compulsion and even less effort, even when
    regulators support such lists.


    On the other hand, software safety engineers have to adhere to strict standards
    if they are to have their systems certified at a particular level. This obviates
    the real need for lists of leading issues, and so we do not see them. This is
    all well and good, except for the fact that many of the security-related lists
    contain very good advice for those developing safety-critical software systems,
    especially when systems are combined with information systems to form cyber-physical
    systems.


    It serves both communities well if those responsible for security-critical software
    systems and those creating safety-critical software systems are aware of the tools
    available to the other group.


    # Endnotes


    +   [1] OWASP stands for the Open Web Application Project, which was founded in
    2001. OWASP is an “open community dedicated to enabling organizations to conceive,
    develop, operate, and maintain applications that can be trusted.” The website
    is www.owasp.org.


    +   [2] CWE stands for “Common Weakness Enumeration” and can be accessed at http://mitre.org/cwe.
    The SANS Institute is the “SysAdmin, Audit, Network, Security Institute,” which
    is a leading training organization for information security professionals. The
    SANS Institute is at www.sans.org . Both websites were last accessed on July 29,
    2012.


    +   [3] See http://www.nettanny.com/learn-center/safety-lists, last accessed on
    July 29, 2012.


    +   [4] See http://www.emergencymgmt.com/cwe-emergency-blogs/Top-five-mistakes-in-software-selection-01092.html,
    last accessed on July 29, 2012.


    +   [5] CC Bulletin 2008-16 on Application Security, see http://www.occ.gov/news-issues/bulletins/bulletin-2008-16.html,
    last accessed on July 29, 2012.


    +   [6] Available via a link at https://www.owasp.org/index.php/Category:OWASP_Top_Ten_Project,
    last accessed on July 29, 2012.


    +   [7] Merkow, M. S., and L. Raghav, Secure and Resilient Software Development,
    Boca Raton, FL: CRC Press, 2010.


    +   [8] See http://cwe.mitre.org/top25, last accessed on July 29, 2012.


    +   [9] See http://cwe.mitre.org/, last accessed on July 29, 2012.'
