  md: 'Crash” about the January 2012 incident [13]. In another January 17, 2012 article
    “British Scareways” by Robert McAulay in The Sun newspaper, the prior incident
    occurred in August 2010. In some cases, the malfunction was attributed to a computer
    glitch; in others, human error was given as the cause. One would have thought
    that, by a proper root-cause analysis conducted, the reasons for such occurrences
    would have been determined and the systems modified to prevent subsequent repetition
    of the false alarm.


    Fortunately, the announcement system had not been triggered by an actual physical
    emergency or a failure of the aircraft''s control systems. However, it points
    to a failure in the coordination among the aircraft''s information systems, control
    systems, and their human operators, particularly since similar incidents have
    occurred at least four times previously on British Airways flights.


    # The General Development Life Cycle


    We shall be focusing here on software-intensive systems rather than just application
    software. That is to say, we are including system software, firmware, hardware,
    facilities, and human elements in the mix.


    However, before we get into the details of safe and secure software system engineering,
    we will look at the origins of various engineering disciplines and how these disciplines
    evolved; the purpose being to illustrate how certain gaps might have developed
    over time.


    Even today, traditional systems engineering is more commonly applied to the construction
    of facilities (office buildings, data centers, etc.) and the manufacturing of
    equipment than it is software development. Nevertheless, the use of project management
    tools for software development has a fairly long history, stretching back to the
    1940s, with wider adoption in the business world (as opposed to the military)
    beginning in the 1960s as with military and government backgrounds entered the
    private sector.


    The earlier and more extensive use of project management in construction and manufacturing
    may be because these fields are more closely aligned with longer-standing engineering
    practices, such as civil, mechanical, and electrical engineering, which have all
    been established as professional disciplines for more than a century, as indicated
    in Table 5.1. In his book, Gawande [15] provides an interesting description of
    the sophisticated project management tools used by construction companies to coordinate
    the many activities and capture rescue for complex projects, such as the construction
    of a skyscraper.


    Software engineering is a relatively new discipline with a history spanning six
    decades. Software safety engineering has a somewhat longer history of perhaps
    40 to 50 years as compared to software security engineering, which has only been
