  md: '# Personalization of Risk


    The value assigned by someone to a particular risk is usually very personal. As
    Jones [27] points out: “... risk tolerance is unique to every individual.” That
    is, individuals generally assess risk in large part with respect to how they might
    be personally affected by a particular adverse or beneficial event and its outcome.
    Jones and others recognize that risks are personal or individual, but they do
    not suggest how to address this most significant, least understood, and least
    accounted-for factor in the whole of risk management. Risk-assessment values should
    be adjusted to for the personal and subjective biases that are commonly introduced.
    This is an area of research unto and cannot be dismissed with a simple acknowledgment
    that it exists. It may well be that a method, similar to the interview approach
    proffered by Hubbard in [28] for obtaining estimates of impact and the likelihood
    of occurrence, might be applied to the issue of the personalization and subjectivity
    of risk factor estimation.


    That is not to say that decision-makers do not account for the adverse or positive
    impact of incidents on others. As mentioned previously, an actuary at an insurance
    company will likely determine the probability of events and the potential losses
    incurred in an objective as well as provide to his or her employer the basis for
    underwriting specific risks of loss and determining the amount charged in premiums.
    On the other hand, that person will decide whether not to buy an insurance policy
    based on his or her personal view as to the likelihood of incurring such a risk
    and the degree to which the actuary may be personally affected; the actuary’s
    risk assessment is not likely to be absolutely objective. The actuary may well
    exhibit some bias related to the need to be conservative so as not subject the
    insurance company to excessive risks, as well as the desire to advance one’s career
    by being recognized for thorough analysis and accurate forecasts. Further, there
    will also be some level of subjectivity based on the actuary’s prior successes
    and failures.


