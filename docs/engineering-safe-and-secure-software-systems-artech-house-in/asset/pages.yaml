  md: '# Safety-Security Governance Structure and Risk Management


    We also address the importance of having an effective governance structure for
    the design, development, and implementation of software systems. In addition to
    the usual recommended project management processes, which are common in the literature,
    it is critical to ensure that all necessary subject-matter experts are brought
    in at the appropriate stages of the software development life cycle (SDLC).


    We also emphasize the need to establish a risk management individual or group
    that will ensure as much as possible that both functional and nonfunctional requirements
    are given their appropriate weight when tradeoffs among project cost, quality,
    and timeliness.


    Not only are software-intensive systems becoming more complex and interconnected,
    but many software systems are transitioning into “the cloud.” These trends increase
    the need for both coordination and collaboration among systems engineers, software
    engineers, safety engineers, and security professionals throughout the entire
    life cycle. Unfortunately, many of these groups do not currently communicate with
    one another; as a result, software-intensive systems often lack the quality that
    a collaborative effort might have produced.


    The governance and risk management structures and practices described in this
    book are designed to foster such communication and collaboration. The proposed
    approach will also ensure that all significant factors for optimizing nonfunctional
    requirements of software systems such as security, resiliency, survivability,
    and sustainability are attributes at least considered. In the best of circumstances,
    these attributes will be incorporated into the processes used to create software
    systems, and will thereby protect internal assets, prevent the system from damaging
    others during destabilizing and damaging incidents, and ensure the integrity of
    sensitive information and systems. The approach followed here is first to life
    cycle structure, then processes and finally the roles and responsibilities of
    those who need to be involved.


    # An Illustration


    In mid-January, 2012, passengers in a British Airways flight from Miami to London
    heard an announcement that the airplane was about to crash into the ocean. According
    to a July 1, 1999 article “BA False Alarm Strikes Again,” the issuance of the
    prerecorded alarm about a British Airways aircraft ditching into the sea is not
    new. In fact, such incidents were reported to have occurred three times within
    four months in 1999, according to the article [12]. The same thing happened again
    on a flight from London to Hong Kong, as mentioned in the January 17, 2012 article
    “Oops: Plane Mistakenly Warns Passengers of'
  merge: -1
