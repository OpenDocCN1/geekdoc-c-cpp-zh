  md: '# Engineering Secure and Safe Systems, Part I


    ers, writers, and practitioners will lessen over time as participants will be
    called upon to address both safety and security issues [2].


    As discussed in Axelrod [3], there is an increasing need to identify the frequently-separated
    silos of security and safety. It is also important to bring security and safety
    professionals together to collaborate at each stage of system development, testing,
    operation, and decommissioning life cycle by Carter [4]. This is particularly
    urgent, as we are increasingly safety-critical and security-critical systems linked
    together to form systems of systems. The so-called smart grid, which is increasingly
    linked to public networks, particularly the Internet, is a current case in point
    [5]. The apparent confusion and lack of understanding by management and technologists
    underline the importance of differentiating expertise relating to safety and security,
    and attaining a greatly increased measure of cross-cultural cooperation, as recommended
    by Carter [4].


    A simple, yet meaningful, distinction between safety-critical and security-critical
    systems, which is generally applicable to system provided in Chapter 2 (p. 15)
    for software. Boehm''s original definition was repeated in Barnes [6]. We generalize
    the definitions as:


    +   Safety – the [system] must not harm the world,

    Security – the world must not harm the system.


    This difference in viewpoint is illustrated graphically in Figure 4.1 for safety-critical,
    security-critical, and combined safety/security-critical systems, respectively.


    Briefly, the goal of the safety-systems is containment, whereas the corresponding
    emphasis of security-critical systems is protection. Such a difference in objectives
    leads to varying and sometimes conflicting criteria for ensuring that systems
    are safe when compared with those criteria used to ensure security.


    ![](img/af73e48d28511f33fd6e8044829ee6dc_83_0.png)


    Figure 4.1 Safety versus security.'
