    # Introduction


    Before embarking on our journey through the maze that is software systems engineering
    and into the land of safety and security engineering (as these apply to software
    systems), we will dabble in the more general field of systems engineering, which
    is by far better established and has higher credibility than software systems
    security and safety engineering.


    It is quite remarkable that, with a foundation as sound and effective as systems
    engineering has become over the past 70 or so years, the building and deployment
    of safe, secure, dependable, and reliable software systems remains so inadequate.
    It is not that the fundamental principles underlying the engineering of software
    systems are particularly lacking, but clearly software systems engineering has
    not yet received the attention and support that are needed to establish the pursuit
    of safe and secure systems as a respected field in its own right.


    Before diving into the engineering of software systems, we will first examine
    the broader field of systems engineering—its approaches, practices, standards,
    and so on. The intent is to provide a foundation upon which to build lower-level
    approaches relating to software safety and security, as well as to help identify
    and resolve the gaps between systems engineering and software engineering. By
    carrying over some of the structure and processes of the longerestablished discipline
    of systems engineering, we can apply the experience and proven practices of systems
    engineering to the less mature art of engineering safe and secure software systems.


    # Some Initial Observations


    Later in this chapter, we will work with a specific hierarchy of terms in order
    to facilitate more meaningful definitions that we will use throughout the book.
    The hierarchy trickles down from general systems to software-oriented and hardware-oriented
    systems, and to the safety and security of those systems. While the focus of this
    book is on software systems, there is increasing interest in the need for codesigning
    applications and related systems, particularly for high-performance computing.
    We will, therefore, consider the implications of the need to design applications
    in conjunction with the contexts within which they operate.'
