  md: '# The Economics of Software Systems'' Safety and Security 223


    and translating those requirements into specific designs comprising application
    modules, software system, physical systems, and networks.


    There are many problems related to this phase of the process. First, it relies
    on the quality and completeness of the requirements and also on the knowledge
    and experience of the software-system designers and architects, any of which could
    be lacking. Second, designers and architects are motivated to come up with designs
    that will meet requirements, whether or not requirements are adequate. Thus, for
    example, nonfunctional attributes, such as security and performance, may not be
    adequately covered in the requirements and hence will likely not be accounted
    for in the design. In many cases performance, particularly for systems using innovative
    technologies, cannot be predicted unless a prototype is developed or a simulation
    is built. Therefore, in order to motivate designers and architects to develop
    designs that will perform satisfactorily, or prevent them from suggesting architectures
    that will not meet performance goals, one needs to appreciate the importance of
    the attributes to those for whom value of performance, security, resiliency, data
    integrity, and so on is high. Then one has to ensure that appropriate measures
    are taken to encourage full consideration of these attributes.


    One aspect that is neglected is the need to incorporate the necessary monitoring,
    data collection, and analysis, particularly so that users of the system can be
    tracked. This type of information is critical for computer forensics following
    data breach, for example, and the need for it to be included as requirements is
    seldom recognized. However, when the need for it is expressed, it is usually received
    negatively as it will lead to immediate increases in costs and resources, along
    with some operating overhead, and the benefits will not show up for months or
    years, if at all.


    For these reasons, there needs to be oversight for safety and software engineers,
    auditors, support staff, and so on in the design stage to make sure that their
    interests are covered and to verify that the design correctly interprets requirements.
    This is shown in Table 11.2 in the last column of the design/architecture row.


    # Development


    During the development phase, programmers and other technical staff are generally
    focused on writing code that is functionally correct and error-free and completed
    within the assigned timeframe. With design teams, developers are not required
    to be particularly creative, except in writing efficient and effective programs.
    They are usually rewarded for following requirements to the letter rather than
    trying to second-guess them. This is generally positive, but can be detrimental
    if developers find questionable requirements and are reluctant to report them.
    That is one reason that it is desirable to have other participants,'
