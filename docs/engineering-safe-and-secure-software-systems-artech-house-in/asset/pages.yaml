  md: '# Appendix A

    Software Vulnerabilities, Errors, and

    Attacks


    In this appendix, we discuss commonly available lists of attacks, vulnerabilities,
    and risks relating to software, predominantly web applications. Web applications
    generally have a strong security bias, as they are information systems rather
    than control systems, being web-facing, they are prone to attacks by external
    agents. However, we will see that the lists contain recommendations that are also
    applicable to information systems that do not face the web and to safety-critical
    control systems, even though they were not necessarily created with such systems
    in mind.


    As shown in Figure A.1, there are two main approaches to making developers and
    testers, in particular, aware of the security and safety risks relating to software
    systems engineering. One is to bring top vulnerabilities and risks to their attention.
    These lists are best represented by the popular OWASP [1] top vulnerabilities
    and security risks, shown on the left side of Figure A.1 and by the CWE/SANS [2]
    top 25 most dangerous programming errors, also on the left of the diagram. Furthermore,
    we show a fair amount of overlap in the diagram between the two lists, about which
    will be more specific.


    It is interesting to note that lists equivalent to the OWASP and CWE/SANS lists
    do not appear to exist for software safety. A list claiming to be “The Ten Internet
    Safety Tips from Net Nanny is really a set of security suggestions and recommendations
    on the use and blocking of various resources available on the Internet [3]. This
    is not a matter of the web applications being unsafe, but of their potential danger
    to misuse by children, which could lead to harm.'
