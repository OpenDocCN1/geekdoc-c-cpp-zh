    person, an application, or a transaction—does not find anything of value to steal
    or oversee this compromise. This is an example of avoidance.


    Responses to attacks can be active or passive. They can be achieved not by protecting
    assets against attacks, but also by avoidance and deterrence, as shown by one
    of the curved arrows in Figure 6.1. Deterrence requires that victims of attacks
    or their representatives, as law enforcement, announce that they will take effective
    legal action against perpetrators who are found and apprehended, and are seen
    to do so. However, because the ability of hackers to attack from practically anywhere
    in the world with relatively little fear of being apprehended and punished, deterrence
    is not very effective, particularly in a global context. Avoidance has a lot more
    going for it; if critical systems are not readily accessed by outsiders and restricted
    to insiders on a need-to-know basis, then are chances that unauthorized access
    will be minimized. Additionally, if care is taken to avoid putting sensitive data
    within easy reach, the effectiveness of attacks will be further diminished or
