    The above indicators bring up issues regarding how to weight each attribute and
    how to aggregate them. Clearly, the interaction of the various attributes is complex
    and its ability to come up with precise metrics is very nevertheless. The exercise
    itself has considerable value because it will highlight those important characteristics
    that may be lacking and focus on which defects and deficiencies should be fixed,
    first or at all.


    Incorporating numeric values into the above evaluation might appear to add precision
    to the exercise, but in most cases it will not. In fact, there is a considerable
    danger that using numeric values will be counterproductive. We might ask, therefore,
    how one might incorporate value measures and uncertainty into a situation that
    is already fraught with issues with respect to the representation of subjective
    ordinal measures of the attributes. The answer is that, if one were able to develop,
    as an example, a probability distribution of the losses that might be incurred
    as a result of an inadequate infrastructure or poor security coding, one would
    get a more useful picture of the risk involved in not remediating certain deficiencies.


    # Safety Metrics for Software Systems


    Metrics related to safety-critical software-intensive systems are most concerned
    with the impact of a malfunction or failure of the system. The hardware components
    of such systems are always subject to failure, but there are well-established
    approaches to dealing with them, usually by swapping out components or the like.
    That is to say, the impact of a hardware failure is relatively easy'
