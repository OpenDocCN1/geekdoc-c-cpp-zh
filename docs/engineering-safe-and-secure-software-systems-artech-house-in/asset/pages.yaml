  md: '# Engineering Secure and Safe Systems, Part I


    Barbacci definitions of safety do not capture the essential concept that safety-critical
    systems shouldpreferably prevent the harmful impact of both accidental and intended
    hazardous events rather than protect individuals from harm.


    To illustrate this point, let us consider the analogy of some of the safety features
    in a modern automobile, where the antilock braking system (ABS) is designed to
    prevent or avoid potential accidents that might occur because of icy road conditions,
    whereas air bags are designed to protect drivers and passengers immediately after
    a collision has occurred. These two automobile systems are generally implemented
    separately, each using its sensors to detect a dangerous condition and subsequently
    responding to hazardous situations independently. ABSs are intended to prevent
    accidents, whereas air bags are designed to protect driver and passengers when
    an accident occurs. In general, security measures are designed to prevent or avoid
    the consequences of an attack on a system, or its misuse, whereas safety is all
    about protecting assets (particularly, but not limited to, human beings) in that
    a breach or failure occurs.


    Furthermore, Firesmith [7] considers survivability to be the combination of safety
    and security. It can be argued, however, that survivability has to do with effective
    responses following the inability of systems to withstand attacks or prevent dangerous
    situations resulting from system failure. Therefore, one can usually make a tradeoff
    between the costs of prevention (or protection) and recovery (or survivability)
    costs. As shown in Figure 4.2, the determination of these costs can provide the
    analyst with an optimal point at which the total costs are minimized.


    In many situations, a greater investment in prevention may allow less to be spent
    on response and recovery as a means of attaining a desired level of dependability
    and integrity.


