  md: '# Software Systems Security and Safety Risk


    safety of products. Still other factors are inward looking, where organizations
    incorporate secure and safe systems development techniques to varying degrees
    and respond independently to the build-security in movement.


    The dynamics introduced by these factors must be accounted for in the risk calculations.
    Current and anticipated changes need to be included in risk models, and calculations
    need to be rerun whenever there are material changes in any of the variables contained
    in the risk model, or if the decision-makers believe that there will be major
    new developments that will affect the outcome. The changes might also suggest
    that the model itself needs to be revised, as it may be discovered that it no
    longer accurately represents the environment being considered. Preferably, risk
    models will be run for a variety or range of scenarios, considering different
    probabilities of events, different losses or gains, and the like, resulting from
    new assumptions about known advances in technologies, changes in marketplaces
    including greater competition, and cheaper sources of products. In summary, it
    is not adequate to run one risk model or set of models and then sit back and operate
    on the results of those models. Technical innovations, changes in markets, social
    changes, competing products, staff deviations, and the like, all into question
    the original results, and so the models need to be rerun to account for these
    changes. The result might be retrenchment, expansion, changes to the business
    model, new alliances, and the like. However, it is far better to be aware of these
    changes and respond to be the victim of obsolete technology and miss business
    opportunities.


    Furthermore, the inputs to the risk models and the interpretation of results are
    often influenced by personal views. Even when risk assessors are trying to be
    as objective as possible, personal bias will creep in. For instance, if a professional
    safety engineer is estimating the risks relating to a control system for which
    he or she has no responsibility, the engineer will want to protect his or her
    reputation; this is because one''s reputation affects one''s opinion of one self,
    and will also affect future work opportunities. Consequently, there is a need
    to adjust estimates for personal bias, which is a fair task to take on because
    without assuming responsibility and liability in the event that something bad
    was to occur. The extreme example of this is the tragedy of the commons, wherein
    no one is responsible or accountable for the risks, although ultimately someone
    or group will pay the price if a disaster occurs.


    Finally, the view of risk needs to be holistic. The points of view of a broad
    range of stakeholders need to be considered. It is often the case that different
    stakeholders, such as vendors, law enforcement officers, regulators, auditors,
    customers, and users, all have different interests in the security and safety
    of software-intensive systems. While it is a daunting task to elicit such views,
    it is even harder to incorporate them into risk calculations. This is because
    one must determine the relative weights to apply to the opinions of each group
    and'
