  md: '# Engineering Secure and Safe Systems, Part 2


    If researchers do not produce ground-breaking, cost-effective solutions—and there
    is no guarantee that they will—then it will be necessary to revert to old safety
    and security methods and to enhance them. If that becomes the case, then we will
    have to put huge effort and devote enormous amounts of resources into building
    security, safety, dependability, integrity, resiliency, and other attributes into
    future software-intensive systems, starting from the earliest phases of the software
    systems development life cycle. This approach will certainly involve enormous
    expense and effort. There is also a need to develop a cadre of subject-matter
    experts to accomplish the enhanced requirements. Retrofitting security, safety,
    and the like into existing systems would incur even greater effort and expense
    because of the need for software engineers to be familiar with obsolete computer
    languages and operating systems, in addition to the capabilities required for
    up-to-date methods and technologies.


    The combination of retrofitting older systems and building security, safety, resiliency,
    and the like into new systems would cost so much that such an effort is extremely
    unlikely to be justified and subsequently funded. Rather, a more acceptable approach
    would be to replace systems over time with new systems of greatly improved quality
    with respect to security, safety, and the like, assuming there is the time and
    determination to get this done. Even a lesser initiative would have difficulties
    in finding sources willing to fund the effort.


    Only some overriding threat—such as for the Year 2000 or Y2K mitigation effort,
    when there was major concern about the risk of system malfunctions and failures
    due to systems misrepresenting the date over the century rollover—would motivate
    public and private sectors to fund remediating currently-operating and in-development
    software-intensive systems. Y2K remediation was estimated to have cost in the
    $200 to $300 billion range, although much of those expenditures consisted of accelerating
    the replacement of existing systems with new systems. Because the Y2K fixes could
    be compared easily without having to understand much about the functionality of
    the software being corrected, that effort could be expected to have orders-magnitude
    less than the effort for implementing a broad array of security and safety requirements
    to ensure and new systems. It is likely that bolstering security and safety on
    to all existing mission-critical systems could cost in the trillions of dollars.
    Doing so for future systems could add billions of dollars to projects, although
    such costs could be offset reduced vulnerability and fewer successful attacks.
    It is difficult to envisage any potential catastrophe that could precipitate these
    expenditures—until it happens.


    Furthermore, it is unlikely that even building security, safety, and resiliency
    into new systems will be universally accepted, particularly by private industry.
    Some companies, as the Microsoft Corporation, have notably embraced'
