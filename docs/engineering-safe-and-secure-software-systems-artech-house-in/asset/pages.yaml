  md: '288 Engineering Safe and Secure Software Systems


    The weighting of effort for the deployment phase, as shown in Table C.14, shifts
    to the operational areas, although there is still significant support required
    from the security team and technical teams. As shown in Table C.15, the same applies
    when the system moves into production or operation.


    Decommissioning involves the operational areas with oversight by security and
    audit, as shown in Table C.14.


    The summaries of Tables C.9 to C.16, which provide levels of involvement for tasks
    within phases, are combined into Table C.17, which shows the overall involvement
    of the various groups and teams in the security aspects of each phase of the life
    cycle. As noted, the main participants are the security and audit team members,
    but the application development team and the infrastructure team follow close
    behind. For the effort to be successful, participants must be fully engaged and
    perform their tasks diligently.


    # A Note on Sources


    The entries in the above tables cannot be attributed to specific references because
    they represent an amalgamation of concepts drawn from various sources, many of
    which are given in the End Notes section of Chapter 9. Most of the tables in this
    appendix are derived from McBride [2], although their form and content varies
    considerably from those in [2]. For example, the risk analysis and control phase
    as well as decommissioning and disposal phase are not included in [2].


