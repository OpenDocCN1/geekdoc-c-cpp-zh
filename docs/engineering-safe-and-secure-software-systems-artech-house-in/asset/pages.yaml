  md: '# WASC Threat Classification


    The Web Application Security Consortium (WASC) is described [11] as being made
    up of an international group of experts, industry practitioners, and organizational
    representatives who produce open source and widely agreed-upon bestpractice standards
    for the World Wide Web.


    The WASC attacks and weaknesses listed in Table A.4 are linked to excellent descriptions
    of each attack and weakness [12]. Also available via the WASC website is the report,
    WASC Threat Classification Version 2.0 (last updated as of January 1, 2010). The
    report is extensive and examines each of the threats, attacks and weaknesses,
    which the report defines as:


    +   * *Threat*: a potential violation of security (per ISO 7498-2).

    n* *Attack*: a well-defined set of actions that, if successful, would result in
    either damage to an asset or undesirable operation.

    * *Weakness*: a type of mistake in software, under proper conditions, could contribute
    to the introduction of vulnerabilities that software... [the term] applies to
    regardless of whether they occur in implementation, design or other phases of
    the SDLC. (From the MITRE Group’s CWE website at http://cwe.mitre.org).

    * *Vulnerability*: an occurrence of a weakness (or multiple weaknesses) within
    software, in which the weaknesses can be used by a party to modify or access unintended
    data, interrupt proper execution, or perform incorrect actions that were not specifically
    granted to the party who uses the weakness. (From the MITRE Group’s CWE website
    at http://cwe.mitre.org).


    It is readily apparent that many of the WASC attacks and weakness are the same
    as in the OWASP Top 10 and the CWE/SANS Top 25. This raises the question of whether
    the WASC threats can replace the CWE and CAPEC lists. In the frequently asked
