  md: '# Appendix B

    Comparison of ISO/IEC 12207 and CMMI®-DEV Process Areas


    As can be seen from the Table B.1, there are many similarities among the majority
    of process areas of both ISO/IEC 12207 and CMMI®-DEV, although some comparisons
    are closer matches than others. Also, there are specific differences in categories—for
    example, verification and validation are included in the CMMI®-DEV category engineering,
    whereas ISO/IEC 12207 shows them as belonging to the software support category.


    The main difference between these two sources is that ISO/IEC 12207 includes individual
    phases of the development life cycle, whereas CMMI®-DEV does not. It appears that
    the reason for this is that CMMI®-DEV has a Specific Process (SP 1.2) to establish
    life cycle descriptions, whereas ISO/IEC 12207 does not, but rather presents a
    life cycle model directly.'
