  md: '# Measuring and Reporting Metrics


    When it comes to measuring security-related and safety-related metrics, there
    are a number of approaches with varying degrees of merit. A specific taxonomy,
    as suggested by Axor [7], is shown in Table 7.3.


    The advantages and disadvantages of the above categories of metric are shown in
    Table 7.4. The weighting of such metrics is highly dependent upon the nature of
    the organization from which the data is collected, as well as who is collecting
    and analyzing the data. Often, an outside consultant will have more success in
    using useful data and performing objective analyses.


    In Figure 7.2, we show the behavior of cost and value estimates as the complexity
    of the metrics approaches increases. In general, as the data collection and analysis
    becomes more complex, the costs will increase and it is expected that value, as
    it relates to decision-making, will increase even more. Although the diagram shows
    value increasing relative to the costs of increasingly complex approaches, value
    might not necessarily keep up with costs as the data collection and risk models
    become more sophisticated. In part, this can be due to the benefits being less
    tangible when value and uncertainty are taken into account.


    Figure 7.2 indicates a range of values and costs with upper and lower bounds.
    Because of the curves, the curves suggest that, at any level of complexity, the
    net value of the exercise, namely the usefulness of the metrics category for decision-making
    less the cost of data collection and analysis, can in fact be negative. As costs
    increase along the complexity of the approach, so is up to the risk manager and/or
    analyst to arrive at an optimal approach with respect to net value. The optimal
    approach might lie in the range of the holistic, value, and uncertainty approaches
    because produce the most meaningful representations of risk.


    # Table 7.3

    Taxonomy of Categories of Metrics


    | Category of Metric | Description of Responses |

    |---|---|n| Existence | "Yes," "No," or "Not Applicable (N/A)" |

    | Ordinal | Typically "High," "Moderate," or "Low" |

    | Score | On a scale, such as "one to ten" |

    | Cardinal | A number in response to the question: "How many...?" |

    | Percentage | A number in response to the question: "What percentage of...??"
    |

    | Holistic | More complete view from authoritative source |

    | Value | Typically, total loss in value for different approaches |

    | Uncertainty | Stochastic or probabilistic approach |'
