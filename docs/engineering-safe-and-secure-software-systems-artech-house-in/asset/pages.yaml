  md: '# Secure SDLC Projects in Greater Detail


    At this point, we will again differentiate among secure software systems, security
    software systems, and security software systems. With respect to secure software
    systems, security is a quality attribute of the software systems, whereas for
    security software systems, security is the predominant function of the software
    systems. Odd as it may seem, the term secure software system is not redundant
    because it refers to software systems, the main function of which is to provide
    security services. The attack against RSA''s SecureID technology, detailed below,
    is an example of a security system being compromised. Therefore, these secure
    software systems must be built so that the security software systems themselves
    exhibit strong security attributes and are resistant to attack. The reported attacks
    against RSA and Symantec demonstrate that these security product vendors are perhaps
    more vulnerable than generally understood [7].


    The terms and meanings are similar for safety-critical systems and combined-critical
    systems and safety-critical systems. As secure software systems, safe software
    systems are those for which safety is an attribute. For safety software systems,
    safety is the main function of the software systems. Therefore, safe safety software
    systems provide safety services and themselves meet specified standards. Secure
    safety systems are those for which the function is safety, but which are also
    secure because they are protected from attacks or events. Safe security systems
    are those that protect physical or logical security functions and do not threaten
    harm to people, other creatures, or the environment. An example of a latter would
    be a building entry system that fails in an open state that, in the event of a
    fire, persons within the facility can escape and firefighters, emergency service
    personnel, and other responders can enter the facility freely.


    Even more confusing are safe and secure software systems that reflect safety and
    security requirements, but have functions other than the provision of safety and
    security services.


    When we talk about safe and secure safety and security software systems, we mean
    software systems that function to preserve both safety and security, and also
    meet specified safety and security requirements. Thus, one might have (as with
    systems of systems and cyber-physical systems, such as the smart grid [8]) safety-critical
    systems that satisfy safety standards and have been secured against outside attacks
    and internal mishanding. Conversely, such systems may be those that provide security
    services but have also been specified as not doing damage to living beings or
    the environment they fail to malfunction. The above is summarized in Table 9.1.


    Table 9.1 illustrates how the attribute of security (which previously was not
    considered a high priority for safety-critical systems) is now considered to be
    important, particularly for systems that have both security and safety requirements.
    Security-critical systems clearly must exhibit high degrees of intrinsic'
