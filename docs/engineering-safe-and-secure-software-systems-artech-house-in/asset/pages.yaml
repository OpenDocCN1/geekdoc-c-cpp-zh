  md: '# Decommissioning and Disposal


    The area that generally receives the least attention in the private sector is
    the decommissioning and disposal of security-critical and, to a lesser extent,
    safety-critical software systems and the data that they might contain. Very few
    texts discern the disposal and the consequent risk of leakage of intellectual
    property and other sensitive data. On the other hand, government agencies in particular,
    such as the U.S. Department of Defense, often address the disposal of safety-critical
    systems—especially if the decommissioned system contains dangerous components
    that could kill or injure—and classified security-critical data.


    If the responsibilities for decommissioning and disposal are clearly defined and
    assigned, those doing the job have some incentive to perform correctly and completely;
    since failure to perform might be readily discerned an incident with, or data
    leakage from, a discarded system to occur. The greatest risk, for security-critical
    systems, is that there may not be alone accountable for the proper disposal of
    systems and media, so that there are few, if any controls in place. It is therefore
    important that security and safety experts, as well as internal and external auditors,
    be involved in the decommissioning and disposal phase, as shown in Table 11.2.


    # Overall Impression


    The above analysis serves to point out the exclusion or delayed participation
    of those who have specific interests, particularly in nonfunctional areas, leads
    to software system deficiencies in the early stages that result in subsequent
    excessive costs to revise requirements and solutions at later stages—the bolt-on
    versus built-in syndrome. The challenge is a matter of inducing them to include
    all the necessary players early and sufficiently intensely to ensure that the
    overall value of the software system is maximized. Clearly it is not adequate
    to appeal to those in authority to do “the right thing.” There have to be mechanisms
    for encouraging behavior that will push the system towards higher value. This
    can be done by mandate, threats, cajoling, economic plays, laws, regulations,
    and so forth. However, unless the impact is measured against the situation, it
    is not clear how effective these measures are. In the following section, we look
    at motivators and deterrents and what their impact might be.


    # Methods for Encouraging Optimal Behavior


    There are a number of ways in which the behavior of individuals with respect to
    their roles and responsibilities throughout the SSDLC can be influenced'
  merge: -1
  pgno: 248
- img_proc: true
  md: '# The Economics of Software Systems'' Safety and Security 227


    in order to encourage the inclusion of certain attributes, as security and safety.
    Such motivators and deterrents act upon individual decision-makers and project
    participants in order to encourage them to respond in ways that are globally desirable
    to the software-system manufacturing organization and other stakeholders, such
    as customers, business partners, regulators, and auditors.


    Of course, decisions relating to the global optimization of the critical attributes
    are also highly subjective, but for our purposes, we will assume that it is possible
    to define some global value function that includes tangible and intangible costs
    and benefits from the perspective of an overall authority. While far from ideal,
    this approach at least enables one to determine which attributes are key, what
    their optimal levels might be, the contribution to global value of each phase
    of the SDLC, and the specific participants and decision-makers who need to be
    persuaded, either directly or indirectly, to act in ways that promote the common
    good.


    # Pricing


    If it can be applied, the pricing of resources can be one of the more efficient
    ways in which one can influence behavior. The typical mechanism for organizations
    and their projects is some form of budgeting combined with chargeback. A critical
    component of this approach is to be able to find certain desired attributes from
    a separate pool of money, the use of which does not impede upon a particular project
    budget. This is important because, as described above, including security considerations
    and capabilities in the development life cycle is often against the personal interests
    of designers, developers, and testers who are generally motivated to complete
    a project on time and within budget. Security attributes usually fall into this
    category and will generally be underserved unless they are “paid for” for an organization-level.


    # Chargeback


    The rules for charging overhead costs such as general administrative expenses
    can greatly influence the cost of a project and sometimes a project will actually
    go forward. Chargeback also influences how participants respond to various requirements.
    It is often desirable to have a central pool of funds for such factors as information
    security. In this way, senior management can enforce security requirements, say,
    without penalizing the development team for any delays or cost overruns due to
    incorporating security attributes into the software system.'
