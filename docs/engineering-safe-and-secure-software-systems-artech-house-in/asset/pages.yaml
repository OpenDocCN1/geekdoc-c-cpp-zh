  md: '# 3


    # Engineering Software Systems


    > > Software engineering is still an oxymoron [1]

    —John Pescatore, Gartner Inc.


    > > software engineering, as originally envisaged, does not yet exist [2]

    —David Lorge Parnas, Middle Road Software


    # Introduction


    Software is different from most other products and services acquired by consumers,
    customers, and organizations. It is arguably more like a fuel than a fuel that
    it is a product because all systems that include software as a component require
    an infusion of software in order to operate. Yet, unlike a fuel, software doesn''t
    get depleted with use. Application software also differs from a fuel as it is
    the product that you, the so-called user, usually interact, rather than something
    that is somewhat activated in the background, as is fuel. However, with a fuel,
    software is not self-sufficient. It needs a context within which to perform. Of
    context, it is useless. If you obtain a disk containing software or you download
    software over a communications link, the software has to be used on a system comprising
    particular equipment (or hardware), such as computer processors, storage devices,
    and communications networks, and (for applications) software system and utilities,
    all of which support software products themselves do not have any end-user functions
    without the requisite application software.


    Other characteristics of software products and the data that they handle have
    a profound impact on security, safety, resiliency, and similar nonfunctional software
    system attributes. One is that software can be duplicated for low incremental
    cost and be exploited at will (although'
  merge: -1
  pgno: 51
- img_proc: true
  md: 'doing so will usually negate any license terms and warranties), often without
    the changes or attacks detected and without the perpetrators having to be in the
    same physical location as the original software, as long as they have a means
    of connecting to or accessing the software and data. Another characteristic of
    software is that customers generally license rather than own commercial-off-the-shelf
    (COTS) software (as opposed to home-grown software, which is owned by the manufacturer
    or its designes), so that one is limited to what one can do with COTS software
    in alteration of the program code and reselling the resultant product. One exception
    to this rule is open-source software, which is owned by no one and maintained
    by a community. However, open-source license agreements have their idiosyncrasies
    that must be considered, as in [3].


    It might seem reasonable, therefore, to explain the reticence of some engineers,
    comfortable in fields such as mechanical, civil and electrical engineering, and
    architecture, to becoming involved and dealing with software and its related issues
    due to the unique characteristics of software described above. As mentioned in
    [4], traditionalists are likely to be more comfortable in the physical world (as
    opposed to the virtual world), even though they likely use personal computers
    for purposes such as social networking, spreadsheet calculations, and word processing.
    However, this latter involvement is not the same as of incorporating industrial-strength
    software into the actual systems that they are engineering. By giving short shift
    to software and its implications, systems engineers will likely omit software
    considerations when designing and building systems and when interfacing their
    traditional physical systems with the increasingly pervasive world.


    On the other hand, today''s so-called software engineers often do not have the
    software engineering field directly through basic training, in college or commercial
    training programs in software programming skills, and on-the-job experience in
    a development shop, with occasional festivities in specific vendors'' products
    for the use of specific platforms and infrastructures.


    That is not to say that formal project management methods are not fairly common
    in software development projects. They are particularly prevalent in large software
    manufacturing entities. In this chapter, we present a number of well-formulated
    examples of such approaches that are described in the literature. In reality,
    the methods and practices of systems engineering project management have existed
    in the software development phase for decades. However, endorsing and practicing
