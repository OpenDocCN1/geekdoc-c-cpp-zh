- img_proc: true
  md: 'identify and evaluate, the response is generally quite straightforward. The
    exception to this is if it is suspected or shown that the equipment has a weakness
    or been compromised in some way; then it serves no purpose to replace the hardware
    component with a new one that is also defective. The same goes for software.


    The root causes of software malfunctions and failures are often less easily identified
    than hardware failures. Sometimes a hardware failure is caused by a software error,
    or vice versa, which can confuse the determination of the reason for the failure
    or malfunction. For example, if a telecommunications network goes down, the halt
    in traffic may be because of an equipment failure, because of software errors,
    or due to human error.


    Consider, for example, the actual case where a particular desk telephone system
    would fail and reboot repeatedly. It took engineers to determine the problem.
    Apparently, in the pristine laboratory environment, there was no noise from the
    cables, which had short runs and were carefully installed. In the field, with
    less-than-perfect coupling, the software system kept invoking a recovery routine
    that had never been tested in the lab because the carefully-installed cables never
    malfunctioned. It was determined that there was a coding error in the recovery
    routine that was activated by signal losses and noise on the cables, which caused
    the entire system to fail.


    As another example, there has generally been fair amount written recently about
    securing industrial control systems that are increasingly being exposed to public
    networks. Numerous articles, congressional hearings, and the like, securing the
    smart grid fall into this category. However, there is still relatively little
    published on trying to reconcile the major conceptual differences that exist between
    safety and security engineers'' views on system requirements, which is the basic
    deficiency in the development processes of these systems of systems and cyber-physical
    systems.


    # Summary and Conclusions


    The development and use of security and safety metrics, as they apply to software,
    are definitely works in progress. Current approaches do not generate all of requisite
    measures and metrics, and those that are produced are often insufficient to make
    appropriate decisions and take necessary actions. As a result, organizations are
    frequently unaware that successful attacks and breaches have taken place and,
    when they are notified that such an attack or breach has occurred, they are usually
    at a loss in determining what happened, who did it, and what to do about it.


    The first recommendation for getting a handle on this problem is to understand
    the range of metrics categories that are available and used, and then to'
