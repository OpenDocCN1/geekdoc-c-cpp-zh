  md: '# The Approach


    Just as it was recommended in Chapter 3 that the term software engineering was
    expanded to software systems engineering in order to account for the fact that
    software products only run in specific contexts, security engineering and safety
    engineering need to be more clearly identified and defined so that it is clear
    as what is meant by security and safety as they apply to systems engineering,
    where systems may or may not include computers. In this chapter, we delve into
    the specific areas of security engineering and safety engineering. In subsequent
    chapters, we will relate security and safety to software-intensive systems.


    We now go through a similar defining process as the one followed in Chapters 2
    and 3 for clarifying what is meant by security engineering and safety engineering.
    We thereby set the stage for determining what it takes to apply these concepts
    to software systems, as we will do in Chapter 5. It is again asserted, as it was
    in earlier chapters, that being precise in defining such terms is the key to better
    understanding and should be helpful in shedding light on the fuzzy thinking that
    we find in this area. Many prominent researchers and authors do not take the trouble
    to differentiate between security and safety engineering, or perhaps they do not
    recognize that there be a difference. They also appear not to care to make any
    particular distinction among security, safety and other descriptors, such as dependability.
    This makes it considerably difficult to make comparisons across disciplines. We
    try to overcome much of this confusion and lack of precision by separating out
    the terms and examining each one separately and then in combination with themselves
    and other terms.


    # Security Versus Safety


    In this book on the subject of security engineering, Anderson [1] certainly covers
    practically every conceivable topic that one might associate with security engineering
    as it relates to software systems. However, his distinction between the concepts
    of security and safety is not particularly clear. This is uncommon. Many writers
    use the words security and safety interchangeably. Here, we will differentiate
    carefully between the two terms. There is a considerable gap in knowledge and
    communications between those who focus on security and those specializing in safety,
    whether referring to general systems or software-intensive systems, so that it
    is still appropriate to treat the disciplines independently. It is hoped that
    the separation between the safety and security engineering research-'
  merge: -1
