    +   * Using obscure and incomplete error messages;

    * Using slow, simple algorithms rather than better algorithms that are complex
    and run more efficiently.


    There are nearly a host of other factors to be considered such as undering projects,
    using inexperienced project managers, and the like. All of these deficiencies
    lead to the amassing of technical debt. As pointed out by Altman, various constituencies
    assume technical debt according to their roles and power to limit that debt. Also,
    they can accrue and transfer technical debt to others knowingly or inadvertently,
    as we described in Chapter 6. This is a form of moral hazard where those who create
    the debt manage to avoid blame or responsibility for controlling and repaying
    the debt.


    Altman provides a good exposition of how technical debt impinges on various areas
