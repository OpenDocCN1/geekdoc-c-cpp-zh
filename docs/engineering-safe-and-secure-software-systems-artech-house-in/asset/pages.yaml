    control physical systems.


    # Detailed Design Hazard Analysis


    This analysis of the detailed design of the software system should be completed
    prior to the start of coding software programs. The detailed design takes the
    results of the hazards analyses for software requirements and top-level design
    and must ensure these unsafe results are accounted for in the safety-critical
    software components. The results of this analysis provide input to the final design
    review.


    # Code-Level Software Hazard Analysis


    This analysis is based on the results of the Detailed Design Hazard Analysis and
    requires analysis of program code and system interfaces to determine if there
    are any errors, faults, or conditions in the code or interfaces that might result
    in undesirable safety-related events. This analysis should be ongoing throughout
    the remainder of the life cycle.


    Unfortunately, the so-called static analysis of programming code is often an art
    rather than a science, despite numerous attempts at automating the code review
    process. The ability of the coding practices to avoid hazardous states is also
    a function of the programming language selected. Some languages, such as Ada,
    MISRA C, C#, Java and SPARK, have built-in restrictions to avoid certain unsafe
    or risky conditions. However, more prevalent languages, such as C, C++, Java and
    SQL, are less restrictive, and it can be argued that more safety issues exist,
