    security due in part of the negative reputational fallout when compromised, in
    the case of the security-firm RSA, which was the victim of a successful attack
    that brought into serious question the security of their two-factor authentication
    technology [9].


    RSA sells one of the most popular two-factor authentication technologies in the
    form of their SecID tag, which is usually in the form of a key fob or credit-card
    size unit with a small screen on it. The screen displays a numeric code which
    changes every minute and is synchronized with a number generator on the system
    to which access is granted. The SecID card, in conjunction with some other code,
    such as a password or personal identification number (PIN) provides two-factor
    authentication, which is considered to be highly secure. As a result, SecID technology
    is used to protect some of the most security-critical software systems, such as
    those operated by defense contractors. When RSA was compromised by a cyber attack,
    the underlying SecID technology was stolen. The technology was then used to attempt
    to infiltrate the systems of entities as large defense contractor Lockheed Martin.
    From the perspective of cybersecurity professionals, this compromise was particularly
    disconcerting it showed weaknesses in what was considered to have one of the most
    effective ways to prevent unauthorized access to critical systems.


    With respect to safety, a system controlling something like entry to a high-security
    facility needs to have very good safety features. If the safety software were
    to fail, the reputation of the company supplying the control software and its
    ability to perform would be brought into question. When systems of systems and
    cyber-physical systems have both safety and security requirements, the controlling
    software must have particularly stringent safety and security attributes.


    # Creating and Using Software Systems


    There are many published approaches to building software systems. Most of them
    follow the traditional basic systems engineering approach to projects. Some expand
    beyond the basic scope and add specific security and safety com-'
  merge: -1
  pgno: 202
- img_proc: true
  md: '# Secure SSDLC Projects in Greater Detail


    ponents. Others are less complete than the basic systems approach. For example,
    many software system lifecycles omit consideration of decommissioning of obsolete
    systems and planning for their replacements with new systems. Furthermore, typical
    development life cycles frequently do not follow the commonly-held notion of birth-life-death
    cycles, restricting consideration to a single pass. The inevitable end-of-life
    of software systems is often not planned, particularly for security-related lifecycle
    processes in the private sector. To their credit, many government approaches consider
    the decommissioning and disposal phases aware, although these appear more in safety-related
    control systems than for information systems. It is emphasized that the activities
    that take place when a software-intensive software system is discontinued must
    be carefully planned if one is not to be exposed to a litany of risks, including
    loss of valuable intellectual property. Many researchers and practitioners assume
    that once the useful life of a software system is at an end, then the software
    has no value. This is not the case because older versions of software products,
    while not necessarily supported by the vendor, can usually operate usefully, if
    desired and may contain valuable intellectual property.


    In some cases, even when a system is decommissioned, the data handled by the system
    may be retained over a longer term so to meet the requirements of the taxing authorities
    or regulatory agencies. Sometimes, data records may be retained for a given number
    of years; in other cases, they may be retained forever. This raises a key issue
    regarding the ability to retrieve electronic records that are compatible with
    the decommissioned software systems. If replacement systems are not backward-compatible,
    then some means to reconstruct the replaced software and hardware systems may
    be required in order to retrieve data. This can become a particularly onerous
    requirement, especially if the systems and those familiar with the applications
    and those who are needed to support the systems operationally are long since gone.


    In addition, there are seldom preliminary plans for the creation of a replacement
    system put in place at the time the original system is created. Individuals developing
    software systems usually take no responsibility for consideration of replacement
    systems because it takes more time and resources to include features that will
    facilitate replacing the original system; expending those resources can only be
    detrimental to the timely completion of the project at hand, consideration of
    replacement is a specific requirement.


    This omission of replacement considerations can lead to panic and confusion when,
    for example, a vendor announces that it will no longer support a specific software
    product beyond a given date, or if the business conditions change drastically,
    calling for a different system, be it needing greater scalability,'
  merge: -1
