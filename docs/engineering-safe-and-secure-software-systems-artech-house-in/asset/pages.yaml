  md: '# Appendix D

    Safety-Related Tasks in the Safe SSDLC


    As in Appendix C, which focused on the Secure SSDLC, Tables D.1 through D8, show
    tasks for each phase of the safe software system development life cycle (SSDLC),
    describe them, give their purposes. Table D.9 shows the levels of involvement
    of various players for each phase.


    The following tables should be used for guidance purposes only. These tables should
    be helpful for those responsible for the safety of mission-critical software systems
    and they offer a checklist to assist in the process of ensuring that adequate
    attention has been applied to safety considerations throughout the life cycle.
    The checklist should have even more value to those who concentrate on security-critical
    systems, as these individuals will likely not be very familiar with safety-critical
    software system requirements and methods for building them.


    # Task Areas for Safe SSDLC Phases


    We now show the tasks, descriptions, and purposes for each of the following phases
    of the Safe SSDLC:


    +   * Hazard risk analysis and control;

    * Safety software requirements;

    * Safety architecture and design;

    * Development (building/configuration/integration);

    * Verification, validation and certification;'
  merge: -1
  pgno: 311
- img_proc: true
  md: '+   Deployment;


    +   Operations, maintenance and support;


    +   Decommissioning and safe disposal.


    Tables D.1 through D.8 provide guidance for those tasked with ensuring that safety
    is built into software systems and that those systems meet particular standards
    necessary for certification. The main differences between the phases presented
    here and the phases described in Appendix C are (1) replacement of risk analysis
    and control relating to protecting information assets with hazard risk analysis
    and control relating to damage that a malfunction or failure may do to humans,
    other creatures, or the environment; and (2) the substitution of verification,
    validation, and certification phase for the testing phase. The other phases of
    the Safe SDLC appear to be similar in name to the phases in the Secure SDLC, but
    differences will be highlighted as we go through the phases one at a time. For
    example, the disposal of a safety-critical software systems and data can take
    a very different form in comparison with the disposal of security-critical software
    systems and data.


    As mentioned in Appendix C, there is some degree of asymmetry between the Secure
    and Safe SDLCs, particularly with respect to a strong recommendation to have software-security
    subject-matter expertise available to the software-safety project team. This is
    in contrast to usually needing to have safe-software experts involved in the Secure
    SDLC.


    As with the Secure SDLC, the first phase of the Safe SDLC is also a risk analysis
    and control phase. However, in the latter case, it is the risk that a malfunction
    or failure will cause physical harm to humans and/or the environment. In the former
    case, it is generally a matter of determining the likelihood that a security-critical
    software system will be penetrated and sensitive data compromised. While it is
    true that result of a breach or failure of a safety-critical software system can
    result in harm, the damage is usually in the form of fraud against financial assets,
    theft of intellectual property, and the release of nonpublic personal information.
    These latter consequences can be extremely distressing and might lead indirectly
    to physical harm. However, financial losses are generally considered not to be
    as serious as physical harm, even though the former can usually be estimated fairly
    accurately and the latter are generally rough estimates because of the difficulty
    in assessing the value of a life, the cost of an injury, and the financial impact
    of an environmental disaster.


    In Table D.1 we show the task areas related to hazard risks. As financial risks,
    the impact of a malfunction or failure of a safety-critical softwareintensive
    system is on both ends of the system and those affected by the system, such as
    internal users, customers, or the public in general. The main difference in approach
    between security risk and safety risk evaluations is'
