    etc.). One way to improve the chances of getting all relevant requirements is
    to think of all the various groups that may have a vested interest in the system
    development effort—and also of the groups that may be looking for the project
    to fail. This is often embodied in the "nobody asked me" syndrome, wherein information
    is not properly conveyed because it was not asked for. There is often a need to
    motivate stakeholders to respond and to be forthright in their responses. This
    can be achieved by encouraging stakeholders to participate through various incentives,
    such as periodic reviews, special mention in newsletters, and other forms of recognition.
    The effectiveness of the methods chosen will depend upon the culture of the organization.
    Suggested involvements for each phase of the life cycle are shown in Appendix
    C for security-critical software systems.


    +   * Unambiguous requirements: it is important for stakeholders to understand
    the terminology being used and to be able to translate their personal needs into
    highly specific requirements. Requirements, both functional and nonfunctional,
    are then converted into specifications, which are used as the basis for system
    design and architecture, coding, testing, and the like. At each stage, there needs
    to be confirmation that the program code accurately implements requirements, whether
    or not the requirements truly represent the needs of the user. This is the verification
    process. In addition, the originator of the requirements (usually the customer
    or user) should make sure that what has been produced by the project team is the
    right product (that is, it is the user expected to see). This is the validation
    process.


    +   * Doable requirements: in all cases, requirements need to be reasonable and
    achievable with existing technology (or allowance to be made if technology is
