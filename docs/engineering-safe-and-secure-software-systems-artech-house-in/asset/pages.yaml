  md: '# Introduction


    Furthermore, the usefulness of application security metrics must be examined.
    Measurements that we have and use are often not to the job, as witnessed by the
    frequent injection of malware, submission to denial of service attacks, and common
    system failures. To what extent is it a question of not using the right metrics
    versus collecting the data upon to base the metrics in the first place? The gathering
    and analysis of appropriate metrics is the basis of risk analysis. If we do not
    know what is going on inside of our soft systems, then we cannot determine the
    level of risk being incurred, and consequently, we are unable to mitigate those
    risks effectively.


    Additionally, we have supply chain issues. Can we trust commercial software and
    software developed offshore in particular? Do we know whose touched the software
    (the hardware on which it runs) during the development life cycle, deployment,
    and maintenance? Is there reason to suspect that with evil intentions have inserted
    back doors and malware into the software systems? Can we ensure not only the security
    and integrity of applications in general but also the specific code that we are
    using?


    This book addresses what the author considers to be real issues and impediments
    to the development and operation of safe and secure mission-critical, software-intensive
    systems. It does not ignore the common vulnerabilities and errors found in applications,
    as those listed in The Open Web Application Security Project (OWASP) top ten or
    The System Administration, Networking, Security Institute (SANS)/Common Weakness
    Enumeration (CWE) top twenty and described in Appendix A. Rather, It takes the
    view that these specific risks are important and must be necessarily dealt with,
    but that they alone will not solve the problem of deficient software systems.
    As we discover, merely solving these problems is not sufficient to achieve a level
    of assurance that critical software systems meet high standards of security and
    safety. What is needed is a pragmatic view of what it takes to achieve the optimal
    levels of security and safety, however optimality is defined. It is the mission
    of this book to focus on the neglected aspects of software systems engineering
    that stand the chance of our making a material improvement in the state of software,
    a state that currently is deteriorating rapidly.


    # Scope and Structure of the Book


    As mentioned previously in this book, it was to be a treatise on software assurance.
    However, it rapidly became apparent that, in order to come up with an approach
    that would cover both the security and safety of software systems, it was necessary
    to go back in time to see how software engineering has evolved over recent decades.
    We also sought to learn why there is little overlap between the areas of interest
    of security engineers and software safety en'
  merge: -1
  pgno: 25
- img_proc: true
  md: '# Engineering Safe and Secure Software Systems


    gineers. Books on software security seldom include references to software safety,
    and vice versa; it is as if party were totally oblivious as to what goes on with
    their software engineering counterparts in the other area. This book attempts
    to bridge gap between security and physical safety professionals. This approach
    recognizes that so-called cyber-physical systems evolve over time and, as they
    do, there will be an increase for those who understand both security and safety
    to interrelate.


    The first half of this book, Chapters 2 through 5, examines the history and evolution
    of systems engineering, covering software systems and the security safety attributes
    of those systems. The next section, Chapter 6 and 7, address risk issues and metrics,
    which are fundamental to the assessment and management of systems in general and
    secure and safe software systems in particular. In the next sections, Chapters
    8, 9, and 10, we describe the processes available for developing systems, with
    particular emphasis on security and software systems. Chapter 11 discusses how
    economic and behavioral factors influence the degree to which stakeholders participate
    in support security and safety features and attributes.


    Appendix A lists and explanations of programming weakness and errors as presented
    by OWASP, SANS, and others. Appendix B compares ISO/IEC 12207 and CMMI DEV process
    areas. Appendix C provides checklists in support of security-critical systems,
    and Appendix D does the same for safety-critical systems. These latter two sets
    of checklists serve two purposes. The first is to help software engineers ensure
    that they have considered a full, though not complete, set of issues relating
    to their area of specialty (namely security or safety). The second purpose is
    to enable software security engineers to learn what factors make for safe systems,
    and to help software safety engineers determine which issues are important for
    building and operating security-critical systems.


