  md: '# Engineering Safe and Secure Software Systems


    There is overlap to some extent between security and safety, for example, in the
    need for system integrity, but it is the difference in viewpoint that leads to
    divergent system designs and implementations. This divergence makes for much higher
    risk relating to combined systems of systems which must be secure and safe.


    Another perspective derives from the differences among safety, security and survivability,
    as described by Firesmith in [7]. Firesmith claims that there are many similarities
    among these three aspects, which he defines as follows:


    +   * Safety. The degree to which accidental harm is prevented, detected, and
    reacted to.

    * Security. The degree to which malicious harm is prevented, detected, and reacted
    to.

    * Survivability. The degree to which both accidental and malicious harm is prevented,
    detected, and reacted to.


    Firesmith goes to say that “[s]afety is largely about protecting valuable assets
    (especially people) from harm due to accidents,” whereas “[s]curity is largely
    about protecting valuable assets (sensitive data) from harm due to attacks,” and
    “[s]urvivability is about protecting valuable assets (essential services) from
    both accidents and attacks.


    This author prefers the Barnes approach [6] to differentiating between safety
    and security, because from the perspective of those tasked with protecting the
    data assets contained within, or accessible through, information systems or preventing
    control systems from harming the outside world, it often doesn’t make difference,
    with respect to actions taken, whether the source of an incident is accidental
    or intentional and malicious. In both situations, investigators need to determine
    the root cause of an incident and take action to prevent the same or similar future
    events from doing damage, either internally or externally. However, if an incident
    is the result of intentional activities, the response to it will likely be different
    in that law enforcement might be brought to pursue the perpetrators. If the cause
    is accidental, action against the person or persons who “allowed” the incident
    to happen may result, even if such persons had no intent or control over the situation.
    However, in the latter case, it is less likely that formal proceedings will be
    invoked.


    There is often a question as to the culpability of individuals and the fairness
    of pointing fingers at suspects. Frequently, if the cause of a security breach
    or a safety failure is found to be unintentional, action is taken against those
    currently responsible for the safe and/or operation of the affected system, despite
    the fact that they may not be in a position to prevent the incident. The root
    cause might have been deficiencies in requirements, design or'
  merge: -1
  pgno: 84
- img_proc: true
  md: 'implementation of systems or the procedures for operating them. However, it
    seems to be human nature to seek a scapegoat on whom to pile responsibility and
    punishment.


    It can be argued that survivability has more to do with resiliency and recovery
    following damage or destruction, and long-term survivability relates to the ability
    of an organization to reconstruct the damaged or destroyed operations in order
    to enable the entity to function at near the level prior to the incident.


    Yet another view on differentiating between safe and secure software systems comes
    from Barbacci [8], who represented the same institution as Firesmith, the renowned
    Software Engineering Institute of Carnegie Mellon University. Both researchers
    were writing in 2003.


    Barbacci differentiates between safety and dependability as follows:


    +   - dependability is concerned with the occurrence of failures, defined in terms
    of external consequences (services are not provided) ... safety is concerned with
