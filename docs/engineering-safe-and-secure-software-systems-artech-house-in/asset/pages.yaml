  md: '# The Economics of Software Systems'' Safety and Security 231


    Perhaps the most telling assertion in the introduction section of the report is
    that in order to construct high-assurance cyber-physical systems, there is a need
    to develop and apply a different approach from what has existed until now. DARPA
    insists that “... research should investigate innovative approaches that enable
    revolutionary advances in science or systems.


    While there is a clearly needed for innovation in this area, it is not obvious
    as to what forms development technologies should take. It is worth the effort
    to try to follow the particular research that will emanate from the BAA and that
    will be funded by DARPA in order to get some guidance as to future directions
    in creating safe and secure systems.


    However, in the meantime, there are a number of interesting approaches to improving
    the safety and security of software systems, two of which will be discussed here.
    These are relatively new methods and processes but hold promise for improving
    the safety and security of critical systems and software systems. One relates
    to tampering; the other to the-called “patterns.” The former is in the category
    of avoiding attacks by shielding (or immunizing) software systems from attacks,
    whereas the second is a process for information sharing and learning from experience,
    which has already been applied in the security areas and holds promise with respect
    to safety attributes.


    # Tampering


    It is clear from the frequency and descriptions of attacks, both successful and
    not, on software-intensive systems, and from the manner in which they are discovered,
    much of the time victims don’t even know about cyber attacks and are also ignorant
    about quite a few physical attacks. It is not always whether victims’ lack of
    knowledge about attacks having taken place stems from not detecting them or because
    the criminals are expert enough to cover up their tracks—or both.


    Experience in information security and attempts to prevent loss of valuable data—commonly
    called data leak prevention (DLP), makes one aware of the differences between
    tamper-evident, tamper-resistant, and tamperproof methods and how they might apply
    to security-critical and safety-critical software systems and the data they contain
    and handle.


    # Tamper Evidence


    In simple terms, tamper-evident means that attempts to gain access to software
    or hardware systems or media is apparent from some change in the protective logical
    or physical “tape,” which the thief is not able to remove remove evidence of tampering.
    Often, the individuals doing the tampering do not particularly care whether the
    recipient of a package or the software knows that'
