  md: '# Engineering Secure and Safe Systems, Part 2


    the better methods needed to deal with the problem at the time. Such an approach
    is far from ideal, because there is little chance of establishing appropriate
    standards and funding the implementation of those standards without a major driver,
    it will have to serve the purpose, even though it will cost many times what it
    would cost the mitigation efforts had done in advance.


    # A Note on Protection


    The general approach to security is to defend systems against attacks, thereby
    protecting information assets. With respect to safety, not only do we want systems
    not to harm humans, other life forms, and the environment, but we also look to
    protect potential victims directly through secondary means, such as manual overrides
    in the event that systems malfunction or fail to do intentional or accidental
    incidents.


    Most efforts are geared to prevention. Typically, we install intrusion detection
    and prevention systems to protect software systems against malicious attacks.
    Antivirus software is used to detect and intercept malware before it can insert
    itself into legitimate computer systems. Safety-oriented systems are prevented
    from doing damage using a specific set of failsafe methods to protect individuals,
    groups, and the environment.


    Not enough money and effort is being applied to deterrence and avoidance, relative
    to funds allocated to preventive measures. However, avoidance and deterrence are
    usually far cheaper to implement preventive approaches. For example, if the British
    royal jewels were to be secured away in an unknown location, far less effort and
    expense would be needed to guard and protect them than the real jewels were on
    display. However, it can be argued that displaying them is worth more than point
    of view in all their glory. The main argument in this case avoidance against exhibiting
    the jewels is that the public has a right to see and is paying to do so. Nevertheless,
    facsimile could be substituted, thereby avoiding much of the security issue, although
    the experience of viewers would be diminished (if they were, in fact, aware that
    they were looking at faces), except if the viewing public believed them to be
    real because of the extraordinary security precautions taken.


    Deterrence and avoidance, in particular, are the keys to attaining levels of security
    and safety that professionals in the field would like to see. However, since protection
    is seen as a responsibility of safety and security professionals, and deterrence
    and avoidance relate to business decisions, the latter are seldom included in
    the systems engineers'' toolbox. Often software-intensive systems are breached,
    or fail in a harmful way, not because they were not pro-'
  merge: -1
  pgno: 103
- img_proc: true
  md: 'tected against unwanted actions, or because they are being used for purposes
    not originally envisaged, approved, or allowed for.


    A prime example of this latter condition is the Internet itself. Originally ARPANet,
    the Internet was developed by DARPA as a highly resilient network that could be
    relied upon to continue operate even if substantial segments of the network were
    disabled or destroyed. The Internet was not designed with security in mind, nor
    safety for that matter, because the original users, mostly academics, knew and
    trusted one another and if users failed to honor appropriate security requirements,
    they were banned from using the network. Ironically, many software compromises
    usually occur because of unauthorized or unexpected access, and operations that
    were not envisaged by the creators of the software.


    Deterrence and avoidance must be included as means of reducing software risk if
    we are to have any hope of meeting the challenge. Measures are often unpopular
    because they frequently mean restricting or removing prior privileges and use.
    Also, those enforcing the restrictions will likely be accused of stymying innovation.
    Yet deterrence and avoidance, if thoughtfully, carefully, and properly applied,
    can be much more cost-effective than protective measures. At some point, when
    it is clear that protection is insufficient and critical infrastructure systems
    are on the verge of collapse, society might be taking the double of restricting
    functionality and use of such critical systems and eliminating ready access to
    sensitive information. Until then, we are left with trying to improve the quality
    of current protective measures and work on encouraging them to be used and enforced.


    Despite the expected lack of enforcement and adherence, we include deterrence
    and avoidance when considering a holistic approach to achieving safety and security
    goals. It is expected that, at some future time, society may well begin to focus
    on deterrence and, in particular, on avoidance as disappointment with protective
    measures increases.


    It should be noted that deterrence and avoidance of inappropriate access to, misuse
    of, and damage to software functionality and data can be built into software design
    and development. In particular, the design of a software-intensive system needs
    to incorporate the ability to restrict access to specific functions and data.
    For example, while a third-party identity and access management system might front-end
    a particular application, the application itself needs to interpret access restrictions
    properly and have the ability to block inappropriate functionality and data access
    In other cases, deterrence might be introduced, for example, by warning messages
    letting users know that their aberrant behavior has been identified and recorded,
    and that action will be taken in the event that users exhibit such behavior again.
    These techniques are often less costly and expensive to implement than are methods
    for protecting data, such as encryption.'
