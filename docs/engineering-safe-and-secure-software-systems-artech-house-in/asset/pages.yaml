  md: 'detailed in Table C.2. This table describes and explains the tasks to produce
    complete sets of security requirements for software systems.


    Once the security requirements have been decided upon and agreed to, by authorized
    persons, and adequate funding has been approved, the project team can embark on
    defining the security architecture and design of the software system, as described
    in Table C.3.


    The design phase produces specifications from which developers build secure software
    systems. Table C.4 describes the various tasks that will produce sufficiently
    secure software systems based upon these specifications.


    While it is expected that developers, their supervisors, and their project managers
    will check programs to ensure they operate successfully (though not necessarily
    correctly), the testing of functionality is usually left to the Quality Assurance
    department. If addressed at all, testing of nonfunctional attributes such as security
    and performance is usually handed over to subject-matter experts, either internal
    to the organization or outside consultants. Non security testing comprises the
    tasks shown in Table C.5.


    Once the software system has been thoroughly tested to assure a high level of
    security, it is ready to be deployed in the production environment. However, even
    though a software system might be intrinsically secure, its secure operation is
    highly dependent on it being securely distributed and installed, with security-oriented
    operational, support, and maintenance processes. The transition from development
    to production is a very sensitive step in the overall SSDLC and should follow
    the task areas that are described in Table C.6.


    After a software system has been deployed, it is critical to its ongoing security
    that qualified staff have specific roles in order to maintain security throughout
    the operational life of the system. Table C.7 includes the task areas necessary
    for continued security in the operation, maintenance and support of the system.


    Many publications on the Secure SDLC stop at the operations phase. However, it
    is important that the end-of-life tasks are performed in a manner that will ensure
    there are no security issues when the software systems are decommissioned and
    disposed of. These important tasks are described in Table C.8, along with reasons
    why it is so important to pay sufficient attention to this critical phase.


