  md: "ECMAScript 6 continues this tradition by making classes first-class citizens\
    \ as well, allowing you to use classes in many different ways. For example, you\
    \ can pass them into functions as arguments:\n\n```\nfunction createObject(classDef)\
    \ {\n  return new classDef();\n}\n```\n\n```\nlet obj = createObject(class {\n\
    \  sayHi() {\n    console.log(\"Hi!\");\n  });\n```\n\n```\nobj.sayHi(); // \"\
    Hi!\"\n```\n\nIn this example, the createObject() function is called with an anonymous\
    \ class expression as an argument, creates an instance of that class with new,\
    \ and returns the instance. The variable obj then stores the instance.\n\nAnother\
    \ use of class expressions is creating singletons by immediately invoking the\
    \ class constructor. To do so, you must use new with a class expression and include\
    \ parentheses at the end. For example:\n\n```\nlet person = new class {\n  constructor(name)\
    \ {\n    this.name = name;\n  }\n  sayName() {\n    console.log(this.name);\n\
    \  }\n}\n```\n\n```\nperson(\"Nicholas\");\nperson.sayName(); // \"Nicholas\"\n\
    ```\n\nHere, an anonymous class expression is created and executed immediately.\
    \ This pattern allows you to use the class syntax for creating singletons without\
    \ leaving a class reference available for inspection. The parentheses at the end\
    \ of the class expression indicate that you're calling a function and also allow\
    \ you to pass in an argument.\n\nThe examples in this chapter so far have focused\
    \ on classes with methods. But you can also create accessor properties on classes\
    \ using a syntax similar to object literals."
