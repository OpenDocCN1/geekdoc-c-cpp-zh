  pgno: 242
- img_proc: true
  md: "Both arguments to then() are optional, so you can listen for any combination\
    \ of fulfillment and rejection. For example, consider this set of then() calls:\n\
    \n```\nlet promise = readFile(\"example.txt\");\n\npromise.then(function(contents)\
    \ {\n  // fulfillment\n  console.log(contents);\n}, function(err) {\n  // rejection\n\
    \  console.error(err.message);\n});\n\nprom.then(function(contents) {\n  // fulfillment\n\
    \  console.log(contents);\n});\n\nprom.then(null, function(err) {\n  // rejection\n\
    \  console.error(err.message);\n});\n```\n\nAll three then() calls operate on\
    \ the same promise. The first call listens for fulfillment and rejection. The\
    \ second only listens for fulfillment; errors won't be reported. The third just\
    \ listens for rejection and doesn't report result.\n\nPromises also have a catch()\
    \ method that behaves the same as then() when only a rejection handler is passed.\
    \ For example, the following catch() and then() calls are functionally equivalent:\n\
    \n```\npromise.catch(function(err) {\n  // rejection\n  console.error(err.message);\n\
    });\n```\n\n// is the same as:\n\n```\npromise.then(null, function(err) {\n  //\
    \ rejection\n  console.error(err.message);\n});\n```\n\nThe then() and catch()\
    \ methods are intended to be used in combination to properly handle the result\
    \ of asynchronous operations. This system is better than using events and callbacks\
    \ because it clearly indicates whether the operation succeeded or failed completely.\
    \ Events tend not to fire when there's an error, and in callbacks you must always\
    \ remember to check the error argument.) Just know that if you don't attach a\
    \ rejection handler to a promise, all failures will happen silently. Always attach\
    \ a rejection handler, even if the handler just logs the failure."
