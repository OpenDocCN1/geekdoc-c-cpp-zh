    \ 9012\n- \"Understanding ECMAScript 6\"\n- \"ebook\"\n\nCalling the values()\
    \ iterator, as in this example, returns the exact data contained in each collection\
    \ without any information about data's location in the collection.\n\n# keys()\
    \ Iterator\n\nThe keys() iterator returns each key present in a collection. For\
    \ arrays, it returns only numeric keys; it never returns other own properties\
    \ of the array. For sets, the keys are the same as the values, keys() and values()\
    \ return the same iterator. For maps, the keys() iterator returns each unique\
    \ key. Here's an example that demonstrates all three:\n\n```\nlet colors = [ \"\
    red\", \"green\", \"blue\" ];\nlet tracking = new Set([1234, 5678, 9012]);\nlet\
    \ data = new Map();\n```\n\n```\ndata.set(\"title\", \"Understanding ECMAScript\
    \ 6\");\ndata.set(\"format\", \"ebook\");\n```\n\n```\nfor (let key of colors.keys())\
    \ {\n  console.log(key);\n}\n```\n\n```\nfor (let key of tracking.keys()) {\n\
    \  console.log(key);\n}\n```"
