    the resulting array. Thanks to this error correction behavior, typed array methods
    don''t have to throw errors when invalid data is present, because invalid data
    will never be in the array.


    # Missing Methods


    Although typed arrays have many of the same methods as regular arrays, they also
    lack several array methods. The following methods are not available on typed arrays:


    ```

    concat()          shift()

    pop()            splice()

    push()           unshift()

    ```


    Except for the concat() method, the methods in this list can change the size of
    an array. Typed arrays can''t change size, which is why these methods aren''t
    available for typed arrays. The concat() method isn''t available because'
