  md: "No iterator is specified, the default iterator functions will be used.\nThe\
    \ default iterators for arrays, sets, and maps are designed to reflect how\nthese\
    \ objects are initialized, so this code outputs the following:\n\n```\n\"red\"\
    \n\"green\"\n\"blue\"\n1234\n5678\n9012\n[\"title\", \"Understanding ECMAScript\
    \ 6\"]\n[\"format\", \"print\"]\n```\n\nArrays and sets return their values by\
    \ default, whereas maps return the\nsame array format that can be passed to the\
    \ Map constructor. On the other\nhand, weak sets and weak maps do not have built-in\
    \ iterators. Managing\nweak references means there's no way to know exactly how\
    \ many values are\nin these collections, which also means there's no way to iterate\
    \ over them.\n\n# DESTRUCTURING AND FOR-LOOPS\n\nThe behavior of the default iterator\
    \ for maps is also helpful when you use it\nfor-of loops with destructuring, as\
    \ in this example:\n\n```\nlet data = new Map();\n\ndata.set(\"title\", \"Understanding\
    \ ECMAScript 6\");\ndata.set(\"format\", \"ebook\");\n\n// as using data.entries()\n\
    for (let [key, value] of data) {\n  console.log(key + \"-\" + value);\n}\n```\n\
    \nThe for-of loop in this code uses a destructured array to assign key and\nvalue\
    \ for each entry in the map. In this way, you can easily work with keys and\n\
    values at the same time without needing to access a two-item array or going\n\
    back to the map to fetch either the key or the value. Using a destructured array\n\
    for maps makes the for-of loop equally useful for maps as it is for sets and\n\
    ararrays.\n\n# String Iterators\n\nJavaScript strings have slowly become more\
    \ like arrays since ECMAScript 5\nwas released. For example, ECMAScript 5 formalized\
    \ bracket notation\nfor accessing characters in strings (that is, using text[0])\
    \ to get the first"
