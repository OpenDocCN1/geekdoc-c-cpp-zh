  md: '# 2


    # # STRINGS AND REGULAR EXPRESSIONS


    ![](img/346dbcc81573ddc69906e98afee1e3ac_38_0.png)


    Strings are arguably one of the most important data types in programming. They''re
    in nearly every higher-level programming language, and being able to work with
    them effectively is fundamental for developers to create useful programs. By extension,
    regular expressions are important because of the extra power they give developers
    to wield strings. With these facts in mind, the creators of ECMAScript 6 improved
    strings and regular expressions by adding new capabilities and long-missing functionality.
    This chapter provides a tour of both types of changes.


    # ## Better Unicode Support


    Before ECMAScript 6, JavaScript strings assumed each 16-bit sequence, called a
    code unit, represented a single character. All string properties and methods,
    like the length property and the charAt() method, were based on'
  merge: -1
