- img_proc: true
  md: "Can't change this The value of inside the function can't be changed. It remains\
    \ the same throughout the entire life cycle of the function.\n\nNo arguments object\
    \ Because arrow functions have no arguments binding, you must rely on named and\
    \ rest parameters to access function arguments.\n\nNo duplicate named parameters\
    \ Arrow functions cannot have duplicate named parameters in strict or non-strict\
    \ mode, as opposed to non-arrow functions, which cannot have duplicate named parameters\
    \ in strict mode.\n\nThere are a few reasons for these differences. First and\
    \ foremost, binding is a common source of error in JavaScript. It's very easy\
    \ to lose track of the this value inside a function, which can result in unintended\
    \ program behavior, and arrow functions eliminate this confusion. Second, by limiting\
    \ arrow functions to simply executing code with a single value, JavaScript engines\
    \ can more easily optimize these operations, unlike regular functions, which might\
    \ be used as a constructor or otherwise modified.\n\nThe remaining differences\
    \ also focus on reducing errors and ambiguities inside arrow functions. By doing\
    \ so, JavaScript engines are better able to optimize arrow function execution.\n\
    \nArrow functions also have a name property that follows the same rule as other\
    \ functions.\n\n# Arrow Function Syntax\n\nThe syntax for arrow functions comes\
    \ in many flavors depending on what you're trying to accomplish. All variations\
    \ begin with the arrow, followed by the body of the function. The arguments and\
    \ the body can take different forms depending on usage. For example, the following\
    \ arrow function takes a single argument and simply returns it:\n\n```\nlet reflect\
    \ = value => value;\n// effectively equivalent to:\nlet reflect = function(value)\
    \ {\n  return value;\n};\n```\n\n+   * 1 argument\n\nWhen there is only one argument\
    \ for an arrow function, one argument can be used directly without any further\
    \ syntax. The arrow comes next, and the expression to the right of the arrow is\
    \ evaluated and returned. Even though there is no explicit return statement, this\
    \ arrow function will return the first argument that is passed in."
