  md: "# Duplicate Object Literal Properties\n\nECMAScript 5 strict mode introduced\
    \ a check for duplicate object literal properties that would throw an error if\
    \ a duplicate was found. For example, this code was problematic:\n\n```\n\"use\
    \ strict\";\n\nvar person = {\n  name: \"Nicholas\",\n  name: \"Greg\" // syntax\
    \ error in ES5 strict mode\n}\n```\n\nWhen running in ECMAScript 5 strict mode,\
    \ the second property causes a syntax error. But in ECMAScript 6, the duplicate\
    \ property check was removed. Strict and non-strict mode code no longer check\
    \ for duplicate properties. Instead, the last property of the given name becomes\
    \ the property's actual value, as shown here:\n\n```\n\"use strict\";\n\nvar person\
    \ = {\n  name: \"Nicholas\",\n  name: \"Greg\" // no error in ES6 strict mode\n\
    }\n\nconsole.log(person.name); // \"Greg\"\n```\n\nIn this example, the value\
    \ of person.name is \"Greg\" because that's the last value assigned to the property.\n\
    \n# Own Property Enumeration Order\n\nECMAScript 5 didn't define the enumeration\
    \ order of object properties; the JavaScript engine vendors did. However, ECMAScript\
    \ 6 strictly defines the order in which owned properties must be returned when\
    \ they are enumerated. This affects how properties are returned using Object.getOwnPropertyNames()\
    \ and Reflect.ownKeys(covered in Chapter 12). It also affects the order in which\
    \ properties are processed by Object.assign().\n\nThe basic order for own property\
    \ enumeration is:\n\n+   1. All numeric keys in ascending order\n2. All string\
    \ keys in the order in which they were added to the object\n3. All symbol keys\
    \ (covered in Chapter 6) in the order in which they were added to the object\n\
    \nHere's an example:\n\n```\nvar obj = {\n  a: 1,\n```"
