  md: "# # Identifying Arrow Functions\n\nDespite their differ syntax, arrow functions\
    \ are still functions and are identified as such. Consider the following code:\n\
    \n```\nvar comparator = (a, b) => a - b;\n\nconsole.log(typeof comparator); //\
    \ \"function\"\nconsole.log(comparator instanceof Function); // true\n```\n\n\
    The console.log() output reveals that both typeof and instanceof behave the same\
    \ with arrow functions as they do with other functions.\nAlso like other functions,\
    \ you can use call(), apply(), and bind() on arrow functions, although the binding\
    \ of the function will not be affected. Here are some examples:\n\n```\nvar sum\
    \ = (num1, num2) => num1 + num2;\n\nconsole.log(sum.call(null, 1, 2)); // 3\n\
    console.log(sum.apply(null, [1, 2])); // 3\n```\n\n```\nvar boundSum = sum.bind(null,\
    \ 1, 2);\n\nconsole.log(boundSum()); // 3\n```\n\nThe sum() function is called\
    \ using call() and apply() to pass arguments, as you'd do with any function. The\
    \ bind() method creates boundSum(), which has its arguments bound to 1 and 2 so\
    \ they don't need to be passed directly.\nArrow functions are appropriate to use\
    \ anywhere you're currently using an anonymous function expression, such as with\
    \ callbacks. The next section covers another major ECMAScript 6 development, but\
    \ this one is internal and has no new syntax.\n\n# # Tail Call Optimization\n\n\
    Perhaps the most interesting change to functions in ECMAScript 6 is an engine\
    \ optimization that changes the tail call system. A tail call is when a function\
    \ is called as the last statement in another function, like this:\n\n```\nfunction\
    \ doSomething() {\n  return doSomethingElse(); // tail call\n}\n```\n\nTail calls\
    \ as implemented in ECMAScript 5 engines are handled just like any other function\
    \ call: a new stack frame is created and pushed onto the call stack That means\
    \ every previous stack frame is kept in memory, which is problematic when the\
    \ call stack gets too large."
  merge: -1
  pgno: 86
- img_proc: true
  md: "# How Tail Calls Are Different in ECMAScript 6\n\nECMAScript 6 reduces the\
    \ size of the call stack for certain tail calls in strict mode (non-strict tail\
    \ calls are left untouched). With this optimization, instead of creating a new\
    \ stack frame for a tail call, the current stack frame is cleared and reused as\
    \ long as the following conditions are met:\n\n+   - The tail call does not require\
    \ access to variables in the current stack frame (meaning the function is not\
    \ a closure).\n- The function making the tail call has no further work to do after\
    \ the tail call returns.\n- The result of the tail call is returned as the function\
    \ value.\n\nAs an example, this code can easily be optimized because it fits all\
    \ three criteria:\n\n```\n\"use strict\";\n\nfunction doSomething() {\n  // optimized\n\
    \  return doSomethingElse();\n}\n```\n\nThis function makes a tail call to doSomethingElse(),\
    \ returns the result immediately, and doesn't access any variables in the local\
    \ scope. One small change, not returning the result, results in an unoptimized\
    \ function:\n\n```\n\"use strict\";\n\nfunction doSomething() {\n  // not optimized\
    \ - no return\n  doSomethingElse();\n}\n```\n\nSimilarly, if you have a function\
    \ that performs an operation after returning from the tail call, the function\
    \ can't be optimized:\n\n```\n\"use strict\";\n\nfunction doSomething() {\n  //\
    \ not optimized - must add after returning\n  return 1 + doSomethingElse();\n\
    }\n```\n\nThis example adds the result of doSomethingElse() with 1 before returning\
    \ the value, and that's enough to turn off optimization."
  merge: -1
  pgno: 87
- img_proc: true
  md: "Another common way to inadvertently turn off optimization is to store the result\
    \ of a function call in a variable and then return the result, such as:\n\n```\n\
    \"use strict\";\nn\nfunction doSomething() {\n  // not optimized - call isn't\
    \ in tail position\n  var result = doSomethingElse();\n  return result;\n}\n```\n\
    \nThis example cannot be optimized because the value of doSomethingElse() isn't\
    \ immediately returned.\nPerhaps the hardest situation to avoid is in using closures.\
    \ Because a closure has access to variables in the containing scope, tail call\
    \ optimization may be turned off. For example:\n\n```\n\"use strict\";\n\nfunction\
    \ doSomething() {\n  var num = 1,\n  func = () => num;\n\n  // not optimized -\
    \ function is a closure\n  return func();\n}\n```\n\nThe closure func() has access\
    \ to the local variable num in this example. Even though the call to func() immediately\
    \ returns the result, optimization can't occur due to referencing the variable\
    \ num.\n\n# How to Harness Tail Call Optimization\n\nIn practice, tail call optimization\
    \ happens behind the scenes, so you don't need to think about it unless you're\
    \ trying to optimize a function. The primary use case for tail call optimization\
    \ is in recursive functions, because that is where the optimization has the greatest\
    \ effect. Consider this function, which computes factorials:\n\n```\nfunction\
    \ factorial(n) {\n\n  if (n <= 1) {\n    return 1;\n  } else {\n\n    // not optimized\
    \ - must multiply after returning\n    return n * factorial(n - 1);\n  }\n}\n\
    ```"
