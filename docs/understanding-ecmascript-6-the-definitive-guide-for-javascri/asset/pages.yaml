    ![](img/346dbcc81573ddc69906e98afee1e3ac_308_0.png)


    JavaScript’s “shared everything” approach

    to loading code is one of the most error-

    prone and confusing aspects of the language.


    Other languages use concepts such as packages

    to define code scope, but before ECMAScript 6, every-

    thing defined in every JavaScript file of an application

    shared one global scope. As web applications became more complex and

    started using even more JavaScript code, that approach caused problems,

    such as naming collisions and security concerns. One goal of ECMAScript 6

    was to solve the scope problem and bring some order to JavaScript applic-

    tions. That’s where modules come in.


    # What Are Modules?


    A module is JavaScript code that automatically runs in strict mode with no

    way to opt out. Contrary to a shared-everything architecture'
