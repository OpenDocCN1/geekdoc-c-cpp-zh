  md: '# Weak Sets


    The Set type could be called a strong set because of the way it stores object
    references. Storing an object in an instance of Set is effectively the same as
    storing that object inside a variable. As long as a reference to that Set instance
    exists, the object cannot be garbage-collected to free memory. For example:


    ```

    let set = new Set();

    key = {};


    set.add(key);

    console.log(set.size); // 1


    // eliminate original reference

    key = null;


    console.log(set.size); // 1


    // get the original reference back

    key = [...set][0];

    ```


    In this example, setting key to null clears one reference of the key object, but
    another remains inside set. You can still retrieve key by converting the set to
    an array using the spread operator and accessing the first item. That works fine
    for most programs, but sometimes it''s best for references in a set to disappear
    when all other references disappear. For, if your JavaScript code is running in
    a web page and needs to keep track of DOM elements that might be removed by another
    script, you don''t want your code holding onto the last reference to a DOM element.
    (That situation is called a memory leak)


    To address such issues, ECMAScript 6 also includes weak sets, which only store
    object references and cannot store primitive values. A weak reference to an object
    doesn''t prevent garbage collection if it''s the only remaining reference.


    # Creating Weak Sets


    Weak sets are created using the WeakSet constructor and have an add() method,
    a has() method, and a delete() method. Here''s an example that uses all:


    ```

    let set = new WeakSet();

