- img_proc: true
  md: "Light gray highlights the first call to next() and all the code inside the\
    \ generator as a result. Medium gray represents the call to next(4) and the code\
    \ that is executed with that call. Dark gray represents the call that is executed\
    \ as next(5) and the code that is executed as a result. The tricky part is how\
    \ the code on the right side of each execution executes and stops before the left\
    \ is executed. This makes debugging complicated generators a bit more involved\
    \ than debugging regular functions.\n\nYou've seen that yield act like return\
    \ when a value is passed to the next() method, but that's not the only execution\
    \ trick you can do inside a generator. You can also cause iterators to throw an\
    \ error.\n\n# Throwing Errors in Iterators\n\nIt's possible to not not just data\
    \ into iterators, but also error conditions. Iterators can implement a throw()\
    \ method that instructs the iterator to throw an error when it resumes. This is\
    \ an important capability for asynchronous programming but also for flexibility\
    \ inside generators, where you might be able to mimic return values and throw\
    \ errors (the two ways of exiting a function). You can pass an error object to\
    \ throw() that should be thrown when the iterator continues processing. For example:\n\
    \n```\nfunction *createIterator() {\n  let first = yield 1;\n  let second = yield\
    \ first + 2; // yield 4 + 2, then\n  yield second + 3; // never is executed\n\
    }\n\nlet iterator = createIterator();\n\nconsole.log(iterator.next()); // \"{value:\
