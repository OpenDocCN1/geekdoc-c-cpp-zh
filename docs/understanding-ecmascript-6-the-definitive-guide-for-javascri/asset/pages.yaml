  md: '# Browser Module Specifier Resolution


    All examples to this point in the chapter have used a relative path (as in the
    string "./example.js") for the module specifier. Browsers require module specifiers
    to be in one of the following formats:


    +   - Begin with / to resolve from the root directory

    - Begin with ./ to resolve from the current directory

    - Begin with ../ to resolve from the parent directory

    - URL format


    For example, suppose you have a module file located at https://www.example.com/modules/module.js
    that contains the following code:


    ```

    // imports from https://www.example.com/modules/example1.js

    import { first } from "./example1.js";


    // imports from https://www.example.com/example2.js

    import { second } from "../example2.js";


    // imports from https://www.example.com/example3.js

    import { third } from "../example3.js";


    // imports from https://www2.example.com/example4.js

    import { fourth } from "https://www2.example.com/example4.js";

    ```


    Each module specifier in this example is valid for use in a browser, including
    the complete URL in the final line. (You''d just to be sure www2.example.com has
    properly configured its CORS headers to allow cross-domain resolve by default,
    though the only-not-yet-complete module loader specifiers will provide ways to
    resolve other modules.


    Until then, some normal-looking module specifiers are actually invalid in browsers
    and will result in an error, such as:


    ```

    // invalid - doesn''t begin with /, ./, or ../

    import { first } from "example.js";


    // invalid - doesn''t begin with /, ./, or ../

    import { second } from "example/index.js";

    ```


    Each of these module specifiers cannot be loaded by a browser. The two module
    specifiers are in an invalid format (missing the correct beginning characters),
    even though both will work when used as the value of src in a <script> tag. This
    is an intentional difference in behavior between <script> and import.'
