  md: '# # 4


    EXPANDED OBJECT FUNCTIONALITY


    ![](img/346dbcc81573ddc69906e98afee1e3ac_92_0.png)


    ECMAScript 6 focuses heavily on making objects more useful, which makes sense
    because nearly every value in JavaScript is some type of object. The number of
    objects developers use in an average JavaScript program continues to increase
    as the complexity of JavaScript applications increases. With more objects in a
    program, it has become necessary to use them more effectively.


    ECMAScript 6 improves the use of objects in a number of ways, from simple syntax
    extensions to options for manipulating and interacting with them, and this chapter
    covers these improvements in detail.'
