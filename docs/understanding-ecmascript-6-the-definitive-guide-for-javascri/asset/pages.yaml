    # # New Methods on All Arrays


    Continuing the trend from ECMAScript 5, ECMAScript 6 adds several new methods
    to arrays. The find() and indexOf() methods are meant to develop arrays with any
    values, while fill() and copyWithin() are inspired by use cases for typed arrays,
    a form of array introduced in ECMAScript 6 that uses only numbers.


    # ## find() and indexOf() Methods


    Prior to ECMAScript 5, searching through arrays was cumbersome there were no built-in
    methods for doing so. ECMAScript 5 added the indexOf() and lastIndexOf() methods,
    which finally allowed developers to search for specific values inside an array.
    These two methods were a big improvement, yet they were still fairly limited because
    you could search for only one value at a time. For example, if you wanted to find
    the first even number in a series of numbers, you''d need to write your code to
    do so. ECMAScript 6 solved that problem by introducing the find() and indexOf()
    methods.


    Both find() and indexOf() accept two arguments: a callback function and an optional
    value to use inside the callback function. The callback function is passed as
    an array element, the same arguments passed to methods in the array, and the actual
    array—same arguments as map() and forEach(). The callback should return true if
    the given value matches some criteria you define. Both find() and indexOf() also
    stop searching the array first time the callback function returns true.


    The only difference between these methods is that find() returns the value, whereas
    indexOf() returns the index at which the value was found. Here''s an example to
    demonstrate:


    ```

    let numbers = [25, 30, 35, 40, 45];

    console.log(numbers.find(n => n > 33)); // 35

    console.log(numbers.indexOf(n => n > 33)); // 2

    ```


    This code calls find() and indexOf() to locate the first value in the numbers
    array that is greater than 33. The call to find() returns 35 and indexOf() returns
    2, the location of 35 in the numbers array.'
