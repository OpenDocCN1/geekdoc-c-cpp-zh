    \ an arrow function:\n\n```\nlet PageHandler = {\n  id: \"123456\",\n  init: function()\
    \ {\n    document.addEventListener(\"click\",\n      event => this.doSomething(event.type),\
    \ false);\n  },\n  doSomething: function(type) {\n    console.log(\"Handling \"\
    \ + type + \" for \" + this.id);\n  }\n};\n```\n\nThe event handler in this example\
    \ is an arrow function that calls this.doSomething(). The value of this is the\
    \ same as it is within init(), so this version of the code works similarly to\
    \ the one using bind(this). Even though the doSomething() method does not return\
