  md: "# Functions with Default JavaScript Values\n\nFunctions in JavaScript are unique\
    \ in that they allow number of parameters to be passed regardless of the number\
    \ of parameters declared in the function definition. This allows you to define\
    \ functions that can handle different numbers of parameters, often by filling\
    \ in default values when parameters aren't provided. This section covers how default\
    \ parameters work in and prior to ECMAScript 6, along with some important information\
    \ on the arguments object, using expressions as parameters, and another TDZ.\n\
    \n# Simulating Default Parameter Values in ECMAScript 5\n\nIn ECMAScript 5 and\
    \ earlier, you would likely use the following pattern to create a function with\
    \ default parameter values:\n\n```\nfunction makeRequest(url, timeout, callback)\
    \ {\n\n  timeout = timeout || 2000;\n  callback = callback || function() {};\n\
    \n// the rest of the function\n}\n```\n\nIn this example, timeout and callback\
    \ are actually optional because they are given a default value if a parameter\
    \ isn't provided. The logical OR operator (||) always returns the second operand\
    \ when the first is falsy. Because named function parameters that are not explicitly\
    \ provided are set to undefined, the logical OR operator is frequently used to\
    \ provide default values for missing parameters. However, a flaw exists with this\
    \ approach in a valid value for timeout might actually be 0, but this would replace\
    \ it with 2000 because 0 is falsy.\n\nIn that case, a safer alternative is to\
    \ check the type of the argument using type, as in this example:\n\n```\nfunction\
    \ makeRequest(url, timeout, callback) {\n\n  timeout = (typeof timeout !===\"\
    undefined\") ? timeout : 2000;\n  callback = (typeof callback !===\"undefined\"\
    ) ? callback : function() {};\n\n// the rest of the function\n}\n```\n\nAlthough\
    \ this approach is safer, it still requires a lot of extra code to execute a very\
    \ basic operation. This approach represents a common pattern, and popular JavaScript\
    \ libraries are filled with similar patterns."
  merge: -1
