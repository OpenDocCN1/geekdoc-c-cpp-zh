  md: "Overwriting method defined with a well-known symbol changes an ordinary object\
    \ to an exotic object because some internal behavior is changed. There is no practical\
    \ impact on your code as a result; the way the specification describes the object\
    \ just changes.\n\n# The Symbol.hasInstance Method\n\nEvery function has a Symbol.hasInstance\
    \ method that determines whether or not a given object is an instance of function.\
    \ The method is defined on Function.prototype so all functions inherit the default\
    \ instanceof property, and the method is nonwritable and nonconfigurable as well\
    \ as nonenumerable to ensure it doesn't get overwritten by mistake.\n\nThe Symbol.hasInstance\
    \ method accepts a single argument: the value to check. It returns true if the\
    \ value passed is an instance of the function. To understand how Symbol.hasInstance\
    \ works, consider the following:\n\n```\nobj instanceArray;\n```\n\nThis code\
    \ is equivalent to the following:\n\n```\nArray[Symbol.hasInstance](obj);\n```\n\
    \nECMAScript 6 essentially redefined the instanceof operator as short-syntax for\
    \ this method call. And now that a method call is involved, you can actually change\
    \ how instanceof works.\n\nFor instance, suppose you want to define a function\
    \ that claims no object as an instance. You can do so by hardcoding the return\
    \ value of Symbol.hasInstance to false, such as:\n\n```\nfunction MyObject() {\n\
    \  // empty\n}\n```\n\n```\nObject.defineProperty(MyObject, Symbol.hasInstance,\
    \ {\n  value: function(v) {\n    return false;\n  }\n});\n```\n\n```\nlet obj\
