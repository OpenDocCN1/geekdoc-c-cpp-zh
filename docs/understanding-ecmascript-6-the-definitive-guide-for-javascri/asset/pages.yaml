  md: '# Reading and Writing Data


    For each of JavaScript''s eight numeric types, the DataView prototype has a method
    to write data and a method to read data from an array buffer. The method names
    begin with either set or get and are followed by the data type abbreviation. For
    instance, here''s a list of the read and write methods that can operate on int8
    and uint8 values:


    +   - getInt8(byteOffset, littleEndian) Read an int8 starting at byteOffset

    - setInt8(byteOffset, value, littleEndian) Write an int8 starting at byteOffset

    - getUint8(byteOffset, littleEndian) Read a uint8 starting at byteOffset

    - setUint8(byteOffset, value, littleEndian) Write a uint8 starting at byteOffset


    The methods accept two arguments: the byte offset to read from and an optional
    Boolean indicating whether the value should be read as little-endian. (Little-endian
    means the least significant bit is at 0 instead of the last byte.) The methods
    accept three arguments: the byte offset to write, the value to write, and an optional
    Boolean indicating whether the value should be stored in little-endian format.


    Although I''ve only shown the methods you can use with 8-bit values, the same
    methods exist for operating on 16- and 32-bit values. Replace the 8 in each name
    with 16 or 32. In addition to those integer methods, DataView also has the following
    read and write methods for floating-point numbers:


    ```

    getFloat32(byteOffset, littleEndian) Read a float32 starting at byteOffset

    setFloat32(byteOffset, value, littleEndian) Write a float32 starting at byteOffset

    getFloat64(byteOffset, littleEndian) Read a float64 starting at byteOffset

    setFloat64(byteOffset, value, littleEndian) Write a float64 starting at byteOffset

    ```


    The following example shows a set and a get method in action:


    ```

    let buffer = new ArrayBuffer(2);

    view = new DataView(buffer);


    view.setInt8(0, 5);

    view.setInt8(1, -1);


    console.log(view.getInt8(0)); // 5

    console.log(view.getInt8(1)); // -1

    ```


    This code uses a two-byte array buffer to store two int8 values. The first value
    is set at offset 0, and the second is at offset 1, reflecting that each value
    spans a full byte (8 bits). Those values are later retrieved from their positions'
