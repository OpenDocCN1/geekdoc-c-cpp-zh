  md: "This example shows that although it's possible to do everything classes\ndo\
    \ without using the new syntax, the class syntax simplifies the functional-\n\
    ity significantly.\n\n# CONSTANT CLASS NAMES\n\nThe class name is only constant\
    \ inside the class itself. That means you can\noverwrite the class name outside\
    \ the class but not inside a class method. For\nexample:\n\n```\nclass Foo {\n\
    \  constructor() {\n    Foo = \"bar\"; // throws an error when executed...\n \
    \ }\n}\n\n// but this is okay after the class declaration\nFoo = \"baz\";\n```\n\
    \nIn this code, the Foo inside the class constructor is a separate binding from\n\
    Foo outside the class. The internal Foo is defined as if it's a const and cannot\n\
    be overwritten. An error is thrown when the constructor attempts to overwrite\n\
    Foo with any value. But because the external Foo is defined as if it's a let decl-\n\
    ation, you can overwrite its value at any time.\n\n# Class Expressions\n\nClasses\
    \ and functions are similar in that they have two forms: declarations\nand expressions.\
    \ Function and class declarations begin with an appropriate\nkeyword (function\
    \ or class, respectively) followed by an identifier. Functions\nhave an expression\
    \ form that doesn't require an identifier after function;\nsilarly, classes have\
    \ an expression form that doesn't require an identifier\nafter class. These class\
    \ expressions are designed to be used in variable decl-\nar or passed into functions\
    \ as arguments.\n\n# A Basic Class Expression\n\nHere's the class expression equivalent\
    \ of the previous PersonClass examples,\nfollowed by some code that uses it:\n\
    \n```\nlet PersonClass = class {\n\n// equivalent of the PersonType constructor\n\
    constructor(name) {\n  this.name = name;\n}\n```"
