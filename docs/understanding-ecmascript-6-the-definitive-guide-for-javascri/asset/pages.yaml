  md: '# Summary


    ECMAScript 6 adds modules to the language as a way to package and encapsulate
    functionality. Modules behave differently than scripts in that they do not modify
    the global scope with their top-level variables, functions, and classes, and this
    is undefined. To achieve that behavior, modules are loaded using a different mode.


    You export any functionality you want to make available to consumers of a module.
    Variables, functions, and classes can all be exported, and there is also one default
    export allowed per module. After exporting, another module can import all or some
    of the exported names. names act as though they were defined by let and operate
    as block bindings that cannot be redeclared in the same module.


    Modules don''t need to export anything if they''re manipulating something in the
    global scope. You can actually import from such a module without introducing any
    bindings into the module scope.


    Because modules must run in a different mode, browsers introduced <script type="module">
    to signal that the source file or inline code should be executed as a module.
    Module files loaded with <script type="module"> are loaded as though the defer
    attribute is applied to them. Modules are also executed in the order in which
    they appear in the containing document after the document is fully parsed.'
