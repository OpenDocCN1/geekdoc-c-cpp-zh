  md: '# 8


    # # ITERATORS AND GENERATORS


    ![](img/346dbcc81573ddc69906e98afee1e3ac_162_0.png)


    Many programming languages have shifted from iterating over data with loops, which
    requires initializing variables to track position in a collection, to using iterator
    objects that programmatically return the next item in a collection. Iterators
    make working with collections of data easier, and ECMAScript adds iterators to
    JavaScript. When coupled with new array methods and new types of collections (such
    as sets and maps), iterators are essential for efficient data processing and you
    will find them in many parts of the language. The new for-of loop works with iterators;
    the spread operator (...) uses iterators; and even asynchronous programming can
    use iterators.


    This chapter covers the many uses of iterators, but before discussing those, it''s
    important to understand the history behind why iterators were added to JavaScript.'
