  md: 'This code converts a regular expression into a string and returns the characters
    found after the last /. Those characters are the flags.

    ECMAScript 6 makes flags easier by adding a flags property to pair with the source
    property. Both properties are prototype accessor properties with only a getter,
    making them read-only. The flags property makes inspecting regular expression
    easier for debugging and inheritance purposes.

    A late addition to ECMAScript 6, the flags property returns the string representation
    of any flags applied to a regular expression. For example:


    let re = /ab/g;


    ```

    console.log(re.source); // "ab"

    console.log(re.flags); // "g"

    ```


    This code fetches all flags on re and prints them to the console with fewer lines
    of code than the toString() technique. Using source and flags allows you to extract
    the pieces of the regular expression that you need without parsing the regular
    expression directly.


    The changes to strings and regular expressions discussed in this chapter so far
    definitely allow you to do more with, but ECMAScript 6 improves your power over
    strings in a more significant way. It introduces a type of literal that makes
    strings more flexible.


    # Template Literals


    To allow developers to solve more complex problems, ECMAScript 6''s template literals
    provide syntax for creating domain-specific languages (DSLs) for working with
    content in a safer way than the solutions available in ECMAScript 5 and earlier
    versions. A DSL is a programming language designed for a specific, narrow purpose,
    as opposed to general-purpose languages like JavaScript. The ECMAScript wiki (http://wiki.ecmascript.org/doku.php?id=harmony/quasis/)
    offers the following description on the template literal string:


    This scheme extends ECMAScript syntax with syntactic sugar to allow libraries
    to easily produce DSLs, query, and manipulate content from other languages that
    are immune or resistant to injection attacks such as XSS, SQL Injection, etc.


    But in reality, template literals are ECMAScript 6''s answer to the following
    features that JavaScript lacked in ECMAScript 5 and in earlier versions:


    +   - Multiline A formal concept of multiline strings


    +   - Basic string formatting The ability to substitute parts of the string for
    values contained in variables


    +   - HTML escaping The ability to transform a string so it is safe to insert
    into HTML'
