  md: "# Generator Object Methods\n\nBecause generators are just functions, you can\
    \ add them to objects, too. For example, you can make a generator in an ECMAScript\
    \ 5-style object literal with a function expression, like this:\n\n```\nlet o\
    \ = {\n  createIterator: function *(items) {\n    for (let i = 0; i < items.length;\
    \ i++) {\n      yield items[i];\n    }\n  }\n};\nlet iterator = o.createIterator([1,\
    \ 2, 3]);\n```\n\nYou can also use the ECMAScript 6 method shorthand by prepending\
    \ the method name with an asterisk (*), as shown here:\n\n```\nlet o = {\n  *createIterator(items)\
    \ {\n    for (let i = 0; i < items.length; i++) {\n      yield items[i];\n   \
    \ }\n  }\n};\nlet iterator = o.createIterator([1, 2, 3]);\n```\n\nThese examples\
    \ are functionally equivalent to the example in the previous section; just use\
    \ different syntax. In the shorthand version, because the createIterator() method\
    \ is defined with no function keyword, the asterisk is placed immediately before\
    \ the method name, although you can leave whitespace between the asterisk and\
    \ the method name.\n\n# Iterables and for-of Loops\n\nClosely related to iterators,\
    \ an iterable is an object with a Symbol.iterator property. The well-known Symbol.iterator\
    \ symbol specifies a function that returns an iterator for the given object. All\
    \ collection objects (arrays, sets, and maps) and strings are iterables in ECMAScript\
    \ 6, so they have a default iterator specified. Iterables are designed to be used\
    \ with a new addition to ECMAScript: the for-of loop.\n\n> NOTE All iterators\
    \ created by generators are also iterables, because generators assign the Symbol.iterator\
    \ property by default."
  merge: -1
