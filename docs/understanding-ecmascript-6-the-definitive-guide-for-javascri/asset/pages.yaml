    # # The Spread Operator


    Closely related to rest parameters is the spread operator. Whereas rest parameters
    allow you to specify multiple independent arguments should be combined into an
    array, the spread operator allows you to specify an array that should be split
    and passed as separate arguments to a function. Consider the built-in Math.max()
    method, which accepts any number of arguments and returns the one with the highest
    value. Here''s a simple use case for this method:


    ```

    let value1 = 25,

    value2 = 50;


    console.log(Math.max(value1, value2)); // 50

    ```


    When you''re working with just two values, as in this example, Math.max() is very
    easy to use. The two values are passed in, and the higher value is returned. But
    what if you''ve been tracking values in an array, and now you want to find the
    highest value? The Math.max() method doesn''t allow you to pass in an array, so
    in ECMAScript 5 and earlier, you''d be stuck searching the array manually or using
    apply() as follows:


    +   - let values = [25, 50, 75, 100]


    ```

    console.log(Math.max.apply(Math, values)); // 100

    ```


    This solution works, but apply() in this manner is a bit confusing. It actually
    seems to obfuscate the true meaning of the code with additional syntax.


    The ECMAScript 6 spread operator makes this case very simple. Instead of calling
    apply(), you can pass the array to Math.max() directly and prefix it with the
    same ... pattern with rest parameters. The JavaScript engine splits the array
    into individual arguments and passes them in, like this:


    +   - equivalent to

    // [25, 50, 75, 100]


    ```

    // console.log(Math.max(25, 50, 75, 100));

    console.log(Math.max(...values)); // 100

    ```


    Now the call to Math.max() looks a bit more conventional and avoids the complexity
    of specifying this binding (the first argument to Math.max.apply() in the previous
    example) for a simple mathematical operation.'
