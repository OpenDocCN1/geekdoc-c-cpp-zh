  md: "# The Promise.all() Method\n\nPromise.all() method accepts a single argument,\
    \ which is an iterable\n(such as an array) of promises to monitor, and returns\
    \ a promise that is\nresolved only when every promise in the iterable is resolved.\
    \ The returned\npromise is fulfilled when every promise in the iterable is fulfilled,\
    \ as in this\nexample:\n\n```\nlet p1 = new Promise(function(resolve, reject)\
    \ {\n  resolve(42);\n});\n\nlet p2 = new Promise(function(resolve, reject) {\n\
    \  resolve(43);\n});\n\nlet p3 = new Promise(function(resolve, reject) {\n  resolve(44);\n\
    });\n\nlet p4 = Promise.all([p1, p2, p3]);\n\np4.then(function(value) {\n  console.log(Array.isArray(value));\
    \ // true\n  console.log(value[0]); // 42\n  console.log(value[1]); // 43\n  console.log(value[2]);\
    \ // 44\n});\n```\n\nEach promise here resolves with a number. The call to Promise.all()\n\
    creates promise p4, which is ultimately fulfilled when promises p1, p2, and p3\n\
    are fulfilled. The result passed to the fulfillment handler for p4 is an array\n\
    containing each resolved value: 42, 43, and 44. The values are stored in the\n\
    order the promises were passed to Promise.all(), so you can match promise\nresults\
    \ to the promises that resolved to them.\n\nIf any promise passed to Promise.all()\
    \ is rejected, the returned promise\nis immediately rejected without waiting for\
    \ the other promises to complete:\n\n```\nlet p1 = new Promise(function(resolve,\
    \ reject) {\n  resolve(42);\n});\n\nlet p2 = new Promise(function(resolve, reject)\
    \ {\n  reject(43);\n});\n\nlet p3 = new Promise(function(resolve, reject) {\n\
    \  resolve(44);\n});\n\nlet p4 = Promise.all([p1, p2, p3]);\n```"
