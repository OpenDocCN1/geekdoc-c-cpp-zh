  md: '# Table 10-1: Some Type-Specific Views in ECMAScript 6


    | Constructor name | Element size (in bytes) | Description | Equivalent C type
    |

    | --- | --- | --- | --- |

    | Int8Array | 1 | 8-bit two''s complement signed integer | signed char |

    | Uint8Array | 1 | 8-bit unsigned integer | unsigned char |

    | Uint8ClampedArray | 1 | 8-bit unsigned integer (clamped conversion) | unsigned
    char |

    | Int16Array | 2 | 16-bit two''s complement signed integer | short |

    | Uint16Array | 2 | 16-bit unsigned integer | unsigned short |

    | Int32Array | 4 | 32-bit two''s complement signed integer | int |

    | Uint32Array | 4 | 32-bit unsigned integer | int |

    | Float32Array | 4 | 32-bit IEEE floating point | float |

    | Float64Array | 8 | 64-bit IEEE floating point | double |


    The Constructor name column lists the typed array constructors, and the other
    columns describe what each typed array can contain. Uint8ClampedArray is the same
    as a Uint8Array unless values in the buffer are less than 0 or greater than 255.
    A Uint8ClampedArray converts values less than 0 to 0 (-becomes 0, for instance)
    and converts values greater than 255 to 255 (so 300 becomes 255).


    Typed array operations only work on a particular type of data. For example, all
    operations on Int8Array use int8 values. The size of an element in a typed array
    also depends on the type of array. Although an element in an Int8Array is a single
    byte long, Float64Array uses eight bytes per element. Fortunately, the elements
    are accessed using numeric indexes just like regular arrays, allowing you to avoid
    the somewhat awkward calls to the set and get methods of DataView.


    # Creating Type-Specific Views


    Typed array constructors accept multiple types of arguments, so you can create
    typed arrays in a few ways. By passing the same arguments as DataView (an array
    buffer, an optional offset, and an optional byte length). For example:


    ```

    let buffer = new ArrayBuffer(10),

    view1 = new Int8Array(buffer),

    view2 = new Int8Array(buffer, 5, 2);

    console.log(view1.buffer === buffer); // true

    console.log(view2.buffer === buffer); // true

    console.log(view1.byteOffset);      // 0

    console.log(view2.byteOffset);      // 5

    ```'
