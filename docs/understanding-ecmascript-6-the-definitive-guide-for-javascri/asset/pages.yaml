  md: "The mixin() function iterates over the own properties of supplier and\ncopies\
    \ them onto receiver (a shallow copy, where object references are\nshared when\
    \ property values are objects). This allows the receiver to gain\nnew properties\
    \ without inheritance, as in this code:\n\n```\nfunction EventTarget() { /*...*/\
    \ */ }\nEventTarget.prototype = {\n  constructor: EventTarget,\n  emit: function()\
    \ { /*...*/ */ },\n  on: function() { /*...*/ */ }\n}\n```\n\n```\nvar myObject\
    \ = {};\nmixin(myObject, EventTarget.prototype);\n```\n\nmyObject.emit(\"somethingChanged\"\
    );\n\nHere, myObject receives behavior from the EventTarget.prototype object.\n\
    This gives myObject the ability to publish events and subscribe to them\nthe emit()\
    \ and on() methods, respectively.\n\nThis mixin pattern became popular enough\
    \ that ECMAScript 6\nadded Object.assign() method, which assigns the same way,\
    \ accepting\na receiver and any number of suppliers and returning the receiver.\n\
    The name from mixin() to assign() reflects the actual operation\nthat occurs.\
    \ Because the mixin() function uses the assignment operator (=),\nit cannot copy\
    \ accessor properties to the receiver as accessor properties.\nThe name Object.assign()\
    \ was chosen to reflect this distinction.\n\nSimilar methods in various libraries\
    \ might have other names for the same basic\nfunctionality; popular alternates\
    \ include the extend() and mix() methods. In addi-\nto the Object.assign() method,\
    \ an Object.mixin() method was briefly added\nin ECMAScript 6. The primary difference\
    \ was that Object.mixin() also copied over\naccessor properties, but the method\
    \ was removed due to concerns over the use of super\n(discussed in \"Easy Prototype\
    \ Access with Super References\" on page 77).\n\nYou can use Object.assign() anywhere\
    \ you would have used the mixin()\nfunction. Here's an example:\n\n```\nfunction\
    \ EventTarget() { /*...*/ */ }\nEventTarget.prototype = {\n  constructor: EventTarget,\n\
    \  emit: function() { /*...*/ */ },\n  on: function() { /*...*/ */ }\n}\n```\n\
    \n```\nvar myObject = {};\nObject.assign(myObject, EventTarget.prototype);\n```\n\
    \nmyObject.emit(\"somethingChanged\");"
