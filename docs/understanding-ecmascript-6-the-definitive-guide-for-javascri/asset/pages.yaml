  md: "In this example, the call to add(undefined, 1) throws an error because second\
    \ hasn't yet initialized when first is initialized. At that point, second is in\
    \ the TDZ and therefore any references to second throw an error. This example\
    \ mirrors the behavior of let bindings discussed in Chapter 1.\n\nFunction parameters\
    \ have their own scope and their own TDZ that is separate from the function body\
    \ scope. That means the default value of a parameter cannot access any variables\
    \ inside the function body.\n\n# Working with Unnamed Parameters\n\nSo far, the\
    \ examples in this chapter have only covered parameters that have been named in\
    \ the function definition. However, JavaScript functions don't limit the number\
    \ of parameters that can be passed to the number of named parameters defined.\
    \ You can always pass fewer or more parameters than formally specified. Default\
    \ parameter values make it clear when a function can accept fewer parameters,\
    \ and ECMAScript 6 makes the problem of passing more parameters than defined better\
    \ well.\n\n# Unnamed Parameters in ECMAScript 5\n\nEarly on, JavaScript provides\
    \ the arguments object as a way to inspect all function parameters that are passed\
    \ without necessarily defining each parameter. Although inspecting arguments works\
    \ fine in most cases, the object can be a bit cumbersome to work with. For example,\
    \ examine this code, which inspect the arguments object:\n\n```\nfunction pick(object)\
    \ {\n  let result = Object.create(null);\n\n  // start at the second parameter\n\
    \  for (let i = 1, len = arguments.length; i < len; i++) {\n    result[arguments[i]]\
    \ = object[arguments[i]];\n  }\n\n  return result;\n}\n```\n\n```\nlet book =\
    \ {\n  title: \"Understanding ECMAScript 6\",\n  author: \"Nicholas C. Zakas\"\
    ,\n  year: 2016\n};\n```\n\n```\nlet bookData = pick(book, \"author\", \"year\"\
    ); // \"Nicholas C. Zakas\"\nconsole.log(bookData.author); // 2016\nconsole.log(bookData.year);\n\
    ```"
