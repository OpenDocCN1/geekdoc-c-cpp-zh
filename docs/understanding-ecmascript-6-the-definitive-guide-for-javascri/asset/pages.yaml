    \ is called. The second then() fulfillment handler is only called after the first\
    \ promise has resolved. If you unchain this example, it looks like this:\n\n```\n\
    let p1 = new Promise(function(resolve, reject) {\n  resolve(42);\n});\n```\n\n\
    ```\nlet p2 = p1.then(function(value) {\n  console.log(value);\n})\np2.then(function()\
    \ {\n  console.log(\"Finished\");\n});\n```\n\nIn this unchained version of the\
    \ code, the result of p1.then() is stored in p2, and p2.then() is called to add\
    \ the final fulfillment handler. As you might have guessed, the call to p2.then()\
    \ also returns a promise, but this example just doesn't use that promise.\n\n\
    # Catching Errors\n\nPromise chaining allows you to catch errors that may occur\
    \ in a fulfillment or rejection handler from a previous promise. For example:\n\
    \n```\nlet p1 = new Promise(function(resolve, reject) {\n  resolve(42);\n});\n\
    ```\n\n```\np1.then(function(value) {\n  throw new Error(\"Boom!\");\n}).catch(function(error)\
    \ {\n  console.log(error.message);    // \"Boom!\"\n});\n```\n\nIn this code,\
    \ the fulfillment handler for p1 throws an error. The chained call to the catch()\
    \ method, which is on a second promise, is able"
  merge: -1
  pgno: 254
- img_proc: true
  md: "to receive that error through its rejection handler. The same is true if a\
    \ rejection handler throws an error:\n\n```\nlet p1 = new Promise(function(resolve,\
    \ reject) {\n  throw new Error(\"Explosion!\");\n});\n\np1.catch(function(error)\
    \ {\n  console.log(error.message); // \"Explosion!\"\n  throw new Error(\"Boom!\"\
    );\n}).catch(function(error) {\n  console.log(error.message); // \"Boom!\"\n});\n\
    ```\n\nHere, the executor throws an error and triggers the p1 promise's rejection\
    \ handler. That handler then throws another error that is caught by the second\
    \ promise's rejection handler. The chained promise calls are aware of errors in\
    \ other promises in the chain.\n\nAlways have a rejection handler at the end of\
    \ a promise chain to ensure that you can properly handle any errors that may occur.\n\
    \n# Returning Values in Promise Chains\n\nAnother important aspect of promise\
    \ chains is the ability to pass data from one promise to the next. I've shown\
    \ how a value passed to the resolve() handler inside an executor is passed to\
    \ the fulfillment handler for that promise, but you can continue passing data\
    \ along a chain by specifying a return value from the fulfillment handler. For\
    \ example:\n\n```\nlet p1 = new Promise(function(resolve, reject) {\n  resolve(42);\n\
    });\n\np1.then(function(value) {\n  console.log(value); // \"42\"\n  return value\
    \ + 1;\n}).then(function(value) {\n  console.log(value); // \"43\"\n});\n```\n\
    \nThe fulfillment handler for p1 returns value + 1 when executed. Because value\
    \ is 42 (from the executor), the fulfillment handler returns 43. That value is\
    \ then passed to the fulfillment handler of the second promise, which outputs\
    \ it to the console.\n\nYou could do the same thing with the rejection handler.\
    \ When a rejection handler is called, it may return a value. If it does, that\
    \ value is used to fulfill the next promise in the chain, as in the next example."
