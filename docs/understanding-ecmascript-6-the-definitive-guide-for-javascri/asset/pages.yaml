  md: 'The seemingly limited functionality of weak sets is necessary to properly handle
    memory. In general, if you only need to track object references, you should use
    a weak set instead of a regular set.


    Sets give you a way to handle lists of values, but they aren''t useful when you
    need to associate additional information with those values. That’s why ECMAScript
    6 also adds maps.


    # # Maps in ECMAScript 6


    The ECMAScript 6 Map type is an ordered list of key-value pairs, where the key
    and the value can be any type. Key equivalence is determined by using the same
    approach as Set objects, so you can have both a key of 5 and a key of "5" because
    they are different types. This is quite different from using object properties
    as keys, because object properties always coerce values into strings.


    You can add items to maps by calling the set() method and passing it a key and
    the value to associate with the key. You can later retrieve a value by passing
    the key to the get() method. For example:


    ```

    let map = new Map();

    map.set("title", "Understanding ECMAScript 6");

    map.set("year", "2016");

    ```


    ```

    console.log(map.get("title")); // "Understanding ECMAScript 6"

    console.log(map.get("year")); // 2016

    ```


    In this example, two key-value pairs are stored. The "title" stores a string,
    and the "year" stores a number. The get() method is called later to retrieve the
    values for both keys. If either key didn''t exist in the map, get() would have
    returned the special value undefined instead of a value.


    You can also use objects as keys, which isn''t possible when you''re using object
    properties to create a map in the old workaround approach. Here’s an example:


    ```

    let map = new Map();

    key1 = {};

    key2 = {};


    map.set(key1, 5);

    map.set(key2, 42);

    ```


    ```

    console.log(map.get(key1)); // 5

    console.log(map.get(key2)); // 42

    ```


    This code uses the objects key1 and key2 as keys to store two different values.
    Because these keys are not coerced into another form, each object is unique. This
    allows you to associate additional data with an object without modifying the object.'
