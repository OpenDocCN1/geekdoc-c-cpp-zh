  md: "This function mimics the pick() method from the Underscore.js library, which\
    \ returns a copy of a given object with some specified subset of the original\
    \ object's properties. This example defines only one argument and expects the\
    \ first argument to be the object from which to copy properties. Every other argument\
    \ passed is the name of a property that should be copied on the result.\n\nYou\
    \ should note a couple of things about this pick() function. First, it's not all\
    \ obvious that the function can handle more than one parameter. You could define\
    \ several more parameters, but you would always fall short of indicating that\
    \ this function can take any number of parameters. Second, because the first parameter\
    \ is named and used directly, when you look for the properties to copy, you have\
    \ to start in the arguments object at 1 instead of index 0. Remembering to use\
    \ the appropriate indices with arguments is not necessarily difficult, but it's\
    \ one more detail to keep track of.\n\nECMAScript 6 introduces rest parameters\
    \ to help with these issues.\n\n# Rest Parameters\n\nA rest parameter is indicated\
    \ by three dots (...) preceding a named parameter. That named parameter becomes\
    \ an Array containing the rest of the parameters passed to the function, which\
    \ is where the name rest parameters originates. For example, pick(object) can\
    \ be rewritten using rest parameters, like this:\n\n```\nfunction pick(object,\
    \ ...keys) {\n  let result = Object.create(null);\n\n  for (let i = 0, len = keys.length;\
    \ i < len; i++) {\n    result[keys[i]] = object[keys[i]];\n  }\n\n  return result;\n\
    }\n```\n\nIn this version of the function, keys is a rest parameter that contains\
    \ all parameters passed after object (unlike, which contains all parameters including\
    \ the first one). That means you can iterate over keys from beginning to end without\
    \ worry. As a bonus, you can well tell by looking at the function that it's capable\
    \ of handling any number of parameters.\n\n> Rest parameters don't affect a function's\
    \ length property, which indicates the number of named parameters for the function.\
    \ The value of length for pick() in this example is 1 because only object counts\
    \ toward this value."
