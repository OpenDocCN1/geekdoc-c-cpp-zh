  md: "# Object Categories\n\nJavaScript uses different terminology to describe objects\
    \ in the standard opposed to those added by execution environments, such as the\
    \ browser. The ECMAScript 6 specification has clear definitions for each object\
    \ category. It's essential to understand this terminology to grasp the language\
    \ as a whole. The object categories are:\n\n+   **Ordinary objects** Have all\
    \ the default internal behaviors for objects in JavaScript.\n\n+   **Exotic objects**\
    \ Have internal behavior that differs from the default in some way.\n\n+   **Standard\
    \ objects** Defined by ECMAScript 6, such as Array, Date, and so on. Standard\
    \ objects can be ordinary or exotic.\n\n+   **Built-in objects** Present in a\
    \ JavaScript execution environment when a script begins to execute. All standard\
    \ objects are built-in.\n\nI'll use these terms throughout the book to explain\
    \ the various objects that ECMAScript 6 defines.\n\n# Object Literal Syntax Extensions\n\
    \nThe object literal is one of the most popular patterns in JavaScript. JSON is\
    \ built on its syntax, and it's in nearly every JavaScript file on the Internet.\
    \ The object literal's popularity is due to its succinct syntax for creating objects\
    \ that would otherwise take several lines of code to create. Fortunately for developers,\
    \ ECMAScript 6 makes object literals more powerful and even suc by extending the\
    \ syntax in several ways.\n\n# Property Initializer Shorthand\n\nIn ECMAScript\
    \ 5 and earlier, object literals were simply collections of name-value pairs,\
    \ meaning that such duplication could occur when property values are initialized.\
