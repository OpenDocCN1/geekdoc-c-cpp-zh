    \ declarations that don't use function.\n\nFor rest parameters, just add the last\
    \ parameter, like this:\n\n```\nvar pickFirst = new Function(\"...args\", \"return\
    \ args[0]\");\n\nconsole.log(pickFirst(1, 2)); // 1\n```"
