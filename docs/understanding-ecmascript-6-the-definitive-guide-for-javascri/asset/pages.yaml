  md: "```\np4.catch(function(value) {\n    console.log(Array.isArray(value)) // false\n\
    \    console.log(value);             // 43\n});\n```\n\nIn this example, p2 is\
    \ rejected with a value of 43. The rejection handler for p4 is called immediately\
    \ without waiting for p1 or p3 to finish executing.\n(They do not finish executing;\
    \ p4 doesn't wait).\nThe rejection handler always receives a single value rather\
    \ than an array, and the value is the rejection value from the promise that was\
    \ rejected. In this case, the rejection handler is passed 43 to reflect the rejection\
    \ of p2.\n\n# The Promise.race() Method\n\nThe Promise.race() method provides\
    \ a slightly different take on monitoring multiple promises. This method also\
    \ accepts an iterable of promises to monitor and returns a promise, but the returned\
    \ promise is settled as soon as the first promise is settled. Instead of waiting\
    \ for all promises to be fulfilled, like the Promise.all() method, the Promise.race()\
    \ method returns an appropriate promise as soon as any promise in the array is\
    \ fulfilled.\n\n```\nlet p1 = Promise.resolve(42);\n\nlet p2 = new Promise(function(resolve,\
    \ reject) {\n    resolve(43);\n});\n\nlet p3 = new Promise(function(resolve, reject)\
    \ {\n    resolve(44);\n});\n\nlet p4 = Promise.race([p1, p2, p3]);\n\nnp4.then(function(value)\
    \ {\n    console.log(value);      // 42\n});\n```\n\nIn this code, p1 is created\
    \ as a fulfilled promise while the others schedule jobs. The fulfillment handler\
    \ for p4 is then called with the value of 42 and ignores the other promises. The\
    \ promises passed to Promise.race() are truly in a race to settle first. If the\
    \ first promise to settle is fulfilled, the returned promise is fulfilled; if\
    \ the first promise to settle is rejected, the returned promise is rejected. Here's\
    \ an example with a rejection:\n\n```\nlet p1 = new Promise(function(resolve,\
    \ reject) {\n    resolve(42);\n});\n\nlet p2 = Promise.reject(43);\n```"
