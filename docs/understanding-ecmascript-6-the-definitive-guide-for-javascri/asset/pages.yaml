- img_proc: true
  md: "At the beginning of this chapter, I mentioned the problem of tracking an index\
    \ inside a for loop. Iterators are the first part of the solution to that problem.\
    \ The for-each loop is the second part: it removes the need to track an index\
    \ into a collection entirely, freeing you to focus on working with the scenes\
    \ of the collection.\n\nA for-loop calls next() on an iterable time the loop executes\
    \ and stores the value from the result object in a variable. The loop continues\
    \ its process until the returned object's done property is true. Here is an example:\n\
    \n```\nlet values = [1, 2, 3];\nfor (let num of values) {\n  console.log(num);\n\
    }\n```\n\nThis code outputs the following:\n\n+   1\n2\n3\n\nThis for-for loop\
    \ first calls the Symbol.iterator method on the values array to retrieve an iterator.\
    \ (The call to Symbol.iterator happens behind the scenes in the JavaScript engine.)\
    \ Then iterator.next() is called, and the value property on the iterator's result\
    \ object is read into num. The num variable is 1, then 2, and finally 3. When\
    \ done the result object is true, the loop exits, so num is never assigned the\
    \ value of undefined.\n\nIf you're simply iterating over values in an array or\
    \ collection, it's a good idea to use a for-loop instead of a for loop. The for-loop\
    \ is generally less error prone because there are fewer conditions to track. Use\
    \ the traditional for more complex control conditions.\n\n> The for-of statement\
    \ will throw an error when you use it on a non-iterable object, null, or undefined.\n\
    \n# Accessing the Default Iterator\n\nYou can use Symbol.iterator to access the\
    \ default iterator for an object, like this:\n\n```\nlet values = [1, 2, 3];\n\
    let iterator = values[Symbol.iterator]();\n```\n\n```\nconsole.log(iterator.next());\
    \ // { value: 1, done: false }\nconsole.log(iterator.next()); // { value: 2, done:\
    \ false }\nconsole.log(iterator.next()); // { value: 3, done: false }\nconsole.log(iterator.next());\
    \ // { value: undefined, done: true }\n```"
  merge: -1
  pgno: 168
- img_proc: true
  md: "This code gets the default iterator for values and uses that to iterate over\
    \ the items in the array. This is the same process that happens behind the scenes\
    \ when you're using a for-of loop.\n\nBecause Symbol.iterator specifies the default\
    \ iterator, you can use it to detect whether an object is iterable, as follows:\n\
    \n```\nfunction isIterable(object) {\n  return typeof object[Symbol.iterator]\
    \ === \"function\";\n}\n\nconsole.log(isIterable([1, 2, 3])); // true\nconsole.log(isIterable(\"\
    Hello\")); // true\nconsole.log(isIterable(new Map())); // true\nconsole.log(isIterable(new\
    \ Set())); // true\nconsole.log(isIterable(new WeakMap())); // false\nconsole.log(isIterable(new\
    \ WeakSet())); // false\n```\n\nThe iterable() function simply checks whether\
    \ a default iterator exists on the object and is a function. The for-of loop does\
    \ a similar check before executing.\n\nSo far, the examples in this section have\
    \ shown ways to use Symbol.iterator, but you can also use the Symbol.iterator\
    \ property to create your own iterables.\n\n# Creating Iterables\n\nDeveloper-defined\
    \ objects are not iterable by default, but you can make them iterable by creating\
    \ a Symbol.iterator property containing a generator. For example:\n\n```\nlet\
    \ collection = {\n  items: [],\n*[Symbol.iterator]() {\n    for (let item of this.items)\
    \ {\n      yield item;\n    }\n  }\n}\n\ncollection.items.push(1);\ncollection.items.push(2);\n\
    collection.items.push(3);\n```\n\n```\nfor (let x of collection) {\n  console.log(x);\n\
    }\n```"
