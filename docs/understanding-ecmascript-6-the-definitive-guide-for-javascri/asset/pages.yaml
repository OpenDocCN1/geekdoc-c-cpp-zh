    \ then the second promise executor will run, and so on. Returning thenables simply\
    \ allows you to define additional responses to the promise results. We defer the\
    \ execution of fulfillment handlers by creating a new promise within a fulfillment\
    \ handler. For example:\n\n```\nlet p1 = new Promise(function(resolve, reject)\
