  md: '# Array Destructuring


    Array destructuring syntax is very similar to object destructuring: it just uses
    array literal syntax instead of object literal syntax. The destructuring operates
    on positions within an array rather than the named properties that are available
    in objects. For example:


    ```

    let colors = [ "red", "green", "blue" ];

    ```


    ```

    let [firstColor, secondColor] = colors;

    ```


    ```

    console.log(firstColor); // "red"

    console.log(secondColor); // "green"

    ```


    Here, array destructuring pulls out the values "red" and "green" from the colors
    array, and stores them in the firstNumber and secondColor variables. Those values
    are chosen because of their position in the array; the actual variable names could
    be anything. Any items explicitly mentioned in the destructuring pattern are ignored.
    Keep in mind that the array isn''t changed in any way.


    You can also omit items in the destructuring pattern and only provide variable
    names for the items you''re interested in. If, for example, you just want the
    value of an array, you don''t need to supply variable names for the first and
    second items. Here''s how that works:


    ```

    let colors = [ "red", "green", "blue" ];

    ```


    ```

    let [ , , thirdColor ] = colors;

    ```


    ```

    console.log(thirdColor); // "blue"

    ```


    This code uses a destructuring assignment to retrieve the third item in colors.
    The commas preceding thirdColor are placeholders for the array items that come
    before it. By using this approach, you can easily pick out values from any number
    of slots in the middle of an array without needing to provide variable names for
    them.


    > Similar to object destructuring, you must always provide an initializer using
    array destructuring with var, let, or const.


    # Destructuring Assignment


    You can use array destructuring in the context of an assignment, but unlike object
    destructuring, there is no need to wrap the expression in parentheses. Consider
    the following example.'
