  md: '# The Exponentiation Operator


    The only change to JavaScript syntax introduced in ECMAScript 2016 is the exponentiation
    operator, which is a mathematical operation that applies an exponent to a base.
    JavaScript already had the Math.pow() method to perform exponentiation, but JavaScript
    was also one of the languages that required a method rather than a formal operator.
    In addition, some developers argue the operator is easier to read and reason about.


    The exponentiation operator is two asterisks (**): the left operand is the base,
    and the right operand is the exponent. For example:


    ```

    let result = 5 ** 2;


    console.log(result); // 25

    console.log(result === Math.pow(5, 2)); // true

    ```


    This example calculates 5², which is equal to 25. You can still use Math.pow()
    to achieve the same result.


    # Order of Operations


    The exponentiation operator has the highest precedence of all binary operators
    in JavaScript (unary operators have higher precedence than (**)). That means it
    is applied first to any compound operation, as in this example:


    ```

    let result = 2 * 5 ** 2;

    console.log(result); // 50

    ```


    The calculation of 5² happens first. The resulting value is then multiplied by
    2 for a final result of 50.


    # Operand Restriction


    The exponentiation operator does have a somewhat unusual restriction that other
    operators lack. The left side of an exponentiation operation cannot be a unary
    expression other than ++ or --. For example, this code uses invalid syntax:


    ```

    // syntax error

    let result = -5 ** 2;

    ```


    The -5 in this example is a syntax error because the order of operations is ambiguous.
    Does the - apply just to 5 or the result of the 5 ** 2 expression? Disallowing
    unary expressions on the left side of the exponentiation operator eliminates that
    ambiguity. To clearly specify intent, you need to include parentheses either around
    -5 or around 5 ** 2 as follows:


    ```

    // okay

    let result1 = (-5 ** 2); // equal to -25

    ```'
