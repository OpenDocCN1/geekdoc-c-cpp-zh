    });\n```\n\nThe fs.readFile() method is called with the filename to read and a\
    \ callback function. When the operation is finished, the callback function is\
    \ called. The callback checks whether an error exists, and if not, processes the\
    \ returned contents. This works well when you have a small, finite number of asynchronous\
