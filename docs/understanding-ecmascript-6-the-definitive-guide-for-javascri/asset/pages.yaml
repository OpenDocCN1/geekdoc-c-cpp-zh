    # Identifying Integers


    ECMAScript 6 added the Number.isInteger() method, which can determine whether
    a value represents an integer in JavaScript. Although JavaScript uses IEEE 754
    to represent both types of numbers, floats and integers are stored differently.
    The Number.isInteger() method takes advantage of storage difference, and when
    the method is called on a value, the JavaScript engine looks at the underlying
    representation of the value to determine whether that value is an integer. As
    a result, numbers that look like floats might actually be stored as integers and
    cause Number.isInteger() to return true.


    ```

    console.log(Number.isInteger(25)); // true

    console.log(Number.isInteger(25.0)); // true

    console.log(Number.isInteger(25.1)); // false

    ```


    In this code, Number.isInteger() returns true for 25 and 25.0, even though the
    latter looks like a float. Simply adding a decimal point to a number does not
    automatically make it a float in JavaScript. Because 25.0 is really just 25, it
    is stored as an integer. However, the number 25.1 is stored as a float because
    there is a fraction value.


    # Safe Integers


    IEEE 754 can only accurately represent integers between -2⁵³ and 2⁵³, and outside
    this range "safe" binary representations are reused for multiple numeric values.
    This means JavaScript can only safely represent integers within the IEEE 754 range
    before problems appear. For instance, consider this:


    ```

    console.log(Math.pow(2, 53)); // 9007199254740992

    console.log(Math.pow(2, 53) + 1); // 9007199254740992

    ```


    This example does not contain a tuple, yet two different numbers are represented
    by the same JavaScript integer. The effect becomes more prevalent the further
    the value is outside the safe range.


    ECMAScript 6 introduced the Number.isSafeInteger() method to better identify integers
    that the language can accurately represent. It also added the Number.MAX_SAFE_INTEGER
    and Number.MIN_SAFE_INTEGER properties to represent the upper and lower bounds
    of the integer range, respectively. The Number.isSafeInteger() method ensures
    that a value is an integer and falls within the safe range of integer values,
    as in this example:


    ```

    var inside = Number.MAX_SAFE_INTEGER,

    outside = inside + 1;

    ```'
