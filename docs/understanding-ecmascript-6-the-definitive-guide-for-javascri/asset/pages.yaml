    \ the definition. You've seen several similarities between classes and object\
    \ literals, including methods, accessor properties, and computed names. There's\
    \ just one more similarity I need to cover, and that is generators.\n\n# Generator\
    \ Methods\n\nRecall from Chapter 8 that you can define a generator on an object\
    \ literal by prepending an asterisk (*) to the method name. The same syntax works\
    \ for classes as well, allowing any method to be a generator. Here's an example:\n\
    \n```\nclass MyClass {\n  *createIterator() {\n    yield 1;\n    yield 2;\n  \
    \  yield 3;\n  }\n}\n```\n\n```\nlet instance = new MyClass();\nlet iterator =\
    \ instance.createIterator();\n```\n\nThis code creates a class called MyClass\
    \ with a createIterator() generator method. The method returns an iterator whose\
    \ values are hardcoded into the generator. Generator methods are useful when you\
    \ have an object that represents a collection of values and you want to iterate\
    \ over those"
