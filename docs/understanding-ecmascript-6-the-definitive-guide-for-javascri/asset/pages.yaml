    \ 2 just as add(1) returns 2. This taking\napproach a step further, you can pass\
    \ first into a function to get the value\nfor second as follows:\n\n```\nfunction\
    \ getValue(value) {\n  return value + 5;\n}\n```\n\n```\nfunction add(first, second\
    \ = getValue(first)) {\n  return first + second;\n}\n```\n\n```\nconsole.log(add(1,\
    \ 1)); // 2\nconsole.log(add(1)); // 7\n```\n\nThis example sets second equal\
    \ to the value returned by getValue(first),\nso although add(1, 1) still returns\
    \ 2, add(1) returns 7 (1 + 6).\n\nThe ability to reference parameters from default\
    \ parameter assign-\nworks only for previous arguments, so earlier arguments don't\
    \ have\naccess to later arguments. For example:\n\n```\nfunction add(first = second,\
    \ second) {\n  return first + second;\n}\n```\n\n```\nconsole.log(add(1, 1));\
    \ // 2\nconsole.log(add(undefined, 1)); // throws an error\n```\n\nThe call to\
    \ add(undefined, 1) throws an error because second is defined\nafter first and\
