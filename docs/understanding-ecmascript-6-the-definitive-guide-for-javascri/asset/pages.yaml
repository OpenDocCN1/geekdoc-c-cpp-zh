  md: "Using super in this way works same as the super references discussed in Chapter\
    \ 4 (see \"Easy Prototype Access with Super References\" on page 77). The this\
    \ value is automatically set correctly so you can make a simple method call.\n\
    \n# Inherited Static Members\n\nIf a base class has static members, those static\
    \ members are also available on the derived class. Inheritance works like that\
    \ in other languages, but this is a new concept in JavaScript. Here's an example:\n\
    \n```\nclass Rectangle {\n  constructor(length, width) {\n    this.length = length;\n\
    \    this.width = width;\n  }\n\n  getArea() {\n    return this.length * this.width;\n\
    \  }\n\n  static create(length, width) {\n    return new Rectangle(length, width);\n\
    \  }\n}\n```\n\n```\nclass Square extends Rectangle {\n  constructor(length) {\n\
    \    // equivalent of Rectangle.call(this, length, length, length)\n    super(length,\
    \ length);\n  }\n}\n```\n\n```\nvar rect = Square.create(3, 4);\n\nconsole.log(rect\
    \ instanceof Rectangle); // true\nconsole.log(rect.getArea()); // 12\nconsole.log(rect\
    \ instanceof Square); // false\n```\n\nIn this code, a static create() method\
    \ is added to the Rectangle class. Through inheritance, that method is available\
    \ as Square.create() and behaves like the Rectangle.create() method.\n\n# Derived\
    \ Classes from Expressions\n\nPerhaps the most powerful aspect of derived classes\
    \ in ECMAScript 6 is the ability to derive a class from an expression. You can\
    \ use extends with any expression as long as the expression resolves to a function\
    \ with [[Construct]] and a prototype. For instance:\n\n```\nfunction Rectangle(length,\
    \ width) {\n  this.length = length;\n}\n```"
