  md: "# Class-Like Structures in ECMAScript 5\n\nAs mentioned, ECMAScript 5 and earlier,\
    \ JavaScript had no classes. The closest equivalent to a class was creating a\
    \ constructor and then assigning methods to the constructor's prototype, an approach\
    \ typically called creat-ing for example:\n\n```\nfunction PersonType(name) {\n\
    \  this.name = name;\n}\n\nPersonType.prototype.sayName = function() {\n  console.log(this.name);\n\
    }\n\nvar person = new PersonType(\"Nicholas\");\nperson.sayName(); // outputs\
    \ \"Nicholas\"\n```\n\n```\nconsole.log(person instanceof PersonType); // true\n\
    console.log(person instanceof Object); // true\n```\n\nIn this code, PersonType\
    \ is a constructor function that creates a single property name. The sayName()\
    \ method is assigned to the prototype so the same function is shared by all instances\
    \ of the PersonType object. Then, a new instance of PersonType is created via\
    \ the new operator. The resulting person object is considered an instance of PersonType\
    \ and Object inheritance.\n\nThis basic pattern underlies many of the class-mimicking\
    \ JavaScript libraries, and where's ECMAScript 6 classes start.\n\n# Class Declarations\n\
    \nThe simplest class in ECMAScript 6 is the class declaration, which looks similar\
    \ to classes in other languages.\n\n# A Basic Class Declaration\n\nClass declarations\
    \ begin with the class keyword followed by the name of the class. The syntax looks\
    \ similar to concise methods in object literals but doesn't require commas between\
    \ the elements of the class. Here's a simple class declaration:\n\n```\nclass\
    \ PersonClass {\n  // equivalent of the PersonType constructor\n  constructor(name)\
    \ {\n    this.name = name;\n  }\n\n  // equivalent of PersonType.prototype.sayName\n\
    \  sayName() {\n```"
