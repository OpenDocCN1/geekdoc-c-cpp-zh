  md: 'Because all substitutions are JavaScript expressions, you can substitute more
    than just simple variable names. You can easily embed calculations, function calls,
    and more. For example:


    ```

    let count = 10;

    price = 0.25;

    message = `${count} items cost $${count * price}.toFixed(2)}`;


    console.log(message); // "10 items cost $2.50."

    ```


    This code performs a calculation as per the template literal. The variables count
    and price are multiplied together to produce a result and then are formatted to
    two decimal places using .toFixed(). The dollar sign before the second substitution
    is output as it''s not followed by an opening curly brace.


    Template literals are also JavaScript expressions, which means you can place a
    template literal inside another template literal, as in this example:


    This code nests a second template literal inside the first. After the first delimiter,
    another template literal begins. The second $ indicates the beginning of an embedded
    expression inside the inner template literal. That expression is the variable
    name, which is inserted into the result.


    # Tagged Templates


    You''ve seen how template literals can create multiline strings and insert values
    into strings without concatenation. The real power of template literals comes
    from tagged templates. A template tag performs a transformation on the template
    literal and returns the final string value. This tag is specified at the start
    of the template, just before the first character, as shown here:


    ```

    let message = tag`Hello world`;

    ```


    In this example, tag is the template tag to apply to the `Hello world` template
    literal.'
