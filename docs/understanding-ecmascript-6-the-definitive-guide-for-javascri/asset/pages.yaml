    # # Summary


    Prior to ECMAScript 6, certain objects (such as arrays) displayed non-standard
    behavior that developers cannot replicate. Proxies change that. They let you define
    your own nonstandard behavior for several low-level JavaScript operations, so
    you can replicate all behaviors of built-in JavaScript objects through proxy traps.
    These traps are behind the scenes when various operations take place, like the
    use of the operator.


    A reflection API was also introduced in ECMAScript 6 to develop the default behavior
    for each proxy trap. Each proxy trap has a corresponding method of the same name
    on the Reflect object, which is another ECMAScript 6 addition. Using a combination
    of proxy traps and reflection API methods, it''s possible to filter operations
    to behave differently only in certain conditions while defaulting to the built-in
    behavior.


    Revocable proxies are special proxies that can be effectively disabled by using
    a revoke() function. The revoke() function terminates all functionality on the
    proxy, so any attempt to interact with the proxy''s properties throws an error
    after revoke() is called. Revocable proxies are important for application security
    where third-party developers may need access to certain objects for a specified
    amount of time.


    Although using proxies directly is the most powerful use case, you can also use
    a proxy as the prototype for another object. In that case, you are severely limited
    in the number of proxy traps you can effectively use. Only the get, set, and has
    proxy traps will ever be called on a proxy when it''s used as a prototype, resulting
    in fewer use cases.'
