    \ 42\n\n  // create a new promise\n  let p2 = new Promise(function(resolve, reject)\
    \ {\n    resolve(43);\n  })\n\n  return p2;\n}).then(function(value) {\n  console.log(value);\
    \ // 43\n});\n```\n\nIn this example, a new promise is created within the fulfillment\
    \ handler for p1. This means the second fulfillment handler won't execute until\
    \ p2 is fulfilled. This pattern is useful when you want to wait until a previous\
    \ promise has been settled before triggering another promise.\n\n# Responding\
    \ to Multiple Promises\n\nEach example in this chapter so far has dealt with responding\
    \ to one promise at a time. But sometimes you'll want monitor the progress of\
    \ multiple promises to determine the next action. ECMAScript 6 provides two methods\
    \ that monitor multiple promises: Promise.all() and Promise.race()."
