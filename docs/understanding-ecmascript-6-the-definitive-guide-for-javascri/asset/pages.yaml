  md: '+   Chapter 7: Sets and Maps details the new collection types of Set, WeakSet,
    Map, and WeakMap. These types expand the usefulness of arrays and de-dupeing,
    and memory management designed specifically for JavaScript.


    +   Chapter 8: Iterators and Generators discusses the addition of iterators and
    generators to the language. These features allow you to work with collections
    of data in powerful ways that were not possible in previous versions of JavaScript.


    +   Chapter 9: Introducing JavaScript Classes introduces the first formal concept
    of classes in JavaScript. Often a point of confusion for those coming from other
    languages, the addition of class syntax in JavaScript makes the language more
    approachable to others and more concise for enthusiasts.


    +   Chapter 10: Improved Array Capabilities details the changes to native arrays
    and the useful new ways you can use them in JavaScript.


    +   Chapter 11: Promises and Asynchronous Programming introduces promises as a
    new part of the language. Promises were a grassroots effort that took off and
    gained popularity through extensive library support. ECMAScript 6 formalizes promises
    and makes them available by default.


    +   Chapter 12: Proxies and the Reflection API introduces the formalized reflection
    API for JavaScript and the new proxy object that allows you to intercept every
    operation performed on an object. Proxies give developers unprecedented control
    over objects and, as such, unlimited possibilities for defining new interaction
    patterns.


    +   Chapter 13: Encapsulating Code with Modules details the official module format
    for JavaScript. The intent is that modules replace the ad hoc module definition
    formats that have appeared over the years.


    +   Appendix A: Minor Changes in ECMAScript 6 covers other changes implemented
    in ECMAScript 6 that you''ll use less frequently or that didn''t quite fit into
    the broader major topics covered in each chapter.


    +   Appendix B: Understanding ECMAScript 7 (2016) describes the three additions
    to the standard that were implemented in ECMAScript 7, which didn''t impact JavaScript
    nearly as much as ECMAScript 6.


    # Conventions Used


    The following typographical conventions are used in this book:


    +   * Italics are used for new terms and filenames.


    +   * Constant width indicates a code term within the text.'
