  md: 'This code functions almost same as the second example in “let Declarations
    in Loops” on page 9. The only difference is that the value of key var cannot be
    changed inside the loop. The for-in and for-of loops work with const because the
    loop initializer creates a new binding on each iteration through the loop rather
    than attempting to modify the value of an existing binding (as was the case in
    the for example).


    # Global Block Bindings


    Another way in which let and const are different from var is in their global scope
    behavior. When var is used in the global scope, it creates a new global variable,
    which is a property on the global object (window in browsers). That means you
    can accidentally overwrite an existing global using var, as this code does:


    ```

    // in a browser

    var RegExp = "Hello";

    console.log(RegExp);      // "Hello";

    ```


    ```

    var ncz = "Hi";

    console.log(window.ncz);  // "Hi";

    ```


    Even though the RegExp is global is defined on the window object, it is not safe
    from being overwritten by a var declaration. This example declares a new global
    variable RegExp that overwrites the original. Similarly, ncz is defined as a global
    variable and then defined as a property on window immediately afterwards, which
    is how JavaScript has always worked.


    If you use let or const in the global scope, a new binding is added to the global
    scope. That also means you cannot overwrite a global variable using let or const
    declarations; you can only shadow it. Here''s an example:


    ```

    // in a browser

    let RegExp = "Hello";

    console.log(RegExp);

    console.log(window.RegExp === RegExp); // false

    ```


    ```

    const ncz = "Hi";

    console.log(ncz);\      // "Hi";

    console.log(window.ncz);  // false

    ```


    A let declaration for RegExp creates a binding that shadows the global RegExp.
    Because window.RegExp and RegExp are not the same, there is no disruption to the
    global scope. Also, the declaration for ncz creates a binding but does not create
    a property on the global object. This lack of global object modification makes
    let and const much safer to use in the global scope when you don''t want to create
    properties on the global object.'
