  md: "# NodeList Iterators\n\nThe DOM has a NodeList type that represents a collection\
    \ of elements in a document. For those who write JavaScript to run in web browsers,\
    \ understanding the difference between NodeList objects and arrays has always\
    \ been a bit difficult. Both NodeList objects and arrays use the length property\
    \ to indicate the number of items, and both use bracket notation to access individual\
    \ items. Internally, however, a NodeList and an array behave quite differently,\
    \ which has led to a lot of confusion.\n\nWith the addition of default iterators\
    \ in ECMAScript 6, the DOM definition of NodeList (included in the HTML specification\
    \ rather than ECMAScript 6) includes a default iterator that behaves in the same\
    \ manner as the array default. It means you can use NodeList in a for-of loop\
    \ or any other place that uses an object's default iterator. For example:\n\n\
    ```\nvar divs = document.getElementsByTagName(\"div\");\n\nfor (let div of divs)\
    \ {\n  console.log(div);\n}\n```\n\nThis code calls getTagName to retrieve all\
    \ of the <div> elements in the document object. The for-of loop iterates over\
    \ each element and outputs the element IDs, effectively making the code the same\
    \ as it would be for a standard array.\n\n# The Spread Operator and Nonarray Iterables\n\
    \nRecall from Chapter 7 that you can use the spread operator (...) to convert\
    \ a set into an array. For example:\n\n```\nlet set = new Set([1, 2, 3, 3, 4,\
    \ 5]);\narray = [...set];\n\nconsole.log(array); // [1,2,3,4,5]\n```\n\nThis code\
    \ uses the spread operator inside an array literal to fill that array with the\
    \ values from set. The spread operator works on all iterables and uses the default\
    \ iterator to determine which values to include. All values are read from the\
    \ iterator and inserted into the array in the order in which values were returned\
    \ from the iterator. This example runs properly because sets are iterables, but\
    \ the spread operator works equally well on any iterable. Here is another example:\n\
    \n```\nlet map = new Map([[\"name\",\"Nicholas\"], [\"age\",25]]);\narray = [...map];\n\
    \nconsole.log(array); // // [[\"name\",\"Nicholas\"],[\"age\",25]]\n```"
  merge: -1
  pgno: 176
- img_proc: true
  md: "Here, the spread operator converts map into an array of arrays. Because the\
    \ default iterator for maps returns key-value pairs, the resulting array looks\
    \ like the array that was passed during the new Map().\n\nYou can use the spread\
    \ operator in an array literal as many times as you want, and you can use it wherever\
    \ you want to insert multiple items from an iterable. These items will just appear\
    \ in order the new array at the location of the spread operator. For example:\n\
    \n```\nlet smallNumbers = [1, 2, 3],\n    bigNumbers = [100, 101, 102],\n    allNumbers\
    \ = [0, ...smallNumbers, ...bigNumbers];\n\nconsole.log(allNumbers.length); //\
    \ 7\nconsole.log(allNumbers);      // [0, 1, 2, 3, 100, 102]\n```\n\nHere, the\
    \ spread operator is used to create allNumbers from smallNumbers and bigNumbers.\
    \ The values are placed in allNumbers in the same order the arrays are added when\
    \ allNumbers is created: 0 is first, followed by the values from smallNumbers,\
    \ followed by the values from bigNumbers. However, the original arrays are unchanged,\
    \ because their values have just been copied into allNumbers.\n\nBecause you can\
    \ use the spread operator on any iterable, using it is the easiest way to convert\
    \ an iterable into an array. You can convert strings into arrays of characters\
    \ (not code units) and NodeList objects in the browser into arrays of nodes.\n\
    \nNow that you understand the basics of how iterators work, it's time to look\
    \ at some more complex uses of iterators.\n\n# Advanced Iterator Functionality\n\
    \nYou can accomplish a lot with the basic functionality of iterators and the convenience\
    \ of creating them using generators. However, iterators can be used for tasks\
    \ other than simply iterating over a collection of values. During the development\
    \ of ECMAScript 6, many unique ideas and patterns encouraged the creators to add\
    \ more functionality to the language. Some of those additions are subtle, but\
    \ when used together, they can accomplish some interesting interactions, as discussed\
    \ in the following sections.\n\n# Passing Arguments to Iterators\n\nThroughout\
    \ this chapter, examples have shown iterators passing values out via the next()\
    \ method or by yielding in a generator. But you can also pass arguments to the\
    \ iterator through the next() method. When you pass an argument to the next()\
    \ method, that argument becomes the value of the yield"
  merge: -1
  pgno: 177
- img_proc: true
  md: "statement inside a generator. This capability is important for more advanced\n\
    functionality, such as asynchronous programming. Here's a basic example:\n\n```\n\
    function *createIterator() {\n  let first = yield 1;\n  let second = yield first\
    \ + 2; // 4 + 2\n  yield second + 3; // 5 + 3\n}\n```\n\n```\nlet iterator = createIterator();\n\
    console.log(iterator.next()); // \"{ value: 1, done: false }\"\nconsole.log(iterator.next(4));\
    \ // \"{ value: 6, done: false }\"\nconsole.log(iterator.next(5)); // \"{ value:\
    \ 8, done: false }\"\nconsole.log(iterator.next()); // \"{ value: undefined, done:\
    \ true }\"\n```\n\nThe first call to next() is a special case where any argument\
    \ passed\nit is lost. Because arguments passed to next() become the values returned\n\
    by yield, an argument from the first call to next() could only replace the\nfirst\
    \ yield statement in the generator function if it could be accessed before\nthat\
    \ statement. That's not possible, so there's no reason to pass an\nargument the\
    \ first time next() is called.\n\nOn the second call to next(), the value 4 is\
    \ passed as the argument.\nThe 4 ends assigned to the variable first inside the\
    \ generator func-\ntion. In a yield statement including an assignment, the right\
    \ side of the\nexpression is evaluated on the first call to next() before the\
    \ function continues execut-\nated on the second call to next() passes 4, that\
    \ value is assigned to\nfirst and then execution continues.\n\nThe second yield\
    \ uses the result of the first yield and adds two, which\nmeans it returns a value\
    \ of 6. When it is called a third time, the value 5\nis passed as an argument.\
    \ That value is assigned to the variable second\nand used in the third yield statement\
    \ to return 8.\n\nIt's a bit easier to think about what's happening by considering\
    \ which\ncode is executing each time execution continues inside the generator\
    \ func-\tion. Figure 8-1 uses shades of gray to show the code being executed before\n\
    yield.\n\n```\nfunction*createIterator() {\n  let first = yield 1;\n  let second\
    \ = yield first + 2;\n  yield second + 3;\n}\nnext()()\nnext(4)\nnext(5)\n```\n\
    \nFigure 8-1: Code execution inside a generator"
