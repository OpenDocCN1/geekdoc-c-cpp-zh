- img_proc: true
  md: 'the result of concatenating two typed arrays (especially if they deal with
    different data types would be uncertain, and that would contradict the reason
    for using typed arrays in the first place.)


    # Additional Methods


    Finally, typed array methods have two methods not present on regular arrays: the
    set() and subarray() methods. These two methods are opposites in that set() copies
    another array into an existing typed array, whereas subarray() extracts a part
    of an existing typed array into a new typed array.


    The set() method accepts an array (either typed or regular) and an optional offset
    at which to insert the data; if you pass nothing, the offset defaults to zero.
    The data from the argument is copied into the destination typed array while ensuring
    only valid data types are used. Here''s an example:


    ```

    let ints = new Int16Array(4);


    ints.set([25, 50]);

    ints.set([75, 100], 2);


    console.log(ints.toString()); // 25,50,75,100

    ```


    This code creates an Int16Array with four elements. The first call to set() copies
    two values to the first and second elements in the array. The second call to set()
    uses an offset of 2 to indicate that the values should be placed in the array
    starting at the third element.


    The subarray() method accepts an optional start and end index (the end is exclusive,
    as in the slice() method) and returns a new typed array. You can omit both arguments
    to create a clone of the typed array. For example:


    ```

    let ints = new Int16Array([25, 50, 75, 100]);

    subints1 = ints.subarray();

    subints2 = ints.subarray(2);

    subints3 = ints.subarray(1, 3);


    console.log(subints1.toString()); // 25,50,75,100

    console.log(subints2.toString()); // 75,100

    console.log(subints3.toString()); // 50,75

    ```


    Three typed arrays are created from the original ints array in this example. The
    subints1 array is a clone of ints that contains the same information. Because
    the subints2 array copies data starting from index 2, it only contains the last
    two elements of the ints array (75 and 100). The subints3 array contains only
    the middle two elements of the ints array, because subarray() was called with
    a start and an end index.'
