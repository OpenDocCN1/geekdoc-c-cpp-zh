  md: 'All objects start with zero symbol properties, but objects can inherit symbol
    properties from their prototypes. ECMAScript 6 redefines several such properties
    that are implemented using well-known symbols.


    # # Exposing Internal Operations with Well-Known Symbols


    A central theme for ECMAScript 5 was exposing and defining some of the "magic"
    parts of JavaScript, the parts that developers couldn''t emulate at the time.
    ECMAScript 6 carries on that tradition by exposing even more of the previously
    internal logic of the language, primarily by using symbol prototype properties
    to define the behavior of certain objects.


    ECMAScript 6 has defined symbols well-known symbols that represent common behaviors
    in JavaScript that were previously considered internal-operations. Each well-known
    symbol is represented by a property on the Symbol object, such as Symbol.match.

    The well-known symbols are:


    +   * Symbol.hasInstance A method used by instanceof to determine an object''s
    inheritance


    +   * Symbol.isConcatable A Boolean value indicating that Array.prototype.concat()
    should flatten the collection''s elements if the collection is passed as a parameter
    to Array.prototype.concat()


    +   * Symbol.iterator A method that returns an iterator (covered in Chapter 8)


    +   * Symbol.match A method used by String.prototype.match() to compare strings


    +   * Symbol.replace A method used by String.prototype.replace() to replace substrings


    +   * Symbol.search A method used by String.prototype.search() to locate substrings


    +   * Symbol.species The constructor for making derived classes (covered in Chapter
    9)


    +   * Symbol.split A method used by String.prototype.split() to split up strings


    +   * Symbol.toPrimitive A method that returns a primitive value representation
    of an object


    +   * Symbol.toStringTag A string used by Object.prototype.toString() to create
    an object description


    +   * Symbol.unscopables An object whose properties are the names of object properties
    that should not be included in a for in statement


    Some commonly well-known symbols are discussed in the following sections; others
    are discussed throughout the rest of the book to keep them in the correct context.'
