  md: '# INTRODUCTION


    ![](img/346dbcc81573ddc69906e98afee1e3ac_20_0.png)


    The JavaScript core language features are defined in the ECMA-262 standard. The
    language defined in this standard is called ECMAScript. What you know as JavaScript
    in browsers and in Node.js is actually a superset of ECMAScript. Browsers and
    Node.js add more functionality through additional methods, but the core of JavaScript
    remains as defined in ECMAScript. The ongoing development of ECMA-262 is vital
    to the success of JavaScript as a whole, and this book covers the changes brought
    about by the most recent major update to the language: ECMAScript 6.


    # The Road to ECMAScript 6


    In 2007, JavaScript was at a crossroads. The popularity of Ajax was ushered in
    a new age of dynamic web applications, whereas JavaScript hadn''t changed since
    the third edition of ECMA-262 was published in 1999.'
  merge: -1
