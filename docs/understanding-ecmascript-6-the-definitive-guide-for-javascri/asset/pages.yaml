  md: 'buffer is akin to calling malloc() in C to allocate memory without specifying
    what the memory block contains. You can create an array buffer by using the ArrayBuffer
    constructor as follows:


    ```

    let buffer = new ArrayBuffer(10); // allocate 10 bytes

    ```


    Just pass the number of bytes the array buffer should contain when you call the
    constructor. This list statement creates an array 10 bytes long. After an array
    buffer is created, you can retrieve the number of bytes in it by checking the
    byteLength property:


    ```

    let buffer = new ArrayBuffer(10); // allocate 10 bytes

    console.log(buffer.byteLength); // 10

    ```


    You can also use the slice() method to create a new array buffer that contains
    part of an existing array buffer. The slice() method works like the slice() method
    on arrays: you pass it the start index and end as arguments, and it returns a
    new ArrayBuffer instance composed of those elements from the original. For example:


    ```

    let buffer = new ArrayBuffer(10); // allocate 10 bytes

    let buffer2 = buffer.slice(4, 6); // 2

    ```


    In this code, buffer2 is created by extracting the bytes at indexes 4 and 5. Similar
    to when you call the array version of this method, the second argument to slice()
    is exclusive.


    Of course, creating a storage location isn''t very helpful without being able
    to write data into that location. To do so, you''ll need to create a view.


    > NOTE An array buffer always represents the exact number of bytes specified when
    it was created. You can change the data contained within an array buffer but never
    the size of the array buffer.


    # Manipulating Array Buffers with Views


    Array buffers represent memory locations, and views are the interfaces you''ll
    use to manipulate that memory. A view operates on an array buffer or a subset
    of an array buffer''s bytes, reading and writing data in one of the numeric data
    types. The DataView is a generic view on an array buffer that allows you to operate
    on all eight numeric data types.


    To use a DataView, you first create an instance of ArrayBuffer and use it to create
    a new DataView. Here''s an example:


    ```

    let buffer = new ArrayBuffer(10);

    view = new DataView(buffer);

    ```'
