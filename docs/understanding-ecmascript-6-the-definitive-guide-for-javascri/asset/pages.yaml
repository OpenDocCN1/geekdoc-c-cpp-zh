  md: "# Default Parameter Values in ECMAScript 6\n\nECMAScript 6 makes it easier\
    \ to provide default values for parameters by supplying initializations that are\
    \ used when the parameter isn't formally passed. For example:\n\n```\nfunction\
    \ makeRequest(url, timeout = 2000, callback = function() {}) {\n  // the rest\
    \ of the function\n}\n```\n\nThis function expects only the first parameter to\
    \ always be passed. The other two parameters have default values, which makes\
    \ the body of the function much smaller because you don't need to add any code\
    \ to check for a missing value.\n\nWhen makeRequest() is called with all three\
    \ parameters, the defaults are not used. For example:\n\n```\n// uses default\
    \ timeout and callback\nmakeRequest(\"/foo\");\n\n// uses default callback\nmakeRequest(\"\
    /foo\", 500);\n\n// doesn't use defaults\nmakeRequest(\"/foo\", 500, function(body)\
    \ {\n  doSomething(body);\n});\n```\n\nECMAScript 6 considers url to be required,\
    \ which is why \"/foo\" is passed in all three calls to makeRequest(). The two\
    \ parameters with a default value are considered optional.\n\nIt's possible to\
    \ specify default values for any arguments, including those that appear before\
    \ arguments without default values in the function declaration. For example, this\
    \ is fine:\n\n```\nfunction makeRequest(url, timeout = 2000, callback) {\n  //\
    \ the rest of the function\n}\n```\n\nIn this case, the default value for timeout\
    \ will be used only if there is no second argument passed in or if the second\
    \ argument is explicitly passed in as undefined, as in this example:\n\n```\n\
    // uses default timeout\nmakeRequest(\"/foo\", undefined, function(body) {\n \
    \ doSomething(body);\n});\n```"
