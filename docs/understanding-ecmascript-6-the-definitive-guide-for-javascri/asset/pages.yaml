  md: 'these 16-bit code units. Of course, 16 bits used to be enough to contain any
    character. That''s no longer true thanks to the expanded character set intro-duced
    by Unicode.


    # UTF-16 Code Points


    Limiting character length to 16 bits wasn''t possible for Unicode stated goal
    of providing a globally unique identifier to every character in the world. These
    globally unique identifiers, called code points, are simply numbers starting at
    0. Code points are what you may think of character codes, where a number represents
    a character. A character encoding must encode code points into code units that
    are internally consistent. For UTF-16, code points can consist of many code units.


    The first 2^16 code points in UTF-16 are represented as 16-bit code units. This
    range is the Basic Multilingual Plane (BMP). Everything beyond this range is considered
    to be in one of the supplementary planes, where the code points can no longer
    be represented in 16 bits. UTF-16 solves this problem by introducing surrogate
    pairs in which a single code point is represented by two code-bit units. That
    means any single character in a string can be either one code unit for BMP characters,
    or two units for supplementary plane characters, for a total of 32 bits.


    In ECMAScript, all string operations work on 16-bit code units, meaning that you
    can get unexpected results from UTF-16 encoded strings containing surrogate pairs,
    as in this example:


    ```

    let text = "§";

    console.log(text.length); // 2

    console.log(/\./.test(text)); // false

    console.log(text.charAt(0)); // ""

    console.log(text.charAt(1)); // ""

    console.log(text.charCodeAt(0)); // 55362

    console.log(text.charCodeAt(1)); // 57271

    ```


    The single Unicode character "§" is represented using surrogate pairs, and as
    such, the JavaScript string operations in this example treat the string as having
    two 16-bit characters. That means:


    +   - The length of text is 2 when it should be 1.

    - A regular expression trying to match a single character fails because it thinks
    there are two characters.

    - The charAt() method is unable to return a valid character string because neither
    of 16 bits corresponds to a printable character.

    - The charCodeAt() method also can''t identify the character properly. It returns
    the appropriate 16-bit number for each code unit, that is the closest you can
    get to the real value of text in ECMAScript 5.'
