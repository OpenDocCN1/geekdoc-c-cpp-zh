  md: "that can't be referenced before initialization without throwing an error. Parameter\
    \ initialization happens when the function is called, either by passing a value\
    \ for a parameter or by using the default parameter value.\nTo explore the default\
    \ parameter value TDZ, reconsider this example from page 41:\n\n```\nfunction\
    \ getValue(value) {\n  return value + 5;\n}\n```\n\n```\nfunction add(first, second\
    \ = getValue(first)) {\n  return first + second;\n}\n\nconsole.log(add(1, 1));\
    \    // 2\nconsole.log(add(1));      // 7\n```\n\nThe calls to add(1, 1) and add(1)\
    \ effectively execute the following code to create the first and second parameter\
    \ values:\n\n```\n// JavaScript representation of call to add(1, 1)\nlet first\
    \ = 1;\nlet second = 1;\n```\n\n```\n// JavaScript representation of call to add(1)\n\
    let first = 1;\nlet second = getValue(first);\n```\n\nWhen the function add()\
    \ executes, the bindings first and second are added to a parameter-specific TDZ\
    \ (similar to how let behaves). Although second can be initialized with the value\
    \ of first because first is always initialized at that time, the reverse is not\
    \ true. Now, consider this rewritten add function:\n\n```\nfunction add(first\
    \ = second, second) {\n  return first + second;\n}\n```\n\n```\nconsole.log(add(1,\
    \ 1));        // 2\nconsole.log(add(undefined, 1)); // throws an error\n```\n\n\
    The calls to add(1, 1) and add(undefined, 1) in this example now map to the following\
    \ code behind the scenes:\n\n```\n// JavaScript representation of call to add(1,\
    \ 1)\nlet first = 1;\nlet second = 1;\n```\n\n```\n// JavaScript representation\
    \ of call to add(undefined, 1)\nlet first = second;\nlet second = 1;\n```"
