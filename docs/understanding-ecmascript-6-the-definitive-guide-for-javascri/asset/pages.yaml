- img_proc: true
  md: "You might still want to use var in the global scope if you have code that should\
    \ be available from the global object. This is most common in a browser when you\
    \ want to access code across frames or windows. \n\n# Emerging Best Practices\
    \ for Block Bindings\n\nWhile ECMAScript 6 was in development, there was widespread\
    \ belief you should use let by default instead of var declarations. For many JavaScript\
    \ developers, let behaves exactly the way they thought var would behaved, so the\
    \ direct replacement made logical sense. In this case, you would use const for\
    \ variables that needed modification protection.\n\nHowever, as more developers\
    \ migrated to ECMAScript 6, an alternate approach gained popularity: use const\
    \ by default, and only use let when you know a variable's value needs to change.\
    \ The rationale is that most variables should not change their value after initialization\
    \ because unexpected value changes are a source of bugs. This idea has significant\
    \ amount of traction and is worth exploring in your code as you adopt ECMAScript\
    \ 6.\n\n# Summary\n\nThe let and const block bindings introduce lexical scoping\
    \ to JavaScript. These declarations are not hoisted and only exist within the\
    \ block in which they are declared. Block bindings offer behavior that is more\
    \ like other languages and less likely to cause unintentional errors, because\
    \ variables can now be declared exactly where they are needed. As a side effect,\
    \ you cannot access variables before they are declared, even with safe operators,\
    \ such as typeof. Attempting to access a block binding before its declaration\
    \ results in an error due to the binding's presence in the TDZ.\n\nIn many cases,\
    \ let and const behave in a manner similar to var; however, this is not true in\
    \ loops. For-in and for-of loops, both let and const create a new binding with\
    \ each iteration through the loop. As a result, functions created inside the loop\
    \ body can access the loop bindings current values rather than their values after\
    \ the loop's final iteration (behavior with var). The same is true for let declarations\
    \ in a for loop, where attempting to use a const declaration in a for loop may\
    \ result in an error.\n\nThe current best practice for block bindings is to use\
    \ const by default and only use let when you know a variable's value needs to\
    \ change. Doing so ensures a basic level of immutability in code that can help\
    \ prevent certain types of errors."
