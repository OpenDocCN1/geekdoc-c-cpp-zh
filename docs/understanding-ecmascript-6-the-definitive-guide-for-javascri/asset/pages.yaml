  md: "# Defining Object String Tags in ECMAScript 6\n\nECMAScript 6 refines the tendency\
    \ of native objects to reveal their identity using Object.prototype.toString()\
    \ through the Symbol.toString symbol. This symbol represents a property on each\
    \ object that defines what value should be produced when Object.prototype.toString.call()\
    \ is called on it. For an array, the value that function returns is explained\
    \ by storing \"Array\" in the Symbol.toString property.\n\nLikewise, you can define\
    \ the Symbol.toStringTag value for your own objects:\n\n```\nfunction Person(name)\
    \ {\n  this.name = name;\n}\n```\n\n```\nPerson.prototype[Symbol.toStringTag]\
    \ = \"Person\";\n```\n\n```\nvar me = new Person(\"Nicholas\");\nconsole.log(me.toString());\
    \ // [object Person]\nconsole.log(Object.prototype.toString.call(me)); // [object\
    \ Person]\n```\n\nHere, a Symbol.toStringTag property is defined on Person.prototype\
    \ to provide the default behavior for creating a string representation. Because\
    \ Person.prototype inherits the Object.prototype.toString() method, the value\
    \ returned from Symbol.toStringTag is also used when calling the me.toString()\
    \ method. However, you can define your own toString method that provides a different\
    \ behavior without affecting the use of the Object.prototype.toString.call() method.\
    \ Here's how that might look:\n\n```\nfunction Person(name) {\n  this.name = name;\n\
    }\n```\n\n```\nPerson.prototype[Symbol.toStringTag] = \"Person\";\n```\n\n```\n\
    Person.prototype.toString = function() {\n  return this.name;\n}\n```\n\n```\n\
    var me = new Person(\"Nicholas\");\n```\n\n```\nconsole.log(me.toString()); //\
    \ \"Nicholas\"\nconsole.log(Object.prototype.toString.call(me)); // [object Person]\n\
    ```\n\nThis code defines Person.prototype.toString() to return the value of the\
    \ name property. Because Person instances no longer inherit the Object.prototype.toString()\
    \ method, calling me.toString() exhibits a different behavior.\n\n> All objects\
    \ inherit Symbol.toStringTag from Object.prototype unless otherwise specified.\
    \ The string \"Object\" is the default property value."
