  md: "In ECMAScript 5, this code throws a syntax error. In ECMAScript 6,\nthe doSomething()\
    \ function is considered a block-level declaration and can\be accessed and called\
    \ within the same block in which it was defined. For\nexample:\n\n```\n\"use strict\"\
    ;\n\nif (true) {\n  console.log(typeof doSomething);   // \"function\"\n  function\
    \ doSomething() {\n    // empty\n\n    doSomething();\n  }\n  console.log(typeof\
    \ doSomething);   // \"undefined\"\n```\n\nBlock-level functions are hoisted to\
    \ the top of the block in which they\ndefined, so typeof doSomething returns \"\
    function\", even though it appears\nbefore the function declaration in the code.\
    \ Once the block is finished\nexecuting, doSomething() no longer exists.\n\n#\
    \ Deciding When to Use Block-Level Functions\n\nBlock-level functions are similar\
    \ to let function expressions in that the\nfunction definition is removed once\
    \ execution flows out of the block in\nwhich it's defined. The key difference\
    \ is that block-level functions are\nhisted to the top of the containing block.\
    \ Function expressions that use\nlet are not hoisted, as this example illustrates:\n\
    \n```\n\"use strict\";\n\nif (true) {\n  console.log(typeof doSomething);   //\
    \ throws an error\n  let doSomething = function () {\n    // empty\n\n    doSomething();\n\
    }\nnconsole.log(typeof doSomething);\n```\n\nHere, code execution stops when typeof\
    \ doSomething is executed, because\nthe let statement has not been executed yet,\
    \ leaving doSomething() in the TDZ.\nKnowing this difference, you can choose to\
    \ use block-level functions\nor let expressions based on whether or not you want\
    \ the hoisting behavior."
