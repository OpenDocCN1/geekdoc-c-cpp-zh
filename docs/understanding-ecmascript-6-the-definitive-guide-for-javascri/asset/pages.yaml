  md: '# Table 12-1: Proxy Traps in JavaScript the behavior of


    | Proxy trap | Overrides the behavior of | Default behavior |

    |---|---|--|

    | get | Reading a property value | Reflect.get() |

    | set | Writing to a properly | Reflect.set() |

    | has | The in operator | Reflect.has() |

    | deleteProperty | The delete operator | Reflect.deleteProperty() |

    | getPrototypeOf | Object.getPrototypeOf() | Reflect.getPrototype() |

    | setPrototypeOf | Object.setPrototypeOf() | Reflect.setPrototypeOf() |

    | isExtensible | Object.isExtensible() | Reflect.isExtensible() |

    | preventExtensions | Object.preventExtensions() | Reflect.preventExtensions()
    |

    | getOwnPropertyDescriptor | Object.getOwnPropertyDescriptor() | Reflect.getOwnPropertyDescriptor()
    |

    | defineProperty | Object.defineProperty() | Reflect.defineProperty() |

    | ownKeys | Object.getOwnPropertyNames(), and Object.getOwnPropertySymbols() |
    Reflect.ownKeys() |


    apply Calling a function Reflect.apply()


    construct Calling a function with new Reflect.construct()


    Each trap overrides some built-in behavior of JavaScript objects, allowing

    y to intercept and modify the behavior. If you still need to use the

    built-in behavior, you can use the corresponding reflection API method. The

    relationship between proxies and the reflection API becomes clear when you

    start creating proxies, it''s best to dive in and look at some examples.


    > The original ECMAScript 6 specification had an additional trap called enumerate

    was designed to alter how far-in and Object.keys() enumerated properties on

    an object. However, the enumerate trap was removed in ECMAScript 7 (also called

    ECMAScript 2016) because difficulties were discovered during implementation. The

    enumerate trap no longer exists in any JavaScript environment and is therefore
    not

    covered in this chapter.


    # Creating a Simple Proxy


    When you use the Proxy constructor to make a proxy, you''ll pass it through two
    argu-\gments: the target and a handler. A handler is an object that defines one
    or

    tore traps. The proxy uses the default behavior for all operations except

    when traps are defined for that operation. To create a simple forwarding

    proxy, you can use a handler with no traps, like this:


    ```

    let target = {};

    let proxy = new Proxy(target, {});nproxy.name = "proxy";

    ```'
