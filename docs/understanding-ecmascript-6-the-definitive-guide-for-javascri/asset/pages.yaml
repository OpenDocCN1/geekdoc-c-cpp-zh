  md: "# var Declarations and Hoisting\n\nVariable declarations using var are treated\
    \ as if they're at the top of the function (or in the global scope, if declared\
    \ outside of a function) regardless of the actual declaration occurs; this is\
    \ called hoisting. For a demonstration of what hoisting does, consider the following\
    \ function definition:\n\n```\nfunction getValue(condition) {\n\n  if (condition)\
    \ {\n    var value = \"blue\";\n\n    // other code\n    return value;\n  } else\
    \ {\n\n    // value exists here with a value of undefined\n    return null;\n\
    \  }\n\n  // value exists here with a value of undefined\n}\n```\n\nIf you are\
    \ unfamiliar with JavaScript, you might expect the variable value to be created\
    \ only if condition evaluates to true. In fact, the variable value is still created\
    \ regardless. Behind the scenes, the JavaScript engine changes the getValue function\
    \ to look like this:\n\n```\nfunction getValue(condition) {\n\n  var value;\n\n\
    \  if (condition) {\n    value = \"blue\";\n\n    // other code\n    return value;\n\
    \  } else {\n\n    return null;\n  }\n}\n```\n\nThe declaration of value is hoisted\
    \ to the top, and the initialization remains in the same spot. That means the\
    \ variable is still accessible from within the else clause. If accessed from the\
    \ else clause, the variable would just have a value of undefined because it hasn't\
    \ been initialized in the else block."
  merge: -1
  pgno: 27
- img_proc: true
  md: "It often takes new JavaScript developers some time to get used to declaration\
    \ hoisting, and misunderstanding this unique behavior causing bugs. For this reason,\
    \ ECMAScript 6 introduces block-level scoping to give developers more control\
    \ over a variable's life cycle.\n\n# Block-Level Declarations\n\nBlock-level declarations\
    \ declare bindings that are inaccessible outside a given block. Block scopes,\
    \ also called lexical scopes, are created in the following places:\n\n+   - Inside\
    \ a function\n- Inside a block (indicated by the { and } characters)\n\nBlock\
    \ scoping is how many C-based languages work, and the introduction of block-level\
    \ declarations in ECMAScript 6 is intended to provide that same flexibility (and\
    \ and uniformity) to JavaScript.\n\n# let Declarations\n\nThe let declaration\
    \ syntax is the same as the syntax for var. You can basically replace var with\
    \ let to declare a variable but limit the variable's scope to only the current\
    \ block (there are a few subtle differences, which are discussed in \"The Temporal\
    \ Dead Zone\" on page 6). Because let declarations are not hoisted to the top\
    \ of the enclosing block, it's best to place let declarations first in the block\
    \ so they're available to the entire block. Here's an example:\n\n```\nfunction\
    \ getValue(condition) {\n  if (condition) {\n    let value = \"blue\";\n\n   \
    \ // other code\n    return value;\n  } else {\n    // value doesn't exist here\n\
    \    return null;\n  }\n\n  // value doesn't exist here\n}\n```\n\nThis version\
    \ of the getValue function behaves more similarly to how you'd expect it to in\
    \ other C-based languages. Because the variable value is declared using let instead\
    \ of var, the declaration isn't hoisted to the top"
  merge: -1
