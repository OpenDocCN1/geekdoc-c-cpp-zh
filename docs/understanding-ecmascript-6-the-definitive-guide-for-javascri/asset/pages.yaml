  md: "# The Regular Expression u Flag\n\nYou can accomplish many common string operations\
    \ through regular expressions. But remember that regular expressions assume 16-bit\
    \ code units, each represents a single character. To address this problem, ECMAScript\
    \ 6 defines a u flag (which stands for Unicode) for use in regular expressions.\n\
    \n# The u Flag in Action\n\nWhen a regular expression has the u flag set, it switches\
    \ modes to work on characters, not code units. That means the regular expression\
    \ should no longer treat surrogate pairs as separate characters in strings and\
    \ behave as expected. For example, consider this code:\n\n```\nlet text = \"吉\"\
    ;nconsole.log(text.length); // 2\nconsole.log(/^.$/test(text)); // false\nconsole.log(/^.$u.test(text));\
    \ // true\n```\n\nThe regular expression /^$/ matches any input string with a\
    \ single character. When it's used without the u flag, this regular expression\
    \ matches on code units, so the Japanese character (which is represented by two\
    \ code units) doesn't match the regular expression. When it's used with the u\
    \ flag, the regular expression compares characters instead of code units, so the\
    \ Japanese character matches.\n\n# Counting Code Points\n\nUnfortunately, ECMAScript\
    \ 6 doesn't add a method to determine how many code points a string has (the length\
    \ property still returns the number of code units in the string), but with the\
    \ u flag, you can use regular expressions to figure out it, as follows:\n\n```\n\
    function codePointLength(text) {\n  let result = text.match(/[\\s\\S]/gu);\n \
    \ return result ? result.length : 0;\n}\nconsole.log(codePointLength(\"abc\\));\
    \ // 3\nconsole.log(codePointLength(\"吉bc\\)); // 3\n```\n\nThis example calls\
    \ match() to check text for both whitespace and non-whitespace characters (using\
    \ [\\s\\S]) to ensure the pattern matches (newlines) using a regular expression\
    \ that is applied globally with Unicode enabled. The result contains an array\
    \ of matches when there's at least one match, so the array length is the number\
    \ of code points in the string. In Unicode, the strings \"abc\" and \"吉bc\" have\
    \ three characters, so the array length is three.\n\n18 Chapter 2"
