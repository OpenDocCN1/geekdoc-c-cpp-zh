  md: 'TC-39, the committee responsible for driving ECMAScript process, put together
    a large draft specification for ECMAScript 4. ECMAScript 4 was massive in scope,
    introducing both small and large changes to the language. Updated features included
    new syntax, modules, classes, classical inheritance, private object members, optional
    type annotations, and more.


    The scope of the ECMAScript 4 changes caused a rift to form in TC-39: some members
    felt that the fourth edition was trying to accomplish too much. A group of leaders
    from Yahoo!, Google, and Microsoft created an alternate proposal for the next
    version of ECMAScript called ECMAScript 3.1. The "3.1 designation was intended
    to show that this version was an incremental change to the existing standard.


    ECMAScript 3.1 introduced very few syntax changes; instead, focused on property
    attributes, native JSON support, and methods for adding existing objects. Although
    an attempt was made to reconcile ECMAScript 3.1 and ECMAScript 4, the effort ultimately
    failed because the two camps had difficulty resolving the very different perspectives
    on how the language should grow.


    In 2008, Brendan Eich, the creator of JavaScript, announced that TC-39 would focus
    its efforts on standardizing ECMAScript 3.1. It would table the major syntax and
    feature changes of ECMAScript 4 until the next version of ECMAScript was standardized,
    and all members of the committee would work to bring the best pieces of ECMAScript
    3.1 and 4 together after that point into an effort initially nicknamed ECMAScript
    Harmony.


    ECMAScript 3.1 was eventually standardized as the fifth edition of ECMA-262, also
    described as ECMAScript 5. The committee never released ECMAScript 4 to avoid
    confusion with the now-defunct effort of the same name. Work then began on ECMAScript
    Harmony, with ECMAScript 6 being the first standard released in this new "harmonious"
    spirit.


    ECMAScript 6 reached complete status in 2015 and formally dubbed "ECMAScript 2015."
    (But this text refers to it as ECMAScript 6, the name most familiar to developers.)
    The features widely from completely new objects and patterns to syntax changes
    and new methods on existing objects. The exciting aspect of ECMAScript 6 is that
    all of its changes are geared toward solving problems that developers actually
    face.


    # About This Book


    A good understanding of ECMAScript 6 features is critical for all JavaScript developers
    going forward. The language features introduced in ECMMA-Script 6 represent the
    foundation upon which JavaScript applications will be built for the foreseeable
    future. That''s where this book comes in. I hope that you''ll read this book to
    learn ECMAScript 6 features so you''ll be ready to start using them as soon as
    you need to.'
  merge: -1
