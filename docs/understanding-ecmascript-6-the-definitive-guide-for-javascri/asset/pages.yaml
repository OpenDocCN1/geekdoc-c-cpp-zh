    # getOwnPropertyDescriptor() Methods


    Object.getOwnPropertyDescriptor() method coerces its first argument into an object
    when a primitive value is passed and then continues the operation. On the other
    hand, the Reflect.getOwnPropertyDescriptor() method throws an error if the first
    argument is a primitive value. Here''s an example that shows:


    ```

