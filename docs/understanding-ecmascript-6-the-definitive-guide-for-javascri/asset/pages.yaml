    \ handler\n  console.log(value); // 43\n});\n```\n\nHere, it's clear that the\
    \ second fulfillment handler is attached to p3 rather than p2. This is a subtle\
    \ but important distinction, because the second fulfillment handler will not be\
    \ called if p2 is rejected. For instance:\n\n```\nlet p1 = new Promise(function(resolve,\
    \ reject) {\n  resolve(42);\n});\n```\n\n```\nlet p2 = new Promise(function(resolve,\
    \ reject) {\n  reject(43);\n});\n```\n\n```\np1.then(function(value) {\n  // first\
