    , \"blue\"];\nnfor (var i = 0, len = colors.length; i < len; i++) {\n  console.log(colors[i]);\n\
    }\n```\n\nThis standard for for loops tracks the index into the array using i\
    \ variable. The value of i increments each time the loop executes if i isn't larger\
    \ than the length of the array (stored in len).\nAlthough this loop is fairly\
    \ straightforward, loops grow complex when you need to nest and keep track of\
    \ multiple variables. Additional complexity can lead to errors, and the boilerplate\
    \ nature of the for loop lends itself to more errors because similar code is written\
    \ in multiple places. Iterators are meant to eliminate the complexity and error-prone\
    \ nature of loops.\n\n# What Are Iterators?\n\nIterators are objects with a specific\
    \ interface designed for iteration. All iterator objects have a next() method\
    \ that returns a result object. The object has two properties: value, which is\
    \ the next value, and done, which is a Boolean that's true when there are no more\
    \ values to return. The iterator keeps an internal pointer to a location within\
    \ a collection of values, and with each call to the next() method, it returns\
    \ the next appropriate value.\nIf you call next() after the last value has been\
    \ returned, the method returns done as true and value contains the return value\
    \ for the iterator. The return value is not part of the data set; rather, it's\
    \ a final piece of related data or undefined if such data exists. An iterator's\
    \ return value is similar to a function's return value in that it is a final way\
    \ to pass information to the caller.\nWith this information in mind, creating\
    \ an iterator using ECMAScript 5 is possible, as shown here:\n\n```\nfunction\
    \ createIterator(items) {\n  var i = 0;\n  return {\n    next: function() {\n\
    \      var done = (i >= items.length);\n      var value = done ? items[i++] :\
    \ undefined;\n```"
