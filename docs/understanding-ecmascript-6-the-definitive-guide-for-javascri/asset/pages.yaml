  md: 'Of course, there are downsides to the pattern used in these examples; namely,
    you can''t always be sure a function that returns a function is asynchronous.
    But for now, it''s only important that you understand the theory behind the task
    running. Another new feature in ECMAScript 6, promises, offers more flexible ways
    of scheduling asynchronous tasks, and Chapter 11 covers this topic in more depth.


    # # Summary


    Iterators are an important part of ECMAScript 6 and are at the root of several
    key language elements. On the surface, iterators provide a simple way to return
    a sequence of values using a simple API. However, there are far complex ways to
    use iterators in ECMAScript 6.


    The Symbol.iterator symbol is used to define default iterators for objects. Both
    built-in objects and developer-defined objects can use this symbol to provide
    a method that returns an iterator. By Symbol.iterator is provided on an object,
    the object is considered an iterable.


    The for-of loop uses iterators to return a series of values in a loop. Using for-of
    is easier than iterating with a traditional for loop because you no longer need
    to track values and control when the loop ends. The for-of loop automatically
    reads all values from the iterator until there are no more, and then it exits.


    To make for-of simpler to use, many values in ECMAScript 6 have default iterators.
    All the collection types—that is, arrays, maps, and sets—have iterators designed
    to make their contents easy to access. Strings also have a default iterator, which
    makes iterating over the characters of the string easy code units


    The spread works with any iterable and converting iterables into arrays easy,
    too. The conversion works by reading values from an iterator and inserting them
    individually into an array.


    A generator is a special function that automatically creates an iterator when
    called. Generator definitions are indicated by an asterisk (*) and of the yield
    keyword to indicate what value to return for each successive call to the next().


    Generator delegation encourages good encapsulation of iterator behavior by letting
    reuse generators in new generators. You can use an existing iterator inside another
    generator by calling yield instead of yield. This allows you to create an iterator
    that returns values from multiple iterators.


    Perhaps the most interesting and exciting aspect of generators and iterators is
    the possibility of creating cleaner-looking asynchronous code. Instead of needing
    to use callbacks everywhere, you can set up code that looks synchronous but in
    fact uses yield to wait for asynchronous operations to complete.'
