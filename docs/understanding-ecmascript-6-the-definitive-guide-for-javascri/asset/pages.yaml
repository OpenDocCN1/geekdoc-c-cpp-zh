  md: '# Why Two Sets of Methods?


    The confusing aspect of Reflect.getPrototypeOf() and Reflect.setPrototype() is
    that they look suspiciously similar to the Object.getPrototypeOf() and Object.setPrototypeOf()
    methods. Both sets of methods perform similar operations, yet there are some distinct
    differences between the two.


