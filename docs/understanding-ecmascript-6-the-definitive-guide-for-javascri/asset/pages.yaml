    # Creating Symbols


    Symbols are unique among JavaScript primitives in that they don''t have a literal
    form, like true for Booleans or 42 for numbers. You can create a symbol using
    the global Symbol function, as in in this example:


    ```

    let firstName = Symbol();

    let person = {};


    person[firstName] = "Nicholas";

    console.log(person[firstName]); // "Nicholas"

    ```


    Here, the symbol firstName is created and used to assign a new property on the
    person object. When you use a symbol to assign a property, you must use that symbol
    each time you want to access the property. Be sure to name the symbol variable
    appropriately, so you can easily tell what the symbol represents.


    > NOTE Because symbols are primitive values, calling new Symbol() throws an error.
    You can create an instance of Symbol via new Object(yourSymbol) as well, but it''s
    unclear whether this capability would be useful.


    The Symbol function also accepts a description of the symbol as an optional argument.
    You cannot use the description to access the property, but I recommend always
    providing a description in this example to make reading and debugging symbols
    easier. For example:


    ```

    let firstName = Symbol("first name");

    let person = {};

    ```


    ```

    person[firstName] = "Nicholas";


    console.log("first name" in person); // false

    console.log(person[firstName]); // "Nicholas"

    console.log(firstName); // "Symbol(first name)"

    ```


    A symbol''s description is stored internally in the [[Description]] property.
    This property is read whenever the symbol''s toString() method is called either
    explicitly or implicitly. The firstName''s toString() method is called implicitly
    by console.log() in this example, so the description is printed to the log. It
    is not otherwise possible to access [[Description]] directly from code.'
