  md: "Although this approach works, it's not very fast, especially when applied to\
    \ long strings. You can use a string iterator (discussed in Chapter 8) as well.\
    \ In general, try to minimize counting code points whenever possible.\n\n# Determining\
    \ Support for the u Flag\n\nBecause the u flag is a syntax change, attempting\
    \ to use it in JavaScript engines that aren't compatible with ECMAScript 6 throws\
    \ a syntax error. The safest way is to determine if the u flag is supported with\
    \ a function, like this one:\n\n```\nfunction hasRegExpU() {\n  try {\n    var\
    \ pattern = new RegExp(\".\", \"u\");\n    return true;\n  } catch (ex) {\n  \
    \  return false;\n  }\n}\n```\n\nThis function uses the RegExp constructor to\
    \ pass the u flag as an argument. This syntax is valid even in earlier JavaScript\
    \ engines, but the constructor will throw an error if u isn't supported.\n\nIf\
    \ your code still needs to work in JavaScript engines, always use the RegExp constructor\
    \ when you're using the u flag. This will prevent syntax errors and allow you\
    \ to optionally detect and use the u flag without aborting execution.\n\n# Other\
    \ String Changes\n\nJavaScript's string manipulation abilities and utilities have\
    \ always lagged behind similar features in other languages. It was only in ECMAScript\
    \ 5 that the trim() method was added for strings, for example, and ECMAScript\
    \ 6 continues extending JavaScript's capacity to parse strings using new functionality.\n\
    \n# Methods for Identifying Substrings\n\nDevelopers have used the indexOf() method\
    \ to identify strings inside other strings since JavaScript was first introduced,\
    \ and they've long asked for easier ways to identify substrings. ECMAScript 6\
    \ includes the following three methods, which are designed to do that:\n\n+  \
    \ - The includes() method returns true if the given text is found anywhere within\
    \ the string. It returns false if not.\n- The startsWith() method returns true\
    \ if the given text is found at the beginning of the string. It returns false\
    \ if not.\n- The endsWith() method returns true if the given text is found at\
    \ the end of the string. It returns false if not.\n\nStrings and Regular Expressions\
    \ 19"
