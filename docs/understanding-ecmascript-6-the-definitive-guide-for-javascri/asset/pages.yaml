  md: '# Weak Map Uses and Limitations


    When you''re deciding whether to use a weak map or a regular map, the primary
    decision to consider is whether you want to use object keys. Anytime you''re using
    only object keys, a weak map is the best choice. A weak map will allow you to
    optimize memory usage and avoid memory leaks by ensuring that data isn''t retained
    after it''s no longer accessible.


    Keep in mind that weak maps give you very little visibility into their contents,
    so you can''t use the forEach() method, the size property, or the clear() method
    to manage the items. If you need some inspection capabilities, regular maps are
    a better choice. Just be to keep an eye on memory usage.


    Of course, if you only want to use nonobject keys, regular maps are your only
    choice.


    # Summary


    ECMAScript 6 formally introduces sets and maps into JavaScript. Prior to this
    addition, developers frequently used to mimic sets and maps, often running into
    problems due to the limitations associated with object properties.


    Sets are unordered lists of unique values. Values are not coerced to determine
    equivalence. Sets automatically remove duplicate values, so you can use a set
    to filter an array for duplicates and return the result. Sets are not subclasses
    of arrays, so you cannot randomly access a set''s values. Instead, you can use
    the has() method to determine if a value is contained in the set and use the size
    property to inspect the number of values in the set. The Set also has a forEach()
    method to process each set value.


    Weak sets are special sets that can contain only objects. The objects are stored
    with weak references, meaning that an item in a weak set will not block garbage
    collection if that item is the only remaining reference to an object. Weak set
    contents can''t be inspected by the complexities of memory management, so it''s
    best to use weak sets only for tracking objects that need to be grouped together.


    Maps are ordered key-value pairs where the key can be any data type. Similar to
    sets, keys are not coerced to determine equivalence, which means you can have
    a numeric 5 and a string ''5'' as two separate keys. A value of any data type
    can be associated with a key using the set() method, and that value can be retrieved
    by using the get() method. Maps also have a size property and a forEach() method
    to allow for easier access.


    Weak maps are a special type of map that can only have object keys. With weak
    sets, an object key reference is weak and doesn''t prevent garbage collection
    when it''s the only remaining reference to an object. When a key is garbage-collected,
    the value associated with the key is removed from the weak map. This memory management
    aspect makes maps uniquely suited for correlating additional information with
    objects whose life cycles are managed outside the code accessing them.'
