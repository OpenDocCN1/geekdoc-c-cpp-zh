    Typed arrays also include many methods that are functionally equivalent to regular
    array methods. You can use the following array methods on typed arrays:


    ```

    copyWith() findIndex() lastIndexOf(0) slice()

    entries() forEach() map() some()

    fill() indexOf(0) reduce() sort()

    filter() join() reduceRight() values()

    find() keys() reverse()

    ```


    Keep in mind that although these methods act like their counterparts on Array.prototype,
    they''re not exactly the same. The typed array'
