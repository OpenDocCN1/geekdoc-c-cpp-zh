  md: "# WHERE YIELD THROWS ERRORS\n\nYou can use the yield keyword only inside generators.\
    \ Using yield anywhere else is a syntax error, including in functions that are\
    \ inside generators, such as:\n\n```\nfunction *createIterator(items) {\n\n  items.forEach(function(item)\
    \ {\n\n    // syntax error\n    yield item + 1;\n  });\n});\n```\n\nEven though\
    \ yield is technically inside the createIterator() function, this code is a syntax\
    \ error because yield cannot cross function boundaries. The yield keyword is similar\
    \ to return in that a nested function cannot return a value for its containing\
    \ function.\n\n# Generator Function Expressions\n\nYou can use function expressions\
    \ to create generators by just including an asterisk (*) before the function keyword\
    \ and the opening parenthesis. For example:\n\n```\nlet createIterator = function\
    \ *(items) {\n  for (let i = 0; i < items.length; i++) {\n    yield items[i];\n\
    \  }\n}\n```\n\n```\nlet iterator = createIterator([1, 2, 3]);\n```\n\n```\nconsole.log(iterator.next());\
    \ // \"{ value: 1, done: false }\"\nconsole.log(iterator.next()); // \"{ value:\
    \ 2, done: false }\"\nconsole.log(iterator.next()); // \"{ value: 3, done: false\
    \ }\"\nconsole.log(iterator.next()); // \"{ value: undefined, done: true }\"\n\
    ```\n\n```\n// for all further calls\nconsole.log(iterator.next()); // \"{ value:\
    \ undefined, done: true }\"\n```\n\nIn this code, createIterator() is a function\
    \ expression instead of a function declaration. The asterisk goes between the\
    \ function keyword and the opening parenthesis because the function expression\
    \ is anonymous. Otherwise, this example is the same as the previous example, which\
    \ also used a for loop.\n\nCreating an arrow function that is also a generator\
    \ is not possible."
  merge: -1
