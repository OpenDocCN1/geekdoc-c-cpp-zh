  md: "# NOTES ON USING SUPER()\n\nKeep the following key points in mind when you're\
    \ using super():\n- You can only use super() in a derived class constructor. If\
    \ you try to use it in a nonderived class (a class that doesn't use extends) or\
    \ a function, it will throw an error.\n- You must call super() before accessing\
    \ this in the constructor. Because super() is responsible for initializing this,\
    \ attempting to access this before calling super() results in an error.\n- The\
    \ only way to calling super() is to return an object from the class constructor.\n\
    \n# Shadowing Class Methods\n\nThe methods on derived classes always shadow methods\
    \ of the same name on the base class. For instance, you can add getArea() to Square\
    \ to redefine that functionality:\n\n```\nclass Square extends Rectangle {\n \
    \ constructor(length) {\n    super(length, length);\n  }\n\n  // override and\
    \ shadow Rectangle.prototype.getArea()\n  getArea() {\n    return this.length\
    \ * this.length;\n  }\n}\n```\n\nBecause the getArea() method is defined as part\
    \ of Square, the Rectangle.prototype.getArea() will no longer be called by any\
    \ instances of Square. Of course, you can decide to call the base class version\
    \ of the method by using the super.getArea() method, like this:\n\n```\nclass\
    \ Square extends Rectangle {\n  constructor(length) {\n    super(length, length);\n\
    \  }\n\n  // override, shadow, and call Rectangle.prototype.getArea()\n  getArea()\
    \ {\n    return super.getArea();\n  }\n}\n```"
