  md: "Here, the rejectionHandled event is emitted when the rejection handler is finally\
    \ called. If the rejection handler were attached directly to rejection after being\
    \ created, the event wouldn't be emitted. The rejection handler would instead\
    \ be called during the same turn of the event loop where rejected was created,\
    \ which isn't useful.\n\nTo properly track potentially unhandled rejections, use\
    \ the events rejectionHandled and unhandledRejection to store a list of potentially\
    \ unhandled rejections. Then wait some period of time to inspect the list. For\
    \ example, look at this simple unhandled rejection tracker:\n\n```\nlet possiblyUnhandledRejections\
    \ = new Map();\n\n// when a rejection is unhandled, add it to the map\nprocess.on(\"\
    unhandledRejection\", function(reason, promise) {\n  possiblyUnhandledRejections.set(reason,\
    \ reason);\n});\n\nprocess.on(\"rejectionHandled\", function(promise) {\n  possiblyUnhandledRejections.delete(promise);\n\
    });\n\nsetInterval(function() {\n  possiblyUnhandledRejections.forEach(function(reason,\
    \ promise) {\n    console.log(reason.message ? reason.message : reason);\n  });\n\
    \n  // do something to handle these rejections\n  handleRejection(promise, reason);\n\
    });\n\n  possiblyUnhandledRejections.clear();\n```\n\nThis code uses a map to\
    \ store promises and their rejection reasons. Each promise is a key, and the promise's\
    \ reason is the associated value. Each time unhandledRejection is emitted, the\
    \ promise and its rejection reason are added to the map. Each time rejectionHandled\
    \ is emitted, the handled promise is removed from the map. As a result, possiblyUnhandledRejections\
    \ grows and shrinks as events are called. The setInterval() call checks the list\
    \ of possible unhandled rejections and outputs the information to the console\
    \ (in reality, you'll probably want to do something"
  merge: -1
