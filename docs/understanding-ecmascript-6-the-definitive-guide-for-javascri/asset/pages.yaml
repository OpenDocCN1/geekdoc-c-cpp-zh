  md: "This behavior introduces another useful capability. You can use a previ-\n\
    nous parameter as the default for a later parameter. Here's an example:\n\n```\n\
    function add(first, second = first) {\n  return first + second;\n}\n```\n\n```\n\
    console.log(add(1, 1)); // 2\nconsole.log(add(1)); // 2\n```\n\nIn this code,\
    \ the parameter second is given a default value of first,\nmeaning that passing\
