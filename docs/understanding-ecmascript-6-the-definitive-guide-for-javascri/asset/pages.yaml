    a different story about it. Here is mine.


    In 2013, I worked at a startup that pivoted from iOS to the web. Before I co-created
    Redux or participated in the JavaScript open source community. At the time, I
    was struggling to learn web development, and I was terrified. My team had to build
    a web version of our product from scratch in just a few months. In JavaScript.


    At first I scoffed at the idea of writing something large in JavaScript. But a
    new team member persuaded me that JavaScript was not a toy language. I agreed
    to give it a try. I set my prejudices aside, opened MDN and StackOverflow, and
    learned JavaScript in depth for the first time. The simplicity enchanted me. My
    colleague also taught me how to use tools such as a linter and a bundler. In a
    few weeks, I woke up and realized that I enjoyed writing JavaScript.


    But no language is perfect. I missed the frequent updates that I''d come to expect
    after working with other languages. The substantial update to JavaScript in a
