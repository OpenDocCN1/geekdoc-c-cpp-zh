  md: "```\nlet p1 = new Promise(function(resolve, reject) {\n  reject(42);\n});\n\
    ```\n\n```\np1.catch(function(value) {\n  // first fulfillment handler\n  console.log(value);\
    \    // \"42\"\n  return value + 1;\n}).then(function(value) {\n  // second fulfillment\
    \ handler\n  console.log(value);    // \"43\"\n});\n```\n\nHere, the executor\
    \ calls reject() with 42. That value is passed into the rejection handler for\
    \ the promise, where value + 1 is returned. Even though this return value is coming\
    \ from a rejection handler, it is still used in the fulfillment handler of the\
    \ next promise in the chain. The failure of one promise can allow the recovery\
    \ of the entire chain if necessary.\n\n# Returning Promises in Promise Chains\n\
    \nReturning primitive values from fulfillment and rejection handlers allows for\
    \ the passing of data between promises, but what if you return an object? If the\
    \ object is a promise, there's an extra step that takes to determine how to proceed.\
    \ Consider the following example:\n\n```\nlet p1 = new Promise(function(resolve,\
    \ reject) {\n  resolve(42);\n});\n```\n\n```\nlet p2 = new Promise(function(resolve,\
    \ reject) {\n  resolve(43);\n});\n```\n\n```\np1.then(function(value) {\n  //\
    \ first fulfillment handler\n  console.log(value);    // 42\n  return p2;\n}).then(function(value)\
    \ {\n  // second fulfillment handler\n  console.log(value);    // 43\n});\n```\n\
    \nIn this code, p1 schedules a job that resolves to 42. The fulfillment handler\
    \ for p1 returns p2, a promise already in the resolved state. The second fulfillment\
    \ handler is called because p2 has been fulfilled. If p2 were rejected, a rejection\
    \ handler (if present) would be called instead of the second fulfillment handler."
