  md: "You can mix and match the spread operator with other arguments as well. You\
    \ suppose you want the smallest number returned from Math.max() to be 0 (just\
    \ in case negative numbers sneak into the array). You can pass that argument separately\
    \ and still use the spread operator for the other arguments, as follows:\n\n```\n\
    let values = [-25, -50, -75, -100]\nconsole.log(Math.max(...values, 0)); // 0\n\
    ```\n\nIn this example, the last argument passed to Math.max() is 0, which comes\
    \ after the other arguments are passed in the spread operator.\nThe spread operator\
    \ for argument making using arrays much easier. You'll likely find it to be a\
    \ suitable replacement for the apply() method in most circumstances.\n\nIn addition\
    \ to the tools you've seen for default and rest parameters so far, in ECMAScript\
    \ 6, you can also apply both parameter types to JavaScript’s Function constructor.\n\
    \n# The Name Property\n\nIdentifying functions can be challenging in JavaScript\
    \ given the various ways you can define a function. Additionally, the prevalence\
    \ of anonymous function expressions makes debugging a bit more difficult, often\
    \ resulting in stack traces that are hard to read and decipher. For these reasons,\
    \ ECMAScript 6 adds the name property to all functions.\n\n# Choosing Appropriate\
    \ Names\n\nAll functions in an ECMAScript 6 program will have an appropriate value\
    \ for their name property. To see this in action, look at the following example,\
    \ which shows a function and function expression, and prints the name property\
    \ for both:\n\n```\nfunction doSomething() {\n  // empty\n}\nvar doAnotherThing\
    \ = function() {\n  // empty\n};\nconsole.log(doSomething.name); // \"doSomething\"\
    \nconsole.log(doAnotherThing.name); // \"doAnotherThing\"\n```\n\nIn this code,\
    \ doSomething() has a name property equal to \"doSomething\" because it's a function\
    \ declaration. The anonymous function expression doAnotherThing() has a name of\
    \ \"doAnotherThing\" because that's the name of the variable to which it is assigned."
