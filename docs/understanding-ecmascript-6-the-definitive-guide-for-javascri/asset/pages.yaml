  md: '# # 7


    # ## SETS AND MAPS


    ![](img/346dbcc81573ddc69906e98afee1e3ac_144_0.png)


    For most of its history, JavaScript had only one type of collection, which was
    represented by the Array type. (Although some developers may argue that all nonarray
    objects are just collections of key-value pairs, their intended use was originally
    quite different from arrays.) Arrays in JavaScript are used just like arrays in
    other languages, but before ECMAScript 6, the lack of other collection options
    meant arrays were often used as queues and stacks as well. Because arrays use
    only numeric indexes, developers used nonarray objects whenever a non index was
    necessary. That technique led to custom implementations of sets and maps using
    nonarray objects.


    A set is a list of values that cannot contain duplicates. You typically don''t
    access individual items in a set like you would in an array; instead, it''s much
    more common to just check to see if a value is present. A map is a collection
    of keys that correspond to specific values. Each item in'
