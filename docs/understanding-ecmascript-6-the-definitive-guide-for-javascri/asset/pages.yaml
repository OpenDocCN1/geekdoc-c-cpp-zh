  md: "correspond to and let you override those internal methods. When a function\
    \ is called without new, the apply trap receives, and Reflect.apply() expects,\
    \ the following arguments:\n\n```\ntrapTarget The function being executed (the\
    \ proxy's target)\nthisArg The value of this function inside the call\nargumentsList\
    \ An array of arguments passed to the function\n```\n\nThe construct trap, which\
    \ is called when the function is executed using new, receives the following arguments:\n\
    \n```\ntrapTarget The function being executed (the proxy's target)\nargumentsList\
    \ An array of arguments passed to the function\n```\n\nThe Reflect.construct()\
    \ method also accepts these two arguments and has an optional third argument called\
    \ newTarget. When given, the newTarget specifies the value of new.target inside\
    \ the function.\n\nTogether, the apply and construct traps completely control\
    \ the behavior of any proxy target function. To mimic the default behavior of\
    \ a function, you can do this:\n\n```\nlet target = function() { return 42 };\n\
