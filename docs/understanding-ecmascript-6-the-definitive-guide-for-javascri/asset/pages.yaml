  md: "Curly braces denote the function's body, which works just fine in the cases\
    \ you've seen so far. But an arrow function that wants to return an object literal\
    \ outside a function body must wrap the literal in parentheses. For example:\n\
    \n```\nlet getTempItem = id => ({ id: id, name: \"Temp\" });\n```\n\n// effectively\
    \ equivalent to:\n\n```\nlet getTempItem = function(id) {\n  return {\n    id:\
    \ id,\n    name: \"Temp\"\n  };\n};\n```\n\nWrapping the object literal in parentheses\
    \ signals that the curly braces are an object literal instead of the function\
    \ body.\n\n# Creating Immediately Invoked Function Expressions\n\nOne popular\
    \ use of functions in JavaScript is creating immediately invoked function expressions\
    \ (IIFEs). IIFEs allow you to define an anonymous function and call it immediately\
    \ without saving a reference. This pattern comes in handy when you want to create\
    \ a scope that is shielded from the rest of a program. For example:\n\n```\nlet\
    \ person = function(name) {\n  return {\n    getName: function() {\n      return\
    \ name;\n    }\n  };\n}(\"Nicholas\");\nconsole.log(person.getName()); // \"Nicholas\"\
    \n```\n\nIn this code, the IIFE creates an object with a getName() method. The\
    \ method uses the name argument as the return value, effectively making name a\
    \ private member of the returned object.\nYou can accomplish the same thing using\
    \ arrow functions, as long as you wrap the arrow function in parentheses:\n\n\
    ```\nlet person = ((name) => {\n  return {\n    getName: function() {\n      return\
    \ name;\n    }\n  });\n```"
