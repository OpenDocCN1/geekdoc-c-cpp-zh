    # No Redeclaration


    If an identifier has already been defined in a scope, using the identifier in
    a let declaration inside that scope causes an error to be thrown. For example:


    ```

    var count = 30;


    // throws an error

    let count = 40;

    ```


    In this example, count is declared twice: once with var and once with let. Because
    let will not redefine an identifier that already exists in the same scope, the
    let declaration will throw an error. Conversely, no error is thrown if a let declaration
    creates a new variable with the same name as a variable in its containing scope,
    as demonstrated in the following code:


    ```

    var count = 30;


    if (condition) {


    // doesn''t throw an error

    let count = 40;


    // more code

    }

    ```


    This let declaration doesn''t throw an error because it creates a new variable
    called count within the if statement instead of creating count in the surrounding
    block. Inside the if block, this new variable shadows the global count, preventing
    access to it until execution exits the block.


    # const Declarations


    You can also define bindings in ECMAScript 6 with the const declaration syntax.
    Bindings declared using const are considered constants, meaning their values cannot
    be changed once set. For this reason, every const binding must be initialized
    on declaration, as shown in this example:


    ```

    // valid constant

    const maxItems = 30;

    ```


    ```

    // syntax error: missing initialization

    const name;

    ```'
