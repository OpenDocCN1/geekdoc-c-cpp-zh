    # Sets in ECMAScript 6


    ECMAScript 6 adds a Set type that is an ordered list of values without dupli-

    cates. Sets allow fast access to the data they contain, adding a more efficient

    m of tracking discrete values.


    # Creating Sets and Adding Items


    Sets are created using new Set(), and items are added to a set by calling the

    add()) method. You can see how many items are in a set by checking the size

    property:


    ```

    let set = new Set();

    set.add(5);

    set.add("5");

    ```


    ```

    console.log(set.size); // 2

    ```


    Sets don''t coerce values to determine whether they''re the same. That

    means a set can contain the number 5 and the string "5" as two separate

    items. The only exception is that -0 and +0 are considered to be the same).

    You can also add multiple objects to the set, and those objects will remain

    ddistinct:


    ```

    let set = new Set(),

    key1 = {};

    key2 = {};

    ```


    ```

    set.add(key1);

    set.add(key2);

    ```


    ```

    console.log(set.size); // 2

    ```'
