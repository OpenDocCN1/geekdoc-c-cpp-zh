  md: 'destructuring happens on the temporary array, which has the values of b and
    a copied into its first and second positions. The effect is that the vari-ables
    have swapped values.


    > Like object destructuring assignment, an error is thrown when the right side
    of an array destructured assignment expression evaluates to null or undefined.


    # Default Values


    Array destructuring assignment allows you to specify a default value for any position
    in the array, too. The default value is used when the property at the given position
    either doesn'' exist or has the value undefined. For example:


    ```

    let colors = [ "red" ];

    let [ firstColor, secondNumber = "green" ] = colors;

    console.log(firstColor);    // "red"

    console.log(secondColor); // "green"

    ```


    In this code, the colors array has only one item, so there is nothing for secondNumber
    to match. Because there is a default value, secondNumber is set to "green" instead
    of undefined.


    # Nested Array Destructuring


    You can destructure nested arrays in a manner similar to destructuring nested
    objects. By inserting another array pattern into the overall pattern, the destructuring
    will descend into a nested array, like this:


    ```

    let colors = [ "red", [ "green", "lightgreen" ], "blue" ];

    // later

    ```


    ```

    let [ firstColor, secondNumber ] = colors;

    console.log(firstColor);    // "red"

    console.log(secondColor); // "green"

    ```


    The secondNumber variable refers to the "green" value inside the colors array.
    That item is contained within a second array, so the extra square brackets around
    secondNumber in the destructuring pattern are necessary. With objects, you can
    nest arrays deeply.


    # Rest Items


    Chapter 3 introduced rest parameters for functions, and array destructuring has
    a similar concept called rest items. Rest items use the ... syntax to assign the
    remaining items in an array to a particular variable. Take a look at the following
    example.'
