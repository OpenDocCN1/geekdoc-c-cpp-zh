  md: 'The view object in this example has access to all 10 bytes in buffer. You can
    also create a view over a portion of a buffer. Just provide a byte offset and,
    optionally, the number of bytes to include from that offset. When a number of
    bytes isn''t included, the DataView will go from the offset to the end of the
    buffer by default. For example:


    ```

    let buffer = new ArrayBuffer(10);

    view = new DataView(buffer, 5, 2); // cover bytes 5 and 6

    ```


    Here, view operates only on the bytes at indexes 5 and 6. This approach allows
    you to create several views over the same array buffer, which can be useful if
    you want to use a single memory location for an entire application rather than
    dynamically allocating space as needed.


    # Retrieving View Information


    You can retrieve information about a view by fetching the following read-only
    properties:


    +   - buffer The array buffer that the view is tied to

    - byteOffset The second argument to the DataView constructor, if provided (0 by
    default)

    - byteLength The third argument to the DataView constructor, if provided (the
    buffer''s bytelength by default)


    Using these properties, you can inspect how a view is operating, like this:


    ```

    let buffer = new ArrayBuffer(10);

    view1 = new DataView(buffer); // cover all bytes

    view2 = new DataView(buffer, 5, 2); // cover bytes 5 and 6


    console.log(view1.buffer === buffer); // true

    console.log(view2.buffer === buffer); // true

    console.log(view1.byteOffset); // 0

    console.log(view2.byteOffset); // 5

    console.log(view1.byteLength); // 10

    console.log(view2.byteLength); // 2

    ```


    This code creates view1, a view over the entire array buffer, and view2, which
    have equivalent buffer properties because both work on the same array buffer.
    However, the byteOffset and bytelength are different for each view. They reflect
    the portion of the array buffer where each view operates.


    Of course, reading information about memory isn''t very useful on its own. You
    need to write data into and read data out of that memory to get any benefit.'
