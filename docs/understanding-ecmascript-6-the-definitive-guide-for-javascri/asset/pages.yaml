  md: "# The Object.is() Method\n\nWhen you want to compare values in JavaScript,\
    \ you're probably using either the equals operator (==) or the identically equals\
    \ operator (===). Many developers prefer the latter to avoid type coercion pitfalls.\
    \ But the identically equals operator isn't entirely accurate. For example, the\
    \ values +0 and -0 are considered equal by ==, even though they're represented\
    \ differently in the JavaScript engine. Also, NaN === NaN returns false, which\
    \ necessitates using isNaN to detect NaN properly.\n\nECMAScript 6 introduces\
    \ the Object.is() method to remedy the inaccuracies of the identically equals\
    \ operator. This method accepts two arguments and returns true if they are equivalent.\
    \ Two values are considered equivalent when they're the same type and have the\
    \ same value. Here are some examples:\n\n```\nconsole.log(+0 == -0);         //\
    \ true\nconsole.log(+0 === -0);      // true\nconsole.Object.is(+0, -0)); // false\n\
    \nconsole.log(NaN == NaN);      // false\nconsole.log(NaN === NaN);    // false\n\
    console.Object.is(NaN, NaN); // true\n\nconsole.log(5 == 5);         // true\n\
    console.log(5 == \"5\");      // true\nconsole.log(5 === 5);        // true\n\
    console.log(5 === \"5\");      // false\nconsole.Object.is(5, 5));    // true\n\
    console.Object.is(5, \"5\");  // false\n```\n\nIn many cases, Object.is() works\
    \ the same as the === operator. The only differences are that +0 and -0 are not\
    \ considered equivalent, and NaN is considered equivalent to NaN. But there's\
    \ no need to stop using Object.is() instead of == or === based on how those special\
    \ cases affect your code.\n\n# The Object.assign() Method\n\nMixins are among\
    \ the most popular patterns for object composition in JavaScript. In a mixin,\
    \ one object receives properties and methods from another object. Many JavaScript\
    \ libraries have a mixin similar to this:\n\n```\nfunction mixin(receiver, supplier)\
    \ {\n  Object.keys(supplier).forEach(function(key) {\n    receiver[key] = supplier[key];\n\
    \  });\n\n  return receiver;\n}\n```"
  merge: -1
