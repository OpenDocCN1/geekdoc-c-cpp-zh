  md: "# Defining Tags\n\nA tag is simply function that is called with the processed\
    \ template literal data. The tag receives data about the template literal as individual\
    \ pieces and must combine the pieces to create the result. The first argument\
    \ is an array containing the literal strings as interpreted by JavaScript. Each\
    \ subsequent argument is the interpreted value of each substitution.\n\nTag functions\
    \ are typically defined using rest arguments to make handling the data easier\
    \ than using individual named arguments, as follows:\n\n```\nfunction tag(literals,\
    \ ...substitutions) {\n  // return a string\n}\n```\n\nTo better understand what\
    \ gets passed to tags, consider the following:\n\n```\nlet count = 10,\nprice\
    \ = 0.25,\nmessage = passthru`${count} items cost $$(count * price).toFixed(2)}`;\n\
    ```\n\nIf you had a function called passthru(), that function would receive three\
    \ arguments when used as a template literal tag. The first argument would be the\
    \ literals array, containing the following elements:\n\n+   - The empty string\
    \ before the first substitution (\"\")\n- The string after the first substitution\
    \ and before the second (\" items cost $\n\nThe next argument would be 10, which\
    \ is the interpreted value for the count variable. This value becomes the first\
    \ element in a substitutions array. The third argument would be \"2.50\", which\
    \ is the interpreted value for (count * price).toFixed(2) and the second element\
    \ in the substitutions array.\n\nNote that the first item in literals is an empty\
    \ string. This ensures that literals[0] is always the start of the string, just\
    \ like literals[literals.length-1] is the end of the string. The number of items\
    \ in the substitutions array is always one fewer than the number of items in the\
    \ literals array, which means the expression substitutions.length === literals.length-1\
    \ is always true.\n\nUsing this pattern, the literals and substitutions arrays\
    \ can be interwoven to create a resulting string. The first item in literals comes\
    \ first, the first item in substitutions is next, and so on until the string is\
    \ complete. As an example, you can mimic the default behavior of a template literal\
    \ by alternating values from these two arrays, as in the following code."
