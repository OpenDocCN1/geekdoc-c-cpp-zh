    \ can use those strings to reference the properties later. Anything you would\
    \ put inside square brackets while using bracket notation on object instances\
    \ would also work for computed property names inside object literals.\n\n# New\
    \ Methods\n\nOne of the design goals of ECMAScript, beginning with ECMAScript\
