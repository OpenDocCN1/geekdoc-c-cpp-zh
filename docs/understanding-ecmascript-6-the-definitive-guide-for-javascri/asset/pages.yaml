  md: "```\n// some time later...\nrejected.catch(function(value) {\n  // now rejected\
    \ has been handled\n  console.log(value);\n});\n```\n\nYou can call then() or\
    \ catch() at any point and have them work correctly regardless of whether the\
    \ promise is settled or not, making it difficult to know precisely when a promise\
    \ will be handled. In this case, the promise is rejected immediately but isn't\
    \ handled until later.\n\nAlthough it s possible that a future version of ECMAScript\
