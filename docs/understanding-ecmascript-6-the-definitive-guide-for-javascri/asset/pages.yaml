    # Substitutions


    At this point, template literals may look like fancier versions of normal JavaScript
    strings. The real difference between the two is in template literal substitutions.
    Substitutions allow you to embed any valid JavaScript expression inside a template
    literal and output the result as part of the string.


    Substitutions are delimited by an opening `${` and a closing `}` that can have
    any JavaScript expression inside. The simplest substitutions let you embed local
    variables directly into a resulting string, like:


    The substitution `${name}` accesses the local variable name and inserts it into
    the message string. The message variable then holds the result of the substitution
    immediately.


    > NOTE A template literal can access any variable accessible in the scope in which
    it is defined. Attempting to use an undeclared variable in a template literal
    throws an error in strict and non-strict modes.'
