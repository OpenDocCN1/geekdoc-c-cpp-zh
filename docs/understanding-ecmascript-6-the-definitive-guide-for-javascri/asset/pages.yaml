  md: "a map stores two pieces of data, and values are retrieved by specifying the\
    \ key to read from. Maps are frequently used as caches for storing data that is\
    \ quickly retrieved at a later time. Although ECMAScript 5 didn't formally have\
    \ sets and maps, developers worked around this limitation using non-array objects,\
    \ too.\n\nECMAScript 6 added sets and maps to JavaScript, and this chapter discusses\
    \ everything you need to know about these two collection types. First, I'll discuss\
    \ the workarounds developers used to implement sets and maps before ECMAScript\
    \ 6, and why those implementations were problematic. Then I'll cover how sets\
    \ and maps work in ECMAScript 6.\n\n# Sets and Maps in ECMAScript 5\n\nIn ECMAScript\
    \ 5, developers mimicked sets and maps by using object properties, like this:\n\
    \n```\nvar set = Object.create(null);\n\nset.foo = true;\n\n// checking for existence\n\
    if (set.foo) {\n    // code to execute\n}\n```\n\n> The set variable in this example\
    \ is an object with a null prototype, ensuring inherited properties are on the\
    \ object. Using object properties as unique values to be checked is a common approach\
    \ in ECMAScript 5. When a property is added to the set object, it is set to true\
    \ so conditional statements (such as the if statement in this example) can easily\
    \ check whether the value is present.\n\nThe only real difference between an object\
    \ used as a set and an object used as a map is the value being stored. For instance,\
    \ this example uses an object as a map:\n\n```\nvar map = Object.create(null);\n\
    map.foo = \"bar\";\n\n// retrieving a value\nvar value = map.foo;\n\nconsole.log(value);\
    \ // \"bar\"\n```\n\nThis code stores a string value \"bar\" under the key foo.\
    \ Unlike sets, maps are mostly used to retrieve information rather than just to\
    \ check for the key's existence."
