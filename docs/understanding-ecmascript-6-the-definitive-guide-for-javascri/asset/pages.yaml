  md: "# Rest Parameter Restrictions\n\nRest parameters have two restrictions. The\
    \ first restriction is that there can be only one rest parameter, and the rest\
    \ parameter must be last. For example, this code won't work:\n\n```\n// Syntax\
    \ error: Can't have a named parameter after rest parameters\nfunction pick(object,\
    \ ...keys, last) {\n  let result = Object.create(null);\n\n  for (let i = 0, len\
    \ = keys.length; i < len; i++) {\n    result[keys[i]] = object[keys[i]];\n  }\n\
    \n  return result;\n}\n```\n\nHere, the parameter last follows the rest parameter\
    \ keys, which would cause a syntax error.\nThe second restriction is that rest\
    \ parameters cannot be used in an object literal setter. That means this code\
    \ would also cause a syntax error:\n\n```\nlet object = {\n  // Syntax error:\
    \ Can't use rest param in setter\n  set name(...value) {\n    // do something\n\
    \  }\n};\n```\n\nThis restriction exists because object literal setters are restricted\
    \ to a single argument. Rest parameters are, by definition, an infinite number\
    \ of arguments, so they're not allowed in this context.\n\n# How Rest Parameters\
    \ Affect the arguments Object\n\nRest parameters were designed to replace arguments\
    \ in JavaScript. Originally, ECMAScript 4 eliminated arguments and added rest\
    \ parameters to allow an unlimited number of arguments to be passed to functions.\
    \ ECMAScript 4 was never standardized, but this idea was retained and reintroduced\
    \ in ECMAScript 6, despite arguments not being removed from the language.\nThe\
    \ arguments object works together with rest parameters by reflecting the arguments\
    \ that were passed to the function when called, as illustrated in the following\
    \ example."
