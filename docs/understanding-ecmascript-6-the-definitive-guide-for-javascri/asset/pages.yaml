  md: "# The Symbol.toPrimitive Method\n\nJavaScript frequently attempts to convert\
    \ objects into primitive values implicitly when you apply certain operations.\
    \ For instance, when you compare a string to an object using the double equals\
    \ (==) operator, the object is converted into a primitive value before comparing.\
    \ Exactly what primitive value should be used previously an internal operation,\
    \ but ECMAScript 6 exposes that value (making it changeable) through the Symbol.toPrimitive\
    \ method.\n\nThe Symbol.toPrimitive method is defined on the prototype of each\
    \ standard type and prescribes what should happen when the object is converted\
    \ into a primitive. When a primitive conversion is, Symbol.toPrimitive is called\
    \ with a single argument, referred to as hint in the specification. The hint argument\
    \ is one of three values: \"number\" is passed, Symbol.toPrimitive should return\
    \ a number. If \"string\" is passed, a string should be returned, and if \"default\"\
    \ is passed, the operation has no preference as to the type.\n\nFor most standard\
    \ objects, number mode has the following behaviors, which are listed in order\
    \ by priority:\n\n+   1. the valueOf() method, and if the result is a primitive\
    \ value, return it.\n2. Otherwise, call the toString() method, and if the result\
    \ is a primitive value, return it.\n3. Otherwise, throw an error.\n\nSimilarly,\
    \ for most standard objects, the behaviors of string mode have the following priority:\n\
    \n+   1. Call the toString() method, and if the result is a primitive value, return\
    \ it.\n2. Otherwise, call the valueOf() method, and if the result is a primitive\
    \ value, return it.\n3. Otherwise, throw an error.\n\nIn many cases, standard\
    \ objects treat default mode as equivalent to number mode (except for Date, which\
    \ treats default mode as equivalent to string mode). By defining a Symbol.toPrimitive\
    \ method, you can override these default coercion behaviors.\n\n> Default mode\
    \ is used only for the == operator, the + operator, and when passing a single\
    \ argument to the Date constructor. Most operations use string or number mode.\n\
    \nTo override the default conversion behaviors, use Symbol.toPrimitive and assign\
    \ a function as its value. For example:\n\n```\nfunction Temperature(degrees)\
    \ {\n  this.degrees = degrees;\n}\n```"
