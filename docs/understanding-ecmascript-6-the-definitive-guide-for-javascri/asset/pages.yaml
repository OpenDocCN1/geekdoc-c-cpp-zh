  md: '# Browser and Node.js Compatibility


    Many JavaScript environments, such as web browsers and Node.js, are actively working
    on implementing ECMAScript 6. This book doesn''t attempt to address the inconsistencies
    between implementations; instead, it focuses on what the specification defines
    as the correct behavior. As, it''s possible that your JavaScript environment may
    not conform to the behavior described in this book.


    # Who This Book Is For


    This book is intended as a guide for those who are already familiar with JavaScript
    and ECMAScript 5. Although a deep understanding of the language is not necessary
    to use this book, it will help you understand the differences between ECMAScript
    5 and 6. In particular, this book is aimed at intermediate-to-advanced JavaScript
    programming for a browser or Node.js environment who want to learn about the latest
    developments in the language.


    This book is not for beginners who have never written JavaScript. You''ll need
    to have a good basic understanding of the language to use this book.


    # Overview


    Each chapter and appendix in this book covers a different aspect of ECMAScript
    6. Many chapters start by discussing problems that ECMAScript 6 changes were made
    to solve to give you a broader context for those changes. All chapters include
    code examples to help you learn new syntax and concepts.


    +   - Chapter 1: Block Bindings talks about let and const, the block-level replacement
    for var.


    +   - Chapter 2: Strings and Regular Expressions covers additional functionality
    for string manipulation and inspection as well as the introduction of template
    strings.


    +   - Chapter 3: Functions discusses the various changes to functions, including
    the arrow function form, default parameters, rest parameters, and a few other
    features.


    +   - Chapter 4: Expanded Object Functionality explains the changes to how objects
    are created, modified, and used. Topics include changes to object literal syntax
    and reflection methods.


    +   - Chapter 5: Destructuring for Easier Data Access introduces object and array
    destructuring, which allow you to decompose objects and arrays using a concise
    syntax.


    +   - Chapter 6: Symbols and Symbol Properties introduces the concept of symbols,
    a new way to define properties. Symbols are a new primitive type that you can
    use to obscure (but not hide) object properties and methods.'
