    # # Basic Importing


    When you have a module with exports, you can access the functionality in another
    module by using the import keyword. The two parts of an import statement are the
    identifiers you''re importing and the module from which those identifiers should
    be imported.


    This is the statement''s basic form:


    ```

    import { identifier1, identifier2 } from "./example.js";

    ```


    The curly braces after import indicate the bindings to import from a given module.
    The keyword indicates the module from which to import the given module. The module
    is specified by a string representing the path to the module (called the module
    specifier). Browsers may pass this path to the <script> element, which means you
    must include a file extension. Node.js, on the other hand, follows its convention
    of differentiating between local files and packages based on a filesystem prefix.
    For instance, example would be a package and ./example.js would be a local file.


    +   - The list of bindings to import looks similar to a destructured object, but
    it''s not one.


    When you''re importing a binding from a module, the binding acts as though it
    was defined using const. As a result, you can''t define another variable with
    the same name (including importing another binding), use the identifier before
    the import statement, or change bind-ing''s value.'
