    The class declaration for PersonClass behaves similarly to PersonType in the previous
    example. But instead of defining a function as the constructor, class declarations
    allow you to define the constructor directly inside the class using the special
    constructor method name. Because class use the concise syntax, there''s no need
    to use the function keyword. All other method have no special meaning, so you
    can add as many methods as you want.


    Own properties, properties that occur on the instance rather than the prototype,
    can only be created inside a class constructor or method. In this example, name
    is an own property. I recommend creating all possible properties inside the constructor
    function so a single place in the class is responsible for all of them.


    Interestingly, class declarations are syntactic sugar on top of the existing custom
    type declarations. The PersonClass declaration actually creates a function that
    has the behavior of the constructor method, which is why typeof PersonClass gives
    "function" as the result. The sayName() also ends up as a method on PersonClass.prototype
    in the example, similar to the relationship between PersonClass and PersonType
    in the previous example. These similarities allow you to mix custom types and
    classes without worrying much about which you''re using.


    > NOTE Class prototypes, such as PersonClass.prototype in the preceding example,
    are read-only. That means you cannot assign a new value to the prototype like
    you can with functions.


    # Why Use the Class Syntax?


    Despite the similarities between classes and custom types, you need to keep some
    important differences in mind:


    +   - Class declarations, unlike function declarations, are not hoisted. Class
    declarations act like let declarations, so they exist in the temporal zone until
    execution reaches the declaration.

    - All code inside declarations runs in strict mode automatically. There''s no
