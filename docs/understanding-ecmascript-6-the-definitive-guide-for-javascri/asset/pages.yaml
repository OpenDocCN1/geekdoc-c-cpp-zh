    ```


    The Object.getPrototypeOf() method allows you to retrieve a prototype for the
    number 1 because it first coerces the value into a Number and then returns Number.prototype.
    The Reflect.getPrototypeOf() method does not coerce the value, and because 1 isn''t
    an object, it throws an error.


