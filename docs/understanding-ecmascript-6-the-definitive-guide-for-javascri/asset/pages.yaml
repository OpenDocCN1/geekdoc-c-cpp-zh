  md: '# # 9

    INTRODUCING JAVASCRIPT

    CLASSES


    ![](img/346dbcc81573ddc69906e98afee1e3ac_190_0.png)


    Unlike most formal object-oriented programming languages, JavaScript didn’t support
    classes and classical inheritance as the primary way of defining similar and related
    objects when it was created. This left many developers confused, and from pre-ECMAScript
    1 through ECMAScript 5, many libraries created utilities to make JavaScript look
    like it supported classes. Although some JavaScript developers feel strongly that
    the language doesn''t need classes, the number of libraries created specifically
    for this purpose led to the inclusion of classes in ECMAScript 6.


    When you’re exploring ECMAScript 6 classes, it’s helpful to understand the underlying
    mechanisms that classes use, so this chapter starts by how ECMAScript 5 developers
    achieved class-like behavior. However, as you’ll see, ECMAScript 6 classes aren’t
    the same as classes in other languages. They have a uniqueness that embraces the
    dynamic nature of JavaScript.'
