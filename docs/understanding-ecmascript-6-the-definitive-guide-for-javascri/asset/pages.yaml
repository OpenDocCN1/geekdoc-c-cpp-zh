  md: '# The Array Problem


    The JavaScript array object behaves in ways developers couldn''t mimic in their
    own objects prior to ECMAScript 6. An array''s length property is affected when
    you assign values to specific array items, and you can modify array items by modifying
    the length property. For example:


    ```

    let colors = [''red", "green", "blue"];

    console.log(colors.length); // 3

    colors[3] = "black";

    console.log(colors.length); // 4

    console.log(colors[3]); // "black"


    colors.length = 2;

    console.log(colors.length); // 2

    console.log(colors[3]); // undefined

    console.log(colors[2]); // undefined

    console.log(colors[1]); // "green"

    ```


    The colors array starts with three items. Assigning "black" to colors[3] automatically
    increments the length property to 4. Setting the length property to 2 removes
    the last two items in the array, leaving only the first two items. Nothing in
    ECMAScript 5 allows developers to achieve this behavior, but proxies change that.


    > This nonstandard behavior of numeric properties and the length property is why
    arrays are considered exotic objects in ECMAScript 6.


    # Introducing Proxies and Reflection


    Calling new Proxy() creates a proxy to use in place of another object (called
    the target). The proxy virtualizes the target so the proxy and the target appear
    to be functionally the same.


    Proxies allow you to intercept low-object operations on the target that are otherwise
    internal to the JavaScript engine. These low-level operations are intercepted
    using a trap, which is a function that responds to a specific operation.


    The reflection API, represented by the Reflect object, is a collection of methods
    that provide the default behavior for the same low-level operations that proxies
    can override. There is a Reflect method for every proxy trap. Those methods have
    the same name and are passed the arguments as their respective proxy traps. Table
    12-1 summarizes the proxy trap behavior.'
  merge: -1
