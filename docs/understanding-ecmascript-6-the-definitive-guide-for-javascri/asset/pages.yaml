  md: "# Object Declarations with const\n\nA const declaration prevents modification\
    \ of the binding, not of the value. That means const declarations for objects\
    \ don't prevent modification of those objects. For example:\n\n```\nconst person\
    \ = {\n  name: \"Nicholas\"\n};\n\n// works\nperson.name = \"Greg\"\n\n// throws\
    \ an error\nperson = {\n  name: \"Greg\"\n};\n```\n\nHere, the binding is created\
    \ with an initial value of an object with one property. It's possible to change\
    \ person.name without causing an error because this changes what person contains\
    \ but doesn't change the value that person is bound to. When this code attempts\
    \ to assign a value to person (thus attempting to change the binding), an error\
    \ will be thrown. This subtlety in how const works with objects is easy to understand.\
    \ Just keep in mind that const prevents modification of the binding, not modification\
    \ of the bound value.\n\n# The Temporal Dead Zone\n\nA variable declared with\
    \ either let or const cannot be accessed until after the declaration. Attempting\
    \ to do so results in a reference error, even when using normal safe operations,\
    \ such as the typeof operation in this statement:\n\n```\nif (condition) {\n \
    \ console.log(typeof value); // throws an error\n  let value = \"blue\"\n}\n```\n\
    \nHere, the variable is defined and initialized using let, but that statement\
    \ never executes because the previous line throws an error. The issue is what\
    \ what the JavaScript community dubbed the temporal dead zone (TDZ). The TDZ is\
    \ never named explicitly in the ECMAScript specification, but the term is often\
    \ used to describe why let and const bindings are not accessible before their\
    \ declaration. This section covers some subtleties of declaration placement that\
    \ it causes, and although the examples show let, use, note that the same information\
    \ applies to const.\n\nWhen a JavaScript engine looks through an upcoming block\
    \ and finds a variable declaration, it either hoists the declaration to the top\
    \ of the function or global scope (for var) or places the declaration in the TDZ\
    \ (for let and const). Any attempt to access a variable in the TDZ results in\
    \ a runtime"
