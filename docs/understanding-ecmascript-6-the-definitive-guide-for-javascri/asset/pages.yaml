    \ argumentList);\n  }\n});\n```\n\n```\n// a proxy with a function as its target\
    \ looks like a function\nconsole.log(typeof proxy); // \"function\"\n```\n\n```\n\
    console.log(proxy());\n// 42\n```\n\n```\nvar instance = new proxy();\nconsole.log(instanceof\
    \ proxy); // true\nconsole.log(instanceof target); // true\n```\n\nHere, you have\
    \ a function that returns the number 42. The proxy for that function uses the\
    \ apply and construct traps to delegate those behaviors to the Reflect.apply()\
    \ and Reflect.construct() methods, respectively. The end result is that the proxy\
    \ works exactly like the target function, including identifying itself as a function\
