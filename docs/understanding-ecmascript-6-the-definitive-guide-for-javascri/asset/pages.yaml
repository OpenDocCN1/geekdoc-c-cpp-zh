  md: "# Special Cases of the name Property\n\nAlthough appropriate names for function\
    \ declarations and function expressions are easy to find, ECMAScript 6 goes further\
    \ to ensure that all functions have appropriate names. To illustrate this, consider\
    \ the following program:\n\n```\nvar doSomething = function doSomethingElse()\
    \ {\n  // empty\n};\nvar person = {\n  get firstName() {\n    return \"Nicholas\"\
    \n  },\n  sayName: function() {\n    console.log(this.name);\n  }\n};\n\nconsole.log(doSomething.name);\
    \ // \"doSomethingElse\"\nconsole.log(person.sayName.name); // \"sayName\"\nconsole.log(person.firstName.name);\
    \ // \"get firstName\"\n```\n\nIn this example, doSomething.name is \"doSomethingElse\"\
    \ because the function expression has a name, and name takes priority over the\
    \ variable to which the function was assigned. Name property of person.sayName()\
    \ is \"sayName\" because the value was interpreted from the object literal. Similarly,\
    \ person.firstName is actually a getter function, so its name is \"get firstName\"\
    \ to indicate this difference. Setters are prefixed with \"set\" as well.\n\n\
    There are a couple of other special cases for function names, too. Functions created\
    \ using bind() will prefix their names with a space, and functions created using\
    \ the Function constructor use the name \"anonymous\", as in this example:\n\n\
    ```\nvar doSomething = function() {\n  // empty\n};\n\nconsole.log(doSomething.bind().name);\
    \ // \"bound doSomething\"\nconsole.log((new Function()).name); // \"anonymous\"\
    \n```\n\nThe name of a bound function will always be the name of the function\
    \ being bound with the the \"bound \" so the bound version of doSomething() is\
    \ \"bound doSomething\".\n\nKeep in mind that the value of name for any function\
    \ does not necessarily refer to a variable of the same name. Name property is\
    \ meant to be informative, to help with debugging, so there's no way to use the\
    \ value of name to get a reference to the function."
