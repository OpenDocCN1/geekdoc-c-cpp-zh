    \ The rest of this section discusses a few key examples of functionality.\n\n\
    # the codePoint() Method\n\nOne method ECMAScript 6 added to fully support UTF-16\
    \ is the codePoint() method, which retrieves the code point that maps to a given\
    \ position in a string. This method accepts the code unit position rather than\
    \ the character position and returns its results with those of charCode():\n\n\
    ```\nlet text = \"古\";\n```\n\n```\nconsole.log(text.charCodeAt(0)); // 55362\n\
    console.log(text.charCodeAt(1)); // 57271\nconsole.log(text.charCodeAt(2)); //\
    \ 97\n```\n\n```\nconsole.log(text.codePointAt(0)); // 134071\nconsole.log(text.codePointAt(1));\
    \ // 57271\nconsole.log(text.codePointAt(2)); // 97\n```\n\nThe codePointAt()\
    \ method returns the same value as the charCodeAt() method unless it operates\
    \ on non-BMP characters. The first character in text is non-BMP and is therefore\
    \ composed of two code units, meaning the length property is 3 rather than 2.\
    \ The charCodeAt() method returns only the first code unit for position 0, but\
    \ codePointAt() returns the full code point, even though the code point spans\
    \ multiple code points. Both methods return the same value for position 1 (the\
    \ second code unit of the first character) and 2 (the \"a\" character).\n\nCalling\
    \ the codePointAt() method on a character is the easiest way to determine whether\
    \ that character is represented by one or two code points. Here's a function you\
    \ could write:\n\n```\nfunction is32Bit(c) {\n  return c.codePointAt(0) > 0xFFFF;\n\
    }\n```\n\n```\nconsole.log(is32Bit(\"古\")); // true\nconsole.log(is32Bit(\"a\"\
    )); // false\n```\n\nThe upper bound of 16-bit characters is represented in hexadecimal\
    \ FFFF, so any code point greater than that number must be represented by two\
    \ code units, for a total of 32 bits."
