  md: "# Default Parameter Expressions\n\nPerhaps the most interesting feature of\
    \ default parameter values is the default parameter value need not be a primitive\
    \ value. You can, for example, execute a function to retrieve the default parameter\
    \ value, like this:\n\n```\nfunction getValue() {\n  return 5;\n}\n\nfunction\
    \ add(first, second = getValue()) {\n  return first + second;\n}\n\nconsole.log(add(1,\
    \ 1)); // 2\nconsole.log(add(1));    // 6\n```\n\nHere, if the last argument isn't\
    \ provided, the function getValue() is called to retrieve the correct default\
    \ value. Keep in mind that getValue() is called only when add() is called without\
    \ a second parameter, not when the function declaration is first parsed. That\
    \ means if getValue() were written differently, it could potentially return a\
    \ different value. For instance:\n\n```\nlet value = 5;\n\nfunction getValue()\
    \ {\n  return value++;\n}\n\nfunction add(first, second = getValue()) {\n  return\
    \ first + second;\n}\n\nconsole.log(add(1, 1)); // 2\nconsole.log(add(1));   \
    \ // 6\nconsole.log(add(1));    // 7\n```\n\nIn this example, value begins as\
    \ 5 and increments each time getValue() is called. The first call to add(1) returns\
    \ 6, and the second call to add(1) returns 7 because value was incremented. Because\
    \ the default value for second is evaluated only when the function is called,\
    \ changes to that value can be made at any time.\n\n> WARNING Careful when using\
    \ function calls as default parameter values. If you forget the parentheses, such\
    \ as second = getValue in this example, you are passing a reference to the function\
    \ rather than the result of the function call."
