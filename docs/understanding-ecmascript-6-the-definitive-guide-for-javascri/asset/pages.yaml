  md: "```\ndocument.addEventListener(\"click\", (function(event) {\n  this.doSomething(event.type);\
    \ // no error\n}).bind(this), false);\n\ndoSomething: function(type) {\n  console.log(\"\
    Handling \" + type + \" for \" + this.id);\n};\n```\n\nNow the code works as expected,\
    \ but it might look a bit strange. By binding(this), you're actually creating\
