  md: 'Using a weak set is a lot like using a regular set. You can add, remove, and
    check for references in the weak set. You can also seed a weak set with values
    by passing an iterable to the constructor:


    ```

    let key1 = {};

    key2 = {};

    set = new WeakSet([key1, key2]);


    console.log(set.has(key1)); // true

    console.log(set.has(key2)); // true

    ```


    In this example, an array is passed to the WeakSet constructor. Because this array
    contains two objects, objects are added into the weak set. Keep in mind that an
    error will be thrown if the array contains any non-object values, because WeakSet
    can''t accept primitive values.


    # Key Differences Between Set Types


    The biggest difference between weak sets and regular sets is that the weak reference
    is held to the object value. Here''s an example that demonstrates this difference:


    ```

    let set = new WeakSet(),

    key = {};


    // add the object to the set

    set.add(key);


    console.log(set.has(key)); // true


    // remove the last strong reference to key (also removes from weak set)

    key = null;

    ```


    After this code executes, the reference to key in the weak set is no longer accessible.
    It''s not possible to verify its because you would need a reference to that object
    to pass to the has() method. This can make testing weak sets a little confusing,
    but you can trust that the reference has been properly removed by the JavaScript
    engine.


    The preceding examples show that weak sets share some characteristics with regular
    sets, but there are some differences:


    +   - In a WeakSet instance, the add() method throws an error when passed a nonobject
    (has() and delete() always return false for nonobject arguments).

    - Weak sets aren''t iterables and cannot be used in a for-of-loop.

    - Weak sets don''t expose iterators (such as the keys() and values() methods),
    so there is no way to programmatically determine the contents of a weak set.

    - Weak sets don''t have a forEach() method.

    - Weak sets don''t have a size property.'
