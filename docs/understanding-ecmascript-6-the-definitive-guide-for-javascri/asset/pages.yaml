  md: "error. That variable is only removed from the TDZ, and therefore is safe to\
    \ use, once execution flows to the variable declaration.\nThis is true anytime\
    \ you attempt to use a variable declared with let or const before it is defined.\
    \ As the previous example demonstrated, even applies to the normally safe typeof\
    \ operator. However, you can use typeof on a variable outside the block that variable\
    \ is declared without throwing an error, although it may not produce the results\
    \ you're after.\nConsider this:\n\n```\nconsole.log(typeof value); // \"undefined\"\
    \n\nif (condition) {\n  let value = \"blue\";\n}\n```\n\nThe variable value is\
    \ not in the TDZ when the typeof operation executes because it occurs outside\
    \ the block in which value is declared. That means there is no value binding,\
    \ and typeof simply returns \"undefined\".\nThe TDZ is just one unique aspect\
    \ of block bindings. Another unique aspect is what to do with their inside loops.\n\
    \n# Block Bindings in Loops\n\nPerhaps one area where developers most want block-level\
    \ scoping of variables is within loops, where the throwaway counter variable is\
    \ meant to be used only inside the loop. For instance, it's not uncommon to see\
    \ code like this in JavaScript:\n\n```\nfor (var i = 0; i < 10; i++) {\n  process(items[i]);\n\
    }\n```\n\n```\n// i is still accessible here\nconsole.log(i); // 10\n```\n\nIn\
    \ other languages where block-level scoping is the default, this example should\
    \ work as intended—only the for loop should have access to the variable. However,\
    \ in JavaScript, the variable i is still accessible after the loop is completed\
    \ because the var declaration is hoisted. Using let instead, as in the following\
    \ code, should produce the intended behavior:\n\n```\nfor (let i = 0; i < 10;\
    \ i++) {\n  process(items[i]);\n}\n```\n\n```\n// i is not accessible here - throws\
    \ an error\nconsole.log(i);\n```\n\nIn this example, the variable exists only\
    \ within the for loop. When the loop is complete, the variable is no longer accessible\
    \ elsewhere."
