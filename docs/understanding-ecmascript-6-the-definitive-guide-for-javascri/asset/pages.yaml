  md: "# Problems with Workarounds\n\nUsing objects as sets and maps works okay in\
    \ simple situations, but the approach can get more complicated when you run into\
    \ the limitations of object properties. For example, because all object properties\
    \ must be strings, you must ensure no two keys evaluate to the same string. Consider\
    \ the following:\n\n```\nvar map = Object.create(null);\nmap[5] = \"foo\";\n```\n\
    \n```\nconsole.log(map[\"5\"]); // \"foo\"\n```\n\nThis example assigns the string\
    \ value \"foo\" to a numeric key of 5. Internally, that numeric value is converted\
    \ to a string, map[\"5\"] and map[5] actually reference the same property. That\
    \ internal conversion can cause problems when you want to use numbers and strings\
    \ as keys. Another problem arises when you use objects as keys, like this:\n\n\
    ```\nvar map = Object.create(null);\nkey1 = {};\nkey2 = {};\nmap[key1] = \"foo\"\
    ;\n```\n\n```\nconsole.log(map[key2]); // \"foo\"\n```\n\nHere, map[key2] and\
    \ map[key1] reference the same value. The objects key1 and key2 are converted\
    \ to strings because object properties must be strings. Because \"[object Object]\"\
    \ is the default string representation for objects, both key1 and key2 are converted\
    \ to that string. This can cause errors that may not be obvious because it is\
    \ logical to assume that different object keys would, in fact, be different.\n\
    \nThe conversion to the default string representation makes it difficult to use\
    \ objects as keys.\n\nMaps with a key whose value is false present their particular\
    \ problem. A falsy value is automatically converted to false when used in situations\
    \ in which a Boolean value is required, such as in the condition of an if statement.\
    \ This conversion alone isn't a problem, as long as you're careful how you use\
    \ values. For instance, look at this code:\n\n```\nvar map = Object.create(null);\n\
    map.count = 1;\n```\n\n```\n// checking for the existence of \"count\" or for\
    \ a nonzero value\nif (map.count) {\n  // code to execute\n}\n```"
