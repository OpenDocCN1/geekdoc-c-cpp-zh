  md: "In ECMAScript 6, you can eliminate the duplication that exists around property\
    \ names and local variables by using the property initializer syntax. When an\
    \ object property name is the same as the local variable name, you can simply\
    \ include the name without a colon and value. For example, createPerson() can\
    \ be rewritten for ECMAScript 6 as follows:\n\n```\nfunction createPerson(name,\
    \ age) {\n  return {\n    name,\n    age\n  };\n}\n```\n\nWhen a property in an\
    \ object literal has only a name, the JavaScript engine looks in the surrounding\
    \ scope for a variable of the same name. If it finds one, that variable's value\
    \ is assigned to the same name on the object literal. In this example, object\
    \ literal property name is assigned the value of the local variable name. Shorthand\
    \ property syntax makes object literal initialization even more succinct and helps\
    \ to eliminate naming errors. Assigning a property with the same name as a local\
    \ variable is a very common pattern in JavaScript, making this extension a welcome\
    \ addition.\n\n# Concise Methods\n\nECMAScript 6 also improves the syntax for\
    \ assigning methods to object literals. In ECMAScript 5 and earlier, you must\
    \ specify a name and then the full function definition to add a method to an object,\
    \ as follows:\n\n```\nvar person = {\n  name: \"Nicholas\",\n  sayName: function()\
    \ {\n    console.log(this.name);\n  }\n}\n```\n\nIn ECMAScript 6, the syntax is\
    \ made more concise by eliminating the colon and the function keyword. That means\
    \ you can rewrite the example like this:\n\n```\nvar person = {\n  name: \"Nicholas\"\
    ,\n  sayName() {\n    console.log(this.name);\n  }\n}\n```\n\nThis shorthand syntax,\
    \ also called concise method syntax, creates a method on the person object just\
    \ as the previous example did. The sayName property is assigned an anonymous function\
    \ expression and has all the same characteristics as the ECMAScript 5 sayName\
    \ function. The one"
