  md: '# UNDERSTANDING ECMASCRIPT 7

    (2016)


    ![](img/346dbcc81573ddc69906e98afee1e3ac_330_0.png)


    The development of ECMAScript 6 took about four years, and after that, TC-39 decided
    that such a long development process was unsustainable. Instead, it moved to a
    yearly release cycle to ensure new language features would make it into development
    sooner.


    More frequent releases mean that each new edition of ECMAScript should have fewer
    features than ECMAScript 6. To signify this change, new versions of the specification
    no longer prominently feature the edition number and instead refer to the year
    in which the specification was published. As a result, ECMAScript 6 is also known
    as ECMAScript 2015, and ECMAScript 7 is formally known as ECMAScript 2016. TC-39
    expects to use the year-based naming system for all future ECMAScript editions.


    ECMAScript 2016 was finalized in March 2016 and contained only three additions
    to the language: a mathematical operator, a new array method, and a new syntax
    error. All three are covered in this appendix.'
