    # Symbol Coercion


    Type coercion is a significant part of JavaScript, and there''s a lot of flexibility
    in the language''s capability to coerce one data type into another. However, symbols
    are quite inflexible when it comes to coercion because other types lag a logical
    equivalent to a symbol. Specifically, symbols cannot be coerced into strings or
    numbers to prevent them from being accidentally used as properties that would
    otherwise be expected to behave as symbols.


    The examples in this chapter have console.log() to indicate the output for symbols,
    which works because console.log() calls String() on symbols. You can use String()
    directly to get the same result:


    ```

    let uid = Symbol.for("uid");

    desc = String(uid);

    ```


    ```

    console.log(desc); // "Symbol("uid")"

