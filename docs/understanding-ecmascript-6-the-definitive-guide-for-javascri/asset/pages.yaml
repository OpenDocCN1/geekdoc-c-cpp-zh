  md: "# The String.fromCodePoint()\n\nWhen JavaScript provides a way to do something,\
    \ it also provides a way to do the reverse. You can use codePoint() to retrieve\
    \ the code point for a character in a string, whereas String.fromCodePoint() produces\
    \ a single-character string from a given code point. For example:\n\n```\nconsole.log(String.fromCodePoint(134071));\
    \ // \"結\"\n```\n\nThink of String.fromCodePoint() as a more complete version\
    \ of the String, fromCharCode() method. Both give the same result for all characters\
    \ in the BMP. Only when you pass code points for characters outside of the BMP\
    \ is there a difference.\n\n# The normalize() Method\n\nAnother interesting aspect\
    \ of Unicode is that different characters can be considered equivalent for sorting\
    \ or other comparison-based operations. There are two ways to define these relationships.\
    \ The first relationship, canonical equivalence, means that two sequences of code\
    \ points are considered interchangeable in all respects. For example, a combination\
    \ of two characters can be canonically equivalent to one character. The second\
    \ relationship is compatibility. Two compatible sequences of code points look\
    \ different but can be used interchangeably in certain situations.\n\nDue to these\
    \ relationships, two strings representing fundamentally the same text can contain\
    \ different code point sequences. For example, the character \"æ\" and the two-character\
    \ string \"ae\" can be used interchangeably but are not strictly equivalent unless\
    \ normalized in some way.\n\nECMAScript 6 supports Unicode normalization forms\
    \ by giving strings a normalize() method. This method optionally accepts a single\
    \ string parameter that indicates that the following Unicode normalization forms\
    \ should be:\n\n+   - Normal Form Canonical Composition (\"NFC\\ the default\n\
    - Normal Form Canonical Decomposition (\"NFD\")\n- Normal Form Compatibility Composition\
    \ (\"NFKC\")\n- Normal Form Compatibility Decomposition (\"NFKD\")\n\nIt's the\
    \ scope of this book to explain the differences between these four forms. Just\
    \ keep in mind that when you're comparing strings, both strings must be normalized\
    \ to the same form. For example:\n\n```\nlet normalized = values.map(function(text)\
    \ {\n  return text.normalize();\n});\n\nnormalized.sort(function(first, second)\
    \ {\n  if (first < second) {\n    return -1;\n  }\n```"
