- img_proc: true
  md: 'Arithmetic on native JavaScript numbers was too slow for WebGL because the
    numbers were stored in a 64-bit floating-point format and converted to 32-bit
    integers as needed. Typed arrays were introduced to circumvent this limitation
    and provide better performance for arithmetic operations. The concept is that
    any single number can be treated like an array of bits and thus can use the familiar
    methods available on JavaScript arrays.


    ECMAScript 6 adopted typed arrays as a formal part of the language to ensure better
    compatibility across JavaScript engines and interoperability with JavaScript arrays.
    Although the ECMAScript 6 version is not the same as the WebGL version, similarities
    exist to make the ECMAScript 6 version an evolution of the WebGL version rather
    than a different approach.


    # Numeric Data Types


    JavaScript numbers are stored in IEEE 754 format, which uses 64 bits to store
    a floating-point representation of the number. This format represents integers
    and floats in JavaScript, and the conversion between the two formats happens frequently
    as numbers change. Typed arrays allow for the storage and manipulation of eight
    different numeric types:


    +   * Signed 8-bit integer (int8)

    * Unsigned 8-bit integer (uint8)

    * Signed 16-bit integer (int16)

    * Unsigned 16-bit integer (uint16)

    * Signed 32-bit integer (int32)

    * Unsigned 32-bit integer (uint32)

    * 32-bit float (float32)

    * 64-bit float (float64)


    If you represent a number that fits in an int8 as a normal JavaScript number,
    you''ll waste 56 bits. Those bits might better be used to store additional int8
    values or any other number that requires less than 56 bits. Using bits more efficiently
    is one of the use cases typed arrays address.


    All the operations and objects related to typed arrays are centered on these eight
    data types. But to use them, you''ll need to create an array buffer to store the
    data.


    > NOTE

    in this book, I refer to the eight data types using the abbreviations I showed
    in parentheses. Those abbreviations don''t appear in actual JavaScript code; they''re
    just short-hand for the longer descriptions.


    # Array Buffers


    The foundation for all typed arrays is an array buffer, which is a memory location
    that can contain a specified number of bytes. Creating an array'
