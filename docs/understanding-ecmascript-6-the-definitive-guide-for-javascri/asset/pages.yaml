  md: "Conversely, in ECMAScript 6 class-based inheritance, the value of this is first\
    \ created by the base (Array) and then modified by the derived constructor (MyArray).\
    \ The result is that this starts with all the built-in functionality of the base\
    \ and correctly receives all functionality related to it.\nThe following example\
    \ shows a class-based special array in action:\n\n```\nclass MyArray extends Array\
    \ {\n  // empty\n}\n\nvar colors = new MyArray();\ncolors[0] = \"red\"\nconsole.log(colors.length);\
    \ // 1\n\ncolors.length = 0;\nconsole.log(colors[0]); // undefined\n```\n\nMyArray\
    \ inherits directly from Array and therefore works like Array. Interacting with\
    \ numeric properties updates the length property, and manipulating the length\
    \ property updates the numeric properties. That means you can properly inherit\
    \ from Array to create your own derived array classes and inherit from other built-ins\
    \ as well. With all this functionality, ECMAScript 6 and derived classes have\
    \ effectively removed the last special case of inheriting from built-ins, but\
    \ that case is still worth exploring.\n\n# The Symbol.species Property\n\nA convenient\
    \ aspect of inheriting from built-ins is that any method that returns an instance\
    \ of the built-in will automatically return a derived class instance instead.\
    \ So, if you have a derived class called MyArray inherits from Array, methods\
