- img_proc: true
  md: "You can optionally define a default value to use when a specified property\
    \ doesn't exist. To do so, insert an equal sign (=) after the property name and\
    \ specify the default value, like this:\n\n```\nlet node = {\n  type: \"Identifier\"\
    ,\n  name: \"foo\"\n};\n```\n\n```\nlet { type, name, value = true } = node;\n\
    \nconsole.log(type); // \"Identifier\"\nconsole.log(name); // \"foo\"\nconsole.log(value);\
    \ // true\n```\n\nIn this example, the variable is given true as a default value.\
    \ The default value is only used if the property is missing or has a value of\
    \ undefined. Because no node.value property exists, the variable uses the default\
    \ value. This works similarly to the default parameter values for functions, as\
    \ discussed in Chapter 3.\n\n# Assigning to Different Local Names\n\nUp to this\
    \ point, each destructuring assignment has used the object property name as the\
    \ local variable; for example, the value of node.type was stored in a type variable.\
    \ This works well when you want to use the same name, but what if you don't? ECMAScript\
    \ 6 has an extended syntax that allows you to assign to a local variable with\
    \ a different name, and that syntax looks like the object literal non-shorthand\
    \ property initializer syntax. Here's an example:\n\n```\nlet node = {\n  type:\
    \ \"Identifier\",\n  name: \"foo\"\n};\n```\n\n```\nlet { type: localType, name:\
    \ localName } = node;\n```\n\n```\nconsole.log(localType); // \"Identifier\"\n\
    console.log(localName); // \"foo\"\n```\n\nThis code uses destructuring assignments\
    \ to declare the type and localNameVariables, which contain the values from the\
    \ node.type and name.properties, respectively. The syntax type: localType reads\
    \ the property named and stores its value in the localType variable. This is effectively\
    \ the opposite of traditional object literal syntax, where the name is on the\
    \ left of the colon and the value is on the right. In this case, the name is on\
    \ the right of the colon and the location of the value to read is on the left."
  merge: -1
  pgno: 112
- img_proc: true
  md: "You can add default values when you're using a different variable, as well.\
    \ The equal sign and default value are still placed after the local variable-name.\
    \ For example:\n\n```\nlet node = {\n  type: \"Identifier\"\n}\nlet { type: localType,\
    \ name: localName = \"bar\" } = node;\n\nconsole.log(localType); // \"Identifier\"\
    \nconsole.log(localName); // \"bar\"\n```\n\nHere, the localName variable has\
    \ a default value of \"bar\". The variable is assigned its default value because\
    \ no node.property exists.\nSo far, you've learned how to use object destructuring\
    \ on an object whose properties are primitive values. You can also use destructuring\
    \ to retrieve values in nested object structures.\n\n# Nested Object Destructuring\n\
    \nBy using syntax similar to that of object literals, you can navigate into a\
    \ nested object structure to retrieve the information you want. Here's an example:\n\
    \n```\nlet node = {\n  type: \"Identifier\",\n  name: \"foo\",\n  loc: {\n   \
    \ start: {\n      line: 1,\n      column: 1\n    },\n    end: {\n      line: 1,\n\
    \      column: 4\n    }\n  }\n}\nlet { loc: { start } } = node;\n\nconsole.log(start.line);\
    \ // 1\nconsole.log(start.column); // 1\n```\n\nThe destructuring pattern in this\
    \ example uses curly braces to indicate that the pattern should descend into the\
    \ property named loc on node and look for the start property. Recall from the\
    \ previous section that a colon in a destructuring pattern means the identifier\
    \ before the colon is giving a location to inspect, and the right side assigns\
    \ a value. A curly brace after the colon indicates that the destination is nested\
    \ another level into the object."
  merge: -1
  pgno: 113
- img_proc: true
  md: "You can go one step further and use a different name for the local variable\
    \ as well:\n\n```\nlet node = {\n  type: \"Identifier\",\n  name: \"foo\",\n \
    \ loc: {\n    start: {\n      line: 1,\n      column: 1\n    },\n    end: {\n\
    \      line: 1,\n      column: 4\n    }\n  }\n};\n```\n\n```\n// extract node.loc.start\n\
    let { loc: localStart } = node;\n\nconsole.log(localStart.line); // 1\nconsole.log(localStart.column);\
    \ // 1\n```\n\nIn this version of the code, node.loc.start is stored in a new\
    \ local variable called localStart. Destructuring patterns can be nested to an\
    \ arbitrary level of depth, and all capabilities will be available at each level.\n\
    \nObject destructuring is very powerful because it provides you with lots of options,\
    \ but array destructuring offers some unique capabilities that allow you to extract\
    \ information from arrays.\n\n# SYNTAX GOTCHA\n\n> Be careful when you're using\
    \ nested destructuring you can inadvertently create a statement that has no effect.\
    \ Empty curly braces are legal in object destructuring; however, they don't do\
    \ anything. For example:\n\n```\n// no variables declared!\nlet { loc: {} } =\
    \ node;\n```\n\n> No bindings are declared in this statement. Due to the curly\
    \ braces on the right, loc is used as a location to inspect rather than a binding\
    \ to create. In such cases, it's likely that the intent was to use = to define\
    \ a default value rather than to define a location. It is possible that this syntax\
    \ will be made illegal in the future, but for now, this is a gotcha to look out\
    \ for."
