    Typed arrays have the same iterators as regular arrays, too. Those are the entries()
    method, the keys() method, and the values() method. That means you can use the
    spread operator and for-of loops with typed arrays just like you would with regular
    arrays. For example:


    ```

    let ints = new Int16Array([25, 50]);

    intsArray = [...ints];

    ```


    ```

    console.log(intsArray instanceof Array); // true

    console.log(intsArray[0]); // 25

    console.log(intsArray[1]); // 50

    ```


    This code creates a new array called intsArray containing the same data as the
    typed array ints. With all other iterables, the spread operator makes converting
    typed arrays into regular arrays easy.


