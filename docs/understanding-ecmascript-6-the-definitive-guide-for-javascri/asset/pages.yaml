    # The fill() Method


    The fill() method fills one or more array elements with a specific value. When
    passed a value, fill() overwrites all the values in an array with that value.
    For example:


    ```

    let numbers = [1, 2, 3, 4];

    ```


    ```

    numbers.fill(1);

    ```


    ```

    console.log(numbers.toString()); // 1,1,1,1

    ```


    Here, the call to numbers.fill(1) changes all elements in numbers to 1. If you
    want to change only some of the elements rather than all of them, you can optionally
    include a start index and an exclusive end index, like this:


    ```

    let numbers = [1, 2, 3, 4];

    ```


    ```

    numbers.fill(1, 2);

    ```


    ```

    console.log(numbers.toString()); // 1,2,1,1

    ```


    ```

    numbers.fill(0, 1, 3);

    ```


    ```

    console.log(numbers.toString()); // 1,0,0,1

    ```


    In the numbers.fill(1, 2) call, the 2 argument starts filling elements at index
    2. The exclusive end index is not specified with a third argument, so numbers.length
    is used as the end index, meaning the last two elements in numbers are filled
    with 1. The numbers.fill(0, 1, 3) operation fills array elements at indexes 1
    and 2 with 0. Calling fill() with the second and third arguments allows you to
    fill array elements at once without writing the entire array.


    > If either the start or end index is negative, those values are added to the
    array''s length to determine the final location. For instance, a start location
    of -1 gives array.length - 1 as the index, where array is the array on which fill()
    is called.


    # The copyWithin() Method


    The copyWithin() method is similar to fill() in that it changes multiple array
