  md: "# Functions in Loops\n\nThe characteristics of var have long made creating\
    \ functions inside loops problematic, because the loop variables are accessible\
    \ from outside the scope of the loop. Consider the following code:\n\n```\nvar\
    \ funcs = [];\n\nfor (var i = 0; i < 10; i++) {\n  funcs.push(function() {\n \
    \   console.log(i);\n  });\n}\n\nfuncs.forEach(function(func) {\n  func(); //\
    \ outputs the number \"10\" ten times\n});\n```\n\nYou might ordinarily expect\
    \ this code to print the numbers 0 to 9 in a row, but it outputs the number 10\
    \ times in a row. The reason is that i is shared across each iteration of the\
    \ loop, meaning the functions created inside the loop hold a reference to the\
    \ same variable. The variable i has a value of 10 when the loop completes, so\
    \ when console.log(i) is called, that value prints each time.\n\nTo fix this problem,\
    \ developers use immediately invoked function expressions (IIFEs) inside loops\
    \ to force a new copy of the variable they want to iterate over to be created,\
    \ as in this example:\n\n```\nvar funcs = [];\n\nfor (var i = 0; i < 10; i++)\
    \ {\n  funcs.push(function(value) {\n    return function() {\n      console.log(value);\n\
    \    }\n  })(i));\n}\n\nfuncs.forEach(function(func) {\n  func(); // outputs 0,\
    \ then 1, then 2, up to 9\n});\n```\n\nThis version uses an IIFE inside the loop.\
    \ The variable is passed to the IIFE, which creates its own copy and stores it\
    \ as value. This is the value used by the function for that iteration, so calling\
    \ each function returns the expected value as the loop counts up from 0 to 9.\
    \ Fortunately, block-level binding with let and const in ECMAScript 6 can simplify\
    \ this loop for you."
  merge: -1
  pgno: 33
- img_proc: true
  md: "# let Declarations in Loops\n\nA let declaration simplifies loops by effectively\
    \ mimicking what the IIFE does in the previous example. On each iteration, the\
    \ loop creates a new variable and initializes it to the value of the variable\
    \ with the same name from the previous iteration. That means you can omit the\
    \ IIFE altogether and get the results you expect, like this:\n\n```\nvar funcs\
    \ = [];\n\nfor (let i = 0; i < 10; i++) {\n  funcs.push(function() {\n    console.log(i);\n\
    \  });\n}\n\nfuncs.forEach(function() {\n  func(); // outputs 0, then 1, 2, up\
    \ to 9\n});\n```\n\nThis loop works exactly like the loop that used var and an\
    \ IIFE but is arguably cleaner. The let declaration creates a new variable each\
    \ time through the loop, so each function created inside the loop gets its own\
    \ copy of i. Each copy of i has the value it was assigned at the beginning of\
    \ the iteration in which it was created. The same is true for for-in and for-of\
    \ loops, as shown here:\n\n```\nvar funcs = [];\nobject = {\n  a: true,\n  b:\
    \ true,\n  c: true\n};\n\nfor (let key in object) {\n  funcs.push(function() {\n\
    \    console.log(key);\n  });\n}\n```\n\n```\nfuncs.forEach(function(func) {\n\
    \  func(); // outputs \"a\", then \"b\", then \"c\"\n});\n```\n\nIn this example,\
    \ the for-in loop shows the same behavior as the for loop. Each time through the\
    \ loop, a new key binding is created, so each function has its own copy of the\
    \ key variable. The result is that each function outputs a different value. If\
    \ var were used to declare key, all functions would output \"c\"."
  merge: -1
