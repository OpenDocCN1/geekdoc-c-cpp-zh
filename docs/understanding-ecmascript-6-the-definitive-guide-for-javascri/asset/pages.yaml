    \n+   - 2\n- 2\n- a a\n- b b\n\nThe arguments object always correctly reflects\
    \ the parameters that were passed into a function regardless of rest parameter\
    \ usage.\n\n# # Increased Capabilities of the Function Constructor\n\nThe Function\
    \ constructor is an infrequently used part of JavaScript that allows you to dynamically\
