  md: "It's important to understand that the behavior of let declarations in loops\
    \ is specially defined behavior in the specification and is not necessarily related\
    \ to the non-hoisting characteristics of let. In fact, early implementations of\
    \ let did not exhibit this behavior, because it was added later in the process.\n\
    \n# const Declarations in Loops\n\nThe ECMAScript 6 specification doesn't explicitly\
    \ disallow const declarations in loops; however, const behaves differently based\
    \ on the type of loop you're using. For a normal loop, you can use const in the\
    \ initializer, but the loop will throw a warning if you attempt to change the\
    \ value.\n\n```\nvar func = [];\n\n// throws an error after one iteration\nfor\
    \ (const i = 0; i < 10; i++) {\n  funcs.push(function() {\n    console.log(i);\n\
    \  });\n}\n```\n\nIn this code, the i is declared as a constant. The first iteration\
    \ of the loop, where i is 0, executes successfully. An error is thrown when i++\
    \ executes because it's attempting to modify a constant. As such, you can only\
    \ use const to declare a variable in the loop initializer if you're not modifying\
    \ that variable.\n\nOn the other hand, when used in a for-in or for-of loop, a\
    \ const variable behaves similarly to a let variable. Therefore, the following\
    \ should not cause an error:\n\n```\nvar func = [];\nobject = {\n  a: true,\n\
    \  b: true,\n  c: true\n};\n\n// doesn't cause an error\nfor (const key in object)\
    \ {\n  funcs.push(function() {\n    console.log(key);\n  });\n}\n```\n\n```\n\
    funcs.forEach(function(func) {\n  func(); // outputs \"a\", then \"b\", then \"\
    c\"\n});\n```"
