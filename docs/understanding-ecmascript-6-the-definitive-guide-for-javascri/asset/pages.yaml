    \ instanceof MyArray); // true\n```\n\nIn this code, the slice() method returns\
    \ a MyArray instance. The slice() method is inherited from Array and returns an\
    \ instance of Array normally. Behind the scenes, the Symbol.species property is\
    \ actually making this change."
