    This chapter shows you how promises work. However, for a complete understanding,
    it''s important to understand some of the basic concepts upon which promises are
    built.


    # Asynchronous Programming Background


    JavaScript engines are built on the concept of a single-threaded event loop. Single-threaded
    means that only one piece of code is executed at a time. Contrast this with languages
    like Java or C++, where threads allow multiple different pieces of code to execute
    at the same time. Maintaining and protecting state when multiple pieces of code
    access and change state is a difficult problem and a frequent source of bugs in
    thread-based software.


    JavaScript engines execute only one piece of code at a time, so they need to keep
    track of code is meant to run. That code is kept in a job queue. Whenever a piece
    of code is ready to be executed, it is added to the job queue. When the JavaScript
    engine is finished executing code, the event loop executes the next job in the
    queue. The event loop is a process inside the JavaScript engine that monitors
    code execution and manages the job queue. Keep in mind that as a queue, job execution
    runs from the first job to the last.


    # The Event Model


    When a user clicks a button or presses a key on the keyboard, an event like onclick
    is triggered. That event might respond to the interaction by adding a new job
    to the back of the job queue. This is JavaScript''s most basic form of asynchronous
    programming. The event handler code doesn''t execute until the event fires, and
    when it executes, it has the appropriate context. For example:


    ```

    let button = document.getElementById("my-btn");

    button.onclick = function(event) {

    console.log("Clicked");

    };

    ```


    In this code, console.log("Clicked") will not be executed until button is clicked.
    When button is clicked, the function assigned to onclick is added to the back
    of the job queue and will be executed when all other jobs ahead of it are complete.


    Events work well for simple interactions, but chaining multiple asynchronous calls
    together is more complicated because you must keep track of the event target (button
    in this example) for each event. Additionally, you need to ensure that all appropriate
    event handlers are'
