  md: "# The Symbol.match, Symbol.replace, Symbol.search, and\nSymbol.split Properties\n\
    \nStrings and regular expressions have always had a close relationship with\n\
    JavaScript. In particular, the string type has several methods that accept\nregular\
    \ expressions as arguments:\n\n+   - match(regex) Determines whether the given\
    \ string matches a regular expression\n- replace(regex, replacement) Replaces\
    \ regular expression matches with a replacement\n- search(regex) Locates a regular\
    \ expression match inside the string\n- split(regex) Splits a string into an array\
    \ on a regular expression match\n\nThe way these methods interacted with regular\
    \ expressions was hidden\nfrom developers prior to ECMAScript 6, leaving no way\
    \ to mimic regular\nexpressions using developer-defined objects. ECMAScript 6\
    \ defines four\nsymbol that correspond to these four methods, effectively outsourcing\
    \ the\nnative behavior to the RegExp built-in object.\nSymbol.match, Symbol.replace,\
    \ Symbol.search, and Symbol.split symbols\nrepresent methods on the regular expression\
    \ argument that should be\ncalled on the first argument to the match() method,\
    \ the replace() method,\nt search() method, and the split() method, respectively.\
    \ The four symbol\nproperties are defined on RegExp.prototype as the default implementation\n\
    that the string methods should use.\n\nKnowing this, you can create an object\
    \ to use with the string methods\nin a way that is similar to regular expressions.\
    \ To do so, you can use the fol-\nlowing functions in code:\n\n+   - Symbol.match\
    \ Accepts a string argument and returns an array of\nmatches, or null if no match\
    \ is found\n- Symbol.replace Accepts a string argument and a replacement string,\n\
    and returns a string\n- Symbol.search Accepts a string argument and returns the\
    \ numeric\nindex of the match, or -1 if no match is found\n- Symbol.split Accepts\
    \ a string argument and returns an array contain-\ning pieces of the string split\
    \ on the match\n\nThe ability to define these properties on an object allows you\
    \ to create\nobjects that implement pattern matching without regular expressions\
    \ and\nuse those objects in methods that expect regular expressions. Here's an\n\
    example that shows these symbols in action:\n\n```\n// effectively for /^.{10}$/\n\
    let hasLength10 = {\n  [Symbol.match]: function(value) {\n    return value.length\
    \ === 10 ? [value] : null;\n  },\n```"
