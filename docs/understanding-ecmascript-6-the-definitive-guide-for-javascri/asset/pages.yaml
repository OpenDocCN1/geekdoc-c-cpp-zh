  md: "(Remember, Promise.resolve()) just passes through any promise passed in and\
    \ wraps any non-promise in a promise.). Next, a fulfillment handler is added that\
    \ retrieves the promise value and passes the value back to the iterator. Then,\
    \ result is assigned to the next yield result before the function() calls itself.\n\
    \nA rejection handler stores any rejection results in an error object. The task.throw()\
    \ method passes that error back into the iterator, and if an error is caught in\
    \ the task, result is assigned to the next yield result. Finally, step() is called\
    \ inside catch()) to continue.\n\nThis run() function can run any generator that\
    \ yields to achieve asynchronous code without exposing promises (or callbacks)\
    \ to the developer. In fact, because the return value of the function call is\
    \ always converted to a promise, the function can even return something other\
    \ than a promise. This means both synchronous and asynchronous methods work correctly\
    \ when called using yield, and you never have to check that the return value is\
    \ a promise.\n\nThe only concern is that asynchronous functions like readFile()\
    \ return a promise that correctly identifies its state. For Node.js built-in methods,\
    \ that means you'll have to convert those methods to return promises instead of\
    \ using callbacks.\n\n# FUTURE ASYNCHRONOUS TASK RUNNING\n\nBringing a simpler\
    \ syntax to asynchronous task running in JavaScript is under way. For instance,\
    \ an await syntax is in progress that would closely mirror the promise-based example\
    \ in the preceding section. The basic idea is to use a function marked with async\
    \ instead of a generator and use await instead of yield when calling a function,\
    \ such as:\n\n```\n(async function() {\n  let contents = await readFile(\"config.json\"\
    );\n  doSomethingWithContents(contents);\n  console.log(\"Done\");\n});\n```\n\
    \nThe async keyword before function indicates that the function is meant to run\
    \ in an asynchronous manner. The await keyword signals that the function to call\
    \ readFile(\"config.json\") should return a promise, and if it doesn't, the response\
    \ should be wrapped in a promise. Like the implementation of run() in the preceding\
    \ section, await will throw an error if the promise is rejected and otherwise\
    \ return the value from the promise. The end result is that you can write asynchronous\
    \ code as if it were synchronous without the overhead of managing an iterator-based\
    \ state machine.\n\nThe await syntax is expected to be finalized in ECMAScript\
