  md: "The maxItems binding is initialized, so its const declaration will work without\
    \ a problem. However, the name binding would cause a syntax error if you tried\
    \ to run the program containing this code because name is not initialized.\n\n\
    # Constants vs. let Declarations\n\nConstants, like let declarations, are block-level\
    \ declarations. That means constants are no longer accessible once execution flows\
    \ out of the block in which they were declared, and declarations are not hoisted,\
    \ as demonstrated in this example:\n\n```\nif (condition) {\n  const maxItems\
    \ = 5;\n\n  // more code\n}\n// maxItems isn't accessible here\n```\n\nIn this\
    \ code, the constant maxItems is declared within an if statement. After the statement\
    \ finishes executing, maxItems is not accessible outside that block.\n\nIn another\
    \ similarity to let, a const declaration throws an error when made with an identifier\
    \ for an already defined variable in the same scope. It doesn't matter whether\
    \ variable was declared using var (for global or function scope) or let (for block\
    \ scope). For example, consider this code:\n\n```\nvar message = \"Hello!\";\n\
    let age = 25;\n\n// each of these throws an error\nconst message = \"Goodbye!\"\
    ;\nconst age = 30;\n```\n\nThe two const would be valid alone, but given the previous\
    \ var and let declarations in this case, they are syntax errors.\n\nDespite these\
    \ similarities, there is one significant difference between let and const. Attempting\
    \ to assign a const to a previously defined constant will throw an error in both\
    \ strict and non-strict modes:\n\n```\nconst maxItems = 5;\n\n// throws an error\n\
    maxItems = 6;\n```\n\nLike constants in other languages, the maxItems variable\
    \ can't be assigned a new value later on. However, unlike constants in other languages,\
    \ the value a constant holds can be modified if it is an object."
