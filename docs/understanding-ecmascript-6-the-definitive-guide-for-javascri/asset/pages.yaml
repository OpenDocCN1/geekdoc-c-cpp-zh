  md: "# Inheriting from Built-Ins\n\nFor as long as JavaScript arrays have existed,\
    \ developers have wanted to create their own special array types through inheritance.\
    \ In ECMAScript 5 and earlier, this wasn't possible. Attempting to use classical\
    \ inheritance didn't result in functioning code. For example:\n\n```\n// built-in\
    \ array behavior\nvar colors = [];\ncolors[0] = \"red\";\nconsole.log(colors.length);\
    \ // 1\n\ncolors.length = 0;\nconsole.log(colors[0]); // undefined\n```\n\n//\
    \ trying to inherit from array in ES5\n\n```\nfunction MyArray() {\n  Array.apply(this,\
    \ arguments);\n}\n\nMyArray.prototype = Object.create(Array.prototype, {\n  value:\
    \ MyArray,\n  writable: true,\n  configurable: true,\n  enumerable: true\n});\n\
    ```\n\n```\nvar colors = new MyArray();\ncolors[0] = \"red\";\nconsole.log(colors.length);\
    \ // 0\n```\n\n```\ncolors.length = 0;\nconsole.log(colors[0]); // \"red\"\n```\n\
    \nThe console.log() output at the end of this code shows how using the classical\
    \ form of inheritance on an array results in unexpected behavior. The length and\
    \ numeric properties on an instance of MyArray don't behave the same way they\
    \ do for the built-in array because this functionality isn't covered by either\
    \ Array.apply() or assigning the prototype.\n\nOne goal of ECMAScript 6 classes\
    \ is to allow inheritance from all built-ins. To accomplish this, the inheritance\
    \ model of classes is slightly different than the classical inheritance model\
    \ found in ECMAScript 5 and earlier.\n\nIn ECMAScript 5 classical inheritance,\
    \ the value of this is first created by the derived type (for example, MyArray)\
    \ and then the base constructor (like the Array.apply() method) is called. That\
    \ means this starts out as an instance of MyArray and then is decorated with additional\
    \ properties from Array."
