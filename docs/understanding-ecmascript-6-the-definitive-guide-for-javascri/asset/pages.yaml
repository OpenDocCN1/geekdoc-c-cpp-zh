  md: "# Executor Errors\n\nIf an error is thrown inside an executor, the promise's\
    \ rejection handler is called. For example:\n\n```\nlet promise = new Promise(function(resolve,\
    \ reject) {\n  throw new Error(\"Explosion!\");\n});\n\npromise.catch(function(error)\
    \ {\n  console.log(error.message); // \"Explosion!\"\n});\n```\n\nIn this code,\
    \ the executor intentionally throws an error. An implicit try-catch is inside\
    \ every executor so that the error is caught and then passed to the rejection\
    \ handler. The previous example is equivalent to this:\n\n```\nlet promise = new\
    \ Promise(function(resolve, reject) {\n  try {\n    throw new Error(\"Explosion!\"\
    );\n  } catch (ex) {\n    reject(ex);\n  }\n});\n\npromise.catch(function(error)\
    \ {\n  console.log(error.message); // \"Explosion!\"\n});\n```\n\nThe executor\
    \ catches any thrown errors to simplify this common case, but if an error in the\
    \ executor is only reported when a rejection handler is present. Otherwise, the\
    \ error is suppressed. This became a problem for developers early on when using\
    \ promises, and JavaScript environments address it by providing hooks for catching\
    \ rejected promises.\n\n# Global Promise Rejection Handling\n\nOne of the most\
    \ controversial aspects of promises is the silent failure that occurs when a promise\
    \ is rejected without a rejection handler. Some consider this the biggest flaw\
    \ in the specification because it's the only part of the JavaScript language that\
    \ doesn't make errors apparent.\n\nDetermining whether a promise rejection was\
    \ handled isn't straightforward due to the nature of promises. For instance, consider\
    \ this:\n\n```\nlet rejected = Promise.reject(42);\n\n// at this point, rejected\
    \ is unhandled\n```"
