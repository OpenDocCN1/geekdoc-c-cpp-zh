- img_proc: true
  md: "You can also check that new.target was called with a specific constructor.\n\
    For instance, look at this example:\n\n```\nfunction Person(name) {\n  if (new.target\
    \ == Person) {\n    this.name = name;\n  } else {\n    throw Error(\"You must\
    \ use new with Person.\")\n  }\n}\n```\n\n```\nfunction AnotherPerson(name) {\n\
    \  Person.call(this, name);\n}\n```\n\n```\nvar person = new Person(\"Nicholas\"\
    );\nvar anotherPerson = new AnotherPerson(\"Nicholas\"); // error!\n```\n\nIn\
    \ this code, new.target must be Person in order to work correctly.\nWhen new AnotherPerson(\"\
    Nicholas\") is called, the subsequent call to\nPerson.call(this, name) will throw\
    \ an error because new.target is undefined\ninside of the Person constructor (it\
    \ was called without new).\n\nUsing new.target outside a function is a syntax\
    \ error.\n\nBy adding new.target, ECMAScript 6 helped to clarify some ambiguity\n\
    concerning function calls. Following along this theme, ECMAScript 6 also\naddresses\
    \ another previously ambiguous part of the language: declaring\nunction blocks.\n\
    \n# Block-Level Functions\n\nIn ECMAScript 3 and earlier, a function declaration\
    \ occurring inside a block\n(a-level function) was technically a syntax error,\
    \ but all browsers still sup-\nported it. Unfortunately, each browser allowed\
    \ the syntax behaved in a\nslightly different way, so it's considered a best practice\
    \ to avoid function decla-\nrations inside blocks (the best alternative is to\
    \ use a function expression).\n\nIn an attempt to rein in this incompatible behavior,\
    \ ECMAScript 5\nstrict mode introduced an error whenever a function declaration\
    \ was used\ninside a block in this way:\n\n```\n\"use strict\";\n\nif (true) {\n\
