    \ creates a tangled web of code that is difficult to understand and debug. Callbacks\
    \ also present problems when you want to implement more complex functionality.\
    \ What if you want two asynchronous operations to run in parallel and notify when\
    \ they're both complete? What if you want to start asynchronous operations at\
    \ the same time but only take the result of the first one to complete? In these\
