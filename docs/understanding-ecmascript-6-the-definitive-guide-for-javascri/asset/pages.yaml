  md: '# Importing a Single Binding


    Suppose that the example in "Basic Exporting" on page 284 is in a module with
    the filename example.js. You can import and use bindings from that module in a
    number of ways. For instance, you can just import one identifier:


    ```

    // import just one

    import { sum } from "./example.js";


    console.log(sum(1, 2)); // 3


    sum = 1; // throws an error

    ```


    Even though example.js exports more than just that one function, this example
    imports only the sum() function. If you try to assign a new value to sum, the
    result is an error because you can''t reassign imported bindings.


    NOTE


    Be sure to include /, ./, or ../ at the beginning of the string representing the
    file you''re importing for for the best compatibility across browsers and Node.js.


    # Importing Multiple Bindings


    If you want to import multiple bindings from the example module, you can explicitly
    list them as follows:


    ```

    // import multiple

    import { sum, multiply, magicNumber } from "./example.js";

    console.log(sum(1, magicNumber)); // 8

    console.log(multiply(1, 2)); // 2

    ```


    Here, three bindings are imported from the example module: sum, multiply, magicNumber.
    They are then used as though they were locally defined.


    # Importing an Entire Module


    A special case allows you to import the entire module as a single object. All
    exports are then available on that object as properties. For example:


    ```

    // import everything

    import * as example from "./example.js";

    console.log(example.sum(1,

    example.magicNumber)); // 8

    console.log(example.multiply(1, 2)); // 2

    ```


    In this code, all exported bindings in example.js are loaded into an object called
    example. The named exports (the sum() function, the multiple() function, and magicNumber)
    are then accessible as properties on example.'
