  md: '# About the Author


    Nicholas C. Zakas has been working on web applications since 2000, focusing on
    frontend development, and is known for writing and speaking- about frontend best
    practices. He honed his experience during his five years at Yahoo!, where he was
    principal frontend engineer for the Yahoo! home page. He is the author of several
    books, including The Principles of Object-Oriented JavaScript (No Starch Press,
    2014) and Professional JavaScript for Web Developers (Wrox, 2012).


    # About the Technical Reviewer


    Juriy Zaytsev (known online as kangax) is a frontend web developer based in New
    York. He’s been exploring and writing about the quirky nature of JavaScript since
    2007. Juriy has contributed to several open source projects, including Prototype.js
    and other popular projects like his own Fabric.js. He co-founded an on-demand
    custom print service called printio.ru and currently works at Facebook.'
