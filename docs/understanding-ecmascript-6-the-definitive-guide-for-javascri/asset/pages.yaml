    console.log(descriptor1); // undefined


    // throws error

    let descriptor2 = Reflect.getOwnPropertyDescriptor(2, "name");

    ```


    Object.getOwnPropertyDescriptor() method returns undefined because it coerces
    2 into an object, and that object has no name property. This is the method''s
    standard behavior when a property with the given name is not found on an object.
    However, when Reflect.getOwnPropertyDescriptor() is called, an error is thrown
    immediately because method does not accept primitive values for the target.


    # the OwnKeys Trap


    The OwnKeys trap intercepts the internal method [[PropertyKeys]] and allows you
    to override that by returning an array of values. This array is used in four methods:
    the Object.keys() method, the Object.getOwnPropertyNames() method, the Object.getOwnPropertySymbols()
    method, and the Object.assign() method. The Object.assign() method uses the array
    to determine which properties to copy.


    The default behavior for the OwnKeys trap is implemented by the Reflect.ownKeys()
    method and returns an array of all property keys, including strings and symbols.
    The Object.getOwnPropertyNames() method filters out of symbols and return the
    result, whereas Object.getOwnPropertySymbols() filters the strings out of the
    array and returns the result. The Object.assign() method uses the array with both
    strings and symbols.


    The OwnKeys trap receives a single argument, the target, and must return an array
    or array-like object; otherwise, an error is thrown. You can use the OwnKeys trap
    to, for example, filter out properties that you don''t want when the Object.keys()
    method, the Object.getOwnPropertyNames() method, the Object.getOwnPropertySymbols()
