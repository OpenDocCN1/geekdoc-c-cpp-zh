  md: "The * before createIterator makes this function a generator. The yield keyword,\
    \ new to ECMAScript 6, specifies values the resulting iterator should return when\
    \ next() is called and the order in which they should be returned. The iterator\
    \ generated in this example has three different values to return on successive\
    \ calls to the next() method: first 1, then 2, and finally 3. A generator gets\
    \ called like any other function, as shown when iterator is created.\n\nPerhaps\
    \ the most interesting aspect of generator functions is that they stop after each\
    \ yield statement. For instance, after yield 1 executes in the code, the function\
    \ does not execute again until the iterator's next() method is called. At that\
    \ point, yield 2 executes. This ability to stop execution in the middle of a function\
    \ leads to interesting uses of generator functions (which I discuss in “Advanced\
    \ Iterator Functionality” on page 152).\n\nYou can use the yield keyword with\
    \ any value or expression, so you can write generator functions that add items\
    \ to iterators without just listing the items one by one. For example, here's\
    \ one way you could use yield inside a loop:\n\n```\nfunction *createIterator(items)\
    \ {\n  for (let i = 0; i < items.length; i++) {\n    yield items[i];\n  }\n}\n\
    ```\n\n```\nlet iterator = createIterator([1, 2, 3]);\n```\n\n```\nconsole.log(iterator.next());\
    \ // { \"value: 1, done: false }\nconsole.log(iterator.next()); // { \"value:\
    \ 2, done: false }\nconsole.log(iterator.next()); // { \"value: 3, done: false\
    \ }\nconsole.log(iterator.next()); // { \"value: undefined, done: true }\n```\n\
    \n```\n// // for all further calls\nconsole.log(iterator.next()); // { \"value:\
    \ undefined, done: true }\n```\n\nThis example passes an array called items to\
    \ the createIterator() generator function. Inside the function, a for loop yields\
    \ the elements from the array into the iterator as the loop progresses. Each time\
    \ yield is encountered, the loop stops, and each time next() is called on iterator,\
    \ the loop picks up with the next yield statement.\n\nGenerator functions are\
    \ an important ECMAScript 6 feature, and because they are just functions, you\
    \ can use them in all the same places. The rest of this section focuses on other\
    \ useful ways to write generators."
