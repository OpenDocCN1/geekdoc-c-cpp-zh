- img_proc: true
  md: "This version of the function cannot be optimized, multiplication must happen\
    \ after the recursive call to factorial(). If n is a very large number, the stack\
    \ size will grow and could potentially cause a stack overflow.\n\nTo optimize\
    \ the function, you need to ensure that the multiplication doesn't happen after\
    \ the last function call. To do this, you can use a default parameter to move\
    \ the multiplication outside the return statement. The resulting function carries\
    \ along the temporary result into the next iteration, creating a function that\
    \ behaves the same but can be optimized by ECMAScript 6 engine. Here's the new\
    \ code:\n\n```\nfunction factorial(n, p = 1) {\n  if (n <= 1) {\n    return 1\
    \ * p;\n  } else {\n    let result = n * p;\n    // optimized\n    return factorial(n\
    \ - 1, result);\n  }\n}\n```\n\nIn this rewritten version of factorial(), a second\
    \ argument p is added as a parameter with a default value of 1. The p parameter\
    \ holds the previous multiplication result so the next result can be computed\
    \ without another function call. When n is greater than 1, the multiplication\
    \ is done first and then passed as the second argument to factorial(). This allows\
    \ the ECMAScript 6 engine to optimize the recursive call.\n\nThink about tail\
    \ call optimization whenever you're writing a recursive function, because it can\
    \ provide a significant performance improvement, especially when applied in a\
    \ computationally expensive function.\n\n> At the time of writing, ECMAScript\
    \ 6 tail call optimization is undergoing review for changes. It's possible that\
    \ tail call optimization will eventually require special syntax for increased\
    \ clarity. The ongoing discussion may result in changes in ECMAScript 8 (ECMAScript\
    \ 2017).\n\n# Summary\n\nFunctions have never undergone a huge change in ECMAScript\
    \ 6 but rather a series of incremental changes that make them easier to work with.\n\
    \nDefault function parameters allow you to specify what value to use when a particular\
    \ argument is not passed. Prior to ECMAScript 6, this would require some extra\
    \ code inside the function to check for the presence of arguments and assign a\
    \ different value."
