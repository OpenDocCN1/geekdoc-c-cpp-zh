  md: 'Because key1 and key2 are not converted to strings, they count as two unique
    items in the set. If they were converted to strings, they would both be equal
    to "[object Object]" instead.


    If the add() method is called more than once with the same value, all calls after
    the first one are effectively ignored:


    ```

    let set = new Set();

    set.add(5);

    set.add("5"); // duplicate - this is ignored


    console.log(set.size); // 2

    ```


    When console.log() outputs the size of set, it displays 2 because the second 5
    wasn''t added. You can also initialize a set using an array, and the Set constructor
    will ensure that unique values are used. For instance:


    ```

    let set = new Set([1, 2, 3, 4, 5, 5, 5]);

    console.log(set.size); // 5

    ```


    In this example, an array with duplicate values is used to initialize the set.
    The number 5 only appears once in the set, even though it appears four times in
    the array. This functionality makes converting existing code or JSON structures
    to sets easy.


    The Set constructor actually accepts any iterable object as an argument. Arrays
    work because they are iterable by default, as are sets and maps. The Set constructor
    uses an iterator to extract values from the argument. Iterables and iterators
    are discussed in detail in Chapter 8.


    You can test which values are in a set using the has() method, like this:


    ```

    let set = new Set();

    set.add(5);

    set.add("5");

    ```


    ```

    console.log(set.has(5)); // true

    console.log(set.has(6)); // false

    ```


    Here, set.has(6) returns false because the set doesn''t have that value.


    # Removing Items


    It''s also possible to remove items from a set. You can remove a single item by
    using the delete() method, or you can remove all items from the set by calling
    the clear() method. This code shows both in action:


    ```

    let set = new Set();

    set.add(5);

    set.add("5");

    ```'
