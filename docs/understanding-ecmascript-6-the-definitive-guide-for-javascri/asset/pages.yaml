  md: "# Clarifying the Dual Purpose of Functions\n\nIn ECMAScript 5 and earlier,\
    \ functions serve the dual purpose of being callable with or without new. When\
    \ used with new, the this value inside a function is a new object and that new\
    \ object is returned, as illustrated in this example:\n\n```\nfunction Person(name)\
    \ {\n  this.name = name;\n}\n\nvar person = new Person(\"Nicholas\");\nvar notAPerson\
    \ = Person(\"Nicholas\");\n\nconsole.log(person); // [\"Object object\"]\\nconsole.log(notAPerson);\
    \ // [\"undefined\"]\n```\n\nWhen creating notPerson, calling Person() without\
    \ new results in undefined (and sets a name on the global object in non-strict\
    \ mode). The capitalization of Person is the only real indicator that the function\
    \ is meant to be called using new, as is common in JavaScript programs. This confusion\
    \ over the dual roles of functions led to some changes in ECMAScript 6.\nJavaScript\
    \ has two internal-only methods for functions: [[Call]] and [[Construct]]. When\
    \ a function is called without new, the [[Call]] method is executed, which executes\
    \ the body of the function as it appears in the code. When a function is called\
    \ with new, that's when the [[Construct]] method is called. The [[Construct]]\
    \ method is responsible for creating a new object, called the instance, and then\
    \ executing the function body with this set to the instance. Functions that have\
    \ a [[Construct]] method are called *constructors*.\nKeep in mind that not all\
    \ functions have [[Construct]], and therefore not all functions can be called\
    \ with new. Arrow functions, discussed in \"Arrow Functions\" on page 54, do not\
    \ have a [[Construct]] method.\n\n# Determining How a Function Was Called in ECMAScript\
    \ 5\n\nThe most popular way to determine whether a function was called with new\
    \ (and hence, as a constructor) in ECMAScript 5 is to use instanceof of, for example:\n\
    \n```\nfunction Person(name) {\n  if (this instanceof Person) {\n    this.name\
    \ = name; // using new\n  } else {\n    throw new Error(\"You must use new with\
    \ Person.\")\n  }\n}\n```\n\n```\nvar person = new Person(\"Nicholas\");\nvar\
    \ notAPerson = Person(\"Nicholas\"); // throws an error\n```"
  merge: -1
  pgno: 75
- img_proc: true
  md: "Here, this value is checked to see whether it's an instance of the constructor,\
    \ and if it is, execution continues as normal. If this isn't an error is thrown.\
    \ This approach works because the [[Construct]] method creates a new instance\
    \ of Person and assigns it to this. Unfortunately, this approach is not completely\
    \ reliable because this can an instance of Person without using new, as in this\
    \ example:\n\n```\nfunction Person(name) {\n  if (this instanceof Person) {\n\
    \    this.name = name;\n  } else {\n    throw new Error(\"You must use new with\
    \ Person.\");\n  }\n}\n\nvar person = new Person(\"Nicholas\");\nvar notAPerson\
    \ = Person.call(person, \"Michael\"); // works!\n```\n\nThe call to Person.call()\
    \ passes the person variable as the first argument, which means this is set to\
    \ person inside the Person function. To the function, there's no way to distinguish\
    \ being called with Person.call() (or Person.apply()) with a Person instance from\
    \ being called with new.\n\n# The new.target Metaproperty\n\nTo solve the problem\
    \ of identifying function calls using new, ECMAScript 6 introduces the new.target\
    \ metapperty. A metapperty is a property of a nonobject that provides additional\
    \ information related to its target (such as new). When a function's [[Construct]]\
    \ method is called, new.target is filled with the target of the new operator.\
    \ That is typically the constructor of the newly created object instance that\
    \ will become this inside the function body. If [[Call]] is executed, new.target\
    \ is undefined.\n\nThis new metapperty allows you to safely detect if a function\
    \ is called with new by checking whether new.target is defined as follows:\n\n\
    ```\nfunction Person(name) {\n  if (typeof new.target !== \"undefined\") {\n \
    \   this.name = name;\n  } else {\n    throw new Error(\"You must use new with\
    \ Person.\");\n  }\n}\n\nvar person = new Person(\"Nicholas\");\nvar notAPerson\
    \ = Person.call(person, \"Michael\"); // error!\n```\n\nBy new.target instead\
    \ of instanceof Person, the Person constructor is not correctly throwing an error\
    \ when used without new."
