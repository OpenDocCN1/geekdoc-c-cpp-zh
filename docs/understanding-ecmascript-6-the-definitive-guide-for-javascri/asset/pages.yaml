  md: "# Block-Level Functions in Non-Strict Mode\n\nECMAScript 6 also allows block-level\
    \ functions in non-strict mode, the behavior is slightly different. Instead of\
    \ hoisting these declarations to the top of the block, they are hoisted all the\
    \ way to the containing function or global environment. For example:\n\n```\n\
    // ECMAScript 6 behavior\nif (true) {\n  console.log(typeof doSomething); // \"\
    function\"\n  function doSomething() {\n    // empty\n  }\n  doSomething();\n\
    }\nconsole.log(typeof doSomething); // \"function\"\n```\n\nIn this example, doSomething()\
    \ is hoisted into the global scope so it still exists outside the if block. ECMAScript\
    \ 6 standardized this behavior to remove the incompatible browser behaviors that\
    \ previously existed, so all ECMAScript 6 runtimes behave in the same way.\n\n\
    Allowing block-level functions improves your ability to declare functions in JavaScript,\
    \ but ECMAScript 6 also introduced a completely new way to declare functions.\n\
    \n# Arrow Functions\n\nOne of the most interesting new parts of ECMAScript 6 is\
    \ the arrow function. Arrow functions are, as the name suggests, functions defined\
    \ with a new syntax that uses an arrow (=>). But arrow functions behave differently\
    \ than traditional JavaScript functions in a number of important ways:\n\n+  \
    \ **No this, super, arguments, and new.target bindings** The values of this, super,\
    \ arguments, and new.target inside the function are defined by the closest containing\
    \ non-arrow function. (super is covered in Chapter 4.)\n\n+   **Cannot be called\
    \ with new** Arrow functions do not have a [[Construct]] method and therefore\
    \ cannot be used as constructors. Arrow functions throw an error when used with\
    \ new.\n\n+   **No prototype** Because you can't use new on an arrow function,\
    \ there's no need for a prototype. The prototype property of an arrow function\
    \ doesn't exist."
