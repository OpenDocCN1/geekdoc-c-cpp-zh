  md: "# Deleting Elements When Reducing length\n\nThe first array behavior to mimic\
    \ is used only when an array index is greater than or equal to the length property.\
    \ The second behavior does the opposite and removes array items when the length\
    \ property is set to a smaller value than it previously contained. That involves\
    \ not changing the length property but also deleting all items that might otherwise\
    \ exist. For instance, if an array with a length of 4 has length set to 2, the\
    \ items in positions 2 and 3 are deleted. You can accomplish this inside the first\
    \ behavior. Here's the previous example again but with an updated createArray\
    \ method:\n\n```\nfunction toInt32(value) {\n  return Math.floor(Math.abs(value))\
    \ % Math.pow(2, 32);\n}\n```\n\n```\nfunction isArrayIndex(key) {\n  let numericKey\
    \ = toInt32(key);\n  return String(numericKey) == numericKey && (Math.pow(2, 32)\
    \ - 1);\n}\n```\n\n```\nfunction createArray(length=0) {\n  return new Proxy({\
    \ length },\n    set(trapTarget, key, value) {\n      let currentLength = Reflect.get(trapTarget,\
    \ \"length\");\n      // the special case\n      if (isArrayIndex(key)) {\n  \
    \      let numericKey = Number(key);\n        if (numericKey >= currentLength)\
    \ {\n          Reflect.set(trapTarget, \"length\", numericKey + 1);\n        }\
    \ else if (key === \"length\") {\n          if (value < currentLength) {\n   \
    \         for (let index = currentLength - 1; index >= value;\n              index--;\n\
    \              Reflect.deleteProperty(trapTarget, index);\n          }\n     \
    \   }\n      }\n      // always do this regardless of key type\n      return Reflect.set(trapTarget,\
    \ key, value);\n    }\n  );\n}\n```\n\n```\nlet colors = createArray(3);\nconsole.log(colors.length);\
    \ // 3\n```"
