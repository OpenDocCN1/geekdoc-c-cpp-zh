  md: "The Object.assign() method accepts any number of suppliers, and the receiver\
    \ receives the properties in the order in which the suppliers are specified. That\
    \ means the second supplier might overwrite a value from the first receiver, which\
    \ is what happens in this code snippet\n\n```\nvar receiver = {};\nObject.assign(receiver,\n\
    \  type: \"js\",\n  name: \"file.js\",\n  type: \"css\"\n);\n\nconsole.log(receiver.type);\
    \ // \"css\"\nconsole.log(receiver.name); // \"file.js\"\n```\n\nThe value of\
    \ receiver.type is \"css\" because the second supplier overwrote the value of\
    \ the first.\nObject.assign() method isn't a significant addition to ECMAScript\
    \ 6, but it does formalize a common function found in many JavaScript libraries.\n\
    \n# WORKING WITH ACCESSOR PROPERTIES\n\nKeep in mind that Object.assign() doesn't\
    \ create accessor properties on the receiver when a supplier has accessor properties.\
    \ Because Object.assign() uses the assignment operator, an accessor property on\
    \ a supplier will become a data property on the receiver. For example:\n\n```\n\
    var receiver = {};\nsupplier = {\n  get name() {\n    return \"file.js\"\n  }\n\
    }\n```\n\nObject.assign(receiver, supplier);\nvar descriptor = Object.getOwnPropertyDescriptor(receiver,\
    \ \"name\");\n\n```\nconsole.log(descriptor.value); // \"file.js\"\nconsole.log(descriptor.get);\
    \ // undefined\n```\n\nIn this code, the supplier has an accessor property named\
    \ name. After using the Object.assign() method, receiver.name exists as a data\
    \ property with a value of \"file.js\" because supplier.name returned \"file.js\"\
    \ when Object.assign() was called."
