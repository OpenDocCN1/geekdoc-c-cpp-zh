  md: '# Map Methods


    Maps share several methods with sets, which is intentional and allows you to interact
    with maps and sets in similar ways. These three methods are available on maps
    and sets:


    +   - has(key) Determines if the given key exists in the map

    - delete(key) Removes the key and its associated value from the map

    - clear() Removes all keys and values from the map


    Maps also have a size property that indicates how many key-value pairs it contains.
    This code uses all three methods and size in different ways:


    ```

    let map = new Map();

    map.set("name", "Nicholas");

    map.set("age", 25);


    console.log(map.size); // 2

    console.log(map.has("name")); // true

    console.log(map.get("name")); // "Nicholas"


    console.log(map.has("age")); // true

    console.log(map.get("age")); // 25


    map.delete("name");

    console.log(map.has("name")); // false

    console.log(map.get("name")); // undefined

    console.log(map.size); // 1


    map.clear();

    console.log(map.has("name")); // false

    console.log(map.get("name")); // undefined

    console.log(map.has("age")); // false

    console.log(map.get("age")); // undefined

    console.log(map.size); // 0

    ```


    As sets, the size property always contains the number of key-value pairs in the
    map. The Map instance in this example starts with the "name" and "age" keys, so
    has() returns true when either key passed. After the "name" key is removed by
    the delete() method, the has() method returns false when passed "name", and the
    size property indicates one less item. The clear() method then removes the remaining
    key, as indicated by has() returning false for both keys and size being 0.


    The clear() method is a fast way to remove a lot of data from a map, but there''s
    also a way to add a lot of data to a map at one time.'
