  md: "to log or otherwise handle the rejection. A map is used in this example instead\
    \ of a weak map because you need to inspect the map periodically to see which\
    \ promises are present, and that's not possible with a weak map.\nAlthough this\
    \ example is specific to Node.js, browsers have implemented a similar mechanism\
    \ for notifying developers about unhandled rejections.\n\n# Browser Rejection\
    \ Handling\n\nBoth emit two events to identify unhandled rejections. These events\
    \ are emitted by the window object and are effectively the same as the Node.js\
    \ equivalents:\n\n```\nunhandledrejection Emitted when a promise is rejected and\
    \ no rejection handler is called within one turn of the event loop\nrejectionhandled\
    \ Emitted when a promise is rejected and a rejection handler is called after one\
    \ turn of the event loop\n```\n\nAlthough the Node.js implementation passes individual\
    \ parameters to the event handler, the event handler for these browser events\
    \ receives an event object with the following properties:\n\n+   * type The name\
    \ of the event (\"unhandledrejection\" or \"rejectionhandled\")\n* promise The\
    \ promise object that was rejected\n* reason The rejection value from the promise\n\
    \nThe other difference in the browser implementation is that the rejection value\
    \ (reason) is available for both events. For example:\n\n```\nlet rejected;\n\n\
    window.unhandledrejection = function(event) {\n  console.log(event.type); // \"\
    unhandledrejection\"\n  console.log(event.reason.message); // \"Explosion!\"\n\
    \  console.log(event.rejected === event.promise); // true\n};\n\nwindow.onrejectionhandled\
    \ = function(event) {\n  console.log(event.type); // \"rejectionhandled\"\n  console.log(event.reason.message);\
    \ // \"Explosion!\"\n  console.log(event.rejected === event.promise); // true\n\
    };\n\nrejected = Promise.reject(new Error(\"Explosion!\")));\n```\n\nThis code\
    \ assigns both event handlers using the DOM Level 0 notation of unhandledrejection\
    \ and onrejectionhandled. (You can also useaddEventListener(\"unhandledrejection\"\
    ) and addEventListener(\"rejectionhandled\") if you prefer.) Each event handler\
    \ receives an event object containing information about the rejected promise.\
    \ The type, promise, and reason properties are all available in both event handlers."
