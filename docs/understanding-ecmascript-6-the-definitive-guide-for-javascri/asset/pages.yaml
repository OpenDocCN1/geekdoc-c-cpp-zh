    ```

    [ firstColor,secondColor ] = colors;

    ```


    The destructuring assignment in this code works in a similar manner to the previous
    array example. The only difference is that firstColor and secondColor have already
    been defined. Most of the time, what you know now about array destructuring assignment
    is all you''ll need to know, but there''s a bit of more to it that you''ll probably
    find useful.


    Array destructuring assignment has a very unique case that makes it easier to
    swap the values of two variables. Value swapping is a common operation in sorting
    algorithms, and the ECMAScript 5 way of swapping variables involves a third, temporary
    variable, as in this example:


    ```

    // swapping variables in ECMAScript 5

    let a = 1,

    b = 2,

    tmp =;

    ```


    ```

    tmp = a;

    a = b;

    b = tmp;

    ```


    ```

    console.log(a); // 2

    console.log(b); // 1

    ```


    The intermediate variable tmp is necessary to swap the values of a and b. However,
    using array destructuring assignment, there''s no need for extra variable. Here''s
    how you can swap variables in ECMAScript 6:


    ```

    // swapping variables in ECMAScript 6

    let a = 1,

    b = 2;

    ```


    ```

    [ a, b ] = [ b, a ];

    ```


    ```

    console.log(a); // 2

    console.log(b); // 1

    ```


    The array destructuring assignment in this example looks like a mirror image.
    The left side of the assignment (before the equal sign) is a destructuring pattern
    just like those in the other array destructuring examples. The right side is an
    array literal that is temporarily created for the swap.'
