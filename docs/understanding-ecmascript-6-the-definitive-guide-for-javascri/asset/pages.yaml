  md: '# PROMISES AND ASYNCHRONOUS PROGRAMMING


    ![](img/346dbcc81573ddc69906e98afee1e3ac_238_0.png)


    One of the most powerful aspects of JavaScript is how easily it handles asynchronous
    programming. As a language created for the web, JavaScript needed to be able to
    respond to asynchronous user interactions, such as clicks and key presses, from
    the beginning. Node.js made asynchronous programming in JavaScript more popular
    by using callbacks as an alternative to events. But as more programs started using
    asynchronous programming, events and callbacks weren''t powerful enough to support
    everything developers wanted to do. Promises are the solution to this problem.


    Promises are another option for asynchronous programming, and they work like futures
    and deferreds do in other languages. Like events and callbacks, a promise specifies
    some code to be executed later, but promises'
