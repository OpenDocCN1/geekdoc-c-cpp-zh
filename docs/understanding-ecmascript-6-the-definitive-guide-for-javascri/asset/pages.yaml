  md: "# The entries() Iterator\n\nThe entries() iterator returns a two-item array\
    \ each time next() is called. The two-item array represents the key and value\
    \ for each item in the collection. For arrays, the first item is the numeric index;\
    \ for sets, the first item is also the value (because values double as keys in\
    \ sets); for maps, the first item is the key.\n\nHere are some examples that use\
    \ the entries() iterator:\n\n```\nlet colors = [ \"red\", \"green\", \"blue\"\
    \ ];\nlet tracking = new Set([1234, 5678, 9012]);\nlet data = new Map();\n\ndata.set(\"\
    title\", \"Understanding ECMAScript 6\");\ndata.set(\"format\", \"ebook\");\n\n\
    for (let entry of colors.entries()) {\n  console.log(entry);\n}\n\nfor (let entry\
    \ of tracking.entries()) {\n  console.log(entry);\n}\n\nfor (let entry of data.entries())\
    \ {\n  console.log(entry);\n}\n```\n\nThe console.log() calls produce the following\
    \ output:\n\n```\n[0, \"red\"]\\n[1, \"green\"]\\n[2, \"blue\"]\\n[1234, 1234]\n\
    [5678, 5678]\n[9012, 9012]\n[\"title\", \"Understanding ECMAScript 6\"]\\n[\"\
    format\", \"ebook\"]\n```\n\nThis code uses the entries() method on each type\
    \ of collection to retrieve an iterator, and it uses for-of-loops to iterate the\
    \ items. The console output shows how the keys and values are returned in pairs\
    \ for each object.\n\n# The values() Iterator\n\nThe values() iterator returns\
    \ values as they are stored in the collection. For example:\n\n```\nlet colors\
    \ = [ \"red\", \"green\", \"blue\" ];\nlet tracking = new Set([1234, 5678, 9012]);\n\
    let data = new Map();\n```"
