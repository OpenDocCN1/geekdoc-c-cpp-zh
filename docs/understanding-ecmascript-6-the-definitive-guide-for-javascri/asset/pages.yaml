    |\n\nThe keys() iterator fetches each key in colors, tracking, and data, and those\
    \ keys are printed from inside the three for-of loops. For the array object, only\
    \ numeric indices are printed, which would still happen even if you added named\
    \ properties to the array. This is different from the way the for-in loop works\
    \ with arrays, because the for-in loop iterates over properties rather than just\
    \ the numeric indices.\n\n# Default Iterators for Collection Types\n\nEach collection\
    \ type also has a default iterator that is used by for-of when an iterator is\
    \ not explicitly specified. The values() method is the default iterator for arrays\
    \ and sets, whereas the entries() method is the default iterator for maps. These\
    \ defaults make using collection objects in for-loop makes a little easier. For\
    \ instance, consider this example:\n\n```\nlet colors = [ \"red\", \"green\",\
    \ \"blue\" ];\nlet tracking = new Set([1234, 5678, 9012]);\nlet data = new Map();\n\
    ndata.set(\"title\", \"Understanding ECMAScript 6\");\ndata.set(\"format\", \"\
    print\");\n```\n\n```\n// same as using colors.values()\nfor (let value of colors)\
