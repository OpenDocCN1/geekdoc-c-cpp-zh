  md: '# Promise Basics


    A promise is a placeholder for the result of an asynchronous operation.

    Instead of subscribing to an event or passing a callback to a function, the function
    can return a promise, as shown here:


    ```

    // readFile promise to complete at some point in the future

    let promise = readFile("example.txt");

    ```


    In this code, readFile() doesn''t start reading the file immediately: that will
    happen later. Instead, the function returns a promise object representing the
    asynchronous read operation so you can work with it in the future. Exactly when
    depends entirely on how the promise''s life cycle concludes.


    # The Promise Life Cycle


    Each promise goes through a short life cycle starting in the pending state, which
    indicates that the asynchronous operation hasn''t completed yet. A pending promise
    is considered unsettled. The previous example is in the pending state as soon
    as the readFile() function returns it. Once the asynchronous operation completes,
    the promise is considered settled and one of two possible states:


    +   Fulfilled The promise''s asynchronous operation has completed successfully.


    +   Rejected The promise''s asynchronous operation didn''t complete successfully
    due to either an error or some other cause.


    An internal [[PromiseState]] property is set to "pending", "fulfilled", or "rejected"
    to reflect the promise''s state. This promise isn''t exposed on promise objects,
    so you can''t determine which state the promise is in grammatically. But you can
    take a specific action when a promise changes state by using the then() method.


    The then() method is present on all promises and takes two arguments. The first
    argument is a function to call when the promise is fulfilled. Any additional data
    related to the asynchronous operation is passed to the fulfillment function. The
    second argument is a function to call when the promise is rejected. Similar to
    the fulfillment function, the rejection function is passed any additional data
    related to the rejection.


    > NOTE Any object that implements the then() method as described in the preceding
    paragraph is called a thenable. All promises are thenables, but all thenables
    are not promises.'
