  md: "In this code, the call to new MyType() fails because MyType is an arrow function\
    \ and therefore has no [[Construct]] behavior. Knowing that arrow functions cannot\
    \ be used with new allows JavaScript engines to optimize their.\n\nAlso, because\
    \ the this value is determined by the containing function in which the arrow function\
    \ is defined, you cannot change the value of this using call(), apply(), or bind().\n\
    \n# Arrow Functions and Arrays\n\nThe concise syntax for arrow functions makes\
    \ them ideal for use with array processing, too. For example, if you want to sort\
    \ an array using a custom comparator, you'd typically write something like this:\n\
    \n```\nvar result = values.sort(function(a, b) {\n  return a - b;\n});\n```\n\n\
    That's a lot of syntax for a very simple procedure. Compare that to the arrow\
    \ function version:\n\n```\nvar result = values.sort((a, b) => a - b);\n```\n\n\
    The array methods that accept callback functions, such as sort(), map(), and reduce(),\
    \ can all benefit from simpler arrow function syntax, which changes seemingly\
    \ complex processes into simpler code.\n\n# No arguments Binding\n\nEven though\
    \ arrow functions don't have their own arguments object, it's possible for them\
    \ to access the arguments object from a containing function. That arguments object\
    \ is then available no matter where the arrow function is executed later. For\
    \ example:\n\n```\nfunction createArrowFunctionReturningFirstArg() {\n  return\
    \ () => arguments[0];\n}\n```\n\n```\nvar arrowFunction = createArrowFunctionReturningFirstArg(5);\n\
    ```\n\n```\nconsole.log(arrowFunction()); // 5\n```\n\nInside createArrowFunctionReturningFirstArg(),\
    \ the arguments[0] element is referenced by the created arrow function. That reference\
    \ contains the first argument passed to createArrowFunctionReturningFirstArg().\
    \ When the arrow function is later executed, it returns 5, which was the first\
    \ argument passed to createArrowFunctionReturningFirstArg(). Even though the arrow\
    \ function is no longer in the scope of the function that created it, arguments\
    \ remains accessible due to scope chain resolution of the arguments identifier."
