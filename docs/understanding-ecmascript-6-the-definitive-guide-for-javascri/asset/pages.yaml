    for and an optional index where to start the search. When the second argument
    is provided, includes() starts the match from that index. (The default starting
    index is 0.) The return value is true if the value is found inside the array and
    false if not. For example:


    ```

    let values = [1, 2, 3];


    console.log(values.includes(1)); // true

    console.log(values.includes(0)); // false

    ```'
