  md: "# Validating Function Parameters\n\nThe apply and construct traps open several\
    \ possibilities for altering the way a function is executed. For instance, suppose\
    \ you want to validate all arguments are of a specific type. You can check the\
    \ arguments in the apply trap:\n\n```\n// adds together all arguments\nfunction\
    \ sum(...values) {\n  return values.reduce((previous, current) => previous + current,\
    \ 0);\n}\n\nlet sumProxy = new Proxy(sum, {\n  apply: function(trapTarget, thisArg,\
    \ argumentList) {\n    argumentList.forEach((arg) => {\n      if (typeof arg !==\
    \ \"number\") {\n        throw new TypeError(\"All arguments must be numbers.\"\
    );\n      }\n    });\n    return Reflect.apply(trapTarget, thisArg, argumentList);\n\
    \  },\n  construct: function(trapTarget, argumentList) {\n    throw new TypeError(\"\
    This function can't be called with new.\");\n  }\n});\n\nconsole.log(sumProxy(1,\
    \ 2, 3, 4)); // 10\n\n// throws an error\nconsole.log(sumProxy(1, \"2\", 3, 4));\n\
    \n// also throws an error\nlet result = new sumProxy();\n```\n\nThis example uses\
    \ the apply trap to ensure that all arguments passed to sum() are numbers. If\
    \ a nonnumber value is passed, the function will still attempt the operation,\
    \ which can cause unexpected results. By wrapping sum() inside the sumProxy()\
    \ proxy, this code intercepts function calls and ensures that each argument is\
    \ a number before allowing the call to proceed. To be safe, the code also uses\
    \ the construct trap to ensure that the function can't be called with new.\n\n\
    You can also do the opposite, ensuring that a function must be called with new\
    \ and validating its arguments as numbers:\n\n```\nfunction Numbers(...values)\
    \ {\n  this.values = values;\n}\n```"
