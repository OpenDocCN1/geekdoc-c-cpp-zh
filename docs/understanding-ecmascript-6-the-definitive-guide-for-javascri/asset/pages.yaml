  md: "mode. The latter was a problem in ECMAScript 6 because parameters could be\
    \ defined in more complex ways—specifically, through destructuring and default\
    \ parameter values.\n\nTo understand the problem, consider the following code:\n\
    \n```\nfunction doSomething(first = this) {\n  'use strict';\n  return first;\n\
    }\n```\n\nHere, the named parameter value first is assigned a default value of\
    \ this. You might expect the value of first to be undefined because the ECMAScript\
    \ 6 specification instructed JavaScript engines to treat the parameters as being\
    \ in strict mode in cases like this. But implementing parameters running in strict\
    \ mode when \"use strict\" is present inside the function was quite difficult\
    \ because default values can be functions as well. This led most JavaScript engines\
    \ to not implement this feature and instead leave this to the global object.\n\
    \nThis implementation difficulty is why ECMAScript 2016 makes using a \"use strict\"\
    \ directive inside a function whose parameters are either destructured or default\
    \ values illegal. Only simple parameter lists, those that don't contain destructuring\
    \ or default values, are allowed when \"use strict\" is present in the body of\
    \ a function. For reference, here are some legal and illegal uses of the directive:\n\
    \n```\n// okay - uses simple parameter list\nfunction okay(first, second) {\n\
    \  'use strict';\n  return first;\n}\n```\n\n```\n// syntax error\nfunction notokay(first,\
    \ second=first) {\n  'use strict';\n  return first;\n}\n```\n\n```\n// syntax\
    \ error\nfunction notokay2({ first, second }) {\n  'use strict';\n  return first;\n\
    }\n```\n\nYou can still use \"use strict\" with simple parameter lists, which\
    \ is why okay() works as you would expect (that is, the same way it would in ECMAScript\
    \ 5). The notokay() function is a syntax error because you can no longer use \"\
    use strict\" in functions with default parameter values in ECMAScript 2016. Similarly,\
    \ the notokay2() function is a syntax error because you cannot use \"use strict\"\
    \ in a destructured parameters.\n\nOverall, this change removes a point of confusion\
    \ for JavaScript developers and an implementation problem for JavaScript engines."
