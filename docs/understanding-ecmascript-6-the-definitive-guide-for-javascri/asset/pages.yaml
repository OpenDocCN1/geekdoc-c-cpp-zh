    # The Array.of() Method


    One reason ECMAScript 6 added new creation methods to JavaScript to help developers
    avoid a quirk of creating arrays with the Array constructor. The Array constructor
    actually behaves differently based on the type and number of arguments passed
    to it. For example:


    ```

    let items = new Array(2);

    console.log(items.length); // 2

    console.log(items[0]); // undefined

    console.log(items[1]); // undefined

    ```


    ```

    items = new Array("2");

    console.log(items.length); // 1

    console.log(items[0]); // "2"

    ```


    ```

    items = new Array(1, 2);

    console.log(items.length); // 2

    console.log(items[0]); // 1

    console.log(items[1]); // 2

    ```


    ```

    items = new Array(3, "2");

    console.log(items.length); // 2

    console.log(items[0]); // 3

    console.log(items[1]); // "2"

    ```


    When the Array constructor is passed a single numeric value, the array''s length
    property is set to that value. If a single nonnumeric value is passed, that value
    becomes the one and only item in the array. If multiple values are passed (numeric
    or not), those values become items in the array. This behavior is confusing and
    risky, because you might not be aware of the type of data being passed.


    ECMAScript 6 introduces Array.of() to solve this problem. Array.of() method works
    similarly to the Array constructor but has no special case regarding a single
    numeric value. Array.of() always creates an array containing its arguments regardless
    of the number of arguments or argument types. Here are some examples that use
    the Array.of()


    ```

    let items = Array.of(1, 2);

    console.log(items.length); // 2

    console.log(items[0]); // 1

    console.log(items[1]); // 2

    ```


    ```

    items = Array.of("2");

    console.log(items.length); // 1

    console.log(items[0]); // "2"

    ```'
