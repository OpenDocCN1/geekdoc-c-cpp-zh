  md: 'let colors = [ "red", "green", "blue" ];

    let [ firstColor,...restColors ] = colors;


    ```

    console.log(firstColor); // "red"

    console.log(restColors.length); // 2

    console.log(restColors[0]); // "green"

    console.log(restColors[1]); // "blue"

    ```


    The first item in colors is assigned to firstColor, and the rest are assigned

    to a new restColors array. Therefore, the restColors array has two items:

    "green" and "blue". Rest items are useful for extracting certain items from an

    array and keeping the rest available, but there''s another helpful use.


    A glaring omission from JavaScript arrays is the ability to easily create

    a clone. In ECMAScript 5, developers frequently used the concat() method as

    an easy way to clone an array. For example:


    ```

    // cloning an array in ECMAScript 5

    var colors = [ "red", "green", "blue" ];

    var clonedColors = colors.concat();

    ```


    ```

    console.log(clonedColors); // "[red,green,blue]"

    ```


    Although the concat() method is intended to concatenate two arrays, call-

    ing it without an argument returns a clone of the array. In ECMAScript 6,

    y can use rest items to achieve the same task through syntax intended to

    function that way. It works like this:


    ```

    // cloning an array in ECMAScript 6

    let colors = [ "red", "green", "blue" ];

    let [ ...clonedColors ] = colors;

    ```


    ```

    console.log(clonedColors); // "[red,green,blue]"

    ```


    In this example, rest items are used to copy values from the colors

    into the clonedColors array. Although it''s a matter of perception as to

    whether this technique makes the developer''s intent clearer than using the

    concat() method, it is still a useful approach to be aware of.


    > Rest items must be the last entry in the destructured array and cannot be followed
    by a

    comma. Including a comma after rest items is a syntax error.


