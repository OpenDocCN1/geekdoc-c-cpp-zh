  md: "The thenable object in this example has no characteristics associated with\
    \ a promise other than the then() method. You can call Promise.resolve() to convert\
    \ the thenable into a fulfilled promise:\n\n```\nlet thenable = {\nthen:function(resolve,\
    \ reject) {\n  resolve(42);\n}\n}\n```\n\n```\nlet p1 = Promise.resolve(thenable);\n\
    p1.then(function(value) {\n  console.log(value); // 42\n});\n```\n\nIn this example,\
    \ Promise.resolve() calls thenable.then() so a promise state can be determined.\
    \ The promise state for thenable is fulfilled because resolve(42) is called inside\
    \ the then() method. A new promise is created in the fulfilled state with the\
    \ value passed from thenable (that is, 42), and the fulfillment handler for p1\
    \ receives 42 as the value.\n\nYou can use the same process with Promise.reject()\
    \ to create a rejected promise from thenable:\n\n```\nlet thenable = {\nthen:function(resolve,\
    \ reject) {\n  reject(42);\n}\n}\n```\n\n```\nlet p1 = Promise.resolve(thenable);\n\
    p1.catch(function(value) {\n  console.log(value); // 42\n});\n```\n\nThis example\
    \ is similar to the previous example, except thenable is rejected. When thenable.then(),\
    \ a new promise is created in the rejected state with a value of 42. That value\
    \ is passed to the rejection handler for p1.\n\nPromise.resolve() and Promise.reject()\
    \ work like this to allow you work with non-promises. Many libraries used thenables\
    \ prior to promises being introduced in ECMAScript 6, so the ability to convert\
    \ thenables into formal promises is important for backward compatibility with\
    \ previously existing libraries. When you're unsure whether an object is a promise,\
    \ passing the object through Promise.resolve() or Promise.reject(depending on\
    \ your anticipated result) is the best way to find out because promises just pass\
    \ through unchanged."
