  md: "# Notice two particularly important behaviors in this example:\n\n+   - The\
    \ length property is increased to 4 when colors[3] is assigned a value.\n- The\
    \ last two items in the array are deleted when the length property is set to 2.\n\
    \nThese two behaviors are the only ones that need to be mimicked to accurately\
    \ re-create how built-in arrays work. The next few sections describe how to make\
    \ an object that correctly mimics them.\n\n# Detecting Array Indexes\n\nKeep in\
    \ mind that assigning a value to an integer property key is a special case for\
    \ arrays, because they are treated differently from non-integer keys. The ECMAScript\
    \ 6 specification gives the following instructions on how to determine whether\
    \ a property key is an array index:\n\n> > A property name P is an array index\
    \ if and only if ToString(Uint32(P)) is equal to P and Uint32(P) is not equal\
    \ to $2^{32}-1$.\n\nThis operation can be implemented in JavaScript as follows:\n\
    \n```\nfunction uint32(value) {\n  return Math.floor(Math.abs(value)) % Math.pow(2,\
    \ 32);\n}\n```\n\n```\nfunction isArrayIndex(key) {\n  let numerickey = Uint32(key);\n\
    \  return String(numerickey) == key && numerickey < (Math.pow(2, 32) - 1);\n}\n\
    ```\n\nThe Uint32() function converts a given value into an unsigned 32-bit integer\
    \ using an algorithm described in the specification. isarrayIndex() function converts\
    \ the key into a uint32 and then performs the comparisons to determine whether\
    \ or not the key is an array index. With these two utility functions, you can\
    \ start to implement an object that will mimic a built-in array.\n\n# Increasing\
    \ length When Adding New Elements\n\nNotice that both array behaviors I described\
    \ previously rely on the assignment of a property. This means you only need to\
    \ use the set proxy trap to accomplish both behaviors. To get started, look at\
    \ this example, which implements the first of the two behaviors by incrementing\
    \ the length property when an array index larger than length - 1 is used:\n\n\
    ```\nfunction uint32(value) {\n  return Math.floor(Math.abs(Number(value))) %\
    \ Math.pow(2, 32);\n}\n```"
