  md: 'Rather than trying to add more functionality to JavaScript''s already existing
    strings, template literals represent an entirely new approach to solving these
    problems.


    # Basic Syntax


    At their simplest, template literals act like regular strings delimited by backticks
    (``) instead of double or single quotes. For example, consider the following:


    ```

    let message = `Hello world!`;

    console.log(message);       // "Hello world"

    console.log(typeof message); // "string"

    console.log(message.length); // 12

    ```


    This code demonstrates that the variable message contains a normal JavaScript
    string. The template literal syntax is used to create the string value, which
    is then assigned to the message variable. If you want to use a backtick in a string,
    just escape it with a backslash (\), as in this version of the message variable:


    ```

    let message = `\Hello\ world!`;

    ```


    ```

    console.log(message);       // "Hello world!"

    console.log(typeof message); // "string"

    console.log(message.length); // 12

    ```


    There''s no need to escape double or single quotes inside template literals.


    # Multiline Strings


    JavaScript developers have wanted a way to create multiline strings since the
    first version of the language. But when you''re using double or single quotes,
    strings must be completely contained on a single line.


    # Pre-ECMAScript 6 Workarounds


    Thanks to a long-standing syntax bug, JavaScript does have a workaround for creating
    multiline strings. You can create multiline strings using a backslash (\) before
    a newline. Here''s an example:


    The message string has no newlines present when printed to the console because
    the backslash is treated as a continuation rather than a newline.'
