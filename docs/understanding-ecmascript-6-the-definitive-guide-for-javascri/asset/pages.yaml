  md: "This method is primarily a convenience function, and it can be especially useful\
    \ when manipulating text. It's particularly useful in code formatting utilities\
    \ that need to create indentation levels, such as the following:\n\n```\n// indent\
    \ using a specified number of spaces\nlet indent = \"\".repeat(4);\n  indentLevel\
    \ = 0;\n```\n\n```\n// whenever you increase the indent\nlet newInput = indent.repeat(++indentLevel);\n\
    ```\n\nThe first repeat() call creates a string of four spaces, and the indentLevel\
    \ keeps track of the indent level. Then, you can just call repeat() with an incremented\
    \ indentLevel to change the number of spaces.\n\nECMAScript 6 also makes some\
    \ useful changes to regular expression functionality that don't fit into a particular\
    \ category. The next section highlights a few of these changes.\n\n# Other Regular\
    \ Expression Changes\n\nRegular expressions are an important part of working with\
    \ strings in JavaScript, like many parts of the language, haven't changed much\
    \ in recent versions. However, ECMAScript 6 makes several improvements to regular\
    \ expressions to complement the updates to strings.\n\n# The Regular Expression\
    \ y Flag\n\nECMAScript 6 standardized the y flag after it was implemented in Firefox\
    \ as a proprietary extension to regular expressions. The y flag affects a regular\
    \ expression search's sticky property, and it tells the search to start matching\
    \ characters in a string at the position specified by the regular expression's\
    \ lastIndex property. If there is no match at that location, the regular expression\
    \ stops matching. The following code shows how this works:\n\n```\nlet text =\
