  md: 'Rest parameters allow you to specify an array into which all remaining parameters
    should be placed. Using a real array and letting you indicate which parameters
    to include makes rest parameters a much more flexible solution than arguments.


    The spread operator is a companion to rest parameters, allowing you to deconstruct
    an array into separate parameters when calling a function. Prior to ECMAScript
    6, there were only two ways to pass individual parameters contained in an array:
    by manually specifying each parameter or using apply(). With the spread operator,
    you can easily pass an array to any function without worrying about the binding
    of the function.


    The addition of the name property should help you easily identify functions for
    debugging and evaluation purposes. ECMAScript 6 also formally defines the behavior
    of block-level functions so they are no longer a syntax error in strict mode.


    In ECMAScript 6, the behavior of a function is defined by [[call]], normal function
    execution, and [[Construct]] when a function is called with new. The new.targetproperty
    also allows you to determine if a function was called using new or not.


    The biggest change to functions in ECMAScript 6 was the addition of arrow functions.
    Arrow functions are designed to be used in place of anonymous function expressions.
    Arrow functions have a more concise syntax, lexical this binding, and no arguments
    object. Additionally, arrow functions can''t change their this binding and therefore
    can''t be used as constructors.


    Tail call optimization allows some function calls to be optimized to maintain
    a smaller call stack, use less memory, and prevent stack overflow errors. This
    optimization is applied by the engine automatically when it is safe to do so;
    however, you might decide to rewrite recursive functions to take advantage of
    this optimization.'
