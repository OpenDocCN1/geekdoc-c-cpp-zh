- img_proc: true
  md: "The code to keep track of unhandled rejections in the browser is very\nsimilar\
    \ to the code for Node.js, too:\n\n```\nlet possiblyUnhandledRejections = new\
    \ Map();\n\n// when a rejection is unhandled, add it to the map\nwindow.onhandledrejection\
    \ = function(event) {\n  possiblyUnhandledRejections.set(event.promise, event.reason);\n\
    };\n\nwindow.onrejectionhandled = function(event) {\n  possiblyUnhandledRejections.delete(event.promise);\n\
    };\n\nsetInterval(function() {\n  possiblyUnhandledRejections.forEach(function(reason,\
    \ promise) {\n    console.log(reason.message ? reason.message : reason);\n\n \
    \   // do something to handle these rejections\n    handleRejection(promise, reason);\n\
    \  });\n\n  possiblyUnhandledRejections.clear();\n}, 60000);\n```\n\nThis implementation\
    \ is almost exactly the same as the Node.js implementation. It uses the same approach\
    \ of storing promises and their rejection values in a map and then inspecting\
    \ them later. The only real difference is where the information is retrieved from\
    \ the event handlers.\n\nHandling promise rejections can be tricky, but you've\
    \ just begun to see how powerful promises can really be. It's time to take the\
    \ next step and chain several promises together.\n\n# Chaining Promises\n\nAt\
    \ this point, promises may seem like little more than an incremental improvement\
    \ over using some combination of a callback and the setTimeout() function, but\
    \ there is much more to promises than meets the eye. Specifically, a number of\
    \ ways are available to chain promises to accomplish more complex asynchronous\
    \ behavior.\n\nEach call to then() or catch() actually creates and returns another\
    \ promise. This second promise is resolved only when the first has been fulfilled\
    \ or rejected. Consider this example:\n\n```\nlet p1 = new Promise(function(resolve,\
    \ reject) {\n  resolve(42);\n});\n```"
