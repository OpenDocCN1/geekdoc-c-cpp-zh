  md: 'Each method accepts two arguments: the text to search for and an optional index
    from which to start the search. When the second argument is provided, includes()
    and startsWith() start the match from index, and endsWith() starts from the length
    of the string; when the second argument is omitted, includes() and starts() search
    from the beginning of the string, and endsWith() starts from the end. In effect,
    the second argument minimizes the amount of the string being searched. Here are
    some examples showing these three methods in action:


    ```

    let msg = "Hello world";


    console.log(msg.startsWith("Hello")); // true

    console.log(msg.endsWith("world")); // true

    console.log(msg.includes("o")); // true


    console.log(msg.startsWith("o")); // false

    console.log(msg.endsWith("world!")); // true

    console.log(msg.includes("x")); // false


    console.log(msg.startsWith("o", 4)); // true

    console.log(msg.endsWith("o", 8)); // true

    console.log(msg.includes("o", 8)); // false

    ```


    The first six calls do not include a second parameter, so they''ll search the
    entire string if needed. The call to msg.startsWith("o", 4) starts the match at
    index 4 of the msg string, which is the **o** in Hello. The call to msg.endsWith("o",
    8) starts the match at index 4 as well, because the argument 8 is subtracted from
    the string length (12). The call to msg.includes("o", 8) starts the match from
    index 8, which is the in world.


    Although these three methods are easier, each returns only a Boolean value. If
    you need to find the actual position of one string within another, use the indexOf()
    or lastIndexOf() methods.


    > The startsWith(), endsWith(), and includes() methods will throw an error if
    you pass a regular expression instead of a string. In contrast, indexOf() and
    lastIndexOf() convert a regular expression argument into a string and then search
    for that.


    # The repeat() Method


    ECMAScript 6 also adds a repeat() method to strings, which accepts the number
    of times to repeat the string as an argument. It returns a new string containing
    the original string repeated the specified number of times. For example:


    ```

    console.log("x".repeat(3)); // "xxx"

    console.log("hello".repeat(2)); // "hellohello"

    console.log("abc".repeat(4)); // "abcabcabcabc"

    ```'
