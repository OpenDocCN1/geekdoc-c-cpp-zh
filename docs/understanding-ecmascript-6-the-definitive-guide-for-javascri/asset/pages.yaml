  md: "# Using Promise.resolve() method\n\nPromise.resolve() accepts a single argument\
    \ and returns a promise in the fulfilled state. That means no job scheduling occurs,\
    \ and you need to add one or more fulfillment handlers to the promise to retrieve\
    \ the value. For example:\n\n```\nlet promise = Promise.resolve(42);\n\npromise.then(function(value)\
    \ {\n  console.log(value); // 42\n});\n```\n\nThis code creates a fulfilled promise\
    \ so the fulfillment handler receives 42 as value. If a rejection handler were\
    \ added to this promise, the rejection handler would never be called because the\
    \ promise will never be in the rejected state.\n\n# Using Promise.reject()\n\n\
    You can also create rejected promises by using the Promise.reject() method. This\
    \ works like Promise.resolve() except the created promise is in the rejected state,\
    \ as follows:\n\n```\nlet promise = Promise.reject(42);\n\npromise.catch(function(value)\
    \ {\n  console.log(value); // 42\n});\n```\n\nAny additional rejection handlers\
    \ added to this promise would be called but not fulfillment handlers.\n\n> NOTE\
    \ If you pass a promise to either the Promise.resolve() or Promise.reject() method,\
    \ the promise is returned without modification.\n\n# Non-Promise Thenables\n\n\
    Both Promise.resolve() and Promise.reject() also accept non-promise thenables\
    \ as arguments. When passed a non-promise thenable, these methods create a new\
    \ promise that is called after the then() function.\nA non-promise thenable is\
    \ created when an object has a then() method that accepts a resolve and a reject\
    \ argument, like this:\n\n```\nlet thenable = {\n  then: function(resolve, reject)\
    \ {\n    resolve(42);\n  }\n};\n```"
  merge: -1
