  md: '# 12


    # PROXIES AND THE

    REFLECTION API


    ![](img/346dbcc81573ddc69906e98afee1e3ac_268_0.png)


    ECMAScript 5 and ECMAScript 6 were both developed with demystify-ning JavaScript
    functionality in mind. For example, JavaScript environments contained nonenumerable
    and nonwritable object properties prior to ECMAScript 5, but developers couldn''t
    define their own nonumerable or nonwritable properties. ECMAScript 5 included
    the Object.defineProperty() method, which allowed developers to do what JavaScript
    engines could do already.


    ECMAScript 6 gives developers further access to JavaScript engine capabilities
    previously available only to built-in objects. The language exposes the inner
    workings of objects through proxies, which are wrappers that can intercept and
    alter low-level operations of the JavaScript engine. This chapter starts by describing
    the problem that proxies are meant to address in detail, and then discusses how
    you can create and use proxies effectively.'
  merge: -1
