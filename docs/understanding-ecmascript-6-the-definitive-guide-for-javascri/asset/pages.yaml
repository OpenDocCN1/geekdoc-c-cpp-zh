  md: '# Similarities Between Typed arrays and Regular Arrays


    Typed arrays and regular arrays are similar in several ways, and as you''ve seen
    in this chapter, you can use typed arrays like regular arrays in many situations.
    For instance, you can check how many elements are in a typed array using the length
    property, and you can access a typed array''s elements directly using numeric
    indices. example:


    ```

    let ints = new Int16Array([25, 50]);


    console.log(ints.length); // 2

    console.log(ints[0]); // 25

    console.log(ints[1]); // 50

    ```


    ```

    ints[0] = 1;

    ints[1] = 2;

    ```


    ```

    console.log(ints[0]); // 1

    console.log(ints[1]); // 2

    ```


    In this code, a new Int16Array with two items is created. The items are read from
    and written to using their numeric indexes, and those values are automatically
    stored and converted into int16 values as part of the operation. The similarities
    don''t end there.


    Unlike arrays, you cannot change the size of a typed array using the length property.
    The length property is not writable, so any attempt to change it is ignored in
    non-strict mode and throws an error in strict mode.


    ![](img/346dbcc81573ddc69906e98afee1e3ac_232_0.png)


