  md: "# Accessor Properties\n\nAlthough you should create own properties inside class\
    \ constructors, classes allow you to define accessor properties on the prototype.\
    \ To create a getter, use the keyword get followed by a space, followed by an\
    \ identifier; to create a setter, do the same using the keyword set, as shown\
    \ here:\n\n```\nclass CustomHTMLElement {\n  constructor(element) {\n    this.element\
    \ = element;\n  }\n\n  get html() {\n    return this.element.innerHTML;\n  }\n\
    \n  set html(value) {\n    this.element.innerHTML = value;\n  }\n}\n```\n\n```\n\
    var descriptor = Object.getOwnPropertyDescriptor(CustomHTMLElement.prototype,\
    \ \"html\");\nconsole.log(\"get\" in descriptor); // true\nconsole.log(\"set\"\
    \ in descriptor); // true\nconsole.log(descriptor.enumerable); // false\n```\n\
    \nIn this code, the CustomHTMLElement class is made as a wrapper around an existing\
    \ DOM element. It has a getter and setter for html that delegates to the innerHTML\
    \ method on the element. Accessor property is created on the CustomHTMLElement.prototype\
    \ and, just like any other method would be, is created as nonenumerable. The equivalent\
    \ nonclass representation looks like this:\n\n```\n// direct equivalent to previous\
    \ example\nlet CustomHTMLElement = (function() {\n\n  \"use strict\";\n\n  const\
    \ CustomHTMLElement = function(element) {\n\n    // make sure the function was\
    \ called with new\n    if (typeof new.target === \"undefined\") {\n      throw\
    \ new Error(\"Constructor must be called with new.\");\n    }\n\n    this.element\
    \ = element;\n  };\n\\});\n```"
