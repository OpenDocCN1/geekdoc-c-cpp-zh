  md: "# # Inheritance with Derived Classes\n\nPrior to ECMAScript 6, implementing\
    \ inheritance with custom types was an extensive process. Proper inheritance required\
    \ multiple steps. For instance, consider this example:\n\n```\nfunction Rectangle(length,\
    \ width) {\n  this.length = length;\n  this.width = width;\n}\n\nRectangle.prototype.getArea\
    \ = function() {\n  return this.length * this.width;\n};\n\nfunction Square(length)\
    \ {\n  Rectangle.call(this, length, length);\n}\n\nSquare.prototype = Object.create(Rectangle.prototype,\
    \ {\n  constructor: {\n    value: Square,\n    enumerable: true,\n    writable:\
    \ true,\n    configurable: true\n  }\n});\n\nvar square = new Square(3);\n\nconsole.log(square.getArea());\
    \ // 9\nconsole.log(square instanceof Square); // true\nconsole.log(square instanceof\
    \ Rectangle); // true\n```\n\nSquare inherits from Rectangle, and to do so, it\
    \ must overwrite Square.prototype with a new object created from Rectangle.prototype\
    \ as well as call the Rectangle.call() method. These steps often confused JavaScript\
    \ newcomers and were a source of errors for experienced developers.\n\nSquare\
    \ inherits from Rectangle, and to do so, it must overwrite Square.prototype with\
    \ a new object created from Rectangle.prototype as well as call the Rectangle.call()\
    \ method. These steps often confused JavaScript newcomers and were a source of\
    \ errors for experienced developers.\n\nClasses make inheritance easier to implement\
    \ by using the familiar extends keyword to specify the function from which the\
    \ class should inherit. The prototypes are automatically adjusted, and you can\
    \ access the base class constructor by calling the super() method. Here's the\
    \ ECMAScript 6 equivalent of the preceding example:\n\n```\nclass Rectangle {\n\
    \  constructor(length, width) {\n    this.length = length;\n    this.width = width;\n\
    \  }\n```"
