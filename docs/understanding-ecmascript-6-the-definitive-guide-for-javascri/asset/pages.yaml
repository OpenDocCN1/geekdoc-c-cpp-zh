  md: '# Loading Modules


    Although ECMAScript 6 defines the syntax for modules, it doesn''t define how to
    load them. This is part of the complexity of a specification that''s supposed
    to be agnostic to implementation environments. Rather than trying to create a
    single specification that would work for all JavaScript environments, ECMAScript
    6 specifies only the syntax and abstracts the loading mechanism to an undefined
