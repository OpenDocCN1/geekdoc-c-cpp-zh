    is used to start the search at index 2 (which contains the value 3),

    values.includes() method returns false because 1 is not between index 2

    and the end of the array.


    # Value Comparison


    The value comparison performed by the includes() method uses the ===

    operator with one exception: NaN is considered equal to NaN even though

    NaN === NaN evaluates to false. This is different from the behavior of

    indexOf() method, which strictly uses === for comparison. To see the differ-

    ce, consider this code:


    ```

    let values = [1, NaN, 2];

    ```


    ```

    console.log(values.indexOf(NaN)); // -1

    console.log(values.includes(NaN)); // true

    ```


    The values.indexOf() method returns -1 for NaN even though NaN is con-

    tained in the array. On the other hand, values.includes() returns true

    for NaN because it uses a different value comparison operator.


    When you just want to check for the existence of a value in an array and

    dn''t need to know the index, I recommend using includes() because of

    the difference in how NaN is treated by the includes() and indexOf() methods.

    You do need to know where in the array a value exists, you have to use the

    indexOf() method.


    Another quirk of this implementation is that +0 and -0 are considered

    equal in, the behavior of indexOf() and includes() is the same:


    ```

    let values = [1, +0, 2];

    ```


    ```

    console.log(values.indexOf(-0)); // 1

    console.log(values.includes(-0)); // true

    ```


    Here, indexOf() and includes() find +0 when -0 is passed because the

    two values are considered equal. Note that this is different from the behavior

    of the Object.is() method, which considers +0 and -0 to be different values.


    # A Change to Function-Scoped Strict Mode


    When strict mode was introduced in ECMAScript 5, the language was quite a

    bit simpler than it became in ECMAScript 6, but ECMAScript 6 still allowed

    to specify strict mode using the "use strict" directive. When the direct-

    t was used in the global scope, all code would run in strict mode; using

    the directive in a function scope caused the function to run only in strict'
