  md: "# Why Is Destructuring Useful?\n\nIn ECMAScript 5 and earlier, the need to\
    \ fetch information from objects and arrays could result in a lot of duplicate\
    \ code to get certain data into local variables.\nFor example:\n\n```\nlet options\
    \ = {\n  repeat: true,\n  save: false\n};\n```\n\n```\n// extract data from the\
    \ object\nlet repeat = options.repeat,\nsave = options.save;\n```\n\nThis code\
    \ extracts the values of repeat and save from the options object, and stores data\
    \ in local variables with the same names. Although this code looks simple, imagine\
    \ if you had a large number of variables to assign: you would have to assign them\
    \ all by one. And if you had to traverse a nested data structure to find the information\
    \ instead, you might have to dig through the entire structure just to find one\
    \ piece of data.\n\nThat's ECMAScript 6 adds destructuring for objects and arrays.\
    \ When you break down a data structure into smaller parts, getting the information\
    \ you need from it becomes much easier. Many languages implement destructuring\
    \ with a minimal amount of syntax to make the process simpler. The ECMAScript\
    \ 6 implementation actually uses syntax you're already familiar with: the syntax\
    \ for object and array literals.\n\n# Object Destructuring\n\nObject destructuring\
    \ syntax uses an object literal on the left side of an assignment operation. For\
    \ example:\n\n```\nlet node = {\n  type: \"Identifier\",\n  name: \"foo\"\n};\n\
    ```\n\n```\nlet { type, name } = node;\n```\n\n```\nconsole.log(type);      //\
    \ \"Identifier\"\nconsole.log(name);      // \"foo\"\n```\n\nIn this code, the\
    \ value of node.type is stored in a variable called type, and the value of node.name\
    \ is stored in a variable called name. This syntax is the same as the object literal\
    \ property initializer shorthand introduced in Chapter 4. The identifiers type\
    \ and name are both declarations of local variables and the properties to read\
    \ the value from the node object."
  merge: -1
  pgno: 109
- img_proc: true
  md: "# DON'T FORGET THE INITIALIZER\n\nWhen you're using destructuring to declare\
    \ variables using var, let, or const, you must supply an initializer (the value\
    \ after the equal sign). The following lines of code will all throw syntax errors\
    \ due to a missing initializer:\n\n```\n// syntax error!\nvar { type, name };\n\
    \n// syntax error!\nlet { type, name };\n\n// syntax error!\nconst { type, name\
    \ };\n```\n\nAlthough const always requires an initializer, even when you're using\
    \ non-destructured variables, var and let require initializers only when you're\
    \ using destructuring.\n\n# Destructuring Assignment\n\nThe object destructuring\
    \ examples you've seen so far have used variable declarations. However, it's also\
    \ possible to use destructuring in assignments. For instance, you might decide\
    \ to change the values of variables after they're defined, as follows:\n\n```\n\
    let node = {\n  type: \"Identifier\",\n  name: \"foo\"\n},\ntype = \"Literal\"\
    ,\nname = 5;\n\n// assign different values using destructuring\n{ type, name }\
    \ = node);\n\nconsole.log(type); // \"Identifier\"\nconsole.log(name); // \"foo\"\
    \n```\n\nIn this example, type and name are initialized with values declared,\
    \ and two values with the same names are initialized with different values. The\
    \ next line uses destructuring assignments to change those values by reading from\
    \ the node object. Note that you must put parentheses around a destructuring assignment\
    \ statement. The reason is that an opening curly brace is expected to be a block\
    \ statement, and a block statement cannot appear on the left side of an assignment.\
    \ The parentheses signal that the next curly brace is not a block statement and\
    \ should be interpreted as an expression, allowing the assignment to complete.\n\
    \nDestructuring for Easier Data Access 85"
  merge: -1
  pgno: 110
- img_proc: true
  md: "A destructuring assignment expression evaluates to the right side of the expression\
    \ (after the =). That means you can use a destructuring assignment anywhere where\
    \ value is expected. For instance, consider this example, which passes a value\
    \ to a function:\n\n```\nlet node = {\n  type: \"Identifier\",\n  name: \"foo\"\
    \n},\ntype = \"Literal\",\nname = 5;\n\nfunction outputInfo(value) {\n  console.log(value\
    \ === node); // true\n}\n\noutInfo({type, name} = node);\n\nconsole.log(type);\
    \ // \"Identifier\"\nconsole.log(name); // \"foo\"\n```\n\nThe outputInfo() function\
    \ is called with a destructuring assignment expression. The expression evaluates\
    \ to node because that is the right side of the expression. The assignments to\
    \ type and name behave normally, and node is passed to the outputInfo() function.\n\
    \n> An error is thrown when the right side of the destructuring assignment expression\
    \ (expression after=) evaluates to null or undefined. This happens because any\
    \ attempt to read a property of null or undefined results in a runtime error.\n\
    \n# Default Values\n\nWhen you use a destructuring assignment statement and you\
    \ specify a local variable with a property name that doesn't exist on the object,\
    \ local variable is assigned a value of undefined. For example:\n\n```\nlet node\
    \ = {\n  type: \"Identifier\",\n  name: \"foo\"\n};\n\nlet { type, name, value\
    \ } = node;\n```\n\n```\nconsole.log(type); // \"Identifier\"\nconsole.log(name);\
    \ // \"foo\"\nconsole.log(value); // undefined\n```\n\nThis code defines an additional\
    \ local variable called value and attempts to assign it a value. However, no corresponding\
    \ value property is on the node object, so the variable is assigned the value\
    \ of undefined as expected."
  merge: -1
