    # # Weak Maps


    Weak maps are to maps what weak sets are to sets: they''re a way to store object
    references. In weak maps, every key must be an object (an error is thrown if you
    try to use a nonobject key), and those object references are held weakly so they
    don''t interfere with garbage collection. When there are no references to a weak
    map key outside a weak map, the key-value pair is removed from the weak map. But
    only weak map keys, not weak map values, are references. An object stored as a
    weak map value will prevent garbage collection, even if all other references are
    removed.


    The most useful place to employ weak maps is when you''re creating an object related
    to a particular DOM element in a web page. For example, JavaScript libraries for
    web pages maintain one custom object for every DOM element referenced in the library,
    and that mapping is stored in a cache of objects internally.


    The difficult part of this approach is determining when a DOM element no longer
    exists in the web page so the library can remove its associated object. Otherwise,
    the library would hold onto the DOM element past its reference''s usefulness and
    cause a memory leak. Tracking the DOM elements with a weak map would still allow
    the library to associate a custom object with every DOM element, and it could
    automatically destroy any object in the map when that object''s DOM element no
    longer exists.


    # # Using WeakMap


    The ECMAScript 6 WeakMap type is an unordered list of key-value pairs, where a
    key must be a non-null object and a value can be of any type. The interface for
    WeakMap is very similar to that of Map in set() and get() are used to add and
    retrieve data, respectively:


    ```

    let map = new WeakMap();

    element = document.querySelector(".element");


    map.set(element, "Original");


    let value = map.get(element);

    console.log(value); // "Original"

    ```'
