- "# C 编程基础：初学者指南\n\n\n\n![](img/rsrc7.jpg)\n\n\n\n## 第 1 章：程序开发周期\n程序是计算机执行以完成特定任务的集合。这是一个多步骤的过程，涉及问题的识别和定义、为问题开发计算机解决方案，以及准备可以在计算机上运行的指令序列。在编写程序时，必须考虑到程序将处理的数据以及生成的信息。\n\
  \n### 编程过程的步骤\n编程过程是一系列为了开发和实现计算机程序的活动。编写程序包含以下列出的六项活动：\n\n1. 理解程序规范\n2. 设计程序模型\n\
  3. 确定程序的正确性\n4. 编写程序代码\n5. 测试并调试程序\n6. 编写程序文档\n\n\n\n\n\n### 理解程序规范\n\n程序规范包含两个部分：\n\
  a) 问题定义\nb) 需求分析\n\n### 问题定义\n在开始建造房屋之前，建筑师会审查蓝图，检查是否已获得所有许可证，并对房屋的基础进行测量。建筑师为建造摩天大楼和建造狗屋的准备是不同的。无论什么项目，准备工作都会根据其需求量身定制，并在施工开始前认真地完成。\n\
  \n在设计程序模型之前，你需要完成的首要前提条件是清晰地陈述程序所要解决的问题。问题定义定义了问题是什么，而不涉及任何可能的解决方案。它是一个简单的陈述 `=`，可能有一到两页纸，并且听起来应该像一个问题。问题定义在需求分析之前，而需求分析是对问题更详细的分析。\n\
  \n问题定义应该使用用户语言，并且应该从用户的角度来描述问题。它通常不应该用技术计算机术语来表述。\n\n在不清楚问题组成部分的情况下解决问题可能会变成一项徒劳的尝试，因为解决方案可能无法满足用户的需求。因此，必须准备一份问题陈述，毫无疑问地解释问题的每一个细微细节。通过用清晰的陈述写下问题可以最好地实现这一点。更好的问题定义会带来更快、更简单、更准确的解决方案。\n\
  \n### 需求分析\n需求详细描述了程序应该做什么，它们是通往解决方案的第一步。需求活动也被称为功能规范。出于几个原因，一组显式的需求是非常关重要的。显式需求有助于确保由用户而不是程序员来驱动程序的功能。如果需求是显式的，用户就可以对它们进行审查并表示认同。显式需求可以防止你猜测用户想要什么。充分地规定需求是程序成功的关键。\n\
  \n三个基本组成部分是：\na) 什么是输入？\nb) 预期的输出是什么，以及\nc) 如何得出解决方案\n\n让我们举一个例子来理解上述输入、处理和输出的概念。程序要求在收到终端操作员的请求后，从文件中检索车辆注册记录。操作员将提供车辆注册号，程序将显示车辆及其所有者的详情。如果程序无法找到车辆记录，将显示错误信息。\n\
  \n输入：`vehicle registration number`\n处理：使用注册号进行搜索，如果找到，则从磁盘中检索车辆详情及其所有者的姓名。\n输出：如果检索成功，则允许在屏幕上显示车辆详情；如果失败，则指示磁盘上不存在车辆注册并显示相应的错误信息。\n\
  \n### 设计程序模型\n一旦问题被明确定义，就可以开发算法（处理逻辑的另一个术语）。这是编程中最具创造力的部分。在这个阶段，算法可以用宽泛的术语构建，以帮助可视化可能的替代方案。\n\
  \n算法是一个公式、一个配方、为了获得问题的解决方案而必须遵循的逐步步骤程序。为了成为编写程序的有效基础，算法必须满足：\na) 在有限时间内得出正确的解法。\n\
  b) 清晰、精确、无歧且\nc) 采用一种便于在编程语言中进行优雅实现的格式。\n\n在开发解决方案和准备算法时使用的工具包括流程图和伪代码等。流程图提供了解决方案的视觉和图形化表示，而伪代码意味着用简单的英语类语言编写程序逻辑。使用这些工具描绘的逻辑随后可以使用任何编程语言编写。换句话说，这些是通用工具。我们将在本课程中详细研究这些工具。\n\
  \n### 确定算法的正确性\n算法开发中最困难、有时最枯燥的步骤之一是确保并提供算法是正确的。算法或程序的正确性意味着它给出了正确的输出并执行了它应该做的事情。算法或程序的正确性可以通过以下任一方法进行检查：\n\
  a) 手算（Dry run）\nb) 独立检查。\nc) 结构化评审。\n\n### 编写程序\n这是将我们的解决方案（即算法流程图/伪代码）转换为实际计算机程序的过程。在这里我们选择一种编程语言并利用该语言的语法和语义，转换我们为止以流程图/伪代码形式表示的算法。\n\
  \n语法意味着编写命令或系列命令的正确方法或语法，包括所有正确的选项和命令行语句。\n语义意味着语句的逻辑含义，独立于语法结构。\n\n### 测试和调试程序\n\
  一旦编码完成，你把程序输入计算机。计算机随后会将我们的程序编译成机器码。编译意味着将源代码（即使用高级语言编写的用户程序）转换为机器码（即机器理解的语言）。编译会产生某些错误，计算机会在过程结束后指示。这些错误必须修正，然后重新编译程序。该过程一直持续到程序没有错误。接下来，我们必须验证程序执行了它应该做的一切事情。计算机程序第一次运行通常不正常。通常会遇到的三类错误是：\n\
  a) 语法\nb) 执行\nc) 逻辑\n\n### 语法错误\n语法错误发生在计算机语言编译器无法理解程序员输入的命令时。当遇到此类错误时，计算机会拒绝程序并打印出错误信息。这些错误在编译期间遇到，非常容易修正。在许多情况下，这些错误由于拼写错误、命令错误引起。例如，在\
  \ C 中中如果我们输入 `PRINT` 而不是 `printf`，这将导致错误。\n\n### 执行错误\n这些错误在无错误编译后的执行期间遇到。执行错误也称为运行时错误。典型示例包括：\n\
  1 无限循环\n2 仅对选定数据输出正确\n3 数据错误或顺序错误\n4 文件名错误\n5 除法检查错误。这些检查在除以零或接近零的数字时出现。\n\n###\
  \ 逻辑错误\n逻辑错误由于程序员在编码时犯的错误引起。计算机不检测逻辑错误。例如，计算员工净工资的公式应为 `NETSALARY=BASIC+ALLOWANCE-DEDUCTIONS`。但由于疏忽，编码时将公式写成了\
  \ `NETSALARY=BASIC+ALLOWANCE`。这显然会产生错误的结果。这种错误只能通过手算检测。为了纠正这些错误，我们必须检查程序的算法。通过运行已知答案的样例问题，很容易检测到这些错误。大多数此类错误可以通过合理设计程序来消除。\n\
  \n### 调试\n调试是识别错误根源并修正错误的过程。与测试相反，测试是最初检测错误的过程。\n\n### 文档\n一旦程序编写并调试完成，就可以使用了，因此需要关于如何运行程序、输入数据、预期哪些问题以及如何处理这些问题的文档。程序的文档将由流程图/伪代码、程序列表以及相关算法和过程的详细文字说明组成。文档对于程序的维护是必要的。如果没有适当的文档，后期修改程序将非常困难。误认为文档是算法开发阶段的最后一步实际上它应该贯穿整个编程阶段，特别是设计和实现阶段，因为文档应该让人们理解程序的逻辑。\n\
  \n 结构化编程技术\n结构化编程技术意味着程序开发和编码必须遵循自顶向下的方法和结构化编程构造。自顶向下的方法意味着将程序规划为层次结构。编程从顶层（主）模块开始。在编写主模块时，然后编写第二层模块。为了支持自顶向下编程的规范，编程中遵循以下基本的结构化编程构造：\n\
  \n\n\n\n\n## 程序结构\n\n* 顺序\n* 选择\n* 重复\n\n顺序结构表示，在没有中间控制结构的情况下，控制流通常会从一条指令顺序传递到下一条。选择结构表示从几个选项中进行决策。也就是说，程序可能会根据决策跳转到多个位置中的一个。重复结构（或循环结构）则在一组指令需要重复执行多次时出现。它避免了重复编写相同一组语句的麻烦。\n\
  \n### 一个好程序的标准\n\n以下是用来判断一个程序是否优良的一些问题：\n\n* 它解决了在规格说明中提出的问题吗？\n* 它在所有条件下都能正常工作吗？\n\
  * 它是否有完善的文档说明？\n* 它是使用模块化方法编写的？\n* 它是否高效利用了计算机的时间和内存？\n\n如果在程序设计的每个阶段都投入了足够的思考和努力，这些标准就可以自动满足。\n\
  \n### 程序流程图\n\n程序流程图是完成某任务所需的逻辑的图化表示。它包含了程序的所有必要步骤。它之所以被称为流程图，是因为它绘制了程序的流向。它是每个输入、输出和处理步骤的符号化表示。除了是记录算法的一种良好方法外，它也是程序文档的一部分，有助于理解、调试和维护程序。\n\
  \n在流程图绘制技术，通过为操作绘制适当的符号来表示操作。传统的程序流程图绘制使用简单的几何符号来表示程序的开始或结束、过程、决策或输入-输出过程。这些流程图符号通过箭头连接，以说明操作的顺序。\n\
  \n一种使用符号显示操作、活动或程序的逐步顺序的图形化表示法。用于计算机系统分析、活动分析以及一般的程序序列表示。\n\n以下表示最常用的符号及其通用接受的含义：![](img/rsrc5C.jpg)\n\
  \n这是一个关于“玩什么”的流程图示例。![](img/rsrc5H.jpg)\n\n示例：计算阶乘 `N` (`N!`) 的流程图。(rsrc5R.jpg)\n\
  寻找三个数中最大值的流程图。![](img/rsrc5W.jpg)\n\n### 算法\n\n算法是完成你想要做的工作所需的逐步指令。算法中的每条指令被称为 `STEP`，而在\
  \ C 语言中我们称之为 `STATEMENT`。现在，我们将看看算法看起来是什么样的。要描述算法，你不需要了解任何计算机的知识，至少目前不需要。你真正需要的是开放的心态和你的母语。让我们来看这一个，假设给你给你两杯装满彩色水，红色和绿色。现在你被要求交换杯中的水。装有红水的杯应该装绿水，另一个杯装红水。思考这个问题，有多种方法可以实现，但其中有一种方法被认为是最好的。\n\
  \n```\nStep 1 Glass 1 HAS water Red\nStep 2 Glass 2 HAS water green\nStep 3 Get\
  \ an EMPTY glass 3\nStep 4 Transfer RED water from glass 1 to EMPTY glass 3\nStep\
  \ 5 Transfer GREEN water from glass 2 to EMPTY 1\nStep 6 Transfer RED water from\
  \ Glass 3 to EMPTY glass 2.\n```\n\n### 伪代码\n\n表示程序逻辑的另一种方法是伪代码（Pseudocode）。伪代码不是使用符号来表示程序逻辑步骤，而是使用连接实际编程和普通英语的语句。在伪代码中，每一步都使用一个简单的英语短语写成，这种短语也被称为构造（construct）。\n\
  \n伪代码是程序的大纲，以可以轻松转换为任何实际编程语言语句的形式编写。伪代码既不能编译也无法执行，也没有真正的格式或语法规则。它仅仅是生成最终代码过程中一个非常重要的步骤。伪代码的好处是它让程序员能够专注于算法，而不必担心特定编程语言的所有语法细节。事实上，你甚至可以在不知道最终将使用何种编程语言实现的情况下编写伪代码。\n\
  \n编写伪代码时使用的一些惯例如下：\n\n1. 循环中的所有语句都应该缩进。\n2. 所有字母数字值都应该包含单引号或双引号中。\n3. 伪代码的开始和结束分别用\
  \ `start` 和 `End` 等关键字标记。\n4. 所有语句必须包含表示操作的特定关键字。\n\n\n\n\n例如，两个数字相加的伪代码：\n\n```\n\
  ACCEPT N1\nACCEPT N2\nSUM=N1+N2\nDISPLAY SUM\nEND\n```\n\n例如，冒泡排序的伪代码：\n```\nWHILE\
  \ NOT AT END OF LIST\nCOMPARE ADJACENT ELEMENTS\nSIF SECOND IS GREATER THAN FIRST\n\
  SWITCH THEM\nGET NEXT TWO ELEMENTS\nSIF ELEMENTS WERE SWITCHED\nREPEAT FOR ENTIRE\
  \ LIST\n```\n\n## 关于 C 语言\n\n作为一种编程语言，`c` 非常类似于 Pascal 或 FORTRAN。值存储在变量中。程序通过定义和函数来实现结构化。通过循环、if\
  \ 语句控制程序流。`C` 允许数据存储在数组或结构中。在这些语言中，`C` 比 FORTRAN 更简洁。`C` 提供了精确的输入输出控制。`C` 能够产生强大的程序。希望初学者会发现\
  \ `C` 语言是一种很有用且友好的语言。\n\n### C 语言起源简要介绍\n\n`C` 是一门中间级通用编程语言，与 `UNIX` 操作系统紧密相关。`C`\
  \ 的很多重要思想源于 `BCPL`（由 Martin Richards 开发）。`BCPL` 对 `C` 的影响间接通过 `B` 语言实现，那是 Ken Thompson\
  \ 在 1970 年在贝尔实验室编写的。`BCPL` 和 `B` 是无类型语言，而 `C` 提供了多种数据类型。1972 年，Dennis Ritchie 在贝尔实验室编写了\
  \ `C`，1978 年 Brian Kernighan 和 Dennis Ritchie 出版的《C 程序语言》引发了计算界的革命。\n\n1983 年，美国国家协会\
  \ (`ANSI`) 成立了一个委员会为 `C` 提供一个现代、全面的定义。所得的标准即“ANSI C”于 1988 年完成。\n\n### 个人电脑上的 C\n\
  \n关于个人电脑，对于 IBM（或兼容机）PC，`Microsoft C` 和 `Borland C`（`Turbo C`）被认为是两个最常用的系统。本课程在\
  \ Microsoft Windows 和磁盘操作系统环境下教授 `C`。`C program` 在其他系统（如 VMS 或 DOS）下看起来相似；但某些功能会随系统而不同。特别是编译程序生成可执行文件的方法在每个系统上都是不同的。`UNIX`\
  \ 系统本身就是用 `C` 编写的；事实上，`C` 是为了实现 `UNIX` 而发明的。你输入的所有 `UNIX` 命令，以及密码检查、打印机队列或磁带控制器等其他系统设施都是用\
  \ `C` 编写的。\n\n在 `UNIX` 开发过程中，编写了数百个函数来访问系统的各种事实。这些函数以库的形式供程序员使用。通过使用 `C` 编写和 `UNIX`\
  \ 系统库，可以创建非常强大的系统程序。其他编程语言较难访问这些库。因此，`C` 是编写 `UNIX` 系统程序的自然语言。\n\n### 程序开发与执行方法\n\
  \n要理解程序开发与执行方法，首先查看下面的流程图。在 `C` 等编译型语言中开发程序至少需要四个基本步骤。基本原理是，无论你选择哪种 `C` 编译器，步骤几乎总是相同的。在本教程中，所有的程序都基于\
  \ `Borland C` 编译器编写。基本步骤为：\n\n1. 编辑或编写程序\n2. 编译\n3. 链接\n4. 执行\n\n\n\n\n## 关于 IDE\n\
  `Borland C IDE`（集成开发环境）是一个强大的环境，允许我们创建和执行 C 程序。该 IDE 完全由菜单驱动，允许用户使用易于操作的菜单或组合键来创建、编辑、编译和运行\
  \ C 程序。\n\n### 编辑\n要编写一个新程序，首先从 `File`（文件）菜单中打开一个 `New`（新建）文件。在这里，直接在屏幕上的新窗口中输入程序，并将生成的文本保存为单独的文件。这通常被称为源代码文件。习惯做法是，C\
  \ 程序的源代码文件使用扩展名 `.c`，用于 C 编程语言。\n\n### 编译\n我们不能直接执行源文件。为了在任何计算机系统上运行，必须将源代码翻译成计算机中央处理器（例如，奔腾腾微处理器）能够理解的二进制数。这个过程会生成一个扩展名为\
  \ `.obj` 的中间对象文件，它代表 `Object`（对象）。我们可以通过菜单中的 `Project > compile` 或通过组合键 `Alt+F9`\
  \ 来编译 C 源代码文件。\n\n### 链接\n大多数人脑海中浮现出的第一个问题是“为什么链接是必要的？”主要原因是许多编译型语言带有库例程，可以添加到程序中。这些例程由编译器制造商编写，用于执行各种任务，从输入输出到复杂的数学函数。在\
  \ C 语言中，标准输入输出函数包含在一个库文件（`stdio.h`）中，因此是最基本的程序也需要库函数。链接后，文件扩展名为 `.exe`，这是一个可执行文件。我们可以同时通过菜单\
  \ `Debug>Run` 或组合键 `Ctrl+F9` 链接并执行编译后的 C 程序。\n\n### 可执行文件\n现在，我们可以像运行其他应用程序一样运行\
  \ `.exe` 文件，只需在 DOS 提示符处输入它们的名称或使用 Windows 菜单运行即可。\n\n## C 程序的布局\nC 程序的通用形式如下：\n\
  \n```c\n预处理器指令\n全局声明\nmain(){\n    函数 main 函数的局部变量;\n    与函数 main() 相关的语句\n}\nfun1(){\n\
  \    函数 fun1 函数的局部变量;\n    与函数 fun1() 相关的语句\n}\nfun2(){\n    函数 fun2 函数的局部变量;\n\
  \    与函数 fun2() 相关的语句\n}\n```\n\n所有 C 程序至少将由一个函数组成，但通常（当你的经验增长时）会编写一个包含多个函数的 C 程序。必须存在的函数是名为\
  \ `main` 的函数。对于更高级的程序，`main` 函数将作为一个控制函数，依次调用其他函数来完成特定的工作。`main()` 函数是 C 程序执行时被调用的第一个函数。\n\
  \n注意括号集 `()` 和 `{}` 的使用。`()` 与函数名结合使用，而 `{}` 用于界定与该函数相关的 C 语句。还要注意，使用分号（`;`）来结束\
  \ C 语句。C 是一种自由格式语言，长语句可以在不被截断的情况下延续到下一行。分号告知 C 编译器语句已经结束。自由格式还意味着你可以根据需要任意数量的空格来提高程序的可读性。\n\
  \n每个初学 C 编程语言的新手都会犯一个非常常见的错误，就是遗漏了分号。C 编译器会将程序的各个行连接在一起，然后尝试理解它们——但它将无法做到这一点。编译器产生的错误信息将与你程序中的某行有关，该行可能距离初始错误有一定的距离。\n\
  \n### 我们的第一个 C 程序\n现在让我们按照如下方式编写我们的第一个 C 程序：\n\n```c\n#include<stdio.h>\n/*main\
  \ function starts here*/\nvoid main(){\n    printf(\"Hello world!\\n\");\n}\n```\n\
  \n### 逐行解释\n**第 1 行：#include<stdio.h>`**\n作为编译的一部分，C 编译器运行一个名为 C 预处理器的程序。预处理器能够从你的源文件中添加和删除代码。在这种情况下，预处理器指令\
  \ `#include` 告诉编译器包含来自 `stdio.h` 文件的代码。该文件包含了程序需要使用的函数声明。`printf` 函数的声明就在文件中。\n\n\
  **第 2 行：`/*main function starts here*/`**\n这是一个注释。注释是你写在源代码中写给自己或他人的备注。编译器会忽略所有注释。注释主要用于说明源代码的含义和目的，以便我们以后能记住它是如何运行的以及如何使用。你也可以使用注释来临时移除某行代码。只需用注释符号包围这些行。在\
  \ C 语言中，注释的开始由 `/*` 字符指示，由 `*/` 结束。\n\n**第 3 行：`void main()`**\n该语句声明了 `main` 函数。C\
  \ 程序可以包含许多函数，但必须始终有一个 `main` 函数。函数是一个可以完成某些任务的自包含式代码模块。`\"void\"` 指定了 `main` 的返回类型。在这种情况下，没有内容返回给操作系统。\n\
  \n**第 4 行：`{`**\n这个左大括号表示 `main` 函数的开始。\n\n**第 5 行：`printf(\"Hello world!\\n\");`**\n\
  `printf` 是标准 C 库中的函数，用于将字符串打印到标准输出设备（通常是屏幕）。编译器将这些标准库中的代码与你编写的代码链接，以产生最终的可执行文件。`\\\
  n` 是一个特殊的格式修改符，告诉 `printf` 在行尾打印一个换行符。如果程序中有另一个 `printf`，它将出现在下一行。\n\n**第 6 行：`}`**\n\
  这个右大括号表示 `main` 函数的结束。\n\n将其输入新文件并保存为 `Hello.c`。然后使用编译器进行编译，使用链接器进行链接，最后运行它。输出如下：\n\
  \n### 关于头文件和预处理器指令的说明\n包含内置函数定义的文件被称为头文件。如果我们使用任何输入输出函数或任何内置函数，那么在 main 函数开始之前必须包含相应的头文件。在这里，我们在示例中包含了\
  \ `stdio.h` 头文件，因为基本输出函数 `printf()` 的定义在这里。随着我们的进行，我们将了解其他的头文件。\n\n作为编译的一部分，C 编译器运行一个名为\
  \ C 预处理器的程序。预处理器指令指示编译器在编译源代码之前做什么。在这种情况下，预处理器指令 `#include` 告诉编译器包含来自 `stdio.h`\
  \ 文件的代码。该文件包含了程序需要使用的函数声明。`printf` 函数的声明就在文件中。\n\n已经提到过 C 是一种自由格式语言，你可以按照自己的意愿布局程序并使用尽可能多的空格。唯一的例外是与预处理器指令相关的语句。所有预处理器指令都以\
  \ # 符号开头，不使用分号作为分隔符。所有 C 程序中常见的预处理器指令是：\n`#include<stdio.h>`\n注意文件名周围使用的角括号 `<`\
  \ 和 `>`。这些表示要在系统磁盘中查找头文件，系统磁盘存储了其余 C 程序。我们也可以把上述语句写为：\n`#include \"stdio.h\"`\n\
  双引号表示应在当前工作目录中搜索所需的头文件。当你编写自己的头文件时，这是正确的。但是，标准头文件应该始终带有角括号包裹。\n\n### C 程序的构建块\n\
  现在我们必须开始研究 C 语言的细节。你觉得接下来的部分的难易程度取决于你以前是否编程过——无论用的是什么语言。编程中有许多共同的概念，C 语言也不例外。所以，如果你以前没有编程过，你需要缓慢地阅读接下来的部分，并反复查看，直到理解它为止。学习\
  \ C 编程语言所需的基础知识如下：\n\n\n\n\n\n1. 字符集\n2. 关键字\n3. 数据类型\n4. 变量\n5. 常数\n6. 不同的运算符与表达式\n\
  7. 基础 I/O \n\n### 字符集\n我们在 C 程序中使用的字符集如下：\n\n| 字母 | `a-z`, `A-Z` |\n| :--- | :---\
  \ |\n| 数字 | `0-9` |\n| 特殊符号 | `~`!@#$%^&*()_+{}:”;’<>,./?` |\n\n### 关键字\nC 语言中定义了\
  \ 32 个单词作为关键字。这些单词具有预定义的用途，且不能用于任何其他用途，例如 C 程序中变量或常数的命名。它们始终以小写形式。下面是完整的列表，它们与形式语法结合形成了\
  \ C 编程语言。\n\n| Auto | Double | Int | Struct |\n| :--- | :--- | :--- | :--- |\n|\
  \ Break | Else | Long | Switch |\n| Case | Enum | Register | Typedef |\n| Char |\
  \ Extern | Return | Union |\n| Const | Float | Short | Unsigned |\n| Continue |\
  \ For | Signed | Void |\n| Default | Goto | Sizeof | Volatile |\n| Do | If | Static\
  \ | While |\n\n### 数据类型\n任何 C 程序都有两个实体需要考虑：数据和程序。它们之间高度依赖，对两者都进行仔细的规划将导致一个规划良好且编写良好的程序。为了处理\
  \ C 程序中的数据，我们创建变量来存储其中的值，在 C 中，在执行程序之前，必须说明我们对要进行任何操作的每个变量的类型。C 语言中的数据类型分为四类，如下所示![](img/rsrcE3.jpg)\n\
  \n| 类型 | 字节 | 范围 | 精度 |\n| :--- | :--- | :--- | :--- |\n| Short int | 2 | -32768\
  \ to +32768 | |\n| Unsigned short int | 2 | 0 to +65535 | |\n| Unsigned int | 4\
  \ | 0 to +4294967295 | |\n| Int | 4 | -2147483648 to +2147483648 | |\n| Long int\
  \ | 4 | -2147483648 to +2147483648 | |\n| Signed char | 1 | -128 to +127 | |\n|\
  \ Unsigned char | 1 | 0 to +255 | |\n| Float | 4 | +/- 1E-37..1E+37 | 6 位 |\n| Double\
  \ | 8 | +/- 1E-37..1E+37 | 10 位 |\n| Long double | 12 | +/- 1E-37..1E+37 | 10 位\
  \ |\n\n注意：这些数字仅适用于当今代的 PC。大型机和中型机可能使用不同的数字，但仍然符合上述规则。\n\n### 变量\n变量只是主内存中一个命名的区域，可以存储单个数值或字符值。在\
  \ C 中，在实际对其进行任何操作之前，必须声明要使用的每个变量名及其类型。\n\n### 变量名的构造规则\n* 变量名可以是数字和字母的组合，长度任意。\n\
  * 变量必须具有特定的数据类型。\n* 变量名的第一个字符必须是字母。\n* 变量名中不允许出现逗号、空格或特殊符号，下划线（`_`）除外。\n* 大和小写字母是不同的。\n\
  * 关键字不能作为变量名。\n\n```c\nint no1; float interest_rate; char choice;\n```\n\n### 常数\n\
  常数是在程序执行过程中不会改变自身的值。在 C 中有三种定义常数的技术。它们是：\n\n1. 使用 `#define`\n2. 使用 `const`\n3. 使用枚举\n\
  \n### 使用 #define\n可以使用预处理器指令 `#define` 定义常数。`#define` 指令用法如下：\n```c\n#define BELL\
  \ '\\a'\n```\n每当常数在你的源文件中出现时，预处理器就会将其替换为它的值。例如，你源代码中的每个 `BELL` 都被替换为 `\\a`。编译器现在会在你的源代码中看到值\
  \ `\\a`，而不是 `BELL`。每个 `BELL` 只是被替换为它的值。这里是一个说明预处理器指令 `#define` 的简单程序。\n\n```c\n\
  #include<stdio.h>\n#include<conio.h>\n#define BELL '\\a'\nvoid main(){\n    printf(\"\
  Press any key to hear the bell!\");\n    getch();\n    printf(\"%c\", BELL);\n}\n\
  ```\n\n### 使用 const\n第二种技术是在定义常数变量时使用关键字 `const`。使用时，编译器将捕获修改声明为 `const` 变量的尝试。\n\
  ```c\nconst float PI=3.1428571428571;\n```\n与第一种技术相比有两个主要优点。首先，定义了常数的类型，这里 `PI`\
  \ 是一个 `float` 类型常数。这允许编译器进行某些类型检查。其次，常数是具有定义范围的变量。变量的作用域与程序中定义它的部分有关。\n\n```c\n\
  #include<stdio.h>\nvoid main(){\n    const float PI=3.1428571428571;\n    float\
  \ area, perimeter;\n    printf(\"enter radius:\");\n    scanf(\"%f\", &radius);\n\
  \    area=PI*radius;\n    printf(\"Area=%f and perimeter=%f\", area, perimeter);\n\
  }\n```\n\n### 使用枚举\n定义常数的第三种技术称为枚举。enum {\"Sun\",\"Wed\",\"Sat\"}\n\n### 不同的运算符与表达式\n\
  运算符是对某些值的符号。\n\n### 运算符的类型\n1. 算术运算符\n2. 关系运算符\n3. 逻辑运算符\n4. 赋值运算符\n5. 增减运算符\n6.\
  \ 条件运算符\n7. 位运算符\n8. 逗号运算符\n9. 其他运算符\n\n### 算术运算符\n算术运算符可以分为一元操作和二元操作。以下是算术运算符列表。\n\
  \n| 运算符 | 含义 |\n| :--- | :--- |\n| + | 加 |\n| - | 减 |\n| * |乘 |\n| / | 除 |\n| %\
  \ | 取模 |\n\n注意：C 没有指数运算符。\n\n### 关系运算符\n关系运算符用于比较算术、逻辑和字符表达式。我们经常比较两个数量并根据此做出决定。因此，这些比较在条件假时返回\
  \ 0，真时返回 1。运算符如下：\n\n| 运算符 | 含义 |\n| :--- | :--- |\n| > | 大于 |\n| < | 小于 |\n| >=\
  \ | 大于等于 |\n| <= | 小于等于 |\n| == | 等于 |\n| != | 不等于 |\n\n### 逻辑运算符\n这些运算符用于比较逻辑和关系表达式。运算符如下：\n\
  \n| 运算符 | 含义 |\n| :--- | :--- |\n| && | 逻辑与 |\n| || | 逻辑或 |\n| ! | 逻辑非 |\n\n###\
  \ 赋值运算符\n通常情况下，`=` 符号被称为赋值运算符。该运算符评估右侧的表达式并将结果赋值给左侧的变量。剩余的赋值运算符是复合赋值运算符。它们允许对左右侧相同的赋值进行压缩，所有复合赋值运算符的列表如下：\n\
  \n| *= | /= | %= | += | = |\n| &= | |= | ^= | >>= | <<= |\n\n### 增减运算符\n这些运算符用于增加或减少变量的值。这些如下：\n\
  \n| 运算符 | 含义 |\n| :--- | :--- |\n| ++ | 增加 1 |\n| -- | 减少 1 |\n\n注意：这些运算符表现为两种形式，\n\
  \n1. 后置增或或后置减\n例如 `j++` 意味着赋值 `j` 的值并增加 1；`k--` 意味着赋值 `k` 的值并减少 1。\n\n2. 前置增或前置减\n\
  \n\n\n\n\n例如 `++j` 表示将值加 1 并赋值；`--k` 表示将值减 1 并对 `k` 的值赋值。\n\n### 条件运算符\n该运算符由两个符号组成：问号（`?`）和冒号（:`）。它包含三个部分——文本表达式、真部分和假部分，如\
  \ `text expression ? true part : false part`。它根据测试表达式将真部分的值或假部分的值赋值给变量。\n\n`i=(j>5)?2:3`\n\
  这里如果 `j` 的值大于 5，则将 `2` 赋值给 `i`，否则赋值 `3`。\n\n### 位运算符\n这些运算符对数据的每一位进行操作。它们用于位测试、取反或将位右移或左移。它们如下：\n\
  \n| 运算符 | 含义 |\n| :--- | :--- |\n| `&` | 按位与 |\n| `|` | 按位或 |\n| `^` | 按位异或 |\n\
  | `<<` | 按位左移 |\n| `>>` | 按位右移 |\n| `~` | 按位取反 |\n\n### 逗号运算符\n该运算符用于分隔一组变量。`,`\
  \ 符号被称为逗号运算符。\n\n### 其他运算符\n`sizeof()` 运算符返回变量数据类型的大小，或者变量在内存中所占据的字节数。成员选择运算符（`.`\
  \ 和 `->`）用于结构体和联合体。指针运算符（`*`）、地址运算符（`&`）、数组下标（`[]`）、`(类型强制转换)` 等。\n\n以下列出了所有 C 运算符，按其优先级（从高到低）排序。它们的结合性表示表达式中等优先级相同的运算符的执行顺序。\n\
  \n| 运算符 | 描述 | 结合性 |\n| :--- | :--- | :--- |\n| `()[] .->` | 括号（表达式分组）括号（数组下标）通过对象名选择成员通过通过指针选择成员\
  \ | 从左到右 |\n| `++ -- + ! ~ (type)* & Sizeof` | 一元前增/前减 一元正/负 一元逻辑取反/按位取反 一元强制转换（更改类型）解引用\
  \ 地址 确定字节大小 | 从右到左 |\n| `. / %` | 乘/除/取模 | 从左到右 |\n| `+ -` | 加/减 | 从左到右 |\n| `<<\
  \ >>` | 按位左移，按位右移 | 从左到右 |\n| `< <=> >=` | 关系小于/小于或等于 关系大于/大于或等于 | 从左到右 |\n| `==\
  \ !=` | 关系等于/不等于 | 从左到右 |\n| `&` | 按位与 | 从左到右 |\n| `^` | 按位异或 | 从左到右 |\n| `|` |\
  \ 按位或 | 从左到右 |\n| `&&` | 逻辑与 | 从左到右 |\n| `||` | 逻辑或 | 从左到右 |\n| `? :` | 三元条件运算符\
  \ | 从左到右 |\n| `= += -= *= /=%= &=^= |= <<= >>=` | 赋值 加/减赋值 乘法/除法赋值 取模/按位与赋值 按位异或/或赋值\
  \ 按位左移/右移赋值 | 从左到右 |\n| `,` | 逗号（分隔表达式） | 从左到右 |\n\n### 基础输入输出语句\n通常 I/O，输入和输出是任何程序的重要部分。为了执行任何有用操作，你的程序需要能够接受输入数据并报告结果。在\
  \ C 中，标准库提供了输入输出的例程。标准库有处理输入、输出以及字符和字符串处理的函数。这里，描述的所有输入函数都从标准输入读取，的所有输出函数都写入标准输出。标准输入通常是键盘。标准输出通常是显示器。\n\
  \n### 格式化输出\n`printf()`：这是一个用于输出的多功能函数。它可以处理任何基本数据类型，并提供了几种方法，让我们指定数据的显示方式。\n\n\
  ```c\nprintf(\"%d\", x);\nprintf(\"%d %d %f\", x, y, z);\n```\n\n`scanf()`：这是一个从键盘获取输入的非常有用的函数。它可以处理任何基本数据类型，并提供一次性从键盘获取多个值。\n\
  \n```c\nscanf(\"%d\", &x);\nscanf(\"%d %d %f\", &x, &y, &z);\n```\n\n### 在 C 程序中使用\
  \ printf() 函数\n```c\n#include<stdio.h>\nmain() {\n    printf(\"this is an example\
  \ of something printed!\");\n    return 0;\n}\n```\n\n### 在 C 程序中使用 scanf() 函数\n\
  ```c\n#include<stdio.h>\nmain() {\n    float y;\n    int x;\n    puts(\"enter a\
  \ float, then an int\");\n    scanf(\"%f%d\", &y, &x);\n    printf(\"\\nYou entered\
  \ %f and %d\", y, x);\n    return 0;\n}\n```\n\n### 使用 int 和 printf() 的另一个 C 程序\n\
  ```c\n#include<stdio.h>\nMain() {\n    int a, b, average;\n    a = 10;\n    b =\
  \ 6;\n    average = (a+b)/2;\n    printf(\"Here \");\n    printf(\"is \");\n   \
  \ printf(\"the \");\n    printf(\"answer \");\n    printf(\"\\n \");\n    printf(\"\
  %d \", average);\n}\n```\n\n### 演示 scanf() 的简单程序\n```c\n#include<stdio.h>\nMain()\
  \ {\n    int a, b, c;\n    printf(\"\\nThe first number is \");\n    scanf(\"%d\"\
  , &a);\n    printf(\"\\nThe second number is \");\n    scanf(\"%d\", &b);\n    c\
  \ = a+b;\n    printf(\"The answer is %d\\n\", c);\n}\n```\n\n### C 中的控制结构\n### 简介\n\
  控制结构决定了 C 程序中各种指令的执行顺序。换句话说，它们决定了程序的流程。控制结构如下：\n\n1. 顺序控制结构\n2. 条件分支结构\n3. 无条件分支结构\n\
  4. 循环结构\n\n### 顺序控制结构\n这种控制结构确保指令按照在 C 程序中出现的顺序执行。\n\n#### 条件分支结构\n这种控制结构允许我们决定执行哪些指令。决策结构如下：\n\
  \n1. if 结构\n语法：`if (condition){statements}`\n这里，如果给定的条件为真，则将执行括号内的语句。如果只有一个语句，则不需要写括号。\n\
  例如：`if (i>5)printf(\"The value of i is greater than 5\");`\n\n2. if-else 结构\n语法：`if\
  \ (condition){statements;}else{statements}`\nif 语句本身在条件为真时执行单个或一组语句，在条件为假时什么都不做。else\
  \ 语句的目的是即使条件为假也执行其后面写的语句集。如果只有一个语句，则不需要写括号。\n例如：`if(i>5)printf(\"The value of i\
  \ is greater than 5\");elseprintf(\"The value of i is less than or equal to 5\"\
  );`\n\n3. 嵌套 if 结构\n如果我们将整个 if 或 if-else 结构写在 if 语句体或 else 语句体内，这就被称为嵌套 if 结构。\n\
  语法：`if(condition){statements;if(condition)}`\n例如：`if(j>5)if(j>10){printf(\"The value\
  \ of i is greater than 5 and\");printf(\"The value of j is greater than 10.\");};`\n\
  \n4. switch-case 结构\n\n\n\n\n\n### switch 语句\n\n语法：\n```c\nswitch(expression){\n\
  \    case value1: statements;\n        break;\n    case value2: statements;\n  \
  \      break;\n    ...\n    default: statements;\n        break;\n}\n```\n它也被称为多分支语句。它由\
  \ `switch` 中的一个表达式和 `case` 语句中的常量值组成。根据给定 `expression` 的值，该结构可以包含任意数量的 `case` 语句。如果\
  \ `switch` 语句中的 `expression` 与 `case` 语句中的任何常量值匹配，则执行该语句——即 `case` 语句之后的语句。但是，如果任何常量值都不与给定的\
  \ `expression` 匹配，则将执行写在 `default` 部分的语句。在每个 `case` 结尾以及 `default` 部分，一个 `break`\
  \ 语句是必需的。在这个结构中，`default` 部分是完全可选的。\n\n例如：\n```c\nswitch (n) /*这里 n 是一个变量*/{\n \
  \   case 0: printf(“Value of n is 0”);break;\n    case 1: printf(“Value of n is\
  \ 1”);break;\n    ...\n    case 9: printf(“Value of n is 9”);break;\n    default:\
  \ printf(“Value of n is not between 0-9”);break;\n};\n```\n\n### 无条件跳转语句\n\n通常不应支持这种语句，因为会将控制权转移到另一个位置，导致用户对程序产生困惑。这些语句应该只在控制语句内部使用，否则用户可能无法完美需求。无条件跳转语句有三种类型：\n\
  \n### 1. goto\n\n语法：\n```c\ngoto<label-name>;\n...\n<label>:\n...\n```\n它根据标签名称将控制权转移到所需的语句。与\
  \ `goto` 语句相同的标签名不应使用两次。标签名可以使用 `goto` 语句之前或之后。\n\n例如：\n```c\nif(j>5) goto lb1;\n\
  lb1;\nprintf(“Value of j is greater than 5”);\n```\n\n### 2. continue\n\n语法：\n```c\n\
  continue\n```\n在循环结构中，该语句块将连续执行，而不会中断循环。\n\n例如：\n```c\nk=0;\nwhile(k<5){\n    printf(“This\
  \ is an example”);\n    printf(“of continue statement!”);\n    continue;\n    k++;\n\
  }\n```\n\n### 3. break\n\n语法：\n```c\nbreak;\n```\n它用于将控制权转移到控制结构的外部。\n\n例如：\n```c\n\
  k=0;\nwhile(k<5){\n    printf(“This is an example”);\n    printf(“of a break statement!”);\n\
  \    break;\n    k++;\n}\n```\n\n### 循环控制结构\n\n计算机的通用性在于它能够重复执行一组指令。这涉及到程序的某部分重复执行指定的次数，或者直到满足特定条件。这种重复操作是通过循环控制结构完成的。三种方法如下：\n\
  \n### 1. while 循环结构\n\n语法：\n```c\nwhile(condition){\n    statements;\n}\n```\n在这里，只要给定的\
  \ `condition` 为真，所有的块语句都将执行。一旦条件变为假，控制权就会退出 `while` 结构。如有必要，我们还可以使用嵌套的 `while` 循环。\n\
  \n例如：\n```c\nx=0;\nwhile(x<5){\n    printf(“This is an example”);\n    printf(“of\
  \ while loop structure!”);\n    x++;\n}\n```\n\n### 2. do-while 循环结构\n\n语法：\n```c\n\
  do{\n    statements;\n}\n```\n`while` 循环和 `do while` 循环的工作方式存在细微的区别。这种区别在于测试条件的位置。`while`\
  \ 在执行循环内的任何语句之前测试给定的条件，而 `do while` 在至少执行一次循环内的语句后才测试给定的条件。在这里，即使给定的条件为假，所有的块语句也会至少执行一次。如有必要，我们还可以使用嵌套的\
  \ `do while` 循环。\n\n例如：\n```c\nz=5;\ndo{\n    printf(“This is an example”);\n  \
  \  printf(“of do-while loop structure!”);\n    z++;\n}\n```\n\n### 3. for 循环结构\n\
  \n语法：\n```c\nfor(initialize;condition;increment/decrement){\n    statements;\n}\n\
  ```\n`for` 循环有三个部分：\n\n1.  **初始化部分**，我们可以在这里初始化任何变量，如 `a=0` 或 `b=5` 等。\n2.  **条件部分**，在这里测试给定的条件是真还是假。只要给定的条件保持为真，循环内的所有语句都将执行。\n\
  3.  **递/减部分**，我们可以在这里增加或减少所选变量的值。\n\n例如：\n```c\nfor(j=0;j<10;j++){\n    printf(“This\
  \ is an example”);\n    printf(“of for loop structure”);\n}\n```\n\n### 示例\n\n###\
  \ do while 循环和 100 个 Hello Worlds\n```c\n#include<stdio.h>\nmain(){\n    int count;\n\
  \    count=0;\n    do{\n        ++count;\n        printf(\"Hello World!\");\n  \
  \  }(count<100);\n```\n\n### for 循环\n```c\n#include<stdio.h>\nmain(){\n    int fahr;\n\
  \    for(fahr=0;fahr<100;fahr++){\n        printf(\"Hello World!\\n\");\n    }\n\
  }\n```\n\n### 使用 while 循环\n```c\n#include<stdio.h>\nmain(){\n    int fahr, step;\n\
  \    fahr=0;\n    while(fahr<100){\n        printf(\"Hello World!\\n\");\n     \
  \   fahr++;\n    }\n}\n```\n\n### switch 语句\n```c\n#include<stdio.h>\nmain(){\n\
  \    int i;\n    printf(“Enter a number between 1 and 4”);\n    scanf(\"%d\", &i);\n\
  \    switch(i){\n        case 1: printf(“One”);break;\n        case 2: printf(“Two”);break;\n\
  \        case 3: printf(“three”);break;\n        case 4: printf(“Four”);break;\n\
  \        default: printf(“Unrecognized number”);\n    }\n}\n```\n\n### if-else 块\n\
  ```c\n#include<stdio.h>\nmain(){\n    int num1, num2;\n    printf(\"Enter first\
  \ number:”);\n    scanf(\"%d\", &num1);\n    printf(\"Enter second number”);\n \
  \   scanf(\"%d\", &num2);\n    if(num2==0)\n        printf(\"\\nCannot divide by\
  \ zero\\n\");\n    else\n        printf(\"\\nAnswer is %d\\n\", num1/num2);\n}\n\
  ```\n\n### continue 语句\n```c\n#include<stdio.h>\nmain(){\n    int x;\n    for (x=0;\
  \ x<=100; x++){\n        if (x%2) continue;\n        printf(\"%d\\n\", x);\n   \
  \ }\n}\n```\n\n### 使用 break 跳出无限循环\n```c\n#include<stdio.h>\nmain(){\n    int t;\n\
  \    for ( ; ){\n        scanf(\"%d\", &t);\n        if(t==10) break;\n    }\n \
  \   printf(\"End of infinite loop.\\n\");\n}\n```\n\n## 函数\n\n函数是一个执行某些连贯任务的自包含语句块。每个\
  \ C 程序都可以被看作是函数的集合。C 程序可以包含任意数量的函数，因为没有上限，但它必须至少有一个函数，即 `main()` 函数。\n\n### 声明函数\n\
  声明：名称与其类型关联的点。\n定义：也是一种声明，但在此时为命名对象保留了存储空间。使声明变为定义的规则可能很，但对于函数来说很简单。你通过提供复合语句形式的函数体将函数声明转换为定义。\n\
  \n### 形式参数\n函数内部用于引用参数的名称。\n\n### 实参\n在实际调用函数时作为参数的值。也就是说，形式参数在进入函数时所拥的值。\n\n\n\n\
  \n\n### 1. 无参数且无返回值\n在此类型的函数中，没有形式参数且函数不返回任何值。例如：\n```c\nmain(){void test(void);test();}void\
  \ test(void){printf(“this is an example of no argument no return”)}\n```\n\n###\
  \ 2. 无参数有返回值\n```c\n#include<stdio.h>\nmain(){\n    int test(void);\n    int max;\n\
  \    max=test();\n    printf(“The maximum of the two is : %d”, max);\n}\nint test(void){\n\
  \    int x, y;\n    printf(“Enter 1 st no.:”);\n    scanf(“%d”, &x);\n    printf(“Enter\
  \ 2 nd no.:”);\n    scanf(“%d”, &y);\n    return(x>y?x:y);\n}\n```\n\n### 3. 有参数有返回值\n\
  ```c\n#include<stdio.h>\nmain(){\n    int test(int, int);\n    int x, y, max;\n\
  \    printf(“Enter 1 st no.:”);\n    scanf(“%d”, &x);\n    printf(“Enter 2 nd no.:”);\n\
  \    scanf(“%d”, &y);\n    max=test(x,y);\n    printf(“The maximum of the two is\
  \ %d”, max);\n}\nint test(int a, int b){\n    return(a>b?a:b);\n}\n```\n\n### 4.\
  \ 有参数无返回值\n```c\n#include<stdio.h>\nmain(){\n    void test (int, int);\n    int\
  \ x, y;\n    printf(“Enter 1 st no.:”);\n    scanf(“%d”, &x);\n    printf(“Enter\
  \ 2 nd no.:”);\n    scanf(“%d”, &y);\n    test(x,y);\n}\nvoid test(int a, int b){\n\
  \    int max;\n    max=a>b?a:b;\n    printf(“The maximum of the two is: %d”, max);\n\
  }\n```\n\n### 调用函数\n当函数名后紧跟分号时，函数就会被调用。我们可以通过两种方式调用函数。\n\n### 1. 值传递调用\n当我们调用函数并向其传递内容时，我们始终是将变量的“值”传递给被调用函数。这种函数调用被称为“值传递”。即使在“被调用”函数中进行了任何修改，也不会影响实际参数。\n\
  ```c\n#include<stdio.h>\nmain(){\n    void swap(int, int);\n    int a=10, b=20;\n\
  \    swapv(a, b);\n    printf(“\\n a=%d b=%d”, a, b);\n}\nvoid swapv(int x, int\
  \ y){\n    int t;\n    t=x;\n    x=y;\n    y=t;\n    printf(“\\n x=%d y=%d”, x,\
  \ y);\n}\n```\n注意：即使交换了 `x` 和 `y` 的值，`a` 和 `b` 的值仍然保持不变。\n\n### 2. 引用传递调用\n通常在 C\
  \ 语言中，我们使用值传递。这意味着通常我们无法修改实际参数的值。但是，如果需要，可以通过引用传递调用来实现。在这种方法中，调用函数的实际参数的地址被复制到被调用函数的形式参数中。在这里，我们发送的是变量的地址而不是变量的值，如果被调用函数内部进行了任何修改，它也会影响调用函数内部的实际参数。\n\
  ```c\n#include<stdio.h>\nmain(){\n    void swapr(int *, int *);\n    int a=10, b=20;\n\
  \    swapr(&a, &b);\n    printf(“\\n a=%d b=%d”, a, b);\n}\nvoid swapr(int *x, int\
  \ *y){\n    int t;\n    t=*x;\n    *x=*y;\n    *y=t;\n}\n```\n注意：在这个程序中，我们利用存储在\
  \ `x` 和 `y` 中的地址交换了 `a` 和 `b` 的值。通过智能地使用“引用传递”方法，我们可以让函数一次性返回多个值，这在“值传递”的情况下是不可能的。\n\
  \n\n\n\n\n```c\nmain() {\n    void areaperi(int, float *, float *);\n    int radius;\n\
  \    float area, perimeter;\n    printf(\"Enter radius of a circle:);\n    scanf(\"\
  %d\", &radius);\n    areaperi(radius, &area, &perimeter);\n    printf(\"Area=%f\"\
  , area);\n    printf(\"\\nPerimeter=%f\", perimeter);\n}\n\nvoid areaperi(int r,\
  \ float *a, float *p) {\n    *a = 3.14 * r * r;\n    *p = 2 * 3.14 * r;\n}\n```\n\
  \n在这里我们正在进行混合调用，意思是指：我们传递了 `radius` 的值，但传递了 `area` 和 `perimeter` 的地址。由于我们传递的是地址，因此对变量\
  \ `a` 和 `p` 所包含的地址中存储的值进行的任何更改都会在 `main()` 中生效。这就是为什么当控制权从函数 `areaperi()` 返回时，我们能够输出\
  \ `area` 和 `perimeter` 的值。\n\n因此，我们能够从被调用的函数返回两个值，从而克服了 `return` 语句一次只能从被调用函数返回一个值的限制。\n\
  \n### 递归\n\n在 C 语言中，函数可以在其定义内部调用自己，这被称为递归。如果函数体内的语句调用了函数本身，则该函数被称为“递归”函数。这里有一个计算给定整数阶乘值的递归函数示例。\n\
  \n```c\n#include<stdio.h>\nmain() {\n    int rec(int);\n    int n, fact;\n    printf(\"\
  Enter an integer to find its factorial value:\");\n    scanf(\"%d\", &fact);\n \
  \   fact = rec(n);\n    printf(\"Factorial value=%d\", fact)\n}\n\nint rec(int x)\
  \ {\n    int f;\n    if (x == 1)\n        return (1);\n    else\n        f = x *\
  \ rec(x - 1);\n    return (f);\n}\n```\n\n### 数组\n\n数组是内存中的数据序列，其中所有数据都是相同类型，并且放置在物理相邻的位置上。因此，数组是赋予相同类型和数量数据组的统称。\n\
  \n### 数组声明：\n\n语法：\n```\n<data type><array name>[no. of elements];\n```\n例如 `int\
  \ arr[10];`\n\n### 访问数组元素\n\n一旦声明了数组，我们就可以通过下标（subscript）来引用单个元素。数组名后面括号中的数字被称为“下标”。这个数字指定了元素在数组中的位置。\n\
  \n### 向数组输入数据\n\n通常我们使用 `for` 循环将数据输入到数组的元素中。注意，在使用数组之前，必须说明它的类型和大小。\n\n### 数组初始化\n\
  ```c\nint num[6] = {2, 4, 12, 5, 45, 6};\n```\n\n### 将数组元素传递给函数\n\n可以通过按值或按引用调用函数将数组元素传递给函数。以下是“按值调用”方法的示例。\n\
  \n```c\n#include<stdio.h>\nmain() {\n    void display(int);\n    int i;\n    int\
  \ a[] = {35, 45, 55, 65, 75};\n    for (i = 0; i < 5; i++)\n        display(a[i]);\n\
  }\n\nvoid display(int m) {\n    printf(\"%d\", m);\n}\n```\n\n### 将整个数组传递给函数\n\n\
  ```c\n#include<stdio.h>\nmain() {\n    void display(int *);\n    int a[] = {35,\
  \ 45, 55, 65, 75};\n    display(&a[0]);\n}\n\nvoid display(int *m) {\n    int i;\n\
  \    for (i = 0; i < 5; i++)\n        printf(\"%d\", *m)\n}\n```\n\n### 命名和声明数组\n\
  \n为数组命名的规则与变量名相同。数组名必须是唯一的。它不能被用于另一个数组，或用于任何其他标识符（变量、常量等）。正如你可能已经意识到的，数组声明的形式与非数组变量的声明相同，区别是数组元素的数量必须放在紧跟数组名后的方括号中。当你声明数组时，可以使用字面量常量或使用通过\
  \ `#define` 指令创建的符号常量来指定元素数量。因此，如下：\n\n```\n#define MONTHS 12\nint array[MONTHS];\n\
  ```\n\n这等同于语句：\n```c\nint array[12];\n```\n然而，在大多数编译器中，你不能使用用 `const` 关键字创建的符号常量来声明数组元素。\n\
  ```c\nconst int MONTHS=12;\nint array[MONTHS]; /*wrong*/\n```\n\n### 单维数组\n\n单维数组只有一个下标。下标是跟在数组名后面的括号中的数字。这个数字可以标识数组中单个元素的数量。一个示例应该能变得清晰。对于业务费用程序，你可以使用以下行声明一个\
  \ float 类型的数组：\n```c\nfloat expenses[12];\n```\n数组命名为 `expenses`，它包含 12 个元素。12 个元素中的每一个都等同于一个单独\
  \ float 变量。C 的所有数据类型都可以用于数组。C 数组元素从 0 开始编号，因此 `expenses` 的 12 个元素编号为 0 到 11。在前面的示例中，一月的费用总计将存储在\
  \ `expenses[0]`，二月存储在 `expenses[1]`，以此此类推。\n\n\n\n\n\n| 元素类型 | 元素大小（字节） |\n| :---\
  \ | :--- |\n| Int | 2 或 4 |\n| Short | 2 |\n| Long | 4 |\n| Float | 4 |\n| Double\
  \ | 8 |\n\n## 指针\n`Pointer` 是一种特殊的变量，它只包含其他类型变量的内存地址。它也可以存储指针变量的内存地址。\n\n### 声明语法\n\
  `<data type> *<variable name>;`\n在这里 `*` 是一个运算符，被称为“取值”运算符。它也被称为“间接”运算符。该运算符用于访问和操作指针所指向的内存位置中包含的数据。它用作指针变量或指针表达式的前缀。\n\
  \n另一个指针运算符是“取地址”运算符 (`&`)。使用该运算符，我们可以获取变量的内存地址。\n\n```c\n#include<stdio.h>\nmain(){\n\
  \    int i=5;\n    int *j; /*这里我们正在声明指针变量*/\n    j=&i; /*将 i 的内存地址赋值给 j*/\n    printf(“\\\
  n Address of i=%u”, &i);\n    printf(“\\n Address of j=%u”, &j);\n    printf(“\\\
  n Value of j=%u”, j);\n    printf(“\\n Value of i=%u”, i);\n    printf(“\\n Value\
  \ of i=%u”, * j);\n}\n```\n\n### 初始化指针\n现在你已经声明了一个指针，你对它能做什么呢？在让它指向某些东西之前，你无法对其做任何事情。就像普通变量一样，未初始化的指针可以使用，但结果是不可预测的且可能是灾难性的。在指针持有变量的地址之前，它是没用的。地址不会通过魔法存储在指针中，你的程序必须使用取地址运算符符号\
  \ `&` 将其存放在那里。当放在变量名之前时，取地址运算符返回该变量的地址。\n\n因此，你使用形式如 `pointer=&variable ;` 的语句来初始化指针。初始化变量\
  \ `p_rate` 指向变量 `rate` 的程序语句将 `p_rate=&rate;` /*将 rate 的地址赋值给 p_rate*/。\n\n在初始化之前，`p_rate`\
  \ 没有指向任何特定内容。初始化之后，`p_rate` 是指向 `rate` 的指针。\n\n### 使用指针\n现在你已经知道如何声明和初始化指针，你可能在想如何使用它们。间接运算符\
  \ (`*`) 再次发挥作用。当 `*` 出现在指针名之前时，它指的是所指向的变量。\n\n让我们继续上一个例子，其中指针 `p_rate` 已经初始化为指向变量\
  \ `rate`。如果你写 `*p_rate`，它指的是变量 `rate`。如果你想打印 `rate` 的值，你可以写 `Printf(“%d”, rate);`\n\
  或者写这个 `Printf(“%d”, *p_rate);`\n\n在 C 语言中，这两个语句是等价的。通过变量名访问变量的内容被称为“直接访问”。使用指向变量的指针访问变量的内容被称为“间接访问”或“间接引用”。\n\
  \n如果你有一个名为 `ptr` 的指针，它已初始化为指向变量 `var`，那么以下情况成立：\n* `ptr` 和 `var` 都引用 `var` 的内容（即程序在其中存储的任何值）。\n\
  * `Ptr` 和 `&var` 指向 `var` 的地址。\n\n```c\n#include<stdio.h>\n/*声明并初始化一个 int 变量*/\n\
  /*声明一个指向 int 的指针*/\nint *ptr;\nmain(){\n    /*初始化 ptr 指向 var*/\n    ptr=&var;\n\
  \    /*直接和间接访问 var*/\n    printf(“\\nDirect access, var=%d”, var);\n    printf(“\\\
  n Indirect access, var=%d”, *ptr);\n    /*两种方式显示 var 的地址*/\n    printf(“\\n\\nThe\
  \ address of var=%d”, &var);\n    printf(“nThe address of var=%d”, ptr);\n    return\
  \ 0;\n}\n```\n\n## 指针与变量类型\n对于常见的 PC 操作系统，`int` 占用两个字节，`float` 占用四个字节，以此此类推。内存的每个单独字节都有自己的地址，因此多字节变量实际上占据了几个地址。\n\
  \n那么，指针是如何处理多字节变量的地址的？工作原理如下：变量的地址实际上是它所占用的第一个（最低）字节的地址。可以通过一个声明并初始化三个变量的示例来说说明。\n\
  \n```c\nint vint = 12252;\nchar vchar = 90;\nfloat vfloat = 1200.156004;\n```\n\n\
  这些变量存储在内存中，`int` 变量占用两个字节，`char` 变量占用一个字节，`float` 变量占用四个字节。\n\n现在，让我们声明并初始化指向这三个变量的指针。\n\
  ```c\nint *p_vint;\nchar *p_vchar;\nfloat *p_vfloat;\np_vint=&vint;\np_vchar=&vchar;\n\
  p_vfloat=&vfloat;\n```\n每个指针等于所指向变量第一个字节的地址。因此，`p_vint` 等于 1000，`p_vchar` 等于 1003，`p_vfloat`\
  \ 等于 1006。但记住，每个指针都声明为指向特定类型的变量。编译器知道指向 `int` 类型的指针指向两个字节中的第一个，指向 `float` 类型的指针指向四个字节中的第一个，以此此类推。\n\
  \n这是为了视觉上的清晰。在实际操作中，C 编译器将这三个变量存储在相邻的内存位置，之间没有未使用的字节。\n\n## 二级指针概念\n指针变量的概念可以进一步扩展。正如我们所知，`Pointer`\
  \ 是一个包含另一个变量内存地址的变量。现在，这个变量本身可以是另一个指针。所以，我们现在有了一个包含另一个指针内存地址的指针。\n\n```c\n#include<stdio.h>\n\
  #include<conio.h>\nmain(){\n    int i=5;\n    int *j;\n    int **k;\n    j=&i;\n\
  \    k=&j;\n    printf(“\\n Address of i=%u”, &i);\n    printf(“\\n Address of j=%u”,\
  \ j);\n    printf(“\\n Address of i=%u”, *k);\n    printf(“\\n Address of j=%u”,\
  \ &j);\n    printf(“\\n Address of j=%u”, k);\n    printf(“\\n Value of j=%u”, j);\n\
  \    printf(“\\n Value of k=%u”, k);\n    printf(“\\n Value of i=%d”, i);\n    printf(“\\\
  n Value of i=%d”, *j);\n    printf(“\\n Value of i=%u”, **k);\n}\n```\n\n## 指针算术\n\
  C 语言允许对指针进行算术操作。用户负责确保通过执行指针算术获得的是相关且有效的地址。用于指针的算术运算符可以分类为：\n1. 一元运算符：`++`(自增）和\
  \ `--`(自减）\n2. 二元运算符：`+`(加法）和 `–`(减法）\n\nC 编译器在对指针执行算术操作时会考虑到指向的数据类型的大小。例如，如果对整数指针使用\
  \ `++` 运算符递增，指针包含的地址将增加两个字节。同样，对于浮点变量，它将增加四个字节。\n\n## 指针的\n1. 指针的使用增强了操作数据的能力\n\
  2. 访问数组元素\n3. 向函数传递参数\n4. 创建链表、树等结构\n5. 为程序动态分配内存\n\n## 指针与数组\n可以高效访问数组元素。应该注意指针与数组之间的以下事实：\n\
  1. 数组元素始终存储在连续的内存位置中，无论数据大小。\n2. 指针变量所引的数据类型的大小取决于指针所指向的数据类型。\n3. 指针在递增时，总是指向跳过数据类型所需字节数之后位置。\n\
  \n\n\n\n\n```c\n#include<stdio.h>\n#include<conio.h>\nmain(){\n    int a[20], d,\
  \ I;\n    int *ptr;\n    clrscr();\n    printf(\"enter dimension: \");\n    scanf(\"\
  %d\", &d);\n    printf(\"\\nEnter %d values:\", d);\n    for (I=0; I<d;I++)\n  \
  \      scanf(\"%d\", &a[I]);\n    ptr=a;\n    printf(\"\\nElements of array a:\\\
  n\");\n    for(I=0;I<d;I++){\n        printf(\"%d\\t\", *ptr);\n        ptr++;\n\
  \    }\n    getch();\n}\n```\n\n## 指针与多维数组\n\n“使用数值数组”涵盖了指针与数组之间的特殊关系。具体来说，数组名在不带后续括号的情况下，是一个是一个指向数组第一个元素的指针。因此，当你在访问某些类型的数组时，使用指针表示法更加容易。然而，之前的示例仅限于一维数组。那么多维数组呢？\n\
  \n记住，多维数组的每个维度都使用一组括号进行声明。例如，以下语句声明了一个包含八个 `int` 类型变量的二维数组：\n\n```c\nint multi[2][4];\n\
  ```\n\n你可以将数组可视化为具有行和列结构——在这种情况下，为两行四列。然而，还有另一种可视化多维数组的方法，这种方式更接近 C 语言实际处理数组的方式。你可以将\
  \ `multi` 视为一个包含两个元素的数组，其中这两个元素每一个都是一个包含四个整数的数组。\n\n以下是该声明各部分的解释方法：\n\n1. 声明一个名为\
  \ `multi` 的数组。\n2. 数组 `multi` 包含两个元素。\n3. 这两个元素中的每一个都包含四个元素。\n4. 这四个元素中的每一个都是 `int`\
  \ 类型。\n\n与一维数组一样，多维数组名是指向第一个数组元素的指针。继续我们的示例，`multi` 是指向声明为 `int multi[2][4]` 的二维数组的第一个元素的指针。`multi`\
  \ 的第一个元素究竟是什么？它并不是你可能想的 `int` 类型变量 `multi[0][0]`。记住，`multi` 是一个数组的数组，所以它的第一个元素是\
  \ `multi[0]`，这是一个包含四个 `int` 类型变量的数组（`multi` 中包含的两个此类数组之一）。\n\n现在，如果 `multi[0]` 也是一个数组，它指向任何东西吗？是的，确实！`multi[0]`\
  \ 指向它的第一个元素 `multi[0][0]`。你可能会奇怪为什么 `multi[0]` 是一个指针。记住，数组名在不带括号的情况下是指向第一个数组元素的指针。术语\
  \ `multi[0]` 是数组 `multi[0][0]` 的名称，只是缺少了最后一对括号，因此它符合指针的定义。\n\n如果你在此处感到有些困惑，不要担心。这些内容很难理解。如果你能记住任何适用于代码中使用的任何\
  \ $n$ 维数组的以下规则，可能会有所帮助：\n\n*   数组名后跟 $n$ 对括号（当然，每对括号包含一个适当的索引）求结果为数组数据（即数据存储在指定的数组元素中）。\n\
  *   数组名后跟少于 $n$ 对括号的求结果为指向数组元素的指针。\n\n因此，在示例中，`multi` 的求值为指针，`multi[0]` 的求值为指针，而\
  \ `multi[0][0]` 的求值为数组数据。\n\n现在看看所有这些指针实际上指向什么。在这里，我们声明了一个与我们在示例中使用的相似的二维数组，然后打印关联指针的值。它还打印了第一个数组元素的地址。\n\
  \n### 多维数组与指针之间的关系\n\n```c\n#include<stdio.h>\n#include<conio.h>\nint multi[2][4];\n\
  main(){\n    printf(\"\\nmulti=%u\", multi);\n    printf(\"\\nmulti[0]=%u\", multi[0]);\n\
  \    printf(\"\\&multi[0][0]=%u\\n\", &multi[0][0]);\n    return 0;\n}\n```\n\n\
  ### 使用指针的简单示例\n\n```c\n#include<stdio.h>\n#include<conio.h>\nmain(){\n    float\
  \ a=10;\n    float *points_to_a=&a;\n    printf(\"The value in a:%f\\n\", a);\n\
  \    printf(\"The value pointed to by points_to_a:%f\\n\", *points_to_a);\n    printf(\"\
  The value of points_to_a in hex:%x\\n\", points_to_a);\n    printf(\"The value of\
  \ points_to_a as an integer:%d\\n\", points_to_a);\n    printf(\"The value of points_to_a\
  \ as a float:%f\\n\", points_to_a);\n    *points_to_a=-10;\n    printf(\"The value\
  \ pointed to by points_to_a:%f\\n\", *points_to_a);\n    printf(\"The value of points_to_a\
  \ in hex:%x\\n\", points_to_a);\n    printf(\"The value of points_to_a as an integer:%d\\\
  n\", points_to_a);\n    printf(\"The value of points_to_a as a float:%f\\n\", points_to_a);\n\
  \    exit(0);\n}\n```\n\n注意，指针如果被当作 float 打印是完全无意义的；作为整数打印，或者以十六进制打印，的是它所指向的内容。即使你改变了它指向的内容，它也没有改变。当你改变了\
  \ `a` 的值，它改变了。\n\n### 指针操作\n\n| 操作 |  |\n| :--- | :--- |\n| 赋值 | 你可以给指针赋值。该值应该是通过地址运算符或数组名获取的地址。\
  \ |\n| 间接 | 间接运算符 `*` 给出指向的位置的值。 |\n| 地址 | 你可以使用地址运算符 `&` 获取指针的地址，以便你可以拥有指针的指针。\
  \ |\n| 递增 | 你可以增加指针的整数以指向不同的内存位置。 |\n| 递减 | 你可以从指针减去一个整数以指向不同的内存位置。 |\n| 偏移 | 你可以从指针减去一个整数以指向不同的内存位置。\
  \ |\n| 比较 | 仅适用于指向同一个数组的指针。 |\n\n## 字符串\n\n正如一组整数可以存储在整数数组中一样，一组字符也可以存储在字符数组中。这些字符数组经常被称为“字符串”。\n\
  \n字符串常量是一个由“NULL”字符（\\0`）终止的一维字符数组。例如，`char name[] = {‘P’,'I’,'O’,'N’,'E’,'E’,'R’,'\\\
  0’};`；数组中的每个字符占用一个字节内存，最后一个字符总是 NULL (\\0) 字符。尽管它看起来是两个相邻字符，但实际上只有一个字符。`\\` 表示其后面的是特殊字符。注意\
  \ `\\0` 和 `0` 相同。`\\0` 的 ASCII 值为零，而 `0` 的 ASCII 值为 48。下图显示了字符数组在内存中的存储方式。\n\n|\
  \ 字符-> | P | I | O | N | E | E | R | \\0 |\n| :--- | :--- | :--- | :--- | :--- |\
  \ :--- | :--- | :--- | :--- |\n| 内存地址-> | 3000 | 3001 | 3002 | 3003 | 3004 | 3005\
  \ | 3006 | |\n\n\n\n\n注意，字符数组的元素存储在连续的内存位置中。终止符 `NULL` 字符至关重要。因为这是处理字符串的函数判断字符串结束位置的唯一方法。事实上，一个没有以\
  \ `\\0`（NULL）字符结尾的字符串并不是真正的字符串，而仅仅是字符的集合。\n\nC 语言承认我们将频繁地使用字符串，因此为初始化字符串提供了一个快捷方法。例如，上面使用的字符串也可以被初始化为：`char\
  \ name[] = “PIONEER”;`；请注意，这里不需要显式声明 `\\0` 字符；声明本身会自动插入 `NULL` 字符。\n\n### 关于字符串的更多信息\n\
  \n这里是一个演示如何打印字符串的 C 程序：\n\n```c\nmain(){\n    char name[] = “pioneer”;\n    int\
  \ i = 0;\n    while (i<7)\n        printf(“%c”, name[i]);\n        i++;\n}\n```\n\
  输出结果为：`pioneer`\n\n在这里，我们初始化了一个字符数组，然后使用 `while` 循环打印了该数组的元素。我们也可以用不同的方式来实现，例如：\n\
  \n```c\nmain(){\n    char name[] = “pioneerıştır\n    int i=0;\n    while(name[i]!=”\\\
  0”){\n        printf(“%c”, name[i]);\n        i++;\n    }\n}\n```\n输出与之前相同。这个程序不依赖于字符串中字符的数量；而是检查数组元素的内容并相应地进行指向。因此，这个程序比之前的那个更通用。\n\
  \n格式说明符 `\"%s` 用于 `printf()` 函数来打印字符串。相同的格式说明符也用于 `scanf()` 函数来从键盘接收字符串。例如：\n\n\
  ```c\nmain(){\n    char name[30];\n    printf(“Enter your name:”);\n    scanf(“%s”,\
  \ name);\n    printf(“Hello %s”, name);\n}\n```\n上述程序的示例输出为：\n`Enter your name:\
  \ KumarJanglu`\n`Hello KumarJanglu`\n\n注意，在此处的声明 `char name[30]` 在数组 `name` 下预留了\
  \ 30 个字节的空间，而 `scanf()` 函数会将键盘上输入的字符填充到数组中，直到按下“回车”（Enter）或 Return 键。一旦按下回车或 Return\
  \ 键，`scanf()` 会立即在键盘输入的字符之后向数组插入一个 `\\0`（NULL）字符。在使用 `scanf()` 输入字符串时，我们必须注意两点：\n\
  \n1. 字符串长度不应超过字符数组的维度。这是因为 C 编译器不会对字符数组进行边界检查。所以，如果超过了边界，始终有覆盖内存中重要内容的风险。\n\n2.\
  \ 通常，`scanf()` 函数无法接收多个单词的字符串。因此，像“Kumar Janglu”这样的字符串是不可接受的。解决这一限制的方法是使用不同的方式调用\
  \ `scanf()` 函数，或者使用 `gets()` 函数。请下文的示例：\n\n\n\n\n\n## main()\n\n```c\nmain(){\n\
  \    char name[30];\n    puts(“enter your name:”);\n    gets(name);\n    puts(“Hello”);\n\
  \    puts(name);\n}\n```\n在这里，`puts()` 函数是 `gets()` 的对应函数。`puts()` 每次只能显示一个字符串并将光标置于下一行。为了理解指针和字符串之间的基本关系，让我们来看下面的程序。\n\
  \n```c\nmain(){\n    char arr[] = “pioneer”;\n    char *ptr;\n    ptr = arr;\n \
  \   while(*ptr!='\\0’){\n        printf(“%c”, *ptr);\n        ptr++;\n    }\n}\n\
  ```\n在这里，通过提到数组名称，我们获得了数组的基地址，并将该地址存储在指针变量 `ptr` 中。一旦在 `ptr` 中获取了基地址，`*ptr` 就会给出该地址的值，并据此打印。然后，`ptr`\
  \ 递增以指向字符串中的下一个字符。这个过程将一直进行，直到 `ptr` 不指向 ‘\\0’（NULL）字符为止。\n\n假设我们想要存储“pioneer”。我们可以选择将其存储在字符串中，也可以要求\
  \ C 编译器将其存储在内存的某个位置，并将地址分配给 `char` 类型指针。例如：`char str[] = “pioneer”;`；`char *ptr\
  \ = “pioneer”;`。这这形式在用法上存在基本区别。我们不能将一个字符串赋值给另一个，但可以将一个 `char` 指针赋值给另一个 `char` 指针。看下面的示例。\n\
  \n```c\nmain(){\n    char str1[] = “pioneer”\n    char str2[10];\n    char *ptr1\
  \ = “Kumar Janglu”;\n    char *ptr2;\n    str2=str1; /*error*/\n    ptr2=ptr1; /*works\
  \ fine*/\n}\n```\n此外，一旦字符串被定义，它就不能被初始化为另一组字符，但这种操作对于 `char` 类型指针来说是完全有效的。\n\n```c\n\
  main(){\n    char str[] = “Kumarjanglu”;\n    char *ptr = “Kumar Janglu”;\n    str\
  \ = “hello”; /*error*/\n    prt = “Manoj Meher”; /*works fine*/\n}\n```\n\n## 标准库字符串函数\n\
  \n每个 C 编译器都提供了大量的实用字符串处理库函数。其中，我们将讨论一些最常用的函数及其用途。请注意，要使用这些库函数，我们需要包含头文件 `string.h`。\n\
  \n### strlen()\n\n此函数计算字符串中字符的个数，不包括 NULL 字符。该函数的用法在下面的程序所示。\n\n```c\nmain(){\n\
  \    int len1, len2, len3;\n    char arr1[] = “Kumar Janglu”;\n    char arr2[30];\n\
  \    len1 = strlen(arr1);\n    puts(“enter your name:”);\n    gets(arr2);\n    len2\
  \ = strlen(arr2);\n    len3 = stelen(“Smart Value”);\n    printf(“\\n String1 =\
  \ %s length = %d”, arr1, len1);\n    printf(“\\n String1 = %s length = %d”, arr2,\
  \ len2);\n    printf(“\\n String1 = %s length = %d”, “Smart Value”, len3);\n}\n\
  ```\n注意，在第一次和第二次调用函数 `strlen()` 时，我们传递的是字符串的基地址，随后函数返回字符串的长度。在计算长度时，函数不计算 NULL 字符。即使在第三次调用中，传递给\
  \ `strlen()` 的也是字符串的地址而不是字符串本身。\n\n在这里，我们将编写并使用函数 `lenstr()`，它的作用与库函数 `strlen()`\
  \ 相同。\n\n```c\nmain(){\n    int lenstr(char *);\n    int len1, len2, len3;\n   \
  \ char arr1[] = “Hello World!”;\n    char arr2[30];\n    len1 = lenstr(arr1);\n\
  \    puts(“Enter your name:”);\n    gets(arr2);\n    len2 = lenstr(arr2);\n    len3\
  \ = lenstr(“Smart Value”);\n    printf(“\\n String1 = %s length = %d”, arr1, len1);\n\
  \    printf(“\\n String1 = %s length = %d”, arr2, len2);\n    printf(“\\n String1\
  \ = %s length = %d”, “Kumar Janglu”, len3);\n}\nint lenstr(char *str){\n    int\
  \ length = 0;\n    while(*str!='’\\0’){\n        length++;\n        str++;\n   \
  \ }\n    return(length);\n}\n```\n在上面的示例中，我们简单地用创建的 `lenstr()` 函数替换了库函数 `strlen()`。\n\
  \n### Strcpy()\n\n此函数将一个字符串的内容复制到另一个。需要向此函数提供源字符串和目标字符串的基地址。该函数的用法在下面的程序所示。\n\n\
  ```c\nmain(){\n    char source1[] = “Kumar Janglu”;\n    char target1[20], target2[30],\
  \ source2[30];\n    strcpy(target1, source1);\n    puts(“Enter your name:”);\n \
  \   gets(source2);\n    strcpy(target2, source2);\n    printf(“\\n Source String1\
  \ = %s”, source1);\n    printf(“\\n Target String1 = %s”, target1);\n    printf(“\\\
  n Source String2 = %s”, source2);\n    printf(“\\n Target String2 = %s”, target2);\n\
  }\n```\n在提供基地址后，`strcpy()` 将继续将源字符串的字符复制到目标字符串中，直到遇到源字符串的 ‘\\0’（NULL）字符。注意，目标的维度应大于源字符串。\n\
  \n在这里，我们将编写并使用函数 `cpystr()`，它的作用与库函数 `strcpy()` 相同。\n\n```c\nvoid cpystr(char *,\
  \ char *);\n    char source1[] = “Hello World!”;\n    char target1[20], target2[30],\
  \ source2[30];\n    cpystr(target1, source1);\n    puts(“Enter your name;”);\n \
  \   gets(source2);\n    cpystr(target2, source2);\n    printf(“\\n Source String1\
  \ = %s”, source1);\n    printf(“\\n Target String1 = %s”, target1);\n    printf(“\\\
  n Source String2 = %s”, source2);\n    printf(“\\n Target String2 = %s”, target2);\n\
  }\n```\n\n\n\n\n* 有时，给结构体分配指针是有用的。声明结构体指针基本上与声明普通指针完全相同。\n\n```c\nstruct student\
  \ *student_a;\n```\n\n但我们如何解引用结构体指针及其字段呢？你可以通过两种方法之一来实现，第一种方法是：`printf(“%s\\n”,\
  \ (*student_a).SSN);`\n\n* 要进行解引用，你可以使用中缀运算符：`->`\n\n使用另一种运算符的上述示例：`printf(“%s\\\
  n”, student_a->SSN);`\n\n## 结构体数组\n如果你拥有包含数组的结构体，那么你也可以拥有结构体数组吗？事实上，结构体数组是非常强大的编程工具。你已经见过如何定制结构体定义以适应程序所需的数据。通常，程序需要处理多个数据实例。例如，在一个维护电话列表的程序中，你可以定义一个结构体来存储每个人的名字和号码。\n\
  \n```c\nstruct entry{\n    char fname[10];\n    char iname[12];\n    char phone[8];\n\
  };\n```\n\n然而，电话列表必须包含许多条目，因此单个 `entry` 结构体实例并没有太大用。你需要的是类型为 `entry` 的数组。在定义结构体后，你可以如下所示声明数组：\n\
  \n```c\nstruct entry list[1000];\n```\n\n该语句声明了一个名为 `list` 的数组，包含 1000 个元素。每个元素都是一个\
  \ `entry` 类型的结构体，并与其他数组元素类型一样通过下标来标识。这些结构体中的每一个都有三个元素，每个元素都是一个 `char` 类型的数组。当你声明了结构体数组后，你可以以许多方式操作数据。例如，要将一个数组元素的数据赋值给另一个数组元素，你可以写道：\n\
  \n```c\nlist[1] = list[5];\n```\n\n该语句将 `list[5]` 中对应成员的值赋值给结构体 `list[1]` 的每个成员。你也可以在单个结构成员之间移动数据。语句\
  \ \n\n```c\nstrcpy(list[1].phone, list[5].phone);\n```\n\n`strcpy()` 库函数将一个字符串拷贝到另一个字符串。如果你愿意，也可以在结构成员数组的单个元素之间移动数据：\n\
  \n```c\nlist[5].phone[1] = list[2].phone[3];\n```\n\n该语句将 `list[5]` 手机号码的第二个字符移动到\
  \ `list[2]` 手机号码的第四个位置。\n\n## 文件\n仅仅在屏幕上显示数据通常是不够的。这是因为如果数据范围很大，内存中只能存储有限的数据，屏幕上也只能显示有限的数据。内存在本质上是易失的，一旦程序终止，其内容就会丢失；因此，将数据存储在内存中是不恰当的。如果我们再次需要相同的数据，就有必要以某种方式存储数据，以便以后检索并部分或全部显示。这就是为什么我们学习如何在\
  \ C 中处理文件非常重要。\n\n一组名为 `filename` 或简单称为 `file` 的数据或信息集合。计算机存储的几乎所有信息都必须文件中。有许多类型的文件：数据文件、文本文件、程序文件、目录文件等。不同类型的文件存储不同类型的信息。例如，程序文件存储程序，而文本文件存储文本。\n\
  \n要理解数据如何在存储介质和 C 程序之间流转，请看下图。![](img/rsrc2B0.jpg)\n\n```c\n#include<stdio.h>\n\
  #include<conio.h>\nmain(){\n    FILE *fp, *ft;\n    char ch;\n    clrscr();\n  \
  \  fp = fopen(“first.txt”, “r”);\n    if(fp==0){\n        printf(“Cannot open the\
  \ source file”);\n        exit();\n    }else{\n        ft = fopen(“third.txt”, “w”);\n\
  \        while(1){\n            ch = getc(fp);\n            if(ch==EOF)break;\n\
  \            elseputc(ch, ft);\n            {\n                fclose(fp);\n   \
  \             fclose(ft);\n                ft = fopen(“third.txt”, “r”);\n     \
  \           while((ch=getc(fp))!=EOF)printf(“%c”, ch);\n            }\n        \
  \    getch();\n        }\n    }\n}\n```\n\n### 文件操作\n对文件可以执行不同的操作，例如：\n\n### 打开文件\n\
  创建一个与磁盘文件关联的流的过程称为打开文件。当你打开一个文件时，它变得可读（意味着数据从文件输入到程序）、可写（意味着程序的数据保存到文件中）或两者兼备。当你用完该文件后，必须关闭它。\n\
  \n要打开文件，你使用 `fopen()` 库函数。`fopen()` 的原型位于 `STDIO.H` 中，读取如下：\n\n```c\nFILE *fopen(const\
  \ char *filename, const char *mode);\n```\n\n该原型告诉你 `fopen()` 返回一个类型为 `FILE` 的指针，它是\
  \ `STDIO.H` 中声明的一个结构体。`FILE` 结构体的成员被程序在各种文件访问操作中使用，但你不需要担心它们。然而，对于你想要打开每个文件，你必须声明一个类型为\
  \ `FILE` 的指针。当你调用 `fopen()` 时，该函数创建一个 `FILE` 结构体实例并返回该结构的指针。如果 `fopen()` 失败，将返回\
  \ `NULL`。这种失败可能是由硬件错误或在未格式化的磁盘上打开文件引起的。\n\n参数 `filename` 是要打开的文件名。如前，`filename`\
  \ 可以包含路径规范。`filename` 参数可以是双引号括的字面量字符串或字符串的指针。参数 `mode` 指定打开文件的模式。在此上下文中，`mode`\
  \ 控制文件是二进制格式还是文本格式，以及是读、写还是两者。允许的 `mode` 值列在表中。\n\n### `fopen()` 函数的 mode 值\n\n\
  | Mode | 含义 |\n| :--- | :--- |\n| `R` | 以读模式打开文件。如果文件不存在，`fopen()` 返回 `NULL`。 |\n\
  | `W` | 以写模式打开文件。如果指定的文件不存在，则创建它。如果指定的文件存在，它将被无警告删除，并创建一个新的空文件。 |\n| `A` | 以追加模式打开文件。如果指定的文件不存在，则创建它。如果文件存在，新数据将追加到文件末尾。\
  \ |\n| `R+` | 以读写模式打开文件。如果指定的文件不存在，则创建它。如果文件存在，新数据将从文件开头添加，覆盖现有数据。 |\n| `W+` | 以读写模式打开文件。如果指定的文件不存在，则创建它。如果文件存在，它将被覆盖。\
  \ |\n| `A+` | 以读写追加模式打开文件。如果指定的文件不存在，则创建它。如果文件存在，新数据将追加到文件末尾。 |\n\n\n\n\n默认的文件模式是\
  \ `text`。要以二进制模式打开文件，你需要在模式段末尾添加一个 `b`。因此，模式参数 `a` 将以文本模式打开一个文件用于追加写入，而 `ab` 将以二进制模式打开一个文件用于追加写入。\n\
  \n请记住，如果发生错误，`fopen()` 会返回 `NULL`。可能导致返回值为 `NULL` 的错误情况包括：\n- 使用了无效的文件名。\n- 尝试在未就绪的磁盘上打开文件（例如，驱动器门未关闭或磁盘未格式化）。\n\
  - 尝试在不存在的目录或不存在的磁盘驱动器上打开文件。\n- 尝试在 `r` 模式下打开不存在的文件。\n\n每当你使用 `fopen()` 时，你都需要测试是否发生了错误。目前无法确切判断发生了哪种错误，但你可以向用户显示一条消息并尝试重新打开文件，或者结束程序。大多数\
  \ C 编译器都包含非 ANSI 扩展，允许你获取有关错误性质的信息；有关信息，请参阅你的编译器文档。\n\n### 写入和读取文件数据\n\n使用磁盘文件的程序可以向文件写入数据、从文件读取数据，或这两者的结合。你可以通过三种方式向磁盘文件写入数据：\n\
  \n- **格式化输出**：你可以使用格式化输出将格式化后的数据保存到文件中。你只应该对文本模式的文件使用格式化输出。格式化输出的主要用途是创建包含文本和数值数据的文件，供电子表格或数据库等其他程序读取。你很少（如果用的话）使用格式化输出来创建一个供\
  \ C 程序再次读取的文件。\n- **字符输出**：你可以使用字符输出将单个字符或字符行保存到文件中。虽然在技术上对二进制模式的文件使用字符输出是可能的，但这可能会很麻烦。你应该将字符模式输出限制为文本文件。字符输出的主要用途是将文本（但不是数值）数据保存为可\
  \ C 程序以及文字处理器等其他程序读取的格式。\n- **直接输出**：你可以使用直接输出将一段内存的内容直接保存到磁盘文件中。这种方法仅适用于二进制文件。直接输出是保存数据以供\
  \ C 程序稍后使用的最佳方法。\n\n当你想要从文件中读取数据时，你有同样的三个选择：格式化输出、字符输入或直接输入。你在特定情况下使用的输入类型几乎完全取决于所读文件的性质。通常，你会以保存数据时相同的模式读取数据，但这不是强制要求的。然而，以不同于写入时的模式读取文件需要对\
  \ C 和文件格式有深入的了解。\n\n之前对三种类型文件输入输出的描述暗示了最适合每种输出类型的任务。这绝不是一套严格的规则。C 语言非常灵活（这是它的优势之一！），所以一个聪明的程序员可以使任何类型的文件输出适应几乎任何需求。作为一名初级程序员，如果至少在最初遵循这些指南，可能会让事情变得更容易。\n\
  \n### 删除文件\n\n要删除文件，你使用库函数 `remove()`。它的原型定义在 `stdio.H` 中，如下：\n\n```c\nint remove\
  \ (const char *filename);\n```\n\n变量 `*filename` 是一个指向要删除的文件名的指针。所指定的文件不能处于打开状态。如果文件存在，它就会被删除（就像你在\
  \ DOS 提示符中使用 `DEL` 命令或在 UNIX 中使用 `rm` 命令一样），并且 `remove()` 返回 `0`。如果文件不存在、它是只读的、你没有足够的访问权限，或者发生了其他错误，`remove()`\
  \ 返回 `-1`。\n\n### 关闭和刷新文件\n\n当你完成对文件的使用后，应该使用 `fclose()` 函数关闭它。你在程序中看到过 `fclose()`。它的原型是：\n\
  \n```c\nint fclose(FILE *fp);\n```\n\n参数 `fp` 是与该流关联的 `FILE` 指针：`fclose()` 成功时返回\
  \ `0`，失败时返回 `-1`。当你关闭一个文件时，文件的缓冲区会被刷新（写入文件）。你也可以使用 `fcloseall()` 函数关闭除标准流（`stdin`、`stdout`、`stderr`\
  \ 和 `stdout`）以外的所有打开流。它的原型是：\n\n```c\nint fcloseall(void);\n```\n\n此函数还会刷新任何流缓冲区并返回关闭的流的数量。当程序终止时（无论是通过到达\
  \ `main()` 的结尾还是执行 `exit()` 函数），所有流都会自动刷新并关闭。然而，在完成流的操作后立即显式地关闭它们——特别是那些与磁盘文件关联的流——是一个好习惯。\n\
  \n原因与流缓冲区有关。当你创建一个与磁盘文件关联的流时，会自动创建一个缓冲区并与流关联。缓冲区是用于临时存储写入文件和从文件中读取数据的内存块。需要缓冲区是因为磁盘驱动器是块定向的设备，这意味着当数据以特定大小的块进行读写时，效率最高。理想块的大小取决于所使用的特定硬件。它通常在几百到一千字节之间。然而，你不需要担心精确的块大小。\n\
  \n与文件关联的缓冲区充当了流（面向字符）和磁盘（面向块）之间的接口。当你的程序向流写入数据时，数据会保存在缓冲区中，直到缓冲区填满后再写入磁盘。从文件读取数据时也有类似的过程。\n\
  \n\n\n\n### 3. 从源文件中读取一个字符\n记住，当文件被首次打开时，指针位于文件的开头，因此不需要显式地定位文件指针。\n\n4. 如果函数 `feof()`\
  \ 表明你已到达源文件的末尾，则操作完成，可以关闭两个文件并返回调用程序。\n\n5. 如果尚未到达文件末尾，则将该字符写入目标文件，然后循环回第某步。\n\n\
  ### 重命名文件\n`rename()` 函数更改现有磁盘文件的名称。该函数在 `STDIO.H` 中的原型定义如下：\n\n```c\nint rename(const\
  \ char *oldname, const char *newname);\n```\n\n`oldname` 和 `newname` 指向文件名。唯一的限制是这两个名称必须指向同一个磁盘驱动器；你不能将文件重命名到不同的磁盘驱动器。`rename()`\
  \ 函数在成功时返回 `0`，在发生错误时返回 `-1`。错误可能由以下条件引起（还包括其他条件）：\n\n- 文件 `oldname` 不存在。\n- 已经存在一个名为\
  \ `newname` 的文件。\n- 你尝试重命名到另一个磁盘。\n\n\n\n\n```cpp\n#include<stdio.h>\n#include<conio.h>\n\
  main(){\n    FILE *fp, *ft;\n    char ch;\n    clrscr();\n    fp = fopen(“first.txt”,\
  \ “r”);\n    if(fp==0){\n        printf(“cannot open the source file”);\n      \
  \  exit();\n    }else{\n        ft = fopen(“third.txt”, “w”);\n        while(1){\n\
  \            ch = getc(fp);\n            if(ch==EOF)break;\n            elseputc(ch,\
  \ ft);\n        {\n            fclose(fp);\n            fp = fopen(“second.txt”,\
  \ “r”);\n            if(fp==0){\n                printf(“cannot open the source\
  \ file”);\n                exit();\n            }else{\n                while(1){\n\
  \                    ch = getc(fp);\n                    if(ch==EOF)break;\n   \
  \                 elseputc(ch, ft);\n                }\n                fclose(fp);\n\
  \                fclose(ft);\n                ft = fopen(“third.txt”, “r”);\n  \
  \              while((ch=getc(fp))!=EOF)printf(“%c”, ch);\n            }\n     \
  \   getch();\n    }\n}\n```\n\n### 文件操作\n\n这些函数原型定义在 `<stdio.h>` 中，程序必须 `#include<stdio.h>`。值\
  \ `EOF`（表示文件结束）定义在 `<stdio.h>` 中。它的值通常为 `-1`，但不应依赖于此值。\n\n数据类型 `FILE` 是在 `<stdio.h>`\
  \ 中定义的结构体类型。流是指向 `FILE` 的指针，由一个缓冲区和一个文件组成。当运行包含 `<stdio.h>` 的程序时，流 `stdin`、`stdout`\
  \ 和 `stderr`会自动打开。除非重定向，否则 `stdin` 连接到键盘，`stdout` 和 `stderr` 连接到屏幕。当程序执行结束时，所有打开的流都会自动关闭。\n\
  \n`FILE *fopen (const char *filename, const char *mode);`\n此函数打开文件 `filename`。模式\
  \ `mode` 可以是用于读取的`“r”、用于写入的`“w”、或用于追加的`“a”。它返回一个流，如果无法打开文件则返回 `NULL`。\n\n`Int fflush(FILE\
  \ *stream);`\n冲刷输出流会导致缓冲区中任何未写入的数据写入。在输入流上，其效果是未定义的（但通常会清空缓冲区）。返回值通常为 `zero`，如果是写入错误则返回\
  \ `EOF`。\n\n`int fclose(FILE *stream);`\n此函数关闭 `stream`。对于输出流，会先写入任何缓冲数据。对于输入流，任何未读的数据将被丢弃。它通常返回\
  \ `zero`，如果出错则返回 `EOF`。\n\n`Int remove(const char *filename);`\n此函数删除文件 `filename`。它通常返回\
  \ `zero`，出错时返回非零值。\n\n`Int rename(const char *oldname, const char *newname);`\n\
  此函数将文件 `oldname` 重命名为 `newname`。它通常返回 `zero`，出错时返回非零。\n\n`Int fprintf(FILE *stream,\
  \ const char *format, ….);`\n它的作用与 `printf` 完全相同，但数据被写入 `stream` 而不是 `stdout`。它通常返回写入的字符数，如果出错则返回负值。\n\
  \n`Int fscanf(FILE *stream, const char *format, …);`\n它的作用与 `scanf` 完全相同，但数据是从 `stream`\
  \ 而不是 `stdin` 读取的。它通常返回转换并赋值的输入项数，出错时返回 `EOF`。\n\n`Int fgetc(FILE *stream);`\n它通常返回从\
  \ `stream` 读取的下一个字符（作为 `int`），如果出错则返回 `EOF`。（将字符转换为 `int` 是因为 `EOF` 通常是 `-1`，而无符号\
  \ `char` 的范围通常是 `0` 到 `255`，因此不能用它返回 `EOF`。）\n\n`Char *fgets(char *s, int n, FILE\
  \ *stream);`\n它向数组 `s` 中读取最多 `n-1` 个字符。如果发现换行符`‘\\n’` 则停止。换行包含在数组内。数组由空字符`‘\\0’`终止。它返回\
  \ `s`（指向字符的指针），出错时返回 `NULL`。\n\n`Int fputc(int c, FILE *stream);`\n将字符 `c`（转换为无符号\
  \ `char`）写入 `stream`。它通常返回 `c`，出错时返回 `EOF`。\n\n`Int fputs(const char *s, FILE *stream);`\n\
  将字符串 `s` 写入 `stream`。（注意：与 `puts` 不同，`fputs` 不会在 `s` 的末尾添加换行符`‘\\n’。）它通常返回一个非负值，出错时返回\
  \ `EOF`。\n\n`Void rewind(FILE *stream);`\n将 `stream` 回到文件开头。它没有返回值。\n\n`Int feof(FILE\
  \ *stream);`\n它通常返回 `zero`，如果到达 `stream` 的文件结束标记，则返回非零。\n\n## 数据结构\n\n让我们来介绍数据结构。\n\
  \n### 栈\n栈是一种列表，所有的插入和删除操作都在一端进行，该端称为 `top`。最后插入栈的元素将最先被移除。因此，栈有时被称为后进先出（Last In\
  \ First Out, LIFO）结构。\n\n### 栈接口\n以下操作可以用于栈：\n- `InitStack(Stack)`：创建一个空栈\n- `Push(Item)`：向栈压入一个元素\n\
  - `Pop(Stack)`：从栈弹出一个元素\n- `Top(Stack)`：返回栈顶元素但不移除它\n- `isEmpty(Stack)`：如果栈为空则为真\n\
  \n### 栈的实现\n从示例可以看出，使用列表实现栈只需要在栈顶进行 push 和 pop 操作。此外，push 有两个参数：要压入的值和栈本身。它有一个返回值，即修改后的栈。我们可以写\
  \ `push x`。所以 `push` 的类型为：\n`push x = stk`\n操作非常简单。\n\n```cpp\n#include<stdio.h>\n\
  #include<iostream.h>\n#define maxN 20\nvoid push(int x, int a[], int& top){\n  \
  \  a[top]=x;\n    ++top;\n}\nint pop(int a[], int& top){\n    --top;\n    return\
  \ a[top];\n}\nvoid main(){\n    char c, op;\n    int x;\n    int stk1[maxN], top1=0;\n\
  }\n```\n\n### 使用数组实现的栈\n```cpp\nint StackArray[50];\nint top=-1;\nvoid push(int\
  \ elem){\n    top++;\n    StackArray[top] = elem;\n}\nint pop(){\n    int elem =\
  \ StackArray[top];\n    top--;\n    return elem;\n}\n```\n\n### 队列\n队列是项的有序集合，可以从一端（称为队列头部）删除项，并在另一端（队列尾部）插入项。\n\
  \n### 队列接口\n以下操作可以用于队列：\n- `InitQueue(Queue)`：创建一个空队列\n- `Join(Item)`：向队列尾部插入一个项\n\
  - `Leave(Queue)`：从队列头部移除一个项\n- `isEmpty(Queue)`：如果队列为空则为真\n\n### 队列的实现\n从队列中删除元素是一项昂贵的操作，因为所有剩余元素都要移动位置。如果认为数组是环形的，就可以获得更高效的实现。\n\
  \n### 队列队列\n初始情况下，队列是空的，即 `front == rear`。如果我们向队列添加元素，我们：\n\n1. 检查队列是否未满\n2. 将元素存储在\
  \ `rear` 指向的位置\n3. 将 `rear` 增加 1，必要时回绕（在这种情况下它始终指向队列中的最后一项）\n\n\n\n\n\n### 队列的应用\n\
  \n### 添加一个元素\n```cpp\nif(rear == QSIZE-1)\n    rear=0;\nelse\n    rear = rear +1;\n\
  ```\n向队列中添加一个元素。\n\n在多任务操作系统中，CPU 时间在多个进程之间共享。在给定时刻，只有一个进程在运行，所有其他进程都处于“睡眠”状态。CPU\
  \ 时间由调度器管理。调度器将所有当前进程维护在一个队列中，并将活动进程放在队列头部。![](img/rsrc2NW.jpg)\n\n### 树\n树是元素或结点的有限集合。如果该集合非空，则其中一个节点被标识为根节点，而剩余的（可能为空的）节点集合被分组为若干子集，每个子集本身也是一棵树。这种层次级关系通过将每个子树称为根节点的子节点来描述，而将根节点称为每个子树的父节点。如果一棵树只包含一个节点，则该节点被称为叶子节点。\n\
  ![](img/rsrc2P2.jpg)\n\n### 简单树\n允许空树是为了逻辑上的方便。这通常是为了使用图片来表示树，如图所示，其中根节点为 `A`，有三个以\
  \ `B`、`C` 和 `D` 为根的子树。子树 `D` 的根是一个叶子节点，其余节点 `E`、`F`、`G`、`H` 和 `I` 也是。节点 `C` 有一个孩子\
  \ `I`，而 `E`、`F`、`G` 和 `H` 都有相同的父节点 `B`。给定节点的子树是有序的，因此图中的树与节点 `E` 和 `F` 交换后的树不同。因此，说\
  \ `A` 的第一个子树有 4 个叶子节点是有意义的。\n\n### 示例\n如何使用列表实现抽象数据类型树。\n**解法**：我们用 `[A B C]` 表示包含三个元素的列表，并将\
  \ `A` 与 `[A]` 区分开。我们可以将树表示为一个根节点和一个按顺序排列的子树列表列表。因此，树的列表表示法为 `[A [ [B [[E] [F] [G]\
  \ [H]]] [C [I]] [D]]]`\n注意，例如我们将 `[D]` 与 `[D []]` 混淆了，为了严格准确，我们应该写成 `[D []]`，因为\
  \ `D` 的子树集为空。为了说明列表表示有多常见，当我输入上述内容时，我的一个朋友正很快地匹配括号；换句话说，当我输入最后一个 `]` 时，光标移动到 `A`\
  \ 之前的 `[` 处以显示平衡括号。\n\n### 遍历\n通常，一个包含树中所有结点的单个列表非常方便。这个列表可能对应于搜索树时应该访问结点的顺序。我们在这里定义了三种这样的列表，即树的前序遍历、后序和中序遍历。这些定义本身是递归的：\n\
  \n- 如果 `T` 是空树，则空列表为与 `T` 关联的前序、中序和后序遍历；\n- 如果 `T = [N]` 包含单个节点，则列表 `[N]` 为与 `T`\
  \ 关联的前序、中序和后序遍历；\n- 否则，`T` 包含一个根节点 `n` 以及子树 `T1`、`T2`、……、`Tn`；且\n    - `T` 结点的前序遍历是包含\
  \ `N` 的列表，随后按顺序是 `T1`、`T2`、……、`Tn` 的前序遍历。\n    - `T` 结点的中序遍历是包含 `T1` 中序遍历的列表，随后是\
  \ `N`，再按顺序是每个 `T2`、……、`Tn` 的中序遍历。\n    - `T` 结点的后序遍历是按顺序包含每个 `T1`、……、`Tn` 的后序遍历的列表，最后是\
  \ `N`。\n\n### 二叉树\n二叉树是一种空为空的树，或者是每个节点都满足以下一条件的树：\n\n- 没有孩子；或\n- 只有一个左孩子；或\n- 只有一个右孩子；或\n\
  - 同时具有左右孩子。\n\n\n\n\n\n### 引言\n我们已经看到过二叉树的示例，它们在最优排序的讨论中被考虑过，也被用于说明最优合并的过程。它们都是二叉树，尽管在每种情况下都没有出现节点只有一个孩子的情况。请注意，这与有序树有所不同，因为对于二叉树，我们区分了只有一个左子节点的节点和只有一个右子节点的节点。另一种更“干净”的定义是首先引入终结节点（或“空”节点）的概念，它没有子节点，然后将二叉树定义为除空节点外，每个节点都恰好有两个子节点的树。\n\
  \n完全二叉树是二叉树的一种特殊情况，其中除了最后一层外，所有层都是满的；而在最后一层，任何缺失的节点都位于所有存在节点的右侧。如图所示![](img/rsrc2RD.jpg)\n\
  \n### 示例\n给出一个基于数组 `A` 的完全二叉树的空间高效实现方法。描述如何从父节点找到它的两个子节点，反之亦然。\n\n### 解法\n一个显而易见的方法是不浪费空间，它将树的根存储在\
  \ `A[1]` 中；两个子节点存储在 `A[2]` 和 `A[3]` 中，下一代存储在 `A[4]` 到 `A[7]`，依此类推。元素 `A[k]` 的孩子位于\
  \ `A[2k]` 和 `A[2k+1]`（前提是它们都存在），而节点 `A[k]` 的父节点位于 `A[k/ 2]`。因此，可以非常高效地遍历树。\n\n###\
  \ 链表\n链表是存储数据的一种更好的方式。链表是一种特殊的 `struct`，它包含一个指向相同类型结构体的指针。例如，让我们通过添加一个名为 `next`\
  \ 的新指针将我们的 `studentInfo` 结构体转换为链表。该指针将指向列表中的下一个元素。\n\n```c\nstruct studentInfo{\n\
  \    char name[32];\n    char teacher[32];\n    int age;\n    studentInfo * next;\n\
  }\n```\n\n记住 `*` 表示指针，所以每个 `studentInfo` 现在都有一个指向另一个 `studentInfo` 的指针。如果这个指针被设置为\
  \ `0` 或 `NULL`，那么我们一定处于列表末尾。这时，我们只需要保留一个指向列表中第一个结构体的指针即可：\n\n```c\nstudentInfo *\
  \ student_list;\n```\n\n该结构体将有一个指向下一个结构体的指针，下一个又有一个指向后续的指针，依此类推。\n\n### 遍历整个列表\n\
  记得 `printStudent` 函数吗？它接收一个 `studentInfo` 并打印出所有信息。现在，让我们用它创建一个新函数 `printAllStudents`，它会打印列表中每个学生的信息。\n\
  \n```c\nvoid printAllStudents (void){\n    /*这是一个指向列表中当前项的指针 */\n    struct studentInfo\
  \ * current = student_list;\n    if (current!=0){\n        /*如果列表不为空……*/\n     \
  \   /*从列表顶部开始，一直到末尾，当 current==0 时*/\n        while(current!=0){\n            printStudent(current);\n\
  \            current = current->next;\n        }\n    }else{\n        printf(“Error:\
  \ no students have been entered yet\\n”);\n    }\n}\n```\n\n### 向列表添加数据\n现在让我们来看名为\
  \ `addStudent` 的函数。它允许用户输入新学生的数据。这个新学生被添加到列表的顶部。它的 `next` 指针指向列表旧的顶部。\n\n```c\n\
  void addStudent(void){\n    printf(“creating a new student…\\n”);\n    studentInfo\
  \ *temp = (struct studentInfo*) malloc(sizeof(struct studentInfo));\n    printf(“Enter\
  \ student name”);\n    gets(temp->name);\n    printf(“Enter the student’s teacher”);\n\
  \    gets(temp->teacher);\n    printf(“Enter the student’s age”);\n    char buffer[18];\n\
  \    gets(buffer);\n    temp->age = atoi(buffer);\n    printf(“Adding student %s\
  \ to the list…”, temp->name);\n    /*next 指针指向列表旧的顶部*/\n    temp->next = student_list;\n\
  \    /*列表顶部现在指向 temp*/\n    student_list = temp;\n    printf(“Done\\n”);\n}\n```\n\
  \n### 搜索列表\n要搜索列表，我们从顶部开始顺着 `next` 指针移动直到直到我们要找的数据。如果在找到数据之前到达了列表末尾，则说明搜索失败——数据在列表中不存在。这是一个名为\
  \ `getStudentInfo` 的示例。它要求用户输入一个名字，并在列表中搜索该学生。然后它打印出关于该学生的所有信息。\n\n```c\nvoid getStudentInfo(void){\n\
  \    printf(“Enter the name of the student:”);\n    char search[32];\n    int found\
  \ = 0;\n    gets(search);\n    printf(“searching the list…”);\n    /*从列表顶部开始*/\n\
  \    struct studentInfo*current = student_list;\n    /*当我们不在列表末尾，且还没有找到数据时*/\n \
  \   while((current!=0) && !found){\n        /*如果当前项的名字与我们正在找的名字匹配……*/\n        if(!strcmp(current->name,\
  \ search)){\n            found = 1; \n            /*那么我们完成了*/\n        }else{\n\
  \            current = current->next; \n            /*否则我们尝试列表中的下一个项*/\n       \
  \ }\n    }\n    printf(“Done\\n”);\n    if(current!=0) \n    /*如果我们找到了一个学生……*/\n\
  \    {\n        printStudent(current); \n        /*……就打印信息*/\n    }else{\n     \
  \   printf(“No student by that name exists in the database.\\n”);\n    }\n}\n```\n\
