    # 程序结构


    * 顺序

    * 选择

    * 重复


    顺序结构表示，在没有中间控制结构的情况下，控制流通常会从一条指令顺序传递到下一条。选择结构表示从几个选项中进行决策。也就是说，程序可能会根据决策跳转到多个位置中的一个。重复结构（或循环结构）则在一组指令需要重复执行多次时出现。它避免了重复编写相同一组语句的麻烦。


    ## 一个好程序的标准


    以下是用来判断一个程序是否优良的一些问题：


    * 它解决了在规格说明中提出的问题吗？

    * 它在所有条件下都能正常工作吗？

    * 它是否有完善的文档说明？

    * 它是使用模块化方法编写的？

    * 它是否高效利用了计算机的时间和内存？


    如果在程序设计的每个阶段都投入了足够的思考和努力，这些标准就可以自动满足。


    ## 程序流程图


    程序流程图是完成某任务所需的逻辑的图化表示。它包含了程序的所有必要步骤。它之所以被称为流程图，是因为它绘制了程序的流向。它是每个输入、输出和处理步骤的符号化表示。除了是记录算法的一种良好方法外，它也是程序文档的一部分，有助于理解、调试和维护程序。


    在流程图绘制技术，通过为操作绘制适当的符号来表示操作。传统的程序流程图绘制使用简单的几何符号来表示程序的开始或结束、过程、决策或输入-输出过程。这些流程图符号通过箭头连接，以说明操作的顺序。


    一种使用符号显示操作、活动或程序的逐步顺序的图形化表示法。用于计算机系统分析、活动分析以及一般的程序序列表示。


    以下表示最常用的符号及其通用接受的含义：![](img/rsrc5C.jpg)


    这是一个关于“玩什么”的流程图示例。![](img/rsrc5H.jpg)


    示例：计算阶乘 `N` (`N!`) 的流程图。(rsrc5R.jpg)

    寻找三个数中最大值的流程图。![](img/rsrc5W.jpg)


    ## 算法


    算法是完成你想要做的工作所需的逐步指令。算法中的每条指令被称为 `STEP`，而在 C 语言中我们称之为 `STATEMENT`。现在，我们将看看算法看起来是什么样的。要描述算法，你不需要了解任何计算机的知识，至少目前不需要。你真正需要的是开放的心态和你的母语。让我们来看这一个，假设给你给你两杯装满彩色水，红色和绿色。现在你被要求交换杯中的水。装有红水的杯应该装绿水，另一个杯装红水。思考这个问题，有多种方法可以实现，但其中有一种方法被认为是最好的。


    ```

    Step 1 Glass 1 HAS water Red

    Step 2 Glass 2 HAS water green

    Step 3 Get an EMPTY glass 3

    Step 4 Transfer RED water from glass 1 to EMPTY glass 3

    Step 5 Transfer GREEN water from glass 2 to EMPTY 1

    Step 6 Transfer RED water from Glass 3 to EMPTY glass 2.

    ```


    ## 伪代码


    表示程序逻辑的另一种方法是伪代码（Pseudocode）。伪代码不是使用符号来表示程序逻辑步骤，而是使用连接实际编程和普通英语的语句。在伪代码中，每一步都使用一个简单的英语短语写成，这种短语也被称为构造（construct）。


    伪代码是程序的大纲，以可以轻松转换为任何实际编程语言语句的形式编写。伪代码既不能编译也无法执行，也没有真正的格式或语法规则。它仅仅是生成最终代码过程中一个非常重要的步骤。伪代码的好处是它让程序员能够专注于算法，而不必担心特定编程语言的所有语法细节。事实上，你甚至可以在不知道最终将使用何种编程语言实现的情况下编写伪代码。


    编写伪代码时使用的一些惯例如下：


    1. 循环中的所有语句都应该缩进。

    2. 所有字母数字值都应该包含单引号或双引号中。

    3. 伪代码的开始和结束分别用 `start` 和 `End` 等关键字标记。

    4. 所有语句必须包含表示操作的特定关键字。


    '
- fmt: "\nFor example, the pseudo code for adding two numbers:\n\n```\nACCEPT N1\n\
    ACCEPT N2\nSUM=N1+N2\nDISPLAY SUM\nEND\n```\n\nFor example, the pseudo code for\
    \ bubble sorts:\n```\nWHILE NOT AT END OF LIST\nCOMPARE ADJACENT ELEMENTS\nSIF\
    \ SECOND IS GREATER THAN FIRST\nSWITCH THEM\nGET NEXT TWO ELEMENTS\nSIF ELEMENTS\
    \ WERE SWITCHED\nREPEAT FOR ENTIRE LIST\n```\n\n# About C language\n\nAs a programming\
    \ language, `c` is rather like Pascal or FORTRAN. Values are stored in variables.\
    \ Programs are structured by defining and calling functions. Program flow is controlled\
    \ using loops, if statements and functions. Input and output can be directed to\
    \ the terminal or to files. Related data can be stored together in arrays or structures.\
    \ \n\nOf the three languages, `C` allows the most precise control of input and\
    \ output. `C` is also rather terser than FORTRAN or Pascal. This can result in\
    \ short efficient programs, where the programmer has made wise use of `C`’s range\
    \ of powerful operators. It also allows the programmer to produce programs which\
    \ are impossible to understand.\n\nProgrammers who are familiar with the use of\
    \ pointers (or indirect addressing, to use the correct term) will welcome the\
    \ ease of use compared with some other languages. Undisciplined use of pointers\
    \ can lead to errors which are very hard to trace. This course only deals with\
    \ the simplest applications of pointers.\n\nIt is hoped that newcomers will find\
    \ `C` a useful and friendly language. Care must be taken in using `C`. many of\
    \ the extra facilities which it offers can lead to extra types of programming\
    \ error. You will have to learn to deal with these to successfully make the transition\
    \ to being a `C programmer`.\n\n## Brief introduction on origin\n\n`C` is a middle\
    \ level and case sensitive general purpose programming language, which has been\
    \ closely associated with the `UNIX` operating system for which it was developed\
    \ – since the system and most of the program that run it are written in `C`.\n\
    \nMany of the important ideas of `C` came from the language `BCPL`, developed\
    \ by Martin Richards. The influence of `BCPL` on `C` proceeded indirectly through\
    \ the language `B`, which was written by Ken Thompson in 1970 at Bell Labs, for\
    \ the first `UNIX` system on a DEC PDP-7\\. `BCPL` and `B` are “type less” languages\
    \ whereas `C` provides a variety of data types. In 1972 Dennis Ritchie at Bell\
    \ Labs writes `C` and in 1978 the publication of “The C programming language”\
    \ by Brian Kernighan & Dennis Ritchie caused a revolution in the computing world.\n\
    \nIn 1983, the American National Standards Institute (`ANSI`) established a committee\
    \ to provide a modern, comprehensive definition of `C`. the resulting definition,\
    \ the `ANSI` standard, or “ANSI C”, was completed in 1988.\n\n## C for personal\
    \ computers\n\nWith regards to personal computers, `Microsoft C` for IBM (or clones)\
    \ PC’s, `Borland C` and `Borland’s Turbo C` are seen to be the two most commonly\
    \ used systems. This course teaches `C` under the Microsoft’s Windows and Disk\
    \ operating system.\n\n`C program` will look similar under any other systems (such\
    \ VMS or DOS); some other features will differ from system to system. In particular\
    \ the method of compiling a program to produce a file of runnable code will be\
    \ different on each system. The `UNIX` system is itself written in `C`. in fact\
    \ `C` was invented specifically to implement `UNIX`. All of the `UNIX` commands\
    \ which you type, plus the other system facilitates such as password checking,\
    \ line printer queues or magnetic tape controllers are written in `C`.\n\nIn the\
    \ course of the development of `UNIX`, hundreds of functions were written to give\
    \ access to various facts of the system. These functions are available to the\
    \ programmer in libraries. By writing in `C` and using the `UNIX` system libraries,\
    \ very powerful system programs can be created. These libraries are less easy\
    \ to access using other programming languages. `C` is therefore the natural language\
    \ for writing `UNIX` system program.\n\n## Program development and execution method\n\
    \nTo understand the program development and execution method, first take a look\
    \ at the following flow chart. Developing a program in a compiled language such\
    \ as `C` requires at least four basic steps. The basic principle is that whatever\
    \ `C` compiler you choose to use, the steps are nearly always the same. Here,\
    \ in this tutorial all the programs are written based on `Borland C` compiler.\
    \ The basic steps are:\n\n1. Editing or writing the program\n2. Compiling it\n\
    3. Linking it\n4. Executing it\n"
