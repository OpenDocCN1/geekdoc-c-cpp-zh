    ### 3. 从源文件中读取一个字符

    记住，当文件被首次打开时，指针位于文件的开头，因此不需要显式地定位文件指针。


    4. 如果函数 `feof()` 表明你已到达源文件的末尾，则操作完成，可以关闭两个文件并返回调用程序。


    5. 如果尚未到达文件末尾，则将该字符写入目标文件，然后循环回第某步。


    ### 重命名文件

    `rename()` 函数更改现有磁盘文件的名称。该函数在 `STDIO.H` 中的原型定义如下：


    ```c

    int rename(const char *oldname, const char *newname);

    ```


    `oldname` 和 `newname` 指向文件名。唯一的限制是这两个名称必须指向同一个磁盘驱动器；你不能将文件重命名到不同的磁盘驱动器。`rename()`
    函数在成功时返回 `0`，在发生错误时返回 `-1`。错误可能由以下条件引起（还包括其他条件）：


    - 文件 `oldname` 不存在。

    - 已经存在一个名为 `newname` 的文件。

    - 你尝试重命名到另一个磁盘。

