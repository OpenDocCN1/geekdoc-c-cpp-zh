  trans: "\n\n1. 字符集\n2. 关键字\n3. 数据类型\n4. 变量\n5. 常数\n6. 不同的运算符与表达式\n7. 基础 I/O \n\n\
    ## 字符集\n我们在 C 程序中使用的字符集如下：\n\n| 字母 | `a-z`, `A-Z` |\n| :--- | :--- |\n| 数字 | `0-9`\
    \ |\n| 特殊符号 | `~`!@#$%^&*()_+{}:”;’<>,./?` |\n\n## 关键字\nC 语言中定义了 32 个单词作为关键字。这些单词具有预定义的用途，且不能用于任何其他用途，例如\
    \ C 程序中变量或常数的命名。它们始终以小写形式。下面是完整的列表，它们与形式语法结合形成了 C 编程语言。\n\n| Auto | Double | Int\
    \ | Struct |\n| :--- | :--- | :--- | :--- |\n| Break | Else | Long | Switch |\n\
    | Case | Enum | Register | Typedef |\n| Char | Extern | Return | Union |\n| Const\
    \ | Float | Short | Unsigned |\n| Continue | For | Signed | Void |\n| Default\
    \ | Goto | Sizeof | Volatile |\n| Do | If | Static | While |\n\n## 数据类型\n任何 C\
    \ 程序都有两个实体需要考虑：数据和程序。它们之间高度依赖，对两者都进行仔细的规划将导致一个规划良好且编写良好的程序。为了处理 C 程序中的数据，我们创建变量来存储其中的值，在\
    \ C 中，在执行程序之前，必须说明我们对要进行任何操作的每个变量的类型。C 语言中的数据类型分为四类，如下所示![](img/rsrcE3.jpg)\n\n\
    | 类型 | 字节 | 范围 | 精度 |\n| :--- | :--- | :--- | :--- |\n| Short int | 2 | -32768\
    \ to +32768 | |\n| Unsigned short int | 2 | 0 to +65535 | |\n| Unsigned int |\
    \ 4 | 0 to +4294967295 | |\n| Int | 4 | -2147483648 to +2147483648 | |\n| Long\
    \ int | 4 | -2147483648 to +2147483648 | |\n| Signed char | 1 | -128 to +127 |\
    \ |\n| Unsigned char | 1 | 0 to +255 | |\n| Float | 4 | +/- 1E-37..1E+37 | 6 位\
    \ |\n| Double | 8 | +/- 1E-37..1E+37 | 10 位 |\n| Long double | 12 | +/- 1E-37..1E+37\
    \ | 10 位 |\n\n注意：这些数字仅适用于当今代的 PC。大型机和中型机可能使用不同的数字，但仍然符合上述规则。\n\n## 变量\n变量只是主内存中一个命名的区域，可以存储单个数值或字符值。在\
    \ C 中，在实际对其进行任何操作之前，必须声明要使用的每个变量名及其类型。\n\n### 变量名的构造规则\n* 变量名可以是数字和字母的组合，长度任意。\n\
    * 变量必须具有特定的数据类型。\n* 变量名的第一个字符必须是字母。\n* 变量名中不允许出现逗号、空格或特殊符号，下划线（`_`）除外。\n* 大和小写字母是不同的。\n\
    * 关键字不能作为变量名。\n\n```c\nint no1; float interest_rate; char choice;\n```\n\n## 常数\n\
    常数是在程序执行过程中不会改变自身的值。在 C 中有三种定义常数的技术。它们是：\n\n1. 使用 `#define`\n2. 使用 `const`\n3.\
    \ 使用枚举\n\n### 使用 #define\n可以使用预处理器指令 `#define` 定义常数。`#define` 指令用法如下：\n```c\n\
    #define BELL '\\a'\n```\n每当常数在你的源文件中出现时，预处理器就会将其替换为它的值。例如，你源代码中的每个 `BELL` 都被替换为\
    \ `\\a`。编译器现在会在你的源代码中看到值 `\\a`，而不是 `BELL`。每个 `BELL` 只是被替换为它的值。这里是一个说明预处理器指令 `#define`\
    \ 的简单程序。\n\n```c\n#include<stdio.h>\n#include<conio.h>\n#define BELL '\\a'\nvoid\
    \ main(){\n    printf(\"Press any key to hear the bell!\");\n    getch();\n  \
    \  printf(\"%c\", BELL);\n}\n```\n\n### 使用 const\n第二种技术是在定义常数变量时使用关键字 `const`。使用时，编译器将捕获修改声明为\
    \ `const` 变量的尝试。\n```c\nconst float PI=3.1428571428571;\n```\n与第一种技术相比有两个主要优点。首先，定义了常数的类型，这里\
    \ `PI` 是一个 `float` 类型常数。这允许编译器进行某些类型检查。其次，常数是具有定义范围的变量。变量的作用域与程序中定义它的部分有关。\n\n\
    ```c\n#include<stdio.h>\nvoid main(){\n    const float PI=3.1428571428571;\n \
    \   float area, perimeter;\n    printf(\"enter radius:\");\n    scanf(\"%f\",\
    \ &radius);\n    area=PI*radius;\n    printf(\"Area=%f and perimeter=%f\", area,\
    \ perimeter);\n}\n```\n\n### 使用枚举\n定义常数的第三种技术称为枚举。enum {\"Sun\",\"Wed\",\"Sat\"\
    }\n\n## 不同的运算符与表达式\n运算符是对某些值的符号。\n\n### 运算符的类型\n1. 算术运算符\n2. 关系运算符\n3. 逻辑运算符\n\
    4. 赋值运算符\n5. 增减运算符\n6. 条件运算符\n7. 位运算符\n8. 逗号运算符\n9. 其他运算符\n\n### 算术运算符\n算术运算符可以分为一元操作和二元操作。以下是算术运算符列表。\n\
    \n| 运算符 | 含义 |\n| :--- | :--- |\n| + | 加 |\n| - | 减 |\n| * |乘 |\n| / | 除 |\n|\
    \ % | 取模 |\n\n注意：C 没有指数运算符。\n\n### 关系运算符\n关系运算符用于比较算术、逻辑和字符表达式。我们经常比较两个数量并根据此做出决定。因此，这些比较在条件假时返回\
    \ 0，真时返回 1。运算符如下：\n\n| 运算符 | 含义 |\n| :--- | :--- |\n| > | 大于 |\n| < | 小于 |\n|\
    \ >= | 大于等于 |\n| <= | 小于等于 |\n| == | 等于 |\n| != | 不等于 |\n\n### 逻辑运算符\n这些运算符用于比较逻辑和关系表达式。运算符如下：\n\
    \n| 运算符 | 含义 |\n| :--- | :--- |\n| && | 逻辑与 |\n| || | 逻辑或 |\n| ! | 逻辑非 |\n\n###\
    \ 赋值运算符\n通常情况下，`=` 符号被称为赋值运算符。该运算符评估右侧的表达式并将结果赋值给左侧的变量。剩余的赋值运算符是复合赋值运算符。它们允许对左右侧相同的赋值进行压缩，所有复合赋值运算符的列表如下：\n\
    \n| *= | /= | %= | += | = |\n| &= | |= | ^= | >>= | <<= |\n\n### 增减运算符\n这些运算符用于增加或减少变量的值。这些如下：\n\
    \n| 运算符 | 含义 |\n| :--- | :--- |\n| ++ | 增加 1 |\n| -- | 减少 1 |\n\n注意：这些运算符表现为两种形式，\n\
    \n1. 后置增或或后置减\n例如 `j++` 意味着赋值 `j` 的值并增加 1；`k--` 意味着赋值 `k` 的值并减少 1。\n\n2. 前置增或前置减\n\
    \n"
- fmt: "\ne.g. `++j` means increase the value by 1 and assign the value; `--k` means\
    \ decrease the value by 1 and assign the value of `k`.\n\n### Conditional operator\n\
    This operator consists of two symbols, question mark (`?`) and colon (`:`). It\
    \ has three parts – the text expression, true part and false part like `text expression\
    \ ? true part : false part`. It assigns either the true part value or the false\
    \ part value to a variable depending on the test expression.\n\n`i=(j>5)?2:3`\n\
    Here if the value of `j` is greater than 5 then `2` will be assigned to `i` otherwise\
    \ `3`.\n\n### Bitwise operator\nThese operators operate on each bit of data. They\
    \ are used for testing, complementing or shifting of bits to right or left. These\
    \ are as follows:\n\n| Operator | Meaning |\n| :--- | :--- |\n| `&` | Bitwise\
    \ AND |\n| `|` | Bitwise OR |\n| `^` | Bitwise XOR |\n| `<<` | Bitwise shift left\
    \ |\n| `>>` | Bitwise shift right |\n| `~` | Bitwise complement |\n\n### Comma\
    \ operator\nThis operator is used to separate a set of variables. The `,` symbol\
    \ is called the comma operator.\n\n### Other operator\nThe `sizeof()` operator\
    \ returns the size of the data types of a variable or the no. of bytes occupied\
    \ by the variable in the memory. Member selection operators (`.` and `->`) are\
    \ used with structures and unions. Pointer operators (`*`), Address of operator\
    \ (`&`), array subscript (`[]`), `(type cast)`, etc. \n\nThe following lists all\
    \ C operators in order of their precedence (highest to lowest). Their associativity\
    \ indicates in what order operators of equal precedence in an expression are applied.\n\
    \n| Operator | Description | Associativity |\n| :--- | :--- | :--- |\n| `()[]\
    \ .->` | Parentheses (expression grouping) Brackets (array subscript) Member selection\
    \ via object name Member selection via pointer | Left-to-right |\n| `++ -- + !\
    \ ~ (type)* & Sizeof` | Unary pre-increment/pre-decrement Unary plus/minus Unary\
    \ logical negation/bitwise complement Unary cast (change type) Deference Address\
    \ Determine size in bytes | Right-to-left |\n| `. / %` | Multiplication/division/modulus\
    \ | Left-to-right |\n| `+ -` | Addition/substation | Left-to-right |\n| `<< >>`\
    \ | Bitwise shift left, bitwise shift right | Left-to-right |\n| `< <=> >=` |\
    \ Relational less than/less than or equal to Relational greater than/greater than\
    \ or equal to | Left-to-right |\n| `== !=` | Relational is equal to/is not equal\
    \ to | Left-to-right |\n| `&` | Bitwise AND | Left-to-right |\n| `^` | Bitwise\
    \ exclusive OR | Left-to-right |\n| `|` | Bitwise inclusive OR | Left-to-right\
    \ |\n| `&&` | Logical AND | Left-to-right |\n| `||` | Logical OR | Left-to-right\
    \ |\n| `? :` | Ternary conditional | Left-to-right |\n| `= += -= *= /=%= &=^=\
    \ |= <<= >>=` | Assignment Addition/subtraction assignment Multiplication/division\
    \ assignment Modulus/bitwise AND assignment Bitwise exclusive/inclusive OR assignment\
    \ Bitwise shift left/right assignment | Left-to-right |\n| `,` | Comma (separate\
    \ expression) | Left-to-right |\n\n### Basic Input and Output statements\nUsually\
    \ I/O, input and output, form an important part of any program. To do anything\
    \ useful your program needs to be able to accept input data and report back your\
    \ results. In C, the standard library provides routines for input and output.\
    \ The standard library has functions for I/O that handles input, output, and character\
    \ and string manipulation. Here, all the input functions described read from standard\
    \ input and all the output functions described write to standard output. Standard\
    \ input is usually the keyboard. Standard is usually the monitor.\n\n#### Formatted\
    \ output\n`printf()`: this is a very versatile function for displaying the output.\
    \ It can handle any basic data type and offers several facilities with which we\
    \ can specify the way in which the data is to be displayed.\n\n```c\nprintf(\"\
    %d\", x);\nprintf(\"%d %d %f\", x, y, z);\n```\n\n`scanf()`: this is a very useful\
    \ function for taking the input from the keyboard. It can handle any basic data\
    \ type and also offers to take multiple values at a time from the keyboard.\n\n\
    ```c\nscanf(\"%d\", &x);\nscanf(\"%d %d %f\", &x, &y, &z);\n```\n\n#### Using\
    \ printf() function in a C program\n```c\n#include<stdio.h>\nmain() {\n    printf(\"\
    this is an example of something printed!\");\n    return 0;\n}\n```\n\n#### Using\
    \ scanf() function in a C program\n```c\n#include<stdio.h>\nmain() {\n    float\
    \ y;\n    int x;\n    puts(\"enter a float, then an int\");\n    scanf(\"%f%d\"\
    , &y, &x);\n    printf(\"\\nYou entered %f and %d\", y, x);\n    return 0;\n}\n\
    ```\n\n#### Another simple program in C using int and printf()\n```c\n#include<stdio.h>\n\
    Main() {\n    int a, b, average;\n    a = 10;\n    b = 6;\n    average = (a+b)/2;\n\
    \    printf(\"Here \");\n    printf(\"is \");\n    printf(\"the \");\n    printf(\"\
    answer….. \");\n    printf(\"\\n \");\n    printf(\"%d \", average);\n}\n```\n\
    \n#### A simple program to Demonstrate scanf() function\n```c\n#include<stdio.h>\n\
    Main() {\n    int a, b, c;\n    printf(\"\\nThe first number is \");\n    scanf(\"\
    %d\", &a);\n    printf(\"\\nThe second number is \");\n    scanf(\"%d\", &b);\n\
    \    c = a+b;\n    printf(\"The answer is %d\\n\", c);\n}\n```\n\n### Control\
    \ structures in C\n### Introduction\nThe control structures determine the order\
    \ in which the various instructions in a C program are to be executed. In other\
    \ words, they determine the flow of control in a C program. The different control\
    \ structures are as follows:\n\n1. Sequential control structure\n2. Conditional\
    \ branching structure\n3. Unconditional branching structure\n4. Loop structure\n\
    \n#### Sequential control structure\nThis type of control structure ensures that\
    \ the instructions are executed in the same order in which they appear in a C\
    \ program.\n\n#### Conditional branching structure\nThis type of control structure\
    \ allows us to take the decision as to which instruction is to be executed. The\
    \ decision-making structures are as follows:\n\n1. If structure\nSyntax: `if (condition){statements}`\n\
    Here, if the given condition is true then the statements are given within the\
    \ brace will be executed. There is no need to write the pair of brace is there\
    \ is only one statement to be executed.\ne.g. `if (i>5)printf(\"The value of i\
    \ is greater than 5\");`\n\n2. If-else structure\nSyntax: `if (condition){statements;}else{statements}`\n\
    The if statement itself executes a single or a group of statements when the given\
    \ condition is true, it does nothing when the condition is false. The purpose\
    \ of the else statement is to execute the set of statements written after it even\
    \ when the condition is false. There is no need to write the pair of brace if\
    \ there is only one statement to be executed.\ne.g. `if(i>5)printf(\"The value\
    \ of i is greater than 5\");elseprintf(\"The value of i is less than or equal\
    \ to 5\");`\n\n3. Nested if structure\nIf we write an entire if or if-else structure\
    \ either within the body of an if statement or the body of a else statement then\
    \ this is called nested if structure.\nSyntax: `if(condition){statements;if(condition)}`\n\
    e.g. `if(j>5)if(j>10){printf(\"The value of i is greater than 5 and\");printf(\"\
    The value of j is greater than 10.\");};`\n\n4. Switch-case structure\n"
