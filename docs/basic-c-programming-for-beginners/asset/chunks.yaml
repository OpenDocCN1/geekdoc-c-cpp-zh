  trans: "\n\n```c\nmain() {\n    void areaperi(int, float *, float *);\n    int radius;\n\
    \    float area, perimeter;\n    printf(\"Enter radius of a circle:);\n    scanf(\"\
    %d\", &radius);\n    areaperi(radius, &area, &perimeter);\n    printf(\"Area=%f\"\
    , area);\n    printf(\"\\nPerimeter=%f\", perimeter);\n}\n\nvoid areaperi(int\
    \ r, float *a, float *p) {\n    *a = 3.14 * r * r;\n    *p = 2 * 3.14 * r;\n}\n\
    ```\n\n在这里我们正在进行混合调用，意思是指：我们传递了 `radius` 的值，但传递了 `area` 和 `perimeter` 的地址。由于我们传递的是地址，因此对变量\
    \ `a` 和 `p` 所包含的地址中存储的值进行的任何更改都会在 `main()` 中生效。这就是为什么当控制权从函数 `areaperi()` 返回时，我们能够输出\
    \ `area` 和 `perimeter` 的值。\n\n因此，我们能够从被调用的函数返回两个值，从而克服了 `return` 语句一次只能从被调用函数返回一个值的限制。\n\
    \n### 递归\n\n在 C 语言中，函数可以在其定义内部调用自己，这被称为递归。如果函数体内的语句调用了函数本身，则该函数被称为“递归”函数。这里有一个计算给定整数阶乘值的递归函数示例。\n\
    \n```c\n#include<stdio.h>\nmain() {\n    int rec(int);\n    int n, fact;\n   \
    \ printf(\"Enter an integer to find its factorial value:\");\n    scanf(\"%d\"\
    , &fact);\n    fact = rec(n);\n    printf(\"Factorial value=%d\", fact)\n}\n\n\
    int rec(int x) {\n    int f;\n    if (x == 1)\n        return (1);\n    else\n\
    \        f = x * rec(x - 1);\n    return (f);\n}\n```\n\n### 数组\n\n数组是内存中的数据序列，其中所有数据都是相同类型，并且放置在物理相邻的位置上。因此，数组是赋予相同类型和数量数据组的统称。\n\
    \n#### 数组声明：\n\n语法：\n```\n<data type><array name>[no. of elements];\n```\n例如 `int\
    \ arr[10];`\n\n#### 访问数组元素\n\n一旦声明了数组，我们就可以通过下标（subscript）来引用单个元素。数组名后面括号中的数字被称为“下标”。这个数字指定了元素在数组中的位置。\n\
    \n#### 向数组输入数据\n\n通常我们使用 `for` 循环将数据输入到数组的元素中。注意，在使用数组之前，必须说明它的类型和大小。\n\n####\
    \ 数组初始化\n```c\nint num[6] = {2, 4, 12, 5, 45, 6};\n```\n\n#### 将数组元素传递给函数\n\n\
    可以通过按值或按引用调用函数将数组元素传递给函数。以下是“按值调用”方法的示例。\n\n```c\n#include<stdio.h>\nmain() {\n\
    \    void display(int);\n    int i;\n    int a[] = {35, 45, 55, 65, 75};\n   \
    \ for (i = 0; i < 5; i++)\n        display(a[i]);\n}\n\nvoid display(int m) {\n\
    \    printf(\"%d\", m);\n}\n```\n\n#### 将整个数组传递给函数\n\n```c\n#include<stdio.h>\n\
    main() {\n    void display(int *);\n    int a[] = {35, 45, 55, 65, 75};\n    display(&a[0]);\n\
    }\n\nvoid display(int *m) {\n    int i;\n    for (i = 0; i < 5; i++)\n       \
    \ printf(\"%d\", *m)\n}\n```\n\n#### 命名和声明数组\n\n为数组命名的规则与变量名相同。数组名必须是唯一的。它不能被用于另一个数组，或用于任何其他标识符（变量、常量等）。正如你可能已经意识到的，数组声明的形式与非数组变量的声明相同，区别是数组元素的数量必须放在紧跟数组名后的方括号中。当你声明数组时，可以使用字面量常量或使用通过\
    \ `#define` 指令创建的符号常量来指定元素数量。因此，如下：\n\n```\n#define MONTHS 12\nint array[MONTHS];\n\
    ```\n\n这等同于语句：\n```c\nint array[12];\n```\n然而，在大多数编译器中，你不能使用用 `const` 关键字创建的符号常量来声明数组元素。\n\
    ```c\nconst int MONTHS=12;\nint array[MONTHS]; /*wrong*/\n```\n\n### 单维数组\n\n\
    单维数组只有一个下标。下标是跟在数组名后面的括号中的数字。这个数字可以标识数组中单个元素的数量。一个示例应该能变得清晰。对于业务费用程序，你可以使用以下行声明一个\
    \ float 类型的数组：\n```c\nfloat expenses[12];\n```\n数组命名为 `expenses`，它包含 12 个元素。12\
    \ 个元素中的每一个都等同于一个单独 float 变量。C 的所有数据类型都可以用于数组。C 数组元素从 0 开始编号，因此 `expenses` 的 12\
    \ 个元素编号为 0 到 11。在前面的示例中，一月的费用总计将存储在 `expenses[0]`，二月存储在 `expenses[1]`，以此此类推。\n\
    \n"
- fmt: "\n| Element data type | Element size (bytes) |\n| :--- | :--- |\n| Int | 2\
    \ or 4 |\n| Short | 2 |\n| Long | 4 |\n| Float | 4 |\n| Double | 8 |\n\n# Pointers\n\
    `Pointer` is a special variable which contains only the memory address of other\
    \ type of variables. It can hold the memory address of a pointer variable also.\n\
    \n### Declaration syntax\n`<data type> *<variable name>;`\nHere `*` is an operator\
    \ which is called “value at address” operator. It is also known as “indirection”\
    \ operator. This operator is used to access and manipulate the data contained\
    \ in the memory location pointed by a pointer. It is used as a prefix of the pointer\
    \ variable or a pointer expression.’’\n\nThe other pointer operator is the “address\
    \ of” operator (`&`). Using this operator we can obtain the memory address of\
    \ a variable.\n\n```c\n#include<stdio.h>\nmain(){\n    int i=5;\n    int *j; /*here\
    \ we are declaring the pointer variable*/\n    j=&i; /*assigning the memory address\
    \ of i into j*/\n    printf(“\\n Address of i=%u”, &i);\n    printf(“\\n Address\
    \ of j=%u”, &j);\n    printf(“\\n Value of j=%u”, j);\n    printf(“\\n Value of\
    \ i=%u”, i);\n    printf(“\\n Value of i=%u”, * j);\n}\n```\n\n### Initializing\
    \ pointers\nNow that you have declared a pointer, what can you do with it? You\
    \ can’t do anything with it until you make it point to something. Like regular\
    \ variables, uninitialized pointers can be used, but the results are unpredictable\
    \ and potentially disastrous. Until a pointer holds the address of a variable,\
    \ it isn’t useful. The address doesn’t get stored in the pointer by magic, your\
    \ program must put it there by using the address-of operator, the ampersand (`&`).\
    \ When placed before the name of a variable, the address-of operator returns the\
    \ address of the variable.\n\nTherefore, you initialize a pointer with a statement\
    \ of the form `pointer=&variable ;` the program statement to initialize the variable\
    \ `p_rate` to point at the variable `rate` would be `p_rate=&rate;` /*assign the\
    \ address of rate to p_rate*/`.\n\nBefore the initialization, `p_rate` didn’t\
    \ point to anything in particular. After the initialization, `p_rate` is a pointer\
    \ to `rate`.\n\n### Using pointers\nNow that you know how to declare and initialize\
    \ pointers, you’re probably wondering how to use them. The indirection operator\
    \ (`*`) comes into play again. When the `*` proceeds the name of a pointer, it\
    \ refers to the variable pointed to.\n\nLet’s continue with the previous example,\
    \ in which the pointer `p_rate` has been initialized to point to the variable\
    \ `rate`. If you write `*p_rate`, it refers to the variable `rate`. If you want\
    \ to print the value of `rate` you could write `Printf(“%d”, rate);`\nOr this\
    \ `Printf(“%d”, *p_rate);`\n\nIn C, these two statements are equivalent. Accessing\
    \ the contents of a variable by using the variable name is called Direct access.\
    \ Accessing the contents of a variable using a pointer to the variable is called\
    \ indirect access or indirection.\n\nIf you have a pointer named `ptr` that has\
    \ been initialized to point to the variable `var`, the following are true:\n*\
    \ `ptr` and `var` both refer to the contents of `var` (that is, whatever values\
    \ the program has stored there).\n* `Ptr` and `&var` refer to the address of `var`.\n\
    \n```c\n#include<stdio.h>\n/*Declare and initialize an int variable*/\n/*Declare\
    \ a pointer to int*/\nint *ptr;\nmain(){\n    /*initialize ptr to pointer to var*/\n\
    \    ptr=&var;\n    /*Access var directly and indirectly*/\n    printf(“\\nDirect\
    \ access, var=%d”, var);\n    printf(“\\n Indirect access, var=%d”, *ptr);\n \
    \   /*Display the address of var two ways*/\n    printf(“\\n\\nThe address of\
    \ var=%d”, &var);\n    printf(“nThe address of var=%d”, ptr);\n    return 0;\n\
    }\n```\n\n# Pointers and variable types\nFor the more common PC operating systems,\
    \ an `int` takes two bytes, a `float` takes four bytes, and so on. Each individual\
    \ byte of memory has its own address, so a multibyte variable actually occupies\
    \ several addresses.\n\nHow, then, do pointers handle the addresses of multibyte\
    \ variables? Here’s how it works: the address of a variable is actually the address\
    \ of the first (lowest) byte it occupies. This can be illustrated with an example\
    \ that declares and initializes three variables.\n\n```c\nint vint = 12252;\n\
    char vchar = 90;\nfloat vfloat = 1200.156004;\n```\n\nThese variables are stored\
    \ in memory, the `int` variable occupies two bytes, the `char` variable occupies\
    \ one byte, and the `float` variable occupies four bytes.\n\nNow, let’s declare\
    \ and initialize pointers to these three variables.\n```c\nint *p_vint;\nchar\
    \ *p_vchar;\nfloat *p_vfloat;\np_vint=&vint;\np_vchar=&vchar;\np_vfloat=&vfloat;\n\
    ```\neach pointer is equal to the address of the first byte of the pointed-to\
    \ variable. Thus, `p_vint` equals to 1000, `p_vchar` equals to 1003, and `p_vfloat`\
    \ equals to 1006\\. Remember, however, that each pointer was declared to point\
    \ to a certain type of variable. The compiler knows that a pointer to type `int`\
    \ points to the first of two bytes, a pointer to type `float` points to the first\
    \ of four bytes, and so on.\n\nThis is for the sake of visual clarity. In actual\
    \ practice, the compiler C stores the three variables in adjacent memory locations\
    \ with no unused bytes between them.\n\n# Pointer to pointer concept\nThe concept\
    \ of pointer variables can be further extended. `Pointer`, as we know is a variable\
    \ that contains the memory address of another variable. Now, this variable itself\
    \ might be another pointer. So, we now have a pointer that contains the memory\
    \ address of another pointer.\n\n```c\n#include<stdio.h>\n#include<conio.h>\n\
    main(){\n    int i=5;\n    int *j;\n    int **k;\n    j=&i;\n    k=&j;\n    printf(“\\\
    n Address of i=%u”, &i);\n    printf(“\\n Address of j=%u”, j);\n    printf(“\\\
    n Address of i=%u”, *k);\n    printf(“\\n Address of j=%u”, &j);\n    printf(“\\\
    n Address of j=%u”, k);\n    printf(“\\n Value of j=%u”, j);\n    printf(“\\n\
    \ Value of k=%u”, k);\n    printf(“\\n Value of i=%d”, i);\n    printf(“\\n Value\
    \ of i=%d”, *j);\n    printf(“\\n Value of i=%u”, **k);\n}\n```\n\n# Pointer arithmetic\n\
    The C language allows arithmetic operations to be performed on pointer variables.\
    \ It is the responsibility of the user to see that the result obtained by performing\
    \ pointer arithmetic is the address of relevant and meaningful data.The arithmetic\
    \ operators available for use with pointers can be classified as:\n1. Unary operators:\
    \ `++`(increment) and `--` (decrement)\n2. Binary operators: `+` (addition) and\
    \ `–` (subtraction)\n\nThe C compiler takes the size of the data type being pointed\
    \ to into account, while performing arithmetic operations on a pointer. For example,\
    \ if a pointer to an integer is incremented using the `++` operator then the address\
    \ contained in the pointer is incremented by two bytes. Similarly, in case of\
    \ a floating variable it will be incremented by four bytes.\n\n# Use of pointers\n\
    1. Pointer usage enhances the capabilities to manipulate data\n2. Accessing array\
    \ elements\n3. Passing arguments to functions\n4. Creating data structures such\
    \ as linked lists, trees, etc.\n5. Allocating memory dynamically for a program\n\
    \n# Pointers and arrays\nThe elements of the array can be efficiently accessed.\
    \ The following facts regarding the relation between pointers and arrays should\
    \ be noted:\n1. Array elements are always stored in contiguous memory locations\
    \ irrespective of the size of the data.\n2. The size of the data type, which the\
    \ pointer variable refers to, is dependent on the data type pointed to by the\
    \ pointer.\n3. A pointer when incremented, always points to a location after skipping\
    \ the number of bytes required for the data types pointed to by it.\n"
