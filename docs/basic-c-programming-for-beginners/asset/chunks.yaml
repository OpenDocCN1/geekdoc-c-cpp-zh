    points to. You can see that it doesn’t change, even though you did change the
    thing it pointed to. Note that the value in a did change when you changed it,
    by changing the thing it pointed to.One of the principle reasons for using the
    address of operator, and pointers, is that C is a call by value language. That
    is, when you pass an argument to a function, C actually makes a copy of the value
    you want to pass. That means that if the function changes the value, it won’t
    affect the true version…..that is, you’re protected against stupid errors in the
    function. But it also means that the function can’t return information by changing
    its arguments. The way around this is to pass a pointer to the thing you want
    to change. It still gives you some protection, because having to pass the address
    of the variable should alert you to the possibility that the function will mess
    around with your memory.Pointer operations


    | Operation | Description |


    | Assignment | You can assign a value to a pointer. The value should be an address,
