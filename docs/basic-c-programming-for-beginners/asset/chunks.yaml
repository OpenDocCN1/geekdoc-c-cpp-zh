  trans: "\n注意，字符数组的元素存储在连续的内存位置中。终止符 `NULL` 字符至关重要。因为这是处理字符串的函数判断字符串结束位置的唯一方法。事实上，一个没有以\
    \ `\\0`（NULL）字符结尾的字符串并不是真正的字符串，而仅仅是字符的集合。\n\nC 语言承认我们将频繁地使用字符串，因此为初始化字符串提供了一个快捷方法。例如，上面使用的字符串也可以被初始化为：`char\
    \ name[] = “PIONEER”;`；请注意，这里不需要显式声明 `\\0` 字符；声明本身会自动插入 `NULL` 字符。\n\n## 关于字符串的更多信息\n\
    \n这里是一个演示如何打印字符串的 C 程序：\n\n```c\nmain(){\n    char name[] = “pioneer”;\n    int\
    \ i = 0;\n    while (i<7)\n        printf(“%c”, name[i]);\n        i++;\n}\n```\n\
    输出结果为：`pioneer`\n\n在这里，我们初始化了一个字符数组，然后使用 `while` 循环打印了该数组的元素。我们也可以用不同的方式来实现，例如：\n\
    \n```c\nmain(){\n    char name[] = “pioneerıştır\n    int i=0;\n    while(name[i]!=”\\\
    0”){\n        printf(“%c”, name[i]);\n        i++;\n    }\n}\n```\n输出与之前相同。这个程序不依赖于字符串中字符的数量；而是检查数组元素的内容并相应地进行指向。因此，这个程序比之前的那个更通用。\n\
    \n格式说明符 `\"%s` 用于 `printf()` 函数来打印字符串。相同的格式说明符也用于 `scanf()` 函数来从键盘接收字符串。例如：\n\n\
    ```c\nmain(){\n    char name[30];\n    printf(“Enter your name:”);\n    scanf(“%s”,\
    \ name);\n    printf(“Hello %s”, name);\n}\n```\n上述程序的示例输出为：\n`Enter your name:\
    \ KumarJanglu`\n`Hello KumarJanglu`\n\n注意，在此处的声明 `char name[30]` 在数组 `name` 下预留了\
    \ 30 个字节的空间，而 `scanf()` 函数会将键盘上输入的字符填充到数组中，直到按下“回车”（Enter）或 Return 键。一旦按下回车或 Return\
    \ 键，`scanf()` 会立即在键盘输入的字符之后向数组插入一个 `\\0`（NULL）字符。在使用 `scanf()` 输入字符串时，我们必须注意两点：\n\
    \n1. 字符串长度不应超过字符数组的维度。这是因为 C 编译器不会对字符数组进行边界检查。所以，如果超过了边界，始终有覆盖内存中重要内容的风险。\n\n\
    2. 通常，`scanf()` 函数无法接收多个单词的字符串。因此，像“Kumar Janglu”这样的字符串是不可接受的。解决这一限制的方法是使用不同的方式调用\
    \ `scanf()` 函数，或者使用 `gets()` 函数。请下文的示例：\n\n"
- fmt: "\n# main()\n\n```c\nmain(){\n    char name[30];\n    puts(“enter your name:”);\n\
    \    gets(name);\n    puts(“Hello”);\n    puts(name);\n}\n```\nHere the `puts()`\
    \ function is the counterpart of `gets()`. `puts()` can display only one string\
    \ at a time and places the cursor on the next line. Pointer and strings to understand\
    \ the basic relation between pointer and string, let’s take a look at the following\
    \ program.\n\n```c\nmain(){\n    char arr[] = “pioneer”;\n    char *ptr;\n   \
    \ ptr = arr;\n    while(*ptr!='\\0’){\n        printf(“%c”, *ptr);\n        ptr++;\n\
    \    }\n}\n```\nHere, by mentioning the name of the array we get the base address\
    \ of the array and that is stored in the pointer variable `ptr`. Once the base\
    \ address is obtained in `ptr`, `*ptr` gives the value at this address, which\
    \ gets printed accordingly. Then, `ptr` is incremented to point to the next character\
    \ in the string. This process is carried out till `ptr` doesn’t point to the ‘\\\
    0’ (NULL) character.\n\nSuppose we want to store “pioneer”. We may either store\
    \ it in string or may ask the C compiler to store it at some location in the memory\
    \ and assigns the address in a `char` type pointer. e.g. `char str[] = “pioneer”;`;\
    \ `char *ptr = “pioneer”;`.\n\nThere is a basic difference in usage of these two\
    \ forms. We cannot assign a string to another, whereas we can assign a `char`\
    \ pointer to a `char` pointer. See the following example.\n\n```c\nmain(){\n \
    \   char str1[] = “pioneer”\n    char str2[10];\n    char *ptr1 = “Kumar Janglu”;\n\
    \    char *ptr2;\n    str2=str1; /*error*/\n    ptr2=ptr1; /*works fine*/\n}\n\
    ```\nAlso, once a string has been defined it cannot be initialized to another\
    \ set of characters, but this operation is perfectly valid with `char` type pointers.\n\
    \n```c\nmain(){\n    char str[] = “Kumarjanglu”;\n    char *ptr = “Kumar Janglu”;\n\
    \    str = “hello”; /*error*/\n    prt = “Manoj Meher”; /*works fine*/\n}\n```\n\
    \n# Standard library string functions\n\nEvery C compiler provides a large number\
    \ of useful string handling library functions with it. Out of those, here we will\
    \ discuss some of the most commonly used functions along with their purpose. Make\
    \ a note that to use this library functions we have to include the header file\
    \ `string.h`.\n\n## strlen()\n\nThis function counts the number of characters\
    \ present in a string excluding the NULL character. Usage of this function is\
    \ illustrated in the following program.\n\n```c\nmain(){\n    int len1, len2,\
    \ len3;\n    char arr1[] = “Kumar Janglu”;\n    char arr2[30];\n    len1 = strlen(arr1);\n\
    \    puts(“enter your name:”);\n    gets(arr2);\n    len2 = strlen(arr2);\n  \
    \  len3 = stelen(“Smart Value”);\n    printf(“\\n String1 = %s length = %d”, arr1,\
    \ len1);\n    printf(“\\n String1 = %s length = %d”, arr2, len2);\n    printf(“\\\
    n String1 = %s length = %d”, “Smart Value”, len3);\n}\n```\nNote that in the first\
    \ and second call to the function `strlen()`, we are passing the base address\
    \ of the string and in turn the function returns the length of the string. While\
    \ calculating the length, the function doesn’t count the NULL character. Even\
    \ in the third call what gets passed to `strlen()` is the address of the string\
    \ and not the string itself.\n\nHere, we will write and use a function `lenstr()`\
    \ which will act same as the library function `strlen()`.\n\n```c\nmain(){\n \
    \   int lenstr(char *);\n    int len1, len2, len3;\n    char arr1[] = “Hello World!”;\n\
    \    char arr2[30];\n    len1 = lenstr(arr1);\n    puts(“Enter your name:”);\n\
    \    gets(arr2);\n    len2 = lenstr(arr2);\n    len3 = lenstr(“Smart Value”);\n\
    \    printf(“\\n String1 = %s length = %d”, arr1, len1);\n    printf(“\\n String1\
    \ = %s length = %d”, arr2, len2);\n    printf(“\\n String1 = %s length = %d”,\
    \ “Kumar Janglu”, len3);\n}\nint lenstr(char *str){\n    int length = 0;\n   \
    \ while(*str!='’\\0’){\n        length++;\n        str++;\n    }\n    return(length);\n\
    }\n```\nIn the above example we simply replaced the `strlen()` library function\
    \ with the `lenstr()` function which we have created.\n\n## Strcpy()\n\nThis function\
    \ copies the contents of one string into another. The base addresses of the source\
    \ and target strings should be supplied to this function. Usage of this function\
    \ is illustrated in the following program.\n\n```c\nmain(){\n    char source1[]\
    \ = “Kumar Janglu”;\n    char target1[20], target2[30], source2[30];\n    strcpy(target1,\
    \ source1);\n    puts(“Enter your name:”);\n    gets(source2);\n    strcpy(target2,\
    \ source2);\n    printf(“\\n Source String1 = %s”, source1);\n    printf(“\\n\
    \ Target String1 = %s”, target1);\n    printf(“\\n Source String2 = %s”, source2);\n\
    \    printf(“\\n Target String2 = %s”, target2);\n}\n```\nOn supplying the base\
    \ addresses, `strcpy()` goes on copying the characters of source string into the\
    \ target string until it encounters the ‘\\0’ (NULL) character of the source string.\
    \ Note that, the dimension of the target should be greater than the source string.\n\
    \nHere, we will write and use a function `cpystr()` which will act the same as\
    \ the library function `strcpy()`.\n\n```c\nvoid cpystr(char *, char *);\n   \
    \ char source1[] = “Hello World!”;\n    char target1[20], target2[30], source2[30];\n\
    \    cpystr(target1, source1);\n    puts(“Enter your name;”);\n    gets(source2);\n\
    \    cpystr(target2, source2);\n    printf(“\\n Source String1 = %s”, source1);\n\
    \    printf(“\\n Target String1 = %s”, target1);\n    printf(“\\n Source String2\
    \ = %s”, source2);\n    printf(“\\n Target String2 = %s”, target2);\n}\n\n```c\n\
    int lenstr(char *str){\n    int length = 0;\n    while(*str!='’\\0’){\n      \
    \  length++;\n        str++;\n    }\n    return(length);\n}\n```\n*(Wait, the\
    \ provided text has some fragmented logic at the end, I will clean the remaining\
    \ parts based on the instructions.)*\n\n[Note: The input text provided at the\
    \ end contained some repetitive and jumbled fragments. I have processed the core\
    \ logic according to the rules above.]\n"
