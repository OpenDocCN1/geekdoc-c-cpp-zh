  trans: "\n\n| 元素类型 | 元素大小（字节） |\n| :--- | :--- |\n| Int | 2 或 4 |\n| Short | 2 |\n\
    | Long | 4 |\n| Float | 4 |\n| Double | 8 |\n\n# 指针\n`Pointer` 是一种特殊的变量，它只包含其他类型变量的内存地址。它也可以存储指针变量的内存地址。\n\
    \n### 声明语法\n`<data type> *<variable name>;`\n在这里 `*` 是一个运算符，被称为“取值”运算符。它也被称为“间接”运算符。该运算符用于访问和操作指针所指向的内存位置中包含的数据。它用作指针变量或指针表达式的前缀。\n\
    \n另一个指针运算符是“取地址”运算符 (`&`)。使用该运算符，我们可以获取变量的内存地址。\n\n```c\n#include<stdio.h>\nmain(){\n\
    \    int i=5;\n    int *j; /*这里我们正在声明指针变量*/\n    j=&i; /*将 i 的内存地址赋值给 j*/\n  \
    \  printf(“\\n Address of i=%u”, &i);\n    printf(“\\n Address of j=%u”, &j);\n\
    \    printf(“\\n Value of j=%u”, j);\n    printf(“\\n Value of i=%u”, i);\n  \
    \  printf(“\\n Value of i=%u”, * j);\n}\n```\n\n### 初始化指针\n现在你已经声明了一个指针，你对它能做什么呢？在让它指向某些东西之前，你无法对其做任何事情。就像普通变量一样，未初始化的指针可以使用，但结果是不可预测的且可能是灾难性的。在指针持有变量的地址之前，它是没用的。地址不会通过魔法存储在指针中，你的程序必须使用取地址运算符符号\
    \ `&` 将其存放在那里。当放在变量名之前时，取地址运算符返回该变量的地址。\n\n因此，你使用形式如 `pointer=&variable ;` 的语句来初始化指针。初始化变量\
    \ `p_rate` 指向变量 `rate` 的程序语句将 `p_rate=&rate;` /*将 rate 的地址赋值给 p_rate*/。\n\n在初始化之前，`p_rate`\
    \ 没有指向任何特定内容。初始化之后，`p_rate` 是指向 `rate` 的指针。\n\n### 使用指针\n现在你已经知道如何声明和初始化指针，你可能在想如何使用它们。间接运算符\
    \ (`*`) 再次发挥作用。当 `*` 出现在指针名之前时，它指的是所指向的变量。\n\n让我们继续上一个例子，其中指针 `p_rate` 已经初始化为指向变量\
    \ `rate`。如果你写 `*p_rate`，它指的是变量 `rate`。如果你想打印 `rate` 的值，你可以写 `Printf(“%d”, rate);`\n\
    或者写这个 `Printf(“%d”, *p_rate);`\n\n在 C 语言中，这两个语句是等价的。通过变量名访问变量的内容被称为“直接访问”。使用指向变量的指针访问变量的内容被称为“间接访问”或“间接引用”。\n\
    \n如果你有一个名为 `ptr` 的指针，它已初始化为指向变量 `var`，那么以下情况成立：\n* `ptr` 和 `var` 都引用 `var` 的内容（即程序在其中存储的任何值）。\n\
    * `Ptr` 和 `&var` 指向 `var` 的地址。\n\n```c\n#include<stdio.h>\n/*声明并初始化一个 int 变量*/\n\
    /*声明一个指向 int 的指针*/\nint *ptr;\nmain(){\n    /*初始化 ptr 指向 var*/\n    ptr=&var;\n\
    \    /*直接和间接访问 var*/\n    printf(“\\nDirect access, var=%d”, var);\n    printf(“\\\
    n Indirect access, var=%d”, *ptr);\n    /*两种方式显示 var 的地址*/\n    printf(“\\n\\\
    nThe address of var=%d”, &var);\n    printf(“nThe address of var=%d”, ptr);\n\
    \    return 0;\n}\n```\n\n# 指针与变量类型\n对于常见的 PC 操作系统，`int` 占用两个字节，`float` 占用四个字节，以此此类推。内存的每个单独字节都有自己的地址，因此多字节变量实际上占据了几个地址。\n\
    \n那么，指针是如何处理多字节变量的地址的？工作原理如下：变量的地址实际上是它所占用的第一个（最低）字节的地址。可以通过一个声明并初始化三个变量的示例来说说明。\n\
    \n```c\nint vint = 12252;\nchar vchar = 90;\nfloat vfloat = 1200.156004;\n```\n\
    \n这些变量存储在内存中，`int` 变量占用两个字节，`char` 变量占用一个字节，`float` 变量占用四个字节。\n\n现在，让我们声明并初始化指向这三个变量的指针。\n\
    ```c\nint *p_vint;\nchar *p_vchar;\nfloat *p_vfloat;\np_vint=&vint;\np_vchar=&vchar;\n\
    p_vfloat=&vfloat;\n```\n每个指针等于所指向变量第一个字节的地址。因此，`p_vint` 等于 1000，`p_vchar` 等于 1003，`p_vfloat`\
    \ 等于 1006。但记住，每个指针都声明为指向特定类型的变量。编译器知道指向 `int` 类型的指针指向两个字节中的第一个，指向 `float` 类型的指针指向四个字节中的第一个，以此此类推。\n\
    \n这是为了视觉上的清晰。在实际操作中，C 编译器将这三个变量存储在相邻的内存位置，之间没有未使用的字节。\n\n# 二级指针概念\n指针变量的概念可以进一步扩展。正如我们所知，`Pointer`\
    \ 是一个包含另一个变量内存地址的变量。现在，这个变量本身可以是另一个指针。所以，我们现在有了一个包含另一个指针内存地址的指针。\n\n```c\n#include<stdio.h>\n\
    #include<conio.h>\nmain(){\n    int i=5;\n    int *j;\n    int **k;\n    j=&i;\n\
    \    k=&j;\n    printf(“\\n Address of i=%u”, &i);\n    printf(“\\n Address of\
    \ j=%u”, j);\n    printf(“\\n Address of i=%u”, *k);\n    printf(“\\n Address\
    \ of j=%u”, &j);\n    printf(“\\n Address of j=%u”, k);\n    printf(“\\n Value\
    \ of j=%u”, j);\n    printf(“\\n Value of k=%u”, k);\n    printf(“\\n Value of\
    \ i=%d”, i);\n    printf(“\\n Value of i=%d”, *j);\n    printf(“\\n Value of i=%u”,\
    \ **k);\n}\n```\n\n# 指针算术\nC 语言允许对指针进行算术操作。用户负责确保通过执行指针算术获得的是相关且有效的地址。用于指针的算术运算符可以分类为：\n\
    1. 一元运算符：`++`(自增）和 `--`(自减）\n2. 二元运算符：`+`(加法）和 `–`(减法）\n\nC 编译器在对指针执行算术操作时会考虑到指向的数据类型的大小。例如，如果对整数指针使用\
    \ `++` 运算符递增，指针包含的地址将增加两个字节。同样，对于浮点变量，它将增加四个字节。\n\n# 指针的\n1. 指针的使用增强了操作数据的能力\n\
    2. 访问数组元素\n3. 向函数传递参数\n4. 创建链表、树等结构\n5. 为程序动态分配内存\n\n# 指针与数组\n可以高效访问数组元素。应该注意指针与数组之间的以下事实：\n\
    1. 数组元素始终存储在连续的内存位置中，无论数据大小。\n2. 指针变量所引的数据类型的大小取决于指针所指向的数据类型。\n3. 指针在递增时，总是指向跳过数据类型所需字节数之后位置。\n\
    \n"
- fmt: "\n```c\n#include<stdio.h>\n#include<conio.h>\nmain(){\n    int a[20], d, I;\n\
    \    int *ptr;\n    clrscr();\n    printf(\"enter dimension: \");\n    scanf(\"\
    %d\", &d);\n    printf(\"\\nEnter %d values:\", d);\n    for (I=0; I<d;I++)\n\
    \        scanf(\"%d\", &a[I]);\n    ptr=a;\n    printf(\"\\nElements of array\
    \ a:\\n\");\n    for(I=0;I<d;I++){\n        printf(\"%d\\t\", *ptr);\n       \
    \ ptr++;\n    }\n    getch();\n}\n```\n\n# Pointers and multi-dimensional arrays\n\
    \n“Using Numeric arrays”, covers the special relationship between pointers and\
    \ arrays. Specifically, the name of an array without its following brackets is\
    \ a pointer to the first element of the array. As a result, it’s easier to use\
    \ pointer notation when you’re accessing certain types of arrays. These earlier\
    \ example, however, were limited to single-dimensional arrays. What about multi-dimensional\
    \ arrays?\n\nRemember that a multi-dimensional array is declared with one set\
    \ of brackets for each dimension. For example, the following statement declares\
    \ a two-dimensional array that contains eight type int variables:\n\n```c\nint\
    \ multi[2][4];\n```\n\nYou can visualize an array as having a row and column structure-\
    \ in this case, two rows and four columns. There’s another way to visualize a\
    \ multi-dimensional array, however, and this way is closer to the manner in which\
    \ C actually handles arrays. You can consider `multi` to be a two-element array,\
    \ with each of these two elements being an array of four integers.\n\nHere’s how\
    \ to interpret the components of the declaration:\n\n1. Declare an array named\
    \ `multi`.\n2. The array `multi` contains two elements.\n3. Each of these two\
    \ elements contains four elements.\n4. Each of these four elements is a type `int`.\n\
    \nAs with a one-dimensional array, the name of a multi-dimensional array is a\
    \ pointer to the first array element. Continuing with our example, `multi` is\
    \ a pointer to the first element of the two-dimensional array that was declared\
    \ as `int multi[2][4]`. What exactly is the first element of `multi`? It isn’t\
    \ the type `int` variable `multi[0][0]`, as you might think. Remember that `multi`\
    \ is an array of arrays, so its first element is `multi[0]`, which is an array\
    \ of four type `int` variables (one of the two such arrays contained in `multi`).\n\
    \nNow, if `multi[0]` is also an array, does it point to anything? Yes, indeed!\
    \ `multi[0]` points to its first element, `multi[0][0]`. You might wonder why\
    \ `multi[0]` is a pointer. Remember that the name of an array without brackets\
    \ is a pointer to the first array element. The term `multi[0]` is the name of\
    \ the array `multi[0][0]` with the last pair of brackets missing, so it qualifies\
    \ as a pointer.\n\nIf you’re a bit confused at this point, don’t worry. This material\
    \ is difficult to grasp. It might help if you remember the following rules for\
    \ any array of n dimensions used in code:\n\n*   The array name followed by `n`\
    \ pairs of brackets (each pair containing an appropriate index, of course) evaluates\
    \ as array data (that is, the data is stored in the specified array element).\n\
    *   The array name followed by fewer than `n` pairs of brackets evaluates as a\
    \ pointer to an array element.\n\nIn the example, therefore, `multi` evaluates\
    \ as a pointer, `multi[0]` evaluates as a pointer, and `multi[0][0]` evaluates\
    \ as array data.\n\nNow look at what all these pointers actually point to. Here\
    \ we declare a two-dimensional array similar to those we have been using in the\
    \ examples and then print the values of the associated pointers. It also prints\
    \ the address of the first array elements.\n\n## The relationship between a multi-dimensional\
    \ array and pointers\n\n```c\n#include<stdio.h>\n#include<conio.h>\nint multi[2][4];\n\
    main(){\n    printf(\"\\nmulti=%u\", multi);\n    printf(\"\\nmulti[0]=%u\", multi[0]);\n\
    \    printf(\"\\&multi[0][0]=%u\\n\", &multi[0][0]);\n    return 0;\n}\n```\n\n\
    ## Simple example, using pointers\n\n```c\n#include<stdio.h>\n#include<conio.h>\n\
    main(){\n    float a=10;\n    float *points_to_a=&a;\n    printf(\"The value in\
    \ a:%f\\n\", a);\n    printf(\"The value pointed to by points_to_a:%f\\n\", *points_to_a);\n\
    \    printf(\"The value of points_to_a in hex:%x\\n\", points_to_a);\n    printf(\"\
    The value of points_to_a as an integer:%d\\n\", points_to_a);\n    printf(\"The\
    \ value of points_to_a as a float:%f\\n\", points_to_a);\n    *points_to_a=-10;\n\
    \    printf(\"The value pointed to by points_to_a:%f\\n\", *points_to_a);\n  \
    \  printf(\"The value of points_to_a in hex:%x\\n\", points_to_a);\n    printf(\"\
    The value of points_to_a as an integer:%d\\n\", points_to_a);\n    printf(\"The\
    \ value of points_to_a as a float:%f\\n\", points_to_a);\n    exit(0);\n}\n```\n\
    \nNote that the pointer, printed as if it were a float is totally nonsensical;\
    \ printed as an integer, or as an integer, but in ‘hex’ gives the address of the\
    \ thing it points to. You can see that it doesn’t change, even though you did\
    \ change the thing it pointed to. Note that the value in `a` did change when you\
    \ changed it.\n\n## Pointer operations\n\n| Operation | Description |\n| :---\
    \ | :--- |\n| Assignment | You can assign a value to a pointer. The value should\
    \ be an address, obtained with address-of operator or from pointer array name.\
    \ |\n| Indirection | The indirection operator `*` gives the value stored in the\
    \ pointed-to location. |\n| Address of | You can use the address-of operator `&`\
    \ to find the address of a pointer so you can have pointers to pointers. |\n|\
    \ Incrementing | You can add an integer to a pointer in order to point to a different\
    \ memory location. |\n| Decrementing | You can subtract an integer from a pointer\
    \ to point to a different memory location. |\n| Differencing | You can subtract\
    \ an integer from a pointer to point to a different memory location. |\n| Comparison\
    \ | Valid only with two pointers that point to the same array. |\n\n## Strings\n\
    \nThe way a group of integers can be stored in an integer array, similarly a group\
    \ of characters can be stored in a character array. These character arrays are\
    \ also called “strings” for many a times. Character arrays or strings are used\
    \ to manipulate text such as word and sentences.\n\nA “string” constant is an\
    \ one dimensional array of characters terminates by a “NULL” (`\\0`) character.\
    \ For example, `char name[] = {‘P’,’I’,’O’,’N’,’E’,’E’,’R’,’\\0’};`; each character\
    \ in the array occupies one byte of memory and the last character is always a\
    \ NULL (\\0) character. Though it looks like two adjacent character but actually\
    \ it is only one character. The `\\` indicates that what follows it is something\
    \ special. Note that `\\0` and `0` is not the same. ASCII value of `\\0` is zero\
    \ whereas ASCII value of `0` is 48. Following figure shows the way a character\
    \ array is stored in the memory.\n\n| Character-> | P | I | O | N | E | E | R\
    \ | \\0 |\n| Memory address-> | 3000 | 3001 | 3002 | 3003 | 3004 | 3005 | 3006\
    \ | |\n"
