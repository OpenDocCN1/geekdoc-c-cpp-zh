  trans: '

    默认的文件模式是 `text`。要以二进制模式打开文件，你需要在模式段末尾添加一个 `b`。因此，模式参数 `a` 将以文本模式打开一个文件用于追加写入，而
    `ab` 将以二进制模式打开一个文件用于追加写入。


    请记住，如果发生错误，`fopen()` 会返回 `NULL`。可能导致返回值为 `NULL` 的错误情况包括：

    - 使用了无效的文件名。

    - 尝试在未就绪的磁盘上打开文件（例如，驱动器门未关闭或磁盘未格式化）。

    - 尝试在不存在的目录或不存在的磁盘驱动器上打开文件。

    - 尝试在 `r` 模式下打开不存在的文件。


    每当你使用 `fopen()` 时，你都需要测试是否发生了错误。目前无法确切判断发生了哪种错误，但你可以向用户显示一条消息并尝试重新打开文件，或者结束程序。大多数
    C 编译器都包含非 ANSI 扩展，允许你获取有关错误性质的信息；有关信息，请参阅你的编译器文档。


    ## 写入和读取文件数据


    使用磁盘文件的程序可以向文件写入数据、从文件读取数据，或这两者的结合。你可以通过三种方式向磁盘文件写入数据：


    - **格式化输出**：你可以使用格式化输出将格式化后的数据保存到文件中。你只应该对文本模式的文件使用格式化输出。格式化输出的主要用途是创建包含文本和数值数据的文件，供电子表格或数据库等其他程序读取。你很少（如果用的话）使用格式化输出来创建一个供
    C 程序再次读取的文件。

    - **字符输出**：你可以使用字符输出将单个字符或字符行保存到文件中。虽然在技术上对二进制模式的文件使用字符输出是可能的，但这可能会很麻烦。你应该将字符模式输出限制为文本文件。字符输出的主要用途是将文本（但不是数值）数据保存为可
    C 程序以及文字处理器等其他程序读取的格式。

    - **直接输出**：你可以使用直接输出将一段内存的内容直接保存到磁盘文件中。这种方法仅适用于二进制文件。直接输出是保存数据以供 C 程序稍后使用的最佳方法。


    当你想要从文件中读取数据时，你有同样的三个选择：格式化输出、字符输入或直接输入。你在特定情况下使用的输入类型几乎完全取决于所读文件的性质。通常，你会以保存数据时相同的模式读取数据，但这不是强制要求的。然而，以不同于写入时的模式读取文件需要对
    C 和文件格式有深入的了解。


    之前对三种类型文件输入输出的描述暗示了最适合每种输出类型的任务。这绝不是一套严格的规则。C 语言非常灵活（这是它的优势之一！），所以一个聪明的程序员可以使任何类型的文件输出适应几乎任何需求。作为一名初级程序员，如果至少在最初遵循这些指南，可能会让事情变得更容易。


    ## 删除文件


    要删除文件，你使用库函数 `remove()`。它的原型定义在 `stdio.H` 中，如下：


    ```c

    int remove (const char *filename);

    ```


    变量 `*filename` 是一个指向要删除的文件名的指针。所指定的文件不能处于打开状态。如果文件存在，它就会被删除（就像你在 DOS 提示符中使用 `DEL`
    命令或在 UNIX 中使用 `rm` 命令一样），并且 `remove()` 返回 `0`。如果文件不存在、它是只读的、你没有足够的访问权限，或者发生了其他错误，`remove()`
    返回 `-1`。


    ## 关闭和刷新文件


    当你完成对文件的使用后，应该使用 `fclose()` 函数关闭它。你在程序中看到过 `fclose()`。它的原型是：


    ```c

    int fclose(FILE *fp);

    ```


    参数 `fp` 是与该流关联的 `FILE` 指针：`fclose()` 成功时返回 `0`，失败时返回 `-1`。当你关闭一个文件时，文件的缓冲区会被刷新（写入文件）。你也可以使用
    `fcloseall()` 函数关闭除标准流（`stdin`、`stdout`、`stderr` 和 `stdout`）以外的所有打开流。它的原型是：


    ```c

    int fcloseall(void);

    ```


    此函数还会刷新任何流缓冲区并返回关闭的流的数量。当程序终止时（无论是通过到达 `main()` 的结尾还是执行 `exit()` 函数），所有流都会自动刷新并关闭。然而，在完成流的操作后立即显式地关闭它们——特别是那些与磁盘文件关联的流——是一个好习惯。


    原因与流缓冲区有关。当你创建一个与磁盘文件关联的流时，会自动创建一个缓冲区并与流关联。缓冲区是用于临时存储写入文件和从文件中读取数据的内存块。需要缓冲区是因为磁盘驱动器是块定向的设备，这意味着当数据以特定大小的块进行读写时，效率最高。理想块的大小取决于所使用的特定硬件。它通常在几百到一千字节之间。然而，你不需要担心精确的块大小。


    与文件关联的缓冲区充当了流（面向字符）和磁盘（面向块）之间的接口。当你的程序向流写入数据时，数据会保存在缓冲区中，直到缓冲区填满后再写入磁盘。从文件读取数据时也有类似的过程。

    '
- fmt: '

    ### 3. Read a character from the source file

    Remember, when a file is first opened, the pointer is at the start of the file,
    so there’s no need to position the file pointer explicitly.


    4. If the function `feof()` indicates that you’ve reached the end of the source
    file, you’re done and can close both files and return to the calling program.


    5. If you haven’t reached end-of-file, write the character to the destination
    file, and then loop back to step.


    ### Renaming a file

    The `rename()` function changes the name of an existing disk file. The function
    prototype, in `STDIO.H`, is as follows:


    ```c

    int rename(const char *oldname, const char *newname);

    ```


    The filenames pointed to by `oldname` and `newname`. The only restriction is that
    both names must refer to the same disk drive; you don’t rename a file to a different
    disk drive. The function `rename()` returns `0` on success, or `-1` if an error
    occurs. Errors can be caused by the following conditions (among others):


    - The file `oldname` does not exist.

    - A file with the name `newname` already exists.

    - You try to rename to another disk.

    '
