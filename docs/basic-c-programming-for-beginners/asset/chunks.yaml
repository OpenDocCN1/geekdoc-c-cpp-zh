    numbering scheme in mind. In an array of n elements, the allowable subscripts
    range from 0 to n-1\. If you use the subscript value n, you might get program
    errors. The C compiler doesn’t recognize whether your program uses an subscript
    that is out of bounds. Your program compiles and links, but out-of-range subscripts
    generally produce erroneous results.Sometimes you might want to treat an array
    of n elements as if its elements were numbered 1 through n. for instance, in the
    previous example, a more natural method might be to store January’s expense total
    in expenses[1], February’s expenses[2], and so on. The simplest way to do this
    is to declare the array with one more element than needed, and ignore element
    0\. In this case, you would declare the array as follows. You could also store
    some related data in element 0 (the yearly expense total, perhaps).float expenses[13];Multi-dimensional
    arrayso far we have explored arrays with only one dimension. It is also possible
    for arrays to have two or more dimensions. Here we will learn how to access a
    two dimensional array.DeclarationSyntax:<data type><array name>[size][size];e.g.int
    arr[5][5];Initializing a two-dimensional arraye.g.int rollmarks[4][2]= {{1, 45},{2,
    55},{3, 65},{4, 75}}Entering data into a 2-dimensional arrayThe values are entered
    into a 2-dimensional array using nested for loop. Note that before using the array
    its type and size must be mentioned.main(){int i, j, arr[2][2];for(i=0;i<2;i++)for(j=0;j<2:j++){printf(“Enter
    the value for cell %d%d:”, i, j);}}Program for double dimensional Array#include<stdio.h>#include<conio.h>main(){int
    a[10][10], i, j, r, c;clrscr();printf(“Enter order of matrix:”);scanf(“%d%d”,
    &r, &c);printf(“Enter %d values”, r*c);for(i=0;i<r;i++)for(j=0;j<c;j++)scanf(“%d”,
    &a[i][j]);printf(“\n Elements of array a:”);for(i=0;i<r;i++){printf(“%d\t”, a[i][j]);}}getch();}Program
    for matrix addition#include<stdio.h>#include<conio.h>main(){int a[10][1], b[10][10],
    d[10][10];int i, j, r, c, p, q;clrscr();printf(“Enter order of matrix a:”);scanf(“%d%d”,
    &r, &c);/*accepting values from user*/printf(“Enter %d values”, r*c);for(i=0;i<r;i++)for(j=0;j<c;j++)scanf(“%d”,
    &a[i][j]);printf(“Enter order of matrix b:”);scanf(“%d%d”, &p, &q);/*accepting
    values from user*/printf(“Enter %d values”, p*q);for(i=0;i<p;i++)for(j=0;j<q;j++)scanf(“%d”,
    &a[i][j]);/*printing values*/printf(“Elements of array a:”);for(i=0;i<r;i++){printf(“\n”);for(j=0;j<c;j++){printf(“%d\t”,
    a[i][j]);}}printf(“Elements of array b:”);for(i=0;i<p;i++){printf(“\n”);for(j=0;j<q;j++){printf(“%d\t”,
    b[i][j]);}}/*if rows and columns of two matrices are equal*/if(r==p && c==q){for(i=0;i<r;i++){for(j=0;j<q;j++)d[i][j]=a[i][j]+b[i][j];}printf(“\nElements
    of array d:”);for(i=0;i<p;i++){printf(“\n”);for(j=0;j<q;j++){printf(“%d\t”, d[i][j]);}}}elseprintf(“\nAddition
    is not possible”);getch();}Maximize array sizeBecause of the way memory models
    work, you shouldn’t try to create more than 64 KB of data variables for now. Generally,
    64 KB is enough data space for programs, particularly the relatively simple programs
    you will write as you work through this book. A single array can take up the entire
    64 KB of data storage if your program uses no other variables. Otherwise, you
    need to apportion the available data space as needed.The size of an array in bytes
    depends on the number of elements it has, as well as each element’s size. Element
    size depends on the data type of the array and your computer. These are the data
    type sizes for many PCs.'
