  raw: 'We have already seen examples of binary trees, both considering in the discussion
    of optimal sorting, and  which was used to illustrate the process the optimal
    merging, are binary trees, although in each case, the situation in which a node
    can have just one child does not occur. Note also that this is rather different
    from an ordered tree, since for a binary tree we distinguish between a node with
    a single left child, and one with a single right child. An alternative definition,
    which is “cleaner” is to first introduce the concept of a terminal, or “null”
    node, which has no children, and then define a binary tree to be one in which
    every node other than the null node has precisely two children.A complete binary
    tree is a special case of a binary tree, in which all the levels, except perhaps
    the last, are full; while on the last level, any missing nodes are to the right
    of all the nodes that are present. An example is shown in the figure.![](rsrc2RD.jpg)ExampleGive
    a space efficient implementation of a complete binary tree in terms of an array
    A. Describe how to pass from a parent to its two children, and vice versa.Solution:
    An obvious one, in which no space is wasted, stores the root of the tree in A[1];
    the two children in A[2] and A[3], the next generation at A[4] up to A[7] and
    so on. An element A[k] has children at A[2k] and A[2k+1], providing they both
    exist, while the parent of node A[k] is at A[kdiv 2]. Thus traversing the tree
    can be done very efficiently.Linked listLinked list is a much better way of storing
    data. A linked list is a special kind of struct which has a pointer to another
    struct of the same type. For example, let’s turn our studentInfo struct into a
    linked list by adding a new pointer named “next”. This pointer will point at the
    next element in the list.struct studentInfo{char name[32];char teacher[32];int
    age;studentInfo * next;}Remember a * means a pointer, so every studentInfo now
    has a pointer to another studentInfo. If this pointer is set to 0, or NULL, then
    we must be at the end of the list. Then, all we need to do is keep a pointer to
    the first struct in the liststudentInfo * student_list;This struct will have a
    pointer to the next one, which will have a pointer to the next one, and so on.Going
    through the whole listRemember the function printStudent? It took a studentInfo
    and printed out all of the info. Now, let’s use that to make a new function printAllStudents,
    which prints info on every student in the list.void printAllStudents (void){/*This
    is a pointer to the current item in the list */struct studentInfo * current =
    student_list;if (current!=0){/*if the list is not empty…*//*start at the top of
    the list, go to the end, when current==0*/while(current!=0){printStudent(current);current
    = current->next;}else{printf(“Error: no students have been entered yet\n”);}}Adding
    data to the listNow let’s take a function called addStudent. It lets the user
    type in the data for a new student. This new student is added to the top of the
    list. It’s next pointer points at the old top of the list.void addStudent(void){printf(“creating
    a new student…\n”);studentInfo *temp = (struct studentInfo*) malloc(sizeof(struct
    studentInfo));printf(“Enter student name”);gets(temp->name);printf(“Enter the
    student’s teacher”);gets(temp->teacher);printf(“Enter the student’s age”);char
    buffer[18];gets(buffer);temp->age = atoi(buffer);printf(“Adding student %s to
    the list…”, temp->name);/*next pointer points at the old top of the list*/temp->next
    = student_list;/*the top of the list now points at temp*/student_list = temp;printf(“Done\n”);}Searching
    the listTo search the list we start at the top and follow the next pointer until
    we find the data we’re looking for. If we reach the end of the list before we
    find the data then the search must have failed – the data doesn’t exist in the
    list. Here’s an example called getStudentInfo. It asks the user to type in a name
    and searches the list for that student. It then prints out all the information
    it has on the student.void getStudentInfo(void){printf(“Enter the name of the
    student:”);char search[32];int found = 0;gets(search);printf(“searching the list…”);/*start
    at the top of the list*/struct studentInfo*current = student_list;/*while we’re
    not at the end of the list, and we haven’t found the data*/while((current!=0)
    && !found){/*if the name of the current item matches the name we’re looking for…*/if(!strcmp(current->name,
    search)){found = 1; ​ /*….the we’re done*/}else{current = current->next; ​ /*else
    we try the next item in the list*/}}printf(“Done\n”);if(current!=0) ​ ​ /*if we
    found a student…*/{printStudent(current); ​ ​ /*…then print out the information*/}else{printf(“No
    student by that name exists in the database.\n”);}}APPENDIX ACommonly used headers:


