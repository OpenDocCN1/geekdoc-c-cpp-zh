    | union | keyword used to allow multiple variables to share the same memory space.
    |


    | unsigned | modifier used to signify that a variable will contain only positive
    values. see signed. |


    | void | keyword used to signify either that a function doesn’t return anything
    or that a pointer being used is considered generic or able to point to any data
    type. |


    | while | looping statement that executes a section of code as long as a condition
    remains TRUE. |


