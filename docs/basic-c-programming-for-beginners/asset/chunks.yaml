- fmt: "\n# About the IDE\nThe `Borland C IDE` (Integrated development Environment)\
    \ is a powerful environment, which allows us to create and execute a C program.\
    \ The IDE is completely menu-driven and allows the use to create, edit, compile\
    \ and run C programs using easy-to-easy menus or by combined keystrokes.\n\n##\
    \ Editing\nTo write a new program first open a `New` file from `File` menu. Here,\
    \ type the program directly in the new window on the screen and save the resulting\
    \ text as a separate file. This is often referred to as the source file. The custom\
    \ is that the source file of a C program is stored with the extension `.c` for\
    \ C programming language.\n\n## Compiling\nWe can’t directly execute the source\
    \ file. To run on any computer system, the source file must be translated into\
    \ binary numbers understandable to the computer’s Central processing unit (for\
    \ example, the Pentium microprocessor). This process produces an intermediate\
    \ object file with the extension `.obj`, which stands for `Object`. We compile\
    \ a C source file either through menu as `Project > compile` or through combined\
    \ keystrokes as `Alt+F9`.\n\n## Linking\nThe first question that comes to most\
    \ people’s mind is “why is linking necessary?” The main reason is that many compiled\
    \ languages come with library routines that can be added to your program. These\
    \ routines are written by the manufacturer of the compiler to perform a variety\
    \ of tasks, from input-output to complicated mathematical functions. In the case\
    \ of C the standard input and output functions are contained in a library file\
    \ (`stdio.h`) so even the most basic program will require a library function.\
    \ After linking, the file extension is `.exe`, which is an executable file. We\
    \ can both link and execute a compiled C program at the same time either through\
    \ menu as `Debug>Run` or through combined keystroke as `Ctrl+F9`.\n\n## Executable\
    \ files\nNow, we can run the `.exe` file as we run other applications, simply\
    \ by typing their names at the DOS prompt or run using windows menu.\n\n## The\
    \ layout of a C program\nThe general form of a C program is as follows:\n\n```c\n\
    pre-processor directives\nglobal declaration\nmain(){\n    local variables to\
    \ function main;\n    statements associated with function main();\n}\nfun1(){\n\
    \    local variables to function fun1();\n    statements associates with function\
    \ fun1();\n}\nfun2(){\n    local variables to function fun2();\n    statements\
    \ associates with function fun2();\n}\n```\n\nAll C programs will consist of at\
    \ least one function, but it is usual (when your experience grows) to write a\
    \ C program that comprises several functions. The only function that has to be\
    \ present is the function called `main`. For more advanced program the `main`\
    \ function will act as a controlling function calling other functions in their\
    \ turn to do a specific work. The `main()` function is the first function that\
    \ is called when a C program executes.\n\nNote the use of the bracket set `()`\
    \ and `{}`. The `()` are used in conjunction with function names whereas `{}`\
    \ are used to delimit the C statement that are associated with that function.\
    \ Also note that a semicolon (`;`) is used to terminate C statement. C is a free\
    \ format language and long statements can be continued, without truncation, onto\
    \ the next line. The semicolon informs the C compiler that the end of the statement\
    \ has been reached. Free format also means that you can add as many spaces as\
    \ you like to improve the look of your programs.\n\nA very common mistake made\
    \ by everyone, who is new to the C programming language, is to miss of the semicolon.\
    \ The C compiler will concatenate the various lines of the program together and\
    \ then tries to understand them- which it will not able to do. The error message\
    \ produced by the compiler will relate to a line of your program, which could\
    \ be some distance from the initial mistake.\n\n## Our first C program\nNow let\
    \ us write our first C program as follows:\n\n```c\n#include<stdio.h>\n/*main\
    \ function starts here*/\nvoid main(){\n    printf(\"Hello world!\\n\");\n}\n\
    ```\n\n## Line by line explanation\n**Line 1 : `#include<stdio.h>`**\nAs part\
    \ of compilation, the C compiler runs a program called the C pre-processor. The\
    \ pre-processor is able to add and remove code from your source file. In this\
    \ case, the pre-processor directive `#include` tells the compiler to include code\
    \ from the file `stdio.h`. This file contains declarations for functions that\
    \ the program needs to use. A declaration for the `printf` function is in this\
    \ file.\n\n**Line 2 : `/*main function starts here*/`**\nThis is a comment. A\
    \ comment is a note to yourself or others that you put into your source code.\
    \ The compiler ignores all comments. Comments are used primarily to document the\
    \ meaning and purpose of the source code, so that we can remember later how it\
    \ functions and how to use it. You can also use a comment to temporarily remove\
    \ a line of code. Simply surround the lines with the comment symbols. In C, the\
    \ start of a comment is signalled by the `/*` character and is ended by `*/`.\n\
    \n**Line 3 : `void main()`**\nThis statement declares the `main` function. A C\
    \ program can contain many functions but must always have one `main` function.\
    \ A function is a self-contained module of code that can accomplish some task.\
    \ The `\"void\"` specifies the return type of `main`. In this case, nothing is\
    \ returned to the operating system.\n\n**Line 4 : `{`**\nThis opening curly bracket\
    \ denotes the starting of the `main` function.\n\n**Line 5 : `printf(\"Hello world!\\\
    n\");`**\n`printf` is a function from a standard C library that is used to print\
    \ strings to the standard output device, normally the screen. The compiler links\
    \ code from these standard libraries to the code you have written to produce the\
    \ final executable. The `\\n` is a special format modifier that tells the `printf`\
    \ to put a line feed at the end of the line. If there were another `printf` in\
    \ this program, its string would print on the next line.\n\n**Line 6 : `}`**\n\
    This closing curly bracket denotes the end of the `main` function.\n\nType it\
    \ in a new file and save it as `Hello.c`. Then use the compiler to compile it,\
    \ the linker to link it and finally run it.\nThe output is as follows:\n`Hello\
    \ World!`\n\n## Note on Header files and Pre-processor directives\nThe file in\
    \ which we find the definition of different built library functions is called\
    \ a header file. If we use any basic input-output functions or any other in-built\
    \ functions functions a C program then we also have to include the corresponding\
    \ header file in that program before the main function starts. Here, in this example\
    \ we have included the header file `stdio.h`, because the definition of basic\
    \ output function `printf()` is given in this header. We will come to know about\
    \ other header files as we proceed.\n\nAs part of compilation, the C compiler\
    \ runs a program called the C pre-processor. The pre-processor directives give\
    \ direction to the compiler that, what to do before compiling a source code. In\
    \ this case, the pre-processor directive `#include` tells the compiler to include\
    \ code from the file `stdio.h`. This file contains declarations for functions\
    \ that the program needs to use. A declaration for the `printf` function is in\
    \ this file.\n\nIt is already mentioned that C is a free format language and that\
    \ you can layout your program how you want to use as much white space as you like.\
    \ The only exception is statement associated with the pre-processor directives.\
    \ All pre-processor directives begin with a # symbol and do not use semicolons\
    \ as delimiters. The most common pre-processor directives to all C programs are:\n\
    `#include<stdio.h>`\nNote the use of the angle bracket `<` and `>` around the\
    \ header file’s name. These indicate that the header file is to be looked for\
    \ on the system disk, which stores the rest of the C program application. We can\
    \ also write the above statement as:\n`#include \"stdio.h\"`\nThe double quotes\
    \ indicate that the current working directory should be searched for the required\
    \ header file. This will be true when you write your own header files. But, the\
    \ standard header files should always have the angle brackets around them.\n\n\
    ## The building blocks of a C program\nNow we have to start looking into the details\
    \ of the C language. How easy you find the rest of this section will depend on\
    \ whether you have ever programmed before- no matter what the language was. There\
    \ are a great many ideas common to programming in any language and C is no exception\
    \ to this rule. So if you haven’t programmed before, you need to take the rest\
    \ of this section slowly and keep going over it until it makes sense. The basic\
    \ things we need to know that are required to learn the C programming language\
    \ are as follows:\n"
