  trans: "\n\n# 理解程序规范\n\n程序规范包含两个部分：\na) 问题定义\nb) 需求分析\n\n## 问题定义\n在开始建造房屋之前，建筑师会审查蓝图，检查是否已获得所有许可证，并对房屋的基础进行测量。建筑师为建造摩天大楼和建造狗屋的准备是不同的。无论什么项目，准备工作都会根据其需求量身定制，并在施工开始前认真地完成。\n\
    \n在设计程序模型之前，你需要完成的首要前提条件是清晰地陈述程序所要解决的问题。问题定义定义了问题是什么，而不涉及任何可能的解决方案。它是一个简单的陈述 `=`，可能有一到两页纸，并且听起来应该像一个问题。问题定义在需求分析之前，而需求分析是对问题更详细的分析。\n\
    \n问题定义应该使用用户语言，并且应该从用户的角度来描述问题。它通常不应该用技术计算机术语来表述。\n\n在不清楚问题组成部分的情况下解决问题可能会变成一项徒劳的尝试，因为解决方案可能无法满足用户的需求。因此，必须准备一份问题陈述，毫无疑问地解释问题的每一个细微细节。通过用清晰的陈述写下问题可以最好地实现这一点。更好的问题定义会带来更快、更简单、更准确的解决方案。\n\
    \n## 需求分析\n需求详细描述了程序应该做什么，它们是通往解决方案的第一步。需求活动也被称为功能规范。出于几个原因，一组显式的需求是非常关重要的。显式需求有助于确保由用户而不是程序员来驱动程序的功能。如果需求是显式的，用户就可以对它们进行审查并表示认同。显式需求可以防止你猜测用户想要什么。充分地规定需求是程序成功的关键。\n\
    \n三个基本组成部分是：\na) 什么是输入？\nb) 预期的输出是什么，以及\nc) 如何得出解决方案\n\n让我们举一个例子来理解上述输入、处理和输出的概念。程序要求在收到终端操作员的请求后，从文件中检索车辆注册记录。操作员将提供车辆注册号，程序将显示车辆及其所有者的详情。如果程序无法找到车辆记录，将显示错误信息。\n\
    \n输入：`vehicle registration number`\n处理：使用注册号进行搜索，如果找到，则从磁盘中检索车辆详情及其所有者的姓名。\n输出：如果检索成功，则允许在屏幕上显示车辆详情；如果失败，则指示磁盘上不存在车辆注册并显示相应的错误信息。\n\
    \n## 设计程序模型\n一旦问题被明确定义，就可以开发算法（处理逻辑的另一个术语）。这是编程中最具创造力的部分。在这个阶段，算法可以用宽泛的术语构建，以帮助可视化可能的替代方案。\n\
    \n算法是一个公式、一个配方、为了获得问题的解决方案而必须遵循的逐步步骤程序。为了成为编写程序的有效基础，算法必须满足：\na) 在有限时间内得出正确的解法。\n\
    b) 清晰、精确、无歧且\nc) 采用一种便于在编程语言中进行优雅实现的格式。\n\n在开发解决方案和准备算法时使用的工具包括流程图和伪代码等。流程图提供了解决方案的视觉和图形化表示，而伪代码意味着用简单的英语类语言编写程序逻辑。使用这些工具描绘的逻辑随后可以使用任何编程语言编写。换句话说，这些是通用工具。我们将在本课程中详细研究这些工具。\n\
    \n## 确定算法的正确性\n算法开发中最困难、有时最枯燥的步骤之一是确保并提供算法是正确的。算法或程序的正确性意味着它给出了正确的输出并执行了它应该做的事情。算法或程序的正确性可以通过以下任一方法进行检查：\n\
    a) 手算（Dry run）\nb) 独立检查。\nc) 结构化评审。\n\n## 编写程序\n这是将我们的解决方案（即算法流程图/伪代码）转换为实际计算机程序的过程。在这里我们选择一种编程语言并利用该语言的语法和语义，转换我们为止以流程图/伪代码形式表示的算法。\n\
    \n语法意味着编写命令或系列命令的正确方法或语法，包括所有正确的选项和命令行语句。\n语义意味着语句的逻辑含义，独立于语法结构。\n\n## 测试和调试程序\n\
    一旦编码完成，你把程序输入计算机。计算机随后会将我们的程序编译成机器码。编译意味着将源代码（即使用高级语言编写的用户程序）转换为机器码（即机器理解的语言）。编译会产生某些错误，计算机会在过程结束后指示。这些错误必须修正，然后重新编译程序。该过程一直持续到程序没有错误。接下来，我们必须验证程序执行了它应该做的一切事情。计算机程序第一次运行通常不正常。通常会遇到的三类错误是：\n\
    a) 语法\nb) 执行\nc) 逻辑\n\n### 语法错误\n语法错误发生在计算机语言编译器无法理解程序员输入的命令时。当遇到此类错误时，计算机会拒绝程序并打印出错误信息。这些错误在编译期间遇到，非常容易修正。在许多情况下，这些错误由于拼写错误、命令错误引起。例如，在\
    \ C 中中如果我们输入 `PRINT` 而不是 `printf`，这将导致错误。\n\n### 执行错误\n这些错误在无错误编译后的执行期间遇到。执行错误也称为运行时错误。典型示例包括：\n\
    1 无限循环\n2 仅对选定数据输出正确\n3 数据错误或顺序错误\n4 文件名错误\n5 除法检查错误。这些检查在除以零或接近零的数字时出现。\n\n###\
    \ 逻辑错误\n逻辑错误由于程序员在编码时犯的错误引起。计算机不检测逻辑错误。例如，计算员工净工资的公式应为 `NETSALARY=BASIC+ALLOWANCE-DEDUCTIONS`。但由于疏忽，编码时将公式写成了\
    \ `NETSALARY=BASIC+ALLOWANCE`。这显然会产生错误的结果。这种错误只能通过手算检测。为了纠正这些错误，我们必须检查程序的算法。通过运行已知答案的样例问题，很容易检测到这些错误。大多数此类错误可以通过合理设计程序来消除。\n\
    \n### 调试\n调试是识别错误根源并修正错误的过程。与测试相反，测试是最初检测错误的过程。\n\n### 文档\n一旦程序编写并调试完成，就可以使用了，因此需要关于如何运行程序、输入数据、预期哪些问题以及如何处理这些问题的文档。程序的文档将由流程图/伪代码、程序列表以及相关算法和过程的详细文字说明组成。文档对于程序的维护是必要的。如果没有适当的文档，后期修改程序将非常困难。误认为文档是算法开发阶段的最后一步实际上它应该贯穿整个编程阶段，特别是设计和实现阶段，因为文档应该让人们理解程序的逻辑。\n\
    \n 结构化编程技术\n结构化编程技术意味着程序开发和编码必须遵循自顶向下的方法和结构化编程构造。自顶向下的方法意味着将程序规划为层次结构。编程从顶层（主）模块开始。在编写主模块时，然后编写第二层模块。为了支持自顶向下编程的规范，编程中遵循以下基本的结构化编程构造：\n\
    \n"
