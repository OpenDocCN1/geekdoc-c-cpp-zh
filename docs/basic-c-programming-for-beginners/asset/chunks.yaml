  trans: "\n\n# main()\n\n```c\nmain(){\n    char name[30];\n    puts(“enter your\
    \ name:”);\n    gets(name);\n    puts(“Hello”);\n    puts(name);\n}\n```\n在这里，`puts()`\
    \ 函数是 `gets()` 的对应函数。`puts()` 每次只能显示一个字符串并将光标置于下一行。为了理解指针和字符串之间的基本关系，让我们来看下面的程序。\n\
    \n```c\nmain(){\n    char arr[] = “pioneer”;\n    char *ptr;\n    ptr = arr;\n\
    \    while(*ptr!='\\0’){\n        printf(“%c”, *ptr);\n        ptr++;\n    }\n\
    }\n```\n在这里，通过提到数组名称，我们获得了数组的基地址，并将该地址存储在指针变量 `ptr` 中。一旦在 `ptr` 中获取了基地址，`*ptr`\
    \ 就会给出该地址的值，并据此打印。然后，`ptr` 递增以指向字符串中的下一个字符。这个过程将一直进行，直到 `ptr` 不指向 ‘\\0’（NULL）字符为止。\n\
    \n假设我们想要存储“pioneer”。我们可以选择将其存储在字符串中，也可以要求 C 编译器将其存储在内存的某个位置，并将地址分配给 `char` 类型指针。例如：`char\
    \ str[] = “pioneer”;`；`char *ptr = “pioneer”;`。这这形式在用法上存在基本区别。我们不能将一个字符串赋值给另一个，但可以将一个\
    \ `char` 指针赋值给另一个 `char` 指针。看下面的示例。\n\n```c\nmain(){\n    char str1[] = “pioneer”\n\
    \    char str2[10];\n    char *ptr1 = “Kumar Janglu”;\n    char *ptr2;\n    str2=str1;\
    \ /*error*/\n    ptr2=ptr1; /*works fine*/\n}\n```\n此外，一旦字符串被定义，它就不能被初始化为另一组字符，但这种操作对于\
    \ `char` 类型指针来说是完全有效的。\n\n```c\nmain(){\n    char str[] = “Kumarjanglu”;\n   \
    \ char *ptr = “Kumar Janglu”;\n    str = “hello”; /*error*/\n    prt = “Manoj\
    \ Meher”; /*works fine*/\n}\n```\n\n# 标准库字符串函数\n\n每个 C 编译器都提供了大量的实用字符串处理库函数。其中，我们将讨论一些最常用的函数及其用途。请注意，要使用这些库函数，我们需要包含头文件\
    \ `string.h`。\n\n## strlen()\n\n此函数计算字符串中字符的个数，不包括 NULL 字符。该函数的用法在下面的程序所示。\n\n\
    ```c\nmain(){\n    int len1, len2, len3;\n    char arr1[] = “Kumar Janglu”;\n\
    \    char arr2[30];\n    len1 = strlen(arr1);\n    puts(“enter your name:”);\n\
    \    gets(arr2);\n    len2 = strlen(arr2);\n    len3 = stelen(“Smart Value”);\n\
    \    printf(“\\n String1 = %s length = %d”, arr1, len1);\n    printf(“\\n String1\
    \ = %s length = %d”, arr2, len2);\n    printf(“\\n String1 = %s length = %d”,\
    \ “Smart Value”, len3);\n}\n```\n注意，在第一次和第二次调用函数 `strlen()` 时，我们传递的是字符串的基地址，随后函数返回字符串的长度。在计算长度时，函数不计算\
    \ NULL 字符。即使在第三次调用中，传递给 `strlen()` 的也是字符串的地址而不是字符串本身。\n\n在这里，我们将编写并使用函数 `lenstr()`，它的作用与库函数\
    \ `strlen()` 相同。\n\n```c\nmain(){\n    int lenstr(char *);\n    int len1, len2,\
    \ len3;\n    char arr1[] = “Hello World!”;\n    char arr2[30];\n    len1 = lenstr(arr1);\n\
    \    puts(“Enter your name:”);\n    gets(arr2);\n    len2 = lenstr(arr2);\n  \
    \  len3 = lenstr(“Smart Value”);\n    printf(“\\n String1 = %s length = %d”, arr1,\
    \ len1);\n    printf(“\\n String1 = %s length = %d”, arr2, len2);\n    printf(“\\\
    n String1 = %s length = %d”, “Kumar Janglu”, len3);\n}\nint lenstr(char *str){\n\
    \    int length = 0;\n    while(*str!='’\\0’){\n        length++;\n        str++;\n\
    \    }\n    return(length);\n}\n```\n在上面的示例中，我们简单地用创建的 `lenstr()` 函数替换了库函数 `strlen()`。\n\
    \n## Strcpy()\n\n此函数将一个字符串的内容复制到另一个。需要向此函数提供源字符串和目标字符串的基地址。该函数的用法在下面的程序所示。\n\n\
    ```c\nmain(){\n    char source1[] = “Kumar Janglu”;\n    char target1[20], target2[30],\
    \ source2[30];\n    strcpy(target1, source1);\n    puts(“Enter your name:”);\n\
    \    gets(source2);\n    strcpy(target2, source2);\n    printf(“\\n Source String1\
    \ = %s”, source1);\n    printf(“\\n Target String1 = %s”, target1);\n    printf(“\\\
    n Source String2 = %s”, source2);\n    printf(“\\n Target String2 = %s”, target2);\n\
    }\n```\n在提供基地址后，`strcpy()` 将继续将源字符串的字符复制到目标字符串中，直到遇到源字符串的 ‘\\0’（NULL）字符。注意，目标的维度应大于源字符串。\n\
    \n在这里，我们将编写并使用函数 `cpystr()`，它的作用与库函数 `strcpy()` 相同。\n\n```c\nvoid cpystr(char\
    \ *, char *);\n    char source1[] = “Hello World!”;\n    char target1[20], target2[30],\
    \ source2[30];\n    cpystr(target1, source1);\n    puts(“Enter your name;”);\n\
    \    gets(source2);\n    cpystr(target2, source2);\n    printf(“\\n Source String1\
    \ = %s”, source1);\n    printf(“\\n Target String1 = %s”, target1);\n    printf(“\\\
    n Source String2 = %s”, source2);\n    printf(“\\n Target String2 = %s”, target2);\n\
    }\n```\n"
- fmt: "\n* Sometimes it is useful to assign pointers to structures. Declaring pointers\
    \ to structures is basically the same as declaring a normal pointer.\n\n```c\n\
    struct student *student_a;\n```\n\nBut how do we deference the pointer to the\
    \ struct and its fields? You can do it in one of two ways, the first way is: `printf(“%s\\\
    n”, (*student_a).SSN);`\n\n* To deference, you can use the infix operator: `->`\n\
    \nThe above example using the other operator: `printf(“%s\\n”, student_a->SSN);`\n\
    \n## Arrays of structures\nIf you can have structures that contain arrays, can\
    \ you also have arrays of structures? In fact, arrays of structures are very powerful\
    \ programming tools. You’ve seen how a structure definition can be tailored to\
    \ fit the data your program needs to work with. Usually a program needs to work\
    \ with more than one instance of the data. For example, in a program to maintain\
    \ a list of phone numbers, you can define a structure to hold each person’s name\
    \ and number.\n\n```c\nstruct entry{\n    char fname[10];\n    char iname[12];\n\
    \    char phone[8];\n};\n```\n\nA phone list must hold many entries, however,\
    \ so a single instance of the `entry` structure isn’t of much use. What you need\
    \ is an array of type `entry`. After the structure has been defined, you can declare\
    \ an array as follows:\n\n```c\nstruct entry list[1000];\n```\n\nThis statement\
    \ declares an array named `list` that contains 1000 elements. Each element is\
    \ a structure of type `entry` and is identified by subscript like other array\
    \ element types. Each of these structures has three elements, each of which is\
    \ an array of type `char`. When you have declared the array of structures, you\
    \ can manipulate the data in many ways. For example, to assign the data in one\
    \ array element to another array element, you would write.\n\n```c\nlist[1] =\
    \ list[5];\n```\n\nThis statement assigns to each member of the structure `list[1]`\
    \ the values contained in the corresponding members of `list[5]`. You can also\
    \ move data between individual structure members. The statement \n\n```c\nstrcpy(list[1].phone,\
    \ list[5].phone);\n```\n\nThe `strcpy()` library function copies one string to\
    \ another string. If you want to, you can also move data between individual elements\
    \ of the structure member arrays:\n\n```c\nlist[5].phone[1] = list[2].phone[3];\n\
    ```\n\nThis statement moves the second character of `list[5]`’s phone number to\
    \ the fourth position in `list[2]`’s phone number.\n\n## Files\nOften it is not\
    \ enough to just display the data on the screen. This is because if the data range\
    \ is large, only a limited amount of it can be stored in memory and only a limited\
    \ amount of it can be displayed on the screen. Memory is by nature volatile and\
    \ its contents would be lost once the program is terminated; so, it would be inappropriate\
    \ to store the data in memory. If we need the same data again, it becomes necessary\
    \ to store the data in a manner that can be later retrieved and displayed either\
    \ in part or in whole. That is why it is very important for us to learn how to\
    \ handle files in C.\n\nA collection of data or information that has a name called\
    \ `filename` or simply `file`. Almost all information stored in a computer must\
    \ be in a file. There are many different types of files: data files, text files,\
    \ program files, directory files and so on. Different types of files store different\
    \ types of information. For example, program files store programs, whereas text\
    \ files store text.\n\nTo understand how data flows to and from storage media\
    \ and C program, take a look at the figure illustrated below.![](rsrc2B0.jpg)\n\
    \n```c\n#include<stdio.h>\n#include<conio.h>\nmain(){\n    FILE *fp, *ft;\n  \
    \  char ch;\n    clrscr();\n    fp = fopen(“first.txt”, “r”);\n    if(fp==0){\n\
    \        printf(“Cannot open the source file”);\n        exit();\n    }else{\n\
    \        ft = fopen(“third.txt”, “w”);\n        while(1){\n            ch = getc(fp);\n\
    \            if(ch==EOF)break;\n            elseputc(ch, ft);\n            {\n\
    \                fclose(fp);\n                fclose(ft);\n                ft\
    \ = fopen(“third.txt”, “r”);\n                while((ch=getc(fp))!=EOF)printf(“%c”,\
    \ ch);\n            }\n            getch();\n        }\n    }\n}\n```\n\n## File\
    \ operations\nThere are different operations that can be carried out on a file\
    \ like:\n\n### Opening a file\nThe process of creating a stream linked to a disk\
    \ file is called opening the file. When you open a file, it becomes available\
    \ for reading (meaning that the data is input from the file to the program), writing\
    \ (meaning that data from the program is saved in the file), or both. When you’re\
    \ done using the file, you must close it.\n\nTo open a file, you use the `fopen()`\
    \ library function. The prototype of `fopen()` is located in `STDIO.H` and reads\
    \ as follows:\n\n```c\nFILE *fopen(const char *filename, const char *mode);\n\
    ```\n\nThis prototype tells you that `fopen()` returns a pointer to type `FILE`,\
    \ which is a structure declared in `STDIO.H`. The members of the `FILE` structure\
    \ are used by the program in the various file access operations, but you don’t\
    \ need to be concerned about them. However, for each file that you want to open,\
    \ you must declare a pointer to type `FILE`. When you call `fopen()`, that function\
    \ creates an instance of the `FILE` structure and returns a pointer to that structure.\
    \ If `fopen()` fails, it returns `NULL`. Such a failure could be caused, for example,\
    \ by a hardware error or by trying to open a file on a diskette that hasn’t been\
    \ formatted.\n\nThe argument `filename` is the name of the file to be opened.\
    \ As noted earlier, `filename` can and should contain a path specification. The\
    \ `filename` argument can be a literal string enclosed in double quotation marks\
    \ or a pointer to a string. The argument `mode` specifies the mode in which to\
    \ open the file. In this context, mode controls whether the file is binary or\
    \ text and whether it is for reading, writing, or both. The permitted values for\
    \ mode are listed in Table.\n\n### Values of mode for the `fopen()` function\n\
    \n| Mode | Meaning |\n| :--- | :--- |\n| `R` | Open the file for reading. If the\
    \ file doesn’t exist, `fopen()` returns `NULL`. |\n| `W` | Opens the file for\
    \ writing. If a file of the specified name doesn’t exist, it is created. If a\
    \ file of the specified name does exist, it is deleted without warning, and a\
    \ new, empty file is created. |\n| `A` | Opens the file for appending. If a file\
    \ of the specified name doesn’t exist, it is created. If the file does exist,\
    \ new data is appended to the end of the file. |\n| `R+` | Opens the file for\
    \ reading and writing. If a file of the specified name doesn’t exist, it is created.\
    \ If the file does exist, new data is added to the beginning of the file, overwriting\
    \ the existing data. |\n| `W+` | Opens the file for reading and writing. If a\
    \ file of the specified name doesn’t exist, it is created. If the file does exist,\
    \ it is overwritten. |\n| `A+` | Opens a file for reading and appending. If a\
    \ file of the specified name doesn’t exist, it is created. If the file does exist,\
    \ new data is appended to the end of the file. |\n"
