  trans: "\n\n# 关于 IDE\n`Borland C IDE`（集成开发环境）是一个强大的环境，允许我们创建和执行 C 程序。该 IDE 完全由菜单驱动，允许用户使用易于操作的菜单或组合键来创建、编辑、编译和运行\
    \ C 程序。\n\n## 编辑\n要编写一个新程序，首先从 `File`（文件）菜单中打开一个 `New`（新建）文件。在这里，直接在屏幕上的新窗口中输入程序，并将生成的文本保存为单独的文件。这通常被称为源代码文件。习惯做法是，C\
    \ 程序的源代码文件使用扩展名 `.c`，用于 C 编程语言。\n\n## 编译\n我们不能直接执行源文件。为了在任何计算机系统上运行，必须将源代码翻译成计算机中央处理器（例如，奔腾腾微处理器）能够理解的二进制数。这个过程会生成一个扩展名为\
    \ `.obj` 的中间对象文件，它代表 `Object`（对象）。我们可以通过菜单中的 `Project > compile` 或通过组合键 `Alt+F9`\
    \ 来编译 C 源代码文件。\n\n## 链接\n大多数人脑海中浮现出的第一个问题是“为什么链接是必要的？”主要原因是许多编译型语言带有库例程，可以添加到程序中。这些例程由编译器制造商编写，用于执行各种任务，从输入输出到复杂的数学函数。在\
    \ C 语言中，标准输入输出函数包含在一个库文件（`stdio.h`）中，因此是最基本的程序也需要库函数。链接后，文件扩展名为 `.exe`，这是一个可执行文件。我们可以同时通过菜单\
    \ `Debug>Run` 或组合键 `Ctrl+F9` 链接并执行编译后的 C 程序。\n\n## 可执行文件\n现在，我们可以像运行其他应用程序一样运行\
    \ `.exe` 文件，只需在 DOS 提示符处输入它们的名称或使用 Windows 菜单运行即可。\n\n## C 程序的布局\nC 程序的通用形式如下：\n\
    \n```c\n预处理器指令\n全局声明\nmain(){\n    函数 main 函数的局部变量;\n    与函数 main() 相关的语句\n}\n\
    fun1(){\n    函数 fun1 函数的局部变量;\n    与函数 fun1() 相关的语句\n}\nfun2(){\n    函数 fun2 函数的局部变量;\n\
    \    与函数 fun2() 相关的语句\n}\n```\n\n所有 C 程序至少将由一个函数组成，但通常（当你的经验增长时）会编写一个包含多个函数的 C\
    \ 程序。必须存在的函数是名为 `main` 的函数。对于更高级的程序，`main` 函数将作为一个控制函数，依次调用其他函数来完成特定的工作。`main()`\
    \ 函数是 C 程序执行时被调用的第一个函数。\n\n注意括号集 `()` 和 `{}` 的使用。`()` 与函数名结合使用，而 `{}` 用于界定与该函数相关的\
    \ C 语句。还要注意，使用分号（`;`）来结束 C 语句。C 是一种自由格式语言，长语句可以在不被截断的情况下延续到下一行。分号告知 C 编译器语句已经结束。自由格式还意味着你可以根据需要任意数量的空格来提高程序的可读性。\n\
    \n每个初学 C 编程语言的新手都会犯一个非常常见的错误，就是遗漏了分号。C 编译器会将程序的各个行连接在一起，然后尝试理解它们——但它将无法做到这一点。编译器产生的错误信息将与你程序中的某行有关，该行可能距离初始错误有一定的距离。\n\
    \n## 我们的第一个 C 程序\n现在让我们按照如下方式编写我们的第一个 C 程序：\n\n```c\n#include<stdio.h>\n/*main\
    \ function starts here*/\nvoid main(){\n    printf(\"Hello world!\\n\");\n}\n\
    ```\n\n## 逐行解释\n**第 1 行：#include<stdio.h>`**\n作为编译的一部分，C 编译器运行一个名为 C 预处理器的程序。预处理器能够从你的源文件中添加和删除代码。在这种情况下，预处理器指令\
    \ `#include` 告诉编译器包含来自 `stdio.h` 文件的代码。该文件包含了程序需要使用的函数声明。`printf` 函数的声明就在文件中。\n\
    \n**第 2 行：`/*main function starts here*/`**\n这是一个注释。注释是你写在源代码中写给自己或他人的备注。编译器会忽略所有注释。注释主要用于说明源代码的含义和目的，以便我们以后能记住它是如何运行的以及如何使用。你也可以使用注释来临时移除某行代码。只需用注释符号包围这些行。在\
    \ C 语言中，注释的开始由 `/*` 字符指示，由 `*/` 结束。\n\n**第 3 行：`void main()`**\n该语句声明了 `main`\
    \ 函数。C 程序可以包含许多函数，但必须始终有一个 `main` 函数。函数是一个可以完成某些任务的自包含式代码模块。`\"void\"` 指定了 `main`\
    \ 的返回类型。在这种情况下，没有内容返回给操作系统。\n\n**第 4 行：`{`**\n这个左大括号表示 `main` 函数的开始。\n\n**第 5\
    \ 行：`printf(\"Hello world!\\n\");`**\n`printf` 是标准 C 库中的函数，用于将字符串打印到标准输出设备（通常是屏幕）。编译器将这些标准库中的代码与你编写的代码链接，以产生最终的可执行文件。`\\\
    n` 是一个特殊的格式修改符，告诉 `printf` 在行尾打印一个换行符。如果程序中有另一个 `printf`，它将出现在下一行。\n\n**第 6 行：`}`**\n\
    这个右大括号表示 `main` 函数的结束。\n\n将其输入新文件并保存为 `Hello.c`。然后使用编译器进行编译，使用链接器进行链接，最后运行它。输出如下：\n\
    \n## 关于头文件和预处理器指令的说明\n包含内置函数定义的文件被称为头文件。如果我们使用任何输入输出函数或任何内置函数，那么在 main 函数开始之前必须包含相应的头文件。在这里，我们在示例中包含了\
    \ `stdio.h` 头文件，因为基本输出函数 `printf()` 的定义在这里。随着我们的进行，我们将了解其他的头文件。\n\n作为编译的一部分，C\
    \ 编译器运行一个名为 C 预处理器的程序。预处理器指令指示编译器在编译源代码之前做什么。在这种情况下，预处理器指令 `#include` 告诉编译器包含来自\
    \ `stdio.h` 文件的代码。该文件包含了程序需要使用的函数声明。`printf` 函数的声明就在文件中。\n\n已经提到过 C 是一种自由格式语言，你可以按照自己的意愿布局程序并使用尽可能多的空格。唯一的例外是与预处理器指令相关的语句。所有预处理器指令都以\
    \ # 符号开头，不使用分号作为分隔符。所有 C 程序中常见的预处理器指令是：\n`#include<stdio.h>`\n注意文件名周围使用的角括号 `<`\
    \ 和 `>`。这些表示要在系统磁盘中查找头文件，系统磁盘存储了其余 C 程序。我们也可以把上述语句写为：\n`#include \"stdio.h\"`\n\
    双引号表示应在当前工作目录中搜索所需的头文件。当你编写自己的头文件时，这是正确的。但是，标准头文件应该始终带有角括号包裹。\n\n## C 程序的构建块\n\
    现在我们必须开始研究 C 语言的细节。你觉得接下来的部分的难易程度取决于你以前是否编程过——无论用的是什么语言。编程中有许多共同的概念，C 语言也不例外。所以，如果你以前没有编程过，你需要缓慢地阅读接下来的部分，并反复查看，直到理解它为止。学习\
    \ C 编程语言所需的基础知识如下：\n\n"
- fmt: "\n1. Character set\n2. Keywords\n3. Data types\n4. Variables\n5. Constants\n\
    6. Different operators & expressions\n7. Basic I/O statements\n\n## Character\
    \ set\nThe set of characters we can use in C programs are as follows:\n\n| Alphabets\
    \ | `a-z`, `A-Z` |\n| :--- | :--- |\n| Digits | `0-9` |\n| Special symbols | `~`!@#$%^&*()_+{}:”;’<>,./?`\
    \ |\n\n## Keywords\nThere are 32 words defined as keywords in C. these have predefined\
    \ uses and cannot be used for any other purposes such as naming of a variable\
    \ or a constant in a C program. They are always written in lower case. A complete\
    \ list follows which combine with the formal syntax to the form the C programming\
    \ language.\n\n| Auto | Double | Int | Struct |\n| :--- | :--- | :--- | :--- |\n\
    | Break | Else | Long | Switch |\n| Case | Enum | Register | Typedef |\n| Char\
    \ | Extern | Return | Union |\n| Const | Float | Short | Unsigned |\n| Continue\
    \ | For | Signed | Void |\n| Default | Goto | Sizeof | Volatile |\n| Do | If |\
    \ Static | While |\n\n## Data types\nAny C program has two entities to consider,\
    \ the data, and the program. They are highly dependent to one another and careful\
    \ planning of both will lead to a well-planned and well written program. To handle\
    \ the data in a C program we create variables to store values in it and in C it\
    \ is mandatory to mention the type of each of the variables we are going to do\
    \ anything with it prior to the execution of the program. The data types in C\
    \ are classified into four category and they are as follows:![](rsrcE3.jpg)\n\n\
    | Type | Bytes | Range | Precision |\n| :--- | :--- | :--- | :--- |\n| Short int\
    \ | 2 | -32768 to +32768 | |\n| Unsigned short int | 2 | 0 to +65535 | |\n| Unsigned\
    \ int | 4 | 0 to +4294967295 | |\n| Int | 4 | -2147483648 to +2147483648 | |\n\
    | Long int | 4 | -2147483648 to +2147483648 | |\n| Signed char | 1 | -128 to +127\
    \ | |\n| Unsigned char | 1 | 0 to +255 | |\n| Float | 4 | +/- 1E-37..1E+37 | 6\
    \ digits |\n| Double | 8 | +/- 1E-37..1E+37 | 10 digits |\n| Long double | 12\
    \ | +/- 1E-37..1E+37 | 10 digits |\n\nNote : these figures only apply to today’s\
    \ generation of PCs. Mainframes and midrange machines could use different figures,\
    \ but would still comply with the rule above.\n\n## Variables\nA variable is just\
    \ a named area of the main memory that can hold a single value either numeric\
    \ or character. In C it is necessary that you declare the name of each variable\
    \ that you are going to use and its type, before you actually try to do anything\
    \ with it.\n\n### Rule for constructing variable name\n* A variable name may be\
    \ of any length with the combination of digits and alphabets.\n* A variable must\
    \ be of a specific data type.\n* The first character in the variable name must\
    \ be an alphabet.\n* No comma or space or special symbols are allowed within a\
    \ variable name except underscore (`_`).\n* Uppercase and lowercase letters are\
    \ distinct.\n* A keyword cannot be used as a variable name.\n\n```c\nint no1;\
    \ float interest_rate; char choice;\n```\n\n## Constants\nA constant is a value\
    \ that does not change its value during the execution of the program. There are\
    \ three techniques used to define constants in C. They are\n\n1. Using `#define`\n\
    2. Using `const`\n3. Using enumerations\n\n### Using #define\nConstants may be\
    \ defined using the pre-processor directive `#define`. The `#define` directive\
    \ is used as follows:\n```c\n#define BELL '\\a'\n```\nWhenever the constant appears\
    \ in your source file, the pre-processor replaces it by its value. So for instance,\
    \ every `BELL` in your source code will be replaced by `\\a`. The compiler will\
    \ now see the value `\\a` in your source code, not `BELL`. Every `BELL` is just\
    \ replaced by its value. Here is a simple program illustrating the pre-processor\
    \ directive `#define`.\n\n```c\n#include<stdio.h>\n#include<conio.h>\n#define\
    \ BELL '\\a'\nvoid main(){\n    printf(\"Press any key to hear the bell!\");\n\
    \    getch();\n    printf(\"%c\", BELL);\n}\n```\n\n### Using const\nThe second\
    \ technique is to use the keyword `const` when defining a constant variable. When\
    \ used the compiler will catch attempts to modify variables that have been declared\
    \ `const`.\n```c\nconst float PI=3.1428571428571;\n```\nThere are two main advantages\
    \ over the first technique. First, the type of the constant is defined, like here\
    \ `PI` is a `float` type constant. This allows some type checking by the compiler.\
    \ Second the constants are variables with a definition scope. The scope of a variable\
    \ relates to parts of your program in which it is defined.\n\n```c\n#include<stdio.h>\n\
    void main(){\n    const float PI=3.142857142857;\n    float area, perimeter, radius;\n\
    \    printf(\"enter the radius:\");\n    scanf(\"%f\", &radius);\n    area=PI*radius*radius;\n\
    \    perimeter=2*PI*radius;\n    printf(\"Area=%f sq. unit and perimeter=%f unit\"\
    , area, perimeter);\n}\n```\n\n### Using enumerations\nThe third technique to\
    \ declare constants is called enumeration. Enum defines a set of. For example,\
    \ `enum {\"Sun\",\"Tue\",\"Wed\",\"Thur\",\"Fri\",\"Sat\"}`\n\n## Different operators\
    \ & expressions\nOperator is a symbol that operates on certain values.\n\n###\
    \ Types of operators\n1. Arithmetic operators\n2. Relational operators\n3. Logical\
    \ operators\n4. Assignment operators\n5. Increment and decrement operators\n6.\
    \ Conditional operators\n7. Bitwise operators\n8. Comma operator\n9. Other operators\n\
    \n### Arithmetic operators\nThe arithmetic operators perform arithmet operators\
    \ can be classified into unary and binary operations. The following are the list\
    \ of arithmetic operators.\n\n| Operator | Meaning |\n| :--- | :--- |\n| + | Addition\
    \ |\n| - | Subtraction |\n| * | Multiplication |\n| / | Division |\n| % | modulus\
    \ |\n\nNote : C has no operator for exponential operation.\n\n### Relational operators\n\
    The relational operators are used to compare arithmetic, logical and character\
    \ expressions. We often compare two quantities and depending upon that we take\
    \ a decision. So, these comparisons evaluates to 0 (zero) if the condition false\
    \ and 1 if it is true. The operators are as follows:\n\n| Operator | Meaning |\n\
    | :--- | :--- |\n| > | Greater than |\n| < | Less than |\n| >= | Greater than\
    \ or equals to |\n| <= | Less than or equals to |\n| == | Equals to |\n| != |\
    \ Not equals to |\n\n### Logical operators\nThese operators are used to compare\
    \ the logical and relational expressions. The operators are as follows:\n\n| Operator\
    \ | Meaning |\n| :--- | :--- |\n| && | Logical AND |\n| || | Logical OR |\n| !\
    \ | Logical NOT |\n\n### Assignment operators\nGenerally, the `=` symbol is called\
    \ the assignment operator. This operator evaluates the expression on the right\
    \ side and assigns the resulting value to the variable on the left side. The remaining\
    \ assignment operators are the compound assignment operators. They allow useful\
    \ shorthand, where an assignment containing the same left and right-hand sides\
    \ can be compressed and a list of all the compound assignment operators is as\
    \ follow:\n\n| *= | /= | %= | += | = |\n| &= | |= | ^= | >>= | <<= |\n\n### Increment\
    \ and Decrement operators\nThese operators are used to increase or to decrease\
    \ the value of a variable. These are as follows:\n\n| Operator | Meaning |\n|\
    \ :--- | :--- |\n| ++ | Increase the value by 1 |\n| -- | Decrease the value by\
    \ 1 |\n\nNote : these operators manifest into two forms,\n\n1. Postfix/post increment\
    \ or post decrement\nE.g. `j++` means assign the value of `j` and increase the\
    \ value by 1; `k--` means assign the value of `k` and decrease the value by 1\n\
    \n2. Prefix/pre increment or pre decrement\n"
