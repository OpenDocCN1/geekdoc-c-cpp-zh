  trans: "\n\n# 引言\n我们已经看到过二叉树的示例，它们在最优排序的讨论中被考虑过，也被用于说明最优合并的过程。它们都是二叉树，尽管在每种情况下都没有出现节点只有一个孩子的情况。请注意，这与有序树有所不同，因为对于二叉树，我们区分了只有一个左子节点的节点和只有一个右子节点的节点。另一种更“干净”的定义是首先引入终结节点（或“空”节点）的概念，它没有子节点，然后将二叉树定义为除空节点外，每个节点都恰好有两个子节点的树。\n\
    \n完全二叉树是二叉树的一种特殊情况，其中除了最后一层外，所有层都是满的；而在最后一层，任何缺失的节点都位于所有存在节点的右侧。如图所示![](img/rsrc2RD.jpg)\n\
    \n## 示例\n给出一个基于数组 `A` 的完全二叉树的空间高效实现方法。描述如何从父节点找到它的两个子节点，反之亦然。\n\n### 解法\n一个显而易见的方法是不浪费空间，它将树的根存储在\
    \ `A[1]` 中；两个子节点存储在 `A[2]` 和 `A[3]` 中，下一代存储在 `A[4]` 到 `A[7]`，依此类推。元素 `A[k]` 的孩子位于\
    \ `A[2k]` 和 `A[2k+1]`（前提是它们都存在），而节点 `A[k]` 的父节点位于 `A[k/ 2]`。因此，可以非常高效地遍历树。\n\n\
    # 链表\n链表是存储数据的一种更好的方式。链表是一种特殊的 `struct`，它包含一个指向相同类型结构体的指针。例如，让我们通过添加一个名为 `next`\
    \ 的新指针将我们的 `studentInfo` 结构体转换为链表。该指针将指向列表中的下一个元素。\n\n```c\nstruct studentInfo{\n\
    \    char name[32];\n    char teacher[32];\n    int age;\n    studentInfo * next;\n\
    }\n```\n\n记住 `*` 表示指针，所以每个 `studentInfo` 现在都有一个指向另一个 `studentInfo` 的指针。如果这个指针被设置为\
    \ `0` 或 `NULL`，那么我们一定处于列表末尾。这时，我们只需要保留一个指向列表中第一个结构体的指针即可：\n\n```c\nstudentInfo\
    \ * student_list;\n```\n\n该结构体将有一个指向下一个结构体的指针，下一个又有一个指向后续的指针，依此类推。\n\n## 遍历整个列表\n\
    记得 `printStudent` 函数吗？它接收一个 `studentInfo` 并打印出所有信息。现在，让我们用它创建一个新函数 `printAllStudents`，它会打印列表中每个学生的信息。\n\
    \n```c\nvoid printAllStudents (void){\n    /*这是一个指向列表中当前项的指针 */\n    struct studentInfo\
    \ * current = student_list;\n    if (current!=0){\n        /*如果列表不为空……*/\n   \
    \     /*从列表顶部开始，一直到末尾，当 current==0 时*/\n        while(current!=0){\n         \
    \   printStudent(current);\n            current = current->next;\n        }\n\
    \    }else{\n        printf(“Error: no students have been entered yet\\n”);\n\
    \    }\n}\n```\n\n## 向列表添加数据\n现在让我们来看名为 `addStudent` 的函数。它允许用户输入新学生的数据。这个新学生被添加到列表的顶部。它的\
    \ `next` 指针指向列表旧的顶部。\n\n```c\nvoid addStudent(void){\n    printf(“creating a new\
    \ student…\\n”);\n    studentInfo *temp = (struct studentInfo*) malloc(sizeof(struct\
    \ studentInfo));\n    printf(“Enter student name”);\n    gets(temp->name);\n \
    \   printf(“Enter the student’s teacher”);\n    gets(temp->teacher);\n    printf(“Enter\
    \ the student’s age”);\n    char buffer[18];\n    gets(buffer);\n    temp->age\
    \ = atoi(buffer);\n    printf(“Adding student %s to the list…”, temp->name);\n\
    \    /*next 指针指向列表旧的顶部*/\n    temp->next = student_list;\n    /*列表顶部现在指向 temp*/\n\
    \    student_list = temp;\n    printf(“Done\\n”);\n}\n```\n\n## 搜索列表\n要搜索列表，我们从顶部开始顺着\
    \ `next` 指针移动直到直到我们要找的数据。如果在找到数据之前到达了列表末尾，则说明搜索失败——数据在列表中不存在。这是一个名为 `getStudentInfo`\
    \ 的示例。它要求用户输入一个名字，并在列表中搜索该学生。然后它打印出关于该学生的所有信息。\n\n```c\nvoid getStudentInfo(void){\n\
    \    printf(“Enter the name of the student:”);\n    char search[32];\n    int\
    \ found = 0;\n    gets(search);\n    printf(“searching the list…”);\n    /*从列表顶部开始*/\n\
    \    struct studentInfo*current = student_list;\n    /*当我们不在列表末尾，且还没有找到数据时*/\n\
    \    while((current!=0) && !found){\n        /*如果当前项的名字与我们正在找的名字匹配……*/\n     \
    \   if(!strcmp(current->name, search)){\n            found = 1; \n           \
    \ /*那么我们完成了*/\n        }else{\n            current = current->next; \n       \
    \     /*否则我们尝试列表中的下一个项*/\n        }\n    }\n    printf(“Done\\n”);\n    if(current!=0)\
    \ \n    /*如果我们找到了一个学生……*/\n    {\n        printStudent(current); \n        /*……就打印信息*/\n\
    \    }else{\n        printf(“No student by that name exists in the database.\\\
    n”);\n    }\n}\n```\n\n# 附录 A\n常用的头文件：\n\n| stdio.h | 输入/输出 |\n| --- | --- |\n\
    | lib.h | 通用工具 |\n| string.h | 字符串处理 |\n| time.h | 数据时间 |\n\n标准定义：\n| stddef.h\
    \ | 标准类型 |\n| limits.h | 实现限制 |\n| float.h | 浮点数 |\n| errno.h | 错误处理 |\n\n更高级的头文件：\n\
    | stdarg.h | 可变参数 |\n| setjmp.h | 非局部跳转 |\n| signal.h | 信号 |\n| locale.h | 本地化\
    \ |\n\n预处理器指令列表：\n| #include | #define | #if | #else |\n| #elif | #endif | #ifdef\
    \ | #ifndef |\n| #undef | #pragma | #line | #error |\n\n# 附录 B\n关键字说明：\n\n| 关键字\
    \ | 描述 |\n| --- | --- |\n| asm | 表示内联汇编 |\n| auto | 默认存储类 |\n| break | 用于 for、while、switch\
    \ 的退出 |\n| case | 用于 switch 语句内部 |\n| char | 最简单的数据类型 |\n| const | 防止变量改变的修饰符见\
    \ volatile |\n| continue | 重置 for、while 到下一次迭代 |\n| default | 用于 switch 语句捕获未指定的实例\
    \ |\n| do | 与 while 语句结合使用的命令。循环至少执行一次 |\n| double | 可以存储双精度浮值的数据类型 |\n| else\
    \ | 当 if 语句为假时执行替代语句 |\n| enum | 允许变量接受特定值的数据类型 |\n| extern | 表示变量将在程序的其他区域定义的修饰\
    \ |\n| float | 用于浮点数的数据类型 |\n| for | 包含初始化、增量和条件的循环命令 |\n| goto | 跳转到预定义的标签 |\n\
    | If | 根据真/假判断改变程序流 |\n| int | 用于存储整数的数据类型 |\n| long | 用于存储比 int 更大的整数 |\n| register\
    \ | 指定变量尽可能存储在寄存器中 |\n| return | 使程序流退出当前函数并返回调用函数。它也可以返回单个值 |\n| short | 用于存储整数的数据类型。它不常用，在大多数计算机上与\
    \ int 大小 |\n| signed | 表示变量可以具有正负值的修饰符见 unsigned |\n| sizeof | 返回项以字节为单位的大小运算符\
    \ |\n| static | 表示编译器应保留变量值的修饰符 |\n| struct | 用于将任何数据类型的 C 变量组合在一起的关键字 |\n| switch\
    \ | 用于在多个方向上改变程序流的命令。与 case 语句结合使用 |\n\n"
