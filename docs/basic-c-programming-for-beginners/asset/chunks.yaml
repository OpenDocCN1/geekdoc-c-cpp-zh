    ## Chapter 1: Programming Development Cycle

    A program is a set of instruction to be executed by the computer to accomplish
    a particular task. It is a multi-step process involving identification and definition
    of a problem, developing computer solutions for the same and preparing a sequence
    of instruction that can be run on the computer. While writing a program one has
    to take care of data which the program will process and generate information.


    ### Steps in programming process

    The programming process is a set of activities and is carried out to develop and
    implement a computer program. Writing a program comprises of the six activities
    listed below:


    1. Understanding program specification.

    2. Design a program model

    3. Determine correctness of the program

    4. Code the program

    5. Test and debug the program

    6. Document the program

