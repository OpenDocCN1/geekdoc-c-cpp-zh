- fmt: "\n## 1. No argument and no return\nIn this type of function there is no formal\
    \ argument and the function returns no value. e.g.\n```c\nmain(){void test(void);test();}void\
    \ test(void){printf(“this is an example of no argument no return”)}\n```\n\n##\
    \ 2. No argument with return value\n```c\n#include<stdio.h>\nmain(){\n    int\
    \ test(void);\n    int max;\n    max=test();\n    printf(“The maximum of the two\
    \ is : %d”, max);\n}\nint test(void){\n    int x, y;\n    printf(“Enter 1 st no.:”);\n\
    \    scanf(“%d”, &x);\n    printf(“Enter 2 nd no.:”);\n    scanf(“%d”, &y);\n\
    \    return(x>y?x:y);\n}\n```\n\n## 3. With argument with return value\n```c\n\
    #include<stdio.h>\nmain(){\n    int test(int, int);\n    int x, y, max;\n    printf(“Enter\
    \ 1 st no.:”);\n    scanf(“%d”, &x);\n    printf(“Enter 2 nd no.:”);\n    scanf(“%d”,\
    \ &y);\n    max=test(x,y);\n    printf(“The maximum of the two is %d”, max);\n\
    }\nint test(int a, int b){\n    return(a>b?a:b);\n}\n```\n\n## 4. With argument\
    \ with no return value\n```c\n#include<stdio.h>\nmain(){\n    void test (int,\
    \ int);\n    int x, y;\n    printf(“Enter 1 st no.:”);\n    scanf(“%d”, &x);\n\
    \    printf(“Enter 2 nd no.:”);\n    scanf(“%d”, &y);\n    test(x,y);\n}\nvoid\
    \ test(int a, int b){\n    int max;\n    max=a>b?a:b;\n    printf(“The maximum\
    \ of the two is: %d”, max);\n}\n```\n\n## Calling a function\nA function gets\
    \ called when a semicolon follows the function name. we can call a function by\
    \ two ways.\n\n### 1. Call by value\nWhenever we call a function and pass something\
    \ to it we have always passed the “values” of the variables to the called function.\
    \ Such function calls are called “call by value”. Even if any changes done in\
    \ “called” function it does not affect the actual argument.\n```c\n#include<stdio.h>\n\
    main(){\n    void swap(int, int);\n    int a=10, b=20;\n    swapv(a, b);\n   \
    \ printf(“\\n a=%d b=%d”, a, b);\n}\nvoid swapv(int x, int y){\n    int t;\n \
    \   t=x;\n    x=y;\n    y=t;\n    printf(“\\n x=%d y=%d”, x, y);\n}\n```\nNote:\
    \ the values of `a` and `b` remains unchanged even after exchanging the values\
    \ of `x` and `y`.\n\n### 2. Call by reference\nUsually in C programming language\
    \ we make a call by value. This means in general we cannot alter the value of\
    \ actual arguments. But, if desired, it can always be achieved through a call\
    \ by reference. In this method the address of actual arguments of the calling\
    \ function are copied into the formal arguments of the called function. Here,\
    \ we send the address of variables instead of the value of variables and if there\
    \ are any changes done within the called function it affects on the actual arguments\
    \ also, which are within calling function.\n```c\n#include<stdio.h>\nmain(){\n\
    \    void swapr(int *, int *);\n    int a=10, b=20;\n    swapr(&a, &b);\n    printf(“\\\
    n a=%d b=%d”, a, b);\n}\nvoid swapr(int *x, int *y){\n    int t;\n    t=*x;\n\
    \    *x=*y;\n    *y=t;\n}\n```\nNote: in this program we manage to exchange the\
    \ values of `a` and `b` using their address stored in `x` and `y`. Using a “call\
    \ by reference” method intelligently we can make a function return more than one\
    \ value at a time, which is not possible in case of “call by value”.\n"
