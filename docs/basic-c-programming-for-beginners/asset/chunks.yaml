    \n记住，多维数组的每个维度都使用一组括号进行声明。例如，以下语句声明了一个包含八个 `int` 类型变量的二维数组：\n\n```c\nint multi[2][4];\n\
    ```\n\n你可以将数组可视化为具有行和列结构——在这种情况下，为两行四列。然而，还有另一种可视化多维数组的方法，这种方式更接近 C 语言实际处理数组的方式。你可以将\
    \ `multi` 视为一个包含两个元素的数组，其中这两个元素每一个都是一个包含四个整数的数组。\n\n以下是该声明各部分的解释方法：\n\n1. 声明一个名为\
    \ `multi` 的数组。\n2. 数组 `multi` 包含两个元素。\n3. 这两个元素中的每一个都包含四个元素。\n4. 这四个元素中的每一个都是\
    \ `int` 类型。\n\n与一维数组一样，多维数组名是指向第一个数组元素的指针。继续我们的示例，`multi` 是指向声明为 `int multi[2][4]`\
    \ 的二维数组的第一个元素的指针。`multi` 的第一个元素究竟是什么？它并不是你可能想的 `int` 类型变量 `multi[0][0]`。记住，`multi`\
    \ 是一个数组的数组，所以它的第一个元素是 `multi[0]`，这是一个包含四个 `int` 类型变量的数组（`multi` 中包含的两个此类数组之一）。\n\
    \n现在，如果 `multi[0]` 也是一个数组，它指向任何东西吗？是的，确实！`multi[0]` 指向它的第一个元素 `multi[0][0]`。你可能会奇怪为什么\
    \ `multi[0]` 是一个指针。记住，数组名在不带括号的情况下是指向第一个数组元素的指针。术语 `multi[0]` 是数组 `multi[0][0]`\
    \ 的名称，只是缺少了最后一对括号，因此它符合指针的定义。\n\n如果你在此处感到有些困惑，不要担心。这些内容很难理解。如果你能记住任何适用于代码中使用的任何\
    \ $n$ 维数组的以下规则，可能会有所帮助：\n\n*   数组名后跟 $n$ 对括号（当然，每对括号包含一个适当的索引）求结果为数组数据（即数据存储在指定的数组元素中）。\n\
    *   数组名后跟少于 $n$ 对括号的求结果为指向数组元素的指针。\n\n因此，在示例中，`multi` 的求值为指针，`multi[0]` 的求值为指针，而\
    \ `multi[0][0]` 的求值为数组数据。\n\n现在看看所有这些指针实际上指向什么。在这里，我们声明了一个与我们在示例中使用的相似的二维数组，然后打印关联指针的值。它还打印了第一个数组元素的地址。\n\
    \n## 多维数组与指针之间的关系\n\n```c\n#include<stdio.h>\n#include<conio.h>\nint multi[2][4];\n\
    main(){\n    printf(\"\\nmulti=%u\", multi);\n    printf(\"\\nmulti[0]=%u\", multi[0]);\n\
    \    printf(\"\\&multi[0][0]=%u\\n\", &multi[0][0]);\n    return 0;\n}\n```\n\n\
    ## 使用指针的简单示例\n\n```c\n#include<stdio.h>\n#include<conio.h>\nmain(){\n    float\
    \ a=10;\n    float *points_to_a=&a;\n    printf(\"The value in a:%f\\n\", a);\n\
    \    printf(\"The value pointed to by points_to_a:%f\\n\", *points_to_a);\n  \
    \  printf(\"The value of points_to_a in hex:%x\\n\", points_to_a);\n    printf(\"\
    The value of points_to_a as an integer:%d\\n\", points_to_a);\n    printf(\"The\
    \ value of points_to_a as a float:%f\\n\", points_to_a);\n    *points_to_a=-10;\n\
    \    printf(\"The value pointed to by points_to_a:%f\\n\", *points_to_a);\n  \
    \  printf(\"The value of points_to_a in hex:%x\\n\", points_to_a);\n    printf(\"\
    The value of points_to_a as an integer:%d\\n\", points_to_a);\n    printf(\"The\
    \ value of points_to_a as a float:%f\\n\", points_to_a);\n    exit(0);\n}\n```\n\
    \n注意，指针如果被当作 float 打印是完全无意义的；作为整数打印，或者以十六进制打印，的是它所指向的内容。即使你改变了它指向的内容，它也没有改变。当你改变了\
    \ `a` 的值，它改变了。\n\n## 指针操作\n\n| 操作 |  |\n| :--- | :--- |\n| 赋值 | 你可以给指针赋值。该值应该是通过地址运算符或数组名获取的地址。\
    \ |\n| 间接 | 间接运算符 `*` 给出指向的位置的值。 |\n| 地址 | 你可以使用地址运算符 `&` 获取指针的地址，以便你可以拥有指针的指针。\
    \ |\n| 递增 | 你可以增加指针的整数以指向不同的内存位置。 |\n| 递减 | 你可以从指针减去一个整数以指向不同的内存位置。 |\n| 偏移 |\
    \ 你可以从指针减去一个整数以指向不同的内存位置。 |\n| 比较 | 仅适用于指向同一个数组的指针。 |\n\n## 字符串\n\n正如一组整数可以存储在整数数组中一样，一组字符也可以存储在字符数组中。这些字符数组经常被称为“字符串”。\n\
    \n字符串常量是一个由“NULL”字符（\\0`）终止的一维字符数组。例如，`char name[] = {‘P’,'I’,'O’,'N’,'E’,'E’,'R’,'\\\
    0’};`；数组中的每个字符占用一个字节内存，最后一个字符总是 NULL (\\0) 字符。尽管它看起来是两个相邻字符，但实际上只有一个字符。`\\` 表示其后面的是特殊字符。注意\
    \ `\\0` 和 `0` 相同。`\\0` 的 ASCII 值为零，而 `0` 的 ASCII 值为 48。下图显示了字符数组在内存中的存储方式。\n\n\
    | 字符-> | P | I | O | N | E | E | R | \\0 |\n| :--- | :--- | :--- | :--- | :---\
    \ | :--- | :--- | :--- | :--- |\n| 内存地址-> | 3000 | 3001 | 3002 | 3003 | 3004 |\
    \ 3005 | 3006 | |\n\n"
- fmt: "\nNote that the elements of the character array are stored in contiguous memory\
    \ location. The terminating NULL character is important. Because, it is the only\
    \ way a function that works with a string can know where the string ends. In fact\
    \ a string not terminated by a `\\0` (NULL) character is not really a string,\
    \ but merely a collection of characters.\n\nC concedes the fact that we will use\
    \ string very often and hence provides a shortcut process for initializing a string.\
    \ For example the string used above can also be initialized as, `char name[] =\
    \ “PIONEER”;`;note that, here declaring the `\\0` character explicitly is not\
    \ necessary; the declaration itself inserts the NULL character automatically.\n\
    \n## More about strings\n\nHere is a C program to demonstrate printing of a string:\n\
    \n```c\nmain(){\n    char name[] = “pioneer”;\n    int i = 0;\n    while (i<7)\n\
    \        printf(“%c”, name[i]);\n        i++;\n}\n```\nAnd here is the output:\
    \ `pioneer`\n\nHere, we have initialized a character array and then printed out\
    \ the elements of this array using a `while` loop. We can also do it in a different\
    \ way, like:\n\n```c\nmain(){\n    char name[] = “pioneer”;\n    int i=0;\n  \
    \  while(name[i]!=”\\0”){\n        printf(“%c”, name[i]);\n        i++;\n    }\n\
    }\n```\nAnd the output is the same as the previous. This program doesn’t rely\
    \ on the number of characters that are in the string; rather it checks the content\
    \ of the array elements and points it accordingly. So, this program is more general\
    \ than the earlier one.\n\nThe format specifier `\"%s` is used in `printf()` function\
    \ for printing out a string. The same specifier is used in the `scanf()` function\
    \ to receive a string from the keyboard. e.g.\n\n```c\nmain(){\n    char name[30];\n\
    \    printf(“Enter your name:”);\n    scanf(“%s”, name);\n    printf(“Hello %s”,\
    \ name);\n}\n```\nAnd a sample output of the above program is:\n`Enter your name:\
    \ KumarJanglu`\n`Hello KumarJanglu`\n\nNote that here the declaration `char name[30]`\
    \ sets aside 30 bytes under the array `name`, whereas the `scanf()` function fills\
    \ in the characters typed at keyboard into this array until the “enter” or Return\
    \ key is pressed. Once the Enter or Return key is pressed, `scanf()` inserts a\
    \ `\\0` (NULL) character into the array immediately after the characters typed\
    \ from the keyboard. While entering the string using `scanf()` we must by cautious\
    \ about two things:\n\n1. The length of the string should not exceed the dimension\
    \ of the character array. This is because C compiler doesn’t perform bounds checking\
    \ on character arrays. So, if we exceed the bounds there is always a chance of\
    \ overwriting something important which is in the memory.\n\n2. Generally the\
    \ `scanf()` function is not capable of receiving multiword strings. String like\
    \ “Kumar Janglu” therefore would be unacceptable. The way to get around this limitation\
    \ is either by using `scanf()` function in a different ways or by using the function\
    \ `gets()`. See the examples given below:\n"
