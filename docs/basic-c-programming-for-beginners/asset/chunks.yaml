  trans: "\n\n例如 `++j` 表示将值加 1 并赋值；`--k` 表示将值减 1 并对 `k` 的值赋值。\n\n### 条件运算符\n该运算符由两个符号组成：问号（`?`）和冒号（:`）。它包含三个部分——文本表达式、真部分和假部分，如\
    \ `text expression ? true part : false part`。它根据测试表达式将真部分的值或假部分的值赋值给变量。\n\n`i=(j>5)?2:3`\n\
    这里如果 `j` 的值大于 5，则将 `2` 赋值给 `i`，否则赋值 `3`。\n\n### 位运算符\n这些运算符对数据的每一位进行操作。它们用于位测试、取反或将位右移或左移。它们如下：\n\
    \n| 运算符 | 含义 |\n| :--- | :--- |\n| `&` | 按位与 |\n| `|` | 按位或 |\n| `^` | 按位异或 |\n\
    | `<<` | 按位左移 |\n| `>>` | 按位右移 |\n| `~` | 按位取反 |\n\n### 逗号运算符\n该运算符用于分隔一组变量。`,`\
    \ 符号被称为逗号运算符。\n\n### 其他运算符\n`sizeof()` 运算符返回变量数据类型的大小，或者变量在内存中所占据的字节数。成员选择运算符（`.`\
    \ 和 `->`）用于结构体和联合体。指针运算符（`*`）、地址运算符（`&`）、数组下标（`[]`）、`(类型强制转换)` 等。\n\n以下列出了所有 C\
    \ 运算符，按其优先级（从高到低）排序。它们的结合性表示表达式中等优先级相同的运算符的执行顺序。\n\n| 运算符 | 描述 | 结合性 |\n| :---\
    \ | :--- | :--- |\n| `()[] .->` | 括号（表达式分组）括号（数组下标）通过对象名选择成员通过通过指针选择成员 | 从左到右\
    \ |\n| `++ -- + ! ~ (type)* & Sizeof` | 一元前增/前减 一元正/负 一元逻辑取反/按位取反 一元强制转换（更改类型）解引用\
    \ 地址 确定字节大小 | 从右到左 |\n| `. / %` | 乘/除/取模 | 从左到右 |\n| `+ -` | 加/减 | 从左到右 |\n| `<<\
    \ >>` | 按位左移，按位右移 | 从左到右 |\n| `< <=> >=` | 关系小于/小于或等于 关系大于/大于或等于 | 从左到右 |\n| `==\
    \ !=` | 关系等于/不等于 | 从左到右 |\n| `&` | 按位与 | 从左到右 |\n| `^` | 按位异或 | 从左到右 |\n| `|`\
    \ | 按位或 | 从左到右 |\n| `&&` | 逻辑与 | 从左到右 |\n| `||` | 逻辑或 | 从左到右 |\n| `? :` | 三元条件运算符\
    \ | 从左到右 |\n| `= += -= *= /=%= &=^= |= <<= >>=` | 赋值 加/减赋值 乘法/除法赋值 取模/按位与赋值 按位异或/或赋值\
    \ 按位左移/右移赋值 | 从左到右 |\n| `,` | 逗号（分隔表达式） | 从左到右 |\n\n### 基础输入输出语句\n通常 I/O，输入和输出是任何程序的重要部分。为了执行任何有用操作，你的程序需要能够接受输入数据并报告结果。在\
    \ C 中，标准库提供了输入输出的例程。标准库有处理输入、输出以及字符和字符串处理的函数。这里，描述的所有输入函数都从标准输入读取，的所有输出函数都写入标准输出。标准输入通常是键盘。标准输出通常是显示器。\n\
    \n#### 格式化输出\n`printf()`：这是一个用于输出的多功能函数。它可以处理任何基本数据类型，并提供了几种方法，让我们指定数据的显示方式。\n\
    \n```c\nprintf(\"%d\", x);\nprintf(\"%d %d %f\", x, y, z);\n```\n\n`scanf()`：这是一个从键盘获取输入的非常有用的函数。它可以处理任何基本数据类型，并提供一次性从键盘获取多个值。\n\
    \n```c\nscanf(\"%d\", &x);\nscanf(\"%d %d %f\", &x, &y, &z);\n```\n\n#### 在 C\
    \ 程序中使用 printf() 函数\n```c\n#include<stdio.h>\nmain() {\n    printf(\"this is an\
    \ example of something printed!\");\n    return 0;\n}\n```\n\n#### 在 C 程序中使用 scanf()\
    \ 函数\n```c\n#include<stdio.h>\nmain() {\n    float y;\n    int x;\n    puts(\"\
    enter a float, then an int\");\n    scanf(\"%f%d\", &y, &x);\n    printf(\"\\\
    nYou entered %f and %d\", y, x);\n    return 0;\n}\n```\n\n#### 使用 int 和 printf()\
    \ 的另一个 C 程序\n```c\n#include<stdio.h>\nMain() {\n    int a, b, average;\n    a\
    \ = 10;\n    b = 6;\n    average = (a+b)/2;\n    printf(\"Here \");\n    printf(\"\
    is \");\n    printf(\"the \");\n    printf(\"answer \");\n    printf(\"\\n \"\
    );\n    printf(\"%d \", average);\n}\n```\n\n#### 演示 scanf() 的简单程序\n```c\n#include<stdio.h>\n\
    Main() {\n    int a, b, c;\n    printf(\"\\nThe first number is \");\n    scanf(\"\
    %d\", &a);\n    printf(\"\\nThe second number is \");\n    scanf(\"%d\", &b);\n\
    \    c = a+b;\n    printf(\"The answer is %d\\n\", c);\n}\n```\n\n### C 中的控制结构\n\
    ### 简介\n控制结构决定了 C 程序中各种指令的执行顺序。换句话说，它们决定了程序的流程。控制结构如下：\n\n1. 顺序控制结构\n2. 条件分支结构\n\
    3. 无条件分支结构\n4. 循环结构\n\n#### 顺序控制结构\n这种控制结构确保指令按照在 C 程序中出现的顺序执行。\n\n#### 条件分支结构\n\
    这种控制结构允许我们决定执行哪些指令。决策结构如下：\n\n1. if 结构\n语法：`if (condition){statements}`\n这里，如果给定的条件为真，则将执行括号内的语句。如果只有一个语句，则不需要写括号。\n\
    例如：`if (i>5)printf(\"The value of i is greater than 5\");`\n\n2. if-else 结构\n\
    语法：`if (condition){statements;}else{statements}`\nif 语句本身在条件为真时执行单个或一组语句，在条件为假时什么都不做。else\
    \ 语句的目的是即使条件为假也执行其后面写的语句集。如果只有一个语句，则不需要写括号。\n例如：`if(i>5)printf(\"The value of\
    \ i is greater than 5\");elseprintf(\"The value of i is less than or equal to\
    \ 5\");`\n\n3. 嵌套 if 结构\n如果我们将整个 if 或 if-else 结构写在 if 语句体或 else 语句体内，这就被称为嵌套 if\
    \ 结构。\n语法：`if(condition){statements;if(condition)}`\n例如：`if(j>5)if(j>10){printf(\"\
    The value of i is greater than 5 and\");printf(\"The value of j is greater than\
    \ 10.\");};`\n\n4. switch-case 结构\n\n"
- fmt: "\n# switch Statement\n\nSyntax:\n```c\nswitch(expression){\n    case value1:\
    \ statements;\n        break;\n    case value2: statements;\n        break;\n\
    \    ...\n    default: statements;\n        break;\n}\n```\nIt is also known as\
    \ multi-way branching statement. It consists of an expression in ``switch` and\
    \ the constant values in ``case` statements. This structure can have any number\
    \ of `case` statements based on the values of the given `expression`. If the `expression`\
    \ in ``switch` statement matches with any of the constant values in the ``case`\
    \ statement, then the statement—the statement after the ``case` statement—will\
    \ be executed. But, if any of the constant values does not match with the given\
    \ `expression` then the statement written in the ``default` section will be executed.\
    \ A `break` statement is necessary at the end of each ``case` and also in the\
    \ ``default` section. In this structure the ``default` section is totally optional.\n\
    \ne.g.\n```c\nswitch (n) /*here n is a variable*/{\n    case 0: printf(“Value\
    \ of n is 0”);break;\n    case 1: printf(“Value of n is 1”);break;\n    ...\n\
    \    case 9: printf(“Value of n is 9”);break;\n    default: printf(“Value of n\
    \ is not between 0-9”);break;\n};\n```\n\n## Unconditional Branching Statements\n\
    \nGenerally it should not be supported as it makes the user confuse about the\
    \ program because it moves the control to another location. These statements should\
    \ be used only within the control statements, otherwise the user may not get perfect\
    \ requirement. There are three types of unconditional branching statements and\
    \ they are,\n\n### 1. goto\n\nSyntax:\n```c\ngoto<label-name>;\n...\n<label>:\n\
    ...\n```\nIt moves the control to the required statement based on the label name.\
    \ Same label name with ``goto` statement should not be used twice. Label name\
    \ can be used before or after the ``goto` statement.\n\ne.g.\n```c\nif(j>5) goto\
    \ lb1;\nlb1;\nprintf(“Value of j is greater than 5”);\n```\n\n### 2. continue\n\
    \nSyntax:\n```c\ncontinue\n```\nThe block of statement will be executed continuously\
    \ without breaking the loop in a loop structure.\n\ne.g.\n```c\nk=0;\nwhile(k<5){\n\
    \    printf(“This is an example”);\n    printf(“of continue statement!”);\n  \
    \  continue;\n    k++;\n}\n```\n\n### 3. break\n\nSyntax:\n```c\nbreak;\n```\n\
    It is used to move the control to the outside of a control structure.\n\ne.g.\n\
    ```c\nk=0;\nwhile(k<5){\n    printf(“This is an example”);\n    printf(“of a break\
    \ statement!”);\n    break;\n    k++;\n}\n```\n\n## Loop Control Structure\n\n\
    The versatility of a computer lies in its ability to perform a set of instructions\
    \ repeatedly. This involves some portion of the program executes either a specified\
    \ number of times or until a particular condition is satisfied. This type of repetitive\
    \ operation is done through loop control structure. The three methods are as follows:\n\
    \n### 1. while loop structure\n\nSyntax:\n```c\nwhile(condition){\n    statements;\n\
    }\n```\nHere all the block statements will be executed as long as the given `condition`\
    \ is true. Once the condition becomes false the control exits from the ``while`\
    \ structure. We can also use nested ``while` loop if necessary.\n\ne.g.\n```c\n\
    x=0;\nwhile(x<5){\n    printf(“This is an example”);\n    printf(“of while loop\
    \ structure!”);\n    x++;\n}\n```\n\n### 2. do-while loop structure\n\nSyntax:\n\
    ```c\ndo{\n    statements;\n}\n```\nThere is a minor difference between the working\
    \ style of ``while` and ``do while` loop. This difference is the place where the\
    \ condition is tested. The ``while` tests the given condition before executing\
    \ any of the statement within the loop, whereas ``do while` tests the given condition\
    \ after executing the statements within the loop at least for once. Here all the\
    \ block statements will be executed at least for once even if the given condition\
    \ is false. We can also use nested ``do while` loop if necessary.\n\ne.g.\n```c\n\
    z=5;\ndo{\n    printf(“This is an example”);\n    printf(“of do-while loop structure!”);\n\
    \    z++;\n}\n```\n\n### 3. for loop structure\n\nSyntax:\n```c\nfor(initialize;condition;increment/decrement){\n\
    \    statements;\n}\n```\nThere are three parts in a ``for` loop:\n\n1.  **initialization\
    \ part**, where we can initialize any variable, like `a=0` or `b=5`, etc.\n2.\
    \  **the condition part**, where it is tested that the given condition is true\
    \ or false. As long as the given condition remains true, all the statements within\
    \ the loop will be executed.\n3.  **Increment/decrement part**, where we can increase\
    \ or decrease the value of a variable of our choice.\n\ne.g.\n```c\nfor(j=0;j<10;j++){\n\
    \    printf(“This is an example”);\n    printf(“of for loop structure”);\n}\n\
    ```\n\n## Examples\n\n### The do while loop and a 100 Hello Worlds\n```c\n#include<stdio.h>\n\
    main(){\n    int count;\n    count=0;\n    do{\n        ++count;\n        Printf(“Hello\
    \ World!\\n”);\n    }While(count<100);\n}\n```\n\n### This program demonstrates\
    \ the for loop\n```c\n#include<stdio.h>\nmain(){\n    int fahr;\n    for(fahr=0;fahr<=300;fahr=fahr+20)\n\
    \    printf(“%4d%6.1f\\n”, fahr, (5.0/9.0)*(fahr-32));\n}\n```\n\n### This program\
    \ demonstrates the while loop\n```c\n#include<stdio.h>\nMain(){\n    Int lower,\
    \ upper, step;\n    Float fahr, Celsius;\n    Lower=0;\n    Upper=300;\n    Step=20;\n\
    \    Fahr=lower;\n    While(fahr<=upper){\n        Celsius=(5.0/9.0)*(fahr-32.0);\n\
    \        Printf(“%d.0f%6.1f\\n”, fahr, celsius);\n        Fahr=fahr+step;\n  \
    \  }\n}\n```\n\n### This program demonstrates the if statement\n```c\n#include<stdio.h>\n\
    main(){\n    int a, b;\n    do{\n        printf(“\\nEnter first number:”);\n \
    \       scanf(“%d”, &a);\n    } // (Note: original text was incomplete here)\n\
    ```\n\n### This program demonstrates the if-else block\n```c\n#include<stdio.h>\n\
    main(){\n    int num1, num2;\n    printf(“Enter the first number”);\n    scanf(“%d”,\
    \ &num1);\n    printf(“Enter the second number”);\n    scanf(“%d”, &num2);\n \
    \   if(num2==0)\n        printf(“\\nCannot divide by zero\\n”);\n    else\n  \
    \      printf(“\\nAnswer is %d\\n”, num1/num2);\n}\n```\n\n### A simple program\
    \ to show continue\n```c\n#include<stdio.h>\nmain(){\n    int x;\n    for (x ;\
    \ x<=100; x++){\n        if (x%2) continue;\n        printf(“%d\\n”, x);\n   \
    \ }\n}\n```\n\n### This program jumps out of an infinite loop using break\n```c\n\
    #include<stdio.h>\nmain(){\n    int t;\n    for ( ; ; ){\n        scanf(“%d”,\
    \ &t);\n        if (t==10) break;\n    }\n    printf(“End of infinite loop.\\\
    n”);\n}\n```\n\n### This program demonstrates the switch statement\n```c\n#include<stdio.h>\n\
    main(){\n    int i;\n    printf(“Enter a number between 1 and 4”);\n    scanf(“%d”,\
    \ &i);\n    switch(i){\n        case 1: printf(“One”);break;\n        case 2:\
    \ printf(“Two”);break;\n        case 3: printf(“three”);break;\n        case 4:\
    \ printf(“Four”);break;\n        default: printf(“Unrecognized number”);\n   \
    \ }\n}\n```\n\n## Function\n\nA function is a self-contained block of statements\
    \ that perform coherent tasks of some kind. Every C program can be thought of\
    \ a collection of functions. A C program can contain any number of functions,\
    \ as there is no upper limit, but it must have at least one function i.e. the\
    \ `main()` function.\n\n### Declaring functions\nDeclaration : the point at which\
    \ a name has a type associated with it. \nDefinition : also a declaration, but\
    \ at this point some storage is reserved for the named object. The rules for what\
    \ makes a declaration into a definition can be complicated, but are easy for functions.\
    \ You turn a function declaration into a definition by providing a body for the\
    \ function in the form of a compound statement.\n\n### Formal parameters\nThe\
    \ names used inside a function to refer to its arguments.\n\n### Actual arguments\n\
    The values used as arguments when the function is actually called. In other words,\
    \ the values that the formal parameters will have on entry to the function.\n"
