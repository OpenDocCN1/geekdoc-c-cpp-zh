    function counts the number of characters present in a string excluding the NULL
    character. Usage of this function is illustrated in the following program.main(){int
    len1, len2, len3;char arr1[] = “Kumar Janglu”;char arr2[30];len1 = strlen(arr1);puts(“enter
    your name:”);gets(arr2);len2 = strlen(arr2);len3 = stelen(“Smart Value”);printf(“\n
    String1 = %s length = %d”, arr1, len1);printf(“\n String1 = %s length = %d”, arr2,
    len2);printf(“\n String1 = %s length = %d”, “Smart Value”, len3);}Note that in
    the first and second call to the function strlen(), we are passing the base address
    of the string and in turn the function returns the length of the string. While
    calculating the length, the function doesn’t count the NULL character. Even in
    the third call what gets passed to strlen() is the address of the string and not
    the string itself.Here, we will write and use a function lenstr() which will act
    same as the library function strlen().main(){int lenstr(char *);int len1, len2,
    len3;char arr1[] = “Hello World!”;char arr2[30];len1 = lenstr(arr1);puts(“Enter
    your name:”);gets(arr2);len2 = lenstr(arr2);len3 = lenstr(“Smart Value”);printf(“\n
    String1 = %s length = %d”, arr1, len1);printf(“\n String1 = %s length = %d”, arr2,
    len2);printf(“\n String1 = %s length = %d”, “Kumar Janglu”, len3);}int lenstr(char
    *str){int length = 0;while(*str!=’\0’){length++;str++;}return(length);}In the
    above example we simply replaced the strlen() library function with the lenstr()
    function which we have created.Strcpy()This function copies the contents of one
    string into another. The base addresses of the source and target strings should
    be supplied to this function. Usage of this function is illustrated in the following
    program.main(){char source1[] = “Kumar Janglu”;char target1[20], target2[30],
    source2[30];strcpy(target1, source1);puts(“Enter your name:”);gets(source2);strcpy(target2,
    source2);printf(“\n Source String1 = %s”, source1);printf(“\n Target String1 =
    %s”, target1);printf(“\n Source String2 = %s”, source2);printf(“\n Target String2
    = %s”, target2);}On supplying the base addresses, strcpy() goes on copying the
    characters of source string into the target string until it encounters the ‘\0’
    (NULL) character of the source string. Note that, the dimension of the target
    should be greater than the source string.Here, we will write and use a function
    cpystr() which will act the same as the library function strcpy().main(){void
    cpystr(char *, char *);char source1[] = “Hello World!”;char target1[20], target2[30],
    source2[30];cpystr(target1, source1);puts(“Enter your name;”);gets(source2);cpystr(target2,
    source2);printf(“\n Source String1 = %s”, source1);printf(“\n Target String1 =
    %s”, target1);printf(“\n Source String2 = %s”, source2);printf(“\n Target String2
    = %s”, target2);}void cpystr(char *tptr, char *sptr){while(*sptr!=’\0’){*tptr
    = *sptr; ​ /*assigning character from source to target*/sptr++; ​ ​ /*advances
    the source pointer*/tptr++; ​ ​ /*advances the target pointer*/}*tptr = ‘\0’;
    ​ /*assigning NULL character at the end of target*/}In the previous example we
    simply replaced the strcpy() library function with the cpystr() function which
    we have created.Strcat()This function concatenates the source string at the end
    of the target string. To understand how it works, just look at the following program.main(){char
    source[] = “Hello”;char target[20] = “World!”;strcat(target, source);printf(“\n
    Source string = %s”, source);printf(“\n Target string = %s”, target);}Note that,
    the dimension of the target string should be big enough to hold both the source
    string and target string.Strcmp()This is a function which compares two strings
    to find out whether they are same or different. The two strings are compared character
    by character until there is a mismatch or end of one of the strings is reached,
    whichever occurs first. If the two strings are identical, this function returns
    a value zero. If they are not identical, it returns the numeric difference between
    the ASCII values of the first non-matching pairs of characters. To understand
    how it works, just take a look at the following program.main(){int i, j;char string1[]
    = “Hello World!”;char string2[] = “Hello Mars!”;i = strcmp(string1, “Hello World!”);j
    = strcmp(string1, string2);printf(“\n %d%d”, i, j);}In the first call to strcmp(),
    the two strings are identical and so, the value returned by strcmp() is zero.
    In the second call, the first mismatch occurs between two strings at ‘W’ in the
    string1 and ‘M’ in the string2\. So, strcmp() returned a value 10, which is the
    numeric difference between the ASCII value of ‘W’ and ‘M’.StructuresC structures
    are used to define groups of contiguous fields, such as records or control blocks.
    Usually, the structure definition is saved as an #include member in maclib library,
    but it can be placed at the top of the program. The commonest way to define structures
    is with a typedef, as shown below.typedef struct country{char name[20];int population;char
    language[10];}This defines a structure which can be referred to either as ‘struct
    country’ or country, whichever you prefer. Strictly speaking, you don’t need a
    tag name both before and after the braces if you’re not going to use one or the
    other. But its standard practice to put them both in and to give them the same
    name, but with the one after the braces starting with an uppercase letter.The
    typedef statement doesn’t occupy storage: it simply defines a new type. Variables
    that are declared with the typedef above will be of type ‘struct country’, just
    like population is of type integer.Declaring structuresOnce the structure is defined,
    you can declare a structure variable by preceding the variable name by the structure
    type name. if you’ve defined the structure with tags both before and after the
    braces, it’s a matter of style whether you declare the variable using the word
    struct or not. Both the following lines declare variables of the type defined
    above.struct country France, Italy, Sweden;country Mexico, Canada, Brazil;If you
    have a small structure you just want to define in the program, you can do the
    definition and declaration together as shown below. This will define a structure
    of type ‘struct country’ and declare three instances of it.struct country{char
    name[20];int population;char language[10];} India, Sinapore, Indonesia;Strictly
    speaking, the tag name before the brace isn’t needed here, but it’s usually left
    in to comment the structure. You can also use it to declare new variables, just
    as with typedef.struct country Australia;Addressing a field in a StructureFields
    in a structure can be referenced by following the name of the structure by a dot
    and the name of the field.France.population = 0;You can also declare a pointer
    to type ‘struct country’ and use that to reference the fields in a structure of
    that type. In this case, you follow the pointer name by an arrow and the name
    of the field.struct country Russia, *sptr;sptr = &Russia;sptr->population = 0;In
    the example above, Russia is of type ‘struct country’; *sptr is of type ‘pointer
    to struct country’ and sptr->population is of type integer.Comparing and copying
    structuresIndividual fields in structures can be compared or copied like any other
    variables.Italy.population = France.popultion;if(memcmp(Canada.language, France.language.sizeof(Canada.language))==0);{Translate(FRENCH);}else;The
    following lines copies the entire structure of Mexico to Brazil.memcpy(&Brazil,
    &Mexico, sizeof(Brazil));If you’re comparing one structure with another, all the
    usual warnings about slack bytes apply as in other languages.Pointers to struct'
