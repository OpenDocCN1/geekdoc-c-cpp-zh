  trans: "\n\n## 1. 无参数且无返回值\n在此类型的函数中，没有形式参数且函数不返回任何值。例如：\n```c\nmain(){void test(void);test();}void\
    \ test(void){printf(“this is an example of no argument no return”)}\n```\n\n##\
    \ 2. 无参数有返回值\n```c\n#include<stdio.h>\nmain(){\n    int test(void);\n    int max;\n\
    \    max=test();\n    printf(“The maximum of the two is : %d”, max);\n}\nint test(void){\n\
    \    int x, y;\n    printf(“Enter 1 st no.:”);\n    scanf(“%d”, &x);\n    printf(“Enter\
    \ 2 nd no.:”);\n    scanf(“%d”, &y);\n    return(x>y?x:y);\n}\n```\n\n## 3. 有参数有返回值\n\
    ```c\n#include<stdio.h>\nmain(){\n    int test(int, int);\n    int x, y, max;\n\
    \    printf(“Enter 1 st no.:”);\n    scanf(“%d”, &x);\n    printf(“Enter 2 nd\
    \ no.:”);\n    scanf(“%d”, &y);\n    max=test(x,y);\n    printf(“The maximum of\
    \ the two is %d”, max);\n}\nint test(int a, int b){\n    return(a>b?a:b);\n}\n\
    ```\n\n## 4. 有参数无返回值\n```c\n#include<stdio.h>\nmain(){\n    void test (int, int);\n\
    \    int x, y;\n    printf(“Enter 1 st no.:”);\n    scanf(“%d”, &x);\n    printf(“Enter\
    \ 2 nd no.:”);\n    scanf(“%d”, &y);\n    test(x,y);\n}\nvoid test(int a, int\
    \ b){\n    int max;\n    max=a>b?a:b;\n    printf(“The maximum of the two is:\
    \ %d”, max);\n}\n```\n\n## 调用函数\n当函数名后紧跟分号时，函数就会被调用。我们可以通过两种方式调用函数。\n\n### 1.\
    \ 值传递调用\n当我们调用函数并向其传递内容时，我们始终是将变量的“值”传递给被调用函数。这种函数调用被称为“值传递”。即使在“被调用”函数中进行了任何修改，也不会影响实际参数。\n\
    ```c\n#include<stdio.h>\nmain(){\n    void swap(int, int);\n    int a=10, b=20;\n\
    \    swapv(a, b);\n    printf(“\\n a=%d b=%d”, a, b);\n}\nvoid swapv(int x, int\
    \ y){\n    int t;\n    t=x;\n    x=y;\n    y=t;\n    printf(“\\n x=%d y=%d”, x,\
    \ y);\n}\n```\n注意：即使交换了 `x` 和 `y` 的值，`a` 和 `b` 的值仍然保持不变。\n\n### 2. 引用传递调用\n通常在\
    \ C 语言中，我们使用值传递。这意味着通常我们无法修改实际参数的值。但是，如果需要，可以通过引用传递调用来实现。在这种方法中，调用函数的实际参数的地址被复制到被调用函数的形式参数中。在这里，我们发送的是变量的地址而不是变量的值，如果被调用函数内部进行了任何修改，它也会影响调用函数内部的实际参数。\n\
    ```c\n#include<stdio.h>\nmain(){\n    void swapr(int *, int *);\n    int a=10,\
    \ b=20;\n    swapr(&a, &b);\n    printf(“\\n a=%d b=%d”, a, b);\n}\nvoid swapr(int\
    \ *x, int *y){\n    int t;\n    t=*x;\n    *x=*y;\n    *y=t;\n}\n```\n注意：在这个程序中，我们利用存储在\
    \ `x` 和 `y` 中的地址交换了 `a` 和 `b` 的值。通过智能地使用“引用传递”方法，我们可以让函数一次性返回多个值，这在“值传递”的情况下是不可能的。\n\
    \n"
- fmt: "\n```c\nmain() {\n    void areaperi(int, float *, float *);\n    int radius;\n\
    \    float area, perimeter;\n    printf(\"Enter radius of a circle:);\n    scanf(\"\
    %d\", &radius);\n    areaperi(radius, &area, &perimeter);\n    printf(\"Area=%f\"\
    , area);\n    printf(\"\\nPerimeter=%f\", perimeter);\n}\n\nvoid areaperi(int\
    \ r, float *a, float *p) {\n    *a = 3.14 * r * r;\n    *p = 2 * 3.14 * r;\n}\n\
    ```\n\nHere we are making a mixed call, in the sense; we are passing the value\
    \ of `radius` but the addresses of `area` and `perimeter`. And since we are passing\
    \ the addresses, any changes that we make in values stored at addresses contained\
    \ in the variables `a` and `p`, would make the change effective in `main()`. That\
    \ is why when the control returns from the function `areaperi()`, we are able\
    \ to output the values of `area` and `perimeter`. \n\nThus, we have been able\
    \ to return two values from a called function and hence have overcome the limitation\
    \ of the `return` statement, which can return only one value at a time from a\
    \ called function.\n\n### Recursion\n\nIn C, it is possible for a function to\
    \ call itself within its definition, this is known as recursion. A function is\
    \ called “recursive” if a statement within the body of the function calls the\
    \ function itself. Here is an example of recursive function to calculate the factorial\
    \ value of a given integer.\n\n```c\n#include<stdio.h>\nmain() {\n    int rec(int);\n\
    \    int n, fact;\n    printf(\"Enter an integer to find its factorial value:\"\
    );\n    scanf(\"%d\", &fact);\n    fact = rec(n);\n    printf(\"Factorial value=%d\"\
    , fact)\n}\n\nint rec(int x) {\n    int f;\n    if (x == 1)\n        return (1);\n\
    \    else\n        f = x * rec(x - 1);\n    return (f);\n}\n```\n\n### Arrays\n\
    \nAn array is a sequence of data in memory, wherein all data are of the same type\
    \ and are placed in physically adjacent locations. Thus array is a collective\
    \ name given to the group of similar type and quantities.\n\n#### Array declarations:\n\
    \nSyntax:\n```\n<data type><array name>[no. of elements];\n```\ne.g. `int arr[10];`\n\
    \n#### Accessing array elements\n\nonce an array is declared, we refer the individual\
    \ elements with the help of subscript. The number in the brackets following the\
    \ array name is called “subscript”. This number specifies the element’s position\
    \ in the array. \n\n#### Entering data into an array\n\nUsually we use a `for`\
    \ loop to enter data into the elements of an array. Note that before using an\
    \ array its type and size must be mentioned.\n\n#### Array initialization\n```c\n\
    int num[6] = {2, 4, 12, 5, 45, 6};\n```\n\n#### Passing array elements to a function\n\
    \narray elements can be passed to a function by calling the function by value\
    \ or by reference. Following is an example of “call by value” method.\n\n```c\n\
    #include<stdio.h>\nmain() {\n    void display(int);\n    int i;\n    int a[] =\
    \ {35, 45, 55, 65, 75};\n    for (i = 0; i < 5; i++)\n        display(a[i]);\n\
    }\n\nvoid display(int m) {\n    printf(\"%d\", m);\n}\n```\n\n#### Passing an\
    \ entire array into a function\n\n```c\n#include<stdio.h>\nmain() {\n    void\
    \ display(int *);\n    int a[] = {35, 45, 55, 65, 75};\n    display(&a[0]);\n\
    }\n\nvoid display(int *m) {\n    int i;\n    for (i = 0; i < 5; i++)\n       \
    \ printf(\"%d\", *m)\n}\n```\n\n#### Naming and declaring arrays\n\nThe rules\
    \ for assigning names to arrays are the same as for variable name. an array name\
    \ must be unique. It can’t be used for another array or for any other identifier\
    \ (variable, constant, and so on). As you have probably realized, array declarations\
    \ follow the same form as declarations of non-array variables, except that the\
    \ number of elements in the array must be enclosed in square brackets immediately\
    \ following the array name. when you declared an array, you can specify the number\
    \ of elements with a literal constant or with a symbolic constant created with\
    \ the `#define` directive. Thus, the following:\n\n```\n#define MONTHS 12\nint\
    \ array[MONTHS];\n```\n\nis equivalent to this statement:\n```c\nint array[12];\n\
    ```\nwith most compilers, however, you can’t declare in array’s elements with\
    \ a symbolic constant created with a `const` keyword.\n```c\nconst int MONTHS=12;\n\
    int array[MONTHS]; /*wrong*/\n```\n\n### Single-dimensional arrays\n\nA single-dimensional\
    \ array has only a single subscript. A subscript is a number in brackets that\
    \ follows an array’s name. this number can identify the number of individual elements\
    \ in the array. An example should make this clear. For the business expenses program,\
    \ you could use the following line to declare an array of type float:\n```c\n\
    float expenses[12];\n```\nThe array is named `expenses`, and it contains 12 elements.\
    \ Each of the 12 elements is the exact equivalent of a single float variable.\
    \ All of C’s data types can be used for arrays. C arrays elements are always numbered\
    \ starting at 0, so the 12 elements of `expenses` are numbered 0 through 11. In\
    \ The preceding example, January’s expenses total would be stored in `expenses[0]`,\
    \ February’s in `expenses[1]`, and so on.\n\nWhen you declare an array, the compiler\
    \ sets aside a block of memory large enough to hold the location of array declarations\
    \ in your source code is important. As with no array variables, the declaration’s\
    \ location effects how your program can use the array.\n\nIndividual elements\
    \ of the array are accessed by using the array name followed by the element subscript\
    \ enclosed in square brackets. For example, the following statement stores the\
    \ value 89.95 in the second array element (remember, the first array element is\
    \ `expenses[0]`, not `expenses[1]`).\n```c\nexpenses[1] = 89.95;\n```\nLikewise,\
    \ the statement\n```c\nexpenses[10] = expenses[11];\n```\nAssign a copy of the\
    \ array [The provided text seems to have some garbled/repetitive artifacts at\
