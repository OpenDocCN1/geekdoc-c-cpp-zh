    which is a structure declared in STDIO.H.The members of the FILE structure are
    used by the program in the various file access operations, but you don’t need
    to be concerned about them. However, for each file that you want to open, you
    must declare a pointer to type FILE. When you call fopen(), that function creates
    an instance of the FILE structure and returns a pointer to that structure. You
    use this pointer in all subsequent operations on the file if fopen() fails, it
    returns NULL.Such a failure could be caused, for example, by a hardware error
    or by trying to open a file on a diskette that hasn’t been formatted.The argument
    filename is the name of the file to be opened. As noted earlier, filename can
    and should contain a path specification. The filename argument can be a literal
    string enclosed in double quotation marks or a pointer to a string variable.The
    argument mode specifies the mode in which to open the file. In this context, mode
    controls whether the file is binary or text and whether it is for reading, writing,
    or both. The permitted values for mode are listed in Table.Values of mode for
    the fopen() function


    | Mode | Meaning |


    | R | Open the file for reading. If the file doesn’t exist, fopen() returns NULL.
    |


    | W | Opens the file for writing. If a file of the specified name doesn’t exist,
    it is created. If a file of the specified name does exist, it is deleted without
    warning, and a new, empty file is created. |


    | A | Opens the file for appending. If a file of the specified name doesn’t exist,
    it is created. If the file does exist, new data is appended to the end of the
    file. |


    | R+ | Opens the file for reading and writing. If a file of the specified name
    doesn’t exist, it is created. If the file does exist, new data is added to the
    beginning of the file, overwriting the existing data. |


    | W+ | Opens the file for reading and writing. If a file of the specified name
    doesn’t exist, it is created. If the file does exist, it is overwritten. |


    | A+ | Opens a file for reading and appending. If a file of the specified name
    doesn’t exist, it is created. If the file does exist, new data is appended to
    the end of the file. |'
