  trans: "\n\n# switch 语句\n\n语法：\n```c\nswitch(expression){\n    case value1: statements;\n\
    \        break;\n    case value2: statements;\n        break;\n    ...\n    default:\
    \ statements;\n        break;\n}\n```\n它也被称为多分支语句。它由 `switch` 中的一个表达式和 `case`\
    \ 语句中的常量值组成。根据给定 `expression` 的值，该结构可以包含任意数量的 `case` 语句。如果 `switch` 语句中的 `expression`\
    \ 与 `case` 语句中的任何常量值匹配，则执行该语句——即 `case` 语句之后的语句。但是，如果任何常量值都不与给定的 `expression`\
    \ 匹配，则将执行写在 `default` 部分的语句。在每个 `case` 结尾以及 `default` 部分，一个 `break` 语句是必需的。在这个结构中，`default`\
    \ 部分是完全可选的。\n\n例如：\n```c\nswitch (n) /*这里 n 是一个变量*/{\n    case 0: printf(“Value\
    \ of n is 0”);break;\n    case 1: printf(“Value of n is 1”);break;\n    ...\n\
    \    case 9: printf(“Value of n is 9”);break;\n    default: printf(“Value of n\
    \ is not between 0-9”);break;\n};\n```\n\n## 无条件跳转语句\n\n通常不应支持这种语句，因为会将控制权转移到另一个位置，导致用户对程序产生困惑。这些语句应该只在控制语句内部使用，否则用户可能无法完美需求。无条件跳转语句有三种类型：\n\
    \n### 1. goto\n\n语法：\n```c\ngoto<label-name>;\n...\n<label>:\n...\n```\n它根据标签名称将控制权转移到所需的语句。与\
    \ `goto` 语句相同的标签名不应使用两次。标签名可以使用 `goto` 语句之前或之后。\n\n例如：\n```c\nif(j>5) goto lb1;\n\
    lb1;\nprintf(“Value of j is greater than 5”);\n```\n\n### 2. continue\n\n语法：\n\
    ```c\ncontinue\n```\n在循环结构中，该语句块将连续执行，而不会中断循环。\n\n例如：\n```c\nk=0;\nwhile(k<5){\n\
    \    printf(“This is an example”);\n    printf(“of continue statement!”);\n  \
    \  continue;\n    k++;\n}\n```\n\n### 3. break\n\n语法：\n```c\nbreak;\n```\n它用于将控制权转移到控制结构的外部。\n\
    \n例如：\n```c\nk=0;\nwhile(k<5){\n    printf(“This is an example”);\n    printf(“of\
    \ a break statement!”);\n    break;\n    k++;\n}\n```\n\n## 循环控制结构\n\n计算机的通用性在于它能够重复执行一组指令。这涉及到程序的某部分重复执行指定的次数，或者直到满足特定条件。这种重复操作是通过循环控制结构完成的。三种方法如下：\n\
    \n### 1. while 循环结构\n\n语法：\n```c\nwhile(condition){\n    statements;\n}\n```\n\
    在这里，只要给定的 `condition` 为真，所有的块语句都将执行。一旦条件变为假，控制权就会退出 `while` 结构。如有必要，我们还可以使用嵌套的\
    \ `while` 循环。\n\n例如：\n```c\nx=0;\nwhile(x<5){\n    printf(“This is an example”);\n\
    \    printf(“of while loop structure!”);\n    x++;\n}\n```\n\n### 2. do-while\
    \ 循环结构\n\n语法：\n```c\ndo{\n    statements;\n}\n```\n`while` 循环和 `do while` 循环的工作方式存在细微的区别。这种区别在于测试条件的位置。`while`\
    \ 在执行循环内的任何语句之前测试给定的条件，而 `do while` 在至少执行一次循环内的语句后才测试给定的条件。在这里，即使给定的条件为假，所有的块语句也会至少执行一次。如有必要，我们还可以使用嵌套的\
    \ `do while` 循环。\n\n例如：\n```c\nz=5;\ndo{\n    printf(“This is an example”);\n\
    \    printf(“of do-while loop structure!”);\n    z++;\n}\n```\n\n### 3. for 循环结构\n\
    \n语法：\n```c\nfor(initialize;condition;increment/decrement){\n    statements;\n\
    }\n```\n`for` 循环有三个部分：\n\n1.  **初始化部分**，我们可以在这里初始化任何变量，如 `a=0` 或 `b=5` 等。\n2.\
    \  **条件部分**，在这里测试给定的条件是真还是假。只要给定的条件保持为真，循环内的所有语句都将执行。\n3.  **递/减部分**，我们可以在这里增加或减少所选变量的值。\n\
    \n例如：\n```c\nfor(j=0;j<10;j++){\n    printf(“This is an example”);\n    printf(“of\
    \ for loop structure”);\n}\n```\n\n## 示例\n\n### do while 循环和 100 个 Hello Worlds\n\
    ```c\n#include<stdio.h>\nmain(){\n    int count;\n    count=0;\n    do{\n    \
    \    ++count;\n        printf(\"Hello World!\");\n    }(count<100);\n```\n\n###\
    \ for 循环\n```c\n#include<stdio.h>\nmain(){\n    int fahr;\n    for(fahr=0;fahr<100;fahr++){\n\
    \        printf(\"Hello World!\\n\");\n    }\n}\n```\n\n### 使用 while 循环\n```c\n\
    #include<stdio.h>\nmain(){\n    int fahr, step;\n    fahr=0;\n    while(fahr<100){\n\
    \        printf(\"Hello World!\\n\");\n        fahr++;\n    }\n}\n```\n\n### switch\
    \ 语句\n```c\n#include<stdio.h>\nmain(){\n    int i;\n    printf(“Enter a number\
