    # Program Structures


    * Sequence

    * Selection

    * Repetition


    Sequence indicates that if there is no intervening control structure the flow
    of control normally passes from one instruction to the next sequence. Selection
    indicates a decision, from among several options. That is, you may branch out
    to one of multiple locations the program depending on the decision. Repetition,
    or looping constructs occur when a set of instruction are to be repeated several
    times. It saves the trouble of writing the same set of statements repeatedly.


    ## Criteria for a good programFollowing are some of the questions which can be
    asked to judge if a program is good:


    * Does it solve the problem started in the specification?

    * Does it work correctly under all conditions?

    * Does it have proper documentation?

    * Is it written using a modular approach?

    * Does it make efficient use of computer time and memory?


    These criteria can be met automatically if sufficient thought and effort is invested
    in every stage of program design.


    ## Program flowcharts


    A program flowchart is a pictorial representation of logic required to accomplish
    a task. It includes all necessary steps of a program. It is called flow chart,
    because it charts the flow of a program. It is a symbolic representation of each
    input, output and processing step. Besides being a good method of writing down
    the algorithm, it is also a part of program documentation and helps in understanding,
    debugging and maintaining programs.


    In a flow charting techniques, operations are represented by drawing appropriate
    symbols for the actions. Traditional program flowcharting involves the use of
    simple geometric symbols to represent the beginning or end of a program, a process,
    a decision or an input-output process. These flowcharts symbols are connected
    by arrows to illustrate the sequence of operations.


    A graphical presentation using symbols to show the step-by-step sequence of operations,
    activities, or procedures. Used in computer system analysis, activities analysis,
    and in general program sequence representation.


    The following represents the most commonly used symbols and their generally accepted
    meanings:![](rsrc5C.jpg)


    Here is an example of flow chart on what to play.![](rsrc5H.jpg)


    Examples: Flowchart for computing factorial `N`. (`N!`)![](rsrc5R.jpg)

    Flowchart for finding out the largest of three numbers.![](rsrc5W.jpg)


    ## Algorithm


    Algorithm is the step by step instructions that are required to complete the work
    you want to do. Each instruction in algorithm is known as `STEP`, while in C we
    say it’s a `STATEMENT`. Right now, we’ll look how an algorithm looks like. To
    describe algorithms, you don’t need to know anything about computers, at least
    for now. What you really need is an open mind, and your own mother tongue. Let’s
    look at this one, suppose you were given two glasses full of colour water, red
    and green. Now you are asked to swap the water in the glasses. The glass containing
    red water should contain green water and the other one red. Think about the problem,
    there are ways to do it, but there is one way that is considered the best.


    ```

    Step 1 Glass 1 HAS water Red

    Step 2 Glass 2 HAS water green

    Step 3 Get an EMPTY glass 3

    Step 4 Transfer RED water from glass 1 to EMPTY glass 3

    Step 5 Transfer GREEN water from glass 2 to EMPTY 1

    Step 6 Transfer RED water from Glass 3 to EMPTY glass 2.

    ```


    ## Pseudocode


    An alternative method of representing program logic is a Pseudocode. Instead of
    using symbols to represent the program logic steps, a Pseudocode uses statements
    which are bridge between actual programming and ordinary English. In Pseudocode
    each step is written using a simple English phrase which is also called construct.


    Pseudocode is an outline of a program, written in a form that can be easily converted
    into any real programming language statements. Pseudocode cannot be compiled nor
    executed, and there is no real formatting or syntax rules. It is simply one step-an
    important one- in producing the final code. The benefit of pseudo code is that
    it enables the programmer to concentrate on the algorithms without worrying about
    all the syntactic details of a particular programming language. In fact, you can
    write pseudo code without even knowing what programming language you will use
    for the final implementation.


    Some of the conventions which are used while writing pseudo codes are as follows:


    1. All statements in a loop should be indented.

    2. All alphanumeric values should be enclosed in single or double quotes.

    3. The beginning and end of a Pseudocode is marked with keywords like `start`
    and `End` respectively. own4. All statements must include certain keywords which
    denote an operation.

    '
