    ## 第 1 章：程序开发周期

    程序是计算机执行以完成特定任务的集合。这是一个多步骤的过程，涉及问题的识别和定义、为问题开发计算机解决方案，以及准备可以在计算机上运行的指令序列。在编写程序时，必须考虑到程序将处理的数据以及生成的信息。


    ### 编程过程的步骤

    编程过程是一系列为了开发和实现计算机程序的活动。编写程序包含以下列出的六项活动：


    1. 理解程序规范

    2. 设计程序模型

    3. 确定程序的正确性

    4. 编写程序代码

    5. 测试并调试程序

    6. 编写程序文档


    '
- fmt: '

    # Understanding program specification


    Program specification included two acid:

    a) Problem definition

    b) Requirement analysis


    ## Problem definition

    Before beginning work on the house, a builder reviews the blue prints, check the
    all permits have been obtained, and surveys the houses foundation. A builder prepares
    differently for building a skyscraper or building a doghouse. No matter what the
    project the preparation is tailored to its needs and done conscientiously before
    construction begins.


    The first prerequisite you need to fulfil before designing the program model is
    clear statement of the problem that the program is supposed to solve. A problem
    definition defines what the problem is without any reference to the possible solutions.
    It is a simple statement `=`, may be one to two page and it should sound like
    a problem. Problem definition comes before the requirement analysis, which is
    a more detailed analysis of the problem.


    The problem definition should be in user language, and the problem should be described
    from the user point of view. It usually should not be stated in technical computer
    terms.


    Solving a problem without clear understanding of its components may turn out to
    be a futile exercise as the solutions may not meet the requirement of the use.
    So, a problem statement has to be prepared which explains every minute details
    of the problem beyond doubt. This can be best achieved by writing down the problem
    in clear statements. Better problem definitions results in faster, easier and
    accurate solutions.


    ## Requirement analysis

    Requirement describes in details what a program is supposed to do, and they are
    the first steps towards solution. The requirement activity is also known as functional
    specification. An explicit set of requirement is important for several reasons.
    Explicit requirements help to ensure that the user rather than the programmer
    drives the programs functionality. If the requirements are explicit, the user
    can review them and agree to them. Explicit requirement keep you from guessing
    what the user wants. Specifying requirements adequately is a key to the program
    success.


    The three basic components are:

    a) What is given as input?

    b) What is expected as output, and

    c) How to arrive at the solutions


    Let’s take an example and understand the above concept of input, process and output.
    A program is required to retrieve motor vehicle registration records from a file
    up on receipt of a request from an operator at a terminal. The operator will supply
    a vehicle registration number and the program will display the details of its
    vehicle and its owner. An error message will be displayed if the program is unable
    to locate the vehicle record.


    Input : `vehicle registration number`

    Process : using the registration number, search for it, and if found, retrieve
    the details of the vehicle and its owner’s name from the disk.

    Output : if retrieval was successful, then allow the details of the vehicle to
    be displayed on the screen but if unsuccessful, indicate the absence of the vehicle
    registration on the disk and display a suitable error message.


    ## Design a program model

    Once the problem is clearly defined, an algorism (another term for processing
    logic) can be developed. This is the most creative part of the programming. At
    this stage, the algorithm may be constructed in broad terms to help visualize
    possible alternatives.


    An algorithm is a formula, a recipe, a step-by-step procedure to be followed in
    order to obtain the solutions to a problem. To be useful as basis for writing
    a program the algorithm must be:

    a) Arrive at a correct solution with a finite time.

    b) Be clear, precise, unambiguous and

    c) Be in a format which lends itself to an elegant implementation in a programming
    language.


    The important tools used in developing a solution and in the preparation of an
    algorithm are flowcharts and pseducodes among others. Flowcharts provide visual
    and graphical representation of the solution while pseducodes mean writing the
    program logic in simple English like language. Logic depicted using these tools
    can then be written using any programming language. In other words these are generic
    tools. We shall look at these tools in detail through this course.


    ## Determine correctness of algorithms

    One of the most difficult and sometimes most tedious step in the development of
    an algorithm is ensuring and providing that the algorithm is correct. Correctness
    of an algorithm or a program means that it gives the correct output and its does
    what it is supposed to do. Correctness of an algorithm or a program can be checked
    by any one of the following methods:

    a) Dry run

    b) Independent inspection.

    c) Structured walkthrough


    ## Code program

    This is the process of converting our solutions, i.e. the algorithms (flowchart/Pseudocode)
    into an actual computer program. Here we choose a programming language and using
    the syntax and semantics of the language, convert our algorithm thus far expressed
    in a form of a flowchart/pseudo code.


    Syntax means the correct way or grammar, of writing a command or series of commands,
    including all the proper options and command-line statements.

    Semantics means the logical meaning of statement, separate from the grammatical
    structure.


    ## Test and debug the program

    Once the coding is complete, you will enter the program into computer. The computer
    will then compile our program into machine code. Compilation means converting
    the source code i.e. the user’s program which is written using a high level language
    into machine code, which is the machine understandable language. Compilation results
    in certain kinds of error which are indicated by the computer after the process
    is over. These errors have to be corrected and then the program recompiled. The
    process continues until the program is free of errors. Next we must verify that
    our program does everything that is supposed to do. Invariably, computer programs
    do not work properly for the first time. The three types of errors that are normally
    encountered are:

    a) Syntax

    b) Execution

    c) Logical


    ### Syntax error

    Syntax errors occur when a computer language compiler cannot understand a command
    entered by the programmer. When such an error is encountered the computer rejects
    the program and printed out an error message. These errors are encountered during
    compilation and are very easy to correct. In many cases, these errors arise due
    to spelling mistakes, incorrect commands. For example, in C if we type `PRINT`
    instead of `printf` this causes a syntax error.


    ### Execution error

    These errors are encountered after error-free compilation, at the time of execution.
    Execution errors are also called Runtime errors. Typical examples are:

    Step 1 Infinite loops

    Step 2 Correct output only for selected data

    Step 3 Data incorrect or in wrong order

    Step 4 Incorrect filename

    Step 5 Divide check errors. These checks appear when a quantity is divided by
    zero or by a number which is nearly equal to zero.


    ### Logical error

    Logical errors are due to mistakes made by the programmers while coding. The computer
    does not detect logical errors. For example, for calculating the net salary of
    an employee the formula is `NETSALARY=BASIC+ALLOWANCE-DEDUCTIONS`. But through
    oversight, while coding, the formula is written as `NETSALARY=BASIC+ALLOWANCE`.
    This will obviously produce a wrong result. Such error can be detected only by
    a dry run. To correct these errors, we have to go through the algorithms of the
    program. These errors are easily detected, by running sample problems, for which
    we know the answer. Most of these errors can be eliminated by properly designing
    the program. A complete scan and careful dry run and walk through are some of
    the ways in which these errors can be removed.


    ### Debugging

    Debugging is the process of identifying the root cause of an error and correcting
    it. It contrasting with testing, which is the process of detecting the error initially.


    ### Documentation

    Once the program has been written and debugged, it is ready to use and hence requires
    documentation or a written of how to run the program, enter data, what problems
    to expect, how to handle them, etc. documentations of a program will consist of
    flow charts/pseducodes, programs listings and detailed written statements of algorithms
    and procedures involved. Documentation is necessary for program maintenance. Without
    proper documentation it will be difficult change a program at a later date. It
    is a miss-held notion that documentation is the last step in the algorithm development
    stage. In fact it should be interwoven with the entire phase of the programming
    process, especially with the design and implementation, because documentation
    is supposed to enable individuals to understand the logic of the program. Just
    writing and documenting a program is not just enough. One has to follow certain
    principles while developing algorithms. One such principle is structured programming.


    ## Structured programming techniques

    Structured programming techniques imply that the program development and coding
    must follow a top down approach and structured programming constructs. Top-down
    approach implies planning the program as a hierarchy of modules. Programming begins
    with the top (main) module. When the main module is programmed, second level modules
    are then programmed. In order to support the discipline of top-down programming
    the following basic structured programming constructs are followed in programming:

