  trans: "\n\n# 队列的应用\n\n## 添加一个元素\n```cpp\nif(rear == QSIZE-1)\n    rear=0;\nelse\n\
    \    rear = rear +1;\n```\n向队列中添加一个元素。\n\n在多任务操作系统中，CPU 时间在多个进程之间共享。在给定时刻，只有一个进程在运行，所有其他进程都处于“睡眠”状态。CPU\
    \ 时间由调度器管理。调度器将所有当前进程维护在一个队列中，并将活动进程放在队列头部。![](img/rsrc2NW.jpg)\n\n# 树\n树是元素或结点的有限集合。如果该集合非空，则其中一个节点被标识为根节点，而剩余的（可能为空的）节点集合被分组为若干子集，每个子集本身也是一棵树。这种层次级关系通过将每个子树称为根节点的子节点来描述，而将根节点称为每个子树的父节点。如果一棵树只包含一个节点，则该节点被称为叶子节点。\n\
    ![](img/rsrc2P2.jpg)\n\n### 简单树\n允许空树是为了逻辑上的方便。这通常是为了使用图片来表示树，如图所示，其中根节点为 `A`，有三个以\
    \ `B`、`C` 和 `D` 为根的子树。子树 `D` 的根是一个叶子节点，其余节点 `E`、`F`、`G`、`H` 和 `I` 也是。节点 `C` 有一个孩子\
    \ `I`，而 `E`、`F`、`G` 和 `H` 都有相同的父节点 `B`。给定节点的子树是有序的，因此图中的树与节点 `E` 和 `F` 交换后的树不同。因此，说\
    \ `A` 的第一个子树有 4 个叶子节点是有意义的。\n\n### 示例\n如何使用列表实现抽象数据类型树。\n**解法**：我们用 `[A B C]`\
    \ 表示包含三个元素的列表，并将 `A` 与 `[A]` 区分开。我们可以将树表示为一个根节点和一个按顺序排列的子树列表列表。因此，树的列表表示法为 `[A\
    \ [ [B [[E] [F] [G] [H]]] [C [I]] [D]]]`\n注意，例如我们将 `[D]` 与 `[D []]` 混淆了，为了严格准确，我们应该写成\
    \ `[D []]`，因为 `D` 的子树集为空。为了说明列表表示有多常见，当我输入上述内容时，我的一个朋友正很快地匹配括号；换句话说，当我输入最后一个 `]`\
    \ 时，光标移动到 `A` 之前的 `[` 处以显示平衡括号。\n\n# 遍历\n通常，一个包含树中所有结点的单个列表非常方便。这个列表可能对应于搜索树时应该访问结点的顺序。我们在这里定义了三种这样的列表，即树的前序遍历、后序和中序遍历。这些定义本身是递归的：\n\
    \n- 如果 `T` 是空树，则空列表为与 `T` 关联的前序、中序和后序遍历；\n- 如果 `T = [N]` 包含单个节点，则列表 `[N]` 为与 `T`\
    \ 关联的前序、中序和后序遍历；\n- 否则，`T` 包含一个根节点 `n` 以及子树 `T1`、`T2`、……、`Tn`；且\n    - `T` 结点的前序遍历是包含\
    \ `N` 的列表，随后按顺序是 `T1`、`T2`、……、`Tn` 的前序遍历。\n    - `T` 结点的中序遍历是包含 `T1` 中序遍历的列表，随后是\
    \ `N`，再按顺序是每个 `T2`、……、`Tn` 的中序遍历。\n    - `T` 结点的后序遍历是按顺序包含每个 `T1`、……、`Tn` 的后序遍历的列表，最后是\
    \ `N`。\n\n# 二叉树\n二叉树是一种空为空的树，或者是每个节点都满足以下一条件的树：\n\n- 没有孩子；或\n- 只有一个左孩子；或\n- 只有一个右孩子；或\n\
    - 同时具有左右孩子。\n\n"
- fmt: "\n# Introduction\nWe have already seen examples of binary trees, both considering\
    \ in the discussion of optimal sorting, and which was used to illustrate the process\
    \ the optimal merging, are binary trees, although in each case, the situation\
    \ in which a node can have just one child does not occur. Note also that this\
    \ is rather different from an ordered tree, since for a binary tree we distinguish\
    \ between a node with a single left child, and one with a single right child.\
    \ An alternative definition, which is “cleaner” is to first introduce the concept\
    \ of a terminal, or “null” node, which has no children, and then define a binary\
    \ tree to be one in which every node other than the null node has precisely two\
    \ children.\n\nA complete binary tree is a special case of a binary tree, in which\
    \ all the levels, except perhaps the last, are full; while on the last level,\
    \ any missing nodes are to the right of all the nodes that are present. An example\
    \ is shown in the figure.![](rsrc2RD.jpg)\n\n## Example\nGive a space efficient\
    \ implementation of a complete binary tree in terms of an array `A`. Describe\
    \ how to pass from a parent to its two children, and vice versa.\n\n### Solution\n\
    An obvious one, in which no space is wasted, stores the root of the tree in `A[1]`;\
    \ the two children in `A[2]` and `A[3]`, the next generation at `A[4]` up to `A[7]`\
    \ and so on. An element `A[k]` has children at `A[2k]` and `A[2k+1]`, providing\
    \ they both exist, while the parent of node `A[k]` is at `A[k/ 2]`. Thus traversing\
    \ the tree can be done very efficiently.\n\n# Linked list\nLinked list is a much\
    \ better way of storing data. A linked list is a special kind of `struct` which\
    \ has a pointer to another struct of the same type. For example, let’s turn our\
    \ `studentInfo` struct into a linked list by adding a new pointer named `next`.\
    \ This pointer will point at the next element in the list.\n\n```c\nstruct studentInfo{\n\
    \    char name[32];\n    char teacher[32];\n    int age;\n    studentInfo * next;\n\
    }\n```\n\nRemember a `*` means a pointer, so every `studentInfo` now has a pointer\
    \ to another `studentInfo`. If this pointer is set to `0`, or `NULL`, then we\
    \ must be at the end of the list. Then, all we need to do is keep a pointer to\
    \ the first struct in the list:\n\n```c\nstudentInfo * student_list;\n```\n\n\
    This struct will have a pointer to the next one, which will have a pointer to\
    \ the next one, and so on.\n\n## Going through the whole list\nRemember the function\
    \ `printStudent`? It took a `studentInfo` and printed out all of the info. Now,\
    \ let’s use that to make a new function `printAllStudents`, which prints info\
    \ on every student in the list.\n\n```c\nvoid printAllStudents (void){\n    /*This\
    \ is a pointer to the current item in the list */\n    struct studentInfo * current\
    \ = student_list;\n    if (current!=0){\n        /*if the list is not empty…*/\n\
    \        /*start at the top of the list, go to the end, when current==0*/\n  \
    \      while(current!=0){\n            printStudent(current);\n            current\
    \ = current->next;\n        }\n    }else{\n        printf(“Error: no students\
    \ have been entered yet\\n”);\n    }\n}\n```\n\n## Adding data to the list\nNow\
    \ let’s take a function called `addStudent`. It lets the user type in the data\
    \ for a new student. This new student is added to the top of the list. It’s `next`\
    \ pointer points at the old top of the list.\n\n```c\nvoid addStudent(void){\n\
    \    printf(“creating a new student…\\n”);\n    studentInfo *temp = (struct studentInfo*)\
    \ malloc(sizeof(struct studentInfo));\n    printf(“Enter student name”);\n   \
    \ gets(temp->name);\n    printf(“Enter the student’s teacher”);\n    gets(temp->teacher);\n\
    \    printf(“Enter the student’s age”);\n    char buffer[18];\n    gets(buffer);\n\
    \    temp->age = atoi(buffer);\n    printf(“Adding student %s to the list…”, temp->name);\n\
    \    /*next pointer points at the old top of the list*/\n    temp->next = student_list;\n\
    \    /*the top of the list now points at temp*/\n    student_list = temp;\n  \
