    | 关键字 | 说明 |

    | :--- | :--- |

    | `typedef` | 用于为现有变量和函数类型创建新名称修饰符。 |

    | `union` | 用于允许多个变量共享同一内存空间的关键字。 |

    | `unsigned` | 用于表示变量仅包含正值的修饰符。参见 signed（有符号）。 |

    | `void` | 用于表示函数不返回任何内容，或者所使用的指针被认为是通用的（可以指向任何数据类型）关键字。 |

    | `while` | 循环语句，只要条件保持真（TRUE），就会执行部分代码。 |


