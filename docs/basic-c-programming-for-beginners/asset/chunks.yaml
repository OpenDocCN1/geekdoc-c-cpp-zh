  trans: "\n\n* 有时，给结构体分配指针是有用的。声明结构体指针基本上与声明普通指针完全相同。\n\n```c\nstruct student *student_a;\n\
    ```\n\n但我们如何解引用结构体指针及其字段呢？你可以通过两种方法之一来实现，第一种方法是：`printf(“%s\\n”, (*student_a).SSN);`\n\
    \n* 要进行解引用，你可以使用中缀运算符：`->`\n\n使用另一种运算符的上述示例：`printf(“%s\\n”, student_a->SSN);`\n\
    \n## 结构体数组\n如果你拥有包含数组的结构体，那么你也可以拥有结构体数组吗？事实上，结构体数组是非常强大的编程工具。你已经见过如何定制结构体定义以适应程序所需的数据。通常，程序需要处理多个数据实例。例如，在一个维护电话列表的程序中，你可以定义一个结构体来存储每个人的名字和号码。\n\
    \n```c\nstruct entry{\n    char fname[10];\n    char iname[12];\n    char phone[8];\n\
    };\n```\n\n然而，电话列表必须包含许多条目，因此单个 `entry` 结构体实例并没有太大用。你需要的是类型为 `entry` 的数组。在定义结构体后，你可以如下所示声明数组：\n\
    \n```c\nstruct entry list[1000];\n```\n\n该语句声明了一个名为 `list` 的数组，包含 1000 个元素。每个元素都是一个\
    \ `entry` 类型的结构体，并与其他数组元素类型一样通过下标来标识。这些结构体中的每一个都有三个元素，每个元素都是一个 `char` 类型的数组。当你声明了结构体数组后，你可以以许多方式操作数据。例如，要将一个数组元素的数据赋值给另一个数组元素，你可以写道：\n\
    \n```c\nlist[1] = list[5];\n```\n\n该语句将 `list[5]` 中对应成员的值赋值给结构体 `list[1]` 的每个成员。你也可以在单个结构成员之间移动数据。语句\
    \ \n\n```c\nstrcpy(list[1].phone, list[5].phone);\n```\n\n`strcpy()` 库函数将一个字符串拷贝到另一个字符串。如果你愿意，也可以在结构成员数组的单个元素之间移动数据：\n\
    \n```c\nlist[5].phone[1] = list[2].phone[3];\n```\n\n该语句将 `list[5]` 手机号码的第二个字符移动到\
    \ `list[2]` 手机号码的第四个位置。\n\n## 文件\n仅仅在屏幕上显示数据通常是不够的。这是因为如果数据范围很大，内存中只能存储有限的数据，屏幕上也只能显示有限的数据。内存在本质上是易失的，一旦程序终止，其内容就会丢失；因此，将数据存储在内存中是不恰当的。如果我们再次需要相同的数据，就有必要以某种方式存储数据，以便以后检索并部分或全部显示。这就是为什么我们学习如何在\
    \ C 中处理文件非常重要。\n\n一组名为 `filename` 或简单称为 `file` 的数据或信息集合。计算机存储的几乎所有信息都必须文件中。有许多类型的文件：数据文件、文本文件、程序文件、目录文件等。不同类型的文件存储不同类型的信息。例如，程序文件存储程序，而文本文件存储文本。\n\
    \n要理解数据如何在存储介质和 C 程序之间流转，请看下图。![](img/rsrc2B0.jpg)\n\n```c\n#include<stdio.h>\n\
    #include<conio.h>\nmain(){\n    FILE *fp, *ft;\n    char ch;\n    clrscr();\n\
    \    fp = fopen(“first.txt”, “r”);\n    if(fp==0){\n        printf(“Cannot open\
    \ the source file”);\n        exit();\n    }else{\n        ft = fopen(“third.txt”,\
    \ “w”);\n        while(1){\n            ch = getc(fp);\n            if(ch==EOF)break;\n\
    \            elseputc(ch, ft);\n            {\n                fclose(fp);\n \
    \               fclose(ft);\n                ft = fopen(“third.txt”, “r”);\n \
    \               while((ch=getc(fp))!=EOF)printf(“%c”, ch);\n            }\n  \
    \          getch();\n        }\n    }\n}\n```\n\n## 文件操作\n对文件可以执行不同的操作，例如：\n\n\
    ### 打开文件\n创建一个与磁盘文件关联的流的过程称为打开文件。当你打开一个文件时，它变得可读（意味着数据从文件输入到程序）、可写（意味着程序的数据保存到文件中）或两者兼备。当你用完该文件后，必须关闭它。\n\
    \n要打开文件，你使用 `fopen()` 库函数。`fopen()` 的原型位于 `STDIO.H` 中，读取如下：\n\n```c\nFILE *fopen(const\
    \ char *filename, const char *mode);\n```\n\n该原型告诉你 `fopen()` 返回一个类型为 `FILE` 的指针，它是\
    \ `STDIO.H` 中声明的一个结构体。`FILE` 结构体的成员被程序在各种文件访问操作中使用，但你不需要担心它们。然而，对于你想要打开每个文件，你必须声明一个类型为\
    \ `FILE` 的指针。当你调用 `fopen()` 时，该函数创建一个 `FILE` 结构体实例并返回该结构的指针。如果 `fopen()` 失败，将返回\
    \ `NULL`。这种失败可能是由硬件错误或在未格式化的磁盘上打开文件引起的。\n\n参数 `filename` 是要打开的文件名。如前，`filename`\
    \ 可以包含路径规范。`filename` 参数可以是双引号括的字面量字符串或字符串的指针。参数 `mode` 指定打开文件的模式。在此上下文中，`mode`\
    \ 控制文件是二进制格式还是文本格式，以及是读、写还是两者。允许的 `mode` 值列在表中。\n\n### `fopen()` 函数的 mode 值\n\n\
    | Mode | 含义 |\n| :--- | :--- |\n| `R` | 以读模式打开文件。如果文件不存在，`fopen()` 返回 `NULL`。\
    \ |\n| `W` | 以写模式打开文件。如果指定的文件不存在，则创建它。如果指定的文件存在，它将被无警告删除，并创建一个新的空文件。 |\n| `A`\
    \ | 以追加模式打开文件。如果指定的文件不存在，则创建它。如果文件存在，新数据将追加到文件末尾。 |\n| `R+` | 以读写模式打开文件。如果指定的文件不存在，则创建它。如果文件存在，新数据将从文件开头添加，覆盖现有数据。\
    \ |\n| `W+` | 以读写模式打开文件。如果指定的文件不存在，则创建它。如果文件存在，它将被覆盖。 |\n| `A+` | 以读写追加模式打开文件。如果指定的文件不存在，则创建它。如果文件存在，新数据将追加到文件末尾。\
    \ |\n\n"
- fmt: '

    The default file mode is `text`. To open a file in binary mode, you append a `b`
    to the mode segment. Thus, a mode argument of `a` would open a text-mode file
    for appending, whereas `ab` would open a binary-mode file for appending.


    Remember that `fopen()` returns `NULL` if an error occurs. Error conditions that
    can cause a return value of `NULL` include the following:

    - Using an invalid filename.

    - Trying to open a file on a disk that isn’t ready (the drive door isn’t closed
    or the disk isn’t formatted, for example).

    - Trying to open a file in a non-existent directory or on a non-existent disk
    drive.

    - Trying to open a non-existent file in mode `r`.


    Whenever you use `fopen()`, you need to test for the occurance of an error. There’s
    no way to tell exactly which error occurred, but you can display a message to
    the user and try to open the file again, or you can end the program. Most C compilers
    include non-ANSI extensions that let you obtain information about the nature of
    the error; refer to your compiler documentation for information.


    ## Writing and reading file data


    A program that uses a disk file can write data to a file, read data from a file,
    or a combination of the two. You can write data to a disk file in three ways:


    - **Formatted output**: You can use formatted output to save formatted data to
    a file. You should use formatted output only with text-mode files. The primary
    use of formatted output is to create files containing text and numeric data to
    be read by other programs such as spread sheets or databases. You rarely, if ever,
    use formatted output to create a file to be read again by a C program.

    - **Character output**: You can use character output to save single characters
    or lines of characters to a file. Although technically it’s possible to use character
    output with binary-mode files, it can be tricky. You should restrict character-mode
    output to text files. The main use of character output is to save text (but not
    numeric) data in a form that can be read by C, as well as other programs such
    as word processors.

    - **Direct output**: You can use direct output to save the contents of a section
    of memory directly to a disk file. This method is for binary files only. Direct
    output is the best way to save data for later use by a C program.


    When you want to read data from a file, you have the same three options: formatted
    output, character input, or direct input. The type of input you use in a particular
    case depends almost entirely on the nature of the file being read. Generally,
    you will read data in the same mode that it was saved in, but this is not a requirement.
    However, reading a file in a mode different mode the one it was written in requires
    a thorough knowledge of C and file formats.


    The previous descriptions of the three types of file input and output suggest
    tasks best suited for each type of output. This is by no means a set of strict
    rules. The C language is very flexible (this is one of its advantages!), so a
    clever programmer can make any type of file output suit almost any need. As a
    beginning programmer, it might make things easier if you follow these guidelines,
    at least initially.


    ## Deleting a file


    To delete a file, you use the library function `remove()`. Its prototype is in
    `stdio.H`, as follows:


    ```c

    int remove (const char *filename);

    ```


    The variable `*filename` is a pointer to the name of the file to be deleted. The
    specified file must not be open. If the file exists, it is deleted (just as if
    you used `DEL` command from the DOS prompt or the `rm` command in UNIX), and `remove()`
    returns `0`. If the file doesn’t exist, if it’s read-only, if you don’t have sufficient
    access rights, or if some other error occurs, `remove()` returns `-1`.


    ## Closing and flushing files


    When you’re done using a file, you should close it using the `fclose()` function.
    you saw `fclose()` used in program. Its prototype is:


    ```c

    int fclose(FILE *fp);

    ```


    The argument `fp` is the `FILE` pointer associated with the stream: `fclose()`
    returns `0` on success or `-1` on error. When you close a file, the file’s buffer
    is flushed (written to the file). You can also close all open streams except the
    standard one (`stdin`, `stdout`, `stderr`, and `stdout`) by using the `fcloseall()`
    function. its prototype is:


    ```c

    int fcloseall(void);

    ```


    This function also flushes any stream buffers and returns the number of streams
    closed. When a program terminates (either by reaching the end of `main()` or by
    executing the `exit()` function), all streams are automatically flushed and closed.
    However, it’s a good idea to close stream explicitly particularly those linked
    to disk files-as soon as you’re finished with them.


    The reason has to do with stream buffers. When you create a stream linked to a
    disk file, a buffer is automatically created and associated with the stream. A
    buffer is a block of memory used for temporary storage of data being written to
    and read from the file. Buffers are needed because disk drives are block-oriented
    devices, which mean that they operate most efficiently when data is read and written
    in blocks of a certain size. The size of the ideal block differs, depending upon
    the specific hardware in use. It’s typically on the order of a few hundred to
    a thousand bytes. You don’t need to be concerned about the exact block size, however.


    The buffer associated with a file serves as an interface between the stream (which
    is character oriented) and the disk (which is block oriented). As your program
    writes to the stream, the data is saved in the buffer until the buffer is full,
    and then the entire contents are written to the disk. An analogous process occurs
    when reading from a disk file. The creation and operation of the buffer are handled
    by the operating system and are entirely automatic; you don’t have to be concerned
    with them. In practical terms, this buffer operation means that, doing program
    execution, if there’s a power failure, or if some other problem occurs, the data
    that’s still in the buffer might be lost, and you won’t know what’s contained
    in the disk. You can flush a stream without closing it by using the `fflush()`
    or `fcloseall()` library functions. Use `fflush()` when you want a file’s buffer
    to be written to disk while still using the file. Use `fcloseall()` to flush the
    buffers of all open streams. The prototypes of these two functions are:


    ```c

    int fflushlush(FILE *fp);

    int fcloseall(void);

    ```


    The argument `fp` is the `FILE` pointer returned by `fopen()` when the file was
    opened. If a file was opened for writing, `fflush()` writes its buffer to disk.
    If the file was opened for reading, the buffer is cleared. The function `fflush()`
    returns `0` on success or `EOF` if an error occurred. The function `fcloseall()`
    returns the number of open streams.


    - DO open a file before trying to read or write to it.

    - DON’T assume that a file access is okay. Always check after doing a read, write,
    or open to ensure that the function worked.

    - DO use the `sizeof()` operator with the `fwrite()` and `fread()` functions.

    - DO close all files that you’ve opened.

    - DON’T use `fcloseall()` unless you have a reason to close all the streams.


    ## Copying a file


    It’s frequently necessary to make a copy of a file an exact duplicate with a different
    name (or with the same name but in a different drive or directory). In DOS, you
    do this with the `COPY` command, and other operating systems have equivalents.
    How do you copy a file in C? there’s no library function, so you need to write
    your own. This might sound a bit complicated, but it’s really quite simple thanks
    to C’s use of streams for input and output. Here are the steps you follow:


    1. Open the source file for reading in binary mode. (using binary mode ensures
    that the function can copy all sorts of files, not just text files.)

    2. Open the destination file for writing in binary mode.

