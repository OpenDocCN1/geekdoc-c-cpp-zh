    \  if(fp==0){\n                printf(“cannot open the source file”);\n      \
    \          exit();\n            }else{\n                while(1){\n          \
    \          ch = getc(fp);\n                    if(ch==EOF)break;\n           \
    \         elseputc(ch, ft);\n                }\n                fclose(fp);\n\
    \                fclose(ft);\n                ft = fopen(“third.txt”, “r”);\n\
    \                while((ch=getc(fp))!=EOF)printf(“%c”, ch);\n            }\n \
    \       getch();\n    }\n}\n```\n\n# 文件操作\n\n这些函数原型定义在 `<stdio.h>` 中，程序必须 `#include<stdio.h>`。值\
    \ `EOF`（表示文件结束）定义在 `<stdio.h>` 中。它的值通常为 `-1`，但不应依赖于此值。\n\n数据类型 `FILE` 是在 `<stdio.h>`\
    \ 中定义的结构体类型。流是指向 `FILE` 的指针，由一个缓冲区和一个文件组成。当运行包含 `<stdio.h>` 的程序时，流 `stdin`、`stdout`\
    \ 和 `stderr`会自动打开。除非重定向，否则 `stdin` 连接到键盘，`stdout` 和 `stderr` 连接到屏幕。当程序执行结束时，所有打开的流都会自动关闭。\n\
    \n`FILE *fopen (const char *filename, const char *mode);`\n此函数打开文件 `filename`。模式\
    \ `mode` 可以是用于读取的`“r”、用于写入的`“w”、或用于追加的`“a”。它返回一个流，如果无法打开文件则返回 `NULL`。\n\n`Int\
    \ fflush(FILE *stream);`\n冲刷输出流会导致缓冲区中任何未写入的数据写入。在输入流上，其效果是未定义的（但通常会清空缓冲区）。返回值通常为\
    \ `zero`，如果是写入错误则返回 `EOF`。\n\n`int fclose(FILE *stream);`\n此函数关闭 `stream`。对于输出流，会先写入任何缓冲数据。对于输入流，任何未读的数据将被丢弃。它通常返回\
    \ `zero`，如果出错则返回 `EOF`。\n\n`Int remove(const char *filename);`\n此函数删除文件 `filename`。它通常返回\
    \ `zero`，出错时返回非零值。\n\n`Int rename(const char *oldname, const char *newname);`\n\
    此函数将文件 `oldname` 重命名为 `newname`。它通常返回 `zero`，出错时返回非零。\n\n`Int fprintf(FILE *stream,\
    \ const char *format, ….);`\n它的作用与 `printf` 完全相同，但数据被写入 `stream` 而不是 `stdout`。它通常返回写入的字符数，如果出错则返回负值。\n\
    \n`Int fscanf(FILE *stream, const char *format, …);`\n它的作用与 `scanf` 完全相同，但数据是从\
    \ `stream` 而不是 `stdin` 读取的。它通常返回转换并赋值的输入项数，出错时返回 `EOF`。\n\n`Int fgetc(FILE *stream);`\n\
    它通常返回从 `stream` 读取的下一个字符（作为 `int`），如果出错则返回 `EOF`。（将字符转换为 `int` 是因为 `EOF` 通常是 `-1`，而无符号\
    \ `char` 的范围通常是 `0` 到 `255`，因此不能用它返回 `EOF`。）\n\n`Char *fgets(char *s, int n, FILE\
    \ *stream);`\n它向数组 `s` 中读取最多 `n-1` 个字符。如果发现换行符`‘\\n’` 则停止。换行包含在数组内。数组由空字符`‘\\\
    0’`终止。它返回 `s`（指向字符的指针），出错时返回 `NULL`。\n\n`Int fputc(int c, FILE *stream);`\n将字符\
    \ `c`（转换为无符号 `char`）写入 `stream`。它通常返回 `c`，出错时返回 `EOF`。\n\n`Int fputs(const char\
    \ *s, FILE *stream);`\n将字符串 `s` 写入 `stream`。（注意：与 `puts` 不同，`fputs` 不会在 `s` 的末尾添加换行符`‘\\\
    n’。）它通常返回一个非负值，出错时返回 `EOF`。\n\n`Void rewind(FILE *stream);`\n将 `stream` 回到文件开头。它没有返回值。\n\
    \n`Int feof(FILE *stream);`\n它通常返回 `zero`，如果到达 `stream` 的文件结束标记，则返回非零。\n\n# 数据结构\n\
    \n让我们来介绍数据结构。\n\n## 栈\n栈是一种列表，所有的插入和删除操作都在一端进行，该端称为 `top`。最后插入栈的元素将最先被移除。因此，栈有时被称为后进先出（Last\
    \ In First Out, LIFO）结构。\n\n### 栈接口\n以下操作可以用于栈：\n- `InitStack(Stack)`：创建一个空栈\n\
    - `Push(Item)`：向栈压入一个元素\n- `Pop(Stack)`：从栈弹出一个元素\n- `Top(Stack)`：返回栈顶元素但不移除它\n\
    - `isEmpty(Stack)`：如果栈为空则为真\n\n### 栈的实现\n从示例可以看出，使用列表实现栈只需要在栈顶进行 push 和 pop 操作。此外，push\
    \ 有两个参数：要压入的值和栈本身。它有一个返回值，即修改后的栈。我们可以写 `push x`。所以 `push` 的类型为：\n`push x = stk`\n\
    操作非常简单。\n\n```cpp\n#include<stdio.h>\n#include<iostream.h>\n#define maxN 20\n\
    void push(int x, int a[], int& top){\n    a[top]=x;\n    ++top;\n}\nint pop(int\
    \ a[], int& top){\n    --top;\n    return a[top];\n}\nvoid main(){\n    char c,\
    \ op;\n    int x;\n    int stk1[maxN], top1=0;\n}\n```\n\n### 使用数组实现的栈\n```cpp\n\
    int StackArray[50];\nint top=-1;\nvoid push(int elem){\n    top++;\n    StackArray[top]\
    \ = elem;\n}\nint pop(){\n    int elem = StackArray[top];\n    top--;\n    return\
    \ elem;\n}\n```\n\n## 队列\n队列是项的有序集合，可以从一端（称为队列头部）删除项，并在另一端（队列尾部）插入项。\n\n### 队列接口\n\
    以下操作可以用于队列：\n- `InitQueue(Queue)`：创建一个空队列\n- `Join(Item)`：向队列尾部插入一个项\n- `Leave(Queue)`：从队列头部移除一个项\n\
    - `isEmpty(Queue)`：如果队列为空则为真\n\n### 队列的实现\n从队列中删除元素是一项昂贵的操作，因为所有剩余元素都要移动位置。如果认为数组是环形的，就可以获得更高效的实现。\n\
    \n### 队列队列\n初始情况下，队列是空的，即 `front == rear`。如果我们向队列添加元素，我们：\n\n1. 检查队列是否未满\n2. 将元素存储在\
    \ `rear` 指向的位置\n3. 将 `rear` 增加 1，必要时回绕（在这种情况下它始终指向队列中的最后一项）\n\n"
- fmt: "\n# Application of queues\n\n## Adding one element\n```cpp\nif(rear == QSIZE-1)\n\
    \    rear=0;\nelse\n    rear = rear +1;\n```\nAdd an element to the queue.\n\n\
    In a multitasking operating system, the CPU time is shared between multiple processes.\
    \ At a given time, only one process is running, all the others are ‘sleeping’.\
    \ The CPU time is administered by the scheduler. The scheduler keeps all current\
    \ processes in a queue with the active process at the front of the queue.![](rsrc2NW.jpg)\n\
    \n# The tree\nA tree is a finite set of elements or nodes. If the set is non-empty,\
    \ one of the nodes is distinguished as the root node, while the remaining (possibly\
    \ empty) set of nodes are grouped into subsets, each of which is itself a tree.\
    \ This hierarchical relationship is described by referring to each subtree as\
    \ a child of the root, while the root is referred to as the parent of each subtree.\
    \ If a tree consists of a single node, that node is called a leaf node.\n![](rsrc2P2.jpg)\n\
    \n### A simple tree\nIt is a notional convenience to allow an empty tree. It is\
    \ usually to represent a tree using a picture such as in figure in which the root\
    \ node is `A`, and there are three subtree rooted at `B`, `C`, and `D`. the root\
    \ of the subtree `D` is a leaf node, as are the remaining nodes, `E`, `F`, `G`,\
    \ `H`, and `I`. the node `C` has a single child `I`, while each of `E`, `F`, `G`\
    \ and `H` have the same parent `B`. the subtree rootes at a given node are taken\
    \ to be ordered, so the tree in the figure is different from the one in which\
    \ nodes `E` and `F` are interchanged. Thus it makes sense to say that the first\
    \ subtree at `A` has 4 leaf nodes.\n\n### Example\nShow how to implement the Abstract\
    \ Data type tree using lists.\n**Solution**: we write `[A B C]` for the list containing\
    \ three elements, and distinguish `A` from `[A]`. we can represent a tree as a\
    \ list consisting of the root and a list of the subtrees in order. Thus the list\
    \ based representation of the tree is `[A [ [B [[E] [F] [G] [H]]] [C [I]] [D]]]`\n\
    Note that for example we confuse `[D]` with `[D []]`, which we should write to\
    \ be strictly correct, since `D` has an empty set of subtrees. To give an idea\
    \ of how common the list representation is, one of my friend was happily matching\
    \ brackets as I typed the above; in other words, when I typed the last `]`, the\
    \ cursor moved to the `[` before `“A` to show the balancing bracket.\n\n# Traversals\n\
    It is often convenient to a single list containing all the nodes in a tree. This\
    \ list may correspond to an order in which the nodes should be visited when the\
    \ tree is being searched. We define three such lists here, the Preorder, postorder,\
    \ and inorder traversals of the tree. The definitions themselves are recursive:\n\
    \n- If `T` is the empty tree, then the empty list is the preorder, the inorder\
    \ and the postorder traversal associated with `T`;\n- If `T = [N]` consists of\
    \ a single node, the list `[N]` is the preorder, the inorder and the postorder\
    \ traversal associated with `T`;\n- Otherwise, `T` contains a root node `n`, and\
    \ subtrees `T1`, `T2`, ……., `Tn`; and and\n    - The preorder traversals of the\
    \ nodes of `T` is the list containing `N`, followed in order by the preorder traversals\
    \ of `T1`, `T2`, ……, `Tn`.\n    - The inorder traversal of the nodes of `T` is\
    \ the list containing the inorder traversal of `T1` followed by `N` followed in\
    \ order by the inorder traversal of each `T2`, <.., `Tn`.\n    - The postorder\
    \ traversal of the nodes of `T` is the list containing in order the postorder\
    \ traversal of each `T1`,,. ..., `Tn`, followed by `N`.\n\n# Binary Trees\nA binary\
    \ tree is a tree which is either empty, or one in which every node:\n\n- Has no\
    \ children; or\n- Has just a left child; or\n- Has just a right child; or\n- Have\
    \ both a left and a right child.\n"
