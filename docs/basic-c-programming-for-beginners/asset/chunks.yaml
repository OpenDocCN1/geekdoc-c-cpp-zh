    ```

    ACCEPT N1

    ACCEPT N2

    SUM=N1+N2

    DISPLAY SUM

    END

    ```


    例如，冒泡排序的伪代码：

    ```

    WHILE NOT AT END OF LIST

    COMPARE ADJACENT ELEMENTS

    SIF SECOND IS GREATER THAN FIRST

    SWITCH THEM

    GET NEXT TWO ELEMENTS

    SIF ELEMENTS WERE SWITCHED

    REPEAT FOR ENTIRE LIST

    ```


    # 关于 C 语言


    作为一种编程语言，`c` 非常类似于 Pascal 或 FORTRAN。值存储在变量中。程序通过定义和函数来实现结构化。通过循环、if 语句控制程序流。`C`
    允许数据存储在数组或结构中。在这些语言中，`C` 比 FORTRAN 更简洁。`C` 提供了精确的输入输出控制。`C` 能够产生强大的程序。希望初学者会发现
    `C` 语言是一种很有用且友好的语言。


    ## C 语言起源简要介绍


    `C` 是一门中间级通用编程语言，与 `UNIX` 操作系统紧密相关。`C` 的很多重要思想源于 `BCPL`（由 Martin Richards 开发）。`BCPL`
    对 `C` 的影响间接通过 `B` 语言实现，那是 Ken Thompson 在 1970 年在贝尔实验室编写的。`BCPL` 和 `B` 是无类型语言，而
    `C` 提供了多种数据类型。1972 年，Dennis Ritchie 在贝尔实验室编写了 `C`，1978 年 Brian Kernighan 和 Dennis
    Ritchie 出版的《C 程序语言》引发了计算界的革命。


    1983 年，美国国家协会 (`ANSI`) 成立了一个委员会为 `C` 提供一个现代、全面的定义。所得的标准即“ANSI C”于 1988 年完成。


    ## 个人电脑上的 C


    关于个人电脑，对于 IBM（或兼容机）PC，`Microsoft C` 和 `Borland C`（`Turbo C`）被认为是两个最常用的系统。本课程在
    Microsoft Windows 和磁盘操作系统环境下教授 `C`。`C program` 在其他系统（如 VMS 或 DOS）下看起来相似；但某些功能会随系统而不同。特别是编译程序生成可执行文件的方法在每个系统上都是不同的。`UNIX`
    系统本身就是用 `C` 编写的；事实上，`C` 是为了实现 `UNIX` 而发明的。你输入的所有 `UNIX` 命令，以及密码检查、打印机队列或磁带控制器等其他系统设施都是用
    `C` 编写的。


    在 `UNIX` 开发过程中，编写了数百个函数来访问系统的各种事实。这些函数以库的形式供程序员使用。通过使用 `C` 编写和 `UNIX` 系统库，可以创建非常强大的系统程序。其他编程语言较难访问这些库。因此，`C`
    是编写 `UNIX` 系统程序的自然语言。


    ## 程序开发与执行方法


    要理解程序开发与执行方法，首先查看下面的流程图。在 `C` 等编译型语言中开发程序至少需要四个基本步骤。基本原理是，无论你选择哪种 `C` 编译器，步骤几乎总是相同的。在本教程中，所有的程序都基于
    `Borland C` 编译器编写。基本步骤为：


    1. 编辑或编写程序

    2. 编译

    3. 链接

    4. 执行

