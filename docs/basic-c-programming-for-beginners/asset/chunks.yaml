- fmt: "\n```cpp\n#include<stdio.h>\n#include<conio.h>\nmain(){\n    FILE *fp, *ft;\n\
    \    char ch;\n    clrscr();\n    fp = fopen(“first.txt”, “r”);\n    if(fp==0){\n\
    \        printf(“cannot open the source file”);\n        exit();\n    }else{\n\
    \        ft = fopen(“third.txt”, “w”);\n        while(1){\n            ch = getc(fp);\n\
    \            if(ch==EOF)break;\n            elseputc(ch, ft);\n        {\n   \
    \         fclose(fp);\n            fp = fopen(“second.txt”, “r”);\n          \
    \  if(fp==0){\n                printf(“cannot open the source file”);\n      \
    \          exit();\n            }else{\n                while(1){\n          \
    \          ch = getc(fp);\n                    if(ch==EOF)break;\n           \
    \         elseputc(ch, ft);\n                }\n                fclose(fp);\n\
    \                fclose(ft);\n                ft = fopen(“third.txt”, “r”);\n\
    \                while((ch=getc(fp))!=EOF)printf(“%c”, ch);\n            }\n \
    \       getch();\n    }\n}\n```\n\n# File operations\n\nThese function prototypes\
    \ are in `<stdio.h>` the program must `#include<stdio.h>`. the value `EOF` (indicates\
    \ end-of-file) is defined in `<stdio.h>`. its value is usually `-1`, but this\
    \ should not be relied upon.\n\nThe data type `FILE` is a struct type defined\
    \ in `<stdio.h>`. a stream is a pointer-to-FILE, and comprises a buffer plus a\
    \ file. The streams `stdin`, `stdout` and `stderr` are automatically opened when\
    \ a program including `<stdio.h>` is run. Unless redirected, `stdin` is connected\
    \ to the keyboard, `stdout` and `stderr` to the screen. When program execution\
    \ ends, all open streams are automatically closed.\n\n`FILE *fopen (const char\
    \ *filename, const char *mode);`\nThis opens the file `filename`. The mode `mode`\
    \ can be `“r”` for reading, `“w”` for writing, or `“a”` for appending. It returns\
    \ a stream, or `NULL` if the file cannot be opened.\n\n`Int fflush(FILE *stream);`\n\
    Flushing an output stream causes any unwritten data in the buffer to be written.\
    \ On an input stream, the effect is undefined (but usually clears the buffer).\
    \ The return value is normally `zero`, or `EOF` for a write error.\n\n`int fclose(FILE\
    \ *stream);`\nthis closes `stream`. For an output stream, any buffered data is\
    \ first written. For an input stream, any unread data is discarded. It normally\
    \ returns `zero`, or `EOF` for an error.\n\n`Int remove(const char *filename);`\n\
    This deletes the file `filename`. It normally returns `zero`, or non-zero an error.\n\
    \n`Int rename(const char *oldname, const char *newname);`\nThis renames the file\
    \ `oldname` to `newname`. It normally returns `zero`, or non-zero for an error.\n\
    \n`Int fprintf(FILE *stream, const char *format, ….);`\nThis acts exactly like\
    \ `printf` except that the data is written to `stream`, rather than `stdout`.\
    \ It normally returns the number of characters written, or a negative value for\
    \ an error.\n\n`Int fscanf(FILE *stream, const char *format, …);`\nThis acts exactly\
    \ like `scanf` except that the data is read from `stream`, rather than `stdin`.\
    \ It normally returns the number of input items converted and assigned, or `EOF`\
    \ for an error.\n\n`Int fgetc(FILE *stream);`\nThis normally returns the next\
    \ character read from `stream` (as an `int`), or `EOF` for an error. (The char\
    \ is converted to an `int` because `EOF` is usually `-1`, while unsigned char\
    \ is usually from `0` to `255` so could not be used to return `EOF`.)\n\n`Char\
    \ *fgets(char *s, int n, FILE *stream);`\nThis reads a maximum of `n-1` characters\
    \ into the array `s`. it stops if a newline `‘\\n’` is found. The new line is\
    \ included in the array. The array is terminated by the null character `‘\\0’`.\
    \ It returns `s` (a pointer-to-char), or `NULL` for an error.\n\n`Int fputc(int\
    \ c, FILE *stream);`\nThis writes the character `c` (converted to unsigned char)\
    \ to `stream`. It normally returns `c`, or `EOF` for an error.\n\n`Int fputs(const\
    \ char *s, FILE *stream);`\nThis writes string `s` to `stream`. (Note: unlike\
    \ `puts`, `fputs` does not add a newline `‘\\n’` to the end of `s.) it normally\
    \ returns a non-negative value, or `EOF` for an error.\n\n`Void rewind(FILE *stream);`\n\
    This rewinds `stream` back to the start of the file. It does not return a value.\n\
    \n`Int feof(FILE *stream);`\nThis normally returns `zero`, or non-zero if the\
    \ end-of-file marker for `stream` has been reached.\n\n# Data structures\n\nLet\
    \ us introduce to the data structures.\n\n## Stacks\nA stack is a list in which\
    \ all insertions and deletions are made at one end, called the `top`. The last\
    \ element to be inserted into the stack will be the first to be removed. Thus\
    \ stacks are sometimes referred to as Last In First Out (LIFO) lists.\n\n### Stack\
    \ interface\nThe following operations can be applied to a stack:\n- `InitStack(Stack)`\
    \ : creates an empty stack\n- `Push (Item)` : pushes an item on the stack\n- `Pop\
    \ (Stack)` : removes the first item from the stack\n- `Top (Stack)` : returns\
    \ the first item from the stack w/o removing it\n- `isEmpty (Stack)` : returns\
    \ true is the stack is empty\n\n![](rsrc2JG.jpg)![](rsrc2JM.jpg)\n\n### Stack\
    \ implementation\nWe can see from the example that a list is simple way to implement\
    \ a stack, just push and pop to and from the front or top of the stack. Also,\
    \ push has 2 parameters, the value being pushed into the stack and the stack itself.\
    \ It has a single return value, namely the modified stack. We might write `push\
    \ x stack`. So `push` has the type:\nWe can use the `:` operator for defining\
    \ `push`.\n`Push x stk = x:stk`\nIt is as simple as that. Recall that `[11, 7,\
    \ 5] = 11:[7, 5] = 11:7:[5]`\n\n```cpp\n#include<stdio.h>\n#include<iostream.h>\n\
    #define maxN 20\nvoid push(int x, int a[], int& top){\n    a[top]=x;\n    ++top;\n\
    }\nint pop(int a[], int& top){\n    --top;\n    return a[top];\n}\nvoid main(){\n\
    \    char c, op;\n    int x;\n    int stk1[maxN], top1=0;\n}\n```\n\n### Stack\
    \ implementation using Arrays\n```cpp\nint StackArray[50];\nint top=-1;\nvoid\
    \ push(int elem){\n    top++;\n    StackArray[top] = elem;\n}\nint pop(){\n  \
    \  int elem = StackArray[top];\n    top--;\n    return elem;\n}\n```\n\n## Queues\n\
    A queues is an ordered collection of items from which items may be deleted at\
    \ one end (called the front of the queue) and into which items may be inserted\
    \ at the other end (the rear of the queue).\n\n### Queue interface\nThe following\
    \ operations can be applied to a queue:\n- `InitQueue (Queue)` : creates an empty\
    \ queue\n- `Join (Item)` : inserts an item to the rear of the queue\n- `Leave\
    \ (Queue)` : removes an item from the front of the queue\n- `isEmpty (Queue)`\
    \ : returns true is the queue is empty\n\n![](rsrc2MV.jpg)\nElements can only\
    \ be added to the rear of the queue and removed from the front of the queue. ![](rsrc2N0.jpg)\n\
    \n### Implementation of Queues\nRemoving an element from the queue is an expensive\
    \ operation because all remaining elements have to be moved by one position. A\
    \ more efficient implementation is obtained if we consider the array as being\
    \ ‘circular’![](rsrc2N7.jpg)\n\n### Joining the queue\nInitially, the queue is\
    \ empty, i.e. `front == rear`. If we add an element to the queue we:\n\n1.  Check\
    \ if the queue is not full\n2.  Store the element at the position indicated by\
    \ `rear`\n3.  Increase `rear` by one, wrap around if necessary (in this case always\
    \ points to the last item in the queue the rear item)\n"
