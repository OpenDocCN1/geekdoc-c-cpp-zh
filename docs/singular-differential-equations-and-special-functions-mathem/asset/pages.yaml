    Consider a linear differential equation (9.208b) of order N corresponding to the
    linear differential operator (9.208a) with N single-point boundary conditions
    (9.208c, d):


    ```

    $L\{y(x)\} = \sum_{n=0}^{N} A_n(x) \frac{d^ny}{dx^n} = 0; \quad s = 0,...,N-1;
    \quad y^{(s)}(0) = y_{0,s}.\n(9.208a–d)

    ```


    The set of $N$ **fundamental solutions** satisfy the differential equation (9.209a,
    b) with boundary conditions (9.204c–e):


    ```

    $m=1,...,N: \quad L\{y_m(x)\} = 0; \quad y_m^{(0)} = \delta_m^s = \begin{cases}
    1 & \text{if } m=s-1 \ 0 & \text{if } m \neq s-1. \end{cases}\n(9.209a–e)

    ```


    The fundamental solutions are linearly independent because each of them has a
    boundary unit where all the others are zero. The general integral must be a linear
    combination (9.210a) of fundamental solutions:


    ```

    $y(x) = \sum_{n=1}^{N} C_n y_n(x); \quad y^{(s)}(0) = \sum_{n=1}^{N} C_n \delta_n^s
    = C_s;\n(9.210a–d)

    ```


    The arbitrary constants $C_n$ in the general integral (9.209a–e) are given by
    (9.210b–d) where was used. There is an analogy between the terms on fundamental
    solutions (9.154a–c, 9.156a–d)[9.209a–e, 9.210a–d] of linear autonomous system
    [differential equation (9.208a, 9.208b)] of order N with initial conditions (9.156b–d).[9.210b–d].
    Substituting (9.210a) it follows that the *general integral of an unordered linear
    differential equation (9.208a, b) of order N with N single-point boundary conditions,
    is given (standard CCLI)* by the linear combination


    ```

    $y(x) = \sum_{n=1}^{N} y^{(n-1)}(0) y_n(x);\n(9.211)

    ```'
