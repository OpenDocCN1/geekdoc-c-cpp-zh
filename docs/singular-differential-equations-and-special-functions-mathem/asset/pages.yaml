    # 9.4.10 Calculation of the Coefficients of the Analytic Solution


    It has been shown (subsection 9.4.9) that the linear second-order differential
    equation (9.282a) with analytic coefficient (9.282b) has a Maclaurin solution
    (9.280c)=9.284c), where the first two coefficients (9.284a, b) are arbitrary constants
    determined by two-point boundary conditions:


    ```

    $c_0=y(0)=y_0, \quad c_1=y''(0)=y_0; \quad y(x)=c_0+c_1x\sum_{n=2}^{\infty}c_nx^n;
    \quad (9.284a–c)

    ```


    to obtain the general integral remaining the coefficients in (9.284c) must be
    expressed (9.285b,c) as linear functions of (c_0,c_1) involving only the coefficients
    in the invariant (9.283d;9.285a).


    ```

    $n=0,...,\infty,k=2,...,\infty; \quad c_0=c_dk(I_n)+c_1e_k(I_n). \quad (9.285a–c)

    ```


    The coefficients ($d_k,e_k$) in (9.285c) can be determined by two equivalent methods.
    Method I has three steps: (i) the differential equation (9.282a) is differentiated
    n-times (9.286a) using the Leibniz chain rule (1.13.31)=(9.286b):


    ```

    $y^{(n+2)}(x)=-\frac{d^n}{dx^n}[I(x)y(x)]=-\sum_{k=0}^{n}\binom{n}{k}I^{(k)}(x)y^{(n-k)}(x);
    \quad (9.286a,b)

    ```


    (ii) the Maclaurin series (9.233a,b) for the analytic integral (9.280c)[invariant
    (9.283d)] have coefficients (9.287a)[9.287b]) related by (9.287c):


    ```

    $n!\c_n,I_n\}=\{y^{(n)}(0),f^{(n)}(0)\}; \n(n+2)!c_{n+2}=y^{(n)}(0)=-\sum_{k=0}^{n}\frac{n!}{k!(n-k)!}f^{(k)}(0)y^{(n-k)}=-n!\sum_{k=0}^{n}f_kn_{n-k};
    \n (9.287a–d)

    ```'
