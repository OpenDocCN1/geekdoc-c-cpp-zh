  md: '# # 9n Existence Theorems and Special Functions


    The preceding chapters have focused mostly on (i) obtaining explicitly analytically
    solutions (ii) in terms of elementary functions for certain classes of differential
    equations and systems that do admit solutions (chapters 1, 3, 4, 5, and 7), including
    a fairly wide range of applications (chapters 2, 4, 6, and 8). Some problems,
    like sound in Gaussian and power law horns (notes 7.39–7.45), or the separation
    of variables in the Laplace operator in hypercylindrical and hyperserical coordinates
    (notes 8.11–17), do not have solutions in terms of elementary functions (ii),
    and require special functions specified by series (sections 9.5–9.7), parametric
    integrals (section 9.8), or continued fractions (section 9.9); the special functions
    appear as solutions of linear equations with variable coefficients that may not
    have (or may have) singularities [section(s) 9.4 (9.5–9.9)]. The singular and
    non-linear differential equations can be solved by analytical (numerical) approximate
    methods [notes 5.15–5.20 (4.8–13)]. When applying methods to differential equations
    it is necessary to know that a solution exists, under which conditions it is unique,
    and possibly other properties to validate the method; it is not safe to assume
    a priori that a solution exists, is unique, and existence, uniformity, and robustness
    theorems (section 9.1) apply to wider classes of differential equations than those
    that can be solved analytically, but in many cases do not help to find a solution.
    Even if a solution is not available, the qualitative theory of differential equations
    can indicate some properties, such as stability of a system (section 9.2). The
    forms of a differential equation may indicate what type of solutions are possible
    for example periodic solutions (section 9.3), and guide the construction of methods
    of solution such as power series (sections 9.4–9.7) or parametric integrals (section
    9.8) or continued fractions (section 9.9).


    #  9.1 Existence, Robustness, and Uniformity of Solutions


    Most of the present volume IV has concentrated on methods to obtain analytical
    solutions of ordinary (chapters 1 to 6) and simultaneous (chapters 7 and 8) differential
    equations, including general methods (chapters 1, 3, 5, 7) and typical applications
    (chapters 2, 4, 6, 8); the class of equations for'
