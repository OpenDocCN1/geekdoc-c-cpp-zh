  md: '# Singular Differential Equations and Special Functions


    which the existence of a solution can be proved is much wider than the set of
    equations that can be solved analytically, and the knowledge that a solution exists
    is a starting point for numerical or analytical methods of approximation. Even
    if an analytical solution of a differential equation has been obtained, the possibility
    remains that other solutions could exist, such as the special integrals (sections
    5.1–5.4); the latter is excluded by a unity theorem that imposes upon some initial
    conditions. The solution is robust if the result of small changes in the initial
    conditions is bounded; nonrobustness can lead to solutions that differ substantially
    from close initial conditions; for example, if there are bifurcations, discontinuities,
    or chaotic cases. Another useful property is uniformity or differentiability with
    respect to a parameter; for example, it was used to obtain linearly independent
    particular integrals [chapter 1] of linear equations with constant [sections 1.3–1.4
    (7.4–7.5)] and power [sections 1.6–1.7 (7.6–7.7)] coefficients, where the characteristic
    polynomial has multiple roots or there is resonance [subsections 1.4.1, 1.7 (7.5.2,
    7.7.2)]. The proof of the existence, unity, robustness, and uniformity is based
    on replacing the differential equation by an equivalent equation which is solved
    by successive approximations. The requirement that the successive approximations
    converge is met by imposing a contraction condition; the latter ensures that in
    the limit as the number of approximations tends to infinity; the iterations converge
    to a fixed point which specifies the solution. A sufficient condition for the
    convergence to a fixed point is that the form of the differential equation is
    specified by a Lipschitz function. It is sufficient to prove the existence, robustness,
    and uniformity for a system of simultaneous first-order differential equations
    because a differential equation of any order or a simultaneous system can always
    be reduced to a set of first-order simultaneous equations.


    # 9.1.1 Existence of Solution and the Lipschitz Condition


    The theorems of existence (subsections 9.1.1–9.1.8), robustness and uniformity
    systems (9.1.9–9.1.14) of solutions will be proved for a first-order differential
    equation; similar methods apply (subsections 9.1.15–9.1.20) to higher order equations
    and systems. The Picard method replaces the differential equation by an integral
    equation (subsection 9.1.2), leading to a Markov chain that can be solved iteratively.
    The successive iterations converge (subsection 9.1.3) to a fixed point (subsection
    9.1.4), which specifies the solution (subsection 9.1.5) in the case when they
    correspond to a contraction mapping (subsection 9.1.7); the Lipschitz condition
    (subsection 9.1.5) on the form of the differential equation (subsection 9.1.6)
    acts as the contraction condition.


    The method of successive approximations (subsections 9.1.1–9.1.8) applies in a
    rectangle (subsection 9.1.9) and can be used to prove: (i) the existence'
