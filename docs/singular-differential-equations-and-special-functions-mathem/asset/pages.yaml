    # NOTE 9.46: Algebraic and Elementary/Higher Transcendental Functions


    The classes of functions may be considered (Diagram 9.3) starting with the simplest,
    namely (i) polynomials, whose ratios are (ii) rational functions, that together
    can be expressed in finite terms. The transcendentals (volume I) (iii functions,
    which require infinite representations (volume II) such as power series (chapters
    I.23, I.25, I.27, and I.29) and series of fractions, products, and continued fractions)
    are actually functions rather than functions. The simplest transcendental functions
    are the elementary cases of the exponential and logarithm (chapter II.3) and the
    circular and hyperbolic functions (chapters II.5 and II.7); the latter may be
    expressed by (section 9.4). The other transcendental functions include the elliptic
    functions, including those of Jacobi and Weierstrass, and the hyperelliptic integrals
    (sections I.38–I.39) which are solutions of non-linear-first order differential
    equations. The auxiliary functions include the Euler gamma (note III.1.8) and
    digamma (subsections I.29.5.2 and 9.5.16), and beta (subsections 9.8.1–9.8.3)
    functions that appear in certain contexts, including the special functions.'
