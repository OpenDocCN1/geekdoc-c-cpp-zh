  md: "54 Singular Differential Equations and Special Functions\n\n# 9.3 Linear Differential\
    \ Equations with Periodic Coefficients (Floquet 1883; Lyapunov 1907)\n\nThe linear\
    \ differential equations (simultaneous systems) with constant [sections 1.3–1\
    \ (7.4–5)] and power [sections 1.6–1.7 (7.6–7.7)] coefficients all have eigenvalues,\
    \ corresponding to natural integrals, that satisfy decoupled first-order equations;\
    \ the general integral is a linear combination of the natural integrals. The natural\
    \ integrals lead to a diagonal matrix if the eigenvalues are distinct, and to\
    \ double-bonded blocks for multiple eigenvalues; the double-bonded blocks can\
    \ be chosen from one alternate form, using Jordan blocks (subsections 7.41, 9.4).\
    \ The linear differential equations of order N with periodic coefficients allow\
    \ for the existence of periodic solutions (subsection 9.3.1) by natural integrals\
    \ (subsection 9.3.3) associated with single (multiple) eigenvalues (subsection\
    \ 9.3.2) whose eigenfunctions lead (subsection 9.3.4) to diagonal (diagonal Jordan\
    \ matrices). The natural integrals may be asymptotically (i) stable, (ii) unstable,\
    \ or (iii) oscillatory. In the case of a second-order differential equation in\
    \ invariant form with periodic coefficient (subsection 9.3.5), it can be shown\
    \ that all three types of (i) growing, (ii) decaying, and (iii-1) monotonic or\
    \ (iii-2) oscillatory solutions can exist (subsection 9.3.6). Using a fundamental\
    \ system of solutions (subsection 9.3.7) of the linear second-order differential\
    \ equation in invariant form can be proved the fourth Lyapunov theorem on asymptotic\
    \ stability (subsection 9.3.9), based on a calculation of eigenvalues (subsection\
    \ 9.3.8).\n\n# 9.3.1 Conditions for the Existence of Periodic Solutions (Floquet\
    \ 1883)\n\nConsider a linear differential equation (9.177b) of order N with periodic\
    \ coefficients $\tau$, where $q$ is any integral (9.177a).\n\n```\n$q \\in \\\
    mathbb{Z}: \\sum_{n=0}^{N} A_n(t) \\frac{d^n x}{dt^n} = 0, \\quad A_n(t) = A_n(t+\t\
    au) = A_n(t+q). \\quad (9.177a–c)$\n```\n\nIt does not follow that all solutions\
