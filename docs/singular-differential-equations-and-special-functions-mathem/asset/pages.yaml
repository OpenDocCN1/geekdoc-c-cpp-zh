  md: "# 9.2.20 Third Lyapunov Theorem on Autonomous Systems\n\nThe result (9.169b)\
    \ proves the stability theorem because: (i) as $t \\to \\infty$ then $H \\to 0$\
    \ so (9.153a) implies that $\tilde{x}(t;\tilde{x}_0) \\to 0$ and the system tends\
    \ to the equilibrium point, ensuring asymptotic stability; using (9.160b) in (9.169b)\
    \ implies (9.170a–d);\n\n```\n$0 \\leq t < \\infty; \\quad |\\tilde{x}(t;\\tilde{x}_0)|^2\
    \ \\leq \\frac{H(\\tilde{x})}{b} \\frac{H(0)}{b} \\exp\\left(-\\frac{t}{2b}\\\
    right) \\leq \\frac{\\tilde{b}}{b}|\\tilde{x}_0|^2 \\exp\\left(-\\frac{t}{2b}\\\
    right)\\n(9.170a–d)\n```\n\nThus follows the third theorem on asymptotic stability:\
    \ the solution of the autonomous system (9.149a–d) has (CCXLIV) an upper bound\
    \ (9.171a, b);\n\n```\n$0 \\leq t < \\infty; \\quad |\\tilde{x}(t;\\tilde{x}_0)|\
    \ \\leq |\\tilde{x}_0| \\sqrt{\\tilde{b}/b} \\exp\\left(-\\frac{t}{4b}\\right),\\\
    n(9.171a, b)\n```\n\nwhere $\\tilde{b}$ is an lower (upper) bound (9.160a, b)\
    \ for the stability function (9.153a, that is, a positive-definite quadratic form\
    \ (9.159a, b). This case corresponds to the stable matrix (9.150b) for which all\
    \ eigenvalues have negative parts (9.151b). If at least one eigenvalue has a positive\
    \ real part (9.151c), the corresponding natural integral diverges at infinity,\
    \ and since is the same as for (9.151b) there is at least one such solution, the\
    \ system is unstable. If all eigenvalues have positive real parts (9.172a), the\
    \ solution is stable by reversing the signs of: (i) of $F_a$ in the autonomous\
    \ system (9.149b); (ii) of the matrix (9.150b) so that the quadratic (9.159b)\
    \ is negative instead of positive definite; (iii) of $b$ in (9.169a, b) is replaced\
    \ by (9.172b–d);\n\n```\n$Re(a_n) > 0; \\quad \\frac{dH}{dt} \\geq \\frac{H}{2b},\
    \ \\quad \\frac{d}{dt}(\\log H) \\geq \\frac{1}{2b}, \\quad H(t) \\geq H(0) \\\
    exp\\left(\\\frac{t}{2b}\\right)\\n(9.172a–d)\n```\n\nIt follows that for $H \\\
    to \\infty$ as $t \\to \\infty$ the system is unconditionally stable. For any\
    \ sphere $\\bar{x}$ the system will return the sphere after a finite time $t \\\
    geq t_1$ such that $|\\x(t_1)|=r$; the system cannot return at any later time,\
    \ because this would imply $H < 0$ which contradicts (9.172b). The third Lyapunov\
    \ theorem also applies to autonomous systems (equations) because in both cases\
    \ [subsection 9.2.19 (9.2.20)] the independent variable does not appear explicitly."
