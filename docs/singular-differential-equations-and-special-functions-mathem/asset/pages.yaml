    special functions are subhypergeometric; that is, particular cases or most equivalent
    to generalized, Gaussian, or confluent hypergeometric functions (note 9.33).


    # NOTE 9.47. Special Functions and Differential Equations


    The opposite case of hypergeometric functions that are not reducible to generalized,
    Gaussian, or confluent hypergeometric functions include the Mathieu (Hill) functions
    [subsections 4.3.2–4.11 (9.71–9.16)], which may be generalized (note 9.34), and
    are particular cases of the extended Gaussian hypergeometric functions (note 9.35–9.36).
    The extended confluent hypergeometric functions (note 9.37) do not include the
    doubly Bessel functions. Any linear second-order differential equation can be
    written in self-adjoint (invariant) form [note 5.7 (5.8)], by providing alternate
    forms (note 9.39–9.43) in the case of special functions; for example, the invariant
    form of the confluent hypergeometric equation leads to the Whittaker differential
    equations (note 9.39–9.41). Two sets of transformations of the generalized Bessel
    differential equation are given as additional examples (note 9.44–9.45). To the
    classes of functions (Diagram 9.3) can be added other (i) classes like analytic,
    meromorphic, monogenic, and sub-classes like the orthogonal polynomials that are
    particular cases of the special functions. To the Jacobian and Weierstrass elliptic
    functions could be added the related theta functions, the zeta function, error
    functions, and Fresnel integrals.


    List 9.1 of special functions is not complete, and omits important cases such
    as: (i–iii) the Weber/spheroidal/Lamé functions that arise from the separation
    of variables of the Laplacian operator respectively in parabolic/prolate and obate
    spheroidal/ellipsoidal coordinates; (iv) the Heun functions that are solutions
    of a linear second-order differential equations with regular singularities. All
    of chapter 9 have been present to the methods of solution of linear differential
    equations, original and generalized Bessel functions. The notes briefly mentioned
    methods and a sample of the other important special functions. The emphasis is
    on the solution of the differential equations; some properties of the special
    functions may be mentioned as needed, whereas a more detailed study would require
    one or several volume(s): there are monographs on one special function (for example
    Bessel functions or spherical harmonics) and multi-volume works covering several
    higher transcendental functions in the bibliography at the end of this volume.'
