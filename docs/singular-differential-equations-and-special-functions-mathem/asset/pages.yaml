    # NOTE 9.4: Approximate Numerical and Analytic Solutions of Differential Equations


    The subject of differential (integral) equations is arguably the most important
    topic of mathematical physics since the majority of quantitative scientific and
    technological problems lead to (i) ordinary or (ii) partial differential equations,
    (iii) integral equations, or (iv) coupled integro-differential systems with suitable
    (a) boundary and/or (b) initial conditions. The present volume presents mostly
    methods of analytical solution of ordinary differential equations as an introduction
    to a subject that will be present in every subsequent volume of the course. There
    are other analytical methods of solution of differential-integral equations as
    well as numerical methods and approximate methods (Diagram 9.1). There is a variety
    of approximate analytical methods of solution of differential equations, of which
    three were mentioned: (i) perturbation expansions, for non-linear problems, the
    free and forced oscillations of anharmonic oscillators (section 4.5), non-linear
    resonance (section 4.6), and the strong bending and stretching of plates (section
    6.9); (ii) the wave envelope technique to study the parametric resonance of an
    oscillator with vibrating support (section 4.3); and (iii) the “ray approximation”
    to linear second-order differential equations with variable coefficients (notes
    5.1–5.20).


