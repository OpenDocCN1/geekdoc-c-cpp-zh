    # 9.5.25 Classification of Six Cases of Regular Integrals


    A singular integral can arise from a singular differential equation, because a
    linear differential equation with analytic coefficients has only analytic integrals
    (subsection 9.4.9). The inverse is not true: a linear differential equation with
    a regular singularity can have (standard CCCXX) of six possible cases two analytic
    (i–ii) four singular (iii–vi) integrals; that is, the integrals can be: (i/ii)
    an analytic function (9.233a, b) if the integral of the first kind (9.377a) or
    (9.528b)[positive integer n in (9.528a)] exponent to a finite value (9.523b) of
    order n (9.253a), for example the first Bessel function (9.526a, b); (iii) a singular
    integral with a pole (9.231a, b) if the regular integral of the first kind (9.377b)
    has an index that is a negative integer (9.528e), for example the second Bessel
    function (9.527a, b) has a pole of order n+1; (iv) a branch-point if the regular
    integral of the first kind (9.377b) or second kind first (9.405a, b)[9.413] type
    has a non-integer index (9.528d), for example the Bessel function (9.510a) of
    non-integer order; and (v/vi) a logarithmic function (9.528e) branch-point (9.248a–c)
    possibly combined with any of the preceding (i) to (iii) for a regular integral
    of the second kind (9.405a, b) or second (9.413) type for example the Neumann
    function (9.511):


    ```

    j_n(x) with n∈N: zero of order

    j_0(x) with n=0: finite value

    j_{j-n}(x) with n∈N: pole of order n

    j_v(x) with v∈C|Z: branch-point

    Y_v(x) with a+–a_∈Z: logarithmic singularity

    (9.528a–e)

    ```


    An integral of a linear differential equation can have an essential singularity
    (9.228a–e) only if (9.256a–d) the differential equation has an irregular singularity.
    An example of essential singularity at the infinity is provided by the spherical
    Bessel functions (subsection 9.5.24) expressed in terms of sines and cosines (subsection
    9.5.26).'
