    # NOTE 9.8: Methods of One or Two Characteristic Polynomials


    The method of one or two characteristic polynomials (Table 9.9) is one of the
    simplest approaches to solving important classes of ordinary differential or finite
    difference equations. The characteristic polynomial of a linear differential equation
    with constant coefficients (sections 1.3–15) specifies the solutions through its
    roots; for example in the unforced (section 1.3) case the solutions are exponentials
    without (with) power factors for single (multiple) roots. Similar solutions apply
    for systems of linear equations with constant coefficients (sections 7.4–7.5),
    using a matrix of polynomials of ordinary differential operators and its determinant
    as the characteristic polynomial. In the case of a linear differential equations
    with variable coefficients that are linear functions of the independent variable
    (subsections 9.8.5–9.8.11) there are two characteristic polynomials appearing
    in a parametric integral solution that is a generalized Laplace transform with
    symmetric exponential kernel and integration along a path in the complex plane.


    The method of characteristic polynomials also applies [subsection(s) 1.9 (7.8–9)]
    to linear differential equations (coupled systems), and to linear equations with
    homogeneous derivatives [sections 1.6–18 (7.6–7)]. For linear differential equations
    with power coefficients leading to homogeneous derivatives the characteristic
    polynomial also specifies the solutions (sections 1.6–1.8); for example, in the
    unforced case (sections 1.6) the solutions are powers without (with) logarithmic
    factors for single (multiple) roots. Similar solutions apply to a simultaneous
