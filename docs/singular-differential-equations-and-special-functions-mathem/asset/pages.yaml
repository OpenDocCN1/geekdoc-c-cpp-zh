  md: 'An alternative to the solution of linear differential equations by power series
    (sections 9.4–9.7) is to use (section 9.8) integral transforms or integral representations
    that involve: (i) the transform that is a function of an auxiliary variable; (ii)
    the product by a kernel, that is a function of the original and auxiliary variables;
    and (iii) an integration along a path in the complex plane of the auxiliary variable.
    The simplest integral representations are the Fourier (Laplace) transforms with
    constant coefficients (chapter 1), and use: (i) an imaginary (real) exponential
    as kernel; and (ii) the whole (positive) real axis as path of integration. To
    solve linear differential equations with variable coefficients it is necessary
    to relax one or both conditions, leading to a variety of integral transforms (subsection
    9.8.5), of which two are considered in more detail: (a) the generalized Laplace
    transform along a path in the complex plane can be used to solve linear differential
    equations whose coefficients are linear functions (subsections 9.8.6–9.8.11),
    and (b) for other types of coefficients transform may be needed, using both a
    path of integration in the complex plane and a kernel that is not an exponential
    (subsections 9.8.12–9.8).


    The generalized Laplace transform (subsection 9.8.6) is used to solve the generalized
    (original) Bessel differential equation [subsections 9.8.7–9.8.8 (9.810)]; this
    leads to parametric integral representations for the generalized (original) Bessel
    functions [subsections 9.8.9.11)] that are equivalent alternatives to the power
    series representations [subsections 9.5.15–9.5.16 and 9.5.18–9.5.21 (9.52)]. The
    Bateman transform (subsection 9.8.5) may be chosen'
