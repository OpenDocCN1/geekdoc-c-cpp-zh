    P,Q \in \mathcal{A}(|\mathbb{C}|) \Rightarrow I \in \mathcal{A}(|\mathbb{C}|)
    \Rightarrow I(x)=\sum_{n=0}^{\infty} L_n x^n. \quad (9.283a-d)

    ```'
