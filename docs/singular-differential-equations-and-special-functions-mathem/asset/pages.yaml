    # 9.7.10 Convergence Theorem for Infinite Determinants (Von Koch 1892)


    A sufficient condition for the convergence of the infinite determinant of an infinite
    matrix (9.691c) is (standard CCLVII) that both the infinite product of the diagonal
    elements minus one (9.691a) [the double series of the sum of off-diagonal elements
    (9.691b)] be absolutely convergent:


    ```

    $$\prod_{m,n=-\infty}^{+\infty} (A_{m,n}-1)A.C. \wedge \sum_{m,n=-\infty}^{+\infty}
    A_{m,n} A.C. \implies Det(A_{m,n}) C. \quad (9.691a-c)$

    ```


    The proof is based on the infinite product (9.692b), including the diagonal elements
    (9.692a), that contains all terms of (9.6921a):


    ```

    $$A_{m,n}=1+a_{m,n}; \quad E=\prod_{m,n=-\infty}^{+\infty}(1+a_{m,n})A.C. \Leftrightarrow
