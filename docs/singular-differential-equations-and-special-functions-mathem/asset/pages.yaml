    # NOTE 9.2: Existence, Unicity, and Regularity Theorems


    When an analytical solution of a differential equation is not available in a closed
    form, or is too cumbersome as a series or integral, approximate methods may be
    used, either (i) numerical or (ii) analytical. The numerical methods (notes 4.1–4.13)
    can in principle be applied to any differential equation, and will lead to a “result,”
    whose correctness needs to be established, raising four questions: (i) does a
    solution exist? If not, the result cannot be correct; (ii) is the solution unique?
    If not, the method oscillate between several solutions and converge to none of
    them; (iii/iv) is the solution continuous or differentiable with regard to (iii)
    initial conditions and/or (iv) parameters of the problem? If not, interpolation
    between solutions for different initial conditions/or parameters may be invalid.


    Thus a reliable use of a numerical method to the solution of a differential equation
    requires that (I) the solution exists and (ii) is unique; (II) the method converges
    to the solution (v) with sufficient accuracy (vi); (III) the proof of the convergence
    and accuracy of the method may require knowledge of some properties of the solution,
    like (ii–iv). The theorems on existence, unicity, and regularity of differential
    equations fortunately apply to wider classes of differential equations (sections
    9.1–9.3) than those for which solutions are known or hopefully be found; unfortunately,
    most of these theorems give no hint of how the solution might be found, so that
    approximate methods are the only way forward.


    The importance of the existence, unicity, and regularity theorems is that: (a)
    they provide a check on the properties of analytical solutions, when they are
    available; (b) otherwise, when analytical solutions are not available, they enable
    approximate solutions. There are several approaches to the proof of theorems of
    existence, unicity, and regularity of solution approximations and to establish
    their properties, both in the qualitative (quantitative) theory of differential
    equations [chapter 4 (9)] that in fact overlap: some methods provide qualitative
    properties, others quantitative solutions, and still others provide both; for
    example, a qualitative method'
