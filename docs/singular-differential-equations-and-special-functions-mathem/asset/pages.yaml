  md: '# Conclusion 9


    The (i) existence and (ii) unicity of solution of a differential equation, as
    well as other properties as (iii) robustness with regard to perturbations of the
    initial conditions, and (iv) uniformity with regard to parameters, can be proved
    for fairly general classes of differential equations, even if solutions are not
    available. The Lipschitz condition(s) leads to a contraction mapping (Figure 9.1)
    specifying a fixed point that is the unique solution; the region of convergence
    is a rectangle (Figure 9.2) in the plane of the dependent and independent variables.
    The robustness relative (bifurcation)) to initial conditions increases (Table
    9.3 ab). The qualitative methods (Diagram 9.1) applied to differential equations
    are also relevant (sections 4.8–9.4) to the stability of dynamical systems (Table
    9.1 and Figure 9.4), both conservative (Table 9.2 and Figure 9.5) and non-conservative
    (Figures 9.6 and 9.7). Among the methods of solution of differential equations
    (Diagram 9.1) the first is on infinite series, parametric integrals and continued
    fractions associated with higher transcendental (special) functions [Diagram 9.3
    to 9.2].


    The special functions are associated with the solution of linear differential
    equations with variable coefficients. In the general case of complex variables,
    two important points are: (i) whether the solutions or integrals are single- or
    multivalued functions (Figures 9.8–9.9), and (ii/iii) the singularities of the
    differential equations (Figures 9.12–9.13) and of its solutions (Tables 9.10–9.11).
    The singularities of the coefficients of a linear differential equation (Tables
    9.3–9.4), for example for the original and generalized Bessel differential equation
    (Tables 9.5–9.6) and other special functions (Diagram 9.2). An alternative to
    the power series is the use of integral transforms transforming parametric integrals
    along the complex plane (Figures 9.15–9.17). Other related topics include the
    solution of linear second-order differential equations using continued fractions,
    the auxiliary functions (Diagram 9.3) like the gamma and Beta functions (Figure
    9.14), and regions of convergence (Figure 9.18).


