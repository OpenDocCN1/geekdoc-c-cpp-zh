  md: '# Singular Differential Equations and Special Functions


    systems. The linear differential equations or simultaneous systems with constant
    coefficients most often hold only if four conditions are met: (i) small perturbations
    or slopes to linearize the differential equation; (ii) Cartesian coordinates so
    that the scale factors are unity in the invariant differential operators like
    the gradient, divergence, and Laplacian; and (iii–iv) steady, homogenous medium
    so that the coefficients are constant, that do not depend on position or time.
    In the linear case (i), the other conditions may not depend on position, for example:
    (ii) for a problem with curved boundaries (such as cylindrical/spherical), for
    use of curvilinear coordinates (cylindrical/spherical) introduces scale factors
    depend on position, not constant; (iii–iv) if the properties of the medium (or
    parameters of the system) are again not constant. It may be quite useful, to consider
    approximations with constant coefficients, with variable equations, that lead
    to straightforward solutions and simple interpretations as a preliminary step;
    however, this may not be enough, and the solution of the linear differential equations
    with variable coefficients may require special functions.


    The difference between ordinary (special) functions is that the elementary (higher)
    transcendental functions are: (i) they provide the solution of linear (non-linear)
    differential equations with constant (variable) coefficients; (ii) they have mostly
    simple (less simple) properties that are straightforward (less straight forward)
    to prove in many cases; and (iii) the same (different) functions provide for all
    (distinct) linear (non-linear) differential equations with constant (variable)
    coefficients. Thus the designation special applies to a set of functions with
    different properties, opening a vast subject, that can be addressed in three ways:
    (i) a dedicated monograph for each set of functions demonstrating in detail its
    properties; (ii) a broader coverage in a volume with chapter on each function
    covering the main properties; or (iii) a table of functions listing most known
    properties of validity and without proofs. There is some benefit in knowing how
    to derive the equations and (i) it ensures that all conditions of validity are
    met; (ii) if one or more are not met, it may suggest either (a) suitable methods
    of generalization or (b) why such generalization cannot hold. The purpose of chapter
    9 is to indicate some general methods of solution of linear differential equations,
    illustrating them with the original and generalized Bessel functions. There are
    many other special functions of frequent use, and some of them are briefly mentioned
    in the sequel.


