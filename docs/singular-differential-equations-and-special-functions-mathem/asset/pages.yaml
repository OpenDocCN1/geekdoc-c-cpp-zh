    # 9.9 Continued Fractions as Solutions of Differential Equations


    The first (second) method I (II) of the power series (integral transforms) applies
    [sections 9.4–9.7 (9.8)] to the solution of linear differential equations of any
    order. Method III of continued fractions (section 9.9) applies only to second-order
    linear differential equations (subsection 9.9.1) that can be treated (subsection
    9.9.2) by triple recurrence relations (sections II.1–6–II.9). Method III expresses
    the logarithmic derivative of the solution of a linear second-order differential
    equation as a continued fraction (subsection 9.9.2) that may: (i) terminate (subsection
    9.9.3), corresponding to a rational function and implying that the solution of
    the differential equation is a polynomial; (ii) be non-terminating or infinite
    (subsection 9.9.4), specifying a transcendental function in the case of convergence,
    that can be considered for real (complex) variable and parameters [subsections
    9.9.5–9.6 (9.13–9.15)]. The confluent hypergeometric and generalized Bessel differential
    equations can be transformed into each other (sections 9.7–9.9), leading to a
    continued fraction for the generalized Bessel function. If instead of the logarithmic
    derivative of a linear second-order differential equation (sections 9.9.1–9.9),
    what is sought is a continued fraction for the solution (sections 9.9.12), then
    the starting point can be a recurrence formula (subsection 9.911) obtained from
    an integral or power series representation (subsection 9.9.10).


    # 9.9.1 Continued Fraction Associated with a Differential Equation


    A linear second-order differential equation with variable coefficients (9.854a)
    can be written in the form (9.854b):


    ```

    $y(x) = a_0(x) y''(x) + b_1(x) y''''(x):\n\frac{y(x)}{y''(x)} = a_0(x) + \frac{b_1(x)}{y''(x)/y''''(x)}$\n(9.854,
    b)$

    ```


    that suggests the following recurrence method: (i) differentiating (9.854a) leads
    to (9.855):


    ```

    $y''(x)[1-a_0(x)] = [a_0(x) + b_1''(x)] y''''(x) + b_1(x) y''''(x),\n(9.855)$

    ```


    that can be rewritten (9.856a):


    ```

    $$\frac{y''(x)}{y''''(x)} = a_1(x) + \frac{b_2(x)}{y''''(x)/y''''(x)},\quad \{a_1(x),
    b_2(x)\} = \frac{a_0(x) + b_1''(x), b_1(x)\}}{1-a_0''(x)}$\n(9.856a–c)$

    ```'
