    # 9.2 Autonomous Systems and Stability of Equilibria (Lyapunov 1954)


    Another important property of differential equations is stability of an equilibrium
    point, that is a point where all derivatives vanish and the system is at rest.
    The equilibrium is stable if for any perturbation the system returns to the equilibrium
    point; it is indifferent neither it returns to the equilibrium nor moves further
    away from it; it is unstable for some perturbations it may move away from the
    equilibrium. The stability/indifference/instability is asymptotic if it is established
    after an infinite time. The stability of equilibrium can be determined from the
    solution of the differential equation, if it is available; if not, a first integral
    energy may be sufficient to establish stability (subsection 9.2.2). The extension
    of this concept is that of a Lyapunov or stability function that, if it exists,
    can specify the stability of an equilibrium position without solving the differential
    equation (subsection 9.2.3). A suitable choice of Lyapunov function can be used
    to prove the stability or otherwise of certain classes of differential equations
    such as: (i/ii) linear equations with bounded'
