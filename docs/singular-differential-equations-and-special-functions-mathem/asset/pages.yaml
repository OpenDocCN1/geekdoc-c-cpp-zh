    # NOTE 9.1: Classes of Differential Equations with Exact Analytical Solutions


    Exact analytical solutions are available only for a limited set of classes of
    ordinary differential equations (recollection 10.1), covering only a small part
    of relevant applications (correction 10.2). To be more precise: (i) linear differential
    equations and simultaneous systems with constant coefficients can be solved up
    to the determination of the roots of the characteristic polynomial (sections 1.3
    and 7.4); (ii) several methods of solution apply to a variety of terms (sections
    1.4–5 and 7.5); and (iii) analog methods apply to linear equations with power
    coefficients (sections 16.6–18 and 76–77) to finite difference equations (sections
    1.9 and 7–89). Solutions for general forms of forcing terms (note 1.1) can be
    obtained using: (i) the method of variation of parameters (notes 1.2–1.4); (ii)
    the Green or influence functions (notes 1.5–1.8); (iii) Fourier series (notes
    1.9–1.10); (iv) Fourier integrals (notes 1.11–1.14); and (v) Laplace transforms
    (notes 1.15–1.28). The last three are also useful in connection with infinite
    and boundary conditions respectively in (iii) finite, (iv) infinite, and (v) infinite
    intervals.


    Exact analytical solutions of (i) linear equations with variable coefficients
    or (ii) non-linear differential equations are the exception rather the rule. They
    apply to a few classes of first-order differential equations in several variables
    (chapter 3 and sections 5.1–5.5), and become fewer for higher-order equations
    (sections 5.6–5.9) and simultaneous systems (section 7.1–7.2). Exact analytical
    solutions in finite or explicit form are not possible for most linear differential
    equations with variable coefficients; these lead to special or extended functions
    (notes 9.6–9.47) expressible as power series (sections 9.4–9) or parametric integrals
    (section 9.8). The exact analytical solutions, even in non-closed form, are less
    frequent for non-linear differential or integral equations so so if the coefficients
    are variable. The present account'
