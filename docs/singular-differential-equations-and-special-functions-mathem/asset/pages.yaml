    Omitting the common factor x, in (9.975) appear the operators:


    ```

    \left(x\frac{d}{dx}+\gamma-1\right)=x\frac{d^2}{dx^2}+\gamma\frac{d}{dx} (9.976a)

    ```


    ```

    \left(x\frac{d}{dx}+\alpha\right)\left(x\frac{d}{dx}+\beta\right)=x^2\frac{d^2}{dx^2}+(1+\alpha+\beta)x\frac{d}{dx}+\alpha\beta.
    (9.976b)

    ```


    Substituting (9.976a, b) in (9.975) leads to the Gaussian hypergeometric differential
    equation (9.977b) with parameters $(\alpha,\beta,\gamma)$:


    ```

