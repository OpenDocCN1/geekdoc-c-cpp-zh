    # NOTE 9.3: Qualitative Theory of Differential Equations


    The existence, unicity, and regularity theorems obtained by the Picard method
    (section 9.1) may be seen as the “classical” precursors of the “modern” qualitative
    theory of differential equations, since they have the same objective: to establish
    properties of solution of a differential equation without actually solving it,
    for example by examining its functional form. The four theorems of Lyapunov are
    good examples of the qualitative theory of differential equations. The first and
    third theorems of Lyapunov (section 9.2), which concern the stability of non-linear
    systems together with the mapping theorems of Poincaré (sections 4.8–4.9), have
    received most attention due to their application to non-linear dynamical systems
    (chapter 4). The other two theorems on linear differential equations, with bounded
    (periodic) coefficients have also been mentioned (section 9.2) as the second and
    fourth theorems.


    Both the Poincaré and Lyapunov approaches are relevant and to some extent complementary,
    to address the problem of systems: (i) an unstable system cannot be expected to
    be found in nature, because possible environmental perturbations are likely to
    cause its transition to another state; and (ii) the stability of a device, a structure,
    or a machine can impair its ability to perform the task it was designed for, or
    even cause incidents or accidents. The assessment of stability or instability
    cannot be restricted to differential equations for which analytical solutions
    are available; the approximate methods considerably enlarge the scope of stability
    analysis to non-linear and variable systems which may be intractable from the
    more demanding point-of-view of exact solutions. The key to the Lyapunov method
    (section 9.2) is the choice of the Lyapunov function, which plays a role similar
    to the perturbation energy: if it decays (does not decay) to zero an equilibrium
    position (cannot be) stable.


    The Lyapunov function may be the energy or it may be another function; for example,
    if there is no energy balance or it does not have the required properties. The
    key to the Lyapunov method is to find an appropriate Lyapunov function; just as
    some existence and unicity theorems do not hit at the form of the solution, the
    Lyapunov method does not hit at the form of the Lyapunov function. Two examples
    of Lyapunov functions were given in the proof of theorems linear and linear differential
    equations as several examples of linear dynamical systems were given in connection
    with one (chapter 2 and 4) or several (chapter 8) degrees of freedom. The case
    of linear differential equations with periodic coefficients leads to the Floquet
    theory (section 9.3) that applies to the Mathieu equation describing simple parametric
    resonance (section 4.3) and to its extension to the Hill equation (section 9.7)
    applying to multiple parametric resonance.'
