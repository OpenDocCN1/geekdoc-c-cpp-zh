  md: '# Singular Differential Equations and Special Functions


    # 9.6 Irregular Singularities and Asymptotic Normal Integrals (Thieme 1883, Poincaré
    1886, Campos 2001)


    If in the neighborhood of an irregular singularity of a linear differential equation
    of order N there are 0 ≤ M < N linearly independent integrals (subsection 9.6.2)
    then the remaining M-N integrals must be irregular (subsection 9.6.1). A particular
    case of an irregular integral is the normal integral which multiplies the remainder
    by a polynomial of inverse powers (subsection 9.6.3). Normal integrals appear
    most often as asymptotic solutions of linear differential equations whose point
    is an irregular singularity (subsection 9.6.4). The normal integrals often involve
    asymptotic expansions (subsection 9.6.5) rather than asymptotic series because
    the convergence theorem for regular integrals (subsection 9.5.11) does not apply.
    If the normal has in the exponential factor a leading inverse power with exponent
    k, then the corresponding irregular singularity of the linear equation is of degree
    k. For example, the radial, cylindrical, and spherical (generalized) Bessel differential
    equation has the point at infinity [subsections 9.6.6-9.6.8 (9.6.9-9.6.12)] an
    irregular singularity of degree one (two). The asymptotic expansions for the Bessel
    functions (subsections 9.5.23-9.5.26) can be obtained [subsection 9.6.6 (9.6.7)]
    most easily leading order (to all orders) from the Rayleigh formulas using the
    method of normal integrals. The asymptotic expansions for the cylindrical and
    original Bessel functions can be obtained (subsection 9.6.8) alternatively from
    those of spherical Hankel functions again by the method of normal integral(s).
    The asymptotic expansions for the first (second) generalized Hankel functions
    [subsection 9.6.9 (9.6.10)], are linearly independent asymptotic solutions of
    the generalized Bessel equation (subsections 9.5.11), are also obtained by the
    method of normal integrals. There is a contrast (subsection 9.6.12) between the
    original Bessel and Neumann functions (Hankel functions) that can (cannot) be
    obtained as the limit of zero degree because there is no (there is) a bifurcation
    for the degree [subsection 9.6.13 (9.6.14)] at the regular (irregular) singularity
    at the origin (infinity). The numerical computation of Bessel functions is performed
    more accurately using the series (asymptotic) expansion for small (large) variable
    (subsection 9.6.15).


