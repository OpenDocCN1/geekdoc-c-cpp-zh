    where: (i) the power with exponent zero is the identity matrix (9.274a); (ii)
    the exponential unity corresponds to the matrix itself (9.274b); (iii) the square
    is the product of the matrix by itself (9.274c):


    ```

    $(A_{ij})^0 = \delta_{ij}, (A_{ij})^1 \equiv A_{ij}, \quad (A_{ij})^2 = \sum_{k=1}^{N}
    A_{ik}A_{kj}, (A_{ij})^{n+1} = \sum_{k=1}^{N} (A_{ik})^k A_{kj}), \quad (9.274a-d)$

    ```


    and (the $(n+1)$-th power is defined (9.274d) by recurrence as the $n$-th power
    multiplied by the matrix.

    Substituting (9.274a-d) in (9.273b) it follows that the exponential of a matrix
    is given by (9.275):


    ```

    $\exp(A_{ij}) = \delta_{ij} + A_{ij} + \frac{1}{2!}\sum_{k=1}^{N} A_{ik}A_{kj}
    + \frac{1}{3!}\sum_{k=1}^{N} A_{ik}A_{kj}A_{ij} + .... \quad (9.275)$

    ```


    where a repeated index implies a summation from 1 to N, for example $k=1,2,...,N=\ell$.
    If the matrix is bounded (9.276a) then: (i) its square is bounded by (9.276b)
    because it consists of N terms with bounded $B$; (ii) each extra power adds terms
    multiplied by B leading to (9.276c):


