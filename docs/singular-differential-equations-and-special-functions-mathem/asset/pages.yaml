  md: '# 9.5 Regular Singularities and Integrals of Two


    Kinds (Fuchs 1860, Frobenius 1873)


    A generalized autonomous system will have all its integrals if: (i) at least one
    coefficient has a simple pole; and (ii) none of the other coefficients has a singularity
    of higher order than a simple pole. In this case the natural integrals have: (i)
    indices that are the eigenvalues of the matrix of residues of the leading terms
    (subsection 9.5.1); and (ii) coefficients of the power series specified by a matrix
    recurrence formula (subsection 9.5.2). The general integral for each dependent
    variable is (subsection 9.5.3) a linear combination of natural integrals that
    satisfies initial and compatibility conditions (subsection 9.5.4). A linear differential
    equation of order N has all integrals regular if (subsection 9.5.5) the coefficient
    of the n-th derivative has at most a pole of order N-n. In this case: (i) the
    indices are (subsection 9.5.5) the roots of a characteristic polynomial of degree
    N and (ii) the coefficients of the series expansion are obtained from a recurrence
    relation (subsection 9.5.6).


    The method of calculation of regular integrals (subsection 9.5.7) is presented
    for a linear second-order differential equation (subsection 9.5.8) leading to
    three cases depending on the degree: (i) if the indices are distinct and do not
    differ by an integer (subsection 9.5.8) they lead to two linearly independent
    regular integrals specifying functions of the first kind; (ii) if the indices
    coincide (by a non-zero integer) the second linearly independent particular integral
    is [subsection 9.5.9 (9.5.10)] of the second kind (first type). Thus the general
    integral is a linear combination of functions of the first and second kind) in
    the case(s) i ([ii]). The independence of the two particular integrals of a linear
    second-order differential equation can be established from the value at one of
    their Wronskian (subsection 1.2.2) which can be calculated from the coefficient
    of the first-derivative (subsection 9.5.12). It is also proved that the series
    in the regular integrals converge absolutely (and uniformly) in an open annulus
    (closed sub-annulus) containing the singularity of the differential equation (subsection
    9.5.11) and extending up to the nearest singularity; if the only singularity is
    at infinity the convergence holds in the whole complex plane.


    An important linear second-order differential equation is (subsection 9.5.22)
    the cylindrical Bessel equation of order v; the method of regular integrals (subsections
    9.5.5-9.5.12) is applied to a more general differential equation, namely (subsection
    9.5.14) the generalized Bessel differential equation. There are three cases of
    solution of the generalized Bessel differential equation of order v and degree
    μ of which the original Bessel differential equation is (subsection 9.5.22). The
    three cases of solution of the generalized Bessel differential equation are: (a)
    if the order is (subsection 9.5.14) not an integer the general integral is a linear
    combination of generalized Bessel functions of orders ±v and degree μ that are'
