    # 9.4.9 Linear Differential Equation with Analytic Coefficients


    The linear differential equation (9.279c) of order N with analytic coefficients
    (9.279a, b):


    ```

    s=0,...,N-1; \quad P_s \in \mathcal{A}(|\mathbb{C}|); \quad \frac{d^N y}{dx^N}
    +\sum_{s=0}^{N-1} P_s(x) \frac{d^s y}{dx^s} = 0, \quad (9.279a-c)

    ```


    is equivalent to the linear autonomous system of differential equations (9.280a,
    b), with analytic coefficients:


    ```

    y_s(x) \equiv y^{(s)}(x) = y_{s-1}''(x), \quad \frac{dy_N}{dx} ==-\sum_{s=0}^{N-1}
    P_s(x) y_s(x); \quad y(x) =\sum_{n=0}^{\infty} C_n x^n, \quad (9.280a-c)

    ```


    and has analytic solutions (9.280c). In particular, the linear second-order differential
    equation (5.220b) = (9.281a) is reducible via a change of dependent variable (5.241c)
    = (9.281b):


    ```

    z''''+P(x)z''+Q(x)z=0; \quad z(x)=y(x) \exp\left{\frac{1}{2} \int^x P(\xi)d\xi\right\,
    \quad (9.281a, b)

    ```


    to the invariant (5.245c) = (9.282b) forming the first-order derivative (5.242b)
    = (9.282a):


    ```

    y''''+I(x)y=0, \quad I(x)=Q(x)-\frac{P''(x)}{2}[P(x)]^2. \quad (9.282a, b)

