  trans: "\n\n如果不需要在此信息上添加额外功能，那么结构体（structure）是这种情况的选择。存储此类信息的结构体定义如下：\n\n```cpp\n\
    struct FootballPlayer{\n  string Name;\n  int KitNumber;\n  double Wage;\n  string\
    \ StrongestFoot;\n};\n```\n\n该结构包含了所有相关值，这将为相似信息提供一个相关的容器。结构体的新实例定义方式如下：\n\n```cpp\n\
    FootballPlayer player1;\nplayer1.Name = \"Messi\" ;\nplayer1.KitNumber = 10;\n\
    player1.Wage = 1000000;\nplayer1.StrongestFoot = \"Both\" ;\n```\n\n这段代码将创建一个\
    \ `FootballPlayer` 并为它的所有成员变量赋值。 \n\n结构体在现实世界中的用法倾向于“简单”使用，即只需要存储像上面示例那样的琐碎数据；当需要功能和封装时，请使用\
    \ `class`。这被称为 `POD`（普通旧数据）封装。注意：结构体变量的默认访问权限是公有的（public），而 `classes` 默认是私有的（private）。\n\
    \n## 枚举 (Enums)\n\n`Enums` 是 `Enumerated Type`（枚举类型）的缩写，它的作用类似于布尔值，但具有无限的用户定义类型，它可以用于“HOME_SCREEN”或“SETTING_SCREEN”等情况的标记。枚举的定义如下：\n\
    \n```cpp\nenum CurrentScreen{\n  HOME ,\n  SETTINGS ,\n  CONTACTS ,\n  CALCULATOR\n\
    };\n```\n\n括号中的每个单词都是枚举可以设置的状态。枚举实例的创建方式如下：\n\n```cpp\nint main(){\n  CurrentScreen\
    \ phone1;\n  phone1 = HOME ;\n}\n```\n\n上面的代码创建了一个新枚举并将其赋值为“HOME”。你现在可以使用枚举来检查它处于什么种状态，下面的示例将使用\
    \ switch-case 语句：\n\n```cpp\n#include \"stdafx.h\"\n#include <iostream>\nusing\
    \ namespace std;\nenum CurrentScreen{\n  HOME ,\n  SETTINGS ,\n  CONTACTS ,\n\
    \  CALCULATOR\n};\nint main(){\n  CurrentScreen phone1;\n  //Change me\n  phone1\
    \ = HOME ;\n  switch (phone1)\n  {\n    case HOME :\n      cout << \"You're on\
    \ the home page\" << endl;\n      break ;\n    case SETTINGS :\n      cout <<\
    \ \"You're on the settings page\" << endl;\n      break ;\n    case CONTACTS :\n\
    \      cout << \"You're on the contacts page\" << endl;\n      break ;\n    case\
    \ CALCULATOR :\n      cout << \"You're on the calculator page\" << endl;\n   \
    \   break ;\n    default :\n      break ;\n  }\n}\n```\n\n**输出**\nYou’re on the\
    \ home page\n\n这段代码向你展示了如何结合条件结构和枚举来轻松创建一个良好的分支结构。可以尝试修改被注释的“Change me”枚举定义，观察输出如何变化。\n\
    \n## 联合体 (Unions)\n\n`Unions` 是为了提供高效内存使用的数据结构，它们可以包含任意数量的成员变量，但一次只能存储一个变量的数据。因此，整个结构只占用最大成员变量的内存。\n\
    \n这些结构必须谨慎使用，因为设置另一个成员变量的值将移除另一个变量中存储的数据，因此非常容易丢失重要数据。联合体的定义如下：\n\n```cpp\nunion\
    \ Example{\n  int i;\n  int x;\n  int y;\n};\n```\n\n实例和值的创建方式如下：\n\n```cpp\n\
    Example e;\ne.i = 4;\n```\n\n为了展示联合体的大小如何工作，下面的程序演示了这一过程：\n\n```cpp\n#include\
    \ \"stdafx.h\"\n#include <iostream>\nusing namespace std;\nunion Example{\n  int\
    \ i;\n  int x;\n  int y;\n} ;\nint main(){\n  Example e;\n  e.i = 4;\n  cout <<\
    \ \"Your int size is: \" << sizeof (int ) << \" bytes\" << endl;\n  cout << \"\
    The union has 3 variables that should be a total of:   << sizeof (int ) * 3 <<\
    \ \" bytes\" << endl;\n  cout << \"However, the union is \" << sizeof (e) << \"\
    \ bytes\" << endl;\n}\n```\n\n**输出**\nYour int size is: 4 bytes\nThe union has\
    \ 3 variables that should be a total of:  12 bytes\nHowever, the union is 4 bytes\n\
    \n如你所见，联合体的大小仅为单个整数的大小，在存在变量空置且只需要一个变量的情况下，这些结构可以高效地使用内存。下面的代码展示了当改变一个值时，所有值会发生什么：\n\
    \n```cpp\n#include \"stdafx.h\"\n#include <iostream>\nunion Example{\n  int i;\n\
    \  int x;\n  int y;\n};\nvoid Print_Union(Example e ){\n  cout << \"i: \" << e\
    \ .i << endl;\n  cout << \"x: \" << e .x << endl;\n  cout << \"y: \" << e .y <<\
    \ endl;\n}\nint main(){\n  Example e;\n  cout << \"1\" << endl;\n  e.i = 4;\n\
    \  Print_Union(e);\n  cout << \"2\" << endl;\n  e.y = 3;\n  Print_Union(e);\n\
    \  cout << \"3\" << endl;\n  e.x = 1;\n  Print_Union(e);\n}\n```\n\n**输出**\n1\n\
    > i: 4\n> x: 4\n> y: 4\n2\n> i: 3\n> x: 3\n> y: 3\n3\n> i: 1\n> x: 1\n> y: 1\n\
    \n如你所见，当你改变一个值时，它们都等于相同的值，这是因为所有值共享相同的内存位置，因此当一个改变时，所有的都会改变。\n\n## 可变参数列表 (Variable\
    \ argument lists)\n\n可变参数列表允许无限参数的可能性。之前我们遇到过具有静态数量参数（可以传递到方法的变量）的函数，例如：\n\n```cpp\n\
    int Add(int i, int y){}\n```\n\n有两个参数：整数 `i` 和整数 `y`。\n\n这被称为 `Variadic Function`（可变函数）或具有无限析度的函数（参数个数，因此上面的\
    \ `Add` 析度为 2）。\n\n变量存储在一个名为 `va_list` 的变量中，它的工作方式与其他任何变量一样，只是它持有了所传递的变量列表。可变函数的定义如下：\n\
    \n```cpp\nvoid Add(int numberOfVariables , ...){}\n```\n\n其中 `numberOfVariables`\
    \ 是传递的额外参数的数量，注意这不包括该变量本身。这是必要的，因为 `va_list` 并不知道变量的总数，也不跟踪它在列表中的位置。使用 `va_list`\
    \ 需要使用几个函数：\n\n*   `va_start (va_list, numberOfVariables)`\n    *   获取传入的变量，并将第二个参数指定的数量赋值给第一个参数。\n\
    *   `va_arg (va_list, type)`\n    *   从第一个参数指定的列表中获取下一个变量，并创建一个类型由 `type` 指定的变量。\n\
    *   `va_end (va_list)`\n    *   清理指定的列表。\n\n"
- fmt: "\nWe can now use these functions to create a working variadic function:\n\n\
    ```cpp\n#include \"stdafx.h\"\n#include <cstdarg>\n#include <iostream>\nusing\
    \ namespace std;\nvoid Add(int numberOfVariables , ...){\n  //The variable list\n\
    \  va_list arg;\n  //Grabs the list\n  va_start (arg, numberOfVariables );\n \
    \ int total = 0;\n  for (int i = 0; i < numberOfVariables ; i++) {\n    //Grabs\
    \ the next variable\n    total += va_arg (arg, int );\n  }\n  //Clean up\n  va_end\
    \ (arg);\n  cout << \"Total is: \" << total << endl;\n}\nint main(){\n  //4 Arguments\n\
    \  Add(4, 1, 2, 3, 4);\n  //10 Arguments\n  Add(10, 6, 9, 5, 11, 22, 1, 3, 56,\
    \ 90, 63);\n}\n```\nOutput>\nTotal is: 10\nTotal is: 266\n\nEach section of the\
    \ variable list process is labelled, this function adds all parameters it’s given.\
    \ This gives a very dynamic way to create one function that can handle an almost\
    \ infinite list of parameters.\n\n### Exercise\nCreate a function that multiplies\
    \ all the parameters given and returns a value, print out that value. Note: this\
    \ `#include` is required: `#include <cstdarg>`\n\n### Solution\nSomething like\
    \ this:\n```cpp\n#include \"stdafx.h\"\n#include <cstdarg>\n#include <iostream>\n\
    using namespace std;\nint Multi(int numberOfVariables , ...){\n  va_list arg;\n\
    \  va_start (arg, numberOfVariables );\n  int total = 1;\n  for (int i = 0; i\
    \ < numberOfVariables ; i++) {\n    //Grabs the next variable\n    total *= va_arg\
    \ (arg, int );\n  }\n  va_end (arg);\n  return total;\n}\nint main(){\n  cout\
    \ << \"The total is: \" << Multi(3, 56, 90, 63) << endl;\n}\n```\n\n### Namespaces\n\
    Namespaces are used to prevent variables and functions with the same name getting\
    \ mixed up, for example the function `Run()` can be applicable in many situations\
    \ so there needs to be a way to distinguish between different `Run()` functions,\
    \ this is where namespaces can be used. They are defined like so with all functions\
    \ and variables in the curly brackets being part of that namespace:\n\n```cpp\n\
    namespace NamespaceName{}\n```\n\nThe example below shows how they are used:\n\
    Two namespaces are defined like so with the same function name:\n\n```cpp\nnamespace\
    \ Proccesing{\n  void Run() {\n    cout << \"Processing!\" << endl;\n  }\n}\n\
    namespace Initialisation{\n  void Run() {\n    cout << \"Initialisation started!\"\
    \ << endl;\n  }\n}\n```\nThis gives the programmer the opportunity to pick which\
    \ `Run()` they can execute by just specifying the namespace like so:\n`Proccesing::Run();`\n\
    and\n`Initialisation::Run();`\nand with them both run together:\n```cpp\nint main(){\n\
    \  Initialisation::Run();\n  Proccesing::Run();\n}\n```\nOutput>\nInitialisation\
    \ started!\nProcessing!\n\nNamespaces therefore gives a way to neatly segment\
    \ code, and improves readability by providing a way to almost label blocks of\
    \ code.\n\n### End of chapter Quiz\n1. What is the recommended situation you should\
    \ use a `struct`?\n2. What is `enum` short for?\n3. How the size of a `union`\
    \ dictated?\n4. What is a key factor about a `union`?\n5. What is a Variadic function?\n\
    6. What does a `va_list` hold?\n7. Why do you need to specified the number of\
    \ parameters in a variable function?\n8. Why does `va_end()` need to be run?\n\
    9. What is the base role of a `namespace`?\n10. What syntax is used when calling\
    \ a function inside a namespace, say you’re calling the function `Add()` inside\
    \ the namespace `Math`?\n\n### Answers\n1. For plain old data (POD).\n2. Enumerated\
    \ type.\n3. It’s the size of its largest member variable\n4. All the member variables\
    \ share the same memory location so only on variable can hold a value at once\n\
    5. A function with a possibly unlimited number of parameters\n6. A list of passed\
    \ in variables to a function\n7. There is no way to tell the size of a `va_list`,\
    \ so you need to specify the number of passed parameters\n8. It performs the clean-up\
    \ of the variable list when it has been used\n9. To segment and label variables\
    \ and functions in a meaningful way.\n10. `Math::Add()`\n\n# Chapter 5: Advanced\
    \ Features\n\n## File I/O\nYou will eventually come across a programming situation\
    \ where you need data to exist between the program running and not running, this\
    \ is where file saving comes into use. File saving is achieved by using functions\
    \ in the `fstream` library, that is included like this:\n`#include <fstream>`\n\
    You also need “iostream” that we’ve come across before for `cout` and `cin`\n\
    `#include <iostream>`\n\nThere are three main objects that are used when saving\
    \ and reading to file:\n* `ofstream`: This deals with the output stream, and is\
    \ used to create and write data to a file\n* `ifstream`: This is the opposite\
    \ of `ofstream` and is used to read data from files\n* `fstream`: This is a function\
    \ that has the characteristic of both `ofstream` and `ifstream`.\n\n### Opening\
    \ a file\nTo open a file we need to use the `open()` function that is a member\
    \ of all the main objects, it works like so:\n```cpp\nfstream f;\nf.open(\"file.txt\"\
    \ , ios ::in);\n```\nWhere:\n* `\"file.txt\"` Is the filename\n* `ios::in` is\
    \ the flag for how the file is to be open, below is a table explaining all the\
    \ options.\n\n| Name | Description |\n| :--- | :--- |\n| `ios::app` | Opens the\
    \ file in append mode, all input is to be added to the end of the file |\n| `ios::ate`\
    \ | Opens a file for input into a file, and moves the read/write control to the\
    \ end of the file |\n| `ios::in` | Opens a file for reading |\n| `ios::out` |\
    \ Opens a file for writing |\n| `Ios::trunc` | If the file exists, the data inside\
    \ is deleted (truncated ) |\n"
