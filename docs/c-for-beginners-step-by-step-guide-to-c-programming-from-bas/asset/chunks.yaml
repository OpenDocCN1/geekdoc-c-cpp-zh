  trans: "\n\n- 使用 `new[]` 分配一块内存\n- 使用 `delete[]` 释放多块内存\n\n例如，如果我们想创建一个指向 5 个对象指针的数组：\n\
    \n```cpp\n#include \"stdafx.h\"\n#include <iostream>\nusing namespace std;\n\n\
    class MyClass{\npublic : \n    MyClass() {\n        cout << \"Made!\" << endl;\n\
    \    }\n    ~MyClass() {\n        cout << \"Deleted!\" << endl;\n    }\n};\n\n\
    int main() {\n    //Create\n    MyClass * classes = new MyClass [5];\n    //Delete\n\
    \    delete[] classes;\n}\n```\n\n输出：\n```\nMade!\nMade!\nMade!\nMade!\nMade!\n\
    Deleted!\nDeleted!\nDeleted!\nDeleted!\nDeleted!\n```\n\n如你所见，`main()` 函数中的第一行创建了\
    \ 5 个 `MyClasses`，构造函数执行并打印“Made!”，接下来的代码则释放内存，析构函数执行并打印“Deleted!”，这可以用极少的代码创建大量的指针。\n\
    \n### 指针算术\n\n你可以给指针加上一个值以将其移动到下一个内存位置。假设我们有一个指向整数的指针，在 64 位系统上一个 `int` 应该是 4\
    \ 字节。因此：\n\n```cpp\nint * p = new int ;\np = p + 1;\n```\n\n上面的代码将移动到下一个 4 字节。你可能会说\
    \ `+1` 是移动到下一个变量大小的间隙，例如，如果我们有一个应该是 8 字节的“long long”，加 1 就会移动 8 字节。你也可以向相反方向操作并减\
    \ 1，这的效果是一样的，只是方向相反。\n\n下面的示例演示了这一点：\n\n```cpp\n#include \"stdafx.h\"\n#include\
    \ <iostream>\nusing namespace std;\n\nint main() {\n    //A size check\n    cout\
    \ << \"int is: \" << sizeof (int ) << \" bytes\" << endl;\n    //Creates memory\n\
    \    int * next = new int [10];\n    for (int i = 0; i < 10; i++) {\n        //Moves\
    \ along 4 bytes\n        cout << next + i << endl;\n    }\n    //Deletes memory\n\
    \    delete[] next;\n}\n```\n\n输出：\n```\nint is: 4 bytes\n00DDDB50\n00DDDB54\n\
    00DDDB58\n00DDDB5C\n00DDDB60\n00DDDB64\n00DDDB68\n00DDDB6C\n00DDDB70\n00DDDB74\n\
    ```\n\n如你所见，内存被分配，且指针每次移动 1 位。从输出可以看出，十六进制地址之间相差 4，因为内存地址是相邻的。\n\n### 章末测试\n\n\
    1. 标志 `ios::app` 代表什么？\n2. 为什么关闭文件很重要？\n3. 使用哪个运算符向文件写入数据？\n4. `.eof()` 代表什么？\n\
    5. 每个递归函数都需要什么？\n6. `#ifdef` 代表什么？\n7. `##` 运算符实现了什么功能？\n8. 什么时候应该使用 `delete []`？\n\
    9. `new` 运算符返回什么？\n10. 给整数指针加 1 会什么？\n\n### 答案\n\n1. 它将以追加模式打开文件。\n2. 它会释放与文件相关的资源。\n\
    3. 插入运算符 (`<<`)。\n4. 这是一个在到达文件末尾时返回 true 的方法。\n5. 一个防止无限循环的停止条件。\n6. 如果别名未定义，则将包含其所封装的代码。\n\
    7. 它连接并替换两个值。\n8. 当你想删除一个块用户分配的内存时。\n9. 指向新创建的内存位置的指针。\n10. 如果整数是 4 字节，它将移动 4\
    \ 字节。\n\n"
