    << "NOT EQUAL" ;​ }​ return 0;}Change the values of value1 and value2 and see
    how the program changes.Using multiple conditionsYou can use more than one condition
    in a single statement, there’re two ways of doing this AND signified by && and
    OR signified by || (Double vertical bar).AND checks if both conditions are true
    before triggering the body of the statementif (Condition1 && Condition2 ){      //Code
    will run here if Condition1 AND Condition2 are True}OR checks if one of the conditions
    are true before triggering the body of the statementif (Condition1 || Condition2
    ){      //Code will run here if Condition1 OR Condition2 are True (Works if both
    are true)}Recap


    *   If statement ​ Deals with conditional statements, code within it’s body will
    run if the condition is true


    *   else statement​ Used as an extension to an if statement that is only checked
    if the if statement is false


    *   &&​ ​ Used to string two conditions together and will only return true if
    both are true


    *   || (Double Bar)​ Used to string two conditions together and will only return
    true if one of the conditions are true


    Switch-CaseSwitch cases are used to test a variable for equality with a constant
    expression without the need for multiple if-statements. One use for this structure
    is check users input string. Below is the basic structure of the switch case://Switch-Caseswitch
    (expression){//Case statementcase constant-expression:​ break ; //Break isn''t
    needed//Any number of case statements// |// |//\ /// .default :​ break ;}The switch
    starts off with an ‘expression’, this is the variable that is to be compared to
    the ‘constant-expressions’, these constants are the literal values of the variable
    such as ‘1’ or ‘Z’. Breaks are optional but without them the code will ‘flow-down’
    into other statements. There is an example below using a switch-case statement,
    the user inputs a character if the char is N or Y, ‘No’ and ‘Yes’ is output respectively
    but there’s a default case that applies for all situations, this needs to be at
    the end.char character;//Reads in user input (Explained in more detail later)scanf("%s"
    , &character);​ //Switch-Caseswitch (character){case ''N'' :​ printf("NO\n" );​
    break ;​ case ''Y'' :​ printf("YES\n" );​ break ;​ default :​ printf("Do not understand!\n"
    );​ break ;}If there is no break statement a ‘flow-down’ will occur, below is
    an example just like above but without the break statements and we’ll what the
    output is like:char character;//Reads in user input (Explained in more detail
    later)char character;cin >> character;//Switch-Caseswitch (character){​ case ''N''
    :​ printf("NO\n" );​ case ''Y'' :​ printf("YES\n" );​ default :​ printf("Do not
    understand!\n" );}If ‘N’ is the user input the Output will be:>NO>YES>Do not understand!This
    is because when one case statement is triggered it will continue down until a
    break statement is found to stop running the case body code.IterationIteration
    means looping, and looping quickly gives programs the ability to perform lots
    of similar operations very quickly, there’re two types of iteration: ‘for loops’
    and ‘while loops/do-while loop’For LoopThe for loop is given an end value and
    loops up until that value, while keeping track of what loop number it’s currently
    on, here is an example below:for (int x = 0; x > 10; x++){​ cout << "Loop!" <<
    endl;}for(int x = 0 ; x > 10 ; x++ )Each part of the for-loop has a roleRedThis
    is the Declaration section to define the loop counter variable, this defines the
    start point of the counterGreenThis section is called the Conditional and it contains
    a conditional statement that is checked at the end of the loop to see if the if-statement
    should continue looping, so in this case the loop should continue looping if x
    > 10, if this condition becomes false the loop will not continue.Blu eThe blue
    statement is the Increment section where the loop counter is incremented (increased
    in value), the x++ is shorthand for x = x + 1 . This can also be x-- , if there
    was a case requiring the counter to decrease.


    *   Declaration section defines the loop counter


    *   Conditional section continues the loop if true


    *   Increment section is where the loop counter is incremented'
