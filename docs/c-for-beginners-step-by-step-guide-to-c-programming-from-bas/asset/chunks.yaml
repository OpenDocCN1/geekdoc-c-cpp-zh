    building blocks of a program, they allow the reuse of code, the ability to keep
    it readable and stops the programmer repeating code. Repeating code is heavily
    advised against because bugs will be repeated multiple times and changes to code
    also need repeating. Functions give a centralised controlled area that deals with
    the distinct roles of the program. A method has two elements, parameters :(the
    items passed into the function) and the return type (the variable being returned)
    these are both optional and you can have a function with neither.A function must
    be defined above its call, like so;//Function callvoid PrintSmile(){​ cout <<
    ":)" << endl;}int main(){​ //Method call​ PrintSmile();​ return 0;}Function ParametersSometimes
    it might be useful to pass data into a program, there are two types of parameter
    passing, by reference and by value. Passing by reference is what it sounds like,
    it passes a direct reference to a variable not a copy, so any changes to that
    passed variable effect it back in the calling function. Passing by value is the
    passing of a copy of that variable, so any changes to that variable do not effect
    that passed variable.


    *   Passing by reference means changes to the parameter effects the passed variable


    *   Passing by value means changes to parameter does not affect the passed variable'
