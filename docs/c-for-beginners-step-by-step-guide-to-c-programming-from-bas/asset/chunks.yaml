  trans: "\n\n# 用户 I/O\n在某些情况下和编程问题中涉及用户交互，这就是用户输入和输出用用场。处理这些内容的库被称为“`iostream`”，并如下所示包含在项目中：\n\
    \n```cpp\n#include <iostream>\n```\n\n## 打印/输出\n有时用户需要提示或需要显示信息，这就是控制台打印大用用场。关键字\
    \ `cout` 用于将数据打印到屏幕上，它与流插入运算符 `<<` 配合使用，该运算符用于指定要打印的内容。示例如下：\n\n```cpp\ncout <<\
    \ \"Hello!\" << endl;\n```\n输出将会在屏幕上显示“Hello!”一单词。`endl` 仅用于打印回车符（`\\n`）。你也可以创建一个涉及变量或另一个字符串的输出，可以使用多个流插入运算符：\n\
    \n```cpp\nint x = 10;\ncout << \"The value is: \" << x << endl;\n```\n输出> The\
    \ value is: 10\n\n## 读取/输入\n获取用户输入也很有用，使用的运算符被称为流提取运算符 `>>`，并与 `cin` 配合使用，其工作方式如下：\n\
    \n```cpp\n#include \"stdafx.h\"\n#include <iostream>\nusing namespace std;\nint\
    \ main(){\n  //读取入 name\n  char name[10];\n  cin >> name;\n  //打印出 name\n  cout\
    \ << name;\n}\n```\n\n## 章末测试\n本节旨在让你对之前的内容保持警惕，会有 10 个问题你可以回答以测试你的知识，答案在下面的相邻章节中。\n\
    \n1. 用于存储一系列字符的数据类型是什么？\n2. “%”符号是做什么用的？\n3. 这个符号“==”是在检查什么？\n4. 如果在单个 if 语句的两个条件语句之间有“&&”，它意味着什么？\n\
    5. 变量末尾的“++”意味着什么？\n6. 这个运算符叫什么：“>>”？\n7. 数组是否有查找其大小的内置属性？\n8. 这个循环叫什么，它是做什么的？\n\
    \   ```cpp\n   for(;;){}\n   ```\n9. 布尔变量持有哪两个值？\n10. `void` 类型用在哪里？\n\n### 答案\n\
    1. 字符串（String）。\n2. 获取两个数字的取模。\n3. 如果两边的值相等。\n4. 表示只有当两个条件都为真时，语句才为真。\n5. 它将增加该变量的值。\n\
    6. 流提取运算符。\n7. 没有，唯一的方法是使用 `sizeof()` 运算符找到数组的总以及以及元素的大小，然后将两个值相除以得到大小。\n8. 它被称为裸\
    \ for 循环，会无限循环。\n9. 真（True）或假（False）。\n10. 用于表示函数不返回值。\n\n# 第 3 章：类结构与 OOP\n类是\
    \ C++ 程序的构建块，它们允许以一种方便的饼干模具方式创建存储和表示数据的地方。C++ 中的类有两个文件：头文件（`.h`）和实现文件（`.cpp`）。\n\
    \n*   头文件应只包含类和变量的定义。\n*   实现文件正如其名，包含了函数和变量的实际功能。\n\n空的头文件看起来像这样：\n```cpp\nclass\
    \ Example{\npublic :\n  Example();\n  ~Example();\n};\n```\n关于这里有一些关键点，公共部分定义了方法如何被访问，现在不用太担心这个，因为这将在封装节中进一步解释。`Example()`\
    \ 和 `~Example()` 函数分别是构造函数和析构函数，构造函数在类创建时运行，析构函数在类销毁时运行，这既可以通过手动调用方法完成，也可以由编译器自动完成。\n\
    \n`.cpp` 文件看起来像这样：\n```cpp\n#include \"Example.h\"\nExample ::Example(){}\nExample\
    \ ::~Example(){}\n```\n这些中的每一个都是对 `Example` 类的引用。你可以实现未在头文件中定义的函数或变量，然而这被认为是一种坏做法。\n\
    \n例如，让我们使用一个详细的类版本来展示如何使用它。示例如下：\n```cpp\nclass Shape{\npublic :\n  Shape(double\
    \ len , double wid );\n  ~Shape();\n  double getArea();\nprivate :\n  double length;\n\
    \  double width;\n  double area;\n};\n```\n```cpp\n#include \"Shape.h\"\n#include\
    \ <iostream>\nusing namespace std;\nShape ::Shape(double len , double wid ){\n\
    \  length = len ;\n  width = wid ;\n  area = length * width;\n  cout << \"Shape\
    \ made!\" << endl;\n}\nShape ::~Shape(){}\ndouble Shape ::getArea(){\n  return\
    \ area;\n}\n```\n一个 shape 的实例可以像这样创建：\n```cpp\nShape s = Shape (10, 10);\n```\n\
    注意：头文件需要在顶部包含：\n```cpp\n#include \"Shape.h\"\n```\n这为程序员提供了一种非常方便的方法来创建许多有用数据的容器。\n\
    \n## 继承\n继承是面向对象编程中最重要的概念之一，它是获取一个类（基类）并赋予其他类函数和变量的想法。这提供了一个重用代码的完美机会。\n\n通过上面的\
    \ shape 示例，我们现在可以创建一个名为“Square”的类，但继承自基类“Shape”。为了显示，从现在起我将所有代码放在一个 `.cpp` 文件中。Square\
    \ 类如下：\n```cpp\n#include \"stdafx.h\"\n#include <iostream>\nusing namespace std;\n\
    class Shape{\npublic :\n  double length;\n  double width;\n  double area;\n  Shape(double\
    \ l , double w ) {\n    length = l ;\n    width = w ;\n    area = l * w ;\n  }\n\
    \  ~Shape() {\n  }\n  double getArea() {\n    return area;\n  }\n};\nclass Square\
    \ : public Shape{\npublic :\n  Square(double l , double w ) : Shape (l , w ) {\n\
    \  }\n};\nint main(){\n  Square s = Square (10, 10);\n  cout << s.getArea() <<\
    \ endl;\n}\n```\n输出> 100\n\nSquare 现在拥有 Shape 定义为 Public 和 Protected 的所有（将在下一节解释），但如上所述，它是重复已内容的好方法。\n\
    \n### 练习\n添加一个名为“Rectangle”的类并让它继承 shape 类。不要忘记为 rectangle 类包含构造函数。\n\n### 方案\n\
    类似这样的：\n```cpp\nclass Rectangle : public Shape{\npublic :\n  Rectangle(double\
    \ l , double w ) : Shape (l , w ) {\n  }\n};\n```\n\n## 封装\n封装是限制对类内部敏感变量或方法访问的思想，有不同的访问修饰符：\n\
    \n| | 包含类 | 派生类 | 包含汇编 | 外部汇编 |\n| :--- | :--- | :--- | :--- | :--- |\n| 公共 (Public)\
    \ | | | | |\n| 保护 (Protected) | | | | |\n| 私有 (Private) | | | | |\n\n上面的表格比较了带有任意修饰符标记的变量或方法在何处可以不可以访问。\n\
    \n*   包含类是对象定义的类。\n*   派生类是任何继承其他类的类\n*   包含汇编是当前 .exe 或 .dll 文件内部的任何地方\n*   外部汇编是存在的任何其他区域\n\
    \n"
- fmt: "\nThis means you can control the access to variables. But what if a variable\
    \ is marked as private, what if it needs to be accessed externally? You used “getters”\
    \ and “setters”, methods that are specifically designed to retrieve and alter\
    \ variables. These are a wonderful practise to keep code safe and secure, so let’s\
    \ alter our shape class to make it more secure.\n\nBefore we could do this:\n\
    ```cpp\nShape s = Shape (10,10);\ns.length = -1;\n```\n\nThis is undesirable as\
    \ it invalid information, you cannot have a negative length, this is where a setter\
    \ comes into use, the function can contain code to validate (check) the value\
    \ that is attempting to be placed in the `length` variable, something like this:\n\
    \n```cpp\nvoid setLength(double value ){\n  if (value > 0) {\n    length = value\
    \ ;\n  }\n  else {\n    cout << \"Error: Value is negative!\" << endl;\n  }\n\
    }\n```\n\nThis function performs the necessary checks on the value to prevent\
    \ invalid information getting into variables in the class. Below is an improved\
    \ version of the class:\n\n```cpp\nclass Shape{\nprivate :\n  double length;\n\
    \  double width;\n  double area;\npublic :\n  Shape(double l , double w ) {\n\
    \    length = l ;\n    width = w ;\n    area = l * w ;\n  }\n  ~Shape() {\n  }\n\
    \  double getArea() {\n    return area;\n  }\n  double getLength() {\n    return\
    \ length;\n  }\n  double getWidth() {\n    return width;\n  }\n}\n```\n\nAs you\
    \ can see all the variables have been marked as Private and getters have been\
    \ added, this is the way classes should be structure.\n\n## Polymorphism\n\nThe\
    \ word polymorphism means having many forms and polymorphism in the context of\
    \ OOP means having one method that can have many roles. We can use the example\
    \ of the class `shape` and overload a method that determines the area if for example\
    \ we wanted to make a `Triangle` class, this is the shape class but with a virtual\
    \ `getArea()` method:\n\n```cpp\nclass Shape{\nprotected :\n  double length;\n\
    \  double width;\n  double area;\npublic :\n  Shape(double l , double w ) {\n\
    \    length = l ;\n    width = w ;\n  }\n  ~Shape() {\n  }\n  virtual double getArea()\
    \ {\n    return length * width;\n  }\n};\n```\n\nVirtual methods give the option\
    \ be overridden an changed by a class that inherits it, it is also an optional\
    \ change.\n\n```cpp\nclass Triangle : public Shape{\npublic :\n  Triangle(double\
    \ l , double w ) : Shape (l , w ) {\n  }\n  double getArea() override {\n    return\
    \ 0.5 * (length * width);\n  }\n};\n```\n\nAbove is the implementation of the\
    \ `Triangle` class, highlighted is the `override` keyword used to change the functionality\
    \ of the virtual function.\n\n```cpp\nint main() {\n  Shape s = Shape (10, 10);\n\
    \  cout << \"The shapes area is: \" << s.getArea() << endl;\n  Triangle t = Triangle\
    \ (10, 10);\n  cout << \"The triangles area is: \" << t.getArea() << endl;\n}\n\
    ```\n\nOutput:\n> The shapes area is: 100\n> The shapes area is: 50\n\nAs you\
    \ can see from the example above each `getArea()` function is implemented differently\
    \ and returns a different result. This polymorphic design still gives the ease\
    \ of creating lots of new data types without the need for repeating code but with\
    \ a level of customising involved.\n\n### Exercise\nAdd a new class called `Circle`,\
    \ it will need a different constrictor that only takes height and the `getArea`\
    \ method needs overloading.\n\n### Solution\n```cpp\nclass Circle : public Shape{\n\
    public :\n  Circle(double h ) : Shape (h , 0) {\n  }\n  double getArea() override\
    \ {\n    return 3.14 * ((length / 2) * (length / 2));\n  }\n};\n```\n\nAs you\
    \ can see a constructor is provided that only includes the height and the `getArea()`\
    \ returns an relatively imprecise area for the circle. Polymorphism if done correctly\
    \ can give an extremely clean and readable code base with methods and classes\
    \ adapting behaviour where necessary.\n\n## Interfaces\n\nAn interface describes\
    \ the behaviour of capabilities of C++ class without committing to implementation.\
    \ Interfaces are implemented using abstract classes, and are just the plan for\
    \ the class .Abstract classes are made by adding a pure virtual functions to a\
    \ class, a pure virtual function is a function with no body and is specified by\
    \ placing a “=0” next to the function like so:\n\n```cpp\nvirtual double getVar()\
    \ = 0;\n```\n\nThis means the role the function is just to be inherited and adapted.\
    \ Failing to override a pure virtual function in an inherited class results in\
    \ an error, so It’s considered a strict blueprint to design classes.\n\nAn error\
    \ seen from not implementing a pure virtual function:\n![](image1287.jpg)\n\n\
    Below is an example involving animals:\n\n```cpp\n#include \"stdafx.h\"\n#include\
    \ <iostream>\nusing namespace std ;\nclass Animal{\npublic :\n  //Pure virtual\
    \ function\n  virtual void MakeSound() = 0;\n};\nclass Dog : public Animal{\n\
    public :\n  void MakeSound() {\n    cout << \"Bark!\" << endl;\n  }\n};\nclass\
    \ Cat : public Animal{\npublic :\n  void MakeSound() {\n    cout << \"Meow!\"\
    \ << endl;\n  }\n};\nclass Lion : public Animal{\npublic :\n  void MakeSound()\
    \ {\n    cout << \"Raw!\" << endl;\n  }\n};\nint main() {\n  Dog d;\n  d.MakeSound();\n\
    \  Cat c;\n  c.MakeSound();\n  Lion l;\n  l.MakeSound();\n}\n```\n\nOutput:\n\
    > Bark!\n> Meow!\n> Raw !\n\nAs you can tell it’s a very rudimental pointless\
    \ example, however it’s supposed to show how a base class can hold basic information\
    \ and class that inherits it is supposed to add information on top, in this example\
    \ the program states that anything that inherits animals needs to have a sound,\
    \ this can be adapted upon to make complex designs for classes and easily fill\
    \ in relevant implementation.\n\nAnother example below will use the classic shape\
    \ example and have a base class called “Shape” that will have an abstract function\
    \ “getArea()” that will need implementing for each shape:\n\n```cpp\n#include\
    \ \"stdafx.h\"\n#include <iostream>\nusing namespace std;\nclass Shape{\npublic\
    \ :\n  //Pure virtual function\n  virtual int Area() = 0;\n  Shape(double h ,\
    \ double w ) {\n    heigth = h ;\n    width = w ;\n  }\nprotected :\n  double\
    \ heigth;\n  double width;\n};\nclass Circle : public Shape{\npublic :\n  Circle(double\
    \ h , double w ) : Shape (h , w ) {}\n  int Area() {\n    return 3.14 * ((heigth\
    \ / 2) * (heigth / 2));\n  }\n};\nclass Rectangle : public Shape{\npublic :\n\
    \  Rectangle(double h , double w ) : Shape (h , w ) {}\n  int Area() {\n    return\
    \ heigth * width;\n  }\n} ;\nint main() {\n  Rectangle r = Rectangle (10, 20);\n\
    \  cout << r.Area() << endl;\n  Circle c = Circle (5, 5);\n  cout << c.Area()\
    \ << endl;\n}\n```\n\nAnother simple example, but take your time and get used\
    \ to it, abstract class architecture allows easy addition of new function and\
    \ classes even if the design has been made due to the easy blueprint-esk design.\n\
    \n## End of chapter Quiz\n\n1. What are the two files used to make a class?\n\
    2. What symbol comes before the destructor definition?\n3. What role should a\
    \ header file take?\n4. What does protected mean for a variable that is being\
    \ inherited?\n5. What is the role of polymorphism?\n6. What keyword is used to\
    \ change a virtual method?\n7. How do you signify a pure virtual function?\n8.\
    \ Where can a function or variable marked as private be accessed?\n9. What is\
    \ role of the constructor?\n10. What should the .cpp file contain?\n\n### Answers\n\
    \n1. Header (.h) and C++ file (.cpp).\n2. The symbol `~` I used to show a destructor.\n\
    3. Just definitions of functions and variables.\n4. It can only be accessed outside\
    \ the definition class by a class that inherits it.\n5. To have a single base\
    \ definition but lots of different implementations.\n6. `Override` is used to\
    \ change a virtual method.\n7. With a normal function definition that is equal\
    \ to zero.\n8. Only in the class where it was defined.\n9. Is a special function\
    \ without a return type that is called when an instance of a class is created.\n\
    10. Implication of functions and variables defined in the header file.\n\n## Chapter\
    \ 4: Improved Techniques\n\n### Structures\n\nStructs originate from C, and come\
    \ from the world of pre-class programming. However, they’re still useful and can\
    \ be use in places where classes are deemed as overkill. A good example of using\
    \ a structure being used can be for record keeping, for example you needed to\
    \ keep track of football players in a team you would need to store:\n\n*   Name\n\
    *   Kit Number\n*   Wage\n*   Strongest foot\n*   Etc\n"
