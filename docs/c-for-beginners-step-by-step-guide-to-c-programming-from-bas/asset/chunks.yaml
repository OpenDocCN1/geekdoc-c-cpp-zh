- fmt: "\n*   `int`: Holds real numbers\n*   `float` / `double`: Hold decimal numbers\n\
    *   `void`: Specifies there is not type\n*   `boolean`: Holds either true or false\n\
    *   `string`: An array of characters making up a word or sentence\n*   `global`:\
    \ A variable that can be accessed anywhere\n*   `const`: Means after a variable\
    \ has been initialised its value cannot be changed\n\n## Conditionals\n\n### If\
    \ statement\nThere are situations where you need something to happen if a certain\
    \ condition is the case, this is the role of the `If` statement and where conditional\
    \ statements come into the mix.\n\n```cpp\nif (Condition){\n    //Code will run\
    \ here if Condition is true\n    //Code will jump here if Condition is false\n\
    }\n```\n\nIn use:\n```cpp\n#include \"stdafx.h\"\n#include <iostream>\nusing namespace\
    \ std;\nint main(){\n  int numberOfBooks = 10;\n  if (numberOfBooks > 0)\n  {\n\
    \    cout << \"You have a book!\" << endl;\n  }\n}\n```\nOutput: `> You have a\
    \ book !`\n\nThese allow a programmer to control the flow of the program and choose\
    \ situations to happen when a possibility is true, we’ll go onto more examples\
    \ later.\n\n### Else Statement\nElse’s are optional but these can be added to\
    \ the end of an `if`-statement and will only run if the `if`-statement condition\
    \ is false.\n\n```cpp\nif (Condition ){\n    //Code will run here if Condition\
    \ is True\n}\nelse{\n    //Code will run here if Condition is False\n}\n```\n\n\
    Else statements can also become an `else/if` statement where a new `if` statement\
    \ is attached, this look like this:\n\n```cpp\nif (Condition1 ){\n    //Code will\
    \ run here if Condition1 is True\n}\nif else (Condition2 ){\n     //Code will\
    \ run here if Condition1 is False and Condition2 is True\n    //If neither are\
    \ true no code will run\n}\n```\n\nYou can also chain another `else` statement\
    \ onto an `else` statement effectively creating an infinite chain. If any conditions\
    \ along the chain are true, the ones below are not checked, I’ll demonstrate this\
    \ below:\n\n```cpp\n#include \"stdafx.h\"\n#include <iostream>\nusing namespace\
    \ std;\nint main(){\n  if (false )\n  {\n    cout << \"Contition1!\" << endl;\n\
    \  }\n  else if (true ) //This condition is true!\n  {\n    cout << \"Contition2!\"\
    \ << endl;\n  }\n  else if (true ) //Ignored, due to previous else statement being\
    \ true\n  {\n    cout << \"Contition3!\" << endl;\n  }\n  else if (true ) //Also\
    \ ignored due to condition 2 being true\n  {\n    cout << \"Contition4!\" << endl;\n\
    \  }\n  return 0;\n}\n```\nOutput: `> Condition 2`\n\nAfter the body of condition\
    \ 2 is hit and the `cout` statement is executed, the program does not go onto\
    \ to check the other `else` statements.\n\n### Exercise\nAdapt a program to check\
    \ if a value is equal to another and print “EQUAL”, if they’re not print “NOT\
    \ EQUAL”, the skeleton code is below:\n\n```cpp\n#include \"stdafx.h\"\n#include\
    \ <iostream>\nusing namespace std;\nint main(){\n  int value1 = 10;\n  int value2\
    \ = 10;\n  //CODE GOES HERE\n}\n```\n\n### Solution\n```cpp\n#include \"stdafx.h\"\
    \n#include <iostream>\nusing namespace std ;\nint main(){\n  int value1 = 10;\n\
    \  int value2 = 10;\n  if (value1 == value2)\n  {\n    cout << \"EQUAL\" ;\n \
    \ }\n  else\n  {\n    cout << \"NOT EQUAL\" ;\n  }\n  return 0;\n}\n```\nChange\
    \ the values of `value1` and `value2` and see how the program changes.\n\n###\
    \ Using multiple conditions\nYou can use more than one condition in a single statement,\
    \ there’re two ways of doing this AND signified by `&&` and OR signified by `||`\
    \ (Double vertical bar).\n\n*   `AND` checks if both conditions are true before\
    \ triggering the body of the statement:\n    ```cpp\n    if (Condition1 && Condition2\
    \ ){\n        //Code will run here if Condition1 AND Condition2 are True\n   \
    \ }\n    ```\n*   `OR` checks if one of the conditions are true before triggering\
    \ the body of the statement:\n    ```cpp\n    if (Condition1 || Condition2 ){\n\
    \         //Code will run here if Condition1 OR Condition2 are True (Works if\
    \ both are true)\n    }\n    ```\n\n## Recap\n*   `If` statement: Deals with conditional\
    \ statements, code within it’s body will run if the condition is true\n*   `else`\
    \ statement: Used as an extension to an `if` statement that is only checked if\
    \ the `if` statement is false\n*   `&&`: Used to string two conditions together\
    \ and will only return true if both are true\n*   `||` (Double Bar): Used to string\
    \ two conditions together and will only return true if one of the conditions are\
    \ true\n\n## Switch-Case\nSwitch cases are used to test a variable for equality\
    \ with a constant expression without the need for multiple `if`-statements. One\
    \ use for this structure is check users input string. Below is the basic structure\
    \ of the switch case:\n\n```cpp\n// Switch-Case\nswitch (expression){\n    case\
    \ constant-expression:\n        break ; //Break isn't needed\n    //Any number\
    \ of case statements\n    // |\n    // |\n    \\ ///default :\n        break ;\n\
    }\n```\n\nThe `switch` starts off with an `expression`, this is the variable that\
    \ is to be compared to the `constant-expressions`, these constants are the literal\
    \ values of the variable such as ‘1’ or ‘Z’. Breaks are optional but without them\
    \ the code will ‘flow-down’ into other statements. There is an example below using\
    \ a switch-case statement, the user inputs a character if the `char` is `N` or\
    \ `Y`, ‘No’ and ‘Yes’ is output respectively but there’s a `default` case that\
    \ applies for all situations, this needs to be at the end.\n\n```cpp\nchar character;\n\
    //Reads in user input (Explained in more detail later)\nscanf(\"%s\" , &character);\n\
    //Switch-Case\nswitch (character){\n    case 'N' :\n        printf(\"NO\\n\" );\n\
    \        break ;\n    case 'Y' :\n        printf(\"YES\\n\" );\n        break\
    \ ;\n    default : \n        printf(\"Do not understand!\\n\" );\n        break\
    \ ;\n}\n```\n\nIf there is no break statement a ‘flow-down’ will occur, below\
    \ is an example just like above but without the break statements and we’ll what\
    \ the output is like:\n\n```cpp\nchar character;\n//Reads in user input (Explained\
    \ in more detail later)\ncin >> character;\n//Switch-Case\nswitch (character){\n\
    \    case 'N' :\n        printf(\"NO\\n\" );\n    case 'Y' :\n        printf(\"\
    YES\\n\" );\n    default : \n        printf(\"Do not understand!\\n\" );\n}\n\
    ```\nIf ‘N’ is the user input the Output will be:\n`>NO`\n`>YES`\n`>Do not understand!`\n\
    This is because when one case statement is triggered it will continue down until\
    \ a break statement is found to stop running the case body code.\n\n## Iteration\n\
    Iteration means looping, and looping quickly gives programs the ability to perform\
    \ lots of similar operations very quickly, there’re two types of iteration: ‘for\
    \ loops’ and ‘while loops/do-while loop’\n\n### For Loop\nThe `for` loop is given\
    \ an end value and loops up until that value, while keeping track of what loop\
    \ number it’s currently on, here is an example below:\n\n```cpp\nfor (int x =\
    \ 0; x > 10; x++){\n    cout << \"Loop!\" << endl;\n}\nfor(int x = 0 ; x > 10\
    \ ; x++ )\n```\n\nEach part of the `for-loop` has a role:\n*   **Red**: This is\
    \ the Declaration section to define the loop counter variable, this defines the\
    \ start point of the counter.\n*   **Green**: This section is called the Conditional\
    \ and it contains a conditional statement that is checked at the end of the loop\
    \ to see if the `if`-statement should continue looping, so in this case the loop\
    \ should continue looping if `x > 10`, if this condition becomes false the loop\
    \ will not continue.\n*   **Blue**: The blue statement is the Increment section\
    \ where the loop counter is incremented (increased in value), the `x++` is shorthand\
    \ for `x = x + 1`. This can also be `x--`, if there was a case requiring the counter\
    \ to decrease.\n\n*   Declaration section defines the loop counter\n*   Conditional\
    \ section continues the loop if true\n*   Increment section is where the loop\
    \ counter is incremented\n"
