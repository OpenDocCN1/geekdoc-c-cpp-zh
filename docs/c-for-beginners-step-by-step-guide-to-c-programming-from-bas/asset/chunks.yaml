    129Chapter 1: Introduction and InstallationHistory of C++C++ is a general purpose
    programming language. It’s aim as a programming language is to offer a platform
    to create efficient and bare-boned applications. C++ was released in 1983, and
    first started on in 1979 by Bjarne Stroustrup where it was known as “C with classes”
    where it was later in 1983 renamed to be C++.The language is still maintained
    with updates every few years, where it is still one of the most popular languages
    in the world.Running C++ on WindowsOne of the best ways to run C++ on a Windows
    based computer is Visual Studio, this can be downloaded directly from Microsoft
    with the most recent version being Visual Studio 2017.Download and run the installer,
    throughout the installer you’ll be met with this menu, make sure C++ is selected.![](image89.jpg)Complete
    the install and load up Visual Studio.To create a project you need to then select
    FILE -> NEW PROJECT like so:![](image95.jpg)You’ll then be met with this window:![](image100.jpg)Follow
    the menus through and you’ll be ready to run the code.Running C++ on Mac and LinuxRunning
    on C++ on UNIX based environments can be achieved by the use of clang or “gcc”,
    you can use it like so in the OS’s terminal window:gcc main.cpp -o main.out The
    file can now be run like:./main.outYou can create a .cpp file in a notepad editor
    of your choice.Running C++ OnlineA easy way to compile C++ online is by using
    “TutorialPoints” C++ Online, like is below:[https://www.tutorialspoint.com/compile_cpp11_online.php](https://www.tutorialspoint.com/compile_cpp11_online.php)And
    should look something like this:![](image127.jpg)PrerequisiteA few things need
    to be explained before starting is basics:The first is the basic program design:#include
    "stdafx.h"using namespace std;int main(){    return 0;}The program above is the
    basic design provided, the code goes in the curly brackets of the main() section
    and each aspect will be described in the later sections.You’ll also come across
    lines that start with “//”, these are comments and their only purpose is to add
    descriptions to label and explain code, they are defined by a distinctive green
    colour://CommentThe next thing is output from a program, in examples in upcoming
    chapters you will come across lines like:cout << "Print" << endl;This for the
    time being is simply printing out data to the screen, the sections of it will
    be explained in later sections.Chapter 2: BasicsVariables and typesThe basis of
    a program is data, in the form of numbers and characters. The storing, manipulation
    and output of this data gives functionality. Variables hold this data, think of
    it as a box used to store a single item.C++ is a heavily typed language where
    each variable must have a defined type. A type is an identifying keyword that
    defines what the variable can hold. The first type we will come across is the
    integer, this can hold real numbers (numbers without a decimal place), an integer
    is defined below:int value = 6;- int is the defined type keyword, we will learn
    about the difference possibilities later.- “value” is the ID for the variable,
    this can be anything you want to call it, this is used to allow a variable to
    have a meaningful name, the variable could be defined as “int pineapple = 3;”
    , but it’s good practise to make them relevant. However, there are a few exception
    to this as a variable cannot be a single digit i.e. ‘4’ or cannot contain special
    characters (!”£$%^&*) etc.- “= 6;” Is the assignment section, where the values
    of 3 is placed in the integer box for use later. This also ends with a semi colon,
    this is used to signify the end of a line.This variable can now be used in valid
    areas of the program, like so:int anotherValue = value;The value of “value” defined
    earlier will now be placed in the anotherValue variable and they will now both
    have the value of 3\. The value of value doesn’t change as it is just being copied
    and placed into anotherValue .StringThe String is another crucial variable, this
    variable type is used to store a series of characters, an example could be the
    word “batman”, the word is composed of characters that are stored in the String
    variable. It’s an array of characters (More on arrays later), but effectively
    it’s the single characters of the word stored next to each other in memory. The
    ‘\n’ is a special character that stands for a newline.#include "stdafx.h"#include
    <string >using namespace std;int main(){​ //String class​ string wordStr = ""
    ;​ //Character array​ char wordCharArray[] = "" ;​ return 0;}As you can see above
    there are two ways to save a string, the first way is by using a ‘wrapper’ that
    is something that hides functionality and adds extra on top, this makes it easier
    to move around a string (we’ll talk about passing around variables later) and
    the second way is to use a char array, string is the recommended way to store
    a string variables.Note the use of:#include <string>This informs the program you
    want to use the “string” wrapper in the program.­ ­BooleanBooleans are used as
    expressions, their values can only be true or false  and are used to signify certain
    states or flag certain events, they can also hold the result for a conditional
    expression (More on conditional expressions later). These will make more sense
    when we go thought conditional statements.bool True = true ;bool False = false
    ;Float/DoubleFloating point variables are decimal values created with float point
    precision math, the technical elements of how this works are outside of the scope
    of this tutorial but can easily be explained through resources on the internet,
    just search “floating point precision”. Floats allows for a higher level of accuracy
    of a value by providing decimal precision. You can specify a ‘float’ value by
    putting an ‘f’ and the end of the value.float decimalValue = 3.0f;VoidThis data
    type is special and is used to specify no value is available. This sounds counter
    intuitive, but we’ll see where this is used later.Notable keywords/termsconst
    – This keyword turns the variable read-only, meaning it’s value cannot be changed
    after it is initialised. The keyword is used like so:const float pi = 3.14f;Global
    variable – This is a term describing a variable definition outside the main function.
    For example, the int friendCount is a global variable and the int currentMonth
    is not. Note the positions they’re defined://Globalint friendCount = 0;int main(){​
    //Not Global​ int currentMonth = 5;return 0;}This means the global variable can
    be used in any location in the program and can be dangerous if not used correctly.
    One correct way it to use it in conjunction with the const keyword above, this
    means functions can only reference the value and not change it.Recap'
