  trans: "\n\n# 按值传递\n```cpp\nvoid Add(int num1 , int num2 ){\n  // 将值相加\n  int newValue\
    \ = num1 + num2 ;\n  // 打印结果\n  printf(\"The result is: %d\" , newValue);\n}\n\
    int main(){\n  // 方法调用\n  Add(10, 4);\n  return 0;\n}\n```\n输出: `> The result\
    \ is: 14`\n\n下面是另一个示例，这次使用字符串作为参数：\n```cpp\nvoid PrintStr(char word []){\n  cout\
    \ << word << endl;\n}\n```\n方法的调用形式如下：`PrintStr(\"Flying Squirrel\")`。这是一个非常有用的功能，允许我们编写通用代码，并通过传入参数来更改其函数的输出。\n\
    \n# 按引用传递\n按引用传递是通过使用指针实现的（稍后会详细解释），但指针是一个内存地址，因此进行的任何更改都会影响所传入的变量。引用参数通过 `&`\
    \ 表示，用法如下：\n```cpp\nvoid Change(int & ParaValue ){\n  ParaValue = 20;\n}\nint\
    \ main(){\n  int value = 10;\n  Change(value);\n  cout << value << endl;\n  return\
    \ 0;\n}\n```\n输出: `> 20`\n如你所见，`change` 方法更改了整数 `value` 的值，并影响了主方法中的值。\n\n# 返回值\n\
    返回允许我们从方法返回数据，这使得我们能够在函数内部进行计算并让函数自动返回结果。让我们选取之前的示例之一并进行修改，使其返回结果而不是打印结果：\n```cpp\n\
    int Add(int num1 , int num2 ){\n  // 将值相加\n  int newValue = num1 + num2 ;\n  //\
    \ return 关键字\n  return newValue;\n}\nint main(){\n  // 方法调用\n  int storeResult\
    \ = Add(10, 4);\n  return 0;\n}\n```\n发生变化的区域已经高亮显示。当需要返回一个值时，使用 `return` 关键字，在该行执行后，它会返回到调用方法的地方，因此\
    \ `return` 下的任何代码将不会执行。返回的结果将存储在 `storeResult` 中以供以后使用。返回可以是任何变量类型。我将在下面为你展示一个示例，检查数字是否为偶数（使用上面提到的取模运算符，它可以找到除法的余数）：\n\
    ```cpp\nbool EvenNumber(int value ){\n  if (value % 2 == 0) {\n    // 返回 true\n\
    \    return 1;\n  }\n  return 0;\n}\nint main(){\n  if (EvenNumber(2)) {\n   \
    \ cout << \"Even number!\" << endl;\n  }\n  if (EvenNumber(5)) {\n    cout <<\
    \ \"Odd number!\" << endl;\n  }\n  return 0;\n}\n```\n输出: `>Even number!`\n该程序使用方法\
    \ `EvenNumber()` 返回变量作为 if 语句的条件，如果为真，它将打印“Even number!”。从输出中可以看到，第一个打印了但第二个没有。\n\
    \n# 数组\n之前提到过数组，它是一种在内存中相邻存储固定数量变量的数据结构。数组会被赋予一个类型，例如 `int`。数组用于快速定义大量变量并将相关的变量放在一起。下面定义了一个数组：\n\
    \n一个静态大小，在方括号中指定大小：\n```cpp\nint lotsOfNumber[20];\n```\n或者你可以在定义时指定值，注意：不需要定义大小，因为它是根据你指定的数值确确：\n\
    ```cpp\nint lotsOfNumbers[] = {1,3,4};\n```\n\n*   数组从 0 开始，所以第一个索引的标识值为 0，第二个是\
    \ 1，依此类推。这意味着在访问值时，你需要记住它始终比它包含的数值个数少 1。\n\n你可以这样访问索引：\n```cpp\nint var = lotsOfNumbers[0];\n\
    ```\n这将获取数组的第一个索引并将其放置在 `var` 中。数组对于快速访问紧密相关的数据非常有用，你可以使用 `for` 循环遍历索引并根据需要使用它们。下文是一个示例：\n\
    ```cpp\nint lotsOfNumbers[] = { 1, 3, 4, 10};\nfor (int x = 0; x < 4; x++){\n\
    \  cout << x << endl;\n}\n```\n输出: `> 1 > 3 > 4 > 10`\n\n在 C++ 中，你无法直接获取长度，需要手动计算，这可以通过简单地使用\
    \ `sizeof()` 关键字来实现，它返回方括号内元素的大小，例如在 64 位机器上，`int` 应该用 4 个 `bytes` 表示，因此 `sizeof`\
    \ 将返回 4。数组的长度可以这样计算：\n```cpp\nint arrayLength = sizeof(lotsOfNumbers) / sizeof(lotsOfNumbers[0]);\n\
    ```\n这获取整个数组的大小，并除以第一个元素，结果就是数组包含多少个索引。\n\n## 多维数组\n你还可以在数组中定义第二个维度，甚至是第三个维度，这在处理数组时提供了更大的灵活性。例如，二维数组可以存储网格的坐标或位置。二维数组的定义如下：\n\
    ```cpp\nint arrayOfNumbers[][2] = { {1,1}, {1,1}};\n```\n你通过在方括号中放入 x 和 y 坐标的值来访问元素：\n\
    ```cpp\nint element = arrayOfNumbers[X ][Y ]\n```\n明显的区别是第二个维度需要一个值，这在创建数组时无法自动解析，并且初始化需要嵌套的大括号。下面是三维示例：\n\
    ```cpp\nint arrayOfNumbers[][][2] = {{{1,1},{1,1}},{{1,1},{1,1}}};\n```\n但在这种阶段开始失去可读性，更好的做法是将其排列如下所示：\n\
    ```cpp\nint arrayOfNumbers[][][2] ={\n  {{1,1},{1,1}},\n  {{1,1},{1,1}}\n};\n\
    ```\n\n## 在函数中传递数组\n正如我们在上面学习函数时看到的，将变量作为参数传递非常有用，传递存储在数组中的大量变量也是如此。然而，我们上面学习了如何确定数组的大小，但这对于作为参数传递的数组并不适用，因此我们必须传入一个代表数组包含元素数量的变量。有一种特殊的变量类型用于存储计数，它被称为\
    \ `size_t`，它是一个无符号整数（意味着它不会变成负数），用于存储计数值。下面是一个作为参数传递的示例：\n```cpp\nvoid Print_SingleDimenArray(size_t\
    \ length , int ageArray []){\n  // 长度用于动态确定 for 循环的长度\n  for (int i = 0; i < length\
    \ ; i++) {\n    printf(\"%d\\n\" ,ageArray [i]);\n  }\n}\nint main(){\n  // 一个年龄数组\n\
    \  int ages[] = { 32, 11, 12, 1, 8, 5, 10 };\n  // 正如之前所示确定大小\n  size_t ageLen\
    \ = sizeof (ages) / sizeof (ages[0]);\n  // 方法调用\n  Print_SingleDimenArray(ageLen,\
    \ ages);\n}\n```\n输出: `>32 > 11 > 12 > 1 > 8 > 5 > 10`\n数组已经被传递并用于打印值。数组的长度对于程序至关重要，因为它允许\
    \ for 循环适用于不同长度的数组。\n\n*   方法中对数组的任何更改都会更改调用方法中的数组变量。这就是之前提到的按引用传递，整个数组并没有复制，而是通过一些小技巧实现的按引用传递。\n\
    \n"
- fmt: "\n# User I/O\nThere are situations and programming problems that involve the\
    \ use of user interaction this is where user input and output comes in, the library\
    \ that deals with this is known as “`iostream” and is included into the project\
    \ like:\n\n```cpp\n#include <iostream>\n```\n\n## Printing/Output\nSometimes the\
    \ user needs a prompt or information needs to be displayed, this is where console\
    \ printing comes into use, the key word `cout` is used to print out data to the\
    \ screen, this is then used with the stream insertion operator that is written\
    \ as `<<` this is used to signify what is to be printed. And example is below:\n\
    \n```cpp\ncout << \"Hello!\" << endl;\n```\nThe output would just be the word\
    \ “Hello!” to the screen. The `endl` is just used to print a carriage return (`\\\
    n`). You can also create an output involving a variable or another string, multiple\
    \ stream insertion operators are used:\n\n```cpp\nint x = 10;\ncout << \"The value\
    \ is: \" << x << endl;\n```\nOutput> The value is: 10\n\n## Reading/Input\nTaking\
    \ in user input can also be useful, the operator used is known as the stream extraction\
    \ operator `>>` and is used in conjunction with `cin`, it works like so:\n\n```cpp\n\
    #include \"stdafx.h\"\n#include <iostream>\nusing namespace std;\nint main(){\n\
    \  //Reads in name\n  char name[10];\n  cin >> name;\n  //Prints name\n  cout\
    \ << name;\n}\n```\n\n## End of chapter Quiz\nThis section is designed to keep\
    \ you on your toes about the previous content, there will be 10 questions that\
    \ you can answer to test your knowledge, below in the neighbouring section will\
    \ be the answers.\n\n1. Name the data type used to hold a series of characters?\n\
    2. What is the “%” sign used for?\n3. What is this sign checking for “==””?\n\
    4. If a “&&” is between two conditional statements in a singular if, what does\
    \ it mean?\n5. What does “++” mean at the end of variable mean?\n6. What is this\
    \ operator called: “>>”?\n7. Does an array have a built in property to find its\
    \ size?\n8. What is this loop called, and what does it do?\n   ```cpp\n   for(;;){}\n\
    \   ```\n9. What two values does a Boolean variable hold?\n10. Where is the type\
    \ `void` used?\n\n### Answers\n1. String.\n2. Gets the modular of two numbers.\n\
    3. If the two values either side are equal.\n4. That the statement will only be\
    \ true if both of the conditionals are true.\n5. It will increment the value of\
    \ that variable.\n6. The stream extraction operator.\n7. No, the only way to find\
    \ it is to use the `sizeof()` operator to find the total size of the array and\
    \ each elements size, then divide both values to find the size.\n8. It is called\
    \ a naked for loop, and will just loop forever.\n9. True or False.\n10. Used when\
    \ signifying a function does not return a value.\n\n# Chapter 3: Class Structure\
    \ and OOP\nClasses are the building blocks of a program in C++, they allow easy\
    \ cookie cutter way of creating places that store and represent data. A class\
    \ in C++ has two files, the header file (`.h`) and the implementation file (`.cpp`).\n\
    \n*   Header file should just contain definitions of classes and variables.\n\
    *   The implementation file as the name suggests contains the actual functionality\
    \ of the functions and variables.\n\nA header file looks like this when empty:\n\
    ```cpp\nclass Example{\npublic :\n  Example();\n  ~Example();\n};\n```\nThere\
    \ are some key bits about this, the public section defines how the methods can\
    \ be accessed, don’t worry too much about this yet as this will be explained further\
    \ in the Encapsulation section. And the `Example()` and `~Example()` functions\
    \ are the Constructor and Destructor respectively, and the constructor runs when\
    \ the class is created, and the destructor runs when the class is destroyed, this\
    \ can either be done manually by calling the method or the compiler will do this\
    \ automatically.\n\nThe `.cpp` file then looks like this:\n```cpp\n#include \"\
    Example.h\"\nExample ::Example(){}\nExample ::~Example(){}\n```\nEach of these\
    \ are references to the `Example’s classes. You can implement functions or variables\
    \ that are not defined in the header file, however this is considered a bad practice.\n\
    \nSo for example lets used a fleshed out version of a class to show how it can\
    \ be used. An example is below:\n```cpp\nclass Shape{\npublic :\n  Shape(double\
    \ len , double wid );\n  ~Shape();\n  double getArea();\nprivate :\n  double length;\n\
    \  double width;\n  double area;\n};\n```\n```cpp\n#include \"Shape.h\"\n#include\
    \ <iostream>\nusing namespace std;\nShape ::Shape(double len , double wid ){\n\
    \  length = len ;\n  width = wid ;\n  area = length * width;\n  cout << \"Shape\
    \ made!\" << endl;\n}\nShape ::~Shape(){}\ndouble Shape ::getArea(){\n  return\
    \ area;\n}\n```\nAnd an instance of shape can be made like so:\n```cpp\nShape\
    \ s = Shape (10, 10);\n```\nNote: the header file needs including at the top:\n\
    ```cpp\n#include \"Shape.h\"\n```\nThis gives the programmer a really easy way\
    \ to create lots of containers for useful data.\n\n## Inheritance\nInheritance\
    \ is one of the most important concepts in object orientated programming, it’s\
    \ the idea of taking a class, the base class and giving other classes it’s characteristics\
    \ like functions and variables. This provides a perfect opportunity to reuse code.\n\
    \nWith our shape example above, we can now create another class called “Square”\
    \ but we inherit characteristics from the base class “Shape”. For displaying purposes\
    \ I’m going to put all code into a single `.cpp` file from now on. The Square\
    \ class is below:\n```cpp\n#include \"stdafx.h\"\n#include <iostream>\nusing namespace\
    \ std;\nclass Shape{\npublic :\n  double length;\n  double width;\n  double area;\n\
    \  Shape(double l , double w ) {\n    length = l ;\n    width = w ;\n    area\
    \ = l * w ;\n  }\n  ~Shape() {\n  }\n  double getArea() {\n    return area;\n\
    \  }\n};\nclass Square : public Shape{\npublic :\n  Square(double l , double w\
    \ ) : Shape (l , w ) {\n  }\n};\nint main(){\n  Square s = Square (10, 10);\n\
    \  cout << s.getArea() << endl;\n}\n```\nOuput> 100\n\nSquare now has everything\
    \ that Shape has defined as Public and Protected (These will be explained in the\
    \ next section) but as mentioned above it’s a great way to repeat already created.\n\
    \n### Exercise\nAdd a class called “Rectangle” and let it inherit from the shape\
    \ class. Don’t forget to include a constructor for the rectangle class.\n\n###\
    \ Solution\nSomething like this:\n```cpp\nclass Rectangle : public Shape{\npublic\
    \ :\n  Rectangle(double l , double w ) : Shape (l , w ) {\n  }\n};\n```\n\n##\
    \ Encapsulation\nEncapsulation is the idea of limiting access to sensitive variables\
    \ or methods contained within a class, there’re three different access modifiers:\n\
    \n| | Containing Class | Derived Class | Containing Assembly | Outside Assembly\
    \ |\n| :--- | :--- | :--- | :--- | :--- |\n| Public | | | | |\n| Protected | |\
    \ | | |\n| Private | | | | |\n\nAbove is a grid comparing where you can and cannot\
    \ access a variable or method marked with either modifier.\n\n*   Containing class\
    \ is the class that the object was defined.\n*   Derived class is any class that\
    \ inherits another\n*   Containing Assembly is anywhere inside the current .exe\
    \ or .dll file\n*   Outside Assembly is any other area that exists\n"
