  trans: "\n这意味着你可以控制对变量的访问。但如果一个变量被标记为私有（private），如果需要从外部访问怎么办？你使用了“get 器”（getters）和“set\
    \ 器”（setters），这些是专门设计用于检索和修改变量的方法。这是保持代码安全性的良好实践，所以让我们修改我们的形状（shape）类以使其更加安全。\n\
    \n在此之前我们可以这样做：\n```cpp\nShape s = Shape (10,10);\ns.length = -1;\n```\n\n这是不符合愿意的，因为这是无效信息，你不能拥有负长度，这就是设置器（setter）派用场的地方，该函数可以包含代码来验证（检查）尝试放入\
    \ `length` 变量的值，如下所示：\n\n```cpp\nvoid setLength(double value ){\n  if (value >\
    \ 0) {\n    length = value ;\n  }\n  else {\n    cout << \"Error: Value is negative!\"\
    \ << endl;\n  }\n}\n```\n\n此函数对值进行了必要的检查，防止无效信息进入类中的变量。以下是该类的改进版本：\n\n```cpp\n\
    class Shape{\nprivate :\n  double length;\n  double width;\n  double area;\npublic\
    \ :\n  Shape(double l , double w ) {\n    length = l ;\n    width = w ;\n    area\
    \ = l * w ;\n  }\n  ~Shape() {\n  }\n  double getArea() {\n    return area;\n\
    \  }\n  double getLength() {\n    return length;\n  }\n  double getWidth() {\n\
    \    return width;\n  }\n}\n```\n\n如你所见，所有变量都被标记为私有（Private）并添加了获取器（getters），这是类应该结构的方式。\n\
    \n## 多态 (Polymorphism)\n\n多态一词意味着有许多形式，在面向对象编程（OOP）的语境下，多态意味着一个方法可以承担许多角色。我们可以使用\
    \ `shape` 类作为示例，并重载一个确定面积的方法，如果我们想创建一个 `Triangle`（三角形）类，这是形状类但带有一个虚函数（virtual）`getArea()`：\n\
    \n```cpp\nclass Shape{\nprotected :\n  double length;\n  double width;\n  double\
    \ area;\npublic :\n  Shape(double l , double w ) {\n    length = l ;\n    width\
    \ = w ;\n  }\n  ~Shape() {\n  }\n  virtual double getArea() {\n    return length\
    \ * width;\n  }\n};\n```\n\n虚函数提供了被继承它的类重写和更改的选项，这也是可选的更改。\n\n```cpp\nclass Triangle\
    \ : public Shape{\npublic :\n  Triangle(double l , double w ) : Shape (l , w )\
    \ {\n  }\n  double getArea() override {\n    return 0.5 * (length * width);\n\
    \  }\n};\n```\n\n上面是 `Triangle` 类的实现，高亮显示的是用于更改虚函数功能的 `override` 关键字。\n\n```cpp\n\
    int main() {\n  Shape s = Shape (10, 10);\n  cout << \"The shapes area is: \"\
    \ << s.getArea() << endl;\n  Triangle t = Triangle (10, 10);\n  cout << \"The\
    \ triangles area is: \" << t.getArea() << endl;\n}\n```\n\n输出：\n> The shapes area\
    \ is: 100\n> The shapes area is: 50\n\n如从上面的示例所示，每个 `getArea()` 函数的实现方式不同并返回不同的结果。这种多态设计仍然允许在不需要重复代码的情况下创建许多新数据类型，但包含了一种自定义程度。\n\
    \n### 练习\n添加一个名为 `Circle` 的新类，它需要一个只接收高度的不同构造函数，并且 `getArea` 方法需要重载。\n\n### 答案\n\
    ```cpp\nclass Circle : public Shape{\npublic :\n  Circle(double h ) : Shape (h\
    \ , 0) {\n  }\n  double getArea() override {\n    return 3.14 * ((length / 2)\
    \ * (length / 2));\n  }\n};\n```\n\n如你所见，提供了一个只包含高度的构造函数，且 `getArea()` 返回相对不精确的圆面积。多态如果做得正确，可以提供极其整洁且易读的代码库，使方法和类在需要时调整行为。\n\
    \n## 接口 (Interfaces)\n\n接口描述了 C++ 类的能力行为，而不提交具体的实现。接口使用抽象类（abstract classes）实现，它们仅仅是类的蓝图。抽象类是通过向类中添加纯虚函数（pure\
    \ virtual functions）创建的，纯虚函数是没有体的函数，通过在函数旁边放置“=0”来指定，如下所示：\n\n```cpp\nvirtual\
    \ double getVar() = 0;\n```\n\n这意味着该函数的作用仅用于继承和适配。在继承的类中未能重写纯虚函数会导致错误，因此它被认为是设计类的严格蓝图。\n\
    \n从由于未实现纯虚函数而看到的错误：\n![](img/image1287.jpg)\n\n下面是一个涉及动物的示例：\n\n```cpp\n#include\
    \ \"stdafx.h\"\n#include <iostream>\nusing namespace std ;\nclass Animal{\npublic\
    \ :\n  // 纯虚函数\n  virtual void MakeSound() = 0;\n};\nclass Dog : public Animal{\n\
    public :\n  void MakeSound() {\n    cout << \"Bark!\" << endl;\n  }\n};\nclass\
    \ Cat : public Animal{\npublic :\n  void MakeSound() {\n    cout << \"Meow!\"\
    \ << endl;\n  }\n};\nclass Lion : public Animal{\npublic :\n  void MakeSound()\
    \ {\n    cout << \"Raw!\" << endl;\n  }\n};\nint main() {\n  Dog d;\n  d.MakeSound();\n\
    \  Cat c;\n  c.MakeSound();\n  Lion l;\n  l.MakeSound();\n}\n```\n\n输出：\n> Bark!\n\
    > Meow!\n> Raw !\n\n如你所知这是一个非常原始且无意义的示例，然而，它应该展示基类如何持有基本信息，而继承它的类应该在其基础上添加信息。在这个示例中，程序规定任何继承动物的类都必须有声音，这可以被调整以为类创建复杂的设计并轻松地填充相关的实现。\n\
    \n下面的另一个示例将使用经典的形状示例，并有一个名为“Shape”的基类，它将有一个抽象函数“getArea()”，这需要为每个形状进行实现：\n\n```cpp\n\
    #include \"stdafx.h\"\n#include <iostream>\nusing namespace std;\nclass Shape{\n\
    public :\n  // 纯虚函数\n  virtual int Area() = 0;\n  Shape(double h , double w )\
    \ {\n    heigth = h ;\n    width = w ;\n  }\nprotected :\n  double heigth;\n \
    \ double width;\n};\nclass Circle : public Shape{\npublic :\n  Circle(double h\
    \ , double w ) : Shape (h , w ) {}\n  int Area() {\n    return 3.14 * ((heigth\
    \ / 2) * (heigth / 2));\n  }\n};\nclass Rectangle : public Shape{\npublic :\n\
    \  Rectangle(double h , double w ) : Shape (h , w ) {}\n  int Area() {\n    return\
    \ heigth * width;\n  }\n} ;\nint main() {\n  Rectangle r = Rectangle (10, 20);\n\
    \  cout << r.Area() << endl;\n  Circle c = Circle (5, 5);\n  cout << c.Area()\
    \ << endl;\n}\n```\n\n另一个简单的示例，但请花点时间习惯它，抽象类架构允许由于蓝图式的设计，即使设计已经完成，也可以轻松添加新的函数和类。\n\
    \n## 章末测试\n\n1. 用于创建类的是哪两个文件？\n2. 析构函数定义之前的符号是什么？\n3. 头文件应该承担什么角色？\n4. 对于被继承的变量，`protected`\
    \ 意味着什么？\n5. 多态的作用是什么？\n6. 使用什么关键字来更改虚方法？\n7. 如何表示纯虚函数？\n8. 标记为私有（private）的函数或变量可以在哪里访问？\n\
    9. 构造函数的作用是什么？\n10. .cpp 文件应该包含什么？\n\n### 答案\n\n1. 头文件 (.h) 和 C++ 文件 (.cpp)。\n\
    2. 我使用符号 `~` 来表示析构函数。\n3. 仅包含函数和变量的定义。\n4. 它只能由继承它的类在定义类之外访问。\n5. 为了拥有一个基类定义但许多不同的实现。\n\
    6. 使用 `Override` 来更改虚方法。\n7. 使用一个等于零的普通函数定义。\n8. 仅在定义它的类中。\n9. 是一个没有返回类型的特殊函数，在创建类实例时被调用。\n\
    10. 头文件中定义的函数和变量的影响。\n\n## 第四章：改进技巧\n\n### 结构体 (Structures)\n\n结构体源于 C，来自类编程之前的世界。然而，它们仍然很有用，并且可以使用在认为类大过其实（overkill）的地方。使用结构体的一个很好的例子可以是用于记录，例如如果你需要跟踪球队中的足球运动员，你将需要：\n\
    \n*   姓名\n*   球衣号码\n*   工资\n*   擅长的脚\n*   等等\n\n"
- fmt: "\nIf there is no need to add functionality onto this information a structure\
    \ is perfect for this situation. A structure storing this information is defined\
    \ like this:\n\n```cpp\nstruct FootballPlayer{\n  string Name;\n  int KitNumber;\n\
    \  double Wage;\n  string StrongestFoot;\n};\n```\n\nThis structure contains all\
    \ the values that are relevant, this will provide a relevant container for similar\
    \ information. A new instance of the structure is defined like so:\n\n```cpp\n\
    FootballPlayer player1;\nplayer1.Name = \"Messi\" ;\nplayer1.KitNumber = 10;\n\
    player1.Wage = 1000000;\nplayer1.StrongestFoot = \"Both\" ;\n```\n\nThis code\
    \ will create a `FootballPlayer` and assign values to all its member variables.\
    \ \n\nReal world usage of structures tend to be “simple” usage where they need\
    \ to just store trivial data like the example above, when there needs to be functionality\
    \ and encapsulation use a `class`. This is known a `POD` (Plain Old Data) encapsulation\
    \ .Note: The default access for structure variables is public while `classes`\
    \ default to private.\n\n## Enums\n\n`Enums` is short for `Enumerated Type` as\
    \ has the role of a boolean but with unlimited user defined types, this can be\
    \ used a flags for a situation like “HOME_SCREEN” or “SETTING_SCREEN”. An enum\
    \ is defined like so:\n\n```cpp\nenum CurrentScreen{\n  HOME ,\n  SETTINGS ,\n\
    \  CONTACTS ,\n  CALCULATOR\n};\n```\n\nWith each word in the brackets being a\
    \ state the enum can be set as. A enum instance is created like so:\n\n```cpp\n\
    int main(){\n  CurrentScreen phone1;\n  phone1 = HOME ;\n}\n```\n\nThis code above\
    \ makes a new enum and assigns it as “HOME”. You can now use the enum to check\
    \ what states it is, the example below will use a switch-case:\n\n```cpp\n#include\
    \ \"stdafx.h\"\n#include <iostream>\nusing namespace std;\nenum CurrentScreen{\n\
    \  HOME ,\n  SETTINGS ,\n  CONTACTS ,\n  CALCULATOR\n};\nint main(){\n  CurrentScreen\
    \ phone1;\n  //Change me\n  phone1 = HOME ;\n  switch (phone1)\n  {\n    case\
    \ HOME :\n      cout << \"You're on the home page\" << endl;\n      break ;\n\
    \    case SETTINGS :\n      cout << \"You're on the settings page\" << endl;\n\
    \      break ;\n    case CONTACTS :\n      cout << \"You're on the contacts page\"\
    \ << endl;\n      break ;\n    case CALCULATOR :\n      cout << \"You're on the\
    \ calculator page\" << endl;\n      break ;\n    default :\n      break ;\n  }\n\
    }\n```\n\n**Output**\nYou’re on the home page\n\nThis code shows you can use conditional\
    \ structures along with an enum to easily create a nice branched structure. Mess\
    \ around with the commented “Change me” enum definition and see how the output\
    \ changes.\n\n## Unions\n\n`Unions` are a data structures designed to provide\
    \ efficient memory usages, they can contain as many member variables as it needs\
    \ however it can only store data for a single variable at a time. So the entire\
    \ structure only takes up memory for the biggest member variable.\n\nThese have\
    \ to be used with caution because setting value of another member variable will\
    \ remove data stored in another, so it is incredibly easy to lose important data.\
    \ A union is defined like so:\n\n```cpp\nunion Example{\n  int i;\n  int x;\n\
    \  int y;\n};\n```\n\nAnd an instance and value is created like so:\n\n```cpp\n\
    Example e;\ne.i = 4;\n```\n\nTo show how the size of the union works the program\
    \ below works it through:\n\n```cpp\n#include \"stdafx.h\"\n#include <iostream>\n\
    using namespace std;\nunion Example{\n  int i;\n  int x;\n  int y;\n} ;\nint main(){\n\
    \  Example e;\n  e.i = 4;\n  cout << \"Your int size is: \" << sizeof (int ) <<\
    \ \" bytes\" << endl;\n  cout << \"The union has 3 variables that should be a\
    \ total of:   << sizeof (int ) * 3 << \" bytes\" << endl;\n  cout << \"However,\
    \ the union is \" << sizeof (e) << \" bytes\" << endl;\n}\n```\n\n**Output**\n\
    Your int size is: 4 bytes\nThe union has 3 variables that should be a total of:\
    \  12 bytes\nHowever, the union is 4 bytes\n\nAs you can tell the union is only\
    \ the size of a single integer, these structures can be used to efficiently use\
    \ memory is there’re situations where variables are idle and only one is needed\
    \ . Below is code that shows what happens to all the values when one is changed:\n\
    \n```cpp\n#include \"stdafx.h\"\n#include <iostream>\nunion Example{\n  int i;\n\
    \  int x;\n  int y;\n};\nvoid Print_Union(Example e ){\n  cout << \"i: \" << e\
    \ .i << endl;\n  cout << \"x: \" << e .x << endl;\n  cout << \"y: \" << e .y <<\
    \ endl;\n}\nint main(){\n  Example e;\n  cout << \"1\" << endl;\n  e.i = 4;\n\
    \  Print_Union(e);\n  cout << \"2\" << endl;\n  e.y = 3;\n  Print_Union(e);\n\
    \  cout << \"3\" << endl;\n  e.x = 1;\n  Print_Union(e);\n}\n```\n\n**Output**\n\
    1\n> i: 4\n> x: 4\n> y: 4\n2\n> i: 3\n> x: 3\n> y: 3\n3\n> i: 1\n> x: 1\n> y:\
    \ 1\n\nAs you can tell when you change one value, they all equal the same value,\
    \ this is because all values share the same memory location and therefore when\
    \ one changes they all change .\n\n## Variable argument lists\n\nVariable argument\
    \ lists allow for the possibly of endless parameters. Before we have come across\
    \ functions with a static set amount of parameters (variables you can pass into\
    \ a method) like:\n\n```cpp\nint Add(int i, int y){}\n```\n\nHas two parameters\
    \ integer `i` and integer `y`.\n\nThis is known as a `Variadic Function` or a\
    \ function with unlimited arity (parameter number, so `Add` above has an arity\
    \ of 2)\n\nThe variables are stored in a variable known as the `va_list` (corrected\
    \ from `va_list`) this works as any other variable but it just holds the list\
    \ of variables passed. A variadic function is defined like so:\n\n```cpp\nvoid\
    \ Add(int numberOfVariables , ...){}\n```\n\nWhere `numberOfVariables` is the\
    \ number of extra parameters passed, note this does not include this variable.\
    \ This is required because the `va_list` does not know the total number of variables\
    \ and does not keep track of where it is in the list. Using the `va_list` requires\
    \ the use of a few functions:\n\n*   `va_start (va_list, numberOfVariables)`\n\
    \    *   Grabs the variables passed in and assigns the number specified by the\
    \ second parameter to the first parameter\n*   `va_arg (va_list, type)`\n    *\
    \   Grabs the next variable from the specified list in the first parameter and\
    \ creates a variable specified by `type`\n*   `va_end (va_list)`\n    *   Tidies\
    \ up the list specified\n"
