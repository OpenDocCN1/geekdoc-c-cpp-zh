  md: '# Assembly Language Programming


    By convention, data storage is arranged according to the little endian standard,
    where the least significant byte of a word or half-word is stored at the lowest
    address, and we return to the higher addresses by taking the reverse of component
    bytes making the numbers stored in memory. Figure 1.4 shows how, in the little
    endian standard, memory placement of words and half-words is managed.


    The architecture is of the Harvard-type, which results in a division separating
    code from access data. Figure 1.5 shows how this division is planned out. The
    other zones (Peripheral, External, etc.) impose the placement on the addressing
    space of different units, as presented in Figure 1.3.


    One feature that should be noted concerns memory access – bit banding. This technique
    is found in the Static Random-Access Memory (SRAM) zone (between addresses 0x20000000
    and 0x2000FFFF for the bit-band region and addresses 0x22000000 and 0x23FFFFFF
    for the alias) and the peripheral zone (between addresses 0x40000000 and 0x4000FFFF
    for the bit-band region and addresses 0x42000000 and 0x43FFFFFF for the alias).
    These four zones are schematized by the hatching in the memory-mapping in Figure
    1.5. This technique allows the programmer to directly modify (set or reset) bits
    situated at the addresses within the bit-banding.


    ![](img/281fc2009e6fb2fd9bfe8708a4c24432_21_0.png)


    Figure 1.4. Little-endian convention'
