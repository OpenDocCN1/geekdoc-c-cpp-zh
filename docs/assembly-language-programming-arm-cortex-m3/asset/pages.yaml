    Some comments about this listing:


    +   - The register addresses as well as the values of the two frequencies (that
    of the

    clock and which we want) are "hard" coded, i.e. coded by constants, and

    sequently correspond to immediate addressing.

    - The launch number (Time_Val) is contained in a half-word. In the example, the

    initial value given to the variable is used directly. This is also the case for
    the

    Sys_Tick function.

    - The start function, in addition to calculating the reload function, sets bits
    at 1

    that make it possible to choose the internal clock in order to validate interrupts
    and

    to start the timer itself. These three settings to 1 are done separately by three
    logical

    ORs. A single "OR" is sufficient to do this in a single operation.

    - The registers used by the procedures are not saved, unlike in the other

    examples given in this book. This operation is not necessary in the case of the

    processing SysTick_Handler. Indeed, the two registers used (R0 and R1) are

    p of the content save list during switching exception processing. There will

    never be any side effects linked to the launch of the SysTick_Handler in this
    case.


