  md: '# Chapter 7


    # Internal Modularity


    The concept of a procedure, a sequence of instructions able to be called as a
    subroutine, has been presented in section 3.3.5. In this chapter, we will look
    at how to use this elementary syntactic construction to write correct and easy
    to use subroutines, by applying the principles of modular programming. We will
    see how to implement the passing of arguments to a subroutine and how to create
    local variables.


    # 7.1. Detailing the concept of procedure


    # 7.1.1. Simple call


    A procedure is a set of instructions designed to provide a particular service,
    usually ending with the instruction BY LR. The procedure, which may be called
    by a BL (Branch and Link) instruction, is placed in the calling procedure. This
    instruction saves the return address (which we will denote @ret from now on) by
    using the link, register (LR) to store the instruction pointer (also called the
    Program Counter, PC) which contains the address of the instruction following the
    branch, then jumps to the first instruction of the procedure being called. At
    the end of the procedure''s execution, the BY LR restores the original PC value
    by loading the contents of the LR and execution resumes at the address following
    the BL. Example 7.1 illustrates this principle of a simple call to a procedure.


    # 7.1.2. Nested calls


    During a call, the return address is stored in a register. If the called procedure
    itself makes a call to a procedure, the call mechanism will automatically erase
    the'
  merge: -1
  pgno: 130
- img_proc: true
  md: '# 120 Assembly Language Programming


    current contents of the LR in order to be able to store the return address. If
    nothing else is done, the return address of the first call level will be definitively
    lost and the procedure no longer has any way of returning to where it came from.


    This problem is quite typical in ARM assembly language. Indeed, the vast majority
    of designers have directly ignored this possibility of nested calls into their
    choice of architecture. Thus the return address, rather than being stored in a
    register, is placed on the system stack in accordance with its last, first out
    (LIFO) revolution. During execution, if the stack has been correctly managed during
    the procedure, the programmer will be able to recover the return address that
    is pointed at by the stack pointer (SP). Successive nesting of calls to procedures
    consequently leads to successive stacking on the system stack.


    This being understood, it is sufficient to do the same thing in our procedures.
    Indeed, as in Example 6.13, by stacking (PUSH) the LR from the entry into the
    procedure, the programmer causes the value of LR to be saved. At the moment of
    return, we recover this by reading the stack (POP) and then carry out the return
    of the procedure by using the LR instruction.


    With this hardware architecture option, ARM provides the possibility of calling
    a procedure without using a read/write cycle on the system stack. This presupposes
    the absence of nested calls but allows time-saving in the case of a simple call.


    # EXAMPLE 7.1.- Simple call to a procedure


    | Princi | PROC | |

    |---|---||

    | | ... BL Appeal; LR <- @wret | |

    | | then PC <- Appeal (jump) | |

    | Back_There | ... Next Instruction | |

    | | ... @wret = Back_There | |

    | Princi | ENDP | |

    | | - - - - - - | |

    | Appeal PROC | |

    | | ... BX LR : PC <- LR | |

    | Appeal | ENDP |


