- img_proc: true
  md: 'ARM is designed to match the address of a word (in the alias zone) with a bit
    (in the bit-banding zone). So when the programmer writes a value in the alias
    zone, it amounts to modifying the bit-banding bit corresponding to the zero-weight
    bit that they just wrote. Conversely, reading the least significant bit of a word
    in the alias zone lets the programmer know the logic state of the corresponding
    bit in the bit-banding zone (see Figure 1.6). It should be noted that this technique
    does not use RAM memory insofar as alias zones are imaginary: they do not physically
    correspond to memory locations – they only use memory addresses, but with 4 GB
    of possible addresses this loss is of little consequence.'
