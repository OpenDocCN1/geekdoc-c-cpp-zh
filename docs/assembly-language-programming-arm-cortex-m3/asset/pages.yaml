    Figure B.1. Principle of SysTick Timer functioning


    # B.2. SysTick


    The SysTick timer is a 24-bit decrementation timer. Unlike the complex timer units
    that we can find in a controller, it has no functioning modes other than a 24-bit
    decrementation. Its overall operation is summarized in Figure B.1.


    The SysTick unit is made up of four registers, which will be described in a manner.
    Three of these registers are classic: one to manage the state and configuration,
    one to set the current countdown value, and one for the reloading value. The fourth
    is more particular and the reason for having it is that it is a master of register
    containing the value-standard giving a reloading value in order to provide a 10-millisecond
    interrupt period.


    One subtlety is in how to avoid mistakes in the programming of this timer. The
    interrupt request takes place when the current value switches from 1 to 0, but
    reloading only takes place at the next rising edge of the clock. This obviously
    means that in case of periodic functioning (which is a priori the classic functioning)
    the interrupt has a periodicity of N+1 cycles, with N being the value stored in
    the reload register. In the example presented (Example B.1), this reload value
    is first calculated as the ratio (integer division) between the frequency of the
    internal clock (Freq_Quartz) and the request frequency (Freq_Request). This ratio
    is then'
  merge: -1
  pgno: 221
- img_proc: true
  md: 'decremented by one to take into account the interval between interrupt and
    reload. Finally


    # B.3. The SysTick registers


    # B.3.1. The Current value register


    When SysTick is active, the value of this register decreases with each rising
    front of the clock. As this timer is coded in 24 bits, the most significant bits
    in this switched are always at 0. It is possible to get read access to find out
    the current value. However write access, if permitted, is limited: whatever value
    you want to write, access would result in deletion of the contents. It is therefore
    not possible to write a value to this register - you can only erase one.


    # B.3.2. The Control and Status register


    This register (see Figure B.2) has only four significant bits:


    +   - COUNTFLAG: switches to 1 if the counter register (Current Value) has switched
    to 0. It is reset when the processor reads the register containing this bit (Control
    and Status), or when the processor writes a value in the Current Value register.
    This bit allows the use of the timer without interrupts, simply by scanning the
    state of this bit. Obviously this is not as effective as the interrupt because
    the scan uses CPU time detection is not concurrent with the event, so the precision
    of time measurement is not assured.


    +   - CLSOURCE: there are two clocks that supply the timer. The first, which is
    standard and corresponds to the bit set to 1, consists of using the internal clock
    of Cortex-M3. It is however, possible (with the bit set to 0) to specify an external
    clock. This clock is only external to Cortex-M3 and not the microcontroller integrates
    it and must be a fraction (at least 2.5 times smaller) of the internal'
  merge: -1
  pgno: 222
- img_proc: true
  md: 'frequency, simply because a higher frequency would be incompatible with the
    update of register values. It is necessary to consult the documentation of the
    circuit used to find the frequency of these two clocks.


    ![](img/281fc2009e6fb2fd9bfe8708a4c24432_223_0.png)


    **Figure B.2.** Systick control and status register


    - TICKINT: when this is set to 1, it enables the launch of the SYSTICK exception
    (fifteenth in the table of interrupt vectors) when the decrementation of the timer
    gives 0.


    - ENABLE: this is the bit that starts (at 1)/stops (bit at 0) the timer. As soon
    as this is activated, causing rising front of the chosen clock causes the decrementation
    of the *Current Value* register. At the moment when it is switched to 1, the *Current
    Value* register is loaded with the value contained in the *Reload register.


    # B.3.3. The Reload register


    This register, insofar it serves as a reset value for the *Current Value* register,
    can only receive a value between 1 and 0x00FFFF. It is possible to give it a value
    of 0, which would inhibit the functioning of *SysTick*. After a *Reset*, the value
    of this register is unpredictable.


    # B.3.4. The Calibration Value register


    A sampling of 10 milliseconds seems to be a reference value, according to ARM,
    for calibrating the rate of a real-time kernel. This *Calibration Value* register
    (see Figure B.3) with read-only allows us to find out the reload value in order
    to get this sampling value without having to dissect the *microcontroller*'
