    # 4.2.1.2. Other registers


    In most registers R13 and R14 act as operands, like the other general registers.
    These two are different, they correspond directly to the stack pointer (SP) and
    the link register (LR). We should handle them with caution.


    As for the R13 register (the instruction pointer), most instructions refuse to
    work with it (as it is too dangerous) and the assembler will throw up an error
    when it comes across a use. In case, the only reasonable use of this register
    is to as across to execute subroutines. For this, the instruction set has all
    the jump options (B, BL, BX...) to cover our needs, so there is no need to play
    with fire.


    As for the xPSR register, we have already seen in Example 2.3 that two specific
    instructions MRS (Move from Special to Register) and LSR (Move to Special Register)
    allow us to access the xPSR. Again, there is no reason to do anything else.


    That leaves all the registers that we may encounter in a counter (everything but
    the processor core), and there are plenty! In Cortex-M3 they belong to the outside
    world; all of this memory space is only accessible by load/store instructions.
    We will see in a few sections on how to access it. Such registers will never be
    operands for common instructions.'
