    \ size? In terms of code size, no. In terms of processing time, saving of the\
    \ registers depends on the number of registers into the list (approximately two\
    \ clock cycles per register for each PUSH and each POP). A gain in time can then\
    \ be expected if we minimize the registers used (and the number of registers to\
