    This appendix contains the code and some explanation of the STM32F10x.s used in
    the generic project presented earlier (see Chapter 9). This file is a bootstrap
    file, meaning that it allows us to carry out a minimal initialization of the µcontroller
    (here a STMicroelectronics STM32F103RB). This file was made and provided by Keil
    with its µVision development suite. Its inclusion (or that of a different or modified
    version) in a project is necessary to allow the development of a complete project.
    This file defines the specific interrupt vectors of the µcontroller for which
