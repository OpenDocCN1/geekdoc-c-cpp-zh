    # ### 6.5.3. Registration


    We use the term registration or record (structure in C and record in Ada) for
    a set of consecutive data fields under a common symbolic name and arranged starting
    from a certain address. In general, these are of different types, as opposed to
    tables, which are exclusively composed of the same type. The programmer places
    various fields in memory positions. The first byte of the first word of fields
    is easily reached using indirect addressing with offset $[Rn+#imm]$, where the
    $Rn$ register points to the start of the registration, i.e. it contains the lowest
    address, and where $imm$ is positive, calculated in bytes. If we consider a registration
    with a variant part (typically a set of characters), we must reserve the memory
    space for the largest variant. It is therefore interesting that the variant field
    is the last in the registration.


    # ### 6.5.4. Non-dimensional table, character string


    The size of a table cannot be known during the writing of a program or during
    execution. It is therefore more convenient to be able to create a dynamic memory
    allocation: the table is created during execution and the place that it occupies
    memory is reserved (allocated) at that moment. This technique is directly possible
    if we use an operating system capable of allocating a given amount of memory.


    In a more restricted software environment, the programmer is the only master on
    board and must manage everything him- herself, this becomes more difficult but
    not impossible. A common technique for doing this consists of'
