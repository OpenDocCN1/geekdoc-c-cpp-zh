- img_proc: true
  md: '# 8.2.1.4. Usage fault


    This last fault, of which a report on what triggers it is the subject of the 16-bit
    UFSR, is a fault that, as opposed to a bus fault, is more concerned with software
    than hardware problems. It can therefore occur in the deployment phase (not only
    in the development phase) so it is important to provide treatment for it and to
    see how it can be caused:


    +   - division by zero: in the case of floating point numbers, it is possible
    to de-normalize the value corresponding to infinity. In integer arithmetic, an
    operation passes an unsolvable problem. So, the processor indicates this fault
    and switches the 9 bit (DIVZERO) of UFSR to 1;


    +   - misalignment: as we have seen, it is possible to access unaligned data.
    This option comes with limitations, however, and when we violate these the trap
    is triggered and bit 8 (UNALIGNED) is activated. It is also activated if unaligned
    access is prohibited and such access is attempted;


    +   - access to a coprocessor: The Cortex-M3 has several instructions for a potential
    coprocessor. If no such unit is, the response is a usage fault and bit 3 (NOC)
    switches to 1. By finding this, the treatment routine can be written to offer
    an emulation of this coprocessor (which allows us to maintain the portability
    of the code to different types of processors);


    +   - impossible return: here means an attempt to load the program counter (PC)
    pointer with an illegal value during the return from an exception. The details
    of possible values are given in section 8.4. Bit 2 (INVPC) switches to 1;


    +   - invalid state: The T bit of the EPSR (Execution Program Status Register)
    allows us to distinguish, in the general ARM architectures, the switch from ARM
    to Thumb mode. As Cortex-M3 only supports Thumb mode, any attempt to switch to
    ARM mode is sanctioned by this fault, with bit 1 (INVEST) being activated. This
    problem can happen accidentally by forcing the value of PC with an even value
    (so the least significant bit (LSB) is at 0), during a jump or procedure return
    (BX LR) as well. Indeed, in coding instructions (see section 5.6) when the LSB
    is at 0, the processor as well branch switch to ARM mode, which is impossible
    for Cortex-M3;


    +   - undefined instruction: the last case that provokes this fault is when bit
    0 (UNDEFINSTR) is set to 1. In this case, the PC points to an instruction that
    is not decodable by the core. The most common case is a jump to an address that
    is valid, but does not contain the correct code (a Literal Pool, for example).


    A usage fault can be deactivated. To do this, we set the bit 18 of the SHCSR to
    0. Bits 12 and 3 of this register also allow knowledge of the activity state (active
    or pending).'
  merge: -1
