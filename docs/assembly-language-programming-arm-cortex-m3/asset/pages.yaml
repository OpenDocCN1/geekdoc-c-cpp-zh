    # 6.5.6. Stack


    A stack is a LIFO (Last In, First Out) structure. The data are arranged consecutively
    in the memory during stacking. They are unstacked in the inverse order to their
    order of stacking: the last placed will be the first removed. A single Rp pointer
    is sufficient for managing a stack. We distinguish between two stack management
    modes:'
  merge: -1
  pgno: 126
- img_proc: true
  md: 'the direction of stack increase:


    +   - ascending: successive writing is done to increasing addresses,

    - descending: successive writing is done to decreasing addresses,

    - management of stack pointer evolution:


    +   - before writing and after reading: the stack pointer points to the last element

    - before writing and after reading: the stack pointer points to the next free
    element.


    ![](img/281fc2009e6fb2fd9bfe8708a4c24432_127_0.png)'
