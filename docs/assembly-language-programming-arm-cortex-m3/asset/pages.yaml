  md: '# Assembly Language Programming


    running of a code sequence, the PC pointer will automatically increment itself
    (usually two-by-two) in order to point and recover the rest of the code. The terminal
    order counter could imply that its functioning is processed simultaneously, at
    a different level. This is not so, and things quickly become complicated, particularly
    when there is a break in the sequence (the instance of Example 2.2, where the
    call to a subroutine causes a discontinuity in the rest of the stored code addresses).
    In this case, PC would take a value that was not a simple increment of its initial
    value.


    The management of this processor is intrinsically linked to the pipeline structure
    of this Reduced Instruction Set Computer (RISC) architecture. This technique allows
    the introduction of parallelism in the work of the processor. At each moment,
    several instructions are processed simultaneously, each at a different level.
    Three successive steps are necessary for an instruction to be completely carried
    out:


    +   - Fetch phase: recovery of the instruction from memory. This is the step where
    PC plays its part.

    - Decode phase: the instruction is a value encoded in memory (its opcode), which
    requires decoding to prepare it for execution (data recovery, for example).

    - Execute phase: execution of the decoded instruction and writing back of the
    results if necessary.


    In these three stages (which are classic in a pipeline structure) first upstream
    unit must be added: the PreFetch unit. This unit (which is part of ARM’s expertise)
    essentially exists to predict what will happen during sequence breaks and prepare
    to recover the next instruction by “buffering” about six instructions in advance.
    This practice optimizes processor speed.


    This simplified view of pipeline stages deliberately masks its complexity. Again,
    in line with the objectives of this book, the view of understanding is sufficient
    to write programs in assembly language. Interested readers can search the ARM
    documentation to find all of the explanations necessary to go further.


    # 2.2.5. The xPSR register


