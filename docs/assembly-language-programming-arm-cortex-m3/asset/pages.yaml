    EXAMPLE 6.6.—Switch case structure treated as a chain of If...Then structures


    | Entry_Point | ... |

    |---|---|

    | Lab_Switch | MOV R4,ref_variable |

    | CMP R4, #value_0 |

    | BNE, See_One ; cond = EQ, so non(cond) = NE |

    | BL treatment_0 |

    | See_One | B Exit_Point ; End of Treatment => exit ! |

    | CMP R4, #value_1 |

    | BNE, See_Two |

    | BL treatment_1 |

    | B Exit_Point ; End of Treatment => exit ! |

    | See_Two | CMP R4, #value_2 |

    | BNE, See_Default |

    | BL treatment_2 |

    | B Exit_Point ; End of Treatment => exit ! |

    | See_Default | BL default_treatment |

    | Exit_Point | ... |


    The unconditional jump B Point_Exit that ends each Then clause allows us to get
    out of the Switch case structure: the equivalent instruction in C is break.


    Such a sequence of identical structures is long and tedious to write if more than
    a few values have been included in the Switch case structure. It is also inconvenient
    to modify any case to be added. What, the selection time for execution depends
    on the position of the value in the list.


    A second method, which is more appropriate for assembly language, consists of
    using jump tables. A first version of this type of structure corresponds to the
    use of the TBB (Table Branch Byte) or TBH (Table Branch Halfword). An example
    of this type of use was given during the explanation of these instructions (see
    section 5.6). The use of TBB or TBH implies that the jump table is a relative
    jump table with regards to a reference address, and so can quickly become very
    limiting.'
