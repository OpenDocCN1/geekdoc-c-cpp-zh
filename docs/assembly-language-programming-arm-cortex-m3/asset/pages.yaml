  md: "# D.2. Bootstrap program\n\nThe use of GNU GCC renders the use of MicroLib\
    \ void. Compared to other projects developed in assembly language, the main function\
    \ of this library that we must consider is the routine that allows us, following\
    \ a Reset for example, to reinitialize the variables (mainly in the RW or .data\
    \ zones) as well as resetting the other zones to the (ZI or .bss zones).\n\nThe\
    \ listing Example D.1– is an example of a routine that carries out these initializations.\
    \ The principle is quite simple, since it consists of making transfers from memory\
    \ to memory (initialized variables) or resetting other zones. What can be more\
    \ obscure is the way in which it is possible to recover the addresses and sizes\
    \ of different zones. In our case, incidentally is quite standard the table that\
    \ contains this information is made up from generic names created in the memory\
    \ description files used by the linker. The names of these addresses are sufficiently\
    \ significant to pass comment. The prefix cs means CodeSourcecery.\n\nExample\
    \ D.1– Variable initialization module (GNU environment)\n\n```\n/*- \nName : Startup.asm\n\
    Purpose : System stack initialization and initialized variables\nVersion : VI.1\n\
    Author : SDM (INSA de Toulouse)\n/*- \n\n.text\n.align 2\n.global Startup\n.type\
    \ Startup, %function\n\nStartup : :Stack initialization\n\tLDR R0, Startup_constants+12\n\
    \tMOV SP, R0\n/*- \nnInitialization of initialized variables\nR0 : @Destination,\
    \ R1 : @Source, R2 : size, R3 : counter, R4 : time\n/*- \n\nstart_init_ram:\n\t\
    LDR R0, Startup_constants+16\n```"
