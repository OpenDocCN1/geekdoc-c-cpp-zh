  md: '# Chapter 3


    # The Proper Use of Assembly Directives


    As for any language, the syntactic aspect of a listing is of crucial importance
    so that the compiler (in the case of higher level language structures) or the
    assembler (for listings written in assembly language) understands the rest of
    the characters that it will read and that make up the program. If we consider
    the previous examples, an assembler would have trouble generating the corresponding
    executable code: it lacks a lot of information. Only a few instructions, without
    any context, were transcribed in the examples that have previously been presented.
    Where is the code entry point, where is the program end, where is the code located
    in memory, what are the constants or variables?


    This chapter aims to define this context through the description of assembly directives.


    # 3.1. The concept of the directive


    An assembly directive is a piece of information that appears word-for-word in
    the listing which is supplied by the assembler to guide the construction rules
    of the executable. These lines in the source file, though integral part of the
    listing and necessary for its coherence, do not correspond directly to any line
    of code. These pieces of information will not appear during the disassembly of
    the code and will be missing if a hacker reverse engineer it. Disassembly is a
    process that consists of converting the code (that is, the collection of words
    read in memory) into the corresponding symbols and, if necessary, the operands
    (numeric or register). The coding of an instruction is biunivocal, there is no
    particular problem in re-transcribing a code extracted from memory into primitive
    assembly'
