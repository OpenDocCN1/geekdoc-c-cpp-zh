- img_proc: true
  md: '230 Assembly Language Programming


    +   - .space size {fill} reserves size bytes filled with fill (less than 255).
    The absence of fill leads to initialization at 0;


    +   - .word exp1{...} is equivalent to .byte for 32-bit reservations.


    # D.1.4 Conditional assembly


    The following directives allow us to carry out conditional assembly (see section
    3.5.2):


    +   - .if expression marks the lines that follow will be included in the section
    if expression is not false;


    +   - .endif marks the end of the conditional part;


    +   - else allows us to include an alternative composed with .if.


    # D.1.5. Miscellaneous


    There are other directives that can be necessary or useful:


    +   - A module ends with .end. The assembler ignores the lines that follow this
    directive.


    +   - The directive .type allows us to give additional information on a symbol.
    This information can be particularly useful with the use of a symbolic debugger.
    The most common use is .type symbol, /function to indicate that the label symbol
    corresponds to a procedure entry.


    +   - There are no specific directives indicating the insertion of a symbol (see
    section 9.1.5). It is enough, in the module where the insertion of the directive
    .global is declared, that symbol is shared with other symbols of the same name
    during linking. This directive carries the exportation of a symbol.


    +   - .word name marks the symbol name as weak in the symbol table. This means
    that another definition of the symbol will have a higher priority than this typed
    declaration.


    +   - .size name, expression associates a size (expression) with a symbol (name).
    The dimension can be the result of a calculation, as the difference between two
    symbols. This directive is typically used to calculate, for example, how much
    space a function takes up. For example, .size Dim , Deb func will assign the dimension
    corresponding to the difference between the current address (.) and the address
    of the symbol Deb func to the symbol Dim.'
