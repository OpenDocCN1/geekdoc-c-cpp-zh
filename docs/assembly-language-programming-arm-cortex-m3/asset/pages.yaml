    In this example, we assume that R6 contains the (integer) selection value between
    0 and 6, resulting from a previous test. The table is filled with elements that
    are the addresses of procedures (in each case, this is actually the address of
    the procedure''s first instruction). The jump is effected by the BLX (Branch with
    Link and Exchange) instruction, which contains the address of the procedure to
    be reached. All that remains to understand is how address, and thus the allocation
    statement R2 : LDR R2,R8,LSL #2], is calculated. This involves reading by indexing:
    R2 ← Jump_Table[R6 #4].


    The Jump_Table base address is stored before indirection in R9; this is indirect
    (of brackets). The index is stored in R6, but as indirection works directly on
    the memory addresses and each procedure occupies 32 bits of memory the elements
    of each table occupy four bytes. The index is multiplied by four to take into
    account. This multiplication by a 2-bit shift left, corresponds to use of LSL#2
    as a supplementary operator applied to R6.


    The adopted mechanism therefore uses double indirection: R9 points to an element,
    which itself points to a procedure! The advantages of this solution are the simplicity
    of its structure and a constant selection time. It does, however, have two disadvantages:
    it is first necessary to obtain a selection value in the form of a natural integer;
    second, it is then necessary to ensure that the selection value belongs to the
    interval of the predicted values. This requires the inclusion of the Switch Case
    in a complete alternative.'
