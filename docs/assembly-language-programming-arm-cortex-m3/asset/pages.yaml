  md: '# Appendix D


    # The GNU Assembler


    The set of examples presented in this work are written for the ARM-MDK (Microcontroller
    Development Kit). Another compiler/assembler/link editor trio, however, is currently
    used to construct such projects. This is the compilation chain GNU-GCC (GNU Compiler
    Connection), which as its name suggests comes from the world of free and cooperative
    software. This appendix is based specifically on the Sourcecery G++ Late tools
    for ARM-Embedded Application Binary Interface. This precision is important insofar
    as, although the tools are designed to be generic, they still have specifics and
    peculiarities that make them somewhat difficult to understand and use. As an example
    to illustrate this, take the official documentation for the Sourcecery G++ assembler.
    328 pages long, and 202 pages (Chapter 9) are dedicated to the characteristics
    unique to each processor. Despite the peculiarities, it is interesting to draw
    on the common points between the different GNU-assembler/link editors in order
    to develop programs with different tools and processors.


    The ARM-MDK and GNU-GCC projects are not cross-compatible, which might seem surprising
    since processor and thus the instruction set are very similar. The two major differences
    are found in the syntax used for the directives (for the assembler) and in the
    way of describing the memory (for the link editor). We should note that the use
    of the GCC tool is still possible in the Keil $\mu$Vision environment, which is
    interesting as this environment is completely functional in its free trial version
    and so it is possible to use the $\mu$controller emulator that it offers.


    +   1 GNU is a Unix-like computer operating system and corresponds to the recursive
    acronym "GNU is Not Unix"'
