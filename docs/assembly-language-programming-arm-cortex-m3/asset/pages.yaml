  md: '# 8.2.1. Traps


    Entries three to 15 of the IVT make up the set of software traps. The first for
    correspond to faults. These are serious events for which the processor cannot
    correctly finish an instruction. On the occasion that these faults arise, ARM
    has provided the means by which to trace the origin of these faults through a
    “triple” register:


    +   - MMFSR (Memory Fault Status Register);

    - BFSR (Bus Fault Status Register);

    - UFSR (Usage Fault Status Register).


    This is a triple register in the sense that these three names correspond to 2
    bytes and half-word of a NVIC at 0xE000ED28 (see Figure 8.4). Reading the MMFSR
    word will therefore give all three registers, but reading 1 byte at this address
    only gives the contents of the first byte. The MMFS is A user encountering a “fault”
    problem could, by reading the contents of these registers, track the cause of
    these faults. Only the contents of UFSR will be explained (see section 8.2.1.4)
    as they correspond globally to issues that cover software rather than hardware,
    and to which a developer could respond.


    # 8.2.1.1. Hard fault: a serious hardware fault


    A hard fault trap could also be called a double fault. This trap is triggered
    if a usage fault, bus fault or memory management faults arise but its processing
    does not work (the TVI is badly initialized, for example). It can also correspond
    to a bus fault during the reading of the TVI. This trap is very serious because
    it corresponds to the processor being incapable of responding to a problem requiring
    a specific treatment. As we will see later, it is placed just after Reset and
    the NMI in the order of priority, like the previous exceptions, its priority level
    cannot be modified.


    # 8.2.1.2. Memory management fault


    As this trap, as name indicates, corresponds to a memory management problem and
    can only arise with the (optional) existence of the memory protection unit. As
    this unit is not covered in this book, the associated trap will not be developed
    any further This fault, like the next two, can be inhibited through the System
    Handler Control and State Register (SHCSR) of the NVIC, see Figure 8.3. This is
    the case elsewhere after a Reset, since the different enable bits are all set
    to 0. Indeed, the 16-bit weight of this register allows us to authorize (or block)
    the transmission of this fault to Cortex-M3 and therefore to authorize (or prevent)
    its specific treatment.'
  merge: -1
