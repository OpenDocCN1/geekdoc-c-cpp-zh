  md: '# 7.2. Procedure arguments


    # 7.2.1. Usefulness of argument


    From the point of view of the calling program, the MaxVer procedure changes the
    value of the result at the Maxi address by using the values recorded in ValOne
    and ValTwo. Written like this, such a procedure is hardly satisfying because it
    is necessary to give it with specific names, which makes it impossible to reuse
    the procedure in another program, unless we always use the same names for the
    data.


    Also, in modular programming, it is recommended that we avoid directly using global
    variables. This is made possible by the use of explicit call arguments. The subroutine
    then becomes easily reusable if it follows the conventional rules for passing
    arguments.


    # 7.2.2. Arguments by value and reference


    Each argument can be passed by value or reference. If it is passed by value, a
    copy of the data is provided to the calling procedure, so that its potential modification
    by the latter does not affect the original: the modification remains local to
    the subroutine. When an argument is passed by reference, we provide the address
    to the subroutine that, by direction, could possibly change the value of the data
    at that address.


    No assembly language has instructions to call a subroutine incorporating the concept
    of argument, and the BL instruction for Cortex-M3 is no exception; it therefore
    raises the question of which mechanisms it is possible to provide a procedure
    with the values or the relative addresses of the arguments. Essentially, there
    are two techniques, but both can be reduced to the same basic idea: arguments
    are positioned according to an agreed order in a predetermined region of the memory.


    # 7.2.3. Passing arguments by general registers


    General registers provide an initial easy, quick and effective method of passing
    arguments. The values of arguments or their addresses (references) are placed
    in the agreed registers and the procedure can be used immediately.


    # 7.2.3.1. Passing arguments by value


