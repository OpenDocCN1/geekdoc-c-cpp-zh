    +   - Flashpoint and Breakpoint (FPB): The FPB is the most basic function for
    this process. It is linked to the concept of a stopping point (breakpoint), which
    imposes a stop on a line of code (that to say, in the case of assembly language)
    located beforehand. This unit is used to mark instructions so that they come into
    effect, the processor puts itself into a particular mode of operation: *debug*
    mode. Development software (and other pieces of software that use it) can then
    therefore observe the state of the processor and the running of the program

    - Data Watchpoint and Trace (DWT): the concept of a “point of observation” is
    the counterpart to the concept of a stopping point for data. The DWT stops the
    program running when it works on marked data rather than a marked instruction.
    This action can be in reading, writing, passing on values, etc. The unit can also
    send requests to the TIM and FIFO

    - Embedded Trace Macrocell (ETM): the concept of trace the capacity for the hardware
    to record a sequence of events during program execution. The recovery of these
    recordings allows the programmer to analyze the running of the program, whether
    good or bad. In the case of ETM, only information on instructions is stored in
    a first in, first out (FIFO)-type structure. With the MPU unit, this unit is optional

    - Instrumentation Macrocell (ITM): this unit also allows the collection of trace
    information on operations (software, hardware or time). The information is more
    limited than the ETM unit but is nevertheless very useful in a vicious bug. This
    is especially true if the optional ETM is not present

    - Advanced High-performance Bus Access Port (AHB-AP): this is an (Input/Output)
    port within Cortex-M3 that is designed to debug. It allows access to all records
    and all addressable memory space. It has priority in the arbitration of the bus
    matrix. This unit is connected by the Serial JTAG (Joint Test Access Group)SW/SWTAG),
    which is the interface (with its physical layers) that connects to the outside
    world, equipped with the JTAG probe: The JTAG protocol is a standardized protocol
    used by almost all semiconductor manufacturers.


