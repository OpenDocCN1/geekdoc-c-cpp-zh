    # 4.3.2. Indirect addressing with displacement


    In this addressing mode, we add an additional displacement (offset) to the address
    contained in the base register. The syntax is:


    ```

    LDR R1, [Rn, #offset]

    ```


    The principle of this transfer is shown in Figure 4.6a. We should note that the
    value of the offset is in most cases limited to 4,096, but for some special forms
    (LDRHT, for example) the maximum value can be lower. This quantity, like any immediate
    value in an instruction, can also influence the size of the coding (16 or 32 bits).


    One of the uses of this addressing mode is to access data structures. Only the
    address of the structure is known. This can be deposited in the base register.
    To then access other constituent fields of the structure, we must use the offset
    to specify the relative displacement to be imposed in order to reach this field
