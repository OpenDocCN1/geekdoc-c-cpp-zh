  md: '# 3.2.1. The AREA sections


    A program in assembly language must have at least two parts, which we will refer
    to as sections, that must be defined in the listing by the AREA directive:


    +   - one section of code containing the list of instructions;

    - one section of data where we find the description of the data (name, size, initial
    value).


    > REMARK 3.2.- Unlike in higher level languages where the declaration of variables
    can be more or less mixed with instructions, assembly language requires a clear
    separation.


    From the point of view of the assembler, a section is a contiguous zone of memory
    in which all the elements are of the same logical nature (instructions, data,
    and system stack).


    The programmer uses the AREA directive to communicate with the assembler in order
    to show the beginning of a section. The section naturally terminates at the beginning
    of another section, there is no specific marker for the end of a section.


    The body of a section is made up of instructions for the CODE part or of various
    place reservations (whether initialized of not) for the DATA section.


    The general definition syntax of a section, as it must be constructed in a source
    file, is:


    | AREA Section_Name | {type} {attr} ... |

    |---|---|

    | | Body of the section: |

    | | definitions of data |

    | | instructions, according to the case |


    So let us explain the four fields:


    +   - AREA: the directive itself;

    - Section_Name: the name that you have given to the section in keeping with the
    rules set out earlier;

    - type: code or data: indicates the type of section being opened;

    - a suite of non-compulsory options. The principal options are:'
  merge: -1
