  md: '# C.2. Important points


    This listing requires some explanation, even if its blind use causes no major
    problems:


    +   - In this version, the system stack (Stack_Mem) is 512 bytes in dimension.
    The top of the stack is marked with __initial_stack, which is the first address
    following the reserved zone as the stack is pre-decrementation.


    +   - A heap (Heap_Mem) is reserved in the same way as the reservation for the
    system stack. This reservation is for the use of the C compiler (standard library).
    It is interesting to note, however, in this case the reservation is completely
    fictitious it is only there to avoiding resolution errors during link editing.


    +   - The interrupt vector table corresponds to a set of words initialized with
    the addresses of exception routines that exist lower in the module. It starts
    by storing the highest address of the previously declared stack. The STM32 used
    in this project is built around it interrupt vectors.


    +   - The interrupt handler is limited to a single B_, or infinite loop. This
    module is therefore only a skeleton for the development of more adapted routines.
    These routines are reality well; if an exception is lasting and nothing but the
    skeleton has developed, it is possible to escape other by Reset.


    +   - The external exceptions (which correspond to interrupts) are all grouped
    in the same routine. This routine has 43 different names. All of these are WEAK
    (another statement will be given priority over them) and exported to be visible
    from other modules.


    +   - The Reset handler is the only one that contains a little code. It simply
    calls the main_routine, which is the entry point to the MicroLib library. This
    same routine will end by a jump to the level main, which is the entry point of
    the project. The MicroLib source is not directly accessible; but by opening a
    disassembly in debug mode, it is possible to view its content.


    +   - At the end of the listing that allow the export of the addresses of the
    stack and heap, particular for the MicroLib library if it is included in the project.
    Otherwise (ELSE alternative), it is assumed that the standard library is used,
    in which case the __user_initial_stackheap procedure is necessary for its correct
    running and where it exports to. This procedure fills the R0 to R3 registers with
    the addresses of reservation delimitations from the stack and the heap.'
