  md: '# Managing Exceptions


    Two other groups of registers, with the same characteristics as ISERs and ICERs,
    allow us to change the pended status of an interrupt. This involves the 8 NVIC_ISER[x]
    (Interrupt Set-Pending Registers) switching to pended mode (thereby forcing one
    of these bits at 1 to trigger through the handler of the corresponding interrupt)
    and the NVIC_ICPER[x] (Interrupt Clear-Pending Registers) to cancel the pended
    (and cancel an interrupt request). These two groups of registers occupy addresses
    0xE0000E200 to 0xE0000E21c (for ISPER) and 0xE0000E280 to 0xE0000E230 (for ICER).


    Finally, with the same principle of bit distribution, we can use the NVIC_IASR[x]
    (Interrupt Active Status Registers), which have read only access to know whether
    the corresponding exception is active (bit at 1) or not (bit at 0). These registers
    occupy the addresses 0xE0000E300 to 0xE0000E31C.


    # 8.3. Priority management


    Events that are susceptible to producing an exception may usually occur in an
    asynchronous, and therefore unpredictable, manner. It is always possible to trigger
    these exceptions by executing code; this is naturally the case for SVC: It is
    also the case for all interrupts, through the ISPERs, but this possibility remains
    rather atypical. Either, in exactly the same clock cycle or some clock cycles
    after, but enough that the processing of the first exception is not completed
    before the next begins.


    ARM has taken this multiple management into account and it is the responsibility
    of the NVIC to receive and organize the different requests into a hierarchy. For
    this purpose, each exception has a priority level. This level is a value for which
    the associated priority will be higher when the value is lower. Reset and Hard
    have priorities fixed at -3, -2 and -1 respectively. All exceptions have priority
    levels that can be configured with a positive number on 8 bits. The NVIC_SHPR[x]
    (System Handler Priority Registers, see Figure 8.7) contain the configurable levels
    for traps and the NVIC_IPR[x] (Interrupt Priority Levels, see Figure 8.8) contain
    the programmable levels for interrupts. Thus configured, it appears that Reset
    always has priority over NMI, which itself has priority over hard fault, and that
    is unchanging.


    On the other hand, it is the responsibility of the developer to define the order
    of all remaining exceptions, all of these levels initially equal to 0 after a
    Reset.'
