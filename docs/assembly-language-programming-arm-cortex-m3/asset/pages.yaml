    # 7.2.4. Passing arguments by a stack


    The number of registers being limited, new arguments erasing previous ones as
    for nested. When we return to the calling procedure, there is the risk that this
    procedure will no longer hold all or part of its call arguments. It is therefore
    necessary to use the system stack to make the necessary saves. Starting from this
    statement, it becomes natural to directly use a LIFO (system stack or heap) structure
    to store the different component arguments of the procedure to be executed.'
