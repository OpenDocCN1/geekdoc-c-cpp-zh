    located, important for development system that must indicate the line where an
    error is located or for development when the listing is in parallel with disassembled
    code. Each code section – whether it is code or data – the assembler uses a placement
    counter (the second column of the *ist*) whose initial value is 0000000. The departure
    address of each section is therefore provisionally set at 0. In the case of a
    code section, insofar as it carries out its translation, the assembler increments
    the value of the placement counter by 2 or 4, depending on the size of the instruction.
    The placement counter indicates the relative position of each instruction. It
    works in the same way for each data section, the incrementation of its internal
    counter depending on the size of the variable.


    For each new section, the placement counter restarts at 000000. If a section is
    closed a second time in the same source file, the placement counter is not reset
    to 0 but continues from the last previous value, which *de facto* means the concatenation
    of two halves sections.


