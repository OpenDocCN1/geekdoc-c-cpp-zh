    this internal memory does not make up a set of registers. An exact definition
    would be to think of a register as a memory location that does not take part in
    memory mapping. In effect, all peripherals of the controller can be programmed
    by means of the values that are given by the registers; they have no address that
    the processor can access any other memory space. The extensive use of the "register"
    in computer architecture means that this often compensates, in a rather vague
    manner, memory spaces whose content directly affects the functioning of the processor.
    In this section, we will only consider the registers of the Cortex-M3. Their main
    feature is that they are accessible by the instruction set without submitting
    a request to the data. The opcode (the coding of the instruction to be executed)
    of an instruction manipulating the contents of a register must therefore contain
    the information of the register to be contacted. The execution of an instruction
    can cause the modification of one or more of these registers without the need
    to activate the M3 bus.


