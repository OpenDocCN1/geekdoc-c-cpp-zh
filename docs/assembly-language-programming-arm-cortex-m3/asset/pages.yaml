    alignment and to have the directives that produces.


    # 3.5.2. Project management directives


    The ROUT directive allows the management and limitation of the visibility of local
    labels. This is useful for avoiding interference between similar labels. A label
    is a label with the form *n{name}, where *n* is a number (between 1 and 99) that
    is normally forbidden because theoretically a label must start with a letter.
    Consequently, we reference the label as %n{name}. As the name is optional, the
    label may be a number. The ROUT directive, then, is used to position the visibility
    border of local labels.'
