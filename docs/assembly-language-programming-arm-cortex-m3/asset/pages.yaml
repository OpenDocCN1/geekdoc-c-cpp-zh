  md: 'In the Cortex-M3 architecture, a LIFO stack mechanism exists in the hardware.
    It is managed by the stack pointer (SP, see section 2.2.2). This stack, called
    the system stack, is by default descending and with pre-decrementation in writing
    (also known as a Full-Descending Stack), see Figure 6.2.


    Be careful not to unalign a stack intended to receive words (or half-words, respectively).
    The address contained in the register must be doubly (respectively singly) even,
    i.e. ending with two (respectively, one) zero! This is the reason that it is not
    recommended that you construct a mixed stack where you stack bytes, half-words
    and words indiscriminately.


    Queues and stacks of which the elements are not bytes nor half-words nor words
    are the most delicate to manage. It is necessary to calculate analog shifts similar
    to those we have seen for tables. An often more advantageous technique consists
    of adding a level of indirection by establishing stacks or queues consisting of
    the addresses (references) of elements. The position and size of the elements
    are then of no real importance.'
