  md: '# Overview of Cortex-M3 Architecture


    Looking at the outline of the STM32F103RB processor, we can see that it has ARM
    design elements in its processor core, namely:


    +   - a power stage and sleep clock circuits. This makes it possible to put the
    processor into "sleep" mode and allow access to different frequencies (which is
    interesting for timer management in particular)

    - addition of Flash and RAM. The amount of memory space in the case is one of
    the variables, which fluctuates the most, depending on which controller is chosen.
    The STM32F103RB version has 12 KB of Flash memory, to put it in perspective, can
    represent up to 65,000 lines of code written in assembly language (assuming that
    an instruction is coded on 16 bits);

    - managers developed in system time, including the Systick 24-bit timer and automatic
    wake-up system when the processor has gone into "sleep" mode. These units have
    undeniable usefulness during the use of the real-time kernel.


    +   STMicroelectronics added the following functions:

    - time and/or counting management peripherals;

    - analog signal peripherals. These are analogical/numerical converters for acquiring
    analog quantities, and represent the PWM (Pulse Width Modulation) for sending
    assimilable [assum] signals to the analog quantities;

    - digital input/output peripherals. These 51 General Purpose Input Output (GPIO)
    peripherals are the TTL (Transistor-Transistor Logic) input/output ports and the
    other 16 signals involving digital input and transmit an interrupt request;

    - communication peripherals. Different protocols are present in this chip for
    communications via a serial link (Universal Synchronous Asynchronous Receiver
    Transmitter (USART), Universal Serial Bus (USB) or an industrial bus (I²C, Controller-area
    space, Serial Peripheral Interface (SPI)).


    # 1.2.2. Memory space


    Memory space management is the most complicated aspect to be managed when developing
    a program in assembly language. Fortunately, a number of assembly directives associated
    with a power linker makes this management relatively simple. However, it is helpful
    to have a clear idea of the memory map in order to work with full knowledge of
    the facts while developing (and debugging) the program. In fact, processor registers
    generally contain quantities that correspond to addresses. When the program does
    not behave as desired (a nasty bug, clearly!), it is helpful to know whether the
    quantities produced are ones that could be expected. Cortex-M3 has a 4 GB consecutive
    memory space (32-bit bus). A memory address corresponds to one byte. It follows
    that a half-word occupies two addresses and a word (32-bit) occupies four memory
    addresses.'
