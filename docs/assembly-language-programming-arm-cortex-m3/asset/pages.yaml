    # 6.2. Alternative structures


    # 6.2.1. Simple (or shortened) alternative


    The simple alternative decides whether or not to carry out the treatment, so it
    is not accompanied by an else clause:


    | If | Then Treatment |

    |---|---|

    | End If |


    The block of instructions translating this algorithmic structure uses one of the
    four test instructions (section 5.5) of which the only goal is to position the
    flags. The conditioned jumps that follow one of these tests use to set the state
    of the flags to carry out the jumps (if appropriate). As it is most directly understandable
    in this context, the applied examples presented later will be based on the use
    of the CMP (Comare) instruction, immediately followed by a conditional jump.


    To start with, let us use a generic version of the simple alternative (see Example
    6.1).


    +   Reading this reduced listing leads to the formulation of several comments:

    - we use not(cond) rather than cond; this method is common to all assembly languages.
    The instruction only takes place if the complement of cond is true. Thus instruction
    provides the possibility of preventing the treatment being carried out -

    - the label Entry_Point and If mark the same instruction, CMP;

    - the label Exit_Point marks the first instruction of the next block.


    In this example, the labels If and Lab Then have an informative and didactic function
    only. This is a roundabout way to comment on your code. Only the label Exit_Point
    is essential, because it is referenced by a jump.'
