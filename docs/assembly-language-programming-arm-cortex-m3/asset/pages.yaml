  md: '# Chapter 9


    # From Listing to Executable:

    External Modularity


    In the context of native development, the computer system on which an applied
    project is developed is exactly the same as the one that will execute the project.
    When we write a program for a microcontroller, this is never the case: indeed,
    there is no program under Cortex-M3 that allows us to develop another executive
    for Cortex-M3. The programmer is in a cross-development situation where the writing
    and generation of an executable is done on a host computer system and the execution
    is transported to the given target hardware. There may be a subtlety in this basic
    schema, however, which is the use of emulator that allows us to develop a project
    without a real target. This emulator is a program that works on the host system
    and simulates the functionality controller cycle-by-cycle, instruction by instruction.
    Although there are excellent emulators that are able to accurately replicate the
    internal functioning of a processor, it is not unusual to find differences when
    executing on a real processor and the final validation phase cannot be carried
    out without testing on a real target.


    In the course of the cross-development phase, between writing the code in one
    (or several) "listing" file(s) and the execution of this code on a given processor,
    there are different stages (and therefore different tools), each of which is necessary
    for the proper realization of the whole. These are:


    +   - the assembler, which interprets a source listing to create an object file;


    +   - the linker, which puts together the different objects of the project and
    parts of the library to make the executable file;'
