    # B.4. Example of SysTick programming


    In this example, three generic procedures have been written. The first two (Start_SysTick
    and Stop_SysTick) allow us to start/stop the timer. The third (SysTickPeriod)
    is called by Start_SysTick to calculate the reload needed to operate the SysTick
    periodicity at a chosen value (Freq_Request). We assume that the SysTick has a
    frequency of 8 MHz.


    While configuring SysTick, the interrupt validation is set at 1. (This assuming
    that the priority levels are coherent and the interrupt vector table is correctly
    initialized) implies that the corresponding interrupt handler (SysTick_Handler)
    of this exception would be automatically called. During this processing, a global'
