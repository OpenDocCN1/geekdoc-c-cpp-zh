  md: 'documentation. The main datum, TENMS (10 milliseconds) (the 24 least significant
    bits) is therefore a value set by the circuit designer. If we later want another
    sampling period, proportional to 10 ms, we just need to read this register, add
    1 to get the number of cycles corresponding to these 10 ms, apply the necessary
    proportionality ratio (multiplication or division), subtract 1 and modify the
    reload value with this value.


    Two bits complete this information:


    +   - the 31-weight bit indicates that there is no external clock signal;

    - the 30-weight bit indicates that the 10ms value is not exact because of the
    clock frequency value. The precision of a sampling based on TENMS is therefore
    not guaranteed.


