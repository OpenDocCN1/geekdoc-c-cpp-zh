  md: '# 8.2.1.8. The internal SysTick timer


    It is the responsibility of the microcontroller designer to supply peripherals,
    and in particular those necessary for the measurement and management of time.
    ARM has chosen to equip Cortex-M3 with a timer called SysTick. This choice allows
    us to augment the portability of the code between different microcontrollers,
    especially at the level of a real-time kernel. Indeed, a high-level layer cannot
    get without a scheduler, which itself relies on a timer regulating its task dispatching
    policy. The programming of this timer is the subject of Appendix B.


    When the timer overflows, 15 – if it has been validated – is triggered, and bit
    11 of the SHCSR register is switched to 1 when the exception becomes active. As
    was mentioned in the previous section, it is possible to cause this trap to be
    set though the PENDISTSET bit of the ICSR of the NVIC. Conversely, it is possible
    to end the pending mode of this exception via the PENDSTCLR bit of the same register.


