  md: '# 9.1.5. IMPORT AND EXPORT directives


    Seen from the outside world, each module by default behaves like a black box,
    with its own resources and symbols. A priori its symbols are not accessible by
    other modules. This prevents any outside world interference inside the module.
    However, we must consider the case of a module containing certain symbols to be
    used by one or more modules. These symbols, called exportables, must be explicitly
    marked as such; by default, symbols defined in a module are private, meaning that
    they are only visible in that module. The scope of exportables (equivalent to
    visibility in assembly language) is global, unlike private symbols whose scope
    is only local. Thus, any symbol can be private or exportable (global).


    There are two dual directives for setting this visibility properties. The position
    of these directives in the module is free, but the convention is to place them
    at the head because they symbolize interface with the outside world.


    The first, EXPORT, allows us to inform the assembler and the linker that the symbol
    defined could be merged with a identical symbol used in another module. The existence
    of this directive shows that the visibility of a given symbol is limited by default
    to the module itself. In other words, naming a new symbol it not necessary to
    worry about its possible existence in another module. The syntax is as follows:


    ```

    EXPORT symbol [WEAK,type]

    ```


    The option WEAK specifies whether the symbol is defined elsewhere (in the current
    module or in any other module); this definition will be prioritized for exportation.
    This option is used for the declaration of symbols associated with exception vectors
