    # 4.4.4. Other registers for the NVIC


    As we have seen in course of this chapter, the NVIC is the true conductor for
    the organization of an exception handler into a hierarchy. To complete our account
    of its potential, there are some registers left to explain:


    *BasePri*, *PriMask* and *FaultMask* are three core registers; therefore they
    do not occupy a memory address. They are not part of the NVIC, but their role
    is nevertheless directly linked to exception management. They are described as
    special in the documentation because they are not directly accessible. In order
    to access them, the code must use special instructions *MRS* (Move from Register
    to Special) for reading and *MSR* (Move to Special Register) for writing, see
    Chapter 5. These two instructions require privileges in order to be executed.


    *PriMask* and *FaultMask* have only one significant bit at 0. Thus reading, the
    1 MSB is always at 0, and symmetrically, writing to these bits will have no effect.
    These registers, as their name suggests, allow us to mask exceptions. Each, except
    part the *NMI* exception, will switch to active state, and if a request intervenes,
    will will stay in pended state. As soon as the bit is reset, pended priority will
    switch back to an active state following the order of their respective priority.
    *PriMask* is identical to *FaultMask*, with the difference that in addition to
    *NMI* it also allows the launching of the third exception with a non-configurable
    priority level, namely a hard fault.'
