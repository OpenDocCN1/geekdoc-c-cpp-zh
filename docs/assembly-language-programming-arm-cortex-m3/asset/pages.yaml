  md: '148 Assembly Language Programming


    Interrupts, traps, Reset and NMI come under the generic term exceptions. The technique
    used to respond to these different cases of "exception" is similar and is the
    topic of this chapter. The Nested Vectored Interrupt Controller (NVIC) receives
    orders and manages all exceptions, in this chapter, we will detail many of this
    unit''s registers.


    # 8.1. What happens during Reset?


    Before describing these mechanisms and what consequences they imply at a programming
    level in greater detail, let us look at the case of Reset. This is the most serious
    and inescapable event (or exception, to be more precise) that can happen to any
    processor. A system Reset can have different origins. In the case of Cortex-M,
    these can be:


    +   - exterior, meaning that a circuit particular pin that, by default, be at
    a high logic level has passed to a low level;


    +   - launched by software setting the SYSRESETREQ bit of the Application Interrupt
    and Reset Control Register (AIRCR) in the NVIC to 1.


    Reset also corresponds to a "cold start", or power-up of the circuit. If it corresponds
    to setting the Reset pin of the circuit to a lower level (known as a soft reset,
    in practice to the user pressing a button wired to this pin), it generally does
    not bode well for the progress of the application running on the processor.


    During a Reset phase, the processor starts reinitializing all registers. In the
    documentation, we find the value taken by each register following a Reset. This
    initialization puts the processor in privileged Thread mode. This Cortex-M3 has
    the contents of address 0x00000000 (the lowest memory mapping address) to assign
    to R13. Once this is done, it initializes the stack pointer. This first assignment
    is imperative because an exception can occur at any time and the treatment of
    this exception, as we will see later, requires access to the system stack. The
    processor must therefore be in a position to process an exception and must have
    a valid stack pointer. The memory address referenced in these 4 bytes corresponds
    to the top of a memory zone with read/write access. In a third stage, Cortex-M3
    reads the contents of the next word, namely the contents of addresses 0x00000004
    to 0x00000007. This word will be used in the initialization of


    1 The Watchdogs are bits that (when these units are engaged) be periodically set
    to 1. This mechanism allows the microcontroller to ensure that the running program
