    # 5.7.2. Multiple transfers


    With a single instruction, it is possible to order the simultaneous loading (or
    unloading, respectively) of several registers from (or, respectively,) to a base
    address. For this one must specify a list of registers in a brace, the address
    of the base stored in a register (indirect access).


    REMARK 5.2.- Braces in this syntax, unlike the rest of the instructions, do not
    indicate an optional characteristic. It is required the syntax for the register
    list. Another one, unstoppable, trap is in the LDM, LDMDB and STDMB instructions,
    where the register behaves like a pointer but it is not necessary to put it in
    square brackets ([]). With respect to this instruction it is not illegal (it is
    not possible to fill a register with the content[sic] of several registers), but
    for the programmer this requires plenty of flexibility of mental-flexibility.


    The register containing the base address cannot be part of the list of registers.
    It can, however, the SP. This is quite useful when performing a context/restore
    while handling an interrupt, for example. The PC (R15) register can be included
    in the list, which is not without consequence of loading as this is equivalent
    to carrying out a jump. It is therefore to use with great caution.


