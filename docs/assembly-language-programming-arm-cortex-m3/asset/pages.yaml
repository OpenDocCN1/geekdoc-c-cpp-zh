    # 5.6. Branch instructions


    Branch instructions, along test instructions, allow us to realize the different
    algorithmic structures of a program. This is also the way to call procedures.


    All instructions are coded in 16 or 32 bits. To respect the principle of alignment,
    the address of an instruction must at least be even. However, consider Example
    5.1.


    # EXAMPLE 5.1. – LSB of the address of a jump


    ```

    LDR R0,Label ; Loading an address...

    BX R0             ...and jump to the address contained in R0

    ...

    Label            ;Rendez-vous point

    ```


    Observation of the contents of R0 will show that the LSB is 1, leading us to believe
    that the rendezvous point is an odd address. More surprising, if we use a debugger
    to force the LSB to be 0, it will launch a Memory Management Fault exception (see
    8.2.1).


    This curiosity comes from the successive developments of the ARM architectures,
    and particularly from the introduction of the Thumb set. It is in fact possible
    to make some ARM processors work with the complete 32-bit ARM set or with the
    reduced Thumb set. This technique is named interworking in the ARM documentation.
    The bit[0], then, is useful in managing these switches. In the'
