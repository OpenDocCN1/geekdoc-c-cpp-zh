    # 6.5.5. Queue


    A queue is a FIFO (First In, First Out) data structure. The elements in the queue,
    which are generally all of the same type, are placed in contiguous positions in
    the memory. To manage the queue, we use two registers, Rt and Rq, where Rt points
    to the head – the first element in the queue – Rq to the free position that follows
    the last element of the queue. Removals are made at the head of the queue and
    additions at the end. For 8, 16 or 32 bits, we use the post-displaced addressing
    mode to add (Rq,+imm) and remove (Rt,+imm)


    The disadvantage of such a queue is that it grows towards the increasing addresses
    as it is used. This means that we frequently produce a circular queue by limiting
    the maximum address that can be reached. Trying to go beyond this involves the
    return of the current address to the lowest expected value. The position of the
    queue then fluctuates between these two extreme addresses during execution.'
