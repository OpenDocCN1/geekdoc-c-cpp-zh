    # 9.1.2. Assembly by pieces


    Our example is made up of three “source” files, which we also call modules. This
    could be confusing, but the use of this term predates modular programming, and
    has not completely fallen into disuse. In the following, when we say module file
    (external module) and not procedure, we define modularity as discussed in Chapter
    8. The declarations and instructions of a program can therefore be split into
    several files, so long as the syntax is respected. In particular, any section
    of code or data will be enclosed with the end of the module or by the opening
    of a new module. Similarly, any open procedure will be closed (ENDP directive)
    in a module. The assembler is capable of individually translating each module
    into machine language, which we call assembly by pieces. The linker will later
    group the resulting objects into a coherent whole in the form of a single file
    called an executable (or more precisely loadable for execution).


    # 9.1.3. Advantages of assembly by pieces


    Separate assembly presents some interesting advantages:


    +   - Individual trial: each module that a trial module can be tested individually.
    If each module tried separately works, we can hope that the final version runs
    all of the modules will also work. Conversely, if a module does not work the project
    as a whole cannot respond to all specifications.

    - localization of the consequences of a modification: the modification of a module
    only affects the re-assembly of this module followed by the call to the linker;

    - recovery of a module: we can reuse a module in another program;'
