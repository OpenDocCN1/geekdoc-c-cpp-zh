    # 3.4.3. Data initialization: the devil is in the details


    What happens in the life of an initialized variable? In a normal development cycle,
    we can imagine that this variable is born in the loading of the program to memory.
    The loader (program in change of the transfer from the toolchain to the target
    containing Cortex-M3) will write the initial value to the memory address corresponding
    to this variable. Then, if the variable is "variable", it will change and longer
    to its initial value. Let us now suppose that the user restarts (RESET). The program
    restarts without going through the loader step. What guarantees that the initial
    value will be re-transcribed?

    A priori in assembly language, nothing; however, it turns out that in the memory
    of cases (because it is often paired with a C compiler the assembler has anticipated
    this. The mechanism is placed on a duplicating of initialization zones: a first
    random access memory (RAM) copy space for the variables themselves and a duplicate
    in read-only memory (ROM-type) (usually just after the code) containing the initial
    values. It is enough to have a routine at its disposal that recovers the tables
    of different addresses and then re-operates a copy of one over the other. A slight
    adaptation of this method also allows us to reinitialize the variables at zero.
    These measures although very useful, may not appear very clearly. So in the case
    of the ARM Development Kit, this is done through the use of a dynamic library
    in the code, which is accomplished by adding a nice but obscure IMPORT|Request$$armlib|
    to the main file header. This initialization mechanism is revisited in Chapter
    9.


    # 3.5. Is it necessary?


    Obviously not. There are also directives for the assembler that are not completely
    explained in this chapter. Some of them (EQU, RN and LTORG) are discussed in the
    next chapter as they deal mainly with data manipulation (and thus operand management).
    Others concern the sharing (IMPORT, EX) of variables or procedures, which is the
    subject of Chapter 9. Yet others will not be mentioned here because interest in
    their use is somewhat limited (INFO, TTL, etc.).'
