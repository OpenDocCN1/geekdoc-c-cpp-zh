  md: 'We will illustrate the use of a user stack, upon which both the procedure arguments
    and local variables will be arranged. We assume that the user stack is created
    and initialized, with R11 as the SP register.


    # 7.3.1. Simple reservation of local data


    Let us look at a first method where the local variables are simply reserved in
    the user stack by calling the procedure. The procedure considered in Example 7.9
    and Figure 7.6 shows by resetting the local variables, the body of procedure having
    not been developed. We assume that the procedure receives 32-bit arguments, denoted
    Arg1 and Arg2, which are stored on the same user stack during the call.


    > REMARK 7.7.- It is not necessary to consider that the local variables are initialized
    at zero. In fact, they occupy a memory space that can be used many times, and
    the freeing of memory is only done by offsetting pointers at the memory zones
    concerned. The values are neither erased nor saved.


    The different steps in the management of the user stack for the management of
    local variables:


    +   - Creation: let us take the four local variables: one of 32 bits, one of 16
    bits, and two of 8 bits. On the top of them, we reserve a place (4+2+1 bits) by
    creating a hole in the stack, thanks to this instruction placed at the start of
    the procedure: `SUB R11,#8`


    +   - Use: we distribute these 8 bytes at between the various local variables.
    In Example 7.9, the datum Local32 (32 bits) is reached by [R11,#4], the datum
    Local16 (16 bits) by [R11,#2], Byte1 (8 bits) by [R11,#1] and Byte2 (8 bits) by
    [R11]. Note that these elements are defined a priori.


    +   - Removal: this is carried out by an offset towards the top of the stack that
    to fill the hole. We can use this passing, as in this example, to also remove
    the two arguments passed at the call, which in our case corresponds to the instruction
    ADD R11,#16.


    # EXAMPLE 7.- Erasing of local variables


    | Erase_Local | PROC |

    | PUSH R2,R10 | Save modified registers |

    | MOV R10,R11 | Assignment of annex pointer |

    | SUB R11,#8 | "Hole" for the 4 local variables |

    | MOV R2,#0 | for erasing |

    | STR R2,[R11,#4] | Erase Local32 |'
