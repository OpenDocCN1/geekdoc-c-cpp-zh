  md: '# Assembly Language Programming


    In the first part of this appendix, we will list the main directives necessary
    to develop a project, for instance that which was presented in Chapter 3. In section
    D.2 we will give an example of a program written with these syntax rules that
    aims to make up for the absence of the MicroLib library. We will not develop the
    aspects tied to the linker, and especially the memory description file, here due
    to the complexity of their construction. The Sourcery G++ suite for ARM EABI is
    supplied with the typical files (generic.ld for example) from which it is possible
    to start.


    # D.1. GNU directive


    In the GNU world, the set of instructions that we want to give to the compiler
    or assembly (directives) will be introduced by a keyword prefixed by a \ (dot).
    The vast majority of directives we have explored (see Chapter 3) have their direct
    equivalents in this version of the assembler, but there are a certain number of
    additions, differences and subtleties that we must carefully understand when we
    switch from the ARM universe to the GNU universe.


    # D.1.1. Generalities


    These are not strictly the directives mentioned but the following syntactic rules
    must be respected in order to produce code that is acceptable to the assembler:


    +   - the comments are, as is usual in C, the set of characters between the delimiters
    /* and */. The user has a second chance to insert a comment by inserting an @.
    The rest of the line (until carriage return) will then be ignored. This second
    syntax is inevitably not very readable;


    +   - symbols are made up of "letter" characters (upper or lower case), "number"
    characters (with the exception of the first character) and the special characters
    ‘’ and ‘.’ Please note that the $ character, which is allowed in other processors,
    cannot be used here because (like #) it indicates the start of an immediate value;


    +   - a label is a symbol followed by a :;


    +   - there are no differences when : giving the expression of a numerical value
    other than for expression in any numerical base. Only bases 10, 16 and binary
    are allowed. For binary numbers, the value must be prefixed with 0b. For example,
    the instruction MOV R0, #0b:100 would load the value 4 in R0.'
  merge: -1
  pgno: 239
- img_proc: true
  md: '# D.1.2. Memory management


    There is not a single directive to create sections. There are three directives
    that allow us to carry out operations (closings happen automatically with the
    opening of a new section). These are identified by the type of section that they
    create:


    +   - .text lets us open a section of code;

    - .data lets us open a section of initialized data;

    - .bss lets us open a section of data initially set to zero.


    These directives do not support certain options, unlike the ARM directive AREA.
    However, it is possible to add other directives to the section opening suite to
    specify specific:


    +   - .align n allows us to impose an alignment on the instruction or datum that
    follows this directive. The alignment will be to an address divisible by 2;

    - .ltorg allows us to specify that the contents of the Literal Pool must be placed
    in this section (which must be of the .text type).


    # D.1.3. Management of variables


    The different directives that allow us to make various reservations. Do not forget
    that the symbols will correspond to these reservations must, as for the labels,
    be followed by ":


    +   - .ascii "string" makes a reservation as many bytes as there are characters
    in the chain following this directive. Note that a .ascii version exists and is
    set at 0 at the end of the chain;

    - .byte{exp2{...}} reserves a byte initialized by exp. There are as many reservations
    as expressions;

    - .equ symbol, expression acts as a find (symbol)/replace (expression) in the
    current module. This directive allows us to define constants;

    - .fill{size{1},value} allows us to create repeat copies of the value value coded
    on size bytes. If value is not defined, the value will be zero. If size is not
    specified, the default size will be one;

    - .hword exp1{exp2{...}} is equivalent to .byte for 16-bit reservations (a half-word);'
  merge: -1
