  md: 'From Listing to Executable: External Modularity


    containing the μcontroller, but this approach is very inconvenient in the testing
    phase. We prefer to send it from the host to the μcontroller via a specialized
    connection so that the host places the image of the executable itself in Flash
    memory or RAM. This is no longer a load, but a download.


    The “loader” is responsible for properly copying the various sections of the program
    placed in the file containing the executable image to memory and, if appropriate,
    launching the execution. This utility is included in many cross-development suites
    (such as toolchain).


    The current generation of tools uses the JTAG (Joint Test Action Group) to download
    programs directly. JTAG is a synchronous series bus. The adapter uses this protocol
    to communicate with the processor. On a standard computer this bus is not present;
    the adapter will communicate on the PC side with a classic connection (typically
    a Universal Serial Bus [USB]).


    The development program or debugger is particularly useful for searching for errors
    in a program. The program being runs under the control of the debugger. For this,
    the debugger obeys commands that the user has given it inline. This can launch
    the execution of the program in continuous mode or step-by-step mode: in the latter
    case, only a single instance of the program is executed and the debugger takes
    back control. The user can place a breakpoint on an instruction of the program
    being executed and resume the execution of the program; this will interrupt the
    execution just before this instruction. At each step the debugger provides the
    current contents of all registers of the processor, and the user can find out
    the current state of the program; he/she can also look at the contents of the
    system stack or any memory region. He/she can know the current value of a datum
    for which he/she knows the address (thanks to the symbol table given by the linker),
    or give the name if the debugger is symbolic. At this, the debugger also allows
    us to change the value in any register, or to change any variable or memory position,
    before resuming the execution.


    To do its job, a symbolic debugger must at least have the symbol table. In fact,
    all debuggers need a range of information that must be included in the executable
    file. For this, the programmer must indicate (by invoking the assembler and linker
    with specific options) that they must include the information necessary for development
    under the debugger.


