  md: '# Overview of Cortex-M3 Architecture


    usually goes hand-in-hand with the use of an operating system (real-time or otherwise)
    for the software layer.


    +   - Bus matrix: This unit is a kind of gigantic intelligent multiplex. It allows
    connections to the external buses;

    - the ICode (32-bit AHB-Lite type) that carries the memory mappings allocated
    to the code units;

    - the DCode units (also 32-bit AHB-Lite type) that is responsible for reading/writing
    in data memory zones;

    - the System bus (again 32-bit AHB-Lite type), which deals with all system space
    access;

    - the Peripheral Bus (PPB): all peripherals contained in the µcontroller are added
    to the Cortex-M3 architecture by the designer. ARM designed a specific bus to
    allow exchanges with peripherals. This bus contains 32 bits, but in this case
    it is the Advanced Peripheral Bus (APB) type. This corresponds to another bus
    which you may know is less efficient than AHB type, but it is more than sufficient
    for access peripheral units. It should be noted that the bus matrix plays an important
    role in transmitting useful information to development units, which are mentioned
    in the next section.


    # 1.2.1. Development units


    The development of programs is an important and particularly time-consuming step
    in the development cycle of an embedded application. What is more, if the project
    has certification imperatives, it is necessary that tools (software and material)
    allowing maximum monitoring of the events occurring in each clock cycle are at
    disposition. In Cortex, the different units introduced below correspond to these
    monitoring functions. They are directly implanted in the silicon of the circuit,
    which allows them to use these development tools at a material level. An external
    software layer is necessary, to recover and process the information issued by
    these. The generic idea behind the introduction of hardware solutions is to offer
    us the ability to test and improve the reliability of (or certify) this her code
    without making any changes. It is convenient (and usual) to insert some print
    (“Hello I was here”) into a software structure to check that the execution passes
    through this structure. This done, a code modification is introduced, which can
    modify the global behavior of the program. This is particularly true when time
    management is the global factor for the system, which, for


    2 Advanced High-performance Bus (AHB) is a microcontroller bus protocol brought
    in by ARM.'
