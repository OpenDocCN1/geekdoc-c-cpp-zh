  md: '# ### 5.1.1. List of possible “condition” suffixes


    Table 5.1 corresponds to the possible substitutions for the symbol <c>. It should
    be noted that this also applies to jump instructions ($B$, $BL$, $BX$, etc.) which
    are then conditioned. In the case of these branch instructions, the instruction
    $IT$ is not inserted before the jump.


    | Suffix | Condition | Flags |

    |---|---|---|

    | EQ | EQual | Z = 1 |

    | NE | Not Equal | Z = 0 |

    | CS HS | Carry Set Higher or Same | C = 1 |

    | CC LO | Clear Lower | C = 0 |

    | MI | Minus | N = 1 |

    | PL | Plus | N = 0 |

    | VS | oVerFlow Set | V = 1 |

    | VC | oVerFlow Higher | V = 0 |

    | HI | unsigned Higher | (C = 1 AND Z = 0) |

    | LS | unsigned Lower or Same | (C = 0 OR Z = 1) |

    | GE | signed Greater than Equal | N = V |

    | LT | signed Less Than | N ≠ V |

    | GT | signed Greater | Z = 0 AND N = V |

    | LE | signed Less than Equal | Z = 1 OR N ≠ V |


    **Table 5.1.** List of possible conditions


