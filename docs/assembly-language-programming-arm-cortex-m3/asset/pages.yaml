- img_proc: true
  md: 'The Proper use of Assembly Directives 29


    - readonly or readwrite: indicates whether the section is accessible to read only
    (the default for CODE sections) or to read and write (the default for DATA sections),


    - noinit: for a DATA section, that it is not initialized or initialized at 0.
    This type of section can only contain rough memory reservations or reservations
    for data initialized at 0, and


    - align = n with a value between 0 and 31. This option indicates how the section
    should be placed in memory. The section will be aligned with a 2^n modulo address,
    or in other terms it signifies that the least significant n bits of the first
    address of the section would be 0.


    There are other options which, if they need to be in place, show that you have
    reached a level of expertise beyond the scope of this book.


    In a program, a section can be opened and closed several times. It is also possible
    that we like to open different sections of code or data that are distinct from
    each other. Finally, all of these various parts combine automatically. That is
    the role of the linker, which should therefore take into account the various constraints
    so that it can assign memory addresses for each constituent of the project.


    # 3.3. A section of code


    A section of code contains instructions in symbolic form. One instruction is written
    on one line, according to the following syntax:


    ```

    { label } SYMBOL { expr } {{expr}} { ; comment }

    ```


    The syntax of all assembly language is rigorous. At most, we can place one instruction
    on one line. It is also permitted to have lines without an instruction containing
    a label, a comment or nothing at all (to space out the listing in order to make
    it more readable). Finally, please note that a label must always be placed in
    the first column of the line.


    # 3.3.1. Labels


    A label is a symbol of your choice that is always constructed according to the
    same rules. The label serves as a marker, or an identifier, for the instruction
    (or the data). It allows us to go to that instruction during execution by way
    of a jump (branch).'
