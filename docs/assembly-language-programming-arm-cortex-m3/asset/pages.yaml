  md: '# 8.3.2. The nested mechanism


    As already been touched on, an exception can have two different statuses: active
    or pended status. When an exception is triggered, it is automatically switched
    to pended status; the bit corresponding to the SHCR (for traps) or ISPER (interrupts)
    switches to 1. In a standard case, i.e. if it is the only pended bit (or if its
    priority level overrides others), the NVIC switches the interrupt to active status,
    the process of re-routing is to 1, and the pended status is erased (the corresponding
    bit switches back to 0). Figure 8.16 lays out the timetable for this standard
    case and for the different priority levels below:


    +   - Case no. 1: a higher priority exception (A) arises during the processing
    of exception (B): is interrupted but (B) remains active. the processing of (A)
    is launched and when that is finished (exception return) the processing of (B)
    restarts where it left off.


    ![](img/281fc2009e6fb2fd9bfe8708a4c24432_177_0.png)


    +   - Case no. 2: a lower priority exception (C) arises during the processing
    of exception (B): (C) retains pended status, and will switch to active and be
    processed when the processing of (B) is finished, unless an exception with a higher
    priority level than (C) appears in the meantime.'
