  md: 'Internal Modularity 127


    REMARK 7.3.— If the programmer is drawn to define a subroutine requiring more
    than 10 arguments (so there are more than 10 registers for passing arguments using
    just the by-register technique), it would be quite reasonable for him or her to
    consider restructuring the program or the data in order to develop a new organization
    based on simpler block-functions.


    The problem arises during nested calls (recursion, for example) where it is necessary
    to save the succession of passing arguments to descend through the different call
    levels. The problem of the loss of these arguments can be settled if we consider
    reserving a place in memory where the arguments could be placed instead of putting
    them in the registers.


    The final idea is therefore to arrange the arguments directly in a stack: no more
    size problems (provided that we have correctly sized our stack, we have reserved
    enough memory space for its functioning) no troubles with saving because the stack,
    naturally, grows as we push arguments.


    The arguments of a procedure thus managed through a stack (i.e. placed on the
    stack before the call, used in the procedure, and then deleted upon return to
    the calling function) belong to the dynamic data category. This means that they
    are created and destroyed during demand execution. Generally such data are made
    in a free memory zone, which is named the heap or user stack. Here, we arrange
    part of this heap into the form of a LIFO structure managed by a general register,
    $Rn$.


    Three major steps therefore punctuate the evolution of this heap when it deals
    with passing arguments:


    +   - creation: the calling program stacks the arguments heap before calling the
    procedure;

    - use: access to arguments is carried out with the help of the indirect addressing
    mode $[Rn + offset]$;

    - disappearance: this means removing the arguments when they are no longer of
    use. There are two options: either the calling procedure removes them, or the
    called unstacks them. The following sections demonstrate the two options.


    REMARK 7.4.— Just as the technique used for carrying the passing of arguments
    must be part of the documentation provided to use a procedure, the creator of
    a procedure using the stack must also inform the future user of who should clear
    the stack of dumped arguments before the call. A *a priori* choice has no particular
    consequence, but it absolutely must be respected. Indeed, a stack drift cannot
    be seen on a unitary test but in the case of multiple calls this drift could lead
    to stack overflow, which can be catastrophic.'
