    # 9.3. The role of the linker


    The linker connects the creation of a program by bringing together the various
    modules into a single file called executable.


    # 9.3.1. Functioning principle


    When we call the linker (also called the link editor), we give it a list of modules
    to bring together that contain each of a number of input sections. The linker
    is also informed of the memory layout of the target on which the program will
    be executed. This layout is coded in the Project.sct file. The work to be done
    is relatively simple: the different input sections are grouped in order to give
    them addresses compatible with the memory layout.


    In our example, by invalidating the options that allow inclusion of debugging
    information, the CallProc.o file contains 16 different sections, and the Principal.o
    file contains 11 of them. We indicate that there are 128 KB of read-only memory
    (ROM) from address 0x00000000 and 20 KB of random access memory (RAM) from address
    0x00000000.


    > REMARK 9.3.– The memory layout used here is that of a STM32103RB, which is the
    microcontroller for this project. The absence of memory for the lowest addresses
    should be noted, as this is contrary to the imposed localization of the interrupt
    vector table (see Example 8.1). This contradiction is only apparent because STMicro
    has chosen to insert an alias between the [0x00000000–0x7FFFFFFF] zone'
