  md: '# 2.2.1. Registers R0 to R12


    These 13 registers are used, as we shall see in the passage reviewing the instruction
    set, as a container for storing the operands of an instruction and to receive
    the results of these operations. ARM ARM distinguishes between the first eight
    registers R0 to R7 (low registers) and the following four (R8 to R12, the high
    registers). The high registers have employment restrictions with certain instructions.
    The prudent programmer will primarily use the first registers so that they do
    not have to manage these restrictions.


    REMARK 2.2.— These general registers, contrary to other architectures, are only
    accessible in 32-bit packets. The registers can therefore not be split into two
    halves or four bytes. If your application deals with bytes (chains of characters
    to be more precise), for example, the 24 highest weighted would be positioned
    at 0 in order for their operation to be sensible.


