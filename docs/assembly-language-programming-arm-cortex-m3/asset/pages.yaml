  md: '# Assembly Language Programming


    temporarily using space (the time of the execution of the procedure) in the system
    stack; this storage zone will be lost when the program returns to procedure.


    Outside the case of dynamic allocation, the variables are set to static: they
    call a permanent table, the reservation is made in advance (SPACE, FILL, etc.)
    and the size of the memory space reserved is fixed. We must therefore reserve
    a place in memory that will allow us to receive the largest table we could possibly
    expect.


    A second problem appears here. Since the table is of variable size, what size
    is it at the moment we are interested in? There are two methods of showing the
    size of a table:


    +   - in the first, we create a structure where the first field contains the current
    size of the table;

    - the second is table itself.


    In the second method, we mark the end of the table with an element that has an
    agreed value. For example, it is quite usual for the NULL character (value = 0,
    not to be confused with the character ''0'', which has the value 0x30) to end
    a character string.


    > REMARK 6.10– we must remember to reserve a memory place for the marker element
