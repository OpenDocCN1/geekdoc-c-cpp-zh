  md: '# Chapter 5


    # Instruction Set


    Reading an instruction set is anything but pleasant. In their first reading of
    this chapter, readers will just skim through, but in the end, this is definitely
    the chapter that the user will return to the most often to find out what the processor
    can do and above all how he or she can make it that (i.e. with which operands).


    # 5.1. Reading guide


    A certain number of conventions, omissions or implicit rules govern the compilation
    of the explanations of the instruction set. It is therefore necessary to read
    these sections while taking into account the following remarks:


    +   - some instructions are only mentioned (at the end of the chapter) and are
    not explained. They are advanced instructions for the processor and so directed
    at advanced programmers who would not, in any case, be satisfied with this single
    book;

    - the majority of instructions are in a 16- or 32-bit version. The assembler,
    according to its implicit rules and functional limits (the size of the immediate
    operands, for example) will choose one or the other. It is, however, possible
    to force the desired size by adding the .W for a 32-bit or .N for a 16-bit extension.
    In doing so, this may lead to greater mastery of the code fabrication process
    but at the expense of failure in the event that it is impossible to code the instruction
    in the code with the suffix <>. In this book we will only indicate the possible
    sizes (16, 16/32 or 32 bits) for each instruction, being understood that forcing
    is only reasonable if the size is not fixed.'
