  md: '# # Chapter 8


    # # Managing Exceptions


    Understanding of exception mechanisms is an essential step when it comes to computer
    hardware. The core of a μcontroller is responsible for the execution of algorithms,
    task management and calculations necessary for the project, but all of this organization
    would be useless if it was not accompanied by the possibility of interfacing (the
    electronic sense) with the physical process that it has to manage. As explained
    in Chapter 1, it is the responsibility of the μcontroller designer (and not the
    Advanced IC) to develop these peripherals. These can be thought of as micromachines
    that are independent of the core and perform specific tasks (counting time, converting
    an analog signal into its numerical equivalent, periodically generating a square
    signal, etc.) Their preferred means of communication is the interrupt. By this
    specific mechanism, the micromachine signals to Cortex-M3, asynchronously with
    the current code execution, that has finished its task and that Cortex-Mshould
    therefore respond accordingly.


    A similar mechanism is engaged when, during the running of a code sequence, a
    "serious" event occurs and its processing requiring a particular regime. As an
    example, let take the case of an attempt to read the contents of a memory address
    that, for some reason, fails. This type of event is strictly specific to the functioning
    of the core and is usually launched synchronously with an instruction. It is then
    finished to speak of software traps.


    Finally, another type of communication can arise, which concerns the launch of
    a reset or a Non-Maskable Interrupt (NMI). These two events are generally transmitted
    by specific external pins of the processor and can be thought of as "emergency
    stops".'
