    # 8.4.2. Return


    The return from exception is, from an instruction point of view, very similar
    to that which we could write to carry a return to a classic routine. It consists
    of transferring the contents of LR to the PC pointer. This transfer is usually
    carried out by Branch and Exchange (BX) LR. As in the case of nested calls (see
    section 7.1.2), LR can be altered during the processing of the exception (e.g.
    it could call to some return or outside the exception procedure). It is therefore
    essential to save the instruction pointer in order to restore the return. This
    restoration/transfer can be carried out by a single instruction, POP PC. Finally,
    let us note that the loading instruction LDR PC, ??? can correspond to something
    (an immediate value, a register, etc.) containing one of the three permitted values.
    When PC receives this value of EXC_RETURN, it knows in which eight registers have
    been saved. It is then in position to carry out the restoration. In course of
    restoration, it re-modifies the PC pointer with its value before the re-routing,
    allowing the processor to resume the normal code of executions from the place
    where they were stopped.


    # 8.4.3. "Tail-chaining" and "late-arriving"


    In a standard functional cycle, the latency between NVIC receiving the interrupt
    request and the first start of the interrupt processing routine is 12 clock cycles.
    It can also produce situations where two exceptions follow each other, in which
    case the restore/save sequence may run differently in order to optimize this latency
    time.'
