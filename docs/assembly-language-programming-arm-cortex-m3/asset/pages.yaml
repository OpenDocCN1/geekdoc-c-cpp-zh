    First we must define what a register is. A register, in the primary sense, corresponds
    to a location in internal memory (in the sense of a series of accessible bits
    in parallel) of a processor. However, adjust this definition for the simple reason
    that in the case of RAM although there is internal memory (20 KB of size, for
