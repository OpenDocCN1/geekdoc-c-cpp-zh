    # 6.5. Data structure


    The assembly of a 32-bit processor allows us to easily exploit data on one, two
    or four bytes used as components of elementary structures: records, tables, queues
    and stacks. Assembly language, unlike higher-level languages, does not use an
    assembly language that allows us to directly declare or define one of these structures.
    It is therefore up to the programmer to construct them explicitly with the help
    of SPACE reservation directives or the reservation-initialization directives FILL,
    DCB, DCW and DCD (at least for that which concerns permanent data, because dynamic
    data created during the execution of a program post other problems). If the data
    must be written or read on more than four bytes, the treatment of each data presents
    an additional challenge to the programmer (working in multiple precision).


    # 6.5.1. Table in one dimension


    Also called a vector, a table is made up of data with identical nature placed
    in consecutive memory positions. For simple data, byte, half-word or word, we
    can explore such a table by using indirect addressing modes. It is sufficient
    to assign the Rn register with the address of the table and to modify this pointing
    value before ({Rn,#±imm}!) or after it ({Rn,#±imm}!).


    To directly access a datum in the table (direct access), it is also possible to
    use an index stored in an Rm auxiliary register ({Rn, Rm, LSL #<shift>}). The
    index'
  merge: -1
  pgno: 122
- img_proc: true
  md: 'will contain the number of the element to be reached and the left shift by
    LSL allows us to automatically calculate the offset to the base address to reach
    this element (LSL#1 for 16-bit tables and LSL#2 for 32-bit tables, ...etc).


    REMARK 6.9.- Assembly language gives the programmer total freedom regarding the
    method of placing elements in memory. The method presented above is-classic and
    simple, but the algorithm can sometimes be easily programmed if the data are arrays
    in the opposite order in memory (highest element at the lowest address or even
    versa are muddled up in a more subtle manner, for example, according to the sequence
    "first – last – second – last – exotic"! Efficiency is the primary motivation
    when writing in assembly language - during execution but also during the re-reading
    of programs, so it is very useful to intelligently comment on these "exotic" solutions.


    # 6.5.2. Tables in multiple dimensions


    A table has multiple dimensions, which we denote with the symbol Tab, must be
    arranged in memory in a linear form. Let us take the example of two dimensional
    table, with Nb Cols and Nd_Row rows. It is possible for the elements of Tab to
    be arranged row-by-row or column-by-column. It is usual (and simplifies things
    when we think in terms of storage) that the index Ind_Row of the row is between
    0 and Nb_Row-1, and that of the column Ind_Col is between 0 and Ind_Col-1. To
    reach the element Tab (Ind_Row, Ind_Col), we first calculate what we call the
    linear index: Relative_Place. This index can then be used in indirect addressing
    with index, as in the case of the one-dimensional table. Here we have:


    +   - Row-by-row arrangement:


    Relative_Place = Ind_Row x Nb_Col + Ind_Col


    +   - Column-by-column arrangement:


    Relative_Place = Ind_Col + Ind_Row x Nb_Row


    Let us illustrate this with the case of a matrix with three rows and four columns:


    | a0,0 | a0,1 | a0,2 | a0,3 |

    |---|---|---|---|n| a1,0 | a1,1 | a1,2 | a1,3 |

    | a2,0 | a2,1 | a2,2 | a2,3 |'
