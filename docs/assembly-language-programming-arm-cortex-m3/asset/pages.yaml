  md: "# 4.1. The constant and renaming\n\nIn section 3.1.1, we explained the rules\
    \ for constructing a symbol as well as those for expressing numerical values (with\
    \ or without literal expression), see section 3.4.1. The simplest way to use a\
    \ combination of these two is the declaration of a constant. A constant is a symbol\
    \ with which we associate a fixed value. So each time the assembler encounters\
    \ this symbol, it should simply replace it with the associated value. In a usual\
    \ text editor, Using a constant in a listing has two major advantages: The first\
    \ is that it makes the listing easier to read (which should not be considered\
    \ a luxury) and the second is that it allows us, when the constant is used several\
    \ times in the file, to carry out a modification of the value in only one place\
    \ in the listing. The maintenance or development of the program is thus made much\
    \ easier.\n\nThe EQU (Equivalent) directive allows us to define these constants.\
    \ Here are some examples:\n\nEXAMPLE 4.1.—Use of the EQU directive\n\n```\nLoop\
    \ EQU 12          ; Basic version\nTRUE EQU 0xFF         ; The value is expressed\
    \ in hexadecimal base\nFALSE EQU #           ; Insert a # for immediate access\n\
    Twice EQU Loop        ; Double equivalence...why not!\nBegin EQU main        ;\
    \ The equivalence is a label\nChar_G EQU ' '         \nMsg EQU \"Hello\"     \
    \ ; IMPOSSIBLE => assembly error!\n```\n\nThe EQU declaration has no consequence,\
    \ so as the third field is in an expression that corresponds to a 32-bit integer!\
    \ A string like the one in the last line of the example is impossible. It is necessary\
    \ to be vigilant when using a constant in the rest of the listing, particularly\
    \ if it concerns access to immediate values, such as those we will deal with in\
    \ the following section. Indeed an instruction such as MOV R0, TRUE, where TRUE\
    \ is the constant declared in Example 4.1, risks causing serious problems, which\
    \ we will come back to."
