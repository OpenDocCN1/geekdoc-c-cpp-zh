  md: '# Assembly Language Programming


    case of Cortex-M3, there is no such thing, as only Thumb (and its extension Thumb2)
    exists. Five instructions, however, require bit[0] to be 1 to function correctly.
    The instructions are BLX, BX, LDR, POP and LDM, the latter only being concerned
    when they modify the PC. During the execution of these instructions, and so the
    allocation of the instruction pointer, the LSB will be cleared and so rendezvous
    address will become even.


    Again, there is no need to worry; everything is transparent in the programming
    phase. The assembler and the link editor will know how to calculate the best values
    to produce perfectly executable code. In the development phase, this information
    may be important in order to avoid being surprised by a difference between the
    target address and the actual address.


