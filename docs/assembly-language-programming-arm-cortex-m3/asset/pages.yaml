    # 8.2.1.3. Bus fault


    With this trap, problems that are potentially present in the development phase
    begin to appear. This corresponds to being impossible for the processor to retrieve
    an instruction (*prefetch abort*) or carry out reading/writing of a datum (*data
    abort*). The typical case in which Cortex-M3 fails into this trap is that of bad
    pointer management (or indirect addressing), where the virtually pointed address
    (contents of the index register) does not correspond to a valid data address.
    Another common problem is the bad use of a peripheral that, for example, tries
    to retrieve a word that it can only provide byte. In certain cases, the BFAR (*Fault
    Address Register*) preserves the memory address that produced the fault. Bit 17
    of the SHCSR register allows us to validate or invalidate this trap and bits 14
    and 1 allow us to disable its activity state (active or pending).'
