  md: '# 7.2.6. On the art of mixing


    All of the versions of passing arguments that have been presented in the previous
    sections can mix well. This is both the strength and the flexibility of programming
    in assembly language, but it is also the difficulty. We can in fact, and for example,
    pass a first argument by value and by register, a second by reference and by system
    stack recover the results of the procedure on a user stack. It is easy to understand
    that such a mixture causes terrible problems. Thus, unless you are obliged (by
    motivations that can appear) to do so, it is best to avoid mixing.


    # 7.3. Local data


    To carry out its work, a subroutine may have to use its own data. These are the
    local data of the subroutine. The rule of local allocation invites us to place
    these data so that they are only used and visible by the proprietary subroutine.
    The simplest way of doing this in assembly language is to use the general registers
    to contain the local variables. It works perfectly in simple cases, especially
    if the local data are not too numerous. Unfortunately, the number of registers
    is limited. What is more, this method is not useful in the case of calls to recursive
    function without needing saves. We could consider planning the creation of these
    local data in a specific section of data, which leads to a "waste" of memory because
    it is only used during the execution of the procedure. A more satisfactory solution
    would be to superimpose all of sections by specifying them as being COMMON, We
    can, however, apply the same criticism to this method of superimposition by specifying
    them as arguments in the declaration of the section: AREA Mydata DATA align=2,
    COMMON, so that they share the same portion of memory. In a fixed space; the de
    arrang of a subroutine can lead to a partial or total loss of local data from
    the calling program. We therefore prefer to create the data in a dynamic manner
    at the beginning of the execution of the procedure. Here are two options, both
    using the heap:


    +   - in addition to the stack for the arguments, we use a second stack for the
    locals variables;

    - during execution we place them on the stack as the arguments.


    REMARK 7.6. Local variables dynamically created on a stack can equally be created
    on a user stack (a heap) or on the system stack. As in the case of passing arguments,
    the use of the system stack is more delicate, and therefore dangerous. As such,
    if there are no imperatives linked to memory, it is always preferable and safer
    to use the user stack itself.'
