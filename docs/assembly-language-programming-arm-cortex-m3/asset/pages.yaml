    # 8.2.1. The monitor


    To perform all of the developments and tests of a given application, Cortex-M3

    offers a hardware structure called debug. The development unit has the option

    ofreezing the core (Halt mode) and so taking complete control of the running of
    the

    code and all exceptions (apart from Reset and the NMI) that can occur. It is

    not always possible or desirable, however, to completely freeze the processor.
    For

    it is desirable to preserve the activity of certain tasks, such as

    t acceptance of higher level exceptions while matching the patch of the code to

    monitor, or to ensure a minimum of security.


    The second debug method, and the one that corresponds to this specific trap, can

    be of great use. The different exceptions that require a switch to debug mode
    will then

    tigger exception. The writing of an adequate handler (commonly called a

    monitor) allows us to keep track of different debugging requests. Bits 8 of the

    SHCSCR tells whether a debug exception monitor is active. The

    activation/deactivation of debug exception is possible and is managed at the level
    of the

    configuration registers of dedicated units.


    # 8.2.1.7. The PendSV service


    This service has a similar function to the SVC service. It allows us, with

    writing of the corresponding handler, to send a request to a higher software level.

    This second option exists because SVC cannot respond in all cases, to the extent
    that

    it is only triggered by the execution of a specific instruction. It is impossible
    to call

    this instruction in the treatment routine of an exception that is at a higher

    level. Such a case would cause a hard fault. This system call therefore not

    torespond to a specific instruction.


    The technique used consists of switching the exception to pending

    (its name) by activating bit 28 of the ICSR (Interrupt Control State Register),

    see Figure 8.5. In this, different exceptions (SysTick, PendSV and

    MI) can have their pended status changed. It should be noted that, for security

    reasons, the switch into pending mode and out from pended mode are done

    through two different bits for PendSV and SysTick. The simultaneous activation
    of

    bits both is ineffective. The switch to one of the PendSVCLR (or PENDSTCLR)

    bits also erases the PendSVSET (or PENDSTSET).'
