  md: '# Chapter 2


    # The Core of Cortex-M3


    The previous chapter showed how the programmer could break down the different
    units present in a \mucontroller like STM32 from a functional point of view. It
    is now time to delve a little deeper into the Cortex-M3 core, and to explain in
    detail the contents of the CM3CORE box, as shown in Figure 2.1.


    It would be pointless to create a replica (which would be incomplete due to the
    simplification necessary) of the contents of the various reference manuals [ARM
    06a, ARM 06b, ARM 06c] that gave detailed explanations of Cortex functions. It
    would also be pointless, however, to claim to program in assembly language without
    having a reasonably precise idea of its structure. This chapter therefore attempts
    to present the aspects of the architecture necessary for reasoned programming
    of a \mucontroller.


    # 2.1. Modes, privileges and states


    Cortex-M3 can be put into two different operating modes: thread mode and Handler
    mode. These modes combine with the privilege levels that can be granted to the
    execution of a program regarding access to certain registers:


    +   - At the unprivileged access level, the executed code cannot access all instructions
    (those specific to the access of special registers are excluded). It does not
    generally have access to all functions within the system (Nested Vector Interrupt
    Controller [NVIC], timer system, etc.). The concern is simply to avoid code that,
    by bad management of a pointer, would be detrimental to the global behavior of
    the processor and severely disturb the running of the application.'
  merge: -1
  pgno: 26
- img_proc: true
  md: '# Assembly Language Programming


    - At the other end of the spectrum, the privileged level, all of these limitations
    are lifted.


    - Thread mode corresponds to the default mode in the sense that it is the mode
    that the processor takes after reset. It is the normal mode for the execution
    of applications. In this mode, both privilege levels are possible.


    - The processor goes into Handler mode following an exception. When it has finished
    processing instructions for this exception, the last instruction allows a return
    to normal execution and causes the return to thread mode. In this mode, the code
    always has privileged access.


    Passage between these three types of functioning can be described by a state machine,
    which works with privilege. After reset, the least significant bit (LSB) of the
    CONTROL register is set by privilege. It is possible to switch to unprivileged
    mode (also called user mode in the ARM documentation) using software. In unprivileged
    mode, the user cannot access the CONTROL register, and it is impossible to return
    to the privileged mode. Just after the launch of an exception (Chapter 8) the
    processor switches to Handler mode, which necessarily has privilege. Once the
    exception has been processed, the processor returns to its previous mode. If,
    during processing of the exception, the LSB of the CONTROL register is modified,
    then the processor can return to the opposite mode to that was in effect before
    the launch. The only way to switch to unprivileged thread mode, as opposed to
    privileged mode, is by going through an exception that triggers itself by passing
    into Handler mode.


    This level of protection can appear somewhat minimal. It is a little like the
    locking/unlocking of your mobile phone: it takes a combination of keys (known
    to all) to achieve. It is obviously no use in preventing theft, but it is still
    useful when the phone is in the bottom of a pocket.


    This type of security can only be developed within a global software architecture
    including an operating system. In a rather simplistic but ultimately quite realistic,
    it is possible to imagine that the operating system (OS) has full access privileges.
    It can execute tasks in unprivileged thread mode, which could guarantee an initial
    level of security. A second privilege level concerns the functions of the memory
    protection unit mentioned previously. Each task can only access the memory regions
    assigned to it by the OS.


    A supplementary element should be taken into account in order to understand the
    functioning of Cortex-M3. It concerns the internal state of the processor, which
    can be in either Thumb or debug mode.'
