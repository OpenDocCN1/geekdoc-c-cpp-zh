  md: 'executed. This can typically be achieved with the *Trace Macrocell* units that
    can, in real-time and without causing any alteration of the processor, analyze
    and transmit data on the behavior and performance of the target observed. This
    approach, known as non-intrusive in ARM documentation, is particularly interesting
    for system surveillance, or in the case of dysfunction that is particularly difficult
    to localize or explain.


    In a classic development cycle, the first development steps require a much more
    intrusive approach, such as placing a breakpoint at a specified code address to
    stop the sequence during execution, analyzing the state of the processor at that
    precise moment, and then resuming the execution step-by-step.


    Cortex-M3 architecture offers two versions of these intrusive techniques:


    +   - the first technique involves freezing the processor core at the software
    level, Cortex-M3 switches to an internal state *Debug State*, in which it is possible
    to specify the step-by-step running of the program being executed, among other
    things. The development system, via the *JTAG* port, acts (*or RW*) directly on
    the debugging units and allows control from outside the program that is running;


    +   - the second, less intrusive approach consists of using a *Debug Monitor*,
    which is a software application embedded in Cortex-M3 that is triggered by an
    exception (see section 8.2.1.6). The exception then takes control of the running
    of the sequence executed by the processor and communicates with the development
    unit.


    As the objectives of this book do not include a deep and thorough understanding
    of all aspects of Cortex-M3, we will not further explain the methods and internal
    architectures involved in debugging. It is nevertheless true that "lower-level"
    programming cannot be done without these development tools, if only because the
    programmer has no other way of observing what happens in the target.'
