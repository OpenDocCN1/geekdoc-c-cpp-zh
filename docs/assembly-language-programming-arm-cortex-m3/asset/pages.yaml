    # 1.2.2.1. Functionality


    The choice of the right version of ucontroller can be a significant step in the
    design phase of a project: based on the needs (term of function, Input/Output,
    etc.) but also on the proper constraints (cost, consumption, size, etc.). Each
    version of the processor will be more or less well adapted to the project. Again,
    the purpose of this book is not to go into detail the function of the peripheral
    aspects of the ucontroller. It is, however, useful to have an overall view of
    the circuit that will eventually be programmed, so not to be surprised by such
    things as, for example, addressing memory. From a functional point of view, Figure
    1.3 shows how STMicroelectronics “dressed” Cortex-M3 to make a processor the STM32F103RB.
    The first important remark is that not all functions offered by this microcontroller
    are available simultaneously. Usually units share the output pins. So, depending
    on the configuration that the programmer imposes, certain functions must de facto
    be unavailable for the application. A profound knowledge of a given processor
    will allow the programmer to know, a priori, whether the chosen version will be
    sufficient for the needs of the application being developed. The issue of choosing
    the best version is far from trivial.


