    # # The SysTick Timer


    # ## B.1. Counters and timers in general


    Counters and timers are two entities that we must encounter in a microcontroller.
    They both do exactly the same thing. Indeed they correspond to registers that
    count up or down and have rising or descending fronts, or both. The difference
    between the names is that, in the case of timers, the front sequence that supplies
    the unit is periodic and has a known period (which is often adjustable). This
    implies that the value contained within the register corresponds to a time measurement,
    hence its name.


    The main event that occurs in the process of incrementation (or decrementation,
    respectively) is the overflow (or underflow) of the capacity of the register.
    Many things can intervene in this event but the main programmable actions on overflow
    (or underflow) are sending an interrupt request and reloading a given value in
    the counting register, causing a sample call to a specific routine. This is necessary
    for the development of a real-time kernel whose main role is sharing central processing
    unit (CPU) among tasks running on the processor. The motivation for the Advanced
    RISC Machine (ARM''s) choice to provide a timer inside the core was to be free
    from the specificities of the controllers (and so to be free from the choice of
    developers) so that a real-time kernel could be developed for all the circuits
    based on Cortex-M3. On its website, ARM lists the partners proposing such a real-time
    kernels (Real-Time Operating Systems) – there are over 20, and the list is subject
    to frequent change.'
