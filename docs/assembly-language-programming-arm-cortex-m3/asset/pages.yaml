  md: '# Assembly Language Programming


    Below is an example of a piece of program of limited algorithmic interest, but
    that contains a loop and consequently a label. With each loop, the program increments
    the R3 register by a value contained in R4. The number of loops carried out is
    also calculated by an incrementation (unitary in this case) in register R0. The
    loop is carried out as long as it does not exceed the capacity (so as long as
    the flag C of register xPSR remains at 0).


    EXAMPLE 3.2.– Jump to a label


    ```

    MOV R0,#0      ; Initialization of the counter

    MOV R3,#4      ; Initial value

    MOV R4,#5      ; Incrementation

    ADD R0,#1      ; Incrementation of the loop counter

    ADDS R3,R4     ; Incrementation of the value

    BCC Turn       ; Conditional branch

    Inf B            Inf

    ```


    The symbol # denotes an immediate addressing, i.e. it precedes a constant to use
    as it (in this case for loading the register). The last instruction (BCC) is a
    conditional jump. The B signifies a Branch request and the CC means Clear Carry.
    The processor only carries out the jump if the previous operation (with flag allocation)
    does not cause an overshoot or the switching of flag C to 1. The rendezvous point
    (Turnal) is the operand that follows the BCC instruction and corresponds to the
    label positioned five lines higher.


    A version of a jump without conditions is present in the line of this example.
    The instruction jumps to the label that marks that same instruction. Therefore
    corresponds to an infinite loop.


    When we place a label on an empty line, it serves to mark the first instruction
    (or piece of data) that it follows. For the assembler, labels are equivalent to
    addresses. The numerical value of a label is the value of the address that it
    represents. The label can also be the address of an instruction or a piece of
    data.


    REMARK 3.3.– In all assemblies language, the concept of label or constant can
    be expanded; it is possible to attribute a value to a label thanks to the equals
    (EQU) directive, which we will talk about in Chapter 4. It is the equivalent of
    a #define in C language. The label takes on the meaning of a numerical size written
    in symbolic form, which is not necessarily an address.'
