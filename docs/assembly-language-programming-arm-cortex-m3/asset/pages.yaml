  md: '# Chapter 4


    # Operands of Instructions


    Chapter 3 showed us how program written in assembly language is formed. Let us
    now look at techniques in this language for accessing and manipulating data. This
    involves defining what an operand is. First, let us specify that this processor
    has a load/store type structure. It is therefore possible to access memory zones
    in the Data section by using specific instructions. For these instructions, the
    operands will necessarily be the address of a memory location where it will need
    to read or write. The way to describe this expression corresponds to the term
    addressing mode and will be covered at the end of this chapter.


    For other instructions, the operands are explicitly given values (immediate operand),
    contents of registers, or labels in the case of branch instructions. In order
    to specify which operands a programmer wants to use to carry out the operation,
    or she writes an expression made of numbers and symbols.


    When the instruction takes two or three operands, as in the following example:


    ```

    Instr op1,op2,{op3}

    ```


    op1 is called the destination operand. This operand that receives the result of
    the operation or assignment. Operands op2 and op3 are called source operands,
    as they serve to supply the instruction.


    > REMARK 1.- For LDR (LoadD Register), etc.) and write STR (STore Register), etc)
    instructions (see section 5.7), the meanings of destination and source operands
    are reversed. This is a source of error when writing a source program in assembly
    language, even if at the instruction level we can see that logic.'
