  md: '# 3.3.2. Mnemonic


    We use mnemonic to mean the symbolic name of an instruction. This name is set
    and the series of mnemonics makes up the instruction set.


    In the ARM world, since the ARMV4 version of the architecture, there have two
    distinct instruction sets: the ARM set (coded in 32 bits) and the Thumb set (coded
    in 16 bits). The size for coding with the Thumb set being smaller, this set offers
    fewer possibilities than the full ARM mode. The advantage that can be drawn from
    this compression is a more compact code. For many ARM processors, there is the
    option to make them work in Thumb or ARM mode, according to the needs and appropriate
    constraints of the project.


    Since architecture version ARM6, ARM has introduced a subtlety by introducing
    a Thumb-2 version for the instruction set. In this second version of the Thumb
    affiliation, the 16-bit set is expanded with some 32-bit instructions to combine
    performance and density, as shown in Figure 3.1.


    ![](img/281fc2009e6fb2fd9bfe8708a4c24432_42_0.png)


    Cortex-M3 exclusively uses the Thumb-2 set. It is therefore impossible to switch
    to ARM mode (this is why the bit 7 in the Execution Program Status Register [EPSR]
    (see section 2.3.5) is always set to 1).


    > 1 This diagram is extracted from ARM commercial documents, and is thus to be
    understood as such.'
