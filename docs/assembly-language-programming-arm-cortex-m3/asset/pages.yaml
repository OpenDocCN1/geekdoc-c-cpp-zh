  md: '# From Listing to Executable: External Modularity


    and RW received as a function of the state of two pins after a reset. The principle
    of this maneuver is to be able to find the reset vector (and so the reset code)
    in internal Flash, in system memory or in internal RAM. Here the target zone of
    the alias is [0x08000000-0x01000000], which corresponds to the internal Flash
    memory. In this project, lower addresses are present, even if they are virtual.


    Let us remember that Cortex-M3 architecture is of the Harvard type, so there is
    a complete separation of the code and data zones (see Figure 1.5). The linker
    must therefore assign the code sections with addresses present in the [0x00000000-0xFFFFFFFF]
    and the data sections with addresses present in the [0x20000000-0xFFFFFFFF] zone.


    Each input received by the linker has a type and attributes. The main types are:


    +   - RO (Read Only) zone, which is a ROM or Flash zone whose typical content
    is code. It is common (in the GNU world, for example) to use the abbreviation
    .text

    - RW (Read/Write) zone, which is a RAM whose typical contents are initialized
    data. The usual synonym for this is .data;

    - ZI (Zero Initialized) zone. This is also a read/write zone that will contain
    uninitialized data. By default Z zones are set to 0. This type of section is also
    called .bss.


    In this typing, there is a series of attributes which, in the case of those found
    at the head of ELF files, allow the recording of different information that may
    be needed by the linker, loading or even symbolic debugging.


    In a simplistic (but not completely false) vision, the work of the linker consists
    of retrieving the list and the size of the code and data sections, bringing them
    together and distributing them in corresponding memory zones. It concatenates
    the different pieces by properly merging the symbol tables: it is sufficient to
    correct the values of the labels by progressively increasing the size of the sections.
    Finally, the linker changes the initial address of each section by determining
    its definitive address. Once more, it carries out the correction of instructions
    using the relocation tables. This simplistic vision is not enough: in fact the
    product of the linker cannot be called an executable file. It produces an image
    of an executable that will be "seen" differently at the loading level or at the
    execution level itself.'
