  md: '52 Assembly Language Programming


    # 4.2.1.3. Shift


    In the instruction set, at least in the extended 32-bit part (Thumb-2), there
    is the option to impose a shift on the source operand. In Example 4.2, a logical_AND
    is carried out: R0 ← R1 & (R2 << 3). Note that the suffix S in instruction shows
    where the flags will be positioned for the execution.


    EXAMPLE 4.2.–Logical AND a little bit complex


    ```

    ANDS R0,R1,R2,LSL #3

    ```


    It is possible to introduce different shifts, to the left or right of the last
    source operand. What can appear to be a subtle trick is fact widely used by compilers.
    Remember that a right shift of n bits is equivalent to multiplying by 2ⁿ (for
    a left shift, it would be equivalent to dividing by 2ⁿ). Well used, this can save
    a lot of computing time.


    In the case of three operands, the syntax is as follows:


    +   - Instr RI, Rj, LSL #n : logical left shift of n bits

    - Instr RI, Rj, LSR #n : logical right shift of n bits

    - Instr RI, Rj, ASR #n : arithmetic left shift of n bits

    - Instr RI, Rj, ROR #n : rotate right to n bits

    - Instr RI, Rj, RRX : rotate right including the flag C


    In each case, the i, j and k are integers between 0 and 12, and n is an integer
    between 1 and 31. The logical shift introduces zeros to the right or the left.
    The arithmetic shift reintroduces the most significant bit (so the sign bit) in
    order to prevent the loss of the signed representation of a number. Rotation copies
    bit[0] into bit[31] with each turn. RRY makes a single 33-bit rotation, the 33rd
    being the C flag.


    REMARK 4.2.– The previous example actually shows three operands. In fact, R2,LSL#3
    is only really considered to be one operand. This observation is of minor semantic
    interest.


    3 This possibility is limited to the following 16 arithmetic instructions: ADC,
    ADD, AND, BIC, CMN, CMP, EOR, ORN, OR, RSB, SBC, SSAT, SUB, TEQ, TST and USAT.'
