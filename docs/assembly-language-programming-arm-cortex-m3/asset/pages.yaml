  md: '# Chapter 6


    # Algorithmic and Data Structures


    # 6.1. Flowchart versus algorithm


    Assembly language uses labels and jumps, which can be conditional or not. This
    naturally leads to a geographic vision of a program, where we represent the route
    plan (route map) of the instructions in the form of a flowchart, with agreed symbols
    to represent the conditional diversions (switches), among others. Such use of
    flowcharts was abandoned long ago in favor of writing structured algorithms for
    various reasons. Here are some of them:


    +   - the design and maintenance of a flowchart is laborious;

    - the debugging of programs is also laborious; if there is a problem in the execution
    of an instruction, it is not obvious which route in the flowchart we took to reach
    this point;

    - it is very difficult to test part of a program;

    - it is also very difficult to extract part of a program from a flowchart in order
    to reuse it in a subsequent program.


    We therefore prefer to enumerate a tree, known as modular analysis, in which every
    program is exclusively made up of a succession of cellular elements, generically
    called modules, each module itself being a series of sub-modules, etc. At the
    most basic level, we arrive at the idea of a structured language made up of instructions
    that, like the modules, only have one entry point and one exit point. In this
    way it is possible to obtain structured language when we program correctly.'
  merge: -1
  pgno: 98
- img_proc: true
  md: '# Assembly Language Programming


    In assembly language, we have at best transposed these concepts: the program can
    be written to different files (called "modules" in the jargon used elsewhere by
    assemblyists), yet each file is made up of procedures, which themselves call subroutines.
    This is known as external modularity. Each module or procedure represents a piece
    of the program: it must be tested separately, and be reused in another program.
    At the deepest level of this ideal tree structure, we find the instruction. Each
    module has only one entry point and one exit point; the instruction must also
    have only one entrance and one exit with assembly language; however, assembly
    language is not a structured language! Some instructions, such as conditional
    instructions, have two examples. Despite this, we get around the problem with
    so-called systematic programming. The lowest level modules are first described
    with a structured approach. Thus, for each structured instruction in the algorithm,
    we systematically translate into assembly language according to a model prepared
    in america. Each structured instruction corresponds to a block made up of instructions
    in assembly. This block has only one entry (the first instruction) and one exit
    point. If there are labels in this block, we must consider them specific to this
    block, and inaccessible to other blocks. The only label accessible to others is
    entry label, which is posted on the first instruction of the sealed block. In
    this chapter, we will show how each structured instruction can be transformed
    into a block of assembly language instructions. For each block of instructions
    presented, we will use the labels Entry_Point and Exit_Point to show the entry
    and exit points of the block. Structured instructions in algorithmic language
    use the following conventions:


    +   - cond represents a Boolean condition;

    - not(cond) is the logical opposite of cond;

    - treatment is a sequence of instructions to be executed;

    - variable is an integer datum.


    It should be noted that, for the sake of reliability of an assembly language program,
    it is strongly recommended that each block contains a maximum of about 10 lines.
    Then it can be made up of several simple instructions, or calling procedures.
    We should note that the label names have been chosen to correspond as closely
    as possible to that appear in the algorithms, but we should also be aware that
    these names or this method of choosing labels in a real program would be a very
    bad idea.


    REMARK 6.1.- In this chapter we will present the different algorithmic structures,
    purposely omitting an instruction peculiar to the ARM assembler: IT (InInterrupt)
    (the option to consider most aesthetic and logical structures).'
