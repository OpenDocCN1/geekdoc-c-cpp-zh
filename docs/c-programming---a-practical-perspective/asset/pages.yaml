    return value, and the empty parentheses indicate that it takes no arguments. Note
    that the declaration is terminated with a semicolon it is a complete statement
    in itself. Function declarations are also prototypes, since they provide a model
    or blueprint for the function. They tell the compiler, function that looks like
    this is coming up later in the program, so it is all right if you see references
    to it before you see the function itself.


