  md: "# 11.6 Structure within a Structure\n\nA structure may be defined as a member\
    \ of another structure. In such structures the declaration of the embedded structure\
    \ must appear before the declarations of other structures.\n\n```\nstruct date\n\
    {\n  int day;\n  int month;\n  int year;\n}\nstruct student\n{\n  int id_no;\n\
    \  char name[20];\n  char address[20];\n  char combination[3];\n  int age;\n \
    \ structure date def;\n  structure date doa;\n}oldstudent,newstudent;\n```\n\n\
    the structure student contains another structure date as one of its members.\n\
    \n# 11.7 Union\n\nHowever the members that we compose a union all share the same\
    \ storage area within the computers memory whereas each member within a structure\
    \ is assigned its own storage area. Unions are used to observe memory. They are\
    \ useful for the application involving multiple members. Where values need not\
    \ be assigned to all the members at any time. Union like structure contain members\
    \ whose individual data types may differ from one another also. Like structures\
    \ can be declared using the keyword union as follows:\n\n```\nunion item\n{\n\
    \  int m;\n  float p;\n  char c;\n}\n```"
