  md: "# 4.2.3 Precedence in Arithmetic Operators\n\nAn arithmetic expression without\
    \ parenthesis will be evaluated from left to right using the rules of precedence\
    \ of operators. There are two distinct priority levels of arithmetic operators\
    \ in C.\n\nHigh priority * / %\n\nLow priority + -\n\n# 4.2.4 Rules for evaluation\
    \ of expression\n\nFirst parsed sub expression left to right to be evaluated.\
    \ If parentheses are nested, the evaluation begins with the innermost sub expression.\
    \ The precedence rule is applied in determining the order of operators in evaluating\
    \ sub expressions. The associativity rule is applied when two or more operators\
    \ of the same precedence level appear in the sub expression. Arithmetic expressions\
    \ are evaluated from left to right using the rules of precedence. When parenthesis\
    \ are used, the expressions within parenthesis have highest priority.\n\n# 4.3\
    \ Implicit Type Conversion\n\nC mixing contents and variables of different types\
    \ in an expression. C automatically converts any intermediate values to the proper\
    \ type that the expression can be evaluated without loosing any significance.\
    \ This automatic type conversion is known as implicit type conversion\n\nThe rules\
    \ apply during evaluating expressions All short and char are automatically converted\
    \ to int.\n\n+   (1) If one operand is double, the other will be converted to\
    \ double and result will be long double.\n(2) If one operand is double, the other\
    \ will be converted to double and result will be double.\n(3) If one operand is\
    \ float, the other will be converted to float and result will be float.\n(4) If\
    \ one of the operand is unsigned int, the other will be converted to unsigned\
    \ long int and result will be unsigned long int.\n(5) If one operand is long int\
    \ and other is unsigned int then\n  (a) If unsigned int can be converted to long\
    \ int, then unsigned int operand will be converted as such and the result will\
    \ be long int.\n  (b) Both operands will be converted to unsigned long int and\
    \ the result will be unsigned long int.\n(6) If one of the operand is long int,\
    \ the other will be converted to long int and the result will be long int.\n(7)\
    \ If one operand is unsigned int the other will be converted to unsigned int and\
    \ the result will be unsigned int."
