    # 8.3 Why we use Functions


    The most important reason to use functions is to aid in the conceptual organization
    of a program. The function''s code is stored in only one place in memory, even
    though the function is executed many times in the course of the program. Some
    reasons are given below


    +   (1) Many programs require that a specific function is repeated many times
    instead of writing the function code as many times as it is required we call it
    as a single function again and again as many times as it is.

    (2) We can avoid redundant program code of some instructions again and again.

    (3) Programs using functions are compact & easy to understand.

    (4) Testing and correcting errors is easy because errors are localized and corrected.

    (5) We can understand the flow of program, and its code easily since the readability
    is enhanced while using the functions.

    (6) A single function written in a program can also be used in other programs.


