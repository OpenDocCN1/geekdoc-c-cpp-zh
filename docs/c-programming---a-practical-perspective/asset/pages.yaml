  md: '# INTRODUCTION TO C


    OBJECTIVE

    This chapter is designed to give you a general overview of the C programming language,
    Edit, link and run your C programs, C character set and the general structure
    of a C program


    # 2.1 A Brief History of C


    C is a general-purpose language which has been closely associated with the UNIX
    operating system for which it was developed - In C. Many of the important ideas
    of C stem from the language BCPL, developed by Martin Richards. The influence
    of BCPL on C proceeded indirectly through the language B, which was written by
    Ken Thompson in 1970 at Bell Labs, for the first UNIX system on a DEC PDP-7. BCPL
    and B are "type less" languages whereas C provides a variety of data types. At
    Bell Labs writes C and in 1978 the publication of The C Programming Language by
    Kernigh & Ritchie caused a revolution in the computing world. In 1983, the American
    National Standards Institute (ANSI) established a committee to provide a modern,
    comprehensive definition of C. The resulting definition, the ANSI standard, or
    "ANSI C", was completed late 1988.A Rough Guide to Programming Languages is available
    on-line for those of you that are interested.'
