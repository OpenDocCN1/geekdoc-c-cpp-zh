  md: '# 118 C'' Programming – A Practical Perspective


    Dynamic allocation of arrays of more than one dimension is not so easily done,
    because dynamic allocation of an n-dimensional array actually requires dynamic
    allocation of n 1-dimensional arrays. To allocate a 2-dimensional array you must
    first allocate memory sufficient to hold all the elements of the array, then allocate
    memory for pointers to each row of the array. For arrays of more than two dimensions
    it gets more complicated. To allocate a 3-dimensional array you first allocate
    memory for the data, then allocate memory for an array of pointers to rows of
    data within that memory, then allocate memory for an array of pointers to a subset
    of those pointers. And so on for higher dimension.


