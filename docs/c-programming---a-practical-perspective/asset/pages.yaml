  md: "# 86 C' Programming – A Practical Perspective\n\nencounter certain dynamic\
    \ data structures such as linked lists or binary trees. Recursion is a very useful\
    \ way of creating and accessing these structures.\n\nHere is a recursive version\
    \ of the Fibonacci function. We saw a non recursive version of this earlier.\n\
    \n```\nint fib(int num)\n/* Fibonacci value of a number */\n{\n    switch(num)\
    \ {\n    case 0:\n      return(0);\n      break;\n    case 1:\n      return(1);\n\
    \      break;\n    default: /* Including recursive calls */\n      return(fib(num\
    \ - 1) + fib(num - 2));\n      break;\n    }\n}\n```\n\nWe met another function\
    \ earlier called pow. Here is an alternative recursive version.\n\n```\ndouble\
    \ power(double val, unsigned pow)\n{\n    if(pow == 0) /* pow(x, 0) returns 1\
    \ */\n      return(1.0);\n    else\n      return(power(val, pow - 1) * val);\n\
    }\n```\n\nNotice that each of these definitions incorporate a test. When an input\
    \ value gives a trivial result, it is returned directly, otherwise the function\
    \ calls itself, passing a changed version of the input values. Care must be taken\
    \ to define functions which will not call themselves indefinitely, otherwise your\
    \ program will never finish. The definition of fib is interesting, because it\
    \ calls itself twice when recursion is used. Consider the effect on program performance\
    \ of such a function calculating the Fibonacci function of a moderate size number."
