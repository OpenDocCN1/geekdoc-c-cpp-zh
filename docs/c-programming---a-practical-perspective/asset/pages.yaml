    The putchar() function which analogous to getchar() function can be used for writing
    characters one at to the output terminal. The general form is


    ```

    putchar(Variable_name);

    ```


    Displays the value stored in variable c to the standard screen.


    # 7.3 String Input and Output


    The gets() receives the string from standard input device while puts() outputs
    the string to the standard output device. A string is an array or set of characters.
    The function gets() accepts the name of the string as a parameter, and fills the
    string with characters that are input from the keyboard until the character is
    encountered. At the end function adds a null terminator as must be done to any
    string and returns. The puts() function displays the contents stored in its standard
    screen.


    ```

    gets();

    ```


    The standard form of the gets function is


    ```

    gets(str); /* str is a string variable. */

    ```


    ```

    puts();

    ```


    The standard form of the puts character is


    ```

    puts(str); /* str is a string variable. */

