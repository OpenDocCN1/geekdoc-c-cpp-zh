  md: "# 7.4 Formatted Input for Scanf\n\n# 7.4.1 scanf()\n\nThe formatted input refers\
    \ to input data that has been arranged in a particular format. Input values are\
    \ generally taken by using the scanf function.\nThe scanc function has the general\
    \ form.\n\n```\nscanf(\"control string\", arg1, arg2, arg3 ............argn);\n\
    ```\n\nThe format field is by the control string and the arguments arg1, arg2\
    \ specifies the address of location where address is to be stored. The control\
    \ string specifies the field format and optional number specifying field width\
    \ and the conversion character % and also blanks, tabs and newlines. The Blanks\
    \ tabs and newlines are ignored by compiler. The conversion character % is followed\
    \ by the type of data that is to be assigned to the assignment. The field width\
    \ Specifier is optional.\n\nA simple program to illustrate the use of scanf statement:\n\
    \n```\n#include <stdio.h>\nint main(void)\n{\n    scanf(\"%s\",&name);\n    return\
    \ 0;\n}\n```\n\n# 7.4.2 printf()\n\nThe most simple output statement can be produced\
    \ in C Language by using printf statement. It allows you to display information\
    \ required to the user and also print the variables. We can also format the output\
    \ and produce text labels.\nThe simple statement such as\nprintf(\"Enter 2 numbers\"\
    );\nPrompts the message enclosed in the quotation to be displayed.\nA simple program\
    \ to illustrate the use of printf statement:\n\n```\n#include <stdio.h>\nint main(void)\n\
    {\n    printf(\"Hello, world!\\n\");\n    return 0;\n}\n```"
