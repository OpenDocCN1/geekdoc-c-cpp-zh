  md: "# 9.7 Static and Dynamic Allocation of Multidimensional Arrays\n\nAn array\
    \ in C is a region of memory in which the elements (chars, ints, etc.) can be\
    \ accessed using an index (in a 1-dimensional array, e.g. name[0]) or several\
    \ indices (in a multi-dimensional array, e.g., names[3][0]). The first element\
    \ in a 1-dimensional array x[] is x[0], in a 2-dimensional array x[][] is x[0][0],\
    \ and so on. In C you can allocate memory for an array using statements such as:\n\
    \n```\nchar name[32];\nint nums[60];\ndouble colors[60];\nchar names[10][20][64];\n\
    double space[32][32][32];\n```\n\nThe index of the last element in a 1-dimensional\
    \ array is one less than the size of the array (e.g name[31]) if the array is\
    \ declared using char name[32]). In a multidimensional array the indices of the\
    \ last element are one less the sizes of each dimension (e.g. names[9][19][63])\
    \ if the array is declared using char names[10][20][64]). When an array is declared\
    \ as above, memory is allocated for the elements of the array when the program\
    \ starts. This is known as static array allocation. It may happen that your array\
    \ is not large enough; in this case it is convenient to allocate an array while\
    \ the program is running. This is known as dynamic array allocation. Dynamic allocation\
    \ of a 1-dimensional array is easily done using the malloc() function. For example,\
    \ if you wish to allocate an array of 1000 then the following code can be used:\n\
    \n```\n#include <malloc.h>\n#include <stdio.h>\n#include <stdlib.h>\nint main(void)\n\
    {\n\tint *a;\n\nint i=1000;\n\n\tif (a = (int*)malloc(sizeof(int))) == NULL)\n\
    {\n\tprintf(\"\\nError, memory not allocated.\\n\");\n\texit(1);\n\t}\n\n\tfor\
    \ (i=0;i<1000;i++)\n\ta[i] = i;\n\n\t// ...\n\n\tfree(a);\n}\n```"
