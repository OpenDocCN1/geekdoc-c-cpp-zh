    # 1.7.2 Advantages and Disadvantages


    Pseudocode Disadvantages


    +   (1) It''s not visual

    (2) There is no accepted standard, so it varies widely from company to company


    Pseudocode Advantages


    +   (1) Can be done easily on a word processor

    (2) Easily modified

    (3) Implements structured concepts well


    Flowchart Disadvantages


    +   (1) Hard to modify

    (2) Need special software (not so much now!)

    (3) Structured design elements not implemented


    Flowchart Advantages


    +   (1) Standardized: all pretty much agree on the symbols and their meaning

    (2) Visual (but this does bring some limitations)


    # 1.8 System Flowcharts


    A system flowchart is a flowchart which gives overall view of computer system
    in addition to the pictorial representation of the flow of operations of an algorithm.


    In other words as the name indicates, system flowcharts are drawn to show diagrammatically,
    the total environment of computer on which the given algorithm or program is to
    be solved. System flowcharts provide us a list of symbols for indicating input-output
    devices on which data transactions are read/printed. Therefore system flowchart
    will further improve and assist the computer programming; because system flowcharts
    not only specify the operations to be performed pictorially but the computer system
    environment where all these data processing activities are handled.


    To summarize, a system flowchart is a graphical representation that gives the
    complete view of a data processing system. It has flowchart symbols to show the
    following:


    The activities (either manual or computing) are carried out within such a data
    processing system. The I/O devices and storage media used to store/handle the
    data file, transactions, etc., are involved in data processing activities.'
