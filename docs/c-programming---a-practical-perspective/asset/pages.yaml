  md: 'this declares a variable code of union item. The union contains three members
    each with a different data type. However we can use only one of them at a time.
    This is because only one location is allocated for union variable irrespective
    of size. The compiler allocates a piece of storage that is large enough to access
    a union member we can use the same syntax that we use to access structure members,
    i.e.,


    ```

    code.m

    code.p

    code.c

    ```


    are valid member variables. During accessing we should make sure that we are accessing
    the member whose value is currently stored.


    For example a statement such as

    code.m=456;

    code.p=456.78;

    printf("%d",code.m);


    Would produce erroneous result.

    In effect a union creates a storage location that can be used by one of its members
    at a time. When a different number is assigned a new value the new value supersedes
    the previous members value. Unions may be used in all places where a structure
    is allowed. The notation for accessing a union member that is nested inside a
    structure remains the same as for the nested structure.


