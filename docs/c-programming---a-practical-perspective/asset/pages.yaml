  md: '# 10.4 Pointers and Function


    The pointer are very much used in a function declaration. Sometimes only with
    a pointer complex function can be easily represented and success. The usage of
    the pointers in a function definition may be classified into two groups.


    +   1. Call by reference

    2. Call by value.


    Call by value:

    We have seen that a function is invoked there will be a link established between
    the formal and actual parameters. A temporary storage is created where the value
    of actual parameters is stored. The formal parameters picks up its value from
    storage area the mechanism of data transfer between actual and formal parameters
    allows the actual mechanism of data transfer is referred as call by value. The
    current value of corresponding actual parameter becomes a local variable in the
    called function. The value of formal parameter may be changed in the body of the
    actual parameter. The value of formal parameter may be changed in the body of
    the subprogram by assignment or input statements. This will not change the value
    of actual parameters.


