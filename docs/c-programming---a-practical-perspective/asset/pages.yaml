  md: "# 5.4 The Switch Statement\n\nThe switch statement provides a way of choosing\
    \ between a set of alternatives, based on the value of an expression. The general\
    \ form of the switch statement is:\n\n```\nswitch (expression)\n{\n    case constant1:\n\
    \    statements;\n    ...\n    case constant:\n    statements;\n    default:\n\
    \    statements;\n}\n```\n\nFirst expression (called the switch tag) is evaluated,\
    \ and the outcome is compared to each of the numeric constants (called case labels),\
    \ in the order they appear, until a match is found. The statements following the\
    \ matching case are then executed. The plural: each case may be followed by zero\
    \ or more statements (not just one statement). Execution continues until a break\
    \ statement is encountered or all intervening statements until the end of the\
    \ switch statement are executed. The final default case is optional and is exercised\
    \ if none of the earlier cases provide a match\n\n# 5.5 Loops\n\nThe other main\
    \ type of control statement is the loop. Loops allow a statement, block of statements,\
    \ to be repeated. Computers are very good at repeating simple tasks many times,\
    \ the loop's C of achieving this C gives you a choice of three types of loop:\
    \ while, do and for.\n\n# 5.5.1 While Loop\n\nThe while loop keeps repeating an\
    \ action until an associated test returns false. This is useful where the programmer\
    \ does not know in advance how many times the loop will be traversed.\nThe general\
    \ syntax is as follows:\n\n```\nWhile(Condition)\n{\n    Block of statements\n\
    }\n```"
