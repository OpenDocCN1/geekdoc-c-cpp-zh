  md: '# 6.2 Preprocessor Directives


    | Directive | Function |

    | --- | --- |

    | #define | Defines a macro substitution |

    | #undef | Undefines a macro |

    | #include | Specifies a file to be included |

    | #ifdef | Tests for macro definition |

    | #endif | Specifies the end of #if |

    | #ifndef | Tests whether the macro is not def |

    | #if | Tests a compile time condition |

    | #else | Specifies alternatives when #if test fails


    The preprocessor directives can be divided into three categories

    (1) Macro substitution division

    (2) File inclusion division

    (3) Compiler control division


    # 6.3 Macros


    Macro substitution is a process where an identifier in a program is replaced by
    a pre defined string of one or more tokens. We can use the #define statement for
    the task. It has the following form


    #define identifier string


    The preprocessor replaces every occurrence of the identifier in the source code
    by the string. The definition should start with the keyword #define and should
    follow with identifier and a string with at least one space between them. The
    string may be any text and identifier must be a valid name.


    There are different forms of macro substitution. The most common form is:

    (1) Simple macro substitution

    (2) Argument macro substitution

    (3) Nested macro substitution


    Simple macro substitution:

    Simple string replacement is commonly used to define constants. Example:


    ```

    #define pi 3.1415926

    ```


    Writing macro definition in capitals is a convention not a rule. A macro definition
    can include more than a simple constant value. It can include expressions as well.
    Following is valid example:'
