  md: '# 3.2 Keywords


    Keywords or Reserve words of the C language are the words whose meaning is already
    defined and explained to the C language compiler. Therefore Reserve words cannot
    be used as identifiers or variable names. They should only be used to carry the
    pre-defined meaning. For example it is a reserve word. It indicates the data type
    of the variable. Therefore it is reserved to carry the specific meaning. Any attempt
    to use it other than the intended will generate a compile time error. C language
    has 32 keywords. Following are some of them:


    | Auto | break | Case | char | const | continue | default |

    | Do | double | Else | enum | extern | float | for |

    | Goto | if | Int | long | register | return | short |

    | Signed | sizeof | Static | struct | switch | typedef | union |

    | unsigned | void | | Volatile | | | |


    # 3.3 Variables


    A variable is a name given to the space in the memory for holding data such as
    integers, floating point numbers, strings, etc. Using a variable name is more
    convenient than using the memory locations. There are certain rules for naming
    variables for which you need to refer to the rules for identifiers.


    # 3.3.1 Declaration of variables


    To declare a variable means create a memory space for the variable depending on
    the data type used and associate the memory location with the variable name. In
    C all the variables should be declared before it can be used. Also you cannot
    re-declare a variable once it has been already declared.


    The general pattern for declaring a variable is as follows:

    e.g:

    int age;

    int age, count, i;

    float amount, rateofinterest, totalbalance;

    char ch;


    # 3.4 Constant Variables


    Constant


    A constant can be defined as "a quantity that does not change during the execution
    of a program".'
