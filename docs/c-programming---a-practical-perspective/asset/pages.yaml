  md: '# 28 □ C'' Programming – A Practical Perspective

    3.6 Data Types


    C language data types can be broadly classified as

    Primary data type

    Derived data type

    User-defined data type


    # 3.6.1 Primary data type


    All C Compilers accept the following fundamental data types


    | (1) | Integer | Int |

    |---|---||

    | (2) | Character | char |

    | (3) | Floating Point | float |

    | (4) | Double precision floating point | double |

    | (5) | Void | void |


    The size and range of each data type is given in the table below


    | DATA TYPE | RANGE OF VALUES |

    |---|---|

    | char | -128 to 127 |

    | Int | -32768 to +32767 |

    | float | 3.4 e-38 to 3.4 e+38 |

    | double | 1.7 e-308 to 1.7 e+308 |


    3.6.1.1 Integer type :

    Integers are numbers with a machine dependent range of values. A good programming
    language as to support the programmer by giving a control on a range of numbers
    and storage space. C has 3 classes of integer storage namely short int, int and
    long int. All of these data types have signed and unsigned forms. A short int
    requires half the space as normal integer values. Unsigned numbers are always
    positive and consume all the bits for the magnitude of the number. The long and
    unsigned integers are used to declare a larger range of values.


    Floating point number represents a real number with 6 digits precision. Floating
    point numbers are denoted by the keyword float. When the accuracy of the floating
    point number is insufficient, we can use the double to define the number. The
    double is same as float but with longer precision. To extend the precision further
    we can use long double consumes 80 bits of memory space.


    3.6.1.3 Void Type :

    Using void data, we can specify the type of a function. It is a good practice
    to avoid functions that does not return any values to the calling function.'
