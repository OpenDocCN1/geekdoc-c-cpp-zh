    In C a pointer is a variable that points to or references a memory location in
    which data is stored. Each memory cell in the computer has an address that can
    be used to access that location so a pointer variable points to a memory location
    we can access and change the contents of this memory location via the pointer.


    # 10.2 What is a pointer?


    One of the things beginners in C find difficult is the concept of pointers. The
    purpose of this tutorial is to provide an introduction to pointers and their use
    to these beginners. I have found that often the main reason पड़ेगा have a problem
    with pointers is that they have a weak or minimal feeling for variables,(as they
    are used in C). Thus we start with a discussion of C variables in general.


    Pointer declaration:


    A pointer is a variable that contains the memory location of another variable.
    The syntax is as shown below. You start by specifying the type of data stored
    in the location identified by the pointer. The asterisk tells the compiler that
    you are creating a pointer variable. Finally you give the name of the variable.


    | type * variable name |


    Example:


    | int *ptr;

    | float *string; |


    # 10.2.1 Address operator


    Once we declare a pointer variable we must point it to something we can do this
    by assigning to the pointer the address of the variable you want to point as in
    the following example:


    | ptr=&num; |


    This places the address where num is stores in the variable ptr. If num is stored
    in memory 21260 address then the variable ptr has the value 21260.


    / A Program to illustrate pointer declaration*/'
