    # 8.1 What is a Function?


    A function is a complete and independent program which is used (or invoked) by
    the main program or other subprograms. A subprogram receives values called arguments
    from a calling program, performs calculations and returns the results to the calling
    program.

    There are many advantages in using functions in a program they are:


    +   (1) It facilitates top down modular programming. In this programming style,
    the high level logic of the overall problem is solved first while the details
    of each lower level functions is addressed later.'
