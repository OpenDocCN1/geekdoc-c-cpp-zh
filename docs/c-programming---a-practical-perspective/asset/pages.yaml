  md: 'C'' Programming – A Practical Perspective


    # 2.2 C Is Usually First


    The programming C was originally developed by Dennis Ritchie of Bell Laboratories
    and was designed to run on a PDP-11 with a UNIX operating system. Although it
    was originally intended to run under UNIX, there has been a great interest in
    running it under the MS-DOS operating system on the IBM PC and compatibles. It
    is an excellent language for this environment because of the simplicity of expression,
    the compactness of the code, and the wide range of flexibility. Also, due to the
    simplicity and ease of writing a C compiler, it is the first high level language
    available on any new computer, including microcomputers, minicomputers, and mainframes.
    C is not the beginning language but is somewhat cryptic in nature. It allows a
    wide range of operations from high level to a very low level, approaching the
    level of assembly. There seems to be no limit to the flexibility available. One
    experienced programmer made, "You can program anything in C", the statement is
    well supported by my own experience with the language. With the resulting freedom
    that you take on a great deal of responsibility it is very easy to write a program
    that destroys itself due to the little errors that C programmers call a data error.
    You are very much on your own as you will find. In order to successfully complete
    C programming I will begin with the most basic concepts of C and take you up to
    the highest level of C programming including the concepts of pointers, structures,
    dynamic allocation. Programming in C is tremendous in areas where you may want
    to use Assembly language but rather keep a "simple to write" and "easy to maintain"
    program. Even though the C language enjoys a good record with programs are transported
    from one implementation to another, there are differences in compilers that you
    will find anytime you try to use another compiler. Most of the differences become
    apparent when you use nonstandard extensions as calls to the DOS BIOS using MS-DOS,
    but even these differences can be minimized by careful choice of programming constructs.


    # 2.3 ANSI-C Standard


    When it became evident the C programming language was becoming a very popular
    language available on a wide range of computers, a group of concerned individuals
    met to propose a standard set of rules for the use of the C programming language.
    The group represented all sectors of the software industry and after many meetings,
    and many preliminary debates, they finally wrote an acceptable standard for the
    C language. It has been accepted by the American National Standards Institute
    (ANSI), and by the International Standards Organization (ISO). It is not refused
    upon any group or user, but since it is so widely accepted, it would be economic
    for any compiler writer to refuse to conform to the standard. C is often called
    a "Middle Level" programming language. This is not a reflection on its lack of
    power but more reflection on its capability to access the system''s low level
    functions. A middle level language, such as C, probably does not supply all the
    constructs found in high-languages - but it provides you with all the building
    blocks that you will need to produce the results you want!'
