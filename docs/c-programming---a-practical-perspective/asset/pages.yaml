  md: '# 5.2 Simple and Compound Statements


    A simple statement is a computation terminated by a semicolon. Variable definitions
    and semicolon-terminated expressions are examples:


    ```

    // declaration statement

    int i;

    double d = 10.5; // declaration statement

    ```


    The simplest statement is the null statement which consists of just a semicolon;
    // null statement. Multiple statements can be combined into a compound statement
    by enclosing them within braces. For example:


    ```

    {

    int mark1=45,mark2=67,avgMarks

    avgMarks=(mark1+mark2)/2

    }

    ```


    Compound statements are useful in two ways: (i) they allow to put multiple statements
    in places where otherwise only single statements are allowed, and (ii) they allow
    us to introduce a new scope in the program. A scope is part of the program text
    within which a variable remains defined. A compound statement may contain variable
    definitions and defines a scope for it. It is also called a block. The scope of
    a C variable is limited to the block immediately enclosing it. A program consists
    of a number of statements which are usually executed in sequence. Programs can
    be much more powerful if we control the order in which statements are run.


    # 5.2.1 Assignment: where values, the results of the calculations, are stored
    in variables.


    # 5.2.2 Control: the program makes a decision about what to do next. C provides
    two styles of flowcontrol:


    # Branching


    # Looping


    Branching is deciding what actions to take and looping is deciding how many times
    to take a certain action.


    # 5.3 The if else Statement


    This is used to decide whether to do something at a special point, or to decide
    between two courses of action. It takes an expression in parenthesis a statement
    or block of statements. if the expression is true then the statement or block
    statements gets executed otherwise these statements are skipped.'
