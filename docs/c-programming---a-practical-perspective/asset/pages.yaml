  md: '# 1.7 Pseudocode


    Flowcharts were the first design tool to be widely used, but unfortunately they
    do not well reflect some of the concepts of structured programming. Pseudocode,
    on the other hand, is a newer tool and has features that make it more reflective
    for the structured concepts. Unfortunately, the narrative presentation is not
    as easy to understand and follow.


    # 1.7.1 Rules for Pseudocode


    +   (1) Write only one statement per line

    (2) Each statement in your pseudocode should express just one action for the computer.
    If the task list is properly drawn, then in most cases each task will correspond
    to one line of pseudocode

    (3) Capitalize keywords

    (4) Indent to show hierarchy


    We will use a particular indentation pattern in each of the design structures

    **SEQUENCE**: keep statements that are "stacked" in sequence starting in the same
    column

    **SELECTION**: indent the statements that fall inside the selection structure,
    but not the keywords that form the selection

    **LOOPING**: indent the statements that fall inside the loop, but not the keywords
    that form the loop


    +   (5) End multitude structures

    (6) Keep statements language independent


    Resist the urge to write in whatever language you are most comfortable with. In
    the long run, you will save time! There may be special features available in the
    language you plan to eventually write the program; if you are SURE it will be
    written in that language, then you can use the features. If not, then avoid using
    the special features.


    **Selection:**


    The pseudocode for this would be:


    ```

    IF amount < 1000

    interestRate = 0.06

    ELSE

    interestRate = 0.10

    ENDIF

    ```


    **Looping:**


    The pseudocode for this would be:


    ```

    count = 0

    WHILE count < 10

    ```'
