  md: "# 6 C Programming – A Practical Perspective\n\n# 1.4.4. Terminate\n\nAfter\
    \ some minimum number of operations, algorithm must come to an end, i.e., the\
    \ total time to carry out all the steps in algorithm must be limited (finite).\n\
    \n# 1.4.5. Output\n\nAn algorithm is written to solve the problem therefore it\
    \ must produce one or more computed results. In order to incorporate the definiteness\
    \ property of the algorithm, algorithms will be expressed using a precise notation\
    \ called programming languages. Such computer programming languages are designed\
    \ to assign clarity, definiteness and effectiveness to each of the instructions\
    \ of the algorithm. The languages usually consist of all necessary features to\
    \ support the characteristics of an algorithm.\n\n# 1.5 Base Control Structures\
    \ in Algorithms\n\nUsually the algorithm consists of finite set of sequential\
    \ procedural steps. The algorithm may have conditions, which are used to take\
    \ decision, and depending upon decisions, a particular group of statements are\
    \ selected for execution. There are also situations in some of which the statements\
    \ have to be executed repeatedly. To meet above situations of problem solving,\
    \ algorithm uses 3 basic forms of control structures:\n\n+   1.5.1 Sequencing\n\
    1.5.2 Branching (selections)\n1.5.3 Repetitions (looping)\n\nThese are also called\
    \ as program structures used in developing structured programs.\n\n# 1.5.1 Sequencing\n\
    \nThe sequence structure indicates the sequential flow of program logic, i.e.,\
    \ by step step execution of program statements in the algorithm.\n\nFor example:\n\
    \n```\n(1) In algorithm:\nStep 1: [Input the three numbers]\n    Input n1, n2,\
    \ n3\nStep 2: [Multiply given numbers and store the result in another variable]\n\
    \    Mult ← n1*n2*n3\nStep 3: [Add all numbers and store the sum in another variable]\n\
    \    Sum ← n1+n2+n3\n```"
