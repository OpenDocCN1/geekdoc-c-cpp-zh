    The head of the loop consists of three parts separated by semicolons. The first
    is run before the loop is entered. This is usually the initialization of the loop
    variable. The second is a test, the loop is exited when this false returns. The
    third is a statement to be run every time the loop body is completed. This is
    usually an increment of the loop counter. However any of them can be blank. A
    blank first or last means no initialization or increment. A blank comparison statement
    will always be treated as true. This will cause the loop to run indefinitely unless
    interrupted by other means. This might be a return or a break statement. It is
    also possible to squeeze several statements into the first or third position,
    separating them with commas. This allows a loop with than one controlling variable.


    Example:


    | float array(float array[], int count) |

    | { float total = 0.0; int i; for(i = 0; i < count; i++) total += array[i]; return(total
    / count); } |


