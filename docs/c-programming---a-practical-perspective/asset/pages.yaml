  md: "# 11.3 Initializing Structure\n\nLike other data type we can initialize structure\
    \ when we declare them. As for initalization goes structure obeys the same set\
    \ of rules as arrays we initialize the fields of a structure by the following\
    \ structure declaration with a list containing values for weach fields as with\
    \ arrays values must be evaluate at compile time.\n\nExample:\n\n```\nStruct student\
    \ newstudent\n{\n  12345,\n  \"Sachin\"\\  \"bharati Vidyapeeth\";\n  \"Computer\"\
    \n  25;\n};\n```\n\nthis initializes the id , no field to 12345, the name field\
    \ to \"Sachin\", the address field to \"Bharati vidyapeeth\" the field combination\
    \ to \"Computer\" and the age field to 25.\n\n# 11.4 Functions and Structures\n\
    \nWe can pass structures as arguments to functions. Unlike array names however,\
    \ which always point to the start of the array, structure names are not pointers.\
    \ As a result, when we change structure parameter inside a function, we do not\
    \ effect its corresponding argument.\n\n# 11.4.1 Passing structure to elements\
    \ to functions\n\nA structure may be passed into a function as individual member\
    \ or a separate variable. A program example to display the contents of a structure\
    \ passing the individual elements to a function is shown below.\n\n```\n# include\
    \ <stdio.h >\nvoid main()\n{\n  int emp_id;\n  char name[25];\n  char department[10];\n\
    \  float salary;\n};\n```"
