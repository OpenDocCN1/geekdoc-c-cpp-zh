  md: '# strcmp function:


    In c cannot directly compare the value of 2 strings in a condition like if(string1==string2)

    Most libraries however contain the strcmp() function, which returns a zero if
    2 strings are equal, or a non zero number if the strings are not the same. The
    syntax of strcmp() is given below:


    ```

    strcmp(string1,string2)

    ```


    String1 &string2 may be string variables or string constants. String1, &string2
    may be string variables or string constants some computers return a negative if
    the string1 is alphabetically less than the second and a positive number if the
    string is greater than the second.


    Example:


    strcmp("Pune","Pune") will return zero because 2 strings are equal.

    strcmp("their","there") will return a 9 which is the numeric difference between
    ASCII ''i'' and ASCII ''r''.


    strcmp("the","the") will return 32 which is the numeric difference between ASCII
    "T" & ASCII "t".


    # strcmp() function


    This function is as strcmp() which compares 2 strings but not case sensitive.


    Example


    strcmp("THE","the") will return 0.


    # strcpy() function:


    C does not allow you to assign the characters to a string directly as in the statement
    name="Hmanant",


    Instead use the strcpy()0 function found in most compilers the syntax of the function
    is illustrated below.


    ```

    strcpy(string1,string2);

    ```


    strcpy function assigns the contents of string2 to string1. string2 may be a character
    array or a string constant.


    ```

    strcpy(name,"Sachin")

    ```


    In the above example Sachin is assigned to the string called name.


    # strlw() function:


    This function converts all characters in a string from uppercase to lowercase.
    syntax


    ```

    strlw(string);

    ```


    For example:


    strlw("KADAM") converts to kadam.'
