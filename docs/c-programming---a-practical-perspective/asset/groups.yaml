    \ for four integer variables. You may also see that we saw 0 in the last space\
    \ of the array. This is a common technique used by C programmers to signify the\
    \ end of an array. Arrays have the following syntax, using square brackets to\
    \ access each indexed value (called an element). Each element of the set can then\
    \ be referenced by a number called as index number or subscript.\n\n```c\n#include\
    \ <stdio.h>\nmain() {\n    char word[20];\n    word[0] = 'H';\n    word[1] = 'e';\n\
    \    word[2] = 't';\n    word[3] = 'i';\n    word[4] = 'o';\n    word[5] = 0;\n\
    \    printf(\"The contents of word[] is ->%s\\n\", word );\n}\n```\n\nSample Program\
    \ Output\n\n| The contents of word[] is Hello |\n| :--- |\n\n## 9.2 Declaration\
    \ of Arrays\n\nLike any variable, arrays must be declared before they are used.\
    \ The general form of declaration is:\n`type name[size];`\n\nThe type specifies\
    \ the type of elements that will be contained in the array, such as int or float,\
    \ and the size indicates the maximum number of elements that can be stored inside\
    \ the array. For example:\n`float height[50];` Declares height to be an array\
    \ containing 50 elements. Any subscripts 0 to 49 are valid. In C the array elements\
    \ index begins with zero. So `height[0]` refers to the first element of the array.\
    \ Individual array element can be used anywhere with a normal variable with a\
    \ statement such as:\n`g = height[i];` assigns the value stored in the ithth index\
    \ of the array to the variable g. If `i` is declared to be an integer variable,\
    \ then the statement `g=height[i];` will take the value contained in the ith element\
    \ of the array. If `i` were equal to 7 when the above statement is executed, then\
    \ the value `height[7]` would get assigned to g by specifying the array element\
    \ on the left hand side.\n\nBy evaluating the expression (low+high). If `low`\
    \ is equal to 1 and `high` were equal to 9, then the value `data[5]` would be\
    \ assigned to the next_value indexed by the expression. If `low` were equal to\
    \ 1 and `high` equal to 10, then the value `data[5]` would also be referenced.\n\
    \nThe ability to represent a collection of related data by a single array enables\
    \ us to develop concise and efficient programs. For example we can easily sequence\
    \ through the elements in the array by varying the value of the variable that\
    \ is used as a subscript into the array. So a loop:\n```c\nfor(i=0; i<100; i++)\n\
    \    sum = sum + grades[i];\n```\nsequences through the first 100 elements of\
    \ the array (elements 0 to 99) and will add the value of each grade into sum.\
    \ When the loop is finished, the variable sum will contain the total of first\
    \ 100 values of grades array. In addition to integer constants, integer expressions\
    \ can also be inside the brackets to reference a particular element of the array.\n\
    \nJust as variables must be declared before they are used, the declaration of\
    \ an array involves specifying the type of element that will be contained in the\
    \ array and the maximum number of elements that will be stored inside the array.\
    \ The system needs this information to determine how much memory space to reserve\
    \ for the particular array. The declaration `int values[10];` would reserve enough\
    \ space for an array called values that could hold up to 10 integers. Refer to\
    \ the below picture to conceptualize:\n\n![](img/42571661744bb1de166abc45190753_120_0.png)\n\
    \n| |\n| :--- |\n| values[0] |\n| values[1] |\n| values[2] |\n| values[3] |\n\
    | values[4] |\n| values[5] |\n| values[6] |\n| values[7] |\n| values[8] |\n| values[9]\
    \ |\n\nThe array values stored in the memory.\n\n### 9.2.1 Some Variations In\
