  mdcn: "\n\n# 28 C语言编程 – 实用视角\n\n## 3.6 数据类型\n\nC 语言的数据类型可以大致分类为：\n- 基本数据类型\n- 派生数据类型\n\
    - 用户定义数据类型\n\n### 3.6.1 基本数据类型\n\n所有 C 编译器都接受以下基础数据类型\n\n| (1) | 整数 | Int |\n\
    |---|---|---|\n| (2) | 字符 | char |\n| (3) | 浮点数 | float |\n| (4) | 双精度浮点数 | double\
    \ |\n| (5) | 空 | void |\n\n下表给出了每个数据类型的大小和范围\n\n| 数据类型 | 取值范围 |\n|---|---|\n|\
    \ char | -128 to 127 |\n| Int | -32768 to +32767 |\n| float | 3.4 e-38 to 3.4\
    \ e+38 |\n| double | 1.7 e-308 to 1.7 e+308 |\n\n#### 3.6.1.1 整数型：\n整数是具有机器相关范围的数字。一种良好的编程语言应该通过提供对数字范围和存储空间的控制来支持程序员。C\
    \ 有 3 类整数存储类型，即 `short int`、`int` 和 `long int`。所有这些数据类型都有有符号和无符号的形式。`short int`\
    \ 需要的空间是普通整数值的一半。无符号数始终为正数，并占用所有位来表示数值。`long` 和无符号整数用于声明更大范围的数值。\n\n浮点数表示具有 6\
    \ 位精度的实数。浮点数用关键字 `float` 表示。当浮点数的精度不足时，我们可以使用 `double` 来定义该数字。`double` 与 `float`\
    \ 相同，但精度更高。为了进一步扩展精度，我们可以使用 `long double`，它占用 80 位的内存空间。\n\n#### 3.6.1.3 Void\
    \ 类型：\n使用 `void` 数据类型，我们可以指定函数的类型。避免使用不向调用函数返回任何值的函数是一种良好的做法。\n\n#### 3.6.1.4\
    \ 字符型：\n\n单个字符可以定义为字符类型的数据。字符通常存储在 8 位的内部存储中。可以将 `signed` 或 `unsigned` 饰符显式应用于\
    \ `char`。无符号字符的值在 0 到 255 之间，而有符号字符的值从 -128 到 127。\n\n16 位机器上数据类型的大小和范围。\n\n|\
    \ 类型 | 大小（位） | 范围 |\n|---|---|---|\n| Char or Signed Char | 8 | -128 to 127 |\n\
    | Unsigned Char | 8 | 0 to 255 |\n| Int or Signed int | 16 | -32768 to 32767 |\n\
    | Unsigned int | 16 | 0 to 65535 |\n| Short int or Signed int | 8 | -128 to 127\
    \ |\n| Unsigned short | 8 | 0 to 255 |\n| Long int or signed long int | 32 | -2147483648\
    \ to 2147483647 |\n| Unsigned long int | 32 | 0 to 4294967295 |\n| Float | 32\
    \ | 3.4 e-38 to 3.4 e+38 |\n| Double | 64 | 1.7e-308 to 1.7 e+308 |\n| Long Double\
    \ | 80 | 3.4 e-4932 to 3.4 e+4932 |\n\n## 3.7 变量声明\n\n程序中使用的每个变量都应该向编译器声明。声明宣告了两个内容：\n\
    \n- (1) 告诉变量名。\n- (2) 指定变量将持有的数据类型。\n\n声明的通用格式为：\n`datatype var1, var2, var3;`\n\
    \n其中 var1, var2, var3 是变量名。变量之间用逗号隔开。声明语句以分号结束。\n\n示例：\n\n```c\nint sum;\nint\
    \ number, salary;\ndouble average, mean;\n```\n\n| 数据类型 | 等效关键字 |\n| --- | ---\
    \ |\n| 字符 | char |\n| 无符号字符 | unsigned char |\n| 有符号字符 | signed char |\n| 有符号整数\
    \ | signed int (or) int |\n| 有符号短整数 | signed short (or) short |\n| 有符号长整数 | signed\
    \ long (or) long |\n| 无符号整数 | unsigned int (or) unsigned |\n| 无符号短整数 | unsigned\
    \ short (or) unsigned |\n| 无符号长整数 | unsigned long (or) unsigned long |\n| 浮点数\
