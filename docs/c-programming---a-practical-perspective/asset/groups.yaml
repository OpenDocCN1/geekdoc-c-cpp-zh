    # 关于本书


    多年来，我们对 C 语言一直处于爱恨交织的感情。我们热爱编写 C 程序的便利性。我们热爱当今 C 编译器构建的开发环境。但我们厌恨那种犯错的容易。我们厌恨
    C 编程通常对细节的极致关注。最重要的是，我们厌恨许多程序员设计其他语言的方式。事实是：C 是终极编程语言（也没有其他语言如此）。然而，这是一门每位软件开发者都应该熟悉的语言。无论好坏，它已成为计算机世界的*通用语言*（lingua
    franca）。本书试图让这门通用语言更贴近我们这些计算机专业人士。


    前一本书《C语言编程》曾作为某门课程的主教材。具有高级语言的编程经验会有帮助，但对于精通计算机的读者来说并非必须。由于本书内容自成体系，既可以用于参考也可以用于学习，因此对于学习数据结构、编译器设计、操作系统、计算机图形或其他使用
    C 作为编程语言的课程的学生来说，它是极佳的伙伴。由于书中包含了大量的程序、练习题和实践，对于自学 C 语言的读者也会有用。


    # 本书涵盖的主题


    - 算法流程图

    - C 历史

    - 标记符 关键字

    - 变量 静态 类

    - 数据类型

    - 运算符 结合 关联

    - 隐式类型 版本推断

    - 显式转换

    - 控制语句

    - 标准复合运算符 循环

    - 预处理器指令 宏

    - 字符串 输入输出说明符

    - 函数调用类型 递归

    - 数组 多维数组

    - 指针 地址指针表达式

    - 算术指针与函数

    - 动态内存分配

    - 结构体 联合体

    - 文件管理

    - 输入输出

    - 命令行


    # 关于作者


    Sakshi Kadam 博士是一位工程毕业生。他从服务工程师开始职业生涯，加入 MCA（计算机应用硕士）和 IT 行业担任研究员。他通过嵌入式系统高级文凭（PGDES）专注于嵌入式系统。随后他进入学术界追求研究兴趣。他在计算机应用领域完成了博士研究。他发明了一种名为
    C（概念建模语言）的新型计算机语言，专为教育设计。在学术界，他也紧密参与业界，参加针对行业专业人士的国家研讨会和工作坊，并作为大学教师教授从嵌入式系统到超级计算机的各种主题。他在全印度范围内承担咨询和教学任务。他是领先计算机杂志和出版物的定期投稿作者。目前，他在
    Sinhgad 计算机应用学院（SITCA）担任院长。


