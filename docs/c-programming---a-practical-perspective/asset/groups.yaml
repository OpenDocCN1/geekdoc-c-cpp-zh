    \ | X%Y=2 | 不适用\n\n### 4.1.1.1 混合算术\n\n当一个操作数是实数另一个是整数，且对两个操作数进行算术运算时，这被称为混合算术。如果其中一个是实数类型，则结果将始终是\
    \ 15/10.0 = 1.5。\n\n## 4.1.2 关系运算符\n\n通常需要比较操作数之间的关系并做出决策，据此编写程序。这时关系运算符就会介入，求值结果总是\
    \ TRUE（真）或 FALSE（假）。C 语言支持以下关系运算符：\n\n下表显示了关系运算符：\n\n| 运算符 | 含义 | 示例 exp1=5 和\
    \ exp2=3 exp1 关系运算符 exp2 |\n| :--- | :--- | :--- |\n| < | 小于 | exp1 < exp2 ........FALSE\
    \ |\n| <= | 小于等于 | exp1 <= exp2 ........FALSE |\n| > | 大于 | exp1 > exp2 ........TRUE\
    \ |\n| >= | 大于等于 | exp1 >= exp2......TRUE |\n| == | 等于 | exp1 == exp2 ........FALSE\
    \ |\n| != | 不等于 | exp1 != exp2 ........TRUE |\n\n## 4.1.3 逻辑运算符\n\nC 具有以下逻辑运算符，它们用于比较或评估逻辑和关系表达式：\n\
    \n| 运算符 | 含义 |\n| :--- | :--- |\n| && | 逻辑与 (AND) |\n| || | 逻辑或 (OR) |\n\n逻辑与\
    \ (&&)\n该运算符用于同时评估带有关系运算符的两个条件或表达式。如果逻辑运算符左右侧的表达式都为真，则整个复合表达式为真。\n\n示例：\na > b\
    \ && x == 10\n左侧表达式为 a > b，右侧为 x == 10。只有当两个表达式都为真时，整个表达式才为真，即 a 大于 b 且 x 等于 10。\n\
    \n逻辑或 (||)\n逻辑或用于组合两个表达式，如果两个表达式中的任意一个为真，则条件求结果为真。\n\n示例：\na > m || a < n\n如果其中任一为真或两者都为真，表达式求结果为真。如果\
    \ a 等于 m 或 n，或者当 a 同时小于 m 和 n 时，表达式求结果为真。\n\n逻辑非 (!)\n逻辑非运算符接收单个表达式，如果表达式为假则求结果为真，如果表达式为真则求结果为假。换句话说，它只是反转表达式的值。\n\
    \n示例：\n! (x >= y)\n当 x 的值不大于也不等于 y 时，非表达式求值为真。\n\n## 4.1.4 赋值运算符\n\n| 赋值运算符 |\
    \ 简单赋值语句 | 简写运算符语句 |\n| :--- | :--- | :--- |\n| += | a = a + 1 | a += 1 |\n| -=\
    \ | a = a - 1 | a -= 1 |\n| *= | a = a * (n+1) | a *= (n+1) |\n| /= | a = a /\
    \ (n+1) | a /= (n+1) |\n| %= | a = a % b | a %= b |\n\n## 4.1.5 递增和递减运算符\n\n递增递减运算符是\
    \ C 语言中非常有用的一元运算符，广泛用于 for 和 while 循环。运算符的语法如下：\n\n| 递增递减运算符 | 前符号 | 后置符号 |\n\
    | :--- | :--- | :--- |\n| ++ | ++X | X++ |\n| -- | --Y | Y-- |\n\n递增运算符将操作数的值加\
    \ 1，递减运算符从操作数的值中减 1。++X 和 X++ 在独立语句中含义相同；但在赋值语句的右侧使用时行为不同。\n\n## 4.1.6 条件运算符\n\
    \n条件运算符由两个符号组成：问号 (?) 和冒号 (:)。三元运算符的语法如下：\n\n```\nexp1 ? exp2 : exp3\n```\n\n\
    三元运算符的工作原理如下：如果 exp1 为真，则求值 exp2 并其值作为表达式的结果；如果 exp1 为假，则求值 exp3 并其值作为表达式的结果。注意，只有一个表达式会被求值。\n\
    \n示例：\n```\na = 10;\nb = 15;\nx = (a > b) ? a : b;\n```\n赋值给 x。\n\n## 4.1.7 位运算运算符\n\
    \nC 语言支持用于位级操作的特殊运算符，称为位运算符。位运算符作用于数据的每一位。这些运算符用于测试、取反或向右或向左移位。位运算符可能不适用于 float\
    \ 或 double 类型。\n\n| 运算符 | 含义 |\n| :--- | :--- |\n| & | 位与 |\n| \\| | 位或 |\n| ^\
    \ | 位异或 |\n| << | 左移 |\n| >> | 右移 |\n\n## 4.1.8 特殊运算符\n\nC 支持一些感兴趣的特殊运算符，如逗号运算符、size\
    \ 运算符、指针运算符 (&) 和成员选择运算符 (.)。\n\n## 4.1.9 逗号运算符\n\n逗号运算符可以将相关的表达式连接在一起。逗号连接的表达式列表从左到右求值，最后一个表达式的值作为结果。由于逗号在运算符中优先级最低，因此括号是必要的。逗号运算符的一些示例如下：\n\
    \n在 for 中：\nfor(n=0, m=10; n<m; n++)\n\n在 while 循环中：\nwhile (c=getchar(), x=x,\
    \ y=t)\n\n## size 运算符\n\nsize 运算符给出数据类型或变量占据内存的字节数。通常用于程序员未知的数组和结构体的长度。它还用于程序执行期间为变量动态分配内存。\n\
    \n示例：\nm = sizeof(sum);\n\n## 算术表达式\n\n表达式是根据 C 语言语法编写变量和常数的组合。在 C 中，每个表达式产生一个特定类型的值，可以赋值给变量。下表显示了一些\
    \ C 表达式示例：\n\n| 代数表达式 | C 表达式 |\n| :--- | :--- |\n| a - b | a - b |\n| (m + n)\
    \ | (x + y) |\n| (ab / c) | a * b / c |\n| 3x²+x+1 | 3*x*x+1 |\n| (x /y) + c |\
    \ x / y + c |\n\n## 表达式的求值\n\n表达式使用赋值语句进行求值：Variable = expression。Variable 是任何有效的变量名。当遇到该语句时，先对表达式求值，并替换左侧变量的值。在尝试求值之前，表达式中使用的所有变量必须赋值。\n\
    \n求值语句示例：\n```\nx = a * b - c\ny = b / c * a\nz = a - b / c + d;\n```\n\n## 4.2.3\
    \ 算术运算符的优先级\n\n没有括号的算术表达式将根据运算符优先级规则从左到右求值。C 中算术运算符有两个不同的优先级级别：\n\n高优先级：* / %\n\
    低优先级：+ -\n\n## 4.2.4 表达式求值规则\n\n首先求值从左到右解析子表达式。如果括号嵌套，求值从最内层的子表达式开始。优先级规则用于确定评估子表达式时运算符的顺序。当子表达式出现两个或多个相同优先级的运算符时，适用结合律。算术表达式根据优先级规则从左到右求值。使用括号时，括号内的表达式优先级最高。\n\
    \n## 4.3 隐式类型转换\n\nC 在表达式中混合不同类型的内容和变量。 C 自动将任何中间值转换为适当类型，以便评估时不丢失任何显著性。这种自动类型转换被称为隐式类型转换。规则在评估表达式时适用：所有的\
    \ short 和 char 自动转换为 int。\n\n(1) 如果一个操作数是 double，另一个将转换为 double 结果为 long double。\n\
    (2) 如果一个操作数是 double，另一个将转换为 double 结果为 double。\n(3) 如果一个操作数是 float，另一个将转换为 float\
    \ 结果为 float。\n(4) 如果一个操作数是 unsigned int，另一个将转换为 unsigned long int 结果为 unsigned\
    \ long int。\n(5) 如果一个操作数是 long int 而另一个是 unsigned int：\n  (a) 如果 unsigned int\
    \ 可以转换为 long int，则 unsigned int 操作数将相应转换，结果为 long int。\n  (b) 两个操作数都转换为 unsigned\
    \ long int，结果为 unsigned long int。\n(6) 如果一个操作数是 long int，另一个将转换为 long int 结果为\
    \ long int。\n(7) 如果一个操作数是 unsigned int，另一个将转换为 unsigned int 结果为 unsigned int。\n\
    \n"
