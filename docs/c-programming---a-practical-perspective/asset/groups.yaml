    # 3.4.3 Declaring Variable as Constant


    The values of some variable may be required to remain constant through-out the
    program. We can do this by using the qualifier at the time of initialization.


    Example: const int class_size = 40;


    The const data type qualifies the compiler that the value of the int variable
    class_size may not be modified in the program.


    # 3.4.4 Naming Constants and Variables


    There are several rules that you must follow when naming constants and variables:


    | Names... | Example |

    | Should not start with a number | 2i |

    | Should not be a C keyword | struct |

    | Should not contain any arithmetic operators... | r*s+t |

    | Should not contain any other punctuation marks... | #@x%£!a |

    | Should not contain a space | im stupid |

    | CAN be of mixed cases | XSquared |

    | CAN contain a number elsewhere | h2o |

    | CAN contain or begin with an underscore | _height_ |


    # 3.5 Storage Class


    Variables in C have not only the data type but also storage class that provides
    information about their location and visibility. The storage class divides the
    portion of the program within which the variables are recognized.


    +   **3.5.1 auto**: It is a local variable known to the function in which it is
    declared. Auto is the default storage class.


    +   **3.5.2 static**: Local variable which exists and retains its value even after
    the control is transferred to the calling function.


    +   **3.4.3 extern**: Global variable known to all functions in the file


    +   **3.4.4 register**: Social variables which are stored in the register.


    [Storage classes are discussed more in detail in chapter]'
