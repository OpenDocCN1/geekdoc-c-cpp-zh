    \ `realloc` 函数更改已分配的内存大小。这个过程被称为内存重新分配。内存重新分配的通用语句为：\n\n```\nPtr=realloc(ptr,newsize);\n\
    ```\n\n该函数为指针变量 `ptr` 分配大小为 `newsize` 的新内存空间，并返回指向内存块第一个字节的指针。新分配的块可能在同一区域，也可能不在。\n\
