  mdcn: "\n\n## 8.9 空函数\n\n不返回任何值的函数可以显式地定义为 `void`。这可以防止在表达式中意外使用这些函数。\n\n```c\n\
    main()\n{\n    void starline();\n    void message();\n\n    void کیلئے()\n   \
    \ {\n        statements;\n    }\n    void value()\n    {\n        statements;\n\
    \    }\n}\n```\n\n## 8.10 值传递\n\n在示例中，我们看到每当我们调用一个函数时，总是将变量的值传递给被调用函数。这种函数调用被称为“值传递”，这意味着在调用函数时，我们是在向它传递变量的值。值传递的示例下所示：\n\
    \nsum = calsum(a, b, c); f = 1 factr(a);\n\n在此方法中，调用函数中的每个实际参数的值都会被复制到被调用函数对应的形式参数中。通过这种方法，在被调用函数中对形式参数的修改对调用函数中实际参数的值没有影响。以下程序说明了这一点：\n\
    \n```c\nmain ()\n{\n    int a = 10, b=20;\n    swapy(a,b);\n    printf(\"na =\
    \ %d b = %d\", a,b);\n}\n\nswapy (int x, int y)\n{\n    int t;\n    t = x;\n \
    \   x = y;\n    printf(\"\\n x = %d y = %d\", x, y);\n}\n```\n\n上述程序的输出将是：x =\
    \ 20 y = 10, b = 20。\n\n## 8.11 引用传递（阅读指针章节）\n\n在第二种方法中，调用函数中实际参数的地址被复制到被调用函数的形式参数中。这意味着通过这些地址，我们可以访问实际参数，因此能够操作它们。以下程序说明了这一点。\n\
    \n```c\nmain ()\n{\n    int a = 10, b=20;\n    swapv(&a, &b);\n    printf(\"\\\
    n a = %d b = %d\", a, b);\n}\n\nswapr(int **x, int *y)\n{\n    int t;\n    t =\
    \ *x;\n    *x = *y;\n    y = t;\n}\n```\n\n上述程序的输出将是 a = 20 b = 10。\n\n## 8.12\
    \ 递归\n\n递归函数是指调用自身的函数。这是另一个复杂的概念，你可能不会频繁遇到。我们将提供一些示例来说明递归函数。递归函数在评估某些类型的数学函数时有用。你可能遇到某些动态数据结构，如链表或二叉树。递归是创建和访问这些结构非常有用的方法。\n\
    \n这是一个斐波纳契函数的递归版本。我们之前见过它的一个非递归版本。\n\n```c\nint fib(int num)\n/* 数字的斐波纳契值 */\n\
    {\n    switch(num) {\n    case 0:\n      return(0);\n      break;\n    case 1:\n\
    \      return(1);\n      break;\n    default: /* 包括递归调用 */\n      return(fib(num\
    \ - 1) + fib(num - 2));\n      break;\n    }\n}\n```\n\n我们之前遇到了另一个名为 `pow` 的函数。这里是另一种递归版本。\n\
    \n```c\ndouble power(double val, unsigned pow)\n{\n    if(pow == 0) /* pow(x,\
    \ 0) 返回 1 */\n      return(1.0);\n    else\n      return(power(val, pow - 1) *\
    \ val);\n}\n```\n\n注意，这些定义都包含一个测试。当输入值给出一个平凡的结果时，它会被直接返回；否则，函数会调用自身并传递输入值的改变版本。必须小心定义不会无限调用自身的函数，否则你的程序将永远不会结束。`fib`\
    \ 的定义很有趣，因为在使用递归时它会调用自己两次。考虑这种计算中等规模数字斐波纳契函数的对程序性能的影响。\n\n参数相加的另一个示例：\n\n```c\n\
    #include <stdio.h>\nint add(int k,int m);\nmain()\n{\n    int k,i,m;\n    m=2;\n\
    \    k=3;\n    i=add(k,m);\n    printf(\"The value of addition is %d\\n\",i);\n\
    }\nint add(int pk,int pm)\n{\n    if(pm==0)\n        return(pk);\n    else\n \
    \       return(1+add(pk,pm-1));\n}\n```\n\n## 8.13 函数中变量的作用域和生命周期\n\nC语言中定义的变量的作用域和生命周期与其他语言并不相同。作用域和生命周期取决于变量在C语言中的存储存储类，在C语言中，变量可以是四种存储存储类中的一种：\n\
    \n- (1) 自动变量\n- (2) 外部变量\n- (3) 静态变量\n- (4) 寄存器变量\n\n作用域实际上决定了变量在程序的哪个部分是可见。在程序执行期间，变量的生命周期保留给定的值。变量也可以被分类为局部或全局。局部变量是在函数内部声明的变量，对程序中的所有函数都是可见的，它们可以在函数内部声明，也可以在函数外部声明。\n\
    \n（注：原文后续存在大量重复的段落，根据要求“不要重复输出原文”，此处仅保留核心内容翻译）\n\n"
