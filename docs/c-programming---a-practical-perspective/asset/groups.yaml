    # PREFACE


    This book is designed for C beginners. Previous programming experience in a high-level
    language is helpful, but not necessary for a computer-literate reader. Since the
    book is contained as well as learning, it makes an excellent companion text for
    a course in data structures, compiler design, operating systems, computer graphics,
    or other courses that use C as programming language. Due to its collection of
    programs, exercises and emphasis on practical problems, the book will also appeal
    to readers who are enrolled in a training class or who are learning C by self-study.


    This book has been designed with the following goals in mind;


    +   * Be clear, readable and entertaining

    * Be accessible to a broad range of readers

    * Be authoritative without being pedantic

    * Be organized for easy teaching and learning

    * Emphasize style

    * Avoid dependence on a particular machine, compiler or operating system

    * Use illustrations to clarify concepts


    While making sure to achieve the mentioned goals, we have also incorporated certain
    features in the book which will make the readers appreciate:


    +   * Illustrated programs: Choosing illustrative programs is not an easy job.
    If programs are too brief and artificial, readers will not get any sense of how
    the features are used in the real world. On the other hand, if a program is realistic,
    it can be lost in a forest of details. We have chosen a middle course, using small,
    simple examples to make concepts clear when they are first introduced, gradually
    building up the complexity

    * Exercises: Each chapter ends with a set of questions related to material covered
    in the chapter. Topics addressed in these sections include Frequently Asked Questions
    (FAQs).


