    #  10.9 Memory Allocations Process


    According to the conceptual view the program instructions and global static variable
    in a permanent storage area and local variables are stored in stacks. The memory
    space is located between these two regions is available for dynamic allocation
    during the execution of the program. The free memory region is called the heap.
    The size of heap keeps changing when program is executed due to creation and death
    of variables that are local for functions and blocks. It is possible to encounter
    memory overflow during dynamic allocation process. In such situations, the memory
    allocation functions mentioned above will return a null pointer.


    # 10.9.1 Allocating a block of memory


    A block memory may be allocated using the function malloc. The malloc function
    reserves a block of memory of specified size and returns a pointer of type void.
    This means that we can assign it to any type of pointer. It takes the following
    form:


    ```

    ptr= (cast-type\*) malloc(byte-size);

    ```


    ptr is a pointer of type cast-type the malloc returns a pointer (of cast type)
    to an area of memory with size byte-size.


    Example:


    ```

    x=(int\*) malloc(100*sizeof(int));

    ```


    On successful execution of this statement memory equivalent to 100 times the area
    of int is reserved and the address of the first byte of memory allocated is assigned
    to the pointer x of type int


    # 10.9.2 Allocating multiple blocks of memory


    Calloc is another memory allocation function that is normally used to request
    multiple blocks of each storage of the same size and sets all bytes to zero.


    The general form of calloc is:


    ```

    ptr=(cast-type\*) calloc(n, elem-size);

    ```'
