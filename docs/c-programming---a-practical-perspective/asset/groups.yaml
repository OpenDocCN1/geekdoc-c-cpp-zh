    # C 语言简介


    目标

    本章旨在向你介绍 C 编程语言的概述、如何编辑、链接和运行你的 C 程序、C 字符集以及 C 程序的通用结构。


    ## 2.1 C 语言的简史


    C 是一种通用语言，它与它开发的 UNIX 操作系统密切相关——该系统就是用 C 语言开发的。C 的许多重要思想源于 Martin Richards 开发的
    BCPL 语言。BCPL 对 C 的影响通过 B 语言间接传递，B 语言是 Ken Thompson 于 1970 年在贝尔实验室编写的，用于 DEC PDP-7
    上的第一个 UNIX 系统。BCPL 和 B 都是“无类型”语言，而 C 提供了多种数据类型。在贝尔实验室，人们编写了 C 语言，1978 年，Kernighan
    & Ritchie 出版的《C 语言程序设计》引发了计算世界的革命。1983 年，美国国家标准协会（ANSI）成立了一个委员会，为 C 语言提供一个现代、全面的定义。由此产生的定义——即
    ANSI 标准（或“ANSI C”）于 1988 年底完成。对于对此感兴趣的读者，可以在网上查阅《编程语言指南》。


    C 编程 – 实用视角


    ## 2.2 C 语言通常是首选


    C 语言最初由贝尔实验室的 Dennis Ritchie 开发，设计用于在带有 UNIX 操作系统的 PDP-11 上运行。尽管最初设计是为了在 UNIX
    下运行，但人们对 IBM PC 及其兼容机的 MS-DOS 操作系统上运行它产生了极大兴趣。由于表达式的简单性、代码的紧凑性以及广泛的灵活性，它是该环境的极佳语言。此外，由于
    C 编译器的编写简单易用，它是任何新计算机（包括微型计算机、小型计算机和大型机）上提供的第一种高级语言。C 语言并不是初学者入门语言，但其本质上有些晦涩。它允许从高层到极低层的各种操作，接近汇编层级。这种可用的灵活性似乎没有限制。一位经验丰富的程序员曾说：“你可以用
    C 语言编写任何东西”，这句话我通过自己的编程语言经验得到了充分证实。由于你所获得的巨大自由，你必须承担巨大的责任，因此编写一个由于 C 程序员所谓的“数据错误”的微小错误而导致自毁的程序是非常容易的。你会发现，你完全是孤军奋战的。为了成功完成
    C 编程，我将从 C 语言最基础的概念开始，带你进入 C 编程的最高水平，包括指针、结构、动态分配等概念。在可能希望使用汇编语言但又想保持程序“易编写”且“易维护”的领域，用
    C 语言编程意义重大。尽管 C 语言在程序从一个实现迁移到另一个实现的记录良好，但每当你尝试使用另一个编译器时，都会发现编译器之间存在差异。大多数差异在你使用
    MS-DOS 调用 DOS BIOS 的非标准扩展时会变得明显，但即使是这些差异也可以通过仔细选择编程结构来降至最低。


    ## 2.3 ANSI-C 标准


    当 C 编程语言显然成为一种在各种计算机上都非常流行的语言时，一群关注此问题的个人聚在一起，提议为 C 语言的使用制定一套标准规则。该小组代表了软件行业的所有部门，经过多次会议和许多初步辩论，他们最终为
    C 语言编写了一份可以接受的标准。该标准已被美国国家标准协会（ANSI）和国际标准组织（ISO）接受。它并不拒绝任何团体或用户，但由于它被如此广泛接受，对于任何编译器编写者来说，拒绝符合标准将是不合效益的。C
    语言通常被称为“中级”编程语言。这并不是反映它缺乏力量，而是反映了它访问系统低级函数的能力。中级语言（如 C）可能没有提供高级语言中找到的所有结构——但它为你提供了产生所需结果的所有构建构建块！


    ## 2.4 为什么要用 C？


    C 语言已成功用于可以想象的每种编程问题，从操作系统到电子表格再到专家系统——从 Apple Macintosh 到超级计算机，各种性能的机器都有高效的编译器可用。C
    语言成功的最大衡量标准似乎在于纯实用的考量上，例如：


    - 编译器的移植性

    - 标准库概念

    - 强大且多样的运算符全集

    - 优雅的语法

    - 需要时可以直接访问硬件


    ## 2.5 C 语言的使用


    C 语言最初用于系统开发工作，特别是组成操作系统的程序。C 语言使用的示例可能包括：


    - 操作系统

    - 语言编译器

    - 汇编器

    - 文本编辑器

    - 打印后台程序

    - 网络驱动程序

    - 工具程序


    近年来，C 语言因其深受程序员欢迎而被用作通用语言。如果你不是将 C 作为你的第一门编程语言，你将从中受益。


    ## 2.6 个人电脑上的 C 语言


    关于个人电脑，Microsoft C 是最常用的系统，而 Borland''s C 被认为是个人电脑最强大且高效的编译器。


    运行 C 程序


    本节主要针对没有或很少使用编译语言经验的初。


    编辑-编译-链接-执行过程


    在编译语言中开发程序至少需要四个步骤：

    1. 编写程序

    2. 编译

    3. 链接

    4. 执行


    我们将分别介绍每个步骤。


    # 编辑


    你使用人类理解的单词和符号编写计算机程序。你直接在屏幕窗口输入程序并将结果保存为单独的文件。这通常被称为源代码。C 程序的文本存储在扩展名为 .c 的文件中。


    # 编译


    你无法直接执行源代码。为了在任何计算机系统上运行，必须将其转换为计算机处理单元理解的二进制数字。这个过程产生一个中间对象文件。


    # 链接


    许多编译语言可以使用添加到程序中的库。这些程序由编译器制造商编写以执行各种任务，从输入输出到复杂的数学函数。在 C 语言的情况下，标准输入输出包含在一个库
    (stdio.h) 中。因此，即使是最基本的程序也需要库函数。链接后的扩展名为 .exe。


    # 可执行文件


    因此，文本编辑器产生源代码，编译器产生 .obj 对象文件，链接器产生 .exe 可执行文件。你可以像运行其他应用程序一样运行 .exe 文件，只需在 DOS
    提示符输入它们的名称或使用窗口菜单即可。


    # 使用 Microsoft C


    编辑阶段：


    使用 Microsoft Windows 编辑包之一输入程序。


    # 编译链接：


    从 Make 菜单中选择 Building。Building 选项允许你在同一个选项中完成编译和链接。


    # 执行：


    使用 Run 菜单并选择 Go 选项。


    # 错误：


    第一个错误。如果适用，使用 Search 菜单中的 Next Error 查看错误。如果你收到错误消息，或者在最后运行时发现程序无法运行，你必须返回源代码
    .c 文件进行修改，并再次经历整个开发过程！


