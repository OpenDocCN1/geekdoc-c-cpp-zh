    # 4.1.4. Assignment Operators


    | Assignment Operator | Statement with simple assignment operator | Statement
    with shorthand operator |

    |---|---|--|

    | += | a = a + 1 | a += 1 |

    | -= | a = a - 1 | a -= 1 |

    | *= | a = a * (n+1) | a *= (n+1) |

    | /= | a = a / (n+1) | a /= (n+1) |

    | %= | a = a % b | a %= b |


    # 4.1.5. Increment and Decrement Operators


    The increment and decrement operators are one of the unary operators which are
    very useful in C language. They are extensively used in for and while loops. The
    syntax of the operators are given below:


    | Increment and Decrement Operators | Prefix Notation | Postfix Notation |

    |---|---|--|

    | ++ | ++X | X++ |

    | -- | --Y | Y-- |


    The increment operator ++ adds the value 1 to the current value of operand and
    the decrement operator -- subtracts the value 1 from the current value of operand.
    The ++X and X++ mean the same thing when they form statements independently; they
    behave differently when they are used in expression on the right hand side of
    assignment statement.


    # 4.1.6. Conditional or Ternary Operator


    The conditional operator consists of 2 symbols the question mark (?) and the colon
    (:) The syntax for a ternary operator is as follows


    ```

    exp1 ? exp2 : exp3

    ```'
  - '[PAGE 47]


    # 38 C'' Programming – A Practical Perspective


    The ternary operator works as follows

    exp1 is evaluated. If the expression is true exp2 is evaluated & its value becomes
    the value of the expression. If exp1 is false, exp3 is evaluated and its value
    becomes the value of the expression. Note that only one of the expression is evaluated.


    For example :


    ```

    a = 10;

    b = 15;

    x = (a > b) ? a : b

    ```


    Here will be assigned to the value of b. The condition follows that the expression
    is false b is assigned to x.


    # 4.1.7. Bitwise Operators


    C has a distinction of supporting special operators known as bitwise operators
    for manipulation data at bit level. A bitwise operator operates on each bit of
    data. Those operators are used for testing, complementing or shifting bits to
    the right or left. Bitwise operators may not be applied to a float or double.


    | Operator | Meaning |

    |---||

    | & | Bitwise AND |

    | | | Bitwise OR |

    | ^ | Bitwise Exclusive |

    | << | Shift left |

    | >> | Shift right |


    # 4.1.8. Special Operators


    C supports some special operators of interest such as comma operator, size of
    operator, pointer operators (& &) and member selection operators (. ->).


    # 4.1.9. The Comma Operator


    The comma operator can be used to link related expressions together. A comma-linked
    list of expressions are evaluated left to right and value of right most expression
    is the value of the combined expression.


    For example the statement

    value = (x = 10, y = 5, x + y);


    First assigns 10 to x and 5 to y and finally assigns 15 to value. Since comma
    has the lowest precedence in operators the parenthesis the parenthesis is necessary.
    Some examples of comma operator are


    In for :


    ```

    for(n=1, m=10, n<=m; n++,m++)

    ```


    In while loops'
