    Arithmetic Expressions, Evaluation of Expressions, Precedence in Arithmetic Operators,
    Rules for evaluation of expression, Type conversions in expressions, Implicit
    type conversion, Explicit Conversion and Operator precedence and associativity.


    # 4.1 Operators Introduction


    An operator is a symbol which helps the user to command the computer to do certain
    mathematical or logical manipulations. Operators are used in C language program
    to operate on data and variables. C has a rich set of operators which can be classified
