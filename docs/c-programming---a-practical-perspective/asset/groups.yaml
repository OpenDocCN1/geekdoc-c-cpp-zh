- md: "\n## 10.3 Pointer Expressions and Pointer Arithmetic\n\nLike other variables,\
    \ pointer variables can be used in expressions. For example, if p1 and p2 are\
    \ properly declared and initialized pointers, then the following statements are\
    \ valid:\n\n```c\ny = *p1 * *p2;\nsum = sum + *p1;\nz = 5 - *p2 / p1;\np2 = *p2\
    \ + 10;\n```\n\nC allows us to add integers or subtract integers from pointers\
    \ as well as to subtract one pointer from the other. We can also use hand operators\
    \ with the pointers p1+=; sum+=*p2; etc. We can also compare pointers by using\
    \ relational operators; the expressions such as p1 > p2, p1 == p2 and p1 != p2\
    \ are allowed.\n\nProgram to illustrate the pointer expression and pointer arithmetic:\n\
    \n```c\n#include <stdio.h>\nint main()\n{\n    int ptr1, ptr2;\n    int a, b,\
    \ x, y, z;\n    a = 30; b = 6;\n    ptr1 = &a;\n    ptr2 = &b;\n    x = *ptr1\
    \ / (*ptr2 - 6);\n    y = 6 - *ptr1 / (*ptr2 + 30);\n    printf(\"\\nAddress of\
    \ a %p\", ptr1);\n    printf(\"\\nAddress of b %p\", ptr2);\n    printf(\"\\na=%d,b=%d\"\
    , a, b);\n    printf(\"\\nx=%d,y=%d\", x, y);\n    ptr1 = ptr1 + 70;\n    ptr2\
    \ = ptr2;\n    printf(\"\\na=%d,b=%d\", a, b);\n    return 0;\n}\n```\n\n## 10.4\
    \ Pointers and Function\n\nThe pointers are very much used in a function declaration.\
    \ Sometimes, only with a pointer, a complex function can be easily represented\
    \ and successully. The usage of the pointers in a function definition may be classified\
    \ into two groups:\n\n1. Call by reference\n2. Call by value.\n\n### Call by value:\n\
    \nWe have seen that when a function is invoked, there will be a link established\
    \ between the formal and actual parameters. A temporary storage is created where\
    \ the value of actual parameters is stored. The formal parameters pick up its\
    \ value from storage area; the mechanism of data transfer between actual and formal\
    \ parameters allows the actual mechanism of data transfer is referred to as call\
    \ by value. The current value of corresponding actual parameter becomes a local\
    \ variable in the called function. The value of formal parameter may be changed\
    \ in the body of the actual parameter. The value of formal parameter may be changed\
    \ in the body of the subprogram by assignment or input statements. This will not\
    \ change the value of actual parameters.\n\n```c\n#include <stdio.h>\nint main()\n\
    {\n    int x, y;\n    x = 20;\n    y = 30;\n    printf(\"\\n Value of a and b\
    \ before function call=%d %d\", x, y);\n    fncn(x, y);\n    printf(\"\\n Value\
    \ of a and b after function call=%d %d\", x, y);\n    return 0;\n}\n\nvoid fncn(int\
    \ p, int q)\n{\n    p = p + p;\n    q = q + q;\n}\n```\n\n### Call by Reference:\n\
    \nWhen you pass address to a function, the receiving address should be pointers.\
    \ The process of calling a function by using pointers to pass the address of the\
    \ variable is known as call by reference. The function which is called by reference\
    \ can change the values of the variable used in the call.\n\nExample of call by\
    \ reference:\n\n```c\n#include <stdio.h>\nint main()\n{\n    int x, y;\n    x\
