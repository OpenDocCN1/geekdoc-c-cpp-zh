    # 4.1.1. Arithmetic Operators


    All the basic arithmetic operations can be carried out in C. Both unary and binary
    operations are available in C language. Unary operations operate on a single operand
    and Binary operations operate on two operand


    The following table shows the Arithmetic operators X, Y, Z are known as operands.


    | Operator | Meaning | Integer Arithmetic X=5, Y=3 | Floating point Arithmetic
    X=5.0, Y=3.0 |

    | + | Addition or Unary Plus | X+Y=8 | X+Y=8.0 |

    | - | Subtraction or Unary Minus | X-Y=2 OR -X-Y=-8 | X-Y=2.0 OR -X-Y=-8.0 |

    | * | Multiplication | X*=15 | X*=15.0 |

    | / | Division | X''/1 | X''/1.66 |

    | % | Modulus Operator (Remainder) | X%Y=2 | Not Applicable |


    # 4.1.1.1 Mixed arithmetic


    When one of the operand is real and other an integer and if the arithmetic operation
    is carried out on 2 operands then it is called as mixed arithmetic. If any one
    is of real type then the result will always be 15/10.0 = 1.5


    # 4.1.2. Relational Operators


    Often it is required to compare the relationship between operands and bring out
    a decision and program accordingly. This is when the relational operator come
    into picture and the evaluated value is always either TRUE or FALSE. C supports
    the following relational operators:


    The following table shows the Arithmetic operators'
  - '[PAGE 45]


    36 C'' Programming – A Practical Perspective


    | Operator | Meaning | Example exp1=5 and exp2=3 exp1 relational operator exp2
    |

    | --- | --- | --- |

    | < | is less than exp1 < exp2 ........FALSE |

    | <= | is less than equal to exp1 <= exp2 ........FALSE |

    | > | is greater than exp1 > exp2 ........TRUE |

    | >= | greater than or equal to exp1 >= exp2......TRUE |

    | == | is equal to exp1 == exp2 ........FALSE |

    | != | is not equal to exp1 != exp2 ........TRUE |


    # 4.1.3. Logical Operators


    C has the following logical operators, they compare or evaluate logical and relational
    expressions:


    | Operator | Meaning |

    | --- | --- |

    | && | Logical AND |

    | || | Logical OR |


    Logical AND (&&)

    This operator is used to evaluate 2 conditions or expressions with relational
    operators simultaneously. If both the expression to the left and the right of
    the logical operator is true then the whole compound expression is true.


    Example:

    a > b && x == 10

    The expression to the left is a > b and on the right is x == 10 the whole expression
    is true only if both expressions are true i.e., if a is greater than b and x is
    equal to 10.


    Logical OR (||)

    The logical OR is used to combine 2 expressions or the condition evaluates to
    true if any one of the 2 expressions is true.


    Example:

    a m || a < n

    The expression evaluates to true any one of them is true or both of them are true.
    It evaluates to true if a is either m n or when a is less than both m and n.


    Logical NOT (!)

    The logical NOT operator takes single expression and evaluates to true if the
    expression is false and evaluates to false if the expression is true. In other
    words it just reverses the value of the expression.'
