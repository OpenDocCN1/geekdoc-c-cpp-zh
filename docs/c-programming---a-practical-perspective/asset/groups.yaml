    \n# PART—I\n\n- 1. 算法与流程图\n- 2. C语言编程简介\n- 3. 标记与数据类型\n- 4. 运算符与表达式\n- 5. 控制语句\n\
    \n此页留白。\n\n# 算法与流程图\n\n## 目标\n在本章中，你将学习算法、流程图、算法的特征、算法中的控制结构以及符号。\n\n## 1.1 使用计算机解决问题\n\
    计算机总是要求对问题有明确的定义，以便简单执行并直接地解决问题。在这一层面上，假设程序员具有了一定的背景知识、推理能力和解决问题的提示。使用计算机解决问题涉及的步骤包括：\n\
    - 仔细研究并分析问题\n- 在必要时重新定义问题\n- 规定处理结果的预期输出\n- 基于上述分析，为所选方法制定一组步骤或程序性步骤（称为算法）\n-\
    \ 使用精确的记法表示算法，将其输入计算机，计算结果，并重复上述步骤，直到获得问题的正确解。\n\n## 1.2 算法\n有限的程序性步骤集合，其中每一步都是精确、无歧义且能够在有限时间内由机器执行的，被称为算法。由于计算机需要无歧义、精确且定义的指令来解决问题，因此算法必须用“精确的记法”表示。在编写计算机程序之前，需要经过一个中间步骤，即绘制流程图。\n\
    \n## 1.3 流程图\n流程图是按顺序执行以获得结果的算法步骤的图形表示。实际上，计算机程序是在编写流程图后才编写的。\n\n**语句**：求三个数的和和平均值并打印结果\n\
    **重新定义的问题**：编写一个程序求和和平均值。从标准输入设备接受3个数字，并在显示器上显示结果。\n\n```\n步骤1. [首先输入三个数字]\n输入\
    \ a, b, c\n步骤2. [求三个数的和]\nSum = a+b+c\n步骤3. [求平均值]\nAverage = sum/3\n步骤4. [打印结果]\n\
    ```\n\n### 1.4 输入\n算法从数据开始。\n\n### 1.4.2 确定性\n算法步骤必须是确定的，即说明要做什么。例如：\n(1) 计算和\n\
    (2) 加法\n\n### 1.4.3 有效性\n每个操作必须是有效的。\n\n### 1.4.4 终止\n在经过最数量的操作后，算法必须结束，即总时间是有限的。\n\
    \n### 1.4.5 输出\n算法是为了解决问题而写的，因此必须产生一个或多个计算结果。\n\n# 1.5 算法中的基本控制结构\n算法通常由有限的顺序步骤组成。算法可能有条件，用于决策，并根据决策选择一组语句进行执行。在某些情况下，语句必须重复执行。为了满足上述解决问题的情况，算法使用了三种基本的控制结构：\n\
    \n- 1.5.1 顺序\n- 1.5.2 分支（选择）\n- 1.5.3 重复（循环）\n\n这些也被称为开发结构化程序时使用的程序结构。\n\n## 1.5.1\
    \ 顺序\n顺序结构表示程序逻辑的顺序流，即按步骤执行算法中的程序语句。\n\n例如：\n\n```\n(1) 在算法中：\n步骤1. [输入三个数字]\n\
    \    输入 a, b, c\n步骤2. [将给定的数字相乘并将结果存储在另一个变量中]\n    Mult ← a*b*c\n步骤3. [将所有数字相加并将和存储在另一个变量中]\n\
    \    Sum ← a+b+c\n```\n"
