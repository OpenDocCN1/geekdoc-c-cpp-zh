    # 前言


    本书专为 C 语言初学者设计。具有高阶语言的编程经验会有帮助，但对于熟悉计算机的读者来说并非必须。由于本书同时也包含了学习内容，它是数据结构、编译器设计、操作系统、计算机图形或其他使用
    C 语言作为编程语言课程的绝佳伴侣。由于书中包含了程序、练习题并强调实际问题，本书也会吸引参加培训班或自学 C 语言的读者。


    本书的设计目标如下：

    - 保持清晰、易读且具有趣味性

    - 适合广泛的读者群体

    - 具有权威性但不说教

    - 组织结构合理，便于教学和学习

    - 强调代码风格

    - 避免对特定机器或系统的依赖

    - 使用插图来解释概念


    在确保实现上述目标的同时，我们还在书中加入了一些让读者欣赏的特性。另一方面，如果一个程序过于简短，读者将无法理解这些功能在现实世界是如何使用的。我们选择了一种折中方案，使用简单的示例在首次引入概念时使其清晰，并逐渐增加复杂度。每章末尾都有set与涵盖内容相关的问题。本书分为四个部分：


    第一部分：

    第 1 章：算法与流程图

    第 2 章：C 语言简介

    第 3 章：标记与数据类型

    第 4 章：运算符与表达式

    第 5 章：控制语句


    第二部分：

    第 6 章：预处理器

    第 7 章：输入与输出

    第 8 章：函数

    第 9 章：数组


    第三部分：

    第 10 章：指针

    第 11 章：结构体与联合体

    第 12 章：文件管理


    第四部分：

    附录 I：ASCII 符号列表

    附录 II：C 关键字与运算符列表

    附录 III：C 标准库函数列表


    我们希望读者能像我们一样享受这本书。


    Sachin Kadam 博士

    Gauri (Ranadive) Madan 教授


