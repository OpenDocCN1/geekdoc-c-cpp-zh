    but even these differences can be minimized by careful choice of programming constructs.


    # 2.3 ANSI-C Standard


    When it became evident the C programming language was becoming a very popular
    language available on a wide range of computers, a group of concerned individuals
    met to propose a standard set of rules for the use of the C programming language.
    The group represented all sectors of the software industry and after many meetings,
    and many preliminary debates, they finally wrote an acceptable standard for the
    C language. It has been accepted by the American National Standards Institute
    (ANSI), and by the International Standards Organization (ISO). It is not refused
    upon any group or user, but since it is so widely accepted, it would be economic
    for any compiler writer to refuse to conform to the standard. C is often called
    a "Middle Level" programming language. This is not a reflection on its lack of
    power but more reflection on its capability to access the system''s low level
    functions. A middle level language, such as C, probably does not supply all the
    constructs found in high-languages - but it provides you with all the building
    blocks that you will need to produce the results you want!'
  - '[PAGE 28]


    # 2.4 Why use C?


    C has been used successfully for every type of programming problem imaginable
    from operating systems to spreadsheets to expert systems - efficient compilers
    are available for machines ranging in power from the Apple Macintosh to the supercomputers.
    The largest measure of C''s success seems to be on purely practical considerations
    like:


    +   - the portability of the compiler

    - the standard library concept

    - a powerful and varied repertoire of operators

    - an elegant syntax

    - ready access to the hardware when needed


    # 2.5 Use of C


    C was initially used for system development work, in particular the programs that
    make-up the operating system. Some examples of the use of C might be:


    +   - Operating Systems

    - Language Compilers

    - Assemblers

    - Text Editors

    - Print Spoolers

    - Network Drivers

    - Utilities


    In recent years C has been used as a general-purpose language because because
    of its popularity with programmers. It is not the world''s easiest language to
    learn and you will certainly benefit if you are not learning C as your first programming
    language


    # 2.6 C for Personal Computers


    With regards to personal computers Microsoft C for IBM PC''s. And Borland''s C
    is seen as the two most commonly used systems. However, the latest version of
    Microsoft C is now considered to be the most powerful and efficient compiler for
    personal computers.


    Running C Programs


    This section is primarily aimed at the beginner who has no or little experience
    of using compiled languages.


    The Edit-Compile-Link-Execute Process


    Developing a program in a compiled language such as C requires at least four steps:

    writing the program

    compiling it'
  - '[PAGE 29]


    # 20 C’ Programming – A Practical Perspective


    linking it

    executing it


    We will now cover each step separately.


    # Editing


    You write a computer program with words and symbols that are understandable to
    human being. You type the program directly into a window on the screen and saving
    the result as a separate file. This is often referred to as the source file. The
    custom is that the text of a C program is stored in a file with the extension
    .c for C programming language


    # Compiling


    You cannot directly execute the source file. To run on any computer system, the
    source file must be translated into binary numbers understandable to the computer’s
    Central Processing Unit. This process produces an intermediate object file - with
    the extension .obj.


    # Linking


    Many compiled languages use library routines which can be added to your program.
    These routines are written by the manufacturer of compiler to perform a variety
    of tasks, from input/output to complicated mathematical functions. In the case
    of C the standard input and output functions are contained in a library (stdio.h).
    So even the most basic program will require a library function. After linking
    the file extension is .exe.


    # Executable files


    Thus the text editor produces .source files, which go to the compiler, producing
    .obj object files, which go to the linker, producing .exe executable file. You
    can then run .exe files as you can have other applications, simply by typing their
    names at the DOS prompt or using windows menu.


    # Using Microsoft C


    Edit stage:


    Type program in using one of the Microsoft Windows editing packages.


    # Compile and link:


    Select Building from Make menu. Building option allows you to both compile and
    link in the same option.


    # Execute:


    Use the Run menu and select Go option.


    # Errors:


    First error highlighted. Use Next Error from Search menu for further errors if
    applicable. If you get an error message, or you find that the program does not
    work when you finally run it you will have to go back to the source file - the
    .c file to make changes and go through the whole development process again!'
