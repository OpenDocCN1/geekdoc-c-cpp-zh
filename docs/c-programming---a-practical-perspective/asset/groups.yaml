    # # 1 ALGORITHMS AND FLOWCHARTS


    > > OBJECTIVE

    > In this chapter you will learn Algorithm, Flowchart, and Characteristics of
    Algorithm, Control structure in Algorithm, Flow chart Symbols


    ## 1.1 Problem Solving with Computers

    The computer always demands unambiguous definition of the problem, which is simple
    to carry out and straight forward to implement in order to solve the problem.
    At this level the programmer is assumed to have certain amount of background knowledge,
    reasoning skills and hints for problem solving.


    +   Steps involved in problem solving using computers :

    - Make a close study of given problem and analyze it

    - Redefine the problem if necessary

    - Specify what is expected as an outcome of processing

    - Find a suitable method to solve the given problem

    - Based on above analysis, formulate a set of steps or procedural steps (known
    as Algorithm) of the chosen method of solution'
  - '[PAGE 13]


    # C Programming – A Practical Perspective


    +   - Express the algorithm in precise notation, feed it to computer, compute
    the results and

    reevaluate it

    - Repeat the above steps until you get correct solution of given problem.


    # 1.2 Algorithms


    The finite set of procedural steps, where each step is precise, unambiguous and
    capable of

    being carried out by a machine in finite time is known as Algorithm. As computer
    expects

    unambiguous, precise and define instructions or command to solve a problem as
    the algorithm

    must be expressed in a ‘precise notation’. Algorithm when it is expressed in one
    of the precise

    notation is called as a computer program. Before writing the computer program
    from algorithm an

    intermediate step, i.e., flowcharting is needed.


    # 1.3 Flowchart


    A flowchart is the pictorial representation of algorithmic steps to be performed
    sequentially

    arrive at the result. Actually the computer program is written only after writing
    the flowchart.

    **Statement**: Find the sum and average of three numbers and print the result

    **Redefined problem**: Write a program to find the sum and average of 3 float
    number. Accept

    3 numbers from standard input device and display the result on monitor, Outcome
    of process is

    sum and average of three numbers from input device.


    ```

    Algorithm to add 3 numbers and print sum and average.

    Step 1. [First input the 3 numbers]

    Input a, b, c

    Step 2. [Finding the sum of given numbers]

    Sum <- (a+b+c)

    Step 3. [Finding the average]

    Average <- sum/3.0

    Step 4. [Print the results]

    Write sum,

    Step 5. [End of the algorithm]

    End

    ```


    # 1.4 Characteristics of Algorithms


    # 1.4.1. Input


    Algorithm starts with a procedural step to accept input data. The subsequent steps
    in the

    alalgorithm process these data elements. But this input step is optional and is
    used only when the

    alalgorithm needs data at the time of execution.'
  - '[PAGE 14]


    # 1.4.2. Definite


    Each operational step must be definite, i.e., it should specify what should be
    done. In other words there should not be any confusing instruction.


    For example: (1) Compute 5/0"

    (2) Add 5 or 10 to 5


    Above statements are not allowed in algorithms because in first statement result
    of 5/0 is infinity which is not defined in Computers and in all branches of Mathematics.
    The second statement, which one of the numbers 5 or 10 should be added to 5, is
    not clear.


    # 1.4.3. Effective


    Each operation must be effective to carry out. Effectiveness property of an algorithm
    says that each operational step be at least in principle, being carried in a minimum
    amount of time.


    For example, analyze the mathematical formula given below


    ```

    Y = PX+ Q''+ RX + S

    Y=(P*X*X)+(Q*X'')+(R*X)+S

    ====> Y=X(X(PX+Q)+R)+S

    ```


    The above statement can be written as C - statement as follows


    But to execute the above, the computer has to do six multiplications and three
    additions. We can modify the formula above as below i.e.


    In C-statement, this can be written as Y= X'' ((P''* X) + Q) + R) +.

    Now there are only 3 multiplications and 3 additions. Therefore the above statement
    is more efficient and takes less time for execution. The computing speed decreases
    as we go from operations additions, subtractions, multiplication, divisions, pow(
    ) logarithmic calculations, trigonometric functions and other mathematical functions.
    Therefore one should try to replace slow operations by faster as fast as possible.


    For examples:

    Replace pow (x, 3) by x''*x

    Replace 3''y by y+y

    Replace n/2.0 by n*0.5

    Also try to the repetitions of operations.


    For example:


    | Repeated operations (slow) | more efficient (fast) |

    |---|---|

    | Sum = a + b + c + d | sum = a + b + c + d |

    | avg = (a + b + c + d)/4.0 | avg = sum/4.0 |'
