    | Datatype | Keyword Equivalent |

    | --- | --- |

    | Character | char |

    | Unsigned Character | unsigned char |

    | Signed Character | signed char |

    | Signed Integer | signed int (or) int |

    | Signed Short Integer | signed short int (or) short (or) short |

    | Signed Long Integer | signed long int (or) long (or) long |

    | Unsigned Integer | unsigned int (or) unsigned |

    | Unsigned Short Integer | unsigned short int (or) unsigned short |

    | Unsigned Long Integer | unsigned long int (or) unsigned long |

    | Floating Point | float |

    | Double Precision Floating Point | double |

    | Extended Double Precision Point | long double |


    # 3.8 User Defined Type Declaration


    In C language a user can define an identifier that represents an existing data
    type. The user defined datatype can later be used to declare variables.


    +   The general syntax is:

    t`typedef type identifier;`nhere type represents existing data type and ''identifier''
    refers to the ''row'' name given to the data type.

    Example:

    t`typedef int salary;`


    # 3.9 Special Data Type Enum


    Defines a set of constants of type int.

    The syntax for defining constants using enum is:

    enum [tag] {name=[value], ...};

    The set can optionally be given a type name with `tag`. `name` is the name of
    a constant that can optionally be assigned the (constant) value, etc.

    For example,

    enum Numbers (One = 1, Two = 2, Three = 3, Four = 4, Five = 5);

    If value is missing, then a value is assumed to be the value of the previous constant
    in the list

    + 1. If this is the first constant in the list, the default value is 0.'
