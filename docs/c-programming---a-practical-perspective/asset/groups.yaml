    \ of array numbers is 9\n\n## 9.3 Initialization of Arrays\n\nWe can initialize\
    \ the elements in the array in the same way as the ordinary variables when they\
    \ are declared. The general form of initialization of arrays is:\n`type array_name[size]={list\
    \ of values};`\n\nThe values in the list are separated by commas, for example\
    \ the statement:\n`int number[3]={0,0,0};` will declare the array size as an array\
    \ of size 3 and assign zero to each element. If the number of values in the list\
