    # 5

    CONTROL

    STATEMENTS


    > OBJECTIVE

    In this chapter you will learn the use of control statements in C such as branching
    and looping statements


    # 5.1 Introduction


    Statements represent the lowest-level building blocks of a program. Statements
    are useful because of the side-effects they cause, the combination of which enables
    the program to serve a specific purpose. A running program spends all of its time
    executing statements. The order in which statements are executed is called control
    flow. Flow control in a program is typically sequential, from one statement to
    the next, but may be diverted to other paths by branch statements. Flow control
    is an important consideration because it determines what is executed during a
    run and what is not, affecting the overall outcome of the program. Like many other
    procedural languages, C provides different forms of statements for different purposes.
    Declaration statements are used for defining variables. Assignment-like statements
    are used for simple, algebraic computations. Branching statements are used for
    specifying alternate paths of execution, depending on the outcome of a logical
    condition. Loop statements are used for specifying computations which need to
    be repeated until a certain logical condition is satisfied. Flow control statements
    are used to divert the execution path to another part of the program.'
