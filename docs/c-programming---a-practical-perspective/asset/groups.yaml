    \n# ALGORITHMS AND FLOWCHARTS\n\n## OBJECTIVE\nIn this chapter you will learn\
    \ Algorithm, Flowchart, and Characteristics of Algorithm, Control structure in\
    \ Algorithm, Symbols.\n\n## 1.1 Problem Solving with Computers\nThe computer always\
    \ demands unambiguous definition of the problem which is simple to carry out and\
    \ straightforward in order to solve the problem. At this level the programmer\
    \ is assumed to have certain amount of background knowledge, reasoning skills\
    \ and hints for problem solving. Steps involved in problem solving using computers:\n\
    - Make a close study of problem and analyze it\n- Redefine the problem if necessary\n\
    - Specify what is expected as outcome of processing\n- Based on above analysis,\
    \ formulate a set of steps or procedural steps (known as algorithm) of chosen\
    \ method\n- Express the algorithm in precise notation, feed it to computer, compute\
    \ the results and repeat the above steps until you get correct solution of problem.\n\
    \n## 1.2 Algorithms\nThe finite set of procedural steps, where each step is precise,\
    \ unambiguous and capable of being carried out by machine in finite time is known\
    \ as Algorithm. As computer expects unambiguous, precise and define instructions\
    \ to solve the problem as the algorithm must be expressed in ‘precise notation’.\
    \ Before writing the computer program from an intermediate step, i.e., flowcharting\
    \ is needed.\n\n## 1.3 Flowchart\nA flowchart is the pictorial representation\
    \ of algorithmic steps to be performed sequentially to arrive at the result. Actually\
    \ the computer program is written only after writing the flowchart.\n\n**Statement**:\
    \ Find the sum and average of three numbers and print the result\n**Redefined\
    \ problem**: Write a program to find the sum and average. Accept 3 numbers from\
    \ standard input device and display the result on monitor.\n\n```\nStep 1. [First\
    \ input the 3 numbers]\nInput a, b, c\nStep 2. [Finding the sum of given numbers]\n\
    Sum <- a+b+c\nStep 3. [Finding the average]\nAverage <- sum/3.0\nStep 4. [Print\
    \ the results]\nStep 5. [End]\n```\n\n### 1.4.1 Input\nAlgorithm starts with a\
    \ procedural step to accept data. The subsequent steps process these data elements.\
    \ But this input step is optional and is used only when the algorithm needs data\
    \ at the time of execution.\n\n### 1.4.2. Definite\nEach operational step must\
    \ be definite, i.e., it should specify what should be done. In other words there\
    \ should not be any confusing instruction. For example:\n(1) Compute 5/0\n(2)\
    \ Add 5 or 10 to 5\nAbove statements are not allowed in algorithms because in\
    \ first statement result of 5/0 is infinity which is not defined in Computers\
    \ and in all branches of Mathematics. The second statement, which one of the numbers\
    \ 5 or 10 should be added to 5, is not clear.\n\n### 1.4.3. Effective\nEach operation\
    \ must be effective to carry out. Effectiveness property of an algorithm says\
    \ that each operational step be at least in principle carried in a minimum amount\
    \ of time. For example, analyze the mathematical formula below\n\n```\nY = PX+\
    \ Q'+ RX + S\nY=(P*X*X)+(Q*X)+(R*X)+S\nY=X(PX+Q)+R+S\n```\nThe above statement\
    \ can be written as C statement as follows but to execute the above, the computer\
    \ has to do six multiplications and additions. We can modify the formula above\
    \ as below i.e. In C-statement, this can be written as Y= X ((P'* X) + Q) + R+.\
    \ Now there are only 3 multiplications and 3 additions. Therefore the above statement\
    \ is more efficient and takes less time for execution. The computing speed decreases\
    \ as we go from operations additions, subtractions, multiplication, divisions,\
    \ pow() logarithmic calculations, trigonometric functions and other mathematical\
    \ functions. Therefore one should try to replace slow operations by faster as\
    \ fast as possible.\n\nFor examples:\n- Replace pow (x, 3) by x'*x\n- Replace\
    \ 3'y by y+y\n- Replace n/2.0 by n*0.5\nAlso try the repetitions of operations.\n\
    \n| Repeated operations (slow) | more efficient (fast) |\n|---|---|\n| Sum = a\
    \ + b + c + d | sum = a + b + c + d |\n| avg = (a + b + c + d)/4.0 | avg = sum/4.0\
    \ |\n\n### 1.4.4. Terminate\nAfter some minimum number of operations, algorithm\
    \ must come to an end, i.e., the total time to carry out all the steps in algorithm\
    \ must be limited (finite).\n\n### 1.4.5. Output\nAn algorithm is written to solve\
    \ the problem therefore it must produce one or more computed results. In order\
    \ to incorporate the definiteness property of the algorithm, algorithms will be\
    \ expressed using a precise notation called programming languages. Such computer\
    \ programming languages are designed to assign clarity, definiteness and effectiveness\
    \ to each of the instructions of the algorithm.\n\n# 1.5 Base Control Structures\
    \ in Algorithms\nUsually the algorithm consists of finite set of sequential procedural\
    \ steps. The algorithm may have conditions, which are used to take decision, and\
    \ depending upon decisions, a particular group of statements are selected for\
    \ execution. There are also situations in some of which the statements have to\
    \ be executed repeatedly. To meet above situations of problem solving, algorithm\
    \ uses 3 basic forms of control structures:\n\n- 1.5.1 Sequencing\n- 1.5.2 Branching\
    \ (selections)\n- 1.5.3 Repetitions (looping)\n\nThese are also called as program\
    \ structures used in developing structured programs.\n\n## 1.5.1 Sequencing\n\
    The sequence structure indicates the sequential flow of program logic, i.e., by\
    \ step step execution of program statements in the algorithm.\n\nFor example:\n\
    \n```\n(1) In algorithm:\nStep 1. [Input the three numbers]\n    Input a, b, c\n\
    Step 2. [Multiply given numbers and store the result in another variable]\n  \
    \  Mult ← a*b*c\nStep 3. [Add all numbers and store the sum in another variable]\n\
    \    Sum ← a+b+c\n```\n"
