    # ABOUT THE BOOK


    We have had a love/hate with C for years. We love the ease with which one can
    write a C program. We love the development environments that C make with today''s
    C compilers. But we hate the ease with which we can make mistakes. We hate the
    attention to detail that C programming often requires. And above all, we hate
    the way many programmers design other languages. It''s face: C is the ultimate
    programming language (no other either). It is, however, a language which every
    software developer should become familiar. It has become, for better or worse,
    the *lingua franca* of the computer world. The present book is an attempt to bring
    this lingua franca closer to us computer professionals.


    Previous book: "C Programming" served as a primary text for a course. Previous
    programming experience in a high-level language is helpful, but not necessary
    for a computer-literate reader. Since the book is self-contained and useful for
    reference as well as learning, it makes an excellent companion for those in data
    structures, compiler design, operating systems, computer graphics, or other courses
    that use C as programming language. Due to its ample collection of programs, exercises
    and in practice the book will also be useful to readers who are learning C on
    their own.


    # The Topics Covered in the Book


    +   * Algorithms Flow-chart A History of C Tokens Keywords Variables Static Class
    Data Types * Operators Associativity Association Implicit Type Version Inference
    Explicit Conversion Control Statements Statements Standard Compound Operators
    Loops Preprocessor Directives Macros String Input Output Specifiers Types of Function
    Calling Mechanism Recursion Arrays Multi-dimensional Arrays Pointers Address Pointer
    Expressions Arithmetic Pointers and Functions Dynamic Memory Allocation Structures
    Unions * File Management I/O Command Line


    # ABOUT THE AUTHORS


    Dr. Sakshi Kadam is an engineering graduate. He started his career as a service
    engineer. After he joined MCA and the IT industry as a researcher. He specialised
    in embedded systems through Post Diploma in Embedded Systems (PGDES). Then he
    joined academia to pursue his research interests. He completed his doctoral research
    in Computer Applications. He invented a new computer language titled C (Concept
    Modeling Language) specifically designed for education. While in academia he is
    also closely involved with the industry, participating in national seminars and
    workshops for industry professionals and as university teachers on various topics
    ranging from embedded systems to supercomputers. He has taken consultancy and
    teaching assignments over all India. He is a regular contributor towards the leading
    computer magazines and publications. Presently, he is working as Director at Sinhgad
    Institute of Computer Applications (SITCA).


    Mrs. Gaur (Ranhavi) Maden is currently working as a lecturer for MCA (Science)
    and MCA (Commerce) course at MIT-WAI College, Pune, Maharashtra. She has also
    acted as a in-charge of MCA (Commerce) course for the academic year 2009-10, and
    also is working as a faculty for MCA-IT course at Symbiosis Centre of Information
    Technology, Symbiosis International University, Pune.


    She received her Post Degree in Computer Science from University of Pune, in 2006.
    As a Post Graduate, she joined K Waught College, Nashik and worked as a full-time
    lecturer for B.Sc.(Computer). Since 2008, she has been working as a full-time
    lecturer for Post Postgraduate courses like MCA (Science), MCA (Commerce), (IT)
    and M.Sc. (Computer Science).


    Her area of interest includes Mobile and Wireless Communication, Data Communication
    and Network Operations, Next Generation Networks, Client/Server Computing, and
    Internet Programming. She is approved by University of Pune.


