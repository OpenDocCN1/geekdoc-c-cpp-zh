- md: "\n# 168 C’ Programming – A Practical Perspective\n\nFor example:\n\nbook1.price\n\
    Is the variable representing the price of book1 and can be treated like any ordinary\
    \ variable. We can use scanf to assign values like\n\n```c\nscanf(\"%s\",book1.file);\n\
    scanf(\"%d\", &book1.pages);\n```\n\nOr we can assign variables to the members\
    \ of book1\nbook1.price=288.50;\n\nExample program for using structure\n\n```c\n\
    #include <stdio.h>\nint main()\n{\n    int id_no;\n    char name[20];\n    char\
    \ address[20];\n    char combination[3];\n    int age;\n    struct student newstudent;\n\
    \    printf(\"Enter the student information\\n\");\n    printf(\"Now Enter the\
    \ student id_no\\n\");\n    scanf(\"%d\",&newstudent.id_no);\n    printf(\"Enter\
    \ the name of the student\\n\");\n    scanf(\"%s\",&newstudent.name);\n    printf(\"\
    Enter the address of the student\\n\");\n    scanf(\"%s\",&newstudent.address);\n\
    \    printf(\"Enter the combination of the student\\n\");\n    scanf(\"%d\",&newstudent.combination);\n\
    \    printf(\"Enter the age of the student\\n\");\n    scanf(\"%d\",&newstudent.age);\n\
    \    printf(\"Student information\\n\");\n    printf(\"student id_number=%d\\\
    n\",newstudent.id_no);\n    printf(\"student name=%s\\n\",newstudent.name);\n\
    \    printf(\"student Address=%s\\n\",newstudent.address);\n    printf(\"students\
    \ combination=%s\\n\",newstudent.combination);\n    printf(\"Age of student=%d\\\
    n\",newstudent.age);\n}\n```\n\n## 11.3 Initializing Structure\n\nLike other data\
    \ type we can initialize structure when we declare them. As for initialization\
    \ goes structure obeys the same set of rules as arrays we initialize the fields\
    \ of a structure by the following structure declaration with a list containing\
    \ values for each fields as with arrays values must be evaluate at compile time.\n\
    \nExample:\n\n```c\nstruct student newstudent\n{\n  12345,\n  \"Sachin\", \"Bharati\
    \ Vidyapeeth\",\n  \"Computer\",\n  25;\n};\n```\n\nthis initializes the id_no\
    \ field to 12345, the name field to \"Sachin\", the address field to \"Bharati\
    \ vidyapeeth\" the field combination to \"Computer\" and the age field to 25.\n\
    \n## 11.4 Functions and Structures\n\nWe can pass structures as arguments to functions.\
    \ Unlike array names however, which always point to the start of the array, structure\
    \ names are not pointers. As a result, when we change structure parameter inside\
    \ a function, we do not effect its corresponding argument.\n\n### 11.4.1 Passing\
    \ structure to elements to functions\n\nA structure may be passed into a function\
    \ as individual member or a separate variable. A program example to display the\
    \ contents of a structure passing the individual elements to a function is shown\
    \ below.\n\n```c\n#include <stdio.h>\nstruct emp {\n  int emp_id;\n  char name[25];\n\
    \  char department[10];\n  float salary;\n};\n\nvoid display(int e_no, char e_name[])\
    \ {\n    printf(\"%d %s\\n\", e_no, e_name);\n}\n\nint main() {\n    struct emp\
    \ emp1={125, \"sampath\", \"operator\", 7500.00};\n    /* pass only emp_id and\
    \ name to display function*/\n    display(emp1.emp_id, emp1.name);\n    return\
    \ 0;\n}\n```\n\nIn the declaration of structure type emp, emp_id and name have\
    \ been declared as integer. When we call the function display() using display(emp1.emp_id,\
    \ emp1.name); we are sending the emp_id and name to function display(); it can\
    \ be immediately realized to pass individual elements would become more tedious\
    \ as the number of structure elements go on increasing a better way would be to\
    \ pass the entire structure variable at a time.\n\n## 11.4.2 Passing entire structure\
    \ to functions\n\nIn case of structures of having numerous structure elements\
    \ passing individual elements would be a tedious task. In such cases we may pass\
    \ whole structure to a function as shown:\n\n```c\n#include <stdio.h>\nstruct\
    \ employee {\n    int emp_id;\n    char name[25];\n    char department[10];\n\
    \    float salary;\n};\n\nvoid display(struct employee f) {\n    printf(\"%d,\
    \ %s, %s, %f\\n\", f.emp_id, f.name, f.department, f.salary);\n}\n\nvoid main()\
    \ {\n    struct employee emp1={12, \"adan\", \"computer\", 7500.00};\n    /*sending\
    \ structure*/\n    display(emp1);\n    /*function to pass entire structure variable*/\n\
    \    return 0;\n}\n```\n\n## 11.5 Arrays of Structure\n\nIt is possible to define\
    \ a array of structures if we are maintaining information of all the students\
    \ and if 100 students are studying in the college we need to use an array than\
    \ single variables. We can define an array of structures as shown in following:\n\
    \n```c\n#include <stdio.h>\nstruct info {\n    int id_no;\n    char name[20];\n\
    \    char address[20];\n    char combination[30];\n    int age;\n};\nstruct info\
    \ std[100];\n\nint main() {\n    int i, n;\n    printf(\"Enter the number of students\"\
    );\n    scanf(\"%d\", &n);\n    printf(\"Enter Id_no, name, address combination\
    \ age\");\n    for(i=0; i<n; i++) {\n        scanf(\"%d %s %s %d\", &std[i].id_no,\
    \ std[i].name, std[i].address, &std[i].age);\n    }\n    printf(\"\\nStudent information:\\\
    n\");\n    for(i=0; i<n; i++) {\n        printf(\"%d %s %s %d\\n\", std[i].id_no,\
    \ std[i].name, std[i].address, std[i].age);\n    }\n    return 0;\n}\n```\n\n\
    ## 11.6 Structure within a Structure\n\nA structure may be defined as a member\
    \ of another structure. In such structures the declaration of the embedded structure\
    \ must appear before the declarations of the other structures.\n\n```c\nstruct\
    \ date {\n  int day;\n  int month;\n  int year;\n}\nstruct student {\n  int id_no;\n\
    \  char name[20];\n  char address[20];\n  char combination[3];\n  int age;\n \
    \ struct date def;\n  struct date doa;\n} oldstudent, newstudent;\n```\n\nthe\
    \ structure student contains another structure date as one of its members.\n\n\
    ## 11.7 Union\n\nHowever the members that compose a union share the same storage\
    \ area whereas each member within a structure is assigned its own storage area.\
    \ Unions are used for the application involving multiple members where values\
    \ need not be assigned to all the members at any time. Like structures union contain\
    \ members whose individual data types may differ from one another also. Like structures\
    \ can be declared using the keyword union as follows:\n\nthis declares a variable\
    \ of union item. The union contains three members with a different data type.\
    \ However we can use only one of them at a time. This is because only one location\
    \ is allocated for union variable irrespective of size. The compiler allocates\
    \ a piece of storage that is large enough to access a union member we can use\
    \ the same syntax that we use to access structure members, i.e.,\n\n```c\nunion\
    \ item {\n  int m;\n  float p;\n  char c;\n}\n```\n\nDuring accessing we should\
    \ make sure that we are accessing the member whose value is currently stored.\
    \ For example a statement such as\ncode.m=456;\ncode.p=456.78;\nprintf(\"%d\"\
    ,code.m);\nWould produce erroneous result. In effect a union creates a storage\
    \ location that can be used by one of its members at a time. When a different\
    \ number is assigned a new value the new value supersedes the previous members\
    \ value. Unions may be used in all places where a structure is allowed. The notation\
    \ for accessing a union member that is nested inside a structure remains the same\
    \ as for the nested structure.\n\n# Program 11.1\n\nenum1.c — Starting to use\
    \ enumerated types: Printing for each day of the week, today, yesterday, and tomorrow,\
    \ both as a string and as a number\n\n```c\n#include <stdio.h>\n/* Introducing\
    \ an enumerated data type */\nenum days (monday,tuesday,wednesday,thursday,friday,saturday,sunday);\n\
    typedef enum days days;// This allows us to use \"days\" as an abbreviation for\
    \ \"enum days\"\n/* Two useful functions */\ndays yesterday(days today) {\n  \
    \  return (today+6)%7;\n}\ndays tomorrow(days today) {\n    return (today+1)%7;\n\
    }\n/* A useful array: thedays is an array of constant (i.e you cannot\nmodify\
    \ them) pointers to constant (i.e. you cannot modify them) strings */\nconst char\
    \ * const thedays[] = {\n    \"monday\", \"tuesday\", \"wednesday\", \"thursday\"\
    ,\n    \"friday\", \"saturday\", \"sunday\"};\n};\n\nint main(void) {\n    int\
    \ days today;\n    printf(\"today\\tyesterday\\ttomorrow====================\\\
    n\");\n    for (today=0;today<7;today++) {\n        printf(\"%s = %d \\t%s = %d\
    \ \\t%s = %d\\n\",\n               thedays[today], today, thedays[yesterday(today)],\n\
    \               yesterday(today), thedays[tomorrow(today)],\n               tomorrow(today));\n\
    \    }\n    return 0;\n}\n```\n\nThe output:\n\n| monday = 0 | sunday = 6 | tuesday\
    \ = 1 |\n| tuesday = 1 | monday = 0 | wednesday = 2 |\n| wednesday = 2 | tuesday\
    \ = 1 | thursday = 3 |\n| thursday = 3 | wednesday = 2 | friday = 4 |\n| friday\
    \ = 4 | thursday = 3 | saturday = 5 |\n| saturday = 5 | friday = 4 | sunday =\
    \ 6 |\n| sunday = 6 | saturday = 5 | monday = 0 |\n\n# Program 11.2\n\n+   - enum2.c\
    \ — Starting to use enumerated types: Printing for each day of the week, today,\
    \ yesterday, and tomorrow, both as a string and as a number. We use typedef\n"
  mdcn: "\n\n# 168 C语言编程 – 实用视角\n\n例如：\n\nbook1.price\n是一个代表 book1 价格变量，可以像任何普通变量一样处理。我们可以使用\
    \ `scanf` 来分配值，如：\n\n```c\nscanf(\"%s\",book1.file);\nscanf(\"%d\", &book1.pages);\n\
    ```\n\n或者我们可以为 book1 的成员赋值变量\nbook1.price=288.50;\n\n使用结构体的示例程序\n\n```c\n#include\
    \ <stdio.h>\nint main()\n{\n    int id_no;\n    char name[20];\n    char address[20];\n\
    \    char combination[3];\n    int age;\n    struct student newstudent;\n    printf(\"\
    Enter the student information\\n\");\n    printf(\"Now Enter the student id_no\\\
    n\");\n    scanf(\"%d\",&newstudent.id_no);\n    printf(\"Enter the name of the\
    \ student\\n\");\n    scanf(\"%s\",&newstudent.name);\n    printf(\"Enter the\
    \ address of the student\\n\");\n    scanf(\"%s\",&newstudent.address);\n    printf(\"\
    Enter the combination of the student\\n\");\n    scanf(\"%d\",&newstudent.combination);\n\
    \    printf(\"Enter the age of the student\\n\");\n    scanf(\"%d\",&newstudent.age);\n\
    \    printf(\"Student information\\n\");\n    printf(\"student id_number=%d\\\
    n\",newstudent.id_no);\n    printf(\"student name=%s\\n\",newstudent.name);\n\
    \    printf(\"student Address=%s\\n\",newstudent.address);\n    printf(\"students\
    \ combination=%s\\n\",newstudent.combination);\n    printf(\"Age of student=%d\\\
    n\",newstudent.age);\n}\n```\n\n## 11.3 结构体的初始化\n\n像其他数据类型一样，我们可以在声明结构体时对其初始化。在初始化方面，结构体遵循与数组相同的规则，我们通过以下结构体声明来初始化结构体的字段，并带有一个包含每个字段值的列表，就像数组一样，这些值必须在编译时求值。\n\
    \n示例：\n\n```c\nstruct student newstudent\n{\n  12345,\n  \"Sachin\", \"Bharati\
    \ Vidyapeeth\",\n  \"Computer\",\n  25;\n};\n```\n\n这会将 `id_no` 字段初始化为 12345，`name`\
    \ 字段初始化为 \"Sachin\"，`address` 字段初始化为 \"Bharati vidyapeeth\"，`combination` 字段初始化为\
    \ \"Computer\"，`age` 字段初始化为 25。\n\n## 11.4 函数与结构体\n\n我们可以将结构体作为参数传递给函数。与始终指向数组开头的数组名不同，结构体名称不是指针。因此，当我们在函数内部更改结构参数时，不会影响其对应的参数。\n\
    \n### 11.4.1 将结构体元素传递给函数\n\n结构体可以作为单独成员或单独变量传递到函数。下面是一个将单个元素传递给函数以显示结构体内容的程序示例。\n\
    \n```c\n#include <stdio.h>\nstruct emp {\n  int emp_id;\n  char name[25];\n  char\
    \ department[10];\n  float salary;\n};\n\nvoid display(int e_no, char e_name[])\
    \ {\n    printf(\"%d %s\\n\", e_no, e_name);\n}\n\nint main() {\n    struct emp\
    \ emp1={125, \"sampath\", \"operator\", 7500.00};\n    /*仅将 emp_id 和 name 传递 display\
    \ 函数*/\n    display(emp1.emp_id, emp1.name);\n    return 0;\n}\n```\n\n在结构体类型\
    \ `emp` 的声明中，`emp_id` 和 `name` 已被声明为整数。当我们使用 `display(emp1.emp_id, emp1.name)`\
    \ 调用函数 `display()` 时，我们正在将 `emp_id` 和 `name` 发送到函数 `display()`；可以立即意识到，随着结构体元素数量的增加，传递单个元素将变得更加繁琐，更好的方法是一次性传递整个结构体变量。\n\
    \n## 11.4.2 将整个结构体传递给函数\n\n在结构体具有许多结构元素的情况下，传递单个元素将是一项繁琐的任务。在这种情况下，我们可以如所示将整个结构体传递给函数：\n\
    \n```c\n#include <stdio.h>\nstruct employee {\n    int emp_id;\n    char name[25];\n\
    \    char department[10];\n    float salary;\n};\n\nvoid display(struct employee\
    \ f) {\n    printf(\"%d, %s, %s, %f\\n\", f.emp_id, f.name, f.department, f.salary);\n\
    }\n\nvoid main() {\n    struct employee emp1={12, \"adan\", \"computer\", 7500.00};\n\
    \    /*发送结构体*/\n    display(emp1);\n    /*传递整个结构体变量的函数*/\n    return 0;\n}\n```\n\
    \n## 11.5 结构体数组\n\n如果我们维护所有学生的信息，就可以定义结构体数组。如果学院有 100 名学生在学习，我们需要使用数组而不是单个变量。我们可以按照如下方式定义结构体数组：\n\
    \n```c\n#include <stdio.h>\nstruct info {\n    int id_no;\n    char name[20];\n\
    \    char address[20];\n    char combination[30];\n    int age;\n};\nstruct info\
    \ std[100];\n\nint main() {\n    int i, n;\n    printf(\"Enter the number of students\\\
    n\");\n    scanf(\"%d\", &n);\n    printf(\"Enter student information\\n\");\n\
    \    for(i=0;i<n;i++) {\n        printf(\"Enter student id_no\\n\");\n       \
    \ scanf(\"%d\",&std[i].id_no);\n        printf(\"Enter the name of the student\\\
    n\");\n        scanf(\"%s\",&std[i].name);\n        printf(\"Enter the address\
    \ of the student\\n\");\n        scanf(\"%s\",&std[i].address);\n        printf(\"\
    Enter the combination of the student\\n\");\n        scanf(\"%d\",&std[i].combination);\n\
    \        printf(\"Enter the age of the student\\n\");\n        scanf(\"%d\",&std[i].age);\n\
    \    }\n    printf(\"\\nStudent information\\n\");\n    for(i=0;i<n; i++) {\n\
    \        printf(\"student id_number=%d\\n\",std[i].id_no);\n        printf(\"\
    student name=%s\\n\",std[i].name);\n        printf(\"student Address=%s\\n\",std[i].address);\n\
    \        printf(\"students combination=%d\\n\",std[i].combination);\n        printf(\"\
    Age of student=%d\\n\",std[i].age);\n    }\n    return 0;\n}\n```\n\n## 11.6 结构体中的结构体\n\
    \n结构体可以作为成员嵌套在另一个结构体中。\n\n```c\nstruct date {\n    int day;\n    int month;\n\
    \    int year;\n};\n\nstruct student {\n    int id_no;\n    char name[20];\n \
    \   char address[20];\n    int combination;\n    int age;\n    struct date dob;\
    \ // Nested structure\n};\n```\n\n## 11.7 联合体 (Union)\n\n与结构体不同，联合体的所有成员共享相同的存储区域。\n\
    \n```c\nunion data {\n    int m;\n    float p;\n    char c;\n};\n```\n\n在联合体中，如果你给其中一个成员赋值，它会覆盖其他成员的值。\n\
    \n```c\nunion data2 {\n    int m;\n    float f;\n    char c;\n};\n\nint main()\
    \ {\n    union data data;\n    data.m = 10;\n    printf(\"m = %d\\n\", data.m);\n\
    \    data.f = 220.5;\n    printf(\"m = %d\\n\", data.m); // This value will be\
    \ changed\n    printf(\"f = %f\\n\", data.f);\n    return 0;\n}\n```\n\n"
