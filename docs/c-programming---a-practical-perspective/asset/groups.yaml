  mdcn: "\n\n# Unix 系统\n\n在您的本地 Unix 系统上运行 `man cc` 以获取更多信息。\n请注意，Unix 是一个大小敏感的操作系统，名为\
    \ `firstprog.c` 和 `FIRSTPROG.c` 的文件在该系统中被视为两个独立的文件。默认情况下，Unix 系统会一步完成程序的编译和链接，如下所示：\n\
    \ncc firstprog.c\n\n此命令会创建一个名为 `a.out` 的可执行文件，它会覆盖任何名为 `a.out` 的现有文件。在 Unix 上，通过输入文件名来运行可执行文件。在这种情况下，程序的运行方式如下：\n\
    \n+ a.out\n\n要更改可执行文件的名称：\ncc -o firstprog firstprog.c\n这将产生一个名为 `firstprog` 的可执行文件。\n\
    \n## 2.7 字符集\n\nC 并不使用也不需要现代计算机键盘上的每一个字符。C 语言语言所需的字符如下：\n\n- A - Z\n- a - z\n\
    - 0 - 9\n- 空格 . , ; ' $ \n- # % & ! _ [ ] () < > |\n- + / - * =\n\n## 2.8 C 程序的结构\n\
    \n所有 C 程序都至少包含一个函数，但通常会编写包含多个函数的 C 程序。必须存在的函数是名为 `main` 的函数。`main` 函数是程序执行时第一个被调用的函数。\n\
    \n### C 程序的布局\n\nC 程序的通用形式如下：\n\n```c\n预处理器指令\n全局声明\nmain()\n{\n    main 函数的局部变量；\n\
    \    与 main 函数相关的语句；\n}\n用户函数 1()\n{\n    函数 1 的局部变量；\n    与函数 1 相关的语句；\n}\n....\n\
    \n等等\n```\n\n每个 C 语言初学者都会犯的一个常见错误是漏掉分号。\n\n## 2.9 预处理器指令\n\nC 是一门小语言，但为程序员提供了所有工具来编写强大的程序。C\
    \ 使用标准函数库，这些库在我们构建程序时会被包含。所有的预处理器指令都以 `#` 开头，并且必须从第一列开始。所有 C 程序的常用指令是：\n\n```c\n\
    #include <stdio.h>\n```\n\n注意头文件名称周围使用的括号（`<` 和 `>`）。这表示头文件应在存储其余 C 程序应用程序的系统磁盘上查找。\n\
    \n```c\n#include \"stdio.h\"\n```\n\n双引号表示应该在当前工作目录中搜索所需的头文件。\n\n至少可以说，这个程序是非常短短的。它如下：\n\
    \n```c\n#include <stdio.h>\n\nmain()\n{\n    printf(\"Hello World!\");\n\n}\n\
    ```\n\n第一行是所有 C 程序的标准起点 - `main()`。之后是包含在花括号 `{}` 中的程序唯一指令。花括号标记了构成组成程序的指令列表的开始和结束。\n\
    \n## 为程序添加注释\n\n注释是您写在源代码中、留给自或他人的笔记。编译器会忽略所有注释。注释主要用于说明你源代码的意义和目的，以便你以后记住它是如何运行以及如何使用的。\n\
    \n在 C语言中，多行注释的开始由 `/*` 字符对标识。注释以 `*/` 结束。例如，这是一个语法上是正确的 C 注释：\n\n/* 多行注释 */\n\n\
    用于多行/\n\n在 C 中，单行注释的开始由 `//` 标识。\n// 这是一个单行注释\n\n## 练习\n\n- (1) 如何在 MS-DOS 中执行\
    \ C 程序？\n- (2) C 语言中的语句终止符是什么？\n- (3) C 语言是否区分大小写？\n- (4) “预定义”是什么意思？\n- (5) 解释\
    \ C 程序的结构。\n\n## 程序 2.1\n\n```c\n/* Hello.c — 最著名的程序... */\n#include <stdio.h>\n\
    int main(void)\n{\n    printf(\"Hello World\\n\");\n}\n```\n\n# 标记 (Tokens) 与数据类型\n\
    \n### 目标\n在本章中你将学习 C 标记、关键字、变量、数据类型、每个类型的大小以及如何使用这些数据类型。存储类：变量的可见性\n\n## 3.1 C\
    \ 标记\n\n在文本中，单个单词和标点符号被称为标记。同样，在 C 程序中，最小单元被称为 C 标记。C 拥有以下标记：\n\n- (1) 关键字或保留字，如\
    \ `float`、`int` 等。\n- (2) 常量，如 `1`、`5` 等。\n- (3) 标识符，如 `name` 等。\n- (4) 运算符，如\
    \ `+` 等。\n- (5) 分隔符，如 `:` 等和特殊字符。\n- (6) 字符串\n\n## 3.2 关键字\n\nC 语言的关键字或保留字是已经定义并向编译器解释的单词。因此，它们不能作为标识符或变量名。它们应该只用于特定的含义。C\
    \ 语言有 32 个关键字。以下是其中一些：\n\n| Auto | break | char | const | default |\n| :--- |\
    \ :--- | :--- | :--- | :--- |\n| Do | double | Else | extern | float | for |\n\
    | Goto | if | Int | long | return | short |\n| Signed | sizeof | struct | switch\
    \ | typedef | union |\n| unsigned | void | Volatile | |\n\n## 3.3 变量\n\n变量是用于存储整数、浮点数、字符串等数据的内存空间名称。使用变量名比使用内存地址更方便，规则。\n\
    \n### 3.3.1 变量的声明\n\n声明变量意味着根据使用的数据类型为变量创建内存空间，并将内存地址与变量名关联。在 C 中，所有变量在使用之前都应该声明。此外，一旦变量变量就不能重新声明。声明变量的通用模式如下：\n\
    \n```c\nint age;\nint count, i;\nfloat amount, rate;\nchar ch;\n```\n\n## 3.4\
    \ 常量\n\n常量可以定义为“程序执行期间不改变的数量”。\n\n```c\n#include <stdio.h>\nint main(void)\n{\n\
    \    int a = 10;\n    printf(\"%d\",a);\n}\n```\n程序输出\n10\n\n在这里我们声明了一个初始值为 10\
    \ 的变量。10 是一个整数常量，当你尝试执行此程序时。\n\n### 3.4.1 常量的类型\n\n#### 3.4.1.1 整数常量\n整数常量至少有一个数字且不应有小数点。它可以是正或负的。\n\
    \n#### 3.4.1.2 实常量\n实常量至少有一个数字且必须有小数点。\n\n#### 3.4.1.3 字符常量\n字符常量应该是单个字符，并且包含在单引号中，例如\
    \ 'A'、'B' 等。常量变量也称为命名常量。命名常量实际上是一个只读变量，在程序运行时不能更改。这里有一个命名常量的声明。\n\n```c\nfloat\
    \ pi = 3.14;\n```\n\n“符号常量”可以使用 \"define\" 预处理器声明指定：\n\n```c\n#define PI 3.141592654\n\
    ```\n\n还有“const”声明定义只读变量，例如 ROM 中的内存位置。\n\n```c\nconst int a;\n```\n\n### 3.4.2\
    \ 定义符号常量\n\n常量值可以定义为预处理器语句，并在程序中像其他常量值一样使用。符号常量的通用形式是：\n\n```\n# define 符号名常量值\n\
    ```\n\n常量定义的有效示例：\n\n- # define marks 100\n- # define total 50\n- # define pi\
    \ 3.14159\n\n这些值可以出现在任何地方，但必须在程序引用它们之前。\n\n### 3.4.3 将变量声明为常量\n\n某些变量的值可能在整个程序过程中保持不变。我们可以通过在初始化时使用限定符来实现。例如：`const\
    \ int class_size = 40;`。\n\n`const` 数据类型告知编译器 `int` 变量 `class_size` 的值在程序中不可修改。\n\
    \n### 3.4.4 命名常量和变量\n\n在命名常量和变量时，你必须遵循几条规则：\n\n| 名称... | 示例 |\n| :--- | :--- |\n\
    | 不能以数字开头 | 2i |\n| 不能是 C 关键字 | struct |\n| 不能包含任何算术运算符... | r*s+t |\n| 不能包含任何其他标点符号...\
    \ | #@x%£!a |\n| 不能包含空格 | im stupid |\n| 可以是大小写混合 | XSquared |\n| 可以在其他地方包含数字\
    \ | h2o |\n| 可以包含或以下划线开头 | _height_ |\n\n## 3.5 存储类\n\nC 中的变量不仅有数据类型，还有存储类，提供了关于位置和可见性的信息。存储类划分了变量被识别的范围。\n\
    \n- **3.5.1 auto**: 它是在其声明函数中知的局部变量。auto 是默认存储类。\n- **3.5.2 static**: 在控制权转移到调用函数后仍然存在并保留其值的局部变量。\n\
