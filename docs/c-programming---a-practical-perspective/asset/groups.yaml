    # 10.7 Pointers on Pointer


    While pointers provide enormous power and flexibility to the programmers, they
    may cause malfunctions if not properly handled. Consider the following precautions
    with pointers to prevent errors. We should make sure we know where each pointer
    is pointing in a program. There are some general observations and errors that
    might be remember. A pointer contains garbage until it is initialized. Since compilers
    cannot detect uninitialized or wrongly initialized pointers, the errors may not
    execute the program even if we are able to locate a wrong result, it may not provide
    any evidence for us to suspect problems in the pointers. The abundance of operators
    is another cause of confusion that leads to errors. For the expressions such as


    ```

    *ptr++, *[i],(ptr).member

    ```


    etc should be carefully used. A proper understanding of the precedence and associativity
    rules should be carefully used.


    # 10.8 Dynamic Memory Allocation


    In programming we may come across situations where we may have to deal with data,
    which is dynamic in nature. The number of data items may change during the execution
    of a program. When the number of customers in a queue can increase or decrease
    during the process at any time. When the list we need to allocate more memory
    space to accommodate additional data items. Such situations can be handled more
    easily by using dynamic techniques. Dynamic data items at run time, thus optimizing
    file usage of storage space.


    The process of allocating memory at run time is known as dynamic memory allocation.
    Although C does inherently have this facility there are four library routines
    which allow this function.


    Many languages permit a programmer to specify any size at runtime. Such languages
    have the ability to calculate and assign during execution, the memory space required
    by the variables in the program. But C inherently does not have this facility
    but supports with memory management functions, which can be used to allocate and
    free memory during the program execution. The following functions are used in
    C for purpose of memory management.'
