    \n## 4.1.1 Arithmetic Operators\n\nAll the basic arithmetic operations can be\
    \ carried out in C. Both unary and binary operations are available in C language.\
    \ Unary operations operate on a single operand and Binary operations operate on\
    \ two operand.\n\nThe following table shows the Arithmetic operators. X, Y, Z\
    \ are known as operands.\n\n| Operator | Meaning | Integer Arithmetic X=5, Y=3\
    \ | Floating point Arithmetic X=5.0, Y=3.0 |\n| :--- | :--- | :--- | :--- |\n\
    | + | Addition or Unary Plus | X+Y=8 | X+Y=8.0 |\n| - | Subtraction or Unary Minus\
    \ | X-Y=2 OR -X-Y=-8 | X-Y=2.0 OR -X-Y=-8.0 |\n| * | Multiplication | X*=15 |\
    \ X*=15.0 |\n| / | Division | X/1 | X/1.66 |\n| % | Modulus Operator (Remainder)\
    \ | X%Y=2 | Not Applicable |\n\n### 4.1.1.1 Mixed arithmetic\n\nWhen one of the\
    \ operand is real and other an integer and if the arithmetic operation is carried\
    \ out on 2 operands then it is called as mixed arithmetic. If any one is of real\
    \ type then the result will always be 15/10.0 = 1.5.\n\n## 4.1.2 Relational Operators\n\
    \nOften it is required to compare the relationship between operands and bring\
    \ out a decision and program accordingly. This is when the relational operator\
    \ come into picture and the evaluated value is always either TRUE or FALSE. C\
    \ supports the following relational operators:\n\nThe following table shows the\
    \ Arithmetic operators:\n\n| Operator | Meaning | Example exp1=5 and exp2=3 exp1\
    \ relational operator exp2 |\n| :--- | :--- | :--- |\n| < | is less than | exp1\
    \ < exp2 ........FALSE |\n| <= | is less than equal to | exp1 <= exp2 ........FALSE\
    \ |\n| > | is greater than | exp1 > exp2 ........TRUE |\n| >= | greater than or\
    \ equal to | exp1 >= exp2......TRUE |\n| == | is equal to | exp1 == exp2 ........FALSE\
    \ |\n| != | is not equal to | exp1 != exp2 ........TRUE |\n\n## 4.1.3 Logical\
    \ Operators\n\nC has the following logical operators, they compare or evaluate\
    \ logical and relational expressions:\n\n| Operator | Meaning |\n| :--- | :---\
    \ |\n| && | Logical AND |\n| || | Logical OR |\n\nLogical AND (&&)\nThis operator\
    \ is used to evaluate 2 conditions or expressions with relational operators simultaneously.\
    \ If both the expression to the left and the right of the logical operator is\
    \ true then the whole compound expression is true.\n\nExample:\na > b && x ==\
    \ 10\nThe expression to the left is a > b and on the right is x == 10 the whole\
    \ expression is true only if both expressions are true i.e., if a is greater than\
    \ b and x is equal to 10.\n\nLogical OR (||)\nThe logical OR is used to combine\
    \ 2 expressions or the condition evaluates to true if any one of the 2 expressions\
    \ is true.\n\nExample:\na > m || a < n\nThe expression evaluates to true any one\
    \ of them is true or both of them are true. It evaluates to true if a is either\
    \ m or n or when a is less than both m and n.\n\nLogical NOT (!)\nThe logical\
    \ NOT operator takes single expression and evaluates to true if the expression\
    \ is false and evaluates to false if the expression is true. In other words it\
    \ just reverses the value of the expression.\n\nExample:\n! (x >= y) the NOT expression\
    \ evaluates to true only if the value of x is neither greater than or equal to\
    \ y.\n\n## 4.1.4 Assignment Operators\n\n| Assignment Operator | Statement with\
    \ simple assignment operator | Statement with shorthand operator |\n| :--- | :---\
    \ | :--- |\n| += | a = a + 1 | a += 1 |\n| -= | a = a - 1 | a -= 1 |\n| *= | a\
    \ = a * (n+1) | a *= (n+1) |\n| /= | a = a / (n+1) | a /= (n+1) |\n| %= | a =\
    \ a % b | a %= b |\n\n## 4.1.5 Increment and Decrement Operators\n\nThe increment\
    \ and decrement operators are one of the unary operators which are very useful\
    \ in C language. They are extensively used in for and while loops. The syntax\
    \ of the operators are given below:\n\n| Increment and Decrement Operators | Prefix\
    \ Notation | Postfix Notation |\n| :--- | :--- | :--- |\n| ++ | ++X | X++ |\n\
    | -- | --Y | Y-- |\n\nThe increment operator ++ adds the value 1 to the current\
    \ value of operand and the decrement operator -- subtracts the value 1 from the\
    \ current value of operand. The ++X and X++ mean the same thing when they form\
    \ statements independently; they behave differently when they are used in expression\
    \ on the right hand side of assignment statement.\n\n## 4.1.6 Conditional or Ternary\
    \ Operator\n\nThe conditional operator consists of 2 symbols the question mark\
    \ (?) and the colon (:) The syntax for a ternary operator is as follows:\n\n```\n\
    exp1 ? exp2 : exp3\n```\n\nThe ternary operator works as follows:\nexp1 is evaluated.\
    \ If exp1 is true, exp2 is evaluated and its value becomes the value of expression.\
    \ If exp1 is false, exp3 is evaluated and its value becomes the value of expression.\
    \ Note that only one of the expression is evaluated.\n\nExample:\n```\na = 10;\n\
    b = 15;\nx = (a > b) ? a : b;\n```\nwill be assigned to x.\n\n## 4.1.7 Bitwise\
    \ Operators\n\nC has a distinction supporting special operators known as bitwise\
    \ operators for manipulation at bit level. A bitwise operator operates on each\
    \ bit of data. Those operators are used for testing, complementing or shifting\
    \ bits to the right or left. Bitwise operators may not be applied to float or\
    \ double.\n\n| Operator | Meaning |\n| :--- | :--- |\n| & | Bitwise AND |\n| |\
    \ | Bitwise OR |\n| ^ | Bitwise Exclusive |\n| << | Shift left |\n| >> | Shift\
    \ right |\n\n## 4.1.8 Special Operators\n\nC supports some special operators of\
    \ interest such as comma operator, size of operator, pointer operators (&) and\
    \ member selection operators (.).\n\n## 4.1.9 Comma Operator\n\nThe comma operator\
    \ can be used to link related expressions together. A comma-linked list of expressions\
    \ are evaluated left to right and value of right most expression is the value.\
    \ Since comma has the lowest precedence in operators, the parenthesis is necessary.\
    \ Some examples of comma operator are:\n\nIn for:\nfor(n=0, m=10; n<m; n++)\n\n\
    In while loops:\nwhile (c=getchar(), x=x, y=t)\n\n## The size Operator\n\nThe\
    \ size operator gives the size of the data type or variable in terms of bytes\
    \ occupied in the memory. The operator is normally used to determine the lengths\
    \ of arrays and structures when their sizes are not known to the programmer. It\
    \ is also used to allocate memory space dynamically to variables during the execution\
    \ of the program.\n\nExample:\nm = sizeof(sum);\n\n## Arithmetic Expressions\n\
    \nAn expression is a combination of variables and constants written according\
    \ to the syntax of C language. In C, every expression results in some value of\
    \ a certain type that can be assigned to a variable. Some examples of C expressions\
    \ are shown in the table below:\n\n| Algebraic Expression | C Expression |\n|\
    \ :--- | :--- |\n| a - b | a - b |\n| (m + n) | (x + y) |\n| (ab / c) | a * b\
    \ / c |\n| 3x²+x+1 | 3*x*x+1 |\n| (x /y) + c | x / y + c |\n\n## Evaluation of\
    \ Expressions\n\nExpressions are evaluated using an assignment statement: Variable\
    \ = expression. Variable is any valid variable name. When the statement is encountered,\
    \ the expression is evaluated first and replaces the previous value of the variable\
    \ on the left hand side. All variables used in the expression must be assigned\
    \ values before evaluation is attempted.\n\nExample of evaluation statements:\n\
    ```\nx = a * b - c\ny = b / c * a\nz = a - b / c + d;\n```\n\n## 4.2.3 Precedence\
    \ in Arithmetic Operators\n\nAn arithmetic expression without parenthesis will\
    \ be evaluated from left to right using the rules of precedence of operators.\
    \ There are two distinct priority levels of arithmetic operators in C:\n\nHigh\
    \ priority: * / %\nLow priority: + -\n\n## 4.2.4 Rules for evaluation of expression\n\
    \nFirst parsed sub expression from left to right is evaluated. If parentheses\
    \ are nested, the evaluation begins with the innermost sub expression. The precedence\
    \ rule is applied in determining the order of operators in evaluating sub expressions.\
    \ The associativity rule is applied when two or more operators of the same precedence\
    \ level appear in the sub expression. Arithmetic expressions are evaluated from\
    \ left to right using the rules of precedence. When parenthesis are used, the\
    \ expressions within parenthesis have highest priority.\n\n## 4.3 Implicit Type\
    \ Conversion\n\nC mixes contents and variables of different types in an expression.\
    \ C automatically converts any intermediate values to the proper type that the\
    \ expression can be evaluated without losing any significance. This automatic\
    \ type conversion is known as implicit type conversion. The rules apply during\
    \ evaluating expressions: all short and char are automatically converted to int.\n\
    \n(1) If one operand is double, the other will be converted to double and result\
    \ will be long double.\n(2) If one operand is double, the other will be converted\
    \ to double and result will be double.\n(3) If one operand is float, the other\
    \ will be converted to float and result will be float.\n(4) If one of the operand\
    \ is unsigned int, the other will be converted to unsigned long int and result\
    \ will be unsigned long int.\n(5) If one operand is long int and other is unsigned\
    \ int then:\n  (a) If unsigned int can be converted to long int, then unsigned\
    \ int operand will be converted as such and the result will be long int.\n  (b)\
    \ Both operands will be converted to unsigned long int and the result will be\
    \ unsigned long int.\n(6) If one of the operand is long int, the other will be\
    \ converted to long int and the result will be long int.\n(7) If one operand is\
    \ unsigned int the other will be converted to unsigned int and the result will\
    \ be unsigned int.\n"
