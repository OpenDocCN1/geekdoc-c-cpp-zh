- md: "\n# Control Statements • 47\n\nThe general syntax is as below :\n\n```\nif\
    \ (expression)\nStatement;\n\nor\nif (expression)\n{\n    Block of statements;\n\
    }\n```\n\n```\nif (expression)\n{\n    Block of statements;\n}\nelse\n{\n    Block\
    \ of statements;\n}\n```\n\nIf we wish to have more than one statement following\
    \ if or the else, they should be grouped together curly brackets. Such a grouping\
    \ is called a compound statement or a block. Sometimes we wish to make a multi-way\
    \ decision based on several conditions. The most general way of doing this is\
    \ by using the if variant on if statement. This works by cascading several comparisons.\
    \ As soon as one of these gives a true result, the following statement or block\
    \ is executed, and no further comparisons are performed.\n\n```\nif (expression)\n\
    {\n    Block of statements;\n}else if(expression)\n{\n    Block of statements;\n\
    }else\n{\n    Block of statements;\n}\n```\n\n## 5.4 The Switch Statement\n\n\
    The switch statement provides a way of choosing between a set of alternatives,\
    \ based on the value of an expression. The general form of the switch statement\
    \ is:\n\n```\nswitch (expression)\n{\n    case constant1:\n    statements;\n \
    \   ...\n    case constant:\n    statements;\n    default:\n    statements;\n\
    }\n```\n\nFirst expression (called the switch tag) is evaluated, and the outcome\
    \ is compared to each of the numeric constants (called case labels), in the order\
    \ they appear, until a match is found. The statements following the matching case\
    \ are then executed. The plural: each case may be followed by zero or more statements\
    \ (not just one statement). Execution continues until a break statement is encountered\
    \ or all intervening statements until the end of the switch statement are executed.\
    \ The final default case is optional and is exercised if none of the earlier cases\
    \ provide a match.\n\n## 5.5 Loops\n\nThe other main type of control statement\
    \ is the loop. Loops allow a statement, block of statements, to be repeated. Computers\
    \ are very good at repeating simple tasks many times, the loop's C of achieving\
    \ this C gives you a choice of three types of loop: while, do and for.\n\n###\
    \ 5.5.1 While Loop\n\nThe while loop keeps repeating an action until an associated\
    \ test returns false. This is useful where the programmer does not know in advance\
    \ how many times the loop will be traversed.\nThe general syntax is as follows:\n\
    \n```\nWhile(Condition)\n{\n    Block of statements\n}\n```\n\n### Example:\n\n\
    ```\nint string_length(char string[])\n{\n    int i = 0;\n    while (string[i]\
    \ != '\\0')\n        i++;\n    return(i);\n}\n```\n\nThe string is passed to the\
    \ function as an argument. The size of the array is not specified, the function\
    \ will work for a string of any size. The while loop is used to look at the characters\
    \ in the string one at a time until the null character is found. The loop is exited\
    \ and the index of the null is returned. While the character is not null, the\
    \ index is incremented and the test is repeated.\n\n### 5.5.2 Do While Loop\n\n\
    The do loop is similar to while loop but the test occurs after the loop body is\
    \ executed. This ensures that the loop body is at least once before continuing.\
    \ Such a setup is frequently used where data is to be read. The test then verifies\
    \ the data, and loops back to read again if it was unacceptable.\n\nThe general\
    \ syntax is as follows:\n\n```\nDo\n{\n    Block of statements\n}\nWhile (Condition)\n\
    ```\n\n### Example:\n\n```\ndo\n{\n    printf(\"Enter 1 for yes, 0 for no :\"\
    );\n    scanf(\"%d\",&input_value);\n} while (input_value != 1 && input_value\
