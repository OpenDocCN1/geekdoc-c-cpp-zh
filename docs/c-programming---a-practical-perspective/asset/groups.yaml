    If you give a type tag name, then you can declare variables of enumerated type
    using

    enum tag variable-names;

    For example,

    enum Numbers x, y, z;

    declares three variables x, y and z, all of type Numbers (they are, infarct, integer
    variables).

    More precise, ''enum tag'' becomes a new type which is equal in rights with any
    built-in type.


