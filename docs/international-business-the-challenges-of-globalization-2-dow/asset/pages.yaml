    # Chapter One

    Globalization Today


    # Learning Objectives


    After studying this chapter, you should be able to


    +   1.1 Identify the types of companies active in international business.


    +   1.2 Explain globalization and the significance of global markets and production.


    +   1.3 Detail the forces that drive globalization.


    +   1.4 Summarize the main arguments in the debate about globalization.


    +   1.5 Identify the skills this course will help you develop for your career.


    # A Look at This Chapter


    This chapter defines the scope of international business and introduces to some
    of its most important topics. We begin by identifying the key players in international
    business today. We then present globalization, describing its influence on markets
    and production, and the forces behind its growth. Next, we analyze each main argument
    in the debate about globalization. This chapter


    closes by describing how this chapter can help develop your employability skills
    and by presenting a model of an integrated global business environment.


    # A Look Ahead


    Chapter 2 introduces us to ethics and key ethical situations companies confront
    in international business. We present the importance of corporate social responsibility
    and managing for all stakeholders in international business. We also discuss the
