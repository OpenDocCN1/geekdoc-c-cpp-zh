  md: '# PART 1 GLOBAL BUSINESS ENVIRONMENT


    # globalization


    globalization is the name we give to this trend toward greater economic, cultural,
    political, and technological interdependence among national institutions and economies.
    Cultural, political, economic, and legal events in one country affect the lives
    of people in other countries. Globalization is characterized by denaturalization
    (national boundaries becoming less relevant) and is different from internationalization
    (entities operating across boundaries).


    By knitting the world more tightly, globalization transforms the ways we do. But
    globalization is not on an unbeatable upward trajectory. It expands with increasing
    trade and investment, contracts with divestment of assets and reduced imports,
    and goes through periods of stabilization. Globalization underwent an unprecedented
    expansion from the 1940s until the financial crisis of 2008. Globalization is
    proceeding unevenly with alternating periods of expansion and contraction.


    People can approach globalization from different perspectives. A businessman sees
    globalization as an opportunity to source goods and services from lower-cost locations
    and to open new markets. A frontline employee might see it either as an opportunity
    for new work or as a threat to their job. An economist might want to examine the
    impact of globalization on jobs and standards of living. An environmentalist might
    be concerned with how globalization affects the natural environment. An anthropologist
    might see the influence of globalization on the culture of a group of people.
    And a political scientist might be concerned with the impact of globalization
    on the power of governments relative to that of multinational companies.


    Globalization presents challenges as well as opportunities. The fast cost of globalization
    and travel exposes us to the traits and patterns of other cultures. We might find
    practices offensive or threatening to our sensibilities and our way of life. We
    may discover new ideas and ways of doing things that enrich our lives. Globalization
    allows us to buy products from individuals and companies on the other side of
    the world easily and in. But this can harm businesses in our local communities
    and threaten our citizens'' livelihoods.


    Globalization today invites greater competition and forces companies to grow more
    competitive and from others others nations have lost ground, relatively speaking.
    Figure 1.2 shows the home country of each of the 500 largest companies in the
    world. We see the amazing rise of Chinese firms, going from none in the top 500
    in 1990 to 25 in 2020. We also see a decline in the number of US firms, peaking
    at 175 in top 500 in 2000 and 20 years later having. Japan lost more than half
    of its top spots from 1990 to around and half of Britain''s firms dropped off
    the list.


