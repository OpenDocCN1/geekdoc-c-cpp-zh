    # 1.2.1 Evolution of Globalization


    It is helpful to put today''s globalization into context. The first age of globalization
    lasted from the mid-1800s to World War I. In those days, travel was highly mobile,
    with 30,000 people traveling Europe each year in the 1800s and 1 million people
    leaving each year after 1900. Other in wartime, nations did not require permits
    for international travel until 1914. During this first age of globalization, trade
    and capital moved freely than ever before. Global companies from high-income nations
    extracted raw materials from lands and produced all sorts of goods. Large cargo
    ships sailed to deliver their manufactures to faraway markets. The transatlantic
    cable (completed in 1866) between Europe and the United States allowed news to
    travel faster than ever.


    How important was trade to the world economy in those days? To answer this question,
    we explore the ratio of total exports and imports of goods and services to world
    domestic product. Around 1880 the global trade-to-GDP ratio never exceeded 10
    percent. On average, countries traded around 20 percent of their total annual
    output. The second age of globalization began with the steamship, telegraph, railway,
    and later, the telephone and airplane.


    The first age of globalization ended with the arrival of the First World War,
