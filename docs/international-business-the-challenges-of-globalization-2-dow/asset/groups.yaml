    # RECENT EVENTS Throughout the 1990s and early 2000s, nations focused increasingly
    on expanding trade. The European Union grew to include additional countries and
    integrated their economies more deeply. The free trade agreement came into effect
    between Canada, Mexico, and the United States (which was revised in 2020). China''s
    entry into the World Trade Organization in 2001 made the country the de facto
    factor of trade. Western consumers outsourced labor-intensive jobs to China, which
    exported finished and intermediate goods to the rest of the world. China''s share
    of exports and volume of global trade grew with Taiwan, South Korea, and Japan,
    grew into the seemingly ever-expanding chains of global companies.


    By 2006, the global trade-to-GDP ratio had more than doubled since 1970, to around
    60 percent. So, on average, countries were reaching a remarkable 60 percent of
    their yearly output (see Figure 1.3). The global financial crisis in 2008 and
    led to a worldwide recession. Global trade in goods and services fell more than
    22 percent from 2008 to 2009. It was the most severe shock to hit the global economy
    since the Great Depression. The crisis shrank the global economy by 2.2 percent.
    Despite its severe decline, trade rebounded and within two years was back to 2008
    levels.


    Another set of trade was the trade war between China and the United States that
    started in 2018. The strategic relationship forced companies to re-examine their
    strategies of sourcing from China and their lengthy supply chains placed production
    and distribution activities at risk. In this fragile trade environment the pandemic
    in early 2020 and companies forced their supply chains closer to home. Consumers
    called for medical and other products to be made in their own countries which
    incentivized them to return production activities to home or move them them outside
    China.


    The pandemic and the economic shocks are likely to shrink the global economy by
    8 percent in 2020 (instead of 3 percent expected growth, the global economy shrank
    5 percent). The decline of global economy activity debt to globalization, which
    since began calling slowdown. Trade staged a strong comeback in 2021 from pent-up
    demand caused by economic lockdowns, slower growth and shipping delays during
    the Pandemic. The final toll by the pandemic is to be determined.


    MEASURING GLOBALIZATION Although we feel that it is possible to measure globalization,
    researchers have created ways to measure the extent of globalization. One index
    of globalization is the KOF Economic Index. This newly revised index ranks 43
    nations on three dimensions: economic, social, and political. By incorporating
    a wide variety of variables, the index captures turns and cycles in any stage
    and to capture the breadth and depth of globalization. Map 1.1 shows each nation''s
    score by the KOF Index of Globalization. Nations with higher scores occupy the
    top of the rankings. The United States appears in 25th place overall, and 49th
    in economic globalization, 21st in social globalization, and 15th in political
    globalization.


    The world''s least-globalized nations account for about half the world''s population
    and are found in Africa, Asia, South Asia, Latin America, and the Middle East.
    Some of the least nations are characterized by political instability. Other nations
    with large agricultural export commodities whose market prices are highly volatile
    and sometimes face trade barriers in developed countries which are highly dependent
    on exports and suffer erratic price swings in markets.


    Global business doesn''t simply involve one or two of the largest firms and all
    entrepreneurs, companies of all sizes get involved in international business.
    These businesses are the ones doing importing, exporting, and international investing.
    Commercial banks, financial markets, and other lenders, including private equity,
    providing financing for these business activities. Governments provide the boundaries
    for the kinds of activities companies can engage in and set the laws by which
    they operate. The actions of all parties are participating in the globalization
    of markets and production.


