    ## 全球业务环境


    ### 第一章：当今全球化


    #### 学习目标


    在学习本章后，你将能够：


    - 1.1 识别活跃于国际业务的公司。

    - 1.2 解释全球化以及全球市场和生产的重要性。

    - 1.3 详述推动全球化的力量。

    - 1.4 总结关于全球化辩论的主要观点。

    - 1.5 识别课程将帮助你发展的职业技能。


    #### 本章简介


    本章定义了国际业务的范围，并介绍了其中一些重要的主题。我们首先识别当今国际业务中的关键参与者。然后我们介绍全球化，描述其对市场和生产的影响，以及其增长背后的力量。接下来，我们分析全球化辩论中的每个主要观点。本章最后描述了本章如何帮助你发展就业能力技能，并展示了一个整合的全球业务环境模型。


    #### 展望


    第2章将向我们介绍伦理以及公司在国际业务中面临的关键伦理困境。我们介绍了企业社会责任以及在国际业务中管理所有利益相关者的重要性。我们还讨论了对可持续性和循环经济的推动。最后，我们处理了腐败、人权以及追求多样化、公平和包容性等其他关键问题。


