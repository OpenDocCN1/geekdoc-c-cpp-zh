    ## 1.4 Globalization Debate


    It comes as no surprise that globalization can have both positive and negative
    effects on people, businesses, and nations. Fruitful debate about globalization
    can promote dialogue about its merits and demerits and what emerges a more sober,
    less naive version of it. In this way, both sides in the debate could work together
    to harmonize the benefits of globalization while minimizing its costs.


    Still, those opposing globalization tend to hold up social and economic costs
    that support their arguments. These students sometimes have political agendas,
    which can color objectivity. A group''s aims can influence the choice of data
    to analyze, the time period to study, and so forth.


    Be as it may be, we present our coverage of the debate with the arguments about
    globalization''s impact on jobs and wages. We follow with debates about income
    inequality, culture, national sovereignty, and the environment.


    ## 1.4.1 Globalization Harms Jobs and Wages


    ## 1.4 Summarize the main arguments in the debate about globalization.


    Some groups claim that globalization eliminates manufacturing jobs in developed
    nations. They criticize international firms for globalizing their value chains
    and sending good-paying manufacturing jobs to developing countries where wages
    are lower. They argue that a label “Made China” translates into lower prices for
    TVs, sporting goods, and so on, but say it is estimated that the United States
    lost 6 million of its 17 million factory jobs from 2006 to 2010.


    Critics also argue that globalization lowers wages. When a manufacturing job is
    lost in a developed nation, the worker''s wage (assuming a new job is found) may
    pay less than the previous one. This decrease employment, morale, and wages. Critics
    force workers to accept lower wages and endure poor working conditions. They say
    that the wages for blue-collar jobs grew flat or only five percent since the 1970s
    is the era of globalization.


    Critics also argue that globalization exploits workers in lower-wage nations.
    These critics vehemently oppose the outsourced call centers of workers in Western
    companies. They say force Asians to disguise their nationality, adopt Western
    accents, and work night hours. Critics also say that labor''s power is diminished
    worldwide when companies operate in developing nations where labor laws are less
    and labor is less costly. Figure 1.5 shows that Western can outsource information
    technology work to emerging markets and reap great gains. International outsourcing
    remains as popular as these economic disparities exist. The average salary of
    a computer programmer in the West is many times more than that in China and Lithuania.


    ## 1.4.2 Globalization Improves Jobs and Wages


    Supporters make several arguments in favor of globalization. They say, that globalization
    increases wealth and efficiency in poor and developing nations. They argue that
    openness to international trade increases national production (by increasing efficiency)
    and raises per capita income (by passing savings to consumers). For instance,
    squeezing inefficiencies out of supply chains constraints and boosts productivity.
    They say removing all barriers to free trade would significantly boost worldwide
    economy and greatly benefit developing nations.


    # PART 1 • GLOBAL BUSINESS ENVIRONMENT


    ## 1.5


    ## Comparing Salaries of Information Technology Workers


    | United States | $49,692 |

    | Germany | $30,060 |

    | Singapore | $16,668 |

    | Brazil | $14,880 |

    | Taiwan | $14,580 |

    | Mexico | $10,632 |

    | Lithuania | $4,632 |

    | China | $3,024 |


    Source: Based on data obtained from the International Average Salary Database
    (www.worldsalaries.org).


    Globalization supporters believe globalization creates positive benefits by generating
    labor market flexibility in developed nations. Some claim that these are derived
    from worker dislocation, or "churning" as it is called when there is wider job
    turnover throughout. Flexible labor markets allow workers to be redeployed rapidly
    to sectors of the economy where they are highly valued and in demand. For example,
    this allows employees, workers to gain experience and skills with an initial employer,
    then move to a better job that is a better match for them.


    Those in favor of globalization argue that globalization and international outsourcing
    help developing nations'' economies and living standards. India became an attractive
    location for the software-writing operations of foreign firms because of its lower-cost,
    valued English-speaking technicians. Young graduates also find working in telephone
    call centers and in business support services. Young workers in the Philippines,
    too, are elevating their standards with good-paying imported jobs in areas of
    financial accounting, payroll, and benefit services.


    **SUMMARY OF THE JOBS AND WAGES DEBATE** Theory states that international trade
    (and by extension globalization) raises levels of living for nations but it does
    not affect all sectors of the economy. In developed economies, sectors that export
    high-value products will likely create jobs. So, this has been globalization''s
    track record. It has rewarded skilled workers who have higher value-added jobs
    with rising pay. Workers having lower-value jobs cannot compete with lower-wage
    nations and face job losses.


    The key point of difference between the two sides in the debate, is, whether the
    overall gains to a nation''s economy are worth the livelihoods of individuals
    who suffer. Those in favor of globalization say pay is the collective gain; against
    globalization it is not. A consensus today seems to be emerging that the need
    to do a better job settles the gains of globalization with workers who benefit
    less. This leads us to the next topic to discuss—Inequality


    ## 1.4.3 About Income Inequality


    No controversy swirling around globalization is more than the debate about role
    in inequality. After a long period of increased globalization in the 1990s and
    2000s, many people experienced hardship from the financial crisis of 2008 and
    the pandemic of 2020. Today, manufacturing stagnant wages for the middle class
    in developed nations is putting a spotlight on inequality and the need to make
    prosperity more inclusive.


    Globally, growth seems sluggish or nonexistent for the 49 percent of income earners
    between the bottom 50 percent and the top 1 percent from 1980 to today. Meanwhile,
    the top 1 percent of income earners saw their share of global income from 16 percent
    to 20 percent. And the top 0.1 percent of income earners captured as much growth
    as the entire half of the world''s earners. This increase at the very top is occurring
    globally and includes emerging markets.


    ![](img/b8206e554dbab0f7580dea1e1241bcc4_52_0.png)


    Globalization is sometimes blamed for contributing to inequality within nations.
    Some people say globalization benefits metropolitan and well-connected individuals
