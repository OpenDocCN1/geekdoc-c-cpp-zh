    Internet technology has risen to a new entity, the born global firm—a company
    with a global perspective that engages in innovation and quickly achieves a competitive
    advantage. Many of these companies (also global startups) become competitors within
    several years. They do not follow the traditional model of multinationals, which
    is to build a brand in the home market first and only later into international
    markets.


    Global firms have to innovate and use knowledge-based organizational capabilities
    that are difficult to emulate. They exploit these resources to build their competitive
    advantage over rivals. Lists of companies giants often include Airbnb, Uber, Spotify,
    Twitch, and TikTok. Born global firms emerged in the 1990s along with the expansion
    of the internet and the World Wide Web. It is global information technology (IT)
    infrastructure that enables these firms to rapidly expand using their well-designed
    apps and programs. For some practical insights into how companies succeed in international
    markets, see the Global Manager section.


    ## GLOBAL MANAGER The Keys to Global Success


    Making everything from 99-cent hamburgers (McDonald''s) to $150 million jet jets
    (Boeing), managers of global companies must overcome obstacles when competing
    in unfamiliar markets. Global managers acknowledge common threads in their approaches
    to management and offer the following advice:


    - Communicate Effectively. Cultural differences in business relationships and
    etiquette are critical to global business and operations. Global managers acknowledge
    and welcome uniqueness while demonstrating flexibility, respect, and empathy.

    - Know the Customer. Successful managers understand how different products serves
    the needs of international customers. They must ensure that the company remains
    flexible and capable enough to customize products that meets needs.

    - Emphasize Global Awareness. Good managers integrate business strategy from the
    outset. They ensure products and services are designed with global markets in
    mind and not used as dumping grounds for the home market''s outdated products.

    - Market Effect. The world will be a path to your better products. A poor marketing
    effort can cause products to fail into obscurity unless an international marketing
