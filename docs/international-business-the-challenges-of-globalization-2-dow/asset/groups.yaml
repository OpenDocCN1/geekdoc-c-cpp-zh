    # 第1章：总结


    ### 学习目标 1.1 识别国际业务中公司的活动类型。

    - 大多数国际业务是跨越两个或多个国家的商业交易。

    - 大多数国际业务由大型跨国公司（MNCs）进行，这些公司拥有强大的经济实力，交易额往往达数十亿美元。

    - 出生全球型企业（Born global firms）从成立起就采用全球视野并开展国际业务。他们倾向于拥有创新文化、基于知识的能力，并能提供竞争优势。


    ### 学习目标 1.2 解释全球化以及全球市场和生产的意义。

    - 全球化是经过扩张和收缩阶段走向更大经济、文化、政治和技术整合的趋势，各国贸易约 60% 的产出。

    - 市场全球化有助于公司 (1) 通过标准化营销活动降低成本，(2) 在本土市场较小或饱和时探索国际市场，以及 (3) 平衡收入流。

    - 生产全球化有助于公司 (1) 获取低成本劳动力并增强竞争力，(2) 获取技术诀窍，以及 (3) 获取在国内可能太昂贵的自然资源。


    # 全球业务环境


    ### 1.1.3 详述驱动全球化的力量。


    导致全球化加剧的背后的广泛力量是贸易和投资壁垒的降低以及技术创新。

    - 世界贸易组织（WTO）旨在支持贸易自由流动，帮助谈判市场开放并解决贸易争端。但其有效性在近年来较低。

    - 一些国家组成较小的区域性贸易协定，与较少国家进行谈判可能是一项更容易的任务。

    - 信息技术的创新使得在全球范围内移动数据、货物和设备变得更容易、更快速且成本更低。

    - 特定的创新包括电子商务、数字化、视频会议等通信工具以及运输技术的进步。


    总结关于全球化辩论中的主要论点。

    - 全球化反对者认为 (1) 发达国家的工作转移到发展中国家，(2) 降低发达国家的工资、工作安全感、士气和死亡率，(3) 剥削发展中国家，以及 (4) 降低劳动力的议价能力。

    - 全球化支持者认为 (1) 促进效率并增加收入，(2) 促进劳动力市场灵活性，(3) 在发展中国家创造提高生活水平的工作，以及 (4) 国家内部（但可能没有发达国家）的不平等融入全球经济。当一个国家拥抱世界贸易和投资时，不平等可能会减少。

    - 证据表明，发展中国家在全球化时代正蓬勃发展，去工业化并没有批评者所说的那么糟糕。

    - 一些全球化减少了国家主权。另一些人认为全球化帮助了民主在全球范围内传播并促进了许多全球问题的进展。

    - 看起来全球化并没有导致环境的“底部”，而是鼓励公司确保可持续性并与促进健康市场联系。


    识别本课程将帮助你职业发展的技能。

    - 本课程可以帮助你发展的就业技能包括知识的应用、反思性（批判性）思维、沟通以及伦理和社会责任。

    - 全球业务环境模型将帮助你理解当今国际业务的本质并辅助你的技能发展。

    - 全球化力量正在改变商业活动。全球化影响全球业务的每一个方面并增加了各处的竞争。企业必须对伦理、社会责任和可持续性保持警惕。

    - 各国家环境包含了独特的文化、政治、经济和法律特征，定义了每个国家的业务活动。

    - 国际业务环境影响公司的运营，而全球化进一步促进了贸易、投资和资本的流动。

    - 国际业务管理与国内业务大不同。公司需要预测业务环境中可能运作的事件和力量。


    **关键术语**

    - 出生全球型企业 (born global firm)

    - 数字化 (digitalization)

    - 数字转型 (digital transformation)

    - 数字化处理 (digitization)

    - 电子商务 (e-commerce)

    - 出口 (exports)

    - 外商投资 (foreign direct investment)

    - 关税与贸易总协 (General Agreement on Tariffs and Trade, GATT)

    - 全球化 (globalization)

    - 国内生产总值 (GDP)

    - 国民总值 (GNP)

    - 进口 (imports)

    - 国际业务 (international business)

    - 国际货币基金 (IMF)

    - 物联网 (Internet of Things, IoT)

    - 跨国公司 (multinational corporation, MNC)

    - 可持续性 (sustainability)

    - 世界银行 (World Bank)

    - 世界贸易组织 (WTO)


    # 讨论


    1-1. 为什么职场技能变得越来越重要？今天，国际业务人士必须从全球角度考虑生产和销售。许多全球经理最终发现自己在其他文化中生活和工作。公司可以做哪些准备？资源有限的企业如何准备？


    1-2. 国家政府可以通过降低贸易壁垒的协定影响全球化的进程。一些专家认为政府在全球经济中扮演的角色太大。你认为国家政府会变得更重要还是不那么重要？


    # 小组


    想象你和几个同学拥有一家制造眼镜的公司。为了降低成本，你们会决定将工厂从发达国家搬到一个更具效益的地方吗？


    1-3. 国家环境的哪些元素可能会影响你搬迁的决定？

    1-4. 搬迁后，你预计生产和营销全球化的哪些方面会让公司受益？


    # 伦理挑战


    你是一家美国服装公司的 CEO，该公司向海外服装制造商外包工作。一家承包商的员工报告每天工作 20 小时、最低工资、拥挤的居住条件、体体的主管以及没收员工护照导致他们无法辞职。当地官员表示劳动法得到了遵守和执行，尽管滥用现象似乎很普遍。你派遣检查员去涉事工厂，但他们没有发现违规行为。一个劳动倡导组织声称主管强迫员工向你的检查员隐瞒，并威胁如果他们说话就会后果。


    1-5. 你会实施一套监控系统来了解发生的情况吗？

    1-6. 你是帮助工厂改善条件、撤出在该国的业务，还是什么都不做？


    1-7. 你的行为可能会如何影响你的全球企业声誉、品牌形象和价值？

    1-8. 你的行为可能会如何影响与工厂老板的关系以及在该国开展业务的能力？


    # 写作作业


    1-9. 进军国际时，公司通常研究新地点作为潜在市场以及潜在的运营选址。从市场和生产全球化中，公司可以获得哪些具体利益？请解释。

    1-10. 全球化的反对者认为它对工作和工资、收入不平等、文化、主权和环境有许多负面后果。对于这些主题，全球化有哪些积极结果？


