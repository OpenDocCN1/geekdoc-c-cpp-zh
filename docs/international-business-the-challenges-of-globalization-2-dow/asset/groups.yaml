    ## 第一部分 全球业务环境


    ## 全球化


    全球化化是我们赋予这种国家机构和经济体之间经济、文化、政治和技术相互依赖性增强的趋势的名称。一个国家的文化、政治、经济和法律事件会影响其他国家的人的生活。全球化的特征是去自然化（国家边界变得不那么重要），它与国际化（跨边界运营的实体）不同。


    通过将世界更紧密地联系在一起，全球化改变了我们的行为。但全球化并非处于不可战的上升轨道上。它随着贸易和投资的增加而扩张，随着资产出售和进口减少而收缩，并经历稳定期。全球化从20世纪40年代到2008年金融危机经历了前所未有的扩张。全球化正不平衡地进行，交替着扩张和收缩时期。


    人们可以从不同的角度看待全球化。商人将全球化视为从低成本地区采购商品和服务以及开辟新市场的机会。一线员工可能将其视为新工作的机会，也可能是对其工作的威胁。经济学家可能想研究全球化对工作和生活水平的影响。环保主义者可能担心全球化如何影响自然环境。人类学家可能会看到全球化对群体文化的影响。政治科学家可能关注全球化对政府权力相对于跨国公司权力的影响。


    全球化既带来了挑战，也带来了机遇。全球化的快速成本和旅行使我们接触其他文化的特征和模式。我们可能会发现某些做法具有攻击性或威胁到我们的情感。我们可能会发现丰富生活的新想法和方式。全球化允许我们从世界另一边的个人和公司购买产品。但这可能会损害我们当地社区的业务并威胁公民的生计。


    今天的全球化引发了更激烈的竞争，并迫使公司提高竞争力，相对来说，其他国家失去了地。图1.2显示了世界上最大的500家公司的总部国家。我们看到中国企业惊人的增长，从1990年500强中的零到2020年的25家。我们也看到美国公司数量的下降，在2000年的500强中达到175家的巅峰，20年后。日本从1990年起失去了一半以上的席位，英国一半的公司退出了名单。


