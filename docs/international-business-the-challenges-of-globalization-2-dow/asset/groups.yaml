    自动化消灭了一些工作，但也创造了新的工作。到2030年，超过60%的雇员将需要不同的职业。这很可能是，但自动化应该带来更高水平技能的员工，作为客户的知识且信赖的顾问。未来最具竞争力的企业将专注于不断升级员工的技能，以跟上技术进步。许多新兴职业将在人工智能、云计算、数据分析和流程自动化等领域寻求员工。


    这门课程将帮助你个人在全球范围内日益增长的经济中成功。今天公司对员工的职场技能包括知识应用、反思性思维和沟通技能等。配套材料和作业将帮助你发展这些能力和职场技能。


    ![](img/b206e554dbab0f7580dea1e241bcc4_56_0.png)

    Ramixel.com/Shutterstock


    知识应用技能是指学习一个概念并将其适当另一个环境以获得更高层次的理解的能力。这将应用于你在众多作业、项目、小型案例以及此本书开发的市场进入策略项目中的分析推理和研究技能。你将学到，全球业务的核心是一个经历、学习、应用知识以及评估成功或失败的过程。在整个课程中，你将有机会解释公司为什么因为其采取或未采取的而成功或失败。


    反思性（批判性）思维涉及强大的以目标为导的思维，用于定义和解决问题、做出决策或对一系列情况形成判断。这门课程将帮助你发展这一关键技能。你将使用反思性思维展示国家如何设计其政治、经济和法律体系来处理复杂的安排，以实现国家及其人民特定的优先级。通过本书，你将学会从业务经理的角度思考，并做出决策或解决今天业务中常见的难题。密切相关的技能是分析性思维，它涉及遵循模式得出结论。


    这门课程还将帮助你提高沟通技能。沟通是使用口头、书面和自然语言以及技术有效地交流思想。在国际范围内，业务跨国界、语言和文化工作。在另一种语言和文化中理解他人的思想必须是一种挑战性且有回报的方式。你将读到哪些适当的沟通导致了成功的交易，哪些不当的沟通导致了各种失败。你将看到经理第一次在海外任务中如何与他人合作、保持灵活性并管理妥协以成功。


    对伦理和社会责任的知识是这门课程将帮助你提高的另一项职场技能。我们将这些概念定义为影响个人和组织在社会中行为的一系列指导原则。在整个课程中，当你遇到个人伦理责任和推理的问题时，以及经理在做出伦理决策后的表现。你还将读到公司在人权、公平贸易和可持续发展等话题面临的社会责任。


    为了帮助你在学习这门课程时开发这些和其他职业技能，我们创建了一个独特的组织框架来帮助你概念化国际业务。我们将其称为全球业务环境。


