    加利福尼亚州，CERTINO——Apple iPhone 是世界上第一款智能手机，为人们提供了前所未有的移动计算能力。Uber 和 Lyft 的商业模式完全基于智能手机技术。TikTok
    等公司和 WhatsApp 等应用程序的成功归功于智能手机的普及。史蒂夫·乔布斯（Steve Jobs）解释说，iPhone 中的“i”指的是互联网，但也代表*个人、指令、信息和启发*。


    苹果约 80% 的收入来自美国境外。全球化让苹果受益巨大，为其战略的核心。全球化生产允许苹果在全球范围内采购零部件和组件，并在成本效益最高的地方组装设备。根据生产设备的不同，苹果数百家供应商分布在多达50个国家。全球化意味着苹果可以在无需或几乎无需修改的情况下在全球销售其产品。


