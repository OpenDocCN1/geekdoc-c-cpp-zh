    国际业务环境以微妙和不那么微妙的方式影响着当前的运营。在国界日益通透的长期趋势驱动下，业务活动完全沉浸在国际业务环境之中。全球化的驱动因素导致贸易、投资和资本的流动增长并变得更加明显——往往导致城市同时在生产基地和新市场之间发生转移。当今的企业感受国际业务的脉搏，以观察它可能如何影响自己的运营。这构成了本书的第
