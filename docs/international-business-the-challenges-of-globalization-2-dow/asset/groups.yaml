    # 第一章 · 当今全球化


    仅仅是所有各个国家 GDP 数值的总和。GDP 是一个比国民总产（GNP）稍窄的指标——即一个国家在一年内通过国内和国际活动产生的所有商品和服务的价值。GNP
    包含了从出口以及其公司的国际业务中产生的收入。一个国家的人均 GDP 或 GNP 是其 GDP 除以总人口。


    **国民总产 (GNP)**

    一个国家在一年内通过国内和国际活动产生的所有商品和服务的价值。


    **人均 GDP 或 GNP**

    一个国家的 GDP 或 GNP 除以其人口。


    ## 1.2.1 全球化的演变


    将当今的全球化置于背景中是有帮助的。全球化的时代从 19 世纪 50 年代中期持续到第一次世界大战。在那时，旅行非常频繁，1800 年代每年有 30,000
    人前往欧洲，1900 年以后每年有 100 万人离开。战争期间，各国直到 1914 年才不需要国际旅行许可。在球化的第一个时代，贸易和资本的流动比以往任何时候都更加自由。高收入国家的全球公司从土地提取原材料并生产各种商品。大型货轮航行将制制品运往遥远的市场。欧洲和美国之间的大西洋电缆（于
    1866 年建成）让新闻传递得比以往任何时候都快。


    在那个时代贸易对世界经济有多重要？为了回答这个问题，我们探讨了商品和服务的进出口总额占世界国内总产值的比率。1880 年左右，全球贸易占 GDP 比重从未超过过
    10%。平均而言，各国贸易额占其年度总产出的约 20%。全球化的第二个时代随着蒸汽轮、电报、铁路以及后的电话和飞机的出现而开始。


    全球化的第一个时代随着 20 世纪 20 年代初第一次世界大战、俄国革命和大萧条的到来而结束。商品、资本和人的巨大流量变成了细细流。从第一次世界大战到苏联与美国之间的冷战，世界保持分裂了
    75 年。东西方的分歧是共产主义与资本主义之间的意识形态分歧。1945 年后，商品和资本的国际流动被限制在各自的资本主义和共产主义体系内。图 1.3 显示，全球贸易占
    GDP 比重在 1970 年增长到 27%。现在各国贸易了其年度产出的 27%——在 100 年中增加了 17 个百分点。


    全球化的第二个时代大约于 1989 年左右，随着分裂的共产主义东欧和柏林西林的崩溃而开始。一个接一个，中东欧国家拒绝了共产主义并转向自由市场经济体系。直到
    20 世纪 90 年代，国际流量在绝对总量上恢复到第一次世界大战之前的水平，但全球经济已经重生。全球化第二个时代的驱动因素包括通信卫星、光纤和互联网。


    ![](img/b8206e554dbab0f7580dea1e1241bcc4_37_0.png)


    ## 近期事件


    在整个 20 世纪 90 年代和 21 世纪初，各国日益关注扩大贸易。欧盟包含了更多国家并更深入地整合了它们的经济。加拿大、墨西哥和美国之间的自由贸易协定生效（该协定于
    2020 年进行了修订）。中国于 2001 年加入世界贸易组织，使中国成为事实上的贸易要素。西方消费者将劳动密集型工作外包给中国，中国向世界其他地区出口成品和中间品。中国的出口份额和全球贸易量随着台湾、韩国和日本一起增长，进入了看似不断扩张的全球公司链。


    到 2006 年，全球贸易占 GDP 比重自 1970 年以来增加了一倍多，达到约 60%。因此，平均而言，各国贸易额达到了其年度产出惊人的 60%（见图
    1.3）。2008 年全球金融危机引发了全球衰退。全球商品和服务贸易从 2008 年到 2009 年下降了 22% 以上。这是自大萧条以来对全球经济最严重的冲击。


