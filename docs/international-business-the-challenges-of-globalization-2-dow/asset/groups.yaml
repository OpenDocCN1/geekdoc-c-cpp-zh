    # Dear Friends and Colleagues,


    As we roll out the new edition of International Business, we thank each of you
    who provided suggestions to enhance our text. This new edition reflects the advice
    and wisdom of many dedicated reviewers and instructors. Together, we created the
    most readable, concise, and innovative international business text available today.


    As teachers, we know how important it is to select the right materials for our
    course. Instructors say this text''s clear and lively writing style helps students
    learn and appreciate international business. Our approach also includes a concise
    and clutter-free style. This is a competitive advantage that will never be sacrificed.


    International Business is now available in Revel, a powerful interactive learning
    platform. Fully digital, Revel blends our author-created narrative media, and
    assessment. Revel is mobile so students can learn anytime, anywhere, on any device.
    Even if you assign International Business as an ebook or printed revel, students
    will benefit from this text''s learning platform.


    We owe the success of this text to you, our colleagues and our students who keep
    focused on evolving educational needs. In this era of rapid global change, we
    continue to instill in our students a passion for international business and equip
    them with the skills and knowledge needed to compete. Please accept our heartfelt
    thanks and know that your input is reflected in everything we write.


    John J. Wild


    Kenneth L. Wild'
