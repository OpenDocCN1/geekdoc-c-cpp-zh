    cultures emphasize.

    - Multicultural: Managers may need to adapt their style when working in different
    cultures. After learning about an unfamiliar culture''s social structure, a manager
    can help employees to work in an unbiased way.

    - Flexibility: The more behavioral the issue, the greater the manager must be
    flexible. Implementation in different cultural areas requires a flexible approach
    to ensure success.


