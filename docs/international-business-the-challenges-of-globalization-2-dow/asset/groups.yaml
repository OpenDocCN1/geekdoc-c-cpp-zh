  mdcn: "\n\n# 前言\n\n欢迎阅读《国际商务：全球化的挑战》第十版。与之前的版本一样，本书的内容是根据广泛的市场调查、章节回顾以及与大量授课教师和学生的往来不断演变而来的。我们非常高兴看到，绝大多数教师和学生都认同我们处理国际商务的方法。该书在美国及全球范围内的反响已经超出了所有人的预期。\n\
    \n本书是学生在国际商务之旅中最可靠的伴侣。它通过让国际商务思维引人入胜且易于理解，来激励读者。它强调了文化和环境因素在国际商务中的核心作用。每一章都融入了现实世界的讨论，并将底层理论应用在恰当的背景中。术语的使用游刃有余，理论的解释也直观且简洁。本书的视觉风格既创新又含蓄，平衡了照片、插图和专题内容的使用。其结果是设计易于阅读且整洁无乱。\n\
    \n# 本版新内容\n\n- * Revel 数字化课程。Revel 增强了学生积极参与学习国际商务的能力。Revel 将我们作者编写的叙述、媒体和资源整合在一个连续的体验中，提供了引人入胜的结合。互动内容和评估为学生提供了探索和应用概念的机会。Revel\
    \ 支持移动端，学生可以随时、随地、通过任何设备进行离线学习。\n- 新第 2 章：伦理、社会责任与可持续性。本章用清晰、易懂的语言解释了伦理商务的道德基础。它描述了国际经理如何应对伦理困境，并以对所有利益相关者负责的方式进行管理。它还介绍了追求可持续性和更具创造性的经济的动力。本章还讨论了全球背景下的多样性、公平性和包容性。\n\
    - 简化了第 10 章国际金融市场的的外汇复杂性。学生在外汇方面很吃力，因此我们删除了核心章节课程。这里提供了对报价货币和基准货币、直接和间接汇率的解释，以及计算附录。还删除了可以在网上轻松找到的长篇汇率表。\n\
    - 修订并简化了第 11 章国际市场体系中的经济理论。反馈帮助我们学生理解定价和购买力平价中法律的复杂性。这些理论的涵盖被高度压缩，现在侧重于基本的、必须掌握的方面。每个理论都以其标志性的直观、简单且不复杂的示例呈现。\n\
    - 新增并显著修订了针对高关注公司的在线短记和案例研究。每个公司简介都预览了该章节涵盖的主题。示例包括 Apple、Netflix、Spotify、TikTok、Tesla、王旺（Wang）、印度的\
    \ Paytm 以及荷兰的 Tony's Chocolonery。许多章节选择了具有这些特点的公司。\n- 数字化经济中的就业技能。文本、小组项目、辩论、书面练习和案例研究有助于学生增强能够增加他们在数字经济中价值的技能。本版扩大了学生发展关键技能的机会，包括知识的应用与分析、反思性（批判性）思维、沟通以及伦理理解和社会责任等。\n\
    - 新的艺术和媒体计划。新的地图、插图、图表、表格、照片和视频让国际商务变得生动。\n\n# 本版各章节变化\n\n## 所有章节\n\n- 每章的开头都有新的和更新的章节简介\n\
    - 每章的结尾都有新的和更新的案例\n- 用新而有趣的示例说明概念\n- 全书贯插新的地图、插图、图表、表格和照片\n- 第 1 章之后的所有章节都经过了修订（旧的\
