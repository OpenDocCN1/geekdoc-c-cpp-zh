    # Ethical Challenge


    You are the CEO of a US apparel company that contracts work to garment manufacturers
    abroad. Employees of one contractor report 20-hour workdays, pay minimum wage,
    overcrowded living conditions, physically abusive supervisors, and confiscation
    of workers'' passports so they cannot quit. Local officials say labor laws are
    adhered to and enforced, though abuses appear widespread. You send inspectors
    to the offending factory, but they find no labor violations. A labor-advocacy
