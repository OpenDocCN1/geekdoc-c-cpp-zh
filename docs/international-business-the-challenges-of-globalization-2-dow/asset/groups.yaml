    # GLOBAL BUSINESS ENVIRONMENT


    1.1.3 Detail the forces that drive globalization.


    1.1.3 Detail the forces that drive globalization.

    * The broad forces behind increased globalization are falling barriers to trade
    and investment and technological innovation.

    * The World Trade Organization (WTO) is designed to support the free flow of trade,
    help negotiate the opening of markets, and settle trade disputes. But its effectiveness
    has been lower in recent years.

    * Some nations forming smaller, regional trade agreements negotiating with fewer
    nations can be an easier task.

    * Innovations in information technology are making it easier, faster, and less
    costly to move data, goods, and equipment around the world.

    * Specific innovations include e-commerce, digitalization, communication tools
    such as videoconferencing, and advancements in transportation technologies.

    * Summarize the main arguments in the debate about globalization.

    * Globalization opponents say (1) developed-country jobs to developing countries,
    (2) decreases wages, job security, morale, and mortality in developed nations,
    (3) exploits developing nations, and (4) reduces the bargaining power of labor.

    * Globalization supporters say (1) fuels efficiency and increases incomes, (2)
    promotes labor market flexibility, (3) creates jobs in developing nations that
    elevates living standards, and (4) inequality within a nation (but perhaps no
    developed nation) integrates into the global economy. Inequality can decrease
    when a country embraces world trade and investment.

    * Evidence suggests that the countries of developing nations are thriving in an
    age of globalization and that deindustrialization is not as badly as critics say.

    * Some globalization reduces national sovereignty. Others say globalization has
    helped democracy spread worldwide and has aided progress on many global issues.

    * It seems globalization has not caused an environmental “bottom,” but encourages
    firms to ensure sustainability and connection to fostering healthy markets.

    Identify the skills this course will help you for your career.

    * The employability skills this course can help you develop application of knowledge,
    reflective (critical) thinking, communication, and ethics and social responsibility.

    * The global business environment model will help you to understand the nature
