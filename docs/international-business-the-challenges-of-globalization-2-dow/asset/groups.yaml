    - 个人空间：考虑在你的文化中多大的距离被认为是适当的。有些人认为男女之间的物理距离。

    - 名片：在亚洲，通常用名片代替鞠躬，用双手。在某些地方，将名片放在桌子上稍后处理。见面时避免在上面写字。


