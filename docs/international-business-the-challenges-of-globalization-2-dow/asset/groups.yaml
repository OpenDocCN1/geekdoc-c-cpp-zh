    ## 主动学习工具


    教师需要一套全面的工具来评估学生对概念的理解情况。本书书中精心挑选的作业跨越了各种复杂程度，以测试学生的知识以及应用关键原则的能力。评估通常具有经验性性质，帮助学生培养制定决策的能力。这些主动学习工具帮助教师评估学生的学习进展。


    - 每个学习目标末尾的“快速学习”（Quick Study）检查可以核实学生已经学习了关键概念并正在继续学习。在 Revel 教材中，学生可以获得其答案的即时反馈。

    - “团队合作”（Team Up）项目超越了课本范围，要求学生通过采访、研究其他国家、课堂辩论或在小组讨论环节中聚在一起进行团队协作。

    - “谈一谈”（Talk About It）提出了涉及企业家、经理、政策制定者、消费者及其他人的重要问题。这些可以作为作业布置，也可以用于课堂讨论。


    ## 谈一谈


    1- 公司及其员工正处于社交媒体的焦点。如果一个所有者要为他人犯的错误承担后果，他们是否应该承担个人责任以避免伦理失范？伦理在管理中有多重要？

    2. 与利益相关者分享利益是一项艰巨的任务，对小微企业而言尤其如此。他们如何平衡满足最重要的需求？考虑全球经济有哪些好处？

    3- 循环经济的优点是什么？它是全球经济唯一负责任的发展道路吗？世界是否可以更多地向意识时尚思考？选择一家已经迈出这一步的公司。哪些具体的事情有助于提高其质量？


    - “伦理挑战”（Ethical Challenges）让学生扮演经理、政府官员或其他个人的角色，考虑他们将如何对所提出的伦理困境做出反应。

    - “练习国家管理案例”（Practicing National Management cases）允许学生分析并解决每章中提出的真实公司情况和问题。


