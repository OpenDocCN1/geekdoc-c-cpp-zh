    # Preface


    Welcome to the tenth edition of International Business: The Challenges of Globalization.
    As in previous editions, this text evolved from extensive market surveys, chapter
    reviews, and correspondence with scorers of instructors and students. We are delighted
    that an overwhelming number of instructors and students agree with our approach
    to international business. The reception of this text in the United States and
    across the world has exceeded all expectations.


    This text is the most reliable yet available to accompany students on their journey
    through international business. It motivates the reader by making international
    business thought-provoking and accessible. It embraces the central role of culture
    and environmental factors in international business. Each chapter is infused with
    real-world discussion, with underlying theory applied in the background where
    it belongs. Terminology is used effortlessly, and theories are explained in direct
    and concise terms. This text''s visual style is innovative yet subtle, and balances
    the use of photos, illustrations, and features. The result is an easy-to-read
    and clutter-free design.


    # New to this Edition


    +   * Revel digital course. Revel improves empowering students to actively participate
    in studying international business. Revel delivers an engaging blend of our author-created
    narrative, media, and assets in one continuous experience. Interactive content
    and assessments give students opportunities to explore and apply concepts. Revel
    is mobile so students can learn anytime, anywhere, on any device and offline.

    * New Chapter 2: Ethics, Social responsibility, and Sustainability. This chapter
    explains the moral foundations of ethical business in clear, accessible terms.
    It describes how international managers contend with ethical dilemmas and manage
    in a socially responsible manner for all stakeholders. It also presents the drive
    towards sustainability and a more creative economy. The chapter addresses diversity,
    equity, and inclusion in a global context.

    * Reduced complexity of foreign exchange in Chapter 10: International Financial
    Markets. Students struggle with foreign exchange, so we removed the core chapter
    lessons. Here are explanations of quoted and based currencies, direct and indirect
    exchange rates, and appendix of calculations. Also removed the lengthy currency
    table easily found online.

    * Revised and simplified economic theories in Chapter 11: International Market
    System. Feedback helps us students struggle with the complexity of the law in
    one line of pricing and purchasing power parity. Coverage of these theories is
    highly condensed and now focuses on the essential, need-to-know aspects. Each
    is presented in trademark straightforward and simple uncomplicated examples.

    * NEW and significantly revised online vignettes and case studies of high-interest
