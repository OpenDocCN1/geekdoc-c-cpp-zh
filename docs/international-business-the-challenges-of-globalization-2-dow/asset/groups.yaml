    ## 1.4.5 Globalization and National Sovereignty


    National sovereignty generally involves the idea that a nation-state (1) is autonomous,
    (2) can freely select itself, (3) cannot interfere in the affairs of other nations,
    (4) can control movements across its borders, and (5) may enter into binding international
    agreements. Opposition groups argue that globalization erodes sovereignty and
    encroaches on the authority of local and state governments. Supporters disagree,
    saying that globalization spreads democracy worldwide and national sovereignty
    must be viewed from a long-term perspective.


    **MENACE TO DEMOCRACY?** A main argument leveled against globalization is that
    it empowers supranational institutions at the expense of national governments.
    It is not disputed that the WTO, the IMF, and the United Nations are led by not
    democratically elected representatives. What is debatable, is whether these organizations
    impose upon the citizens of sovereign nations. Critics argue that such organizations
    undermine democracy and individual liberty by undermining the political and legal
    authority of national, regional, and local governments.


    Opponents of globalization also cite the risk of national political authorities
    to enter binding international agreements on behalf of citizens. Critics charge
    that such agreements violate the sovereignty of local, regional, and national
    governments. In 1973 Britain joined the group of nations that would become the
    European Union (EU). But later left the block in 2016 after a slim majority of
    citizens voted to leave in a referendum. Voting to leave the EU showed that the
    agreement was becoming too much of a political organization that could supersede
    British law. The laws that govern British lives were to be enforced and in the
