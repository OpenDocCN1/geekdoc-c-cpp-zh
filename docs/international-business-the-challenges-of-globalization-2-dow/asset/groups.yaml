    \ Watch、Apple News+和Fitness+。可穿戴设备、Apple Watch、AirPods、HotPod和HomePod产生了约310亿美元的收入。\n\
    \n国际业务的一个理论认为，国家应该生产其具有比较优势的产品，然后与其他国家贸易他们不具备的东西。对于苹果和美国来说，这意味着他们生产需要劳动密集型部件和组装的产品（如电子产品），并出口高附加值的产品（如iPhone）。\n\
    \n全球化帮助了苹果快速增长，其业务模式高度依赖零部件。苹果的组件来自涵盖50个国家的全球制造网络，取决于劳动力成本最低的地方以及可以雇佣工人的地方。苹果将零件组装并运往成本最低的地方。通过台湾制造商富士康（Foxconn），苹果在中国郑州的州的工厂每天生产数千台设备。富士康为40万名工人建造了高科技设施，这本身就是一家价值100亿美元的工厂。苹果在世界其他地方都无法找到这种规模的工厂和这种程度的合作。\n\
    \n苹果的生产战略高度依赖劳动力。相比之下，中国的劳动力成本比iPhone的总成本低了约90%。最大的成本产生在加利福尼亚州，苹果在那里负责设计、工程和营销任务。另一个原因是苹果在中国生产，因为那里的一些组件就位于那里，且可以廉价买到零件。中国的收入至关重要。苹果也依赖中国。中国的销售收入从2010年的28亿美元增长到2015年的590亿美元，随后在2020年下降到约400亿美元。\n\
    \n苹果将中国作为其战略的基石既有优势也有缺点。首先，随着工厂工作涌入中国，劳动力需求增加，成本随之上升。苹果通过将部分组装转移到越南和其他劳动力成本更的国家来应对。美国的一些商界和政界人士开始将中国称为“战略对手”。中美紧张关系加剧，这两个超级大国处于贸易战中。美国随后对苹果的竞争对手华为实施制裁。\n\
    \n第三，在2020年政治局势变化后，中美关系进一步恶化。两国的民族主义情绪升温。美国政府鼓励中美经济进行“链条重构”倡议，或“脱钩”。金融机构被告知由于几个原因不要向中国外包，包括指控侵犯人权、对苹果分包合同条件的担忧以及网络安全。苹果在中国的应用商店甚至一度移除过原生应用，这些应用曾允许中国互联网用户绕过中国未经审查的互联网。\n\
    \n苹果对所有这些应对措施是将部分iPhone生产移至越南和印度，并将部分扬声器、耳机的组装移至马来西亚。将中国作为生产基地并不是（至少不是）唯一的，但它是无可争议的单一国家之外生产优势。东南亚是他们计划扩大许多产品生产的地方。\n\
    \n当政府制裁华为时，一系列中国智能手机向消费者推销了非品牌手机。小米、OPPO和Vivo等设备制造商迅速改进了设备和相机，并以更低价格的手机与苹果竞争。这三家公司实现了三位数的增长，现在各占据中国智能手机市场约20%的份额。\n\
