    AirPods，听着 BBC 广播电台制作的快速早餐节目。你穿上印度制造的 Calvin Klein T 恤和牛仔裤，穿上越南制造的 Vans 鞋子。你出门，开进那辆在阿拉巴马州制造的韩国现代汽车。你开车去星巴克点餐，点用哥伦比亚和埃塞俄比亚收获的咖啡豆做的拿铁。你的这一天才开始一小时，但从某种意义上说，你已经进行了一次环球。在回路上快速看一眼“市场”，你现在就有能力展示国际业务交易的实力了。这些产品每一个是如何设计的，以及每一个是如何成为你可以购买的，都是国际业务交易的结果。


    ## 国际业务


    跨越两个或多个国家国界的商业交易。


    国际业务是跨越两个或多个国家国界的商业交易。你不需要远看就能找到国际业务的证据。我们每个人的生活以我们并不经常定义的方式参与其中。无论你住在哪里，你都被进口产品包围——在国外购买的商品和服务，并且每天花部分时间使用本国的出口产品——卖到国外的商品和服务。每年，全球出口增长约
    19 万亿美元，出口服务价值近 6 万亿美元。为了对比，这一商品出口的数字是全球平均水平的 36 倍。


    ## 进口


    从国外进入国家的商品和服务。


    ## 出口


    卖出国家的商品和服务。


    本书描述了国际业务中经理的工作和责任。它涵盖了影响国际业务的极其广泛的话题。我们首先对该主题进行概述，并介绍国际业务中的主要参与者。接下来，我们讨论了全球化对市场和生产的强大影响，并解释了这种扩张背后的力量。然后我们涵盖了关于全球化讨论的每个主要观点，包括工资、收入不平等等等，我们解释了这将如何帮助你培养职业能力技能，如知识的应用、反性思考、沟通和伦理。最后，我们通过展示全球业务环境的整合模型，解释了为什么国际业务是特殊的。


    # 1.1 引言和主要参与者


    ### 1.1 识别国际业务中公司的类型。


    国际业务植根于各国家的文化、政治、经济和法律现实。国际业务的研究涉及学习政府政策、公司活动、工人、经理以及普通人的社会生活，以及一系列社会问题。人是每一个主题的核心，这使得国际业务成为了一场充满活力且令人兴奋的发现之旅。


    国家之间存在国际合作时期，也有冲突时期。一些国家质疑国际贸易和外国投资政策，而另一些时候又发现自己正在合作。地缘政治紧张或合作对国际经理、工人和消费者产生连锁反应。国际政治的起伏是国际业务的标志。每一代人都有自己的问题，今天的国际业务在新的现实范围内面临着挑战和机遇。


    中美关系经历了一段艰难时期。这在很大程度上归于这些国家之间文化以及政治和经济体系的差异。美国禁止美国公司与中国领先的公司华为做生意。然而，华为认为拒绝出口许可主要是因为担心中国领导人可能利用华为进行间谍活动。随后，圣何塞的超微公司（Super
    Micro）向美国企业出售的计算机服务器中，芯片内含有隐藏代码，作为额外的芯片会向中国情报机构发送信息。这类事件加强了对全球供应链进行更严格控制以及减少地缘政治风险的呼声。


    公司供应链的脆弱性已显而易见。许多行业不再维持大量的零件库存，而是依赖供应商将零件交付到


    # 第一章 · 当今的全球化


    第一次工业革命由蒸汽机驱动，第二次由电力驱动，第三次由数字技术驱动。这第四次工业革命由人工智能、生物技术、量子计算等驱动。它正在融合数字、物理世界和生物世界，并创造出自动驾驶车辆、智能工厂中的机器人手臂和其他创新。第四次工业革命如何改变公司的生产、营销和管理活动？


    Jennow/Sutterstock


    ![](img/b8206e554dbab0f7580dea1e1241bcc4_33_0.png)


    生产流程，正如它们需要的时候那样。全球半导体短缺源于 2020 年对消费电子和电动汽车的需求。这导致制动系统和仪表盘显示器的短缺，迫使通用汽车、大众等制造商临时关闭工厂。芯片短缺导致全球汽车行业在2021
    年少产了至少150 万辆汽车。运输延迟和短缺冲击了各种产品的供应。公司开始通过供应链多样化和回归国内市场来寻求保护。


    在全球范围内，新冠肺炎导致许多企业倒闭，而企业家和公司努力为企业、医院、学校和个人提供服务。疫情改变了我们学习、工作、用餐、社交和娱乐的方式。几乎在，“上学”和“上班”意味着要在家里找一个安静的地方使用笔记本电脑或手机进行在线课程和会议。人的工作是身份认同的重要组成部分，并帮助他们决定生活水平和生活的各个方面。疫情允许许多白领员工居家办公。疫情后，一些人采取了居家和办公室的混合安排。蓝领工人和一线员工在疫情期间仍需上班。一些公司向他们发放奖金，以感谢他们维持社会基本服务的运转。


    国际业务也关乎员工和经理的工作。他们领导团队的方式受企业文化驱动。存在相似之处，但文化有助于决定领导者如何激励和实现业务目标。领导力在任何地方都既是艺术也是科学。其他文化背景的经理需要了解激励团队投入工作的关键。一个不了解当地信仰的外派经理可能会降低其成功几率。


    火热的数字经济是企业对员工所要求的技能的转型。公司进行数字化以有效利用数据，在各种运营中工作并变得更加复杂。反之，员工被鼓励学习一系列技术和社交技能并进行终身学习。


    我们将在第一章和整本书中触及这些及其他话题。因此，让我们从探索参与国际业务的公司类型开始我们的旅程吧。


