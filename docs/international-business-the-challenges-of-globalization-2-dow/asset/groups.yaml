    ## Tools for Active Learning


    Instructors need a comprehensive set of tools to evaluate students'' understanding
    of concepts. Carefully chosen assignments in this text span the full range of
    complexity to test students'' knowledge and ability to apply key principles. Assessments
    are often experiential in nature to help students develop decision-making skills.
    These tools for active learning help instructors to evaluate student progress.


    - Quick Study checks at the end of each learning objective verify that students
    have learned key concepts and are moving on. In the Revel text, students obtain
    immediate feedback on their answers.

    - Team Up projects go beyond the text and require students to collaborate in teams
    through interviews, research other countries, in-class debates, or come together
    in breakout sessions.

    - Talk About It raises important issues concerning entrepreneurs, managers, policymakers,
    consumers, and others. Questions can be assigned as homework or for in-class discussion.


    ## Talk About It


    1- The companies and their employees are in the spotlight of social media. If
    one owner faces consequences for mistakes made by others, should they take personal
    responsibility to avoid ethical lapses? How important are ethics in management?

    2. Sharing benefits with stakeholders can be a daunting task, especially for small
    businesses. How can they balance satisfying the most important needs? What are
    the benefits of considering the global economy?

    3. Pros of the circular economy that is the only responsible way forward for the
    global economy? Can the world think more toward conscious fashion? Select a company
    that has taken this step. What specific things might help improve its quality?


    - Ethical Challenges allow students to assume the role of a manager, government
    official, or other individual and consider how they would react to an ethical
    dilemma that is presented.

    - Practicing National Management cases allow students to analyze and resolve real-world
    companies, situations, and problems that are presented in each chapter.


    ## Teaming Up


    ![](img/b8206e554dbab0f7580dea1e1241bcc4_25_0.png)


    ## Just-in-Time Plus in Crisis


    Toyota Motor is one of the world''s most-known automotive manufacturers. In 2011,
    a massive earthquake and tsunami in Japan caused an accident that disrupted the
    company''s production structure. Toyota''s production system is known to be based
    on just-in-time (JIT) manufacturing.


    Toyota first began cars in 1937. In the mid-1970s, they developed a production
    system that allowed them to manufacture large varieties with minimal inventory.
    They called this system just-in-time (JIT) manufacturing. This system has been
    adopted by many other companies (not just those in the automotive industry).


    Imagine that you and your classmates are the C-suite executive, chief information
    officer, or a manager who makes decisions in a crisis.


    You are the newly hired CEO of a company that contracts with global customers.
    You are being asked to explain how you will handle the situation. From your location,
    how can you find flexibility of hot spots, health, and mentality? What are the
    potential effects of pressure, and depression-related stress disorder?


    Toyota''s just-in-time approach minimizes flexibility because it relies on a small
    number of suppliers. Toyota''s system is based on groups of suppliers who work
    closely together. When a crisis hits one group of suppliers, the entire production
    system can be affected.


    The 2011 earthquake and tsunami disrupted the production lines of many companies.
    Toyota was helped because it had alternative suppliers for 30,000 parts that were
    not located in the disaster area. What are the alternative suppliers for components
    that are necessary in this situation?


    The 2011 earthquake and tsunami did not affect the production lines of many companies
    because they did not have alternative suppliers for their needed components. How
    would you manage your supply chain to ensure that you are not affected in the
    future?


    ## Ethical Challenge


    1- Globalization and cross-cultural business bring opportunities and challenges
    from today. Why is it important to focus on social issues and build a business
    with responsibility?

    2. Corporate social responsibility. How can a company integrate its social responsibility
    through its strategy?


    ## Writing Assignments


    In early 2021, Tesla opened a new gigafactory in Germany. This indicates a move
    toward more global production. Why would a company invest money in places like
    Europe, Japan, or China?


    Tesla is the leading manufacturer of electric vehicles. How does Tesla face different
    challenges than traditional automakers? What are the advantages and disadvantages
    of using electric cars?


    ## Developing Employability Skills


    Some students enrolled in this course are majoring in international business or
    a related area. Other students are not business majors and are taking this course
    to gain insight into how businesses operate in the global economy today. Regardless
    of the field of study, this course helps students develop useful capabilities
    we call employability skills.


    - **Knowledge application and analysis** refers to one''s ability to learn and
    appropriately apply knowledge in another setting to achieve a higher level of
    understanding. Business innovation is an underlying theme of this text. Students
    will discover that application of knowledge is key to innovation—experimenting,
    learning, applying, and evaluating. They will learn how innovation, or a lack
    of, influences a company''s success or failure. Students apply these skills in
    various projects, including the market entry strategy project that is included
    with the Digital version of this text.

    - **Reflective (critical)** thinking involves purpose and goal-directed thinking
    to define and solve problems, make decisions, or form judgments related to a set
    of circumstances. For example, this asks students to use critical thinking to
    examine how a country develops its political, economic, and legal systems into
    a complex arrangement. Students also use their reflective or critical thinking
    to formulate answers to many exercises in the text. Others ask students to develop
    their analytical thinking, which involves drawing a conclusion from a pattern
    of facts.

    - **Communication skills** involve the use of oral, written, and nonverbal language,
    with technology to communicate effectively and to listen intently. This teaches
    that articulating one''s thoughts and ideas in another language and culture should
    be careful not to offend values and beliefs of others. Journaling prompts and
    other exercises ask students to craft appropriate responses to specific situations
    in which they place themselves. Other assignments require students to communicate
    effectively with others in shared writing exercises, team, and debates.

    - **Ethical understanding and social responsibility** are sets of guiding principles
    that influence the individuals and organizations within society. Students will
    encounter scenarios of professional ethics and reasoning throughout this text.
    They will read how managers made ethical decisions under specific circumstances
    and how they fared. And ethics exercises ask students to put themselves in a manager''s
    position and decide how to handle an ethical dilemma.


