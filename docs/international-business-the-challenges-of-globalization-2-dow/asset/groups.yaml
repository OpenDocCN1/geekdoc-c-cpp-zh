    国家文化是一个关于人们价值观、习俗、信仰和交流的故事。全球化的反对者认为，它同化了世界并破坏了文化的丰富性。在他们看来，在我们即将进入的新世界里，我们将穿从同一个品牌商店购买的相同衣服，在同一个品牌餐厅吃同样的食物，观看同一家电影公司制作的电影。这种责任被完全归咎于生产消费品的最大的美国跨国公司。


    支持者认为，全球化使我们所有人都能从不同的处境和贸易中获益。贸易允许国家专门提供它们能够最高效率提供的商品和服务。然后，各国通过相互贸易来获得他们渴望但无法生产的商品和服务。事实上，台湾仍然生产世界上许多半导体，南非产出大部分钻石，德国继续生产世界上工程水平最高的汽车。其他国家通过与这些国家进行商品和服务贸易，来享受他们没有或生产的半导体、钻石和汽车。要了解更多关于全球化与文化之间的相互作用，请参见见解专栏“文化争论”。


