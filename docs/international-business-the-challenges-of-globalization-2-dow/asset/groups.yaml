    ## 危机中的准时制加（（JIT Plus）


    丰田汽车是世界上最著名的汽车制造商之一。2011年，日本的一场大地震和海啸导致了一场中断该公司生产结构的事故。众，丰田的生产系统以基于准时制（JIT）制造而闻名。


    丰田于1937年开始生产汽车。在20世纪70年代中期，他们开发了一种生产系统，允许他们以最小的库存生产多样化的产品。他们将这一系统称为准时制（JIT）制造。该系统已被许多其他公司（不仅是汽车行业的公司）采用。


    想象你和你的同学是危机中做出决策的高层高管、首席信息官或经理。


    你是一家新入职的公司的首席执行官，公司与全球客户签约。你被要求解释你将如何处理这种情况。从你的位置来看，你如何找到热点、健康和心态的灵活性？压力以及抑郁相关应激障碍的潜在影响是什么？


    丰田的准时制方法减少了灵活性，因为它依赖于少数供应商。丰田的系统基于紧密合作的供应商群体。当危机袭击某一组供应商时，整个生产系统都可能受到影响。


    2011年的地震和海啸中断了许多公司的生产线。丰田之所以获得帮助，是因为它拥有30,00个零件的替代供应商，而这些供应商并不位于灾区。在这种情况下，必需组件的替代供应商有哪些？


    2011年的地震和海啸没有影响许多公司的生产线，因为他们没有所需组件的替代供应商。你将如何管理你的供应链，以确保你未来不受影响？


    ## 伦理挑战


    1- 全球化和跨文化业务为今天带来了机遇与挑战。为什么关注社会问题并建立有责任的业务是重要的？

    2. 企业社会责任。公司如何通过其战略整合其社会责任？


    ## 写作作业


    2021年初，丰田在德国开设了一家新的工厂。这家全球领先的汽车制造商与传统制造商面临不同的挑战？电动汽车的优缺点是什么？


    ## 开发就业能力


    就读本课程的一些学生是国际业务或相关专业的。本课程帮助学生培养实用的能力。


    - **知识的应用与分析**指的是个人在特定环境中学习和应用知识的能力。我们将这些能力称为就业能力。学生将发现创新如何影响公司的成功。

    - **反思性思维（批判性思维）**涉及有目标导向的思考，以定义和解决问题、做出决策或形成判断。例如，这要求学生使用批判性思维来检查复杂的安排。

    - **沟通技能**涉及使用口头、书面和非语言语言以及技术进行有效沟通和倾听。这教导在另一种语言和文化中表达自己的思想和观点时应注意冒犯他人的价值观和信仰。

    - **伦理理解和社会责任**是影响社会个人和组织的指导原则。学生将在本书书中遇到职业伦理和推理。他们将阅读经理在特定情况下如何做出伦理决策以及结果如何。伦理练习让学生置身于经理的位置，并决定如何处理伦理困境。其他作业要求学生在共享写作练习、团队和辩论中与他人有效沟通。


    ## 教师教学资源


    更多信息和资源，请访问 www.pearson.com。


    ## 致谢


    我们感谢在准备《国际业务：全球化的挑战》第十版期间许多教师、专业人士和学生提供的鼓励和建议。我们特别感谢对本版及之前的版本提供宝贵反馈的教师：


