    # Apple’s Global Impact


    CERTINO, California—The Apple iPhone was the world’s first-ever smartphone and
    gave people mobile computing power they never had before. The business models
    of Uber and Lyft are entirely based on smartphone technology. Companies like TikTok
    and applications like WhatsApp owe their success to the popularity of smartphones.
    Steve Jobs explained that the “i” in iPhone refers mainly to the internet but
    also stands for *individual, instruct, inform, and inspire.*


    Apple earns around 80 percent of its revenue outside the United States. Globalization
    benefits Apple enormously and is at the core of its strategy. Globalization production
    allows Apple to source parts and components worldwide and assemble devices wherever
    it is most cost effective. Apple’s hundreds of suppliers are based in as many
    as 50 countries depending on the device produced. And globalization means that
    Apple can sell its products worldwide with little or no modification.


    Despite the opportunities that globalization provides Apple and other companies,
    there are challenges. Cultural, political, and economic tensions can trigger rising
    nationalism. A US–China trade war caused backlash against US imports to China
    and hurt Apple’s iPhone sales. Lower-priced Chinese competitors improved their
    smartphones and took market share from Apple. As you read this chapter, consider
    how many aspects of globalization impact the activities of international companies
    everywhere.


    ![](img/b8206e554dbab0f7580dea1e1241bcc4_31_0.png)


    # GLOBAL BUSINESS ENVIRONMENT


    Every day, of its experiences the fruits of international business transactions
    as we go about our routines. You awaken and turn off the alarm from your Apple
    iPhone, which was designed in the United States and assembled in China with parts
    from Japan, South Korea, Taiwan, and other places. You pop in your AirPods and
    listen to a quick breakfast produced by BBC''s radio. You slip on your Calvin
    Klein T-shirt and jeans made in India and jump into your Vans that were made in
    Vietnam. You head out and into your Korean Hyundai that was made in Alabama. You
    drive the drive-thru to the Starbucks for a latte made from beans harvested in
    Colombia and Ethiopia. Your day is just one hour old, but in a way, you''ve already
    taken a trip around the world. With a quick glance at the ''Market'' on your way
    back, you have with right now to demonstrate the prowess of international business
    transactions. How each of these products were designed and how each became available
    for you to purchase is a result of international business transactions.


    ## international business


    Commercial transaction that crosses the borders of two or more nations.


    International business is commercial transaction that crosses the borders of two
    or more nations. You don''t have to look far to find evidence of international
    business. Each of us lives involves it in ways we don''t often define. No matter
    where you live, you''re surrounded by imports—goods and services purchased abroad
    and spend some of your day using nation''s exports—goods and services sold abroad
    out of your country. Every year, the world export grows around $19 trillion and
    export services worth nearly $6 trillion. To put it in perspective, this figure
    for merchandise exports is 36 times the global average.


    ## imports


    Goods and services purchased abroad into a country.


    ## exports


    Goods and services sold out of a country.


    This book describes the work and responsibilities of managers in an international
    business. It covers an extraordinarily wide range of topics that influence international
    business. We begin this with an overview of the subject and an introduction to
    the key players in international business. Next we discuss globalization''s powerful
    influence on markets and production and explain the forces behind this expansion.
    Next, we cover each main point in the debate about globalization, including wages,
    income inequality, and more we explain how this will help you develop employability
    skills, such as application of knowledge, reflective thinking, communication,
    and ethics. Finally, we explain why international business is special by presenting
    an integrated model of the global business environment.


    # 1.1 Introduction and Key Players


    ### 1.1 Identify the types of companies in international business.


    International business is rooted in the cultural, political, economic, and legal
    realities of nations. The study of international business involves learning government
    policies, company activities, the workers, managers, and the social lives of ordinary
    people, and a host of social issues. People are at the center of each of these
    topics and what makes international business a dynamic and thrilling journey of
    discovery.


    There are periods of international cooperation among nations and periods of conflict.
