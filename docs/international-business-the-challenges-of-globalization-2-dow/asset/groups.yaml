    多年来，具有远见的企业一直遵循“减少、重复利用、回收”的格号。其理念是减少资源的使用和浪费，使资源的使用寿命超过一个周期，并回收无法减少或重复的资源。最投入的经理和公司在此基础上增加了“重新设计和回收”，以促进可持续发展。这意味着为了可持续性重新设计产品和流程，并重新构想产品的设计和使用方式以减少对环境的影响。我们将在后续章节的很大一部分专门讨论可持续性。


