    ## 1.1.1 Key Players in International Business


    Companies of all types and sizes and in all sorts of industries involved in international
    business although they vary in the extent of their involvement. A small shop owner
    might only import supplies from abroad, whereas a large company might have dozens
    of factories and stores worldwide. Large companies from the highest-income nations
    still compete vigorously for the global market share. Firms from emerging markets
    (such as Brazil, China, and India) now compete increasingly actively in international
    business, largely because of advances in technology.


    A multinational corporation (MNC) is a business that has direct investments (in
    the form of manufacturing or marketing subsidiaries) abroad in multiple countries.
    A company that invests directly in foreign direct investment—the purchase of physical
    assets or a significant amount of the ownership of a company in another country
    to gain a measure of control. In importing and exporting, it is the third main
    way companies engage in international business.


    Multinationals generate significant jobs, investment, and tax for the regions
    and nations they enter. They leave thousands of people out of work when they close
    scale. Mergers and acquisitions between multinationals are common worth billions
    of dollars annually and involves companies based in emerging markets.


    Some companies have more employees than the number of people living in small countries
    and islands. Walmart, for example, has 2.3 million employees. We see the enormous
    economic clout of multinational corporations when we compare the revenues of the
    Global 500 with the value of goods and services that countries generate. Figure
