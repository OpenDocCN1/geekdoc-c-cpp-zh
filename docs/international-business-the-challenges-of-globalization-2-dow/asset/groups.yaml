    # Chapter 1: Summary


    +   LO 1.1 Identify the types of company activity in international business.

    * Most international business is a commercial transaction that crosses the borders
    of two or more nations.

    * Most international business is conducted by large multinational corporations
    (MNCs), which have great economic muscle and deals often with billions of dollars.

    * Born firms adopt a global perspective and international business from inception.
    They tend to have innovative cultures, knowledge-based capabilities, and could
    provide competitive advantage.

    LO 1.2 Explain globalization and the significance of global markets and production.

    * Globalization is the trend toward greater economic, cultural, political, and
    technological integration through phases of expansion and contraction, with nations
    trading approximately 60 percent of their output.

    * The globalization of markets helps companies (1) reduce costs by standardizing
    marketing activities, (2) explore international markets if the home market is
    small or saturated, and (3) level income streams.

    * The globalization of production helps companies (1) access low-cost labor and
    become more competitive, (2) access technical know-how, and (3) access natural
    resources or not too expensive at home.'
