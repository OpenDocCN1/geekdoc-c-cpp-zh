    Companies use IoT in many ways. Rolls-Royce airplane contains sensors that transmit
    information on the engine''s status in real time. The sensors send information
    to the company, which analyzes the data for signs of wear or other issues. This
    increases flight safety for crew and passengers and can extend an engine''s life.
    Rolls-Royce also use the data to de-schedule maintenance for any issues the sensors
    detect. This proactive strategy increases safety and efficiency and prevents costly
    downtime internal for unexpected engine repairs.


    # INTRANETS AND INTERNETWORKS


    An internets gives employees access to company data using personal credentials
    regardless of where they are located. The objective of an intranet is to facilitate
    communication, cooperation, and collaboration in a virtual space inside an organization.
    An intranet acts like a company''s private network. Behind the company firewall
    are digital tools, resources, and other files within the secure confines of the
    organization''s internal network. Project management, marketing strategy, production,
    and every area of business benefits from the efficiencies that internets offer.


    An effective marketing tool to Volvo Car''s intranet is a quarter-by-quarter data-based
    marketing and sales information. The cycle begins when headquarters submits its
    copy-rate-wide marketing plan to Volvo''s intranet. Marketing managers at each
    subsidiary select those options to apply to their own market, develop their plan,
    and submit it to the database. This allows managers to view every other subsidiary''s
    marketing plan and adapt aspects to their own plan. In essence, the entire system
    acts as a tool for sharing of best practices across all of Volvo''s markets.


    An extranet is similar to an intranet but extends access to specific parties outside
    an organization. For example, an extranet can give access to a company''s network
    automatically. An extranet is firewalled from unrelated areas of the firm''s internal
    business network and the public internet. To access the extranet provided through
    a virtual private network (VPN) portal. An extranet allows an international company
    to respond more quickly and internally and externally.


    # 1.3.3 Digital Transformation


    Another key of technological innovation involves the changeover from older, analog
    processes to digital ones. The process of converting analog to digital for use
    by computers and other technologies is called digitization. Businesses digitize
    their data and information to optimize business processes for efficiency gains
    and cost savings. Digitization is a necessary step before businesses can undertake
    subsequent, higher-order technology processes.


    # digitization


    Process of changing information from analog to digital for use by computers and
    other information technologies.


    # CHAPTER 1 • GLOBALIZATION TODAY 19


    Digitalization is the use of data and technology to develop a digital platform
    for business operations, strategies, or business models. Digitalization directly
    affects how people do their work. Businesses used to communicate internally and
    externally using methods, such as landline telephones and couriers or mailed letters,
    whereas they now communicate through digital tools, including email, social media,
    chat, and so on.


    Use of data and technology to develop new business operations, strategies, or
    models.


    Companies can engage in a series of digital transformation projects. For example,
    a firm could install a robust network to take orders, bills, and order from suppliers.
    Later, it might train employees on how to use new features on the network that
    will assist members who are collaborating on projects.


    Digital transformation is the change in which digital technologies penetrate all
    areas of operations, strategy, and culture to create customer-focused advantage.


    Fundamental change in which digital technologies penetrate all areas of operations,
    strategy, and culture to produce customer-focused advantage.


    It is a far deeper water than digitalization although it can involve the completion
    of many separate digitalization projects. The changes required to digitally transform
    a company can be time-consuming and arduous, but could be vital to the firm''s
    survival. This is why businesses often fail when doing digital transformation
    unless they are faced with fierce competition and increased value for all stakeholders
    and business and a long-term competitive.


    Digital transformation is a foundational change in delivering value to customers.
    And apparel retailer, Lulu, recognized the importance of change and made moving
    with the market imperative in their digital strategy. The company launched international
    websites and mobile applications to provide flexibility for customers who shop
    online. The move resulted in increased sales.


    Global toy and game company, Hasbro, changed its marketing strategy to target
    parents and used in-house data to reconstruct toy games for the children. It created
    targeted campaigns on social media and other channels. Hasbro''s digital strategy
