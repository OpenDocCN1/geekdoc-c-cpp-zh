    Here are some helpful tips for a manager leading meetings in:


    - Familiarity: Avoid the temptation to get too familiar quickly. Use titles such
    as "Doctor" or "Mr./Ms." unless you are invited to do.

    - Personal Space: Consider what distances are considered appropriate in your culture.
    Some people give the physical gap between a man and woman.

    - Business Cards: In Asia, business cards are typically exchanged instead of a
    bow, with two hands. In some places, leave the card on the table for later. Avoid
    writing on it when you meet


    # GLOBAL MANAGER Flexibility


    Here are some tips for adjusting to the style of:


