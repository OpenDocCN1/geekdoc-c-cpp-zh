    # CHAPTER 1 • GLOBALIZATION TODAY


    ![](img/b8206e554dbab0f7580dea1e1241bcc4_39_0.png)


    Netflix, is just two companies that sell global products—marked in all countries
    essentially without any changes. The Apple iPad also a quality product because
    of its highly standardized features and Apple’s global marketing strategy and
    globally recognized brand.


    Global markets, products and competition characterize many industries today, including
    music streaming (Spotify, Pandora), microprocessors (AMD, Intel), aircraft (Airbus,
    Boeing), construction equipment (Caterpillar, Mitsubishi), online retail (Amazon,
    Rakuten), airlines (Toyota, Ford), financial services (Cisco, HSBC), business
    consulting (Deloitte, Accenture), and consumer goods (Procter & Gamble, Unilever).
    The globalization of markets is important to international business because of
    the benefits it offers companies.


    **REDUCES MARKETING COSTS** Companies selling a global product, such as shampoo,
    medicine, or snacks, use a global product for the global market and then simply
    design packaging to account for the language in each market. Companies can achieve
    cost savings by keeping an online advertising campaign’s visual component for
    all markets by translating and writing components into local languages.


    **NEW MARKET OPPORTUNITIES** A company that sells a global product can explore
