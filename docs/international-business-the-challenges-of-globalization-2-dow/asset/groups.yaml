    # PRACTICING INTERNATIONAL MANAGEMENT CASE


    # Apple''s Global Strategy


    Steve Jobs, Steve Wozniak, and Wayne R founded Apple in 1976 in Cupertino, California,
    with Wozniak designing and hand-building the first computer. Apple later introduced
    the Macintosh in 1984. As we read the profile of Apple at its start, it is one
    of the world''s most successful companies, with extremely loyal customers.


    Apple''s revenue in 2024 was around $50 billion which is generated in the US market.
    Other markets include Europe ($569 billion), China ($40 billion), Japan ($21 billion),
    and the Asia Pacific ($230 billion). Although $138 billion comes from iPhone sales,
    $54 billion from services, Macs ($29 billion), iPad ($74 billion), Apple Watches,
    Apple News+, and Fitness+. Around $31 billion is generated by wearables, Apple
    Watch, AirPods, HotPod, and HomePod.


    A theory in international business says that country should produce products they
    have comparative advantage to do so, and then trade with others for things that
    they do not. For Apple and the United States, this means they produce products
    that require labor-intensive parts and assembly (like electronics) and export
    high-value added products (like the iPhone).


    Globalization helped Apple grow quickly and its business model depends heavily
    on parts. Apple''s components come from a global manufacturing network of from
    50 countries, depending on where labor costs are lowest and where can hire workers.
    Apple subassembles parts to wherever is cheapest. Through Taiwanese manufacturer,
    Foxconn, Apple produces thousands of devices daily at its factory in Zhengzhou
    in China. Foxconn built high-tech facilities for 400,000 workers and a $10 billion
    company. Apple could not find of such scale and this level of cooperation anywhere
    else in the world.


    Apple''s production strategy relies heavily on labor. Labor costs are lower in
    China by about 90 percent compared to iPhone''s total cost. The greatest cost
    is incurred in California, where Apple produces design, engineering, and marketing
    tasks. Another reason is that Apple produces in China where some of components
    are located and parts can be bought cheaply. China income is important. Apple
    also depends on China. Sales revenue in China grew from $2.8 billion in 2010 to
    $59 billion in 2015, then fell to around $40 billion in 2020.


    Apple''s dependence on China as the cornerstone of its strategy has advantages
    but also drawbacks. First, as factory work flooded into China, demand for labor
    grew and its cost rose. Apple responded by moving some assembly to Vietnam and
    other nations


    nations with lower labor costs. Some businesspeople and politicians in the United
    States began referring to China as a “strategic competitor.”-China tensions grew
    and the two superpowers were in a trade war. The US government then sanctioned
    on Apple''s competitor, Huawei.


    Third, US-China relations suffered further after the political arrival in 2020.
    Nationalist sentiment increased in both countries. The US government encouraged
    a “chain restructuring” initiative, or “decoupling,” of the US and China economies.
    Financial institutions are told not to subcontract to China for several reasons,
    including allegations of human rights violations, concerns over conditions at
    Apple subcontracts, and security of the internet. Apple''s app store for China
    once even removed its native-apps, which had allowed Chinese internet users to
    bypass China''s uncensored internet.


    Apple responded to all these by moving some iPhone production to Vietnam and India,
    and moved some speaker, earphones assembly to Malaysia. Having China as a production
    base is not, at least not, but is undisputed production advantage away from a
    single country. Southeast Asia is where it plans to expand production for many
    products.


    When the government sanctioned Huawei, a host of Chinese smartphones marketed
    to consumers a non-brand phone. Device makers Xiaomi, Oppo, and Vivo quickly improved
    their devices and cameras and went head-to-head with Apple with lower-priced phones.
    The trio saw three-double-digit growth and each now commands around 20 percent
    of China''s smartphone market.


    # Thinking Globally


    +   1-1. Why Apple produce parts and components that are made outside of the US
    and subcontract assembly to China and others?


    +   1-2. Why did the iPhone lose market share in China? What specific actions,
    if any, do you think Apple have taken with regard to its presence in China to
    favor the loss of market share?


    +   1-3. As a top executive at Apple, how do'' you personally feel about doing
    business in China, which appears to have large differences with how business is
    done in the United States?


    +   1-4. Based on your feelings in the previous question about doing business
    in China, do you recommend that Apple make any changes in its strategy going forward?
    Explain your answer.'
